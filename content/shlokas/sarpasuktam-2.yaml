id: sarpasuktam-2
category: sukta
name:
  english: sarpasuktam 2
  devanagari: सर्पसूक्तम् २
content:
  english: sarpasuktam 2 brahmalokeshu ye sarpah sheshanaga parogamah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 1|| indralokeshu ye sarpa vasuki pramukhadayah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 2|| kadraveyashca ye sarpah matribhaktiparayanah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 3|| indralokeshu ye sarpah takshakah pramukhadayah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 4|| satyalokeshu ye sarpa vasukina ca rakshitah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 5|| malaye caiva ye sarpah karkotaka pramukhadayah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 6|| prithivyam caiva ye sarpa ye saketa vasitah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 7|| sarvagrameshu ye sarpa vasantishu sancchitah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 8|| grame va yadi va'ranye ye sarpah pracaranti ca | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 9|| samudratire ye sarpa ye sarpa jalavasinah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 10|| rasataleshu ye sarpa anantadi mahabalah | namo'stu tebhyah sarpebhyah suprito
    mama sarvada || 11|| iti sarpasuktam sampurnam |
  devanagari: सर्पसूक्तम् २ ब्रह्मलोकेषु ये सर्पाः शेषनाग परोगमाः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो
    मम सर्वदा ॥ १॥ इन्द्रलोकेषु ये सर्पा वासुकि प्रमुखादयः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा
    ॥ २॥ कद्रवेयश्च ये सर्पाः मातृभक्तिपरायणाः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ३॥ इन्द्रलोकेषु
    ये सर्पाः तक्षकाः प्रमुखादयः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ४॥ सत्यलोकेषु ये सर्पा
    वासुकीना च रक्षिताः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ५॥ मलये चैव ये सर्पाः कर्कोटक
    प्रमुखादयः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ६॥ पृथिव्यां चैव ये सर्पा ये साकेत वासिताः
    । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ७॥ सर्वग्रामेषु ये सर्पा वसन्तिषु सञ्च्छिताः । नमोऽस्तु
    तेभ्यः सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ८॥ ग्रामे वा यदि वाऽरण्ये ये सर्पाः प्रचरन्ति च । नमोऽस्तु तेभ्यः
    सर्पेभ्यः सुप्रीतो मम सर्वदा ॥ ९॥ समुद्रतीरे ये सर्पा ये सर्पा जलवासिनः । नमोऽस्तु तेभ्यः सर्पेभ्यः
    सुप्रीतो मम सर्वदा ॥ १०॥ रसातलेषु ये सर्पा अनन्तादि महाबलाः । नमोऽस्तु तेभ्यः सर्पेभ्यः सुप्रीतो मम
    सर्वदा ॥ ११॥ इति सर्पसूक्तं सम्पूर्णम् ।
