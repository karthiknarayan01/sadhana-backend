id: lakshmi-nitya-puja-vidhanam
category: stotram
name:
  english: Lakshmi Nitya Puja Vidhanam
content:
  english: lakshmi devi pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri gurubhyo
    namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham
    sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam
    candrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala
    mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam
    namah | umamaheshvarabhyam namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam
    namah | shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om
    keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah
    | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya
    namah | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah
    | om pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah |
    om narasimhaya namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah
    | om shrikrishnaya namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam
    dehi putramshca sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam
    karishyami tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu
    bhutapishacah ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta
    ye bhuta bhumisamsthitah | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo
    jyoti raso mbrahma bhurbhuvassuvarom || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara
    prityartham asmakam sahakutumbasya kshema pujam karishye || tadanga kalasharadhanam karishye || kalasharadhanam
    kalashe gandha pushpakshatairabhyarcya | kalashe udakam purayitva | kalashasyopari hastam nidhaya
    | kalashasya mukhe vishnuh kanthe rudrah samashritah | mule tvasya sthito brahma madhye matriganah
    smritah || kukshau tu sagarah sarve saptadvipa vasundhara | rigvedo'tha yajurvedo samavedo hyatharvanah
    || angaishca sahitah sarve kalashambu samashritah || gange ca yamune caiva godavari sarasvati | narmade
    sindhu kaveri jale'smin sannidhim kuru || kaveri tungabhadra ca krishnaveni ca gautami | bhagirathiti
    vikhyatah pancagangah prakirtitah || ayantu devapujartham mama duritakshayakarakah | kalashodakena
    puja dravyani samprokshya atmanam ca samprokshya || shankhapuja shankham candrarka daivatam madhye
    varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim || trailokye yani tirthani vasudevasya
    ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet || om shankhaya namah | om dhavalaya
    namah | om pancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe akshatan samarpayami ||
    ghantanadah agamartham tu devanam gamanartham tu rakshasam | ghantaravam karomyadau devatahvana lanchanam
    || om ghantadevatabhyo namah | sakalopacara pujarthe akshatan samarpayami || shri mahaganapati puja
    o ntva ganapatigm havamahe kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida
    sadanam || sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnarajo ganadhipah
    || dhumaketurganadhyakshah phalacandro gajananah | vakratundah shurpakarno herambah skandapurvajah
    || om shrimahaganapataye namah | dhyayami | avahayami | asanam samarpayami | padyam samarpayami |
    arghyam samarpayami | acamaniyam samarpayami | snanam samarpayami | vastram samarpayami | yajnopavitam
    samarpayami | gandham samarpayami | pushpani samarpayami | dhupamaghrapayami | dipam darshayami |
    naivedyam samarpayami | tambulam samarpayami | nirajanam samarpayami | mantrapushpam samarpayami |
    pradakshina namaskaran samarpayami || shodashopacara puja lakshmi devi dhyanam ya sa padmasanastha
    vipulakatitati padmapatrayatakshi | gambhiravartanabhih stanabhara namita shubhra vastrottariya ||
    lakshmirdivyairgajendrairmanigana khacitaih snapita hemakumbhaih | nityam sa padmahasta mama vasatu
    grihe sarvamangalyayukta || lakshmim kshirasamudrarajatanayam shrirangadhameshvarim | dasibhutasamastadeva
    vanitam lokaika dipankuram || shrimanmandakatakshalabdha vibhava brahmendragangadharam | tvam trailokya
    kutumbinim sarasijam vande mukundapriyam || om || hiranyavarnam harinim suvarnarajatasrajam | candram
    hiranmayim njatavedo mamavaha || om shrimahalakshmyai namah | dhyayami | dhyanam samarpayami || avahanam
    ta mma avaha jatavedo lakshmimanapagamini m | yasyam hiranyam mpurushanaham || sahasradalapadmastham
    svastham ca sumanoharam | shantam ca shrihareh kantam tam bhaje jagatam prasum || om shrimahalakshmyai
    namah | avahayami | sthapayami | pujayami || asanam amulyaratnakhacitam nirmitam vishvakarmana | asanam
    ca vicitram ca mahalakshmi pragrihyatam || om shrimahalakshmyai namah | asanam samarpayami || padyam
    ashvapurvam rathamadhyam hastinada prabodhinim | shriyam devimupahvaye shrirma devirjushatam || pushpacandanadurvadi
    samyutam jahnavijalam | shankhagarbhasthitam shuddham grihyatam padmavasini || om shrimahalakshmyai
    namah | padayoh padyam samarpayami || arghyam gandha pushpakshatairyuktam arghyam sampaditam maya
    | grihana tvam mahalakshmi prasanna bhava sarvada || om shrimahalakshmyai namah | hastayoh arghyam
    samarpayami || acamaniyam punyatirthodakam caiva vishuddham shuddhidam sada | grihyatam krishnakante
    tvam ramyamacamaniyakam || om shrimahalakshmyai namah | mukhe acamaniyam samarpayami || snanam apo
    hishtha mayobhuvasta na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha
    nah | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah ||
    om shrimahalakshmyai namah | shuddhodaka snanam samarpayami || snananantaram acamaniyam samarpayami
    || vastram upaitu ma ndevasakhah kirtishca manina saha | pradurbhuto 'smin kirtimriddhi ndadatu me
    || dehasaumdaryabijam ca sada shobha vivardhanam | karpasajam ca krimijam vasanam devi grihyatam ||
    om shrimahalakshmyai namah | vastram samarpayami || yajnopavitam yajnopavitam paramam pavitram prajapateryatsahajam
    purastat | ayushyamagryam pratimunca shubhram yajnopavitam balamastu tejah || om shrimahalakshmyai
    namah | yajnopavitam samarpayami || gandham gandhadvara m | ishvarigm sarvabhutana ntamihopahvaye
    shriyam || malayacalasambhutam vrikshasaram manoharam | sugandhiyuktam sukhadam candanam devi grihyatam
    || om shrimahalakshmyai namah | gandham samarpayami || arcana akshatan dhavalan divyan pushpani ca
    sugandhini | bhaktya dattani grihyantam sarvadevah prasidata || anga puja om capalayai namah padau
    pujayami | om cancalayai namah januni pujayami | om kamalayai namah katim pujayami | om katyayanyai
    namah nabhim pujayami | om jaganmatre namah jatharam pujayami | om vishvavallabhayai namah vakshahsthalam
    pujayami | om kamalavasinyai namah netratrayam pujayami | om shriyai namah shirah pujayami | om mahalakshmyai
    namah sarvanyangani pujayami || shri mahalakshmi ashtottara shata namavali athava lakshmi namavali
    pathanam || om shrimahalakshmyai namah | ashtottara shata namavali pujam samarpayami | akshatan pushpani
    ca samarpayami || dhupam apah srijantu snigdhani ciklita vasa me grihe | ni ca devi va~saya me kule
    || vrikshaniryasarupam ca gandhadravyadi samyutam | krishnakante pavitro vai dhupo'yam pratigrihyatam
    || om shrimahalakshmyai namah | dhupamaghrapayami || dipam ardra mpushtim pingala mpadmamalinim |
    candram hiranmayim njatavedo mamavaha || jagaccakshuh svarupam ca dhvanta pradhvamsakaranam | pradipam
    shuddharupam ca grihyatam parameshvari || om shrimahalakshmyai namah | dipam darshayami || naivedyam
    naivedyam grihyatam devi bhaktya sampaditam maya | idam phalam ca paniyam sarvopacara samyutam ||
    o mbhurbhuvassuvah | tatsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva
    ritena parishincami | amritamastu | amritopastaranamasi | om pranaya svaha | om apanaya svaha | om
    vyanaya svaha | om udanaya svaha | om samanaya svaha | madhye madhye paniyam samarpayami | amritapidhanamasi
    | uttaraposhanam samarpayami | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam samarpayami
    || om shrimahalakshmyai namah | naivedyam samarpayami || tambulam tambulam ca varam ramyam karpuradi
    suvasitam | jihvajadyacchedakaram tambulam devi grihyatam || om shrimahalakshmyai namah | tambulam
    samarpayami || nirajanam cakshurdam sarvalokanam timirasya nivaranam | artikyam kalpitam bhaktya grihana
    parameshvari || santata shrirastu samasta mangalani bhavantu | nitya shrirastu nityamangalani bhavantu
    || om shrimahalakshmyai namah | nirajanam samarpayami || mantrapushpam o mmahadevyai ca vidmahe vishnupatni
    ca dhimahi | tanno lakshmih pracodaya t || sadbhavapushpanyadaya sahaja premarupine | lokamatre dadamyadya
    pritya sangrihyatam sada || om shrimahalakshmyai namah | mantrapushpam samarpayami || pradakshinam
    yani kani ca papani janmantara kritani ca | tani tani pranashyanti pradakshina pade pade || papo'ham
    papakarma'ham papatma papasambhava | trahi mam kripaya devi sharanagatavatsale || anyatha sharanam
    nasti tvameva sharanam mama | tasmatkarunya bhavena raksha mam parameshvari || om shrimahalakshmyai
    namah | pradakshina namaskaran samarpayami || namaskarah urasa shirasa drishtya manasa vacasa tatha
    | padbhyam karabhyam karnabhyam pranamo'shtanga ucyate || om shrimahalakshmyai namah | namaskaran
    samarpayami || sarvopacarah om shrimahalakshmyai namah | chatram samarpayami | camaram samarpayami
    | gitam shravayami | nrityam darshayami | samasta rajopacaran devopacaran samarpayami || stotra sukta
    pathanam shri suktam kshamaprarthana aparadhasahasrani kriyante'harnisham maya | daso'yamiti mam matva
    kshamasva parameshvari || mantrahinam kriyahinam bhaktihinam mahalakshmi | yatpujitam maya devi paripurnam
    tadastu te || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam
    parasmai narayanayeti samarpayami || anaya dhyana shodashopacara pujaya shrimahalakshmi devi suprita
    suprasanna varada bhavatu || udvasanam om shrimahalakshmyai namah | yathasthanam udvasayami | shobhanarthe
    kshemaya punaragamanaya ca || prasada grahanam akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram
    devata padodakam shubham || shrimahalakshmi devi prasadam shirasa grihnami || om shantih shantih shantih
    || om tatsat brahmarpanamastu ||
  devanagari: लक्ष्मी देवी प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो
    नमः । हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम पूजां करिष्ये ॥ तदङ्ग कलशाराधनं करिष्ये
    ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि हस्तं निधाय । कलशस्य
    मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः स्मृताः ॥ कुक्षौ तु
    सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च सहिताः सर्वे कलशाम्बु
    समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन् सन्निधिं कुरु ॥ कावेरी
    तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः ॥ आयान्तु देवपूजार्थं
    मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य ॥ शङ्खपूजा शङ्खं
    चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम् ॥ त्रैलोक्ये
    यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत् ॥ ॐ शङ्खाय
    नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि ॥ घण्टानादः
    आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ घण्टादेवताभ्यो
    नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां
    उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ सुमुखश्चैकदन्तश्च
    कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः फालचन्द्रो गजाननः । वक्रतुण्डः
    शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । आवाहयामि । आसनं समर्पयामि । पाद्यं
    समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि । वस्त्रं समर्पयामि । यज्ञोपवीतं
    समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि । दीपं दर्शयामि । नैवेद्यं समर्पयामि
    । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ षोडशोपचार पूजा लक्ष्मी देवी ध्यानम् या सा पद्मासनस्था विपुलकटितटी पद्मपत्रायताक्षी । गम्भीरावर्तनाभिः
    स्तनभर नमिता शुभ्र वस्त्रोत्तरीया ॥ लक्ष्मीर्दिव्यैर्गजेन्द्रैर्मणिगण खचितैः स्नापिता हेमकुम्भैः ।
    नित्यं सा पद्महस्ता मम वसतु गृहे सर्वमाङ्गल्ययुक्ता ॥ लक्ष्मीं क्षीरसमुद्रराजतनयां श्रीरङ्गधामेश्वरीम्
    । दासीभूतसमस्तदेव वनितां लोकैक दीपाङ्कुराम् ॥ श्रीमन्मन्दकटाक्षलब्ध विभव ब्रह्मेन्द्रगङ्गाधराम् ।
    त्वां त्रैलोक्य कुटुम्बिनीं सरसिजां वन्दे मुकुन्दप्रियाम् ॥ ओम् ॥ हिर॑ण्यवर्णां॒ हरि॑णीं सु॒वर्ण॑रज॒तस्र॑जाम्
    । च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो म॒माव॑ह ॥ ॐ श्रीमहालक्ष्म्यै नमः । ध्यायामि । ध्यानं समर्पयामि
    ॥ आवाहनम् ता म्म॒ आव॑ह॒ जात॑वेदो ल॒क्ष्मीमन॑पगा॒मिनी म् । यस्यां॒ हिर॑ण्यं म्पुरु॑षान॒हम् ॥ सहस्रदलपद्मस्थां
    स्वस्थां च सुमनोहराम् । शान्तां च श्रीहरेः कान्तां तां भजे जगतां प्रसूम् ॥ ॐ श्रीमहालक्ष्म्यै नमः
    । आवाहयामि । स्थापयामि । पूजयामि ॥ आसनम् अमूल्यरत्नखचितं निर्मितं विश्वकर्मणा । आसनं च विचित्रं च
    महालक्ष्मि प्रगृह्यताम् ॥ ॐ श्रीमहालक्ष्म्यै नमः । आसनं समर्पयामि ॥ पाद्यम् अश्वपूर्वां रथमध्यां हस्तिनाद
    प्रबोधिनीम् । श्रियं देवीमुपह्वये श्रीर्मा देवीर्जुषताम् ॥ पुष्पचन्दनदूर्वादि संयुतं जाह्नवीजलम् ।
    शङ्खगर्भस्थितं शुद्धं गृह्यतां पद्मवासिनि ॥ ॐ श्रीमहालक्ष्म्यै नमः । पादयोः पाद्यं समर्पयामि ॥ अर्घ्यम्
    गन्ध पुष्पाक्षतैर्युक्तं अर्घ्यं सम्पादितं मया । गृहाण त्वं महालक्ष्मि प्रसन्ना भव सर्वदा ॥ ॐ श्रीमहालक्ष्म्यै
    नमः । हस्तयोः अर्घ्यं समर्पयामि ॥ आचमनीयम् पुण्यतीर्थोदकं चैव विशुद्धं शुद्धिदं सदा । गृह्यतां कृष्णकान्ते
    त्वं रम्यमाचमनीयकम् ॥ ॐ श्रीमहालक्ष्म्यै नमः । मुखे आचमनीयं समर्पयामि ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता
    न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥ यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः
    ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥ ॐ श्रीमहालक्ष्म्यै नमः । शुद्धोदक
    स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं समर्पयामि ॥ वस्त्रम् उपै॑तु॒ मा न्दे॑वस॒खः की॒र्तिश्च॒ मणि॑ना
    स॒ह । प्रा॒दु॒र्भू॒तो ऽस्मिन् की॒र्ति॒मृ॑द्धि न्द॒दातु॑ मे ॥ देहसौम्दर्यबीजं च सदा शोभा विवर्धनम्
    । कार्पासजं च कृमिजं वसनं देवि गृह्यताम् ॥ ॐ श्रीमहालक्ष्म्यै नमः । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम्
    यज्ञोपवीतं परमं पवित्रं प्रजापतेर्यत्सहजं पुरस्तात् । आयुष्यमग्र्यं प्रतिमुञ्च शुभ्रं यज्ञोपवीतं बलमस्तु
    तेजः ॥ ॐ श्रीमहालक्ष्म्यै नमः । यज्ञोपवीतं समर्पयामि ॥ गन्धम् ग॒न्ध॒द्वा॒रा म् । ई॒श्वरीग्ं॑ सर्व॑भूता॒ना॒
    न्तामि॒होप॑ह्वये॒ श्रियम् ॥ मलयाचलसम्भूतं वृक्षसारं मनोहरम् । सुगन्धियुक्तं सुखदं चन्दनं देवि गृह्यताम्
    ॥ ॐ श्रीमहालक्ष्म्यै नमः । गन्धं समर्पयामि ॥ अर्चन अक्षतान् धवलान् दिव्यान् पुष्पाणि च सुगन्धीनि ।
    भक्त्या दत्तानि गृह्यन्तां सर्वदेवाः प्रसीदत ॥ अङ्ग पूजा ॐ चपलायै नमः पादौ पूजयामि । ॐ चञ्चलायै नमः
    जानुनी पूजयामि । ॐ कमलायै नमः कटिं पूजयामि । ॐ कात्यायन्यै नमः नाभिं पूजयामि । ॐ जगन्मात्रे नमः जठरं
    पूजयामि । ॐ विश्ववल्लभायै नमः वक्षःस्थलं पूजयामि । ॐ कमलवासिन्यै नमः नेत्रत्रयं पूजयामि । ॐ श्रियै
    नमः शिरः पूजयामि । ॐ महालक्ष्म्यै नमः सर्वाण्यङ्गानि पूजयामि ॥ श्री महालक्ष्मी अष्टोत्तर शत नामावली
    अथवा लक्ष्मी नामावली पठनम् ॥ ॐ श्रीमहालक्ष्म्यै नमः । अष्टोत्तर शत नामावली पूजां समर्पयामि । अक्षतान्
    पुष्पाणि च समर्पयामि ॥ धूपम् आपः॑ सृ॒जन्तु॑ स्नि॒ग्धा॒नि॒ चि॒क्ली॒त व॑स मे॒ गृहे । नि च॑ दे॒वी वाँ॒सय॑
    मे कु॒ले ॥ वृक्षनिर्यासरूपं च गन्धद्रव्यादि संयुतम् । कृष्णकान्ते पवित्रो वै धूपोऽयं प्रतिगृह्यताम्
    ॥ ॐ श्रीमहालक्ष्म्यै नमः । धूपमाघ्रापयामि ॥ दीपम् आ॒र्द्रा म्पु॒ष्टिं॒ पि॒ङ्ग॒ला म्प॑द्ममा॒लिनीम्
    । च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो म॒माव॑ह ॥ जगच्चक्षुः स्वरूपं च ध्वान्त प्रध्वंसकारणम् । प्रदीपं
    शुद्धरूपं च गृह्यतां परमेश्वरि ॥ ॐ श्रीमहालक्ष्म्यै नमः । दीपं दर्शयामि ॥ नैवेद्यम् नैवेद्यं गृह्यतां
    देवि भक्त्या सम्पादितं मया । इदं फलं च पानीयं सर्वोपचार संयुतम् ॥ ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे
    म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो नः॑ प्रचो॒दया त् ॥ सत्यं त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि
    । ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये
    मध्ये पानीयं समर्पयामि । अमृतापिधानमसि । उत्तरापोशनं समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि
    । शुद्धाचमनीयं समर्पयामि ॥ ॐ श्रीमहालक्ष्म्यै नमः । नैवेद्यं समर्पयामि ॥ ताम्बूलम् ताम्बूलं च वरं
    रम्यं कर्पूरादि सुवासितम् । जिह्वाजाड्यच्छेदकरं ताम्बूलं देवि गृह्यताम् ॥ ॐ श्रीमहालक्ष्म्यै नमः ।
    ताम्बूलं समर्पयामि ॥ नीराजनम् चक्षुर्दं सर्वलोकानां तिमिरस्य निवारणम् । आर्तिक्यं कल्पितं भक्त्या
    गृहाण परमेश्वरि ॥ सन्तत श्रीरस्तु समस्त मङ्गलानि भवन्तु । नित्य श्रीरस्तु नित्यमङ्गलानि भवन्तु ॥ ॐ
    श्रीमहालक्ष्म्यै नमः । नीराजनं समर्पयामि ॥ मन्त्रपुष्पम् ओ म्म॒हा॒दे॒व्यै च॑ वि॒द्महे॑ विष्णुप॒त्नी
    च॑ धीमहि । तन्नो॑ लक्ष्मीः प्रचो॒दया त् ॥ सद्भावपुष्पाण्यादाय सहज प्रेमरूपिणे । लोकमात्रे ददाम्यद्य
    प्रीत्या सङ्गृह्यतां सदा ॥ ॐ श्रीमहालक्ष्म्यै नमः । मन्त्रपुष्पं समर्पयामि ॥ प्रदक्षिणम् यानि कानि
    च पापानि जन्मान्तर कृतानि च । तानि तानि प्रणश्यन्ति प्रदक्षिण पदे पदे ॥ पापोऽहं पापकर्माऽहं पापात्मा
    पापसम्भव । त्राहि मां कृपया देवि शरणागतवत्सले ॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । तस्मात्कारुण्य
    भावेन रक्ष मां परमेश्वरि ॥ ॐ श्रीमहालक्ष्म्यै नमः । प्रदक्षिण नमस्कारान् समर्पयामि ॥ नमस्कारः उरसा
    शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्यां कराभ्यां कर्णाभ्यां प्रणामोऽष्टाङ्ग उच्यते ॥ ॐ श्रीमहालक्ष्म्यै
    नमः । नमस्कारान् समर्पयामि ॥ सर्वोपचाराः ॐ श्रीमहालक्ष्म्यै नमः । छत्रं समर्पयामि । चामरं समर्पयामि
    । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त राजोपचारान् देवोपचारान् समर्पयामि ॥ स्तोत्र सूक्त पठनम्
    श्री सूक्तम् क्षमाप्रार्थना अपराधसहस्राणि क्रियन्तेऽहर्निशं मया । दासोऽयमिति मां मत्वा क्षमस्व परमेश्वरि
    ॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं महालक्ष्मि । यत्पूजितं मया देवि परिपूर्णं तदस्तु ते ॥ कायेन वाचा
    मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि
    ॥ अनया ध्यान षोडशोपचार पूजया श्रीमहालक्ष्मी देवी सुप्रीता सुप्रसन्ना वरदा भवतु ॥ उद्वासनम् ॐ श्रीमहालक्ष्म्यै
    नमः । यथास्थानं उद्वासयामि । शोभनार्थे क्षेमाय पुनरागमनाय च ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम्
    । समस्तपापक्षयकरं देवता पादोदकं शुभम् ॥ श्रीमहालक्ष्मी देवी प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ ॐ तत्सत् ब्रह्मार्पणमस्तु ॥
