id: sri-shodasha-bahu-narasimha-ashtakam
category: stotram
name:
  english: Sri Shodasha Bahu Narasimha Ashtakam
content:
  english: bhukhandam varanandam paravaraviratam dampadamporudampam dim dim dim dim didimbam dahamapi
    dahamaih jhampajhampaishcajhampaih | tulyastulyastu tulyah dhumadhumadhumakaih kunkumankaih kumankaih
    etatte purnayuktamaharahakarahah patu mam narasimhah || || bhubhridbhubhridbhujangam pralayaravavaram
    prajvalajjvalamalam kharjarjam kharjadurjam khikhacakhacakhacitkharjadurjarjayantam | bhubhagam bhogabhagam
    gagagagagaganam gardamartyugragandam svaccham puccham svagaccham svajanajananutah patu mam narasimhah
    || || enabhram garjamanam laghulaghumakaro balacandrarkadamshtro hemambhojam sarojam jatajatajatilo
    jadyamanastubhitih | dantanam badhamanam khagatakhagatavo bhojajanussurendro nishpratyuham saraja
    gahagahagahatah patu mam narasimhah || || shankham cakram ca capam parashumashamishum shulapashankushastram
    bibhrantam vajrakhetam halamusalagadakuntamatyugradamshtram | jvalakesham trinetram jvaladanalanibham
    harakeyurabhusham vande pratyekarupam parapadanivasah patu mam narasimhah || || padadvandvam dharitrikativipulataro
    merumadhyudhvamurum nabhim brahmandasindhuh hridayamapi bhavo bhutavidvatsametah | dushcakrankam svabahum
    kulishanakhamukham candrasuryagninetram vaktram vahnissuvidyutsuraganavijayah patu mam narasimhah
    || || nasagram pinagandam parabalamathanam baddhakeyuraharam raudram damshtrakaralam amitagunaganam
    kotisuryagninetram | gambhiryam pingalaksham bhrukutitavimukham shodashadhardhabahum vande bhimattahasam
    tribhuvanavijayah patu mam narasimhah || || ke ke nrisimhashtake naravarasadrisham devabhitvam grihitva
    devandyo vipradandam prativacana payayamyanapratyanaishih | shapam capam ca khadgam prahasitavadanam
    cakracakricakena omitye daityanadam prakacavividusha patu mam narasimhah || || jham jham jham jham
    jhakaram jhashajhashajhashitam janudesham jhakaram hum hum hum hum hakaram harita kahahasa yam dishe
    vam vakaram | vam vam vam vam vakaram vadanadalitatam vamapaksham supaksham lam lam lam lam lakaram
    laghuvanavijayah patu mam narasimhah || || bhutapretapishacayakshaganashah deshantaroccatana coravyadhimahajjvaram
    bhayaharam shatrukshayam nishcayam | sandhyakale japatamashtakamidam sadbhaktipurvadibhih prahladeva
    varo varastu jayita satpujitam bhutaye || || | iti shrivijayindratirtha kritam shri shodashabahu nrisimhashtakam
    |
  devanagari: भूखण्डं वारणाण्डं परवरविरटं डम्पडम्पोरुडम्पं डिं डिं डिं डिं डिडिम्बं दहमपि दहमैः झम्पझम्पैश्चझम्पैः
    । तुल्यास्तुल्यास्तु तुल्याः धुमधुमधुमकैः कुङ्कुमाङ्कैः कुमाङ्कैः एतत्ते पूर्णयुक्तमहरहकरहः पातु मां
    नारसिंहः ॥ ॥ भूभृद्भूभृद्भुजङ्गं प्रलयरववरं प्रज्वलज्ज्वालमालं खर्जर्जं खर्जदुर्जं खिखचखचखचित्खर्जदुर्जर्जयन्तम्
    । भूभागं भोगभागं गगगगगगनं गर्दमर्त्युग्रगण्डं स्वच्छं पुच्छं स्वगच्छं स्वजनजननुतः पातु मां नारसिंहः
    ॥ ॥ एनाभ्रं गर्जमानं लघुलघुमकरो बालचन्द्रार्कदंष्ट्रो हेमाम्भोजं सरोजं जटजटजटिलो जाड्यमानस्तुभीतिः
    । दन्तानां बाधमानां खगटखगटवो भोजजानुस्सुरेन्द्रो निष्प्रत्यूहं सराजा गहगहगहतः पातु मां नारसिंहः ॥
    ॥ शङ्खं चक्रं च चापं परशुमशमिषुं शूलपाशाङ्कुशास्त्रं बिभ्रन्तं वज्रखेटं हलमुसलगदाकुन्तमत्युग्रदंष्ट्रम्
    । ज्वालाकेशं त्रिनेत्रं ज्वलदनलनिभं हारकेयूरभूषं वन्दे प्रत्येकरूपं परपदनिवसः पातु मां नारसिंहः ॥
    ॥ पादद्वन्द्वं धरित्रीकटिविपुलतरो मेरुमध्यूढ्वमूरुं नाभिं ब्रह्माण्डसिन्धुः हृदयमपि भवो भूतविद्वत्समेतः
    । दुश्चक्राङ्कं स्वबाहुं कुलिशनखमुखं चन्द्रसूर्याग्निनेत्रं वक्त्रं वह्निस्सुविद्युत्सुरगणविजयः पातु
    मां नारसिंहः ॥ ॥ नासाग्रं पीनगण्डं परबलमथनं बद्धकेयूरहारं रौद्रं दंष्ट्राकरालं अमितगुणगणं कोटिसूर्याग्निनेत्रम्
    । गाम्भीर्यं पिङ्गलाक्षं भ्रुकुटितविमुखं षोडशाधार्धबाहुं वन्दे भीमाट्टहासं त्रिभुवनविजयः पातु मां
    नारसिंहः ॥ ॥ के के नृसिंहाष्टके नरवरसदृशं देवभीत्वं गृहीत्वा देवन्द्यो विप्रदण्डं प्रतिवचन पयायाम्यनप्रत्यनैषीः
    । शापं चापं च खड्गं प्रहसितवदनं चक्रचक्रीचकेन ओमित्ये दैत्यनादं प्रकचविविदुषा पातु मां नारसिंहः ॥
    ॥ झं झं झं झं झकारं झषझषझषितं जानुदेशं झकारं हुं हुं हुं हुं हकारं हरित कहहसा यं दिशे वं वकारम् ।
    वं वं वं वं वकारं वदनदलिततं वामपक्षं सुपक्षं लं लं लं लं लकारं लघुवणविजयः पातु मां नारसिंहः ॥ ॥ भूतप्रेतपिशाचयक्षगणशः
    देशान्तरोच्चाटना चोरव्याधिमहज्ज्वरं भयहरं शत्रुक्षयं निश्चयम् । सन्ध्याकाले जपतमष्टकमिदं सद्भक्तिपूर्वादिभिः
    प्रह्लादेव वरो वरस्तु जयिता सत्पूजितां भूतये ॥ ॥ । इति श्रीविजयीन्द्रतीर्थ कृतं श्री षोडशबाहु नृसिंहाष्टकम्
    ।
