id: cidambaradigbandhanamalamantrah
category: mantra
name:
  english: cidambaradigbandhanamalamantrah
  devanagari: चिदम्बरदिग्बन्धनमालामन्त्रः
content:
  english: sevitaya kalyaniragapriyaya candrasurya sevitaya lakshmisevitaya samastaganavadyaghoshapriyaya
    shri anandatandaveshvaraya shiva shiva shiva sharanam | shivanandarupaya onkaramandapaya shricidambareshvaraya
    namo namaste | om om om om om shrim hrim aim klim sauh hamsa hamsa hara hara shiva shiva namo namaste
    | yah cidambaramalamantramadhite sa sarvasiddhim labhate | sa sarvasaubhagyam labhate labhata iti
    | hridayadinyasah | bhurbhuvassuvarom iti digvimokah | dhyanam | lamityadi | guhyatiguhya gopta tvam
    grihanasmatkritam japam | siddhirbhavatu me deva tvatprasadanmayi sthira | iti samarpayet | iti shricidambaradigbandhanamalamantrah
    sampurnah |
  devanagari: सेविताय कल्याणीरागप्रियाय चन्द्रसूर्य सेविताय लक्ष्मीसेविताय समस्तगणवाद्यघोषप्रियाय श्री
    आनन्दताण्डवेश्वराय शिव शिव शिव शरणम् । शिवानन्दरूपाय ओङ्कारमण्डपाय श्रीचिदम्बरेश्वराय नमो नमस्ते ।
    ॐ ॐ ॐ ॐ ॐ श्रीं ह्रीं ऐं क्लीं सौः हंस हंस हर हर शिव शिव नमो नमस्ते । यः चिदम्बरमालामन्त्रमधीते स
    सर्वसिद्धिं लभते । स सर्वसौभाग्यं लभते लभत इति । हृदयादिन्यासः । भूर्भुवस्सुवरों इति दिग्विमोकः ।
    ध्यानम् । लमित्यादि । गुह्यातिगुह्य गोप्ता त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देव त्वत्प्रसादान्मयि
    स्थिरा । इति समर्पयेत् । इति श्रीचिदम्बरदिग्बन्धनमालामन्त्रः सम्पूर्णः ।
