id: jayayuktadevisahasranamastotram
category: sahasranama
name:
  english: jayayuktadevisahasranamastotram
  devanagari: जययुक्तदेवीसहस्रनामस्तोत्रम्
content:
  english: jayayukta shridevyashtottarasahasranamastotram || namo devyai jaganmatre shivayai satatam namah
    || jaya durge durgatinashini jaya | jaya ma~ kalavinashini jaya jaya || 1 jayati shailaputri ma~ jaya
    jaya | brahmacarini mata jaya jaya || 2 jayati candraghanta ma~ jaya jaya | jaya kushmanda skandajanani
    jaya || 3 jaya ma~ katyayini jayati jaya | jayati kalaratri ma~ jaya jaya || 4 jayati mahagauri devi
    jaya | jayati siddhidatri ma~ jaya jaya || 5 jaya kali jaya tara jaya jaya | jaya jagajanani shodashi
    jaya jaya || 6 jaya bhuvaneshvari mata jaya jaya | jayati chinnamasta ma~ jaya jaya || 7 jayati bhairavi
    devi jaya jaya | jaya jaya dhumavati jayati jaya || 8 jaya bagala matangi jaya jaya | jayati jayati
    ma~ kamala jaya jaya || 9 jayati mahakali ma~ jaya jaya | jayati mahalakshmi ma~ jaya jaya || 10 jaya
    ma~ mahasarasvati jaya jaya | uma rama brahmani jaya jaya || 11 kaveri varuni jayati jaya | jaya kacchapi
    narasimhi jaya || 12 jaya matsya kaumari jaya jaya | jaya vaishnavi vasavi jaya jaya || 13 jaya madhava
  devanagari: जययुक्त श्रीदेव्यष्टोत्तरसहस्रनामस्तोत्रम् ॥ नमो देव्यै जगन्मात्रे शिवायै सततं नमः ॥ जय
    दुर्गे दुर्गतिनाशिनि जय । जय माँ कालविनाशिनि जय जय ॥ १ जयति शैलपुत्री माँ जय जय । ब्रह्मचारिणी माता
    जय जय ॥ २ जयति चन्द्रघण्टा माँ जय जय । जय कूष्माण्डा स्कन्दजननि जय ॥ ३ जय माँ कात्यायिनी जयति जय ।
    जयति कालरात्री माँ जय जय ॥ ४ जयति महागौरी देवी जय । जयति सिद्धिदात्री माँ जय जय ॥ ५ जय काली जय तारा
    जय जय । जय जगजननि षोडशी जय जय ॥ ६ जय भुवनेश्वरि माता जय जय । जयति छिन्नमस्ता माँ जय जय ॥ ७ जयति भैरवी
    देवी जय जय । जय जय धूमावती जयति जय ॥ ८ जय बगला मातङ्गी जय जय । जयति जयति माँ कमला जय जय ॥ ९ जयति महाकाली
    माँ जय जय । जयति महालक्ष्मी माँ जय जय ॥ १० जय माँ महासरस्वति जय जय । उमा रमा ब्रह्माणी जय जय ॥ ११
    कावेरी वारुणी जयति जय । जय कच्छपी नारसिंही जय ॥ १२ जय मत्स्या कौमारी जय जय । जय वैष्णवी वासवी जय जय
    ॥ १३ जय माधव
