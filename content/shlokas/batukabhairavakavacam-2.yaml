id: batukabhairavakavacam-2
category: kavacha
name:
  english: batukabhairavakavacam
  devanagari: बटुकभैरवकवचं
content:
  english: asya shri batukabhairavakavacasya anandabhairava rishistrishtup chandah shri batukabhairavodevata
    bam bijam hrim shaktih om batukayeti kilakam mamabhishtasiddhayarthe jape viniyogah | om sahasrare
    mahacakre karpuradhavale guruh | patu mam batuko devo bhairavah sarvakarmasu || 1|| purvasyamasitango
    mam dishi rakshatu sarvada | agneyyam ca ruruh patu dakshine candabhairavah || 2|| nairrityam krodhanah
    patu unmattah patu pashcime | vayavyam mam kapali ca nityam payat sureshvarah || 3|| bhishano bhairavah
    patu uttarasyam tu sarvada | samharabhairavah payadishanyam ca maheshvarah || 4|| urdhvam patu vidhata
    ca patale nandako vibhu | sadyojatastu mam payat sarvato devasevitah || 5|| vamadevo vanante ca vane'ghorastatha'vatu
    | jale tatpurushah patu sthale ishana eva ca || 6|| dakiniputrakah patu putran me sarvatah prabhuh
    | hakiniputrakah patu daramstu lakinisutah || 7|| patu shakinikaputrah sainyam vai kalabhairavah |
    maliniputrakah patu pashunashvan gajamstatha || 8|| mahakalo'vatu kshetram shriyam me sarvato gira
    | vadyam vadyapriyah patu bhairavo nityasampada || 9|| namo bhairavadevaya sarvabhutaya vai namah
    | namastrailokyanathaya nathanathaya vai namah || 10|| || iti bhairavatantroktam batukabhairavakavacam
    sampurnam ||
  devanagari: अस्य श्री बटुकभैरवकवचस्य आनन्दभैरव ऋषिस्त्रिष्टुप् छन्दः श्री बटुकभैरवोदेवता बं बीजं ह्रीं
    शक्तिः ॐ बटुकायेति कीलकं ममाभीष्टसिद्धयर्थे जपे विनियोगः । ॐ सहस्रारे महाचक्रे कर्पूरधवले गुरुः ।
    पातु मां बटुको देवो भैरवः सर्वकर्मसु ॥ १॥ पूर्वस्यामसिताङ्गो मां दिशि रक्षतु सर्वदा । आग्नेय्यां च
    रुरुः पातु दक्षिणे चण्डभैरवः ॥ २॥ नैरृत्यां क्रोधनः पातु उन्मत्तः पातु पश्चिमे । वायव्यां मां कपाली
    च नित्यं पायात् सुरेश्वरः ॥ ३॥ भीषणो भैरवः पातु उत्तरस्यां तु सर्वदा । संहारभैरवः पायादीशान्यां च
    महेश्वरः ॥ ४॥ ऊर्ध्वं पातु विधाता च पाताले नन्दको विभु । सद्योजातस्तु मां पायात् सर्वतो देवसेवितः
    ॥ ५॥ वामदेवो वनान्ते च वनेऽघोरस्तथाऽवतु । जले तत्पुरुषः पातु स्थले ईशान एव च ॥ ६॥ डाकिनीपुत्रकः पातु
    पुत्रान् मे सर्वतः प्रभुः । हाकिनीपुत्रकः पातु दारांस्तु लाकिनीसुतः ॥ ७॥ पातु शाकिनिकापुत्रः सैन्यं
    वै कालभैरवः । मालिनीपुत्रकः पातु पशूनश्वान् गजांस्तथा ॥ ८॥ महाकालोऽवतु क्षेत्रं श्रियं मे सर्वतो गिरा
    । वाद्यं वाद्यप्रियः पातु भैरवो नित्यसम्पदा ॥ ९॥ नमो भैरवदेवाय सर्वभूताय वै नमः । नमस्त्रैलोक्यनाथाय
    नाथनाथाय वै नमः ॥ १०॥ ॥ इति भैरवतन्त्रोक्तं बटुकभैरवकवचं सम्पूर्णम् ॥
