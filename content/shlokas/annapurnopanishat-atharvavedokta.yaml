id: annapurnopanishat-atharvavedokta
category: upanishad
name:
  english: annapurnopanishat (atharvavedokta)
  devanagari: अन्नपूर्णोपनिषत् (अथर्ववेदोक्त)
content:
  english: stasminpade galitacittalava bhavanti || 24|| he nidagha mahaprajna nirvasanamana bhava | balaccetah
    samadhaya nirvikalpamana bhava || 25|| yajjagadbhasakam bhanam nityam bhati svatah sphurat | sa eva
    jagatah sakshi sarvatma vimalakritih || 26|| pratishtha sarvabhutanam prajnanaghanalakshanah | tadvidyavishayam
    brahma satyajnanasukhadvanam || 27|| ekam brahmahamasmiti kritakrityo bhavenmunih || 28|| sarvadhishthanamadvandvam
    param brahma sanatanam | saccidanandarupam tadavanmanasagocaram || 29|| na tatra candrarkavapuh prakashate
    na vanti vatah sakalashca devatah | sa eva devah kritabhavabhutah svayam vishuddho virajah prakashate
    || 30|| bhidyate hridayagranthishchidyante sarvasamshayah | kshiyante casya karmani tasmindrishte
    paravare || 31|| dvau suparnau sharire'sminjiveshakhyau saha sthitau | tayorjivah phalam bhunkte karmano
    na maheshvarah || 32|| kevalam sakshirupena vina bhogo maheshvarah | prakashate svayam bhedah kalpito
    mayaya tayoh | ciccidakarato bhinna na bhinna cittvahanitah || 33|| tarkatashca pramanacca cidekatvavyavasthiteh
    | cidekatvaparijnane na shocati na muhyati || 34|| adhishthanam samastasya jagatah satyacidghanam
    | ahamasmiti nishcitya vitashoko bhavenmunih || 35|| svasharire svayamjyotisvarupam sarvasakshinam
    | kshinadoshah prapashyanti netare mayayavritah || 36|| tameva dhiro vijnaya prajnam kurvita brahmanah
    | nanudhyayadbahunchabdanvaco viglapanam hi tat || 37|| balenaiva hi tishthasennirvidya brahmavedanam
    | brahmavidyam ca balyam ca nirvidya muniratmavan || 38|| antarlinasamarambhah shubhashubhamahankuram
    | samsritivrataterbijam shariram viddhi bhautikam || 39|| bhavabhavadashakosham duhkharatnasamudgakam
    | bijamasya sharirasya cittamashavashanugam || 40|| dve bije cittavrikshasya vrittivratatidharinah
    | ekam pranaparispando dvitiyo dridhabhavana || 41|| yada praspandante prano nadisamsparshanodyatah
    | tada samvedanamayam cittamashu prajayate || 42|| sa hi sarvagata samvitpranaspandena bodhyate |
    samvitsamrodhanam shreyah pranadispandanam varam || 43|| yoginashcittashantyartham kurvanti pranarodhanam
    | pranayamaistatha dhyanaih prayogairyuktikalpitaih || 44|| cittopashantiphaladam paramam viddhi karanam
    | sukhadam samvidah svasthyam pranasamrodhanam viduh || 45|| dridhabhavanaya tyaktapurvaparavicaranam
    | yadadanam padarthasya vasana sa prakirtita || 46|| yada na bhavyate kimciddheyopadeyarupi yat |
    sthiyate sakalam tyaktva tada cittam na jayate || 47|| avasanatvatsatatam yada na manute manah | amanasta
    tadodeti paramopashamaprada || 48|| yada na bhavyate bhavah kvacijjagati vastuni | tada hridambare
    shunye katham cittam prajayate || 49|| yadabhavanamasthaya yadabhavasya bhavanam | yadyatha vastudarshitvam
    tadacittatvamucyate || 50|| sarvamantah parityajya shitalashayavarti yat | vrittisthamapi taccittamasadrupamudahritam
    || 51|| bhrashtabijopama yesham punarjananavarjita | vasanarasanahina jivanmukta hi te smritah ||
    52|| sattvarupaparipraptacittaste jnanaparagah | acitta iti kathyante dehante vyomarupinah || 53||
    samvedyasamparityagatpranaspandanavasane | samulam nashyatah kshipram mulacchedadiva drumah || 54||
    purvadrishtamadrishtam va yadasyah pratibhasate | samvidastatprayatnena marjaniyam vijanata || 55||
    tadamarjanamatram hi mahasamsaratam gatam | tatpramarjanamatram tu moksha ityabhidhiyate || 56|| ajado
    galitanandastyaktasamvedano bhava || 57|| samvidvastudashalambah sa yasyeha na vidyate | so'samvidajadah
    proktah kurvankaryashatanyapi || 58|| samvedyena hridakashe managapi na lipyate | yasyasavajada samvijjivanmuktah
    sa kathyate || 59|| yada na bhavyate kimcinnirvasanatayatmani | balamukadivijnanamiva ca sthiyate
    sthiram || 60|| tada jadyavinirmuktamasamvedanamatatam | ashritam bhavati prajno yasmadbhuyo na lipyate
    || 61|| samasta vasanastyaktva nirvikalpasamadhitah | tanmayatvadanadyante tadapyantarviliyate ||
    62|| tishthangacchansprishanjighrannapi tallepavarjitah | ajado galitanandastyaktasamvedanah sukhi
    || 63|| etam drishtimavashtabhya kashtaceshtayuto'pi san | taredduhkhambudheh paramaparagunasagarah
    || 64|| vishesham samparityajya sanmatram yadalepakam | ekarupam maharupam sattayastatpadam viduh
    || 65|| kalasatta kalasatta vastusatteyamityapi | vibhagakalanam tyaktva sanmatraikaparo bhava ||
    66|| sattasamanyamevaikam bhavayankevalam vibhuh | paripurnah paranandi tishthapuritadigbharah ||
    67|| sattasamanyaparyante yattatkalanayojjhitam | padamadyamanadyantam tasya bijam na vidyate || 68||
    tatra samliyate samvinnirvikalpam ca tishthati | bhuyo na vartate duhkhe tatra labdhapadah puman ||
    69|| taddhetuh sarvabhutanam tasya heturna vidyate | sa sarah sarvasaranam tasmatsaro na vidyate ||
    70|| tasmimshciddarpane sphare samasta vastudrishtayah | imastah pratibimbanti sarasiva tatadrumah
    || 71|| tadamalamarajam tadatmatattvam tadavagatavupashantimeti cetah | avagatavigataikatatsvarupo
    bhavabhayamuktapado'si samyageva || 72|| etesham duhkhabijanam proktam yadyanmayottaram | tasya tasya
    prayogena shighram tatprapyate padam || 73|| sattasamanyakotisthe dragityeva pade yadi | paurushena
    prayatnena balatsamtyajya vasanam || 74|| sthitim badhnasi tattvajna kshanamapyakshayatmikam | kshane'sminneva
    tatsadhu padamasadayasyalam ||75|| sattasamanyarupe va karoshi sthitimadarat | tatkimcidadhikeneha
    yatnenapnoshi tatpadam || 76|| samvittattve kritadhyano nidagha yadi tishthasi | tadyatnenadhikenoccairasadayasi
    tatpadam || 77|| vasanasamparityage yadi yatnam karoshi bhoh | yavadvilinam na mano na tavadvasanakshayah
    || 78|| na kshina vasana yavaccittam tavanna shamyati | yavanna tattvavijnanam tavaccittashamah kutah
    || 79|| yavanna cittopashamo na tavattattvavedanam | yavanna vasananashastavattattvagamah kutah |
    yavanna tattvasampraptirna tavadvasanakshayah || 80|| tattvajnanam manonasho vasanakshaya eva ca |
    mithah karanatam gatva duhsadhani sthitanyatah || 81|| bhogeccham duratastyaktva trayametatsamacara
    || 82|| vasanakshayavijnanamanonasha mahamate | samakalam cirabhyasta bhavanti phalada matah || 83||
    tribhirebhih samabhyastairhridayagranthayo dridhah | nihsheshameva trutyanti bisacchedadguna iva ||
    84|| vasanasamparityagasamam prananirodhanam | vidustattvavidastasmattadapyevam samaharet || 85||
    vasanasamparityagaccittam gacchatyacittatam | pranaspandanirodhacca yathecchasi tatha kuru || 86||
    pranayamadridhadhyasairyuktya ca gurudattaya | asanashanayogena pranaspando nirudhyate || 87|| nihsangavyavaharatvadbhavabhavanavarjanat
    | shariranashadarshitvadvasana na pravartate || 88|| yah pranapavanaspandashcittaspandah sa eva hi
    | pranaspandajaye yatnah kartavyo dhimatoccakaih || 89|| na shakyate mano jetum vina yuktimaninditam
    | shuddham samvidamashrityavitaragah sthiro bhava || 90|| samvedyavarjitamanuttamamadyamekam samvidatpadam
    vikalanam kalayanmahatman | hridyeva tishtha kalanarahitah kriyam tu kurvannakartripadametya shamoditashrih
    || 91|| managapi vicarena cetasah svasya nigrahah | purushena krito yena tenaptam janmanah phalam
    || 92|| iti caturtho'dhyayah || 4|| pancamo'dhyayah gacchatastishthato vapi jagratah svapato'pi va
    | na vicaraparam ceto yasyasau mrita ucyate || 1|| samyagjnanasamalokah puma'jneyasamah svayam | na
    bibheti na cadatte vaivashyam na ca dinatam || 2|| apavitramapathyam ca vishasamsargadushitam | bhuktam
    jarayati jnani klinnam nashtham ca mrishtavat || 3|| sangatyagam vidurmoksham sangatyagadajanmata
    | sangam tyaja tvam bhavanam jivanmukto bhavanagha || 4|| bhavabhave padarthanam harshamarshavikarada
    | malina vasana yaisha sa'sanga iti kathyate || 5|| jivanmuktashariranamapunarjanmakarini | mukta
    harshavishadabhyam shuddha bhavati vasana || 6|| duhkhairna glanimayasi hridi hrishyasi no sukhaih
    | ashavaivashyamutsrijya nidagha'sangatam vraja || 7|| dikkaladyanavacchinnamadrishtobhayakotikam
    | cinmatramakshayam shantamekam brahmasmi netarat || 8|| iti matvahamityantarmuktamuktavapuh puman
    | ekarupah prashantatma mauni svatmasukho bhava || 9|| nasti cittam na cavidya na mano na ca jivakah
    | brahmaivaikamanadyantamabdhivatpravijrimbhate || 10|| dehe yavadahambhavo drishye'sminyavadatmata
    | yavanmamedamityastha tavaccittadivibhramah || 11|| antarmukhataya sarvam cidvahnau trijagattrinam
    | juhvanto'ntarnivartante mune cittadivibhramah || 12|| cidatmasmi niramsho'smi paraparavivarjitah
    | rupam smarannijam spharam ma smritya sammito bhava || 13|| adhyatmashastramantrena trishnavishavishucika
    | kshiyate bhavitenantah sharada mihika yatha || 14|| parijnaya parityago vasananam ya uttamah | sattasamanyarupatvattatkaivalyapadam
    viduh || 15|| yannasti vasana lina tatsushuptam na siddhaye | nirbija vasana yatra tatturyam siddhidam
    smritam || 16|| vasanayastatha vahnerrinavyadhidvishamapi | snehavairavishana ca sheshah svalpo'pi
    badhate || 17|| nirdagdhavasanabijah sattasamanyarupavan | sadeho va videho va na bhuyo duhkhabhagbhavet
    || 18|| etavadevavidyatvam nedam brahmeti nishcayah | esha eva kshayastasya brahmedamiti nishcayah
    || 19|| brahma cidbrahma bhuvanam brahma bhutaparampara | brahmaham brahma cicchatrurbrahma cinmitrabandhavah
    || 20|| brahmaiva sarvamityeva bhavite brahma vai puman | sarvatravasthitam shantam cidbrahmetyanubhuyate
    || 21|| asamskritadhvagaloke manasyanyatra samsthite | ya pratitiranagasaka taccidbrahmasmi sarvagam
    || 22|| prashantasarvasamkalpam vigatakhilakautukam | vigatasheshasamrambham cidatmanam samashraya
    || 23|| evam purnadhiyo dhirah sama niragacetasah | na nandanti na nindanti jivitam maranam tatha
    || 24|| prano'yamanisham brahmaspandashaktih sadagatih | sabahyabhyantare deheprano'savurdhvagah sthitah
    || 25|| apano'pyanisham brahmaspandashaktih sadagatih | sabahyabhyantare dehe apano'yamavaksthitah
    || 26|| jagratah svapatashcaiva pranayamo'yamuttamah | pravartate hyabhijnasya tam tavacchreyase sha
  devanagari: स्तस्मिन्पदे गलितचित्तलवा भवन्ति ॥ २४॥ हे निदाघ महाप्राज्ञ निर्वासनमना भव । बलाच्चेतः समाधाय
    निर्विकल्पमना भव ॥ २५॥ यज्जगद्भासकं भानं नित्यं भाति स्वतः स्फुरत् । स एव जगतः साक्षी सर्वात्मा विमलाकृतिः
    ॥ २६॥ प्रतिष्ठा सर्वभूतानां प्रज्ञानघनलक्षणः । तद्विद्याविषयं ब्रह्म सत्यज्ञानसुखाद्वनम् ॥ २७॥ एकं
    ब्रह्माहमस्मीति कृतकृत्यो भवेन्मुनिः ॥ २८॥ सर्वाधिष्ठानमद्वन्द्वं परं ब्रह्म सनातनम् । सच्चिदानन्दरूपं
    तदवाङ्मनसगोचरम् ॥ २९॥ न तत्र चन्द्रार्कवपुः प्रकाशते न वान्ति वातः सकलाश्च देवताः । स एव देवः कृतभावभूतः
    स्वयं विशुद्धो विरजः प्रकाशते ॥ ३०॥ भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः । क्षीयन्ते चास्य कर्माणि
    तस्मिन्दृष्टे परावरे ॥ ३१॥ द्वौ सुपर्णौ शरीरेऽस्मिञ्जीवेशाख्यौ सह स्थितौ । तयोर्जीवः फलं भुङ्क्ते
    कर्मणो न महेश्वरः ॥ ३२॥ केवलं साक्षिरूपेण विना भोगो महेश्वरः । प्रकाशते स्वयं भेदः कल्पितो मायया तयोः
    । चिच्चिदाकारतो भिन्ना न भिन्ना चित्त्वहानितः ॥ ३३॥ तर्कतश्च प्रमाणाच्च चिदेकत्वव्यवस्थितेः । चिदेकत्वपरिज्ञाने
    न शोचति न मुह्यति ॥ ३४॥ अधिष्ठानं समस्तस्य जगतः सत्यचिद्घनम् । अहमस्मीति निश्चित्य वीतशोको भवेन्मुनिः
    ॥ ३५॥ स्वशरीरे स्वयंज्योतिस्वरूपं सर्वसाक्षिणम् । क्षीणदोषाः प्रपश्यन्ति नेतरे माययावृताः ॥ ३६॥ तमेव
    धीरो विज्ञाय प्रज्ञां कुर्वीत ब्राह्मणः । नानुध्यायाद्बहूञ्छब्दान्वाचो विग्लापनं हि तत् ॥ ३७॥ बालेनैव
    हि तिष्ठासेन्निर्विद्य ब्रह्मवेदनम् । ब्रह्मविद्यां च बाल्यं च निर्विद्य मुनिरात्मवान् ॥ ३८॥ अन्तर्लीनसमारम्भः
    शुभाशुभमहाङ्कुरम् । संसृतिव्रततेर्बीजं शरीरं विद्धि भौतिकम् ॥ ३९॥ भावाभावदशाकोशं दुःखरत्नसमुद्गकम्
    । बीजमस्य शरीरस्य चित्तमाशावशानुगम् ॥ ४०॥ द्वे बीजे चित्तवृक्षस्य वृत्तिव्रततिधारिणः । एकं प्राणपरिस्पन्दो
    द्वितीयो दृढभावना ॥ ४१॥ यदा प्रस्पन्दन्ते प्राणो नाडीसंस्पर्शनोद्यतः । तदा संवेदनमयं चित्तमाशु प्रजायते
    ॥ ४२॥ सा हि सर्वगता संवित्प्राणस्पन्देन बोध्यते । संवित्संरोधनं श्रेयः प्राणादिस्पन्दनं वरम् ॥ ४३॥
    योगिनश्चित्तशान्त्यर्थं कुर्वन्ति प्राणरोधनम् । प्राणायामैस्तथा ध्यानैः प्रयोगैर्युक्तिकल्पितैः ॥
    ४४॥ चित्तोपशान्तिफलदं परमं विद्धि कारणम् । सुखदं संविदः स्वास्थ्यं प्राणसंरोधनं विदुः ॥ ४५॥ दृढभावनया
    त्यक्तपूर्वापरविचारणम् । यदादानं पदार्थस्य वासना सा प्रकीर्तिता ॥ ४६॥ यदा न भाव्यते किंचिद्धेयोपादेयरूपि
    यत् । स्थीयते सकलं त्यक्त्वा तदा चित्तं न जायते ॥ ४७॥ अवासनत्वात्सततं यदा न मनुते मनः । अमनस्ता तदोदेति
    परमोपशमप्रदा ॥ ४८॥ यदा न भाव्यते भावः क्वचिज्जगति वस्तुनि । तदा हृदम्बरे शून्ये कथं चित्तं प्रजायते
    ॥ ४९॥ यदभावनमास्थाय यदभावस्य भावनम् । यद्यथा वस्तुदर्शित्वं तदचित्तत्वमुच्यते ॥ ५०॥ सर्वमन्तः परित्यज्य
    शीतलाशयवर्ति यत् । वृत्तिस्थमपि तच्चित्तमसद्रूपमुदाहृतम् ॥ ५१॥ भ्रष्टबीजोपमा येषां पुनर्जननवर्जिता
    । वासनारसनाहीना जीवन्मुक्ता हि ते स्मृताः ॥ ५२॥ सत्त्वरूपपरिप्राप्तचित्तास्ते ज्ञानपारगाः । अचित्ता
    इति कथ्यन्ते देहान्ते व्योमरूपिणः ॥ ५३॥ संवेद्यसम्परित्यागात्प्राणस्पन्दनवासने । समूलं नश्यतः क्षिप्रं
    मूलच्छेदादिव द्रुमः ॥ ५४॥ पूर्वदृष्टमदृष्टं वा यदस्याः प्रतिभासते । संविदस्तत्प्रयत्नेन मार्जनीयं
    विजानता ॥ ५५॥ तदमार्जनमात्रं हि महासंसारतां गतम् । तत्प्रमार्जनमात्रं तु मोक्ष इत्यभिधीयते ॥ ५६॥ अजडो
    गलितानन्दस्त्यक्तसंवेदनो भव ॥ ५७॥ संविद्वस्तुदशालम्बः सा यस्येह न विद्यते । सोऽसंविदजडः प्रोक्तः कुर्वन्कार्यशतान्यपि
    ॥ ५८॥ संवेद्येन हृदाकाशे मनागपि न लिप्यते । यस्यासावजडा संविज्जीवन्मुक्तः स कथ्यते ॥ ५९॥ यदा न भाव्यते
    किंचिन्निर्वासनतयात्मनि । बालमूकादिविज्ञानमिव च स्थीयते स्थिरम् ॥ ६०॥ तदा जाड्यविनिर्मुक्तमसंवेदनमाततम्
    । आश्रितं भवति प्राज्ञो यस्माद्भूयो न लिप्यते ॥ ६१॥ समस्ता वासनास्त्यक्त्वा निर्विकल्पसमाधितः । तन्मयत्वादनाद्यन्ते
    तदप्यन्तर्विलीयते ॥ ६२॥ तिष्ठन्गच्छन्स्पृशञ्जिघ्रन्नपि तल्लेपवर्जितः । अजडो गलितानन्दस्त्यक्तसंवेदनः
    सुखी ॥ ६३॥ एतां दृष्टिमवष्टभ्य कष्टचेष्टायुतोऽपि सन् । तरेद्दुःखाम्बुधेः पारमपारगुणसागरः ॥ ६४॥ विशेषं
    सम्परित्यज्य सन्मात्रं यदलेपकम् । एकरूपं महारूपं सत्तायास्तत्पदं विदुः ॥ ६५॥ कालसत्ता कलासत्ता वस्तुसत्तेयमित्यपि
    । विभागकलनां त्यक्त्वा सन्मात्रैकपरो भव ॥ ६६॥ सत्तासामान्यमेवैकं भावयन्केवलं विभुः । परिपूर्णः परानन्दि
    तिष्ठापूरितदिग्भरः ॥ ६७॥ सत्तासामान्यपर्यन्ते यत्तत्कलनयोज्झितम् । पदमाद्यमनाद्यन्तं तस्य बीजं न विद्यते
    ॥ ६८॥ तत्र संलीयते संविन्निर्विकल्पं च तिष्ठति । भूयो न वर्तते दुःखे तत्र लब्धपदः पुमान् ॥ ६९॥ तद्धेतुः
    सर्वभूतानां तस्य हेतुर्न विद्यते । स सारः सर्वसाराणां तस्मात्सारो न विद्यते ॥ ७०॥ तस्मिंश्चिद्दर्पणे
    स्फारे समस्ता वस्तुदृष्टयः । इमास्ताः प्रतिबिम्बन्ति सरसीव तटद्रुमाः ॥ ७१॥ तदमलमरजं तदात्मतत्त्वं
    तदवगतावुपशान्तिमेति चेतः । अवगतविगतैकतत्स्वरूपो भवभयमुक्तपदोऽसि सम्यगेव ॥ ७२॥ एतेषां दुःखबीजानां प्रोक्तं
    यद्यन्मयोत्तरम् । तस्य तस्य प्रयोगेण शीघ्रं तत्प्राप्यते पदम् ॥ ७३॥ सत्तासामान्यकोटिस्थे द्रागित्येव
    पदे यदि । पौरुषेण प्रयत्नेन बलात्संत्यज्य वासनाम् ॥ ७४॥ स्थितिं बध्नासि तत्त्वज्ञ क्षणमप्यक्षयात्मिकाम्
    । क्षणेऽस्मिन्नेव तत्साधु पदमासादयस्यलम् ॥७५॥ सत्तासामान्यरूपे वा करोषि स्थितिमादरात् । तत्किंचिदधिकेनेह
    यत्नेनाप्नोषि तत्पदम् ॥ ७६॥ संवित्तत्त्वे कृतध्यानो निदाघ यदि तिष्ठसि । तद्यत्नेनाधिकेनोच्चैरासादयसि
    तत्पदम् ॥ ७७॥ वासनासम्परित्यागे यदि यत्नं करोषि भोः । यावद्विलीनं न मनो न तावद्वासनाक्षयः ॥ ७८॥ न
    क्षीणा वासना यावच्चित्तं तावन्न शाम्यति । यावन्न तत्त्वविज्ञानं तावच्चित्तशमः कुतः ॥ ७९॥ यावन्न चित्तोपशमो
    न तावत्तत्त्ववेदनम् । यावन्न वासनानाशस्तावत्तत्त्वागमः कुतः । यावन्न तत्त्वसम्प्राप्तिर्न तावद्वासनक्षयः
    ॥ ८०॥ तत्त्वज्ञानं मनोनाशो वासनाक्षय एव च । मिथः कारणतां गत्वा दुःसाधानि स्थितान्यतः ॥ ८१॥ भोगेच्छां
    दूरतस्त्यक्त्वा त्रयमेतत्समाचर ॥ ८२॥ वासनाक्षयविज्ञानमनोनाशा महामते । समकालं चिराभ्यस्ता भवन्ति फलदा
    मताः ॥ ८३॥ त्रिभिरेभिः समभ्यस्तैर्हृदयग्रन्थयो दृढाः । निःशेषमेव त्रुट्यन्ति बिसच्छेदाद्गुणा इव ॥
    ८४॥ वासनासम्परित्यागसमं प्राणनिरोधनम् । विदुस्तत्त्वविदस्तस्मात्तदप्येवं समाहरेत् ॥ ८५॥ वासनासम्परित्यागाच्चित्तं
    गच्छत्यचित्तताम् । प्राणस्पन्दनिरोधाच्च यथेच्छसि तथा कुरु ॥ ८६॥ प्राणायामदृढाध्यासैर्युक्त्या च गुरुदत्तया
    । आसनाशनयोगेन प्राणस्पन्दो निरुध्यते ॥ ८७॥ निःसङ्गव्यवहारत्वाद्भवभावनवर्जनात् । शरीरनाशदर्शित्वाद्वासना
    न प्रवर्तते ॥ ८८॥ यः प्राणपवनस्पन्दश्चित्तस्पन्दः स एव हि । प्राणस्पन्दजये यत्नः कर्तव्यो धीमतोच्चकैः
    ॥ ८९॥ न शक्यते मनो जेतुं विना युक्तिमनिन्दिताम् । शुद्धां संविदमाश्रित्यवीतरागः स्थिरो भव ॥ ९०॥ संवेद्यवर्जितमनुत्तममाद्यमेकं
    संविदत्पदं विकलनं कलयन्महात्मन् । हृद्येव तिष्ठ कलनारहितः क्रियां तु कुर्वन्नकर्तृपदमेत्य शमोदितश्रीः
    ॥ ९१॥ मनागपि विचारेण चेतसः स्वस्य निग्रहः । पुरुषेण कृतो येन तेनाप्तं जन्मनः फलम् ॥ ९२॥ इति चतुर्थोऽध्यायः
    ॥ ४॥ पञ्चमोऽध्यायः गच्छतस्तिष्ठतो वापि जाग्रतः स्वपतोऽपि वा । न विचारपरं चेतो यस्यासौ मृत उच्यते ॥
    १॥ सम्यग्ज्ञानसमालोकः पुमाऽज्ञेयसमः स्वयम् । न बिभेति न चादत्ते वैवश्यं न च दीनताम् ॥ २॥ अपवित्रमपथ्यं
    च विषसंसर्गदूषितम् । भुक्तं जरयति ज्ञानी क्लिन्नं नष्ठं च मृष्टवत् ॥ ३॥ सङ्गत्यागं विदुर्मोक्षं सङ्गत्यागादजन्मता
    । सङ्गं त्यज त्वं भावानां जीवन्मुक्तो भवानघ ॥ ४॥ भावाभावे पदार्थानां हर्षामर्षविकारदा । मलिना वासना
    यैषा साऽसङ्ग इति कथ्यते ॥ ५॥ जीवन्मुक्तशरीराणामपुनर्जन्मकारिणी । मुक्ता हर्षविषादाभ्यां शुद्धा भवति
    वासना ॥ ६॥ दुःखैर्न ग्लानिमायासि हृदि हृष्यसि नो सुखैः । आशावैवश्यमुत्सृज्य निदाघाऽसङ्गतां व्रज ॥
    ७॥ दिक्कालाद्यनवच्छिन्नमदृष्टोभयकोटिकम् । चिन्मात्रमक्षयं शान्तमेकं ब्रह्मास्मि नेतरत् ॥ ८॥ इति मत्वाहमित्यन्तर्मुक्तामुक्तवपुः
    पुमान् । एकरूपः प्रशान्तात्मा मौनी स्वात्मसुखो भव ॥ ९॥ नास्ति चित्तं न चाविद्या न मनो न च जीवकः ।
    ब्रह्मैवैकमनाद्यन्तमब्धिवत्प्रविजृम्भते ॥ १०॥ देहे यावदहंभावो दृश्येऽस्मिन्यावदात्मता । यावन्ममेदमित्यास्था
    तावच्चित्तादिविभ्रमः ॥ ११॥ अन्तर्मुखतया सर्वं चिद्वह्नौ त्रिजगत्तृणम् । जुह्वन्तोऽन्तर्निवर्तन्ते
    मुने चित्तादिविभ्रमाः ॥ १२॥ चिदात्मास्मि निरंशोऽस्मि परापरविवर्जितः । रूपं स्मरन्निजं स्फारं मा स्मृत्या
    संमितो भव ॥ १३॥ अध्यात्मशास्त्रमन्त्रेण तृष्णाविषविषूचिका । क्षीयते भावितेनान्तः शरदा मिहिका यथा ॥
    १४॥ परिज्ञाय परित्यागो वासानानं य उत्तमः । सत्तासामान्यरूपत्वात्तत्कैवल्यपदं विदुः ॥ १५॥ यन्नास्ति
    वासना लीना तत्सुषुप्तं न सिद्धये । निर्बीजा वासना यत्र तत्तुर्यं सिद्धिदं स्मृतम् ॥ १६॥ वासनायास्तथा
    वह्नेरृणव्याधिद्विषामपि । स्नेहवैरविषाण च शेषः स्वल्पोऽपि बाधते ॥ १७॥ निर्दग्धवासनाबीजः सत्तासामान्यरूपवान्
    । सदेहो वा विदेहो वा न भूयो दुःखभाग्भवेत् ॥ १८॥ एतावदेवाविद्यात्वं नेदं ब्रह्मेति निश्चयः । एष एव
    क्षयस्तस्या ब्रह्मेदमिति निश्चयः ॥ १९॥ ब्रह्म चिद्ब्रह्म भुवनं ब्रह्म भूतपरम्परा । ब्रह्माहं ब्रह्म
    चिच्छत्रुर्ब्रह्म चिन्मित्रबान्धवाः ॥ २०॥ ब्रह्मैव सर्वमित्येव भाविते ब्रह्म वै पुमान् । सर्वत्रावस्थितं
    शान्तं चिद्ब्रह्मेत्यनुभूयते ॥ २१॥ असंस्कृताध्वगालोके मनस्यन्यत्र संस्थिते । या प्रतीतिरनागसका तच्चिद्ब्रह्मास्मि
    सर्वगम् ॥ २२॥ प्रशान्तसर्वसंकल्पं विगताखिलकौतुकम् । विगताशेषसंरंभं चिदात्मानं समाश्रय ॥ २३॥ एवं पूर्णधियो
    धीराः समा नीरागचेतसः । न नन्दन्ति न निन्दन्ति जीवितं मरणं तथा ॥ २४॥ प्राणोऽयमनिशं ब्रह्मस्पन्दशक्तिः
    सदागतिः । सबाह्याभ्यन्तरे देहेप्राणोऽसावूर्ध्वगः स्थितः ॥ २५॥ अपानोऽप्यनिशं ब्रह्मस्पन्दशक्तिः सदागतिः
    । सबाह्याभ्यन्तरे देहे अपानोऽयमवाक्स्थितः ॥ २६॥ जाग्रतः स्वपतश्चैव प्राणायामोऽयमुत्तमः । प्रवर्तते
    ह्यभिज्ञस्य तं तावच्छ्रेयसे श
