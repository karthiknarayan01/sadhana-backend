id: dakshakritamgauristotram
category: stotram
name:
  english: dakshakritamgauristotram
  devanagari: दक्षकृतंगौरीस्तोत्रम्
content:
  english: '| namo bhagavatishani shivayai te namo namah || 105|| tvanmayo''ham tvadadharastvameva ca
    gatirmama | tvameva sharanam yami prasida parameshvari || 106|| maya nasti samo loke devo va danavo''pi
    va | jaganmateva matputri sambhuta sa svayam yatah || 107|| esha tava''mba''sikni virakanyaka''pyaho
    | jaganmatushca mata''dya caho''syah punyagauravam || 108|| pahi mamamareshani casiknya saha sarvada
    | namami tava padabbjam vrajami sharanam shivam || 109|| aho me sumahadbhagyam mahadevisamagamat |
    ajnapaya mahadevi kim karishyami shankari || 110|| etavaduktva vacanam tada dakshah prajapatih | samprekshamano
    gaurim tam pranjalih parshvatah sthitah || 111|| dhyatavan svasutam devim parabrahmatmikam satim |
    asheshakalyanamayim sarvavikritiparagam || 112|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane
    169'
  devanagari: । नमो भगवतीशानि शिवायै ते नमो नमः ॥ १०५॥ त्वन्मयोऽहं त्वदाधारस्त्वमेव च गतिर्मम । त्वामेव
    शरणं यामि प्रसीद परमेश्वरि ॥ १०६॥ मया नास्ति समो लोके देवो वा दानवोऽपि वा । जगन्मातेव मत्पुत्री सम्भूता
    सा स्वयं यतः ॥ १०७॥ एषा तवाऽम्बाऽसिक्नी वीरकन्यकाऽप्यहो । जगन्मातुश्च माताऽद्य चाहोऽस्याः पुण्यगौरवम्
    ॥ १०८॥ पाहि माममरेशानि चासिक्न्या सह सर्वदा । नमामि तव पादाब्ब्जं व्रजामि शरणं शिवम् ॥ १०९॥ अहो मे
    सुमहद्भाग्यं महादेवीसमागमात् । आज्ञापय महादेवि किं करिष्यामि शाङ्करि ॥ ११०॥ एतावदुक्त्वा वचनं तदा
    दक्षः प्रजापतिः । सम्प्रेक्षमाणो गौरीं तां प्राञ्जलिः पार्श्वतः स्थितः ॥ १११॥ ध्यातवान् स्वसुतां देवीं
    परब्रह्मात्मिकां सतीम् । अशेषकल्याणमयीं सर्वविकृतिपारगाम् ॥ ११२॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने १६९
meaning: {}
