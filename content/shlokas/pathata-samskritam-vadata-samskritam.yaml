id: pathata-samskritam-vadata-samskritam
category: stotram
name:
  english: Pathata Samskritam Vadata Samskritam
content:
  english: vadata samskritam lasatu samskritam ciram grihe grihe ca punarapi || pathata || jnanavaibhavam
    vedavanmayam lasati yatra bhavabhayapahari munibhirarjitam | kirtirarjita yasya pranayanat vyasa ||
    sthanamurjitam yasya manvate vagvicintaka hi vakshu yasya vikshya madhuratam | yadvina jana naiva
    janate bharatiyasamskritim sanatanabhidham varam || samskritistatha samskritasya samskriteshca pranayanacca
    manukulam | jayatu samskritam jayatu manukulam jayatu jayatu samskritam jayatu jayatu manukulam ||
  devanagari: वदत संस्कृतं लसतु संस्कृतं चिरं गृहे गृहे च पुनरपि ॥ पठत ॥ ज्ञानवैभवं वेदवाङ्मयं लसति यत्र
    भवभयापहारि मुनिभिरार्जितम् । कीर्तिरार्जिता यस्य प्रणयनात् व्यास ॥ स्थानमूर्जितं यस्य मन्वते वाग्विचिन्तका
    हि वाक्षु यस्य वीक्ष्य मधुरताम् । यद्विना जना नैव जानते भारतीयसंस्कृतिं सनातनाभिधां वराम् ॥ संस्कृतिस्तथा
    संस्कृतस्य संस्कृतेश्च प्रणयनाच्च मनुकुलम् । जयतु संस्कृतम् जयतु मनुकुलं जयतु जयतु संस्कृतम् जयतु
    जयतु मनुकुलम् ॥
