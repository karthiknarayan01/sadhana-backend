id: vyadeshvaradhyanamantra
category: mantra
name:
  english: vyadeshvaradhyanamantra
  devanagari: व्याडेश्वरध्यानमन्त्र
content:
  english: shrivyadeshvaradhyanamantrah om namo bhagavate shrivyadeshvaraya | bhutanathaya bhutabadha
    nashaya nashaya | kashtam curaya curaya | manovanchitam puraya puraya | om hrim shrivyadeshvaraya
    namah | om |
  devanagari: श्रीव्याडेश्वरध्यानमन्त्रः ॐ नमो भगवते श्रीव्याडेश्वराय । भूतनाथाय भूतबाधा नाशय नाशय । कष्टं
    चूरय चूरय । मनोवाञ्छितं पूरय पूरय । ॐ ह्रीं श्रीव्याडेश्वराय नमः । ॐ ।
meaning: {}
