id: pitrisuktam-rigveda-samhita-10-15-1-14
category: sukta
name:
  english: pitrisuktam (rigveda samhita 10|15|1-14)
  devanagari: पितृसूक्तम् (ऋग्वेद संहिता १०।१५।१-१४)
content:
  english: 14 ||nisvarah || pitrisuktam svararahitam udiratamavara utparasa unmadhyamah pitarah somyasah
    | asum ya iyuravrika ritajnaste no'vantu pitaro haveshu || 10
  devanagari: १४ ॥निस्वरः ॥ पितृसूक्तं स्वररहितम् उदीरतामवर उत्परास उन्मध्यमाः पितरः सोम्यासः । असुं य
    ईयुरवृका ऋतज्ञास्ते नोऽवन्तु पितरो हवेषु ॥ १०
meaning: {}
