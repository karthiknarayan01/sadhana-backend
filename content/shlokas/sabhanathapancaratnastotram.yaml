id: sabhanathapancaratnastotram
category: stotram
name:
  english: sabhanathapancaratnastotram
  devanagari: सभानाथपन्चरत्नस्तोत्रम्
content:
  english: shrisabhanatha pancaratnastotram vande candrakaladharam mrigadharam vande jagatpalakam vande
    kuncitapadamishamanisham vande puradveshinam | vande hemasabhapatim natapatim vande kripambhonidhim
    vande'ham shivakaminisahacaram vande sabhanayakam || 1|| vande candradineshavahninayanam vande'tisaumyakritim
    vande nirmalamaprameyamatulam vande shivam shulinam | vande parvataputrikarddhavapusham vande sumandasmitam
    vande'ham shivakaminisahacaram vande sabhanayakam || 2|| vande bhasmavibhushitam bhayaharam vande'hamanandadam
    vande shaivasumantrarajanilayam vande gurunam gurum | vande shanmukhavighnarajajanakam vande param
    vyomagam vande'ham shivakaminisahacaram vande sabhanayakam || 3|| vande bhutaganadhipam shashinibham
    vande pashunam patim vande bhaktasuradrumam ca varadam vande murariditam | vande tillavaneshvaram
    shivakaram vande bhavottarakam vande'ham shivakaminisahacaram vande sabhanayakam || 4|| vande pashavimocakam
    smaraharam vande yamasyantakam vande divyamahokshagam gunanidhim vande makhadhishvaram | vande tam
    nigamagamairabhinutam vande mridam shankaram vande'ham shivakaminisahacaram vande sabhanayakam ||
    5|| iti shrisabhanatha pancaratnastotram sampurnam |
  devanagari: श्रीसभानाथ पञ्चरत्नस्तोत्रम् वन्दे चन्द्रकलाधरं मृगधरं वन्दे जगत्पालकं वन्दे कुञ्चितपादमीशमनिशं
    वन्दे पुरद्वेषिणम् । वन्दे हेमसभापतिं नटपतिं वन्दे कृपाम्भोनिधिं वन्देऽहं शिवकामिनीसहचरं वन्दे सभानायकम्
    ॥ १॥ वन्दे चन्द्रदिनेशवह्निनयनं वन्देऽतिसौम्याकृतिं वन्दे निर्मलमप्रमेयमतुलं वन्दे शिवं शूलिनम् ।
    वन्दे पर्वतपुत्रिकार्द्धवपुषं वन्दे सुमन्दस्मितं वन्देऽहं शिवकामिनीसहचरं वन्दे सभानायकम् ॥ २॥ वन्दे
    भस्मविभूषितं भयहरं वन्देऽहमानन्ददं वन्दे शैवसुमन्त्रराजनिलयं वन्दे गुरूणां गुरुम् । वन्दे षण्मुखविघ्नराजजनकं
    वन्दे परं व्योमगं वन्देऽहं शिवकामिनीसहचरं वन्दे सभानायकम् ॥ ३॥ वन्दे भूतगणाधिपं शशिनिभं वन्दे पशूनां
    पतिं वन्दे भक्तसुरद्रुमं च वरदं वन्दे मुरारीडितम् । वन्दे तिल्लवनेश्वरं शिवकरं वन्दे भवोत्तारकं वन्देऽहं
    शिवकामिनीसहचरं वन्दे सभानायकम् ॥ ४॥ वन्दे पाशविमोचकं स्मरहरं वन्दे यमस्यान्तकं वन्दे दिव्यमहोक्षगं
    गुणनिधिं वन्दे मखाधीश्वरम् । वन्दे तं निगमागमैरभिनुतं वन्दे मृडं शङ्करम् वन्देऽहं शिवकामिनीसहचरं वन्दे
    सभानायकम् ॥ ५॥ इति श्रीसभानाथ पञ्चरत्नस्तोत्रं सम्पूर्णम् ।
