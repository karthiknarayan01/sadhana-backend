id: dakshina108str
category: stotram
name:
  english: dakshina108str
  devanagari: दक्शिन१०८स्त्र्
content:
  english: shridakshinamurti ashtottarashatanamastotra || atha dhyanam|| vatavriksha tatasinam yogi dhyeyamghri
    pankajam| sharashcandra nibham pujyam jatamukuta manditam || 1|| gangadharam lalataksham vyaghra carmambaravritam|
    nagabhusham parambrahma dvijarajavatamsakam || 2|| akshamala jnanamudra vina pustaka shobhitam| shukadi
    vriddha shishyadhyam veda vedantagocaram|| 3|| yuvanam manmatharatim dakshinamurtimashraye| || atha
    dakshinamurti ashtottarashatanama stotram | om vidyarupi mahayogi shuddhajnani pinakadhrit | ratnalankrita
    sarvangi ratnamaulirjatadharah || 1|| gangadharyacalavasi mahajnani samadhikrit| aprameyo yoganidhirtarako
    bhaktavatsalah|| 2|| brahmarupi jagadvyapi vishnumurtih puratanah | ukshavahashcarmavasah pitambara
    vibhushanah|| 3|| mokshadayi mokshanidhishcandhakari jagatpatih| vidyadhari shuklatanuh vidyadayi
    ganadhipah|| 4|| praudhapasmriti samharta shashimaulirmahasvanah | sama priyo'vyayah sadhuh sarva
    vedairalankritah || 5|| haste vahnidharah shriman mrigadhari vashankarah | yajnanatha kratudhvamsi
    yajnabhokta yamantakah|| 6|| bhaktanugraha murtishca bhaktasevyo vrishadhvajah | bhasmodhdulita sarvangah
    cakshamaladharomahan || 7|| trayimurtih parambrahma nagarajairalankritah | shantarupo mahajnani sarvalokavibhushanah
    || 8|| ardhanarishvaro devomunissevyassurottamah | vyakhyanadevo bhagavan ravi candragni locanah ||
    9|| jagadgururmahadevo mahananda parayanah | jatadhari mahayogi jnanamalairalankritah || 10|| vyomaganga
    jala sthanah vishuddho yatirurjitah | tattvamurtirmahayogi mahasarasvatapradah || 11|| vyomamurtishca
    bhaktanam ishtakama phalapradah | paramurtih citsvarupi tejomurtiranamayah || 12|| vedavedanga tattvajnah
    catuhshshashti kalanidhih | bhavaroga bhayadhvamsi bhaktanamabhayapradah || 13|| nilagrivo lalataksho
    gaja carmagatipradah | aragi kamadashcatha tapasvi vishnuvallabhah || 14|| brahmacari ca samnyasi
    grihasthashrama karanah | dantah shamavatam shreshtho satyarupo dayaparah || 15|| yogapattabhiramashca
    vinadhari vicetanah | matiprajna sudhadhari mudrapustaka dharanah || 16|| vetaladi pishacaugha rakshasaugha
    vinashanah | raja yakshmadi roganam vinihanta sureshvarah || || iti shridakshinamurtyashtottarashatanamastotram
    sampurnam ||
  devanagari: श्रीदक्षिणामूर्ति अष्टोत्तरशतनामस्तोत्र ॥ अथ ध्यानम्॥ वटवृक्ष तटासीनं योगी ध्येयांघ्रि पङ्कजम्।
    शरश्चन्द्र निभं पूज्यं जटामुकुट मण्डितम् ॥ १॥ गङ्गाधरं ललाटाक्षं व्याघ्र चर्माम्बरावृतम्। नागभूषं
    परंब्रह्म द्विजराजवतंसकम् ॥ २॥ अक्षमाला ज्ञानमुद्रा वीणा पुस्तक शोभितम्। शुकादि वृद्ध शिष्याढ्यं वेद
    वेदान्तगोचरम्॥ ३॥ युवानां मन्मथारातिं दक्षिणामूर्तिमाश्रये। ॥ अथ दक्षिणामूर्ति अष्टोत्तरशतनाम स्तोत्रम्
    । ॐ विद्यारूपी महायोगी शुद्धज्ञानी पिनाकधृत् । रत्नालङ्कृत सर्वाङ्गी रत्नमौलिर्जटाधरः ॥ १॥ गङ्गाधर्यचलावासी
    महाज्ञानी समाधिकृत्। अप्रमेयो योगनिधिर्तारको भक्तवत्सलः॥ २॥ ब्रह्मरूपी जगद्व्यापी विष्णुमूर्तिः पुरातनः
    । उक्षवाहश्चर्मवासाः पीताम्बर विभूषणः॥ ३॥ मोक्षदायी मोक्षनिधिश्चान्धकारी जगत्पतिः। विद्याधारी शुक्लतनुः
    विद्यादायी गणाधिपः॥ ४॥ प्रौढापस्मृति संहर्ता शशिमौलिर्महास्वनः । साम प्रियोऽव्ययः साधुः सर्व वेदैरलङ्कृतः
    ॥ ५॥ हस्ते वह्निधरः श्रीमान् मृगधारी वशङ्करः । यज्ञनाथ क्रतुध्वंसी यज्ञभोक्ता यमान्तकः॥ ६॥ भक्तानुग्रह
    मूर्तिश्च भक्तसेव्यो वृषध्वजः । भस्मोध्दूलित सर्वाङ्गः चाक्षमालाधरोमहान् ॥ ७॥ त्रयीमूर्तिः परम्ब्रह्म
    नागराजैरलङ्कृतः । शान्तरूपो महाज्ञानी सर्वलोकविभूषणः ॥ ८॥ अर्धनारीश्वरो देवोमुनिस्सेव्यस्सुरोत्तमः
    । व्याख्यानदेवो भगवान् रवि चन्द्राग्नि लोचनः ॥ ९॥ जगद्गुरुर्महादेवो महानन्द परायणः । जटाधारी महायोगी
    ज्ञानमालैरलङ्कृतः ॥ १०॥ व्योमगङ्गा जल स्थानः विशुद्धो यतिरूर्जितः । तत्त्वमूर्तिर्महायोगी महासारस्वतप्रदः
    ॥ ११॥ व्योममूर्तिश्च भक्तानां इष्टकाम फलप्रदः । परमूर्तिः चित्स्वरूपी तेजोमूर्तिरनामयः ॥ १२॥ वेदवेदाङ्ग
    तत्त्वज्ञः चतुःष्षष्टि कलानिधिः । भवरोग भयध्वंसी भक्तानामभयप्रदः ॥ १३॥ नीलग्रीवो ललाटाक्षो गज चर्मागतिप्रदः
    । अरागी कामदश्चाथ तपस्वी विष्णुवल्लभः ॥ १४॥ ब्रह्मचारी च संन्यासी गृहस्थाश्रम कारणः । दान्तः शमवतां
    श्रेष्ठो सत्यरूपो दयापरः ॥ १५॥ योगपट्टाभिरामश्च वीणाधारी विचेतनः । मतिप्रज्ञा सुधाधारी मुद्रापुस्तक
    धारणः ॥ १६॥ वेतालादि पिशाचौघ राक्षसौघ विनाशनः । राज यक्ष्मादि रोगाणां विनिहन्ता सुरेश्वरः ॥ ॥ इति
    श्रीदक्षिणामूर्त्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
