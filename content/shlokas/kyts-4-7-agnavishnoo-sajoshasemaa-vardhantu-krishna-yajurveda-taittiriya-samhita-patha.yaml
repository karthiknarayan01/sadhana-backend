    मामु॒पागुः॑ । यो दा॒शुषः॑ सु॒कृतो॒ हव॒मुप॒ गन्ता॒ स नो॑ मुञ्च॒त्वग्ं ह॑सः । स नो॑ मुञ्च॒त्वग्ं ह॑सः
    ॥ य वँ॒शी यु॒धे यः पु॒ष्टानि॑ सग्ंसृ॒जति॑ त्र॒याणि॑ । स्तौमीन्द्र॑ न्नाथि॒तो जो॑हवीमि॒ स नो॑ मुञ्च॒त्वग्ं
    ह॑सः ॥ म॒न्वे वा म्मित्रा वरुणा॒ तस्य॑ वित्त॒ग्ं॒ सत्यौ॑जसा दृग्ंहणा॒ य । या राजा॑नग्ं स॒रथं॑ याँ॒थ
    उ॑ग्रा॒ ता नो॑ मुञ्चत॒माग॑सः ॥ यो वा॒ग्ं॒ रथ॑ ऋ॒जुर॑श्मि स्स॒त्यध॑र्मा॒ मिथु॒ श्चर॑न्त मुप॒याति॑ दू॒षयन्न्॑
    । स्तौमि॑ मि॒त्रावरु॑णा नाथि॒तो जो॑हवीमि॒ तौ नो॑ मुञ्चत॒माग॑सः ॥ वा॒यो स्स॑वि॒तु र्वि॒दथा॑नि मन्महे॒
    यावा द्बि॑भृ॒तो यौ च॒ रक्ष॑तः । यौ विश्व॑स्य परि॒भू ब॑भू॒वतु॒स्तौ नो॑ मुञ्चत॒माग॑सः ॥ उप॒ श्रेष्ठा॑न
    आ॒शिषो॑ दे॒वयो॒र्धर्मे॑ अस्थिरन्न् । स्तौमि॑ वा॒युग्ं स॑वि॒तार॑ न्नाथि॒तो जो॑हवीमि॒ तौ नो॑ मुञ्चत॒माग॑सः
    ॥ र॒थीत॑मौ रथी॒नाम॑ह्व ऊ॒तये॒ शुभ॒ ङ्गमि॑ष्ठौ सु॒यमे॑भि॒रश्वैः मोज॒स्तौ नो॑ मुञ्चत॒माग॑सः ॥ यदया॑तं
    स्त्रिच॒क्रेण॑ स॒ग्ं॒ सद॑मि॒च्छमा॑नौ । स्तौमि॑ दे॒वा व॒श्विनौ॑ नाथि॒तो जो॑हवीमि॒ तौ नो॑ मुञ्चत॒माग॑सः
    ॥ म॒रुता म्मन्वे॒ अधि॑नो ब्रुवन्तु॒ प्रेमां विँश्वा॑ मवन्तु॒ विश्वे हु॑वे सु॒यमा॑नू॒तये॒ ते नो॑ मुञ्च॒न्त्वेन॑सः
    ॥ ति॒ग्ममायु॑धं पृत॑नासु जि॒ष्णु । स्तौमि॑ दे॒वा न्म॒रुतो॑ नाथि॒तो जो॑हवीमि॒ ते नो॑ मुञ्च॒न्त्वेन॑सः
    ॥ दे॒वाना म्मन्वे॒ अधि॑ नो ब्रुवन्तु॒ प्रेमां विँश्वा॑मवन्तु॒ विश्वे हु॑वे सु॒यमा॑नू॒तये॒ ते नो॑ मुञ्च॒न्त्वेन॑सः
    ॥ यदि॒द ऽभि॒शोच॑ति॒ पौरु॑षेयेण॒ दैव्ये॑न । स्तौमि॒ विश्वा न्ना॑थि॒तो जो॑हवीमि॒ ते नो॑ मुञ्च॒न्त्वेन॑सः
    ॥ अनु॑नो॒ न्विद॑नुमते॒ त्वं ँवै श्वान॒रो न॑ ऊ॒त्यापृ॒ष्टो दि॒वि ममि॑तेभि॒ रोजो॑भि॒ र्ये प्र॑ति॒ष्ठे
    अभ॑वतां॒ वँसू॑नाम् । स्तौमि॒ द्यावा॑ पृथि॒वी ना॑थि॒तो जो॑हवीमि॒ ते नो॑ मुञ्चत॒मग्ं ह॑सः ॥ उर्वी॑ रोदसी॒
    वरि॑वः कृणोत॒ ङ्क्षेत्र॑स्य पत्नी॒ अधि॑ नो ब्रूयातम् । स्तौमि॒ द्यावा॑ पृथि॒वी ना॑थि॒तो जो॑हवीमि॒
    ते नो॑ मुञ्चत॒मग्ं ह॑सः ॥ य म्पु॑रुष॒त्रा य॑वि॒ष्ठा वि॑द्वाग्ंसश्चकृ॒मा कच्च॒ना ऽऽगः॑ । कृ॒धी स्व॑स्माग्ं
    अदि॑ते॒रना॑गा॒ व्येनाग्ं॑सि शिश्रथो॒ विष्व॑गग्ने ॥ यथा॑ ह॒ त त्प॒दिषि॒ता ममु॑ञ्चता यजत्राः । ए॒वा
    त्वम॒स्म त्प्रमु॑ञ्चा॒ व्यग्ंहः॒ प्राता र्यग्ने प्रत॒रान्न॒ आयुः॑ ॥ ङ्ग्रा॒ममिन्द्र॒ग्ं॒ स नो॑ मुञ्च॒त्वग्ं
    ह॑सः । म॒न्वे वा॒न्ता नो॑ मुञ्चत॒माग॑सः । यो वां तौ नो॑ मुञ्चत॒माग॑सः । म॒रुता ते नो॑ मुञ्च॒न्त्वेन॑सः
    । अनु॑ न॒ ते नो॑ मुञ्चत॒मग्ंह॑सो॒ यत्तै ष्षाडाग॑सश्च॒तुरेन॑सो॒ द्विरग्ंह॑सः । ॥ हरिः॑ ओम् ॥ ॥ कृष्ण
    यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे सप्तमः प्रश्न
