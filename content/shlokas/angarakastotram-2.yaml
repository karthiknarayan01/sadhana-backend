id: angarakastotram-2
category: stotram
name:
  english: angarakastotram
  devanagari: अन्गारकस्तोत्रम्
content:
  english: rinamocana angarakastotram | shrirastu | shriparamatmane namah | atha rinagrastasya rinavimocanartham
    angarakastotram | skanda uvaca | rinagrastanaranam tu rinamuktih katham bhavet | brahmovaca | vakshye'ham
    sarvalokanam hitartham hitakamadam | asya shri angarakamahamantrasya gautama rishih | anushtupchandah
    | angarako devata | mama rinavimocanarthe angarakamantrajape viniyogah | dhyanam | raktamalyambaradharah
    shulashaktigadadharah | caturbhujo meshagato varadashca dharasutah || 1|| mangalo bhumiputrashca rinaharta
    dhanapradah | sthirasano mahakayo sarvakamaphalapradah || 2|| lohito lohitakshashca samaganam kripakarah
    | dharatmajah kujo bhaumo bhumido bhuminandanah || 3|| angarako yamashcaiva sarvarogapaharakah | srishteh
    karta ca harta ca sarvadeshaishca pujitah || 4|| etani kujanamani nityam yah prayatah pathet | rinam
    na jayate tasya shriyam prapnotyasamshayah || 5|| angaraka mahiputra bhagavan bhaktavatsala | namo'stu
    te mamashesham rinamashu vinashaya || 6|| raktagandhaishca pushpaishca dhupadipairgudodanaih | mangalam
    pujayitva tu mangalahani sarvada || 7|| ekavimshati namani pathitva tu tadantike | rinarekha prakartavya
    angarena tadagratah || 8|| tashca pramarjayennityam vamapadena samsmaran | evam krite na sandehah
    rinanmuktah sukhi bhavet || 9|| mahatim shriyamapnoti dhanadena samo bhavet | bhumim ca labhate vidvan
    putranayushca vindati || 10|| mulamantrah| angaraka mahiputra bhagavan bhaktavatsala | namaste'stu
    mahabhaga rinamashu vinashaya || 11|| arghyam | bhumiputra mahatejah svedodbhava pinakinah | rinarthastvam
    prapanno'smi grihanarghyam namo'stu te || 12|| iti rinamocana angarakastotram sampurnam |
  devanagari: ऋणमोचन अङ्गारकस्तोत्रम् । श्रीरस्तु । श्रीपरमात्मने नमः । अथ ऋणग्रस्तस्य ऋणविमोचनार्थं अङ्गारकस्तोत्रम्
    । स्कन्द उवाच । ऋणग्रस्तनराणां तु ऋणमुक्तिः कथं भवेत् । ब्रह्मोवाच । वक्ष्येऽहं सर्वलोकानां हितार्थं
    हितकामदम् । अस्य श्री अङ्गारकमहामन्त्रस्य गौतम ऋषिः । अनुष्टुप्छन्दः । अङ्गारको देवता । मम ऋणविमोचनार्थे
    अङ्गारकमन्त्रजपे विनियोगः । ध्यानम् । रक्तमाल्याम्बरधरः शूलशक्तिगदाधरः । चतुर्भुजो मेषगतो वरदश्च धरासुतः
    ॥ १॥ मङ्गलो भूमिपुत्रश्च ऋणहर्ता धनप्रदः । स्थिरासनो महाकायो सर्वकामफलप्रदः ॥ २॥ लोहितो लोहिताक्षश्च
    सामगानां कृपाकरः । धरात्मजः कुजो भौमो भूमिदो भूमिनन्दनः ॥ ३॥ अङ्गारको यमश्चैव सर्वरोगापहारकः । सृष्टेः
    कर्ता च हर्ता च सर्वदेशैश्च पूजितः ॥ ४॥ एतानि कुजनामानि नित्यं यः प्रयतः पठेत् । ऋणं न जायते तस्य
    श्रियं प्राप्नोत्यसंशयः ॥ ५॥ अङ्गारक महीपुत्र भगवन् भक्तवत्सल । नमोऽस्तु ते ममाशेषं ऋणमाशु विनाशय
    ॥ ६॥ रक्तगन्धैश्च पुष्पैश्च धूपदीपैर्गुडोदनैः । मङ्गलं पूजयित्वा तु मङ्गलाहनि सर्वदा ॥ ७॥ एकविंशति
    नामानि पठित्वा तु तदन्तिके । ऋणरेखा प्रकर्तव्या अङ्गारेण तदग्रतः ॥ ८॥ ताश्च प्रमार्जयेन्नित्यं वामपादेन
    संस्मरन् । एवं कृते न सन्देहः ऋणान्मुक्तः सुखी भवेत् ॥ ९॥ महतीं श्रियमाप्नोति धनदेन समो भवेत् । भूमिं
    च लभते विद्वान् पुत्रानायुश्च विन्दति ॥ १०॥ मूलमन्त्रः। अङ्गारक महीपुत्र भगवन् भक्तवत्सल । नमस्तेऽस्तु
    महाभाग ऋणमाशु विनाशय ॥ ११॥ अर्घ्यम् । भूमिपुत्र महातेजः स्वेदोद्भव पिनाकिनः । ऋणार्थस्त्वां प्रपन्नोऽस्मि
    गृहाणार्घ्यं नमोऽस्तु ते ॥ १२॥ इति ऋणमोचन अङ्गारकस्तोत्रं सम्पूर्णम् ।
