id: saraswati-dwadasa-nama-stotram
category: stotram
name:
  english: Saraswati Dwadasa Nama Stotram
content:
  english: sarasvati tvayam drishtya vinapustakadharini | hamsavaha samayukta vidyadanakari mama || ||
    prathamam bharati nama dvitiyam ca sarasvati | tritiyam sharadadevi caturtham hamsavahana || || pancamam
    jagatikhyatam shashtham vagishvari tatha | kaumari saptamam proktamashtamam brahmacarini || || navamam
    buddhidhatri ca dashamam varadayini | ekadasham kshudraghanta dvadasham bhuvaneshvari || || brahmi
    dvadasha namani trisandhyam yah pathennarah | sarvasiddhikari tasya prasanna parameshvari | sa me
    vasatu jihvagre brahmarupa sarasvati ||
  devanagari: सरस्वती त्वयं दृष्ट्या वीणापुस्तकधारिणी । हंसवाह समायुक्ता विद्यादानकरी मम ॥ ॥ प्रथमं भारती
    नामा द्वितीयं च सरस्वती । तृतीयं शारदादेवी चतुर्थं हंसवाहना ॥ ॥ पञ्चमं जगतीख्यातं षष्ठं वागीश्वरी
    तथा । कौमारी सप्तमं प्रोक्तमष्टमं ब्रह्मचारिणी ॥ ॥ नवमं बुद्धिधात्री च दशमं वरदायिनी । एकादशं क्षुद्रघण्टा
    द्वादशं भुवनेश्वरी ॥ ॥ ब्राह्मी द्वादश नामानि त्रिसन्ध्यं यः पठेन्नरः । सर्वसिद्धिकरी तस्य प्रसन्ना
    परमेश्वरी । सा मे वसतु जिह्वाग्रे ब्रह्मरूपा सरस्वती ॥
