id: varahakavacam
category: kavacha
name:
  english: varahakavacam
  devanagari: वराहकवचम्
content:
  english: rinu kalyani vakshyami varahakavacam shubham | yena gupto labhenmartyo vijayam sarvasampadam
    || 15|| angarakshakaram punyam mahapatakanashanam | sarvarogaprashamanam sarvadurgrahanashanam ||
    16|| vishabhicarakrityadi shatrupidanivaranam | noktam kasyapi purvam hi gopyadgopyataram yatah ||
    17|| varahena pura proktam mahyam ca parameshthine | yuddheshu jayadam devi shatrupidanivaranam ||
    18|| varahakavacadgupto nashubham labhate narah | varahakavacasyasya rishirbrahma prakirtitah || 19||
    chando'nushtup tatha devo varaho bhuparigrahah | prakshalya padau pani ca samyagacamya varina || 20||
    kritasvangakaranyasah sapavitra udanmukhah | om bhurbhuvahsuvariti namo bhupataye'pi ca || 21|| namo
    bhagavate pashcadvarahaya namastatha | evam shadangam nyasam ca nyasedangulishu kramat || 22|| namah
    shvetavarahaya mahakolaya bhupate | yajnangaya shubhangaya sarvajnaya paratmane || 23|| sravatundaya
    dhiraya parabrahmasvarupine | vakradamshtraya nityaya namo'ntairnamabhih kramat || 24|| angulishu
    nyasedvidvan karaprishthataleshvapi | dhyatva shvetavaraham ca pashcanmantramudirayet || 25|| om shvetam
    varahavapusham kshitimuddharantam shankharisarvavaradabhayayuktabahum | dhyayennijaishca tanubhih
    sakalairupetam purnam vibhum sakalavanchitasiddhaye'jam || 26|| varahah purvatah patu dakshine dandakantakah
    | hiranyakshaharah patu pashcime gadaya yutah || 27|| uttare bhumihritpatu adhastadvayu vahanah |
    urdhvam patu hrishikesho digvidikshu gadadharah || 28|| pratah patu prajanathah kalpakritsangame'vatu
    | madhyahne vajrakeshastu sayahne sarvapujitah || 29|| pradoshe patu padmaksho ratrau rajivalocanah
    | nishindragarvaha patu patushah parameshvarah || 30|| atavyamagrajah patu gamane garudasanah | sthale
    patu mahatejah jale patvavanipatih || 31|| grihe patu grihadhyakshah padmanabhah puro'vatu | jhillikavaradah
    patu svagrame karunakarah || 32|| ranagre daityaha patu vishame patu cakrabhrit | rogeshu vaidyarajastu
    kolo vyadhishu rakshatu || 33|| tapatrayattapomurtih karmapashacca vishvakrit | kleshakaleshu sarveshu
    patu padmapatirvibhuh || 34|| hiranyagarbhasamstutyah padau patu nirantaram | gulphau gunakarah patu
    janghe patu janardanah || 35|| janu ca jayakritpatu paturu purushottamah | raktaksho jaghane patu
    katim vishvambharo'vatu || 36|| parshve patu suradhyakshah patu kukshim paratparah | nabhim brahmapita
    patu hridayam hridayeshvarah || 37|| mahadamshtrah stanau patu kantham patu vimuktidah | prabhanjanapatirbahu
    karau kamapita'vatu || 38|| hastau hamsapatih patu patu sarvangulirharih | sarvangashcibukam patu
    patvoshthau kalanemiha || 39|| mukham tu madhuha patu dantan damodaro'vatu | nasikamavyayah patu netre
    suryendulocanah || 40|| phalam karmaphaladhyakshah patu karnau maharathah | sheshashayi shirah patu
    keshan patu niramayah || 41|| sarvangam patu sarveshah sada patu satishvarah | itidam kavacam punyam
    varahasya mahatmanah || 42|| yah pathecchrinuyadvapi tasya mrityurvinashyati | tam namasyanti bhutani
    bhitah sanjalipanayah || 43|| rajadasyubhayam nasti rajyabhramsho na jayate | yannamasmaranadbhitah
    bhutavetaḻarakshasah || 44|| maharogashca nashyanti satyam satyam vadamyaham | kanthe tu kavacam baddhva
    vandhya putravati bhavet || 45|| shatrusainyakshayapraptih duhkhaprashamanam tatha | utpatadurnimittadi
    sucitarishtanashanam || 46|| brahmavidyaprabodham ca labhate natra samshayah | dhritvedam kavacam
    punyam mandhata paraviraha || 47|| jitva tu shambarim mayam daityendranavadhikshanat | kavacenavrito
    bhutva devendro'pi surariha || 48|| bhumyopadishtakavacadharanannarako'pi ca | sarvavadhyo jayi bhutva
    mahatim kirtimaptavan || 49|| ashvatthamule'rkavare nityapushkarinitate | varahakavacam japtva shatavaram
    pathedyadi || 50|| apurvarajyasampraptim nashtasya punaragamam | labhate natra sandehah satyametanmayoditam
    || 51|| japtva varahamantram tu lakshamekam nirantaram | dashamsham tarpanam homam payasena ghritena
    ca || 52|| kurvan trikalasandhyasu kavacenavrito yadi | bhumandaladhipatyam ca labhate natra samshayah
    || 53|| idamuktam maya devi gopaniyam duratmanam | varahakavacam punyam samsararnavatarakam || 54||
    mahapatakakotighnam bhuktimuktiphalapradam | vacyam putraya shishyaya sadvrittaya sudhimate || 55||
    shrisutah
  devanagari: ृणु कल्याणि वक्ष्यामि वाराहकवचं शुभम् । येन गुप्तो लभेन्मर्त्यो विजयं सर्वसम्पदम् ॥ १५॥
    अङ्गरक्षाकरं पुण्यं महापातकनाशनम् । सर्वरोगप्रशमनं सर्वदुर्ग्रहनाशनम् ॥ १६॥ विषाभिचारकृत्यादि शत्रुपीडानिवारणम्
    । नोक्तं कस्यापि पूर्वं हि गोप्याद्गोप्यतरं यतः ॥ १७॥ वराहेण पुरा प्रोक्तं मह्यं च परमेष्ठिने । युद्धेषु
    जयदं देवि शत्रुपीडानिवारणम् ॥ १८॥ वराहकवचाद्गुप्तो नाशुभं लभते नरः । वराहकवचस्यास्य ऋषिर्ब्रह्मा प्रकीर्तितः
    ॥ १९॥ छन्दोऽनुष्टुप् तथा देवो वराहो भूपरिग्रहः । प्रक्षाल्य पादौ पाणी च सम्यगाचम्य वारिणा ॥ २०॥ कृतस्वाङ्गकरन्यासः
    सपवित्र उदङ्मुखः । ओं भूर्भुवःसुवरिति नमो भूपतयेऽपि च ॥ २१॥ नमो भगवते पश्चाद्वराहाय नमस्तथा । एवं
    षडङ्गं न्यासं च न्यसेदङ्गुलिषु क्रमात् ॥ २२॥ नमः श्वेतवराहाय महाकोलाय भूपते । यज्ञाङ्गाय शुभाङ्गाय
    सर्वज्ञाय परात्मने ॥ २३॥ स्रवतुण्डाय धीराय परब्रह्मस्वरूपिणे । वक्रदंष्ट्राय नित्याय नमोऽन्तैर्नामभिः
    क्रमात् ॥ २४॥ अङ्गुलीषु न्यसेद्विद्वान् करपृष्ठतलेष्वपि । ध्यात्वा श्वेतवराहं च पश्चान्मन्त्रमुदीरयेत्
    ॥ २५॥ ॐ श्वेतं वराहवपुषं क्षितिमुद्धरन्तं शङ्खारिसर्ववरदाभययुक्तबाहुम् । ध्यायेन्निजैश्च तनुभिः सकलैरुपेतं
    पूर्णं विभुं सकलवाञ्छितसिद्धयेऽजम् ॥ २६॥ वराहः पूर्वतः पातु दक्षिणे दण्डकान्तकः । हिरण्याक्षहरः पातु
    पश्चिमे गदया युतः ॥ २७॥ उत्तरे भूमिहृत्पातु अधस्ताद्वायु वाहनः । ऊर्ध्वं पातु हृषीकेशो दिग्विदिक्षु
    गदाधरः ॥ २८॥ प्रातः पातु प्रजानाथः कल्पकृत्सङ्गमेऽवतु । मध्याह्ने वज्रकेशस्तु सायाह्ने सर्वपूजितः
    ॥ २९॥ प्रदोषे पातु पद्माक्षो रात्रौ राजीवलोचनः । निशीन्द्रगर्वहा पातु पातूषः परमेश्वरः ॥ ३०॥ अटव्यामग्रजः
    पातु गमने गरुडासनः । स्थले पातु महातेजाः जले पात्ववनीपतिः ॥ ३१॥ गृहे पातु गृहाध्यक्षः पद्मनाभः पुरोऽवतु
    । झिल्लिकावरदः पातु स्वग्रामे करुणाकरः ॥ ३२॥ रणाग्रे दैत्यहा पातु विषमे पातु चक्रभृत् । रोगेषु वैद्यराजस्तु
    कोलो व्याधिषु रक्षतु ॥ ३३॥ तापत्रयात्तपोमूर्तिः कर्मपाशाच्च विश्वकृत् । क्लेशकालेषु सर्वेषु पातु पद्मापतिर्विभुः
    ॥ ३४॥ हिरण्यगर्भसंस्तुत्यः पादौ पातु निरन्तरम् । गुल्फौ गुणाकरः पातु जङ्घे पातु जनार्दनः ॥ ३५॥ जानू
    च जयकृत्पातु पातूरू पुरुषोत्तमः । रक्ताक्षो जघने पातु कटिं विश्वम्भरोऽवतु ॥ ३६॥ पार्श्वे पातु सुराध्यक्षः
    पातु कुक्षिं परात्परः । नाभिं ब्रह्मपिता पातु हृदयं हृदयेश्वरः ॥ ३७॥ महादंष्ट्रः स्तनौ पातु कण्ठं
    पातु विमुक्तिदः । प्रभञ्जनपतिर्बाहू करौ कामपिताऽवतु ॥ ३८॥ हस्तौ हंसपतिः पातु पातु सर्वाङ्गुलीर्हरिः
    । सर्वाङ्गश्चिबुकं पातु पात्वोष्ठौ कालनेमिहा ॥ ३९॥ मुखं तु मधुहा पातु दन्तान् दामोदरोऽवतु । नासिकामव्ययः
    पातु नेत्रे सूर्येन्दुलोचनः ॥ ४०॥ फालं कर्मफलाध्यक्षः पातु कर्णौ महारथः । शेषशायी शिरः पातु केशान्
    पातु निरामयः ॥ ४१॥ सर्वाङ्गं पातु सर्वेशः सदा पातु सतीश्वरः । इतीदं कवचं पुण्यं वराहस्य महात्मनः ॥
    ४२॥ यः पठेच्छृणुयाद्वापि तस्य मृत्युर्विनश्यति । तं नमस्यन्ति भूतानि भीताः साञ्जलिपाणयः ॥ ४३॥ राजदस्युभयं
    नास्ति राज्यभ्रंशो न जायते । यन्नामस्मरणाद्भीताः भूतवेताळराक्षसाः ॥ ४४॥ महारोगाश्च नश्यन्ति सत्यं
    सत्यं वदाम्यहम् । कण्ठे तु कवचं बद्ध्वा वन्ध्या पुत्रवती भवेत् ॥ ४५॥ शत्रुसैन्यक्षयप्राप्तिः दुःखप्रशमनं
    तथा । उत्पातदुर्निमित्तादि सूचितारिष्टनाशनम् ॥ ४६॥ ब्रह्मविद्याप्रबोधं च लभते नात्र संशयः । धृत्वेदं
    कवचं पुण्यं मान्धाता परवीरहा ॥ ४७॥ जित्वा तु शाम्बरीं मायां दैत्येन्द्रानवधीक्षणात् । कवचेनावृतो भूत्वा
    देवेन्द्रोऽपि सुरारिहा ॥ ४८॥ भूम्योपदिष्टकवचधारणान्नरकोऽपि च । सर्वावध्यो जयी भूत्वा महतीं कीर्तिमाप्तवान्
    ॥ ४९॥ अश्वत्थमूलेऽर्कवारे नित्यपुष्करिणीतटे । वराहकवचं जप्त्वा शतवारं पठेद्यदि ॥ ५०॥ अपूर्वराज्यसंप्राप्तिं
    नष्टस्य पुनरागमम् । लभते नात्र सन्देहः सत्यमेतन्मयोदितम् ॥ ५१॥ जप्त्वा वराहमन्त्रं तु लक्षमेकं निरन्तरम्
    । दशांशं तर्पणं होमं पायसेन घृतेन च ॥ ५२॥ कुर्वन् त्रिकालसन्ध्यासु कवचेनावृतो यदि । भूमण्डलाधिपत्यं
    च लभते नात्र संशयः ॥ ५३॥ इदमुक्तं मया देवि गोपनीयं दुरात्मनाम् । वराहकवचं पुण्यं संसारार्णवतारकम्
    ॥ ५४॥ महापातककोटिघ्नं भुक्तिमुक्तिफलप्रदम् । वाच्यं पुत्राय शिष्याय सद्वृत्ताय सुधीमते ॥ ५५॥ श्रीसूतः
