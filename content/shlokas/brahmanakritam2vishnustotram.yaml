id: brahmanakritam2vishnustotram
category: stotram
name:
  english: brahmanakritam2vishnustotram
  devanagari: ब्रह्मणाकृतं२विष्णुस्तोत्रम्
content:
  english: brahmana kritam 2 vishnustotram brahmovaca | namo namaste'stu sahasramurte sahasrabaho bahuvaktrapada
    | namo namaste jagatah pravrittivinashasamsthanaparaprameya || 21|| sukshmatisukshmam ca brihatpramanam
    gariyasamapyatigauravatman | pradhanabuddhindriyavakpradhanamulaparatmanbhagavanprasida || 22|| esha
    mahi deva mahiprasutairmahasuraih piditashailabandha | parayanam tvam jagatamupaiti bharavatararthamaparaparam
    || 23|| ete vayam vritraripustatha'yam nasatyadasrau varunastathaishah | ime ca rudra vasavah sasuryah
    samiranagnipramukhastatha'nye || 24|| surah samastah suranatha karyamebhirmaya yacca tadisha sarvam
    | ajnapayajnam pratipalayantastavaiva tishthama sada'stadoshah || 25|| iti brahmapurane ekashityadhikashatatamadhyayantargatam
    brahmana kritam vishnustotram samaptam | brahmapurana | adhyaya 181
  devanagari: ब्रह्मणा कृतं २ विष्णुस्तोत्रम् ब्रह्मोवाच । नमो नमस्तेऽस्तु सहस्रमूर्ते सहस्रबाहो बहुवक्त्रपाद
    । नमो नमस्ते जगतः प्रवृत्तिविनाशसंस्थानपराप्रमेय ॥ २१॥ सूक्ष्मातिसूक्ष्मं च बृहत्प्रमाणं गरीयसामप्यतिगौरवात्मन्
    । प्रधानबुद्धीन्द्रियवाक्प्रधानमूलापरात्मन्भगवन्प्रसीद ॥ २२॥ एषा मही देव महीप्रसूतैर्महासुरैः पीडितशैलबन्धा
    । परायणं त्वां जगतामुपैति भारावतारार्थमपारपारम् ॥ २३॥ एते वयं वृत्ररिपुस्तथाऽयं नासत्यदस्रौ वरुणस्तथैषः
    । इमे च रुद्रा वसवः ससूर्याः समीरणाग्निप्रमुखास्तथाऽन्ये ॥ २४॥ सुराः समस्ताः सुरनाथ कार्यमेभिर्मया
    यच्च तदीश सर्वम् । आज्ञापयाज्ञां प्रतिपालयन्तस्तवैव तिष्ठाम सदाऽस्तदोषाः ॥ २५॥ इति ब्रह्मपुराणे एकाशीत्यधिकशततमाध्यायान्तर्गतं
    ब्रह्मणा कृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १८१
meaning: {}
