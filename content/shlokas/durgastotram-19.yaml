id: durgastotram-19
category: stotram
name:
  english: durgastotram 19
  devanagari: दुर्गास्तोत्रम् १९
content:
  english: durgastotram 19 brahmavishnushivadinam pujyam vandyam sanatanim | narayanim vishnumayam vaishnavim
    vishnubhaktidam || 9|| sarvasvarupam sarvesham sarvadharam paratparam | sarvavidyasarvamantrasarvashaktisvarupinim
    || 10|| sagunam nirgunam sattvam varam svecchamayim satim | mahavishnoshca jananim krishnasyarddhangasambhavam
    || 11|| krishnapriyam krishnashaktim krishnabuddhyadhidevatam | krishnastutam krishnapujyam krishnavandyam
    kripamayim || 12|| taptakancanavarnabham kotisuryasamaprabham | ishaddhasyaprasannasyam bhaktanugrahakarikam
    || 13|| durgam shatabhujam devim mahaddurgatinashinim | trilocanapriyam sadhvim trigunam ca trilocanam
    || 14|| trilocanapranarupam shuddharddhacandrashekharam | bibhratim kabaribharam malatimalyamanditam
    || 15|| vartulam vamavaktram ca shambhormanasamohinim | ratnakundalayugmena gandasthalavirajitam ||
    16|| nasadakshinabhagena bibhratim gajamauktikam | amulyaratnam bahulam bibhratim shravanopari ||
    17|| muktapanktivinindyaikadantapanktisushobhitam | pakvabimbadharoshthim ca suprasannam sumangalam
    || 18|| citrapatravaliramyakapolayugalojjvalam | ratnakeyuravalayaratnamanjiraranjitam || 19|| ratnakankanabhushadhyam
    ratnapashankashobhitam | ratnanguliyanikaraih karangulicayojjvalam || 20|| padangulinakhasaktalaktarekhasushobhanam
    | vahnishuddhamshukadhanam gandhacandanacarcitam || 21|| bibhratim stanayugmam ca kasturibindushobhitam
    | sarvarupagunavatim gajendramandagaminim || 22|| ativa kantam shantam ca nitantam yogasiddhishu |
    vidhatushca vidhatrim ca sarvadhatrim ca shankarim || 23|| sharatparvanacandrasyamativa sumanoharam
    | kasturibindubhih sarddhamadhashcandanabinduna || 24|| sindurabinduna shashvadbhalamadhyasthalojjvalam
    | sharanmadhyahnakamalaprabhamocanalocanam || 25|| carukajjalarekhabhyam sarvatashca samujjvalam |
    kotikandarpalavanyalilaninditavigraham || 26|| ratnasimhasanastham ca sadratnamukutojjvalam | srishtau
    srashtuh shilparupam dayam patushca palane || 27|| samharakale samharttuh param samhararupinim | nishumbhashumbhamathinim
    mahishasuramardinim || 28|| pura tripurayuddhe ca samstuta tripurarina | madhukaitabhayoryuddhe vishnushaktisvarupinim
    || 29|| sarvadaityanihantrim ca raktabijavinashinim | nrisimhashaktirupam ca hiranyakashiporvadhe
    || 30|| varahashaktim varahe hiranyakshavadhe tatha | parabrahmasvarupam ca sarvashaktim sada bhaje
    || 31|| iti dhyatva svashirasi pushpam dattva vicakshanah | punardhyatva caiva bhaktya kuryadavahanam
    tatah || 32|| iti shribrahmavaivartte mahapurane dvitiye prakritikhande catushshashtitamadhyayantargatam
    durgastotram samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 64
  devanagari: दुर्गास्तोत्रम् १९ ब्रह्मविष्णुशिवादीनां पूज्यां वन्द्यां सनातनीम् । नारायणीं विष्णुमायां
    वैष्णवीं विष्णुभक्तिदाम् ॥ ९॥ सर्वस्वरूपां सर्वेषां सर्वाधारां परात्पराम् । सर्वविद्यासर्वमन्त्रसर्वशक्तिस्वरूपिणीम्
    ॥ १०॥ सगुणां निर्गुणां सत्त्वां वरां स्वेच्छामयीं सतीम् । महाविष्णोश्च जननीं कृष्णस्यार्द्धाङ्गसम्भवाम्
    ॥ ११॥ कृष्णप्रियां कृष्णशक्तिं कृष्णबुद्ध्यधिदेवताम् । कृष्णस्तुतां कृष्णपूज्यां कृष्णवन्द्यां कृपामयीम्
    ॥ १२॥ तप्तकाञ्चनवर्णाभां कोटिसूर्यसमप्रभाम् । ईषद्धास्यप्रसन्नास्यां भक्तानुग्रहकारिकाम् ॥ १३॥ दुर्गां
    शतभुजां देवीं महद्दुर्गतिनाशिनीम् । त्रिलोचनप्रियां साध्वीं त्रिगुणां च त्रिलोचनाम् ॥ १४॥ त्रिलोचनप्राणरूपां
    शुद्धार्द्धचन्द्रशेखराम् । बिभ्रतीं कबरीभारं मालतीमाल्यमण्डितम् ॥ १५॥ वर्तुलं वामवक्त्रं च शम्भोर्मानसमोहिनीम्
    । रत्नकुण्डलयुग्मेन गण्डस्थलविराजिताम् ॥ १६॥ नासादक्षिणभागेन बिभ्रतीं गजमौक्तिकम् । अमूल्यरत्नं बहुलं
    बिभ्रतीं श्रवणोपरि ॥ १७॥ मुक्तापङ्क्तिविनिन्द्यैकदन्तपङ्क्तिसुशोभिताम् । पक्वबिम्बाधरोष्ठीं च सुप्रसन्नां
    सुमङ्गलाम् ॥ १८॥ चित्रपत्रावलीरम्यकपोलयुगलोज्ज्वलाम् । रत्नकेयूरवलयरत्नमञ्जीररञ्जिताम् ॥ १९॥ रत्नकङ्कणभूषाढ्यां
    रत्नपाशाङ्कशोभिताम् । रत्नाङ्गुलीयनिकरैः कराङ्गुलिचयोज्ज्वलाम् ॥ २०॥ पादाङ्गुलिनखासक्तालक्तरेखासुशोभनाम्
    । वह्निशुद्धांशुकाधानां गन्धचन्दनचर्चिताम् ॥ २१॥ बिभ्रतीं स्तनयुग्मं च कस्तूरीबिन्दुशोभितम् । सर्वरूपगुणवतीं
    गजेन्द्रमन्दगामिनीम् ॥ २२॥ अतीव कान्तां शान्तां च नितान्तां योगसिद्धिषु । विधातुश्च विधात्रीं च सर्वधात्रीं
    च शङ्करीम् ॥ २३॥ शरत्पार्वणचन्द्रास्यामतीव सुमनोहराम् । कस्तूरीबिन्दुभिः सार्द्धमधश्चन्दनबिन्दुना
    ॥ २४॥ सिन्दूरबिन्दुना शश्वद्भालमध्यस्थलोज्ज्वलाम् । शरन्मध्याह्नकमलप्रभामोचनलोचनाम् ॥ २५॥ चारुकज्जलरेखाभ्यां
    सर्वतश्च समुज्ज्वलाम् । कोटिकन्दर्पलावण्यलीलानिन्दितविग्रहाम् ॥ २६॥ रत्नसिंहासनस्थां च सद्रत्नमुकुटोज्ज्वलाम्
    । सृष्टौ स्रष्टुः शिल्परूपां दयां पातुश्च पालने ॥ २७॥ संहारकाले संहर्त्तुः परां संहाररूपिणीम् । निशुम्भशुम्भमथिनीं
    महिषासुरमर्दिनीम् ॥ २८॥ पुरा त्रिपुरयुद्धे च संस्तुता त्रिपुरारिणा । मधुकैटभयोर्युद्धे विष्णुशक्तिस्वरूपिणीम्
    ॥ २९॥ सर्वदैत्यनिहन्त्रीं च रक्तबीजविनाशिनीम् । नृसिंहशक्तिरूपां च हिरण्यकशिपोर्वधे ॥ ३०॥ वराहशक्तिं
    वाराहे हिरण्याक्षवधे तथा । परब्रह्मस्वरूपां च सर्वशक्तिं सदा भजे ॥ ३१॥ इति ध्यात्वा स्वशिरसि पुष्पं
    दत्त्वा विचक्षणः । पुनर्ध्यात्वा चैव भक्त्या कुर्यादावाहनं ततः ॥ ३२॥ इति श्रीब्रह्मवैवर्त्ते महापुराणे
    द्वितीये प्रकृतिखण्डे चतुष्षष्टितमाध्यायान्तर्गतं दुर्गास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड
    । अध्याय ६४
