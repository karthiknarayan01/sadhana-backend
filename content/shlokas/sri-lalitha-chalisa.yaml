id: sri-lalitha-chalisa
category: stotram
name:
  english: Sri Lalitha Chalisa
content:
  english: lalitamata shambhupriya jagatiki mulam nivamma shri bhuvaneshvari avataram jagamantatiki adharam
    || || herambuniki matavuga hariharadulu sevimpa candunimunduni samharam camundeshvari avataram ||
    || padmarekula kantulalo balatripurasundariga hamsavahanarudhiniga vedamatavai vaccitivi || || shvetavastramu
    dhariyinci aksharamalanu pattukòni bhaktimargamu cupitivi jnanajyotini nimpitivi || || nitya annadaneshvariga
    kashipuramuna kòluvunda adibikshuvai vaccadu sakshadaparameshvarudu || || kadambavana sancariniga
    kameshvaruni kalatramuga kamitartha pradayiniga kanci kamakshivainavu || || shricakraraja nilayiniga
    shrimat tripurasundariga siri sampadalu ivvamma shrimahalakshmiga ravamma || || manidvipamuna kòluvundi
    mahakali avataramulo mahishasuruni campitivi mullokalanu elitivi || || pasidi vènnèla kantulalo pattuvastrapudharanalo
    parijatapu malalalo parvati deviga vaccitivi || || raktavastramu dhariyinci ranarangamuna praveshinci
    raktabijuni hatamarci ramyakapardinivainavu || || kartikeyuniki matavuga katyayiniga karuninci kaliyugamanta
    kapada kanakadurgavai vèlisitivi || || ramalingeshvaru raniviga ravikula somuni ramaniviga rama vani
    sevitaga rajarajeshvarivainavu || || khadgam shulam dhariyinci pashupatastramu cebuni shumbha nishumbhula
    dunumadi vaccindi shrishyamalaga || || mahamantradhidevataga lalitatripurasundariga daridra badhalu
    tòliginci mahadanandamu kaligince || || artatrana parayanive advaitamrita varshinive adishankara pujitave
    aparnadevi ravamma || || vishnu padamuna janiyinci gangavataramu èttitivi bhagirathudu ninu kòluva
    bhulokaniki vaccitivi || || ashutoshuni mèppinci ardhashariram dalcitivi adiprakriti rupiniga darshanamiccènu
    jagadamba || || dakshuni inta janiyinci satideviga calinci ashtadasha pitheshvariga darshanamiccènu
    jagadamba || || shankhu cakramu dhariyinci rakshasa samharamunu cesi lokarakshana cesavu bhaktula
    madilo nilicavu || || parabhattarika devataga paramashanta svarupiniga cirunavvulanu cindistu cèriku
    gadanu dharayincitivi || || pancadashakshari mantradhitaga parameshvara parameshvarito pramathaganamulu
    kòluvunda kailasambe pulakince || || surulu asurulu andarunu shirasunu vanci mròkkanga manikyala kantulato
    ni padamulu mèrisinavi || || muladhara cakramulo yoginulaku adishvariyai ankushayudha dhariniga bhasillènu
    shri jagadamba || || sarvadevatala shaktulace satya svarupini rupòndi shankhanadamu cesitivi simhavahiniga
    vaccitivi || || mahameruvu nilayinivi mandara kusuma malalato munulandaru ninu kòlavanga mokshamargamu
    cupitivi || || cidambareshvari ni lila cidvilasame ni srishti cidrupi paradevataga cirunavvulanu cindince
    || || amba shambhavi avataram amritapanam ni namam adbhutamainadi ni mahima atisundaramu ni rupam
    || || ammalaganna ammavuga muggurammalaku mulamuga jnanaprasuna ravamma jnanamunandarikivvamma ||
    || nishthato ninne kòlicèdamu ni pujalane cesèdamu kashtamulanni kadaterci kanikaramuto mamu kapadu
    || || rakshasa badhalu padaleka devatalanta prarthimpa abhayahastamu cupitivi avataramulu dalcitivi
    || || arunarunapu kantulalo agni varnapu jvalalalo asurulanandari dunumadi aparajitavai vaccitivi
    || || girirajuniki putrikaga nandananduni sodariga bhulokaniki vaccitivi bhaktula korkèlu tircitivi
    || || parameshvaruniki priyasatiga jagamantatiki matavuga andari sevalu andukòni antata nive ninditivi
    || || karunincamma lalitamma kapadamma durgamma darshanamiyyaga ravamma bhaktula kashtam tircamma
    || || e vidhamuga ninu kòlicinanu e peruna ninu pilicinanu matrihridayavai dayacupu karunamurtiga
    kapadu || || mallèlu mòllalu tèccitimi manasunu nike iccitimi maguvalamanta ceritimi ni parayana cesitimi
    || || trimatrirupa lalitamma srishti sthiti layakarinivi ni namamulu ènnènno lèkkincuta ma taramavuna
    || || ashritulandaru rarandi ammarupamu cudandi ammaku nirajanamicci amma divèna pòndudamu || || sadacara
    sampannavuga samagana priyalolinivi sadashiva kutumbinivi saubhagyamicce devatavu || || mangalagauri
    rupamunu manasula ninda nimpandi mahadeviki manamanta mangala haratuliddamu ||
  devanagari: ललितामाता शम्भुप्रिया जगतिकि मूलं नीवम्मा श्री भुवनेश्वरि अवतारं जगमन्तटिकी आधारम् ॥ ॥ हेरम्बुनिकि
    मातवुगा हरिहरादुलु सेविम्प चण्डुनिमुण्डुनि संहारं चामुण्डेश्वरि अवतारम् ॥ ॥ पद्मरेकुल कान्तुललो बालात्रिपुरसुन्दरिगा
    हंसवाहनारूढिणिगा वेदमातवै वच्चितिवि ॥ ॥ श्वेतवस्त्रमु धरियिञ्चि अक्षरमालनु पट्टुकॊनि भक्तिमार्गमु
    चूपितिवि ज्ञानज्योतिनि निम्पितिवि ॥ ॥ नित्य अन्नदानेश्वरिगा काशीपुरमुन कॊलुवुण्ड आदिबिक्षुवै वच्चाडु
    साक्षादापरमेश्वरुडु ॥ ॥ कदम्बवन सञ्चारिणिगा कामेश्वरुनि कलत्रमुगा कामितार्थ प्रदायिनिगा कञ्चि कामाक्षिवैनावु
    ॥ ॥ श्रीचक्रराज निलयिनिगा श्रीमत् त्रिपुरसुन्दरिगा सिरि सम्पदलु इव्वम्मा श्रीमहालक्ष्मिगा रावम्मा
    ॥ ॥ मणिद्वीपमुन कॊलुवुण्डि महाकालि अवतारमुलो महिषासुरुनि चम्पितिवि मुल्लोकालनु एलितिवि ॥ ॥ पसिडि वॆन्नॆल
    कान्तुललो पट्टुवस्त्रपुधारणलो पारिजातपु मालललो पार्वति देविगा वच्चितिवि ॥ ॥ रक्तवस्त्रमु धरियिञ्चि
    रणरङ्गमुन प्रवेशिञ्चि रक्तबीजुनि हतमार्चि रम्यकपर्दिनिवैनावु ॥ ॥ कार्तिकेयुनिकि मातवुगा कात्यायिनिगा
    करुणिञ्चि कलियुगमन्ता कापाड कनकदुर्गवै वॆलिसितिवि ॥ ॥ रामलिङ्गेश्वरु राणिविगा रविकुल सोमुनि रमणिविगा
    रमा वाणि सेवितगा राजराजेश्वरिवैनावु ॥ ॥ खड्गं शूलं धरियिञ्चि पाशुपतास्त्रमु चेबूनि शुम्भ निशुम्भुल
    दुनुमाडि वच्चिन्दि श्रीश्यामलगा ॥ ॥ महामन्त्राधिदेवतगा ललितात्रिपुरसुन्दरिगा दरिद्र बाधलु तॊलिगिञ्चि
    महदानन्दमु कलिगिञ्चे ॥ ॥ अर्तत्राण परायणिवे अद्वैतामृत वर्षिणिवे आदिशङ्कर पूजितवे अपर्णादेवि रावम्मा
    ॥ ॥ विष्णु पादमुन जनियिञ्चि गङ्गावतारमु ऎत्तितिवि भागीरथुडु निनु कॊलुव भूलोकानिकि वच्चितिवि ॥ ॥ आशुतोषुनि
    मॆप्पिञ्चि अर्धशरीरं दाल्चितिवि आदिप्रकृति रूपिणिगा दर्शनमिच्चॆनु जगदम्बा ॥ ॥ दक्षुनि इण्ट जनियिञ्चि
    सतीदेविगा चालिञ्चि अष्टादश पीठेश्वरिगा दर्शनमिच्चॆनु जगदम्बा ॥ ॥ शङ्खु चक्रमु धरियिञ्चि राक्षस संहारमुनु
    चेसि लोकरक्षण चेसावु भक्तुल मदिलो निलिचावु ॥ ॥ पराभट्टारिक देवतगा परमशान्त स्वरूपिणिगा चिरुनव्वुलनु
    चिन्दिस्तू चॆऋकु गडनु धरयिञ्चितिवि ॥ ॥ पञ्चदशाक्षरि मन्त्राधितगा परमेश्वर परमेश्वरितो प्रमथगणमुलु
    कॊलुवुण्ड कैलासम्बे पुलकिञ्चे ॥ ॥ सुरुलु असुरुलु अन्दरुनु शिरसुनु वञ्चि म्रॊक्कङ्गा माणिक्याल कान्तुलतो
    नी पादमुलु मॆरिसिनवि ॥ ॥ मूलाधार चक्रमुलो योगिनुलकु आदीश्वरियै अङ्कुशायुध धारिणिगा भासिल्लॆनु श्री
    जगदम्बा ॥ ॥ सर्वदेवतल शक्तुलचे सत्य स्वरूपिणि रूपॊन्दि शङ्खनादमु चेसितिवि सिंहवाहिनिगा वच्चितिवि ॥
    ॥ महामेरुवु निलयिनिवि मन्दार कुसुम माललतो मुनुलन्दरु निनु कॊलवङ्ग मोक्षमार्गमु चूपितिवि ॥ ॥ चिदम्बरेश्वरि
    नी लील चिद्विलासमे नी सृष्टि चिद्रूपी परदेवतगा चिरुनव्वुलनु चिन्दिञ्चे ॥ ॥ अम्बा शाम्भवि अवतारं अमृतपानं
    नी नामं अद्भुतमैनदि नी महिम अतिसुन्दरमु नी रूपम् ॥ ॥ अम्मलगन्न अम्मवुगा मुग्गुरम्मलकु मूलमुगा ज्ञानप्रसूना
    रावम्मा ज्ञानमुनन्दरिकिव्वम्मा ॥ ॥ निष्ठतो निन्ने कॊलिचॆदमु नी पूजलने चेसॆदमु कष्टमुलन्नी कडतेर्चि
    कनिकरमुतो ममु कापाडु ॥ ॥ राक्षस बाधलु पडलेक देवतलन्ता प्रार्थिम्प अभयहस्तमु चूपितिवि अवतारमुलु दाल्चितिवि
    ॥ ॥ अरुणारुणपु कान्तुललो अग्नि वर्णपु ज्वालललो असुरुलनन्दरि दुनुमाडि अपराजितवै वच्चितिवि ॥ ॥ गिरिराजुनिकि
    पुत्रिकगा नन्दनन्दुनि सोदरिगा भूलोकानिकि वच्चितिवि भक्तुल कोर्कॆलु तीर्चितिवि ॥ ॥ परमेश्वरुनिकि प्रियसतिगा
    जगमन्तटिकी मातवुगा अन्दरि सेवलु अन्दुकॊनि अन्तट नीवे निण्डितिवि ॥ ॥ करुणिञ्चम्मा ललितम्मा कापाडम्मा
    दुर्गम्मा दर्शनमिय्यग रावम्मा भक्तुल कष्टं तीर्चम्मा ॥ ॥ ए विधमुगा निनु कॊलिचिननु ए पेरुन निनु पिलिचिननु
    मातृहृदयवै दयचूपु करुणामूर्तिगा कापाडु ॥ ॥ मल्लॆलु मॊल्ललु तॆच्चितिमि मनसुनु नीके इच्चितिमि मगुवलमन्ता
    चेरितिमि नी पारायण चेसितिमि ॥ ॥ त्रिमातृरूपा ललितम्मा सृष्टि स्थिति लयकारिणिवि नी नाममुलु ऎन्नॆन्नो
    लॆक्किञ्चुट मा तरमवुना ॥ ॥ आश्रितुलन्दरु रारण्डि अम्मरूपमु चूडण्डि अम्मकु नीराजनमिच्चि अम्म दीवॆन
    पॊन्दुदमु ॥ ॥ सदाचार सम्पन्नवुगा सामगान प्रियलोलिनिवि सदाशिव कुटुम्बिनिवि सौभाग्यमिच्चे देवतवु ॥ ॥
    मङ्गलगौरी रूपमुनु मनसुल निण्डा निम्पण्डि महादेविकि मनमन्ता मङ्गल हारतुलिद्दामु ॥
