id: maitri
category: upanishad
name:
  english: maitri
  devanagari: मैत्रि
content:
  english: rinoti || 8|| sa va esha pancadhatmanam pravibhajya nihito guhayam manomayah pranashariro bahurupah
    satyasam kalpa atmeti sa va esho'sya hridantare tishthannakritartho'manyatarthanasani tatsvanimani
    bhittvoditah pancabhi rashmibhirvishayanattiti buddhindriyani yanimanyetanyasya rashmayah karmendriyanyasya
    haya rathah shariram mano niyanta prakritimayosya pratodanena khalviritam paribhramatidam shariram
    cakramiva mrite ca nedam shariram cetanavatpratishthapitam pracodayita caisho'syeti || 9|| sa va esha
    atmetyado vasham nita iva sitasitaih karmaphalairabhibhuyamana iva pratisharireshu caratyavyaktatvatsukshmatvadadrishyatvadagrahyatvannirmamatva
    ccanavastho'karta kartevavasthitah || 10|| sa va esha shuddhah sthiro'calashcalepo'vyagro nihsprihah
    prekshakavadavasthitah svasya caritabhuggunamayena patenatmanamantardhiyavasthita ityavasthita iti
    || 11|| iti dvitiyah prapathakah || te hocurbhagavanyadyevamasyatmano mahimanam sucayasityanyo va
    parah ko'yamatma sitasitaih karmaphalairabhibhuyamanah sadasadyonimapadyata ityavacim vordhvam va
    gatam dvandvairabhibhuyamanah paribhramatiti katama esha iti tanhovaca || 1|| asti khalvanyo'paro
    bhutatma yo'yam sitasitaih karmaphalairabhibhuyamanah sadasadayonimapadyata ityavacim vordhvam gatim
    dvandvairabhibhuyamanah paribhramatityasyopavyakhyanam panca tanmatrani bhutashabdenocyante panca
    mahabhutani bhutashabdenocyante'tha tesham yah samudayah shariramityuktamatha yo ha khalu vava shariramityuktam
    sa bhutatmetyuktamathasti tasyatma binduriva pushkara iti sa va esho'bhibhutah prakrityairgunairityato'bhibhutatvatsammudhatvam
    prayatyasammudhastvadatmastham prabhum bhagavantam karayitaram napashyadgunaughaistripyamanah kalushikritasthirashcancalo
    lolupyamanah saspriho vyagrashcabhimanatvam prayata ityaham so mamedamityevam manyamano nibadhnatyatmanatmanam
    jalenaiva khacarah kritasyanuphalairabhibhuyamanah paribhramatiti || 2|| athanyatrapyuktam yah karta
    so'yam vai bhutatma karanaih karayitantahpurusho'tha yathagninayahpindo vabhibhutah kartribhirhanyamano
    nanatvamupaityevam vava khalvasau bhutatmantahpurushenabhibhuto gunairhanyamano nanatvamupaityatha
    yattrigunam caturashitilakshayoniparinatam bhutatrigunametadvai nanatvasya rupam tani ha va imani
    gunani purusheneritani cakramiva cakrinetyatha yathayahpinde hanyamane nagnirabhibhuyatyevam nabhibhuyatyasau
    purusho'bhibhuyatyayam bhutatmopasamshlishtatvaditi || 3|| athanyatrapyuktam shariramidam maithunadevodbhutam
    samvidapetam niraya eva mutradvarena nishkramantamasthibhishcitam mamsenanuliptam carmanavabaddham
    vinmutrapittakaphamajjamedovasabhiranyaishca malairbahubhih paripurnam kosha ivavasanneti || 4|| athanyatrapyuktam
    sammoho bhayam vishado nidra tandri vrano jara shokah kshutpipasa karpanyam krodho nastikyamajnanam
    matsaryam vaikarunyam mudhatvam nirvridatvam nikritatvamuddhatatvamasamatvamiti tamasanvitastrishna
    sneho rago lobho himsa ratirdrishtivyapritatvamirshya kamamavasthitatvam cancalatvam jihirsharthoparjanam
    mitranugrahanam parigrahavalambo'nishteshvindriyartheshu dvishtirishteshvabhishanga iti rajasanvitaih
    paripurna etairabhibhuta ityayam bhutatma tasmannanarupanyapnotityapnotiti || 5|| tritiyah prapathakah
    || te ha khalvathordhvaretaso'tivismita atisametyocurbhagavannamaste tvam nah shadhi tvamasmakam gatiranya
    na vidyata ityasya ko'tithirbhutatmano yenedam hitvamanyeva sayujyamupaiti tanhovaca || 1|| athanyatrapyuktam
    mahanadishurmaya iva nivartakamasya yatpurakritam samudraveleva durnivaryamasya mrityoragamanam sadasatphalamayairhi
    pashaih pashuriva baddham bandhanasthasyevasvatantryam yamavishayasthasyaiva bahubhayavastham madironmatta
    ivamodamamadironmattam papmana grihita iva bhramyamanam mahoragadashta iva vipadrishtam mahandhakara
    iva ragandhamindrajalamiva mayamayam svapnamiva mithyadarshanam kadaligarbha ivasaram nata iva kshanavesham
    citrabhittiriva mithyamanoramamityathoktam || shabdasparshadayo ye'rtha anartha iva te sthitah | yeshvasaktastu
    bhutatma na smarecca param padam || 2|| ayam va va khalvasya pratividhirbhutatmano yadyeva vidyadhigamasya
    dharmasyanucaranam svashrameshvanukramanam svadharma eva sarvam dhatte stambhashakhevetaranyanenordhvabhagbhavatyanyathadhah
    patatyesha svadharmabhibhuto yo vedeshu na svadharmatikramenashrami bhavatyashrameshvevavasthitastapasvi
    cetyucyata etadapyuktam natapaskasyatmadhyane'dhigamah karmashuddhirvetyevam hyaha || tapasa prapyate
    sattvam sattvatsamprapyate manah | manasa prapyate tvatma hyatmapattya nivartata iti || 3|| atraite
    shloka bhavanti || yatha nirindhano vahnih svayonavupashamyati | tatha vrittikshayaccittam svayonavupashamyati
    || 1|| svayonavupashantasya manasah satyagaminah | indriyarthavimudhasyanritah karmavashanugah ||
    2|| cittameva hi samsarastatprayatnena shodhayet | yaccittastanmayo bhavati guhyametatsanatanam ||
    3|| cittasya hi prasadena hanti karma shubhashubham | prasannatmatmani sthitva sukhamavyayamashnute||
    4|| samasaktam yada cittam jantorvishayagocare | yadyevam brahmani syattatko na mucyeta bandhanat
    || 5|| mano hi dvividham proktam shuddham cashuddhameva ca | ashuddham kamasankalpam shuddham kamavivarjitam
    || 6|| layaviksheparahitam manah kritva sunishcalam | yada yatyamanibhavam tada tatparamam padam ||
    7|| tavadeva niroddhavyam hridi yavatkshayam gatam | etajjnanam ca moksham ca sheshastu granthavistarah
    || 8|| samadhinirdhutamalasya cetaso niveshitasyatmani yatsukham labhet | na shakyate varnayitum gira
    tada svayam tadantahkaranena grihyate || 9|| apamapo'gniragnau va vyomni vyoma na lakshayet | evamantargatam
    cittam purushah pratimucyate || 10|| mana eva manushyanam karanam bandhamokshayoh | bandhaya vishayasaktam
    muktyai nirvishayam smritamiti || 11|| atha yatheyam kautsayanistutih || tvam brahma tvam ca vai vishnustvam
    rudrastvam prajapatih | tvamagnirvaruno vayustvamindrastvam nishakarah || 12|| tvam manustvam yamashca
    tvam prithivi tvamathacyutah | svarthe svabhavike'rthe ca bahudha tishthase divi || 13|| vishveshvara
    namastubhyam vishvatma vishvakarmakrit | vishvabhugvishvamayastvam vishvakridaratih prabhuh || 14||
    namah shantatmane tubhyam namo guhyatamaya ca | acintyayaprameyaya anadinidhanaya ceti || 15|| ||
    4|| tamo va idamekamasa tatpashcatpareneritam vishayatvam prayatyetadvai rajaso rupam tadrajah khalviritam
    vishamatvam prayatyetadvai tamaso rupam tattamah khalviritam tamasah samprasravatyetadvai sattvasya
    rupam tatsattvameveritam tatsattvatsamprasravatsom'sho'yam yashcetanamatrah pratipurusham kshetrajnah
    sankalpadhyavasayabhimanalingah prajapatistasya prokta agryastanavo brahma rudro vishnurityatha yo
    ha khalu vavasya rajasom'sho'sau sa yo'yam brahmatha yo ha khalu vavasya tamasom'sho'sau sa yo'yam
    rudro'tha yo ha khalu vavasya satvikom'sho'sau sa evam vishnuh sa va esha ekastridhabhuto'shtadhaikadashadha
    dvadashadhaparimitadha codbhuta udbhutatvadbhuteshu carati pratishtha sarvabhutanamadhipatirbabhuvetyasavatmantarbahishcantarbahis
    hca || 5|| caturthah prapathakah || dvidha va esha atmanam bibhartyayam yah prano yashcasavadityo'tha
    dvau va etavastam pancadha namantarbahishcahoratre tau vyavartete asau va adityo bahiratmantaratma
    prano bahiratma gatyantaratmananumiyate | gatirityevam hyaha yah kashcidvidvanapahatapapmadhyaksho'vadatamanastannishtha
    avrittacakshuh so'ntaratmagatya bahiratmano'numiyate gatirityevam hyahatha ya esho'ntaraditye hiranmayah
    purusho yah pashyati mam hiranyavatsa esho'ntare hritpushkara evashrito'nnamatti || 1|| atha ya esho'ntare
    hritpushkara evashrito'nnamatti sa esho'gnirdivi shritah saurah kalakhyo'drishyah sarvabhutannamatti
    kah pushkarah kimayam veda va va tatpushkaram yo'yamakasho'syemashcatasro dishashcatasra upadishah
    samstha ayamarvagagnih parata etau pranadityavetavupasitomityaksharena vyahritibhih savitrya ceti
    || 2|| dve vava brahmano rupe murtam camurtam catha yanmurtam tadasatyam yadamurtam tatsatyam tadbrahma
    yadbrahma tajjyotiryajjyotih sa adityah sa va esha omityetadatma sa tredhatmanam vyakuruta omiti tisro
    matra etabhih sarvamidamotam protam caivasminnityevam hyahaitadva aditya omityevam dhyayamstathatmanam
    yunjiteti || 3|| athanyatrapyuktamatha khalu ya udgithah sa pranavo yah pranavah sa udgitha ityasavaditya
    udgitha eva pranava ityevam hyahodgithah pranavakhyam pranetaram namarupam vigatanidram vijaramavimrityum
    punah pancadha jneyam nihitam guhayamityevam hyahordhvamulam va abrahmashakha akashavayvagnyudakabhumyadaya
    ekenattametadbrahma tattasyaitatte yadasavaditya omityetadaksharasya caitattasmadomityanenaitadupasitajasramityeko'sya
    rasam bodhayita ityevam hyahaitadevaksharam punyametadevaksharam jjnatva yo yadicchati tasya tat ||
    4|| athanyatrapyuktam stanayatyepasya tanurya omiti stripumnapumsakamiti lingavatyeshathagnirvayuraditya
    iti bhasvatyeshatha rudro vishnurityadhipatirityeshatha garhapatyo dakshanagnirahavaniya iti mukhavatyeshatha
    rigyajuhsameti vijanatyeshatha bhurbhuvasvariti lokavatyeshatha bhutam bhavyam bhavishyaditi kalavatyeshatha
    prano'gnih suryah iti pratapavatyeshathannamapashcandrama ityapyayanavatyeshatha buddhirmano'hankara
    iti cetanavatyeshatha prano'pano vyana iti pranavatyeke tyajamityuktaitaha prastotarpita bhavatityevam
    hyahaitadvai satyakama param caparam ca yadomityetadaksharamiti || 5|| atha vyattam va idamasitsatyam
    prajapatistapastaptva anuvyaharadbhurbhuvahsvarityesha hatha prajapateh sthavishtha tanurva lokavatiti
    svarityasyah shiro nabhirbhuvo bhuh pada adityashcakshurayattah purushasya mahato matrashcakshusha
    hyayam matrashcariti satyam vai cakshurakshinyupasthito hi purushah sarvartheshu vadatyetasmadbhurbhuvahsvarityupasitannam
    hi prajapatirvishvatma vishvacakshurivopasito bhavatityevam hyahaisha vai prajapatirvishvabhrittanuretasyamidam
    sarvamantarhitamasmiॅmshca sarvasminneshantarhiteti tasmadeshopasiteti || 6|| tatsaviturvarenyamityasau
    va adityah savita sa va evam pravaranaya atmakamenetyahurbrahmavadino'tha bhargo devasya dhimahiti
    savita vai te'vasthita yo'sya bhargah kam sancitayamityahurbrahmavadino'tha dhiyo yo nah pracodayaditi
    buddhayo vai dhiyasta yo'smakam pracodayadityahurbrahmavadino'tha bharga iti yo ha va asminnaditye
    nihitastarake'kshini caisha bhargakhyo bhabhirgatirasya hiti bhargo bharjati vaisha bharga iti brahmavadino'tha
    bharga iti bhasayatimaॅmllokaniti ranjayatimani bhutani gacchata iti gacchatyasminnagacchatyasma imah
    prajastasmadbharakatvadbhargah shatrunsuyamanatvatsuryah savnatsavita danadadityah pavanatpavamano'thayo'thayanadaditya
    ityevam hyaha khalvatmanatmamritakhyashceta manta ganta srashta nandayita karta vakta rasayita ghrata
    sparshayita ca vibhuvigrahe sannishtha ityevam hyahatha yatra dvaitibhutam vijnanam tatra hi sha
  devanagari: ृणोति ॥ ८॥ स वा एष पञ्चधात्मानं प्रविभज्य निहितो गुहायां मनोमयः प्राणशरीरो बहुरूपः सत्यसं
    कल्प आत्मेति स वा एषोऽस्य हृदन्तरे तिष्ठन्नकृतार्थोऽमन्यतार्थानसानि तत्स्वानीमानि भित्त्वोदितः पञ्चभी
    रश्मिभिर्विषयानत्तीति बुद्धीन्द्रियाणि यानीमान्येतान्यस्य रश्मयः कर्मेन्द्रियाण्यस्य हया रथः शरीरं
    मनो नियन्ता प्रकृतिमयोस्य प्रतोदनेन खल्वीरितं परिभ्रमतीदं शरीरं चक्रमिव मृते च नेदं शरीरं चेतनवत्प्रतिष्ठापितं
    प्रचोदयिता चैषोऽस्येति ॥ ९॥ स वा एष आत्मेत्यदो वशं नीत इव सितासितैः कर्मफलैरभिभूयमान इव प्रतिशरीरेषु
    चरत्यव्यक्तत्वात्सूक्ष्मत्वाददृश्यत्वादग्राह्यत्वान्निर्ममत्वा च्चानवस्थोऽकर्ता कर्तेवावस्थितः ॥ १०॥
    स वा एष शुद्धः स्थिरोऽचलश्चालेपोऽव्यग्रो निःस्पृहः प्रेक्षकवदवस्थितः स्वस्य चरितभुग्गुणमयेन पटेनात्मानमन्तर्धीयावस्थित
    इत्यवस्थित इति ॥ ११॥ इति द्वितीयः प्रपाठकः ॥ ते होचुर्भगवन्यद्येवमस्यात्मनो महिमानं सूचयसीत्यन्यो
    वा परः कोऽयमात्मा सितासितैः कर्मफलैरभिभूयमानः सदसद्योनिमापद्यत इत्यवाचीं वोर्ध्वां वा गतं द्वन्द्वैरभिभूयमानः
    परिभ्रमतीति कतम एष इति तान्होवाच ॥ १॥ अस्ति खल्वन्योऽपरो भूतात्मा योऽयं सितासितैः कर्मफलैरभिभूयमानः
    सदसदयोनिमापद्यत इत्यवाचीं वोर्ध्वां गतिं द्वन्द्वैरभिभूयमानः परिभ्रमतीत्यस्योपव्याख्यानं पञ्च तन्मात्राणि
    भूतशब्देनोच्यन्ते पञ्च महाभूतानि भूतशब्देनोच्यन्तेऽथ तेषां यः समुदायः शरीरमित्युक्तमथ यो ह खलु वाव
    शरीरमित्युक्तं स भूतात्मेत्युक्तमथास्ति तस्यात्मा बिन्दुरिव पुष्कर इति स वा एषोऽभिभूतः प्राकृत्यैर्गुणैरित्यतोऽभिभूतत्वात्संमूढत्वं
    प्रयात्यसंमूढस्त्वादात्मस्थं प्रभुं भगवन्तं कारयितारं नापश्यद्गुणौघैस्तृप्यमानः कलुषीकृतास्थिरश्चञ्चलो
    लोलुप्यमानः सस्पृहो व्यग्रश्चाभिमानत्वं प्रयात इत्यहं सो ममेदमित्येवं मन्यमानो निबध्नात्यात्मनात्मानं
    जालेनैव खचरः कृतस्यानुफलैरभिभूयमानः परिभ्रमतीति ॥ २॥ अथान्यत्राप्युक्तं यः कर्ता सोऽयं वै भूतात्मा
    करणैः कारयितान्तःपुरुषोऽथ यथाग्निनायःपिण्डो वाभिभूतः कर्तृभिर्हन्यमानो नानात्वमुपैत्येवं वाव खल्वसौ
    भूतात्मान्तःपुरुषेणाभिभूतो गुणैर्हन्यमानो नानात्वमुपैत्यथ यत्त्रिगुणं चतुरशीतिलक्षयोनिपरिणतं भूतत्रिगुणमेतद्वै
    नानात्वस्य रूपं तानि ह वा इमानि गुणानि पुरुषेणेरितानि चक्रमिव चक्रिणेत्यथ यथायःपिण्डे हन्यमाने नाग्निरभिभूयत्येवं
    नाभिभूयत्यसौ पुरुषोऽभिभूयत्ययं भूतात्मोपसंश्लिष्टत्वादिति ॥ ३॥ अथान्यत्राप्युक्तं शरीरमिदं मैथुनादेवोद्भूतं
    संविदपेतं निरय एव मूत्रद्वारेण निष्क्रामन्तमस्थिभिश्चितं मांसेनानुलिप्तं चर्मणावबद्धं विण्मूत्रपित्तकफमज्जामेदोवसाभिरन्यैश्च
    मलैर्बहुभिः परिपूर्णं कोश इवावसन्नेति ॥ ४॥ अथान्यत्राप्युक्तं संमोहो भयं विषादो निद्रा तन्द्री व्रणो
    जरा शोकः क्षुत्पिपासा कार्पण्यं क्रोधो नास्तिक्यमज्ञानं मात्सर्यं वैकारुण्यं मूढत्वं निर्व्रीडत्वं
    निकृतत्वमुद्धातत्वमसमत्वमिति तामसान्वितस्तृष्णा स्नेहो रागो लोभो हिंसा रतिर्दृष्टिव्यापृतत्वमीर्ष्या
    काममवस्थितत्वं चञ्चलत्वं जिहीर्षार्थोपार्जनं मित्रानुग्रहणं परिग्रहावलम्बोऽनिष्टेष्विन्द्रियार्थेषु
    द्विष्टिरिष्टेश्वभिषङ्ग इति राजसान्वितैः परिपूर्ण एतैरभिभूत इत्ययं भूतात्मा तस्मान्नानारूपाण्याप्नोतीत्याप्नोतीति
    ॥ ५॥ तृतीयः प्रपाठकः ॥ ते ह खल्वथोर्ध्वरेतसोऽतिविस्मिता अतिसमेत्योचुर्भगवन्नमस्ते त्वं नः शाधि त्वमस्माकं
    गतिरन्या न विद्यत इत्यस्य कोऽतिथिर्भूतात्मनो येनेदं हित्वामन्येव सायुज्यमुपैति तान्होवाच ॥ १॥ अथान्यत्राप्युक्तं
    महानदीषूर्मय इव निवर्तकमस्य यत्पुराकृतं समुद्रवेलेव दुर्निवार्यमस्य मृत्योरागमनं सदसत्फलमयैर्हि पाशैः
    पशुरिव बद्धं बन्धनस्थस्येवास्वातन्त्र्यं यमविषयस्थस्यैव बहुभयावस्थं मदिरोन्मत्त इवामोदममदिरोन्मत्तं
    पाप्मना गृहीत इव भ्राम्यमाणं महोरगदष्ट इव विपदृष्टं महान्धकार इव रागान्धमिन्द्रजालमिव मायामयं स्वप्नमिव
    मिथ्यादर्शनं कदलीगर्भ इवासारं नट इव क्षणवेषं चित्रभित्तिरिव मिथ्यामनोरममित्यथोक्तम् ॥ शब्दस्पर्शादयो
    येऽर्था अनर्था इव ते स्थिताः । येष्वासक्तस्तु भूतात्मा न स्मरेच्च परं पदम् ॥ २॥ अयं वा व खल्वस्य प्रतिविधिर्भूतात्मनो
    यद्येव विद्याधिगमस्य धर्मस्यानुचरणं स्वाश्रमेष्वानुक्रमणं स्वधर्म एव सर्वं धत्ते स्तम्भशाखेवेतराण्यनेनोर्ध्वभाग्भवत्यन्यथधः
    पतत्येष स्वधर्माभिभूतो यो वेदेषु न स्वधर्मातिक्रमेणाश्रमी भवत्याश्रमेष्वेवावस्थितस्तपस्वी चेत्युच्यत
    एतदप्युक्तं नातपस्कस्यात्मध्यानेऽधिगमः कर्मशुद्धिर्वेत्येवं ह्याह ॥ तपसा प्राप्यते सत्त्वं सत्त्वात्सम्प्राप्यते
    मनः । मनसा प्राप्यते त्वात्मा ह्यात्मापत्त्या निवर्तत इति ॥ ३॥ अत्रैते श्लोका भवन्ति ॥ यथा निरिन्धनो
    वह्निः स्वयोनावुपशाम्यति । तथा वृत्तिक्षयाच्चित्तं स्वयोनावुपशाम्यति ॥ १॥ स्वयोनावुपशान्तस्य मनसः
    सत्यगामिनः । इन्द्रियार्थाविमूढस्यानृताः कर्मवशानुगाः ॥ २॥ चित्तमेव हि संसारस्तत्प्रयत्नेन शोधयेत्
    । यच्चित्तस्तन्मयो भवति गुह्यमेतत्सनातनम् ॥ ३॥ चित्तस्य हि प्रसादेन हन्ति कर्म शुभाशुभम् । प्रसन्नात्मात्मनि
    स्थित्वा सुखमव्ययमश्नुते॥ ४॥ समासक्तं यदा चित्तं जन्तोर्विषयगोचरे । यद्येवं ब्रह्मणि स्यात्तत्को न
    मुच्येत बन्धनात् ॥ ५॥ मनो हि द्विविधं प्रोक्तं शुद्धं चाशुद्धमेव च । अशुद्धं कामसङ्कल्पं शुद्धं कामविवर्जितम्
    ॥ ६॥ लयविक्षेपरहितं मनः कृत्वा सुनिश्चलम् । यदा यात्यमनीभावं तदा तत्परमं पदम् ॥ ७॥ तावदेव निरोद्धव्यं
    हृदि यावत्क्षयं गतम् । एतज्ज्ञानं च मोक्षं च शेषास्तु ग्रन्थविस्तराः ॥ ८॥ समाधिनिर्धूतमलस्य चेतसो
    निवेशितस्यात्मनि यत्सुखं लभेत् । न शक्यते वर्णयितुं गिरा तदा स्वयं तदन्तःकरणेन गृह्यते ॥ ९॥ अपामपोऽग्निरग्नौ
    वा व्योम्नि व्योम न लक्षयेत् । एवमन्तर्गतं चित्तं पुरुषः प्रतिमुच्यते ॥ १०॥ मन एव मनुष्याणां कारणं
    बन्धमोक्षयोः । बन्धाय विषयासक्तं मुक्त्यै निर्विषयं स्मृतमिति ॥ ११॥ अथ यथेयं कौत्सायनिस्तुतिः ॥ त्वं
    ब्रह्मा त्वं च वै विष्णुस्त्वं रुद्रस्त्वं प्रजापतिः । त्वमग्निर्वरुणो वायुस्त्वमिन्द्रस्त्वं निशाकरः
    ॥ १२॥ त्वं मनुस्त्वं यमश्च त्वं पृथिवी त्वमथाच्युतः । स्वार्थे स्वाभाविकेऽर्थे च बहुधा तिष्ठसे दिवि
    ॥ १३॥ विश्वेश्वर नमस्तुभ्यं विश्वात्मा विश्वकर्मकृत् । विश्वभुग्विश्वमायस्त्वं विश्वक्रीडारतिः प्रभुः
    ॥ १४॥ नमः शान्तात्मने तुभ्यं नमो गुह्यतमाय च । अचिन्त्यायाप्रमेयाय अनादिनिधनाय चेति ॥ १५॥ ॥ ४॥ तमो
    वा इदमेकमास तत्पश्चात्परेणेरितं विषयत्वं प्रयात्येतद्वै रजसो रूपं तद्रजः खल्वीरितं विषमत्वं प्रयात्येतद्वै
    तमसो रूपं तत्तमः खल्वीरितं तमसः सम्प्रास्रवत्येतद्वै सत्त्वस्य रूपं तत्सत्त्वमेवेरितं तत्सत्त्वात्सम्प्रास्रवत्सोंऽशोऽयं
    यश्चेतनमात्रः प्रतिपुरुषं क्षेत्रज्ञः सङ्कल्पाध्यवसायाभिमानलिङ्गः प्रजापतिस्तस्य प्रोक्ता अग्र्यास्तनवो
    ब्रह्मा रुद्रो विष्णुरित्यथ यो ह खलु वावास्य राजसोंऽशोऽसौ स योऽयं ब्रह्माथ यो ह खलु वावास्य तामसोंऽशोऽसौ
    स योऽयं रुद्रोऽथ यो ह खलु वावास्य सात्विकोंऽशोऽसौ स एवं विष्णुः स वा एष एकस्त्रिधाभूतोऽष्टधैकादशधा
    द्वादशधापरिमितधा चोद्भूत उद्भूतत्वाद्भूतेषु चरति प्रतिष्ठा सर्वभूतानामधिपतिर्बभूवेत्यसावात्मान्तर्बहिश्चान्तर्बहिस्
    ह्च ॥ ५॥ चतुर्थः प्रपाठकः ॥ द्विधा वा एष आत्मानं बिभर्त्ययं यः प्राणो यश्चासावादित्योऽथ द्वौ वा एतावास्तां
    पञ्चधा नामान्तर्बहिश्चाहोरात्रे तौ व्यावर्तेते असौ वा आदित्यो बहिरात्मान्तरात्मा प्राणो बहिरात्मा
    गत्यान्तरात्मनानुमीयते । गतिरित्येवं ह्याह यः कश्चिद्विद्वानपहतपाप्माध्यक्षोऽवदातमनास्तन्निष्ठ आवृत्तचक्षुः
    सोऽन्तरात्मागत्या बहिरात्मनोऽनुमीयते गतिरित्येवं ह्याहाथ य एषोऽन्तरादित्ये हिरण्मयः पुरुषो यः पश्यति
    मां हिरण्यवत्स एषोऽन्तरे हृत्पुष्कर एवाश्रितोऽन्नमत्ति ॥ १॥ अथ य एषोऽन्तरे हृत्पुष्कर एवाश्रितोऽन्नमत्ति
    स एषोऽग्निर्दिवि श्रितः सौरः कालाख्योऽदृश्यः सर्वभूतान्नमत्ति कः पुष्करः किमयं वेद वा व तत्पुष्करं
    योऽयमाकाशोऽस्येमाश्चतस्रो दिशश्चतस्र उपदिशः संस्था अयमर्वागग्निः परत एतौ प्राणादित्यावेतावुपासीतोमित्यक्षरेण
    व्याहृतिभिः सावित्र्या चेति ॥ २॥ द्वे वाव ब्रह्मणो रूपे मूर्तं चामूर्तं चाथ यन्मूर्तं तदसत्यं यदमूर्तं
    तत्सत्यं तद्ब्रह्म यद्ब्रह्म तज्ज्योतिर्यज्ज्योतिः स आदित्यः स वा एष ओमित्येतदात्मा स त्रेधात्मानं
    व्यकुरुत ओमिति तिस्रो मात्रा एताभिः सर्वमिदमोतं प्रोतं चैवास्मिन्नित्येवं ह्याहैतद्वा आदित्य ओमित्येवं
    ध्यायंस्तथात्मानं युञ्जीतेति ॥ ३॥ अथान्यत्राप्युक्तमथ खलु य उद्गीथः स प्रणवो यः प्रणवः स उद्गीथ इत्यसावादित्य
    उद्गीथ एव प्रणव इत्येवं ह्याहोद्गीथः प्रणवाख्यं प्रणेतारं नामरूपं विगतनिद्रं विजरमविमृत्युं पुनः पञ्चधा
    ज्ञेयं निहितं गुहायामित्येवं ह्याहोर्ध्वमूलं वा आब्रह्मशाखा आकाशवाय्वग्न्युदकभूम्यादय एकेनात्तमेतद्ब्रह्म
    तत्तस्यैतत्ते यदसावादित्य ओमित्येतदक्षरस्य चैतत्तस्मादोमित्यनेनैतदुपासीताजस्रमित्येकोऽस्य रसं बोधयीत
    इत्येवं ह्याहैतदेवाक्षरं पुण्यमेतदेवाक्षरं ज्ज्ञात्वा यो यदिच्छति तस्य तत् ॥ ४॥ अथान्यत्राप्युक्तं
    स्तनयत्येपास्य तनूर्या ओमिति स्त्रीपुंनपुंसकमिति लिङ्गवत्येषाथाग्निर्वायुरादित्य इति भास्वत्येषाथ
    रुद्रो विष्णुरित्यधिपतिरित्येषाथ गार्हपत्यो दक्षणाग्निराहवनीय इति मुखवत्येषाथ ऋग्यजुःसामेति विजानात्येषथ
    भूर्भुवस्वरिति लोकवत्येषाथ भूतं भव्यं भविष्यदिति कालवत्येषाथ प्राणोऽग्निः सूर्यः इति प्रतापवत्येषाथान्नमापश्चन्द्रमा
    इत्याप्यायनवत्येषाथ बुद्धिर्मनोऽहङ्कार इति चेतनवत्येषाथ प्राणोऽपानो व्यान इति प्राणवत्येके त्यजामीत्युक्तैताह
    प्रस्तोतार्पिता भवतीत्येवं ह्याहैतद्वै सत्यकाम परं चापरं च यदोमित्येतदक्षरमिति ॥ ५॥ अथ व्यात्तं वा
    इदमासीत्सत्यं प्रजापतिस्तपस्तप्त्वा अनुव्याहरद्भूर्भुवःस्वरित्येषा हाथ प्रजापतेः स्थविष्ठा तनूर्वा
    लोकवतीति स्वरित्यस्याः शिरो नाभिर्भुवो भूः पादा आदित्यश्चक्षुरायत्तः पुरुषस्य महतो मात्राश्चक्षुषा
    ह्ययं मात्राश्चरिति सत्यं वै चक्षुरक्षिण्युपस्थितो हि पुरुषः सर्वार्थेषु वदत्येतस्माद्भूर्भुवःस्वरित्युपासीतान्नं
    हि प्रजापतिर्विश्वात्मा विश्वचक्षुरिवोपासितो भवतीत्येवं ह्याहैषा वै प्रजापतिर्विश्वभृत्तनूरेतस्यामिदं
    सर्वमन्तर्हितमस्मिॅंश्च सर्वस्मिन्नेषान्तर्हितेति तस्मादेषोपासीतेति ॥ ६॥ तत्सवितुर्वरेण्यमित्यसौ वा
    आदित्यः सविता स वा एवं प्रवरणाय आत्मकामेनेत्याहुर्ब्रह्मवादिनोऽथ भर्गो देवस्य धीमहीति सविता वै तेऽवस्थिता
    योऽस्य भर्गः कं सञ्चितयामीत्याहुर्ब्रह्मवादिनोऽथ धियो यो नः प्रचोदयादिति बुद्धयो वै धियस्ता योऽस्माकं
    प्रचोदयादित्याहुर्ब्रह्मवादिनोऽथ भर्ग इति यो ह वा अस्मिन्नादित्ये निहितस्तारकेऽक्षिणि चैष भर्गाख्यो
    भाभिर्गतिरस्य हीति भर्गो भर्जति वैष भर्ग इति ब्रह्मवादिनोऽथ भर्ग इति भासयतीमाॅंल्लोकानिति रञ्जयतीमानि
    भूतानि गच्छत इति गच्छत्यस्मिन्नागच्छत्यस्मा इमाः प्रजास्तस्माद्भारकत्वाद्भर्गः शत्रून्सूयमानत्वात्सूर्यः
    सव्नात्सविता दानादादित्यः पवनात्पावमानोऽथायोऽथायनादादित्य इत्येवं ह्याह खल्वात्मनात्मामृताख्यश्चेता
    मन्ता गन्ता स्रष्टा नन्दयिता कर्ता वक्ता रसयिता घ्राता स्पर्शयिता च विभुविग्रहे सन्निष्ठा इत्येवं
    ह्याहाथ यत्र द्वैतीभूतं विज्ञानं तत्र हि श
