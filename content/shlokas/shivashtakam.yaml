id: shivashtakam
category: stotram
name:
  english: Shivashtakam
content:
  english: prabhum prananatham vibhum vishvanatham jagannatha natham sadananda bhajam | bhavadbhavya bhuteshvaram
    bhutanatham shivam shankaram shambhu mishanamide || || gale rundamalam tanau sarpajalam mahakala kalam
    ganeshadi palam | jatajuta gangottarangairvishalam shivam shankaram shambhu mishanamide || || mudamakaram
    mandanam mandayantam maha mandalam bhasma bhushadharam tam | anadim hyaparam maha mohamaram shivam
    shankaram shambhu mishanamide || || vatadho nivasam mahattattahasam mahapapa nasham sada suprakasham
    | girisham ganesham suresham mahesham shivam shankaram shambhu mishanamide || || girindratmaja sangrihitardhadeham
    girau samsthitam sarvadapanna geham | parabrahma brahmadibhir shivam shankaram shambhu mishanamide
    || || kapalam trishulam karabhyam dadhanam padambhoja namraya kamam dadanam | balivardhayanam suranam
    pradhanam shivam shankaram shambhu mishanamide || || sharaccandra gatram gananandapatram trinetram
    pavitram dhaneshasya mitram | aparna kalatram sada saccaritram shivam shankaram shambhu mishanamide
    || || haram sarpaharam cita bhuviharam bhavam vedasaram sada nirvikaram| shmashane vasantam manojam
    dahantam shivam shankaram shambhu mishanamide || || svayam yah prabhate narashshula pane pathet stotraratnam
    tvihaprapyaratnam | suputram sudhanyam sumitram kalatram vicitraissamaradhya moksham prayati ||
  devanagari: प्रभुं प्राणनाथं विभुं विश्वनाथं जगन्नाथ नाथं सदानन्द भाजाम् । भवद्भव्य भूतेश्वरं भूतनाथं
    शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ गले रुण्डमालं तनौ सर्पजालं महाकाल कालं गणेशादि पालम् । जटाजूट गङ्गोत्तरङ्गैर्विशालं
    शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ मुदामाकरं मण्डनं मण्डयन्तं महा मण्डलं भस्म भूषाधरं तम् । अनादिं ह्यपारं
    महा मोहमारं शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ वटाधो निवासं महाट्टाट्टहासं महापाप नाशं सदा सुप्रकाशम्
    । गिरीशं गणेशं सुरेशं महेशं शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ गिरीन्द्रात्मजा सङ्गृहीतार्धदेहं गिरौ
    संस्थितं सर्वदापन्न गेहम् । परब्रह्म ब्रह्मादिभिर् शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ कपालं त्रिशूलं
    कराभ्यां दधानं पदाम्भोज नम्राय कामं ददानम् । बलीवर्धयानं सुराणां प्रधानं शिवं शङ्करं शम्भु मीशानमीडे
    ॥ ॥ शरच्चन्द्र गात्रं गणानन्दपात्रं त्रिनेत्रं पवित्रं धनेशस्य मित्रम् । अपर्णा कलत्रं सदा सच्चरित्रं
    शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ हरं सर्पहारं चिता भूविहारं भवं वेदसारं सदा निर्विकारं। श्मशाने वसन्तं
    मनोजं दहन्तं शिवं शङ्करं शम्भु मीशानमीडे ॥ ॥ स्वयं यः प्रभाते नरश्शूल पाणे पठेत् स्तोत्ररत्नं त्विहप्राप्यरत्नम्
    । सुपुत्रं सुधान्यं सुमित्रं कलत्रं विचित्रैस्समाराध्य मोक्षं प्रयाति ॥
