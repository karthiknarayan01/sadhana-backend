id: kalikasahasra
category: stotram
name:
  english: kalikasahasra
  devanagari: कालिकासहस्र
content:
  english: shriganeshaya namah | om shrigurubhyo namah | om khadgam cakragadeshucapaparidhan shulam bhushundim
    shirah shankham sandadhatim kuraistrinayanam sarvangabhushavritam | ya mastau svapitau harau kamalajau
    hantum madhum kaitabham nilashmadyutimasyapadadashakam seve mahakalikam || om sadyashchinna shirah
    kripanamabhayam hastairvaram bibhratim ghorasyam shirasi sraja suruciranmunyukta keshavalim | srikkasrikpravaham
    shmashana nilayam shrutyoh shavalankritim shyamangim kritamekhalam shavakarairdevim bhaje kalikam
    || raktangim raktavastram karivaravilasat kundalam candadamshtram kanthodya mundamalam parisaravilasadbhutapaishacavrindam
    | ghoram ghorattahasam karakalita kapalasiraudram trinetram shatrunam pranahantrim shishushashimakutam
    bhavayet bhadrakalim || kalim meghasamaprabham trinayanam vetalakanthasthitam khadgam khetakapaladarikashirah
    kritva karagreshu ca | bhutapretapishacamatrisahitam mundasrajalankritam vande dushtamasurikadi vipadam
    samharinim ishvarim || om hrim bham bhadrakalyai namah | om aim klim sau phrim bhadrakalyai namah
    | kathito'yam mahamantrah sarvamantrottamottamah | yamasadya maya praptamaishvaryapadamuttamam ||
    1|| samyuktah paraya bhaktya yathoktavidhina bhavan | kurutamarcanam devyah trailokyavijigishaya ||
    2|| shriparashurama uvaca | prasanno yadi me devah parameshah puratanah | rahasyam paraya devyah kripaya
    kathaya prabho || 3|| yatharcanam vina homam vina nyasam vinabalim | vina gandham vina pushpam vina
    nityoditakriya || 4|| pranayamam vina dhyanam vina bhutavishodhanam | vina japyam vina danam vina
    kali prasidati || 5|| shrishankara uvaca | prishtam tvayottamam prajna bhriguvamshavivardhanam | bhaktanamapi
    bhakto'si tvamevam sadhayishyasi || 6|| devim danavakotighnim lilaya rudhirapriyam | sada stotrapriyamugram
    kamakautukalalasam || 7|| sarvada''nandahridayam vasavyasaktamanasam | madhvikamatsyamamsadiraginim
    rudhirapriyam || 8|| shmashanavasinim pretagananrityamahotsavam | yogaprabham yoginisham yogindrahridaye
    sthitam || 9|| tamugrakalikam rama prasadayitumarhasi | tasyah stotram mahapunyam svayam kalya prakashitam
    || 10|| tava tatkathayishyami shrutva vatsavadharaya | gopaniyam prayatnena pathaniyam paratparam
    || 11|| yasyaikakalapathanatsarve vighnah samakulah | nashyanti dahane dipte patanga iva sarvatah
    || 12|| gadyapadyamayi vani tasya gangapravahavat | tasya darshanamatrena vadino nishprabha matah
    || 13|| rajano'pi ca dasatvam bhajanti ca pare janah | tasya haste sadaivasti sarvasiddhirna samshayah
    || 14|| nishithe muktaye shambhurnagnah shaktisamanvitah | manasa cintayetkalim mahakaliti lalitam
    || 15|| pathetsahasranamakhyam stotram mokshasya sadhanam | prasanna kalika tasya putratvenanukampate
    || 16|| vedha brahmasmriterbrahma kusumaih pujita para | prasidati tatha kali yathanena prasidati
    || 17|| om asya shrikalikasahasranamastotramahamantrasya mahakalabhairava rishih anushtup chandah
    shmashanakalika devata mahakalikaprasadasiddhyarthe jape viniyogah || dhyanam | shavarudham mahabhimam
    ghoradamshtram hasanmukhim | caturbhujam khadgamundavarabhayakaram shivam || mundamaladharam devim
    lolajjihvam digambaram | evam sancintayetkalim shmashanalayavasinim || atha stotram | om krim mahakalyai
    namah || om shmashanakalika kali bhadrakali kapalini | guhyakali mahakali kurukulla virodhini || 18||
    kalika kalaratrishca mahakalanitambini | kalabhairavabharya ca kulavartmaprakashini || 19|| kamada
    kamini kamya kamaniyasvabhavini | kasturirasanilangi kunjareshvaragamini || 20|| kakaravarnasarvangi
    kamini kamasundari | kamarta kamarupa ca kamadhenuh kalavati || 21|| kanta kamasvarupa ca kamakhya
    kulapalini | kulina kulavatyamba durga durgartinashini || 22|| kaumari kulaja krishna krishnadeha
    krishodari | krishangi kulishangi ca krinkari kamala kala || 23|| karalasya karali ca kulakanta'parajita
    | ugra cograprabha dipta vipracitta mahabala || 24|| nila ghana balaka ca matramudrapita'sita | brahmi
    narayani bhadra subhadra bhaktavatsala || 25|| maheshvari ca camunda varahi narasimhika | vajrangi
    vajrakankali nrimundasragvini shiva || 26|| malini naramundali galadraktavibhushana | raktacandanasiktangi
    sindurarunamastaka || 27|| ghorarupa ghoradamshtra ghoraghoratara shubha | mahadamshtra mahamaya sudati
    yugadantura || 28|| sulocana virupakshi vishalakshi trilocana | sharadenduprasannasya sphuratsmerambujekshana
    || 29|| attahasaprasannasya smeravaktra subhashini | prasannapadmavadana smitasya priyabhashini ||
    30|| kotarakshi kulashreshtha mahati bahubhashini | sumatih kumatishcanda candamundativegini || 31||
    pracanda candika candi carcika candavegini | sukeshi muktakeshi ca dirghakeshi mahatkaca || 32|| pretadeha
    karnapura pretapanisumekhala | pretasana priyapreta pretabhumikritalaya || 33|| shmashanavasini punya
    punyada kulapandita | punyalaya punyadeha punyashloki ca pavani || 34|| putra pavitra parama purapunyavibhushana
    | punyanamni bhitihara varada khadgapanini || 35|| nrimundahastashasta ca chinnamasta sunasika | dakshina
    shyamala shyama shanta pinonnatastani || 36|| digambara ghorarava srikkanta raktavahini | ghorarava
    shiva khadga vishanka madanatura || 37|| matta pramatta pramada sudhasindhunivasini | atimatta mahamatta
    sarvakarshanakarini || 38|| gitapriya vadyarata pretanrityaparayana | caturbhuja dashabhuja ashtadashabhuja
    tatha || 39|| katyayani jaganmata jagati parameshvari | jagadbandhurjagaddhatri jagadanandakarini
    || 40|| janmamayi haimavati mahamaya mahamaha | nagayajnopavitangi nagini nagashayini || 41|| nagakanya
    devakanya gandharvi kinnareshvari | moharatri maharatri daruna bhasurambara || 42|| vidyadhari vasumati
    yakshini yogini jara | rakshasi dakini vedamayi vedavibhushana || 43|| shrutih smritirmahavidya guhyavidya
    puratani | cintya'cintya svadha svaha nidra tandra ca parvati || 44|| aparna nishcala lola sarvavidya
    tapasvini | ganga kashi shaci sita sati satyaparayana || 45|| nitissunitissurucistushtih pushtirdhritih
    kshama | vani buddhirmahalakshmirlakshmirnilasarasvati || 46|| srotasvati sarasvati matangi vijaya
    jaya | nadi sindhuh sarvamayi tara shunyanivasini || 47|| shuddha tarangini medha lakini bahurupini
    | sthula sukshma sukshmatara bhagavatyanurupini || 48|| paramanusvarupa ca cidanandasvarupini | sadanandamayi
    satya sarvanandasvarupini || 49|| sunanda nandini stutya stavaniyasvabhavini | rangini tankini citra
    vicitra citrarupini || 50|| padma padmalaya padmamukhi padmavibhushana | dakini shakini kshanta rakini
    rudhirapriya || 51|| bhrantirbhavani rudrani mridani shatrumardini | upendrani mahendrani jyotsna
    candrasvarupini || 52|| suryatmika rudrapatni raudri stri prakritih puman | shaktirmuktirmatirmata
    bhaktirmuktih pativrata || 53|| sarveshvari sarvamata sharvani haravallabha | sarvajna siddhida siddha
    bhavya bhavya bhayapaha || 54|| kartri hartri palayitri sharvari tamasi daya | tamisra tamasi sthanuh
    sthira dhira tapasvini || 55|| carvangi cancala lolajihva carucaritrini | trapa trapavati lajja vilajja
    harayauvati || 56||
  devanagari: श्रीगणेशाय नमः । ॐ श्रीगुरुभ्यो नमः । ॐ खड्गं चक्रगदेषुचापपरिधान् शूलं भुशुण्डीं शिरः शङ्खं
    सन्दधतीं कुरैस्त्रिनयनां सर्वाङ्गभूषावृताम् । या मस्तौ स्वपितौ हरौ कमलजौ हन्तुं मधुं कैटभं नीलाश्मद्युतिमास्यपाददशकं
    सेवे महाकालिकाम् ॥ ॐ सद्यश्छिन्न शिरः कृपाणमभयं हस्तैर्वरं बिभ्रतीं घोरास्यां शिरसि स्रजा सुरुचिरान्मुन्युक्त
    केशावलिम् । सृक्कासृक्प्रवहां श्मशान निलयां श्रुत्योः शवालङ्कृतिं श्यामाङ्गीं कृतमेखलां शवकरैर्देवीं
    भजे कालिकाम् ॥ रक्ताङ्गीं रक्तवस्त्रां करिवरविलसत् कुण्डलां चण्डदंष्ट्रां कण्ठोद्य मुण्डमालां परिसरविलसद्भूतपैशाचवृन्दाम्
    । घोरां घोराट्टहासां करकलित कपालासिरौद्रां त्रिनेत्रां शत्रूणां प्राणहन्त्रीं शिशुशशिमकुटां भावयेत्
    भद्रकालीं ॥ कालिं मेघसमप्रभां त्रिनयनां वेतालकण्ठस्थितां खड्गं खेटकपालदारिकशिरः कृत्वा कराग्रेषु च
    । भूतप्रेतपिशाचमातृसहितां मुण्डस्रजालङ्कृतां वन्दे दुष्टमसूरिकादि विपदां संहारिणीं ईश्वरीम् ॥ ॐ ह्रीं
    भं भद्रकाल्यै नमः । ॐ ऐं क्लीं सौ फ्रीं भद्रकाल्यै नमः । कथितोऽयं महामन्त्रः सर्वमन्त्रोत्तमोत्तमः
    । यमासाद्य मया प्राप्तमैश्वर्यपदमुत्तमम् ॥ १॥ संयुक्तः परया भक्त्या यथोक्तविधिना भवान् । कुरुतामर्चनं
    देव्याः त्रैलोक्यविजिगीषया ॥ २॥ श्रीपरशुराम उवाच । प्रसन्नो यदि मे देवः परमेशः पुरातनः । रहस्यं परया
    देव्याः कृपया कथय प्रभो ॥ ३॥ यथार्चनं विना होमं विना न्यासं विनाबलिम् । विना गन्धं विना पुष्पं विना
    नित्योदितक्रिया ॥ ४॥ प्राणायामं विना ध्यानं विना भूतविशोधनम् । विना जाप्यं विना दानं विना काली प्रसीदति
    ॥ ५॥ श्रीशङ्कर उवाच । पृष्टं त्वयोत्तमं प्राज्ञ भृगुवंशविवर्धनम् । भक्तानामपि भक्तोऽसि त्वमेवं साधयिष्यसि
    ॥ ६॥ देवीं दानवकोटिघ्नीं लीलया रुधिरप्रियाम् । सदा स्तोत्रप्रियामुग्रां कामकौतुकलालसाम् ॥ ७॥ सर्वदाऽऽनन्दहृदयां
    वासव्यासक्तमानसाम् । माध्वीकमत्स्यमांसादिरागिणीं रुधिरप्रियाम् ॥ ८॥ श्मशानवासिनीं प्रेतगणनृत्यमहोत्सवाम्
    । योगप्रभां योगिनीशां योगीन्द्रहृदये स्थिताम् ॥ ९॥ तामुग्रकालिकां राम प्रसादयितुमर्हसि । तस्याः स्तोत्रं
    महापुण्यं स्वयं काल्या प्रकाशितम् ॥ १०॥ तव तत्कथयिष्यामि श्रुत्वा वत्सावधारय । गोपनीयं प्रयत्नेन पठनीयं
    परात्परम् ॥ ११॥ यस्यैककालपठनात्सर्वे विघ्नाः समाकुलाः । नश्यन्ति दहने दीप्ते पतङ्गा इव सर्वतः ॥ १२॥
    गद्यपद्यमयी वाणी तस्य गङ्गाप्रवाहवत् । तस्य दर्शनमात्रेण वादिनो निष्प्रभा मताः ॥ १३॥ राजानोऽपि च दासत्वं
    भजन्ति च परे जनाः । तस्य हस्ते सदैवास्ति सर्वसिद्धिर्न संशयः ॥ १४॥ निशीथे मुक्तये शम्भुर्नग्नः शक्तिसमन्वितः
    । मनसा चिन्तयेत्कालीं महाकालीति लालिताम् ॥ १५॥ पठेत्सहस्रनामाख्यं स्तोत्रं मोक्षस्य साधनम् । प्रसन्ना
    कालिका तस्य पुत्रत्वेनानुकम्पते ॥ १६॥ वेधा ब्रह्मास्मृतेर्ब्रह्म कुसुमैः पूजिता परा । प्रसीदति तथा
    काली यथानेन प्रसीदति ॥ १७॥ ॐ अस्य श्रीकालिकासहस्रनामस्तोत्रमहामन्त्रस्य महाकालभैरव ऋषिः अनुष्टुप्
    छन्दः श्मशानकालिका देवता महाकालिकाप्रसादसिद्ध्यर्थे जपे विनियोगः ॥ ध्यानम् । शवारूढां महाभीमां घोरदंष्ट्रां
    हसन्मुखीम् । चतुर्भुजां खड्गमुण्डवराभयकरां शिवाम् ॥ मुण्डमालाधरां देवीं लोलज्जिह्वां दिगम्बराम् ।
    एवं सञ्चिन्तयेत्कालीं श्मशानालयवासिनीम् ॥ अथ स्तोत्रम् । ॐ क्रीं महाकाल्यै नमः ॥ ॐ श्मशानकालिका काली
    भद्रकाली कपालिनी । गुह्यकाली महाकाली कुरुकुल्ला विरोधिनी ॥ १८॥ कालिका कालरात्रिश्च महाकालनितम्बिनी
    । कालभैरवभार्या च कुलवर्त्मप्रकाशिनी ॥ १९॥ कामदा कामिनी काम्या कामनीयस्वभाविनी । कस्तूरीरसनीलाङ्गी
    कुञ्जरेश्वरगामिनी ॥ २०॥ ककारवर्णसर्वाङ्गी कामिनी कामसुन्दरी । कामार्ता कामरूपा च कामधेनुः कलावती ॥
    २१॥ कान्ता कामस्वरूपा च कामाख्या कुलपालिनी । कुलीना कुलवत्यम्बा दुर्गा दुर्गार्तिनाशिनी ॥ २२॥ कौमारी
    कुलजा कृष्णा कृष्णदेहा कृशोदरी । कृशाङ्गी कुलिशाङ्गी च क्रीङ्कारी कमला कला ॥ २३॥ करालास्या कराली च
    कुलकान्ताऽपराजिता । उग्रा चोग्रप्रभा दीप्ता विप्रचित्ता महाबला ॥ २४॥ नीला घना बलाका च मात्रामुद्रापिताऽसिता
    । ब्राह्मी नारायणी भद्रा सुभद्रा भक्तवत्सला ॥ २५॥ माहेश्वरी च चामुण्डा वाराही नारसिंहिका । वज्राङ्गी
    वज्रकङ्काली नृमुण्डस्रग्विणी शिवा ॥ २६॥ मालिनी नरमुण्डाली गलद्रक्तविभूषणा । रक्तचन्दनसिक्ताङ्गी सिन्दूरारुणमस्तका
    ॥ २७॥ घोररूपा घोरदंष्ट्रा घोराघोरतरा शुभा । महादंष्ट्रा महामाया सुदती युगदन्तुरा ॥ २८॥ सुलोचना विरूपाक्षी
    विशालाक्षी त्रिलोचना । शारदेन्दुप्रसन्नास्या स्फुरत्स्मेराम्बुजेक्षणा ॥ २९॥ अट्टहासप्रसन्नास्या स्मेरवक्त्रा
    सुभाषिणी । प्रसन्नपद्मवदना स्मितास्या प्रियभाषिणि ॥ ३०॥ कोटराक्षी कुलश्रेष्ठा महती बहुभाषिणी । सुमतिः
    कुमतिश्चण्डा चण्डमुण्डातिवेगिनी ॥ ३१॥ प्रचण्डा चण्डिका चण्डी चर्चिका चण्डवेगिनी । सुकेशी मुक्तकेशी
    च दीर्घकेशी महत्कचा ॥ ३२॥ प्रेतदेहा कर्णपूरा प्रेतपाणिसुमेखला । प्रेतासना प्रियप्रेता प्रेतभूमिकृतालया
    ॥ ३३॥ श्मशानवासिनी पुण्या पुण्यदा कुलपण्डिता । पुण्यालया पुण्यदेहा पुण्यश्लोकी च पावनी ॥ ३४॥ पुत्रा
    पवित्रा परमा पुरापुण्यविभूषणा । पुण्यनाम्नी भीतिहरा वरदा खड्गपाणिनी ॥ ३५॥ नृमुण्डहस्तशस्ता च छिन्नमस्ता
    सुनासिका । दक्षिणा श्यामला श्यामा शान्ता पीनोन्नतस्तनी ॥ ३६॥ दिगम्बरा घोररावा सृक्कान्ता रक्तवाहिनी
    । घोररावा शिवा खड्गा विशङ्का मदनातुरा ॥ ३७॥ मत्ता प्रमत्ता प्रमदा सुधासिन्धुनिवासिनी । अतिमत्ता महामत्ता
    सर्वाकर्षणकारिणी ॥ ३८॥ गीतप्रिया वाद्यरता प्रेतनृत्यपरायणा । चतुर्भुजा दशभुजा अष्टादशभुजा तथा ॥ ३९॥
    कात्यायनी जगन्माता जगती परमेश्वरी । जगद्बन्धुर्जगद्धात्री जगदानन्दकारिणी ॥ ४०॥ जन्ममयी हैमवती महामाया
    महामहा । नागयज्ञोपवीताङ्गी नागिनी नागशायिनी ॥ ४१॥ नागकन्या देवकन्या गन्धर्वी किन्नरेश्वरी । मोहरात्री
    महारात्री दारुणा भासुराम्बरा ॥ ४२॥ विद्याधरी वसुमती यक्षिणी योगिनी जरा । राक्षसी डाकिनी वेदमयी वेदविभूषणा
    ॥ ४३॥ श्रुतिः स्मृतिर्महाविद्या गुह्यविद्या पुरातनी । चिन्त्याऽचिन्त्या स्वधा स्वाहा निद्रा तन्द्रा
    च पार्वती ॥ ४४॥ अपर्णा निश्चला लोला सर्वविद्या तपस्विनी । गङ्गा काशी शची सीता सती सत्यपरायणा ॥ ४५॥
    नीतिस्सुनीतिस्सुरुचिस्तुष्टिः पुष्टिर्धृतिः क्षमा । वाणी बुद्धिर्महालक्ष्मीर्लक्ष्मीर्नीलसरस्वती ॥
    ४६॥ स्रोतस्वती सरस्वती मातङ्गी विजया जया । नदी सिन्धुः सर्वमयी तारा शून्यनिवासिनी ॥ ४७॥ शुद्धा तरङ्गिणी
    मेधा लाकिनी बहुरूपिणी । स्थूला सूक्ष्मा सूक्ष्मतरा भगवत्यनुरूपिणी ॥ ४८॥ परमाणुस्वरूपा च चिदानन्दस्वरूपिणी
    । सदानन्दमयी सत्या सर्वानन्दस्वरूपिणी ॥ ४९॥ सुनन्दा नन्दिनी स्तुत्या स्तवनीयस्वभाविनी । रङ्गिणी टङ्किनी
    चित्रा विचित्रा चित्ररूपिणी ॥ ५०॥ पद्मा पद्मालया पद्ममुखी पद्मविभूषणा । डाकिनी शाकिनी क्षान्ता राकिणी
    रुधिरप्रिया ॥ ५१॥ भ्रान्तिर्भवानी रुद्राणी मृडानी शत्रुमर्दिनी । उपेन्द्राणी महेन्द्राणी ज्योत्स्ना
    चन्द्रस्वरूपिणी ॥ ५२॥ सूर्यात्मिका रुद्रपत्नी रौद्री स्त्री प्रकृतिः पुमान् । शक्तिर्मुक्तिर्मतिर्माता
    भक्तिर्मुक्तिः पतिव्रता ॥ ५३॥ सर्वेश्वरी सर्वमाता शर्वाणी हरवल्लभा । सर्वज्ञा सिद्धिदा सिद्धा भव्या
    भाव्या भयापहा ॥ ५४॥ कर्त्री हर्त्री पालयित्री शर्वरी तामसी दया । तमिस्रा तामसी स्थाणुः स्थिरा धीरा
    तपस्विनी ॥ ५५॥ चार्वङ्गी चञ्चला लोलजिह्वा चारुचरित्रिणी । त्रपा त्रपावती लज्जा विलज्जा हरयौवती ॥ ५६॥
