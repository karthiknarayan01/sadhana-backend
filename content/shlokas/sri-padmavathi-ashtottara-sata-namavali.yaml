id: sri-padmavathi-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Padmavathi Ashtottara Sata Namavali
content:
  english: om padmavatyai namah | om devyai namah | om padmodbhavayai namah | om karunapradayinyai namah
    | om sahridayayai namah | om tejasvarupinyai namah | om kamalamukhai namah | om padmadharayai namah
    | om shriyai namah | om padmanetre namah | | om padmakarayai namah | om sugunayai namah | om kunkumapriyayai
    namah | om hemavarnayai namah | om candravanditayai namah | om dhagadhagaprakasha shariradharinyai
    namah | om vishnupriyayai namah | om nityakalyanyai namah | om kotisuryaprakashinyai namah | om mahasaundaryarupinyai
    namah | | om bhaktavatsalayai namah | om brahmandavasinyai namah | om sarvavanchaphaladayinyai namah
    | om dharmasankalpayai namah | om dakshinyakatakshinyai namah | om bhaktipradayinyai namah | om gunatrayavivarjitayai
    namah | om kalashodashasamyutayai namah | om sarvalokanam jananyai namah | om muktidayinyai namah
    | | om dayamritayai namah | om prajnayai namah | om mahadharmayai namah | om dharmarupinyai namah
    | om alankara priyayai namah | om sarvadaridryadhvamsinyai namah | om shri venkateshavakshasthalasthitayai
    namah | om lokashokavinashinyai namah | om vaishnavyai namah | om tirucanurupuravasinyai namah | |
    om vedavidyavisharadayai namah | om vishnupadasevitayai namah | om ratnaprakashakiritadharinyai namah
    | om jaganmohinyai namah | om shaktisvarupinyai namah | om prasannodayayai namah | om indradidaivata
    yakshakinnèrakimpurushapujitayai namah | om sarvalokanivasinyai namah | om bhujayayai namah | om aishvaryapradayinyai
    namah | | om shantayai namah | om unnatasthanasthitayai namah | om mandarakaminyai namah | om kamalakarayai
    namah | om vedantajnanarupinyai namah | om sarvasampattirupinyai namah | om kotisuryasamaprabhayai
    namah | om pujaphaladayinyai namah | om kamalasanadi sarvadevatayai namah | om vaikunthavasinyai namah
    | | om abhayadayinyai namah | om drakshaphalapayasapriyayai namah | om nrityagitapriyayai namah |
    om kshirasagarodbhavayai namah | om akasharajaputrikayai namah | om suvarnahastadharinyai namah |
    om kamarupinyai namah | om karunakatakshadharinyai namah | om amritasujayai namah | om bhulokasvargasukhadayinyai
    namah | | om ashtadikpalakadhipatyai namah | om manmadhadarpasamharyai namah | om kamalardhabhagayai
    namah | om svalpaparadha mahaparadha kshamayai namah | om shatkotitirthavasitayai namah | om naradadimunishreshthapujitayai
    namah | om adishankarapujitayai namah | om pritidayinyai namah | om saubhagyapradayinyai namah | om
    mahakirtipradayinyai namah | | om krishnatipriyayai namah | om gandharvashapavimocakayai namah | om
    krishnapatnyai namah | om trilokapujitayai namah | om jaganmohinyai namah | om sulabhayai namah |
    om sushilayai namah | om anjanasutanugrahapradayinyai namah | om bhaktyatmanivasinyai namah | om sandhyavandinyai
    namah | om sarvalokamatre namah | om abhimatadayinyai namah | om lalitavadhutyai namah | om samastashastravisharadayai
    namah | om suvarnabharanadharinyai namah | om ihaparalokasukhapradayinyai namah | om karaviranivasinyai
    namah | om nagalokamanisaha akashasindhukamaleshvarapurita rathagamanayai namah | om shri shrinivasapriyayai
    namah | om candramandalasthitayai namah | | om alivelumangayai namah | om divyamangaladharinyai namah
    | om sukalyanapithasthayai namah | om kamakavanapushpapriyayai namah | om kotimanmadharupinyai namah
    | om bhanumandalarupinyai namah | om padmapadayai namah | om ramayai namah | | om sarvalokasabhantaradharinyai
    namah | om sarvamanasavasinyai namah | om sarvayai namah | om vishvarupayai namah | om divyajnanayai
    namah | om sarvamangalarupinyai namah | om sarvanugrahapradayinyai namah | om onkarasvarupinyai namah
    | om brahmajnanasambhutayai namah | om padmavatyai namah | om sadyovedavatyai namah | om shri mahalakshmai
    namah |
  devanagari: ॐ पद्मावत्यै नमः । ॐ देव्यै नमः । ॐ पद्मोद्भवायै नमः । ॐ करुणप्रदायिन्यै नमः । ॐ सहृदयायै
    नमः । ॐ तेजस्वरूपिण्यै नमः । ॐ कमलमुखै नमः । ॐ पद्मधरायै नमः । ॐ श्रियै नमः । ॐ पद्मनेत्रे नमः । ।
    ॐ पद्मकरायै नमः । ॐ सुगुणायै नमः । ॐ कुङ्कुमप्रियायै नमः । ॐ हेमवर्णायै नमः । ॐ चन्द्रवन्दितायै नमः
    । ॐ धगधगप्रकाश शरीरधारिण्यै नमः । ॐ विष्णुप्रियायै नमः । ॐ नित्यकल्याण्यै नमः । ॐ कोटिसूर्यप्रकाशिन्यै
    नमः । ॐ महासौन्दर्यरूपिण्यै नमः । । ॐ भक्तवत्सलायै नमः । ॐ ब्रह्माण्डवासिन्यै नमः । ॐ सर्ववाञ्छाफलदायिन्यै
    नमः । ॐ धर्मसङ्कल्पायै नमः । ॐ दाक्षिण्यकटाक्षिण्यै नमः । ॐ भक्तिप्रदायिन्यै नमः । ॐ गुणत्रयविवर्जितायै
    नमः । ॐ कलाषोडशसंयुतायै नमः । ॐ सर्वलोकानां जनन्यै नमः । ॐ मुक्तिदायिन्यै नमः । । ॐ दयामृतायै नमः
    । ॐ प्राज्ञायै नमः । ॐ महाधर्मायै नमः । ॐ धर्मरूपिण्यै नमः । ॐ अलङ्कार प्रियायै नमः । ॐ सर्वदारिद्र्यध्वंसिन्यै
    नमः । ॐ श्री वेङ्कटेशवक्षस्थलस्थितायै नमः । ॐ लोकशोकविनाशिन्यै नमः । ॐ वैष्णव्यै नमः । ॐ तिरुचानूरुपुरवासिन्यै
    नमः । । ॐ वेदविद्याविशारदायै नमः । ॐ विष्णुपादसेवितायै नमः । ॐ रत्नप्रकाशकिरीटधारिण्यै नमः । ॐ जगन्मोहिन्यै
    नमः । ॐ शक्तिस्वरूपिण्यै नमः । ॐ प्रसन्नोदयायै नमः । ॐ इन्द्रादिदैवत यक्षकिन्नॆरकिम्पुरुषपूजितायै
    नमः । ॐ सर्वलोकनिवासिन्यै नमः । ॐ भूजयायै नमः । ॐ ऐश्वर्यप्रदायिन्यै नमः । । ॐ शान्तायै नमः । ॐ उन्नतस्थानस्थितायै
    नमः । ॐ मन्दारकामिन्यै नमः । ॐ कमलाकरायै नमः । ॐ वेदान्तज्ञानरूपिण्यै नमः । ॐ सर्वसम्पत्तिरूपिण्यै
