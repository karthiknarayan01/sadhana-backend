id: gananathastotramjanmamrityuvihinam
category: stotram
name:
  english: gananathastotramjanmamrityuvihinam
  devanagari: गणनाथस्तोत्रम्जन्ममृत्युविहीनं
content:
  english: janmamrityuvihinam shrigananathastotram || shriganeshaya namah || garbha uvaca | namaste gananathaya
    brahmane brahmarupine | anathanam pranathaya vighneshaya namo namah || 1|| jyeshtharajaya devaya devadeveshamurtaye
    | anadaye pareshaya cadipujyaya te namah || 2|| sarvapujyaya sarvesham sarvarupaya te namah | sarvadaye
    parabrahman sarveshaya namo namah || 3|| gajakarasvarupaya gajakaramayaya te | gajamastakadharaya
    gajeshaya namo namah || 4|| adimadhyantabhavaya svanandapataye namah | adimadhyantahinaya tvadimadhyantagaya
    te || 5|| siddhibuddhipradatre ca siddhibuddhiviharine | siddhibuddhimayayaiva brahmeshaya namo namah
    || 6|| shivaya shaktaye caiva vishnave bhanurupine | mayinam mayaya natha mohadaya namo namah || 7||
    kim staumi tvam ganadhisha yatra vedadayo'pare | yoginah shantimapanna atastvam pranamamyaham || 8||
    raksha mam garbhaduhkhattvam tvameva sharanagatam | janmamrityuvihinam vai kurushva te padapriyam
    || 9|| iti janmamrityuvihinam shrigananathastotram sampurnam ||
  devanagari: जन्ममृत्युविहीनं श्रीगणनाथस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ गर्भ उवाच । नमस्ते गणनाथाय ब्रह्मणे
    ब्रह्मरूपिणे । अनाथानां प्रणाथाय विघ्नेशाय नमो नमः ॥ १॥ ज्येष्ठराजाय देवाय देवदेवेशमूर्तये । अनादये
    परेशाय चादिपूज्याय ते नमः ॥ २॥ सर्वपूज्याय सर्वेषां सर्वरूपाय ते नमः । सर्वादये परब्रह्मन् सर्वेशाय
    नमो नमः ॥ ३॥ गजाकारस्वरूपाय गजाकारमयाय ते । गजमस्तकधाराय गजेशाय नमो नमः ॥ ४॥ आदिमध्यान्तभावाय स्वानन्दपतये
    नमः । आदिमध्यान्तहीनाय त्वादिमध्यान्तगाय ते ॥ ५॥ सिद्धिबुद्धिप्रदात्रे च सिद्धिबुद्धिविहारिणे । सिद्धिबुद्धिमयायैव
    ब्रह्मेशाय नमो नमः ॥ ६॥ शिवाय शक्तये चैव विष्णवे भानुरूपिणे । मायिनां मायया नाथ मोहदाय नमो नमः ॥ ७॥
    किं स्तौमि त्वां गणाधीश यत्र वेदादयोऽपरे । योगिनः शान्तिमापन्ना अतस्त्वां प्रणमाम्यहम् ॥ ८॥ रक्ष मां
    गर्भदुःखात्त्वं त्वामेव शरणागतम् । जन्ममृत्युविहीनं वै कुरुष्व ते पदप्रियम् ॥ ९॥ इति जन्ममृत्युविहीनं
    श्रीगणनाथस्तोत्रं सम्पूर्णम् ॥
