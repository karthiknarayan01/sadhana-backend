id: nilakarnakritambalakrishnastotram
category: stotram
name:
  english: nilakarnakritambalakrishnastotram
  devanagari: नीलकर्णकृतंबालकृष्णस्तोत्रम्
content:
  english: nilakarnakritam balakrishnastotram prananama muhuh krishnam balakrishnam pareshvaram | vrikayano
    maharshishca stotram cakara vai hareh || 26|| pujanam pracakara'sau shalavrikshadalaistada | vrishtijalairmanobhavaih
    pupuja parameshvaram || 27|| yena raksha krita''rambhe brahmanah parameshthinah | tena tvaya'tra me
    raksha krita tubhyam namo namah || 28|| yena raksha krita purvam satyavratasya sagare | tena tvaya'tra
    me raksha krita tubhyam namo namah || 29|| yenabdhimanthane raksha bahunam vai krita pura | yena deva
    rakshitashca daityastu vinipatitah || 30|| yena dugdha medini ca rakshitah praninah pura | yena sagaratalaga
    rakshita vai kshitih pura || 31|| yena'ngushthajalenaitadbrahmandam pavanam kritam | tena tvaya'tra
    me raksha vihita te namo'stu ca || 32|| yena dhruvashca prahlado rakshitau balakau pura | yena banasurashcatra
    ghatitah paramatmana || 33|| talaja rakshita yena mokshita sharanagata | daityo damanako yena mokshitah
    paramatmana || 34|| kankatala mokshitashca naraka mokshitastatha | salamalo nashitashca yena tena'vito'smi
    ca || 35|| balah pramokshita yena rajyamata pramokshita | vallidino nashitashca varatako vinashitah
    || 36|| vanaspatyadayo yena rakshobhavadvimocitah | devayanasamuddharashcandalayonitah kritah || 37||
    kanthadharah krito yena ciranjivo'pi vai tatah | ranangamena putrena tarito yena sharngina || 38||
    ma~jammbika rakshita ca mleccha vinashitastatha | raktabijo nashitashca yena tena'vito'smyaham ||
    39|| jalamagno nripatishca rakshito hyudayabhidhah | vasumedho rakshitashca jale yena namo'stu te
    || 40|| jyamaghastarito yena caurebhyah sudhano'vitah | tryashtakarurmokshitashca yena tubhyam namo'stu
    te || 41|| hiranyakeshashishyashca sajiva yena vai kritah | vrihadvarcastaritashca baleshvaro'pi mokshitah
    || 42|| jayadhvajo mokshitashca yena tubhyam namo'stu me | ailavila tarita ca'dharmajivo vinashitah
    || 43|| mahamari nashita ca mrita yena tu jivitah | ushnalayapraja varimrita yena prajivitah || 44||
    cakravakyai jalam yena girisha
  devanagari: नीलकर्णकृतं बालकृष्णस्तोत्रम् प्रणनाम मुहुः कृष्णं बालकृष्णं परेश्वरम् । वृकायनो महर्षिश्च
    स्तोत्रं चकार वै हरेः ॥ २६॥ पूजनं प्रचकाराऽसौ शालवृक्षदलैस्तदा । वृष्टिजलैर्मनोभावैः पुपूज परमेश्वरम्
    ॥ २७॥ येन रक्षा कृताऽऽरम्भे ब्रह्मणः परमेष्ठिनः । तेन त्वयाऽत्र मे रक्षा कृता तुभ्यं नमो नमः ॥ २८॥
    येन रक्षा कृता पूर्वं सत्यव्रतस्य सागरे । तेन त्वयाऽत्र मे रक्षा कृता तुभ्यं नमो नमः ॥ २९॥ येनाब्धिमन्थने
    रक्षा बहूनां वै कृता पुरा । येन देवा रक्षिताश्च दैत्यास्तु विनिपातिताः ॥ ३०॥ येन दुग्धा मेदिनी च रक्षिताः
    प्राणिनः पुरा । येन सागरतलगा रक्षिता वै क्षितिः पुरा ॥ ३१॥ येनाऽङ्गुष्ठजलेनैतद्ब्रह्माण्डं पावनं कृतम्
    । तेन त्वयाऽत्र मे रक्षा विहिता ते नमोऽस्तु च ॥ ३२॥ येन ध्रुवश्च प्रह्लादो रक्षितौ बालकौ पुरा । येन
    बाणासुरश्चात्र घातितः परमात्मना ॥ ३३॥ तलाजा रक्षिता येन मोक्षिता शरणागता । दैत्यो दमनको येन मोक्षितः
    परमात्मना ॥ ३४॥ कङ्कताला मोक्षिताश्च नारका मोक्षितास्तथा । सालमालो नाशितश्च येन तेनाऽवितोऽस्मि च ॥
    ३५॥ बालाः प्रमोक्षिता येन राज्यमाता प्रमोक्षिता । वल्लीदीनो नाशितश्च वराटको विनाशितः ॥ ३६॥ वनस्पत्यादयो
    येन रक्षोभावाद्विमोचिताः । देवायनसमुद्धारश्चाण्डालयोनितः कृतः ॥ ३७॥ कन्थाधरः कृतो येन चिरञ्जीवोऽपि
    वै ततः । रणङ्गमेन पुत्रेण तारितो येन शार्ङ्गिणा ॥ ३८॥ माँजाम्म्बिका रक्षिता च म्लेच्छा विनाशितास्तथा
    । रक्तबीजो नाशितश्च येन तेनाऽवितोऽस्म्यहम् ॥ ३९॥ जलमग्नो नृपतिश्च रक्षितो ह्युदयाभिधः । वसुमेधो रक्षितश्च
    जले येन नमोऽस्तु ते ॥ ४०॥ ज्यामघस्तारितो येन चौरेभ्यः सुधनोऽवितः । त्र्यष्टकारुर्मोक्षितश्च येन तुभ्यं
    नमोऽस्तु ते ॥ ४१॥ हिरण्यकेशशिष्याश्च सजीवा येन वै कृताः । वृहद्वर्चास्तारितश्च बलेश्वरोऽपि मोक्षितः
    ॥ ४२॥ जयध्वजो मोक्षितश्च येन तुभ्यं नमोऽस्तु मे । ऐलविला तारिता चाऽधर्मजीवो विनाशितः ॥ ४३॥ महामारी
    नाशिता च मृता येन तु जीविताः । उष्णालयप्रजा वारिमृता येन प्रजीविताः ॥ ४४॥ चक्रवाक्यै जलं येन गिरिश
