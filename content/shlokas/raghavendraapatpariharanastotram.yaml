id: raghavendraapatpariharanastotram
category: stotram
name:
  english: raghavendraapatpariharanastotram
  devanagari: राघवेन्द्रआपत्परिहरणस्तोत्रम्
content:
  english: davadoshavidhure danavadvishi mamadaya dhehi hridayam | shriraghavendrapadaviryadibhogabhavaghoraghamashu
    hara bhoh daratmajadi bhavavarashi sambhavadaparapadah shamaya bhoh || 4|| drakshamadhuksharana shaikshakaramala
    katakshavalokata uta tatkshamatam harasi bhaikshatakasya bhuvi lakshadhikasya sapadi | shriraghavendra
    padavariyadi bhogabhava ghoraghamashu hara bhoh dharatmajadi bhavavarashai sambhavadaparapadah shamayo
    bhoh || 5|| yanadisampadamanunamavaptumahamanayi purvasrikri tenagryate padamato'nadi durduritamanashayashu
    mamabhoh | shriraghavendra padaviryadi bhogabhava ghoraghamashu hara bhoh daratmajadi bhavavarashi
    sambhavadaparapadah shamaya bhoh || 6|| nagarivahapadayogadaramitadagaradaradhana bhogavanaptumanuragata
    tavabhimativegadupaimi sukhadam | shriraghavendra padaviryadi bhogabhava gharaghamashu hara bhoh daratmajadi
    bhavavarashi sambhavadaparapadah shamaya bhoh || 7|| mantralayasya tava mantradijapturarimantradi
    samhatita tantrabhavatyakhilatantryadhikeshvaparatantravamamupagatam | shriraghavendra padaviryadi
    bhogabhava ghoraghamashu hara bhoh daratmajadi bhavavarati sambhavadaparapadah shamaya bhoh || 8||
    krishnavadhutakritamishtarthadanacanamashtarthamantra pari pushtatulastamavakashtavaha shubhamarishtaharam
    pathatiyah | shriraghavendra padaviryadi bhogabhava ghoraghamashu hara bhoh daratmajadi bhavavarashisambhavadaparapadah
    shamaya bhoh || 9|| iti shrikrishnavadhutaviracite shriraghavendratantre navamapatale apatpariharanastotram
    nama dvitiyo'dhyayah sampurnah |
  devanagari: दावदोषविधुरे दानवद्विषि ममादाय धेहि हृदयम् । श्रीराघवेन्द्रपदवीर्यादिभोगभवघोराघमाशु हर भोः
    दारात्मजादि भववाराशि सम्भवदपारापदः शमय भोः ॥ ४॥ द्राक्षामधुक्षरण शैक्षाकरामल कटाक्षावलोकत उत तत्क्षामतां
    हरसि भैक्षाटकस्य भुवि लक्षाधिकस्य सपदि । श्रीराघवेन्द्र पदवरीयादि भोगभव घोराघमाशु हर भोः धारात्मजादि
    भववाराशै सम्भवदपारापदः शमयो भोः ॥ ५॥ यानादिसम्पदमनूनामवाप्तुमहमानायि पूर्वसृकृ तेनाग्र्यते पदमतोऽनादि
    दुर्दुरितमानाशयाशु ममभोः । श्रीराघवेन्द्र पदवीर्यादि भोगभव घोराघमाशु हर भोः दारात्मजादि भववाराशि सम्भवदपारापदः
    शमय भोः ॥ ६॥ नागारिवाहपदयोगादरामितदागारदारधन भोगावनाप्तुमनुरागत तवाभिमतिवेगादुपैमि सुखदम् । श्रीराघवेन्द्र
    पदवीर्यादि भोगभव घाराघमाशु हर भोः दारात्मजादि भववाराशि सम्भवदपारापदः शमय भोः ॥ ७॥ मन्त्रालयस्य तव
    मन्त्रादिजप्तुररिमन्त्रादि संहतित तन्त्राभवत्यखिलतन्त्र्याधिकेष्वपरतन्त्रावमामुपगतम् । श्रीराघवेन्द्र
    पदवीर्यादि भोगभव घोराघमाशु हर भोः दारात्मजादि भववाराति सम्भवदपारापदः शमय भोः ॥ ८॥ कृष्णावधूतकृतमिष्टार्थदानचणमष्टार्थमन्त्र
    परि पुष्टातुलस्तमवकष्टावह शुभमरिष्टाहरं पठतियः । श्रीराघवेन्द्र पदवीर्यादि भोगभव घोराघमाशु हर भोः
    दारात्मजादि भववाराशिसम्भवदपारापदः शमय भोः ॥ ९॥ इति श्रीकृष्णावधूतविरचिते श्रीराघवेन्द्रतन्त्रे नवमपटले
    आपत्परिहरणस्तोत्रम् नाम द्वितीयोऽध्यायः सम्पूर्णः ।
