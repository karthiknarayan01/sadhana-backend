id: pancamukha
category: kavacha
name:
  english: pancamukha
  devanagari: पन्चमुख
content:
  english: rinusarvangasundari | yatkritam devadevena dhyanam hanumatah priyam || 1|| pancavaktram mahabhimam
    tripancanayanairyutam | bahubhirdashabhiryuktam sarvakamarthasiddhidam || 2|| purvam tu vanaram vaktram
    kotisuryasamaprabham | danshtrakaralavadanam bhrikutikutilekshanam || 3|| asyaiva dakshinam vaktram
    narasimham mahadbhutam | atyugratejovapusham bhishanam bhayanashanam || 4|| pashcimam garudam vaktram
    vakratundam mahabalam || sarvanagaprashamanam vishabhutadikrintanam || 5|| uttaram saukaram vaktram
    krishnam diptam nabhopamam | patalasimhavetalajvararogadikrintanam || 6|| urdhvam hayananam ghoram
    danavantakaram param | yena vaktrena viprendra tarakakhyam mahasuram || 7|| jaghana sharanam tatsyatsarvashatruharam
    param | dhyatva pancamukham rudram hanumantam dayanidhim || 8|| khadgam trishulam khatvangam pashamankushaparvatam
    | mushtim kaumodakim vriksham dharayantam kamandalum || 9|| bhindipalam jnanamudram dashabhirmunipungavam
    | etanyayudhajalani dharayantam bhajamyaham || 10|| pretasanopavishtam tam sarvabharanabhushitam |
    divyamalyambaradharam divyagandhanulepanam || 11|| sarvashcaryamayam devam hanumadvishvatomukham |
    pancasyamacyutamanekavicitravarnavaktram shashankashikharam kapirajavaryama | pitambaradimukutairupashobhitangam
    pingakshamadyamanisham manasa smarami || 12|| markatesham mahotsaham sarvashatruharam param | shatru
    samhara mam raksha shrimannapadamuddhara || 13|| om harimarkata markata mantramidam parilikhyati likhyati
    vamatale | yadi nashyati nashyati shatrukulam yadi muncati muncati vamalata || 14|| om harimarkataya
    svaha | om namo bhagavate pancavadanaya purvakapimukhaya sakalashatrusamharakaya svaha | om namo bhagavate
    pancavadanaya dakshinamukhaya karalavadanaya narasimhaya sakalabhutapramathanaya svaha | om namo bhagavate
    pancavadanaya pashcimamukhaya garudananaya sakalavishaharaya svaha | om namo bhagavate pancavadanayottaramukhayadivarahaya
    sakalasampatkaraya svaha | om namo bhagavate pancavadanayordhvamukhaya hayagrivaya sakalajanavashankaraya
    svaha | om asya shri pancamukhahanumanmantrasya shriramacandra rishih | anushtupchandah | pancamukhavirahanuman
    devata | hanumaniti bijam | vayuputra iti shaktih | anjanasuta iti kilakam | shriramadutahanumatprasadasiddhyarthe
    jape viniyogah | iti rishyadikam vinyaset || om anjanasutaya angushthabhyam namah | om rudramurtaye
    tarjanibhyam namah | om vayuputraya madhyamabhyam namah | om agnigarbhaya anamikabhyam namah | om
    ramadutaya kanishthikabhyam namah | om pancamukhahanumate karatalakaraprishthabhyam namah | iti karanyasah
    || om anjanasutaya hridayaya namah | om rudramurtaye shirase svaha | om vayuputraya shikhayai vashat
    | om agnigarbhaya kavacaya hum | om ramadutaya netratrayaya vaushat | om pancamukhahanumate astraya
    phat | pancamukhahanumate svaha | iti digbandhah || atha dhyanam | vande vanaranarasimhakhagaratkrodashvavaktranvitam
    divyalankaranam tripancanayanam dedipyamanam ruca | hastabjairasikhetapustakasudhakumbhankushadrim
    halam khatvangam phanibhuruham dashabhujam sarvarivirapaham | atha mantrah | om shriramadutayanjaneyaya
    vayuputraya mahabalaparakramaya sitaduhkhanivaranaya lankadahanakaranaya mahabalapracandaya phalgunasakhaya
    kolahalasakalabrahmandavishvarupaya saptasamudranirlanghanaya pingalanayanayamitavikramaya suryabimbaphalasevanaya
    dushtanivaranaya drishtiniralankritaya sanjivinisanjivitangadalakshmanamahakapisainyapranadaya dashakanthavidhvamsanaya
    rameshtaya mahaphalgunasakhaya sitasahita
  devanagari: ृणुसर्वाङ्गसुन्दरि । यत्कृतं देवदेवेन ध्यानं हनुमतः प्रियम् ॥ १॥ पञ्चवक्त्रं महाभीमं त्रिपञ्चनयनैर्युतम्
    । बाहुभिर्दशभिर्युक्तं सर्वकामार्थसिद्धिदम् ॥ २॥ पूर्वं तु वानरं वक्त्रं कोटिसूर्यसमप्रभम् । दन्ष्ट्राकरालवदनं
    भृकुटीकुटिलेक्षणम् ॥ ३॥ अस्यैव दक्षिणं वक्त्रं नारसिंहं महाद्भुतम् । अत्युग्रतेजोवपुषं भीषणं भयनाशनम्
    ॥ ४॥ पश्चिमं गारुडं वक्त्रं वक्रतुण्डं महाबलम् ॥ सर्वनागप्रशमनं विषभूतादिकृन्तनम् ॥ ५॥ उत्तरं सौकरं
    वक्त्रं कृष्णं दीप्तं नभोपमम् । पातालसिंहवेतालज्वररोगादिकृन्तनम् ॥ ६॥ ऊर्ध्वं हयाननं घोरं दानवान्तकरं
    परम् । येन वक्त्रेण विप्रेन्द्र तारकाख्यं महासुरम् ॥ ७॥ जघान शरणं तत्स्यात्सर्वशत्रुहरं परम् । ध्यात्वा
    पञ्चमुखं रुद्रं हनुमन्तं दयानिधिम् ॥ ८॥ खड्गं त्रिशूलं खट्वाङ्गं पाशमङ्कुशपर्वतम् । मुष्टिं कौमोदकीं
    वृक्षं धारयन्तं कमण्डलुम् ॥ ९॥ भिन्दिपालं ज्ञानमुद्रां दशभिर्मुनिपुङ्गवम् । एतान्यायुधजालानि धारयन्तं
    भजाम्यहम् ॥ १०॥ प्रेतासनोपविष्टं तं सर्वाभरणभूषितम् । दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम् ॥ ११॥
    सर्वाश्चर्यमयं देवं हनुमद्विश्वतोमुखम् । पञ्चास्यमच्युतमनेकविचित्रवर्णवक्त्रं शशाङ्कशिखरं कपिराजवर्यम
    । पीताम्बरादिमुकुटैरूपशोभिताङ्गं पिङ्गाक्षमाद्यमनिशं मनसा स्मरामि ॥ १२॥ मर्कटेशं महोत्साहं सर्वशत्रुहरं
    परम् । शत्रु संहर मां रक्ष श्रीमन्नापदमुद्धर ॥ १३॥ ॐ हरिमर्कट मर्कट मन्त्रमिदं परिलिख्यति लिख्यति
    वामतले । यदि नश्यति नश्यति शत्रुकुलं यदि मुञ्चति मुञ्चति वामलता ॥ १४॥ ॐ हरिमर्कटाय स्वाहा । ॐ नमो
    भगवते पञ्चवदनाय पूर्वकपिमुखाय सकलशत्रुसंहारकाय स्वाहा । ॐ नमो भगवते पञ्चवदनाय दक्षिणमुखाय करालवदनाय
    नरसिंहाय सकलभूतप्रमथनाय स्वाहा । ॐ नमो भगवते पञ्चवदनाय पश्चिममुखाय गरुडाननाय सकलविषहराय स्वाहा । ॐ
    नमो भगवते पञ्चवदनायोत्तरमुखायादिवराहाय सकलसम्पत्कराय स्वाहा । ॐ नमो भगवते पञ्चवदनायोर्ध्वमुखाय हयग्रीवाय
    सकलजनवशङ्कराय स्वाहा । ॐ अस्य श्री पञ्चमुखहनुमन्मन्त्रस्य श्रीरामचन्द्र ऋषिः । अनुष्टुप्छन्दः । पञ्चमुखवीरहनुमान्
    देवता । हनुमानिति बीजम् । वायुपुत्र इति शक्तिः । अञ्जनासुत इति कीलकम् । श्रीरामदूतहनुमत्प्रसादसिद्ध्यर्थे
    जपे विनियोगः । इति ऋष्यादिकं विन्यसेत् ॥ ॐ अञ्जनासुताय अङ्गुष्ठाभ्यां नमः । ॐ रुद्रमूर्तये तर्जनीभ्यां
    नमः । ॐ वायुपुत्राय मध्यमाभ्यां नमः । ॐ अग्निगर्भाय अनामिकाभ्यां नमः । ॐ रामदूताय कनिष्ठिकाभ्यां नमः
    । ॐ पञ्चमुखहनुमते करतलकरपृष्ठाभ्यां नमः । इति करन्यासः ॥ ॐ अञ्जनासुताय हृदयाय नमः । ॐ रुद्रमूर्तये
    शिरसे स्वाहा । ॐ वायुपुत्राय शिखायै वषट् । ॐ अग्निगर्भाय कवचाय हुम् । ॐ रामदूताय नेत्रत्रयाय वौषट्
    । ॐ पञ्चमुखहनुमते अस्त्राय फट् । पञ्चमुखहनुमते स्वाहा । इति दिग्बन्धः ॥ अथ ध्यानम् । वन्दे वानरनारसिंहखगराट्क्रोडाश्ववक्त्रान्वितं
    दिव्यालङ्करणं त्रिपञ्चनयनं देदीप्यमानं रुचा । हस्ताब्जैरसिखेटपुस्तकसुधाकुम्भाङ्कुशाद्रिं हलं खट्वाङ्गं
    फणिभूरुहं दशभुजं सर्वारिवीरापहम् । अथ मन्त्रः । ॐ श्रीरामदूतायाञ्जनेयाय वायुपुत्राय महाबलपराक्रमाय
    सीतादुःखनिवारणाय लङ्कादहनकारणाय महाबलप्रचण्डाय फाल्गुनसखाय कोलाहलसकलब्रह्माण्डविश्वरूपाय सप्तसमुद्रनिर्लङ्घनाय
    पिङ्गलनयनायामितविक्रमाय सूर्यबिम्बफलसेवनाय दुष्टनिवारणाय दृष्टिनिरालङ्कृताय सञ्जीविनीसञ्जीविताङ्गदलक्ष्मणमहाकपिसैन्यप्राणदाय
    दशकण्ठविध्वंसनाय रामेष्टाय महाफाल्गुनसखाय सीतासहित
