id: lakshmisahasranamastotram-2
category: sahasranama
name:
  english: lakshmisahasranamastotram 2
  devanagari: लक्ष्मीसहस्रनामस्तोत्रम् २
content:
  english: mahalakshmirmaheshana mahamaya malapaha | vishnupatni vidhisharcya vishvayonirvaraprada ||
    1|| dhatri vidhatri dharmishtha dhammillodbhasimallika | bhargavi bhaktijanani bhavanatha bhavarcita
    || 2|| bhadra bhadraprada bhavya bhaktabhishtaphalaprada | praḻayastha prasiddha ma prakrishtaishvaryadayini
    || 3|| vishnushaktirvishnumaya vishnuvakshahsthalasthita | vagrupa vagvibhutijna vakprada varada vara
    || 4|| sampatprada sarvashaktih samvidrupa sama'sama | haridrabha harinnathapujita harimohini || 5||
    hatapapa hatakhala hitahitavivarjita | hitahitapara'heya harshada harsharupini || 6|| vedashastralisamsevya
    vedarupa vidhistuta | shrutih smritirmatih sadhvi shruta'shrutadhara dhara || 7|| shrih shritaghadhvantabhanuh
    shreyasi shreshtharupini | indira mandirantastha manduravasini mahi || 8|| dhanalakshmirdhanakari
    dhaniprita dhanaprada | dhanasamriddhida dhurya dhutagha dhautamanasa || 9|| dhanyalakshmirdaritagha
    daridryavinivarini | viralakshmirviravandya virakhadgagravasini || 10|| akrodhana'lobhapara lalita
    lobhinashini | lokavandya lokamata locanadhahkritotpala || 11|| hastihastopamanoruh hastadvayadhritambuja
    | hastikumbhopamakuca hastikumbhasthalasthita || 12|| rajalakshmi rajarajasevita rajyadayini | rakendusundari
    rasya rasalarasabhashana || 13|| koshavriddhih kotidatri kotikotiraviprabha | karmaradhya karmagamya
    karmanam phaladayini || 14|| dhairyaprada dhairyarupa dhira dhirasamarcita | pativrata paratarapurusharthaprada'para
    || 15|| padmalaya padmakara padmakshi padmadharini | padmini padmada padma padmashankhadisevita ||
    16|| divya divyangaragadhya divyadivyasvarupadhrit | dayanidhirdanapara danavaratibhamini || 17||
    devakaryapara devi daityendraparipujita | narayani nadagata nakarajasamarcita || 18|| nakshatranathavadana
    narasimhapriya'nala | jagadrupa jagannatha jangamajangamakritih || 19|| kavita kanjanilaya kamra kalinishedhini
    | karunyasindhuh kamala kamalakshi kuconnata || 20|| balipriya balihari balini balisamstuta | hirabhusha
    hinadosha hanihartri hatasura || 21|| havyakavyarcita hatyadikapatakanashini | vishuddhasattva vivasha
    vishvabadhahari vadhuh || 22|| brahmani brahmajanani brahmarupa brihadvapuh | bandikritamaravadhumocini
    bandhuralaka || 23|| bileshayanganavandya bibhatsarahita'bala | bhogini bhuvanadhisha bhogibhogashaya'bhaya
    || 24|| damodarapriya danta dasheshaparisevita | jamadagnyapriya jahnutanaya pavananghiraka || 25||
    kshirodamathanodbhuta kshirakta kshitirupini | kshemankari kshayakari kshetrajna kshetradayini ||
    26|| svayamvritacyuta sviyarakshini svatvadayini | tarakeshamukhi tarkshyasvamini taritashrita ||
    27|| gunatita gunavati gunya garudasamsthita | geya gayakshetragata ganatushta gatiprada || 28|| shesharupa
    sheshashayibhamini shishtasammata | shevadhih shoshitasheshabhuvana shobhanakritih || 29|| pancaratrarcita
    pancajanyadharyankavasini | pashandadveshini pashamocani pamarapriya || 30|| bhayankari bhayahari
    bhartribhakta bhavapaha | hrirhrimati hritatamah hatamaya hatashubha || 31|| raghuvamshasnusha rama
    ramya ramapriya rama | siradhvajasuta sita simatitagunojjvala || 32|| janaki jagadanandadayini jagatibhava
    | bhugarbhasambhava bhutih bhushitangi bhritanata || 33|| vedastava vedavati vaidehi vedavitpriya
    | vedantavedya viryadhya virapatni vishishtadhih || 34|| shivacaparopapana shiva shivapararcita |
    saketavasini sadhusvantaga svadubhakshini || 35|| guhagata guhanata guhagatamunistuta | darasmita
    danujasamhartri dasharathasnusha || 36|| dayaprada danaphala daksha dasharathipriya | kanta kantaraga
    kamya karanatitavigraha || 37|| vira viradhasamhartri vishvamayavidhayini | vedya vaidyapriya vaidya
    vedhovishnushivakritih || 38|| kharadushanakalagnih kharabhanukulasnusha | shura shurpanakhabhangakarini
    shrutavallabha || 39|| suvarnamrigatrishnadhya suvarnasadrishangaka | sumitrasukhada sutasamstuta
    sutadarada || 40|| sumitranugrahapara sumantra supratishthita | shyama shyamalanetranta shyamanyagrodhasevini
    || 41|| tungasthanaprada tunga gangaprarthanatatpara | gatipriya garbharupa gatirgatimati ca gauh
    || 42|| garvadura garvahari gatinirjitahamsika | dashananavadhodyukta dayasindhurdashatiga || 43||
    setuheturhetuhina hetuhetumadatmika | hanumatsvamini hrishta hrishtapushtajanastuta || 44|| vamakeshi
    vamanetri vadya vadijayaprada | dhanadhanyakari dharmya dharmadharmaphalaprada || 45|| samudratanaya
    stutya samudra sadrasaprada | samapriya samanuta santvoktih sayudha sati || 46|| shitikritagnih shitamshumukhi
    shilavati shishuh | bhasmikritasurapura bharatagrajabhamini || 47|| rakshasiduhkhada rajni rakshasiganarakshini
    | sarasvati saridrupa sannuta sadgatiprada || 48|| kshamavati kshamashila kshamaputri kshamaprada
    | bhartribhaktipara bhartridaivata bharatastuta || 49|| dushanaratidayita dayitalinganotsuka | alpamadhya'lpadhidura
    kalpavalli kaladhara || 50|| sugrivavandya sugriva vyagribhavavitanata | nilashmabhusha niladistuta
    nilotpalekshana || 51|| nyayya nyayapara''radhya nyayanyayaphalaprada | punyada punyalabhya ca purushottamabhamini
    || 52|| purusharthaprada punya panya phanipatistuta | ashokavanikasthana'shoka shokavinashini || 53||
    shobharupa shubha shubhra shubhradanta shucismita | puruhutastuta purna purnarupa pareshaya || 54||
    darbhagradhirdaharaga darbhabrahmastrabhamini | trailokyamata trailokyamohini tratavayasa || 55||
    tranaikakarya tridasha tridashadhishasevita | lakshmana lakshmanaradhya lakshmanagrajanayika || 56||
    lankavinashini lakshya lalana lalitashaya | tarakakhyapriya tara tarika tarkshyaga tarih || 57|| tatakaratimahishi
    tapatrayakutharika | tamradhara tarkshyanuta tamrakshi taritanata || 58|| raghuvamshapataka shriraghunathasadharmini
    | vanapriya vanapara vanajakshi vinitida || 59|| vidyapriya vidvadidya vidya'vidyavinashini | sarvadhara
    shamapara sharabhangamunistuta || 60|| bilvapriya balimati balisamstutavaibhava | balirakshasasamhartri
    bahuka bahuvigraha || 61|| kshatriyantakararatibharya kshatriyavamshaja | sharanagatasamraksha sharacapasipujita
    || 62|| sharirabhajitaratih sharirajaharastuta | kalyani karunamurtih kalushaghni kavipriya || 63||
    acakshurashrutirapadaprana camana adhih | apanipada'pyavyakta vyakta vyanjitavishtapa || 64|| shamipriya
    sakalada sharmada sharmarupini | sutikshnavandaniyanghrih sutavadvatsala sudhih || 65|| sutikshnadanda
    suvyakta sutibhutajagattraya | madhura madhuralapa madhusudanabhamini || 66|| madhvi ca madhavasati
    madhavikusumapriya | para parabhritalapa paraparagatiprada || 67|| valmikivadanambhodhisudha baliripustuta
    | nilangadadivinuta nilangadavibhushita || 68|| vidyaprada viyanmadhya vidyadharakritastava | kulya
    kushalada kalya kala kushalavaprasuh || 69|| vashini vishada vashya vandya vandaruvatsala | mahendri
    mahada mahya minakshi minaketana || 70|| kamaniya kalamurtih kupita'kupita kripa | anasuyangaraganka'nasuya
    surivandita || 71|| amba bimbadhara kambukandhara manthara uma | ramanuga''ramacari ratrincarabhayankari
    || 72|| ekavenidhara bhumishayana malinambara | rakshohari girilasadvakshoja jnanavigraha || 73||
    medha medhavini medhya maithili matrivarjita | ayonija vayonitya payonidhisuta prithuh || 74|| vanararkshaparivara
    varijasya varanvita | dayardra'bhayada bhadra nidramudra mudayatih || 75|| gridhramokshaprada gridhnuh
    grihitavaramalika | shvashreyasaprada shashvadbhava shatadhritiprasuh || 76|| sharatpadmapada shanta
    shvashurarpitabhushana | lokadhara nirananda niraga nirajapriya || 77|| niraja nistama nihsva niritirnitinaipuna
    | narimanirnarakara nirakara'nirakrita || 78|| kaumari kaushalanidhih kaushiki kaustubhasvasa | sudhakaranuja
    subhruh sujata somabhushana || 79|| kali kalapini kantih kausheyambaramandita | shashakshatajasamraktacandanaliptagatraka
    || 80|| manjiramanditapada manjuvakya manorama | gayatryarthasvarupa ca gayatri gogatiprada || 81||
    dhanya'ksharatmika dhenuh dharmika dharmavardhini | elalaka'pyedhamanakripa krisaratarpita || 82||
    krishna krishnalaka krishta kashtaghni khanditashara | kalalapa kalahakriddura kavyabdhikaumudi ||
    83|| akarana karanatma karanavinivartini | kavipriya kavanada kritartha krishnabhamini || 84|| rukmini
    rukmibhagini rucira rucida rucih | rukmapriya rukmabhusha rupini rupavarjita || 85||pri abhishma bhishmatanaya
    bhitihridbhutidayini | satya satyavrata sahya satyabhama shucivrata || 86|| sampanna samhita sampat
    savitri savitristuta | dvarakanilaya dvarabhuta dvipadaga dvipat || 87|| ekaikatmaikarupaikapatni
    caikeshvari prasuh | ajnanadhvantasuryarcih daridryagnighanavali || 88|| pradyumnajanani prapya prakrishta
    pranatipriya | vasudevapriya vastudoshaghni vardhisamshrita || 89|| vatsala kritsnalavanya varnya
    ganya svatantiraka | bhakta bhaktaparadhina bhavani bhavasevita || 90|| radhaparadhasahani radhitasheshasajjana
    | komala komalamatih kusumahitashekhara || 91|| kuruvindamanishrenibhushana kaumudirucih | amlanamalya
    sammanakarini sarayurucih || 92|| katakshanrityatkaruna kanakojjvalabhushana | nishtaptakanakabhangi
    nilakuncitamurdhaja || 93|| visha
  devanagari: महालक्ष्मीर्महेशाना महामाया मलापहा । विष्णुपत्नी विधीशार्च्या विश्वयोनिर्वरप्रदा ॥ १॥ धात्री
    विधात्री धर्मिष्ठा धम्मिल्लोद्भासिमल्लिका । भार्गवी भक्तिजननी भवनाथा भवार्चिता ॥ २॥ भद्रा भद्रप्रदा
    भव्या भक्ताभीष्टफलप्रदा । प्रळयस्था प्रसिद्धा मा प्रकृष्टैश्वर्यदायिनी ॥ ३॥ विष्णुशक्तिर्विष्णुमाया
    विष्णुवक्षःस्थलस्थिता । वाग्रूपा वाग्विभूतिज्ञा वाक्प्रदा वरदा वरा ॥ ४॥ सम्पत्प्रदा सर्वशक्तिः संविद्रूपा
    समाऽसमा । हरिद्राभा हरिन्नाथपूजिता हरिमोहिनी ॥ ५॥ हतपापा हतखला हिताहितविवर्जिता । हिताहितपराऽहेया
    हर्षदा हर्षरूपिणी ॥ ६॥ वेदशास्त्रालिसंसेव्या वेदरूपा विधिस्तुता । श्रुतिः स्मृतिर्मतिः साध्वी श्रुताऽश्रुतधरा
    धरा ॥ ७॥ श्रीः श्रिताघध्वान्तभानुः श्रेयसी श्रेष्ठरूपिणी । इन्दिरा मन्दिरान्तस्था मन्दुरावासिनी मही
    ॥ ८॥ धनलक्ष्मीर्धनकरी धनिप्रीता धनप्रदा । धानासमृद्धिदा धुर्या धुताघा धौतमानसा ॥ ९॥ धान्यलक्ष्मीर्दारिताघा
    दारिद्र्यविनिवारिणी । वीरलक्ष्मीर्वीरवन्द्या वीरखड्गाग्रवासिनी ॥ १०॥ अक्रोधनाऽलोभपरा ललिता लोभिनाशिनी
    । लोकवन्द्या लोकमाता लोचनाधःकृतोत्पला ॥ ११॥ हस्तिहस्तोपमानोरुः हस्तद्वयधृताम्बुजा । हस्तिकुम्भोपमकुचा
    हस्तिकुम्भस्थलस्थिता ॥ १२॥ राजलक्ष्मी राजराजसेविता राज्यदायिनी । राकेन्दुसुन्दरी रस्या रसालरसभाषणा
    ॥ १३॥ कोशवृद्धिः कोटिदात्री कोटिकोटिरविप्रभा । कर्माराढ्या कर्मगम्या कर्मणां फलदायिनी ॥ १४॥ धैर्यप्रदा
    धैर्यरूपा धीरा धीरसमर्चिता । पतिव्रता परतरपुरुषार्थप्रदाऽपरा ॥ १५॥ पद्मालया पद्मकरा पद्माक्षी पद्मधारिणी
    । पद्मिनी पद्मदा पद्मा पद्मशङ्खादिसेविता ॥ १६॥ दिव्या दिव्याङ्गरागाढ्या दिव्यादिव्यस्वरूपधृत् । दयानिधिर्दानपरा
    दानवारातिभामिनी ॥ १७॥ देवकार्यपरा देवी दैत्येन्द्रपरिपूजिता । नारायणी नादगता नाकराजसमर्चिता ॥ १८॥
    नक्षत्रनाथवदना नरसिंहप्रियाऽनला । जगद्रूपा जगन्नाथा जङ्गमाजङ्गमाकृतिः ॥ १९॥ कविता कञ्जनिलया कम्रा
    कलिनिषेधिनी । कारुण्यसिन्धुः कमला कमलाक्षी कुचोन्नता ॥ २०॥ बलिप्रिया बलिहरी बलिनी बलिसंस्तुता । हीरभूषा
    हीनदोषा हानिहर्त्री हतासुरा ॥ २१॥ हव्यकव्यार्चिता हत्यादिकपातकनाशिणी । विशुद्धसत्त्वा विवशा विश्वबाधाहरी
    वधूः ॥ २२॥ ब्रह्माणी ब्रह्मजननी ब्रह्मरूपा बृहद्वपुः । बन्दीकृतामरवधूमोचिनी बन्धुरालका ॥ २३॥ बिलेशयाङ्गनावन्द्या
    बीभत्सरहिताऽबला । भोगिनी भुवनाधीशा भोगिभोगशयाऽभया ॥ २४॥ दामोदरप्रिया दान्ता दाशेशपरिसेविता । जामदग्न्यप्रिया
    जह्नुतनया पावनाङ्घिरका ॥ २५॥ क्षीरोदमथनोद्भूता क्षीराक्ता क्षितिरूपिणी । क्षेमङ्करी क्षयकरी क्षेत्रज्ञा
    क्षेत्रदायिनी ॥ २६॥ स्वयंवृताच्युता स्वीयरक्षिणी स्वत्वदायिनी । तारकेशमुखी तार्क्ष्यस्वामिनी तारिताश्रिता
    ॥ २७॥ गुणातीता गुणवती गुण्या गरुडसंस्थिता । गेया गयाक्षेत्रगता गानतुष्टा गतिप्रदा ॥ २८॥ शेषरूपा शेषशायिभामिनी
    शिष्टसम्मता । शेवधिः शोषिताशेषभुवना शोभनाकृतिः ॥ २९॥ पाञ्चरात्रार्चिता पाञ्चजन्यधार्यङ्कवासिनी । पाषण्डद्वेषिणी
    पाशमोचनी पामरप्रिया ॥ ३०॥ भयङ्करी भयहरी भर्तृभक्ता भवापहा । ह्रीर्ह्रीमती हृततमाः हतमाया हताशुभा ॥
    ३१॥ रघुवंशस्नुषा रामा रम्या रामप्रिया रमा । सीरध्वजसुता सीता सीमातीतगुणोज्ज्वला ॥ ३२॥ जानकी जगदानन्ददायिनी
    जगतीभवा । भूगर्भसम्भवा भूतिः भूषिताङ्गी भृतानता ॥ ३३॥ वेदस्तवा वेदवती वैदेही वेदवित्प्रिया । वेदान्तवेद्या
    वीर्याढ्या वीरपत्नी विशिष्टधीः ॥ ३४॥ शिवचापारोपपणा शिवा शिवपरार्चिता । साकेतवासिनी साधुस्वान्तगा स्वादुभक्षिणी
    ॥ ३५॥ गुहागता गुहनता गुहागतमुनिस्तुता । दरस्मिता दनुजसंहर्त्री दशरथस्नुषा ॥ ३६॥ दायप्रदा दानफला दक्षा
    दाशरथिप्रिया । कान्ता कान्तारगा काम्या कारणातीतविग्रहा ॥ ३७॥ वीरा विराधसंहर्त्री विश्वमायाविधायिनी
    । वेद्या वैद्यप्रिया वैद्या वेधोविष्णुशिवाकृतिः ॥ ३८॥ खरदूषणकालाग्निः खरभानुकुलस्नुषा । शूरा शूर्पणखाभङ्गकारिणी
    श्रुतवल्लभा ॥ ३९॥ सुवर्णमृगतृष्णाढ्या सुवर्णसदृशाङ्गका । सुमित्रासुखदा सूतसंस्तुता सुतदारदा ॥ ४०॥
    सुमित्रानुग्रहपरा सुमन्त्रा सुप्रतिष्ठिता । श्यामा श्यामलनेत्रान्ता श्यामन्यग्रोधसेविनी ॥ ४१॥ तुङ्गस्थानप्रदा
    तुङ्गा गङ्गाप्रार्थनतत्परा । गतिप्रिया गर्भरूपा गतिर्गतिमती च गौः ॥ ४२॥ गर्वदूरा गर्वहरी गतिनिर्जितहंसिका
    । दशाननवधोद्युक्ता दयासिन्धुर्दशातिगा ॥ ४३॥ सेतुहेतुर्हेतुहीना हेतुहेतुमदात्मिका । हनूमत्स्वामिनी
    हृष्टा हृष्टपुष्टजनस्तुता ॥ ४४॥ वामकेशी वामनेत्री वाद्या वादिजयप्रदा । धनधान्यकरी धर्म्या धर्माधर्मफलप्रदा
    ॥ ४५॥ समुद्रतनया स्तुत्या समुद्रा सद्रसप्रदा । सामप्रिया सामनुता सान्त्वोक्तिः सायुधा सती ॥ ४६॥ शीतीकृताग्निः
    शीतांशुमुखी शीलवती शिशुः । भस्मीकृतासुरपुरा भरताग्रजभामिनी ॥ ४७॥ राक्षसीदुःखदा राज्ञी राक्षसीगणरक्षिणी
    । सरस्वती सरिद्रूपा सन्नुता सद्गतिप्रदा ॥ ४८॥ क्षमावती क्षमाशीला क्षमापुत्री क्षमाप्रदा । भर्तृभक्तिपरा
    भर्तृदैवता भरतस्तुता ॥ ४९॥ दूषणारातिदयिता दयितालिङ्गनोत्सुका । अल्पमध्याऽल्पधीदूरा कल्पवल्ली कलाधरा
    ॥ ५०॥ सुग्रीववन्द्या सुग्रीवा व्यग्रीभावावितानता । नीलाश्मभूषा नीलादिस्तुता नीलोत्पलेक्षणा ॥ ५१॥ न्याय्या
    न्यायपराऽऽराध्या न्यायान्यायफलप्रदा । पुण्यदा पुण्यलभ्या च पुरुषोत्तमभामिनी ॥ ५२॥ पुरुषार्थप्रदा पुण्या
    पण्या फणिपतिस्तुता । अशोकवनिकास्थानाऽशोका शोकविनाशिनी ॥ ५३॥ शोभारूपा शुभा शुभ्रा शुभ्रदन्ता शुचिस्मिता
    । पुरुहूतस्तुता पूर्णा पूर्णरूपा परेशया ॥ ५४॥ दर्भाग्रधीर्दहरगा दर्भब्रह्मास्त्रभामिनी । त्रैलोक्यमाता
    त्रैलोक्यमोहिनी त्रातवायसा ॥ ५५॥ त्राणैककार्या त्रिदशा त्रिदशाधीशसेविता । लक्ष्मणा लक्ष्मणाराध्या
    लक्ष्मणाग्रजनायिका ॥ ५६॥ लङ्काविनाशिनी लक्ष्या ललना ललिताशया । तारकाख्यप्रिया तारा तारिका तार्क्ष्यगा
    तरिः ॥ ५७॥ ताटकारातिमहिषी तापत्रयकुठारिका । ताम्राधरा तार्क्ष्यनुता ताम्राक्षी तारितानता ॥ ५८॥ रघुवंशपताका
    श्रीरघुनाथसधर्मिणी । वनप्रिया वनपरा वनजाक्षी विनीतिदा ॥ ५९॥ विद्याप्रिया विद्वदीड्या विद्याऽविद्याविनाशिनी
    । सर्वाधारा शमपरा शरभङ्गमुनिस्तुता ॥ ६०॥ बिल्वप्रिया बलिमती बलिसंस्तुतवैभवा । बलिराक्षससंहर्त्री बहुका
    बहुविग्रहा ॥ ६१॥ क्षत्रियान्तकरारातिभार्या क्षत्रियवंशजा । शरणागतसंरक्षा शरचापासिपूजिता ॥ ६२॥ शरीरभाजितरतिः
    शरीरजहरस्तुता । कल्याणी करुणामूर्तिः कलुषघ्नी कविप्रिया ॥ ६३॥ अचक्षुरश्रुतिरपादाप्राणा चामना अधीः
    । अपाणिपादाऽप्यव्यक्ता व्यक्ता व्यञ्जितविष्टपा ॥ ६४॥ शमीप्रिया सकलदा शर्मदा शर्मरूपिणी । सुतीक्ष्णवन्दनीयाङ्घ्रिः
    सुतवद्वत्सला सुधीः ॥ ६५॥ सुतीक्ष्णदण्डा सुव्यक्ता सुतीभूतजगत्त्रया । मधुरा मधुरालापा मधुसूदनभामिनी
    ॥ ६६॥ माध्वी च माधवसती माधवीकुसुमप्रिया । परा परभृतालापा परापरगतिप्रदा ॥ ६७॥ वाल्मीकिवदनाम्भोधिसुधा
    बलिरिपुस्तुता । नीलाङ्गदादिविनुता नीलाङ्गदविभूषिता ॥ ६८॥ विद्याप्रदा वियन्मध्या विद्याधरकृतस्तवा ।
    कुल्या कुशलदा कल्या कला कुशलवप्रसूः ॥ ६९॥ वशिनी विशदा वश्या वन्द्या वन्दारुवत्सला । माहेन्द्री महदा
    मह्या मीनाक्षी मीनकेतना ॥ ७०॥ कमनीया कलामूर्तिः कुपिताऽकुपिता कृपा । अनसूयाङ्गरागाङ्काऽनसूया सूरिवन्दिता
    ॥ ७१॥ अम्बा बिम्बाधरा कम्बुकन्धरा मन्थरा उमा । रामानुगाऽऽरामचरी रात्रिञ्चरभयङ्करी ॥ ७२॥ एकवेणीधरा
    भूमिशयना मलिनाम्बरा । रक्षोहरी गिरिलसद्वक्षोजा ज्ञानविग्रहा ॥ ७३॥ मेधा मेधाविनी मेध्या मैथिली मातृवर्जिता
    । अयोनिजा वयोनित्या पयोनिधिसुता पृथुः ॥ ७४॥ वानरर्क्षपरीवारा वारिजास्या वरान्विता । दयार्द्राऽभयदा
    भद्रा निद्रामुद्रा मुदायतिः ॥ ७५॥ गृध्रमोक्षप्रदा गृध्नुः गृहीतवरमालिका । श्वश्रेयसप्रदा शश्वद्भवा
    शतधृतिप्रसूः ॥ ७६॥ शरत्पद्मपदा शान्ता श्वशुरार्पितभूषणा । लोकाधारा निरानन्दा नीरागा नीरजप्रिया ॥ ७७॥
    नीरजा निस्तमा निःस्वा नीरीतिर्नीतिनैपुणा । नारीमणिर्नराकारा निराकाराऽनिराकृता ॥ ७८॥ कौमारी कौशलनिधिः
    कौशिकी कौस्तुभस्वसा । सुधाकरानुजा सुभ्रूः सुजाता सोमभूषणा ॥ ७९॥ काली कलापिनी कान्तिः कौशेयाम्बरमण्डिता
    । शशक्षतजसंरक्तचन्दनालिप्तगात्रका ॥ ८०॥ मञ्जीरमण्डितपदा मञ्जुवाक्या मनोरमा । गायत्र्यर्थस्वरूपा च
    गायत्री गोगतिप्रदा ॥ ८१॥ धन्याऽक्षरात्मिका धेनुः धार्मिका धर्मवर्धिनी । एलालकाऽप्येधमानकृपा कृसरतर्पिता
    ॥ ८२॥ कृष्णा कृष्णालका कृष्टा कष्टघ्नी खण्डिताशरा । कलालापा कलहकृद्दूरा काव्याब्धिकौमुदी ॥ ८३॥ अकारणा
    कारणात्मा कारणाविनिवर्तिनी । कविप्रिया कवनदा कृतार्था कृष्णभामिनी ॥ ८४॥ रुक्मिणी रुक्मिभगिनी रुचिरा
    रुचिदा रुचिः । रुक्मप्रिया रुक्मभूषा रूपिणी रूपवर्जिता ॥ ८५॥पृ अभीष्मा भीष्मतनया भीतिहृद्भूतिदायिनी
    । सत्या सत्यव्रता सह्या सत्यभामा शुचिव्रता ॥ ८६॥ सम्पन्ना संहिता सम्पत् सवित्री सवितृस्तुता । द्वारकानिलया
    द्वारभूता द्विपदगा द्विपात् ॥ ८७॥ एकैकात्मैकरूपैकपत्नी चैकेश्वरी प्रसूः । अज्ञानध्वान्तसूर्यार्चिः
    दारिद्र्याग्निघनावली ॥ ८८॥ प्रद्युम्नजननी प्राप्या प्रकृष्टा प्रणतिप्रिया । वासुदेवप्रिया वास्तुदोषघ्नी
    वार्धिसंश्रिता ॥ ८९॥ वत्सला कृत्स्नलावण्या वर्ण्या गण्या स्वतन्तिरका । भक्ता भक्तपराधीना भवानी भवसेविता
    ॥ ९०॥ राधापराधसहनी राधिताशेषसज्जना । कोमला कोमलमतिः कुसुमाहितशेखरा ॥ ९१॥ कुरुविन्दमणिश्रेणीभूषणा कौमुदीरुचिः
    । अम्लानमाल्या सम्मानकारिणी सरयूरुचिः ॥ ९२॥ कटाक्षनृत्यत्करुणा कनकोज्ज्वलभूषणा । निष्टप्तकनकाभाङ्गी
    नीलकुञ्चितमूर्धजा ॥ ९३॥ विश
