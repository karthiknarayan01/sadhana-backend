id: ganapati-gakara-ashtottara-satanama-stotram
category: stotram
name:
  english: Ganapati Gakara Ashtottara Satanama Stotram
  devanagari: स्तोत्रम्
content:
  english: om shriganeshaya namah | om gakararupo gambijo ganesho ganavanditah | gananiyo gano ganyo gananatitasadgunah
    || 1|| gaganadikasridgangasuto gangasutarcitah | gangadharapritikaro gavishedyo gadapahah || 2|| gadadharanuto
    gadyapadyatmakakavitvadah | gajasyo gajalakshmivan gajavajirathapradah || 3|| ganjaniratashikshakridganitajno
    ganottamah | gandadanancito ganta gandopalasamakritih || 4|| gaganavyapako gamyo gamanadivivarjitah
    | gandadoshaharo gandabhramadbhramarakundalah || 5|| gatagatajno gatido gatamrityurgatodbhavah | gandhapriyo
    gandhavaho gandhasinduravrindagah || 6|| gandhadipujito gavyabhokta gargadisannutah | garishtho garabhidgarvaharo
    garalibhushanah || 7|| gavishtho garjitaravo gabhirahridayo gadi | galatkushthaharo garbhaprado garbharbharakshakah
    || 8|| garbhadharo garbhavasishishujnanapradayakah | garutmattulyajavano garudadhvajavanditah || 9||
    gayedito gayashraddhaphaladashca gayakritih | gadadharavatari ca gandharvanagararcitah || 10|| gandharvaganasantushto
    garudagrajavanditah | ganaratrasamaradhyo garhanastutisamyadhih || 11|| gartabhanabhirgavyutih dirghatundo
    gabhastiman | garhitacaradurashca garudopalabhushitah || 12|| gajarivikramo gandhamushavaji gatashramah
    | gaveshaniyo gahano gahanasthamunistutah || 13|| gavayacchidgandakabhidgahvarapathavaranah | gajadantayudho
    garjadripughno gajakarnikah || 14|| gajacarmamayacchetta ganadhyaksho ganarcitah | ganikanartanaprito
    gacchangandhaphalipriyah || 15|| gandhakadirasadhisho ganakanandadayakah | garabhadijanurharta gandakigahanotsukah
    || 16|| gandushikritavarashih garimalaghimadidah | gavakshavatsaudhavasi garbhito garbhininutah ||
    17|| gandhamadanashailabho gandabherundavikramah | gadito gadgadaravasamstuto gahvaripatih || 18||
    gajeshaya gariyase gadyedyo gatabhirgaditagamah | ? garhaniyagunabhavo gangadikashucipradah || 19||
    gananatitavidyashribalayushyadidayakah | evam shrigananathasya namnamashtottaram shatam || 20|| pathanacchravanat
    pumsam shreyah premapradayakam | pujante yah pathennityam pritassan tasyavighnarat || 21|| yam yam
    kamayate kamam tam tam shighram prayacchati | durvayabhyarcayan devamekavimshativasaran || 22|| ekavimshativaram
    yo nityam stotram pathedyadi | tasya prasanno vighneshassarvan kaman prayacchati || 23|| || iti shriganapati
    gakarashtottarashatanamastotram sampurnam ||
  devanagari: ॐ श्रीगणेशाय नमः । ॐ गकाररूपो गम्बीजो गणेशो गणवन्दितः । गणनीयो गणो गण्यो गणनातीतसद्गुणः
    ॥ १॥ गगनादिकसृद्गङ्गासुतो गङ्गासुतार्चितः । गङ्गाधरप्रीतिकरो गवीशेड्यो गदापहः ॥ २॥ गदाधरनुतो गद्यपद्यात्मककवित्वदः
    । गजास्यो गजलक्ष्मीवान् गजवाजिरथप्रदः ॥ ३॥ गञ्जानिरतशिक्षाकृद्गणितज्ञो गणोत्तमः । गण्डदानाञ्चितो गन्ता
    गण्डोपलसमाकृतिः ॥ ४॥ गगनव्यापको गम्यो गमानादिविवर्जितः । गण्डदोषहरो गण्डभ्रमद्भ्रमरकुण्डलः ॥ ५॥ गतागतज्ञो
    गतिदो गतमृत्युर्गतोद्भवः । गन्धप्रियो गन्धवाहो गन्धसिन्दुरवृन्दगः ॥ ६॥ गन्धादिपूजितो गव्यभोक्ता गर्गादिसन्नुतः
    । गरिष्ठो गरभिद्गर्वहरो गरलिभूषणः ॥ ७॥ गविष्ठो गर्जितारावो गभीरहृदयो गदी । गलत्कुष्ठहरो गर्भप्रदो
    गर्भार्भरक्षकः ॥ ८॥ गर्भाधारो गर्भवासिशिशुज्ञानप्रदायकः । गरुत्मत्तुल्यजवनो गरुडध्वजवन्दितः ॥ ९॥ गयेडितो
    गयाश्राद्धफलदश्च गयाकृतिः । गदाधरावतारी च गन्धर्वनगरार्चितः ॥ १०॥ गन्धर्वगानसन्तुष्टो गरुडाग्रजवन्दितः
    । गणरात्रसमाराध्यो गर्हणस्तुतिसाम्यधीः ॥ ११॥ गर्ताभनाभिर्गव्यूतिः दीर्घतुण्डो गभस्तिमान् । गर्हिताचारदूरश्च
    गरुडोपलभूषितः ॥ १२॥ गजारिविक्रमो गन्धमूषवाजी गतश्रमः । गवेषणीयो गहनो गहनस्थमुनिस्तुतः ॥ १३॥ गवयच्छिद्गण्डकभिद्गह्वरापथवारणः
    । गजदन्तायुधो गर्जद्रिपुघ्नो गजकर्णिकः ॥ १४॥ गजचर्मामयच्छेत्ता गणाध्यक्षो गणार्चितः । गणिकानर्तनप्रीतो
    गच्छन्गन्धफलीप्रियः ॥ १५॥ गन्धकादिरसाधीशो गणकानन्ददायकः । गरभादिजनुर्हर्ता गण्डकीगाहनोत्सुकः ॥ १६॥
    गण्डूषीकृतवाराशिः गरिमालघिमादिदः । गवाक्षवत्सौधवासी गर्भितो गर्भिणीनुतः ॥ १७॥ गन्धमादनशैलाभो गण्डभेरुण्डविक्रमः
    । गदितो गद्गदारावसंस्तुतो गह्वरीपतिः ॥ १८॥ गजेशाय गरीयसे गद्येड्यो गतभीर्गदितागमः । ? गर्हणीयगुणाभावो
    गङ्गादिकशुचिप्रदः ॥ १९॥ गणनातीतविद्याश्रीबलायुष्यादिदायकः । एवं श्रीगणनाथस्य नाम्नामष्टोत्तरं शतम्
    ॥ २०॥ पठनाच्छ्रवणात् पुंसां श्रेयः प्रेमप्रदायकम् । पूजान्ते यः पठेन्नित्यं प्रीतस्सन् तस्यविघ्नराट्
    ॥ २१॥ यं यं कामयते कामं तं तं शीघ्रं प्रयच्छति । दूर्वयाभ्यर्चयन् देवमेकविंशतिवासरान् ॥ २२॥ एकविंशतिवारं
    यो नित्यं स्तोत्रं पठेद्यदि । तस्य प्रसन्नो विघ्नेशस्सर्वान् कामान् प्रयच्छति ॥ २३॥ ॥ इति श्रीगणपति
    गकाराष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
