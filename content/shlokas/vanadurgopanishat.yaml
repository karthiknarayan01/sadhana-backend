id: vanadurgopanishat
category: upanishad
name:
  english: vanadurgopanishat
  devanagari: वनदुर्गोपनिषत्
content:
  english: sarpasimhavyaghragnyadyupadravam nashaya nashaya | om hram hrim hrum shrim klim blum phrom
    am hrim krom hum phat svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | idam vishnurvicakrame tredha nidadhe padam | samudhamasya pamsure | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | om kali hum kali mam kali pulakite pulakite uccatanyuccatani om kali
    bhavani rajapurushastripurushavashankari svaha | om namo bhagavati indrani mama shatrupraninam raktapayini
    hram grasa grasa | grihna grihna | dushtagrahajvalamalini mohini stambhaya stambhaya | sarvadushtapradushtan
    shoshaya shoshaya | maraya maraya | mama shatrunam shirolunthanam kuru kuru | thah thah thah svaha
    | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | uttva madantu stomah krinushva radho adriva | ava brahma dvisho jahi | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | pracyam dishi om namo bhagavati indrani vajrahastabhyam mama saparivarakasya
    pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | indram vo vishvataspari havamahe janebhyah | asmakamastu kevalah | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | agneyyam dishi om namo bhagavati agneyi jvalahastabhyam mama saparivarakasya
    pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | agnim dutam vrinimahe hotaram vishvavedasam | asya yajnasya sukratum | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | yamyam dishi om namo bhagavati yami kaladandahastabhyam mama saparivarakasya
    pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | yamaya somam sunuta yamaya juhuta havih | yamam ha yajno gacchatyagniduto arankritah |
    varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo
    bhagavate rudraya namah | om namo bhagavate rudraya | nairrityam dishi om namo bhagavati nirriti khadgahastabhyam
    mama saparivarakasya pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa
    | grihna grihna | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | moshunah parapara nirrirtidurhanavadhit | padishta trishnaya saha
    | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo
    bhagavate rudraya namah | om namo bhagavate rudraya | varunyam dishi om namo bhagavati varuni pashahastabhyam
    mama saparivarakasya pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa
    | grihna grihna | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | imam me varuna shrudhi havamadya ca mridaya | tvamavasyuracake
    | tattva yami brahmana vandamanastadashaste yajamano havirbhih | ahedamano varuneha bodhyurushamsa
    ma na ayuh pra moshih | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma
    dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | vayavyam dishi om namo
    bhagavati vayavi dhvajahastabhyam mama saparivarakasya pratyaksham bandhaya bandhaya | sarvato mam
    raksha raksha | hram grasa grasa | grihna grihna | hum jhati svaha | triyambakam yajamahe sugandhim
    pushtivardhanam | urvarukamiva bandhananmrityormukshiya mamritat | tava vayavritaspate tvashturjamataradbhuta
    | avam sya vrinimahe | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma
    dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | kauberyam dishi om namo
    bhagavati kauberi gadankushahastabhyam mama saparivarakasya pratyaksham bandhaya bandhaya | sarvato
    mam raksha raksha | hram grasa grasa | grihna grihna | hum jhati svaha | triyambakam yajamahe sugandhim
    pushtivardhanam | urvarukamiva bandhananmrityormukshiya mamritat | somo dhenum somo arvantamashum
    somo viram karmanyam dadati | sadanyam vidathyam sabheyam pitrishravanam yo dadashadasmai | varshantu
    te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate
    rudraya namah | om namo bhagavate rudraya | ishanyam dishi om namo bhagavati ishani trishulahastabhyam
    mama saparivarakasya pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa
    | grihna grihna | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    vandhananmrityormukshiya mamritat | tamishanam jagatastasthushaspatim dhiyam jinvamavase humahe vayam
    | pusha no yatha vedasamasadvridhe rakshita payuradabdhah svastaye | varshantu te vibhavari divo abhrasya
    vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate
    rudraya | urdhvayam dishi om namo bhagavati brahmani sruksruvakamandalvakshasutrahastabhyam mama saparivarakasya
    pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | brahma devanam padavih kavinamrishirvipranam mahisho mriganam | shyeno gridhranam svadhitirvananam
    somah pavitramatyeti rebhan | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava
    brahma dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | adhastaddishi om
    namo bhagavati patalavasini vishagalahastabhyam mama saparivarakasya pratyaksham bandhaya bandhaya
    | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum jhati svaha | triyambakam yajamahe
    sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya mamritat | namo astu sarvebhyo ye
    ke ca prithivimanu | ye antarikshe ye divi tebhyah sarpebhyo namah | varshantu te vibhavari divo abhrasya
    vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate
    rudraya | avantarasyam dishi om namo bhagavati mahalakshmi padmarudhe padmahastabhyam mama saparivarakasya
    pratyaksham bandhaya bandhaya | sarvato mam raksha raksha | hram grasa grasa | grihna grihna | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | idam vishnurvicakrame tredha nidadhe padam | samudhamasya pamsure | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | om namo bhagavati kaumari shaktihastena sarvato mam raksha raksha |
    hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | indram vo vishvataspari havamahe janebhyah | asmakamastu kevalah | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | om namo bhagavati varahi asihastena sarvato mam raksha raksha | hum
    jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | agnim dutam vrinimahe hotaram vishvavedasam | asya yajnasya sukratum | varshantu te vibhavari
    divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah
    | om namo bhagavate rudraya | om namo bhagavati siddhacamundeshvari shankhacakrahastabhyam sarvato
    mam raksha raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | yamaya somam sunuta yamaya juhuta havih | yamam ha yajno gacchatyagniduto
    arakrita | varshantu te vibhavari divo abhrasya vidyutah | rohantu savarbijanyava brahma dvisho jahi
    | om namo bhagavate rudraya namah | om namo bhagavate rudraya | om namo bhagavati ganeshvari parashuhastena
    sarvato mam raksha raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | moshunah parapara nirritirdurhanavadhit | padishta trishnaya saha
    | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo
    bhagavate rudraya namah | om namo bhagavate rudraya | om namo bhagavati kshetrapalini vishajvalahastabhyam
    sarvato mam raksha raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | imam me varuna shrudhi havamadya ca mridaya | tvamavasyuracake
    | tattva yami brahmana vandamanastadashaste yajamano havirbhih | ahedamano varuneha bodhyurushasa
    ma na ayuh pra moshih | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma
    dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | om namo bhagavati narasimhi
    dashananakhagraih sarvato mam raksha raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam
    | urvarukamiva bandhananmrityormukshiya mamritat | tava vayavritaspate tvashturjamataradbhuta | avam
    sya vrinimahe | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho
    jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | om namo bhagavati bagaḻamukhi
    brahmastrena sarvato mam raksha raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam
    | urvarukamiva bandhananmrityormukshiya mamritat || somo dhenum somo arvantamashu somo viram karmanyam
    dadati | sadanyam vidathyam sabheyam pitrishravanam yo dadashadasmai | varshantu te vibhavari divo
    abhrasya vidyutah | rohantu sarvabijanyava brahma dvisho jahi | om namo bhagavate rudraya namah |
    om namo bhagavate rudraya | om namo bhagavatyannapurneshvari kanakadarvihastena sarvato mam raksha
    raksha | hum jhati svaha | triyambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya
    mamritat | tamishanam jagatastasthushaspatim dhiyam jinvamavase humahe vayam | pusha no yatha vedasamasadvridhe
    rakshita payuradabdha svastaye | varshantu te vibhavari divo abhrasya vidyutah | rohantu sarvabijanyava
    brahma dvisho jahi | om namo bhagavate rudraya namah | om namo bhagavate rudraya | bhagavati bhavarogat
    piditam dushkritaughat sutaduhitrikaḻatropadravairvyapyamanam | vilasadamritadrishtya vikshya vibhrantacitta
    sakalabhuvanamatastrahi mam tvam namaste || om hrim shrim bhagavatyai namah | om namo bhagavati padmarudhe
    padmahastabhyam sarvato mam raksha raksha | hum jhati svaha | lakshmim kshirasamudrarajatanayam shrirangadhameshvarim
    dasibhutasamastadevavanitam lokaikadipankuram | shrimatkamakatakshalabdhavibhavabrahmendragangadharam
    tam trailokyakutumbinim sarasijam vande mukundapriyam || om hrim shrim klim shrim siddhalakshmyai
    svaha | suvarnam dharma pariveda venam | indrasyatmanam dashadha carantam svaha | om namo bhagavatyai
    sarvato bhurbhuvah svaromiti digbandhah | om hrim durge svaha | vande rudrapriyam nityamutpannam kamarupinim
    | ulkamukhim rudrajatim nagapushpashiroruham || mam mahishamardini svaha | om hrim dum hum phat svaha
    | prayogabijani | om klim hrim shrim aim glaum om hrim kraum gam om namo bhagavate mahaganapataye
    smaranamatrasantushtaya sarvavidyaprakashakaya sarvakamapradaya bhavabandhavimocanaya hrim sarvabhutabandhanaya
    krom sadhyakarshanaya klim jagattrayavashikaranaya sauh sarvamanahkshobhanaya shrim mahasampatpradaya
    glaum bhumandaladhipatyapradaya mahajnanapradaya cidanandatmane gaurinandanaya mahayogine shivapriyaya
    sarvanandavardhanaya sarvavidyaprakashanapradaya dram ciranjivine blum sammohanaya om mokshapradaya
    | phat vashikuru vashikuru | vaushadakarshanaya hum vidveshanaya vidveshaya vidveshaya | phat uccatayoccataya
    | thah thah stambhaya stambhaya | khem khem maraya maraya | shoshaya shoshaya | paramantrayantratantrani
    chedaya chedaya | dushtagrahannivaraya nivaraya | duhkham hara hara | vyadhim nashaya nashaya | namah
    sampannaya sampannaya svaha | sarvapallavasvarupaya mahavidyaya gam ganapataye svaha | yanmantrekshitalanchitabhamanagham
    mrityushca vajrashisho bhutapretapishacakah prati hata nirghatapatadiva | utpannam ca samastaduhkhaduritam
    hyuccatanotpadakam vande'bhishtaganadhipam bhayaharam vighnaughanasham param || om gam ganapataye
    namah | om hrim aim im svaha | ikaraprathamaksharashca vadane dram drim kucaveshtite klim nabhisthamanangarajasadane
    blunkaramurudvaye | sah pade'pi ca pancabanasadane bandhukapushpadyutim dhyayennagnanivartitena pulako
    gangapravaho dravah || om namo bhagavate kamadevaya dram dram dravanabanaya drim drim sandipanabanaya
    klim klim sammohanabanaya blum blum santapanabanaya sah sah vashikaranabanaya hrim hrim madanaveshabanaya
    sakalajanacintitam dravaya dravaya | kampaya kampaya | hum phat svaha | om klim namo bhagavate kamadevaya
    shrim sarvajanapriyaya sarvasammohanaya jvala jvala prajvala prajvala hana hana vada vada tapa tapa
    sammohaya sammohaya sarvajanam me vashyam kuru kuru svaha | om hrim shrim kshmrim kshmraim sahasrara
    hum phat svaha | om namo vishnave | om namo narayanaya | om namo jaya jaya gopijanavallabhaya svaha
    | sahasrarajvalavarta kshmim hana hana hum phat svaha | om tatsaviturvarenyam bhargodevasya dhimahi
    | dhiyo yo nah pracodayat | om shrinarayanasya caranau sharanam prapadye | shrimate narayanaya namah
    | ugram viram mahavishnum jvalantam sarvatomukham | nrisimham bhishanam bhadram mrityumrityum namamyaham
    || om aim hrim shrim dum hum phat kanakavajravaiduryamuktalankritabhushane ehyehi agacchagaccha mama
    karne pravishya pravishya bhutabhavishyadvartamanakalajnanaduradrishtidurasthashravanam bruhi bruhi
    | agnistambhanam shatrumukhastambhanam shatrubuddhistambhanam shatrugatistambhanam paresham gatimativagjihvasttrabhanam
    kuru kuru | shatrukaryam hana hana | mama karyam sadhaya sadhaya | shatrunamudyogavidhvamsanam kuru
    kuru | viracamundi asikantakadharini nagarapuripattanarajadhanisammohini asadhyasadhani om hrim shrim
    devi hana hana hum phat svaha | om amaradurge am hram saum aim klim hum sauh glaum shrim krom ehyehi
    bhramaramba sakalajaganmohini sakalandajapindajan bhramaya bhramaya | rajaprajavashankari sammohaya
    sammohaya | mahamaye ashtadashashitharupini amalavarayum sphura sphura | prasphura prasphura | kotisuryaprabhabhasure
    candrajate mam raksha raksha | mama shatrun bhasmikuru bhasmikuru | vishvamohini hum phat svaha |
    om namo bhagavate rudraya namah | om namo bhagavate rudraya | shiro rakshatu varahi caindri rakshedbhujadvayam
    | camunda hridayam rakshet kukshim rakshatu varuni || vaishnavi padamashritya prishthadeshe dhanurdhara
    | yatha grame tatha kshetre rakshenmam ca pade pade || sarvamangalamangalye shive sarvarthasadhike
    | sharanye tryambake gauri narayani namo'stu te || brahmi maheshvari kaumari vaishnavi varahi indrani
    camunde siddhicamunde kshetramalike narasimhi mahalakshmi sarvato durge hum phat svaha | bhagavan
    sarvavijaya sahasraraparajita | sharanam tvam prapanno'smi shrikaram shrisudarshanam || aruni varuni
    rakshet sarvagrahanivarani | sarvadaridryashamani sarvarajavashankari || sarvakarmakarini om bhuh
    svaha | om bhuvah svaha | om svah svaha | om bhurbhuvah svah svaha | om am hrim krom | phat phat jahi
    mahakritye vidhumagnisamaprabhe | hana shatrumstrishulena kruddhasye piba shonitam || devi devi mahadevi
    hrim mama shatrun vinashaya vinashaya | aham na jane na ca parvatishah | ashtau brahmanan grahayitva
    tato mahavidya sidhyati | ashikshitaya nopayacchet | ekavimshativarani parijapya shucirbhavet | patram
    pushpam phalam dadyat striyo va purushasya va | avashyam vashamityahuratmana ca parena va || mahavidyavatam
    pumsam manahkshobham karoti yah | saptaratrau vyatitayam sa ca shatrurvinashyati || kuberam te mukham
    raudram nandimanandamavaha | jvaram ya ghoram dvisham nashaya nashaya || om namo bhagavate'mritavarshaya
    rudraya hridaye'mritabhivarshanaya | mama jvaradahashantim kuru kuru svaha | om haum jum sah mam palaya
    palaya sah jum haum om | om namo bhagavate | bho bhoh sudarshana dushtam daraya daraya | duritam hana
    hana | papam matha matha | arogyam kuru kuru | dvishantam hana hana | thah thah sahasrara hum phat
    | bhasmayudhaya vidmahe tikshnadamshtraya dhimahi | tanno jvarah pracodayat | samudrasyottare tire
    dvivido nama vanarah | caturthikam jvaram hanti likhitva yastu pashyati || yaste manyoriti ca caturdasharcasya
    suktasya rudro durvasastapanaputro manyurdevata | apanilayantamiti bijam | samsrishtamiti shaktih
    | shatrum kshapayeti kilakam | mama shatrukshayarthe jape viniyogah | atha dhyanam
  devanagari: सर्पसिंहव्याघ्राग्न्याद्युपद्रवं नाशय नाशय । ॐ ह्रां ह्रीं ह्रूं श्रीं क्लीं ब्लूं फ्रों
    आं ह्रीं क्रों हुं फट् स्वाहा । त्रियम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    मामृतात् । इदं विष्णुर्विचक्रमे त्रेधा निदधे पदम् । समूढमस्य पांसुरे । वर्षन्तु ते विभावरि दिवो अभ्रस्य
    विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो जहि । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय
    । ॐ कालि हुं कालि मं कालि पुलकिते पुलकिते उच्चाटन्युच्चाटनि ॐ कालि भवानि राजपुरुषस्त्रीपुरुषवशङ्करि
