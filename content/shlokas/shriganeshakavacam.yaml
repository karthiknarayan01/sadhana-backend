id: shriganeshakavacam
category: stotram
name:
  english: shriganeshakavacam
  devanagari: श्रीगणेशकवचम्
content:
  english: dvapare tu gajananam yugabhujam raktangaragam vibhum turye tu dvibhujam sitangaruciram sarvarthadam
    sarvada
  devanagari: द्वापारे तु गजाननं युगभुजं रक्ताङ्गरागं विभुम् तुर्ये तु द्विभुजं सिताङ्गरुचिरं सर्वार्थदं
    सर्वदा
meaning: {}
