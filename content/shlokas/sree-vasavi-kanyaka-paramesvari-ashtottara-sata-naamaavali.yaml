id: sree-vasavi-kanyaka-paramesvari-ashtottara-sata-naamaavali
category: stotram
name:
  english: Sree Vasavi Kanyaka Paramesvari Ashtottara Sata Naamaavali
content:
  english: om shrivasavambayai namah | om shrikanyakayai namah | om jaganmatre namah | om adishaktyai
    namah | om devyai namah | om karunayai namah | om prakritisvarupinyai namah | om vidyayai namah |
    om shubhayai namah | om dharmasvarupinyai namah | | om vaishyakulodbhavayai namah | om sarvasyai namah
    | om sarvajnayai namah | om nityayai namah | om tyagasvarupinyai namah | om bhadrayai namah | om vedavedyayai
    namah | om sarvapujitayai namah | om kusumaputrikayai namah | om kusumadantivatsalayai namah | | om
    shantayai namah | om gambhirayai namah | om shubhayai namah | om saundaryanilayayai namah | om sarvahitayai
    namah | om shubhapradayai namah | om nityamuktayai namah | om sarvasaukhyapradayai namah | om sakaladharmopadeshakarinyai
    namah | om papaharinyai namah | | om vimalayai namah | om udarayai namah | om agnipravishtayai namah
    | om adarshaviramatre namah | om ahimsasvarupinyai namah | om aryavaishyapujitayai namah | om bhaktarakshanatatparayai
    namah | om dushtanigrahayai namah | om nishkalayai namah | om sarvasampatpradayai namah | | om daridryadhvamsinyai
    namah | om trikalajnanasampannayai namah | om lilamanushavigrahayai namah | om vishnuvardhanasamharikayai
    namah | om sugunaratnayai namah | om sahasaundaryasampannayai namah | om saccidanandasvarupayai namah
    | om vishvarupapradarshinyai namah | om nigamavedyayai namah | om nishkamayai namah | | om sarvasaubhagyadayinyai
    namah | om dharmasamsthapanayai namah | om nityasevitayai namah | om nityamangalayai namah | om nityavaibhavayai
    namah | om sarvopadhivinirmuktayai namah | om rajarajeshvaryai namah | om umayai namah | om shivapujatatparayai
    namah | om parashaktyai namah | | om bhaktakalpakayai namah | om jnananilayayai namah | om brahmavishnushivatmikayai
    namah | om shivayai namah | om bhaktigamyayai namah | om bhaktivashyayai namah | om nadabindukalatitayai
    namah | om sarvopadravavarinyai namah | om sarvasarupayai namah | om sarvashaktimayyai namah | | om
    mahabuddhyai namah | om mahasiddhyai namah | om sadgatidayinyai namah | om amritayai namah | om anugrahapradayai
    namah | om aryayai namah | om vasupradayai namah | om kalavatyai namah | om kirtivardhinyai namah
    | om kirtitagunayai namah | | om cidanandayai namah | om cidadharayai namah | om cidakarayai namah
    | om cidalayayai namah | om caitanyarupinyai namah | om caitanyavardhinyai namah | om yajnarupayai
    namah | om yajnaphaladayai namah | om tapatrayavinashinyai namah | om gunatitayai namah | | om vishnuvardhanamardinyai
    namah | om tirtharupayai namah | om dinavatsalayai namah | om dayapurnayai namah | om taponishthayai
    namah | om shreshthayai namah | om shriyutayai namah | om pramodadayinyai namah | om bhavabandhavinashinyai
    namah | om bhagavatyai namah | | om ihaparasaukhyadayai namah | om ashritavatsalayai namah | om mahavratayai
    namah | om manoramayai namah | om sakalabhishtapradayai namah | om nityamangalarupinyai namah | om
    nityotsavayai namah | om shrikanyakaparameshvaryai namah | | iti shrivasavikanyakaparameshvari ashtottarashatanamavalih
    |
  devanagari: ॐ श्रीवासवाम्बायै नमः । ॐ श्रीकन्यकायै नमः । ॐ जगन्मात्रे नमः । ॐ आदिशक्त्यै नमः । ॐ देव्यै
    नमः । ॐ करुणायै नमः । ॐ प्रकृतिस्वरूपिण्यै नमः । ॐ विद्यायै नमः । ॐ शुभायै नमः । ॐ धर्मस्वरूपिण्यै
    नमः । । ॐ वैश्यकुलोद्भवायै नमः । ॐ सर्वस्यै नमः । ॐ सर्वज्ञायै नमः । ॐ नित्यायै नमः । ॐ त्यागस्वरूपिण्यै
    नमः । ॐ भद्रायै नमः । ॐ वेदवेद्यायै नमः । ॐ सर्वपूजितायै नमः । ॐ कुसुमपुत्रिकायै नमः । ॐ कुसुमदन्तीवत्सलायै
    नमः । । ॐ शान्तायै नमः । ॐ गम्भीरायै नमः । ॐ शुभायै नमः । ॐ सौन्दर्यनिलयायै नमः । ॐ सर्वहितायै नमः
    । ॐ शुभप्रदायै नमः । ॐ नित्यमुक्तायै नमः । ॐ सर्वसौख्यप्रदायै नमः । ॐ सकलधर्मोपदेशकारिण्यै नमः । ॐ
    पापहरिण्यै नमः । । ॐ विमलायै नमः । ॐ उदारायै नमः । ॐ अग्निप्रविष्टायै नमः । ॐ आदर्शवीरमात्रे नमः ।
    ॐ अहिंसास्वरूपिण्यै नमः । ॐ आर्यवैश्यपूजितायै नमः । ॐ भक्तरक्षणतत्परायै नमः । ॐ दुष्टनिग्रहायै नमः
    । ॐ निष्कलायै नमः । ॐ सर्वसम्पत्प्रदायै नमः । । ॐ दारिद्र्यध्वंसिन्यै नमः । ॐ त्रिकालज्ञानसम्पन्नायै
    नमः । ॐ लीलामानुषविग्रहायै नमः । ॐ विष्णुवर्धनसंहारिकायै नमः । ॐ सुगुणरत्नायै नमः । ॐ साहसौन्दर्यसम्पन्नायै
    नमः । ॐ सच्चिदानन्दस्वरूपायै नमः । ॐ विश्वरूपप्रदर्शिन्यै नमः । ॐ निगमवेद्यायै नमः । ॐ निष्कामायै
    नमः । । ॐ सर्वसौभाग्यदायिन्यै नमः । ॐ धर्मसंस्थापनायै नमः । ॐ नित्यसेवितायै नमः । ॐ नित्यमङ्गलायै
    नमः । ॐ नित्यवैभवायै नमः । ॐ सर्वोपाधिविनिर्मुक्तायै नमः । ॐ राजराजेश्वर्यै नमः । ॐ उमायै नमः । ॐ
    शिवपूजातत्परायै नमः । ॐ पराशक्त्यै नमः । । ॐ भक्तकल्पकायै नमः । ॐ ज्ञाननिलयायै नमः । ॐ ब्रह्मविष्णुशिवात्मिकायै
    नमः । ॐ शिवायै नमः । ॐ भक्तिगम्यायै नमः । ॐ भक्तिवश्यायै नमः । ॐ नादबिन्दुकलातीतायै नमः । ॐ सर्वोपद्रववारिण्यै
    नमः । ॐ सर्वसरूपायै नमः । ॐ सर्वशक्तिमय्यै नमः । । ॐ महाबुद्ध्यै नमः । ॐ महासिद्ध्यै नमः । ॐ सद्गतिदायिन्यै
    नमः । ॐ अमृतायै नमः । ॐ अनुग्रहप्रदायै नमः । ॐ आर्यायै नमः । ॐ वसुप्रदायै नमः । ॐ कलावत्यै नमः । ॐ
    कीर्तिवर्धिन्यै नमः । ॐ कीर्तितगुणायै नमः । । ॐ चिदानन्दायै नमः । ॐ चिदाधारायै नमः । ॐ चिदाकारायै
    नमः । ॐ चिदालयायै नमः । ॐ चैतन्यरूपिण्यै नमः । ॐ चैतन्यवर्धिन्यै नमः । ॐ यज्ञरूपायै नमः । ॐ यज्ञफलदायै
    नमः । ॐ तापत्रयविनाशिन्यै नमः । ॐ गुणातीतायै नमः । । ॐ विष्णुवर्धनमर्दिन्यै नमः । ॐ तीर्थरूपायै नमः
    । ॐ दीनवत्सलायै नमः । ॐ दयापूर्णायै नमः । ॐ तपोनिष्ठायै नमः । ॐ श्रेष्ठायै नमः । ॐ श्रीयुतायै नमः
    । ॐ प्रमोददायिन्यै नमः । ॐ भवबन्धविनाशिन्यै नमः । ॐ भगवत्यै नमः । । ॐ इहपरसौख्यदायै नमः । ॐ आश्रितवत्सलायै
    नमः । ॐ महाव्रतायै नमः । ॐ मनोरमायै नमः । ॐ सकलाभीष्टप्रदायै नमः । ॐ नित्यमङ्गलरूपिण्यै नमः । ॐ नित्योत्सवायै
    नमः । ॐ श्रीकन्यकापरमेश्वर्यै नमः । । इति श्रीवासवीकन्यकापरमेश्वरी अष्टोत्तरशतनामावलिः ।
