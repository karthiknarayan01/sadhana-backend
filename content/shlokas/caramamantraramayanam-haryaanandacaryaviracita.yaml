id: caramamantraramayanam-haryaanandacaryaviracita
category: mantra
name:
  english: caramamantraramayanam (haryaanandacaryaviracita)
  devanagari: चरममन्त्ररामायणं (हर्यआनन्दाचार्यविरचिता)
content:
  english: caramamantraramayanam shriyanandam gurum nattva ramam bodhayanam tatha | kurve shricaramamantraramayanam
    hi muktidam | sarvajnah sarvashaktishca sarveshah sarvakaranam | ramah sarvavatari hi kaushalyanandano'bhavat
    || 1|| kritam sarvam jagad yena svekshanacca svadehatah | tad brahmadharmaraksharthamayodhyayamajayata
    || 2|| devaprarthanaya ramo dasharathirbabhuva hi | balalila krita ramya ramena sarvasaukhyada ||
    3|| vashishthat pathitah sarva vidya ramena dhimata | ramo'tha yajnarakshayai vishvamitrena yacitah
    || 4|| prabhavacca mahan ramo balo'pi tatakamahan | hattva rakshasasanghamshca muneryajnam raraksha
    hi || 5|| patya shila krita'hilya padadhulya hi ramatah | caitanyam prapita ramam tushtava shraddhaya
    bhrisham || 6|| nathashca sarvalokanam shriramo maithile pure | bhanktva maheshvaram capamuduhe maithilim
    shubham || 7|| yatah svasya dhanuh krishtam drishtva ca vismayam gatah | samstutya bhargavo ramam
    sveshtadesham jagama tat || 8|| tasmai hi svapadam datumiyesha koshaleshvarah | gato ramo vanam kintu
    kaikeyivarayancaya || 9|| vasam vanyam gate rame raja svarga jagama hi | naicchattu bharato rajyamajnapto
    gurunapi ca || 19|| iti ramo'nunito'pi bharatena mahatmana | naicchad rajyam dadau kintu paduke bharataya
    hi || 12|| cakre ca bharatenapi padukaradhanam shubham | padukadhinatam gatva ramarajyam raraksha
    sah || 13|| yatashca dandakaranyam citrakutaddhi raghavah | rakshitum rishisangham ca ramena rakshasa
    hatah || 14|| cakara pancavatyam hi vasam godavaritate | ramecchya'nujenatha shurpanakhavirupita ||
    15|| tenagata~shca yuddhaya kharadikan hi rakshasan | nijaghana rane ramo darunan rishimakshakan ||
    16|| atha jagama maricam ravano rakshasadhipah | haimam mrigam ca tam kritva svayam sitamapaharat
    || 17|| bhayat palayitam ramo hatavan kancanam mrigam | salakshmanah kutim gatva sitartham vilalapa
    ca || 18|| yam viditva gurorlokastaranti shokasagaram | sa eva bhagavan ramah shushoca naralilaya
    || 19|| yam viditva gurorlokastaranti shokasagaram | sa eva bhagavan ramah shushoca naralilaya ||
    19|| sarvatha''tmarpakam gridhram mukti dattva ca raghavah | sanujo vayuputrena sugrivam catha sangatah
    || 20|| sarvatha''tmarpakam gridhram mukti dattva ca raghavah | sanujo vayuputrena sugrivam catha
    sangatah || 20|| vahnim ca sakshinam kritva sukanthamitratam gatah | hatva ca valinam ramo sugrivam
    kritavan nripam || 21|| bhumijanveshanayatha preshita rikshavanarah | lankayam sa hi drishtatha lanka
    dagdha hanumata || 22|| tebhyah sahagatebhyashca dattva''nandam ca marutih | sandesham bhumijayashca
    shriramaya nyavedayat || 23|| yo raghavo bhavabdheshca tarako vishrutah shrutau | ashmasetum sa evabdhau
    kritavan vismayavaham || 24|| dadau vibhishanaya svam shritaya raghavo'bhayam | sarvebhyashcabhayam
    ramo datte sakrit prapattitah || 25|| dambhikam rakshasam natham ravanam raghavo'vadhit | lankesham
    kritavan ramo svaprapannam vibhishanam || 26|| ye mritastamshca sanjivya surairbrahmadibhih stutah
    | svajanaih pushpakenatha ramo'yodhyamagat punah || 27|| tad ramagamanam proktam bharatam shrihanumata
    | shrutva samagatan sarvanashlikshad raghavah prabhuh || 28|| vratam svajanakajnaptam purnam kritva
    hi raghavah | urarikritavan rajyam sarvanetramahotsavam || 29|| tatam drishtva pushpavrishtirhi krita
    harshat suraih shubha | ramarajye praja sarva lokatrayam mumoda ca || 30|| mahatashca mahiyan yashcaniyananuto'pi
    yah | vande tam raghavam brahma vyapakam shritamuktidam || 31|| mahodadhirgunanam yo nirdoshah sushamakarah
    | amogharcastavam vande tam ramam vedaveditam || 32|| shriyanandaryashishyena haryanandena nirmitam
    | bhavataccaramamantraramayanam sukhapradam || iti pratipakshibhayankara jagadguru shriharyanandacarya
    siddhashiromani pranitam caramamantraramayanam sampurnam |
  devanagari: चरममन्त्ररामायणं श्रियानन्दं गुरुं नत्त्वा रामं बोधायनं तथा । कुर्वे श्रीचरममन्त्ररामायणं
    हि मुक्तिदम् । सर्वज्ञः सर्वशक्तिश्च सर्वेशः सर्वकारणम् । रामः सर्वावतारी हि कौशल्यानन्दनोऽभवत् ॥
    १॥ कृतं सर्वं जगद् येन स्वेक्षणाच्च स्वदेहतः । तद् ब्रह्मधर्मरक्षार्थमयोध्यायामजायत ॥ २॥ देवप्रार्थनया
    रामो दाशरथिर्बभूव हि । बाललीला कृता रम्या रामेण सर्वसौख्यदा ॥ ३॥ वशिष्ठात् पठिताः सर्वा विद्या रामेण
    धीमता । रामोऽथ यज्ञरक्षायै विश्वामित्रेण याचितः ॥ ४॥ प्रभावाच्च महान् रामो बालोऽपि ताटकामहन् । हत्त्वा
    राक्षससङ्घांश्च मुनेर्यज्ञं ररक्ष हि ॥ ५॥ पत्या शिला कृताऽहिल्या पादधूल्या हि रामतः । चैतन्यं प्रापिता
    रामं तुष्टाव श्रद्धया भृशम् ॥ ६॥ नाथश्च सर्वलोकानां श्रीरामो मैथिले पुरे । भङ्क्त्वा माहेश्वरं चापमुदूहे
    मैथिलीं शुभाम् ॥ ७॥ यतः स्वस्य धनुः कृष्टं दृष्ट्वा च विस्मयं गतः । संस्तुत्य भार्गवो रामं स्वेष्टदेशं
    जगाम तत् ॥ ८॥ तस्मै हि स्वपदं दातुमियेष कोशलेश्वरः । गतो रामो वनं किन्तु कैकेयीवरयाञ्चया ॥ ९॥ वासं
    वन्यं गते रामे राजा स्वर्ग जगाम हि । नैच्छत्तु भरतो राज्यमाज्ञप्तो गुरुणापि च ॥ १९॥ इति रामोऽनुनीतोऽपि
    भरतेन महात्मना । नैच्छद् राज्यं ददौ किन्तु पादुके भरताय हि ॥ १२॥ चक्रे च भरतेनापि पादुकाराधनं शुभम्
    । पादुकाधीनतां गत्वा रामराज्यं ररक्ष सः ॥ १३॥ यातश्च दण्डकारण्यं चित्रकूटाद्धि राघवः । रक्षितुं ऋषिसङ्घं
    च रामेण राक्षसा हताः ॥ १४॥ चकार पञ्चवट्यां हि वासं गोदावरीतटे । रामेच्छ्याऽनुजेनाथ शूर्पणखाविरूपिता
    ॥ १५॥ तेनागताँश्च युद्धाय खरादिकान् हि राक्षसान् । निजघान रणे रामो दारुणान् ऋषिमक्षकान् ॥ १६॥ अथ जगाम
    मारीचं रावणो राक्षसाधिपः । हैमं मृगं च तं कृत्वा स्वयं सीतामपाहरत् ॥ १७॥ भयात् पलायितं रामो हतवान्
    काञ्चनं मृगम् । सलक्ष्मणः कुटीं गत्वा सीतार्थं विललाप च ॥ १८॥ यं विदित्वा गुरोर्लोकास्तरन्ति शोकसागरम्
    । स एव भगवान् रामः शुशोच नरलीलया ॥ १९॥ यं विदित्वा गुरोर्लोकास्तरन्ति शोकसागरम् । स एव भगवान् रामः
    शुशोच नरलीलया ॥ १९॥ सर्वथाऽऽत्मार्पकं गृध्रं मुक्ति दत्त्वा च राघवः । सानुजो वायुपुत्रेण सुग्रीवं
    चाथ सङ्गतः ॥ २०॥ सर्वथाऽऽत्मार्पकं गृध्रं मुक्ति दत्त्वा च राघवः । सानुजो वायुपुत्रेण सुग्रीवं चाथ
    सङ्गतः ॥ २०॥ वह्निं च साक्षिणं कृत्वा सुकण्ठमित्रतां गतः । हत्वा च वालिनं रामो सुग्रीवं कृतवान् नृपम्
    ॥ २१॥ भूमिजान्वेषणायाथ प्रेषिता ऋक्षवानराः । लङ्कायां सा हि दृष्टाथ लङ्का दग्धा हनूमता ॥ २२॥ तेभ्यः
    सहागतेभ्यश्च दत्त्वाऽऽनन्दं च मारुतिः । सन्देशं भूमिजायाश्च श्रीरामाय न्यवेदयत् ॥ २३॥ यो राघवो भवाब्धेश्च
    तारको विश्रुतः श्रुतौ । अश्मसेतुं स एवाब्धौ कृतवान् विस्मयावहम् ॥ २४॥ ददौ विभीषणाय स्वं श्रिताय राघवोऽभयम्
    । सर्वेभ्यश्चाभयं रामो दत्ते सकृत् प्रपत्तितः ॥ २५॥ दाम्भिकं रक्षसां नाथं रावणं राघवोऽवधीत् । लङ्केशं
    कृतवान् रामो स्वप्रपन्नं विभीषणम् ॥ २६॥ ये मृतास्तांश्च सञ्जीव्य सुरैर्ब्रह्मादिभिः स्तुतः । स्वजनैः
    पुष्पकेनाथ रामोऽयोध्यामगात् पुनः ॥ २७॥ तद् रामागमनं प्रोक्तं भरतं श्रीहनूमता । श्रुत्वा समागतान् सर्वानाश्लिक्षद्
    राघवः प्रभुः ॥ २८॥ व्रतं स्वजनकाज्ञप्तं पूर्णं कृत्वा हि राघवः । उररीकृतवान् राज्यं सर्वनेत्रमहोत्सवम्
    ॥ २९॥ ततं दृष्ट्वा पुष्पवृष्टिर्हि कृता हर्षात् सुरैः शुभा । रामराज्ये प्रजा सर्वा लोकत्रयं मुमोद
    च ॥ ३०॥ महतश्च महीयान् यश्चाणीयानणुतोऽपि यः । वन्दे तं राघवं ब्रह्म व्यापकं श्रितमुक्तिदम् ॥ ३१॥ महोदधिर्गुणानां
    यो निर्दोषः सुषमाकरः । अमोघार्चास्तवं वन्दे तं रामं वेदवेदितम् ॥ ३२॥ श्रियानन्दार्यशिष्येण हर्यानन्देन
    निर्मितम् । भवताच्चरममन्त्ररामायणं सुखप्रदम् ॥ इति प्रतिपक्षिभयङ्कर जगद्गुरु श्रीहर्यानन्दाचार्य सिद्धशिरोमणि
    प्रणीतं चरममन्त्ररामायणं सम्पूर्णम् ।
