id: mahashastranugrahakavacam
category: kavacha
name:
  english: mahashastranugrahakavacam
  devanagari: महाशास्त्रनुग्रहकवचम्
content:
  english: rinu devi mahabhage sarvakalyanakarane | mahashastushca deveshi kavacam punyavardhanam || 4||
    agnistambhajalastambhasenastambhavidhayakam | mahabhutaprashamanam mahavyadhinivaranam || 5|| mahajnanapradam
    punyam visheshatkalitapaham | sarvarakshakaram divyamayurarogyavardhanam || 6|| kimato bahunoktena
    yam yam kamayate dvijah | tam tamapnotyasandeho mahashastuh prasadatah || 7|| kavacasya rishirbrahma
    gayatrishchanda ucyate | devata shrimahashasta devo hariharatmajah || 8|| shadangamacaredbhaktya matraya
    jatiyuktaya | dhyanamasya pravakshyami sha
  devanagari: ृणु देवि महाभागे सर्वकल्याणकारणे । महाशास्तुश्च देवेशि कवचं पुण्यवर्धनम् ॥ ४॥ अग्निस्तम्भजलस्तम्भसेनास्तम्भविधायकम्
    । महाभूतप्रशमनं महाव्याधिनिवारणम् ॥ ५॥ महाज्ञानप्रदं पुण्यं विशेषात्कलितापहम् । सर्वरक्षाकरं दिव्यमायुरारोग्यवर्धनम्
    ॥ ६॥ किमतो बहुनोक्तेन यं यं कामयते द्विजः । तं तमाप्नोत्यसन्देहो महाशास्तुः प्रसादतः ॥ ७॥ कवचस्य ऋषिर्ब्रह्मा
    गायत्रीश्छन्द उच्यते । देवता श्रीमहाशास्ता देवो हरिहरात्मजः ॥ ८॥ षडङ्गमाचरेद्भक्त्या मात्रया जातियुक्तया
    । ध्यानमस्य प्रवक्ष्यामि श
meaning: {}
