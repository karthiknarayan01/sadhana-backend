id: sri-narayana-hrudaya-stotram
category: stotram
name:
  english: Sri Narayana Hrudaya Stotram
content:
  english: asya shrinarayanahridayastotramantrasya bhargava rishih shrilakshminarayano devata shrilakshminarayana
    prityarthe jape viniyogah | karanyasah | om narayanah param jyotiriti angushthabhyam namah | narayanah
    param brahmeti tarjanibhyam namah | narayanah paro deva iti madhyamabhyam namah | narayanah param
    dhameti anamikabhyam namah | narayanah paro dharma iti kanishthikabhyam namah | vishvam narayana iti
    karatalakaraprishthabhyam namah | anganyasah | narayanah param jyotiriti hridayaya namah | narayanah
    param brahmeti shirase svaha | narayanah paro deva iti shikhayai vaushat | narayanah param dhameti
    kavacaya hum | narayanah paro dharma iti netrabhyam vaushat | vishvam narayana iti astraya phat |
    digbandhah | om aindryadidashadisham om namah sudarshanaya sahasraraya hum phat badhnami namashcakraya
    svaha | iti pratidisham yojyam | atha dhyanam | udyadadityasankasham pitavasam caturbhujam | shankhacakragadapanim
    dhyayellakshmipatim harim || || trailokyadharacakram tadupari kamatham tatra canantabhogi tanmadhye
    bhumipadmankushashikharadalam karnikabhutamerum | tatrastham shantamurtim manimayamakutam kundalodbhasitangam
    lakshminarayanakhyam sarasijanayanam santatam cintayami || || atha mulashtakam | om || narayanah param
    jyotiratma narayanah parah | narayanah param brahma narayana namo'stu te || || narayanah paro devo
    dhata narayanah parah | narayanah paro dhata narayana namo'stu te || || narayanah param dhama dhyanam
    narayanah parah | narayana paro dharmo narayana namo'stu te || || narayanah parovedyah vidya narayanah
    parah | vishvam narayanah sakshannarayana namo'stu te || || narayanadvidhirjato jato narayanadbhavah
    | jato narayanadindro narayana namo'stu te || || ravirnarayanastejah candro narayano mahah | vahnirnarayanah
    sakshannarayana namo'stu te || || narayana upasyah syadgururnarayanah parah | narayanah paro bodho
    narayana namo'stu te || || narayanah phalam mukhyam siddhirnarayanah sukham | sevyonarayanah shuddho
    narayana namo'stu te || atha prarthanadashakam | narayana tvamevasi daharakhye hridi sthitah | prerakah
    preryamananam tvaya preritamanasah || || tvadajnam shirasa dhritva japami janapavanam | nanopasanamarganam
    bhavakridbhavabodhakah || || bhavarthakridbhavatito bhava saukhyaprado mama | tvanmayamohitam vishvam
    tvayaiva parikalpitam || || tvadadhishthanamatrena sa vai sarvarthakarini | tvametam ca puraskritya
    sarvakamanpradarshaya || || na me tvadanyastratasti tvadanyanna hi daivatam | tvadanyam na hi janami
    palakam punyavardhanam || || yavatsamsariko bhavo manasstho bhavanatmakah | tavatsiddhirbhavetsadhya
    sarvatha sarvada vibho || || papinamahamevagryo dayalunam tvamagranih | dayaniyo madanyo'sti tava
    ko'tra jagattraye || || tvayaham naiva srishtashcenna syattava dayaluta | amayo va na srishtashcedaushadhasya
    vrithodayah || || papasanghaparishrantah papatma paparupadhrit | tvadanyah ko'tra papebhyastratasti
    jagatitale || || tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva | tvameva sevyashca
    gurustvameva tvameva sarvam mama deva deva || || prarthanadashakam caiva mulashtakamatah param | yah
    pathecchrinuyannityam tasya lakshmih sthira bhavet || || narayanasya hridayam sarvabhishtaphalapradam
    | lakshmihridayakam stotram yadi cettadvinakritam || || tatsarvam nishphalam proktam lakshmih kruddhyati
    sarvada | etatsankalitam stotram sarvakamaphalapradam || || lakshmihridayakam caiva tatha narayanatmakam
    | japedyah sankalikritya sarvabhishtamavapnuyat || || narayanasya hridayamadau japtva tatah param
    | lakshmihridayakam stotram japennarayanam punah || || punarnarayanam japtva punarlakshminutim japet
    | punarnarayanam japyam sankalikaranam bhavet || || evam madhye dvivarena japetsankalitam tu tat |
    lakshmihridayakam stotram sarvakamaprakashitam || || tadvajjapadikam kuryadetatsankalitam shubham
    | sarvankamanavapnoti adhivyadhibhayam haret || || gopyametatsada kuryanna sarvatra prakashayet |
    iti guhyatamam shastram praptam brahmadikaih pura || || tasmatsarvaprayatnena gopayetsadhayesudhih
    | yatraitatpustakam tishthellakshminarayanatmakam || || bhutapaishacavetala bhayam naiva tu sarvada
    | lakshmihridayakam proktam vidhina sadhayetsudhih || || bhriguvare ca ratrau ca pujayetpustakadvayam
    | sarvatha sarvada satyam gopayetsadhayetsudhih | gopanatsadhanalloke dhanyo bhavati tattvatah ||
    || ityatharvarahasye uttarabhage narayanahridayam sampurnam |
  devanagari: अस्य श्रीनारायणहृदयस्तोत्रमन्त्रस्य भार्गव ऋषिः श्रीलक्ष्मीनारायणो देवता श्रीलक्ष्मीनारायण
    प्रीत्यर्थे जपे विनियोगः । करन्यासः । ॐ नारायणः परं ज्योतिरिति अङ्गुष्ठाभ्यां नमः । नारायणः परं ब्रह्मेति
    तर्जनीभ्यां नमः । नारायणः परो देव इति मध्यमाभ्यां नमः । नारायणः परं धामेति अनामिकाभ्यां नमः । नारायणः
    परो धर्म इति कनिष्ठिकाभ्यां नमः । विश्वं नारायण इति करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः । नारायणः परं
    ज्योतिरिति हृदयाय नमः । नारायणः परं ब्रह्मेति शिरसे स्वाहा । नारायणः परो देव इति शिखायै वौषट् । नारायणः
    परं धामेति कवचाय हुम् । नारायणः परो धर्म इति नेत्राभ्यां वौषट् । विश्वं नारायण इति अस्त्राय फट् ।
    दिग्बन्धः । ॐ ऐन्द्र्यादिदशदिशं ॐ नमः सुदर्शनाय सहस्राराय हुं फट् बध्नामि नमश्चक्राय स्वाहा । इति
    प्रतिदिशं योज्यम् । अथ ध्यानम् । उद्यादादित्यसङ्काशं पीतवासं चतुर्भुजम् । शङ्खचक्रगदापाणिं ध्यायेल्लक्ष्मीपतिं
    हरिम् ॥ ॥ त्रैलोक्याधारचक्रं तदुपरि कमठं तत्र चानन्तभोगी तन्मध्ये भूमिपद्माङ्कुशशिखरदलं कर्णिकाभूतमेरुम्
    । तत्रस्थं शान्तमूर्तिं मणिमयमकुटं कुण्डलोद्भासिताङ्गं लक्ष्मीनारायणाख्यं सरसिजनयनं सन्ततं चिन्तयामि
    ॥ ॥ अथ मूलाष्टकम् । ओम् ॥ नारायणः परं ज्योतिरात्मा नारायणः परः । नारायणः परं ब्रह्म नारायण नमोऽस्तु
    ते ॥ ॥ नारायणः परो देवो धाता नारायणः परः । नारायणः परो धाता नारायण नमोऽस्तु ते ॥ ॥ नारायणः परं धाम
    ध्यानं नारायणः परः । नारायण परो धर्मो नारायण नमोऽस्तु ते ॥ ॥ नारायणः परोवेद्यः विद्या नारायणः परः
    । विश्वं नारायणः साक्षान्नारायण नमोऽस्तु ते ॥ ॥ नारायणाद्विधिर्जातो जातो नारायणाद्भवः । जातो नारायणादिन्द्रो
    नारायण नमोऽस्तु ते ॥ ॥ रविर्नारायणस्तेजः चन्द्रो नारायणो महः । वह्निर्नारायणः साक्षान्नारायण नमोऽस्तु
    ते ॥ ॥ नारायण उपास्यः स्याद्गुरुर्नारायणः परः । नारायणः परो बोधो नारायण नमोऽस्तु ते ॥ ॥ नारायणः फलं
    मुख्यं सिद्धिर्नारायणः सुखम् । सेव्योनारायणः शुद्धो नारायण नमोऽस्तु ते ॥ अथ प्रार्थनादशकम् । नारायण
    त्वमेवासि दहराख्ये हृदि स्थितः । प्रेरकः प्रेर्यमाणानां त्वया प्रेरितमानसः ॥ ॥ त्वदाज्ञां शिरसा धृत्वा
    जपामि जनपावनम् । नानोपासनमार्गाणां भवकृद्भावबोधकः ॥ ॥ भावार्थकृद्भवातीतो भव सौख्यप्रदो मम । त्वन्मायामोहितं
    विश्वं त्वयैव परिकल्पितम् ॥ ॥ त्वदधिष्ठानमात्रेण सा वै सर्वार्थकारिणी । त्वमेतां च पुरस्कृत्य सर्वकामान्प्रदर्शय
    ॥ ॥ न मे त्वदन्यस्त्रातास्ति त्वदन्यन्न हि दैवतम् । त्वदन्यं न हि जानामि पालकं पुण्यवर्धनम् ॥ ॥ यावत्सांसारिको
    भावो मनस्स्थो भावनात्मकः । तावत्सिद्धिर्भवेत्साध्या सर्वथा सर्वदा विभो ॥ ॥ पापिनामहमेवाग्र्यो दयालूनां
    त्वमग्रणीः । दयनीयो मदन्योऽस्ति तव कोऽत्र जगत्त्रये ॥ ॥ त्वयाहं नैव सृष्टश्चेन्न स्यात्तव दयालुता
    । आमयो वा न सृष्टश्चेदौषधस्य वृथोदयः ॥ ॥ पापसङ्घपरिश्रान्तः पापात्मा पापरूपधृत् । त्वदन्यः कोऽत्र
    पापेभ्यस्त्रातास्ति जगतीतले ॥ ॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव सेव्यश्च
    गुरुस्त्वमेव त्वमेव सर्वं मम देव देव ॥ ॥ प्रार्थनादशकं चैव मूलाष्टकमतः परम् । यः पठेच्छृणुयान्नित्यं
    तस्य लक्ष्मीः स्थिरा भवेत् ॥ ॥ नारायणस्य हृदयं सर्वाभीष्टफलप्रदम् । लक्ष्मीहृदयकं स्तोत्रं यदि चेत्तद्विनाकृतम्
    ॥ ॥ तत्सर्वं निष्फलं प्रोक्तं लक्ष्मीः क्रुद्ध्यति सर्वदा । एतत्सङ्कलितं स्तोत्रं सर्वकामफलप्रदम्
    ॥ ॥ लक्ष्मीहृदयकं चैव तथा नारायणात्मकम् । जपेद्यः सङ्कलीकृत्य सर्वाभीष्टमवाप्नुयात् ॥ ॥ नारायणस्य
    हृदयमादौ जप्त्वा ततः परम् । लक्ष्मीहृदयकं स्तोत्रं जपेन्नारायणं पुनः ॥ ॥ पुनर्नारायणं जप्त्वा पुनर्लक्ष्मीनुतिं
    जपेत् । पुनर्नारायणं जाप्यं सङ्कलीकरणं भवेत् ॥ ॥ एवं मध्ये द्विवारेण जपेत्सङ्कलितं तु तत् । लक्ष्मीहृदयकं
    स्तोत्रं सर्वकामप्रकाशितम् ॥ ॥ तद्वज्जपादिकं कुर्यादेतत्सङ्कलितं शुभम् । सर्वान्कामानवाप्नोति आधिव्याधिभयं
    हरेत् ॥ ॥ गोप्यमेतत्सदा कुर्यान्न सर्वत्र प्रकाशयेत् । इति गुह्यतमं शास्त्रं प्राप्तं ब्रह्मादिकैः
    पुरा ॥ ॥ तस्मात्सर्वप्रयत्नेन गोपयेत्साधयेसुधीः । यत्रैतत्पुस्तकं तिष्ठेल्लक्ष्मीनारायणात्मकम् ॥ ॥
    भूतपैशाचवेताल भयं नैव तु सर्वदा । लक्ष्मीहृदयकं प्रोक्तं विधिना साधयेत्सुधीः ॥ ॥ भृगुवारे च रात्रौ
    च पूजयेत्पुस्तकद्वयम् । सर्वथा सर्वदा सत्यं गोपयेत्साधयेत्सुधीः । गोपनात्साधनाल्लोके धन्यो भवति तत्त्वतः
    ॥ ॥ इत्यथर्वरहस्ये उत्तरभागे नारायणहृदयं सम्पूर्णम् ।
