id: anandamandakini
category: shataka
name:
  english: anandamandakini
  devanagari: आनन्दमन्दाकिनी
content:
  english: pashanankurakantakadishu hathaddrishtva vidirna na yat || 51|| yadratnaughamaricayo'pi samatavyavartanam
    vishvatah kritva digvalayam bhramanti mahita nadairmadhusyandibhih | yacca brahmashivendravanditapadadvandvopari
    dyotate tatkrishnasya padangadadvayamatah kim varnyatam madrishaih || 52|| shete yatkamalalaya tava
    padambhojadvaye samgata dhata tatra tanupadhanyugalam gulphacchalannirmame | kim va manmathakaruna
    viracite tasya mude kanduke sa yatkridati panipankajatale kritva sakhibhih saha || 53|| ya rakta dashalokapalamukutaprantatvishah
    santatam kalpakshmaruhapushpasambhritarucastvatpadamule babhuh | ta divyannakharancitangulitaya jananti
    satyam janah svasminneva sadadharena dadhate lekha yadurdhvashriyam || 54|| piyushadyutibimbamambaratale
    vidyotamanam purah prekshyotphulladrisha tvaya muhuridam dehiti yadbhashitam | tanmanye tava pankajekshana
    mahaccitram yashodarthanam yattvatpadasarojayornakhamanivyajena shitamshavah || 55|| satyam yadvibudha
    vadanti padayordvandvam tavambhoruhe godhulicchalatah sthitani parito hamsalicetamsyalam | pitvaitanmakarandabindumasakridvrindavanibhupate
    manjiradvayamanjushinjitamishadancanti yatpancamam || 56|| akripyakhilavastutah prathamato ragam munindraistatah
    kritva manasapankaje tava padadvandvam sa tasmindhritaih | yenasminnaravindalocana punastatkesaranam
    dyuti
  devanagari: पाषाणाङ्कुरकण्टकादिषु हठाद्दृष्ट्वा विदीर्णा न यत् ॥ ५१॥ यद्रत्नौघमरीचयोऽपि समताव्यावर्तनं
    विश्वतः कृत्वा दिग्वलयं भ्रमन्ति महिता नादैर्मधुस्यन्दिभिः । यच्च ब्रह्मशिवेन्द्रवन्दितपदद्वन्द्वोपरि
    द्योतते तत्कृष्णस्य पदाङ्गदद्वयमतः किं वर्ण्यतां मादृशैः ॥ ५२॥ शेते यत्कमलालया तव पदाम्भोजद्वये संगता
    धाता तत्र तनूपधान्युगलं गुल्फच्छलान्निर्ममे । किं वा मन्मथकारुणा विरचिते तस्या मुदे कन्दुके सा यत्क्रीडति
    पाणिपङ्कजतले कृत्वा सखीभिः सह ॥ ५३॥ या रक्ता दशलोकपालमुकुटप्रान्तत्विषः सन्ततं कल्पक्ष्मारुहपुष्पसम्भृतरुचस्त्वत्पादमूले
    बभुः । ता दीव्यन्नखराञ्चिताङ्गुलितया जानन्ति सत्यं जनाः स्वस्मिन्नेव सदाधरेण दधते लेखा यदूर्ध्वश्रियम्
    ॥ ५४॥ पीयुषद्युतिबिम्बमम्बरतले विद्योतमानं पुरः प्रेक्ष्योत्फुल्लदृशा त्वया मुहुरिदं देहीति यद्भाषितम्
    । तन्मन्ये तव पङ्कजेक्षण महच्चित्रं यशोदार्थनं यत्त्वत्पादसरोजयोर्नखमणिव्याजेन शीतांशवः ॥ ५५॥ सत्यं
    यद्विबुधा वदन्ति पदयोर्द्वन्द्वं तवाम्भोरुहे गोधूलिच्छलतः स्थितानि परितो हंसालिचेतांस्यलम् । पीत्वैतन्मकरन्दबिन्दुमसकृद्वृन्दावनीभूपते
    मञ्जीरद्वयमञ्जुशिञ्जितमिषादञ्चन्ति यत्पञ्चमम् ॥ ५६॥ आकृप्याखिलवस्तुतः प्रथमतो रागं मुनीन्द्रैस्ततः
    कृत्वा मानसपङ्कजे तव पदद्वन्द्वं स तस्मिन्धृतैः । येनास्मिन्नरविन्दलोचन पुनस्तत्केसराणां द्युति
