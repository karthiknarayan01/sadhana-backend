id: vishnustutikanduproktabrahmapurana
category: stotram
name:
  english: vishnustutikanduproktabrahmapurana
  devanagari: विष्णुस्तुतिकण्डुप्रोक्तब्रह्मपुराण
content:
  english: shrivishnustuti kandumuniprokta brahmapurane kanduruvaca narayana hare krishna shrivatsanka
    jagatpate | jagadbija jagaddhama jagatsakshinnamo'stu te || 178
  devanagari: श्रीविष्णुस्तुती कण्डुमुनिप्रोक्त ब्रह्मपुराणे कण्डुरुवाच नारायण हरे कृष्ण श्रीवत्साङ्क
    जगत्पते । जगद्बीज जगद्धाम जगत्साक्षिन्नमोऽस्तु ते ॥ १७८
meaning: {}
