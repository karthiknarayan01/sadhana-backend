id: prajnaparamitahridayam
category: hridaya
name:
  english: prajnaparamitahridayam
  devanagari: प्रज्नापारमिताहृदयम्
content:
  english: prajnaparamitasutra athava prajnaparamitahridayam om namo bhagavatyai aryaprajnaparamitayai
    || aryavalokiteshvaro bodhisattvo gambhiram prajnaparamitacaryam caramano vyavalokayati sma pancaskandhan
    tamshca svabhavashunyan pashyati sma || iha shariputra rupam shunyata shunyataiva rupam | rupanna
    prithak shunyata shunatayah na prithagrupam | yadrupam sa shunyata ya shunyata tadrupam | evameva
    vedanasamjnasamskaravijnanam || iha shariputra sarvadharmah shunyatalakshanah | anutpanna aniruddhah
    amala avimalah | anuna aparipurnah || tasmacchariputra shunyatayam na rupam na vedana na samjna na
    samskarah na vijnanam | na cakshuhshrotraghranajihvakayamanamsi | na rupashabdagandharasasprashtavyadharmah
    | na cakshurdhaturyavanna manovijnanadhatuh | na avidya na avidyakshayo yavanna jaramaranam na jaramaranakshayah
    | na duhkhasamudayanirodhamargah | na jnanam na praptirna apraptih || tasmacchariputra apraptitvadbodhisattvasya
    prajnaparamitamashritya viharatyacittavaranah | cittavarananastitvadatrasto viparyasatikranto nishthanirvanapraptah
    || tryadhvavyavasthitah sarvabuddhah prajnaparamitamashritya anuttaram samyaksambodhimabhisambuddhah
    || tasmajjnatavyam prajnaparamita mahamantrah | mahavidyamantro'nuttaramantrah samasamamantrah | sarvaduhkhaprashamanah
    satyamamithyatvat || prajnaparamitayamukto mantrah tadyatha
  devanagari: प्रज्ञापारमितासूत्र अथवा प्रज्ञापारमिताहृदयम् ॐ नमो भगवत्यै आर्यप्रज्ञापारमितायै ॥ आर्यावलोकितेश्वरो
    बोधिसत्त्वो गम्भीरां प्रज्ञापारमिताचार्यां चरमाणो व्यवलोकयति स्म पञ्चस्कन्धान् तांश्च स्वभावशून्यान्
    पश्यति स्म ॥ इह शारिपुत्र रूपं शून्यता शून्यतैव रूपम् । रूपान्न पृथक् शून्यता शूनतायाः न पृथग्रूपम्
    । यद्रूपं सा शून्यता या शून्यता तद्रूपम् । एवमेव वेदनासंज्ञासंस्कारविज्ञानम् ॥ इह शारिपुत्र सर्वधर्माः
    शून्यतालक्षणाः । अनुत्पन्ना अनिरुद्धाः अमला अविमलाः । अनूना अपरिपूर्णाः ॥ तस्माच्छारिपुत्र शून्यतायां
    न रूपं न वेदना न संज्ञा न संस्काराः न विज्ञानम् । न चक्षुःश्रोत्रघ्राणजिह्वाकायमनांसि । न रूपशब्दगन्धरसस्प्रष्टव्यधर्माः
    । न चक्षुर्धातुर्यावन्न मनोविज्ञानधातुः । न अविद्या न अविद्याक्षयो यावन्न जरामरणं न जरामरणक्षयः ।
    न दुःखसमुदयनिरोधमार्गाः । न ज्ञानं न प्राप्तिर्न अप्राप्तिः ॥ तस्माच्छारिपुत्र अप्राप्तित्वाद्बोधिसत्त्वस्य
    प्रज्ञापारमितामाश्रित्य विहरत्यचित्तावरणः । चित्तावरणनास्तित्वादत्रस्तो विपर्यासातिक्रान्तो निष्ठनिर्वाणप्राप्तः
    ॥ त्र्यध्वव्यवस्थिताः सर्वबुद्धाः प्रज्ञापारमितामाश्रित्य अनुत्तरां सम्यक्सम्बोधिमभिसम्बुद्धाः ॥ तस्माज्ज्ञातव्यं
    प्रज्ञापारमिता महामन्त्रः । महाविद्यामन्त्रोऽनुत्तरमन्त्रः समसममन्त्रः । सर्वदुःखप्रशमनः सत्यममिथ्यात्वात्
    ॥ प्रज्ञापारमितायामुक्तो मन्त्रः तद्यथा
