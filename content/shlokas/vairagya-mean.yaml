id: vairagya-mean
category: shataka
name:
  english: vairagya mean
  devanagari: वैरग्य मेअन्
content:
  english: vairagyashatakam sartham 1 trishnadushanam | cudottamsitacandracarukalikacancacchikhabhasvaro
    liladagdhavilolakamashalabhah shreyodashagre sphuran | antahsphurjadaparamohatimirapragbharamuccatayanh
    cetahsadmani yoginam vijayate jnanapradipo harah || 1||
  devanagari: वैराग्यशतकम् सार्थम् १ तृष्णादूषणम् । चूडोत्तंसितचन्द्रचारुकलिकाचञ्चच्छिखाभास्वरो लीलादग्धविलोलकामशलभः
    श्रेयोदशाग्रे स्फुरन् । अन्तःस्फूर्जदपारमोहतिमिरप्राग्भारमुच्चाटयन्ः चेतःसद्मनि योगिनां विजयते ज्ञानप्रदीपो
    हरः ॥ १॥
meaning: {}
