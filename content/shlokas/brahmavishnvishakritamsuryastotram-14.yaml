id: brahmavishnvishakritamsuryastotram-14
category: stotram
name:
  english: brahmavishnvishakritamsuryastotram 14
  devanagari: ब्रह्मविष्ण्वीशकृतंसूर्यस्तोत्रम् १४
content:
  english: brahmavishnvishakritam suryastotram 14 brahmavishnvisha ucuh | namo namah suravara tigmatejase
    namo namah suravara samstutaya vai | jadandhamukanbadhiransakushthansashvitrinom'dhanvividhavranavritan
    | karoshi taneva punarnavansada ato mahakarunikaya te namah || 44|| yadaudaram jyotiratitvaranmahadyadalpatejo
    yadapiha cakshusham | yadatra yajneshvapanitamahitam tavaiva tadrupamanekatah sthitam || 45|| suradvishah
    sagaratoyavasinah pracandapashasiparashvadhayudhah | samucchritaste bhuvi papacetasah prayanti nasham
    tava deva darshanat || 46|| yato bhavamstirthaphalam samastam yajneshu nityam bhagavanavasthitah |
    namo bhavannatra vicaranasti sada samah shantikaro naranam | yaccapi loke tapa ucyate budhaistatte
    mahateja ushanti panditah || 47|| stutah sa bhagavanevam prajapatimukhaih suraih | avadhanam tatashcakre
    shravanabhyam mahipate || 48|| stuvanti te tato bhuyah shivavishnupurogamah | kritva mam puratah sarve
    bhaktinamrah samantatah || 49|| namo namastribhuvanabhutidayine kratukriyasatphalasampradayine | namo
    namah pratidinakarmasakshine sahasrasandidhitaye namo namah || 50|| prasaktasaptashvayuje kshayaya
    dhruvaikarashmigrathine namo namah | savalakhilyapsarakinnaroragaih samsiddhagandharvapishacamanushaih
    | sayaksharakshoganaguhyakottamaih stutah sada deva namo namaste || 51|| yato rasansankshipase sharirinam
    gabhastibhirhimajalagharmanihsravaih | jagacca samshoshayase sadaiva ato'si loke jagato vishoshanam
    || 52|| iti bhavishyapurane brahme parvani trayovimshadhikashatatamadhyayantargatam brahmavishnurudradikritam
    suryastotram samaptam | bhavishyapurana | brahmaparva | adhyaya 123
  devanagari: ब्रह्मविष्ण्वीशकृतं सूर्यस्तोत्रम् १४ ब्रह्मविष्ण्वीशा ऊचुः । नमो नमः सुरवर तिग्मतेजसे नमो
    नमः सुरवर संस्तुताय वै । जडान्धमूकान्बधिरान्सकुष्ठान्सश्वित्रिणोंऽधान्विविधव्रणावृतान् । करोषि तानेव
    पुनर्नवान्सदा अतो महाकारुणिकाय ते नमः ॥ ४४॥ यदौदरं ज्योतिरतित्वरन्महद्यदल्पतेजो यदपीह चक्षुषाम् ।
    यदत्र यज्ञेष्वपनीतमाहितं तवैव तद्रूपमनेकतः स्थितम् ॥ ४५॥ सुरद्विषः सागरतोयवासिनः प्रचण्डपाशासिपरश्वधायुधाः
    । समुच्छ्रितास्ते भुवि पापचेतसः प्रयान्ति नाशं तव देव दर्शनात् ॥ ४६॥ यतो भवांस्तीर्थफलं समस्तं यज्ञेषु
    नित्यं भगवानवस्थितः । नमो भवन्नात्र विचारणास्ति सदा समः शान्तिकरो नराणाम् । यच्चापि लोके तप उच्यते
    बुधैस्तत्ते महातेज उशन्ति पण्डिताः ॥ ४७॥ स्तुतः स भगवानेवं प्रजापतिमुखैः सुरैः । अवधानं ततश्चक्रे
    श्रवणाभ्यां महीपते ॥ ४८॥ स्तुवन्ति ते ततो भूयः शिवविष्णुपुरोगमाः । कृत्वा मां पुरतः सर्वे भक्तिनम्राः
    समन्ततः ॥ ४९॥ नमो नमस्त्रिभुवनभूतिदायिने क्रतुक्रियासत्फलसम्प्रदायिने । नमो नमः प्रतिदिनकर्मसाक्षिणे
    सहस्रसन्दीधितये नमो नमः ॥ ५०॥ प्रसक्तसप्ताश्वयुजे क्षयाय ध्रुवैकरश्मिग्रथिने नमो नमः । सवालखिल्याप्सरकिन्नरोरगैः
    संसिद्धगन्धर्वपिशाचमानुषैः । सयक्षरक्षोगणगुह्यकोत्तमैः स्तुतः सदा देव नमो नमस्ते ॥ ५१॥ यतो रसान्सङ्क्षिपसे
    शरीरिणां गभस्तिभिर्हिमजलघर्मनिःस्रवैः । जगच्च संशोषयसे सदैव अतोऽसि लोके जगतो विशोषणम् ॥ ५२॥ इति भविष्यपुराणे
    ब्राह्मे पर्वणि त्रयोविंशाधिकशततमाध्यायान्तर्गतं ब्रह्मविष्णुरुद्रादिकृतं सूर्यस्तोत्रं समाप्तम् ।
    भविष्यपुराण । ब्राह्मपर्व । अध्याय १२३
