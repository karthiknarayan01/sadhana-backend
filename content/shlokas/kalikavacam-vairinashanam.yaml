id: kalikavacam-vairinashanam
category: kavacha
name:
  english: kalikavacam vairinashanam
  devanagari: कालीकवचं वैरिनाशनम्
content:
  english: hram hrim kalike ghoradamshtre ca rudhirapriye | rudhirapurnavaktre ca rudhirenavritastani
    || 17|| mama sarvashatrun khadaya khadaya himsa himsa maraya maraya bhindhi bhindhi chindhi chindhi
    uccataya uccataya vidravaya vidravaya shoshaya shoshaya svaha | hram hrim kalikayai madiyashatrun
    samarpaya svaha | om jaya jaya kiri kiri kita kita marda marda mohaya mohaya hara hara mama ripun
    dhvamsaya dhvamsaya bhakshaya bhakshaya trotaya trotaya yatudhanan camunde sarvajanan rajapurushan
    striyo mama vashyah kuru kuru ashvan gajan divyakaminih putran rajashriyam dehi dehi tanu tanu dhanyam
    dhanam yaksham ksham kshum kshaim kshaum ksham kshah svaha | iti mantrah | phalashrutih ityetat kavacam
    punyam kathitam shambhuna pura | ye pathanti sada tesham dhruvam nashyanti vairinah || 18|| vairinah
    pralayam yanti vyadhitashca bhavanti hi | balahinah putrahinah shatruvastasya sarvada || 19|| sahasrapathanat
    siddhih kavacasya bhavettatha | tatah karyani sidhyanti yathashankarabhashitam || 20|| shmashanangaramadaya
    curnam kritva prayatnatah | padodakena pishta ca likhellohashalakaya || 21|| bhumau shatrun hinarupanuttarashirasastatha
    | hastam dattva tu hridaye kavacam tu svayam pathet || 22|| pranapratishtham kritva vai tatha mantrena
    mantravit | hanyadastrapraharena shatro gaccha yamakshayam || 23|| jvaladangaralepena bhavanti jvarita
    bhrisham | pronkshayedvamapadena daridro bhavati dhruvam || 24|| vairinashakaram proktam kavacam vashyakarakam
    | paramaishvaryadam caiva putra pautradi vriddhidam || 25|| prabhatasamaye caiva pujakale prayatnatah
    | sayankale tatha pathat sarvasiddhirbhaved dhruvam || 26|| shatruruccatanam yati deshad va vicyuto
    bhavet | pashcat kinkaratameti satyam satyam na samshayah || 27|| shatrunashakaram devi sarvasampatkaram
    shubham | sarvadevastute devi kalike tvam namamyaham || 28|| iti vairinashanam kalikavacam sampurnam
    |
  devanagari: ह्रां ह्रीं कालिके घोरदंष्ट्रे च रुधिरप्रिये । रूधिरापूर्णवक्त्रे च रूधिरेणावृतस्तनि ॥ १७॥
    मम सर्वशत्रून् खादय खादय हिंस हिंस मारय मारय भिन्धि भिन्धि छिन्धि छिन्धि उच्चाटय उच्चाटय विद्रावय
    विद्रावय शोषय शोषय स्वाहा । ह्रां ह्रीं कालिकायै मदीयशत्रून् समर्पय स्वाहा । ॐ जय जय किरि किरि किट
    किट मर्द मर्द मोहय मोहय हर हर मम रिपून् ध्वंसय ध्वंसय भक्षय भक्षय त्रोटय त्रोटय यातुधानान् चामुण्डे
    सर्वजनान् राजपुरुषान् स्त्रियो मम वश्याः कुरु कुरु अश्वान् गजान् दिव्यकामिनीः पुत्रान् राजश्रियं देहि
    देहि तनु तनु धान्यं धनं यक्षं क्षां क्षूं क्षैं क्षौं क्षं क्षः स्वाहा । इति मन्त्रः । फलश्रुतिः इत्येतत्
    कवचं पुण्यं कथितं शम्भुना पुरा । ये पठन्ति सदा तेषां ध्रुवं नश्यन्ति वैरिणः ॥ १८॥ वैरिणः प्रलयं यान्ति
    व्याधिताश्च भवन्ति हि । बलहीनाः पुत्रहीनाः शत्रुवस्तस्य सर्वदा ॥ १९॥ सहस्रपठनात् सिद्धिः कवचस्य भवेत्तथा
    । ततः कार्याणि सिध्यन्ति यथाशङ्करभाषितम् ॥ २०॥ श्मशानाङ्गारमादाय चूर्णं कृत्वा प्रयत्नतः । पादोदकेन
    पिष्टा च लिखेल्लोहशलाकया ॥ २१॥ भूमौ शत्रून् हीनरूपानुत्तराशिरसस्तथा । हस्तं दत्त्वा तु हृदये कवचं
    तु स्वयं पठेत् ॥ २२॥ प्राणप्रतिष्ठां कृत्वा वै तथा मन्त्रेण मन्त्रवित् । हन्यादस्त्रप्रहारेण शत्रो
    गच्छ यमक्षयम् ॥ २३॥ ज्वलदङ्गारलेपेन भवन्ति ज्वरिता भृशम् । प्रोङ्क्षयेद्वामपादेन दरिद्रो भवति ध्रुवम्
    ॥ २४॥ वैरिनाशकरं प्रोक्तं कवचं वश्यकारकम् । परमैश्वर्यदं चैव पुत्र पौत्रादि वृद्धिदम् ॥ २५॥ प्रभातसमये
    चैव पूजाकाले प्रयत्नतः । सायङ्काले तथा पाठात् सर्वसिद्धिर्भवेद् ध्रुवम् ॥ २६॥ शत्रुरुच्चाटनं याति
    देशाद् वा विच्युतो भवेत् । पश्चात् किङ्करतामेति सत्यं सत्यं न संशयः ॥ २७॥ शत्रुनाशकरं देवि सर्वसम्पत्करं
    शुभम् । सर्वदेवस्तुते देवि कालिके त्वां नमाम्यहम् ॥ २८॥ इति वैरिनाशनं कालीकवचं सम्पूर्णम् ।
