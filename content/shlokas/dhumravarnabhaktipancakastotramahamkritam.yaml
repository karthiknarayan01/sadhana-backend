id: dhumravarnabhaktipancakastotramahamkritam
category: stotram
name:
  english: dhumravarnabhaktipancakastotramahamkritam
  devanagari: धूम्रवर्णभक्तिपन्चकस्तोत्रमहंकृतं
content:
  english: dhumravarna uvaca | mayi bhaktirdridha te'stu mayi dasyaparayanah | ganapatyapriyo bhutva carishyasi
    na samshayah || 6|| yatradau me mahadaitya pujanam naiva vidyate | tatra karmasu te sthanam bhunkshva
    karmaphalam mahat || 7|| karyadau smaranam me na tatra tvam susthiro bhava | asurena svabhavena bhramshayasva
    nirantaram || 8|| svapure gaccha daityendra madbhaktan raksha sarvada | madahankritisamyuktan kuru
    tvam nityamadarat || 9|| yatra me smaranam cadau pujanam sarvakarmasu | tatra sadhusvabhavena vartasva
    tadahankritih || 10|| ganeshabhaktisamyukto madiyahankriterdharah | bhavishyasi na sandeho gaccha
    gaccha madajnaya || 11|| shrishiva uvaca | evamuktva ganadhishastamaham virarama hai | pranamya tamahankarah
    yayau svanagaram muda || 12|| tadrisham tam parijnaya daityesha duhkhasamyutah | tyaktva patalagah
    sarve babhuvurbhayavihvalah || 13|| sa eva sukhasamyukto'bhajattam gananayakam | ananyamanasa dhyatva
    dhumravarnadharam param || 14|| yatha jagada vighneshastatha cakara bhavatah | ahankarasurashcaiva
    shantarupo babhuva ha || 15|| iti ahamkritam dhumravarnabhaktipancakastotram sampurnam ||
  devanagari: धूम्रवर्ण उवाच । मयि भक्तिर्दृढा तेऽस्तु मयि दास्यपरायणः । गाणपत्यप्रियो भूत्वा चरिष्यसि
    न संशयः ॥ ६॥ यत्रादौ मे महादैत्य पूजनं नैव विद्यते । तत्र कर्मसु ते स्थानं भुङ्क्ष्व कर्मफलं महत्
    ॥ ७॥ कार्यादौ स्मरणं मे न तत्र त्वं सुस्थिरो भव । आसुरेण स्वभावेन भ्रंशयस्व निरन्तरम् ॥ ८॥ स्वपुरे
    गच्छ दैत्येन्द्र मद्भक्तान् रक्ष सर्वदा । मदहङ्कृतिसंयुक्तान् कुरु त्वं नित्यमादरात् ॥ ९॥ यत्र मे
    स्मरणं चादौ पूजनं सर्वकर्मसु । तत्र साधुस्वभावेन वर्तस्व तदहङ्कृतिः ॥ १०॥ गणेशभक्तिसंयुक्तो मदीयाहङ्कृतेर्धरः
    । भविष्यसि न सन्देहो गच्छ गच्छ मदाज्ञया ॥ ११॥ श्रीशिव उवाच । एवमुक्त्वा गणाधीशस्तमहं विरराम है । प्रणम्य
    तमहङ्कारः ययौ स्वनगरं मुदा ॥ १२॥ तादृशं तं परिज्ञाय दैत्येशा दुःखसंयुताः । त्यक्त्वा पातालगाः सर्वे
    बभूवुर्भयविह्वलाः ॥ १३॥ स एव सुखसंयुक्तोऽभजत्तं गणनायकम् । अनन्यमनसा ध्यात्वा धूम्रवर्णधरं परम् ॥
    १४॥ यथा जगाद विघ्नेशस्तथा चकार भावतः । अहङ्कारासुरश्चैव शान्तरूपो बभूव ह ॥ १५॥ इति अहंकृतं धूम्रवर्णभक्तिपञ्चकस्तोत्रं
    सम्पूर्णम् ॥
