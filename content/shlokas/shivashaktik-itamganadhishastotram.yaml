id: shivashaktik-itamganadhishastotram
category: stotram
name:
  english: shivashaktikṟitamganadhishastotram
  devanagari: शिवशक्तिक्ऱितंगणाधीशस्तोत्रम्
content:
  english: shriganadhishastotram shivashaktikritam shriganeshaya namah | shrishaktishivavucatuh | namaste
    gananathaya gananam pataye namah | bhaktipriyaya devesha bhaktebhyah sukhadayaka || 1|| svanandavasine
    tubhyam siddhibuddhivaraya ca | nabhisheshaya devaya dhundhirajaya te namah || 2|| varadabhayahastaya
    namah parashudharine | namaste srinihastaya nabhisheshaya te namah || 3|| anamayaya sarvaya sarvapujyaya
    te namah | sagunaya namastubhyam brahmane nirgunaya ca || 4|| brahmabhyo brahmadatre ca gajanana namo'stu
    te | adipujyaya jyeshthaya jyeshtharajaya te namah || 5|| matre pitre ca sarvesham herambaya namo
    namah | anadaye ca vighnesha vighnakartre namo namah || 6|| vighnahartre svabhaktanam lambodara namo'stu
    te | tvadiyabhaktiyogena yogishah shantimagatah || 7|| kim stuvo yogarupam tam pranamavashca vighnapam
    | tena tushto bhava svaminnityukatva tam pranematuh || 8|| tavutthapya ganadhisha uvaca tau maheshvarau
    |
  devanagari: श्रीगणाधीशस्तोत्रं शिवशक्तिकृतम् श्रीगणेशाय नमः । श्रीशक्तिशिवावूचतुः । नमस्ते गणनाथाय गणानां
    पतये नमः । भक्तिप्रियाय देवेश भक्तेभ्यः सुखदायक ॥ १॥ स्वानन्दवासिने तुभ्यं सिद्धिबुद्धिवराय च । नाभिशेषाय
    देवाय ढुण्ढिराजाय ते नमः ॥ २॥ वरदाभयहस्ताय नमः परशुधारिणे । नमस्ते सृणिहस्ताय नाभिशेषाय ते नमः ॥ ३॥
    अनामयाय सर्वाय सर्वपूज्याय ते नमः । सगुणाय नमस्तुभ्यं ब्रह्मणे निर्गुणाय च ॥ ४॥ ब्रह्मभ्यो ब्रह्मदात्रे
    च गजानन नमोऽस्तु ते । आदिपूज्याय ज्येष्ठाय ज्येष्ठराजाय ते नमः ॥ ५॥ मात्रे पित्रे च सर्वेषां हेरम्बाय
    नमो नमः । अनादये च विघ्नेश विघ्नकर्त्रे नमो नमः ॥ ६॥ विघ्नहर्त्रे स्वभक्तानां लम्बोदर नमोऽस्तु ते
    । त्वदीयभक्तियोगेन योगीशाः शान्तिमागताः ॥ ७॥ किं स्तुवो योगरूपं तं प्रणमावश्च विघ्नपम् । तेन तुष्टो
    भव स्वामिन्नित्युकत्वा तं प्रणेमतुः ॥ ८॥ तावुत्थाप्य गणाधीश उवाच तौ महेश्वरौ ।
