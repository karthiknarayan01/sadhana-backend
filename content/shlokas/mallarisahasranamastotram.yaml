id: mallarisahasranamastotram
category: sahasranama
name:
  english: mallarisahasranamastotram
  devanagari: मल्लारिसहस्रनामस्तोत्रम्
content:
  english: pushtiprada simhanatho yoganatho mantroddharo guhapriyah || 44|| bhramaha bhagavanbhavyah shastradhrik
    kshalitashubhah | ashvarudho vrishaskandho dhritiman vrishabhadhvajah || 45|| avadhutasadacarah sadatushtah
    sadamunih | vadanyo mhalasanathah khandeshah shamavanpatih || 46|| alekhaniyah samsari sarasvatyabhipujitah
    | sarvashastrarthanipunah sarvamayanvito rathi || 47|| haricandanaliptangah kasturishobhitastanuh
    | kunkumagaruliptangah sindurankitasattanuh || 48|| amoghavaradah sheshah shivanama jagaddhitah |
    bhasmangaragah sukriti sarparajottariyavan || 49|| bijaksharammantrarajo mrityudrishtinivaranah |
    priyamvado maharavo yuva vriuddho'tibalakah || 50|| naranatho mahaprajno jayavansurapungavah | dhanaratkshobhahriddakshah
    susainyo hemamalakah || 51|| atmaramo vrishtikarta naro narayanahpriyah | ranastho jayasannado vyomastho
    meghavanprabhuh || 52|| sushravyashabdah satsevyastirthavasi supunyadah | bhairavo gaganakarah sarameyasamakulah
    || 53|| mayarnavamahadhairyo dashahastodbhutankarah || 54|| gurvarthadah satam natho dashavaktravarapradah
    | satkshetravasah sadvastrobhurido bhayabhanjanah || 55|| kalpaniharito kalpah sajjikritadhanurdharah
    | kshirarnavamahakridah sadasagarasadgatih || 56|| sadalokah sadavasah sadapatalavasakrit | pralayagni
    jatotyugrah shivastribhuvaneshvarah || 57|| udayacalasardvipah punyashlokashikhamanih | mahotsavah
    sugandharvah samalokyah sushantadhih || 58|| meruvasah sugandhadhyah shighralabhaprado'vyayah | anivaryah
    sudhairyarthi sadarthitaphalapradah || 59|| gunasindhuh simhanado meghagarjitashabdavan | bhandarasundaratanurharidracurna
    manditah || 60|| gadadharakritapraisho rajanicurnaranjitah | ghritamari samutthanam kritapremapurasthitih
    || 61|| bahuratnankito bhaktah kotilabhaprado'naghah | mallastotraprahrishtatma sadadvipapuraprabhuh
    || 62|| manikasuravidveshta nanasthanavatarakrit | mallamastakadattamghrirmallanamadinamavan || 63||
    saturangamanipraudharupasannidhibhushitah | dharmavan harshavanvagmi krodhavanmadarupavan || 64||
    dambharupi viryarupi dharmarupi sadashivah | ahankari sattvarupi shauryarupi ranotkatah || 65|| atmarupi
    jnanarupi sakalagamakricchivah | vidyarupi shaktirupi karunamurtiratmadhih || 66|| mallajanyaparitosho
    manidaityapriyankarah | manikasuramurddhamghrirmanidaityastutipriyah || 67|| mallastutimahaharsho
    mallakhyapurvanamabhak | dhritamari bhavakrodho manimallahiteratah || 68|| kapalamalitorasko manidaityavarapradah
    | kapalamali pratyaksho manidaityashironghridah || 69|| dhritamari bhavaktrebho manidaityahiteratah
    | manistotraprahrishtatma mallasuragatipradah || 70|| maniculadrinilayo mairalaprakarastrigah | malladehashirah
    padatala ekadashakritih || 71|| manimallamahagarvaharastryakshara ishvarah | gangamhalasikadevo malladeha
    shirontakah || 72|| manimallavadhodrikto dharmaputrapriyankarah | manikasurasamharta vishnudaityaniyojakah
    || 73|| aksharomatrikarupah pishacagunamanditah | camundanavakotishah pradhanam matrikapatih || 74||
    trimurtirmatrikacaryah sankhyayogashtabhairavah | manimallasamudbhutavishvapidanivaranah || 75|| humphadvaushatvashatkaro
    yoginicakrapalakah | trayimurtih suraramastriguno matrikamayah || 76|| cinmatro nirguno vishnurvaishnavarcyo
    gunanvitah | khadgodyatatanuh sohamhamsarupashcaturmukhah || 77|| aptayattatanu padmodbhavo matrikartho
    yoginicakrapalakah | janmamrityujarahino yoginicakranamakah || 78|| adityagamacaryo yoginicakravallabhah
    | sargasthityantakricchridaekadashashariravan || 79|| aharavan harirdhata shivalingarcanapriyah |
    pramshuh pashupatarcyamghrirhutabhugyajnapurushah || 80|| brahmanyadevo gitajno yogamayapravartakah
    | apaduddharano dhundi gangamauli puranakrit || 81|| vyapi virodhaharano bharahari narottamah | brahmadivarnito
    hasah surasanghamanoharah || 82|| vishampatirdishannatho vayuvego gavampatih | arupi prithivirupastejorupo'nilo
    narah || 83|| akasharupi nadajno ragajnah sarvagah khagah | agadho dharmashastrajna ekarat nirmalovibhuh
    || 84|| dhutapapo girnavisho jagadyonirnidhanavan | jagatpita jagadbandhurjagaddhata janashrayah ||
    85|| agadho bodhavanboddha kamadhenurhatasurah | anurmahankrishasthulo vashi vidvandhritadhvarah ||
    86|| abodhabodhakridvittadayakrijjivasamjnitah | aditeyo bhaktiparo bhaktadhino'dvayadvayah || 87||
    bhaktaparadhashamano dvayadvayavivarjitah | sasyam viratah sharanam sharanyam ganaradganah || 88||
    mantrayantraprabhavajno mantrayantrasvarupavan | iti doshaharah shreyan bhaktacintamanih shubhah ||
    89|| ujhjhitamangalo dharmyo mangalayatanam kavih | anarthajnorthadah shreshthah shrautadharmapravartakah
    || 90|| mantrabijam mantrarajo bijamantrashariravan | shabdajalavivekajnah sharasandhanakritkriti
    || 91|| kalakalah kriyatitastarkatitah sutarkakrit | samastatattvavittattvam kalajnah kalitasurah
    || 92|| adhiradhairyakritkalo vinanadamanorathah | hiranyareta adityasturashadsharadaguruh || 93||
    purvah kalakalatitah prapancakalanaparah | prapancakalanagrasta satyasandhah shivapatih || 94|| mantrayantradhipomantro
    mantri mantrarthavigrahah | narayano vidhih shasta sarvalakshananashanah || 95|| pradhanam prakritih
    sukshmolaghurvikatavigrahah | kathinah karunanamrah karunamitavigrahah || 96|| akaravannirakarah karabandhavimocanah
    | dinanathah surakshakritsunirnitavidhinkarah || 97|| mahabhagyodadhirvaidyah karunopattavigrahah
    | nagavasi ganadharo bhaktasamrajyadayakah || 98|| sarvabhaumo niradharah sadasadvyaktikaranam | vedavidvedakridvaidyah
    savita caturananah || 99|| hiranyagarbhastritanurvishvasakshivibhavasuh | sakalopanishadgamyah sakalopanishadgatih
    || 100|| vishvapadvishvatashcakshurvishvato bahuracyutah | vishvatomukha adharastripaddikpatiravyayah
    || 101|| vyaso vyasaguruh siddhih siddhida siddhinayakah | jagadatma jagatprano jaganmitro jagatpriyah
    || 102|| devabhurvedabhurvishvam sargasthityantakhelakrit | siddhacaranagandharvayakshavidyadhararcitah
    || 103|| nilakantho haladharo gadapanirnirankushah | sahasraksho nagoddharah suranika jayavahah ||
    104|| caturvargah krishnavartma kalanupuratodarah | urdhvareta vakpatisho naradadimunistutah || 105||
    cidanandacaturyajnastapasvi karunarnavah | cidanandattanu pancagniryagasamsthakridanantagunanamabhrit
    || 106|| trivargasuditaratih suraratnantrayitanuh | yayajukashciranjivi nararatnam sahasrapat || 107||
    bhalacandrashcitavasah suryamandalamadhyagah | ciravasah anantashirsha tretagnihprasanneshunishevitah
    || 108|| saccittapadmamartando niratankah parayanah | purabhavo nirvikarah purnarthah punyabhairavah
    || 109|| nirashrayah shamigarbho naranarayanatmakah | vedadhyayanasantushtashcitaramo narottamah ||
    110|| aparadhishanah sevyastrivrittirgunasagarah | nirvikarah kriyadharah suramitram sureshtakrit
    || 111|| akhuvahashcidanandah sakalaprapitamahah | manobhishtastaponishtho manimallavimardanah ||
    112|| udayacala ashvattho avagrahanivaranah | shrota vakta shishtapalah svastidah saliladhipah ||
    113|| varnashramavisheshajnah parjanya sakalartibhit | sakalartijit vishveshvarastapoyuktah kalidoshavimocanah
    || 114|| varnavanvarnarahito vamacaranishedhakrit | sarvavedantatatparyastapahsiddhipradayakah ||
    115|| vishvasamhararasiko japayajnadilokadah | nahamvadi suradhyaksho naishacurnah sushobhitah ||
    116|| ahorajastamonashovidhivaktraharonnadah | janastapo mahah satyambhurbhuvahsvahsvarupavan || 117||
    mainakatranakaranah sumurdha bhrikuticarah | vaikhanasapatirvaishyashcakshuradiprayojakah || 118||
    dattatreyah samadhisthonavanagasvarupavan | janmamrityujarahino daityabhettetihasavit || 119|| varnatito
    vartamanah prajnadastapitasurah | candahasah karalasyah kalpatitashcitadhipah || 120|| sargakritsthitikriddharta
    aksharastrigunapriyah | dvadashatma gunatitastrigunastrijagatpatih || 121|| jvalano varuno vindhyah
    shamano nirritih prithuh | krishanureta daityaristirtharupo kulacalah || 122|| deshakalaparicchedyo
    vishvagrasavilasakrit | jatharo vishvasamharta vishvadigananayakah || 123|| shrutijno brahmajijnasuraharaparinamakrit
    | atmajnanaparah svanto'vyakto'vyaktavibhagavan || 124|| samadhigururavyaktobhaktajnananivaranah |
    kritavarnasamacarah parivradadhipo grihi || 125|| mahakalah khagapativarnavarnavibhagakrit | kritantah
    kilitendrarih kshanakashthadirupavan || 126|| vishvajittattvajijnasurbrahmano brahmacaryavan | sarvavarnashramaparo
    varnashramabahisthitih || 127|| daityarirbrahmajijnasurvarnashramanishevitah | brahmandodarabhritkshetram
    svaravarnasvarupakah || 128|| vedantavacanatito varnashramaparayanah | drigdrishyobhayarupaikomenapatisamarcitah
    || 129|| sattvasthah sakaladrashta kritavarnashramasthitah | varnashramaparitrata sakha shudradivarnavan
    || 130|| vasudhoddharakaranah kalopadhih sadagatih | daiteyasudanotitasmritijno vadavanalah || 131||
    samudramathanacaryo vanasthoyajnadaivatam | drishtadrishtakriyatito hemadrirharicandanah || 132||
    nishiddhanastikamatiryajnabhukparijatakah | sahasrabhujahashantah paparikshirasagarah || 133|| rajadhirajasantanah
    kalpavrikshastanunapat | dhanvantarirvedavakta citabhasmangaragavan || 134|| kashishvarah shronibhadro
    banasuravarapradah | rajasthah khandhitadharma abhicaranivaranah || 135|| mandaro yagaphaladastamastho
    damavanshami | varnashramah nandaparo drishtadrishtaphalapradah || 136|| kapilastrigunanandah sahasraphanasevitah
    | kubero himavanchatram trayidharmapravartakah | aditeyo yajnaphalam shaktitrayaparayanah | durvasah
    pitrilokeshovirasimhapuranavit || 138|| agnimiḻesphuranmurtih santarjyotih svarupakah | sakalopanishatkarta
    khambaro rinamocakah || 139|| tattvajyotih sahasramshurishetvorjalasattanuh | yogajnanamaharajah sarvavedantakaranam
    || 140|| yogajnanasadanandah agnayahirupavan | jyotirindriyasamvedyah svadhishthanavijrimbhakah ||
    141|| akhandabrahmakhandashrih shannodevisvarupavan | yogajnanamahabodho rahasyam kshetragopakah ||
    142|| bhrumadhyavekshyo garali yogajnana sadashivah | candacandabrihadbhanunaryanastvaritapatih ||
    143|| jnanamahayogi tattvajyotih sudharakah | phanibaddhajatajuto bindunadakalatmakah || 144|| yogajnanamahaseno
    lambikormyabhishincitah | antarjyotirmuladevo'nahatah sushumashrayah || 145|| bhutantavidbrahmabhutiryogajnanamaheshvarah
    | shuklajyotih svarupah shriyogajnanamaharnavah || 146|| purnavijnanabharitah sattvavidyavabodhakah
    | yogajnanamahadevashcandrikadravasudravah || 147|| svabhavayantrasancarah sahasradalamadhyagah ||
    148|| ishvara uvaca | sahasranamamallareridam divyam prakashitam | lokanam kripaya devipritya tava
    varanane || 149|| ya idam pathate nityam pathayecchrinuyadapi | bhaktito va prasangadva sakalam bhadramashnute
    || 150|| pustakam likhitam gehe pujitam yatra tishthati | tatra sarvasamriddhinamadhishthanam na samshayah
    || 151|| sutarthi dhanadararthividyarthi vyadhinashakrit | yashorthi vijayarthica trivaram pratyaham
    pathet || 152|| mahapapopapapanam prayashcittarthamadarat | pratasnayi pathedetat shanmasat siddhimapnuyat
    || 153|| rahasyanam ca papanam pathanadeva nashanam | sarvarishtaprashamanam duhsvapnaphalashantidam
    || 154|| sutikabalasaukhyarthi sutikayatane pathet | susutim labhate nityam garbhini sha
  devanagari: पुष्टिप्रद सिंहनाथो योगनाथो मन्त्रोद्धारो गुहप्रियः ॥ ४४॥ भ्रमहा भगवान्भव्यः शस्त्रधृक्
    क्षालिताशुभः । अश्वारूढो वृषस्कन्धो धृतिमान् वृषभध्वजः ॥ ४५॥ अवधूतसदाचारः सदातुष्टः सदामुनिः । वदान्यो
    म्हालसानाथः खण्डेशः शमवान्पतिः ॥ ४६॥ अलेखनीयः संसारी सरस्वत्यभिपूजितः । सर्वशास्त्रार्थनिपुणः सर्वमायान्वितो
    रथी ॥ ४७॥ हरिचन्दनलिप्ताङ्गः कस्तूरीशोभितस्तनुः । कुङ्कुमागरुलिप्ताङ्गः सिन्दूराङ्कितसत्तनुः ॥ ४८॥
    अमोघवरदः शेषः शिवनामा जगद्धितः । भस्माङ्गरागः सुकृती सर्पराजोत्तरीयवान् ॥ ४९॥ बीजाक्षरंमन्त्रराजो
    मृत्युदृष्टिनिवारणः । प्रियंवदो महारावो युवा वृउद्धोऽतिबालकः ॥ ५०॥ नरनाथो महाप्राज्ञो जयवान्सुरपुङ्गवः
    । धनराट्क्षोभहृद्दक्षः सुसैन्यो हेममालकः ॥ ५१॥ आत्मारामो वृष्टिकर्ता नरो नारायणःप्रियः । रणस्थो जयसन्नादो
    व्योमस्थो मेघवान्प्रभुः ॥ ५२॥ सुश्राव्यशब्दः सत्सेव्यस्तीर्थवासी सुपुण्यदः । भैरवो गगनाकारः सारमेयसमाकुलः
    ॥ ५३॥ मायार्णवमहाधैर्यो दशहस्तोद्भुतङ्करः ॥ ५४॥ गुर्वर्थदः सतां नाथो दशवक्त्रवरप्रदः । सत्क्षेत्रवासः
    सद्वस्त्रोभूरिदो भयभञ्जनः ॥ ५५॥ कल्पनीहरितो कल्पः सज्जीकृतधनुर्धरः । क्षीरार्णवमहाक्रीडः सदासागरसद्गतिः
    ॥ ५६॥ सदालोकः सदावासः सदापातालवासकृत् । प्रलयाग्नि जटोत्युग्रः शिवस्त्रिभुवनेश्वरः ॥ ५७॥ उदयाचलसर्द्वीपः
    पुण्यश्लोकशिखामणिः । महोत्सवः सुगान्धर्वः समालोक्यः सुशान्तधीः ॥ ५८॥ मेरुवासः सुगन्धाढ्यः शीघ्रलाभप्रदोऽव्ययः
    । अनिवार्यः सुधैर्यार्थी सदार्थितफलप्रदः ॥ ५९॥ गुणसिन्धुः सिंहनादो मेघगर्जितशब्दवान् । भाण्डारसुन्दरतनुर्हरिद्राचूर्ण
    मण्डितः ॥ ६०॥ गदाधरकृतप्रैषो रजनीचूर्णरञ्जितः । घृतमारी समुत्थानं कृतप्रेमपुरस्थितिः ॥ ६१॥ बहुरत्नाङ्कितो
    भक्तः कोटिलाभप्रदोऽनघः । मल्लस्तोत्रप्रहृष्टात्मा सदाद्वीपपुरप्रभुः ॥ ६२॥ मणिकासुरविद्वेष्टा नानास्थानावतारकृत्
    । मल्लमस्तकदत्तांघ्रिर्मल्लनामादिनामवान् ॥ ६३॥ सतुरङ्गमणिप्रौढरूपसन्निधिभूषितः । धर्मवान् हर्षवान्वाग्मी
    क्रोधवान्मदरूपवान् ॥ ६४॥ दम्भरूपी वीर्यरूपी धर्मरूपी सदाशिवः । अहङ्कारी सत्त्वरूपी शौर्यरूपी रणोत्कटः
    ॥ ६५॥ आत्मरूपी ज्ञानरूपी सकलागमकृच्छिवः । विद्यारूपी शक्तिरूपी करुणामूर्तिरात्मधीः ॥ ६६॥ मल्लजन्यपरितोषो
    मणिदैत्यप्रियङ्करः । मणिकासुरमूर्द्धांघ्रिर्मणिदैत्यस्तुतिप्रियः ॥ ६७॥ मल्लस्तुतिमहाहर्षो मल्लाख्यापूर्वनामभाक्
    । धृतमारी भवक्रोधो मणिमल्लहितेरतः ॥ ६८॥ कपालमालितोरस्को मणिदैत्यवरप्रदः । कपालमाली प्रत्यक्षो माणिदैत्यशिरोङ्घ्रिदः
    ॥ ६९॥ धृतमारी भवक्त्रेभो मणिदैत्यहितेरतः । मणिस्तोत्रप्रहृष्टात्मा मल्लासुरगतिप्रदः ॥ ७०॥ मणिचूलाद्रिनिलयो
    मैरालप्रकरस्त्रिगः । मल्लदेहशिरः पादतल एकादशाकृतिः ॥ ७१॥ मणिमल्लमहागर्वहरस्त्र्यक्षर ईश्वरः । गङ्गाम्हालसिकादेवो
    मल्लदेह शिरोन्तकः ॥ ७२॥ मणिमल्लवधोद्रिक्तो धर्मपुत्रप्रियङ्करः । मणिकासुरसंहर्ता विष्णुदैत्यनियोजकः
    ॥ ७३॥ अक्षरोमातृकारूपः पिशाचगुणमण्डितः । चामुण्डानवकोटीशः प्रधानं मातृकापतिः ॥ ७४॥ त्रिमूर्तिर्मातृकाचार्यः
    साङ्ख्ययोगाष्टभैरवः । मणिमल्लसमुद्भूतविश्वपीडानिवारणः ॥ ७५॥ हुंफड्वौषट्वषट्कारो योगिनीचक्रपालकः ।
    त्रयीमूर्तिः सुरारामस्त्रिगुणो मातृकामयः ॥ ७६॥ चिन्मात्रो निर्गुणो विष्णुर्वैष्णवार्च्यो गुणान्वितः
    । खड्गोद्यततनुः सोहंहंसरूपश्चतुर्मुखः ॥ ७७॥ आप्तायत्ततनु पद्मोद्भवो मातृकार्थो योगिनीचक्रपालकः । जन्ममृत्युजराहीनो
    योगिनीचक्रनामकः ॥ ७८॥ आदित्यागमाचार्यो योगिनीचक्रवल्लभः । सर्गस्थित्यन्तकृच्छ्रीदएकादशशरीरवान् ॥ ७९॥
    आहारवान् हरिर्धाता शिवलिङ्गार्चनप्रियः । प्रांशुः पाशुपतार्च्यांघ्रिर्हुतभुग्यज्ञपूरुषः ॥ ८०॥ ब्रह्मण्यदेवो
    गीतज्ञो योगमायाप्रवर्तकः । आपदुद्धारणो ढुण्डी गङ्गामौलि पुराणकृत् ॥ ८१॥ व्यापी विरोधहरणो भारहारी नरोत्तमः
    । ब्रह्मादिवर्णितो हासः सुरसङ्घमनोहरः ॥ ८२॥ विशाम्पतिर्दिशान्नाथो वायुवेगो गवाम्पतिः । अरूपी पृथिवीरूपस्तेजोरूपोऽनिलो
    नरः ॥ ८३॥ आकाशरूपी नादज्ञो रागज्ञः सर्वगः खगः । अगाधो धर्मशास्त्रज्ञ एकराट् निर्मलोविभुः ॥ ८४॥ धूतपापो
    गीर्णविषो जगद्योनिर्निधानवान् । जगत्पिता जगद्बन्धुर्जगद्धाता जनाश्रयः ॥ ८५॥ अगाधो बोधवान्बोद्धा कामधेनुर्हतासुरः
    । अणुर्महान्कृशस्थूलो वशी विद्वान्धृताध्वरः ॥ ८६॥ अबोधबोधकृद्वित्तदयाकृज्जीवसंज्ञितः । आदितेयो भक्तिपरो
    भक्ताधीनोऽद्वयाद्वयः ॥ ८७॥ भक्तापराधशमनो द्वयाद्वयविवर्जितः । सस्यं विराटः शरणं शरण्यं गणराड्गणः ॥
    ८८॥ मन्त्रयन्त्रप्रभावज्ञो मन्त्रयन्त्रस्वरूपवान् । इति दोषहरः श्रेयान् भक्तचिन्तामणिः शुभः ॥ ८९॥
    उझ्झितामङ्गलो धर्म्यो मङ्गलायतनं कविः । अनर्थज्ञोर्थदः श्रेष्ठः श्रौतधर्मप्रवर्तकः ॥ ९०॥ मन्त्रबीजं
    मन्त्रराजो बीजमन्त्रशरीरवान् । शब्दजालविवेकज्ञः शरसन्धानकृत्कृती ॥ ९१॥ कालकालः क्रियातीतस्तर्कातीतः
    सुतर्ककृत् । समस्ततत्त्ववित्तत्त्वं कालज्ञः कलितासुरः ॥ ९२॥ अधीरधैर्यकृत्कालो वीणानादमनोरथः । हिरण्यरेता
    आदित्यस्तुराषाद्शारदागुरुः ॥ ९३॥ पूर्वः कालकलातीतः प्रपञ्चकलनापरः । प्रपञ्चकलनाग्रस्त सत्यसन्धः शिवापतिः
    ॥ ९४॥ मन्त्रयन्त्राधिपोमन्त्रो मन्त्री मन्त्रार्थविग्रहः । नारायणो विधिः शास्ता सर्वालक्षणनाशनः ॥
    ९५॥ प्रधानं प्रकृतिः सूक्ष्मोलघुर्विकटविग्रहः । कठिनः करुणानम्रः करुणामितविग्रहः ॥ ९६॥ आकारवान्निराकारः
    काराबन्धविमोचनः । दीननाथः सुरक्षाकृत्सुनिर्णीतविधिङ्करः ॥ ९७॥ महाभाग्योदधिर्वैद्यः करुणोपात्तविग्रहः
    । नगवासी गणाधारो भक्तसाम्राज्यदायकः ॥ ९८॥ सार्वभौमो निराधारः सदसद्व्यक्तिकारणम् । वेदविद्वेदकृद्वैद्यः
    सविता चतुराननः ॥ ९९॥ हिरण्यगर्भस्त्रितनुर्विश्वसाक्षीविभावसुः । सकलोपनिषद्गम्यः सकलोपनिषद्गतिः ॥ १००॥
    विश्वपाद्विश्वतश्चक्षुर्विश्वतो बाहुरच्युतः । विश्वतोमुख आधारस्त्रिपाद्दिक्पतिरव्ययः ॥ १०१॥ व्यासो
    व्यासगुरुः सिद्धिः सिद्धिद सिद्धिनायकः । जगदात्मा जगत्प्राणो जगन्मित्रो जगत्प्रियः ॥ १०२॥ देवभूर्वेदभूर्विश्वं
    सर्गस्थित्यन्तखेलकृत् । सिद्धचारणगन्धर्वयक्षविद्याधरार्चितः ॥ १०३॥ नीलकण्ठो हलधरो गदापाणिर्निरङ्कुशः
    । सहस्राक्षो नगोद्धारः सुरानीक जयावहः ॥ १०४॥ चतुर्वर्गः कृष्णवर्त्मा कालनूपुरतोडरः । ऊर्ध्वरेता वाक्पतीशो
    नारदादिमुनिस्तुतः ॥ १०५॥ चिदानन्दचतुर्यज्ञस्तपस्वी करुणार्णवः । चिदानन्दत्तनु पञ्चाग्निर्यागसंस्थाकृदनन्तगुणनामभृत्
    ॥ १०६॥ त्रिवर्गसूदितारातिः सुररत्नन्त्रयीतनुः । यायजूकश्चिरञ्जीवी नररत्नं सहस्रपात् ॥ १०७॥ भालचन्द्रश्चितावासः
    सूर्यमण्डलमध्यगः । चिरावासः अनन्तशीर्षा त्रेताग्निःप्रसन्नेषुनिषेवितः ॥ १०८॥ सच्चित्तपद्ममार्तण्डो
    निरातङ्कः परायणः । पुराभवो निर्विकारः पूर्णार्थः पुण्यभैरवः ॥ १०९॥ निराश्रयः शमीगर्भो नरनारायणात्मकः
    । वेदाध्ययनसन्तुष्टश्चितारामो नरोत्तमः ॥ ११०॥ अपारधिषणः सेव्यस्त्रिवृत्तिर्गुणसागरः । निर्विकारः क्रियाधारः
    सुरमित्रं सुरेष्टकृत् ॥ १११॥ आखुवाहश्चिदानन्दः सकलप्रपितामहः । मनोभीष्टस्तपोनिष्ठो मणिमल्लविमर्दनः
    ॥ ११२॥ उदयाचल अश्वत्थो अवग्रहनिवारणः । श्रोता वक्ता शिष्टपालः स्वस्तिदः सलिलाधिपः ॥ ११३॥ वर्णाश्रमविशेषज्ञः
    पर्जन्य सकलार्तिभित् । सकलार्तिजित् विश्वेश्वरस्तपोयुक्तः कलिदोषविमोचनः ॥ ११४॥ वर्णवान्वर्णरहितो वामाचारनिषेधकृत्
    । सर्ववेदान्ततात्पर्यस्तपःसिद्धिप्रदायकः ॥ ११५॥ विश्वसंहाररसिको जपयज्ञादिलोकदः । नाहंवादी सुराध्यक्षो
    नैषचूर्णः सुशोभितः ॥ ११६॥ अहोराजस्तमोनाशोविधिवक्त्रहरोन्नदः । जनस्तपो महः सत्यंभूर्भुवःस्वःस्वरूपवान्
    ॥ ११७॥ मैनाकत्राणकरणः सुमूर्धा भृकुटीचरः । वैखानसपतिर्वैश्यश्चक्षुरादिप्रयोजकः ॥ ११८॥ दत्तात्रेयः
    समाधिस्थोनवनागस्वरूपवान् । जन्ममृत्युजराहीनो दैत्यभेत्तेतिहासवित् ॥ ११९॥ वर्णातीतो वर्तमानः प्रज्ञादस्तापितासुरः
    । चण्डहासः करालास्यः कल्पातीतश्चिताधिपः ॥ १२०॥ सर्गकृत्स्थितिकृद्धर्ता अक्षरस्त्रिगुणप्रियः । द्वादशात्मा
    गुणातीतस्त्रिगुणस्त्रिजगत्पतिः ॥ १२१॥ ज्वलनो वरुणो विन्ध्यः शमनो निरृतिः पृथुः । कृशानुरेता दैत्यारिस्तीर्थरूपो
    कुलाचलः ॥ १२२॥ देशकालापरिच्छेद्यो विश्वग्रासविलासकृत् । जठरो विश्वसंहर्ता विश्वादिगणनायकः ॥ १२३॥ श्रुतिज्ञो
    ब्रह्मजिज्ञासुराहारपरिणामकृत् । आत्मज्ञानपरः स्वान्तोऽव्यक्तोऽव्यक्तविभागवान् ॥ १२४॥ समाधिगुरुरव्यक्तोभक्ताज्ञाननिवारणः
    । कृतवर्णसमाचारः परिव्राडधिपो गृही ॥ १२५॥ महाकालः खगपतिवर्णावर्णविभागकृत् । कृतान्तः कीलितेन्द्रारिः
    क्षणकाष्ठादिरूपवान् ॥ १२६॥ विश्वजित्तत्त्वजिज्ञासुर्ब्राह्मणो ब्रह्मचर्यवान् । सर्ववर्णाश्रमपरो वर्णाश्रमबहिस्थितिः
    ॥ १२७॥ दैत्यारिर्ब्रह्मजिज्ञासुर्वर्णाश्रमनिषेवितः । ब्रह्माण्डोदरभृत्क्षेत्रं स्वरवर्णस्वरूपकः ॥
    १२८॥ वेदान्तवचनातीतो वर्णाश्रमपरायणः । दृग्दृश्योभयरूपैकोमेनापतिसमर्चितः ॥ १२९॥ सत्त्वस्थः सकलद्रष्टा
    कृतवर्णाश्रमस्थितः । वर्णाश्रमपरित्राता सखा शूद्रादिवर्णवान् ॥ १३०॥ वसुधोद्धारकरणः कालोपाधिः सदागतिः
    । दैतेयसूदनोतीतस्मृतिज्ञो वडवानलः ॥ १३१॥ समुद्रमथनाचार्यो वनस्थोयज्ञदैवतम् । दृष्टादृष्टक्रियातीतो
    हेमाद्रिर्हरिचन्दनः ॥ १३२॥ निषिद्धनास्तिकमतिर्यज्ञभुक्पारिजातकः । सहस्रभुजहाशान्तः पापारिक्षीरसागरः
    ॥ १३३॥ राजाधिराजसन्तानः कल्पवृक्षस्तनूनपात् । धन्वन्तरिर्वेदवक्ता चिताभस्माङ्गरागवान् ॥ १३४॥ काशीश्वरः
    श्रोणिभद्रो बाणासुरवरप्रदः । रजस्थः खण्ढिताधर्म आभिचारनिवारणः ॥ १३५॥ मन्दरो यागफलदस्तमस्थो दमवान्शमी
    । वर्णाश्रमाः नन्दपरो दृष्टादृष्टफलप्रदः ॥ १३६॥ कपिलस्त्रिगुणानन्दः सहस्रफणसेवितः । कुबेरो हिमवाञ्छत्रं
    त्रयीधर्मप्रवर्तकः । आदितेयो यज्ञफलं शक्तित्रयपरायणः । दुर्वासाः पितृलोकेशोवीरसिंहपुराणवित् ॥ १३८॥
    अग्निमीळेस्फुरन्मूर्तिः सान्तर्ज्योतिः स्वरूपकः । सकलोपनिषत्कर्ता खांबरो ऋणमोचकः ॥ १३९॥ तत्त्वज्योतिः
    सहस्रांशुरिषेत्वोर्जलसत्तनुः । योगज्ञानमहाराजः सर्ववेदान्तकारणम् ॥ १४०॥ योगज्ञानसदानन्दः अग्नायाहिरूपवान्
    । ज्योतिरिन्द्रियसंवेद्यः स्वाधिष्ठानविजृम्भकः ॥ १४१॥ अखण्डब्रह्मखण्डश्रीः शन्नोदेवीस्वरूपवान् । योगज्ञानमहाबोधो
    रहस्यं क्षेत्रगोपकः ॥ १४२॥ भ्रूमध्यवेक्ष्यो गरली योगज्ञान सदाशिवः । चण्डाचण्डबृहद्भानुनर्यनस्त्वरितापतिः
    ॥ १४३॥ ज्ञानमहायोगी तत्त्वज्योतिः सुधारकः । फणिबद्धजटाजूटो बिन्दुनादकलात्मकः ॥ १४४॥ योगज्ञानमहासेनो
    लम्बिकोर्म्यभिषिञ्चितः । अन्तर्ज्योतिर्मूलदेवोऽनाहतः सुषुमाश्रयः ॥ १४५॥ भूतान्तविद्ब्रह्मभूतिर्योगज्ञानमहेश्वरः
    । शुक्लज्योतिः स्वरूपः श्रीयोगज्ञानमहार्णवः ॥ १४६॥ पूर्णविज्ञानभरितः सत्त्वविद्यावबोधकः । योगज्ञानमहादेवश्चन्द्रिकाद्रवसुद्रवः
    ॥ १४७॥ स्वभावयन्त्रसञ्चारः सहस्रदलमध्यगः ॥ १४८॥ ईश्वर उवाच । सहस्रनाममल्लारेरिदं दिव्यं प्रकाशितम्
    । लोकानां कृपया देविप्रीत्या तव वरानने ॥ १४९॥ य इदं पठते नित्यं पाठयेच्छृणुयादपि । भक्तितो वा प्रसङ्गाद्वा
    सकलं भद्रमश्नुते ॥ १५०॥ पुस्तकं लिखितं गेहे पूजितं यत्र तिष्ठति । तत्र सर्वसमृद्धीनामधिष्ठानं न संशयः
    ॥ १५१॥ सुतार्थी धनदारार्थीविद्यार्थी व्याधिनाशकृत् । यशोर्थी विजयार्थीच त्रिवारं प्रत्यहं पठेत् ॥
    १५२॥ महापापोपपापानां प्रायश्चित्तार्थमादरात् । प्रातस्नायी पठेदेतत् षण्मासात् सिद्धिमाप्नुयात् ॥ १५३॥
    रहस्यानां च पापानां पठनादेव नाशनम् । सर्वारिष्टप्रशमनं दुःस्वप्नफलशान्तिदम् ॥ १५४॥ सूतिकाबालसौख्यार्थी
    सूतिकायतने पठेत् । सुसूतिं लभते नित्यं गर्भिणी श
