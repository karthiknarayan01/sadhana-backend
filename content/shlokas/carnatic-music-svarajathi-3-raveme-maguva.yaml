id: carnatic-music-svarajathi-3-raveme-maguva
category: stotram
name:
  english: Carnatic Music Svarajathi 3 (Raveme Maguva)
content:
  english: catusra jati triputa talam tèlugu sahityam pallavi raveme maguva vinavu taguva vedukanu karuna
    nedu vagaguluka todukòni || anupallavi ve vegamuga jani na vibhu ganugòni yi vadu valadani yi mata
    vinumani || caranam a manini vagale ma cèluvunakemo ghanamuga docinanu maracènata nemanukònu yèdanikadhannambunandu
    nemi tocakanu nunti gada || caranam shrikarudagu shobhanadrivibhuduneda cèlingalasènata nanungaluvala
    rajukalanadelcunata upayamunadelpi todukòni || svarah pallavi pa du va ka | ku lu ka to | du kò ni
    | anupallavi pa sa ga | ri ma ga ri || ke ci na | nu ma ra cè || ri sa ni | sa ga ri sa | pa ma ga
    ri | ni | ma nu kò nu | ya tha ni ka | ma nam
  devanagari: चतुस्र जाति त्रिपुट तालम् तॆलुगु साहित्यम् पल्लवि रावेमे मगुवा विनवु तगुवा वेडुकनु करुण
    नेडु वगगुलुक तोडुकॊनि ॥ अनुपल्लवि वे वेगमुग जनि ना विभु गनुगॊनि यी वादु वलदनि यी माट विनुमनि ॥ चरणं
    आ मानिनि वगले मा चॆलुवुनकेमो घनमुग दोचिननु मरचॆनट नेमनुकॊनु यॆदनिकधन्नम्बुनन्दु नेमी तोचकनु नुण्टि
    गद ॥ चरणं श्रीकरुडगु शोभानाद्रिविभुडुनेडा चॆलिङ्गलसॆनट ननुङ्गलुवल राजुकलनदेल्चुनट उपायमुनदेल्पि तोडुकॊनि
    ॥ स्वराः पल्लवि प दु व क । कु लु क तो । दु कॊ नि । अनुपल्लवि प स ग । रि म ग रि ॥ के चि न । नु म र
    चॆ ॥ रि स नि । स ग रि स । प म ग रि । नि । म नु कॊ नु । य थ नि क । म नम्
