id: subrahmanyashadaksharamantrah
category: mantra
name:
  english: subrahmanyashadaksharamantrah
  devanagari: सुब्रह्मण्यषडक्षरमन्त्रः
content:
  english: om hridayaya namah | hrim shirase svaha | aim shikhayai vashat | klim kavacaya hum | om netratrayaya
    vaushat | hsaum astraya phat || hrim bhurbhuvassuvarom iti digbandhah || atha lamityadi pancapuja
    | lam prithivyatmane gandham kalpayami | ham akashatmane pushpani kalpayami | yam vayvatmane dhupam
    kalpayami | ram agnyatmane dipam kalpayami | vam amritatmane amritam mahanaivedyam kalpayami | sam
    sarvatmane tambuladi sarvopacarapujan kalpayami || dhyanam
  devanagari: ॐ हृदयाय नमः । ह्रीं शिरसे स्वाहा । ऐं शिखायै वषट् । क्लीं कवचाय हुम् । ॐ नेत्रत्रयाय वौषट्
    । ह्सौं अस्त्राय फट् ॥ ह्रीं भूर्भुवस्सुवरों इति दिग्बन्धः ॥ अथ लमित्यादि पञ्चपूजा । लं पृथिव्यात्मने
    गन्धं कल्पयामि । हं आकाशात्मने पुष्पाणि कल्पयामि । यं वाय्वात्मने धूपं कल्पयामि । रं अग्न्यात्मने
    दीपं कल्पयामि । वं अमृतात्मने अमृतं महानैवेद्यं कल्पयामि । सं सर्वात्मने ताम्बूलादि सर्वोपचारपूजान्
    कल्पयामि ॥ ध्यानम्
meaning: {}
