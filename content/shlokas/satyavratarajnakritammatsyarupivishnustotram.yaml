id: satyavratarajnakritammatsyarupivishnustotram
category: stotram
name:
  english: satyavratarajnakritammatsyarupivishnustotram
  devanagari: सत्यव्रतराज्नाकृतंमत्स्यरूपीविष्णुस्तोत्रम्
content:
  english: statha janasyavidusho'budho guruh | tvamarkadriksarvadrisham samikshano vrito gururnah svagatim
    bubhutsatam || 50|| jano janasyadishate'satim matim yaya prapadyeta duratyayam tamah | tvam tvavyayam
    jnanamamoghamanjasa prapadyate yena jano nijam padam || 51|| tvam sarvalokasya suhritpriyeshvaro hyatma
    gururjnanamabhishtasiddhih | tathapi loko na bhavantamandhadhi
  devanagari: स्तथा जनस्याविदुषोऽबुधो गुरुः । त्वमर्कदृक्सर्वदृशां समीक्षणो वृतो गुरुर्नः स्वगतिं बुभुत्सताम्
    ॥ ५०॥ जनो जनस्यादिशतेऽसतीं मतिं यया प्रपद्येत दुरत्ययं तमः । त्वं त्वव्ययं ज्ञानममोघमञ्जसा प्रपद्यते
    येन जनो निजं पदम् ॥ ५१॥ त्वं सर्वलोकस्य सुहृत्प्रियेश्वरो ह्यात्मा गुरुर्ज्ञानमभीष्टसिद्धिः । तथापि
    लोको न भवन्तमन्धधी
meaning: {}
