id: gayatrimantravidhanam
category: mantra
name:
  english: gayatrimantravidhanam
  devanagari: गायत्रीमन्त्रविधानम्
content:
  english: asya shrigayatrimahamantrasya caturvimshatyaksharanyasah | tat hridayaya namah | sa shirase
    namah | vi shikhayai namah | tu dakshinabahave namah | rva vamabahave namah | re dakshinahastaya namah
    | nyam vamahastaya namah | bhah kanthaya namah | rgah mukhaya namah | de dakshinanetraya namah | vasya
    vamanetraya namah | dhi bhrumadhyaya namah | ma lalataya namah | hi mastakaya namah | dhi dakshinakarnaya
    namah | yo vamakarnaya namah | yo nasikayai namah | nah oshthayoh namah | pra jihvayai namah | co
    hridayaya namah | da nabhyai namah | ya guhyaya namah | at muladharaya namah | om sarvangeshu namah
    || || iti caturvimshatyaksharanyasah || tripadanyasah
  devanagari: अस्य श्रीगायत्रीमहामन्त्रस्य चतुर्विंशत्यक्षरन्यासः । तत् हृदयाय नमः । स शिरसे नमः । वि
    शिखायै नमः । तु दक्षिणबाहवे नमः । र्व वामबाहवे नमः । रे दक्षिणहस्ताय नमः । ण्यं वामहस्ताय नमः । भः
    कण्ठाय नमः । र्गः मुखाय नमः । दे दक्षिणनेत्राय नमः । वस्य वामनेत्राय नमः । धी भ्रूमध्याय नमः । म ललाटाय
    नमः । हि मस्तकाय नमः । धि दक्षिणकर्णाय नमः । यो वामकर्णाय नमः । यो नासिकायै नमः । नः ओष्ठयोः नमः ।
    प्र जिह्वायै नमः । चो हृदयाय नमः । द नाभ्यै नमः । य गुह्याय नमः । आत् मूलाधाराय नमः । ॐ सर्वाङ्गेषु
    नमः ॥ ॥ इति चतुर्विंशत्यक्षरन्यासः ॥ त्रिपदान्यासः
meaning: {}
