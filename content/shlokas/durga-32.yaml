id: durga-32
category: stotram
name:
  english: durga 32
  devanagari: दुर्गा ३२
content:
  english: pathet sarvabhayanmukto bhavishyati na samshayah | shatrubhih pidyamano va durgabandhagato'pi
    va || 7|| dvatrimshannamapathena mucyate natra samshayah | rajna vadhaya ca''jnyaptah kruddhena dandanaya
    ca || 8|| yuddhe shatrubhirakranto vyaghradyairva tatha vane | mucyate sarvabhitibhyah pathannashtottaram
    shatam || 9|| apatsu naitatsadrishamanyadasti bhayapaham | etat tu pathatam devah na kinciddhiyate
    kvacit || 10|| naitaddeyamabhaktaya nastikaya shathaya ca | deyam bhaktaya shantaya gurudevarataya
    ca || 11|| prapto maha''padam yastu pathennamavalimimam| sahasravaramayutavaram va lakshameva va ||
    12|| brahmanairva svayam va'pi mucyate sakalapadah | samsiddhe'gnau hunedebhirnamabhirlakshasankhyaya
    || 13|| tilaih shuklaistrimadhvaktairmucyate ca''padam ganaih | ayutatrayametasya purashcaranamucyate
    || 14|| iti shritripurarahase mahatmyakhande shatcatvarimsho'dhyayantargata durgadvatrimshannamavalih
    samapta |
  devanagari: पठेत् सर्वभयान्मुक्तो भविष्यति न संशयः । शत्रुभिः पीड्यमानो वा दुर्गबन्धगतोऽपि वा ॥ ७॥ द्वात्रिंशन्नामपाठेन
    मुच्यते नात्र संशयः । राज्ञा वधाय चाऽऽज्ञ्यप्तः क्रुद्धेन दण्डनाय च ॥ ८॥ युद्धे शत्रुभिराक्रान्तो
    व्याघ्राद्यैर्वा तथा वने । मुच्यते सर्वभीतिभ्यः पठन्नष्टोत्तरं शतम् ॥ ९॥ आपत्सु नैतत्सदृशमन्यदस्ति
    भयापहम् । एतत् तु पठतां देवाः न किञ्चिद्धीयते क्वचित् ॥ १०॥ नैतद्देयमभक्ताय नास्तिकाय शठाय च । देयं
    भक्ताय शान्ताय गुरुदेवरताय च ॥ ११॥ प्राप्तो महाऽऽपदं यस्तु पठेन्नामावलीमिमाम्। सहस्रवारमयुतवारं वा
    लक्षमेव वा ॥ १२॥ ब्राह्मणैर्वा स्वयं वाऽपि मुच्यते सकलापदः । संसिद्धेऽग्नौ हुनेदेभिर्नामभिर्लक्षसङ्ख्यया
    ॥ १३॥ तिलैः शुक्लैस्त्रिमध्वक्तैर्मुच्यते चाऽऽपदां गणैः । अयुतत्रयमेतस्य पुरश्चरणमुच्यते ॥ १४॥ इति
    श्रीत्रिपुरारहसे माहात्म्यखण्डे षट्चत्वारिंशोऽध्यायान्तर्गता दुर्गाद्वात्रिंशन्नामावलिः समाप्ता ।
