id: kytb-1-1-agnyadheya-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-brahma-sandhattam
category: stotram
name:
  english: KYTB 1.1 Agnyadheya Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Brahma Sandhattam
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake prathamah prapathakah agnyadheyabrahmanam
    o shri gurubhyo namah | harih om || brahma sandhatta ntanme jinvatam | kshatragm sandhatta ntanme
    jinvatam | ishagm sandhatta mme jinvatam | urjagm sandhatta mme jinvatam | rayigm sandhatta mme jinvatam
    | pushtigm sandhatta mme jinvatam | prajagm sandhatta mme jinvatam | pashu ntanme jinvatam || stuto
    'si janadhah | devastva shukrapah pranayantu || shshukrashocisha || stuto 'si janadhah | devastva
    manthipah pranayantu || suprajah prajah prajanaya nparihi | manthi manthishocisha ||sajangmanau diva
    a prithivya ntanme jinvatam | pranagm sandhatta mme jinvatam | apanagm sandhatta || vyanagm sandhatta
    mme jinvatam | cakshu ntanme jinvatam | shrotragm sandhatta ntanme jinvatam | mana ntanme jinvatam
    | vacagm sandhatta mme jinvatam || ayuh stha ayurme dhattam | ayu ryajnaya dhattam | ayu ryajnapataye
    dhattam | prana mme dhattam | pranam ya~jnapataye dhattam | cakshuh sthashcakshurme dhattam | cakshu
    ryajnaya dhattam | cakshu ryajnapataye dhattam | shrotragg stha mme dhattam | shrotram ya~jnaya dhattam
    | shrotram ya~jnapataye dhattam | tau devau shukramanthinau |kalpayata ndaivirvishah | kalpayata murjamasmasu
    dhattam | prana mmayi ca yajamane ca || nirasta shshandah | nirasto markah || apanuttau shandamarkau
    sahamuna || shukrasya samidasi | manthinah samidasi || sa prathama rvishvakarma | sa prathamo mitro
    varuno agnih | sa prathamo brihaspatishcikitvan | tasma indraya sutamajuhomi || ntvapanagm sandhattam
    ta ntat | ishamurjagm rayi ntat | pranamapanam ntam | ishadipancake vaca | pranaditritaye ta madadhita
    | etadva agne tkrittikah | svayamevaina ndevatayamadhaya | brahmavarcasi bhavati || mukham va~ etannakshatranam
    | ya tkrittikah | yah krittika madhatte | mukhya eva bhavati || atho khalu || pacayanti | grihanaha
    dahuko bhavati || prajapati rohinya madadhata | tato vai te sarva drohinyai rohinitvam | yo rohinya
    magnimadhatte | ridhnotyeva | sarva rohati || deva vai bhadra || teshamanahito 'gnirasi kramat | te
    punarvasvoradadhata | tato vai tan vamam va~supavartata | yah pura bhadra nthsyat | sa punarvasvo
    madadhita | punarevainam va~supavartate | bhadro bhavati || yah kamayeta danakama me praja ssyuriti
    | sa purvayoh phalgunyo || aryamno va etannakshatram | yatpurve phalguni | aryameti tamahuryo dadati
    | danakama asmai praja bhavanti || yah kamayeta bhagi syamiti | sa uttarayoh phalgunyo ragnimadadhita
    | bhagasya va etannakshatram | yaduttare phalguni | bhagyeva bhavati || kalakanja vai namasura asann
    || || te suvargaya lokayagni macinvata | purusha ishtaka purusha ishtakam | sa indro brahmano bruvana
    ishtakamupadhatta | esha me citra nameti | te suvargam lo~kamaprarohann | sa indra ishtakamavrihat
    | te ryanta | ta urnavabhayo 'bhavann | dvavudapatatam || || tau divyau shvanavabhavatam | yo bhratrivyava
    nthsyat | sa citraya madadhita | avakiryaiva bhratrivyan | ojo balamindriyam 'gnimadadhita | vasanto
    vai bra hmanasyartuh | sva evaina mritavadhaya | brahmavarcasi bhavati | mukham dvasantah | yo vasanta
    'gnimadhatte | mukhya eva bhavati | atho yonimantamevaina mprajatamadhatte | grishme rajanya adadhita
    | grishmo vai rajanyasyartuh | sva evainamritavadhaya | indriyavi bhavati | sharadi vaishya adadhita
    | sharadvai vaishyasyartuh || || sva evainamritavadhaya | pashuma nbhavati || na purvayoh phalgunyo
    ragnimadadhita | esha vai jaghanya ratrih sam va~thsarasya | yatpurve phalguni | prishtita eva sam
    gnimadhaya | papiyan bhavati | uttarayoradadhita | esha vai prathama ratrih sam va~thsarasya | yaduttare
    phalguni | mukhata eva sam gnimadhaya | vasiya nbhavati || atho khalu | yadaivainam t | athadadhita
    | saivasyardhih || phalgunyoragnimadadhita ruttare phalguni shat ca uddhanti | yadevasya ameddhyam
    | tadapa hanti || apo || sikata nivapati | etadva agne shvanarasya rupam | rupenaiva vai nnivapati
    | pushtirva esha prajananam | yadushah || pushtyameva prajanane 'gnimadhatte | atho sanjnana eva |
    sa njnanagg hyeta tpashunam | yadushah || dyavaprithivi sahasta m | te viyati abrutam | astveva nau
    saha yajniyamiti | yadamushya yajniyamasi madadhat | ta usha abhavann || || yadasya yajniyamasi madadhat
    | tadadashcandramasi krishnam | usha nnivapannado ddhyayet | dyavaprithivyoreva yajniye 'gnimadhatte
    || agnirdevebhyo nilayata | akhu rupa nkritva | sa prithivi mpravishat | sa utih kurvanah prithivimanu
    samacarat | tadakhukarisha || yadakhukarishagm sabhamro bhavati | yadevasya tatra nyaktam | tadevavarundhe
    || urjam mprithivya upadika uddihanti | ya dvalmikavapa sabhamro bhavati | urjameva rasa mprithivya
    avarundhe | atho shrotrameva | shrotragg hyeta || abadhiro bhavati | ya evam ve~da || prajapatih praja
    asrijata | tasamanna ssudamupa prabhinat | tato vai tasamanna nnakshiyata | yasya sudah sambharo bhavati
    | nasya grihe nkshiyate || apo va idamagre salilamasit | tena prajapatirashramyat || 'manyata | asti
    vai tat | yasmi nnidamadhi tishthatiti | sa varaho rupa nkritvopanyamajjat | sa prithivimadha a rcchat
    | tasya upahatyodamajjat | ta 'prathayat | yadaprathayat || tprithivyai prithivitvam | abhudva idamiti
    | tadbhumyai bhumitvam | ta ssamavahat | tagm sharkarabhiradrigm hat | sham 'bhuditi | taccharkaranagm
    sharkaratvam | ya dvarahavihatagm sambharo bhavati | asyameva madhatte | sharkara bhavanti dhrityai
    ya~ || sareta agniradheya ityahuh | apo varunasya patnaya asann | ta agnirabhyaddhyayat | ta ssamabhavat
    | tasya retah para mupasyati | saretasamevagni madhatte || purusha invai sva dretaso bibhathsata ityahuh
    || bibhathsayai || ati prayacchati | artimevati prayacchati || agnirdevebhyo nilayata | ashvo rupa
    matishthat | tadashvatthasya shvatthatvam | yadashvattha ssambharo bhavati | yadevasya tatra nyaktam
    | tadevava vya~bhajanta | tata udumbara udatishthat | urgva udumbarah | yadaudumbara ssambharo bhavati
    | urjamevava rundhe || tritiyasyamito divi soma asit | ta ngayatryaharat | tasya parnamacchidyata
    | tatparno 'bhavat | ta tparnasya parnatvam || || yasya parnamayah sambharo bhavati | somapithamevava
    rundhe || deva vai brahmannavadanta | ta tparna upashrinot | sushrava vai nama | ya tparnamayah sambharo
    bhavati | brahmavarcasamevava rundhe || prajapati 'bibhetpra ma dhakshyatiti | tagm shamya || tacchamyai
    shamitvam | yacchamimayah sambharo bhavati | shantya apradahaya || agne ssrishtasya yatah | vikankata
    ssambharo bhavati | bha evavarundhe || sahridayo 'gniradheya ityahuh | maruto matamayann | tasya tantasya
    hridayamacchindann | sa 'shanirabhavat | yadashanihatasya vrikshasya sambharo bhavati |sahridaya cchindagg
    strini ca dvadashasu vikrameshvagnimadadhita | dvadasha masa ddvadashasu vikrame shvadadhita | parimitamavarundhita
    | cakshu rnimita adadhita | iya ncavarundhe || anritam vai~ vaca vadati | anrita rvai satyam | adra
    thsatyam | yashcakshu madhatte | satya evaina madhatte || tasmadahitagnirnanritam va~det | nasya brahmano
    ngrihe vaset | satye hyasyagnirahitah || agneyi vai ratrih || || agneyah pashavah | aindramahah |
    nakta madadhati | pashunevava m | indriyameva varundhe || ardhodite surya ahavaniya madadhati | etasmin
    vai loke prajapatih praja asrijata | praja eva ta || ida vai manavi yajnanukashinyasit | sa 'shrinot
    | asura agnimadadhata iti | tadagacchat | ta ahavaniyamagra adadhata | atha gar pacanam | sa 'bravit
    | praticyeshag shriragat | bhadra bhutva parabhavishyantiti || | praticyasya shrireti | bhadro bhutva
    parabhavati || sa 'shrinot | deva agni madadhata iti | tadagacchat | te pacanamagra adadhata | atha
    gar hapatyam | athahavaniya || pracyeshag shriragat | bhadra bhutva suvargam thsyanta iti | yasyaivamagni
    | pracyasya shrireti | bhadro bhutva suvargam ntu na vindate || sa syami | yatha pra prajaya pashubhi
    || pratyasmin ~loke sthasyasi | abhi suvargam njeshyasiti | gar hapatyamagra adadhat | gar va~ anu
    prajah pashavah prajayante | gar pacanam | tiryannva va ayam lo~kah | asminneva tena loke pratyatishthat
    | athahavaniya m | tenaiva suvargam | pra prajaya pashubhi rjayate | pratyasmin ~loke tishthati |
    abhi suvargam njayati || yasya va ayathadevatamagni bhyo vrishcyate | papiya nbhavati | yasya yatha
    devatam | na devata bhya avrishcyate | vasiya dadhamiti bhrigvangirasamadaddhyat | adityana vra~tapate
    vratenadadhamityanyasa m | varunasya tva rajno vratapate vratenadadhamiti rajnah | indrasya tvendriyena
    vratapate vratenadadhamiti rajanyasya | mano vratapate vratenadadhamiti vaishyasya | ribhuna vra~tapate
    vratenadadhamiti rathakarasya | yatha devatamagni bhya a vrishcyate | vasiya tatra pavamanahabimshi
    prajapati mapashyat | tenagnimadhatta | tena vai sa a ssuvarityaha | etadvai vaca ssatyam | ya etenagni
    madhatte | riddhnotyeva | atho satyaprashureva bhavati | atho ya evam vi~dvanabhicarati | strinuta
    evaina || bhurityaha | praja eva ta ssrijate | bhuva ityaha | asminneva loke prati tishthati | suvarityaha
    | suvarga eva loke prati tishthati || tribhiraksharai madadhati | traya ime lokah | eshvevainam lo~keshu
    pratishthita || suvargaya va esha lokayadhiyate | yadahavaniyah | suvarga evasmai loke vaca ssatyagm
    sarvamapnoti || tribhi m | ashtau sampadyante | ashtakshara gayatri | gayatro 'gnih | yavanevagnih
    | tamadhatte || || prajapatih praja asrijata | ta asma thsrishtah paracirayann | tabhyo jyoti njyotih
    pashyantih praja abhisamavartanta | uparivagni duddharann | jyotireva pashyantih praja yajamana samavartante
    || prajapaterakshyashvayat | ta || esha vai prajapatih | yadagnih | prajapatyo mpurastannayati | svameva
    cakshuh pashya ranudeti || vajri va eshah | yadashvah | yadashva mpurastannayati | jataneva bhratrivya
    npranudate || punaravartayati || || janishyamananeva pratinudate || nyahavaniyo gar nnashaknot | soshvah
    purvavad mpurvamudavahat | ta rvavahah purvavat mpurastannayati | vibhaktirevainayossa | atho nanaviryavevainau
    kurute || || yaduparyupari shiro hare t | pranan vicchindyat | adho shshiro harati | pranana ngopithaya
    || iyatyagre harati | atheyatyatheyati | traya ime lokah | eshvevainam lo~keshu pratishthitama 'bibhetpra
    ma dhakshyatiti || || tasya tredha mahimanam vyau~hat | shantya apradahaya | yat | mahimanamevasya
    ta dvyuhati | shantya apradahaya || punaravartayati | mahimanamevasya sandadhati || pashurva eshah
    | yadashvah | esha rudrah || || yadagnih | yadashvasya pade madaddhyat | rudraya pashu napidaddhyat
    | apashu t | anavaruddha asya pashavah syuh | par shvata akramayet | yatha ''hitasyagne rangara abhyavavarterann
    | avaruddha asya pashavo bhavanti | na rudrayapidadhati || || trini havigmshi nirvapati | viraja eva
    vikra 'nu vikramate || agnaye pavamanaya | agnaye pavakaya | agnaye shucaye | yadagnaye pavamanaya
    nirvapati | punatyevaina m | yadagnaye pavakaya | puta evasmi ndadhati | yadagnaye shucaye | brahmavarcasa
    yadagnaye shucaya eka dakshinashca devasura ya~tta asann | te deva vijaya mupayantah | agnau vamam
    nnyadadhata | idamu no bhavishyati | yadi no jeshyantiti | tadagnirno tredha vinyadadhat | pashushu
    tritiyam | aphsu tritiyam | aditye tritiyam || ddeva vijitya | punaravaruruthsanta | te 'gnaye pavamanaya
    purodasha nniravapann | pashavo va agnih pavamanah | yadeva pashushvasi 'gnaye pavakaya | apo va agnih
    pavakah | yadevaphsvasi 'gnaye shucaye | asau va adityo shshucih | yadevaditya asi tenavarundhata
    || brahmavadino vadanti | tanuvo vavaita agnyadheyasya | agneyo va ashtakapalo 'gnyadheyamiti | yatta
    || nangani | tadrigeva tat | yadetani nirvape 'ngani syuh | natma | tadrigeva tat | ubhayani sahanirupyani
    | yajnasya satmatvaya || ubhayam 'gnimadhatte | aindragna manu nirvapet | aditya ncarum | indragni
    vai devana mayatayamanau | ye eva devate ayatayamni | tabhyamevasma indriyam rundhe | adityo bhavati
    | iyam va~ aditih | asyameva pratitishthati || dhenvai va eta m | anaduhastandulah | mithunamevava
    rundhe | ghrite bhavati | yajnasyalu kshantatvaya || catvara ar sheyah prashnanti | dishameva jyotishi
    juhoti || pashavo va etani havigmshi | esha rudrah | yadagnih || || yathsadya etani havigmshi nirvape
    t | rudraya pashunapi daddhyat | apashu ssyat | yannanunirvape t | anavaruddha asya pashavah syuh
    | dvadashasu ratrishvanu nirvapet | sam va~thsara pratima vai dvadasha ratrayah | sam va~thsarenaivasmai
    rudragm shamayitva | pashunava rundhe || yadeka mekametani havigmshi nirvape || yatha trinyavapanani
    puraye t | tadriktat | na prajananamucchigmshet | eka nnirupya | uttare samasyet | tritiyamevasmai
    lokamucchigmshati prajananaya | ta mprajaya pashubhiranu prajayate | atho yajnasyaivaisha mpravartayati
    | manushyarathenaiva devaratha || brahmavadino vadanti | hotavya dyajusha juhuyat | ayathapurvamahuti
    juhuyat | yanna juhuyat | agnih parabhavet | tushnimeva hotavya mahuti juhoti | nagnih parabhavati
    || agnidhe dadati || nprinati | upabar ndadati | rupanamava rundhe | dhenugm hotre | ashisha evavarundhe
    | anadvaha | vahnirva anadvan | vahniraddhvaryuh || || vahninaiva vahni yajnasyava rundhe | mithunau
    gavau dadati | mithunasyava ruddhyai | vaso dadati | sarva devatyam vai~ vasah | sarva eva devatah
    prinati | a dvadashabhyo dadati | dvadasha masa va~thsara eva prati tishthati | kamamurdhva m | aparimitasyava
    rekameka metani havigmshi nirvape shshirastadayamagnih | sa rbhuvat | chardistokaya tanayaya yaccha
    || vatah pranastadayamagnih | sa ntokaya tanayaya pitu mpaca || pracimanu pradisha mprehi vidvan |
    agneragne puro agni rbhaveha | vishva asha didyano vibhahi | urja nno dhehi dvipade catushpade ||
    stadasau suryastadayamagnih | sampriyah pashubhi va~rcah shukra tanuh | shukra njyotirajasram | tena
    me didihi tena tva 'gne brahmana || anashe vyanashe sarvamayu rvyanashe || ye te agne shive tanuvau
    | virat ca svarat ca | te ma vishata nte ma jinvatam || || ye te agne shive tanuvau | samrat cabhibhushca
    | te ma vishata nte ma jinvatam | ye te agne shive tanuvau | vibhushca paribhushca | te ma vishata
    nte ma jinvatam | ye te agne shive tanuvau | prabhvi ca prabhutishca | te ma vishata nte ma jinvatam
    | yaste agne shivastanuvah | tabhistva ''dadhe || yaste agne ghorastanuvah | tabhiramu etadbrahmanam
    ime va ete loka agnayah | te yadavyavritta adhiyerann | shocayeyu madadhati | vatah prana ityanvaharya
    m | tenaivainan vyavartayati | tatha na shocayanti yajamanam || rathantara hapatya adhiyamane | rathantaro
    va ayam madhatte | vamadevya mabhigayata uddhriyamane | antariksham vai~ vamadevyam | antariksha evaina
    madhatte | atho shanti rvai vamadevyam | shantamevaina mpashavyamuddharate | brihadabhigayata ahavaniya
    adhiyamane | bar hato va asau lokah | amushminnevainam madhatte || prajapati 'shvo varo bhutva paramait
    | tam va~ravantiyenavarayata |ta dvaravantiyasya varavantiyatvam | shyaitena shyeti akuruta |tacchyaitasya
    shyaitatvam | ya mabhigayate | varayitvaivaina madhatte | shyaitena shyeti kurute || gharma || upainamuttaro
    yajno namati || rudro va eshah | yadagnih | sa adhiyamana ishvaro yajamanasya pashun higmsitoh | sa
    rbhuvadityaha | pashubhirevainagm sampriya mahigmsayai || chardistokaya tanayaya yacchetyaha |ashishamevaita
    ste || vatah prana ityanvaharya ntokaya tanayaya pitu mpacetyaha | annamevasmai svadayati || pracimanu
    pradisha mprehi vidvanityaha | vibhaktirevainayossa | atho nana viryavevainau kurute || urja nno dhehi
    dvipade catushpada ityaha | ashishamevaitamasha m | arko vai devanamanna || annamevava rundhe || tena
    me didihityaha | samindha evaina m || anashe vyanasha iti trirudingayati | traya ime lokah | eshvevainam
    lo~keshu pratishthita m | vingitama pratishthita madadhita | uddhrityai madhatte || virat ca svarat
    ca yaste agne shivastanuva stabhistva ''dadha ityaha | eta va agne shshivastanuvah | tabhirevainagm
    samardhayati || yaste agne ghorastanuva stabhiramu ngaccheti bruyadya ndvishyat | tabhirevaina mpratishthitamadhatte
    panca ca brahmaudanam shamigarbhadagni mmanthati | esha va agne ryajniya tanuh | tamevasmai janayati
    || aditih putrakama | saddhyebhyo devebhyo mapacat | tasya uccheshana 'dhatta | tasyai dhata ca ryama
    cajayetam | sa dvitiya 'dhatta | tasyai mitrashca varunashcajayetam | sa tritiya mapacat | tasya uccheshana
    'dhatta | tasya agmshashca bhagashcajayetam | sa caturtha 'dhatta | tasya indrashca vivasvag jayetam
    | brahmaudana mpacati | reta eva ta ddadhati || prashnanti brahmana odanam || yadajya mucchishyate
    | tena samidho 'bhyajyadadhati | uccheshanadva aditi reto dreto dhatte || asthi va etat | ya m | yadajyena
    samidho 'bhyajyadadhati | asthyeva ta dretasi dadhati || tisra adadhati mithunatvaya || iyati rbhavanti
    | prajapatina yajnamukhena sammitah || rbhavanti | yajnaparusha sammitah | iyati rbhavanti | etavadvai
    purushe virya m | virya sammitah || ardra bhavanti | ardramiva hi retah sicyate || citriyasyashvatthasyadadhati
    | citrameva bhavati || ghritavatibhi || etadva agneh priya dghritam | priyenaivaina ndhamna samardhayati
    | atho tejasa || gayatribhi rbrahmanasyadaddhyat | gayatrachanda vai bra hmanah | svasya chandasah
    pratyayanastvaya | trishtugbhi rajanyasya | trishtu pchanda vai rajanyah | svasya chandasah pratyayanastvaya
    || rvaishyasya | jagati chanda vai vaishyah | svasya chandasah pratyayanastvaya || tagm sam va~thsaragm
    hi reto hitam t | samidhah punaradaddhyat | reta eva taddhitam va~rdhamanameti || na magmsa mashniyat
    | na striyamupeyat || mashniyat | yathstriya ssyat | nainamagni rupanamet || shva adhasyamano brahmaudana
    mpacati | aditya va ita uttama lo~kamayann | te va ito yanta mpratinudante | ete khalu vavadityah
    | ya hmanah | taireva satva mpratinudante || brahmavadino vadanti | kva sah | agnih karyah | yo nprajanayatiti
    | shalkaistagm ratrimagni nnupavyushamarani nishtapet | yathar shabhaya vashita nyavicchayati | tadrigeva
    tat || apoduhya bhasmagni mmathitva prancamuddharati | sam mprajanayati || anahita va~thsare 'nadaddhyat
    | dvadashya va~thsara pratima vai dvadasha ratrayah | sam va~thsaramevasyahita bhavanti || yadi dvadashya
    nnadaddhyat | tryahe purastadadaddhyat | ahita evasya bhavanti || rajanyah svasya chandasah pratyayanastva
    ratraya shcatvari ca pancagnyadhanam prajapatih praja asrijata | sa riricano 'tapyata | sa atman virya
    mapashyat | tadavardhata | tadasma masrijyata | sa viradabhavat | ta ndevasura vyagrihnata | so tprajapatih
    | mama va esha || || doha eva yushmakamiti || sa tatah pracyudakramat | ta tprajapatih paryagrihnat
    | atharva pitu mme gopayeti | sa dvitiya tprajapatih paryagrihnat | narya praja mme gopayeti | sa
    tritiya tprajapatih paryagrihnat | shagg tprajapatih paryagrihnat | sapratha sabha mme gopayeti |
    sa pancama tprajapatih paryagrihnat | ahe buddhniya mantra mme gopayeti | agnin vava sa tan vyakramata
    | ta nprajapatih paryagrihnat | atho panktimeva || panktirva esha bra 'dhi nirmimite | yadagni 'gnaya
    adhiyante | panktam m | panktenaiva panktagg sprinoti || atharva pitu mme gopayetyaha | annamevai
    tena sprinoti | narya praja mme gopayetyaha | prajamevaitena sprinoti | shagg nme gopayetyaha || ||
