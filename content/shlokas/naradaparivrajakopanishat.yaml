id: naradaparivrajakopanishat
category: upanishad
name:
  english: naradaparivrajakopanishat
  devanagari: नारदपरिव्राजकोपनिषत्
content:
  english: kathamiti cettattvatastveka eva samnyasah ajnanenashaktivasha tkarmalopashca traividhyametya
    vairagyasamnyaso jnanavairagyasamnyasah karmasamnyasashceti caturvidhyamupagatastadyatheti dushtamadanabhacceti
    vishayavaitrishnyametya prakpunyakarmavashatsamnyastah sa vairagyasamnyasi shastrajnanatpapapunyalokanubhava
    shravanatprapancoparatah krodhershyasuyahankara bhimanatmakasarvasamsaram nirvritya dareshanadhaneshana
    lokeshanatmakadehavasanam shastravasanam lokavasanam tyaktva vamanannamiva prakritiyam sarvamidam
    heyam matva sadhanacatushtayasampanno yah samnyasati sa eva jnanasamnyasi | kramena sarvamabhyasya
    sarvamanubhuya jnanavairagyabhyam svarupanusandhanena dehamatravashishtah samnyasya jatarupadharo
    bhavati sa jnanavairagyasamnyasi | brahmacaryam samapya grihi bhutva vanaprasthashramametya vairagyabhave'pyashramakramanusarena
    yah samnyasyati sa karmasamnyasi | brahmacaryena samnyasya samnyasajjatarupadharo vairagyasamnyasi
    | vidvatsamnyasi jnanasamnyasi vividishasamnyasi karmasamnyasi | karmasamnyaso'pi dvividhah nimittasamnyaso'nimittasamnyasashceti
    | nimittastvaturah | animittah kramasamnyasah | aturah sarvakarmalopah pranasyotkramanakalasamnyasah
    sa nimittasamnyasah | dridhango bhutva sarvam kritakam nashvaramiti dehadikam sarvam heyam prapya
    | hamsah shucishadvasurantarikshasaddhota vedishadatidhirduronasat | nrishadvarasadritasadvyomasadabja
    goja ritaja adrija ritam brihat | brahmavyatiriktam sarvam nashvaramiti nishcityatho kramena yah samnyasyati
    sa samnyaso'nimittasamnyasah | samnyasah shadvidho bhavati | kuticako bahudako hamsah paramahamsah
    turiyatito'vadhutashceti | kuticakah shikhayajnopaviti dandakamandaludharah kaupinakanthadharah pitrimatrigurvaradhanaparah
    pitharakhanitrashikyadimantrasadhanapara ekatrannadanaparah shvetordhvapundradhari tridandah | bahudakah
    shikhadikanthadharastripundradhari kuticakavatsarvasamo madhukaravrittyashtakavalashi hamso jatadhari
    tripundrordhvapundradhari asamklriptamadhukarannashi kaupinakhandatundadhari | paramahamsah shikhayajnopavitarahitah
    pancagriheshvekaratrannadanaparah karapatri ekakaupinadhari shatimekamekam vainavam dandamekashatidharo
    va bhasmoddhulanaparah sarvatyagi | turiyatito gomukhah phalahari | annahari cedgrihatraye dehamatravashishto
    digambarah kunapavacchariravrittikah | avadhutastvaniyamo'bhishastapatitavarjanapurvakam sarvavarneshvajagara
    vrittyaharaparah svarupanusandhanaparah | aturo jivati cetkramasamnyasah kartavyah kuticakabahudakahamsanam
    brahmaca ryashramadituriyashramavat kuticakadinam samnyasavidhih | paramahamsaditrayanam na katisutram
    na kaupinam na vastram na kamandalurna dandah sarvavarnaika bhaikshatanaparatvam jatarupadharatvam
    vidhih | samnyasakale'pyalambuddhiparyantamadhitya tadanantaram katisutram kaupinam dandam vastram
    kamandalum sarvamapsu visrijyatha jatarupadharashcarenna kanthavesho nadhyetavyo na shrotavyamanyatkincitpranavadanyam
    na tarkam pathenna shabdamapi brihacchabdannadhyapayenna mahadvacoviglapanam gira panyadina sambhashanam
    nanyasmadva visheshena na shudrastripatitodakyasambhashanam na yaterdevapuja notsavadarshanam tirthayatravrittih
    | punaryativisheshah | kuticasyaikatra bhiksha bahudakasyasamklriptam madhukaram hamsasyashtagriheshvashtakavalam
    paramahamsasya pancagriheshu karapatram phalaharo gomukham turiyatitasyavadhutasyajagaravrittih sarvavarnikeshu
    yatirnaikaratram vasenna kasyapi nametturiyatitavadhutayorna jyeshtho yo na svarupajnah sa jyeshtho'pi
    kanishtho hastabhyam nadyuttaranam na kuryanna vrikshamarohenna yanadirudho na krayavikrayaparo na
    kincidvinimayaparo na dambhiko nanritavadi na yateh kimcitkartavyamastyasticetsamkaryam | tasmanmananadau
    samnyasinamadhikarah | aturakuticakayorbhurloko bahudakasya svargaloko hamsasya tapolokah paramahamsasya
    satyalokasturiyatitavadhutayoh svatmanyeva kaivalyam svarupanusandhanena bhramarakitanyayavat | yam
    yam vapi smaranbhavam tyajatyante kalevaram | tam tameva samapnoti nanyatha shrutishasanam | tadevam
    jnatva svarupanusandhanam vinanyathacaraparo na bhavettadacaravashattattallokapraptirjnana vairagyasampannasya
    svasminneva muktiriti na sarvatracaraprasakti stadacarah | jagratsvapnasushupteshvekasharirasya jagratkale
    vishvah svapnakale taijasah sushuptikale prajnah avasthabhedadavastheshvarabhedah karyabhedatkaranabhedastasu
    caturdashakarananam bahyavrittayo'tarvritayastesha mupadanakaranam | vrittayashcatvarah manobuddhirahankarashcittam
    ceti | tattadvrittivyaparabhedena prithagacarabhedah | netrastham jagaritam vidyatkanthe svapnam samavishat
    | sushuptam hridayastham tu turiyam murdhni samsthitam | turiyamaksharamiti jnatva jagarite sushuptyavasthapanna
    iva yadyacchritam yadyadrishtam tatsatsarvamavijnatamiva yo vasettasya svapnavasthayamapi tadrigavastha
    bhavati | sa jivanmukta iti vadanti | sarvashrutyarthapratipadanamapi tasyaiva muktiriti | bhikshurnaihikamushmikapekshah
    | yadyapekshasti tadanurupo bhavati | svarupanusandhanavyatiriktanyashastra bhyasairushtrakunkumabharavadvyartho
    na yogashastra pravrittirna sankhyashastrabhyaso na mantratantravyaparah | itarashastrapravrittiryaterasti
    cecchavalankaravaccarmakarava datividurakarmacaravidyaduro na pranavakirtanaparo yadyatkarma karoti
    tattatphalamanubhavati erandatailaphenavadatah sarvam parityajya tatprasaktam manodandam karapatram
    digambaram drishtva parivrajedbhikshuh | balonmattapishacavanmaranam jivitam va na kanksheta kalameva
    pratiksheta nirdeshabhritakanyayena parivraditi | titikshajnanavairagyashamadigunavarjitah | bhikshamatrena
    jivi syatsa yatiryativrittiha || 1|| na dandadharanena na mundanena na veshena na dambhacarena muktih
    | jnanadando dhrito yena ekadandi sa ucyate | kashthadando dhrito yena sarvashi jnanavarjitah | sa
    yati narakanghoranmaharauravasamjnitan || 2|| pratishtha sukarivishthasama gita maharshibhih | tasmadenam
    parityajya kitavatparyatedyatih || 3|| ayacitam yathalabham bhojanacchadanam bhavet | parecchaya ca
    digvasah snanam kuryatparecchaya || 4|| svapne'pi yo yuktah syajjagrativa visheshatah | idrikceshtah
    smritah shreshtho varishtho brahmavadinam || 5|| alabhe na vishadi syallabhe caiva na harshayet |
    pranayatrikamatrah syanmatrasangadvinirgatah || 6|| abhipujitalabhamshca jugupsetaiva sarvashah |
    abhipujitalabhaistu yatirmukto'pi badhyate || 7|| pranayatranimittam ca vyangare bhuktavajjane | kale
    prashaste varnanam bhikshartham paryatedgrihan || 8|| panipatrashcaranyogi nasakridbhaikshamacaret
    | tishthanbhunjyaccaranbhunjyanmadhyenacamanam tatha || 9|| abdhivaddhritamaryada bhavanti vishadashayah
    | niyatim na vimuncanti mahanto bhaskara eva || 5
  devanagari: कथमिति चेत्तत्त्वतस्त्वेक एव संन्यासः अज्ञानेनाशक्तिवशा त्कर्मलोपश्च त्रैविध्यमेत्य वैराग्यसंन्यासो
    ज्ञानवैराग्यसंन्यासः कर्मसंन्यासश्चेति चातुर्विध्यमुपागतस्तद्यथेति दुष्टमदनाभाच्चेति विषयवैतृष्ण्यमेत्य
    प्राक्पुण्यकर्मवशात्संन्यस्तः स वैराग्यसंन्यासी शास्त्रज्ञानात्पापपुण्यलोकानुभव श्रवणात्प्रपञ्चोपरतः
    क्रोधेर्ष्यासूयाहङ्कारा भिमानात्मकसर्वसंसारं निर्वृत्य दारेषणाधनेषणा लोकेषणात्मकदेहवासनां शास्त्रवासनां
    लोकवासनां त्यक्त्वा वमनान्नमिव प्रकृतीयं सर्वमिदं हेयं मत्वा साधनचतुष्टयसंपन्नो यः संन्यसति स एव ज्ञानसंन्यासी
    । क्रमेण सर्वमभ्यस्य सर्वमनुभूय ज्ञानवैराग्याभ्यां स्वरूपानुसन्धानेन देहमात्रावशिष्टः संन्यस्य जातरूपधरो
    भवति स ज्ञानवैराग्यसंन्यासी । ब्रह्मचर्यं समाप्य गृही भूत्वा वानप्रस्थाश्रममेत्य वैराग्यभावेऽप्याश्रमक्रमानुसारेण
    यः संन्यस्यति स कर्मसंन्यासी । ब्रह्मचर्येण संन्यस्य संन्यासाज्जातरूपधरो वैराग्यसंन्यासी । विद्वत्संन्यासी
    ज्ञानसंन्यासी विविदिषासंन्यासी कर्मसंन्यासी । कर्मसंन्यासोऽपि द्विविधः निमित्तसंन्यासोऽनिमित्तसंन्यासश्चेति
    । निमित्तस्त्वातुरः । अनिमित्तः क्रमसंन्यासः । आतुरः सर्वकर्मलोपः प्राणस्योत्क्रमणकालसंन्यासः स निमित्तसंन्यासः
    । दृढाङ्गो भूत्वा सर्वं कृतकं नश्वरमिति देहादिकं सर्वं हेयं प्राप्य । हंसः शुचिषद्वसुरन्तरिक्षसद्धोता
    वेदिषदतिधिर्दुरोणसत् । नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋतं बृहत् । ब्रह्मव्यतिरिक्तं सर्वं
    नश्वरमिति निश्चित्याथो क्रमेण यः संन्यस्यति स संन्यासोऽनिमित्तसंन्यासः । संन्यासः षड्विधो भवति । कुटीचको
    बहूदको हंसः परमहंसः तुरीयातीतोऽवधूतश्चेति । कुटीचकः शिखायज्ञोपवीती दण्डकमण्डलुधरः कौपीनकन्थाधरः पितृमातृगुर्वाराधनपरः
    पिठरखनित्रशिक्यादिमन्त्रसाधनपर एकत्रान्नादनपरः श्वेतोर्ध्वपुण्ड्रधारी त्रिदण्डः । बहूदकः शिखादिकन्थाधरस्त्रिपुण्ड्रधारी
    कुटीचकवत्सर्वसमो मधुकरवृत्त्याष्टकवलाशी हंसो जटाधारी त्रिपुण्ड्रोर्ध्वपुण्ड्रधारी असंक्लृप्तमाधुकरान्नाशी
    कौपीनखण्डतुण्डधारी । परमहंसः शिखायज्ञोपवीतरहितः पञ्चगृहेश्वेकरात्रान्नादनपरः करपात्री एककौपीनधारी
    शाटीमेकामेकं वैणवं दण्डमेकशाटीधरो वा भस्मोद्धूलनपरः सर्वत्यागी । तुरीयातीतो गोमुखः फलाहारी । अन्नाहारी
    चेद्गृहत्रये देहमात्रावशिष्टो दिगंबरः कुणपवच्छरीरवृत्तिकः । अवधूतस्त्वनियमोऽभिशस्तपतितवर्जनपूर्वकं
    सर्ववर्णेष्वजगर वृत्त्याहारपरः स्वरूपानुसन्धानपरः । आतुरो जीवति चेत्क्रमसंन्यासः कर्तव्यः कुटीचकबहूदकहंसानां
    ब्रह्मच र्याश्रमादितुरीयाश्रमवत् कुटीचकादीनां संन्यासविधिः । परमहंसादित्रयाणां न कटीसूत्रं न कौपीनं
    न वस्त्रं न कमण्डलुर्न दण्डः सार्ववर्णैक भैक्षाटनपरत्वं जातरूपधरत्वं विधिः । संन्यासकालेऽप्यलंबुद्धिपर्यन्तमधीत्य
    तदनन्तरं कटीसूत्रं कौपीनं दण्डं वस्त्रं कमण्डलुं सर्वमप्सु विसृज्याथ जातरूपधरश्चरेन्न कन्थावेशो नाध्येतव्यो
    न श्रोतव्यमन्यत्किञ्चित्प्रणवादन्यं न तर्कं पठेन्न शब्दमपि बृहच्छब्दान्नाध्यापयेन्न महद्वाचोविग्लापनं
    गिरा पाण्यादिना संभाषणं नान्यस्माद्वा विशेषेण न शूद्रस्त्रीपतितोदक्यासंभाषणं न यतेर्देवपूजा नोत्सवदर्शनं
    तीर्थयात्रावृत्तिः । पुनर्यतिविशेषः । कुटीचस्यैकत्र भिक्षा बहूदकस्यासंक्लृप्तं माधुकरं हंसस्याष्टगृहेष्वष्टकवलं
    परमहंसस्य पञ्चगृहेषु करपात्रं फलाहारो गोमुखं तुरीयातीतस्यावधूतस्याजगरवृत्तिः सार्ववर्णिकेषु यतिर्नैकरात्रं
    वसेन्न कस्यापि नमेत्तुरीयातीतावधूतयोर्न ज्येष्ठो यो न स्वरूपज्ञः स ज्येष्ठोऽपि कनिष्ठो हस्ताभ्यां
    नद्युत्तरणं न कुर्यान्न वृक्षमारोहेन्न यानादिरूढो न क्रयविक्रयपरो न किञ्चिद्विनिमयपरो न दाम्भिको नानृतवादी
    न यतेः किंचित्कर्तव्यमस्त्यस्तिचेत्सांकर्यम् । तस्मान्मननादौ संन्यासिनामधिकारः । आतुरकुटीचकयोर्भूर्लोको
    बहूदकस्य स्वर्गलोको हंसस्य तपोलोकः परमहंसस्य सत्यलोकस्तुरीयातीतावधूतयोः स्वात्मन्येव कैवल्यं स्वरूपानुसन्धानेन
    भ्रमरकीटन्यायवत् । यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम् । तं तमेव समाप्नोति नान्यथा श्रुतिशासनम्
    । तदेवं ज्ञात्वा स्वरूपानुसन्धानं विनान्यथाचारपरो न भवेत्तदाचारवशात्तत्तल्लोकप्राप्तिर्ज्ञान वैराग्यसंपन्नस्य
    स्वस्मिन्नेव मुक्तिरिति न सर्वत्राचारप्रसक्ति स्तदाचारः । जाग्रत्स्वप्नसुषुप्तेष्वेकशरीरस्य जाग्रत्काले
    विश्वः स्वप्नकाले तैजसः सुषुप्तिकाले प्राज्ञः अवस्थाभेदादवस्थेश्वरभेदः कार्यभेदात्कारणभेदस्तासु चतुर्दशकारणानां
    बाह्यवृत्तयोऽतर्वृतयस्तेषा मुपादानकारणम् । वृत्तयश्चत्वारः मनोबुद्धिरहङ्कारश्चित्तं चेति । तत्तद्वृत्तिव्यापारभेदेन
    पृथगाचारभेदः । नेत्रस्थं जागरितं विद्यात्कण्ठे स्वप्नं समाविशत् । सुषुप्तं हृदयस्थं तु तुरीयं मूर्ध्नि
    संस्थितम् । तुरीयमक्षरमिति ज्ञात्वा जागरिते सुषुप्त्यवस्थापन्न इव यद्यच्छृतं यद्यदृष्टं तत्सत्सर्वमविज्ञातमिव
    यो वसेत्तस्य स्वप्नावस्थायामपि तादृगवस्था भवति । स जीवन्मुक्त इति वदन्ति । सर्वश्रुत्यर्थप्रतिपादनमपि
    तस्यैव मुक्तिरिति । भिक्षुर्नैहिकामुष्मिकापेक्षः । यद्यपेक्षास्ति तदनुरूपो भवति । स्वरूपानुसन्धानव्यतिरिक्तान्यशास्त्रा
    भ्यासैरुष्ट्रकुङ्कुमभारवद्व्यर्थो न योगशास्त्र प्रवृत्तिर्न साङ्ख्यशास्त्राभ्यासो न मन्त्रतन्त्रव्यापारः
    । इतरशास्त्रप्रवृत्तिर्यतेरस्ति चेच्छवालङ्कारवच्चर्मकारव दतिविदूरकर्माचारविद्यादूरो न प्रणवकीर्तनपरो
    यद्यत्कर्म करोति तत्तत्फलमनुभवति एरण्डतैलफेनवदतः सर्वं परित्यज्य तत्प्रसक्तं मनोदण्डं करपात्रं दिगम्बरं
    दृष्ट्वा परिव्रजेद्भिक्षुः । बालोन्मत्तपिशाचवन्मरणं जीवितं वा न काङ्क्षेत कालमेव प्रतीक्षेत निर्देशभृतकन्यायेन
    परिव्राडिति । तितिक्षाज्ञानवैराग्यशमादिगुणवर्जितः । भिक्षामात्रेण जीवि स्यात्स यतिर्यतिवृत्तिहा ॥
    १॥ न दण्डधारणेन न मुण्डनेन न वेषेण न दम्भाचारेण मुक्तिः । ज्ञानदण्डो धृतो येन एकदण्डी स उच्यते । काष्ठदण्डो
    धृतो येन सर्वाशी ज्ञानवर्जितः । स याति नरकान्घोरान्महारौरवसंज्ञितान् ॥ २॥ प्रतिष्ठा सूकरीविष्ठासमा
    गीता महर्षिभिः । तस्मादेनां परित्यज्य कीटवत्पर्यटेद्यतिः ॥ ३॥ अयाचितं यथालाभं भोजनाच्छादनं भवेत् ।
    परेच्छया च दिग्वासाः स्नानं कुर्यात्परेच्छया ॥ ४॥ स्वप्नेऽपि यो युक्तः स्याज्जाग्रतीव विशेषतः । ईदृक्चेष्टः
    स्मृतः श्रेष्ठो वरिष्ठो ब्रह्मवादिनाम् ॥ ५॥ अलाभे न विषादी स्याल्लाभे चैव न हर्षयेत् । प्राणयात्रिकमात्रः
    स्यान्मात्रासङ्गाद्विनिर्गतः ॥ ६॥ अभिपूजितलाभांश्च जुगुप्सेतैव सर्वशः । अभिपूजितलाभैस्तु यतिर्मुक्तोऽपि
    बध्यते ॥ ७॥ प्राणयात्रानिमित्तं च व्यङ्गारे भुक्तवज्जने । काले प्रशस्ते वर्णानां भिक्षार्थं पर्यटेद्गृहान्
    ॥ ८॥ पाणिपात्रश्चरन्योगी नासकृद्भैक्षमाचरेत् । तिष्ठन्भुञ्ज्याच्चरन्भुञ्ज्यान्मध्येनाचमनं तथा ॥ ९॥
    अब्धिवद्धृतमर्यादा भवन्ति विशादाशयाः । नियतिं न विमुञ्चन्ति महान्तो भास्करा एव ॥ ५
