    shrikulapanditayai namah | shrikuladharmapriyayai namah | shrikamayai namah | shrikamyakarmavibhushitayai
    namah | shrikulapriyayai namah | shrikularatayai namah | shrikulinaparipujitayai namah | shrikulajnayai
    namah | 40 shrikamalapujyayai namah | shrikailasanagabhushitayai namah | shrikutajayai namah | shrikeshinyai
