id: nrisimhasarasvatistotram
category: stotram
name:
  english: nrisimhasarasvatistotram
  devanagari: नृसिंहसरस्वतिस्तोत्रम्
content:
  english: sarvapranishubhatmakam shrutinutam divyam padam pavanam ajnanandhadrigartamudhajanatabhasvatpradipananam
    | bhaktanantashubhepsitarthaphaladam rarajamanam gurum bhumanandacidambudhim yativaram vande nrisimham
    shivam || 1|| brahmavishnumahesharupamamalam shridattanamankitam sarvapranivijivanam niravadhim sarvantarajyotisham
    | smrityadishrutiyuktibhih paricitam svanandasuryam gurum bhumanandacidambudhim yativaram vande nrisimham
    shivam || 2|| samsarambudhimajjanarditanaratranakriyatatparam mayauddhatyavilapakamritagiram sarvajnamisham
    gurum | mayasrishtivikarashunyamamalam brahmabhayam shashvatam bhumanandacidambudhim yativaram vande
    nrisimham shivam || 3|| nanacitracaritradivyakusumamodannvitangaprabhum nanabhaktaganalisevitapadadvandvambujam
    nirmalam | sarvapraniguhashayam niravadhim bhaktabdhicandram gurum bhumanandacidambudhim yativaram
    vande nrisimham shivam || 4|| mokshanandasudhamritamaravapuh samnyasibhih samstutam bodhapranamunindrasevitapadam
    dattabhayam pavanam | kashayambaradandamanditatanum vedantavedyam gurum bhumanandacidambudhim yativaram
    vande nrisimham shivam || 5|| iti shrisamartha ramadasanugrihita ramapadakanjabhringayamana shrimatparamahamsa
    parivrajakacarya sadguru bhagavata shri shridharasvamina viracitam shrinrisimhasarasvatistotram sampurnam
    |
  devanagari: सर्वप्राणिशुभात्मकं श्रुतिनुतं दिव्यं पदं पावनं अज्ञानान्धदृगार्तमूढजनताभास्वत्प्रदीपाननम्
    । भक्तानन्तशुभेप्सितार्थफलदं राराजमानं गुरुं भूमानन्दचिदम्बुधिं यतिवरं वन्दे नृसिंहं शिवम् ॥ १॥ ब्रह्माविष्णुमहेशरूपममलं
    श्रीदत्तनामाङ्कितं सर्वप्राणिविजीवनं निरवधिं सर्वान्तरज्योतिषम् । स्मृत्यादिश्रुतियुक्तिभिः परिचितं
    स्वानन्दसूर्यं गुरुं भूमानन्दचिदम्बुधिं यतिवरं वन्दे नृसिंहं शिवम् ॥ २॥ संसाराम्बुधिमज्जनार्दितनरत्राणक्रियातत्परं
    मायौद्धत्यविलापकामृतगिरं सर्वज्ञमीशं गुरुम् । मायासृष्टिविकारशून्यममलं ब्रह्माभयं शाश्वतं भूमानन्दचिदम्बुधिं
    यतिवरं वन्दे नृसिंहं शिवम् ॥ ३॥ नानाचित्रचरित्रदिव्यकुसुमामोदान्न्विताङ्गप्रभुं नानाभक्तगणालिसेवितपदद्वन्द्वाम्बुजं
    निर्मलम् । सर्वप्राणिगुहाशयं निरवधिं भक्ताब्धिचन्द्रं गुरुं भूमानन्दचिदम्बुधिं यतिवरं वन्दे नृसिंहं
    शिवम् ॥ ४॥ मोक्षानन्दसुधामृतामरवपुः संन्यासिभिः संस्तुतं बोधप्राणमुनिन्द्रसेवितपदं दत्ताभयं पावनम्
    । काषायाम्बरदण्डमण्डिततनुं वेदान्तवेद्यं गुरुं भूमानन्दचिदम्बुधिं यतिवरं वन्दे नृसिंहं शिवम् ॥ ५॥
    इति श्रीसमर्थ रामदासानुगृहीत रामपदकञ्जभृङ्गायमान श्रीमत्परमहंस परिव्राजकाचार्य सद्गुरु भगवता श्री
    श्रीधरस्वामिना विरचितं श्रीनृसिंहसरस्वतिस्तोत्रं सम्पूर्णम् ।
