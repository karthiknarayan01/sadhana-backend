id: annamayya-keerthanas-nitya-poojalivigo
category: stotram
name:
  english: Annamayya Keerthanas Nitya Poojalivigo
content:
  english: adi pallavi nitya pujalivigo nèricina noho | pratyakshamainatti paramatmuniki nitya pujalivigo
    || caranam tanuve gudiyata talayè shikharamata pènu hridayame hari pithamata | kanugòna cupule ghana
    dipamulata tana lopali antaryamikini || caranam paluke mantramata padayina naluke kalakala manu pidi
    ghantayata | naluvaina rucule naivedyamulata talapulopalanunna daivamunaku || caranam gamana ceshtale
    angaranga gatiyata tami gala jivude dasudata | amarina urpule alabattamulata kramamuto shri vènkatarayuniki
    ||
  devanagari: आदि पल्लवि नित्य पूजलिविगो नॆरिचिन नोहो । प्रत्यक्षमैनट्टि परमात्मुनिकि नित्य पूजलिविगो
    ॥ चरणं तनुवे गुडियट तलयॆ शिखरमट पॆनु हृदयमे हरि पीठमट । कनुगॊन चूपुले घन दीपमुलट तन लोपलि अन्तर्यामिकिनि
    ॥ चरणं पलुके मन्त्रमट पादयिन नालुके कलकल मनु पिडि घण्टयट । नलुवैन रुचुले नैवेद्यमुलट तलपुलोपलनुन्न
    दैवमुनकु ॥ चरणं गमन चेष्टले अङ्गरङ्ग गतियट तमि गल जीवुडे दासुडट । अमरिन ऊर्पुले आलबट्टमुलट क्रममुतो
    श्री वॆङ्कटरायुनिकि ॥
