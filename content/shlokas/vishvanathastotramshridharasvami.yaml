id: vishvanathastotramshridharasvami
category: stotram
name:
  english: vishvanathastotramshridharasvami
  devanagari: विश्वनाथस्तोत्रम्श्रीधरस्वामी
content:
  english: stam vishvanathamamalam munivandyamide || 2|| yavanna bhaktirakhileshvarapadapadme samsarasaukhyamiha
    yatkila shuktiraupyam | yadbhaktireva bhavaroganuda sudhaiva tam vishvanathamamalam munivandyamide
    || 3|| yah kamamattagajagandavibhedasimhah yo vighnasarpabhavabhitinudo gurutman | yo durvishahyabhavatapajaduhkhacandrah
    tam vishvanathamamalam munivandyamide || 4|| vairagyabhaktinavapallavakridvasantah yobhogavasanavanapravidahadavah
    | yo'dharmaravanavinashanaheturamah tam vishvanathamamalam munivandyamide || 5|| svananyabhaktabhavavaridhikumbhajo
    yah yo bhaktacancalamanobhramarabjakalpah | yo bhaktasancitaghanapravibhedavatah tam vishvanathamamalam
    munivandyamide || 6|| sadbhaktasadhridayapanjaragah shuko yah onkaranihsvanavilubdhakarah piko yah
    | yo bhaktamandirakadambacaro mayurah tam vishvanathamamalam munivandyamide || 7|| yo bhaktakalpitadakalpataruh
    prasiddhah yo bhaktacittagatakamadhenuti cokth | yo bhaktacintitadadivyamamaniprakalpah tam vishvanathamamalam
    munivandyamide || 8|| hemaiva yadvadiha bhushananama dhatte brahmaiva tadvadiha shankaranama dhatte
    | yobhaktabhavatanudhrik cidakhandarupah tam vishvanathamamalam munivandyamide || 9|| yanneti neti
    vacanairnigama vadanti yajjivavishvabhavashokabhayatiduram | saccitsukhadvayamidam mama shuddharupam
    tam vishvanathamamalam munivandyamide || 10||
  devanagari: स्तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ २॥ यावन्न भक्तिरखिलेश्वरपादपद्मे संसारसौख्यमिह यत्किल
    शुक्तिरौप्यम् । यद्भक्तिरेव भवरोगनुदा सुधैव तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ ३॥ यः काममत्तगजगण्डविभेदसिंहः
    यो विघ्नसर्पभवभीतीनुदो गुरुत्मान् । यो दुर्विषह्यभवतापजदुःखचन्द्रः तं विश्वनाथममलं मुनिवन्द्यमीडे
    ॥ ४॥ वैराग्यभक्तिनवपल्लवकृद्वसन्तः योभोगवासनावनप्रविदाहदावः । योऽधर्मरावणविनाशनहेतुरामः तं विश्वनाथममलं
    मुनिवन्द्यमीडे ॥ ५॥ स्वानन्यभक्तभववारिधिकुम्भजो यः यो भक्तचञ्चलमनोभ्रमराब्जकल्पः । यो भक्तसञ्चितघनप्रविभेदवातः
    तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ ६॥ सद्भक्तसधृदयपञ्जरगः शुको यः ओङ्कारनिःस्वनविलुब्धकरः पिको यः ।
    यो भक्तमन्दिरकदम्बचरो मयूरः तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ ७॥ यो भक्तकल्पितदकल्पतरुः प्रसिद्धः यो
    भक्तचित्तगतकामधेनुति चोक्त्ः । यो भक्तचिन्तितददिव्यममणिप्रकल्पः तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ ८॥
    हेमैव यद्वदिह भूषणनाम धत्ते ब्रह्मैव तद्वदिह शङ्करनाम धत्ते । योभक्तभावतनुधृक् चिदखण्डरूपः तं विश्वनाथममलं
    मुनिवन्द्यमीडे ॥ ९॥ यन्नेति नेति वचनैर्निगमा वदन्ति यज्जीवविश्वभवशोकभयातिदूरम् । सच्चित्सुखाद्वयमिदं
    मम शुद्धरूपं तं विश्वनाथममलं मुनिवन्द्यमीडे ॥ १०॥
