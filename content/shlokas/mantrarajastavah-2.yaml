id: mantrarajastavah-2
category: mantra
name:
  english: mantrarajastavah
  devanagari: मन्त्रराजस्तवः
content:
  english: turyatitapadordhvagam gunaparam sattamayam sarvagam samvedyam shrutishirshakairanupamam sarvadhikam
    shashvatam | onkarantarabindumadhyasadanam hrinkaralabhyam numo vyomakarashikhavibhavimunisandrishyam
    cidatmeshvaram || lam ityadi pancapuja | onkaragamya onkaravacya onkaravigrahah | onkarashuktikamuktamanironkaravallabhah
    || 1|| onkarabilapancasya onkarasushiroragah | onkarapanjarashuka onkarantaravasakah || 2|| onkaranalinihamsa
    onkaravalakandarah | onkarasumasaurabhya onkarashamihavyavat || 3|| onkaragokshirasarpironkarambarabhaskarah
    | onkaradipasujyotironkaradvijaratsudha || 4|| onkaravedopanishadonkaraphalasadrasah | onkaranavamanikyasaudhasannishthabhupatih
    || 5|| nagendratanayanatho nanarupasamanvitah | navanilaghanashyamakandharo nagakundalah || 6|| namajjanamaratarurnatanotsukamanasah
    | nagabhugvahajanako nakshatreshashikhamanih || 7|| navakarpuragaurango nalinekshanasayakah | nadabindukalatito
    nagacarmottariyakah || 8|| nagasyajanako namyo nandikeshasamarcitah | narayanarcito nananigamoditamurtiman
    || 9|| narasimhamahadarpakadalivanakunjarah | navannavanamallokasanghakarunyavarshikah || 10|| namadbrahmadikotiranavaratnojjvalanghrikah
    | mayatito mahamayi manovacamagocarah || 11|| manjulango mahayogi mahamerusharasanah | manmathadhvamsako
    mauni madhudharatibhashakah || 12|| mahiratho mahadevo mahokshavaravahanah | madhuryajahnavivicisamplavitajatatatah
    || 13|| manorathaphalatitavarapradapadambujah | mahapralayasancari mahakalo mahanatah || 14|| madhurapuramadhyasthavimanantaravasakah
    | martandakotisadrisho mayapuranivasakah || 15|| shivakritih shivakarah shivanandavapurdharah | shivapriyah
    shivajneyah shivayogavaneshvarah || 16|| shivadharah shivamayah shivasaktahridambujah| shivangikritavamangah
    shivalokeshvarah shivah || 17|| shivasahayah shikhidrikchikhandi shivalokadah | shivakshetravilasi
    ca shikharindraniketanah || 18|| shivabhaktahridambhojanivasi shivapuhpatih | vagmi varishtho varado
    vatashavilasatkarah || 19|| vasuprado vasudevavaryacakrayudhapradah | varakundadrumavasi vatamulatatashrayah
    || 20|| vasundharamarakaro vandyo vatsalyavaridhih | vamadevo varyavaryo varabhayakarambujah || 21||
    vasureta varenyashca vasavadyamararcitah | vashikritakhilandashca vakprado varadeshikah || 22|| yajnakridyajnahridyajnadhvamsi
    yajneshvaro yami | yamadyashtangasandrishyo yanta yajnaviduttamah || 23|| yathecchasrishtabhuvano
    yatharthajanavatsalah | yatashritajanaklesho yajnasandrishyavigrahah || 24|| yamapraharta yaksheshasakha
    yatugunantakah | yajnamrigyo yajnasadhyo yajnavishrantibhuruhah || 25|| yatisho yaticittaravindanrittavidhayakah
    || 26|| atma'ntaratma paratma''dikailasanayakah | atmanathastirthanathah shabdanathah sadashivah ||
    27|| ashtavimshottarashatairetairnamabhirujjvalam | akhandam mantrarajakhyastavamabjabhavoditam ||
    28|| sakrit pathitva manujah shrutva va sarvabhogabhuk | sarvaghaughavinirmuktah sa jiveccharadah
    shatam || 29|| iti dhaumyenopadishtah pururavase kritah shrimantrarajastavah |
  devanagari: तुर्यातीतपदोर्ध्वगं गुणपरं सत्तामयं सर्वगं सम्वेद्यं श्रुतिशीर्षकैरनुपमं सर्वाधिकं शाश्वतम्
    । ओङ्कारान्तरबिन्दुमध्यसदनं ह्रीङ्कारलभ्यं नुमो व्योमाकारशिखाविभाविमुनिसन्दृश्यं चिदात्मेश्वरम् ॥
    लं इत्यादि पञ्चपूजा । ओङ्कारगम्य ओङ्कारवाच्य ओङ्कारविग्रहः । ओङ्कारशुक्तिकामुक्तामणिरोङ्कारवल्लभः
    ॥ १॥ ओङ्कारबिलपञ्चास्य ओङ्कारसुषिरोरगः । ओङ्कारपञ्जरशुक ओङ्कारान्तरवासकः ॥ २॥ ओङ्कारनलिनीहंस ओङ्कारावालकन्दरः
    । ओङ्कारसुमसौरभ्य ओङ्कारशमिहव्यवाट् ॥ ३॥ ओङ्कारगोक्षीरसर्पिरोङ्काराम्बरभास्करः । ओङ्कारदीपसुज्योतिरोङ्कारद्विजराट्सुधा
    ॥ ४॥ ओङ्कारवेदोपनिषदोङ्कारफलसद्रसः । ओङ्कारनवमाणिक्यसौधसन्निष्ठभूपतिः ॥ ५॥ नगेन्द्रतनयानाथो नानारूपसमन्वितः
    । नवनीलघनश्यामकन्धरो नागकुण्डलः ॥ ६॥ नमज्जनामरतरुर्नटनोत्सुकमानसः । नागभुग्वाहजनको नक्षत्रेशशिखामणिः
    ॥ ७॥ नवकर्पूरगौराङ्गो नलिनेक्षणसायकः । नादबिन्दुकलातीतो नागचर्मोत्तरीयकः ॥ ८॥ नागास्यजनको नम्यो नन्दिकेशसमर्चितः
    । नारायणार्चितो नानानिगमोदितमूर्तिमान् ॥ ९॥ नारसिंहमहादर्पकदलीवनकुञ्जरः । नवन्नवनमल्लोकसङ्घकारुण्यवार्षिकः
    ॥ १०॥ नमद्ब्रह्मादिकोटीरनवरत्नोज्ज्वलाङ्घ्रिकः । मायातीतो महामायी मनोवाचामगोचरः ॥ ११॥ मञ्जुलाङ्गो
    महायोगी महामेरुशरासनः । मन्मथध्वंसको मौनी मधुधारातिभाषकः ॥ १२॥ महीरथो महादेवो महोक्षवरवाहनः । माधुर्यजाह्नवीवीचीसम्प्लावितजटातटः
    ॥ १३॥ मनोरथफलातीतवरप्रदपदाम्बुजः । महाप्रलयसञ्चारी महाकालो महानटः ॥ १४॥ मधुरापुरमध्यस्थविमानान्तरवासकः
    । मार्ताण्डकोटिसदृशो मायापुरनिवासकः ॥ १५॥ शिवाकृतिः शिवाकारः शिवानन्दवपुर्धरः । शिवाप्रियः शिवाज्ञेयः
    शिवयोगवनेश्वरः ॥ १६॥ शिवाधारः शिवमयः शिवासक्तहृदम्बुजः। शिवाङ्गीकृतवामाङ्गः शिवलोकेश्वरः शिवः ॥ १७॥
    शिवासहायः शिखिदृक्छिखण्डी शिवलोकदः । शिवक्षेत्रविलासी च शिखरीन्द्रनिकेतनः ॥ १८॥ शिवभक्तहृदम्भोजनिवासी
    शिवपूःपतिः । वाग्मी वरिष्ठो वरदो वाताशविलसत्करः ॥ १९॥ वसुप्रदो वासुदेववर्यचक्रायुधप्रदः । वरकुन्दद्रुमावासी
    वटमूलतटाश्रयः ॥ २०॥ वसुन्धरामराकारो वन्द्यो वात्सल्यवारिधिः । वामदेवो वर्यवर्यो वराभयकराम्बुजः ॥ २१॥
    वसुरेता वरेण्यश्च वासवाद्यमरार्चितः । वशीकृताखिलाण्डश्च वाक्प्रदो वरदेशिकः ॥ २२॥ यज्ञकृद्यज्ञहृद्यज्ञध्वंसी
    यज्ञेश्वरो यमी । यमाद्यष्टाङ्गसन्दृश्यो यन्ता यज्ञविदुत्तमः ॥ २३॥ यथेच्छासृष्टभुवनो यथार्थजनवत्सलः
    । यताश्रितजनक्लेशो यज्ञसन्दृश्यविग्रहः ॥ २४॥ यमप्रहर्ता यक्षेशसखा यातुगुणान्तकः । यज्ञमृग्यो यज्ञसाध्यो
    यज्ञविश्रान्तिभूरुहः ॥ २५॥ यतीशो यतिचित्तारविन्दनृत्तविधायकः ॥ २६॥ आत्माऽन्तरात्मा परात्माऽऽदिकैलासनायकः
    । आत्मनाथस्तीर्थनाथः शब्दनाथः सदाशिवः ॥ २७॥ अष्टविंशोत्तरशतैरेतैर्नामभिरुज्ज्वलम् । अखण्डं मन्त्रराजाख्यस्तवमब्जभवोदितम्
    ॥ २८॥ सकृत् पठित्वा मनुजः श्रुत्वा वा सर्वभोगभुक् । सर्वाघौघविनिर्मुक्तः स जीवेच्छरदः शतम् ॥ २९॥ इति
    धौम्येनोपदिष्टः पुरूरवसे कृतः श्रीमन्त्रराजस्तवः ।
