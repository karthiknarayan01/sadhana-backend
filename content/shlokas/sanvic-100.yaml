id: sanvic-100
category: stotram
name:
  english: sanvic 100
  devanagari: सन्विच् १००
content:
  english: samvicchatakam || atha tyagarajaviracitam samvicchatakam || yasya nityam caranakamaladvandvamaishcaryabijam
    pradhyayanto hridayakamale punyabhajo munindrah | nirdvandvam tat samarasamaho prapya tishthanti tasmin
    tasyai devyai tapanarucaye tattvato'stu pranamah || 1|| ya kalyanagunaprasuh parashivanandamritasyandini
    bhumanandamayi paraparamayi tejomayi vangmayi | adyantarnatanuh shivadivasudhantantahprakashatmika
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 2|| yasyam protamidam caturdashajagat sutre
    manistomavad yasyam bhati jadam jadetaramidam stambhadivad daruni | yasyam pashyati vishvamajnahridayah
    sthanau pumamsam yatha sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 3|| mulaudyanagaloparodhanamahamudraprasanna
    para tejahpunjamayi sada gatiyuta hamsi sahasrarakam | ambhojam parahamsakelisadanam ya prapya lebhe
    mudam sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 4|| pranapanaravinduyogaparamanandaprabuddha
    sati samsupta shrutipatrapadmashayane saushumnavithyadyutam | varshatyasabhanatam samarasanandamritam
    prapya ya sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 5|| ya mitravarunalayat samudita
    tejomayi vallari vinadandatarushrita shivaviyadyanti svabhavat sada | nanavarnapadadipushpanicayan
    svasmin kiranticchaya sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 6|| ya caikottarakhadipancakagunakararnamantratmika
    ya pitarunashubhravigrahamayi sandhyatraye rajate | yapyekaksharanadasantatisukhodbodhaikamurtih para
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 7|| yavyakta navavaranathakarunapanga prakashatmika
    nilendivarapadmaharshakaradriktattvarnamuktavalih | kameshyadisudhamshushodashakalapurnatmavaktrambuja
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 8|| ya sima navakhandacakravasudhalankarameroh
    para nanadeshikayoginimanilasacchubhradivarnavaneh | kameshankanirabhranirmalamahakashasthavidyullata
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 9|| yasyah pritiraharnisham kulagirisrotahsudhayam
    para nishkamapranatantarangakusume hrinkaraghantadhvanau | gandhe'ham shiva eva nanya iti yo dipe
    vimarshatmake sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 10|| ya citram tripura purantakasamashlishta
    para jyotisham advaitapi shivardharmurtiramala pashapaha pashini | padmaradhyapadaravindayugala bhikshataneshapriya
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 11|| ya dura lalitapi dushkritajusham ya
    komalangyadrija ya nilambudamecakapi bhuvanam vidyotayatyadbhutam | ya kalyanagunapravahasumahavaramnidhirnirguna
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 12|| nishkrodha natalokamrityumathane ya
    baddhakaccha sada nirvaira nijapujanadikritinam dainye dvishantyadbhutam | bhaktanam bhayamocini bhavarata
    shrikamarajatmika sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 13|| vidyaranyapulindika
    shrutigira tattvopadeshtri satam varahi nakuli vilasakutuka yapyuttamabrahmani | ya citram sukhashantyatitavasudha
    shricandika shulini sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 14|| ya shala nigamagamasmritikalalilatatestryakshari
    ya phalakshamahasati smarakalahela parapyadbhutam | ya kalanalakantimatyapi sada nilalaka shitala
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 15|| kalyanacalakarmukasya mahishi pundrekshucapadbhutam
    lakshmivallabhasayakasya ramani pushpeshuhastambuja | ya rama parameshvarasya lalita lokatraye'tyadbhutam
    sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 16|| ya vacamadhidevatapyavishaya vacam shrutervarnitum
    shrotradindriyadevatapi na jadaih shrotradibhirjnayate | antahsthamapi yam pracodakataya no janate
    jantavah sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 17|| ya vina parameshvarankanilaya
    hrinkaramantri sada shyama kalasumurcchanadikalanahinapi raginyaho | nathenahatanadavibhramavati sthanum
    shivam cakarot sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 18|| ya mohandhatamo'panodanavidhau
    bodhatmika kaumudi samsararnavatarane dridhatara naukendracapaprabha | daridryadrividarane kanakarug
    dambholiricchatmika sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 19|| ya tapatrayajadyashokashamane
    kacinnrinam svardhuni ya shantyadigunapravalamanisamvriddhau sudhambonidhih | pratyagdrishtyasitabjaposhanavidhau
    jadyapaha dirghika sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 20|| shokaranyakutharika
    shubhaphalodyanasya ya vapika papakshvelasuparnakalpaghutika prajnajnayorambika | ashoccatanamulika
    vipanika vagarthavriddheh kaveh sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 21|| ya vanchaparipurane
    suralata mokshendira devata srashtradeh kuladevata sucarita vidyasu sarvonnata | nityanandarata sukarmamudita
    lokatrayaradhita sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 22|| sarasarapayovivecanavidhau
    hamsi param tu tvisha shyama mohatamopanodanavidhau hamsah sada bhasakah | prajnasaudhaviharinistulamahajyotsna
    divapi dhruva sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 23|| ya cintamanireva doshashamane
    dane param tvadrija vasanti pikasundari shrutisukhalape svayam pancami | yane yauvanasindhutirakarini
    padmatavirakshini sa samvit sukritodaya sphuratu nashcitte sada sarvaga || 24|| ya shambhornayanotpalenduvadana
    kandarpadutikshana cetashcatakanilaniradakacajivatusimantini | sha
  devanagari: संविच्छतकम् ॥ अथ त्यागराजविरचितम् संविच्छतकम् ॥ यस्या नित्यं चरणकमलद्वन्द्वमैश्चर्यबीजं
    प्रध्यायन्तो हृदयकमले पुण्यभाजो मुनीन्द्राः । निर्द्वन्द्वं तत् समरसमहो प्राप्य तिष्ठन्ति तस्मिन्
    तस्यै देव्यै तपनरुचये तत्त्वतोऽस्तु प्रणामः ॥ १॥ या कल्याणगुणप्रसूः परशिवानन्दामृतस्यन्दिनी भूमानन्दमयी
    परापरमयी तेजोमयी वाङ्ग्मयी । आद्यान्तार्णतनूः शिवादिवसुधान्तान्तःप्रकाशात्मिका सा संवित् सुकृतोदया
    स्फुरतु नश्चित्ते सदा सर्वगा ॥ २॥ यस्यां प्रोतमिदं चतुर्दशजगत् सूत्रे मणिस्तोमवद् यस्यां भाति जडं
    जडेतरमिदं स्तम्भादिवद् दारुणि । यस्यां पश्यति विश्वमज्ञहृदयाः स्थाणौ पुमांसं यथा सा संवित् सुकृतोदया
    स्फुरतु नश्चित्ते सदा सर्वगा ॥ ३॥ मूलौड्याणगलोपरोधनमहामुद्राप्रसन्ना परा तेजःपुञ्जमयी सदा गतियुता
    हंसी सहस्रारकम् । अम्भोजं परहंसकेलिसदनं या प्राप्य लेभे मुदं सा संवित् सुकृतोदया स्फुरतु नश्चित्ते
    सदा सर्वगा ॥ ४॥ प्राणापानरवीन्दुयोगपरमानन्दप्रबुद्धा सती संसुप्ता श्रुतिपत्रपद्मशयने सौषुम्नवीथ्याद्युतम्
    । वर्षत्यसभानटं समरसानन्दामृतं प्राप्य या सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ ५॥ या
    मित्रावरुणालयात् समुदिता तेजोमयी वल्लरी वीणादण्डतरुश्रिता शिववियद्यान्ती स्वभावात् सदा । नानावर्णपदादिपुष्पनिचयान्
    स्वस्मिन् किरन्तीच्छया सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ ६॥ या चैकोत्तरखादिपञ्चकगुणाकारार्णमन्त्रात्मिका
    या पीतारुणशुभ्रविग्रहमयी सन्ध्यात्रये राजते । याप्येकाक्षरनादसन्ततिसुखोद्बोधैकमूर्तिः परा सा संवित्
    सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ ७॥ याव्यक्ता नववारनाथकरुणापाङ्गा प्रकाशात्मिका नीलेन्दीवरपद्महर्षकरदृक्तत्त्वार्णमुक्तावलिः
    । कामेश्यादिसुधांशुषोडशकलापूर्णात्मवक्त्राम्बुजा सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा
    ॥ ८॥ या सीमा नवखण्डचक्रवसुधालङ्कारमेरोः परा नानादेशिकयोगिनीमणिलसच्छुभ्रादिवर्णावनेः । कामेशाङ्कनिरभ्रनिर्मलमहाकाशस्थविद्युल्लता
    सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ ९॥ यस्याः प्रीतिरहर्निशं कुलगिरिस्रोतःसुधायां परा
    निष्कामप्रणतान्तरङ्गकुसुमे ह्रीङ्कारघण्टाध्वनौ । गन्धेऽहं शिव एव नान्य इति यो दीपे विमर्शात्मके सा
    संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ १०॥ या चित्रं त्रिपुरा पुरान्तकसमाश्लिष्टा परा ज्योतिषाम्
    अद्वैतापि शिवार्धर्मूर्तिरमला पाशापहा पाशिनी । पद्माराध्यपदारविन्दयुगला भिक्षाटनेशप्रिया सा संवित्
    सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ ११॥ या दूरा ललितापि दुष्कृतजुषां या कोमलाङ्ग्यद्रिजा या नीलाम्बुदमेचकापि
    भुवनं विद्योतयत्यद्भुतम् । या कल्याणगुणप्रवाहसुमहावारांनिधिर्निर्गुणा सा संवित् सुकृतोदया स्फुरतु
    नश्चित्ते सदा सर्वगा ॥ १२॥ निष्क्रोधा नतलोकमृत्युमथने या बद्धकच्छा सदा निर्वैरा निजपूजनादिकृतिनां
    दैन्ये द्विषन्त्यद्भुतम् । भक्तानां भयमोचिनी भवरता श्रीकामराजात्मिका सा संवित् सुकृतोदया स्फुरतु नश्चित्ते
    सदा सर्वगा ॥ १३॥ विद्यारण्यपुलिन्दिका श्रुतिगिरा तत्त्वोपदेष्ट्री सतां वाराही नकुली विलासकुतुका याप्युत्तमब्राह्मणी
    । या चित्रं सुखशान्त्यतीतवसुधा श्रीचण्डिका शूलिनी सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा
    ॥ १४॥ या शाला निगमागमस्मृतिकलालीलाततेस्त्र्यक्षरी या फालाक्षमहासती स्मरकलाहेला पराप्यद्भुतम् । या
    कालानलकान्तिमत्यपि सदा नीलालका शीतला सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ १५॥ कल्याणाचलकार्मुकस्य
    महिषी पुण्ड्रेक्षुचापाद्भुतं लक्ष्मीवल्लभसायकस्य रमणी पुष्पेषुहस्ताम्बुजा । या रामा परमेश्वरस्य ललिता
    लोकत्रयेऽत्यद्भुतं सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ १६॥ या वाचामधिदेवताप्यविषया
    वाचां श्रुतेर्वर्णितुं श्रोत्रादीन्द्रियदेवतापि न जडैः श्रोत्रादिभिर्ज्ञायते । अन्तःस्थामपि यां प्रचोदकतया
    नो जानते जन्तवः सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ १७॥ या वीणा परमेश्वराङ्कनिलया ह्रीङ्कारमन्त्री
    सदा श्यामा कालसुमूर्च्छनादिकलनाहीनापि रागिण्यहो । नाथेनाहतनादविभ्रमवती स्थाणुं शिवं चाकरोत् सा संवित्
    सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ १८॥ या मोहान्धतमोऽपनोदनविधौ बोधात्मिका कौमुदी संसारार्णवतारणे
    दृढतरा नौकेन्द्रचापप्रभा । दारिद्र्याद्रिविदारणे कनकरुग् दम्भोलिरिच्छात्मिका सा संवित् सुकृतोदया स्फुरतु
    नश्चित्ते सदा सर्वगा ॥ १९॥ या तापत्रयजाड्यशोकशमने काचिन्नृणां स्वर्धुनी या शान्त्यादिगुणप्रवालमनिसंवृद्धौ
    सुधाम्बोनिधिः । प्रत्यग्दृष्ट्यसिताब्जपोषणविधौ जाड्यापहा दीर्घिका सा संवित् सुकृतोदया स्फुरतु नश्चित्ते
    सदा सर्वगा ॥ २०॥ शोकारण्यकुठारिका शुभफलोद्यानस्य या वापिका पापक्ष्वेलसुपर्णकल्पघुटिका प्राज्ञाज्ञयोरम्बिका
    । आशोच्चाटनमूलिका विपणिका वागर्थवृद्धेः कवेः सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ २१॥
    या वाञ्छापरिपूरणे सुरलता मोक्षेन्दिरा देवता स्रष्ट्रादेः कुलदेवता सुचरिता विद्यासु सर्वोन्नता । नित्यानन्दरता
    सुकर्ममुदिता लोकत्रयाराधिता सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ २२॥ सारासारपयोविवेचनविधौ
    हंसी परं तु त्विषा श्यामा मोहतमोपनोदनविधौ हंसः सदा भासकः । प्रज्ञासौधविहारिनिस्तुलमहाज्योत्स्ना दिवापि
    ध्रुवा सा संवित् सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ २३॥ या चिन्तामणिरेव दोषशमने दाने परं त्वद्रिजा
    वासन्ती पिकसुन्दरी श्रुतिसुखालापे स्वयं पञ्चमी । याने यौवनसिन्धुतीरकरिणी पद्माटवीरक्षिणी सा संवित्
    सुकृतोदया स्फुरतु नश्चित्ते सदा सर्वगा ॥ २४॥ या शम्भोर्नयनोत्पलेन्दुवदना कन्दर्पदूतीक्षणा चेतश्चातकनीलनीरदकचाजीवातुसीमन्तिनी
    । श
