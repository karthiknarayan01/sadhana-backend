id: chakshushopanishad-chakshushmati-vidya
category: stotram
name:
  english: Chakshushopanishad (Chakshushmati Vidya)
content:
  english: asyah cakshushividyayah ahirbudhnya rishih | gayatri chandah | suryo devata | cakshuroganivrittaye
    jape viniyogah | om cakshushcakshushcakshuh tejah sthiro bhava | mam pahi pahi | tvaritam cakshurogan
    shamaya shamaya | mama jatarupam tejo darshaya darshaya | yathaham andho na syam tatha kalpaya kalpaya
    | kalyanam kuru kuru | yani mama purvajanmoparjitani cakshuh pratirodhaka dushkritani sarvani nirmulaya
    nirmulaya | om namah cakshustejodatre divyaya bhaskaraya | om namah karunakaraya'mritaya | om namah
    suryaya | om namo bhagavate suryayakshitejase namah | khecaraya namah | mahate namah | rajase namah
    | tamase namah | asato ma sadgamaya | tamaso ma jyotirgamaya | mrityorma amritam gamaya | ushno bhagavan
    shucirupah | hamso bhagavan shucirapratirupah | ya imam cakshushmatim vidyam brahmano nityamadhite
    na tasya akshirogo bhavati | na tasya kule andho bhavati | ashtau brahmanan grahayitva vidyasiddhirbhavati
    | vishvarupam ghrininam jatavedasam hiranmayam purusham jyotirupam tapantam sahasrarashmih shatadhavartamanah
    | purah prajanamudayatyesha suryah | om namo bhagavate adityaya akshitejase aho vahini vahini svaha
    | om namo bhagavate adityaya suryayaho vahinyahovahini svaha |
  devanagari: अस्याः चाक्षुषीविद्यायाः अहिर्बुध्न्य ऋषिः । गायत्री छन्दः । सूर्यो देवता । चक्षुरोगनिवृत्तये
    जपे विनियोगः । ॐ चक्षुश्चक्षुश्चक्षुः तेजः स्थिरो भव । मां पाहि पाहि । त्वरितं चक्षुरोगान् शमय शमय
    । मम जातरूपं तेजो दर्शय दर्शय । यथाहं अन्धो न स्यां तथा कल्पय कल्पय । कल्याणं कुरु कुरु । यानि मम
    पूर्वजन्मोपार्जितानि चक्षुः प्रतिरोधक दुष्कृतानि सर्वाणि निर्मूलय निर्मूलय । ॐ नमः चक्षुस्तेजोदात्रे
    दिव्याय भास्कराय । ॐ नमः करुणाकरायाऽमृताय । ॐ नमः सूर्याय । ॐ नमो भगवते सूर्यायाक्षितेजसे नमः । खेचराय
    नमः । महते नमः । रजसे नमः । तमसे नमः । असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय
    । उष्णो भगवान् शुचिरूपः । हंसो भगवान् शुचिरप्रतिरूपः । य इमां चक्षुष्मतीं विद्यां ब्राह्मणो नित्यमधीते
    न तस्य अक्षिरोगो भवति । न तस्य कुले अन्धो भवति । अष्टौ ब्राह्मणान् ग्राहयित्वा विद्यासिद्धिर्भवति
    । विश्वरूपं घृणिनं जातवेदसं हिरण्मयं पुरुषं ज्योतीरूपं तपन्तं सहस्ररश्मिः शतधावर्तमानः । पुरः प्रजानामुदयत्येष
    सूर्यः । ॐ नमो भगवते आदित्याय अक्षितेजसे अहो वाहिनि वाहिनि स्वाहा । ॐ नमो भगवते आदित्याय सूर्यायाहो
    वाहिन्यहोवाहिनी स्वाहा ।
