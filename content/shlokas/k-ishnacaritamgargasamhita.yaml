id: k-ishnacaritamgargasamhita
category: stotram
name:
  english: kṟishnacaritamgargasamhita
  devanagari: क्ऱिष्णचरितम्गर्गसम्हिता
content:
  english: rvatsasuram ca vinipatya kapitthavrikshaih | sadyo vigrihya kharatundapute ca dorbhyam daityam
    dadara sa bakam trinavattatinyam || 5|| sandharayamshca shishubhirbahuvatsasanghan venum kvananmadanamohanaveshabhridyah
    | gopanaghasuramukhe prahitanjugopa gogopavatsapavapuh sa cakara sadyah || 6|| kshetrajna atmapurusho
    bhagavananantah purnah pradhanapurusheshvara adidevah | dhritva vapuh sa viharanvrajabalakeshu sammohayanvidhimajo
    vicacara krishnah || 7|| cikshepa dhenukamasau balinam balena tale pragrihya sahasa phanikaliyakhyam
    | babhrama vahnimapibaddanujam pralambam sadyo jaghana sa bali dridhamushtina ca || 8|| sancarayanvrajavadhurmadhuram
    kvanan yo venum vane vrajavadhunijagitakirtih | divyambarani sa jahara varangananam vipranganabhirabhitah
    kritabhaktabhojah || 9|| deve ca varshati pashunkripaya rirakshu
  devanagari: र्वत्सासुरं च विनिपात्य कपित्थवृक्षैः । सद्यो विगृह्य खरतुण्डपुटे च दोर्भ्यां दैत्यं ददार
    स बकं तृणवत्तटिन्याम् ॥ ५॥ सन्धारयंश्च शिशुभिर्बहुवत्ससङ्घान् वेणुं क्वणन्मदनमोहनवेषभृद्यः । गोपानघासुरमुखे
    प्रहिताञ्जुगोप गोगोपवत्सपवपुः स चकार सद्यः ॥ ६॥ क्षेत्रज्ञ आत्मपुरुषो भगवाननन्तः पूर्णः प्रधानपुरुषेश्वर
    आदिदेवः । धृत्वा वपुः स विहरन्व्रजबालकेषु सम्मोहयन्विधिमजो विचचार कृष्णः ॥ ७॥ चिक्षेप धेनुकमसौ बलिनं
    बलेन ताले प्रगृह्य सहसा फणिकालियाख्यम् । बभ्राम वह्निमपिबद्दनुजं प्रलम्बं सद्यो जघान स बली दृढमुष्टिना
    च ॥ ८॥ सञ्चारयन्व्रजवधूर्मधुरं क्वणन् यो वेणुं वने व्रजवधूनिजगीतकीर्तिः । दिव्याम्बराणि स जहार वराङ्गनानां
    विप्राङ्गनाभिरभितः कृतभक्तभोजः ॥ ९॥ देवे च वर्षति पशून्कृपया रिरक्षु
meaning: {}
