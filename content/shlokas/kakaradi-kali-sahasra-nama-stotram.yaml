id: kakaradi-kali-sahasra-nama-stotram
category: stotram
name:
  english: Kakaradi Kali Sahasra Nama Stotram
content:
  english: asya shrisarvasamrajya medhakalisvarupa kakaratmaka sahasranamastotra mantrasya mahakala rishih
    anushtup chandah shridakshina mahakali devata hrim bijam hum shaktih krim kilakam kalivaradanadyakhileshtarthe
    pathe viniyogah | rishyadinyasah om mahakala rishaye namah shirasi | anushtup chandase namah mukhe
    | shri dakshina mahakali devatayai namah hridaye | hrim bijaya namah guhye | hum shaktaye namah padayoh
    | krim kilakaya namo nabhau | viniyogaya namah sarvange | karanyasah om kram angushthabhyam namah
    | om krim tarjanibhyam namah | om krum madhyamabhyam namah | om kraim anamikabhyam namah | om kraum
    kanishthikabhyam namah | om krah karatalakaraprishthabhyam namah | hridayadi nyasah om kram hridayaya
    namah | om krim shirase svaha | om krum shikhayai vashat | om kraim kavacaya hum | om kraum netratrayaya
    vaushat | om krah astraya phat | atha dhyanam | karalavadanam ghoram muktakeshim caturbhujam | kalikam
    dakshinam divyam mundamalavibhushitam || || sadyashchinnashirah khadgavamordhvadhah karambujam | abhayam
    varadam caiva dakshinadhordhvapanikam || || mahameghaprabham shyamam tatha caiva digambaram | kanthavasaktamundaligaladrudhiracarcitam
    || || karnavatamsatanita shavayugmabhayanakam | ghoradamshtrakaralasyam pinonnatapayodharam || ||
    shavanam karasanghataih kritakancim hasanmukhim | srikkadvayagaladraktadharavisphuritananam || ||
    ghorarupam maharaudrim shmashanalayavasinim | danturam dakshinavyapimuktalambakacoccayam || || shavarupamahadevahridayopari
    samsthitam | shivabhirghorarupabhishcaturdikshu samanvitam || || mahakalena sardhordhamupavishtarataturam
    | sukhaprasannavadanam smerananasaroruham | evam sancintayeddevim shmashanalayavasinim || || atha
    stotram | om krim kali krum karali ca kalyani kamala kala | kalavati kaladhya ca kalapujya kalatmika
    || || kaladrishta kalapushta kalamasta kalakara | kalakotisamabhasa kalakotiprapujita || || kalakarma
    kaladhara kalapara kalagama | kaladhara kamalini kakara karuna kavih || || kakaravarnasarvangi kalakotiprabhushita
    | kakarakotigunita kakarakotibhushana || || kakaravarnahridaya kakaramanumandita | kakaravarnanilaya
    kakashabdaparayana || || kakaravarnamukuta kakaravarnabhushana | kakaravarnarupa ca kakashabdaparayana
    || || kavirasphalanarata kamalakarapujita | kamalakaranatha ca kamalakararupadhrik || || kamalakarasiddhistha
    kamalakaraparada | kamalakaramadhyastha kamalakaratoshita || || kathankaraparalapa kathankaraparayana
    | kathankarapadantastha kathankarapadarthabhuh || || kamalakshi kamalaja kamalakshaprapujita | kamalakshavarodyukta
    kakara karburakshara || || karatara karacchinna karashyama kararnava | karapujya kararata karada karapujita
    || || karatoya karamarsha karmanasha karapriya | karaprana karakaja karaka karakantara || || karakacalarupa
    ca karakacalashobhini | karakacalaputri ca karakacalatoshita || || karakacalagehastha karakacalarakshini
    | karakacalasammanya karakacalakarini || || karakacalavarshadhya karakacalaranjita | karakacalakantara
    karakacalamalini || || karakacalabhojya ca karakacalarupini | karamalakasamstha ca karamalakasiddhida
    || || karamalakasampujya karamalakatarini | karamalakakali ca karamalakarocini || || karamalakamata
    ca karamalakasevini | karamalakabaddhyeya karamalakadayini || || kanjanetra kanjagatih kanjastha kanjadharini
    | kanjamalapriyakari kanjarupa ca kanjaja || || kanjajatih kanjagatih kanjahomaparayana | kanjamandalamadhyastha
    kanjabharanabhushita || || kanjasammananirata kanjotpattiparayana | kanjarashisamakara kanjaranyanivasini
    || || karanjavrikshamadhyastha karanjavrikshavasini | karanjaphalabhushadhya karanjavanavasini ||
    || karanjamalabharana karavalaparayana | karavalaprahrishtatma karavalapriyagatih || || karavalapriyakantha
    karavalaviharini | karavalamayi karma karavalapriyankari || || kabandhamalabharana kabandharashimadhyaga
    | kabandhakutasamsthana kabandhanantabhushana || || kabandhanadasantushta kabandhasanadharini | kabandhagrihamadhyastha
    kabandhavanavasini || || kabandhakancikarani kabandharashibhushana | kabandhamalajayada kabandhadehavasini
    || || kabandhasanamanya ca kapalamalyadharini | kapalamalamadhyastha kapalavratatoshita || || kapaladipasantushta
    kapaladiparupini | kapaladipavarada kapalakajjalasthita || || kapalamalajayada kapalajapatoshini |
    kapalasiddhisamhrishta kapalabhojanodyata || || kapalavratasamsthana kapalakamalalaya | kavitvamritasara
    ca kavitvamritasagara || || kavitvasiddhisamhrishta kavitvadanakarini | kavipujya kavigatih kavirupa
    kavipriya || || kavibrahmanandarupa kavitvavratatoshita | kavimanasasamsthana kavivanchaprapurani
    || || kavikanthasthita kam hrim kankankam kavipurtida | kajjala kajjaladanamanasa kajjalapriya ||
    || kapalakajjalasama kajjaleshaprapujita | kajjalarnavamadhyastha kajjalanandarupini || || kajjalapriyasantushta
    kajjalapriyatoshini | kapalamalabharana kapalakarabhushana || || kapalakarabhushadhya kapalacakramandita
    | kapalakotinilaya kapaladurgakarini || || kapalagirisamsthana kapalacakravasini | kapalapatrasantushta
    kapalarghyaparayana || || kapalarghyapriyaprana kapalarghyavaraprada | kapalacakrarupa ca kapalarupamatraga
    || || kadali kadalirupa kadalivanavasini | kadalipushpasamprita kadaliphalamanasa || || kadalihomasantushta
    kadalidarshanodyata | kadaligarbhamadhyastha kadalivanasundari || || kadambapushpanilaya kadambavanamadhyaga
    | kadambakusumamoda kadambavanatoshini || || kadambapushpasampujya kadambapushpahomada | kadambapushpamadhyastha
    kadambaphalabhojini || || kadambakananantahstha kadambacalavasini | kakshapa kakshaparadhya kakshapasanasamsthita
    || || karnapura karnanasa karnadhya kalabhairavi | kalaprita kalahada kalaha kalahatura || || karnayakshi
    karnavarta kathini karnasundari | karnapishacini karnamanjari kavikakshada || || kavikakshavirupadhya
    kavikakshasvarupini | kasturimrigasamsthana kasturimrigarupini || || kasturimrigasantosha kasturimrigamadhyaga
    | kasturirasanilangi kasturigandhatoshita || || kasturipujakaprana kasturipujakapriya | kasturipremasantushta
    kasturipranadharini || || kasturipujakananda kasturigandharupini | kasturimalikarupa kasturibhojanapriya
    || || kasturitilakananda kasturitilakapriya | kasturihomasantushta kasturitarpanodyata || || kasturimarjanodyukta
    kasturicakrapujita | kasturipushpasampujya kasturicarvanodyata || || kasturigarbhamadhyastha kasturivastradharini
    | kasturikamodarata kasturivanavasini || || kasturivanasamraksha kasturipremadharini | kasturishaktinilaya
    kasturishaktikundaga || || kasturikundasamsnata kasturikundamajjana | kasturijivasantushta kasturijivadharini
    || || kasturiparamamoda kasturijivanakshama | kasturijatibhavastha kasturigandhacumbana || || kasturigandhasamshobhavirajitakapalabhuh
    | kasturimadanantahstha kasturimadaharshada || || kasturikavitanadhya kasturigrihamadhyaga | kasturisparshakaprana
    kasturinindakantaka || || kasturyamodarasika kasturikridanodyata | kasturidananirata kasturivaradayini
    || || kasturisthapanasakta kasturisthanaranjini | kasturikushalaprana kasturistutivandita || || kasturivandakaradhya
    kasturisthanavasini | kaharupa kahadhya ca kahananda kahatmabhuh || || kahapujya kahatyakhya kahaheya
    kahatmika | kahamalakanthabhusha kahamantrajapodyata || || kahanamasmritipara kahanamaparayana | kahaparayanarata
    kahadevi kaheshvari || || kahahetu kahananda kahanadaparayana | kahamata kahantahstha kahamantra kaheshvari
    || || kahageya kaharadhya kahadhyanaparayana | kahatantra kahakaha kahacaryaparayana || || kahacara
    kahagatih kahatandavakarini | kaharanya kaharatih kahashaktiparayana || || kaharajyanata karmasakshini
    karmasundari | karmavidya karmagatih karmatantraparayana || || karmamatra karmagatra karmadharmaparayana
    | karmarekhanashakartri karmarekhavinodini || || karmarekhamohakari karmakirtiparayana | karmavidya
    karmasara karmadhara ca karmabhuh || || karmakari karmahari karmakautukasundari | karmakali karmatara
    karmacchinna ca karmada || || karmacandalini karmavedamata ca karmabhuh | karmakandaratananta karmakandanumanita
    || || karmakandaparinaha kamathi kamathakritih | kamatharadhyahridaya kamathakanthasundari || || kamathasanasamsevya
    kamathi karmatatpara | karunakarakanta ca karunakaravandita || || kathorakaramala ca kathorakucadharini
    | kapardini kapatini kathina kankabhushana || || karabhoruh kathinada karabha karabhalaya | kalabhashamayi
    kalpa kalpana kalpadayini || || kamalastha kalamala kamalasya kvanatprabha | kakudmini kashtavati
    karaniyakatharcita || || kacarcita kacatanuh kacasundaradharini | kathorakucasamlagna katisutravirajita
    || || karnabhakshapriya kanda katha kandagatih kalih | kalighni kaliduti ca kavinayakapujita || ||
    kanakakshaniyantri ca kashcitkavivararcita | kartri ca kartrikabhusha karini karnashatrupa || || karaneshi
    karanapa kalavaca kalanidhih | kalana kalanadhara karika karaka kara || || kalajneya karkarashih karkarashiprapujita
    | kanyarashih kanyaka ca kanyakapriyabhashini || || kanyakadanasantushta kanyakadanatoshini | kanyadanakarananda
    kanyadanagraheshtada || || karshana kakshadahana kamita kamalasana | karamalanandakartri karamalapratoshita
    || || karamalashayananda karamalasamagama | karamalasiddhidatri karamalakarapriya || || karapriya
    kararata karadanaparayana | kalananda kaligatih kalipujya kaliprasuh || || kalanadaninadastha kalanadavaraprada
    | kalanadasamajastha kahola ca kaholada || || kaholagehamadhyastha kaholavaradayini | kaholakavitadhara
    kaholrishimanita || || kaholamanasaradhya kaholavakyakarini | kartrirupa kartrimayi kartrimata ca
    kartari || || kaniya kanakaradhya kaninakamayi tatha | kaniyanandanilaya kanakanandatoshita || ||
    kaniyakakara kashtha katharnavakari kari | karigamya karigatih karidhvajaparayana || || karinathapriya
    kantha kathanakapratoshita | kamaniya kamanaka kamaniyavibhushana || || kamaniyasamajastha kamaniyavratapriya
    | kamaniyagunaradhya kapila kapileshvari || || kapilaradhyahridaya kapilapriyavadini | kahacakramantravarna
    kahacakraprasunaka || || keilahrimsvarupa ca keilahrimvaraprada | keilahrimsiddhidatri keilahrimsvarupini
    || || keilahrimmantravarna keilahrimprasukala | kevarga kapatastha kapatodghatanakshama || || kankali
    ca kapali ca kankalapriyabhashini | kankalabhairavaradhya kankalamanasamsthita || || kankalamohanirata
    kankalamohadayini | kalushaghni kalushaha kalushartivinashini || || kalipushpa kaladana kashipuh kashyaparcita
    | kashyapa kashyaparadhya kalipurnakalevara || || kalevarakari kanci kavarga ca karalaka | karalabhairavaradhya
    karalabhairaveshvari || || karala kalanadhara kapardishavaraprada | kapardishapremalata kapardimalikayuta
    || || kapardijapamaladhya karaviraprasunada | karavirapriyaprana karaviraprapujita || || karnikarasamakara
    karnikaraprapujita | karishagnisthita karsha karshamatrasuvarnada || || kalasha kalasharadhya kashaya
    kariganada | kapila kalakanthi ca kalikalpalata mata || || kalpamata kalpalata kalpakari ca kalpabhuh
    | karpuramodarucira karpuramodadharini || || karpuramalabharana karpuravasapurtida | karpuramalajayada
    karpurarnavamadhyaga || || karpuratarpanarata katakambaradharini | kapateshvavarasampujya kapateshvararupini
    || || katuh kapidhvajaradhya kalapapushpadharini | kalapapushparucira kalapapushpapujita || || krakaca
    krakacaradhya kathambruma karalata | kathankaravinirmukta kali kalakriya kratuh || || kamini kaminipujya
    kaminipushpadharini | kaminipushpanilaya kaminipushpapurnima || || kaminipushpapujarha kaminipushpabhushana
    | kaminipushpatilaka kaminikundacumbana || || kaminiyogasantushta kaminiyogabhogada | kaminikundasammagna
    kaminikundamadhyaga || || kaminimanasaradhya kaminimanatoshita | kaminimanasancara kalika kalakalika
    || || kama ca kamadevi ca kameshi kamasambhava | kamabhava kamarata kamarta kamamanjari || || kamamanjiraranita
    kamadevapriyantara | kamakali kamakala kalika kamalarcita || || kadika kamala kali kalanalasamaprabha
    | kalpantadahana kanta kantarapriyavasini || || kalapujya kalarata kalamata ca kalini | kalavira kalaghora
    kalasiddha ca kalada || || kalanjanasamakara kalanjaranivasini | kalriddhih kalavriddhih karagrihavimocini
    || || kadividya kadimata kadistha kadisundari | kashi kanci ca kancisha kashishavaradayini || || krimbija
    caiva krim bijahridayaya namah smrita | kamya kamyagatih kamyasiddhidatri ca kamabhuh || || kamakhya
    kamarupa ca kamacapavimocini | kamadevakalarama kamadevakalalaya || || kamaratrih kamadatri kantaracalavasini
    | kamarupa kamagatih kamayogaparayana || || kamasammardanarata kamagehavikashini | kalabhairavabharya
    ca kalabhairavakamini || || kalabhairavayogastha kalabhairavabhogada | kamadhenuh kamadogdhri kamamata
    ca kantida || || kamuka kamukaradhya kamukanandavardhini | kartavirya kartikeya kartikeyaprapujita
    || || karya karanada karyakarini karanantara | kantigamya kantimayi kantya katyayani ca ka || || kamasara
    ca kashmira kashmiracaratatpara | kamarupacararata kamarupapriyamvada || || kamarupacarasiddhih kamarupamanomayi
    | kartiki kartikaradhya kancanaraprasunabhuh || || kancanaraprasunabha kancanaraprapujita | kancarupa
    kancabhumih kamsyapatraprabhojini || || kamsyadhvanimayi kamasundari kamacumbana | kashapushpapratikasha
    kamadrumasamagama || || kamapushpa kamabhumih kamapujya ca kamada | kamadeha kamageha kamabijaparayana
    || || kamadhvajasamarudha kamadhvajasamasthita | kashyapi kashyaparadhya kashyapanandadayini || ||
    kalindijalasankasha kalindijalapujita | kadevapujanirata kadevaparamarthada || || karmana karmanakara
    kamakarmanakarini | karmanatrotanakari kakini karanahvaya || || kavyamrita ca kalinga kalingamardanodyata
    | kalaguruvibhushadhya kalaguruvibhutida || || kalagurusugandha ca kalagurupratarpana | kaverinirasamprita
    kaveritiravasini || || kalacakrabhramakara kalacakranivasini | kanana kananadhara karuh karunikamayi
    || || kampilyavasini kashtha kamapatni ca kamabhuh | kadambaripanarata tatha kadambari kala || ||
    kamavandya ca kameshi kamarajaprapujita | kamarajeshvarividya kamakautukasundari || || kambojaja kanchinada
    kamsyakancanakarini | kancanadrisamakara kancanadripradanada || || kamakirtih kamakeshi karika kantarashraya
    | kamabhedi ca kamartinashini kamabhumika || || kalanirnashini kavyavanita kamarupini | kayasthakamasandiptih
    kavyada kalasundari || || kameshi karanavara kameshipujanodyata | kancinupurabhushadhya kunkumabharananvita
    || || kalacakra kalagatih kalacakramanobhava | kundamadhya kundapushpa kundapushpapriya kuja || ||
    kujamata kujaradhya kutharavaradharini | kunjarastha kusharata kusheshayavilocana || || kunati kurari
    kudra kurangi kutajashraya | kumbhinasavibhusha ca kumbhinasavadhodyata || || kumbhakarnamanollasa
    kulacudamanih kula | kulalagrihakanya ca kulacudamanipriya || || kulapujya kularadhya kulapujaparayana
    | kulabhusha tatha kukshih kurariganasevita || || kulapushpa kularata kulapushpaparayana | kulavastra
    kularadhya kulakundasamaprabha || || kulakundasamollasa kundapushpaparayana | kundapushpaprasannasya
    kundagolodbhavatmika || || kundagolodbhavadhara kundagolamayi kuhuh | kundagolapriyaprana kundagolaprapujita
    || || kundagolamanollasa kundagolabalaprada | kundadevarata kruddha kulasiddhikara para || || kulakundasamakara
    kulakundasamanabhuh | kundasiddhih kundriddhih kumaripujanodyata || || kumaripujakaprana kumaripujakalaya
    | kumarikamasantushta kumaripujanotsuka || || kumarivratasantushta kumarirupadharini | kumaribhojanaprita
    kumari ca kumarada || || kumaramata kulada kulayonih kuleshvari | kulalinga kulananda kularamya kutarkadhrik
    || || kunti ca kulakanta ca kulamargaparayana | kulla ca kurukulla ca kulluka kulakamada || || kulishangi
    kubjika ca kubjikanandavardhini | kulina kunjaragatih kunjareshvaragamini || || kulapali kulavati
    tathaiva kuladipika | kulayogeshvari kunda kunkumarunavigraha || || kunkumanandasantosha kunkumarnavavasini
    | kunkumakusumaprita kulabhuh kulasundari || || kumudvati kumudini kushala kulatalaya | kulatalayamadhyastha
    kulatasangatoshita || || kulatabhavanodyukta kushavarta kularnava | kularnavacararata kundali kundalakritih
    || || kumatishca kulashreshtha kulacakraparayana | kutastha kutadrishtishca kuntala kuntalakritih
    || || kushalakritirupa ca kurcabijadhara ca kuh | kum kum kum kum shabdarata krum krum krum krum parayana
    || || kum kum kum shabdanilaya kukkuralayavasini | kukkurasangasamyukta kukkuranantavigraha || ||
    kurcarambha kurcabija kurcajapaparayana | kulini kulasamsthana kurcakanthaparagatih || || kurcavinabhaladesha
    kurcamastakabhushita | kulavrikshagata kurma kurmacalanivasini || || kulabinduh kulashiva kulashaktiparayana
    | kulabindumaniprakhya kunkumadrumavasini || || kucamardanasantushta kucajapaparayana | kucasparshanasantushta
    kucalinganaharshada || || kumatighni kuberarcya kucabhuh kulanayika | kugayana kucadhara kumata kundadantini
    || || kugeya kuharabhasa kugeyakughnadarika | kirtih kiratini klinna kinnara kinnarikriya || || krinkara
    krinjapasakta krim hum strim mantrarupini | kirmiritadrishapangi kishori ca kiritini || || kitabhasha
    kitayonih kitamata ca kitada | kimshuka kirabhasha ca kriyasara kriyavati || || kinkimshabdapara klam
    klim klum klaim klaum mantrarupini | kam kim kum kaim svarupa ca kah phat mantrasvarupini || || ketakibhushanananda
    ketakibharananvita | kaikada keshini keshi keshisudanatatpara || || kesharupa keshamukta kaikeyi kaushiki
    tatha | kairava kairavahlada keshara keturupini || || keshavaradhyahridaya keshavasaktamanasa | klaibyavinashini
    klaim ca klaim bijajapatoshita || || kaushalya koshalakshi ca kosha ca komala tatha | kolapuranivasa
    ca kolasuravinashini || || kotirupa kotirata krodhini krodharupini | keka ca kokila kotih kotimantraparayana
    || || kotyanantamantrayukta kairupa keralashraya | keralacaranipuna keralendragrihasthita || || kedarashramasamstha
    ca kedareshvarapujita | krodharupa krodhapada krodhamata ca kaushiki || || kodandadharini kraunca
    kaushalya kaulamargaga | kaulini kaulikaradhya kaulikagaravasini || || kautuki kaumudi kaula kaumari
    kauravarcita | kaundinya kaushiki krodhajvalabhasurarupini || || kotikalanalajvala kotimartandavigraha
    | krittika krishnavarna ca krishna kritya kriyatura || || krishangi kritakritya ca krah phat svaha
    svarupini | kraum kraum hum phat mantravarna krim hrim hum phat namah svadha || || krim krim hrim
    hrim tatha hrum hrum phat svaha mantrarupini | iti shrisarvasamrajyamedhanama sahasrakam || || iti
    shrirudrayamale kalitantre kakaradi shri kali sahasranama stotram |
  devanagari: अस्य श्रीसर्वसाम्राज्य मेधाकालीस्वरूप ककारात्मक सहस्रनामस्तोत्र मन्त्रस्य महाकाल ऋषिः अनुष्टुप्
    छन्दः श्रीदक्षिण महाकाली देवता ह्रीं बीजं हूं शक्तिः क्रीं कीलकं कालीवरदानाद्यखिलेष्टार्थे पाठे विनियोगः
    । ऋष्यादिन्यासः ॐ महाकाल ऋषये नमः शिरसि । अनुष्टुप् छन्दसे नमः मुखे । श्री दक्षिण महाकाली देवतायै
    नमः हृदये । ह्रीं बीजाय नमः गुह्ये । हूं शक्तये नमः पादयोः । क्रीं कीलकाय नमो नाभौ । विनियोगाय नमः
    सर्वाङ्गे । करन्यासः ॐ क्रां अङ्गुष्ठाभ्यां नमः । ॐ क्रीं तर्जनीभ्यां नमः । ॐ क्रूं मध्यमाभ्यां नमः
    । ॐ क्रैं अनामिकाभ्यां नमः । ॐ क्रौं कनिष्ठिकाभ्यां नमः । ॐ क्रः करतलकरपृष्ठाभ्यां नमः । हृदयादि न्यासः
    ॐ क्रां हृदयाय नमः । ॐ क्रीं शिरसे स्वाहा । ॐ क्रूं शिखायै वषट् । ॐ क्रैं कवचाय हुम् । ॐ क्रौं नेत्रत्रयाय
    वौषट् । ॐ क्रः अस्त्राय फट् । अथ ध्यानम् । करालवदनां घोरां मुक्तकेशीं चतुर्भुजाम् । कालिकां दक्षिणां
    दिव्यां मुण्डमालाविभूषिताम् ॥ ॥ सद्यश्छिन्नशिरः खड्गवामोर्ध्वाधः कराम्बुजाम् । अभयं वरदं चैव दक्षिणाधोर्ध्वपाणिकाम्
    ॥ ॥ महामेघप्रभां श्यामां तथा चैव दिगम्बराम् । कण्ठावसक्तमुण्डालीगलद्रुधिरचर्चिताम् ॥ ॥ कर्णावतंसतानीत
    शवयुग्मभयानकाम् । घोरदंष्ट्राकरालास्यां पीनोन्नतपयोधराम् ॥ ॥ शवानां करसङ्घातैः कृतकाञ्चीं हसन्मुखीम्
    । सृक्काद्वयगलद्रक्तधाराविस्फुरिताननाम् ॥ ॥ घोररूपां महारौद्रीं श्मशानालयवासिनीम् । दन्तुरां दक्षिणव्यापिमुक्तलम्बकचोच्चयाम्
    ॥ ॥ शवरूपमहादेवहृदयोपरि संस्थिताम् । शिवाभिर्घोररूपाभिश्चतुर्दिक्षु समन्विताम् ॥ ॥ महाकालेन सार्धोर्धमुपविष्टरतातुराम्
    । सुखप्रसन्नवदनां स्मेराननसरोरुहाम् । एवं सञ्चिन्तयेद्देवीं श्मशानालयवासिनीम् ॥ ॥ अथ स्तोत्रम् । ॐ
    क्रीं काली क्रूं कराली च कल्याणी कमला कला । कलावती कलाढ्या च कलापूज्या कलात्मिका ॥ ॥ कलादृष्टा कलापुष्टा
    कलामस्ता कलाकरा । कलाकोटिसमाभासा कलाकोटिप्रपूजिता ॥ ॥ कलाकर्म कलाधारा कलापारा कलागमा । कलाधारा कमलिनी
    ककारा करुणा कविः ॥ ॥ ककारवर्णसर्वाङ्गी कलाकोटिप्रभूषिता । ककारकोटिगुणिता ककारकोटिभूषणा ॥ ॥ ककारवर्णहृदया
    ककारमनुमण्डिता । ककारवर्णनिलया ककशब्दपरायणा ॥ ॥ ककारवर्णमुकुटा ककारवर्णभूषणा । ककारवर्णरूपा च काकशब्दपरायणा
    ॥ ॥ कवीरास्फालनरता कमलाकरपूजिता । कमलाकरनाथा च कमलाकररूपधृक् ॥ ॥ कमलाकरसिद्धिस्था कमलाकरपारदा । कमलाकरमध्यस्था
    कमलाकरतोषिता ॥ ॥ कथङ्कारपरालापा कथङ्कारपरायणा । कथङ्कारपदान्तस्था कथङ्कारपदार्थभूः ॥ ॥ कमलाक्षी कमलजा
    कमलाक्षप्रपूजिता । कमलाक्षवरोद्युक्ता ककारा कर्बुराक्षरा ॥ ॥ करतारा करच्छिन्ना करश्यामा करार्णवा ।
    करपूज्या कररता करदा करपूजिता ॥ ॥ करतोया करामर्षा कर्मनाशा करप्रिया । करप्राणा करकजा करका करकान्तरा
    ॥ ॥ करकाचलरूपा च करकाचलशोभिनी । करकाचलपुत्री च करकाचलतोषिता ॥ ॥ करकाचलगेहस्था करकाचलरक्षिणी । करकाचलसम्मान्या
    करकाचलकारिणी ॥ ॥ करकाचलवर्षाढ्या करकाचलरञ्जिता । करकाचलकान्तारा करकाचलमालिनी ॥ ॥ करकाचलभोज्या च करकाचलरूपिणी
    । करामलकसंस्था च करामलकसिद्धिदा ॥ ॥ करामलकसम्पूज्या करामलकतारिणी । करामलककाली च करामलकरोचिनी ॥ ॥ करामलकमाता
    च करामलकसेविनी । करामलकबद्ध्येया करामलकदायिनी ॥ ॥ कञ्जनेत्रा कञ्जगतिः कञ्जस्था कञ्जधारिणी । कञ्जमालाप्रियकरी
    कञ्जरूपा च कञ्जजा ॥ ॥ कञ्जजातिः कञ्जगतिः कञ्जहोमपरायणा । कञ्जमण्डलमध्यस्था कञ्जाभरणभूषिता ॥ ॥ कञ्जसम्माननिरता
    कञ्जोत्पत्तिपरायणा । कञ्जराशिसमाकारा कञ्जारण्यनिवासिनी ॥ ॥ करञ्जवृक्षमध्यस्था करञ्जवृक्षवासिनी । करञ्जफलभूषाढ्या
    करञ्जवनवासिनी ॥ ॥ करञ्जमालाभरणा करवालपरायणा । करवालप्रहृष्टात्मा करवालप्रियागतिः ॥ ॥ करवालप्रियाकन्था
    करवालविहारिणी । करवालमयी कर्मा करवालप्रियङ्करी ॥ ॥ कबन्धमालाभरणा कबन्धराशिमध्यगा । कबन्धकूटसंस्थाना
    कबन्धानन्तभूषणा ॥ ॥ कबन्धनादसन्तुष्टा कबन्धासनधारिणी । कबन्धगृहमध्यस्था कबन्धवनवासिनी ॥ ॥ कबन्धकाञ्चीकरणी
    कबन्धराशिभूषणा । कबन्धमालाजयदा कबन्धदेहवासिनी ॥ ॥ कबन्धासनमान्या च कपालमाल्यधारिणी । कपालमालामध्यस्था
    कपालव्रततोषिता ॥ ॥ कपालदीपसन्तुष्टा कपालदीपरूपिणी । कपालदीपवरदा कपालकज्जलस्थिता ॥ ॥ कपालमालाजयदा कपालजपतोषिणी
    । कपालसिद्धिसंहृष्टा कपालभोजनोद्यता ॥ ॥ कपालव्रतसंस्थाना कपालकमलालया । कवित्वामृतसारा च कवित्वामृतसागरा
    ॥ ॥ कवित्वसिद्धिसंहृष्टा कवित्वादानकारिणी । कविपूज्या कविगतिः कविरूपा कविप्रिया ॥ ॥ कविब्रह्मानन्दरूपा
    कवित्वव्रततोषिता । कविमानससंस्थाना कविवाञ्छाप्रपूरणी ॥ ॥ कविकण्ठस्थिता कं ह्रीं कङ्कङ्कं कविपूर्तिदा
    । कज्जला कज्जलादानमानसा कज्जलप्रिया ॥ ॥ कपालकज्जलसमा कज्जलेशप्रपूजिता । कज्जलार्णवमध्यस्था कज्जलानन्दरूपिणी
    ॥ ॥ कज्जलप्रियसन्तुष्टा कज्जलप्रियतोषिणी । कपालमालाभरणा कपालकरभूषणा ॥ ॥ कपालकरभूषाढ्या कपालचक्रमण्डिता
    । कपालकोटिनिलया कपालदुर्गकारिणी ॥ ॥ कपालगिरिसंस्थाना कपालचक्रवासिनी । कपालपात्रसन्तुष्टा कपालार्घ्यपरायणा
    ॥ ॥ कपालार्घ्यप्रियप्राणा कपालार्घ्यवरप्रदा । कपालचक्ररूपा च कपालरूपमात्रगा ॥ ॥ कदली कदलीरूपा कदलीवनवासिनी
    । कदलीपुष्पसम्प्रीता कदलीफलमानसा ॥ ॥ कदलीहोमसन्तुष्टा कदलीदर्शनोद्यता । कदलीगर्भमध्यस्था कदलीवनसुन्दरी
    ॥ ॥ कदम्बपुष्पनिलया कदम्बवनमध्यगा । कदम्बकुसुमामोदा कदम्बवनतोषिणी ॥ ॥ कदम्बपुष्पसम्पूज्या कदम्बपुष्पहोमदा
    । कदम्बपुष्पमध्यस्था कदम्बफलभोजिनी ॥ ॥ कदम्बकाननान्तःस्था कदम्बाचलवासिनी । कक्षपा कक्षपाराध्या कक्षपासनसंस्थिता
    ॥ ॥ कर्णपूरा कर्णनासा कर्णाढ्या कालभैरवी । कलप्रीता कलहदा कलहा कलहातुरा ॥ ॥ कर्णयक्षी कर्णवार्ता कथिनी
    कर्णसुन्दरी । कर्णपिशाचिनी कर्णमञ्जरी कविकक्षदा ॥ ॥ कविकक्षविरूपाढ्या कविकक्षस्वरूपिणी । कस्तूरीमृगसंस्थाना
    कस्तूरीमृगरूपिणी ॥ ॥ कस्तूरीमृगसन्तोषा कस्तूरीमृगमध्यगा । कस्तूरीरसनीलाङ्गी कस्तूरीगन्धतोषिता ॥ ॥
    कस्तूरीपूजकप्राणा कस्तूरीपूजकप्रिया । कस्तूरीप्रेमसन्तुष्टा कस्तूरीप्राणधारिणी ॥ ॥ कस्तूरीपूजकानन्दा
    कस्तूरीगन्धरूपिणी । कस्तूरीमालिकारूपा कस्तूरीभोजनप्रिया ॥ ॥ कस्तूरीतिलकानन्दा कस्तूरीतिलकप्रिया ।
    कस्तूरीहोमसन्तुष्टा कस्तूरीतर्पणोद्यता ॥ ॥ कस्तूरीमार्जनोद्युक्ता कस्तूरीचक्रपूजिता । कस्तूरीपुष्पसम्पूज्या
    कस्तूरीचर्वणोद्यता ॥ ॥ कस्तूरीगर्भमध्यस्था कस्तूरीवस्त्रधारिणी । कस्तूरिकामोदरता कस्तूरीवनवासिनी ॥
    ॥ कस्तूरीवनसंरक्षा कस्तूरीप्रेमधारिणी । कस्तूरीशक्तिनिलया कस्तूरीशक्तिकुण्डगा ॥ ॥ कस्तूरीकुण्डसंस्नाता
    कस्तूरीकुण्डमज्जना । कस्तूरीजीवसन्तुष्टा कस्तूरीजीवधारिणी ॥ ॥ कस्तूरीपरमामोदा कस्तूरीजीवनक्षमा । कस्तूरीजातिभावस्था
    कस्तूरीगन्धचुम्बना ॥ ॥ कस्तूरीगन्धसंशोभाविराजितकपालभूः । कस्तूरीमदनान्तःस्था कस्तूरीमदहर्षदा ॥ ॥ कस्तूरीकवितानाढ्या
    कस्तूरीगृहमध्यगा । कस्तूरीस्पर्शकप्राणा कस्तूरीनिन्दकान्तका ॥ ॥ कस्तूर्यामोदरसिका कस्तूरीक्रीडनोद्यता
    । कस्तूरीदाननिरता कस्तूरीवरदायिनी ॥ ॥ कस्तूरीस्थापनासक्ता कस्तूरीस्थानरञ्जिनी । कस्तूरीकुशलप्राणा
    कस्तूरीस्तुतिवन्दिता ॥ ॥ कस्तूरीवन्दकाराध्या कस्तूरीस्थानवासिनी । कहरूपा कहाढ्या च कहानन्दा कहात्मभूः
    ॥ ॥ कहपूज्या कहात्याख्या कहहेया कहात्मिका । कहमालाकण्ठभूषा कहमन्त्रजपोद्यता ॥ ॥ कहनामस्मृतिपरा कहनामपरायणा
    । कहपारायणरता कहदेवी कहेश्वरी ॥ ॥ कहहेतु कहानन्दा कहनादपरायणा । कहमाता कहान्तःस्था कहमन्त्रा कहेश्वरी
    ॥ ॥ कहगेया कहाराध्या कहध्यानपरायणा । कहतन्त्रा कहकहा कहचर्यापरायणा ॥ ॥ कहाचारा कहगतिः कहताण्डवकारिणी
    । कहारण्या कहरतिः कहशक्तिपरायणा ॥ ॥ कहराज्यनता कर्मसाक्षिणी कर्मसुन्दरी । कर्मविद्या कर्मगतिः कर्मतन्त्रपरायणा
    ॥ ॥ कर्ममात्रा कर्मगात्रा कर्मधर्मपरायणा । कर्मरेखानाशकर्त्री कर्मरेखाविनोदिनी ॥ ॥ कर्मरेखामोहकरी
    कर्मकीर्तिपरायणा । कर्मविद्या कर्मसारा कर्माधारा च कर्मभूः ॥ ॥ कर्मकारी कर्महारी कर्मकौतुकसुन्दरी
    । कर्मकाली कर्मतारा कर्मच्छिन्ना च कर्मदा ॥ ॥ कर्मचाण्डालिनी कर्मवेदमाता च कर्मभूः । कर्मकाण्डरतानन्ता
    कर्मकाण्डानुमानिता ॥ ॥ कर्मकाण्डपरीणाहा कमठी कमठाकृतिः । कमठाराध्यहृदया कमठाकण्ठसुन्दरी ॥ ॥ कमठासनसंसेव्या
    कमठी कर्मतत्परा । करुणाकरकान्ता च करुणाकरवन्दिता ॥ ॥ कठोरकरमाला च कठोरकुचधारिणी । कपर्दिनी कपटिनी
    कठिना कङ्कभूषणा ॥ ॥ करभोरूः कठिनदा करभा करभालया । कलभाषामयी कल्पा कल्पना कल्पदायिनी ॥ ॥ कमलस्था कलामाला
    कमलास्या क्वणत्प्रभा । ककुद्मिनी कष्टवती करणीयकथार्चिता ॥ ॥ कचार्चिता कचतनुः कचसुन्दरधारिणी । कठोरकुचसंलग्ना
    कटिसूत्रविराजिता ॥ ॥ कर्णभक्षप्रिया कन्दा कथा कन्दगतिः कलिः । कलिघ्नी कलिदूती च कविनायकपूजिता ॥ ॥
    कणकक्षानियन्त्री च कश्चित्कविवरार्चिता । कर्त्री च कर्तृकाभूषा कारिणी कर्णशत्रुपा ॥ ॥ करणेशी करणपा
    कलवाचा कलानिधिः । कलना कलनाधारा कारिका करका करा ॥ ॥ कलज्ञेया कर्कराशिः कर्कराशिप्रपूजिता । कन्याराशिः
    कन्यका च कन्यकाप्रियभाषिणी ॥ ॥ कन्यकादानसन्तुष्टा कन्यकादानतोषिणी । कन्यादानकरानन्दा कन्यादानग्रहेष्टदा
    ॥ ॥ कर्षणा कक्षदहना कामिता कमलासना । करमालानन्दकर्त्री करमालाप्रतोषिता ॥ ॥ करमालाशयानन्दा करमालासमागमा
    । करमालासिद्धिदात्री करमालाकरप्रिया ॥ ॥ करप्रिया कररता करदानपरायणा । कलानन्दा कलिगतिः कलिपूज्या कलिप्रसूः
    ॥ ॥ कलनादनिनादस्था कलनादवरप्रदा । कलनादसमाजस्था कहोला च कहोलदा ॥ ॥ कहोलगेहमध्यस्था कहोलवरदायिनी ।
    कहोलकविताधारा कहोलृषिमानिता ॥ ॥ कहोलमानसाराध्या कहोलवाक्यकारिणी । कर्तृरूपा कर्तृमयी कर्तृमाता च कर्तरी
    ॥ ॥ कनीया कनकाराध्या कनीनकमयी तथा । कनीयानन्दनिलया कनकानन्दतोषिता ॥ ॥ कनीयककरा काष्ठा कथार्णवकरी करी
    । करिगम्या करिगतिः करिध्वजपरायणा ॥ ॥ करिनाथप्रिया कण्ठा कथानकप्रतोषिता । कमनीया कमनका कमनीयविभूषणा
    ॥ ॥ कमनीयसमाजस्था कमनीयव्रतप्रिया । कमनीयगुणाराध्या कपिला कपिलेश्वरी ॥ ॥ कपिलाराध्यहृदया कपिलाप्रियवादिनी
    । कहचक्रमन्त्रवर्णा कहचक्रप्रसूनका ॥ ॥ केईलह्रींस्वरूपा च केईलह्रींवरप्रदा । केईलह्रींसिद्धिदात्री
    केईलह्रींस्वरूपिणी ॥ ॥ केईलह्रीम्मन्त्रवर्णा केईलह्रीम्प्रसूकला । केवर्गा कपाटस्था कपाटोद्घाटनक्षमा
    ॥ ॥ कङ्काली च कपाली च कङ्कालप्रियभाषिणी । कङ्कालभैरवाराध्या कङ्कालमानसंस्थिता ॥ ॥ कङ्कालमोहनिरता कङ्कालमोहदायिनी
    । कलुषघ्नी कलुषहा कलुषार्तिविनाशिनी ॥ ॥ कलिपुष्पा कलादाना कशिपुः कश्यपार्चिता । कश्यपा कश्यपाराध्या
    कलिपूर्णकलेवरा ॥ ॥ कलेवरकरी काञ्ची कवर्गा च करालका । करालभैरवाराध्या करालभैरवेश्वरी ॥ ॥ कराला कलनाधारा
    कपर्दीशवरप्रदा । कपर्दीशप्रेमलता कपर्दिमालिकायुता ॥ ॥ कपर्दिजपमालाढ्या करवीरप्रसूनदा । करवीरप्रियप्राणा
    करवीरप्रपूजिता ॥ ॥ कर्णिकारसमाकारा कर्णिकारप्रपूजिता । करीषाग्निस्थिता कर्षा कर्षमात्रसुवर्णदा ॥ ॥
    कलशा कलशाराध्या कषाया करिगानदा । कपिला कलकण्ठी च कलिकल्पलता मता ॥ ॥ कल्पमाता कल्पलता कल्पकारी च कल्पभूः
    । कर्पूरामोदरुचिरा कर्पूरामोदधारिणी ॥ ॥ कर्पूरमालाभरणा कर्पूरवासपूर्तिदा । कर्पूरमालाजयदा कर्पूरार्णवमध्यगा
    ॥ ॥ कर्पूरतर्पणरता कटकाम्बरधारिणी । कपटेश्ववरसम्पूज्या कपटेश्वररूपिणी ॥ ॥ कटुः कपिध्वजाराध्या कलापपुष्पधारिणी
    । कलापपुष्परुचिरा कलापपुष्पपूजिता ॥ ॥ क्रकचा क्रकचाराध्या कथम्ब्रूमा करालता । कथङ्कारविनिर्मुक्ता
    काली कालक्रिया क्रतुः ॥ ॥ कामिनी कामिनीपूज्या कामिनीपुष्पधारिणी । कामिनीपुष्पनिलया कामिनीपुष्पपूर्णिमा
    ॥ ॥ कामिनीपुष्पपूजार्हा कामिनीपुष्पभूषणा । कामिनीपुष्पतिलका कामिनीकुण्डचुम्बना ॥ ॥ कामिनीयोगसन्तुष्टा
    कामिनीयोगभोगदा । कामिनीकुण्डसम्मग्ना कामिनीकुण्डमध्यगा ॥ ॥ कामिनीमानसाराध्या कामिनीमानतोषिता । कामिनीमानसञ्चारा
    कालिका कालकालिका ॥ ॥ कामा च कामदेवी च कामेशी कामसम्भवा । कामभावा कामरता कामार्ता काममञ्जरी ॥ ॥ काममञ्जीररणिता
    कामदेवप्रियान्तरा । कामकाली कामकला कालिका कमलार्चिता ॥ ॥ कादिका कमला काली कालानलसमप्रभा । कल्पान्तदहना
    कान्ता कान्तारप्रियवासिनी ॥ ॥ कालपूज्या कालरता कालमाता च कालिनी । कालवीरा कालघोरा कालसिद्धा च कालदा
    ॥ ॥ कालाञ्जनसमाकारा कालञ्जरनिवासिनी । कालृद्धिः कालवृद्धिः कारागृहविमोचिनी ॥ ॥ कादिविद्या कादिमाता
    कादिस्था कादिसुन्दरी । काशी काञ्ची च काञ्चीशा काशीशवरदायिनी ॥ ॥ क्रीम्बीजा चैव क्रीं बीजहृदयाय नमः
    स्मृता । काम्या काम्यगतिः काम्यसिद्धिदात्री च कामभूः ॥ ॥ कामाख्या कामरूपा च कामचापविमोचिनी । कामदेवकलारामा
    कामदेवकलालया ॥ ॥ कामरात्रिः कामदात्री कान्ताराचलवासिनी । कामरूपा कामगतिः कामयोगपरायणा ॥ ॥ कामसम्मर्दनरता
    कामगेहविकाशिनी । कालभैरवभार्या च कालभैरवकामिनी ॥ ॥ कालभैरवयोगस्था कालभैरवभोगदा । कामधेनुः कामदोग्ध्री
    काममाता च कान्तिदा ॥ ॥ कामुका कामुकाराध्या कामुकानन्दवर्धिनी । कार्तवीर्या कार्तिकेया कार्तिकेयप्रपूजिता
    ॥ ॥ कार्या कारणदा कार्यकारिणी कारणान्तरा । कान्तिगम्या कान्तिमयी कान्त्या कात्यायनी च का ॥ ॥ कामसारा
    च काश्मीरा काश्मीराचारतत्परा । कामरूपाचाररता कामरूपप्रियंवदा ॥ ॥ कामरूपाचारसिद्धिः कामरूपमनोमयी ।
    कार्तिकी कार्तिकाराध्या काञ्चनारप्रसूनभूः ॥ ॥ काञ्चनारप्रसूनाभा काञ्चनारप्रपूजिता । काञ्चरूपा काञ्चभूमिः
    कांस्यपात्रप्रभोजिनी ॥ ॥ कांस्यध्वनिमयी कामसुन्दरी कामचुम्बना । काशपुष्पप्रतीकाशा कामद्रुमसमागमा ॥
    ॥ कामपुष्पा कामभूमिः कामपूज्या च कामदा । कामदेहा कामगेहा कामबीजपरायणा ॥ ॥ कामध्वजसमारूढा कामध्वजसमास्थिता
    । काश्यपी काश्यपाराध्या काश्यपानन्ददायिनी ॥ ॥ कालिन्दीजलसङ्काशा कालिन्दीजलपूजिता । कादेवपूजानिरता
    कादेवपरमार्थदा ॥ ॥ कर्मणा कर्मणाकारा कामकर्मणकारिणी । कार्मणत्रोटनकरी काकिनी कारणाह्वया ॥ ॥ काव्यामृता
    च कालिङ्गा कालिङ्गमर्दनोद्यता । कालागुरुविभूषाढ्या कालागुरुविभूतिदा ॥ ॥ कालागुरुसुगन्धा च कालागुरुप्रतर्पणा
    । कावेरीनीरसम्प्रीता कावेरीतीरवासिनी ॥ ॥ कालचक्रभ्रमाकारा कालचक्रनिवासिनी । कानना काननाधारा कारुः
    कारुणिकामयी ॥ ॥ काम्पिल्यवासिनी काष्ठा कामपत्नी च कामभूः । कादम्बरीपानरता तथा कादम्बरी कला ॥ ॥ कामवन्द्या
    च कामेशी कामराजप्रपूजिता । कामराजेश्वरीविद्या कामकौतुकसुन्दरी ॥ ॥ काम्बोजजा काञ्छिनदा कांस्यकाञ्चनकारिणी
    । काञ्चनाद्रिसमाकारा काञ्चनाद्रिप्रदानदा ॥ ॥ कामकीर्तिः कामकेशी कारिका कान्तराश्रया । कामभेदी च कामार्तिनाशिनी
    कामभूमिका ॥ ॥ कालनिर्णाशिनी काव्यवनिता कामरूपिणी । कायस्थाकामसन्दीप्तिः काव्यदा कालसुन्दरी ॥ ॥ कामेशी
    कारणवरा कामेशीपूजनोद्यता । काञ्चीनूपुरभूषाढ्या कुङ्कुमाभरणान्विता ॥ ॥ कालचक्रा कालगतिः कालचक्रमनोभवा
    । कुन्दमध्या कुन्दपुष्पा कुन्दपुष्पप्रिया कुजा ॥ ॥ कुजमाता कुजाराध्या कुठारवरधारिणी । कुञ्जरस्था कुशरता
    कुशेशयविलोचना ॥ ॥ कुनटी कुररी कुद्रा कुरङ्गी कुटजाश्रया । कुम्भीनसविभूषा च कुम्भीनसवधोद्यता ॥ ॥ कुम्भकर्णमनोल्लासा
    कुलचूडामणिः कुला । कुलालगृहकन्या च कुलचूडामणिप्रिया ॥ ॥ कुलपूज्या कुलाराध्या कुलपूजापरायणा । कुलभूषा
    तथा कुक्षिः कुररीगणसेविता ॥ ॥ कुलपुष्पा कुलरता कुलपुष्पपरायणा । कुलवस्त्रा कुलाराध्या कुलकुण्डसमप्रभा
    ॥ ॥ कुलकुण्डसमोल्लासा कुण्डपुष्पपरायणा । कुण्डपुष्पप्रसन्नास्या कुण्डगोलोद्भवात्मिका ॥ ॥ कुण्डगोलोद्भवाधारा
    कुण्डगोलमयी कुहूः । कुण्डगोलप्रियप्राणा कुण्डगोलप्रपूजिता ॥ ॥ कुण्डगोलमनोल्लासा कुण्डगोलबलप्रदा ।
    कुण्डदेवरता क्रुद्धा कुलसिद्धिकरा परा ॥ ॥ कुलकुण्डसमाकारा कुलकुण्डसमानभूः । कुण्डसिद्धिः कुण्डृद्धिः
    कुमारीपूजनोद्यता ॥ ॥ कुमारीपूजकप्राणा कुमारीपूजकालया । कुमारीकामसन्तुष्टा कुमारीपूजनोत्सुका ॥ ॥ कुमारीव्रतसन्तुष्टा
    कुमारीरूपधारिणी । कुमारीभोजनप्रीता कुमारी च कुमारदा ॥ ॥ कुमारमाता कुलदा कुलयोनिः कुलेश्वरी । कुललिङ्गा
    कुलानन्दा कुलरम्या कुतर्कधृक् ॥ ॥ कुन्ती च कुलकान्ता च कुलमार्गपरायणा । कुल्ला च कुरुकुल्ला च कुल्लुका
    कुलकामदा ॥ ॥ कुलिशाङ्गी कुब्जिका च कुब्जिकानन्दवर्धिनी । कुलीना कुञ्जरगतिः कुञ्जरेश्वरगामिनी ॥ ॥ कुलपाली
    कुलवती तथैव कुलदीपिका । कुलयोगेश्वरी कुण्डा कुङ्कुमारुणविग्रहा ॥ ॥ कुङ्कुमानन्दसन्तोषा कुङ्कुमार्णववासिनी
    । कुङ्कुमाकुसुमप्रीता कुलभूः कुलसुन्दरी ॥ ॥ कुमुद्वती कुमुदिनी कुशला कुलटालया । कुलटालयमध्यस्था कुलटासङ्गतोषिता
    ॥ ॥ कुलटाभवनोद्युक्ता कुशावर्ता कुलार्णवा । कुलार्णवाचाररता कुण्डली कुण्डलाकृतिः ॥ ॥ कुमतिश्च कुलश्रेष्ठा
    कुलचक्रपरायणा । कूटस्था कूटदृष्टिश्च कुन्तला कुन्तलाकृतिः ॥ ॥ कुशलाकृतिरूपा च कूर्चबीजधरा च कूः ।
    कुं कुं कुं कुं शब्दरता क्रुं क्रुं क्रुं क्रुं परायणा ॥ ॥ कुं कुं कुं शब्दनिलया कुक्कुरालयवासिनी
    । कुक्कुरासङ्गसंयुक्ता कुक्कुरानन्तविग्रहा ॥ ॥ कूर्चारम्भा कूर्चबीजा कूर्चजापपरायणा । कुलिनी कुलसंस्थाना
    कूर्चकण्ठपरागतिः ॥ ॥ कूर्चवीणाभालदेशा कूर्चमस्तकभूषिता । कुलवृक्षगता कूर्मा कूर्माचलनिवासिनी ॥ ॥ कुलबिन्दुः
    कुलशिवा कुलशक्तिपरायणा । कुलबिन्दुमणिप्रख्या कुङ्कुमद्रुमवासिनी ॥ ॥ कुचमर्दनसन्तुष्टा कुचजापपरायणा
    । कुचस्पर्शनसन्तुष्टा कुचालिङ्गनहर्षदा ॥ ॥ कुमतिघ्नी कुबेरार्च्या कुचभूः कुलनायिका । कुगायना कुचधरा
    कुमाता कुन्ददन्तिनी ॥ ॥ कुगेया कुहराभासा कुगेयाकुघ्नदारिका । कीर्तिः किरातिनी क्लिन्ना किन्नरा किन्नरीक्रिया
    ॥ ॥ क्रीङ्कारा क्रीञ्जपासक्ता क्रीं हूं स्त्रीं मन्त्ररूपिणी । किर्मीरितदृशापाङ्गी किशोरी च किरीटिनी
    ॥ ॥ कीटभाषा कीटयोनिः कीटमाता च कीटदा । किंशुका कीरभाषा च क्रियासारा क्रियावती ॥ ॥ कीङ्कींशब्दपरा क्लां
    क्लीं क्लूं क्लैं क्लौं मन्त्ररूपिणी । कां कीं कूं कैं स्वरूपा च कः फट् मन्त्रस्वरूपिणी ॥ ॥ केतकीभूषणानन्दा
    केतकीभरणान्विता । कैकदा केशिनी केशी केशिसूदनतत्परा ॥ ॥ केशरूपा केशमुक्ता कैकेयी कौशिकी तथा । कैरवा
    कैरवाह्लादा केशरा केतुरूपिणी ॥ ॥ केशवाराध्यहृदया केशवासक्तमानसा । क्लैब्यविनाशिनी क्लैं च क्लैं बीजजपतोषिता
    ॥ ॥ कौशल्या कोशलाक्षी च कोशा च कोमला तथा । कोलापुरनिवासा च कोलासुरविनाशिनी ॥ ॥ कोटिरूपा कोटिरता क्रोधिनी
    क्रोधरूपिणी । केका च कोकिला कोटिः कोटिमन्त्रपरायणा ॥ ॥ कोट्यनन्तमन्त्रयुक्ता कैरूपा केरलाश्रया । केरलाचारनिपुणा
    केरलेन्द्रगृहस्थिता ॥ ॥ केदाराश्रमसंस्था च केदारेश्वरपूजिता । क्रोधरूपा क्रोधपदा क्रोधमाता च कौशिकी
    ॥ ॥ कोदण्डधारिणी क्रौञ्चा कौशल्या कौलमार्गगा । कौलिनी कौलिकाराध्या कौलिकागारवासिनी ॥ ॥ कौतुकी कौमुदी
    कौला कौमारी कौरवार्चिता । कौण्डिन्या कौशिकी क्रोधज्वालाभासुररूपिणी ॥ ॥ कोटिकालानलज्वाला कोटिमार्तण्डविग्रहा
    । कृत्तिका कृष्णवर्णा च कृष्णा कृत्या क्रियातुरा ॥ ॥ कृशाङ्गी कृतकृत्या च क्रः फट् स्वाहा स्वरूपिणी
    । क्रौं क्रौं हूं फट् मन्त्रवर्णा क्रीं ह्रीं हूं फट् नमः स्वधा ॥ ॥ क्रीं क्रीं ह्रीं ह्रीं तथा ह्रूं
    ह्रूं फट् स्वाहा मन्त्ररूपिणी । इति श्रीसर्वसाम्राज्यमेधानाम सहस्रकम् ॥ ॥ इति श्रीरुद्रयामले कालीतन्त्रे
    ककारादि श्री काली सहस्रनाम स्तोत्रम् ।
