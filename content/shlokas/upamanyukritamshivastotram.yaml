id: upamanyukritamshivastotram
category: stotram
name:
  english: upamanyukritamshivastotram
  devanagari: उपमन्युकृतंशिवस्तोत्रं
content:
  english: upamanyukritam shivastotram jaya shankara parvatipate mrida shambho shashikhandamandana | madanantaka
    bhaktavatsala priyakailasa dayasudhambudhe || 19|| sadupayakathasvapandito hridaye duhkhasharena khanditah
    | shashikhandashikhandamandanam sharanam yami sharanyamishvaram || 20|| mahatah paritah prasarpatah
    tamaso darshanabhedino bhide | dinanatha iva svatejasa hridayavyomni managudehi nah || 21|| na vayam
    tava carmacakshusha padavimapyamitrikshitum kshamah | kripaya'bhayadena cakshupa sakalenesha vilokapashu
    mam || 22|| tvadanusmritireva pavani stutiyukta nahi vaktumisha sa | madhuram hi payah svabhavato
    nanu kidriksitasharkaranvitam || 23|| savisho'pyamritayate bhavan shavamundamarano'pi pavanah | bhava
    eva bhavantakah satam samadrishtirvishamekshano'pi san || 24|| api shuladharo niramayo dridhavairagyarato'pi
    ragavan | api bhaikshacaro maheshvara caritam citramidam hi te prabho || 25|| vitaratyabhivanchitam
    nrinam pariprishtah kila kalpapadapah | hridaye svata eva dhimate namate'bhishtaphalaprado bhavan
    || 26|| sahasaiva bhujangapashavanvinigrihnati na yavadantakah | abhayam kuru tavadashu me gatajivasya
    punah kimaupaghaih || 27|| savishairiva bhimapannagaih vishayairebhiralam parikshitum | amritairiva
    sambhramena mamabhipincashu dayavalokanaih || 28|| munayo bahavo'tha dhanyatam gamitah svabhimatarthalabhatah
    | karunakara yena tena mamavasannam nanu pashya cakshupa || 29|| pranamamyatha yami caparam sharanam
    kam kripanabhayapradam | virahiva vibho priyamayam paripashyami bhavanmayam jagat || 30|| bahavo bhavata'nukampitah
    kimitishana na ma'nukampase | dadhata kimu mandaracalam paramanuh kamathena durdharah || 31|| ashuci
    yadi mam nu manyase kimidam murdhni kapaladama te | atha shathyamasadhusangamam vishalakshmasi na
    ki dvijihvabhrit || 32|| viluthamyavanau kimakulah kimuge hanmi shiro bhinadmi va | kimu rodimi raratimi
    va kripanam mam na yadikshase prabho || 33|| shiva sarvaga sharva sarvatah pranato deva dayam kurushva
    me | nama ishvara natha dikpate punarevesha namo namostu te || 34|| kva drisham vidadhami kim karomyadhitishthami
    katham bhayakulah | kanu tishthasi raksha raksha mam mayi shambho sharanagato'smi te || 35|| sharanam
    tarunendushekharah sharanam me girirajakanyaka | sharanam punareva tavubhau sharanam nanyadupaimi
    daivatah || 36|| paralokabhayatpratikshanam me hridayam muhyati mugdhacandramaule | sadayam parigrihya
    sadhu bandho kuru mam nirbhayamarbhakam tvadiyam || 37|| hara hara bhava bhima bharga shambho trinayana
    rudra mahesha vishva shambho | hara hara duritam trishulapane shiva shiva shankara kinkarastavaham
    || 38|| yatha mrikandostanayam yamare yathaiva pandostanayam makhare | yatha shiladasya sutam kripabdhe
    tathaitra mam pahi pinakapane || 39||
  devanagari: उपमन्युकृतं शिवस्तोत्रम् जय शङ्कर पार्वतीपते मृड शम्भो शशिखण्डमण्डन । मदनान्तक भक्तवत्सल
    प्रियकैलास दयासुधाम्बुधे ॥ १९॥ सदुपायकथास्वपण्डितो हृदये दुःखशरेण खण्डितः । शशिखण्डशिखण्डमण्डनं शरणं
    यामि शरण्यमीश्वरम् ॥ २०॥ महतः परितः प्रसर्पतः तमसो दर्शनभेदिनो भिदे । दिननाथ इव स्वतेजसा हृदयव्योम्नि
    मनागुदेहि नः ॥ २१॥ न वयं तव चर्मचक्षुषा पदवीमप्यमित्रीक्षितुं क्षमाः । कृपयाऽभयदेन चक्षुपा सकलेनेश
    विलोकपाशु माम् ॥ २२॥ त्वदनुस्मृतिरेव पावनी स्तुतियुक्ता नहि वक्तुमीश सा । मधुरं हि पयः स्वभावतो ननु
    कीदृक्सितशर्करान्वितम् ॥ २३॥ सविषोऽप्यमृतायते भवान् शवमुण्डामरणोऽपि पावनः । भव एव भवान्तकः सतां समदृष्टिर्विषमेक्षणोऽपि
    सन् ॥ २४॥ अपि शूलधरो निरामयो दृढवैराग्यरतोऽपि रागवान् । अपि भैक्षचरो महेश्वर चरितं चित्रमिदं हि ते
    प्रभो ॥ २५॥ वितरत्यभिवाञ्छितं नृणां परिपृष्टः किल कल्पपादपः । हृदये स्वत एव धीमते नमतेऽभीष्टफलप्रदो
    भवान् ॥ २६॥ सहसैव भुजङ्गपाशवान्विनिगृह्णाति न यावदन्तकः । अभयं कुरु तावदाशु मे गतजीवस्य पुनः किमौपघैः
    ॥ २७॥ सविषैरिव भीमपन्नगैः विषयैरेभिरलं परीक्षितुम् । अमृतैरिव सम्भ्रमेण मामभिपिञ्चाशु दयावलोकनैः ॥
    २८॥ मुनयो बहवोऽथ धन्यतां गमिताः स्वाभिमतार्थलाभतः । करुणाकर येन तेन मामवसन्नं ननु पश्य चक्षुपा ॥ २९॥
    प्रणमाम्यथ यामि चापरं शरणं कं कृपणाभयप्रदम् । विरहीव विभो प्रियामयं परिपश्यामि भवन्मयं जगत् ॥ ३०॥
    बहवो भवताऽनुकम्पिताः किमितीशान न माऽनुकम्पसे । दधता किमु मन्दराचलं परमाणुः कमठेन दुर्धरः ॥ ३१॥ अशुचि
    यदि मां नु मन्यसे किमिदं मूर्ध्नि कपालदाम ते । अथ शाठ्यमसाधुसङ्गमं विषलक्ष्मासि न कि द्विजिह्वभृत्
    ॥ ३२॥ विलुठाम्यवनौ किमाकुलः किमुगे हन्मि शिरो भिनद्मि वा । किमु रोदिमि रारटीमि वा कृपणं मां न यदीक्षसे
    प्रभो ॥ ३३॥ शिव सर्वग शर्व सर्वतः प्रणतो देव दयां कुरुष्व मे । नम ईश्वर नाथ दिक्पते पुनरेवेश नमो नमोस्तु
    ते ॥ ३४॥ क्व दृशं विदधामि किं करोम्यधितिष्ठामि कथं भयाकुलः । कनु तिष्ठसि रक्ष रक्ष मां मयि शम्भो शरणागतोऽस्मि
    ते ॥ ३५॥ शरणं तरुणेन्दुशेखरः शरणं मे गिरिराजकन्यका । शरणं पुनरेव तावुभौ शरणं नान्यदुपैमि दैवतः ॥ ३६॥
    परलोकभयात्प्रतिक्षणं मे हृदयं मुह्यति मुग्धचन्द्रमौले । सदयं परिगृह्य साधु बन्धो कुरु मां निर्भयमर्भकं
    त्वदीयम् ॥ ३७॥ हर हर भव भीम भर्ग शम्भो त्रिनयन रुद्र महेश विश्व शम्भो । हर हर दुरितं त्रिशूलपाणे शिव
    शिव शङ्कर किङ्करस्तवाहम् ॥ ३८॥ यथा मृकण्डोस्तनयं यमारे यथैव पाण्डोस्तनयं मखारे । यथा शिलादस्य सुतं
    कृपाब्धे तथैत्र मां पाहि पिनाकपाणे ॥ ३९॥
