id: shivastotramhimalayak-itabvp
category: stotram
name:
  english: shivastotramhimalayakṟitaBVP
  devanagari: शिवस्तोत्रम्हिमालयक्ऱितBVP
content:
  english: shrishivastotram himalayakrita brahmavaivarte shriganeshaya namah | himalaya uvaca | tvam brahma
    srishtikarta ca tvam vishnuh paripalakah | tvam shivah shivado'nantah sarvasamharakarakah || 1|| tvamishvaro
    gunatito jyotirupah sanatanah | prakritih prakritishashca prakritah prakriteh parah || 2|| nanarupavidhata
    tvam bhaktanam dhyanahetave | yeshu rupeshu yatpritistattadrupam bibharshi ca || 3|| suryastvam srishtijanaka
    adharah sarvatejasam | somastvam shasyapata ca satatam shitarashmina || 4|| vayustvam varunastvam
    ca tvamagnih sarvadahakah | indrastvam devarajashca kalo mrityuryamastatha || 5|| mrityunjayo mrityumrityuh
    kalakalo yamantakah | vedastvam vedakarta ca vedavedangaparagah || 6|| vidusham janakastvam ca vidvamshca
    vidusham guruh | mantrastvam hi japastvam hi tapastvam tatphalapradah || 7|| vak tvam ragadhidevi
    tvam tatkarta tadguruh svayam | aho sarasvatibijam kastvam stotumiheshvarah || 8|| ityevamuktvashailendrastasthau
    dhritva padambujam | tatrovasa tamabodhya cavaruhya vrishacchivah || 9|| stotrametanmahapunyam trisandhyam
    yah pathennarah | mucyate sarvapapebhyo bhayebhyashca bhavarnave || 10|| aputro labhate putram masamekam
    pathedyadi | bharyahino labhedbharyam sushilam sumanoharam || 11|| cirakalagatam vastu labhate sahasa
    dhruvam || 12|| rajyabhrashto labhedrajyam shankarasya prasadatah | karagare shmashane ca shatrugraste'tisankate
    | gabhire'tijalakirne bhagnapote vishadane || 13|| ranamadhye mahabhite himsrajantusamanvite | sarvato
    mucyate stutva shankarasya prasadatah || 14|| iti shribrahmavaivarte mahapurane shrikrishnajanmakhande
    himalayakritam shivastotram sampurnam || shrikrishnajanmakhanda adhyaya 38 shlokani 65
  devanagari: श्रीशिवस्तोत्रं हिमालयकृत ब्रह्मवैवर्ते श्रीगणेशाय नमः । हिमालय उवाच । त्वं ब्रह्मा सृष्टिकर्ता
    च त्वं विष्णुः परिपालकः । त्वं शिवः शिवदोऽनन्तः सर्वसंहारकारकः ॥ १॥ त्वमीश्वरो गुणातीतो ज्योतीरूपः
    सनातनः । प्रकृतिः प्रकृतीशश्च प्राकृतः प्रकृतेः परः ॥ २॥ नानारूपविधाता त्वं भक्तानां ध्यानहेतवे ।
    येषु रूपेषु यत्प्रीतिस्तत्तद्रूपं बिभर्षि च ॥ ३॥ सूर्यस्त्वं सृष्टिजनक आधारः सर्वतेजसाम् । सोमस्त्वं
    शस्यपाता च सततं शीतरश्मिना ॥ ४॥ वायुस्त्वं वरुणस्त्वं च त्वमग्निः सर्वदाहकः । इन्द्रस्त्वं देवराजश्च
    कालो मृत्युर्यमस्तथा ॥ ५॥ मृत्युञ्जयो मृत्युमृत्युः कालकालो यमान्तकः । वेदस्त्वं वेदकर्ता च वेदवेदाङ्गपारगः
    ॥ ६॥ विदुषां जनकस्त्वं च विद्वांश्च विदुषां गुरुः । मन्त्रस्त्वं हि जपस्त्वं हि तपस्त्वं तत्फलप्रदः
    ॥ ७॥ वाक् त्वं रागाधिदेवी त्वं तत्कर्ता तद्गुरुः स्वयम् । अहो सरस्वतीबीजं कस्त्वां स्तोतुमिहेश्वरः
    ॥ ८॥ इत्येवमुक्त्वाशैलेन्द्रस्तस्थौ धृत्वा पदाम्बुजम् । तत्रोवास तमाबोध्य चावरुह्य वृषाच्छिवः ॥ ९॥
    स्तोत्रमेतन्महापुण्यं त्रिसन्ध्यं यः पठेन्नरः । मुच्यते सर्वपापेभ्यो भयेभ्यश्च भवार्णवे ॥ १०॥ अपुत्रो
    लभते पुत्रं मासमेकं पठेद्यदि । भार्याहीनो लभेद्भार्यां सुशीलां सुमनोहराम् ॥ ११॥ चिरकालगतं वस्तु लभते
    सहसा ध्रुवम् ॥ १२॥ राज्यभ्रष्टो लभेद्राज्यं शङ्करस्य प्रसादतः । कारागारे श्मशाने च शत्रुग्रस्तेऽतिसङ्कटे
    । गभीरेऽतिजलाकीर्णे भग्नपोते विषादने ॥ १३॥ रणमध्ये महाभीते हिंस्रजन्तुसमन्विते । सर्वतो मुच्यते स्तुत्वा
    शङ्करस्य प्रसादतः ॥ १४॥ इति श्रीब्रह्मवैवर्ते महापुराणे श्रीकृष्णजन्मखण्डे हिमालयकृतं शिवस्तोत्रं
    सम्पूर्णम् ॥ श्रीकृष्णजन्मखण्ड अध्याय ३८ श्लोकानि ६५
