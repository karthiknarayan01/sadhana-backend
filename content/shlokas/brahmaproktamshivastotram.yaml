id: brahmaproktamshivastotram
category: stotram
name:
  english: brahmaproktamshivastotram
  devanagari: ब्रह्माप्रोक्तंशिवस्तोत्रम्
content:
  english: brahmaproktam shivastotram namaste devadevaya namaste'nantamurtaye || 439|| namo lokaikanathaya
    namaste sarvasakshine | namaste nirvikaraya namaste'nantacakshushe || 440|| namaste'nantahastaya namaste'nantarupine
    | namaste nirgunananta namaste saguna prabho || 441|| namaste jagadadhara namaste vishvabhavana |
    namaste sattvarupaya namaste lokarupine || 442|| namaste sarvarupaya rupatitaya te namah | namaste
    shuddhabuddhaya namaste paramatmane || 443|| namaste lingarupaya namaste vijvaranagha | namo vedantavedyaya
    namaste vedarupine || 444|| namaste jnanarupaya namaste jnanadayaka | namaste nishprapancaya nirihaya
    namo'stu te || 445|| nirdvandvaya namaste'stu nirmalayastu te namah | niravadya namaste'tu niramaya
    namo'stu te || 446|| nishkalanka namaste'stu vyapakaya namo'stu te | namaste yajnarupaya yajnakartre
    namo'stu te || 447|| namaste bhurirupaya namaste sharmadayine | namo hiranyahastaya senanye te namo
    namah || 448|| namo dikpataye tubhyam kakshanam patayenamah | namah saspinjarayadya namaste'stu tvishimate
    || 449|| namah pathinampataye kuluncaya namo'stu te | vivyadhine namo'nnanam pataye te namo namah
    || 450|| namaste harikeshaya namo bhavyopavitine | pushtanam pataye tubhyam namaste pushtidayine ||
    451|| jagatam pataye nityam namo rudraya te namah | paratatayine nityam namaste gudharupine || 452||
    kshetranam pataye nityam namah sutaya te namah | namo hantyaya dardhyaya vishvaguptaya te namah ||
    453|| vananam pataye nityam rohitaya namo'stu te | namah sthapataye nityam vrikshanam pataye namah
    || 454|| namaste mantrine nityam vanijaya namo'stu te | namah surmyaya ca parnyaya parnashadyaya te
    namah || 478|| namo'paguramanaya namaste'bhighnate sada | nama akhidate nityam namah prakhidate sada
    || 479|| namo vishvasvarupaya gunatitaya te namah | nilagrivaya nityaya shitikanthaya te namah ||
    480|| vyuptakeshaya te nityam sahasrakshaya te namah | namaste ghorarupaya namaste shatadhanvane ||
    481|| girishaya namaste'stu shipivishtaya te namah | midhushtamaya devaya bhavyayeshumate namah ||
    482|| namo hrasvaya devaya vamanaya namo namah | namo'stu brihate nityam namo varshiyase sada || 483||
    namo vriddhaya devaya namah samvridhvanaya te | namo'griyaya shuraya prathamaya namonamah || 484||
    ashave te namo nityamajaraya ca te namah | namah shighryaya te nityam shibhyaya mahate namah || 485||
    nama urvyaya nipyaya vasvanyaya namonamah | srotasyaya namo nityam dipyaya ca namo namah || 486||
    namo jyeshthaya shuraya kanishthaya ca te namah | purvajaya namaste'stu namaste'parajaya ca || 487||
    madhyamaya namaste'stu kushmandaya ca te namah | namah parantapayesha taraya sakalatmane || 488||
    jaghanyaya namaste'stu budhniyaya namo namah | sobhyaya pratisaryaya namo yamyaya te namah || 489||
    namah kshemyaya varmyaya urvaryaya namo namah | shlokyaya cavasanyaya namo mangalarupine || 490||
    namo vanyaya kakshyaya shravyaya ca namo namah | pratishravyaya shantaya sharanyaya namo namah ||
    491|| namah sadashushenaya namashcashurathaya ca | namah shurasvarupaya bhetre ca bhayadayine || 492||
    namo'stu varmine tubhyam namo nityam varuthine | bilmine ca namo nityam namah kabacine sada || 493||
    shrutaya shrutasenaya dundubhyaya ca te namah | namaste ahananyaya dhrishnave pramrishaya ca || 494||
    tikshneshave namastubhyam nama ayudhine sada | namo goptre ashvahantre a
  devanagari: ब्रह्माप्रोक्तं शिवस्तोत्रम् नमस्ते देवदेवाय नमस्तेऽनन्तमूर्तये ॥ ४३९॥ नमो लोकैकनाथाय नमस्ते
    सर्वसाक्षिणे । नमस्ते निर्विकाराय नमस्तेऽनन्तचक्षुषे ॥ ४४०॥ नमस्तेऽनन्तहस्ताय नमस्तेऽनन्तरूपिणे ।
    नमस्ते निर्गुणानन्त नमस्ते सगुण प्रभो ॥ ४४१॥ नमस्ते जगदाधार नमस्ते विश्वभावन । नमस्ते सत्त्वरूपाय
    नमस्ते लोकरूपिणे ॥ ४४२॥ नमस्ते सर्वरूपाय रूपातीताय ते नमः । नमस्ते शुद्धबुद्धाय नमस्ते परमात्मने ॥
    ४४३॥ नमस्ते लिङ्गरूपाय नमस्ते विज्वरानघ । नमो वेदान्तवेद्याय नमस्ते वेदरूपिणे ॥ ४४४॥ नमस्ते ज्ञानरूपाय
    नमस्ते ज्ञानदायक । नमस्ते निष्प्रपञ्चाय निरीहाय नमोऽस्तु ते ॥ ४४५॥ निर्द्वन्द्वाय नमस्तेऽस्तु निर्मलायास्तु
    ते नमः । निरवद्य नमस्तेऽतु निरामय नमोऽस्तु ते ॥ ४४६॥ निष्कलङ्क नमस्तेऽस्तु व्यापकाय नमोऽस्तु ते ।
    नमस्ते यज्ञरूपाय यज्ञकर्त्रे नमोऽस्तु ते ॥ ४४७॥ नमस्ते भूरिरूपाय नमस्ते शर्मदायिने । नमो हिरण्यहस्ताय
    सेनान्ये ते नमो नमः ॥ ४४८॥ नमो दिक्पतये तुभ्यं कक्षाणां पतयेनमः । नमः सस्पिञ्जरायाद्य नमस्तेऽस्तु
    त्विषीमते ॥ ४४९॥ नमः पथीनाम्पतये कुलुञ्चाय नमोऽस्तु ते । विव्याधिने नमोऽन्नानां पतये ते नमो नमः ॥
    ४५०॥ नमस्ते हरिकेशाय नमो भाव्योपवीतिने । पुष्टानां पतये तुभ्यं नमस्ते पुष्टिदायिने ॥ ४५१॥ जगतां पतये
    नित्यं नमो रुद्राय ते नमः । पराततायिने नित्यं नमस्ते गूढरूपिणे ॥ ४५२॥ क्षेत्राणां पतये नित्यं नमः
    सूताय ते नमः । नमो हन्त्याय दार्ढ्याय विश्वगुप्ताय ते नमः ॥ ४५३॥ वनानां पतये नित्यं रोहिताय नमोऽस्तु
    ते । नमः स्थपतये नित्यं वृक्षाणां पतये नमः ॥ ४५४॥ नमस्ते मन्त्रिणे नित्यं वाणिजाय नमोऽस्तु ते । नमः
    सूर्म्याय च पर्ण्याय पर्णशद्याय ते नमः ॥ ४७८॥ नमोऽपगुरमाणाय नमस्तेऽभिघ्नते सदा । नम आखिदते नित्यं
    नमः प्रखिदते सदा ॥ ४७९॥ नमो विश्वस्वरूपाय गुणातीताय ते नमः । नीलग्रीवाय नित्याय शितिकण्ठाय ते नमः
    ॥ ४८०॥ व्युप्तकेशाय ते नित्यं सहस्राक्षाय ते नमः । नमस्ते घोररूपाय नमस्ते शतधन्वने ॥ ४८१॥ गिरीशाय
    नमस्तेऽस्तु शिपिविष्टाय ते नमः । मीढुष्टमाय देवाय भव्यायेषुमते नमः ॥ ४८२॥ नमो ह्रस्वाय देवाय वामनाय
    नमो नमः । नमोऽस्तु बृहते नित्यं नमो वर्षीयसे सदा ॥ ४८३॥ नमो वृद्धाय देवाय नमः संवृध्वनाय ते । नमोऽग्रियाय
    शूराय प्रथमाय नमोनमः ॥ ४८४॥ आशवे ते नमो नित्यमजराय च ते नमः । नमः शीघ्र्याय ते नित्यं शीभ्याय महते
    नमः ॥ ४८५॥ नम ऊर्व्याय नीप्याय वस्वन्याय नमोनमः । स्रोतस्याय नमो नित्यं दीप्याय च नमो नमः ॥ ४८६॥ नमो
    ज्येष्ठाय शूराय कनिष्ठाय च ते नमः । पूर्वजाय नमस्तेऽस्तु नमस्तेऽपरजाय च ॥ ४८७॥ मध्यमाय नमस्तेऽस्तु
    कूश्माण्डाय च ते नमः । नमः परन्तपायेश ताराय सकलात्मने ॥ ४८८॥ जघन्याय नमस्तेऽस्तु बुध्नियाय नमो नमः
    । सोभ्याय प्रतिसर्याय नमो याम्याय ते नमः ॥ ४८९॥ नमः क्षेम्याय वर्म्याय उर्वर्याय नमो नमः । श्लोक्याय
    चावसान्याय नमो मङ्गलरूपिणे ॥ ४९०॥ नमो वन्याय कक्ष्याय श्राव्याय च नमो नमः । प्रतिश्राव्याय शान्ताय
    शरण्याय नमो नमः ॥ ४९१॥ नमः सदाशुषेणाय नमश्चाशुरथाय च । नमः शूरस्वरूपाय भेत्रे च भयदायिने ॥ ४९२॥ नमोऽस्तु
    वर्मिणे तुभ्यं नमो नित्यं वरूथिने । बिल्मिने च नमो नित्यं नमः कबचिने सदा ॥ ४९३॥ श्रुताय श्रुतसेनाय
    दुन्दुभ्याय च ते नमः । नमस्ते आहनन्याय धृष्णवे प्रमृशाय च ॥ ४९४॥ तीक्ष्णेषवे नमस्तुभ्यं नम आयुधिने
    सदा । नमो गोप्त्रे अश्वहन्त्रे आ
