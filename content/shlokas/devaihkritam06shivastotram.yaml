id: devaihkritam06shivastotram
category: stotram
name:
  english: devaihkritam06shivastotram
  devanagari: देवैःकृतं०६शिवस्तोत्रम्
content:
  english: devaih kritam 6 shivastotram deva ucuh | namo namo'visheshastvam tvam brahma tvam pinakadhrik
    | indrastvamagnih pavano varunah savita yamah || 69|| vasavo marutah sadhya vishvedevagana bhavan
    yo'yam tavagrato deva samipam devataganah | sa tvameva jagatsrashta yatah sarvagato bhavan || 70||
    tvam yajnastvam vashatkarastvamonkarah prajapatih | vidya vedyam ca sarvatma~stvanmayam cakhilam jagat
    || 71|| tvamarttah sharanam vishno prayata daityanirjitah | vayam prasida sarvatma~stejasa''pyayayasva
    nah || 72|| tavadarttistatha vancha tavanmohastatha mukham | yavanna yati sharanam tvamasheshaughanashanam
    || 73|| tvam prasadam prasannatman prapannanam kurushva nah | tejasam natha sarvesham svashaktya''pyayanam
    kuru || 74|| iti vishnupurane prathamabhage navamadhyayantargatam devaih kritam shivastotram samaptam
    | vishnupurana | adhyaya 1
  devanagari: देवैः कृतं ६ शिवस्तोत्रम् देवा ऊचुः । नमो नमोऽविशेषस्त्वं त्वं ब्रह्म त्वं पिनाकधृक् । इन्द्रस्त्वमग्निः
    पवनो वरुणः सविता यमः ॥ ६९॥ वसवो मरुतः साध्या विश्वेदेवगणा भवान् योऽयं तवाग्रतो देव समीपं देवतागणः
    । स त्वमेव जगत्स्रष्टा यतः सर्वगतो भवान् ॥ ७०॥ त्वं यज्ञस्त्वं वषट्कारस्त्वमोङ्कारः प्रजापतिः । विद्या
    वेद्यं च सर्वात्मँस्त्वन्मयं चाखिलं जगत् ॥ ७१॥ त्वामार्त्ताः शरणं विष्णो प्रयाता दैत्यनिर्जिताः ।
    वयं प्रसीद सर्वात्मँस्तेजसाऽऽप्याययस्व नः ॥ ७२॥ तावदार्त्तिस्तथा वाञ्छा तावन्मोहस्तथा मुखम् । यावन्न
    याति शरणं त्वामशेषौघनाशनम् ॥ ७३॥ त्वं प्रसादं प्रसन्नात्मन् प्रपन्नानां कुरुष्व नः । तेजसां नाथ सर्वेषां
    स्वशक्त्याऽऽप्यायनं कुरु ॥ ७४॥ इति विष्णुपुराणे प्रथमभागे नवमाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं
    समाप्तम् । विष्णुपुराण । अध्याय १
