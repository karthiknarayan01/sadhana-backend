id: ganeshanyasah
category: stotram
name:
  english: ganeshanyasah
  devanagari: गणेशन्यासः
content:
  english: dakshinahaste vakratundaya namah | vamahaste shurpakarnaya namah | oshthe vighneshaya namah
    | adharoshthe cintamanaye namah | sampute gajananaya namah | dakshinapade lambodaraya namah | vamapade
    ekadantaya namah | shirasi ekadantaya namah | cibuke brahmanaspataye namah | dakshinanasikayam vinayakaya
    namah | vamanasikayam jyeshtharajaya namah | dakshinanetre vikataya namah | vamanetre kapilaya namah
    | dakshinakarne dharanidharaya namah | vamakarne ashapurakaya namah | nabhau mahodaraya namah | hridaye
    dhumraketave namah | lalate mayureshaya namah | dakshinabahau svanandavasakarakaya namah | vamabahau
    saccitsukhadhamne namah || iti mudgalapuranokto ganeshanyasah samaptah ||
  devanagari: दक्षिणहस्ते वक्रतुण्डाय नमः । वामहस्ते शूर्पकर्णाय नमः । ओष्ठे विघ्नेशाय नमः । अधरोष्ठे
    चिन्तामणये नमः । सम्पुटे गजाननाय नमः । दक्षिणपादे लम्बोदराय नमः । वामपादे एकदन्ताय नमः । शिरसि एकदन्ताय
    नमः । चिबुके ब्रह्मणस्पतये नमः । दक्षिणनासिकायां विनायकाय नमः । वामनासिकायां ज्येष्ठराजाय नमः । दक्षिणनेत्रे
    विकटाय नमः । वामनेत्रे कपिलाय नमः । दक्षिणकर्णे धरणीधराय नमः । वामकर्णे आशापूरकाय नमः । नाभौ महोदराय
    नमः । हृदये धूम्रकेतवे नमः । ललाटे मयूरेशाय नमः । दक्षिणबाहौ स्वानन्दवासकारकाय नमः । वामबाहौ सच्चित्सुखधाम्ने
    नमः ॥ इति मुद्गलपुराणोक्तो गणेशन्यासः समाप्तः ॥
