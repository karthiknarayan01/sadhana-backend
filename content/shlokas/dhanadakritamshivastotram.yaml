id: dhanadakritamshivastotram
category: stotram
name:
  english: dhanadakritamshivastotram
  devanagari: धनदकृतंशिवस्तोत्रम्
content:
  english: dhanadakritam shivastotram dhanada uvaca | svamimstvamevasya caracarasya vishvasya shambho
    na paro'sti kashcit | tvamapyavajnaya yadiha mohatpragalbhate ko'pi sa shocya eva || 20|| tvamashtamurtya
    sakalam bibharshi tvadajnaya vartata eva sarvam | tatha'pi vedeti budho bhavantam na jatvavidvanmahima
    puratanam || 21|| malaprasutam yadavocadamba hasyatsuto'yam tava deva shurah | tvatprekshitadyah sa
    ca vighnarajo jajne tvaho ceshtitamishadrishteh || 22|| ashruplutangi girija samikshya viyuktadampatyamitishamuce
    | manobhavo'bhunmadano ratishca saubhagyapurva
  devanagari: धनदकृतं शिवस्तोत्रम् धनद उवाच । स्वामिंस्त्वमेवास्य चराचरस्य विश्वस्य शम्भो न परोऽस्ति कश्चित्
    । त्वामप्यवज्ञाय यदीह मोहात्प्रगल्भते कोऽपि स शोच्य एव ॥ २०॥ त्वमष्टमूर्त्या सकलं बिभर्षि त्वदाज्ञया
    वर्तत एव सर्वम् । तथाऽपि वेदेति बुधो भवन्तं न जात्वविद्वान्महिमा पुरातनम् ॥ २१॥ मलप्रसूतं यदवोचदम्बा
    हास्यात्सुतोऽयं तव देव शूरः । त्वत्प्रेक्षिताद्यः स च विघ्नराजो जज्ञे त्वहो चेष्टितमीशदृष्टेः ॥ २२॥
    अश्रुप्लुताङ्गी गिरिजा समीक्ष्य वियुक्तदाम्पत्यमितीशमूचे । मनोभवोऽभून्मदनो रतिश्च सौभाग्यपूर्व
meaning: {}
