id: dharmanandanastotram
category: stotram
name:
  english: dharmanandanastotram
  devanagari: धर्मनन्दनस्तोत्रम्
content:
  english: sadvasanalinam varamalyamanjulamalinam calitalinam prithumalinam navapushpabhushanashalinam
    | vrishapalinam shritalalinam japamalika
  devanagari: सद्वसनालिनं वरमाल्यमञ्जुलमालिनं चलितालिनं पृथुमालिनं नवपुष्पभूषणशालिनम् । वृषपालिनं श्रितलालिनं
    जपमालिका
meaning: {}
source_attribution:
  text_source: sanskritdocuments.org — https://sanskritdocuments.org/doc_vishhnu/dharmanandanastotram.html
