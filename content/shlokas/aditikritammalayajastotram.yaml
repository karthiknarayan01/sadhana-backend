id: aditikritammalayajastotram
category: stotram
name:
  english: aditikritammalayajastotram
  devanagari: अदितिकृतंमलयजास्तोत्रम्
content:
  english: aditikritam malayajastotram aditiruvaca | ya shaktirantarjagarti lokanam pranarupini | ya punarjivanakhya
    syat tam tvaham sharanam gata || 55|| gayanti shrutayo nityam tirtharupam marudvritam | tam tvamakhilatattvartham
    maheyimashraye shriyam || 56|| heturadavasheshasya jivanatve vyavasthita | mrityuh pranabhritam bhuyo
    yadamshena pravartitah || 57|| anadishaktiravyagra nigrahanugrahakshama | sa tvam lokahitayaiva jata
    hi malayatmaja || 58|| mantrashaktim prashamsanti santah karmakalam punah | tvameva phalada loke tirthamatarnamo'stu
    te || 59|| shivah shivanvito bhuri tapasa''radhya madhavi | tvameva labdhavanadau tasmattvam sharanam
    vraje || 60|| maleyi malayananda ganga bhagirathiti ca | ghritadhara parushniti pathyase tvam puratanaih
    || 61||
  devanagari: अदितिकृतं मलयजास्तोत्रम् अदितिरुवाच । या शक्तिरन्तर्जागर्ति लोकानां प्राणरूपिणी । या पुनर्जीवनाख्या
    स्यात् तां त्वाहं शरणं गता ॥ ५५॥ गायन्ति श्रुतयो नित्यं तीर्थरूपां मरुद्वृताम् । तां त्वामखिलतत्त्वार्थां
    माहेयीमाश्रये श्रियम् ॥ ५६॥ हेतुरादावशेषस्य जीवनत्वे व्यवस्थिता । मृत्युः प्राणभृतां भूयो यदंशेन प्रवर्तितः
    ॥ ५७॥ अनादिशक्तिरव्यग्रा निग्रहानुग्रहक्षमा । सा त्वं लोकहितायैव जाता हि मलयात्मजा ॥ ५८॥ मन्त्रशक्तिं
    प्रशंसन्ति सन्तः कर्मकलां पुनः । त्वमेव फलदा लोके तीर्थमातर्नमोऽस्तु ते ॥ ५९॥ शिवः शिवान्वितो भूरि
    तपसाऽऽराध्य माधवि । त्वामेव लब्धवानादौ तस्मात्त्वां शरणं व्रजे ॥ ६०॥ मालेयी मलयानन्दा गङ्गा भागीरथीति
    च । घृतधारा परुष्णीति पठ्यसे त्वं पुरातनैः ॥ ६१॥
