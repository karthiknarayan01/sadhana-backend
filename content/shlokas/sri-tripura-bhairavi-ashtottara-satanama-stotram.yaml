id: sri-tripura-bhairavi-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Tripura Bhairavi Ashtottara Satanama Stotram
content:
  english: shridevyuvaca kailasavasin bhagavan praneshvara kripanidhe | bhaktavatsala bhairavya namnamashtottaram
    shatam || || na shrutam devadevesha vada mam dinavatsala | shrishiva uvaca shrinu priye mahagopyam
    namnamashtottaram shatam || || bhairavyashshubhadam sevyam sarvasampatpradayakam | yasyanushthanamatrena
    kim na siddhyati bhutale || || om bhairavi bhairavaradhya bhutida bhutabhavana | arya brahmi kamadhenussarvasampatpradayini
    || || trailokyavandita devi mahishasuramardini | mohaghni malati mala mahapatakanashini || || krodhini
    krodhanilaya krodharaktekshana kuhuh | tripura tripuradhara trinetra bhimabhairavi || || devaki devamata
    ca devadushtavinashini | damodarapriya dirgha durga durgatinashini || || lambodari lambakarna pralambitapayodhara
    | pratyangira pratipada pranatakleshanashini || || prabhavati gunavati ganamata guheshvari | kshirabdhitanaya
    kshemya jagattranavidhayini || || mahamari mahamoha mahakrodha mahanadi | mahapatakasamhartri mahamohapradayini
    || || vikarala mahakala kalarupa kalavati | kapalakhatvangadhara khadgakharparadharini || || kumari
    kunkumaprita kunkumarunaranjita | kaumodaki kumudini kirtya kirtipradayini || || navina nirada nitya
    nandikeshvarapalini | gharghara gharghararava ghora ghorasvarupini || || kalighni kalidharmaghni kalikautukanashini
    | kishori keshavaprita kleshasanghanivarini || || mahonmatta mahamatta mahavidya mahimayi | mahayajna
    mahavani mahamandaradharini || || mokshada mohada moha bhuktimuktipradayini | attattahasanirata kvanannupuradharini
    || || dirghadamshtra dirghamukhi dirghaghona ca dirghika | danujantakari dushta duhkhadaridryabhanjini
    || || duracara ca doshaghni damapatni dayapara | manobhava manumayi manuvamshapravardhini || || shyama
    shyamatanushshobha saumya shambhuvilasini | iti te kathitam divyam namnamashtottaram shatam || ||
    bhairavya devadeveshyastava prityai sureshvari | aprakashyamidam gopyam pathaniyam prayatnatah ||
    || devim dhyatva suram pitva makaraih pancakaih priye | pujayetsatatam bhaktya pathet stotramidam
    shubham || || shanmasabhyantare so'pi gananathasamo bhavet | kimatra bahunoktena tvadagre pranavallabhe
    || || sarvam janasi sarvajne punarmam paripricchasi | na deyam parashishyebhyo nindakebhyo visheshatah
    || || iti shritripurabhairavi ashtottarashatanamastotram |
  devanagari: श्रीदेव्युवाच कैलासवासिन् भगवन् प्राणेश्वर कृपानिधे । भक्तवत्सल भैरव्या नाम्नामष्टोत्तरं
    शतम् ॥ ॥ न श्रुतं देवदेवेश वद मां दीनवत्सल । श्रीशिव उवाच शृणु प्रिये महागोप्यं नाम्नामष्टोत्तरं शतम्
    ॥ ॥ भैरव्याश्शुभदं सेव्यं सर्वसम्पत्प्रदायकम् । यस्यानुष्ठानमात्रेण किं न सिद्ध्यति भूतले ॥ ॥ ॐ भैरवी
    भैरवाराध्या भूतिदा भूतभावना । आर्या ब्राह्मी कामधेनुस्सर्वसम्पत्प्रदायिनी ॥ ॥ त्रैलोक्यवन्दिता देवी
    महिषासुरमर्दिनी । मोहघ्नी मालती माला महापातकनाशिनी ॥ ॥ क्रोधिनी क्रोधनिलया क्रोधरक्तेक्षणा कुहूः ।
    त्रिपुरा त्रिपुराधारा त्रिनेत्रा भीमभैरवी ॥ ॥ देवकी देवमाता च देवदुष्टविनाशिनी । दामोदरप्रिया दीर्घा
    दुर्गा दुर्गतिनाशिनी ॥ ॥ लम्बोदरी लम्बकर्णा प्रलम्बितपयोधरा । प्रत्यङ्गिरा प्रतिपदा प्रणतक्लेशनाशिनी
    ॥ ॥ प्रभावती गुणवती गणमाता गुहेश्वरी । क्षीराब्धितनया क्षेम्या जगत्त्राणविधायिनी ॥ ॥ महामारी महामोहा
    महाक्रोधा महानदी । महापातकसंहर्त्री महामोहप्रदायिनी ॥ ॥ विकराला महाकाला कालरूपा कलावती । कपालखट्वाङ्गधरा
    खड्गखर्परधारिणी ॥ ॥ कुमारी कुङ्कुमप्रीता कुङ्कुमारुणरञ्जिता । कौमोदकी कुमुदिनी कीर्त्या कीर्तिप्रदायिनी
    ॥ ॥ नवीना नीरदा नित्या नन्दिकेश्वरपालिनी । घर्घरा घर्घरारावा घोरा घोरस्वरूपिणी ॥ ॥ कलिघ्नी कलिधर्मघ्नी
    कलिकौतुकनाशिनी । किशोरी केशवप्रीता क्लेशसङ्घनिवारिणी ॥ ॥ महोन्मत्ता महामत्ता महाविद्या महीमयी । महायज्ञा
    महावाणी महामन्दरधारिणी ॥ ॥ मोक्षदा मोहदा मोहा भुक्तिमुक्तिप्रदायिनी । अट्टाट्टहासनिरता क्वणन्नूपुरधारिणी
    ॥ ॥ दीर्घदंष्ट्रा दीर्घमुखी दीर्घघोणा च दीर्घिका । दनुजान्तकरी दुष्टा दुःखदारिद्र्यभञ्जिनी ॥ ॥ दुराचारा
    च दोषघ्नी दमपत्नी दयापरा । मनोभवा मनुमयी मनुवंशप्रवर्धिनी ॥ ॥ श्यामा श्यामतनुश्शोभा सौम्या शम्भुविलासिनी
    । इति ते कथितं दिव्यं नाम्नामष्टोत्तरं शतम् ॥ ॥ भैरव्या देवदेवेश्यास्तव प्रीत्यै सुरेश्वरि । अप्रकाश्यमिदं
    गोप्यं पठनीयं प्रयत्नतः ॥ ॥ देवीं ध्यात्वा सुरां पीत्वा मकारैः पञ्चकैः प्रिये । पूजयेत्सततं भक्त्या
    पठेत् स्तोत्रमिदं शुभम् ॥ ॥ षण्मासाभ्यन्तरे सोऽपि गणनाथसमो भवेत् । किमत्र बहुनोक्तेन त्वदग्रे प्राणवल्लभे
    ॥ ॥ सर्वं जानासि सर्वज्ञे पुनर्मां परिपृच्छसि । न देयं परशिष्येभ्यो निन्दकेभ्यो विशेषतः ॥ ॥ इति श्रीत्रिपुरभैरवी
    अष्टोत्तरशतनामस्तोत्रम् ।
