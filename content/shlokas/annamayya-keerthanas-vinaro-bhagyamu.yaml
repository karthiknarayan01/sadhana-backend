id: annamayya-keerthanas-vinaro-bhagyamu
category: stotram
name:
  english: Annamayya Keerthanas Vinaro Bhagyamu
content:
  english: adi pallavi vinaro bhagyamu vishnukatha vènubalamidivo vishnukatha || adi nundi sandhyadi vidhulalo
    vedambayinadi vishnukatha | nadincinidè naradadulace vithi vithulane vishnukatha | vadalaka vedavyasulu
    nudivina vidita pavanamu vishnukatha | sadanambainadi sankirtanayai vèdakinacotane vishnukatha ||
    gòllètalu callalu gònakòni cilukaga vèlli viriyayè vishnukatha | illidè shri venkateshvaru namamu
    vèllagòlipè ni vishnukatha || vinaro bhagyamu vishnukatha vènubalamidivo vishnukatha ||
  devanagari: आदि पल्लवि विनरो भाग्यमु विष्णुकथ वॆनुबलमिदिवो विष्णुकथ ॥ आदि नुण्डि सन्ध्यादि विधुललो वेदम्बयिनदि
    विष्णुकथ । नादिञ्चीनिदॆ नारदादुलचे वीथि वीथुलने विष्णुकथ । वदलक वेदव्यासुलु नुडिविन विदित पावनमु विष्णुकथ
    । सदनम्बैनदि सङ्कीर्तनयै वॆदकिनचोटने विष्णुकथ ॥ गॊल्लॆतलु चल्ललु गॊनकॊनि चिलुकग वॆल्लि विरियायॆ विष्णुकथ
    । इल्लिदॆ श्री वेङ्कटेश्वरु नाममु वॆल्लगॊलिपॆ नी विष्णुकथ ॥ विनरो भाग्यमु विष्णुकथ वॆनुबलमिदिवो विष्णुकथ
    ॥
