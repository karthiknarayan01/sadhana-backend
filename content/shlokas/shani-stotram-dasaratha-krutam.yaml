id: shani-stotram-dasaratha-krutam
category: stotram
name:
  english: Shani Stotram Dasaratha Krutam
content:
  english: namah krishnaya nilaya shikhikhandanibhaya ca | namo nilamadhukaya nilotpalanibhaya ca || ||
    namo nirmamsadehaya dirghashrutijataya ca | namo vishalanetraya shushkodara bhayanaka || || namah
    paurushagatraya sthularomaya te namah | namo nityam kshudhartaya nityatriptaya te namah || || namo
    ghoraya raudraya bhishanaya karaline | namo dirghaya shushkaya kaladamshtra namo'stu te || || namaste
    ghorarupaya durnirikshyaya te namah | namaste sarvabhakshaya valimukha namo'stu te || || suryaputtra
    namaste'stu bhasvarobhayadayine | adhodrishte namaste'stu samvartaka namo'stu te || || namo mandagate
    tubhyam nishprabhaya namonamah | tapasa jnanadehaya nityayogarataya ca || || jnanacakshurnamaste'stu
    kashyapatmajasunave | tushto dadasi rajyam tvam kruddho harasi tat || devasuramanushyashca siddhavidyadharoragah
    | tvayavalokitassaure dainyamashuvrajantite || || brahma shakroyamashcaiva munayah saptatarakah |
    rajyabhrashtah patantiha tava drishtya'valokitah || || tvaya'valokitaste'pi nasham yanti samulatah
    | prasadam kuru me saure pranatvahitvamarthitah ||
  devanagari: नमः कृष्णाय नीलाय शिखिखण्डनिभाय च । नमो नीलमधूकाय नीलोत्पलनिभाय च ॥ ॥ नमो निर्मांसदेहाय
    दीर्घश्रुतिजटाय च । नमो विशालनेत्राय शुष्कोदर भयानक ॥ ॥ नमः पौरुषगात्राय स्थूलरोमाय ते नमः । नमो नित्यं
    क्षुधार्ताय नित्यतृप्ताय ते नमः ॥ ॥ नमो घोराय रौद्राय भीषणाय करालिने । नमो दीर्घाय शुष्काय कालदंष्ट्र
    नमोऽस्तु ते ॥ ॥ नमस्ते घोररूपाय दुर्निरीक्ष्याय ते नमः । नमस्ते सर्वभक्षाय वलीमुख नमोऽस्तु ते ॥ ॥
    सूर्यपुत्त्र नमस्तेऽस्तु भास्वरोभयदायिने । अधोदृष्टे नमस्तेऽस्तु संवर्तक नमोऽस्तु ते ॥ ॥ नमो मन्दगते
    तुभ्यं निष्प्रभाय नमोनमः । तपसा ज्ञानदेहाय नित्ययोगरताय च ॥ ॥ ज्ञानचक्षुर्नमस्तेऽस्तु काश्यपात्मजसूनवे
    । तुष्टो ददासि राज्यं त्वं क्रुद्धो हरसि तत् ॥ देवासुरमनुष्याश्च सिद्धविद्याधरोरगाः । त्वयावलोकितास्सौरे
    दैन्यमाशुव्रजन्तिते ॥ ॥ ब्रह्मा शक्रोयमश्चैव मुनयः सप्ततारकाः । राज्यभ्रष्टाः पतन्तीह तव दृष्ट्याऽवलोकितः
    ॥ ॥ त्वयाऽवलोकितास्तेऽपि नाशं यान्ति समूलतः । प्रसादं कुरु मे सौरे प्रणत्वाहित्वमर्थितः ॥
