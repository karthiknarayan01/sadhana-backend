id: narayaniyam-dashaka-79
category: stotram
name:
  english: Narayaniyam Dashaka 79
content:
  english: balasametabalanugato bhavan puramagahata bhishmakamanitah | dvijasutam tvadupagamavadinam dhritarasa
    tarasa prananama sa || || bhuvanakantamavekshya bhavadvapurnripasutasya nishamya ca ceshtitam | vipulakhedajusham
    puravasinam saruditairuditairagamannisha || || tadanu vanditumindumukhi shivam vihitamangalabhushanabhasura
    | niragamat bhavadarpitajivita svapuratah puratah subhatavrita || || kulavadhubhirupetya kumarika
    girisutam paripujya ca sadaram | muhurayacata tatpadapankaje nipatita patitam tava kevalam || || samavalokakutuhalasankule
    nripakule nibhritam tvayi ca sthite | nripasuta niragadgirijalayat suruciram ruciranjitadinmukha ||
    || bhuvanamohanaruparuca tada vivashitakhilarajakadambaya | tvamapi deva katakshavimokshanaih pramadaya
    madayancakrishe manak || || kvanu gamishyasi candramukhiti tam sarasametya karena haran kshanat |
    samadhiropya ratham tvamapahritha bhuvi tato vitato ninado dvisham || || kva nu gatah pashupala iti
    krudha kritarana yadubhishca jita nripah | na tu bhavanudacalyata tairaho pishunakaih shunakairiva
    kesari || || tadanu rukminamagatamahave vadhamupekshya nibadhya virupayan | hritamadam parimucya baloktibhih
    puramaya ramaya saha kantaya || || navasamagamalajjitamanasam pranayakautukajrimbhitamanmatham | aramayah
    khalu natha yathasukham rahasi tam hasitamshulasanmukhim || || vividhanarmabhirevamaharnisham pramadamakalayan
    punarekada | rijumateh kila vakragira bhavan varatanoratanodatilolatam || || tadadhikairatha lalanakaushalaih
    pranayinimadhikam sukhayannimam | ayi mukunda bhavaccaritani nah pragadatam gadatantimapakuru ||
  devanagari: बलसमेतबलानुगतो भवान् पुरमगाहत भीष्मकमानितः । द्विजसुतं त्वदुपागमवादिनं धृतरसा तरसा प्रणनाम
    सा ॥ ॥ भुवनकान्तमवेक्ष्य भवद्वपुर्नृपसुतस्य निशम्य च चेष्टितम् । विपुलखेदजुषां पुरवासिनां सरुदितैरुदितैरगमन्निशा
    ॥ ॥ तदनु वन्दितुमिन्दुमुखी शिवां विहितमङ्गलभूषणभासुरा । निरगमत् भवदर्पितजीविता स्वपुरतः पुरतः सुभटावृता
    ॥ ॥ कुलवधूभिरुपेत्य कुमारिका गिरिसुतां परिपूज्य च सादरम् । मुहुरयाचत तत्पदपङ्कजे निपतिता पतितां तव
    केवलम् ॥ ॥ समवलोककुतूहलसङ्कुले नृपकुले निभृतं त्वयि च स्थिते । नृपसुता निरगाद्गिरिजालयात् सुरुचिरं
    रुचिरञ्जितदिङ्मुखा ॥ ॥ भुवनमोहनरूपरुचा तदा विवशिताखिलराजकदम्बया । त्वमपि देव कटाक्षविमोक्षणैः प्रमदया
    मदयाञ्चकृषे मनाक् ॥ ॥ क्वनु गमिष्यसि चन्द्रमुखीति तां सरसमेत्य करेण हरन् क्षणात् । समधिरोप्य रथं त्वमपाहृथा
    भुवि ततो विततो निनदो द्विषाम् ॥ ॥ क्व नु गतः पशुपाल इति क्रुधा कृतरणा यदुभिश्च जिता नृपाः । न तु भवानुदचाल्यत
    तैरहो पिशुनकैः शुनकैरिव केसरी ॥ ॥ तदनु रुक्मिणमागतमाहवे वधमुपेक्ष्य निबध्य विरूपयन् । हृतमदं परिमुच्य
    बलोक्तिभिः पुरमया रमया सह कान्तया ॥ ॥ नवसमागमलज्जितमानसां प्रणयकौतुकजृम्भितमन्मथाम् । अरमयः खलु नाथ
    यथासुखं रहसि तां हसितांशुलसन्मुखीम् ॥ ॥ विविधनर्मभिरेवमहर्निशं प्रमदमाकलयन् पुनरेकदा । ऋजुमतेः किल
    वक्रगिरा भवान् वरतनोरतनोदतिलोलताम् ॥ ॥ तदधिकैरथ लालनकौशलैः प्रणयिनीमधिकं सुखयन्निमाम् । अयि मुकुन्द
    भवच्चरितानि नः प्रगदतां गदतान्तिमपाकुरु ॥
