id: sree-tulasi-ashtottara-satanaama-stotram
category: stotram
name:
  english: Sree Tulasi Ashtottara Satanaama Stotram
content:
  english: om tulasyai namah | om pavanyai namah | om pujyayai namah | om brindavananivasinyai namah |
    om jnanadatryai namah | om jnanamayyai namah | om nirmalayai namah | om sarvapujitayai namah | om
    satyai namah | om pativratayai namah | | om brindayai namah | om kshirabdhimathanodbhavayai namah
    | om krishnavarnayai namah | om rogahantryai namah | om trivarnayai namah | om sarvakamadayai namah
    | om lakshmisakhyai namah | om nityashuddhayai namah | om sudatyai namah | om bhumipavanyai namah
    | | om haridrannaikaniratayai namah | om haripadakritalayayai namah | om pavitrarupinyai namah | om
    dhanyayai namah | om sugandhinyai namah | om amritodbhavayai namah | om suruparogyadayai namah | om
    tushtayai namah | om shaktitritayarupinyai namah | om devyai namah | | om devarshisamstutyayai namah
    | om kantayai namah | om vishnumanahpriyayai namah | om bhutavetalabhitighnyai namah | om mahapatakanashinyai
    namah | om manorathapradayai namah | om medhayai namah | om kantyai namah | om vijayadayinyai namah
    | om shankhacakragadapadmadharinyai namah | | om kamarupinyai namah | om apavargapradayai namah |
    om shyamayai namah | om krishamadhyayai namah | om sukeshinyai namah | om vaikunthavasinyai namah
    | om nandayai namah | om bimboshthyai namah | om kokilasvarayai namah | om kapilayai namah | | om
    nimnagajanmabhumyai namah | om ayushyadayinyai namah | om vanarupayai namah | om duhkhanashinyai namah
    | om avikarayai namah | om caturbhujayai namah | om garutmadvahanayai namah | om shantayai namah |
    om dantayai namah | om vighnanivarinyai namah | | om shrivishnumulikayai namah | om pushtyai namah
    | om trivargaphaladayinyai namah | om mahashaktyai namah | om mahamayayai namah | om lakshmivanisupujitayai
    namah | om sumangalyarcanapritayai namah | om saumangalyavivardhinyai namah | om caturmasyotsavaradhyayai
    namah | om vishnusannidhyadayinyai namah | | om utthanadvadashipujyayai namah | om sarvadevaprapujitayai
    namah | om gopiratipradayai namah | om nityayai namah | om nirgunayai namah | om parvatipriyayai namah
    | om apamrityuharayai namah | om radhapriyayai namah | om mrigavilocanayai namah | om amlanayai namah
    | | om hamsagamanayai namah | om kamalasanavanditayai namah | om bhulokavasinyai namah | om shuddhayai
    namah | om ramakrishnadipujitayai namah | om sitapujyayai namah | om ramamanahpriyayai namah | om
    nandanasamsthitayai namah | om sarvatirthamayyai namah | om muktayai namah | | om lokasrishtividhayinyai
    namah | om pratardrishyayai namah | om glanihantryai namah | om vaishnavyai namah | om sarvasiddhidayai
    namah | om narayanyai namah | om santatidayai namah | om mulamriddharipavanyai namah | om ashokavanikasamsthayai
    namah | om sitadhyatayai namah | | om nirashrayayai namah | om gomatisarayutiraropitayai namah | om
    kutilalakayai namah | om apatrabhakshyapapaghnyai namah | om danatoyavishuddhidayai namah | om shrutidharanasupritayai
    namah | om shubhayai namah | om sarveshtadayinyai namah | iti shri tulasi ashtottarashatanamavalih
    |
  devanagari: ॐ तुलस्यै नमः । ॐ पावन्यै नमः । ॐ पूज्यायै नमः । ॐ बृन्दावननिवासिन्यै नमः । ॐ ज्ञानदात्र्यै
    नमः । ॐ ज्ञानमय्यै नमः । ॐ निर्मलायै नमः । ॐ सर्वपूजितायै नमः । ॐ सत्यै नमः । ॐ पतिव्रतायै नमः । ।
    ॐ बृन्दायै नमः । ॐ क्षीराब्धिमथनोद्भवायै नमः । ॐ कृष्णवर्णायै नमः । ॐ रोगहन्त्र्यै नमः । ॐ त्रिवर्णायै
    नमः । ॐ सर्वकामदायै नमः । ॐ लक्ष्मीसख्यै नमः । ॐ नित्यशुद्धायै नमः । ॐ सुदत्यै नमः । ॐ भूमिपावन्यै
    नमः । । ॐ हरिद्रान्नैकनिरतायै नमः । ॐ हरिपादकृतालयायै नमः । ॐ पवित्ररूपिण्यै नमः । ॐ धन्यायै नमः ।
    ॐ सुगन्धिन्यै नमः । ॐ अमृतोद्भवायै नमः । ॐ सुरूपारोग्यदायै नमः । ॐ तुष्टायै नमः । ॐ शक्तित्रितयरूपिण्यै
    नमः । ॐ देव्यै नमः । । ॐ देवर्षिसंस्तुत्यायै नमः । ॐ कान्तायै नमः । ॐ विष्णुमनःप्रियायै नमः । ॐ भूतवेतालभीतिघ्न्यै
    नमः । ॐ महापातकनाशिन्यै नमः । ॐ मनोरथप्रदायै नमः । ॐ मेधायै नमः । ॐ कान्त्यै नमः । ॐ विजयदायिन्यै
    नमः । ॐ शङ्खचक्रगदापद्मधारिण्यै नमः । । ॐ कामरूपिण्यै नमः । ॐ अपवर्गप्रदायै नमः । ॐ श्यामायै नमः ।
    ॐ कृशमध्यायै नमः । ॐ सुकेशिन्यै नमः । ॐ वैकुण्ठवासिन्यै नमः । ॐ नन्दायै नमः । ॐ बिम्बोष्ठ्यै नमः ।
    ॐ कोकिलस्वरायै नमः । ॐ कपिलायै नमः । । ॐ निम्नगाजन्मभूम्यै नमः । ॐ आयुष्यदायिन्यै नमः । ॐ वनरूपायै
    नमः । ॐ दुःखनाशिन्यै नमः । ॐ अविकारायै नमः । ॐ चतुर्भुजायै नमः । ॐ गरुत्मद्वाहनायै नमः । ॐ शान्तायै
    नमः । ॐ दान्तायै नमः । ॐ विघ्ननिवारिण्यै नमः । । ॐ श्रीविष्णुमूलिकायै नमः । ॐ पुष्ट्यै नमः । ॐ त्रिवर्गफलदायिन्यै
    नमः । ॐ महाशक्त्यै नमः । ॐ महामायायै नमः । ॐ लक्ष्मीवाणीसुपूजितायै नमः । ॐ सुमङ्गल्यर्चनप्रीतायै नमः
    । ॐ सौमङ्गल्यविवर्धिन्यै नमः । ॐ चातुर्मास्योत्सवाराध्यायै नमः । ॐ विष्णुसान्निध्यदायिन्यै नमः । ।
    ॐ उत्थानद्वादशीपूज्यायै नमः । ॐ सर्वदेवप्रपूजितायै नमः । ॐ गोपीरतिप्रदायै नमः । ॐ नित्यायै नमः । ॐ
    निर्गुणायै नमः । ॐ पार्वतीप्रियायै नमः । ॐ अपमृत्युहरायै नमः । ॐ राधाप्रियायै नमः । ॐ मृगविलोचनायै
    नमः । ॐ अम्लानायै नमः । । ॐ हंसगमनायै नमः । ॐ कमलासनवन्दितायै नमः । ॐ भूलोकवासिन्यै नमः । ॐ शुद्धायै
    नमः । ॐ रामकृष्णादिपूजितायै नमः । ॐ सीतापूज्यायै नमः । ॐ राममनःप्रियायै नमः । ॐ नन्दनसंस्थितायै नमः
    । ॐ सर्वतीर्थमय्यै नमः । ॐ मुक्तायै नमः । । ॐ लोकसृष्टिविधायिन्यै नमः । ॐ प्रातर्दृश्यायै नमः । ॐ
    ग्लानिहन्त्र्यै नमः । ॐ वैष्णव्यै नमः । ॐ सर्वसिद्धिदायै नमः । ॐ नारायण्यै नमः । ॐ सन्ततिदायै नमः
    । ॐ मूलमृद्धारिपावन्यै नमः । ॐ अशोकवनिकासंस्थायै नमः । ॐ सीताध्यातायै नमः । । ॐ निराश्रयायै नमः ।
    ॐ गोमतीसरयूतीररोपितायै नमः । ॐ कुटिलालकायै नमः । ॐ अपात्रभक्ष्यपापघ्न्यै नमः । ॐ दानतोयविशुद्धिदायै
    नमः । ॐ श्रुतिधारणसुप्रीतायै नमः । ॐ शुभायै नमः । ॐ सर्वेष्टदायिन्यै नमः । इति श्री तुलसी अष्टोत्तरशतनामावलिः
    ।
