id: nikamadevakhyadvijakritambalakrishnastotram
category: stotram
name:
  english: nikamadevakhyadvijakritambalakrishnastotram
  devanagari: निकामदेवाख्यद्विजकृतंबालकृष्णस्तोत्रम्
content:
  english: '| namo''ksharanivasaya namo golokavasine || 63|| namo vaikunthanathaya namah shripuravasine
    | namo lalitakantaya sarvakantaya te namah || 64|| balayoginikantaya badrikantaya te namah | nikamadevanathaya
    vasudevaya te namah || 65|| namo''mritanivasaya namo''vyakritavasine | namah kailasavasaya hiranyagarbhavasine
    || 66|| namah siddhadhivasaya namah suradivasine | namah pitrinivasaya namo manavarupine || 67|| namah
    sarvanivasaya namo madatmavasine | sureshvarihridisthaya namo''nantasvarupine || 68|| namo dehendriyapranantaratmavasine
    sada | namaste paramananda namaste jnanasambhrita || 69|| namaste jnanavijnanaprada shripurushottama
    | namaste vishvakridvishno namaste sarvakarana || 70|| namaste gopagopisha namah sarvarthasadhaka
    | namaste''nugrahadatarnamaste mokshada prabho || 71|| jaya krishna jaya vishno mama''bhayada madhava
    | jaya shanta cidananda saccidananda keshava || 72|| jaya jiva jayada tvam jaya sakshajjanardana |
    jaya shastradisannyastabijagarbhadyupasana || 73|| tvam gurustvam pita bhrata suhridbandhuh prasurmama
    | tvam mokshastvam paranandastvam me sarvasvamacyuta || 74|| tvamuddharta ca pata ca neta tvam viratirbhavan
    | jagat sarvam tava ruparupitam samprakashate || 75|| tvam parabrahma bhagavan devadyaistu durasadah
    | maya tvasaditashca''tra balayoginivaibhavat || 76|| kastvam janati catmesha muktagamyam paratparam
    | sanatanapumamsam tam puranapurushottamam || 77|| param rupamajanto divaukaso maharshayah | avataramayimurtiste
    bhajanti sugocarah || 78|| avatara bhajante tvam pumamsamavatarinam | narayana asankhyastvam bhajante
    paramayanam || 79|| narayanyashca muktanyastvam bhajante param patim | santo muktastvam bhajante sarvavasthasu
    satpatim || 80|| tava''jnanena bhagavan manushadinisargatah | kshantumarhasi sarvam me yatkritam na
    kritam tava || 81|| sarvavasthasu sarvatra sarvakaleshu sarvatha | acala tu hare bhaktistem''ghriyuge''stu
    me prabho || 82|| pritistvayyeva satatam bhavatvatyantiki mama | sarvakamaphaladatastvayi bhaktirdridhastu
    me || 83|| stotram kartumanantasya kah shaknoti tu manavah | tathapi vyapritam vakyam kshamasva natha
    te namah || 84|| purushottamayogena nirbhayatvam prajayate | tava yogena purushah purushottamatam
    vrajet || 85|| adhanyo jayate dhanyastvasadhuh sadhutam vrajet | abhagyo bhagyavan syacca te stavat
    purushottama || 86|| api lokabahishkarya yadi te sharanam gatah | sadhushila hi te sarve jayante panktipavanah
    || 87|| yesham sarvadhipe krishne bhaktiravyabhicarini | api candalakarmanaste''pi viprottamottamah
    || 88|| api shaucasamacarah krishne te sangavarjitah | shmashanavasaste sarve sarvakilbishasambhritah
    || 89|| tava dhyanapara ye ca tava pujaparayanah | tava prasadabhoktaraste sada vighasashinah || 90||
    aradhya satatam tvam shriharim sarvasukhapradam | prapya tvam paramatmanameshtavyam navashishyate
    || 91|| sadhubhishcintyate yashca sadhvibhih kamyate tu yah | piyate yogamapannairyah sa krishno''stu
    me hridi || 92|| bhavapushpaih pujayami shraddhanjaliprado''smi ca | atmanam dakshinam kritva''rpayami
    te pareshvara || 93|| yatha sarpih sharirastham gavam na kurute balam | nirgatam karmasamyuktam dattam
    tasam balapradam || 94|| tatha tvam hridayastho''pi manavanam balaya na | tvameva nirgatah sakshadbhuto
    balaya vidyase || 95|| vina''''radhanaya krishna tvam kripavashago mama | pratyaksham manavam rupam
    drishtam narayanacyuta || 96|| sadaiva sevitam capi divyam rupam pradarshaya | yadyaham patramasmyatra
    kripapatram bhavami cet || 97|| vipratvam me gatam capi tvayyeva tatsamarpitam | muktatvam vartate
    me cet sarvamshe tava bhaktiman || 98|| evam shribadaridevi prarthitah parameshvarah | kripayaiva
    bhusuraya divyam rupamadarshayat || 99|| aksharastham ca''vatarairasankhyairaprapuritam | muktairmuktanikabhishca
    sevitam kamaladibhih || 100|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya caturthakhande
    26'
  devanagari: । नमोऽक्षरनिवासाय नमो गोलोकवासिने ॥ ६३॥ नमो वैकुण्ठनाथाय नमः श्रीपुरवासिने । नमो ललिताकान्ताय
    सर्वकान्ताय ते नमः ॥ ६४॥ बालयोगिनीकान्ताय बद्रीकान्ताय ते नमः । निकामदेवनाथाय वासुदेवाय ते नमः ॥ ६५॥
    नमोऽमृतनिवासाय नमोऽव्याकृतवासिने । नमः कैलासवासाय हिरण्यगर्भवासिने ॥ ६६॥ नमः सिद्धाधिवासाय नमः सुरादिवासिने
    । नमः पितृनिवासाय नमो मानवरूपिणे ॥ ६७॥ नमः सर्वनिवासाय नमो मदात्मवासिने । सुरेश्वरीहृदिस्थाय नमोऽनन्तस्वरूपिणे
    ॥ ६८॥ नमो देहेन्द्रियप्राणान्तरात्मवासिने सदा । नमस्ते परमानन्द नमस्ते ज्ञानसम्भृत ॥ ६९॥ नमस्ते ज्ञानविज्ञानप्रद
    श्रीपुरुषोत्तम । नमस्ते विश्वकृद्विष्णो नमस्ते सर्वकारण ॥ ७०॥ नमस्ते गोपगोपीश नमः सर्वार्थसाधक । नमस्तेऽनुग्रहदातर्नमस्ते
    मोक्षद प्रभो ॥ ७१॥ जय कृष्ण जय विष्णो ममाऽभयद माधव । जय शान्त चिदानन्द सच्चिदानन्द केशव ॥ ७२॥ जय जीव
    जयद त्वं जय साक्षाज्जनार्दन । जय शास्त्रादिसन्न्यस्तबीजगर्भाद्युपासन ॥ ७३॥ त्वं गुरुस्त्वं पिता भ्राता
    सुहृद्बन्धुः प्रसूर्मम । त्वं मोक्षस्त्वं परानन्दस्त्वं मे सर्वस्वमच्युत ॥ ७४॥ त्वमुद्धर्ता च पाता
    च नेता त्वं विरतिर्भवान् । जगत् सर्वं तव रूपरूपितं सम्प्रकाशते ॥ ७५॥ त्वं परब्रह्म भगवन् देवाद्यैस्तु
    दुरासदः । मया त्वासादितश्चाऽत्र बालयोगिनीवैभवात् ॥ ७६॥ कस्त्वां जानाति चात्मेश मुक्तगम्यं परात्परम्
    । सनातनपुमांसं तं पुराणपुरुषोत्तमम् ॥ ७७॥ परं रूपमजान्तो दिवौकसो महर्षयः । अवतारमयीमूर्तीस्ते भजन्ति
    सुगोचराः ॥ ७८॥ अवतारा भजन्ते त्वां पुमांसमवतारिणम् । नारायणा असङ्ख्यास्त्वां भजन्ते परमायणम् ॥ ७९॥
    नारायण्यश्च मुक्तान्यस्त्वां भजन्ते परं पतिम् । सन्तो मुक्तास्त्वां भजन्ते सर्वावस्थासु सत्पतिम् ॥
    ८०॥ तवाऽज्ञानेन भगवन् मानुषादिनिसर्गतः । क्षन्तुमर्हसि सर्वं मे यत्कृतं न कृतं तव ॥ ८१॥ सर्वावस्थासु
    सर्वत्र सर्वकालेषु सर्वथा । अचला तु हरे भक्तिस्तेंऽघ्रियुगेऽस्तु मे प्रभो ॥ ८२॥ प्रीतिस्त्वय्येव सततं
    भवत्वात्यन्तिकी मम । सर्वकामफलदातस्त्वयि भक्तिर्दृढास्तु मे ॥ ८३॥ स्तोत्रं कर्तुमनन्तस्य कः शक्नोति
    तु मानवः । तथापि व्यापृतं वाक्यं क्षमस्व नाथ ते नमः ॥ ८४॥ पुरुषोत्तमयोगेन निर्भयत्वं प्रजायते । तव
    योगेन पुरुषः पुरुषोत्तमतां व्रजेत् ॥ ८५॥ अधन्यो जायते धन्यस्त्वसाधुः साधुतां व्रजेत् । अभाग्यो भाग्यवान्
    स्याच्च ते स्तवात् पुरुषोत्तम ॥ ८६॥ अपि लोकबहिष्कार्या यदि ते शरणं गताः । साधुशीला हि ते सर्वे जायन्ते
    पङ्क्तिपावनाः ॥ ८७॥ येषां सर्वाधिपे कृष्णे भक्तिरव्यभिचारिणी । अपि चाण्डालकर्माणस्तेऽपि विप्रोत्तमोत्तमाः
    ॥ ८८॥ अपि शौचसमाचाराः कृष्णे ते सङ्गवर्जिताः । श्मशानवासास्ते सर्वे सर्वकिल्बिषसम्भृताः ॥ ८९॥ तव ध्यानपरा
    ये च तव पूजापरायणाः । तव प्रसादभोक्तारस्ते सदा विघसाशिनः ॥ ९०॥ आराध्य सततं त्वां श्रीहरिं सर्वसुखप्रदम्
    । प्राप्य त्वां परमात्मानमेष्टव्यं नावशिष्यते ॥ ९१॥ साधुभिश्चिन्त्यते यश्च साध्वीभिः काम्यते तु यः
    । पीयते योगमापन्नैर्यः स कृष्णोऽस्तु मे हृदि ॥ ९२॥ भावपुष्पैः पूजयामि श्रद्धाञ्जलिप्रदोऽस्मि च । आत्मानं
    दक्षिणां कृत्वाऽर्पयामि ते परेश्वर ॥ ९३॥ यथा सर्पिः शरीरस्थं गवां न कुरुते बलम् । निर्गतं कर्मसंयुक्तं
    दत्तं तासां बलप्रदम् ॥ ९४॥ तथा त्वं हृदयस्थोऽपि मानवानां बलाय न । त्वमेव निर्गतः साक्षाद्भूतो बलाय
    विद्यसे ॥ ९५॥ विनाऽऽराधनया कृष्ण त्वं कृपावशगो मम । प्रत्यक्षं मानवं रूपं दृष्टं नारायणाच्युत ॥ ९६॥
    सदैव सेवितं चापि दिव्यं रूपं प्रदर्शय । यद्यहं पात्रमस्म्यत्र कृपापात्रं भवामि चेत् ॥ ९७॥ विप्रत्वं
    मे गतं चापि त्वय्येव तत्समर्पितम् । मुक्तत्वं वर्तते मे चेत् सर्वांशे तव भक्तिमान् ॥ ९८॥ एवं श्रीबदरीदेवि
    प्रार्थितः परमेश्वरः । कृपयैव भूसुराय दिव्यं रूपमदर्शयत् ॥ ९९॥ अक्षरस्थं चाऽवतारैरसङ्ख्यैराप्रपूरितम्
    । मुक्तैर्मुक्तानिकाभिश्च सेवितं कमलादिभिः ॥ १००॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    चतुर्थखण्डे २६
