id: taropanishatatharvaveda
category: upanishad
name:
  english: taropanishatatharvaveda
  devanagari: तारोपनिषतथर्ववेद
content:
  english: taropanishat atharvavediya om atha taropanishat | om tatsat | brahmatadrupam prakritiparam
    gagananabham tatparam paramam mahatsatyam tadaham hrinkaram raktavarnam mannabhistrinkaram pingalabham
    hunkaram maddhridayarupam vishadabham bhumandalam phatkaram dhumravarnam madkhadgamonkarajvaladrupam
    me mastakam veda maddhastashcandrarkanala mannetre divanaktam matpadau sandhye matkarnau samvatsaro
    madudaram shvetakrishnapakshau matparshvai varartavo madangulyo vidya mannakhah pavako manmukham mahi
    madrasana dyaurmanmukham gaganam madhridayam bhaktirmama carmarasam madrudhiram cannam vasamsi phalani
    nirahankara asthini sudhamanmajja sthavarani madromani pataladilokau matkucau brahmanadam mannadyo
    jnanam manmanah kshamabuddhih shunyam madasanam nakshatrani madbhushanani || etadvairatakam madvapuh
    | madujvalam sattvam bindusvarupam mahonkarasvarupajjyotirmayam viddhi | shira ugrataram mahogram
    nilam ghanamekajatam mahamayam prakritim mam viditva yo japati madrupani yo vetti manmantram yo japati
    madrupakalpitam yo japati madrupani yo vetti manmantram yo japati madrupakalpatam yo japati bhagam
    bhajati nirvikalpah sadhakah sada madrupo bhavati || sarvani karmani sadhyani
  devanagari: तारोपनिषत् अथर्ववेदीय ॐ अथ तारोपनिषत् । ॐ तत्सत् । ब्रह्मतद्रूपं प्रकृतिपरं गगननाभं तत्परं
    परमं महत्सत्यं तदहं ह्रीङ्कारं रक्तवर्णं मन्नाभिस्त्रीङ्कारं पिङ्गलाभं हूङ्कारं मद्धृदयरूपं विशदाभं
    भूमण्डलं फट्कारं धूम्रवर्णं मद्खड्गमोङ्कारज्वलद्रूपं मे मस्तकं वेदा मद्धस्ताश्चन्द्रार्कानला मन्नेत्रे
    दिवानक्तं मत्पादौ सन्ध्ये मत्कर्णौ संवत्सरो मदुदरं श्वेतकृष्णपक्षौ मत्पार्श्वै वारर्तवो मदङ्गुल्यो
    विद्या मन्नखाः पावको मन्मुखं मही मद्रसना द्यौर्मन्मुखं गगनं मधृदयं भक्तिर्मम चर्मरसं मद्रुधिरं चान्नं
    वासांसि फलानि निरहङ्कारा अस्थीनि सुधामन्मज्जा स्थावराणि मद्रोमाणि पातालादिलोकौ मत्कुचौ ब्रह्मनादं
    मन्नाड्यो ज्ञानं मन्मनः क्षमाबुद्धिः शून्यं मदासनं नक्षत्राणि मद्भूषणानि ॥ एतद्वैराटकं मद्वपुः । मदुज्वलं
    सत्त्वं बिन्दुस्वरूपं महोङ्कारस्वरूपज्ज्योतिर्मयं विद्धि । शिर उग्रतारां महोग्रां नीलां घनामेकजटां
    महामायां प्रकृतिं मां विदित्वा यो जपति मद्रूपाणि यो वेत्ति मन्मन्त्रं यो जपति मद्रूपकल्पितां यो जपति
    मद्रूपाणि यो वेत्ति मन्मन्त्रं यो जपति मद्रूपकल्पतां यो जपति भगं भजति निर्विकल्पः साधकः सदा मद्रूपो
    भवति ॥ सर्वाणि कर्माणि साध्यानि
