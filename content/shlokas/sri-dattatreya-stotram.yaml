id: sri-dattatreya-stotram
category: stotram
name:
  english: Sri Dattatreya Stotram
  devanagari: श्रीदत्तात्रेयस्तोत्रम्
content:
  english: shridattatreyastotram bhrigu rishi shridattatreyastotram bhrigu rishi balakaprabha imdranila
    jathilam | bhasmamgara gotvalam | shantamnada vilida cittapavanam | shardula canmambaram | brahmadyesanakadi
    visvari vridam | siddhaisamaradhitam | atreyam samupasmagheghrudimuda | gheyam sada yogibhih | digambaram
    bhasmavilepitamgam | cakram trishulam damarum gadamca | padmasanastam shashisujnanetram | dattatreyam
    gheya vabhishta siddhye | om namoshri gurumdattam | datta devam jagadagurum | nishkalam nirgunam vamde
    | dattatreyam namamyaham | brahmalokeshabhutesha | shamkha cakra gadadharam | panipatradharamdevam
    | dattatreyam namamyaham | suresha vamditam devam | trailokya lokavamditam | hariharatmakamdevam |
    dattatreyam namamyaham | nirmalam nila varnamca | sumdaram shamashobhitam | sulocanam vishalaksham
    | dattatreyam namamyaham | trishulam damarummala | jatamukutamamditam | mamditam kumdalam karne |
    dattatreyam namamyaham | vibhutimbhushitamdeham | hara keyura shobhitam | anantapranavakaram | shri
    dattatreyam namamyaham | prasannavadanam devam | bhukti bhukti pradayakam | janardhanam jagatranam
    | dattatreyam namamyaham | rajarajam nidacaram | kartaviryavarapradam | subhadrambhadrakalyanam |
    dattatreyam namamyaham | anasuya priyakaram | atriputram sureshvaram | vikhyata yoginammoksham | dattatreyam
    namamyaham | digambara tanumshreshtham | brahmasajjyapradesthitam | hamsamkham satmakam nityam | dattatreyam
    namamyaham | kadayogi kadabhogi | balalila vinodagraha | dashanairatnasamkashaihi | dattatreyam namamyaham
    | bhutavata bhavatrasaha | grahapidatathaivaca | daridryabhyasandvambhi | dattatreyam namamyaham |
    caturdashyam budhevare | janmamargashireshubhe | sarakam vipulam vamde | dattatreyam namamyaham |
    raktotpala dalampadam | sarvatirtham samud bhavam | vamditam yogi viddtbaihi | dattatreyam namamyaham
    | jnanadada prabhusakshadi | gatirmoksha pradayine | atmabhurishvara krishnaka | dattatreyam namamyaham
    | bhriguvinacitamidam | dattatreyaparayanam vidam | sakshat yad vccayam brahma | dattatreyam namamyaham
    | praninamsad bajantunam | karmapasha prabhamjanam | dattatreya stutistotram | sarvamkamanavapunyata
    | abudhrolaghade putram | dhanadhanya samanvitah | rajamajyobhavet lakshmih | aprapyam prapnujatanaraha
    | trisamdyamjapamanastu | dattatreya stutim sada | tasyaroga bhayamnasti | dirghayurvijayibhavete
    | kushmamda dakini bhakshaka | pishaca brahmarakshasah | stotrasya shrudamatrena | gacchamjatranasamshayah
    | etad dvishati shlokanam | avrittim puru vimshamtim | tasyavritti sahastrena | darshanamnatra samshayah
    |
  devanagari: श्रीदत्तात्रेयस्तोत्रम् भृगु ऋषी श्रीदत्तात्रेयस्तोत्रम् भृगु ऋषी बालाकप्रभा इंद्रनील जठीलं
    । भस्मांगरा गोत्वलं । शान्तंनाद विलीद चित्तपवनं । शार्दूल चन्मांबरं । ब्रह्मद्येसनकादी विस्वरी व्रीदं
    । सिद्धैसमाराधितं । आत्रेयं समूपास्मघेघ्रुदीमूदा । घेयं सदा योगीभीः । दिगंबरं भस्मविलेपितांगं । चक्रं
    त्रिशूलं डमरूं गदांच । पद्मासनस्तं शशीसूज्ञनेत्रं । दत्तात्रेयं घेय वभीष्ट सिद्ध्ये । ॐ नमोश्री गुरूंदत्तं
    । दत्त देवं जगदगुरुं । निष्कलं निर्गुणं वंदे । दत्तात्रेयं नमाम्यहं । ब्रह्मालोकेशभूतेश । शंख चक्र
    गदाधरं । पाणीपात्रधरंदेवं । दत्तात्रेयं नमाम्यहं । सुरेश वंदितं देवं । त्रैलोक्य लोकवंदितं । हरिहरात्मकंदेवं
    । दत्तात्रेयं नमाम्यहं । निर्मलं नील वर्णंच । सुंदरं शामशोभितं । सुलोचनं विशालाक्षं । दत्तात्रेयं
    नमाम्यहं । त्रिशूलं डमरूंमाला । जटामुकुटमंडितं । मंडितं कुंडलं कर्णे । दत्तात्रेयं नमाम्यहं । विभूतींभूषितंदेहं
    । हार केयूर शोभितं । अनन्तप्रणवाकारं । श्री दत्तात्रेयं नमाम्यहं । प्रसन्नवदनं देवं । भुक्ति भुक्ती
    प्रदायकं । जनार्धनम् जगत्राणं । दत्तात्रेयं नमाम्यहं । राजराजं निदाचारं । कार्तवीर्यवरप्रदं । सुभद्रंभद्रकल्याणम्
    । दत्तात्रेयं नमाम्यहं । अनसूया प्रियकरं । अत्रिपुत्रं सुरेश्वरं । विख्यात योगीनांमोक्षं । दत्तात्रेयं
    नमाम्यहं । दिगंबर तनूंश्रेष्ठं । ब्रह्मसज्ज्यप्रदेस्थितं । हंसंखं सात्मकं नित्यं । दत्तात्रेयं नमाम्यहं
    । कदायोगी कदाभोगी । बाललीला विनोदग्रह । दशनैरत्नसंकाशैही । दत्तात्रेयं नमाम्यहं । भूतवाता भवत्रासह
    । ग्रहपीडातथैवच । दरिद्र्यभ्यसन्द्वंभी । दत्तात्रेयं नमाम्यहं । चतुर्दश्यां बुधेवारे । जन्ममार्गशीरेशुभे
    । सारकं विपुलं वंदे । दत्तात्रेयं नमाम्यहं । रक्तोत्पल दलंपादं । सर्वतीर्थं समुद् भवं । वंदितं योगी
    विद्द्त्बैही । दत्तात्रेयं नमाम्यहं । ज्ञानदादा प्रभूसाक्षादी । गतिर्मोक्ष प्रदायिने । आत्मभूरीश्वर
    कृष्णक । दत्तात्रेयं नमाम्यहं । भृगूविनचितमिदं । दत्तात्रेयपारायणां विदं । साक्षात् यद् व्च्चयं ब्रह्मा
    । दत्तात्रेयं नमाम्यहं । प्राणीनांसद् बजन्तुनां । कर्मपाश प्रभंजनं । दत्तात्रेय स्तुतीस्तोत्रं । सर्वांकामानवापुण्यात
    । अबुध्रोलघदे पुत्रं । धनधान्य समन्वितः । राजमाज्योभवेत् लक्ष्मीः । अप्राप्यं प्राप्नुजातनरह । त्रिसंद्यंजपमानस्तु
    । दत्तात्रेय स्तुतीं सदा । तस्यरोग भयंनास्ती । दिर्घायुर्विजयीभवेते । कुष्मांड डाकिनी भक्षक । पिशाच
    ब्रह्मराक्षसः । स्तोत्रस्य श्रुदमात्रेण । गच्छंजत्रणसंशयः । एतद् द्विशती श्लोकानां । आवृत्तीं पुरु
    विंशंतीं । तस्यावृत्ती सहस्त्रेण । दर्शनंनात्र संशयः ।
