id: ramacandrapadukamantra
category: mantra
name:
  english: ramacandrapadukamantra
  devanagari: रामचन्द्रपादुकामन्त्र
content:
  english: lam prithvyatmane gandham kalpayami namah | ham akashatmane pushpam kalpayami namah | yam vayavyatmane
    dhupam kalpayami namah | ram vahnnyatmane dipam kalpayami namah | vam amritatmane naivedyam kalpayami
    namah | sam sarvatmane tambuladi sarvopacaran kalpayami namah | om aim hrim shrim hskhphrem hasakshamalavarayum
    | om aim hrim shrim shkhphrem sahakshamalavarayim | ram ramacandrasahajanandini ramacandrasahajanandini
    shripadukam pujayami namah | ramacandrasaha
  devanagari: लं पृथ्व्यात्मने गन्धं कल्पयामि नमः । हं आकाशात्मने पुष्पं कल्पयामि नमः । यं वायव्यात्मने
    धूपं कल्पयामि नमः । रं वह्न्न्यात्मने दीपं कल्पयामि नमः । वं अमृतात्मने नैवेद्यं कल्पयामि नमः । सं
    सर्वात्मने ताम्बूलादि सर्वोपचारान् कल्पयामि नमः । ॐ ऐं ह्रीं श्रीं ह्स्ख्फ्रें हसक्षमलवरयूम् । ॐ ऐं
    ह्रीं श्रीं स्ह्ख्फ्रें सहक्षमलवरयीम् । रां रामचन्द्रसहजानन्दिनी रामचन्द्रसहजानन्दिनी श्रीपादुकां
    पूजयामि नमः । रामचन्द्रसह
meaning: {}
