id: santana-gopala-stotram
category: stotram
name:
  english: Santana Gopala Stotram
content:
  english: om gopalaya vidmahe gopijana vallabhaya dhimahi | tanno gopalah pracodayat || om shrim hrim
    klim glaum devaki suta govinda vasudeva jagatpate dehi me tanayam krishna tvamaham sharanam gatah
    || bhurbhuvassuvarom | iti digvimokah || shrisham kamalapatraksham devakinandanam harim | sutasampraptaye
    krishnam namami madhusudanam || || namamyaham vasudevam sutasampraptaye harim | yashodankagatam balam
    gopalam nandanandanam || || asmakam putralabhaya govindam munivanditam | namamyaham vasudevam devakinandanam
    sada || || gopalam dimbhakam vande kamalapatimacyutam | putrasampraptaye krishnam namami yadupungavam
    || || putrakameshti phaladam kanjaksham kamalapatim | devakinandanam vande sutasampraptaye tvaham
    || padmapate padmanetra padmanabha janardana | dehi me tanayam shrisha vasudeva jagatpate || || yashodankagatam
    balam govindam munivanditam | ananta putralabhaya namami shrishamacyutam || bhutabhridbhavo bhutatma
    bhutabhavanah shripate devadevesha dinartirharanacyuta | govinda me sutam dehi namami tvam janardana
    || || bhaktakamada govinda bhaktaraksha shubhaprada | dehi me tanayam krishna rukminivallabha prabho
    || || rukmininatha sarvesha dehi me tanayam sada | bhaktamandara padmaksha tvamaham sharanam gatah
    || || devakisuta govinda vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || ||
    vasudeva jagadvandya shripate purushottama | dehi me tanayam krishna tvamaham sharanam gatah || ||
    kanjaksha kamalanatha parakarunikottama | dehi me tanayam krishna tvamaham sharanam gatah || || lakshmipate
    padmanabha mukunda munivandita | dehi me tanayam krishna tvamaham sharanam gatah || || karyakaranarupaya
    vasudevaya te sada | namami putralabhartham sukhadaya budhaya te || || rajivanetra shrirama ravanare
    hare kave | tubhyam namami devesha tanayam dehi me hare || putralabhaya bhajami tvam jagatpate | dehi
    me tanayam krishna vasudeva ramapate || || shrimanini manahari gopivastrapaharaka | dehi me tanayam
    krishna vasudeva jagatpate || || asmakam putrasampraptim kurushva yadunandana | ramapate vasudeva
    mukunda munivandita || || vasudeva sutam dehi tanayam dehi madhava | putram me dehi shrikrishna vatsam
    dehi mahaprabho || || dimbhakam dehi shrikrishna atmajam dehi raghava | bhaktamandara me dehi tanayam
    nandanandana || || nandanam dehi me krishna vasudeva jagatpate | kamalanatha govinda mukunda munivandita
    || || anyatha sharanam nasti tvameva sharanam mama | sutam dehi shriyam dehi shriyam putram pradehi
    me || || yashodastanyapanajnam pibantam yadunandanam | vande'ham putralabhartham kapilaksham harim
    sada || || nandanandana devesha nandanam dehi me prabho | ramapate vasudeva shriyam putram jagatpate
    || || putram shriyam shriyam putram putram me dehi madhava | asmakam dinavakyam ca || gopala dimbha
    govinda vasudeva ramapate | asmakam dimbhakam dehi shriyam dehi jagatpate || || madvanchitaphalam
    dehi devakinandanacyuta | manda putrarthitam dhanyam kurushva yadunandana || || yace'ham tvam shriyam
    putram dehi me putrasampadam | bhaktacintamane rama kalpavriksha mahaprabho || || atmajam nandanam
    putram kumaram dimbhakam sutam | arbhakam tanayam dehi sada me raghunandana || || vande santanagopalam
    madhavam bhaktakamadam | asmakam putrasampraptyai sada govindamacyutam || || onkarayuktam gopalam
    shriyuktam yadunandanam | klimyuktam devakiputram namami yadunayakam || || vasudeva mukundesha govinda
    madhavacyuta | dehi me tanayam krishna ramanatha mahaprabho || || rajivanetra govinda kapilaksha hare
    prabho | samasta kamyavarada dehi me tanayam sada || || padmanabha shyamapadma brindarupa jagadpate
    abjapadmanibha padmavrindarupa jagatpate || nandapala dharapala govinda yadunandana | dehi me tanayam
    krishna rukminivallabha prabho || || dasamandara govinda mukunda madhavacyuta | gopala pundarikaksha
    dehi me tanayam shriyam || || yadunayaka padmesha nandagopavadhusuta | dehi me tanayam krishna shriradha
    || asmakam vanchitam dehi dehi putram ramapate | stuvadam krishna sarvesha vasudeva jagatpate || ||
    ramahridayasambhara satyabhamamanahpriya | dehi me tanayam krishna rukminivallabha prabho || || candrasuryaksha
    govinda pundarikaksha madhava | asmakam bhagyasatputram dehi deva jagatpate || || karunyarupa padmaksha
    padmanabha samarcita | dehi me tanayam krishna devakinandanandana || || devakisuta shrinatha vasudeva
    jagatpate | samastakamaphalada dehi me tanayam sada || || bhaktamandara gambhira shankaracyuta madhava
    | dehi me tanayam gopa || shripate vasudevesha devakipriyanandana | bhaktamandara me dehi tanayam
    jagatam prabho || || jagannatha ramanatha bhuminatha dayanidhe | vasudevesha sarvesha dehi me tanayam
    prabho || || shrinatha kamalapatraksha vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam
    gatah || || dasamandara govinda bhaktacintamane prabho | dehi me tanayam krishna tvamaham sharanam
    gatah || || govinda pundarikaksha ramanatha mahaprabho | dehi me tanayam krishna tvamaham sharanam
    gatah || || shrinatha kamalapatraksha govinda madhusudana | satputraphala siddhyartham bhajami tvam
    janardana || || stanyam pibantam jananimukhambujam vilokya mandasmitamujjvalangam | sprishantamanyastanamangulibhih
    vande yashodankagatam mukundam || || yace'ham putrasantanam bhavantam padmalocana | dehi me tanayam
    krishna tvamaham sharanam gatah || || asmakam putrasampatte shcintayami jagatpate | shighram me dehi
    datavyam bhavata munivandita || || vasudeva jagannatha shripate purushottama | kuru mam putradattam
    ca krishna devendrapujitah || || kuru mam putradattam ca yashodapriyanandana | mahyam ca putrasantanam
    datavyam bhavata hare || || vasudeva jagannatha govinda devakisuta | dehi me tanayam rama kausalyapriyanandana
    || || padmapatraksha govinda vishno vamana madhava | dehi me tanayam sita || kanjaksha krishna devendra
    mandita munivandita | lakshmanagraja shrirama dehi me tanayam sada || || dehi me tanayam rama dasharathapriyanandana
    | sitanayaka kanjaksha mucukundavaraprada || || vibhishanaya ya lanka bhavata valiyata prabho vibhishanasyaya
    lanka pradatta bhavata pura | asmakam tatprakarena tanayam dehi madhava || || bhavadiyapadambhoje
    cintayami nirantaram | dehi me tanayam sita || rama matkamyavarada putrotpattiphalaprada | dehi me
    tanayam shrisha kamalasanavandita || || rama raghava sitesha lakshmananuja dehi me | bhagyavatputrasantanam
    dasharathatmaja shripate || || devakigarbhasanjata yashodapriyanandana | dehi me tanayam rama krishna
    gopala madhava || || krishna madhava govinda vamanacyuta shankara | dehi me tanayam shrisha gopabalakanayaka
    || || gopabala mahadhanya govindacyuta madhava | dehi me tanayam krishna vasudeva jagatpate || ||
    dishatu dishatu putram devakinandano'yam dishatu dishatu shighram bhagyavatputralabham | dishatu dishatu
    shrisho raghavo ramacandro dishatu dishatu putram vamshavistarahetoh || || dadatu mam vasudevohi |
    kumaro nandanah sita || rama raghava govinda devakisuta madhava | dehi me tanayam shrisha gopabalakanayaka
    || || vamshavistarakam putram dehi me madhusudana | sutam dehi sutam dehi tvamaham sharanam gatah
    || || mamabhishtasutam dehi kamsare madhavacyuta | sutam dehi sutam dehi tvamaham sharanam gatah ||
    kalpaparyantam tanayam dehi madhava | sutam dehi sutam dehi tvamaham sharanam gatah || || vidyavantam
    buddhimantam shrimantam tanayam sada | dehi me tanayam krishna devakinandanam sada || namami tvam
    padmanetra sutalabhaya kamadam | mukundam pundarikaksham govindam madhusudanam || || bhagavan krishna
    govinda sarvakamaphalaprada | dehi me tanayam svamin tvamaham sharanam gatah || || svamin tvam bhagavan
    rama krishna madhava kamada | dehi me tanayam nityam tvamaham sharanam gatah || || tanayam dehi govinda
    kanjaksha kamalapate | sutam dehi sutam dehi tvamaham sharanam gatah || || padmapate padmanetra padmajanaka
    madhava | sutam dehi sutam dehi tvamaham sharanam gatah || || shankhacakragadakhadga sharngapane ramapate
    | dehi me tanayam krishna tvamaham sharanam gatah || || narayana ramanatha rajivapatralocana | sutam
    me dehi devesha padmapadmanuvandita || || rama madhava govinda devakivaranandana | rukmininatha sarvesha
    naradadisurarcita || || devakisuta govinda vasudeva jagatpate | dehi me tanayam shrisha gopabalakanayaka
    || || munivandita govinda rukminivallabha prabho | dehi me tanayam shrisha || gopika lunapushpanam
    makaranda rathapriya gopikarjitapankejamarandasaktamanasa | dehi me tanayam shrisha || rrama hridaya
    rajiva lolamadhava kamada | ramahridaya pankejalola madhava kamada mamabhishtasutam dehi tvamaham
    sharanam gatah || || vasudeva ramanatha dasanam mangalaprada | dehi me tanayam krishna tvamaham sharanam
    gatah || || kalyanaprada govinda murare munivandita | dehi me tanayam shrisha || putraprada mukundesha
    rukminivallabha prabho | dehi me tanayam shrisha || pundarikaksha govinda vasudeva jagatpate | dehi
    me tanayam shrisha || dayanidhe vasudeva mukunda munivandita | dehi me tanayam shrisha || putrasampatpradataram
    govindam devapujitam | vandamahe sada krishnam putralabhapradayinam || || karunyanidhaye gopivallabhaya
    muraraye | namaste putralabhartham dehi me tanayam vibho || || namastasmai rameshaya rukminivallabhaya
    te | dehi me tanayam shrisha gopabalakanayaka || || namaste vasudevaya nityashrikamukaya ca | putradaya
    ca sarpendra || rangashayin ramanatha mangalaprada madhava | dehi me tanayam shrisha gopabalakanayaka
    || || dasasya me sutam dehi dinamandara raghava | sutam dehi sutam dehi putram dehi ramapate || ||
    yashodatanayabhishta putradanaratah sada | dehi me tanayam shrisha || madishtadeva govinda vasudeva
    janardana | dehi me tanayam shrisha || nitiman dhanavan putro vidyavamshca prajapate | bhagavamstvatkripayashca
    vasudevendrapujita || || yah pathet putrashatakam so'pi satputravan bhavet | shrivasudevakathitam
    stotraratnam sukhaya ca || || japakale pathennityam putralabham dhanam shriyam | aishvaryam rajasammanam
    sadyo yati na samshayah ||
  devanagari: ॐ गोपालाय विद्महे गोपीजन वल्लभाय धीमहि । तन्नो गोपालः प्रचोदयात् ॥ ॐ श्रीं ह्रीं क्लीं ग्लौं
    देवकी सुत गोविन्द वासुदेव जगत्पते देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ भूर्भुवस्सुवरोम् । इति दिग्विमोकः
    ॥ श्रीशं कमलपत्राक्षं देवकीनन्दनं हरिम् । सुतसम्प्राप्तये कृष्णं नमामि मधुसूदनम् ॥ ॥ नमाम्यहं वासुदेवं
    सुतसम्प्राप्तये हरिम् । यशोदाङ्कगतं बालं गोपालं नन्दनन्दनम् ॥ ॥ अस्माकं पुत्रलाभाय गोविन्दं मुनिवन्दितम्
    । नमाम्यहं वासुदेवं देवकीनन्दनं सदा ॥ ॥ गोपालं डिम्भकं वन्दे कमलापतिमच्युतम् । पुत्रसम्प्राप्तये कृष्णं
    नमामि यदुपुङ्गवम् ॥ ॥ पुत्रकामेष्टि फलदं कञ्जाक्षं कमलापतिम् । देवकीनन्दनं वन्दे सुतसम्प्राप्तये त्वहम्
    ॥ पद्मापते पद्मनेत्र पद्मनाभ जनार्दन । देहि मे तनयं श्रीश वासुदेव जगत्पते ॥ ॥ यशोदाङ्कगतं बालं गोविन्दं
    मुनिवन्दितम् । अनन्त पुत्रलाभाय नमामि श्रीशमच्युतम् ॥ भूतभृद्भावो भुतात्मा भूतभावनः श्रीपते देवदेवेश
    दीनार्तिर्हरणाच्युत । गोविन्द मे सुतं देहि नमामि त्वां जनार्दन ॥ ॥ भक्तकामद गोविन्द भक्तरक्ष शुभप्रद
    । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ॥ रुक्मिणीनाथ सर्वेश देहि मे तनयं सदा । भक्तमन्दार पद्माक्ष
    त्वामहं शरणं गतः ॥ ॥ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ वासुदेव
    जगद्वन्द्य श्रीपते पुरुषोत्तम । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ कञ्जाक्ष कमलानाथ परकारुणिकोत्तम
    । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ लक्ष्मीपते पद्मनाभ मुकुन्द मुनिवन्दित । देहि मे तनयं कृष्ण
    त्वामहं शरणं गतः ॥ ॥ कार्यकारणरूपाय वासुदेवाय ते सदा । नमामि पुत्रलाभार्थं सुखदाय बुधाय ते ॥ ॥ राजीवनेत्र
    श्रीराम रावणारे हरे कवे । तुभ्यं नमामि देवेश तनयं देहि मे हरे ॥ पुत्रलाभाय भजामि त्वां जगत्पते । देहि
    मे तनयं कृष्ण वासुदेव रमापते ॥ ॥ श्रीमानिनी मानहारि गोपीवस्त्रापहारक । देहि मे तनयं कृष्ण वासुदेव
    जगत्पते ॥ ॥ अस्माकं पुत्रसम्प्राप्तिं कुरुष्व यदुनन्दन । रमापते वासुदेव मुकुन्द मुनिवन्दित ॥ ॥ वासुदेव
    सुतं देहि तनयं देहि माधव । पुत्रं मे देहि श्रीकृष्ण वत्सं देहि महाप्रभो ॥ ॥ डिम्भकं देहि श्रीकृष्ण
    आत्मजं देहि राघव । भक्तमन्दार मे देहि तनयं नन्दनन्दन ॥ ॥ नन्दनं देहि मे कृष्ण वासुदेव जगत्पते । कमलानाथ
    गोविन्द मुकुन्द मुनिवन्दित ॥ ॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । सुतं देहि श्रियं देहि श्रियं पुत्रं
    प्रदेहि मे ॥ ॥ यशोदास्तन्यपानज्ञं पिबन्तं यदुनन्दनम् । वन्देऽहं पुत्रलाभार्थं कपिलाक्षं हरिं सदा ॥
    ॥ नन्दनन्दन देवेश नन्दनं देहि मे प्रभो । रमापते वासुदेव श्रियं पुत्रं जगत्पते ॥ ॥ पुत्रं श्रियं श्रियं
    पुत्रं पुत्रं मे देहि माधव । अस्माकं दीनवाक्यं च ॥ गोपाल डिम्भ गोविन्द वासुदेव रमापते । अस्माकं डिम्भकं
    देहि श्रियं देहि जगत्पते ॥ ॥ मद्वाञ्छितफलं देहि देवकीनन्दनाच्युत । मान्द पुत्रार्थितं धन्यं कुरुष्व
    यदुनन्दन ॥ ॥ याचेऽहं त्वां श्रियं पुत्रं देहि मे पुत्रसम्पदम् । भक्तचिन्तामणे राम कल्पवृक्ष महाप्रभो
    ॥ ॥ आत्मजं नन्दनं पुत्रं कुमारं डिम्भकं सुतम् । अर्भकं तनयं देहि सदा मे रघुनन्दन ॥ ॥ वन्दे सन्तानगोपालं
    माधवं भक्तकामदम् । अस्माकं पुत्रसम्प्राप्त्यै सदा गोविन्दमच्युतम् ॥ ॥ ओङ्कारयुक्तं गोपालं श्रीयुक्तं
    यदुनन्दनम् । क्लींयुक्तं देवकीपुत्रं नमामि यदुनायकम् ॥ ॥ वासुदेव मुकुन्देश गोविन्द माधवाच्युत । देहि
    मे तनयं कृष्ण रमानाथ महाप्रभो ॥ ॥ राजीवनेत्र गोविन्द कपिलाक्ष हरे प्रभो । समस्त काम्यवरद देहि मे तनयं
    सदा ॥ ॥ पद्मनाभ श्यामपद्म बृन्दरूप जगद्पते अब्जपद्मनिभ पद्मवृन्दरूप जगत्पते ॥ नन्दपाल धरापाल गोविन्द
    यदुनन्दन । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ॥ दासमन्दार गोविन्द मुकुन्द माधवाच्युत । गोपाल
    पुण्डरीकाक्ष देहि मे तनयं श्रियम् ॥ ॥ यदुनायक पद्मेश नन्दगोपवधूसुत । देहि मे तनयं कृष्ण श्रीराध ॥
    अस्माकं वाञ्छितं देहि देहि पुत्रं रमापते । स्तुवदाम् कृष्ण सर्वेश वासुदेव जगत्पते ॥ ॥ रमाहृदयसम्भार
    सत्यभामामनःप्रिय । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ॥ चन्द्रसूर्याक्ष गोविन्द पुण्डरीकाक्ष
    माधव । अस्माकं भाग्यसत्पुत्रं देहि देव जगत्पते ॥ ॥ कारुण्यरूप पद्माक्ष पद्मनाभ समर्चित । देहि मे तनयं
    कृष्ण देवकीनन्दनन्दन ॥ ॥ देवकीसुत श्रीनाथ वासुदेव जगत्पते । समस्तकामफलद देहि मे तनयं सदा ॥ ॥ भक्तमन्दार
    गम्भीर शङ्कराच्युत माधव । देहि मे तनयं गोप ॥ श्रीपते वासुदेवेश देवकीप्रियनन्दन । भक्तमन्दार मे देहि
    तनयं जगतां प्रभो ॥ ॥ जगन्नाथ रमानाथ भूमिनाथ दयानिधे । वासुदेवेश सर्वेश देहि मे तनयं प्रभो ॥ ॥ श्रीनाथ
    कमलपत्राक्ष वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ दासमन्दार गोविन्द भक्तचिन्तामणे
    प्रभो । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ गोविन्द पुण्डरीकाक्ष रमानाथ महाप्रभो । देहि मे तनयं
    कृष्ण त्वामहं शरणं गतः ॥ ॥ श्रीनाथ कमलपत्राक्ष गोविन्द मधुसूदन । सत्पुत्रफल सिद्ध्यर्थं भजामि त्वां
    जनार्दन ॥ ॥ स्तन्यं पिबन्तं जननीमुखाम्बुजं विलोक्य मन्दस्मितमुज्ज्वलाङ्गम् । स्पृशन्तमन्यस्तनमङ्गुलीभिः
    वन्दे यशोदाङ्कगतं मुकुन्दम् ॥ ॥ याचेऽहं पुत्रसन्तानं भवन्तं पद्मलोचन । देहि मे तनयं कृष्ण त्वामहं
    शरणं गतः ॥ ॥ अस्माकं पुत्रसम्पत्ते श्चिन्तयामि जगत्पते । शीघ्रं मे देहि दातव्यं भवता मुनिवन्दित ॥
    ॥ वासुदेव जगन्नाथ श्रीपते पुरुषोत्तम । कुरु मां पुत्रदत्तं च कृष्ण देवेन्द्रपूजितः ॥ ॥ कुरु मां पुत्रदत्तं
    च यशोदाप्रियनन्दन । मह्यं च पुत्रसन्तानं दातव्यं भवता हरे ॥ ॥ वासुदेव जगन्नाथ गोविन्द देवकीसुत । देहि
    मे तनयं राम कौसल्याप्रियनन्दन ॥ ॥ पद्मपत्राक्ष गोविन्द विष्णो वामन माधव । देहि मे तनयं सीता ॥ कञ्जाक्ष
    कृष्ण देवेन्द्र मण्डित मुनिवन्दित । लक्ष्मणाग्रज श्रीराम देहि मे तनयं सदा ॥ ॥ देहि मे तनयं राम दशरथप्रियनन्दन
    । सीतानायक कञ्जाक्ष मुचुकुन्दवरप्रद ॥ ॥ विभीषणाय या लङ्का भवता वलीयता प्रभो विभीषणस्यया लङ्का प्रदत्ता
    भवता पुरा । अस्माकं तत्प्रकारेण तनयं देहि माधव ॥ ॥ भवदीयपदाम्भोजे चिन्तयामि निरन्तरम् । देहि मे तनयं
    सीता ॥ राम मत्काम्यवरद पुत्रोत्पत्तिफलप्रद । देहि मे तनयं श्रीश कमलासनवन्दित ॥ ॥ राम राघव सीतेश लक्ष्मणानुज
    देहि मे । भाग्यवत्पुत्रसन्तानं दशरथात्मज श्रीपते ॥ ॥ देवकीगर्भसञ्जात यशोदाप्रियनन्दन । देहि मे तनयं
    राम कृष्ण गोपाल माधव ॥ ॥ कृष्ण माधव गोविन्द वामनाच्युत शङ्कर । देहि मे तनयं श्रीश गोपबालकनायक ॥ ॥
    गोपबाल महाधन्य गोविन्दाच्युत माधव । देहि मे तनयं कृष्ण वासुदेव जगत्पते ॥ ॥ दिशतु दिशतु पुत्रं देवकीनन्दनोऽयं
    दिशतु दिशतु शीघ्रं भाग्यवत्पुत्रलाभम् । दिशतु दिशतु श्रीशो राघवो रामचन्द्रो दिशतु दिशतु पुत्रं वंशविस्तारहेतोः
    ॥ ॥ ददातु मां वासुदेवोही । कुमारो नन्दनः सीता ॥ राम राघव गोविन्द देवकीसुत माधव । देहि मे तनयं श्रीश
    गोपबालकनायक ॥ ॥ वंशविस्तारकं पुत्रं देहि मे मधुसूदन । सुतं देहि सुतं देहि त्वामहं शरणं गतः ॥ ॥ ममाभीष्टसुतं
    देहि कंसारे माधवाच्युत । सुतं देहि सुतं देहि त्वामहं शरणं गतः ॥ कल्पपर्यन्तं तनयं देहि माधव । सुतं
    देहि सुतं देहि त्वामहं शरणं गतः ॥ ॥ विद्यावन्तं बुद्धिमन्तं श्रीमन्तं तनयं सदा । देहि मे तनयं कृष्ण
    देवकीनन्दनं सदा ॥ नमामि त्वां पद्मनेत्र सुतलाभाय कामदम् । मुकुन्दं पुण्डरीकाक्षं गोविन्दं मधुसूदनम्
    ॥ ॥ भगवन् कृष्ण गोविन्द सर्वकामफलप्रद । देहि मे तनयं स्वामिन् त्वामहं शरणं गतः ॥ ॥ स्वामिन् त्वं भगवन्
    राम कृष्ण माधव कामद । देहि मे तनयं नित्यं त्वामहं शरणं गतः ॥ ॥ तनयं देहि गोविन्द कञ्जाक्ष कमलापते
    । सुतं देहि सुतं देहि त्वामहं शरणं गतः ॥ ॥ पद्मापते पद्मनेत्र पद्मजनक माधव । सुतं देहि सुतं देहि त्वामहं
    शरणं गतः ॥ ॥ शङ्खचक्रगदाखड्ग शार्ङ्गपाणे रमापते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ नारायण रमानाथ
    राजीवपत्रलोचन । सुतं मे देहि देवेश पद्मपद्मानुवन्दित ॥ ॥ राम माधव गोविन्द देवकीवरनन्दन । रुक्मिणीनाथ
    सर्वेश नारदादिसुरार्चित ॥ ॥ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं श्रीश गोपबालकनायक ॥ ॥
    मुनिवन्दित गोविन्द रुक्मिणीवल्लभ प्रभो । देहि मे तनयं श्रीश ॥ गोपिका लूनपुष्पणां मकरन्द रथप्रिय गोपिकार्जितपङ्केजमरन्दासक्तमानस
    । देहि मे तनयं श्रीश ॥ र्रमा हृदय राजीव लोलमाधव कामद । रमाहृदय पङ्केजलोल माधव कामद ममाभीष्टसुतं देहि
    त्वामहं शरणं गतः ॥ ॥ वासुदेव रमानाथ दासानां मङ्गलप्रद । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॥ कल्याणप्रद
    गोविन्द मुरारे मुनिवन्दित । देहि मे तनयं श्रीश ॥ पुत्रप्रद मुकुन्देश रुक्मिणीवल्लभ प्रभो । देहि मे
    तनयं श्रीश ॥ पुण्डरीकाक्ष गोविन्द वासुदेव जगत्पते । देहि मे तनयं श्रीश ॥ दयानिधे वासुदेव मुकुन्द मुनिवन्दित
    । देहि मे तनयं श्रीश ॥ पुत्रसम्पत्प्रदातारं गोविन्दं देवपूजितम् । वन्दामहे सदा कृष्णं पुत्रलाभप्रदायिनम्
    ॥ ॥ कारुण्यनिधये गोपीवल्लभाय मुरारये । नमस्ते पुत्रलाभार्थं देहि मे तनयं विभो ॥ ॥ नमस्तस्मै रमेशाय
    रुक्मिणीवल्लभाय ते । देहि मे तनयं श्रीश गोपबालकनायक ॥ ॥ नमस्ते वासुदेवाय नित्यश्रीकामुकाय च । पुत्रदाय
    च सर्पेन्द्र ॥ रङ्गशायिन् रमानाथ मङ्गलप्रद माधव । देहि मे तनयं श्रीश गोपबालकनायक ॥ ॥ दासस्य मे सुतं
    देहि दीनमन्दार राघव । सुतं देहि सुतं देहि पुत्रं देहि रमापते ॥ ॥ यशोदातनयाभीष्ट पुत्रदानरतः सदा ।
    देहि मे तनयं श्रीश ॥ मदिष्टदेव गोविन्द वासुदेव जनार्दन । देहि मे तनयं श्रीश ॥ नीतिमान् धनवान् पुत्रो
    विद्यावांश्च प्रजापते । भगवंस्त्वत्कृपायाश्च वासुदेवेन्द्रपूजित ॥ ॥ यः पठेत् पुत्रशतकं सोऽपि सत्पुत्रवान्
    भवेत् । श्रीवासुदेवकथितं स्तोत्ररत्नं सुखाय च ॥ ॥ जपकाले पठेन्नित्यं पुत्रलाभं धनं श्रियम् । ऐश्वर्यं
    राजसम्मानं सद्यो याति न संशयः ॥
