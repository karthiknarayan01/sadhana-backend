id: vishwakarma-suktam
category: stotram
name:
  english: Vishwakarma Suktam
  devanagari: विश्वकर्मासूक्तम् (ऋग्वेद-यजुर्वेदान्तर्गतम्)
content:
  english: rigveda ke dasham mandala ke sukta 81 va 82 donom sukta vishvakarma sukta haim | inamem pratyeka
    mem sata-sata mantra haim | ina saba matrom ke rishi aura devata bhuvanaputra vishvakarma hi haim
    | ye hi caudaha matram yajurveda adhyaya ke 17vem mem matram 17 se 32 taka ate haim, jisamem se kevala
    do mantra 24vam aura 32vam adhika mahatvapurna haim | pratyeka mamgalika parva para yajna mem griha
    pravesha karate samaya, kisi bhi navina karya ke shubharambha para, vivaha adi saskamro ke samaya
    inaka patha avashya karana cahie | rigveda dashama mandala sukta 81 | 10|81 sasvara ya ima vishva
    bhuvanani juhvadrishirhota nyasidatpita nah | sa ashisha dravinamicchamanah prathamacchadavara~ a
    vivesha || 1|| kim svidasidadhishthanamarambhanam katamatsvitkathasit | yato bhumim janayanvishvakarma
    vi dyamaurnonmahina vishvacakshah || 2|| vishvatashcakshuruta vishvatomukho vishvatobahuruta vishvataspat
    | sam bahubhyam dhamati sam patatrairdyavabhumi janayandeva ekah || 3|| kim svidvanam ka u sa vriksha
    asa yato dyavaprithivi nishtatakshuh | manishino manasa pricchatedu tadyadadhyatishthadbhuvanani dharayan
    || 4|| ya te dhamani paramani yavama ya madhyama vishvakarmannutema | shiksha sakhibhyo havishi svadhavah
    svayam yajasva tanvam vridhanah || 5|| vishvakarmanhavisha vavridhanah svayam yajasva prithivimuta
    dyam | muhyantvanye abhito janasa ihasmakam maghava surirastu || 6|| vacaspatim vishvakarmanamutaye
    manojuvam vaje adya huvema | sa no vishvani havanani joshadvishvashambhuravase sadhukarma || 7|| rigveda
    dashama mandala sukta 82 | 10|82 cakshushah pita manasa hi dhiro ghritamene ajanannannamane | yadedanta
    adadrihanta purva adiddyavaprithivi aprathetam || 1|| vishvakarma vimana advihaya dhata vidhata paramota
    samdrik | teshamishtani samisha madanti yatra saptarishinpara ekamahuh || 2|| yo nah pita janita yo
    vidhata dhamani veda bhuvanani vishva | yo devanam namadha eka eva tam samprashnam bhuvana yantyanya
    || 3|| ta ayajanta dravinam samasma rishayah purve jaritaro na bhuna | asurte surte rajasi nishatte
    ye bhutani samakrinvannimani || 4|| paro diva para ena prithivya paro devebhirasurairyadasti | kam
    svidgarbham prathamam dadhra apo yatra devah samapashyanta vishve || 5|| tamidgarbham prathamam dadhra
    apo yatra devah samagacchanta vishve | ajasya nabhavadhyekamarpitam yasminvishvani bhuvanani tasthuh
    || 6|| na tam vidatha ya ima jajananyadyushmakamantaram babhuva | niharena pravrita jalpya casutripa
    ukthashasashcaranti || 7|| rigveda dashama mandala sukta 81 | 10|81 svaravirahita - ya ima vishva
    bhuvanani juhvadrishirhota nyasidatpita nah | sa ashisha dravinamicchamanah prathamacchadavara~ a
    vivesha || 1|| kim svidasidadhishthanamarambhanam katamatsvitkathasit | yato bhumim janayanvishvakarma
    vi dyamaurnonmahina vishvacakshah || 2|| vishvatashcakshuruta vishvatomukho vishvatobahuruta vishvataspat
    | sam bahubhyam dhamati sam patatrairdyavabhumi janayandeva ekah || 3|| kim svidvanam ka u sa vriksha
    asa yato dyavaprithivi nishtatakshuh | manishino manasa pricchatedu tadyadadhyatishthadbhuvanani dharayan
    || 4|| ya te dhamani paramani yavama ya madhyama vishvakarmannutema | shiksha sakhibhyo havishi svadhavah
    svayam yajasva tanvam vridhanah || 5|| vishvakarmanhavisha vavridhanah svayam yajasva prithivimuta
    dyam | muhyantvanye abhito janasa ihasmakam maghava surirastu || 6|| vacaspatim vishvakarmanamutaye
    manojuvam vaje adya huvema | sa no vishvani havanani joshadvishvashambhuravase sadhukarma || 7|| rigveda
    dashama mandala sukta 82 | 10|82 cakshushah pita manasa hi dhiro ghritamene ajanannannamane | yadedanta
    adadrihanta purva adiddyavaprithivi aprathetam || 1|| vishvakarma vimana advihaya dhata vidhata paramota
    samdrik | teshamishtani samisha madanti yatra saptarishinpara ekamahuh || 2|| yo nah pita janita yo
    vidhata dhamani veda bhuvanani vishva | yo devanam namadha eka eva tam samprashnam bhuvana yantyanya
    || 3|| ta ayajanta dravinam samasma rishayah purve jaritaro na bhuna | asurte surte rajasi nishatte
    ye bhutani samakrinvannimani || 4|| paro diva para ena prithivya paro devebhirasurairyadasti | kam
    svidgarbham prathamam dadhra apo yatra devah samapashyanta vishve || 5|| tamidgarbham prathamam dadhra
    apo yatra devah samagacchanta vishve | ajasya nabhavadhyekamarpitam yasminvishvani bhuvanani tasthuh
    || 6|| na tam vidatha ya ima jajananyadyushmakamantaram babhuva | niharena pravrita jalpya casutripa
    ukthashasashcaranti || 7|| yajurveda ke 17vem adhyaya mem usaka 24vam mahatvapurna mantra vishvakarman
    havisha vardhanena trataramindramakrinoravadhyam | tasmai vishah samanamanta daivirayamugro vihavyo
    yathasat || 24|| he vishva ke racayita parameshvara ! havi dvara vriddhi ko prapta hone vale apane
    indradeva ko vishva ka rakshaka aura aparajeya banaya hai | purvakala ke rishiyom ke tulya hama bhi
    una indradeva ko jhukakara namana karate haim | ye parakrami indradeva apaki shakti se hi saba prakara
    samartha hue haim | hama unaka avahana karate haim || 24|| yajurveda ke 17vem adhyaya ka 32vam mahatvapurna
    mantra vishvakarma hyajanishta deva|adidgandharvo'bhavad dvitiyah | tritiyah pita janitaushadhinamapam
    garbham vyadadhatpurutra || 32|| srishti krama mem sarvaprathama brahmanda ke samcalaka devagana avirbhuta
    hue, isake pashcat prithvi ko dharana karane vale (agni-surya) deva prakata hue | tritiya krama mem
    oshadhiyom ke utpadaka aura palaka prana- parjanya utpanna hue | vaha (vishvasrijeta) sabhi jala ke
    garbha ko vividha rupom mem dharana karata hai || 32||
  devanagari: ऋग्वेद के दशम् मण्डल के सूक्त ८१ व ८२ दोनों सूक्त विश्वकर्मा सूक्त हैं । इनमें प्रत्येक
    में सात-सात मन्त्र हैं । इन सब मत्रों के ऋषि और देवता भुवनपुत्र विश्वकर्मा ही हैं । ये ही चौदह मत्रं
    यजुर्वेद अध्याय के १७वें में मत्रं १७ से ३२ तक आते हैं, जिसमें से केवल दो मन्त्र २४वां और ३२वां अधिक
    महत्वपुर्ण हैं । प्रत्येक मांगलिक पर्व पर यज्ञ में गृह प्रवेश करते समय, किसी भी नवीन कार्य के शुभारम्भ
    पर, विवाह आदि सस्कांरो के समय इनका पाठ अवश्य करना चाहिए । ऋग्वेद दशम मण्डल सूक्त ८१ । १०।८१ सस्वर
    य इमा विश्वा भुवनानि जुह्वदृषिर्होता न्यसीदत्पिता नः । स आशिषा द्रविणमिच्छमानः प्रथमच्छदवराँ आ विवेश
    ॥ १॥ किं स्विदासीदधिष्ठानमारम्भणं कतमत्स्वित्कथासीत् । यतो भूमिं जनयन्विश्वकर्मा वि द्यामौर्णोन्महिना
    विश्वचक्षाः ॥ २॥ विश्वतश्चक्षुरुत विश्वतोमुखो विश्वतोबाहुरुत विश्वतस्पात् । सं बाहुभ्यां धमति सं पतत्रैर्द्यावाभूमी
    जनयन्देव एकः ॥ ३॥ किं स्विद्वनं क उ स वृक्ष आस यतो द्यावापृथिवी निष्टतक्षुः । मनीषिणो मनसा पृच्छतेदु
    तद्यदध्यतिष्ठद्भुवनानि धारयन् ॥ ४॥ या ते धामानि परमाणि यावमा या मध्यमा विश्वकर्मन्नुतेमा । शिक्षा
    सखिभ्यो हविषि स्वधावः स्वयं यजस्व तन्वं वृधानः ॥ ५॥ विश्वकर्मन्हविषा वावृधानः स्वयं यजस्व पृथिवीमुत
    द्याम् । मुह्यन्त्वन्ये अभितो जनास इहास्माकं मघवा सूरिरस्तु ॥ ६॥ वाचस्पतिं विश्वकर्माणमूतये मनोजुवं
    वाजे अद्या हुवेम । स नो विश्वानि हवनानि जोषद्विश्वशम्भूरवसे साधुकर्मा ॥ ७॥ ऋग्वेद दशम मण्डल सूक्त
    ८२ । १०।८२ चक्षुषः पिता मनसा हि धीरो घृतमेने अजनन्नन्नमाने । यदेदन्ता अददृहन्त पूर्व आदिद्द्यावापृथिवी
    अप्रथेताम् ॥ १॥ विश्वकर्मा विमना आद्विहाया धाता विधाता परमोत संदृक् । तेषामिष्टानि समिषा मदन्ति यत्रा
    सप्तऋषीन्पर एकमाहुः ॥ २॥ यो नः पिता जनिता यो विधाता धामानि वेद भुवनानि विश्वा । यो देवानां नामधा एक
    एव तं सम्प्रश्नं भुवना यन्त्यन्या ॥ ३॥ त आयजन्त द्रविणं समस्मा ऋषयः पूर्वे जरितारो न भूना । असूर्ते
    सूर्ते रजसि निषत्ते ये भूतानि समकृण्वन्निमानि ॥ ४॥ परो दिवा पर एना पृथिव्या परो देवेभिरसुरैर्यदस्ति
    । कं स्विद्गर्भं प्रथमं दध्र आपो यत्र देवाः समपश्यन्त विश्वे ॥ ५॥ तमिद्गर्भं प्रथमं दध्र आपो यत्र
    देवाः समगच्छन्त विश्वे । अजस्य नाभावध्येकमर्पितं यस्मिन्विश्वानि भुवनानि तस्थुः ॥ ६॥ न तं विदाथ य
    इमा जजानान्यद्युष्माकमन्तरं बभूव । नीहारेण प्रावृता जल्प्या चासुतृप उक्थशासश्चरन्ति ॥ ७॥ ऋग्वेद दशम
    मण्डल सूक्त ८१ । १०।८१ स्वरविरहित - य इमा विश्वा भुवनानि जुह्वदृषिर्होता न्यसीदत्पिता नः । स आशिषा
    द्रविणमिच्छमानः प्रथमच्छदवराँ आ विवेश ॥ १॥ किं स्विदासीदधिष्ठानमारम्भणं कतमत्स्वित्कथासीत् । यतो भूमिं
    जनयन्विश्वकर्मा वि द्यामौर्णोन्महिना विश्वचक्षाः ॥ २॥ विश्वतश्चक्षुरुत विश्वतोमुखो विश्वतोबाहुरुत
    विश्वतस्पात् । सं बाहुभ्यां धमति सं पतत्रैर्द्यावाभूमी जनयन्देव एकः ॥ ३॥ किं स्विद्वनं क उ स वृक्ष
    आस यतो द्यावापृथिवी निष्टतक्षुः । मनीषिणो मनसा पृच्छतेदु तद्यदध्यतिष्ठद्भुवनानि धारयन् ॥ ४॥ या ते
    धामानि परमाणि यावमा या मध्यमा विश्वकर्मन्नुतेमा । शिक्षा सखिभ्यो हविषि स्वधावः स्वयं यजस्व तन्वं वृधानः
    ॥ ५॥ विश्वकर्मन्हविषा वावृधानः स्वयं यजस्व पृथिवीमुत द्याम् । मुह्यन्त्वन्ये अभितो जनास इहास्माकं
    मघवा सूरिरस्तु ॥ ६॥ वाचस्पतिं विश्वकर्माणमूतये मनोजुवं वाजे अद्या हुवेम । स नो विश्वानि हवनानि जोषद्विश्वशम्भूरवसे
    साधुकर्मा ॥ ७॥ ऋग्वेद दशम मण्डल सूक्त ८२ । १०।८२ चक्षुषः पिता मनसा हि धीरो घृतमेने अजनन्नन्नमाने ।
    यदेदन्ता अददृहन्त पूर्व आदिद्द्यावापृथिवी अप्रथेताम् ॥ १॥ विश्वकर्मा विमना आद्विहाया धाता विधाता परमोत
    संदृक् । तेषामिष्टानि समिषा मदन्ति यत्रा सप्तऋषीन्पर एकमाहुः ॥ २॥ यो नः पिता जनिता यो विधाता धामानि
    वेद भुवनानि विश्वा । यो देवानां नामधा एक एव तं सम्प्रश्नं भुवना यन्त्यन्या ॥ ३॥ त आयजन्त द्रविणं समस्मा
    ऋषयः पूर्वे जरितारो न भूना । असूर्ते सूर्ते रजसि निषत्ते ये भूतानि समकृण्वन्निमानि ॥ ४॥ परो दिवा पर
    एना पृथिव्या परो देवेभिरसुरैर्यदस्ति । कं स्विद्गर्भं प्रथमं दध्र आपो यत्र देवाः समपश्यन्त विश्वे
    ॥ ५॥ तमिद्गर्भं प्रथमं दध्र आपो यत्र देवाः समगच्छन्त विश्वे । अजस्य नाभावध्येकमर्पितं यस्मिन्विश्वानि
    भुवनानि तस्थुः ॥ ६॥ न तं विदाथ य इमा जजानान्यद्युष्माकमन्तरं बभूव । नीहारेण प्रावृता जल्प्या चासुतृप
    उक्थशासश्चरन्ति ॥ ७॥ यजुर्वेद के १७वें अध्याय में उसका २४वां महत्वपूर्ण मन्त्र विश्वकर्मन् हविषा वर्धनेन
    त्रातारमिन्द्रमकृणोरवध्यम् । तस्मै विशः समनमन्त दैवीरयमुग्रो विहव्यो यथासत् ॥ २४॥ हे विश्व के रचयिता
    परमेश्वर ! हवि द्वारा वृद्धि को प्राप्त होने वाले आपने इन्द्रदेव को विश्व का रक्षक और अपराजेय बनाया
    है । पूर्वकाल के ऋषियों के तुल्य हम भी उन इन्द्रदेव को झुककर नमन करते हैं । ये पराक्रमी इन्द्रदेव
    आपकी शक्ति से ही सब प्रकार समर्थ हुए हैं । हम उनका आवाहन करते हैं ॥ २४॥ यजुर्वेद के १७वें अध्याय का
    ३२वां महत्वपुर्ण मन्त्र विश्वकर्मा ह्याजनिष्ट देव।आदिद्गन्धर्वोऽभवद् द्वितीयः । तृतीयः पिता जानितौषधीनामपां
    गर्भं व्यदधात्पुरुत्रा ॥ ३२॥ सृष्टि क्रम में सर्वप्रथम ब्रह्माण्ड के संचालक देवगण आविर्भूत हुए, इसके
    पश्चात् पृथ्वी को धारण करने वाले (अग्नि-सूर्य) देव प्रकट हुए । तृतीय क्रम में ओषधियों के उत्पादक और
    पालक प्राण- पर्जन्य उत्पन्न हुए । वह (विश्वसृजेता) सभी जल के गर्भ को विविध रूपों में धारण करता है
    ॥ ३२॥
