id: dharakritamdevistotram
category: stotram
name:
  english: dharakritamdevistotram
  devanagari: धाराकृतंदेवीस्तोत्रम्
content:
  english: dharakritam devistotram namaste parame brahmi dharayoge namonamah | ardhamatre pare shunye
    tasyardhardhe namostu te || 15|| namaste jagadadhare namaste bhutadharini | namaste padmapatrakshi
    namaste kancanadyute || 16|| namaste simhayanadhye namaste'stumahabhuje | namaste devatabhishte namaste
    daityasudini || 17|| namaste mahishakrantashariracchinnamastake | namaste vindhyanirate suramamsabalipriye
    || 18|| tvam lakshmistvam shaci gauri tvam siddhistvam vibhavari | tvam svaha tvam svadha tushtistvam
    pushtistvam sureshvari || 19|| shaktirupasi devi tvam srishtisamharaka rini | tvayi drishtamidam sarvam
    trailokyam sacaracaram || 20|| yatha tilesthitam tailam dadhisamstham yatha ghritam | havirbhujashca
    kashthasthah suguptam labhyate na hi || 21|| tatha tvamapi deveshi sarvagapi na lakshyase || 22||
    iti shriskandapurane nagarakhande ekonasaptaticamadhikashatatamadhyayantargatam dharakritam devistotram
    samaptam | skandapurana | nagarakhanda | adhyaya 169
  devanagari: धाराकृतं देवीस्तोत्रम् नमस्ते परमे ब्राह्मि धारयोगे नमोनमः । अर्धमात्रे परे शून्ये तस्यार्धार्धे
    नमोस्तु ते ॥ १५॥ नमस्ते जगदाधारे नमस्ते भूतधारिणि । नमस्ते पद्मपत्राक्षि नमस्ते काञ्चनद्युते ॥ १६॥
    नमस्ते सिंहयानाढ्ये नमस्तेऽस्तुमहाभुजे । नमस्ते देवताभीष्टे नमस्ते दैत्यसूदिनि ॥ १७॥ नमस्ते महिषाक्रान्तशरीरच्छिन्नमस्तके
    । नमस्ते विन्ध्यनिरते सुरामांसबलिप्रिये ॥ १८॥ त्वं लक्ष्मीस्त्वं शची गौरी त्वं सिद्धिस्त्वं विभावरी
    । त्वं स्वाहा त्वं स्वधा तुष्टिस्त्वं पुष्टिस्त्वं सुरेश्वरी ॥ १९॥ शक्तिरूपासि देवि त्वं सृष्टिसंहारका
    रिणी । त्वयि दृष्टमिदं सर्वं त्रैलोक्यं सचराचरम् ॥ २०॥ यथा तिलेस्थितं तैलं दधिसंस्थं यथा घृतम् । हविर्भुजश्च
    काष्ठस्थः सुगुप्तं लभ्यते न हि ॥ २१॥ तथा त्वमपि देवेशि सर्वगापि न लक्ष्यसे ॥ २२॥ इति श्रीस्कन्दपुराणे
    नागरखण्डे एकोनसप्ततिचमाधिकशततमाध्यायान्तर्गतं धाराकृतं देवीस्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड
    । अध्याय १६९
meaning: {}
