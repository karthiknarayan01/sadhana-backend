id: mathamnayopanishat
category: upanishad
name:
  english: mathamnayopanishat
  devanagari: मठाम्नायोपनिषत्
content:
  english: ityadivakyavicara nityanityavivekenatmanopastim atmatirthe atmoddhararthe sakshatkararthe sannyasagrahanam
    karishye | om namo narayanayeti || om shashthe atmamnaya paramatma matha satyasusampradaya nabhikundalikshetra
    trikuti tirtham hamso devi paramahmaso devata ajapasohammahamantra brahmavishnumaheshvaradya jivabrahmacari
    hamsavida upasti upadhibhedasannyasartham jnanasannyasagrahanam karishye | om namo narayanayeti ||
    om saptame jambudvipa samyagjnana shikha na sutra vedyavedaka shraddha nadi vimalatirtham atmalingashantyarthe
    vicara nityanityavivekena atmanopastim atmatirthe atmoddhararthe sakshatkararthe sanyasagrahanam karishye
    | om namo narayanayeti || iti shrimatparamahamsaparivrajakacaryashrimacchankaracaryaviracita mathamnayopanishat
    samapta |
  devanagari: इत्यादिवाक्यविचार नित्यानित्यविवेकेनात्मनोपास्तिं आत्मतीर्थे आत्मोद्धारार्थे साक्षात्कारार्थे
    सन्न्यासग्रहणं करिष्ये । ॐ नमो नारायणायेति ॥ ॐ षष्ठे आत्माम्नाय परमात्मा मठ सत्यसुसम्प्रदाय नाभिकुण्डलिक्षेत्र
    त्रिकुटी तीर्थं हंसो देवी परमह्ंअसो देवता अजपासोहंमहामन्त्र ब्रह्मविष्णुमहेश्वराद्या जीवब्रह्मचारी
    हंसविद उपास्ति उपाधिभेदसन्न्यासार्थं ज्ञानसन्न्यासग्रहणं करिष्ये । ॐ नमो नारायणायेति ॥ ॐ सप्तमे जम्बूद्वीप
    सम्यग्ज्ञान शिखा न सूत्र वेद्यवेदक श्रद्धा नदी विमलातीर्थं आत्मलिङ्गशान्त्यर्थे विचार नित्यानित्यविवेकेन
    आत्मनोपास्तिं आत्मतीर्थे आत्मोद्धारार्थे साक्षात्कारार्थे सन्यासग्रहणं करिष्ये । ॐ नमो नारायणायेति
    ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यश्रीमच्छङ्कराचार्यविरचिता मठाम्नायोपनिषत् समाप्ता ।
