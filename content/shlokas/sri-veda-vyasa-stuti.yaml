id: sri-veda-vyasa-stuti
category: stotram
name:
  english: Sri Veda Vyasa Stuti
content:
  english: vyasam vasishthanaptaram shakteh pautramakalmasham | parasharatmajam vande shukatatam taponidhim
    || vyasaya vishnurupaya vyasarupaya vishnave | namo vai brahmanidhaye vasishthaya namo namah || krishnadvaipayanam
    vyasam sarvalokahite ratam | vedabjabhaskaram vande shamadinilayam munim || vedavyasam svatmarupam
    satyasandham parayanam | shantam jitendriyakrodham sashishyam pranamamyaham || acaturvadano brahma
    dvibahuraparo harih | aphalalocanah shambhuh bhagavan badarayanah || shankaram shankaracaryam keshavam
    badarayanam | sutrabhashyakritau vande bhagavantau punah punah || brahmasutrakrite tasmai vedavyasaya
    vedhase | jnanashaktyavataraya namo bhagavato hareh || vyasah samastadharmanam vakta munivareditah
    | ciranjivi dirghamayurdadatu jatilo mama || prajnabalena tapasa caturvedavibhajakah | krishnadvaipayano
    yashca tasmai shrigurave namah || jatadharastaponishthah shuddhayogo jitendriyah | krishnajinadharah
    krishnastasmai shrigurave namah || bharatasya vidhata ca dvitiya iva yo harih | haribhaktiparo yashca
    tasmai shrigurave namah || jayati parasharasunuh satyavati hridayanandano vyasah | yasyasya kamalagalitam
    bharatamamritam jagatpibati || vedavibhagavidhatre vimalaya brahmane namo vishvadrishe | sakaladhritihetusadhanasutrasrije
    satyavatyabhivyakti mate || vedantavakyakusumani samani caru jagrantha sutranicayena manoharena |
    moksharthilokahitakamanaya muniryah tam badarayanamaham pranamami bhaktya || iti shri vedavyasa stutih
    |
  devanagari: व्यासं वसिष्ठनप्तारं शक्तेः पौत्रमकल्मषम् । पराशरात्मजं वन्दे शुकतातं तपोनिधिम् ॥ व्यासाय
    विष्णुरूपाय व्यासरूपाय विष्णवे । नमो वै ब्रह्मनिधये वासिष्ठाय नमो नमः ॥ कृष्णद्वैपायनं व्यासं सर्वलोकहिते
    रतम् । वेदाब्जभास्करं वन्दे शमादिनिलयं मुनिम् ॥ वेदव्यासं स्वात्मरूपं सत्यसन्धं परायणम् । शान्तं जितेन्द्रियक्रोधं
    सशिष्यं प्रणमाम्यहम् ॥ अचतुर्वदनो ब्रह्मा द्विबाहुरपरो हरिः । अफाललोचनः शम्भुः भगवान् बादरायणः ॥ शङ्करं
    शङ्कराचार्यं केशवं बादरायणम् । सूत्रभाष्यकृतौ वन्दे भगवन्तौ पुनः पुनः ॥ ब्रह्मसूत्रकृते तस्मै वेदव्यासाय
    वेधसे । ज्ञानशक्त्यवताराय नमो भगवतो हरेः ॥ व्यासः समस्तधर्माणां वक्ता मुनिवरेडितः । चिरञ्जीवी दीर्घमायुर्ददातु
    जटिलो मम ॥ प्रज्ञाबलेन तपसा चतुर्वेदविभाजकः । कृष्णद्वैपायनो यश्च तस्मै श्रीगुरवे नमः ॥ जटाधरस्तपोनिष्ठः
    शुद्धयोगो जितेन्द्रियः । कृष्णाजिनधरः कृष्णस्तस्मै श्रीगुरवे नमः ॥ भारतस्य विधाता च द्वितीय इव यो
    हरिः । हरिभक्तिपरो यश्च तस्मै श्रीगुरवे नमः ॥ जयति पराशरसूनुः सत्यवती हृदयनन्दनो व्यासः । यस्यास्य
    कमलगलितं भारतममृतं जगत्पिबति ॥ वेदविभागविधात्रे विमलाय ब्रह्मणे नमो विश्वदृशे । सकलधृतिहेतुसाधनसूत्रसृजे
    सत्यवत्यभिव्यक्ति मते ॥ वेदान्तवाक्यकुसुमानि समानि चारु जग्रन्थ सूत्रनिचयेन मनोहरेण । मोक्षार्थिलोकहितकामनया
    मुनिर्यः तं बादरायणमहं प्रणमामि भक्त्या ॥ इति श्री वेदव्यास स्तुतिः ।
