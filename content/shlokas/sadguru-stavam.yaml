id: sadguru-stavam
category: stotram
name:
  english: Sadguru Stavam
content:
  english: siddhi buddhi mahayoga varaniyo ganadhipah yassvayam saccidanandam sadgurum tam namamyaham
    || || yasya dattatreya bhavo bhaktana matma danatah sucyate saccidanandam sadgurum tam namamyaham
    || || yoga jjyoti ssamuddiptam jayalakshmi nrisimhayoh advayam saccidanandam sadgurum tam namamyaham
    || || yogavidya citrabhanum citrabhanu sharadbhavam jnanadam saccidanandam sadgurum tam namamyaham
    || || ganesha homerkadine nityam shricakra pujane dikshitam saccidanandam sadgurum tam namamyaham
    || || agastyamuni sankranta nana vaidya durandharam bhavaghnam saccidanandam sadgurum tam namamyaham
    || || vadyodanca ddivyanama sankirtana kalanidhim nadabdhim saccidanandam sadgurum tam namamyaham
    || || datta pithadhipam dharma rakshanopaya bandhuram satkavim saccidanandam sadgurum tam namamyaham
    || || vidhuta bhakta sammoha mavadhutam jagadgurum svashrayam saccidanandam sadgurum tam namamyaham
    || || sadhutvam bhakti maishvaryam danam yoga marogatam sanmatim jnana manandam sadguru stavato labhet
    ||
  devanagari: सिद्धि बुद्धि महायोग वरणीयो गणाधिपः यस्स्वयं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ यस्य
    दत्तात्रेय भावो भक्ताना मात्म दानतः सूच्यते सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ योगा ज्ज्योति स्समुद्दीप्तं
    जयलक्ष्मी नृसिंहयोः अद्वयं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ योगविद्या चित्रभानुं चित्रभानु शरद्भवम्
    ज्ञानदं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ गणेश होमेर्कदिने नित्यं श्रीचक्र पूजने दीक्षितं सच्चिदानन्दं
    सद्गुरुं तं नमाम्यहम् ॥ ॥ अगस्त्यमुनि सङ्क्रान्त नाना वैद्य दुरन्धरम् भवघ्नं सच्चिदानन्दं सद्गुरुं
    तं नमाम्यहम् ॥ ॥ वाद्योदञ्च द्दिव्यनाम सङ्कीर्तन कलानिधिम् नादाब्धिं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम्
    ॥ ॥ दत्त पीठाधिपं धर्म रक्षणोपाय बन्धुरम् सत्कविं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ विधूत भक्त
    सम्मोह मवधूतं जगद्गुरुम् स्वाश्रयं सच्चिदानन्दं सद्गुरुं तं नमाम्यहम् ॥ ॥ साधुत्वं भक्ति मैश्वर्यं
    दानं योग मरोगताम् सन्मतिं ज्ञान मानन्दं सद्गुरु स्तवतो लभेत् ॥
