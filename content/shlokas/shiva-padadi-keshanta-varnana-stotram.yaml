id: shiva-padadi-keshanta-varnana-stotram
category: stotram
name:
  english: Shiva Padadi Keshanta Varnana Stotram
  devanagari: शिवपादादिकेशान्तवर्णनस्तोत्रम्
content:
  english: shivapadadikeshantavarnanastotram shankaracaryah 1910 shivapadadikeshantavarnanastotram shankaracaryah
    1910 || shrih|| shivapadadikeshanta || varnanastotram kalyanam no vidhattam katakatatalasatkalpavatinikunja
    kridasamsaktavidyadharanikaravadhugitarudrapadanah | taraiherambanadaistaralitaninadattarakaratikeki
    kailasah sharvanirvrityabhijanakapada sarvada parvatendrah ||1|| yasya prahuh svarupam sakaladivishadam
    sarasarvasvayogam yasyeshuh sharngadhanva samajani jagatam rakshane jagarukah | maurvi darvikaranamapi
    ca paribridhah pustrayi sa ca lakshyam so'vyadavyajamasmanashivabhidanisham nakinam shripinakah ||
    2 || atankavegahari sakaladivishadamanghripadmashrayanam matangadyugradaityaprakaratanugaladraktadharaktadharah
    | krurah surayutanamapi ca paribhavam sviyabhasa vittanva nghòrakarah kutharo dridhataraduritakhyatavim
    patayennah || 3 || kalarateh karagre kritavasatirurahshanashato ripunam kale kale kuladripravaratanayaya
    kalpitasnehalepah | payannah pavakarcihprasarasakhamukhah papahanta nitantam shula shripadasevabhajanarasajusham
    palanaikantashilah ||4|| devasyankashrayayah kulagiriduhiturnetrakonapracara prastaranatyudaranpipathishuriva
    yo nityamatyadarena | adhatte bhangitungairanishamavayavairantarangam samodam somapidasya so'yam pradishatu
    kushalam panirangah kurangah || 5 || kanthaprantavasajjatkanakamayamahaghantikaghoraghoshaih kantharavairakunthairapi
    bharitajagancakravalantaralah | candah proddandashringah kakudakabalitottungakailasashringah kanthekalasya
    vahah shamayatu shamalam shashvatah shakvarendrah|| 6 || niryaddanambudharaparimalataralibhutarolambapali
    jhamkaraih shamkaradreh shikharashatadari purayanbhurighoshaih | sharvah sauvarnashailapratimaprithuvapuh
    sarvavighnapaharta sharvanya purvasunuh sa bhavatu bhavatam svastido hastivaktrah || 7 || yah punyairdevatanam
    samajani shivayoh shlaghyaviryaikamatya dyannamni shruyamane ditijabhataghata bhitibharam bhajante
    | bhuyatso'yam vibhutyai nishitasharashikhapatitakrauncashailah samsaragadhakupodarapatitasamuttarakastarakarih
    || 8 || arudhah praudhavegapravijitapavanam tungatungam turangam celam nilam vasanah karatalavilasatkandakodandadandah
    | ragadveshadinanavidhamrigapatalibhitikridbhutabharta kurvannakhetalilam parilasatu mana kanane mamakine
    || 9|| ambhojabhyam ca rambharathacaranalatadvandvakumbhindrakumbhai rbimbenendoshca kamborupari vilasata
    vidrumenotpalabhyam | ambhodenapi sambhavitamupajanitadambaram shambarare shambhoh sambhogayogyam
    kimapi dhanamidam sambhavetsampade nah || 10 || venisaubhagyavismapitatapanasutacaruvenivilasa nvaninirdhutavanikaratalavidhritodaravinaviravan
    | eninetrantabhanginirasananipunapangakonanupase shonanprananududhapratinavasushamakandalanindumauleh
    || 11 || nrittarambheshu hastahatamurajadhimiddhimkritairatyudarai shcittanandam vidhantte sadasi
    bhagavatah samtatam yah sa nandi| candishadyastathanye caturagunaganaprinitasvamisatka rotkarshodyatprasadah
    pramathaparibridhah pantu samtoshino nah|| 12 || muktamanikyajalaih parikalitamahasalamalokaniyam
    pratyuptanargharatnairdishi dishi bhavanaih kalpitairdikpatinam | udyanairadrikanyaparijanavanitamananiyaih
    paritam hridyam hridyastu nityam mama bhuvanapaterdhama somardhamaॏleh|| 13 || stambhairjambhariratnapravaraviracitaih
    sambhritopantabhagam shumbhatsopanamargah shucimaninicayairgumbhitanalpashilpam | kumbhaih sampurnashobham
    shirasi sughatitaih shatakumbhairapankaih shambhoh sambhavaniyam sakalamunijanaih svastidam syatsado
    nah || 14 || nyasto madhye sabhaya parisaravilasatpadapithabhiramo hridyah padaishcaturbhih kanakamanimayairuccakairujjvalatma|
    vrasoratnena kenapyadhikamridutarenastrito vistritashri shamayatu shivayoh svairasamvasayogyah ||
    15 || asinasyadhipitham trijagadadhipateranghripithanushaktau pathojabhogabhajau parimridulatalollasipadmadirekhau
    | patam padavubhau tau namadamarakiritollasaccaruhira shrenishonayamanonnatanakhadashakodbhasamanau
    samanau || 16 || yannado vedavacam nigadati nikhilam lakshanam pakshiketu rlakshmisambhogasaukhyam
    viracayati yayoshcapare rupabhede | shambhoh sambhavaniye padakamalasamasangatastungashobhe mangalyam
    na samagram sakalasukhakare nupure purayetam || 17 || ange shringarayoneh sapadi shalabhatam netravahnau
    prayate shatroruddhritya tasmadishudhiyugamadho nyastamagre kimetat | shankamittham natanamamaraparishadamantarankurayatta
    tsamghatam caru janghayugamakhilapateramhasam samharennah || 18|| janudvandvena minadhvajanrivarasamudropamanena
    sakam rajantau rajarambhakarikarakanakastambhasambhavaniyau| uru gaurikarambhoruhasarasasamamardananandabhajau
    caru durikriyastam duritamupacitam janmajanmantare nah || 19 || amuktanargharatnaprakarakaraparishvaktakalyanakanci
    damna baddhena dugdhadyutinicayamusha cinapattambarena | samvite shailakanyasucaritaparipakayamane
    nitambe nityam narnartu cittam mama nikhilajagatsvaminah somamauleh|| 20 || samdhyakalanurajyaddinakarasaruca
    kaladhautena gadham vyanaddhah snigdhamugdha sarasamudarabandhena vitopamena | uddipraih svaprakashairupacitamahima
    manmatharerudaro madhyo mithyarthasadhdhyanmama dishatu sada samgatim mangalanam || 21 || nabhicakralavalannavanavasushamadohadashriparita
    dudgacchanti purastadudarapathamatikramya vakshrah prayanti| shyama kamagamarthaprakathanalipivadbhasate
    ya nikamam sa ma somardhamaule sukhayatu satatam romavallimatalli || 22 || ashlesheshvadrijaya kathinakucatatiliptakashmirapanka
    vyasangadudyadarkadyutibhirupacitaspardhamuddamahridyama daksharaterududhapratinavamanimalavalibhasamanam
    vaksho vikshobhitagham satatanatijusham rakshatadakshatam nah || 23 || vamanke visphurantya karatalavilasaccaruraktotpalayah
    kantaya vamavakshoruhabharashikharonmardanavyapramekam | anyamstrinapyudaranvaraparashumrigalamkritanindumaule
    rbahunabaddhahemangadamanikatakanantaralokayamah || 24 || sambhrantayah shivayah pativilayabhiya sarvalokopatapa
    tsamvignasyapi vishno sarabhasamubhayoarvaranapreranabhyam | madhye traishankaviyamanubhavati dasham
    yatra halahaloshma so'yam sarvapadam nah shamayatu nicayam nilakanthasya kanthah || 25 || hridyairadrindrakanyamridudashanapadairmudrito
    vidrumashri ruddayotantya nitantam dhavaladhavalaya mishrito dantakantya | muktamanikyajalavyatikarasadrisha
    tejasa bhasamanah sadyojatasya dadyadadharamanirasau sampadam samcayam nah || 26 || karnalamkarananamaninikararucam
    samcayairancitayam varnyayam svarnapadmodaraparivilasatkarnikasamnibhayam | paddhatyam pranavayoh
    pranatajanahridambhojavasasya shambho rnityam nashcittametadviracayatu sukhenasikam nasikayam || 27
    || atyantam bhasamane ruciratararucam samgamatsanmanina mudyaccandamshudhamaprasaranirasanaspashtadrishtapadane
    | bhuyastam bhutaye nah karivarajayinah karnapashavalambe bhaktalibhalasajjajjanimaranalipe kundale
    kundale te || 28 || yabhyam kalavyavastha bhavati tanumatam yo mukham devatanam yeshamahuh svarupam
    jagati munivara devatanam trayim tam | rudranivaktrapankeruhasatataviharotsukendindirebhya stebhyastribhyah
    pranamanjalimuparacaye trikshanasyekshanebhyah || 29 || vamam vamankagaya vadanasarasije vyavaladvallabhaya
    vyanamreshvanyadanyatpunaralikabhavam vitanihshesharaukshyam | bhuyo bhuyo'pi modannipatadatidayashitalam
    cutabane daksharerikshananam trayamapaharatadashu tapatrayam nah || 30|| yasminnardhendumugdhadyutinicayatiraskaranistandrakantau
    kashmirakshodasamkalpitamiva ruciram citrakam bhati netram | tasminnullilacillinatavaratarunilasyarangayamane
    kalare phaladeshe viharatu hridayam vitacintantaram nah || 31 || svamingangamivangikuru tava shirasa
    mamapityarthayantim dhanyam kanyam kharamshoh shirasi vahati kim nvesha karunyashali | ittham shankam
    jananam janayadatighanam kaishikam kalamegha cchayam bhuyadudaram tripuravijayinah shreyase bhuyase
    nah || 32 || shringarakalpayogyaih shikharivarasutasatsakhihastalunaih sunairabaddhamalavaliparivilasatsaurabhakrishtabhringam
    | tunga manikyakantya parihasitasuravasashailendrashringam samgham na samkatanam vighatayatu sada
    kankatikam kiritam || 33 || vakrakarah kalanki jadatanurahamapyanghrisevanubhava sulabhataraghrinasyandinashcandramauleh
    | tatsevantam janaughah shivamiti nijayavasthayaiva bruvanam vande devasya shambhormukutasughatitam
    mugdhapiyushabhanum || 34 || kantya samphullamallikusumadhavalaya vyapya vishvam viraja nvrittakaro
    vitanvanmuhurapi ca param nivritim padabhajam | sanandam nandidoshna manikatakavata vahyamana purareh
    shvetacchatrakhyashitadyutirapaharatadapadastapada nah || 35 || divyakalpojjvalanam shivagirisutayoh
    parshvayorashritanam rudranisatsakhinam madataralakatakshancalairancitanam | udvelladbhahuvallivilasanasamaye
    camarandolanina mudbhutah kankanalivalayakalakalo varayedapado nah || 36 || svargaukahsundarinam sulalitavapusham
    svamisevaparanam valgadbhushani vakrambujaparivigalanmugdhagitamritani | nityam nrittanyupase bhujavidhutipadanyasabhavavaloka
    pratyudyatpritimadyatpramathanatanatidattasambhavanani || 37 || sthanapraptya svaranam kimapi vishadatam
    vyanjayanmanjuvina svanavacchinnatalakramamamritamivasvadyamanam shivabhyam | nanaragatihridyam navarasamadhurastotrajatanuviddham
    ganam vinamaharsheh kalamatilalitam karnapurayatam nah || 38 || ceto jatapramodam sapadi vidadhati
    praninam vanininam panidvandvagrajagratsulalitaranitasvarnatalanukula | sviyaravena pathodhararavapatuna
    nadayanti mayurim mayuri mandabhavam manimurajabhava marjana marjayennah || 39 || devebhyo danavebhyah
    pitrimuniparishatsiddhavidyadharebhyah sadhyebhyashcaranebhyo manujapashupatajjatikitadikebhyah |
    shrikailasagrarudhastrinavitapimukhashcapi ye santi tebhyah sarvebhyo nirvicaram natimuparacaye sharvapadashrayebhyah
    || 40 || dhyayannittham prabhate pratidivasamidam stotraratnam pathedyah kim va brumastadiyam sucaritamathava
    kirtayamah samasat | sampajjatam samagram sadasi bahumatim sarvalokapriyatvam samprapyayuhshatante
    padamayati parabrahmano manmathareh || 42 || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchamkarabhagavatah kritau shivapadadikeshantavarnanastotram sampurnam ||
  devanagari: शिवपादादिकेशान्तवर्णनस्तोत्रम् शङ्कराचार्यः १९१० शिवपादादिकेशान्तवर्णनस्तोत्रम् शङ्कराचार्यः
    १९१० ॥ श्रीः॥ शिवपादादिकेशान्त ॥ वर्णनस्तोत्रम् कल्याणं नो विधत्तां कटकतटलसत्कल्पवाटीनिकुञ्ज क्रीडासंसक्तविद्याधरनिकरवधूगीतरुद्रापदानः
    । तारैहेरम्बनादैस्तरलितनिनदत्तारकारातिकेकी कैलासः शर्वनिर्वृत्यभिजनकपद सर्वदा पर्वतेन्द्रः ॥१॥ यस्य
    प्राहुः स्वरूपं सकलदिविषदां सारसर्वस्वयोगं यस्येषुः शार्ङ्गधन्वा समजनि जगतां रक्षणे जागरूकः । मौर्वी
    दर्वीकराणामपि च परिबृढः पूस्त्रयी सा च लक्ष्यं सोऽव्यादव्याजमस्मानशिवभिदनिशं नाकिनां श्रीपिनाकः ॥
    २ ॥ आतङ्कावेगहारी सकलदिविषदामङ्घ्रिपद्माश्रयाणां मातङ्गाद्युग्रदैत्यप्रकरतनुगलद्रक्तधाराक्तधारः ।
    क्रूरः सूरायुतानामपि च परिभवं स्वीयभासा वित्तन्व न्घॊराकारः कुठारो दृढतरदुरिताख्याटवीं पाटयेन्नः ।।
    ३ ॥ कालारातेः कराग्रे कृतवसतिरुरःशाणशातो रिपूणां काले काले कुलाद्रिप्रवरतनयया कल्पितस्नेहलेपः । पायान्नः
    पावकार्चिःप्रसरसखमुखः पापहन्ता नितान्तं शूल श्रीपादसेवाभजनरसजुषां पालनैकान्तशीलः ॥४॥ देवस्याङ्काश्रयायाः
    कुलगिरिदुहितुर्नेत्रकोणप्रचार प्रस्तारानत्युदारान्पिपठिषुरिव यो नित्यमत्यादरेण । आधत्ते भङ्गितुङ्गैरनिशमवयवैरन्तरङ्गं
    समोदं सोमापीडस्य सोऽयं प्रदिशतु कुशलं पाणिरङ्गः कुरङ्गः ॥ ५ ॥ कण्ठप्रान्तावसज्जत्कनकमयमहाघण्टिकाघोरघोषैः
    कण्ठारावैरकुण्ठैरपि भरितजगञ्चक्रवालान्तरालः । चण्डः प्रोद्दण्डशृङ्गः ककुदकबलितोत्तुङ्गकैलासशृङ्गः
    कण्ठेकालस्य वाहः शमयतु शमलं शाश्वतः शाक्वरेन्द्रः।। ६ ॥ निर्यद्दानाम्बुधारापरिमलतरलीभूतरोलम्बपाली
    झंकारैः शंकराद्रेः शिखरशतदरी पूरयन्भूरिघोषैः । शार्वः सौवर्णशैलप्रतिमपृथुवपुः सर्वविघ्नापहर्ता शर्वाण्या
    पूर्वसूनुः स भवतु भवतां स्वस्तिदो हस्तिवक्त्रः ।। ७ ॥ यः पुण्यैर्देवतानां समजनि शिवयोः श्लाघ्यवीर्यैकमत्या
    द्यन्नाम्नि श्रूयमाणे दितिजभटघटा भीतिभारं भजन्ते । भूयात्सोऽयं विभूत्यै निशितशरशिखापाटितक्रौञ्चशैलः
    संसारागाधकूपोदरपतितसमुत्तारकस्तारकारिः ॥ ८ ॥ आरूढः प्रौढवेगप्रविजितपवनं तुङ्गतुङ्गं तुरङ्गं चेलं नीलं
    वसानः करतलविलसत्काण्डकोदण्डदण्डः । रागद्वेषादिनानाविधमृगपटलीभीतिकृद्भूतभर्ता कुर्वन्नाखेटलीलां परिलसतु
    मन कानने मामकीने ॥ ९॥ अम्भोजाभ्यां च रम्भारथचरणलताद्वन्द्वकुम्भीन्द्रकुम्भै र्बिम्बेनेन्दोश्च कम्बोरुपरि
    विलसता विद्रुमेणोत्पलाभ्याम् । अम्भोदेनापि संभावितमुपजनिताडम्बरं शम्बरारे शंभोः संभोगयोग्यं किमपि
    धनमिदं संभवेत्संपदे नः ।। १० ॥ वेणीसौभाग्यविस्मापिततपनसुताचारुवेणीविलासा न्वाणीनिर्धूतवाणीकरतलविधृतोदारवीणाविरावान्
    । एणीनेत्रान्तभङ्गीनिरसननिपुणापाङ्गकोणानुपासे शोणान्प्राणानुदूढप्रतिनवसुषमाकन्दलानिन्दुमौलेः ।। ११
    ॥ नृत्तारम्भेषु हस्ताहतमुरजधिमिद्धिंकृतैरत्युदारै श्चित्तानन्दं विधन्त्ते सदसि भगवतः संततं यः स नन्दी।
    चण्डीशाद्यास्तथान्ये चतुरगुणगणप्रीणितस्वामिसत्का रोत्कर्षोद्यत्प्रसादाः प्रमथपरिबृढाः पान्तु संतोषिणो
    नः।। १२ ॥ मुक्तामाणिक्यजालैः परिकलितमहासालमालोकनीयं प्रत्युप्तानर्घरत्नैर्दिशि दिशि भवनैः कल्पितैर्दिक्पतीनाम्
    । उद्यानैरद्रिकन्यापरिजनवनितामाननीयैः परीतं हृद्यं हृद्यस्तु नित्यं मम भुवनपतेर्धाम सोमार्धमॏलेः।।
    १३ ॥ स्तम्भैर्जम्भारिरत्नप्रवरविरचितैः संभृतोपान्तभागं शुम्भत्सोपानमार्गः शुचिमणिनिचयैर्गुम्भितानल्पशिल्पम्
    । कुम्भैः संपूर्णशोभं शिरसि सुघटितैः शातकुम्भैरपङ्कैः शंभोः संभावनीयं सकलमुनिजनैः स्वस्तिदं स्यात्सदो
    नः ॥ १४ ॥ न्यस्तो मध्ये सभाया परिसरविलसत्पादपीठाभिरामो हृद्यः पादैश्चतुर्भिः कनकमणिमयैरुच्चकैरुज्ज्वलात्मा।
    व्रासोरत्नेन केनाप्यधिकमृदुतरेणास्तृतो विस्तृतश्री शमयतु शिवयोः स्वैरसंवासयोग्यः ॥ १५ ॥ आसीनस्याधिपीठं
    त्रिजगदधिपतेरङ्घ्रिपीठानुषक्तौ पाथोजाभोगभाजौ परिमृदुलतलोल्लासिपद्मादिरेखौ । पातां पादावुभौ तौ नमदमरकिरीटोल्लसच्चारुहीर
    श्रेणीशोणायमानोन्नतनखदशकोद्भासमानौ समानौ ।। १६ ॥ यन्नादो वेदवाचां निगदति निखिलं लक्षणं पक्षिकेतु र्लक्ष्मीसंभोगसौख्यं
    विरचयति ययोश्चापरे रूपभेदे । शंभोः संभावनीये पदकमलसमासङ्गतस्तुङ्गशोभे माङ्गल्यं न समग्रं सकलसुखकरे
    नूपुरे पूरयेताम् ।। १७ ॥ अङ्गे शृङ्गारयोनेः सपदि शलभतां नेत्रवह्नौ प्रयाते शत्रोरुद्धृत्य तस्मादिषुधियुगमधो
    न्यस्तमग्रे किमेतत् । शङ्कामित्थं नतानाममरपरिषदामन्तरङ्कूरयत्त त्संघातं चारु जङ्घायुगमखिलपतेरंहसां
    संहरेन्नः ॥ १८॥ जानुद्वन्द्वेन मीनध्वजनृवरसमुद्रोपमानेन साकं राजन्तौ राजरम्भाकरिकरकनकस्तम्भसंभावनीयौ।
    ऊरू गौरीकराम्भोरुहसरससमामर्दनानन्दभाजौ चारू दूरीक्रियास्तां दुरितमुपचितं जन्मजन्मान्तरे नः ।। १९ ॥
    आमुक्तानर्घरत्नप्रकरकरपरिष्वक्तकल्याणकाञ्ची दाम्ना बद्धेन दुग्धद्युतिनिचयमुषा चीनपट्टाम्बरेण । संवीते
    शैलकन्यासुचरितपरिपाकायमाणे नितम्बे नित्यं नर्नर्तु चित्तं मम निखिलजगत्स्वामिनः सोममौलेः॥ २० ॥ संध्याकालानुरज्यद्दिनकरसरुचा
    कालधौतेन गाढं व्यानद्धः स्निग्धमुग्ध सरसमुदरबन्धेन वीतोपमेन । उद्दीप्रैः स्वप्रकाशैरुपचितमहिमा मन्मथारेरुदारो
    मध्यो मिथ्यार्थसध्ध्यङ्मम दिशतु सदा संगतिं मङ्गलानाम् ।। २१ ॥ नाभीचक्रालवालान्नवनवसुषमादोहदश्रीपरीता
    दुद्गच्छन्ती पुरस्तादुदरपथमतिक्रम्य वक्ष्रः प्रयान्ती। श्यामा कामागमार्थप्रकथनलिपिवद्भासते या निकामं
    सा मा सोमार्धमौले सुखयतु सततं रोमवल्लीमतल्ली ॥ २२ ॥ आश्लेषेष्वद्रिजाया कठिनकुचतटीलिप्तकाश्मीरपङ्क
    व्यासङ्गादुद्यदर्कद्युतिभिरुपचितस्पर्धमुद्दामहृद्यम दक्षारातेरुदूढप्रतिनवमणिमालावलीभासमानं वक्षो विक्षोभिताघं
    सततनतिजुषां रक्षतादक्षतं नः ।। २३ ॥ वामाङ्के विस्फुरन्त्या करतलविलसच्चारुरक्तोत्पलायाः कान्ताया वामवक्षोरुहभरशिखरोन्मर्दनव्यप्रमेकम्
    । अन्यांस्त्रीनप्युदारान्वरपरशुमृगालंकृतानिन्दुमौले र्बाहूनाबद्धहेमाङ्गदमणिकटकानन्तरालोकयामः ॥ २४
    ॥ संभ्रान्तायाः शिवायाः पतिविलयभिया सर्वलोकोपतापा त्संविग्नस्यापि विष्णो सरभसमुभयोार्वारणप्रेरणाभ्याम्
    । मध्ये त्रैशङ्कवीयामनुभवति दशां यत्र हालाहलोष्मा सोऽयं सर्वापदां नः शमयतु निचयं नीलकण्ठस्य कण्ठः
    ।। २५ ॥ हृद्यैरद्रीन्द्रकन्यामृदुदशनपदैर्मुद्रितो विद्रुमश्री रुद्दयोतन्त्या नितान्तं धवलधवलया मिश्रितो
    दन्तकान्त्या । मुक्तामाणिक्यजालव्यतिकरसदृशा तेजसा भासमानः सद्योजातस्य दद्यादधरमणिरसौ संपदां संचयं
    नः ।। २६ ॥ कर्णालंकारनानामणिनिकररुचां संचयैरञ्चितायां वार्ण्यायां स्वर्णपद्मोदरपरिविलसत्कर्णिकासंनिभायाम्
    । पद्धत्यां प्राणवायोः प्रणतजनहृदम्भोजवासस्य शंभो र्नित्यं नश्चित्तमेतद्विरचयतु सुखेनासिकां नासिकायाम्
    ।। २७ ॥ अत्यन्तं भासमाने रुचिरतररुचां संगमात्सन्मणीना मुद्यच्चण्डांशुधामप्रसरनिरसनस्पष्टदृष्टापदाने
    । भूयास्तां भूतये नः करिवरजयिनः कर्णपाशावलम्बे भक्तालीभालसज्जज्जनिमरणलिपे कुण्डले कुण्डले ते ।। २८
    ॥ याभ्यां कालव्यवस्था भवति तनुमतां यो मुखं देवतानां येषामाहुः स्वरूपं जगति मुनिवरा देवतानां त्रयीं
    ताम् । रुद्राणीवक्त्रपङ्केरुहसततविहारोत्सुकेन्दिन्दिरेभ्य स्तेभ्यस्त्रिभ्यः प्रणामाञ्जलिमुपरचये त्रीक्षणस्येक्षणेभ्यः
    ॥ २९ ॥ वामं वामाङ्कगाया वदनसरसिजे व्यावलद्वल्लभाया व्यानम्रेष्वन्यदन्यत्पुनरलिकभवं वीतनिःशेषरौक्ष्यम्
    । भूयो भूयोऽपि मोदान्निपतदतिदयाशीतलं चूतबाणे दक्षारेरीक्षणानां त्रयमपहरतादाशु तापत्रयं नः ॥ ३०॥ यस्मिन्नर्धेन्दुमुग्धद्युतिनिचयतिरस्कारनिस्तन्द्रकान्तौ
    काश्मीरक्षोदसंकल्पितमिव रुचिरं चित्रकं भाति नेत्रम् । तस्मिन्नुल्लीलचिल्लीनटवरतरुणीलास्यरङ्गायमाणे
    कालारे फालदेशे विहरतु हृदयं वीतचिन्तान्तरं नः ।। ३१ ॥ स्वामिन्गङ्गामिवाङ्गीकुरु तव शिरसा मामपीत्यर्थयन्तीं
    धन्यां कन्यां खरांशोः शिरसि वहति किं न्वेष कारुण्यशाली । इत्थं शङ्कां जनानां जनयदतिघनं कैशिकं कालमेघ
    च्छायं भूयादुदारं त्रिपुरविजयिनः श्रेयसे भूयसे नः ॥ ३२ ॥ शृङ्गाराकल्पयोग्यैः शिखरिवरसुतासत्सखीहस्तलूनैः
    सूनैराबद्धमालावलिपरिविलसत्सौरभाकृष्टभृङ्गम् । तुङ्ग माणिक्यकान्त्या परिहसितसुरावासशैलेन्द्रशृङ्गं
    संघं न संकटानां विघटयतु सदा काङ्कटीकं किरीटम् ।। ३३ ॥ वक्राकारः कलङ्की जडतनुरहमप्यङ्घ्रिसेवानुभावा
    सुलभतरघृणास्यन्दिनश्चन्द्रमौलेः । तत्सेवन्तां जनौघाः शिवमिति निजयावस्थयैव ब्रुवाणं वन्दे देवस्य शंभोर्मुकुटसुघटितं
    मुग्धपीयूषभानुम् ।। ३४ ॥ कान्त्या संफुल्लमल्लीकुसुमधवलया व्याप्य विश्वं विराज न्वृत्ताकारो वितन्वन्मुहुरपि
    च परां निवृतिं पादभाजाम् । सानन्दं नन्दिदोष्णा मणिकटकवता वाह्यमान पुरारेः श्वेतच्छत्राख्यशीतद्युतिरपहरतादापदस्तापदा
    नः ॥ ३५ ॥ दिव्याकल्पोज्ज्वलानां शिवगिरिसुतयोः पार्श्वयोराश्रितानां रुद्राणीसत्सखीनां मदतरलकटाक्षाञ्चलैरञ्चितानाम्
    । उद्वेल्लद्भाहुवल्लीविलसनसमये चामरान्दोलनीना मुद्भूतः कङ्कणालीवलयकलकलो वारयेदापदो नः ॥ ३६ ॥ स्वर्गौकःसुन्दरीणां
    सुललितवपुषां स्वामिसेवापराणां वल्गद्भूषाणि वक्राम्बुजपरिविगलन्मुग्धगीतामृतानि । नित्यं नृत्तान्युपासे
    भुजविधुतिपदन्यासभावावलोक प्रत्युद्यत्प्रीतिमाद्यत्प्रमथनटनटीदत्तसंभावनानि ।। ३७ ।। स्थानप्राप्त्या
    स्वराणां किमपि विशदतां व्यञ्जयन्मञ्जुवीणा स्वानावच्छिन्नतालक्रमममृतमिवास्वाद्यमानं शिवाभ्याम् । नानारागातिहृद्यं
    नवरसमधुरस्तोत्रजातानुविद्धं गानं वीणामहर्षेः कलमतिललितं कर्णपूरायतां नः ।। ३८ ॥ चेतो जातप्रमोदं सपदि
    विदधती प्राणिनां वाणिनीनां पाणिद्वन्द्वाग्रजाग्रत्सुललितरणितस्वर्णतालानुकूला । स्वीयारावेण पाथोधररवपटुना
    नादयन्ती मयूरीं मायूरी मन्दभावं मणिमुरजभवा मार्जना मार्जयेन्नः ।। ३९ ॥ देवेभ्यो दानवेभ्यः पितृमुनिपरिषत्सिद्धविद्याधरेभ्यः
    साध्येभ्यश्चारणेभ्यो मनुजपशुपतज्जातिकीटादिकेभ्यः । श्रीकैलासग्ररूढास्तृणविटपिमुखाश्चापि ये सन्ति तेभ्यः
    सर्वेभ्यो निर्विचारं नतिमुपरचये शर्वपादाश्रयेभ्यः ।। ४० ॥ ध्यायन्नित्थं प्रभाते प्रतिदिवसमिदं स्तोत्ररत्नं
    पठेद्यः किं वा ब्रूमस्तदीयं सुचरितमथवा कीर्तयामः समासात् । संपज्जातं समग्रं सदसि बहुमतिं सर्वलोकप्रियत्वं
    संप्राप्यायुःशतान्ते पदमयति परब्रह्मणो मन्मथारेः ।। ४२ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छंकरभगवतः कृतौ शिवपादादिकेशान्तवर्णनस्तोत्रम् संपूर्णम् ॥
