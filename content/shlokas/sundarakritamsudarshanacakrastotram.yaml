id: sundarakritamsudarshanacakrastotram
category: stotram
name:
  english: sundarakritamsudarshanacakrastotram
  devanagari: सुन्दरकृतंसुदर्शनचक्रस्तोत्रम्
content:
  english: sundarakritam sudarshanacakrastotram sundara uvaca | sudarshana namaste'stu vishnuhastaikabhushana
    | namaste'surasamhartre sahasradityatejase || 36|| kripaveshena bhavatastyaktvaham rakshasim tanum
    | svam rupamabhajam vishnoshcakrayudha namo'stu te || 37|| anujanihi mam gantum tridivam vishnuvallabha
    | bharya me parishocanti virahaturacetasa || 38|| tvanmanasko bhavishyami yavajjivam yatha hyaham
    | tatha rupam kurushva tvam mayi cakra namo'stu te || 39|| evam stutam vishnucakram sundarena sabhaktikam
    | anujagraha sahasa tathastviti munishvarah || 1
  devanagari: सुन्दरकृतं सुदर्शनचक्रस्तोत्रम् सुन्दर उवाच । सुदर्शन नमस्तेऽस्तु विष्णुहस्तैकभूषण । नमस्तेऽसुरसंहर्त्रे
    सहस्रादित्यतेजसे ॥ ३६॥ कृपावेशेन भवतस्त्यक्त्वाहं राक्षसीं तनुम् । स्वं रूपमभजं विष्णोश्चक्रायुध नमोऽस्तु
    ते ॥ ३७॥ अनुजानीहि मां गन्तुं त्रिदिवं विष्णुवल्लभ । भार्या मे परिशोचन्ति विरहातुरचेतसा ॥ ३८॥ त्वन्मनस्को
    भविष्यामि यावज्जीवं यथा ह्यहम् । तथा रूपं कुरुष्व त्वं मयि चक्र नमोऽस्तु ते ॥ ३९॥ एवं स्तुतं विष्णुचक्रं
    सुन्दरेण सभक्तिकम् । अनुजग्राह सहसा तथास्त्विति मुनीश्वराः ॥ १
meaning: {}
