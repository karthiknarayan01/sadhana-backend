id: sri-shanmukha-pancharatna-stuti
category: stotram
name:
  english: Sri Shanmukha Pancharatna Stuti
content:
  english: sphuradvidyudvallivalayitamagotsangavasatim bhavappittaplushtanamitakarunajivanavashat | avantam
    bhaktanamudayakaramambhodhara iti pramodadavasam vyatanuta mayuro'sya savidhe || || subrahmanyo yo
    bhavejjnanashaktya siddham tasmindevasenapatitvam | ittham shaktim devasenapatitvam subrahmanyo bibhradesha
    vyanakti || || paksho'nirvacaniyo dakshina iti dhiyamasheshajanatayah | janayati barhi dakshinanirvacanayogyapakshayukto'yam
    || || yah pakshamanirvacanam yati samavalambya drishyate tena | brahma paratparamamalam subrahmanyabhidham
    param jyotih || || shanmukham hasanmukham sukhamburashikhelanam sanmunindrasevyamanapadapankajam sada
    | manmathadishatruvarganashakam kripambudhim manmahe muda hridi prapannakalpabhuruham || || iti jagadguru
    shringeripithadhipa shricandrashekharabharati shripadaih viracita shrishanmukhapancaratnastutih |
  devanagari: स्फुरद्विद्युद्वल्लीवलयितमगोत्सङ्गवसतिं भवाप्पित्तप्लुष्टानमितकरुणाजीवनवशात् । अवन्तं भक्तानामुदयकरमम्भोधर
    इति प्रमोदादावासं व्यतनुत मयूरोऽस्य सविधे ॥ ॥ सुब्रह्मण्यो यो भवेज्ज्ञानशक्त्या सिद्धं तस्मिन्देवसेनापतित्वम्
    । इत्थं शक्तिं देवसेनापतित्वं सुब्रह्मण्यो बिभ्रदेष व्यनक्ति ॥ ॥ पक्षोऽनिर्वचनीयो दक्षिण इति धियमशेषजनतायाः
    । जनयति बर्ही दक्षिणनिर्वचनायोग्यपक्षयुक्तोऽयम् ॥ ॥ यः पक्षमनिर्वचनं याति समवलम्ब्य दृश्यते तेन ।
    ब्रह्म परात्परममलं सुब्रह्मण्याभिधं परं ज्योतिः ॥ ॥ षण्मुखं हसन्मुखं सुखाम्बुराशिखेलनं सन्मुनीन्द्रसेव्यमानपादपङ्कजं
    सदा । मन्मथादिशत्रुवर्गनाशकं कृपाम्बुधिं मन्महे मुदा हृदि प्रपन्नकल्पभूरुहम् ॥ ॥ इति जगद्गुरु शृङ्गेरीपीठाधिप
    श्रीचन्द्रशेखरभारती श्रीपादैः विरचिता श्रीषण्मुखपञ्चरत्नस्तुतिः ।
