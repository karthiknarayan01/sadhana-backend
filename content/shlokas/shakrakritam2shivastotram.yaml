id: shakrakritam2shivastotram
category: stotram
name:
  english: shakrakritam2shivastotram
  devanagari: शक्रकृतं२शिवस्तोत्रम्
content:
  english: mahakalavane devi drishtva lingamanuttamam | stutim cakara sahasa bhaktinamratmakandharah ||
    24|| namo devadhidevaya shankaraya vrishaya ca | kamyaya bahurupaya vyalayajnopavitine | varenyaya
    namo nityam namaste sarvakamada || 25|| adyah praja srishtikarastvameva kalah prajah samharasi tvameva
    | apampatirbhutapatistvameva dhaneshvarastvam dahanastvameva || 26|| candrashca suryah pavanastvameva
    dhata vidhata paramah puranah | jalashayastvam varunastvameva shailottamastvam bhujageshvarashca |
    dindirmahakala vrishastvameva vinayako guhyavarastvameva || 27|| iti shriskandapurane avantyakhande
    caturashitilingamahatmye pancatrimshadhyayantargatam shakrakritam shivastotram samaptam | skandapurana
    | avantyakhanda | caturashitikhanda | adhyaya 35
  devanagari: महाकालवने देवि दृष्ट्वा लिङ्गमनुत्तमम् । स्तुतिं चकार सहसा भक्तिनम्रात्मकन्धरः ॥ २४॥ नमो
    देवाधिदेवाय शङ्कराय वृषाय च । काम्याय बहुरूपाय व्यालयज्ञोपवीतिने । वरेण्याय नमो नित्यं नमस्ते सर्वकामद
    ॥ २५॥ आद्यः प्रजा सृष्टिकरस्त्वमेव कालः प्रजाः संहरसि त्वमेव । अपाम्पतिर्भूतपतिस्त्वमेव धनेश्वरस्त्वं
    दहनस्त्वमेव ॥ २६॥ चन्द्रश्च सूर्यः पवनस्त्वमेव धाता विधाता परमः पुराणः । जलाशयस्त्वं वरुणस्त्वमेव
    शैलोत्तमस्त्वं भुजगेश्वरश्च । डिण्डिर्महाकाल वृषस्त्वमेव विनायको गुह्यवरस्त्वमेव ॥ २७॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये पञ्चत्रिंशाध्यायान्तर्गतं शक्रकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण
    । आवन्त्यखण्ड । चतुरशीतिखण्ड । अध्याय ३५
