id: dhanvantaristotram
category: stotram
name:
  english: dhanvantaristotram
  devanagari: धन्वन्तरीस्तोत्रम्
content:
  english: trailokyanathaya shrimahavishnave namah || candraughakantimamritorukarairjaganti sanjivayantamamitatmasukham
    paresham | jnanam sudhakalashameva ca sandadhanam shitamshumandalagatam smaratatmasamstham || murdhni
    sthitadamuta eva sudham sravantim bhrumadhyagacca tata eva ca tanusamsthat | hardacca nabhisadanadadharasthitacca
    dhyatvabhipuritatanuh duritam nihanyat || ajnana
  devanagari: त्रैलोक्यनाथाय श्रीमहाविष्णवे नमः ॥ चन्द्रौघकान्तिममृतोरुकरैर्जगन्ति सञ्जीवयन्तममितात्मसुखं
    परेशम् । ज्ञानं सुधाकलशमेव च सन्दधानं शीतांशुमण्डलगतं स्मरतात्मसंस्थम् ॥ मूर्ध्नि स्थितादमुत एव सुधां
    स्रवन्तीं भ्रूमध्यगाच्च तत एव च तानुसंस्थात् । हार्दाच्च नाभिसदनादधरस्थिताच्च ध्यात्वाभिपूरिततनुः
    दुरितं निहन्यात् ॥ अज्ञान
meaning: {}
