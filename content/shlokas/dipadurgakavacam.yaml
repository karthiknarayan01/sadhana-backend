id: dipadurgakavacam
category: kavacha
name:
  english: dipadurgakavacam
  devanagari: दीपदुर्गाकवचम्
content:
  english: sauh vakshah payacca baindaveshvari || 11|| jham nam tam tham sauh aim klim hum mamavyatsa
    bhujantaram | dam dham nam tam stanau payadbherunda mama sarvada || 12|| tham dam dham nam kukshim
    payanmama hrim shrim para jaya | pam pham bam shrim hrim sauh parshvam mridani patu me sada || 13||
    bham mam yam ram shrim sauh lam vam nabhim me pantu kanyakah | sham sham sam ham sada patu guhyam
    me guhyakeshvari || 14|| vrikshah patu sada lingam hrim shrim linganivasini | aim klim sauh patu me
    medhram prishtham me patu varuni || 15|| om shrim hrim klim hum hum patu uru me patvamasada | om aim
    klim sauh yam vatyali janghe payatsada mama || 16|| om shrim sauh klim sada payajjanuni kulasundari
    | om shrim hrim hum kuvali ca gulphau aim shrim mama'vatu || 17|| om shrim hrim klim aim sauh payatkunthi
    klim hrim hrauh me talam | om hrim shrim padau sauh payad hrim shrim klim kutsita mama || 18|| om
    hrim shrim kutila hrim klim padaprishtham ca me'vatu | om shrim hrim shrim ca me patu padastha angulih
    sada || 19|| om hrim sauh aim kuhuh majjam om shrim kunti mama'vatu | raktam kumbheshvari aim klim
    shuklam payacca kucari || 20|| patu me'ngani sarvani om hrim shrim klim aim sauh sada | padadimurdhaparyantam
    hrim klim shrim karuni sada || 21|| murdhadipadaparyantam patu klim shrim kritirmama | urdhvam me
    patu bram brahmim adhah shrim shambhavi mama || 22|| dum durga patu me purve vam varahi shivalaye
    | hrim klim hum shrim ca mam patu uttare kulakamini || 23|| narasimhi sauh aim
  devanagari: सौः वक्षः पायाच्च बैन्दवेश्वरी ॥ ११॥ झं ञं टं ठं सौः ऐं क्लीं हूं ममाव्यात्सा भुजान्तरम्
    । डं ढं णं तं स्तनौ पायाद्भेरुण्डा मम सर्वदा ॥ १२॥ थं दं धं नं कुक्षिं पायान्मम ह्रीं श्रीं परा जया
    । पं फं बं श्रीं ह्रीं सौः पार्श्वं मृडानी पातु मे सदा ॥ १३॥ भं मं यं रं श्रीं सौः लं वं नाभिं मे
    पान्तु कन्यकाः । शं षं सं हं सदा पातु गुह्यं मे गुह्यकेश्वरी ॥ १४॥ वृक्षः पातु सदा लिङ्गं ह्रीं श्रीं
    लिङ्गनिवासिनी । ऐं क्लीं सौः पातु मे मेढ्रं पृष्ठं मे पातु वारुणी ॥ १५॥ ॐ श्रीं ह्रीं क्लीं हुं हूं
    पातु ऊरू मे पात्वमासदा । ॐ ऐं क्लीं सौः यां वात्याली जङ्घे पायात्सदा मम ॥ १६॥ ॐ श्रीं सौः क्लीं सदा
    पायाज्जानुनी कुलसुन्दरी । ॐ श्रीं ह्रीं हूं कूवली च गुल्फौ ऐं श्रीं ममाऽवतु ॥ १७॥ ॐ श्रीं ह्रीं क्लीं
    ऐं सौः पायात्कुण्ठी क्लीं ह्रीं ह्रौः मे तलम् । ॐ ह्रीं श्रीं पादौ सौः पायद् ह्रीं श्रीं क्लीं कुत्सिता
    मम ॥ १८॥ ॐ ह्रीं श्रीं कुटिला ह्रीं क्लीं पादपृष्ठं च मेऽवतु । ॐ श्रीं ह्रीं श्रीं च मे पातु पादस्था
    अङ्गुलीः सदा ॥ १९॥ ॐ ह्रीं सौः ऐं कुहूः मज्जां ॐ श्रीं कुन्ती ममाऽवतु । रक्तं कुम्भेश्वरी ऐं क्लीं
    शुक्लं पायाच्च कूचरी ॥ २०॥ पातु मेऽङ्गानि सर्वाणि ॐ ह्रीं श्रीं क्लीं ऐं सौः सदा । पादादिमूर्धपर्यन्तं
    ह्रीं क्लीं श्रीं कारुणी सदा ॥ २१॥ मूर्धादिपादपर्यन्तं पातु क्लीं श्रीं कृतिर्मम । ऊर्ध्वं मे पातु
    ब्रां ब्राह्मीं अधः श्रीं शाम्भवी मम ॥ २२॥ दुं दुर्गा पातु मे पूर्वे वां वाराही शिवालये । ह्रीं क्लीं
    हूं श्रीं च मां पातु उत्तरे कुलकामिनी ॥ २३॥ नारसिंही सौः ऐं
