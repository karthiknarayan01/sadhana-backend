    बिष्नु सकल जग त्राता ॥ तपबल सम्भु करहिं सङ्घारा। तपबल सेषु धरि महिभारा ॥ तप अधार सब सृष्टि भवानी।
    करहि जाइ तपु अस जियँ जानी ॥ सुनत बचन बिसमित महतारी। सपन सुनायु गिरिहि हँकारी ॥ मातु पितुहि बहुबिधि
    समुझाई। चलीं उमा तप हित हरषाई ॥ प्रिय परिवार पिता अरु माता। भे बिकल मुख आव न बाता ॥ दो बेदसिरा मुनि
    आइ तब सबहि कहा समुझाइ ॥ पारबती महिमा सुनत रहे प्रबोधहि पाइ ॥ ॥ उर धरि उमा प्रानपति चरना। जाइ बिपिन
    लागीं तपु करना ॥ अति सुकुमार न तनु तप जोगू। पति पद सुमिरि तजेउ सबु भोगू ॥ नित नव चरन उपज अनुरागा।
    बिसरी देह तपहिं मनु लागा ॥ सम्बत सहस मूल फल खाए। सागु खाइ सत बरष गवाँए ॥ कछु दिन भोजनु बारि बतासा।
    किए कठिन कछु दिन उपबासा ॥ बेल पाती महि परि सुखाई। तीनि सहस सम्बत सोई खाई ॥ पुनि परिहरे सुखानेउ परना।
    उमहि नाम तब भयु अपरना ॥ देखि उमहि तप खीन सरीरा। ब्रह्मगिरा भै गगन गभीरा ॥ दो भयु मनोरथ सुफल तव सुनु
    गिरिजाकुमारि। परिहरु दुसह कलेस सब अब मिलिहहिं त्रिपुरारि ॥ ॥ अस तपु काहुँ न कीन्ह भवानी। भु अनेक धीर
    मुनि ग्यानी ॥ अब उर धरहु ब्रह्म बर बानी। सत्य सदा सन्तत सुचि जानी ॥ आवै पिता बोलावन जबहीं। हठ परिहरि
    घर जाएहु तबहीम् ॥ मिलहिं तुम्हहि जब सप्त रिषीसा। जानेहु तब प्रमान बागीसा ॥ सुनत गिरा बिधि गगन बखानी।
    पुलक गात गिरिजा हरषानी ॥ उमा चरित सुन्दर मैं गावा। सुनहु सम्भु कर चरित सुहावा ॥ जब तें सती जाइ तनु
    त्यागा। तब सें सिव मन भयु बिरागा ॥ जपहिं सदा रघुनायक नामा। जहँ तहँ सुनहिं राम गुन ग्रामा ॥ दो चिदानन्द
    सुखधाम सिव बिगत मोह मद काम। बिचरहिं महि धरि हृदयँ हरि सकल लोक अभिराम ॥ ॥ कतहुँ मुनिन्ह उपदेसहिं ग्याना।
    कतहुँ राम गुन करहिं बखाना ॥ जदपि अकाम तदपि भगवाना। भगत बिरह दुख दुखित सुजाना ॥ एहि बिधि गयु कालु बहु
    बीती। नित नै होइ राम पद प्रीती ॥ नैमु प्रेमु सङ्कर कर देखा। अबिचल हृदयँ भगति कै रेखा ॥ प्रगटै रामु
    कृतग्य कृपाला। रूप सील निधि तेज बिसाला ॥ बहु प्रकार सङ्करहि सराहा। तुम्ह बिनु अस ब्रतु को निरबाहा
    ॥ बहुबिधि राम सिवहि समुझावा। पारबती कर जन्मु सुनावा ॥ अति पुनीत गिरिजा कै करनी। बिस्तर सहित कृपानिधि
    बरनी ॥ दो अब बिनती मम सुनेहु सिव जौं मो पर निज नेहु। जाइ बिबाहहु सैलजहि यह मोहि मागें देहु ॥ ॥ कह
    सिव जदपि उचित अस नाहीं। नाथ बचन पुनि मेटि न जाहीम् ॥ सिर धरि आयसु करिअ तुम्हारा। परम धरमु यह नाथ हमारा
    ॥ मातु पिता गुर प्रभु कै बानी। बिनहिं बिचार करिअ सुभ जानी ॥ तुम्ह सब भाँति परम हितकारी। अग्या सिर
    पर नाथ तुम्हारी ॥ प्रभु तोषेउ सुनि सङ्कर बचना। भक्ति बिबेक धर्म जुत रचना ॥ कह प्रभु हर तुम्हार पन
    रहेऊ। अब उर राखेहु जो हम कहेऊ ॥ अन्तरधान भे अस भाषी। सङ्कर सोइ मूरति उर राखी ॥ तबहिं सप्तरिषि सिव
    पहिं आए। बोले प्रभु अति बचन सुहाए ॥ दो पारबती पहिं जाइ तुम्ह प्रेम परिच्छा लेहु। गिरिहि प्रेरि पठेहु
    भवन दूरि करेहु सन्देहु ॥ ॥ रिषिन्ह गौरि देखी तहँ कैसी। मूरतिमन्त तपस्या जैसी ॥ बोले मुनि सुनु सैलकुमारी।
    करहु कवन कारन तपु भारी ॥ केहि अवराधहु का तुम्ह चहहू। हम सन सत्य मरमु किन कहहू ॥ कहत बचत मनु अति सकुचाई।
    हँसिहहु सुनि हमारि जड़ताई ॥ मनु हठ परा न सुनि सिखावा। चहत बारि पर भीति उठावा ॥ नारद कहा सत्य सोइ जाना।
    बिनु पङ्खन्ह हम चहहिं उड़आना ॥ देखहु मुनि अबिबेकु हमारा। चाहिअ सदा सिवहि भरतारा ॥ दो सुनत बचन बिहसे
    रिषय गिरिसम्भव तब देह। नारद कर उपदेसु सुनि कहहु बसेउ किसु गेह ॥ ॥ दच्छसुतन्ह उपदेसेन्हि जाई। तिन्ह
    फिरि भवनु न देखा आई ॥ चित्रकेतु कर घरु उन घाला। कनककसिपु कर पुनि अस हाला ॥ नारद सिख जे सुनहिं नर नारी।
    अवसि होहिं तजि भवनु भिखारी ॥ मन कपटी तन सज्जन चीन्हा। आपु सरिस सबही चह कीन्हा ॥ तेहि कें बचन मानि
    बिस्वासा। तुम्ह चाहहु पति सहज उदासा ॥ निर्गुन निलज कुबेष कपाली। अकुल अगेह दिगम्बर ब्याली ॥ कहहु कवन
    सुखु अस बरु पाएँ। भल भूलिहु ठग के बौराएँ ॥ पञ्च कहें सिवँ सती बिबाही। पुनि अवडेरि मराएन्हि ताही ॥
    दो अब सुख सोवत सोचु नहि भीख मागि भव खाहिं। सहज एकाकिन्ह के भवन कबहुँ कि नारि खटाहिम् ॥ ॥ अजहूँ मानहु
    कहा हमारा। हम तुम्ह कहुँ बरु नीक बिचारा ॥ अति सुन्दर सुचि सुखद सुसीला। गावहिं बेद जासु जस लीला ॥ दूषन
    रहित सकल गुन रासी। श्रीपति पुर बैकुण्ठ निवासी ॥ अस बरु तुम्हहि मिलाउब आनी। सुनत बिहसि कह बचन भवानी
    ॥ सत्य कहेहु गिरिभव तनु एहा। हठ न छूट छूटै बरु देहा ॥ कनकु पुनि पषान तें होई। जारेहुँ सहजु न परिहर
    सोई ॥ नारद बचन न मैं परिहरूँ। बसु भवनु उजरु नहिं डरूँ ॥ गुर कें बचन प्रतीति न जेही। सपनेहुँ सुगम न
    सुख सिधि तेही ॥ दो महादेव अवगुन भवन बिष्नु सकल गुन धाम। जेहि कर मनु रम जाहि सन तेहि तेही सन काम ॥
    ॥ जौं तुम्ह मिलतेहु प्रथम मुनीसा। सुनतिउँ सिख तुम्हारि धरि सीसा ॥ अब मैं जन्मु सम्भु हित हारा। को
    गुन दूषन करै बिचारा ॥ जौं तुम्हरे हठ हृदयँ बिसेषी। रहि न जाइ बिनु किएँ बरेषी ॥ तौ कौतुकिअन्ह आलसु
    नाहीं। बर कन्या अनेक जग माहीम् ॥ जन्म कोटि लगि रगर हमारी। बरुँ सम्भु न त रहुँ कुआरी ॥ तजुँ न नारद
    कर उपदेसू। आपु कहहि सत बार महेसू ॥ मैं पा परुँ कहि जगदम्बा। तुम्ह गृह गवनहु भयु बिलम्बा ॥ देखि प्रेमु
    बोले मुनि ग्यानी। जय जय जगदम्बिके भवानी ॥ दो तुम्ह माया भगवान सिव सकल जगत पितु मातु। नाइ चरन सिर मुनि
    चले पुनि पुनि हरषत गातु ॥ ॥ जाइ मुनिन्ह हिमवन्तु पठाए। करि बिनती गिरजहिं गृह ल्याए ॥ बहुरि सप्तरिषि
    सिव पहिं जाई। कथा उमा कै सकल सुनाई ॥ भे मगन सिव सुनत सनेहा। हरषि सप्तरिषि गवने गेहा ॥ मनु थिर करि
    तब सम्भु सुजाना। लगे करन रघुनायक ध्याना ॥ तारकु असुर भयु तेहि काला। भुज प्रताप बल तेज बिसाला ॥ तेंहि
    सब लोक लोकपति जीते। भे देव सुख सम्पति रीते ॥ अजर अमर सो जीति न जाई। हारे सुर करि बिबिध लराई ॥ तब बिरञ्चि
    सन जाइ पुकारे। देखे बिधि सब देव दुखारे ॥ दो सब सन कहा बुझाइ बिधि दनुज निधन तब होइ। सम्भु सुक्र सम्भूत
    सुत एहि जीति रन सोइ ॥ ॥ मोर कहा सुनि करहु उपाई। होइहि ईस्वर करिहि सहाई ॥ सतीं जो तजी दच्छ मख देहा।
    जनमी जाइ हिमाचल गेहा ॥ तेहिं तपु कीन्ह सम्भु पति लागी। सिव समाधि बैठे सबु त्यागी ॥ जदपि अहि असमञ्जस
    भारी। तदपि बात एक सुनहु हमारी ॥ पठवहु कामु जाइ सिव पाहीं। करै छोभु सङ्कर मन माहीम् ॥ तब हम जाइ सिवहि
    सिर नाई। करवाउब बिबाहु बरिआई ॥ एहि बिधि भलेहि देवहित होई। मर अति नीक कहि सबु कोई ॥ अस्तुति सुरन्ह
    कीन्हि अति हेतू। प्रगटेउ बिषमबान झषकेतू ॥ दो सुरन्ह कहीं निज बिपति सब सुनि मन कीन्ह बिचार। सम्भु बिरोध
    न कुसल मोहि बिहसि कहेउ अस मार ॥ ॥ तदपि करब मैं काजु तुम्हारा। श्रुति कह परम धरम उपकारा ॥ पर हित लागि
    तजि जो देही। सन्तत सन्त प्रसंसहिं तेही ॥ अस कहि चलेउ सबहि सिरु नाई। सुमन धनुष कर सहित सहाई ॥ चलत मार
    अस हृदयँ बिचारा। सिव बिरोध ध्रुव मरनु हमारा ॥ तब आपन प्रभाउ बिस्तारा। निज बस कीन्ह सकल संसारा ॥ कोपेउ
    जबहि बारिचरकेतू। छन महुँ मिटे सकल श्रुति सेतू ॥ ब्रह्मचर्ज ब्रत सञ्जम नाना। धीरज धरम ग्यान बिग्याना
    ॥ सदाचार जप जोग बिरागा। सभय बिबेक कटकु सब भागा ॥ छं भागेउ बिबेक सहाय सहित सो सुभट सञ्जुग महि मुरे।
    सदग्रन्थ पर्बत कन्दरन्हि महुँ जाइ तेहि अवसर दुरे ॥ होनिहार का करतार को रखवार जग खरभरु परा। दुइ माथ
    केहि रतिनाथ जेहि कहुँ कोऽपि कर धनु सरु धरा ॥ दो जे सजीव जग अचर चर नारि पुरुष अस नाम। ते निज निज मरजाद
    तजि भे सकल बस काम ॥ ॥ सब के हृदयँ मदन अभिलाषा। लता निहारि नवहिं तरु साखा ॥ नदीं उमगि अम्बुधि कहुँ
    धाई। सङ्गम करहिं तलाव तलाई ॥ जहँ असि दसा जड़न्ह कै बरनी। को कहि सकि सचेतन करनी ॥ पसु पच्छी नभ जल थलचारी।
    भे कामबस समय बिसारी ॥ मदन अन्ध ब्याकुल सब लोका। निसि दिनु नहिं अवलोकहिं कोका ॥ देव दनुज नर किन्नर
    ब्याला। प्रेत पिसाच भूत बेताला ॥ इन्ह कै दसा न कहेउँ बखानी। सदा काम के चेरे जानी ॥ सिद्ध बिरक्त महामुनि
    जोगी। तेपि कामबस भे बियोगी ॥ छं भे कामबस जोगीस तापस पावँरन्हि की को कहै। देखहिं चराचर नारिमय जे ब्रह्ममय
    देखत रहे ॥ अबला बिलोकहिं पुरुषमय जगु पुरुष सब अबलामयं। दुइ दण्ड भरि ब्रह्माण्ड भीतर कामकृत कौतुक अयम्
    ॥ सो धरी न काहूँ धिर सबके मन मनसिज हरे। जे राखे रघुबीर ते उबरे तेहि काल महुँ ॥ ॥ उभय घरी अस कौतुक
    भयू। जौ लगि कामु सम्भु पहिं गयू ॥ सिवहि बिलोकि ससङ्केउ मारू। भयु जथाथिति सबु संसारू ॥ भे तुरत सब जीव
    सुखारे। जिमि मद उतरि गेँ मतवारे ॥ रुद्रहि देखि मदन भय माना। दुराधरष दुर्गम भगवाना ॥ फिरत लाज कछु करि
    नहिं जाई। मरनु ठानि मन रचेसि उपाई ॥ प्रगटेसि तुरत रुचिर रितुराजा। कुसुमित नव तरु राजि बिराजा ॥ बन
    उपबन बापिका तड़आगा। परम सुभग सब दिसा बिभागा ॥ जहँ तहँ जनु उमगत अनुरागा। देखि मुएहुँ मन मनसिज जागा
    ॥ छं जागि मनोभव मुएहुँ मन बन सुभगता न परै कही। सीतल सुगन्ध सुमन्द मारुत मदन अनल सखा सही ॥ बिकसे सरन्हि
    बहु कञ्ज गुञ्जत पुञ्ज मञ्जुल मधुकरा। कलहंस पिक सुक सरस रव करि गान नाचहिं अपछरा ॥ दो सकल कला करि कोटि
    बिधि हारेउ सेन समेत। चली न अचल समाधि सिव कोपेउ हृदयनिकेत ॥ ॥ देखि रसाल बिटप बर साखा। तेहि पर चढ़एउ
    मदनु मन माखा ॥ सुमन चाप निज सर सन्धाने। अति रिस ताकि श्रवन लगि ताने ॥ छाड़ए बिषम बिसिख उर लागे। छुटि
    समाधि सम्भु तब जागे ॥ भयु ईस मन छोभु बिसेषी। नयन उघारि सकल दिसि देखी ॥ सौरभ पल्लव मदनु बिलोका। भयु
    कोपु कम्पेउ त्रैलोका ॥ तब सिवँ तीसर नयन उघारा। चितवत कामु भयु जरि छारा ॥ हाहाकार भयु जग भारी। डरपे
    सुर भे असुर सुखारी ॥ समुझि कामसुखु सोचहिं भोगी। भे अकण्टक साधक जोगी ॥ छं जोगि अकण्टक भे पति गति सुनत
    रति मुरुछित भी। रोदति बदति बहु भाँति करुना करति सङ्कर पहिं गी। अति प्रेम करि बिनती बिबिध बिधि जोरि
    कर सन्मुख रही। प्रभु आसुतोष कृपाल सिव अबला निरखि बोले सही ॥ दो अब तें रति तव नाथ कर होइहि नामु अनङ्गु।
    बिनु बपु ब्यापिहि सबहि पुनि सुनु निज मिलन प्रसङ्गु ॥ ॥ जब जदुबंस कृष्न अवतारा। होइहि हरन महा महिभारा
    ॥ कृष्न तनय होइहि पति तोरा। बचनु अन्यथा होइ न मोरा ॥ रति गवनी सुनि सङ्कर बानी। कथा अपर अब कहुँ बखानी
    ॥ देवन्ह समाचार सब पाए। ब्रह्मादिक बैकुण्ठ सिधाए ॥ सब सुर बिष्नु बिरञ्चि समेता। गे जहाँ सिव कृपानिकेता
    ॥ पृथक पृथक तिन्ह कीन्हि प्रसंसा। भे प्रसन्न चन्द्र अवतंसा ॥ बोले कृपासिन्धु बृषकेतू। कहहु अमर आए
