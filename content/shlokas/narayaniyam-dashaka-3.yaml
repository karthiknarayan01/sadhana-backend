id: narayaniyam-dashaka-3
category: stotram
name:
  english: Narayaniyam Dashaka 3
content:
  english: pathanto namani pramadabharasindhau nipatitah smaranto rupam te varada kathayanto gunakathah
    | caranto ye bhaktastvayi khalu ramante paramamu naham dhanyan manye samadhigatasarvabhilashitan ||
    || gadaklishtam kashtam tava caranasevarasabhare' pyanasaktam cittam bhavati bata vishno kuru dayam
    | bhavatpadambhojasmaranarasiko namanivaha naham gayam gayam kuhacana vivatsyami vijane || || kripa
    te jata cetkimiva na hi labhyam tanubhritam madiyakleshaughaprashamanadasha nama kiyati | na ke ke
    loke'sminnanishamayi shokabhirahita bhavadbhakta muktah sukhagatimasakta vidadhate || || munipraudha
    rudha jagati khalu gudhatmagatayo bhavatpadambhojasmaranavirujo naradamukhah | carantisha svairam
    satataparinirbhataparaci tsadanandadvaitaprasaraparimagnah kimaparam || || bhavadbhaktih sphita bhavatu
    mama saiva prashamaye dasheshakleshaugham na khalu hridi sandehakanika | na cedvyasasyoktistava ca
    vacanam naigamavaco bhavenmithya rathyapurushavacanaprayamakhilam || || bhavadbhaktistavat pramukhamadhura
    tvat gunarasat kimapyarudha cedakhilaparitapaprashamani | punashcante svante vimalaparibodhodayamila
    nmahanandadvaitam dishati kimatah prarthyamaparam || || vidhuya kleshanme kuru caranayugmam dhritarasam
    bhavatkshetrapraptau karamapi ca te pujanavidhau | bhavanmurtyaloke nayanamatha te padatulasi parighrane
    ghranam shravanamapi te carucarite || || prabhutadhivyadhiprasabhacalite mamakahridi tvadiyam tadrupam
    paramasukhacidrupamudiyat | udancadromanco galitabahuharshashrunivaho yatha vismaryasam durupashamapidaparibhavan
    || || marudgehadhisha tvayi khalu paranco'pi sukhino bhavatsnehi so'ham subahu paritapye ca kimidam
    | akirtiste ma bhudvarada gadabharam prashamayan bhavat bhaktottamsam jhatiti kuru mam kamsadamana
    || || kimuktairbhuyobhistava hi karuna yavadudiya daham tavaddeva prahitavividhartapralapitah | purah
    klripte pade varada tava neshyami divasa nyathashakti vyaktam natinutinisheva viracayan ||
  devanagari: पठन्तो नामानि प्रमदभरसिन्धौ निपतिताः स्मरन्तो रूपं ते वरद कथयन्तो गुणकथाः । चरन्तो ये भक्तास्त्वयि
    खलु रमन्ते परममू नहं धन्यान् मन्ये समधिगतसर्वाभिलषितान् ॥ ॥ गदक्लिष्टं कष्टं तव चरणसेवारसभरेऽ प्यनासक्तं
    चित्तं भवति बत विष्णो कुरु दयाम् । भवत्पादाम्भोजस्मरणरसिको नामनिवहा नहं गायं गायं कुहचन विवत्स्यामि
    विजने ॥ ॥ कृपा ते जाता चेत्किमिव न हि लभ्यं तनुभृतां मदीयक्लेशौघप्रशमनदशा नाम कियती । न के के लोकेऽस्मिन्ननिशमयि
    शोकाभिरहिता भवद्भक्ता मुक्ताः सुखगतिमसक्ता विदधते ॥ ॥ मुनिप्रौढा रूढा जगति खलु गूढात्मगतयो भवत्पादाम्भोजस्मरणविरुजो
    नारदमुखाः । चरन्तीश स्वैरं सततपरिनिर्भातपरचि त्सदानन्दाद्वैतप्रसरपरिमग्नाः किमपरम् ॥ ॥ भवद्भक्तिः
    स्फीता भवतु मम सैव प्रशमये दशेषक्लेशौघं न खलु हृदि सन्देहकणिका । न चेद्व्यासस्योक्तिस्तव च वचनं नैगमवचो
    भवेन्मिथ्या रथ्यापुरुषवचनप्रायमखिलम् ॥ ॥ भवद्भक्तिस्तावत् प्रमुखमधुरा त्वत् गुणरसात् किमप्यारूढा चेदखिलपरितापप्रशमनी
    । पुनश्चान्ते स्वान्ते विमलपरिबोधोदयमिल न्महानन्दाद्वैतं दिशति किमतः प्रार्थ्यमपरम् ॥ ॥ विधूय क्लेशान्मे
    कुरु चरणयुग्मं धृतरसं भवत्क्षेत्रप्राप्तौ करमपि च ते पूजनविधौ । भवन्मूर्त्यालोके नयनमथ ते पादतुलसी
    परिघ्राणे घ्राणं श्रवणमपि ते चारुचरिते ॥ ॥ प्रभूताधिव्याधिप्रसभचलिते मामकहृदि त्वदीयं तद्रूपं परमसुखचिद्रूपमुदियात्
    । उदञ्चद्रोमाञ्चो गलितबहुहर्षाश्रुनिवहो यथा विस्मर्यासं दुरुपशमपीडापरिभवान् ॥ ॥ मरुद्गेहाधीश त्वयि
    खलु पराञ्चोऽपि सुखिनो भवत्स्नेही सोऽहं सुबहु परितप्ये च किमिदम् । अकीर्तिस्ते मा भूद्वरद गदभारं प्रशमयन्
    भवत् भक्तोत्तंसं झटिति कुरु मां कंसदमन ॥ ॥ किमुक्तैर्भूयोभिस्तव हि करुणा यावदुदिया दहं तावद्देव प्रहितविविधार्तप्रलपितः
    । पुरः क्लृप्ते पादे वरद तव नेष्यामि दिवसा न्यथाशक्ति व्यक्तं नतिनुतिनिषेवा विरचयन् ॥
