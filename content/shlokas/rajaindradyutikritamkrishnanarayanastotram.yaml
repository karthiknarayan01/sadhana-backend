id: rajaindradyutikritamkrishnanarayanastotram
category: stotram
name:
  english: rajaindradyutikritamkrishnanarayanastotram
  devanagari: राजाइन्द्रद्युतिकृतंकृष्णनारायणस्तोत्रम्
content:
  english: raja indradyutikritam krishnanarayanastotram tadbhaktya'nugraham kurvan sakshat krishnanarayanah
    | pradurasit pitavasah kishorashca jaganmayah || 20|| indradyutirharim vikshya neme tushtava tam prabhum
    | krishnanarayana vishno purushottama keshava || 21|| anadishrihare svamin hrishikesha ca te namah
    | vishvatman srishtikritkrishnanantashakte ca te namah || 22|| nirgunanantadivyanam gunanam purnamurtika
    | jnanagamya kripalabhya purushottama te namah || 23|| anantamurtaye tubhyam namo'stvanandarupine
    | namaste parameshaya brahmane paramatmane || 24|| tvam pita sarvabhutanam mata bandhuh suhritsakha
    | tvamaksharam param dhama cinmatram vyoma vai brihat || 25|| sarvasyadharamavyaktamanantam tamasah
    param | tvam pashyanti paratmanam jnanadipena sevakah || 26|| prapadye tam bhavedrupam saccidanandavigraham
    | yatraste bhagava~stadvai shrihareh paramam padam || 27|| tvameva nayasi shrimatkrishnanarayanaprabho
    | jnanam dehi padam dehi tvanmaya ma pradehi me || 28|| ityuktva prapatantam tam padayoh svakarena
    ha | pasparsha prahasan krishnanarayanah punah punah || 29|| iti shrilakshminarayaniyasamhita | khanda
    2| adhyaya 71
  devanagari: राजा इन्द्रद्युतिकृतं कृष्णनारायणस्तोत्रम् तद्भक्त्याऽनुग्रहं कुर्वन् साक्षात् कृष्णनारायणः
    । प्रादुरासीत् पीतवासाः किशोरश्च जगन्मयः ॥ २०॥ इन्द्रद्युतिर्हरिं वीक्ष्य नेमे तुष्टाव तं प्रभुम्
    । कृष्णनारायण विष्णो पुरुषोत्तम केशव ॥ २१॥ अनादिश्रीहरे स्वामिन् हृषीकेश च ते नमः । विश्वात्मन् सृष्टिकृत्कृष्णानन्तशक्ते
    च ते नमः ॥ २२॥ निर्गुणानन्तदिव्यानां गुणानां पूर्णमूर्तिक । ज्ञानगम्य कृपालभ्य पुरुषोत्तम ते नमः ॥
    २३॥ अनन्तमूर्तये तुभ्यं नमोऽस्त्वानन्दरूपिणे । नमस्ते परमेशाय ब्रह्मणे परमात्मने ॥ २४॥ त्वं पिता सर्वभूतानां
    माता बन्धुः सुहृत्सखा । त्वमक्षरं परं धाम चिन्मात्रं व्योम वै बृहत् ॥ २५॥ सर्वस्याधारमव्यक्तमनन्तं
    तमसः परम् । त्वां पश्यन्ति परात्मानं ज्ञानदीपेन सेवकाः ॥ २६॥ प्रपद्ये तं भवेद्रूपं सच्चिदानन्दविग्रहम्
    । यत्रास्ते भगवाँस्तद्वै श्रीहरेः परमं पदम् ॥ २७॥ त्वमेव नयसि श्रीमत्कृष्णनारायणप्रभो । ज्ञानं देहि
    पदं देहि त्वन्माया मा प्रदेहि मे ॥ २८॥ इत्युक्त्वा प्रपतन्तं तं पादयोः स्वकरेण ह । पस्पर्श प्रहसन्
    कृष्णनारायणः पुनः पुनः ॥ २९॥ इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय ७१
