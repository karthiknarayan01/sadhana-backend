id: muktika
category: upanishad
name:
  english: muktika
  devanagari: मुक्तिका
content:
  english: '|| muktika upanishat || rigvedasya tu shakhah syurekavimshatisamkhyakah | navadhikashatam
    shakha yajusho marutatmaja || sahasrasamkhyaya jatah shakhah samnah paramtapa | atharvanasya shakhah
    syuh pamcashadbhedato hare || ekaikasyastu shakhaya ekaikopanishanmata | tasamekamricam yashca pathate
    bhaktito mayi || sa matsayujyapadavim prapnoti munidurlabham | iyam kaivalyamuktistu kenopayena siddhyati
    | mamdukyamekamevalam mumukshunam vimuktaye || tathapyasiddham cejjnanam dashopanishadam patha | jnanam
    labdhva ciradeva mamakam dhama yasyasi || tathapi dridhata no cedvijnanasyanjanasuta | dvatrimshakhyopanishadam
    samabhyasya nivartaya || videhamuktaviccha cedoshtarashatam patha | tasam kramam sashamtim ca shrunu
    vakshyami tattvatah || ishakenakathaprashnamumdamamdukyatittirih | aitareyam ca chamdogyam brihadaranyakam
    tatha || brahmakaivalyajabalashvetashvo hamsa arunih | garbho narayano hamso bindurnadashirah shikha
    || maitrayani kaushitaki brihajjabalatapani | kalagnirudramaitreyi subalakshurimantrika || sarvasaram
    niralambam rahasyam vajrasucikam | tejonadadhyanavidyayogatattvatmabodhakam || parivrat trishikhi
    sita cuda nirvanamamdalam | dakshina sharabham skamdam mahanarayanavhayam || rahasyam ramatapanam
    vasudevam ca mudgalam | shamdilyam paimgalam bhikshumahaccharirakam shikha || turiyatitasamnyasaparivrajakshamalika
    | avyaktaikaksharam purna suryakshyadhyatmakumdika || savitryatma pashupatam param brahmavadhutakam
    | tripuratapanam devitripura kathabhavana || hridayam kumdali bhasma rudrakshaganadarshanam || tarasaramahavakyapamcabrahmagnihotrakam
    | gopalatapanam krishnam yajnavalkyam varahakam || shatyayani hayagrivam dattatreyam ca garudam |
    kalijabalisaubhagyarahasyaricamuktika || evamashtottarashatam bhavanatrayanashanam | jnanavairagyadam
    pumsam vasanatrayanashanam || grihitvashtottarashatam ye pathamti dvijottamah | prarabdhakshayaparyamtam
    jivanmukta bhavamti te || aitareyakaushitakinadabimdvatmaprabodhanirvanamudgalakshamalikatripurasaubhagya'
  devanagari: ॥ मुक्तिका उपनिषत् ॥ ऋग्वेदस्य तु शाखाः स्युरेकविंशतिसंख्यकाः । नवाधिकशतं शाखा यजुशो मारुतात्मज
    ॥ सहस्रसंख्यया जाताः शाखाः साम्नः परंतप । अथर्वणस्य शाखाः स्युः पंचाशद्भेदतो हरे ॥ एकैकस्यास्तु शाखाया
    एकैकोपनिषन्मता । तासामेकामृचं यश्च पठते भक्तितो मयि ॥ स मत्सायुज्यपदवीं प्राप्नोति मुनिदुर्लभाम् ।
    इयं कैवल्यमुक्तिस्तु केनोपायेन सिद्ध्यति । मांडूक्यमेकमेवालं मुमुक्षूणां विमुक्तये ॥ तथाप्यसिद्धं
    चेज्ज्ञानं दशोपनिषदं पठ । ज्ञानं लब्ध्वा चिरादेव मामकं धाम यास्यसि ॥ तथापि दृढता नो चेद्विज्ञानस्याञ्जनासुत
    । द्वात्रिंशाख्योपनिषदं समभ्यस्य निवर्तय ॥ विदेहमुक्ताविच्छा चेदोष्टरशतं पठ । तासं क्रमं सशांतिं च
    श्रुणु वक्ष्यामि तत्त्वतः ॥ ईशकेनकठप्रश्नमुंडमांडूक्यतित्तिरिः । ऐतरेयं च छांदोग्यं बृहदारण्यकं तथा
    ॥ ब्रह्मकैवल्यजाबालश्वेताश्वो हंस आरुणिः । गर्भो नारायणो हंसो बिन्दुर्नादशिरः शिखा ॥ मैत्रायणी कौषीतकी
    बृहज्जाबालतापनी । कालाग्निरुद्रमैत्रेयी सुबालक्षुरिमन्त्रिका ॥ सर्वसारं निरालंबं रहस्यं वज्रसूचिकम्
    । तेजोनादध्यानविद्यायोगतत्त्वात्मबोधकम् ॥ परिव्राट् त्रिशिखि सीता चूडा निर्वाणमंडलम् । दक्षिणा शरभं
    स्कंदं महानारायणाव्हयम् ॥ रहस्यं रामतपनं वासुदेवं च मुद्गलम् । शांडिल्यं पैंगलं भिक्षुमहच्छारीरकं
    शिखा ॥ तुरीयातीतसंन्यासपरिव्रजाक्षमालिका । अव्यक्तैकाक्षरं पूर्णा सूर्याक्ष्यध्यात्मकुंडिका ॥ सावित्र्यात्मा
    पाशुपतं परं ब्रह्मावधूतकम् । त्रिपुरातपनं देवीत्रिपुरा कठभावना ॥ हृदयं कुंडली भस्म रुद्राक्षगणदर्शनम्
    ॥ तारसारमहावाक्यपंचब्रह्माग्निहोत्रकम् । गोपालतपनं कृष्णं याज्ञवल्क्यं वराहकम् ॥ शाट्यायनि हयग्रीवं
    दत्तात्रेयं च गारुडम् । कलिजाबालिसौभाग्यरहस्यऋचमुक्तिका ॥ एवमष्टोत्तरशतं भावनात्रयनाशनम् । ज्ञानवैराग्यदं
    पुंसां वासनात्रयनाशनम् ॥ गृहीत्वाष्टोत्तरशतं ये पठंति द्विजोत्तमाः । प्रारब्धक्षयपर्यंतं जीवन्मुक्ता
    भवंति ते ॥ ऐतरेयकौषितकीनादबिंद्वात्मप्रबोधनिर्वाणमुद्गलाक्षमालिकात्रिपुरासौभाग्य
