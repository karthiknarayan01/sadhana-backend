id: candalinimalavanikritamdharmadevistotram
category: stotram
name:
  english: candalinimalavanikritamdharmadevistotram
  devanagari: चण्डालिनीमालवानीकृतंधर्मदेवीस्तोत्रम्
content:
  english: namo dharmadevatayai narayanyai namo namah || 72|| namashcandalikabhaktya prasannayai ca te
    namah | namah shabalikayonisvarupayai ca te namah || 73|| namo mantrasvarupayai mahadhatryai ca te
    namah | namo'nadikrishnanarayanavanyai ca te namah || 74|| namah shaktyai mahashaktyai pavayitryai
    ca te namah | namah kalyanakartryai te divyamatre ca te namah || 75|| malavanya meladatryai dharmadayai
    ca te namah | punarme darshanam dehi matarnihsamshayaya me || 76|| ya'ham prishtva bhavaparam yasyamyeva
    na samshayah | ityarthita dharmadevi pradrishyate tada punah || 77|| iti shrilakshminarayaniyasamhitayah
    tishyasantanatmakasya caturthakhande 35
  devanagari: नमो धर्मदेवतायै नारायण्यै नमो नमः ॥ ७२॥ नमश्चाण्डालिकाभक्त्या प्रसन्नायै च ते नमः । नमः
    शबलिकायोनिस्वरूपायै च ते नमः ॥ ७३॥ नमो मन्त्रस्वरूपायै महाधात्र्यै च ते नमः । नमोऽनादिकृष्णनारायणवाण्यै
    च ते नमः ॥ ७४॥ नमः शक्त्यै महाशक्त्यै पावयित्र्यै च ते नमः । नमः कल्याणकर्त्र्यै ते दिव्यमात्रे च
    ते नमः ॥ ७५॥ मालवान्या मेलदात्र्यै धर्मदायै च ते नमः । पुनर्मे दर्शनं देहि मातर्निःसंशयाय मे ॥ ७६॥
    याऽहं पृष्ट्वा भवपारं यास्याम्येव न संशयः । इत्यर्थिता धर्मदेवी प्रादृश्यते तदा पुनः ॥ ७७॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    तिष्यसन्तानात्मकस्य चतुर्थखण्डे ३५
meaning: {}
