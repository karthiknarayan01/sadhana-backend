id: sarpa-suktam
category: stotram
name:
  english: Sarpa Suktam
content:
  english: namo astu sarpebhyo ye ke ca prithivi manu | ye antarikshe ye divi tebhyah sarpebhyo namah
    | 'do rocane divo ye va suryasya rashmishu | yeshamapsu sadah krita ntebhyah sarpebhyo namah | ya
    ishavo yatudhananam ye~ va vanaspatigm 'vateshu sherate tebhyah sarpebhyo namah | idagm sarpebhyo
    havirastu jushtam | ashresha yeshamanuyanti cetah | ye antariksha nkshiyanti | te nassarpaso havamagamishthah
    | ye rocane suryasyapi sarpah | ye diva ndevimanusancaranti | yeshamashresha anuyanti kamam | tebhyassarpebhyo
    madhumajjuhomi || || nighrishvairasamayutaih | kalair haritvamapannaih | indrayahi sahasrayuk | agnirvibhrashtivasanah
    | vayushvetasikadrukah | sam va~thsaro vishuvarnaih 'nucarastava | subrahmanyogm subrahmanyogm subrahmanyogm
    ||
  devanagari: नमो॑ अस्तु स॒र्पेभ्यो॒ ये के च॑ पृथि॒वी मनु॑ । ये अ॒न्तरि॑क्षे॒ ये दि॒वि तेभ्यः॑ स॒र्पेभ्यो॒
    नमः॑ । ऽदो रो॑च॒ने दि॒वो ये वा॒ सूर्य॑स्य र॒श्मिषु॑ । येषा॑म॒प्सु सदः॑ कृ॒त न्तेभ्यः॑ स॒र्पेभ्यो॒
    नमः॑ । या इष॑वो यातु॒धाना॑नां॒ येँ वा॒ वन॒स्पती॒ग्ं॒ ऽव॒टेषु॒ शेर॑ते॒ तेभ्यः॑ स॒र्पेभ्यो॒ नमः॑ । इ॒दग्ं
    स॒र्पेभ्यो॑ ह॒विर॑स्तु॒ जुष्टम् । आ॒श्रे॒षा येषा॑मनु॒यन्ति॒ चेतः॑ । ये अ॒न्तरि॑क्ष ङ्क्षि॒यन्ति॑ ।
    ते न॑स्स॒र्पासो॒ हव॒माग॑मिष्ठाः । ये रो॑च॒ने सूर्य॒स्यापि॑ स॒र्पाः । ये दिव॑ न्दे॒वीमनु॑स॒न्चर॑न्ति
    । येषा॑माश्रे॒षा अ॑नु॒यन्ति॒ कामम् । तेभ्य॑स्स॒र्पेभ्यो॒ मधु॑मज्जुहोमि ॥ ॥ नि॒घृष्वै॑रस॒मायु॑तैः ।
    कालैर् हरित्व॑माप॒न्नैः । इन्द्राया॑हि स॒हस्र॑युक् । अ॒ग्निर्वि॒भ्राष्टि॑वसनः । वा॒युश्वेत॑सिकद्रु॒कः
    । सं॒ वँ॒थ्स॒रो वि॑षू॒वर्णैः ऽनुच॑रास्त॒व । सुब्रह्मण्योग्ं सुब्रह्मण्योग्ं सु॑ब्रह्मण्योग्म् ॥
