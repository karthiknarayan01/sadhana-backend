id: shaktitripuramahimnastotra
category: stotram
name:
  english: shaktitripuramahimnastotra
  devanagari: शक्तित्रिपुरामहिम्नस्तोत्र
content:
  english: ssakila nishkila gurubhirupadishta api tava | prasannayam devi tvayi sakalamantrarthaphalada
    tarormule sikte vilati khalu shakhashatatami || 27|| sarvam sarvata eva sarvavishaye karyendriyanyantara
    tattaddivyahrishikakarmabhiridam savyastuvanapara | vagarthavyavaharakaranatanushshaktirjagadvyapini
    yadbijatmakatam gata tava shive tam naumi bijam param || 28
  devanagari: स्सकीला निष्कीला गुरुभिरुपदिष्टा अपि तव । प्रसन्नायां देवि त्वयि सकलमन्त्रार्थफलदा तरोर्मूले
    सिक्ते विलति खलु शाखाशततमी ॥ २७॥ सर्वं सर्वत एव सर्वविषये कार्येन्द्रियाण्यन्तरा तत्तद्दिव्यहृषीककर्मभिरिदं
    सव्यस्तुवानापरा । वागर्थव्यवहारकारणतनुश्शक्तिर्जगद्व्यापिनी यद्बीजात्मकतां गता तव शिवे तं नौमि बीजं
    परम् ॥ २८
meaning: {}
