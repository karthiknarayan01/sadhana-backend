id: namavali-43
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: ramanujashtottarashatanamavalih om shrimate ramanujaya namah || om ramanujaya namah | pushkarakshaya
    | yatindraya | karunakaraya | kantimatyatmajaya | shrimate | lilamanushavigrahaya | sarvashastrarthatattvajnaya
    | sarvajnaya | sajjanapriyaya | narayanakripapatraya | shribhutapuranayakaya | anaghaya | bhaktamandaraya
    | keshavanandavardhanaya | kancipurnapriyasakhaya | pranatartivinashakaya | punyasankirtanaya | punyaya
    | brahmarakshasamocakaya namah || 20|| om yadavapaditaparthavrikshachedakutharakaya namah | amoghaya
    | lakshmanamunaye | sharadashokanashanaya | nirantarajanajnanavimocanavicakshanaya | vedantadvayasarajnaya
    | varadambupradayakaya | parabhiprayatattvajnaya | yamunangulimocakaya | devarajakripalabdhashadvakyarthamahodadhaye
    | purnaryalabdhasanmantraya | shauripadabjashatpadaya | tridandadharine | brahmajnaya | brahmajnanaparayanaya
    | rangeshakainkaryarathaya | vibhutidvayanayakaya | goshthipurnakripalabdhamantrarajaprakashakaya
    | vararanganukampattadravidamnayaparagaya | maladhararyasujnatadravidamnayatattvadhiye namah || 40||
    om catussaptashishyadhyaya namah | pancacaryapadashrayaya | prapitavishatirthambuprakatikritavaibhavaya
    | pranatartiharacaryadattabhikshaikabhojanaya | pavitrikritakureshaya | bhagineyatridandakaya | kureshadasharathyadicaramarthaprakashakaya
    | rangeshavenkateshadiprakatikritavaibhavaya | devarajarcanarataya | mukamuktipradayakaya | yajnamurtipratishthatre
    | mannathaya | dharanidharaya | varadacaryasadbhaktaya | yajneshartivinashakaya | anantabhishtaphaladaya
    | viththaleshaprapujitaya | shrishailapurnakarunalabdharamayanarthakaya | prapattidharmaikarataya
    | govindaryapriyanujaya namah || 60|| om vyasasutrarthatattvajnaya namah | bodhayanamatanugaya | shribhashyadimahagranthakarakaya
    | kalinashanaya | advaitamatavicchetre | vishishtadvaitaparagaya | kuranganagaripurnamantraratnopadeshikaya
    | vinashitetaramataya | sheshikritaramapataye | putrikrita shatharataye | shathajite | rinamocakaya
    | bhashadattahayagrivaya | bhashyakaraya | mahayashase | pavitrikritabhubhagaya | kurmanathaprakashakaya
    | shrivenkatacaladhisha
  devanagari: रामानुजाष्टोत्तरशतनामावलिः ॐ श्रीमते रामानुजाय नमः ॥ ॐ रामानुजाय नमः । पुष्कराक्षाय । यतीन्द्राय
    । करुणाकराय । कान्तिमत्यात्मजाय । श्रीमते । लीलामानुषविग्रहाय । सर्वशास्त्रार्थतत्त्वज्ञाय । सर्वज्ञाय
    । सज्जनप्रियाय । नारायणकृपापात्राय । श्रीभूतपुरनायकाय । अनघाय । भक्तमन्दाराय । केशवानन्दवर्धनाय ।
    काञ्चिपूर्णप्रियसखाय । प्रणतार्तिविनाशकाय । पुण्यसङ्कीर्तनाय । पुण्याय । ब्रह्मराक्षसमोचकाय नमः ॥
    २०॥ ॐ यादवपादितापार्थवृक्षछेदकुठारकाय नमः । अमोघाय । लक्ष्मणमुनये । शारदाषोकनाशनाय । निरन्तरजनाज्ञानविमोचनविचक्षणाय
    । वेदान्तद्वयसारज्ञाय । वरदाम्बुप्रदायकाय । पराभिप्रायतत्त्वज्ञाय । यामुनाङ्गुलिमोचकाय । देवराजकृपालब्धषड्वाक्यार्थमहोदधये
    । पूर्णार्यलब्धसन्मन्त्राय । शौरिपादाब्जषट्पदाय । त्रिदण्डधारिणे । ब्रह्मज्ञाय । ब्रह्मज्ञानपरायणाय
    । रङ्गेशकैङ्कर्यरथाय । विभूतिद्वयनायकाय । गोष्ठिपूर्णकृपालब्धमन्त्रराजप्रकाशकाय । वररङ्गानुकम्पात्तद्राविडाम्नायपारगाय
    । मालाधरार्यसुज्ञातद्राविडाम्नायतत्त्वधिये नमः ॥ ४०॥ ॐ चतुस्सप्तशिष्याढ्याय नमः । पञ्चाचार्यपदाश्रयाय
    । प्रपीतविषतीर्थाम्बुप्रकटीकृतवैभवाय । प्रणतार्तिहराचार्यदत्तभिक्षैकभोजनाय । पवित्रीकृतकूरेशाय । भागिनेयत्रिदण्डकाय
    । कूरेशदाशरथ्यादिचरमार्थप्रकाशकाय । रङ्गेशवेङ्कटेशादिप्रकटीकृतवैभवाय । देवराजार्चनरताय । मूकमुक्तिप्रदायकाय
    । यज्ञमूर्तिप्रतिष्ठात्रे । मन्नाथाय । धरणीधराय । वरदाचार्यसद्भक्ताय । यज्ञेशार्तिविनाशकाय । अनन्ताभिष्टफलदाय
    । विठ्ठलेशप्रपूजिताय । श्रीशैलपूर्णकरुणालब्धरामायणार्थकाय । प्रपत्तिधर्मैकरताय । गोविन्दार्यप्रियानुजाय
    नमः ॥ ६०॥ ॐ व्याससूत्रार्थतत्त्वज्ञाय नमः । बोधायनमतानुगाय । श्रीभाष्यादिमहाग्रन्थकारकाय । कलिनाशनाय
    । अद्वैतमतविच्छेत्रे । विशिष्टाद्वैतपारगाय । कुरङ्गनगरीपूर्णमन्त्ररत्नोपदेशिकाय । विनाशितेतरमताय ।
    शेषीकृतरमापतये । पुत्रीकृत शठारातये । शठजिते । ऋणमोचकाय । भाषादत्तहयग्रीवाय । भाष्यकाराय । महायशसे
    । पवित्रीकृतभूभागाय । कूर्मनाथप्रकाशकाय । श्रीवेङ्कटाचलाधीश
