id: ashtadikpalakastutih
category: stotram
name:
  english: ashtadikpalakastutih
  devanagari: अष्टदिक्पालकस्तुतिः
content:
  english: namastrishulahastaya lokasamrakshanaya te | vidyanam pataye tubhyamishanaya namo namah || 8||
    iti ashtadikpalakastutih samapta |
  devanagari: नमस्त्रिशूलहस्ताय लोकसंरक्षणाय ते । विद्यानां पतये तुभ्यमीशानाय नमो नमः ॥ ८॥ इति अष्टदिक्पालकस्तुतिः
    समाप्ता ।
meaning: {}
