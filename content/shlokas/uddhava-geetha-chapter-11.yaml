id: uddhava-geetha-chapter-11
category: stotram
name:
  english: Uddhava Geetha - Chapter 11
content:
  english: atha ekadasho'dhyayah | shribhagavan uvaca | baddhah muktah iti vyakhya gunatah me na vastutah
    | gunasya mayamulatvat na me mokshah na bandhanam || || shokamohau sukham duhkham dehapattih ca mayaya
    | svapnah yatha atmanah khyatih samsritih na tu vastavi || || vidya avidye mama tanu viddhi uddhava
    sharirinam | mokshabandhakari adye mayaya me vinirmite || || ekasya eva mama amshasya jivasya eva
    mahamate | bandhah asya avidyaya anadih vidyaya ca tatha itarah || || atha baddhasya muktasya vailakshanyam
    vadami te | viruddhadharminoh tata sthitayoh ekadharmini || || suparnau etau sadrishau sakhayau yadricchaya
    etau kritanidau ca vrikshe | ekah tayoh khadati pippalannam anyah nirannah api balena bhuyan || ||
    atmanam anyam ca sah veda vidvan apippaladah na tu pippaladah | yah avidyaya yuk sa tu nityabaddhah
    vidyamayah yah sa tu nityamuktah || || dehasthah api na dehasthah vidvan svapnat yatha utthitah |
    adehasthah api dehasthah kumatih svapnadrik yatha || || indriyaih indriyartheshu gunaih api guneshu
    ca | grihyamaneshu ahankuryat na vidvan yah tu avikriyah || || daivadhine sharire asmin gunabhavyena
    karmana | vartamanah abudhah tatra karta asmi iti nibadhyate || || evam viraktah shayanah asanatanamajjane
    | darshanasparshanaghranabhojanashravanadishu || || na tatha badhyate vidvan tatra tatra adayan gunan
    | prakritisthah api asamsaktah yatha kham savita anilah || || vaisharadyekshaya asangashitaya chinnasamshayah
    | pratibuddhah iva svapnat nanatvat vinivartate || || yasya syuh vitasankalpah pranendriyamanodhiyam
    | vrittayah sah vinirmuktah dehasthah api hi tat gunaih || || yasya atma himsyate himsryaih yena kincit
    yadricchaya | arcyate va kvacit tatra na vyatikriyate budhah || || na stuvita na nindeta kurvatah
    sadhu asadhu va | vadatah gunadoshabhyam varjitah samadrik munih || || na kuryat na vadet kincit na
    dhyayet sadhu asadhu va | atmaramah anaya vrittya vicaret jadavat munih || || shabdabrahmani nishnatah
    na nishnayat pare yadi | shramah tasya shramaphalah hi adhenum iva rakshatah || || gam dugdhadoham
    asatim ca bharyam deham paradhinam asatprajam ca | vittam tu atirthikritam anga vacam hinam maya rakshati
    duhkhaduhkhi || || yasyam na me pavanam anga karma sthitiudbhavaprana nirodhanam asya | lilavataripsitajanma
    va syat bandhyam giram tam bibhriyat na dhirah || || evam jijnasaya apohya nanatvabhramam atmani |
    uparameta virajam manah mayi arpya sarvage || || yadi anishah dharayitum manah brahmani nishcalam
    | mayi sarvani karmani nirapekshah samacara || || shraddhaluh me kathah sha rinvan subhadra lokapavanih
    | gayan anusmaran karma janma ca abhinayan muhuh || || madarthe dharmakamarthan acaran madapashrayah
    | labhate nishcalam bhaktim mayi uddhava sanatane || || satsangalabdhaya bhaktya mayi mam sah upasita
    | sah vai me darshitam sadbhih anjasa vindate padam || || uddhava uvaca | sadhuh tava uttamashloka
    matah kidrigvidhah prabho | bhaktih tvayi upayujyeta kidrishi sadbhih adrita || || etat me purushadhyaksha
    lokadhyaksha jagat prabho | pranataya anuraktaya prapannaya ca kathyatam || || tvam brahma paramam
    vyoma purushah prakriteh parah | avatirnah asi bhagavan svecchaupattaprithak vapuh || || shribhagavan
    uvaca | kripaluh akritadrohah titikshuh sarvadehinam | satyasarah anavadyatma samah sarvopakarakah
    || || kamaih ahatadhih dantah mriduh shucih akincanah | anihah mitabhuk shantah sthirah mat sharanah
    munih || || apramattah gabhiratma dhritimanjitashadgunah | amani manadah kalpah maitrah karunikah
    kavih || || ajnaya evam gunan doshanmayadishtan api svakan | dharman santyajya yah sarvan mam bhajeta
    sah sattamah || || jnatva ajnatva atha ye vai mam yavan yah ca asmi yadrishah | bhajanti ananyabhavena
    te me bhaktatamah matah || || mallingamadbhaktajanadarshanasparshanarcanam | paricarya stutih prahvagunakarma
    anukirtanam || || matkathashravane shraddha mat anudhyanam uddhava | sarvalabha upaharanam dasyena
    atmanivedanam || || majjanmakarmakathanam mama parvanumodanam | gitatandavavaditragoshthibhih madgriha
    utsavah || || yatra balividhanam ca sarvavarshikaparvasu | vaidiki tantriki diksha madiyavratadharanam
    || || mama arcasthapane shraddha svatah samhatya ca udyamah | udyana upavanakridapuramandirakarmani
    || || sammarjana upalepabhyam sekamandalavartanaih | grihashushrushanam mahyam dasavadyadamayaya ||
    || amanitvam adambhitvam kritasya aparikirtanam | api dipavalokam me na upayunjyat niveditam || ||
    yat yat ishtatamam loke yat ca atipriyam atmanah | tat tat nivedayet mahyam tat anantyaya kalpate
    || || suryah agnih brahmanah gavah vaishnavah kham marut jalam | bhuh atma sarvabhutani bhadra pujapadani
    me || || surye tu vidyaya trayya havishagnau yajeta mam | atithyena tu vipragryah goshvanga yavasadina
    || || vaishnave bandhusatkritya hridi khe dhyananishthaya | vayau mukhyadhiya toye dravyaih toyapuraskritaih
    || || sthandile mantrahridayaih bhogaih atmanam atmani | kshetrajnam sarvabhuteshu samatvena yajeta
    mam || || dhishnyeshu eshu iti madrupam shankhacakragadambujaih | yuktam caturbhujam shantam dhyayan
    arcet samahitah || || ishtapurtena mam evam yah yajeta samahitah | labhate mayi sadbhaktim matsmritih
    sadhusevaya || || prayena bhaktiyogena satsangena vina uddhava | na upayah vidyate sadhryan prayanam
    hi satam aham || || atha etat paramam guhyam shrunvatah yadunandana | sugopyam api vakshyami tvam
    me bhrityah suhrit sakha || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    shrikrishnoddhavasamvade ekadashapujavidhanayogo nama ekadasho'dhyayah || || atha dvadasho'dhyayah
    | shribhagavan uvaca | na rodhayati mam yogah na ssankhyam dharmah eva ca | na svadhyayah tapah tyagah
    na ishtapurtam na dakshina || || vratani yajnah chandamsi tirthani niyamah yamah | yatha avarundhe
    satsangah sarvasanga apahah hi mam || || satsangena hi daiteya yatudhanah mrigah khagah | gandharva
    apsarasah nagah siddhah caranaguhyakah || || vidyadharah manushyeshu vaishyah shudrah striyah antyajah
    | rajah tamah prakritayah tasmin tasmin yuge anagha || || bahavah matpadam praptah tvashtrakayadhavadayah
    | vrishaparva balih vanah mayah ca atha vibhishanah || || sugrivah hanuman rikshah gajah gridhrah
    vanikpathah | vyadhah kubja vraje gopyah yajnapatnyah tatha apare || || te na adhitashrutiganah na
    upasitamahattamah | avratataptatapasah matsangat mam upagatah || || kevalena hi bhavena gopyah gavah
    nagah mrigah | ye anye mudhadhiyah nagah siddhah mam iyuh anjasa || || yam na yogena sankhyena danavratatapah
    adhvaraih | vyakhyah svadhyayasannyasaih prapnuyat yatnavan api || || ramena sardham mathuram pranite
    shvaphalkina mayi anuraktacittah | vigadhabhavena na me viyoga tivradhayah anyam dadrishuh sukhaya
    || || tah tah kshapah preshthatamena nitah maya eva vrindavanagocarena | kshanardhavat tah punaranga
    tasam hina maya kalpasama babhuvuh || || tah na avidan mayi anushangabaddha dhiyah svamatmanam adah
    tatha idam | yatha samadhau munayah abdhitoye nadyah pravishtah iva namarupe || || matkama ramanam
    jaram asvarupavidah abalah | brahma mam paramam prapuh sangat shatasahasrashah || || tasmat tvam uddhava
    utsrijya codanam praticodanam | pravrittam ca nivrittam ca shrotavyam shrutam eva ca || || mam ekam
    eva sharanam atmanam sarvadehinam | yahi sarvatmabhavena maya syah hi akutobhayah || || uddhavah uvaca
    | samshayah shrunvatah vacam tava yogeshvara ishvara | na nivartatah atmasthah yena bhramyati me manah
    || || shribhagavan uvaca | sah esha jivah vivaraprasutih pranena ghoshena guham pravishtah | manomayam
    sukshmam upetya rupam matra svarah varnah iti sthavishthah || || yatha analah khe anilabandhuh ushma
    balena darunyadhimathyamanah | anuh prajatah havisha samidhyate tatha eva me vyaktih iyam hi vani
    || || evam gadih karmagatih visargah ghranah rasah drik sparshah shrutih ca | sankalpavijnanam atha
    abhimanah sutram rajah sattvatamovikarah || || ayam hi jivah trivrit abjayonih avyaktah ekah vayasa
    sah adyah | vishlishtashaktih bahudha eva bhati bijani yonim pratipadya yadvat || || yasmin idam protam
    ashesham otam patah yatha tantuvitanasamsthah | yah esha samsarataruh puranah karmatmakah pushpaphale
    prasute || || dve asya bije shatamulah trinalah pancaskandhah pancarasaprasutih | dasha ekashakhah
    dvisuparnanidah trivalkalah dviphalah arkam pravishtah || || adanti ca ekam phalam asya gridhra gramecarah
    ekam aranyavasah | hamsah yah ekam bahurupam ijyaih mayamayam veda sah veda vedam || || evam guru
    upasanaya ekabhaktya vidyakutharena shitena dhirah | vivrishcya jivashayam apramattah sampadya ca
    atmanam atha tyaja astram || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    shrikrishnoddhavasamvade dvadasho'dhyayah || || atha trayodasho'dhyayah | shribhagavan uvaca | sattvam
    rajah tamah iti gunah buddheh na ca atmanah | sattvena anyatamau hanyat sattvam sattvena ca eva hi
    || || sattvat dharmah bhavet vriddhat pumsah madbhaktilakshanah | satvika upasaya sattvam tatah dharmah
    pravartate || || dharmah rajah tamah hanyat sattvavriddhih anuttamah | ashu nashyati tat mulah hi
    adharmah ubhaye hate || || agamah apah praja deshah kalah karma ca janma ca | dhyanam mantrah atha
    samskarah dasha ete gunahetavah || || tat tat satvikam eva esham yat yat vriddhah pracakshate | nindanti
    tamasam tat tat rajasam tat upekshitam || || sattvikani eva seveta puman sattvavivriddhaye | tatah
    dharmah tatah jnanam yavat smritih apohanam || || venusangharshajah vahnih dagdhva shamyati tat vanam
    | evam gunavyatyayajah dehah shamyati tat kriyah || || uddhavah uvaca | vidanti martyah prayena vishayan
    padam apadam | tatha api bhunjate krishna tat katham shva khara ajavat || || shribhagavan uvaca |
    aham iti anyathabuddhih pramattasya yatha hridi | utsarpati rajah ghoram tatah vaikarikam manah ||
    || rajoyuktasya manasah sankalpah savikalpakah | tatah kamah gunadhyanat duhsahah syat hi durmateh
    || || karoti kamavashagah karmani avijitendriyah | duhkhodarkani sampashyan rajovegavimohitah || |
    rajah tamobhyam yat api vidvan vikshiptadhih punah | atandritah manah yunjan doshadrishtih na sajjate
    || || apramattah anuyunjitah manah mayi arpayan shanaih | anirvinnah yathakalam jitashvasah jitasanah
    || || etavan yogah adishtah mat shishyaih sanaka adibhih | sarvatah manah akrishya mayyaddha aveshyate
    yatha || || uddhavah uvaca | yada tvam sanaka adibhyah yena rupena keshava | yogam adishtavan etat
    rupam icchami veditum || || shribhagavan uvaca | putrah hiranyagarbhasya manasah sanaka adayah | papracchuh
    pitaram sukshmam yogasya aikantikim gatim || || sanaka adayah ucuh | guneshu avishate cetah gunah
    cetasi ca prabho | katham anyonyasantyagah mumukshoh atititirshoh || || shribhagavan uvaca | evam
    prishtah mahadevah svayambhuh bhutabhavanah | dhyayamanah prashnabijam na abhyapadyata karmadhih ||
    || sah mam acintayat devah prashnaparatitirshaya | tasya aham hamsarupena sakasham agamam tada ||
    || drishtva mam ta upavrajya kritva pada abhivandanam | brahmanam agratah kritva papracchuh kah bhavan
    iti || || iti aham munibhih prishtah tattvajijnasubhih tada | yat avocam aham tebhyah tat uddhava
    nibodha me || || vastunah yadi ananatvam atmanah prashnah idrishah | katham ghateta vah viprah vaktuh
    va me kah ashrayah || || pancatmakeshu bhuteshu samaneshu ca vastutah | kah bhavan iti vah prashnah
    vacarambhah hi anarthakah || || manasa vacasa drishtya grihyate anyaih api indriyaih | aham eva na
    mattah anyat iti budhyadhvam anjasa || || guneshu avishate cetah gunah cetasi ca prajah | jivasya
    dehah ubhayam gunah cetah mat atmanah || || guneshu ca avishat cittam abhikshnam gunasevaya | gunah
    ca cittaprabhavah mat rupah ubhayam tyajet || || jagrat svapnah sushuptam ca gunatah buddhivrittayah
    | tasam vilakshanah jivah sakshitvena vinishcitah || || yah hi samsritibandhah ayam atmanah gunavrittidah
    | mayi turye sthitah jahyat tyagah tat gunacetasam || || ahankarakritam bandham atmanah arthaviparyayam
    | vidvan nirvidya samsaracintam turye sthitah tyajet || || yavat nanarthadhih pumsah na nivarteta
    yuktibhih | jagarti api svapan ajnah svapne jagaranam yatha || || asattvat atmanah anyesham bhavanam
    tat krita bhida | gatayah hetavah ca asya mrisha svapnadrishah yatha || || yo jagare bahih anukshanadharminah
    arthan bhunkte samastakaranaih hridi tat sadrikshan | svapne sushuptah upasamharate sah ekah smriti
    anvayat trigunavrittidrik indriya ishah || || evam vimrishya gunatah manasah tryavastha mat mayaya
    mayi krita iti nishcitarthah | sanchidya hardam anumanast uktitikshna jnanasina bhajatah ma akhilasamshayadhim
    || || iksheta vibhramam idam manasah vilasam drishtam vinashtam atilolam alatacakram | vijnanam ekam
    urudha iva vibhati maya svapnah tridha gunavisargakritah vikalpah || || drishtim tatah pratinivartya
    nivrittatrishnah tushnim bhavet nijasukha anubhavah nirihah | sandrishyate kva ca yadi idam avastubuddhya
    tyaktam bhramaya na bhavet smritih anipatat || || deham ca nashvaram avasthitam utthitam va siddhah
    na pashyati yatah adhyagamatsvarupam | daivat apetam uta daivashat upetam vasah yatha parikritam madiramadandhah
    || || dehah api daivavashagah khalu karma yavat svarambhakam pratisamikshatah eva sasuh | tam aprapancam
    adhirudhasamadhiyogah svapnam punah na bhajate pratibuddhavastuh || || maya etat uktam vah viprah
    guhyam yat sankhyayogayoh | janitam agatam yajnam yushmat dharmavivakshaya || || aham yogasya sankhyasya
    satyasyartasya tejasah | parayanam dvijashreshthah shriyah kirteh damasya ca || || mam bhajanti gunah
    sarve nirgunam nirapekshakam | suhridam priyam atmanam samya asanga adayah gunah || || iti me chinnasandehah
    munayah sanaka adayah | sabhajayitva paraya bhaktya agrinata samstavaih || || taih aham pujitah samyak
    samstutah parama rishibhih | pratyeyaya svakam dhama pashyatah parameshthinah || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade hamsagitanirupanam nama
    trayodasho'dhyayah || || atha caturdasho'dhyayah | uddhavah uvaca | vadanti krishna shreyamsi bahuni
    brahmavadinah | tesham vikalpapradhanyam uta aho ekamukhyata || || bhavat udahritah svamin bhaktiyogah
    anapekshitah | nirasya sarvatah sangam yena tvayi avishet manah || || shribhagavan uvaca | kalena
    nashta pralaye vaniyam vedasanjnita | maya adau brahmane prokta dharmah yasyam madatmakah || || tena
    prokta ca putraya manave purvajaya sa | tatah bhrigu adayah agrihnan saptabrahmamaharshayah || ||
    tebhyah pitribhyah tat putrah devadanavaguhyakah | manushyah siddhagandharvah savidyadharacaranah
    || || kindevah kinnarah nagah rakshah kimpurusha adayah | bahvyah tesham prakritayah rajahsattvatamobhuvah
    || || yabhih bhutani bhidyante bhutanam matayah tatha | yathaprakriti sarvesham citrah vacah sravanti
    hi || || evam prakritivaicitryat bhidyante matayah nrinam | paramparyena keshancit pakhandamatayah
    apare || || manmayamohitadhiyah purushah purusharshabha | shreyah vadanti anekantam yathakarma yatharuci
    || || dharmam eke yashah ca anye kamam satyam damam shamam | anye vadanti svartham va aishvaryam tyagabhojanam
    | kecit yajnatapodanam vratani niyama anyaman || || adi antavantah eva esham lokah karmavinirmitah
    | duhkha udarkah tamonishthah kshudra anandah shuca arpitah || || mayi arpita manah sabhya nirapekshasya
    sarvatah | maya atmana sukham yat tat kutah syat vishaya atmanam || || akincanasya dantasya shantasya
    samacetasah | maya santushtamanasah sarvah sukhamayah dishah || || na parameshthyam na mahendradhishnyam
    na sarvabhaumam na rasadhipatyam | na yogasiddhih apunarbhavam va mayi arpita atma icchati mat vina
    anyat || || na tatha me priyatamah atmayonih na shankarah | na ca sankarshanah na shrih na eva atma
    ca yatha bhavan || || nirapeksham munim shatam nirvairam samadarshanam | anuvrajami aham nityam puyeyeti
    anghrirenubhih || || nishkincana mayi anuraktacetasah shantah mahantah akhilajivavatsalah | kamaih
    analabdhadhiyah jushanti yat tat nairapekshyam na viduh sukham mama || || badhyamanah api madbhaktah
    vishayaih ajitendriyah | prayah pragalbhaya bhaktya vishayaih na abhibhuyate || || yatha agnih susamriddha
    arcih karoti edhamsi bhasmasat | tatha madvishaya bhaktih uddhava enamsi kritsnashah || || na sadhayati
    mam yogah na sankhyam dharmah uddhava | na svadhyayah tapah tyagah yatha bhaktih mama urjita || ||
    bhaktya aham ekaya grahyah shraddhaya atma priyah satam | bhaktih punati mannishtha shvapakan api
    sambhavat || || dharmah satyadaya upetah vidya va tapasanvita | madbhktyapetam atmanam na samyak prapunati
    hi || || katham vina romaharsham dravata cetasa vina | vinananda ashrukalaya shudhyet bhaktya vinashayah
    || || vak gadgada dravate yasya cittam rudati abhikshnam hasati kvacit ca | vilajjah udgayati nrityate
    ca madbhaktiyuktah bhuvanam punati || || yatha agnina hema malam jahati dhmatam punah svam bhajate
    ca rupam | atma ca karmanushayam vidhuya madbhaktiyogena bhajati athah mam || || yatha yatha atma
    parimrijyate asau matpunyagathashravana abhidhanaih | tatha tatha pashyati vastu sukshmam cakshuh
    yatha eva anjanasamprayuktam || || vishayan dhyayatah cittam vishayeshu vishajjate | mam anusmaratah
    cittam mayi eva praviliyate || || tasmat asat abhidhyanam yatha svapnamanoratham | hitva mayi samadhatsva
    manah madbhavabhavitam || || strinam strisanginam sangam tyaktva duratah atmavan | ksheme viviktah
    asinah cintayet mam atandritah || || na tatha asya bhavet kleshah bandhah ca anyaprasangatah | yoshit
    sangat yatha pumsah yatha tat sangisangatah || || uddhavah uvaca | yatha tvam aravindaksha yadrisham
    va yadatmakam | dhyayet mumukshuh etat me dhyanam me vaktum arhasi || || shribhagavan uvaca | samah
    asanah asinah samakayah yathasukham | hastau utsangah adhaya svanasagrakrita ikshanah || || pranasya
    shodhayet margam purakumbhakarecakaih | viparyayena api shanaih abhyaset nirjitendriyah || || hridi
    avicchinnam onkaram ghantanadam bisornavat | pranena udirya tatra atha punah samveshayet svaram ||
    || evam pranavasamyuktam pranam eva samabhyaset | dashakritvah trishavanam masat arvak jita anilah
    || || hritpundarikam antastham urdhvanalam adhomukham | dhyatva urdhvamukham unnidram ashtapatram
    sakarnikam || || karnikayam nyaset suryasomagnin uttarottaram | vahnimadhye smaret rupam mama etat
    dhyanamangalam || || samam prashantam sumukham dirghacarucaturbhujam | sucarusundaragrivam sukapolam
    shucismitam || || samana karna vinyasta sphuran makara kundalam | hema ambaram ghanashyamam shrivatsa
    shriniketanam || || shankha cakra gada padma vanamala vibhushitam | nupuraih vilasat padam kaustubha
    prabhaya yutam || || dyumat kirita kataka katisutra angada ayutam | sarvanga sundaram hridyam prasada
    sumukha ikshanam || || sukumaram abhidhyayet sarvangeshu manah dadhat | indriyani indriyebhyah manasa
    akrishya tat manah | buddhya sarathina dhirah pranayet mayi sarvatah || || tat sarva vyapakam cittam
    akrishya ekatra dharayet | na anyani cintayet bhuyah susmitam bhavayet mukham || || tatra labdhapadam
    cittam akrishya vyomni dharayet | tat ca tyaktva madarohah na kincit api cintayet || || evam samahitamatih
    mam eva atmanam atmani | vicashte mayi sarvatmat jyotih jyotishi samyutam || || dhyanena ittham sutivrena
    yunjatah yoginah manah | samyasyati ashu nirvanam dravya jnana kriya bhramah || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade bhaktirahasyavadharanayogo
    nama caturdasho'dhyayah || || atha pancadasho'dhyayah | shribhagavan uvaca | jitendriyasya yuktasya
    jitashvasasya yoginah mayi dharayatah cetah upatishthanti siddhayah || || uddhavah uvaca | kaya dharanaya
    kasvit kathamsvit siddhih acyuta | kati va siddhayah bruhi yoginam siddhidah bhavan || || shribhagavan
    uvaca | siddhayah ashtadasha prokta dharanayogaparagaih | tasam ashtau mat pradhanah dashah eva gunahetavah
    || || anima mahima murteh laghima praptih indriyaih | prakamyam shrutadrishteshu shaktipreranam ishita
    || || guneshu asangah vashita yat kamah tat avasyati | etah me siddhayah saumya ashtau utpattikah
    matah || || anurmimattvam dehe asmin durashravanadarshanam | manojavah kamarupam parakayapraveshanam
    || || svacchandamrityuh devanam sahakridanudarshanam | yathasankalpasamsiddhih ajnapratihata gatih
    || || trikalajnatvam advandvam paracittadi abhijnata | agni arka ambu visha adinam pratishtambhah
    aparajayah || || etah ca uddeshatah prokta yogadharanasiddhayah | yaya dharanaya ya syat yatha va
    syat nibodha me || || bhutasukshma atmani mayi tanmatram dharayet manah | animanam avapnoti tanmatra
    upasakah mama || || mahati atman mayi pare yathasamstham manah dadhat | mahimanam avapnoti bhutanam
    ca prithak prithak || || paramanumaye cittam bhutanam mayi ranjayan | kalasukshmatmatam yogi laghimanam
    avapnuyat || || dharayan mayi ahantattve manah vaikarike akhilam | sarvendriyanam atmatvam praptim
    prapnoti manmanah || || mahati atmani yah sutre dharayet mayi manasam | prakamyam parameshthyam me
    vindate avyaktajanmanah || || vishnau tryadhi ishvare cittam dharayet kalavigrahe | sah ishitvam avapnoti
    kshetrakshetrajnacodanam || || narayane turiyakhye bhagavat shabdashabdite | manah mayi adadhat yogi
    mat dharmah vahitam iyat || || nirgune brahmani mayi dharayan vishadam manah | paramanandam apnoti
    yatra kamah avasiyate || || shvetadipapatau cittam shuddhe dharmamaye mayi | dharayan shvetatam yati
    shadurmirahitah narah || || mayi akasha atmani prane manasa ghosham udvahan | tatra upalabdha bhutanam
    hamsah vacah shrunoti asau || || cakshuh tvashtari samyojya tvashtaram api cakshushi | mam tatra manasa
    dhyayan vishvam pashyati sukshmadrik || || manah mayi susamyojya deham tadanu vayuna | maddharana
    anubhavena tatra atma yatra vai manah || || yada manah upadaya yat yat rupam bubhushati | tat tat
    bhavet manorupam madyogabalam ashrayah || || parakayam vishan siddhah atmanam tatra bhavayet | pindam
    hitva vishet pranah vayubhutah shadanghrivat || || parshnya apidya gudam pranam hrit urah kantha murdhasu
    | aropya brahmarandhrena brahma nitva utsrijet tanum || || viharishyan surakride matstham sattvam
    vibhavayet | vimanena upatishthanti sattvavrittih surastriyah || || yatha sankalpayet buddhya yada
    va matparah puman | mayi satye manah yunjan tatha tat samupashnute || || yah vai madbhavam apannah
    ishituh vashituh puman | kutashcit na vihanyeta tasya ca ajna yatha mama || || madbhaktya shuddhasattvasya
    yoginah dharanavidah | tasya traikaliki buddhih janma mrityu upabrimhita || || agni adibhih na hanyeta
    muneh yogam ayam vapuh | madyogashrantacittasya yadasam udakam yatha || || madvibhutih abhidhyayan
    shrivatsa astrabibhushitah | dhvajatapatravyajanaih sah bhavet aparajitah || || upasakasya mam evam
    yogadharanaya muneh | siddhayah purvakathitah upatishthanti asheshatah || || jitendriyasya dantasya
    jitashvasa atmanah muneh | maddharanam dharayatah ka sa siddhih sudurlabha || || antarayan vadanti
    etah yunjatah yogam uttamam | maya sampadyamanasya kalakshepanahetavah || || janma oshadhi tapo mantraih
    yavatih iha siddhayah | yogena apnoti tah sarvah na anyaih yogagatim vrajet || || sarvasam api siddhinam
    hetuh patih aham prabhuh | aham yogasya sankhyasya dharmasya brahmavadinam || || aham atma antarah
    bahyah anavritah sarvadehinam | yatha bhutani bhuteshu bahih antah svayam tatha || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade siddhanirupanayogo nama
    pancadasho'dhyayah || || atha shodasho'dhyayah | uddhavah uvaca | tvam brahma paramam sakshat anadi
    anantam apavritam | sarvesham api bhavanam tranasthiti apyaya udbhavah || || uccavaceshu bhuteshu
    durjneyam akrita atmabhih | upasate tvam bhagavan yathatathyena brahmanah || || yeshu yeshu ca bhaveshu
    bhaktya tvam paramarshayah | upasinah prapadyante samsiddhim tat vadasva me || || gudhah carasi bhutatma
    bhutanam bhutabhavana | na tvam pashyanti bhutani pashyantam mohitani te || || yah kah ca bhumau divi
    vai rasayam vibhutayah dikshu mahavibhute | tah mahyam akhyahi anubhavitah te namami te tirtha pada
    anghripadmam || || shribhagavan uvaca | evam etat aham prishtah prashnam prashnavidam vara | yuyutsuna
    vinashane sapatnaih arjunena vai || || jnatva jnativadham garhyam adharmam rajyahetukam | tatah nivrittah
    hanta aham hatah ayam iti laukikah || || sah tada purushavyaghrah yuktya me pratibodhitah | abhyabhashata
    mam evam yatha tvam ranamurdhani || || aham atma uddhava amisham bhutanam suhrit ishvarah | aham sarvani
    bhutani tesham sthiti udbhava apyayah || || aham gatih gatimatam kalah kalayatam aham | gunanam ca
    api aham samyam guninya utpattikah gunah || || guninam api aham sutram mahatam ca mahan aham | sukshmanam
    api aham jivah durjayanam aham manah || || hiranyagarbhah vedanam mantranam pranavah trivrit | aksharanam
    akarah asmi padani chandasam aham || || indrah aham sarvadevanam vasunamasmi havyavat | adityanam
    aham vishnu rudranam nilalohitah || || brahmarshinam bhriguh aham rajarshinam aham manuh | devarshinam
    naradah aham havirdhani asmi dhenushu || || siddheshvaranam kapilah suparnah aham patatrinam | prajapatinam
    dakshah aham pitrinam aham aryama || || mam viddhi uddhava daityanam prahladam asureshvaram | somam
    nakshatra oshadhinam dhanesham yaksharakshasam || || airavatam gajendranam yadasam varunam prabhum
    | tapatam dyumatam suryam manushyanam ca bhupatim || || uccaihshravah turanganam dhatunam asmi kancanam
    | yamah samyamatam ca aham sarpanam asmi vasukih || || nagendranam anantah aham mrigendrah sha ringidamshtrinam
    | ashramanam aham turyah varnanam prathamah anagha || || tirthanam srotasam ganga samudrah sarasam
    aham | ayudhanam dhanuh aham tripuraghnah dhanushmatam || || dhishnyanam asmi aham meruh gahananam
    himalayah | vanaspatinam ashvatthah oshadhinam aham yavah || || purodhasam vasishthah aham brahmishthanam
    brihaspatih | skandah aham sarvasenanyam agranyam bhagavan ajah || || yajnanam brahmayajnah aham vratanam
    avihimsanam | vayu agni arka ambu vak atma shucinam api aham shucih || || yoganam atmasamrodhah mantrah
    asmi vijigishatam | anvikshiki kaushalanam vikalpah khyativadinam || || strinam tu shatarupa aham
    pumsam svayambhuvah manuh | narayanah muninam ca kumarah brahmacarinam || || dharmanam asmi sannyasah
    kshemanam abahih matih | guhyanam sunritam maunam mithunanam ajah tu aham || || samvatsarah asmi animisham
    ritunam madhumadhavau | masanam margashirshah aham nakshatranam tatha abhijit || || aham yuganam ca
    kritam dhiranam devalah asitah | dvaipayanah asmi vyasanam kavinam kavyah atmavan || || vasudevah
    bhagavatam tvam bhagavateshu aham | kimpurushanam hanuman vidyaghranam sudarshanah || || ratnanam
    padmaragah asmi padmakoshah supeshasam | kushah asmi darbhajatinam gavyam ajyam havishshu aham ||
    || vyavasayinam aham lakshmih kitavanam chalagrahah | titiksha asmi titikshanam sattvam sattvavatam
    aham || || ojah sahobalavatam karma aham viddhi sattvatam | sattvatam navamurtinam adimurtih aham
    para || || vishvavasuh purvacittih gandharva apsarasam aham | bhudharanam aham sthairyam gandhamatram
    aham bhuvah || || apam rasah ca paramah tejishthanam vibhavasuh | prabha surya indu taranam shabdah
    aham nabhasah parah || || brahmanyanam balih aham viranam aham arjunah | bhutanam sthitih utpattih
    aham vai pratisankramah || || gati ukti utsarga upadanam ananda sparsha lakshanam | asvada shruti
    avaghranam aham sarvendriya indriyam || || prithivi vayuh akashah apah jyotih aham mahan | vikarah
    purushah avyaktam rajah sattvam tamah param | aham etat prasankhyanam jnanam sattvavinishcayah ||
    || maya ishvarena jivena gunena gunina vina | sarvatmana api sarvena na bhavah vidyate kvacit || ||
    sankhyanam paramanunam kalena kriyate maya | na tatha me vibhutinam srijatah andani kotishah || ||
    tejah shrih kirtih aishvaryam hrih tyagah saubhagam bhagah | viryam titiksha vijnanam yatra yatra
    sa me amshakah || || etah te kirtitah sarvah sankshepena vibhutayah | manovikarah eva ete yatha vaca
    abhidhiyate || || vacam yaccha manah yaccha pranani yaccha indriyani ca | atmanam atmana yaccha na
    bhuyah kalpase adhvane || || yah vai vak manasi samyak asamyacchan dhiya yatih | tasya vratam tapah
    danam sravatyamaghatambuvat || || tasmat manah vacah pranan niyacchet mat parayanah | mat bhakti yuktaya
    buddhya tatah parisamapyate || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    shrikrishnoddhavasamvade vibhutiyogo nama shodasho'dhyayah || || atha saptadasho'dhyayah | uddhavah
    uvaca | yah tvaya abhitah purvam dharmah tvat bhaktilakshanah | varnashrama acaravatam sarvesham dvipadam
    api || || yatha anushthiyamanena tvayi bhaktih nrinam bhavet | svadharmena aravindaksha tat samakhyatum
    arhasi || || pura kila mahabaho dharmam paramakam prabho | yat tena hamsarupena brahmane abhyattha
    madhava || || sah idanim sumahata kalena amitrakarshana | na prayah bhavita martyaloke prak anushasitah
    || || vakta karta avita na anyah dharmasya acyuta te bhuvi | sabhayam api vairincyam yatra murtidharah
    kalah || || kartra avitra pravaktra ca bhavata madhusudana | tyakte mahitale deva vinashtam kah pravakshyati
    || || tattvam nah sarvadharmajna dharmah tvat bhaktilakshanah | yatha yasya vidhiyeta tatha varnaya
    me prabho || || shrishukah uvaca | ittham svabhrityamukhyena prishtah sah bhagavan harih | pritah
    kshemaya martyanam dharman aha sanatanan || || shribhagavan uvaca | dharmyah esha tava prashnah naihshreyasakarah
    nrinam | varnashrama acaravatam tam uddhava nibodha me || || adau kritayuge varnah nrinam hamsah iti
    smritah | kritakrityah prajah jatyah tasmat kritayugam viduh || || vedah pranavah eva agre dharmah
    aham vrisharupadhrik | upasate taponishtham hamsam mam muktakilbishah || || tretamukhe mahabhaga pranat
    me hridayat trayi | vidya praduh abhut tasyah aham asam trivrinmakhah || || vipra kshatriya vit shudrah
    mukha bahu uru padajah | vairajat purushat jatah yah atmacaralakshanah || || grihashramah jaghanatah
    brahmacaryam hridah mama | vakshahsthanat vane vasah nyasah shirshani samsthitah || || varnanam ashramanam
    ca janmabhumi anusarinih | asan prakritayah nrinam nicaih nica uttama uttamah || || shamah damah tapah
    shaucam santoshah kshantih arjavam | madbhaktih ca daya satyam brahmaprakritayah tu imah || || tejah
    balam dhritih shauryam titiksha audaryam udyamah | sthairyam brahmani ata aishvaryam kshatraprakritayah
    tu imah || || astikyam dananishtha ca adambhah brahmasevanam | atushtih artha upacayaih vaishyaprakritayah
    tu imah || || shushrushanam dvijagavam devanam ca api amayaya | tatra labdhena santoshah shudraprakritayah
    tu imah || || ashaucam anritam steyam nastikyam shushkavigrahah | kamah krodhah ca tarshah ca svabhavah
    antevasayinam || || ahimsa satyam asteyam akamakrodhalobhata | bhutapriyahiteha ca dharmah ayam sarvavarnikah
    || || dvitiyam prapya anupurvyat janma upanayanam dvijah | vasan gurukule dantah brahma adhiyita ca
    ahutah || || mekhala ajina danda aksha brahmasutra kamandalun | jatilah adhautadadvasah araktapithah
    kushan dadhat || || snana bhojana homeshu japa uccare ca vagyatah | na cchindyat nakha romani kaksha
    upasthagatani api || || retah na avariket jatu brahmavratadharah svayam | avakirne avagahya apsu yatasuh
    tripadim japet || || agni arka acarya go vipra guru vriddha suran shucih | samahitah upasita sandhye
    ca yatavak japan || || acaryam mam vijaniyat na avamanyeta karhicit | na martyabuddhi asuyeta sarvadevamayah
    guruh || || sayam pratah upaniya bhaikshyam tasmai nivedayet | yat ca anyat api anujnatam upayunjita
    samyatah || || shushrushamanah acaryam sada upasita nicavat | yana shayya asana sthanaih na atidure
    kritanjalih || || evamvrittah gurukule vaset bhogavivarjitah | vidya samapyate yavat bibhrat vratam
    akhanditam || || yadi asau chandasam lokam arokshyan brahmavishtapam | gurave vinyaset deham svadhyayartham
    vrihat vratah || || agnau gurau atmani ca sarvabhuteshu mam param | aprithak dhih upasita brahmavarcasvi
    akalmashah || || strinam nirikshana sparsha samlapa kshvelana adikam | praninah mithunibhutan agrihasthah
    agratah tyajet || || shaucam acamanam snanam sandhya upasanam arjavam | tirthaseva japah asprishya
    abhakshya asambhashya varjanam || || sarva ashrama prayuktah ayam niyamah kulanandana| madbhavah sarbabhuteshu
    manovakkaya samyamah || || evam brihat vratadharah brahmanah agnih iva jvalan | madbhaktah tivratapasa
    dagdhakarma ashayah amalah || || atha anantaram avekshyan yatha jijnasita agamah | gurave dakshinam
    dattva snayat guru anumoditah || || griham vanam va upavishet pravrajet va dvija uttamah | ashramat
    ashramam gacchet na anyatha matparah caret || || griharthi sadrishim bharyam udvahet ajugupsitam |
    yaviyasim tu vayasa yam savarnam anukramat || || ijya adhyayana danani sarvesham ca dvijanmanam |
    pratigrahah adhyapanam ca brahmanasya eva yajanam || || pratigraham manyamanah tapah tejoyashonudam
    | anyabhyam eva jiveta shilaih va doshadrik tayoh || || brahmanasya hi dehah ayam kshudrakamaya na
    ishyate | kricchraya tapase ca iha pretya anantasukhaya ca || || shilonchavrittya paritushtacittah
    dharmam mahantam virajam jushanah | mayi arpitatma grihah eva tishthan na atiprasaktah samupaiti shantim
    || || samuddharanti ye vipram sidantam matparayanam | tan uddharishye na cirat apadbhyah nauh iva
    arnavat || || sarvah samuddharet raja pita iva vyasanat prajah | atmanam atmana dhirah yatha gajapatih
    gajan || || evamvidhah narapatih vimanena arkavacasa | vidhuya iha ashubham kritsnam indrena saha
    modate || || sidan viprah vanik vrittya panyaih eva apadam taret | khadgena va apadakrantah na shvavrittya
    kathancana || || vaishyavrittya tu rajan yah jivet mrigayaya apadi | caret va viprarupena na shvavrittya
    kathancana || || shudravrittim bhajet vaishyah shudrah karukatapriyam | kricchrat muktah na garhyena
    vrittim lipseta karmana || || veda adhyaya svadha svaha bali anna adyaih yatha udayam | devarshi pitribhutani
    madrupani anvaham yajet || || yadricchaya upapannena shuklena uparjitena va | dhanena apidayan bhrityan
    nyayena eva aharet kratun || || kutumbeshu na sajjeta na pramadyet kutumbi api | vipashcit nashvaram
    pashyet adrishtam api drishtavat || || putra dara apta bandhunam sangamah panthasangamah | anudeham
    viyanti ete svapnah nidranugah yatha || || ittham parimrishan muktah griheshu atithivat vasan | na
    grihaih anubadhyeta nirmamah nirahankritah || || karmabhih griham edhiyaih ishtva mam eva bhaktiman
    | tishthet vanam va upavishet prajavan va parivrajet || || yah tu asaktam atih gehe putra vittaishana
    aturah | strainah kripanadhih mudhah mama aham iti badhyate || || aho me pitarau vriddhau bharya balatmaja
    atmajah | anathah mam rite dinah katham jivanti duhkhitah || || evam griha ashaya akshipta hridayah
    mudhadhih ayam | atriptah tan anudhyayan mritah andham vishate tamah || || iti shrimadbhagavate mahapurane
    paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade brahmacaryagrihasthakarmadharmanirupane
    saptadasho'dhyayah || || atha ashtadasho'dhyayah | shribhagavan uvaca | vanam vivikshuh putreshu bharyam
    nyasya saha eva va | vanah eva vaset shantah tritiyam bhagam ayushah || || kandamulaphalaih vanyaih
    medhyaih vrittim prakalpayet | vasita valkalam vasah trinaparna ajinani ca || || kesharomanakhashmashrumalani
    bibhriyat atah | na dhavet apsu majjeta trikalam sthandileshayah || || grishme tapyeta pancagnin varshasvasarashad
    jale | akanthamagnah shishirah evamvrittah tapashcaret || || agnipakvam samashniyat kalapakvam atha
    api va | ulukhala ashmakuttah va danta ulukhalah eva va || || svayam sancinuyat sarvam atmanah vrittikaranam
    | deshakalabala abhijnah na adadita anyada ahritam || || vanyaih carupurodashaih nirvapet kalacoditan
    | na tu shrautena pashuna mam yajeta vanashrami || || agnihotram ca darshah ca purnamasah ca purvavat
    | caturmasyani ca muneh amnatani ca naigamaih || || evam cirnena tapasa munih dhamanisantatah | mam
    tapomayam aradhya rishilokat upaiti mam || || yah tu etat kricchratah cirnam tapah nihshreyasam mahat
    | kamaya alpiyase yunjyat valishah kah aparah tatah || || yada asau niyame akalpah jaraya jatavepathuh
    | atmani agnin samaropya maccittah agnim samavishet || || yada karmavipakeshu lokeshu niraya atmasu
    | viragah jayate samyak nyasta agnih pravrajet tatah || || ishtva yatha upadesham mam dattva sarvasvam
    ritvije | agnin svapranah aveshya nirapekshah parivrajet || || viprasya vai sannyasatah devah daradirupinah
    | vighnan kurvanti ayam hi asman akramya samiyat param || || bibhriyat cet munih vasah kaupina acchadanam
    param | tyaktam na dandapatrabhyam anyat kincit anapadi || || drishtiputam nyaset padam vastraputam
    pibet jalam | satyaputam vadet vacam manahputam samacaret || || mauna aniha anila ayamah dandah vak
    deha cetasam | nahi ete yasya santi angah venubhih na bhavet yatih || || bhiksham catushu varneshu
    vigarhyan varjayan caret | saptagaran asanklriptan tushyet labdhena tavata || || bahih jalashayam
    gatva tatra upasprishya vagyatah | vibhajya pavitam shesham bhunjita ashesham ahritam || || ekah caret
    mahim etam nihsangah samyatendriyah | atmakridah atmaratah atmavan samadarshanah || || viviktakshemasharanah
    madbhavavimalashayah | atmanam cintayet ekam abhedena maya munih || || anviksheta atmanah bandham
    moksham ca jnananishthaya | bandhah indriyavikshepah mokshah esham ca samyamah || || tasmat niyamya
    shadvargam madbhavena caret munih | viraktah kshullakamebhyah labdhva atmani sukham mahat || || puragramavrajan
    sarthan bhikshartham pravishan caret | punyadeshasarit shailavana ashramavatim mahim || || vanaprastha
    ashrama padeshu abhikshnam bhaikshyam acaret | samsidhyatyashvasammohah shuddhasattvah shilandhasa
    || || na etat vastutaya pashyet drishyamanam vinashyati | asaktacittah viramet iha amutra cikirshitat
    || || yat etat atmani jagat manovakpranasamhatam | sarvam maya iti tarkena svasthah tyaktva na tat
    smaret || || jnananishthah viraktah va madbhaktah va anapekshakah | salingan ashramam tyaktva caret
    avidhigocarah || || budhah balakavat kridet kushalah jadavat caret | vadet unmattavat vidvan gocaryam
    naigamah caret || || vedavadaratah na syat na pakhandi na haitukah | shushkavadavivade na kancit paksham
    samashrayet || || na udvijeta janat dhirah janam ca udvejayet na tu | ativadan titiksheta na avamanyeta
    kancana | deham uddishya pashuvat vairam kuryat na kenacit || || ekah eva parah hi atma bhuteshu atmani
    avasthitah | yatha induh udapatreshu bhutani ekatmakani ca || || alabdhva na vishideta kale kale ashanam
    kvacit | labdhva na hrishyet dhritim anubhayam daivatantritam || || aharartham samiheta yuktam tat
    pranadharanam | tattvam vimrishyate tena tat vijnaya vimucyate || || yat ricchaya upapannat annam
    adyat shreshtham uta aparam | tatha vasah tatha shayyam praptam praptam bhajet munih || || shaucam
    acamanam snanam na tu codanaya caret | anyan ca niyaman jnani yatha aham lilaya ishvarah || || nahi
    tasya vikalpakhya ya ca madvikshaya hata | adehantat kvacit khyatih tatah sampadyate maya || || duhkha
    udarkeshu kameshu jatanirvedah atmavan | ajijnasita maddharmah gurum munim upavrajet || || tavat paricaret
    bhaktah shraddhavan anasuyakah | yavat brahma vijaniyat mam eva gurum adritah || || yah tu asamyata
    shadvargah pracanda indriya sarathih | jnana vairagya rahitah tridandam upajivati || || suran atmanam
    atmastham nihnute mam ca dharmaha | avipakva kashayah asmat ushmat ca vihiyate || || bhikshoh dharmah
    shamah ahimsa tapah iksha vanaukasah | grihinah bhutaraksha ijyah dvijasya acaryasevanam || || brahmacaryam
    tapah shaucam santoshah bhutasauhridam | grihasthasya api ritau gantuh sarvesham madupasanam || ||
    iti mam yah svadharmena bhajan nityam ananyabhak | sarvabhuteshu madbhavah madbhaktim vindate acirat
    || || bhaktya uddhava anapayinya sarvalokamaheshvaram | sarva utpatti api ayam brahma karanam ma upayati
    sah || || iti svadharma nirnikta sattvah nirjnat madgatih | jnana vijnana sampannah na cirat samupaiti
    mam || || varnashramavatam dharmah eshah acaralakshanah | sah eva madbhaktiyutah nihshreyasakarah
    parah || || etat te abhihitam sadho bhavan pricchati yat ca mam | yatha svadharmasamyuktah bhaktah
    mam samiyat param || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade
    vanaprasthasannyasadharmanirupanam namashtadasho'dhyayah || || atha ekonavimshah adhyayah | shribhagavan
    uvaca | yah vidyashrutasampannah atmavan na anumanikah | mayamatram idam jnatva jnanam ca mayi sannyaset
    || || jnaninah tu aham eva ishtah svarthah hetuh ca sammatah | svargah ca eva apavargah ca na anyah
    arthah madrite priyah || || jnanavijnanasamsiddhah padam shreshtham viduh mama | jnani priyatamah
    atah me jnanena asau bibharti mam || || tapah tirtham japah danam pavitrani itarani ca | na alam kurvanti
    tam siddhim ya jnanakalaya krita || || tasmat jnanena sahitam jnatva svatmanam uddhava | jnanavijnanasampannah
    bhaja mam bhaktibhavatah || || jnanavijnanayajnena mam ishtva atmanam atmani | sarvayajnapatim mam
    vai samsiddhim munayah agaman|| || tvayi uddhava ashrayati yah trividhah vikarah mayantara apatati
    na adi apavargayoh yat | janmadayah asya yat ami tava tasya kim syuh adi antayoh yat asatah asti tat
    eva madhye || || uddhavah uvaca | jnanam vishuddham vipulam yatha etat vairagyavijnanayutam puranam
    | akhyahi vishveshvara vishvamurte tvat bhaktiyogam ca mahat vimrigyam || || tapatrayena abhihatasya
    ghore santapyamanasya bhavadhvanisha | pashyami na anyat sharanam tavanghri dvandva atapatrat amrita
    abhivarshat || || dashtam janam sampatitam bile asmin kalahina kshudrasukhoh utarsham | samuddhara
    enam kripaya apavargyaih vacobhih asinca mahanubhava || || shribhagavan uvaca | ittham etat pura raja
    bhishmam dharmabhritam varam | ajatashatruh papraccha sarvesham nah anushrunvatam || || nivritte bharate
    yuddhe suhrit nidhanavihvalah | shrutva dharman bahun pashcat mokshadharman apricchata || || tan aham
    te abhidhasyami devavratamukhat shrutan | jnanavairagyavijnanashraddhabhakti upabrimhitan || || nava
    ekadasha panca trin bhavan bhuteshu yena vai | iksheta atha ekam api eshu tat jnanam mama nishcitam
    || || etat eva hi vijnanam na tatha ekena yena yat | sthiti utpatti api ayan pashyet bhavanam triguna
    atmanam || || adau ante ca madhye ca srijyat srijyam yat anviyat | punah tat pratisankrame yat shishyeta
    tat eva sat || || shrutih pratyaksham aitihyam anumanam catushtayam | pramaneshu anavasthanat vikalpat
    sah virajyate || || karmanam parinamitvat avirincat amangalam | vipashcit nashvaram pashyet adrishtam
    api drishtavat || || bhaktiyogah pura eva uktah priyamanaya te anagha | punah ca kathayishyami madbhakteh
    karanam param || || shraddha amritakathayam me shashvat mat anukirtanam | parinishtha ca pujayam stutibhih
    stavanam mama || || adarah paricaryayam sarvangaih abhivandanam | madbhaktapujabhyadhika sarvabhuteshu
    manmatih || || madartheshu angaceshta ca vacasa madguneranam | mayyarpanam ca manasah sarvakamavivarjanam
    || || madarthe artha parityagah bhogasya ca sukhasya ca | ishtam dattam hutam japtam madartham yat
    vratam tapah || || evam dharmaih manushyanam uddhava atmanivedinam | mayi sanjayate bhaktih kah anyah
    arthah asya avashishyate || || yada atmani arpitam cittam shantam sattva upabrimhitam | dharmam jnanam
    savairagyam aishvaryam ca abhipadyate || || yat arpitam tat vikalpe indriyaih paridhavati | rajasvalam
    ca asan nishtham cittam viddhi viparyayam || || dharmah madbhaktikrit proktah jnanam ca ekatmyadarshanam
    | guneshu asangah vairagyam aishvaryam ca anim adayah || || uddhavah uvaca | yamah katividhah proktah
    niyamah va arikarshana | kah shamah kah damah krishna ka titiksha dhritih prabho || || kim danam kim
    tapah shauryam kim satyam ritam ucyate | kah tyagah kim dhanam ceshtam kah yajnah ka ca dakshina ||
    || pumsah kimsvit balam shriman bhagah labhah ca keshava | ka vidya hrih para ka shrih kim sukham
    duhkham eva ca || || kah panditah kah ca murkhah kah panthah utpathah ca kah | kah svargah narakah
    kah svit kah bandhuh uta kim griham || || kah adhyah kah daridrah va kripanah kah ishvarah | etan
    prashnan mama bruhi viparitan ca satpate || || shribhagavan uvaca | ahimsa satyam asteyam asangah
    hrih asancayah | astikyam brahmacaryam ca maunam sthairyam kshama abhayam || | shaucam japah tapah
    homah shraddha atithyam mat arcanam | tirthatanam parartheha tushtih acaryasevanam || || ete yamah
    saniyamah ubhayoh dvadasha smritah | pumsam upasitah tata yathakamam duhanti hi || || shamah mat nishthata
    buddheh damah indriyasamyamah | titiksha duhkhasammarshah jihva upasthajayah dhritih || || dandanyasah
    param danam kamatyagah tapah smritam | svabhavavijayah shauryam satyam ca samadarshanam || || ritam
    ca sunrita vani kavibhih parikirtita | karmasvasangamah shaucam tyagah sannyasah ucyate || || dharmah
    ishtam dhanam nrinam yajnah aham bhagavattamah | dakshina jnanasandeshah pranayamah param balam ||
    || bhagah me aishvarah bhavah labhah madbhaktih uttamah | vidya atmani bhida abadhah jugupsa hrih
    akarmasu || || shrih gunah nairapekshya adyah sukham duhkhasukha atyayah | duhkham kamasukha apeksha
    panditah bandhamokshavit || || murkhah deha adi aham buddhih panthah mat nigamah smritah | utpathah
    cittavikshepah svargah sattvaguna uadayah || || narakah tamah unnahah bandhuh guruh aham sakhe | griham
    shariram manushyam gunadhyah hi adhyah ucyate || || daridrah yah tu asantushtah kripanah yah ajitendriyah
    | guneshu asaktadhih ishah gunasangah viparyayah || || etah uddhava te prashnah sarve sadhu nirupitah
    | kim varnitena bahuna lakshanam gunadoshayoh | gunadosha drishih doshah gunah tu ubhayavarjitah ||
    || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe bhagavadudhavasamvade ekonavimsho'dhyayah
    || || atha vimshah adhyayah | uddhavah uvaca | vidhih ca pratishedhah ca nigamah hi ishvarasya te
    | avekshate aravindaksha gunam dosham ca karmanam || || varnashrama vikalpam ca pratiloma anulomajam
    | dravya desha vayah kalan svargam narakam eva ca || || guna dosha bhida drishtim antarena vacah tava
    | nihshreyasam katham nrinam nishedha vidhi lakshanam || || pitridevamanushyanam vedah cakshuh tava
    ishvara | shreyah tu anupalabdhe arthe sadhyasadhanayoh api || || gunadoshabhidadrishtih nigamat te
    na hi svatah | nigamena apavadah ca bhidayah iti hi bhramah || || shribhagavan uvaca | yogah trayah
    maya prokta nrinam shreyovidhitsaya | jnanam karma ca bhaktih ca na upayah anyah asti kutracit ||
    || nirvinnanam jnanayogah nyasinam iha karmasu | teshu anirvinnacittanam karmayogah ti kaminam ||
    || yadricchaya mat katha adau jatashraddhah tu yah puman | na nirvinnah na atisaktah bhaktiyogah asya
    siddhidah || || tavat karmani kurvita na nirvidyeta yavata | mat kathashravana adau va shraddha yavat
    na jayate || || svadharmasthah yajanyajnaih anashih kamah uddhava | na yati svarganarakau yadi anyatra
    samacaret || || asmin loke vartamanah svadharmasthah anaghah shucih | jnanam vishuddham apnoti madbhaktim
    va yadricchaya || || svarginah api etam icchanti lokam nirayinah tatha | sadhakam jnanabhaktibhyam
    ubhayam tat asadhakam || || na narah svargatim kankshet narakim va vicakshanah | na imam lokam ca
    kanksheta deha aveshat pramadyati || || etat vidvan pura mrityoh abhavaya ghateta sah | apramattah
    idam jnatva martyam api arthasiddhidam || || chidyamanam yamaih etaih kritanidam vanaspatim | khagah
    svaketam utsrijya kshemam yati hi alampatah || || ahoratraih chidyamanam buddhvayuh bhayavepathuh
    | muktasangah param buddhva niriha upashamyati || || nrideham adyam sulabham sudurlabham plavam sukalpam
    gurukarnadharam | maya anukulena nabhasvateritam puman bhavabdhim na taret sah atmaha || || yada arambheshu
    nirvinnah viraktah samyatendriyah | abhyasena atmanah yogi dharayet acalam manah || || dharyamanam
    manah yah hi bhramyadashu anavasthitam | atandritah anurodhena margena atmavasham nayet || || manogatim
    na visrijet jitapranah jitendriyah | sattvasampannaya buddhya manah atmavasham nayet || || eshah vai
    paramah yogah manasah sangrahah smritah | hridayajnatvam anvicchan damyasya eva arvatah muhuh || ||
    sankhyena sarvabhavanam pratiloma anulomatah | bhava api ayau anudhyayet manah yavat prasidati ||
    || nirvinnasya viraktasya purushasya uktavedinah | manah tyajati dauratmyam cintitasya anucintaya
    || || yama adibhih yogapathaih anvikshikya ca vidyaya | mama arcopasanabhih va na anyaih yogyam smaret
    manah || || yadi kuryat pramadena yogi karma vigarhitam | yogena eva dahet amhah na anyat tatra kadacana
    || || sve sve adhikare ya nishtha sah gunah parikirtitah | karmanam jati ashuddhanam anena niyamah
    kritah | gunadoshavidhanena sanganam tyajanecchaya || || jatashraddah matkathasu nirvinnah sarvakarmasu
    | veda duhkhatmakan kaman parityage api anishvarah || || tatah bhajeta mam pritah shraddhaluh dridhanishcayah
    | jushamanah ca tan kaman duhkha udarkan ca garhayan || || proktena bhaktiyogena bhajatah ma asakrit
    muneh | kamah hridayyah nashyanti sarve mayi hridi sthite || || bhidyate hridayagranthih chidyante
    sarvasamshayah | kshiyante ca asya karmani mayi drishte akhila atmani || || tasmat madbhaktiyuktasya
    yoginah vai mat atmanah | na jnanam na ca vairagyam prayah shreyah bhavet iha || || yat karmabhih
    yat tapasa jnanavairagyatah ca yat | yogena danadharmena shreyobhih itaraih api || || sarvam madbhaktiyogena
    madbhaktah labhate anjasa | svarga apavargam mat dhama kathancit yadi vanchati || || na kincit sadhavah
    dhirah bhaktah hi ekantinah mama | vanchati api maya dattam kaivalyam apunarbhavam || || nairapekshyam
    param prahuh nihshreyasam analpakam | tasmat nirashishah bhaktih nirapekshasya me bhavet || || na
    mayi ekantabhaktanam gunadosha udbhavah gunah | sadhunam samacittanam buddheh param upeyusham || ||
    evam etat maya adishtan anutishthanti me pathah | kshemam vindanti mat sthanam yat brahma paramam
    viduh || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe bhagavaduddhavasamvade
    vedatrayivibhagayogo nama vimsho'dhyayah || || atha ekavimshah adhyayah | shribhagavan uvaca | yah
    etan matpathah hitva bhaktijnanakriyatmakan | kshudran kaman calaih pranaih jushantah samsaranti te
    || || sve sve adhikare ya nishtha sah gunah parikirtitah | viparyayah tu doshah syat ubhayoh eshah
    nishcayah || || shuddhi ashuddhi vidhiyete samaneshu api vastushu | dravyasya vicikitsartham gunadoshau
    shubha ashubhau || || dharmartham vyavaharartham yatrartham iti ca anagha | darshitah ayam maya acarah
    dharmam udvahatam dhuram || || bhumi ambu agni anila akashah bhutanam panca dhatavah | abrahma sthavara
    adinam sharirah atmasamyutah || || vedena namarupani vishamani sameshu api | dhatushu uddhava kalpyantah
    etesham svarthasiddhaye || || desha kala adi bhavanam vastunam mama sattama | gunadoshau vidhiyete
    niyamartham hi karmanam || || akrishnasarah deshanam abrahmanyah ashucih bhavet | krishnasarah api
    asauvira kikata asamskriterinam || || karmanyah gunavan kalah dravyatah svatah eva va | yatah nivartate
    karma sah doshah akarmakah smritah || || dravyasya shuddhi ashuddhi ca dravyena vacanena ca | samskarena
    atha kalena mahattva alpataya athava || || shaktya ashaktya athava buddhya samriddhya ca yat atmane
    | agham kurvanti hi yatha desha avastha anusaratah || || dhanya daru asthi tantunam rasa taijasa carmanam
    | kala vayu agni mrittoyaih parthivanam yuta ayutaih || || amedhyaliptam yat yena gandham lepam vyapohati
    | bhajate prakritim tasya tat shaucam tavat ishyate || || snana dana tapah avastha virya samskara
    karmabhih | mat smritya ca atmanah shaucam shuddhah karma acaret dvijah || || mantrasya ca parijnanam
    karmashuddhih madarpanam | dharmah sampadyate shadbhih adharmah tu viparyayah || || kvacit gunah api
    doshah syat doshah api vidhina gunah | gunadosharthaniyamah tat bhidam eva badhate || || samanakarma
    acaranam patitanam na patakam | autpattikah gunah sangah na shayanah patati adhah || || yatah yatah
    nivarteta vimucyeta tatah tatah | eshah dharmah nrinam kshemah shokamohabhaya apahah || || vishayeshu
    gunadhyasat pumsah sangah tatah bhavet | sangat tatra bhavet kamah kamat eva kalih nrinam || || kaleh
    durvishahah krodhah tamah tam anuvartate | tamasa grasyate pumsah cetana vyapini drutam || || taya
    virahitah sadho jantuh shunyaya kalpate | tatah asya svarthavibhramshah murcchitasya mritasya ca ||
    || vishayabhiniveshena na atmanam veda na aparam | vrikshajivikaya jivan vyartham bhastra iva yah
    shvasan || || phalashrutih iyam nrinam na shreyah rocanam param | shreyovivakshaya proktam yatha bhaishajyarocanam
    || || utpatti eva hi kameshu praneshu svajaneshu ca | asaktamanasah martya atmanah anarthahetushu
    || || na tan avidushah svartham bhramyatah vrijinadhvani | katham yunjyat punah teshu tan tamah vishatah
    budhah || || evam vyavasitam kecit avijnaya kubuddhayah | phalashrutim kusumitam na vedajnah vadanti
    hi || || kaminah kripanah lubdhah pushpeshu phalabuddhayah | agnimugdha dhumatantah svam lokam na
    vindanti te || || na te mam angah jananti hridistham yah idam yatah | ukthashastrah hi asutripah yatha
    niharacakshushah || || te me matam avijnaya paroksham vishayatmakah | himsayam yadi ragah syat yajnah
    eva na codana || || himsaviharah hi alabdhaih pashubhih svasukhecchaya | yajante devatah yajnaih pitribhutapatin
    khalah || || svapn upamam amum lokam asantam shravanapriyam | ashishah hridi sankalpya tyajanti arthan
    yatha vanik || || rajahsattvatamonishthah rajahsattvatamojushah | upasatah indramukhyan devadin na
    tatha eva mam || || ishtva iha devatah yajnaih gatva ramsyamahe divi | tasya antah iha bhuyasmah mahashala
    mahakulah || || evam pushpitaya vaca vyakshiptamanasam nrinam | maninan ca atistabdhanam madvarta
    api na rocate || || vedah brahmatmavishayah trikandavishayah ime | parokshavadah rishayah paroksham
    mama ca priyam || || shabdabrahma sudurbodham prana indriya manomayam | anantaparam gambhiram durvigahyam
    samudravat || || maya upabrimhitam bhumna brahmana anantashaktina | bhuteshu ghosharupena biseshu
    urna iva lakshyate || || yatha urnanabhih hridayat urnam udvamate mukhat | akashat ghoshavan pranah
    manasa sparsharupina || || chandomayah amritamayah sahasrapadavim prabhuh | onkarat vyanjita sparsha
    svara ushma antastha bhushitam || || vicitrabhashavitatam chandobhih catura uttaraih | anantaparam
    brihatim srijati akshipate svayam || || gayatri ushnik anushtup ca brihati panktih eva ca | trishtup
    jagati aticchandah hi atyashti atijagat virat || || kim vidhatte kim acashte kim anudya vikalpayet
    | iti asyah hridayam loke na anyah mat veda kashcana || || mam vidhatte abhidhatte mam vikalpya apohyate
    tu aham | etavan sarvavedarthah shabdah asthaya mam bhidam | mayamatram anudya ante pratishidhya prasidati
    || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe bhagavadddhavasamvade
    vedatrayavibhaganirupanam nama ekavimsho'dhyayah || || atha dvavimshah adhyayah | uddhavah uvaca |
    kati tattvani vishvesha sankhyatani rishibhih prabho | nava ekadasha panca trini attha tvam iha shushruma
    || || kecit shadvimshatim prahuh apare pancavimshatim | sapta eke nava shat kecit catvari ekadasha
    apare | kecit saptadasha prahuh shodasha eke trayodasha || || etavat tvam hi sankhyanam rishayah yat
    vivakshaya | gayanti prithak ayushman idam nah vaktum arhasi || || shribhagavan uvaca | yuktam ca
    santi sarvatra bhashante brahmanah yatha | mayam madiyam udgrihya vadatam kim nu durghatam || || na
    etat evam yatha attha tvam yat aham vacmi tat tatha | evam vivadatam hetum shaktayah me duratyayah
    || || yasam vyatikarat asit vikalpah vadatam padam | prapte shamadame api eti vadastamanu shamyati
    || || parasparan anupraveshat tattvanam purusharshabha | paurva aparya prasankhyanam yatha vaktuh
    vivakshitam || || ekasmin api drishyante pravishtani itarani ca | purvasmin va parasmin va tattve
    tattvani sarvashah || || paurva aparyam atah amisham prasankhyanam abhipsatam | yatha viviktam yat
    vaktram grihnimah yuktisambhavat || || anadi avidyayuktasya purushasya atmavedanam | svatah na sambhavat
    anyah tattvajnah jnanadah bhavet || || purusha ishvarayoh atra na vailakshanyam anu api | tat anyakalpanapartha
    jnanam ca prakriteh gunah || || prakritih gunasamyam vai prakriteh na atmanah gunah | sattvam rajah
    tamah iti sthiti utpatti antahetavah || || sattvam jnanam rajah karma tamah ajnanam iha ucyate | gunavyatikarah
    kalah svabhavah sutram eva ca || || purushah prakritih vyaktam ahankarah nabhah anilah | jyotih apah
    kshitih iti tattvani uktani me nava || || shrotram tvak darshanam ghranah jihva iti jnanashaktayah
    | vak pani upastha payu anghrih karmanyanga ubhayam manah || || shabdah sparshah rasah gandhah rupam
    ca iti arthajatayah | gati ukti utsarga shilpani karma ayatana siddhayah || || sarga adau prakritih
    hi asya karya karana rupini | sattva adibhih gunaih dhatte purushah avyaktah ikshate || || vyakta
    adayah vikurvanah dhatavah purusha ikshaya | labdhaviryah srijanti andam samhatah prakriteh balat
    || || sapta eva dhatavah iti tatra arthah panca khadayah | jnanam atma ubhaya adharah tatah deha indriya
    asavah || || shad iti atra api bhutani panca shashthah parah puman | taih yuktah atmasambhutaih srishtva
    idam samupavishat || || catvari eva iti tatra api tejah apah annam atmanah | jatani taih idam jatam
    janma avayavinah khalu || || sankhyane saptadashake bhutamatra indriyani ca | pancapanca eka manasa
    atma saptadashah smritah || || tadvat shodashasankhyane atma eva manah ucyate | bhutendriyani panca
    eva manah atma trayodashah || || ekadashatvah atma asau mahabhutendriyani ca | ashtau prakritayah
    ca eva purushah ca nava iti atha || || iti nana prasankhyanam tattvanam rishibhih kritam | sarvam
    nyayyam yuktimatvat vidusham kim ashobhanam || || uddhavah uvaca | prakritih purushah ca ubhau yadi
    api atmavilakshanau | anyonya apashrayat krishna drishyate na bhida tayoh | prakritau lakshyate hi
    atma prakritih ca tatha atmani || || evam me pundarikaksha mahantam samshayam hridi | chettum arhasi
    sarvajna vacobhih nayanaipunaih || || tvattah jnanam hi jivanam pramoshah te atra shaktitah | tvam
    eva hi atma mayaya gatim vettha na ca aparah || || shribhagavan uvaca | prakritih purushah ca iti
    vikalpah purusharshabha | eshah vaikarikah sargah gunavyatikaratmakah || || mama anga maya gunamayi
    anekadha vikalpabuddhih ca gunaih vidhatte | vaikarikah trividhah adhyatmam ekam atha adhidaivam adhibhutam
    anyat || || drik rupam arkam vapuh atra randhre parasparam sidhyati yah svatah khe | atma yat esham
    aparah yah adyah svaya anubhutya akhilasiddhasiddhih | evam tvak adi shravanadi cakshuh jihva adi
    nasa adi ca cittayuktam || || yah asau gunakshobhakritau vikarah pradhanamulat mahatah prasutah |
    aham trivrit mohavikalpahetuh vaikarikah tamasah aindriyah ca || || atmaparijnanamayah vivadah hi
    asti iti na asti iti bhidarthanishthah | vyarthah api na eva uparameta pumsam mattah paravrittadhiyam
    svalokat || || uddhavah uvaca | tvattah paravrittadhiyah svakritaih karmabhih prabho | ucca avacan
    yatha dehan grihnanti visrijanti ca || || tat mama akhyahi govinda durvibhavyam anatmabhih | na hi
    etat prayashah loke vidvamsah santi vancitah || || shribhagavan uvaca | manah karmamayam nrinam indriyaih
    pancabhih yutam | lokat lokam prayati anyah atma tat anuvartate || || dhyayan manah anuvishayan drishtan
    va anushrutan atha | udyat sidat karmatantram smritih tat anushamyati || || vishaya abhiniveshena
    na atmanam yat smaret punah | jantoh vai kasyacit hetoh mrityuh atyantavismritih || || janma tu atmataya
    pumsah sarvabhavena bhurida | vishaya svikritim prahuh yatha svapnamanorathah || || svapnam manoratham
    ca ittham praktanam na smarati asau | tatra purvam iva atmanam apurvam ca anupashyati || || indriya
    ayana srishtya idam traividhyam bhati vastuni | bahih antah bhidahetuh janah asat janakrit yatha ||
    || nityada hi angah bhutani bhavanti na bhavanti ca | kalena alkshyavegena sukshmatvat tat na drishyate
    || || yatha arcisham srotasam ca phalanam va vanaspateh | tatha eva sarvabhutanam vayah avastha adayah
    kritah || || sah ayam dipah arcisham yadvat srotasam tat idam jalam | sah ayam puman iti nrinam mrishah
    gih dhih mrisha ayusham || || ma svasya karmabijena jayate sah api ayam puman | mriyate vamarah bhrantya
    yatha agnih daru samyutah || || nishekagarbhajanmani balyakaumarayauvanam | vayomadhyam jara mrityuh
    iti avasthah tanoh nava || || etah manorathamayih hi anyasya uccavacah tanuh | gunasangat upadatte
    kvacit kashcit jahati ca || || atmanah pitriputrabhyam anumeyau bhavapyayau | na bhavapyayavastunam
    abhijnah dvayalakshanah || || taroh bijavipakabhyam yah vidvat janmasamyamau | taroh vilakshanah drashta
    evam drashta tanoh prithak || || prakriteh evam atmanam avivicya abudhah puman | tattvena sparshasammudhah
    samsaram pratipadyate || || sattvasangat rishin devan rajasa asuramanushan | tamasa bhutatiryaktvam
    bhramitah yati karmabhih || || nrityatah gayatah pashyan yatha eva anukaroti tan | evam buddhigunan
    pashyan anihah api anukaryate || || yatha ambhasa pracalata taravah api calah iva | cakshusha bhramyamanena
    drishyate bhramati iva bhuh || || yatha manorathadhiyah vishayanubhavah mrisha | svapnadrishtah ca
    dasharha tatha samsarah atmanah || || arthe hi avidyamane api samsritih na nivartate | dhyayatah vishayan
    asya svapne anartha agamah yatha || || tasmat uddhava ma bhunkshva vishayan asat indriyaih | atma
    agrahananirbhatam pashya vaikalpikam bhramam || || kshiptah avamanitah asadbhih pralabdhah asuyitah
    athava | taditah sannibaddhah va vrittya va parihapitah || || nishthitah mutritah bahudha evam prakampitah
    | shreyaskamah kricchragatah atmana atmanam uddharet || || uddhavah uvaca | yatha evam anubuddhyeyam
    vada nah vadatam vara | suduhsaham imam manyah atmani asat atikramam || || vidusham api vishvatman
    prakritih hi baliyasi | rite tvat dharmaniratan shantah te caranalayan || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe bhagavaduddhavasamvade dvavimsho'dhyayah || ||
    atha trayovimshah adhyayah | badarayanih uvaca | sah evam ashamsitah uddhavena bhagavatamukhyena dasharhamukhyah
    | sabhajayan brityavacah mukundah tam ababhashe shravaniyaviryah || || shribhagavan uvaca | barhaspatya
    sah vai na atra sadhuh vai durjan iritaih | duruktaih bhinnam atmanam yah samadhatum ishvarah || ||
    na tatha tapyate viddhah puman banaih sumarmagaih | yatha tudanti marmasthah hi asatam parusheshavah
    || || kathayanti mahatpunyam itihasam iha uddhava | tam aham varnayishyami nibodha susamahitah ||
    || kenacit bhikshuna gitam paribhutena durjanaih | smaratah dhritiyuktena vipakam nijakarmanam ||
    || avanishu dvijah kashcit asit adhyatamah shriya | vartavrittih kadaryah tu kami lubdhah atikopanah
    || || jnatayah atithayah tasya vanmatrena api na arcitah | shunya avasathah atma api kale kamaih anarcitah
    || || duhshilasya kadaryasya druhyante putrabandhavah | dara duhitarah bhrityah vishannah na acaran
    priyam || || tasya evam yakshavittasya cyutasya ubhayalokatah | dharmakamavihinasya cukrudhuh pancabhaginah
    || || tat avadhyana visrasta punya skandhasya bhurida | arthah api agacchan nidhanam bahu ayasa parishramah
    || || jnatayah jagrihuh kincit kincit asyavah uddhava | daivatah kalatah kincit brahmabandhoh nriparthivat
    || || sah evam dravine nashte dharmakamavivarjitah | upekshitah ca svajanaih cintam apa duratyayam
    || || tasya evam dhyayatah dirgham nashtarayah tapasvinah | khidyatah bashpakanthasya nirvedah sumahan
    abhut || || sah ca aha idam aho kashtam vritha atma me anutapitah | na dharmaya na kamaya yasya artha
    ayasah idrishah || || prayena arthah kadaryanam na sukhaya kadacana | iha ca atmopatapaya mritasya
    narakaya ca || || yashah yashasvinam shuddham shlaghyah ye guninam gunah | lobhah svalpah api tan
    hanti shvitrah rupam iva ipsitam || || arthasya sadhane siddhah utkarshe rakshane vyaye | nasha upabhogah
    ayasah trasah cinta bhramah nrinam || || steyam himsa anritam dambhah kamah krodhah smayah madah |
    bhedah vairam avishvasah samspardha vyasanani ca || || ete pancadashan arthah hi arthamulah matah
    nrinam | tasmat anartham arthakhyam shreyah arthi duratah tyajet || || bhidyante bhratarah darah pitarah
    suhridah tatha | ekasnigdhah kakinina sadyah sarve arayah kritah || || arthena alpiyasa hi ete samrabdha
    diptam anyavah | tyajanti ashu spridhah ghnanti sahasa utsrijya sauhridam || || labdhva janma amaraprarthyam
    manushyam tat dvija agryatam | tat anadritya ye svartham ghnanti yanti ashubham gatim || || svarga
    apavargayoh dvaram prapya lokam imam puman | dravine kah anushajjeta martyah anarthasya dhamani ||
    || devarshi pitri bhutani jnatin bandhun ca bhaginah | asamvibhajya ca atmanam yakshavittah patati
    adhah || || vyarthaya arthehaya vittam pramattasya vayah balam | kushalah yena sidhyanti jarathah
    kim nu sadhaye || || kasmat sanklishyate vidvan vyarthaya arthehaya asakrit | kasyacit mayaya nunam
    lokah ayam suvimohitah || || kim dhanaih dhanadaih va kim kamaih va kamadaih uta | mrityuna grasyamanasya
    karmabhih va uta janmadaih || || nunam me bhagavan tushtah sarvadevamayah harih | yena nitah dasham
    etam nirvedah ca atmanah plavah || || sah aham kalau asheshena shoshayihhye angam atmanah | apramattah
    akhilasvarthe yadi syat siddhah atmani || || tatra mam anumoderan devah tribhuvaneshvarah | muhurtena
    brahmalokam khatvangah samasadhayat || || shribhagavan uvaca | iti abhipretya manasa hi avantyah dvijasattamah
    | unmucya hridayagranthin shantah bhikshuh abhut munih || || sah cacara mahim etam samyata atmendriya
    anilah | bhikshartham nagara graman asangah alakshitah avishat || || tam vai pravayasam bhikshum avadhutam
    asajjanah | drishtva paryabhavan bhadrah bahvibhih paribhutibhih || || kecit trivenum jagrihuh eke
    patram kamandalum | pitham ca eke akshasutram ca kantham cirani kecana || || pradaya ca punah tani
    darshitani adaduh muneh | annam ca bhaikshyasampannam bhunjanasya sarit tate || || mutrayanti ca papishthah
    shthivanti asya ca murdhani | yatavacam vacayanti tadayanti na vakti cet || || tarjayanti apare vagbhih
    stenah ayam iti vadinah | badhnanti rajjva tam kecit badhyatam badhyatam iti || || kshipanti eke avajanantah
    eshah dharmadhvajah shathah | kshinavittah imam vrittim agrahit svajana ujjhitah || || aho eshah mahasarah
    dhritiman girih adiva | maunena sadhayati artham bakavat dridhanishcayah || || iti eke vihasanti enam
    eke durvatayanti ca | tam babandhuh nirurudhuh yatha kridanakam dvijam || || evam sah bhautikam duhkham
    daivikam daihikam ca yat | bhoktavyam atmanah dishtam praptam praptam abudhyata || || paribhutah imam
    gatham agayata naradhamaih | patayadbhih svadharmasthah dhritim asthaya satvikim || || dvijah uvaca
    | na ayam janah me sukhaduhkhahetuh na devatatma grahakarmakalah | manah param karanam amananti samsaracakram
    parivartayet yat || || manah gunan vai srijate baliyah tatah ca karmani vilakshanani | shuklani krishnani
    atha lohitani tebhyah savarnah sritayah bhavanti || || anihah atma manasa samihata hiranmayah matsakhah
    udvicashte | manah svalingam parigrihya kaman jushan nibaddhah gunasangatah asau || || danam svadharmah
    niyamah yamah ca shrutam ca karmani ca sadvratani | sarve manonigrahalakshanantah parah hi yogah manasah
    samadhi || || samahitam yasya manah prashantam danadibhih kim vada tasya krityam | asamyatam yasya
    manah vinashyat danadibhih cet aparam kimebhih || || manovashe anye hi abhavan sma devah manah ca
    na anyasya vasham sameti | bhishmah hi devah sahasah sahiyan yunjyat vashe tam sah hi devadevah ||
    || tam durjayam shatrum asahyavegam maruntudam tat na vijitya kecit | kurvanti asat vigraham atra
    martyaih mitrani udasina ripun vimudhah || || deham manomatram imam grihitva mama aham iti andha dhiyah
    manushyah | eshah aham anyah ayam iti bhramena durantapare tamasi bhramanti || || janah tu hetuh sukhaduhkhayoh
    cet kim atmanah ca atra ha bhaumayoh tat | jihvam kvacit sandashati svadadbhih tat vedanayam katamaya
    kupyet || || duhkhasya hetuh yadi devatah tu kim atmanah tatra vikarayoh tat | yat angam angena nihanyate
    kvacit krudhyeta kasmai purushah svadehe || || atma yadi syat sukhaduhkhahetuh kim anyatah tatra nijasvabhavah
    | na hi atmanah anyat yadi tat mrisha syat krudhyeta kasmat na sukham na duhkham || || grahah nimittam
    sukhaduhkhayoh cet kim atmanah ajasya janasya te vai | grahaih grahasya eva vadanti pidam krudhyeta
    kasmai purushah tatah anyah || || karmah tu hetuh sukhaduhkhayoh cet kim atmanah tat hi jadajadatve
    | dehah tu acitpurushah ayam suparnah krudhyeta kasmai na hi karmamulam || || kalah tu hetuh sukhaduhkhayoh
    cet kim atmanah tatra tat atmakah asau | na agneh hi tapah na himasya tat syat krudhyeta kasmai na
    parasya dvandvam || || na kenacit kva api kathancana asya dvandva uparagah paratah parasya | yathahamah
    samsritirupinah syat evam prabuddhah na bibheti bhutaih || || etam sah asthaya paratmanishtham adhyasitam
    purvatamaih maharshibhih | aham tarishyami durantaparam tamah mukunda anghrinishevaya eva || || shribhagavan
    uvaca | nirvidya nashtadravinah gataklamah pravrajya gam paryatamanah ittham | nirakritah asadbhih
    api svadharmat akampitah amum munih aha gatham || || sukhaduhkhapradah na anyah purushasya atmavibhramah
    | mitra udasinaripavah samsarah tamasah kritah || || tasmat sarvatmana tata nigrihana mano dhiya |
    mayi aveshitaya yuktah etavan yogasangrahah || || yah etam bhikshuna gitam brahmanishtham samahitah
    | dharayan shravayan shrunvan dvandvaih na eva abhibhuyate || || iti shrimadbhagavate mahapurane paramahamsyam
    samhitayamekadashaskandhe bhagavaduddhavasamvade bikshugitanirupanam nama trayovimsho'dhyayah || ||
    atha caturvimsho'dhyah | shribhagavan uvaca | atha te sampravakshyami sankhyam purvaih vinishcitam
    | yat vijnaya puman sadyah jahyat vaikalpikam bhramam || || asit jnanam athah hi arthah ekam eva avikalpitam
    | yada vivekanipunah adau kritayuge ayuge || || tat mayaphalarupena kevalam nirvikalpitam | vanmanah
    agocaram satyam dvidha samabhavat brihat || || tayoh ekatarah hi arthah prakritih sobhayatmika | jnanam
    tu anyatarah bhavah purushah sah abhidhiyate || || tamah rajah sattvam iti prakriteh abhavan gunah
    | maya prakshobhyamanayah purusha anumatena ca || || tebhyah samabhavat sutram mahan sutrena samyutah
    | tatah vikurvatah jatah yah ahankarah vimohanah || || vaikarikah taijasah ca tamasah ca iti aham
    trivrit | tanmatra indriya manasam karanam cit acit mayah || || arthah tanmatrikat jajne tamasat indriyani
    ca | taijasat devatah asan ekadasha ca vaikritat || || maya sancoditah bhavah sarve samhati akarinah
    | andam utpadayamasuh mama ayatanam uttamam || || tasmin aham samabhavam ande salilasamsthitau | mama
    nabhyam abhut padmam vishvakhyam tatra ca atmabhuh || || sah asrijat tapasa yuktah rajasa mat anugrahat
    | lokan sapalan vishvatma bhuh bhuvah svah iti tridha || || devanam okah asit svah bhutanam ca bhuvah
    padam | martya adinam ca bhuh lokah siddhanam tritayat param || || adhah asuranam naganam bhumeh okah
    asrijat prabhuh | trilokyam gatayah sarvah karmanam triguna atmanam || || yogasya tapasah ca eva nyasasya
    gatayah amalah | mahah janah tapah satyam bhaktiyogasya madgatih || || maya kalatmana dhatra karmayuktam
    idam jagat | gunapravahah etasmin unmajjati nimajjati || || anuh brihat krishah sthulah yah yah bhavah
    prasidhyati | sarvah api ubhayasamyuktah prakritya purushena ca || || yah tu yasya adih antah ca sah
    vai madhyam ca tasya san | vikarah vyavahararthah yatha taijasa parthivah || || yat upadaya purvah
    tu bhavah vikurute aparam | adih antah yada yasya tat satyam abhidhiyate || || prakritih hi asya upadanam
    adharah purushah parah | satah abhivyanjakah kalah brahma tat tritayam tu aham || || sargah pravartate
    tavat paurva aparyena nityashah | mahan gunavisarga arthah sthiti antah yavat ikshanam || || virat
    maya asadyamanah lokakalpavikalpakah | pancatvaya visheshaya kalpate bhuvanaih saha || || anne praliyate
    martyam annam dhanasu liyate | dhanah bhumau praliyante bhumih gandhe praliyate || || apsu praliyante
    gandhah apah ca svagune rase | liyate jyotishi rasah jyoti rupe praliyate || || rupam vayau sah ca
    sparshe liyate sah api ca ambare | ambaram shabdatanmatrah indriyani svayonishu || || yonih vaikarike
    saumya liyate manasi ishvare | shabdah bhutadim api eti bhutadih mahati prabhuh || || sah liyate mahan
    sveshu guneshu gunavattamah | te avyakte sampraliyante tatkale liyate avyaye || || kalah mayamaye
    jive jivah atmani mayi aje | atma kevalah atmasthah vikalpa apaya lakshanah || || evam anvikshamanasya
    katham vaikalpikah bhramah | manasah hridi tishtheta vyomni iva arka udaye tamah || || eshah sankhyavidhih
    proktah samshayagranthibhedanah | pratiloma anulomabhyam paravaradrisha maya || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe shrikrishnoddhavasamvade prakritipurushasankhyayogo
    nama caturvimsho'dhyayah || || atha pancavimsho'dhyayah | shribhagavanuvaca | gunanam asamishranam
    pumanyena yatha bhavet | tanme purushavarya iadam upadharaya shamsatah || || samah damah titiksha
    iksha tapah satyam daya smritih | tushtih tyagah aspriha shraddha hrih daya adih svanirvritih || ||
    kamah iha madah trishna stambhah ashih bhida sukham | mada utsahah yashah pritih hasyam viryam bala
    udyamah || || krodhah lobhah anritam himsa yanca dambhah klamah kalih | shokamohau vishadarti nidra
    asha bhih anudyamah || || sattvasya rajasah ca etah tamasah ca anumurvashah | vrittayah varnitaprayah
    sannipatam athah shrunu || || sannipatah tu aham iti mama iti uddhava ya matih | vyavaharah sannipatah
    manomatra indriyasubhih || || dharme ca arthe ca kame ca yada asau parinishthitah | gunanam sannikarshah
    ayam shraddhah atidhanavahah || || pravrittilakshane nishtha puman yah hi grihashrame | svadharme
    ca anutishtheta gunanam samitih hi sa || || purusham sattvasamyuktam anumiyat shama adibhih | kamadibhi
    rajoyuktam krodhadyaih tamasa yutam || || yada bhajati mam bhaktya nirapekshah svakarmabhih | tam
    sattvaprakritim vidyat purusham striyam eva va || || yada ashishah ashasya mam bhajeta svakarmabhih
    | tam rajahprakritim vidyat himsam ashasya tamasam || || sattvam rajah tamah iti gunah jivasya na
    eva me | cittaja yaih tu bhutanam sajjamanah nibadhyate || || yadetarau jayet sattvam bhasvaram vishadam
    shivam | tada sukhena yujyeta dharmajnana adibhih puman || || yada jayet tamah sattvam rajah sangam
    bhida calam | tada duhkhena yujyeta karmana yashasa shriya || || yada jayet rajah sattvam tamah mudhah
    layam jadam | yujyeta shokamohabhyam nidraya himsaya ashaya || || yada cittam prasideta indriyanam
    ca nirvritih | dehe abhayam manosangam tat sattvam viddhi matpadam || || vikurvan kriyaya ca adhira
    nirvritih ca cetasam | gatrasvasthyam manah bhrantam rajah etaih nishamaya || || sidat cittam viliyeta
    cetasah grahane akshamam | manah nashtam tamah glanih tamah tat upadharaya || || edhamane gune sattve
    devanam balam edhate | asuranam ca rajasi tamasi uddhava rakshasam || || sattvat jagaranam vidyat
    rajasa svapnam adishet | prasvapam tamasa jantoh turiyam trishu santatam || || uparyupari gacchanti
    sattvena abrahmanah janah | tamasa adhah adhah amukhyat rajasa antaracarinah || || sattve pralinah
    svah yanti naralokam rajolayah | tamolayah tu nirayam yanti mam eva nirgunah || || madarpanam nishphalam
    va satvikam nijakarma tat | rajasam phalasankalpam himsaprayadi tamasam || || kaivalyam satvikam jnanam
    rajah vaikalpikam ca yat | prakritam tamasam jnanam mannishtham nirgunam smritam || || vanam tu satvikah
    vasah gramah rajasah ucyate | tamasam dyutasadanam manniketanam tu nirgunam || || satvikah karakah
    asangi ragandhah rajasah smritah | tamasah smritivibhrashtah nirgunah madapashrayah || || sattviki
    adhyatmiki shraddha karmashraddha tu rajasi | tamasyadharme ya shraddha matsevayam tu nirguna || ||
    pathyam putam anayah tam aharyam sattvikam smritam | rajasam ca indriyapreshtham tamasam ca artida
    ashuci || || sattvikam sukham atmottham vishayottham tu rajasam | tamasam mohadainottham nirgunam
    madapashrayam || || dravyam deshah phalam kalah jnanam karma ca karakah | shraddha avastha akritih
    nishtha traigunyah sarvah eva hi || || sarve gunamayah bhavah purusha avyakta dhishthitah || || etah
    samsritayah pumsah gunakarmanibandhanah | yena ime nirjitah saumya gunah jivena cittajah | bhaktiyogena
    mannishthah madbhavaya prapadyate || || tasmat aham imam labdhva jnanavijnanasambhavam | gunasangam
    vinirdhuya mam bhajantu vicakshanah || || nihsangah mam bhajet vidvan apramattah jitendriyah | rajah
    tamah ca abhijayet sattvasamsevaya munih || || sattvam ca abhijayet yuktah nairapekshyena shantadhih
    | sampadyate gunaih muktah jivah jivam vihaya mam || || jivah jivavinirmuktah gunaih ca ashayasambhavaih
    | maya eva brahmana purnah na bahih na antarah caret || || iti shrimadbhagavate mahapurane paramahamsyam
    samhitayamekadashaskandhe shrikrishnoddhavasamvade gunanirgunanirupanam nama pancavimsho'dhyayah ||
    || atha shadvimsho'dhyayah | shribhagavan uvaca | mat lakshanam imam kayam labdhva maddharmah asthitah
    | anandam paramatmanam atmastham samupaiti mam || || gunamayyah jivayonyah vimuktah jnananishthaya
    | guneshu mayamatreshu drishyamaneshu avastutah | vartamanah api na puman yujyate avastubhih gunaih
    || || sangam na kuryat asatam shishna udara tripam kvacit | tasya anugatah tamasi andhe patati andha
    anugandhavat || || ailah samrat imam gatham agayata brihacchravah | urvashi virahat muhyan nirvinnah
    shokasamyame || || tyaktva atmanam vrajantim tam nagnah unmattavat nripah | vilapan anvagat jaye ghore
    tishtha iti viklavah || || kaman atriptah anujushan kshullakan varshayaminih | na veda yantih na ayantih
    urvashi akrishtaceatanah || || ailah uvaca | aho me mohavistarah kamakashmalacetasah | devyah grihitakanthasya
    na ayuhkhandah ime smritah || || na aham veda abhinirmuktah suryah va abhyuditah amuya | mushitah
    varshapuganam bata ahani gatani uta || || aho me atmasammohah yena atma yoshitam kritah | kridamrigah
    cakravarti naradevashikhamanih || || saparicchadam atmanam hitva trinam iva ishvaram | yantim striyam
    ca anvagamam nagnah unmattavat rudan || || kutah tasya anubhavah syat tejah ishatvam eva va | yah
    anvagaccham striyam yantim kharavat padataditah || || kim vidyaya kim tapasa kim tyagena shrutena
    va | kim viviktena maunena stribhih yasya manah hritam || || svarthasya akovidam dhin mam murkham
    pandita maninam | yah aham ishvaratam prapya stribhih go kharavat jitah || || sevatah varshapugat
    me urvashyah adharasavam | na tripyati atmabhuh kamah vahnih ahutibhih yatha || || pumshcalya apahritam
    cittam konvanyah mocitum prabhuh | atmarameshvaram rite bhagavantam adhokshajam || || bodhitasya api
    devya me suktavakyena durmateh | manogatah mahamohah na apayati ajitatmanah || || kim etaya nah apakritam
    rajjva va sarpacetasah | rajjusvarupa avidushah yah aham yat ajitendriyah || || kva ayam malomasah
    kayah daurgandhi adi atmakah ashucih | kva gunah saumanasya adyah hi adhyasah avidyaya kritah || ||
    pitroh kim svam nu bharyayah svaminah agneh shvagridhrayoh | kim atmanah kim suhridam iti yah na avasiyate
    || || tasmin kalevare amedhye tucchanishthe vishajjate | aho subhadram sunasam susmitam ca mukham
    striyah || || tvan mamsa rudhira snayu medo majja asthi samhatau | vinmutrapuye ramatam kriminam kiyat
    antaram || || atha api na upasajjeta strishu straineshu ca arthavit | vishaya indriya samyogat manah
    kshubhyati na anyatha || || adrishtat ashrutat bhavat na bhavah upajayate | asamprayunjatah pranan
    shamyati stimitam manah || || tasmat sangah na kartavyah strishu straineshu ca indriyaih | vidusham
    ca api avishrabdhah shadvargah kimu madrisham || || shribhagavan uvaca | evam pragayan nripadevadevah
    sah urvashilokam athah vihaya | atmanam atmani avagamya mam vai uparamat jnanavidhutamohah || || tatah
    duhsangam utsrijya satsu sajjeta buddhiman | santah etasya chindanti manovyasangamuktibhih || || santah
    anapekshah maccittah prashantah samadarshinah | nirmamah nirahankarah nirdvandvah nishparigrahah ||
    || teshu nityam mahabhagah mahabhageshu matkathah | sambhavanti hita nrinam jushatam prapunanti agham
    || || tah ye shrunvanti gayanti hi anumodanti ca adritah | matparah shraddadhanah ca bhaktim vindanti
    te mayi || || bhaktim labdhavatah sadhoh kim anyat avashishyate | mayi anantagune brahmani ananda
    anubhava atmani || || yatha upashrayamanasya bhagavantam vibhavasum | shitam bhayam tamah api eti
    sadhun samsevatah tatha || || nimajjya unmajjyatam ghore bhavabdhau parama ayanam | santah brahmavidah
    shantah nauh dridha iva apsu majjatam || || annam hi praninam pranah artanam sharanam tu aham | dharmah
    vittam nrinam pretya santah arvak bibhyatah aranam || || santah dishanti cakshumshi bahih arkah samutthitah
    | devatah bandhavah santah santah atma aham eva ca || || vaitasenah tatah api evam urvashya lokanihsprihah
    | muktasangah mahim etam atmaramah cacara ha || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    shrikrishnoddhavasamvade ailagitam nama shadvimsho'dhyayah || || atha saptavimsho'dhyayah | uddhavah
    uvaca | kriyayogam samacakshva bhavat aradhanam prabho | yasmat tvam ye yatha arcanti satvatah satvatarshabha
    || || etat vadanti munayah muhuh nihshreyasam nrinam | naradah bhagavan vyasah acaryah angirasah sutah
    || || nihsritam te mukhambhojadyat aha bhagavan ajah | putrebhyah bhrigumukhyebhyah devyai ca bhagavan
    bhavah || || etat vai sarvavarnanam ashramanam ca sammatam | shreyasam uttamam manye strishudranam
    ca manada || || etat kamalapatraksha karmabandhavimocanam | bhaktaya ca anuraktaya bruhi vishveshvara
    ishvara || || shribhagavan uvaca | nahi antah anantaparasya karmakandasya ca uddhava | sankshiptam
    varnayishyami yathavat anupurvashah || || vaidikah tantrikah mishrah iti me trividhah makhah | trayanam
    ipsitena eva vidhina mam samarcayet || || yada svanigamena uktam dvijatvam prapya purushah | yatha
    yajeta mam bhaktya shraddhaya tat nibodha me || || arcayam sthandile agnau va surye va apsu hridi
    dvijah | dravyena bhaktiyuktah arcet svagurum mam amayaya || || purvam snanam prakurvita dhautadantah
    angashuddhaye | ubhayaih api ca snanam mantraih mridgrahanadina || || sandhya upasti adi karmani vedena
    acoditani me | pujam taih kalpayet samyak sankalpah karmapavanim || || shaili darumayi lauhi lepya
    lekhya ca saikati | manomayi manimayi pratima ashtavidha smrita || || cala acala iti dvividha pratishtha
    jivamandiram | udvasa avahane na stah sthirayam uddhava arcane || || asthirayam vikalpah syat sthandile
    tu bhavet dvayam | snapanam tu avilepyayam anyatra parimarjanam || || dravyaih prasiddhyaih mat yagah
    pratimadishu amayinah | bhaktasya ca yathalabdhaih hridi bhavena ca eva hi || || snana alankaranam
    preshtham arcayam eva tu uddhava | sthandile tattvavinyasah vahnau ajyaplutam havih || || surye ca
    abhyarhanam preshtham salile salila adibhih | shraddhaya upahritam preshtham bhaktena mama vari api
    || || bhuryapi abhakta upahritam na me toshaya kalpate | gandhah dhupah sumanasah dipah anna adya
    ca kim punah || || shucih sambhritasambharah prak darbhaih kalpita asanah | asinah prak udak va arcet
    arcayam atha sammukhah || || kritanyasah kritanyasam madarcam panina mrijet | kalasham prokshaniyam
    ca yathavat upasadhayet || || tat adbhih devayajanam dravyani atmanam eva ca | prokshya patrani trini
    adbhih taih taih dravyaih ca sadhayet || || padya argha acamaniyartham trini patrani daishikah | hrida
    shirshna atha shikhaya gayatrya ca abhimantrayet || || pinde vayu agni samshuddhe hritpadmastham param
    mama | anvim jivakalam dhyayet nada ante siddhabhavitam || || taya atmabhutaya pinde vyapte sampujya
    tanmayah | avahya arca adishu sthapya nyasta angam mam prapujayet || || padya upasparsha arhana adin
    upacaran prakalpayet | dharmadibhih ca navabhih kalpayitva asanam mama || || padmam ashtadalam tatra
    karnikakesara ujjvalam | ubhabhyam vedatantrabhyam mahyam tu ubhayasiddhaye || || sudarshanam pancajanyam
    gadasishudhanuh halan | musalam kaustubham malam shrivatsam ca anupujayet || || nandam sunandam garudam
    pracandam candam eva ca | mahabalam balam ca eva kumudam kumudekshanam || || durgam vinayakam vyasam
    vishvaksenam gurun suran | sve sve sthane tu abhimukhan pujayet prokshana adibhih || || candana ushira
    karpura kunkuma agaru vasitaih | salilaih snapayet mantraih nityada vibhave sati || || svarnagharma
    anuvakena mahapurushavidyaya | paurushena api suktena samabhih rajanadibhih || || vastra upavita abharana
    patra srak gandha lepanaih | alankurvita saprema madbhaktah mam yatha ucitam || || padyam acamaniyam
    ca gandham sumanasah akshatan | dhupa dipa upaharyani dadyat me shraddhaya arcakah || || gudapayasasarpimshi
    shashkuli apupa modakan | samyava dadhi supam ca naivedyam sati kalpayet || || abhyanga unmardana
    adarsha dantadhau abhishecanam | annadya gita nrityadi parvani syuh utanvaham || || vidhina vihite
    kunde mekhalagartavedibhih | agnim adhaya paritah samuhet panina uditam || || paristirya atha paryukshet
    anvadhaya yathavidhi | prokshanya asadya dravyani prokshyagnau bhavayeta mam || || taptajambunadaprakhyam
    shankhacakragadambujaih | lasat caturbhujam shantam padmakinjalkavasasam || || sphurat kirita kataka
    katisutravara angadam | shrivatsavakshasam bhrajat kaustubham vanamalinam || || dhyayan abhyarcya
    daruni havisha abhighritani ca | prasya ajyabhagau agharau dattva ca ajyaplutam havih || || juhuyat
    mulamantrena shodasharca avadanatah | dharmadibhyah yathanyayam mantraih svishtikritam budhah || ||
    abhyarcya atha namaskritya parshadebhyah balim haret | mulamantram japet brahma smaran narayana atmakam
    || || dattva acamanam ucchesham vishvaksenaya kalpayet | mukhavasam surabhimat tambuladyam atha arhayet
    || || upagayan grinan nrityan karmani abhinayan mama | matkathah shravayan shrunvan muhurtam kshanikah
    bhavet || | stavaih uccavacaih stotraih pauranaih prakritaih api | stutva prasida bhagavan iti vandeta
    dandavat || || shirah mat padayoh kritva bahubhyam ca parasparam | prapannam pahi mam isha bhitam
    mrityugraha arnavat || || iti shesham maya dattam shirasi adhaya sadaram | udvasayet cet udvasyam
    jyotih jyotishi tat punah || || arcadishu yada yatra shraddha mam tatra ca arcayet | sarvabhuteshu
    atmani ca sarva atma aham avasthitah || || evam kriyayogapathaih puman vaidikatantrikaih | arcan ubhayatah
    siddhim mattah vindati abhipsitam || || madarcam sampratishthapya mandiram karayet dridham | pushpa
    udyanani ramyani puja yatra utsava ashritan || || pujadinam pravahartham mahaparvasu atha anvaham
    | kshetrapanapuragraman dattva mat sarshtitam iyat || || pratishthaya sarvabhaumamsadmana bhuvanatrayam
    | pujadina brahmalokam tribhih mat samyatam iyat || || mam eva nairapekshyena bhaktiyogena vindati
    | bhaktiyogam sah labhate evam yah pujayeta mam || || yah svadattam paraih dattam hareta suraviprayoh
    | vrittim sah jayate vidbhuk varshanam ayutayutam || || kartuh ca saratheh hetoh anumodituh eva ca
    | karmanam bhaginah pretya bhuyah bhuyasi tatphalam || || iti shrimadbhagavate mahapurane paramahamsyam
    samhitayamekadashaskandhe shrikrishnoddhavasamvade saptavimsho'dhyayah || || atha ashtavimshah adhyayah
    | shribhagavan uvaca | parasvabhavakarmani na prashamset na garhayet | vishvam ekatmakam pashyan prakritya
    purushena ca || || parasvabhavakarmani yah prashamsati nindati | sah ashu bhrashyate svarthat asatya
    abhiniveshatah || || taijase nidraya apanne pindasthah nashtacetanah | mayam prapnoti mrityum va tadvat
    nanarthadrik puman || || kim bhadram kim abhadram va dvaitasya avastunah kiyat | vaca uditam tat anritam
    manasa dhyatam eva ca || || chayapratyahvayabhasa hi asantah api arthakarinah | evam dehadayah bhavah
    yacchanti amrityutah bhayam || || atma eva tat idam vishvam srijyate srijati prabhuh | trayate trati
    vishvatma hriyate harati ishvarah || || tasmat nahi atmanah anyasmat anyah bhavah nirupitah | nirupiteyam
    trividha nirmula bhatih atmani | idam gunamayam viddhi trividham mayaya kritam || || etat vidvan maduditam
    jnanavijnananaipunam | na nindati na ca stauti loke carati suryavat || || pratyakshena anumanena nigamena
    atmasamvida | adi antavat asat jnatva nihsangah vicaret iha || || uddhavah uvaca | na eva atmanah
    na dehasya samsritih drashtridrishyayoh | anatmasvadrishoh isha kasya syat upalabhyate || || atma
    avyayah agunah shuddhah svayanjyotih anavritah | agnivat daruvat dehah kasya iha samsritih || || shribhagavan
    uvaca | yavat deha indriya pranaih atmanah sannikarshanam | samsarah phalavan tavat aparthah api avivekinah
    || || arthe hi avidyamane api samsritih na nivartate | dhyayatah vishayan asya svapne anartha agamah
    yatha || || yatha hi apratibuddhasya prasvapah bahu anarthabhrit | sah eva pratibuddhasya na vai mohaya
    kalpate || || shoka harsha bhaya krodha lobha moha sprihadayah | ahankarasya drishyante janma mrityuh
    ca na atmanah || || deha indriya prana manah abhimanah jivah antaratma gunakarma murtih | sutram mahan
    iti urudha iva gitah samsarah adhavati kalatantrah || || amulam etat bahurupa rupitam manovacahpranasharirakarma
    | jnanasina upasanaya shitena chittva munih gam vicarati atrishnah || || jnanam vivekah nigamah tapah
    ca pratyaksham aitihyam atha anumanam | adi antayoh asya yat eva kevalam kalah ca hetuh ca tat eva
    madhye || || yatha hiranyam svakritam purastat pashcat ca sarvasya hiranmayasya | tat eva madhye vyavaharyamanam
    nanapadeshaih aham asya tadvat || || vijnanam etat triyavastam anga gunatrayam karana karya kartri
    | samanvayena vyatirekatah ca yena eva turyena tat eva satyam || || na yat purastat uta yat na pashcat
    madhye ca tat na vyapadeshamatram | bhutam prasiddham ca parena yadyat tat eva tat syat iti me manisha
    || || avidyamanah api avabhasate yah vaikarikah rajasasargah eshah | brahma svayanjyotih atah vibhati
    brahma indriya artha atma vikara citram || || evam sphutam brahmavivekahetubhih parapavadena visharadena
    | chittva atmasandeham uparameta svanandatushtah akhila kamukebhyah || || na atma vapuh parthivam
    indriyani devah hi asuh vayujalam hutashah | manah annamatram dhishana ca sattvam ahankritih kham
    kshitih arthasamyam || || samahitaih kah karanaih gunatmabhih gunah bhavet matsuviviktadhamnah | vikshipyamanaih
    uta kim na dushanam ghanaih upetaih vigataih raveh kim || || yatha nabhah vayu anala ambu bhu gunaih
    gatagataih vartugunaih na sajjate | tatha aksharam sattva rajah tamah malaih ahammateh samsritihetubhih
    param || || tathapi sangah parivarjaniyah guneshu mayaraciteshu tavat | madbhaktiyogena dridhena yavat
    rajah nirasyeta manahkashayah || || yatha amayah asadhu cikitsitah nrinam punah punah santudati prarohan
    | evam manah apakva kashaya karma kuyoginam vidhyati sarvasangam || || kuyoginah ye vihita antarayaih
    manushyabhutaih tridasha upasrishtaih | te praktana abhyasabalena bhuyah yunjanti yogam na tu karmatantram
    || || karoti karma kriyate ca jantuh kenapi asau coditah anipatat | na tatra vidvanprakritau sthitah
    api nivritta trishnah svasukha anubhutya || || tishthantam asinam uta vrajantam shayanam ukshantam
    adantam annam | svabhavam anyat kim api ihamanam atmanam atmasthamatih na veda || || yadi sma pashyati
    asat indriya atha nana anumanena viruddham anyat | na manyate vastutaya manishi svapnam yatha utthaya
    tirodadhanam || || purvam grihitam gunakarmacitram ajnanam atmani aviviktam anga | nivartate tat punah
    ikshaya eva na grihyate na api visrijya atma || || yatha hi bhanoh udayah nricakshusham tamah nihanyat
    na tu sadvidhatte | evam samiksha nipuna sati me hanyat tamisram purushasya buddheh || || eshah svayanjyotih
    ajah aprameyah mahanubhutih sakalanubhutih | ekah advitiyah vacasam virame yena ishita vak asavah
    caranti || || etavan atmasammohah yat vikalpah tu kevale | atman nrite svamatmanam avalambah na yasya
    hi || || yat nama akritibhih grahyam pancavarnam abadhitam | vyarthena api arthavadah ayam dvayam
    panditamaninam || || yoginah apakvayogasya yunjatah kayah utthitaih | upasargaih vihanyeta tatra ayam
    vihitah vidhih || || yogadharanaya kamshcit asanaih dharana anvitaih | tapomantraushadhaih kamshcit
    upasargan vinirdahet || || kamshcit mama anudhyanena namasankirtana adibhih | yogeshvara anuvrittya
    va hanyat ashubhadan shanaih || || kecit deham imam dhirah sukalpam vayasi sthiram | vidhaya vividha
    upayaih atha yunjanti siddhaye || || na hi tat kushalat drityam tat ayasah hi aparthakah | antavattvat
    sharirasya phalasya iva vanaspateh || || yogam nishevatah nityam kayah cet kalpatam iyat | tat shraddadhyat
    na matiman yogam utsrijya matparah || || yogacaryam imam yogi vicaran mat vyapashrayah | na antarayaih
    vihanyeta nihsprihah svasukhanubhuh || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    bhagavaduddhavasamvade paramarthanirnayo nama ashtavimsho'dhyayah || || atha ekonatrimshah adhyayah
    | sudustaram imam manye yogacaryam anatmanah | yatha anjasa puman sihyet tat me bruhi anjasa acyuta
    || || prayashah pundarikaksha yunjantah yoginah manah | vishidanti asamadhanat manonigrahakarshitah
    || || atha atah anandadugham padambujam hamsah shrayeran aravindalocana | sukham nu vishveshvara yogakarmabhih
    tvat mayaya ami vihatah na maninah || || kim citram acyuta tava etat asheshabandhah daseshu ananyasharaneshu
    yat atma sattvam | yah arocayatsaha mrigaih svayam ishvaranam shrimat kirita tata pidita pada pithah
    || || tam tva akhila atmadayita ishvaram ashritanam sarva arthadam svakritavit visrijeta kah nu |
    kah va bhajet kim api vismritaye anu bhutyai kim va bhavet na tava padarajojusham nah || || na eva
    upayanti apacitim kavayah tava isha brahmayusha api kritam ridhamudah smarantah | yah antarbahih tanubhritam
    ashubham vidhunvan acaryacaityavapusha svagatam vyanakti || || shrishukah uvaca | iti uddhavena ati
    anurakta cetasa prishtah jagatkridanakah svashaktibhih | grihita murtitrayah ishvara ishvarah jagada
    saprema manoharasmitah || || shribhagavan uvaca | hanta te kathayishyami mama dharman sumangalam |
    yan shraddhaya acaran martyah mrityum jayati durjayam || || kuryat sarvani karmani madartham shanakaih
    smaran | mayi arpita manah cittah mat dharma atmamanoratih || || deshan punyan ashrayeta madbhaktaih
    sadhubhih shritan | deva asura manushyeshu madbhakta acaritani ca || || prithak satrena va mahyam
    parvayatra mahotsavan | karayet gitanritya adyaih maharaja vibhutibhih || || mam eva sarvabhuteshu
    bahih antah apavritam | iksheta atmani ca atmanam yatha kham amala ashayah || || iti sarvani bhutani
    madbhavena mahadyute | sabhajayan manyamanah jnanam kevalam ashritah || || brahmane pulkase stene
    brahmanye arke sphulingake | akrure krurake ca eva samadrik panditah matah || || nareshu abhikshnam
    madbhavam pumsah bhavayatah acirat | spardha asuya tiraskarah sahankarah viyanti hi || || visrijya
    smayamanan svan drisham vridam ca daihikim | pranamet dandavat bhumau ashva candala go kharam || ||
    yavat sarveshu bhuteshu madbhavah na upajayate | tavat evam upasita van mana kaya vrittibhih || ||
    sarvam brahmatmakam tasya vidyaya atma manishaya | paripashyan uparamet sarvatah mukta samshayah ||
    || ayam hi sarvakalpanam sadhricinah matah mama | madbhavah sarvabhuteshu manovakkayavrittibhih ||
    || na hi anga upakrame dhvamsah maddharmasya uddhava anu api | maya vyavasitah samyak nirgunatvat
    anashishah || || yah yah mayi pare dharmah kalpyate nishphalaya cet | tat ayasah nirarthah syat bhayadeh
    iva sattma || || esha buddhimatam buddhih manisha ca manishinam | yat satyam anritena iha martyena
    apnoti ma amritam || || esha te abhihitah kritsnah brahmavadasya sangrahah | samasavyasavidhina devanam
    api durgamah || || abhikshnashah te gaditam jnanam vispashtayuktimat | etat vijnaya mucyeta purushah
    nashtasamshayah || || suviviktam tava prashnam maya etat api dharayet | sanatanam brahmaguhyam param
    brahma adhigacchati || || yah etat mama bhakteshu sampradadyat supushkalam | tasya aham brahmadayasya
    dadami atmanam atmana || || yah etat samadhiyita pavitram paramam shuci | sah puyeta ahah ahah mam
    jnanadipena darshayan || || yah etat shraddhaya nityam avyagrah shrunuyat narah | mayi bhaktim param
    kurvan karmabhih na sah badhyate || || api uddhava tvaya brahma sakhe samavadharitam | api te vigatah
    mohah shokah ca asau manobhavah || || na etat tvaya dambhikaya nastikaya shathaya ca | ashushrushoh
    abhaktaya durvinitaya diyatam || || etaih doshaih vihinaya brahmanyaya priyaya ca | sadhave shucaye
    bruyat bhaktih syat shudra yoshitam || || na etat vijnaya jijnasoh jnatavyam avashishyate | pitva
    piyusham amritam patavyam na avashishyate || || jnane karmani yoge ca vartayam dandadharane | yavan
    arthah nrinam tata tavan te aham caturvidhah || || martyah yada tyakta samastakarma niveditatma vicikirshitah
    me | tada amritatvam pratipadyamanah maya atmabhuyaya ca kalpate vai || || shrishukah uvaca | sah
    evam adarshita yogamargah tada uttama shlokavacah nishamya | baddha anjalih priti uparuddha kanthah
    na kincit uceh ashru paripluta akshah || || vishtabhya cittam pranaya avaghurnam dhairyena rajan bahu
    manyamanah | kritanjalih praha yadupraviram shirshna sprishan tat carana aravindam || || uddhavah
    uvaca | vidravitah moha maha andhakarah yah ashritah me tava sannidhanat | vibhavasoh kim nu samipagasya
    shitam tamah bhih prabhavanti aja adya || || pratyarpitah me bhavata anukampina bhrityaya vijnanamayah
    pradipah | hitva kritajnah tava padamulam kah anyat samiyat sharanam tvadiyam || || vriknah ca me
    sudridhah snehapashah dasharha vrishni andhaka satvateshu | prasaritah srishtivivriddhaye tvaya svamayaya
    hi atma subodha hetina || || namah astu te mahayogin prapannam anushadhi mam | yatha tvat carana ambhoje
    ratih syat anapayini || || shribhagavan uvaca | gaccha uddhava maya adishtah badari akhyam mama ashramam
    | tatra mat pada tirthode snana upasparshanaih shucih || || ikshaya alakanandaya vidhuta ashesha kalmashah
    | vasanah valkalani anga vanyabhuk sukha nihsprihah || || titikshauh dvandvamatranam sushilah samyatendriyah
    | shantah samahitadhiya jnanavijnanasamyutah || || mattah anushikshitam yat te viviktamanubhavayan
    | mayi aveshita vak cittah maddharma niratah bhava | ativrajya gatih tisrah mam eshyasi tatah param
    || || shrishukah uvaca | sah evam uktah harimedhasa uddhavah pradakshinam tam parisritya padayoh |
    shirah nidhaya ashrukalabhih ardradhih nyashincat advandvaparah api upakrame || || sudustyaja sneha
    viyoga katarah na shaknuvan tam parihatum aturah | kricchram yayau murdhani bhartripaduke bibhran
    namaskritya yayau punah punah || || tatah tam antarhridi sanniveshya gatah mahabhagavatah vishalam
    | yatha upadishtam jagat ekabandhuna tatah samasthaya hareh agat gatim || || yah eatat ananda samudra
    sambhritam jnanamritam bhagavataya bhashitam | krishnena yogeshvara sevitanghrina sacchraddhaya asevya
    jagat vimucyate || || bhavabhaya apahantum jnanavijnanasaram nigamakrit upajahe bhringavat vedasaram
    | amritam udadhitah ca apayayat bhrityavargan purusham rishabham adyam krishnasanjnam natah asmi ||
    || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe bhagavaduddhavasamvade
    paramarthapraptisugamopayakathanoddhavabadarikashramapravesho nama ekonatrimsho'dhyayah || || atha
    trimshah adhyayah | raja uvaca | tatah mahabhagavate uddhave nirgate vanam | dvaravatyam kim akarot
    bhagavan bhutabhavanah || || brahmashapa upasamsrishte svakule yadavarshabhah | preyasim sarvanetranam
    tanum sah katham atyajat || || pratyakrashtum nayanam abala yatra lagnam na shekuh karnavishtam na
    sarati tatah yat satam atmalagnam | yat shrih vacam janayati ratim kim nu manam kavinam drishtva jishnoh
    yudhi rathagatam yat ca tat samyam iyuh || || rishih uvaca | divi bhuvi antarikshe ca mahotpatan samutthitan
    | drishtva asinan sudharmayam krishnah praha yadun idam || || shribhagavan uvaca | ete ghorah mahotpatah
    dvarvatyam yamaketavah | muhurtam api na stheyam atra nah yadupungavah || || striyah balah ca vriddhah
    ca shankhoddharam vrajantvitah | vayam prabhasam yasyamah yatra pratyak sarasvati || || tatra abhishicya
    shucaya uposhya susamahitah | devatah pujayishyamah snapana alepana arhanaih || || brahmanan tu mahabhagan
    kritasvastyayana vayam | go bhu hiranya vasobhih gaja ashvaratha veshmabhih || || vidhih eshah hi
    arishtaghnah mangala ayanam uttamam | deva dvija gavam puja bhuteshu paramah bhavah || || iti sarve
    samakarnya yaduvriddhah madhudvishah | tatha iti naubhih uttirya prabhasam prayayu rathaih || || tasmin
    bhagavata adishtam yadudevena yadava | cakruh parabhaya bhaktya sarvashreya upabrimhitam || || tatah
    tasmin mahapanam papuh maireyakam madhu | dishta vibhramshita dhiyah yat dravaih bhrashyate matih
    || || mahapana abhimattanam viranam driptacetasam | krishnamaya vimudhanam sangharshah sumahan abhut
    || || yuyudhuh krodhasamrabdha velayam atatayinah | dhanubhih asibhih mallaih gadabhih tam ararshtibhih
    || || patatpatakai rathakunjaradibhih khara ushtra gobhih mahishaih naraih api | mithah sametya ashvataraih
    sudurmada nyahan sharardadbhih iva dvipa vane || || pradyumna sambau yudhi rudhamatsarau akrura bhojau
    aniruddha satyaki | subhadra sangramajitau sudarunau gadau sumitra surathau samiyatuh || || anye ca
    ye vai nishatha ulmuka adayah sahasrajit shatajit bhanu mukhyah | anyonyam asadya madandhakarita jaghnuh
    mukundena vimohita bhrisham || || dasharha vrishni andhaka bhoja satvata madhu arbuda mathurashurasenah
    | visarjanah kukurah kuntayah ca mithah tatah te atha visrijya sauhridam || || putrah ayudhyan pitribhih
    bhratribhih ca svastriya dauhitra pitrivyamatulaih | mitrani mitraih suhridah suhridbhih jnatimstvahan
    jnatayah eva mudhah || || shareshu kshiyamaneshu bhajyamaneshu dhanvasu | shastreshu kshiyamaneshu
    mushtibhih jahruh erakah || || tah vajrakalpah hi abhavan parighah mushtinah bhritah | jaghnuh dvishah
    taih krishnena varyamanah tu tam ca te || || pratyanikam manyamanah balabhadram ca mohitah | hantum
    kritadhiyah rajan apannah atatayinah || || atha tau api sankruddhau udyamya kurunandana | eraka mushti
    parighau jarantau jaghnatuh yudhi || || brahmashapa upasrishtanam krishnamayavrita atmanam | spardhakrodhah
    kshayam ninye vainavah agnih yatha vanam || || evam nashteshu sarveshu kuleshu sveshu keshavah | avataritah
    bhuvah bharah iti mene avasheshitah || || ramah samudravelayam yogam asthaya paurusham | tat tyaja
    lokam manushyam samyojya atmanam atmani || || ramaniryanam alokya bhagavan devakisutah | nishasada
    dharopasthe tushnim asadya pippalam || || bibhrat caturbhujam rupam bhrajishnu prabhaya svaya | dishah
    vitimarah kurvan vidhumah iva pavakah || || shrivatsankam ghanashyamam tapta hataka varcasam | kausheya
    ambara yugmena parivitam sumangalam || || sundara smita vaktra abjam nila kuntala manditam | pundarika
    abhiramaksham sphuran makara kundalam || || katisutra brahmasutra kirita kataka angadaih | hara nupura
    mudrabhih kaustubhena virajitam || || vanamala paritangam murtimadbhih nija ayudhaih | kritva urau
    dakshine padam asinam pankaja arunam || || musalau asheshayah khandakriteshuh lubdhakah jarah | mrigasya
    akaram tat caranam vivyadha mrigashankaya || || caturbhujam tam purusham drishtva sah krita kilbishah
    | bhitah papata shirasa padayoh asuradvishah || || ajanata kritam idam papena madhusudana | kshantum
    arhasi papasya uttamashlokah me anagha || || yasya anusmaranam nrinam ajnana dhvanta nashanam | vadanti
    tasya te vishno maya asadhu kritam prabho || || tat ma ashu jahi vaikuntha papmanam mriga lubdhakam
    | yatha punah aham tu evam na kuryam sat atikramam || || yasya atma yoga racitam na viduh virincah
    rudra adayah asya tanayah patayah giram ye | tvat mayaya pihita drishtayah etat anjah kim tasya te
    vayam asat gatayah grinimah || || shribhagavan uvaca | ma bhaih jare tvam uttishtha kamah eshah kritah
    hi me | yahi tvam mat anujnatah svargam sukritinam padam || || iti adishtah bhagavata krishnena iccha
    sharirina | trih parikramya tam natva vimanena divam yayau || || darukah krishnapadavim anvicchan
    adhigamyatam | vayum tulasikamodam aghraya abhimukham yayau || || tam tatra tigmadyubhih ayudhaih
    vritam hi ashvatthamule kritaketanam patim | snehaplutatma nipapata padayo rathat avaplutya sabashpalocanah
    || || apashyatah tvat carana ambujam prabho drishtih pranashta tamasi pravishta | dishah na jane na
    labhe ca shantim yatha nishayam udupe pranashte || || iti bruvate sute vai rathah garudalanchanah
    | kham utpapata rajendra sashvadhvajah udikshatah || || tam anvagacchan divyani vishnupraharanani
    ca | tena ati vismita atmanam sutam aha janardanah || || gaccha dvaravatim suta jnatinam nidhanam
    mithah | sankarshanasya niryanam bandhubhyah bruhi mat dasham || || dvarakayam ca na stheyam bhavadbhih
    ca svabandhubhih | maya tyaktam yadupurim samudrah plavayishyati || || svam svam parigraham sarve
    adaya pitarau ca nah | arjunena avitah sarva indraprastham gamishyatha || || tvam tu mat dharmam asthaya
    jnananishthah upekshakah | manmaya racanam etam vijnaya upashamam vraja || || iti uktah tam parikramya
    namaskritya punah punah | tat padau shirshni upadhaya durmanah prayayau purim || || iti shrimadbhagavate
    mahapurane paramahamsyam samhitayamekadashaskandhe yadukulasankshayo nama trimsho'dhyayah || || atha
    ekatrimshah adhyayah | shrishukah uvaca | atha tatra agamat brahma bhavanya ca samam bhavah | mahendrapramukhah
    devah munayah saprajeshvarah || || pitarah siddhagandharvah vidyadhara mahoragah | caranah yaksharakshamsi
    kinnara apsarasah dvijah || || drashtukamah bhagavatah nirvanam parama utsukah | gayantah ca grinantah
    ca shaureh karmani janma ca || || vavarshuh pushpavarshani vimana avalibhih nabhah | kurvantah sankulam
    rajan bhaktya paramaya yutah || || bhagavan pitamaham vikshya vibhutih atmanah vibhuh | samyojya atmani
    ca atmanam padmanetre nyamilayat || || lokabhiramam svatanum dharana dhyana mangalam | yogadharanaya
    agneyya adagdhva dhama avishat svakam || || divi dundubhayah neduh petuh sumanah ca khat | satyam
    dharmah dhritih bhumeh kirtih shrih ca anu tam vayuh || || deva adayah brahmamukhyah na vishantam
    svadhamani | avijnatagatim krishnam dadrishuh ca ativismitah || || saudamanyah yatha akashe yantyah
    hitva abhramandalam | gatih na lakshyate martyaih tatha krishnasya daivataih || || brahma rudra adayah
    te tu drishtva yogagatim hareh | vismitah tam prashamsantah svam svam lokam yayuh tada || || rajan
    parasya tanubhrit jananapyayeha mayavidambanam avehi yatha natasya | srishtva atmana idam anuvishya
    vihritya ca ante samhritya ca atma mahina uparatah sah aste || || martyena yah gurusutam yamalokanitam
    tvam ca anayat sharanadah parama astra dagdham | jigye antaka antakam api isham asau avanishah kim
    svavane svaranayan mrigayum sadeham || || tatha api ashesha sthiti sambhava api ayeshu ananya hetuh
    yat ashesha shaktidhrik | na icchat pranetum vapuh atra sheshitam martyena kim svasthagatim pradarshayan
    || || yah etam pratah utthaya krishnasya padavim param | prayatah kirtayet bhaktya tam eva apnoti
    anuttamam || || darukah dvarakam etya vasudeva ugrasenayoh | patitva caranavasraih nyashincat krishnavicyutah
    || || kathayamasa nidhanam vrishninam kritsnashah nripa | tat shrutva udvigna hridayah janah shoka
    vimurcchitah || || tatra sma tvarita jagmuh krishna vishlesha vihvalah | vyasavah sherate yatra jnatayah
    ghnantah ananam || || devaki rohini ca eva vasudevah tatha sutau | krishna rama avapashyantah shoka
    artah vijahuh smritim || || pranan ca vijahuh tatra bhagavat viraha aturah | upaguhya patin tata citam
    aruruhuh striyah || || ramapatnyah ca tat deham upaguhya agnim avishan | vasudevapatnyah tat gatram
    pradyumna adin hareh snushah | krishnapatnyah avishan agnim rukmini adyah tadatmikah || || arjunah
    preyasah sakhyuh krishnasya viraha aturah | atmanam santvayamasa krishnagitaih saduktibhih || || bandhunam
    nashtagotranam arjunah samparayikam | hatanam karayamasa yathavat anupurvashah || || dvarakam harina
    tyakta samudrah aplavayat kshanat | varjayitva maharaja shrimat bhagavat alayam || || nityam sannihitah
    tatra bhagavan madhusudanah | smritya ashesha ashubhaharam sarva mangalam amangalam || || stri bala
    vriddhan adaya hatasheshan dhananjayah | indraprastham samaveshya vajra tatra abhyashecayat || ||
    shrutva suhrit vadham rajan arjunat te pitamahah | tvam tu vamshadharam kritva jagmuh sarve mahapatham
    || || yah etat devadevasya vishnoh karmani janma ca | kirtayet shraddhaya martyah sarvapapaih pramucyate
    || || ittham hareh bhagavatah rucira avatara viryani balacaritani ca shantamani | anyatra ca iha ca
    shrutani grinan manushyah bhaktim param paramahamsagatau labheta || || iti shrimadbhagavate mahapurane
    paramahamsyam samhitayamekadashaskandhe mausalopakhyanam nama ekatrimsho'dhyayah || || || iti uddhavagita
    nama ekadashaskandhah samaptah ||
  devanagari: अथ एकादशोऽध्यायः । श्रीभगवान् उवाच । बद्धः मुक्तः इति व्याख्या गुणतः मे न वस्तुतः । गुणस्य
    मायामूलत्वात् न मे मोक्षः न बन्धनम् ॥ ॥ शोकमोहौ सुखं दुःखं देहापत्तिः च मायया । स्वप्नः यथा आत्मनः
    ख्यातिः संसृतिः न तु वास्तवी ॥ ॥ विद्या अविद्ये मम तनू विद्धि उद्धव शरीरिणाम् । मोक्षबन्धकरी आद्ये
    मायया मे विनिर्मिते ॥ ॥ एकस्य एव मम अंशस्य जीवस्य एव महामते । बन्धः अस्य अविद्यया अनादिः विद्यया च
    तथा इतरः ॥ ॥ अथ बद्धस्य मुक्तस्य वैलक्षण्यं वदामि ते । विरुद्धधर्मिणोः तात स्थितयोः एकधर्मिणि ॥ ॥
    सुपर्णौ एतौ सदृशौ सखायौ यदृच्छया एतौ कृतनीडौ च वृक्षे । एकः तयोः खादति पिप्पलान्नम् अन्यः निरन्नः
    अपि बलेन भूयान् ॥ ॥ आत्मानं अन्यं च सः वेद विद्वान् अपिप्पलादः न तु पिप्पलादः । यः अविद्यया युक् स
    तु नित्यबद्धः विद्यामयः यः स तु नित्यमुक्तः ॥ ॥ देहस्थः अपि न देहस्थः विद्वान् स्वप्नात् यथा उत्थितः
    । अदेहस्थः अपि देहस्थः कुमतिः स्वप्नदृक् यथा ॥ ॥ इन्द्रियैः इन्द्रियार्थेषु गुणैः अपि गुणेषु च । गृह्यमाणेषु
    अहङ्कुर्यात् न विद्वान् यः तु अविक्रियः ॥ ॥ दैवाधीने शरीरे अस्मिन् गुणभाव्येन कर्मणा । वर्तमानः अबुधः
    तत्र कर्ता अस्मि इति निबध्यते ॥ ॥ एवं विरक्तः शयनः आसनाटनमज्जने । दर्शनस्पर्शनघ्राणभोजनश्रवणादिषु
    ॥ ॥ न तथा बध्यते विद्वान् तत्र तत्र आदयन् गुणान् । प्रकृतिस्थः अपि असंसक्तः यथा खं सविता अनिलः ॥ ॥
    वैशारद्येक्षया असङ्गशितया छिन्नसंशयः । प्रतिबुद्धः इव स्वप्नात् नानात्वात् विनिवर्तते ॥ ॥ यस्य स्युः
    वीतसङ्कल्पाः प्राणेन्द्रियमनोधियाम् । वृत्तयः सः विनिर्मुक्तः देहस्थः अपि हि तत् गुणैः ॥ ॥ यस्य आत्मा
    हिंस्यते हिंस्र्यैः येन किञ्चित् यदृच्छया । अर्च्यते वा क्वचित् तत्र न व्यतिक्रियते बुधः ॥ ॥ न स्तुवीत
    न निन्देत कुर्वतः साधु असाधु वा । वदतः गुणदोषाभ्यां वर्जितः समदृक् मुनिः ॥ ॥ न कुर्यात् न वदेत् किञ्चित्
    न ध्यायेत् साधु असाधु वा । आत्मारामः अनया वृत्त्या विचरेत् जडवत् मुनिः ॥ ॥ शब्दब्रह्मणि निष्णातः न
    निष्णायात् परे यदि । श्रमः तस्य श्रमफलः हि अधेनुं इव रक्षतः ॥ ॥ गां दुग्धदोहां असतीं च भार्याम् देहं
    पराधीनं असत्प्रजां च । वित्तं तु अतीर्थीकृतं अङ्ग वाचम् हीनां मया रक्षति दुःखदुःखी ॥ ॥ यस्यां न मे
    पावनं अङ्ग कर्म स्थितिउद्भवप्राण निरोधनं अस्य । लीलावतारीप्सितजन्म वा स्यात् बन्ध्यां गिरं तां बिभृयात्
    न धीरः ॥ ॥ एवं जिज्ञासया अपोह्य नानात्वभ्रमं आत्मनि । उपारमेत विरजं मनः मयि अर्प्य सर्वगे ॥ ॥ यदि
    अनीशः धारयितुं मनः ब्रह्मणि निश्चलम् । मयि सर्वाणि कर्माणि निरपेक्षः समाचर ॥ ॥ श्रद्धालुः मे कथाः
    श ऋण्वन् सुभद्रा लोकपावनीः । गायन् अनुस्मरन् कर्म जन्म च अभिनयन् मुहुः ॥ ॥ मदर्थे धर्मकामार्थान् आचरन्
    मदपाश्रयः । लभते निश्चलां भक्तिं मयि उद्धव सनातने ॥ ॥ सत्सङ्गलब्धया भक्त्या मयि मां सः उपासिता । सः
    वै मे दर्शितं सद्भिः अञ्जसा विन्दते पदम् ॥ ॥ उद्धव उवाच । साधुः तव उत्तमश्लोक मतः कीदृग्विधः प्रभो
    । भक्तिः त्वयि उपयुज्येत कीदृशी सद्भिः आदृता ॥ ॥ एतत् मे पुरुषाध्यक्ष लोकाध्यक्ष जगत् प्रभो । प्रणताय
    अनुरक्ताय प्रपन्नाय च कथ्यताम् ॥ ॥ त्वं ब्रह्म परमं व्योम पुरुषः प्रकृतेः परः । अवतीर्णः असि भगवन्
    स्वेच्छाउपात्तपृथक् वपुः ॥ ॥ श्रीभगवान् उवाच । कृपालुः अकृतद्रोहः तितिक्षुः सर्वदेहिनाम् । सत्यसारः
    अनवद्यात्मा समः सर्वोपकारकः ॥ ॥ कामैः अहतधीः दान्तः मृदुः शुचिः अकिञ्चनः । अनीहः मितभुक् शान्तः स्थिरः
    मत् शरणः मुनिः ॥ ॥ अप्रमत्तः गभीरात्मा धृतिमाञ्जितषड्गुणः । अमानी मानदः कल्पः मैत्रः कारुणिकः कविः
    ॥ ॥ आज्ञाय एवं गुणान् दोषान्मयादिष्टान् अपि स्वकान् । धर्मान् सन्त्यज्य यः सर्वान् मां भजेत सः सत्तमः
    ॥ ॥ ज्ञात्वा अज्ञात्वा अथ ये वै मां यावान् यः च अस्मि यादृशः । भजन्ति अनन्यभावेन ते मे भक्ततमाः मताः
    ॥ ॥ मल्लिङ्गमद्भक्तजनदर्शनस्पर्शनार्चनम् । परिचर्या स्तुतिः प्रह्वगुणकर्म अनुकीर्तनम् ॥ ॥ मत्कथाश्रवणे
    श्रद्धा मत् अनुध्यानं उद्धव । सर्वलाभ उपहरणं दास्येन आत्मनिवेदनम् ॥ ॥ मज्जन्मकर्मकथनं मम पर्वानुमोदनम्
    । गीतताण्डववादित्रगोष्ठीभिः मद्गृह उत्सवः ॥ ॥ यात्रा बलिविधानं च सर्ववार्षिकपर्वसु । वैदिकी तान्त्रिकी
    दीक्षा मदीयव्रतधारणम् ॥ ॥ मम अर्चास्थापने श्रद्धा स्वतः संहत्य च उद्यमः । उद्यान उपवनाक्रीडपुरमन्दिरकर्मणि
    ॥ ॥ सम्मार्जन उपलेपाभ्यां सेकमण्डलवर्तनैः । गृहशुश्रूषणं मह्यं दासवद्यदमायया ॥ ॥ अमानित्वं अदम्भित्वं
    कृतस्य अपरिकीर्तनम् । अपि दीपावलोकं मे न उपयुञ्ज्यात् निवेदितम् ॥ ॥ यत् यत् इष्टतमं लोके यत् च अतिप्रियं
    आत्मनः । तत् तत् निवेदयेत् मह्यं तत् आनन्त्याय कल्पते ॥ ॥ सूर्यः अग्निः ब्राह्मणः गावः वैष्णवः खं
    मरुत् जलम् । भूः आत्मा सर्वभूतानि भद्र पूजापदानि मे ॥ ॥ सूर्ये तु विद्यया त्रय्या हविषाग्नौ यजेत माम्
    । आतिथ्येन तु विप्राग्र्यः गोष्वङ्ग यवसादिना ॥ ॥ वैष्णवे बन्धुसत्कृत्या हृदि खे ध्याननिष्ठया । वायौ
    मुख्यधिया तोये द्रव्यैः तोयपुरस्कृतैः ॥ ॥ स्थण्डिले मन्त्रहृदयैः भोगैः आत्मानं आत्मनि । क्षेत्रज्ञं
    सर्वभूतेषु समत्वेन यजेत माम् ॥ ॥ धिष्ण्येषु एषु इति मद्रूपं शङ्खचक्रगदाम्बुजैः । युक्तं चतुर्भुजं
    शान्तं ध्यायन् अर्चेत् समाहितः ॥ ॥ इष्टापूर्तेन मां एवं यः यजेत समाहितः । लभते मयि सद्भक्तिं मत्स्मृतिः
    साधुसेवया ॥ ॥ प्रायेण भक्तियोगेन सत्सङ्गेन विना उद्धव । न उपायः विद्यते सध्र्यङ् प्रायणं हि सतां अहम्
    ॥ ॥ अथ एतत् परमं गुह्यं श्रुण्वतः यदुनन्दन । सुगोप्यं अपि वक्ष्यामि त्वं मे भृत्यः सुहृत् सखा ॥ ॥
    इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे एकादशपूजाविधानयोगो
    नाम एकादशोऽध्यायः ॥ ॥ अथ द्वादशोऽध्यायः । श्रीभगवान् उवाच । न रोधयति मां योगः न स्साङ्ख्यं धर्मः एव
    च । न स्वाध्यायः तपः त्यागः न इष्टापूर्तं न दक्षिणा ॥ ॥ व्रतानि यज्ञः छन्दांसि तीर्थानि नियमाः यमाः
    । यथा अवरुन्धे सत्सङ्गः सर्वसङ्ग अपहः हि माम् ॥ ॥ सत्सङ्गेन हि दैतेया यातुधानः मृगाः खगाः । गन्धर्व
    अप्सरसः नागाः सिद्धाः चारणगुह्यकाः ॥ ॥ विद्याधराः मनुष्येषु वैश्याः शूद्राः स्त्रियः अन्त्यजाः । रजः
    तमः प्रकृतयः तस्मिन् तस्मिन् युगे अनघ ॥ ॥ बहवः मत्पदं प्राप्ताः त्वाष्ट्रकायाधवादयः । वृषपर्वा बलिः
    वाणः मयः च अथ विभीषणः ॥ ॥ सुग्रीवः हनुमान् ऋक्षः गजः गृध्रः वणिक्पथः । व्याधः कुब्जा व्रजे गोप्यः
    यज्ञपत्न्यः तथा अपरे ॥ ॥ ते न अधितश्रुतिगणाः न उपासितमहत्तमाः । अव्रतातप्ततपसः मत्सङ्गात् मां उपागताः
    ॥ ॥ केवलेन हि भावेन गोप्यः गावः नगाः मृगाः । ये अन्ये मूढधियः नागाः सिद्धाः मां ईयुः अञ्जसा ॥ ॥ यं
    न योगेन साङ्ख्येन दानव्रततपः अध्वरैः । व्याख्याः स्वाध्यायसन्न्यासैः प्राप्नुयात् यत्नवान् अपि ॥ ॥
    रामेण सार्धं मथुरां प्रणीते श्वाफल्किना मयि अनुरक्तचित्ताः । विगाढभावेन न मे वियोग तीव्राधयः अन्यं
    ददृशुः सुखाय ॥ ॥ ताः ताः क्षपाः प्रेष्ठतमेन नीताः मया एव वृन्दावनगोचरेण । क्षणार्धवत् ताः पुनरङ्ग
    तासां हीना माया कल्पसमा बभूवुः ॥ ॥ ताः न अविदन् मयि अनुषङ्गबद्ध धियः स्वमात्मानं अदः तथा इदम् । यथा
    समाधौ मुनयः अब्धितोये नद्यः प्रविष्टाः इव नामरूपे ॥ ॥ मत्कामा रमणं जारं अस्वरूपविदः अबलाः । ब्रह्म
    मां परमं प्रापुः सङ्गात् शतसहस्रशः ॥ ॥ तस्मात् त्वं उद्धव उत्सृज्य चोदनां प्रतिचोदनाम् । प्रवृत्तं
    च निवृत्तं च श्रोतव्यं श्रुतं एव च ॥ ॥ मां एकं एव शरणं आत्मानं सर्वदेहिनाम् । याहि सर्वात्मभावेन मया
    स्याः हि अकुतोभयः ॥ ॥ उद्धवः उवाच । संशयः श्रुण्वतः वाचं तव योगेश्वर ईश्वर । न निवर्ततः आत्मस्थः येन
    भ्राम्यति मे मनः ॥ ॥ श्रीभगवान् उवाच । सः एष जीवः विवरप्रसूतिः प्राणेन घोषेण गुहां प्रविष्टः । मनोमयं
    सूक्ष्मं उपेत्य रूपं मात्रा स्वरः वर्णः इति स्थविष्ठः ॥ ॥ यथा अनलः खे अनिलबन्धुः ऊष्मा बलेन दारुण्यधिमथ्यमानः
    । अणुः प्रजातः हविषा समिध्यते तथा एव मे व्यक्तिः इयं हि वाणी ॥ ॥ एवं गदिः कर्मगतिः विसर्गः घ्राणः
    रसः दृक् स्पर्शः श्रुतिः च । सङ्कल्पविज्ञानं अथ अभिमानः सूत्रं रजः सत्त्वतमोविकारः ॥ ॥ अयं हि जीवः
    त्रिवृत् अब्जयोनिः अव्यक्तः एकः वयसा सः आद्यः । विश्लिष्टशक्तिः बहुधा एव भाति बीजानि योनिं प्रतिपद्य
    यद्वत् ॥ ॥ यस्मिन् इदं प्रोतं अशेषं ओतं पटः यथा तन्तुवितानसंस्थः । यः एष संसारतरुः पुराणः कर्मात्मकः
    पुष्पफले प्रसूते ॥ ॥ द्वे अस्य बीजे शतमूलः त्रिनालः पञ्चस्कन्धः पञ्चरसप्रसूतिः । दश एकशाखः द्विसुपर्णनीडः
    त्रिवल्कलः द्विफलः अर्कं प्रविष्टः ॥ ॥ अदन्ति च एकं फलं अस्य गृध्रा ग्रामेचराः एकं अरण्यवासाः । हंसाः
    यः एकं बहुरूपं इज्यैः मायामयं वेद सः वेद वेदम् ॥ ॥ एवं गुरु उपासनया एकभक्त्या विद्याकुठारेण शितेन
    धीरः । विवृश्च्य जीवाशयं अप्रमत्तः सम्पद्य च आत्मानं अथ त्यज अस्त्रम् ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे द्वादशोऽध्यायः ॥ ॥ अथ त्रयोदशोऽध्यायः । श्रीभगवान्
    उवाच । सत्त्वं रजः तमः इति गुणाः बुद्धेः न च आत्मनः । सत्त्वेन अन्यतमौ हन्यात् सत्त्वं सत्त्वेन च
    एव हि ॥ ॥ सत्त्वात् धर्मः भवेत् वृद्धात् पुंसः मद्भक्तिलक्षणः । सात्विक उपासया सत्त्वं ततः धर्मः प्रवर्तते
    ॥ ॥ धर्मः रजः तमः हन्यात् सत्त्ववृद्धिः अनुत्तमः । आशु नश्यति तत् मूलः हि अधर्मः उभये हते ॥ ॥ आगमः
    अपः प्रजा देशः कालः कर्म च जन्म च । ध्यानं मन्त्रः अथ संस्कारः दश एते गुणहेतवः ॥ ॥ तत् तत् सात्विकं
    एव एषां यत् यत् वृद्धाः प्रचक्षते । निन्दन्ति तामसं तत् तत् राजसं तत् उपेक्षितम् ॥ ॥ सात्त्विकानि
    एव सेवेत पुमान् सत्त्वविवृद्धये । ततः धर्मः ततः ज्ञानं यावत् स्मृतिः अपोहनम् ॥ ॥ वेणुसङ्घर्षजः वह्निः
    दग्ध्वा शाम्यति तत् वनम् । एवं गुणव्यत्ययजः देहः शाम्यति तत् क्रियः ॥ ॥ उद्धवः उवाच । विदन्ति मर्त्याः
    प्रायेण विषयान् पदं आपदाम् । तथा अपि भुञ्जते कृष्ण तत् कथं श्व खर अजावत् ॥ ॥ श्रीभगवान् उवाच । अहं
    इति अन्यथाबुद्धिः प्रमत्तस्य यथा हृदि । उत्सर्पति रजः घोरं ततः वैकारिकं मनः ॥ ॥ रजोयुक्तस्य मनसः सङ्कल्पः
    सविकल्पकः । ततः कामः गुणध्यानात् दुःसहः स्यात् हि दुर्मतेः ॥ ॥ करोति कामवशगः कर्माणि अविजितेन्द्रियः
    । दुःखोदर्काणि सम्पश्यन् रजोवेगविमोहितः ॥ । रजः तमोभ्यां यत् अपि विद्वान् विक्षिप्तधीः पुनः । अतन्द्रितः
    मनः युञ्जन् दोषदृष्टिः न सज्जते ॥ ॥ अप्रमत्तः अनुयुञ्जीतः मनः मयि अर्पयन् शनैः । अनिर्विण्णः यथाकालं
    जितश्वासः जितासनः ॥ ॥ एतावान् योगः आदिष्टः मत् शिष्यैः सनक आदिभिः । सर्वतः मनः आकृष्य मय्यद्धा आवेश्यते
    यथा ॥ ॥ उद्धवः उवाच । यदा त्वं सनक आदिभ्यः येन रूपेण केशव । योगं आदिष्टवान् एतत् रूपं इच्छामि वेदितुम्
    ॥ ॥ श्रीभगवान् उवाच । पुत्राः हिरण्यगर्भस्य मानसाः सनक आदयः । पप्रच्छुः पितरं सूक्ष्मां योगस्य ऐकान्तिकीं
    गतिम् ॥ ॥ सनक आदयः ऊचुः । गुणेषु आविशते चेतः गुणाः चेतसि च प्रभो । कथं अन्योन्यसन्त्यागः मुमुक्षोः
    अतितितीर्षोः ॥ ॥ श्रीभगवान् उवाच । एवं पृष्टः महादेवः स्वयम्भूः भूतभावनः । ध्यायमानः प्रश्नबीजं न
    अभ्यपद्यत कर्मधीः ॥ ॥ सः मां अचिन्तयत् देवः प्रश्नपारतितीर्षया । तस्य अहं हंसरूपेण सकाशं अगमं तदा
    ॥ ॥ दृष्ट्वा मां त उपव्रज्य कृत्वा पाद अभिवन्दनम् । ब्रह्माणं अग्रतः कृत्वा पप्रच्छुः कः भवान् इति
    ॥ ॥ इति अहं मुनिभिः पृष्टः तत्त्वजिज्ञासुभिः तदा । यत् अवोचं अहं तेभ्यः तत् उद्धव निबोध मे ॥ ॥ वस्तुनः
    यदि अनानात्वं आत्मनः प्रश्नः ईदृशः । कथं घटेत वः विप्राः वक्तुः वा मे कः आश्रयः ॥ ॥ पञ्चात्मकेषु भूतेषु
    समानेषु च वस्तुतः । कः भवान् इति वः प्रश्नः वाचारम्भः हि अनर्थकः ॥ ॥ मनसा वचसा दृष्ट्या गृह्यते अन्यैः
    अपि इन्द्रियैः । अहं एव न मत्तः अन्यत् इति बुध्यध्वं अञ्जसा ॥ ॥ गुणेषु आविशते चेतः गुणाः चेतसि च प्रजाः
    । जीवस्य देहः उभयं गुणाः चेतः मत् आत्मनः ॥ ॥ गुणेषु च आविशत् चित्तं अभीक्ष्णं गुणसेवया । गुणाः च चित्तप्रभवाः
    मत् रूपः उभयं त्यजेत् ॥ ॥ जाग्रत् स्वप्नः सुषुप्तं च गुणतः बुद्धिवृत्तयः । तासां विलक्षणः जीवः साक्षित्वेन
    विनिश्चितः ॥ ॥ यः हि संसृतिबन्धः अयं आत्मनः गुणवृत्तिदः । मयि तुर्ये स्थितः जह्यात् त्यागः तत् गुणचेतसाम्
    ॥ ॥ अहङ्कारकृतं बन्धं आत्मनः अर्थविपर्ययम् । विद्वान् निर्विद्य संसारचिन्तां तुर्ये स्थितः त्यजेत्
    ॥ ॥ यावत् नानार्थधीः पुंसः न निवर्तेत युक्तिभिः । जागर्ति अपि स्वपन् अज्ञः स्वप्ने जागरणं यथा ॥ ॥
    असत्त्वात् आत्मनः अन्येषां भावानां तत् कृता भिदा । गतयः हेतवः च अस्य मृषा स्वप्नदृशः यथा ॥ ॥ यो जागरे
    बहिः अनुक्षणधर्मिणः अर्थान् भुङ्क्ते समस्तकरणैः हृदि तत् सदृक्षान् । स्वप्ने सुषुप्तः उपसंहरते सः
    एकः स्मृति अन्वयात् त्रिगुणवृत्तिदृक् इन्द्रिय ईशः ॥ ॥ एवं विमृश्य गुणतः मनसः त्र्यवस्था मत् मायया
    मयि कृता इति निश्चितार्थाः । सञ्छिद्य हार्दं अनुमानस्त् उक्तितीक्ष्ण ज्ञानासिना भजतः मा अखिलसंशयाधिम्
    ॥ ॥ ईक्षेत विभ्रमं इदं मनसः विलासम् दृष्टं विनष्टं अतिलोलं अलातचक्रम् । विज्ञानं एकं उरुधा इव विभाति
    माया स्वप्नः त्रिधा गुणविसर्गकृतः विकल्पः ॥ ॥ दृष्टिं ततः प्रतिनिवर्त्य निवृत्ततृष्णः तूष्णीं भवेत्
    निजसुख अनुभवः निरीहः । सन्दृश्यते क्व च यदि इदं अवस्तुबुद्ध्या त्यक्तं भ्रमाय न भवेत् स्मृतिः आनिपातात्
    ॥ ॥ देहं च नश्वरं अवस्थितं उत्थितं वा सिद्धः न पश्यति यतः अध्यगमत्स्वरूपम् । दैवात् अपेतं उत दैवशात्
    उपेतम् वासः यथा परिकृतं मदिरामदान्धः ॥ ॥ देहः अपि दैववशगः खलु कर्म यावत् स्वारम्भकं प्रतिसमीक्षतः
    एव सासुः । तं अप्रपञ्चं अधिरूढसमाधियोगः स्वाप्नं पुनः न भजते प्रतिबुद्धवस्तुः ॥ ॥ मया एतत् उक्तं वः
    विप्राः गुह्यं यत् साङ्ख्ययोगयोः । जानीतं आगतं यज्ञं युष्मत् धर्मविवक्षया ॥ ॥ अहं योगस्य साङ्ख्यस्य
    सत्यस्यर्तस्य तेजसः । परायणं द्विजश्रेष्ठाः श्रियः कीर्तेः दमस्य च ॥ ॥ मां भजन्ति गुणाः सर्वे निर्गुणं
    निरपेक्षकम् । सुहृदं प्रियं आत्मानं साम्य असङ्ग आदयः गुणाः ॥ ॥ इति मे छिन्नसन्देहाः मुनयः सनक आदयः
    । सभाजयित्वा परया भक्त्या अगृणत संस्तवैः ॥ ॥ तैः अहं पूजितः सम्यक् संस्तुतः परम ऋषिभिः । प्रत्येयाय
    स्वकं धाम पश्यतः परमेष्ठिनः ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे
    हंसगीतानिरूपणं नाम त्रयोदशोऽध्यायः ॥ ॥ अथ चतुर्दशोऽध्यायः । उद्धवः उवाच । वदन्ति कृष्ण श्रेयांसि बहूनि
    ब्रह्मवादिनः । तेषां विकल्पप्राधान्यं उत अहो एकमुख्यता ॥ ॥ भवत् उदाहृतः स्वामिन् भक्तियोगः अनपेक्षितः
    । निरस्य सर्वतः सङ्गं येन त्वयि आविशेत् मनः ॥ ॥ श्रीभगवान् उवाच । कालेन नष्टा प्रलये वाणीयं वेदसञ्ज्ञिता
    । मया आदौ ब्रह्मणे प्रोक्ता धर्मः यस्यां मदात्मकः ॥ ॥ तेन प्रोक्ता च पुत्राय मनवे पूर्वजाय सा । ततः
    भृगु आदयः अगृह्णन् सप्तब्रह्ममहर्षयः ॥ ॥ तेभ्यः पितृभ्यः तत् पुत्राः देवदानवगुह्यकाः । मनुष्याः सिद्धगन्धर्वाः
    सविद्याधरचारणाः ॥ ॥ किन्देवाः किन्नराः नागाः रक्षः किम्पुरुष आदयः । बह्व्यः तेषां प्रकृतयः रजःसत्त्वतमोभुवः
    ॥ ॥ याभिः भूतानि भिद्यन्ते भूतानां मतयः तथा । यथाप्रकृति सर्वेषां चित्राः वाचः स्रवन्ति हि ॥ ॥ एवं
    प्रकृतिवैचित्र्यात् भिद्यन्ते मतयः नृणाम् । पारम्पर्येण केषाञ्चित् पाखण्डमतयः अपरे ॥ ॥ मन्मायामोहितधियः
    पुरुषाः पुरुषर्षभ । श्रेयः वदन्ति अनेकान्तं यथाकर्म यथारुचि ॥ ॥ धर्मं एके यशः च अन्ये कामं सत्यं दमं
    शमम् । अन्ये वदन्ति स्वार्थं वा ऐश्वर्यं त्यागभोजनम् । केचित् यज्ञतपोदानं व्रतानि नियम अन्यमान् ॥
    ॥ आदि अन्तवन्तः एव एषां लोकाः कर्मविनिर्मिताः । दुःख उदर्काः तमोनिष्ठाः क्षुद्र आनन्दाः शुच अर्पिताः
    ॥ ॥ मयि अर्पित मनः सभ्य निरपेक्षस्य सर्वतः । मया आत्मना सुखं यत् तत् कुतः स्यात् विषय आत्मनाम् ॥ ॥
    अकिञ्चनस्य दान्तस्य शान्तस्य समचेतसः । मया सन्तुष्टमनसः सर्वाः सुखमयाः दिशः ॥ ॥ न पारमेष्ठ्यं न महेन्द्रधिष्ण्यम्
    न सार्वभौमं न रसाधिपत्यम् । न योगसिद्धीः अपुनर्भवं वा मयि अर्पित आत्मा इच्छति मत् विना अन्यत् ॥ ॥
    न तथा मे प्रियतमः आत्मयोनिः न शङ्करः । न च सङ्कर्षणः न श्रीः न एव आत्मा च यथा भवान् ॥ ॥ निरपेक्षं
    मुनिं शातं निर्वैरं समदर्शनम् । अनुव्रजामि अहं नित्यं पूयेयेति अङ्घ्रिरेणुभिः ॥ ॥ निष्किञ्चना मयि
    अनुरक्तचेतसः शान्ताः महान्तः अखिलजीववत्सलाः । कामैः अनालब्धधियः जुषन्ति यत् तत् नैरपेक्ष्यं न विदुः
    सुखं मम ॥ ॥ बाध्यमानः अपि मद्भक्तः विषयैः अजितेन्द्रियः । प्रायः प्रगल्भया भक्त्या विषयैः न अभिभूयते
    ॥ ॥ यथा अग्निः सुसमृद्ध अर्चिः करोति एधांसि भस्मसात् । तथा मद्विषया भक्तिः उद्धव एनांसि कृत्स्नशः
    ॥ ॥ न साधयति मां योगः न साङ्ख्यं धर्मः उद्धव । न स्वाध्यायः तपः त्यागः यथा भक्तिः मम ऊर्जिता ॥ ॥ भक्त्या
    अहं एकया ग्राह्यः श्रद्धया आत्मा प्रियः सताम् । भक्तिः पुनाति मन्निष्ठा श्वपाकान् अपि सम्भवात् ॥ ॥
    धर्मः सत्यदया उपेतः विद्या वा तपसान्विता । मद्भ्क्त्यापेतं आत्मानं न सम्यक् प्रपुनाति हि ॥ ॥ कथं विना
    रोमहर्षं द्रवता चेतसा विना । विनानन्द अश्रुकलया शुध्येत् भक्त्या विनाशयः ॥ ॥ वाक् गद्गदा द्रवते यस्य
    चित्तम् रुदति अभीक्ष्णं हसति क्वचित् च । विलज्जः उद्गायति नृत्यते च मद्भक्तियुक्तः भुवनं पुनाति ॥
    ॥ यथा अग्निना हेम मलं जहाति ध्मातं पुनः स्वं भजते च रूपम् । आत्मा च कर्मानुशयं विधूय मद्भक्तियोगेन
    भजति अथः माम् ॥ ॥ यथा यथा आत्मा परिमृज्यते असौ मत्पुण्यगाथाश्रवण अभिधानैः । तथा तथा पश्यति वस्तु सूक्ष्मम्
    चक्षुः यथा एव अञ्जनसम्प्रयुक्तम् ॥ ॥ विषयान् ध्यायतः चित्तं विषयेषु विषज्जते । मां अनुस्मरतः चित्तं
    मयि एव प्रविलीयते ॥ ॥ तस्मात् असत् अभिध्यानं यथा स्वप्नमनोरथम् । हित्वा मयि समाधत्स्व मनः मद्भावभावितम्
    ॥ ॥ स्त्रीणां स्त्रीसङ्गिनां सङ्गं त्यक्त्वा दूरतः आत्मवान् । क्षेमे विविक्तः आसीनः चिन्तयेत् मां
    अतन्द्रितः ॥ ॥ न तथा अस्य भवेत् क्लेशः बन्धः च अन्यप्रसङ्गतः । योषित् सङ्गात् यथा पुंसः यथा तत् सङ्गिसङ्गतः
    ॥ ॥ उद्धवः उवाच । यथा त्वां अरविन्दाक्ष यादृशं वा यदात्मकम् । ध्यायेत् मुमुक्षुः एतत् मे ध्यानं मे
    वक्तुं अर्हसि ॥ ॥ श्रीभगवान् उवाच । समः आसनः आसीनः समकायः यथासुखम् । हस्तौ उत्सङ्गः आधाय स्वनासाग्रकृत
    ईक्षणः ॥ ॥ प्राणस्य शोधयेत् मार्गं पूरकुम्भकरेचकैः । विपर्ययेण अपि शनैः अभ्यसेत् निर्जितेन्द्रियः
    ॥ ॥ हृदि अविच्छिन्नं ओङ्कारं घण्टानादं बिसोर्णवत् । प्राणेन उदीर्य तत्र अथ पुनः संवेशयेत् स्वरम् ॥
    ॥ एवं प्रणवसंयुक्तं प्राणं एव समभ्यसेत् । दशकृत्वः त्रिषवणं मासात् अर्वाक् जित अनिलः ॥ ॥ हृत्पुण्डरीकं
    अन्तस्थं ऊर्ध्वनालं अधोमुखम् । ध्यात्वा ऊर्ध्वमुखं उन्निद्रं अष्टपत्रं सकर्णिकम् ॥ ॥ कर्णिकायां न्यसेत्
    सूर्यसोमाग्नीन् उत्तरोत्तरम् । वह्निमध्ये स्मरेत् रूपं मम एतत् ध्यानमङ्गलम् ॥ ॥ समं प्रशान्तं सुमुखं
    दीर्घचारुचतुर्भुजम् । सुचारुसुन्दरग्रीवं सुकपोलं शुचिस्मितम् ॥ ॥ समान कर्ण विन्यस्त स्फुरन् मकर कुण्डलम्
    । हेम अम्बरं घनश्यामं श्रीवत्स श्रीनिकेतनम् ॥ ॥ शङ्ख चक्र गदा पद्म वनमाला विभूषितम् । नूपुरैः विलसत्
    पादं कौस्तुभ प्रभया युतम् ॥ ॥ द्युमत् किरीट कटक कटिसूत्र अङ्गद अयुतम् । सर्वाङ्ग सुन्दरं हृद्यं प्रसाद
    सुमुख ईक्षणम् ॥ ॥ सुकुमारं अभिध्यायेत् सर्वाङ्गेषु मनः दधत् । इन्द्रियाणि इन्द्रियेभ्यः मनसा आकृष्य
    तत् मनः । बुद्ध्या सारथिना धीरः प्रणयेत् मयि सर्वतः ॥ ॥ तत् सर्व व्यापकं चित्तं आकृष्य एकत्र धारयेत्
    । न अन्यानि चिन्तयेत् भूयः सुस्मितं भावयेत् मुखम् ॥ ॥ तत्र लब्धपदं चित्तं आकृष्य व्योम्नि धारयेत्
    । तत् च त्यक्त्वा मदारोहः न किञ्चित् अपि चिन्तयेत् ॥ ॥ एवं समाहितमतिः मां एव आत्मानं आत्मनि । विचष्टे
    मयि सर्वात्मत् ज्योतिः ज्योतिषि संयुतम् ॥ ॥ ध्यानेन इत्थं सुतीव्रेण युञ्जतः योगिनः मनः । संयास्यति
    आशु निर्वाणं द्रव्य ज्ञान क्रिया भ्रमः ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे
    श्रीकृष्णोद्धवसंवादे भक्तिरहस्यावधारणयोगो नाम चतुर्दशोऽध्यायः ॥ ॥ अथ पञ्चदशोऽध्यायः । श्रीभगवान् उवाच
    । जितेन्द्रियस्य युक्तस्य जितश्वासस्य योगिनः मयि धारयतः चेतः उपतिष्ठन्ति सिद्धयः ॥ ॥ उद्धवः उवाच ।
    कया धारणया कास्वित् कथंस्वित् सिद्धिः अच्युत । कति वा सिद्धयः ब्रूहि योगिनां सिद्धिदः भवान् ॥ ॥ श्रीभगवान्
    उवाच । सिद्धयः अष्टादश प्रोक्ता धारणायोगपारगैः । तासां अष्टौ मत् प्रधानाः दशः एव गुणहेतवः ॥ ॥ अणिमा
    महिमा मूर्तेः लघिमा प्राप्तिः इन्द्रियैः । प्राकाम्यं श्रुतदृष्टेषु शक्तिप्रेरणं ईशिता ॥ ॥ गुणेषु
    असङ्गः वशिता यत् कामः तत् अवस्यति । एताः मे सिद्धयः सौम्य अष्टौ उत्पत्तिकाः मताः ॥ ॥ अनूर्मिमत्त्वं
    देहे अस्मिन् दूरश्रवणदर्शनम् । मनोजवः कामरूपं परकायप्रवेशनम् ॥ ॥ स्वच्छन्दमृत्युः देवानां सहक्रीडानुदर्शनम्
    । यथासङ्कल्पसंसिद्धिः आज्ञाप्रतिहता गतिः ॥ ॥ त्रिकालज्ञत्वं अद्वन्द्वं परचित्तादि अभिज्ञता । अग्नि
    अर्क अम्बु विष आदीनां प्रतिष्टम्भः अपराजयः ॥ ॥ एताः च उद्देशतः प्रोक्ता योगधारणसिद्धयः । यया धारणया
    या स्यात् यथा वा स्यात् निबोध मे ॥ ॥ भूतसूक्ष्म आत्मनि मयि तन्मात्रं धारयेत् मनः । अणिमानं अवाप्नोति
    तन्मात्र उपासकः मम ॥ ॥ महति आत्मन् मयि परे यथासंस्थं मनः दधत् । महिमानं अवाप्नोति भूतानां च पृथक्
    पृथक् ॥ ॥ परमाणुमये चित्तं भूतानां मयि रञ्जयन् । कालसूक्ष्मात्मतां योगी लघिमानं अवाप्नुयात् ॥ ॥ धारयन्
    मयि अहन्तत्त्वे मनः वैकारिके अखिलम् । सर्वेन्द्रियाणां आत्मत्वं प्राप्तिं प्राप्नोति मन्मनाः ॥ ॥ महति
    आत्मनि यः सूत्रे धारयेत् मयि मानसम् । प्राकाम्यं पारमेष्ठ्यं मे विन्दते अव्यक्तजन्मनः ॥ ॥ विष्णौ त्र्यधि
    ईश्वरे चित्तं धारयेत् कालविग्रहे । सः ईशित्वं अवाप्नोति क्षेत्रक्षेत्रज्ञचोदनाम् ॥ ॥ नारायणे तुरीयाख्ये
    भगवत् शब्दशब्दिते । मनः मयि आदधत् योगी मत् धर्माः वहितां इयात् ॥ ॥ निर्गुणे ब्रह्मणि मयि धारयन् विशदं
    मनः । परमानन्दं आप्नोति यत्र कामः अवसीयते ॥ ॥ श्वेतदीपपतौ चित्तं शुद्धे धर्ममये मयि । धारयन् श्वेततां
    याति षडूर्मिरहितः नरः ॥ ॥ मयि आकाश आत्मनि प्राणे मनसा घोषं उद्वहन् । तत्र उपलब्धा भूतानां हंसः वाचः
    श्रुणोति असौ ॥ ॥ चक्षुः त्वष्टरि संयोज्य त्वष्टारं अपि चक्षुषि । मां तत्र मनसा ध्यायन् विश्वं पश्यति
    सूक्ष्मदृक् ॥ ॥ मनः मयि सुसंयोज्य देहं तदनु वायुना । मद्धारण अनुभावेन तत्र आत्मा यत्र वै मनः ॥ ॥ यदा
    मनः उपादाय यत् यत् रूपं बुभूषति । तत् तत् भवेत् मनोरूपं मद्योगबलं आश्रयः ॥ ॥ परकायं विशन् सिद्धः आत्मानं
    तत्र भावयेत् । पिण्डं हित्वा विशेत् प्राणः वायुभूतः षडङ्घ्रिवत् ॥ ॥ पार्ष्ण्या आपीड्य गुदं प्राणं
    हृत् उरः कण्ठ मूर्धसु । आरोप्य ब्रह्मरन्ध्रेण ब्रह्म नीत्वा उत्सृजेत् तनुम् ॥ ॥ विहरिष्यन् सुराक्रीडे
    मत्स्थं सत्त्वं विभावयेत् । विमानेन उपतिष्ठन्ति सत्त्ववृत्तीः सुरस्त्रियः ॥ ॥ यथा सङ्कल्पयेत् बुद्ध्या
    यदा वा मत्परः पुमान् । मयि सत्ये मनः युञ्जन् तथा तत् समुपाश्नुते ॥ ॥ यः वै मद्भावं आपन्नः ईशितुः वशितुः
    पुमान् । कुतश्चित् न विहन्येत तस्य च आज्ञा यथा मम ॥ ॥ मद्भक्त्या शुद्धसत्त्वस्य योगिनः धारणाविदः ।
    तस्य त्रैकालिकी बुद्धिः जन्म मृत्यु उपबृंहिता ॥ ॥ अग्नि आदिभिः न हन्येत मुनेः योगं अयं वपुः । मद्योगश्रान्तचित्तस्य
    यादसां उदकं यथा ॥ ॥ मद्विभूतिः अभिध्यायन् श्रीवत्स अस्त्रबिभूषिताः । ध्वजातपत्रव्यजनैः सः भवेत् अपराजितः
    ॥ ॥ उपासकस्य मां एवं योगधारणया मुनेः । सिद्धयः पूर्वकथिताः उपतिष्ठन्ति अशेषतः ॥ ॥ जितेन्द्रियस्य दान्तस्य
    जितश्वास आत्मनः मुनेः । मद्धारणां धारयतः का सा सिद्धिः सुदुर्लभा ॥ ॥ अन्तरायान् वदन्ति एताः युञ्जतः
    योगं उत्तमम् । मया सम्पद्यमानस्य कालक्षेपणहेतवः ॥ ॥ जन्म ओषधि तपो मन्त्रैः यावतीः इह सिद्धयः । योगेन
    आप्नोति ताः सर्वाः न अन्यैः योगगतिं व्रजेत् ॥ ॥ सर्वासां अपि सिद्धीनां हेतुः पतिः अहं प्रभुः । अहं
    योगस्य साङ्ख्यस्य धर्मस्य ब्रह्मवादिनाम् ॥ ॥ अहं आत्मा अन्तरः बाह्यः अनावृतः सर्वदेहिनाम् । यथा भूतानि
    भूतेषु बहिः अन्तः स्वयं तथा ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे
    सिद्धनिरूपणयोगो नाम पञ्चदशोऽध्यायः ॥ ॥ अथ षोडशोऽध्यायः । उद्धवः उवाच । त्वं ब्रह्म परमं साक्षात् अनादि
    अनन्तं अपावृतम् । सर्वेषां अपि भावानां त्राणस्थिति अप्यय उद्भवः ॥ ॥ उच्चावचेषु भूतेषु दुर्ज्ञेयं अकृत
    आत्मभिः । उपासते त्वां भगवन् याथातथ्येन ब्राह्मणाः ॥ ॥ येषु येषु च भावेषु भक्त्या त्वां परमर्षयः ।
    उपासीनाः प्रपद्यन्ते संसिद्धिं तत् वदस्व मे ॥ ॥ गूढः चरसि भूतात्मा भूतानां भूतभावन । न त्वां पश्यन्ति
    भूतानि पश्यन्तं मोहितानि ते ॥ ॥ याः काः च भूमौ दिवि वै रसायाम् विभूतयः दिक्षु महाविभूते । ताः मह्यं
    आख्याहि अनुभाविताः ते नमामि ते तीर्थ पद अङ्घ्रिपद्मम् ॥ ॥ श्रीभगवान् उवाच । एवं एतत् अहं पृष्टः प्रश्नं
    प्रश्नविदां वर । युयुत्सुना विनशने सपत्नैः अर्जुनेन वै ॥ ॥ ज्ञात्वा ज्ञातिवधं गर्ह्यं अधर्मं राज्यहेतुकम्
    । ततः निवृत्तः हन्ता अहं हतः अयं इति लौकिकः ॥ ॥ सः तदा पुरुषव्याघ्रः युक्त्या मे प्रतिबोधितः । अभ्यभाषत
    मां एवं यथा त्वं रणमूर्धनि ॥ ॥ अहं आत्मा उद्धव आमीषां भूतानां सुहृत् ईश्वरः । अहं सर्वाणि भूतानि तेषां
    स्थिति उद्भव अप्ययः ॥ ॥ अहं गतिः गतिमतां कालः कलयतां अहम् । गुणानां च अपि अहं साम्यं गुणिन्या उत्पत्तिकः
    गुणः ॥ ॥ गुणिनां अपि अहं सूत्रं महतां च महान् अहम् । सूक्ष्माणां अपि अहं जीवः दुर्जयानां अहं मनः ॥
    ॥ हिरण्यगर्भः वेदानां मन्त्राणां प्रणवः त्रिवृत् । अक्षराणां अकारः अस्मि पदानि छन्दसां अहम् ॥ ॥ इन्द्रः
    अहं सर्वदेवानां वसूनामस्मि हव्यवाट् । आदित्यानां अहं विष्णू रुद्राणां नीललोहितः ॥ ॥ ब्रह्मर्षीणां
    भृगुः अहं राजर्षीणां अहं मनुः । देवर्षिणां नारदः अहं हविर्धानि अस्मि धेनुषु ॥ ॥ सिद्धेश्वराणां कपिलः
    सुपर्णः अहं पतत्रिणाम् । प्रजापतीनां दक्षः अहं पितॄणां अहं अर्यमा ॥ ॥ मां विद्धि उद्धव दैत्यानां प्रह्लादं
    असुरेश्वरम् । सोमं नक्षत्र ओषधीनां धनेशं यक्षरक्षसाम् ॥ ॥ ऐरावतं गजेन्द्राणां यादसां वरुणं प्रभुम्
    । तपतां द्युमतां सूर्यं मनुष्याणां च भूपतिम् ॥ ॥ उच्चैःश्रवाः तुरङ्गाणां धातूनां अस्मि काञ्चनम् ।
    यमः संयमतां च अहं सर्पाणां अस्मि वासुकिः ॥ ॥ नागेन्द्राणां अनन्तः अहं मृगेन्द्रः श ऋङ्गिदंष्ट्रिणाम्
    । आश्रमाणां अहं तुर्यः वर्णानां प्रथमः अनघ ॥ ॥ तीर्थानां स्रोतसां गङ्गा समुद्रः सरसां अहम् । आयुधानां
    धनुः अहं त्रिपुरघ्नः धनुष्मताम् ॥ ॥ धिष्ण्यानां अस्मि अहं मेरुः गहनानां हिमालयः । वनस्पतीनां अश्वत्थः
    ओषधीनां अहं यवः ॥ ॥ पुरोधसां वसिष्ठः अहं ब्रह्मिष्ठानां बृहस्पतिः । स्कन्दः अहं सर्वसेनान्यां अग्रण्यां
    भगवान् अजः ॥ ॥ यज्ञानां ब्रह्मयज्ञः अहं व्रतानां अविहिंसनम् । वायु अग्नि अर्क अम्बु वाक् आत्मा शुचीनां
    अपि अहं शुचिः ॥ ॥ योगानां आत्मसंरोधः मन्त्रः अस्मि विजिगीषताम् । आन्वीक्षिकी कौशलानां विकल्पः ख्यातिवादिनाम्
    ॥ ॥ स्त्रीणां तु शतरूपा अहं पुंसां स्वायम्भुवः मनुः । नारायणः मुनीनां च कुमारः ब्रह्मचारिणाम् ॥ ॥
    धर्माणां अस्मि सन्न्यासः क्षेमाणां अबहिः मतिः । गुह्यानां सूनृतं मौनं मिथुनानां अजः तु अहम् ॥ ॥ संवत्सरः
    अस्मि अनिमिषां ऋतूनां मधुमाधवौ । मासानां मार्गशीर्षः अहं नक्षत्राणां तथा अभिजित् ॥ ॥ अहं युगानां च
    कृतं धीराणां देवलः असितः । द्वैपायनः अस्मि व्यासानां कवीनां काव्यः आत्मवान् ॥ ॥ वासुदेवः भगवतां त्वं
    भागवतेषु अहम् । किम्पुरुषाणां हनुमान् विद्याघ्राणां सुदर्शनः ॥ ॥ रत्नानां पद्मरागः अस्मि पद्मकोशः
    सुपेशसाम् । कुशः अस्मि दर्भजातीनां गव्यं आज्यं हविष्षु अहम् ॥ ॥ व्यवसायिनां अहं लक्ष्मीः कितवानां
    छलग्रहः । तितिक्षा अस्मि तितिक्षणां सत्त्वं सत्त्ववतां अहम् ॥ ॥ ओजः सहोबलवतां कर्म अहं विद्धि सात्त्वताम्
    । सात्त्वतां नवमूर्तीनां आदिमूर्तिः अहं परा ॥ ॥ विश्वावसुः पूर्वचित्तिः गन्धर्व अप्सरसां अहम् । भूधराणां
    अहं स्थैर्यं गन्धमात्रं अहं भुवः ॥ ॥ अपां रसः च परमः तेजिष्ठानां विभावसुः । प्रभा सूर्य इन्दु ताराणां
    शब्दः अहं नभसः परः ॥ ॥ ब्रह्मण्यानां बलिः अहं विराणां अहं अर्जुनः । भूतानां स्थितिः उत्पत्तिः अहं
    वै प्रतिसङ्क्रमः ॥ ॥ गति उक्ति उत्सर्ग उपादानं आनन्द स्पर्श लक्षणम् । आस्वाद श्रुति अवघ्राणं अहं सर्वेन्द्रिय
    इन्द्रियम् ॥ ॥ पृथिवी वायुः आकाशः आपः ज्योतिः अहं महान् । विकारः पुरुषः अव्यक्तं रजः सत्त्वं तमः परम्
    । अहं एतत् प्रसङ्ख्यानं ज्ञानं सत्त्वविनिश्चयः ॥ ॥ मया ईश्वरेण जीवेन गुणेन गुणिना विना । सर्वात्मना
    अपि सर्वेण न भावः विद्यते क्वचित् ॥ ॥ सङ्ख्यानं परमाणूनां कालेन क्रियते मया । न तथा मे विभूतीनां सृजतः
    अण्डानि कोटिशः ॥ ॥ तेजः श्रीः कीर्तिः ऐश्वर्यं ह्रीः त्यागः सौभगं भगः । वीर्यं तितिक्षा विज्ञानं यत्र
    यत्र स मे अंशकः ॥ ॥ एताः ते कीर्तिताः सर्वाः सङ्क्षेपेण विभूतयः । मनोविकाराः एव एते यथा वाचा अभिधीयते
    ॥ ॥ वाचं यच्छ मनः यच्छ प्राणानि यच्छ इन्द्रियाणि च । आत्मानं आत्मना यच्छ न भूयः कल्पसे अध्वने ॥ ॥
    यः वै वाक् मनसि सम्यक् असंयच्छन् धिया यतिः । तस्य व्रतं तपः दानं स्रवत्यामघटाम्बुवत् ॥ ॥ तस्मात् मनः
    वचः प्राणान् नियच्छेत् मत् परायणः । मत् भक्ति युक्तया बुद्ध्या ततः परिसमाप्यते ॥ ॥ इति श्रीमद्भागवते
    महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे विभूतियोगो नाम षोडशोऽध्यायः ॥ ॥ अथ
    सप्तदशोऽध्यायः । उद्धवः उवाच । यः त्वया अभितः पूर्वं धर्मः त्वत् भक्तिलक्षणः । वर्णाश्रम आचारवतां
    सर्वेषां द्विपदां अपि ॥ ॥ यथा अनुष्ठीयमानेन त्वयि भक्तिः नृणां भवेत् । स्वधर्मेण अरविन्दाक्ष तत् समाख्यातुं
    अर्हसि ॥ ॥ पुरा किल महाबाहो धर्मं परमकं प्रभो । यत् तेन हंसरूपेण ब्रह्मणे अभ्यात्थ माधव ॥ ॥ सः इदानीं
    सुमहता कालेन अमित्रकर्शन । न प्रायः भविता मर्त्यलोके प्राक् अनुशासितः ॥ ॥ वक्ता कर्ता अविता न अन्यः
    धर्मस्य अच्युत ते भुवि । सभायां अपि वैरिञ्च्यां यत्र मूर्तिधराः कलाः ॥ ॥ कर्त्रा अवित्रा प्रवक्त्रा
    च भवता मधुसूदन । त्यक्ते महीतले देव विनष्टं कः प्रवक्ष्यति ॥ ॥ तत्त्वं नः सर्वधर्मज्ञ धर्मः त्वत्
    भक्तिलक्षणः । यथा यस्य विधीयेत तथा वर्णय मे प्रभो ॥ ॥ श्रीशुकः उवाच । इत्थं स्वभृत्यमुख्येन पृष्टः
    सः भगवान् हरिः । प्रीतः क्षेमाय मर्त्यानां धर्मान् आह सनातनान् ॥ ॥ श्रीभगवान् उवाच । धर्म्यः एष तव
    प्रश्नः नैःश्रेयसकरः नृणाम् । वर्णाश्रम आचारवतां तं उद्धव निबोध मे ॥ ॥ आदौ कृतयुगे वर्णः नृणां हंसः
    इति स्मृतः । कृतकृत्याः प्रजाः जात्याः तस्मात् कृतयुगं विदुः ॥ ॥ वेदः प्रणवः एव अग्रे धर्मः अहं वृषरूपधृक्
    । उपासते तपोनिष्ठां हंसं मां मुक्तकिल्बिषाः ॥ ॥ त्रेतामुखे महाभाग प्राणात् मे हृदयात् त्रयी । विद्या
    प्रादुः अभूत् तस्याः अहं आसं त्रिवृन्मखः ॥ ॥ विप्र क्षत्रिय विट् शूद्राः मुख बाहु उरु पादजाः । वैराजात्
    पुरुषात् जाताः यः आत्माचारलक्षणाः ॥ ॥ गृहाश्रमः जघनतः ब्रह्मचर्यं हृदः मम । वक्षःस्थानात् वने वासः
    न्यासः शीर्षणि संस्थितः ॥ ॥ वर्णानां आश्रमाणां च जन्मभूमि अनुसारिणीः । आसन् प्रकृतयः नॄणां नीचैः नीच
    उत्तम उत्तमाः ॥ ॥ शमः दमः तपः शौचं सन्तोषः क्षान्तिः आर्जवम् । मद्भक्तिः च दया सत्यं ब्रह्मप्रकृतयः
    तु इमाः ॥ ॥ तेजः बलं धृतिः शौर्यं तितिक्षा औदार्यं उद्यमः । स्थैर्यं ब्रह्मणि अत ऐश्वर्यं क्षत्रप्रकृतयः
    तु इमाः ॥ ॥ आस्तिक्यं दाननिष्ठा च अदम्भः ब्रह्मसेवनम् । अतुष्टिः अर्थ उपचयैः वैश्यप्रकृतयः तु इमाः
    ॥ ॥ शुश्रूषणं द्विजगवां देवानां च अपि अमायया । तत्र लब्धेन सन्तोषः शूद्रप्रकृतयः तु इमाः ॥ ॥ अशौचं
    अनृतं स्तेयं नास्तिक्यं शुष्कविग्रहः । कामः क्रोधः च तर्षः च स्वभावः अन्तेवसायिनाम् ॥ ॥ अहिंसा सत्यं
    अस्तेयं अकामक्रोधलोभता । भूतप्रियहितेहा च धर्मः अयं सार्ववर्णिकः ॥ ॥ द्वितीयं प्राप्य अनुपूर्व्यात्
    जन्म उपनयनं द्विजः । वसन् गुरुकुले दान्तः ब्रह्म अधीयीत च आहुतः ॥ ॥ मेखला अजिन दण्ड अक्ष ब्रह्मसूत्र
    कमण्डलून् । जटिलः अधौतदद्वासः अरक्तपीठः कुशान् दधत् ॥ ॥ स्नान भोजन होमेषु जप उच्चारे च वाग्यतः । न
    च्छिन्द्यात् नख रोमाणि कक्ष उपस्थगतानि अपि ॥ ॥ रेतः न अवरिकेत् जातु ब्रह्मव्रतधरः स्वयम् । अवकीर्णे
    अवगाह्य अप्सु यतासुः त्रिपदीं जपेत् ॥ ॥ अग्नि अर्क आचार्य गो विप्र गुरु वृद्ध सुरान् शुचिः । समाहितः
    उपासीत सन्ध्ये च यतवाक् जपन् ॥ ॥ आचार्यं मां विजानीयात् न अवमन्येत कर्हिचित् । न मर्त्यबुद्धि आसूयेत
    सर्वदेवमयः गुरुः ॥ ॥ सायं प्रातः उपानीय भैक्ष्यं तस्मै निवेदयेत् । यत् च अन्यत् अपि अनुज्ञातं उपयुञ्जीत
    संयतः ॥ ॥ शुश्रूषमाणः आचार्यं सदा उपासीत नीचवत् । यान शय्या आसन स्थानैः न अतिदूरे कृताञ्जलिः ॥ ॥ एवंवृत्तः
    गुरुकुले वसेत् भोगविवर्जितः । विद्या समाप्यते यावत् बिभ्रत् व्रतं अखण्डितम् ॥ ॥ यदि असौ छन्दसां लोकं
    आरोक्ष्यन् ब्रह्मविष्टपम् । गुरवे विन्यसेत् देहं स्वाध्यायार्थं वृहत् व्रतः ॥ ॥ अग्नौ गुरौ आत्मनि
    च सर्वभूतेषु मां परम् । अपृथक् धीः उपासीत ब्रह्मवर्चस्वी अकल्मषः ॥ ॥ स्त्रीणां निरीक्षण स्पर्श संलाप
    क्ष्वेलन आदिकम् । प्राणिनः मिथुनीभूतान् अगृहस्थः अग्रतः त्यजेत् ॥ ॥ शौचं आचमनं स्नानं सन्ध्या उपासनं
    आर्जवम् । तीर्थसेवा जपः अस्पृश्य अभक्ष्य असम्भाष्य वर्जनम् ॥ ॥ सर्व आश्रम प्रयुक्तः अयं नियमः कुलनन्दन।
    मद्भावः सर्बभूतेषु मनोवाक्काय संयमः ॥ ॥ एवं बृहत् व्रतधरः ब्राह्मणः अग्निः इव ज्वलन् । मद्भक्तः तीव्रतपसा
    दग्धकर्म आशयः अमलः ॥ ॥ अथ अनन्तरं आवेक्ष्यन् यथा जिज्ञासित आगमः । गुरवे दक्षिणां दत्त्वा स्नायत् गुरु
    अनुमोदितः ॥ ॥ गृहं वनं वा उपविशेत् प्रव्रजेत् वा द्विज उत्तमः । आश्रमात् आश्रमं गच्छेत् न अन्यथा मत्परः
    चरेत् ॥ ॥ गृहार्थी सदृशीं भार्यां उद्वहेत् अजुगुप्सिताम् । यवीयसीं तु वयसा यां सवर्णां अनुक्रमात्
    ॥ ॥ इज्य अध्ययन दानानि सर्वेषां च द्विजन्मनाम् । प्रतिग्रहः अध्यापनं च ब्राह्मणस्य एव याजनम् ॥ ॥ प्रतिग्रहं
    मन्यमानः तपः तेजोयशोनुदम् । अन्याभ्यां एव जीवेत शिलैः वा दोषदृक् तयोः ॥ ॥ ब्राह्मणस्य हि देहः अयं
    क्षुद्रकामाय न इष्यते । कृच्छ्राय तपसे च इह प्रेत्य अनन्तसुखाय च ॥ ॥ शिलोञ्छवृत्त्या परितुष्टचित्तः
    धर्मं महान्तं विरजं जुषाणः । मयि अर्पितात्मा गृहः एव तिष्ठन् न अतिप्रसक्तः समुपैति शान्तिम् ॥ ॥ समुद्धरन्ति
    ये विप्रं सीदन्तं मत्परायणम् । तान् उद्धरिष्ये न चिरात् आपद्भ्यः नौः इव अर्णवात् ॥ ॥ सर्वाः समुद्धरेत्
    राजा पिता इव व्यसनात् प्रजाः । आत्मानं आत्मना धीरः यथा गजपतिः गजान् ॥ ॥ एवंविधः नरपतिः विमानेन अर्कवचसा
    । विधूय इह अशुभं कृत्स्नं इन्द्रेण सह मोदते ॥ ॥ सीदन् विप्रः वणिक् वृत्त्या पण्यैः एव आपदं तरेत् ।
    खड्गेन वा आपदाक्रान्तः न श्ववृत्त्या कथञ्चन ॥ ॥ वैश्यवृत्त्या तु राजन् यः जीवेत् मृगयया आपदि । चरेत्
    वा विप्ररूपेण न श्ववृत्त्या कथञ्चन ॥ ॥ शूद्रवृत्तिं भजेत् वैश्यः शूद्रः कारुकटप्रियाम् । कृच्छ्रात्
    मुक्तः न गर्ह्येण वृत्तिं लिप्सेत कर्मणा ॥ ॥ वेद अध्याय स्वधा स्वाहा बलि अन्न आद्यैः यथा उदयम् । देवर्षि
    पितृभूतानि मद्रूपाणि अन्वहं यजेत् ॥ ॥ यदृच्छया उपपन्नेन शुक्लेन उपार्जितेन वा । धनेन अपीडयन् भृत्यान्
    न्यायेन एव आहरेत् क्रतून् ॥ ॥ कुटुम्बेषु न सज्जेत न प्रमाद्येत् कुटुम्बि अपि । विपश्चित् नश्वरं पश्येत्
    अदृष्टं अपि दृष्टवत् ॥ ॥ पुत्र दारा आप्त बन्धूनां सङ्गमः पान्थसङ्गमः । अनुदेहं वियन्ति एते स्वप्नः
    निद्रानुगः यथा ॥ ॥ इत्थं परिमृशन् मुक्तः गृहेषु अतिथिवत् वसन् । न गृहैः अनुबध्येत निर्ममः निरहङ्कृतः
    ॥ ॥ कर्मभिः गृहं एधीयैः इष्ट्वा मां एव भक्तिमान् । तिष्ठेत् वनं वा उपविशेत् प्रजावान् वा परिव्रजेत्
    ॥ ॥ यः तु आसक्तं अतिः गेहे पुत्र वित्तैषण आतुरः । स्त्रैणः कृपणधीः मूढः मम अहं इति बध्यते ॥ ॥ अहो
    मे पितरौ वृद्धौ भार्या बालात्मजा आत्मजाः । अनाथाः मां ऋते दीनाः कथं जीवन्ति दुःखिताः ॥ ॥ एवं गृह आशय
    आक्षिप्त हृदयः मूढधीः अयम् । अतृप्तः तान् अनुध्यायन् मृतः अन्धं विशते तमः ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे ब्रह्मचर्यगृहस्थकर्मधर्मनिरूपणे सप्तदशोऽध्यायः
    ॥ ॥ अथ अष्टादशोऽध्यायः । श्रीभगवान् उवाच । वनं विविक्षुः पुत्रेषु भार्यां न्यस्य सह एव वा । वनः एव
    वसेत् शान्तः तृतीयं भागं आयुषः ॥ ॥ कन्दमूलफलैः वन्यैः मेध्यैः वृत्तिं प्रकल्पयेत् । वसीत वल्कलं वासः
    तृणपर्ण अजिनानि च ॥ ॥ केशरोमनखश्मश्रुमलानि बिभृयात् अतः । न धावेत् अप्सु मज्जेत त्रिकालं स्थण्डिलेशयः
    ॥ ॥ ग्रीष्मे तप्येत पञ्चाग्नीन् वर्षास्वासारषाड् जले । आकण्ठमग्नः शिशिरः एवंवृत्तः तपश्चरेत् ॥ ॥ अग्निपक्वं
    समश्नीयात् कालपक्वं अथ अपि वा । उलूखल अश्मकुट्टः वा दन्त उलूखलः एव वा ॥ ॥ स्वयं सञ्चिनुयात् सर्वं
    आत्मनः वृत्तिकारणम् । देशकालबल अभिज्ञः न आददीत अन्यदा आहृतम् ॥ ॥ वन्यैः चरुपुरोडाशैः निर्वपेत् कालचोदितान्
    । न तु श्रौतेन पशुना मां यजेत वनाश्रमी ॥ ॥ अग्निहोत्रं च दर्शः च पूर्णमासः च पूर्ववत् । चातुर्मास्यानि
    च मुनेः आम्नातानि च नैगमैः ॥ ॥ एवं चीर्णेन तपसा मुनिः धमनिसन्ततः । मां तपोमयं आराध्य ऋषिलोकात् उपैति
    माम् ॥ ॥ यः तु एतत् कृच्छ्रतः चीर्णं तपः निःश्रेयसं महत् । कामाय अल्पीयसे युञ्ज्यात् वालिशः कः अपरः
    ततः ॥ ॥ यदा असौ नियमे अकल्पः जरया जातवेपथुः । आत्मनि अग्नीन् समारोप्य मच्चित्तः अग्निं समाविशेत् ॥
    ॥ यदा कर्मविपाकेषु लोकेषु निरय आत्मसु । विरागः जायते सम्यक् न्यस्त अग्निः प्रव्रजेत् ततः ॥ ॥ इष्ट्वा
    यथा उपदेशं मां दत्त्वा सर्वस्वं ऋत्विजे । अग्नीन् स्वप्राणः आवेश्य निरपेक्षः परिव्रजेत् ॥ ॥ विप्रस्य
    वै सन्न्यसतः देवाः दारादिरूपिणः । विघ्नान् कुर्वन्ति अयं हि अस्मान् आक्रम्य समियात् परम् ॥ ॥ बिभृयात्
    चेत् मुनिः वासः कौपीन आच्छादनं परम् । त्यक्तं न दण्डपात्राभ्यां अन्यत् किञ्चित् अनापदि ॥ ॥ दृष्टिपूतं
    न्यसेत् पादं वस्त्रपूतं पिबेत् जलम् । सत्यपूतां वदेत् वाचं मनःपूतं समाचरेत् ॥ ॥ मौन अनीहा अनिल आयामाः
    दण्डाः वाक् देह चेतसाम् । नहि एते यस्य सन्ति अङ्गः वेणुभिः न भवेत् यतिः ॥ ॥ भिक्षां चतुषु वर्णेषु
    विगर्ह्यान् वर्जयन् चरेत् । सप्तागारान् असङ्क्लृप्तान् तुष्येत् लब्धेन तावता ॥ ॥ बहिः जलाशयं गत्वा
    तत्र उपस्पृश्य वाग्यतः । विभज्य पावितं शेषं भुञ्जीत अशेषं आहृतम् ॥ ॥ एकः चरेत् महीं एतां निःसङ्गः
    संयतेन्द्रियः । आत्मक्रीडः आत्मरतः आत्मवान् समदर्शनः ॥ ॥ विविक्तक्षेमशरणः मद्भावविमलाशयः । आत्मानं
    चिन्तयेत् एकं अभेदेन मया मुनिः ॥ ॥ अन्वीक्षेत आत्मनः बन्धं मोक्षं च ज्ञाननिष्ठया । बन्धः इन्द्रियविक्षेपः
    मोक्षः एषां च संयमः ॥ ॥ तस्मात् नियम्य षड्वर्गं मद्भावेन चरेत् मुनिः । विरक्तः क्षुल्लकामेभ्यः लब्ध्वा
    आत्मनि सुखं महत् ॥ ॥ पुरग्रामव्रजान् सार्थान् भिक्षार्थं प्रविशन् चरेत् । पुण्यदेशसरित् शैलवन आश्रमवतीं
    महीम् ॥ ॥ वानप्रस्थ आश्रम पदेषु अभीक्ष्णं भैक्ष्यं आचरेत् । संसिध्यत्याश्वसम्मोहः शुद्धसत्त्वः शिलान्धसा
    ॥ ॥ न एतत् वस्तुतया पश्येत् दृश्यमानं विनश्यति । असक्तचित्तः विरमेत् इह अमुत्र चिकीर्षितात् ॥ ॥ यत्
    एतत् आत्मनि जगत् मनोवाक्प्राणसंहतम् । सर्वं माया इति तर्केण स्वस्थः त्यक्त्वा न तत् स्मरेत् ॥ ॥ ज्ञाननिष्ठः
    विरक्तः वा मद्भक्तः वा अनपेक्षकः । सलिङ्गान् आश्रमां त्यक्त्वा चरेत् अविधिगोचरः ॥ ॥ बुधः बालकवत् क्रीडेत्
    कुशलः जडवत् चरेत् । वदेत् उन्मत्तवत् विद्वान् गोचर्यां नैगमः चरेत् ॥ ॥ वेदवादरतः न स्यात् न पाखण्डी
    न हैतुकः । शुष्कवादविवादे न कञ्चित् पक्षं समाश्रयेत् ॥ ॥ न उद्विजेत जनात् धीरः जनं च उद्वेजयेत् न
    तु । अतिवादान् तितिक्षेत न अवमन्येत कञ्चन । देहं उद्दिश्य पशुवत् वैरं कुर्यात् न केनचित् ॥ ॥ एकः एव
    परः हि आत्मा भूतेषु आत्मनि अवस्थितः । यथा इन्दुः उदपात्रेषु भूतानि एकात्मकानि च ॥ ॥ अलब्ध्वा न विषीदेत
    काले काले अशनं क्वचित् । लब्ध्वा न हृष्येत् धृतिं आनुभयं दैवतन्त्रितम् ॥ ॥ आहारार्थं समीहेत युक्तं
    तत् प्राणधारणम् । तत्त्वं विमृश्यते तेन तत् विज्ञाय विमुच्यते ॥ ॥ यत् ऋच्छया उपपन्नात् अन्नं अद्यात्
    श्रेष्ठं उत अपरम् । तथा वासः तथा शय्यां प्राप्तं प्राप्तं भजेत् मुनिः ॥ ॥ शौचं आचमनं स्नानं न तु चोदनया
    चरेत् । अन्यान् च नियमान् ज्ञानी यथा अहं लीलया ईश्वरः ॥ ॥ नहि तस्य विकल्पाख्या या च मद्वीक्षया हता
    । आदेहान्तात् क्वचित् ख्यातिः ततः सम्पद्यते मया ॥ ॥ दुःख उदर्केषु कामेषु जातनिर्वेदः आत्मवान् । अजिज्ञासित
    मद्धर्मः गुरुं मुनिं उपाव्रजेत् ॥ ॥ तावत् परिचरेत् भक्तः श्रद्धावान् अनसूयकः । यावत् ब्रह्म विजानीयात्
    मां एव गुरुं आदृतः ॥ ॥ यः तु असंयत षड्वर्गः प्रचण्ड इन्द्रिय सारथिः । ज्ञान वैराग्य रहितः त्रिदण्डं
    उपजीवति ॥ ॥ सुरान् आत्मानं आत्मस्थं निह्नुते मां च धर्महा । अविपक्व कषायः अस्मात् उष्मात् च विहीयते
    ॥ ॥ भिक्षोः धर्मः शमः अहिंसा तपः ईक्षा वनौकसः । गृहिणः भूतरक्ष इज्याः द्विजस्य आचार्यसेवनम् ॥ ॥ ब्रह्मचर्यं
    तपः शौचं सन्तोषः भूतसौहृदम् । गृहस्थस्य अपि ऋतौ गन्तुः सर्वेषां मदुपासनम् ॥ ॥ इति मां यः स्वधर्मेण
    भजन् नित्यं अनन्यभाक् । सर्वभूतेषु मद्भावः मद्भक्तिं विन्दते अचिरात् ॥ ॥ भक्त्या उद्धव अनपायिन्या
    सर्वलोकमहेश्वरम् । सर्व उत्पत्ति अपि अयं ब्रह्म कारणं मा उपयाति सः ॥ ॥ इति स्वधर्म निर्णिक्त सत्त्वः
    निर्ज्ञात् मद्गतिः । ज्ञान विज्ञान सम्पन्नः न चिरात् समुपैति माम् ॥ ॥ वर्णाश्रमवतां धर्मः एषः आचारलक्षणः
    । सः एव मद्भक्तियुतः निःश्रेयसकरः परः ॥ ॥ एतत् ते अभिहितं साधो भवान् पृच्छति यत् च माम् । यथा स्वधर्मसंयुक्तः
    भक्तः मां समियात् परम् ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे
    वानप्रस्थसन्न्यासधर्मनिरूपणं नामाष्टादशोऽध्यायः ॥ ॥ अथ एकोनविंशः अध्यायः । श्रीभगवान् उवाच । यः विद्याश्रुतसम्पन्नः
    आत्मवान् न अनुमानिकः । मायामात्रं इदं ज्ञात्वा ज्ञानं च मयि सन्न्यसेत् ॥ ॥ ज्ञानिनः तु अहं एव इष्टः
    स्वार्थः हेतुः च सम्मतः । स्वर्गः च एव अपवर्गः च न अन्यः अर्थः मदृते प्रियः ॥ ॥ ज्ञानविज्ञानसंसिद्धाः
    पदं श्रेष्ठं विदुः मम । ज्ञानी प्रियतमः अतः मे ज्ञानेन असौ बिभर्ति माम् ॥ ॥ तपः तीर्थं जपः दानं पवित्राणि
    इतराणि च । न अलं कुर्वन्ति तां सिद्धिं या ज्ञानकलया कृता ॥ ॥ तस्मात् ज्ञानेन सहितं ज्ञात्वा स्वात्मानं
    उद्धव । ज्ञानविज्ञानसम्पन्नः भज मां भक्तिभावतः ॥ ॥ ज्ञानविज्ञानयज्ञेन मां इष्ट्वा आत्मानं आत्मनि ।
    सर्वयज्ञपतिं मां वै संसिद्धिं मुनयः अगमन्॥ ॥ त्वयि उद्धव आश्रयति यः त्रिविधः विकारः मायान्तरा आपतति
    न आदि अपवर्गयोः यत् । जन्मादयः अस्य यत् अमी तव तस्य किं स्युः आदि अन्तयोः यत् असतः अस्ति तत् एव मध्ये
    ॥ ॥ उद्धवः उवाच । ज्ञानं विशुद्धं विपुलं यथा एतत् वैराग्यविज्ञानयुतं पुराणम् । आख्याहि विश्वेश्वर
    विश्वमूर्ते त्वत् भक्तियोगं च महत् विमृग्यम् ॥ ॥ तापत्रयेण अभिहतस्य घोरे सन्तप्यमानस्य भवाध्वनीश ।
    पश्यामि न अन्यत् शरणं तवाङ्घ्रि द्वन्द्व आतपत्रात् अमृत अभिवर्षात् ॥ ॥ दष्टं जनं सम्पतितं बिले अस्मिन्
    कालाहिना क्षुद्रसुखोः उतर्षम् । समुद्धर एनं कृपया अपवर्ग्यैः वचोभिः आसिञ्च महानुभाव ॥ ॥ श्रीभगवान्
    उवाच । इत्थं एतत् पुरा राजा भीष्मं धर्मभृतां वरम् । अजातशत्रुः पप्रच्छ सर्वेषां नः अनुश्रुण्वताम्
    ॥ ॥ निवृत्ते भारते युद्धे सुहृत् निधनविह्वलः । श्रुत्वा धर्मान् बहून् पश्चात् मोक्षधर्मान् अपृच्छत
    ॥ ॥ तान् अहं ते अभिधास्यामि देवव्रतमुखात् श्रुतान् । ज्ञानवैराग्यविज्ञानश्रद्धाभक्ति उपबृंहितान् ॥
    ॥ नव एकादश पञ्च त्रीन् भावान् भूतेषु येन वै । ईक्षेत अथ एकं अपि एषु तत् ज्ञानं मम निश्चितम् ॥ ॥ एतत्
    एव हि विज्ञानं न तथा एकेन येन यत् । स्थिति उत्पत्ति अपि अयान् पश्येत् भावानां त्रिगुण आत्मनाम् ॥ ॥
    आदौ अन्ते च मध्ये च सृज्यात् सृज्यं यत् अन्वियात् । पुनः तत् प्रतिसङ्क्रामे यत् शिष्येत तत् एव सत्
    ॥ ॥ श्रुतिः प्रत्यक्षं ऐतिह्यं अनुमानं चतुष्टयम् । प्रमाणेषु अनवस्थानात् विकल्पात् सः विरज्यते ॥ ॥
    कर्मणां परिणामित्वात् आविरिञ्चात् अमङ्गलम् । विपश्चित् नश्वरं पश्येत् अदृष्टं अपि दृष्टवत् ॥ ॥ भक्तियोगः
    पुरा एव उक्तः प्रीयमाणाय ते अनघ । पुनः च कथयिष्यामि मद्भक्तेः कारणं परम् ॥ ॥ श्रद्धा अमृतकथायां मे
    शश्वत् मत् अनुकीर्तनम् । परिनिष्ठा च पूजायां स्तुतिभिः स्तवनं मम ॥ ॥ आदरः परिचर्यायां सर्वाङ्गैः अभिवन्दनम्
    । मद्भक्तपूजाभ्यधिका सर्वभूतेषु मन्मतिः ॥ ॥ मदर्थेषु अङ्गचेष्टा च वचसा मद्गुणेरणम् । मय्यर्पणं च मनसः
    सर्वकामविवर्जनम् ॥ ॥ मदर्थे अर्थ परित्यागः भोगस्य च सुखस्य च । इष्टं दत्तं हुतं जप्तं मदर्थं यत् व्रतं
    तपः ॥ ॥ एवं धर्मैः मनुष्याणां उद्धव आत्मनिवेदिनाम् । मयि सञ्जायते भक्तिः कः अन्यः अर्थः अस्य अवशिष्यते
    ॥ ॥ यदा आत्मनि अर्पितं चित्तं शान्तं सत्त्व उपबृंहितम् । धर्मं ज्ञानं सवैराग्यं ऐश्वर्यं च अभिपद्यते
    ॥ ॥ यत् अर्पितं तत् विकल्पे इन्द्रियैः परिधावति । रजस्वलं च आसन् निष्ठं चित्तं विद्धि विपर्ययम् ॥
    ॥ धर्मः मद्भक्तिकृत् प्रोक्तः ज्ञानं च एकात्म्यदर्शनम् । गुणेषु असङ्गः वैराग्यं ऐश्वर्यं च अणिं आदयः
    ॥ ॥ उद्धवः उवाच । यमः कतिविधः प्रोक्तः नियमः वा अरिकर्शन । कः शमः कः दमः कृष्ण का तितिक्षा धृतिः प्रभो
    ॥ ॥ किं दानं किं तपः शौर्यं किं सत्यं ऋतं उच्यते । कः त्यागः किं धनं चेष्टं कः यज्ञः का च दक्षिणा
    ॥ ॥ पुंसः किंस्वित् बलं श्रीमन् भगः लाभः च केशव । का विद्या ह्रीः परा का श्रीः किं सुखं दुःखं एव च
    ॥ ॥ कः पण्डितः कः च मूर्खः कः पन्थाः उत्पथः च कः । कः स्वर्गः नरकः कः स्वित् कः बन्धुः उत किं गृहम्
    ॥ ॥ कः आढ्यः कः दरिद्रः वा कृपणः कः ईश्वरः । एतान् प्रश्नान् मम ब्रूहि विपरीतान् च सत्पते ॥ ॥ श्रीभगवान्
    उवाच । अहिंसा सत्यं अस्तेयं असङ्गः ह्रीः असञ्चयः । आस्तिक्यं ब्रह्मचर्यं च मौनं स्थैर्यं क्षमा अभयम्
    ॥ । शौचं जपः तपः होमः श्रद्धा आतिथ्यं मत् अर्चनम् । तीर्थाटनं परार्थेहा तुष्टिः आचार्यसेवनम् ॥ ॥ एते
    यमाः सनियमाः उभयोः द्वादश स्मृताः । पुंसां उपासिताः तात यथाकामं दुहन्ति हि ॥ ॥ शमः मत् निष्ठता बुद्धेः
    दमः इन्द्रियसंयमः । तितिक्षा दुःखसम्मर्षः जिह्वा उपस्थजयः धृतिः ॥ ॥ दण्डन्यासः परं दानं कामत्यागः
    तपः स्मृतम् । स्वभावविजयः शौर्यं सत्यं च समदर्शनम् ॥ ॥ ऋतं च सूनृता वाणी कविभिः परिकीर्तिता । कर्मस्वसङ्गमः
    शौचं त्यागः सन्न्यासः उच्यते ॥ ॥ धर्मः इष्टं धनं नॄणां यज्ञः अहं भगवत्तमः । दक्षिणा ज्ञानसन्देशः प्राणायामः
    परं बलम् ॥ ॥ भगः मे ऐश्वरः भावः लाभः मद्भक्तिः उत्तमः । विद्या आत्मनि भिद अबाधः जुगुप्सा ह्रीः अकर्मसु
    ॥ ॥ श्रीः गुणाः नैरपेक्ष्य आद्याः सुखं दुःखसुख अत्ययः । दुःखं कामसुख अपेक्षा पण्डितः बन्धमोक्षवित्
    ॥ ॥ मूर्खः देह आदि अहं बुद्धिः पन्थाः मत् निगमः स्मृतः । उत्पथः चित्तविक्षेपः स्वर्गः सत्त्वगुण उअदयः
    ॥ ॥ नरकः तमः उन्नहः बन्धुः गुरुः अहं सखे । गृहं शरीरं मानुष्यं गुणाढ्यः हि आढ्यः उच्यते ॥ ॥ दरिद्रः
    यः तु असन्तुष्टः कृपणः यः अजितेन्द्रियः । गुणेषु असक्तधीः ईशः गुणसङ्गः विपर्ययः ॥ ॥ एतः उद्धव ते प्रश्नाः
    सर्वे साधु निरूपिताः । किं वर्णितेन बहुना लक्षणं गुणदोषयोः । गुणदोष दृशिः दोषः गुणः तु उभयवर्जितः
    ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुधवसंवादे एकोनविंशोऽध्यायः ॥
    ॥ अथ विंशः अध्यायः । उद्धवः उवाच । विधिः च प्रतिषेधः च निगमः हि ईश्वरस्य ते । अवेक्षते अरविन्दाक्ष
    गुणं दोषं च कर्मणाम् ॥ ॥ वर्णाश्रम विकल्पं च प्रतिलोम अनुलोमजम् । द्रव्य देश वयः कालान् स्वर्गं नरकं
    एव च ॥ ॥ गुण दोष भिदा दृष्टिं अन्तरेण वचः तव । निःश्रेयसं कथं नॄणां निषेध विधि लक्षणम् ॥ ॥ पितृदेवमनुष्याणां
    वेदः चक्षुः तव ईश्वर । श्रेयः तु अनुपलब्धे अर्थे साध्यसाधनयोः अपि ॥ ॥ गुणदोषभिदादृष्टिः निगमात् ते
    न हि स्वतः । निगमेन अपवादः च भिदायाः इति हि भ्रमः ॥ ॥ श्रीभगवान् उवाच । योगाः त्रयः मया प्रोक्ता नॄणां
    श्रेयोविधित्सया । ज्ञानं कर्म च भक्तिः च न उपायः अन्यः अस्ति कुत्रचित् ॥ ॥ निर्विण्णानां ज्ञानयोगः
    न्यासिनां इह कर्मसु । तेषु अनिर्विण्णचित्तानां कर्मयोगः ति कामिनाम् ॥ ॥ यदृच्छया मत् कथा आदौ जातश्रद्धः
    तु यः पुमान् । न निर्विण्णः न अतिसक्तः भक्तियोगः अस्य सिद्धिदः ॥ ॥ तावत् कर्माणि कुर्वीत न निर्विद्येत
    यावता । मत् कथाश्रवण आदौ वा श्रद्धा यावत् न जायते ॥ ॥ स्वधर्मस्थः यजन्यज्ञैः अनाशीः कामः उद्धव । न
    याति स्वर्गनरकौ यदि अन्यत्र समाचरेत् ॥ ॥ अस्मिन् लोके वर्तमानः स्वधर्मस्थः अनघः शुचिः । ज्ञानं विशुद्धं
    आप्नोति मद्भक्तिं वा यदृच्छया ॥ ॥ स्वर्गिणः अपि एतं इच्छन्ति लोकं निरयिणः तथा । साधकं ज्ञानभक्तिभ्यां
    उभयं तत् असाधकम् ॥ ॥ न नरः स्वर्गतिं काङ्क्षेत् नारकीं वा विचक्षणः । न इमं लोकं च काङ्क्षेत देह आवेशात्
    प्रमाद्यति ॥ ॥ एतत् विद्वान् पुरा मृत्योः अभवाय घटेत सः । अप्रमत्तः इदं ज्ञात्वा मर्त्यं अपि अर्थसिद्धिदम्
    ॥ ॥ छिद्यमानं यमैः एतैः कृतनीडं वनस्पतिम् । खगः स्वकेतं उत्सृज्य क्षेमं याति हि अलम्पटः ॥ ॥ अहोरात्रैः
    छिद्यमानं बुद्ध्वायुः भयवेपथुः । मुक्तसङ्गः परं बुद्ध्वा निरीह उपशाम्यति ॥ ॥ नृदेहं आद्यं सुलभं सुदुर्लभम्
    प्लवं सुकल्पं गुरुकर्णधारम् । मया अनुकूलेन नभस्वतेरितम् पुमान् भवाब्धिं न तरेत् सः आत्महा ॥ ॥ यदा
    आरम्भेषु निर्विण्णः विरक्तः संयतेन्द्रियः । अभ्यासेन आत्मनः योगी धारयेत् अचलं मनः ॥ ॥ धार्यमाणं मनः
    यः हि भ्राम्यदाशु अनवस्थितम् । अतन्द्रितः अनुरोधेन मार्गेण आत्मवशं नयेत् ॥ ॥ मनोगतिं न विसृजेत् जितप्राणः
    जितेन्द्रियः । सत्त्वसम्पन्नया बुद्ध्या मनः आत्मवशं नयेत् ॥ ॥ एषः वै परमः योगः मनसः सङ्ग्रहः स्मृतः
    । हृदयज्ञत्वं अन्विच्छन् दम्यस्य एव अर्वतः मुहुः ॥ ॥ साङ्ख्येन सर्वभावानां प्रतिलोम अनुलोमतः । भव
    अपि अयौ अनुध्ययेत् मनः यावत् प्रसीदति ॥ ॥ निर्विण्णस्य विरक्तस्य पुरुषस्य उक्तवेदिनः । मनः त्यजति
    दौरात्म्यं चिन्तितस्य अनुचिन्तया ॥ ॥ यम आदिभिः योगपथैः आन्वीक्षिक्या च विद्यया । मम अर्चोपासनाभिः
    वा न अन्यैः योग्यं स्मरेत् मनः ॥ ॥ यदि कुर्यात् प्रमादेन योगी कर्म विगर्हितम् । योगेन एव दहेत् अंहः
    न अन्यत् तत्र कदाचन ॥ ॥ स्वे स्वे अधिकारे या निष्ठा सः गुणः परिकीर्तितः । कर्मणां जाति अशुद्धानां
    अनेन नियमः कृतः । गुणदोषविधानेन सङ्गानां त्याजनेच्छया ॥ ॥ जातश्रद्दः मत्कथासु निर्विण्णः सर्वकर्मसु
    । वेद दुःखात्मकान् कामान् परित्यागे अपि अनीश्वरः ॥ ॥ ततः भजेत मां प्रीतः श्रद्धालुः दृढनिश्चयः । जुषमाणः
    च तान् कामान् दुःख उदर्कान् च गर्हयन् ॥ ॥ प्रोक्तेन भक्तियोगेन भजतः मा असकृत् मुनेः । कामाः हृदय्याः
    नश्यन्ति सर्वे मयि हृदि स्थिते ॥ ॥ भिद्यते हृदयग्रन्थिः छिद्यन्ते सर्वसंशयाः । क्षीयन्ते च अस्य कर्माणि
    मयि दृष्टे अखिल आत्मनि ॥ ॥ तस्मात् मद्भक्तियुक्तस्य योगिनः वै मत् आत्मनः । न ज्ञानं न च वैराग्यं प्रायः
    श्रेयः भवेत् इह ॥ ॥ यत् कर्मभिः यत् तपसा ज्ञानवैराग्यतः च यत् । योगेन दानधर्मेण श्रेयोभिः इतरैः अपि
    ॥ ॥ सर्वं मद्भक्तियोगेन मद्भक्तः लभते अञ्जसा । स्वर्ग अपवर्गं मत् धाम कथञ्चित् यदि वाञ्छति ॥ ॥ न किञ्चित्
    साधवः धीराः भक्ताः हि एकान्तिनः मम । वाञ्छति अपि मया दत्तं कैवल्यं अपुनर्भवम् ॥ ॥ नैरपेक्ष्यं परं
    प्राहुः निःश्रेयसं अनल्पकम् । तस्मात् निराशिषः भक्तिः निरपेक्षस्य मे भवेत् ॥ ॥ न मयि एकान्तभक्तानां
    गुणदोष उद्भवाः गुणाः । साधूनां समचित्तानां बुद्धेः परं उपेयुषाम् ॥ ॥ एवं एतत् मया आदिष्टान् अनुतिष्ठन्ति
    मे पथः । क्षेमं विन्दन्ति मत् स्थानं यत् ब्रह्म परमं विदुः ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां
    संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे वेदत्रयीविभागयोगो नाम विंशोऽध्यायः ॥ ॥ अथ एकविंशः अध्यायः ।
    श्रीभगवान् उवाच । यः एतान् मत्पथः हित्वा भक्तिज्ञानक्रियात्मकान् । क्षुद्रान् कामान् चलैः प्राणैः
    जुषन्तः संसरन्ति ते ॥ ॥ स्वे स्वे अधिकारे या निष्ठा सः गुणः परिकीर्तितः । विपर्ययः तु दोषः स्यात्
    उभयोः एषः निश्चयः ॥ ॥ शुद्धि अशुद्धी विधीयेते समानेषु अपि वस्तुषु । द्रव्यस्य विचिकित्सार्थं गुणदोषौ
    शुभ अशुभौ ॥ ॥ धर्मार्थं व्यवहारार्थं यात्रार्थं इति च अनघ । दर्शितः अयं मया आचारः धर्मं उद्वहतां धुरम्
    ॥ ॥ भूमि अम्बु अग्नि अनिल आकाशाः भूतानां पञ्च धातवः । आब्रह्म स्थावर आदीनां शरीराः आत्मसंयुताः ॥ ॥
    वेदेन नामरूपाणि विषमाणि समेषु अपि । धातुषु उद्धव कल्प्यन्तः एतेषां स्वार्थसिद्धये ॥ ॥ देश काल आदि
    भावानां वस्तूनां मम सत्तम । गुणदोषौ विधीयेते नियमार्थं हि कर्मणाम् ॥ ॥ अकृष्णसारः देशानां अब्रह्मण्यः
    अशुचिः भवेत् । कृष्णसारः अपि असौवीर कीकट असंस्कृतेरिणम् ॥ ॥ कर्मण्यः गुणवान् कालः द्रव्यतः स्वतः एव
    वा । यतः निवर्तते कर्म सः दोषः अकर्मकः स्मृतः ॥ ॥ द्रव्यस्य शुद्धि अशुद्धी च द्रव्येण वचनेन च । संस्कारेण
    अथ कालेन महत्त्व अल्पतया अथवा ॥ ॥ शक्त्या अशक्त्या अथवा बुद्ध्या समृद्ध्या च यत् आत्मने । अघं कुर्वन्ति
    हि यथा देश अवस्था अनुसारतः ॥ ॥ धान्य दारु अस्थि तन्तूनां रस तैजस चर्मणाम् । काल वायु अग्नि मृत्तोयैः
    पार्थिवानां युत अयुतैः ॥ ॥ अमेध्यलिप्तं यत् येन गन्धं लेपं व्यपोहति । भजते प्रकृतिं तस्य तत् शौचं
    तावत् इष्यते ॥ ॥ स्नान दान तपः अवस्था वीर्य संस्कार कर्मभिः । मत् स्मृत्या च आत्मनः शौचं शुद्धः कर्म
    आचरेत् द्विजः ॥ ॥ मन्त्रस्य च परिज्ञानं कर्मशुद्धिः मदर्पणम् । धर्मः सम्पद्यते षड्भिः अधर्मः तु विपर्ययः
    ॥ ॥ क्वचित् गुणः अपि दोषः स्यात् दोषः अपि विधिना गुणः । गुणदोषार्थनियमः तत् भिदां एव बाधते ॥ ॥ समानकर्म
    आचरणं पतितानां न पातकम् । औत्पत्तिकः गुणः सङ्गः न शयानः पतति अधः ॥ ॥ यतः यतः निवर्तेत विमुच्येत ततः
    ततः । एषः धर्मः नॄणां क्षेमः शोकमोहभय अपहः ॥ ॥ विषयेषु गुणाध्यासात् पुंसः सङ्गः ततः भवेत् । सङ्गात्
    तत्र भवेत् कामः कामात् एव कलिः नॄणाम् ॥ ॥ कलेः दुर्विषहः क्रोधः तमः तं अनुवर्तते । तमसा ग्रस्यते पुंसः
    चेतना व्यापिनी द्रुतम् ॥ ॥ तया विरहितः साधो जन्तुः शून्याय कल्पते । ततः अस्य स्वार्थविभ्रंशः मूर्च्छितस्य
    मृतस्य च ॥ ॥ विषयाभिनिवेशेन न आत्मानं वेद न अपरम् । वृक्षजीविकया जीवन् व्यर्थं भस्त्र इव यः श्वसन्
    ॥ ॥ फलश्रुतिः इयं नॄणां न श्रेयः रोचनं परम् । श्रेयोविवक्षया प्रोक्तं यथा भैषज्यरोचनम् ॥ ॥ उत्पत्ति
    एव हि कामेषु प्राणेषु स्वजनेषु च । आसक्तमनसः मर्त्या आत्मनः अनर्थहेतुषु ॥ ॥ न तान् अविदुषः स्वार्थं
    भ्राम्यतः वृजिनाध्वनि । कथं युञ्ज्यात् पुनः तेषु तान् तमः विशतः बुधः ॥ ॥ एवं व्यवसितं केचित् अविज्ञाय
    कुबुद्धयः । फलश्रुतिं कुसुमितां न वेदज्ञाः वदन्ति हि ॥ ॥ कामिनः कृपणाः लुब्धाः पुष्पेषु फलबुद्धयः
    । अग्निमुग्धा धुमतान्ताः स्वं लोकं न विन्दन्ति ते ॥ ॥ न ते मां अङ्गः जानन्ति हृदिस्थं यः इदं यतः ।
    उक्थशस्त्राः हि असुतृपः यथा नीहारचक्षुषः ॥ ॥ ते मे मतं अविज्ञाय परोक्षं विषयात्मकाः । हिंसायां यदि
    रागः स्यात् यज्ञः एव न चोदना ॥ ॥ हिंसाविहाराः हि अलब्धैः पशुभिः स्वसुखेच्छया । यजन्ते देवताः यज्ञैः
    पितृभूतपतीन् खलाः ॥ ॥ स्वप्न् उपमं अमुं लोकं असन्तं श्रवणप्रियम् । आशिषः हृदि सङ्कल्प्य त्यजन्ति अर्थान्
    यथा वणिक् ॥ ॥ रजःसत्त्वतमोनिष्ठाः रजःसत्त्वतमोजुषः । उपासतः इन्द्रमुख्यान् देवादीन् न तथा एव माम्
    ॥ ॥ इष्ट्वा इह देवताः यज्ञैः गत्वा रंस्यामहे दिवि । तस्य अन्तः इह भूयास्मः महाशाला महाकुलाः ॥ ॥ एवं
    पुष्पितया वाचा व्याक्षिप्तमनसां नॄणाम् । मानिनान् च अतिस्तब्धानां मद्वार्ता अपि न रोचते ॥ ॥ वेदाः
    ब्रह्मात्मविषयाः त्रिकाण्डविषयाः इमे । परोक्षवादाः ऋषयः परोक्षं मम च प्रियम् ॥ ॥ शब्दब्रह्म सुदुर्बोधं
    प्राण इन्द्रिय मनोमयम् । अनन्तपारं गम्भीरं दुर्विगाह्यं समुद्रवत् ॥ ॥ मया उपबृंहितं भूम्ना ब्रह्मणा
    अनन्तशक्तिना । भूतेषु घोषरूपेण बिसेषु ऊर्ण इव लक्ष्यते ॥ ॥ यथा ऊर्णनाभिः हृदयात् ऊर्णां उद्वमते मुखात्
    । आकाशात् घोषवान् प्राणः मनसा स्पर्शरूपिणा ॥ ॥ छन्दोमयः अमृतमयः सहस्रपदवीं प्रभुः । ओङ्कारात् व्यञ्जित
    स्पर्श स्वर उष्म अन्तस्थ भूषिताम् ॥ ॥ विचित्रभाषाविततां छन्दोभिः चतुर उत्तरैः । अनन्तपारां बृहतीं
    सृजति आक्षिपते स्वयम् ॥ ॥ गायत्री उष्णिक् अनुष्टुप् च बृहती पङ्क्तिः एव च । त्रिष्टुप् जगती अतिच्छन्दः
    हि अत्यष्टि अतिजगत् विराट् ॥ ॥ किं विधत्ते किं आचष्टे किं अनूद्य विकल्पयेत् । इति अस्याः हृदयं लोके
    न अन्यः मत् वेद कश्चन ॥ ॥ मां विधत्ते अभिधत्ते मां विकल्प्य अपोह्यते तु अहम् । एतावान् सर्ववेदार्थः
    शब्दः आस्थाय मां भिदाम् । मायामात्रं अनूद्य अन्ते प्रतिषिध्य प्रसीदति ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे भगवद्द्धवसंवादे वेदत्रयविभागनिरूपणं नाम एकविंशोऽध्यायः ॥ ॥ अथ द्वाविंशः
    अध्यायः । उद्धवः उवाच । कति तत्त्वानि विश्वेश सङ्ख्यातानि ऋषिभिः प्रभो । नव एकादश पञ्च त्रीणि आत्थ
    त्वं इह शुश्रुम ॥ ॥ केचित् षड्विंशतिं प्राहुः अपरे पञ्चविंशतिम् । सप्त एके नव षट् केचित् चत्वारि एकादश
    अपरे । केचित् सप्तदश प्राहुः षोडश एके त्रयोदश ॥ ॥ एतावत् त्वं हि सङ्ख्यानां ऋषयः यत् विवक्षया । गायन्ति
    पृथक् आयुष्मन् इदं नः वक्तुं अर्हसि ॥ ॥ श्रीभगवान् उवाच । युक्तं च सन्ति सर्वत्र भाषन्ते ब्राह्मणाः
    यथा । मायां मदीयां उद्गृह्य वदतां किं नु दुर्घटम् ॥ ॥ न एतत् एवं यथा आत्थ त्वं यत् अहं वच्मि तत् तथा
    । एवं विवदतां हेतुं शक्तयः मे दुरत्ययाः ॥ ॥ यासां व्यतिकरात् आसीत् विकल्पः वदतां पदम् । प्राप्ते शमदमे
    अपि एति वादस्तमनु शाम्यति ॥ ॥ परस्परान् अनुप्रवेशात् तत्त्वानां पुरुषर्षभ । पौर्व अपर्य प्रसङ्ख्यानं
    यथा वक्तुः विवक्षितम् ॥ ॥ एकस्मिन् अपि दृश्यन्ते प्रविष्टानि इतराणि च । पूर्वस्मिन् वा परस्मिन् वा
    तत्त्वे तत्त्वानि सर्वशः ॥ ॥ पौर्व अपर्यं अतः अमीषां प्रसङ्ख्यानं अभीप्सताम् । यथा विविक्तं यत् वक्त्रं
    गृह्णीमः युक्तिसम्भवात् ॥ ॥ अनादि अविद्यायुक्तस्य पुरुषस्य आत्मवेदनम् । स्वतः न सम्भवात् अन्यः तत्त्वज्ञः
    ज्ञानदः भवेत् ॥ ॥ पुरुष ईश्वरयोः अत्र न वैलक्षण्यं अणु अपि । तत् अन्यकल्पनापार्था ज्ञानं च प्रकृतेः
    गुणः ॥ ॥ प्रकृतिः गुणसाम्यं वै प्रकृतेः न आत्मनः गुणाः । सत्त्वं रजः तमः इति स्थिति उत्पत्ति अन्तहेतवः
    ॥ ॥ सत्त्वं ज्ञानं रजः कर्म तमः अज्ञानं इह उच्यते । गुणव्यतिकरः कालः स्वभावः सूत्रं एव च ॥ ॥ पुरुषः
    प्रकृतिः व्यक्तं अहङ्कारः नभः अनिलः । ज्योतिः आपः क्षितिः इति तत्त्वानि उक्तानि मे नव ॥ ॥ श्रोत्रं
    त्वक् दर्शनं घ्राणः जिह्वा इति ज्ञानशक्तयः । वाक् पाणि उपस्थ पायु अङ्घ्रिः कर्माण्यङ्ग उभयं मनः ॥
    ॥ शब्दः स्पर्शः रसः गन्धः रूपं च इति अर्थजातयः । गति उक्ति उत्सर्ग शिल्पानि कर्म आयतन सिद्धयः ॥ ॥
    सर्ग आदौ प्रकृतिः हि अस्य कार्य कारण रूपिणी । सत्त्व आदिभिः गुणैः धत्ते पुरुषः अव्यक्तः ईक्षते ॥ ॥
    व्यक्त आदयः विकुर्वाणाः धातवः पुरुष ईक्षया । लब्धवीर्याः सृजन्ति अण्डं संहताः प्रकृतेः बलात् ॥ ॥ सप्त
    एव धातवः इति तत्र अर्थाः पञ्च खादयः । ज्ञानं आत्मा उभय आधारः ततः देह इन्द्रिय आसवः ॥ ॥ षड् इति अत्र
    अपि भूतानि पञ्च षष्ठः परः पुमान् । तैः युक्तः आत्मसम्भूतैः सृष्ट्वा इदं समुपाविशत् ॥ ॥ चत्वारि एव
    इति तत्र अपि तेजः आपः अन्नं आत्मनः । जातानि तैः इदं जातं जन्म अवयविनः खलु ॥ ॥ सङ्ख्याने सप्तदशके भूतमात्र
    इन्द्रियाणि च । पञ्चपञ्च एक मनसा आत्मा सप्तदशः स्मृतः ॥ ॥ तद्वत् षोडशसङ्ख्याने आत्मा एव मनः उच्यते
    । भूतेन्द्रियाणि पञ्च एव मनः आत्मा त्रयोदशः ॥ ॥ एकादशत्वः आत्मा असौ महाभूतेन्द्रियाणि च । अष्टौ प्रकृतयः
    च एव पुरुषः च नव इति अथ ॥ ॥ इति नाना प्रसङ्ख्यानं तत्त्वानां ऋषिभिः कृतम् । सर्वं न्याय्यं युक्तिमत्वात्
    विदुषां किं अशोभनम् ॥ ॥ उद्धवः उवाच । प्रकृतिः पुरुषः च उभौ यदि अपि आत्मविलक्षणौ । अन्योन्य अपाश्रयात्
    कृष्ण दृश्यते न भिदा तयोः । प्रकृतौ लक्ष्यते हि आत्मा प्रकृतिः च तथा आत्मनि ॥ ॥ एवं मे पुण्डरीकाक्ष
    महान्तं संशयं हृदि । छेत्तुं अर्हसि सर्वज्ञ वचोभिः नयनैपुणैः ॥ ॥ त्वत्तः ज्ञानं हि जीवानां प्रमोषः
    ते अत्र शक्तितः । त्वं एव हि आत्म मायाया गतिं वेत्थ न च अपरः ॥ ॥ श्रीभगवान् उवाच । प्रकृतिः पुरुषः
    च इति विकल्पः पुरुषर्षभ । एषः वैकारिकः सर्गः गुणव्यतिकरात्मकः ॥ ॥ मम अङ्ग माया गुणमयी अनेकधा विकल्पबुद्धीः
    च गुणैः विधत्ते । वैकारिकः त्रिविधः अध्यात्मं एकम् अथ अधिदैवं अधिभूतं अन्यत् ॥ ॥ दृक् रूपं आर्कं वपुः
    अत्र रन्ध्रे परस्परं सिध्यति यः स्वतः खे । आत्मा यत् एषं अपरः यः आद्यः स्वया अनुभूत्य अखिलसिद्धसिद्धिः
    । एवं त्वक् आदि श्रवणादि चक्षुः जिह्व आदि नास आदि च चित्तयुक्तम् ॥ ॥ यः असौ गुणक्षोभकृतौ विकारः प्रधानमूलात्
    महतः प्रसूतः । अहं त्रिवृत् मोहविकल्पहेतुः वैकारिकः तामसः ऐन्द्रियः च ॥ ॥ आत्मापरिज्ञानमयः विवादः
    हि अस्ति इति न अस्ति इति भिदार्थनिष्ठः । व्यर्थः अपि न एव उपरमेत पुंसां मत्तः परावृत्तधियां स्वलोकात्
    ॥ ॥ उद्धवः उवाच । त्वत्तः परावृत्तधियः स्वकृतैः कर्मभिः प्रभो । उच्च अवचान् यथा देहान् गृह्णन्ति विसृजन्ति
    च ॥ ॥ तत् मम आख्याहि गोविन्द दुर्विभाव्यं अनात्मभिः । न हि एतत् प्रायशः लोके विद्वांसः सन्ति वञ्चिताः
    ॥ ॥ श्रीभगवान् उवाच । मनः कर्ममयं नृणां इन्द्रियैः पञ्चभिः युतम् । लोकात् लोकं प्रयाति अन्यः आत्मा
    तत् अनुवर्तते ॥ ॥ ध्यायन् मनः अनुविषयान् दृष्टान् वा अनुश्रुतान् अथ । उद्यत् सीदत् कर्मतन्त्रं स्मृतिः
    तत् अनुशाम्यति ॥ ॥ विषय अभिनिवेशेन न आत्मानं यत् स्मरेत् पुनः । जन्तोः वै कस्यचित् हेतोः मृत्युः अत्यन्तविस्मृतिः
    ॥ ॥ जन्म तु आत्मतया पुंसः सर्वभावेन भूरिद । विषय स्वीकृतिं प्राहुः यथा स्वप्नमनोरथः ॥ ॥ स्वप्नं मनोरथं
    च इत्थं प्राक्तनं न स्मरति असौ । तत्र पूर्वं इव आत्मानं अपूर्वं च अनुपश्यति ॥ ॥ इन्द्रिय आयन सृष्ट्या
    इदं त्रैविध्यं भाति वस्तुनि । बहिः अन्तः भिदाहेतुः जनः असत् जनकृत् यथा ॥ ॥ नित्यदा हि अङ्गः भूतानि
    भवन्ति न भवन्ति च । कालेन अल्क्ष्यवेगेन सूक्ष्मत्वात् तत् न दृश्यते ॥ ॥ यथा अर्चिषां स्रोतसां च फलानां
    वा वनस्पतेः । तथा एव सर्वभूतानां वयः अवस्था आदयः कृताः ॥ ॥ सः अयं दीपः अर्चिषां यद्वत् स्रोतसां तत्
    इदं जलम् । सः अयं पुमान् इति नृणां मृषाः गीः धीः मृषा आयुषाम् ॥ ॥ मा स्वस्य कर्मबीजेन जायते सः अपि
    अयं पुमान् । म्रियते वामरः भ्रान्त्या यथा अग्निः दारु संयुतः ॥ ॥ निषेकगर्भजन्मानि बाल्यकौमारयौवनम्
    । वयोमध्यं जरा मृत्युः इति अवस्थाः तनोः नव ॥ ॥ एताः मनोरथमयीः हि अन्यस्य उच्चावचाः तनूः । गुणसङ्गात्
    उपादत्ते क्वचित् कश्चित् जहाति च ॥ ॥ आत्मनः पितृपुत्राभ्यां अनुमेयौ भवाप्ययौ । न भवाप्ययवस्तूनां अभिज्ञः
    द्वयलक्षणः ॥ ॥ तरोः बीजविपाकाभ्यां यः विद्वात् जन्मसंयमौ । तरोः विलक्षणः द्रष्टा एवं द्रष्टा तनोः
    पृथक् ॥ ॥ प्रकृतेः एवं आत्मानं अविविच्य अबुधः पुमान् । तत्त्वेन स्पर्शसम्मूढः संसारं प्रतिपद्यते ॥
    ॥ सत्त्वसङ्गात् ऋषीन् देवान् रजसा असुरमानुषान् । तमसा भूततिर्यक्त्वं भ्रामितः याति कर्मभिः ॥ ॥ नृत्यतः
    गायतः पश्यन् यथा एव अनुकरोति तान् । एवं बुद्धिगुणान् पश्यन् अनीहः अपि अनुकार्यते ॥ ॥ यथा अम्भसा प्रचलता
    तरवः अपि चलाः इव । चक्षुषा भ्राम्यमाणेन दृश्यते भ्रमति इव भूः ॥ ॥ यथा मनोरथधियः विषयानुभवः मृषा ।
    स्वप्नदृष्टाः च दाशार्ह तथा संसारः आत्मनः ॥ ॥ अर्थे हि अविद्यमाने अपि संसृतिः न निवर्तते । ध्यायतः
    विषयान् अस्य स्वप्ने अनर्थ आगमः यथा ॥ ॥ तस्मात् उद्धव मा भुङ्क्ष्व विषयान् असत् इन्द्रियैः । आत्मा
    अग्रहणनिर्भातं पश्य वैकल्पिकं भ्रमम् ॥ ॥ क्षिप्तः अवमानितः असद्भिः प्रलब्धः असूयितः अथवा । ताडितः
    सन्निबद्धः वा वृत्त्या वा परिहापितः ॥ ॥ निष्ठितः मूत्रितः बहुधा एवं प्रकम्पितः । श्रेयस्कामः कृच्छ्रगतः
    आत्मना आत्मानं उद्धरेत् ॥ ॥ उद्धवः उवाच । यथा एवं अनुबुद्ध्येयं वद नः वदतां वर । सुदुःसहं इमं मन्यः
    आत्मनि असत् अतिक्रमम् ॥ ॥ विदुषं अपि विश्वात्मन् प्रकृतिः हि बलीयसी । ऋते त्वत् धर्मनिरतान् शान्ताः
    ते चरणालयान् ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे द्वाविंशोऽध्यायः
    ॥ ॥ अथ त्रयोविंशः अध्यायः । बादरायणिः उवाच । सः एवं आशंसितः उद्धवेन भागवतमुख्येन दाशार्हमुख्यः । सभाजयन्
    बृत्यवचः मुकुन्दः तं आबभाषे श्रवणीयवीर्यः ॥ ॥ श्रीभगवान् उवाच । बर्हस्पत्य सः वै न अत्र साधुः वै दुर्जन्
    ईरितैः । दुरुक्तैः भिन्नं आत्मानं यः समाधातुं ईश्वरः ॥ ॥ न तथा तप्यते विद्धः पुमान् बाणैः सुमर्मगैः
    । यथा तुदन्ति मर्मस्थाः हि असतां परुषेषवः ॥ ॥ कथयन्ति महत्पुण्यं इतिहासं इह उद्धव । तं अहं वर्णयिष्यामि
    निबोध सुसमाहितः ॥ ॥ केनचित् भिक्षुणा गीतं परिभूतेन दुर्जनैः । स्मरताः धृतियुक्तेन विपाकं निजकर्मणाम्
    ॥ ॥ अवनिषु द्विजः कश्चित् आसीत् आढ्यतमः श्रिया । वार्तावृत्तिः कदर्यः तु कामी लुब्धः अतिकोपनः ॥ ॥
    ज्ञातयः अतिथयः तस्य वाङ्मात्रेण अपि न अर्चिताः । शून्य अवसथः आत्मा अपि काले कामैः अनर्चितः ॥ ॥ दुःशीलस्य
    कदर्यस्य द्रुह्यन्ते पुत्रबान्धवाः । दारा दुहितरः भृत्याः विषण्णाः न आचरन् प्रियम् ॥ ॥ तस्य एवं यक्षवित्तस्य
    च्युतस्य उभयलोकतः । धर्मकामविहीनस्य चुक्रुधुः पञ्चभागिनः ॥ ॥ तत् अवध्यान विस्रस्त पुण्य स्कन्धस्य
    भूरिद । अर्थः अपि अगच्छन् निधनं बहु आयास परिश्रमः ॥ ॥ ज्ञातयः जगृहुः किञ्चित् किञ्चित् अस्यवः उद्धव
    । दैवतः कालतः किञ्चित् ब्रह्मबन्धोः नृपार्थिवात् ॥ ॥ सः एवं द्रविणे नष्टे धर्मकामविवर्जितः । उपेक्षितः
    च स्वजनैः चिन्तां आप दुरत्ययाम् ॥ ॥ तस्य एवं ध्यायतः दीर्घं नष्टरायः तपस्विनः । खिद्यतः बाष्पकण्ठस्य
    निर्वेदः सुमहान् अभूत् ॥ ॥ सः च आह इदं अहो कष्टं वृथा आत्मा मे अनुतापितः । न धर्माय न कामाय यस्य अर्थ
    आयासः ईदृशः ॥ ॥ प्रायेण अर्थाः कदर्याणां न सुखाय कदाचन । इह च आत्मोपतापाय मृतस्य नरकाय च ॥ ॥ यशः यशस्विनां
    शुद्धं श्लाघ्याः ये गुणिनां गुणाः । लोभः स्वल्पः अपि तान् हन्ति श्वित्रः रूपं इव इप्सितम् ॥ ॥ अर्थस्य
    साधने सिद्धः उत्कर्षे रक्षणे व्यये । नाश उपभोगः आयासः त्रासः चिन्ता भ्रमः नृणाम् ॥ ॥ स्तेयं हिंसा
    अनृतं दम्भः कामः क्रोधः स्मयः मदः । भेदः वैरं अविश्वासः संस्पर्धा व्यसनानि च ॥ ॥ एते पञ्चदशान् अर्थाः
    हि अर्थमूलाः मताः नृणाम् । तस्मात् अनर्थं अर्थाख्यं श्रेयः अर्थी दूरतः त्यजेत् ॥ ॥ भिद्यन्ते भ्रातरः
    दाराः पितरः सुहृदः तथा । एकास्निग्धाः काकिणिना सद्यः सर्वे अरयः कृताः ॥ ॥ अर्थेन अल्पीयसा हि एते संरब्धा
    दीप्तं अन्यवः । त्यजन्ति आशु स्पृधः घ्नन्ति सहसा उत्सृज्य सौहृदम् ॥ ॥ लब्ध्वा जन्म अमरप्रार्थ्यं मानुष्यं
    तत् द्विज अग्र्यताम् । तत् अनादृत्य ये स्वार्थं घ्नन्ति यान्ति अशुभां गतिम् ॥ ॥ स्वर्ग अपवर्गयोः द्वारं
    प्राप्य लोकं इमं पुमान् । द्रविणे कः अनूषज्जेत मर्त्यः अनर्थस्य धामनि ॥ ॥ देवर्षि पितृ भूतानि ज्ञातीन्
    बन्धून् च भागिनः । असंविभज्य च आत्मानं यक्षवित्तः पतति अधः ॥ ॥ व्यर्थया अर्थेहया वित्तं प्रमत्तस्य
    वयः बलम् । कुशलाः येन सिध्यन्ति जरठः किं नु साधये ॥ ॥ कस्मात् सङ्क्लिश्यते विद्वान् व्यर्थया अर्थेहया
    असकृत् । कस्यचित् मायया नूनं लोकः अयं सुविमोहितः ॥ ॥ किं धनैः धनदैः वा किं कामैः वा कामदैः उत । मृत्युना
    ग्रस्यमानस्य कर्मभिः वा उत जन्मदैः ॥ ॥ नूनं मे भगवान् तुष्टः सर्वदेवमयः हरिः । येन नीतः दशां एतां
    निर्वेदः च आत्मनः प्लवः ॥ ॥ सः अहं कलौ अशेषेण शोषयिह्ह्ये अङ्गं आत्मनः । अप्रमत्तः अखिलस्वार्थे यदि
    स्यात् सिद्धः आत्मनि ॥ ॥ तत्र मां अनुमोदेरन् देवाः त्रिभुवनेश्वराः । मुहूर्तेन ब्रह्मलोकं खट्वाङ्गः
    समसाधयत् ॥ ॥ श्रीभगवान् उवाच । इति अभिप्रेत्य मनसा हि आवन्त्यः द्विजसत्तमः । उन्मुच्य हृदयग्रन्थीन्
    शान्तः भिक्षुः अभूत् मुनिः ॥ ॥ सः चचार महीं एतां संयत आत्मेन्द्रिय अनिलः । भिक्षार्थं नगर ग्रामान्
    असङ्गः अलक्षितः अविशत् ॥ ॥ तं वै प्रवयसं भिक्षुं अवधूतं असज्जनाः । दृष्ट्वा पर्यभवन् भद्रः बह्वीभिः
    परिभूतिभिः ॥ ॥ केचित् त्रिवेणुं जगृहुः एके पात्रं कमण्डलुम् । पीठं च एके अक्षसूत्रं च कन्थां चीराणि
    केचन ॥ ॥ प्रदाय च पुनः तानि दर्शितानि आददुः मुनेः । अन्नं च भैक्ष्यसम्पन्नं भुञ्जानस्य सरित् तटे ॥
    ॥ मूत्रयन्ति च पापिष्ठाः ष्ठीवन्ति अस्य च मूर्धनि । यतवाचं वाचयन्ति ताडयन्ति न वक्ति चेत् ॥ ॥ तर्जयन्ति
    अपरे वाग्भिः स्तेनः अयं इति वादिनः । बध्नन्ति रज्ज्वा तं केचित् बध्यतां बध्यतां इति ॥ ॥ क्षिपन्ति
    एके अवजानन्तः एषः धर्मध्वजः शठः । क्षीणवित्तः इमां वृत्तिं अग्रहीत् स्वजन उज्झितः ॥ ॥ अहो एषः महासारः
    धृतिमान् गिरिः आडिव । मौनेन साधयति अर्थं बकवत् दृढनिश्चयः ॥ ॥ इति एके विहसन्ति एनं एके दुर्वातयन्ति
    च । तं बबन्धुः निरुरुधुः यथा क्रीडनकं द्विजम् ॥ ॥ एवं सः भौतिकं दुःखं दैविकं दैहिकं च यत् । भोक्तव्यं
    आत्मनः दिष्टं प्राप्तं प्राप्तं अबुध्यत ॥ ॥ परिभूतः इमां गाथां अगायत नराधमैः । पातयद्भिः स्वधर्मस्थः
    धृतिं आस्थाय सात्विकीम् ॥ ॥ द्विजः उवाच । न अयं जनः मे सुखदुःखहेतुः न देवतात्मा ग्रहकर्मकालाः । मनः
    परं कारणं आमनन्ति संसारचक्रं परिवर्तयेत् यत् ॥ ॥ मनः गुणान् वै सृजते बलीयः ततः च कर्माणि विलक्षणानि
    । शुक्लानि कृष्णानि अथ लोहितानि तेभ्यः सवर्णाः सृतयः भवन्ति ॥ ॥ अनीहः आत्मा मनसा समीहता हिरण्मयः मत्सखः
    उद्विचष्टे । मनः स्वलिङ्गं परिगृह्य कामान् जुषन् निबद्धः गुणसङ्गतः असौ ॥ ॥ दानं स्वधर्मः नियमः यमः
    च श्रुतं च कर्माणि च सद्व्रतानि । सर्वे मनोनिग्रहलक्षणान्ताः परः हि योगः मनसः समाधि ॥ ॥ समाहितं यस्य
    मनः प्रशान्तम् दानादिभिः किं वद तस्य कृत्यम् । असंयतं यस्य मनः विनश्यत् दानादिभिः चेत् अपरं किमेभिः
    ॥ ॥ मनोवशे अन्ये हि अभवन् स्म देवाः मनः च न अन्यस्य वशं समेति । भीष्मः हि देवः सहसः सहीयान् युञ्ज्यात्
    वशे तं सः हि देवदेवः ॥ ॥ तं दुर्जयं शत्रुं असह्यवेगं मरुन्तुदं तत् न विजित्य केचित् । कुर्वन्ति असत्
    विग्रहं अत्र मर्त्यैः मित्राणि उदासीन रिपून् विमूढाः ॥ ॥ देहं मनोमात्रं इमं गृहीत्वा मम अहं इति अन्ध
    धियः मनुष्याः । एषः अहं अन्यः अयं इति भ्रमेण दुरन्तपारे तमसि भ्रमन्ति ॥ ॥ जनः तु हेतुः सुखदुःखयोः
    चेत् किं आत्मनः च अत्र ह भौमयोः तत् । जिह्वां क्वचित् सन्दशति स्वदद्भिः तत् वेदनायां कतमाय कुप्येत्
    ॥ ॥ दुःखस्य हेतुः यदि देवताः तु किं आत्मनः तत्र विकारयोः तत् । यत् अङ्गं अङ्गेन निहन्यते क्वचित् क्रुध्येत
    कस्मै पुरुषः स्वदेहे ॥ ॥ आत्मा यदि स्यात् सुखदुःखहेतुः किं अन्यतः तत्र निजस्वभावः । न हि आत्मनः अन्यत्
    यदि तत् मृषा स्यात् क्रुध्येत कस्मात् न सुखं न दुःखम् ॥ ॥ ग्रहाः निमित्तं सुखदुःखयोः चेत् किं आत्मनः
    अजस्य जनस्य ते वै । ग्रहैः ग्रहस्य एव वदन्ति पीडाम् क्रुध्येत कस्मै पुरुषः ततः अन्यः ॥ ॥ कर्माः तु
    हेतुः सुखदुःखयोः चेत् किं आत्मनः तत् हि जडाजडत्वे । देहः तु अचित्पुरुषः अयं सुपर्णः क्रुध्येत कस्मै
    न हि कर्ममूलम् ॥ ॥ कालः तु हेतुः सुखदुःखयोः चेत् किं आत्मनः तत्र तत् आत्मकः असौ । न अग्नेः हि तापः
    न हिमस्य तत् स्यात् क्रुध्येत कस्मै न परस्य द्वन्द्वम् ॥ ॥ न केनचित् क्व अपि कथञ्चन अस्य द्वन्द्व
    उपरागः परतः परस्य । यथाहमः संसृतिरूपिणः स्यात् एवं प्रबुद्धः न बिभेति भूतैः ॥ ॥ एतां सः आस्थाय परात्मनिष्ठाम्
    अध्यासितां पूर्वतमैः महर्षिभिः । अहं तरिष्यामि दुरन्तपारम् तमः मुकुन्द अङ्घ्रिनिषेवया एव ॥ ॥ श्रीभगवान्
    उवाच । निर्विद्य नष्टद्रविणः गतक्लमः प्रव्रज्य गां पर्यटमानः इत्थम् । निराकृतः असद्भिः अपि स्वधर्मात्
    अकम्पितः अमुं मुनिः आह गाथाम् ॥ ॥ सुखदुःखप्रदः न अन्यः पुरुषस्य आत्मविभ्रमः । मित्र उदासीनरिपवः संसारः
    तमसः कृतः ॥ ॥ तस्मात् सर्वात्मना तात निगृहाण मनो धिया । मयि आवेशितया युक्तः एतावान् योगसङ्ग्रहः ॥
    ॥ यः एतां भिक्षुणा गीतां ब्रह्मनिष्ठां समाहितः । धारयन् श्रावयन् श्रुण्वन् द्वन्द्वैः न एव अभिभूयते
    ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे बिक्षुगीतनिरूपणं
    नाम त्रयोविंशोऽध्यायः ॥ ॥ अथ चतुर्विंशोऽध्याः । श्रीभगवान् उवाच । अथ ते सम्प्रवक्ष्यामि साङ्ख्यं पूर्वैः
    विनिश्चितम् । यत् विज्ञाय पुमान् सद्यः जह्यात् वैकल्पिकं भ्रमम् ॥ ॥ आसीत् ज्ञानं अथः हि अर्थः एकं
    एव अविकल्पितम् । यदा विवेकनिपुणाः आदौ कृतयुगे अयुगे ॥ ॥ तत् मायाफलरूपेण केवलं निर्विकल्पितम् । वाङ्मनः
    अगोचरं सत्यं द्विधा समभवत् बृहत् ॥ ॥ तयोः एकतरः हि अर्थः प्रकृतिः सोभयात्मिका । ज्ञानं तु अन्यतरः
    भावः पुरुषः सः अभिधीयते ॥ ॥ तमः रजः सत्त्वं इति प्रकृतेः अभवन् गुणाः । मया प्रक्षोभ्यमाणायाः पुरुष
    अनुमतेन च ॥ ॥ तेभ्यः समभवत् सूत्रं महान् सूत्रेण संयुतः । ततः विकुर्वतः जातः यः अहङ्कारः विमोहनः ॥
    ॥ वैकारिकः तैजसः च तामसः च इति अहं त्रिवृत् । तन्मात्र इन्द्रिय मनसां कारणं चित् अचित् मयः ॥ ॥ अर्थः
    तन्मात्रिकात् जज्ञे तामसात् इन्द्रियाणि च । तैजसात् देवताः आसन् एकादश च वैकृतात् ॥ ॥ मया सञ्चोदिताः
    भावाः सर्वे संहति अकारिणः । अण्डं उत्पादयामासुः मम आयतनं उत्तमम् ॥ ॥ तस्मिन् अहं समभवं अण्डे सलिलसंस्थितौ
    । मम नाभ्यां अभूत् पद्मं विश्वाख्यं तत्र च आत्मभूः ॥ ॥ सः असृजत् तपसा युक्तः रजसा मत् अनुग्रहात् ।
    लोकान् सपालान् विश्वात्मा भूः भुवः स्वः इति त्रिधा ॥ ॥ देवानां ओकः आसीत् स्वः भूतानां च भुवः पदम्
    । मर्त्य आदीनां च भूः लोकः सिद्धानां त्रितयात् परम् ॥ ॥ अधः असुराणां नागानां भूमेः ओकः असृजत् प्रभुः
    । त्रिलोक्यां गतयः सर्वाः कर्मणां त्रिगुण आत्मनाम् ॥ ॥ योगस्य तपसः च एव न्यासस्य गतयः अमलाः । महः
    जनः तपः सत्यं भक्तियोगस्य मद्गतिः ॥ ॥ मया कालात्मना धात्रा कर्मयुक्तं इदं जगत् । गुणप्रवाहः एतस्मिन्
    उन्मज्जति निमज्जति ॥ ॥ अणुः बृहत् कृशः स्थूलः यः यः भावः प्रसिध्यति । सर्वः अपि उभयसंयुक्तः प्रकृत्या
    पुरुषेण च ॥ ॥ यः तु यस्य आदिः अन्तः च सः वै मध्यं च तस्य सन् । विकारः व्यवहारार्थः यथा तैजस पार्थिवाः
    ॥ ॥ यत् उपादाय पूर्वः तु भावः विकुरुते अपरम् । आदिः अन्तः यदा यस्य तत् सत्यं अभिधीयते ॥ ॥ प्रकृतिः
    हि अस्य उपादानं आधारः पुरुषः परः । सतः अभिव्यञ्जकः कालः ब्रह्म तत् त्रितयं तु अहम् ॥ ॥ सर्गः प्रवर्तते
    तावत् पौर्व अपर्येण नित्यशः । महान् गुणविसर्ग अर्थः स्थिति अन्तः यावत् ईक्षणम् ॥ ॥ विराट् मया आसाद्यमानः
    लोककल्पविकल्पकः । पञ्चत्वाय विशेषाय कल्पते भुवनैः सह ॥ ॥ अन्ने प्रलीयते मर्त्यं अन्नं धानासु लीयते
    । धानाः भूमौ प्रलीयन्ते भूमिः गन्धे प्रलीयते ॥ ॥ अप्सु प्रलीयन्ते गन्धः आपः च स्वगुणे रसे । लीयते
    ज्योतिषि रसः ज्योती रूपे प्रलीयते ॥ ॥ रूपं वायौ सः च स्पर्शे लीयते सः अपि च अम्बरे । अम्बरं शब्दतन्मात्रः
    इन्द्रियाणि स्वयोनिषु ॥ ॥ योनिः वैकारिके सौम्य लीयते मनसि ईश्वरे । शब्दः भूतादिं अपि एति भूतादिः महति
    प्रभुः ॥ ॥ सः लीयते महान् स्वेषु गुणेषु गुणवत्तमः । ते अव्यक्ते सम्प्रलीयन्ते तत्कले लीयते अव्यये
    ॥ ॥ कालः मायामये जीवे जीवः आत्मनि मयि अजे । आत्मा केवलः आत्मस्थः विकल्प अपाय लक्षणः ॥ ॥ एवं अन्वीक्षमाणस्य
    कथं वैकल्पिकः भ्रमः । मनसः हृदि तिष्ठेत व्योम्नि इव अर्क उदये तमः ॥ ॥ एषः साङ्ख्यविधिः प्रोक्तः संशयग्रन्थिभेदनः
    । प्रतिलोम अनुलोमाभ्यां परावरदृशा मया ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे
    श्रीकृष्णोद्धवसंवादे प्रकृतिपुरुषसाङ्ख्ययोगो नाम चतुर्विंशोऽध्यायः ॥ ॥ अथ पञ्चविंशोऽध्यायः । श्रीभगवानुवाच
    । गुणानां असमिश्राणां पुमान्येन यथा भवेत् । तन्मे पुरुषवर्य इअदं उपधारय शंसतः ॥ ॥ समः दमः तितिक्षा
    ईक्षा तपः सत्यं दया स्मृतिः । तुष्टिः त्यागः अस्पृहा श्रद्धा ह्रीः दया आदिः स्वनिर्वृतिः ॥ ॥ कामः
    ईहा मदः तृष्णा स्तम्भः आशीः भिदा सुखम् । मद उत्साहः यशः प्रीतिः हास्यं वीर्यं बल उद्यमः ॥ ॥ क्रोधः
    लोभः अनृतं हिंसा याञ्चा दम्भः क्लमः कलिः । शोकमोहौ विषादार्ती निद्रा आशा भीः अनुद्यमः ॥ ॥ सत्त्वस्य
    रजसः च एताः तमसः च अनुमूर्वशः । वृत्तयः वर्णितप्रायाः सन्निपातं अथः श्रुणु ॥ ॥ सन्निपातः तु अहं इति
    मम इति उद्धव या मतिः । व्यवहारः सन्निपातः मनोमात्र इन्द्रियासुभिः ॥ ॥ धर्मे च अर्थे च कामे च यदा असौ
    परिनिष्ठितः । गुणानां सन्निकर्षः अयं श्रद्धाः अतिधनावहः ॥ ॥ प्रवृत्तिलक्षणे निष्ठा पुमान् यः हि गृहाश्रमे
    । स्वधर्मे च अनुतिष्ठेत गुणानां समितिः हि सा ॥ ॥ पुरुषं सत्त्वसंयुक्तं अनुमीयात् शम आदिभिः । कामादिभी
    रजोयुक्तं क्रोधाद्यैः तमसा युतम् ॥ ॥ यदा भजति मां भक्त्या निरपेक्षः स्वकर्मभिः । तं सत्त्वप्रकृतिं
    विद्यात् पुरुषं स्त्रियं एव वा ॥ ॥ यदा आशिषः आशास्य मां भजेत स्वकर्मभिः । तं रजःप्रकृतिं विद्यात्
    हिंसां आशास्य तामसम् ॥ ॥ सत्त्वं रजः तमः इति गुणाः जीवस्य न एव मे । चित्तजा यैः तु भूतानां सज्जमानः
    निबध्यते ॥ ॥ यदेतरौ जयेत् सत्त्वं भास्वरं विशदं शिवम् । तदा सुखेन युज्येत धर्मज्ञान आदिभिः पुमान्
    ॥ ॥ यदा जयेत् तमः सत्त्वं रजः सङ्गं भिदा चलम् । तदा दुःखेन युज्येत कर्मणा यशसा श्रिया ॥ ॥ यदा जयेत्
    रजः सत्त्वं तमः मूढः लयं जडम् । युज्येत शोकमोहाभ्यां निद्रया हिंसया आशया ॥ ॥ यदा चित्तं प्रसीदेत इन्द्रियाणां
    च निर्वृतिः । देहे अभयं मनोसङ्गं तत् सत्त्वं विद्धि मत्पदम् ॥ ॥ विकुर्वन् क्रियया च अधीर निर्वृतिः
    च चेतसाम् । गात्रास्वास्थ्यं मनः भ्रान्तं रजः एतैः निशामय ॥ ॥ सीदत् चित्तं विलीयेत चेतसः ग्रहणे अक्षमम्
    । मनः नष्टं तमः ग्लानिः तमः तत् उपधारय ॥ ॥ एधमाने गुणे सत्त्वे देवानां बलं एधते । असुराणां च रजसि
    तमसि उद्धव रक्षसाम् ॥ ॥ सत्त्वात् जगरणं विद्यात् रजसा स्वप्नं आदिशेत् । प्रस्वापं तमसा जन्तोः तुरीयं
    त्रिषु सन्ततम् ॥ ॥ उपर्युपरि गच्छन्ति सत्त्वेन आब्रह्मणः जनाः । तमसा अधः अधः आमुख्यात् रजसा अन्तरचारिणः
    ॥ ॥ सत्त्वे प्रलीनाः स्वः यान्ति नरलोकं रजोलयाः । तमोलयाः तु निरयं यान्ति मां एव निर्गुणाः ॥ ॥ मदर्पणं
    निष्फलं वा सात्विकं निजकर्म तत् । राजसं फलसङ्कल्पं हिंसाप्रायादि तामसम् ॥ ॥ कैवल्यं सात्विकं ज्ञानं
    रजः वैकल्पिकं च यत् । प्राकृतं तामसं ज्ञानं मन्निष्ठं निर्गुणं स्मृतम् ॥ ॥ वनं तु सात्विकः वासः ग्रामः
    राजसः उच्यते । तामसं द्यूतसदनं मन्निकेतनं तु निर्गुणम् ॥ ॥ सात्विकः कारकः असङ्गी रागान्धः राजसः स्मृतः
    । तामसः स्मृतिविभ्रष्टः निर्गुणः मदपाश्रयः ॥ ॥ सात्त्विकी आध्यात्मिकी श्रद्धा कर्मश्रद्धा तु राजसी
    । तामस्यधर्मे या श्रद्धा मत्सेवायां तु निर्गुणा ॥ ॥ पथ्यं पूतं अनायः तं आहार्यं सात्त्विकं स्मृतम्
    । राजसं च इन्द्रियप्रेष्ठं तामसं च आर्तिद अशुचि ॥ ॥ सात्त्विकं सुखं आत्मोत्थं विषयोत्थं तु राजसम्
    । तामसं मोहदैनोत्थं निर्गुणं मदपाश्रयम् ॥ ॥ द्रव्यं देशः फलं कालः ज्ञानं कर्म च कारकाः । श्रद्धा अवस्था
    आकृतिः निष्ठा त्रैगुण्यः सर्वः एव हि ॥ ॥ सर्वे गुणमयाः भावाः पुरुष अव्यक्त धिष्ठिताः ॥ ॥ एताः संसृतयः
    पुंसः गुणकर्मनिबन्धनाः । येन इमे निर्जिताः सौम्य गुणाः जीवेन चित्तजाः । भक्तियोगेन मन्निष्ठः मद्भावाय
    प्रपद्यते ॥ ॥ तस्मात् अहं इमं लब्ध्वा ज्ञानविज्ञानसम्भवम् । गुणसङ्गं विनिर्धूय मां भजन्तु विचक्षणाः
    ॥ ॥ निःसङ्गः मां भजेत् विद्वान् अप्रमत्तः जितेन्द्रियः । रजः तमः च अभिजयेत् सत्त्वसंसेवया मुनिः ॥
    ॥ सत्त्वं च अभिजयेत् युक्तः नैरपेक्ष्येण शान्तधीः । सम्पद्यते गुणैः मुक्तः जीवः जीवं विहाय माम् ॥
    ॥ जीवः जीवविनिर्मुक्तः गुणैः च आशयसम्भवैः । मया एव ब्रह्मणा पूर्णः न बहिः न अन्तरः चरेत् ॥ ॥ इति श्रीमद्भागवते
    महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे गुणनिर्गुणनिरूपणं नाम पञ्चविंशोऽध्यायः
    ॥ ॥ अथ षड्विंशोऽध्यायः । श्रीभगवान् उवाच । मत् लक्षणं इमं कायं लब्ध्वा मद्धर्मः आस्थितः । आनन्दं परमात्मानं
    आत्मस्थं समुपैति माम् ॥ ॥ गुणमय्याः जीवयोन्याः विमुक्तः ज्ञाननिष्ठया । गुणेषु मायामात्रेषु दृश्यमानेषु
    अवस्तुतः । वर्तमानः अपि न पुमान् युज्यते अवस्तुभिः गुणैः ॥ ॥ सङ्गं न कुर्यात् असतां शिश्न उदर तृपां
    क्वचित् । तस्य अनुगतः तमसि अन्धे पतति अन्ध अनुगान्धवत् ॥ ॥ ऐलः सम्राट् इमां गाथां अगायत बृहच्छ्रवाः
    । उर्वशी विरहात् मुह्यन् निर्विण्णः शोकसंयमे ॥ ॥ त्यक्त्वा आत्मानं व्रजन्तीं तां नग्नः उन्मत्तवत्
    नृपः । विलपन् अन्वगात् जाये घोरे तिष्ठ इति विक्लवः ॥ ॥ कामान् अतृप्तः अनुजुषन् क्षुल्लकान् वर्षयामिनीः
    । न वेद यान्तीः न अयान्तीः उर्वशी आकृष्टचेअतनः ॥ ॥ ऐलः उवाच । अहो मे मोहविस्तारः कामकष्मलचेतसः । देव्याः
    गृहीतकण्ठस्य न आयुःखण्डाः इमे स्मृताः ॥ ॥ न अहं वेद अभिनिर्मुक्तः सूर्यः वा अभ्युदितः अमुया । मुषितः
    वर्षपूगानां बत अहानि गतानि उत ॥ ॥ अहो मे आत्मसम्मोहः येन आत्मा योषितां कृतः । क्रीडामृगः चक्रवर्ती
    नरदेवशिखामणिः ॥ ॥ सपरिच्छदं आत्मानं हित्वा तृणं इव ईश्वरम् । यान्तीं स्त्रियं च अन्वगमं नग्नः उन्मत्तवत्
    रुदन् ॥ ॥ कुतः तस्य अनुभावः स्यात् तेजः ईशत्वं एव वा । यः अन्वगच्छं स्त्रियं यान्तीं खरवत् पादताडितः
    ॥ ॥ किं विद्यया किं तपसा किं त्यागेन श्रुतेन वा । किं विविक्तेन मौनेन स्त्रीभिः यस्य मनः हृतम् ॥ ॥
    स्वार्थस्य अकोविदं धिङ् मां मूर्खं पण्डित मानिनम् । यः अहं ईश्वरतां प्राप्य स्त्रीभिः गो खरवत् जितः
    ॥ ॥ सेवतः वर्षपूगात् मे उर्वश्यः अधरासवम् । न तृप्यति आत्मभूः कामः वह्निः आहुतिभिः यथा ॥ ॥ पुंश्चल्या
    अपहृतं चित्तं कोन्वन्यः मोचितुं प्रभुः । आत्मारामेश्वरं ऋते भगवन्तं अधोक्षजम् ॥ ॥ बोधितस्य अपि देव्या
    मे सूक्तवाक्येन दुर्मतेः । मनोगतः महामोहः न अपयाति अजितात्मनः ॥ ॥ किं एतया नः अपकृतं रज्ज्वा वा सर्पचेतसः
    । रज्जुस्वरूप अविदुषः यः अहं यत् अजितेन्द्रियः ॥ ॥ क्व अयं मलोमसः कायः दौर्गन्धि आदि आत्मकः अशुचिः
    । क्व गुणाः सौमनस्य आद्याः हि अध्यासः अविद्यया कृतः ॥ ॥ पित्रोः किं स्वं नु भार्यायाः स्वामिनः अग्नेः
    श्वगृध्रयोः । किं आत्मनः किं सुहृदां इति यः न अवसीयते ॥ ॥ तस्मिन् कलेवरे अमेध्ये तुच्छनिष्ठे विषज्जते
    । अहो सुभद्रं सुनसं सुस्मितं च मुखं स्त्रियः ॥ ॥ त्वङ् मांस रुधिर स्नायु मेदो मज्जा अस्थि संहतौ ।
    विण्मूत्रपूये रमतां कृमीणां कियत् अन्तरम् ॥ ॥ अथ अपि न उपसज्जेत स्त्रीषु स्त्रैणेषु च अर्थवित् । विषय
    इन्द्रिय संयोगात् मनः क्षुभ्यति न अन्यथा ॥ ॥ अदृष्टात् अश्रुतात् भावात् न भावः उपजायते । असम्प्रयुञ्जतः
    प्राणान् शाम्यति स्तिमितं मनः ॥ ॥ तस्मात् सङ्गः न कर्तव्यः स्त्रीषु स्त्रैणेषु च इन्द्रियैः । विदुषां
    च अपि अविश्रब्धः षड्वर्गः किमु मादृशाम् ॥ ॥ श्रीभगवान् उवाच । एवं प्रगायन् नृपदेवदेवः सः उर्वशीलोकं
    अथः विहाय । आत्मानं आत्मनि अवगम्य मां वै उपारमत् ज्ञानविधूतमोहः ॥ ॥ ततः दुःसङ्गं उत्सृज्य सत्सु सज्जेत
    बुद्धिमान् । सन्तः एतस्य छिन्दन्ति मनोव्यासङ्गमुक्तिभिः ॥ ॥ सन्तः अनपेक्षाः मच्चित्ताः प्रशान्ताः
    समदर्शिनः । निर्ममाः निरहङ्काराः निर्द्वन्द्वाः निष्परिग्रहाः ॥ ॥ तेषु नित्यं महाभागः महाभागेषु मत्कथाः
    । सम्भवन्ति हिता नॄणां जुषतां प्रपुनन्ति अघम् ॥ ॥ ताः ये श्रुण्वन्ति गायन्ति हि अनुमोदन्ति च अदृताः
    । मत्पराः श्रद्दधानाः च भक्तिं विन्दन्ति ते मयि ॥ ॥ भक्तिं लब्धवतः साधोः किं अन्यत् अवशिष्यते । मयि
    अनन्तगुणे ब्रह्मणि आनन्द अनुभव आत्मनि ॥ ॥ यथा उपश्रयमाणस्य भगवन्तं विभावसुम् । शीतं भयं तमः अपि एति
    साधून् संसेवतः तथा ॥ ॥ निमज्ज्य उन्मज्ज्यतां घोरे भवाब्धौ परम अयनम् । सन्तः ब्रह्मविदः शान्ताः नौः
    दृढ इव अप्सु मज्जताम् ॥ ॥ अन्नं हि प्राणिनां प्राणः आर्तानां शरणं तु अहम् । धर्मः वित्तं नृणां प्रेत्य
    सन्तः अर्वाक् बिभ्यतः अरणम् ॥ ॥ सन्तः दिशन्ति चक्षूंषि बहिः अर्कः समुत्थितः । देवताः बान्धवाः सन्तः
    सन्तः आत्मा अहं एव च ॥ ॥ वैतसेनः ततः अपि एवं उर्वश्या लोकनिःस्पृहः । मुक्तसङ्गः महीं एतां आत्मारामः
    चचार ह ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे ऐलगीतं
    नाम षड्विंशोऽध्यायः ॥ ॥ अथ सप्तविंशोऽध्यायः । उद्धवः उवाच । क्रियायोगं समाचक्ष्व भवत् आराधनं प्रभो
    । यस्मात् त्वां ये यथा अर्चन्ति सात्वताः सात्वतर्षभ ॥ ॥ एतत् वदन्ति मुनयः मुहुः निःश्रेयसं नृणाम्
    । नारदः भगवान् व्यासः आचार्यः अङ्गिरसः सुतः ॥ ॥ निःसृतं ते मुखाम्भोजाद्यत् आह भगवान् अजः । पुत्रेभ्यः
    भृगुमुख्येभ्यः देव्यै च भगवान् भवः ॥ ॥ एतत् वै सर्ववर्णानां आश्रमाणां च सम्मतम् । श्रेयसां उत्तमं
    मन्ये स्त्रीशूद्राणां च मानद ॥ ॥ एतत् कमलपत्राक्ष कर्मबन्धविमोचनम् । भक्ताय च अनुरक्ताय ब्रूहि विश्वेश्वर
    ईश्वर ॥ ॥ श्रीभगवान् उवाच । नहि अन्तः अनन्तपारस्य कर्मकाण्डस्य च उद्धव । सङ्क्षिप्तं वर्णयिष्यामि
    यथावत् अनुपूर्वशः ॥ ॥ वैदिकः तान्त्रिकः मिश्रः इति मे त्रिविधः मखः । त्रयाणां ईप्सितेन एव विधिना मां
    समर्चयेत् ॥ ॥ यदा स्वनिगमेन उक्तं द्विजत्वं प्राप्य पूरुषः । यथा यजेत मां भक्त्या श्रद्धया तत् निबोध
    मे ॥ ॥ अर्चायां स्थण्डिले अग्नौ वा सूर्ये वा अप्सु हृदि द्विजः । द्रव्येण भक्तियुक्तः अर्चेत् स्वगुरुं
    मां अमायया ॥ ॥ पूर्वं स्नानं प्रकुर्वीत धौतदन्तः अङ्गशुद्धये । उभयैः अपि च स्नानं मन्त्रैः मृद्ग्रहणादिना
    ॥ ॥ सन्ध्या उपास्ति आदि कर्माणि वेदेन अचोदितानि मे । पूजां तैः कल्पयेत् सम्यक् सङ्कल्पः कर्मपावनीम्
    ॥ ॥ शैली दारुमयी लौही लेप्या लेख्या च सैकती । मनोमयी मणिमयी प्रतिमा अष्टविधा स्मृता ॥ ॥ चल अचल इति
    द्विविधा प्रतिष्ठा जीवमन्दिरम् । उद्वास आवाहने न स्तः स्थिरायां उद्धव अर्चने ॥ ॥ अस्थिरायां विकल्पः
    स्यात् स्थण्डिले तु भवेत् द्वयम् । स्नपनं तु अविलेप्यायां अन्यत्र परिमार्जनम् ॥ ॥ द्रव्यैः प्रसिद्ध्यैः
    मत् यागः प्रतिमादिषु अमायिनः । भक्तस्य च यथालब्धैः हृदि भावेन च एव हि ॥ ॥ स्नान अलङ्करणं प्रेष्ठं
    अर्चायां एव तु उद्धव । स्थण्डिले तत्त्वविन्यासः वह्नौ आज्यप्लुतं हविः ॥ ॥ सूर्ये च अभ्यर्हणं प्रेष्ठं
    सलिले सलिल आदिभिः । श्रद्धया उपाहृतं प्रेष्ठं भक्तेन मम वारि अपि ॥ ॥ भूर्यपि अभक्त उपहृतं न मे तोषाय
    कल्पते । गन्धः धूपः सुमनसः दीपः अन्न आद्य च किं पुनः ॥ ॥ शुचिः सम्भृतसम्भारः प्राक् दर्भैः कल्पित
    आसनः । आसीनः प्राक् उदक् वा अर्चेत् अर्चायां अथ सम्मुखः ॥ ॥ कृतन्यासः कृतन्यासां मदर्चां पाणिना मृजेत्
    । कलशं प्रोक्षणीयं च यथावत् उपसाधयेत् ॥ ॥ तत् अद्भिः देवयजनं द्रव्याणि आत्मानं एव च । प्रोक्ष्य पात्राणि
    त्रीणि अद्भिः तैः तैः द्रव्यैः च साधयेत् ॥ ॥ पाद्य अर्घ आचमनीयार्थं त्रीणि पात्राणि दैशिकः । हृदा
    शीर्ष्णा अथ शिखया गायत्र्या च अभिमन्त्रयेत् ॥ ॥ पिण्डे वायु अग्नि संशुद्धे हृत्पद्मस्थां परां मम ।
    अण्वीं जीवकलां ध्यायेत् नाद अन्ते सिद्धभाविताम् ॥ ॥ तया आत्मभूतया पिण्डे व्याप्ते सम्पूज्य तन्मयः
    । आवाह्य अर्च आदिषु स्थाप्य न्यस्त अङ्गं मां प्रपूजयेत् ॥ ॥ पाद्य उपस्पर्श अर्हण आदीन् उपचारान् प्रकल्पयेत्
    । धर्मादिभिः च नवभिः कल्पयित्वा आसनं मम ॥ ॥ पद्मं अष्टदलं तत्र कर्णिकाकेसर उज्ज्वलम् । उभाभ्यां वेदतन्त्राभ्यां
    मह्यं तु उभयसिद्धये ॥ ॥ सुदर्शनं पाञ्चजन्यं गदासीषुधनुः हलान् । मुसलं कौस्तुभं मालां श्रीवत्सं च अनुपूजयेत्
    ॥ ॥ नन्दं सुनन्दं गरुडं प्रचण्डं चण्डं एव च । महाबलं बलं च एव कुमुदं कुमुदेक्षणम् ॥ ॥ दुर्गां विनायकं
    व्यासं विष्वक्सेनं गुरून् सुरान् । स्वे स्वे स्थाने तु अभिमुखान् पूजयेत् प्रोक्षण आदिभिः ॥ ॥ चन्दन
    उशीर कर्पूर कुङ्कुम अगरु वासितैः । सलिलैः स्नापयेत् मन्त्रैः नित्यदा विभवे सति ॥ ॥ स्वर्णघर्म अनुवाकेन
    महापुरुषविद्यया । पौरुषेण अपि सूक्तेन सामभीः राजनादिभिः ॥ ॥ वस्त्र उपवीत आभरण पत्र स्रक् गन्ध लेपनैः
    । अलङ्कुर्वीत सप्रेम मद्भक्तः मां यथा उचितम् ॥ ॥ पाद्यं आचमनीयं च गन्धं सुमनसः अक्षतान् । धूप दीप
    उपहार्याणि दद्यात् मे श्रद्धया अर्चकः ॥ ॥ गुडपायससर्पींषि शष्कुलि आपूप मोदकान् । संयाव दधि सूपां च
    नैवेद्यं सति कल्पयेत् ॥ ॥ अभ्यङ्ग उन्मर्दन आदर्श दन्तधौ अभिषेचनम् । अन्नद्य गीत नृत्यादि पर्वणि स्युः
    उतान्वहम् ॥ ॥ विधिना विहिते कुण्डे मेखलागर्तवेदिभिः । अग्निं आधाय परितः समूहेत् पाणिना उदितम् ॥ ॥
    परिस्तीर्य अथ पर्युक्षेत् अन्वाधाय यथाविधि । प्रोक्षण्या आसाद्य द्रव्याणि प्रोक्ष्याग्नौ भावयेत माम्
    ॥ ॥ तप्तजाम्बूनदप्रख्यं शङ्खचक्रगदाम्बुजैः । लसत् चतुर्भुजं शान्तं पद्मकिञ्जल्कवाससम् ॥ ॥ स्फुरत्
    किरीट कटक कटिसूत्रवर अङ्गदम् । श्रीवत्सवक्षसं भ्राजत् कौस्तुभं वनमालिनम् ॥ ॥ ध्यायन् अभ्यर्च्य दारूणि
    हविषा अभिघृतानि च । प्रास्य आज्यभागौ आघारौ दत्त्वा च आज्यप्लुतं हविः ॥ ॥ जुहुयात् मूलमन्त्रेण षोडशर्च
    अवदानतः । धर्मादिभ्यः यथान्यायं मन्त्रैः स्विष्टिकृतं बुधः ॥ ॥ अभ्यर्च्य अथ नमस्कृत्य पार्षदेभ्यः
    बलिं हरेत् । मूलमन्त्रं जपेत् ब्रह्म स्मरन् नारायण आत्मकम् ॥ ॥ दत्त्वा आचमनं उच्छेषं विष्वक्सेनाय
    कल्पयेत् । मुखवासं सुरभिमत् ताम्बूलाद्यं अथ अर्हयेत् ॥ ॥ उपगायन् गृणन् नृत्यन् कर्माणि अभिनयन् मम
    । मत्कथाः श्रावयन् श्रुण्वन् मुहूर्तं क्षणिकः भवेत् ॥ । स्तवैः उच्चावचैः स्तोत्रैः पौराणैः प्रकृतैः
    अपि । स्तुत्वा प्रसीद भगवन् इति वन्देत दण्डवत् ॥ ॥ शिरः मत् पादयोः कृत्वा बाहुभ्यां च परस्परम् । प्रपन्नं
    पाहि मां ईश भीतं मृत्युग्रह अर्णवात् ॥ ॥ इति शेषां मया दत्तां शिरसि आधाय सादरम् । उद्वासयेत् चेत्
    उद्वास्यं ज्योतिः ज्योतिषि तत् पुनः ॥ ॥ अर्चादिषु यदा यत्र श्रद्धा मां तत्र च अर्चयेत् । सर्वभूतेषु
    आत्मनि च सर्व आत्मा अहं अवस्थितः ॥ ॥ एवं क्रियायोगपथैः पुमान् वैदिकतान्त्रिकैः । अर्चन् उभयतः सिद्धिं
    मत्तः विन्दति अभीप्सिताम् ॥ ॥ मदर्चां सम्प्रतिष्ठाप्य मन्दिरं कारयेत् दृढम् । पुष्प उद्यानानि रम्याणि
    पूजा यात्रा उत्सव आश्रितान् ॥ ॥ पूजादीनां प्रवाहार्थं महापर्वसु अथ अन्वहम् । क्षेत्रापणपुरग्रामान्
    दत्त्वा मत् सार्ष्टितां इयात् ॥ ॥ प्रतिष्ठया सार्वभौमंसद्मना भुवनत्रयम् । पूजादिना ब्रह्मलोकं त्रिभिः
    मत् साम्यतां इयात् ॥ ॥ मां एव नैरपेक्ष्येण भक्तियोगेन विन्दति । भक्तियोगं सः लभते एवं यः पूजयेत माम्
    ॥ ॥ यः स्वदत्तां परैः दत्तं हरेत सुरविप्रयोः । वृत्तिं सः जायते विड्भुक् वर्षाणां अयुतायुतम् ॥ ॥ कर्तुः
    च सारथेः हेतोः अनुमोदितुः एव च । कर्मणां भागिनः प्रेत्य भूयः भूयसि तत्फलम् ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे श्रीकृष्णोद्धवसंवादे सप्तविंशोऽध्यायः ॥ ॥ अथ अष्टविंशः अध्यायः ।
    श्रीभगवान् उवाच । परस्वभावकर्माणि न प्रशंसेत् न गर्हयेत् । विश्वं एकात्मकं पश्यन् प्रकृत्या पुरुषेण
    च ॥ ॥ परस्वभावकर्माणि यः प्रशंसति निन्दति । सः आशु भ्रश्यते स्वार्थात् असत्य अभिनिवेशतः ॥ ॥ तैजसे
    निद्रया आपन्ने पिण्डस्थः नष्टचेतनः । मायां प्राप्नोति मृत्युं वा तद्वत् नानार्थदृक् पुमान् ॥ ॥ किं
    भद्रं किं अभद्रं वा द्वैतस्य अवस्तुनः कियत् । वाचा उदितं तत् अनृतं मनसा ध्यातं एव च ॥ ॥ छायाप्रत्याह्वयाभासा
    हि असन्तः अपि अर्थकारिणः । एवं देहादयः भावाः यच्छन्ति आमृत्युतः भयम् ॥ ॥ आत्मा एव तत् इदं विश्वं सृज्यते
    सृजति प्रभुः । त्रायते त्राति विश्वात्मा ह्रियते हरति ईश्वरः ॥ ॥ तस्मात् नहि आत्मनः अन्यस्मात् अन्यः
    भावः निरूपितः । निरूपितेयं त्रिविधा निर्मूला भातिः आत्मनि । इदं गुणमयं विद्धि त्रिविधं मायया कृतम्
    ॥ ॥ एतत् विद्वान् मदुदितं ज्ञानविज्ञाननैपुणम् । न निन्दति न च स्तौति लोके चरति सूर्यवत् ॥ ॥ प्रत्यक्षेण
    अनुमानेन निगमेन आत्मसंविदा । आदि अन्तवत् असत् ज्ञात्वा निःसङ्गः विचरेत् इह ॥ ॥ उद्धवः उवाच । न एव
    आत्मनः न देहस्य संसृतिः द्रष्टृदृश्ययोः । अनात्मस्वदृशोः ईश कस्य स्यात् उपलभ्यते ॥ ॥ आत्मा अव्ययः
    अगुणः शुद्धः स्वयञ्ज्योतिः अनावृतः । अग्निवत् दारुवत् देहः कस्य इह संसृतिः ॥ ॥ श्रीभगवान् उवाच । यावत्
    देह इन्द्रिय प्राणैः आत्मनः सन्निकर्षणम् । संसारः फलवान् तावत् अपार्थः अपि अविवेकिनः ॥ ॥ अर्थे हि
    अविद्यमाने अपि संसृतिः न निवर्तते । ध्यायतः विषयान् अस्य स्वप्ने अनर्थ आगमः यथा ॥ ॥ यथा हि अप्रतिबुद्धस्य
    प्रस्वापः बहु अनर्थभृत् । सः एव प्रतिबुद्धस्य न वै मोहाय कल्पते ॥ ॥ शोक हर्ष भय क्रोध लोभ मोह स्पृहादयः
    । अहङ्कारस्य दृश्यन्ते जन्म मृत्युः च न आत्मनः ॥ ॥ देह इन्द्रिय प्राण मनः अभिमानः जीवः अन्तरात्मा
    गुणकर्म मूर्तिः । सूत्रं महान् इति उरुधा इव गीतः संसारः आधावति कालतन्त्रः ॥ ॥ अमूलं एतत् बहुरूप रूपितं
    मनोवचःप्राणशरीरकर्म । ज्ञानासिना उपासनया शितेन छित्त्वा मुनिः गां विचरति अतृष्णः ॥ ॥ ज्ञानं विवेकः
    निगमः तपः च प्रत्यक्षं ऐतिह्यं अथ अनुमानम् । आदि अन्तयोः अस्य यत् एव केवलम् कालः च हेतुः च तत् एव
    मध्ये ॥ ॥ यथा हिरण्यं स्वकृतं पुरस्तात् पश्चात् च सर्वस्य हिरण्मयस्य । तत् एव मध्ये व्यवहार्यमाणम्
    नानापदेशैः अहं अस्य तद्वत् ॥ ॥ विज्ञानं एतत् त्रियवस्तं अङ्ग गुणत्रयं कारण कार्य कर्तृ । समन्वयेन
    व्यतिरेकतः च येन एव तुर्येण तत् एव सत्यम् ॥ ॥ न यत् पुरस्तात् उत यत् न पश्चात् मध्ये च तत् न व्यपदेशमात्रम्
    । भूतं प्रसिद्धं च परेण यद्यत् तत् एव तत् स्यात् इति मे मनीषा ॥ ॥ अविद्यमानः अपि अवभासते यः वैकारिकः
    राजससर्गः एषः । ब्रह्म स्वयञ्ज्योतिः अतः विभाति ब्रह्म इन्द्रिय अर्थ आत्म विकार चित्रम् ॥ ॥ एवं स्फुटं
    ब्रह्मविवेकहेतुभिः परापवादेन विशारदेन । छित्त्वा आत्मसन्देहं उपारमेत स्वानन्दतुष्टः अखिल कामुकेभ्यः
    ॥ ॥ न आत्मा वपुः पार्थिवं इन्द्रियाणि देवाः हि असुः वायुजलं हुताशः । मनः अन्नमात्रं धिषणा च सत्त्वम्
    अहङ्कृतिः खं क्षितिः अर्थसाम्यम् ॥ ॥ समाहितैः कः करणैः गुणात्मभिः गुणः भवेत् मत्सुविविक्तधाम्नः ।
    विक्षिप्यमाणैः उत किं न दूषणम् घनैः उपेतैः विगतैः रवेः किम् ॥ ॥ यथा नभः वायु अनल अम्बु भू गुणैः गतागतैः
    वर्तुगुणैः न सज्जते । तथा अक्षरं सत्त्व रजः तमः मलैः अहम्मतेः संसृतिहेतुभिः परम् ॥ ॥ तथापि सङ्गः परिवर्जनीयः
    गुणेषु मायारचितेषु तावत् । मद्भक्तियोगेन दृढेन यावत् रजः निरस्येत मनःकषायः ॥ ॥ यथा आमयः असाधु चिकित्सितः
    नृणाम् पुनः पुनः सन्तुदति प्ररोहन् । एवं मनः अपक्व कषय कर्म कुयोगिनं विध्यति सर्वसङ्गम् ॥ ॥ कुयोगिनः
    ये विहित अन्तरायैः मनुष्यभूतैः त्रिदश उपसृष्टैः । ते प्राक्तन अभ्यासबलेन भूयः युञ्जन्ति योगं न तु
    कर्मतन्त्रम् ॥ ॥ करोति कर्म क्रियते च जन्तुः केनापि असौ चोदितः आनिपातात् । न तत्र विद्वान्प्रकृतौ
    स्थितः अपि निवृत्त तृष्णः स्वसुख अनुभूत्या ॥ ॥ तिष्ठन्तं आसीनं उत व्रजन्तम् शयानं उक्षन्तं अदन्तं
    अन्नम् । स्वभावं अन्यत् किं अपि इहमानम् आत्मानं आत्मस्थमतिः न वेद ॥ ॥ यदि स्म पश्यति असत् इन्द्रिय
    अथ नाना अनुमानेन विरुद्धं अन्यत् । न मन्यते वस्तुतया मनीषी स्वाप्नं यथा उत्थाय तिरोदधानम् ॥ ॥ पूर्वं
    गृहीतं गुणकर्मचित्रम् अज्ञानं आत्मनि अविविक्तं अङ्ग । निवर्तते तत् पुनः ईक्षया एव न गृह्यते न अपि
    विसृज्य आत्मा ॥ ॥ यथा हि भानोः उदयः नृचक्षुषाम् तमः निहन्यात् न तु सद्विधत्ते । एवं समीक्षा निपुणा
    सती मे हन्यात् तमिस्रं पुरुषस्य बुद्धेः ॥ ॥ एषः स्वयञ्ज्योतिः अजः अप्रमेयः महानुभूतिः सकलानुभूतिः
    । एकः अद्वितीयः वचसां विरामे येन ईशिता वाक् असवः चरन्ति ॥ ॥ एतावान् आत्मसम्मोहः यत् विकल्पः तु केवले
    । आत्मन् नृते स्वमात्मानं अवलम्बः न यस्य हि ॥ ॥ यत् नाम आकृतिभिः ग्राह्यं पञ्चवर्णं अबाधितम् । व्यर्थेन
    अपि अर्थवादः अयं द्वयं पण्डितमानिनाम् ॥ ॥ योगिनः अपक्वयोगस्य युञ्जतः कायः उत्थितैः । उपसर्गैः विहन्येत
    तत्र अयं विहितः विधिः ॥ ॥ योगधारणया कांश्चित् आसनैः धारण अन्वितैः । तपोमन्त्रौषधैः कांश्चित् उपसर्गान्
    विनिर्दहेत् ॥ ॥ कांश्चित् मम अनुध्यानेन नामसङ्कीर्तन आदिभिः । योगेश्वर अनुवृत्त्या वा हन्यात् अशुभदान्
    शनैः ॥ ॥ केचित् देहं इमं धीराः सुकल्पं वयसि स्थिरम् । विधाय विविध उपायैः अथ युञ्जन्ति सिद्धये ॥ ॥
    न हि तत् कुशलात् दृत्यं तत् आयासः हि अपार्थकः । अन्तवत्त्वात् शरीरस्य फलस्य इव वनस्पतेः ॥ ॥ योगं निषेवतः
    नित्यं कायः चेत् कल्पतां इयात् । तत् श्रद्दध्यात् न मतिमान् योगं उत्सृज्य मत्परः ॥ ॥ योगचर्यां इमां
    योगी विचरन् मत् व्यपाश्रयः । न अन्तरायैः विहन्येत निःस्पृहः स्वसुखानुभूः ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे परमार्थनिर्णयो नाम अष्टाविंशोऽध्यायः ॥ ॥ अथ एकोनत्रिंशः
    अध्यायः । सुदुस्तरां इमां मन्ये योगचर्यां अनात्मनः । यथा अञ्जसा पुमान् सिह्येत् तत् मे ब्रूहि अञ्जसा
    अच्युत ॥ ॥ प्रायशः पुण्डरीकाक्ष युञ्जन्तः योगिनः मनः । विषीदन्ति असमाधानात् मनोनिग्रहकर्शिताः ॥ ॥
    अथ अतः आनन्ददुघं पदाम्बुजम् हंसाः श्रयेरन् अरविन्दलोचन । सुखं नु विश्वेश्वर योगकर्मभिः त्वत् मायया
    अमी विहताः न मानिनः ॥ ॥ किं चित्रं अच्युत तव एतत् अशेषबन्धः दासेषु अनन्यशरणेषु यत् आत्म सात्त्वम्
    । यः अरोचयत्सह मृगैः स्वयं ईश्वराणाम् श्रीमत् किरीट तट पीडित पाद पीठः ॥ ॥ तं त्वा अखिल आत्मदयित ईश्वरं
    आश्रितानाम् सर्व अर्थदं स्वकृतवित् विसृजेत कः नु । कः वा भजेत् किं अपि विस्मृतये अनु भूत्यै किं वा
    भवेत् न तव पादरजोजुषां नः ॥ ॥ न एव उपयन्ति अपचितिं कवयः तव ईश ब्रह्मायुषा अपि कृतं ऋधमुदः स्मरन्तः
    । यः अन्तर्बहिः तनुभृतां अशुभं विधुन्वन् आचार्यचैत्यवपुषा स्वगतं व्यनक्ति ॥ ॥ श्रीशुकः उवाच । इति
    उद्धवेन अति अनुरक्त चेतसा पृष्टः जगत्क्रीडनकः स्वशक्तिभिः । गृहीत मूर्तित्रयः ईश्वर ईश्वरः जगाद सप्रेम
    मनोहरस्मितः ॥ ॥ श्रीभगवान् उवाच । हन्त ते कथयिष्यामि मम धर्मान् सुमङ्गलाम् । यान् श्रद्धया आचरन् मर्त्यः
    मृत्युं जयति दुर्जयम् ॥ ॥ कुर्यात् सर्वाणि कर्माणि मदर्थं शनकैः स्मरन् । मयि अर्पित मनः चित्तः मत्
    धर्म आत्ममनोरतिः ॥ ॥ देशान् पुण्यान् आश्रयेत मद्भक्तैः साधुभिः श्रितान् । देव आसुर मनुष्येषु मद्भक्त
    आचरितानि च ॥ ॥ पृथक् सत्रेण वा मह्यं पर्वयात्रा महोत्सवान् । कारयेत् गीतनृत्य आद्यैः महाराज विभूतिभिः
    ॥ ॥ मां एव सर्वभूतेषु बहिः अन्तः अपावृतम् । ईक्षेत आत्मनि च आत्मानं यथा खं अमल आशयः ॥ ॥ इति सर्वाणि
    भूतानि मद्भावेन महाद्युते । सभाजयन् मन्यमानः ज्ञानं केवलं आश्रितः ॥ ॥ ब्राह्मणे पुल्कसे स्तेने ब्रह्मण्ये
    अर्के स्फुलिङ्गके । अक्रूरे क्रूरके च एव समदृक् पण्डितः मतः ॥ ॥ नरेषु अभीक्ष्णं मद्भावं पुंसः भावयतः
    अचिरात् । स्पर्धा असूया तिरस्काराः साहङ्काराः वियन्ति हि ॥ ॥ विसृज्य स्मयमानान् स्वान् दृशं व्रीडां
    च दैहिकीम् । प्रणमेत् दण्डवत् भूमौ आश्व चाण्डाल गो खरम् ॥ ॥ यावत् सर्वेषु भूतेषु मद्भावः न उपजायते
    । तावत् एवं उपासीत वाङ् मन काय वृत्तिभिः ॥ ॥ सर्वं ब्रह्मात्मकं तस्य विद्यया आत्म मनीषया । परिपश्यन्
    उपरमेत् सर्वतः मुक्त संशयः ॥ ॥ अयं हि सर्वकल्पानां सध्रीचीनः मतः मम । मद्भावः सर्वभूतेषु मनोवाक्कायवृत्तिभिः
    ॥ ॥ न हि अङ्ग उपक्रमे ध्वंसः मद्धर्मस्य उद्धव अणु अपि । मया व्यवसितः सम्यक् निर्गुणत्वात् अनाशिषः
    ॥ ॥ यः यः मयि परे धर्मः कल्प्यते निष्फलाय चेत् । तत् आयासः निरर्थः स्यात् भयादेः इव सत्त्म ॥ ॥ एषा
    बुद्धिमतां बुद्धिः मनीषा च मनीषिणाम् । यत् सत्यं अनृतेन इह मर्त्येन आप्नोति मा अमृतम् ॥ ॥ एष ते अभिहितः
    कृत्स्नः ब्रह्मवादस्य सङ्ग्रहः । समासव्यासविधिना देवानां अपि दुर्गमः ॥ ॥ अभीक्ष्णशः ते गदितं ज्ञानं
    विस्पष्टयुक्तिमत् । एतत् विज्ञाय मुच्येत पुरुषः नष्टसंशयः ॥ ॥ सुविविक्तं तव प्रश्नं मया एतत् अपि धारयेत्
    । सनातनं ब्रह्मगुह्यं परं ब्रह्म अधिगच्छति ॥ ॥ यः एतत् मम भक्तेषु सम्प्रदद्यात् सुपुष्कलम् । तस्य
    अहं ब्रह्मदायस्य ददामि आत्मानं आत्मना ॥ ॥ यः एतत् समधीयीत पवित्रं परमं शुचि । सः पूयेत अहः अहः मां
    ज्ञानदीपेन दर्शयन् ॥ ॥ यः एतत् श्रद्धया नित्यं अव्यग्रः श्रुणुयात् नरः । मयि भक्तिं परां कुर्वन् कर्मभिः
    न सः बध्यते ॥ ॥ अपि उद्धव त्वया ब्रह्म सखे समवधारितम् । अपि ते विगतः मोहः शोकः च असौ मनोभवः ॥ ॥ न
    एतत् त्वया दाम्भिकाय नास्तिकाय शठाय च । अशुश्रूषोः अभक्ताय दुर्विनीताय दीयताम् ॥ ॥ एतैः दोषैः विहीनाय
    ब्रह्मण्याय प्रियाय च । साधवे शुचये ब्रूयात् भक्तिः स्यात् शूद्र योषिताम् ॥ ॥ न एतत् विज्ञाय जिज्ञासोः
    ज्ञातव्यं अवशिष्यते । पीत्वा पीयूषं अमृतं पातव्यं न अवशिष्यते ॥ ॥ ज्ञाने कर्मणि योगे च वार्तायां दण्डधारणे
    । यावान् अर्थः नृणां तात तावान् ते अहं चतुर्विधः ॥ ॥ मर्त्यः यदा त्यक्त समस्तकर्मा निवेदितात्मा विचिकीर्षितः
    मे । तदा अमृतत्वं प्रतिपद्यमानः मया आत्मभूयाय च कल्पते वै ॥ ॥ श्रीशुकः उवाच । सः एवं आदर्शित योगमार्गः
    तदा उत्तम श्लोकवचः निशम्य । बद्ध अञ्जलिः प्रीति उपरुद्ध कण्ठः न किञ्चित् ऊचेः अश्रु परिप्लुत अक्षः
    ॥ ॥ विष्टभ्य चित्तं प्रणय अवघूर्णम् धैर्येण राजन् बहु मन्यमानः । कृताञ्जलिः प्राह यदुप्रवीरम् शीर्ष्णा
    स्पृशन् तत् चरण अरविन्दम् ॥ ॥ उद्धवः उवाच । विद्रावितः मोह महा अन्धकारः यः आश्रितः मे तव सन्निधानात्
    । विभावसोः किं नु समीपगस्य शीतं तमः भीः प्रभवन्ति अज अद्य ॥ ॥ प्रत्यर्पितः मे भवता अनुकम्पिना भृत्याय
    विज्ञानमयः प्रदीपः । हित्वा कृतज्ञः तव पादमूलम् कः अन्यत् समीयात् शरणं त्वदीयम् ॥ ॥ वृक्णः च मे सुदृढः
    स्नेहपाशः दाशार्ह वृष्णि अन्धक सात्वतेषु । प्रसारितः सृष्टिविवृद्धये त्वया स्वमायया हि आत्म सुबोध
    हेतिना ॥ ॥ नमः अस्तु ते महायोगिन् प्रपन्नं अनुशाधि माम् । यथा त्वत् चरण अम्भोजे रतिः स्यात् अनपायिनी
    ॥ ॥ श्रीभगवान् उवाच । गच्छ उद्धव मया आदिष्टः बदरि आख्यं मम आश्रमम् । तत्र मत् पाद तीर्थोदे स्नान उपस्पर्शनैः
    शुचिः ॥ ॥ ईक्षया अलकनन्दाया विधूत अशेष कल्मषः । वसानः वल्कलानि अङ्ग वन्यभुक् सुख निःस्पृहः ॥ ॥ तितिक्षौः
    द्वन्द्वमात्राणां सुशीलः संयतेन्द्रियः । शान्तः समाहितधिया ज्ञानविज्ञानसंयुतः ॥ ॥ मत्तः अनुशिक्षितं
    यत् ते विविक्तमनुभावयन् । मयि आवेशित वाक् चित्तः मद्धर्म निरतः भव । अतिव्रज्य गतीः तिस्रः मां एष्यसि
    ततः परम् ॥ ॥ श्रीशुकः उवाच । सः एवं उक्तः हरिमेधसा उद्धवः प्रदक्षिणं तं परिसृत्य पादयोः । शिरः निधाय
    अश्रुकलाभिः आर्द्रधीः न्यषिञ्चत् अद्वन्द्वपरः अपि उपक्रमे ॥ ॥ सुदुस्त्यज स्नेह वियोग कातरः न शक्नुवन्
    तं परिहातुं आतुरः । कृच्छ्रं ययौ मूर्धनि भर्तृपादुके बिभ्रन् नमस्कृत्य ययौ पुनः पुनः ॥ ॥ ततः तं अन्तर्हृदि
    सन्निवेश्य गतः महाभागवतः विशालाम् । यथा उपदिष्टां जगत् एकबन्धुना ततः समास्थाय हरेः अगात् गतिम् ॥ ॥
    यः एअतत् आनन्द समुद्र सम्भृतम् ज्ञानामृतं भागवताय भाषितम् । कृष्णेण योगेश्वर सेविताङ्घ्रिणा सच्छ्रद्धया
    आसेव्य जगत् विमुच्यते ॥ ॥ भवभय अपहन्तुं ज्ञानविज्ञानसारम् निगमकृत् उपजहे भृङ्गवत् वेदसारम् । अमृतं
    उदधितः च अपाययत् भृत्यवर्गान् पुरुषं ऋषभं आद्यं कृष्णसञ्ज्ञं नतः अस्मि ॥ ॥ इति श्रीमद्भागवते महापुराणे
    पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे परमार्थप्राप्तिसुगमोपायकथनोद्धवबदरिकाश्रमप्रवेशो
    नाम एकोनत्रिंशोऽध्यायः ॥ ॥ अथ त्रिंशः अध्यायः । राजा उवाच । ततः महाभागवते उद्धवे निर्गते वनम् । द्वारवत्यां
    किं अकरोत् भगवान् भूतभावनः ॥ ॥ ब्रह्मशाप उपसंसृष्टे स्वकुले यादवर्षभः । प्रेयसीं सर्वनेत्राणां तनुं
    सः कथं अत्यजत् ॥ ॥ प्रत्याक्रष्टुं नयनं अबला यत्र लग्नं न शेकुः कर्णाविष्टं न सरति ततः यत् सतां आत्मलग्नम्
    । यत् श्रीः वाचां जनयति रतिं किं नु मानं कवीनाम् दृष्ट्वा जिष्णोः युधि रथगतं यत् च तत् साम्यम् ईयुः
    ॥ ॥ ऋषिः उवाच । दिवि भुवि अन्तरिक्षे च महोत्पातान् समुत्थितान् । दृष्ट्वा आसीनान् सुधर्मायां कृष्णः
    प्राह यदून् इदम् ॥ ॥ श्रीभगवान् उवाच । एते घोराः महोत्पाताः द्वार्वत्यां यमकेतवः । मुहूर्तं अपि न
    स्थेयं अत्र नः यदुपुङ्गवाः ॥ ॥ स्त्रियः बालाः च वृद्धाः च शङ्खोद्धारं व्रजन्त्वितः । वयं प्रभासं यास्यामः
    यत्र प्रत्यक् सरस्वती ॥ ॥ तत्र अभिषिच्य शुचय उपोष्य सुसमाहिताः । देवताः पूजयिष्यामः स्नपन आलेपन अर्हणैः
    ॥ ॥ ब्राह्मणान् तु महाभागान् कृतस्वस्त्ययना वयम् । गो भू हिरण्य वासोभिः गज अश्वरथ वेश्मभिः ॥ ॥ विधिः
    एषः हि अरिष्टघ्नः मङ्गल आयनं उत्तमम् । देव द्विज गवां पूजा भूतेषु परमः भवः ॥ ॥ इति सर्वे समाकर्ण्य
    यदुवृद्धाः मधुद्विषः । तथा इति नौभिः उत्तीर्य प्रभासं प्रययू रथैः ॥ ॥ तस्मिन् भगवता आदिष्टं यदुदेवेन
    यादवा । चक्रुः परभया भक्त्या सर्वश्रेय उपबृंहितम् ॥ ॥ ततः तस्मिन् महापानं पपुः मैरेयकं मधु । दिष्ट
    विभ्रंशित धियः यत् द्रवैः भ्रश्यते मतिः ॥ ॥ महापान अभिमत्तानां वीराणां दृप्तचेतसाम् । कृष्णमाया विमूढानां
    सङ्घर्षः सुमहान् अभूत् ॥ ॥ युयुधुः क्रोधसंरब्धा वेलायां आततायिनः । धनुभिः असिभिः मल्लैः गदाभिः तां
    अरर्ष्टिभिः ॥ ॥ पतत्पताकै रथकुञ्जरादिभिः खर उष्ट्र गोभिः महिषैः नरैः अपि । मिथः समेत्य अश्वतरैः सुदुर्मदा
    न्यहन् शरर्दद्भिः इव द्विपा वने ॥ ॥ प्रद्युम्न साम्बौ युधि रूढमत्सरौ अक्रूर भोजौ अनिरुद्ध सात्यकी
    । सुभद्र सङ्ग्रामजितौ सुदारुणौ गदौ सुमित्रा सुरथौ समीयतुः ॥ ॥ अन्ये च ये वै निशठ उल्मुक आदयः सहस्रजित्
    शतजित् भानु मुख्याः । अन्योन्यं आसाद्य मदान्धकारिता जघ्नुः मुकुन्देन विमोहिता भृशम् ॥ ॥ दाशार्ह वृष्णि
    अन्धक भोज सात्वता मधु अर्बुदा माथुरशूरसेनाः । विसर्जनाः कुकुराः कुन्तयः च मिथः ततः ते अथ विसृज्य सौहृदम्
    ॥ ॥ पुत्राः अयुध्यन् पितृभिः भ्रातृभिः च स्वस्त्रीय दौहित्र पितृव्यमातुलैः । मित्राणि मित्रैः सुहृदः
    सुहृद्भिः ज्ञातींस्त्वहन् ज्ञातयः एव मूढाः ॥ ॥ शरेषु क्षीयमाणेषु भज्यमानेषु धन्वसु । शस्त्रेषु क्षीयमाणेषु
    मुष्टिभिः जह्रुः एरकाः ॥ ॥ ताः वज्रकल्पाः हि अभवन् परिघाः मुष्टिनाः भृताः । जघ्नुः द्विषः तैः कृष्णेन
    वार्यमाणाः तु तं च ते ॥ ॥ प्रत्यनीकं मन्यमानाः बलभद्रं च मोहिताः । हन्तुं कृतधियः राजन् आपन्नाः आततायिनः
    ॥ ॥ अथ तौ अपि सङ्क्रुद्धौ उद्यम्य कुरुनन्दन । एरका मुष्टि परिघौ जरन्तौ जघ्नतुः युधि ॥ ॥ ब्रह्मशाप
    उपसृष्टानां कृष्णमायावृत आत्मनाम् । स्पर्धाक्रोधः क्षयं निन्ये वैणवः अग्निः यथा वनम् ॥ ॥ एवं नष्टेषु
    सर्वेषु कुलेषु स्वेषु केशवः । अवतारितः भुवः भारः इति मेने अवशेषितः ॥ ॥ रामः समुद्रवेलायां योगं आस्थाय
    पौरुषम् । तत् त्याज लोकं मानुष्यं संयोज्य आत्मानं आत्मनि ॥ ॥ रामनिर्याणं आलोक्य भगवान् देवकीसुतः ।
    निषसाद धरोपस्थे तूष्णीं आसाद्य पिप्पलम् ॥ ॥ बिभ्रत् चतुर्भुजं रूपं भ्राजिष्णु प्रभया स्वया । दिशः
    वितिमाराः कुर्वन् विधूमः इव पावकः ॥ ॥ श्रीवत्साङ्कं घनश्यामं तप्त हाटक वर्चसम् । कौशेय अम्बर युग्मेन
    परिवीतं सुमङ्गलम् ॥ ॥ सुन्दर स्मित वक्त्र अब्जं नील कुन्तल मण्डितम् । पुण्डरीक अभिरामाक्षं स्फुरन्
    मकर कुण्डलम् ॥ ॥ कटिसूत्र ब्रह्मसूत्र किरीट कटक अङ्गदैः । हार नूपुर मुद्राभिः कौस्तुभेन विराजितम्
    ॥ ॥ वनमाला परीताङ्गं मूर्तिमद्भिः निज आयुधैः । कृत्वा उरौ दक्षिणे पादं आसीनं पङ्कज अरुणम् ॥ ॥ मुसलौ
    अशेषायः खण्डकृतेषुः लुब्धकः जराः । मृगास्य आकारं तत् चरणं विव्याध मृगशङ्कया ॥ ॥ चतुर्भुजं तं पुरुषं
    दृष्ट्वा सः कृत किल्बिषः । भीतः पपात शिरसा पादयोः असुरद्विषः ॥ ॥ अजानता कृतं इदं पापेन मधुसूदन । क्षन्तुं
    अर्हसि पापस्य उत्तमश्लोकः मे अनघ ॥ ॥ यस्य अनुस्मरणं नॄणां अज्ञान ध्वान्त नाशनम् । वदन्ति तस्य ते विष्णो
    मया असाधु कृतं प्रभो ॥ ॥ तत् मा आशु जहि वैकुण्ठ पाप्मानं मृग लुब्धकम् । यथा पुनः अहं तु एवं न कुर्यां
    सत् अतिक्रमम् ॥ ॥ यस्य आत्म योग रचितं न विदुः विरिञ्चः रुद्र आदयः अस्य तनयाः पतयः गिरां ये । त्वत्
    मायया पिहित दृष्टयः एतत् अञ्जः किं तस्य ते वयं असत् गतयः गृणीमः ॥ ॥ श्रीभगवान् उवाच । मा भैः जरे त्वं
    उत्तिष्ठ कामः एषः कृतः हि मे । याहि त्वं मत् अनुज्ञातः स्वर्गं सुकृतिनां पदम् ॥ ॥ इति आदिष्टः भगवता
    कृष्णेन इच्छा शरीरिणा । त्रिः परिक्रम्य तं नत्वा विमानेन दिवं ययौ ॥ ॥ दारुकः कृष्णपदवीं अन्विच्छन्
    अधिगम्यताम् । वायुं तुलसिकामोदं आघ्राय अभिमुखं ययौ ॥ ॥ तं तत्र तिग्मद्युभिः आयुधैः वृतम् हि अश्वत्थमूले
    कृतकेतनं पतिम् । स्नेहप्लुतात्मा निपपात पादयो रथात् अवप्लुत्य सबाष्पलोचनः ॥ ॥ अपश्यतः त्वत् चरण अम्बुजं
    प्रभो दृष्टिः प्रणष्टा तमसि प्रविष्टा । दिशः न जाने न लभे च शान्तिम् यथा निशायं उडुपे प्रणष्टे ॥ ॥
    इति ब्रुवते सूते वै रथः गरुडलाञ्छनः । खं उत्पपात राजेन्द्र साश्वध्वजः उदीक्षतः ॥ ॥ तं अन्वगच्छन् दिव्यानि
    विष्णुप्रहरणानि च । तेन अति विस्मित आत्मानं सूतं आह जनार्दनः ॥ ॥ गच्छ द्वारवतीं सूत ज्ञातीनां निधनं
    मिथः । सङ्कर्षणस्य निर्याणं बन्धुभ्यः ब्रूहि मत् दशाम् ॥ ॥ द्वारकायां च न स्थेयं भवद्भिः च स्वबन्धुभिः
    । मया त्यक्तां यदुपुरीं समुद्रः प्लावयिष्यति ॥ ॥ स्वं स्वं परिग्रहं सर्वे आदाय पितरौ च नः । अर्जुनेन
    आविताः सर्व इन्द्रप्रस्थं गमिष्यथ ॥ ॥ त्वं तु मत् धर्मं आस्थाय ज्ञाननिष्ठः उपेक्षकः । मन्माया रचनां
    एतां विज्ञाय उपशमं व्रज ॥ ॥ इति उक्तः तं परिक्रम्य नमस्कृत्य पुनः पुनः । तत् पादौ शीर्ष्णि उपाधाय
    दुर्मनाः प्रययौ पुरीम् ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे यदुकुलसङ्क्षयो
    नाम त्रिंशोऽध्यायः ॥ ॥ अथ एकत्रिंशः अध्यायः । श्रीशुकः उवाच । अथ तत्र आगमत् ब्रह्मा भवान्या च समं
    भवः । महेन्द्रप्रमुखाः देवाः मुनयः सप्रजेश्वराः ॥ ॥ पितरः सिद्धगन्धर्वाः विद्याधर महोरगाः । चारणाः
    यक्षरक्षांसि किन्नर अप्सरसः द्विजाः ॥ ॥ द्रष्टुकामाः भगवतः निर्वाणं परम उत्सुकाः । गायन्तः च गृणन्तः
    च शौरेः कर्माणि जन्म च ॥ ॥ ववर्षुः पुष्पवर्षाणि विमान आवलिभिः नभः । कुर्वन्तः सङ्कुलं राजन् भक्त्या
    परमया युताः ॥ ॥ भगवान् पितामहं वीक्ष्य विभूतिः आत्मनः विभुः । संयोज्य आत्मनि च आत्मानं पद्मनेत्रे
    न्यमीलयत् ॥ ॥ लोकाभिरामां स्वतनुं धारणा ध्यान मङ्गलम् । योगधारणया आग्नेय्या अदग्ध्वा धाम आविशत् स्वकम्
    ॥ ॥ दिवि दुन्दुभयः नेदुः पेतुः सुमनः च खात् । सत्यं धर्मः धृतिः भूमेः कीर्तिः श्रीः च अनु तं वयुः
    ॥ ॥ देव आदयः ब्रह्ममुख्याः न विशन्तं स्वधामनि । अविज्ञातगतिं कृष्णं ददृशुः च अतिविस्मिताः ॥ ॥ सौदामन्याः
    यथा आकाशे यान्त्याः हित्वा अभ्रमण्डलम् । गतिः न लक्ष्यते मर्त्यैः तथा कृष्णस्य दैवतैः ॥ ॥ ब्रह्म रुद्र
    आदयः ते तु दृष्ट्वा योगगतिं हरेः । विस्मिताः तां प्रशंसन्तः स्वं स्वं लोकं ययुः तदा ॥ ॥ राजन् परस्य
    तनुभृत् जननाप्ययेहा मायाविडम्बनं अवेहि यथा नटस्य । सृष्ट्वा आत्मना इदं अनुविश्य विहृत्य च अन्ते संहृत्य
    च आत्म महिना उपरतः सः आस्ते ॥ ॥ मर्त्येन यः गुरुसुतं यमलोकनीतम् त्वां च आनयत् शरणदः परम अस्त्र दग्धम्
    । जिग्ये अन्तक अन्तकं अपि ईशं असौ अवनीशः किं स्वावने स्वरनयन् मृगयुं सदेहम् ॥ ॥ तथा अपि अशेशा स्थिति
    सम्भव अपि अयेषु अनन्य हेतुः यत् अशेष शक्तिधृक् । न इच्छत् प्रणेतुं वपुः अत्र शेषितम् मर्त्येन किं
    स्वस्थगतिं प्रदर्शयन् ॥ ॥ यः एतां प्रातः उत्थाय कृष्णस्य पदवीं पराम् । प्रयतः कीर्तयेत् भक्त्या तां
    एव आप्नोति अनुत्तमाम् ॥ ॥ दारुकः द्वारकां एत्य वसुदेव उग्रसेनयोः । पतित्वा चरणावस्रैः न्यषिञ्चत् कृष्णविच्युतः
    ॥ ॥ कथयामास निधनं वृष्णीनां कृत्स्नशः नृप । तत् श्रुत्वा उद्विग्न हृदयाः जनाः शोक विमूर्च्छिताः ॥
    ॥ तत्र स्म त्वरिता जग्मुः कृष्ण विश्लेष विह्वलाः । व्यसवाः शेरते यत्र ज्ञातयः घ्नन्तः आननम् ॥ ॥ देवकी
    रोहिणी च एव वसुदेवः तथा सुतौ । कृष्ण राम अवपश्यन्तः शोक आर्ताः विजहुः स्मृतिम् ॥ ॥ प्राणान् च विजहुः
    तत्र भगवत् विरह आतुराः । उपगुह्य पतीन् तात चितां आरुरुहुः स्त्रियः ॥ ॥ रामपत्न्यः च तत् देहं उपगुह्य
    अग्निं आविशन् । वसुदेवपत्न्यः तत् गात्रं प्रद्युम्न आदीन् हरेः स्नुषाः । कृष्णपत्न्यः आविशन् अग्निं
    रुक्मिणि आद्याः तदात्मिकाः ॥ ॥ अर्जुनः प्रेयसः सख्युः कृष्णस्य विरह आतुरः । आत्मानं सान्त्वयामास कृष्णगीतैः
    सदुक्तिभिः ॥ ॥ बन्धूनां नष्टगोत्राणां अर्जुनः साम्परायिकम् । हतानां कारयामास यथावत् अनुपूर्वशः ॥ ॥
    द्वारकां हरिणा त्यक्ता समुद्रः अप्लावयत् क्षणात् । वर्जयित्वा महाराज श्रीमत् भगवत् आलयम् ॥ ॥ नित्यं
    सन्निहितः तत्र भगवान् मधुसूदनः । स्मृत्या अशेषा अशुभहरं सर्व मङ्गलं अमङ्गलम् ॥ ॥ स्त्री बाल वृद्धान्
    आदाय हतशेषान् धनञ्जयः । इन्द्रप्रस्थं समावेश्य वज्र तत्र अभ्यषेचयत् ॥ ॥ श्रुत्वा सुहृत् वधं राजन्
    अर्जुनात् ते पितामहाः । त्वां तु वंशधरं कृत्वा जग्मुः सर्वे महापथम् ॥ ॥ यः एतत् देवदेवस्य विष्णोः
    कर्माणि जन्म च । कीर्तयेत् श्रद्धया मर्त्यः सर्वपापैः प्रमुच्यते ॥ ॥ इत्थं हरेः भगवतः रुचिर अवतार
    वीर्याणि बालचरितानि च शन्तमानि । अन्यत्र च इह च श्रुतानि गृणन् मनुष्यः भक्तिं परां परमहंसगतौ लभेत
    ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे मौसलोपाख्यानं नाम एकत्रिंशोऽध्यायः
    ॥ ॥ ॥ इति उद्धवगीता नाम एकादशस्कन्धः समाप्तः ॥
