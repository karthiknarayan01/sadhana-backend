id: mahanyasam-7-5-prati-purusham
category: stotram
name:
  english: Mahanyasam - 7.5. Prati Purusham
content:
  english: pratipurusha mekakapala ssmastebhyah kamakara mpashunagm sharmasi sharma yajamanasya sharma
    me yacchaika eva rudro na dvitiyaya tastha akhuste rudra pashusta njushasvaisha te rudra bhaga 'bikaya
    tanjushasva bheshaja 'shvaya purushaya bheshajamatho asmabhya mbheshajagm subheshajam mmeshaya meshya
    ava ntryabankam | yatha na shshreyasah karadyatha no vasya sah karadyatha nah pashumatah karadyatha
    no vyavasayaya mpushtivardhanam | urvarukamiva bandhana nmrityo rmukshiya ma t | eshate rudra bhaga
    stanjushasva tenavasena paro mujavato 'tihyavatata dhanva pinakahastah krittivasah || nnirvapati |
    jata eva praja rudra nniravadayate | ekamatiriktam | janishyamana eva praja rudra nniravadayate |
    ekakapala bhavanti | ekadhaiva rudra nniravadayate | nabhigharayati | yadabhigharaye nkuryat | ekolmukena
    yanti | taddhi rudrasya bhagadheya ya~nti | esha vai rudrasya dik | svaya meva dishi rudra nniravadayate
    | rudro va apashukaya ahutyai natishthata | asau te pashuriti nirdishedya ndvishyat | yameva dveshti
    | tamasmai pashu nnirdishati | yadi na dvishyat | akhuste pashuriti bruyat | npashun hinasti | naranyan
    | catushpathe juhoti | esha va agnina mpadbisho nama | agnivatyeva juhoti | maddhyamena parnena juhoti
    | srugghyesha | atho khalu | antamenaiva hotavya m | antata eva rudra 'bikayetyaha | sharadva asyambika
    svasa | taya va esha hinasti | yagm hinasti | tayaivainagm saha shamayati | bheshajangava ityaha |
    yavanta eva gramyah pashavah | tebhyo bheshaja bam rudramadi mahityaha | ashishamevai ya~jamaha ityaha
    | mrityo rmukshiya ma diti va vai tadaha | utkiranti | bhagasya liphsante | mute kritva sajanti |
    yatha janam nkaroti | tadrigeva tat | esha te rudrabhaga ityaha niravatyai | apratiksha mayanti |
    apah parishincati | rudrasyanta r hityai | prava ete ccyavante | ye tryabankai shcaranti | aditya
    mpunaretya nirvapati | iyam va~ aditih | asyameva pratitishthanti || nnamo bhagavate rudraya || pratipurusham
    vi~bhaditi netratrayaya vaushat ||
  devanagari: प्र॒ति॒पू॒रु॒ष मेक॑कपाला॒ स्स्मस्तेभ्यः॒ कम॑कर म्पशू॒नाग्ं शर्मा॑सि॒ शर्म॒ यज॑मानस्य॒ शर्म॑
    मे य॒च्छैक॑ ए॒व रु॒द्रो न द्वि॒तीया॑य तस्थ आ॒खुस्ते॑ रुद्र प॒शुस्त ञ्जु॑षस्वै॒ष ते॑ रुद्र भा॒ग ऽबि॑कया॒
    तञ्जु॑षस्व भेष॒ज ऽश्वा॑य॒ पुरु॑षाय भेष॒जमथो॑ अ॒स्मभ्य॑ म्भेष॒जग्ं सुभे॑षजं॒ म्मे॒षाय॑ मे॒ष्या॑ अवा
    न्त्र्य॑बङ्कम् । यथा॑ न॒ श्श्रेय॑सः॒ कर॒द्यथा॑ नो॒ वस्य॑ सः॒ कर॒द्यथा॑ नः पशु॒मतः॒ कर॒द्यथा॑ नो व्यवसा॒यया
    म्पु॑ष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑ना न्मृ॒त्यो र्मु॑क्षीय॒ मा त् । ए॒षते॑ रुद्र भा॒ग स्तञ्जु॑षस्व॒
    तेना॑व॒सेन॑ प॒रो मूज॑व॒तो ऽती॒ह्यव॑तत धन्वा॒ पिना॑कहस्तः॒ कृत्ति॑वासाः ॥ न्निर्व॑पति । जा॒ता ए॒व प्र॒जा
    रु॒द्रा न्नि॒रव॑दयते । एक॒मति॑रिक्तम् । ज॒नि॒ष्यमा॑णा ए॒व प्र॒जा रु॒द्रा न्नि॒रव॑दयते । एक॑कपाला भवन्ति
    । ए॒क॒धैव रु॒द्र न्नि॒रव॑दयते । नाभिघा॑रयति । यद॑भिघा॒रये ङ्कु॑र्यात् । ए॒को॒ल्मु॒केन॑ यन्ति । तद्धि
    रु॒द्रस्य॑ भाग॒धेय यँन्ति । ए॒षा वै रु॒द्रस्य॒ दिक् । स्वाया॑ मे॒व दि॒शि रु॒द्र न्नि॒रव॑दयते । रु॒द्रो
    वा अ॑प॒शुका॑या॒ आहु॑त्यै॒ नाति॑ष्ठत । अ॒सौ ते॑ प॒शुरिति॒ निर्दि॑शे॒द्य न्द्वि॒ष्यात् । यमे॒व द्वेष्टि॑
    । तम॑स्मै प॒शु न्निर्दि॑शति । यदि॒ न द्वि॒ष्यात् । आ॒खुस्ते॑ प॒शुरिति॑ ब्रूयात् । न्प॒शून् हि॒नस्ति॑
    । नार॒ण्यान् । च॒तु॒ष्प॒थे जु॑होति । ए॒ष वा अ॑ग्नी॒ना म्पड्बी॑शो॒ नाम॑ । अ॒ग्नि॒वत्ये॒व जु॑होति ।
    म॒द्ध्य॒मेन॑ प॒र्णेन॑ जुहोति । स्रुग्घ्ये॑षा । अथो॒ खलु॑ । अ॒न्त॒मेनै॒व हो॑त॒व्य म् । अ॒न्त॒त ए॒व
    रु॒द्र ऽबि॑क॒येत्या॑ह । श॒रद्वा अ॒स्याम्बि॑का॒ स्वसा । तया॒ वा ए॒ष हि॑नस्ति । यग्ं हि॒नस्ति॑ । तयै॒वैनग्ं॑
    स॒ह श॑मयति । भे॒ष॒जङ्गव॒ इत्या॑ह । याव॑न्त ए॒व ग्रा॒म्याः प॒शवः॑ । तेभ्यो॑ भेष॒ज बं रु॒द्रम॑दि म॒हीत्या॑ह
    । आ॒शिष॑मे॒वै यँजामह॒ इत्या॑ह । मृ॒त्यो र्मु॑क्षीय॒ मा दिति॒ वा वै तदा॑ह । उत्कि॑रन्ति । भग॑स्य लीफ्सन्ते
    । मूते॑ कृ॒त्वा स॑जन्ति । यथा॒ जनं॑ ङ्क॒रोति॑ । ता॒दृगे॒व तत् । ए॒ष ते॑ रुद्रभा॒ग इत्या॑ह नि॒रव॑त्यै
    । अप्र॑तीक्ष॒ माय॑न्ति । अ॒पः परि॑षिञ्चति । रु॒द्रस्या॒न्त र् हि॑त्यै । प्रवा ए॒ते च्च्य॑वन्ते । ये
    त्र्य॑बङ्कै॒ श्चर॑न्ति । आ॒दि॒त्य म्पुन॒रेत्य॒ निर्व॑पति । इ॒यं वाँ अदि॑तिः । अ॒स्यामे॒व प्रति॑तिष्ठन्ति
    ॥ न्नमो भगवते॑ रुद्रा॒य ॥ प्रतिपूरुषं विँभाडिति नेत्रत्रया॑य वौ॒षट् ॥
