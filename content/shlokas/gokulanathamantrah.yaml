id: gokulanathamantrah
category: mantra
name:
  english: gokulanathamantrah
  devanagari: गोकुलनाथमन्त्रः
content:
  english: shrigokulanathamantrah || viniyogah || asya shrigokulanathamantrasya brahma rishih | gayatri
    chandah | shrikrishno devata | sarvasampatpraptyartham brahmapadapraptyartham ca jape viniyogah ||
    || rishyadinyasah || brahmane rishaye namah shirasi | gayatrichandase namah mukhe | shrikrishnadevatayai
    namah hridi | viniyogaya namah sarvange || || karanyasah || goku angushthabhyam namah | lana tarjanibhyam
    svaha | thaya madhyamabhyam vashat | namah anamikabhyam hum | gokulanathaya namah kanishthikabhyam
    phat | gokulanathaya namah karatalakaraprishthabhyam namah || || pancanganyasah || goku hridayaya
    namah | lana shirase svaha | thaya shikhayai vashat | namah kavacaya hum | gokulanathaya namah astraya
    phat || || dhyanam || pancavarshamatidriptamangane dhavamanamaticancalekshanam | kinkinivalayaharanupurairalankritam
    namato gopabalakam || barhapidam navanilamecakam muktaharam mridulasmitananam | pitavasasamudaravigraham
    vande nandatmajamavyayam harim || navanitakaram carugopakam vallavinayanalobhanam vibhum | kaustubhaprabhaya
    virajitam dhyayedgokulanathamacyutam || || avaranapuja || madhye bindau
  devanagari: श्रीगोकुलनाथमन्त्रः ॥ विनियोगः ॥ अस्य श्रीगोकुलनाथमन्त्रस्य ब्रह्मा ऋषिः । गायत्री छन्दः
    । श्रीकृष्णो देवता । सर्वसम्पत्प्राप्त्यर्थं ब्रह्मपदप्राप्त्यर्थं च जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः
    ॥ ब्रह्मणे ऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीकृष्णदेवतायै नमः हृदि । विनियोगाय नमः सर्वाङ्गे
    ॥ ॥ करन्यासः ॥ गोकु अङ्गुष्ठाभ्यां नमः । लना तर्जनीभ्यां स्वाहा । थाय मध्यमाभ्यां वषट् । नमः अनामिकाभ्यां
    हुं । गोकुलनाथाय नमः कनिष्ठिकाभ्यां फट् । गोकुलनाथाय नमः करतलकरपृष्ठाभ्यां नमः ॥ ॥ पञ्चाङ्गन्यासः
    ॥ गोकु हृदयाय नमः । लना शिरसे स्वाहा । थाय शिखायै वषट् । नमः कवचाय हुं । गोकुलनाथाय नमः अस्त्राय फट्
    ॥ ॥ ध्यानम् ॥ पञ्चवर्षमतिदृप्तमङ्गणे धावमानमतिचञ्चलेक्षणम् । किङ्किणीवलयहारनूपुरैरलङ्कृतं नमतो गोपबालकम्
    ॥ बर्हापीडं नवनीलमेचकं मुक्ताहारं मृदुलस्मिताननम् । पीतवाससमुदारविग्रहं वन्दे नन्दात्मजमव्ययं हरिम्
    ॥ नवनीतकरं चारुगोपकं वल्लवीनयनलोभनं विभुं । कौस्तुभप्रभया विराजितं ध्यायेद्गोकुलनाथमच्युतम् ॥ ॥ आवरणपूजा
    ॥ मध्ये बिन्दौ
