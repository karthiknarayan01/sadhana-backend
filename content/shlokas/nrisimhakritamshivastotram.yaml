id: nrisimhakritamshivastotram
category: stotram
name:
  english: nrisimhakritamshivastotram
  devanagari: नृसिंहकृतंशिवस्तोत्रम्
content:
  english: nrisimhakritam shivastotram tushtava parameshanam haristam lalitaksharaih | shrinrisimha uvaca
    | namo rudraya sharvaya mahagrasaya vishnave || 76|| nama ugraya bhimaya namah krodhaya manyave |
    namo bhavaya sharvaya shankaraya shivaya te || 77|| kalakalaya kalaya mahakalaya mrityave | viraya
    virabhadraya kshayadviraya shuline || 78|| mahadevaya mahate pashunam pataye namah | ekaya nilakanthaya
    shrikanthaya pinakine || 79|| namo'nantaya sukshmaya namaste mrityumanyave | paraya parameshaya paratparataraya
    te || 80|| paratparaya vishvaya namaste vishvamurttaye | namo vishnukalatraya vishnukshetraya bhanave
    || 81|| kaivartaya kirataya mahavyadhaya shashvate | bhairavaya sharanyaya mahabhairavarupine || 82||
    namo nrisimhasamhartre kamakalapuraraye | mahapashaughasamhartre vishnumayantakarine || 83|| tryambakaya
    tryaksharaya shipivishtaya midhushe | mrityunjayaya sharvaya sarvajnaya makharaye || 84|| makheshaya
    varenyaya namaste vahnirupine | mahaghranaya jihvaya pranapanapravarttine || 85|| trigunaya trishulaya
    gunatitaya yogine | samsaraya pravahaya mahayantrapravartine || 86|| namashcandragnisuryaya muktivaicitryahetave
    | varadayavataraya sarvakaranahetave || 87|| kapaline karalaya pataye punyakirttaye | amoghayagninetraya
    lakulishaya shambhave || 88|| bhishaktamaya mundaya dandine yogarupine | meghavahaya devaya parvatipataye
    namah || 89|| avyaktaya vishokaya sthiraya sthiradhanvine | sthanave krittivasaya namah pancarthahetave
    || 90|| varadayaikapadaya namashcandrardhamauline | namaste'dhvararajaya vayasam pataye namah || 91||
    yogishvaraya nityaya satyaya parameshthine | sarvatmane namastubhyam namah sarveshvaraya te || 92||
    ekadvitricatuhpancakritvaste'stu namo namah | dashakritvastu sahasrakritvaste ca namo namah || 93||
    namo'parimitam kritva'nantakritvo namo namah | namo namo namo bhuyah punarbhuyo namo namah || 94||
    iti shrilingamahapurane purvabhage shannavatitamadhyayantargatam nrisimhakritam shivastotram samaptam
    | lingapurana | purvabhaga | adhyaya 96
  devanagari: नृसिंहकृतं शिवस्तोत्रम् तुष्टाव परमेशानं हरिस्तं ललिताक्षरैः । श्रीनृसिंह उवाच । नमो रुद्राय
    शर्वाय महाग्रासाय विष्णवे ॥ ७६॥ नम उग्राय भीमाय नमः क्रोधाय मन्यवे । नमो भवाय शर्वाय शङ्कराय शिवाय
    ते ॥ ७७॥ कालकालाय कालाय महाकालाय मृत्यवे । वीराय वीरभद्राय क्षयद्वीराय शूलिने ॥ ७८॥ महादेवाय महते
    पशूनां पतये नमः । एकाय नीलकण्ठाय श्रीकण्ठाय पिनाकिने ॥ ७९॥ नमोऽनन्ताय सूक्ष्माय नमस्ते मृत्युमन्यवे
    । पराय परमेशाय परात्परतराय ते ॥ ८०॥ परात्पराय विश्वाय नमस्ते विश्वमूर्त्तये । नमो विष्णुकलत्राय विष्णुक्षेत्राय
    भानवे ॥ ८१॥ कैवर्ताय किराताय महाव्याधाय शाश्वते । भैरवाय शरण्याय महाभैरवरूपिणे ॥ ८२॥ नमो नृसिंहसंहर्त्रे
    कामकालपुरारये । महापाशौघसंहर्त्रे विष्णुमायान्तकारिणे ॥ ८३॥ त्र्यम्बकाय त्र्यक्षराय शिपिविष्टाय मीढुषे
    । मृत्युञ्जयाय शर्वाय सर्वज्ञाय मखारये ॥ ८४॥ मखेशाय वरेण्याय नमस्ते वह्निरूपिणे । महाघ्राणाय जिह्वाय
    प्राणापानप्रवर्त्तिने ॥ ८५॥ त्रिगुणाय त्रिशूलाय गुणातीताय योगिने । संसाराय प्रवाहाय महायन्त्रप्रवर्तिने
    ॥ ८६॥ नमश्चन्द्राग्निसूर्याय मुक्तिवैचित्र्यहेतवे । वरदायावताराय सर्वकारणहेतवे ॥ ८७॥ कपालिने करालाय
    पतये पुण्यकीर्त्तये । अमोघायाग्निनेत्राय लकुलीशाय शम्भवे ॥ ८८॥ भिषक्तमाय मुण्डाय दण्डिने योगरूपिणे
    । मेघवाहाय देवाय पार्वतीपतये नमः ॥ ८९॥ अव्यक्ताय विशोकाय स्थिराय स्थिरधन्विने । स्थाणवे कृत्तिवासाय
    नमः पञ्चार्थहेतवे ॥ ९०॥ वरदायैकपादाय नमश्चन्द्रार्धमौलिने । नमस्तेऽध्वरराजाय वयसां पतये नमः ॥ ९१॥
    योगीश्वराय नित्याय सत्याय परमेष्ठिने । सर्वात्मने नमस्तुभ्यं नमः सर्वेश्वराय ते ॥ ९२॥ एकद्वित्रिचतुःपञ्चकृत्वस्तेऽस्तु
    नमो नमः । दशकृत्वस्तु साहस्रकृत्वस्ते च नमो नमः ॥ ९३॥ नमोऽपरिमितं कृत्वाऽनन्तकृत्वो नमो नमः । नमो
    नमो नमो भूयः पुनर्भूयो नमो नमः ॥ ९४॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे षण्णवतितमाध्यायान्तर्गतं नृसिंहकृतं
    शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ९६
