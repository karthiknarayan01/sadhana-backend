id: namavali-130
category: sahasranama
name:
  english: namavali
  devanagari: नामावली
content:
  english: lam prithivyatmikayai gandham kalpayami | ham akashatmikayai pushpani kalpayami | yam vayvatmikayai
    dhupam kalpayami | ram agnyatmikayai dipam kalpayami | vam amritatmikayai amritam mahanaivedyam kalpayami
    | sam sarvatmikayai tambuladi samastopacaran kalpayami | atha shrishyamalasahasranamavalih | om saubhagyalakshmyai
    namah | om saundaryanidhaye namah | om samarasapriyayai namah | om sarvakalyananilayayai namah | om
    sarveshyai namah | om sarvamangalayai namah | om sarvavashyakaryai namah | om sarvayai namah | om
    sarvamangaladayinyai namah | om sarvavidyadanadakshayai namah |
  devanagari: लं पृथिव्यात्मिकायै गन्धं कल्पयामि । हं आकाशात्मिकायै पुष्पाणि कल्पयामि । यं वाय्वात्मिकायै
    धूपं कल्पयामि । रं अग्न्यात्मिकायै दीपं कल्पयामि । वं अमृतात्मिकायै अमृतं महानैवेद्यं कल्पयामि । सं
    सर्वात्मिकायै ताम्बूलादि समस्तोपचारान् कल्पयामि । अथ श्रीश्यामलासहस्रनामावलिः । ॐ सौभाग्यलक्ष्म्यै
    नमः । ॐ सौन्दर्यनिधये नमः । ॐ समरसप्रियायै नमः । ॐ सर्वकल्याणनिलयायै नमः । ॐ सर्वेश्यै नमः । ॐ सर्वमङ्गलायै
    नमः । ॐ सर्ववश्यकर्यै नमः । ॐ सर्वायै नमः । ॐ सर्वमङ्गलदायिन्यै नमः । ॐ सर्वविद्यादानदक्षायै नमः ।
meaning: {}
