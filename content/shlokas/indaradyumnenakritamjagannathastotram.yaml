id: indaradyumnenakritamjagannathastotram
category: stotram
name:
  english: indaradyumnenakritamjagannathastotram
  devanagari: इन्दरद्युम्नेनकृतंजगन्नाथस्तोत्रम्
content:
  english: 10|| manasashcandrama jatashcakshushaste divakarah | karnabhyam shvasanah pranairjihvaya havyavadapi
    || 11|| nabhito gaganam dyaushca murdhnaste samavarttata | padabhyam te dhara jata dishashcashtau
    shrutergatah || 12|| saptasanparidhayastvatta ekavimshatsamicca vai | caracarah sarvabhavastvatta
    eva hi jajnire || 13|| tvameva jagatam nathastvameva paripalakah | ugrarupashca samharta tvameva parameshvara
    || 14|| tvameva yajno yajnamshastvam yajneshah paratparah | shabdabrahmaparam tvam hi shabdabrahmasi
    vishvarat || 15|| svarat samradjagannatha viradasi jagatpate | adhashcordhvam ca tiryaktvam tvaya
    vyaptam jaganmaya || 16|| prapnuvanti param sthanam tvam yajantashca yajnikah | bhojyam bhokta havirhota
    havanam tvam phalapradah || 17|| samastakarmabhokta tvam sarvakarmatmakah prabho | sarvakarmopakaranam
    sarvakarmaphalapradah || 18|| karmaprerayita tvam hi dharmakamarthasiddhidah | tvamrite muktidah ko'nyo
    hrishikesha namo'stu te || 19|| namo'stvanantaya sahasramurttaye sahasrapadakshishirorubahave | sahasranamne
    purushaya shashvate sahasrakotiyugadharine namah || 2
  devanagari: १०॥ मनसश्चन्द्रमा जातश्चक्षुषस्ते दिवाकरः । कर्णाभ्यां श्वसनः प्राणैर्जिह्वाया हव्यवाडपि
    ॥ ११॥ नाभितो गगनं द्यौश्च मूर्ध्नस्ते समवर्त्तत । पादाभ्यां ते धरा जाता दिशश्चाष्टौ श्रुतेर्गताः ॥
    १२॥ सप्तासन्परिधयस्त्वत्त एकविंशत्समिच्च वै । चराचराः सर्वभावास्त्वत्त एव हि जज्ञिरे ॥ १३॥ त्वमेव
    जगतां नाथस्त्वमेव परिपालकः । उग्ररूपश्च संहर्ता त्वमेव परमेश्वर ॥ १४॥ त्वमेव यज्ञो यज्ञांशस्त्वं यज्ञेशः
    परात्परः । शब्दब्रह्मपरं त्वं हि शब्दब्रह्मासि विश्वराट् ॥ १५॥ स्वराट् संराड्जगन्नाथ विराडसि जगत्पते
    । अधश्चोर्ध्वं च तिर्यक्त्वं त्वया व्याप्तं जगन्मय ॥ १६॥ प्राप्नुवन्ति परं स्थानं त्वां यजन्तश्च याज्ञिकाः
    । भोज्यं भोक्ता हविर्होता हवनं त्वं फलप्रदः ॥ १७॥ समस्तकर्मभोक्ता त्वं सर्वकर्मात्मकः प्रभो । सर्वकर्मोपकरणं
    सर्वकर्मफलप्रदः ॥ १८॥ कर्मप्रेरयिता त्वं हि धर्मकामार्थसिद्धिदः । त्वामृते मुक्तिदः कोऽन्यो हृषीकेश
    नमोऽस्तु ते ॥ १९॥ नमोऽस्त्वनन्ताय सहस्रमूर्त्तये सहस्रपादाक्षिशिरोरुबाहवे । सहस्रनाम्ने पुरुषाय शाश्वते
    सहस्रकोटीयुगधारिणे नमः ॥ २
