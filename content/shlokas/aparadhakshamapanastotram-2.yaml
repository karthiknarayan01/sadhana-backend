id: aparadhakshamapanastotram-2
category: stotram
name:
  english: aparadhakshamapanastotram
  devanagari: अपराधक्षमापनस्तोत्रम्
content:
  english: aparadhakshamapanastotram vasudevanandasarasvati aparadhakshamapanastotram dattatreyastotrani
    vasudevanandasarasvati rasajnavashatarakam svadulabhyam grihitam kadacinna te nama datta | kshamasvaparadham
    kshamasvaparadham kshamasvaparadham prabho klinnacitta || 1|| viyonyantare daivadardhya vibhoprag
    grihitam kadacinna te nama datta | kshamasvaparadham kshamasvaparadham kshamasvaparadham prabho klinnacitta
    || 2|| maya matrigarbhasthitipraptakashtat grihitam kadacinna te nama datta | kshamasvaparadham kshamasvaparadham
    kshamasvaparadham prabho klinnacitta || 3|| maya jatamatrena sammohitena grihitam kadacinna te nama
    datta | kshamasvaparadham kshamasvaparadham kshamasvaparadham prabho klinnacitta || 4|| maya kridanasaktacittena
    balye grihitam kadacinna te nama datta | kshamasvaparadham kshamasvaparadham kshamasvaparadham prabho
    klinnacitta || 5|| maya yauvane'jnanato bhogatoshad grihitam kadacinna te nama datta | kshamasvaparadham
    kshamasvaparadham kshamasvaparadham prabho klinnacitta || 6|| maya sthavirenighnasarvendriyena grihitam
    kadacinna te nama datta | kshamasvaparadham kshamasvaparadham kshamasvaparadham prabho klinnacitta
    || 7|| hrishikesha me vanmanahkayajatam harejnanato'jnanato vishvasakshin | kshamasvaparadham kshamasvaparadham
    kshamasvaparadham prabho klinnacitta || 8|| smrito dhyata avahito'syarcito va na gitah stuto vandito
    va na japtah | kshamasvaparadham kshamasvaparadham kshamasvaparadham prabho klinnacitta || 9|| dayabdhirbhavaddanna
    sagashca madrig bhavatyatpamantorbhavanme sharanyah | yathalambanam bhurhi bhunihsritamghre riti prarthitam
    dattashishyena saram || 10|| || iti paramapujya shrimad vasudevanandasarasvati svamimaharajakrita
    aparadhakshamapana stotram sampurnam ||
  devanagari: अपराधक्षमापनस्तोत्रम् वासुदेवानन्दसरस्वती अपराधक्षमापनस्तोत्रम् दत्तात्रेयस्तोत्राणि वासुदेवानन्दसरस्वती
    रसज्ञावशातारकं स्वादुलभ्यम् गृहीतं कदाचिन्न ते नाम दत्त । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं
    प्रभो क्लिन्नचित्त ॥ १॥ वियोन्यन्तरे दैवदार्ढ्या विभोप्राग् गृहीतं कदाचिन्न ते नाम दत्त । क्षमस्वापराधं
    क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ २॥ मया मातृगर्भस्थितिप्राप्तकष्टात् गृहीतं कदाचिन्न
    ते नाम दत्त । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ ३॥ मया जातमात्रेण संमोहितेन
    गृहीतं कदाचिन्न ते नाम दत्त । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ ४॥ मया
    क्रीडनासक्तचित्तेन बाल्ये गृहीतं कदाचिन्न ते नाम दत्त । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं
    प्रभो क्लिन्नचित्त ॥ ५॥ मया यौवनेऽज्ञानतो भोगतोषाद् गृहीतं कदाचिन्न ते नाम दत्त । क्षमस्वापराधं क्षमस्वापराधं
    क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ ६॥ मया स्थाविरेनिघ्नसर्वेन्द्रियेण गृहीतं कदाचिन्न ते नाम दत्त
    । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ ७॥ हृषीकेश मे वाङ्मनःकायजातम् हरेज्ञानतोऽज्ञानतो
    विश्वसाक्षिन् । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त ॥ ८॥ स्मृतो ध्यात आवाहितोऽस्यर्चितो
    वा न गीतः स्तुतो वन्दितो वा न जप्तः । क्षमस्वापराधं क्षमस्वापराधं क्षमस्वापराधं प्रभो क्लिन्नचित्त
    ॥ ९॥ दयाब्धिर्भवाद्दङ्न सागाश्च मादृग् भवत्यात्पमन्तोर्भवान्मे शरण्यः । यथालम्बनं भूर्हि भूनिःसृतांघ्रे
    रिति प्रार्थितं दत्तशिष्येण सारम् ॥ १०॥ ॥ इति परमपूज्य श्रीमद् वासुदेवानन्दसरस्वती स्वामीमहाराजकृत
    अपराधक्षमापन स्तोत्रं संपूर्णम् ॥
