id: shantivacanastotram
category: stotram
name:
  english: shantivacanastotram
  devanagari: शान्तिवाचनस्तोत्रम्
content:
  english: 70|| svastyastu dvipade nityam shantirastu catushpade | sham prajabhyastathaivastu sham tatha''tmani
    castu nah || 71|| shantirastu ca devasya bhurbhuvah svah shivam tatha | shantirastu shivam castu sarvatah
    svastirastu nah || 72|| tvam deva jagatah srashta poshta caiva tvameva hi | prajah palaya devesha
    shantim kuru jagatpate || 73|| iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye
    pancavimshadhyayantargatam shantivacanastotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda
    | adhyaya 25
  devanagari: ७०॥ स्वस्त्यस्तु द्विपदे नित्यं शान्तिरस्तु चतुष्पदे । शं प्रजाभ्यस्तथैवास्तु शं तथाऽऽत्मनि
    चास्तु नः ॥ ७१॥ शान्तिरस्तु च देवस्य भूर्भुवः स्वः शिवं तथा । शान्तिरस्तु शिवं चास्तु सर्वतः स्वस्तिरस्तु
    नः ॥ ७२॥ त्वं देव जगतः स्रष्टा पोष्टा चैव त्वमेव हि । प्रजाः पालय देवेश शान्तिं कुरु जगत्पते ॥ ७३॥
    इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये पञ्चविंशाध्यायान्तर्गतं शान्तिवाचनस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड । अध्याय २५
meaning: {}
