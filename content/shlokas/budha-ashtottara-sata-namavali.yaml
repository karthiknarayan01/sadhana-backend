id: budha-ashtottara-sata-namavali
category: stotram
name:
  english: Budha Ashtottara Sata Namavali
content:
  english: om budhaya namah | om budharcitaya namah | om saumyaya namah | om saumyacittaya namah | om
    shubhapradaya namah | om dridhavrataya namah | om dridhaphalaya namah | om shrutijalaprabodhakaya
    namah | om satyavasaya namah | om satyavacase namah || || om shreyasam pataye namah | om avyayaya
    namah | om somajaya namah | om sukhadaya namah | om shrimate namah | om somavamshapradipakaya namah
    | om vedavide namah | om vedatattvajnaya namah | om vedantajnanabhasvaraya namah | om vidyavicakshanaya
    namah || || om vibhave namah | om vidvatpritikaraya namah | om rijave namah | om vishvanukulasancaraya
    namah | om visheshavinayanvitaya namah | om vividhagamasarajnaya namah | om viryavate namah | om vigatajvaraya
    namah | om trivargaphaladaya namah | om anantaya namah || || om tridashadhipapujitaya namah | om buddhimate
    namah | om bahushastrajnaya namah | om baline namah | om bandhavimocakaya namah | om vakrativakragamanaya
    namah | om vasavaya namah | om vasudhadhipaya namah | om prasannavadanaya namah | om vandyaya namah
    || || om varenyaya namah | om vagvilakshanaya namah | om satyavate namah | om satyasankalpaya namah
    | om satyabandhave namah | om sadadaraya namah | om sarvarogaprashamanaya namah | om sarvamrityunivarakaya
    namah | om vanijyanipunaya namah | om vashyaya namah || || om vatangaya namah | om vatarogahrite namah
    | om sthulaya namah | om sthairyagunadhyakshaya namah | om sthulasukshmadikaranaya namah | om aprakashaya
    namah | om prakashatmane namah | om ghanaya namah | om gaganabhushanaya namah | om vidhistutyaya namah
    || || om vishalakshaya namah | om vidvajjanamanoharaya namah | om carushilaya namah | om svaprakashaya
    namah | om capalaya namah | om jitendriyaya namah | om udanmukhaya namah | om makhasaktaya namah |
    om magadhadhipataye namah | om haraye namah || om saumyavatsarasanjataya namah | om somapriyakaraya
    namah | om sukhine namah | om simhadhirudhaya namah | om sarvajnaya namah | om shikhivarnaya namah
    | om shivankaraya namah | om pitambaraya namah | om pitavapushe namah | om pitacchatradhvajankitaya
    namah || || om khadgacarmadharaya namah | om karyakartre namah | om kalushaharakaya namah | om atreyagotrajaya
    namah | om atyantavinayaya namah | om vishvapavanaya namah | om campeyapushpasankashaya namah | om
    caranaya namah | om carubhushanaya namah | om vitaragaya namah || || om vitabhayaya namah | om vishuddhakanakaprabhaya
    namah | om bandhupriyaya namah | om bandhamuktaya namah | om banamandalasamshritaya namah | om arkeshanapradeshasthaya
    namah | om tarkashastravisharadaya namah | om prashantaya namah | om pritisamyuktaya namah | om priyakrite
    namah || || om priyabhashanaya namah | om medhavine namah | om madhavasaktaya namah | om mithunadhipataye
    namah | om sudhiye namah | om kanyarashipriyaya namah | om kamapradaya namah | om ghanaphalashrayaya
    namah ||
  devanagari: ॐ बुधाय नमः । ॐ बुधार्चिताय नमः । ॐ सौम्याय नमः । ॐ सौम्यचित्ताय नमः । ॐ शुभप्रदाय नमः ।
    ॐ दृढव्रताय नमः । ॐ दृढफलाय नमः । ॐ श्रुतिजालप्रबोधकाय नमः । ॐ सत्यवासाय नमः । ॐ सत्यवचसे नमः ॥ ॥
    ॐ श्रेयसां पतये नमः । ॐ अव्ययाय नमः । ॐ सोमजाय नमः । ॐ सुखदाय नमः । ॐ श्रीमते नमः । ॐ सोमवंशप्रदीपकाय
    नमः । ॐ वेदविदे नमः । ॐ वेदतत्त्वज्ञाय नमः । ॐ वेदान्तज्ञानभास्वराय नमः । ॐ विद्याविचक्षणाय नमः ॥
    ॥ ॐ विभवे नमः । ॐ विद्वत्प्रीतिकराय नमः । ॐ ऋजवे नमः । ॐ विश्वानुकूलसञ्चाराय नमः । ॐ विशेषविनयान्विताय
    नमः । ॐ विविधागमसारज्ञाय नमः । ॐ वीर्यवते नमः । ॐ विगतज्वराय नमः । ॐ त्रिवर्गफलदाय नमः । ॐ अनन्ताय
    नमः ॥ ॥ ॐ त्रिदशाधिपपूजिताय नमः । ॐ बुद्धिमते नमः । ॐ बहुशास्त्रज्ञाय नमः । ॐ बलिने नमः । ॐ बन्धविमोचकाय
    नमः । ॐ वक्रातिवक्रगमनाय नमः । ॐ वासवाय नमः । ॐ वसुधाधिपाय नमः । ॐ प्रसन्नवदनाय नमः । ॐ वन्द्याय नमः
    ॥ ॥ ॐ वरेण्याय नमः । ॐ वाग्विलक्षणाय नमः । ॐ सत्यवते नमः । ॐ सत्यसङ्कल्पाय नमः । ॐ सत्यबन्धवे नमः
    । ॐ सदादराय नमः । ॐ सर्वरोगप्रशमनाय नमः । ॐ सर्वमृत्युनिवारकाय नमः । ॐ वाणिज्यनिपुणाय नमः । ॐ वश्याय
    नमः ॥ ॥ ॐ वाताङ्गाय नमः । ॐ वातरोगहृते नमः । ॐ स्थूलाय नमः । ॐ स्थैर्यगुणाध्यक्षाय नमः । ॐ स्थूलसूक्ष्मादिकारणाय
    नमः । ॐ अप्रकाशाय नमः । ॐ प्रकाशात्मने नमः । ॐ घनाय नमः । ॐ गगनभूषणाय नमः । ॐ विधिस्तुत्याय नमः ॥
    ॥ ॐ विशालाक्षाय नमः । ॐ विद्वज्जनमनोहराय नमः । ॐ चारुशीलाय नमः । ॐ स्वप्रकाशाय नमः । ॐ चपलाय नमः ।
    ॐ जितेन्द्रियाय नमः । ॐ उदङ्मुखाय नमः । ॐ मखासक्ताय नमः । ॐ मगधाधिपतये नमः । ॐ हरये नमः ॥ ॐ सौम्यवत्सरसञ्जाताय
    नमः । ॐ सोमप्रियकराय नमः । ॐ सुखिने नमः । ॐ सिंहाधिरूढाय नमः । ॐ सर्वज्ञाय नमः । ॐ शिखिवर्णाय नमः
    । ॐ शिवङ्कराय नमः । ॐ पीताम्बराय नमः । ॐ पीतवपुषे नमः । ॐ पीतच्छत्रध्वजाङ्किताय नमः ॥ ॥ ॐ खड्गचर्मधराय
    नमः । ॐ कार्यकर्त्रे नमः । ॐ कलुषहारकाय नमः । ॐ आत्रेयगोत्रजाय नमः । ॐ अत्यन्तविनयाय नमः । ॐ विश्वपावनाय
    नमः । ॐ चाम्पेयपुष्पसङ्काशाय नमः । ॐ चारणाय नमः । ॐ चारुभूषणाय नमः । ॐ वीतरागाय नमः ॥ ॥ ॐ वीतभयाय
    नमः । ॐ विशुद्धकनकप्रभाय नमः । ॐ बन्धुप्रियाय नमः । ॐ बन्धमुक्ताय नमः । ॐ बाणमण्डलसंश्रिताय नमः ।
    ॐ अर्केशानप्रदेशस्थाय नमः । ॐ तर्कशास्त्रविशारदाय नमः । ॐ प्रशान्ताय नमः । ॐ प्रीतिसंयुक्ताय नमः ।
    ॐ प्रियकृते नमः ॥ ॥ ॐ प्रियभाषणाय नमः । ॐ मेधाविने नमः । ॐ माधवसक्ताय नमः । ॐ मिथुनाधिपतये नमः । ॐ
    सुधिये नमः । ॐ कन्याराशिप्रियाय नमः । ॐ कामप्रदाय नमः । ॐ घनफलाश्रयाय नमः ॥
