id: prashnopanishad-question-6
category: stotram
name:
  english: Prashnopanishad - Question 6
content:
  english: shashthah prashnah atha hainam sukesha bharadvajah papraccha bhagavan hiranyanabhah kausalyo
    rajaputro mamupetyaita nte navakshyamiti | samulo va esha parishushyati yo 'nritamabhivadati| tasmannar
    va~ktum| sa tushnim rathamaruhya pravavraja| ta ntva pricchami kvasau purusha iti || || tasmai sa
    hovaca | ihaivantassharire somya sa purusho yasminneta shshodasha kalah prabhavantiti || || sa ikshancakre|
    kasminnahamutkranta utkranto bhavishyami kasmin va pratishthite pratishthasyamiti || || sa pranamasrijata|
    pranacchraddha va~yurjyotirapah prithivindriya ntapo mantrah karmaloka lokeshu ca nama ca || ngacchanti
    bhidyete tasa nnamarupe samudra ityeva mprocyate| evamevasya paridrashturima shshodasha kalah purushayanah
    purusha ngacchanti bhidyete casa nnamarupe purusha ityeva 'mrito bhavati tadesha shlokah || || ara
    iva rathanabhau kala yasmi ve~da yatha ma vo mrityuh parivyatha iti || || tan hovacaitavadevahameta
    mbrahma veda| natah paramastiti || || te tamarcayantastvam hi nah pita yo ntarayasiti| namah paramarishibhyo
    namah paramarishibhyah ||
  devanagari: षष्ठः प्रश्नः अथ हैनं सुकेशा भारद्वाजः पप्रच्छ भगवन् हिरण्यनाभः कौसल्यो राजपुत्रो मामुपेत्यैत
    न्ते नावक्ष्यमिति । समूलो वा एष परिशुष्यति यो ऽनृतमभिवदति। तस्मान्नार् वँक्तुम्। स तूष्णीं रथमारुह्य
    प्रवव्राज। त न्त्वा पृच्छामि क्वासौ पुरुष इति ॥ ॥ तस्मै स होवाच । इहैवान्तस्शरीरे सोम्य स पुरुषो यस्मिन्नेता
    ष्षोडश कलाः प्रभवन्तीति ॥ ॥ स ईक्षाञ्चक्रे। कस्मिन्नहमुत्क्रान्त उत्क्रान्तो भविष्यामि कस्मिन् वा
    प्रतिष्ठिते प्रतिष्ठास्यामीति ॥ ॥ स प्राणमसृजत। प्राणाच्छ्रद्धा वाँयुर्ज्योतिरापः पृथिवीन्द्रिय न्तपो
    मन्त्राः कर्मलोका लोकेषु च नाम च ॥ ङ्गच्छन्ति भिद्येते तासा न्नामरूपे समुद्र इत्येव म्प्रोच्यते। एवमेवास्य
    परिद्रष्टुरिमा ष्षोडश कलाः पुरुषायणाः पुरुष ङ्गच्छन्ति भिद्येते चासा न्नामरूपे पुरुष इत्येव ऽमृतो
    भवति तदेष श्लोकः ॥ ॥ अरा इव रथनाभौ कला यस्मि वेँद यथा मा वो मृत्युः परिव्यथा इति ॥ ॥ तान् होवाचैतावदेवाहमेत
    म्ब्रह्म वेद। नातः परमस्तीति ॥ ॥ ते तमर्चयन्तस्त्वं हि नः पिता यो न्तारयसीति। नमः परमऋषिभ्यो नमः परमऋषिभ्यः
    ॥
