id: ramakrishnastotram-5
category: stotram
name:
  english: ramakrishnastotram 5
  devanagari: रामकृष्णस्तोत्रम् ५
content:
  english: purnam | karoti dhruvam darshanasparshanadeh phalam bhashitum ko'styalam devadeva || 4|| vivasvat
    prakashah payodhestaranga yathakashagastarakah santyameyah | asankhyastatha yadgunanam ganastam bhaje
    ramakrishnam parabrahmarupam || 5|| vikarahetavapi nirvikaram sakaramapyakritishunyabhavam | jnanopadeshaih
    sukritopakaram shri ramakrishnam shirasa nato'smi || 6|| yathambudhim yanti vibhinna ganga
  devanagari: पूर्णम् । करोति ध्रुवं दर्शनस्पर्शनादेः फलं भाषितुं कोऽस्त्यलं देवदेव ॥ ४॥ विवस्वत् प्रकाशाः
    पयोधेस्तरङ्गा यथाकाशगास्तारकाः सन्त्यमेयाः । असङ्ख्यास्तथा यद्गुणानां गणास्तं भजे रामकृष्णं परब्रह्मरूपम्
    ॥ ५॥ विकारहेतावपि निर्विकारं साकारमप्याकृतिशून्यभावम् । ज्ञानोपदेशैः सुकृतोपकारं श्री रामकृष्णं शिरसा
    नतोऽस्मि ॥ ६॥ यथाम्बुधिं यान्ति विभिन्न गङ्गा
meaning: {}
