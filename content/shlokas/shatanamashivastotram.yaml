id: shatanamashivastotram
category: stotram
name:
  english: shatanamashivastotram
  devanagari: शतनामशिवस्तोत्रम्
content:
  english: shatanama shivastotram pradakshinanamaskaraih pujaniyah sadashivah | namnam shatena rudro'sau
    stavaniyo yatavidhi || 74|| om namo rudraya bhimaya nilakanthaya vedhase | kapardine sureshaya vyomakeshaya
    vai namah || 75|| vrishadhvajaya somaya nilakanthaya vai namah | digambaraya bhargaya umakanta kapardine
    || 76|| tapomayaya vyaptaya shipivishtaya vai namah | vyalapriyaya vyalaya vyalanam pataye namah ||
    77|| mahidharaya vyaghraya pashunam pataye namah | tripurantakasimhaya shardulograravaya ca || 78||
    minaya minanathaya siddhaya parameshthine | kamantakaya buddhaya buddhinam pataye namah || 79|| kapotaya
    vishishtaya shishtaya paramatmane | vedaya vedabijaya devaguhyaya vai namah || 80|| dirghaya dirghadirghaya
    dirgharghaya mahaya ca | namo jagatpratishthaya vyomarupaya vai namah || 81|| gajasuravinashaya hyandhakasurabhedine
    | nilalohitashuklaya candamundapriyaya ca || 82|| bhaktipriyaya devaya jnanajnanavyayaya ca | maheshaya
    namastubhyam mahadevaharaya ca || 83|| trinetraya trivedaya vedangaya namo namah | arthaya artharupaya
    paramarthaya vai namah || 84|| vishvarupaya vishvaya vishvanathaya vai namah | shankaraya ca kalaya
    kalavayavarupine || 85|| arupaya ca sukshmaya sukshmasukshmaya vai namah | shmashanavasine tubhyam
    namaste krittivasase || 86|| shashankashekharayaiva rudravishvashrayaya ca | durgaya durgasaraya durgavayavasakshine
    || 87|| lingarupaya lingaya linganam pataye namah | namah pranavarupaya pranavarthaya vai namah ||
    88|| namo namah karanakaranaya te mrityunjayayatmabhavasvarupine | triyambakayasitakantha bharga gauripate
    sakalamangalahetave namah || 89|| iti shriskandapurane maheshvarakhande
  devanagari: शतनाम शिवस्तोत्रम् प्रदक्षिणनमस्कारैः पूजनीयः सदाशिवः । नाम्नां शतेन रुद्रोऽसौ स्तवनीयो
    यताविधि ॥ ७४॥ ॐ नमो रुद्राय भीमाय नीलकण्ठाय वेधसे । कपर्दिने सुरेशाय व्योमकेशाय वै नमः ॥ ७५॥ वृषध्वजाय
    सोमाय नीलकण्ठाय वै नमः । दिगम्बराय भर्गाय उमाकान्त कपर्दिने ॥ ७६॥ तपोमयाय व्याप्ताय शिपिविष्टाय वै
    नमः । व्यालप्रियाय व्यालाय व्यालानां पतये नमः ॥ ७७॥ महीधराय व्याघ्राय पशूनां पतये नमः । त्रिपुरान्तकसिंहाय
    शार्दूलोग्ररवाय च ॥ ७८॥ मीनाय मीननाथाय सिद्धाय परमेष्ठिने । कामान्तकाय बुद्धाय बुद्धीनां पतये नमः
    ॥ ७९॥ कपोताय विशिष्टाय शिष्टाय परमात्मने । वेदाय वेदबीजाय देवगुह्याय वै नमः ॥ ८०॥ दीर्घाय दीर्घदीर्घाय
    दीर्घार्घाय महाय च । नमो जगत्प्रतिष्ठाय व्योमरूपाय वै नमः ॥ ८१॥ गजासुरविनाशाय ह्यन्धकासुरभेदिने ।
    नीललोहितशुक्लाय चण्डमुण्डप्रियाय च ॥ ८२॥ भक्तिप्रियाय देवाय ज्ञानज्ञानाव्ययाय च । महेशाय नमस्तुभ्यं
    महादेवहराय च ॥ ८३॥ त्रिनेत्राय त्रिवेदाय वेदाङ्गाय नमो नमः । अर्थाय अर्थरूपाय परमार्थाय वै नमः ॥ ८४॥
    विश्वरूपाय विश्वाय विश्वनाथाय वै नमः । शङ्कराय च कालाय कालावयवरूपिणे ॥ ८५॥ अरूपाय च सूक्ष्माय सूक्ष्मसूक्ष्माय
    वै नमः । श्मशानवासिने तुभ्यं नमस्ते कृत्तिवाससे ॥ ८६॥ शशाङ्कशेखरायैव रुद्रविश्वाश्रयाय च । दुर्गाय
    दुर्गसाराय दुर्गावयवसाक्षिणे ॥ ८७॥ लिङ्गरूपाय लिङ्गाय लिङ्गानां पतये नमः । नमः प्रणवरूपाय प्रणवार्थाय
    वै नमः ॥ ८८॥ नमो नमः कारणकारणाय ते मृत्युञ्जयायात्मभवस्वरूपिणे । त्रियम्बकायासितकण्ठ भर्ग गौरिपते
    सकलमङ्गलहेतवे नमः ॥ ८९॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
