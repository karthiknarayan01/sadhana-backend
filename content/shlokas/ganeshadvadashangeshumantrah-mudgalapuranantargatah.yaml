id: ganeshadvadashangeshumantrah-mudgalapuranantargatah
category: mantra
name:
  english: ganeshadvadashangeshumantrah (mudgalapuranantargatah)
  devanagari: गणेशद्वादशाङ्गेषुमन्त्राः (मुद्गलपुराणान्तर्गताः)
content:
  english: rinu prabho || 11|| ganeshocchishtagandham vai grihyadau niyato nyaset | svanandavasine japtva
    namo murdhanamarcayet || 12|| lalatam gananathaya nama uccarya carcayet | dakshinam karnamulam ca
    gajakarnaya vai namah || 13|| vamakarnam tatha daksha shurpakarnaya te namah | arcayecca tatah kantham
    vighneshaya tatah pathan || 14|| bahum dakshinagam tadvad herambaya namo'rcayet | vamam samarcayet
    sujnah siddhinathaya vai namah || 15|| hridayam carcayettatra buddhishaya namo vidhe | udaram nabhisamsthanam
    namo lambodaraya te || 16|| dakshinam caiva kukshim sa vakratundaya vai namah | vamam tu cintamanaye
    hyarcayennatra samshayah || 17|| prishthadesham nabhisamamarcayet dhundhaye namah | ete dvadasha mantrashca
    kathitaste prajapate || 18|| iti shriganeshadvadashangeshumantrah sampurnah ||
  devanagari: ृणु प्रभो ॥ ११॥ गणेशोच्छिष्टगन्धं वै गृह्यादौ नियतो न्यसेत् । स्वानन्दवासिने जप्त्वा नमो
    मूर्धानमर्चयेत् ॥ १२॥ ललाटं गणनाथाय नम उच्चार्य चार्चयेत् । दक्षिणं कर्णमूलं च गजकर्णाय वै नमः ॥ १३॥
    वामकर्णं तथा दक्ष शूर्पकर्णाय ते नमः । अर्चयेच्च ततः कण्ठं विघ्नेशाय ततः पठन् ॥ १४॥ बाहुं दक्षिणगं
    तद्वद् हेरम्बाय नमोऽर्चयेत् । वामं समर्चयेत् सुज्ञः सिद्धिनाथाय वै नमः ॥ १५॥ हृदयं चार्चयेत्तत्र बुद्धीशाय
    नमो विधे । उदरं नाभिसंस्थानं नमो लम्बोदराय ते ॥ १६॥ दक्षिणं चैव कुक्षिं स वक्रतुण्डाय वै नमः । वामं
    तु चिन्तामणये ह्यर्चयेन्नात्र संशयः ॥ १७॥ पृष्ठदेशं नाभिसममर्चयेत् ढुण्ढये नमः । एते द्वादश मन्त्राश्च
    कथितास्ते प्रजापते ॥ १८॥ इति श्रीगणेशद्वादशाङ्गेषुमन्त्राः सम्पूर्णाः ॥
