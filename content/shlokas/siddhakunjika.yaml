id: siddhakunjika
category: stotram
name:
  english: siddhakunjika
  devanagari: सिद्धकुन्जिका
content:
  english: om am kam cam tam tam pam sam viduram viduram vimardaya vimardaya hrim ksham kshim srim jivaya
    jivaya trotaya trotaya jambhaya jambhaya dipaya dipaya mocaya mocaya hum phat jram vaushat aim hṟim
    klim ranjaya ranjaya sanjaya sanjaya gunjaya gunjaya bandhaya bandhaya bhram bhrim bhrum bhairavi
    bhadre sankuca sankuca trotaya trotaya mlim svaha || 12|| pam pim pum parvati purna kham khim khum
    khecari tatha | mlam mlim mlum mulavistirna kunjikastotra hetave | sam sim sum saptashati devya mamtrasiddhim
    kurushva me || 13|| kunjikayai namo namah | idam tu kunjikastotram mantrajagartihetave | abhakte naiva
    datavyam gopitam raksha parvati || 14|| yastu kunjikaya devi hinam saptashatim pathet | na tasya jayate
    siddhiraranye rodanam yatha || 15|| | iti shrirudrayamale gauritantre shivaparvatisamvade kunjikastotram
    sampurnam |
  devanagari: ॐ अं कं चं टं तं पं सां विदुरां विदुरां विमर्दय विमर्दय ह्रीं क्षां क्षीं स्रीं जीवय जीवय
    त्रोटय त्रोटय जम्भय जंभय दीपय दीपय मोचय मोचय हूं फट् ज्रां वौषट् ऐं ह्ऱीं क्लीं रञ्जय रञ्जय सञ्जय
    सञ्जय गुञ्जय गुञ्जय बन्धय बन्धय भ्रां भ्रीं भ्रूं भैरवी भद्रे सङ्कुच सङ्कुच त्रोटय त्रोटय म्लीं स्वाहा
    ॥ १२॥ पां पीं पूं पार्वती पूर्णा खां खीं खूं खेचरी तथा । म्लां म्लीं म्लूं मूलविस्तीर्णा कुञ्जिकास्तोत्र
    हेतवे । सां सीं सूं सप्तशती देव्या मंत्रसिद्धिं कुरूष्व मे ॥ १३॥ कुञ्जिकायै नमो नमः । इदं तु कुञ्जिकास्तोत्रं
    मन्त्रजागर्तिहेतवे । अभक्ते नैव दातव्यं गोपितं रक्ष पार्वति ॥ १४॥ यस्तु कुञ्जिकया देवि हीनां सप्तशतीं
    पठेत् । न तस्य जायते सिद्धिररण्ये रोदनं यथा ॥ १५॥ । इति श्रीरुद्रयामले गौरीतन्त्रे शिवपार्वतीसंवादे
    कुञ्जिकास्तोत्रं सम्पूर्णम् ।
