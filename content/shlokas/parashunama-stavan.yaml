id: parashunama-stavan
category: stotram
name:
  english: Parashunama Stavan
content:
  english: jaya parashurama lalama karunadhama duhkhahara sukhakaram | jaya renuka nandana sahasrarjuna
    nikandana bhriguvaram || jaya parashurama jamadagni suta bala buddhiyukta guna jnana shila sudhakaram
    | bhriguvamsha candana shaurya teja divakaram || shobhita jata gala sutra mala sundaram mada moha
    maya tamaharam || jaya parashurama matrijivaka matriha pituvacadharam | jaya jagatakarta jagatabharta
    jagata hara jagadishvaram || jaya krodhavira jaya ranadhira aribala mada haram | jaya dharma rakshaka
    dushtaghataka sadhu santa abhayankaram || jaya parashurama kanda mukunda santata shubhakaram | jaya
    nirvikara apara guna agara mahima vistaram || aja antahina pravina arata dina hitakari param | jaya
    moksha data sarva vidhi mangalakaram || jaya parashurama
  devanagari: जय परशुराम ललाम करूणाधाम दुःखहर सुखकरम् । जय रेणुका नन्दन सहस्रार्जुन निकन्दन भृगुवरम् ॥
    जय परशुराम जमदग्नि सुत बल बुद्धियुक्त गुण ज्ञान शील सुधाकरम् । भृगुवंश चन्दन शौर्य तेज दिवाकरम् ॥
    शोभित जटा गल सूत्र माला सुन्दरं मद मोह माया तमहरम् ॥ जय परशुराम मातृजीवक मातृहा पितुवचधरम् । जय जगतकर्ता
    जगतभर्ता जगत हर जगदीश्वरम् ॥ जय क्रोधवीर जय रणधीर अरिबल मद हरम् । जय धर्म रक्षक दुष्टघातक साधु सन्त
    अभयङ्करम् ॥ जय परशुराम कन्द मुकुन्द सन्तत शुभकरम् । जय निर्विकार अपार गुण आगार महिमा विस्तरम् ॥ अज
    अन्तहीन प्रवीन आरत दीन हितकारी परम् । जय मोक्ष दाता सर्व विधि मङ्गलकरम् ॥ जय परशुराम
