id: annamayya-keerthanas-ati-dushtuda-ne-nalusudanu
category: stotram
name:
  english: Annamayya Keerthanas Ati Dushtuda Ne Nalusudanu
content:
  english: atidushtuda ne nalasudanu | yitaravivekam bikanela || èkkada nènnita yemi sesitinò nikkapudappulu
    neramulu | gakkana ninnita kaliginanive dikkugaka mari dikkedi || ghorapubapamu kotlasankhyalu ceruva
    nivè nacesinivi | nirasunaku nitu nikripa nakika kurimi na yèda gunamedi || yèṟigi cesinadi yèṟugaka
    cesina kòṟatalu nayèda gotulive | vèṟapu dirci shrivenkatesha kavu maṟavaka nagati maṟi yedi ||
  devanagari: अतिदुष्टुड ने नलसुडनु । यितरविवेकं बिकनेल ॥ ऎक्कड नॆन्निट येमि सेसितिनॊ निक्कपुदप्पुलु नेरमुलु
    । गक्कन निन्निट कलिगिननीवे दिक्कुगाक मरि दिक्केदि ॥ घोरपुबापमु कोट्लसङ्ख्यलु चेरुव निवॆ नाचेसिनिवि
    । नीरसुनकु निटु नीकृप नाकिक कूरिमि ना यॆड गुणमेदि ॥ यॆऱिगि चेसिनदि यॆऱुगक चेसिन कॊऱतलु नायॆड गोटुलिवे
    । वॆऱपु दीर्चि श्रीवेङ्कटेश कावु मऱवक नागति मऱि येदि ॥
