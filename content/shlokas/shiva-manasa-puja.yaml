id: shiva-manasa-puja
category: stotram
name:
  english: Shiva Manasa Puja
content:
  english: ratnaih kalpitamasanam himajalaih snanam ca divyambaram nanaratna vibhushitam mrigamadamodankitam
    candanam | jati campaka bilvapatra racitam pushpam ca dhupam tatha dipam deva dayanidhe pashupate
    hritkalpitam grihyatam || || sauvarne navaratnakhanda racite patre ghritam payasam bhakshyam pancavidham
    payodadhiyutam rambhaphalam panakam | shakanamayutam jalam rucikaram karpura khandojjvalam tambulam
    manasa maya viracitam bhaktya prabho svikuru || || chatram camarayoryugam vyajanakam cadarshakam nirmalam
    vina bheri mridanga kahalakala gitam ca nrityam tatha | sashtangam pranatih stuti samastam maya sankalpena
    samarpitam tava vibho pujam grihana prabho || || atma tvam girija matih sahacarah pranah shariram
    griham puja te vishayopabhoga racana nidra samadhisthitih | sancarah padayoh pradakshinavidhih stotrani
    sarva giro yadyatkarma karomi tattadakhilam shambho tavaradhanam || || kara carana kritam vakkayajam
    karmajam va shravana nayanajam va manasam vaparadham | vihitamavihitam va sarvametat kshamasva jaya
    jaya karunabdhe shri mahadeva shambho ||
  devanagari: रत्नैः कल्पितमासनं हिमजलैः स्नानं च दिव्याम्बरं नानारत्न विभूषितं मृगमदामोदाङ्कितं चन्दनम्
    । जाती चम्पक बिल्वपत्र रचितं पुष्पं च धूपं तथा दीपं देव दयानिधे पशुपते हृत्कल्पितं गृह्यताम् ॥ ॥ सौवर्णे
    नवरत्नखण्ड रचिते पात्रे घृतं पायसं भक्ष्यं पञ्चविधं पयोदधियुतं रम्भाफलं पानकम् । शाकानामयुतं जलं रुचिकरं
    कर्पूर खण्डोज्ज्वलं ताम्बूलं मनसा मया विरचितं भक्त्या प्रभो स्वीकुरु ॥ ॥ छत्रं चामरयोर्युगं व्यजनकं
    चादर्शकं निर्मलं वीणा भेरि मृदङ्ग काहलकला गीतं च नृत्यं तथा । साष्टाङ्गं प्रणतिः स्तुति समस्तं मया
    सङ्कल्पेन समर्पितं तव विभो पूजां गृहाण प्रभो ॥ ॥ आत्मा त्वं गिरिजा मतिः सहचराः प्राणाः शरीरं गृहं
    पूजा ते विषयोपभोग रचना निद्रा समाधिस्थितिः । सञ्चारः पदयोः प्रदक्षिणविधिः स्तोत्राणि सर्वा गिरो यद्यत्कर्म
    करोमि तत्तदखिलं शम्भो तवाराधनम् ॥ ॥ कर चरण कृतं वाक्कायजं कर्मजं वा श्रवण नयनजं वा मानसं वापराधम्
    । विहितमविहितं वा सर्वमेतत् क्षमस्व जय जय करुणाब्धे श्री महादेव शम्भो ॥
