  devanagari: सीतादलधाम शमक्षमादि शृं गार गुणाभिराम त्रिज गन्नुत शौर्य रमाललाम दु र्वार कबन्धराक्षस वि
    राम जगज्जन कल्मषार्नवो त्तारकनाम ॥ रामविशाल विक्रम पराजित भार्गवराम सद्गुण स्तोम पराङ्गनाविमुख सुव्रत
    काम विनील नीरद श्याम ककुत्ध्सवंश कलशाम्भुधिसोम सुरारिदोर्भलो द्धाम विराम भद्रगिरि दयालसज्घरी विगत
    समस्तदोष त्रिलोक पूतकृ द्गग नधुनीमरन्द पदकञ्ज विशेष मणिप्रभा धग द्धगित विभूष भद्रगिरि दाशरथी करुणापयोनिधी
    विपत्परम्परो त्तुङ्ग तमःपतङ्ग दयान्तरङ्ग स त्सङ्ग धरात्मजा हृदय सारसभृङ्ग निशाचराब्जमा तङ्ग भद्रगिरि
    दाशरथी करुणापयोनिथी ॥ श्रीद सनन्दनादि मुनिसेवित पाद दिगन्तकीर्तिसं पाद समस्तभूत परिपाल विनोद विषाद
    वल्लि का च्छेद धराधिनाथकुल सिन्धुसुधामयपाद नृत्तगी तादि विनोद भद्रगिरि दाशरथी करुणापयोनिधी ॥ आर्युल
    कॆल्ल म्रॊक्किविन ताङ्गुडनै रघुनाध भट्टरा रार्युल कञ्जलॆत्ति कवि सत्तमुलन् विनुतिञ्चि कार्य सौ कर्य
    मॆलर्पनॊक्क शतकम्बॊन गूर्चि रचिन्तुनेडुता त्पर्यमुनन् ग्रहिम्पुमिदि दाशरथी करुणापयोनिधी ॥ मसकॊनि रेङ्गुबण्ड्लुकुनु
    मौक्तिकमुल् वॆलवोसिनट्लुदु र्व्यसनमुजॆन्दि काव्यमु दुरात्मुलकिच्चितिमोस मय्यॆ ना रसनकुँ बूतवृत्तिसुक
    रम्बुग जेकुरुनट्लु वाक्सुधा रसमुलुचिल्क बद्युमुख रङ्गमुनन्दुनटिम्प वय्यसं तसमु जॆन्दि भद्रगिरि दाशरथी
    करुणापयोनिधी ॥ श्रीरमणीयहार यतसी कुसुमाभशरीर परतत्त्वविहार त्रिलोक चेतनो दार दुरन्त पातक वितान विदूर
    खरादि दैत्यकां तार कुठार भद्रगिरि दाशरथी करुणापयोनिधी खर दूषणकाननवीतिहॊत्र चारुवि स्फुरदरविन्दनेत्र
    विनीलभूरिकं धरसमगात्र भद्रगिरि दाशरथी करुणापयोनिधी ॥ कनकविशालचेल भवकानन शातकुठारधार स ज्जनपरिपालशील
    दिविजस्तुत सद्गुण काण्डकाण्ड सं जनित पराक्रमक्रम विशारद शारद कन्दकुन्द चं दन घनसार सारयश दाशरथी करुणापयोनिधी
    ॥ श्री रघुवंश तोयधिकि शीतमयूखुडवैन नी पवि त्रोरुपदाब्जमुल् विकसितोत्पल चम्पक वृत्तमाधुरी पूरितवाक्प्रसूनमुल
    बूजलॊनर्चॆद जित्तगिम्पुमी तारकनाम भद्रगिरि दाशरथी करुणापयोनिधी ॥ गुरुतरमैन काव्यरस गुम्भनकब्बुर मन्दिमुष्करुल्
    सरसुलमाड्कि सन्तसिल जूलुदुरोटुशशाङ्क चन्द्रिकां कुरमुल किन्दु कान्तमणि कोटिस्रविञ्चिन भङ्गिविन्ध्यभू
    धरमुन जाऱुने शिललु दाशरथी करुणापयोनिधी ॥ तरणिकुलेश नानुडुल दप्पुलु गल्गिन नीदुनाम स द्विरचितमैन काव्यमु
    पवित्रमुगादॆ वियन्नदीजलं बरगुचुवङ्कयैन मलिनाकृति बाऱिन दन्महत्वमुं दरमॆ गणिम्प नॆव्वरिकि दाशरथी करुणापयोनिधी
    ॥ दारुणपात काब्धिकि सदा बडबाग्नि भवाकुलार्तिवि स्तारदवानलार्चिकि सुधारसवृष्टि दुरन्त दुर्मता चारभयङ्क
    राटविकि जण्डकठोरकुठारधार नी तारकनाम मॆन्नुकॊन दाशरथी करुणापयोनिधी ॥ हरुनकु नव्विभीषणुनक द्रिजकुं दिरुमन्त्र
    राजमै करिकि सहल्यकुं द्रुपदकन्यकु नार्तिहरिञ्चुचुट्टमै परगिनयट्टि नीपतित पावननाममु जिह्वपै निरं तरमु
    नटिम्पजेयुमिक दाशरथी करुणापयोनिधी ॥ मुप्पुन गालकिङ्करुलु मुङ्गिटवच्चिन वेल रोगमुल् गॊप्परमैनचो गफमु
    कुत्तुक निण्डिनवेल मीस्मरण गल्गुनॊ गल्गदॊ नाटि किप्पुडे तप्पकचेतु मीभजन दाशरथी करुणापयोनिधी ॥ परमदयानिधे
    पतितपावननाम हरे यटञ्चु सु स्धिरमतुलै सदाभजन सेयु महात्मुल पादधूलि ना शिरमुनदाल्तुमीरटकु जेरकुडञ्चु
    यमुण्डु किङ्करो त्करमुल कान बॆट्टुनट दाशरथी करुणापयोनिधी ॥ अजुनकु तण्ड्रिवय्यु सनकादुलकुं बरतत्त्वमय्युस
    द्द्विजमुनिकोटिकॆल्लबर देतवय्यु दिनेशवंश भू भुजुलकु मेटिवय्युबरि पूर्णुडवै वॆलिगॊन्दुपक्षिरा ड्ध्वजमिमु
