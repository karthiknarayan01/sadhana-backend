id: guruparabrahmaparamatmastotram
category: stotram
name:
  english: guruparabrahmaparamatmastotram
  devanagari: गुरुपरब्रह्मपरमात्मास्तोत्रम्
content:
  english: jagatakaranam nityam brahmaivasti nacitaratah | anandaghanarupam yajjnatva tattvatmarupatah
    || 1|| svanyatsarvam parityajya svatmamatrataya sthitih | saccidanandarupena samnyasah sa prakirtitah
    || 2|| samnyasi svatmayatro hi nityam brahmatmarupatah | mayajivo jagadvapi pashyannapi na pashyati
    || 3|| vandhyakumaravatsarvam tasyasyadasadeva hi | anandaghanarupo'sau nirvikalpah sada shucih ||
    4|| parishuddha parakashe cidanandaghane shubhe | astam bhavisthitiryityam svatmamatrataya sada ||
    5|| iti shrisamartharamadasanugrihita shriramapadapankajabhringayamana shrisatparamahamsa parivrajakacaryavara
    bhagavata shrishridharasvamina viracitam shriguru parabrahmaparamatmane namah stotram sampurnam ||
  devanagari: जगतकारणं नित्यं ब्रह्मैवास्ति नचीतरतः । आनन्दघनरूपं यज्ज्ञात्वा तत्त्वात्मरूपतः ॥ १॥ स्वान्यत्सर्वं
    परित्यज्य स्वात्ममात्रतया स्थितिः । सच्चिदानन्दरूपेण संन्यासः स प्रकीर्तितः ॥ २॥ संन्यासी स्वात्मयात्रो
    हि नित्यं ब्रह्मात्मरूपतः । मायाजीवो जगद्वापि पश्यन्नपि न पश्यति ॥ ३॥ वन्ध्याकुमारवत्सर्वं तस्यस्यादसदेव
    हि । आनन्दघनरूपोऽसौ निर्विकल्पः सदा शुचिः ॥ ४॥ परिशुद्ध पराकाशे चिदानन्दघने शुभे । आस्तां भविस्थितिर्यित्यं
    स्वात्ममात्रतया सदा ॥ ५॥ इति श्रीसमर्थरामदासानुगृहित श्रीरामपदपङ्कजभृङ्गायमान श्रीसत्परमहंस परिव्राजकाचार्यवर
    भगवता श्रीश्रीधरस्वामिना विरचितं श्रीगुरु परब्रह्मपरमात्मने नमः स्तोत्रं सम्पूर्णम् ॥
