id: vedanta-dindima
category: stotram
name:
  english: Vedanta Dindima
content:
  english: vedantadindimastatvamekamuddhoshayanti yat | astam purastantattejo dakshinamurtisanjnitam ||
    atma'natma padarthau dvau bhoktribhogyatvalakshanau | brahmeva''tmana dehadiriti vedantadindimah ||
    jnana'jnane padarthom dvavatmano bandhamuktidau | jnananmukti nirbandho'nyaditi vedantadindimah ||
    jnatri jneyam padarthau dvau bhasya bhasakalakshanau | jnata brahma jagat jneya miti vedantadindimah
    || sukhaduhkhe padarthau dvau priyavipriyakarakau | sukham brahma jagahuhkha miti vedantadindimah||
    samashtivyashtirupau dvau padarthau sarvasammatau | samashtirishvaro vyashtirjivo vedantadindimah
    || jnanam karma padarthau dvau vastukatratma tantrakau | jnananmoksho na karmabhya iti vedantadindimah
    || shrotavya'shravyarupi dvau padarthom sukhaduhkhadau | shrotavyam brahma naiva'nya diti vedantadindimah||
    cintya'cintye padathau dvau vishranti shrantidayakau | cintyam brahma param na'nya diti vedantadindimah||
    dhyeya'dhveye padarthau dvau dvau dhisamadhyasamadhidau | dhyatavyam brahma naiva'nya diti vedantadindimah||
    yogino bhogino va'pi tyagino ragino'pi ca | jnananmoksho na sandeha iti vedantadindimah || na varnashrama
    sanketaih na kopasanadibhih| brahmajnanam vina mokshah iti vedantadindimah || asatyassarvasamsaro
    rasamasadidushitah | upekshyo brahma vijneya miti vedantadindimah || vritha kriyam vritha'lapan vrithavadan
    manorathan | tyatvaikam brahma vijneya miti vedantadindimah || sthito brahmatmana jivo brahma jivatmana
    sthitam | iti sampashyatam mukti riti vedantadindimah|| jivo brahmatmana jneyo jneyam jivatmana param
    | muktista daikyavijnana miti vedantadindimah || sarvatmana param brahma shroturatmataya sthitam |
    na''yasa stava vijnaptau iti vedantadindimah || aihikam ca''mudhmikam ca tapantam karmasancayam |
    tyatva brahmaiva vijneya miti vedantadindimah || advaitadvaitavadau dvau sukshmasthuladasham gatau
    | advaitavadanmokshassya diti vedantadindimah || karmino vinivartante nivartanta upasakah| jnanino
    na nivartante iti vedantadindimah || paroksha'satphalam karmajnanam pratyakshasatphalam | jnanameva'bhyasettasmat
    iti vedantadindimah || vritha shramo'yam vidusha vritha'yam karminam shramah | yadi na brahmavijnanam
    iti || vedantadindimah || alam yagairalam yogairalam bhogai ralam dhanaih | parasminbrahmani jnata
    iti vedantadindimah || alam vedairalam shastrairalamam smritipuranakaih | paramatmani vijnate iti
    vedantadindimah || narca na yajusho'rtho'sti na sannartho'ti kashcana | jate brahmatmavijnane iti
    vedantadindimah || karmani cittashuddhyartham maikagryartha mupasanam | mokshartham brahmavijnana
    miti vedantadindimah || sancitagamikarmani dahyante jnanakarmana | prarabdhanubhavanmoksha iti vedantadindimah||
    na punyakarmana vriddhih na hanih papakarmana | nityasangatmanishthanamiti vedantadindimah|| drigdrishyau
    dvau padarthau tau parasparavilakshanau | drigbrahma drishyam maya syaditi vedantadindimah || avidyopadhiko
    jivo mayopadhika ishvarah | maya'vidyagunatitah iti vedantadindimah || buddhipurva'buddhipurvakritanam
    papakarmanam | prayashcittamahojnana miti vedantadindimah || sakaram ca nirakaram nirgunam ca gunatmakam
    | tattvam tatparamam brahma iti vedantadindimah || dvijatvam vidhyanushthanat vipratvam vedapathatah
    | brahmanyam brahmavijnanat iti vedantadindimah || sarvatmana sthitam brahma sarvam brahmatmana sthitam
    | na karyam karanadbhinna miti vedantadindimah || sattasphuranasaukhyani bhasante sarvavastushu |
    tasmadbrahmamayam sarva miti vedantadindimah || avasthatritayam yasya kridabhumitaya sthitam | tadeva
    brahma janiyat iti vedantadindimah|| yanna''dau yashca na'styante tanmadhye bhatamapyasat | ato mithya
    jagatsarvamiti vedantadindimah || yadastyadau yadastyante yanmadhye bhati tatsvayam | praukamidam
    satya miti vedantadindimah || purusharthatrayavishtah purushah pashavo dhrivam | moksharthi purushah
    shreshthah iti vedantadindimah || ghatakudyadikam sarvam mrittikamatrameva ca | tatha brahma jagatsarva
    miti vedantadindimah || shannihatya trayam hitva dvayam bhisva'khilagatim | ekam buddha''shrute moksha
    miti vedantadindimah || bhitva shat panca bhittva'tha bhishva'tha caturakhikam | dvayam hitva shrayedeka
    miti vedantadindimah || deho naha maham dehi dehasakshiti nishcayat | janmamrityupahino'sau iti vedantadindimah
    || pranonahamaham devah pranassakshiti nishcayat | kshutpipasopashanti ssyat iti vedantadindimah ||
    mano na'ha maham devo manassakshiti nishcayat | shokamohapahanirasyat vedantadindimah || buddhirna'hamaham
    devo buddhisakshiti nishcayat | kartribhavanirvrittissyat iti vedantadindimah || najnanam syamaham
    devo'jnanasakshiti nishcayat | sarvanarthanivrittisyat iti vedantadindimah || aham sakshiti yo vidyat
    vivicyaivam puna punah | sa eva mukto'sau vidvan iti vedantadindimah || naham maya na tatkaryam na
    sakshi paramo'smyaham | iti nissamshayajnanat muktirve vedantadindimah || na'ham sarva maham sarvam
    mayi sarvamiti sphutam | jnate tatve kuto duhkha miti vedantadindimah || dehadipancakoshastha ya satta
    pratibhasate | sa sattasstma na sandeha iti vedantadindimah || dehadipancakoshastha ya sphurti ranubhuyate
    | sa sphurtiratma naiva'nya diti vedantadindimah || dehadipancakoshastha ya pritiranubhuyate | sa
    pritiratma kutasthah iti vedantadindimah || vyomadipancabhutastha yasatta bhasate nrinam | sa satta
    paramam brahma iti vedantadindimah || vyomadipancabhutastha ya cideka'nubhuyate | sa cideva param
    brahma iti vedantadindimah || vyomadipancabhutastha ya pritiranubhuyate | sapritireva brahma syat
    iti vedantadindimah || dehadikoshaga satta ya sa vyomadibhutaga | mano'bhavanna tadbhedah iti vedantadindimah
    || dehavikoshaga sphurtirya sa vyomadibhutaga | mano'bhava na tadbheda iti vedantadindimah || dehadikoshaga
    pritirya sa vyomadibhutaga | mana'bhava nna tadbheda iti vedantadindimah|| saccidanandarupatvat brahmaiva'tma
    na samshayah| pramanakotisanghanat iti vedantadindimah|| na jivabrahmanorbhedah sattarupena vidyate|
    sattabhede na manam syat iti vedantadindimah|| na jivabrahmanorbhedah sphurtirupena vidyate | sphurtibhede
    na manam syat iti vedantadindimah || na jivabrahmanorbhedah priyarupena vidyate | priyabhede na manam
    syat iti vedantadindimah || na jivabrahmanorbhedo nana rupena vidyate | namno rupasya mithyatvat iti
    vedantadindimah || na jivabrahmanorbhedah pindabrahmandabhedatah | vyashtessamashterekatvat iti vedantadindimah
    || brahma satyam jaganmithya jivo brahmaiva na h | jivanmuktastu tadvidvan iti vedantadindimah ||
    na namarupe niyate sarvatra vyabhicaratah | anamarupam sarvam syat iti vedantadindimah || anamarupam
    sakalam sanmayam cinmayam param | kuto bhedah kuto bandhah iti vedantadindimah || na tattvatkathyate
    loko namadyairvyabhicaratah| vaturjaratha ityadyai riti vedantadindimah || namarupatmakam vishvamindrajalam
    vidurbudhah | anamatvadayuktatvat iti vedantadindimah || abhedadarshanam mokshah samsaye bhedadarshanam
    | sarvavedantasiddhantah iti vedantadindimah || na matabhiniveshitvat na bhashaveshamatratah | mukti
    rvina''tmavijnanat iti vedantadindimah || na kasyapratishiddhabhih kriyabhi mokshavasana | ishvaranugrahatsa
    syat iti vedantadindimah || avijnate janma nashtam vijnate janma sarthakam | jnaturatma na dure syat
    iti vedantadindimah || dashamasya parijnanena''yaso'sti yathah tatha | svastha brahmatmavijnane iti
    vedantadindimah || upekshyopadhikan doshan grihyante vishama yatha | upekshya drishyam ya dbrahma
    iti vedantadindimah || sukhamalpam bahuh kleshovishayamahinam nrinam | anantam brahmanishthanam iti
    vedantadindimah || dhanairva dhanadaih putraih daragarasahodaraih | dhrivam pranaharairduhkham iti
    vedantadindimah|| supte rutthaya suptyantyam brahmaikam pravicintyatam | natidure nrinam mrityuh iti
    vedantadindimah || pancanamapikoshanam maya'narthavyayocita | tatsakshi brahma vijnana miti vedantadindimah
    || dashamatvaparijnane nanajnasya yatha sukham | tatha jivasya satpraptau iti vedantadindimah|| navabhyo'sti
    param pratyaknasa veda param param | tadvijnanadbhavetturya mukti rvedantadindimah || nava''bhasanavajnatvat
    navopadhinnavatmana | mithya jnatva'vashishte tu maunam vedantadindimah|| parame brahmani svasmin
    pravilapya'khilam jagat | gayanadvatamanandam aste vedantadindimah || pratilomanulomabhyam vishvaropapavadayoh
    | cintane shishyate tatvam iti vedantadindimah || namarupabhimanasthat samsarasarvadehinam | saccidanandadrishtistyat
    muktirvedantadindimah || sacidanandasatyatve mithyatve namarupayoh| vijnate kimidam jneyam iti vedantadindimah
    || salambanam niralambam sarvalambavalambitam | alambena'khilalamba miti vedantadindimah|| na kurya
    nna vijaniyat sarvam brahmetyanusmaran | yatha sukham tatha tishthet iti vedantadindimah|| svakarmapashavashagah
    prajno'nyo va jano dhruvam | prajnassukham nayetkala miti vedantadindimah|| na vidvan santape cittam
    karanakarane dhruvam | sarvamatmeti vijnanat iti vedantadindimah naivassbhasam sprishetkarmamithyopadhimapi
    svayam | kuto'dhishthanamatyacchamiti vedantadindimah|| aho'smaka malam mohairatma brahmeti nirbhayam
    | shrutibheriravo'dya'pi shruyate shrutiranjanah || vedantabherijhavarah prativadibhayankarah | shruyatam
    brahmanaih shrimaddakshinamurtyanugrahat || iti shrimatparamahamsa parivrajakacarya shrimacchankara
    bhagavatpujyapadakritishu vedantadindimah||
  devanagari: वेदान्तडिण्डिमास्तत्वमेकमुद्धोषयन्ति यत् । आस्तां पुरस्तान्तत्तेजो दक्षिणामूर्तिसञ्ज्ञितम्
    ॥ आत्माऽनात्मा पदार्थौ द्वौ भोक्तृभोग्यत्वलक्षणौ । ब्रह्मेवाऽऽत्मान देहादिरिति वेदान्तडिण्डिमः ॥ ज्ञानाऽज्ञाने
    पदार्थों द्वावात्मनो बन्धमुक्तिदौ । ज्ञानान्मुक्ति निर्बन्धोऽन्यदिति वेदान्तडिण्डिमः ॥ ज्ञातृ ज्ञेयं
    पदार्थौ द्वौ भास्य भासकलक्षणौ । ज्ञाता ब्रह्म जगत् ज्ञेय मिति वेदान्तडिण्डिमः ॥ सुखदुःखे पदार्थौ द्वौ
    प्रियविप्रियकारकौ । सुखं ब्रह्म जगहुःख मिति वेदान्तडिण्डिमः॥ समष्टिव्यष्टिरूपौ द्वौ पदार्थौ सर्वसम्मतौ
    । समष्टिरीश्वरो व्यष्टिर्जीवो वेदान्तडिण्डिमः ॥ ज्ञानं कर्म पदार्थौ द्वौ वस्तुकत्रात्म तन्त्रकौ ।
    ज्ञानान्मोक्षो न कर्मभ्य इति वेदान्तडिण्डिमः ॥ श्रोतव्याऽश्रव्यरूपी द्वौ पदार्थों सुखदुःखदौ । श्रोतव्यं
    ब्रह्म नैवाऽन्य दिति वेदान्तडिण्डिमः॥ चिन्त्याऽचिन्त्ये पदाथौ द्वौ विश्रान्ति श्रान्तिदायकौ । चिन्त्यं
    ब्रह्म परं नाऽन्य दिति वेदान्तडिण्डिमः॥ ध्येयाऽध्वेये पदार्थौ द्वौ द्वौ धीसमाध्यसमाधिदौ । ध्यातव्यं
    ब्रह्म नैवाऽन्य दिति वेदान्तडिण्डिमः॥ योगिनो भोगिनो वाऽपि त्यागिनो रागिणोऽपि च । ज्ञानान्मोक्षो न
    सन्देह इति वेदान्तडिण्डिमः ॥ न वर्णाश्रम सङ्केतैः न कोपासनादिभिः। ब्रह्मज्ञानं विना मोक्षः इति वेदान्तडिण्डिमः
    ॥ असत्यस्सर्वसंसारो रसामासादिदूषितः । उपेक्ष्यो ब्रह्म विज्ञेय मिति वेदान्तडिण्डिमः ॥ वृथा क्रियां
    वृथाऽलापान् वृथावादान् मनोरथान् । त्यत्वैकं ब्रह्म विज्ञेय मिति वेदान्तडिण्डिमः ॥ स्थितो ब्रह्मात्मना
    जीवो ब्रह्म जीवात्मना स्थितम् । इति सम्पश्यतां मुक्ति रिति वेदान्तडिण्डिमः॥ जीवो ब्रह्मात्मना ज्ञेयो
    ज्ञेयं जीवात्मना परम् । मुक्तिस्त दैक्यविज्ञान मिति वेदान्तडिण्डिमः ॥ सर्वात्मना परं ब्रह्म श्रोतुरात्मतया
    स्थितम् । नाऽऽयास स्तव विज्ञप्तौ इति वेदान्तडिण्डिमः ॥ ऐहिकं चाऽऽमुध्मिकं च तापान्तं कर्मसञ्चयम् ।
    त्यत्वा ब्रह्मैव विज्ञेय मिति वेदान्तडिण्डिमः ॥ अद्वैतद्वैतवादौ द्वौ सूक्ष्मस्थूलदशां गतौ । अद्वैतवादान्मोक्षस्स्या
    दिति वेदान्तडिण्डिमः ॥ कर्मिणो विनिवर्तन्ते निवर्तन्त उपासकाः। ज्ञानिनो न निवर्तन्ते इति वेदान्तडिण्डिमः
    ॥ परोक्षाऽसत्फलं कर्मज्ञानं प्रत्यक्षसत्फलम् । ज्ञानमेवाऽभ्यसेत्तस्मात् इति वेदान्तडिण्डिमः ॥ वृथा
    श्रमोऽयं विदुषा वृथाऽयं कर्मिणां श्रमः । यदि न ब्रह्मविज्ञानं इति ॥ वेदान्तडिण्डिमः ॥ अलं यागैरलं
    योगैरलं भोगै रलं धनैः । परस्मिन्ब्रह्मणि ज्ञात इति वेदान्तडिण्डिमः ॥ अलं वेदैरलं शास्त्रैरलमं स्मृतिपुराणकैः
    । परमात्मनि विज्ञाते इति वेदान्तडिण्डिमः ॥ नर्चा न यजुषोऽर्थोऽस्ति न सान्नर्थोऽति कश्चन । जाते ब्रह्मात्मविज्ञाने
    इति वेदान्तडिण्डिमः ॥ कर्माणि चित्तशुद्ध्यर्थं मैकाग्र्यार्थ मुपासनम् । मोक्षार्थं ब्रह्मविज्ञान मिति
    वेदान्तडिण्डिमः ॥ सञ्चितागामिकर्माणि दह्यन्ते ज्ञानकर्मणा । प्रारब्धानुभवान्मोक्ष इति वेदान्तडिण्डिमः॥
    न पुण्यकर्मणा वृद्धिः न हानिः पापकर्मणा । नित्यासङ्गात्मनिष्ठानामिति वेदान्तडिण्डिमः॥ दृग्दृश्यौ द्वौ
    पदार्थौ तौ परस्परविलक्षणौ । दृग्ब्रह्म दृश्यं माया स्यादिति वेदान्तडिण्डिमः ॥ अविद्योपाधिको जीवो मायोपाधिक
    ईश्वरः । मायाऽविद्यागुणातीतः इति वेदान्तडिण्डिमः ॥ बुद्धिपूर्वाऽबुद्धिपूर्वकृतानां पापकर्मणाम् । प्रायश्चित्तमहोज्ञान
    मिति वेदान्तडिण्डिमः ॥ साकारं च निराकारं निर्गुणं च गुणात्मकम् । तत्त्वं तत्परमं ब्रह्म इति वेदान्तडिण्डिमः
    ॥ द्विजत्वं विध्यनुष्ठानात् विप्रत्वं वेदपाठतः । ब्राह्मण्यं ब्रह्मविज्ञानात् इति वेदान्तडिण्डिमः
    ॥ सर्वात्मना स्थितं ब्रह्म सर्वं ब्रह्मात्मना स्थितम् । न कार्यं कारणाद्भिन्न मिति वेदान्तडिण्डिमः
    ॥ सत्तास्फुरणसौख्यानि भासन्ते सर्ववस्तुषु । तस्माद्ब्रह्ममयं सर्व मिति वेदान्तडिण्डिमः ॥ अवस्थात्रितयं
    यस्य क्रीडाभूमितया स्थितम् । तदेव ब्रह्म जानीयात् इति वेदान्तडिण्डिमः॥ यन्नाऽऽदौ यश्च नाऽस्त्यन्ते
    तन्मध्ये भातमप्यसत् । अतो मिथ्या जगत्सर्वमिति वेदान्तडिण्डिमः ॥ यदस्त्यादौ यदस्त्यन्ते यन्मध्ये भाति
    तत्स्वयम् । प्रौकमिदं सत्य मिति वेदान्तडिण्डिमः ॥ पुरुषार्थत्रयाविष्टाः पुरुषाः पशवो धृवम् । मोक्षार्थी
    पुरुषः श्रेष्ठः इति वेदान्तडिण्डिमः ॥ घटकुड्यादिकं सर्वं मृत्तिकामात्रमेव च । तथा ब्रह्म जगत्सर्व
    मिति वेदान्तडिण्डिमः ॥ षण्णिहत्य त्रयं हित्वा द्वयं भिस्वाऽखिलागतिम् । एकं बुद्धाऽऽश्रुते मोक्ष मिति
    वेदान्तडिण्डिमः ॥ भित्वा षट् पञ्च भित्त्वाऽथ भिश्वाऽथ चतुरखिकम् । द्वयं हित्वा श्रयेदेक मिति वेदान्तडिण्डिमः
    ॥ देहो नाह महं देही देहसाक्षीति निश्चयात् । जन्ममृत्युपहीणोऽसौ इति वेदान्तडिण्डिमः ॥ प्राणोनाहमहं
    देवः प्राणस्साक्षीति निश्चयात् । क्षुत्पिपासोपशान्ति स्स्यात् इति वेदान्तडिण्डिमः ॥ मनो नाऽह महं देवो
    मनस्साक्षीति निश्चयात् । शोकमोहापहानिरस्यात् वेदान्तडिण्डिमः ॥ बुद्धिर्नाऽहमहं देवो बुद्धिसाक्षीति
    निश्चयात् । कर्तृभावनिर्वृत्तिस्स्यात् इति वेदान्तडिण्डिमः ॥ नाज्ञानं स्यामहं देवोऽज्ञानसाक्षीति निश्चयात्
    । सर्वानर्थनिवृत्तिस्यात् इति वेदान्तडिण्डिमः ॥ अहं साक्षीति यो विद्यात् विविच्यैवं पुन पुनः । स एव
    मुक्तोऽसौ विद्वान् इति वेदान्तडिण्डिमः ॥ नाहं माया न तत्कार्यं न साक्षी परमोऽस्म्यहम् । इति निस्संशयज्ञानात्
    मुक्तिर्वे वेदान्तडिण्डिमः ॥ नाऽहं सर्व महं सर्वं मयि सर्वमिति स्फुटम् । ज्ञाते तत्वे कुतो दुःख मिति
    वेदान्तडिण्डिमः ॥ देहादिपञ्चकोशस्था या सत्ता प्रतिभासते । सा सत्तास्स्त्मा न सन्देह इति वेदान्तडिण्डिमः
    ॥ देहादिपञ्चकोशस्था या स्फूर्ति रनुभूयते । सा स्फूर्तिरात्मा नैवाऽन्य दिति वेदान्तडिण्डिमः ॥ देहादिपञ्चकोशस्था
    या प्रीतिरनुभूयते । सा प्रीतिरात्मा कूटस्थः इति वेदान्तडिण्डिमः ॥ व्योमादिपञ्चभूतस्था यासत्ता भासते
    नृणाम् । सा सत्ता परमं ब्रह्म इति वेदान्तडिण्डिमः ॥ व्योमादिपञ्चभूतस्था या चिदेकाऽनुभूयते । सा चिदेव
    परं ब्रह्म इति वेदान्तडिण्डिमः ॥ व्योमादिपञ्चभूतस्था या प्रीतिरनुभूयते । साप्रीतिरेव ब्रह्म स्यात्
    इति वेदान्तडिण्डिमः ॥ देहादिकोशगा सत्ता या सा व्योमादिभूतगा । मानोऽभावान्न तद्भेदः इति वेदान्तडिण्डिमः
    ॥ देहाविकोशगा स्फूर्तिर्या सा व्योमादिभूतगा । मानोऽभावा न तद्भेद इति वेदान्तडिण्डिमः ॥ देहादिकोशगा
    प्रीतिर्या सा व्योमादिभूतगा । मानाऽभावा न्न तद्भेद इति वेदान्तडिण्डिमः॥ सच्चिदानन्दरूपत्वात् ब्रह्मैवाऽत्मा
    न संशयः। प्रमाणकोटिसङ्घानात् इति वेदान्तडिण्डिमः॥ न जीवब्रह्मणोर्भेदः सत्तारूपेण विद्यते। सत्ताभेदे
    न मानं स्यात् इति वेदान्तडिण्डिमः॥ न जीवब्रह्मणोर्भेदः स्फूर्तिरूपेण विद्यते । स्फूर्तिभेदे न मानं
    स्यात् इति वेदान्तडिण्डिमः ॥ न जीवब्रह्मणोर्भेदः प्रियरूपेण विद्यते । प्रियभेदे न मानं स्यात् इति
    वेदान्तडिण्डिमः ॥ न जीवब्रह्मणोर्भेदो नाना रूपेण विद्यते । नाम्नो रूपस्य मिथ्यात्वात् इति वेदान्तडिण्डिमः
    ॥ न जीवब्रह्मणोर्भेदः पिण्डब्रह्माण्डभेदतः । व्यष्टेस्समष्टेरेकत्वात् इति वेदान्तडिण्डिमः ॥ ब्रह्म
    सत्यं जगन्मिथ्या जीवो ब्रह्मैव ना ः । जीवन्मुक्तस्तु तद्विद्वान् इति वेदान्तडिण्डिमः ॥ न नामरूपे नियते
    सर्वत्र व्यभिचारतः । अनामरूपं सर्वं स्यात् इति वेदान्तडिण्डिमः ॥ अनामरूपं सकलं सन्मयं चिन्मयं परम्
    । कुतो भेदः कुतो बन्धः इति वेदान्तडिण्डिमः ॥ न तत्त्वात्कथ्यते लोको नामाद्यैर्व्यभिचारतः। वटुर्जरठ
    इत्याद्यै रिति वेदान्तडिण्डिमः ॥ नामरूपात्मकं विश्वमिन्द्रजालं विदुर्बुधाः । अनामत्वादयुक्तत्वात्
    इति वेदान्तडिण्डिमः ॥ अभेददर्शनं मोक्षः संसाये भेददर्शनम् । सर्ववेदान्तसिद्धान्तः इति वेदान्तडिण्डिमः
    ॥ न मताभिनिवेशित्वात् न भाषावेशमात्रतः । मुक्ति र्विनाऽऽत्मविज्ञानात् इति वेदान्तडिण्डिमः ॥ न कास्यप्रतिषिद्धाभिः
    क्रियाभि मोक्षवासना । ईश्वरानुग्रहात्सा स्यात् इति वेदान्तडिण्डिमः ॥ अविज्ञाते जन्म नष्टं विज्ञाते
    जन्म सार्थकम् । ज्ञातुरात्मा न दूरे स्यात् इति वेदान्तडिण्डिमः ॥ दशमस्य परिज्ञानेनाऽऽयासोऽस्ति यथाः
    तथा । स्वस्थ ब्रह्मात्मविज्ञाने इति वेदान्तडिण्डिमः ॥ उपेक्ष्योपाधिकान् दोषान् गृह्यन्ते विषमा यथा
    । उपेक्ष्य दृश्यं य द्ब्रह्म इति वेदान्तडिण्डिमः ॥ सुखमल्पं बहुः क्लेशोविषयमाहिणां नृणाम् । अनन्तं
    ब्रह्मनिष्ठानां इति वेदान्तडिण्डिमः ॥ धनैर्वा धनदैः पुत्रैः दारागारसहोदरैः । धृवं प्राणहरैर्दुःखं
    इति वेदान्तडिण्डिमः॥ सुप्ते रुत्थाय सुप्त्यन्त्यं ब्रह्मैकं प्रविचिन्त्यताम् । नातिदूरे नृणां मृत्युः
    इति वेदान्तडिण्डिमः ॥ पञ्चानामपिकोशानां मायाऽनर्थाव्ययोचिता । तत्साक्षि ब्रह्म विज्ञान मिति वेदान्तडिण्डिमः
    ॥ दशमत्वपरिज्ञाने ननज्ञस्य यथा सुखम् । तथा जीवस्य सत्प्राप्तौ इति वेदान्तडिण्डिमः॥ नवभ्योऽस्ति परं
    प्रत्यक्नस वेद परं परम् । तद्विज्ञानाद्भवेत्तुर्या मुक्ति र्वेदान्तडिण्डिमः ॥ नवाऽऽभासानवज्ञत्वात्
    नवोपाधीन्नवात्मना । मिथ्या ज्ञात्वाऽवशिष्टे तु मौनं वेदान्तडिण्डिमः॥ परमे ब्रह्मणि स्वस्मिन् प्रविलाप्याऽखिलं
    जगत् । गायनद्वतमानन्दं आस्ते वेदान्तडिण्डिमः ॥ प्रतिलोमानुलोमाभ्यां विश्वारोपापवादयोः । चिन्तने शिष्यते
    तत्वं इति वेदान्तडिण्डिमः ॥ नामरूपाभिमानस्थात् संसारसर्वदेहिनाम् । सच्चिदानन्ददृष्टिस्त्यात् मुक्तिर्वेदान्तडिण्डिमः
    ॥ सचिदानन्दसत्यत्वे मिथ्यात्वे नामरूपयोः। विज्ञाते किमिदं ज्ञेयं इति वेदान्तडिण्डिमः ॥ सालम्बनं निरालम्बं
    सर्वालम्बावलम्बितम् । आलम्बेनाऽखिलालम्ब मिति वेदान्तडिण्डिमः॥ न कुर्या न्न विजानीयात् सर्वं ब्रह्मेत्यनुस्मरन्
    । यथा सुखं तथा तिष्ठेत् इति वेदान्तडिण्डिमः॥ स्वकर्मपाशवशगः प्राज्ञोऽन्यो वा जनो ध्रुवम् । प्राज्ञस्सुखं
    नयेत्काल मिति वेदान्तडिण्डिमः॥ न विद्वान् सन्तपे चित्तं करणाकरणे ध्रुवम् । सर्वमात्मेति विज्ञानात्
    इति वेदान्तडिण्डिमः नैवास्स्भासं स्पृशेत्कर्ममिथ्योपाधिमपि स्वयम् । कुतोऽधिष्ठानमत्यच्छमिति वेदान्तडिण्डिमः॥
    अहोऽस्माक मलं मोहैरात्मा ब्रह्मेति निर्भयम् । श्रुतिभेरीरवोऽद्याऽपि श्रूयते श्रुतिरञ्जनः ॥ वेदान्तभेरीझवारः
    प्रतिवादिभयङ्करः । श्रूयतां ब्राह्मणैः श्रीमद्दक्षिणामूर्त्यनुग्रहात् ॥ इति श्रीमत्परमहंस परिव्राजकाचार्य
    श्रीमच्छङ्कर भगवत्पूज्यपादकृतिषु वेदान्तडिण्डिमः॥
