id: gurunarayanastotram
category: stotram
name:
  english: gurunarayanastotram
  devanagari: गुरुनारायणस्तोत्रम्
content:
  english: tapasvi prabhuh purnavairagyadipto nijanandasandohatripto varenyah | cidanandarupena rarajate
    yo tri lokigurum naumi narayanam tam || 1|| bhavabdhau nimagnanvimudhamshca dinan cidanandashuddhadvayam
    brahma saukhyam | | prabodhaya bhumapi yotravatirnah tri lokigurum naumi narayanam tam || 2|| srijanorutashcorvashinam
    samuham babhuvatra yah shaktigarvapahari | mahadriptakandarpadarpapaharta tri lokigurum naumi narayanam
    tam || 3|| svalakshmim tyajan dinaraksha katham syat na bhuyasvashankavrito bhaktavrindah | tadartham
    ya aste kuberam grihitva tri lokigurum naumi narayanam tam || 4|| nije'sminnamameti sandarshanaya
    na lakshmyayuto yotra bhaktartihanta | svarupam vishantam parambrahma shantam tri lokigurum naumi
    narayanam tam || 5|| gurunarayanastotram yah pathedgaktisamyutah | kamajitsotra muktashca narayanakripavashat
    || 6|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavana shridharasvamimaharajaviracitam
    shrigurunarayanastotram sampurnam || racanasthaḻah kaॅphi udyana
  devanagari: तपस्वी प्रभुः पूर्णवैराग्यदीप्तो निजानन्दसन्दोहतृप्तो वरेण्यः । चिदानन्दरूपेण राराजते यो
    त्री लोकीगुरूं नौमि नारायणं तम् ॥ १॥ भवाब्धौ निमग्नान्विमूढांश्च दीनान् चिदानन्दशुद्धाद्वयं ब्रह्म
    सौख्यम् । । प्रबोधाय भूमापि योत्रावतीर्णः त्री लोकीगुरूं नौमि नारायणं तम् ॥ २॥ सृजानोरूतश्चोर्वशीनां
    समूहं बभूवात्र यः शक्तिगर्वापहारी । महादृप्तकन्दर्पदर्पापहर्ता त्री लोकीगुरूं नौमि नारायणं तम् ॥ ३॥
    स्वलक्ष्मीं त्यजन् दीनरक्षा कथं स्यात् न भूयस्वशङ्कावृतो भक्तवृन्दः । तदर्थं य अस्ते कुबेरं गृहीत्वा
    त्री लोकीगुरूं नौमि नारायणं तम् ॥ ४॥ निजेऽस्मिन्नमामेति सन्दर्शनाय न लक्ष्म्यायुतो योत्र भक्तार्तिहन्ता
    । स्वरूपं विशन्तं परम्ब्रह्म शान्तं त्री लोकीगुरूं नौमि नारायणं तम् ॥ ५॥ गुरूनारायणस्तोत्रं यः पठेद्गक्तिसंयुतः
    । कामजित्सोत्र मुक्तश्च नारायणकृपावशात् ॥ ६॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितं
    श्रीगुरूनारायणस्तोत्रं सम्पूर्णम् ॥ रचनास्थळः काॅफी उद्यान
