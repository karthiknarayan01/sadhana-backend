id: gangastotramtapovanam
category: stotram
name:
  english: gangastotramtapovanam
  devanagari: गन्गास्तोत्रम्तपोवनम्
content:
  english: karunavaridheh svashriteshu || 5|| ya devi karmarupena karmavadishu samsthita | asamsthita
    ca gangayai namastasyai namo namah || 6|| yadevi shunyarupena shunyavadishu samsthita | asamsthita
    ca gangayai namastasyai namo namah || 7|| yadevi bhutarupena bhutavadishu samsthita | asamsthita ca
    gangayai namastasyai namo namah || 8|| yadevi sarvarupena sarvavadishu samsthita | asamsthita ca gangayai
    namastasyai namo namah || 9|| yasya janmasyajagato yasyanca sthitirapyayah | cakshurunmeshavattasyai
    jahnujayai namo namah || 10|| yadevi vidhritih setuh sarvesthane niyacchati | asambhedayavaitasyai
    jahnujayai namo namah || 11|| mangala mangalanamya pavananam ca pavani | bhuktida muktida casyai jahnujayai
    namo namah || 12|| amba
  devanagari: करुणावारिधेः स्वाश्रितेषु ॥ ५॥ या देवी कर्मरूपेण कर्मवादिषु संस्थिता । असंस्थिता च गङ्गायै
    नमस्तस्यै नमो नमः ॥ ६॥ यादेवी शून्यरूपेण शून्यवादिषु संस्थिता । असंस्थिता च गङ्गायै नमस्तस्यै नमो
    नमः ॥ ७॥ यादेवी भूतरूपेण भूतवादिषु संस्थिता । असंस्थिता च गङ्गायै नमस्तस्यै नमो नमः ॥ ८॥ यादेवी सर्वरूपेण
    सर्ववादिषु संस्थिता । असंस्थिता च गङ्गायै नमस्तस्यै नमो नमः ॥ ९॥ यस्या जन्मास्यजगतो यस्याञ्च स्थितिरप्ययः
    । चक्षुरुन्मेषवत्तस्यै जह्नुजायै नमो नमः ॥ १०॥ यादेवी विधृतिः सेतुः सर्वेस्थाने नियच्छति । असम्भेदायवैतस्यै
    जह्नुजायै नमो नमः ॥ ११॥ मङ्गला मङ्गलानांया पावनानां च पावनी । भुक्तिदा मुक्तिदा चास्यै जह्नुजायै नमो
    नमः ॥ १२॥ अम्ब
