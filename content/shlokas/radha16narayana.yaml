id: radha16narayana
category: stotram
name:
  english: radha16narayana
  devanagari: राधा१६नारयण
content:
  english: radhashodashanamavarnanam athava shrishadaksharividyashodashanamastotram om asya shrishadaksharividyashodashanamastotrasya
    shrinarayana rishih | anushtup chandah | radhambika devata | hrim bijam | svaha shaktih | jape viniyogah
    || rishyadinyasah | om shrinarayanarishaye namah shirasi | om anushtupchandase namah mukhe | om radhambikadevatayai
    namah hridi | om hrimbijaya namah guhye | om svahashaktaye namah padayoh | om viniyogaya namah sarvange
    || karanyasah | om klam angushthabhyam namah | om klim tarjanibhyam namah | om klum madhyamabhyam
    namah | om klaim anamikabhyam namah | om klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam
    namah || shadanganyasah | om klam hridayaya namah | om klim shirase svaha | om klum shikhayai vashat
    | om klaim kavacaya hum | om klaum netratrayaya vaushat | om klah astraya phat || digbandhah om bhurbhuvah
    svaromiti digbandhah || atha stotrapathah | shrinarayana uvaca | radha raseshvari rasavasini rasikeshvari
    | krishnapranadhika krishnapriya krishnasvarupini || 1|| krishnavamangasambhuta paramandarupini |
    krishna vrindavani vrinda vrindavanavinodini || 2|| candravali candrakanta shatacandraprabhanana |
    namanyetani sarani teshamabhyantarani ca || 3|| radhetyevam ca samsiddhau rakaro danavacakah | svayam
    nirvanadatri ya sa radha parikirtita || 4|| raseseshvarasya patniyam tena raseshvari smrita | rase
    ca vaso yasyashca tena sa rasavasini || 5|| sarvasam rasikanam ca devinamishvari para | pravadanti
    pura santastena tam rasikeshvarim || 6|| pranadhika preyasi sa krishnasya paramatmanah | krishnapranadhika
    sa ca krishnena parikirtita || 7|| krishnasyatipriya kanta krishno vasyah priyah sada | sarvairdevaganairukta
    tena krishnapriya smrita || 8|| krishnarupam samnidhatum ya shakta cavalilaya | sarvamshaih krishnasadrishi
    tena krishnasvarupini || 9|| vamangardhena krishnasya ya sambhuta para sati | krishnavamangasambhuta
    tena krishnena kirtita || 10|| paramanandarashishca svayam murtimati sati | shrutibhih kirtita tena
    paramanandarupini || 11|| krishirmoksharthavacano na etotkrishtavacakah | akaro datrivacanastena krishna
    prakirtita || 12|| asti vrindavanam yasyastena vrindavani smrita | vrindavanasyadhidevi tena vatha
    prakirtita || 13|| sanghahsakhinam vrindah syadakaro'pyastivacakah | sakhivrindo'sti yasyashca sa
    vrinda parikirtita || 14|| vrindavane vinodashca so'sya hyasti ca tatra vai | veda vadanti tam tena
    vrindavanavinodinim || 15|| nakhacandravali vaktracandro'sti yatra samtatam | tena candravali sa ca
    krishnena parikirtita || 16|| kantirasti candratulya sada yasya divanisham | sa candrakanta harshena
    harina parikirtita || 17|| sharaccandraprabha yassyashcanane'sti divanisham | munina kirtita tena
    sharaccandraprabhanana || 18|| idam shodashanamoktamarthavyakhyanasamyutam || narayanena yaddattam
    brahmane nabhipankaje| brahmana ca pura dattam dharmaya janakaya me || 19|| dharmena kripaya dattam
    mahyamadityaparvani | pushkare ca mahatirthe punyahe devasamsadi|| radhaprabhavaprastave suprasannena
    cetasa || 20|| idam stotram mahapunyam tubhyam dattam maya mune | nindakayavaishnavaya na datavyam
    mahamune || 21|| yavajjivamidam stotram trisamdhyam yah pathennarah | radhamadhavayoh padapadme bhaktirbhavediha
    || 22|| ante labhettayordasyam shashvatsahacaro bhavet | animadikasidhim ca samprapya nityavigraham
    || 23|| vratadanopavaishca sarvairniyamapurvakaih | caturnam caiva vedanam pathaih sarvarthasamyutaih
    || 24|| sarvesham yajnatirthanam karanairvidhivodhitah | pradakshinena bhumeshca kritsnaya eva saptadha
    || 25|| sharanagatarakshayamajnanam jnanadanatah | devanam vaishnavanam ca darshanenapi yat phalam
    || 26|| tadeva stotrapathasya kalam narhati shodashim | stotrasyasya prabhavena jivanmukto bhavennarah
    || 27|| iti shribrahmavaivarte shrinarayanakritam radhashodashanamavarnanam athava shrishadaksharividyashodashanamastotram
    sampurnam |
  devanagari: राधाषोडशनामवर्णनम् अथवा श्रीषडक्षरीविद्याषोडशनामस्तोत्रम् ॐ अस्य श्रीषडक्षरीविद्याषोडशनामस्तोत्रस्य
    श्रीनारायण ऋषिः । अनुष्टुप् छन्दः । राधाम्बिका देवता । ह्रीं बीजम् । स्वाहा शक्तिः । जपे विनियोगः
    ॥ ऋष्यादिन्यासः । ॐ श्रीनारायणऋषये नमः शिरसि । ॐ अनुष्टुप्छन्दसे नमः मुखे । ॐ राधाम्बिकादेवतायै नमः
    हृदि । ॐ ह्रीम्बीजाय नमः गुह्ये । ॐ स्वाहाशक्तये नमः पादयोः । ॐ विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः
    । ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ क्लूं मध्यमाभ्यां नमः । ॐ क्लैं अनामिकाभ्यां
    नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां नमः ॥ षडङ्गन्यासः । ॐ क्लां हृदयाय नमः
    । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय हुम् । ॐ क्लौं नेत्रत्रयाय वौषट् । ॐ
    क्लः अस्त्राय फट् ॥ दिग्बन्धः ॐ भूर्भुवः स्वरोमिति दिग्बन्धः ॥ अथ स्तोत्रपाठः । श्रीनारायण उवाच ।
    राधा रासेश्वरी रासवासिनी रसिकेश्वरी । कृष्णप्राणाधिका कृष्णप्रिया कृष्णस्वरूपिणी ॥ १॥ कृष्णवामाङ्गसम्भूता
    परमान्दरूपिणी । कृष्णा वृन्दावनी वृन्दा वृन्दावनविनोदिनी ॥ २॥ चन्द्रावली चन्द्रकान्ता शतचन्द्रप्रभानना
    । नामान्येतानि साराणि तेषामभ्यन्तराणि च ॥ ३॥ राधेत्येवं च संसिद्धौ राकारो दानवाचकः । स्वयं निर्वाणदात्री
    या सा राधा परिकीर्तिता ॥ ४॥ रासेसेश्वरस्य पत्नीयं तेन रासेश्वरी स्मृता । रासे च वासो यस्याश्च तेन
    सा रासवासिनी ॥ ५॥ सर्वासां रसिकानां च देवीनामीश्वरी परा । प्रवदन्ति पुरा सन्तस्तेन तां रसिकेश्वरीम्
    ॥ ६॥ प्राणाधिका प्रेयसी सा कृष्णस्य परमात्मनः । कृष्णप्राणाधिका सा च कृष्णेन परिकीर्तिता ॥ ७॥ कृष्णास्यातिप्रिया
    कान्ता कृष्णो वास्याः प्रियः सदा । सर्वैर्देवगणैरुक्ता तेन कृष्णप्रिया स्मृता ॥ ८॥ कृष्णरूपं संनिधातुं
    या शक्ता चावलीलया । सर्वांशैः कृष्णसदृशी तेन कृष्णस्वरूपिणी ॥ ९॥ वामाङ्गार्धेन कृष्णस्य या सम्भूता
    परा सती । कृष्णवामाङ्गसम्भूता तेन कृष्णेन कीर्तिता ॥ १०॥ परमानन्दराशिश्च स्वयं मूर्तिमती सती । श्रुतिभिः
    कीर्तिता तेन परमानन्दरूपिणी ॥ ११॥ कृषिर्मोक्षार्थवचनो न एतोत्कृष्टवाचकः । आकारो दातृवचनस्तेन कृष्णा
    प्रकीर्तिता ॥ १२॥ अस्ति वृन्दावनं यस्यास्तेन वृन्दावनी स्मृता । वृन्दावनस्याधिदेवी तेन वाथ प्रकीर्तिता
    ॥ १३॥ सङ्घःसखीनां वृन्दः स्यादकारोऽप्यस्तिवाचकः । सखिवृन्दोऽस्ति यस्याश्च सा वृन्दा परिकीर्तिता ॥
    १४॥ वृन्दावने विनोदश्च सोऽस्या ह्यस्ति च तत्र वै । वेदा वदन्ति तां तेन वृन्दावनविनोदिनीम् ॥ १५॥ नखचन्द्रावली
    वक्त्रचन्द्रोऽस्ति यत्र संततम् । तेन चन्द्रवली सा च कृष्णेन परिकीर्तिता ॥ १६॥ कान्तिरस्ति चन्द्रतुल्या
    सदा यस्या दिवानिशम् । सा चन्द्रकान्ता हर्षेण हरिणा परिकीर्तिता ॥ १७॥ शरच्चन्द्रप्रभा यस्स्याश्चाननेऽस्ति
    दिवानिशम् । मुनिना कीर्तीता तेन शरच्चन्द्रप्रभानना ॥ १८॥ इदं षोडशनामोक्तमर्थव्याख्यानसंयुतम् ॥ नारायणेन
    यद्दत्तं ब्रह्मणे नाभिपङ्कजे। ब्रह्मणा च पुरा दत्तं धर्माय जनकाय मे ॥ १९॥ धर्मेण कृपया दत्तं मह्यमादित्यपर्वणि
    । पुष्करे च महातीर्थे पुण्याहे देवसंसदि॥ राधाप्रभावप्रस्तावे सुप्रसन्नेन चेतसा ॥ २०॥ इदं स्तोत्रं
    महापुण्यं तुभ्यं दत्तं मया मुने । निन्दकायावैष्णवाय न दातव्यं महामुने ॥ २१॥ यावज्जीवमिदं स्तोत्रं
    त्रिसंध्यं यः पठेन्नरः । राधामाधवयोः पादपद्मे भक्तिर्भवेदिह ॥ २२॥ अन्ते लभेत्तयोर्दास्यं शश्वत्सहचरो
    भवेत् । अणिमादिकसिधिं च सम्प्राप्य नित्यविग्रहम् ॥ २३॥ व्रतदानोपवाइश्च सर्वैर्नियमपूर्वकैः । चतुर्णां
    चैव वेदानां पाठैः सर्वार्थसंयुतैः ॥ २४॥ सर्वेषां यज्ञतीर्थानां करणैर्विधिवोधितः । प्रदक्षिणेन भुमेश्च
    कृत्स्नाया एव सप्तधा ॥ २५॥ शरणागतरक्षायामज्ञानां ज्ञानदानतः । देवानां वैष्णवानां च दर्शनेनापि यत्
    फलम् ॥ २६॥ तदेव स्तोत्रपाठस्य कलां नार्हति षोडशीम् । स्तोत्रस्यास्य प्रभावेण जीवन्मुक्तो भवेन्नरः
    ॥ २७॥ इति श्रीब्रह्मवैवर्ते श्रीनारायणकृतं राधाषोडशनामवर्णनं अथवा श्रीषडक्षरीविद्याषोडशनामस्तोत्रं
    सम्पूर्णम् ।
