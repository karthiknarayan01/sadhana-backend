id: shacikritamgurustotram
category: stotram
name:
  english: shacikritamgurustotram
  devanagari: शचिकृतंगुरुस्तोत्रम्
content:
  english: shacikritam gurustotram sarvesham tu gurunam ca janmadata paro guruh | pituh shataguna mata
    pujya vandya gariyasi || 124|| vidyadata mantradata jnanado haribhaktidah | pujyo vandyashca sevyashca
    matuh shataguno guruh || 125|| ajnanatimirandhasya jnananjanashalakaya | cakshurunmilitam yena tasmai
    shriguruve namah || 126|| janmadata'nnadata ca tatha'nye guruvo matah | aropitashca guravah prasahya
    guruvastatha || 127|| tathopaguravah santi shikshaka guruvo'pi ca | param kartum na shaktaste ghorasamsarasagare
    || 128|| vidyamantrajnatadata nipunah parakarmani | sa shaktah shishyamuddhartumishvarashceshvareshvarah
    || 129|| gururvishnurgururbrahma gururdevo maheshvarah | gururdharmo guruh sheshah sarvatma keshavo
    guruh || 130|| sarvatirthadhivasashca sarvadevadhivasitah | sarvadevatmako divyo gururupi harih svayam
    || 131|| abhishtadeve vai rushte guruh shakto hi rakshitum | gurau rushte'bhishtadevo na vai shaktashca
    rakshitum || 132|| gurau rushte graha rushta rushta devashca sarvatha | bhagyanyapi ca rushtani gurum
    rushtam na karayet || 133|| na guroradhikashcatma priyah putrah priyo'pi na | dhanam patni tapo dharmah
    punyam satyam na vai priyam || 134|| guroh paro na vai shasta raja bandhurna vai parah | mantro vidya
    gururdevah purvalabdhah patistatha || 135|| paratparah sa vijneyah sarveshamupari sthitah | mata vandya
    pita vandyo vandyashca tvadrisho guruh || 136|| vipranam tvam varishtho'si garishthashca tapasvinam
    | brahmishtho'si brahmavitsu dharmishthah sarvadharminam || 137|| devanam sarvatha pujya iti janami
    sarvada | tatah kshamam yayace'ham shapami naiva madgurum || 138|| tushto bhava munishreshtha
  devanagari: शचिकृतं गुरुस्तोत्रम् सर्वेषां तु गुरूणां च जन्मदाता परो गुरुः । पितुः शतगुणा माता पूज्या
    वन्द्या गरीयसी ॥ १२४॥ विद्यादाता मन्त्रदाता ज्ञानदो हरिभक्तिदः । पूज्यो वन्द्यश्च सेव्यश्च मातुः शतगुणो
    गुरुः ॥ १२५॥ अज्ञानतिमिरान्धस्य ज्ञानाञ्जनशलाकया । चक्षुरुन्मीलितं येन तस्मै श्रीगुरुवे नमः ॥ १२६॥
    जन्मदाताऽन्नदाता च तथाऽन्ये गुरुवो मताः । आरोपिताश्च गुरवः प्रसह्य गुरुवस्तथा ॥ १२७॥ तथोपगुरवः सन्ति
    शिक्षका गुरुवोऽपि च । पारं कर्तुं न शक्तास्ते घोरसंसारसागरे ॥ १२८॥ विद्यामन्त्रज्ञातदाता निपुणः पारकर्मणि
    । स शक्तः शिष्यमुद्धर्तुमीश्वरश्चेश्वरेश्वरः ॥ १२९॥ गुरुर्विष्णुर्गुरुर्ब्रह्मा गुरुर्देवो महेश्वरः
    । गुरुर्धर्मो गुरुः शेषः सर्वात्मा केशवो गुरुः ॥ १३०॥ सर्वतीर्थाधिवासश्च सर्वदेवाधिवासितः । सर्वदेवात्मको
    दिव्यो गुरुरूपी हरिः स्वयम् ॥ १३१॥ अभीष्टदेवे वै रुष्टे गुरुः शक्तो हि रक्षितुम् । गुरौ रुष्टेऽभीष्टदेवो
    न वै शक्तश्च रक्षितुम् ॥ १३२॥ गुरौ रुष्टे ग्रहा रुष्टा रुष्टा देवाश्च सर्वथा । भाग्यान्यपि च रुष्टानि
    गुरुं रुष्टं न कारयेत् ॥ १३३॥ न गुरोरधिकश्चात्मा प्रियः पुत्रः प्रियोऽपि न । धनं पत्नी तपो धर्मः पुण्यं
    सत्यं न वै प्रियम् ॥ १३४॥ गुरोः परो न वै शास्ता राजा बन्धुर्न वै परः । मन्त्रो विद्या गुरुर्देवः पूर्वलब्धः
    पतिस्तथा ॥ १३५॥ परात्परः स विज्ञेयः सर्वेषामुपरि स्थितः । माता वन्द्या पिता वन्द्यो वन्द्यश्च त्वादृशो
    गुरुः ॥ १३६॥ विप्राणां त्वं वरिष्ठोऽसि गरिष्ठश्च तपस्विनाम् । ब्रह्मिष्ठोऽसि ब्रह्मवित्सु धर्मिष्ठः
    सर्वधर्मिणाम् ॥ १३७॥ देवानां सर्वथा पूज्य इति जानामि सर्वदा । ततः क्षमां ययाचेऽहं शपामि नैव मद्गुरुम्
    ॥ १३८॥ तुष्टो भव मुनिश्रेष्ठ
