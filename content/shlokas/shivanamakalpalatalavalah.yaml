id: shivanamakalpalatalavalah
category: stotram
name:
  english: shivanamakalpalatalavalah
  devanagari: शिवनामकल्पलतालवालः
content:
  english: vagvishaye tvam maruriva bhavasi tvam hi managabhidadhati na vaco divyarathe va puradahanavidhau
    vedamayah kila caturaturangah | cakrayugam te dinarajanikarau banasharirabhridabhavadupendro merurabhutte
    dhanururagapatirjyabhavadisha tadasi giridhanva || 65
  devanagari: वाग्विषये त्वं मरुरिव भवसि त्वां हि मनागभिदधति न वाचो दिव्यरथे वा पुरदहनविधौ वेदमयाः किल
    चतुरतुरङ्गाः । चक्रयुगं ते दिनरजनिकरौ बाणशरीरभृदभवदुपेन्द्रो मेरुरभूत्ते धनुरुरगपतिर्ज्याभवदीश तदसि
    गिरिधन्वा ॥ ६५
meaning: {}
