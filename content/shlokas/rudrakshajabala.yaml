id: rudrakshajabala
category: upanishad
name:
  english: rudrakshajabala
  devanagari: रुद्रक्शजबल
content:
  english: stvanirakaranam mestu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu ||
    om shantih shantih shantih || harih om || atha hainam kalagnirudram bhusundah papraccha katham rudrakshotpattih
    | taddharanatkim phalamiti | tam hovaca bhagavankalagnirudrah | tripuravadharthamaham nimilitaksho'bhavam
    | tebhyo jalabindavo bhumau patitaste rudraksha jatah | sarvanugraharthaya tesham namoccaranamatrena
    dashagopradanaphalam darshanasparshanabhyam dvigunam phalamata urdhvam vaktum na shaknomi | tatraite
    shloka bhavanti | kasmimsthitam tu kim nama katham va dharyate naraih | katibhedamukhanyatra kairmantrairdharyate
    katham || 1|| divyavarshasahasrani cakshurunmilitam maya | bhumavakshiputabhyam tu patita jalabindavah
    || 2|| tatrashrubindavo jata maharudrakshavrikshakah | sthavaratvamanuprapya bhaktanugrahakaranat
    || 3|| bhaktanam dharanatpapam divaratrikritam haret | laksham tu darshanatpunyam kotistaddharanadbhavet
    || 4|| tasya kotishatam punyam labhate dharanannarah | lakshakotisahasrani lakshakotishatani ca ||
    5|| tajjapallabhate punyam naro rudrakshadharanat | dhatriphalapramanam yacchreshthametadudahritam
    || 6|| badariphalamatram tu madhyamam procyate budhaih | adhamam canamatram syatprakriyaisha mayocyate
    || 7|| brahmanah kshatriya vaishyah shudrashceti shivajnaya | vritha jatah prithivyam tu tajjatiyah
    shubhakshakah || 8|| shvetastu brahmana jneyah kshatriya raktavarnakah | pitastu vaishya vijneyah
    krishnah shudra udahritah || 9|| brahmano bibhriyacchvetatraktatraja tu dharayet | pitanvaishyastu
    bibhriyatkrishnanchudrastu dharayet || 10|| samah snigdha dridhah sthulah kantakaih samyutah shubhah
    | krimidashtam bhinnabhinnam kantakairhinameva ca || 11|| vranayuktamayuktam ca shadrudrakshani varjayet
    | svayameva kritam dvaram rudraksham syadihottamam || 12|| yattu paurushayatnena kritam tanmadhyamam
    bhavet | samansnigdhandridhansthulankshaumasutrena dharayet || 13|| sarvagatrena saumyena samanyani
    vicakshanah | nikashe hemarekhabha yasya rekha pradrishyate || 14|| tadakshamamuttamam vidyattaddharyam
    shivapujakaih | shikhayamekarudraksham trishatam shirasa vahet || 15|| shattrimshatam gale dadhyatbahoh
    shodashashodasha | manibandhe dvadashaiva skandhe pancashatam vahet || 16|| ashtottarashatairmalamupavitam
    prakalpayet | dvisaram trisaram vapi saranam pancakam tatha || 17|| saranam saptakam vapi bibhriyatkanthadeshatah
    | mukute kundale caiva karnikaharake'pi va || 18|| keyurakatake sutram kukshibandhe visheshatah |
    supte pite sadakalam rudraksham dharayennarah || 19|| trishatam tvadhamam pancashatam madhyamamucyate
    | sahasramuttamam proktamevam bhedena dharayet || 20|| shirasishanamantrena kanthe tatpurushena tu
    | aghorena gale dharyam tenaiva hridaye'pi ca || 21|| aghorabijamantrena karayordharayetsudhih | pancashadakshagrathitanvyomavyapyapi
    codare || 22|| panca brahmabhirangaishaca trimala panca sapta ca | grathitva mulamantrena sarvanyakshani
    dharayet || 23|| atha hainam bhagavantam kalagnirudram bhusundah papraccha rudrakshanam bhedena yadaksham
    yatsvarupam yatphalamiti | tatsvarupam mukhayuktamarishtanirasanam kamabhishtaphalam bruhiti hovaca
    | tatraite shloka bhavanti || ekavaktram tu rudraksham paratattvasvarupakam | taddharanatpare tattve
    liyate vijitendriyah || 1|| dvivaktram tu munishreshtha cardhanarishvaratmakam | dharanadardhanarishah
    priyate tasya nityashah || 2|| trimukham caiva rudrakshamagnitrayasvarupakam | taddharanacca hutabhuktasya
    tushyati nityada || 3|| caturmukham tu rudraksham caturvaktrasvarupakam | taddharanaccaturvaktrah
    priyate tasya nityada || 4|| pancavaktram tu rudraksham pancabrahmasvarupakam | pancavaktrah svayam
    brahma pumhatyam ca vyapohati || 5|| shadvaktramapi rudraksham kartikeyadhidaivatam | taddharananmahashrih
    syanmahadarogyamuttamam || 6|| mativijnanasampattishuddhaye dharayetsudhih | vinayakadhidaivam ca
    pravadanti manishinah || 7|| saptavaktram tu rudraksham saptamadhidaivatam | taddharananmahashrih
    syanmahadarogyamuttamam || 8|| mahati jnanasampattih shucirdharanatah sada | ashtavaktram tu rudrakshamashtamatradhidaivatam
    || 9|| vasvashtakapriyam caiva gangapritikaram tatha | taddharanadime prita bhaveyuh satyavadinah
    || 10|| navavaktram tu rudraksham navashaktyadhidaivatam | tasya dharanamatrena priyante navashaktayah
    || 11|| dashavaktram tu rudraksham yamadaivatyamiritam | darshanacchantijanakam dharanannatra samshayah
    || 12|| ekadashamukham tvaksham rudraikadashadaivatam | tadidam daivatam prahuh sada saubhagyavardhanam
    || 13|| rudraksham dvadashamukham mahavishnusvarupakam | dvadashadityarupam ca bibhartyeva hi tatparam
    || 14|| trayodashamukham tvaksham kamadam siddhidam shubham | tasya dharanamatrena kamadevah prasidati
    || 15|| caturdashamukham caksham rudranetrasamudbhavam | sarvavyadhiharam caiva sarvadarogyamapnuyat
    || 16|| madyam mamsam ca lashunam palandum shigrumeva ca | shleshmatakam vidvarahamabhakshyam varjayennarah
    || 17|| grahane vishuve caivamayane samkrame'pi ca | darsheshu purnamase ca purneshu divaseshu ca
    | rudrakshadharanatsadyah sarvapapaih pramucyate || 18|| rudrakshamulam tadbrahma tannalam vishnureva
    ca | tanmukham rudra ityahustadbinduh sarvadevatah || 19|| iti || atha kalagnirudram bhagavantam sanatkumarah
    papracchadhihi bhagavanrudrakshadharanavidhim | tasminsamaye nidagha
  devanagari: स्त्वनिराकरणं मेस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ ॥ अथ हैनं कालाग्निरुद्रं भुसुण्डः पप्रच्छ कथं रुद्राक्षोत्पत्तिः । तद्धारणात्किं
    फलमिति । तं होवाच भगवान्कालाग्निरुद्रः । त्रिपुरवधार्थमहं निमीलिताक्षोऽभवम् । तेभ्यो जलबिन्दवो भूमौ
    पतितास्ते रुद्राक्षा जाताः । सर्वानुग्रहार्थाय तेषां नामोच्चारणमात्रेण दशगोप्रदानफलं दर्शनस्पर्शनाभ्यां
    द्विगुणं फलमत ऊर्ध्वं वक्तुं न शक्नोमि । तत्रैते श्लोका भवन्ति । कस्मिंस्थितं तु किं नाम कथं वा धार्यते
    नरैः । कतिभेदमुखान्यत्र कैर्मन्त्रैर्धार्यते कथम् ॥ १॥ दिव्यवर्षसहस्राणि चक्षुरुन्मीलितं मया । भूमावक्षिपुटाभ्यां
    तु पतिता जलबिन्दवः ॥ २॥ तत्राश्रुबिन्दवो जाता महारुद्राक्षवृक्षकाः । स्थावरत्वमनुप्राप्य भक्तानुग्रहकारणात्
    ॥ ३॥ भक्तानां धारणात्पापं दिवारात्रिकृतं हरेत् । लक्षं तु दर्शनात्पुण्यं कोटिस्तद्धारणाद्भवेत् ॥ ४॥
    तस्य कोटिशतं पुण्यं लभते धारणान्नरः । लक्षकोटिसहस्राणि लक्षकोटिशतानि च ॥ ५॥ तज्जपाल्लभते पुण्यं नरो
    रुद्राक्षधारणात् । धात्रीफलप्रमाणं यच्छ्रेष्ठमेतदुदाहृतम् ॥ ६॥ बदरीफलमात्रं तु मध्यमं प्रोच्यते बुधैः
    । अधमं चणमात्रं स्यात्प्रक्रियैषा मयोच्यते ॥ ७॥ ब्राह्मणाः क्षत्रिया वैश्याः शूद्राश्चेति शिवाज्ञया
    । वृथा जाताः पृथिव्यां तु तज्जातीयाः शुभाक्षकाः ॥ ८॥ श्वेतास्तु ब्राह्मणा ज्ञेयाः क्षत्रिया रक्तवर्णकाः
    । पीतास्तु वैश्या विज्ञेयाः कृष्णाः शूद्रा उदाहृताः ॥ ९॥ ब्राह्मणो बिभृयाच्छ्वेतात्रक्तात्राजा तु
    धारयेत् । पीतान्वैश्यस्तु बिभृयात्कृष्णाञ्छूद्रस्तु धारयेत् ॥ १०॥ समाः स्निग्धा दृढाः स्थूलाः कण्टकैः
    संयुताः शुभाः । कृमिदष्टं भिन्नभिन्नं कण्टकैर्हीनमेव च ॥ ११॥ व्रणयुक्तमयुक्तं च षड्रुद्राक्षाणि वर्जयेत्
    । स्वयमेव कृतं द्वारं रुद्राक्षं स्यादिहोत्तमम् ॥ १२॥ यत्तु पौरुषयत्नेन कृतं तन्मध्यमं भवेत् । समान्स्निग्धान्दृढान्स्थूलान्क्षौमसूत्रेण
    धारयेत् ॥ १३॥ सर्वगात्रेण सौम्येन सामान्यानि विचक्षणः । निकषे हेमरेखाभा यस्य रेखा प्रदृश्यते ॥ १४॥
    तदक्षममुत्तमं विद्यात्तद्धार्यं शिवपूजकैः । शिखायामेकरुद्राक्षं त्रिशतं शिरसा वहेत् ॥ १५॥ षट्त्रिंशतं
    गले दध्यात्बाहोः षोडशषोडश । मणिबन्धे द्वादशैव स्कन्धे पञ्चशतं वहेत् ॥ १६॥ अष्टोत्तरशतैर्मालामुपवीतं
    प्रकल्पयेत् । द्विसरं त्रिसरं वापि सराणां पञ्चकं तथा ॥ १७॥ सराणां सप्तकं वापि बिभृयात्कण्ठदेशतः ।
    मुकुटे कुण्डले चैव कर्णिकाहारकेऽपि वा ॥ १८॥ केयूरकटके सूत्रं कुक्षिबन्धे विशेषतः । सुप्ते पीते सदाकालं
    रुद्राक्षं धारयेन्नरः ॥ १९॥ त्रिशतं त्वधमं पञ्चशतं मध्यममुच्यते । सहस्रमुत्तमं प्रोक्तमेवं भेदेन धारयेत्
    ॥ २०॥ शिरसीशानमन्त्रेण कण्ठे तत्पुरुषेण तु । अघोरेण गले धार्यं तेनैव हृदयेऽपि च ॥ २१॥ अघोरबीजमन्त्रेण
    करयोर्धारयेत्सुधीः । पञ्चाशदक्षग्रथितान्व्योमव्याप्यपि चोदरे ॥ २२॥ पञ्च ब्रह्मभिरङ्गैशच त्रिमाला पञ्च
    सप्त च । ग्रथित्वा मूलमन्त्रेण सर्वाण्यक्षाणि धारयेत् ॥ २३॥ अथ हैनं भगवन्तं कालाग्निरुद्रं भुसुन्डः
    पप्रच्छ रुद्राक्षाणां भेदेन यदक्षं यत्स्वरूपं यत्फलमिति । तत्स्वरूपं मुखयुक्तमरिष्टनिरसनं कामाभीष्टफलं
    ब्रूहीति होवाच । तत्रैते श्लोका भवन्ति ॥ एकवक्त्रं तु रुद्राक्षं परतत्त्वस्वरूपकम् । तद्धारणात्परे
    तत्त्वे लीयते विजितेन्द्रियः ॥ १॥ द्विवक्त्रं तु मुनिश्रेष्ठ चार्धनारीश्वरात्मकम् । धारणादर्धनारीशः
    प्रीयते तस्य नित्यशः ॥ २॥ त्रिमुखं चैव रुद्राक्षमग्नित्रयस्वरूपकम् । तद्धारणाच्च हुतभुक्तस्य तुष्यति
    नित्यदा ॥ ३॥ चतुर्मुखं तु रुद्राक्षं चतुर्वक्त्रस्वरूपकम् । तद्धारणाच्चतुर्वक्त्रः प्रीयते तस्य नित्यदा
    ॥ ४॥ पञ्चवक्त्रं तु रुद्राक्षं पञ्चब्रह्मस्वरूपकम् । पञ्चवक्त्रः स्वयं ब्रह्म पुंहत्यां च व्यपोहति
    ॥ ५॥ षड्वक्त्रमपि रुद्राक्षं कार्तिकेयाधिदैवतम् । तद्धारणान्महाश्रीः स्यान्महदारोग्यमुत्तमम् ॥ ६॥
    मतिविज्ञानसम्पत्तिशुद्धये धारयेत्सुधीः । विनायकाधिदैवं च प्रवदन्ति मनीषिणः ॥ ७॥ सप्तवक्त्रं तु रुद्राक्षं
    सप्तमाधिदैवतम् । तद्धारणान्महाश्रीः स्यान्महदारोग्यमुत्तमम् ॥ ८॥ महती ज्ञानसम्पत्तिः शुचिर्धारणतः
    सदा । अष्टवक्त्रं तु रुद्राक्षमष्टमात्राधिदैवतम् ॥ ९॥ वस्वष्टकप्रियं चैव गङ्गाप्रीतिकरं तथा । तद्धारणादिमे
    प्रीता भवेयुः सत्यवादिनः ॥ १०॥ नववक्त्रं तु रुद्राक्षं नवशक्त्यधिदैवतम् । तस्य धारणमात्रेण प्रीयन्ते
    नवशक्तयः ॥ ११॥ दशवक्त्रं तु रुद्राक्षं यमदैवत्यमीरितम् । दर्शनाच्छान्तिजनकं धारणान्नात्र संशयः ॥ १२॥
    एकादशमुखं त्वक्षं रुद्रैकादशदैवतम् । तदिदं दैवतं प्राहुः सदा सौभाग्यवर्धनम् ॥ १३॥ रुद्राक्षं द्वादशमुखं
    महाविष्णुस्वरूपकम् । द्वादशादित्यरूपं च बिभर्त्येव हि तत्परम् ॥ १४॥ त्रयोदशमुखं त्वक्षं कामदं सिद्धिदं
    शुभम् । तस्य धारणमात्रेण कामदेवः प्रसीदति ॥ १५॥ चतुर्दशमुखं चाक्षं रुद्रनेत्रसमुद्भवम् । सर्वव्याधिहरं
    चैव सर्वदारोग्यमाप्नुयात् ॥ १६॥ मद्यं मांसं च लशुनं पलाण्डुं शिग्रुमेव च । श्लेष्मातकं विड्वराहमभक्ष्यं
    वर्जयेन्नरः ॥ १७॥ ग्रहणे विषुवे चैवमयने संक्रमेऽपि च । दर्शेषु पूर्णमासे च पूर्णेषु दिवसेषु च । रुद्राक्षधारणात्सद्यः
    सर्वपापैः प्रमुच्यते ॥ १८॥ रुद्राक्षमूलं तद्ब्रह्मा तन्नालं विष्णुरेव च । तन्मुखं रुद्र इत्याहुस्तद्बिन्दुः
    सर्वदेवताः ॥ १९॥ इति ॥ अथ कालाग्निरुद्रं भगवन्तं सनत्कुमारः पप्रच्छाधीहि भगवन्रुद्राक्षधारणविधिम्
    । तस्मिन्समये निदाघ
