    त्वे॒मा मे॑ अग्न॒ इष्ट॑का धे॒नवः॑ स॒न्त्वेका॑ च श॒त ञ्च समु॒द्रश्च॒ मद्ध्य॒ ञ्चान्त॑श्च परा॒र्धश्चे॒मा
    मे॑ अग्न॒ इष्ट॑का धे॒नवः॑ सन्तु ष॒ष्ठि मक्षी॑यमाणा ऋत॒स्था स्थ॑र्ता॒वृधो॑ घृत॒श्चुतो॑ मधु॒श्चुत॒ ऊर्ज॑स्वती
    स्स्वधा॒विनी॒स्ता मे॑ अग्न॒ इष्ट॑का धे॒नवः॑ सन्तु वि॒राजो॒ नाम॑ काम॒दुघा॑ अ॒मुत्रा॒मुष्मि॑न् ँलो॒के
    ॥ स्सुव॒र्विन्मधो॒रतो॒ माध॑वः पात्व॒स्मान् । अ॒ग्निर्दे॒वो दु॒ष्टरी॑तु॒रदा ङ्क्ष॒त्रग्ं र॑क्षतु॒ पात्व॒स्मान्
    ॥ र॒थ॒न्त॒रग्ं साम॑भिः पात्व॒स्मा न्गा॑य॒त्री छन्द॑सां विँ॒श्वरू॑पा । त्रि॒वृन्नो॑ वि॒ष्ठया॒ स्तोमो॒
    अह्नाग्ं॑ समु॒द्रो वात॑ इ॒दमोजः॑ पिपर्तु ॥ उ॒ग्रा दि॒शाम॒भि श्शुचिः॑ शु॒क्रे अह॑न्योज॒सीना । इन्द्राधि॑पतिः
    पिपृता॒दतो॑ नो॒ महि॑ विँ॒श्वतो॑ धारये॒दम् ॥ बृ॒ह न्त्रि॒ष्टुभौजः॑ शुभि॒त मु॒ग्रवी॑रम् । इन्द्र॒ स्तोमे॑न
    पञ्चद॒शेन॒ मद्ध्य॑मि॒दं वाँते॑न॒ सग॑रेण रक्ष ॥ प्राची॑ दि॒शाग्ं स॒हय॑शा॒ यश॑स्वती॒ विश्वे॑ देवाः प्रा॒वृषा
    ऽह्ना॒ग्ं॒ सुव॑र्वती । इ॒द न्दु॒ष्टर॑म॒स्त्वोजो ऽना॑धृष्टग्ं सह॒स्रिय॒ग्ं॒ सह॑स्वत् ॥ वै॒रू॒पे साम॑न्नि॒ह
    तच्छ॑केम॒ जग॑त्यैनं विँ॒क्ष्वा वे॑शयामः । विश्वे॑ देवा ङ्क्ष॒त्रग्ं स॑लि॒लवा॑तमु॒ग्रम् ॥ ध॒र्त्री
    दि॒शा म्मि॒त्रव॑द॒स्त्वोजः॑ । मित्रा॑वरुणा श॒रदा ञ्चिकित्नू अ॒स्मै रा॒ष्ट्राय॒ महि॒ शर्म॑ यच्छतम्
    ॥ वै॒रा॒जे साम॒न्नधि॑ मे मनी॒षा ऽनु॒ष्टुभा॒ सम्भृ॑तं वीँ॒र्यग्ं॑ सहः॑ । इ॒द म्मि॒त्रव॑दा॒र्द्रदा॑नु॒
    मित्रा॑वरुणा॒ रक्ष॑त॒ माधि॑पत्यैः ॥ स॒म्रा म्नी॒ सह॑स्वत्यृ॒तुर् हे॑म॒न्तो वि॒ष्ठया॑ नः पिपर्तु ।
    अ॒व॒स्युवा॑ता बृह॒तीर्नु शक्व॑रीरि॒मं यँ॒ज्ञम॑वन्तु नो घृ॒ताचीः ॥ सुव॑र्वती सु॒दुघा॑ नः॒ पय॑स्वती
