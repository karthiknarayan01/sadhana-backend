    तेन॑ चिन्वा॒नस्त॒नुवो॒ नि षी॑द ॥ अज॑स्र॒मिन्दु॑मरु॒ष म्भु॑र॒ण्युम॒ग्निमी॑डे पू॒र्वचि॑त्तौ॒ नमो॑भिः
    । स पर्व॑भिर् ऋतु॒शः कल्प॑मानो॒ गा म्मा हिग्ं॑सी॒रदि॑तिं म् ॥ इ॒मग्ं स॑मु॒द्रग्ं श॒तधा॑र॒मु हि॒ग्ं॒सीः॒
    प॒र॒मे व्यो॑मन्न् । हिग्ं॑सीः पर॒मे व्यो॑मन्न् । ग॒व॒यमा॑र॒ण्यमनु॑ ते दिशामि॒ तेन॑ चिन्वा॒नस्त॒नुवो॒
    नि षी॑द ॥ वरू न्त्वष्टु॒र्वरु॑णस्य॒ नाभि॒मवि॑ ञ्जज्ञा॒नाग्ं रज॑सः॒ पर॑स्मात् । म॒हीग्ं सा॑ह॒स्रीमसु॑रस्य
    मा॒यामग्ने॒ मा हिग्ं॑सीः पर॒मे व्यो॑मन्न् ॥ इ॒मामू ञ्चतु॑ष्पदाम् । त्वष्टुः॑ प्र॒जाना ञ्ज॒नित्र॒मग्ने॒
    मा हिग्ं॑सीः पर॒मे व्यो॑मन्न् । उष्ट्र॑मार॒ण्यमनु॑ ते दिशामि॒ तेन॑ चिन्वा॒नस्त॒नुवो॒ नि षी॑द ॥ यो
    अ॒ग्निर॒ग्नेस्त त्पृथि॒व्या उ॒त वा॑ दि॒वस्परि॑ । येन॑ प्र॒जा वि॒श्वक॑र्मा॒ व्यान॒ ट्तम॑ग्ने॒ हेडः॒
    परि॑ ते वृणक्तु ॥ अ॒जा ह्य॑ग्नेरज॑निष्ट॒ गर्भा॒ थ्सा वा अ॑पश्यज्जनि॒तार॒मग्रे । तया॒ रोह॑माय॒न्नुप॒
    मेद्ध्या॑स॒स्तया॑ दे॒वा दे॒वता॒मग्र॑ आयन्न् । श॒र॒भ मा॑र॒ण्यमनु॑ ते दिशामि॒ तेन॑ चिन्वा॒नस्त॒नुवो॒
    निषी॑द ॥ आ॒दि॒त्य मि॒मन्द्वि॒पादे॑ म॒युं वाँत॒स्या ऽश्व॑ मि॒म मेक॑शफ ङ्गौ॒रम ज॑स्रङ्गव॒यं ग्नी रोच॒ना
    दि॒वः परि॒ वाजे॑षु भूषथः । तद्वा द्वृ॒त्रमु॒त स॑नोति॒ वाज॒मिन्द्रा॒ यो अ॒ग्नी सहु॑री सप॒र्यात् । इ॒र॒ज्यन्ता॑
    वस॒व्य॑स्य॒ भूरे॒ स्सह॑स्तमा॒ सह॑सा वाज॒यन्ता ष॒णिभ्यः॑ पृतना॒ हवे॑षु॒ प्र पृ॑थि॒व्या रि॑रिचाथे दि॒वश्च॑
    । प्र सिन्धु॑भ्यः॒ प्रगि॒रिभ्यो॑ महि॒त्वा प्रेन्द्रा ग्नी॒ विश्वा॒ भुव॒ना ऽत्य॒न्या ॥ मरु॑तो॒ यस्य॒
    हि क्षये॑ पा॒था दि॒वो वि॑महसः । स सु॑गो॒पात॑मो॒ जनः॑ ॥ य॒ज्ञैर्वा॑ यज्ञवाहसो॒ विप्र॑स्य वा मती॒नाम्
    । मरु॑त म्मि॑मिक्षिरे॒ ते र॒श्मिभि॒स्त ऋक्व॑भि स्सुखा॒दयः॑ । ते वाशी॑मन्त इ॒ष्मिणो॒ अभी॑रवो वि॒द्रे
    प्रि॒यस्य॒ मारु॑तस्य॒ धाम्नः॑ ॥ अव॑ ते॒ हेड॒ उदु॑त्त॒मम् ॥ कया॑ नश्चि॒त्र आ भु॑वदू॒ती स॒दा वृ॑ध॒ ।
    कया॒ शचि॑ष्ठया वृ॒ता ॥ ॥ को अ॒द्य यु॑ङ्क्ते धु॒रि गा ऋ॒तस्य॒ शिमी॑वतो भा॒मिनो॑ दुर् हृणा॒यून् । आ॒सन्नि॑षून्
    हृ॒थ्स्वसो॑ मयो॒भून् थ्स जी॑वात् ॥ अग्ने॒ नया ऽऽदे॒वाना॒ग्ं॒ शन्नो॑ भवन्तु॒ वाजे॑वाजे। अ॒फ्स्व॑ग्ने॒
    सधि॒ष्टव॒ सौष॑धी॒रनु॑ रुद्ध्यसे । गर्भे॒ सञ्जा॑यसे॒ पुनः॑ ॥ वृषा॑ सोम द्यु॒माग्ं अ॑सि॒ वृषा॑ देव॒
    वृष॑व्रतः । वृषा॒ धर्मा॑णि दधिषे ॥ इ॒म अ॒ष्टाच॑त्वारिग्ंशत् त्वन्नो॑ अग्ने॒ स त्वन्नो॑ अग्ने ॥ हरिः॑
    ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थ काण्डे द्वितीयः प्रश्न
