id: kyts-jata-5-4-devasuraa-samyattaa-aasann-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.4 Devasuraa Samyattaa Aasann - Krishna Yajurveda Taittiriya Samhita
content:
  english: ya~tta devasura devasura devasura iti deva vyajayanta jayanta vi vyajayanta | ajayanta sa so
    'jayanta jayanta sah | eta indra indra eta eta indrah | indra stanu stanu rindra indra stanuh | ttanu
    stanu rapashyat | tta sta apashya dapashya ta upopa ta sta upa | upadhatta dhatto popadhatta | adhatta
    tabhi stabhi radhatta dhatta tabhih | rvai vai tabhi stabhi ntanuvagm sa sa tanuva tanuva mindriya
    mindriya ntanuva mindriyam | vi~rya mindriya mindriyam vi~rya matmann | adhatta tata stato 'dhatta
    dhatta tatah | tato deva deva stata stato devah | ndeva deva abhavann | para 'sura asurah para para
    'surah | dyadasura asura yat | yadindratanu rindratanu indratanu rupadadha tyupadadha tindratanu rindratanu
    rupadadhati | tanuva mevaiva tanuva eva tabhi stabhi revaiva tabhih | tabhi rindriya mindriya ntabhi
    stabhi rindriyam | vi~rya mindriya mindriyam ya~jamano yajamano viryam yajamano yajamana atmann |
    dhatte 'tho atho dhatte dhatte 'tho atho sendragm sendra matho atho sendra sendra mevaiva sendragm
    sendra meva | evagni magni mevai vagnim | agnigm satanugm satanu magni magnigm satanum | ncinute cinute
    satanugm satanu cinute bhavati bhavati cinute cinute bhavati | bhava tyatmana ''tmana bhavati bhava
    tyatmana atmana para para ''tmana ''tmana para asya bhratrivyo bhratrivyo 'syasya bhratrivyah | bhratrivyo
    bhavati bhavati bhratrivyo bhratrivyo bhavati | || bhavati yajno yajno bhavati bhavati yajnah | yajno
    devebhyo devebhyo yajno yajno devebhyah | devebhyo 'papa devebhyo devebhyo 'pa | nna navarudha mavarudha
    ta eta eta ste ta etah | ryajnatanu reta eta yajnatanuh | ryajnatanu rapashyann | yajnatanuriti yajna
    ta upopa ta sta upa | upadadhata dadhatopopa dadhata | adadhata tabhi stabhi radadhata dadhata tabhih
    | rvai vai tabhi stabhi ava rundhata rundhata vava rundhata | dyadarundhata rundhata yat | tyupadadhati
    yajnatanu ryajnatanu rupadadhati | yajnatanuriti yajna tyupadadhati yajnam | eva tabhi stabhi revaiva
    tabhih | ryajamano yajamana stabhi stabhi yajamano 'vava yajamano yajamano 'va | ava rundhe rundhe
    'vava rundhe | rundhe trayastrigmshata ntrayastrigmshatagm rundhe rundhe trayastrigmshatam | trayastrigmshata
    mupopa trayastrigmshata ntrayastrigmshata mupa | trayastrigmshatamiti trayah upa dadhati dadha tyupopa
    dadhati | dadhati trayastrigmsha ddadhati dadhati trayastrigmshat | dvai vai trayastrigmsha trayastrigmshaditi
    trayah vai devata devata vai vai devatah devata evaiva devata devata eva | ava rundhe rundhe 'vava
    rundhe | rundhe 'tho atho rundhe rundhe 'tho atho satmanagm satmana matho atho satmanam | satmana
    mevaiva satmanagm satmana meva | evagni magni mevai vagnim | agnigm satanugm satanu magni magnigm
    satanum | ncinute cinute satanugm satanu cinute satma satma cinute cinute satma nthsatma satma 'mushminn
    | amushmin ~loke loke 'mushmi nnamushmin ~loke | loke bhavati bhavati loke loke bhavati | || bhavati
    yo yo bhavati bhavati yah | rveda veda jyotishmatih | jyotishmati rupopa jyotishmati rjyotishmati
    rupa | upa dadhati dadha tyupopa dadhati | rdadhati dadhati jyotih | jyoti revaiva jyoti nnevai vasminn
    | ndadhati dadha tyasmi dadha tyetabhi retabhi rdadhati dadha tyetabhih | rvai va etabhi retabhi agni
    shcita shcito 'gni ragni shcitah | cito jvalati jvalati cita shcito jvalati | jvalati tabhi stabhi
    rjvalati jvalati tabhih | tabhi revaiva tabhi stabhi reva | evaina mena mevai vaina enagm sagm sa
    mena menagm sam | sa mindha indhe sagm sa mindhe | indha ubhayo rubhayo rindha indha ubhayoh ubhayo
    rasma asma ubhayo rubhayo rasmai | rlokayo rasma asmai lokayoh rbhavati bhavati jyoti bhavati nakshatreshtaka
    nakshatreshtaka bhavati bhavati nakshatreshtakah | nakshatreshtaka upopa nakshatreshtaka nakshatreshtaka
    upa | nakshatreshtaka iti nakshatra upa dadhati dadha tyupopa dadhati | dadha tyeta nyetani dadhati
    dadha tyetani | etani vai va eta nyetani vai | vai divo divo vai vai divah | divo jyotigmshi jyotigmshi
    divo divo jyotigmshi | jyotigmshi tani tani jyotigmshi jyotigmshi tani | tanyevaiva tani tanyeva |
    ava rundhe rundhe 'vava rundhe | rundhe sukritagm sukritagm rundhe rundhe sukrita vai~ vai sukritagm
    sukritam va eta nyetani vai va etani | etani jyotigmshi jyotig shyeta nyetani jyotigmshi | dyaj jyotigmshi
    jyotigmshi yat | nnakshatrani nakshatrani ya nakshatrani tani tani nakshatrani nakshatrani tani |
    tanye vaiva tani tanyeva | tyapno tyevaivapnoti | apno tyatho atho apno tyapno tyatho atho anukasha
    manukasha matho atho anukasham | anukasha mevaiva nukasha manukasha meva | evaita nyeta nyevaivaitani
    | etani jyotigmshi jyotig shyeta nyetani jyotigmshi | || jyotigmshi kurute kurute jyotigmshi jyotigmshi
    kurute | kurute suvargasya suvargasya kurute kurute suvargasya | suvargasya lokasya lokasya suvargasya
    suvargasya lokasya | suvargasyeti suvah lokasya nukhyatya anukhyatyai lokasya lokasya nukhyatyai |
    dyadanukhyatya anukhyatyai yat | anukhyatya ityanu sprishta upadaddhya dupadaddhya sprishta upadaddhyat
    | dvrishtyai vrishtya upadaddhya dupadaddhya upadaddhyadityupa vrishtyai lokam ~lokam vri~shtyai vrishtyai
    lokam | loka mapyapi lokam ~loka mapi | ddaddhya dapyapi daddhyat | shukah parjanyah parjanyo 'var
    tparjanyah parjanyah syat | sya dasaggsprishta asaggsprishta thsya dasaggsprishtah | asaggsprishta
    upopa saggsprishta asaggsprishta upa | asaggsprishta ityasam upa dadhati dadha tyupopa dadhati | dadhati
    vrishtyai vrishtyai dadhati dadhati vrishtyai vrishtya evaiva vrishtyai vrishtya eva | eva lokam ~loka
    mevaiva lokam | nkaroti karoti lokam ~loka shukah karoti karoti var shukah parjanyah parjanyo var
    parjanyo bhavati bhavati parjanyah parjanyo bhavati | dbhavati bhavati purasta purasta danya anyah
    purasta tpurasta danyah | pratici ranya anyah praticih pratici rupopa praticih upa dadhati dadha tyupopa
    dadhati | ddadhati dadhati pashcat | pashca danya anyah pashca anyah pracih praci ranya anyah pracih
    tpracih praci stasma tpracinani pracinani tasma pracinani ca ca pracinani pracinani ca | ca praticinani
    praticinani ca ca praticinani | praticinani ca ca praticinani praticinani ca | ca nakshatrani nakshatrani
    ca ca nakshatrani | nakshatranya nakshatrani nakshatranya | a vartante vartanta a vartante | vartanta
    iti vartante | || tavya ritavya upa | upa dadhati dadha tyupopa dadhati | dadha tyrituna mrituna ndadhati
    dadha tyritunam | nklriptyai klriptya rituna mrituna nklriptyai klriptyai dvandva mupopa dvandva upa
    dadhati dadha tyupopa dadhati | ddadhati dadhati tasma dvandva mritava ritavo ndvandva mritavah |
    ritavo 'dhrita 'dhrita r adhriteve vadhrita 'dhriteva | iva vai va iveva vai | va eshaisha vai va
    esha | nmaddhyama maddhyama ya maddhyama citi shciti rmaddhyama maddhyama citih | citi rantariksha
    mantariksha nciti shciti rantariksham | antariksha mive vantariksha mantariksha miva | iva vai va
    iveva vai | va eshaisha vai va esha | ndvandva meshaisha dvandvam | dvandva manya svanyasu dvandva
    ndvandva manyasu | anyasu citishu citi shvanya svanyasu citishu | citishu popa citishu citishupa |
    upa dadhati dadha tyupopa dadhati | dadhati catasra shcatasro dadhati dadhati catasrah | catasro maddhye
    maddhye catasra shcatasro maddhye maddhye dhrityai dhrityai maddhye maddhye dhrityai dhritya antasshleshana
    mantasshleshana ndhrityai dhritya antasshleshanam | vai~ va antasshleshana mantasshleshanam antasshleshanamityantah
    va eta eta vai va etah | ncitina meta eta shcitinam | yadritavya ritavya ya dyadritavya ritavya yat
    | yadritavya ritavya ya tyritavya ritavya upadadhati | upadadhati citina tyupadadhati citinam | vi~dhrityai
    vidhrityai citina vidhritya avaka mavakam vi~dhrityai vidhritya avakam | avaka manvan vavaka mavaka
    manu | upa dadhati dadha tyupopa dadhati | dadha tyeshaisha dadhati dadha tyesha | esha vai va eshaisha
    vai | ryoni ragne ragne ssayonigm sayonim sayoni mevaiva sayonigm sayoni meva | evagni magni mevai
    vagnim | ncinute cinute 'gni magni cinuta uvaco vaca cinute cinuta uvaca | uvaca ha hovaco vaca ha
    | ha vishvamitro vishvamitro ha ha vishvamitrah | vishvamitro 'da dada dvishvamitro vishvamitro 'dat
    | vishvamitra iti vishva ada didi dada dada dit | sa brahmana brahmana sa sa brahmana | brahmana 'nna
    manna mbrahmana brahmana 'nna ya~sya yasyanna mannam yasyaita eta yasya yasyaitah | eta upadhiyanta
    upadhiyanta eta eta upadhiyantai upadhiyantai yo ya upadhiyanta upadhiyantai yah | upadhiyanta ityupa
    caina enashca cainah | ena eva meva mena ena evam | pratishthaya eta meta pratishthayai nudate nudate
    pratishthayai pratishthayai nudate | pratishthaya iti prati nudate yo yo nudate nudate yah | ncitva
    citva 'gni magni citva na na citva citva na | na pratitishthati pratitishthati na na pratitishthati
    | pratitishthati panca panca pratitishthati pratitishthati panca | pratitishthatiti prati panca purvah
    purvah panca panca purvah purva shcitaya shcitayah purvah purva shcitayah | citayo bhavanti bhavanti
    citaya shcitayo bhavanti | ntyathatha bhavanti bhava atha shashthigm shashthi mathatha shashthim |
    ncitigm shashthigm shashthi ncinute cinute citi tthshat cinute cinute shat | va ritava ritavo vai
    va ritavah | va~thsara ritava ritavah sam va~thsara ritush vritushu sam va~thsare prati prati sam
    prati tishthati tishthati prati prati tishthati | tishtha tyeta eta stishthati tishtha tyetah | eta
    vai va eta eta vai | va adhipatni radhipatni rvai va adhipatnih | || rnama nama dhipatni radhipatni
    nameshtaka ishtaka nama nameshtakah | ishtaka yasya yasyeshtaka ishtaka yasya | yasyaita eta yasya
    yasyaitah | eta upadhiyanta upadhiyanta eta eta upadhiyante upadhiyante 'dhipati radhipati rupadhiyanta
    upadhiyante 'dhipatih | upadhiyanta ityupa adhipati revaiva dhipati radhipati reva | eva samananagm
    samanana mevaiva samanana mbhavati bhavati samananagm samanana ddhyaye dupadadha dupadadha dhyaye
    detabhya etabhyo ddhyaye detabhyah | etabhya evaivaitabhya etabhya eva | evaina mena mevai vaina a
    vrishcati vrishca tyavrishcati | ktajag vrishcati vrishcati tajak | arti ma ''rti marti ma | arccha
    tyriccha tyarcchati | riccha tyangiraso 'ngirasa riccha tyriccha tyangirasah | ssuvargagm suvarga
    mangiraso 'ngirasa suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~nto yanto lokam ~lokam yanto
    ya ya yanto yanto ya | ya yajnasya yajnasya ya ya yajnasya | yajnasya nishkriti ryajnasya yajnasya
    nishkritih | nishkriti rasi dasi ta mrishibhya rishibhya sta rishibhyah prati pratyrishibhya rishibhyah
    prati | nprati pratyauhann | taddhiranyagm hiranya hiranya mabhava dabhava ddhiranyagm hiranya mabhavat
    | dyaddhiranyashalkaih | hiranyashalkaih prokshati prokshati hiranyashalkair hiranyashalkaih prokshati
    | hiranyashalkairiti hiranya prokshati yajnasya yajnasya prokshati prokshati yajnasya | yajnasya nishkrityai
    nishkrityai yajnasya yajnasya nishkrityai | nishkritya atho atho nishkrityai nishkritya atho nishkritya
    iti nih mbheshaja matho atho bheshajam | bheshaja mevaiva bheshaja evasma asma evai vasmai asmai karoti
    karo tyasma asmai karoti | karo tyatho atho karoti karo tyatho atho rupena rupenatho atho rupena |
    rupenaivaiva rupena rupenaiva | evaina mena mevai vaina enagm sagm sa mena menagm sam | sa mardhaya
    tyardhayati sagm sa mardhayati | ardhaya tyatho atho ardhaya tyardhaya tyatho atho hiranyajyotisha
    hiranyajyotisha 'tho atho hiranyajyotisha | hiranyajyoti shaivaiva hiranyajyotisha hiranyajyotishaiva
    | hiranyajyotisheti hiranya eva suvargagm suvarga mevaiva suvargam | suvargam ~lokam ~lokagm suvargagm
    suvargam ~lokam | tyeti lokam ~loka meti | eti sahasravata sahasrava taityeti sahasravata | sahasravata
    pra pra sahasravata sahasravata pra | sahasravateti sahasra proksha tyukshati pra prokshati | ssahasra
    uksha tyukshati sahasrah | sahasrah prajapatih prajapati ssahasrah prajapatih | prajapatih prajapateh
    prajapateh prajapatih prajapatih prajapateh | prajapatiriti praja prajapate raptya aptyai prajapateh
    prajapate raptyai prajapateriti praja aptya ima ima aptya aptya imah | ima me ma ima ima me me agne
    'gne me me agne | agna ishtaka ishtaka agne 'gna ishtakah | ishtaka dhenavo dhenava ishtaka ishtaka
    dhenavah | dhenavah santu santu dhenavo dhenavah santu | santvititi santu santviti | ityaha hetityaha
    | rdhenu rahaha dhenuh | evaina ena evai vainah enah kurute kuruta ena enah kurute | kurute ta stah
    kurute kurute tah | kamadugha amutra mutra kamadughah kamadugha amutra | nnamutra mutra mushminn |
    amushmin ~loke loke 'mushmi nnamushmin ~loke | loka upopa loke loka upa | upa tishthante tishthanta
    upopa tishthante | tishthanta iti tishthante | || rudro vai vai rudro rudro vai | va esha esha vai
    va eshah | hi jato jata etar yatha vathso vathso yatha yatha vathsah | vathso jato jato vathso vathso
    jatah | mprephsati prephsati stanagg stana prephsa tyeva meva mprephsati prephsa tyevam | va esha
    esha vai va eshah | prephsatiphsati pra prephsati | iphsati tasmai tasma iphsatiphsati tasmai ttasmai
    tasmai yat | nna nahuti mahuti na juhuyaj juhuya juhuya daddhvaryu maddhvaryu njuhuyaj juhuya daddhvaryum
    | nca caddhvaryu maddhvaryu ddhyayec ca ca dhyayet | dhyaye cchatarudriyagm shatarudriya ddhyaye cchatarudriya
    njuhoti juhoti shatarudriyagm shatarudriya shatarudriyamiti shata juhoti bhagadheyena bhagadheyena
    juhoti juhoti bhagadheyena | bhagadheye naivaiva bhagadheyena bhagadheyenaiva | evaina mena mevai
    vaina enagm shamayati shamaya tyena menagm shamayati | shamayati na na shamayati shamayati na | arti
    ma ''rti marti ma | arccha tyriccha tyarcchati | riccha tyaddhvaryu raddhvaryur riccha tyriccha tyaddhvaryuh
    | rna naddhvaryu raddhvaryu na yajamano yajamano na na yajamanah | dyajamano yajamano yat | mpayasa
    payasa pashuna payasa juhuyaj juhuya tpayasa payasa juhuyat | ngramyan juhuyaj juhuya shuca 'rpaye
    darpaye cchuca shuca 'rpayet | yadaranyana maranyanam aranyana maranya naranya naranyana maranyana
    maranyan | aranyan jartilayavagva jartilayavagva ''ranya naranyan jartilayavagva jartilayavagva va
    va jartilayavagva jartilayavagva va | jartilayavagveti jartila va juhuyaj juhuya dva va juhuyat |
    dgavidhukayavagva gavidhukayavagva juhuyaj juhuya gavidhukayavagva va va gavidhukayavagva gavidhukayavagva
    va | gavidhukayavagveti gavidhuka hinasti hinasti pashu hinasti na na hinasti hinasti na | aranya
    natho atho aranya naranya natho atho khalu khalvatho atho khalu | khalvahu rahuh khalu khalvahuh |
    ahu ranahuti ranahuti rahu rahu ranahutih | rvai va anahuti ranahuti vai jartila jartila vai vai jartilah
    shca ca jartila jartila ca gavidhuka gavidhukashca ca gavidhukah | gavidhukashca ca gavidhuka gavidhukashca
    | ityajakshirena jakshire netityajakshirena | ajakshirena juhoti juho tyajakshirena jakshirena juhoti
    | juho tyagneyya gneyi juhoti juho tyagneyi | va eshaisha vai va esha | aja ''hutya ''hutya 'ja 'ja
    ''hutya | ahu tyaivaiva hutya ''hutyaiva | eva juhoti juho tyevaiva juhoti | juhoti na na juhoti juhoti
    na | hinasti hinasti pashu hinasti na na hinasti hinasti na | aranya nangiraso 'ngirasa aranya naranya
    nangirasah | ssuvargagm suvarga mangiraso 'ngirasa suvargam ~lokam ~lokagm suvargagm suvargam ~lokam
    | ya~nto yanto lokam ~lokam yanto 'jaya majayam ya~nto yanto 'jaya ngharma majaya majaya npra prasincann
    | sa shocanti shocanti sa sa shocanti | mparnagm shocanti shocanti parnam | para 'jihita jihita para
    para 'jihita | ajihita sa so 'jihita jihita sah | arko 'bhava dabhava darko tadarkasya rkasya ta rkatva
    markatva markasya rkasya arkatva markaparnena rkatva markatva markaparnena | arkaparnena juhoti juho
    tyarkaparnena rkaparnena juhoti | arkaparnenetyarka juhoti sayonitvaya sayonitvaya juhoti juhoti sayonitvaya
    | sayonitva yodam mudam khsayonitvaya sayonitva yodam | sayonitvayeti sayoni ntishthagg stishtha tishthan
    juhoti juhoti tishthagg stishthan juhoti | juho tyeshaisha juhoti juho tyesha | esha vai va eshaisha
    vai | vai rudrasya rudrasya vai vai rudrasya | rudrasya dig dig rudrasya rudrasya dik | khsvayag svaya
    svaya mevaiva svayag svaya meva | eva dishi dishye vaiva dishi | dishi rudragm rudra ndishi dishi
    rudram | nniravadayate niravadayate rudragm rudra nniravadayate niravadayate caramaya caramaya mishtakaya
    mishtakaya ncaramaya mishtakayam | njuhoti juhotishtakaya mishtakaya 'ntato juhoti juho tyantatah
    | antata evaiva ntato eva rudragm rudra mevaiva rudram | nniravadayate niravadayate rudragm rudra
    niravadayate tredhavibhakta nniravadayate niravadayate tredhavibhaktam | njuhoti juhoti tredhavibhakta
    tredhavibhaktamiti tredha juhoti traya strayo juhoti juhoti trayah | traya ima ime traya straya ime
    | ime loka loka ima ime lokah | loka ima niman ~loka loka iman | ima nevaivema nima neva | eva lokan
    ~loka nevaiva lokan | nthsamavadviryan ~lokan ~loka nthsamavadviryan | samavadviryan karoti karoti
    samavadvirya nthsamavadviryan karoti | samavadviryaniti samavat karoti yati yati karoti karoti yati
    | iya tyagre 'gra iyati yatyagre agre juhoti juho tyagre 'gre juhoti | juho tyathatha juhoti juho
    tyatha | || athe yati yatyathathe yati | iyatyathathe yati yatyatha | athe yati yatyathathe yati |
    iyati traya straya iyati yati trayah | traya ima ime traya straya ime | ime loka loka ima ime lokah
    | loka ebhya ebhyo loka loka ebhyah | ebhya evai vaibhya ebhya eva | evaina mena mevai vaina enam
    ~lokebhyo lokebhya ena menam ~lokebhyah | lokebhyah shamayati shamayati lokebhyo lokebhyah shamayati
    | shamayati tisra stisra shshamayati shamayati tisrah | tisra uttara uttara stisra stisra uttarah
    | uttara ahuti rahuti ruttara uttara ahutih | rjuhoti juho tyahuti rahuti djuhoti juhoti shat | mpadyante
    padyante sagm sa tthshat padyante padyante shat | va ritava ritavo vai va ritavah | ritava ritava
    ritubhih | evaina mena mevai vaina enagm shamayati shamaya tyena menagm shamayati | dyacchamayati
    shamayati yat | yadanuparikrama manuparikramam njuhuyaj juhuya danuparikrama manuparikrama anuparikramamityanu
    juhuya dantaravacarina mantaravacarina njuhuyaj juhuya dantaravacarina antaravacarinagm rudragm rudra
    mantaravacarina mantaravacarinagm rudram | antaravacarinamityantah kurya datho atho kurya atho khalu
    khalvatho atho khalu | khalvahu rahuh khalu khalvahuh | nkasya mahu rahuh kasya va 'haha va va 'ha
    | aha dishi dishya haha dishi | dishi rudro rudro dishi dishi rudrah | nkasyagm rudro rudrah kasya
    ityanuparikrama manuparikrama miti tyanuparikrama anuparikrama mevai vanu parikrama manuparikrama
    meva | anuparikramamityanu eva hotavyagm hotavya mevaiva hotavya hotavya maparivarga maparivargagm
    hotavyagm hotavya maparivargam | aparivarga mevaiva parivarga maparivarga meva | evaina mena mevai
    vaina enagm shamayati shamaya tyena menagm shamayati | shshamayati shamaya tyetah | || eta vai va
    eta eta vai | vai devata devata vai vai devatah ssuvargya devata devata suvargya iti suvah ya uttama
    uttama ya ya uttamah | uttama sta sta uttama uttama stah | nta sta yajamanam | va~cayati vacayati
    yajamanam vacayati tabhi stabhi rvacayati vacayati tabhih | tabhi revaiva tabhi stabhi reva | evaina
