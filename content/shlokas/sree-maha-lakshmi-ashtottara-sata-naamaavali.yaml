    नमः ॐ कान्तायै नमः ॐ कामाक्ष्यै नमः ॐ क्षीरोदसम्भवायै नमः ॐ अनुग्रहपरायै नमः ॐ बुद्धये नमः ॐ अनघायै
    नमः ॐ हरिवल्लभायै नमः ॐ अशोकायै नमः ॐ अमृतायै नमः ॐ दीप्तायै नमः ॐ लोकशोक विनाशिन्यै नमः ॐ धर्मनिलयायै
    नमः ॐ करुणायै नमः ॐ लोकमात्रे नमः ॐ पद्मप्रियायै नमः ॐ पद्महस्तायै नमः ॐ पद्माक्ष्यै नमः ॐ पद्मसुन्दर्यै
    नमः ॐ पद्मोद्भवायै नमः ॐ पद्ममुख्यै नमः ॐ पद्मनाभप्रियायै नमः ॐ रमायै नमः ॐ पद्ममालाधरायै नमः ॐ देव्यै
    नमः ॐ पद्मिन्यै नमः ॐ पद्मगन्धिन्यै नमः ॐ पुण्यगन्धायै नमः ॐ सुप्रसन्नायै नमः ॐ प्रसादाभिमुख्यै नमः
    ॐ प्रभायै नमः ॐ चन्द्रवदनायै नमः ॐ चन्द्रायै नमः ॐ चन्द्रसहोदर्यै नमः ॐ चतुर्भुजायै नमः ॐ चन्द्ररूपायै
    नमः ॐ इन्दिरायै नमः ॐ इन्दुशीतलायै नमः ॐ आह्लादजनन्यै नमः ॐ पुष्ट्यै नमः ॐ शिवायै नमः ॐ शिवकर्यै नमः
    ॐ सत्यै नमः ॐ विमलायै नमः ॐ विश्वजनन्यै नमः ॐ तुष्टये नमः ॐ दारिद्र्यनाशिन्यै नमः ॐ प्रीतिपुष्करिण्यै
