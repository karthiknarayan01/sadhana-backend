    susila sujana || tinhahi dekhi saba sura suranarim| bhe nakhata janu bidhu ujiarim || bidhihi bhayaha
    acaraju biseshi| nija karani kachu katahu~ na dekhi || do siva~ samujhae deva saba jani acaraja bhulahu|
    hridaya~ bicarahu dhira dhari siya raghubira biahu || || jinha kara namu leta jaga mahim| sakala amangala
    mula nasahim || karatala hohim padaratha cari| tei siya ramu kaheu kamari || ehi bidhi sambhu suranha
    samujhava| puni agem bara basaha calava || devanha dekhe dasarathu jata| mahamoda mana pulakita gata
    || sadhu samaja sanga mahideva| janu tanu dharem karahim sukha seva || sohata satha subhaga suta cari|
    janu apabaraga sakala tanudhari || marakata kanaka barana bara jori| dekhi suranha bhai priti na thori
    || puni ramahi biloki hiya~ harashe| nripahi sarahi sumana tinha barashe || do rama rupu nakha sikha
    subhaga barahim bara nihari| pulaka gata locana sajala uma sameta purari || || keki kantha duti syamala
    anga| taraita binindaka basana suranga || byaha bibhushana bibidha banae| mangala saba saba bha~ti
    suhae || sarada bimala bidhu badanu suhavana| nayana navala rajiva lajavana || sakala alaukika sundaratai|
    kahi na jai manahim mana bhai || bandhu manohara sohahim sanga| jata nacavata capala turanga || rajakua~ra
    bara baji dekhavahim| bamsa prasamsaka birida sunavahim || jehi turanga para ramu biraje| gati biloki
    khaganayaku laje || kahi na jai saba bha~ti suhava| baji beshu janu kama banava || cham janu baji
    beshu banai manasiju rama hita ati sohi| apanem baya bala rupa guna gati sakala bhuvana bimohi ||
    jagamagata jinu jarava joti sumoti mani manika lage| kinkini lalama lagamu lalita biloki sura nara
    muni thage || do prabhu manasahim layalina manu calata baji chabi pava| bhushita uragana taraita ghanu
    janu bara barahi nacava || || jehim bara baji ramu asavara| tehi saradu na baranai para || sankaru
    rama rupa anurage| nayana pancadasa ati priya lage || hari hita sahita ramu jaba johe| rama sameta
    ramapati mohe || nirakhi rama chabi bidhi harashane| athi nayana jani pachitane || sura senapa ura
    bahuta uchahu| bidhi te devarha locana lahu || ramahi citava suresa sujana| gautama shrapu parama
    hita mana || deva sakala surapatihi sihahim| aju purandara sama kau nahim || mudita devagana ramahi
    dekhi| nripasamaja duhu~ harashu biseshi || cham ati harashu rajasamaja duhu disi dundubhim bajahim
    ghani| barashahim sumana sura harashi kahi jaya jayati jaya raghukulamani || ehi bha~ti jani barata
    avata bajane bahu bajahim| rani suasini boli parichani hetu mangala sajahim || do saji arati aneka
    bidhi mangala sakala sa~vari| calim mudita parichani karana gajagamini bara nari || || bidhubadanim
    saba saba mrigalocani| saba nija tana chabi rati madu mocani || pahirem barana barana bara cira| sakala
    bibhushana sajem sarira || sakala sumangala anga banae~| karahim gana kalakanthi lajae~ || kankana
    kinkini nupura bajahim| cali biloki kama gaja lajahim || bajahim bajane bibidha prakara| nabha aru
    nagara sumangalacara || saci sarada rama bhavani| je suratiya suci sahaja sayani || kapata nari bara
    besha banai| milim sakala ranivasahim jai || karahim gana kala mangala banim| harasha bibasa saba
    kahu~ na jani || cham ko jana kehi ananda basa saba brahmu bara parichana cali| kala gana madhura
    nisana barashahim sumana sura sobha bhali || anandakandu biloki dulahu sakala hiya~ harashita bhi
    || ambhoja ambaka ambu umagi suanga pulakavali chi || do jo sukha bha siya matu mana dekhi rama bara
    beshu| so na sakahim kahi kalapa sata sahasa sarada seshu || || nayana niru hati mangala jani| parichani
    karahim mudita mana rani || beda bihita aru kula acaru| kinha bhali bidhi saba byavaharu || panca
    sabada dhuni mangala gana| pata pa~varae parahim bidhi nana || kari arati araghu tinha dinha| rama
    gamanu mandapa taba kinha || dasarathu sahita samaja biraje| bibhava biloki lokapati laje || samaya~
    samaya~ sura barashahim phula| santi parhahim mahisura anukula || nabha aru nagara kolahala hoi| apani
    para kachu suni na koi || ehi bidhi ramu mandapahim ae| araghu dei asana baithae || cham baithari
    asana arati kari nirakhi baru sukhu pavahim || mani basana bhushana bhuri varahim nari mangala gavahim
    || brahmadi surabara bipra besha banai kautuka dekhahim| avaloki raghukula kamala rabi chabi suphala
    jivana lekhahim || do bari bhata nata rama nichavari pai| mudita asisahim nai sira harashu na hridaya~
    samai || || mile janaku dasarathu ati pritim| kari baidika laukika saba ritim || milata maha dau raja
    biraje| upama khoji khoji kabi laje || lahi na katahu~ hari hiya~ mani| inha sama ei upama ura ani
    || samadha dekhi deva anurage| sumana barashi jasu gavana lage || jagu biranci upajava jaba tem| dekhe
    sune byaha bahu taba tem || sakala bha~ti sama saju samaju| sama samadhi dekhe hama aju || deva gira
    suni sundara sa~ci| priti alaukika duhu disi maci || deta pa~varae araghu suhae| sadara janaku mandapahim
    lyae || cham mandapu biloki bicitra racana~ rucirata~ muni mana hare || nija pani janaka sujana saba
    kahu~ ani singhasana dhare || kula ishta sarisa basishta puje binaya kari asisha lahi| kausikahi pujata
    parama priti ki riti tau na parai kahi || do bamadeva adika rishaya puje mudita mahisa| die dibya
    asana sabahi saba sana lahi asisa || || bahuri kinha kosalapati puja| jani isa sama bhau na duja ||
    kinha jori kara binaya baraai| kahi nija bhagya bibhava bahutai || puje bhupati sakala barati| samadhi
    sama sadara saba bha~ti || asana ucita die saba kahu| kahaum kaha mukha eka uchahu || sakala barata
    janaka sanamani| dana mana binati bara bani || bidhi hari haru disipati dinar | je janahim raghubira
    prabh || kapata bipra bara besha banae~| kautuka dekhahim ati sacu pae~ || puje janaka deva sama janem|
    die suasana binu pahicanem || cham pahicana ko kehi jana sabahim apana sudhi bhori bhi| ananda kandu
    biloki dulahu ubhaya disi ana~da mi || sura lakhe rama sujana puje manasika asana de| avaloki silu
    subhau prabhu ko bibudha mana pramudita bhe || do ramacandra mukha candra chabi locana caru cakora|
    karata pana sadara sakala premu pramodu na thora || || samu biloki basishtha bolae| sadara satanandu
    suni ae || begi kua~ri aba anahu jai| cale mudita muni ayasu pai || rani suni uparohita bani| pramudita
    sakhinha sameta sayani || bipra badhu kulabriddha bolaim| kari kula riti sumangala gaim || nari besha
    je sura bara bama| sakala subhaya~ sundari syama || tinhahi dekhi sukhu pavahim narim| binu pahicani
    pranahu te pyarim || bara bara sanamanahim rani| uma rama sarada sama jani || siya sa~vari samaju
    banai| mudita mandapahim calim lavai || cham cali lyai sitahi sakhim sadara saji sumangala bhaminim|
    navasapta sajem sundari saba matta kunjara gaminim || kala gana suni muni dhyana tyagahim kama kokila
    lajahim| manjira nupura kalita kankana tala gati bara bajahim || do sohati banita brinda mahu~ sahaja
    suhavani siya| chabi lalana gana madhya janu sushama tiya kamaniya || || siya sundarata barani na
    jai| laghu mati bahuta manoharatai || avata dikhi baratinha sita || rupa rasi saba bha~ti punita ||
    sabahi manahim mana kie pranama| dekhi rama bhe puranakama || harashe dasaratha sutanha sameta| kahi
    na jai ura ana~du jeta || sura pranamu kari barasahim phula| muni asisa dhuni mangala mula || gana
    nisana kolahalu bhari| prema pramoda magana nara nari || ehi bidhi siya mandapahim ai| pramudita santi
    parhahim munirai || tehi avasara kara bidhi byavaharu| duhu~ kulagura saba kinha acaru || cham acaru
    kari gura gauri ganapati mudita bipra pujavahim| sura pragati puja lehim dehim asisa ati sukhu pavahim
    || madhuparka mangala drabya jo jehi samaya muni mana mahu~ cahaim| bhare kanaka kopara kalasa so
    saba liehim paricaraka rahaim || || kula riti priti sameta rabi kahi deta sabu sadara kiyo| ehi bha~ti
    deva pujai sitahi subhaga singhasanu diyo || siya rama avalokani parasapara prema kahu na lakhi parai
    || mana buddhi bara bani agocara pragata kabi kaisem karai || homa samaya tanu dhari analu ati sukha
    ahuti lehim| bipra besha dhari beda saba kahi bibaha bidhi dehim || || janaka patamahishi jaga jani|
    siya matu kimi jai bakhani || sujasu sukrita sukha sudamratai| saba sameti bidhi raci banai || samu
    jani munibaranha bolai| sunata suasini sadara lyai || janaka bama disi soha sunayana| himagiri sanga
    bani janu mayana || kanaka kalasa mani kopara rure| suci sungadha mangala jala pure || nija kara mudita
    raya~ aru rani| dhare rama ke agem ani || parhahim beda muni mangala bani| gagana sumana jhari avasaru
    jani || baru biloki dampati anurage| paya punita pakharana lage || cham lage pakharana paya pankaja
    prema tana pulakavali| nabha nagara gana nisana jaya dhuni umagi janu cahu~ disi cali || je pada saroja
    manoja ari ura sara sadaiva birajahim| je sakrita sumirata bimalata mana sakala kali mala bhajahim
    || || je parasi munibanita lahi gati rahi jo patakami| makarandu jinha ko sambhu sira sucita avadhi
    sura barani || kari madhupa mana muni jogijana je sei abhimata gati lahaim| te pada pakharata bhagyabhajanu
    janaku jaya jaya saba kahai || || bara kua~ri karatala jori sakhocaru dau kulagura karaim| bhayo panigahanu
    biloki bidhi sura manuja muni a~nada bharaim || sukhamula dulahu dekhi dampati pulaka tana hulasyo
    hiyo| kari loka beda bidhanu kanyadanu nripabhushana kiyo || || himavanta jimi girija mahesahi harihi
    shri sagara di| timi janaka ramahi siya samarapi bisva kala kirati ni || kyom karai binaya bidehu
    kiyo bidehu murati sava~ri| kari homa bidhivata ga~thi jori hona lagi bhava~ri || jaya dhuni bandi
    beda dhuni mangala gana nisana| suni harashahim barashahim bibudha surataru sumana sujana || || kua~ru
    kua~ri kala bhava~ri dehim || nayana labhu saba sadara lehim || jai na barani manohara jori| jo upama
    kachu kahaum so thori || rama siya sundara pratichahim| jagamagata mani khambhana mahim | manahu~
    madana rati dhari bahu rupa| dekhata rama biahu anupa || darasa lalasa sakuca na thori| pragatata
    durata bahori bahori || bhe magana saba dekhanihare| janaka samana apana bisare || pramudita muninha
    bhava~ri pheri| negasahita saba riti niberim || rama siya sira sendura dehim| sobha kahi na jati bidhi
    kehim || aruna paraga jalaju bhari nikem| sasihi bhusha ahi lobha ami kem || bahuri basishtha dinha
