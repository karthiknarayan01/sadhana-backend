id: mahaganapativajrapanjarakavacam
category: kavacha
name:
  english: mahaganapativajrapanjarakavacam
  devanagari: महागणपतिवज्रपन्जरकवचम्
content:
  english: vajravidyadisiddhyarthe mahaganapativajrapanjarakavacapathe viniyogah || || rishyadinyasah
    || shribhairavarshaye namah shirasi | gayatrachandase namo mukhe | shrimahaganapatidevatayai namo
    hridi | gam bijaya namo guhye | hrimshaktaye namo nabhau | kuru kuru kilakaya namah padayoh | vajravidyadisiddhyarthe
    mahaganapativajrapanjarakavacapathe viniyogaya namah sarvange || || karanyasah || gam angushthabhyam
    namah | gim tarjanibhyam namah | gum madhyamabhyam namah | gaim anamikabhyam namah | gaum kanishthikabhyam
    namah | gah karatalakaraprishthabhyam namah || || anganyasah || gam hridayaya namah | gim shirase
    svaha | gum shikhayai vashat | gaim kavacaya hum | gaum netratrayaya vaushat | gah astraya phat ||
    || dhyanam || vighnesham vishvavandyam suvipulayashasam lokarakshapradaksham sakshatsarvapadasu prashamanasumatim
    parvatipranasunum | prayah sarvasurendraih sasuramuniganaih sadhakaih pujyamanam karunyenantarayamitabhayashamanam
    vighnarajam namami || || kavacapathah || om shrim hrim gam shirah patu mahaganapatih prabhuh | vinayako
    lalatam me vighnarajo bhruvau mama || 1|| patu netre ganadhyaksho nasikam me gajananah | shruti me'vatu
    herambo gandau me modakashanah || 2|| dvaimaturo mukham patu cadharau patvarindamah | dantanmamaikadanto'vyadvakratundo'vatadrasam
    || 3|| gangeyo me galam patu skandhau simhasano'vatu | vighnantako bhujau patu hastau mushakavahanah
    || 4|| uru mamavatannityam devastripuraghatanah | hridayam me kumaro'vyajjayantah parshvayugmakam
    || 5|| pradyumno me'vatatprishtham nabhim shankaranandanah | katim nandiganah patu shishnam vishveshvaro'vatu
    || 6|| medhre me'vatu saubhagyo bhringiriti ca guhyakam | viratako'vataduru janu me pushpadantakah
    || 7|| janghe mama vikarto'vyadgulphavantyagano'vatu | padau cittaganah patu padadho lohito'vatu ||
    8|| padaprishtham sundaro'vyannupuradhyo vapurmama | vicaro jatharam patu bhutani cograrupakah ||
    9|| shirasah padaparyantam vapuh saptagano'vatu | padadimurdhaparyantam vapuh patu vinartakah || 10||
    vismaritam tu yatsthanam ganeshastatsada'vatu | purve mam hrim karalo'vyadagneye vikaralakah || 11||
    dakshine patu samharo nairrite rurubhairavah | pashcime mam mahakalo vayau kalagnibhairavah || 12||
    uttare mam sitasyo'vyadaishanyamasitatmakah | prabhate shatapatro'vyatsahasrarastu madhyame || 13||
    dantamala dinante'vyannishi patram sada'vatu | kalasho mam nishithe'vyannishante parashustatha | sarvatra
    sarvada patu shankhayugmam ca madvapuh || 14|| om om rajakule haum haum ranabhaye hrim hrim kudyute'vatat
    shrim shrim shatrugrihe shaum shaum jalabhaye klim klim vanante'vatu | glaum glum glaim glam gum sattvabhitishu
    mahavyadhyartishu glaum gam gaum nityam yakshapishacabhutaphanishu glaum gam ganesho'vatu || 15||
    || phalashrutih || itidam kavacam guhyam sarvatantreshu gopitam | vajrapanjaranamanam ganeshasya mahatmanah
    || 1|| angabhutam manumayam sarvacaraikasadhanam | vinanena na siddhih syatpujanasya japasya ca ||
    2|| tasmattu kavacam punyam pathedva dharayetsada | tasya siddhirmahadevi karastha paralaukiki ||
    3|| yam yam kamayate kamam tam tam prapnoti pathatah | ardharatre pathennityam sarvabhishtaphalam
    labhet || 4|| iti guhyam sukavacam mahaganapateh priyam | sarvasiddhimayam divyam gopayetparameshvari
    || || shrirudrayamale tantre shrimahaganapativajrapanjarakavacam sampurnam ||
  devanagari: वज्रविद्यादिसिद्ध्यर्थे महागणपतिवज्रपञ्जरकवचपाठे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ श्रीभैरवर्षये
    नमः शिरसि । गायत्रछन्दसे नमो मुखे । श्रीमहागणपतिदेवतायै नमो हृदि । गं बीजाय नमो गुह्ये । ह्रींशक्तये
    नमो नाभौ । कुरु कुरु कीलकाय नमः पादयोः । वज्रविद्यादिसिद्ध्यर्थे महागणपतिवज्रपञ्जरकवचपाठे विनियोगाय
    नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ गां अङ्गुष्ठाभ्यां नमः । गीं तर्जनीभ्यां नमः । गूं मध्यमाभ्यां नमः ।
    गैं अनामिकाभ्यां नमः । गौं कनिष्ठिकाभ्यां नमः । गः करतलकरपृष्ठाभ्यां नमः ॥ ॥ अङ्गन्यासः ॥ गां हृदयाय
    नमः । गीं शिरसे स्वाहा । गूं शिखायै वषट् । गैं कवचाय हुम् । गौं नेत्रत्रयाय वौषट् । गः अस्त्राय फट्
    ॥ ॥ ध्यानम् ॥ विघ्नेशं विश्ववन्द्यं सुविपुलयशसं लोकरक्षाप्रदक्षं साक्षात्सर्वापदासु प्रशमनसुमतिं पार्वतीप्राणसूनुम्
    । प्रायः सर्वासुरेन्द्रैः ससुरमुनिगणैः साधकैः पूज्यमानं कारुण्येनान्तरायामितभयशमनं विघ्नराजं नमामि
    ॥ ॥ कवचपाठः ॥ ॐ श्रीं ह्रीं गं शिरः पातु महागणपतिः प्रभुः । विनायको ललाटं मे विघ्नराजो भ्रुवौ मम ॥
    १॥ पातु नेत्रे गणाध्यक्षो नासिकां मे गजाननः । श्रुती मेऽवतु हेरम्बो गण्डौ मे मोदकाशनः ॥ २॥ द्वैमातुरो
    मुखं पातु चाधरौ पात्वरिन्दमः । दन्तान्ममैकदन्तोऽव्याद्वक्रतुण्डोऽवताद्रसाम् ॥ ३॥ गाङ्गेयो मे गलं पातु
    स्कन्धौ सिंहासनोऽवतु । विघ्नान्तको भुजौ पातु हस्तौ मूषकवाहनः ॥ ४॥ ऊरू ममावतान्नित्यं देवस्त्रिपुरघातनः
    । हृदयं मे कुमारोऽव्याज्जयन्तः पार्श्वयुग्मकम् ॥ ५॥ प्रद्युम्नो मेऽवतात्पृष्ठं नाभिं शङ्करनन्दनः ।
    कटिं नन्दिगणः पातु शिश्नं विश्वेश्वरोऽवतु ॥ ६॥ मेढ्रे मेऽवतु सौभाग्यो भृङ्गिरीटी च गुह्यकम् । विराटकोऽवतादूरू
    जानू मे पुष्पदन्तकः ॥ ७॥ जङ्घे मम विकर्तोऽव्याद्गुल्फावन्त्यगणोऽवतु । पादौ चित्तगणः पातु पादाधो लोहितोऽवतु
    ॥ ८॥ पादपृष्ठं सुन्दरोऽव्यान्नूपुराढ्यो वपुर्मम । विचारो जठरं पातु भूतानि चोग्ररूपकः ॥ ९॥ शिरसः पादपर्यन्तं
    वपुः सप्तगणोऽवतु । पादादिमूर्धपर्यन्तं वपुः पातु विनर्तकः ॥ १०॥ विस्मारितं तु यत्स्थानं गणेशस्तत्सदाऽवतु
    । पूर्वे मां ह्रीं करालोऽव्यादाग्नेये विकरालकः ॥ ११॥ दक्षिणे पातु संहारो नैरृते रुरुभैरवः । पश्चिमे
    मां महाकालो वायौ कालाग्निभैरवः ॥ १२॥ उत्तरे मां सितास्योऽव्यादैशान्यामसितात्मकः । प्रभाते शतपत्रोऽव्यात्सहस्रारस्तु
    मध्यमे ॥ १३॥ दन्तमाला दिनान्तेऽव्यान्निशि पात्रं सदाऽवतु । कलशो मां निशीथेऽव्यान्निशान्ते परशुस्तथा
    । सर्वत्र सर्वदा पातु शङ्खयुग्मं च मद्वपुः ॥ १४॥ ॐ ॐ राजकुले हौं हौं रणभये ह्रीं ह्रीं कुद्यूतेऽवतात्
    श्रीं श्रीं शत्रुगृहे शौं शौं जलभये क्लीं क्लीं वनान्तेऽवतु । ग्लौं ग्लूं ग्लैं ग्लं गुं सत्त्वभीतिषु
    महाव्याध्यार्तिषु ग्लौं गं गौं नित्यं यक्षपिशाचभूतफणिषु ग्लौं गं गणेशोऽवतु ॥ १५॥ ॥ फलश्रुतिः ॥ इतीदं
    कवचं गुह्यं सर्वतन्त्रेषु गोपितम् । वज्रपञ्जरनामानं गणेशस्य महात्मनः ॥ १॥ अङ्गभूतं मनुमयं सर्वाचारैकसाधनम्
    । विनानेन न सिद्धिः स्यात्पूजनस्य जपस्य च ॥ २॥ तस्मात्तु कवचं पुण्यं पठेद्वा धारयेत्सदा । तस्य सिद्धिर्महादेवि
    करस्था पारलौकिकी ॥ ३॥ यं यं कामयते कामं तं तं प्राप्नोति पाठतः । अर्धरात्रे पठेन्नित्यं सर्वाभीष्टफलं
    लभेत् ॥ ४॥ इति गुह्यं सुकवचं महागणपतेः प्रियम् । सर्वसिद्धिमयं दिव्यं गोपयेत्परमेश्वरि ॥ ॥ श्रीरुद्रयामले
    तन्त्रे श्रीमहागणपतिवज्रपञ्जरकवचं सम्पूर्णम् ॥
