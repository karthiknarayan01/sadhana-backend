id: arunacalashivastotram-jagadambikakritam-skandapuranantargatam-arunadrimayam-lingam-tushtava-jagadambika
category: stotram
name:
  english: arunacalashivastotram (jagadambikakritam skandapuranantargatam arunadrimayam lingam tushtava
    jagadambika)
  devanagari: अरुणाचलशिवस्तोत्रम् (जगदम्बिकाकृतं स्कन्दपुराणान्तर्गतम् अरुणाद्रिमयं लिङ्गं तुष्टाव जगदम्बिका)
content:
  english: jagadambikakritam arunacalashivastotram arunadrimayam lingam tushtava jagadambika | namaste
    vishvarupaya shonacalavapurbhrite || 21|| tejomayadrilingaya sarvapatatakanashine | brahmana vishnuna
    ca tvam dushparicchedyavaibhavah || 22|| agnirupo'pi sanchanto lokanugrahaklriptaye | shaktya ca tattvasanghatakarah
    kalanalakritih || 23|| adrishreshtharunadrisha rupalavanyavaridhe | vicitrarupametatte vedavedyasurarcitam
    || 24|| tejasam deva sarvesham bijabhutam nigadyase | divyam hi paramam tejastava deva maheshvara
    || 25|| yatpura brahmana drishtam vishnuna ca vicinvata | adya putasmi devesha tava sandarshanadaham
    || 26|| tejo darshaya me divyam sarvadoshaharam param || iti shriskandapurane maheshvarakhande
  devanagari: जगदम्बिकाकृतं अरुणाचलशिवस्तोत्रम् अरुणाद्रिमयं लिङ्गं तुष्टाव जगदम्बिका । नमस्ते विश्वरूपाय
    शोणाचलवपुर्भृते ॥ २१॥ तेजोमयाद्रिलिङ्गाय सर्वपाततकनाशिने । ब्रह्मणा विष्णुना च त्वं दुष्परिच्छेद्यवैभवः
    ॥ २२॥ अग्निरूपोऽपि सञ्छान्तो लोकानुग्रहक्लृप्तये । शक्त्या च तत्त्वसङ्घातकरः कालानलाकृतिः ॥ २३॥ अद्रिश्रेष्ठारुणाद्रीश
    रूपलावण्यवारिधे । विचित्ररूपमेतत्ते वेदवेद्यसुरार्चितम् ॥ २४॥ तेजसां देव सर्वेषां बीजभूतं निगद्यसे
    । दिव्यं हि परमं तेजस्तव देव महेश्वर ॥ २५॥ यत्पुरा ब्रह्मणा दृष्टं विष्णुना च विचिन्वता । अद्य पूतास्मि
    देवेश तव सन्दर्शनादहम् ॥ २६॥ तेजो दर्शय मे दिव्यं सर्वदोषहरं परम् ॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
