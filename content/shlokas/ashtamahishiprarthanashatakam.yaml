id: ashtamahishiprarthanashatakam
category: shataka
name:
  english: ashtamahishiprarthanashatakam
  devanagari: अष्टमहिषीप्रार्थनाशतकम्
content:
  english: madvase || 29|| vijnanakhyo manute purvo harireva ceti bhudevi | shriyamatha vidvanaryah sadaramaryam
    pravati purve tvam || 30|| purnimaya camayah bhasashcitram tithidvayam tvayi vai | shirasah parato
    darshah tatparataste supurnimendvasye || 31|| candradamritam pipsuh rahustam cakramacca cahasye |
    mukhadrigbhushacandrah baddhva tam capahanti girimadhye || 32|| nayanam sudarshanam te shankhah kanthah
    phani ca tava veni | paramam padayugalam te yane carane ca pakshirajo'sti || 33|| nayanam subharadvajo
    dhammillo naradashca tava matah | shukavadamodashite nanaratne maricirapi devi || 34|| avane shaktishcaste
    vakshojo kumbhasambhavo matah | valmikinibho nabhih vyaso'rbhaka eva nityama sthane || 35|| tadidam
    citram matah kancyantastetya ho bilam ceti | nedam putrakacitram harirubhayatrapi tatra sarve syat
    || 36|| kancikucakailaso matah shunyam tavantaratihasah | kailasavapi kancim na vishati cettam ca
    te'ntaradhiko'yam || 37|| harikarakamalavilase tava kucasuryo hi devi sucakase | harinayanapadmabhase
    tava mukhacandram prakashayatyase || 38|| dolikritavanamala malikritavidhivashandamaniyugala | yugalikritaharilila
    bala sindhoh prabhatu karakamala || 39|| padagrahanat tato'modata casmakamamva bahudhaptah | grihnamyanghri
    purnam turnam mam modayasva harigrihini || 40|| krishnah kacamaro'dhannayate minau tavadya bhasete
    | hariramba madhyamaste devo'ngi sambabhuva cangani || 41|| tava caranamikshya tara avadadhuranisham
    saroruhakare | avalokaya nayanaminduh taranim paryabhavacca kumudakshi || 42|| nicairvasavinidam moktum
    dinnaganagankavadya | nabheruccairmatah bhatah kucayoshca romarajyam te || 43|| tvamashritya visheshah
    romna rajyam vibhati savisheshah | iti vasukirapi canyo venim shishraya nanyavardhishnuh || 44|| akashe
    kancyaika tasyam hariramba yogisandrishyah | matardhatte sa harih girimahimibhamindumarkamabhradin
    || 45|| kucayugamastakamance drishtva roshaturo'pi haryakshah | nijagananamatihino sannidhimahatmyato
    hite'bhut sah || 46|| ekatra ca taranindu bhute nama tathapi harigrihini | ekatra rahucandravuparago
    naiva canurago'bhut || 47|| kamale candrotpattih candraduccaishca bhati candro'nyah | candradvayabhitah
    san rahurnicaih prayati pashcanme || 48|| tava bhujagavihagarajau shayane yane sada prathabhajau |
    bhavatam sa tayormatah shesho veshe visheshabhashasit || 49|| dhanyam kuru mam manye dhanyevase samudrahitakanye
    | manye lokavarenye dhanyaya tvam dhinayakam manye || 50|| harinakhabhitau karinavantardhyayeva kancuke
    trasi | jananivaiririraksha patya ghrinaya babhuva kim padme || 51|| shivapadayugalacchreshtham vidhipadadashakam
    ca mataraleshu | bahudhanadapuranyanye vishnoh padamekameva pativatte || 52|| upanayanam tava bhaktih
    upadeshta tava patishca me matah | upadishtam nama ca te bhavati subhiksham pradehi vaidehi || 53||
    tava bhaktya mantuktih bhavatu ca matastvayaiva kila bhuktih | gehe mukhya grihini vikhyatishcasya
    eva grihamukhyah || 54|| matah sagarakanye tava nanu vaktram sudhamshuriti manye | satyastveshastarkah
    no cet ka syat vidhavalokeccha || 55|| tava sannidhimahatmyadveshyo na tvishta eva te devi | nayanabje
    mukhacandre simhaduccaih prabhata iva mastau || 56|| matastava mahatmyaduccairnicaishca bhasamanebhau
    | vikrantau tau drishtva mrigapatimrigyah sa eva mudho'bhut || 57|| kantaste paramatmanantastalpastrayimayo
    yanam | amara nitya bhrityah satyam putro'smi yavanika maya || 58|| jakshat kridan shrutya rakshitumevamba
    rahasi kantena | jitva purusham svavasham kritva nastena palayasi camba || 59|| sapadi jatayormokshah
    tvattah patyuh sukandhare pakshah | sa mapitari katakshah tvatto bharta babhuva bahudakshah || 60||
    virah kila tava bharta vishvasmin yatra yatra yatase | varah kila tava pata cinta narayane hi kimu
    na syat || 61|| shyama va harini tvam hyacalatanayapi cancalasi tvam | janani marasya syah sukumarebhyashca
    naumi matastvam || 62|| kavijananutacarana va gurujananutapadukaiva me matah | punyajanairnritacarita
    punyajanadhvamsiniha bhurmatah || 63|| alakalankritavadana hyalakeshalankritabjamriducarana pulakankitasamhanana
    phalakalam nityameva kurutam me || 64|| shatadhritishatamativinute shatamakhamukhavinutalalitabahuvasate
    | atulitashatakritiphalite gatiriha bhavatiti me mano manute || 65|| shrishailajaghanabhaga shrirephalankritottamanga
    hi | astacalamadhyastha cakshoh saudarshanastu mam patum || 66|| harivatseccha va syat karivatseccheti
    devi kavigite | harivatseccha va syat mam karivarado yatha tatha pahi || 67|| ripusharapidam bhartuh
    varitumevasa urasi tatpurva | mama putrasya hi mahite purvastha varayamba vara
  devanagari: मद्वासे ॥ २९॥ विज्ञानाख्यो मनुते पूर्वो हरिरेव चेति भूदेवी । श्रियमथ विद्वानार्यः सादरमार्यां
    प्रवति पूर्वे त्वाम् ॥ ३०॥ पूर्णिमया चामायाः भासश्चित्रं तिथिद्वयं त्वयि वै । शिरसः परतो दर्शः तत्परतस्ते
    सुपूर्णिमेन्द्वास्ये ॥ ३१॥ चन्द्रादमृतं पिप्सुः राहुस्तं चाक्रमच्च चाहस्ये । मुखदृग्भूषाचन्द्रः बद्ध्वा
    तं चापहन्ति गिरिमध्ये ॥ ३२॥ नयनं सुदर्शनं ते शाङ्खः कण्ठः फणी च तव वेणी । परमं पदयुगलं ते याने चरणे
    च पक्षिराजोऽस्ति ॥ ३३॥ नयनं सुभरद्वाजो धम्मिल्लो नारदश्च तव मातः । शुकवदमोदाशीते नानारत्ने मरीचिरपि
    देवी ॥ ३४॥ अवने शक्तिश्चास्ते वक्षोजो कुम्भसम्भवो मातः । वल्मीकिनिभो नाभिः व्यासोऽर्भक एव नित्यमा
    स्थाने ॥ ३५॥ तदिदं चित्रं मातः काञ्च्यान्तस्तेत्य हो बिलं चेति । नेदं पुत्रकचित्रं हरिरुभयत्रापि तत्र
    सर्वे स्यात् ॥ ३६॥ काञ्चीकुचकैलासो मातः शून्यं तवान्तरतिहासः । कैलासावपि काञ्चीं न विशति चेत्तं च
    तेऽन्तरधिकोऽयम् ॥ ३७॥ हरिकरकमलविलासे तव कुचसूर्यो हि देवि सुचकासे । हरिनयनपद्मभासे तव मुखचन्द्रं प्रकाशयत्यासे
    ॥ ३८॥ डोलीकृतवनमाला मालीकृतविधिवशाण्डमणियुगला । युगलीकृतहरिलीला बाला सिन्धोः प्रभातु करकमला ॥ ३९॥
    पादग्रहणात् तातोऽमोदत चास्माकमम्व बहुधाप्तः । गृह्णाम्यङ्घ्री पूर्णं तूर्णं मां मोदयस्व हरिगृहिणि
    ॥ ४०॥ कृष्णः कचमारोऽधान्नयते मीनौ तवाद्य भासेते । हरिरम्ब मध्यमस्ते देवोऽङ्गी सम्बभूव चाङ्गानि ॥ ४१॥
    तव चरणमीक्ष्य तारा अवदधुरनिशं सरोरुहाकारे । अवलोकय नयनमिन्दुः तरणिं पर्यभवच्च कुमुदाक्षि ॥ ४२॥ नीचैर्वासविनिदां
    मोक्तुं दिङ्नागनागङ्कावद्य । नाभेरुच्चैर्मातः भातः कुचयोश्च रोमराज्यां ते ॥ ४३॥ त्वामाश्रित्य विशेषः
    रोम्णा राज्यां विभाति सविशेषः । इति वासुकिरपि चान्यो वेणीं शिश्राय नान्यवर्धिष्णुः ॥ ४४॥ आकाशे काञ्च्यैका
    तस्यां हरिरम्ब योगिसन्दृश्यः । मातर्धत्ते स हरिः गिरिमहिमिभमिन्दुमर्कमभ्रादीन् ॥ ४५॥ कुचयुगमस्तकमञ्चे
    दृष्ट्वा रोषातुरोऽपि हर्यक्षः । निजगणनामतिहीनो सन्निधिमाहात्म्यतो हितेऽभूत् सः ॥ ४६॥ एकत्र च तरणीन्दू
    भूते नामा तथापि हरिगृहिणि । एकत्र राहुचन्द्रावुपरागो नैव चानुरागोऽभूत् ॥ ४७॥ कमले चन्द्रोत्पत्तिः
    चन्द्रादुच्चैश्च भाति चन्द्रोऽन्यः । चन्द्रद्वयभीतः सन् राहुर्नीचैः प्रयाति पश्चान्मे ॥ ४८॥ तव भुजगविहगराजौ
    शयने याने सदा प्रथाभाजौ । भवतां स तयोर्मातः शेषो वेषे विशेषभाषासीत् ॥ ४९॥ धन्यं कुरु मां मान्ये धन्येवासे
    समुद्रहितकन्ये । मान्ये लोकवरेण्ये धन्याय त्वां धिनायकां मन्ये ॥ ५०॥ हरिनखभीतौ करिणावन्तर्ध्यायेव
    कञ्चुके त्रासि । जननीवैरिरिरक्षा पत्या घृणया बभूव किं पद्मे ॥ ५१॥ शिवपदयुगलाच्छ्रेष्ठं विधिपददशकं
    च मातरालेषु । बहुधनदपुराण्यन्ये विष्णोः पदमेकमेव पतिवत्ते ॥ ५२॥ उपनयनं तव भक्तिः उपदेष्टा तव पतिश्च
    मे मातः । उपदिष्टं नाम च ते भवति सुभिक्षां प्रदेहि वैदेहि ॥ ५३॥ तव भक्त्या मन्तूक्तिः भवतु च मातस्त्वयैव
    किल भुक्तिः । गेहे मुख्या गृहिणी विख्यातिश्चास्य एव गृहमुख्यः ॥ ५४॥ मातः सागरकन्ये तव ननु वक्त्रं
    सुधांशुरिति मन्ये । सत्यस्त्वेषस्तर्कः नो चेत् का स्यात् विधावलोकेच्छा ॥ ५५॥ तव सन्निधिमाहात्म्याद्वेष्यो
    न त्विष्ट एव ते देवि । नयनाब्जे मुखचन्द्रे सिंहादुच्चैः प्रभात इव मस्तौ ॥ ५६॥ मातस्तव माहात्म्यादुच्चैर्नीचैश्च
    भासमानेभौ । विक्रान्तौ तौ दृष्ट्वा मृगपतिमृग्यः स एव मूढोऽभूत् ॥ ५७॥ कान्तस्ते परमात्मानन्तस्तल्पस्त्रयीमयो
    यानम् । अमरा नित्या भृत्याः सत्यं पुत्रोऽस्मि यवनिका माया ॥ ५८॥ जक्षत् क्रीडन् श्रुत्या रक्षितुमेवाम्ब
    रहसि कान्तेन । जित्वा पुरुषं स्ववशं कृत्वा नस्तेन पालयसि चाम्ब ॥ ५९॥ सपदि जटायोर्मोक्षः त्वत्तः पत्युः
    सुकन्धरे पक्षः । सा मापितरि कटाक्षः त्वत्तो भर्ता बभूव बहुदक्षः ॥ ६०॥ वीरः किल तव भर्ता विश्वस्मिन्
    यत्र यत्र यातासे । वारः किल तव पाता चिन्ता नारायणे हि किमु न स्यात् ॥ ६१॥ श्यामा वा हरिणी त्वं ह्यचलातनयापि
    चञ्चलासि त्वम् । जननी मारस्य स्याः सुकुमारेभ्यश्च नौमि मातस्त्वाम् ॥ ६२॥ कविजननुतचरणा वा गुरुजननुतपादुकैव
    मे मातः । पुण्यजनैर्नृतचरिता पुण्यजनध्वंसिनीह भूर्मातः ॥ ६३॥ अलकालङ्कृतवदना ह्यलकेशालङ्कृताब्जमृदुचरणा
    पुलकाङ्कितसंहनना फलकालं नित्यमेव कुरुतां मे ॥ ६४॥ शतधृतिशतमतिविनुते शतमखमुखविनुतललितबहुवसते । अतुलितशतकृतिफलिते
    गतिरिह भवतीति मे मनो मनुते ॥ ६५॥ श्रीशैलजघनभागा श्रीरेफालङ्कृतोत्तमाङ्गा हि । अस्ताचलमध्यस्था चक्षोः
    सौदर्शनास्तु मां पातुम् ॥ ६६॥ हरिवत्सेच्छा वा स्यात् करिवत्सेच्छेति देवि कविगीते । हरिवत्सेच्छा वा
    स्यात् मां करिवरदो यथा तथा पाहि ॥ ६७॥ रिपुशरपीडां भर्तुः वारितुमेवास उरसि तत्पूर्वा । मम पुत्रस्य
    हि महिते पूर्वस्था वारयाम्ब वर
