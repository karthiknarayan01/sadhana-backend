id: ramatapinyupanishatsavyakhya
category: upanishad
name:
  english: ramatapinyupanishatsavyakhya
  devanagari: रामतापिन्युपनिषत्सव्याख्या
content:
  english: ganapatyeshu shaiveshu shaktasaureshvabhishtadah | vaishnaveshvapi sarveshu ramamantrah phaladhikah
    || 6|| ganapatyadimantreshu kotikotigunadhikah | mantrasteshvapyanayasaphalado'yam shadaksharah ||
    7|| shadaksharo'yam mantrah syat sarvaghaughanivaranah | mantraraja iti proktah sarveshamuttamottamah
    || 8|| kritam dine yadduritam pakshamasartuvarshajam | sarva dahati nihshesham tulacalamivanalah ||
    9|| brahmahatyasahasrani jnanajnanakritani ca | svarnasteyasurapanagurutalpayutani ca || 10|| kotikotisahasrani
    upapatakajanyapi | sarvanyapi pranashyanti ramamantranukirtanat || 11|| bhutapretapishacadyah kushmandabrahmarakshasah
    | duradeva pradhavanti ramamantraprabhavatah || 12|| aihalaukikamaishvaryam svargadyam paralaukikam
    | kaivalyam bhagavattvam ca mantro'yam sadhayishyati || 13|| gramyaranyapashughnatvam sancitam duritam
    ca yat | madyapanena yat papam tadapyashu vinashayet || 14|| abhakshyabhakshanotpannam mithyajnanasamudbhavam
    | sarvam viliyate ramamantrasyasyaiva kirtanat || 15|| shrotriyasvarnaharanadyacca papamupasthitam
    | ratnadeshcapaharena tadapyashu vinashayet || 16|| brahmanam kshatriyam vaishyam shudram hatva ca
    kilbisham | sancinoti naro mohadyadyattadapi nashayet || 17|| gatva'pi mataram mohadagamyashcaiva
    yoshitah | upasyanena mantrena ramastadapi nashayet || 18|| mahapatakapapishthasangatya sancitam ca
    yat | nashayettatkatha''lapashayanasanabhojanaih || 19|| pitrimatrivadhotpannam buddhipurvamagham
    ca yat | tadanushthanamatrena sarvametadviliyate || 20|| yat prayagaditirthoktaprayashcittashatairapi
    | naivapanodyate papam tadapyashu vinashayet || 21|| punyakshetreshu sarveshu kurukshetradishu svayam
    | buddhipurvamagham kritva tadapyashu vinashayet || 22|| kricchraistaptaparakadyairnanacandrayanairapi
    | papam ca napanodyam yat tadapyashu vinashayet || 23|| atmatulyasuvarnadidanairbahuvidhairapi | kincidapyaparikshinam
    tadapyashu vinashayet || 24|| avasthatritayeshvevam buddhipurvamagham ca yat | tanmantrasmaranenaiva
    nihshesham praviliyate || 25|| avasthatritayeshvevam mulabandhamagham ca yat | tattanmantropadeshena
    sarvametat pranashyati || 26|| abrahmabijadoshashca niyamatikramodbhavah | strinam ca purushanam ca
    mantrenanena nashitah || 27|| yeshu yeshvapi desheshu ramabhadra upasyate | durbhikshadibhayam teshu
    na bhavettu kadacana || 28|| shantah prasannavadano nakrodho bhaktavatsalah | anena sadrisho mantro
    jagatsvapi na vidyate || 29|| samyagaradhito ramah prasidatyeva satvaram | dadatyayushyamaishvaryamante
    vishnupadam ca yat || 30|| tadetadrica'bhyuktam
  devanagari: गाणपत्येषु शैवेषु शाक्तसौरेष्वभीष्टदः । वैष्णवेष्वपि सर्वेषु राममन्त्रः फलाधिकः ॥ ६॥ गाणपत्यादिमन्त्रेषु
    कोटिकोटिगुणाधिकः । मन्त्रस्तेष्वप्यनायासफलदोऽयं षडक्षरः ॥ ७॥ षडक्षरोऽयं मन्त्रः स्यात् सर्वाघौघनिवारणः
    । मन्त्रराज इति प्रोक्तः सर्वेषामुत्तमोत्तमः ॥ ८॥ कृतं दिने यद्दुरितं पक्षमासर्तुवर्षजम् । सर्व दहति
    निःशेषं तूलाचलमिवानलः ॥ ९॥ ब्रह्महत्यासहस्राणि ज्ञानाज्ञानकृतानि च । स्वर्णस्तेयसुरापानगुरुतल्पायुतानि
    च ॥ १०॥ कोटिकोटिसहस्राणि उपपातकजान्यपि । सर्वाण्यपि प्रणश्यन्ति राममन्त्रानुकीर्तनात् ॥ ११॥ भूतप्रेतपिशाचाद्याः
    कूश्माण्डब्रह्मराक्षसाः । दूरादेव प्रधावन्ति राममन्त्रप्रभावतः ॥ १२॥ ऐहलौकिकमैश्वर्यं स्वर्गाद्यं
    पारलौकिकम् । कैवल्यं भगवत्त्वं च मन्त्रोऽयं साधयिष्यति ॥ १३॥ ग्राम्यारण्यपशुघ्नत्वं सञ्चितं दुरितं
    च यत् । मद्यपानेन यत् पापं तदप्याशु विनाशयेत् ॥ १४॥ अभक्ष्यभक्षणोत्पन्नं मिथ्याज्ञानसमुद्भवम् । सर्वं
    विलीयते राममन्त्रस्यास्यैव कीर्तनात् ॥ १५॥ श्रोत्रियस्वर्णहरणाद्यच्च पापमुपस्थितम् । रत्नादेश्चापहारेण
    तदप्याशु विनाशयेत् ॥ १६॥ ब्राह्मणं क्षत्रियं वैश्यं शूद्रं हत्वा च किल्बिषम् । सञ्चिनोति नरो मोहाद्यद्यत्तदपि
    नाशयेत् ॥ १७॥ गत्वाऽपि मातरं मोहादगम्याश्चैव योषितः । उपास्यानेन मन्त्रेण रामस्तदपि नाशयेत् ॥ १८॥
    महापातकपापिष्ठसङ्गत्या सञ्चितं च यत् । नाशयेत्तत्कथाऽऽलापशयनासनभोजनैः ॥ १९॥ पितृमातृवधोत्पन्नं बुद्धिपूर्वमघं
    च यत् । तदनुष्ठानमात्रेण सर्वमेतद्विलीयते ॥ २०॥ यत् प्रयागादितीर्थोक्तप्रायश्चित्तशतैरपि । नैवापनोद्यते
    पापं तदप्याशु विनाशयेत् ॥ २१॥ पुण्यक्षेत्रेषु सर्वेषु कुरुक्षेत्रादिषु स्वयम् । बुद्धिपूर्वमघं कृत्वा
    तदप्याशु विनाशयेत् ॥ २२॥ कृच्छ्रैस्तप्तपराकाद्यैर्नानाचान्द्रायणैरपि । पापं च नापनोद्यं यत् तदप्याशु
    विनाशयेत् ॥ २३॥ आत्मतुल्यसुवर्णादिदानैर्बहुविधैरपि । किञ्चिदप्यपरिक्षीणं तदप्याशु विनाशयेत् ॥ २४॥
    अवस्थात्रितयेष्वेवं बुद्धिपूर्वमघं च यत् । तन्मन्त्रस्मरणेनैव निःशेषं प्रविलीयते ॥ २५॥ अवस्थात्रितयेष्वेवं
    मूलबन्धमघं च यत् । तत्तन्मन्त्रोपदेशेन सर्वमेतत् प्रणश्यति ॥ २६॥ आब्रह्मबीजदोषाश्च नियमातिक्रमोद्भवाः
    । स्त्रीणां च पुरुषाणां च मन्त्रेणानेन नाशिताः ॥ २७॥ येषु येष्वपि देशेषु रामभद्र उपास्यते । दुर्भिक्षादिभयं
    तेषु न भवेत्तु कदाचन ॥ २८॥ शान्तः प्रसन्नवदनो नक्रोधो भक्तवत्सलः । अनेन सदृशो मन्त्रो जगत्स्वपि न
    विद्यते ॥ २९॥ सम्यगाराधितो रामः प्रसीदत्येव सत्वरम् । ददात्यायुष्यमैश्वर्यमन्ते विष्णुपदं च यत् ॥
    ३०॥ तदेतदृचाऽभ्युक्तम्
