id: sarva-mangala-mangalye
category: stotra
name:
  english: Sarva Mangala Mangalye
  devanagari: सर्वमङ्गलमाङ्गल्ये
content:
  english: >-
    sarva-mangala-mangalye shive sarvartha-sadhike, sharanye tryambake
    gauri narayani namo 'stu te
  devanagari: >-
    सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि
    नारायणि नमोऽस्तु ते ॥
meaning:
  english: >-
    Salutations to you, O Narayani — auspiciousness itself among all
    auspicious things, who fulfills every aim, giver of refuge,
    three-eyed and radiant. Chanted by Brahma after the Goddess's
    victory over Mahishasura.
source_attribution:
  text_source: Devi Mahatmyam (Durga Saptashati), Chapter 11.1
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
