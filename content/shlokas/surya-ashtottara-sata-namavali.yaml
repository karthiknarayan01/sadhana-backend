id: surya-ashtottara-sata-namavali
category: stotram
name:
  english: Surya Ashtottara Sata Namavali
content:
  english: om arunaya namah | om sharanyaya namah | om karunarasasindhave namah | om asamanabalaya namah
    | om artarakshakaya namah | om adityaya namah | om adibhutaya namah | om akhilagamavedine namah |
    om acyutaya namah | om akhilajnaya namah || || om anantaya namah | om inaya namah | om vishvarupaya
    namah | om ijyaya namah | om indraya namah | om bhanave namah | om indiramandiraptaya namah | om vandaniyaya
    namah | om ishaya namah | om suprasannaya namah || || om sushilaya namah | om suvarcase namah | om
    vasupradaya namah | om vasave namah | om vasudevaya namah | om ujjvalaya namah | om ugrarupaya namah
    | om urdhvagaya namah | om vivasvate namah | om udyatkiranajalaya namah || || om hrishikeshaya namah
    | om urjasvalaya namah | om viraya namah | om nirjaraya namah | om jayaya namah | om urudvayabhavarupayuktasarathaye
    namah | om rishivandyaya namah | om rugghantre namah | om rikshacakracaraya namah | om rijusvabhavacittaya
    namah || || om nityastutyaya namah | om rikaramatrikavarnarupaya namah | om ujjvalatejase namah |
    om rikshadhinathamitraya namah | om pushkarakshaya namah | om luptadantaya namah | om shantaya namah
    | om kantidaya namah | om ghanaya namah | om kanatkanakabhushaya namah || || om khadyotaya namah |
    om lunitakhiladaityaya namah | om satyanandasvarupine namah | om apavargapradaya namah | om artasharanyaya
    namah | om ekakine namah | om bhagavate namah | om srishtisthityantakarine namah | om gunatmane namah
    | om ghrinibhrite namah || || om brihate namah | om brahmane namah | om aishvaryadaya namah | om sharvaya
    namah | om haridashvaya namah | om shauraye namah | om dashadiksamprakashaya namah | om bhaktavashyaya
    namah | om ojaskaraya namah | om jayine namah || || om jagadanandahetave namah | om janmamrityujaravyadhivarjitaya
    namah | om auccasthana samarudharathasthaya namah | om asuraraye namah | om kamaniyakaraya namah |
    om abjavallabhaya namah | om antarbahih prakashaya namah | om acintyaya namah | om atmarupine namah
    | om acyutaya namah || || om amareshaya namah | om parasmai jyotishe namah | om ahaskaraya namah |
    om ravaye namah | om haraye namah | om paramatmane namah | om tarunaya namah | om varenyaya namah
    | om grahanampataye namah | om bhaskaraya namah || || om adimadhyantarahitaya namah | om saukhyapradaya
    namah | om sakalajagatampataye namah | om suryaya namah | om kavaye namah | om narayanaya namah |
    om pareshaya namah | om tejorupaya namah | om shrim hiranyagarbhaya namah | om hrim sampatkaraya namah
    || || om aim ishtarthadaya namah | om anuprasannaya namah | om shrimate namah | om shreyase namah
    | om bhaktakotisaukhyapradayine namah | om nikhilagamavedyaya namah | om nityanandaya namah | om shri
    surya narayanaya namah ||
