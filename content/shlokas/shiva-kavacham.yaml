id: shiva-kavacham
category: stotram
name:
  english: Shiva Kavacham
content:
  english: '|| shriganeshaya namah || asya shrishivakavacastotramamtrasya brahma rishih shrisadashivarudro
    devata shrim him klim bijam shrisadashivaprityartha shivakavacastotrajape viniyogah || atha nyasah||
    om namo bhagavate jvalajjvalamaline om ham sarvashaktidhamne ishanatmane amgushthabhyam namah || om
    namo bhagavate jvalajjvalamaline omnam ri nityatriptidhamne tatpurushatmane tarjanibhyam namah ||
    om namo bhagavate jvalajjvalamaline amam ru anadishaktidhamne aghoratmane madhyamabhyam namah || om
    namo bhagavate jvalajjvalamaline om shira svatamtrashaktidhamne vamadevatmane anamikabhyam namah ||
    om namo bhagavate jvalajjvalamaline om vam rau anuprashaktidhamne sadyojatatmane kanishthikabhyam
    namah || om namo bhagavate jvalajjvalamaline om ya rah anadishaktidhamne sarvatmane karatalakaraprishthabhyam
    namah|| evam hridayadi || atha dhyanam || vajradashtam rinayanam kalakamthamaridamam | sahasrakaramatyugram
    vamde shambhumumapatim || 1|| athaparam sarvapuranaguhayam nih sheshapapaughaharam pavitram | jayapradam
    sarvavipatpramocanam vakshyami shaivam kavacam hitaya te || 2|| rishabha uvaca || namaskritva mahadevam
    vishvanyapinamishvaram | vakshye shivamayam varma sarvarakshakaram nrinam || 3|| shucau deshe samasino
    yathavatkalpitasanah| jitedriyo jitapranashcimtayecchivamanyayam || 4|| hpumdarikamtarasaniivishm
    svatejasa vyapranabhovakasham | atidriyam srikshmamanamtamadyam dhyayetparanamdamayam mahesham ||
    5|| dhyanavadhutakhilakarmabamdhashiram cidanamdanimagnacetah shadaksharanyasasamahitatma shaivena
    kuryatkavacena raksham || 6|| mam patu devo''khiladevatatma samsarakupe patitam gabhire tannama divyam
    varamatramulam dhunotu me sarvamagham hadistham || 7|| sarvatra mam rakshatu vishvamuratirajyotirmayanamdaghanashridatma
    | anoraniyanurushaktirekah sa ishvarah patu bhayadasheshat || 8 || yo bhusvarupena bibharti vishvam
    payatsa bhumergirisho''shtamartih| yo''pamsvarupena nrinam karoti samjivanam so''vatu mam jalebhyah
    || 9|| kalpavasane bhuvanani dagdhva sarvani yo nrityati bhurililah| sa kalarudro''vatu mam davagneravatyadibhiterakhilacca
    tapat ||10|| pradipravidyutkanakavabhaso vidyavarabhitikutarapanih| caturmukhastatpurushasinetrah
    pracyam sthitam rakshatu mamajasaram || 11 || kutharavedamkushapashashulakapaladhakkakshagunandadhanah|
    caturmukho nilarucikhinatrah payadaghoro dishi dakshinasyam || 12|| kudedushamkhasphatikavabhaso vedakshamalavaradabhayamkah|
    trayakshashcatarktra uruprabhavah sadyo''dhijato''vatu mam praticyam || 13|| varakshamala''bhayatamkahastah
    sarojakimjalkasamanavarnah| trilocanashcasacaturmukho mam payadudicyam dishi vamadevah ||94|| vedabhayeshtakushapashatakakapaladhakkakshakashulapanih|
    sitadyutih pamcamukho''vatanmamishana urdhvam paramaprakashah || 15|| mardhanamavyanmama camdramaulirbhalam
    mamavyadatha bhalanetrah| netre mamavyaddhaganetrahari nasam sada rakshatu vishvanathah || 16 || payaccharriti
    me shrutigitakirtih kapolamavyatsatatam kapali | vakram sada rakshatu pamcavaktro jihvam sada rakshatu
    vedajihah || 17|| kamtham girisho''vatu nilakamtha panidrayam patu pinakapanih| dormulamavyanmama
    dharmabahurvakshahsthalam dakshamakhamtako''vyat || 18 || mamodaram patu giridradhanva madhyam mamavyanmadanamtakari
    | herabatato mama patu nabhim payatkati dhurjatirishvaro me || 19|| urudrayam patu kuberamitro janudrayam
    me jagadishvaro''vyat | jamghayugam pumgavaketuravyat suravamdyapadah || 20|| maheshvarah patu dinadiyame
    mam madhyayame''vatu vamadevah| trilocanah patu tritiyayame vrishadhvajah patu dinamtyayame || 21||
    payanishadau shashishekharo mam gamgadhaso rakshatu mam nishithe | gauripatih patu nishavasane mrityumjayo
    rakshatu sarvakalam || 22|| amtahsthitam rakshatu shamkaro mam sthanuh sada patu bahih sthitam mam
    | tadamtare patu patih pashunam sadashivo rakshatu mam samamtat || 23|| tishthamtamavyaddhuvanaikanathah
    payadatrajatam pramathadhinathah| vedamtavedyo''vatu mam nishannam mamavyayah patu shivah shayanam
    || 24|| marageshu mam rakshatu nilakamtha shailadi durgeshu pusatrayarih| aranyavasadimahapravase
    payanmrigavyadha udarashaktih || 25|| kalpamtakaropapadatuprakopasphutatuyahasoccalitandakoshah |
    ghorarisenarnavadurnivarmahabhayadrakshatu virabhadrah || 26|| patyashvamatamgaghatavaruthasahasralakshayutakotibhishanam
    | akshauhininam shatamatatayinam chimdyanmrido ghorakutharadharaya || 27|| nihatu dasyunapralayanalarcimjvalavrishulam
    tripuramtakasya shardulasimharshavrikadirahimkharan samtrasayatvishadhanuh pinakah || 28 || duhsvapnaduhshakunadurgatidaurmanasyadurbhikshadarvyasanaduhsahaduryashamsi|
    utpatatapavishabhitimasadgrahartivyadhimshca nashayatu me jagatamadhishah || 29|| om namo bhagavate
    sadashivaya sakalatatvatmakaya sarvamamtrasvarupaya sarvayamtradhishthitaya sarvatatrasvarupaya sarvatatvaviduraya
    brahmadravatarine nilakamthaya parvatimanoharapriyaya somasuryagilocanaya bhasmoddhulitavigrahaya
    mahamanimukutadharanaya manikyabhushanaya sushtisthitipralayakalaraudravataraya dakshadhvaradhvamsakaya
    mahakalabhedanaya muladharikanilayaya tattvatitaya gamgadharaya sarvadevadhidevaya shadashrayaya sakalavedamtasaraya
    trivargasadhanaya anatakoivrahmamdanayakaya anamtavasuki shamkhakulikapadmahapadyetyashtamahanagakulabhushanaya
    pranavasvarupaya cidakashaya akashadiksvarupaya grahanakshatramaline sakalaya kalamkarahitaya sakalalokaikaktra
    sakalalokekarabhatre sakalalokaikasamhatra sakalalokaikagurave sakalalokekasakshine sakalanigamaguhyaya
    sakalavedamtaparagaya sakalalokaikavarapradaya sakakalokekashamkaraya shashamkashekharaya shashcatanijavasaya
    nirabhasaya niramayaya nirmalaya nirlaubhaya nirmadaya nishcimtaya nirahamkaraya niramkushaya nishkalamkaya
    nirgunaya nishkamaya nirupaplavaya niravadyaya nirataraya nishkaranaya niramtakaya nishprapacaya nihsamgaya
    niddvaya niradharaya niragaya nishkrodhaya nirmalaya nishpapaya nirbhayaya nirvikalpaya nirbhadaya
    nishkariyaya nistulaya nihsamshayaya niramjanaya nirupamavibhavaya nityashuddhanuddhaparipurnasaccidanamdadrayaya
    paramashamtasvarupaya tejorupaya tejomayaya jaya jaya radra maharaudra bhadravatara mahabhairava kalabhairava
    kalpamtabherava kapalamaladharakhatvamga khadgacarmapashamkusha damarushulacapabanagadashaktibhimdipalatomaramusalamudarara
    pashaparighashumdi shataghnicakradyayudhabhishanakara sahasramukha dashtakaralavadana vikararihasavispharitatrahmamdamamdala
    nagedrakudala nagedrahara nagedravalaya nagedracarmadhara mrityumjaya tyabaka tripuramtaka vishvarupa
    virupaksha vishcaishvara vrishabhavahana vishavibhushana vishvatomukha sarvato raksha raksha mam ||
    jvala jvala mahamrityumapamrityubhayam nashaya nashaya corabhayamutsadayotsadaya vishasarpabhayam
    shamaya shamaya coranmasya masya mama shatrunuccatayoccayaya trishulena vidaraya vidaraya kutharena
    bhimdhi bhimdhi khadgena chimdhi chimdhi khatvamgena vipothaya vipothaya musalena nishpeshaya nishpeshaya
    banaih samtadaya samtadaya rakshamsi bhishaya bhishayasheshabhutani vidravaya vidravaya kushmamdavetalamaricabrahmarakshasaganan
    samtrasaya samtrasaya mamabhayam kuru kuru vitrastam mamashrasayashvasaya narakamahabhayanmamuddharoddhara
    samjivaya samjivaya kshucridbhyam mamapyayayapyayaya duhkhaturam mamanamdayanamdaya shivakavacena
    mamacchadayacchadaya mrityumjaya vrayabaka sadashiva namaste namaste || rishabha uvaca || ityetatkavacam
    shaivam varadam vyahritam maya | sarvabadhaprashamanam rahasyam sarvadehinam || 30|| yah sada dharayenmartyah
    shavam kavacamuttamam | na tasya jayate kvapi bhayam shambhoranugrahat || 31|| kshinayuh paptamritayurva
    maharogahato''piva | sadyah sukhamavapnoti dirghamayushca vimdati || 32|| sarvadaridriyashamanam saumamgalyavivardhanam
    | yo dhatte kavacam shauvam sa devairapi pujyate || 33|| mahapatakasamghatermucyate copapatakaih |
    dehamte muktimapnoti shivavarmanubhavatah || 34|| tvamapi shraddhaya vatsa shaivam kavacamuttamam
    | dharayasva maya dattam sadyah shreyo hyavapsyasi || 35|| suta uvaca || ityuktva rishabho yogi tasmai
    parthivasunave| dadau shamkham maharavam khadgam carinishridanam || 36 || punashca bhasma sammamtya
    tadamgam parito''sprishat | gajanam shatsahasrasya trigunasya balam dadau || 37|| bhasmaprabhavatsampraptanalaishavaryadhritismritih
    | sa rajaputrah shushubhe sharadarkam iva shriya || 38 || tamaha pramjalim bhuyah sa yogi nripanamdanam
    | esha khadgo maya dattastapomamtranubhavitah || 39|| shitadharamimam khadgam yasmai darshayase sphutam
    | sa sadyo priyate shatruh sakshanmrityurapi svayam || 40|| asya shamkhasya nidim ye shranvamti tavahitah
    | te murcchitah patishyamti nyastashastra vicetanah || 41 || khadgashankhavimau divyau parasainyavinashinau
    | atmasainye svapakshanam shauryatejovivardhanau ||42|| etayoshca prabhavena shaivena kavacena ca
    dvishatsahasranaganam balena mahatapi ca || 43|| bhasmadharanasamarthyacchatrusainyam vijeshyasi |
    prapya simhasanam pitra goptasi prithivimimam || 44|| iti bhadrayusham samyaganushasya samatrikam
    | tabhyam sampujitah so''tha yogi svairagatiryayau || 45|| iti shriskamdapurane brahmottarakhamda
    shivakavacastotram sampurnam'
  devanagari: ॥ श्रीगणेशाय नमः ॥ अस्य श्रीशिवकवचस्तोत्रमंत्रस्य ब्रह्मा ऋषिः श्रीसदाशिवरुद्रो देवता श्रीं
    हीं क्लीं बीजम् श्रीसदाशिवप्रीत्यर्थ शिवकवचस्तोत्रजपे विनियोगः ॥ अथ न्यासः॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने
    ॐ हां सर्वशक्तिधाम्ने ईशानात्मने अंगुष्ठाभ्यां नमः ॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐनं रि नित्यतृप्तिधाम्ने
    तत्पुरुषात्मने तर्जनीभ्यां नमः ॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने अमं रु अनादिशक्तिधाम्ने अघोरात्मने
    मध्यमाभ्यां नमः ॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ शिर स्वतंत्रशक्तिधाम्ने वामदेवात्मने अनामिकाभ्यां
    नमः ॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ वां रौ अनुप्रशक्तिधाम्ने सद्योजातात्मने कनिष्ठिकाभ्यां नमः
    ॥ ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ य॑ रः अनादिशक्तिधाम्ने सर्वात्मने करतलकरपृष्ठाभ्यां नमः॥ एवं हृदयादि
    ॥ अथ ध्यानम् ॥ वज्रद॑ष्टं ्रिनयनं कालकंठमरिदमम् । सहस्रकरमत्युग्रं वंदे शंभुमुमापतिम् ॥ १॥ अथापरं
    सर्वपुराणगुहयं निः शेषपापौघहरं पवित्रम् । जयप्रदं सर्वविपत्प्रमोचनं वक्ष्यामि शैवं कवचं हिताय ते ॥
    २॥ ऋषभ उवाच ॥ नमस्कृत्वा महादेवं विश्वन्यापिनमीश्वरम् । वक्ष्ये शिवमयं वर्म सर्वरक्षाकरं नृणाम् ॥
    ३॥ शुचौ देशे समासीनो यथावत्कल्पितासनः। जितेद्रियो जितप्राणश्चिंतयेच्छिवमन्ययम् ॥ ४॥ ह्पुंडरीकांतरसनििविष्ं
    स्वतेजसा व्याप्रनभोवकाशम् । अतीद्रियं सृक्ष्ममनंतमाद्यं ध्यायेत्परानंदमयं महेशम् ॥ ५॥ ध्यानावधूताखिलकर्मबंधश्िरं
    चिदानंदनिमग्नचेताः षडक्षरन्याससमाहितात्मा शैवेन कुर्यात्कवचेन रक्षाम् ॥ ६॥ मां पातु देवोऽखिलदेवतात्मा
    संसारकूपे पतितं गभीरे तन्नाम दिव्यं वरमत्रमूलं धुनोतु मे सर्वमघं हदिस्थम् ॥ ७॥ सर्वत्र मां रक्षतु
    विश्वमूरतिरज्योतिर्मयानंदघनश्रिदात्मा । अणोरणीयानुरुशक्तिरेकः स ईश्वरः पातु भयादशेषात् ॥ ८ ॥ यो भूस्वरूपेन
    बिभर्ति विश्वं पायात्स भूमेर्गिरिशोऽष्टमर्तिः। योऽपांस्वरूपेण नृणां करोति संजीवनं सोऽवतु मां जलेभ्यः
    ॥ ९॥ कल्पावसाने भुवनानि दग्ध्वा सर्वाणि यो नृत्यति भूरिलीलः। स कालरुद्रोऽवतु मां दवाग्नेरवात्यादिभीतेरखिलाच्च
    तापात् ॥१०॥ प्रदीप्रविद्युत्कनकावभासो विद्यावराभीतिकुटारपाणिः। चतुर्मुखस्तत्पुरुषस्िनेत्रः प्राच्यां
    स्थितं रक्षतु मामजसरम् ॥ ११ ॥ कुठारवेदांकुशपाशशूलकपालढक्काक्षगुणान्दधानः। चतुर्मुखो नीलरुचिखिनत्रः
    पायादघोरो दिशि दक्षिणस्याम् ॥ १२॥ कुदेदुशंखस्फटिकावभासो वेदाक्षमालावरदाभयांकः। त्रयक्षश्चतर्क्त्र
    उरुप्रभावः सद्योऽधिजातोऽवतु मां प्रतीच्याम् ॥ १३॥ वराक्षमालाऽभयटंकहस्तः सरोजकिंजल्कसमानवर्णः। त्रिलोचनश्चासचतुर्मुखो
    मां पायादुदीच्यां दिशि वामदेवः ॥९४॥ वेदाभयेष्टकुशपाशटककपालढक्काक्षकशूलपाणिः। सितद्युतिः पंचमुखोऽवतान्मामीशान
    ऊर्ध्वं परमप्रकाशः ॥ १५॥ मर्धानमव्यान्मम चंद्रमौलिर्भालं ममाव्यादथ भालनेत्रः। नेत्रे ममाव्याद्धगनेत्रहारी
    नासां सदा रक्षतु विश्वनाथः ॥ १६ ॥ पायाच्छरृती मे श्रुतिगीतकीर्तिः कपोलमव्यात्सततं कपाली । वक्रं सदा
    रक्षतु पंचवक्त्रो जिह्वां सदा रक्षतु वेदजिहः ॥ १७॥ कंठं गिरीशोऽवतु नीलकंठ पाणिद्रयं पातु पिनाकपाणिः।
    दोर्मूलमव्यान्मम धर्मबाहूर्वक्षःस्थलं दक्षमखांतकोऽव्यात् ॥ १८ ॥ ममोदरं पातु गिरीद्रधन्वा मध्यं ममाव्यान्मदनांतकारी
    । हेर॑बतातो मम पातु नाभिं पायात्कटि धूर्जटिरीश्वरो मे ॥ १९॥ ऊरुद्रयं पातु कुबेरमित्रो जानुद्रयं मे
    जगदीश्वरोऽव्यात् । जंघायुगं पुंगवकेतुरव्यात् सुरवंद्यपादः ॥ २०॥ महेश्वरः पातु दिनादियामे मां मध्ययामेऽवतु
    वामदेवः। त्रिलोचनः पातु तृतीययामे वृषध्वजः पातु दिनांत्ययामे ॥ २१॥ पायानिशादौ शशिशेखरो मां गंगाधसो
    रक्षतु मां निशीथे । गौरीपतिः पातु निशावसाने मृत्युंजयो रक्षतु सर्वकालम् ॥ २२॥ अंतःस्थितं रक्षतु शंकरो
    मां स्थाणुः सदा पातु बहिः स्थितं माम् । तदंतरे पातु पतिः पशूनां सदाशिवो रक्षतु मां समंतात् ॥ २३॥ तिष्ठंतमव्याद्धुवनैकनाथः
    पायादत्रज॑तं प्रमथाधिनाथः। वेदांतवेद्योऽवतु मां निषण्णं मामव्ययः पातु शिवः शयानम् ॥ २४॥ मरगेषु मां
    रक्षतु नीलकंठ शैलादि दुर्गेषु पुसत्रयारिः। अरण्यवासादिमहाप्रवासे पायान्मृगव्याध उदारशक्तिः ॥ २५॥ कल्पांतकारोपपदटुप्रकोपस्फुटाटूयहासोच्चलिताण्डकोशः
    । घोरारिसेनार्णवदुर्निवार्महाभयाद्रक्षतु वीरभद्रः ॥ २६॥ पत्यश्वमातंगघटावरूथसहस्रलक्षायुतकोटिभीषणम्
    । अक्षौहिणीनां शतमाततायिनां छिंद्यान्मृडो घोरकुठारधारया ॥ २७॥ निह॑तु दस्यूनप्रलयानलार्चिंज्वलव्रिशूलं
    त्रिपुरांतकस्य शार्दूलसिंहर्षवृकादिरहिंखरान् संत्रासयत्वीशधनुः पिनाकः ॥ २८ ॥ दुःस्वप्नदुःशकुनदुर्गतिदौर्मनस्यदुर्भिक्षदर्व्यसनदुःसहदुर्यशांसि।
    उत्पाततापविषभीतिमसद्ग्रहार्तिव्याधींश्च नाशयतु मे जगतामधीशः ॥ २९॥ ॐ नमो भगवते सदाशिवाय सकलतत्वात्मकाय
    सर्वमंत्रस्वरूपाय सर्वयंत्राधिष्ठिताय सर्वतत्रस्वरूपाय सर्वतत्वविदूराय ब्रह्मद्रावतारिणे नीलकंठाय
    पार्वतीमनोहरप्रियाय सोमसूर्यागिलोचनाय भस्मोद्धूलितविग्रहाय महामणिमुकुटधारणाय माणिक्यभूषणाय सूष्टिस्थितिप्रलयकालरौद्रावताराय
    दक्षाध्वरध्वंसकाय महाकालभेदनाय मूलाधरिकनिलयाय तत्त्वातीताय गंगाधराय सर्वदेवाधिदेवाय षडाश्रयाय सकलवेदांतसाराय
    त्रिवर्गसाधनाय अन॑तकोिव्रह्मांडनायकाय अनंतवासुकि शंखकुलिकपद्महापद्येत्यष्टमहानागकुलभूषणाय प्रणवस्वरूपाय
    चिदाकाशाय आकाशदिक्स्वरूपाय ग्रहनक्षत्रमालिने सकलाय कलंकरहिताय सकललोकैकक्त्र सकललोकेकरभत्रे सकललोकैकसंहत्र
    सकललोकैकगुरवे सकललोकेकसाक्षिणे सकलनिगमगुह्याय सकलवेदांतपारगाय सकललोकैकवरप्रदाय सककलोकेकशंकराय शशांकशेखराय
    शाश्चतनिजावासाय निराभासाय निरामयाय निर्मलाय निर्लौभाय निर्मदाय निश्चिंताय निरहंकाराय निरंकुशाय निष्कलंकाय
    निर्गुणाय निष्कामाय निरुपप्लवाय निरवद्याय निरतराय निष्कारणाय निरांतकाय निष्प्रपचाय निःसंगाय निद्द्वाय
    निराधाराय नीरागाय निष्क्रोधाय निर्मलाय निष्पापाय निर्भयाय निर्विकल्पाय निर्भदाय निष्करियाय निस्तुलाय
    निःसंशयाय निरंजनाय निरुपमविभवाय नित्यशुद्धनुद्धपरिपूर्णसच्चिदानंदाद्रयाय परमशांतस्वरूपाय तेजोरूपाय
    तेजोमयाय जय जय रद्र महारौद्र भद्रावतार महाभैरव कालभैरव कल्पांतभेरव कपालमालाधरखट्वांग खड्गचर्मपाशांकुश
    डमरुशूलचापबाणगदाशक्तिभिंदिपालतोमरमुसलमुदरर पाशपरिघशुंडी शतघ्नीचक्राद्यायुधभीषणकर सहस्रमुख द॑ष्टाकरालवदन
    विकराृहासविस्फारितत्रह्मांडमंडल नागेद्रकुडल नागेद्रहार नागेद्रवलय नगेद्रचर्मधर मृत्युंजय त्य॑बक त्रिपुरांतक
    विश्वरूप विरूपाक्ष विश्चैश्वर वृषभवाहन विषविभूषण विश्वतोमुख सर्वतो रक्ष रक्ष मां ॥ ज्वल ज्वल महामृत्युमपमृत्युभयं
    नाशय नाशय चोरभयमुत्सादयोत्सादय विषसर्पभयं शमय शमय चोरान्मास्य मास्य मम शत्रूनुच्चाटयोच्चायय त्रिशूलेन
    विदारय विदारय कुठारेण भिंधि भिंधि खड्गेन छिंधि छिंधि खट्वांगेन विपोथय विपोथय मुसलेन निष्पेषय निष्पेषय
    बाणैः संताडय संताडय रक्षांसि भीषय भीषयाशेषभूतानि विद्रावय विद्रावय कूष्मांडवेतालमारीचब्रह्मरक्षसगणान्
    संत्रासय संत्रासय मामभयं कुरु कुरु वित्रस्तं मामाश्रासयाश्वासय नरकमहाभयान्मामुद्धरोद्धर संजीवय संजीवय
    क्षुचृड्भ्यां मामाप्याययाप्यायय दुःखातुरं मामानंदयानंदय शिवकवचेन मामाच्छादयाच्छादय मृत्युंजय व्रय॑बक
    सदाशिव नमस्ते नमस्ते ॥ ऋषभ उवाच ॥ इत्येतत्कवचं शैवं वरदं व्याहृतं मया । सर्वबाधाप्रशमनं रहस्यं सर्वदेहिनाम्
    ॥ ३०॥ यः सदा धारयेन्मर्त्यः शवं कवचमुत्तमम् । न तस्य जायते क्वापि भयं शंभोरनुग्रहात् ॥ ३१॥ क्षीणायुः
    प्ाप्तमृतयुर्वा महारोगहतोऽपिवा । सद्यः सुखमवाप्नोति दीर्घमायुश्च विंदति ॥ ३२॥ सर्वदारिद्रियशमनं सौमंगल्यविवर्धनम्
    । यो धत्ते कवचं शौवं स देवैरपि पूज्यते ॥ ३३॥ महापातकसंघातेर्मुच्यते चोपपातकैः । देहांते मुक्तिमाप्नोति
    शिववर्मानुभावतः ॥ ३४॥ त्वमपि श्रद्धया वत्स शैवं कवचमुत्तमम् । धारयस्व मया दत्तं सद्यः श्रेयो ह्यवाप्स्यसि
    ॥ ३५॥ सूत उवाच ॥ इत्युक्त्वा ऋषभो योगी तस्मै पार्थिवसूनवे। ददौ शंखं महारावं खड्गं चारिनिषृदनम् ॥ ३६
    ॥ पुनश्च भस्म संमंत्य तदंगं परितोऽस्पृशत् । गजानां षट्सहस्रस्य त्रिगुणस्य बलं ददौ ॥ ३७॥ भस्मप्रभावात्संप्राप्तनलैशवर्यधृतिस्मृतिः
    । स राजपुत्रः शुशुभे शरदर्कं इव श्रिया ॥ ३८ ॥ तमाह प्रांजलिं भूयः स योगी नृपनंदनम् । एष खड्गो मया
    दत्तस्तपोमंत्रानुभावितः ॥ ३९॥ शितधारमिमं खड्गं यस्मै दर्शयसे स्फुटम् । स सद्यो प्रियते शत्रुः साक्षान्मृत्युरपि
    स्वयम् ॥ ४०॥ अस्य शंखस्य निदिं ये श्रण्वंति तवाहिताः । ते मूर्च्छिताः पतिष्यंति न्यस्तशस्त्रा विचेतनाः
    ॥ ४१ ॥ खड्गशङ्खाविमौ दिव्यौ परसैन्यविनाशिनौ । आत्मसैन्ये स्वपक्षाणां शौर्यतेजोविवर्धनौ ॥४२॥ एतयोश्च
    प्रभावेण शैवेन कवचेन च द्विषट्सहस्रनागानां बलेन महतापि च ॥ ४३॥ भस्मधारणसामर्थ्याच्छत्रुसैन्यं विजेष्यसि
    । प्राप्य सिंहासनं पित्र गोप्तासि पृथिवीमिमाम् ॥ ४४॥ इति भद्रायुषं सम्यगनुशास्य समातृकम् । ताभ्यां
    संपूजितः सोऽथ योगी स्वैरगतिर्ययौ ॥ ४५॥ इति श्रीस्कंदपुराणे ब्रह्मोत्तरखंड शिवकवचस्तोत्रं संपूर्णम्
