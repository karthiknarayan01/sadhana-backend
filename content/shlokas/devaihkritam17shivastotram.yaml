id: devaihkritam17shivastotram
category: stotram
name:
  english: devaihkritam17shivastotram
  devanagari: देवैःकृतं१७शिवस्तोत्रम्
content:
  english: devaih kritam 17 shivastotram deva ucuh | bhagavankena margena pujaniyo'si bhutale | kasyadhikarah
    pujayam vaktumarhasi tattvatah || 26|| tatah sasmitamalokya devim devavaro harah | svarupam darshayamasa
    ghoram suryatmakam param || 27|| sarvaishvaryagunopetam sarvatejomayam param | shaktibhirmurtibhishcangairgrahairdevaishca
    samvritam || 28|| ashtabahum caturvaktramardhanarikamadbhutam | drishtvaivamadbhutakaram deva vishnupurogamah
    || 29|| buddhva divakaram devam devim caiva nishakaram | pancabhutani sheshani tanmayam ca caracaram
    || 30|| evamuktva namashcakrustasmai carghyam pradaya vai || 31|| stotram|sinduravarnaya sumandalaya
    suvarnavarnabharanaya tubhyam | padmabhanetraya sapankajaya brahmendranarayanakaranaya || 32|| suratnapurnam
    sasuvarnatoyam sukunkumadyam sakusham sapushpam | pradattamadaya sahemapatram prashastamarghyam bhagavanprasida
    || 33|| namashshivaya shantaya saganayadihetave | rudraya vishnave tubhyam brahmane suryamurtaye ||
    34|| yashshivam mandale saure sampujyaiva samahitah | pratarmadhyahnasayahne pradadyadarghyamuttamam
    || 35|| pranamedva pathedetanchlokanchrutimukhaniman | na tasya durllabham kincidbhaktashcenmucyate
    dridham || 36|| iti shivapurane vayaviyasamhitayam uttarakhande ashtamadhyayantargatam devaih kritam
    shivastotram samaptam | shivapurana | vayaviyasamhita | uttarabhaga 2 | adhyaya 8
  devanagari: देवैः कृतं १७ शिवस्तोत्रम् देवा ऊचुः । भगवन्केन मार्गेण पूजनीयोऽसि भूतले । कस्याधिकारः पूजायां
    वक्तुमर्हसि तत्त्वतः ॥ २६॥ ततः सस्मितमालोक्य देवीं देववरो हरः । स्वरूपं दर्शयामास घोरं सूर्यात्मकं
    परम् ॥ २७॥ सर्वैश्वर्यगुणोपेतं सर्वतेजोमयं परम् । शक्तिभिर्मूर्तिभिश्चाङ्गैर्ग्रहैर्देवैश्च संवृतम्
    ॥ २८॥ अष्टबाहुं चतुर्वक्त्रमर्धनारीकमद्भुतम् । दृष्ट्वैवमद्भुताकारं देवा विष्णुपुरोगमाः ॥ २९॥ बुद्ध्वा
    दिवाकरं देवं देवीं चैव निशाकरम् । पञ्चभूतानि शेषाणि तन्मयं च चराचरम् ॥ ३०॥ एवमुक्त्वा नमश्चक्रुस्तस्मै
    चार्घ्यं प्रदाय वै ॥ ३१॥ स्तोत्रम्।सिन्दूरवर्णाय सुमण्डलाय सुवर्णवर्णाभरणाय तुभ्यम् । पद्माभनेत्राय
    सपङ्कजाय ब्रह्मेन्द्रनारायणकारणाय ॥ ३२॥ सुरत्नपूर्णं ससुवर्णतोयं सुकुङ्कुमाद्यं सकुशं सपुष्पम् । प्रदत्तमादाय
    सहेमपात्रं प्रशस्तमर्घ्यं भगवन्प्रसीद ॥ ३३॥ नमश्शिवाय शान्ताय सगणायादिहेतवे । रुद्राय विष्णवे तुभ्यं
    ब्रह्मणे सूर्यमूर्तये ॥ ३४॥ यश्शिवं मण्डले सौरे सम्पूज्यैव समाहितः । प्रातर्मध्याह्नसायाह्ने प्रदद्यादर्घ्यमुत्तमम्
    ॥ ३५॥ प्रणमेद्वा पठेदेताञ्छ्लोकाञ्छ्रुतिमुखानिमान् । न तस्य दुर्ल्लभं किञ्चिद्भक्तश्चेन्मुच्यते दृढम्
    ॥ ३६॥ इति शिवपुराणे वायवीयसंहितायां उत्तरखण्डे अष्टमाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम्
    । शिवपुराण । वायवीयसंहिता । उत्तरभाग २ । अध्याय ८
