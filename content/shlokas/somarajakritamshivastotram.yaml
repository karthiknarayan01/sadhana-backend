id: somarajakritamshivastotram
category: stotram
name:
  english: somarajakritamshivastotram
  devanagari: सोमराजकृतंशिवस्तोत्रम्
content:
  english: somarajakritam shivastotram pratyakshah somarajasya vrishasana umapatih | sashtangam pranipatyoccairjaya
    shambho namo'stu te || 17|| jaya shankara papaharaya namo jaya ishvara te jagadisha namah | jaya vasukibhushanadhara
    namo jaya shulakapaladharaya namah || 18|| jaya andhakadehavinasha namo jaya danavavrindavadhaya namah
    | jaya nishkalarupa sakalaya namo jaya kala kamadahaya namah || 19|| jaya mecakakanthadharaya namo
    jaya sukshmaniranjanashabda namah | jaya adiranadirananta namo jaya shankara kinkaramisha bhaja ||
    20|| iti shriskandapurane avantyakhande revakhande pancashashtitama
  devanagari: सोमराजकृतं शिवस्तोत्रम् प्रत्यक्षः सोमराजस्य वृषासन उमापतिः । साष्टाङ्गं प्रणिपत्योच्चैर्जय
    शम्भो नमोऽस्तु ते ॥ १७॥ जय शङ्कर पापहराय नमो जय ईश्वर ते जगदीश नमः । जय वासुकिभूषणधार नमो जय शूलकपालधराय
    नमः ॥ १८॥ जय अन्धकदेहविनाश नमो जय दानववृन्दवधाय नमः । जय निष्कलरूप सकलाय नमो जय काल कामदहाय नमः ॥
    १९॥ जय मेचककण्ठधराय नमो जय सूक्ष्मनिरञ्जनशब्द नमः । जय आदिरनादिरनन्त नमो जय शङ्कर किङ्करमीश भज ॥ २०॥
    इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे पञ्चषष्टितमा
meaning: {}
