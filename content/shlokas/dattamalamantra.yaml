id: dattamalamantra
category: mantra
name:
  english: dattamalamantra
  devanagari: दत्तमालामन्त्र
content:
  english: om namo mahasiddhaya svaha | iti dattatreyopanishadi shridattamala mantrah sampurnah | gujarathi
    shabdarthasahitah rigvediya ricah | i̱dam vishnu̱rvi ca̭krame tre̱dha ni da̭dhe pa̱dam
  devanagari: ॐ नमो महासिद्धाय स्वाहा । इति दत्तात्रेयोपनिशदी श्रीदत्तमाला मन्त्रः सम्पूर्णः । गुजराथी
    शब्दार्थसहितः ऋग्वेदीय ऋचाः । इ॒दं विष्णु॒र्वि च॑क्रमे त्रे॒धा नि द॑धे प॒दम्
meaning: {}
source_attribution:
