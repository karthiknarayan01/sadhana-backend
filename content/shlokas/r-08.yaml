id: r-08
category: veda
name:
  english: r 08
  devanagari: र् ०८
content:
  english: 05 atri̭na̱m stoma̭madrivo ma̱haskri̭dhi̱ piba̱ soma̱m mada̭ya̱ kam sha̭takrato | yam tḙ bha̱gamadha̭raya̱nvishva̭h
    seha̱nah prita̭na u̱ru jraya̱h sama̭psu̱jinma̱rutva̭~ indra satpate || 8
  devanagari: ०५ अत्री॑णां॒ स्तोम॑मद्रिवो म॒हस्कृ॑धि॒ पिबा॒ सोमं॒ मदा॑य॒ कं श॑तक्रतो । यं ते॑ भा॒गमधा॑रय॒न्विश्वाः॑
    सेहा॒नः पृत॑ना उ॒रु ज्रयः॒ सम॑प्सु॒जिन्म॒रुत्वा॑ँ इन्द्र सत्पते ॥ ८
