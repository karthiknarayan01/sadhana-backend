name:
  english: gayatrimantrah
  devanagari: गायत्रीमन्त्रः
content:
  english: gayatrimantrah om bhurbhuvah svah tatsaviturvarenyam bhargo devasya dhimahi| dhiyo yo nah pracodayat||
  devanagari: गायत्रीमन्त्रः ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यम् भर्गो देवस्य धीमहि। धियो यो नः प्रचोदयात्॥
