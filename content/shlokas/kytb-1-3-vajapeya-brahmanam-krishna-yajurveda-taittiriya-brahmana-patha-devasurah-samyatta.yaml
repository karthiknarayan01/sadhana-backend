id: kytb-1-3-vajapeya-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-devasurah-samyatta
category: stotram
name:
  english: KYTB 1.3 Vajapeya Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Devasurah Samyatta
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake tritiyah prapathakah shri gurubhyo namah
    | harih om || anuvakam punaradheyasheshah ajyabhagayorvisheshah devasura ya~tta asann | te deva vijaya
    mupayantah | agnishomayo nnyadadhata | idamu no bhavishyati | yadi no jeshyantiti | tenagnishoma kramatam
    | te deva vijitya | agnishoma thsannam | tasya vibhaktibhi manvavindann | tamaghnann | tasya yatha
    rvyagrihnata | te graha abhavann | ta ngrahatvam | yasyaivam vi~dusho graha grihyante | tasya tveva
    grihitah || nana mpunaradheye kuryat | yadana mpunaradheye kuryat | vyriddhameva tat || stanunapatamido
    barhi vajyabhagau syatam || ana bhavata ityahuh | yadubhava gneyavanvancaviti | agnaye pavamanayottara
    tpavamanaya | tenajya bhagah | tena saumyah || budhanvatyagneya mbodhayati | tadrigeva tat || agninyaktah
    patni sam ya~janamricah syuh | tena mbhavati || ekadha tejasvini mupaitityahuh | sainamishvara pradaha
    iti || neti bruyat | prajananam va~ agnih | prajanana mevopaititi || kritayaju ssambhrita sambhara
    ityahuh || ssambharah | na yajuh karyamiti || atho khalu | sabhrintya eva sabhamrah | karyam ya~juh
    | punaradheyasya samriddhyai || tenopagmshu pracarati | eshya iva va eshah | ya radheyah | yathopagmshu
    nashtamicchati || || tadrigeva tat || uccai thsrijati | yatha nashtam vi~tva prahayamiti | tadrigeva
    tat || ekadha tejasvini ndevatamupaitityahuh | sainamishvara pradaha iti | tattatha nopaiti | prayajanuyajeshveva
    vibhaktih kuryat | yathapurva mupaititi || tadahuh | vyriddham tkriyata iti || neti bruyat | agni
    ya~jati | agnimuttama gneyam | tena samriddha sambhritasambhara ityahu vajapeyasya vidhih deva vai
    yathadar ya~jnanaharanta | yo 'gnishtomam | ya ukthya 'tiratram | te sahaiva sarve vajapeya mapashyann
    | te | anyo nyasmai natishthanta | ahamanena yaja iti | te 'bruvann | ajimasya dhavameti || nnajimadhavann
    | ta rudajayat | tenayajata | sa svara 'bravit | mamanena yajayeti | tenendra jyam | atishthantasmai
    jyaishthyaya || vajapeyena yajate | gacchati svara jyam | agragm samanana mparyeti | tishthante 'smai
    jyaishthyaya || sa va esha bra hmanasya caiva rajanyasya ca yajnah || tam va~japeya ityahuh | vajapyo
    va eshah | vajagg hyetena deva aiphsann || somo vai vajapeyah | yo vai somam 'sya vaji jayate || annam
    vai~ vajapeyah | ya evam nnado jayate || brahma vai vajapeyah | ya evam ve~da | atti brahmana 'sya
    brahma jayate || || vagvai vajasya prasavah | ya evam ve~da | karoti vaca virya va~ca gacchati | apivatim
    rdevebhyo yajnan vyadishat | sa atman vajapeya ndeva abruvann | esha vava yajnah | ya 'trastviti |
    tebhya eta ujjitih prayacchat || ta va eta ujjitayo vyakhyayante | yajnasya sarvatvaya | devatana
    manirbhagaya || deva vai brahmanashcannasya ca shamalamapa t | sa gatha narashaggsya bhavat | yadannasya
    | sa sura dgayatashca mattasya ca na pratigrihya tpratigrihniyat | shamala mpratigrihniyat || sarva
    va etasya vaco 'varuddhah | yo vajapeyayaji | ya prithivyam 'gnau ya rathantare | ya 'ntarikshe ya
    vayau ya vamadevye | ya divi ya ''ditye ya brihati | ya 'phsu yaushadhishu ya vanaspatishu || tasma
    dvajapeyayajyartvijinah | sarva hyasya vaco 'varuddhah || ''rtvijina ekam ca tasyagrahavisheshah deva
    vai yadanyai ryajnasya navarundhata | tadatigrahyai varundhata | tadatigrahyana matigrahyatvam ||
    yadatigrahya grihyante ryajnasya navarundhe | tadeva tairatigrihya varundhe || panca grihyante | pankto
    yajnah | yavaneva yajnah | tamaptva 'varundhe || || sarva aindra bhavanti | ekadhaiva yajamana indriya
    ndadhati || saptadasha prajapatya graha grihyante | saptadashah prajapatih | prajapate || ekayarca
    grihnati | ekadhaiva yajamane virya ndadhati || somagrahag nmanushyanam | ya | paramenaivasma annadyenavara
    mavarundhe || somagraha ngrihnati | brahmano va eta thsomah | brahmana eva tejasa tejo yajamane dadhati
    | suragraha ngrihnati | annasya va etacchamalam | ya || annasyaiva shamalena shamalam dapahanti ||
    somagrahag shca grihnati | puman vai somah | stri sura nmithunam | mithunamevasya ta dyajne karoti
    prajananaya | atmanameva somagrahai ssprinoti | jayagm sura grahaih | tasma dvajapeyayajyamushmi~lloke
    striyagm sambhavati | vajapeya bhijitagg hyasya || || purve somagraha grihyante | apare suragrahah
    | purokshagm somagrahanth sadayati | pashcadakshagm suragrahan | papavasyasasya vidhrityai || esha
    vai yajamanah | ya thsomah | annagm sura shca vyatishajati | annadyenaivainam mma bhadrena prinktetyaha
    | annam vai~ bhadram | annadyenaivainagm sagmsrijati || annasya va etacchamalam | ya | papmèva khalu
    vai shamalam | papmana va enametacchamalena vyatishajati | ya shca vyatishajati || vipricah stha vi
    ma papmana prinktetyaha | papmanaivainagm shamalena vyavartayati || dvajapeyayaji puto meddhyo dakshinyah
    || pramu ddravati somagrahaih | amumeva tai mabhijayati | pratyankhsura grahaih | imameva tai mabhijayati
    || pratishthanti somagrahaih | yavadeva satyam | tena suyate || vajasridbhyah suragrahan haranti |
    anritenaiva vishagm sagmsrijati || hiranyapatra ndadati | madhavyo 'saniti || ekadha brahmana upa
    harati | ekadhaiva yajamana ayustejo dadhati || ssaptadasha brahmavadino vadanti | nagnishtomo nokthyah
    | na shodashi natiratrah | atha kasma dvajapeye sarve yajnakratavo 'varuddhyanta iti | pashubhiriti
    bruyat || agneya mpashumalabhate | agnishtomameva tenavarundhe | aindragnenokthya m | aindrena shodashinah
    stotram | sarasvatya sstotram | etavanto vai yajnakratavah | ta varundhe || atmanameva sprino tyagnishtomena
    | pranapana vukthyena | viryagm shodashinah stotrena | vaca matiratrena | praja sstotrena | imameva
    lokamabhi jayatyagnishtomena | antariksha lo~kagm shodashinah stotrena | devayananeva patha aroha
    tyatiratrena | nakagm rohati brihata sstotrena | teja evatma ndhatta agneyena pashuna | ojo balamaindragnena
    | indriya maindrena | vacagm sarasvatya | ubhaveva devaloka ncabhijayati marutya vashaya || saptadasha
    prajapatya npashunalabhate | saptadashah prajapatih || || prajapateraptyai || shyama ekarupa bhavanti
    | evamiva hi prajapati nuthsrijati || maruto yajnamajighagmsa nprajapateh | tebhya eta va~shamalabhata
    | tayaivaina nashamayat || marutya pracarya | etan thsanjnapayet | maruta eva shamayitva || || etaih
    pracarati | yajnasyaghataya || ekadha vapa juhoti | ekadevatya hi | ete | atho ekadhaiva yajamane
    virya ndadhati || naivarena saptadashasharave tpurodasha hyete | atho pashunameva chidramapidadhati
    || sarasvatyottamaya pracarati | vag vai sarasvati | tasma prajapataveva yajna mpratishthapayati |
    prajapatir hi vak || apannadati bhavati | tasma mantarikshamukthyena tamaya pracarati shat ca njuhoti
    karmanah karmanah purasta dvajapeyasya purvam ya~daparamiti | savitriprasuta eva yathapurva nkarmani
    karoti || savane savane juhoti | akramanameva ta ya~jamanah kurute | suvargasya lokasya samashtyai
    || vacaspati rvacamadya svadati na ityaha | vagvai devana 'nnamasit | vacamevasma annagg svadayati
    || || indrasya vajro 'si vartraghna iti rathamupavaharati vijityai || vajasya nu prasave matara mmahimityaha
    | yaccaiveyam | yaccasyamadhi | tadeva varundhe | atho tasminnevobhaye 'bhishicyate || aphsvantara
    mritamaphsu bheshajamityashva npalpulayati | aphsu va ashvasya tritiya mpravishtam | tadanuvenanvavaplavate
    | yadaphsu palpulayati || || yadevasyaphsu pravishtam | tadevavarundhe || bahu va ashvo mupagacchati
    | yadaphsu palpulayati | meddhyanevaina n karoti || vayurva tva manurva tvetyaha | eta va eta ndevata
    agre ashvamayunjann | tabhirevainan yunakti | savasyojjityai || yajusha yunakti vyavrittyai || nna
    padashuhemanniti samma shti | meddhyanevaina n karoti | atho stautyevainanajigm sarishyatah || vishnu
    kraman kramate | vishnureva bhutvema~lloka nabhijayati || vaishvadevo vai rathah | ankau nyankavabhito
    ratham ya~vityaha | ya eva devata rathe pravishtah | tabhya eva namaskaroti | atmano 'sya ratho bhavati
    | ya evam rathadhavanam devasyahagm savituh prasave brihaspatina vajajita vaja njeshamityaha | savitriprasuta
    eva brahmana vajamujjayati || devasyahagm savituh prasave brihaspatina vajajita var nnakagm ruheyamityaha
    | savitriprasuta eva brahmana var nnakagm rohati || catvale rathacakra nnimitagm rohati | ato va angirasa
    uttama lo~kamayann | sakshadeva yajamana shtayati | vajro vai rathah | vajrenaiva disho || vajinagm
    sama gayate | annam vai~ vajah | anname vavarundhe || vaco var npravishat | saisha vag vanaspatishu
    vadati | ya dundubhau | tasma ssarva vacoti vadati || dundubhin thsamaghnanti | parama va esha vak
    || || ya dundubhau | paramayaiva vaca varundhe | atho vaca eva var shma yajamano 'varundhe || indraya
    vacam njapayatendro vajamajayi dityaha | esha va etar hindrah | yo yajate | yajamana eva vajamujjayati
    || saptadasha pravyadhanaji ndhavanti | saptadashagg mbhavati | saptadasha saptadasha diyante || ||
    saptadashah prajapatih | prajapate 'si saptirasi vajyasityaha | agnirva arva ssaptih | adityo vaji
    | etabhirevasmai devatabhi yu~nakti || prashtivahinam yu~nakti | prashtivahi vai devarathah | devarathamevasmai
    yunakti || ngacchatetyaha | suvargo vai lokah kashtha | suvargameva lokam ndhavanti || pranco dhavanti
    | pramiva hi suvargo lokah || catasribhiranu mantrayate | catvari chandagmsi | chandobhirevaina lokaccyavante
    | ya aji ndhavanti | udanca avartante | asmadeva tena lokannayanti || rathavimocaniya njuhoti pratishthityai
    || a ma vajasya prasavo jagamyadityaha | annam vai~ vajah | annamevavarundhe || yathalokam va~ eta
    ujjayanti | ya aji va~jasridbhyah prayacchati | yameva te vajam lo~kamujjayanti | ta varundhe || ekadha
    brahmana upaharati | ekadhaiva yajamane virya ndadhati || deva va oshadhishvajimayuh | ta brihaspati
    rudajayat | sa nivaranniravrinita | tannivarana nnivaratvam || naivarashcaru | paramenaivasma annadye
    mannadyamavarundhe || saptadashasharavo bhavati | saptadashah prajapatih | prajapate || kshire bhavati
    | rucamevasmin nbhavati meddhyatvaya || barhaspatyo va esha devataya || || yo vajapeyena yajate |
    barhaspatya esha caruh || ashva ghrapayati | yameva te vajam lo~kamujjayanti | tamevavarundhe || ajijipata
    vanaspataya indram vi~mucyaddhvamiti dundubhin vimuncati | yameva te vajam ndundubhaya ujjayanti |
    tameva yuparohanam tarpyam mparidhapayati | yajno vai tarpyam | yajnenaivainagm samardhayati | darbhamaya
    mparidhapayati | pavitram vai~ darbhah | punatyevaina 'varuruthsate | yo vajapeyena yajate | oshadhayah
    khalu vai vajah | ya ruddhyai || jaya ehi suvo rohavetyaha | patniya evaisha yajnasya 'navacchityai
    || saptadasha ratniryupo bhavati | saptadashah prajapatih | prajapateraptyai m | na va ete vrihayo
    na yavah || evamiva hi prajapati ssamriddhyai | atho amumevasmai lokamannavanta rveshtayati | esha
    vai yajamanah | yadyupah | sarvadevatyam va~sah | sarvabhirevaina ssamardhayati | atho akramanameva
    tathsetum ya~jamanah kurute | suvargasya lokasya samashtyai || dvadasha vajaprasaviyani juhoti ||
    va~thsarameva prinati | atho sam va~thsaramevasma upa dadhati | suvargasya lokasya samashtyai || dashabhih
    kalpai rohati | nava vai purushe pranah | nabhirdashami | prananeva yathasthana nkalpayitva | suvargam
    lo~kameti | etavadvai purushasya svam || pranah | yavadevasyasti | tena saha suvargam lo~kameti ||
    suvardevagm aganmetyaha | suvargameva lokameti | amrita abhumetyaha | amritamiva hi suvargo lokah
    | prajapateh praja abhumetyaha | prajapatyo va ayam lo~kah | asmadeva tena lokannaiti || prajetyaha
    | ashishamevaita va~ iyam | annadyenaivainagm samardhayanti | ushai rghnanti | ete hi sakshadanna
    mannadyena samardhayanti || purasta || purastaddhi praticina || shirshato ghnanti | shirshato hyannamadyate
    || digbhyo ghnanti | digbhya evasma annadya mavarundhate || ishvaro va esha param pradaghah | yo yupagm
    rohati || hiranyamaddhya vai~ hiranyam | amritagm suvargo lokah || || amrita eva suvarge loke prati
    tishthati || shatamana mbhavati | shatayuh purusha shshatendriyah | ayushyevendriye prati tishthati
    || pushtyai va eta drupam | yadaja | tri npari prajayate || bastajina maddhyava rohati | pushtyameva
    prajanane pratitishthati || abhishekashca saptanna homanjuhoti | sapta va annani | yavantyevannani
    | tanyevavarundhe | sapta gramya oshadhayah | saptaranyah | ubhayisha mavaruddhyai || annasya nnasya
    juhoti | annasyannasya navaruddhasyashniyat || || avaruddhena vyriddhyeta | sarvasya samavadaya juhoti
    | anavaruddha syavaruddhyai || audumbarena sruvena juhoti | urgva anna mudumbarah | urja evannadyasyavaruddhyai
    || devasya tva savituh prasava ityaha | savitri prasuta evaina mbrahmana devatabhi rabhishincati ||
    annasyannasyabhishincati | annasyannasyavaruddhyai || mabhishincati | purastaddhi 'bhishincati | shirshato
    hyannamadyate || amukhadanvava sravayati | mukhata evasma annadya ndadhati || agnestva samra jyenabhishincamityaha
    | esha va agne mabhishincati | indrasya tva samra jyenabhishincamityaha || nnetena dadhati | brihaspate
    mityaha | brahma vai devana mbrihaspatih | brahmanaivaina mabhishincati || somagrahag vadaniyani cartvigbhya
    upa haranti | amumeva tai nkaroti | suragrahag navadaniyani ca vajasridbhyah | imameva tai nkaroti
    | atho ubhayi shvevabhishicyate || vimatha nkurvate vajasritah || || indriyasyavaruddhyai || aniruktabhih
    pratassavane stuvate | aniruktah prajapatih | prajapateraptyai rmaddhyandine | annam vai~ vajah |
    annameva varundhe | shipivishtavatibhi stritiyasavane | yajno vai vishnuh | pashava shshipih | yajna
    eva pashushu prati tishthati || brihadantya mbhavati | antamevainagg shriyai gamayati || dannasyannasya
    varuddhya indrasya tva samra jyenabhishinca mityaha ntvetyaha | praja vai nrin | prajanamevaitena
    suyate | drushadamityaha | vanaspatayo vai dru | vanaspatinamevai tena suyate | bhuvanasada mityaha
    | yada vai vasiya nbhavati | bhuvanamaganniti vai tamahuh | bhuvanamevaitena gacchati || mityaha |
    apamevaitena ghritasya suyate | vyomasada mityaha | yada vai vasiya nbhavati | vyomaganniti vai tamahuh
    | vyomaivaitena gacchati || prithivishada mityaha | eshamevaitena lokanagm suyate | tasma ncana pratyavarohati
    | apiva hi devatanagm suyate mityaha | yadavai vasiya nbhavati | nakamaganniti vai tamahuh | nakamevaitena
    gacchati || ye grahah pancajanina ityaha | pancajanana mevaitena suyate || apagm rasamudvayasa mityaha
    | apamevaitena rasasya suyate | suryarashmigm samabhrita mityaha sashukratvaya || shapurnamasabrahmanasheshah
    indro vritragm hatva | asura mpratyagacchat | te pitarah purvedyu ragacchann | pitrin ndevah punarayacanta
    | tame bhyo na punaradaduh | te vri~namahai | atha vah punardasyamah | asmabhyameva pu rvedyuh kriyata
    iti || bhyah punaradaduh | tasma pitribhyah purvedyuh kriyate | ya tpitribhyah purvedyuh karoti |
    pitribhya eva ta nnishkriya yajamanah pratanute || somaya pitripitaya svadha nama ityaha | piturevadhi
    somapithamava rundhe | na hi pita pramiyamana ahaisha somapitha iti | indriyam vai~ somapithah | indriyameva
    somapithamava ndriyena dvitiya njayamabhyashnute || mpura vajashravasa vidamakrann | tasma tte dvedve
    jaye abhya ve~da | abhi dvitiya njayamashnute || agnaye kavyavahanaya svadha nama ityaha | ya eva
    pitrinamagnih | ta mprinati || tisra ahuti rjuhoti || trirnidadhati || shat || shadva ritavah | rituneva
    prinati || tushni madadhati | asti va hi shashtha riturna va npritan | manushyah 'nu prapipate | tisra
    ahuti rjuhoti | trirnidadhati | shat thsampadyante | shadva ritavah || || ritavah khalu vai devah
    pitarah | rituneva deva nprinati | tanpritan | manushyah 'nu prapipate || sakridacchinna rbhavati
    | sakridiva hi pitarah || trirnidadhati | tritiye va ito loke pitarah | taneva prinati || paramavartate
    || || hlika hi pitarah || òshmano ste | ushmabhaga hi pitarah || brahmavadino vadanti | prashyam shniyat
    | janyamannamadyat | pramayuka ssyat | yanna pra || pitribhya avrishcyeta | avaghreyameva | tanneva
    prashita nnevaprashitam || viram va~ vai pitarah prayanto haranti | viram nchinatti | haranabhaga
    hi pitarah | pitrineva niravadayate || uttara ayushi loma chindita | pitrinag || namaskaroti | namaskaro
    hi pitrinam || namo vah pitaro rasaya | namo vah pitara shshushmaya | namo vah pitaro jivaya | namo
    vah pitara | namo vah pitaro manyave | namo vah pitaro ghoraya | pitaro namo vah | ya etasmin ~loke
    stha || nte nu | ya etasmi~lloke stha | yuya va~sishtha bhuyasta | ye va~sishtho bhuyasamityaha |
    vasishtha pitribhyah karoti || esha vai manushyanam va~ itare yajnah | tena va eta tpitriloke carati
    || ya tpitribhyah karoti | sa i shvarah prametoh | prajapatyayarca punaraiti | yajno vai prajapatih
    | yajnenaiva saha punaraiti | na pramayuko bhavati || pitriloke va eta tpitribhyah karoti | sa i tprajapatyayarca
    punaraiti | prajapatirevaina ntata unnayati | nartimarcchati yajamanah || padyante shadva ritavo tpitribhyah
    karoti panca ca devasura agnishomayo r deva vai yatha dar r brahmavadino nagnishtomo na tvendro vritragm
    hatva dasha indriyamevasmin hlika hi pitarah pancashashtih || harih om || || krishna yajurvediya taittiriya
    brahmane prathamashtake tritiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके तृतीयः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं पुनराधेयशेषः आज्यभागयोर्विशेषः दे॒वा॒सु॒रा यँ॑त्ता आसन्न् । ते दे॒वा वि॑ज॒य मु॑प॒यन्तः॑
    । अ॒ग्नीषोम॑यो न्न्य॑दधत । इ॒दमु॑ नो भविष्यति । यदि॑ नो जे॒ष्यन्तीति॑ । तेना॒ग्नीषोमा॒ क्रामताम् ।
    ते दे॒वा वि॒जित्य॑ । अ॒ग्नीषोमा॒ थ्स॑न्नम् । तस्य॒ विभ॑क्तीभि मन्व॑विन्दन्न् । तम॑घ्नन्न् । तस्य॑
    यथा र्व्य॑गृह्णत । ते ग्रहा॑ अभवन्न् । त ङ्ग्रह॒त्वम् । यस्यै॒वं विँ॒दुषो॒ ग्रहा॑ गृ॒ह्यन्ते । तस्य॒
    त्वे॑व गृ॑ही॒ताः ॥ नाना म्पुनरा॒धेये॑ कुर्यात् । यदना म्पुनरा॒धेये॑ कु॒र्यात् । व्यृ॑द्धमे॒व तत् ॥
