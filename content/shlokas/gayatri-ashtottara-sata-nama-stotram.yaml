id: gayatri-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Gayatri Ashtottara Sata Nama Stotram
content:
  english: tarunadityasankasha sahasranayanojjvala | vicitramalyabharana tuhinacalavasini || || varadabhayahastabja
    revatiranivasini | pranityayavisheshajna yantrakritavirajita || || bhadrapadapriya caiva govindapathagamini
    | devarshiganasamstutya vanamalavibhushita || || syandanottamasamstha ca dhirajimutanisvana | mattamatangagamana
    hiranyakamalasana || || dinajanoddharanirata yogini yogadharini | natanatyaikanirata pranavadyaksharatmika
    || || coracarakriyasakta daridryacchedakarini | yadavendrakulodbhuta turiyapathagamini || || gayatri
    gomati ganga gautami garudasana | geyaganapriya gauri govindapadapujita || || gandharvanagaragara
    gauravarna ganeshvari | gadashraya gunavati gahvari ganapujita || || gunatrayasamayukta gunatrayavivarjita
    | guhavasa gunadhara guhya gandharvarupini || || gargyapriya gurupada guhalingangadharini | savitri
    suryatanaya sushumnanadibhedini || || suprakasha sukhasina sumati ssurapujita | sushuptyavastha sudati
    sundari sagarambara || || sudhamshubimbavadana sustani suvilocana | sita sattvashraya sandhya suphala
    suvidhayini || ssuvasa sushroni samsararnavatarini | samaganapriya sadhvi sarvabharanabhushita ||
    || vaishnavi vimalakara mahendri mantrarupini | mahalakshmi rmahamaya maheshvari || || mohini madanakara
    madhusudanacodita | minakshi madhuravasa nagendratanaya uma || || trivikramapadakranta trisvara trivilocana
    | suryamandalamadhyastha candramandalasamsthita || || vahnimandalamadhyastha vayumandalasamsthita
    | vyomamandalamadhyastha cakrini cakrarupini || || kalacakravitanastha candramandaladarpana | jyotsnatapasuliptangi
    mahamarutavijita || || sarvamantrashraya dhenuh papaghni parameshvari | namaste'stu mahalakshmi rmahasampattidayini
    || || namaste karunamurte namaste bhaktavatsale | gayatryah prajapedyastu namnamashtottaram shatam
    || || tasya punyaphalam vaktum brahmanapi na shakyate | iti shrigayatryashtottarashatanamastotram
    sampurnam |
  devanagari: तरुणादित्यसङ्काशा सहस्रनयनोज्ज्वला । विचित्रमाल्याभरणा तुहिनाचलवासिनी ॥ ॥ वरदाभयहस्ताब्जा
    रेवातीरनिवासिनी । प्रणित्ययविशेषज्ञा यन्त्राकृतविराजित ॥ ॥ भद्रपादप्रिया चैव गोविन्दपथगामिनी । देवर्षिगणसंस्तुत्या
    वनमालाविभूषिता ॥ ॥ स्यन्दनोत्तमसंस्था च धीरजीमूतनिस्वना । मत्तमातङ्गगमना हिरण्यकमलासना ॥ ॥ दीनजनोद्धारनिरता
    योगिनी योगधारिणी । नटनाट्यैकनिरता प्रणवाद्यक्षरात्मिका ॥ ॥ चोरचारक्रियासक्ता दारिद्र्यच्छेदकारिणी
    । यादवेन्द्रकुलोद्भूता तुरीयपथगामिनी ॥ ॥ गायत्री गोमती गङ्गा गौतमी गरुडासना । गेयगानप्रिया गौरी गोविन्दपदपूजिता
    ॥ ॥ गन्धर्वनगरागारा गौरवर्णा गणेश्वरी । गदाश्रया गुणवती गह्वरी गणपूजिता ॥ ॥ गुणत्रयसमायुक्ता गुणत्रयविवर्जिता
    । गुहावासा गुणाधारा गुह्या गन्धर्वरूपिणी ॥ ॥ गार्ग्यप्रिया गुरुपदा गुहलिङ्गाङ्गधारिणी । सावित्री सूर्यतनया
    सुषुम्नानाडिभेदिनी ॥ ॥ सुप्रकाशा सुखासीना सुमति स्सुरपूजिता । सुषुप्त्यवस्था सुदती सुन्दरी सागराम्बरा
    ॥ ॥ सुधांशुबिम्बवदना सुस्तनी सुविलोचना । सीता सत्त्वाश्रया सन्ध्या सुफला सुविधायिनी ॥ स्सुवासा सुश्रोणी
    संसारार्णवतारिणी । सामगानप्रिया साध्वी सर्वाभरणभूषिता ॥ ॥ वैष्णवी विमलाकारा महेन्द्री मन्त्ररूपिणी
    । महलक्ष्मी र्महामाया महेश्वरी ॥ ॥ मोहिनी मदनाकारा मधुसूदनचोदिता । मीनाक्षी मधुरावासा नगेन्द्रतनया
    उमा ॥ ॥ त्रिविक्रमपदाक्रान्ता त्रिस्वरा त्रिविलोचना । सूर्यमण्डलमध्यस्था चन्द्रमण्डलसंस्थिता ॥ ॥ वह्निमण्डलमध्यस्था
    वायुमण्डलसंस्थिता । व्योममण्डलमध्यस्था चक्रिणी चक्ररूपिणी ॥ ॥ कालचक्रवितानस्था चन्द्रमण्डलदर्पणा ।
    ज्योत्स्नातपासुलिप्ताङ्गी महामारुतवीजिता ॥ ॥ सर्वमन्त्राश्रया धेनुः पापघ्नी परमेश्वरी । नमस्तेऽस्तु
    महालक्ष्मी र्महासम्पत्तिदायिनि ॥ ॥ नमस्ते करुणामूर्ते नमस्ते भक्तवत्सले । गायत्र्याः प्रजपेद्यस्तु
    नाम्नामष्टोत्तरं शतम् ॥ ॥ तस्य पुण्यफलं वक्तुं ब्रह्मणापि न शक्यते । इति श्रीगायत्र्यष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ।
