id: vasudharanamadharanistotram
category: stotram
name:
  english: vasudharanamadharanistotram
  devanagari: वसुधारानामधारणीस्तोत्रम्
content:
  english: ni sarvasattvanam bodhyangakritashekhari | dhyana dhirmuktisampanna advayadvayabhavini || 16||
    sarvarthasadhani bhadra strirupamitavikrama | darshini buddhamarganam nashtamargapradarshini || 17||
    vagishvari mahashantirgoptri dhatri dhanaprada | strirupadharini siddha yogini yogajeshvari || 18||
    manohari mahakrantih saubhagyapriyadarshini | sarthavahakripadrishtih sarvatathagatatmaki || 19||
    namaste'stu mahadevi sarvasattvarthadayini | namaste divyarupi ca vasudhara namo'stu te || 20|| ashtottarashatam
    nama trikalam yam pathet puman | prapnoti niyatam siddhimipsitarthamanorathan || 21|| yadajnanakritam
    papamanantaryasudarunam | tatsarvam kshapayatyashu smaranat sa
  devanagari: नी सर्वसत्त्वानां बोध्यङ्गकृतशेखरी । ध्याना धीर्मुक्तिसम्पन्ना अद्वयद्वयभाविनी ॥ १६॥ सर्वार्थसाधनी
    भद्रा स्त्रीरूपामितविक्रमा । दर्शिनी बुद्धमार्गाणां नष्टमार्गप्रदर्शिनी ॥ १७॥ वागीश्वरी महाशान्तिर्गोप्त्री
    धात्री धनप्रदा । स्त्रीरूपधारिणी सिद्धा योगिनी योगजेश्वरी ॥ १८॥ मनोहरी महाक्रान्तिः सौभाग्यप्रियदर्शिनी
    । सार्थवाहकृपादृष्टिः सर्वताथागतात्मकी ॥ १९॥ नमस्तेऽस्तु महादेवी सर्वसत्त्वार्थदायिनी । नमस्ते दिव्यरूपी
    च वसुधारा नमोऽस्तु ते ॥ २०॥ अष्टोत्तरशतं नाम त्रिकालं यं पठेत् पुमान् । प्राप्नोति नियतं सिद्धिमीप्सितार्थमनोरथान्
    ॥ २१॥ यदज्ञानकृतं पापमानन्तर्यसुदारुणम् । तत्सर्वं क्षपयत्याशु स्मरणात् स
