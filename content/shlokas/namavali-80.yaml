id: namavali-80
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: hanumadashtottarashatanamavalih 3 om parijatapriyaya namah | yogine | hanumate | nriharipriyaya
    | plavagendraya | pingalakshaya | shighragamine | dridhavrataya | shankhacakravarabhitipanaye | anandadayakaya
    | sthayine | vikramasampannaya | ramadutaya | mahayashase | saumitrijivanakaraya | lankavikshobhakarakaya
    | udadhikramanaya | sitashokahetuharaya | haraye | baline namah | 20 om rakshasasamhartre namah |
    dashakanthamadapahaya | buddhimate | nairritavadhukanthasutravidarakaya | sugriva sacivaya | bhimaya
    | bhimasenasahodaraya | savitravidyasamsevine | caritarthaya | mahodayaya | vasavabhishtadaya | bhavyaya
    | hemashailanivasavate | kimshukabhaya | agrayatanave | rijuromne | mahamataye | mahakramaya | vanacaraya
    | sthirabuddhaye namah | 40 om abhishumate namah | simhikagarbhanirbhettre | lankanivasinam bhettre
    | akshashatruvinighnaya | raksho'matyabhayavahaya | viraghne | mriduhastaya | padmapanaye | jatadharaya
    | sarvapriyaya | sarvakamapradaya | pramshumukhaya | shucaye | vishuddhatmane | vijvaraya | satavate
    | pataladharaya | bharatapremajanakaya | ciravasase | mahokshadhrishe namah | 60 om mahastrabandhanasahaya
    namah | brahmacarine | yatishvaraya | mahaushadhopahartre | vrishaparvane | vrishodaraya | suryopalalitaya
    | svamine | parijatavatamsakaya | sarvapranadharaya | anantaya | sarvabhutadigaya | manave | raudrakritaye
    | bhimakarmane | bhimakshaya | bhimadarshanaya | sudarshanakaraya | avyaktaya | vyaktasyaya namah
    | 80 om dundubhisvanaya namah | suvelacarine | nakaharshadaya | harshanapriyaya | sulabhaya | suvrataya
    | yogine | yogisevyaya | bhayapahaya | valagni
  devanagari: हनुमदष्टोत्तरशतनामावलिः ३ ॐ पारिजातप्रियाय नमः । योगिने । हनुमते । नृहरिप्रियाय । प्लवगेन्द्राय
    । पिङ्गलाक्षाय । शीघ्रगामिने । दृढव्रताय । शङ्खचक्रवराभीतिपाणये । आनन्ददायकाय । स्थायिने । विक्रमसम्पन्नाय
    । रामदूताय । महायशसे । सौमित्रिजीवनकराय । लङ्काविक्षोभकारकाय । उदधिक्रमणाय । सीताशोकहेतुहराय । हरये
    । बलिने नमः । २० ॐ राक्षससंहर्त्रे नमः । दशकण्ठमदापहाय । बुद्धिमते । नैरृतवधूकण्ठसूत्रविदारकाय । सुग्रीव
    सचिवाय । भीमाय । भीमसेनसहोदराय । सावित्रविद्यासंसेविने । चरितार्थाय । महोदयाय । वासवाभीष्टदाय । भव्याय
    । हेमशैलनिवासवते । किंशुकाभाय । अग्रयतनवे । ऋजुरोम्णे । महामतये । महाक्रमाय । वनचराय । स्थिरबुद्धये
    नमः । ४० ॐ अभीशुमते नमः । सिंहिकागर्भनिर्भेत्त्रे । लङ्कानिवासिनां भेत्त्रे । अक्षशत्रुविनिघ्नाय ।
    रक्षोऽमात्यभयावहाय । वीरघ्ने । मृदुहस्ताय । पद्मपाणये । जटाधराय । सर्वप्रियाय । सर्वकामप्रदाय । प्रांशुमुखाय
    । शुचये । विशुद्धात्मने । विज्वराय । सटावते । पाटलाधराय । भरतप्रेमजनकाय । चीरवाससे । महोक्षधृशे नमः
    । ६० ॐ महास्त्रबन्धनसहाय नमः । ब्रह्मचारिणे । यतीश्वराय । महौषधोपहर्त्रे । वृषपर्वणे । वृषोदराय ।
    सूर्योपलालिताय । स्वामिने । पारिजातावतंसकाय । सर्वप्राणधराय । अनन्ताय । सर्वभूतादिगाय । मनवे । रौद्राकृतये
    । भीमकर्मणे । भीमाक्षाय । भीमदर्शनाय । सुदर्शनकराय । अव्यक्ताय । व्यक्तास्याय नमः । ८० ॐ दुन्दुभिस्वनाय
    नमः । सुवेलचारिणे । नाकहर्षदाय । हर्षणप्रियाय । सुलभाय । सुव्रताय । योगिने । योगिसेव्याय । भयापहाय
    । वालाग्नि
