id: devi-aswadhati-amba-stuti
category: stotram
name:
  english: Devi Aswadhati (Amba Stuti)
content:
  english: ceti bhavannikhila kheti kadambavana vatishu naki patali kotira carutara koti manikirana koti
    karambita pada | patiragandhi kucashati kavitva paripatimagadhipa suta ghotikhuradadhika dhatimudara
    mukha vitirasena tanutam || || sha || dvaipayana prabhriti shapayudha tridiva sopana dhuli carana
    papapaha svamanu japanulina jana tapapanoda nipuna | nipalaya surabhi dhupalaka duritakupadudancayatumam
    rupadhika shikhari bhupala vamshamani dipayita bhagavati || || sha || yalibhi ratmatanutalinakritpriyaka
    palishu khelati bhava vyali nakulyasita culi bhara carana dhuli lasanmanigana | yali bhriti shravasi
    tali dalam vahati yalika shobhi tilaka sali karotu mama kali manah svapada nalika sevana vidhau ||
    || sha || balamritamshu nibha phalamana garuna cela nitamba phalake kolahala kshapita kalamarakushala
    kilala shoshana ravih | sthulakuce jalada nilakace kalita vila kadamba vipine shulayudha pranati shila
    dadhatu hridi shailadhi raja tanaya || || sha || kambavativa savidamba galena nava tumbabha vina savidha
    bimbadhara vinata shambayudhadi nikurumba kadamba vipine | amba kuranga madajambala roci riha lambalaka
    dishatu me sham bahuleya shashi bimbabhi rama mukha sambadhita stana bhara || || sha || dasayamana
    sumahasa kadambavana vasa kusumbha sumano vasa vipanci krita rasa vidhuta madhu masaravinda madhura
    | kasara suna tati bhasabhirama tanu rasara shita karuna nasa mani pravara bhasa shiva timira masaye
    duparatim || || sha || nyankakare vapushi kankala rakta pushi kankadi pakshi vishaye tvam kamana mayasi
    kim karanam hridaya pankari me hi girijam | shankashila nishita tankayamana pada sankashamana sumano
    jhankari bhringatati mankanupeta shashi sankasha vaktra kamalam || || sha || jambhari kumbhi prithu
    kumbhapahasi kuca sambhavya hara latika rambha karindra kara dambhapahorugati dimbhanuranjita pada
    | shambha udara parirambhankurat pulaka dambhanuraga pishuna sham bhasurabharana gumbha sada dishatu
    shumbhasura praharana || || sha || dakshayani danuja shiksha vidhau vikrita diksha manohara guna bhikshashino
    natana viksha vinoda mukhi dakshadhvara praharana | viksham vidhehi mayi daksha svakiya jana paksha
    vipaksha vimukhi yakshesha sevita nirakshepa shakti jaya lakshavadhana kalana || || sha || vandaru
    loka vara sandhayini vimala kundavadata radana brindaru brinda mani brindaravinda makarandabhishikta
    carana | mandanila kalita mandara damabhiramandabhirama makuta mandakini javana bhindana vacamaravindanana
    dishatu me || || sha || yatrashayo lagati tatragaja bhavatu kutrapi nistula shuka sutrama kala mukha
    satrasakaprakara sutrana kari carana | chatranilatiraya pattrabhibhirama guna mitramari sama vadhuh
    ku trasahina mani citrakriti sphurita putradi dana nipuna || || sha || kulatigami bhaya tulavalijvalanakila
    nijastuti vidha kolahalakshapita kalamari kushala kilala poshana rata | sthulakuce jalada nilakace
    kalita lila kadamba vipine shulayudha pranati shila vibhatu hridi shailadhiraja tanaya || || sha ||
    indhana kira manibandha bhave hridayabandha vativa rasika sandhavati bhuvana sandharane pyamrita sindhavudara
    nilaya | gandhanubhava muhurandhali pita kaca bandha samarpayatu me sham dhama bhanumapi rundhana
    mashu pada sandhana mapyanugata ||
  devanagari: चेटी भवन्निखिल खेटी कदम्बवन वाटीषु नाकि पटली कोटीर चारुतर कोटी मणीकिरण कोटी करम्बित पदा
    । पाटीरगन्धि कुचशाटी कवित्व परिपाटीमगाधिप सुता घोटीखुरादधिक धाटीमुदार मुख वीटीरसेन तनुताम् ॥ ॥ शा
    ॥ द्वैपायन प्रभृति शापायुध त्रिदिव सोपान धूलि चरणा पापापह स्वमनु जापानुलीन जन तापापनोद निपुणा । नीपालया
    सुरभि धूपालका दुरितकूपादुदन्चयतुमाम् रूपाधिका शिखरि भूपाल वंशमणि दीपायिता भगवती ॥ ॥ शा ॥ यालीभि रात्मतनुतालीनकृत्प्रियक
    पालीषु खेलति भवा व्याली नकुल्यसित चूली भरा चरण धूली लसन्मणिगणा । याली भृति श्रवसि ताली दलं वहति यालीक
    शोभि तिलका साली करोतु मम काली मनः स्वपद नालीक सेवन विधौ ॥ ॥ शा ॥ बालामृतांशु निभ फालामना गरुण चेला
    नितम्ब फलके कोलाहल क्षपित कालामराकुशल कीलाल शोषण रविः । स्थूलाकुचे जलद नीलाकचे कलित वीला कदम्ब विपिने
    शूलायुध प्रणति शीला दधातु हृदि शैलाधि राज तनया ॥ ॥ शा ॥ कम्बावतीव सविडम्बा गलेन नव तुम्बाभ वीण सविधा
    बिम्बाधरा विनत शम्बायुधादि निकुरुम्बा कदम्ब विपिने । अम्बा कुरङ्ग मदजम्बाल रोचि रिह लम्बालका दिशतु
    मे शं बाहुलेय शशि बिम्बाभि राम मुख सम्बाधिता स्तन भरा ॥ ॥ शा ॥ दासायमान सुमहासा कदम्बवन वासा कुसुम्भ
    सुमनो वासा विपञ्चि कृत रासा विधूत मधु मासारविन्द मधुरा । कासार सून तति भासाभिराम तनु रासार शीत करुणा
    नासा मणि प्रवर भासा शिवा तिमिर मासाये दुपरतिम् ॥ ॥ शा ॥ न्यङ्काकरे वपुषि कङ्काल रक्त पुषि कङ्कादि
    पक्षि विषये त्वं कामना मयसि किं कारणं हृदय पङ्कारि मे हि गिरिजाम् । शङ्काशिला निशित टङ्कायमान पद सङ्काशमान
    सुमनो झङ्कारि भृङ्गतति मङ्कानुपेत शशि सङ्काश वक्त्र कमलाम् ॥ ॥ शा ॥ जम्भारि कुम्भि पृथु कुम्भापहासि
    कुच सम्भाव्य हार लतिका रम्भा करीन्द्र कर दम्भापहोरुगति डिम्भानुरञ्जित पदा । शम्भा उदार परिरम्भाङ्कुरत्
    पुलक दम्भानुराग पिशुना शं भासुराभरण गुम्भा सदा दिशतु शुम्भासुर प्रहरणा ॥ ॥ शा ॥ दाक्षायणी दनुज शिक्षा
    विधौ विकृत दीक्षा मनोहर गुणा भिक्षाशिनो नटन वीक्षा विनोद मुखि दक्षाध्वर प्रहरणा । वीक्षां विधेहि मयि
    दक्षा स्वकीय जन पक्षा विपक्ष विमुखी यक्षेश सेवित निराक्षेप शक्ति जय लक्षावधान कलना ॥ ॥ शा ॥ वन्दारु
    लोक वर सन्धायिनी विमल कुन्दावदात रदना बृन्दारु बृन्द मणि बृन्दारविन्द मकरन्दाभिषिक्त चरणा । मन्दानिला
    कलित मन्दार दामभिरमन्दाभिराम मकुटा मन्दाकिनी जवन भिन्दान वाचमरविन्दानना दिशतु मे ॥ ॥ शा ॥ यत्राशयो
    लगति तत्रागजा भवतु कुत्रापि निस्तुल शुका सुत्राम काल मुख सत्रासकप्रकर सुत्राण कारि चरणा । छत्रानिलातिरय
    पत्त्राभिभिराम गुण मित्रामरी सम वधूः कु त्रासहीन मणि चित्राकृति स्फुरित पुत्रादि दान निपुणा ॥ ॥ शा
    ॥ कूलातिगामि भय तूलावलिज्वलनकीला निजस्तुति विधा कोलाहलक्षपित कालामरी कुशल कीलाल पोषण रता । स्थूलाकुचे
    जलद नीलाकचे कलित लीला कदम्ब विपिने शूलायुध प्रणति शीला विभातु हृदि शैलाधिराज तनया ॥ ॥ शा ॥ इन्धान
    कीर मणिबन्धा भवे हृदयबन्धा वतीव रसिका सन्धावती भुवन सन्धारणे प्यमृत सिन्धावुदार निलया । गन्धानुभाव
    मुहुरन्धालि पीत कच बन्धा समर्पयतु मे शं धाम भानुमपि रुन्धान माशु पद सन्धान मप्यनुगता ॥
