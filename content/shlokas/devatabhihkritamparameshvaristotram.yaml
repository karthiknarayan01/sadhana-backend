id: devatabhihkritamparameshvaristotram
category: stotram
name:
  english: devatabhihkritamparameshvaristotram
  devanagari: देवताभिःकृतंपरमेश्वरीस्तोत्रम्
content:
  english: devatabhihkritam parameshvaristotram devata indraprasthe vai vishale vanavistare | kundam suyogyavistaram
    kritva vahnim nidhaya ca || 67|| kritva dridham pratijnam vai mahalakshmim prapujya ca | parito havanam
    cakruh prityartham tu shriya hareh || 68|| brahmabhuta bhavishyamo bhokshyamo va trivishtapam | ityevam
    havanam cakrustavatpradurbabhuva ha || 69|| cakrakaram mahattejastanmadhye parameshvari | jaganmata
    jivadatri narayani pareshvari || 70|| vyuhatejomayi brahmanandini harisundari | pashankushekshukodandapadmamala
    lasatkara || 71|| drishtva tam mumuhurdevah pranemurvigatajvarah | tushtuvuh shrimahalakshmim lalitam
    vaishnavim prasum || 72|| jaya lakshmi jaganmatarjaya lakshmi paratpare | jaya kalyananilaye jaya
    sarvakalatmike || 73|| jaya brahmi mahalakshmi brahmatmike paratmike | jaya narayani shante jaya shrilalite
    rame || 74|| jaya shrivijaye devishvari shride jayarddhide | namah sahasrashirshayai sahasrananalocane
    || 75|| namah sahasrahastabjapadapankajashobhite | anoranutare lakshmi mahato'pi mahiyasi || 76||
    atalam te smritau padau vitalam januni tava | rasatalam katiste ca kukshiste prithivi mata || 77||
    hridayam bhuvah svaste'stu mukham satyam shiro matam | drishashcandrarkadahana dishah karna bhujah
    surah || 78|| marutastu tavocchvasa vacaste shrutayo matah | krida te lokaracana sakha te parameshvarah
    || 79|| aharaste sada''nando vasaste hridaye hareh | drishyadrishyasvarupani rupani bhuvanani te ||
    80|| shiroruha ghanaste vai tarakah kusumani te | dharmadya bahavaste ca kaladya hetayastava || 81||
    yamashca niyamashcapi karapadanakhastava | stanau svahasvadhakarau sarvajivanadugdhadau || 82|| pranayamastava
    shvaso rasana te sarasvati | mahiruhaste'ngaruhah prabhatam vasanam tava || 83|| adau daya dharmapatni
    sasarja nikhilah prajah | hritstha tvam vyapini lakshmirmohini tvam tatha para || 84|| idanim drishyase
    brahmi narayani priyankari | namastasyai mahalakshmyai gajamukhyai namo namah || 85|| sarvashaktyai
    sarvadhatryai mahalakshmyai namo namah | ya sasarja virajam ca tato'jam vishnumishvaram || 86|| rudram
    tatha suragrya~shca tasyai lakshmyai namo namah | trigunayai nirgunayai harinyai te namo namah ||
    87|| yantratantratmikayai te jaganmatre namo namah | vagvibhutyai gurutanvyai mahalakshmyai namo namah
    || 88|| kambharayai sarvavidyabharayai te namo namah | jayalalitapancaliramatanvai namo namah || 89||
    padmavatiramahamsisuguna''jnashriyai namah | namahstuta prasannaivam chandayamasa sadvaraih || 90||
    devah prahushca tushta cedbhandasuram vinashaya | durdharam jivitam saukhyam dehi te sharanarthinah
    || 91|| mahalakshmih samuvaca muditah santu nirbhayah | bhandasuram nashayishye lalita'ham mahasati
    || 92|| stavaka me bhavishyanti shriyashodharmasambhritah | vidyavinayasampanna niroga dirghajivinah
    || 93|| putramitrakalatradhya bhavishyanti susampadah | itilabdhavara devah satram cakruh prapurnakam
    || 94|| atha sa lalita lakshmirvaramalam karotthitam | anadishrimahavishnusvarupaya paratmane || 95||
    tatraiva pashyatam sarvasuranam carpayadgale | devadundubhayo nedurjayashabdastada'bhavan || 96||
    gitayashca'bhavamstatra'psarasam surayoshitam | nanritushcapsarasashca jagurgandharvasattamah || 97||
    rishayah stavanam cakrurashirvadaparayanah | sadhavo namanam cakruh sevam cakrushca parshadah || 98||
    iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande 115
  devanagari: देवताभिःकृतं परमेश्वरीस्तोत्रम् देवता इन्द्रप्रस्थे वै विशाले वनविस्तरे । कुण्डं सुयोग्यविस्तारं
    कृत्वा वह्निं निधाय च ॥ ६७॥ कृत्वा दृढां प्रतिज्ञां वै महालक्ष्मीं प्रपूज्य च । परितो हवनं चक्रुः
    प्रीत्यर्थं तु श्रिया हरेः ॥ ६८॥ ब्रह्मभूता भविष्यामो भोक्ष्यामो वा त्रिविष्टपम् । इत्येवं हवनं चक्रुस्तावत्प्रादुर्बभूव
    ह ॥ ६९॥ चक्राकारं महत्तेजस्तन्मध्ये पारमेश्वरी । जगन्माता जीवदात्री नारायणी परेश्वरी ॥ ७०॥ व्यूहतेजोमयी
    ब्रह्मानन्दिनी हरिसुन्दरी । पाशाङ्कुशेक्षुकोदण्डपद्ममाला लसत्करा ॥ ७१॥ दृष्ट्वा तां मुमुहुर्देवाः
    प्रणेमुर्विगतज्वराः । तुष्टुवुः श्रीमहालक्ष्मीं ललितां वैष्णवीं प्रसूम् ॥ ७२॥ जय लक्ष्मि जगन्मातर्जय
    लक्ष्मि परात्परे । जय कल्याणनिलये जय सर्वकलात्मिके ॥ ७३॥ जय ब्राह्मि महालक्ष्मि ब्रह्मात्मिके परात्मिके
    । जय नारायणि शान्ते जय श्रीललिते रमे ॥ ७४॥ जय श्रीविजये देवीश्वरि श्रीदे जयर्द्धिदे । नमः सहस्रशीर्षायै
    सहस्राननलोचने ॥ ७५॥ नमः सहस्रहस्ताब्जपादपङ्कजशोभिते । अणोरणुतरे लक्ष्मि महतोऽपि महीयसि ॥ ७६॥ अतलं
    ते स्मृतौ पादौ वितलं जानुनी तव । रसातलं कटिस्ते च कुक्षिस्ते पृथिवी मता ॥ ७७॥ हृदयं भुवः स्वस्तेऽस्तु
    मुखं सत्यं शिरो मतम् । दृशश्चन्द्रार्कदहना दिशः कर्णा भुजाः सुराः ॥ ७८॥ मरुतस्तु तवोच्छ्वासा वाचस्ते
    श्रुतयो मताः । क्रीडा ते लोकरचना सखा ते परमेश्वरः ॥ ७९॥ आहारस्ते सदाऽऽनन्दो वासस्ते हृदये हरेः । दृश्यादृश्यस्वरूपाणि
    रूपाणि भुवनानि ते ॥ ८०॥ शिरोरुहा घनास्ते वै तारकाः कुसुमानि ते । धर्माद्या बाहवस्ते च कालाद्या हेतयस्तव
    ॥ ८१॥ यमाश्च नियमाश्चापि करपादनखास्तव । स्तनौ स्वाहास्वधाकारौ सर्वजीवनदुग्धदौ ॥ ८२॥ प्राणायामस्तव
    श्वासो रसना ते सरस्वती । महीरुहास्तेऽङ्गरुहाः प्रभातं वसनं तव ॥ ८३॥ आदौ दया धर्मपत्नी ससर्ज निखिलाः
    प्रजाः । हृत्स्था त्वं व्यापिनी लक्ष्मीर्मोहिनी त्वं तथा परा ॥ ८४॥ इदानीं दृश्यसे ब्राह्मी नारायणी
    प्रियङ्करी । नमस्तस्यै महालक्ष्म्यै गजमुख्यै नमो नमः ॥ ८५॥ सर्वशक्त्यै सर्वधात्र्यै महालक्ष्म्यै नमो
    नमः । या ससर्ज विराजं च ततोऽजं विष्णुमीश्वरम् ॥ ८६॥ रुद्रं तथा सुराग्र्याँश्च तस्यै लक्ष्म्यै नमो
    नमः । त्रिगुणायै निर्गुणायै हरिण्यै ते नमो नमः ॥ ८७॥ यन्त्रतन्त्रात्मिकायै ते जगन्मात्रे नमो नमः ।
    वाग्विभूत्यै गुरुतन्व्यै महालक्ष्म्यै नमो नमः ॥ ८८॥ कम्भरायै सर्वविद्याभरायै ते नमो नमः । जयाललितापाञ्चालीरमातन्वै
    नमो नमः ॥ ८९॥ पद्मावतीरमाहंसीसुगुणाऽऽज्ञाश्रियै नमः । नमःस्तुता प्रसन्नैवं छन्दयामास सद्वरैः ॥ ९०॥
    देवाः प्राहुश्च तुष्टा चेद्भण्डासुरं विनाशय । दुर्धरं जीवितं सौख्यं देहि ते शरणार्थिनः ॥ ९१॥ महालक्ष्मीः
    समुवाच मुदिताः सन्तु निर्भयाः । भण्डासुरं नाशयिष्ये ललिताऽहं महासती ॥ ९२॥ स्तावका मे भविष्यन्ति श्रीयशोधर्मसम्भृताः
    । विद्याविनयसम्पन्ना निरोगा दीर्घजीविनः ॥ ९३॥ पुत्रमित्रकलत्राढ्या भविष्यन्ति सुसम्पदः । इतिलब्धवरा
    देवाः सत्रं चक्रुः प्रपूर्णकम् ॥ ९४॥ अथ सा ललिता लक्ष्मीर्वरमालां करोत्थिताम् । अनादिश्रीमहाविष्णुस्वरूपाय
    परात्मने ॥ ९५॥ तत्रैव पश्यतां सर्वसुराणां चार्पयद्गले । देवदुन्दुभयो नेदुर्जयशब्दास्तदाऽभवन् ॥ ९६॥
    गीतयश्चाऽभवंस्तत्राऽप्सरसां सुरयोषिताम् । ननृतुश्चाप्सरसश्च जगुर्गन्धर्वसत्तमाः ॥ ९७॥ ऋषयः स्तवनं
    चक्रुराशीर्वादपरायणाः । साधवो नमनं चक्रुः सेवां चक्रुश्च पार्षदाः ॥ ९८॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे ११५
