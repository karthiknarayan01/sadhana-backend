id: durga-7
category: stotram
name:
  english: durga 7
  devanagari: दुर्ग ७
content:
  english: rinu deva pravakshyami kalau sarveshtasadhanam | maya tavaiva snehenapyambastutih prakashyate
    || om asya shridurgasaptashlokistotramahamantrasya narayana rishih | anushtubhadini chandamsi | shrimahakalimahalakshmimahasarasvatyo
    devatah | shridurgaprityartham saptashloki durgapathe viniyogah || jnaninamapi cetamsi devi bhagavati
    hi sa | baladakrishya mohaya mahamaya prayacchati || 1|| durge smrita harasi bhitimasheshajantoh svasthaih
    smrita matimativa shubham dadasi | daridryaduhkhabhayaharini ka tvadanya sarvopakarakaranaya sada''rdracitta
    || 2|| sarvamangalamangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te
    || 3|| sharanagatadinartaparitranaparayane | sarvasyartihare devi narayani namo'stu te || 4|| sarvasvarupe
    sarveshe sarvashaktisamanvite | bhayebhyastrahi no devi durge devi namo'stu te || 5|| roganasheshanapahamsi
    tushta rushta tu kaman sakalanabhishtan | tvamashritanam na vipannaranam tvamashrita hyashrayatam
    prayanti || 6|| sarvabadhaprashamanam trailokyasyakhileshvari | evameva tvaya karyamasmadvairi vinashanam
    || 7|| || iti durgasaptashloki sampurna ||
  devanagari: ृणु देव प्रवक्ष्यामि कलौ सर्वेष्टसाधनम् । मया तवैव स्नेहेनाप्यम्बास्तुतिः प्रकाश्यते ॥ ॐ
    अस्य श्रीदुर्गासप्तश्लोकीस्तोत्रमहामन्त्रस्य नारायण ऋषिः । अनुष्टुभादीनि छन्दांसि । श्रीमहाकालीमहालक्ष्मीमहासरस्वत्यो
    देवताः । श्रीदूर्गाप्रीत्यर्थं सप्तश्लोकी दुर्गापाठे विनियोगः ॥ ज्ञानिनामपि चेतांसि देवी भगवती हि
    सा । बलादाकृष्य मोहाय महामाया प्रयच्छति ॥ १॥ दुर्गे स्मृता हरसि भीतिमशेषजन्तोः स्वस्थैः स्मृता मतिमतीव
    शुभां ददासि । दारिद्र्यदुःखभयहारिणि का त्वदन्या सर्वोपकारकरणाय सदाऽऽर्द्रचित्ता ॥ २॥ सर्वमङ्गलमाङ्गल्ये
    शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते ॥ ३॥ शरणागतदीनार्तपरित्राणपरायणे
    । सर्वस्यार्तिहरे देवि नारायणि नमोऽस्तु ते ॥ ४॥ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते । भयेभ्यस्त्राहि
    नो देवि दुर्गे देवि नमोऽस्तु ते ॥ ५॥ रोगानशेषानपहंसि तुष्टा रुष्टा तु कामान् सकलानभीष्टान् । त्वामाश्रितानां
    न विपन्नराणां त्वामाश्रिता ह्याश्रयतां प्रयान्ति ॥ ६॥ सर्वाबाधाप्रशमनं त्रैलोक्यस्याखिलेश्वरि । एवमेव
    त्वया कार्यमस्मद्वैरि विनाशनम् ॥ ७॥ ॥ इति दुर्गासप्तश्लोकी सम्पूर्णा ॥
