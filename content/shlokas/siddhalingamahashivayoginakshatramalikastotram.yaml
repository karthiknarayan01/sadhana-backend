id: siddhalingamahashivayoginakshatramalikastotram
category: stotram
name:
  english: siddhalingamahashivayoginakshatramalikastotram
  devanagari: सिद्धलिन्गमहाशिवयोगिनक्षत्रमालिकास्तोत्रम्
content:
  english: shri maha siddhesho edeyuravasanirato magnassamadau sada | yatpadambujasangamena mahatiganga
    samudbhavita sahyadristha mahabalesha shirasastam siddhalingam bhaje || 7|| shri maheshavratayutam
    varasiddhanatham vadaprasaktamanisham vimukham ca kritva | uttungayoginamalam parirakshitaram yogishvaram
    khalu bhaje guru siddhalingam || 8|| kshetrevasanamuḻaviti mahaprasiddhe durvadasakta hridayasya janardanasya
    | vagbandhanam vidadhatam shruti shastravakyaih siddhendrayoginamaham satatam namami || 9|| durvadasthan
    jinamatajanan vada bhumau nitantam shrutyadharairvijayinamalam bhuridrishtantapurvam | nanaritya sarasavacanairbhangayantam
    mahantam siddhendrakhyam yatikula gurum candracudam namami || 10|| kandarpadarpaharamanatarakshitaram
    vatsalyapurnahridayam karunasamudram | shrimallinatha varajangama satkritam ca yogishvaram hridi bhaje
    gurusiddhalingam || 11|| girishajangamapujitamadarat sarasabhashana toshita manasam | varasamadhiratam
    carapungavam hridi bhaje gurusiddhayatishvaram || 12|| valmikasthitayogirajamanagham nambenna bhaktasya
    vai godohena vibodhya sadhu janata kshirenasamliyatam | kumbheshveva shateshu sancitavata shantam
    mahantam yatim samprapyati tutosha tam guruvaram vande sada saukhyadam || 13|| siddhendram varakaggeriyajanatasamsevyamanam
    muda sandashyashu mritam karalabhujagam sanjivayantam yatim | bhutabhyam varamuktidam hi sahasa nambennabhaktasya
    vai dasidattamaho pibantamanagham kshiram sada prarthaye || 14|| lingannaryatparamakutilat dhurtabhavenapraptam
    janan yogi paramadayaya tasya daurjanyabhavam | amulagrannirasanadhiya kshvedarupattamannam svikrityalam
    vimalamanasa vartamanam bhajeham || 15|| bhutim muda sphatikalingamaho vidhata vrishtim ca dronakusumairmahatim
    vitanvan | kasaraniracalitam ghatamanayan mamam payatsada yativaro gurusiddhalingah || 16|| ratraudvaram
    vighatanaparam kallinathena pritya mayadevi racitayajanam sadaram manayantam | dvandvatitam tridashanamitam
    siddhalingam yatindram vande bhaktyanatasuratarum kalakalam mahesham || 17|| jambalajatambaka netrayukta
    padaravindam shamanantakam tam | adhvanyamasham paripurnanadyam bhaje'hametam gurusiddhalingam ||
    18|| kamadhvamsi karanavijayi kamitarthapradayi sauvarnadrim tripuravijaye karmukam samvidhanah |
    dvandvatito nigamavacanaistuyamano ya ishah tam vande'ham yatikulapatim lingapujanimagnam || 19||
    tattvam shaktivilasamadvayamamum shadbhaga samshobhitam lingangabhidhabheda bhinnamatulam caikottaravantaram
    | shrutyadipratipadyamanamanagham shriboḻadevam prati bodham tam gurusiddhalingamanisham samprarthaye
    bhaktaye || 20|| tattvam shatsthalamargayuktamanagham shrivirashaivanugam samsrishtirjagatah kramam
    ca nikhilam vedagamairadritam | jijnasum nitaram hi boḻabasavam sambodhayantam muda vande'ham satatam
    shilamathagatam shri siddhalingeshvaram || 21|| lingam vai varavirashaivasamaye samsara santarakam
    shatsthanunugamam hi boḻabasavam sambodhayantam muda | siddhendram varashailamantapagatam canandapurnam
    sada sadbhaktyasatatam namami paramam vatsalyapurnam shivam || 22|| bhaktasthalam canyavibhagapurnam
    hyacaralingena sushraddhaya ca | shri boḻadevam prati bodhayantam shri siddhalingam sahitam bhaje'ham
    || 23|| nishthabhaktisamanvitam varagurorlingashrayam santatam sanmaheshvaranamakam sthalamidam shri
    boḻadevam prati | bodham tam shivalingayuktamavadhana bhakti samshobhitam prasadisthalamatmabhedasahitam
    shri siddhalingam bhaje || 24|| shri boḻadevam hyanubhavabhaktaya samshobhitam jangamalingakena |
    sambhodhayantam varapranalingisthalam bhaje'ham gurusiddhalingam || 25|| shri siddhalingayati pancaprasadalinga
  devanagari: श्री महा सिद्धेशो एडेयूरवासनिरतो मग्नस्समादौ सदा । यत्पादाम्बुजसङ्गमेन महतीगङ्गा समुद्भाविता
    सह्याद्रिस्थ महाबलेश शिरसस्तं सिद्धलिङ्गं भजे ॥ ७॥ श्री माहेशव्रतयुतं वरसिद्धनाथम् वादप्रसक्तमनिशं
    विमुखं च कृत्वा । उत्तुङ्गयोगिनमलं परिरक्षितारम् योगीश्वरं खलु भजे गुरु सिद्धलिङ्गम् ॥ ८॥ क्षेत्रेवसानमुळवीति
    महाप्रसिद्धे दुर्वादसक्त हृदयस्य जनार्दनस्य । वाग्बन्धनं विदधतं श्रुति शास्त्रवाक्यैः सिद्धेन्द्रयोगिनमहं
    सततं नमामि ॥ ९॥ दुर्वादस्थान् जिनमतजनान् वाद भूमौ नितान्तम् श्रुत्याधारैर्विजयिनमलं भूरिदृष्टान्तपूर्वम्
    । नानारीत्या सरसवचनैर्भङ्गयन्तं महान्तम् सिद्धेन्द्राख्यं यतिकुल गुरुं चन्द्रचूडं नमामि ॥ १०॥ कन्दर्पदर्पहरमानतरक्षितारम्
    वात्सल्यपूर्णहृदयं करुणासमुद्रम् । श्रीमल्लिनाथ वरजङ्गम सत्कृतं च योगीश्वरं हृदि भजे गुरुसिद्धलिङ्गम्
    ॥ ११॥ गिरिशजङ्गमपूजितमादरात् सरसभाषण तोषित मानसम् । वरसमाधिरतं चरपुङ्गवम् हृदि भजे गुरुसिद्धयतीश्वरम्
    ॥ १२॥ वल्मीकस्थितयोगिराजमनघं नम्बेण्ण भक्तस्य वै गोदोहेन विबोध्य साधु जनता क्षीरेणसंलीयतम् । कुम्भेष्वेव
    शतेषु सञ्चितवता शान्तं महान्तं यतिम् सम्प्राप्याति तुतोष तं गुरुवरं वन्दे सदा सौख्यदम् ॥ १३॥ सिद्धेन्द्रं
    वरकग्गेरीयजनतासंसेव्यमानं मुदा सन्दश्याशु मृतं करालभुजगं सञ्जीवयन्तं यतिम् । भूताभ्यां वरमुक्तिदं
    हि सहसा नम्बेण्णभक्तस्य वै दासीदत्तमहो पिबन्तमनघं क्षीरं सदा प्रार्थये ॥ १४॥ लिङ्गण्णार्यात्परमकुटिलात्
    धूर्तभावेनप्राप्तम् जानन् योगी परमदयया तस्य दौर्जन्यभावम् । आमूलाग्रन्निरसनधिया क्ष्वेडरूपात्तमन्नम्
    स्विकृत्यालं विमलमनसा वर्तमानं भजेहम् ॥ १५॥ भूतिं मुदा स्फटिकलिङ्गमहो विधाता वृष्टिं च द्रोणकुसुमैर्महतीं
    वितन्वन् । कासारनीरचलितं घटमानयन् मामम् पायात्सदा यतिवरो गुरुसिद्धलिङ्गः ॥ १६॥ रात्रौद्वारं विघटनपरं
    कल्लिनाथेन प्रीत्या मायादेवी रचितयजनं सादरं मानयन्तम् । द्वन्द्वातीतं त्रिदशनमितं सिद्धलिङ्गं यतीन्द्रम्
    वन्दे भाक्त्यानतसुरतरुं कालकालं महेशम् ॥ १७॥ जम्बालजाताम्बक नेत्रयुक्त पादारविन्दं शमनान्तकं तम् ।
    अध्वन्यमाशं परिपूर्णनद्याम् भजेऽहमेतं गुरुसिद्धलिङ्गम् ॥ १८॥ कामध्वंसी करणविजयी कामितार्थप्रदायी सौवर्णाद्रिं
    त्रिपुरविजये कार्मुकं संविधानः । द्वन्द्वातीतो निगमवचनैस्तूयमानो य ईशः तं वन्देऽहं यतिकुलपतिं लिङ्गपूजानिमग्नम्
    ॥ १९॥ तत्त्वं शक्तिविलासमद्वयममुं षद्भाग संशोभितम् लिङ्गाङ्गाभिधभेद भिन्नमतुलं चैकोत्तरावान्तरम् ।
    श्रुत्यादिप्रतिपाद्यमानमनघं श्रीबोळदेवं प्रति बोधं तं गुरुसिद्धलिङ्गमनिशं सम्प्रार्थये भक्तये ॥ २०॥
    तत्त्वं षट्स्थलमार्गयुक्तमनघं श्रीवीरशैवानुगम् संसृष्टिर्जगतः क्रमं च निखिलं वेदागमैरादृतम् । जिज्ञासुं
    नितरां हि बोळबसवं सम्बोधयन्तं मुदा वन्देऽहं सततं शिलामठगतं श्री सिद्धलिङ्गेश्वरम् ॥ २१॥ लिङ्गं वै
    वरवीरशैवसमये संसार सन्तारकम् षट्स्थानुनुगमं हि बोळबसवं सम्बोधयन्तं मुदा । सिद्धेन्द्रं वरशैलमण्टपगतं
    चानन्दपूर्णं सदा सद्भक्त्यासततं नमामि परमं वात्सल्यपूर्णं शिवम् ॥ २२॥ भक्तस्थलं चान्यविभागपूर्णं ह्याचारलिङ्गेन
    सुश्रद्धाया च । श्री बोळदेवं प्रति बोधयन्तं श्री सिद्धलिङ्गं सहितं भजेऽहम् ॥ २३॥ निष्ठाभक्तिसमन्वितं
    वरगुरोर्लिङ्गाश्रयं सन्ततम् सन्माहेश्वरनामकं स्थलमिदं श्री बोळदेवं प्रति । बोधं तं शिवलिङ्गयुक्तमवधान
    भक्ति संशोभितं प्रासादिस्थलमात्मभेदसहितं श्री सिद्धलिङ्गं भजे ॥ २४॥ श्री बोळदेवं ह्यनुभावभक्तया संशोभितं
    जङ्गमलिङ्गकेन । सम्भोधयन्तं वरप्राणलिङ्गिस्थलं भजेऽहं गुरुसिद्धलिङ्गम् ॥ २५॥ श्री सिद्धलिङ्गयति पञ्चप्रसादलिङ्गा
