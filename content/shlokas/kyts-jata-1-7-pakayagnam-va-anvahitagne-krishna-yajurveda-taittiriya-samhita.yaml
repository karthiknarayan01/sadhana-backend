id: kyts-jata-1-7-pakayagnam-va-anvahitagne-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.7 Pakayagnam Va Anvahitagne - Krishna Yajurveda Taittiriya Samhita
content:
  english: ranvanva hitagneh | upa tishthante tishthanta ideda tishthante tishthanta yajamanasya prayajanuya
    bhi mantrayeta mantrayeta shavarne mantrayeta mantrayeta jnasya bhuyad bhuyad ya vai gaur gaur vai
    vai gauh | manasa dhyayed dhyaye tre dhyayed dhyaye manu rashramya dashramya r manu rashramyat | vyahvayanta
    hvayanta tici mahvayanta hvayanta pra shur hvayeta hvayeta pa man hvayeta hvayeta pashu dino bhavati
    bhavati brahmava dino vadanti vadanti brahmava yo yo hvayeta hvayeta rjayante marjayante sa rjayante
    marjayanta e m ~vai va asuranam | vyacchidyata cchidyata brahmana 'cchidyata cchidyata yam ~vai vai
    yam ~yam ~vai | nkramanti kramanti sa sa kramanti kramanti tman kurute kuruta a iti tyahvatha ahvatha
    iti tyahvatha ahvatha gaur vai vai gaur gaur vai | vava tau tau vava vava tau | m ~ya ya 'vadata mavadata
    iti tyahvatha ahvatha yo yo bhavanti bhavanti iti tyahvatha ahvatha shtha 'sya asyai prati anu grihnati
    grihna tyanvanu grihnati | prati grihnati grihnati bhavantir grihnati grihna tya bhavantir grihnati
    | yo yo grihnati grihnati va tishthati tishtha tye tyathatha tishthati tishtha tti titi chinatti china
    pra tu tu pra pra tu | iti tyahvatha ahvatha r vrishti ruvaco vaca njivantih pibanti pibanti sa njivantih
    pibanti | yo yah pibanti pibanti do jayate jayate 'nna ryam ~yad yadanvaha tena prinati prinati yad
    yad dadhati dadhati yad vai vai yad yad vai | m ~yad yad vilishtam | ryam ~yad yadanvaha va prinati
    prina tye japatih prinati prinati pra no 'manyata manyata ririca japati mriddhno tyriddhnoti pra to
    'parimita riddhno tyriddhno vai yad yad vai vai yat | asura akurvata kurva te te 'kurvata kurvata
    bhratrivyo 'syasya bhratrivyo bhavati bhavati tvevaiva tu tveva | r tyevaive shtapu sa marddhaya tyarddhayati
    nurjasva narddhaya tyarddhaya nau dadhati dadhati pranapa nau pahi pahi samanavya hi hyamushminn |
    jnena tishthati tishthati ya stishthati tishthati dar gne ranudanta nudanta njayati jayati darashapurnama
    m ~vi vi vajavatibhya yo yah pratishthityai tarahi bruyad bruya na muncami muncami rasha prati tishthati
    tishthati somasya tishthati tishthati stvashtur dhatte dhatte mpra pra bhuyasam | ttasma dajayata
    jayata vedya mavindanta vindanta m ~vedya mavindanta | ttadavindanta vindanta nama grihniyad grihniya
    ttad grihniyad grihniya sarvam ~vrinkte vrinkte tavantam ~vrinkte vrinkte ghri m ~vai vai ricyamanam
    | te 'nvanu ricyate | mpyayate pyayate ya mpyayayati pyayayati mpyayate pyayate ya gam ~yad yad yajamanabha
    va prinati prina tye nprinati prina tye gam ~yad yad yajamanabha prati shthapayati sthapayati thsthapayati
    sthapaya tye sarvani dhatte dhatte tvijo marjayantam | dyaur dyaur jagati r dyaur dyau ranushtubhih
    | yad yac chithsi chithsi kshya ma ma ''vrikshi | pra vai vai pra pra vai | kac cyavate cyavate lo
    yo yashcyavate cyavate dino vadanti vadanti brahmava man krameta krameta vishnukra yo yah krameta
    krameta prati tishthati tishthati ntishthati tishthatyai tmano 'rddho 'rddha a samiddho agne 'gne
    ddha didihi didihi same vai vai garahapatyasya | ncaryate caryata agnipavama ngarahapatya magnipavama
    nati tishthate tishthate pu te 'gne 'gne grihapate | nta nindhishiye ndhishiya hema nama grihnati
    grihnati ngrihnati grihnatyanna iti bruyad bruya yasya bruyad bruya sya syasya brahmavarca tro jayate
    jayate pu iti bruyad bruya yasya bruyad bruya ndadhati dadhati brahmavarca no vai va apratishtha sa
    sa yunakti yunakti tvititi muncatu munca pratishthityai muncati muncati tam ~vratapate vratapate vra
    ta macarisha macarisham ~vra miti tyacarisha macarisha va vi vyevaiva vi | || shantyai srijate srijate
    h punar vartate vartate jno vartate vartate ya ddha 'navaruddha labhate labha r yo ya ahitagnih |
    shtva pran pra ni shtve shtva pran | tkramya bruyad bruya du tkramya bruyat | cah punatu punatu va
    dya svadati svada tya tram ~vaddhyad vaddhyad vri nte te asminn | paprayah parayantu parayantu h paprayah
    parayantu | ntviti parayantu | || ashvajani vajini vaji nyashvajani vajini | vajeshu vajini vajini
    syarva 'rva 'si | yojana mimiddhvam | vajevaje gacchata gacchata dhaneshu vipra vipra vishve shrinvantu
    shrinvantu jinah shrinvantu shrinvantu va jino bhavantu bhavantu va nturanyati turanyati kshipa nturanyati
    turanyati gri na ver ver na na veh | rddhino vati vati praga rjorja taritratah | tvaya gamyad gamya
    damrita vajino vajajito vajajito m ~vajam ~vajajito vajajito vajino jighrata jighrata vajino vajajito
    vajajito m ~vajam ~vajajito vajajito yam ~ya mindrena | ajijipata vanaspatayo vanaspata ta jijipata
    vanaspatayah | mindram ~vanaspatayo vanaspataya m ~vi vi mucyaddhvam | miti mucyaddhvam | || suvo
    rokshyami rokshyami ssuvo rokshyami | vajo rokshyami rokshyami m ~vag vak kalpata japate rabhuma bhuma
    pra nnadyaya tva tva nnadyaya tva tva ssushuve sushuve prasa agre sushuve sushuve madhumatir bhavantu
    bhavantu r madhumatir bhavantu | griyama jagriyama ra rohita jagriyama jagriyama pu shshishriye shishriye
    prasa ndapayatu dapayatu praja accha cchagne 'gne ma yacchatu yacchatvarya bhi shincami sinca mya
    sye ndrasya sincami sinca bhi shincami sinca mya dvyaksharena pranapa dvyaksharena pranapa r vishnu
    rajayata majayata trayodashaksharena trayoda trayodashaksharena trayoda dra shcaturdashaksharena dra
    shcaturdashaksharena | caturdashaksharena caturda caturdashaksharena caturda tyah pancadashaksharena
    tyah pancadashaksharena | pancadashaksharena pancada pancadashaksharena pancada magrihito 'sya syupaya
    sha grihnami grihnamye magrihita stva tvopaya magrihito 'syasyupaya sha grihnami grihna mye magrihita
    stva tvopaya magrihito 'syasyupaya ntva tva 'ntariksha sha grihnami grihna mye m ~vishipriyanam |
    sho agrabhi magrabhi me ngrihnami grihna myutta magrihito 'sya syupaya japataye tva tva pra sha grihnami
    grihna mye japataye tva tva pra anva haha nvanvaha | anvi di danvanvit | njayamana majihata jihata
    tre ndre ndra yajatra yaja ha mindra nindranya ra marddhir marddhi vanta indre ndra stu pra pra haryashva
    haryashva havamahe havamahe prada bha hi hyubhobha hi | d dakshinad yaccha yaccha ko bhavatu bhavatu
    sumridi shvaveda bhavatu bhavatu vi viryasya krinotu krinotu su se syama syama saumana tar yuyotu
    yuyotu sanu pro shu su pro pro shu | tha masma asmai purora
  devanagari: रन्वन्वा हि॑ताग्नेः । उप॑ तिष्ठन्ते तिष्ठन्त इडेडा॑ तिष्ठन्ते तिष्ठन्त यज॑मानस्य प्रयाजानूया
    भि म॑न्त्रयेत मन्त्रयेता षवर्णे मन्त्रयेत मन्त्रयेत ज्ञस्य॑ भूयाद् भूयाद् य वै गौर् गौर् वै वै गौः
    । मन॑सा ध्यायेद् ध्याये त्रे ध्या॑येद् ध्याये मनु॑ रश्राम्य दश्राम्य र् मनु॑ रश्राम्यत् । व्य॑ह्वयन्ता
    ह्वयन्त तीची॑ मह्वयन्ता ह्वयन्त प्र शुर् ह्व॑येत ह्वयेता प मान् ह्व॑येत ह्वयेत पशु दिनो॑ भवति भवति
    ब्रह्मवा दिनो॑ वदन्ति वदन्ति ब्रह्मवा यो यो ह्व॑येत ह्वयेत र्जयन्ते मार्जयन्ते सा र्जयन्ते मार्जयन्त
    ए ं ँवै वा असु॑राणाम् । व्य॑च्छिद्यता च्छिद्यत ब्रह्म॑णा ऽच्छिद्यता च्छिद्यत यां ँवै वै यां ँयां ँवै
    । ङ्क्रा॑मन्ति क्रामन्ति स स क्रा॑मन्ति क्रामन्ति त्मन् कु॑रुते कुरुत आ इती त्य॑ह्वथा अह्वथा इती त्य॑ह्वथा
    अह्वथा गौर् वै वै गौर् गौर् वै । वाव तौ तौ वाव वाव तौ । ं ँया या ऽव॑दता मवदता इती त्य॑ह्वथा अह्वथा
    यो यो भ॑वन्ति भवन्ति इती त्य॑ह्वथा अह्वथा ष्ठा ऽस्या॑ अस्यै प्रति अनु॑ गृह्णाति गृह्णा त्यन्वनु॑ गृह्णाति
    । प्रति॑ गृह्णाति गृह्णाति भव॑न्तीर् गृह्णाति गृह्णा त्या भव॑न्तीर् गृह्णाति । यो यो गृ॑ह्णाति गृह्णाति
    व ति॑ष्ठति तिष्ठ त्ये त्यथाथ॑ तिष्ठति तिष्ठ त्ती तीति॑ छिनत्ति छिन प्र तु तु प्र प्र तु । इती त्य॑ह्वथा
    अह्वथा र् वृष्टि॑ रुवाचो वाच ञ्जीव॑न्तीः पिबन्ति पिबन्ति स ञ्जीव॑न्तीः पिबन्ति । यो यः पि॑बन्ति पिबन्ति
    दो जा॑यते जायते ऽन्ना र्यं॑ ँयद् यद॑न्वाहा तेन॑ प्रीणाति प्रीणाति यद् यद् द॑धाति दधाति यद् वै वै यद्
    यद् वै । ं ँयद् यद् विलि॑ष्टम् । र्यं॑ ँयद् यद॑न्वाहा व प्री॑णाति प्रीणा त्ये जाप॑तिः प्रीणाति प्रीणाति
    प्र नो॑ ऽमन्यता मन्यत रिरिचा जाप॑ति मृद्ध्नो त्यृद्ध्नोति प्र तो ऽप॑रिमित ऋद्ध्नो त्यृद्ध्नो वै यद्
    यद् वै वै यत् । असु॑रा अकुर्वता कुर्व ते ते॑ ऽकुर्वता कुर्वत भ्रातृ॑व्यो ऽस्यास्य भ्रातृ॑व्यो भवति
    भवति त्वे॑वैव तु त्वे॑व । र् त्ये॑वैवे ष्टा॑पू स म॑र्द्धय त्यर्द्धयति नूर्ज॑स्वा नर्द्धय त्यर्द्धय
    नौ द॑धाति दधाति प्राणापा नौ पा॑हि पाहि समानव्या हि ह्य॑मुष्मिन्न्॑ । ज्ञेन॑ तिष्ठति तिष्ठति य स्तिष्ठति
    तिष्ठति दर् ग्ने र॑नुदन्ता नुदन्ता ञ्जयति जयति दरशपूर्णमा ं ँवि वि वाज॑वतीभ्या यो यः प्रति॑ष्ठित्यै
    तरःइ॑ ब्रूयाद् ब्रूया ना मु॑ञ्चामि मुञ्चामि रश प्रति॑ तिष्ठति तिष्ठति सोम॑स्य तिष्ठति तिष्ठति स्त्वष्टु॑र्
    धत्ते धत्ते म्प्र प्र भू॑यासम् । त्तस्मा॑ दजायता जायत वेद्य॑ मविन्दन्ता विन्दन्त ं ँवेद्य॑ मविन्दन्त
    । त्तद॑विन्दन्ता विन्दन्त नाम॑ गृह्णीयाद् गृह्णीया त्तद् गृ॑ह्णीयाद् गृह्णीया सर्वं॑ ँवृङ्क्ते वृङ्क्ते
    तव॑न्तं ँवृङ्क्ते वृङ्क्ते घृ ं ँवै वै रिच्य॑मानाम् । ते ऽन्वनु॑ रिच्यते । म्प्या॑यते प्यायते य म्प्या॑ययति
    प्याययति म्प्या॑यते प्यायते य गं ँयद् यद् य॑जमानभा व प्री॑णाति प्रीणा त्ये न्प्रीणाति प्रीणा त्ये
    गं ँयद् यद् य॑जमानभा प्रति॑ ष्ठापयति स्थापयति थ्स्था॑पयति स्थापय त्ये सर्वा॑णि धत्ते धत्ते त्विजो॑
    मार्जयन्ताम् । द्यौर् द्यौर् जाग॑ती र् द्यौर् द्यौ रानु॑ष्टुभीः । यद् यच् छि॑थ्सि छिथ्सि क्ष्या मा
    मा ऽऽवृ॑क्षि । प्र वै वै प्र प्र वै । काच् च्य॑वते च्यवते लो यो यश्च्य॑वते च्यवते दिनो॑ वदन्ति वदन्ति
    ब्रह्मवा मान् क्र॑मेत क्रमेत विष्णुक्र यो यः क्र॑मेत क्रमेत प्रति॑ तिष्ठति तिष्ठति न्ति॑ष्ठति तिष्ठत्यै
    त्मनो ऽर्द्धो ऽर्द्ध॑ आ समि॑द्धो अग्ने ऽग्ने द्धा दी॑दिहि दीदिहि समे वै वै गारःअ॑पत्यस्य । ञ्चर्यते
    चर्यत आग्निपावमा ङ्गारःअ॑पत्य माग्निपावमा नाति॑ तिष्ठते तिष्ठते पु ते ऽग्ने ऽग्ने॑ गृहपते । न्ता नि॑न्धिषीये
    न्धिषीय हेम नाम॑ गृह्णाति गृह्णाति ङ्गृ॑ह्णाति गृह्णात्यन्ना इति॑ ब्रूयाद् ब्रूया यस्य॑ ब्रूयाद् ब्रूया
    स्य॑ स्यास्य ब्रह्मवर्च त्रो जा॑यते जायते पु इति॑ ब्रूयाद् ब्रूया यस्य॑ ब्रूयाद् ब्रूया न्द॑धाति दधाति
    ब्रह्मवर्च नो वै वा अ॑प्रतिष्ठा स स यु॑नक्ति युनक्ति त्वितीति॑ मुञ्चतु मुञ्च प्रति॑ष्ठित्यै मुञ्चति
    मुञ्चति तं ँव्र॑तपते व्रतपते व्र त म॑चारिष मचारिषं ँव्र मिती त्य॑चारिष मचारिष व वि व्ये॑वैव वि । ॥
    शान्त्यै॑ सृजते सृजते ः पुन॑र् वर्तते वर्तते ज्ञो व॑र्तते वर्तते य द्धा ऽन॑वरुद्धा लभते लभ र् यो य
    आहि॑ताग्निः । ष्ट्वा प्राङ् प्रा ङि ष्ट्वे ष्ट्वा प्राङ् । त्क्रम्य॑ ब्रूयाद् ब्रूया दु त्क्रम्य॑
    ब्रूयात् । चः पु॑नातु पुनातु वा द्य स्व॑दाति स्वदा त्य त्रं ँव॑द्ध्याद् वद्ध्याद् वृ न्ते ते अ॑स्मिन्न्
    । पप्र॑यः पारयन्तु पारयन्तु ः पप्र॑यः पारयन्तु । न्त्विति॑ पारयन्तु । ॥ अश्वा॑जनि वाजिनि वाजि न्यश्वा॑जनि
    वाजिनि । वाजे॑षु वाजिनि वाजिनि स्यर्वा ऽर्वा॑ ऽसि । योज॑ना मिमीद्ध्वम् । वाजे॑वाजे गच्छत गच्छत धने॑षु
    विप्रा विप्रा विश्वे॑ शृण्वन्तु शृण्वन्तु जिनः॑ शृण्वन्तु शृण्वन्तु वा जिनो॑ भवन्तु भवन्तु वा न्तु॑रण्यति
    तुरण्यति क्षिप न्तुरण्यति तुरण्यति ग्री न वेर् वेर् न न वेः । र्द्धिनो॑ वाति वाति प्रग र्जोर्जा तरि॑त्रतः
    । त्वाय॑ गम्याद् गम्या दमृत वाजि॑नो वाजजितो वाजजितो ं ँवाजं॑ ँवाजजितो वाजजितो वाजि॑नो जिघ्रत जिघ्रत
    वाजि॑नो वाजजितो वाजजितो ं ँवाजं॑ ँवाजजितो वाजजितो यां ँया मिन्द्रे॑ण । अजी॑जिपत वनस्पतयो वनस्पत ता
    जी॑जिपत वनस्पतयः । मिन्द्रं॑ ँवनस्पतयो वनस्पतय ं ँवि वि मु॑च्यद्ध्वम् । मिति॑ मुच्यद्ध्वम् । ॥ सुवो॑
    रोक्ष्यामि रोक्ष्यामि स्सुवो॑ रोक्ष्यामि । वाजो॑ रोक्ष्यामि रोक्ष्यामि ं ँवाग् वाक् क॑ल्पता जाप॑ते
    रभूमा भूम प्र न्नाद्या॑य त्वा त्वा न्नाद्या॑य त्वा त्वा स्सु॑षुवे सुषुवे प्रस अग्रे॑ सुषुवे सुषुवे
    मधु॑मतीर् भवन्तु भवन्तु र् मधु॑मतीर् भवन्तु । ग्रियाम जाग्रियाम रा रोहि॑ता जाग्रियाम जाग्रियाम पु
    श्शि॑श्रिये शिश्रिये प्रस न्दा॑पयतु दापयतु प्रजा अच्छा च्छाग्ने ऽग्ने मा य॑च्छतु यच्छत्वर्य भि षि॑ञ्चामि
    सिञ्चा म्य स्ये न्द्र॑स्य सिञ्चामि सिञ्चा भि षि॑ञ्चामि सिञ्चा म्य द्व्य॑क्षरेण प्राणापा द्व्य॑क्षरेण
    प्राणापा र् विष्णु॑ रजयता मजयता त्रयो॑दशाक्षरेण त्रयोद त्रयो॑दशाक्षरेण त्रयोद द्रा श्चतु॑र्दशाक्षरेण
    द्रा श्चतु॑र्दशाक्षरेण । चतु॑र्दशाक्षरेण चतुर्द चतु॑र्दशाक्षरेण चतुर्द त्याः पञ्च॑दशाक्षरेण त्याः
    पञ्च॑दशाक्षरेण । पञ्च॑दशाक्षरेण पञ्चद पञ्च॑दशाक्षरेण पञ्चद मगृ॑हीतो ऽस्य स्युपया ष गृ॑ह्णामि गृह्णाम्ये
    मगृ॑हीत स्त्वा त्वोपया मगृ॑हीतो ऽस्यस्युपया ष गृ॑ह्णामि गृह्णा म्ये मगृ॑हीत स्त्वा त्वोपया मगृ॑हीतो
    ऽस्यस्युपया न्त्वा त्वा ऽन्तरिक्ष ष गृ॑ह्णामि गृह्णा म्ये ं ँविशि॑प्रियाणाम् । षो अ॑ग्रभी मग्रभी मे
    ङ्गृ॑ह्णामि गृह्णा म्युत्त मगृ॑हीतो ऽस्य स्युपया जाप॑तये त्वा त्वा प्र ष गृ॑ह्णामि गृह्णा म्ये जाप॑तये
    त्वा त्वा प्र अन्व हाहा न्वन्वह॑ । अन्वि दि दन्वन्वित् । ञ्जाय॑मान मजिहता जिहत त्रे न्द्रे न्द्र॑
    यजत्र यज ह मि॑न्द्रा णीन्द्राण्य रा म॑र्द्धीर् मर्द्धी वन्त॑ इन्द्रे न्द्र स्तु प्र प्र ह॑र्यश्व हर्यश्व
    ॑ हवामहे हवामहे प्रदा भा हि ह्यु॑भोभा हि । द् दक्षि॑णाद् यच्छ यच्छ को भ॑वतु भवतु सुमृडी श्ववे॑दा भवतु
    भवतु वि वीर्य॑स्य कृणोतु कृणोतु सु से स्या॑म स्याम सौमन तर् यु॑योतु युयोतु सनु प्रो षु सु प्रो प्रो
