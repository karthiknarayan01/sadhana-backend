id: shrikrishnadevitaramahakalpanavaksharamahamantrah
category: mantra
name:
  english: shrikrishnadevitaramahakalpanavaksharamahamantrah
  devanagari: श्रीकृष्णदेवीतारामहाकल्पनवाक्षरमहामन्त्रः
content:
  english: shrikrishnadevitara mahakalpanavaksharamahamantrah || viniyogah || asya mantrasya | shakti
    rishih | vrihati chandah | tarini devata | hri~ bijam | ai~ shaktih | sarvabhishtasiddhaye jape viniyogah
    || || rishyadinyasah || om shakti rishaye namah shirasi | om vrihati chandase namah mukhe | om tarini
    devatayai namah hridi | om hri~ bijaya namah guhye | om ai~ shaktaye namah padayoh | om sarvabhishtasiddhaye
    jape viniyogaya namah sarvange || iti rishyadinyasah || || karanyasah || om hra~ angushthabhyam namah
    | om hri~ tarjanibhyam namah | om hru~ madhyamabhyam namah | om hrai~ anamikabhyam namah | om hrau~
    kanishthikabhyam namah | om hrah karatalakaraprishthabhyam namah || iti karanyasah || || shadanganyasah
    || om hra~ hridayaya namah | om hri~ shirase svaha | om hru~ shikhayai vashat | om hrai~ kavacaya
    hu~ | om hrau~ netratrayaya vaushat | om hrah astraya phat || iti shadanganyasah || bhurbhuvassuvaromiti
    digbandhah || || varnanyasah || a~ a~ i~ i~ u~ u~ ri~ ri~ li~ li~ namah hridi | e~ ai~ o~ au~ a~ ah
    ka~ kha~ ga~ gha~ namah dakshabahau | na~ ca~ cha~ ja~ jha~ na~ ta~ tha~ da~ dha~ namah vamabahau
    | na~ ta~ tha~ da~ dha~ na~ pa~ pha~ ba~ bha~ namah dakshapade | ma~ ya~ ra~ la~ va~ sha~ sha~ sa~
    ha~ ksha~ namah vamapade | iti varnanyasah || || varnanyasah kalitantre || a a i i u u ri ri li li
    namah hridi | e ai o au am ah ka kha ga gha namah dakshabahau | na ca cha ja jha na ta tha da dha
    namah vamabahau | na ta tha da dha na pa pha ba bha namah dakshapade | ma ya ra la va sha sha sa ha
    ksha namah vamapade | iti varnanyasah || || vyapakanyasah || kri~ kli~ krishnadevi hri~ kri~ ai~ |
    iti murdhadi padaparyantam || iti vyapakanyasah || || diknyasah || om kalpavrikshaya namah purve |
    om manipithaya namah uttare | om shivaya namah pashcime | om kripalaya namah dakshine || iti diknyasah
    || || cakranyasah || om durgayai namah | om jayayai namah | om medhayai namah | om vijayayai namah
    | om suprabhayai namah | om kalyai namah | om gauryai namah | om shivayai namah || iti cakranyasah
    || || yoninyasah || om yonibijayai namah | om yonivishvayai namah | om yonirupayai namah | om yonikamayai
    namah | om yoniharayai namah | om yonirupayai namah | om yonicchayayai namah | om yonikamayai namah
    | om yonirupayai namah | om yonicintayai namah | om yoninityayai namah | om yonirupayai namah | om
    yonisiddhayai namah | om yonibuddhayai namah || iti yoninyasah || || dhyanam || krishnam lambodarim
    bhimam nagakundalashobhitam | raktamukhim lalajjihvam raktambaradharam katau || pinonnatastanimugram
    mahanagena veshtitam | shavasyopari deveshi tasyopari kapalike || 1|| nasagradhyananiratam mahaghoram
    varapradam | caturbhujam dirghakeshim dakshinasyordhvabahuna || bibhratim nalinimekam vamordhve panapatrakam
    | varabhayadharam devim madhyastham dakshavamayoh || 2|| pibantim raudhirim dharam panapatre sadashive
    | sarvasiddhipradam devim nityam girinivasinim || locanatrayasamyuktam nagayajnopavitinim | dirghanasam
    dirghajangham dirghangim dirghajihvikam || 3|| candrasuryagnibhedena trilocanasamanvitam | shatrunashakarim
    devim mahabhimam varapradam || vyaghracarmashirobaddham jagattrayavibhavitam | sadhakanam sukhakartrim
    sarvalokabhayankarim || evam bhuta mahadevim tarinim pranamamyaham || 4|| || pancapuja || lam prithivyatmikayai
    gandham samarpayami | ham akashatmikayai pushpaih pujayami | yam vayvatmikayai dhupamaghrapayami |
    ram agnyatmikayai dipam darshayami | vam amritatmikayai amritam mahanaivedyam nivedayami | sam sarvatmikayai
    sarvopacarapujam samarpayami || || japamala mantrah || om mam male mahamaye sarvamantrasvarupini |
    caturvargastvayinyastastasmanme siddhida bhava || || guru mantrah || om hrim siddhaguro prasida hrim
    om || || utkilana mantrah || stri~ kri~ kli~ krishnadevi hri~ kri~ ai~ om || || sanjivana mantrah
    || kri~ kli~ krishnadevi hri~ kri~ ai~ ai~ || || shapavimocana mantrah || om stri~ hri~ brahmashapam
    vimocaya vimocaya || || samputikarana mantrah || phat kri~ kli~ krishnadevi hri~ kri~ ai~ || || shrikrishnadevitara
    mahakalpa navakshara mahamantrah || kri~ kli~ krishnadevi hri~ kri~ ai~ || iti shrikrishnadevitara
    mahakalpanavaksharamahamantrah sampurnah |
  devanagari: श्रीकृष्णदेवीतारा महाकल्पनवाक्षरमहामन्त्रः ॥ विनियोगः ॥ अस्य मन्त्रस्य । शक्ति ऋषिः । वृहती
    छन्दः । तारिणी देवता । ह्रीँ बीजम् । ऐँ शक्तिः । सर्वाभीष्टसिद्धये जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः
    ॥ ॐ शक्ति ऋषये नमः शिरसि । ॐ वृहती छन्दसे नमः मुखे । ॐ तारिणी देवतायै नमः हृदि । ॐ ह्रीँ बीजाय नमः
    गुह्ये । ॐ ऐँ शक्तये नमः पादयोः । ॐ सर्वाभीष्टसिद्धये जपे विनियोगाय नमः सर्वाङ्गे ॥ इति ऋष्यादिन्यासः
    ॥ ॥ करन्यासः ॥ ॐ ह्राँ अङ्गुष्ठाभ्यां नमः । ॐ ह्रीँ तर्जनीभ्यां नमः । ॐ ह्रूँ मध्यमाभ्यां नमः । ॐ
    ह्रैँ अनामिकाभ्यां नमः । ॐ ह्रौँ कनिष्ठिकाभ्यां नमः । ॐ ह्रः करतलकरपृष्ठाभ्यां नमः ॥ इति करन्यासः
    ॥ ॥ षडङ्गन्यासः ॥ ॐ ह्राँ हृदयाय नमः । ॐ ह्रीँ शिरसे स्वाहा । ॐ ह्रूँ शिखायै वषट् । ॐ ह्रैँ कवचाय
    हुँ । ॐ ह्रौँ नेत्रत्रयाय वौषट् । ॐ ह्रः अस्त्राय फट् ॥ इति षडङ्गन्यासः ॥ भूर्भुवस्सुवरोमिति दिग्बन्धः
    ॥ ॥ वर्णन्यासः ॥ अँ आँ इँ ईँ उँ ऊँ ऋँ ॠँ ऌँ ॡँ नमः हृदि । एँ ऐँ ओँ औँ अँ अः कँ खँ गँ घँ नमः दक्षबाहौ
    । ङँ चँ छँ जँ झँ ञँ टँ ठँ डँ ढँ नमः वामबाहौ । णँ तँ थँ दँ धँ नँ पँ फँ बँ भँ नमः दक्षपादे । मँ यँ रँ
    लँ वँ शँ षँ सँ हँ क्षँ नमः वामपादे । इति वर्णन्यासः ॥ ॥ वर्णन्यासः कालीतन्त्रे ॥ अ आ इ ई उ ऊ ऋ ॠ ऌ
    ॡ नमः हृदि । ए ऐ ओ औ अं अः क ख ग घ नमः दक्षबाहौ । ङ च छ ज झ ञ ट ठ ड ढ नमः वामबाहौ । ण त थ द ध न प
    फ ब भ नमः दक्षपादे । म य र ल व श ष स ह क्ष नमः वामपादे । इति वर्णन्यासः ॥ ॥ व्यापकन्यासः ॥ क्रीँ क्लीँ
    कृष्णदेवी ह्रीँ क्रीँ ऐँ । इति मूर्धादि पादपर्यन्तम् ॥ इति व्यापकन्यासः ॥ ॥ दिक्न्यासः ॥ ॐ कल्पवृक्षाय
    नमः पूर्वे । ॐ मणिपीठाय नमः उत्तरे । ॐ शिवाय नमः पश्चिमे । ॐ कृपालाय नमः दक्षिणे ॥ इति दिक्न्यासः
    ॥ ॥ चक्रन्यासः ॥ ॐ दुर्गायै नमः । ॐ जयायै नमः । ॐ मेधायै नमः । ॐ विजयायै नमः । ॐ सुप्रभायै नमः । ॐ
    काल्यै नमः । ॐ गौर्यै नमः । ॐ शिवायै नमः ॥ इति चक्रन्यासः ॥ ॥ योनिन्यासः ॥ ॐ योनिबीजायै नमः । ॐ योनिविश्वायै
    नमः । ॐ योनिरूपायै नमः । ॐ योनिकामायै नमः । ॐ योनिहारायै नमः । ॐ योनिरूपायै नमः । ॐ योनिच्छायायै नमः
    । ॐ योनिकामायै नमः । ॐ योनिरूपायै नमः । ॐ योनिचिन्तायै नमः । ॐ योनिनित्यायै नमः । ॐ योनिरूपायै नमः
    । ॐ योनिसिद्धायै नमः । ॐ योनिबुद्धायै नमः ॥ इति योनिन्यासः ॥ ॥ ध्यानम् ॥ कृष्णां लम्बोदरीं भीमां नागकुण्डलशोभिताम्
    । रक्तमुखीं ललज्जिह्वां रक्ताम्बरधरां कटौ ॥ पीनोन्नतस्तनीमुग्रां महानागेन वेष्टिताम् । शवस्योपरि देवेशि
    तस्योपरि कपालिके ॥ १॥ नासाग्रध्याननिरतां महाघोरां वरप्रदाम् । चतुर्भुजां दीर्घकेशीं दक्षिणस्योर्ध्वबाहुना
    ॥ बिभ्रतीं नलिनीमेकां वामोर्ध्वे पानपात्रकम् । वराभयधरां देवीं मध्यस्थां दक्षवामयोः ॥ २॥ पिबन्तीं
    रौधिरीं धारां पानपात्रे सदाशिवे । सर्वसिद्धिप्रदां देवीं नित्यां गिरिनिवासिनीम् ॥ लोचनत्रयसंयुक्तां
    नागयज्ञोपवीतिनीम् । दीर्घनासां दीर्घजङ्घां दीर्घाङ्गीं दीर्घजिह्विकाम् ॥ ३॥ चन्द्रसूर्याग्निभेदेन
    त्रिलोचनसमन्विताम् । शत्रुनाशकरीं देवीं महाभीमां वरप्रदाम् ॥ व्याघ्रचर्मशिरोबद्धां जगत्त्रयविभाविताम्
    । साधकानां सुखकर्त्रीं सर्वलोकाभयङ्करीम् ॥ एवं भूता महादेवीं तारिणीं प्रणमाम्यहम् ॥ ४॥ ॥ पञ्चपूजा
    ॥ लं पृथिव्यात्मिकायै गन्धं समर्पयामि । हं आकाशात्मिकायै पुष्पैः पूजयामि । यं वाय्वात्मिकायै धूपमाघ्रापयामि
    । रं अग्न्यात्मिकायै दीपं दर्शयामि । वं अमृतात्मिकायै अमृतं महानैवेद्यं निवेदयामि । सं सर्वात्मिकायै
    सर्वोपचारपूजां समर्पयामि ॥ ॥ जपमाला मन्त्रः ॥ ॐ मां माले महामाये सर्वमन्त्रस्वरूपिणि । चतुर्वर्गस्त्वयिन्यस्तस्तस्मान्मे
    सिद्धिदा भव ॥ ॥ गुरु मन्त्रः ॥ ॐ ह्रीं सिद्धगुरो प्रसीद ह्रीं ॐ ॥ ॥ उत्कीलन मन्त्रः ॥ स्त्रीँ क्रीँ
    क्लीँ कृष्णदेवी ह्रीँ क्रीँ ऐँ ॐ ॥ ॥ सञ्जीवन मन्त्रः ॥ क्रीँ क्लीँ कृष्णदेवी ह्रीँ क्रीँ ऐँ ऐँ ॥ ॥
    शापविमोचन मन्त्रः ॥ ॐ स्त्रीँ ह्रीँ ब्रह्मशापं विमोचय विमोचय ॥ ॥ सम्पुटीकरण मन्त्रः ॥ फट् क्रीँ क्लीँ
    कृष्णदेवी ह्रीँ क्रीँ ऐँ ॥ ॥ श्रीकृष्णदेवीतारा महाकल्प नवाक्षर महामन्त्रः ॥ क्रीँ क्लीँ कृष्णदेवी
    ह्रीँ क्रीँ ऐँ ॥ इति श्रीकृष्णदेवीतारा महाकल्पनवाक्षरमहामन्त्रः सम्पूर्णः ।
