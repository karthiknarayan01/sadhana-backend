    नमः ॐ यशस्विन्यै नमः ॐ वसुन्धरायै नमः ॐ उदाराङ्गायै नमः ॐ हरिण्यै नमः ॐ हेममालिन्यै नमः ॐ धनधान्य
    कर्यै नमः ॐ सिद्धये नमः ॐ स्त्रैणसौम्यायै नमः ॐ शुभप्रदायै नमः ॐ नृपवेश्मगतायै नमः ॐ नन्दायै नमः ॐ
    वरलक्ष्म्यै नमः ॐ वसुप्रदायै नमः ॐ शुभायै नमः ॐ हिरण्यप्राकारायै नमः ॐ समुद्र तनयायै नमः ॐ जयायै नमः
    ॐ मङ्गलायै देव्यै नमः ॐ विष्णु वक्षःस्थल स्थितायै नमः ॐ विष्णुपत्न्यै नमः ॐ प्रसन्नाक्ष्यै नमः ॐ नारायण
    समाश्रितायै नमः ॐ दारिद्र्य ध्वंसिन्यै नमः ॐ सर्वोपद्रव वारिण्यै नमः ॐ नवदुर्गायै नमः ॐ महाकाल्यै
    नमः ॐ ब्रह्म विष्णु शिवात्मिकायै नमः ॐ त्रिकाल ज्ञान सम्पन्नायै नमः ॐ भुवनेश्वर्यै नमः इति श्रीलक्ष्म्यष्टोत्तरशतनामावलि
    समाप्तम्
