id: sri-kamakshi-stotram
category: stotram
name:
  english: Sri Kamakshi Stotram
  devanagari: श्रीकामाक्षिस्तोत्रम्
content:
  english: shri kamakshi stotram karanaparacidrapa kancipurasimni kamapithagata kamcana viharati karuna
    kashmirastabakakomalangalata kamcana kancinilayam karadhritakodandabanasrinishm kathinastanabharanamram
    kaivalyanandakandamavalambe aishvaryamindumauleh aikatmya prakritikancimadhyagatam aindavakishorashekhara
    maidamparyam cakasti nigamanam liye purahajaye maye tava tarunapallavacchaye carane candrabharana
    kancisharane natartisamharane kamaparipandhikamini kameshvari kamapithamadhyagate kamadudha bhava
    kamale kamakale kamakoti kamakshi samaravijayakoti sadhakanandadhari mridugunaparipeti mukhyakadambavati
    muninutaparipati mohitajandakoti paramashivavaghuti patu mam kamakoti jaya jaya jagadamba shive jaya
    jaya kamakshi jaya jayadrisute jaya jaya maheshadayite jaya jaya cidraganakaumudi dhare
  devanagari: श्री कामाक्षि स्तोत्रम् कारणापरचिद्रपा कञ्चीपुरसीम्नि कामपीठगता कांचन विहरति करूणा काष्मीरस्तबककोमलाङ्गलता
    कंचन काञ्चीनिलयं करधृतकोदण्डबाणसृणिश्म् कठिनस्तनभरनम्रं कैवल्यानन्दकन्दमवलम्बे ऐश्वर्यमिन्दुमौलेः
    ऐकात्म्य प्रकृतिकाञ्चिमध्यगताम् ऐन्दवकिशोरशेखर मैदंपर्यं चकास्ति निगमानाम् लीये पुरहजाये माये तव तरूणपल्लवच्छाये
    चरणे चन्द्रभरण काञ्चीशरणे नतार्तिसंहरणे कामपरिपन्धिकामिनि कामेश्वरी कामपीठमध्यगते कामदुधा भव कमले
    कामकले कामकोटि कामाक्षी समरविजयकोटी साधकानन्दधारी मृदुगुणपरिपेटी मुख्यकादम्बवाटी मुनिनुतपरिपाटी मोहिताजाण्डकोटी
    परमशीववघूटी पातु मां कामकोटी जय जय जगदम्ब शिवे जय जय कामाक्षी जय जयाद्रिसुते जय जय महेशदयिते जय जय
    चिद्रगनकौमुदी धरे
