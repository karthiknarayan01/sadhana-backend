id: daksh-9
category: stotram
name:
  english: daksh 9
  devanagari: दक्श् ९
content:
  english: mindradisevyapadapankajamishamide || 3|| dyudrodhah svarnamayasanastham mudrollasadbahumudarakayam
    | sadrohininathakaḻavatamsam bhadrodadhim kancana cintayamah || 4|| udyadbhaskarasannibham trinayanam
    shvetangaragaprabham balam maunjidharam prasannavadanam nyagrodhamulesthitam | pingaksham mrigashavakasthitikaram
    subrahmasutrakritim bhaktanamabhayapradam bhayaharam shridakshinamurtikam || 5|| shrikantadruhinopamanyu
    tapana skandendranandyadayah pracinaguravo'piyasya karunaleshadgatagauravam | tam sarvadigurum manojnavapusham
    mandasmitalankritam cinmudrakritimugdhapaninaḻinam cittam shivam kurmahe || 6|| kapardinam candrakaḻavatamsam
    trinetramindupatimananojvalam | caturbhujam jnanadamakshasutra
  devanagari: मिन्द्रादिसेव्यपदपङ्कजमीशमीडे ॥ ३॥ द्युद्रोधः स्वर्णमयासनस्थं मुद्रोल्लसद्बाहुमुदारकायम्
    । सद्रोहिणीनाथकळावतंसं भद्रोदधिं कञ्चन चिन्तयामः ॥ ४॥ उद्यद्भास्करसन्निभं त्रिणयनं श्वेताङ्गरागप्रभं
    बालं मौञ्जिधरं प्रसन्नवदनं न्यग्रोधमूलेस्थितम् । पिङ्गाक्षं मृगशावकस्थितिकरं सुब्रह्मसूत्राकृतिम्
    भक्तानामभयप्रदं भयहरं श्रीदक्षिणामूर्तिकम् ॥ ५॥ श्रीकान्तद्रुहिणोपमन्यु तपन स्कन्देन्द्रनन्द्यादयः
    प्राचीनागुरवोऽपियस्य करुणालेशाद्गतागौरवम् । तं सर्वादिगुरुं मनोज्ञवपुषं मन्दस्मितालङ्कृतं चिन्मुद्राकृतिमुग्धपाणिनळिनं
    चित्तं शिवं कुर्महे ॥ ६॥ कपर्दिनं चन्द्रकळावतंसं त्रिणेत्रमिन्दुपतिमाननोज्वलम् । चतुर्भुजं ज्ञानदमक्षसूत्र
