    kevalo'ham sadashivah || 24|| adhyatma 69 nishkriyo'smyavikaro'smi nirguno'smi nirakritih || 25||
    kundika 25 nirvikalpo'smi nityo'smi niralambo'smi nirdvayah || 26|| kundika 25 kevalakhandabodho'ham
    svanando'ham nirantarah || 27|| kundika 26 satyam jnanamanantam yatparam brahmahameva tat || 28||
    varaha 3|2 kevalam citsadanandam brahmaivaham janardanah || 29|| varaha 3|19 ashubhashubhasankalpaih
    samshanto'smi niramayah || 30|| sannyasa 2|49 nashteshtanishtakalanah samvinmatraparo'smyaham || 31||
