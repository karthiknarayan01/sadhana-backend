id: shanskrit
category: upanishad
name:
  english: shanskrit
  devanagari: षन्स्क्रित्
content:
  english: syam satyatah | pashubhavah sahayo'bhut pashubhavo'sti badhakah || parinamyastvaya tarkah sambodhau
    suvyavasthite | sarvatmana bhava jyotirlakshyametad dhruvam tava || parinamyastvaya yatnah svatmashakteh
    pariplave sarvadaikarase shante mahamahimashalini | bhava cicchaktireva tvam lakshyametad dhruvam
    tava || parinamyastvaya bhogahsamanirvishayonmade | sarvatmana bhavanando lakshyametad dhruvam tava
    || parinamya pruthugvyashtistvayeyam vishvamanave | sarvatmana bhaverdivyo lakshyametad dhruvam tava
    || parinamyah pannashcapi pashvanathe tatha tvaya | sarvatmana bhaveh krishnah lakshyametad dhruvam
    tava || na yanmaya shakyamihadya kartum karishyamanasya hi lakshanam tat | asambhavatvanubhavo|bhave'smin
    sambhavananam shubhasutrapatah || vinashvaram vishvamalakshyatedam yato hyasadhyam vadato virodhi
    | tasmatprabhuh shashvatasatsvarupah satsvannijat sarvamidam sasarja || asambhavo nama hi sambhavanamasadhitanam
    brihatam samashtih | uccasthiteravaranam sa yatramargasya cadyapi na langhitasya || manushyajateh
    pragatiryadipsitasbhavana dhunu hi purvakalpitah | vicarana cetati caivamahata bhavatyapurvam navasarjanakshama
    | no cennijavrittimasau hi yantravat | karoti tam vetti ca satkriyam bhramat || nijaksha bhramirevaika
    na gatirmanavatmanah | akshayajyotisho'pyanya suryasyasti parikrama || atmanam viddhi pashcacca kuru
    karma ca cintanam | pranavaccintanam sarvam sricyamanajaganmayam || yathartha karma yat taddhi vicaro
    vyaktatam gatah | vijna ka'pi yato lilamarebhe hyatmasamvidi | divyayam
  devanagari: स्यां सत्यतः । पशुभावः सहायोऽभूत् पशुभावोऽस्ति बाधकः ॥ परिणम्यस्त्वया तर्कः सम्बोधौ सुव्यवस्थिते
    । सर्वात्मना भव ज्योतिर्लक्ष्यमेतद् ध्रुवं तव ॥ परिणम्यस्त्वया यत्नः स्वात्मशक्तेः परिप्लवे सर्वदैकरसे
    शान्ते महामहिमशालिनि । भव चिच्छक्तिरेव त्वं लक्ष्यमेतद् ध्रुवं तव ॥ परिणम्यस्त्वया भोगःसमनिर्विषयोन्मदे
    । सर्वात्मना भवानन्दो लक्ष्यमेतद् ध्रुवं तव ॥ परिणम्या प्रुथुग्व्यष्टिस्त्वयेयं विश्वमानवे । सर्वात्मना
    भवेर्दिव्यो लक्ष्यमेतद् ध्रुवं तव ॥ परिणम्यः पन्नश्चापि पश्वनाथे तथा त्वया । सर्वात्मना भवेः कृष्णः
    लक्ष्यमेतद् ध्रुवं तव ॥ न यन्मया शक्यमिहाद्य कर्तुं करिष्यमाणस्य हि लक्षणं तत् । असम्भवत्वानुभवो।भवेऽस्मिन्
    सम्भावनानां शुभसूत्रपातः ॥ विनश्वरं विश्वमलक्ष्यतेदं यतो ह्यसाध्यं वदतो विरोधि । तस्मात्प्रभुः शाश्वतसत्स्वरुपः
    सत्स्वान्निजात् सर्वमिदं ससर्ज ॥ असम्भवो नाम हि सम्भवानामसाधितानां बृहतां समष्टिः । उच्चस्थितेरावरणं
    स यात्रामार्गस्य चाद्यापि न लङ्घितस्य ॥ मनुष्यजातेः प्रगतिर्यदीप्सितास्भावना धूनु हि पूर्वकल्पिताः
    । विचारणा चेतति चैवमाहता भवत्यपूर्वं नवसर्जनक्षमा । नो चेन्निजावृत्तिमसौ हि यन्त्रवत् । करोति तां
    वेत्ति च सत्क्रियां भ्रमात् ॥ निजाक्ष भ्रमिरेवैका न गतिर्मानवात्मनः । अक्षयज्योतिषोऽप्यन्या सूर्यस्यास्ति
    परिक्रमा ॥ आत्मानं विद्धि पश्चाच्च कुरु कर्म च चिन्तनम् । प्राणवच्चिन्तनं सर्वं सृच्यमानजगन्मयम् ॥
    यथार्थ कर्म यत् तद्धि विचारो व्यक्ततां गतः । विज्ञा काऽपि यतो लीलामारेभे ह्यात्मसंविदि । दिव्यायां
