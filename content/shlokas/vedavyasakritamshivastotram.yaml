id: vedavyasakritamshivastotram
category: stotram
name:
  english: vedavyasakritamshivastotram
  devanagari: वेदव्यासकृतंशिवस्तोत्रम्
content:
  english: vedavyasakritam shivastotram vedavyasa uvaca | devadeva mahabhaga sharanagatavatsala | vanmanah
    karmadushprapa yoginamapyagocara || 1|| mahimanam na te veda vidamasurumapate | tvameva jagatah karta
    dharta harta tathaiva ca || 2|| tvamadyah sarvadevanam saccidananda ishvarah | namagotre na va te
    stah sarvajno'si sadashiva || 3|| tvameva paramam brahma mayapashanivartakah | gunatrayairna liptastvam
    padmapatramivambhasa || 4|| na te janma na va shilam na desho na kulam ca te | ittham bhuto'pishvaratvam
    trilokyah kamamavaheh || 5|| na ca brahma na lakshmisho na ca sendra divaukasah | na yogindra vidustattvam
    yasya tam tvamupasmahe || 6|| tvattah sarvam tvam hi sarvam gaurishastvam purantakah | tvam balastvam
    yuva vriddhastam tvam hridi yunajmyaham || 7|| namastasmai maheshaya bhaktadhyeyaya shambhave | puranapurushayaddha
    shankaraya paratmane || 8|| iti shivapurane umasamhitayam catushcatvarimshadhyayantargatam vedavyasakritam
    shivastotram samaptam | shivapurana | umasamhita | adhyaya 44
  devanagari: वेदव्यासकृतं शिवस्तोत्रम् वेदव्यास उवाच । देवदेव महाभाग शरणागतवत्सल । वाङ्मनः कर्मदुष्प्राप
    योगिनामप्यगोचर ॥ १॥ महिमानं न ते वेदा विदामासुरुमापते । त्वमेव जगतः कर्ता धर्ता हर्ता तथैव च ॥ २॥
    त्वमाद्यः सर्वदेवानां सच्चिदानन्द ईश्वरः । नामगोत्रे न वा ते स्तः सर्वज्ञोऽसि सदाशिव ॥ ३॥ त्वमेव परमं
    ब्रह्म मायापाशनिवर्तकः । गुणत्रयैर्न लिप्तस्त्वं पद्मपत्रमिवाम्भसा ॥ ४॥ न ते जन्म न वा शीलं न देशो
    न कुलं च ते । इत्थं भूतोऽपीश्वरत्वं त्रिलोक्याः काममावहेः ॥ ५॥ न च ब्रह्मा न लक्ष्मीशो न च सेन्द्रा
    दिवौकसः । न योगीन्द्रा विदुस्तत्त्वं यस्य तं त्वामुपास्महे ॥ ६॥ त्वत्तः सर्वं त्वं हि सर्वं गौरीशस्त्वं
    पुरान्तकः । त्वं बालस्त्वं युवा वृद्धस्तं त्वां हृदि युनज्म्यहम् ॥ ७॥ नमस्तस्मै महेशाय भक्तध्येयाय
    शम्भवे । पुराणपुरुषायाद्धा शङ्कराय परात्मने ॥ ८॥ इति शिवपुराणे उमासंहितायां चतुश्चत्वारिंशाध्यायान्तर्गतं
    वेदव्यासकृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । उमासंहिता । अध्याय ४४
meaning: {}
