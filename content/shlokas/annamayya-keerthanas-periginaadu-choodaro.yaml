id: annamayya-keerthanas-periginaadu-choodaro
category: stotram
name:
  english: Annamayya Keerthanas Periginaadu Choodaro
content:
  english: pèriginadu cudaro pèdda hanumantudu | paragi nana vidyala balavantudu || rakkasula paliki ranaranga
    shurudu vèkkasapu ekanga virudu | dikkulaku sanjivi tèccina dhirudu akkajamainatti akarudu || lalimirina
    yatti lavula bhimudu balu kapikula sarvabhaumudu | nèlakònna lanka nirthumadhamudu talapuna shriramu
    natmaramudu || devakaryamula dikkuvarenyudu bhavimpagala tapah phala punyudu | shrivenkateshvara sevagraganyudu
    savadhanudu sarvasharanyudu ||
  devanagari: पॆरिगिनाडु चूडरो पॆद्द हनुमन्तुडु । परगि नाना विद्यल बलवन्तुडु ॥ रक्कसुल पालिकि रणरङ्ग शूरुडु
    वॆक्कसपु एकाङ्ग वीरुडु । दिक्कुलकु सञ्जीवि तॆच्चिन धीरुडु अक्कजमैनट्टि आकारुडु ॥ ललिमीरिन यट्टि लावुल
    भीमुडु बलु कपिकुल सार्वभौमुडु । नॆलकॊन्न लङ्का निर्थूमधामुडु तलपुन श्रीरामु नात्मारामुडु ॥ देवकार्यमुल
    दिक्कुवरेण्युडु भाविम्पगल तपः फल पुण्युडु । श्रीवेङ्कटेश्वर सेवाग्रगण्युडु सावधानुडु सर्वशरण्युडु
    ॥
