id: matribhuteshvarastotram
category: stotram
name:
  english: matribhuteshvarastotram
  devanagari: मातृभूतेश्वरस्तोत्रम्
content:
  english: suputranilakanthanamadheyavakturishtadam | mrigam hareshumahareti vakturashu muktidam namami
    matribhutasambamurtimeva santatam || 7|| samastalokadagdhukamakalakutabhakshakam bhishagvaram trivishtapasya
    matribhutamishvaram | mrikandusunurakshanaya mrityudarpabhanjakam namami matribhutasambamurtimeva
    santatam || 8|| anathagarbhinistriyah shishoh sutasya me sada sukhapradam sumatrivat sharanyameva
    nanyatha | kriparasardramanaseshamacyutapriyam shivam namami matribhutasambamurtimeva santatam ||
    9|| sugandhikuntalambikasametamadrivasinam samipavartiranganathajambukeshvaraprabhum | anathagarbhinivadhusukhaprasutikarakam
    namami matribhutasambamurtimeva santatam || 10|| iyam samastakamada navaprasunamalika nrinamasheshakarmajanyashokakakshapavaka
    | sudarshanakhyapanditena bhaktiyuktacetasa vilikhyate shivaprasadaleshalabhavaibhavat || 11|| ya
    kripa garbhinitrane ya kripa muninandane | matribhuteshvara kshipram sa kripa mayi diyatam || 12||
    ya kripa munisantrane ya kripa kapinayake | ya vibhishanarakshayam sa kripa mayi diyatam || 13|| agratah
    prishthatashcaiva parshvatashca mahabalau | akarnapurnadhanvanau rakshetam ramalakshmanau
  devanagari: सुपुत्रनीलकण्ठनामधेयवक्तुरिष्टदम् । मृगं हरेषुमाहरेति वक्तुराशु मुक्तिदं नमामि मातृभूतसाम्बमूर्तिमेव
    सन्ततम् ॥ ७॥ समस्तलोकदग्धुकामकालकूटभक्षकं भिषग्वरं त्रिविष्टपस्य मातृभूतमीश्वरम् । मृकण्डुसूनुरक्षणाय
    मृत्युदर्पभञ्जकं नमामि मातृभूतसाम्बमूर्तिमेव सन्ततम् ॥ ८॥ अनाथगर्भिणीस्त्रियः शिशोः सुतस्य मे सदा
    सुखप्रदं सुमातृवत् शरण्यमेव नान्यथा । कृपारसार्द्रमानसेशमच्युतप्रियं शिवं नमामि मातृभूतसाम्बमूर्तिमेव
    सन्ततम् ॥ ९॥ सुगन्धिकुन्तलाम्बिकासमेतमद्रिवासिनं समीपवर्तिरङ्गनाथजम्बुकेश्वरप्रभुम् । अनाथगर्भिणीवधूसुखप्रसूतिकारकं
    नमामि मातृभूतसाम्बमूर्तिमेव सन्ततम् ॥ १०॥ इयं समस्तकामदा नवप्रसूनमालिका नृणामशेषकर्मजन्यशोककक्षपावका
    । सुदर्शनाख्यपण्डितेन भक्तियुक्तचेतसा विलिख्यते शिवप्रसादलेशलाभवैभवात् ॥ ११॥ या कृपा गर्भिणीत्राणे
    या कृपा मुनिनन्दने । मातृभूतेश्वर क्षिप्रं सा कृपा मयि दीयताम् ॥ १२॥ या कृपा मुनिसन्त्राणे या कृपा
    कपिनायके । या विभीषणरक्षायां सा कृपा मयि दीयताम् ॥ १३॥ अग्रतः पृष्ठतश्चैव पार्श्वतश्च महाबलौ । आकर्णपूर्णधन्वानौ
    रक्षेतां रामलक्ष्मणौ
