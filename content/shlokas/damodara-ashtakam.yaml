id: damodara-ashtakam
category: stotram
name:
  english: Damodara Ashtakam
content:
  english: namamishvaram saccidanandarupam lasatkundalam gokule bhrajamanam | yashodabhiyolukhaladdhavamanam
    paramrishtamatyantato drutya gopya || || rudantam muhurnetrayugmam mrijantam karambhojayugmena satankanetram
    | muhuh shvasakampatrirekhankakantha damodaram bhaktibaddham || || itidrik svalilabhiranandakunde
    svaghosham nimajjantamakhyapayantam | tadiyeshitajneshu bhaktairjitatvam punah prematastam shatavritti
    vande || || varam deva moksham na mokshavadhim va na canyam vrine'ham vareshadapiha | idam te vapurnatha
    gopalabalam sada me manasyavirastam kimanyaih || || idam te mukhambhojamatyantanilair vritam kuntalaih
    snigdha raktaishca gopya | muhushcumbitam bimbaraktadharam me manasyavirastam alam lakshalabhaih ||
    || namo deva damodarananta vishno prasida prabho duhkhajalabdhimagnam | kripadrishtivrishtyatidinam
    batanu grihanesha mam ajnamedhyakshidrishyah || || kuberatmajau baddhamurtyaiva yadvat tvaya mocitau
    bhaktibhajau kritau ca | tatha premabhaktim svakam me prayaccha na mokshe graho me'sti damodareha
    || || namaste'stu damne sphuraddiptidhamne tvadiyodarayatha vishvasya dhamne | namo radhikayai tvadiyapriyayai
    namo'nantalilaya devaya tubhyam || || iti shrimadpadmapurane shri damodarashtakam sampurnam ||
  devanagari: नमामीश्वरं सच्चिदानन्दरूपं लसत्कुण्डलं गोकुले भ्राजमानम् । यशोदाभियोलूखलाद्धावमानं परामृष्टमत्यन्ततो
    द्रुत्य गोप्या ॥ ॥ रुदन्तं मुहुर्नेत्रयुग्मं मृजन्तं कराम्भोजयुग्मेन सातङ्कनेत्रम् । मुहुः श्वासकम्पत्रिरेखाङ्ककण्ठ
    दामोदरं भक्तिबद्धम् ॥ ॥ इतीदृक् स्वलीलाभिरानन्दकुण्डे स्वघोषं निमज्जन्तमाख्यापयन्तम् । तदीयेषिताज्ञेषु
    भक्तैर्जितत्वं पुनः प्रेमतस्तं शतावृत्ति वन्दे ॥ ॥ वरं देव मोक्षं न मोक्षावधिं वा न चान्यं वृणेऽहं
    वरेषादपीह । इदं ते वपुर्नाथ गोपालबालं सदा मे मनस्याविरास्तां किमन्यैः ॥ ॥ इदं ते मुखाम्भोजमत्यन्तनीलैर्
    वृतं कुन्तलैः स्निग्ध रक्तैश्च गोप्या । मुहुश्चुम्बितं बिम्बरक्तधरं मे मनस्याविरास्तां अलं लक्षलाभैः
    ॥ ॥ नमो देव दामोदरानन्त विष्णो प्रसीद प्रभो दुःखजालाब्धिमग्नम् । कृपादृष्टिवृष्ट्यातिदीनं बतानु गृहाणेश
    मां अज्ञमेध्यक्षिदृश्यः ॥ ॥ कुबेरात्मजौ बद्धमूर्त्यैव यद्वत् त्वया मोचितौ भक्तिभाजौ कृतौ च । तथा प्रेमभक्तिं
    स्वकं मे प्रयच्छ न मोक्षे ग्रहो मेऽस्ति दामोदरेह ॥ ॥ नमस्तेऽस्तु दाम्ने स्फुरद्दीप्तिधाम्ने त्वदीयोदरायाथ
    विश्वस्य धाम्ने । नमो राधिकायै त्वदीयप्रियायै नमोऽनन्तलीलाय देवाय तुभ्यम् ॥ ॥ इति श्रीमद्पद्मपुराणे
    श्री दामोदराष्टाकं सम्पूर्णम् ॥
