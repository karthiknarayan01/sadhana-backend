id: purushottamakavacam
category: kavacha
name:
  english: purushottamakavacam
  devanagari: पुरुषोत्तमकवचम्
content:
  english: pura kritayuge devah savita sushuve sutam | yamuneti ca vikhyatam devatam ce shucishmatim ||
    2|| papraccha pitaram sa ca kah paro vaparo yatah | katham prapyo bhavedesha tatah praha pita sutam
    || 3|| tapasa brahmana purvam jagatsrishtamiti shrutam | tapasa bhavati devam sviyam vijnatumarhati
    || 4|| sa kalindagirim prapya tapashcakre sudarunam | dhyayanti ramanam devam brahmakalpamaninayat
    || 5|| tatah prasanno bhagavan shrikrishno bhaktavatsalah | pradurbhuya girau tatra venunadam cakara
    sah || 6|| tasya nadasya harshena dravibhuta tato hi sa | divyarupa tato jata jagatam pavani para
    || 7|| tasyai prasanno bhagavan navakanjamayim srajam | sarupyam ca dadau praha priya bhava subhaktitah
    || 8|| idam namnamsahasram me patha yena vibudhyase | mama loke saridrupe divyarupe pravishyatam ||
    9|| asmimshca te drave kante majjatam bhuktimuktayah | bhavishyanti vashibhuta bhaktirme na ca tvam
    vina || 10|| datva sahasranamakhyam stotram sakhyai hariryayo | vivasvantamanujnapya sa gata harina
    saha || 11|| idam stotram maya labdham svayam tushtadvivasvatah | punyam svastyayanam bhavyamayushyam
    haribhaktidam || 12|| pathadasya prajayante punyah kama manogatah | putrashcapi prasuyante vinitashcirajivinah
    || 13|| bhagyavantah sukritinah pitribhakta hareh priyah | kanta bhavanti satkanta dantashcapi pativratah
    || 14|| caturddasha maharatnabhokta bhavati pathakrit | maharogairvimucyeta darunairbandhanairapi
    || 15|| shatrubhishca vishaih shastraih krityabhishca grahairapi | bhutaih pretaishca rakshobhirvahnivayumahabhayaih
    || 16|| mucyate varidhau majjan trayate caparannapi | svacakre paracakre ca senakshobhe prajakshaye
    || 17|| mahamaribhaye canyabhaye vatashane bhaye | gatam rajyam gatam lakshmim ruddham va darunairjanaih
    || 18|| samrajyalakshmimapnoti kimanyat kathayami bhoh | daridryanmucyate so'tha kubera iva jayate
    || 19|| vidyaya'sau girishah syat sureshu tridasheshvarah | vadanyatam vidhih sakshallavanyanmadanopamah
    || 20|| mahadevan vashe kuryad bhutanyapi vashe nayet | viparyayam ca jagatam kuryadbandham divaukasam
    || 21|| lokanam ranjanam kuryannarinamapi manmatham | pujyate jagatimadhye lokanugrahakridbhavet ||
    22|| tasya vak jayate vetta bhutabhavyabhavajjusham | yadyadicchati tatsarvam karastham caiva pashyati
    || 23|| haribhaktastu bhagavallilam pashyati sarvashah | nijadoshan paragunan haridase mahatmanam
    || 24|| dainyapritim samapnoti gurubhaktim ca vindati | tatah kritartha eva syannishevyah syanmahatmanam
    || 25|| hastau padau ca prakshalya shucih shuddhatmavasanah | jitendriyo vagyatashca purvasyah svasane
    sthitah || 26|| acamya prananayamya kritarakshyah pathettatah | dhyayan bhagavato rupam vanchitarthaphalapradam
    || 27|| hridayam gopikanatho bhalam me jagadishvarah | shrikrishno me shikham patu kavacam patu gopatih
    || 28|| netre patu dadhadvetramastram venudharo harih | murddhadikanthaparyantam shrikrishnah sarvada'vatu
    || 29|| kanthadimadhyaparyantam shrigovindo'pi rakshatu | shrigopijanakantastu payanmadhyadipadatah
    || 30|| shrimanmukundacaranau sharanam me'stu sarvatah | shrikrishnah sharanam me'stu balye balasvarupadhrik
    || 31|| govindashsharanam me'stu tarunye tarunipriyah | keshavah sharanam me'stu varddhakye vriddhavanditah
    || 32|| apannam gokuladhishah prapannam giridharanah | vipannam nandanando mam sada vrajapurandarah
    || 33|| dine kalindinikantah ratrau shriradhikeshvarah | sandhyasu sandhivelasu shrimaccandravalipriyah
    || 34|| agrato me jagannathah prishthato badaripatih | parshvato dvarakanatho ranganathastatha harih
    || 35|| iti shrishandilyasamhitayam pancame bhaktikhande ekonavimsho'dhyaye purushottamakavacam sampurnam
    |
  devanagari: पुरा कृतयुगे देवः सविता सुषुवे सुताम् । यमुनेति च विख्यातां देवतां चे शुचिष्मतीम् ॥ २॥ पप्रच्छ
    पितरं सा च कः परो वापरो यतः । कथं प्राप्यो भवेदेष ततः प्राह पिता सुताम् ॥ ३॥ तपसा ब्रह्मणा पूर्वं
    जगत्सृष्टमिति श्रुतम् । तपसा भवती देवं स्वीयं विज्ञातुमर्हति ॥ ४॥ सा कलिन्दगिरिं प्राप्य तपश्चक्रे
    सुदारुणम् । ध्यायन्ती रमणं देवं ब्राह्मकल्पमनीनयत् ॥ ५॥ ततः प्रसन्नो भगवान् श्रीकृष्णो भक्तवत्सलः
    । प्रादुर्भूय गिरौ तत्र वेणुनादं चकार सः ॥ ६॥ तस्य नादस्य हर्षेण द्रवीभूता ततो हि सा । दिव्यरूपा ततो
    जाता जगतां पावनी परा ॥ ७॥ तस्यै प्रसन्नो भगवान् नवकञ्जमयीं स्रजम् । सारूप्यं च ददौ प्राह प्रिया भव
    सुभक्तितः ॥ ८॥ इदं नाम्नांसहस्रं मे पठ येन विबुध्यसे । मम लोके सरिद्रूपे दिव्यरूपे प्रविश्यताम् ॥
    ९॥ अस्मिंश्च ते द्रवे कान्ते मज्जतां भुक्तिमुक्तयः । भविष्यन्ति वशीभूता भक्तिर्मे न च त्वां विना ॥
    १०॥ दत्वा सहस्रनामाख्यं स्तोत्रं सख्यै हरिर्ययो । विवस्वन्तमनुज्ञाप्य सा गता हरिणा सह ॥ ११॥ इदं स्तोत्रं
    मया लब्धं स्वयं तुष्टाद्विवस्वतः । पुण्यं स्वस्त्ययनं भव्यमायुष्यं हरिभक्तिदम् ॥ १२॥ पाठादस्य प्रजायन्ते
    पुण्याः कामा मनोगताः । पुत्राश्चापि प्रसूयन्ते विनीताश्चिरजीविनः ॥ १३॥ भाग्यवन्तः सुकृतिनः पितृभक्ता
    हरेः प्रियाः । कान्ता भवन्ति सत्कान्ता दान्ताश्चापि पतिव्रताः ॥ १४॥ चतुर्द्दश महारत्नभोक्ता भवति पाठकृत्
    । महारोगैर्विमुच्येत दारुणैर्बन्धनैरपि ॥ १५॥ शत्रुभिश्च विषैः शस्त्रैः कृत्याभिश्च ग्रहैरपि । भूतैः
    प्रेतैश्च रक्षोभिर्वह्निवायुमहाभयैः ॥ १६॥ मुच्यते वारिधौ मज्जन् त्रायते चापरान्नपि । स्वचक्रे परचक्रे
    च सेनाक्षोभे प्रजाक्षये ॥ १७॥ महामारीभये चान्यभये वाताशने भये । गतं राज्यं गतां लक्ष्मीं रुद्धां वा
    दारुणैर्जनैः ॥ १८॥ साम्राज्यलक्ष्मीमाप्नोति किमन्यत् कथयामि भोः । दारिद्र्यान्मुच्यते सोऽथ कुबेर इव
    जायते ॥ १९॥ विद्ययाऽसौ गिरीशः स्यात् सुरेषु त्रिदशेश्वरः । वदान्यतां विधिः साक्षाल्लावण्यान्मदनोपमः
    ॥ २०॥ महादेवान् वशे कुर्याद् भूतान्यपि वशे नयेत् । विपर्ययं च जगतां कुर्याद्बन्धं दिवौकसाम् ॥ २१॥
    लोकानां रञ्जनं कुर्यान्नारीणामपि मन्मथम् । पूज्यते जगतीमध्ये लोकानुग्रहकृद्भवेत् ॥ २२॥ तस्य वाक् जायते
    वेत्ता भूतभव्यभवज्जुषाम् । यद्यदिच्छति तत्सर्वं करस्थं चैव पश्यति ॥ २३॥ हरिभक्तस्तु भगवल्लीलां पश्यति
    सर्वशः । निजदोषान् परगुणान् हरिदासे महात्मनाम् ॥ २४॥ दैन्यप्रीतिं समाप्नोति गुरुभक्तिं च विन्दति ।
    ततः कृतार्थ एव स्यान्निषेव्यः स्यान्महात्मनाम् ॥ २५॥ हस्तौ पादौ च प्रक्षाल्य शुचिः शुद्धात्मवासनः
    । जितेन्द्रियो वाग्यतश्च पूर्वास्यः स्वासने स्थितः ॥ २६॥ आचम्य प्राणानायम्य कृतरक्ष्यः पठेत्ततः ।
    ध्यायन् भगवतो रूपं वाञ्छितार्थफलप्रदम् ॥ २७॥ हृदयं गोपिकानाथो भालं मे जगदीश्वरः । श्रीकृष्णो मे शिखां
    पातु कवचं पातु गोपतिः ॥ २८॥ नेत्रे पातु दधद्वेत्रमस्त्रं वेणुधरो हरिः । मूर्द्धादिकण्ठपर्यन्तं श्रीकृष्णः
    सर्वदाऽवतु ॥ २९॥ कण्ठादिमध्यपर्यन्तं श्रीगोविन्दोऽपि रक्षतु । श्रीगोपीजनकान्तस्तु पायान्मध्यादिपादतः
    ॥ ३०॥ श्रीमन्मुकुन्दचरणौ शरणं मेऽस्तु सर्वतः । श्रीकृष्णः शरणं मेऽस्तु बाल्ये बालस्वरूपधृक् ॥ ३१॥
    गोविन्दश्शरणं मेऽस्तु तारुण्ये तरुणीप्रियः । केशवः शरणं मेऽस्तु वार्द्धक्ये वृद्धवन्दितः ॥ ३२॥ आपन्नं
    गोकुलाधीशः प्रपन्नं गिरिधारणः । विपन्नं नन्दनन्दो मां सदा व्रजपुरन्दरः ॥ ३३॥ दिने कालिन्दिनीकान्तः
    रात्रौ श्रीराधिकेश्वरः । सन्ध्यासु सन्धिवेलासु श्रीमच्चन्द्रावलीप्रियः ॥ ३४॥ अग्रतो मे जगन्नाथः पृष्ठतो
    बदरीपतिः । पार्श्वतो द्वारकानाथो रङ्गनाथस्तथा हरिः ॥ ३५॥ इति श्रीशाण्डिल्यसंहितायां पञ्चमे भक्तिखण्डे
    एकोनविंशोऽध्याये पुरुषोत्तमकवचं सम्पूर्णम् ।
