id: devaihkritam05shivastotram
category: stotram
name:
  english: devaihkritam05shivastotram
  devanagari: देवैःकृतं०५शिवस्तोत्रम्
content:
  english: devaih kritam 5 shivastotram deva ucuh | rakshasva shambho kritya'sman badhate tadbhavanalah
    | sharanam bhava sarvesha bhitanamabhayaprada || 134|| sarvatah paribhutanamartanam shrantacetasam
    | sarveshameva jantunam tvameva sharanam shiva || 135|| rishina'bhyarthita kritya tvaccakshurvahninirgata
    | sa jighamsati lokamstrimstvam nastrata na cetarah || 136|| iti brahmapurane dashadhikashatatamadhyayantargatam
    devaih kritam shivastotram samaptam | brahmapurana | adhyaya 110
  devanagari: देवैः कृतं ५ शिवस्तोत्रम् देवा ऊचुः । रक्षस्व शम्भो कृत्याऽस्मान् बाधते तद्भवानलः । शरणं
    भव सर्वेश भीतानामभयप्रद ॥ १३४॥ सर्वतः परिभूतानामार्तानां श्रान्तचेतसाम् । सर्वेषामेव जन्तूनां त्वमेव
    शरणं शिव ॥ १३५॥ ऋषिणाऽभ्यर्थिता कृत्या त्वच्चक्षुर्वह्निनिर्गता । सा जिघांसति लोकांस्त्रींस्त्वं नस्त्राता
    न चेतरः ॥ १३६॥ इति ब्रह्मपुराणे दशाधिकशततमाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ११०
meaning: {}
