id: mahakalashanim-ityunjayastotra
category: shataka
name:
  english: mahakalashanimṟityunjayastotra
  devanagari: महाकालशनिम्ऱित्युन्जयस्तोत्र
content:
  english: visphotakacchukah | diva saurim smaret ratrau mahakalam yajan patheta || 89|| janmarkshe ca
    yada saurirjapedetatsahasrakam | vedhage vamavedhe va japedarddhasahasrakam || 90|| dvitiye dvadashe
    mande tanau va cashtame'pi va | tattadrashau bhavedyavat pathettavaddinavadhi || 91|| caturthe dashame
    va'pi saptame navapancame | gocare janmalagneshe dashasvantardashasu ca || 92|| gurulaghavajnanena
    pathedavrittisankhyaya | shatamekam trayam vatha shatayugmam kadacana || 93|| apadastasya nashyanti
    papani ca jayam bhavet | mahakalalaye pithe hyathava jalasannidhau || 94|| punyakshetre'shvatthamule
    tailakumbhagrato grihe | niyamenaikabhaktena brahmacaryena maunina || 95|| shrotavyam pathitavyam
    ca sadhakanam sukhavaham | param svastyayanam punyam stotram mrityunjayabhidham || 96|| kalakramena
    kathitam nyasakrama samanvitam | pratahkale shucirbhutva pujayam ca nishamukhe || 97|| pathatam naiva
    dushtebhyo vyaghrasarpadito bhayam | nagnito na jaladvayordeshe deshantare'thava || 98|| na'kale maranam
    tesham na'pamrityubhayam bhavet | ayurvarshashatam sagram bhavanti cirajivinah || 99|| na'tah parataram
    stotram shanitushtikaram mahat | shantikam shighraphaladam stotrametanmayoditam || 100|| tasmatsarvaprayatnena
    yadicchedatmano hitam | kathaniyam mahadevi
  devanagari: विस्फोटकच्छुकाः । दिवा सौरिं स्मरेत् रात्रौ महाकालं यजन् पठेत ॥ ८९॥ जन्मर्क्षे च यदा सौरिर्जपेदेतत्सहस्रकम्
    । वेधगे वामवेधे वा जपेदर्द्धसहस्रकम् ॥ ९०॥ द्वितीये द्वादशे मन्दे तनौ वा चाष्टमेऽपि वा । तत्तद्राशौ
    भवेद्यावत् पठेत्तावद्दिनावधि ॥ ९१॥ चतुर्थे दशमे वाऽपि सप्तमे नवपञ्चमे । गोचरे जन्मलग्नेशे दशास्वन्तर्दशासु
    च ॥ ९२॥ गुरुलाघवज्ञानेन पठेदावृत्तिसङ्ख्यया । शतमेकं त्रयं वाथ शतयुग्मं कदाचन ॥ ९३॥ आपदस्तस्य नश्यन्ति
    पापानि च जयं भवेत् । महाकालालये पीठे ह्यथवा जलसन्निधौ ॥ ९४॥ पुण्यक्षेत्रेऽश्वत्थमूले तैलकुम्भाग्रतो
    गृहे । नियमेनैकभक्तेन ब्रह्मचर्येण मौनिना ॥ ९५॥ श्रोतव्यं पठितव्यं च साधकानां सुखावहम् । परं स्वस्त्ययनं
    पुण्यं स्तोत्रं मृत्युञ्जयाभिधम् ॥ ९६॥ कालक्रमेण कथितं न्यासक्रम समन्वितम् । प्रातःकाले शुचिर्भूत्वा
    पूजायां च निशामुखे ॥ ९७॥ पठतां नैव दुष्टेभ्यो व्याघ्रसर्पादितो भयम् । नाग्नितो न जलाद्वायोर्देशे देशान्तरेऽथवा
    ॥ ९८॥ नाऽकाले मरणं तेषां नाऽपमृत्युभयं भवेत् । आयुर्वर्षशतं साग्रं भवन्ति चिरजीविनः ॥ ९९॥ नाऽतः परतरं
    स्तोत्रं शनितुष्टिकरं महत् । शान्तिकं शीघ्रफलदं स्तोत्रमेतन्मयोदितम् ॥ १००॥ तस्मात्सर्वप्रयत्नेन यदीच्छेदात्मनो
    हितम् । कथनीयं महादेवि
