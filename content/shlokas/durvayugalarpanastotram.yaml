id: durvayugalarpanastotram
category: stotram
name:
  english: durvayugalarpanastotram
  devanagari: दूर्वायुगलार्पणस्तोत्रम्
content:
  english: durvayugalarpanastotram shrimanmangalamangalam ganapati brahmanyadevam kavim jyeshtham shreshthatamam
    varenyamamritam vighnebhapancananam | tvam sarvepsitadam pranamya manasa gandhakshataih samyutam durvayugmamidam
    mayarpitamibhasyai tattvamangikuru || 1|| brahmanandarasambudhim gunanidhim dhiriddhisiddhishvaram
    sindurarunavigraham trinayanam sadbhaktahrinmodakam | tvam gaurishasutam pranamya manasa gandhakshataih
    samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 2|| onkaradimabijakaranamanirvacyam
    jagatkaranam yogihritkamalam prabodhanakaram bhanum bhavapaddharam | tvam bhalendumaham pranamya manasa
    gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 3|| udyadbhaskarakotibhapratimabham
    divya gadalankritam vighnesham vikatam vishalajatharam mandarapushpapriyam | tvam trailokyapatim pranamya
    manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 4|| hastairyah
    satatam varabhayasriniparshunvahantam muda shurpashrotrakamambujekshanamaghaughadhvantavaikartanam
    | tvamamnayanidhim pranamya gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru
    || 5|| shundagre dhritamodakam pramuditam sanmushikena dhvajam nupuradikiritakundaladharam devam mahatundilam
    | tvam sankashtaharam pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru
    || 6|| danadravilagandamandalayugam modahribhramaram bhaktarishtacinashtivigrahadharam shrivakratundam
    muhuh | tvam vagishamaham pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai
    tattvamangikuru || 7|| ashapurakamadrirajatanayasatkukshishuktyudbhavam dhundhim kshipravarapradanasumukham
    cintamanim siddhidam | tvam vidyambunidhim pranamya manasa gandhakshataih samyutam durvayugmamidam
    mayarpitamibhasyai tattvamangikuru || 8|| bhutanam prabhavapyayavanagunanamadibijam param bhatyastipriyanamarupaganapam
    nairgunyasaukhyaspadam | tvam sarvartiharam pranamya manasa gandhakshataih samyutam durvayugmamidam
    mayarpitamibhasyai tattvamangikuru || 9|| herambam bhavaghoramulavipinam dhvantartivicchedakam sadyastapaharam
    sudhakaramanantanantalilaspadam | tvam sarvajnamaham pranamya manasa gandhakshataih samyutam durvayugmamidam
    mayarpitamibhasyai tattvamangikuru || 10|| idyam shreshthatamam gurum gurutamam shrijyeshtharajam
    kavim purnanandasudhapayonidhishayam dhiprerakam dyotakam | tvam prajnanaghanam pranamya manasa gandhakshataih
    samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 11|| dhyeyam brahmasanatanam yaduditam
    ganeshavidyacanaih vedajnaih suvivicya tattvamasi vakyarthasya sandarshakaih | tattatvam tvamiti pranamya
    manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 12|| yah kashigrihe'vatirya
    shishubhih lilam jagatpavanim kritva devanarantakadi ditijan hatvaharadbhubharam | tvam ballaḻamaham
    pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 13||
    ahuryam munayo'nuvipratamamityadyam kavinam kavim karyam prakritikam vicitramakhilam no bhasate yadrite
    | tam tvamekaradam pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru
    || 14|| samhrityatmani yah prasuptisamaye vishvam samagram tvidam shete svatmasukharnave suvitate
    sheshakhyatalpe shubhe | tvam svatmabhiramam pranamya manasa gandhakshataih samyutam durvayugmamidam
    mayarpitamibhasyai tattvamangikuru || 15|| dhyatva tvam hridaye maya paricita no mantriki tantriki
    dikshadikshitashikshitakathamaham syam tvatkripabhajanam | tvam cittarttiharam pranamya manasa gandhakshataih
    samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 16|| bhaktastvam karunam tvamevamiti
    yat nityam bruvanti sphutam taddine mayi catake'lpamatike turna kripam varshaya | tvam bhutishamaham
    pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru || 17||
    shatpancashatadhashtadha ca dashadha bhutva punah pancadha kashyam shodashadha ca yo nivasati shrivishvanathapriyah
    | tvam lilattatanum pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru
    || 18|| durvalankaranam taya pratidinam durvavanantashcaram durvatalpashayam shirasyapi tatha durvakiritodvaham
    | tvadurvattahridam pranamya manasa gandhakshataih samyutam durvayugmamidam mayarpitamibhasyai tattvamangikuru
    || 19|| durve tvam pranamamyaham mayi kripams kurvashu matarvibhum madvijnaptyurarikritau nijapati
    svapekshaya prarthaya | te'tipritikarastavaiva vacasa gandhakshatairsamyutam durvayugmamidam mayarpitamibhasyah
    svikarotyadbhutam || 20||
  devanagari: दूर्वायुगलार्पणस्तोत्रम् श्रीमन्मङ्गलमङ्गलं गणपति ब्रह्मण्यदेवं कविं ज्येष्ठं श्रेष्ठतमं
    वरेण्यममृतं विघ्नेभपञ्चाननम् । त्वां सर्वेप्सितदं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं
    मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ १॥ ब्रह्मानन्दरसाम्बुधिं गुणनिधिं धीऋद्धिसिद्धीश्वरं सिन्दूरारुणविग्रहं
    त्रिनयनं सद्भक्तहृन्मोदकम् । त्वां गौरीशसुतं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै
    तत्त्वमङ्गीकुरु ॥ २॥ ओङ्कारादिमबीजकारणमनिर्वाच्यं जगत्कारणं योगीहृत्कमलं प्रबोधनकरं भानुं भवापद्धरम्
    । त्वां भालेन्दुमहं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ ३॥ उद्यद्भास्करकोटिभाप्रतिमभं दिव्या गदालङ्कृतं विघ्नेशं विकटं विशालजठरं मन्दारपुष्पप्रियम् । त्वां
    त्रैलोक्यपतिं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ ४॥
    हस्तैर्यः सततं वराभयसृणीपर्शून्वहन्तं मुदा शूर्पश्रोत्रकमम्बुजेक्षणमघौघध्वान्तवैकर्तनम् । त्वामाम्नायनिधिं
    प्रणम्य गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ ५॥ शुण्डाग्रे धृतमोदकं
    प्रमुदितं सन्मूषिकेन ध्वजं नूपूरादिकिरीटकुण्डलधरं देवं महातुन्दिलम् । त्वां सङ्कष्टहरं प्रणम्य मनसा
    गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ ६॥ दानद्राविलगण्डमण्डलयुगं मोदाहृभ्रामरं
    भक्तारिष्टचिनष्टिविग्रहधरं श्रीवक्रतुण्डं मुहुः । त्वां वागीशमहं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं
    मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ ७॥ आशापूरकमद्रिराजतनयासत्कुक्षिशुक्त्युद्भवं ढुण्ढिं क्षिप्रवरप्रदानसुमुखं
    चिन्तामणिं सिद्धिदम् । त्वां विद्याम्बुनिधिं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै
    तत्त्वमङ्गीकुरु ॥ ८॥ भूतानां प्रभावाप्ययावनगुणानामादिबीजं परं भात्यस्तिप्रियनामरूपगणपं नैर्गुण्यसौख्यास्पदम्
    । त्वां सर्वार्तिहरं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ ९॥ हेरम्बं भवघोरमूलविपिनं ध्वान्तार्तिविच्छेदकं सद्यस्तापहरं सुधाकरमनन्तानन्तलीलास्पदम् । त्वां
    सर्वज्ञमहं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ १०॥
    ईड्यं श्रेष्ठतमं गुरुं गुरुतमं श्रीज्येष्ठराजं कविं पूर्णानन्दसुधापयोनिधिशयं धीप्रेरकं द्योतकम् ।
    त्वां प्रज्ञानघनं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ ११॥ ध्येयं ब्रह्मसनातनं यदुदितं गाणेशविद्याचणैः वेदज्ञैः सुविविच्य तत्त्वमसि वाक्यार्थस्य सन्दर्शकैः
    । तत्तत्वं त्वमिति प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १२॥ यः काशिगृहेऽवतीर्य शिशुभिः लीलां जगत्पावनीं कृत्वा देवनरान्तकादि दितिजान् हत्वाहरद्भूभरम् ।
    त्वां बल्लाळमहं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥
    १३॥ आहुर्यं मुनयोऽनुविप्रतममित्याद्यं कवीनां कविं कार्यं प्राकृतिकं विचित्रमखिलं नो भासते यदृते ।
    तं त्वामेकरदं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु ॥ १४॥
    संहृत्यात्मनि यः प्रसुप्तिसमये विश्वं समग्रं त्विदं शेते स्वात्मसुखार्णवे सुवितते शेषाख्यतल्पे शुभे
    । त्वां स्वात्माभिरमं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १५॥ ध्यात्वा त्वां हृदये मया परिचिता नो मान्त्रिकी तान्त्रिकी दीक्षादीक्षितशिक्षिताकथमहं स्यां त्वत्कृपाभाजनम्
    । त्वां चित्तार्त्तिहरं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १६॥ भक्तास्त्वां करुणं त्वमेवमिति यत् नित्यं ब्रुवन्ति स्फुटं तद्दीने मयि चातकेऽल्पमतिके तूर्ण कृपां
    वर्षय । त्वां भूतीशमहं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १७॥ षट्पञ्चाशतधाष्टधा च दशधा भूत्वा पुनः पञ्चधा काश्यां षोडशधा च यो निवसति श्रीविश्वनाथप्रियः ।
    त्वां लीलात्ततनुं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १८॥ दूर्वालङ्करणं तया प्रतिदिनं दूर्वावनान्तश्चरं दूर्वातल्पशयं शिरस्यपि तथा दूर्वाकिरीटोद्वहम्
    । त्वादूर्वात्तहृदं प्रणम्य मनसा गन्धाक्षतैः संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यै तत्त्वमङ्गीकुरु
    ॥ १९॥ दूर्वे त्वां प्रणमाम्यहं मयि कृपांस् कुर्वाशु मातर्विभुं मद्विज्ञप्त्युररीकृतौ निजपति स्वापेक्षया
    प्रार्थय । तेऽतिप्रीतिकरस्तवैव वचसा गन्धाक्षतैर्संयुतं दूर्वायुग्ममिदं मयार्पितमिभास्यः स्वीकरोत्यद्भुतम्
    ॥ २०॥
