id: vindhyeshvaristotra
category: stotram
name:
  english: vindhyeshvaristotra
  devanagari: विन्ध्येश्वरीस्तोत्र
content:
  english: vindhyeshvaristotram shriganeshaya namah | nishumbhashumbhamardinim pracandamundakhandanim
    | vane rane prakashinim bhajami vindhyavasinim || 1|| trishulamundadharinim dharavighataharinim |
    grihe grihe nivasinim bhajami vindhyavasinim || 2|| daridraduhkhaharinim satam vibhutikarinim | viyogashokaharinim
    bhajami vindhyavasinim || 3|| lasatsulolalocanam latasadevarapradam |
  devanagari: विन्ध्येश्वरीस्तोत्रम् श्रीगणेशाय नमः । निशुम्भशुम्भमर्दिनीं प्रचण्डमुण्डखण्डनीम् । वने
    रणे प्रकाशिनीं भजामि विन्ध्यवासिनीम् ॥ १॥ त्रिशूलमुण्डधारिणीं धराविघातहारिणीम् । गृहे गृहे निवासिनीं
    भजामि विन्ध्यवासिनीम् ॥ २॥ दरिद्रदुःखहारिणीं सतां विभूतिकारिणीम् । वियोगशोकहारिणीं भजामि विन्ध्यवासिनीम्
    ॥ ३॥ लसत्सुलोललोचनां लतासदेवरप्रदाम् ।
meaning: {}
