id: sri-vyuha-lakshmi-mantram
category: stotram
name:
  english: Sri Vyuha Lakshmi Mantram
content:
  english: vyuhalakshmi tantrah dayalola tarangakshi purnacandra nibhanana | janani sarvalokanam mahalakshmih
    haripriya || || sarvapapa harasaiva prarabdhasyapi karmanah | samhritau tu kshamasaiva sarva sampatpradayini
    || || tasya vyuha prabhedastu lakshih sarvapapa pranashini | tatraya vyuhalakshmi sa mugdhah karunya
    vigraha || || anayasena sa lakshmih sarvapapa pranashini | sarvaishvarya prada nityam tasya mantramimam
    shrinu || || vedadimayai matre ca lakshmyai nati padam vadet | parameti padam coktra lakshmya iti
    padam tatah || || vishnu vakshah sthitayai syat maya shritarika tatah | vahni jayanta mantroyam abhishtartha
    suradrumah || || dvibhuja vyuhalakshissyat badhdha padmasana priya | shrinivasanga madhyastha sutaram
    keshavapriya || || tameva sharanam gachcha sarvabhavena satvaram | iti mantram upadishya dadrishe
    na kutracit || vyuhalakshmi mantrah vedadimayai matre ca lakshmyai nati padam vadet | parameti padam
    coktra lakshmya iti padam tatah || vishnu vakshah sthitayai syat maya shritarika tatah | vahni jayanta
    mantroyam abhishtartha suradrumah || vyuhalakshmi mantrah om shri om namah || paramalakshmmai
  devanagari: व्यूहलक्ष्मी तन्त्रः दयालोल तरङ्गाक्षी पूर्णचन्द्र निभानना । जननी सर्वलोकानां महालक्ष्मीः
    हरिप्रिया ॥ ॥ सर्वपाप हरासैव प्रारब्धस्यापि कर्मणः । संहृतौ तु क्षमासैव सर्व सम्पत्प्रदायिनी ॥ ॥ तस्या
    व्यूह प्रभेदास्तु लक्षीः सर्वपाप प्रणाशिनी । तत्रया व्यूहलक्ष्मी सा मुग्धाः कारुण्य विग्रह ॥ ॥ अनायासेन
    सा लक्ष्मीः सर्वपाप प्रणाशिनी । सर्वैश्वर्य प्रदा नित्यं तस्या मन्त्रमिमं शृणु ॥ ॥ वेदादिमायै मात्रे
    च लक्ष्म्यै नति पदं वदेत् । परमेति पदं चोक्त्रा लक्ष्म्या इति पदं ततः ॥ ॥ विष्णु वक्षः स्थितायै स्यात्
    माया श्रीतारिका ततः । वह्नि जायान्त मन्त्रोयं अभीष्टार्थ सुरद्रुमः ॥ ॥ द्विभूजा व्यूहलक्षीस्स्यात्
    बध्ध पद्मासन प्रिया । श्रीनिवासाङ्ग मध्यस्था सुतरां केशवप्रिया ॥ ॥ तामेव शरणं गछ्छ सर्वभावेन सत्वरम्
    । इति मन्त्रं उपादिश्य ददृशे न कुत्रचित् ॥ व्यूहलक्ष्मी मन्त्रः वेदादिमायै मात्रे च लक्ष्म्यै नति
    पदं वदेत् । परमेति पदं चोक्त्रा लक्ष्म्या इति पदं ततः ॥ विष्णु वक्षः स्थितायै स्यात् माया श्रीतारिका
    ततः । वह्नि जायान्त मन्त्रोयं अभीष्टार्थ सुरद्रुमः ॥ व्यूहलक्ष्मी मन्त्रः ॐ श्री ॐ नमः ॥ परमलक्ष्म्मै
