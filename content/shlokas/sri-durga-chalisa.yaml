id: sri-durga-chalisa
category: stotram
name:
  english: Sri Durga Chalisa
content:
  english: namo namo durge sukha karani | namo namo ambe duhkha harani || || nirankara hai jyoti tumhari
    | tihu loka phaili ujiyari || || shashi lalata mukha mahavishala | netra lala bhrikuti vikarala ||
    || rupa matu ko adhika suhave | darasha karata jana ati sukha pave || || tuma samsara shakti laya
    kina | palana hetu anna dhana dina || || annapurna huyi jaga pala | tuma hi adi sundari bala || ||
    pralayakala saba nashana hari | tuma gauri shiva shankara pyari || || shiva yogi tumhare guna gavem
    | brahma vishnu tumhem nita dhyavem || || rupa sarasvati ka tuma dhara | de subuddhi rishi munina
    ubara || || dhara rupa narasimha ko amba | paragata bhayi phada ke khamba || || raksha kara prahlada
    bacayo | hiranyaksha ko svarga pathayo || || lakshmi rupa dharo jaga mahim | shri narayana anga samahim
    || || kshirasindhu mem karata vilasa | dayasindhu dijai mana asa || || hingalaja mem tumhim bhavani
    | mahima amita na jata bakhani || || matangi dhumavati mata | bhuvaneshvari bagala sukhadata || ||
    shri bhairava tara jaga tarini | chinna bhala bhava duhkha nivarini || || kehari vahana soha bhavani
    | langura vira calata agavani || || kara mem khappara khadaga viraje | jako dekha kala dara bhaje
    || || tohe kara mem astra trishula | jate uthata shatru hiya shula || || nagarakoti mem tumhim virajata
    | tihu~ loka mem danka bajata || || shumbha nishumbha danava tuma mare | raktabija shankhana samhare
    || || mahishasura nripa ati abhimani | jehi agha bhara mahi akulani || || rupa karala kalika dhara
    | sena sahita tuma tihi samhara || || padi bhidha santana para jaba jaba | bhayi sahaya matu tuma
    taba taba || || amarapuri aru basava loka | taba mahima saba kahem ashoka || || jvala mem hai jyoti
    tumhari | tumhem sada pujem nara nari || || prema bhakti se jo yasha gavem | duhkha daridra nikata
    nahim avem || || dhyave tumhem jo nara mana layi | janma marana te saum chuta jayi || || jogi sura
    muni kahata pukari | yoga na hoyi bina shakti tumhari || || shankara acaraja tapa kino | kama aru
    krodha jita saba lino || || nishidina dhyana dharo shankara ko | kahu kala nahim sumiro tumako ||
    || shakti rupa ko marama na payo | shakti gayi taba mana pachatayo || || sharanagata huyi kirti bakhani
    | jaya jaya jaya jagadamba bhavani || || bhayi prasanna adi jagadamba | dayi shakti nahim kina vilamba
    || || moko matu kashta ati ghero | tuma bina kauna harai duhkha mero || || asha trishna nipata satavem
    | ripu murakha mòhi ati dara pavaim || || shatru nasha kijai maharani | sumiraum ikacita tumhem bhavani
    || || karo kripa he matu dayala | riddhi siddhi de karahu nihala | || jaba lagi jiyu daya phala pavu
    | tumharo yasha maim sada sunavu || || durga calisa jo gavai | saba sukha bhoga paramapada pavai ||
    || devidasa sharana nija jani | karahu kripa jagadamba bhavani ||
  devanagari: नमो नमो दुर्गे सुख करनी । नमो नमो अम्बे दुःख हरनी ॥ ॥ निरङ्कार है ज्योति तुम्हारी । तिहू
    लोक फैली उजियारी ॥ ॥ शशि ललाट मुख महाविशाला । नेत्र लाल भृकुटि विकराला ॥ ॥ रूप मातु को अधिक सुहावे
    । दरश करत जन अति सुख पावे ॥ ॥ तुम संसार शक्ति लय कीना । पालन हेतु अन्न धन दीना ॥ ॥ अन्नपूर्णा हुयि
    जग पाला । तुम ही आदि सुन्दरी बाला ॥ ॥ प्रलयकाल सब नाशन हारी । तुम गौरी शिव शङ्कर प्यारी ॥ ॥ शिव योगी
    तुम्हरे गुण गावेम् । ब्रह्मा विष्णु तुम्हें नित ध्यावेम् ॥ ॥ रूप सरस्वती का तुम धारा । दे सुबुद्धि
    ऋषि मुनिन उबारा ॥ ॥ धरा रूप नरसिंह को अम्बा । परगट भयि फाड के खम्बा ॥ ॥ रक्षा कर प्रह्लाद बचायो ।
    हिरण्याक्ष को स्वर्ग पठायो ॥ ॥ लक्ष्मी रूप धरो जग माहीम् । श्री नारायण अङ्ग समाहीम् ॥ ॥ क्षीरसिन्धु
    में करत विलासा । दयासिन्धु दीजै मन आसा ॥ ॥ हिङ्गलाज में तुम्हीं भवानी । महिमा अमित न जात बखानी ॥ ॥
    मातङ्गी धूमावति माता । भुवनेश्वरी बगला सुखदाता ॥ ॥ श्री भैरव तारा जग तारिणी । छिन्न भाल भव दुःख निवारिणी
    ॥ ॥ केहरि वाहन सोह भवानी । लाङ्गुर वीर चलत अगवानी ॥ ॥ कर में खप्पर खडग विराजे । जाको देख काल डर भाजे
    ॥ ॥ तोहे कर में अस्त्र त्रिशूला । जाते उठत शत्रु हिय शूला ॥ ॥ नगरकोटि में तुम्हीं विराजत । तिहुँ लोक
    में डङ्का बाजत ॥ ॥ शुम्भ निशुम्भ दानव तुम मारे । रक्तबीज शङ्खन संहारे ॥ ॥ महिषासुर नृप अति अभिमानी
    । जेहि अघ भार मही अकुलानी ॥ ॥ रूप कराल कालिका धारा । सेन सहित तुम तिहि संहारा ॥ ॥ पडी भीढ सन्तन पर
    जब जब । भयि सहाय मातु तुम तब तब ॥ ॥ अमरपुरी अरु बासव लोका । तब महिमा सब कहें अशोका ॥ ॥ ज्वाला में
    है ज्योति तुम्हारी । तुम्हें सदा पूजें नर नारी ॥ ॥ प्रेम भक्ति से जो यश गावेम् । दुःख दारिद्र निकट
    नहिं आवेम् ॥ ॥ ध्यावे तुम्हें जो नर मन लायि । जन्म मरण ते सौं छुट जायि ॥ ॥ जोगी सुर मुनि कहत पुकारी
    । योग न होयि बिन शक्ति तुम्हारी ॥ ॥ शङ्कर आचारज तप कीनो । काम अरु क्रोध जीत सब लीनो ॥ ॥ निशिदिन ध्यान
    धरो शङ्कर को । काहु काल नहिं सुमिरो तुमको ॥ ॥ शक्ति रूप को मरम न पायो । शक्ति गयी तब मन पछतायो ॥ ॥
    शरणागत हुयि कीर्ति बखानी । जय जय जय जगदम्ब भवानी ॥ ॥ भयि प्रसन्न आदि जगदम्बा । दयि शक्ति नहिं कीन
    विलम्बा ॥ ॥ मोको मातु कष्ट अति घेरो । तुम बिन कौन हरै दुःख मेरो ॥ ॥ आशा तृष्णा निपट सतावेम् । रिपु
    मूरख मॊहि अति दर पावैम् ॥ ॥ शत्रु नाश कीजै महारानी । सुमिरौं इकचित तुम्हें भवानी ॥ ॥ करो कृपा हे मातु
    दयाला । ऋद्धि सिद्धि दे करहु निहाला । ॥ जब लगि जियू दया फल पावू । तुम्हरो यश मैं सदा सुनावू ॥ ॥ दुर्गा
    चालीसा जो गावै । सब सुख भोग परमपद पावै ॥ ॥ देवीदास शरण निज जानी । करहु कृपा जगदम्ब भवानी ॥
