id: suratakathamritam
category: shataka
name:
  english: suratakathamritam
  devanagari: सुरतकथामृतम्
content:
  english: locanaminacatushtayamadhuna nishpandatamurikurute | rasabharavismayamatte naisargikaceshtitasmritih
    kim syat || 97|| candananaladasudhamshudravamayajalayantraveshmamadhyasthe | sthalajalaruhadalakalpitatalpe'suptam
    ratashrantau || 98|| kramavalitairnihshvasitaih surabhayatoh svaminorathanyonyam | nidravriddhimavetya
    pramodasindhavayam janah plavatam || 99|| suratakathamritamaryashatakam natakandharo jano jushatam
    | ratasukhadhamagavakshashritanayanah svaminoraho kripaya || 100|| pravishatu shanaih shanairatha
    mukitanupuram janastatra | gatre nibhalya yunoh svavalayarajim pidhaya badhnatu || 101|| kampanacakitairalibhistyaktumashakyena
    talavrintena | vijayatu shramasalilam pratyangam shoshitam nirupayatu || 102|| radhakundatatavasamahasampadam
    madah so'yam | kimu vanchitamatidurlabhavastuni tamrite mamastu sambhavyam || 103|| ashtamak adhikarahasyavyanjakam
    mathnan nibadhyate'tra shatake | tadrishabhavavibhavitahridayenaivastu tatsevyam || 104|| khaviyadritukshamaganite
    shake vrishasamsthite divadhishe | suratakathamritamudagadudayatam ca bhaktahrinnabhasi || 105|| iti
    mahamahopadhyayashrivishvanathacakravartiviracitam suratakathamritam samaptam ||
  devanagari: लोचनमीनचतुष्टयमधुना निष्पन्दतामुरीकुरुते । रसभरविस्मयमत्ते नैसर्गिकचेष्टितस्मृतिः किं स्यात्
    ॥ ९७॥ चन्दननलदसुधांशुद्रवमयजलयन्त्रवेश्ममध्यस्थे । स्थलजलरुहदलकल्पिततल्पेऽसुप्तां रतश्रान्तौ ॥ ९८॥
    क्रमवलितैर्निःश्वसितैः सुरभयतोः स्वामिनोरथान्योन्यम् । निद्रावृद्धिमवेत्य प्रमोदसिन्धावयं जनः प्लवताम्
    ॥ ९९॥ सुरतकथामृतमार्यशतकं नतकन्धरो जनो जुषताम् । रतसुखधामगवाक्षश्रितनयनः स्वामिनोरहो कृपया ॥ १००॥
    प्रविशतु शनैः शनैरथ मूकितनूपुरं जनस्तत्र । गात्रे निभाल्य यूनोः स्ववलयराजीं पिधाय बध्नातु ॥ १०१॥ कम्पनचकितैरलिभिस्त्यक्तुमशक्येन
    तालवृन्तेन । वीजयतु श्रमसलिलं प्रत्यङ्गं शोषितं निरूपयतु ॥ १०२॥ राधाकुण्डतटवासमहासम्पदं मदः सोऽयम्
    । किमु वाञ्छितमतिदुर्लभवस्तुनि तमृते ममास्तु सम्भाव्यम् ॥ १०३॥ अष्टमक् अधिकरहस्यव्यञ्जकं मथ्नन् निबध्यतेऽत्र
    शतके । तादृशभावविभावितहृदयेनैवास्तु तत्सेव्यम् ॥ १०४॥ खवियदृतुक्षमागणिते शाके वृषसंस्थिते दिवाधीशे
    । सुरतकथामृतमुदगदुदयतां च भक्तहृन्नभसि ॥ १०५॥ इति महामहोपाध्यायश्रीविश्वनाथचक्रवर्तिविरचितं सुरतकथामृतं
    समाप्तम् ॥
