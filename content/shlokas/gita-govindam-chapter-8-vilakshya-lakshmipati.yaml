id: gita-govindam-chapter-8-vilakshya-lakshmipati
category: stotram
name:
  english: Gita Govindam Chapter 8 - Vilakshya Lakshmipati
content:
  english: '|| ashtamah sargah || || vilakshyalakshmipatih || atha kathamapi yaminim viniya smarasharajarjaritapi
    sa prabhate | anunayavacanam vadantamagre pranatamapi priyamaha sabhyasuyam || || rajanijanitagurujagararagakashayitamalasanivesham
    | vahati nayanamanuragamiva sphutamuditarasabhinivesham || harihari yahi madhava yahi keshava ma vada
    kaitavavadam tamanusara sarasiruhalocana ya tava harati vishadam || || kajjalamalinavilocanacumbanaviracitanilimarupam
    | dashanavasanamarunam tava krishna tanoti tanoranurupam || || vapuranuharati tava smarasangarakharanakharakshatarekham
    | marakatashakalakalitakaladhautalipireva ratijayalekham || || caranakamalagaladalaktakasiktamidam
    tava hridayamudaram | darshayativa bahirmadanadrumanavakisalayaparivaram || || dashanapadam bhavadadharagatam
    mama janayati cetasi khedam | kathayati kathamadhunapi maya saha tava vapuretadabhedam || || bahiriva
    malinataram tava krishna mano''pi bhavishyati nunam | kathamatha vancayase janamanugatamasamasharajvaradunam
    || || bhramati bhavanabalakavalaya vaneshu kimatra vicitram | prathayati putanikaiva vadhuvadhanirdayabalacaritram
    || || shrijayadevabhanitarativancitakhanditayuvativilapam | shrinuta sudhamadhuram vibudha vibudhalayato''pi
    durapam || || tadevam pashyantyah prasaradanuragam bahiriva priyapadalaktacchuritamarunacchayahridayam
    | mamadya prakhyatapranayabharabhangena kitava tvadalokah shokadapi kimapi lajjam janayati || || ||
    iti gitagovinde khanditavarnane vilakshyalakshmipatirnama ashthamah sargah ||'
  devanagari: ॥ अष्टमः सर्गः ॥ ॥ विलक्ष्यलक्ष्मीपतिः ॥ अथ कथमपि यामिनीं विनीय स्मरशरजर्जरितापि सा प्रभाते
    । अनुनयवचनं वदन्तमग्रे प्रणतमपि प्रियमाह साभ्यसूयम् ॥ ॥ रजनिजनितगुरुजागररागकषायितमलसनिवेशम् । वहति
    नयनमनुरागमिव स्फुटमुदितरसाभिनिवेशम् ॥ हरिहरि याहि माधव याहि केशव मा वद कैतववादं तामनुसर सरसीरुहलोचन
    या तव हरति विषादम् ॥ ॥ कज्जलमलिनविलोचनचुम्बनविरचितनीलिमरूपम् । दशनवसनमरुणं तव कृष्ण तनोति तनोरनुरूपम्
    ॥ ॥ वपुरनुहरति तव स्मरसङ्गरखरनखरक्षतरेखम् । मरकतशकलकलितकलधौतलिपिरेव रतिजयलेखम् ॥ ॥ चरणकमलगलदलक्तकसिक्तमिदं
    तव हृदयमुदारम् । दर्शयतीव बहिर्मदनद्रुमनवकिसलयपरिवारम् ॥ ॥ दशनपदं भवदधरगतं मम जनयति चेतसि खेदम् ।
    कथयति कथमधुनापि मया सह तव वपुरेतदभेदम् ॥ ॥ बहिरिव मलिनतरं तव कृष्ण मनोऽपि भविष्यति नूनम् । कथमथ वञ्चयसे
    जनमनुगतमसमशरज्वरदूनम् ॥ ॥ भ्रमति भवानबलाकवलाय वनेषु किमत्र विचित्रम् । प्रथयति पूतनिकैव वधूवधनिर्दयबालचरित्रम्
    ॥ ॥ श्रीजयदेवभणितरतिवञ्चितखण्डितयुवतिविलापम् । शृणुत सुधामधुरं विबुधा विबुधालयतोऽपि दुरापम् ॥ ॥ तदेवं
    पश्यन्त्याः प्रसरदनुरागं बहिरिव प्रियापादालक्तच्छुरितमरुणच्छायहृदयम् । ममाद्य प्रख्यातप्रणयभरभङ्गेन
    कितव त्वदालोकः शोकादपि किमपि लज्जां जनयति ॥ ॥ ॥ इति गीतगोविन्दे खण्डितावर्णने विलक्ष्यलक्ष्मीपतिर्नाम
    अष्ठमः सर्गः ॥
