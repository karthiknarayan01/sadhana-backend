id: sri-kalika-ashtakam
category: stotram
name:
  english: Sri Kalika Ashtakam
content:
  english: dhyanam galadraktamundavalikanthamala mahaghorarava sudamshtra karala | vivastra shmashanalaya
    muktakeshi mahakalakamakula kalikeyam || || bhuje vamayugme shiro'sim dadhana varam dakshayugme'bhayam
    vai tathaiva | sumadhya'pi tungastana bharanamra lasadraktasrikkadvaya susmitasya || || shavadvandvakarnavatamsa
    sukeshi lasatpretapanim prayuktaikakanci | shavakaramancadhirudha shivabhih caturdikshushabdayamana'bhireje
    || || stutih virancyadidevastrayaste gunastrin samaradhya kalim pradhana babhuvuh | anadim suradim
    makhadim bhavadim svarupam tvadiyam na vindanti devah || || jaganmohiniyam tu vagvadiniyam suhritposhini
    shatrusamharaniyam | vacastambhaniyam kimuccataniyam svarupam tvadiyam na vindanti devah || || iyam
    svargadatri punah kalpavalli manojastu kaman yathartham prakuryat | tatha te kritartha bhavantiti
    nityam svarupam tvadiyam na vindanti devah || || surapanamatta subhaktanurakta lasatputacitte sadavirbhavatte
    | japadhyanapujasudhadhautapanka svarupam tvadiyam na vindanti devah || || cidanandakandam hasanmandamandam
    sharaccandrakotiprabhapunjabimbam | muninam kavinam hridi dyotayantam svarupam tvadiyam na vindanti
    devah || || mahameghakali suraktapi shubhra kadacidvicitrakritiryogamaya | na bala na vriddha na kamaturapi
    svarupam tvadiyam na vindanti devah || || kshamasvaparadham mahaguptabhavam maya lokamadhye prakashikritam
    yat | tava dhyanaputena capalyabhavat svarupam tvadiyam na vindanti devah || || yadi dhyanayuktam
    pathedyo manushyah tada sarvaloke vishalo bhavecca | grihe cashtasiddhirmrite capi muktih svarupam
    tvadiyam na vindanti devah || || iti shrimacchankaracaryaviracitam shrikalikashtakam |
  devanagari: ध्यानम् गलद्रक्तमुण्डावलीकण्ठमाला महाघोररावा सुदंष्ट्रा कराला । विवस्त्रा श्मशानालया मुक्तकेशी
    महाकालकामाकुला कालिकेयम् ॥ ॥ भुजे वामयुग्मे शिरोऽसिं दधाना वरं दक्षयुग्मेऽभयं वै तथैव । सुमध्याऽपि
    तुङ्गस्तना भारनम्रा लसद्रक्तसृक्कद्वया सुस्मितास्या ॥ ॥ शवद्वन्द्वकर्णावतंसा सुकेशी लसत्प्रेतपाणिं
    प्रयुक्तैककाञ्ची । शवाकारमञ्चाधिरूढा शिवाभिः चतुर्दिक्षुशब्दायमानाऽभिरेजे ॥ ॥ स्तुतिः विरञ्च्यादिदेवास्त्रयस्ते
    गुणास्त्रीन् समाराध्य कालीं प्रधाना बभूवुः । अनादिं सुरादिं मखादिं भवादिं स्वरूपं त्वदीयं न विन्दन्ति
    देवाः ॥ ॥ जगन्मोहिनीयं तु वाग्वादिनीयं सुहृत्पोषिणी शत्रुसंहारणीयम् । वचस्तम्भनीयं किमुच्चाटनीयं स्वरूपं
    त्वदीयं न विन्दन्ति देवाः ॥ ॥ इयं स्वर्गदात्री पुनः कल्पवल्ली मनोजास्तु कामान् यथार्थं प्रकुर्यात्
    । तथा ते कृतार्था भवन्तीति नित्यं स्वरूपं त्वदीयं न विन्दन्ति देवाः ॥ ॥ सुरापानमत्ता सुभक्तानुरक्ता
    लसत्पूतचित्ते सदाविर्भवत्ते । जपध्यानपूजासुधाधौतपङ्का स्वरूपं त्वदीयं न विन्दन्ति देवाः ॥ ॥ चिदानन्दकन्दं
    हसन्मन्दमन्दं शरच्चन्द्रकोटिप्रभापुञ्जबिम्बम् । मुनीनां कवीनां हृदि द्योतयन्तं स्वरूपं त्वदीयं न विन्दन्ति
    देवाः ॥ ॥ महामेघकाली सुरक्तापि शुभ्रा कदाचिद्विचित्राकृतिर्योगमाया । न बाला न वृद्धा न कामातुरापि
    स्वरूपं त्वदीयं न विन्दन्ति देवाः ॥ ॥ क्षमस्वापराधं महागुप्तभावं मया लोकमध्ये प्रकाशीकृतं यत् । तव
    ध्यानपूतेन चापल्यभावात् स्वरूपं त्वदीयं न विन्दन्ति देवाः ॥ ॥ यदि ध्यानयुक्तं पठेद्यो मनुष्यः तदा
    सर्वलोके विशालो भवेच्च । गृहे चाष्टसिद्धिर्मृते चापि मुक्तिः स्वरूपं त्वदीयं न विन्दन्ति देवाः ॥ ॥
    इति श्रीमच्छङ्कराचार्यविरचितं श्रीकालिकाष्टकम् ।
