id: gorakshasahasranamastotra
category: sahasranama
name:
  english: gorakshasahasranamastotra
  devanagari: गोरक्षसहस्रनामस्तोत्र
content:
  english: ringashcarunathashcitranathashcirantapah | shaktinatho buddhinathashchetta sarvagunashrayah
    || 28|| jayadhisho jayadharo jayadata sadajayah | japadhisho japadharo japadata sadajapah || 29||
    shankhanathah shankhanadah shankharupo janeshvarah | so'ham rupashca samsari susvarupah sadasukhi
    || 30|| onkara indranathashca indrarupah shubhah sudhih | jakaro janjapakashca jhakaro mrityujinmunih
    || 31|| tankarah tantanathashca tokaro topatishtarah | thakaro thanthanathashca thannathah thamayashca
    tha || 32|| damayo dhamayo nityo davadyo damarupriyah | vadaprada'bhayo bhogo bhavo bhimo bhayanakah
    || 33|| dandadhari dandarupo dandasiddho gunashrayah | dando dandamayo damyo darupo damano damah ||
    34|| nakaro nandanathashca budhanatho nirapadah | nandibhakto namaskaro sarvalokapriyo narah 35||
    thakaro thakarah stutyo juta jishnurjito gatih | thasevi thanthashabdashca thavasi jitvaro jayah ||
    36|| danado danasiddho dah dayoh dinapriyo'damah | adino divyarupashca divyo divyasano dyutih || 37||
    dayalurdayito danto'duro durekshano dinam | divyamalyo divyabhogo divyavastro divapatih || 38|| dhakaro
    dhanadata ca dhanado dharmado'dhanah | dhani dharmadharo dhiro dharadhisho dharadharah || 39|| dhiman
    shriman dharadharo dhvantanatho'dhamoddharah | dharmishtho dharmiko dhuryodhiro dhiroganashanah ||
    40|| siddhantakritacchuddhamatih shuddha shuddhaikarah kriti | andhakaraharo harsho harshavan harshitaprajah
    || 41|| pandunathah pitavarnah panduha pannagasanah | prasannasya prapannartiharah paramapavanah ||
    42|| phankarah phukarah pata phanindrah phalasamsthitah | phanirajah phaladhyaksho phaladata phali
    phalah || 43|| bam bam priyo bakarashca bamano baruno varah | varadastu varadhisho balo balapriyo
    balah || 44|| varaho varuninatho vidvan vidvatpriyo bali | bhavanipujako bhaumo bhadrakaro bhavantakah
    || 45|| bhadrapriyo'rbhakanando bhavanipatisevakah | bhavapriyo bhavadhisho bhavo bhavyo bhayapaha
    || 46|| mahadevapriyo manyo mananiyo mahashayah | mahayogi mahadhiro mahasiddho mahashrayah || 47||
    manogamyo manasvi ca mahamodamayo mahah | margapriyo margasevi mahatma mudito'malah || 48|| madhyanatho
    mahakaro makaro makhapujitah | makho makhakaro moho mohanasho marutpriyah || 49|| yakaro yajnakarta
    ca yamo yago yamapriyah | yashodharo yashasvi ca yashodata yashahpriyah || 50|| namaskarapriyonatho
    naranatho niramayah | nityayogarato nityo nandinatho narottamah || 51|| ramano ramanathashca ramabhadro
    ramapatih | ramramravo ramaramo ramaradhanatatparah || 52|| rajivalocano ramyo ragavetta ratishvarah
    | rajadharmapriyo rajanititattvavisharadah || 53|| ranjako ranamurtishca rajyabhogapradah prabhuh
    | ramapriyo ramadata ramabhagyavivardhanah || 54|| raktacandanaliptango raktaganghanulepanah | raktavastravilasi
    ca raktabhaktaphalapradah || 55|| atindriyo vishvayonirameyatma punarvasuh | satyadharmo brihadrupo
    naikarupo mahidharah || 56|| adrishyo'vyaktarupashca vishvabahuh pratishthitah | atulo varadastara
    pararddhistu shubhekshanah || 57|| hiranyagarbhah pranayo dharmo dharmaviduttamah | vatsalo viraha
    simhah svavasho bhuridakshinah || 58|| gangadhara gururgeyo gatarago gatasmayah | siddhagitah siddhakatho
    gunapatro gunakarah || 59|| drishtah shruto bhavadbhutah samabuddhih samaprabhah | mahavayurmahaviro
    mahabhutastanusthitah || 60|| nakshatreshah sudhanatho dhavah kalpanta bhairavah | sudhanva sarvadrig
    drashta vacaspatirayonijah || 61|| shubhanga shrikarah shreyah satkirtih shashvatah sthirah | vishokah
    shokaha shantah kamapalah kalanidhih || 62|| vishuddhatma mahayajna brahmajno brahmanapriyah | purnah
    purnakarah stota stutih stavyo manojavah || 63|| brahmanyo brahmano brahma sadbhutih satparakramah
    | prakritih purusho bhokta sukhadah shishirah shamah || 64|| sattvam rajastamah somo somapah saumyadarshanah
    | trigunastrigunatito trayirupastrilokapah || 65|| dakshinah peshalah svasyo durgo duhsvapnanashanah
    | jitamanyurgambhiratma pranabhrit vyadisho dishah || 66|| mukuti kundali dandi kataki kanakangadi
    | ahah samvatsarah kalah jnapako vyapakah kavih || 67|| bhurbhuvah svah svarupashca ashramah shramanah
    kshamo | kshamayukto kshayah kshantah krishah sthulo nirantarah || 68|| sarvagah sarvavit sarvah sureshashca
    surottamah | samatma sammitah satyah suparva shuciracyutah || 69|| sarvadih sharmakricchanto sharanyah
    yasharanartiha | shubhalakshanayuktangah shubhangah shubhadarshanah || 70|| pavakah pavano puto mahakalo
    mahapaha | lingamurtiralingatma lingalingatmavigrahah || 71|| kapalamalabharanah kapali vishnuvallabhah
    | kaladhishah kalakarta dushtavagrahakarakah || 72|| natyakarta natavaro natyashastravisharadah |
    atirago ragaheturvitarago viragavit || 73|| vasantakrid vasantatma vasantesho vasantadah | jivadhyaksho
    jivarupo jivo jivapradah sada || 74|| jivabandhaharo jivajivanam jiva samshrayah | vajratmavajrahastashca
    suparnah supratapavan || 75|| rudrakshamalabharano bhujangabharanapriyah | rudrakshavaksha rudrakshashirah
    rudrakshabhakshakah || 76|| bhujangendralasatkantho bhujangavalayavritah | bhujangendralasatkarno
    bhujangakritabhushanah || 77|| ugro'nugro bhimakarma bhogi bhimaparakramah | medhmo'vadhyo'modhashaktirnirdvando'modhavikramah
    || 78|| kalpyo'kalpyo nirakalpo vikalpah kalpanashanah | kalpakritih kalpakarta kalpantah kalparakshakah
    || 79|| sulabho'sulabho labhyo'labhyo labhapravardhakah | labhatma labhado labho lokabandhustrayitanuh
    || 80|| bhushayo'nnamayo bhukrinkamaniyo mahitanuh | vijnanamaya anandamayah pranamayo'nnadah || 81||
    dayasudhardranayano nirashiraparigrahah | padarthavritti rashasyo mayavi mukanashanah || 82|| hitaishi
    hitakrit yugyo pararthaikaprayojanah | karpuragaura parado jata mandalamanditah || 83|| nishprapanci
    niradharo satvesho sattvavit sadah | samastajagadadharo smastanandakaranah || 84|| munivandyo virabhadro
    munivrindanishevitah | munihritpundarikastho munisanghaikajivanah || 85|| uccairghosho ghosharupah
    pattishah papamocanah | oshadhisho girishayah kritsnavitah shucismitah || 86|| aranyesho paricaro
    mantratma mantravittamah | pralayanalakrit pushtah somasuryagnilocanah || 87|| akshobhyah kshobharahito
    bhasmoddhulitavigrahah | shardulacarmavasanah samagah samagapriyah || 88|| kailashashikharavaso svarnakesha
    suvarnadrika | svatantra sarvatantratma pranatartipabhanjanah || 89|| nikatastho'tidurastho mahotsaho
    mahodayah | brahmacari dridhacari sadacari sanatanah || 90|| apadhrishyah pingalakshyah sarvadharmaphalapradah
    | avidya rahito vidyasamshrayah kshetrapalakah || 91|| gajarih karunasindhuh shatrughnah shatrupatanah
    | kamatho bhargavah kalki rirshabhah kapilo bhavah || 92|| shunya shunyamayah shunyajanma shunyalayo'layah
    | shunyakarah shunyadevo prakashatma nirishvarah || 93|| gorajo goganopeto godevo gopatipriyah | gavishvaro
    gava data gorakshakarako girih || 94|| cetanashcetanadhyaksho mahakasho nirapadah | jado jadagato
    jadyanashano jadatapaha || 95|| ramapriyo lakshmanadhyo vitastanandadayakah | kashivasapriyo rango
    lokaranjanakarakah || 96|| nirvedakari nirvinno mahaniyo mahadhanah | yoginivallabho bharta bhaktakalpatarurgrahih
    || 97|| rishabho gautamah stragvi buddho buddhimattam guruh | nirupo nirmamo'kruro niragrahah || 98||
    nirdambho niraso nilo nayako nayakottamah | nirvananayako nityasthito nirnayakarakah || 99|| bhaviko
    bhavuko bhavo bhavatma bhavamocanah | bhavyadata bhavatrata bhagavan bhutimana bhavah || 100|| premi
    priyah premakarah prematmah premavittamah | phullaravindanayano nayatma nitiman nayi || 101|| paramtejah
    paramdhama parameshthi puratanah | pushkarah pushkaradhyakshah pushkarakshetrasamsthitah || 102||
    pratyagatma'pratarkyastu rajamanyo jagatpatih | punyatma punyakrita punyapriyah punyavadashritah ||
    103|| vayudo vayusevi ca vataharo vimatsarah | bilvapriyo bilvadhari bilvamalyo layashrayah || 104||
    bilvabhakto bilvanatho bilvabhaktipriyo vashi | shambhumantradharah shambhuyogah shambhupriyo harah
    || 105 || skandapriyo niraskando sukhayogah sukhasanah | kshamapriyah kshamadata kshamashilo nirakshamah
    || 106|| jnanajno jnanado jnano jnanagamyah kshamapatih | kshamacarastattvadarshi tantrajnastantrakarakah
    || 107|| tantrasadhana tattvajnastantramargapravartakah | tantratma balatantrajno yantramantraphalapradah
    || 108|| goraso gorasadhisho gosiddha gomatipriyah | gorakshakarako gomi gorangopapirguruh || 109||
    sampurnakamah sarveshtha data sarvatmakah shami | shuddho'ruddho'viruddhashca prabuddhah siddhasevitah
    || 110|| dharmo dharmavidam shreshtho dharmajno dharmadharakah | dharmaseturdharmarajo dharmamargapravartakah
    || 111|| dharmacaryo dharmakarta dharmyo dharmavidagranih | dharmatma dharmamarmajno dharmashastravisharadah
    || 112|| karta dharta jagadbharta'pahartasura rakshasam | vetta chetta bhavapatterbhemta papasya punyakrit
    || 113|| gunavan gunasmapanno gunyo ganyo gunapriyah | gunajno gunasampujyo gunananditamanasah ||
    114|| gunadharo gunadhisho gunigito gunipriyah | gunakaro gunashreshtho gunadata gunojvalah || 115||
    gargapriyo gargadevo gargadevanamaskritah | garganandakaro garga gito gargavarapradah || 116|| vedavedyo
    vedavido vedavandyo vidampatih | vedantavedyo vedantakarta vedantaparagah || 117|| hiranyareta hutabhuk
    himavarno himalayah | hritabhuk hayagrivo hiranyastrak hayanatho hiranyamayah || 118|| shaktiman shaktidata
    ca shaktinathah sushaktikah | shakti'shaktah shaktisadhya shaktihrit shaktikaranam || 119|| sarvashasyagunopetah
    sarva saubhagyadayakah | tripundradhari samnyasi gajacarmaparivritah || 120|| gajasuravimardi ca bhutavaitalashobhitah
    | shmashanaranyasamvasi karparalankritah shivah || 121|| karmasakshi karmakarta karma karmaphalapradah
    | karmanyah karmadah karmi karmaha karmakrid guruh || 122|| gosankashtasantrata gosantapanivartakah
    | govardhano gavamdata gosaubhagyavivardhanah || 123|| garga uvaca
  devanagari: ृङ्गश्चारुनाथश्चित्रनाथश्चिरन्तपाः । शक्तिनाथो बुद्धिनाथश्छेत्ता सर्वगुणाश्रयः ॥ २८॥ जयाधीशो
    जयाधारो जयादाता सदाजयः । जपाधीशो जपाधारो जपदाता सदाजपः ॥ २९॥ शङ्खनाथः शङ्खनादः शङ्खरूपो जनेश्वरः ।
    सोऽहं रूपश्च संसारी सुस्वरूपः सदासुखी ॥ ३०॥ ओङ्कार इन्द्रनाथश्च इन्द्ररूपः शुभः सुधीः । जकारो जञ्जपकश्च
    झाकारो मृत्युजिन्मुनिः ॥ ३१॥ टङ्कारः टण्टनाथश्च टोकारो टोपतिष्टरः । ठकारो ठण्ठनाथश्च ठन्नाथः ठमयश्च
    ठ ॥ ३२॥ डमयो ढमयो नित्यो डवाद्यो डमरुप्रियः । वदप्रदाऽभयो भोगो भवो भीमो भयानकः ॥ ३३॥ दण्डधारी दण्डरूपो
    दण्डसिद्धो गुणाश्रयः । दण्डो दण्डमयो दम्यो दरूपो दमनो दमः ॥ ३४॥ णकारो नन्दनाथश्च बुधनाथो निरापदः ।
    नन्दीभक्तो नमस्कारो सर्वलोकप्रियो नरः ३५॥ थकारो थकारः स्तुत्यो जुता जिष्णुर्जितो गतिः । थसेवी थन्थशब्दश्च
    थवासी जित्वरो जयः ॥ ३६॥ दानदो दानसिद्धो दः दयोः दीनप्रियोऽदमः । अदीनो दिव्यरूपश्च दिव्यो दिव्यासनो
    द्यूतिः ॥ ३७॥ दयालुर्दयितो दान्तोऽदूरो दूरेक्षणो दिनम् । दिव्यमाल्यो दिव्यभोगो दिव्यवस्त्रो दिवापतिः
    ॥ ३८॥ धकारो धनदाता च धनदो धर्मदोऽधनः । धनी धर्मधरो धीरो धराधीशो धराधरः ॥ ३९॥ धीमान् श्रीमान् धरधरो
    ध्वान्तनाथोऽधमोद्धरः । धर्मिष्ठो धार्मिको धुर्योधीरो धीरोगनाशनः ॥ ४०॥ सिद्धान्तकृतच्छुद्धमतिः शुद्ध
    शुद्धैकरः कृती । अन्धकारहरो हर्षो हर्षवान् हर्षितप्रजः ॥ ४१॥ पाण्डुनाथः पीतवर्णः पाण्डुहा पन्नगासनः
    । प्रसन्नास्य प्रपन्नार्तिहरः परमपावनः ॥ ४२॥ फङ्कारः फूकारः पाता फणीन्द्रः फलसंस्थितः । फणीराजः फलाध्यक्षो
    फलदाता फली फलः ॥ ४३॥ बं बं प्रियो बकारश्च बामनो बारुणो वरः । वरदस्तु वराधिशो बालो बालप्रियो बलः ॥
    ४४॥ वराहो वारुणीनाथो विद्वान् विद्वत्प्रियो बली । भवानीपूजको भौमो भद्राकारो भवान्तकः ॥ ४५॥ भद्रप्रियोऽर्भकानन्दो
    भवानीपतिसेवकः । भवप्रियो भवाधीशो भवो भव्यो भयापहा ॥ ४६॥ महादेवप्रियो मान्यो मननीयो महाशयः । महायोगी
    महाधीरो महासिद्धो महाश्रयः ॥ ४७॥ मनोगम्यो मनस्वी च महामोदमयो महः । मार्गप्रियो मार्गसेवी महात्मा मुदितोऽमलः
    ॥ ४८॥ मध्यनाथो महाकारो मकारो मखपूजितः । मखो मखकरो मोहो मोहनाशो मरुत्प्रियः ॥ ४९॥ यकारो यज्ञकर्ता च
    यमो यागो यमप्रियः । यशोधरो यशस्वी च यशोदाता यशःप्रियः ॥ ५०॥ नमस्कारप्रियोनाथो नरनाथो निरामयः । नित्ययोगरतो
    नित्यो नन्दिनाथो नरोत्तमः ॥ ५१॥ रमणो रामनाथश्च रामभद्रो रमापतिः । रांरांरवो रामरामो रामराधनतत्परः
    ॥ ५२॥ राजीवलोचनो रम्यो रागवेत्ता रतीश्वरः । राजधर्मप्रियो राजनीतितत्त्वविशारदः ॥ ५३॥ रञ्जको रणमूर्तिश्च
    राज्यभोगप्रदः प्रभुः । रमाप्रियो रमादाता रमाभाग्यविवर्धनः ॥ ५४॥ रक्तचन्दनलिप्ताङ्गो रक्तगन्घानुलेपनः
    । रक्तवस्त्रविलासी च रक्तभक्तफलप्रदः ॥ ५५॥ अतीन्द्रियो विश्वयोनिरमेयात्मा पुनर्वसुः । सत्यधर्मो बृहद्रूपो
    नैकरूपो महीधरः ॥ ५६॥ अदृश्योऽव्यक्तरूपश्च विश्वबाहुः प्रतिष्ठितः । अतुलो वरदस्तार परर्द्धिस्तु शुभेक्षणः
    ॥ ५७॥ हिरण्यगर्भः प्रणयो धर्मो धर्मविदुत्तमः । वत्सलो वीरहा सिंहः स्ववशो भूरिदक्षिणः ॥ ५८॥ गङ्गाधर
    गुरुर्गेयो गतरागो गतस्मयः । सिद्धगीतः सिद्धकथो गुणपात्रो गुणाकरः ॥ ५९॥ दृष्टः श्रुतो भवद्भूतः समबुद्धिः
    समप्रभः । महावायुर्महावीरो महाभूतस्तनुस्थितः ॥ ६०॥ नक्षत्रेशः सुधानाथो धवः कल्पान्त भैरवः । सुधन्वा
    सर्वदृग् द्रष्टा वाचस्पतिरयोनिजः ॥ ६१॥ शुभाङ्ग श्रीकरः श्रेयः सत्कीर्तिः शाश्वतः स्थिरः । विशोकः शोकहा
    शान्तः कामपालः कलानिधिः ॥ ६२॥ विशुद्धात्मा महायज्ञा ब्रह्मज्ञो ब्राह्मणप्रियः । पूर्णः पूर्णकरः स्तोता
    स्तुतिः स्तव्यो मनोजवः ॥ ६३॥ ब्रह्मण्यो ब्राह्मणो ब्रह्म सद्भूतिः सत्पराक्रमः । प्रकृतिः पुरुषो भोक्ता
    सुखदः शिशिरः शमः ॥ ६४॥ सत्त्वं रजस्तमः सोमो सोमपाः सौम्यदर्शनः । त्रिगुणस्त्रिगुणातीतो त्रयीरूपस्त्रिलोकपः
    ॥ ६५॥ दक्षिणः पेशलः स्वास्यो दुर्गो दुःस्वप्ननाशनः । जितमन्युर्गम्भीरात्मा प्राणभृत् व्यादिशो दिशः
    ॥ ६६॥ मुकुटी कुण्डली दण्डी कटकी कनकाङ्गदी । अहः संवत्सरः कालः ज्ञापको व्यापकः कविः ॥ ६७॥ भूर्भुवः
    स्वः स्वरूपश्च आश्रमः श्रमणः क्षमो । क्षमायुक्तो क्षयः क्षान्तः कृशः स्थूलो निरन्तरः ॥ ६८॥ सर्वगः
    सर्ववित् सर्वः सुरेशश्च सुरोत्तमः । समात्मा संमितः सत्यः सुपर्वा शुचिरच्युतः ॥ ६९॥ सर्वादिः शर्मकृच्छान्तो
    शरण्यः यशरणार्तिहा । शुभलक्षणयुक्ताङ्गः शुभाङ्गः शुभदर्शनः ॥ ७०॥ पावकः पावनो पूतो महाकालो महापहा ।
    लिङ्गमूर्तिरलिङ्गात्मा लिङ्गालिङ्गात्मविग्रहः ॥ ७१॥ कपालमालाभरणः कपाली विष्णुवल्लभः । कालाधीशः कालकर्ता
    दुष्टावग्रहकारकः ॥ ७२॥ नाट्यकर्ता नटवरो नाट्यशास्त्रविशारदः । अतिरागो रागहेतुर्वीतरागो विरागवित् ॥
    ७३॥ वसन्तकृद् वसन्तात्मा वसन्तेशो वसन्तदः । जीवाध्यक्षो जीवरूपो जीवो जीवप्रदः सदा ॥ ७४॥ जीवबन्धहरो
    जीवजीवनम् जीव संश्रयः । वज्रात्मावज्रहस्तश्च सुपर्णः सुप्रतापवान् ॥ ७५॥ रुद्राक्षमालाभरणो भुजङ्गाभरणप्रियः
    । रुद्राक्षवक्षा रुद्राक्षशिरः रुद्राक्षभक्षकः ॥ ७६॥ भुजङ्गेन्द्रलसत्कण्ठो भुजङ्गवलयावृतः । भुजङ्गेन्द्रलसत्कर्णो
    भुजङ्गकृतभूषणः ॥ ७७॥ उग्रोऽनुग्रो भीमकर्मा भोगी भीमपराक्रमः । मेध्मोऽवध्योऽमोधशक्तिर्निर्द्वन्दोऽमोधविक्रमः
    ॥ ७८॥ कल्प्योऽकल्प्यो निराकल्पो विकल्पः कल्पनाशनः । कल्पाकृतिः कल्पकर्ता कल्पान्तः कल्परक्षकः ॥ ७९॥
    सुलभोऽसुलभो लभ्योऽलभ्यो लाभप्रवर्धकः । लाभात्मा लाभदो लाभो लोकबन्धुस्त्रयीतनुः ॥ ८०॥ भूशयोऽन्नमयो
    भूकृन्कमनीयो महीतनुः । विज्ञानमय आनन्दमयः प्राणमयोऽन्नदः ॥ ८१॥ दयासुधार्द्रनयनो निराशीरपरिग्रहः ।
    पदार्थवृत्ति राशास्यो मायावी मूकनाशनः ॥ ८२॥ हितैषी हितकृत् युग्यो परार्थैकप्रयोजनः । कर्पूरगौर परदो
    जटा मण्डलमण्डितः ॥ ८३॥ निष्प्रपञ्ची निराधारो सत्वेशो सत्त्ववित् सदः । समस्तजगदाधारो स्मस्तानन्दकारणः
    ॥ ८४॥ मुनिवन्द्यो वीरभद्रो मुनिवृन्दनिशेवितः । मुनिहृत्पुण्डरीकस्थो मुनिसङ्घैकजीवनः ॥ ८५॥ उच्चैर्घोषो
    घोषरूपः पत्तीशः पापमोचनः । ओषधीशो गिरिशयः कृत्स्नवीतः शुचिस्मितः ॥ ८६॥ अरण्येशो परिचरो मन्त्रात्मा
    मन्त्रवित्तमः । प्रलयानलकृत् पुष्टः सोमसूर्याग्निलोचनः ॥ ८७॥ अक्षोभ्यः क्षोभरहितो भस्मोद्धूलितविग्रहः
    । शार्दूलचर्मवसनः सामगः सामगप्रियः ॥ ८८॥ कैलाशशिखरावासो स्वर्णकेश सुवर्णदृक । स्वतन्त्र सर्वतन्त्रात्मा
    प्रणतार्तिपभञ्जनः ॥ ८९॥ निकटस्थोऽतिदूरस्थो महोत्साहो महोदयः । ब्रह्मचारी दृढाचारी सदाचारी सनातनः ॥
    ९०॥ अपधृष्यः पिङ्गलाक्ष्यः सर्वधर्मफलप्रदः । अविद्या रहितो विद्यासंश्रयः क्षेत्रपालकः ॥ ९१॥ गजारिः
    करुणासिन्धुः शत्रुघ्नः शत्रुपातनः । कमठो भार्गवः कल्कि ऋर्षभः कपिलो भवः ॥ ९२॥ शून्य शून्यमयः शून्यजन्मा
    शून्यलयोऽलयः । शून्याकारः शून्यदेवो प्रकाशात्मा निरीश्वरः ॥ ९३॥ गोराजो गोगणोपेतो गोदेवो गोपतिप्रियः
    । गवीश्वरो गवा दाता गोरक्षकारको गिरिः ॥ ९४॥ चेतनश्चेतनाध्यक्षो महाकाशो निरापदः । जडो जडगतो जाड्यनाशनो
    जडतापहा ॥ ९५॥ रामप्रियो लक्ष्मणाढ्यो वितस्तानन्ददायकः । काशीवासप्रियो रङ्गो लोकरञ्जनकारकः ॥ ९६॥ निर्वेदकारी
    निर्विण्णो महनीयो महाधनः । योगिनीवल्लभो भर्ता भक्तकल्पतरूर्ग्रहीः ॥ ९७॥ ऋषभो गौतमः स्त्रग्वी बुद्धो
    बुद्धिमत्तां गुरुः । नीरूपो निर्ममोऽक्रूरो निराग्रहः ॥ ९८॥ निर्दम्भो नीरसो नीलो नायको नायकोत्तमः ।
    निर्वाणनायको नित्यस्थितो निर्णयकारकः ॥ ९९॥ भाविको भावुको भावो भवात्मा भवमोचनः । भव्यदाता भवत्राता
    भगवान् भूतिमान भवः ॥ १००॥ प्रेमी प्रियः प्रेमकरः प्रेमात्माः प्रेमवित्तमः । फुल्लारविन्दनयनो नयात्मा
    नीतिमान् नयी ॥ १०१॥ परंतेजः परंधाम परमेष्ठी पुरातनः । पुष्करः पुष्कराध्यक्षः पुष्करक्षेत्रसंस्थितः
    ॥ १०२॥ प्रत्यगात्माऽप्रतर्क्यस्तु राजमान्यो जगत्पतिः । पुण्यात्मा पुण्यकृत पुण्यप्रियः पुण्यवदाश्रितः
    ॥ १०३॥ वायुदो वायुसेवी च वाताहारो विमत्सरः । बिल्वप्रियो बिल्वधारी बिल्वमाल्यो लयाश्रयः ॥ १०४॥ बिल्वभक्तो
    बिल्वनाथो बिल्वभक्तिप्रियो वशी । शम्भुमन्त्रधरः शम्भुयोगः शम्भुप्रियो हरः ॥ १०५ ॥ स्कन्दप्रियो निरास्कन्दो
    सुखयोगः सुखासनः । क्षमाप्रियः क्षमादाता क्षमाशीलो निरक्षमः ॥ १०६॥ ज्ञानज्ञो ज्ञानदो ज्ञानो ज्ञानगम्यः
    क्षमापतिः । क्षमाचारस्तत्त्वदर्शी तन्त्रज्ञस्तन्त्रकारकः ॥ १०७॥ तन्त्रसाधन तत्त्वज्ञस्तन्त्रमार्गप्रवर्तकः
    । तन्त्रात्मा बालतन्त्रज्ञो यन्त्रमन्त्रफलप्रदः ॥ १०८॥ गोरसो गोरसाधीशो गोसिद्धा गोमतीप्रियः । गोरक्षकारको
    गोमी गोराङ्गोपपिर्गुरुः ॥ १०९॥ सम्पूर्णकामः सर्वेष्ठ दाता सर्वात्मकः शमी । शुद्धोऽरुद्धोऽविरुद्धश्च
    प्रबुद्धः सिद्धसेवितः ॥ ११०॥ धर्मो धर्मविदां श्रेष्ठो धर्मज्ञो धर्मधारकः । धर्मसेतुर्धर्मराजो धर्ममार्गप्रवर्तकः
    ॥ १११॥ धर्माचार्यो धर्मकर्ता धर्म्यो धर्मविदग्रणीः । धर्मात्मा धर्ममर्मज्ञो धर्मशास्त्रविशारदः ॥ ११२॥
    कर्ता धर्ता जगद्भर्ताऽपहर्तासुर रक्षसाम् । वेत्ता छेत्ता भवापत्तेर्भेंता पापस्य पुण्यकृत् ॥ ११३॥ गुणवान्
    गुणस्मपन्नो गुण्यो गण्यो गुणप्रियः । गुणज्ञो गुणसम्पूज्यो गुणानन्दितमानसः ॥ ११४॥ गुणाधारो गुणाधीशो
    गुणिगीतो गुणिप्रियः । गुणाकारो गुणश्रेष्ठो गुणदाता गुणोज्वलः ॥ ११५॥ गर्गप्रियो गर्गदेवो गर्गदेवनमस्कृतः
    । गर्गनन्दकरो गर्ग गीतो गर्गवरप्रदः ॥ ११६॥ वेदवेद्यो वेदविदो वेदवन्द्यो विदाम्पतिः । वेदान्तवेद्यो
    वेदान्तकर्ता वेदान्तपारगः ॥ ११७॥ हिरण्यरेता हुतभुक् हिमवर्णो हिमालयः । हृतभुक् हयग्रीवो हिरण्यस्त्रक्
    हयनाथो हिरण्यमयः ॥ ११८॥ शक्तिमान् शक्तिदाता च शक्तिनाथः सुशक्तिकः । शक्तिऽशक्तः शक्तिसाध्य शक्तिहृत्
    शक्तिकारणम् ॥ ११९॥ सर्वाशास्यगुणोपेतः सर्व सौभाग्यदायकः । त्रिपुण्ड्रधारी संन्यासी गजचर्मपरिवृतः ॥
    १२०॥ गजासुरविमर्दी च भूतवैतालशोभितः । श्मशानारण्यसंवासी कर्परालङ्कृतः शिवः ॥ १२१॥ कर्मसाक्षी कर्मकर्ता
    कर्मा कर्मफलप्रदः । कर्मण्यः कर्मदः कर्मी कर्महा कर्मकृद् गुरुः ॥ १२२॥ गोसङ्कष्टसन्त्राता गोसन्तापनिवर्तकः
    । गोवर्धनो गवांदाता गोसौभाग्यविवर्धनः ॥ १२३॥ गर्ग उवाच
