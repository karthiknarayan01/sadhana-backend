id: devaihkritam15vishnustotram
category: stotram
name:
  english: devaihkritam15vishnustotram
  devanagari: देवैःकृतं१५विष्णुस्तोत्रम्
content:
  english: devaih kritam 15 vishnustotram tato devah sametaste tadocurmadhusudanam | tvam nah srashta
    ca pata ca bharta ca jagatah prabho | tvaya srishtamidam sarvam yaccengam yacca nengati || 18|| tvaya
    bhumih pura nashta samudratpushkarekshana | varaham rupamasthaya jagadarthe samuddhrita || 19|| adidaityo
    mahaviryo hiranyakashipustvaya | narasimham vapuh kritva suditah purushottama || 20|| avadhyah sarvabhutanam
    balishcapi mahasurah | vamanam vapurashritya trailokyadbhramshitastvaya || 21|| asurashca maheshvaso
    jambha ityabhivishrutah | yajnakshobhakarah krurastvayaiva vinipatitah || 22|| evamadini karmani yesham
    sankhya na vidyate | asmakam bhayabhitanam tvam gatirmadhusudana || 23|| tasmattvam deva devesha lokartham
    jnapayamahe | raksha lokamshca devamshca shakram ca mahato bhayat || 24|| iti mahabharate aranyakaparvani
    100 adhyayantargatam devaih kritam vishnustotram sampurnam | mahabharata | aranyakaparva | adhyaya
    100
  devanagari: देवैः कृतं १५ विष्णुस्तोत्रम् ततो देवाः समेतास्ते तदोचुर्मधुसूदनम् । त्वं नः स्रष्टा च पाता
    च भर्ता च जगतः प्रभो । त्वया सृष्टमिदं सर्वं यच्चेङ्गं यच्च नेङ्गति ॥ १८॥ त्वया भूमिः पुरा नष्टा समुद्रात्पुष्करेक्षण
    । वाराहं रूपमास्थाय जगदर्थे समुद्धृता ॥ १९॥ आदिदैत्यो महावीर्यो हिरण्यकशिपुस्त्वया । नारसिंहं वपुः
    कृत्वा सूदितः पुरुषोत्तम ॥ २०॥ अवध्यः सर्वभूतानां बलिश्चापि महासुरः । वामनं वपुराश्रित्य त्रैलोक्याद्भ्रंशितस्त्वया
    ॥ २१॥ असुरश्च महेष्वासो जम्भ इत्यभिविश्रुतः । यज्ञक्षोभकरः क्रूरस्त्वयैव विनिपातितः ॥ २२॥ एवमादीनि
    कर्माणि येषां सङ्ख्या न विद्यते । अस्माकं भयभीतानां त्वं गतिर्मधुसूदन ॥ २३॥ तस्मात्त्वां देव देवेश
    लोकार्थं ज्ञापयामहे । रक्ष लोकांश्च देवांश्च शक्रं च महतो भयात् ॥ २४॥ इति महाभारते आरण्यकपर्वणि १००
    अध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । आरण्यकपर्व । अध्याय १००
