id: sree-durga-nakshatra-malika-stuti
category: stotram
name:
  english: Sree Durga Nakshatra Malika Stuti
content:
  english: viratanagaram ramyam gacchamano yudhishthirah | astuvanmanasa devim durgam tribhuvaneshvarim
    || || yashodagarbhasambhutam narayanavarapriyam | nandagopakulejatam mangalyam kulavardhanim || ||
    kamsavidravanakarim asuranam kshayankarim | shilatatavinikshiptam akasham pratigaminim || || vasudevasya
    bhaginim divyamalya vibhushitam | divyambaradharam devim khadgakhetakadharinim || || bharavatarane
    punye ye smaranti sadashivam | tanvai tarayate papat pankegamiva durbalam || || stotum pracakrame
    bhuyo vividhaih stotrasambhavaih | amantrya darshanakankshi raja devim sahanujah || || namo'stu varade
    krishne kumari brahmacarini | balarka sadrishakare purnacandranibhanane || || caturbhuje caturvaktre
    pinashronipayodhare | mayurapinchavalaye keyurangadadharini || || bhasi devi yada padma narayanaparigrahah
    | svarupam brahmacaryam ca vishadam tava khecari || || krishnacchavisama krishna sankarshanasamanana
    | bibhrati vipulau bahu shakradhvajasamucchrayau || || patri ca pankaji kanthi stri vishuddha ca ya
    bhuvi | pasham dhanurmahacakram vividhanyayudhani ca || || kundalabhyam supurnabhyam karnabhyam ca
    vibhushita | candravispardhina devi mukhena tvam virajase || || mukutena vicitrena keshabandhena shobhina
    | bhujanga'bhogavasena shronisutrena rajata || || bhrajase cavabaddhena bhogeneveha mandarah | dhvajena
    shikhipinchanam ucchritena virajase || || kaumaram vratamasthaya tridivam pavitam tvaya | tena tvam
    stuyase devi tridashaih pujyase'pi ca || || trailokya rakshanarthaya mahishasuranashini | prasanna
    me surashreshthe dayam kuru shiva bhava || || jaya tvam vijaya caiva sangrame ca jayaprada | mama'pi
    vijayam dehi varada tvam ca sampratam || || vindhye caiva nagashreshte tava sthanam hi shashvatam
    | kali kali mahakali sidhumamsa pashupriye || || kritanuyatra bhutaistvam varada kamacarini | bharavatare
    ye ca tvam samsmarishyanti manavah || || pranamanti ca ye tvam hi prabhate tu nara bhuvi | na tesham
    durlabham kincit putrato dhanato'pi va || || durgattarayase durge tatvam durga smrita janaih | kantareshvavapannanam
    magnanam ca maharnave || dasyubhirva niruddhanam tvam gatih parama nrinama jalapratarane caiva kantareshvatavishu
    ca | ye smaranti mahadevim na ca sidanti te narah || || tvam kirtih shrirdhritih siddhih hrirvidya
    santatirmatih | sandhya ratrih prabha nidra jyotsna kantih kshama daya || || nrinam ca bandhanam moham
    putranasham dhanakshayam | vyadhim mrityum bhayam caiva pujita nashayishyasi || || so'ham rajyatparibhrashtah
    sharanam tvam prapannavan | pranatashca yatha murdhna tava devi sureshvari || || trahi mam padmapatrakshi
    satye satya bhavasva nah | sharanam bhava me durge sharanye bhaktavatsale || || evam stuta hi sa devi
    darshayamasa pandavam | upagamya tu rajanamidam vacanamabravit || || shrinu rajan mahabaho madiyam
    vacanam prabho | bhavishyatyaciradeva sangrame vijayastava || || mama prasadannirjitya hatva kaurava
    vahinim | rajyam nishkantakam kritva bhokshyase medinim punah || || bhratribhih sahito rajan pritim
    prapsyasi pushkalam | matprasadacca te saukhyam arogyam ca bhavishyati || || ye ca sankirtayishyanti
    loke vigatakalmashah | tesham tushta pradasyami rajyamayurvapussutam || || pravase nagare capi sangrame
    shatrusankate | atavyam durgakantare sagare gahane girau || || ye smarishyanti mam rajan yathaham
    bhavata smrita | na tesham durlabham kincidasmin loke bhavishyati || || ya idam paramastotram bhaktya
    shrinuyadva patheta va | tasya sarvani karyani sidhdhim yasyanti pandavah || || matprasadacca vassarvan
    viratanagare sthitan | na prajnasyanti kuravah nara va tannivasinah || || ityuktva varada devi yudhishthiramarindamam
    | raksham kritva ca pandunam tatraivantaradhiyata ||
  devanagari: विराटनगरं रम्यं गच्छमानो युधिष्ठिरः । अस्तुवन्मनसा देवीं दुर्गां त्रिभुवनेश्वरीम् ॥ ॥ यशोदागर्भसम्भूतां
    नारायणवरप्रियाम् । नन्दगोपकुलेजातां मङ्गल्यां कुलवर्धनीम् ॥ ॥ कंसविद्रावणकरीं असुराणां क्षयङ्करीम्
    । शिलातटविनिक्षिप्तां आकाशं प्रतिगामिनीम् ॥ ॥ वासुदेवस्य भगिनीं दिव्यमाल्य विभूषिताम् । दिव्याम्बरधरां
    देवीं खड्गखेटकधारिणीम् ॥ ॥ भारावतरणे पुण्ये ये स्मरन्ति सदाशिवाम् । तान्वै तारयते पापात् पङ्केगामिव
    दुर्बलाम् ॥ ॥ स्तोतुं प्रचक्रमे भूयो विविधैः स्तोत्रसम्भवैः । आमन्त्र्य दर्शनाकाङ्क्षी राजा देवीं
    सहानुजः ॥ ॥ नमोऽस्तु वरदे कृष्णे कुमारि ब्रह्मचारिणि । बालार्क सदृशाकारे पूर्णचन्द्रनिभानने ॥ ॥ चतुर्भुजे
    चतुर्वक्त्रे पीनश्रोणिपयोधरे । मयूरपिञ्छवलये केयूराङ्गदधारिणि ॥ ॥ भासि देवि यदा पद्मा नारायणपरिग्रहः
    । स्वरूपं ब्रह्मचर्यं च विशदं तव खेचरि ॥ ॥ कृष्णच्छविसमा कृष्णा सङ्कर्षणसमानना । बिभ्रती विपुलौ बाहू
    शक्रध्वजसमुच्छ्रयौ ॥ ॥ पात्री च पङ्कजी कण्ठी स्त्री विशुद्धा च या भुवि । पाशं धनुर्महाचक्रं विविधान्यायुधानि
    च ॥ ॥ कुण्डलाभ्यां सुपूर्णाभ्यां कर्णाभ्यां च विभूषिता । चन्द्रविस्पार्धिना देवि मुखेन त्वं विराजसे
    ॥ ॥ मुकुटेन विचित्रेण केशबन्धेन शोभिना । भुजङ्गाऽभोगवासेन श्रोणिसूत्रेण राजता ॥ ॥ भ्राजसे चावबद्धेन
    भोगेनेवेह मन्दरः । ध्वजेन शिखिपिञ्छानां उच्छ्रितेन विराजसे ॥ ॥ कौमारं व्रतमास्थाय त्रिदिवं पावितं
    त्वया । तेन त्वं स्तूयसे देवि त्रिदशैः पूज्यसेऽपि च ॥ ॥ त्रैलोक्य रक्षणार्थाय महिषासुरनाशिनि । प्रसन्ना
    मे सुरश्रेष्ठे दयां कुरु शिवा भव ॥ ॥ जया त्वं विजया चैव सङ्ग्रामे च जयप्रदा । ममाऽपि विजयं देहि वरदा
    त्वं च साम्प्रतम् ॥ ॥ विन्ध्ये चैव नगश्रेष्टे तव स्थानं हि शाश्वतम् । कालि कालि महाकालि सीधुमांस पशुप्रिये
    ॥ ॥ कृतानुयात्रा भूतैस्त्वं वरदा कामचारिणि । भारावतारे ये च त्वां संस्मरिष्यन्ति मानवाः ॥ ॥ प्रणमन्ति
    च ये त्वां हि प्रभाते तु नरा भुवि । न तेषां दुर्लभं किञ्चित् पुत्रतो धनतोऽपि वा ॥ ॥ दुर्गात्तारयसे
    दुर्गे तत्वं दुर्गा स्मृता जनैः । कान्तारेष्ववपन्नानां मग्नानां च महार्णवे ॥ दस्युभिर्वा निरुद्धानां
    त्वं गतिः परमा नृणाम जलप्रतरणे चैव कान्तारेष्वटवीषु च । ये स्मरन्ति महादेवीं न च सीदन्ति ते नराः ॥
    ॥ त्वं कीर्तिः श्रीर्धृतिः सिद्धिः ह्रीर्विद्या सन्ततिर्मतिः । सन्ध्या रात्रिः प्रभा निद्रा ज्योत्स्ना
    कान्तिः क्षमा दया ॥ ॥ नृणां च बन्धनं मोहं पुत्रनाशं धनक्षयम् । व्याधिं मृत्युं भयं चैव पूजिता नाशयिष्यसि
    ॥ ॥ सोऽहं राज्यात्परिभ्रष्टः शरणं त्वां प्रपन्नवान् । प्रणतश्च यथा मूर्ध्ना तव देवि सुरेश्वरि ॥ ॥
    त्राहि मां पद्मपत्राक्षि सत्ये सत्या भवस्व नः । शरणं भव मे दुर्गे शरण्ये भक्तवत्सले ॥ ॥ एवं स्तुता
    हि सा देवी दर्शयामास पाण्डवम् । उपगम्य तु राजानमिदं वचनमब्रवीत् ॥ ॥ शृणु राजन् महाबाहो मदीयं वचनं
    प्रभो । भविष्यत्यचिरादेव सङ्ग्रामे विजयस्तव ॥ ॥ मम प्रसादान्निर्जित्य हत्वा कौरव वाहिनीम् । राज्यं
    निष्कण्टकं कृत्वा भोक्ष्यसे मेदिनीं पुनः ॥ ॥ भ्रातृभिः सहितो राजन् प्रीतिं प्राप्स्यसि पुष्कलाम् ।
    मत्प्रसादाच्च ते सौख्यं आरोग्यं च भविष्यति ॥ ॥ ये च सङ्कीर्तयिष्यन्ति लोके विगतकल्मषाः । तेषां तुष्टा
    प्रदास्यामि राज्यमायुर्वपुस्सुतम् ॥ ॥ प्रवासे नगरे चापि सङ्ग्रामे शत्रुसङ्कटे । अटव्यां दुर्गकान्तारे
    सागरे गहने गिरौ ॥ ॥ ये स्मरिष्यन्ति मां राजन् यथाहं भवता स्मृता । न तेषां दुर्लभं किञ्चिदस्मिन् लोके
    भविष्यति ॥ ॥ य इदं परमस्तोत्रं भक्त्या शृणुयाद्वा पठेत वा । तस्य सर्वाणि कार्याणि सिध्धिं यास्यन्ति
    पाण्डवाः ॥ ॥ मत्प्रसादाच्च वस्सर्वान् विराटनगरे स्थितान् । न प्रज्ञास्यन्ति कुरवः नरा वा तन्निवासिनः
    ॥ ॥ इत्युक्त्वा वरदा देवी युधिष्ठिरमरिन्दमम् । रक्षां कृत्वा च पाण्डूनां तत्रैवान्तरधीयत ॥
