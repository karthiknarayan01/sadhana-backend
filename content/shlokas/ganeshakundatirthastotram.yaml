id: ganeshakundatirthastotram
category: stotram
name:
  english: ganeshakundatirthastotram
  devanagari: गणेशकुण्डतीर्थस्तोत्रम्
content:
  english: shriganeshakundatirthastotram || shriganeshaya namah || brahmovaca | namami tirtham gananayakasya
    ganeshakundam gananatigam ca | anantatirthaprabhavam puranam samsevinam brahmapradam nijatmyam ||
    2|| abhedabhedadivihinarupam catushpadam pancamamadyabhutam | ganeshamayakritadrishyabhavam namami
    kaivalyaghanam paresham || 3|| bhavatprasutam ca turiyamatmyam bhavedarupam kila tirthakanam | aham
    vishuddho'pi ca darshanena'bhavam kritabrahmakamandalustham || 4|| tadeva traigunyamayam babhuva bhagirathistham
    ravijamayam ca | sarasvatistham ca tatah prasutah saritsamuha bhuvaneshu samsthah || 5|| snanena papam
    vinihatya sarva nadyo naranamatha papayuktah | nityam jale te vinimajya shuddha ayanti svasthanamaghapahari
    || 6|| prayagatirthe maranena janturmanishitam tirthavare labhedvai | tavavalokena ganeshakunda tadeva
    sadyo labhate sakriccet || 7|| vacah param te jalabinduje'ham sparshe bhavam kim pravadami punyam
    | sakshadganeshankushaghatajam tannamami kundam gananayakasya || 8|| dhanyo'hamevam tava darshanena
    sparshena toyasya nimajjanena | toye tatha te ca mahanubhavam brahmaiva tushtam ca namo namaste ||
    9|| tvadiyatire maranam varishtham sumangalam brahmamayapradam tat | vina shramenaiva nara labhante
    shukadikanam padamatra citram || 10|| tvattoyajasprishtiraho mamastu snanam tu panam ca sadavalokah
    | kim varnayamyeva ganeshakunda svalpajnabhavattu namo namaste || 11||
  devanagari: श्रीगणेशकुण्डतीर्थस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ ब्रह्मोवाच । नमामि तीर्थं गणनायकस्य गणेशकुण्डं
    गणनातिगं च । अनन्ततीर्थप्रभवं पुराणं संसेविनां ब्रह्मप्रदं निजात्म्यम् ॥ २॥ अभेदभेदादिविहीनरूपं चतुष्पदं
    पञ्चममाद्यभूतम् । गणेशमायाकृतदृश्यभावं नमामि कैवल्यघनं परेषाम् ॥ ३॥ भवत्प्रसूतं च तुरीयमात्म्यं भवेदरूपं
    किल तीर्थकानाम् । अहं विशुद्धोऽपि च दर्शनेनाऽभवं कृतब्रह्मकमण्डलुस्थम् ॥ ४॥ तदेव त्रैगुण्यमयं बभूव
    भागीरथीस्थं रविजामयं च । सरस्वतीस्थं च ततः प्रसूताः सरित्समूहा भुवनेषु संस्थाः ॥ ५॥ स्नानेन पापं विनिहत्य
    सर्वा नद्यो नराणामथ पापयुक्ताः । नित्यं जले ते विनिमज्य शुद्धा आयान्ति स्वस्थानमघापहारि ॥ ६॥ प्रयागतीर्थे
    मरणेन जन्तुर्मनीषितं तीर्थवरे लभेद्वै । तवावलोकेन गणेशकुण्ड तदेव सद्यो लभते सकृच्चेत् ॥ ७॥ वाचः परं
    ते जलबिन्दुजेऽहं स्पर्शे भवं किं प्रवदामि पुण्यम् । साक्षाद्गणेशाङ्कुशघातजं तन्नमामि कुण्डं गणनायकस्य
    ॥ ८॥ धन्योऽहमेवं तव दर्शनेन स्पर्शेन तोयस्य निमज्जनेन । तोये तथा ते च महानुभावं ब्रह्मैव तुष्टं च
    नमो नमस्ते ॥ ९॥ त्वदीयतीरे मरणं वरिष्ठं सुमङ्गलं ब्रह्ममयप्रदं तत् । विना श्रमेणैव नरा लभन्ते शुकादिकानां
    पदमत्र चित्रम् ॥ १०॥ त्वत्तोयजस्पृष्टिरहो ममास्तु स्नानं तु पानं च सदावलोकः । किं वर्णयाम्येव गणेशकुण्ड
    स्वल्पज्ञभावात्तु नमो नमस्ते ॥ ११॥
