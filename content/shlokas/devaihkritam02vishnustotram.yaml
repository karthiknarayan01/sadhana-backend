id: devaihkritam02vishnustotram
category: stotram
name:
  english: devaihkritam02vishnustotram
  devanagari: देवैःकृतं०२विष्णुस्तोत्रम्
content:
  english: devaih kritam 2 vishnustotram deva ucuh | aradhanaya lokanam vishnorishasya yam giram | vakshyamo
    bhagavanadya taya vishnuh prasidatu || 11|| yato bhutanyashshani prasutani mahatmanah | yasmimshca
    layameshyanti kastam stotumiheshvarah || 12|| tathapyaratividhvamsadhvastavirya bhayarthinah | tvam
    stoshyamastavoktinam yatharthyam naiva gocare || 13|| tvamurvi salilam vahnirvayurakashameva ca |
    samastamantahkaranam pradhanam tatparah puman || 14|| ekam tavaitadbhutatmanmurttamurttamayam vapuh
    | abrahmastambaparyantam sthanakalavibhedavat || 15|| tatresha tava yatpurvam tvannabhikamalodbhavam
    | rupam vishvopakaraya tasmai brahmatmane namah || 16|| shakrarkarudravasvashvimarutsomadibhedavat
    | vayamekam svarupam te tasmai devatmane namah || 17|| dambhaprayamasambodhi titikshadamavarjitam
    | yadrupam tava govinda tasmai daityatmane namah || 18|| natijnanavaha yasminnadyah stimitatejasi
    | shabdadilobhi yattasmai tubhyam yakshatmane namah || 19|| krauryam mayamayam ghoram yacca rupam
    tavasitam | nishacaratmane tasmai namaste purushottama || 20|| svargasthadharmisaddharmaphalopakaranam
    tava | dharmakhyam ca tatha rupam namastasmai janarddana || 21|| harshaprayamasamsargi gatimadgamanadishu
    | siddhakhyam tava yadrupam tasmai siddhatmane namah || 22|| atitikshayanam kruramupabhogasaham hare
    | dvijihvam tava yadrupam tasmai nagatmane namah || 23|| avabodhi ca yacchantamadoshamapakalmasham
    | rishirupatmane tasmai vishvarupaya te namah || 24|| bhakshayatyatha kalpante bhutani yadavaritam
    | tvadrupam pundarikaksha tasmai kalatmane namah || 25|| sambhakshya sarvabhutani devadinyavisheshatah
    | nrityatyante ca yadrupam tasmai rudratmane namah || 26|| pravrittya rajaso yacca karmanam karanatmakam
    | janardana namastasmai tvadrupaya naratmane || 27|| ashtavimshadvadhopetam yadrupam tamasam tava
    | unmargagami sarvatmamstasmai vashyatmane namah || 28|| yajnangabhutam yadrupam jagatah sthitisadhanam
    | vrikshadibhedaishshadbhedi tasmai mukhyatmane namah || 29|| tiryanmanushyadevadivyomashabdadikam
    ca yat | rupam tavadeh sarvasya tasmai sarvatmane namah || 30|| pradhanabuddhyadimayadashshadyadanyadasmatparamam
    paratman | rupam tavadyam yadananyatulyam tasmai namah karanakaranaya || 31|| shukladidirghadighanadihinamagocaram
    yacca visheshananam | shuddhatishuddham paramarshidrishyam rupaya tasmai bhagavannatah smah || 32||
    yannah sharireshu yadanyadeheshvashshavastushvajamakshayam yat | tasmacca nanyadvyatiriktamasti brahmasvarupaya
    natah sma tasmai || 33|| sakalamidamajasya yasya rupam paramapadatmavatassanatanasya | tamanidhanamasheshabijabhutam
    prabhumamalam pranatassma vasudevam || 34|| iti vishnupurane tritiyabhage saptadashadhyayantargatam
    devaih kritam vishnustotram samaptam | vishnupurana | adhyaya 3
  devanagari: देवैः कृतं २ विष्णुस्तोत्रम् देवा ऊचुः । आराधनाय लोकानां विष्णोरीशस्य यां गिरम् । वक्ष्यामो
    भगवानद्य तया विष्णुः प्रसीदतु ॥ ११॥ यतो भूतान्यश्षानि प्रसूतानि महात्मनः । यस्मिंश्च लयमेष्यन्ति कस्तं
    स्तोतुमिहेश्वरः ॥ १२॥ तथाप्यरातिविध्वंसध्वस्तवीर्या भयार्थिनः । त्वां स्तोष्यामस्तवोक्तीनां याथार्थ्यं
    नैव गोचरे ॥ १३॥ त्वमुर्वी सलिलं वह्निर्वायुराकाशमेव च । समस्तमन्तःकरणं प्रधानं तत्परः पुमान् ॥ १४॥
    एकं तवैतद्भूतात्मन्मूर्त्तमूर्त्तमयं वपुः । आब्रह्मस्तम्बपर्यन्तं स्थानकालविभेदवत् ॥ १५॥ तत्रेश तव
    यत्पूर्वं त्वन्नाभिकमलोद्भवम् । रूपं विश्वोपकाराय तस्मै ब्रह्मात्मने नमः ॥ १६॥ शक्रार्करुद्रवस्वश्विमरुत्सोमादिभेदवत्
    । वयमेकं स्वरूपं ते तस्मै देवात्मने नमः ॥ १७॥ दम्भप्रायमसम्बोधि तितिक्षादमवर्जितम् । यद्रूपं तव गोविन्द
    तस्मै दैत्यात्मने नमः ॥ १८॥ नातिज्ञानवहा यस्मिन्नाड्यः स्तिमिततेजसि । शब्दादिलोभि यत्तस्मै तुभ्यं
    यक्षात्मने नमः ॥ १९॥ क्रौर्यं मायामयं घोरं यच्च रूपं तवासितम् । निशाचरात्मने तस्मै नमस्ते पुरुषोत्तम
    ॥ २०॥ स्वर्गस्थधर्मिसद्धर्मफलोपकरणं तव । धर्माख्यं च तथा रूपं नमस्तस्मै जनार्द्दन ॥ २१॥ हर्षप्रायमसंसर्गि
    गतिमद्गमनादिषु । सिद्धाख्यं तव यद्रूपं तस्मै सिद्धात्मने नमः ॥ २२॥ अतितिक्षायनं क्रूरमुपभोगसहं हरे
    । द्विजिह्वं तव यद्रूपं तस्मै नागात्मने नमः ॥ २३॥ अवबोधि च यच्छान्तमदोषमपकल्मषम् । ऋषिरूपात्मने तस्मै
    विश्वरूपाय ते नमः ॥ २४॥ भक्षयत्यथ कल्पान्ते भूतानि यदवारितम् । त्वद्रूपं पुण्डरीकाक्ष तस्मै कालात्मने
    नमः ॥ २५॥ सम्भक्ष्य सर्वभूतानि देवादीन्यविशेषतः । नृत्यत्यन्ते च यद्रूपं तस्मै रुद्रात्मने नमः ॥ २६॥
    प्रवृत्त्या रजसो यच्च कर्मणां करणात्मकम् । जनार्दन नमस्तस्मै त्वद्रूपाय नरात्मने ॥ २७॥ अष्टाविंशद्वधोपेतं
    यद्रूपं तामसं तव । उन्मार्गगामि सर्वात्मंस्तस्मै वश्यात्मने नमः ॥ २८॥ यज्ञाङ्गभूतं यद्रूपं जगतः स्थितिसाधनम्
    । वृक्षादिभेदैष्षड्भेदि तस्मै मुख्यात्मने नमः ॥ २९॥ तिर्यङ्मनुष्यदेवादिव्योमशब्दादिकं च यत् । रूपं
    तवादेः सर्वस्य तस्मै सर्वात्मने नमः ॥ ३०॥ प्रधानबुद्ध्यादिमयादश्षाद्यदन्यदस्मात्परमं परात्मन् । रूपं
    तवाद्यं यदनन्यतुल्यं तस्मै नमः कारणकारणाय ॥ ३१॥ शुक्लादिदीर्घादिघनादिहीनमगोचरं यच्च विशेषणानाम् ।
    शुद्धातिशुद्धं परमर्षिदृश्यं रूपाय तस्मै भगवन्नताः स्मः ॥ ३२॥ यन्नः शरीरेषु यदन्यदेहेष्वश्षवस्तुष्वजमक्षयं
    यत् । तस्माच्च नान्यद्व्यतिरिक्तमस्ति ब्रह्मस्वरूपाय नताः स्म तस्मै ॥ ३३॥ सकलमिदमजस्य यस्य रूपं परमपदात्मवतस्सनातनस्य
    । तमनिधनमशेषबीजभूतं प्रभुममलं प्रणतास्स्म वासुदेवम् ॥ ३४॥ इति विष्णुपुराणे तृतीयभागे सप्तदशाध्यायान्तर्गतं
    देवैः कृतं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय ३
