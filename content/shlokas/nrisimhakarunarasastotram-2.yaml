id: nrisimhakarunarasastotram-2
category: stotram
name:
  english: nrisimhakarunarasastotram 2
  devanagari: नृसिंहकरुणारसस्तोत्रम् २
content:
  english: shrinrisimhakarunarasastotram 2 shrinrisimhaya namah | yace'ham karunasindho yavajjivamidam
    tava | adainyam dehadarddham ca tvatpadambujasadgatim || 1|| anadyanantakaleshu bhrityo'ham tvam hi
    me prabhuh | tvam tushtovatha rushto va tvam vina me gatirnahi || 2|| tushto'si tvam dayasindho kimanyairmama
    rakshane | rushto'si tvam dayasindho kimanyairmama rakshane || 3|| doshanam ca sahishnutve tvatsamo
    nasti bhutale | matsamo nahi devesha kritaghno vancako'pi va || 4|| prasiddhashukladaso'ham shashvattava
    jagatpate | kim bhayam kimu me lakshyam sarveshvapi dhurandhara || 5|| ishasya purnakamasya kimasadhyam
    vadacyuta | mameshtam ca kiyanmatram kimetavadvilambanam || 6|| jagatsvami kripapurnah sambhavennirdayaparah
    | ka tada gatirasmakam garadayam svamatari || 7|| tvamevaiko jagatrata data jnata dayanvitah | tvam
    vina kah pumankarta hyasmakam tu manoratham || 8|| udaragunashilasya samyam sarvatra vai tava | kasmalakshmipateh
    shriman mayi lobhah kimidrishah || 9|| artabandhuriti jnatva tvamaham sharanam gatah | raksha mam
    athava samyak tvam yasho munca shashvatam || 10|| dinabandho dayasindho suhridvandho jagatpate | samsararnavamagnam
    mamindiresha samuddhara || 11|| shrinrisimha dayamurte mayyarte nirdayakrita | ko dharmah kimidam
    bhagyam kim yasho lokavishrutam || 12|| sukritinam madiyatvam karoshi tvam kimadbhutam | tatkritam
    cenmayi hare tadaiva vipulam yashah || 13|| nirguneshvapi sarveshu dayam kurvanti sadhavah | na hi
    samharate jyotsnam candrashcandalaveshmani || 14|| prasida me shriyah kanta suprasida dayanidhe |
    punah punah prasida tvam prasidam varadobhava || 15|| iti shri pancaratragamoktakarunarasastotram
    sampurnam |
  devanagari: श्रीनृसिंहकरुणारसस्तोत्रम् २ श्रीनृसिंहाय नमः । याचेऽहं करुणासिन्धो यावज्जीवमिदं तव । अदैन्यं
    देहदार्द्धं च त्वत्पादाम्बुजसद्गतिम् ॥ १॥ अनाद्यनन्तकालेषु भृत्योऽहं त्वं हि मे प्रभुः । त्वं तुष्टोवाथ
    रुष्टो वा त्वां विना मे गतिर्नहि ॥ २॥ तुष्टोऽसि त्वं दयासिन्धो किमन्यैर्मम रक्षणे । रुष्टोऽसि त्वं
    दयासिन्धो किमन्यैर्मम रक्षणे ॥ ३॥ दोषाणां च सहिष्णुत्वे त्वत्समो नास्ति भूतले । मत्समो नहि देवेश कृतघ्नो
    वञ्चकोऽपि वा ॥ ४॥ प्रसिद्धशुक्लदासोऽहं शश्वत्तव जगत्पते । किं भयं किमु मे लक्ष्यं सर्वेष्वपि धुरन्धर
    ॥ ५॥ ईशस्य पूर्णकामस्य किमसाध्यं वदाच्युत । ममेष्टं च कियन्मात्रं किमेतावद्विलम्बनम् ॥ ६॥ जगत्स्वामी
    कृपापूर्णः सम्भवेन्निर्दयापरः । का तदा गतिरस्माकं गरदायां स्वमातरि ॥ ७॥ त्वमेवैको जगत्राता दाता ज्ञाता
    दयान्वितः । त्वां विना कः पुमान्कर्ता ह्यस्माकं तु मनोरथम् ॥ ८॥ उदारगुणशीलस्य साम्यं सर्वत्र वै तव
    । कस्मालक्ष्मीपतेः श्रीमन् मयि लोभः किमीदृशः ॥ ९॥ आर्तबन्धुरिति ज्ञात्वा त्वामहं शरणं गतः । रक्ष मां
    अथवा सम्यक् त्वं यशो मुञ्च शाश्वतम् ॥ १०॥ दीनबन्धो दयासिन्धो सुहृद्वन्धो जगत्पते । संसारार्णवमग्नं
    मामिन्दिरेश समुद्धर ॥ ११॥ श्रीनृसिंह दयामूर्ते मय्यार्ते निर्दयाकृता । को धर्मः किमिदं भाग्यं किं
    यशो लोकविश्रुतम् ॥ १२॥ सुकृतीनां मदीयत्वं करोषि त्वं किमद्भुतम् । तत्कृतं चेन्मयि हरे तदैव विपुलं
    यशः ॥ १३॥ निर्गुणेष्वपि सर्वेषु दयां कुर्वन्ति साधवः । न हि संहरते ज्योत्स्नां चन्द्रश्चाण्डालवेश्मनि
    ॥ १४॥ प्रसीद मे श्रियः कान्त सुप्रसीद दयानिधे । पुनः पुनः प्रसीद त्वं प्रसीदं वरदोभव ॥ १५॥ इति श्री
    पञ्चरात्रागमोक्तकरुणारसस्तोत्रं सम्पूर्णम् ।
