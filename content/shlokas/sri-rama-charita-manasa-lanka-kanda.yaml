    बीरासन। कटि निषङ्ग कर बान सरासन ॥ दो एहि बिधि कृपा रूप गुन धाम रामु आसीन। धन्य ते नर एहिं ध्यान जे
    रहत सदा लयलीन ॥ ॥ पूरब दिसा बिलोकि प्रभु देखा उदित मंयक। कहत सबहि देखहु ससिहि मृगपति सरिस असङ्क ॥
    ॥ पूरब दिसि गिरिगुहा निवासी। परम प्रताप तेज बल रासी ॥ मत्त नाग तम कुम्भ बिदारी। ससि केसरी गगन बन चारी
    ॥ बिथुरे नभ मुकुताहल तारा। निसि सुन्दरी केर सिङ्गारा ॥ कह प्रभु ससि महुँ मेचकताई। कहहु काह निज निज
    मति भाई ॥ कह सुग़ईव सुनहु रघुराई। ससि महुँ प्रगट भूमि कै झाँई ॥ मारेउ राहु ससिहि कह कोई। उर महँ परी
    स्यामता सोई ॥ कौ कह जब बिधि रति मुख कीन्हा। सार भाग ससि कर हरि लीन्हा ॥ छिद्र सो प्रगट इन्दु उर माहीं।
    तेहि मग देखिअ नभ परिछाहीम् ॥ प्रभु कह गरल बन्धु ससि केरा। अति प्रिय निज उर दीन्ह बसेरा ॥ बिष सञ्जुत
    कर निकर पसारी। जारत बिरहवन्त नर नारी ॥ दो कह हनुमन्त सुनहु प्रभु ससि तुम्हारा प्रिय दास। तव मूरति
    बिधु उर बसति सोइ स्यामता अभास ॥ ॥ नवान्हपारायण ॥ सातवाँ विश्राम पवन तनय के बचन सुनि बिहँसे रामु सुजान।
    दच्छिन दिसि अवलोकि प्रभु बोले कृपा निधान ॥ ॥ देखु बिभीषन दच्छिन आसा। घन घम्मड दामिनि बिलासा ॥ मधुर
    मधुर गरजि घन घोरा। होइ बृष्टि जनि उपल कठोरा ॥ कहत बिभीषन सुनहु कृपाला। होइ न तड़इत न बारिद माला ॥
    लङ्का सिखर उपर आगारा। तहँ दसकङ्घर देख अखारा ॥ छत्र मेघडम्बर सिर धारी। सोइ जनु जलद घटा अति कारी ॥ मन्दोदरी
    श्रवन ताटङ्का। सोइ प्रभु जनु दामिनी दमङ्का ॥ बाजहिं ताल मृदङ्ग अनूपा। सोइ रव मधुर सुनहु सुरभूपा ॥
    प्रभु मुसुकान समुझि अभिमाना। चाप चढ़आइ बान सन्धाना ॥ दो छत्र मुकुट ताटङ्क तब हते एकहीं बान। सबकें
    देखत महि परे मरमु न कोऊ जान ॥ ॥ अस कौतुक करि राम सर प्रबिसेउ आइ निषङ्ग। रावन सभा ससङ्क सब देखि महा
    रसभङ्ग ॥ ॥ कम्प न भूमि न मरुत बिसेषा। अस्त्र सस्त्र कछु नयन न देखा ॥ सोचहिं सब निज हृदय मझारी। असगुन
    भयु भयङ्कर भारी ॥ दसमुख देखि सभा भय पाई। बिहसि बचन कह जुगुति बनाई ॥ सिरु गिरे सन्तत सुभ जाही। मुकुट
    परे कस असगुन ताही ॥ सयन करहु निज निज गृह जाई। गवने भवन सकल सिर नाई ॥ मन्दोदरी सोच उर बसेऊ। जब ते श्रवनपूर
    महि खसेऊ ॥ सजल नयन कह जुग कर जोरी। सुनहु प्रानपति बिनती मोरी ॥ कन्त राम बिरोध परिहरहू। जानि मनुज जनि
    हठ मन धरहू ॥ दो बिस्वरुप रघुबंस मनि करहु बचन बिस्वासु। लोक कल्पना बेद कर अङ्ग अङ्ग प्रति जासु ॥ ॥
    पद पाताल सीस अज धामा। अपर लोक अँग अँग बिश्रामा ॥ भृकुटि बिलास भयङ्कर काला। नयन दिवाकर कच घन माला ॥
    जासु घ्रान अस्विनीकुमारा। निसि अरु दिवस निमेष अपारा ॥ श्रवन दिसा दस बेद बखानी। मारुत स्वास निगम निज
    बानी ॥ अधर लोभ जम दसन कराला। माया हास बाहु दिगपाला ॥ आनन अनल अम्बुपति जीहा। उतपति पालन प्रलय समीहा
    ॥ रोम राजि अष्टादस भारा। अस्थि सैल सरिता नस जारा ॥ उदर उदधि अधगो जातना। जगमय प्रभु का बहु कलपना ॥
    दो अहङ्कार सिव बुद्धि अज मन ससि चित्त महान। मनुज बास सचराचर रुप राम भगवान ॥ क ॥ अस बिचारि सुनु प्रानपति
    प्रभु सन बयरु बिहाइ। प्रीति करहु रघुबीर पद मम अहिवात न जाइ ॥ ख ॥ बिहँसा नारि बचन सुनि काना। अहो मोह
    महिमा बलवाना ॥ नारि सुभाउ सत्य सब कहहीं। अवगुन आठ सदा उर रहहीम् ॥ साहस अनृत चपलता माया। भय अबिबेक
    असौच अदाया ॥ रिपु कर रुप सकल तैं गावा। अति बिसाल भय मोहि सुनावा ॥ सो सब प्रिया सहज बस मोरें। समुझि
    परा प्रसाद अब तोरेम् ॥ जानिउँ प्रिया तोरि चतुराई। एहि बिधि कहहु मोरि प्रभुताई ॥ तव बतकही गूढ़ मृगलोचनि।
    समुझत सुखद सुनत भय मोचनि ॥ मन्दोदरि मन महुँ अस ठयू। पियहि काल बस मतिभ्रम भयू ॥ दो एहि बिधि करत बिनोद
    बहु प्रात प्रगट दसकन्ध। सहज असङ्क लङ्कपति सभाँ गयु मद अन्ध ॥ फूलह फरि न बेत जदपि सुधा बरषहिं जलद।
    मूरुख हृदयँ न चेत जौं गुर मिलहिं बिरञ्चि सम ॥ ॥ इहाँ प्रात जागे रघुराई। पूछा मत सब सचिव बोलाई ॥ कहहु
    बेगि का करिअ उपाई। जामवन्त कह पद सिरु नाई ॥ सुनु सर्बग्य सकल उर बासी। बुधि बल तेज धर्म गुन रासी ॥
    मन्त्र कहुँ निज मति अनुसारा। दूत पठाइअ बालिकुमारा ॥ नीक मन्त्र सब के मन माना। अङ्गद सन कह कृपानिधाना
    ॥ बालितनय बुधि बल गुन धामा। लङ्का जाहु तात मम कामा ॥ बहुत बुझाइ तुम्हहि का कहूँ। परम चतुर मैं जानत
    अहूँ ॥ काजु हमार तासु हित होई। रिपु सन करेहु बतकही सोई ॥ सो प्रभु अग्या धरि सीस चरन बन्दि अङ्गद उठेउ।
    सोइ गुन सागर ईस राम कृपा जा पर करहु ॥ ॥ स्वयं सिद्ध सब काज नाथ मोहि आदरु दियु। अस बिचारि जुबराज तन
    पुलकित हरषित हियु ॥ ॥ बन्दि चरन उर धरि प्रभुताई। अङ्गद चलेउ सबहि सिरु नाई ॥ प्रभु प्रताप उर सहज असङ्का।
    रन बाँकुरा बालिसुत बङ्का ॥ पुर पैठत रावन कर बेटा। खेलत रहा सो होइ गै भैण्टा ॥ बातहिं बात करष बढ़इ
    आई। जुगल अतुल बल पुनि तरुनाई ॥ तेहि अङ्गद कहुँ लात उठाई। गहि पद पटकेउ भूमि भवाँई ॥ निसिचर निकर देखि
    भट भारी। जहँ तहँ चले न सकहिं पुकारी ॥ एक एक सन मरमु न कहहीं। समुझि तासु बध चुप करि रहहीम् ॥ भयु कोलाहल
    नगर मझारी। आवा कपि लङ्का जेहीं जारी ॥ अब धौं कहा करिहि करतारा। अति सभीत सब करहिं बिचारा ॥ बिनु पूछें
    मगु देहिं दिखाई। जेहि बिलोक सोइ जाइ सुखाई ॥ दो गयु सभा दरबार तब सुमिरि राम पद कञ्ज। सिंह ठवनि इत उत
    चितव धीर बीर बल पुञ्ज ॥ ॥ तुरत निसाचर एक पठावा। समाचार रावनहि जनावा ॥ सुनत बिहँसि बोला दससीसा। आनहु
    बोलि कहाँ कर कीसा ॥ आयसु पाइ दूत बहु धाए। कपिकुञ्जरहि बोलि लै आए ॥ अङ्गद दीख दसानन बैंसें। सहित प्रान
    कज्जलगिरि जैसेम् ॥ भुजा बिटप सिर सृङ्ग समाना। रोमावली लता जनु नाना ॥ मुख नासिका नयन अरु काना। गिरि
    कन्दरा खोह अनुमाना ॥ गयु सभाँ मन नेकु न मुरा। बालितनय अतिबल बाँकुरा ॥ उठे सभासद कपि कहुँ देखी। रावन
