id: padmanabhashatakam
category: shataka
name:
  english: padmanabhashatakam
  devanagari: पद्मनाभशतकम्
content:
  english: nashyatyaghaugho na hi vasana tu | tvatpadaseva harati dvayam yat tasmatsthira saiva mamashu
    bhuyat || 6|| tvadiyanamasmritirapyakasmad dhunoti papaughamasamshayam tat | yadvadgadanaushadhamashu
    hanti yatha krishanurbhuvi darukutam || 7|| yadyatsmaran projjhati dehametat prayanakale vivasho'tra
    dehi | tattatkilapnoti yadanyabhave tasmattavaiva smritirastu nityam || 8|| anekadharman pracaranmanushyah
    nake nu bhunkte sukhamavyalikam | tasyavadhau sampatatihabhumau tvatsevako jatu na vicyutah syat ||
    9|| tasmatsamastartiharam jananam svapadabhajam shrutisaramrigyam | tavadya rupam paripurnasatvam
    ramamanohari vibhatu citte || 10|| || tritiyam dashakam || dinamanupadayugmam bhavayeyam murare kulishashapharamukhyaishcihnite
    caru cihnaih | nakhamanividhudiptya dhvastayogindraceto
  devanagari: नश्यत्यघौघो न हि वासना तु । त्वत्पादसेवा हरति द्वयं यत् तस्मात्स्थिरा सैव ममाशु भूयात् ॥
    ६॥ त्वदीयनामस्मृतिरप्यकस्माद् धुनोति पापौघमसंशयं तत् । यद्वद्गदानौषधमाशु हन्ति यथा कृशानुर्भुवि दारुकूटम्
    ॥ ७॥ यद्यत्स्मरन् प्रोज्झति देहमेतत् प्रयाणकाले विवशोऽत्र देही । तत्तत्किलाप्नोति यदन्यभावे तस्मात्तवैव
    स्मृतिरस्तु नित्यम् ॥ ८॥ अनेकधर्मान् प्रचरन्मनुष्यः नाके नु भुङ्क्ते सुखमव्यलीकम् । तस्यावधौ सम्पततीहभूमौ
    त्वत्सेवको जातु न विच्युतः स्यात् ॥ ९॥ तस्मात्समस्तार्तिहरं जनानां स्वपादभाजां श्रुतिसारमृग्यम् ।
    तवाद्य रूपं परिपूर्णसत्वं रमामनोहारि विभातु चित्ते ॥ १०॥ ॥ तृतीयं दशकम् ॥ दिनमनुपदयुग्मं भावयेयं मुरारे
    कुलिशशफरमुख्यैश्चिह्निते चारु चिह्नैः । नखमणिविधुदीप्त्या ध्वस्तयोगीन्द्रचेतो
