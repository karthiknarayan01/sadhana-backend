id: narayaniyam-dashaka-58
category: stotram
name:
  english: Narayaniyam Dashaka 58
content:
  english: tvayi viharanalole balajalaih pralamba pramathanasavilambe dhenavah svairacarah | trinakutukanivishta
    duraduram carantyah kimapi vipinamaishikakhyamishambabhuvuh || || anadhigatanidaghakrauryavrindavanantat
    bahiridamupayatah kananam dhenavastah | tava virahavishanna ushmalagrishmatapa prasaravisaradambhasyakulah
    stambhamapuh || || tadanu saha sahayairduramanvishya shaure galitasaranimunjaranyasanjatakhedam |
    pashukulamabhivikshya kshipramanetumara ttvayi gatavati hi hi sarvato'gnirjajrimbhe || || sakalahariti
    dipte ghorabhankarabhime shikhini vihatamarga ardhadagdha ivartah | ahaha bhuvanabandho pahi pahiti
    sarve sharanamupagatastvam tapahartaramekam || || alamalamatibhitya sarvato milayadhvam drishamiti
    tava vaca militaksheshu teshu | kva nu davadahano'sau kutra munjatavi sa sapadi vavritire te hanta
    bhandiradeshe || || jaya jaya tava maya keyamisheti tesham nutibhiruditahaso baddhananavilasah | punarapi
    vipinante pracarah pataladi prasavanikaramatragrahyagharmanubhave || || tvayi vimukhamivoccaistapabharam
    vahantam tava bhajanavadantah pankamucchoshayantam | tava bhujavadudancadbhuritejahpravaham tapasamayamanaishiryamuneshu
    sthaleshu || || tadanu jaladajalaistvadvapustulyabhabhi rvikasadamalavidyutpitavasovilasaih | sakalabhuvanabhajam
    harshadam varshavelam kshitidharakuhareshu svairavasi vyanaishih || || kuharatalanivishtam tvam garishtham
    girindrah shikhikulanavakekakakubhih stotrakari | sphutakutajakadambastomapushpanjalim ca pravidadhadanubheje
    deva govardhano'sau || || atha sharadamupetam tam bhavadbhaktaceto vimalasalilapuram manayan kananeshu
    | trinamamalavanante caru sancarayan gah pavanapurapate tvam dehi me dehasaukhyam ||
  devanagari: त्वयि विहरणलोले बालजालैः प्रलम्ब प्रमथनसविलम्बे धेनवः स्वैरचाराः । तृणकुतुकनिविष्टा दूरदूरं
    चरन्त्यः किमपि विपिनमैषीकाख्यमीषाम्बभूवुः ॥ ॥ अनधिगतनिदाघक्रौर्यवृन्दावनान्तात् बहिरिदमुपयाताः काननं
    धेनवस्ताः । तव विरहविषण्णा ऊष्मलग्रीष्मताप प्रसरविसरदम्भस्याकुलाः स्तम्भमापुः ॥ ॥ तदनु सह सहायैर्दूरमन्विष्य
    शौरे गलितसरणिमुञ्जारण्यसञ्जातखेदम् । पशुकुलमभिवीक्ष्य क्षिप्रमानेतुमारा त्त्वयि गतवति ही ही सर्वतोऽग्निर्जजृम्भे
    ॥ ॥ सकलहरिति दीप्ते घोरभाङ्कारभीमे शिखिनि विहतमार्गा अर्धदग्धा इवार्ताः । अहह भुवनबन्धो पाहि पाहीति
    सर्वे शरणमुपगतास्त्वां तापहर्तारमेकम् ॥ ॥ अलमलमतिभीत्या सर्वतो मीलयध्वं दृशमिति तव वाचा मीलिताक्षेषु
    तेषु । क्व नु दवदहनोऽसौ कुत्र मुञ्जाटवी सा सपदि ववृतिरे ते हन्त भाण्डीरदेशे ॥ ॥ जय जय तव माया केयमीशेति
    तेषां नुतिभिरुदितहासो बद्धनानाविलासः । पुनरपि विपिनान्ते प्राचरः पाटलादि प्रसवनिकरमात्रग्राह्यघर्मानुभावे
    ॥ ॥ त्वयि विमुखमिवोच्चैस्तापभारं वहन्तं तव भजनवदन्तः पङ्कमुच्छोषयन्तम् । तव भुजवदुदञ्चद्भूरितेजःप्रवाहं
    तपसमयमनैषीर्यामुनेषु स्थलेषु ॥ ॥ तदनु जलदजालैस्त्वद्वपुस्तुल्यभाभि र्विकसदमलविद्युत्पीतवासोविलासैः
    । सकलभुवनभाजां हर्षदां वर्षवेलां क्षितिधरकुहरेषु स्वैरवासी व्यनैषीः ॥ ॥ कुहरतलनिविष्टं त्वां गरिष्ठं
    गिरीन्द्रः शिखिकुलनवकेकाकाकुभिः स्तोत्रकारी । स्फुटकुटजकदम्बस्तोमपुष्पाञ्जलिं च प्रविदधदनुभेजे देव
    गोवर्धनोऽसौ ॥ ॥ अथ शरदमुपेतां तां भवद्भक्तचेतो विमलसलिलपूरां मानयन् काननेषु । तृणममलवनान्ते चारु सञ्चारयन्
    गाः पवनपुरपते त्वं देहि मे देहसौख्यम् ॥
