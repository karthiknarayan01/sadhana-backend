    || lanka~ dvau kapi sohahim kaisem| mathahi sindhu dui mandara jaisem || do bhuja bala ripu dala dalamali
    dekhi divasa kara anta| kude jugala bigata shrama ae jaha~ bhagavanta || || prabhu pada kamala sisa
