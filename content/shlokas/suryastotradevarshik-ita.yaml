id: suryastotradevarshik-ita
category: stotram
name:
  english: suryastotradevarshikṟita
  devanagari: सूर्यस्तोत्रदेवर्षिक्ऱित
content:
  english: suryastotram 3 deva ucuh namaste riksvarupaya samarupaya te namah | yajuhsvaruparupaya samnandhamavate
    namah || 1|| jnanaikadhamabhutaya nirdhutatamase namah | shuddhajyotihsvarupaya vishuddhayamalatmane
    || 2|| varishthaya varenyaya parasmai paramatmane | namo'khilajagadvyapisvarupayatmamurtaye || 3||
    idam stotravaram ramyam shrotavyam shraddhaya naraih | shishyo bhutva samadhistho dattva deyam gurorapi
    || 4|| na shunyabhutaih shrotavyametattu saphalam bhavet | sarvakaranabhutaya nishthayai jnanacetasam
    || 5|| namah suryasvarupaya prakashatmasvarupine | bhaskaraya namastubhyam tatha dinakrite namah ||
    6|| sharvarihetave caiva sandhyajyotsnakrite namah | tvam sarvametadbhagavan jagadudbhramata tvaya
    || 7|| bhramatyaviddhamakhilam brahmandam sacaracaram | tvadamshubhiridam sprishtam sarvam sanjayate
    shuci || 8|| kriyate tvatkaraih sparshajjaladinam pavitrata | homadanadiko dharmo nopakaraya jayate
    || 9|| tavadyavanna samyogi jagadetat tvadamshubhih | ricaste sakala hyeta yajumshyetani canyatah
    || 10|| sakalani ca samani nipatanti tvadadgatah | rinmayastvam jagannatha
  devanagari: सूर्यस्तोत्रम् ३ देवा ऊचुः नमस्ते ऋक्स्वरूपाय सामरूपाय ते नमः । यजुःस्वरूपरूपाय साम्नान्धामवते
    नमः ॥ १॥ ज्ञानैकधामभूताय निर्धूततमसे नमः । शुद्धज्योतिःस्वरूपाय विशुद्धायामलात्मने ॥ २॥ वरिष्ठाय वरेण्याय
    परस्मै परमात्मने । नमोऽखिलजगद्व्यापिस्वरूपायात्ममूर्तये ॥ ३॥ इदं स्तोत्रवरं रम्यं श्रोतव्यं श्रद्धया
    नरैः । शिष्यो भूत्वा समाधिस्थो दत्त्वा देयं गुरोरपि ॥ ४॥ न शून्यभूतैः श्रोतव्यमेतत्तु सफलं भवेत् ।
    सर्वकारणभूताय निष्ठायै ज्ञानचेतसाम् ॥ ५॥ नमः सूर्यस्वरूपाय प्रकाशात्मस्वरूपिणे । भास्कराय नमस्तुभ्यं
    तथा दिनकृते नमः ॥ ६॥ शर्वरीहेतवे चैव सन्ध्याज्योत्स्नाकृते नमः । त्वं सर्वमेतद्भगवन् जगदुद्भ्रमता
    त्वया ॥ ७॥ भ्रमत्याविद्धमखिलं ब्रह्माण्डं सचराचरम् । त्वदंशुभिरिदं स्पृष्टं सर्वं सञ्जायते शुचि ॥
    ८॥ क्रियते त्वत्करैः स्पर्शाज्जलादीनां पवित्रता । होमदानादिको धर्मो नोपकाराय जायते ॥ ९॥ तावद्यावन्न
    संयोगि जगदेतत् त्वदंशुभिः । ऋचस्ते सकला ह्येता यजूंष्येतानि चान्यतः ॥ १०॥ सकलानि च सामानि निपतन्ति
    त्वदड्गतः । ऋङ्मयस्त्वं जगन्नाथ
