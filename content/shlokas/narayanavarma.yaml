id: narayanavarma
category: stotram
name:
  english: narayanavarma
  devanagari: नारायनवर्म
content:
  english: rinu || 3|| shrivishvarupa uvaca | dhautamghripaniracamya sapavitra udanmukhah | kritasvangakaranyaso
    mantrabhyam vagyatah shucih || 4|| narayanamayam varma sannahyedbhaya agate | daivabhutatmakarmabhyo
    narayanamayah pumana || 5|| padayorjanunorurvorudare hridyathorasi | mukhe shirasyanupurvyadonkaradini
    vinyaset || 6|| om namo narayanayeti viparyayamathapi va | karanyasam tatah kuryaddvadashaksharavidyaya
    || 7|| pranavadiyakarantamangulyangushthaparvasu | nyaseddhridaya omkaram vikaramanumurdhani || 8||
    shakaram tu bhruvormadhye nakaram shikhaya nyaset | vekaram netrayoryumjyannakaram sarvasandhishu
    || 9|| makaramastrumuddishya mantramurtirbhavedbudhah | sarvisargam phadantam tatsarvadikshu vinirdishet
    || 10|| om vishnave namah | ityatmanam param dhyayeddhyeyam shatshaktibhiryutam | vidyatejastapormutimimam
    mantramudaharet || 11|| om harirvidadhyanmama sarvaraksham nyastamghripadmah patagendraprishthe |
    dararicarmasigadeshucapapashandadhano'shtaguno'shtabahuh || 12|| jaleshu mam rakshatu matsyamurtiryadoganebhyo
    varunasya pashat | sthaleshu mayabatuvamano'vyat trivikramah khe'vatu vishvarupah || 13|| durgeshvatavyajimukhadishu
    prabhuh payannrisimho'surayuthaparih | vimuncato yasya mahattahasam disho vinedurnyapatamshca garbhah
    || 14|| rakshatvasau ma'dhvani yajnakalpah svadamshtrayonnitadharo varahah | ramo'drikuteshvatha vipravase
    salakshmano'vyadbharatagrajo mam || 15|| mamugradharmadakhilatpramadannarayanah patu narashca hasat
    | dattastvayogadatha yoganathah payadguneshah kapilah karmabandhat || 16|| sanatkumaro'vatu kamadevaddhayagrivo
    mam pathi devahelanat | devarshivaryah purusharcanantaratkurmo harirmam nirayadasheshat || 17|| dhanvantarirbhagavanpatvapathyadvandvadbhayadrishabho
    nirjitatma | yajnashca lokadavatajjanantadbalo ganatkrodhavashadahindrah || 18|| dvaipayano bhagavanaprabodhadbuddhastu
    pashandaganatpramadat | kalkih kaleh kalamalatprapatu dharmavanayorukritavatarah || 19|| mam keshavo
    gadaya prataravyadgovinda asangava attavenuh | narayanah prahna udattashaktirmadhyandine vishnurarindrapanih
    || 20|| devo'parahne madhuhogradhanva sayantridhama'vatu madhavo mam | doshe hrishikesha utardharatre
    nishitha eko'vatu padmanabhah || 21|| shrivatsadhama'pararatra ishah pratyusha isho'sidharo janardanah
    | damodaro'vyadanusandhyam prabhate vishveshvaro bhagavankalamurtih || 22|| cakram yugantanalatigmanemi
    bhramatsamantadbhagavatprayuktam | dandagdhi dandagdhyarisainyamashu kaksham yatha vatasakho hutashah
    || 23|| gade'shanisparshanavisphulinge nishpindhi nishpindhyajitapriyasi | kushmandavainayakayaksharakshobhutagrahamshcurnaya
    curnayarin || 24|| tvam yatudhanapramathapretamatripishacavipragrahaghoradrishtin | narendra vidravaya
    krishnapurito bhimasvano'rerhridayani kampayan || 25|| tvam tigmadharasivararisainyamishaprayukto
    mama chindhi chindhi | cakshumshi carman shatacandra chadaya dvishamaghanam hara papacakshusham ||
    26|| yanno bhayam grahebhyo'bhutketubhyo nribhya eva ca | sarisripebhyo damshtribhya bhutebhyo'ghebhya
    eva ca || 27|| sarvanyetani bhagavannamarupasrakirtanat | prayamtu samkshayam sadyo ye'nye shreyahpratipakah
    || 28|| garudo bhagavamstotrastomashchandomayah prabhuh | rakshatvasheshakricchrebhyo vishvaksenah
    svanamabhih || 29|| sarvapadbhyo harernamarupayanayudhani nah | buddhindriyamanahpranan pantu parshadabhushanah
    || 30|| yatha hi bhagavaneva vastutah sadasacca yat | satyenanena nah sarve yantu nashamupadravah
    || 31|| yathaikatmyanubhavanam vikalparahitah svayam | bhushanayudhalingakhya dhatte shaktih svamayaya
    || 32|| tenaiva satyamanena sarvajno bhagavan harih | patu sarvaih svarupairnah sada sarvatra sarvagah
    || 33|| vidikshu dikshurghvamadhah samantadantarbahirbhagavannarasimhah | prahapaya~llokabhayam svanena
    svatejasa grastasamastatejah || 34|| maghavannidamakhyatam varma narayanatmakam | vijeshyasyanjasa
    yena damshito'surayuthapan || 35|| etaddharayamanastu yam yam pashyati cakshusha | pada va samsprishetsadyah
    sadhvasatsa vimucyate || 36|| na kutashcidbhayam tasya vidyam dharayato bhavet | rajadasyugrahadibhyo
    vyadhyadibhyashca karhicit || 37|| imam vidyam pura kashcitkaushiko dharayan dvijah | yogadharanaya
    svangam jahau sa marudhanvani || 38|| tasyopari vimanena gandharvapatirekada | yayau citrarathah stribhirvrito
    yatra dvijakshayah || 39|| gaganannyapatatsadyah savimano hyavakshirah | sa valakhilyavacanadasthinyadaya
    vismitah || 40|| prasya pracisarasvatyam snatva dhama svamanvagat | ya idam sha
  devanagari: ृणु ॥ ३॥ श्रीविश्वरूप उवाच । धौतांघ्रिपाणिराचम्य सपवित्र उदङ्मुखः । कृतस्वाङ्गकरन्यासो मन्त्राभ्यां
    वाग्यतः शुचिः ॥ ४॥ नारायणमयं वर्म सन्नह्येद्भय आगते । दैवभूतात्मकर्मभ्यो नारायणमयः पुमान ॥ ५॥ पादयोर्जानुनोरूर्वोरुदरे
    हृद्यथोरसि । मुखे शिरस्यानुपूर्व्यादोङ्कारादीनि विन्यसेत् ॥ ६॥ ॐ नमो नारायणायेति विपर्ययमथापि वा ।
    करन्यासं ततः कुर्याद्द्वादशाक्षरविद्यया ॥ ७॥ प्रणवादियकारान्तमङ्गुल्यङ्गुष्ठपर्वसु । न्यसेद्धृदय ॐकारं
    विकारमनुमूर्धनि ॥ ८॥ षकारं तु भ्रुवोर्मध्ये णकारं शिखया न्यसेत् । वेकारं नेत्रयोर्युंज्यान्नकारं सर्वसन्धिषु
    ॥ ९॥ मकारमस्त्रुमुद्दिश्य मन्त्रमूर्तिर्भवेद्बुधः । सर्विसर्गं फडन्तं तत्सर्वदिक्षु विनिर्दिशेत् ॥
    १०॥ ॐ विष्णवे नमः । इत्यात्मानं परं ध्यायेद्ध्येयं षट्शक्तिभिर्युतम् । विद्यातेजस्तपोर्मूतिमिमं मन्त्रमुदाहरेत्
    ॥ ११॥ ॐ हरिर्विदध्यान्मम सर्वरक्षां न्यस्तांघ्रिपद्मः पतगेन्द्रपृष्ठे । दरारिचर्मासिगदेषुचापपाशान्दधानोऽष्टगुणोऽष्टबाहुः
    ॥ १२॥ जलेषु मां रक्षतु मत्स्यमूर्तिर्यादोगणेभ्यो वरुणस्य पाशात् । स्थलेषु मायाबटुवामनोऽव्यात् त्रिविक्रमः
    खेऽवतु विश्वरूपः ॥ १३॥ दुर्गेष्वटव्याजिमुखादिषु प्रभुः पायान्नृसिंहोऽसुरयूथपारिः । विमुञ्चतो यस्य
    महाट्टहासं दिशो विनेदुर्न्यपतंश्च गर्भाः ॥ १४॥ रक्षत्वसौ माऽध्वनि यज्ञकल्पः स्वदंष्ट्रयोन्नीतधरो वराहः
    । रामोऽद्रिकूटेष्वथ विप्रवासे सलक्ष्मणोऽव्याद्भरताग्रजो माम् ॥ १५॥ मामुग्रधर्मादखिलात्प्रमादान्नारायणः
    पातु नरश्च हासात् । दत्तस्त्वयोगादथ योगनाथः पायाद्गुणेशः कपिलः कर्मबन्धात् ॥ १६॥ सनत्कुमारोऽवतु कामदेवाद्धयग्रीवो
    मां पथि देवहेलनात् । देवर्षिवर्यः पुरुषार्चनान्तरात्कूर्मो हरिर्मां निरयादशेषात् ॥ १७॥ धन्वन्तरिर्भगवान्पात्वपथ्याद्वन्द्वाद्भयादृषभो
    निर्जितात्मा । यज्ञश्च लोकादवताज्जनान्ताद्बलो गणात्क्रोधवशादहीन्द्रः ॥ १८॥ द्वैपायनो भगवानप्रबोधाद्बुद्धस्तु
    पाषण्डगणात्प्रमादात् । काल्किः कलेः कालमलात्प्रपातु धर्मावनायोरुकृतावतारः ॥ १९॥ मां केशवो गदया प्रातरव्याद्गोविन्द
    आसङ्गव आत्तवेणुः । नारायणः प्राह्ण उदात्तशक्तिर्मध्यन्दिने विष्णुररीन्द्रपाणिः ॥ २०॥ देवोऽपराह्ने
    मधुहोग्रधन्वा सायन्त्रिधामाऽवतु माधवो माम् । दोषे हृषीकेश उतार्धरात्रे निशीथ एकोऽवतु पद्मनाभः ॥ २१॥
    श्रीवत्सधामाऽपररात्र ईशः प्रत्यूष ईशोऽसिधरो जनार्दनः । दामोदरोऽव्यादनुसन्ध्यं प्रभाते विश्वेश्वरो
    भगवान्कालमूर्तिः ॥ २२॥ चक्रं युगान्तानलतिग्मनेमि भ्रमत्समन्ताद्भगवत्प्रयुक्तम् । दन्दग्धि दन्दग्ध्यरिसैन्यमाशु
    कक्षं यथा वातसखो हुताशः ॥ २३॥ गदेऽशनिस्पर्शनविस्फुलिङ्गे निष्पिण्ढि निष्पिण्ढ्यजितप्रियासि । कूष्माण्डवैनायकयक्षरक्षोभूतग्रहांश्चूर्णय
    चूर्णयारीन् ॥ २४॥ त्वं यातुधानप्रमथप्रेतमातृपिशाचविप्रग्रहघोरदृष्टीन् । नरेन्द्र विद्रावय कृष्णपूरितो
    भीमस्वनोऽरेर्हृदयानि कम्पयन् ॥ २५॥ त्वं तिग्मधारासिवरारिसैन्यमीशप्रयुक्तो मम छिन्धि छिन्धि । चक्षूंषि
    चर्मन् शतचन्द्र छादय द्विषामघानां हर पापचक्षुषाम् ॥ २६॥ यन्नो भयं ग्रहेभ्योऽभूत्केतुभ्यो नृभ्य एव
    च । सरीसृपेभ्यो दंष्ट्रिभ्य भूतेभ्योऽघेभ्य एव च ॥ २७॥ सर्वाण्येतानि भगवन्नामरूपास्रकीर्तनात् । प्रयांतु
    संक्षयं सद्यो येऽन्ये श्रेयःप्रतीपकाः ॥ २८॥ गरुडो भगवांस्तोत्रस्तोमश्छन्दोमयः प्रभुः । रक्षत्वशेषकृच्छ्रेभ्यो
    विष्वक्सेनः स्वनामभिः ॥ २९॥ सर्वापद्भ्यो हरेर्नामरूपयानायुधानि नः । बुद्धीन्द्रियमनःप्राणान् पान्तु
    पार्षदभूषणाः ॥ ३०॥ यथा हि भगवानेव वस्तुतः सदसच्च यत् । सत्येनानेन नः सर्वे यान्तु नाशमुपद्रवाः ॥ ३१॥
    यथैकात्म्यानुभावानां विकल्परहितः स्वयम् । भूषणायुधलिङ्गाख्या धत्ते शक्तीः स्वमायया ॥ ३२॥ तेनैव सत्यमानेन
    सर्वज्ञो भगवान् हरिः । पातु सर्वैः स्वरूपैर्नः सदा सर्वत्र सर्वगः ॥ ३३॥ विदिक्षु दिक्षूर्घ्वमधः समन्तादन्तर्बहिर्भगवान्नारसिंहः
    । प्रहापयँल्लोकभयं स्वनेन स्वतेजसा ग्रस्तसमस्ततेजाः ॥ ३४॥ मघवन्निदमाख्यातं वर्म नारायणात्मकम् । विजेष्यस्यञ्जसा
    येन दंशितोऽसुरयूथपान् ॥ ३५॥ एतद्धारयमाणस्तु यं यं पश्यति चक्षुषा । पदा वा संस्पृशेत्सद्यः साध्वसात्स
    विमुच्यते ॥ ३६॥ न कुतश्चिद्भयं तस्य विद्यां धारयतो भवेत् । राजदस्युग्रहादिभ्यो व्याध्यादिभ्यश्च कर्हिचित्
    ॥ ३७॥ इमां विद्यां पुरा कश्चित्कौशिको धारयन् द्विजः । योगधारणया स्वाङ्गं जहौ स मरुधन्वनि ॥ ३८॥ तस्योपरि
    विमानेन गन्धर्वपतिरेकदा । ययौ चित्ररथः स्त्रीभिर्वृतो यत्र द्विजक्षयः ॥ ३९॥ गगनान्न्यपतत्सद्यः सविमानो
    ह्यवाक्शिराः । स वालखिल्यवचनादस्थीन्यादाय विस्मितः ॥ ४०॥ प्रास्य प्राचीसरस्वत्यां स्नात्वा धाम स्वमन्वगात्
    । य इदं श
