id: bagalamukhivarnakavac
category: kavacha
name:
  english: bagalamukhivarnakavac
  devanagari: बगलामुखीवर्णकवच्
content:
  english: bagalaprasadasiddhyarthe jape viniyogah | atha dhyanam | jihvagramadaya karena devim vamena
    shatrun paripidayantim | gadabhi ghatena ca dakshinena pitambaradhyam dvibhujam namami || om pranavo
    me shirah patu lalate hlim sada'vatu | bakaro bhruyugam patu gakarah patu locane || 1|| lakarah patu
    me jihvam mukaram patu me shrutim | khikaram patu me talu sakaram cibukam tatha || 2|| vakarah patu
    me kantham skandhau patu dakarakah | bahu shtakarakah patu karau patu nakarakah || 3|| stanau vakarakah
    patu cakaro hridayam mama | makarah patu me nabhau khakaro jatharam mama || 4|| kukshim pakarakah
    patu dakarah patu me katim | stakaro jaghanam patu bhakarah patu me gudam || 5|| guhyam yakarakah
    patu jakaro'vatu januni | uru hvakarakah patu gulphau patu kakarakah || 6|| padau lakarakah patu yakaro
    schiti sarvada | bukarah patu romani dhikararastu tvacam tatha || 7|| vikarah patu sarvange nakarah
    patu sarvada | pracyam shakarakah patu dakshinasham yakarakah || 8|| varunim hlim sada patu kauberyam
    pranavena tu | bhumau svakarakah patu hakarordhvam sada'vatu || 9|| brahmastradevata patu sarvange
    sarvasandhishu | itite kathitam devi divyamanghapanjaram || 10|| ayurarogya siddhyartham mahadaishvaryadayakam
    | likhitva tadapatre tu kanthe bahau ca dharayet || 11|| devasurapishacebhyo bhayam tasya nahi kvacit
    | karmanena sanddarsho trishulokeshu siddhyate || 12|| mahabhaye raje tu shatavaram pathedyaham |
    grihe rane vivade ca sarvapatti vimucyate || 13|| etatkavacamajnatva yo brahmastramupasate | na tasya
    sidhyate mantrah kalpakotishatairapi || 14|| || iti shri ishvaraparvatisamvade bagalavarnakavacam
    sampurnam ||
  devanagari: बगलाप्रसादसिद्ध्यर्थे जपे विनियोगः । अथ ध्यानम् । जिह्वाग्रमादाय करेण देवीं वामेन शत्रून्
    परिपीडयन्तीम् । गदाभि घातेन च दक्षिणेन पीताम्बराढ्यां द्विभुजां नमामि ॥ ॐ प्रणवो मे शिरः पातु ललाटे
    ह्लीं सदाऽवतु । बकारो भ्रूयुगं पातु गकारः पातु लोचने ॥ १॥ लकारः पातु मे जिह्वां मुकारं पातु मे श्रुतिम्
    । खीकारं पातु मे तालु सकारं चिबुकं तथा ॥ २॥ वकारः पातु मे कण्ठं स्कन्धौ पातु दकारकः । बाहू ष्टकारकः
    पातु करौ पातु नकारकः ॥ ३॥ स्तनौ वकारकः पातु चकारो हृदयं मम । मकारः पातु मे नाभौ खकारो जठरं मम ॥ ४॥
    कुक्षिं पकारकः पातु दकारः पातु मे कटिम् । स्तकारो जघनं पातु भकारः पातु मे गुदम् ॥ ५॥ गुह्यं यकारकः
    पातु जकारोऽवतु जानुनी । उरू ह्वकारकः पातु गुल्फौ पातु ककारकः ॥ ६॥ पादौ लकारकः पातु यकारो स्छिति सर्वदा
    । बुकारः पातु रोमाणि धिकाररस्तु त्वचं तथा ॥ ७॥ विकारः पातु सर्वाङ्गे नकारः पातु सर्वदा । प्राच्यां
    शकारकः पातु दक्षिणाशां यकारकः ॥ ८॥ वारुणीं ह्लीं सदा पातु कौबेर्यां प्रणवेन तु । भूमौ स्वकारकः पातु
    हकारोर्ध्वं सदाऽवतु ॥ ९॥ ब्रह्मास्त्रदेवता पातु सर्वाङ्गे सर्वसन्धिषु । इतिते कथितं देवि दिव्यमङ्घपञ्जरम्
    ॥ १०॥ आयुरारोग्य सिद्ध्यर्थं महदैश्वर्यदायकम् । लिखित्वा ताडपत्रे तु कण्ठे बाहौ च धारयेत् ॥ ११॥ देवासुरपिशाचेभ्यो
    भयं तस्य नहि क्वचित् । कर्मणेन सन्द्दर्शो त्रिषुलोकेशु सिद्ध्यते ॥ १२॥ महाभये राजे तु शतवारं पठेद्यहम्
    । गृहे रणे विवादे च सर्वापत्ति विमुच्यते ॥ १३॥ एतत्कवचमज्ञात्वा यो ब्रह्मास्त्रमुपासते । न तस्य सिध्यते
    मन्त्रः कल्पकोटिशतैरपि ॥ १४॥ ॥ इति श्री ईश्वरपार्वतिसंवादे बगलावर्णकवचं सम्पूर्णम् ॥
