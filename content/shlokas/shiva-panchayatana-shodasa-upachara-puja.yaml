    om shri bhavanishankara svamine namah || atharvavedapriyah || atharvavedamavadharaya || harih om ||
    shanno devirabhishtaya apo bhavantu pitaye yo~rabhisravantu nah || harih om || om shri bhavanishankara
    svamine namah || upanishadpriyah || upanishadavadharaya || harih om || ahamanna mahamannam | ahamannado
    'hamannadah | ahagg shlokakridahagg shlokakridahagg shlokakrit | ahamasmi prathamaja rita ndevebhyo
    amritasya na bhayi | yo ma dadati sa ideva ma mabhyabhavam | suvarna jyotih ve~da | ityupanishat ||
    avahitabhya ssarvabhyo devatabhyo namah | padaravindayoh divya suvarna mantra pushpanjalim samarpayami
    | pradakshinam ishana ssarvavidyanamishvara ssarvabhutanam brahmadhipatirbrahmano 'dhipatirbrahma
    shivo me astu sadashivom || pade pade sarvatamo nikrintanam pade pade sarva shubhapradayakam | pradakshina
    mbhaktiyutena cetasa karomi mrityunjaya raksha raksha mam || om shri umamaheshvara svamine namah atmapradakshina
    namaskaran samarpayami | prarthana namo hiranyabahave hiranyavarnaya hiranyarupaya hiranyapataye 'mbikapataya
