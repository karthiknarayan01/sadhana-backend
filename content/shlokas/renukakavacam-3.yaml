id: renukakavacam-3
category: kavacha
name:
  english: renukakavacam 3
  devanagari: रेणुकाकवचम् ३
content:
  english: vibhutayah | evam devaganah sarve sarvaishvaryamavapnuyuh || shishyaya gurubhaktaya sadhakaya
    prakashayet | yo dadatyanyashishyaya shathaya pashurupine || pancatvam jayate tasya hyathava vatulo
    bhavet | kavacasyasya subhage yogi rudra rishih svayam || virat chando nigaditam devata renuka para
    | dharmarthakamamoksheshu viniyoga udahritah || klim klim klim me shirah patu bhalam netrayugam tatha
    | renuka netrayugalam klim klim nasaputadvayam || ramamata ca me patu sajihvam mukhameva ca | bhujayugmam
    tatha patu klim klim me tryaksharatmika || kantham ca cibukam caiva rakshenme jagadambika | svaha'vatu
    brahmarandhram mahapuranivasini || klim klim me renuka pashcat rakshenme padameva ca | klim klim me
    hridayam patu klim klim me parshvameva ca || klim klim me nabhikamalam klim klim me prishthameva ca
    | klim klim me dviphadante ca svaheti parikirtita || ekakshari mahavidya sarvangam me sada'vatu |
    pracyam rakshatu mam devi agneyam matrika tatha || renuka dakshine rakshedramamata ca nairritye |
    virodhini praticyam me vayavyam jagadmbika || ugra rakshedudicyam ca ishanyam mam prabhavati | dipta
    rakshettvadhobhage nila caivordhvadeshike || putramitrakalatradin devi rakshatu sarvada | iti te kathitam
    devi sarvamanmaughavigraham || trailokyamohanam nama kavacam brahmarupini | brahmesha
  devanagari: विभूतयः । एवं देवगणाः सर्वे सर्वैश्वर्यमवाप्नुयुः ॥ शिष्याय गुरुभक्ताय साधकाय प्रकाशयेत्
    । यो ददात्यन्यशिष्याय शठाय पशुरूपिणे ॥ पञ्चत्वं जायते तस्य ह्यथवा वातुलो भवेत् । कवचस्यास्य सुभगे
    योगी रुद्र ऋषिः स्वयम् ॥ विराट् छन्दो निगदितं देवता रेणुका परा । धर्मार्थकाममोक्षेषु विनियोग उदाहृतः
    ॥ क्लीं क्लीं क्लीं मे शिरः पातु भालं नेत्रयुगं तथा । रेणुका नेत्रयुगलं क्लीं क्लीं नासापुटद्वयम्
    ॥ राममाता च मे पातु सजिह्वां मुखमेव च । भुजयुग्मं तथा पातु क्लीं क्लीं मे त्र्यक्षरात्मिका ॥ कण्ठं
    च चिबुकं चैव रक्षेन्मे जगदम्बिका । स्वाहाऽवतु ब्रह्मरन्ध्रं महापुरनिवासिनी ॥ क्लीं क्लीं मे रेणुका
    पश्चात् रक्षेन्मे पादमेव च । क्लीं क्लीं मे हृदयं पातु क्लीं क्लीं मे पार्श्वमेव च ॥ क्लीं क्लीं मे
    नाभिकमलं क्लीं क्लीं मे पृष्ठमेव च । क्लीं क्लीं मे द्विफडन्ते च स्वाहेति परिकीर्तिता ॥ एकाक्षरी महाविद्या
    सर्वाङ्गं मे सदाऽवतु । प्राच्यां रक्षतु मां देवि आग्नेयां मातृका तथा ॥ रेणुका दक्षिणे रक्षेद्राममाता
    च नैरृत्ये । विरोधिनी प्रतीच्यां मे वायव्यां जगद्म्बिका ॥ उग्रा रक्षेदुदीच्यां च ईशान्यां मां प्रभावती
    । दीप्ता रक्षेत्त्वधोभागे नीला चैवोर्ध्वदेशिके ॥ पुत्रमित्रकलत्रादीन् देवी रक्षतु सर्वदा । इति ते
    कथितं देवि सर्वमन्मौघविग्रहम् ॥ त्रैलोक्यमोहनं नाम कवचं ब्रह्मरूपिणी । ब्रह्मेश
