id: shukra-kavacham
category: stotram
name:
  english: Shukra Kavacham
content:
  english: dhyanam mrinalakundendupayojasuprabham pitambaram prasritamakshamalinam | samastashastrarthavidhim
    mahantam dhyayetkavim vanchitamarthasiddhaye || || atha shukrakavacam shiro me bhargavah patu bhalam
    patu grahadhipah | netre daityaguruh patu shrotre me candanadyutih || || patu me nasikam kavyo vadanam
    daityavanditah | vacanam coshanah patu kantham shrikanthabhaktiman || || bhujau tejonidhih patu kukshim
    patu manovrajah | nabhim bhrigusutah patu madhyam patu mahipriyah || || katim me patu vishvatma uru
    me surapujitah | janum jadyaharah patu janghe jnanavatam varah || || gulphau gunanidhih patu patu
    padau varambarah | sarvanyangani me patu svarnamalaparishkritah || || phalashrutih ya idam kavacam
    divyam pathati shraddhayanvitah | na tasya jayate pida bhargavasya prasadatah || || || iti shribrahmandapurane
    shukrakavacam sampurnam ||
  devanagari: ध्यानम् मृणालकुन्देन्दुपयोजसुप्रभं पीताम्बरं प्रसृतमक्षमालिनम् । समस्तशास्त्रार्थविधिं महान्तं
    ध्यायेत्कविं वाञ्छितमर्थसिद्धये ॥ ॥ अथ शुक्रकवचम् शिरो मे भार्गवः पातु भालं पातु ग्रहाधिपः । नेत्रे
    दैत्यगुरुः पातु श्रोत्रे मे चन्दनद्युतिः ॥ ॥ पातु मे नासिकां काव्यो वदनं दैत्यवन्दितः । वचनं चोशनाः
    पातु कण्ठं श्रीकण्ठभक्तिमान् ॥ ॥ भुजौ तेजोनिधिः पातु कुक्षिं पातु मनोव्रजः । नाभिं भृगुसुतः पातु मध्यं
    पातु महीप्रियः ॥ ॥ कटिं मे पातु विश्वात्मा उरू मे सुरपूजितः । जानुं जाड्यहरः पातु जङ्घे ज्ञानवतां
    वरः ॥ ॥ गुल्फौ गुणनिधिः पातु पातु पादौ वराम्बरः । सर्वाण्यङ्गानि मे पातु स्वर्णमालापरिष्कृतः ॥ ॥ फलश्रुतिः
    य इदं कवचं दिव्यं पठति श्रद्धयान्वितः । न तस्य जायते पीडा भार्गवस्य प्रसादतः ॥ ॥ ॥ इति श्रीब्रह्माण्डपुराणे
    शुक्रकवचं सम्पूर्णम् ॥
