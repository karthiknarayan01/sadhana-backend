id: ashvatthastotram-2
category: stotram
name:
  english: ashvatthastotram
  devanagari: अश्वत्थस्तोत्रम्
content:
  english: '|| ashvatthastotram || shri narada uvaca anayasena loko''yam sarvan kamanavapnuyat | sarvadevatmakam
    caikam tanme bruhi pitamaha || brahmovaca shrunu deva mune''shvattham shuddham sarvatmakam tarum |
    yatpradakshinato lokah sarvan kaman samashnute || ashvatthaddakshine rudrah pashcime vishnurasthitah
    | brahma cottaradeshasthah purvetvindradidevatah || skandhopaskandhapatreshu govipramunayastatha |
    mulam vedah payo yajnah samsthita munipungava || purvadidikshu samyata nadinadasaro''bdhayah | tasmat
    sarvaprayatnena hyashvattham samshrayedbudhah || tvam kshiryaphalakashcaiva shitalasya vanaspate |
    tvamaradhya naro vindyadaihikamushmikam phalam || caladdalaya vrikshaya sarvadashritavishnave | bodhisatvaya
    devaya hyashvatthaya namo namah || ashvattha yasmat tvayi vriksharaja narayanastishthati sarvakale
    | athah shrutastvam satatam tarunam dhanyo''si carishtavinashako''si || kshiradastvam ca yeneha yena
    shristvam nishevate | satyena tena vrikshendra mamapi shrirnishevatam || ekadashatmarudro''si vasunathashiromanih
    | narayano''si devanam vriksharajo''si pippala || agnigarbhah shamigarbho devagarbhah prajapatih |
    hiranyagarbho bhugarbho yajnagarbho namo''stu te || ayurbalam yasho varcah prajah pashuvasuni ca |
    brahma prajnam ca medham ca tvam no dehi vanaspate || satatam varuno rakshet tvamaraddrishtirashrayet
    | paritastvam nishevantam trinani sukhamastu te || akshispandam bhujaspandam duhsvapnam durvicintanam
    | shatrunam ca samutthanam hyashvattha shamaya prabho || ashvatthaya varenyaya sarvaishvarya pradayine
    | namo duhsvapnanashaya susvapnaphaladayine || mulato brahmarupaya madhyato vishnu rupine | agratah
    shivarupaya vriksharajaya te namah || yam drishtva mucyate rogaih sprishtva papaih pramucyate | yadashrayacciranjivi
    tamashvattham namamyaham || ashvattha sumahabhaga subhaga priyadarshana | ishtakamamshca me dehi shatrubhyastu
    parabhavam || ayuh prajam dhanam dhanyam saubhagyam sarvasampadam | dehi deva mahavriksha tvamaham
    sharanam gatah || rigyajuhsamamantratma sarvarupi paratparah | ashvattho vedamulo''savrishibhih procyate
    sada || brahmaha guruha caiva daridro vyadhipiditah | avritya lakshasamkhyam tat stotrametat sukhi
    bhavet || brahmacari havishyashi tvadahshayi jitendriyah | papopahatacitto''pi vratametat samacaret
    || ekahastam dvihastam va kuryadgomayalepanam | arcet purushasuktena pranavena visheshatah || mauni
    pradakshinam kuryat praguktaphalabhagbhavet | vishnornamasahasrena hyacyutasyapi kirtanat || pade
    padantaram gatva karaceshtavivarjitah | vaca stotram mano dhyane caturangam pradakshinam || ashvatthah
    sthapito yena tatkulam sthapitam tatah | dhanayusham samriddhistu narakat tarayet pitrin || ashvatthamulamashritya
    shakannodakadanatah | ekasmin bhojite vipre kotibrahmanabhojanam || ashvatthamulamashritya japahomasurarcanat
    | akshayam phalamapnoti brahmano vacanam yatha || evamashvasito''shvatthah sadashvasaya kalpate |
    yajnartham chedite''shvatthe hyakshayam svargamapnuyat || chinno yena vritha''shvatthashchedita pitridevatah
    | ashvatthah pujito yatra pujitah sarvadevatah || || iti ashvattha stotram sampurnam ||'
  devanagari: ॥ अश्वत्थस्तोत्रम् ॥ श्री नारद उवाच अनायासेन लोकोऽयम् सर्वान् कामानवाप्नुयात् । सर्वदेवात्मकं
    चैकं तन्मे ब्रूहि पितामह ॥ ब्रह्मोवाच श्रुणु देव मुनेऽश्वत्थं शुद्धं सर्वात्मकं तरुम् । यत्प्रदक्षिणतो
    लोकः सर्वान् कामान् समश्नुते ॥ अश्वत्थाद्दक्षिणे रुद्रः पश्चिमे विष्णुरास्थितः । ब्रह्मा चोत्तरदेशस्थः
    पूर्वेत्विन्द्रादिदेवताः ॥ स्कन्धोपस्कन्धपत्रेषु गोविप्रमुनयस्तथा । मूलं वेदाः पयो यज्ञाः संस्थिता
    मुनिपुङ्गव ॥ पूर्वादिदिक्षु संयाता नदीनदसरोऽब्धयः । तस्मात् सर्वप्रयत्नेन ह्यश्वत्थं संश्रयेद्बुधः
    ॥ त्वं क्षीर्यफलकश्चैव शीतलस्य वनस्पते । त्वामाराध्य नरो विन्द्यादैहिकामुष्मिकं फलम् ॥ चलद्दलाय वृक्षाय
    सर्वदाश्रितविष्णवे । बोधिसत्वाय देवाय ह्यश्वत्थाय नमो नमः ॥ अश्वत्थ यस्मात् त्वयि वृक्षराज नारायणस्तिष्ठति
    सर्वकाले । अथः श्रुतस्त्वं सततं तरूणां धन्योऽसि चारिष्टविनाशकोऽसि ॥ क्षीरदस्त्वं च येनेह येन श्रीस्त्वां
    निषेवते । सत्येन तेन वृक्षेन्द्र मामपि श्रीर्निषेवताम् ॥ एकादशात्मरुद्रोऽसि वसुनाथशिरोमणिः । नारायणोऽसि
    देवानां वृक्षराजोऽसि पिप्पल ॥ अग्निगर्भः शमीगर्भो देवगर्भः प्रजापतिः । हिरण्यगर्भो भूगर्भो यज्ञगर्भो
    नमोऽस्तु ते ॥ आयुर्बलं यशो वर्चः प्रजाः पशुवसूनि च । ब्रह्म प्रज्ञां च मेधां च त्वं नो देहि वनस्पते
    ॥ सततं वरुणो रक्षेत् त्वामाराद्दृष्टिराश्रयेत् । परितस्त्वां निषेवन्तां तृणानि सुखमस्तु ते ॥ अक्षिस्पन्दं
    भुजस्पन्दं दुःस्वप्नं दुर्विचिन्तनम् । शत्रूणां च समुत्थानं ह्यश्वत्थ शमय प्रभो ॥ अश्वत्थाय वरेण्याय
    सर्वैश्वर्य प्रदायिने । नमो दुःस्वप्ननाशाय सुस्वप्नफलदायिने ॥ मूलतो ब्रह्मरूपाय मध्यतो विष्णु रूपिणे
    । अग्रतः शिवरूपाय वृक्षराजाय ते नमः ॥ यं दृष्ट्वा मुच्यते रोगैः स्पृष्ट्वा पापैः प्रमुच्यते । यदाश्रयाच्चिरञ्जीवी
    तमश्वत्थं नमाम्यहम् ॥ अश्वत्थ सुमहाभाग सुभग प्रियदर्शन । इष्टकामांश्च मे देहि शत्रुभ्यस्तु पराभवम्
    ॥ आयुः प्रजां धनं धान्यं सौभाग्यं सर्वसम्पदम् । देहि देव महावृक्ष त्वामहं शरणं गतः ॥ ऋग्यजुःसाममन्त्रात्मा
    सर्वरूपी परात्परः । अश्वत्थो वेदमूलोऽसावृषिभिः प्रोच्यते सदा ॥ ब्रह्महा गुरुहा चैव दरिद्रो व्याधिपीडितः
    । आवृत्य लक्षसंख्यं तत् स्तोत्रमेतत् सुखी भवेत् ॥ ब्रह्मचारी हविष्याशी त्वदःशायी जितेन्द्रियः । पपोपहतचित्तोऽपि
    व्रतमेतत् समाचरेत् ॥ एकाहस्तं द्विहस्तं वा कुर्याद्गोमयलेपनम् । अर्चेत् पुरुषसूक्तेन प्रणवेन विशेषतः
    ॥ मौनी प्रदक्षिणं कुर्यात् प्रागुक्तफलभाग्भवेत् । विष्णोर्नामसहस्रेण ह्यच्युतस्यापि कीर्तनात् ॥ पदे
    पदान्तरं गत्वा करचेष्टाविवर्जितः । वाचा स्तोत्रं मनो ध्याने चतुरङ्गं प्रदक्षिणम् ॥ अश्वत्थः स्थापितो
    येन तत्कुलं स्थापितं ततः । धनायुषां समृद्धिस्तु नरकात् तारयेत् पितृन् ॥ अश्वत्थमूलमाश्रित्य शाकान्नोदकदानतः
    । एकस्मिन् भोजिते विप्रे कोटिब्राह्मणभोजनम् ॥ अश्वत्थमूलमाश्रित्य जपहोमसुरार्चनात् । अक्षयं फलमाप्नोति
    ब्रह्मणो वचनं यथा ॥ एवमाश्वासितोऽश्वत्थः सदाश्वासाय कल्पते । यज्ञार्थं छेदितेऽश्वत्थे ह्यक्षयं स्वर्गमाप्नुयात्
    ॥ छिन्नो येन वृथाऽश्वत्थश्छेदिता पितृदेवताः । अश्वत्थः पूजितो यत्र पूजिताः सर्वदेवताः ॥ ॥ इति अश्वत्थ
    स्तोत्रं सम्पूर्णम् ॥
