id: hariharastotram
category: shataka
name:
  english: hariharastotram
  devanagari: हरिहरस्तोत्रम्
content:
  english: hariharastotram shriganeshaya namah || dharmarthakamamokshakhyacaturvargapradayinau | vande
    hariharau devau trailokyaparipayinau || 1|| ekamurti dvidha bhinnau samsararnavatarakau | vande'ham
    kamadau devau satatam shivakeshavau || 2|| dayamayau dinadaridratapahau mahaujasau manyatamau sada
    samau | udaralilalalitau sitasitau namami nityam shivakeshavavaham || 3|| anantamahatmyanidhi vidhistutau
    shriya yutau lokavidhanakarinau | surasuradhishanutau nutau jagatpati sada vidhattam shivakeshavau
    shivam || 4|| jagattrayipalananashakarakau prasannahasau vilasatsadananau | mahabalau manjulamurtidharinau
    shivam vidhattam shivakeshavau sada || 5|| mahasvinau modakarau parau varau munishvaraih sevitapadapankajau
    | ajau sujatau jagadishvarau sada shivam vidhattam shivakeshavau mama || 6|| namo'stu nityam shivikeshavabhyam
    svabhaktasamrakshanatatparabhyam | deveshvarabhyam karunakarabhyam lokatrayinirmitikaranabhyam ||
    7|| salilashilau mahaniyamurti dayakarau manjulasaccaritrau | mahodayau vishvavinodahetu namami devau
    shivakeshavau tau || 8|| trishulapanim varacakrapanim pitambaram spashtadigambaram ca | caturbhujam
    va dashabahuyuktam harim haram va pranamami nityam || 9|| kapalamalalalitam shivam ca sadvaijayantisragudarashobham
    | vishnum ca nityam pranipatya yace bhavatpadambhoruhayoh smritih stat || 10|| shiva tvameva'si harisvarupo
    hare tvameva'si shivasvarupah | bhrantya janastvam dvividhasvarupam pashyanti mudha nanu nashahetoh
    || 11|| hare jana ye shivarupinam tvam tvadrupamisham kalayanti nityam | te bhagyavantah purushah
    kada'pi na yanti bhasvattanayasya geham || 12|| shambho jana ye harirupinam tvam bhavatsvarupam kamalalayesham
    | pashyanti bhaktya khalu te mahantau yamasya no yanti puram kadacit || 13|| shive harau bhedadhiya''dhiyukta
    muktim labhante na jana durapam | bhuktim ca naiveha parantu duhkham samsarakupe patitah prayanti
    || 14|| hare harau bhedadrisho bhrisham vai samsarasindhau patitah satapah | papashaya mohamayandhakare
    bhranta mahaduhkhabharam labhante || 15|| santo lasantah sutaram harau ca hare ca nityam vahubhaktimantah
    | antarmahantau shivakeshavau tau dhyayanta uccairmudamapnuvanti || 16|| harau hare caikyamudarashilah
    pashyanti shashvatsukhadayililah | te bhuktimukti samavapya nunam sukham durapam sutaram labhante
    || 17|| shive shiveshe'pi ca keshave ca padmapatau devavare mahantah | bhedam na pashyanti parantu
    santastayorabhedam kalayanti satyam || 18|| ramapatim va girijapatim va vishveshvaram va jagadishvaram
    va | pinakapanim khalu sharngapanim hari haram va pranamami nityam || 19|| sureshvaram va parameshvaram
    va vaikunthalokasthitamacyutam va | kailasashailasthitamishvaram va vishnum ca shambhum ca namami
    nityam || 20|| harirdayardrashayatam prayato haro dayaluttamabhavamaptah | anekadivyastradharah pareshah
    payadajasram kripaya natam mam || 21|| shesho'sti yasyabharanatvamapto yadva sushayyatvamitah sadaiva
    | devah sa ko'piha harirharo va karotu me manjulamangalam drak || 22|| harim haram capi bhajanti bhaktya
    vibhedabuddhim pravihaya nunam | siddha mahanto munayo mahecchah svacchashaya naradaparvatadyah ||
    23|| sanatkumaradaya unnateccha mohena hina munayo mahantah | svantahsthitam shankaramacyutam ca bhedam
    parityajya sada bhajante || 24|| shishta vasishthadaya atmanishthah shreshthah svadharmavanakarmacittah
    | hrittapaharam malahinacitta harim haram caikataya bhajante || 25|| anye mahatmana udarashila bhrigvadayo
    ye paramarshayaste | pashyanti caikyam harisharvayoh shrisamyuktayoratra na samshayo'sti || 26|| indradayo
    devavara udara trailokyasamrakshanadattacittah | harim haram caikasvarupameva pashyanti bhaktya ca
    bhajanti nunam || 27|| sarveshu vedeshu khalu prasiddhavaikunthakailasagayoh sudhamnoh | mukundabalenduvatamsayoh
    saccaritrayorishvarayorabhedah || 28|| sarvani shastrani vadanti nunam harerharasyaikyamudaramurteh
    | nastyatra sandehalavo'pi satyam nityam jana dharmadhana gadanti || 29|| sarvaih puranairidameva
    suktam yadvishnushambhormahaniyamurtyoh | aikyam sadaiva'sti na bhedalesho'pyastiha cintyam sujanaistadevam
    || 30|| bhedam prapashyanti naradhama ye vishnau ca shambhau ca dayanidhane | te yanti papah paritapayukta
    ghoram vishalam nirayasya vasam || 31|| bhutadhipam va vibudhadhipam va rameshvaram va parameshvaram
    va | pitambaram va haridambaram va harim haram va purusha bhajadhvam || 32|| mahasvivaryam kamaniyadehamudarasaram
    sukhadayiceshtam | sarveshtadevam duritapaharam vishnum shivam va satatam bhajadhvam || 33|| shivasya
    vishnoshca vibhatyabhedo vyasadayo'piha maharshayaste | sarvajnabhavam dadhato nitantam vadanti caivam
    kalayanti santah || 34|| mahashaya dharmavidhanadaksha rakshapara nirjitamanasa ye | te'piha vijnah
    samadarshino vai shivasya vishnoh kalayantyabhedam || 35|| harireva haro hara eva harirna hi bhedalavo'pi
    tayoh prathitah | iti siddhamunishayatishavara nigadanti sada vimadah sujanah || 36|| hara eva harirharireva
    haro harina ca harena ca vishvamidam | pravinirmitametadavehi sada vimado bhava tau bhaja bhavayutah
    || 37|| harireva babhuva harah paramo hara eva babhuva harih paramah | harita harata ca tatha milita
    racayatyakhilam khalu vishvamidam || 38|| vrishadhvajam va garudadhvajam va girishvaram va bhuvaneshvaram
    va | patim pashunamathava yadunam krishnam shivam va vibudha bhajante || 39|| bhimakritim va rucirakritim
    va trilocanam va samalocanam va | umapatim va'tha ramapatim va harim haram va munayo bhajante || 40||
    harih svayam vai haratam prayato harastu sakshaddharibhavamaptah | harirharashcapi jagajjananamupasyadevau
    sta iti prasiddhih || 41|| harirhi sakshat hara eva siddho haro hi sakshaddhadireva caste | hirarharashca
    svayameva caiko dvirupatam karyavashat prayatah || 42|| harirjagatpalanakritprasiddho haro jagannashakarah
    paratma | svarupamatrena bhidamavaptau dvavekarupau sta imau sureshau || 43|| dayanidhanam vilasadvidhanam
    devapradhanam nanu savadhanam | sanandasanmanasabhasamanam devam shivam va bhaja keshavam va || 44||
    shrikaustubhabharanamindukalavatamsam kalivilasinamatho kamalavilasam | devam murarimatha va tripurarimisham
    bhedam vihaya bhaja bho bhaja bhuri bhaktya || 45|| vishnuh sakshacchambhureva prasiddhah shambhuh
    sakshadvishnurevasti nunam | nasti svalpo'piha bhedavakashah siddhanto'yam sajjananam samuktah ||
    46|| shambhurvishnushcaikarupo dvimurtih satyam satyam gadyate nishcitam sat | asminmithya samshayam
    kurvate ye papacaraste nara rakshasakhyah || 47|| vishnau shambhau nasti bhedavabhasah sankhyavantah
    santa evam vadanti | antah kincitsamvicintya svayam drak bhedam tyaktva tau bhajasva prakamam || 48||
    vishnorbhaktah shambhuvidveshasaktah shambhorbhakta vishnuvidveshino ye | kamakrodhandhah sumandah
    saninda vindanti drak te nara duhkhajalam || 49|| vishnau shambhau bhedabuddhim vihaya bhaktya yuktah
    sajjana ye bhajante | tesham bhagyam vastumisho gururno satyam satyam vacmyamha viddhi tattvam ||
    50|| harervirodhi ca harasya bhakto harasya vairi ca hareshca bhaktah | sakshadasau rakshasa eva nunam
    nastyatra sandehalavo'pi satyam || 51|| shivam ca vishnum ca vibhinnadeham pashyanti ye mudhadhiyo'tinicah
    | te kim susadbhih sutaram mahadbhih sambhashaniyah purusha bhavanti || 52|| anekarupam viditaikarupam
    mahantamuccairatishantacittam | dantam nitantam shubhadam sukantam vishnum shivam va bhaja bhuribhaktya
    || 53|| hare murare hara he purare vishno dayalo shiva he kripalo | dinam janam sarvagunairvihinam
    mam bhaktamartam paripahi nityam || 54|| he he vishno shambhurupastvameva he he shambho vishnurupastvameva
    | satyam sarve santa evam vadantah samsarabdhim hyanjasa santaranti || 55|| vishnuh shambhuh shambhurevasti
    vishnuh shambhurvishnurvishnurevasti shambhuh | shambhau vishnau caikarupatvamishtam shishta evam
    sarvada sanjapanti || 56|| daivi sampadvidyate yasya pumsah shriman so'yam sarvada bhaktiyuktah |
    shambhum vishnum caikarupam dvideham bhedam tyaktva sambhajanmokshameti || 57|| yesham pumsamasuri
    sampadaste mrityorgrasah kamalobhabhibhutah | krodhenandha bandhayukta janaste shambhum vishnum bhedabuddhya
    bhajante || 58|| kalyanakaram sukhadaprakaram vinirvikaram vihitopakaram | svakaramisham na kritapakaram
    shivam bhajadhvam kila keshavam ca || 59|| saccitsvarupam karunasukupam girvanabhupam varadharmayupam
    | samsarasaram suruciprasaram devam harim va bhaja bho haram va || 60|| anandasindhum paradinabandhum
    mohandhakarasya nikarahetum | saddharmasetum ripudhumaketum bhajasva vishnum shivamekabuddhya || 61||
    vedantasiddhantamayam dayalum satsankhyashastrapratipadyamanam | nyayaprasiddham sutaram samiddham
    bhajasva vishnum shivamekabuddhya || 62|| papapaharam rucirapracaram kritopakaram vilasadviharam |
    saddharmadharam kamaniyadaram saram harim va bhaja bho haram va || 63|| vishnau harau bhedamavekshamanah
    prani nitantam khalu tantacetah |
  devanagari: हरिहरस्तोत्रम् श्रीगणेशाय नमः ॥ धर्मार्थकाममोक्षाख्यचतुर्वर्गप्रदायिनौ । वन्दे हरिहरौ देवौ
    त्रैलोक्यपरिपायिनौ ॥ १॥ एकमूर्ती द्विधा भिन्नौ संसारार्णवतारकौ । वन्देऽहं कामदौ देवौ सततं शिवकेशवौ
    ॥ २॥ दयामयौ दीनदरिद्रतापहौ महौजसौ मान्यतमौ सदा समौ । उदारलीलाललितौ सितासितौ नमामि नित्यं शिवकेशवावहम्
    ॥ ३॥ अनन्तमाहात्म्यनिधी विधिस्तुतौ श्रिया युतौ लोकविधानकारिणौ । सुरासुराधीशनुतौ नुतौ जगत्पती सदा विधत्तां
    शिवकेशवौ शिवम् ॥ ४॥ जगत्त्रयीपालननाशकारकौ प्रसन्नहासौ विलसत्सदाननौ । महाबलौ मञ्जुलमूर्तिधारिणौ शिवं
    विधत्तां शिवकेशवौ सदा ॥ ५॥ महस्विनौ मोदकरौ परौ वरौ मुनीश्वरैः सेवितपादपङ्कजौ । अजौ सुजातौ जगदीश्वरौ
    सदा शिवं विधत्तां शिवकेशवौ मम ॥ ६॥ नमोऽस्तु नित्यं शिविकेशवाभ्यां स्वभक्तसंरक्षणतत्पराभ्याम् । देवेश्वराभ्यां
    करुणाकराभ्यां लोकत्रयीनिर्मितिकारणाभ्याम् ॥ ७॥ सलीलशीलौ महनीयमूर्ती दयाकरौ मञ्जुलसच्चरित्रौ । महोदयौ
    विश्वविनोदहेतू नमामि देवौ शिवकेशवौ तौ ॥ ८॥ त्रिशूलपाणिं वरचक्रपाणिं पीताम्बरं स्पष्टदिगम्बरं च । चतुर्भुजं
    वा दशबाहुयुक्तं हरिं हरं वा प्रणमामि नित्यम् ॥ ९॥ कपालमालाललितं शिवं च सद्वैजयन्तीस्रगुदारशोभम् ।
    विष्णुं च नित्यं प्रणिपत्य याचे भवत्पदाम्भोरुहयोः स्मृतिः स्तात् ॥ १०॥ शिव त्वमेवाऽसि हरिस्वरूपो हरे
    त्वमेवाऽसि शिवस्वरूपः । भ्रान्त्या जनास्त्वां द्विविधस्वरूपं पश्यन्ति मूढा ननु नाशहेतोः ॥ ११॥ हरे
    जना ये शिवरूपिणं त्वां त्वद्रूपमीशं कलयन्ति नित्यम् । ते भाग्यवन्तः पुरुषाः कदाऽपि न यान्ति भास्वत्तनयस्य
    गेहम् ॥ १२॥ शम्भो जना ये हरिरूपिणं त्वां भवत्स्वरूपं कमलालयेशम् । पश्यन्ति भक्त्या खलु ते महान्तौ
    यमस्य नो यान्ति पुरं कदाचित् ॥ १३॥ शिवे हरौ भेदधियाऽऽधियुक्ता मुक्तिं लभन्ते न जना दुरापाम् । भुक्तिं
    च नैवेह परन्तु दुःखं संसारकूपे पतिताः प्रयान्ति ॥ १४॥ हरे हरौ भेददृशो भृशं वै संसारसिन्धौ पतिताः सतापाः
    । पापाशया मोहमयान्धकारे भ्रान्ता महादुःखभरं लभन्ते ॥ १५॥ सन्तो लसन्तः सुतरां हरौ च हरे च नित्यं वहुभक्तिमन्तः
    । अन्तर्महान्तौ शिवकेशवौ तौ ध्यायन्त उच्चैर्मुदमाप्नुवन्ति ॥ १६॥ हरौ हरे चैक्यमुदारशीलाः पश्यन्ति
    शश्वत्सुखदायिलीलाः । ते भुक्तिमुक्ती समवाप्य नूनं सुखं दुरापं सुतरां लभन्ते ॥ १७॥ शिवे शिवेशेऽपि च
    केशवे च पद्मापतौ देववरे महान्तः । भेदं न पश्यन्ति परन्तु सन्तस्तयोरभेदं कलयन्ति सत्यम् ॥ १८॥ रमापतिं
    वा गिरिजापतिं वा विश्वेश्वरं वा जगदीश्वरं वा । पिनाकपाणिं खलु शार्ङ्गपाणिं हरि हरं वा प्रणमामि नित्यम्
    ॥ १९॥ सुरेश्वरं वा परमेश्वरं वा वैकुण्ठलोकस्थितमच्युतं वा । कैलासशैलस्थितमीश्वरं वा विष्णुं च शम्भुं
    च नमामि नित्यम् ॥ २०॥ हरिर्दयार्द्राशयतां प्रयातो हरो दयालूत्तमभावमाप्तः । अनेकदिव्यास्त्रधरः परेशः
    पायादजस्रं कृपया नतं माम् ॥ २१॥ शेषोऽस्ति यस्याभरणत्वमाप्तो यद्वा सुशय्यात्वमितः सदैव । देवः स कोऽपीह
    हरिर्हरो वा करोतु मे मञ्जुलमङ्गलं द्राक् ॥ २२॥ हरिं हरं चापि भजन्ति भक्त्या विभेदबुद्धिं प्रविहाय
    नूनम् । सिद्धा महान्तो मुनयो महेच्छाः स्वच्छाशया नारदपर्वताद्याः ॥ २३॥ सनत्कुमारादय उन्नतेच्छा मोहेन
    हीना मुनयो महान्तः । स्वान्तःस्थितं शङ्करमच्युतं च भेदं परित्यज्य सदा भजन्ते ॥ २४॥ शिष्टा वसिष्ठादय
    आत्मनिष्ठाः श्रेष्ठाः स्वधर्मावनकर्मचित्ताः । हृत्तापहारं मलहीनचित्ता हरिं हरं चैकतया भजन्ते ॥ २५॥
    अन्ये महात्मान उदारशीला भृग्वादयो ये परमर्षयस्ते । पश्यन्ति चैक्यं हरिशर्वयोः श्रीसंयुक्तयोरत्र न
    संशयोऽस्ति ॥ २६॥ इन्द्रादयो देववरा उदारा त्रैलोक्यसंरक्षणदत्तचित्ताः । हरिं हरं चैकस्वरूपमेव पश्यन्ति
    भक्त्या च भजन्ति नूनम् ॥ २७॥ सर्वेषु वेदेषु खलु प्रसिद्धवैकुण्ठकैलासगयोः सुधाम्नोः । मुकुन्दबालेन्दुवतंसयोः
    सच्चरित्रयोरीश्वरयोरभेदः ॥ २८॥ सर्वाणि शास्त्राणि वदन्ति नूनं हरेर्हरस्यैक्यमुदारमूर्तेः । नास्त्यत्र
    सन्देहलवोऽपि सत्यं नित्यं जना धर्मधना गदन्ति ॥ २९॥ सर्वैः पुराणैरिदमेव सूक्तं यद्विष्णुशम्भोर्महनीयमूर्त्योः
    । ऐक्यं सदैवाऽस्ति न भेदलेशोऽप्यस्तीह चिन्त्यं सुजनैस्तदेवम् ॥ ३०॥ भेदं प्रपश्यन्ति नराधमा ये विष्णौ
    च शम्भौ च दयानिधाने । ते यान्ति पापाः परितापयुक्ता घोरं विशालं निरयस्य वासम् ॥ ३१॥ भूताधिपं वा विबुधाधिपं
    वा रमेश्वरं वा परमेश्वरं वा । पीताम्बरं वा हरिदम्बरं वा हरिं हरं वा पुरुषा भजध्वम् ॥ ३२॥ महस्विवर्यं
    कमनीयदेहमुदारसारं सुखदायिचेष्टम् । सर्वेष्टदेवं दुरितापहारं विष्णुं शिवं वा सततं भजध्वम् ॥ ३३॥ शिवस्य
    विष्णोश्च विभात्यभेदो व्यासादयोऽपीह महर्षयस्ते । सर्वज्ञभावं दधतो नितान्तं वदन्ति चैवं कलयन्ति सन्तः
    ॥ ३४॥ महाशया धर्मविधानदक्षा रक्षापरा निर्जितमानसा ये । तेऽपीह विज्ञाः समदर्शिनो वै शिवस्य विष्णोः
    कलयन्त्यभेदम् ॥ ३५॥ हरिरेव हरो हर एव हरिर्न हि भेदलवोऽपि तयोः प्रथितः । इति सिद्धमुनीशयतीशवरा निगदन्ति
    सदा विमदाः सुजनाः ॥ ३६॥ हर एव हरिर्हरिरेव हरो हरिणा च हरेण च विश्वमिदम् । प्रविनिर्मितमेतदवेहि सदा
    विमदो भव तौ भज भावयुतः ॥ ३७॥ हरिरेव बभूव हरः परमो हर एव बभूव हरिः परमः । हरिता हरता च तथा मिलिता रचयत्यखिलं
    खलु विश्वमिदम् ॥ ३८॥ वृषध्वजं वा गरुडध्वजं वा गिरीश्वरं वा भुवनेश्वरं वा । पतिं पशूनामथवा यदूनां कृष्णं
    शिवं वा विबुधा भजन्ते ॥ ३९॥ भीमाकृतिं वा रुचिराकृतिं वा त्रिलोचनं वा समलोचनं वा । उमापतिं वाऽथ रमापतिं
    वा हरिं हरं वा मुनयो भजन्ते ॥ ४०॥ हरिः स्वयं वै हरतां प्रयातो हरस्तु साक्षाद्धरिभावमाप्तः । हरिर्हरश्चापि
    जगज्जनानामुपास्यदेवौ स्त इति प्रसिद्धिः ॥ ४१॥ हरिर्हि साक्षत् हर एव सिद्धो हरो हि साक्षाद्धदिरेव चास्ते
    । हीरर्हरश्च स्वयमेव चैको द्विरूपतां कार्यवशात् प्रयातः ॥ ४२॥ हरिर्जगत्पालनकृत्प्रसिद्धो हरो जगन्नाशकरः
    परात्मा । स्वरूपमात्रेण भिदामवाप्तौ द्वावेकरूपौ स्त इमौ सुरेशौ ॥ ४३॥ दयनिधानं विलसद्विधानं देवप्रधानं
    ननु सावधानम् । सानन्दसन्मानसभासमानं देवं शिवं वा भज केशवं वा ॥ ४४॥ श्रीकौस्तुभाभरणमिन्दुकलावतंसं कालीविलासिनमथो
    कमलाविलासम् । देवं मुरारिमथ वा त्रिपुरारिमीशं भेदं विहाय भज भो भज भूरि भक्त्या ॥ ४५॥ विष्णुः साक्षाच्छम्भुरेव
    प्रसिद्धः शम्भुः साक्षाद्विष्णुरेवास्ति नूनम् । नास्ति स्वल्पोऽपीह भेदावकाशः सिद्धान्तोऽयं सज्जनानां
    समुक्तः ॥ ४६॥ शम्भुर्विष्णुश्चैकरूपो द्विमूर्तिः सत्यं सत्यं गद्यते निश्चितं सत् । अस्मिन्मिथ्या संशयं
    कुर्वते ये पापाचारास्ते नरा राक्षसाख्याः ॥ ४७॥ विष्णौ शम्भौ नास्ति भेदावभासः सङ्ख्यावन्तः सन्त एवं
    वदन्ति । अन्तः किञ्चित्संविचिन्त्य स्वयं द्राक् भेदं त्यक्त्वा तौ भजस्व प्रकामम् ॥ ४८॥ विष्णोर्भक्ताः
    शम्भुविद्वेषसक्ताः शम्भोर्भक्ता विष्णुविद्वेषिणो ये । कामक्रोधान्धाः सुमन्दाः सनिन्दा विन्दन्ति द्राक्
    ते नरा दुःखजालम् ॥ ४९॥ विष्णौ शम्भौ भेदबुद्धिं विहाय भक्त्या युक्ताः सज्जना ये भजन्ते । तेषां भाग्यं
    वस्तुमीशो गुरुर्नो सत्यं सत्यं वच्म्यंह विद्धि तत्त्वम् ॥ ५०॥ हरेर्विरोधी च हरस्य भक्तो हरस्य वैरी
    च हरेश्च भक्तः । साक्षादसौ राक्षस एव नूनं नास्त्यत्र सन्देहलवोऽपि सत्यम् ॥ ५१॥ शिवं च विष्णुं च विभिन्नदेहं
    पश्यन्ति ये मूढधियोऽतिनीचाः । ते किं सुसद्भिः सुतरां महद्भिः सम्भाषणीयाः पुरुषा भवन्ति ॥ ५२॥ अनेकरूपं
    विदितैकरूपं महान्तमुच्चैरतिशान्तचित्तम् । दान्तं नितान्तं शुभदं सुकान्तं विष्णुं शिवं वा भज भूरिभक्त्या
    ॥ ५३॥ हरे मुरारे हर हे पुरारे विष्णो दयालो शिव हे कृपालो । दीनं जनं सर्वगुणैर्विहीनं मां भक्तमार्तं
    परिपाहि नित्यम् ॥ ५४॥ हे हे विष्णो शम्भुरूपस्त्वमेव हे हे शम्भो विष्णुरूपस्त्वमेव । सत्यं सर्वे सन्त
    एवं वदन्तः संसाराब्धिं ह्यञ्जसा सन्तरन्ति ॥ ५५॥ विष्णुः शम्भुः शम्भुरेवास्ति विष्णुः शम्भुर्विष्णुर्विष्णुरेवास्ति
    शम्भुः । शम्भौ विष्णौ चैकरूपत्वमिष्टं शिष्टा एवं सर्वदा सञ्जपन्ति ॥ ५६॥ दैवी सम्पद्विद्यते यस्य पुंसः
    श्रीमान् सोऽयं सर्वदा भक्तियुक्तः । शम्भुं विष्णुं चैकरूपं द्विदेहं भेदं त्यक्त्वा सम्भजन्मोक्षमेति
    ॥ ५७॥ येषां पुंसामासुरी सम्पदास्ते मृत्योर्ग्रासाः कामलोभाभिभूताः । क्रोधेनान्धा बन्धयुक्ता जनास्ते
    शम्भुं विष्णुं भेदबुद्ध्या भजन्ते ॥ ५८॥ कल्याणकारं सुखदप्रकारं विनिर्विकारं विहितोपकारम् । स्वाकारमीशं
    न कृतापकारं शिवं भजध्वं किल केशवं च ॥ ५९॥ सच्चित्स्वरूपं करुणासुकूपं गीर्वाणभूपं वरधर्मयूपम् । संसारसारं
    सुरुचिप्रसारं देवं हरिं वा भज भो हरं वा ॥ ६०॥ आनन्दसिन्धुं परदीनबन्धुं मोहान्धकारस्य निकारहेतुम् ।
    सद्धर्मसेतुं रिपुधूमकेतुं भजस्व विष्णुं शिवमेकबुद्ध्या ॥ ६१॥ वेदान्तसिद्धान्तमयं दयालुं सत्साङ्ख्यशास्त्रप्रतिपाद्यमानम्
    । न्यायप्रसिद्धं सुतरां समिद्धं भजस्व विष्णुं शिवमेकबुद्ध्या ॥ ६२॥ पापापहारं रुचिरप्रचारं कृतोपकारं
    विलसद्विहारम् । सद्धर्मधारं कमनीयदारं सारं हरिं वा भज भो हरं वा ॥ ६३॥ विष्णौ हरौ भेदमवेक्षमाणः प्राणी
    नितान्तं खलु तान्तचेताः ।
