id: ganapatimalamantrah
category: mantra
name:
  english: ganapatimalamantrah
  devanagari: गणपतिमालामन्त्राः
content:
  english: ganapatimalamantrah om klim hrim shrim aim glaum om hrim kraum gam om namo bhagavate mahaganapataye
    smaranamatrasantushtaya sarvavidyaprakashaya sarvakamapradaya bhavabandhavimocanaya hrim sarvabhutabandhanaya
    krom sadhyakarshanaya klim jagattraya vashikaranaya sauh sarvamanahkshobhanaya shrim mahasampatpradaya
    glaum bhumandaladhipatyapradaya mahajnanapradaya cidanandatmane gaurinandanaya mahayogine shivapriyaya
    sarvanandavardhanaya sarvavidyaprakashanapradaya dram ciranjivine blum sammohanaya om mokshapradaya
  devanagari: गणपतिमालामन्त्राः ॐ क्लीं ह्रीं श्रीं ऐं ग्लौं ॐ ह्रीं क्रौं गं ॐ नमो भगवते महागणपतये स्मरणमात्रसन्तुष्टाय
    सर्वविद्याप्रकाशाय सर्वकामप्रदाय भवबन्धविमोचनाय ह्रीं सर्वभूतबन्धनाय क्रों साध्याकर्षणाय क्लीं जगत्त्रय
    वशीकरणाय सौः सर्वमनःक्षोभणाय श्रीं महासम्पत्प्रदाय ग्लौं भूमण्डलाधिपत्यप्रदाय महाज्ञानप्रदाय चिदानन्दात्मने
    गौरीनन्दनाय महायोगिने शिवप्रियाय सर्वानन्दवर्धनाय सर्वविद्याप्रकाशनप्रदाय द्रां चिरञ्जीविने ब्लूं
    सम्मोहनाय ॐ मोक्षप्रदाय
meaning: {}
