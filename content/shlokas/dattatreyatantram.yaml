id: dattatreyatantram
category: stotram
name:
  english: dattatreyatantram
  devanagari: दत्तात्रेयतन्त्रम्
content:
  english: shariranam sarvashastranivaranam || 7|| pushyarke shvetagumjaya mulamuddhritya dharayet | haste
    shastrabhyam nasti sashngrame na kadacana || 8|| grihitva ravivare tu bilvapatre ca komaklam | pishtva
    visham tatsamam ca lepanacchastrabandhanam || 9|| atha shastrastambhanamantrah om namo bhagavate mahabala
    parakramaya shatrunam shastrastambhanam kuru kuru svaha | prayogavidhih ekalakshajapanmantrah siddho
    bhavati nanyatha | ashtottarashatajapatprayogah siddhyati dhruvam || 8|| atha shastralepanam vishnukranyiyabijani
    mantrabhavena grahayet | tattailam grahayetpatre visham caiva samanvitam || 1|| bhallatataila samyuktam
    mahiphenena samyutam | kharamutram ca samyuktam dhatturabijasamyutam || 2|| talasya rasa samyuktam
    gandhakam ca manah shilam | ekikritya tathaitesham vatika kriyate naraih || 3||
  devanagari: शरीराणां सर्वशस्त्रनिवारणम् ॥ ७॥ पुष्यार्के श्वेतगुंजाया मूलमुद्धृत्य धारयेत् । हस्ते शस्त्रभ्यं
    नास्ति सश्ण्ग्रामे न कदाचन ॥ ८॥ गृहीत्वा रविवारे तु बिल्वपत्रे च कोमक्लम् । पिष्ट्वा विषं तत्समं च
    लेपनाच्छस्त्रबन्धनम् ॥ ९॥ अथ शस्त्रस्तम्भनमन्त्रः ॐ नमो भगवते महाबल पराक्रमाय शत्रूणां शस्त्रस्तम्भनं
    कुरु कुरु स्वाहा । प्रयोगविधिः एकलक्षजपान्मन्त्रः सिद्धो भवति नान्यथा । अष्टोत्तरशतजपात्प्रयोगः सिद्ध्यति
    ध्रुवम् ॥ ८॥ अथ शस्त्रलेपनम् विष्णुक्रान्यीयबीजानि मन्त्रभावेन ग्राहयेत् । तत्तैलं ग्राहयेत्पात्रे
    विषं चैव समन्वितम् ॥ १॥ भल्लाततैल संयुक्तं महिफेनेन संयुतम् । खरमूत्रं च संयुक्तं धत्तूरबीजसंयुतम्
    ॥ २॥ तालस्य रस संयुक्तं गन्धकं च मनः शिलाम् । एकीकृत्य तथैतेषां वटिका क्रियते नरैः ॥ ३॥
