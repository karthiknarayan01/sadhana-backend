id: tattvabodha-adi-shankaracharya
category: stotram
name:
  english: Tattvabodha (Adi Shankaracharya)
content:
  english: dhyanam vasudevendrayogindram natva jnanapradam gurum | mumukshunam hitarthaya tattvabodhobhidhiyate
    || sadhanacatushtayasampannadhikarinam mokshasadhanabhutam tattvavivekaprakaram vakshyamah | sadhanacatushtayam
    sadhanacatushtayam kim nityanityavastuvivekah | ihamutrarthaphalabhogaviragah | shamadishatkasampattih
    | mumukshutvam ceti | nityanityavastuvivekah nityanityavastuvivekah kah nityavastvekam brahma tadvyatiriktam
    sarvamanityam | ayameva nityanityavastuvivekah | viragah viragah kah ihasvargabhogeshu iccharahityam
    | shamadisadhanasampattih shamadisadhanasampattih ka shamo dama uparamastitiksha shraddha samadhanam
    ca iti |shamah kah cakshuradibahyendriyanigrahah | uparamah kah svadharmanushthanameva | titiksha
    ka shitoshnasukhaduhkhadisahishnutvam | shraddha kidrishi guruvedantavakyadishu vishvasah shraddha
    | samadhanam kim cittaikagrata | mumukshutvam mumukshutvam kim moksho me bhuyad iti iccha | etat sadhanacatushtayam
    | tatastattvavivekasyadhikarino bhavanti | tattvavivekah tattvavivekah kah atma satyam tadanyat sarvam
    mithyeti |atma kah sthulasukshmakaranashariradvyatiriktah pancakoshatitah san avasthatrayasakshi saccidanandasvarupah
    san yastishthati sa atma | shariratrayam pancikritapancamahabhutaih kritam satkarmajanyam sukhaduhkhadibhogayatanam
    shariram asti jayate vardhate viparinamate apakshiyate vinashyatiti shadvikaravadetatsthulashariram
    | shariratrayam apancikritapancamahabhutaih kritam satkarmajanyam sukhaduhkhadibhogasadhanam pancajnanendriyani
    pancakarmendriyani pancapranadayah manashcaikam buddhishcaika evam saptadashakalabhih saha yattishthati
    tatsukshmashariram | jnanendriyani shrotram tvak cakshuh rasana ghranam iti panca jnanendriyani |
    shrotrasya digdevata | tvaco vayuh | cakshushah suryah | rasanaya varunah | ghranasya ashvinau | iti
    jnanendriyadevatah | shrotrasya vishayah shabdagrahanam | tvaco vishayah sparshagrahanam | cakshusho
    vishayah rupagrahanam | rasanaya vishayah rasagrahanam | ghranasya vishayah gandhagrahanam iti | pancakarmendriyani
    vakpanipadapayupasthaniti pancakarmendriyani | vaco devata vahnih | hastayorindrah | padayorvishnuh
    | payormrityuh | upasthasya prajapatih | iti karmendriyadevatah | vaco vishayah bhashanam | panyorvishayah
    vastugrahanam | padayorvishayah gamanam | payorvishayah malatyagah | upasthasya vishayah ananda iti
    | karanashariram karanashariram kim anirvacyanadyavidyarupam shariradvayasya karanamatram satsvarupa'jnanam
    nirvikalpakarupam yadasti tatkaranashariram | avasthatrayam avasthatrayam kim jagratsvapnasushuptyavasthah
    | jagradavastha jagradavastha ka shrotradijnanendriyaih shabdadivishayaishca jnayate iti yat sa jagradavastha
    | sthula sharirabhimani atma vishva ityucyate | svapnavastha svapnavastha keti cet jagradavasthayam
    yaddrishtam yad shrutam tajjanitavasanaya nidrasamaye yah prapancah pratiyate sa svapnavastha | sukshmasharirabhimani
    atma taijasa ityucyate | sushuptyavastha atah sushuptyavastha ka aham kimapi na janami sukhena maya
    nidra'nubhuyata iti sushuptyavastha | karanasharirabhimani atma prajna ityucyate | panca koshah panca
    koshah ke annamayah pranamayah manomayah vijnanamayah anandamayashceti | annamayakoshah annamayah
    kah annarasenaiva bhutva annarasenaiva vriddhim prapya annarupaprithivyam yadviliyate tadannamayah
    koshah sthulashariram | pranamayakoshah pranamayah kah pranadyah pancavayavah vagadindriyapancakam
    pranamayah koshah | manomayakoshah manomayah koshah kah manashca jnanendriyapancakam militva yo bhavati
    sa manomayah koshah | vijnanamayakoshah vijnanamayah kah buddhijnanendriyapancakam militva yo bhavati
    sa vijnanamayah koshah anandamayakoshah anandamayah kah evameva karanasharirabhutavidyasthamalinasattvam
    priyadivrittisahitam sat anandamayah koshah | etatkoshapancakam | pancakoshatita madiyam shariram
    madiyah pranah madiyam manashca madiya buddhirmadiyam ajnanamiti svenaiva jnayate tadyatha madiyatvena
    jnatam katakakundala grihadikam svasmadbhinnam tatha pancakoshadikam svasmadbhinnam madiyatvena jnatamatma
    na bhavati || atman atma tarhi kah saccidanandasvarupah | satkim kalatraye'pi tishthatiti sat | citkim
    jnanasvarupah | anandah kah sukhasvarupah | evam saccidanandasvarupam svatmanam vijaniyat | jagat
    atha caturvimshatitattvotpattiprakaram vakshyamah | maya brahmashraya sattvarajastamogunatmika maya
    asti | pancabhutah tatah akashah sambhutah | akashad vayuh | vayostejah | tejasa apah | abhdhayah
    prithivi | sattvagunah etesham pancatattvanam madhye akashasya satvikamshat shrotrendriyam sambhutam
    | vayoh satvikamshat tvagindriyam sambhutam | agneh satvikamshat cakshurindriyam sambhutam | jalasya
    satvikamshat rasanendriyam sambhutam | prithivyah satvikamshat ghranendriyam sambhutam | antahkarana
    etesham pancatattvanam samashtisatvikamshat manobuddhyahankara cittantahkaranani sambhutani | sankalpavikalpatmakam
    manah | nishcayatmika buddhih | ahankarta ahankarah | cintanakartri cittam | manaso devata candramah
    | buddhe brahma | ahankarasya rudrah | cittasya vasudevah | rajogunah etesham pancatattvanam madhye
    akashasya rajasamshat vagindriyam sambhutam | vayoh rajasamshat panindriyam sambhutam | vanheh rajasamshat
    padendriyam sambhutam | jalasya rajasamshat upasthendriyam sambhutam | prithivya rajasamshat gudendriyam
    sambhutam | etesham samashtirajasamshat pancapranah sambhutah | tamogunah etesham pancatattvanam tamasamshat
    pancikritapancatattvani bhavanti | pancikaranam katham iti cet | etesham pancamahabhutanam tamasamshasvarupam
    ekamekam bhutam dvidha vibhajya ekamekamardham prithak tushnim vyavasthapya aparamaparamardham caturdham
    vibhajya svardhamanyeshu ardheshu svabhagacatushtayasamyojanam karyam | tada pancikaranam bhavati
    | etebhyah pancikritapancamahabhutebhyah sthulashariram bhavati | evam pindabrahmandayoraikyam sambhutam
    | jivah ishvarah ca sthulasharirabhimani jivanamakam brahmapratibimbam bhavati | sa eva jivah prakritya
    svasmat ishvaram bhinnatvena janati | avidyopadhih san atma jiva ityucyate | mayopadhih san ishvara
    ityucyate | evam upadhibhedat jiveshvarabhedadrishtih yavatparyantam tishthati tavatparyantam janmamaranadirupasamsaro
    na nivartate | tasmatkarananna jiveshvarayorbhedabuddhih svikarya | tat tvam asi nanu sahankarasya
    kincijjnasya jivasya nirahankarasya sarvajnasya ishvarasya tattvamasiti mahavakyat kathamabhedabuddhih
    syadubhayoh viruddhadharmakrantatvat | iti cenna | sthulasukshmasharirabhimani tvampadavacyarthah
    | upadhivinirmuktam samadhidashasampannam shuddham caitanyam tvampadalakshyarthah | evam sarvajnatvadivishishta
    ishvarah tatpadavacyarthah | upadhishunyam shuddhacaitanyam tatpadalakshyarthah | evam ca jiveshvarayo
    caitanyarupena'bhede badhakabhavah | jivanmuktah evam ca vedantavakyaih sadgurupadeshena ca sarveshvapi
    bhuteshu yesham brahmabuddhirutpanna te jivanmuktah ityarthah |nanu jivanmuktah kah yatha deho'ham
    purusho'ham brahmano'ham shudro'hamasmiti dridhanishcayastatha naham brahmanah na shudrah na purushah
    kintu asangah saccidananda svarupah prakasharupah sarvantaryami cidakasharupo'smiti dridhanishcaya
    rupo'parokshajnanavan jivanmuktah ||brahmaivahamasmityaparokshajnanena nikhilakarmabandhavinirmuktah
    syat | karmani karmani katividhani santiti cet agamisancitaprarabdhabhedena trividhani santi | agami
    karma jnanotpattyanantaram jnanidehakritam punyapaparupam karma yadasti tadagamityabhidhiyate | sancita
    karma sancitam karma kim anantakotijanmanam bijabhutam sat yatkarmajatam purvarjitam tishthati tat
    sancitam jneyam | prarabdha karma prarabdham karma kimiti cet | idam shariramutpadya iha loke evam
    sukhaduhkhadipradam yatkarma tatprarabdham bhogena nashtam bhavati prarabdhakarmanam bhogadeva kshaya
    iti | karma muktah sancitam karma brahmaivahamiti nishcayatmakajnanena nashyati |agami karma api jnanena
    nashyati kinca agami karmanam nalinidalagatajalavat jnaninam sambandho nasti | jnanih kinca ye jnaninam
    stuvanti bhajanti arcayanti tanprati jnanikritam agami punyam gacchati | ye jnaninam nindanti dvishanti
    duhkhapradanam kurvanti tanprati jnanikritam sarvamagami kriyamanam yadavacyam karma papatmakam tadgacchati
    | suhridah punyakritam durhridah papakrityam grihnanti | brahmanandam tatha catmavitsamsaram tirtva
    brahmanandamihaiva prapnoti | tarati shokamatmavit iti shruteh | tanum tyajatu va kashyam shvapacasya
    grihe'tha va | jnanasampraptisamaye mukta'sau vigatashayah | iti smriteshca |iti shrishankarabhagavatpadacaryapranitah
    tattvabodhaprakaranam samaptam |
  devanagari: ध्यानं वासुदेवेन्द्रयोगीन्द्रं नत्वा ज्ञानप्रदं गुरुम् । मुमुक्षूणां हितार्थाय तत्त्वबोधोभिधीयते
    ॥ साधनचतुष्टयसम्पन्नाधिकारिणां मोक्षसाधनभूतं तत्त्वविवेकप्रकारं वक्ष्यामः । साधनचतुष्टयम् साधनचतुष्टयं
    किम् नित्यानित्यवस्तुविवेकः । इहामुत्रार्थफलभोगविरागः । शमादिषट्कसम्पत्तिः । मुमुक्षुत्वं चेति । नित्यानित्यवस्तुविवेकः
    नित्यानित्यवस्तुविवेकः कः नित्यवस्त्वेकं ब्रह्म तद्व्यतिरिक्तं सर्वमनित्यम् । अयमेव नित्यानित्यवस्तुविवेकः
    । विरागः विरागः कः इहस्वर्गभोगेषु इच्छाराहित्यम् । शमादिसाधनसम्पत्तिः शमादिसाधनसम्पत्तिः का शमो दम
    उपरमस्तितिक्षा श्रद्धा समाधानं च इति ।शमः कः चक्षुरादिबाह्येन्द्रियनिग्रहः । उपरमः कः स्वधर्मानुष्ठानमेव
    । तितिक्षा का शीतोष्णसुखदुःखादिसहिष्णुत्वम् । श्रद्धा कीदृशी गुरुवेदान्तवाक्यादिषु विश्वासः श्रद्धा
    । समाधानं किम् चित्तैकाग्रता । मुमुक्षुत्वं मुमुक्षुत्वं किम् मोक्षो मे भूयाद् इति इच्छा । एतत् साधनचतुष्टयम्
    । ततस्तत्त्वविवेकस्याधिकारिणो भवन्ति । तत्त्वविवेकः तत्त्वविवेकः कः आत्मा सत्यं तदन्यत् सर्वं मिथ्येति
    ।आत्मा कः स्थूलसूक्ष्मकारणशरीराद्व्यतिरिक्तः पञ्चकोशातीतः सन् अवस्थात्रयसाक्षी सच्चिदानन्दस्वरूपः
    सन् यस्तिष्ठति स आत्मा । शरीरत्रयं पञ्चीकृतपञ्चमहाभूतैः कृतं सत्कर्मजन्यं सुखदुःखादिभोगायतनं शरीरम्
    अस्ति जायते वर्धते विपरिणमते अपक्षीयते विनश्यतीति षड्विकारवदेतत्स्थूलशरीरम् । शरीरत्रयं अपञ्चीकृतपञ्चमहाभूतैः
    कृतं सत्कर्मजन्यं सुखदुःखादिभोगसाधनं पञ्चज्ञानेन्द्रियाणि पञ्चकर्मेन्द्रियाणि पञ्चप्राणादयः मनश्चैकं
    बुद्धिश्चैका एवं सप्तदशाकलाभिः सह यत्तिष्ठति तत्सूक्ष्मशरीरम् । ज्ञानेन्द्रियाणि श्रोत्रं त्वक् चक्षुः
    रसना घ्राणं इति पञ्च ज्ञानेन्द्रियाणि । श्रोत्रस्य दिग्देवता । त्वचो वायुः । चक्षुषः सूर्यः । रसनाया
    वरुणः । घ्राणस्य अश्विनौ । इति ज्ञानेन्द्रियदेवताः । श्रोत्रस्य विषयः शब्दग्रहणम् । त्वचो विषयः स्पर्शग्रहणम्
    । चक्षुषो विषयः रूपग्रहणम् । रसनाया विषयः रसग्रहणम् । घ्राणस्य विषयः गन्धग्रहणं इति । पञ्चकर्मेन्द्रियाणि
    वाक्पाणिपादपायूपस्थानीति पञ्चकर्मेन्द्रियाणि । वाचो देवता वह्निः । हस्तयोरिन्द्रः । पादयोर्विष्णुः
    । पायोर्मृत्युः । उपस्थस्य प्रजापतिः । इति कर्मेन्द्रियदेवताः । वाचो विषयः भाषणम् । पाण्योर्विषयः
    वस्तुग्रहणम् । पादयोर्विषयः गमनम् । पायोर्विषयः मलत्यागः । उपस्थस्य विषयः आनन्द इति । कारणशरीरम् कारणशरीरं
    किम् अनिर्वाच्यानाद्यविद्यारूपं शरीरद्वयस्य कारणमात्रं सत्स्वरूपाऽज्ञानं निर्विकल्पकरूपं यदस्ति तत्कारणशरीरम्
    । अवस्थात्रयम् अवस्थात्रयं किम् जाग्रत्स्वप्नसुषुप्त्यवस्थाः । जाग्रदवस्था जाग्रदवस्था का श्रोत्रादिज्ञानेन्द्रियैः
    शब्दादिविषयैश्च ज्ञायते इति यत् सा जाग्रदावस्था । स्थूल शरीराभिमानी आत्मा विश्व इत्युच्यते । स्वप्नावस्था
    स्वप्नावस्था केति चेत् जाग्रदवस्थायां यद्दृष्टं यद् श्रुतम् तज्जनितवासनया निद्रासमये यः प्रपञ्चः प्रतीयते
    सा स्वप्नावस्था । सूक्ष्मशरीराभिमानी आत्मा तैजस इत्युच्यते । सुषुप्त्यवस्था अतः सुषुप्त्यवस्था का
    अहं किमपि न जानामि सुखेन मया निद्राऽनुभूयत इति सुषुप्त्यवस्था । कारणशरीराभिमानी आत्मा प्राज्ञ इत्युच्यते
    । पञ्च कोशाः पञ्च कोशाः के अन्नमयः प्राणमयः मनोमयः विज्ञानमयः आनन्दमयश्चेति । अन्नमयकोशः अन्नमयः कः
    अन्नरसेनैव भूत्वा अन्नरसेनैव वृद्धिं प्राप्य अन्नरूपपृथिव्यां यद्विलीयते तदन्नमयः कोशः स्थूलशरीरम्
    । प्राणमयकोशः प्राणमयः कः प्राणाद्याः पञ्चवायवः वागादीन्द्रियपञ्चकं प्राणमयः कोशः । मनोमयकोशः मनोमयः
    कोशः कः मनश्च ज्ञानेन्द्रियपञ्चकं मिलित्वा यो भवति स मनोमयः कोशः । विज्ञानमयकोशः विज्ञानमयः कः बुद्धिज्ञानेन्द्रियपञ्चकं
    मिलित्वा यो भवति स विज्ञानमयः कोशः आनन्दमयकोशः आनन्दमयः कः एवमेव कारणशरीरभूताविद्यास्थमलिनसत्त्वं
    प्रियादिवृत्तिसहितं सत् आनन्दमयः कोशः । एतत्कोशपञ्चकम् । पञ्चकोशातीत मदीयं शरीरं मदीयाः प्राणाः मदीयं
    मनश्च मदीया बुद्धिर्मदीयं अज्ञानमिति स्वेनैव ज्ञायते तद्यथा मदीयत्वेन ज्ञातं कटककुण्डल गृहादिकं स्वस्माद्भिन्नं
    तथा पञ्चकोशादिकं स्वस्माद्भिन्नम् मदीयत्वेन ज्ञातमात्मा न भवति ॥ आत्मन् आत्मा तर्हि कः सच्चिदानन्दस्वरूपः
    । सत्किम् कालत्रयेऽपि तिष्ठतीति सत् । चित्किम् ज्ञानस्वरूपः । आनन्दः कः सुखस्वरूपः । एवं सच्चिदानन्दस्वरूपं
    स्वात्मानं विजानीयात् । जगत् अथ चतुर्विंशतितत्त्वोत्पत्तिप्रकारं वक्ष्यामः । माया ब्रह्माश्रया सत्त्वरजस्तमोगुणात्मिका
    माया अस्ति । पञ्चभूताः ततः आकाशः सम्भूतः । आकाशाद् वायुः । वायोस्तेजः । तेजस आपः । अभ्धयः पृथिवी ।
    सत्त्वगुणः एतेषां पञ्चतत्त्वानां मध्ये आकाशस्य सात्विकांशात् श्रोत्रेन्द्रियं सम्भूतम् । वायोः सात्विकांशात्
    त्वगिन्द्रियं सम्भूतम् । अग्नेः सात्विकांशात् चक्षुरिन्द्रियं सम्भूतम् । जलस्य सात्विकांशात् रसनेन्द्रियं
    सम्भूतम् । पृथिव्याः सात्विकांशात् घ्राणेन्द्रियं सम्भूतम् । अन्तःकरण एतेषां पञ्चतत्त्वानां समष्टिसात्विकांशात्
    मनोबुद्ध्यहङ्कार चित्तान्तःकरणानि सम्भूतानि । सङ्कल्पविकल्पात्मकं मनः । निश्चयात्मिका बुद्धिः । अहङ्कर्ता
    अहङ्कारः । चिन्तनकर्तृ चित्तम् । मनसो देवता चन्द्रमाः । बुद्धे ब्रह्मा । अहङ्कारस्य रुद्रः । चित्तस्य
    वासुदेवः । रजोगुणः एतेषां पञ्चतत्त्वानां मध्ये आकाशस्य राजसांशात् वागिन्द्रियं सम्भूतम् । वायोः राजसांशात्
    पाणीन्द्रियं सम्भूतम् । वन्हेः राजसांशात् पादेन्द्रियं सम्भूतम् । जलस्य राजसांशात् उपस्थेन्द्रियं
    सम्भूतम् । पृथिव्या राजसांशात् गुदेन्द्रियं सम्भूतम् । एतेषां समष्टिराजसांशात् पञ्चप्राणाः सम्भूताः
    । तमोगुणः एतेषां पञ्चतत्त्वानां तामसांशात् पञ्चीकृतपञ्चतत्त्वानि भवन्ति । पञ्चीकरणं कथं इति चेत् ।
    एतेषां पञ्चमहाभूतानां तामसांशस्वरूपम् एकमेकं भूतं द्विधा विभज्य एकमेकमर्धं पृथक् तूष्णीं व्यवस्थाप्य
    अपरमपरमर्धं चतुर्धां विभज्य स्वार्धमन्येषु अर्धेषु स्वभागचतुष्टयसंयोजनं कार्यम् । तदा पञ्चीकरणं भवति
    । एतेभ्यः पञ्चीकृतपञ्चमहाभूतेभ्यः स्थूलशरीरं भवति । एवं पिण्डब्रह्माण्डयोरैक्यं सम्भूतम् । जीवः ईश्वरः
    च स्थूलशरीराभिमानि जीवनामकं ब्रह्मप्रतिबिम्बं भवति । स एव जीवः प्रकृत्या स्वस्मात् ईश्वरं भिन्नत्वेन
    जानाति । अविद्योपाधिः सन् आत्मा जीव इत्युच्यते । मायोपाधिः सन् ईश्वर इत्युच्यते । एवं उपाधिभेदात्
    जीवेश्वरभेददृष्टिः यावत्पर्यन्तं तिष्ठति तावत्पर्यन्तं जन्ममरणादिरूपसंसारो न निवर्तते । तस्मात्कारणान्न
    जीवेश्वरयोर्भेदबुद्धिः स्वीकार्या । तत् त्वं असि ननु साहङ्कारस्य किञ्चिज्ज्ञस्य जीवस्य निरहङ्कारस्य
    सर्वज्ञस्य ईश्वरस्य तत्त्वमसीति महावाक्यात् कथमभेदबुद्धिः स्यादुभयोः विरुद्धधर्माक्रान्तत्वात् । इति
    चेन्न । स्थूलसूक्ष्मशरीराभिमानी त्वम्पदवाच्यार्थः । उपाधिविनिर्मुक्तं समाधिदशासम्पन्नं शुद्धं चैतन्यं
    त्वम्पदलक्ष्यार्थः । एवं सर्वज्ञत्वादिविशिष्ट ईश्वरः तत्पदवाच्यार्थः । उपाधिशून्यं शुद्धचैतन्यं तत्पदलक्ष्यार्थः
    । एवं च जीवेश्वरयो चैतन्यरूपेणाऽभेदे बाधकाभावः । जीवन्मुक्तः एवं च वेदान्तवाक्यैः सद्गुरूपदेशेन च
    सर्वेष्वपि भूतेषु येषां ब्रह्मबुद्धिरुत्पन्ना ते जीवन्मुक्ताः इत्यर्थः ।ननु जीवन्मुक्तः कः यथा देहोऽहं
    पुरुषोऽहं ब्राह्मणोऽहं शूद्रोऽहमस्मीति दृढनिश्चयस्तथा नाहं ब्राह्मणः न शूद्रः न पुरुषः किन्तु असङ्गः
    सच्चिदानन्द स्वरूपः प्रकाशरूपः सर्वान्तर्यामी चिदाकाशरूपोऽस्मीति दृढनिश्चय रूपोऽपरोक्षज्ञानवान् जीवन्मुक्तः
    ॥ब्रह्मैवाहमस्मीत्यपरोक्षज्ञानेन निखिलकर्मबन्धविनिर्मुक्तः स्यात् । कर्माणि कर्माणि कतिविधानि सन्तीति
    चेत् आगामिसञ्चितप्रारब्धभेदेन त्रिविधानि सन्ति । आगामि कर्म ज्ञानोत्पत्त्यनन्तरं ज्ञानिदेहकृतं पुण्यपापरूपं
    कर्म यदस्ति तदागामीत्यभिधीयते । सञ्चित कर्म सञ्चितं कर्म किम् अनन्तकोटिजन्मनां बीजभूतं सत् यत्कर्मजातं
    पूर्वार्जितं तिष्ठति तत् सञ्चितं ज्ञेयम् । प्रारब्ध कर्म प्रारब्धं कर्म किमिति चेत् । इदं शरीरमुत्पाद्य
    इह लोके एवं सुखदुःखादिप्रदं यत्कर्म तत्प्रारब्धं भोगेन नष्टं भवति प्रारब्धकर्मणां भोगादेव क्षय इति
    । कर्म मुक्तः सञ्चितं कर्म ब्रह्मैवाहमिति निश्चयात्मकज्ञानेन नश्यति ।आगामि कर्म अपि ज्ञानेन नश्यति
    किञ्च आगामि कर्मणां नलिनीदलगतजलवत् ज्ञानिनां सम्बन्धो नास्ति । ज्ञानिः किञ्च ये ज्ञानिनं स्तुवन्ति
    भजन्ति अर्चयन्ति तान्प्रति ज्ञानिकृतं आगामि पुण्यं गच्छति । ये ज्ञानिनं निन्दन्ति द्विषन्ति दुःखप्रदानं
    कुर्वन्ति तान्प्रति ज्ञानिकृतं सर्वमागामि क्रियमाणं यदवाच्यं कर्म पापात्मकं तद्गच्छति । सुहृदः पुण्यकृतं
    दुर्हृदः पापकृत्यं गृह्णन्ति । ब्रह्मानन्दम् तथा चात्मवित्संसारं तीर्त्वा ब्रह्मानन्दमिहैव प्राप्नोति
    । तरति शोकमात्मवित् इति श्रुतेः । तनुं त्यजतु वा काश्यां श्वपचस्य गृहेऽथ वा । ज्ञानसम्प्राप्तिसमये
    मुक्ताऽसौ विगताशयः । इति स्मृतेश्च ।इति श्रीशङ्करभगवत्पादाचार्यप्रणीतः तत्त्वबोधप्रकरणं समाप्तम् ।
