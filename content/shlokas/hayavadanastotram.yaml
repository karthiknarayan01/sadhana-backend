id: hayavadanastotram
category: stotram
name:
  english: hayavadanastotram
  devanagari: हयवदनस्तोत्रम्
content:
  english: na kritavan vimudhatmakah | tvadankatalasamsthitam kuvalanilalolekshanam vilokya kamalam tatha'pyahamihasmi
    nissadhvasah || 5|| vidhusrashucikesara prakataphalapundram karaih caturbhirapi pustakam dhavaḻashankhacakre
    tatha | dadhanamupadeshadaprayatamudrikam vakpatim smarami hayakandharam kamalayasamam bhasuram ||
    6|| kiritamanimalikaruciratrikeyuraka
  devanagari: न कृतवान् विमूढात्मकः । त्वदङ्कतलसंस्थितां कुवलनीललोलेक्षणां विलोक्य कमलां तथाऽप्यहमिहास्मि
    निस्साध्वसः ॥ ५॥ विधूस्रशुचिकेसर प्रकटफालपुण्ड्रं करैः चतुर्भिरपि पुस्तकं धवळशङ्खचक्रे तथा । दधानमुपदेशदप्रयतमुद्रिकां
    वाक्पतिं स्मरामि हयकन्धरं कमलयासमं भासुरम् ॥ ६॥ किरीटमणिमालिकारुचिरतृकेयूरक
meaning: {}
