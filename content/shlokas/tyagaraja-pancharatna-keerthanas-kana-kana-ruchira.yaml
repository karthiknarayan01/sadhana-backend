id: tyagaraja-pancharatna-keerthanas-kana-kana-ruchira
category: stotram
name:
  english: Tyagaraja Pancharatna Keerthanas Kana Kana Ruchira
content:
  english: shri tyagarajacaryulu ragam adi kana kana rucira kanaka vasana ninnu dina dinamunu anudina
    dinamunu manasuna canuvuna ninnu kana kana rucira kanaka vasana ninnu palugaru momuna shriyapara mahima
    kanaru ninnu kana kana rucira kanaka vasana ninnu kalakalamanu mukhakala galigina sita kulukucu nora
    kannulanu juce ninnu kana kana rucira kanaka vasana ninnu balakabha sucela manimaya malalankrita kandhara
    sarasijaksha vara kapola surucira kiritadhara santatambu manasaraga kana kana rucira kanaka vasana
    ninnu sapatni matayau surucice karna shulamaina matala vinula curukkana talaka shri harini dhyaninci
    sukhiyimpaga leda yatu kana kana rucira kanaka vasana ninnu mridamada lalama shubhanitila vara jatayu
    moksha phalada pavamana sutudu nidu mahima dèlpa sita dèlisi valaci sòkkaleda ariti ninnu kana kana
    rucira kanaka vasana ninnu sukhaspada vimukhambudhara pavana videha manasa viharapta surabhuja manita
    gunanka cidananda khaga turanga dhrita rathanga parama dayakara karunarasa varunalaya bhayapahara
    shri raghupate kana kana rucira kanaka vasana ninnu kaminci premamida karamula nidu pada kamalamula
    battukònu vadu sakshi rama nama rasikudu kailasa sadanudu sakshi mariyu narada parashara shuka shaunaka
    purandhara nagaja dharaja mukhyulu sakshi gada sundaresha sukha kalashambudhi vasa shritulake kana
    kana rucira kanaka vasana ninnu satatamu prema puritudagu tyagarajanuta mukhajita kumudahita varada
    ninnu kana kana rucira kanaka vasana ninnu kana kana rucira
  devanagari: श्री त्यागराजाचार्युलु रागं आदि कन कन रुचिरा कनक वसन निन्नु दिन दिनमुनु अनुदिन दिनमुनु मनसुन
    चनुवुन निन्नु कन कन रुचिर कनक वसन निन्नु पालुगारु मोमुन श्रीयपार महिम कनरु निन्नु कन कन रुचिरा कनक
    वसन निन्नु कलकलमनु मुखकल गलिगिन सीत कुलुकुचु नोर कन्नुलनु जूचे निन्नु कन कन रुचिरा कनक वसन निन्नु
    बालाकाभ सुचेल मणिमय मालालङ्कृत कन्धर सरसिजाक्ष वर कपोल सुरुचिर किरीटधर सन्ततम्बु मनसारग कन कन रुचिरा
    कनक वसन निन्नु सपत्नि मातयौ सुरुचिचे कर्ण शूलमैन माटल वीनुल चुरुक्कन तालक श्री हरिनि ध्यानिञ्चि सुखियिम्पग
    लेदा यटु कन कन रुचिरा कनक वसन निन्नु मृदमद ललाम शुभानिटिल वर जटायु मोक्ष फलद पवमान सुतुडु नीदु महिम
    दॆल्प सीत दॆलिसि वलचि सॊक्कलेदा आरीति निन्नु कन कन रुचिरा कनक वसन निन्नु सुखास्पद विमुखाम्बुधर पवन
    विदेह मानस विहाराप्त सुरभूज मानित गुणाङ्क चिदानन्द खग तुरङ्ग धृत रथङ्ग परम दयाकर करुणारस वरुणालय भयापहर
    श्री रघुपते कन कन रुचिरा कनक वसन निन्नु कामिञ्चि प्रेममीद करमुल नीदु पाद कमलमुल बट्टुकॊनु वाडु साक्षि
    राम नाम रसिकुडु कैलास सदनुडु साक्षि मरियु नारद पराशर शुक शौनक पुरन्धर नगजा धरज मुख्युलु साक्षि गादा
    सुन्दरेश सुख कलशाम्बुधि वासा श्रितुलके कन कन रुचिरा कनक वसन निन्नु सततमु प्रेम पूरितुडगु त्यागराजनुत
    मुखजित कुमुदहित वरद निन्नु कन कन रुचिरा कनक वसन निन्नु कन कन रुचिरा
