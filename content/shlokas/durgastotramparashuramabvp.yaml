id: durgastotramparashuramabvp
category: stotram
name:
  english: durgastotramparashuramaBVP
  devanagari: दुर्गास्तोत्रम्परशुरामBVP
content:
  english: ishanasya shashikala devahutih kardamasya vasishthasyapyarundhati || 22|| lopamudra'pyagastyasya
    devamata'ditistatha | ahalya gautamasyapi sarvadhara vasundhara || 23|| ganga ca tulasi capi prithivyam
    yah saridvarah | etah sarvashca ya hyanyah sarvastvatkalayambike || 24|| grihalakshmirgrihe nrinam
    rajalakshmishca rajasu | tapasvinam tapasya tvam gayatri brahmanasya ca || 25|| satam sattvasvarupa
    tvamasatam kalahankura | jyotirupa nirgunasya shaktistvam sagunasya ca || 26|| surye prabhasvarupa
    tvam dahika ca hutashane | jale shaityasvarupa ca shobharupa nishakare || 27|| tvam bhumau gandharupa
    ca akashe shabdarupini | kshutpipasadayastvam ca jivinam sarvashaktayah || 28|| sarvabijasvarupa tvam
    samsare sararupini | smritirmedha ca buddhirva jnanashaktirvipashcitam || 29|| krishnena vidya ya
    datta sarvajnanaprasuh shubha | shuline kripaya sa tvam yato mrityunjayah shivah || 30|| srishtipalanasamharashaktayastrividhashrca
    yah | brahmavishnumaheshanam sa tvameva namo'stu te || 31|| madhukaitabhabhitya ca trasto dhata prakampitah
    | stutva muktashca yam devim tam murdhna pranamamyaham || 32||
  devanagari: ईशानस्य शशिकला देवहूतिः कर्दमस्य वसिष्ठस्याप्यरुन्धती ॥ २२॥ लोपामुद्राऽप्यगस्त्यस्य देवमाताऽदितिस्तथा
    । अहल्या गौतमस्यापि सर्वाधारा वसुन्धरा ॥ २३॥ गङ्गा च तुलसी चापि पृथिव्यां याः सरिद्वराः । एताः सर्वाश्च
    या ह्यन्याः सर्वास्त्वत्कलयाम्बिके ॥ २४॥ गृहलक्ष्मीर्गृहे नॄणां राजलक्ष्मीश्च राजसु । तपस्विनां तपस्या
    त्वं गायत्री ब्राह्मणस्य च ॥ २५॥ सतां सत्त्वस्वरूपा त्वमसतां कलहाङ्कुरा । ज्योतीरूपा निर्गुणस्य शक्तिस्त्वं
    सगुणस्य च ॥ २६॥ सूर्ये प्रभास्वरूपा त्वं दाहिका च हुताशने । जले शैत्यस्वरूपा च शोभारूपा निशाकरे ॥
    २७॥ त्वं भूमौ गन्धरूपा च आकाशे शब्दरूपिणी । क्षुत्पिपासादयस्त्वं च जीविनां सर्वशक्तयः ॥ २८॥ सर्वबीजस्वरूपा
    त्वं संसारे साररूपिणी । स्मृतिर्मेधा च बुद्धिर्वा ज्ञानशक्तिर्विपश्चिताम् ॥ २९॥ कृष्णेन विद्या या
    दत्ता सर्वज्ञानप्रसूः शुभा । शूलिने कृपया सा त्वं यतो मृत्युञ्जयः शिवः ॥ ३०॥ सृष्टिपालनसंहारशक्तयस्त्रिविधाश्र्च
    याः । ब्रह्मविष्णुमहेशानां सा त्वमेव नमोऽस्तु ते ॥ ३१॥ मधुकैटभभीत्या च त्रस्तो धाता प्रकम्पितः । स्तुत्वा
    मुक्तश्च यां देवीं तां मूर्ध्ना प्रणमाम्यहम् ॥ ३२॥
