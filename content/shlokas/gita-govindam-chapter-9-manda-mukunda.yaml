id: gita-govindam-chapter-9-manda-mukunda
category: stotram
name:
  english: Gita Govindam Chapter 9 - Manda Mukunda
content:
  english: '|| navamah sargah || || mandamukundah || tamatha manmathakhinnam ratirasabhinnam vishadasampannam
    | anucintitaharicaritam kalahantaritamuvaca sakhi || || harirabhisarati vahati madhupavane | kimaparamadhikasukham
    sakhi bhuvane || madhave ma kuru manini manamaye || || talaphaladapi gurumatisarasam | kim viphalikurushe
    kucakalasham || || kati na kathitamidamanupadamaciram | ma parihara harimatishayaruciram || || kimiti
    vishidasi rodishi vikala | vihasati yuvatisabha tava sakala || || sajalanalinidalashitalashayane |
    harimavalokya saphalay nayane || || janayasi manasi kimiti gurukhedam | shrinu mama vacanamanihitabhedam
    || || harirupayatu vadatu bahumadhuram | kimiti karoshi hridayamatividhuram || || shrijayadevabhanitamatilalitam
    | sukhayatu rasikajanam haricaritam || || snigdhe yatparushasi yatpranamati stabdhasi yadragini dveshasthasi
    yadunmukhe vimukhatam yatasi tasminpriye | yuktam tadviparitakarini tava shrikhandacarca visham shitamshustapano
    himam hutavahah kridamudo yatanah || || || iti gitagovinde kalahantaritavarnane mandamukundo nama
    navamah sargah ||'
  devanagari: ॥ नवमः सर्गः ॥ ॥ मन्दमुकुन्दः ॥ तामथ मन्मथखिन्नां रतिरसभिन्नां विषादसम्पन्नाम् । अनुचिन्तितहरिचरितां
    कलहान्तरितमुवाच सखी ॥ ॥ हरिरभिसरति वहति मधुपवने । किमपरमधिकसुखं सखि भुवने ॥ माधवे मा कुरु मानिनि मानमये
    ॥ ॥ तालफलादपि गुरुमतिसरसम् । किं विफलीकुरुषे कुचकलशम् ॥ ॥ कति न कथितमिदमनुपदमचिरम् । मा परिहर हरिमतिशयरुचिरम्
    ॥ ॥ किमिति विषीदसि रोदिषि विकला । विहसति युवतिसभा तव सकला ॥ ॥ सजलनलिनीदलशीतलशयने । हरिमवलोक्य सफलय्
    नयने ॥ ॥ जनयसि मनसि किमिति गुरुखेदम् । शृणु मम वचनमनीहितभेदम् ॥ ॥ हरिरुपयातु वदतु बहुमधुरम् । किमिति
    करोषि हृदयमतिविधुरम् ॥ ॥ श्रीजयदेवभणितमतिललितम् । सुखयतु रसिकजनं हरिचरितम् ॥ ॥ स्निग्धे यत्परुषासि
    यत्प्रणमति स्तब्धासि यद्रागिणि द्वेषस्थासि यदुन्मुखे विमुखतां यातासि तस्मिन्प्रिये । युक्तं तद्विपरीतकारिणि
    तव श्रीखण्डचर्चा विषं शीतांशुस्तपनो हिमं हुतवहः क्रीडामुदो यातनाः ॥ ॥ ॥ इति गीतगोविन्दे कलहान्तरितावर्णने
    मन्दमुकुन्दो नाम नवमः सर्गः ॥
