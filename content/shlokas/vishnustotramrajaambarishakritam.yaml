id: vishnustotramrajaambarishakritam
category: stotram
name:
  english: vishnustotramrajaambarishakritam
  devanagari: विष्णुस्तोत्रम्राजाअम्बरीषकृतम्
content:
  english: adideva jayajeya jaya sargadikaraka | jayaspashtaprakashanda brihanmurte jayakshara || 36||
    jaya sarvagatacintya jaya janmajarapaha | jaya vyapinjayabheda sarvabhuteshvavasthita || 37|| jaya
    yajnapate natha havyakavyashanavyaya | jaya vijnatasiddhanta mayamohaka keshava || 38|| lokasthityarthamanagha
    varaha jaya bhudhara | nrisimha jaya devarivakshahsthalavidarana || 39|| devanamaribhitanamartinashana
    vamana | jaya krantasamastorvinabhahsvarlokabhavana || 40|| jitam te jagatamisha jitam te sarva sarvada
    | jitam te sarvabhutesha yogidhyeya namo'stu te || 41|| namo'stvavyapadeshyaya namah sukshmasvarupine
    | namastrimurtaye tubhyam vishvamurte namo'stu te || 42|| brahmadyaishcintyate rupam yattatsadasatah
    param | visheshairavisheshyaya tasmai tubhyam namo namah || 43|| purushakhyam tato rupam nirgunam
    gunabhoktri ca | prakriteh paratah sukshmam tannamasyami te hare || 44|| avyaktadivisheshantamatisukshmatamam
    mahat | prakritam tava tadrupam tasmai deva namamyaham || 45|| rupairnanavidhairyashca tadrupantaragocaram
    | lilaya vyavaharaste tasmai devatmane namah || 46|| prasida vishno govinda shankhacakragadadhara
    | dharadhararavindaksha vasudeva maheshvara || 47|| iti vishnudharmeshu dvitiyo'dhyayantargatam raja
    ambarishakritam vishnustotram sampurnam |
  devanagari: आदिदेव जयाजेय जय सर्गादिकारक । जयास्पष्टप्रकाशाण्ड बृहन्मूर्ते जयाक्षर ॥ ३६॥ जय सर्वगताचिन्त्य
    जय जन्मजरापह । जय व्यापिञ्जयाभेद सर्वभूतेष्ववस्थित ॥ ३७॥ जय यज्ञपते नाथ हव्यकव्याशनाव्यय । जय विज्ञातसिद्धान्त
    मायामोहक केशव ॥ ३८॥ लोकस्थित्यर्थमनघ वराह जय भूधर । नृसिंह जय देवारिवक्षःस्थलविदारण ॥ ३९॥ देवानामरिभीतानामार्तिनाशन
    वामन । जय क्रान्तसमस्तोर्वीनभःस्वर्लोकभावन ॥ ४०॥ जितं ते जगतामीश जितं ते सर्व सर्वद । जितं ते सर्वभूतेश
    योगिध्येय नमोऽस्तु ते ॥ ४१॥ नमोऽस्त्वव्यपदेश्याय नमः सूक्ष्मस्वरूपिणे । नमस्त्रिमूर्तये तुभ्यं विश्वमूर्ते
    नमोऽस्तु ते ॥ ४२॥ ब्रह्माद्यैश्चिन्त्यते रूपं यत्तत्सदसतः परम् । विशेषैरविशेष्याय तस्मै तुभ्यं नमो
    नमः ॥ ४३॥ पुरुषाख्यं ततो रूपं निर्गुणं गुणभोक्तृ च । प्रकृतेः परतः सूक्ष्मं तन्नमस्यामि ते हरे ॥ ४४॥
    अव्यक्तादिविशेषान्तमतिसूक्ष्मतमं महत् । प्राकृतं तव तद्रूपं तस्मै देव नमाम्यहम् ॥ ४५॥ रूपैर्नानाविधैर्यश्च
    तद्रूपान्तरगोचरम् । लीलया व्यवहारस्ते तस्मै देवात्मने नमः ॥ ४६॥ प्रसीद विष्णो गोविन्द शङ्खचक्रगदाधर
    । धराधरारविन्दाक्ष वासुदेव महेश्वर ॥ ४७॥ इति विष्णुधर्मेषु द्वितीयोऽध्यायान्तर्गतं राजा अम्बरीषकृतं
    विष्णुस्तोत्रं सम्पूर्णम् ।
