id: subhashitaratnakoshah-12-hemantavrajya
category: subhashita
name:
  english: subhashitaratnakoshah/12 hemantavrajya
  devanagari: सुभाषितरत्नकोशः/१२ हेमन्तव्रज्या
content:
  english: hastaropitadatrarajjulagudair vriddhair avriddhaih saha tyaktva shalicikartisham ita ito dhanvanty
    ami pamarah 12
  devanagari: हस्तारोपितदात्ररज्जुलगुडैर् वृद्धैर् अवृद्धैः सह त्यक्त्वा शालिचिकर्तिषाम् इत इतो धान्वन्त्य्
    अमी पामराः १२
meaning: {}
