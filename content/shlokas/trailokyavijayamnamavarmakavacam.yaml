id: trailokyavijayamnamavarmakavacam
category: kavacha
name:
  english: trailokyavijayamnamavarmakavacam
  devanagari: त्रैलोक्यविजयंनामवर्मकवचम्
content:
  english: pancaksharatmakah || 14|| krishneti patu netre ca krishnah svaheti tarakam | haraye nama ityevam
    bhrulatam patu me sada || 15|| om govindaya svaheti nasikam patu sarvada | gopalaya namo gandau patu
    me sarvatah prabho || 16|| om namo gopanganeshaya karnau patu sada mama | om krishnaya namah shashvatpatu
    me'dharayugmakam || 17|| om govindaya svaheti dantaugham me sada'vatu | patu krishnaya danta'dho dantordhvam
    klim sada'vatu || 18|| om shrikrishnaya svaheti jihvikam patu me sada | raseshvaraya svaheti talukam
    patu me sada || 19|| radhikeshaya svaheti kantham patu sada mama | namo gopanganeshaya vakshah patu
    sada mama || 20|| om gopeshaya svaheti skandham patu sada mama | namah kishoraveshaya svaha prishtham
    sada'vatu || 21|| udaram patu me nityam mukundaya namah sada | aum hrim klim krishnaya svaha karau
    patu sada mama || 22|| om vishnave namo bahuyugmam patu sada mama | om hrim bhagavate svaha nakharam
    patu me sada || 23|| om namo narayanaya nakharandhram sada'vatu | aum hrim hrim padmanabhaya nabhim
    patu sada mama || 24|| om sarveshaya svaheti kapalam patu me sada | om gopiramanaya svaha nitambam
    patu me sada || 25|| om gopiramananathaya padau sada'vatu mama | om him klim rasikeshaya svaha sarvam
    sada'vatu || 26|| om keshavaya svaheti mama keshan sada'vatu | namah krishnaya svaheti brahmarandhram
    sada'vatu || 27|| om madhavaya svaheti me lomani sada'vatu | om hrim shrim radhikeshaya svaha sarvam
    sada'vatu || 28|| paripurnatamah krishnah pracyam mam sarvada'vatu | svayam golokanatho mamagneyyam
    dishi rakshatu || 29|| purnabrahmasvarupashca dakshine mam sada'vatu | nairrityam patu mam krishnah
    praticyam patu mam harih || 30|| govindah patu mam shashvadvayavyam dishi nityashah | uttare mam sada
    patu rasikanam shiromanih || 31|| aishanyam mam sada patu vrindavanaviharakrit | vrindavaniprananathah
    patu mamurdhvadeshatah || 32|| sadaiva madhavah patu balihari baladhikah | jale sthale cantarikshe
    nrisimhah patu mam sada || 33|| svapne jagarane shashvatpatu mam madhavah sada | sarvatma shrikrishnanarayano
    mam patu sarvatah || 34|| iti trailokyavijayam varmoktam te maha'dbhutam | kanthe va dakshine bahau
    dharanadvijayah sada || 35|| sa bhavet siddhakavaco dashalaksham japettu yah | dashamshahomah kartavyo
    yatheshtasiddhimicchata || 36|| om shrim namah shrikrishnaya paripurnatamaya svaha | siddhah syat
    pancalakshaistu mantrah saptadashaksharah || 37|| atha stotram sha
  devanagari: पञ्चाक्षरात्मकः ॥ १४॥ कृष्णेति पातु नेत्रे च कृष्णः स्वाहेति तारकम् । हरये नम इत्येवं भ्रूलतां
    पातु मे सदा ॥ १५॥ ॐ गोविन्दाय स्वाहेति नासिकां पातु सर्वदा । गोपालाय नमो गण्डौ पातु मे सर्वतः प्रभो
    ॥ १६॥ ॐ नमो गोपाङ्गनेशाय कर्णौ पातु सदा मम । ॐ कृष्णाय नमः शश्वत्पातु मेऽधरयुग्मकम् ॥ १७॥ ॐ गोविन्दाय
    स्वाहेति दन्तौघं मे सदाऽवतु । पातु कृष्णाय दन्ताऽधो दन्तोर्ध्वं क्लीं सदाऽवतु ॥ १८॥ ॐ श्रीकृष्णाय
    स्वाहेति जिह्विकां पातु मे सदा । रासेश्वराय स्वाहेति तालुकं पातु मे सदा ॥ १९॥ राधिकेशाय स्वाहेति कण्ठं
    पातु सदा मम । नमो गोपाङ्गनेशाय वक्षः पातु सदा मम ॥ २०॥ ॐ गोपेशाय स्वाहेति स्कन्धं पातु सदा मम । नमः
    किशोरवेशाय स्वाहा पृष्ठं सदाऽवतु ॥ २१॥ उदरं पातु मे नित्यं मुकुन्दाय नमः सदा । औं ह्रीं क्लीं कृष्णाय
    स्वाहा करौ पातु सदा मम ॥ २२॥ ॐ विष्णवे नमो बाहुयुग्मं पातु सदा मम । ॐ ह्रीं भगवते स्वाहा नखरं पातु
    मे सदा ॥ २३॥ ॐ नमो नारायणाय नखरन्ध्रं सदाऽवतु । औं ह्रीं ह्रीं पद्मनाभाय नाभिं पातु सदा मम ॥ २४॥ ॐ
    सर्वेशाय स्वाहेति कपालं पातु मे सदा । ॐ गोपीरमणाय स्वाहा नितम्बं पातु मे सदा ॥ २५॥ ॐ गोपीरमणनाथाय
    पादौ सदाऽवतु मम । ॐ हीं क्लीं रसिकेशाय स्वाहा सर्वं सदाऽवतु ॥ २६॥ ॐ केशवाय स्वाहेति मम केशान् सदाऽवतु
    । नमः कृष्णाय स्वाहेति ब्रह्मरन्ध्रं सदाऽवतु ॥ २७॥ ॐ माधवाय स्वाहेति मे लोमानि सदाऽवतु । ॐ ह्रीं श्रीं
    राधिकेशाय स्वाहा सर्वं सदाऽवतु ॥ २८॥ परिपूर्णतमः कृष्णः प्राच्यां मां सर्वदाऽवतु । स्वयं गोलोकनाथो
    मामाग्नेय्यां दिशि रक्षतु ॥ २९॥ पूर्णब्रह्मस्वरूपश्च दक्षिणे मां सदाऽवतु । नैरृत्यां पातु मां कृष्णः
    प्रतीच्यां पातु मां हरिः ॥ ३०॥ गोविन्दः पातु मां शश्वद्वायव्यां दिशि नित्यशः । उत्तरे मां सदा पातु
    रसिकानां शिरोमणिः ॥ ३१॥ ऐशान्यां मां सदा पातु वृन्दावनविहारकृत् । वृन्दावनीप्राणनाथः पातु मामूर्ध्वदेशतः
    ॥ ३२॥ सदैव माधवः पातु बलिहारी बलाधिकः । जले स्थले चान्तरिक्षे नृसिंहः पातु मां सदा ॥ ३३॥ स्वप्ने जागरणे
    शश्वत्पातु मां माधवः सदा । सर्वात्मा श्रीकृष्णनारायणो मां पातु सर्वतः ॥ ३४॥ इति त्रैलोक्यविजयं वर्मोक्तं
    ते महाऽद्भुतम् । कण्ठे वा दक्षिणे बाहौ धारणाद्विजयः सदा ॥ ३५॥ स भवेत् सिद्धकवचो दशलक्षं जपेत्तु यः
    । दशांशहोमः कर्तव्यो यथेष्टसिद्धिमिच्छता ॥ ३६॥ ॐ श्रीं नमः श्रीकृष्णाय परिपूर्णतमाय स्वाहा । सिद्धः
    स्यात् पञ्चलक्षैस्तु मन्त्रः सप्तदशाक्षरः ॥ ३७॥ अथ स्तोत्रं श
