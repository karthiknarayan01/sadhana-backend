id: gayatri-ashtottara-sata-namavali
category: stotram
name:
  english: Gayatri Ashtottara Sata Namavali
content:
  english: om tarunaditya sankashayai namah om sahasra nayanojjvalayai namah om vicitra malyabharanayai
    namah om tuhinacala vasinyai namah om varadabhaya hastabjayai namah om revatira nivasinyai namah om
    pranityaya visheshajnayai namah om yantrakrita virajitayai namah om bhadrapadapriyayai namah om govinda
    padagaminyai namah om devarshigana samstutyayai namah om vanamala vibhushitayai namah om syandanottama
    samsthanayai namah om dhirajimuta nisvanayai namah om mattamatanga gamanayai namah om hiranyakamalasanayai
    namah om dhijanadhara niratayai namah om yoginyai namah om yogadharinyai namah om natanatyaika niratayai
    namah om pranavadyaksharatmikayai namah om coracarakriyasaktayai namah om daridryacchedakarinyai namah
    om yadavendra kulodbhutayai namah om turiyapathagaminyai namah om gayatryai namah om gomatyai namah
    om gangayai namah om gautamyai namah om garudasanayai namah om geyaganapriyayai namah om gauryai namah
    om govindapada pujitayai namah om gandharva nagarakarayai namah om gauravarnayai namah om ganeshvaryai
    namah om gadashrayayai namah om gunavatyai namah om gahvaryai namah om ganapujitayai namah om gunatraya
    samayuktayai namah om gunatraya vivarjitayai namah om guhavasayai namah om gunadharayai namah om guhyayai
    namah om gandharvarupinyai namah om gargya priyayai namah om gurupadayai namah om guhyalinganga dharinyai
    namah om savitryai namah om suryatanayayai namah om sushumna nadibhedinyai namah om suprakashayai
    namah om sukhasinayai namah om sumatyai namah om surapujitayai namah om sushuptyavasthayai namah om
    sudatyai namah om sundaryai namah om sagarambarayai namah om sudhamshu bimbavadanayai namah om sustanyai
    namah om suvilocanayai namah om sitayai namah om sarvashrayayai namah om sandhyayai namah om suphalayai
    namah om sukhadayinyai namah om subhruve namah om sunasayai namah om sushronyai namah om samsararnavatarinyai
    namah om samagana priyayai namah om sadhvyai namah om sarvabharana pujitayai namah om vaishnavyai
    namah om vimalakarayai namah om mahendryai namah om mantrarupinyai namah om mahalakshmyai namah om
    mahasiddhyai namah om mahamayayai namah om maheshvaryai namah om mohinyai namah om madhusudana coditayai
    namah om minakshyai namah om madhuravasayai namah om nagendra tanayayai namah om umayai namah om trivikrama
    padakrantayai namah om trisvarayai namah om trilocanayai namah om suryamandala madhyasthayai namah
    om candramandala samsthitayai namah om vahnimandala madhyasthayai namah om vayumandala samsthitayai
    namah om vyomamandala madhyasthayai namah om cakrinyai namah om cakrarupinyai namah om kalacakra vitanasthayai
    namah om candramandala darpanayai namah om jyotsnatapanuliptangyai namah om mahamaruta vijitayai namah
    om sarvamantrashrayayai namah om dhenave namah om papaghnyai namah om parameshvaryai namah iti shrigayatryashtottarashatanamavalih
    sampurna |
  devanagari: ॐ तरुणादित्य सङ्काशायै नमः ॐ सहस्र नयनोज्ज्वलायै नमः ॐ विचित्र माल्याभरणायै नमः ॐ तुहिनाचल
    वासिन्यै नमः ॐ वरदाभय हस्ताब्जायै नमः ॐ रेवातीर निवासिन्यै नमः ॐ प्रणित्यय विशेषज्ञायै नमः ॐ यन्त्राकृत
    विराजितायै नमः ॐ भद्रपादप्रियायै नमः ॐ गोविन्द पदगामिन्यै नमः ॐ देवर्षिगण संस्तुत्यायै नमः ॐ वनमाला
    विभूषितायै नमः ॐ स्यन्दनोत्तम संस्थानायै नमः ॐ धीरजीमूत निस्वनायै नमः ॐ मत्तमातङ्ग गमनायै नमः ॐ हिरण्यकमलासनायै
    नमः ॐ धीजनाधार निरतायै नमः ॐ योगिन्यै नमः ॐ योगधारिण्यै नमः ॐ नटनाट्यैक निरतायै नमः ॐ प्रणवाद्यक्षरात्मिकायै
    नमः ॐ चोरचारक्रियासक्तायै नमः ॐ दारिद्र्यच्छेदकारिण्यै नमः ॐ यादवेन्द्र कुलोद्भूतायै नमः ॐ तुरीयपथगामिन्यै
    नमः ॐ गायत्र्यै नमः ॐ गोमत्यै नमः ॐ गङ्गायै नमः ॐ गौतम्यै नमः ॐ गरुडासनायै नमः ॐ गेयगानप्रियायै नमः
    ॐ गौर्यै नमः ॐ गोविन्दपद पूजितायै नमः ॐ गन्धर्व नगराकारायै नमः ॐ गौरवर्णायै नमः ॐ गणेश्वर्यै नमः ॐ
    गदाश्रयायै नमः ॐ गुणवत्यै नमः ॐ गह्वर्यै नमः ॐ गणपूजितायै नमः ॐ गुणत्रय समायुक्तायै नमः ॐ गुणत्रय
    विवर्जितायै नमः ॐ गुहावासायै नमः ॐ गुणाधारायै नमः ॐ गुह्यायै नमः ॐ गन्धर्वरूपिण्यै नमः ॐ गार्ग्य प्रियायै
    नमः ॐ गुरुपदायै नमः ॐ गुह्यलिङ्गाङ्ग धारिन्यै नमः ॐ सावित्र्यै नमः ॐ सूर्यतनयायै नमः ॐ सुषुम्ना नाडिभेदिन्यै
    नमः ॐ सुप्रकाशायै नमः ॐ सुखासीनायै नमः ॐ सुमत्यै नमः ॐ सुरपूजितायै नमः ॐ सुषुप्त्यवस्थायै नमः ॐ सुदत्यै
    नमः ॐ सुन्दर्यै नमः ॐ सागराम्बरायै नमः ॐ सुधांशु बिम्बवदनायै नमः ॐ सुस्तन्यै नमः ॐ सुविलोचनायै नमः
    ॐ सीतायै नमः ॐ सर्वाश्रयायै नमः ॐ सन्ध्यायै नमः ॐ सुफलायै नमः ॐ सुखदायिन्यै नमः ॐ सुभ्रुवे नमः ॐ सुनासायै
    नमः ॐ सुश्रोण्यै नमः ॐ संसारार्णवतारिण्यै नमः ॐ सामगान प्रियायै नमः ॐ साध्व्यै नमः ॐ सर्वाभरण पूजितायै
    नमः ॐ वैष्णव्यै नमः ॐ विमलाकारायै नमः ॐ महेन्द्र्यै नमः ॐ मन्त्ररूपिण्यै नमः ॐ महालक्ष्म्यै नमः ॐ
    महासिद्ध्यै नमः ॐ महामायायै नमः ॐ महेश्वर्यै नमः ॐ मोहिन्यै नमः ॐ मधुसूदन चोदितायै नमः ॐ मीनाक्ष्यै
    नमः ॐ मधुरावासायै नमः ॐ नगेन्द्र तनयायै नमः ॐ उमायै नमः ॐ त्रिविक्रम पदाक्रान्तायै नमः ॐ त्रिस्वरायै
    नमः ॐ त्रिलोचनायै नमः ॐ सूर्यमण्डल मध्यस्थायै नमः ॐ चन्द्रमण्डल संस्थितायै नमः ॐ वह्निमण्डल मध्यस्थायै
    नमः ॐ वायुमण्डल संस्थितायै नमः ॐ व्योममण्डल मध्यस्थायै नमः ॐ चक्रिण्यै नमः ॐ चक्ररूपिण्यै नमः ॐ कालचक्र
    वितानस्थायै नमः ॐ चन्द्रमण्डल दर्पणायै नमः ॐ ज्योत्स्नातपानुलिप्ताङ्ग्यै नमः ॐ महामारुत वीजितायै नमः
    ॐ सर्वमन्त्राश्रयायै नमः ॐ धेनवे नमः ॐ पापघ्न्यै नमः ॐ परमेश्वर्यै नमः इति श्रीगायत्र्यष्टोत्तरशतनामावलिः
    सम्पूर्णा ।
