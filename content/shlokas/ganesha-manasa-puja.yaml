id: ganesha-manasa-puja
category: stotram
name:
  english: Ganesha Manasa Puja
  devanagari: गणेशमानसपूजा २
content:
  english: raktambhodhisthapotollasadarunasarojadhirudham trinetram pasham caivankusham vai varadamabhayadam
    bahubhirdharayantam | shaktya yuktam gajasyam prithutarajatharam nagayajnopavitam devam candrardhacudam
    sakalabhayaharam vighnarajam namami || 1|| nanaratnavicitrakam ramanikam simhasanam kalpitam snanam
    jahnavivarina ganapate pitambaram grihyatam | kanthe mauktikamalika shrutiyuge dve dharite kundale
    nanaratnavirajito ravivibhayuktah kiritah shire || 2|| bhale carcitakesharam mrigamadamodankitam candanam
    nanavrikshasamudgatam sukusumam mandaradurvashamih | guggullodbhavadhupakam viracitam dipam tvadagre
    sthitam bhakshyam modakasamyutam ganapate kshirodanam grihyatam || 3|| tambulam manasa maya viracitam
    jambuphalam dakshinam sashtangam pranato'smi te mama kritam puja grihana prabho | me kamah satatam
    tavarcanavidhau buddhistavalingane sveccha te mukhadarshane ganapate bhaktistu padambuje || 4|| mata
    ganeshashca pita ganesho bhrata ganeshashca sakha ganeshah | vidya ganesho dravinam ganeshah svami
    ganeshah sharanam ganeshah || 5|| ito ganeshah parato ganeshah yato yato yami tato ganeshah | ganeshadevadaparam
    na kincit tasmat ganesham sharanam prapadye || 6|| bud|hdhya kritam vacanajam manasendriyairyad dehena
    jagritisushuptijasvapnajam yat | yadyacca karma hi maya sakalam parasmai gajananaya varadaya samarpaye
    tat || 7|| dehena vaca manasa kritan me samsargikan jagritasvapnajatan | saushuptatauryan sakalaparadhan
    kshamasva heramba dayanidhe tvam || 8|| dinanathadayanidhe suraganaih samsevyamana dvija - brahmeshanamahendrasheshagirijagandharvasiddhaih
    stuta | sarvarishtanivaranaikanipuna trailokyanatha prabho bhakti me saphalam kurushva sakalan kshantvaparadhan
    mama || 9||
  devanagari: रक्ताम्भोधिस्थपोतोल्लसदरुणसरोजाधिरूढं त्रिनेत्रं पाशं चैवाङ्कुशं वै वरदमभयदं बाहुभिर्धारयन्तम्
    । शक्त्या युक्तं गजास्यं पृथुतरजठरं नागयज्ञोपवीतं देवं चन्द्रार्धचूडं सकलभयहरं विघ्नराजं नमामि ॥ १॥
    नानारत्नविचित्रकं रमणिकं सिंहासनं कल्पितं स्नानं जाह्नविवारिणा गणपते पिताम्बरं गृह्यताम् । कण्ठे मौक्तिकमालिका
    श्रुतियुगे द्वे धारिते कुण्डले नानारत्नविराजितो रविविभायुक्तः किरीटः शिरे ॥ २॥ भाले चर्चितकेशरं मृगमदामोदाङ्कितं
    चन्दनं नानावृक्षसमुद्गतं सुकुसुमं मन्दारदूर्वाशमीः । गुग्गूल्लोद्भवधूपकं विरचितं दीपं त्वदग्रे स्थितं
    भक्ष्यं मोदकसंयुतं गणपते क्षीरोदनं गृह्यताम् ॥ ३॥ ताम्बूलं मनसा मया विरचितं जम्बूफलं दक्षिणां साष्टाङ्गं
    प्रणतोऽस्मि ते मम कृतां पूजा गृहाण प्रभो । मे कामः सततं तवार्चनविधौ बुद्धिस्तवालिङ्गने स्वेच्छा ते
    मुखदर्शने गणपते भक्तिस्तु पादाम्बुजे ॥ ४॥ माता गणेशश्च पिता गणेशो भ्राता गणेशश्च सखा गणेशः । विद्या
    गणेशो द्रविणं गणेशः स्वामी गणेशः शरणं गणेशः ॥ ५॥ इतो गणेशः परतो गणेशः यतो यतो यामि ततो गणेशः । गणेशदेवादपरं
    न किञ्चित् तस्मात् गणेशं शरणं प्रपद्ये ॥ ६॥ बुद्।ह्ध्या कृतं वचनजं मनसेन्द्रियैर्यद् देहेन जागृतिसुषुप्तिजस्वप्नजं
    यत् । यद्यच्च कर्म हि मया सकलं परस्मै गजाननाय वरदाय समर्पये तत् ॥ ७॥ देहेन वाचा मनसा कृतान् मे सांसर्गिकान्
    जागृतस्वप्नजातान् । सौषुप्ततौर्यान् सकलापराधान् क्षमस्व हेरम्ब दयानिधे त्वम् ॥ ८॥ दीनानाथदयानिधे सुरगणैः
    संसेव्यमान द्विज - ब्रह्मेशानमहेन्द्रशेषगिरिजागन्धर्वसिद्धैः स्तुत । सर्वारिष्टनिवारणैकनिपुण त्रैलोक्यनाथ
    प्रभो भक्ति मे सफलां कुरुष्व सकलान् क्षान्त्वापराधान् मम ॥ ९॥
