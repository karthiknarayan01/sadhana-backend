id: keshava-nama
category: stotram
name:
  english: Keshava Nama
content:
  english: isha ninna carana bhajanè ashèyinda maduvènu dosha rashi nasha madu shrisha keshava sharanu
    hòkkènayya ènna marana samayadalli ninna carana smaranè karunisayya narayana || || shodhisènna bhavada
    kalusha bodhisayya jnanavènagè badhisuva yamana badhè bidisu madhava || || hindaneka yonigalali bandu
    bandu nòndè nanu indu bhavada bandha bidisu tandè govindanè || || bhrashtanènisa beda krishna ishtu
    matra bedikòmbè shishtaròlagè ittu kashta bidisu vishnuvè || || mòdalu ninna pada pujè mudadi gaivènayya
    nanu hridayadòlagè òdagisayya madhusudana || || kavidukòndu iruva papa savèdu hoguvantè madi javana
    badhèyannu bidisò ghana trivikrama || || kamajanaka ninna nama premadinda paduvantha nemavènagè palisayya
    svami vamana || || madananayya ninna mahimè vadanadalli iruva hagè hridayadalli sadana madu mudadi
    shridhara || || husiyanadi hòttè hòrèva vishayadalli rasikanèndu husigè nanna hakadiro hrishikeshanè
    || || abdhiyòlagè biddu nanu òddukòmbènayya bhavadi gèddu popa buddhi torò padmanabhanè|| || kamakrodha
    bidisi ninna nama jihvèyòlagè nudisu shrimahanubhavanada damodara || || pankajaksha ninu ènna mankubuddhi
    bidisi ninna kinkaranna madikòllò sankarushana || || esu janma bandarenu dasanallavenò ninna ghasi
    madadiro ènna vasudevanè || || buddhi shunyanagi nanu kadda kallanadènayya tiddi hridaya shuddhi madò
    pradyumnanè || || janani janaka ninè èndu ènuvènayya dinabandhu ènagè mukti palisindu aniruddhanè
    || || harushadinda ninna nama smarisuvantè madu nema irisu caranadalli kshema purushottama || || sadhu
    sanga kòttu ninna padabhajakanènisu ènna bheda madi nodadiro adhokshaja || || carucarana tori ènagè
    paruganisayya kònègè bhara haki iruvè ninagè narasimhanè || || sancitartha papagalanu kincitadaruliyadantè
    muncitagi kalèdu pòrèyò svami acyuta || || jnana bhakti kòttu ninna dhyanadalli ittu ènna hina buddhi
    bidisò munna janardana || || japatapanushthana ninu òppuvantè madalilla tappa koti kshamisabeku upendranè
    || || mòrèyaniduvènayya ninagè sèrèya bidisu bhavada ènagè irisu bhaktaròlagè paramapurusha shrihare
    || || puttisale bedavinnu puttisidakè palisinnu ishtu bedikòmbè nanu shrikrishnanè || || satyavada
    namagalanu nityadalli pathisuvavara artiyinda kayadiranu kartri keshava || || marètu bidadè hariya
    nama barèdu odi keluvarigè karèdu mukti kòduva badadadikeshava ||
  devanagari: ईश निन्न चरण भजनॆ आशॆयिन्द माडुवॆनु दोष राशि नाश माडु श्रीश केशव शरणु हॊक्कॆनय्य ऎन्न मरण
    समयदल्लि निन्न चरण स्मरणॆ करुणिसय्य नारायण ॥ ॥ शोधिसॆन्न भवद कलुष बोधिसय्य ज्ञानवॆनगॆ बाधिसुवा यमन
    बाधॆ बिडिसु माधव ॥ ॥ हिन्दनेक योनिगललि बन्दु बन्दु नॊन्दॆ नानु इन्दु भवद बन्ध बिडिसु तन्दॆ गोविन्दनॆ
    ॥ ॥ भ्रष्टनॆनिस बेड कृष्ण इष्टु मात्र बेडिकॊम्बॆ शिष्टरॊलगॆ इट्टु कष्ट बिडिसु विष्णुवॆ ॥ ॥ मॊदलु निन्न
    पाद पूजॆ मुददि गैवॆनय्य नानु हृदयदॊलगॆ ऒदगिसय्य मधुसूदन ॥ ॥ कविदुकॊण्डु इरुव पाप सवॆदु होगुवन्तॆ माडि
    जवन बाधॆयन्नु बिडिसॊ घन त्रिविक्रम ॥ ॥ कामजनक निन्न नाम प्रेमदिन्द पाडुवन्थ नेमवॆनगॆ पालिसय्य स्वामि
    वामन ॥ ॥ मदननय्य निन्न महिमॆ वदनदल्लि इरुव हागॆ हृदयदल्लि सदन माडु मुददि श्रीधर ॥ ॥ हुसियनाडि हॊट्टॆ
    हॊरॆव विषयदल्लि रसिकनॆन्दु हुसिगॆ नन्न हाकदिरो हृषिकेशनॆ ॥ ॥ अब्धियॊलगॆ बिद्दु नानु ऒद्दुकॊम्बॆनय्य
    भवदि गॆद्दु पोप बुद्धि तोरॊ पद्मनाभनॆ॥ ॥ कामक्रोध बिडिसि निन्न नाम जिह्वॆयॊलगॆ नुडिसु श्रीमहानुभावनाद
    दामोदर ॥ ॥ पङ्कजाक्ष नीनु ऎन्न मङ्कुबुद्धि बिडिसि निन्न किङ्करन्न माडिकॊल्लॊ सङ्करुषण ॥ ॥ एसु जन्म
    बन्दरेनु दासनल्लवेनॊ निन्न घासि माडदिरो ऎन्न वासुदेवनॆ ॥ ॥ बुद्धि शून्यनागि नानु कद्द कल्लनादॆनय्य
    तिद्दि हृदय शुद्धि माडॊ प्रद्युम्ननॆ ॥ ॥ जननि जनक नीनॆ ऎन्दु ऎनुवॆनय्य दीनबन्धु ऎनगॆ मुक्ति पालिसिन्दु
    अनिरुद्धनॆ ॥ ॥ हरुषदिन्द निन्न नाम स्मरिसुवन्तॆ माडु नेम इरिसु चरणदल्लि क्षेम पुरुषोत्तम ॥ ॥ साधु
    सङ्ग कॊट्टु निन्न पादभजकनॆनिसु ऎन्न भेद माडि नोडदिरो अधोक्षज ॥ ॥ चारुचरण तोरि ऎनगॆ पारुगाणिसय्य कॊनॆगॆ
    भार हाकि इरुवॆ निनगॆ नारसिंहनॆ ॥ ॥ सञ्चितार्थ पापगलनु किञ्चितादरुलियदन्तॆ मुञ्चितागि कलॆदु पॊरॆयॊ
    स्वामि अच्युत ॥ ॥ ज्ञान भक्ति कॊट्टु निन्न ध्यानदल्लि इट्टु ऎन्न हीन बुद्धि बिडिसॊ मुन्न जनार्दन ॥
    ॥ जपतपानुष्ठान नीनु ऒप्पुवन्तॆ माडलिल्ल तप्प कोटि क्षमिसबेकु उपेन्द्रनॆ ॥ ॥ मॊरॆयनिडुवॆनय्य निनगॆ
    सॆरॆय बिडिसु भवद ऎनगॆ इरिसु भक्तरॊलगॆ परमपुरुष श्रीहरे ॥ ॥ पुट्टिसले बेडविन्नु पुट्टिसिदकॆ पालिसिन्नु
    इष्टु बेडिकॊम्बॆ नानु श्रीकृष्णनॆ ॥ ॥ सत्यवाद नामगलनु नित्यदल्लि पठिसुववर अर्तियिन्द कायदिरनु कर्तृ
    केशव ॥ ॥ मरॆतु बिडदॆ हरिय नाम बरॆदु ओदि केलुवरिगॆ करॆदु मुक्ति कॊडुव बाडदादिकेशव ॥
