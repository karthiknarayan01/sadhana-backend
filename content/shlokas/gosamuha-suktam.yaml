id: gosamuha-suktam
category: sukta
name:
  english: gosamuha suktam
  devanagari: गोसमूह सूक्तम्
content:
  english: 4 jagati a gavo̭ agmannu̱ta bha̱drama̭kra̱ntsida̭ntu go̱shthe ra̱naya̭ntva̱sme | pra̱java̭tih
    puru̱rupa̭ i̱ha syu̱rindra̭ya pu̱rviru̱shaso̱ duha̭nah || 1|| indro̱ yajva̭ne grinate ca shiksha̭ta
    upedda̭dati na svam mṷshayati | bhuyo̭bhuyo ra̱yimida̭sya va̱rdha̭yannabhi̱nne khi̱lye ni da̭dhati
    deva̱yum || 2|| na ta na̭shanti̱ na da̭bhati̱ taska̭ro nasa̭mami̱tro vya̱thira da̭dharshati | de̱vamshca̱
    yabhi̱ryaja̭te̱ dada̭ti ca̱ jyogittabhi̭h sacate̱ gopa̭tih sa̱ha || 3|| na ta arva̭ re̱nuka̭kato'shnute̱
    na sa̭mskrita̱tramupa̭ yanti̱ ta a̱bhi | u̱ru̱ga̱yamabha̭yam tasya̱ ta anu̱ gavo̱ marta̭sya̱ vi ca̭ranti̱
    yajva̭nah || 4|| gavo̱ bhago̱ gava̱ indro̭ ma iccha̱dgava̱h soma̭sya pratha̱masya̭ bha̱kshah | i̱ma
    ya gava̱h sa ja̭nasa̱ indra̭ i̱cchami̭ hri̱da mana̭sa ci̱dindra̭m || 5|| yu̱yam ga̭vo medayatha kri̱sham
    ci̭dashri̱ram ci̭tkrinutha su̱prati̭kam | bha̱dram gri̱ham kri̭nutha bhadravaco bri̱hadvo̱ vaya̭ ucyate
    sa̱bhasṷ || 6|| pra̱java̭tih su̱yava̭se ru̱shanti̭h shu̱ddha a̱pah sṷprapa̱ne piba̭ntih | ma va̭
    ste̱na i̭shata̱ maghasha̭msa̱h pari̭ vo ru̱drasya̭ he̱tirvri̭naktu || 7|| gosuktam svararahitam mata
    rudranam duhita vasunam svasadityanamamritasya nabhih | pra nu vocam cikitushe janaya ma gamanagamaditim
    vadhishta || rigveda 8
  devanagari: ४ जगति आ गावो॑ अग्मन्नु॒त भ॒द्रम॑क्र॒न्त्सीद॑न्तु गो॒ष्ठे र॒णय॑न्त्व॒स्मे । प्र॒जाव॑तीः
    पुरु॒रूपा॑ इ॒ह स्यु॒रिन्द्रा॑य पू॒र्वीरु॒षसो॒ दुहा॑नाः ॥ १॥ इन्द्रो॒ यज्व॑ने गृणते च शिक्ष॑त उपेद्द॑दाति
    न स्वं मु॑षायति । भूयो॑भूयो र॒यिमिद॑स्य व॒र्ध॑यन्नभि॒न्ने खि॒ल्ये नि द॑धाति देव॒युम् ॥ २॥ न ता न॑शन्ति॒
    न द॑भाति॒ तस्क॑रो नासा॑मामि॒त्रो व्य॒थिरा द॑धर्षति । दे॒वांश्च॒ याभि॒र्यज॑ते॒ ददा॑ति च॒ ज्योगित्ताभिः॑
    सचते॒ गोप॑तिः स॒ह ॥ ३॥ न ता अर्वा॑ रे॒णुक॑काटोऽश्नुते॒ न सं॑स्कृत॒त्रमुप॑ यन्ति॒ ता अ॒भि । उ॒रु॒गा॒यमभ॑यं
    तस्य॒ ता अनु॒ गावो॒ मर्त॑स्य॒ वि च॑रन्ति॒ यज्व॑नः ॥ ४॥ गावो॒ भगो॒ गाव॒ इन्द्रो॑ म इच्छा॒द्गावः॒ सोम॑स्य
    प्रथ॒मस्य॑ भ॒क्षः । इ॒मा या गावः॒ स ज॑नास॒ इन्द्र॑ इ॒च्छामि॑ हृ॒दा मन॑सा चि॒दिन्द्र॑म् ॥ ५॥ यू॒यं
    गा॑वो मेदयथ कृ॒शं चि॑दश्री॒रं चि॑त्कृणुथा सु॒प्रती॑कम् । भ॒द्रं गृ॒हं कृ॑णुथ भद्रवाचो बृ॒हद्वो॒ वय॑
    उच्यते स॒भासु॑ ॥ ६॥ प्र॒जाव॑तीः सू॒यव॑से रु॒शन्तीः॑ शु॒द्धा अ॒पः सु॑प्रपा॒णे पिब॑न्तीः । मा व॑ स्ते॒न
    ई॑शत॒ माघशं॑सः॒ परि॑ वो रु॒द्रस्य॑ हे॒तिर्वृ॑णक्तु ॥ ७॥ गोसूक्तं स्वररहितम् माता रुद्राणां दुहिता
    वसूनां स्वसादित्यानाममृतस्य नाभिः । प्र नु वोचं चिकितुषे जनाय मा गामनागामदितिं वधिष्ट ॥ ऋग्वेद ८
