id: saraswati-prarthana-ghanapatham
category: stotram
name:
  english: Saraswati Prarthana Ghanapatham
content:
  english: prano nah praprano devi devi nah praprano devi | no devi devi nono devi sarasvati sarasvati
    devi no no devi sarasvati || devi sarasvati sarasvati devi devi sarasvati vajebhirvajebhi ssarasvati
    devi devi sarasvati vajebhih || sarasvati vajebhi rvajebhi ssarasvati sarasvati vajebhi rvajinivati
    vahinivati vajebhi ssarasvati sarasvati vajebhi rvajinivati || vajebhirvajinivati vajinivati vajebhirvajebhirvajinivati
    | vajinivatiti vajini vati || dhina mavitryavitri dhina ndhinamavitrya vatva vatvavitri dhina ndhinamavitryavatu
    | avitryavatvava tvavitryavi tryavatu | avatvityavatu ||
  devanagari: प्रणो॑ नः॒ प्रप्रणो॑ दे॒वी दे॒वी नः॒ प्रप्रणो॑ दे॒वी । नो॒ दे॒वी दे॒वी नो॑नो दे॒वी सर॑स्वती॒
    सर॑स्वती दे॒वी नो॑ नो दे॒वी सर॑स्वती ॥ दे॒वी सर॑स्वती॒ सर॑स्वती दे॒वी दे॒वी सर॑स्वती॒ वाजे॒भि॒र्वाजे॑भि॒
    स्सर॑स्वती दे॒वी दे॒वी सर॒स्वती॒ वाजे॑भिः ॥ सर॑स्वती॒ वाजे॑भि॒ र्वाजे॑भि॒ स्सर॑स्वती॒ सर॑स्वती॒ वाजे॑भि
    र्वा॒जिनी॑वती वा॒हिनी॑वती॒ वाजे॑भि॒ स्सर॑स्वती॒ सर॑स्वती॒ वाजे॑भि र्वा॒जिनी॑वती ॥ वाजे॑भिर्वा॒जिनी॑वती
    वा॒जिनी॑वती॒ वाजे॑भि॒र्वाजे॑भिर्वा॒जिनी॑वती । वा॒जिनी॑व॒तीति॑ वा॒जिनी॑ व॒ती॒ ॥ धी॒ना म॑वि॒त्र्य॑वि॒त्री
    धी॒ना न्धी॒नाम॑वि॒त्र्य॑ वत्व वत्ववि॒त्री धी॒ना न्धी॒नाम॑वि॒त्र्य॑वतु । अ॒वि॒त्र्य॑वत्वव त्ववि॒त्र्य॑वि॒
    त्र्य॑वतु । अ॒व॒त्वित्य॑वतु ॥
