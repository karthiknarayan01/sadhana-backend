id: ramarakshastotram
category: stotram
name:
  english: ramarakshastotram
  devanagari: रामरक्षास्तोत्रम्
content:
  english: ramarakshastotram shribudhakaushika ramarakshastotram shribudhakaushika ramarakshastotram om
    shriganeshaya namah | asya shriramarakshastotramantrasya | budhakaushikarishih | shrisitaramacandro
    devata | anushthup chndah | sita shaktih | shrimaddhanuman kilakam | shriramacandraprityarthe jape
    viniyogah | atha dhyanam | dhyayedajanubahum dhrutasharadhanusham badadhapadmasanastam | pitam vaso
    vasanam navakamaladalaspardhinetram prasannam | vamankarudhasita mukhakamalamilallocanam niradabham
    | nanalankaradiptam dadhatamurujatamandanam ramacandram || iti dhyanam | caritam raghunathasya shatakotipravistaram
    | ekaikamaksharam pumsam mahapatakanashanam ||1|| dhyatva nilotpalashyamam ramam rajivalocanam | janakilakshmanopetam
    jatamukutamanditam ||2|| sasitunadhanurbanapanim naktamcarantakam | svalilaya jagatatratubhavirbhutamajam
    vibhum ||3|| ramaraksham pathet prajnah papanghim sarvakamadam | shiro me raghavah patu bhalam dasharathatmajah
    ||4|| kausalyeyo dhrushau patu vishvamitrapriyah shruti | ghranam patu makhatrata mukham saumitrivatsalah
    ||5|| jivham vidyanidhih patu kantham bharatavanditah | skandhau divyayudhah patu bhujau bhagneshakarmukah
    ||6|| karau sitapatih patu hrdayam jamadagnyajit | madhyam patu kharadhvamsi nabhim jambavadashrayah
    ||7|| sugriveshah kati patu sakthini hanumatprabhuh | uru raghuttamah patu rakshahkulavinashakrit
    ||8|| januni setukritpatu jamghe dashamukhantakah | padau bibhishanashridah patu ramo'khilam vapuh
    ||9|| etam ramabalopetam raksham yah sukriti pathet | sa cirayuh sukhi putri vijayi vinayi bhavet
    ||10|| patalabhutalavyomacarinashchadmacarinah | na drashtumapi shaktaste rakshitam ramanamabhih ||11||
    rameti ramabhadreti ramacandreti va smaran | naro na lipyate papairbhuktim muktim ca vindati ||12||
    jagajjaitraikamantrena ramanamabhirakshitam | yah kanthe dharayettasya karasthah sarvasiddhayah ||13||
    vajrapanjaranamedam yo ramakavacam smaret | avyahatajnah sarvatra labhate jayamangalam ||14|| adishtavan
    yatha svapne ramarakshamimam harah | tatha likhitavan pratah prabuddho budhakaushikah ||15|| aramah
    kalpavrikshanam viramah sakalapadam | abhiramastrilokanam ramah shriman sa nah prabhuh ||16|| tarunau
    rupasampannau sukumarau mahabalau | pundarikavishalakshau cirakrishnajinambarau ||17|| falamulashinau
    dantau tapasau bramhacarinau | putrau dasharathasyaitau bhratarau ramalakshmanau ||18|| sharanyau
    sarvasattvanam shreshthau sarvadhanushmatam | rakshah kulanihantarau trayetam no raghuttamau ||19||
    attasajyadhanushavishusprishavakshayashuganishadgasadginau | rakshanayamama ramalakshmanavagratah
    pathi sadaiva gacchatam ||20|| samnaddhah kavaci khadgi capabanodharo yuva | gacchn manoratho'smakam
    ramah patu salakshmanah ||21|| ramo dasharathih shuro lakshmananucaro bali | kakutsthah purushah purnah
    kausalyeyo raghuttamah ||22|| vedantavedyo yajneshah puranapurushottamah | janakivallabhah shrimanaprameyaparakramah
    ||23|| ityetani japan nityam madbhaktah shraddhayanvitah | ashvamedhadhikam punyam samprapnoti na
    samshayah ||24|| ramam durvadalashyamam padmaksham pitavasasam | stuvanti namabhirdivyaih na te samsarino
    narah ||25|| ramam lakshmanapurvajam raghuvaram sitapatim sundaram | kakutstham karunarnavam gunanidhim
    viprapriyam dharmikam | rajendram satyasandham dasharathanayam shyamalam shantamurtim | vande lokabhiramam
    raghukulatilakam raghavam ravanarim ||26|| ramaya ramabhadraya ramacamdraya vedhase | raghunathaya
    nathaya sitayah pataye namah ||27|| shrirama rama raghunandana rama rama | shrirama rama bharatagraja
    rama rama | shrirama rama ranakarkasha rama rama | shrirama rama sharanam bhava rama rama ||28|| shriramacandracaranau
    manasa smarami | shriramacandracaranau vacasa grinami | shriramacandracaranau shirasa namami | shriramacandracaranau
    sharanam prapadye ||29|| mata ramo matpita ramacandrah | svami ramo matsakha ramacandrah | sarvasvam
    me ramacandro dayaluh nanyam | jane naiva jane na jane ||30|| dakshine lakshmano yasya vame tu janakatmaja
    | purato marutiryasya tam vande raghunandanam ||31|| lokabhiramam ranarangadhiram rajivanetram raghuvamshanatham
    | karunyarupam karunakaram tam shriramacandram sharanam prapadye||32|| manojavam marutatulyavegam
    | jitedriyam duddhimatam varishtham | vatatmajam vanarayuthamukhyam | shriramadutam sharanam prapadye
    ||33|| kujantam ramarameti madhuram madhuraksharam aruhya kavitashakham vande valmikikokilam ||34||
    apadamapahartaram dataram sarvasampadam | lokabhiramam shriramam bhuyo bhuyo namamyaham ||35|| bharjanam
    bhavabijanamarjanam sukhasampadam | tarjanam yamadutanam ramarameti garjanam ||36|| ramo rajamani
    sada vijayate ramam ramesham bhaje | ramenabhihata nishacaracamu ramaya tasmai namah | ramannasti
    parayanam parataram ramasya daso'smayam | rame cittalayah sada bhavatu bho rama mamuddhara ||37||
    ramanameti rameti rame rame manorame | sahasranama tattulyam ramanama varanane ||38|| iti shribudhakaushikaviracitam
    shriramarakshastotram sampurnam |
  devanagari: रामरक्षास्तोत्रम् श्रीबुधकौशिक रामरक्षास्तोत्रम् श्रीबुधकौशिक रामरक्षास्तोत्रम् ॐ श्रीगणेशाय
    नमः । अस्य श्रीरामरक्षास्तोत्रमन्त्रस्य । बुधकौशिकऋषिः । श्रीसीतारामचन्द्रो देवता । अनुष्ठुप् छ्न्दः
    । सीता शक्तिः । श्रीमद्धनुमान् कीलकम् । श्रीरामचन्द्रप्रित्यर्थे जपे विनियोगः । अथ ध्यानम् । ध्यायेदाजानुबाहुं
    ध्रुतशरधनुषं बदधपद्मासनस्तं । पीतं वासो वसानं नवकमलदलस्पर्धिनेत्रं प्रसन्नम् । वामाङ्कारुढसीता मुखकमलमिलल्लोचनं
    नीरदाभं । नानालङ्कारदीप्तं दधतमुरुजटामण्डनं रामचन्द्रम् ॥ इति ध्यानम् । चरितं रघुनाथस्य शतकोटिप्रविस्तरम्
    । एकैकमक्षरम् पुंसां महापातकनाशनम् ॥१॥ ध्यात्वा नीलोत्पलश्यामं रामं राजीवलोचनम् । जानकीलक्ष्मणोपेतं
    जटामुकुटमण्डितम् ॥२॥ सासितूणधनुर्बाणपाणिं नक्तंचरान्तकम् । स्वलीलया जगतत्रातुभाविर्भूतमजं विभुम् ॥३॥
    रामरक्षां पठेत् प्राज्ञः पापन्घीं सर्वकामदाम् । शिरो मे राघवः पातु भालं दशरथात्मजः ॥४॥ कौसल्येयो ध्रुशौ
    पातु विश्वामित्रप्रियः श्रुती । घ्राणं पातु मखत्राता मुखं सौमित्रिवत्सलः ॥५॥ जिव्हां विद्यानिधिः पातु
    कण्ठं भरतवन्दितः । स्कन्धौ दिव्यायुधः पातु भुजौ भग्नेशकार्मुकः ॥६॥ करौ सितापतिः पातु ह्र्दयं जामदग्न्यजित्
    । मध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः ॥७॥ सुग्रीवेशः कटी पातु सक्थिनी हनुमत्प्रभुः । ऊरू रघूत्तमः
    पातु रक्षःकुलविनाशकृत् ॥८॥ जानुनी सेतुकृत्पातु जंघे दशमुखान्तकः । पादौ बिभीषणश्रीदः पातु रामोऽखिलं
    वपुः ॥९॥ एतां रामबलोपेतां रक्षां यः सुकृती पठेत् । स चिरायुः सुखी पुत्री विजयी विनयी भवेत् ॥१०॥ पातालभूतलव्योमचारिणश्छद्मचारिणः
    । न द्रष्टुमपि शक्तास्ते रक्षितं रामनामभिः ॥११॥ रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् । नरो न लिप्यते
    पापैर्भुक्तिं मुक्तिं च विन्दति ॥१२॥ जगज्जैत्रैकमन्त्रेण रामनामाभिरक्षितम् । यः कण्ठे धारयेत्तस्य
    करस्थाः सर्वसिद्धयः ॥१३॥ वज्रपञ्जरनामेदं यो रामकवचं स्मरेत् । अव्याहताज्ञः सर्वत्र लभते जयमङ्गलम्
    ॥१४॥ आदिष्टवान् यथा स्वप्ने रामरक्षामिमां हरः । तथा लिखितवान् प्रातः प्रबुद्धो बुधकौशिकः ॥१५॥ आरामः
    कल्पवृक्षाणां विरामः सकलापदाम् । अभिरामस्त्रिलोकानां रामः श्रीमान् स नः प्रभुः ॥१६॥ तरुणौ रूपसंपन्नौ
    सुकुमारौ महाबलौ । पुण्डरीकविशालाक्षौ चीरकृष्णाजिनाम्बरौ ॥१७॥ फ़लमूलाशिनौ दान्तौ तापसौ ब्रम्हचारिणौ
    । पुत्रौ दशरथस्यैतौ भ्रातरौ रामलक्ष्मणौ ॥१८॥ शरण्यौ सर्वसत्त्वानां श्रेष्ठौ सर्वधनुष्मताम् । रक्षः
    कुलनिहन्तारौ त्रायेतां नो रघूत्तमौ ॥१९॥ आत्तसज्यधनुषाविषुस्पृशावक्षयाशुगनिषड्गसड्गिनौ । रक्षणायमम
    रामलक्ष्मणावग्रतः पथि सदैव गच्छताम् ॥२०॥ संनद्धः कवची खड्गी चापबाणोधरो युवा । गच्छ्न् मनोरथोऽस्माकं
    रामः पातु सलक्ष्मणः ॥२१॥ रामो दाशरथिः शूरो लक्ष्मणानुचरो बली । काकुत्स्थः पुरुषः पूर्णः कौसल्येयो
    रघूत्तमः ॥२२॥ वेदान्तवेद्यो यज्ञेशः पुराणपुरुषोत्तमः । जानकीवल्लभः श्रीमानप्रमेयपराक्रमः ॥२३॥ इत्येतानि
    जपन् नित्यं मद्भक्तः श्रद्धयान्वितः । अश्वमेधाधिकं पुण्यं संप्राप्नोति न संशयः ॥२४॥ रामं दूर्वादलश्यामं
    पद्माक्षं पीतवाससम् । स्तुवन्ति नामभिर्दिव्यैः न ते संसारिणो नरः ॥२५॥ रामं लक्ष्मणपूर्वजं रघुवरं सीतापतिं
    सुन्दरं । काकुत्स्थं करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम् । राजेन्द्रं सत्यसन्धं दशरथनयं श्यामलं
    शान्तमूर्तिं । वन्दे लोकाभिरामं रघुकुलतिलकं राघवं रावणारिम् ॥२६॥ रामाय रामभद्राय रामचंद्राय वेधसे
    । रघुनाथाय नाथाय सीतायाः पतये नमः ॥२७॥ श्रीराम राम रघुनन्दन राम राम । श्रीराम राम भरताग्रज राम राम
    । श्रीराम राम रणकर्कश राम राम । श्रीराम राम शरणं भव राम राम ॥२८॥ श्रीरामचन्द्रचरणौ मनसा स्मरामि ।
    श्रीरामचन्द्रचरणौ वचसा गृणामि । श्रीरामचन्द्रचरणौ शिरसा नमामि । श्रीरामचन्द्रचरणौ शरणं प्रपद्ये ॥२९॥
    माता रामो मत्पिता रामचन्द्रः । स्वामि रामो मत्सखा रामचन्द्रः । सर्वस्वं मे रामचन्द्रो दयालुः नान्यं
    । जाने नैव जाने न जाने ॥३०॥ दक्षिणे लक्ष्मणो यस्य वामे तु जनकात्मजा । पुरतो मारुतिर्यस्य तं वन्दे
    रघुनन्दनम् ॥३१॥ लोकाभिरामं रणरङ्गधीरं राजीवनेत्रं रघुवंशनाथम् । कारुण्यरूपं करुणाकरं तं श्रीरामचन्द्रं
    शरणं प्रपद्ये॥३२॥ मनोजवं मारुततुल्यवेगं । जितेद्रियं दुद्धिमतां वरिष्ठं । वातात्मजं वानरयूथमुख्यं
    । श्रीरामदूतं शरणं प्रपद्ये ॥३३॥ कूजन्तं रामरामेति मधुरं मधुराक्षरम् आरुह्य कविताशाखां वन्दे वाल्मीकिकोकिलम्
    ॥३४॥ आपदामपहर्तारं दातारं सर्वसंपदाम् । लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥३५॥ भर्जनं भवबीजानामर्जनं
    सुखसंपदाम् । तर्जनं यमदूतानां रामरामेति गर्जनम् ॥३६॥ रामो राजमणि सदा विजयते रामं रमेशं भजे । रामेणाभिहता
    निशाचरचमू रामाय तस्मै नमः । रामान्नास्ति परायणं परतरं रामस्य दासोऽस्मयं । रामे चित्तलयः सदा भवतु भो
    राम मामुद्धर ॥३७॥ रामनामेति रामेति रमे रामे मनोरमे । सहस्रनाम तत्तुल्यं रामनाम वरानने ॥३८॥ इति श्रीबुधकौशिकविरचितं
    श्रीरामरक्षास्तोत्रं सम्पूर्णम् ।
