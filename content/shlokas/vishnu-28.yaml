id: vishnu-28
category: stotram
name:
  english: vishnu 28
  devanagari: विष्नु २८
content:
  english: shrivishnorashtavimshatinamastotram arjuna uvaca kim nu nama sahasrani japate ca punah punah
    | yani namani divyani tani cacakshva keshava || 1|| shribhagavanuvaca matsyam kurmam varaham ca vamanam
    ca janardanam | govindam pundarikaksham madhavam madhusudanam || 2|| padmanabham sahasraksham vanamalim
    halayudham | govardhanam hrishikesham vaikuntham purushottamam || 3|| vishvarupam vasudevam ramam
    narayanam harim | damodaram shridharam ca vedangam garudadhvajam || 4|| anantam krishnagopalam japato
    nasti patakam | gavam kotipradanasya ashvamedhashatasya ca || 5|| kanyadanasahasranam phalam prapnoti
    manavah | amayam va paurnamasyamekadashyam tathaiva ca || 6|| sandhyakale smarennityam pratahkale
    tathaiva ca | madhyahne ca japannityam sarvapapaih pramucyate || 7|| | iti shrikrishnarjunasamvade
    shrivishnorashtavimshatinamastotram sampurnam |
  devanagari: श्रीविष्णोरष्टाविंशतिनामस्तोत्रम् अर्जुन उवाच किं नु नाम सहस्राणि जपते च पुनः पुनः । यानि
    नामानि दिव्यानि तानि चाचक्ष्व केशव ॥ १॥ श्रीभगवानुवाच मत्स्यं कूर्मं वराहं च वामनं च जनार्दनम् । गोविन्दं
    पुण्डरीकाक्षं माधवं मधुसूदनम् ॥ २॥ पद्मनाभं सहस्राक्षं वनमालिं हलायुधम् । गोवर्धनं हृषीकेशं वैकुण्ठं
    पुरुषोत्तमम् ॥ ३॥ विश्वरूपं वासुदेवं रामं नारायणं हरिम् । दामोदरं श्रीधरं च वेदाङ्गं गरुडध्वजम् ॥
    ४॥ अनन्तं कृष्णगोपालं जपतो नास्ति पातकम् । गवां कोटिप्रदानस्य अश्वमेधशतस्य च ॥ ५॥ कन्यादानसहस्राणां
    फलं प्राप्नोति मानवः । अमायां वा पौर्णमास्यामेकादश्यां तथैव च ॥ ६॥ सन्ध्याकाले स्मरेन्नित्यं प्रातःकाले
    तथैव च । मध्याह्ने च जपन्नित्यं सर्वपापैः प्रमुच्यते ॥ ७॥ । इति श्रीकृष्णार्जुनसंवादे श्रीविष्णोरष्टाविंशतिनामस्तोत्रं
    सम्पूर्णम् ।
