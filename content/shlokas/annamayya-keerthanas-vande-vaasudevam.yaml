id: annamayya-keerthanas-vande-vaasudevam
category: stotram
name:
  english: Annamayya Keerthanas Vande Vaasudevam
content:
  english: pallavi vande vasudevam brindarakadhisha vandita padabjam || indivara shyama mindira kucatati
    candanankita lasatcaru deham | mandara malika makuta samshobhitam kandarpajanaka maravindanabham ||
    vande vasudevam brindarakadhisha dhagadhaga kaustubha dharana vakshasthalam khagaraja vahanam kamalanayanam
    | nigamadisevitam nijarupasheshapa nnagaraja shayinam ghananivasam || vande vasudevam brindarakadhisha
    caranam karipuranatha samrakshane tatparam karirajavarada sangatakarabjam | sarasiruhananam cakravibhrajitam
    tiru venkatacaladhisham bhaje || vande vasudevam brindarakadhisha vandita padabjam ||
  devanagari: पल्लवि वन्दे वासुदेवं बृन्दारकाधीश वन्दित पदाब्जं ॥ इन्दीवर श्याम मिन्दिरा कुचतटी चन्दनाङ्कित
    लसत्चारु देहं । मन्दार मालिका मकुट संशोभितं कन्दर्पजनक मरविन्दनाभं ॥ वन्दे वासुदेवं बृन्दारकाधीश धगधग
    कौस्तुभ धरण वक्षस्थलं खगराज वाहनं कमलनयनं । निगमादिसेवितं निजरूपशेषप न्नगराज शायिनं घननिवासं ॥ वन्दे
    वासुदेवं बृन्दारकाधीश चरणं करिपुरनाथ संरक्षणे तत्परं करिराजवरद सङ्गतकराब्जं । सरसीरुहाननं चक्रविभ्राजितं
    तिरु वेङ्कटाचलाधीशं भजे ॥ वन्दे वासुदेवं बृन्दारकाधीश वन्दित पदाब्जं ॥
