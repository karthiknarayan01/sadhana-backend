id: kytb-2-8-kamyapashu-yajyanuvakya-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-pivonnam-rayivrudhah
category: stotram
name:
  english: KYTB 2.8 Kamyapashu Yajyanuvakya Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha -
    Pivonnam Rayivrudhah
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake ashtamah prapathakah kamyapashuyajyanuvakya
    brahmanam o shri gurubhyo namah | harih om || anuvakam vayavyadipashunam suktani pivo nnagm rayivridhah
    sumedhah | shveta ssishakti niyutamabhishrih | te vayave samanaso vitasthuh | vishvennarah svapatyani
    cakruh || raye njajnatu rodasi ubhe | raye devi dhishana dhati devam | adha vayu nniyutah sashcata
    svah | uta shvetam nnireke || a vayo bhusha shucipa upa na nte niyuto vishvavara | upo te andho madyamayami
    yasya deva dadhishe pu m || pra yabhiryasi dashvagm samaccha niyudbhi rvayavishtaye durone | ni no
    rayigm subhojasam nca radhah |||| pra vayumaccha brihati manisha || vi~shvavaragm rathapram | dyutadyama
    niyutah patyamanah | kavih kavimiyakshasi prayajyo || a no niyudbhih shatinibhi raddhvaram | sahasrinibhirupa
    yahi yajnam | vayo asmin havishi madayasva | yuya ssada nah || prajapate na tvadetanyanyah | vishva
    jatani pari ta babhuva | ya tkamaste juhumastanno astu || syama patayo rayinam || rayina m | asminbhare
    nritamam va~jasatau | prajapati mprathamajamritasya | yajama devamadhi no bravitu || prajapate tva
    nnidhipah puranah | devana mpita janita prajana rvishvasya jagatah paraspah | havirno deva vihave
    jushasva || taveme lokah pradisho dishashca || || paravato nivata udvatashca | prajapate vishvasrijjivadhanya
    ida nno deva | pratiharya havyam || prajapati ya~jniyanam | devanamagre yajatam ya~jaddhvam | sa no
    dadatu dravinagm suvirya vi~shyatu nabhimasme || yo raya ishe shatadaya ukthyah | yah pashunagm rakshita
    vishthitanam | prajapatih prathamaja ritasya || || sahasradhama jushatagm havirnah || somapushana
    janana rayina njanana divo janana prithivyah | jatau vishvasya bhuvanasya gopau deva akrinvannamritasya
    nabhi m || imau devau jayamanau jushantemau tamagmsi guhatamajushta | abhyamindrah pakvamamasvanta
    njanadusriyasu || || somapushana rajaso vimana m | saptacakragm rathamavishvaminvam | vishuvrita mmanasa
    yujyamanam | ta njinvatho vrishana pancarashmim || divyanya ncakra ucca | prithivyamanyo addhyantarikshe
    | tavasmabhya mpurukshum | rayasposham mpusha jinvatu vishvaminvah | rayigm somo rayipati rdadhatu
    | avatu devyaditira dvadema vidathe suvirah nyanyo bhuvana jajana | vishvamanyo abhicakshana eti |
    somapushana vi~shvah pritana jayema || uduttamam va~runa pashamasmadava shrathaya | atha vayamaditya
    vrate tava 'nagaso aditaye syama astabhnadyamrishabho antarikshamamimita varimana dvishva bhuvanani
    samra dvishvettani varunasya vratani || | ya va~runa daivye jane shcaramasi | acittiya ttava dharma
    yuyopima ma nastasma denaso deva ririshah || kitavaso yadri ripurna divi yadva gha satya mutayanna
    vidma | sarva ta vishya shithireva devatha te syama varuna priyasah || | ava te hedo varuna namobhirava
    yajnebhirimahe havirbhih | kshayannasmabhyamasura praceto rajannenagmsi shishrathah kritani || tattva
    yami brahmana vandamanastada sha ste yajamano havirbhih | ahedamano varuneha bodhyurushagmsa ma na
    ayuh pramoshih || || adityanamavasa nutanena sakshimahi sharmana shantamena | anagastve adititve turasa
    imam ndadhatu shroshamanah || na dakshina vicikite na savya na pracinamaditya nota pashca | pakya
    cidvasavo dhirya ci dyushmanito abhaya njyotirashyam || | dharayanta adityaso jagathstha deva vishvasya
    bhuvanasya gopah | dirghadhiyo rakshamana asuryamritavana ntrini vrata vidathe antaresham | ritena
    ''ditya mahi vo mahitva ntadaryaman varuna mitra caru || | yajno devana mpratyeti sumnamadityaso bhavata
    mridayantah | a vo 'rvaci sumati rvavrityadagm hoshcidya varivovittara ssuyavasa adabdha upa ksheti
    vriddhavaya ssuvirah | nakishta nghnantyantito na duradya adityana mbhavati pranitau || || kitavasa
    shcatvari ca vashadinam suktani te shukrasa shshucayo rashmivantah | sidannaditya adhi barahishi priye
    | kamena deva ntu yajnamupa no jushanah || te sunavo aditeh pivasamisha pratiharyannritejah | pra
    yajniya yajamanaya yemure | adityah kama mpitumantamasme || a nah putra aditeryantu yajnam | adityasah
    pathibhi ndashushe sannamantah | purodasha njushantam || skabhayata nir ritigm sedhatamatim | pra
    rashmibhi ryatamana amriddhrah | adityah kama prayatam va~shatkritim | jushaddhva ya~jatrah || adityan
    kamamavase huvema | ye bhutani janayanto vicikhyuh | sidantu putra aditerupastha haviradyaya devah
    || ssidata yajne asminn | dhraja mputra aditeh prayagmsata | adityah kama havisho jushanah || agne
    naya supatha raye asman | vishvani deva vayunani vidvan | yuyoddhyasma jjuhuranamenah | bhuyishtha
    vi~dhema || pravah shukraya bhanave bharaddhvam | havya ncagnaye suputam || || yo daivyani manusha
    janugmshi | anta rvishvani vidmana jigati || accha giro matayo devayantih mbhikshamanah | susadrimshagm
    supratikagg svanca m | havyavahamarati mmanushanam || agne tvamasma dyuyoddhyamivah | anagnitra abhyamanta
    krishtih | punarasmabhyagm suvitaya deva | ksham mparaya navyo asman | svastibhirati durgani vishva
    | pushca prithvi bahula na urvi | bhava tokaya tanayaya sham yoh ~|| pra karavo manana vacyamanah
    | devadrici nnayatha devayantah | dakshinavad vajini pracyeti | havirbharantyagnaye ghritaci nnaro
    nemadhita havante yatparya yunajate dhiyastah | shuro nrishata shavasashcakana a gomati vraje bhaja
    tvannah || yuje ratha ngaveshanagm haribhyam | upa brahmani jujushana masthuh | vibadhishtasya rodasi
    mahitva | indro vritranyaprati jaghanvan || || jagribhna te dakshinamindra hasta || vasuyavo vasupate
    vasunam | vidma hi tva gopatigm shura gona vi~shvamabhitah pashavya tpashyasi cakshasa suryasya |
    gavamasi gopatireka indra | bhakshimahi te prayatasya vasvah || samindra no manasa neshi gobhih |
    sagm suribhi mbrahmana devakritam ndevanagm sumatya yajniyanam || aracchatru mapabadhasva duram |
    ugro ya shshambah puruhuta tena | asme dhehi yavamadgomadindra | kridhi dhiya njaritre vajaratnam
    || avedhasa m | brihaspatigm sadane sadayadhvam | sadadyoni m | hiranyavarnamarushagm sapema || sa
    hi shucih || brihaspatih prathama njayamanah | maho jyotishah parame vyomann | saptasyastuvijato ravena
    | vi saptarashmiradhamattamagmsi || dvasuni | maho vraja ngomato deva eshah | apa thsuvara pratittah
    | brihaspatirahantyamitra markaih || brihaspate pari diya rathena rakshoha 'mitragm apa badhamanah
    | prabhanjan pramrino yudha jayannasmaka medhyavita rathanam || eva pitre vishvadevaya vrishne yajnairvidhema
    namasa havirbhih | brihaspate supraja viravanto vayagg syama patayo rayinam || || a no divo brihatah
    parvatada sarasvati yajata gantu yajnam | hava ndevi jujushana ghritaci shagma nno vacamushati shrinotu
    ||paviravi kanya citrayu ssarasvati virapatni dhiya ndhat | gnabhiracchidragm sharanagm sajosha duradhar
    ngrinate sharma yagmsat || | ima juhvana yushmada namobhih | prati stomagm sarasvati jushasva | tava
    sharma npriyatame dadhanah | upastheyama sharana nna vriksham || yaste stanashshashaya ityaha | stautyevaina
    m | usra gharmagm shigmshosra gharma mpahi gharmaya shigmshetyaha | yatha bruyadamushmai dehiti |
    tadrigeva tat | brihaspatistvopa sidatvityaha | | sarasvatyabhi no neshi vasyah | ma paspharih payasa
    ma na a dhak | jushasva na ssakhya veshya ca | ma tvatkshetra nyaranani ganma || || iyagm shushmebhirbisakha
    ivarujat | sanu girina ntavishebhirurmibhih | paravadaghnimavase suvriktibhih | sarasvati mavivasema
    dhitibhih || saumyadinam suktani somo dhenugm somo arvantamashum | somo vira ndadatu | sadanyam yo~
    dadashadasmai || ashadham yu~thsu pritanasu papri m | suvarshamaphsvam vri~janasya gopam | bhareshujagm
    sukshitigm sushravasam | jayanta ntvamanu madema soma || tvagm soma kratubhih || ya te dhamani havisha
    yajanti ta te vishva paribhurastu yajna ngayasphanah pratarana 'viraha pracara soma duryana|| tvamima
    oshadhi | tvamapo ajanayastva ngah | tvamatatanthorvantariksham | tva njyotisha vitamo vavartha ||
    || ya te dhamani divi ya prithivyam | ya parvateshvoshadhishvaphsu | tebhirno vishvai ssumana ahedann
    | rajan thsoma prati havya gribhaya || vishnornukam vi~ryani pra vocam yah ~parthivani vimame rajagmsi
    yo askabhayaduttaragm sadhastham vi~cakramana stredhorugayo vishno raratamasi vishnoh rdhruvamasi
    vaishnavamasi vishnave tva || tadasya priyamabhi patho ashyam | naro yatra devayavo madanti | urukramasya
    sa hi bandhurittha | vishnoh pade parame madhva uthsah || | prata dvishnuh stavate viryaya | mrigo
    na bhimah kucaro girishthah | yasyorushu trishu vikramaneshu | adhikshiyanti bhuvanani vishva || ||
    paro matraya tanuva vridhana | na te mahitva manvashnuvanti | ubhe te vidma rajasi prithivya vishno
    deva tvam | paramasya vithse || || vicakrame prithivimesha etam | kshetraya vishnu rmanushe dashasyann
    | dhruvaso asya kirayo janasah | urukshitigm sujanima cakara || trirdevah prithivimesha etam | vicakrame
    shatarcasa mmahitva | pra vishnu rastu tavasasta viyan | tveshagg hyasya sthavirasya nama || || a
    te maha indrotyugra samanyavo ya | patati didyunnaryasya bahuvorma te mano vishvadriyagvi carit ||
    yo jata eva prathamo manasva ndevo devan kratuna paryabhushat | yasya shushmadrodasi abhyaseta nnrimnasya
    mahna sa janasa indrah || | abhi gotrani sahasa gahamano shshatamanyurindrah | dushcyavanah pritanashada
    yudhyo smakagm sena avatu pra yuthsu || || abhi rarishanyann | amitrasya vyathaya manyumindra | abhirvishva
    abhiyujo vishucih | aryaya visho || ayagm shrinve adha jayannuta ghnann | ayamuta prakrinute yudha
    gah | yada satya nkrinute manyumindrah || mbhayata ejadasmat || anu svadha maksharannapo asya | avardhata
    maddhya a navyanam | saddhricinena manasa tamindra ojishthena | hanmana 'hannabhidyun || marutvantam
    va~vridhanam | akavari ndivyagm shasamindra m | vishvasahamavase nutanaya | ugragm sahodamiha tagm
    huvema || janishtha ugra || mandra ojishtho bahulabhimanah | avardhannindra mmarutashcidatra | mata
    ya ndadhanaddhanishtha || kva sya vo maruta nmamekagm samadhattahihatye stuvishman | vishvasya shatroranamam
    va~dhasnaih || vritrasya tva shvasathadishamanah | vishve deva ajahurye sakhayah | marudbhirindra
    sakhya || athema vishvah pritana jayasi || vadhim mmaruta indriyena | svena bhamena tavisho babhuvan
    | ahameta manave vishvashcandrah | suga apashcakara vajrabahuh || sa yo vrisha vrishniyebhi ssamokah
    | maho divah prithivyashca samrat | satinasattva havyo bhareshu | marutva nno bhavatvindra uti ||
    indro vritramatara || anadhrishyo maghava shura indrah | anvenam vi~sho amadanta purvih | ayagm raja
    jagatashcar shaninam || sa eva vira ssa u viryavan | sa ekarajo jagatah paraspah | yada vritramataracchura
    indrah | atha bhavaddamita 'bhikratunam || indro yajnam va~rdhayan vishvavedah | purodashasya jushatagm
    havirnah | vritra 'drigm haddrigmhita drigmhanena || imam va~rdhayan vishvavedah | purodasha mpratigribhnatvindrah
    | yada vritramataracchura indrah | athaikarajo abhavajjananam || indro devanchambarahatya avat | indro
    devana tpurogah | indro yajne havisha vavridhanah | vritraturno abhayagm sharma yagmsat || ya ssapta
    sindhugm radadhat ssapta lokanakrino ddishashca | indro havishman thsagano marudbhih | vritraturno
    yajnamihopayasat || abhimatihaindradipashunam suktani indra nabhimatihograh | hiranyavashi shah |
    tasya vayagm sumatau yajniyasya | api bhadre saumanase syama || hiranyavarno abhaya nkrinotu | abhimatihendrah
    pritanasu jishnuh | sa na shsharma trivarutham ssada nah || indragg stuhi vajrinagg stomaprishtham
    | purodashasya jushatagm havirnah || ssahasvan | athabhaya nkrinuhi vishvato nah || stuhi shuram m
    | ya eka icchatapatirjaneshu | tasma indraya havirajuhota || indro devanamadhipah purohitah | disha
    dvajinivan | abhimatiha tavishastuvishman | asmabhya || ya ime dyavaprithivi mahitva | balenadrigmhadabhimatihendrah
    | sa no havih pratigribhnatu rataye ndevo nidhipa no avyat || anavaste rathamashvaya takshan m | brahmana
    indra mmahayanto arkairavardhayannahaye hanta va u || vrishne ya tte vrishano arkamarcanindra gravano
    aditi | anashvaso ye pavayo 'ratha indreshita abhyavartanta dasyun || | indrasya nu viryani pravocam
    | yani cakara prathamani vajri || aha nnahimanvapastatarda | pra vakshana abhina tparvatanam || ||
    indro yato | shamasya ca shringino vajrabahuh | sedu raja shaninam | aranna nemih parita babhuva ||
    || abhi siddhmo ajigadasya shatrun | vi tigmena vrishabhena puro dvritramindrah | pra sva mmatimatiracchashadanah
    || vishnu m | medasa deva vapaya yajaddhvam | ta no yajnamagatam vi~shvadhena | prajavadasme dravineha
    dhattam || medasa deva vapaya yajaddhvam | vishnu || ta no amiva apabadhamanau | imam m || vishnuvaruna
    yuvamaddhvaraya nah | vishe janaya mahi sharma yacchatam | dirghaprayajyu havisha vridhana | jyotisha
    ntamagmsi || yayorojasa skabhita rajagmsi | viryebhi rviratama shavishtha | ya patyete apratitta sahobhih
    | vishnu aganvaruna purvahutau || || vishnuvaruna vabhishastipa va m | deva yajanta havisha ghritena
    | apamivagm sedhatagm rakshasashca | atha dhattam yoh ~|| agmhomuca vrishabha supratu ndevatama shacishtha
    | vishnuvaruna pratiharyata nnara prayatamutaye havih || mahi nu dyavaprithivi iha jyeshthe | ruca
    bhavatagm shucayadbhi va~rishthe brihati viminvann | nrivadbhyo 'ksha paprathanebhirevaih rvaje pitara
    navyasibhih | girbhih krinuddhvagm sadane ritasya | a no dyavaprithivi daivyena | janena yata va~rutham
    || sa ithsvapa bhuvaneshvasa | ya ime dyavaprithivi jajana | urvi gabhire rajasi sumeke ndve acaranti
    carantam | padvanta ngarbhamapadi dadhate | nitya mpipritagm rodasi satyavaca ndyavaprithivi satyamastu
    | pita ryadihopabruve va ndevanamavame avobhih | vidyamesham njiradanum || urvi prithvi bahule dure
    ante | upabruve namasa yajne asminn | dadhate ye subhage supratu rti | dyava rakshata t || ya jata
    oshadhayo devebhyastriyuga mpura | mandami babhrunamahagm shata ndhamani sapta ca || sstena iva vrajamakramuh
    | oshadhayah pracucyavu rya nca tanuvagm rapah || | ya oshadhaya ssomarajnih pravishtah prithivimanu
    | tasa ntvamasyuttama prano jivata vesuva || ashvavatigm somavati murjayanti mudojasam | a vithsi
    sarva oshadhirasma arishtatataye || | oshadhiriti matara rupa bruve | rapagmsi vighnatirita rapashcatayamanah
    || anya vo anyamava 'nyasya upavata | ta mme pravata vacah || || aindragnapashvadinam suktani shuci
    gni vritrahana jushetha m | ubha hi vagm suhava johavimi ta vajagm sadya ushate dheshtha dvritramuta
    sanoti vajamindra yo agni sahuri saparyat | irajyanta vasavyasya bhure ssahastama sahasa vajayanta
    || | ubha vamindragni ahuvadhya ubha radhasa | ubha dataravishagm rayinamubha vajasya sataye huve
    vam || shanibhyah pritana haveshu pra prithivya riricathe divashca | pra sindhubhyah pragiribhyo mahitva
    prendra gni vishva bhuvana 'tyanya || | a vritrahana vritrahabhi nnamobhiragne arvak | yuvagm radhobhirakavebhirindra
    | agne asme bhavatamuttamebhih || girbhi rviprah pramatimicchamanah | i rayim gni vritrahana suvajra
    | prano navyebhistirata ndeshnaih || || brahmanaspate tvamasya yanta | suktasya bodhi tanaya ya~davanti
    devah | brihadvadema vidathe suvirah shshucadbhih | godhayasam vi~ dhanasairatardat | brahmanaspati
    vya~nat || brahmanaspate rabhavadyatha vasham | satyo manyurmahi karma karishyatah | yo ga udajathsa
    dive vi cabhajat | mahiva riti tprithak || indhano agnim va~navadvanushyatah | kritabrahma shushuva
    dratahavya it | jatena jatamati sri nkrinute brahmanaspatih || brahmanaspate suyamasya vishvaha ssyama
    rathyo vivasvatah | vireshu viragm upapringdhi nastvam | yadishano brahmana veshi me hava m || sa
    ijjanena sa visha sa janmana | sa putrairvaja mbharate dhana nribhih | devanam yah ~pitaramavivasati
    | shraddhamana havisha brahmanaspati m || yaste pushannavo anta ssamudre | hiranyayirantarikshe caranti
    | yabhiryasi dutyagm suryasya | kamena krita shshrava icchamanah || | shukra nte anyadvishurupe ahani
    dyaurivasi | vishva hi maya avasi svadhavo bhadra te pushanniha ratirastu || pushema asha anuveda
    sarva sso asmagm abhayatamena neshat | svastida aghrini ssarvavirah | aprayuccha npura etu prajanann
    || || prapathe pathamajanishta pusha || || prapathe divah prapathe prithivyah | ubhe abhi priyatame
    sadhasthe | a ca para ca carati prajanann || pusha subandhurdiva a prithivyah | idaspati rmaghava
    dasmavarcah | ta m || ajashvah pashupa vajavastyah | dhiyajinnvo vishve bhuvane arpitah | ashtra mpusha
    shithiramudvarivrijat || || sacankshano bhuvana deva iyate || shuci vo havya maruta shshucinam | shucigm
    hinomyaddhvaragm shucibhyah | ritena satyamritasapa ayann | shucijanmana shshucayah pavakah || pra
    citramarka ngrinate turaya | marutaya svatavase bharaddhvam | ye sahagmsi sahasa sahante | rejate
    agne prithivi makhebhyah || agmseshva marutah khadayo vah || || vakshahsu rukma upashishriyanah |
    vi vidyuto na vrishtibhi rucanah | anu svadhamayudhai ryacchamanah || ya va shsharma shashamanaya
    santi | tridhatuni dashushe yacchatadhi | asmabhya ntani maruto viyanta | rayi mmaruto ramayanti |
    ime saha ssahasa anamanti | ime shagmsam || gurudvesho ararushe dadhanti || ara ivedacarama aheva
    | pra prajayante akava mahobhih | prishneh putra upamaso rabhishthah | svaya matya maruta ssammimikshuh
    || anu te dayi maha indriyaya | satra te vishvamanu vritrahatye | anu kshatramanu saho yajatra | indra
    devebhiranu te nrishahye || ya indra shushmo maghavante asti || || shiksha sakhibhyah puruhuta nribhyah
    | tvagm hi dridha maghavan vicetah | apavridhi parivriti nna radhah || indro raja jagatashcar shaninam
    | adhikshami vishurupam ya~dasti | tato dadatu dashushe vasuni | codadradha upastutashcidarvak ||
    tamu shtuhi yo abhibhu tyojah | vanvannavatah puruhuta indrah | ashadhamugragm sahamanamabhih || ||
    girbhirvardha vrishabha shaninam || sthurasya rayo brihato ya ishe | tamu shtavama vidatheshvindra
    m | yo vayuna jayati gomatishu | pra dhrishnuya nayati vasyo accha || a te shushmo vrishabha etu pashcat
    | ottaradadharaga purasta t | a vishvato abhi same tvarvam | indra dyumnagm suvarvaddhehyasme || savitradipashunam
    suktani a devo yatu savita suratnah | antarikshapra vahamano ashvaih | haste dadhano narya puruni
    | niveshayan ca prasuvan ca bhuma || abhivrita rvishvarupam | hiranyashamyam drathagm savita citrabhanuh
    | krishna rajagmsi tavishi ndadhanah || sagha no deva ssavita savaya | asavisha || vishrayamano amatimurucim
    | martabhojanamadha rasate na || vi jana shshitipado akhyann | rathagm hiranya pra ugam rdaivyasya
    | upasthe vishva bhuvanani tasthuh || vi suparno antarikshanyakhyat | gabhiravepa asura ssunithah
    | kvedanigm suryah kashciketa | katama ndyagm rashmirasyatatana || va~jayantah purandhim | narashagmso
    gnaspatirno avyat | a 'ye vamasya sangathe rayinam | priya devasya savitu ssyama || a no vishve askra
    gamantu devah | mitro aryama varuna yatha no vishve vridhasah | kara nno deva vishvadeva bhavantu
    | shagm sarasvati saha dhibhirastu || shshamu ratishacah | sha nno divyah parthiva ssatyasavasya vishve
    | mitrasya vrate varunasya devah | te saubhagam vi~ravadgomadapnah | dadhatana dravina ncitramasme
    || agne yahi dutyam va~rishenyah | devagm accha brahmakrita ganena | sarasvati 'pah | yakshi deva
    nratnadheyaya vishvan || || dyauh pitah prithivi mataraddhruk | agne bhratarvasavo mridata nah | vishva
    aditya adite sajoshah | asmabhyagm sharma bahulam vi~yanta || vishve deva mme | ye antarikshe ya upa
    dyavi shtha | ye agnijihva uta va yajatrah | asa nbarhishi madayaddhvam || a va mmitravaruna havyajushtim
    | namasa deva vavasa mbrahma pritanasu sahya asmaka rdivya supara || yuvam va~strani pivasa vasathe
    | yuvoracchidra mantavo ha sargah | avatiratamanritani vishva | ritena mitravaruna sacethe || tathsu
    va mmitravaruna mahitvam | irma tasthushirahabhi rduduhre | vishvah pinvatha svasarasya dhenah | anu
    vamekah paviravavarti || nnativide sudanu | acchidragm sharma bhuvanasya gopa | tato no mitravaruna
    vavishtam | sishasanto jigivagmsah syama || a no mitravaruna havyadatim | ghritai rgavyutimukshatamidabhih
    | prati vamatra varama janaya | prinitamudgo divyasya caroh njivase nah | a no gavyutimukshata mme
    mitravaruna havema || ima rudraya sthiradhanvane girah | kshipreshave devaya svadhamne | ashadhaya
    sahamanaya midhushe | tigmayudhaya bharata shrinotana || tva dattebhi rudra shantamebhih | shatagm
    hima ashiya bheshajebhih | vyasmaddvesho vitaram vya~gmhah | vyamivag shcatayasva vishucih || shi
    sayakani dhanva | ar hannidandayase vishvamabbhuvam | na va ojiyo rudra tvadasti || ma nastoke tanaye
    ma na ayushi ma no goshu ma no ashveshu ririshah | vira nmano rudra bhamito vadhir havishmanto namasa
    vidhema te |||| a te pitarmarutagm sumnametu | ma na ssuryasya sadrimsho yuyothah | abhi no viro arvati
    kshameta | prajayemahi rudra prajabhih || eva babhro vrishabha cekitana | yatha deva na hrinishe na
    hagmsi | havanashrurno rudreha bodhi | brihadvadema vidathe suvirah || parino rudrasya heti rvrinaktu
    paritveshasya durmatiraghayoh | ava sthira maghavadbhya stanushva midhvastokaya tanayaya mridaya ||
    mugram | mrida jaritre rudra stavano anyante asmannivapantu senah || | midhushtama shivatama shivo
    nah sumana bhava |parame vriksha ayudha va~sana acara pinakambibhradagahi || ar shi sayakani dhanva
    | ar hannidandayase vishvamabbhuvam | na va ojiyo rudra tvadasti ||| tvamagne rudro asuro maho divastvagm
    shardho maruta mpriksha ishishe | tvam va~tairarunairyasi shangayastva mpusha vidhatah pasi nutmana
    a vo rajanamadhvarasya rudragm hotaragm satyayajagm rodasyoh | agni mpura tanayitno racitta ddhiranyarupamavase
    krinudhvam || || sauryadipashunam suktani suryo devimushasagm rocamana maryah | na yoshamabhyeti pashcat
    | yatra naro devayanto yugani | vitanvate prati bhadraya bhadram || bhadra ashva harita ssuryasya
    | citra edagva anumadyasah | namasyanto diva a prishthamasthuh | pari dyavaprithivi yanti sadyah ||
    ta nmahitvam | maddhya karto rvitatagm sanjabhara || || yadedayukta haritah sadhastha t | adratri
    vasastanute simasmai nmitrasya varunasyabhicakshe nkrinute dyorupasthe drushadasya pajah | krishnamanyaddharita
    ssambharanti || adya deva udita suryasya | niragmhasah pipritanniravadyat | tanno mitro varuno mamahantam
    | aditi ssindhuh prithivi uta dyauh || || divo rukma urucaksha udeti | dure arthastarani ssuryena
    prasutah | ayannarthani krinavannapagmsi || sha nno bhava cakshasa sha mbhanuna shagm hima sha nghrinena
    | yatha shamasmai shamasa ndhehi citram || citra mudagadanikam | cakshurmitrasya varunasyagneh ||
    'pra dyavaprithivi antariksham | surya atma jagatastasthushashca || tvashta dadhadindraya shushma
    'cishturyashase puruni | vrisha yajan vrishana mbhuriretah | murdhan yajnasya samanaktu devan || tannasturipamadha
    poshayitnu deva tvashtarvi rarana ssyasva | yato virah karmanyah sudaksho yuktagrava jayate devakamah
    || | tvashta vira njajana tvashturarva jayata ashurashvah | tvashtedam njajana bahoh kartaramiha yakshi
    hotah || pishangarupa shshrushti viro jayate devakamah | praja ntvashta vishyatu nabhimasme atha devanamapyetu
    pathah || || dashema ntvashturjanayanta garbha m | atandraso yuvatayo bibhartram | tigmanikagg svayashasa
    njaneshu | virocamana nnayanti || avishtyo vardhate carurasu | jihmanamurdhva || ubhe tvashturbibhyatu
    rjayamanat | pratici sigmha mpratijoshayete || mitro janan yatayati prajana nmitro dadhara prithivimuta
    dyam | mitrah krishtiranimisha 'bhi cashte satyaya havya pra sa mitra marto astu prayasvan yasta aditya
    shikshati vratena | na hanyate na jiyate tvoto nainamagmho ashnotyantito na durat || || aya mmitro
    namasyah sushevah | raja sukshatro ajanishta vedhah | tasya vayagm sumatau yajniyasya | api bhadre
    saumanase syama || anamivasa idaya madantah | mitajmavo varimanna prithivyah | adityasya vratamupakshyantah
    || mmitrasya sumatau syama || mitra nna igm shimya goshu gavyavat | svadhiyo vidathe aphsvajijanann
    | arejayatagm rodasi pajasa gira | prati priyam njanushamavah || mahagm adityo namasopasadyah | yatayajjano
    grinate sushevah | tasma eta m | agnau mitraya havirajuhota || avagm ratho rodasi badbadhanah || ||
    hiranyayo vrishabhiryatvashvaih | ghritavartanih pavibhi rucanah | isham vo~dha nripatirvajinivan
    || sa paprathano abhi panca bhuma | trivandhuro manasa ''yatu yuktah | visho yena gacchatho devayantih
    | kutra cidyamamashvina dadhana || svashva yashasa ''yatamarvak | dasra nidhi mpibathah | vi vagm
    ratho vaddhva yadamanah || ndivo badhate vartanibhya mpari yosha vrinita | suro duhita paritakmiyayam
    | ya shshacibhih | parighragmsa va va~yo gam || yo ha sya vagm rathira vasta usrah | ratho yujanah
    pariyati vartih | tena na yo~rushaso vyushtau | nyashvina vahatam ya~jne asminn || yuva mbhujyumavaviddhagm
    samudre || || uduhathurarnaso asridhanaih | patatribhi ravyathibhih | dagmsanabhirashvina parayanta
    || agnishoma yo adya va va~cah saparyati | tasmai dhattagm suvirya mposhagg svashviyam || yo agnishoma
    havisha saparyat | devadrica manasa yo ghritena | tasya vratagm rakshata || vishe janaya mahi sharma
    yacchatam || agnishoma ya ahutim | yo va ddhavishkritim | sa prajaya suvirya rvyashnavat || agnishoma
    ceti ta va~m | yadamushnitamavasa mprathayasya sheshah | avindata mbahubhyah || agnishoma vimagm su
    me shrinutam m | prati suktani haryata ndashushe mayah || agnishoma havishah prasthitasya vitagmharyatam
    m | susharmana svavasa hi bhutamatha dhattam vehadadipashunam suktani ahamasmi prathamaja ritasya
    | purva ndevebhyo amritasya nabhih | yo ma dadati sa ideva ma vah madantamadmi || purva magnerapi
    dahatyanna ''sate ahamuttareshu | vyattamasya pashavah sujambha m | pashyanti dhirah pracaranti pakah
    nna jahamyanyam | ahamannam mparyemi bhunjat | ko mamanna mmanushyo dayeta || parake anna lo~ka etat
    | vishvai m | yadadyate lupyate ya | shatatami sa tanurme babhuva || mahantau caru sakri ddugdhena
    paprau | divanca prishni prithivi thsampibanto na minanti vedhasah | naita dbhuyo bhavati no kaniyah
    || ntamu jivatumahuh | anna mbrahmano jarasam va~danti | annamahuh prajanana vi~ndate apracetah |
    satya mbravimi vadha ithsa tasya | naryamana mpushyati no sakhayam | kevalagho bhavati kevaladi ||
    aha shannasmi | mamadantyahamadmyanyan || || ahagm sadamrito bhavami | madaditya adhi sarve tapanti
    || sa no mandreshamurja nduhana | dhenurvagasmanupa sushtutaitu || vicetanani | rashtri devana nnishasada
    mandra | catasra urja nduduhe payagmsi | kva svi dasyah parama njagama || || ananta mantadadhi nirmita
    ndvipadagm shatpadanca | vaca ndeva upajivanti vishve ndeva upajivanti vishve ngandharvah pashavo
    manushyah | vacima vishva bhuvananyarpita || mindrapatni || vagakshara mprathamaja ritasya | vedana
    'mritasya nabhih | sa no jushanopa yajnamaga t | avanti devi suhava me astu || ya mrishayo mantrakrito
    manishinah | anvaiccha stapasa shramena | ta va~cagm havisha yajamahe | sa no dadhatu sukritasya loke
    || catvari va kparimita padani || rbrahmana ye manishinah | guha trini nihita nengayanti | turiyam
    va~co manushya vadanti || shraddhaya ssamiddhyate | shraddhaya vindate havih | shraddha mbhagasya
    murdhani | vacasa ''vedayamasi || priyagg shraddhe dadatah | priyagg shraddhe didasatah | priya mbhojeshu
    yajvasu || nkridhi || yatha deva asureshu | shraddha mugreshu cakrire | eva mbhojeshu yajvasu | asmaka
    ndeva yajamanah | vayugopa upasate | shraddhagm hridayyaya tya | shraddhaya huyate havih || shraddha
    mpari | shraddhagm suryasya nimruci | shraddhe shraddhapayeha ma nadhivaste | shraddha vishvamida
    m | havisha vardhayamasi || brahmajajnana ssuruco vena avah | sa buddhniya upama asya vishthah ||
    masatashca vivah || pita virajamrishabho rayinam | antariksham vi~shvarupa avivesha | tamarkai rabhyarcanti
    vathsam | brahma santa mbrahmana vardhayantah || brahma devanajanayat | brahma vishvamida nnirmitam
    | brahma brahmana atmana njagat | brahmaiva bhutana hati spardhitum || brahma strayastrigmshat | brahmannindra
    prajapati | brahman ha vishva bhutani | navi vanta ssamahita || catasra ashah pracarantva gnayah |
    imanno yajna nnayatu prajanann | ghrita mpinvannajaragm suvira dbhavatyahutinam || a gavo agmannuta
    bhadramakrann | sidantu goshthe ranayantvasme | prajavatih pururupa iha syuh | indraya purvi rushaso
    duhanah || indro yajvane prinate ca shikshati | upeddadati na sva mmushayati | bhuyo bhuyo rayimidasya
    vardhayann | abhinne khille nidadhati devayum || na ta nashanti na dabhati taskarah | naina amitro
    vyathiradadhar ryajate dadati ca | jyogittabhih sacate gopati na ta arva renukakato ashnute | na sagg
    skritatra mupayanti ta abhi | urugayamabhaya ntasya ta anu | gavo martyasya vicaranti yajvanah ||
    || || gavo bhago gava indro me acchat | gava ssomasya prathamasya bhakshah | ima ya gava ssajanasa
    indrah | icchamiddhrida manasa cidindra tkrinutha supratikam | bhadra nkrinutha bhadravacah | brihadvo
    vaya ucyate sabhasu || prajavati ssuyavasagm rishantih ssuprapane pibantih | ma vah stena ishata ma
    'ghashagmsah | parivo heti rudrasya vrinjyat || upeda mupaparcanam | asu goshupapricyatam | upar shabhasya
    retasi | upe shuklakrishnapashvadinam suktani ta su rya candramasa vishvabhrittama mahat | tejo vasuma
    drajato divi | sama nna mame jatu devayoh || ubhavantau pariyata armya vyarnave | ubha bhuvanti bhuvana
    kavikratu | surya na candra carato hatamati || pati dvishvavida ubha divah | surya ubha candramasa
    vicakshana || || vishvavara varivobha vare mmatimanta mahivrata || vishvavapari pratarana taranta
    | suvarvida drishaye bhurirashmi | surya hi candra vasutvesha m || asya shravo nadyah sapta bibhrati
    | dyava kshama prithivi dar | shraddhe kamindra carato vicarturam || ncarato maya yaitau | shishu
    kridantau pariyato addhvaram | vishva nyanyo bhuvana 'bhicashte | ritunanyo vidadhajjayate punah ||
    hiranyavarna shshucayah pavaka yasu jatah kashyapo yasvindrah | agnim ndadhire virupasta na apa yasagm
    raja varuno yati madhye satyanrite avapashyan jananam | madhushcuta shshucayo yah pavakasta na apa
    syona bhavantu || | yasa ndeva divi krinvanti bhaksham ya~ antarikshe bahudha bhavanti | yah prithivi
    mpayasondantishukrasta na apa shivena ma cakshusha pashyata shshivaya tanuvopa sprishata tvaca mme
    | sarvagm agnigm raphsushado huve vo mayi varco balamojo ni dhatta || | apo bhadra ghritamidapa asuragni
    shomau bibhratyapa i ttah | tivro raso madhuprica pranena saha varcasa gann || tpashyamyuta va shrinomya
    ma ghosho gacchati vanna asam | manye bhejano amritasya tar hi hiranyavarna atripam ya~da vah || ||
    nasadasinno sadasi drajo no vyomaparo yat | kimavarivah kuha kasya sharmann || ngabhiram || na mrityuramrita
    hi na | ratriya ahna asi tpraketah | anidavatagg kinca nasa || tama asi praketam | salilagm sarvama
    idam | tucche nabhvapihita t | tamasa stanmahina jayataika m || kamastadagre samavartatadhi || ||
    manaso retah prathamam t | sa to bandhumasati niravindann | hridi pratishya kavayo manisha || tirashcino
    vitato rashmiresham | adha nmahimana asann | svadha avasta t || ko addha veda ka iha pravocat | kuta
    ajata kuta iyam vi~srishtih | arvagdeva asya visarjanaya || || atha ko veda yata ababhuva || iyam
    ryata ababhuva | yadi va dadhe yadi va na | yo asyaddhyakshah parame vyomann | so anga veda yadi va
    na veda || kigg nka u sa vriksha asit | yato dyavaprithivi nishtatakshuh | manishino manasa pricchatedu
    tat | yadaddhyatishtha dbhuvanani dharayann || brahma vana mbrahma sa vriksha asit || || yato dyavaprithivi
    nishtatakshuh | manishino manasa vibravimi vah | brahmaddhyatishtha dbhuvanani dharayann || prataragni
    mpratarindragm havamahe | prata rmitravaruna pratarashvina m | pratassomamuta rudragm huvema || pratarjita
    mbhagamugragm huvema | vaya mputramaditeryo vidharta | addhrashcidya mbhakshityaha || bhaga pranetarbhaga
    satyaradhah | bhagema ndhiyamudava dadannah | bhaga prano janaya gobhirashvaih rnrivantah syama |
    utedani ssyama || uta prapitva uta maddhye ahna m | utodita maghavan ndevanagm sumatau syama || bhaga
    eva bhagavagm astu devah || ntva bhaga sarva ijjohavimi | sa no bhaga pura eta bhaveha || samaddhvarayoshaso
    namanta | dadhikraveva shucaye padaya | arvacinam mbhagannah | rathamivashva vajina avahantu || ashvavati
    rna ushasah | viravati ssadamucchantu bhadrah | ghrita nduhana vishvatah prapinah | yuya mbrahma sa
    vriksha asit ryacandramasa navasaptatih || harih om || || krishna yajurvediya taittiriya brahmane
    dvitiyashtake ashtamah prapathaka ssamaptah || || krishna yajurvediya taittiriya brahmane dvitiyashtakam
    samaptam ||
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके अष्टमः प्रपाठकः काम्यपशुयाज्यानुवाक्या
    ब्राह्मणम् ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं वायव्यादिपशूनां सूक्तानि पीवो न्नाग्ं रयि॒वृधः॑
    सुमे॒धाः । श्वे॒त स्सि॑षक्ति नि॒युता॑मभि॒श्रीः । ते वा॒यवे॒ सम॑नसो॒ वित॑स्थुः । विश्वेन्नरः॑ स्वप॒त्यानि॑
    चक्रुः ॥ रा॒ये ञ्ज॒ज्ञतू॒ रोद॑सी उ॒भे । रा॒ये दे॒वी धि॒षणा॑ धाति दे॒वम् । अधा॑ वा॒यु न्नि॒युतः॑ सश्चत॒
    स्वाः । उ॒त श्वे॒तं न्निरे॒के ॥ आ वा॑यो भूष शुचिपा॒ उप॑ न न्ते नि॒युतो॑ विश्ववार । उपो॑ ते॒ अन्धो॒
    मद्य॑मयामि॒ यस्य॑ देव दधि॒षे पू म् ॥ प्र याभि॒र्यासि॑ दा॒श्वाग्ं समच्छा॑ नि॒युद्भि॑ र्वायवि॒ष्टये॑
    दुरो॒णे । नि नो॑ र॒यिग्ं सु॒भोज॑सं ञ्च॒ राधः॑ ॥॥ प्र वा॒युमच्छा॑ बृह॒ती म॑नी॒षा ॥ विँ॒श्ववा॑राग्ं
    रथ॒प्राम् । द्यु॒तद्या॑मा नि॒युतः॒ पत्य॑मानः । क॒विः क॒विमि॑यक्षसि प्रयज्यो ॥ आ नो॑ नि॒युद्भिः॑ श॒तिनी॑भि
    रद्ध्व॒रम् । स॒ह॒स्रिणी॑भि॒रुप॑ याहि य॒ज्ञम् । वायो॑ अ॒स्मिन् ह॒विषि॑ मादयस्व । यू॒य स्सदा॑ नः ॥ प्रजा॑पते॒
    न त्वदे॒तान्य॒न्यः । विश्वा॑ जा॒तानि॒ परि॒ ता ब॑भूव । य त्का॑मास्ते जुहु॒मस्तन्नो॑ अस्तु ॥ स्या॑म॒
    पत॑यो रयी॒णाम् ॥ र॒यी॒णा म् । अ॒स्मिन्भरे॒ नृत॑मं॒ वाँज॑सातौ । प्र॒जाप॑ति म्प्रथम॒जामृ॒तस्य॑ । यजा॑म
    दे॒वमधि॑ नो ब्रवीतु ॥ प्रजा॑पते॒ त्व न्नि॑धि॒पाः पु॑रा॒णः । दे॒वाना म्पि॒ता ज॑नि॒ता प्र॒जाना र्विश्व॑स्य॒
    जग॑तः पर॒स्पाः । ह॒विर्नो॑ देव विह॒वे जु॑षस्व ॥ तवे॒मे लो॒काः प्र॒दिशो॒ दिश॑श्च ॥ ॥ प॒रा॒वतो॑ नि॒वत॑
    उ॒द्वत॑श्च । प्रजा॑पते विश्व॒सृज्जी॒वध॑न्य इ॒द न्नो॑ देव । प्रति॑हर्य ह॒व्यम् ॥ प्र॒जाप॑ति यँ॒ज्ञिया॑नाम्
    । दे॒वाना॒मग्रे॑ यज॒तं यँ॑जद्ध्वम् । स नो॑ ददातु॒ द्रवि॑णग्ं सु॒वीर्य विँष्य॑तु॒ नाभि॑म॒स्मे ॥ यो
    रा॒य ईशे॑ शतदा॒य उ॒क्थ्यः॑ । यः प॑शू॒नाग्ं र॑क्षि॒ता विष्ठि॑तानाम् । प्र॒जाप॑तिः प्रथम॒जा ऋ॒तस्य॑
    ॥ ॥ स॒हस्र॑धामा जुषताग्ं ह॒विर्नः॑ ॥ सोमा॑पूषणा॒ जन॑ना रयी॒णा ञ्जन॑ना दि॒वो जन॑ना पृथि॒व्याः । जा॒तौ
    विश्व॑स्य॒ भुव॑नस्य गो॒पौ दे॒वा अ॑कृण्वन्न॒मृत॑स्य॒ नाभि म् ॥ इ॒मौ दे॒वौ जाय॑मानौ जुषन्ते॒मौ तमाग्ं॑सि
