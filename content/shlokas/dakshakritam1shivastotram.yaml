id: dakshakritam1shivastotram
category: stotram
name:
  english: dakshakritam1shivastotram
  devanagari: दक्षकृतं१शिवस्तोत्रम्
content:
  english: kastatha || 55|| suvarnareta vikhyatah suvarnashcapyatho matah | suvarnanama ca tatha suvarnapriya
    eva ca || 56|| tvamindrashca yamashcaiva varuno dhanado'nalah | utphullashcitrabhanushca svarbhanurbhanureva
    ca || 57|| hotram hota ca homyam ca hutam caiva tatha prabhuh | trisauparnastatha brahmanyajusham
    shatarudriyam || 58|| pavitram ca pavitranam mangalanam ca mangalam | pranashca tvam rajashca tvam
    tamah sattvayutastatha || 59|| prano'panah samanashca udano vyana eva ca | unmeshashca nimeshashca
    kshuttridjrimbha tathaiva ca || 60|| lohatangashca damshtri ca mahavaktro mahodarah | shuciroma haricchmashrururdhvakeshashcalacalah
    || 61|| gitavaditranrityango gitavadanakapriyah | matsyo jalo jalo'jayyo jalavyalah kuticarah || 62||
    vikalashca sukalashca dushkalah kalanashanah | mrityushcaivakshayo'ntashca kshamamayakarotkarah ||
    63|| samvarto vartakashcaiva samvartakabalahakau | ghantaki ghantaki ghanti cudalo lavanodadhih ||
    64|| brahma kalagnivaktrashca dandi mundastridandadhrik | caturyugashcaturvedashcaturhotrashcatushpathah
    || 65|| caturashramyaneta ca catuvarnyakarashca ha | ksharaksharah priyo dhurto ganairganyo ganadhipah
    || 66|| raktamalyambaradharo girisho girijapriyah | shilpishah shilpinam shreshthah sarvashilpripravartakah
    || 67|| bhaganetrantakashcandah pushno dantavinashanah | svaha svadha vashatkaro namaskara namo'stu
    te || 68|| gudhavratashca gudhashca gudhavratanishedhitah | taranastaranashcaiva sarvabhuteshu taranah
    || 69|| dhata vidhata sandhata nidhata dharano dharah | tapo brahma ca satyam ca brahmacaryam tatha''rjavam
    || 70|| bhutatma bhutakridbhuto bhutabhavyabhavodbhavah | bhurbhuvah svaritashcaiva bhuto hyagnirmaheshvarah
    || 71|| brahmavartah suravartah kamavarta namo'stu te | kamabimbavinirhanta karnikarasrajapriyah ||
    72|| goneta gopracarashca govrisheshvaravahanah | trailokyagopta govindo gopta gogarga eva ca || 73||
    akhandacandrabhimukhah sumukho durmukho'mukhah | caturmukho bahumukho raneshvabhimukhah sada || 74||
    hiranyagarbhah shakunirdhanado'rthapatirvirat | adharmaha mahadaksho dandadharo ranapriyah || 75||
    tishthansthirashca sthanushca nishkampashca sunishcalah | durvarano durvishaho duhsaho duratikramah
    || 76|| durdharo durvasho nityo durdarpo vijayo jayah | shashah shashankanayanashitoshnah shruttrisha
    jara || 77|| adhayo vyadhayashcaiva vyadhiha vyadhipashca yah | sahyo yajnamrigavyadho vyadhinamakaro'karah
    || 78|| shikhandi pundarikashca punadarikavalokanah | dandadhrikcakradandashca raudrabhagavinashanah
    || 79|| vishapo'mritapashcaiva surapah kshirasomapah | madhupashcapapashcaiva sarvapashca balabalah
    || 80|| vrishangarambho vrishabhastatha vrishabhalocanah | vrishabhashcaiva vikhyato lokanam lokasamskritah
    || 81|| candradityau cakshushi te hridayam ca pitamahah | agnishtomastatha deho dharmakarmaprasadhitah
    || 82|| na brahma na ca govindah puranarishayo na ca | mahatmyam veditum shakta yathatathyena te shiva
    || 83|| shiva ya murtayah sukshmaste mahyam yantu darshanam | tabhirmam sarvato raksha pita putramivaurasam
    || 84|| raksha mam rakshaniyo'ham tavanagha namo'stu te | bhaktanukampi bhagavanbhaktashcaham sada
    tvayi || 85|| yah sahasranyanekani pumsamavritya durdrisham | tishthatyekah samudrante sa me gopta'stu
    nityashah || 86|| yam vinidra jitashvasah sattvasthah samadarshinah | jyotih pashyanti yunjanastasmai
    yogatmane namah || 87|| sambhakshya sarvabhutani yugante samupasthite | yah shete jalamadhyasthastam
    prapadye'mbushayinam || 88|| pravishya vadanam rahoryah somam pibate nishi | grasatyarkam ca svarbhanurbhutva
    somagnire ca || 89|| angushthamatrah purusha dehasthah sarvadehinam | rakshantu te ca mam nityam nityam
    capyayayantu mam || 90|| yenapyutpadita garbha apo bhagagatashca ye | tesham svaha svadha caiva apnuvanti
    svadanti ca || 91|| yena rohanti dehasthah pranino rodayanti ca | harshayanti na krishyanti namastebhyastu
    nityashah || 92|| ye samudre nadidurge parvateshu guhasu ca | vrikshamuleshu goshtheshu kantaragahaneshu
    ca || 93|| catushpatheshu rathyasu catvareshu sabhasu ca | hastyashvarathashalasu jirnodyanalayeshu
    ca || 94|| yeshu pancasu bhuteshu dishasu vidishasu ca | indrarkayormadhyagata ye ca candrarkarashmishu
    || 95|| rasatalagata ye ca ye ca tasmatparam gatah | namastebhyo namastebhyo namastebhyastu sarvashah
    || 96|| sarvastvam sarvago devah sarvabhutapatirbhavah | sarvabhutantaratma ca tena tvam na nimantritah
    || 97|| tvameva cejyase deva yajnairvividhadakshinaih | tvameva karta sarvasya tena tvam na nimantritah
    || 98|| athava mayaya deva mohitah sukshmaya tava | tasmattu karanadva'pi tvam maya na nimantritah
    || 99|| prasida mama devesha tvameva sharanam mama | tvam gatistvam pratishtha ca na canyo'stiti ne
    matih || 100|| iti brahmapurane catvarimshadhyayantargatam dakshakritam shivastotram samaptam | brahmapurana
    | adhyaya 40 athava 38
  devanagari: कस्तथा ॥ ५५॥ सुवर्णरेता विख्यातः सुवर्णश्चाप्यथो मतः । सुवर्णनामा च तथा सुवर्णप्रिय एव च
    ॥ ५६॥ त्वमिन्द्रश्च यमश्चैव वरुणो धनदोऽनलः । उत्फुल्लश्चित्रभानुश्च स्वर्भानुर्भानुरेव च ॥ ५७॥ होत्रं
    होता च होम्यं च हुतं चैव तथा प्रभुः । त्रिसौपर्णस्तथा ब्रह्मन्यजुषां शतरुद्रियम् ॥ ५८॥ पवित्रं च पवित्राणां
    मङ्गलानां च मङ्गलम् । प्राणश्च त्वं रजश्च त्वं तमः सत्त्वयुतस्तथा ॥ ५९॥ प्राणोऽपानः समानश्च उदानो
    व्यान एव च । उन्मेषश्च निमेषश्च क्षुत्तृड्जृम्भा तथैव च ॥ ६०॥ लोहताङ्गश्च दंष्ट्री च महावक्त्रो महोदरः
    । शुचिरोमा हरिच्छ्मश्रुरूर्ध्वकेशश्चलाचलः ॥ ६१॥ गीतवादित्रनृत्याङ्गो गीतवादनकप्रियः । मत्स्यो जालो
    जलोऽजय्यो जलव्यालः कुटीचरः ॥ ६२॥ विकालश्च सुकालश्च दुष्कालः कालनाशनः । मृत्युश्चैवाक्षयोऽन्तश्च क्षमामायाकरोत्करः
    ॥ ६३॥ संवर्तो वर्तकश्चैव संवर्तकबलाहकौ । घण्टाकी घण्टकी घण्टी चूडालो लवणोदधिः ॥ ६४॥ ब्रह्मा कालाग्निवक्त्रश्च
    दण्डी मुण्डस्त्रिदण्डधृक् । चतुर्युगश्चतुर्वेदश्चतुर्होत्रश्चतुष्पथः ॥ ६५॥ चातुराश्रम्यनेता च चातुवर्ण्यकरश्च
    ह । क्षराक्षरः प्रियो धूर्तो गणैर्गण्यो गणाधिपः ॥ ६६॥ रक्तमाल्याम्बराधरो गिरीशो गिरिजाप्रियः । शिल्पीशः
    शिल्पिनां श्रेष्ठः सर्वशिल्प्रिप्रवर्तकः ॥ ६७॥ भगनेत्रान्तकश्चण्डः पूष्णो दन्तविनाशनः । स्वाहा स्वधा
    वषट्कारो नमस्कार नमोऽस्तु ते ॥ ६८॥ गूढव्रतश्च गूढश्च गूढव्रतनिषेधितः । तरणस्तारणश्चैव सर्वभूतेषु तारणः
    ॥ ६९॥ धाता विधाता सन्धाता निधाता धारणो धरः । तपो ब्रह्म च सत्यं च ब्रह्मचर्यं तथाऽऽर्जवम् ॥ ७०॥ भूतात्मा
    भूतकृद्भूतो भूतभव्यभवोद्भवः । भूर्भूवः स्वरितश्चैव भूतो ह्यग्निर्महेश्वरः ॥ ७१॥ ब्रह्मावर्तः सुरावर्तः
    कामावर्त नमोऽस्तु ते । कामबिम्बविनिर्हन्ता कर्णिकारस्रजप्रियः ॥ ७२॥ गोनेता गोप्रचारश्च गोवृषेश्वरवाहनः
    । त्रैलोक्यगोप्ता गोविन्दो गोप्ता गोगर्ग एव च ॥ ७३॥ अखण्डचन्द्राभिमुखः सुमुखो दुर्मुखोऽमुखः । चतुर्मुखो
    बहुमुखो रणेष्वभिमुखः सदा ॥ ७४॥ हिरण्यगर्भः शकुनिर्धनदोऽर्थपतिर्विराट् । अधर्महा महादक्षो दण्डधारो
    रणप्रियः ॥ ७५॥ तिष्ठन्स्थिरश्च स्थाणुश्च निष्कम्पश्च सुनिश्चलः । दुर्वारणो दुर्विषहो दुःसहो दुरतिक्रमः
    ॥ ७६॥ दुर्धरो दुर्वशो नित्यो दुर्दर्पो विजयो जयः । शशः शशाङ्कनयनशीतोष्णः श्रुत्तृषा जरा ॥ ७७॥ आधयो
    व्याधयश्चैव व्याधिहा व्याधिपश्च यः । सह्यो यज्ञमृगव्याधो व्याधिनामाकरोऽकरः ॥ ७८॥ शिखण्डी पुण्डरीकश्च
    पुणडरीकावलोकनः । दण्डधृक्चक्रदण्डश्च रौद्रभागविनाशनः ॥ ७९॥ विषपोऽमृतपश्चैव सुरापः क्षीरसोमपः । मधुपश्चापपश्चैव
    सर्वपश्च बलाबलः ॥ ८०॥ वृषाङ्गराम्भो वृषभस्तथा वृषभलोचनः । वृषभश्चैव विख्यातो लोकानां लोकसंस्कृतः ॥
    ८१॥ चन्द्रादित्यौ चक्षुषी ते हृदयं च पितामहः । अग्निष्टोमस्तथा देहो धर्मकर्मप्रसाधितः ॥ ८२॥ न ब्रह्मा
    न च गोविन्दः पुराणऋषयो न च । माहात्म्यं वेदितुं शक्ता याथातथ्येन ते शिव ॥ ८३॥ शिवा या मूर्तयः सूक्ष्मास्ते
    मह्यं यान्तु दर्शनम् । ताभिर्मां सर्वतो रक्ष पिता पुत्रमिवौरसम् ॥ ८४॥ रक्ष मां रक्षणीयोऽहं तवानघ नमोऽस्तु
    ते । भक्तानुकम्पी भगवान्भक्तश्चाहं सदा त्वयि ॥ ८५॥ यः सहस्राण्यनेकानि पुंसामावृत्य दुर्दृशाम् । तिष्ठत्येकः
    समुद्रान्ते स मे गोप्ताऽस्तु नित्यशः ॥ ८६॥ यं विनिद्रा जितश्वासाः सत्त्वस्थाः समादर्शिनः । ज्योतिः
    पश्यन्ति युञ्जानास्तस्मै योगात्मने नमः ॥ ८७॥ सम्भक्ष्य सर्वभूतानि युगान्ते समुपस्थिते । यः शेते जलमध्यस्थस्तं
    प्रपद्येऽम्बुशायिनम् ॥ ८८॥ प्रविश्य वदनं राहोर्यः सोमं पिबते निशि । ग्रसत्यर्कं च स्वर्भानुर्भूत्वा
    सोमाग्निरे च ॥ ८९॥ अङ्गुष्ठमात्राः पुरुषा देहस्थाः सर्वदेहिनाम् । रक्षन्तु ते च मां नित्यं नित्यं
    चाप्याययन्तु माम् ॥ ९०॥ येनाप्युत्पादिता गर्भा अपो भागगताश्च ये । तेषां स्वाहा स्वधा चैव आप्नुवन्ति
    स्वदन्ति च ॥ ९१॥ येन रोहन्ति देहस्थाः प्राणिनो रोदयन्ति च । हर्षयन्ति न कृष्यन्ति नमस्तेभ्यस्तु नित्यशः
    ॥ ९२॥ ये समुद्रे नदीदुर्गे पर्वतेषु गुहासु च । वृक्षमूलेषु गोष्ठेषु कान्तारगहनेषु च ॥ ९३॥ चतुष्पथेषु
    रथ्यासु चत्वरेषु सभासु च । हस्त्यश्वरथशालासु जीर्णोद्यानालयेषु च ॥ ९४॥ येषु पञ्चसु भूतेषु दिशासु विदिशासु
    च । इन्द्रार्कयोर्मध्यगता ये च चन्द्रार्करश्मिषु ॥ ९५॥ रसातलगता ये च ये च तस्मात्परं गताः । नमस्तेभ्यो
    नमस्तेभ्यो नमस्तेभ्यस्तु सर्वशः ॥ ९६॥ सर्वस्त्वं सर्वगो देवः सर्वभूतपतिर्भवः । सर्वभूतान्तरात्मा च
    तेन त्वं न निमन्त्रितः ॥ ९७॥ त्वमेव चेज्यसे देव यज्ञैर्विविधदक्षिणैः । त्वमेव कर्ता सर्वस्य तेन त्वं
    न निमन्त्रितः ॥ ९८॥ अथवा मायया देव मोहितः सूक्ष्मया तव । तस्मात्तु कारणाद्वाऽपि त्वं मया न निमन्त्रितः
    ॥ ९९॥ प्रसीद मम देवेश त्वमेव शरणं मम । त्वं गतिस्त्वं प्रतिष्ठा च न चान्योऽस्तीति ने मतिः ॥ १००॥ इति
    ब्रह्मपुराणे चत्वारिंशाध्यायान्तर्गतं दक्षकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ४० अथवा
    ३८
