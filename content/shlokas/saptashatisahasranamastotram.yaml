id: saptashatisahasranamastotram
category: sahasranama
name:
  english: saptashatisahasranamastotram
  devanagari: सप्तशतीसहस्रनामस्तोत्रम्
content:
  english: sushtuta phaladayika || 89|| bandhukakancanabha ca balaravidyutistatha | badhaprashamani durga
    bijarupa ca babhravi || 90|| balarkamandalabhasa bahukanyasusevita | brahmadirupini durga mangala
    brahmacarini || 91|| brahmasvarupini medha brahmarupa sureshvari | bhaktakamadugha durga sa badhaharini
    tatha || 92|| durga bhaktanurakta ca bhagavati ca bhushita | bhuktipradayini durga bhadrakali sanatani
    || 93|| bhanusahasrakantishca bhubhrillakshmishca shankhini | bhrantirupa mahotsaha bhasvaddehalata
    tatha || 94|| bhuvaneshi vishoka ca durga bhairavanadini | bhaktismrita sugandha ca bhramari bhumisambhava
    || 95|| durga bhumuktihetushca bhaktanandodaya tatha | sa bhinnanjanasankasha bhogasvargapavargada
    || 96|| durga bhramararupa ca bhutasthitividhayini | bhashakshara sumata durga bhutartiharini || 97||
    sa muktihetubhuta ca durga bhayavinashini | matrirupa surupa ca samhartri bhavatarini || 98|| muktihetuh
    surashreshtha sanmayi bhayaharini | maheshvari sharanya ca durga bhedapradarshini || 99|| maulibaddhendurekha
    ca mahavrishabhavahini | sa mahakalika mata madhukaitabhaghatini || 100|| mahahivalaya maya tatha
    mahishavahini | moharatrishca varahi sumadhumadamadhuri || 101|| durga matrigana vriddhirmayuravaravahana
    | maladhari ca sarvadya mahashaktidhara tatha || 102|| maheshvarisvarupa ca sundari mukuteshvari |
    durga mahisvarupa ca mahakarunyarupini || 103|| mahamarisvarupa ca matrika munisamstuta | mahishasuranirnoshi
    durga mrigapratisthita || 104|| murtirupa ca sarvesha mayurakukkutavrita | muktipradayini durga subhaga
    mahishasana || 105|| mahishantakari durga triguna mrigavahini | sa mundamathana durga shubha mahishamardini
    || 106|| tryambaka yoganidra ca mahatripurasundari | sakshini yamaghanta ca mahadurgavinashini ||
    107|| yajniyaprathama durga shriprada mantramatrika | durga yogeshvari shantih shulini madhumardini
    || 108|| rukmambujasana durga shankari mahishardini | sa rucirakshamala ca satvara mantrarupini ||
    109|| sa mulaprakritirdurga muladharanivasini | mahavilasini durga mohini munimohini || 110|| durga
    rupapratishtha ca yashodagarbhasambhava | vaishnavi rathamarudha ratnabhuta yashasvini || 111|| shivada
    raktavarna ca vijaya rupashalini | varuni raktavastra ca durga raktambara tatha || 112|| sugata raktapada
    ca sakala raktadantika | sakara raktamadhya ca raktasarvangabhushana || 113|| sukanti raktanetra ca
    raktakeshatibhishana | sa raktadashana durga raktatikshnanakha tatha || 114|| sa durga raktacamunda
    durga raktayudha tatha | sa durga raktakesha ca ranatkankananupura || 115|| sa raktavasana durga raktadanti
    tridhodita | rasabhavitavritta ca durga ratnavibhushita || 116|| sa lambodaramata ca lakshmirupa ca
    vak tatha | durga lajjasvarupa ca sa lokavarada tatha || 117|| vrittastani tatha durga vishala vasudhasama
    | durga vijnanarupa ca tatha vrittapayodhara || 118|| varada vedarupa ca durga vishveshvari tatha
    | vyaptalokatraya durga varabhitipradharini || 119|| vairidayavati durga vanditanghriyuga tatha |
    sa durga vishnumaya ca vyaptasthavarajangama || 120|| vallakivadika durga vishvasammohini tatha |
    vishvoparatishakta ca durga vedhasstuta tatha || 121|| sa durga vrittirupa ca citrakhatvangadharini
    | sa durga vyaptidevi ca vishvavibhramika tatha || 122|| vrisharudha tatha durga vidyuddamasamaprabha
    | varadabhitihasta ca durga vistaritanana || 123|| vajrahasta tatha durga vidyamayi vyavasthita |
    vritrapranahara durga vindhyacalanivasini || 124|| varaharupini durga vishvartiharini tatha | sa durga
    vaishnavi shaktirvishvabijam trilocana || 125|| sa durga vaishnavirupa tatha vyadhivinashini | durga
    vivekadipa ca vinapustakadharini || 126|| vishalalocana durga sa vishvaparipalika | sa vishvadharini
    durga tatha vairivinashini || 127|| vishvatmika tatha durga vidhatrivarada tatha | durga vishveshavandya
    ca durga ca vittadayini || 128|| vyaptasakalavishva ca durga ca vrishavahana || vagishvari tatha durga
    sa vidyakarini tatha || 129|| durga vijnanadatri ca durga ca vindhyavasini | sa vishvamohini durga
    tathaiva vishvarupini || 130|| vajrapanistatha durga tathaiva varadayini | vishvamata tatha durga
    tathaiva vajradharini || 131|| vasusangamani durga tatha varadahastaka | vikhyatiga tatha durga tathaiva
    vagadhishvari || 132|| vanchakalpadruma durga vairocani vibhushita | sa vikatasvarupa ca durga vidhivadhustatha
    || 133|| shobhadhara tatha durga vimala shamitashiva | vivasana tathi durga sa shiromalika tatha ||
    134|| shankhacakragadahasta shankhadiparamayudha | shristatha shyamalangi ca durga shrisundari tatha
    || 135|| sa shubhamatida durga shubhagatipradayini | shvetarupadhara durga tatha shokavinashini ||
    136|| shashimaulipratishtha ca durga shabdatmika tatha | sa shatrubhayarupa ca shumbhadaityardini
    tatha || 137|| sa durga shaktirupa ca shushkamamsatibhairava | sa durga shantirupa ca sa shabdajnanarupini
    || 138|| shraddharupa tatha durga shumbhanibarhini tatha | sa durga shubhahetushca sa shunyashunyasakshini
    || 139|| shankhapatra tatha durga shiromalavibhushana | sa durga shaktihasta ca sa shulacakrabhrittatha
    || 140|| sa shivashaktirupa ca durga shashimukhi tatha | shivaduti tatha durga sa shumbhamardini tatha
    || 141|| sa sharanagatatrana durga shastramayi tatha | sa paramayudha durga tathaiva shavavahana ||
    142|| shivadutisvarupa ca durga shakambhari tatha | shrishambhavi tatha durga tathaiva shikhivahana
    || 143| sa durga shailaputri ca durga shashidhara tatha | sa durga shrimahavidya durga shuleshvari
    tatha || 144|| shumbhahantri tatha durga sa shmashanaviharini | shaktidhari tatha durga sakaloddharini
    tatha || 145| sa durga satyarupa ca durga shabdamayi tatha | sakalashabdarupa ca sa bhaktirasabhavita
    || 146|| shvetanana tatha durga sarvakamaphalaprada | sphuratkantistatha durga sarvarupamayi tatha
    || 147|| durga sarvangabhusha ca tatha sarvajaganmayi | samsarabandhahetushca tatha sarveshvareshvari
    || 148|| vashatkara tatha durga sthitisamharakarini | svaratmika tatha durga samutpanna tatha svayam
    || 149|| sa durga srishtirupa ca sa sarojasthita tatha | sthitirupa tatha durga sadabhyudayada tatha
    || 150|| durga samhritirupa ca tathaiva simhavahini | sammanita tatha durga tatha sairibhamardini
    || 151|| surarshistuyamanaca siddhikamasusevita | simhaskandhadhirudha ca durga sarvashraya tatha
    || 152|| durga sarvajagadvarta tatha suryasamaprabha | sa samastajagad hetuh smritibhitihara tatha
    || 153|| sa durga sarvashaktishca durga saumyatara tatha | sa sarvavyapini durga tatha samaranishthura
    || 154|| durga sada''rdracitta ca durga ca sarvakarini | smritirupa tatha durga sahasranayana tatha
    || 155|| durga samastavidya ca durga sarasvati tatha | durga striratnabhuta ca sakshasutrakamandaluh
    || 156|| abjanyastaikapada ca tatha sarvarthasadhika | sa sarvajneshvarankastha sarveshaktisamanvita
    || 157|| smeramukhi tatha durga svargamuktipradayini | sa durga sarvabhuta ca sarvayogasamanvita ||
    158| sarvamadgalamangalya samsararnavatarini | srishtyadishaktibhuta ca svargapavargada tatha || 159||
    stavyapara tatha durga sahasranayanojjvala | sa sarvabhitipatri ca simhastha sarvamangala || 160||
    sarvasyartihara durga sarvabharanabhushita | durga sarvasvarupa ca sarvakamapradayini || 161|| siddhidatri
    tatha durga svarnakalpitakundala | sampujita tatha durga sarvashatruvinashini || 162|| sa durga skandamata
    ca durga sarvagata tatha | sa saubhagyapratishtha ca durga saptashati tatha || 163| sa sattvakhyaguna
    durga sarvasattvamayi tatha | surasurashiroralanighrishtacarana tatha || 164|| sphuraddashanadamshtra
    ca sumeruyugalastani | sa sahasrabhuja durga sucitrajaghana tatha || 165|| saubhagyashalini durga
    saccidanandavigraha | sarvadevamayi durga sarvadevashariraja || 166|| sarveshvari tatha durga sarvalokamaheshvari
    | sarvangabhushana durga sarvanandapayonidhih || 167|| sarvabhayapaha durga sarvakamadudhastani |
    sukarkashastani durga sushvetastanamandala || 168|| sa siddhakunjika durga sa sattvaikagunashraya
    | sukhamayi tatha durga tathaiva suramohini || 169|| snehamayi tatha durga sarvabadhapaharini | siddhiprada
    tatha durga tathaiva sa sudhamayi || 170|| hritsamsthita tatha durga harinetrakritalaya | hamsayuktavimanastha
    himacalakritashraya || 171|| durga hamsasamarudha hatadaityamahabala | himacalasuta durga trishulavaradharini
    || 172|| himacalasutanathasamstuta jnanarupini | hritpundarikamadhyastha durga hastambuja tatha ||
    173|| kshobhitasheshapatala durga kshemakari tatha | kshudharupa tatha durga tridhamatratmika tatha
    || 174|| sa durga kshantirupa ca durga tripurasundari | durga trijagadadhara trimshallocanamalika
    || 175|| durga trailokyavasidya tridashapariveshtita | trailokyatranayukta ca trishulacandradharini
    || 176|| durga vaktraravindashridurga trinayana tatha | sa jnanacinmayatita svayanca jnanacinmayi
    || 177|| || namastasyai namo namah || durgasaptashatistotram yatha loke mahiyate | madhuram madhuranande
    sahasramapi kalpatam || 178|| durga bhaktasubhavabhavitamanah premaspadam prapita harshollasavinodamodakarunasantanasankashika
    | suprita mudita stuta vinayita sampujita vandita mangalyam vitanotu lokajanani stotuh sahasratmika
    || 179|| iti shridurgasaptashatyoddhritam sahasranamastotram sampurnam | sankalanam tatha chandobandhananca
    prakashanam | durgayah sumanastushtyai vartatam catmatriptaye ||
  devanagari: सुष्टुता फलदायिका ॥ ८९॥ बन्धूककाञ्चनाभा च बालरविद्युतिस्तथा । बाधाप्रशमनी दुर्गा बीजरूपा
    च बाभ्रवी ॥ ९०॥ बालार्कमण्डलाभासा बहुकन्यासुसेविता । ब्रह्मादिरूपिणी दुर्गा मङ्गला ब्रह्मचारिणी ॥
    ९१॥ ब्रह्मस्वरूपिणी मेधा ब्रह्मरूपा सुरेश्वरी । भक्तकामदुघा दुर्गा सा बाधाहारिणी तथा ॥ ९२॥ दुर्गा
    भक्तानुरक्ता च भगवती च भूषिता । भुक्तिप्रदायिनी दुर्गा भद्रकाली सनातनी ॥ ९३॥ भानुसहस्रकान्तिश्च भूभृल्लक्ष्मीश्च
    शङ्खिनी । भ्रान्तिरूपा महोत्साहा भास्वद्देहलता तथा ॥ ९४॥ भुवनेशी विशोका च दुर्गा भैरवनादिनी । भक्तिस्मृता
    सुगन्धा च भ्रामरी भूमिसम्भवा ॥ ९५॥ दुर्गा भूमुक्तिहेतुश्च भक्तानन्दोदया तथा । सा भिन्नाञ्जनसङ्काशा
    भोगस्वर्गापवर्गदा ॥ ९६॥ दुर्गा भ्रामररूपा च भूतस्थितिविधायिनी । भाषाक्षरा सुमाता दुर्गा भूतार्तिहारिणी
    ॥ ९७॥ सा मुक्तिहेतुभूता च दुर्गा भयविनाशिनी । मातृरूपा सुरूपा च संहर्त्री भवतारिणी ॥ ९८॥ मुक्तिहेतुः
    सुरश्रेष्ठा सन्मयी भयहारिणी । माहेश्वरी शरण्या च दुर्गा भेदप्रदर्शिनी ॥ ९९॥ मौलिबद्धेन्दुरेखा च महावृषभवाहिनी
    । सा महाकालिका माता मधुकैटभघातिनी ॥ १००॥ महाहिवलया माया तथा महिषवाहिनी । मोहरात्रिश्च वाराही सुमधुमदमाधुरी
    ॥ १०१॥ दुर्गा मातृगणा वृद्धिर्मयूरवरवाहना । मालाधरी च सर्वाद्या महाशक्तिधरा तथा ॥ १०२॥ माहेश्वरीस्वरूपा
    च सुन्दरी मुकुटेश्वरी । दुर्गा महीस्वरूपा च महाकारुण्यरूपिणी ॥ १०३॥ महामारीस्वरूपा च मातृका मुनिसंस्तुता
    । महिषासुरनिर्णोशी दुर्गा मृगप्रतिस्थिता ॥ १०४॥ मूर्तिरूपा च सर्वेशा मयूरकुक्कुटावृता । मुक्तिप्रदायिनी
    दुर्गा सुभगा महिषासना ॥ १०५॥ महिषान्तकरी दुर्गा त्रिगुणा मृगवाहिनी । सा मुण्डमथना दुर्गा शुभा महिषमर्दिनी
    ॥ १०६॥ त्र्यम्बका योगनिद्रा च महात्रिपुरसुन्दरी । साक्षिणी यमघण्टा च महादुर्गविनाशिनी ॥ १०७॥ यज्ञियप्रथमा
    दुर्गा श्रीप्रदा मन्त्रमातृका । दुर्गा योगेश्वरी शान्तिः शूलिनी मधुमर्दिनी ॥ १०८॥ रूक्माम्बुजासना
    दुर्गा शाङ्करी महिषार्दिनी । सा रुचिराक्षमाला च सत्वरा मन्त्ररूपिणी ॥ १०९॥ सा मूलप्रकृतिर्दुर्गा मूलाधारनिवासिनी
    । महाविलासिनी दुर्गा मोहिनी मुनिमोहिनी ॥ ११०॥ दुर्गा रूपप्रतिष्ठा च यशोदागर्भसम्भवा । वैष्णवी रथमारूढा
    रत्नभूता यशस्विनी ॥ १११॥ शिवदा रक्तवर्णा च विजया रूपशालिनी । वारुणी रक्तवस्त्रा च दुर्गा रक्ताम्बरा
    तथा ॥ ११२॥ सुगता रक्तपादा च सकला रक्तदन्तिका । साकारा रक्तमध्या च रक्तसर्वाङ्गभूषणा ॥ ११३॥ सुकान्ती
    रक्तनेत्रा च रक्तकेशातिभीषणा । सा रक्तदशना दुर्गा रक्ततीक्ष्णनखा तथा ॥ ११४॥ सा दुर्गा रक्तचामुण्डा
    दुर्गा रक्तायुधा तथा । सा दुर्गा रक्तकेशा च रणत्कङ्कणनूपुरा ॥ ११५॥ सा रक्तवसना दुर्गा रक्तदन्ती त्रिधोदिता
    । रसभावितवृत्ता च दुर्गा रत्नविभूषिता ॥ ११६॥ सा लम्बोदरमाता च लक्ष्मीरूपा च वाक् तथा । दुर्गा लज्जास्वरूपा
    च सा लोकवरदा तथा ॥ ११७॥ वृत्तस्तनी तथा दुर्गा विशाला वसुधासमा । दुर्गा विज्ञानरूपा च तथा वृत्तपयोधरा
    ॥ ११८॥ वरदा वेदरूपा च दुर्गा विश्वेश्वरी तथा । व्याप्तलोकत्रया दुर्गा वराभीतिप्रधारिणी ॥ ११९॥ वैरिदयावती
    दुर्गा वन्दिताङ्घ्रियुगा तथा । सा दुर्गा विष्णुमाया च व्याप्तस्थावरजङ्गमा ॥ १२०॥ वल्लकीवादिका दुर्गा
    विश्वसम्मोहिनी तथा । विश्वोपरतिशक्ता च दुर्गा वेधस्स्तुता तथा ॥ १२१॥ सा दुर्गा वृत्तिरूपा च चित्रखट्वाङ्गधारिणी
    । सा दुर्गा व्याप्तिदेवी च विश्वविभ्रामिका तथा ॥ १२२॥ वृषारूढा तथा दुर्गा विद्युद्दामसमप्रभा । वरदाभीतिहस्ता
    च दुर्गा विस्तारितानना ॥ १२३॥ वज्रहस्ता तथा दुर्गा विद्यामयी व्यवस्थिता । वृत्रप्राणहरा दुर्गा विन्ध्याचलनिवासिनी
    ॥ १२४॥ वराहरूपिणी दुर्गा विश्वार्तिहारिणी तथा । सा दुर्गा वैष्णवी शक्तिर्विश्वबीजं त्रिलोचना ॥ १२५॥
    सा दुर्गा वैष्णवीरूपा तथा व्याधिविनाशिनी । दुर्गा विवेकदीपा च वीणापुस्तकधारिणी ॥ १२६॥ विशाललोचना दुर्गा
    सा विश्वपरिपलिका । सा विश्वधारिणी दुर्गा तथा वैरिविनाशिनी ॥ १२७॥ विश्वात्मिका तथा दुर्गा विधातृवरदा
    तथा । दुर्गा विश्वेशवन्द्या च दुर्गा च वित्तदायिनी ॥ १२८॥ व्याप्तसकलविश्वा च दुर्गा च वृषवाहना ॥ वागीश्वरी
    तथा दुर्गा सा विद्याकारिणी तथा ॥ १२९॥ दुर्गा विज्ञानदात्री च दुर्गा च विन्ध्यवासिनी । सा विश्वमोहिनी
    दुर्गा तथैव विश्वरूपिणी ॥ १३०॥ वज्रपाणिस्तथा दुर्गा तथैव वरदायिनी । विश्वमाता तथा दुर्गा तथैव वज्रधारिणी
    ॥ १३१॥ वसुसङ्गमनी दुर्गा तथा वरदहस्तका । विख्यातिगा तथा दुर्गा तथैव वागधीश्वरी ॥ १३२॥ वाञ्छाकल्पद्रुमा
    दुर्गा वैरोचनी विभूषिता । सा विकटस्वरूपा च दुर्गा विधिवधूस्तथा ॥ १३३॥ शोभाधारा तथा दुर्गा विमला शमिताशिवा
    । विवसना तथी दुर्गा सा शिरोमालिका तथा ॥ १३४॥ शङ्खचक्रगदाहस्ता शङ्खादिपरमायुधा । श्रीस्तथा श्यामलाङ्गी
    च दुर्गा श्रीसुन्दरी तथा ॥ १३५॥ सा शुभमतिदा दुर्गा शुभगतिप्रदायिनी । श्वेतरूपधरा दुर्गा तथा शोकविनाशिनी
    ॥ १३६॥ शशिमौलिप्रतिष्ठा च दुर्गा शब्दात्मिका तथा । सा शत्रुभयरूपा च शुम्भदैत्यार्दिनी तथा ॥ १३७॥ सा
    दुर्गा शक्तिरूपा च शुष्कमांसातिभैरवा । सा दुर्गा शान्तिरूपा च सा शब्दज्ञानरूपिणी ॥ १३८॥ श्रद्धारूपा
    तथा दुर्गा शुम्भनिबर्हिणी तथा । सा दुर्गा शुभहेतुश्च सा शून्याशून्यसाक्षिणी ॥ १३९॥ शङ्खपात्रा तथा
    दुर्गा शिरोमालाविभूषणा । सा दुर्गा शक्तिहस्ता च सा शूलचक्रभृत्तथा ॥ १४०॥ सा शिवशक्तिरूपा च दुर्गा
    शशिमुखी तथा । शिवदूती तथा दुर्गा सा शुम्भमर्दिनी तथा ॥ १४१॥ सा शरणागतत्राणा दुर्गा शास्त्रमयी तथा
    । सा परमायुधा दुर्गा तथैव शववाहना ॥ १४२॥ शिवदूतीस्वरूपा च दुर्गा शाकम्भरी तथा । श्रीशाम्भवी तथा दुर्गा
    तथैव शिखिवाहना ॥ १४३। सा दुर्गा शैलपुत्री च दुर्गा शशिधरा तथा । सा दुर्गा श्रीमहाविद्या दुर्गा शूलेश्वरी
    तथा ॥ १४४॥ शुम्भहन्त्री तथा दुर्गा सा श्मशानविहारिणी । शक्तिधरी तथा दुर्गा सकलोद्धारिणी तथा ॥ १४५।
    सा दुर्गा सत्यरूपा च दुर्गा शब्दमयी तथा । सकलशब्दरूपा च सा भक्तिरसभाविता ॥ १४६॥ श्वेतानना तथा दुर्गा
    सर्वकामफलप्रदा । स्फुरत्कान्तिस्तथा दुर्गा सर्वरूपमयी तथा ॥ १४७॥ दुर्गा सर्वाङ्गभूषा च तथा सर्वजगन्मयी
    । संसारबन्धहेतुश्च तथा सर्वेश्वरेश्वरी ॥ १४८॥ वषट्कारा तथा दुर्गा स्थितिसंहारकारिणी । स्वरात्मिका
    तथा दुर्गा समुत्पन्ना तथा स्वयम् ॥ १४९॥ सा दुर्गा सृष्टिरूपा च सा सरोजस्थिता तथा । स्थितिरूपा तथा
    दुर्गा सदाभ्युदयदा तथा ॥ १५०॥ दुर्गा संहृतिरूपा च तथैव सिंहवाहिनी । सम्मानिता तथा दुर्गा तथा सैरिभमर्दिनी
    ॥ १५१॥ सुरर्षिस्तूयमानाच सिद्धिकामसुसेविता । सिंहस्कन्धाधिरूढा च दुर्गा सर्वाश्रया तथा ॥ १५२॥ दुर्गा
    सर्वजगद्वार्ता तथा सूर्यसमप्रभा । सा समस्तजगद् हेतुः स्मृतिभीतिहरा तथा ॥ १५३॥ सा दुर्गा सर्वशक्तिश्च
    दुर्गा सौम्यतरा तथा । सा सर्वव्यापिनी दुर्गा तथा समरनिष्ठुरा ॥ १५४॥ दुर्गा सदाऽऽर्द्रचित्ता च दुर्गा
    च सर्वकारिणी । स्मृतिरूपा तथा दुर्गा सहस्रनयना तथा ॥ १५५॥ दुर्गा समस्तविद्या च दुर्गा सरस्वती तथा
    । दुर्गा स्त्रीरत्नभूता च साक्षसूत्रकमण्डलुः ॥ १५६॥ अब्जन्यस्तैकपादा च तथा सर्वार्थसाधिका । सा सर्वज्ञेश्वराङ्कस्था
    सर्वेशक्तिसमन्विता ॥ १५७॥ स्मेरमुखी तथा दुर्गा स्वर्गमुक्तिप्रदायिनी । सा दुर्गा सर्वभूता च सर्वयोगसमन्विता
    ॥ १५८। सर्वमद्गलमङ्गल्या संसारार्णवतारिणी । सृष्ट्यादिशक्तिभूता च स्वर्गापवर्गदा तथा ॥ १५९॥ स्तव्यपरा
    तथा दुर्गा सहस्रनयनोज्ज्वला । सा सर्वभीतिपात्री च सिंहस्था सर्वमङ्गला ॥ १६०॥ सर्वस्यार्तिहरा दुर्गा
    सर्वाभरणभूषिता । दुर्गा सर्वस्वरूपा च सर्वकामप्रदायिनी ॥ १६१॥ सिद्धिदात्री तथा दुर्गा स्वर्णाकल्पितकुण्डला
    । सम्पूजिता तथा दुर्गा सर्वशत्रुविनाशिनी ॥ १६२॥ सा दुर्गा स्कन्दमाता च दुर्गा सर्वगता तथा । सा सौभाग्यप्रतिष्ठा
    च दुर्गा सप्तशती तथा ॥ १६३। सा सत्त्वाख्यगुणा दुर्गा सर्वसत्त्वमयी तथा । सुरासुरशिरोरलनिघृष्टचरणा
    तथा ॥ १६४॥ स्फुरद्दशनदंष्ट्रा च सुमेरुयुगलस्तनी । सा सहस्रभुजा दुर्गा सुचित्रजघना तथा ॥ १६५॥ सौभाग्यशालिनी
    दुर्गा सच्चिदानन्दविग्रहा । सर्वदेवमयी दुर्गा सर्वदेवशरीरजा ॥ १६६॥ सर्वेश्वरी तथा दुर्गा सर्वलोकमहेश्वरी
    । सर्वाङ्गभूषणा दुर्गा सर्वानन्दपयोनिधिः ॥ १६७॥ सर्वभयापहा दुर्गा सर्वकामदुधस्तनी । सुकर्कशस्तनी दुर्गा
    सुश्वेतस्तनमण्डला ॥ १६८॥ सा सिद्धकुञ्जिका दुर्गा सा सत्त्वैकगुणाश्रया । सुखमयी तथा दुर्गा तथैव सुरमोहिनी
    ॥ १६९॥ स्नेहमयी तथा दुर्गा सर्वबाधापहारिणी । सिद्धिप्रदा तथा दुर्गा तथैव सा सुधामयी ॥ १७०॥ हृत्संस्थिता
    तथा दुर्गा हरिनेत्रकृतालया । हंसयुक्तविमानस्था हिमाचलकृताश्रया ॥ १७१॥ दुर्गा हंससमारूढा हतदैत्यमहाबला
    । हिमाचलसुता दुर्गा त्रिशूलवरधारिणी ॥ १७२॥ हिमाचलसुतानाथसंस्तुता ज्ञानरूपिणी । हृत्पुण्डरीकमध्यस्था
    दुर्गा हस्ताम्बुजा तथा ॥ १७३॥ क्षोभिताशेषपाताला दुर्गा क्षेमकरी तथा । क्षुधारूपा तथा दुर्गा त्रिधामात्रात्मिका
    तथा ॥ १७४॥ सा दुर्गा क्षान्तिरूपा च दुर्गा त्रिपुरसुन्दरी । दुर्गा त्रिजगदाधारा त्रिंशल्लोचनमालिका
    ॥ १७५॥ दुर्गा त्रैलोक्यवासीड्या त्रिदशपरिवेष्टिता । त्रैलोक्यत्राणयुक्ता च त्रिशूलचन्द्रधारिणी ॥ १७६॥
    दुर्गा वक्त्रारविन्दश्रीदुर्गा त्रिनयना तथा । सा ज्ञानचिन्मयातीता स्वयञ्च ज्ञानचिन्मयी ॥ १७७॥ ॥ नमस्तस्यै
    नमो नमः ॥ दुर्गासप्तशतीस्तोत्रं यथा लोके महीयते । मधुरं मधुरानन्दे सहस्रमपि कल्पताम् ॥ १७८॥ दुर्गा
    भक्तसुभावभावितमनाः प्रेमास्पदं प्रापिता हर्षोल्लासविनोदमोदकरुणासन्तानसङ्काशिका । सुप्रीता मुदिता स्तुता
    विनयिता सम्पूजिता वन्दिता माङ्गल्यं वितनोतु लोकजननी स्तोतुः सहस्रात्मिका ॥ १७९॥ इति श्रीदुर्गासप्तशत्योद्धृतं
    सहस्रनामस्तोत्रं सम्पूर्णम् । सङ्कलनं तथा छन्दोबन्धनञ्च प्रकाशनम् । दुर्गायाः सुमनस्तुष्ट्यै वर्ततां
    चात्मतृप्तये ॥
