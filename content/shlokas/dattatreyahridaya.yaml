id: dattatreyahridaya
category: hridaya
name:
  english: dattatreyahridaya
  devanagari: दत्तात्रेयहृदय
content:
  english: dattaprasadasiddhyarthe jape viniyogah || atha karanyasah | om dram angushthabhyam namah |
    om drim tarjanibhyam namah | om drum madhyamabhyam namah | om draim anamikabhyam namah | om draum
    kanishthikabhyam namah | om drah karatalakaraprishthabhyam namah || atha anganyasah | om dram hridayaya
    namah | om drim shirase svaha || om drum shikhayai vashat || om draim kavacaya hum || om draum netratrayaya
    vaushat || om drah astraya phat || om bhurbhuvah svaromiti digbandhah || dhyanam | balacandrasushubhe
    ca kirite pushpaharamaniyuktavakshakam pitavastraparishobhitamadhyam pranamamyanusuyodbhavadattam
    || 1|| dattam sanatanam nityam nirvikalpam niramayam | harim shivam mahadevam sarvabhutopakarakam
    || 2|| narayanam mahavishnum sargasthityantakarinam | nirakaram ca sarvesham kartavirya varapradam
    || 3|| atriputram mahatejam munivandyam janardanam | drambijam varadam shuddham hrim bijena samanvitam
    || 4|| sharanyam shashvatam yuktam mayaya ca gunanvitam | trigunam trigunatitam triyamapatimaulikam
    || 5|| ramam ramapatim krishnam govindam pitavasasam | digambaram nagaharam vyaghracarmottariyakam
    || 6|| bhasmagandhadiliptangam mayamuktam jagatpatim | nirgunam ca gunopetam vishvavyapinamishvaram
    || 7|| dhyatva devam mahatmanam vishvavandyam prabhum gurum | kiritakundalabhyam ca yuktam rajivalocanam
    || 8|| candranujam candravaktram rudram indradivanditam | anusuyakalatram ca dineshamamaradhipam ||
    9|| yogisha devadevesha abjajanmadivandita | narayana virupaksha dattatreya namo'stu te || 10|| ananta
    kamalakanta audumbarasthita prabho | niranjana mahayogin dattayetra namo'stu te || 11|| mahabaho munimane
    sarvavidyavisharada | sthavaram jangamanam ca dattatreya namo'stu te || 12|| aimdryam tratu mahaviryo
    vanhyam pranavapurvakam | yamyam dattatrayo rakshennairrityam bhaktavatsalah || 13|| praticyam patu
    yogisho yoginam hridaye sthitah | anilyam varadah shambhuh kauberyam jagatah prabhuh || 14|| ekaksharo
    mahamantrah sarvamantreshu vishrutah | ashtaksharah sarvasiddhih sarvatantreshu gopitah || 15|| ishanyam
    patu me ramo urdhvam patu mahamunih | shadaksharo mahamantrah patvadhastajjagatpita || 16|| evam panktidasho
    rakshedyadurajavarapradah | akaradikshakarantam sada rakshedvibhuh svayam || 17|| adinathasya dattasya
    hridayam sarvakamadam | dattam datta punardattam yovadedbhaktisamyutah || 18|| tasya papani sarvani
    kshayam yanti na samshayah | ya idam pathate nityam hridayam sarvakamadam || 19|| pishacashakinibhutadakini
    shakini tatha | brahmarakshasavetala jhotinga balabhutakah || 20|| gacchanti pathanaddevi natra karya
    vicarana | apavargapradam sakshat manorathaprapurakam || 21|| ekavaram dvivaram ca trivaram ca pathennarah
    | janmamrityum ca duhkham ca sukham prapnoti bhaktiman || 22|| gopaniyam prayatnena jananijaravatpriye
    | nadeyam durhride stotram hridayakhyam ca bhamini || 23|| gurubhaktaya datavyam anyatha naprakashayet
    | tava snehacca kathita bhaktim jnatva maya shubhe || 24|| dattatreyasya kripaya sabhaveddirghamayukah
    || 25|| iti shrirudrayamale shivaparvatisamvade dattahridayastotram sampurnam ||
  devanagari: दत्तप्रसादसिद्ध्यर्थे जपे विनियोगः ॥ अथ करन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं
    तर्जनीभ्यां नमः । ॐ द्रूं मध्यमाभ्यां नमः । ॐ द्रैं अनामिकाभ्यां नमः । ॐ द्रौं कनिष्ठिकाभ्यां नमः
    । ॐ द्रः करतलकरपृष्ठाभ्यां नमः ॥ अथ अङ्गन्यासः । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा ॥ ॐ द्रूं
    शिखायै वषट् ॥ ॐ द्रैं कवचाय हुं ॥ ॐ द्रौं नेत्रत्रयाय वौषट् ॥ ॐ द्रः अस्त्राय फट् ॥ ॐ भूर्भुवः स्वरोमिति
    दिग्बन्धः ॥ ध्यानम् । बालचन्द्रसुशुभे च किरीटे पुष्पहारमणियुक्तवक्षकम् पीतवस्त्रपरिशोभितमध्यं प्रणमाम्यनुसुयोद्भवदत्तम्
    ॥ १॥ दत्तं सनातनं नित्यं निर्विकल्पं निरामयम् । हरिं शिवं महादेवं सर्वभूतोपकारकम् ॥ २॥ नारायणं महाविष्णुं
    सर्गस्थित्यन्तकारिणम् । निराकारं च सर्वेशं कार्तवीर्य वरप्रदम् ॥ ३॥ अत्रिपुत्रं महातेजं मुनिवन्द्यं
    जनार्दनम् । द्राम्बीजं वरदं शुद्धं ह्रीं बीजेन समन्वितम् ॥ ४॥ शरण्यं शाश्वतं युक्तं मायया च गुणान्वितम्
    । त्रिगुणं त्रिगुणातीतं त्रियामापतिमौलिकम् ॥ ५॥ रामं रमापतिं कृष्णं गोविन्दं पीतवाससम् । दिगम्बरं
    नागहारं व्याघ्रचर्मोत्तरीयकम् ॥ ६॥ भस्मगन्धादिलिप्ताङ्गं मायामुक्तं जगत्पतिम् । निर्गुणं च गुणोपेतं
    विश्वव्यापिनमीश्वरम् ॥ ७॥ ध्यात्वा देवं महात्मानं विश्ववन्द्यं प्रभुं गुरुम् । किरीटकुण्डलाभ्यां च
    युक्तं राजीवलोचनम् ॥ ८॥ चन्द्रानुजं चन्द्रवक्त्रं रुद्रं इन्द्रादिवन्दितम् । अनुसूयाकलत्रं च दिनेशममराधिपम्
    ॥ ९॥ योगीश देवदेवेश अब्जजन्मादिवन्दित । नारायण विरूपाक्ष दत्तात्रेया नमोऽस्तु ते ॥ १०॥ अनन्त कमलाकान्त
    औदुम्बरस्थित प्रभो । निरञ्जन महायोगिन् दत्तायेत्र नमोऽस्तु ते ॥ ११॥ महाबाहो मुनिमणे सर्वविद्याविशारद
    । स्थावरं जङ्गमानां च दत्तात्रेय नमोऽस्तु ते ॥ १२॥ ऐंद्र्यां त्रातु महावीर्यो वन्ह्यां प्रणवपूर्वकम्
    । याम्यां दत्तात्रयो रक्षेन्नैरृत्यां भक्तवत्सलः ॥ १३॥ प्रतीच्यां पातु योगीशो योगिनां हृदये स्थितः
    । आनिल्यां वरदः शम्भुः कौबेर्यां जगतः प्रभुः ॥ १४॥ एकाक्षरो महामन्त्रः सर्वमन्त्रेषु विश्रुतः । अष्टाक्षरः
    सर्वसिद्धिः सर्वतन्त्रेषु गोपितः ॥ १५॥ ईशान्यां पातु मे रामो ऊर्ध्वं पातु महामुनिः । षडक्षरो महामन्त्रः
    पात्वधस्ताज्जगत्पिता ॥ १६॥ एवं पङ्क्तिदशो रक्षेद्यदुराजवरप्रदः । अकारादिक्षकारान्तं सदा रक्षेद्विभुः
    स्वयम् ॥ १७॥ आदिनाथस्य दत्तस्य हृदयं सर्वकामदम् । दत्तं दत्त पुनर्दत्तं योवदेद्भक्तिसंयुतः ॥ १८॥ तस्य
    पापानि सर्वाणि क्षयं यान्ति न संशयः । या इदं पठते नित्यं हृदयं सर्वकामदम् ॥ १९॥ पिशाचशाकिनीभूताडाकिनी
    शाकिनी तथा । ब्रह्मराक्षसवेताला झोटिङ्गा बालभूतकाः ॥ २०॥ गच्छन्ति पठनाद्देवि नात्र कार्या विचारणा
    । अपवर्गप्रदं साक्षात् मनोरथप्रपूरकम् ॥ २१॥ एकवारं द्विवारं च त्रिवारं च पठेन्नरः । जन्ममृत्युं च
    दुःखं च सुखं प्राप्नोति भक्तिमान् ॥ २२॥ गोपनीयं प्रयत्नेन जननीजारवत्प्रिये । नदेयं दुर्हृदे स्तोत्रं
    हृदयाख्यं च भामिनि ॥ २३॥ गुरुभक्ताय दातव्यं अन्यथा नप्रकाशयेत् । तव स्नेहाच्च कथित भक्तिं ज्ञात्वा
    मया शुभे ॥ २४॥ दत्तात्रेयस्य कृपया सभवेद्दीर्घमायुकः ॥ २५॥ इति श्रीरुद्रयामले शिवपार्वतीसंवादे दत्तहृदयस्तोत्रं
    सम्पूर्णम् ॥
