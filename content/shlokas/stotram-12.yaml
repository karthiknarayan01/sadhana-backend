id: stotram-12
category: stotram
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: satyam punah sarvatha om nama iti | namah shivaya sambaya saganaya sasunave | pradhanapurusheshaya
    sargasthityantahetave || 21|| namaste girijanatha bhaktanamishtadayaka | dehi bhaktim tvayishana sarvabhishtam
    ca dehi me || 22|| samba shambho mahadeva dayasagara shankara | maccittabhramaro nityam tavastu padapankaje
    || 23|| sarvartha sharva sarvesha sarvottama maheshvara | tava namamritam divyam jihvagre mama tishthatu
    || 24|| yadaksharam padam bhrashtam matrahinam ca yad bhavet | tatsarvam kshamyatam deva prasida parameshvara
    || 25|| karacaranakritam vakkayajam karmajam va shravananayanajam va manasam vaparadham | vihitamavihitam
    va sarvametat kshamasva jayajaya karunabdhe shrimahadeva shambho || 26|| kayena vaca manasendriyairva
    buddhya''tmana va prakriteh svabhavat | karomi yadyat sakalam parasmai sadashivayeti samarpayami ||
    27|| || om tatsat iti shrimukhyashivasahasranamastotram sampurnam ||
  devanagari: सत्यं पुनः सर्वथा ॐ नम इति । नमः शिवाय साम्बाय सगणाय ससूनवे । प्रधानपुरुषेशाय सर्गस्थित्यन्तहेतवे
    ॥ २१॥ नमस्ते गिरिजानाथ भक्तानामिष्टदायक । देहि भक्तिं त्वयीशान सर्वाभीष्टं च देहि मे ॥ २२॥ साम्ब शम्भो
    महादेव दयासागर शङ्कर । मच्चित्तभ्रमरो नित्यं तवास्तु पदपङ्कजे ॥ २३॥ सर्वार्थ शर्व सर्वेश सर्वोत्तम
    महेश्वर । तव नामामृतं दिव्यं जिह्वाग्रे मम तिष्ठतु ॥ २४॥ यदक्षरं पदं भ्रष्टं मात्राहीनं च यद् भवेत्
    । तत्सर्वं क्षम्यतां देव प्रसीद परमेश्वर ॥ २५॥ करचरणकृतं वाक्कायजं कर्मजं वा श्रवणनयनजं वा मानसं वापराधम्
    । विहितमविहितं वा सर्वमेतत् क्षमस्व जयजय करुणाब्धे श्रीमहादेव शम्भो ॥ २६॥ कायेन वाचा मनसेन्द्रियैर्वा
    बुद्ध्याऽऽत्मना वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै सदाशिवायेति समर्पयामि ॥ २७॥ ॥ ॐ तत्सत्
    इति श्रीमुख्यशिवसहस्रनामस्तोत्रं सम्पूर्णम् ॥
