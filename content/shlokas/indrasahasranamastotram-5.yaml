id: indrasahasranamastotram-5
category: stotram
name:
  english: indrasahasranamastotram
  devanagari: इन्द्रसहस्रनामस्तोत्रम्
content:
  english: prashat || 22|| prabhangimahisho bhimo bhuryasutirashastiha | prasakshi vishpatirvirah paraspah
    shavassaspatih || 23|| || iti dvitiyam namashatakam || purudatrah pitritamah purukshurbhiguh panih
    | pratvakshanah puram darmapanasyurbhimatiha || 24|| prithivya vrishabhah pratnah pramandi prathamah
    prithuh | tyah samudravyacah payuh praketashcarshanisahah || 25|| karudhayah kavivridhah kaninah kratumankratuh
    | kshapavasta kavitamo girvahah kiricodanah || 26|| kshapavankaushikah kari rajakshamyasya gopatih
    | gaurgorduro duro'shcasya yavasyadura adurih || 27|| candrabudhnashcarshaniprashcakrityashcodayanmatih
    | candrabhanushcitratamashcamrishashcacakramasajah || 28|| tuvishushmastuvidyumnastuvijatastuvimadhah
    | tuvikurmistuvimrakshastuvishagmastuvipratih || 29|| tuvinrimnastuvigrivastuviradhastuvikratuh |
    tuvimatrastuvigrabhastuvideshnastuvishvanih || 30|| tutujitstavasastakvastuvigristurvanistradah |
    ratheshthastaranistumrastvishimananapacyutah || 31|| todastarutrastavishi mushanastavishastura | titirva
    taturistrata bhurnisturnistavastarah || 32|| yajnavriddho yajniyanam prathamo yajvano vridhah | amitrakhado'nimisho
    vishuno'sunvanto'jurah || 33|| akshitotirdabhyo'ryah shiprinivanagorudhah | ashrutkarno'ntarikshapra
    amitauja arishtutah || 34|| || iti tritiyam namashatakam || adrishta ekaradurdhva urdhvasanah sanadyuva
    | sthirah suryah svabhutyojah satyaradhah sanashrutah || 35|| prakalpah sattvanam keturacyutacyuduruvyacah
    | shavasi svapatih svojah shacivanavididhayuh || 36|| satyashushmah satyasatva sunuh satyasya somapah
    | dasyorhanta divo dharta raja divyasya cetanah || 37|| rigmiyo'rva rocamano rabhoda ritapa ritah
    | rijishi ranakridreva nritviyo radhracodanah || 38|| rishvorayo'vaniraja rayisthano radavasuh | ribhuksha
    animano'shcah sahamanah samudriyah || 39|| rinakatirgirvarnasyuh kijah khidvakhajankarah | rijisho
    vasuvidvenyo vajeshu dadhrishah kavih || 40|| virapshi vilito vipro vishvaveda ritavridhah | ritayugdharmakriddhenurdhanajiddhamavarmavat
    || 41|| ritejah sakshanih somyah samsrishtijidribhushthirah | ritayuh sabalah sahyurvajravaha ricishamah
    || 42|| rigmidadhrishvanrishvaujah sugopah svayashastarah | svabhishtisumnah sehanah sunitih sukritah
    shucih || 42|| rinayah sahasah sunuh sudanuh sagano vasuh | stomyah samadva satraha stomavaha ritishahah
    || 44|| || iti caturtham namashatakam || shavishthah shavasah putrah shatamanyuh shatakratuh | shakrah
    shikshanarah shushmi shrutkarnah shravayatsakha || 45|| shatamutih shardhanitih shatanithah shatamaghah
    | shloki shivatamah shrutyam namabibhradananatah || 46|| shurah shipri sahasrotih shubhrah shrinkshangavrishonapat
    | shasah shaki shravaskamah shavasavanahamsanah || 47|| surupakritrurishanah shushuvanah shacipatih
    | satinasatva sanita shaktivanamitakratuh || 48|| sahasracetah sumanah shrutyah shuddhah shrutamaghah
    | satradava somapava sukratuh shmashrushu shritah || 49|| codapravriddho vishvasya jagatah pranataspatih
    | cautrah suprakarasrona cakramanah sadavridhah || 50|| svabhishtih satpatih satyashcarurviratamashcati
    | citrashcikitvanajnata pratimanam satah satah || 51|| sthatah sacetah sadivah sudamsah sushravastamah
    | sahodah sushrutah samratsuparah sunvatah sakha || 52|| brahmavahastamo brahma vishnurvasvahpatirharih
    | ranaya samskrito rudro raniteshanakricchivah || 53|| viprajuto vipratamo yahvo vajri hiranyayah
    | vavro viratarovayurmatarishva marutsakha || 54|| gurtashrava vishvagurto vandanashrudvicakshanah
    | vrishnirvasupatirvaji vrishabho vajini vasuh || 55|| || iti pancamam namashatakam || vigro vibhishano
    vahnirvriddhayurvishruto vrisha | vrajabhridvritraha vriddho vishvavaro vritancayah || 56|| vrishajutirvrisharatho
    vrishabhanno vrishakratuh | vrishakarma vrishamanah sudakshah sunvato vridhah || 57|| adroghavagasuraha
    vedhah satrakaro'jarah | aparah suhavo'bhirurabhibhango'ngirastamah || 58|| amartyah svayudho'shatrurapratito'bhimatishat
    | amatri sunurarcatryah samaddishtirabhayankarah || 59|| abhineta sparharadhah saptarashmirabhishtikrit
    | anarvasvarjidishkarta stotrinamavitoparah || 60|| ajatashatruh senani rubhayavyubhayankarah | urugayahsatyayonih
    sahasvanurvarapatih || 61|| ugro gopa ugrabahurugradhanvokthavardhanah | gathashrava giram raja gambhiro
    girvanastamah || 62|| vajrahastacarshaninam vrishabho vajradakshinah | somakamah somapatih somavriddhah
    sudakshinah || 63|| subrahma sthavirah surah sahishtah saprathah sarat | harishmasharurharivanharinam
    patirastritah || 64|| hiranyabahururvyutirharikesho hirimashah | harishipro haryamano harijato harimbharah
    || 65|| hiranyavarno haryashco harivarpa haripriyah | hanishtho haryakshvo havyo harishtha hariyojanah
    || 66|| || iti shashtham namashatakam || satvasushiprah sukshatrah suvirah sutapa rishih | gathanyo
    gotrabhidgramam vahamano gaveshanah || 67|| jishnustasthusha ishano ishano jagato nrituh | naryani
    vidvannripatih netanrimnasya tutujih || 68|| nimedhamano naryapah sindhunam patiruttarah | naryo niyutvannicito
    nakshaddabhonahushtarah || 69|| navyo nidhata nrimanah sadhricinah sutarenah | nritamano nadanumannaviyannritamonrijit
    || 70|| vicayishtho vajrabahurvritrakhadovalam rujah | jatubharma jyeshthatamo janabhaksho janamsahah
    || 71|| vishvashadvamsagovasyannishpadashanimannrishat | purbhitpurashadabhishat jagatastasthushaspatih
    || 72|| samvriksamatsusandhata susankshadriksavita'runah | svaryah svarocih sutrama stushyeyyah sanajah
    svarih || 73|| krinvannaketave ketuh peshah krinvannapeshase | vajrena hatvi mahino marutstotro marudgahnah
    || 74|| mahaviro mahavrato mahayyah pramatirmahi | mata maghonam mamhishtho manyumirmanyumattamah
    || 75|| mesho mahivrinmanmadano mahinavanmahematih | mrakshomriliko mamhishtho mrakshakritva mahamahah
    || 76|| madacunmarditamadva madanam patiratapah | sushastih svastidah svardrigradhanamakarah patih
    || 77|| || iti saptamam namashatakam || ishuhasta isham data vasudata vidadvasuh | vibhutirvyanashirveno
    variyan vishvajidvibhuh || 78|| nricakshah sahurih svarvitsuyajnah sushthutah svayuh | apih prithivya
    janita suryasya janita shrutah || 79|| shpankshadvivahayah smatputandhirvrishaparva vrishantamah |
    sadharanah sukharathah svashcah satrajidadbhutah || 80|| jyeshtharajo jiradanurjagmirvitvakshano vashi
    | vidhata vishvama ashurmayi vriddhamahavridhah || 81|| varenyo vishvaturvatsyeshano dyaurvicarshanih
    | satinamanyurgodatrah sadyojatovibhanjanuh || 82|| vitantasayyo vajanam vibhakta vasva akarah | virako
    virayurvajram babhrivirenya aghrinih || 83|| vajineyo vajanirvajanam patirajikrit | vastoshpatirvarpanitirvisham
    raja vapodarah || 84|| vibhutadyumna acakriradari dodhato vadhah | akhandalo dasmavarcah sarvaseno
    vimocanah || 85|| vajrasya bharta varyanam patirgojidgavam patih | vishvavyacah sankshancakanah suhardo
    janita divah || 86|| samantunama purudha pratiko brihatah patih | didhyano damano data dirghashravasa
    ribhvasah || 87|| damsanavandivah sammraddetavajuto divavasuh | dashamo devata daksho dudhrodyumni
    dyumantamah || 88|| || ityashtamam namashatakam || mamhinkshashtharaturitthadhirdidyano dadhrishirdudhih
    | dushtariturdushcyavano divomano divovrisha || 89|| dakshayyo dasyuhadhrishnuh dakshinavan dhiyavasuh
    | dhanaspriddhrishito dhata dayamano dhananjayah || 90|| divyo dvibarha sannaryah samaryastrah simah
    sakha | dyukshah samano damsishtho radhasah patiradhriguh || 91|| samrat pithivya ojasvan vayodha
    ritupa ribhuh | eko rajaidhamanadvidekavira urujayah || 92|| lokakrijjanita'shcanam janita gavam |
    jarita janusham raja girvanah sunvato'vita || 93|| atkam vasanah krishtinam rajokthyah shipravanuruh
    | idyodashvaninatamo dhorah sankrandanah svavan || 94|| jagrivirjagato raja gritso goviddhanadhanah
    | jeta'bhibhurakuparo danavanasurorna'vah || 95|| dhrishvirdamunastavasastaviyanantamo'vritah | rayodata
    rayipatih vipashcidvritrahantamah || 96|| aparitah shalapashcad dadhvayutkara aritah | vohlavanishtho
    vrishnyavanvrishanvanvriko'vatah || 97|| garbho'samashtakavyoyugahishushmodadhrishvanih | pratrah
    parirvajadava jyotih karta giram patih || 98|| || iti navamam namashatakam || anavadyah sambhritashco
    vajrivadadrivandyuman | dasmo yajatro yodhiyanakavariryatankarah || 99|| pridakusanurojiyan brahmanashcoditah
    yamah | vandaneshthah puram bheta bandhureshtha brihaddivah || 100|| varuta madhuno raja pranenih
    paprathi yuva | urushamsohavamshrota bhuridava brihacchravah || 101|| mata stiyanam vrishabho mahodata
    mahavadhah | sugmyah suradhah satrashadodatinam nadodhunih || 102|| akamakarshanah svarshah sumrilikah
    sahaskritah | pastyasya hota sindhunam vrishabhojo rathitamah || 103|| sakha muninam janidah svadhavanasamo'pratih
    | manasvanadhvaro maryo bribaduktho'vita bhagah || 104|| ashahlo'rihla adarta viram kartam vishaspatih
    | eko havyah sanadarugokovakasya sakshanih | suvriktiramrito'mriktah khajakridvaladah shunah || 106||
    amatro mitra akayyah sudamabjin mahomahi | rathah subahurushana sunitho bhuridah sudah || 107|| madasya
    raja somasya pitvijyandivah patih | tavishivandhano yudhmo havanashrutsahah svarat || 108|| || iti
    dashamam namashatakam || || atreme bhavantyupasamharashlokah || idam sahasramindrasya namnam paramapavanam
    | rigvedato ganapatih sangrihya vinibaddhavan || 1|| natra namnah paunaruktyam na
  devanagari: प्रषाट् ॥ २२॥ प्रभङ्गीमहिषो भीमो भूर्यासुतिरशस्तिहा । प्रसक्षी विश्पतिर्वीरः परस्पाः शवस्सस्पतिः
    ॥ २३॥ ॥ इति द्वितीयं नामशतकम् ॥ पुरुदत्रः पितृतमः पुरुक्षुर्भीगुः पणिः । प्रत्वाक्षाणः पुरां दर्मापनस्युर्भिमातिहा
    ॥ २४॥ पृथिव्या वृषभः प्रत्नः प्रमन्दी प्रथमः पृथुः । त्यः समुद्रव्यचाः पायुः प्रकेतश्चर्षणीसहः ॥ २५॥
    कारुधायाः कविवृधः कनीनः क्रतुमान्क्रतुः । क्षपावस्ता कवितमो गिर्वाहाः कीरिचोदनः ॥ २६॥ क्षपावान्कौशिकः
    कारी राजाक्षम्यस्य गोपतिः । गौर्गोर्दुरो दुरोऽश्चस्य यवस्यदुर आदुरिः ॥ २७॥ चन्द्रबुध्नश्चर्षणिप्राश्चकृत्यश्चोदयन्मतिः
    । चन्द्रभानुश्चित्रतमश्चम्रीषश्चचक्रमासजः ॥ २८॥ तुविशुष्मस्तुविद्युम्नस्तुविजातस्तुवीमधः । तुविकूर्मिस्तुविम्रक्षस्तुविशग्मस्तुविप्रतिः
    ॥ २९॥ तुविनृम्णस्तुविग्रीवस्तुविराधास्तुविक्रतुः । तुविमात्रस्तुविग्राभस्तुविदेष्णस्तुविष्वणिः ॥ ३०॥
    तूतुजित्स्तवसस्तक्वस्तुविग्रिस्तुर्वणिस्त्रदः । रथेष्ठस्तरणिस्तुम्रस्त्विषीमाननपच्युतः ॥ ३१॥ तोदस्तरुत्रस्तविषी
    मुषाणस्तविषस्तुरा । तितिर्वा ततुरिस्त्राता भूर्णिस्तूर्णिस्तवस्तरः ॥ ३२॥ यज्ञवृद्धो यज्ञियानां प्रथमो
    यज्वनो वृधः । अमित्रखादोऽनिमिषो विषुणोऽसुन्वन्तोऽजुरः ॥ ३३॥ अक्षितोतिर्दाभ्योऽर्यः शिप्रिणीवानगोरुढः
    । आश्रुत्कर्णोऽन्तरिक्षप्रा अमितौजा अरिष्टुतः ॥ ३४॥ ॥ इति तृतीयं नामशतकम् ॥ अदृष्ट एकराडूर्ध्व ऊर्ध्वसानः
    सनाद्युवा । स्थिरः सूर्यः स्वभूत्योजाः सत्यराधाः सनश्रुतः ॥ ३५॥ प्रकल्पः सत्त्वानां केतुरच्युतच्युदुरुव्यचाः
    । शवसी स्वपतिः स्वोजाः शचीवानविदीधयुः ॥ ३६॥ सत्यशुष्मः सत्यसत्वा सूनुः सत्यस्य सोमपाः । दस्योर्हन्ता
    दिवो धर्ता राजा दिव्यस्य चेतनः ॥ ३७॥ ऋग्मियोऽर्वा रोचमानो रभोदा ऋतपा ऋतः । ऋजीषी रणकृद्रेवा नृत्वियो
    रध्रचोदनः ॥ ३८॥ ऋष्वोरायोऽवनीराजा रयिस्थानो रदावसुः । ऋभुक्षा अनिमानोऽश्चः सहमानः समुद्रियः ॥ ३९॥
    ऋणकातिर्गिर्वर्णस्युः कीजः खिद्वाखजङ्करः । ऋजीषो वसुविद्वेन्यो वाजेषु दधृषः कविः ॥ ४०॥ विरप्शी वीलितो
    विप्रो विश्ववेदा ऋतावृधः । ऋतयुग्धर्मकृद्धेनुर्धनजिद्धामवर्मवाट् ॥ ४१॥ ऋतेजाः सक्षणिः सोम्यः संसृष्टिजिदृभुष्ठिरः
    । ऋतयुः सबलः सह्युर्वज्रवाहा ऋचीषमः ॥ ४२॥ ऋग्मीदधृष्वानृष्वौजाः सुगोपाः स्वयशस्तरः । स्वभिष्टिसुम्नः
    सेहानः सुनीतिः सुकृतः शुचिः ॥ ४२॥ ऋणयाः सहसः सूनुः सुदानुः सगणो वसुः । स्तोम्यः समद्वा सत्राहा स्तोमवाहा
    ऋतीषहः ॥ ४४॥ ॥ इति चतुर्थं नामशतकम् ॥ शविष्ठः शवसः पुत्रः शतमन्युः शतक्रतुः । शक्रः शिक्षानरः शुष्मी
    श्रुत्कर्णः श्रवयत्सखा ॥ ४५॥ शतमूतिः शर्धनीतिः शतनीथः शतामघः । श्लोकी शिवतमः श्रुत्यं नामबिभ्रदनानतः
    ॥ ४६॥ शूरः शिप्री सहस्रोतिः शुभ्रः शृङ्क्षङ्गवृषोनपात् । शासः शाकी श्रवस्कामः शवसावानहंसनः ॥ ४७॥ सुरूपकृत्रुरीशानः
    शूशुवानः शचीपतिः । सतीनसत्वा सनिता शक्तीवानमितक्रतुः ॥ ४८॥ सहस्रचेताः सुमनाः श्रुत्यः शुद्धः श्रुतामघः
    । सत्रादावा सोमपावा सुक्रतुः श्मश्रुषु श्रितः ॥ ४९॥ चोदप्रवृद्धो विश्वस्य जगतः प्राणतस्पतिः । चौत्रः
    सुप्रकरस्रोना चक्रमानः सदावृधः ॥ ५०॥ स्वभिष्टिः सत्पतिः सत्यश्चारुर्वीरतमश्चती । चित्रश्चिकित्वानाज्ञाता
    प्रतिमानं सतः सतः ॥ ५१॥ स्थाताः सचेताः सदिवः सुदंसाः सुश्रवस्तमः । सहोदः सुश्रुतः सम्राट्सूपारः सुन्वतः
    सखा ॥ ५२॥ ब्रह्मवाहस्तमो ब्रह्मा विष्णुर्वस्वःपतिर्हरिः । रणाय संस्कृतो रुद्रो रणितेशानकृच्छिवः ॥
    ५३॥ विप्रजूतो विप्रतमो यह्वो वज्री हिरण्ययः । वव्रो वीरतरोवायुर्मातरिश्वा मरुत्सखा ॥ ५४॥ गूर्तश्रवा
    विश्वगूर्तो वन्दनश्रुद्विचक्षणः । वृष्णिर्वसुपतिर्वाजी वृषभो वाजिनी वसुः ॥ ५५॥ ॥ इति पञ्चमं नामशतकम्
    ॥ विग्रो विभीषणो वह्निर्वृद्धायुर्विश्रुतो वृषा । व्रजभृद्वृत्रहा वृद्धो विश्ववारो वृतञ्चयः ॥ ५६॥
    वृषजूतिर्वृषरथो वृषभान्नो वृषक्रतुः । वृषकर्मा वृषमणाः सुदक्षः सुन्वतो वृधः ॥ ५७॥ अद्रोघवागसुरहा वेधाः
    सत्राकरोऽजरः । अपारः सुहवोऽभीरुरभिभङ्गोऽङ्गिरस्तमः ॥ ५८॥ अमर्त्यः स्वायुधोऽशत्रुरप्रतीतोऽभिमातिषाट्
    । अमत्री सूनुरर्चत्र्यः समद्दिष्टिरभयङ्करः ॥ ५९॥ अभिनेता स्पार्हराधाः सप्तरश्मिरभिष्टिकृत् । अनर्वास्वर्जिदिष्कर्ता
    स्तोतॄणामवितोपरः ॥ ६०॥ अजातशत्रुः सेनानि रुभयाव्युभयङ्करः । उरुगायःसत्ययोनिः सहस्वानुर्वरापतिः ॥ ६१॥
    उग्रो गोप उग्रबाहुरुग्रधन्वोक्थवर्धनः । गाथश्रवा गिरां राजा गम्भीरो गिर्वणस्तमः ॥ ६२॥ वज्रहस्तचर्षणीनां
    वृषभो वज्रदक्षिणः । सोमकामः सोमपतिः सोमवृद्धः सुदक्षिणः ॥ ६३॥ सुब्रह्मा स्थविरः सूरः सहिष्टः सप्रथाः
    सराट् । हरिश्मशारुर्हरिवान्हरीणां पतिरस्तृतः ॥ ६४॥ हिरण्यबाहुरुर्व्यूतिर्हरिकेशो हिरीमशः । हरिशिप्रो
    हर्यमाणो हरिजातो हरिम्भरः ॥ ६५॥ हिरण्यवर्णो हर्यश्चो हरिवर्पा हरिप्रियः । हनिष्ठो हर्यक्ष्वो हव्यो
    हरिष्ठा हरियोजनः ॥ ६६॥ ॥ इति षष्ठं नामशतकम् ॥ सत्वासुशिप्रः सुक्षत्रः सुवीरः सुतपा ऋषिः । गाथान्यो
    गोत्रभिद्ग्रामं वहमानो गवेषणः ॥ ६७॥ जिष्णुस्तस्थुष ईशानो ईशानो जगतो नृतुः । नर्याणि विद्वान्नृपतिः
    नेतानृम्णस्य तूतुजिः ॥ ६८॥ निमेधमानो नर्यापाः सिन्धूनां पतिरुत्तरः । नर्यो नियुत्वान्निचितो नक्षद्दाभोनहुष्टरः
    ॥ ६९॥ नव्यो निधाता नृमणाः सध्रीचीनः सुतरेणः । नृतमानो नदनुमान्नवीयान्नृतमोनृजित् ॥ ७०॥ विचयिष्ठो वज्रबाहुर्वृत्रखादोवलं
    रुजः । जातूभर्मा ज्येष्ठतमो जनभक्षो जनंसहः ॥ ७१॥ विश्वाषाड्वंसगोवस्यान्निष्पाडशनिमान्नृषाट् । पूर्भित्पुराषाडभिषाट्
    जगतस्तस्थुषस्पतिः ॥ ७२॥ संवृक्समत्सुसन्धाता सुसङ्क्षदृक्सविताऽरुणः । स्वर्यः स्वरोचिः सुत्रामा स्तुष्येय्यः
    सनजाः स्वरिः ॥ ७३॥ कृण्वन्नकेतवे केतुः पेशः कृण्वन्नपेशसे । वज्रेण हत्वी महिनो मरुत्स्तोत्रो मरुद्गःणः
    ॥ ७४॥ महावीरो महाव्रातो महाय्यः प्रमतिर्मही । माता मघोनां मंहिष्ठो मन्युमिर्मन्युमत्तमः ॥ ७५॥ मेषो
    महीवृन्मन्मदानो माहिनावान्महेमतिः । म्रक्षोमृलिको मंहिष्ठो म्रक्षकृत्वा महामहः ॥ ७६॥ मदचुन्मर्डितामद्वा
    मदानां पतिरातपः । सुशस्तिः स्वस्तिदाः स्वर्दृग्राधानामाकरः पतिः ॥ ७७॥ ॥ इति सप्तमं नामशतकम् ॥ इषुहस्त
    इषां दाता वसुदाता विदद्वसुः । विभूतिर्व्यानाशिर्वेनो वरीयान् विश्वजिद्विभुः ॥ ७८॥ नृचक्षाः सहुरिः
    स्वर्वित्सुयज्ञः सुष्ठुतः स्वयुः । आपिः पृथिव्या जनिता सूर्यस्य जनिता श्रुतः ॥ ७९॥ ष्पङ्क्षड्विवहायाः
    स्मत्पुतन्धिर्वृषपर्वा वृषन्तमः । साधारणः सुखरथः स्वश्चः सत्राजिदद्भुतः ॥ ८०॥ ज्येष्ठराजो जीरदानुर्जग्मिर्वित्वक्षणो
    वशी । विधाता विश्वमा आशुर्मायी वृद्धमहावृधः ॥ ८१॥ वरेण्यो विश्वतूर्वात्स्येशानो द्यौर्विचर्षणिः ।
    सतीनमन्युर्गोदत्रः सद्योजातोविभञ्जनुः ॥ ८२॥ वितन्तसाय्यो वाजानां विभक्ता वस्व आकरः । वीरको वीरयुर्वज्रं
    बभ्रिवीरेण्य आघृणिः ॥ ८३॥ वाजिनेयो वाजनिर्वाजानां पतिराजिकृत् । वास्तोष्पतिर्वर्पणीतिर्विशां राजा
    वपोदरः ॥ ८४॥ विभूतद्युम्न आचक्रिरादारी दोधतो वधः । आखण्डलो दस्मवर्चाः सर्वसेनो विमोचनः ॥ ८५॥ वज्रस्य
    भर्ता वार्याणां पतिर्गोजिद्गवां पतिः । विश्वव्यचाः सङ्क्षञ्चकानः सुहार्दो जनिता दिवः ॥ ८६॥ समन्तुनामा
    पुरुध प्रतिको बृहतः पतिः । दीध्यानो दामनो दाता दीर्घश्रवस ऋभ्वसः ॥ ८७॥ दंसनावान्दिवः संम्राड्देतवजूतो
    दिवावसुः । दशमो देवता दक्षो दुध्रोद्युम्नी द्युमन्तमः ॥ ८८॥ ॥ इत्यष्टमं नामशतकम् ॥ मंहिङ्क्षष्ठरातुरित्थाधीर्दीद्यानो
    दधृषिर्दुधिः । दुष्टरीतुर्दुश्च्यवनो दिवोमानो दिवोवृषा ॥ ८९॥ दक्षाय्यो दस्युहाधृष्णुः दक्षिणावान्
    धियावसुः । धनस्पृद्धृषितो धाता दयमानो धनञ्जयः ॥ ९०॥ दिव्यो द्विबर्हा सन्नार्यः समर्यस्त्राः सिमः सखा
    । द्युक्षः समानो दंसिष्ठो राधसः पतिरध्रिगुः ॥ ९१॥ सम्राट् पिथिव्या ओजस्वान् वयोधा ऋतुपा ऋभुः । एको
    राजैधमानद्विडेकवीर उरुजयाः ॥ ९२॥ लोककृज्जनिताऽश्चानां जनिता गवाम् । जरिता जनुषां राजा गिर्वणाः सुन्वतोऽविता
    ॥ ९३॥ अत्कं वसानः कृष्टीनां राजोक्थ्यः शिप्रवानुरुः । ईड्योदाश्वानिनतमो धोरः सङ्क्रन्दनः स्ववान् ॥
    ९४॥ जागृविर्जगतो राजा गृत्सो गोविद्धनाधनः । जेताऽभिभूरकूपारो दानवानसुरोर्णऽवः ॥ ९५॥ धृष्विर्दमूनास्तवसस्तवीयानन्तमोऽवृतः
    । रायोदाता रयिपतिः विपश्चिद्वृत्रहन्तमः ॥ ९६॥ अपरीतः षालपश्चाद् दध्वायुत्कार आरितः । वोह्लावनिष्ठो
    वृष्ण्यावान्वृषण्वान्वृकोऽवतः ॥ ९७॥ गर्भोऽसमष्टकाव्योयुगहिशुष्मोदधृष्वणिः । प्रत्रः परिर्वाजदावा ज्योतिः
    कर्ता गिरां पतिः ॥ ९८॥ ॥ इति नवमं नामशतकम् ॥ अनवद्यः सम्भृताश्चो वज्रिवादद्रिवान्द्युमान् । दस्मो
    यजत्रो योधीयानकवारिर्यतङ्करः ॥ ९९॥ पृदाकुसानुरोजीयान् ब्रह्मणश्चोदिताः यमः । वन्दनेष्ठाः पुरां भेता
    बन्धुरेष्ठा बृहद्दिवः ॥ १००॥ वरूता मधुनो राजा प्रणेनीः पप्रथी युवा । उरुशंसोहवंश्रोता भूरिदावा बृहच्छ्रवाः
    ॥ १०१॥ माता स्तियानां वृषभो महोदाता महावधः । सुग्म्यः सुराधाः सत्राषाडोदतीनां नदोधुनिः ॥ १०२॥ अकामकर्शनः
    स्वर्षाः सुमृलीकः सहस्कृतः । पास्त्यस्य होता सिन्धूनां वृषाभोजो रथीतमः ॥ १०३॥ सखा मुनीनां जनिदाः स्वधावानसमोऽप्रतिः
    । मनस्वानध्वरो मर्यो बृबदुक्थोऽविता भगः ॥ १०४॥ अषाह्लोऽरीह्ल आदर्ता वीरं कर्तां विशस्पतिः । एको हव्यः
    सनादारुगोकोवाकस्य सक्षणिः । सुवृक्तिरमृतोऽमृक्तः खजकृद्वलदाः शुनः ॥ १०६॥ अमत्रो मित्र आकाय्यः सुदामाब्जिन्
    महोमही । रथः सुबाहुरुशना सुनीथो भूरिदाः सुदाः ॥ १०७॥ मदस्य राजा सोमस्य पीत्वीज्यान्दिवः पतिः । तविषीवान्धनो
    युध्मो हवनश्रुत्सहः स्वराट् ॥ १०८॥ ॥ इति दशमं नामशतकम् ॥ ॥ अत्रेमे भवन्त्युपसंहारश्लोकाः ॥ इदं सहस्रमिन्द्रस्य
    नाम्नां परमपावनम् । ऋग्वेदतो गणपतिः सङ्गृह्य विनिबद्धवान् ॥ १॥ नात्र नाम्नः पौनरुक्त्यं न
