id: ramarahasyopanishatsavyakhya
category: upanishad
name:
  english: ramarahasyopanishatsavyakhya
  devanagari: रामरहस्योपनिषत्सव्याख्या
content:
  english: navaksharamantrah ramashca candrabhadranto nento natiyuto dvidha | saptaksharo mantrarajah
    sarvakamaphalapradah || 25|| taradisahitah so'pi dvividho'shtaksharo matah | taram ramashcaturthyantam
    krodastram vahnitalpaga || 26|| ashtarno'yam paro mantro rishyadih syat shadarnavat | punarashtaksharasyatha
    rama eva rishih smritah || 27|| gayatram chanda ityasya devata rama eva ca | taram shribijayugmau
    ca bijashaktyadayo matah || 28|| shadangam ca tatah kuryanmantrarnaireva buddhiman | taram shribijayugmam
    ca ramaya nama uccaret || 29|| glaumom bijam vadenmayam hridramaya punashca tam | shivomaramamantro'yam
    vasvarnastu vasupradah || 30|| rishih sadashivah prokto gayatram chanda ucyate | shivomaramacandro'tra
    devata parikirtitah || 31|| dirghaya mayaya'ngani tarapancarnayuktaya | ramam trinetram somardhadharinam
    shulinam param | bhasmoddhuḻitasarvangam kapardinamupasmahe || 32|| ramabhiramam saundaryasimam somavatamsikam
    | pashankushadhanurbanadharam dhyayettrilocanam || 33|| dhyayannevam varnalaksham japatarpanatatparah
    | bilvapatraih phalaih pushpaistilajyaih pankajairhunet || 34|| svayamayanti nidhayah siddhayashca
    surepsitah | punarashtaksharasyatha brahmagayatraraghavah || 35|| rishyadayastu vijneyah shribijam
    mama shaktikam | tatprityai viniyogashca mantrarnairangakalpana || 36|| keyurangadakankanairmaniganairvidyotamanam
    sada ramam parvanacandrakotisadrishacchatrena vai rajitam | hemastambhasahasrashodashayute madhye
    mahamandape devesham bharatadibhih parivritam ramam bhaje shyamalam || 37|| kim mantrairbahubhirvinashvaraphalairayasasadhyairvritha
    kincillobhavitanamatraviphalaih samsaraduhkhavahaih | ekah sannapi sarvamantraphalado lobhadidoshojjhitah
    shriramah sharanam mameti satatam mantro'yamashtaksharah || 38|| evamashtaksharah samyak saptadha
    parikirtitah | ramasaptaksharo mantra adyante tarasamyutah || 39|| navarno mantrarajah syacchesham
    shadvarnavannyaset || atha dvedha saptaksharamuddharati
  devanagari: नवाक्षरमन्त्राः रामश्च चन्द्रभद्रान्तो ङेन्तो नतियुतो द्विधा । सप्ताक्षरो मन्त्रराजः सर्वकामफलप्रदः
    ॥ २५॥ तारादिसहितः सोऽपि द्विविधोऽष्टाक्षरो मतः । तारं रामश्चतुर्थ्यन्तं क्रोडास्त्रं वह्नितल्पगा ॥
    २६॥ अष्टार्णोऽयं परो मन्त्रो ऋष्यादिः स्यात् षडर्णवत् । पुनरष्टाक्षरस्याथ राम एव ऋषिः स्मृतः ॥ २७॥
    गायत्रं छन्द इत्यस्य देवता राम एव च । तारं श्रीबीजयुग्मौ च बीजशक्त्यादयो मताः ॥ २८॥ षडङ्गं च ततः कुर्यान्मन्त्रार्णैरेव
    बुद्धिमान् । तारं श्रीबीजयुग्मं च रामाय नम उच्चरेत् ॥ २९॥ ग्लौमों बीजं वदेन्मायां हृद्रामाय पुनश्च
    ताम् । शिवोमाराममन्त्रोऽयं वस्वर्णस्तु वसुप्रदः ॥ ३०॥ ऋषिः सदाशिवः प्रोक्तो गायत्रं छन्द उच्यते ।
    शिवोमारामचन्द्रोऽत्र देवता परिकीर्तितः ॥ ३१॥ दीर्घया माययाऽङ्गानि तारपञ्चार्णयुक्तया । रामं त्रिणेत्रं
    सोमार्धधारिणं शूलिनं परम् । भस्मोद्धूळितसर्वाङ्गं कपर्दिनमुपास्महे ॥ ३२॥ रामाभिरामां सौन्दर्यसीमां
    सोमावतंसिकाम् । पाशाङ्कुशधनुर्बाणधरां ध्यायेत्त्रिलोचनाम् ॥ ३३॥ ध्यायन्नेवं वर्णलक्षं जपतर्पणतत्परः
    । बिल्वपत्रैः फलैः पुष्पैस्तिलाज्यैः पङ्कजैर्हुनेत् ॥ ३४॥ स्वयमायान्ति निधयः सिद्धयश्च सुरेप्सिताः
    । पुनरष्टाक्षरस्याथ ब्रह्मगायत्रराघवाः ॥ ३५॥ ऋष्यादयस्तु विज्ञेयाः श्रीबीजं मम शक्तिकम् । तत्प्रीत्यै
    विनियोगश्च मन्त्रार्णैरङ्गकल्पना ॥ ३६॥ केयूराङ्गदकङ्कणैर्मणिगणैर्विद्योतमानं सदा रामं पार्वणचन्द्रकोटिसदृशच्छत्रेण
    वै राजितम् । हेमस्तम्भसहस्रषोडशयुते मध्ये महामण्डपे देवेशं भरतादिभिः परिवृतं रामं भजे श्यामलम् ॥ ३७॥
    किं मन्त्रैर्बहुभिर्विनश्वरफलैरायाससाध्यैर्वृथा किञ्चिल्लोभवितानमात्रविफलैः संसारदुःखावहैः । एकः सन्नपि
    सर्वमन्त्रफलदो लोभादिदोषोज्झितः श्रीरामः शरणं ममेति सततं मन्त्रोऽयमष्टाक्षरः ॥ ३८॥ एवमष्टाक्षरः सम्यक्
    सप्तधा परिकीर्तितः । रामसप्ताक्षरो मन्त्र आद्यन्ते तारसंयुतः ॥ ३९॥ नवार्णो मन्त्रराजः स्याच्छेषं षड्वर्णवन्न्यसेत्
    ॥ अथ द्वेधा सप्ताक्षरमुद्धरति
