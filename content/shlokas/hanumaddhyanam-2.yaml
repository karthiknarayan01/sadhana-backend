id: hanumaddhyanam-2
category: stotram
name:
  english: hanumaddhyanam 2
  devanagari: हनुमद्ध्यानम् २
content:
  english: hanumaddhyanam 2 namaste devadevesha namaste rakshasantaka | namaste vanaradhisha namaste vayunandana
    || 1|| namastrimurtivapushe vedavedyaya te namah | revanadi viharaya sahasrabhujadharine || 2|| sahasravanitalola
    kapirupaya te namah | dashananavadharthaya pancananadharaya ca || 3|| suvarcalakalatraya tasmai hanumate
    namah | karkativadhavelayam shadananadharaya ca || 4|| sarvalokahitarthaya vayuputraya te namah |
    ramankamudradharaya brahmalokanivasine || 5|| vimshadbhujasametaya tasmai rudratmane namah | sarvasvatantradevaya
    nanayudhadharaya ca || 6|| divyamangalarupaya hanumadbrahmane namah | durdandibandhamokshaya kalanemiharaya
    ca || 7|| mairavanavinashaya vajradehaya te namah | sarvalokaprapurnaya bhaktanam hrinnivasine ||
    8|| artanam rakshanarthaya vedavedyaya te namah | sarvamantrasvarupaya srishtisthityantahetave ||
    9|| nanavarnadharayastu papanashaya te namah | gangatire vipramukha kapilanugrahecchaya || 10|| caturbhujavataraya
    bhavishyadbrahmane namah | kaupinakatisutraya divyayajnopavitine || 11|| pitambaradharayastu kalarupaya
    te namah | yajnakartre yajnabhoktre nanavidyaviharine || 12|| trimurtitejovapushe divyarupaya te namah
    | kadaliphalahastaya hemarambhaviharine || 13|| bhaktadhyanavasantaya sarvabhutatmane namah | vallaridharyayuktaya
    sahasrashvarathaya ca || 14|| gundakriyagitaganacaturaya namo namah | pancashadvarnarupaya sukshmarupaya
    vishnave || 15|| naravanaraveshaya bahurupaya te namah | lankinivashavelayamashtadashabhujatmane ||
    16|| dhvajadattaprapannaya agnigarbhaya te namah | ushtrarohaviraraya parvatinandanaya ca || 17||
    vajrapraharacihnaya tasmai sarvatmane namah | pampatiraviharaya kesarinandanaya ca | taptakancanavarnaya
    virarupaya te namah || 18|| shaktim pasham ca kuntam parashumapi halam tomaram khetakam ca shankham
    cakram trishulam musalamapi gadam pattasam mudgaram ca | gandivam carupadmam dvinavabhujavare khadgamapyadadanam
    vande'ham vayusunum suraripumathanam bhaktarakshadhurinam || 19|| iti shrihanumaddhyanam samaptam
    |
  devanagari: हनुमद्ध्यानम् २ नमस्ते देवदेवेश नमस्ते राक्षसान्तक । नमस्ते वानराधीश नमस्ते वायुनन्दन ॥
    १॥ नमस्त्रिमूर्तिवपुषे वेदवेद्याय ते नमः । रेवानदी विहाराय सहस्रभुजधारिणे ॥ २॥ सहस्रवनितालोल कपिरूपाय
    ते नमः । दशाननवधार्थाय पञ्चाननधराय च ॥ ३॥ सुवर्चलाकलत्राय तस्मै हनुमते नमः । कर्कटीवधवेलायां षडाननधराय
    च ॥ ४॥ सर्वलोकहितार्थाय वायुपुत्राय ते नमः । रामाङ्कमुद्राधराय ब्रह्मलोकनिवासिने ॥ ५॥ विंशद्भुजसमेताय
    तस्मै रुद्रात्मने नमः । सर्वस्वतन्त्रदेवाय नानायुधधराय च ॥ ६॥ दिव्यमङ्गलरूपाय हनूमद्ब्रह्मणे नमः ।
    दुर्दण्डिबन्धमोक्षाय कालनेमिहराय च ॥ ७॥ मैरावणविनाशाय वज्रदेहाय ते नमः । सर्वलोकप्रपूर्णाय भक्तानां
    हृन्निवासिने ॥ ८॥ आर्तानां रक्षणार्थाय वेदवेद्याय ते नमः । सर्वमन्त्रस्वरूपाय सृष्टिस्थित्यन्तहेतवे
    ॥ ९॥ नानावर्णधरायास्तु पापनाशय ते नमः । गङ्गातीरे विप्रमुख कपिलानुग्रहेच्छया ॥ १०॥ चतुर्भुजावताराय
    भविष्यद्ब्रह्मणे नमः । कौपीनकटिसूत्राय दिव्ययज्ञोपवीतिने ॥ ११॥ पीताम्बरधरायास्तु कालरूपाय ते नमः ।
    यज्ञकर्त्रे यज्ञभोक्त्रे नानाविद्याविहारिणे ॥ १२॥ त्रिमूर्तितेजोवपुषे दिव्यरूपाय ते नमः । कदलीफलहस्ताय
    हेमरम्भाविहारिणे ॥ १३॥ भक्तध्यानावसन्ताय सर्वभूतात्मने नमः । वल्लरीधार्ययुक्ताय सहस्राश्वरथाय च ॥
    १४॥ गुण्डक्रियागीतगानचतुराय नमो नमः । पञ्चाशद्वर्णरूपाय सूक्ष्मरूपाय विष्णवे ॥ १५॥ नरवानरवेषाय बहुरूपाय
    ते नमः । लङ्किणीवशवेलायामष्टादशभुजात्मने ॥ १६॥ ध्वजदत्तप्रपन्नाय अग्निगर्भाय ते नमः । उष्ट्रारोहविराराय
    पार्वतीनन्दनाय च ॥ १७॥ वज्रप्रहारचिह्नाय तस्मै सर्वात्मने नमः । पम्पातीरविहाराय केसरीनन्दनाय च । तप्तकाञ्चनवर्णाय
    वीररूपाय ते नमः ॥ १८॥ शक्तिं पाशं च कुन्तं परशुमपि हलं तोमरं खेटकं च शङ्खं चक्रं त्रिशूलं मुसलमपि
    गदां पट्टसं मुद्गरं च । गाण्डीवं चारुपद्मं द्विनवभुजवरे खड्गमप्याददानं वन्देऽहं वायुसूनुं सुररिपुमथनं
    भक्तरक्षाधुरीणम् ॥ १९॥ इति श्रीहनुमद्ध्यानं समाप्तम् ।
