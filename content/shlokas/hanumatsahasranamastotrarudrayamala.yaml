id: hanumatsahasranamastotrarudrayamala
category: sahasranama
name:
  english: hanumatsahasranamastotrarudrayamala
  devanagari: हनुमत्सहस्रनामस्तोत्ररुद्रयामल
content:
  english: ringiganadhipah | nandikeshvaravarma ca nandikeshvarapujakah || 113|| narasimho nato nipo nakhayuddhavisharadah
    | nakhayudho nalo nilo nalanilapramodakah || 114|| navadvarapuradharo navadvarapuratanah | naranarayanastutyo
    nakhanatho nageshvarah || 115|| nakhadamshtrayudho nityo nirakaro niranjanah | nishkalanko niravadyo
    nirmalo nirmamo nagah || 116|| nagaragramapalashca niranto nagaradhipah | nagakanyabhayadhvamsi nagaripriyanagarah
    || 117|| pitambarah padmanabhah pundarikakshapavanah | padmakshah padmavaktrashca padmasanaprapujakah
    || 118|| padmamali padmaparah padmapujanatatparah | padmapanih padmapadah pundarikakshasevanah ||
    119|| pavanah pavanatma ca pavanatmajah papaha | parah paratarah padmah paramah paramatmakah || 120||
    pitambarah priyah prema premadah premapalakah | praudhah praudhaparah pretadoshaha pretanashakah ||
    121|| prabhanjananvayah panca pancaksharamanupriyah | pannagarih pratapi ca prapannah paradoshaha
    || 122|| parabhicarashamanah parasainyavinashakah | prativadimukhastambhah puradharah purarinut ||
    123|| parajitah parambrahma paratparaparatparah | patalagah puranashca puratanah plavangamah || 124||
    puranapurushah pujyah purusharthaprapurakah | plavageshah palasharih prithukah prithivipatih || 125||
    punyashilah punyarashih punyatma punyapalakah | punyakirtih punyagitih pranadah pranaposhakah || 126||
    pravinashca prasannashca parthadhvajanivasakah | pingakeshah pingaroma pranavah pingalapranah || 127||
    parasharah papaharta pippalashrayasiddhidah | punyashlokah puratitah prathamah purushah puman || 128||
    puradharashca pratyakshah parameshthi pitamahah | phullaravindavadanah phullotkamalalocanah || 129||
    phutkarah phutkarah phushca phudamantraparayanah | sphatikadrinivasi ca phullendivaralocanah || 130||
    vayurupi vayusuto vayvatma vamanashakah | vano vanacaro balo balatrata tu balakah || 131|| vishvanathashca
    vishvam ca vishvatma vishvapalakah | vishvadhata vishvakarta vishvavetta vishampatih || 132|| vimalo
    vimalajnano vimalanandadayakah | vimalotpalavaktrashca vimalatma vilasakrit || 133|| bindumadhavapujyashca
    bindumadhavasevakah | bijo'tha viryado bijahari bijaprado vibhuh || 134|| vijayo bijakarta ca vibhutirbhutidayakah
    | vishvavandyo vishvagamyo vishvaharta virattanuh || 135|| bulakarahataratirvasudevo vanapradah |
    brahmapuccho brahmaparo vanaro vanareshvarah || 136|| balibandhanakridvishvateja vishvapratishthitah
    | vibhokta ca vayudevo viraviro vasundharah || 137|| vanamali vanadhvamsi varuno vaishnavo bali |
    vibhishanapriyo vishnusevi vayugavirviduh || 138|| vipadmo vayuvamshyashca vedavedangaparagah | brihattanurbrihatpado
    brihatkayo brihadyashah || 139|| brihannaso brihadbahurbrihanmurtirbrihatstutih | brihaddhanurbrihajjangho
    brihatkayo brihatkarah || 140|| brihadratirbrihatpuccho brihallokaphalapradah | brihatsevyo brihacchaktirbrihadvidyavisharadah
    || 141|| brihallokarato vidya vidyadata vidikpatih | vigraho vigraharato vyadhinashi ca vyadhidah
    || 142|| vishishto baladata ca vighnanasho vinayakah | varaho vasudhanatho bhagavan bhavabhanjanah
    || 143|| bhagyado bhayakarta ca bhago bhrigupatipriyah | bhavyo bhakto bharadvajo bhayanghrirbhayanashanah
    || 144|| madhavo madhuranatho meghanado mahamunih | mayapatirmanasvi ca mayatito manotsukah || 145||
    mainakavanditamodo manovegi maheshvarah | mayanirjitarakshashca mayanirjitavishtapah || 146|| mayashrayashca
    nilayo mayavidhvamsako mayah | manoyamaparo yamyo yamaduhkhanivaranah || 147|| yamunatiravasi ca yamunatirthacaranah
    | ramo ramapriyo ramyo raghavo raghunandanah || 148|| ramaprapujako rudro rudrasevi ramapatih | ravanari
    ramanathavatsalo raghupungavah || 149|| rakshoghno ramadutashca rameshto rakshasantakah | ramabhakto
    ramarupo rajarajo ranotsukah || 150|| lankavidhvamsako lankapatighati latapriyah | lakshminathapriyo
    lakshminarayanatmapalakah || 151|| plavagabdhihelakashca lankeshagrihabhanjanah | brahmasvarupi brahmatma
    brahmajno brahmapalakah || 152|| brahmavadi ca vikshetram vishvabijam ca vishvadrik | vishvambharo
    vishvamurtirvishvakaro'tha vishvadhrik || 153|| vishvatma vishvasevyo'tha vishvo vishveshvaro vibhuh
    | shuklah shukrapradah shukrah shukratma ca shubhapradah || 154|| sharvaripatishurashca shurashcatha
    shrutishravah | shakambharishaktidharah shatrughnah sharanapradah || 155|| shankarah shantidah shantah
    shivah shuli shivarcitah | shriramarupah shrivasah shripadah shrikarah shucih || 156|| shrishah shridah
    shrikarashca shrikantapriyah shrinidhih | shodashasvarasamyuktah shodashatma priyankarah || 157||
    shadangastotraniratah shadananaprapujakah | shatshastravetta shadbahuh shatsvarupah shadurmipah ||
    158|| sanatanah satyarupah satyalokaprabodhakah | satyatma satyadata ca satyavrataparayanah || 159||
    saumyah saumyapradah saumyadriksaumyah saumyapalakah | sugrivadiyutah sarvasamsarabhayanashanah ||
    160|| sutratma sukshmasandhyashca sthulah sarvagatih puman | surabhih sagarah setuh satyah satyaparakramah
    || 161|| satyagarbhah satyasetuh siddhistu satyagocarah | satyavadi sukarma ca sadanandaika ishvarah
    || 162|| siddhih sadhyah susiddhashca sankalpah siddhihetukah | saptapatalacaranah saptarshiganavanditah
    || 163|| saptabdhilanghano virah saptadviporumandalah | saptangarajyasukhadah saptamatrinishevitah
    || 164|| saptacchandonidhih sapta saptapatalasamshrayah | sankarshanah sahasrasyah sahasrakshah sahasrapat
    || 165|| hanuman harshadata ca haro hariharishvarah | kshudrarakshasaghati ca kshuddhatakshantidayakah
    || 166|| anadisho hyanantashca anando'dhyatmabodhakah | indra ishottamashcaiva unmattajana riddhidah
    || 167|| rivarno lilupadopeta aishvaryam aushadhipriyah | aushadhashcamshumamshcaiva akarah sarvakaranah
    || 168|| ityetadramadutasya namnam caiva sahasrakam | ekakalam dvikalam va trikalam shraddhayanvitah
    || 169|| pathanatpathanadvapi sarva siddhirbhavetpriye | moksharthi labhate moksham kamarthi kamamapnuyat
    || 170|| vidyarthi labhate vidyam vedavyakaranadikam | icchakamamstu kamarthi dharmarthi dharmamakshayam
    || 171|| putrarthi labhate putram varayussahitam puman | kshetram ca bahusasyam syadgavashca bahudugdhadah
    || 172|| duhsvapnam ca nribhirdrishtam susvapnamupajayate | duhkhaugho nashyate tasya sampattirvarddhate
    ciram || 173|| caturvidham vastu tasya bhavatyeva na samshayah | ashvatthamule japatam nasti vairikritam
    bhayam || 174|| trikalam pathanattasya siddhih syatkarasamsthita | ardharatre ravau dhritva kanthadeshe
    narah shucih || 175|| dashavartam pathenmartyah sarvankamanavapnuyat | bhaume nishante nyagrodhamule
    sthitva vicakshanah || 176|| dashavartam pathenmartyah sarvabhaumah prajayate | arkamule'rkavare tu
    yo madhyahne shucirjapet || 177|| cirayuh sa sukhi putri vijayi jayate kshanat | brahme muhurte cotthaya
    pratyaham ca pathennarah || 178|| yam yam kamayate kamam labhate tam na samshayah | sangrame sannivishtanam
    vairividravanam param || 179|| dakinibhutapreteshu grahapidaharam tatha | jvarapasmarashamanam yakshmaplihadivaranam
    || 180|| sarvasaukhyapradam stotram sarvasiddhipradam tatha | sarvankamanavapnoti vayuputraprasadatah
    || 181|| iti shrirudrayamalatah shrihanumatsahasranamastotram sampurnam |
  devanagari: ृङ्गिगणाधिपः । नन्दिकेश्वरवर्मा च नन्दिकेश्वरपूजकः ॥ ११३॥ नरसिंहो नटो नीपो नखयुद्धविशारदः
    । नखायुधो नलो नीलो नलनीलप्रमोदकः ॥ ११४॥ नवद्वारपुराधारो नवद्वारपुरातनः । नरनारयणस्तुत्यो नखनाथो नगेश्वरः
    ॥ ११५॥ नखदंष्ट्रायुधो नित्यो निराकारो निरञ्जनः । निष्कलङ्को निरवद्यो निर्मलो निर्ममो नगः ॥ ११६॥ नगरग्रामपालश्च
    निरन्तो नगराधिपः । नागकन्याभयध्वंसी नागारिप्रियनागरः ॥ ११७॥ पीताम्बरः पद्मनाभः पुण्डरीकाक्षपावनः ।
    पद्माक्षः पद्मवक्त्रश्च पद्मासनप्रपूजकः ॥ ११८॥ पद्ममाली पद्मपरः पद्मपूजनतत्परः । पद्मपाणिः पद्मपादः
    पुण्डरीकाक्षसेवनः ॥ ११९॥ पावनः पवनात्मा च पवनात्मजः पापहा । परः परतरः पद्मः परमः परमात्मकः ॥ १२०॥
    पीताम्बरः प्रियः प्रेम प्रेमदः प्रेमपालकः । प्रौढः प्रौढपरः प्रेतदोषहा प्रेतनाशकः ॥ १२१॥ प्रभञ्जनान्वयः
    पञ्च पञ्चाक्षरमनुप्रियः । पन्नगारिः प्रतापी च प्रपन्नः परदोषहा ॥ १२२॥ पराभिचारशमनः परसैन्यविनाशकः
    । प्रतिवादिमुखस्तम्भः पुराधारः पुरारिनुत् ॥ १२३॥ पराजितः परम्ब्रह्म परात्परपरात्परः । पातालगः पुराणश्च
    पुरातनः प्लवङ्गमः ॥ १२४॥ पुराणपुरुषः पूज्यः पुरुषार्थप्रपूरकः । प्लवगेशः पलाशारिः पृथुकः पृथिवीपतिः
    ॥ १२५॥ पुण्यशीलः पुण्यराशिः पुण्यात्मा पुण्यपालकः । पुण्यकीर्तिः पुण्यगीतिः प्राणदः प्राणपोषकः ॥ १२६॥
    प्रवीणश्च प्रसन्नश्च पार्थध्वजनिवासकः । पिङ्गकेशः पिङ्गरोमा प्रणवः पिङ्गलप्रणः ॥ १२७॥ पराशरः पापहर्ता
    पिप्पलाश्रयसिद्धिदः । पुण्यश्लोकः पुरातीतः प्रथमः पुरुषः पुमान् ॥ १२८॥ पुराधारश्च प्रत्यक्षः परमेष्ठी
    पितामहः । फुल्लारविन्दवदनः फुल्लोत्कमललोचनः ॥ १२९॥ फूत्कारः फूत्करः फूश्च फूदमन्त्रपरायणः । स्फटिकाद्रिनिवासी
    च फुल्लेन्दीवरलोचनः ॥ १३०॥ वायुरूपी वायुसुतो वाय्वात्मा वामनाशकः । वनो वनचरो बालो बालत्राता तु बालकः
    ॥ १३१॥ विश्वनाथश्च विश्वं च विश्वात्मा विश्वपालकः । विश्वधाता विश्वकर्ता विश्ववेत्ता विशाम्पतिः ॥
    १३२॥ विमलो विमलज्ञानो विमलानन्ददायकः । विमलोत्पलवक्त्रश्च विमलात्मा विलासकृत् ॥ १३३॥ बिन्दुमाधवपूज्यश्च
    बिन्दुमाधवसेवकः । बीजोऽथ वीर्यदो बीजहारी बीजप्रदो विभुः ॥ १३४॥ विजयो बीजकर्ता च विभूतिर्भूतिदायकः
    । विश्ववन्द्यो विश्वगम्यो विश्वहर्ता विराट्तनुः ॥ १३५॥ बुलकारहतारातिर्वसुदेवो वनप्रदः । ब्रह्मपुच्छो
    ब्रह्मपरो वानरो वानरेश्वरः ॥ १३६॥ बलिबन्धनकृद्विश्वतेजा विश्वप्रतिष्ठितः । विभोक्ता च वायुदेवो वीरवीरो
    वसुन्धरः ॥ १३७॥ वनमाली वनध्वंसी वारुणो वैष्णवो बली । विभीषणप्रियो विष्णुसेवी वायुगविर्विदुः ॥ १३८॥
    विपद्मो वायुवंश्यश्च वेदवेदाङ्गपारगः । बृहत्तनुर्बृहत्पादो बृहत्कायो बृहद्यशाः ॥ १३९॥ बृहन्नासो बृहद्बाहुर्बृहन्मूर्तिर्बृहत्स्तुतिः
    । बृहद्धनुर्बृहज्जङ्घो बृहत्कायो बृहत्करः ॥ १४०॥ बृहद्रतिर्बृहत्पुच्छो बृहल्लोकफलप्रदः । बृहत्सेव्यो
    बृहच्छक्तिर्बृहद्विद्याविशारदः ॥ १४१॥ बृहल्लोकरतो विद्या विद्यादाता विदिक्पतिः । विग्रहो विग्रहरतो
    व्याधिनाशी च व्याधिदः ॥ १४२॥ विशिष्टो बलदाता च विघ्ननाशो विनायकः । वराहो वसुधानाथो भगवान् भवभञ्जनः
    ॥ १४३॥ भाग्यदो भयकर्ता च भागो भृगुपतिप्रियः । भव्यो भक्तो भरद्वाजो भयाङ्घ्रिर्भयनाशनः ॥ १४४॥ माधवो
    मधुरानाथो मेघनादो महामुनिः । मायापतिर्मनस्वी च मायातीतो मनोत्सुकः ॥ १४५॥ मैनाकवन्दितामोदो मनोवेगी
    महेश्वरः । मायानिर्जितरक्षाश्च मायानिर्जितविष्टपः ॥ १४६॥ मायाश्रयश्च निलयो मायाविध्वंसको मयः । मनोयमपरो
    याम्यो यमदुःखनिवारणः ॥ १४७॥ यमुनातीरवासी च यमुनातीर्थचारणः । रामो रामप्रियो रम्यो राघवो रघुनन्दनः
    ॥ १४८॥ रामप्रपूजको रुद्रो रुद्रसेवी रमापतिः । रावणारी रमानाथवत्सलो रघुपुङ्गवः ॥ १४९॥ रक्षोघ्नो रामदूतश्च
    रामेष्टो राक्षसान्तकः । रामभक्तो रामरूपो राजराजो रणोत्सुकः ॥ १५०॥ लङ्काविध्वंसको लङ्कापतिघाती लताप्रियः
    । लक्ष्मीनाथप्रियो लक्ष्मीनारायणात्मपालकः ॥ १५१॥ प्लवगाब्धिहेलकश्च लङ्केशगृहभञ्जनः । ब्रह्मस्वरूपी
    ब्रह्मात्मा ब्रह्मज्ञो ब्रह्मपालकः ॥ १५२॥ ब्रह्मवादी च विक्षेत्रं विश्वबीजं च विश्वदृक् । विश्वम्भरो
    विश्वमूर्तिर्विश्वाकारोऽथ विश्वधृक् ॥ १५३॥ विश्वात्मा विश्वसेव्योऽथ विश्वो विश्वेश्वरो विभुः । शुक्लः
    शुक्रप्रदः शुक्रः शुक्रात्मा च शुभप्रदः ॥ १५४॥ शर्वरीपतिशूरश्च शूरश्चाथ श्रुतिश्रवाः । शाकम्भरीशक्तिधरः
    शत्रुघ्नः शरणप्रदः ॥ १५५॥ शङ्करः शान्तिदः शान्तः शिवः शूली शिवार्चितः । श्रीरामरूपः श्रीवासः श्रीपदः
    श्रीकरः शुचिः ॥ १५६॥ श्रीशः श्रीदः श्रीकरश्च श्रीकान्तप्रियः श्रीनिधिः । षोडशस्वरसंयुक्तः षोडशात्मा
    प्रियङ्करः ॥ १५७॥ षडङ्गस्तोत्रनिरतः षडाननप्रपूजकः । षट्शास्त्रवेत्ता षड्बाहुः षट्स्वरूपः षडूर्मिपः
    ॥ १५८॥ सनातनः सत्यरूपः सत्यलोकप्रबोधकः । सत्यात्मा सत्यदाता च सत्यव्रतपरायणः ॥ १५९॥ सौम्यः सौम्यप्रदः
    सौम्यदृक्सौम्यः सौम्यपालकः । सुग्रीवादियुतः सर्वसंसारभयनाशनः ॥ १६०॥ सूत्रात्मा सूक्ष्मसन्ध्यश्च स्थूलः
    सर्वगतिः पुमान् । सुरभिः सागरः सेतुः सत्यः सत्यपराक्रमः ॥ १६१॥ सत्यगर्भः सत्यसेतुः सिद्धिस्तु सत्यगोचरः
    । सत्यवादी सुकर्मा च सदानन्दैक ईश्वरः ॥ १६२॥ सिद्धिः साध्यः सुसिद्धश्च सङ्कल्पः सिद्धिहेतुकः । सप्तपातालचरणः
    सप्तर्षिगणवन्दितः ॥ १६३॥ सप्ताब्धिलङ्घनो वीरः सप्तद्वीपोरुमण्डलः । सप्ताङ्गराज्यसुखदः सप्तमातृनिषेवितः
    ॥ १६४॥ सप्तच्छन्दोनिधिः सप्त सप्तपातालसंश्रयः । सङ्कर्षणः सहस्रास्यः सहस्राक्षः सहस्रपात् ॥ १६५॥ हनुमान्
    हर्षदाता च हरो हरिहरीश्वरः । क्षुद्रराक्षसघाती च क्षुद्धतक्षान्तिदायकः ॥ १६६॥ अनादीशो ह्यनन्तश्च आनन्दोऽध्यात्मबोधकः
    । इन्द्र ईशोत्तमश्चैव उन्मत्तजन ऋद्धिदः ॥ १६७॥ ऋवर्णो ऌलुपदोपेत ऐश्वर्यं औषधीप्रियः । औषधश्चांशुमांश्चैव
    अकारः सर्वकारणः ॥ १६८॥ इत्येतद्रामदूतस्य नाम्नां चैव सहस्रकम् । एककालं द्विकालं वा त्रिकालं श्रद्धयान्वितः
    ॥ १६९॥ पठनात्पाठनाद्वापि सर्वा सिद्धिर्भवेत्प्रिये । मोक्षार्थी लभते मोक्षं कामार्थी काममाप्नुयात्
    ॥ १७०॥ विद्यार्थी लभते विद्यां वेदव्याकरणादिकम् । इच्छाकामांस्तु कामार्थी धर्मार्थी धर्ममक्षयम् ॥
    १७१॥ पुत्रार्थी लभते पुत्रं वरायुस्सहितं पुमान् । क्षेत्रं च बहुसस्यं स्याद्गावश्च बहुदुग्धदाः ॥ १७२॥
    दुःस्वप्नं च नृभिर्दृष्टं सुस्वप्नमुपजायते । दुःखौघो नश्यते तस्य सम्पत्तिर्वर्द्धते चिरम् ॥ १७३॥ चतुर्विधं
    वस्तु तस्य भवत्येव न संशयः । अश्वत्थमूले जपतां नास्ति वैरिकृतं भयम् ॥ १७४॥ त्रिकालं पठनात्तस्य सिद्धिः
    स्यात्करसंस्थिता । अर्धरात्रे रवौ धृत्वा कण्ठदेशे नरः शुचिः ॥ १७५॥ दशावर्तं पठेन्मर्त्यः सर्वान्कामानवाप्नुयात्
    । भौमे निशान्ते न्यग्रोधमूले स्थित्वा विचक्षणः ॥ १७६॥ दशावर्तं पठेन्मर्त्यः सार्वभौमः प्रजायते । अर्कमूलेऽर्कवारे
    तु यो मध्याह्ने शुचिर्जपेत् ॥ १७७॥ चिरायुः स सुखी पुत्री विजयी जायते क्षणात् । ब्राह्मे मुहूर्ते चोत्थाय
    प्रत्यहं च पठेन्नरः ॥ १७८॥ यं यं कामयते कामं लभते तं न संशयः । सङ्ग्रामे सन्निविष्टानां वैरिविद्रावणं
    परम् ॥ १७९॥ डाकिनीभूतप्रेतेषु ग्रहपीडाहरं तथा । ज्वरापस्मारशमनं यक्ष्मप्लीहादिवारणम् ॥ १८०॥ सर्वसौख्यप्रदं
    स्तोत्रं सर्वसिद्धिप्रदं तथा । सर्वान्कामानवाप्नोति वायुपुत्रप्रसादतः ॥ १८१॥ इति श्रीरुद्रयामलतः श्रीहनुमत्सहस्रनामस्तोत्रं
    सम्पूर्णम् ।
