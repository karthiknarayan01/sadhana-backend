id: radhabrahma
category: stotram
name:
  english: radhabrahma
  devanagari: राधाब्रह्म
content:
  english: shriradhastotram brahmadevakritam brahmovaca | he matastvatpadambhojam drishtam krishnaprasadatah
    || 1|| sudurlabham ca sarvesham bharate ca visheshatah | shashtivarshasahasrani tapastaptam pura maya
    || 2|| bhaskare pushkare tirthe krishnasya paramatmanah | ajagama varam datum varadata harih svayam
    || 3|| varamvrinishvetyukte ca svabhishtam ca vritam muda | radhikacaranamhojam sarveshamapi durlabham
    || 4|| he gunatita me snhighramadhunaiva pradarshaya | mayetyukto harirayamuvaca mam tapasvinam ||
    5|| darshayishyammi kale ca vatsedanim ksameti ca | na hishvarajna viphala tena drishtam padambujam
    || 6|| sarvesham vancitam matargoloke bharate'dhuna | sarva devyah prakrityamsha janyah prakritika
    dhruvam || 7|| tvam krishnangardhasambhuta tulya krishnena sarvatah | shrikrishnastvamayam radha va
    harih svayam || 8|| na hi vedeshu me drishta iti kena nirupitam | brahmandad bahirurdhvam ca goloko'sti
    yathambike || 9|| vaikunthashacapyajanyashca tvamajanya tathambike | yatha samastabrahmande shrikrishnamshamsha
    jivinah || 10|| tatha shaktisvarupa tvam teshu sarveshu samsthita | purushashca hareramshasvadamsha
    nikhilah striyah || 11|| atmano deharupa tvamasyadharasvameva hi | asya nu pranaistvam matasvatpranairayamishvarah
    || 12|| kimaho nirmitah kena hetuna shilpakarina | nityo'yam ca yatha krishnastvam ca nitya tathambike
    || 13|| asyamsha tvam tvadamsho vapyayam kena nirupitah | aham vidhata jagatam vedanam janakah svayam
    || 14|| tam pathitva gurumukhad bhavantyeva budha janah | gunanam va stavanam te shatamsham vaktumakshamah
    || 15|| vedo va pandito vanyah ko va tvam stotumishvarah | stavanam janakam jnanam buddhirjnanambika
    sada || 16|| tvam buddherjanani matah ko va tvam stotumishvarah | yadvastu drishtam sarvesham tadvivaktum
    budhah ksamah || 17|| yadadrishtashrutam vastu tannirvaktum ca kah kshamah | aham mahesho'nantashca
    stotum tvam ko'pi na kshamah || 18|| sarasvati ca vedashca ksamah kah stotumishvari | yathagamam yathoktam
    ca na mam ninditumarhasi || 19|| isvaranamisvarasya yogyayogye sama kripa janasya | pratipalyasya
    kshane doshah kshane gunah ||20|| janani janako yo va sarvam ksamati snehatah | ityuktva jagatam dhata
    tathau ca puratastayoh || 21|| pranamya caranambhojam sarvesham vandyamipsitam | brahmana ca kritam
    stotram trisamdhyam yah pathennarah | radhamadhavayoh pade bhaktim dasyam labhed dhruvam || 22|| karmanirmulanam
    kritva mrityum jitva sudurjayam | vilanghya sarvalokashca yati golokamuttamam || 23|| || iti shribrahmavaivarte
    brahmana kritam shriradhastotram sampurnam||
  devanagari: श्रीराधास्तोत्रं ब्रह्मदेवकृतम् ब्रह्मोवाच । हे मातस्त्वत्पदाम्भोजं दृष्टं कृष्णप्रसादतः
    ॥ १॥ सुदुर्लभं च सर्वेषां भारते च विशेषतः । षष्टिवर्षसहस्राणि तपस्तप्तं पुरा मया ॥ २॥ भास्करे पुष्करे
    तिर्थे कृष्णस्य परमात्मनः । आजगाम वरं दातुं वरदाता हरिः स्वयम् ॥ ३॥ वरंवृणीष्वेत्युक्ते च स्वाभिष्टं
    च वृतं मुदा । राधिकाचरणाम्होजं सर्वेषामपि दुर्लभम् ॥ ४॥ हे गुणातित मे स्न्हीघ्रमधुनैव प्रदर्शय । मयेत्युक्तो
    हरिरयमुवाच मां तपस्विनम् ॥ ५॥ दर्शायिष्याम्मि काले च वत्सेदानीं क्समेति च । न हीश्वराज्ञा विफला तेन
    दृष्टं पदाम्बुजम् ॥ ६॥ सर्वेषां वाञ्चितं मातर्गोलोके भारतेऽधुना । सर्वा देव्यः प्रकृत्यंशा जन्याः
    प्राकृतिका ध्रुवम् ॥ ७॥ त्वं कृष्णाङ्गार्धसम्भूता तुल्या कृष्णेन सर्वतः । श्रीकृष्णस्त्वमयं राधा वा
    हरीः स्वयम् ॥ ८॥ न हि वेदेषु मे दृष्ट इति केन निरूपितम् । ब्रह्माण्डाद् बहिरूर्ध्वं च गोलोकोऽस्ति
    यथाम्बिके ॥ ९॥ वैकुण्ठशचाप्यजन्यश्च त्वमजन्या तथाम्बिके । यथा समस्तब्रह्माण्डे श्रीकृष्णांशांश जीविनः
    ॥ १०॥ तथा शक्तिस्वरूपा त्वं तेषु सर्वेषु संस्थिता । पुरुषाश्च हरेरंशास्वदंशा निखिलाः स्त्रियः ॥ ११॥
    आत्मनो देहरूपा त्वमस्याधारस्वमेव हि । अस्या नु प्राणैस्त्वं मातस्वत्प्राणैरयमीश्वरः ॥ १२॥ किमहो निर्मितः
    केन हेतुना शिल्पकारिणा । नित्योऽयं च यथा कृष्णस्त्वं च नित्या तथाम्बिके ॥ १३॥ अस्यांशा त्वं त्वदंशो
    वाप्ययं केन निरूपितः । अहं विधाता जगतां वेदानां जनकः स्वयम् ॥ १४॥ तं पठित्वा गुरुमुखाद् भवन्त्येव
    बुधा जनाः । गुणानां वा स्तवानां ते शतांशं वक्तुमक्षमः ॥ १५॥ वेदो वा पण्डितो वान्यः को वा त्वां स्तोतुमीश्वरः
    । स्तवानां जनकं ज्ञानं बुद्धिर्ज्ञानाम्बिका सदा ॥ १६॥ त्वं बुद्धेर्जननी मातः को वा त्वां स्तोतुमीश्वरः
    । यद्वस्तु दृष्टं सर्वेषां तद्विवक्तुं बुधः क्समः ॥ १७॥ यददृष्टाश्रुतं वस्तु तन्निर्वक्तुं च कः क्षमः
    । अहं महेशोऽनन्तश्च स्तोतुं त्वां कोऽपि न क्षमः ॥ १८॥ सरस्वती च वेदाश्च क्समः कः स्तोतुमीश्वरि । यथागमं
    यथोक्तं च न मां निन्दितुमर्हसि ॥ १९॥ ईस्वराणामीस्वरस्य योग्यायोग्ये समा कृपा जनस्य । प्रतिपाल्यस्य
    क्षणे दोषः क्षणे गुणः ॥२०॥ जननी जनको यो वा सर्वं क्समति स्नेहतः । इत्युक्त्वा जगतां धाता तथौ च पुरतस्तयोः
    ॥ २१॥ प्रणम्य चरणाम्भोजं सर्वेस्ःआं वन्द्यमीप्सितम् । ब्रह्मणा च कृतं स्तोत्रं त्रिसंध्यं यः पठेन्नरः
    । राधामाधवयोः पादे भक्तिं दास्यं लभेद् ध्रुवम् ॥ २२॥ कर्मनिर्मूलनं कृत्वा मृत्युं जित्वा सुदुर्जयम्
    । विलङ्घ्य सर्वलोकाश्च याति गोलोकमुत्तमम् ॥ २३॥ ॥ इति श्रीब्रह्मवैवर्ते ब्रह्मण कृतं श्रीराधास्तोत्रं
    सम्पूर्णं॥
