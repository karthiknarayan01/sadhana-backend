id: indrakshikavacam
category: kavacha
name:
  english: indrakshikavacam
  devanagari: इन्द्राक्षीकवचम्
content:
  english: pranavah kilakam | trivargaphalasadhane viniyogah | om hrim shrim vajrahasta me shiro rakshatu
    sarvada | aim saumh klim patu me bhalam vajrini vajrisevita || 1|| phat svaha vajrahasta ca patu netre
    mamanisham | om hram karnau sada patu om shram gandau sadavatu || 2|| om om me nasika patu parama
    parameshvari | om aim mukham ca me patu viradhiraikasundari || 3|| om klim jihvam sada raksheddevata
    shashisundari | om klam kantham mamavyadvai devata suryasundari || 4|| om sah skandhau sada patu devi
    shrivahnisundari | om aim hram me urah patu devata rikshasundari || 5|| om aim shrim me stanau patu
    devi kulishasundari | om shrim hrim me'vatatparshve devi shritithisundari || 6|| om hram saumh me'vatatkukshim
    devi shriyogasundari | om shrim hraum patu me nabhim devata pashasundari || 7|| om shrim me patu jatharam
    devi kamalasundari | om hrum krim patu me bahu devi khatvangasundari || 8|| om hram shrim patu me
    hastau devi marganasundari | om kram hram patu me shtashtham devi bhadrangasundari || 9|| om hrim
    saumh patu me vastim devi pancasyasundari | om shrum hram krim katim patu devata tankasundari || 10||
    om shrim srim patu meshishnam devi pitanasundari | om hrim hrum me'vatadguhyam devi patalasundari
    || 11|| om shrim klaum patu mamuru devi brahmanasundari | om aim staumh me rakshejjanuni devi brahmasundari
    || 12|| om shrimvai patu me janghe devata vishnusundari | om sram hram aim sada'vyanme gulphau girvanasundari
    || 13|| om hrim shrim patu me padau devata shivasundari | om srim hum patu me purve devata yakshasundari
    || 14|| om jum sah patu me vahrau devata daityasundari | om aim klim patu me dakshe devata pretasundari
    || 15|| om shram patu me nairrityam devi rakshasasundari | om shrim mam patu varunyam devi varunasundari
    || 16|| om kraum hum patu vayavyam devata vayusundari | om hum patu kauviryam devi pishacasundari
    || 17|| om hrim shrim patu mamishe devateshanasundari | om aim hum patu mamurdhve devi gaganasundari
    || 18|| om hrim adhastanme mayadevi pannagasundari | om om hrim me prabhate'vyaddevi brahmandasundari
    || 19|| om kraum klim patu mam ratrau devi trailokyasundari | om klim patu nishithe mam devi shrikamasundari
    || 20|| om hram krum mam nishante'vyaddevata lokasundari | sarvatra sarvada patu devi mam rupasundari
    || 21|| rane rajakule puje vivade ripusagrani | davagnyaranyabhitau ca potavyau jurarogatah || 22||
    mahavyadhishu mam patu indrakshi cendrasundari | om hrim shrim aim sauh klim payadindrakshi mam bhavambudheh
    || 23|| shirasah padaparyantam padadimastakantakam | om hrim shrim sarvabhitibhyah indrakshi patu
    me vapuh || 24|| phalashrutih
  devanagari: प्रणवः कीलकम् । त्रिवर्गफलसाधने विनियोगः । ॐ ह्रीं श्रीं वज्रहस्ता मे शिरो रक्षतु सर्वदा
    । ऐं सौंः क्लीं पातु मे भालं वज्रिणी वज्रिसेविता ॥ १॥ फट् स्वाहा वज्रहस्ता च पातु नेत्रे ममानिशम्
    । ॐ ह्रां कर्णौ सदा पातु ॐ श्रां गण्डौ सदावतु ॥ २॥ ॐ ॐ मे नासिका पातु परमा परमेश्वरी । ॐ ऐं मुखं च
    मे पातु वीरधीरैकसुन्दरी ॥ ३॥ ॐ क्लीं जिह्वां सदा रक्षेद्देवता शशिसुन्दरी । ॐ क्लां कण्ठं ममाव्याद्वै
    देवता सूर्यसुन्दरी ॥ ४॥ ॐ सः स्कन्धौ सदा पातु देवी श्रीवह्निसुन्दरी । ॐ ऐं ह्रं मे उरः पातु देवता
    ऋक्षसुन्दरी ॥ ५॥ ॐ ऐं श्रीं मे स्तनौ पातु देवी कुलिशसुन्दरी । ॐ श्रीं ह्रीं मेऽवतात्पार्श्वे देवी
    श्रीतिथिसुन्दरी ॥ ६॥ ॐ ह्रां सौंः मेऽवतात्कुक्षिं देवी श्रीयोगसुन्दरी । ॐ श्रीं ह्रौं पातु मे नाभिं
    देवता पाशसुन्दरी ॥ ७॥ ॐ श्रीं मे पातु जठरं देवी कमलसुन्दरी । ॐ ह्रूं क्रीं पातु मे बाहू देवी खट्वाङ्गसुन्दरी
    ॥ ८॥ ॐ ह्रां श्रीं पातु मे हस्तौ देवी मार्गणसुन्दरी । ॐ क्रां ह्रां पातु मे ष्टष्ठं देवी भद्राङ्गसुन्दरी
    ॥ ९॥ ॐ ह्रीं सौंः पातु मे वस्तिं देवी पञ्चास्यसुन्दरी । ॐ श्रूं ह्रां क्रीं कटिं पातु देवता टङ्कसुन्दरी
    ॥ १०॥ ॐ श्रीं स्रीं पातु मेशिश्नं देवी पीतनसुन्दरी । ॐ ह्रीं ह्रूं मेऽवताद्गुह्यं देवी पातालसुन्दरी
    ॥ ११॥ ॐ श्रीं क्लौं पातु मामूरू देवी ब्राह्मणसुन्दरी । ॐ ऐं स्तौंः मे रक्षेज्जानुनी देवी ब्रह्मसुन्दरी
    ॥ १२॥ ॐ श्रींवै पातु मे जङ्घे देवता विष्णुसुन्दरी । ॐ स्रां ह्रां ऐं सदाऽव्यान्मे गुल्फौ गीर्वाणासुन्दरी
    ॥ १३॥ ॐ ह्रीं श्रीं पातु मे पादौ देवता शिवसुन्दरी । ॐ स्रीं हूं पातु मे पूर्वे देवता यक्षसुन्दरी ॥
    १४॥ ॐ जुं सः पातु मे वह्रौ देवता दैत्यसुन्दरी । ॐ ऐं क्लीं पातु मे दक्षे देवता प्रेतसुन्दरी ॥ १५॥
    ॐ श्रां पातु मे नैरृत्यां देवी रक्षससुन्दरी । ॐ श्रीं मां पातु वारुण्यां देवी वरुणसुन्दरी ॥ १६॥ ॐ
    क्रौं हूं पातु वायव्यं देवता वायुसुन्दरी । ॐ हूं पातु कौवीर्यां देवी पिशाचसुन्दरी ॥ १७॥ ॐ ह्रीं श्रीं
    पातु मामीशे देवतेशानसुन्दरी । ॐ ऐं हुं पातु मामूर्ध्वे देवी गगनसुन्दरी ॥ १८॥ ॐ ह्रीं अधस्तान्मे मायादेवी
    पन्नगसुन्दरी । ॐ ॐ ह्रीं मे प्रभतेऽव्याद्देवी ब्रह्माण्डसुन्दरी ॥ १९॥ ॐ क्रौं क्लीं पातु मां रात्रौ
    देवी त्रैलोक्यसुन्दरी । ॐ क्लिं पातु निशीथे मां देवी श्रीकामसुन्दरी ॥ २०॥ ॐ ह्रां क्रूं मां निशान्तेऽव्याद्देवता
    लोकसुन्दरी । सर्वत्र सर्वदा पातु देवी मां रूपसुन्दरी ॥ २१॥ रणे राजकुले पूजे विवादे रिपुसग्रनि । दावाग्न्यरण्यभीतौ
    च पोताव्यौ जुररोगतः ॥ २२॥ महाव्याधिषु मां पातु इन्द्राक्षी चेन्द्रसुन्दरी । ॐ ह्रीं श्रीं ऐं सौः क्लीं
    पायादिन्द्राक्षी मां भवाम्बुधेः ॥ २३॥ शिरसः पादपर्यन्तं पादादिमस्तकान्तकम् । ॐ ह्रीं श्रीं सर्वभीतिभ्यः
    इन्द्राक्षी पातु मे वपुः ॥ २४॥ फलश्रुतिः
