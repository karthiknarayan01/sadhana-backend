    तरुक्किनमन् मुरुक्कवरिन् ऎरुक्कुमति तरित्तमुटि पटैत्तविऱल् पटैत्तिऱै कऴऱ्कुनिकर् आकुम् अरिय तिरुप्पुकऴै
    उरैत्तवरै अटुत्तपकै अऋत् ऎऱिय उऋक्किऎऴुं अऱत्तैनिलै काणुम् अरुलुम् ऒरुत्तन्मलै विरुत्तनॆन उलत्तिलुऱै
    करुत्तन्मयिल् नटत्तुकुकन् वेले मुटिविलुं इन्त अटियै तेरणि यिट्टुप् पुरम् ऎरित् तान्मकन् चॆङ्कैयिल्वेऱ्
    कूरणि यिट्टणु वाकिक् किरौञ्चङ् कुलैन्तरक्कर् नेरणि यिट्टु वलैन्त कटकं नॆलिन्तु चूर्प् पेरणि कॆट्टतु
    तेवेन्त्र लोकं पिऴैत्ततुवे वीरवेल् तारैवेल् विण्णोर् चिऱै मीट्ट तीरवेल् चॆव्वेल् तिरुक्कैवेल् वारि
    कुलित्तवेल् कॊर्रवेल् चूर्मार्पुं कुनृम् तॊलैत्तवेल् उण्टे तुणै
