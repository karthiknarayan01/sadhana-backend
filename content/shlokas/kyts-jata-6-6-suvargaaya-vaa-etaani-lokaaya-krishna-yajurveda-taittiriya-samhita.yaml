    मु॒पाक॑रो त्यु॒पाक॑रोति स्तो॒त्रग्ग् स्तो॒त्र मु॒पाक॑रोति । उ॒पाक॑रो त्ये॒तस्मि॑ न्नु॒पाक॑रो त्यु॒पाक॑रो
    त्ये॒तस्मिन्न्॑ । वै लो॒के लो॒के वै वै लो॒के । लो॒क इन्द्र॒ इन्द्रो॑ लो॒के लो॒क इन्द्रः॑ । वृँ॒त्र
