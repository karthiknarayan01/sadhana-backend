id: margashirshamasakriteshivashatashtanamastotrammasa-9
category: stotram
name:
  english: margashirshamasakriteshivashatashtanamastotrammasa 9
  devanagari: मार्गशीर्षमासकृतेशिवशताष्टनामस्तोत्रम्मास ९
content:
  english: 2|| akhandanagakodandashcandikeshapriyo harah | gambhiro gaganantasthah sthanuh sarvashariragah
    || 39|| urdhvareta mahaviryo gananatho'mbikapriyah | jatadharo'ndhakaharastrishuli nilalohitah ||
    40|| garadano virupaksho bhavah samsararogahrit | vasanasho bhagakshighno vamano manmathantakah ||
    41|| bhavamayaharo yogi karta sarvasvatantravan | anoraniyanvarado mahato'pi mahattarah || 42|| sarvartukarako
    dhanvi kanjajatottamangadhrik | vishnunetraprapujyanghrirmadhusudanasudanah || 43|| vicararahito mani
    manasvi kalanashanah | somasuryagninayano bhimo bhavyo yugantakrit || 44|| sarasyo dhumrakeshango
    babhrusho bhayaharakah | vatashanadharo garto kailasanilayah svarat || 45|| turashatpujitapado vedavaji
  devanagari: २॥ अखण्डनगकोदण्डश्चण्डिकेशप्रियो हरः । गम्भीरो गगनान्तस्थः स्थाणुः सर्वशरीरगः ॥ ३९॥ ऊर्ध्वरेता
    महावीर्यो गणनाथोऽम्बिकाप्रियः । जटाधरोऽन्धकहरस्त्रिशूली नीललोहितः ॥ ४०॥ गरादनो विरूपाक्षो भवः संसाररोगहृत्
    । वसनाशो भगाक्षिघ्नो वामनो मन्मथान्तकः ॥ ४१॥ भवामयहरो योगी कर्ता सर्वस्वतन्त्रवान् । अणोरणीयान्वरदो
    महतोऽपि महत्तरः ॥ ४२॥ सर्वर्तुकारको धन्वी कञ्जजातोत्तमाङ्गधृक् । विष्णुनेत्रप्रपूज्याङ्घ्रिर्मधुसूदनसूदनः
    ॥ ४३॥ विचाररहितो मानी मनस्वी कालनाशनः । सोमसूर्याग्निनयनो भीमो भव्यो युगान्तकृत् ॥ ४४॥ सरस्यो धूम्रकेशाङ्गो
    बभ्रुशो भयहारकः । वाताशनधरो गर्तो कैलासनिलयः स्वराट् ॥ ४५॥ तुराषाट्पूजितपदो वेदवाजि
