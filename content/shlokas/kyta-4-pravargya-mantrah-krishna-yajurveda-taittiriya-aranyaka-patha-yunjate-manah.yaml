    | vratanam vra~tapate vratancarishyami | tacchakeya ntanme raddhyatam || dyau ssamit | tamaditya ''dityagm
    samindhe | tamahagm samindhe | sa ma samiddha | ayusha tejasa || || varcasa shriya | yashasa brahmavarcasena
    | annadyena samintag svaha | antarikshagm samit | tam ssamindhe | sa vayugm samindhe | tamahagm samindhe
    | sa ma samiddha | ayusha tejasa | varcasa shriya || || yashasa brahmavarcasena | annadyena samintag
    svaha | prithivi samit | tamagni 'gnigm samindhe | tamahagm samindhe | sa ma samiddha | ayusha tejasa
    | varcasa shriya | yashasa brahmavarcasena || || annadyena samintag svaha | prajapatya me samidasi
    sapatnakshayani | bhratrivyaha me | aditya vratapate vratamacarisham | tadashaka vra~tapate vratamacarisham
    | tadashaka yashasa brahmavarcasena mmatarishva shannastapatu suryah | ahani sha shshagm ratrih pratidhiyatam
    || shamusha no vyucchatu shamaditya udetu nah | shiva na shshantama bhava sumridika sarasvati | ma
    te vyoma sandrishi || idayai vastvasi vastuma stumanto bhuyasma ma vasto shchithsmahya vastu ndveshti
    yanca vaya ndvishmah || pratishtha 'si pratishthavanto bhuyasma ma pratishthaya shchithsmahya pratishthah
    sa bhuya ndveshti yanca vaya ndvishmah || a vata vahi bheshajam ~vi vata vahi yadrapah | tvagm hi
    vishvabheshajo devana nduta iyase || dvavimau vatau vata a sindhara paravatah || mme anya avatu para
    drapah || yadado vata te grihe hitah | tato no dehi jivase tato no dhehi bheshajam || tato no maha
    avaha vata avatu bheshajam | shambhu rmayobhurno hride pra na ayugmshi tarishat || indrasya griho
    ntva prapadye sagussashvah | saha yanme asti tena || bhuh prapadye bhuvah prapadye suvah prapadye
    bhurbhuvassuvah prapadye vayum prapadye mprapadye 'shmanamakhana mprapadye prajapater brahmakosha
    mbrahma prapadya o mprapadye || antariksha mbrihadagnayah parvatashca yaya vatah svastya svastimantaya
    svastya svasti manasani || pranapanau mrityorma pata mpranapanau ma ma hasishta mmayyagni stejo dadhatu
    mayi medha mmayindra indriya ndadhatu mayi medha mmayi suryo bhrajo dadhatu || || dyubhiraktubhih
    paripata rashvina saubhagebhih | tanno mitro varuno mamahanta maditi ssindhuh prithivi uta dyauh ||
    kaya nashcitra abhuvaduti sadavridha | kaya shacishthaya vrita || kastva satyo madana mmagmhishtho
    mathsadandhasah | dridha cidaruje vasu || abhi shu na ssakhinamavita jaritrinam | shata mbhavasyutibhih
    || vayah suparna upasedurindra mpriyamedha rishayo nadhamanah | apa dhvantamu rnuhi purdhi cakshu
    nnidhayeva baddhan || || shanno devirabhishtaya apo bhavantu pitaye yo~rabhisravantu nah || ishana
    varyana shaninam | apo yacami bheshajam || sumitra na apa oshadhaya ssantu durmitrastasmai bhuyasu
    ndvishmah || apo hi shtha mayobhuvasta na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo
    rasastasya bhajayateha nah | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha ||
    || apo janayatha ca nah || prithivi shanta sa 'gnina shanta sa me shanta shucagm shamayatu || antarikshagm
    shanta ntanme shantagm shucagm shamayatu | dyau ''dityena shanta sa me shanta shucagm shamayatu ||
