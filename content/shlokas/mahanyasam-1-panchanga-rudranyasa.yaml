id: mahanyasam-1-panchanga-rudranyasa
category: stotram
name:
  english: Mahanyasam - 1. Panchanga Rudranyasa
content:
  english: athatah pancangarudranam nyasapurvaka khyasyamah | athatah pancangarudranam nyasapurvaka nkarishyamanah
    | harih om athatah pancanga rudranam || onkaramantra sam ndhyayanti yoginah | kamada ntasmai onkaraya
    namo namah || namaste deva devesha namaste parameshvara | namaste vrishabharudha nakaraya namo namah
    || o nnamo bhagavate rudraya || o mbhurbhuvassuvah || o nnam || namaste rudra manyava utota ishave
    namah | namaste astu dhanvane bahubhyamuta te namah || ya ta ishuh shivatama shiva mbabhuva te dhanuh
    | shiva sharavya ya tava taya no rudra mridaya | o nnamo bhagavate rudraya || nam om | purvanga rudraya
    namah || mmahapatakanashanam | mahapapaharam va~nde makaraya namo namah || o mbhurbhuvassuvah || o
    nnidhanapataye namah | nidhanapatantikaya namah | urdhvaya namah | urdhvalingaya namah | hiranyaya
    namah | hiranyalingaya namah | suvarnaya namah | suvarnalingaya namah | divyaya namah | divyalingaya
    namah | bhavayah namah | bhavalingaya namah | sharvaya namah | sharvalingaya namah | shivaya namah
    | shivalingaya namah | jvalaya namah | jvalalingaya namah | atmaya namah | atmalingaya namah | paramaya
    namah | paramalingaya namah | etathsomasya suryasya sarvalingagg sthapayati panimantra nnamo bhagavate
    rudraya || mam om || dakshinanga rudraya namah || lo~kanugrahakaranam | shivameka va~nde shikaraya
    namo namah || o mbhurbhuvassuvah || om shim || apaitumrityuramrita nna agan vaivasvato no abhaya va~naspaterivabhinashshiyatagm
    rayissacata nnamo bhagavate rudraya || shim om || pashcimanga rudraya namah || vri~shabho yasya vasuki
    kanthabhushanam | vame shaktidharam va~nde vakaraya namo namah || o mbhurbhuvassuvah || om ngranthirasi
    rudro ma vishantakah | tenannena nnamo bhagavate rudraya vishnave mrityurme pahi || o nnamo bhagavate
    rudraya || vam om || uttaranga rudraya namah || ndevam sarvavyapinamishvaram | yallinga mbhurbhuvassuvah
    || om ya~m || yo rudro agnau yo apsu ya oshadhishu yo rudro vishva bhuvana vivesha tasmai rudraya
    namo astu || o nnamo bhagavate rudraya || yam om || urdhvanga rudraya namah ||
  devanagari: अथातः पञ्चाङ्गरुद्राणां न्यासपूर्वक ख्यास्यामः । अथातः पञ्चाङ्गरुद्राणां न्यासपूर्वक ङ्करिष्यमाणः
    । हरिः ॐ अथातः पञ्चाङ्ग रुद्राणाम् ॥ ओङ्कारमन्त्र सं न्ध्यायन्ति योगिनः । कामद न्तस्मै ओङ्काराय नमो
    नमः ॥ नमस्ते देव देवेश नमस्ते परमेश्वर । नमस्ते वृषभारूढ नकाराय नमो नमः ॥ ओ न्नमो भगवते॑ रुद्रा॒य
    ॥ ओ म्भूर्भुव॒स्सुवः॑ ॥ ओ न्नम् ॥ नम॑स्ते रुद्र म॒न्यव॑ उ॒तोत॒ इष॑वे॒ नमः॑ । नम॑स्ते अस्तु॒ धन्व॑ने
    बा॒हुभ्या॑मु॒त ते॒ नमः॑ ॥ या त॒ इषुः॑ शि॒वत॑मा शि॒व म्ब॒भूव॑ ते॒ धनुः॑ । शि॒वा श॑र॒व्या॑ या तव॒ तया॑
    नो रुद्र मृडय । ओ न्नमो भगवते॑ रुद्रा॒य ॥ नं ओम् । पूर्वाङ्ग रुद्राय॒ नमः ॥ म्महापातकनाशनम् । महापापहरं
    वँन्दे मकाराय नमो नमः ॥ ओ म्भूर्भुव॒स्सुवः॒ ॥ ओ न्निध॑नपतये॒ नमः । निधनपतान्तिकाय॒ नमः । ऊर्ध्वाय॒
    नमः । ऊर्ध्वलिङ्गाय॒ नमः । हिरण्याय॒ नमः । हिरण्यलिङ्गाय॒ नमः । सुवर्णाय॒ नमः । सुवर्णलिङ्गाय॒ नमः
    । दिव्याय॒ नमः । दिव्यलिङ्गाय॒ नमः । भवायः॒ नमः । भवलिङ्गाय॒ नमः । शर्वाय॒ नमः । शर्वलिङ्गाय॒ नमः
    । शिवाय॒ नमः । शिवलिङ्गाय॒ नमः । ज्वलाय॒ नमः । ज्वललिङ्गाय॒ नमः । आत्माय॒ नमः । आत्मलिङ्गाय॒ नमः ।
    परमाय॒ नमः । परमलिङ्गाय॒ नमः । एतथ्सोमस्य॑ सूर्य॒स्य सर्वलिङ्गग्ग्॑ स्थाप॒य॒ति॒ पाणिमन्त्र न्नमो भगवते॑
    रुद्रा॒य ॥ मं ओम् ॥ दक्षिणाङ्ग रुद्राय॒ नमः ॥ लोँकानुग्रहकारणम् । शिवमेक वँन्दे शिकाराय नमो नमः ॥
    ओ म्भूर्भुव॒स्सुवः॒ ॥ ॐ शिम् ॥ अपै॑तुमृ॒त्युरमृत॑ न्न॒ आग॑न् वैवस्व॒तो नो॒ अ॑भय वँन॒स्पतेरिवा॒भिनश्शीयताग्ं
    र॒यिस्सच॑ता न्नमो भगवते॑ रुद्रा॒य ॥ शिं ओम् ॥ पश्चिमाङ्ग रुद्राय॒ नमः ॥ वृँषभो यस्य वासुकी कण्ठभूषणम्
    । वामे शक्तिधरं वँन्दे वकाराय नमो नमः ॥ ओ म्भूर्भुव॒स्सुवः॒ ॥ ॐ ङ्ग्रन्थिरसि रुद्रो मा॑ विशा॒न्तकः
    । तेनान्नेना न्नमो भगवते रुद्राय विष्णवे मृत्यु॑र्मे पा॒हि ॥ ओ न्नमो भगवते॑ रुद्रा॒य ॥ वां ओम् ॥ उत्तराङ्ग
    रुद्राय॒ नमः ॥ न्देवं सर्वव्यापिनमीश्वरम् । यल्लिङ्ग म्भूर्भुव॒स्सुवः॒ ॥ ॐ यँम् ॥ यो रु॒द्रो अ॒ग्नौ
    यो अ॒प्सु य ओष॑धीषु॒ यो रु॒द्रो विश्वा॒ भुव॑ना वि॒वेश॒ तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु ॥ ओ न्नमो भगवते॑
    रुद्रा॒य ॥ यं ओम् ॥ ऊर्ध्वाङ्ग रुद्राय॒ नमः ॥
