id: shodashikavacam
category: kavacha
name:
  english: shodashikavacam
  devanagari: षोडशीकवचम्
content:
  english: suryakotisahasrabham sarvabharanabhushitam | pancavaktram caturbahum shivashaktyatmakam bhaje
    || 3|| shiro'vyanme ramabijam vagbijam locane'vatat | parabijam shruti payat kamabijam ca nasikam
    || 4|| kamarajastathoshthau me shaktih payanmukham mama | vasavyaradananpatu taram jihvam mamavatu
    || 5|| shaktih kantham tatha patu rama skandhau mamavatu | tryaksham bhruvau sada patu dhritih patu
    karau mama || 6|| parabijam patu vaksho lakshmi kukshim mamavatu | shivakuto'vatatprishtham brahmakutam
    tu parshvayoh || 7|| shaktikuto'vatannabhim kantikuto gudam tatha | vayukuto'vataddhastau shaktikutastu
    janutah || 8|| taram janghe sada patu padau shaktirmamavatu | para prabhatakale'vyat vanmadhyahne'vatacca
    mam || 9|| sa sayam patu sarvatra moha'vyanmam nishithake | purvadidikshu taro'vyat vahnivayoh paravatu
    || 10|| jaladurbhikshadaridryat shaktih patu mamanisham | daraputradhanadhyebhyo gajashvagrihamandalat
    || 11|| patu me kamalabijam kamah shriyoginiganat | vagbhavam sarvada patu shrividya sarvato'vatu
    || 12|| itidam kavacam divyam mahashrishodashimayam | mulamantramayam gopyam sarvashaparipurakam ||
    13|| sarvashreyaskaram nityam stutam siddhipradam kalau | yah pathetsadhako nityam dhatte maunavratam
    shive || 14|| sa eva shodashiputrah kameshvarasamaprabhuh | shyamatmako mahakalarupo vairivimardanah
    || 15|| bahuputro ramanatho mantrikottamashekharah | ityetatkathitam varma mahashrishodashimayam ||
    16|| vinanena na siddhih syanmamapi parameshvari | gopyam guhyatamam varma mulamantramayam param ||
    17|| paramarthabhidham vastu gopayetsa sadashivah || iti shrirudrayamale tantre mahashodashi kavacam
    sampurnam | shrirastu ||
  devanagari: सूर्यकोटिसहस्राभां सर्वाभरणभूषिताम् । पञ्चवक्त्रां चतुर्बाहुं शिवशक्त्यात्मकां भजे ॥ ३॥
    शिरोऽव्यान्मे रमाबीजं वाग्बीजं लोचनेऽवतात् । पराबीजं श्रुती पायात् कामबीजं च नासिकाम् ॥ ४॥ कामराजस्तथोष्ठौ
    मे शक्तिः पायान्मुखं मम । वासव्यारदनान्पातु तारं जिह्वां ममावतु ॥ ५॥ शक्तिः कण्ठं तथा पातु रमा स्कन्धौ
    ममावतु । त्र्यक्षं भ्रुवौ सदा पतु धृतिः पतु करौ मम ॥ ६॥ पराबीजं पातु वक्षो लक्ष्मी कुक्षिं ममावतु
    । शिवकूटोऽवतात्पृष्ठं ब्रह्मकूटं तु पार्श्वयोः ॥ ७॥ शक्तिकूटोऽवतान्नाभिं कान्तिकूटो गुदं तथा । वायुकूटोऽवताद्धस्तौ
    शक्तिकूटस्तु जानुतः ॥ ८॥ तारं जङ्घे सदा पातु पादौ शक्तिर्ममावतु । परा प्रभातकालेऽव्यात् वाङ्मध्याह्नेऽवताच्च
    माम् ॥ ९॥ सा सायं पातु सर्वत्र मोहाऽव्यान्मां निशीथके । पूर्वादिदिक्षु तारोऽव्यात् वह्निवायोः परावतु
    ॥ १०॥ जलदुर्भिक्षदारिद्र्यात् शक्तिः पातु ममानिशम् । दारापुत्रधनाढ्येभ्यो गजाश्वगृहमण्डलात् ॥ ११॥
    पातु मे कमलाबीजं कामः श्रीयोगिनीगणात् । वाग्भवं सर्वदा पातु श्रीविद्या सर्वतोऽवतु ॥ १२॥ इतीदं कवचं
    दिव्यं महाश्रीषोडशीमयम् । मूलमन्त्रमयं गोप्यं सर्वाशापरिपूरकम् ॥ १३॥ सर्वश्रेयस्करं नित्यं स्तुतं
    सिद्धिप्रदं कलौ । यः पठेत्साधको नित्यं धत्ते मौनव्रतं शिवे ॥ १४॥ स एव शोडशीपुत्रः कामेश्वरसमप्रभुः
    । श्यामात्मको महाकालरूपो वैरिविमर्दनः ॥ १५॥ बहुपुत्रो रमानाथो मान्त्रिकोत्तमशेखरः । इत्येतत्कथितं
    वर्म महाश्रीशोडशीमयम् ॥ १६॥ विनानेन न सिद्धिः स्यान्ममापि परमेश्वरि । गोप्यं गुह्यतमं वर्म मूलमन्त्रमयं
    परम् ॥ १७॥ परमार्थाभिधं वस्तु गोपयेत्स सदाशिवः ॥ इति श्रीरुद्रयमले तन्त्रे महाषोडशी कवचं सम्पूर्णम्
    । श्रीरस्तु ॥
