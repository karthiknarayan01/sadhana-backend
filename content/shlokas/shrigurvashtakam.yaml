id: shrigurvashtakam
category: stotram
name:
  english: shrigurvashtakam
  devanagari: श्रीगुर्वष्टकम्
content:
  english: tatah kim tatah kim tatah kim tatah kim ||1|| kalatram dhanam putra pautradisarvam grihe bandhavah
    sarvametaddhi jatam | manashcenna lagnam guroranghripadme
  devanagari: ततः किं ततः किं ततः किं ततः किम् ।।१।। कलत्रं धनं पुत्र पौत्रादिसर्वम् गृहे बान्धवाः सर्वमेतद्धि
    जातम् । मनश्चेन्न लग्नं गुरोरङ्घ्रिपद्मे
meaning: {}
