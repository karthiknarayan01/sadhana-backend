id: caitanyasahasra-2
category: sahasranama
name:
  english: caitanyasahasra
  devanagari: चैतन्यसहस्र
content:
  english: shrikrishnacaitanyacandrasyasahasranamastotram 1 namastasmai bhagavate caitanyaya mahatmane
    | kalikalmashanashaya bhavabdhitaranaya ca || 1|| brahmana haridasena shrirupaya prakashitam | tatsarvam
    kathayishyami savadhanam nishamaya || 2|| shrutvaivam vaishnavah sarve prahrishtah premavihvalah |
    sadaram paripapracchuh premagadgadaya gira || 3|| vaishnavanam hi kripaya smritva vakyam pitustada
    | sanontya bhagavadrupam namani kathayami vai || 4|| dhyanam | om asya shrikrishnacaitanyasahasranamastotrasya
    narayanah rishih anushtup chandah shrimadbhagavadbhaktirdevata shriradhakrishnapritaye shrikrishnacaitanya
    namasahasrapathe viniyogah || om namah premasamuccayaya gopijanavallabhaya mahatmane | om vishvambharah
    sadanando vishvajidvishvabhavanah | mahanubhavo vishvatma gaurango gaurabhavanah || 5|| hemaprabho
    dirghabahurdirghagrivah shucirvasuh | caitanyashcetanashcetashcittarupi prabhuh svayam || 6|| radhangi
    radhikabhavo radhanveshi priyamvadah | nitijnah sarvadharmajno bhaktiman purushottamah || 7|| anubhavi
    mahadhairyah shastrajno nityanutanah | prabhavi bhagavan krishnashcaitanyo rasavigrahah || 8|| anadinidhano
    dhata dharanimandanah shucih | varangashcancalo dakshah pratapi sadhusangatah || 9|| unmadi unmado
    viro dhiragrani rasapriyah | raktambaro dandadharah samnyasi yatibhushanah || 10|| dandi chatri cakrapanih
    kripaluh sarvadarshanah | nirayudhah sarvashasta kalidoshapranashanah || 11|| guruvaryah kripasindhurvikrami
    ca janardanah | mlecchagrahi kunitighno dushtahari kripakulah || 12|| brahmacari yativaro brahmanyo
    brahmanah sudhih | dvijarajashcakravarti kavih kripanavatsalah || 13|| nirihah pavako'rthajno nirdhumah
    pavakopamah | naravandyo harakaro bhavishnurnaranayakah || 14|| danaviro yuddhaviro dayaviro vrikodarah
    | jnanaviro mahavirah shantivirah pratapanah || 15|| shrijishnurbhramiko jishnuh sahishnushcarudarshanah
    | naro variyan durdarsho navadvipasudhakarah || 16|| candrahasyashcandranakho balimadudaro bali |
    suryaprabhah suryakamshuh suryango manibhushanah || 17|| kambhukanthah kapolashrirnimnanabhih sulocanah
    | jagannathasuto vipro ratnango ratnabhushanah || 18|| tirtharthi tirthadastirthastirthangastirthasadhakah
    | tirthaspadastirthavasastirthasevi nirashrayah || 19|| tirthaladi tirthaprado brahmako brahmano bhrami
    | shrivasapanditanando ramanandapriyankarah || 20|| gadadharapriyo daso vikrami shankarapriyah | yogi
    yogaprado yogo yogakari triyogakrit || 21|| sarvah sarvasvado bhuma sarvangah sarvasambhavah | vanirbanayudho
    vadi vacaspatirayonijah || 22|| buddhih satyam balam tejo dhritiman jangamakritih | murarirvardhano
    dhata nriharih manavardhanah || 23|| nishkarma karmado nathah karmajnah karmanashakah | anarghah karakah
    karma kriyarhah karmabadhakah || 24|| nirguno gunavanisho vidhata samago'jitah | jitashvaso jitaprano
    jitanango jitendriyah || 25|| krishnabhavi krishnanami krishnatma krishnanayakah | advaito dvaitasahityo
    dvibhavah palako vashi || 26|| shrivasah shridharahavyo halanayakasaravit | vishvarupanujashcandro
    variyan madhavo'cyutah || 27|| rupasaktah sadacaro gunajno bahubhavakah | gunahino gunatito gunagrahi
    gunarnavah || 28|| brahmanando nityanandah premanando'tinandakah | nindyahari nindyavarji nindyaghnah
    paritoshakah || 29|| yajnabahurvinitatma namayajnapracarakah | kalivaryah sucinamshuh paryamsuh pavakopamah
    || 30|| hiranyagarbhah sukshmatma vairajyo virajapatih | vilasi prabhavi svamshi paravasthah shiromanih
    || 31|| mayaghno mayiko mayi mayavadi vicakshanah | krishnacchadi krishnajalpi vishayaghno nirakritih
    || 32|| sankalpashunyo mayisho mayadveshi vrajapriyah | vrajadhisho vrajapatirgopagokulanandanah ||
    33|| vrajavasi vrajabhavo vrajanayakasattamah | guptapriyo guptabhavo vanchitah satkulashrayah ||
    34|| raganugo ragasindhu ragatma ragavardhanah | ragodgatah premasakshi bhattanathah sanatanah ||
    35|| gopalabhattagah prito lokanathapriyah patuh | dvibhujah shadbhujo rupi rajadarpavinashanah ||
    36|| kashimishrapriyo vandyo vandaniyah shaciprasuh | mishrapurandaradhiso raghunathapriyo rayah ||
    37|| sarvabhaumadarpahari amogharirvasupriyah | sahajah sahajadhishah shashvatah pranayaturah || 38||
    kilakincidabhavartah pandugandah shucaturah | pralapi bahuvak shuddhah rijurvakragatih shivah || 39||
    ghattayito'ravindakshah premavaicityalakshakah | priyabhimani caturah priyavarti priyonmukhah || 40||
    lomancitah kampadharah ashrumukho vishokaha | hasyapriyo hasyakari hasyayug hasyanagarah || 41|| hasyagrami
    hasyakarastribhangi nartanakulah | urdhvaloma urdhvahasta urdhvaravi vikaravan || 42|| bhavollasi
    dhirashanto dhirango dhiranayakah | devaspado devadhama devadevo manobhavah || 43|| hemadrirhemalavanyah
    sumerurbrahmasadanah | airavatasvarnakantih sharaghno vanchitapradah || 44|| karobhoruh sudirghakshah
    kampabhrucakshunasikah | namagranthi namasankhya bhavabaddhastrishaharah || 45|| papakarshi papahari
    papaghnah papashodhakah | darpaha dhanado'righno manaha ripuha madhuh || 46|| rupaha veshaha divyo
    dinabandhuh kripamayah | sudhaksharah sudhasvadi sudhama kamaniyakah || 47|| nirmukto muktido mukto
    muktakhyo muktibadhakah | nihshanko nirahankaro nirvairo vipadapahah || 48|| vidagdho navalavanyo
    navadvipadvija prabhuh | nirankusho devavandyah suracaryah surariha || 49|| suravaryo nindyahari vadaghnah
    paritoshakah | suprakasho brihadbahurmitrajnah kavibhushanah || 50|| varaprado varapango varayug varanayakah
    | pushpahasah padmagandhih padmaragah prajagarah || 51|| urdhvagah satpathacari pranada urdhvagayakah
    | janapriyo janahlado janakarishi janasprihah || 52|| ajanma janmanilayo jananado janardradhih | jagannatho
    jagadbandhurjagaddevo jagatpatih || 53|| janakari janamodo janakanandasagrahah | kalipriyah kalishlaghyah
    kalimanavivardhanah || 54|| kalivaryah sadanandah kalikrit kalidhanyaman | vardhamanah shrutidharah
    vardhano vriddhidayakah || 55|| sampadah sharano daksho ghrinangi kalirakshakah | kalidhanyah samayajnah
    kalipunyaprakashakah || 56|| nishcinto dhiralalito dhiravak preyasipriyah | vamasparshi vamabhavo
    vamarupo manoharah || 57|| atindriyah suradhyaksho lokadhyakshah kritakritah | yugadikrid yugakaro
    yugajno yuganayakah || 58|| yugavarto yugasimah kalavan kalashaktidhrik | pranayah shashvato hrishto
    vishvajid buddhimohanah || 59|| sandhyata dhyanakrid dhyani dhyanamangalasandhiman | visrutatma hridisthiro
    gramaniyapragrahakah || 60|| svaramurcchi svaralapi svaramurtivibhushanah | ganagrahi ganalubdho gayako
    ganavardhanah || 61|| ganamanyo hyaprameyah satkarta vishvadhrik sahah | kshirabdhikamathakarah premagarbhajhashakritih
    || 62|| bibhatsurbhavahridayah adrishyo barhidarshakah | jnanaruddho dhirabuddhirakhilatmapriyah sudhih
    || 63|| ameyah sarvavidbhanurbabhrurbahushiro rucih | urushravah mahadirgho vrishakarma vrishakritih
    || 64|| shrutismritidharo vedah shrutijnah shrutibadhakah | hridisprisha asa atma shrutisaro vicakshanah
    || 65|| kalapi niranugrahi vaidyavidyapracarakah | mimamsakarirvedanga vedarthaprabhavo gatih || 66||
    paravarajno dushparo virahangi satam gatih | asankhyeyo'prameyatma siddhidah siddhisadhanah || 67||
    dharmaseturdharmaparo dharmatma dharmabhavanah | udirnasamshayacchinno vibhutih shashvatah sthirah
    || 68|| shuddhatma shobhanotkantho'nirdeshyah sadhanapriyah | granthapriyo granthamayah shastrayonirmahashayah
    || 69|| avarno varnanilayo nashrami caturashramah | avipra viprakrit stutyo rajanyo rajyanashakah
    || 70|| avashyo vashyatadhinah shribhaktivyavasayakah | manojavah purayita bhaktikirtiranamayah ||
    71|| nidhivarji bhaktinidhirdurlabho durgabhavakrit | kartanih kirtiratulah amrito murajapriyah ||
    72|| sha
  devanagari: श्रीकृष्णचैतन्यचन्द्रस्यसहस्रनामस्तोत्रम् १ नमस्तस्मै भगवते चैतन्याय महात्मने । कलिकल्मषनाशाय
    भवाब्धितारणाय च ॥ १॥ ब्रह्मणा हरिदासेन श्रीरूपाय प्रकाशितम् । तत्सर्वं कथयिष्यामि सावधानं निशामय ॥
    २॥ श्रुत्वैवं वैष्णवाः सर्वे प्रहृष्टाः प्रेमविह्वलाः । सादरं परिपप्रच्छुः प्रेमगद्गदया गिरा ॥ ३॥
    वैष्णवानां हि कृपया स्मृत्वा वाक्यं पितुस्तदा । सणोन्त्य भगवद्रूपं नामानि कथयामि वै ॥ ४॥ ध्यानम् ।
    ॐ अस्य श्रीकृष्णचैतन्यसहस्रनामस्तोत्रस्य नारायणः ऋषिः अनुष्टुप् छन्दः श्रीमद्भगवद्भक्तिर्देवता श्रीराधाकृष्णप्रीतये
    श्रीकृष्णचैतन्य नामसहस्रपथे विनियोगः ॥ ॐ नमः प्रेमसमुच्चयाय गोपीजनवल्लभाय महात्मने । ॐ विश्वम्भरः
    सदानन्दो विश्वजिद्विश्वभावनः । महानुभावो विश्वात्मा गौराङ्गो गौरभावनः ॥ ५॥ हेमप्रभो दीर्घबाहुर्दीर्घग्रीवः
    शुचिर्वसुः । चैतन्यश्चेतनश्चेतश्चित्तरूपी प्रभुः स्वयम् ॥ ६॥ राधाङ्गी राधिकाभावो राधान्वेशी प्रियंवदः
    । नीतिज्ञः सर्वधर्मज्ञो भक्तिमान् पुरुषोत्तमः ॥ ७॥ अनुभावी महाधैर्यः शास्त्रज्ञो नित्यनूतनः । प्रभावी
    भगवान् कृष्णश्चैतन्यो रसविग्रहः ॥ ८॥ अनादिनिधनो धाता धरणीमन्दनः शुचिः । वराङ्गश्चञ्चलो दक्षः प्रतापी
    साधुसङ्गतः ॥ ९॥ उन्मादी उन्मदो वीरो धीरग्राणी रसप्रियः । रक्ताम्बरो दण्डधरः संन्यासी यतिभूषणः ॥ १०॥
    दण्डी छत्री चक्रपाणिः कृपालुः सर्वदर्शनः । निरायुधः सर्वशास्ता कलिदोषप्रनाशनः ॥ ११॥ गुरुवर्यः कृपासिन्धुर्विक्रमी
    च जनार्दनः । म्लेच्छग्राही कुनीतिघ्नो दुष्टहारी कृपाकुलः ॥ १२॥ ब्रह्मचारी यतिवरो ब्रह्मण्यो ब्राह्मणः
    सुधीः । द्विजराजश्चक्रवर्ती कविः कृपणवत्सलः ॥ १३॥ निरीहः पावकोऽर्थज्ञो निर्धूमः पावकोपमः । नारवन्द्यो
    हराकारो भविष्णुर्नरनायकः ॥ १४॥ दानवीरो युद्धवीरो दयावीरो वृकोदरः । ज्ञानवीरो महावीरः शान्तिवीरः प्रतापनः
    ॥ १५॥ श्रीजिष्णुर्भ्रमिको जिष्णुः सहिष्णुश्चारुदर्शनः । नरो वरीयान् दुर्दर्शो नवद्वीपसुधाकरः ॥ १६॥
    चन्द्रहास्यश्चन्द्रनखो बलिमदुदरो बली । सूर्यप्रभः सूर्यकांशुः सूर्याङ्गो मणिभूषणः ॥ १७॥ कम्भुकण्ठः
    कपोलश्रीर्निम्ननाभिः सुलोचनः । जगन्नाथसुतो विप्रो रत्नाङ्गो रत्नभूषणः ॥ १८॥ तीर्थार्थी तीर्थदस्तीर्थस्तीर्थाङ्गस्तीर्थसाधकः
    । तीर्थास्पदस्तीर्थवासस्तीर्थसेवी निराश्रयः ॥ १९॥ तीर्थालादी तीर्थप्रदो ब्राह्मको ब्रह्मणो भ्रमी ।
    श्रीवासपण्डितानन्दो रामानन्दप्रियङ्करः ॥ २०॥ गदाधरप्रियो दासो विक्रमी शङ्करप्रियः । योगी योगप्रदो
    योगो योगकारी त्रियोगकृत् ॥ २१॥ सर्वः सर्वस्वदो भूमा सर्वाङ्गः सर्वसम्भवः । वाणिर्बाणायुधो वादी वाचस्पतिरयोनिजः
    ॥ २२॥ बुद्धिः सत्यं बलं तेजो धृतिमान् जङ्गमकृतिः । मुरारिर्वर्धनो धाता नृहरिः मानवर्धनः ॥ २३॥ निष्कर्मा
    कर्मदो नाथः कर्मज्ञः कर्मनाशकः । अनर्घः कारकः कर्म क्रियार्हः कर्मबाधकः ॥ २४॥ निर्गुणो गुणवानीशो विधाता
    सामगोऽजितः । जितश्वासो जितप्राणो जितानङ्गो जितेन्द्रियः ॥ २५॥ कृष्णभावी कृष्णनामी कृष्णात्मा कृष्णनायकः
    । अद्वैतो द्वैतसाहित्यो द्विभावः पालको वशी ॥ २६॥ श्रीवासः श्रीधराहव्यो हलनायकसारवित् । विश्वरूपानुजश्चन्द्रो
    वरीयान् माधवोऽच्युतः ॥ २७॥ रूपासक्तः सदाचारो गुणज्ञो बहुभावकः । गुणहीनो गुणातीतो गुणग्राही गुणार्णवः
    ॥ २८॥ ब्रह्मानन्दो नित्यानन्दः प्रेमानन्दोऽतिनन्दकः । निन्द्यहारी निन्द्यवर्जी निन्द्यघ्नः परितोषकः
    ॥ २९॥ यज्ञबाहुर्विनीतात्मा नामयज्ञप्रचारकः । कलिवर्यः सुचिनांशुः पर्यांसुः पावकोपमः ॥ ३०॥ हिरण्यगर्भः
    सूक्ष्मात्मा वैराज्यो विरजापतिः । विलासी प्रभावी स्वांशी परावस्थः शिरोमणिः ॥ ३१॥ मायाघ्नो मायिको मायी
    मायावादी विचक्षणः । कृष्णाच्छादी कृष्णजल्पी विषयघ्नो निराकृतिः ॥ ३२॥ सङ्कल्पशून्यो मायीशो मायाद्वेशी
    व्रजप्रियः । व्रजाधीशो व्रजपतिर्गोपगोकुलनन्दनः ॥ ३३॥ व्रजवासी व्रजभावो व्रजनायकसत्तमः । गुप्तप्रियो
    गुप्तभावो वाञ्छितः सत्कुलाश्रयः ॥ ३४॥ रागानुगो रागसिन्धू रागात्मा रागवर्धनः । रागोद्गतः प्रेमसाक्षी
    भट्टनाथः सनातनः ॥ ३५॥ गोपालभट्टगः प्रीतो लोकनाथप्रियः पटुः । द्विभुजः षड्भुजो रूपी राजदर्पविनाशनः
    ॥ ३६॥ काशिमिश्रप्रियो वन्द्यो वन्दनीयः शचिप्रसूः । मिश्रपुरन्दराधिसो रघुनाथप्रियो रयः ॥ ३७॥ सार्वभौमदर्पहारी
    अमोघारिर्वसुप्रियः । सहजः सहजाधीशः शाश्वतः प्रणयातुरः ॥ ३८॥ किलकिञ्चिदभावार्तः पाण्डुगण्डः शुचातुरः
    । प्रलापी बहुवाक् शुद्धः ऋजुर्वक्रगतिः शिवः ॥ ३९॥ घत्तायितोऽरविन्दाक्षः प्रेमवैचित्यलक्षकः । प्रियाभिमानी
    चतुरः प्रियावर्ती प्रियोन्मुखः ॥ ४०॥ लोमाञ्चितः कम्पधरः अश्रुमुखो विशोकहा । हास्यप्रियो हास्यकारी
    हास्ययुग् हास्यनागरः ॥ ४१॥ हास्यग्रामी हास्यकरस्त्रिभङ्गी नर्तनाकुलः । ऊर्ध्वलोमा ऊर्ध्वहस्त ऊर्ध्वरावी
    विकारवान् ॥ ४२॥ भवोल्लासी धीरशान्तो धीरङ्गो धीरनायकः । देवास्पदो देवधामा देवदेवो मनोभवः ॥ ४३॥ हेमाद्रिर्हेमलावण्यः
    सुमेरुर्ब्रह्मसादनः । ऐरावतस्वर्णकान्तिः शरघ्नो वाञ्छितप्रदः ॥ ४४॥ करोभोरूः सुदीर्घाक्षः कम्पभ्रूचक्षुनासिकः
    । नामग्रन्थी नामसङ्ख्या भावबद्धस्तृषाहरः ॥ ४५॥ पापाकर्षी पापहारी पापघ्नः पापशोधकः । दर्पहा धनदोऽरिघ्नो
    मानहा रिपुहा मधुः ॥ ४६॥ रूपहा वेशहा दिव्यो दीनबन्धुः कृपामयः । सुधक्षरः सुधास्वादी सुधामा कमनीयकः
    ॥ ४७॥ निर्मुक्तो मुक्तिदो मुक्तो मुक्ताख्यो मुक्तिबाधकः । निःशङ्को निरहङ्कारो निर्वैरो विपदापहः ॥
    ४८॥ विदग्धो नवलावण्यो नवद्वीपद्विज प्रभुः । निरङ्कुशो देववन्द्यः सुराचार्यः सुरारिहा ॥ ४९॥ सुरवर्यो
    निन्द्यहारी वादघ्नः परितोषकः । सुप्रकाशो बृहद्बाहुर्मित्रज्ञः कविभूषणः ॥ ५०॥ वरप्रदो वरपाङ्गो वरयुग्
    वरनायकः । पुष्पहासः पद्मगन्धिः पद्मरागः प्रजागरः ॥ ५१॥ ऊर्ध्वगः सत्पथाचारी प्राणद ऊर्ध्वगायकः । जनप्रियो
    जनाह्लादो जनकऋषि जनस्पृहः ॥ ५२॥ अजन्मा जन्मनिलयो जनानदो जनार्द्रधीः । जगन्नाथो जगद्बन्धुर्जगद्देवो
    जगत्पतिः ॥ ५३॥ जनकारी जनामोदो जनकानन्दसाग्रहः । कलिप्रियः कलिश्लाघ्यः कलिमानविवर्धनः ॥ ५४॥ कलिवर्यः
    सदानन्दः कलिकृत् कलिधन्यमान् । वर्धामनः श्रुतिधरः वर्धनो वृद्धिदायकः ॥ ५५॥ सम्पदः शारणो दक्षो घृणाङ्गी
    कलिरक्षकः । कलिधन्यः समयज्ञः कलिपुण्यप्रकाशकः ॥ ५६॥ निश्चिन्तो धीरललितो धीरवाक् प्रेयसीप्रियः । वामास्पर्शी
    वामभावो वामरूपो मनोहरः ॥ ५७॥ अतीन्द्रियः सुराध्यक्षो लोकाध्यक्षः कृतकृतः । युगादिकृद् युगकरो युगज्ञो
    युगनायकः ॥ ५८॥ युगावर्तो युगासीमः कालवान् कालशक्तिधृक् । प्रणयः शाश्वतो हृष्टो विश्वजिद् बुद्धिमोहनः
    ॥ ५९॥ सन्ध्याता ध्यानकृद् ध्यानी ध्यानमङ्गलसन्धिमान् । विस्रुतात्मा हृदिस्थिरो ग्रामनियप्रग्राहकः
    ॥ ६०॥ स्वरमूर्च्छी स्वरालापी स्वरमूर्तिविभूषणः । गानग्राही गानलुब्धो गायको गानवर्धनः ॥ ६१॥ गानमान्यो
    ह्यप्रमेयः सत्कर्ता विश्वधृक् सहः । क्षीराब्धिकमथाकारः प्रेमगर्भझषाकृतिः ॥ ६२॥ बीभत्सुर्भावहृदयः अदृश्यो
    बर्हिदर्शकः । ज्ञानरुद्धो धीरबुद्धिरखिलात्मप्रियः सुधीः ॥ ६३॥ अमेयः सर्वविद्भानुर्बभ्रूर्बहुशिरो रुचिः
    । उरुश्रवाः महादीर्घो वृषकर्मा वृषाकृतिः ॥ ६४॥ श्रुतिस्मृतिधरो वेदः श्रुतिज्ञः श्रुतिबाधकः । हृदिस्पृश
    आस आत्मा श्रुतिसारो विचक्षणः ॥ ६५॥ कलापी निरनुग्राही वैद्यविद्याप्रचारकः । मीमांसकारिर्वेदाङ्ग वेदार्थप्रभवो
    गतिः ॥ ६६॥ परावरज्ञो दुष्पारो विरहाङ्गी सतां गतिः । असङ्ख्येयोऽप्रमेयात्मा सिद्धिदः सिद्धिसाधनः ॥
    ६७॥ धर्मसेतुर्धर्मपरो धर्मात्मा धर्मभावनः । उदीर्णसंशयच्छिन्नो विभूतिः शाश्वतः स्थिरः ॥ ६८॥ शुद्धात्मा
    शोभनोत्कण्ठोऽनिर्देश्यः साधनप्रियः । ग्रन्थप्रियो ग्रन्थमयः शास्त्रयोनिर्महाशयः ॥ ६९॥ अवर्णो वर्णनिलयो
    नाश्रमी चतुराश्रमः । अविप्र विप्रकृत् स्तुत्यो राजन्यो राज्यनाशकः ॥ ७०॥ अवश्यो वश्यताधीनः श्रीभक्तिव्यवसायकः
    । मनोजवः पुरयिता भक्तिकीर्तिरनामयः ॥ ७१॥ निधिवर्जी भक्तिनिधिर्दुर्लभो दुर्गभावकृत् । कर्तनीः कीर्तिरतुलः
    अमृतो मुरजप्रियः ॥ ७२॥ श
