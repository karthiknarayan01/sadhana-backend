id: amritanadopanishat
category: upanishad
name:
  english: amritanadopanishat
  devanagari: अमृतनादोपनिषत्
content:
  english: upanishad || amritanadopanishat || om saha navavatu | saha nau bhunaktu | saha viryam karavavahai
    | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih || shastranyadhitya medhavi
    abhyasya ca punah punah | paramam brahma vijnaya ulkavattanyathotsrijet || 1 || onkararathamaruhya
    vishnum kritvatha sarathim | brahmalokapadanveshi rudraradhanatatparah || 2 || tavadrathena gantavyam
    yavadrathapathi sthitah | sthitva rathapathasthanam rathamutsrijya gacchati || 3 || matralingapadam
    tyaktva shabdavyanjanavarjitam | asvarena makarena padam sukshmam ca gacchati || 4 || shabdadivishayah
    panca manashcaivaticancalam | cintayedatmano rashminpratyaharah sa ucyate || 5 || pratyaharastatha
    dhyanam pranayamo'tha dharana | tarkashcaiva samadhishca shadango yoga ucyate || 6 || yatha parvatadhatunam
    dahyante dhamananmalah | tathendriyakrita dosha dahyante pranadharanat || 7 || pranayamairdaheddoshandharanabhishca
    kilbisham | pratyaharena samsargan dhyanenanishvarangunan || 8 || kilbisham hi kshayam nitva ruciram
    caiva cintayet || 9 || ruciram recakam caiva vayorakarshanam tatha | pranayamastrayah prokta recapurakakumbhakah
    || 10 || savyahritim sapranavam gayatrim shirasa saha | trih pathedayatapranah pranayamah sa ucyate
    || 11 || utkshipya vayumakashe shunyam kritva niratmakam | shunyabhave niyunjiyadrecakasyeti lakshanam
    || 12 || vaktrenotpalanalena toyamakarshayennarah | evam vayurgrahitavyah purakasyeti lakshanam ||
    13 || nocchvasenna ca nishvaset gatrani naiva calayet | evam bhavam niyunjiyat kumbhakasyeti lakshanam
    || 14 || andhavatpashya rupani shabdam badhiravat shrinu | kashthavatpashya te deham prashantasyeti
    lakshanam || 15 || manah sankalpakam dhyatva samkshipyatmani buddhiman | dharayitva tatha''tmanam
    dharana parikirtita || 16 || agamasyavirodhena uhanam tarka ucyate | samam manyeta yam labdhva sa
    samadhih prakirtitah || 17 || bhumau darbhasane ramye sarvadoshavivarjite | kritva manomayim raksham
    japtva vai rathamandale || 18 || padmakam svastikam vapi bhadrasanamathapi va | baddhva yogasanam
    samyaguttarabhimukhah sthitah || 19 || nasikaputamangulya pidhayaikena marutam | akrishya dharayedagnim
    shabdamevabhicintayet || 20 || omityekaksharam brahma omityekena recayet | divyamantrena bahudha kuryadatmamalacyutim
    || 21 || pashcaddhyayita purvoktakramasho mantravidbudhah | sthulatisthulamatrayam nabherurdhvarupakramah
    || 22 || tiryagurdhvamadho drishtim vihaya ca mahamatih | sthirasthayi vinishkampah sada yogam samabhyaset
    || 23 || talamatravinishkampo dharanayojanam tatha | dvadashamatro yogastu kalato niyamah smritah
    || 24 || aghoshamavyanjanamasvaram ca akanthatalvoshthamanasikam ca | arephajatamubhayoshmavarjitam
    yadaksharam na ksharate kadacit|| 25 || yenasau pashyate margam pranastena hi gacchati | atastamabhyasennityam
    sanmargagamanaya vai || 26 || hriddvaram vayudvaram ca murdhadvaramatah param | mokshadvaram bilam
    caiva sushiram mandalam viduh || 27 || bhayam krodhamathalasyamatisvapnatijagaram | atyaharamanaharam
    nityam yogi vivarjayet || 28 || anena vidhina samyagnityamabhyasatah kramat | svayamutpadyate jnanam
    tribhirmasairna samshayah || 29 || caturbhih pashyate devanpancabhistulyavikramah | icchayapnoti kaivalyam
    shashthe masi na samshayah || 30 || parthivah pancamatrastu caturmatrastu varunah | agneyastu trimatro'sau
    vayavyastu dvimatrakah || 31 || ekamatrastathakasho hyardhamatram tu cintayet | siddhim kritva tu
    manasa cintayedatmanatmani || 32 || trimshatsardhangulah prano yatra pranah pratishthitah | esha prana
    iti khyato bahyapranasya gocarah || 33 || ashitishca shatam caiva sahasrani trayodasha | lakshashcaikonanihshvasa
    ahoratrapramanatah || 34 || prana adyo hridisthane apanastu punargude | samano nabhideshe tu udanah
    kanthamashritah || 35 || vyanah sarveshu cangeshu sada vyavritya tishthati | atha varnastu pancanam
    pranadinamanukramat || 36 || raktavarno maniprakhyah pranavayuh prakirtitah | apanastasya madhye tu
    indragopasamaprabhah || 37 || samanastu dvayormadhye gokshiradhavalaprabhah | apandura udanashca vyano
    hyarcissamaprabhah || 38 || yasyedam mandalam bhitva maruto yati murdhani | yatra tatra mriyedvapi
    na sa bhuyo'bijayate | na sa bhuyo'bhijayata ityupanishat || 39 || om saha navavatu | saha nau bhunaktu
    | saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih ||
    || iti amritanadopanishatsamapta ||
  devanagari: उपनिषद् ॥ अमृतनादोपनिषत् ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ शास्त्राण्यधीत्य मेधावी अभ्यस्य च पुनः पुनः । परमं ब्रह्म
    विज्ञाय उल्कावत्तान्यथोत्सृजेत् ॥ १ ॥ ओङ्काररथमारुह्य विष्णुं कृत्वाथ सारथिम् । ब्रह्मलोकपदान्वेषी
    रुद्राराधनतत्परः ॥ २ ॥ तावद्रथेन गन्तव्यं यावद्रथपथि स्थितः । स्थित्वा रथपथस्थानं रथमुत्सृज्य गच्छति
    ॥ ३ ॥ मात्रालिङ्गपदं त्यक्त्वा शब्दव्यञ्जनवर्जितम् । अस्वरेण मकारेण पदं सूक्ष्मं च गच्छति ॥ ४ ॥ शब्दादिविषयाः
    पञ्च मनश्चैवातिचञ्चलम् । चिन्तयेदात्मनो रश्मीन्प्रत्याहारः स उच्यते ॥ ५ ॥ प्रत्याहारस्तथा ध्यानं प्राणायामोऽथ
    धारणा । तर्कश्चैव समाधिश्च षडङ्गो योग उच्यते ॥ ६ ॥ यथा पर्वतधातूनां दह्यन्ते धमनान्मलाः । तथेन्द्रियकृता
    दोषा दह्यन्ते प्राणधारणात् ॥ ७ ॥ प्राणायामैर्दहेद्दोषान्धारणाभिश्च किल्बिषम् । प्रत्याहारेण संसर्गान्
    ध्यानेनानीश्वरान्गुणान् ॥ ८ ॥ किल्बिषं हि क्षयं नीत्वा रुचिरं चैव चिन्तयेत् ॥ ९ ॥ रुचिरं रेचकं चैव
    वायोराकर्षणं तथा । प्राणायामास्त्रयः प्रोक्ता रेचपूरककुम्भकाः ॥ १० ॥ सव्याहृतिं सप्रणवां गायत्रीं
    शिरसा सह । त्रिः पठेदायतप्राणः प्राणायामः स उच्यते ॥ ११ ॥ उत्क्षिप्य वायुमाकाशे शून्यं कृत्वा निरात्मकम्
    । शून्यभावे नियुञ्जीयाद्रेचकस्येति लक्षणम् ॥ १२ ॥ वक्त्रेणोत्पलनालेन तोयमाकर्षयेन्नरः । एवं वायुर्ग्रहीतव्यः
    पूरकस्येति लक्षणम् ॥ १३ ॥ नोच्छ्वसेन्न च निश्वसेत् गात्राणि नैव चालयेत् । एवं भावं नियुञ्जीयात् कुम्भकस्येति
    लक्षणम् ॥ १४ ॥ अन्धवत्पश्य रूपाणि शब्दं बधिरवत् शृणु । काष्ठवत्पश्य ते देहं प्रशान्तस्येति लक्षणम्
    ॥ १५ ॥ मनः सङ्कल्पकं ध्यात्वा संक्षिप्यात्मनि बुद्धिमान् । धारयित्वा तथाऽऽत्मानं धारणा परिकीर्तिता
    ॥ १६ ॥ आगमस्याविरोधेन ऊहनं तर्क उच्यते । समं मन्येत यं लब्ध्वा स समाधिः प्रकीर्तितः ॥ १७ ॥ भूमौ दर्भासने
    रम्ये सर्वदोषविवर्जिते । कृत्वा मनोमयीं रक्षां जप्त्वा वै रथमण्डले ॥ १८ ॥ पद्मकं स्वस्तिकं वापि भद्रासनमथापि
    वा । बद्ध्वा योगासनं सम्यगुत्तराभिमुखः स्थितः ॥ १९ ॥ नासिकापुटमङ्गुल्या पिधायैकेन मारुतम् । आकृष्य
    धारयेदग्निं शब्दमेवाभिचिन्तयेत् ॥ २० ॥ ओमित्येकाक्षरं ब्रह्म ओमित्येकेन रेचयेत् । दिव्यमन्त्रेण बहुधा
    कुर्यादात्ममलच्युतिम् ॥ २१ ॥ पश्चाद्ध्यायीत पूर्वोक्तक्रमशो मन्त्रविद्बुधः । स्थूलातिस्थूलमात्रायं
    नाभेरूर्ध्वरुपक्रमः ॥ २२ ॥ तिर्यगूर्ध्वमधो दृष्टिं विहाय च महामतिः । स्थिरस्थायी विनिष्कम्पः सदा योगं
    समभ्यसेत् ॥ २३ ॥ तालमात्राविनिष्कम्पो धारणायोजनं तथा । द्वादशमात्रो योगस्तु कालतो नियमः स्मृतः ॥ २४
    ॥ अघोषमव्यञ्जनमस्वरं च अकण्ठताल्वोष्ठमनासिकं च । अरेफजातमुभयोष्मवर्जितं यदक्षरं न क्षरते कदाचित्॥
    २५ ॥ येनासौ पश्यते मार्गं प्राणस्तेन हि गच्छति । अतस्तमभ्यसेन्नित्यं सन्मार्गगमनाय वै ॥ २६ ॥ हृद्द्वारं
    वायुद्वारं च मूर्धद्वारमतः परम् । मोक्षद्वारं बिलं चैव सुषिरं मण्डलं विदुः ॥ २७ ॥ भयं क्रोधमथालस्यमतिस्वप्नातिजागरम्
    । अत्याहरमनाहरं नित्यं योगी विवर्जयेत् ॥ २८ ॥ अनेन विधिना सम्यग्नित्यमभ्यसतः क्रमात् । स्वयमुत्पद्यते
    ज्ञानं त्रिभिर्मासैर्न संशयः ॥ २९ ॥ चतुर्भिः पश्यते देवान्पञ्चभिस्तुल्यविक्रमः । इच्छयाप्नोति कैवल्यं
    षष्ठे मासि न संशयः ॥ ३० ॥ पार्थिवः पञ्चमात्रस्तु चतुर्मात्रस्तु वारुणः । आग्नेयस्तु त्रिमात्रोऽसौ
    वायव्यस्तु द्विमात्रकः ॥ ३१ ॥ एकमात्रस्तथाकाशो ह्यर्धमात्रं तु चिन्तयेत् । सिद्धिं कृत्वा तु मनसा
    चिन्तयेदात्मनात्मनि ॥ ३२ ॥ त्रिंशत्सार्धाङ्गुलः प्राणो यत्र प्राणः प्रतिष्ठितः । एष प्राण इति ख्यातो
    बाह्यप्राणस्य गोचरः ॥ ३३ ॥ अशीतिश्च शतं चैव सहस्राणि त्रयोदश । लक्षश्चैकोननिःश्वास अहोरात्रप्रमाणतः
    ॥ ३४ ॥ प्राण आद्यो हृदिस्थाने अपानस्तु पुनर्गुदे । समानो नाभिदेशे तु उदानः कण्ठमाश्रितः ॥ ३५ ॥ व्यानः
    सर्वेषु चाङ्गेषु सदा व्यावृत्य तिष्ठति । अथ वर्णास्तु पञ्चानां प्राणादीनामनुक्रमात् ॥ ३६ ॥ रक्तवर्णो
    मणिप्रख्यः प्राणवायुः प्रकीर्तितः । अपानस्तस्य मध्ये तु इन्द्रगोपसमप्रभः ॥ ३७ ॥ समानस्तु द्वयोर्मध्ये
    गोक्षीरधवलप्रभः । आपाण्डुर उदानश्च व्यानो ह्यर्चिस्समप्रभः ॥ ३८ ॥ यस्येदं मण्डलं भित्वा मारुतो याति
    मूर्धनि । यत्र तत्र म्रियेद्वापि न स भूयोऽबिजायते । न स भूयोऽभिजायत इत्युपनिषत् ॥ ३९ ॥ ॐ सह नाववतु
    । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः
    ॥ ॥ इति अमृतनादोपनिषत्समाप्ता ॥
