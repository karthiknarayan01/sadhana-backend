id: gauristotrambrahmakritam
category: stotram
name:
  english: gauristotrambrahmakritam
  devanagari: गौरीस्तोत्रम्ब्रह्मकृतं
content:
  english: tvam namami shivam shantamishvarardhasharirinim | anadyanantavibhavam mulaprakritimishvarim
    || 13|| janmamrityujaratitam janmamrityujarapaham | kshetrajnashaktinilayam paramakashamadhyagam ||
    14|| brahmendravishnunamitamashtamurtyanginimajam | pradhanapurushatitam savitrim vedamataram || 15||
    rigyajuhsamanilayamrijvim kundalinim param | vishveshvarim vishvamayim vishveshvarapativratam || 16||
    vishvasamharakaranim vishvamayapravartinim | sargasthityantakarinim vyaktavyaktasvarupinim || 17||
    pahi mam devadeveshi sharanagatavatsale | nanya gatirmaheshani mama trailokyacandite || 18|| tvam
    mata mama kalyani pita sarveshvarah shivah | srishto'ham tripuraghnena srishtayartham shankarapriye
    || 19|| vividhashca prajah srishta na vriddhimupayanti tah | tatah param prajah sarva maithunaprabhavah
    kila || 20|| samvadhayitumicchami kritva srishtimatah param | shaktini khalu sarvasam tvattah srishtih
    pravartate || 21|| naiva srishtam tvaya purvam shaktinam yatkulam shive | sarvesham dehinam devi sarvashaktipradayini
    || 22|| tvameva natra sandehastasmattvam varada bhava | mama srishtivivriddhyarthamamshenaikena shashvate
    || 23|| mama putrasya dakshasya putri bhava shucismite | prarthita vai tada devi brahmana munipungavah
    || 24|| ekam shaktim bhuyormadhyatsasarjatmasamaprabham | aha tam prahasanprekshya devim vishveshvaro
    harah || 25|| brahmano vacanaddevi kuru tasya yathepsitam | adaya shirasa shambhorajnam sa parameshvari
    || 26|| abhavaddakshaduhita svecchaya brahmarupini | punaradya para shaktih shambhordeham samavishat
    || 27|| ardhanarishvaro devo vibhatiti hi nah shrutih || tatah prabhriti viprendra maithunaprabhavah
    prajah || 28|| evam vah kathita vipra devyah sambhutiruttama | pathedyah sha
  devanagari: त्वां नमामि शिवां शान्तामीश्वरार्धशरीरिणीम् । अनाद्यनन्तविभवां मूलप्रकृतिमीश्वरीम् ॥ १३॥
    जन्ममृत्युजरातीतां जन्ममृत्युजरपहाम् । क्षेत्रज्ञशक्तिनिलयां परमाकाशमध्यगाम् ॥ १४॥ ब्रह्मेन्द्रविष्णुनमितामष्टमूर्त्यङ्गिनीमजाम्
    । प्रधानपुरुषातीतां सावित्रीं वेदमातरम् ॥ १५॥ ऋग्यजुःसामनिलयामृज्वीं कुण्डलिनीं पराम् । विश्वेश्वरीं
    विश्वमयीं विश्वेश्वरपतिव्रताम् ॥ १६॥ विश्वसंहारकरणीं विश्वमायाप्रवर्तिनीम् । सर्गस्थित्यन्तकरिणीं
    व्यक्ताव्यक्तस्वरूपिणीम् ॥ १७॥ पाहि मां देवदेवेशि शरणागतवत्सले । नान्या गतिर्महेशानि मम त्रैलोक्यचन्दिते
    ॥ १८॥ त्वं माता मम कल्याणि पिता सर्वेश्वरः शिवः । सृष्टोऽहं त्रिपुरघ्नेन सृष्टयर्थं शङ्करप्रिये ॥
    १९॥ विविधाश्च प्रजाः सृष्टा न वृद्धिमुपयान्ति ताः । ततः परं प्रजाः सर्वा मैथुनप्रभवाः किल ॥ २०॥ संवधयितुमिच्छामि
    कृत्वा सृष्टिमतः परम् । शक्तिनी खलु सर्वासां त्वत्तः सृष्टिः प्रवर्तते ॥ २१॥ नैव सृष्टं त्वया पूर्वं
    शक्तीनां यत्कुलं शिवे । सर्वेषां देहिनां देवि सर्वशक्तिप्रदायिनी ॥ २२॥ त्वमेव नात्र सन्देहस्तस्मात्त्वं
    वरदा भव । मम सृष्टिविवृद्ध्यर्थमंशेनैकेन शाश्वते ॥ २३॥ मम पुत्रस्य दक्षस्य पुत्री भव शुचिस्मिते ।
    प्रार्थिता वै तदा देवी ब्रह्मणा मुनिपुङ्गवाः ॥ २४॥ एकां शक्तिं भूयोर्मध्यात्ससर्जात्मसमप्रभाम् । आह
    तां प्रहसन्प्रेक्ष्य देवीं विश्वेश्वरो हरः ॥ २५॥ ब्रह्मणो वचनाद्देवि कुरु तस्य यथेप्सितम् । आदाय शिरसा
    शम्भोराज्ञां सा परमेश्वरी ॥ २६॥ अभवद्दक्षदुहिता स्वेच्छया ब्रह्मरूपिणी । पुनराद्या परा शक्तिः शम्भोर्देहं
    समाविशत् ॥ २७॥ अर्धनारीश्वरो देवो विभातीति हि नः श्रुतिः ॥ ततः प्रभृति विप्रेन्द्रा मैथुनप्रभवाः प्रजाः
    ॥ २८॥ एवं वः कथिता विप्रा देव्याः सम्भूतिरुत्तमा । पठेद्यः श
