id: kumaritarpanatmakastotram
category: stotram
name:
  english: kumaritarpanatmakastotram
  devanagari: कुमारीतर्पणात्मकस्तोत्रम्
content:
  english: ve vidya dana ki samasta nidanabhuta mokshadatri bhagavati ko prapta kara lete haim | use vipatti
    pradana kara satane vale samasta rajagana nashta ho jate haim | isa tarpana ka patha karane vala sadhaka
    kshanamatra mem rajaom ko apane vasha mem kara leta hai | kim bahuna samasta yoga usamem nitya rupa
    se nivasa karate haim || 61|| tarpanatmakamokshakhyam pathanti yadi manushah | ashtaishvaryayuto bhutva
    vatsarattam prapashyati || 62|| mahayogi bhavennatha masadabhyasatah prabho | trailokyam kshobhayetkshipram
    vanchaphalamavapnuyat || 63|| yadi manushya tarpana se yukta isa moksha namaka stotra ka patha kare
    to vaha atho aishvarya se yukta ho kara eka varsha ke bhitara bhagavati ka darshana prapta kara leta
    hai | he natha
  devanagari: वे विद्या दान की समस्त निदानभूता मोक्षदात्री भगवती को प्राप्त कर लेते हैं । उसे विपत्ति
    प्रदान कर सताने वाले समस्त राजागण नष्ट हो जाते हैं । इस तर्पण का पाठ करने वाला साधक क्षणमात्र में
    राजाओं को अपने वश में कर लेता है । किं बहुना समस्त योग उसमें नित्य रूप से निवास करते हैं ॥ ६१॥ तर्पणात्मकमोक्षाख्यं
    पठन्ति यदि मानुषाः । अष्टैश्वर्ययुतो भूत्वा वत्सरात्तां प्रपश्यति ॥ ६२॥ महायोगी भवेन्नाथ मासादभ्यासतः
    प्रभो । त्रैलोक्यं क्षोभयेत्क्षिप्रं वाञ्छाफलमवाप्नुयात् ॥ ६३॥ यदि मनुष्य तर्पण से युक्त इस मोक्ष
    नामक स्तोत्र का पाठ करे तो वह आठो ऐश्वर्य से युक्त हो कर एक वर्ष के भीतर भगवती का दर्शन प्राप्त कर
    लेता है । हे नाथ
meaning: {}
