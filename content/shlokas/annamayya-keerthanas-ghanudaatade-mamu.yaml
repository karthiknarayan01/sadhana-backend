id: annamayya-keerthanas-ghanudaatade-mamu
category: stotram
name:
  english: Annamayya Keerthanas Ghanudaatade Mamu
content:
  english: pallavi ghanudatade mamu gacugaka hari anishamu nemika natanikè sharanu || yèvvani nabhini
    yi brahmadulu yèvvadu rakshakudinnitiki | yèvvani mulamu yi sacaracara mavvala nivvala natanike sharanu
    || ghanudatade mamu gacugaka hari purushottamudani pògadi rèvvarini kari nèvvadu gragana gacè | dhara
    yèvvadètti danujula bòrigònè aruduga memika natanikè sharanu || ghanudatade mamu gacugaka hari shrisati
    yèvvani jeri vuramunanu bhasillè nèvvadu paramambai | dasula kòrakai tagu shrivenkatamu asa cupi nitadatanikè
    sharanu || ghanudatade mamu gacugaka hari anishamu nemika natanikè sharanu ||
  devanagari: पल्लवि घनुडातडे ममु गाचुगाक हरि अनिशमु नेमिक नतनिकॆ शरणु ॥ यॆव्वनि नाभिनि यी ब्रह्मादुलु
    यॆव्वडु रक्षकुडिन्निटिकि । यॆव्वनि मूलमु यी सचराचर मव्वल निव्वल नतनिके शरणु ॥ घनुडातडे ममु गाचुगाक
    हरि पुरुषोत्तमुडनि पॊगडि रॆव्वरिनि करि नॆव्वडु ग्रगन गाचॆ । धर यॆव्वडॆत्ति दनुजुल बॊरिगॊनॆ अरुदुग
    मेमिक नतनिकॆ शरणु ॥ घनुडातडे ममु गाचुगाक हरि श्रीसति यॆव्वनि जेरि वुरमुननु भासिल्लॆ नॆव्वडु परमम्बै
    । दासुल कॊरकै तगु श्रीवेङ्कटमु आस चूपि नितडतनिकॆ शरणु ॥ घनुडातडे ममु गाचुगाक हरि अनिशमु नेमिक नतनिकॆ
    शरणु ॥
