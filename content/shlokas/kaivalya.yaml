id: kaivalya
category: upanishad
name:
  english: kaivalya
  devanagari: कैवल्य
content:
  english: pasham sa eva mayaparimohitatma shariramasthaya karoti sarvam | stryannapanadivicitrabhogaih
    sa eva jagratparitriptimeti || 12|| svapne sa jivah sukhaduhkhabhokta svamayaya kalpitajivaloke |
    sushuptikale sakale viline tamo'bhibhutah sukharupameti || 13|| punashca janmantarakarmayogatsa eva
    jivah svapiti prabuddhah | puratraye kridati yashca jivastatastu jatam sakalam vicitram | adharamanandamakhandabodham
    yasmi~llayam yati puratrayam ca || 14|| etasmajjayate prano manah sarvendriyani ca | kham vayurjyotirapashca
    prithvi vishvasya dharini || 15|| yatparam brahma sarvatma vishvasyayatanam mahat | sukshmatsukshmataram
    nityam tattvameva tvameva tat || 16|| jagratsvapnasushuptyadiprapancam yatprakashate | tadbrahmahamiti
    jnatva sarvabandhaih pramucyate || 17|| trishu dhamasu yadbhogyam bhokta bhogashca yadbhavet | tebhyo
    vilakshanah sakshi cinmatro'ham sadashivah || 18|| mayyeva sakalam jatam mayi sarvam pratishthitam
    | mayi sarvam layam yati tadbrahmadvayamasmyaham || 19|| || prathamah khandah || 1|| anoraniyanahameva
    tadvanmahanaham vishvamaham vicitram | puratano'ham purusho'hamisho hiranmayo'ham shivarupamasmi ||
    20|| apanipado'hamacintyashaktih pashyamyacakshuh sa sha
  devanagari: पाशं स एव मायापरिमोहितात्मा शरीरमास्थाय करोति सर्वम् । स्त्र्यन्नपानादिविचित्रभोगैः स एव
    जाग्रत्परितृप्तिमेति ॥ १२॥ स्वप्ने स जीवः सुखदुःखभोक्ता स्वमायया कल्पितजीवलोके । सुषुप्तिकाले सकले
    विलीने तमोऽभिभूतः सुखरूपमेति ॥ १३॥ पुनश्च जन्मान्तरकर्मयोगात्स एव जीवः स्वपिति प्रबुद्धः । पुरत्रये
    क्रीडति यश्च जीवस्ततस्तु जातं सकलं विचित्रम् । आधारमानन्दमखण्डबोधं यस्मिँल्लयं याति पुरत्रयं च ॥ १४॥
    एतस्माज्जायते प्राणो मनः सर्वेन्द्रियाणि च । खं वायुर्ज्योतिरापश्च पृथ्वी विश्वस्य धारिणी ॥ १५॥ यत्परं
    ब्रह्म सर्वात्मा विश्वस्यायतनं महत् । सूक्ष्मात्सूक्ष्मतरं नित्यं तत्त्वमेव त्वमेव तत् ॥ १६॥ जाग्रत्स्वप्नसुषुप्त्यादिप्रपञ्चं
    यत्प्रकाशते । तद्ब्रह्माहमिति ज्ञात्वा सर्वबन्धैः प्रमुच्यते ॥ १७॥ त्रिषु धामसु यद्भोग्यं भोक्ता भोगश्च
    यद्भवेत् । तेभ्यो विलक्षणः साक्षी चिन्मात्रोऽहं सदाशिवः ॥ १८॥ मय्येव सकलं जातं मयि सर्वं प्रतिष्ठितम्
    । मयि सर्वं लयं याति तद्ब्रह्माद्वयमस्म्यहम् ॥ १९॥ ॥ प्रथमः खण्डः ॥ १॥ अणोरणीयानहमेव तद्वन्महानहं
    विश्वमहं विचित्रम् । पुरातनोऽहं पुरुषोऽहमीशो हिरण्मयोऽहं शिवरूपमस्मि ॥ २०॥ अपाणिपादोऽहमचिन्त्यशक्तिः
    पश्याम्यचक्षुः स श
