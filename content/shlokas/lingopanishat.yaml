id: lingopanishat
category: upanishad
name:
  english: lingopanishat
  devanagari: लिन्गोपनिषत्
content:
  english: prakara ucyate | shirahpanipadapayupastham sarvam lingasvarupam | brahmano vadet || onkaro
    banah shaktireva pitham sinduravarnam sarvam lingasvarupam | kaivalyam kevalam vidyat | vyavaharaparah
    syat | prana eva pranah | purvam brahma pitham | vishnurbanah | rudrah svarupam | sarvabhutairathaparityajyashca
    | vigrahamanugrahalingeshu shaktikapaleshu sarvavashankaram vidyat | jativishayan tyajet | shrautashrauteshu
    dharanam | vedoktavidhina shrautam tadrahitamashrautam | sarvavarneshu dharanam kailasasiddhirbhavati
    | dharanam dehe kailasasvarupam | dharanam dehe kaivalyasvarupam | dhalranam dehe pranavasvarupam
    | dharanam dehe vedasvarupam | dharanam dehe brahmasvarupam | dharanam dehe shivasvarupam | shirasi
    banam bahunabhipithaprakritirupakam dehe dharanam yasya na vidyate taddeham na pashyet | shirahkapalam
    keshan na kuryat | shirahpitham lingatmakam sarvam | shambhavivigraha ucyate | pranadilingasvarupam
    gurolingam | gurusambhavatmakam lingam praguroh | tatah prathamam pranipatati | pranavasvarupam lingam
    brahmalingam | prakashatmakam lingam vidyalingam | vidyalingam jnanasvarupam | lingam pracarecchasrat
    | lingasvarupeyam sidvirbhavishyati | sarvadeheshu lingadharanam bhavati | iti vedapurusho manyate
    | mahapurushopetam yo veda sa eva nityaputasthah | sa eva nityaputasthah syaddaivalaukikah purushah
    | sa evamushmikapurusha iti manyante | jivatma paramatma ca sa evocyate | ishtapranabhaveshu lingadharanam
    vadanti | ishte dharanam | tisrah purastripada vishvacarshani | puranashe lingasvarupajnasiddhirbhavatyavajnane'sati
    | samyuktam lingam moksha eva bhavatyeva | mokshameva dharanam vidyat | ushantiva mataram kuryat |
    ityevam vedetyupanishat | om tatsat ||
  devanagari: प्रकार उच्यते । शिरःपाणिपादपायूपस्थं सर्वं लिङ्गस्वरूपम् । ब्राह्मणो वदेत् ॥ ओङ्कारो बाणः
    शक्तिरेव पीठं सिन्दूरवर्णं सर्वं लिङ्गस्वरूपम् । कैवल्यं केवलं विद्यात् । व्यवहारपरः स्यात् । प्राण
    एव प्राणः । पूर्वं ब्रह्मा पीठम् । विष्णुर्बाणः । रुद्रः स्वरूपम् । सर्वभूतैरथापरित्याज्यश्च । विग्रहमनुग्रहलिङ्गेषु
    शक्तिकपालेषु सर्ववशङ्करं विद्यात् । जातिविषयान् त्यजेत् । श्रौताश्रौतेषु धारणम् । वेदोक्तविधिना श्रौतं
    तद्रहितमश्रौतम् । सर्ववर्णेषु धारणं कैलाससिद्धिर्भवति । धारणं देहे कैलासस्वरूपम् । धारणं देहे कैवल्यस्वरूपम्
    । धाल्रणं देहे प्रणवस्वरूपम् । धारणं देहे वेदस्वरूपम् । धारणं देहे ब्रह्मस्वरूपम् । धारणं देहे शिवस्वरूपम्
    । शिरसि बाणं बाहुनाभिपीठप्रकृतिरूपकं देहे धारणं यस्य न विद्यते तद्देहं न पश्येत् । शिरःकपालं केशान्
    न कुर्यात् । शिरःपीठं लिङ्गात्मकं सर्वम् । शाम्भवीविग्रह उच्यते । प्राणादिलिङ्गस्वरूपं गुरोलिङ्गम्
    । गुरुसम्भवात्मकं लिङ्गं प्रगुरोः । ततः प्रथमं प्रणिपतति । प्रणवस्वरूपं लिङ्गं ब्रह्मलिङ्गम् । प्रकाशात्मकं
    लिङ्गं विद्यालिङ्गम् । विद्यालिङ्गं ज्ञानस्वरूपम् । लिङ्गं प्रचरेच्छास्रात् । लिङ्गस्वरूपेयं सिद्विर्भविष्यति
    । सर्वदेहेषु लिङ्गधारणं भवति । इति वेदपुरुषो मन्यते । महापुरुषोपेतं यो वेद स एव नित्यपूतस्थः । स एव
    नित्यपूतस्थः स्याद्दैवलौकिकः पुरुषः । स एवामुष्मिकपुरुष इति मन्यन्ते । जीवात्मा परमात्मा च स एवोच्यते
    । इष्टप्राणाभावेषु लिङ्गधारणं वदन्ति । इष्टे धारणम् । तिस्रः पुरस्त्रिपदा विश्वचर्षणी । पुरनाशे लिङ्गस्वरूपाज्ञासिद्धिर्भवत्यवज्ञानेऽसति
    । संयुक्तं लिङ्गं मोक्ष एव भवत्येव । मोक्षमेव धारणं विद्यात् । उशन्तीव मातरं कुर्यात् । इत्येवं वेदेत्युपनिषत्
    । ॐ तत्सत् ॥
