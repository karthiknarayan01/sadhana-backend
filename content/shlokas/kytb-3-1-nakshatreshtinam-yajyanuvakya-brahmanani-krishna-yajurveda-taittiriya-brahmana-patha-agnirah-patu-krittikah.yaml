id: kytb-3-1-nakshatreshtinam-yajyanuvakya-brahmanani-krishna-yajurveda-taittiriya-brahmana-patha-agnirah-patu-krittikah
category: stotram
name:
  english: KYTB 3.1 Nakshatreshtinam Yajyanuvakya Brahmanani - Krishna Yajurveda Taittiriya Brahmana Patha
    - Agnirah Patu Krittikah
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake prathamah prapathakah 'nuvakya brahmanani
    o shri gurubhyo namah | harih om || anuvakam ya~jyanuvakyah agnirnah patu krittikah | nakshatra ndevamindriyam
    | idamasam vi~cakshanam | havirasa njuhotana || yasya bhanti rashmayo yasya ketavah | yasyema vishva
    bhuvanani sarva | sa krittikabhirabhi sam va~sanah | agnirno deva ssuvite dadhatu || prajapate rohini
    vetu patni | vishvarupa brihati citrabhanuh || || sa no yajnasya suvite dadhatu | yatha jivema sharada
    ssavirah || rohini devyudaga t | vishva rupani pratimodamana | prajapatigm havisha vardhayanti | priya
    devana mupayatu yajnam || somo raja mrigashira mpriyamasya dhama | apyayamano bahudha janeshu | retah
    prajam shamasti | priyagm raja m | tasmai te soma havisha vidhema | shanna edhi dvipade sha ncatushpade
    || ardraya rudrah prathamana eti | shreshtho devana m | nakshatramasya havisha vidhema | ma nah prajagm
    ririsha nmota viran || heti rudrasya parino vrinaktu | ardra nakshatra njushatagm havirnah || || pramuncamanau
    duritani vishva nnudatamaratim || punarno devyaditi ssprinotu | punarvasu nah punaretam ya~jnam |
    punarno deva abhiyantu sarve | punah punarvo havisha yajamah || eva na devyaditiranarva | vishvasya
    bhartri jagatah pratishtha | punarvasu havisha vardhayanti | priya || brihaspatih prathama njayamanah
    | tishya nnakshatramabhi sambabhuva | shreshtho devana mpritanasu jishnuh | disho 'nu sarva abhayanno
    astu || tishyah purastaduta maddhyato nah | brihaspati rnah paripatu pashcat | badheta nkrinutam |
    suviryasya pataya ssyama || idagm sarpebhyo havirastu jushta m | ashresha yesha nkshiyanti | tenah
    sarpaso havamagamishthah || ye rocane suryasyapi sarpah | ye diva ndevimanu sancaranti | yeshamashresha
    anuyanti kama m | tebhyah sarpebhyo madhumajjuhomi || upahutah pitaro ye maghasu | manojavasa ssukritah
    sukrityah | te no nakshatre havamagamishthah | svadhabhi ryajna || ye agnidagdha ye mpitarah kshiyanti
    | yag shca vidmayagm u ca na pravidma | maghasu yajnagm sukrita mpatih phalguninamasi tvam | tadaryaman
    varuna mitra caru | ta ntva vayagm sanitaragm saninam | jiva jivantamupa sam vi~shema || yenema vishva
    bhuvanani sanjita | yasya deva anu sam 'jarastuvishman | phalgunina mrishabho roraviti || shreshtho
    devana mbhagavo bhagasi | tattva viduh phalgunistasya vittat | asmabhya nkshatramajaragm suvirya sannudeha
    || bhago ha data bhaga i tpradata | bhago devih phalguniravivesha | bhagasyetta ngamema | yatra devai
    ssavitopayatu | hiranyayena suvrita rathena | vahan vi~dmanapasam | prayacchanta mpunyamaccha || hastah
    prayaccha tvamritam va~siyah | dakshinena pratigribhnima enat | dataramadya savita videya | yo no
    hastaya prasuvati yajnam || tvashta nakshatramabhyeti citram | subhagm sasam yu~vatigm rocamanam ||
    nmartyagshca | rupani pigmsha || tannastvashta tadu citra vicashtam | tannakshatra mbhurida astu mahya
    vi~ravatigm sanotu | gobhirno ashvai ssamanaktu yajnam || vayurnakshatra m | tigmashringo vrishabho
    roruvanah | samiraya | apa dveshagmsi nudatamaratih || || tanno vayustadu nishtya shrinotu | tannakshatra
    mbhurida astu mahya m | tanno devaso anu janantu kama m | yatha tarema duritani vishva || duramasmacchatravo
    yantu bhitah | tadindragni krinuta dvishakhe | tanno deva anumadantu yajnam | pashca dabhayanno astu
    || nakshatrana madhipatni vishakhe | shreshthavindragni bhuvanasya gopau || napabadhamanau | apa kshudha
    nnudatamaratim || purna pashcaduta purna purasta t | unmaddhyatah pau rnamasi jigaya | tasya va~santah
    | uttame naka iha madayantam || prithvi suvarca yuvati | paurnamasyudaga cchobhamana | apyayayanti
    duritani vishva ya~jyanuvakyah riddhyasma havyai rnamasopa sadya | mitra mmitradheyanno astu | anuradhan
    havisha vardhayantah | shata t | anuradhasa iti ya dvadanti | tanmitra eti pathibhi rdevayanaih |
    hiranyayai rvitatai rantarikshe || indro jyeshthamanu nakshatrameti | yasmin vritram vri~tra turye
    tatara || || tasmin vayamamrita ndurishtim || purandaraya vrishabhaya dhrishnave | ashadhaya sahamanaya
    midhushe | indraya jyeshtha madhuma nkrinotu yajamanaya lokam || mula ritih paraca | gobhi rnakshatra
    ssamaktam | aharbhuya || aharno adya suvite dadhatu | mula mprajayai shivamastu mahya m || ya divya
    apah payasa sa mbabhuvuh | ya antariksha uta parthiviryah | yasamashadha anuyanti kama syona bhavantu
    || yashca kupya yashca nadya | yashca vaishantiruta prasaciryah || || yasamashadha madhu bhakshayanti
    | ta na apa syona bhavantu || tanno vishve upa shrinvantu devah | tadashadha abhi sam ya~ntu yajnam
    | tannakshatra ryajamanaya kalpatam || shubhrah kanya yuvatayah supeshasah | karmakritah sukrito viryavatih
    | vishva havisha vardhayantih | ashadhah kamamupayantu yajnam || thsarvametat | amunca loka midamuca
    sarva m | tanno nakshatramabhiji dvijitya | shriya tvahriniyamanam || ubhau lokau brahmana sanjitemau
    | tanno nakshatramabhiji dvicashtam | tasmin vaya njayema | tanno devaso anujanantu kama m || shrinvanti
    shrona mamritasya gopam | punyamasya upashrinomi vaca majuryam | praticimenagm havisha yajamah ||
    tredha vishnu rurugayo vicakrame | mahi mantariksham | tacchronaiti shrava icchamana | punyagg shlokam
    ya~jamanaya krinvati || ashtau deva vasava ssomyasah | catasro devi rajara shshravishthah | te yajna
    mamritagg svasti || nnah pantu vasavah purasta 'bhiyantu shravishthah | punya vi~shama | ma no arati
    raghashagmsa gann || kshatrasya raja varuno 'dhirajah | nakshatranagm shatabhishag vasishthah | tau
    devebhyah krinuto dirghamayuh | shatagm sahasra bheshajani dhattah || yajnanno raja varuna upayatu
    | tanno vishve abhi sam || tanno nakshatragm shatabhishag jushanam | dirghamayuh pratira dbheshajani
    || aja ekapadudaga t | vishva bhutani pratimodamanah | tasya devah prasavam | proshthapadaso amritasya
    gopah || vibhrajamana ssamidhana ugrah | a gandyam | tagm surya majamekapadam | proshthapadaso anuyanti
    sarve rbuddhniyah prathamana eti | shreshtho devanamuta manushanam | ta ssomyasah | proshthapadaso
    abhi rakshanti sarve || catvara ekamabhi karma devah | proshthapadasa iti yan vadanti | te buddhaniya
    mparishadyagg stuvantah | ahigm rakshanti namasopasadya || pusha revatyanveti pantha m | pushtipati
    pashupa vajabastyau || || imani havya prayata jushana | sugairno yanairupayatam ya~jnam || kshudra
    nrakshatu revati nah | gavo no ashvagm anvetu pusha | annagm rakshantau bahudha virupam | vajagm sanutam
    ya~jamanaya yajnam || tadashvina vashvayujopayatam | shubha ngamishthau suyamebhirashvaih nnakshatragm
    havisha yajantau | maddhva sampriktau yajusha samaktau || mbhishajau havyavahau | vishvasya duta vamritasya
    gopau | tau nakshatra dyamo raja bhagavan vicashtam | lokasya raja mahato mahan nnakshatre yama eti
    raja nnenamabhyashicannta devah | tadasya citragm havisha yajama | apa papmana rbharantu || niveshani
    sangamani vasunam vi~shva rupani vasu nyaveshayanti | sahasraposhagm subhaga rarana sa na agan varcasa
    sam vi~dana || yatte deva adadhu rbhagadheyamamavasye sam va~santo mahitva | sano yajna mpiprihi vishvavare
    rayi nno dhehi subhage suvira candramasadinam saptanamishtinam ya~jyanuvakyah navonavo bhavati jayamano
    nketurushasa metyagre ndevebhyo vidadhatyaya stirati dirghamayuh || yamaditya agmshuma pyayayanti
    yamaditya agmshuma pyayayanti yamakshita makshitayah pibanti | tena no raja varuno brihaspatira pyayayantu
    bhuvanasya gopah |||| ye virupe samanasa sam | vibhu prabhu anubhu vishvato huve | te no nakshatre
    havamagametam || vaya ndevi brahmana sam vi~danah | suratnaso devaviti ndadhanah | ahoratre havisha
    vardhayantah | ati papmana matimuktya gamema || pratyuvadrishyayati || || vyucchanti duhita divah
    | apo mahi vrinute cakshusha || tamo jyotishkrinoti sunari ssacate suryah | sa ca udyannakshatra marcimat
    | tavedusho vyushi suryasya ca || sa mbhaktena gamemahi | tanno nakshatra marcimat | bhanumatteja
    uccarat | upa yajna || pra nakshatraya devaya | indrayendugm havamahe | sa nah savita suva thsanim
    | pushtidam vi~ravattamam || udu tya va~hanti ketavah | drishe vishvaya surya rmitrasya varunasya
    ' pra dyavaprithivi antarikshagm surya atma jagatastasthushashca |||| aditirna urushyatvaditi shsharma
    yacchatu | aditih patvagm hasah || mahimushu mataragm suvratanamritasya patnimavase huvema | tuvikshatramajarantimurucigm
    susharmanamaditigm supranitim || || idam rvicakrame tredha ni dadhe padam | sa mudhamasya pagm sure
    || prata dvishnuh stavate viryaya | mrigo na bhimah kucaro girishthah | yasyorushu trishu vikramaneshu
    | adhikshiyanti bhuvanani vishva || || agnirmurdha divah kaku tpatih prithivya ayam | apagm retagmsi
    jinvati || bhuvo yajnasya rajasashca neta yatra niyudbhi ssacase shivabhih | divi murdhana njihvamagne
    cakrishe havyavaha ndeveshu manyatam | agnishca havyavahano bhavata ndashushe mayah || anvidanumate
    tva mmanyasai shancanah kridhi | kratve dakshaya no hinu prana ayugmshi tarishah || || havyavaha mpritanasu
    jishnum | jyotishmanta mpurandhim | agnigg svishtakritama huvema || svishtamagne abhi ta tprinahi
    | vishva deva pritana abhishya | uru mpradishanvi bhahi | jyotishmaddhehyajara deva nakshatreshtibrahmanam
    agnirva akamayata | annado devanag syamiti | sa etamagnaye krittikabhyah purodasha nniravapat | tato
    vai so 'nnado devanamabhavat | agnirvai devanamannadah || yatha ha va agni mannadah | evagm ha va
    esha manushyana mbhavati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | agnaye svaha krittikabhya
    | ambayai svaha dulayai svaha | nitatnyai svaha 'bhrayantyai svaha | meghayantyai svaha vara | cupunikayai
    svaheti || || prajapatih praja asrijata | ta asma thsrishtah paracirayann | tasagm rohini mabhyaddhyayat
    | so ''varteta | samenaya gaccheyeti | sa eta mprajapataye rohinyai caru nniravapat | tato vai sa
    tamupavartata | samenaya 'gacchata || upa ha va ena mpriyamavartate | sa mpriyena gacchate | ya etena
    havisha yajate | ya u cainadevam 'tra juhoti | prajapataye svaha rohinyai svaha | rocamanayai svaha
    || somo va akamayata | oshadhinagm rajya mabhijayeyamiti | sa etagm somaya mrigashira mpayasi niravapat
    | tato vai sa oshadhinagm rajyamabhyajayat | samananagm ha vai rajyamabhijayati | ya etena havisha
    yajate | ya u cainadevam 'tra juhoti | somaya svaha mrigashira | rajyaya svaha 'bhijityai svaheti
    || || rudro va akamayata | pashuman thsyamiti | sa etagm rudrayardrayai praiyangava mpayasi niravapat
    | tato vai sa pashumanabhavat | pashuman ha vai bhavati | ya etena havisha yajate | ya u cainadevam
    'tra juhoti | rudraya svaha ''rdrayai svaha | pinvamanayai svaha pashubhya || riksha va iyamalomaka
    rvanaspatibhih prajayeyeti | saitamadityai punarvasubhya nniravapat | tato va iyamoshadhibhi rvanaspatibhih
    prajayata | prajayate ha vai prajaya pashubhih | ya etena havisha yajate | ya u cainadevam 'tra juhoti
    | adityai svaha punarvasubhyam | svaha || brihaspatirva akamayata | brahmavarcasi syamiti | sa eta
    mbrihaspataye tishyaya naivara mpayasi niravapat | tato vai sa brahmavarcasyabhavat | brahmavarcasi
    ha vai bhavati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | brihaspataye svaha tishyaya
    svaha | brahmavarcasaya svaheti || ya~tta asann | te deva ssarpebhya ashreshabhya ajye karambha nniravapann
    | tanetabhireva devata bhirupanayann | etabhir mupanayati | ya etena havisha yajate | ya u cainadevam
    'tra juhoti | sarpebhya || pitaro va akamayanta | pitriloka riddhnuyameti | ta eta mpitribhyo maghabhyah
    purodashagm shatkapala nniravapann | tato vai te pitriloka a rdhnuvann | pitriloke ha va ridhnoti
    | ya etena havisha yajate | ya u cainadevam 'tra juhoti | pitribhya ssvaha maghabhyah | svaha 'naghabhya
    ssvaha 'gadabhyah | svaha 'rundhatibhya || aryama va akamayata | pashuman thsyamiti | sa etamaryamne
    phalgunibhya nniravapat | tato vai sa pashumanabhavat | pashuman ha vai bhavati | ya etena havisha
    yajate | ya u cainadevam 'tra juhoti | aryamne svaha phalgunibhyag svaha || bhago va akamayata | bhagi
    shreshthi devanag syamiti | sa eta mbhagaya phalgunibhya nniravapat | tato vai sa bhagi shreshthi
    devanamabhavat | bhagi ha vai shreshthi samanana mbhavati | ya etena havisha yajate | ya u cainadevam
    'tra juhoti | bhagaya svaha phalgunibhyag svaha | shraishthyaya svaheti || || savita va akamayata
    | shranme deva dadhirann | savita syamiti | sa etagm savitre hastaya purodasha nniravapadashunam ~vrihinam
    | tato vai tasmai shraddeva adadhata | savita 'bhavat | shraddha va asmai manushya dadhate | savita
    samanana mbhavati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | savitre svaha hastaya
    | svaha dadate svaha prinate | svaha pratigribhnate svaheti || || tvashta va akamayata | citra vi~ndeyeti
    | sa eta ntvashtre citrayai purodashamashta nniravapat | tato vai sa citra mprajamavindata | citragm
    ha vai prajam vi~ndate | ya etena havisha yajate | ya u cainadevam 'tra juhoti | tvashtre svaha citrayai
    svaha prajayai svaheti || || vayurva akamayata | kamacarameshu lokeshvabhijayeyamiti | sa eta dvayave
    nishtyayai grishtyai dugdha mpayo niravapat | tato vai sa kamacarameshu lokeshvabhyajayat | kamacaragm
    ha va eshu lokeshvabhijayati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | vayave svaha
    nishtyayai svaha | kamacaraya svaha 'bhijityai svaheti || || indragni va akamayetam | shraishthya
    mabhijayeveti | tavetamindragnibhyam nniravapatam | tato vai tau shraishthya mabhyajayatam | shraishthyagm
    ha vai samananamabhijayati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | indragnibhyag
    svaha vishakhabhyag svaha | shraishthyaya svaha 'bhijityai svaheti || nnirvapati | kamo vai pau rnamasi
    | kama ajya m | kamenaiva kamagm samardhayati | kshipramenagm sa kama upanamati | yena kamena yajate
    | so 'tra juhoti | paurnamasyai svaha kamaya svaha ''gatyai svaheti || yamanakshatreshtibrahmanam
    mitro va akamayata | mitradheyameshu lokeshvabhi jayeyamiti | sa eta mmitrayanuradhebhyashcaru nniravapat
    | tato vai sa mitradheyameshu lokeshvabhyajayat | mitradheyagm ha va eshu lokeshvabhijayati | ya etena
    havisha yajate | ya u cainadevam 'tra juhoti | mitraya svaha 'nuradhebhya | mitradheyaya svaha 'bhijityai
    svaheti || || indro va akamayata | jyaishthya mabhijayeyamiti | sa etamindraya jyeshthayai purodasha
    nmahavrihinam | tato vai sa jyaishthya ndevanamabhyajayat | jyaishthyagm ha vai samanana mabhijayati
    | ya etena havisha yajate | ya u cainadevam 'tra juhoti | indraya svaha | jyaishthyaya svaha 'bhijityai
    svaheti || || prajapatirva akamayata | mula vi~ndeyeti | sa eta mprajapataye mulaya caru nniravapat
    | tato vai sa mula mprajamavindata | mulagm ha vai prajam vi~ndate | ya etena havisha yajate | ya
    u cainadevam 'tra juhoti | prajapataye svaha mulaya svaha | prajayai svaheti || || apo va akamayanta
    | samudra nkamama bhijayemeti | ta etamadbhyo nniravapann | tato vai ta nkamamabhyajayann | samudragm
    ha vai kamamabhijayati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | adbhya ssvaha 'shadhabhya
    | samudraya svaha kamaya svaha | abhijityai svaheti || || vishve vai deva akamayanta | anapajayya
    njayemeti | ta etam nniravapann | tato vai te majayann | anapajayyagm ha vai jayati | ya etena havisha
    yajate | ya u cainadevam 'tra juhoti | vishve ssvaha 'shadhabhya | anapajayyaya svaha jityai svaheti
    || || brahma va akamayata | brahmalokamabhijayeyamiti | tadeta nniravapat | tato vai tadbrahmalokamabhyajayat
    | brahmalokagm ha va abhijayati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | brahmane
    svaha 'bhijite svaha | brahmalokaya svaha 'bhijityai svaheti || || vishnurva akamayata | punyagg shlokagm
    shrinviya | na ma papi kirtiragacchediti | sa etam vi~shnave shronayai purodasha nniravapat | tato
    vai sa punyagg shlokama shrinuta | naina gacchat | punyagm ha vai shlokagm shrinute | naina mpapi
    kirtiragacchati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | vishnave svaha shrutaya
    svaheti || || vasavo va akamayanta | agra mpariyameti | ta etam shshravishthabhyah purodashamashtakapala
    nniravapann | tato vai te mparyayann | agragm ha vai samanana mparyeti | ya etena havisha yajate |
    ya u cainadevam 'tra juhoti | vasubhya ssvaha shravishthabhya | agraya svaha pari || indro va akamayata
    | dridho 'shithila ssyamiti | sa etam va~runaya shatabhishaje bheshajebhyah purodasha vri~hinam |
    tato vai sa dridho 'bhavat | dridho ha va ashithilo bhavati | ya etena havisha yajate | ya u cainadevam
    'tra juhoti | varunaya svaha shatabhishaje svaha || ajo va ekapadakamayata | tejasvi brahmavarcasi
    syamiti | sa etamajayaikapade proshthapadebhya nniravapat | tato vai sa tejasvi brahmavarcasyabhavat
    | tejasvi ha vai brahmavarcasi bhavati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | ajayaikapade
    svaha brahmavarcasaya svaheti || || ahirvai buddhniyo vi~ndeyeti | sa etamahaye buddhniyaya proshthapadebhyah
    purodasha nniravapat | tato vai sa ima mavindata | imagm ha vai pratishtham vi~ndate | ya etena havisha
    yajate | ya u cainadevam 'tra juhoti | ahaye buddhniyaya svaha | pratishthayai svaheti || || pusha
    va akamayata | pashuman thsyamiti | sa eta mpushne revatyai caru nniravapat | tato vai sa pashumanabhavat
    | pashuman ha vai bhavati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | pushne svaha revatyai
    svaha || ashvinau va akamayetam | shrotrasvinavabadhirau syaveti | tavetamashvibhya nniravapatam |
    tato vai tau shro vabhavatam | shrotrasvi ha va abadhiro bhavati | ya etena havisha yajate | ya u
    cainadevam 'tra juhoti | ashvibhyag svaha 'shvayugbhyag svaha | shrotraya svaha shrutyai svaheti ||
    || yamo va akamayata | pitrinagm rajya mabhijayeyamiti | sa etam ya~mayapabharanibhyashcaru nniravapat
    | tato vai sa pitrinagm rajyamabhyajayat | samananagm ha vai rajyamabhijayati | ya etena havisha yajate
    | ya u cainadevam 'tra juhoti | yamaya svaha 'pabharanibhya | rajyaya svaha 'bhijityai svaheti ||
    nnirvapati | kamo va amavasya m | kamenaiva kamagm samardhayati | kshipramenagm sa kama upanamati
    | yena kamena yajate | so 'tra juhoti | amavasyayai svaha kamaya svaha ''gatyai svaheti || mavasyaya
    ashtau pancadasha candramasadishtibrahmanam candrama va akamayata | ahoratra maptva | candramasa ssayujyagm
    salokata mapnuyamiti | sa eta ncandramase pratidrishyayai purodasha nniravapat | tato vai so maptva
    | candramasa ssayujyagm salokatamapnot | ahoratran maptva | candramasa ssayujyagm salokatamapnoti
    | ya etena havisha yajate | ya u cainadevam 'tra juhoti | candramase svaha pratidrishyayai svaha va~thsaraya
    svaheti || || ahoratre va akamayetam | atyahoratre mucyevahi | na navahoratre a pnuyatamiti | te etamaho
    nniravapatam | dvayanam vri~hinam | shuklana nca | savatyordugdhe | shvetayai ca krishnayai ca | tato
    vai te atyahoratre amucyete | naine ahoratre a pnutam | ati ha va ahoratre mucyate | nainamahoratre
    a pnutah | ya etena havisha yajate | ya u cainadevam 'tra juhoti | ahne svaha ratriyai svaha | atimuktyai
    svaheti || || usha va akamayata | priya ''dityasya subhaga syamiti | saitamushase caru nniravapat
    | tato vai sa priya ''dityasya subhaga 'bhavat | priyo ha vai samananagm subhago bhavati | ya etena
    havisha yajate | ya u cainadevam 'tra juhoti | ushase svaha vyushtyai svaha | vyushushyai svaha vyucchantyai
    svaha | vyushtayai svaheti || || athaitasmai nakshatraya caru nnirvapati | yatha tva ndevanamasi |
    evamaha mbhuyasamiti | yatha ha va eta m | evagm ha va esha manushyana mbhavati | ya etena havisha
    yajate | ya u cainadevam 'tra juhoti | nakshatraya svahodeshyate svaha | udyate svahoditaya svaha
    | harase svaha bharase svaha | bhrajase svaha tejase svaha brahmavarcasaya svaheti || || suryo va
    akamayata | nakshatrana mpratishtha syamiti | sa etagm suryaya nakshatrebhyashcaru nniravapat | tato
    vai sa nakshatrana mpratishtha 'bhavat | pratishtha ha vai samanana mbhavati | ya etena havisha yajate
    | ya u cainadevam 'tra juhoti | suryaya svaha nakshatrebhya | pratishthayai svaheti || || athaitamadityai
    caru va~ aditih | asyameva prati tishthati | so 'tra juhoti | adityai svaha pratishthayai svaheti
    || nnirvapati | yajno vai vishnuh | yajna evantatah prati tishthati | so 'tra juhoti | vishnave svaha
    yajnaya svaha | pratishthayai svaheti || candramah pancadasha thaitasmai nakshattaya trayodasha vri~hinamindro
    mahavrihinamindrah krishnanom ~vrihinamahoratre dvayanam vri~hinam | pitara shshatkapalagm savita
    dvadashakapalamindragni ekadashakapalamindra ekadashakapalamindro dashakapalam vi~shnustrikapalamahi
    ncandramah pancadashakapala magniratvashta vasavo 'shtakapalamanyatra carum | rudro 'ryama pusha pashuman
    thsyagm somo rudro brihaspatih payasi vayuh paya ssomo vayurindragni mitra indra apo brahma yamo prajapatih
    prajayai paurnamasya amavasyaya agatyai vishve jitya ashvinau shrutyai ssa etadapastah | pitaro vishve
    vasavo 'kamayantameti ta eta 'kamayanta meti ta eta nniravapann | indragni ashvinavakamayetam nniravapadam
    | ahoratre va akamayetamiti te eta nniravapatam | anyatrakamayatamiti sa eta nniravapat | indragni
    shraishthyamindro jyaishthyamindro dridhah | ahi 'dityai vishnave pratishthayai m | agnirno ririshadanyatra
    ririshah vidusho havisha ya u cainadevam ve~da | ishtibhirya u caina evam ve~da | anyatra brahmane
    ya u cainamevam thstarting phadams ò surya strishashtih patu pratishthayai svaheti || harih om ||
    || krishna yajurvediya taittiriya brahmane tritiyashtake prathamah prapathaka
