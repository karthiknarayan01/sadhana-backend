id: lokeshvarashatakam
category: shataka
name:
  english: lokeshvarashatakam
  devanagari: लोकेश्वरशतकम्
content:
  english: vacale nakrajalakulakalilajale varidhavullalantah | alambe yasya nilotpalavimalamahakuttimalinalilam
    aliyante ladhiyah sa jagati kamali palanayala mastu || 49|| dhumaughobandhabandhikritavidhuravidhubradhnanirbandhadhama
    nirodhodbhedabadhabudhavibudhavadhudhiratoddharadhuryah | yannamadhitidharadharavidhritikritameti
    dhumadhvajo'pi pradhvamsam sadhu dheyanniravadhi sa vidhim buddhadharo dhritervah || 50|| krodhadutkshiptakalayudhakaranikarah
    krurasutkarakari danaklidyatkapolakulamadhupakulakandakalorukayah | kranto yannamakashtankushahatikripanah
    katarena karindro lokeshah sa prakamopakaranakarunah kamakrityam kriyad vah || 51|| sutkarishvasaposhakrishavishavamathuploshiroshashrayasha
    damshashadarshitasya bhrishatatashiraso nashane dandashukah | yannamashivisheshadvishi vishati visham
    dhishu nashyantyanisha lokeshah so'stu vishvashrayadativishamaklesharasheh shamaya || 52|| gandhodgarorugarvagrahanagajaganagrasagitogravegah
    savegodagragami galagahanaguhagadhagambhiragarjah | yogairyugyopayoganagami mrigapatiryadganodgitiyogad
    duryogam vah sa yogi sthagayatu sugatasangitungottamangah || 53|| bhuyo'payanumeyah kshatadayahridayo
    bhividhayi vihaya stheyan shailopameyah shrayadaligavayacchayakayo nikayah | sadyogopayamayamaya iva
    vilayam yatavan yataviryo yatpadadhyayineyah sa sugatanilayo jayatam vo jayaya || 54|| santrasavasabhumim
    kalivisarasaradyadasam bhasvarasi
  devanagari: वाचाले नक्रजालाकुलकलिलजले वारिधावुल्ललन्तः । आलम्बे यस्य नीलोत्पलविमलमहाकुट्टिमालीनलीलां
    आलीयन्ते लधीयः स जगति कमली पालनायाल मस्तु ॥ ४९॥ धूमौघोबन्धबन्धीकृतविधुरविधुब्रध्ननिर्बन्धधामा नीरोधोद्भेदबाधाबुधविबुधवधूधीरतोद्धारधुर्यः
    । यन्नामाधीतिधाराधरविधृतिकृतामेति धूमध्वजोऽपि प्रध्वंसं साधु धेयान्निरवधि स विधिं बुद्धधारो धृतेर्वः
    ॥ ५०॥ क्रोधादुत्क्षिप्तकालायुधकरनिकरः क्रूरसूत्कारकारी दानक्लिद्यत्कपोलाकुलमधुपकुलाकाण्डकालोरुकायः
    । क्रान्तो यन्नामकष्टाङ्कुशहतिकृपणः कातरेण करीन्द्रो लोकेशः स प्रकामोपकरणकरुणः कामकृत्यं क्रियाद्
    वः ॥ ५१॥ सूत्कारिश्वासपोषाकृशविषवमथुप्लोषिरोषाश्रयाशा दंशाशादर्शितास्या भृशततशिरसो नाशने दन्दशूकाः
    । यन्नामाशीविषेशद्विषि विशति विषां धीषु नश्यन्त्यनीशा लोकेशः सोऽस्तु विश्वश्रयदतिविषमक्लेशराशेः शमाय
    ॥ ५२॥ गन्धोद्गारोरुगर्वग्रहणगजगणग्रासगीतोग्रवेगः सावेगोदग्रगामी गलगहनगुहागाढगम्भीरगर्जः । योगैर्युग्योपयोगानगमि
    मृगपतिर्यद्गणोद्गीतियोगाद् दुर्योगं वः स योगी स्थगयतु सुगतासङ्गितुङ्गोत्तमाङ्गः ॥ ५३॥ भूयोऽपायानुमेयः
    क्षतदयहृदयो भीविधायी विहाय स्थेयान् शैलोपमेयः श्रयदलिगवयच्छायकायो निकायः । सद्योगोपायमायामय इव विलयं
    यातवान् यातवीर्यो यत्पादध्यायिनेयः स सुगतनिलयो जायतां वो जयाय ॥ ५४॥ सन्त्रासावासभूमिं कलिविसरसरद्यादसं
    भास्वरासि
