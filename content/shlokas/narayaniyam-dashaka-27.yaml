id: narayaniyam-dashaka-27
category: stotram
name:
  english: Narayaniyam Dashaka 27
content:
  english: durvasassuravanitaptadivyamalyam shakraya svayamupadaya tatra bhuyah | nagendrapratimridite
    shashapa shakram ka kshantistvaditaradevatamshajanam || || shapena prathitajare'tha nirjarendre deveshvapyasurajiteshu
    nishprabheshu | sharvadyah kamalajametya sarvadeva nirvanaprabhava samam bhavantamapuh || || brahmadyaih
    stutamahima ciram tadanim pradushshan varada purah parena dhamna | he deva ditijakulairvidhaya sandhim
    piyusham parimathateti paryashastvam || || sandhanam kritavati danavaih suraughe manthanam nayati
    madena mandaradrim | bhrashte'smin badaramivodvahan khagendre sadyastvam vinihitavan payahpayodhau
    || || adhaya drutamatha vasukim varatram pathodhau vinihitasarvabijajale | prarabdhe mathanavidhau
    surasuraistai rvyajattvam bhujagamukhe'karossurarin || || kshubdhadrau kshubhitajalodare tadanim dugdhabdhau
    gurutarabharato nimagne | deveshu vyathitatameshu tatpriyaishi pranaishih kamathatanum kathoraprishtham
    || || vajratisthiratarakarparena vishno vistaratparigatalakshayojanena | ambhodheh kuharagatena varshmana
    tvam nirmagnam kshitidharanathamunninetha || || unmagne jhatiti tada dharadharendre nirmethurdridhamiha
    sammadena sarve | avishya dvitayagane'pi sarparaje vaivashyam parishamayannavivridhastan || || uddamabhramanajavonnamadgirindra
    nyastaikasthiratarahastapankajam tvam | abhrante vidhigirishadayah pramoda dudbhranta nunuvurupattapushpavarshah
    || || daityaughe bhujagamukhanilena tapte tenaiva tridashakule'pi kincidarte | karunyattava kila deva
    varivahah pravarshannamaragananna daityasanghan || || udbhramyadbahutiminakracakravale tatrabdhau
    ciramathite'pi nirvikare | ekastvam karayugakrishtasarparajah samrajan pavanapuresha pahi rogat ||
  devanagari: दूर्वासास्सुरवनिताप्तदिव्यमाल्यं शक्राय स्वयमुपदाय तत्र भूयः । नागेन्द्रप्रतिमृदिते शशाप
    शक्रं का क्षान्तिस्त्वदितरदेवतांशजानाम् ॥ ॥ शापेन प्रथितजरेऽथ निर्जरेन्द्रे देवेष्वप्यसुरजितेषु निष्प्रभेषु
    । शर्वाद्याः कमलजमेत्य सर्वदेवा निर्वाणप्रभव समं भवन्तमापुः ॥ ॥ ब्रह्माद्यैः स्तुतमहिमा चिरं तदानीं
    प्रादुष्षन् वरद पुरः परेण धाम्ना । हे देवा दितिजकुलैर्विधाय सन्धिं पीयूषं परिमथतेति पर्यशास्त्वम्
    ॥ ॥ सन्धानं कृतवति दानवैः सुरौघे मन्थानं नयति मदेन मन्दराद्रिम् । भ्रष्टेऽस्मिन् बदरमिवोद्वहन् खगेन्द्रे
    सद्यस्त्वं विनिहितवान् पयःपयोधौ ॥ ॥ आधाय द्रुतमथ वासुकिं वरत्रां पाथोधौ विनिहितसर्वबीजजाले । प्रारब्धे
    मथनविधौ सुरासुरैस्तै र्व्याजात्त्वं भुजगमुखेऽकरोस्सुरारीन् ॥ ॥ क्षुब्धाद्रौ क्षुभितजलोदरे तदानीं दुग्धाब्धौ
    गुरुतरभारतो निमग्ने । देवेषु व्यथिततमेषु तत्प्रियैषी प्राणैषीः कमठतनुं कठोरपृष्ठाम् ॥ ॥ वज्रातिस्थिरतरकर्परेण
    विष्णो विस्तारात्परिगतलक्षयोजनेन । अम्भोधेः कुहरगतेन वर्ष्मणा त्वं निर्मग्नं क्षितिधरनाथमुन्निनेथ
    ॥ ॥ उन्मग्ने झटिति तदा धराधरेन्द्रे निर्मेथुर्दृढमिह सम्मदेन सर्वे । आविश्य द्वितयगणेऽपि सर्पराजे
    वैवश्यं परिशमयन्नवीवृधस्तान् ॥ ॥ उद्दामभ्रमणजवोन्नमद्गिरीन्द्र न्यस्तैकस्थिरतरहस्तपङ्कजं त्वाम् ।
    अभ्रान्ते विधिगिरिशादयः प्रमोदा दुद्भ्रान्ता नुनुवुरुपात्तपुष्पवर्षाः ॥ ॥ दैत्यौघे भुजगमुखानिलेन तप्ते
    तेनैव त्रिदशकुलेऽपि किञ्चिदार्ते । कारुण्यात्तव किल देव वारिवाहाः प्रावर्षन्नमरगणान्न दैत्यसङ्घान्
    ॥ ॥ उद्भ्राम्यद्बहुतिमिनक्रचक्रवाले तत्राब्धौ चिरमथितेऽपि निर्विकारे । एकस्त्वं करयुगकृष्टसर्पराजः
    संराजन् पवनपुरेश पाहि रोगात् ॥
