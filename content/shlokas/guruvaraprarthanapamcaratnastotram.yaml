id: guruvaraprarthanapamcaratnastotram
category: stotram
name:
  english: guruvaraprarthanapamcaratnastotram
  devanagari: गुरुवरप्रार्थनापंचरत्नस्तोत्रम्
content:
  english: nantadvaitapratite na kuru kitavatam pahi mam dinabandho || 4|| cittvatsankalpapurvam srijati
    jagadidam yogivanmayaya yah svatmanyevadvitiye paramasukhadrishi svapnavadbhupni nitye | tasmai tubhyam
    namah shrihariharagurave saccidanandamukta
  devanagari: नन्ताद्वैतप्रतीते न कुरु कितवतां पाहि मां दीनबन्धो ॥ ४॥ चित्त्वात्सङ्कल्पपूर्वं सॄजति जगदिदं
    योगिवन्मायया यः स्वात्मन्येवाद्वितीये परमसुखदॄशि स्वप्नवद्भूप्नि नित्ये । तस्मै तुभ्यं नमः श्रीहरिहरगुरवे
    सच्चिदानन्दमुक्ता
meaning: {}
