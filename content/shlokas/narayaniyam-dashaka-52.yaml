id: narayaniyam-dashaka-52
category: stotram
name:
  english: Narayaniyam Dashaka 52
content:
  english: anyavataranikareshvanirikshitam te bhumatirekamabhivikshya tadaghamokshe | brahma parikshitumanah
    sa parokshabhavam ninye'tha vatsakaganan pravitatya mayam || || vatsanavikshya vivashe pashupotkare
    ta nanetukama iva dhatrimatanuvarti | tvam samibhuktakabalo gatavamstadanim bhuktamstiro'dhita sarojabhavah
    kumaran || || vatsayitastadanu gopaganayitastvam shikyadibhandamuraligavaladirupah | pragvadvihritya
    vipineshu ciraya sayam tvam mayaya'tha bahudha vrajamayayatha || || tvameva shikyagavaladimayam dadhano
    bhuyastvameva pashuvatsakabalarupah | gorupinibhirapi gopavadhumayibhi rasadito'si jananibhiratipraharshat
    || || jivam hi kancidabhimanavashatsvakiyam matva tanuja iti ragabharam vahantyah | atmanameva tu
    bhavantamavapya sunum pritim yayurna kiyatim vanitashca gavah || || evam pratikshanavijrimbhitaharshabhara
    nishsheshagopaganalalitabhurimurtim | tvamagrajo'pi bubudhe kila vatsarante brahmatmanorapi mahan
    yuvayorvisheshah || || varshavadhau navapuratanavatsapalan drishtva vivekamasrine druhine vimudhe
    | pradidrishah pratinavan makutangadadi bhushamshcaturbhujayujah sajalambudabhan || || pratyekameva
    kamalaparilalitangan bhogindrabhogashayanan nayanabhiraman | lilanimilitadrishah sanakadiyogi vyasevitan
    kamalabhurbhavato dadarsha || || narayanakritimasankhyatamam nirikshya sarvatra sevakamapi svamavekshya
    dhata | mayanimagnahridayo vimumoha yava deko babhuvitha tada kabalardhapanih || || nashyanmade tadanu
    vishvapatim muhustvam natva ca nutavati dhatari dhama yate | potaih samam pramuditaih pravishan niketam
    vatalayadhipa vibho paripahi rogat ||
  devanagari: अन्यावतारनिकरेष्वनिरीक्षितं ते भूमातिरेकमभिवीक्ष्य तदाघमोक्षे । ब्रह्मा परीक्षितुमनाः स
    परोक्षभावं निन्येऽथ वत्सकगणान् प्रवितत्य मायाम् ॥ ॥ वत्सानवीक्ष्य विवशे पशुपोत्करे ता नानेतुकाम इव
    धातृमतानुवर्ती । त्वं सामिभुक्तकबलो गतवांस्तदानीं भुक्तांस्तिरोऽधित सरोजभवः कुमारान् ॥ ॥ वत्सायितस्तदनु
    गोपगणायितस्त्वं शिक्यादिभाण्डमुरलीगवलादिरूपः । प्राग्वद्विहृत्य विपिनेषु चिराय सायं त्वं माययाऽथ बहुधा
    व्रजमाययाथ ॥ ॥ त्वामेव शिक्यगवलादिमयं दधानो भूयस्त्वमेव पशुवत्सकबालरूपः । गोरूपिणीभिरपि गोपवधूमयीभि
    रासादितोऽसि जननीभिरतिप्रहर्षात् ॥ ॥ जीवं हि कञ्चिदभिमानवशात्स्वकीयं मत्वा तनूज इति रागभरं वहन्त्यः
    । आत्मानमेव तु भवन्तमवाप्य सूनुं प्रीतिं ययुर्न कियतीं वनिताश्च गावः ॥ ॥ एवं प्रतिक्षणविजृम्भितहर्षभार
    निश्शेषगोपगणलालितभूरिमूर्तिम् । त्वामग्रजोऽपि बुबुधे किल वत्सरान्ते ब्रह्मात्मनोरपि महान् युवयोर्विशेषः
    ॥ ॥ वर्षावधौ नवपुरातनवत्सपालान् दृष्ट्वा विवेकमसृणे द्रुहिणे विमूढे । प्रादीदृशः प्रतिनवान् मकुटाङ्गदादि
    भूषांश्चतुर्भुजयुजः सजलाम्बुदाभान् ॥ ॥ प्रत्येकमेव कमलापरिलालिताङ्गान् भोगीन्द्रभोगशयनान् नयनाभिरामान्
    । लीलानिमीलितदृशः सनकादियोगि व्यासेवितान् कमलभूर्भवतो ददर्श ॥ ॥ नारायणाकृतिमसङ्ख्यतमां निरीक्ष्य सर्वत्र
    सेवकमपि स्वमवेक्ष्य धाता । मायानिमग्नहृदयो विमुमोह याव देको बभूविथ तदा कबलार्धपाणिः ॥ ॥ नश्यन्मदे
    तदनु विश्वपतिं मुहुस्त्वां नत्वा च नूतवति धातरि धाम याते । पोतैः समं प्रमुदितैः प्रविशन् निकेतं वातालयाधिप
    विभो परिपाहि रोगात् ॥
