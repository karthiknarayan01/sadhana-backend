id: kyts-jata-7-2-saadhyaa-vai-devaah-suvargakaamaah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 7.2 Saadhyaa Vai Devaah Suvargakaamaah - Krishna Yajurveda Taittiriya Samhita
content:
  english: saddhya vai vai saddhya vai deva deva vai vai devah | ssuvargakama deva deva suvargakama eta
    metagm suvargakama ssuvargakama etam | suvargakama iti suvarga etagm shadratragm shadratra meta metagm
    shadratram | nthshadratragm shadratra mapashyann | tena yajanta yajanta tena tena yajanta | ayajanta
    tata stato 'yajanta yajanta tatah | tato vai vai tata stato vai | te suvargagm suvarga nte te suvargam
    | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | nnayan ~lokam ~loka mayann | vi~dvagmso vidvagmsa
    eva mevam vidvagmsa shshadratragm shadratram vi~dvagmso vidvagmsa shshadratram | shadratra masata
    asate shadratragm shadratra masate | asate suvargagm suvarga masata asate suvargam | suvarga mevaiva
    suvargagm suvarga meva | eva lokam ~loka mevaiva lokam | ya~nti yanti lokam ~lokam ya~nti yanti devasatram
    | vai shadratra shshadratro vai vai shadratrah | shadratrah pratyaksha mpratyakshagm shadratra shshadratrah
    pratyaksha pratyakshagm hi hi pratyaksha mpratyakshagm hi | pratyakshamiti prati hyeta nyetani hi
    hyetani | etani prishthani prishtha nyeta nyetani prishthani | prishthani ye ye prishthani prishthani
    ye | vi~dvagmso vidvagmsa eva mevam vidvagmsa shshadratragm shadratram vi~dvagmso vidvagmsa shshadratram
    | shadratra masata asate shadratragm shadratra masate | thsaksha dasata asate sakshat | saksha devaiva
    saksha eva devata devata evaiva devatah devata abhyaroha ntyabhyarohanti devata devata abhyarohanti
    | abhyarohanti shadratra shshadratro 'bhyaroha ntyabhyarohanti shadratrah | abhyarohantityabhi shadratro
    bhavati bhavati shadratra shshadratro bhavati | va ritava ritavo vai va ritavah | tthshadritava ritava
    shshat | shat prishthani prishthani sha tthshat prishthani | prishthani prishthaih prishthaih prishthani
    prishthani prishthaih | || prishthai revaiva prishthaih prishthai reva | rituna nvaroha ntyanvaroha
    ntyritu nrituna nvarohanti | anvaroha ntyritubhir ritubhi ranvaroha ntyanvaroha ntyritubhih | anvarohantityanu
    eva prati pratyevaiva prati | prati tishthanti tishthanti prati prati tishthanti | tishthanti brihadrathantarabhya
    ntishthanti tishthanti brihadrathantarabhya brihadrathantarabhyam ya~nti yanti brihadrathantarabhya
    mbrihadrathantarabhyam brihadrathantarabhyamiti brihat vava rathantaragm rathantaram va~va vava rathantaram
    | rathantara masa vasau rathantaragm rathantara masau | dbriha dasa vasau brihat | briha dabhya mabhya
    abhya mevai vabhya mabhya meva | eva yanti yantyevaiva yanti | yantyatho atho yanti yantyatho atho
    anayo ranayo ratho atho anayoh anayo revai vanayo ranayo reva | eva prati pratyevaiva prati | prati
    tishthanti tishthanti prati prati tishthanti | tishtha ntyete ete tishthanti tishtha ntyete | ete
    vai va ete ete vai | vai yajnasya yajnasya vai vai yajnasya | njasayani anjasayani yajnasya yajnasya
    anjasayani sruti sruti anjasayani anjasayani sruti | anjasayani ityanjasa ntabhyag sruti sruti tabhya
    sruti iti sruti | tabhya mevaiva tabhya eva suvargagm suvarga mevaiva suvargam | suvargam ~lokam ~lokagm
    suvargagm suvargam ~lokam | ya~nti yanti lokam ~lokam dyanti yanti trivrit | trivri dagnishtomo 'gnishtoma
    strivri ttrivri dagnishtomah | agnishtomo bhavati bhava tyagnishtomo 'gnishtomo bhavati | agnishtoma
    ityagni bhavati teja stejo bhavati bhavati tejah | teja evaiva teja steja eva | ava rundhate rundhate
    'vava rundhate | rundhate pancadashah pancadasho rundhate rundhate pancadashah | pancadasho bhavati
    bhavati pancadashah pancadasho bhavati | bhavatindriya mindriya mbhavati bhavatindriyam | indriya
    mevaivendriya mindriya meva | ava rundhate rundhate 'vava rundhate | rundhate saptadasha ssaptadasho
    rundhate rundhate saptadashah | saptadasho bhavati bhavati saptadasha bhava tyannadyasya nnadyasya
    bhavati bhava tyannadyasya | annadyasya varuddhya avaruddhya annadyasya nnadyasya varuddhyai | annadyasyetyanna
    avaruddhya atho atho avaruddhya avaruddhya atho atho pra pratho atho pra | eva tena tenaivaiva tena
    | tena jayante jayante tena tena jayante | jayanta ekavigmsha ekavigmsho jayante jayanta ekavigmshah
    | ekavigmsho bhavati bhava tyekavigmsha ekavigmsho bhavati | ekavigmsha ityeka bhavati pratishthityai
    pratishthityai bhavati bhavati pratishthityai | pratishthitya atho atho pratishthityai pratishthitya
    atho pratishthitya iti prati atho rucagm ruca matho atho ruca ruca mevaiva rucagm ruca meva | dadhate
    trinava strinavo dadhate dadhate trinavah | trinavo bhavati bhavati trinava strinavo bhavati | bhavati
    vijityai vijityai bhavati bhavati vijityai | vijityai trayastrigmsha strayastrigmsho vijityai vijityai
    trayastrigmshah | trayastrigmsho bhavati bhavati trayastrigmsha strayastrigmsho bhavati | trayastrigmsha
    iti trayah bhavati pratishthityai pratishthityai bhavati bhavati pratishthityai | pratishthityai sadohavirdhaninah
    sadohavirdhaninah pratishthityai pratishthityai sadohavirdhaninah | pratishthitya iti prati sadohavirdhanina
    ete naitena sadohavirdhaninah sadohavirdhanina etena | sadohavirdhanina iti sadah etena shadratrena
    shadratre naite naitena shadratrena | shadratrena yajeran nthshadratrena shadratrena yajerann | shadratreneti
    shat nnashvatthi ashvatthi yajeran ashvatthi havirdhanagm havirdhana mashvatthi ashvatthi havirdhana
    ashvatthi ityashvatthi | nca ca havirdhanagm havirdhana havirdhanamiti havih ca bhavato bhavata shca
    ca bhavatah | dbhavato bhavata stat | hi suvargyagm suvargyagm hi hi suvargya ncakrivati cakrivati
    suvargyagm suvargya suvargyamiti suvah cakrivati bhavato bhavata shcakrivati cakrivati bhavatah |
    cakrivati iti cakrivati | ssuvargasya suvargasya bhavato bhavata suvargasya lokasya lokasya suvargasya
    suvargasya lokasya | suvargasyeti suvah lokasya samashtyai samashtyai lokasya lokasya samashtyai |
    samashtya ulukhalabuddhna ulukhalabuddhna ssamashtyai samashtya ulukhalabuddhnah | ulukhalabuddhno
    yupo yupa ulukhalabuddhna ulukhalabuddhno yupah | ulukhalabuddhna ityulukhala yupo bhavati bhavati
    yupo yupo bhavati | bhavati pratishthityai pratishthityai bhavati bhavati pratishthityai | pratishthityai
    prancah prancah pratishthityai pratishthityai prancah | pratishthitya iti prati pranco yanti yanti
    prancah pranco yanti | nti yanti pram | iva hi hiveva hi | ssuvargo hi hi suvargah | suvargo loko
    loka ssarasvatya sarasvatya loko loka sarasvatya yanti yanti sarasvatya sarasvatya yanti | esha vai
    va esha esha vai | vai devayano devayano vai vai devayanah | devayanah panthah pantha devayano devayanah
    panthah mpanthah pantha stam | eva nvaroha ntyanvaroha ntyevaiva nvarohanti | anvaroha ntyakroshanta
    akroshanto 'nvaroha ntyanvaroha ntyakroshantah | anvarohantityanu akroshanto yanti yantyakroshanta
    akroshanto yanti | yantyavarti mavartim ya~nti yantyavartim | avarti mevaivavarti mavarti meva | nnevaiva
    nyasminn | npratishajya pratishajya nyasmi pratishajya pratishtha mpratishajya pratishajya pratishtham
    | pratishajyeti prati ngacchanti gacchanti pratishtha pratishthamiti prati gacchanti yada yada gacchanti
    gacchanti yada | yada dasha dasha yada yada dasha | nkurvanti kurvanti shatagm shata kurva ntyathatha
    kurvanti kurva ntyatha | eka mutthana mutthana meka meka mutthana utthanagm shatayuh shatayu rutthana
    mutthanagm shatayuh | shatayuh purushah purusha shshatayuh shatayuh purushah | shshatendriyah purushah
    purusha shatendriya ayu shyayushi shatendriya shshatendriya ayushi | shatendriya iti shata ayu shyevaivayu
    shyayu shyeva | evendriya indriya evaivendriye | indriye prati prati ndriya indriye prati | prati
    tishthanti tishthanti prati prati tishthanti | tishthanti yada yada tishthanti tishthanti yada | shatagm
    sahasragm sahasragm shatagm shatagm sahasra nkurvanti kurvanti sahasragm sahasra kurva ntyathatha
    kurvanti kurva ntyatha | eka mutthana mutthana meka meka mutthana utthanagm sahasrasammita ssahasrasammita
    utthana mutthanagm sahasrasammitah | sahasrasammito vai vai sahasrasammita ssahasrasammito vai | sahasrasammita
    iti sahasra va asa vasau vai va asau | asau loko loko 'sa vasau lokah | loko 'mu mamum ~loko loko
    'mum | amu mevai vamu mamu meva | eva lokam ~loka mevaiva lokam | loka mabhyabhi lokam ~loka mabhi
    | abhi jayanti jaya ntyabhyabhi jayanti | jayanti yada yada jayanti jayanti yada | mpramiyeta pramiye
    taisha mesha pramiyeta yada yada pramiyeta pramiyeta yada | yada va va yada yada va va jiyeran jiyeran
    nnathatha jiyeran jiyera eka mutthana mutthana meka meka mutthana ttadutthana mutthana ntirthagm hi
    hi tirtham | tirthamiti tirtham | || kusurubinda auddalaki rauddalakih kusurubindah kusurubinda auddalakih
    | auddalaki rakamayata kamaya tauddalaki rauddalaki rakamayata | npashuma nakamayata kamayata pashuman
    | sya mititi syag iti sa sa ititi sah | sa eta metagm sa sa etam | etagm saptaratragm saptaratra meta
    metagm saptaratram | saptaratra ma saptaratragm saptaratra ma | saptaratramiti sapta a 'hara daharada
    'harat | ttena tena hara dahara tena yajata yajata tena tena yajata | ayajata tena tena yajata yajata
    tena | tena vai vai tena tena vai | sa yavanto yavanta yavanto gramya gramya yavanto yavanto gramyah
    | gramyah pashavah pashavo gramya gramyah pashavah | npashavah pashava stan | ava rundha rundha vava
    rundha | arundha yo yo 'rundha rundha yah | nthsaptaratrena saptaratrena vidvan nthsaptaratrena |
    saptaratrena yajate yajate saptaratrena saptaratrena yajate | saptaratreneti sapta yajate yavanto
    yavanto yajate yajate yavantah | yavanta evaiva yavanto yavanta eva | eva gramya gramya evaiva gramyah
    | gramyah pashavah pashavo gramya gramyah pashavah | npashavah pashava stan | ava rundhe rundhe 'vava
    rundhe | rundhe saptaratra ssaptaratro rundhe rundhe saptaratrah | saptaratro bhavati bhavati saptaratra
    ssaptaratro bhavati | saptaratra iti sapta bhavati sapta sapta bhavati bhavati sapta | sapta gramya
    gramya ssapta sapta gramyah | gramyah pashavah pashavo gramya gramyah pashavah | pashavah sapta sapta
    pashavah pashavah sapta | sapta ranya aranya ssapta sapta ranyah | ssapta sapta ranya aranya sapta
    chandagmsi chandagmsi sapta sapta chandagmsi | chandag syubhaya syobhayasya chandagmsi chandag syubhayasya
    | ubhayasya varuddhya avaruddhya ubhaya syobhayasya varuddhyai | ttrivri davaruddhya avaruddhyai trivrit
    | trivri dagnishtomo 'gnishtoma strivri ttrivri dagnishtomah | agnishtomo bhavati bhava tyagnishtomo
    'gnishtomo bhavati | agnishtoma ityagni bhavati teja stejo bhavati bhavati tejah | teja evaiva teja
    steja eva | || ava rundhe rundhe 'vava rundhe | rundhe pancadashah pancadasho rundhe rundhe pancadashah
    | pancadasho bhavati bhavati pancadashah pancadasho bhavati | bhava tindriya mindriya mbhavati bhava
    tindriyam | indriya mevaivendriya mindriya meva | ava rundhe rundhe 'vava rundhe | ssaptadasho rundhe
    rundhe saptadashah | saptadasho bhavati bhavati saptadasha bhava tyannadyasya nnadyasya bhavati bhava
    tyannadyasya | annadya syavaruddhya avaruddhya annadyasya nnadya syavaruddhyai | annadyasyetyanna
    avaruddhya atho atho avaruddhya avaruddhya atho atho pra pratho atho pra | eva tena tenaivaiva tena
    | tena jayate jayate tena tena jayate | jayata ekavigmsha ekavigmsho jayate jayata ekavigmshah | ekavigmsho
    bhavati bhava tyekavigmsha ekavigmsho bhavati | ekavigmsha ityeka bhavati pratishthityai pratishthityai
    bhavati bhavati pratishthityai | pratishthitya atho atho pratishthityai pratishthitya atho pratishthitya
    iti prati atho rucagm ruca matho atho ruca ruca mevaiva rucagm ruca meva | dhatte trinava strinavo
    dhatte dhatte trinavah | trinavo bhavati bhavati trinava strinavo bhavati | bhavati vijityai vijityai
    bhavati bhavati vijityai | vijityai pancavigmshah pancavigmsho vijityai vijityai pancavigmshah | 'gnishtomah
    pancavigmshah pancavigmsho pancavigmsha iti panca agnishtomo bhavati bhava tyagnishtomo 'gnishtomo
    bhavati | agnishtoma ityagni bhavati prajapateh prajapate rbhavati bhavati prajapateh | prajapate
    raptya aptyai prajapateh prajapate raptyai prajapateriti praja nmahavratava naptya aptyai mahavratavan
    | mahavratava nannadyasya nnadyasya mahavratava nmahavratava nannadyasya | mahavratavaniti mahavrata
    annadyasya varuddhya avaruddhya annadyasya nnadyasya varuddhyai | annadyasyetyanna avaruddhyai vishvaji
    dvishvaji davaruddhya avaruddhyai vishvajit | ssarvaprishtho vishvaji vishvajiditi vishva sarvaprishtho
    'tiratro 'tiratra ssarvaprishtho 'tiratrah | sarvaprishtha iti sarva atiratro bhavati bhava tyatiratro
    'tiratro bhavati | bhavati sarvasya sarvasya bhavati bhavati sarvasya | sarvasya bhijitya abhijityai
    sarvasya sarvasya bhijityai | dyadabhijitya abhijityai yat | abhijitya ityabhi mpurveshu purveshu
    pratyaksha pratyakshamiti prati purve shvaha ssvahassu purveshu purve shvahassu | ahassu prishthani
    prishtha nyaha ssvahassu prishthani | prishtha nyupeyu rupeyuh prishthani prishtha nyupeyuh | upeyuh
    pratyaksha mpratyaksha mupeyu rupeyuh pratyaksha vi~shvajiti vishvajiti pratyaksha pratyakshamiti
    prati vishvajiti yatha yatha vishvajiti vishvajiti yatha vishvajititi vishva ya~tha yatha dugdham
    | dugdha mupasida tyupasidati dugdha ndugdha mupasidati | upasida tyeva meva mupasida tyupasida tyevam
    | eva muttama muttama meva meva muttamam | uttama maha raha ruttama muttama mahah | thsya daha rahah
    syat | naikaratra ekaratro na naikaratrah | ekaratra shcana canaikaratra ekaratra shcana | thsyac
    cana cana sya dbrihadrathantare brihadrathantare sya brihadrathantare purveshu purveshu brihadrathantare
    brihadrathantare purveshu | brihadrathantare iti brihat purve shvaha ssvahassu purveshu purve shvahassu
    | aha ssupopa ha ssvaha ssupa | upa yanti ya ntyupopa yanti | vava rathantaragm rathantaram va~va
    vava rathantaram | rathantara masa vasau rathantaragm rathantara masau | dbriha dasa vasau brihat
    | briha dabhya mabhya abhya mevai vabhya mabhya meva | na yanti yanti na na yanti | yantyatho atho
    yanti yantyatho atho anayo ranayo ratho atho anayoh anayo revai vanayo ranayo reva | eva prati pratye
    vaiva prati | prati tishthanti tishthanti prati prati tishthanti | ttishthanti tishthanti yat | vi~shvajiti
    vishvajiti pratyaksha pratyakshamiti prati vishvajiti prishthani prishthani vishvajiti vishvajiti
    prishthani | vishvajititi vishva prishtha nyupaya ntyupayanti prishthani prishtha nyupayanti | upayanti
    yatha yathopaya ntyupayanti yatha nduhe duhe pratta ktadrig duhe duhe tadrik | brihaspati rakamayata
    kamayata brihaspati rbrihaspati rakamayata | akamayata brahmavarcasi brahmavarcasya kamayata kamayata
    brahmavarcasi | brahmavarcasi syag sya mbrahmavarcasi brahmavarcasi sya brahmavarcasiti brahma sya
    mititi syag iti sa sa ititi sah | sa eta metagm sa sa etam | eta mashtaratra mashtaratra meta meta
    mashtaratram | ashtaratra mapashya dapashya dashtaratra mashtaratra mapashyat | ashtaratramityashta
    a 'hara daharada 'harat | ttena tena hara dahara tena yajata yajata tena tena yajata | ayajata tata
    stato 'yajata yajata tatah | tato vai vai tata stato vai | sa brahmavarcasi brahmavarcasi sa sa brahmavarcasi
    | brahmavarca syabhava dabhava dbrahmavarcasi brahmavarca syabhavat | brahmavarcasiti brahma vidva
    nashtaratrena shtaratrena vidvan vidva nashtaratrena | ashtaratrena yajate yajate 'shtaratrena shtaratrena
    yajate | ashtaratrenetyashta yajate brahmavarcasi brahmavarcasi yajate yajate brahmavarcasi | brahmavarca
    syevaiva brahmavarcasi brahmavarca syeva | brahmavarcasiti brahma eva bhavati bhava tyevaiva bhavati
    | bhava tyashtaratro 'shtaratro bhavati bhava tyashtaratrah | ashtaratro bhavati bhava tyashtaratro
    ashtaratra ityashta bhava tyashtakshara 'shtakshara bhavati bhava tyashtakshara | ashtakshara gayatri
    gaya tryashtakshara 'shtakshara gayatri | ashtaksharetyashta gayatri gayatri | gayatri brahmavarcasa
    ngayatri gayatri brahmavarcasam | ngayatriya gayatriya brahmavarcasa brahmavarcasamiti brahma gayatri
    yaivaiva gayatriya gayatri yaiva | mbrahmavarcasa mevaiva brahmavarcasam | brahmavarcasa mavava brahmavarcasa
    mbrahmavarcasa mava | brahmavarcasamiti brahma ava rundhe rundhe 'vava rundhe | rundhe 'shtaratro
    'shtaratro rundhe rundhe 'shtaratrah | ashtaratro bhavati bhava tyashtaratro ashtaratra ityashta bhavati
    catasra shcatasro bhavati bhavati catasrah | catasro vai vai catasra shcatasro vai | vai disho disho
    vai vai dishah | disha shcatasra shcatasro disho disha shcatasrah | catasro 'vantaradisha avantaradisha
    shcatasra shcatasro 'vantaradishah | avantaradisha digbhyo digbhyo 'vantaradisha avantaradisha digbhyah
    | avantaradisha ityavantara digbhya evaiva digbhyo digbhya eva | mbrahmavarcasa mevaiva brahmavarcasam
    | brahmavarcasa mavava brahmavarcasa mbrahmavarcasa mava | brahmavarcasamiti brahma ava rundhe rundhe
    'vava rundhe | drundhe rundhe trivrit | || trivri dagnishtomo 'gnishtoma strivri ttrivri dagnishtomah
    | agnishtomo bhavati bhava tyagnishtomo 'gnishtomo bhavati | agnishtoma ityagni bhavati teja stejo
    bhavati bhavati tejah | teja evaiva teja steja eva | ava rundhe rundhe 'vava rundhe | rundhe pancadashah
    pancadasho rundhe rundhe pancadashah | pancadasho bhavati bhavati pancadashah pancadasho bhavati |
    bhavatindriya mindriya mbhavati bhavatindriyam | indriya mevaivendriya mindriya meva | ava rundhe
    rundhe 'vava rundhe | ssaptadasho rundhe rundhe saptadashah | saptadasho bhavati bhavati saptadasha
    bhava tyannadyasya nnadyasya bhavati bhava tyannadyasya | annadyasya varuddhya avaruddhya annadyasya
    nnadyasya varuddhyai | annadyasyetyanna avaruddhya atho atho avaruddhya avaruddhya atho atho pra pratho
    atho pra | eva tena tenai vaiva tena | tena jayate jayate tena tena jayate | jayata ekavigmsha ekavigmsho
    jayate jayata ekavigmshah | ekavigmsho bhavati bhava tyekavigmsha ekavigmsho bhavati | ekavigmsha
    ityeka bhavati pratishthityai pratishthityai bhavati bhavati pratishthityai | pratishthitya atho atho
    pratishthityai pratishthitya atho pratishthitya iti prati atho rucagm ruca matho atho ruca ruca mevaiva
    rucagm ruca meva | dhatte trinava strinavo dhatte dhatte trinavah | trinavo bhavati bhavati trinava
    strinavo bhavati | bhavati vijityai vijityai bhavati bhavati vijityai | vijityai trayastrigmsha strayastrigmsho
    vijityai vijityai trayastrigmshah | trayastrigmsho bhavati bhavati trayastrigmsha strayastrigmsho
    bhavati | trayastrigmsha iti trayah bhavati pratishthityai pratishthityai bhavati bhavati pratishthityai
    | pratishthityai pancavigmshah pancavigmshah pratishthityai pratishthityai pancavigmshah | pratishthitya
    iti prati 'gnishtomah pancavigmshah pancavigmsho pancavigmsha iti panca agnishtomo bhavati bhava tyagnishtomo
    'gnishtomo bhavati | agnishtoma ityagni bhavati prajapateh prajapate rbhavati bhavati prajapateh |
    prajapate raptya aptyai prajapateh prajapate raptyai prajapateriti praja nmahavratava naptya aptyai
    mahavratavan | mahavratava nannadyasya nnadyasya mahavratava nmahavratava nannadyasya | mahavratavaniti
    mahavrata annadyasya varuddhya avaruddhya annadyasya nnadyasya varuddhyai | annadyasyetyanna avaruddhyai
    vishvaji dvishvaji davaruddhya avaruddhyai vishvajit | ssarvaprishtho vishvaji vishvajiditi vishva
