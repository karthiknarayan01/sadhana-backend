id: durgamanasa
category: stotram
name:
  english: durgamanasa
  devanagari: दुर्गामानस
content:
  english: stava tripurasundari sphurati devi dipo mude || 12|| jatisaurabhanirbharam rucikaram shalyodanam
    nirmalam yuktam hingumaricajirasurabhirdravyanvitairvyanjanaih | pakvannena sapayasena madhuna dadhyajyasammishritam
    naivedyam surakaminiviracitam shricandike tvanmude || 13|| lavangakalikojjvalam bahulanagavallidalam
    sajatiphalakomalam saghanasarapugiphalam | sudhamadhuramakulam ruciraratnapatrasthitam grihana mukhapankaje
    sphuritamamba tambulakam || 14|| sharatprabhavacandramah sphuritacandrikasundaram galatsurataranginilalitamauktikadambaram
    | grihana navakancanaprabhavadandakhandojjvalam mahatripurasundari prakatamatapatram mahat || 15||
    matastvanmudamatanotu subhagastribhih sada''ndolitam shubhram camaramindukundasadrisham prasvedaduhkhapaham
    | sadyo'gastyavasishthanaradashukavyasadivalmikibhih sve citte kriyamana eva kurutam sharmani vedadhvanih
    || 16|| svargangane venumridangashankhabherininadairupagiyamana | kolahalairakalitatavastu vidyadharinrityakalasukhaya
    || 17|| devi bhaktirasabhavitavritte priyatam yadi kuto'pi labhyate | tatra laulyamapi satphalamekanjanmakotibhirapiha
    na labhyam || 18|| etaih shodashabhih padyairupacaropakalpitaih | yah param devatam stauti sa tesham
    phalamapnuyat || 19|| || iti durgatantre durgamanasapuja samapta ||
  devanagari: स्तव त्रिपुरसुन्दरि स्फुरति देवि दीपो मुदे ॥ १२॥ जातीसौरभनिर्भरं रुचिकरं शाल्योदनं निर्मलं
    युक्तं हिङ्गुमरीचजीरसुरभिर्द्रव्यान्वितैर्व्यञ्जनैः । पक्वान्नेन सपायसेन मधुना दध्याज्यसम्मिश्रितं
    नैवेद्यं सुरकामिनीविरचितं श्रीचण्डिके त्वन्मुदे ॥ १३॥ लवङ्गकलिकोज्ज्वलं बहुलनागवल्लीदलं सजातिफलकोमलं
    सघनसारपूगीफलम् । सुधामधुरमाकुलं रुचिररत्नपात्रस्थितं गृहाण मुखपङ्कजे स्फुरितमम्ब ताम्बूलकम् ॥ १४॥
    शरत्प्रभवचन्द्रमः स्फुरितचन्द्रिकासुन्दरं गलत्सुरतरङ्गिणीललितमौक्तिकाडम्बरम् । गृहाण नवकाञ्चनप्रभवदण्डखण्डोज्ज्वलं
    महात्रिपुरसुन्दरि प्रकटमातपत्रं महत् ॥ १५॥ मातस्त्वन्मुदमातनोतु सुभगस्त्रीभिः सदाऽऽन्दोलितं शुभ्रं
    चामरमिन्दुकुन्दसदृशं प्रस्वेददुःखापहम् । सद्योऽगस्त्यवसिष्ठनारदशुकव्यासादिवाल्मीकिभिः स्वे चित्ते
    क्रियमाण एव कुरुतां शर्माणि वेदध्वनिः ॥ १६॥ स्वर्गाङ्गणे वेणुमृदङ्गशङ्खभेरीनिनादैरूपगीयमाना । कोलाहलैराकलितातवास्तु
    विद्याधरीनृत्यकलासुखाय ॥ १७॥ देवि भक्तिरसभावितवृत्ते प्रीयतां यदि कुतोऽपि लभ्यते । तत्र लौल्यमपि सत्फलमेकञ्जन्मकोटिभिरपीह
    न लभ्यम् ॥ १८॥ एतैः षोडशभिः पद्यैरूपचारोपकल्पितैः । यः परां देवतां स्तौति स तेषां फलमाप्नुयात् ॥ १९॥
    ॥ इति दुर्गातन्त्रे दुर्गामानसपूजा समाप्ता ॥
