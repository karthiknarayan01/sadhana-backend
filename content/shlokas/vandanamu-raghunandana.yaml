id: vandanamu-raghunandana
category: stotram
name:
  english: Vandanamu Raghunandana
content:
  english: adi talamu pallavi vandanamu raghunandana setu bandhana bhakta candana rama caranamu ne bhedama
    idi modama rama shrirama hriccara mamu brova bharama rayabarama rama vintini nammu kòntini shara nantini
    rammantini rama odanu bhakti vidanu nòrula vedanu judanu rama kammani vidè mimmani varamu kòmmani
    paluka rammani rama nyayama ni kayama inka heyama muni geyama rama cudumi gapadumi mammu podimiga
    gudumi rama kshemamu divya dhamamu nitya nimamu ramanamamu rama vegara karunasagara shri tyagaraju
    hridayakara rama
  devanagari: आदि तालमु पल्लवि वन्दनमु रघुनन्दन सेतु बन्धन भक्त चन्दन राम चरणमु ने भेदमा इदि मोदमा राम
    श्रीरमा हृच्चार ममु ब्रोव भारमा रायबारमा राम विण्टिनि नम्मु कॊण्टिनि शर णण्टिनि रम्मण्टिनि राम ओडनु
    भक्ति वीडनु नॊरुल वेडनु जूडनु राम कम्मनि विडॆ मिम्मनि वरमु कॊम्मनि पलुक रम्मनि राम न्यायमा नी कायमा
    इङ्क हेयमा मुनि गेयमा राम चूडुमी गापाडुमी मम्मु पोडिमिगा गूडुमी राम क्षेममु दिव्य धाममु नित्य नीममु
    रामनाममु राम वेगरा करुणासागर श्री त्यागराजु हृदयाकर राम
