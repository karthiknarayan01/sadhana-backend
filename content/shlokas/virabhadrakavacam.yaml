id: virabhadrakavacam
category: kavacha
name:
  english: virabhadrakavacam
  devanagari: वीरभद्रकवचम्
content:
  english: om lalatam virabhadro'vyaccakshushi cordhvakeshabhrit | bhrumadhyam bhutanatho'vyannasikam
    viravigrahah || 1|| kapali karnayugalam kandharam nilakandharah | vadanam bhadrakalisho cubukam candrakhandabhrit
    || 2|| karau pashakarah patu bahu patu maheshvarah | urusthalam cogradamshtra''nandatma hridambujam
    || 3|| rudramurtirnabhimadhyam katim me patu shulabhrit | murdhanam pancamurdha'vyannitalam nirmalendubhrit
    || 4|| kapolayugmam kapali jihvam me jivanayakah | stanadvayam pashupatirlingam me lingarupadhrit
    || 5|| sarvangulih sarvanatho nakhanme nagabhushanah | parshvayugmam shaktihasto sarvangam devavallabhah
    || 6|| sarvakaryeshu mam payat bhadrakalimanoharah | brahmarakshasapaishacavetalaranabhumishu || 7||
    sarveshvarah sada patu sarvadevamadapahah | shitoshnayoshcandhakare nimnonnatabhuvisthale || 8|| kantakeshvapi
    durgeshu parvate'pi ca durgame | shastrastramukhabhallukavyaghracorabhayeshu ca || 9|| rajadyupadrave
    caiva payaccharabharupadhrit | ya etadvirabhadrasya kavacam pathate narah
  devanagari: ॐ ललाटं वीरभद्रोऽव्याच्चक्षुषी चोर्ध्वकेशभृत् । भ्रूमध्यं भूतनाथोऽव्यान्नासिकां वीरविग्रहः
    ॥ १॥ कपाली कर्णयुगलं कन्धरं नीलकन्धरः । वदनं भद्रकालीशो चुबुकं चन्द्रखण्डभृत् ॥ २॥ करौ पाशकरः पातु
    बाहू पातु महेश्वरः । ऊरुस्थलं चोग्रदंष्ट्राऽऽनन्दात्मा हृदम्बुजम् ॥ ३॥ रुद्रमूर्तिर्नाभिमध्यं कटिं
    मे पातु शूलभृत् । मूर्धानं पञ्चमूर्धाऽव्यान्निटलं निर्मलेन्दुभृत् ॥ ४॥ कपोलयुग्मं कापाली जिह्वां मे
    जीवनायकः । स्तनद्वयं पशुपतिर्लिङ्गं मे लिङ्गरूपधृत् ॥ ५॥ सर्वाङ्गुलीः सर्वनाथो नखान्मे नागभूषणः ।
    पार्श्वयुग्मं शक्तिहस्तो सर्वाङ्गं देववल्लभः ॥ ६॥ सर्वकार्येषु मां पायात् भद्रकालीमनोहरः । ब्रह्मराक्षसपैशाचवेतालरणभूमिषु
    ॥ ७॥ सर्वेश्वरः सदा पातु सर्वदेवमदापहः । शीतोष्णयोश्चान्धकारे निम्नोन्नतभुविस्थले ॥ ८॥ कण्टकेष्वपि
    दुर्गेषु पर्वतेऽपि च दुर्गमे । शस्त्रास्त्रमुखभल्लूकव्याघ्रचोरभयेषु च ॥ ९॥ राजाद्युपद्रवे चैव पायाच्छरभरूपधृत्
    । य एतद्वीरभद्रस्य कवचं पठते नरः
