id: rogaghnaupanishat
category: upanishad
name:
  english: rogaghnaupanishat
  devanagari: रोगघ्नौपनिषत्
content:
  english: gandharah u̱dyanna̱dya mi̭tramaha a̱roha̱nnutta̭ra̱m diva̭m | hri̱dro̱gam mama̭ surya hari̱mana̭m
    ca nashaya || 1
  devanagari: गान्धारः उ॒द्यन्न॒द्य मि॑त्रमह आ॒रोह॒न्नुत्त॑रां॒ दिव॑म् । हृ॒द्रो॒गं मम॑ सूर्य हरि॒माणं॑
    च नाशय ॥ १
