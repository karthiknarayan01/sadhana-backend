id: dhanvantarikritammanasadevistotram
category: stotram
name:
  english: dhanvantarikritammanasadevistotram
  devanagari: धन्वन्तरिकृतंमनसादेवीस्तोत्रम्
content:
  english: namah siddhisvarupayai varadayai namo namah | namah kashyapakanyayai shankarayai namo namah
    || 33|| balanam rakshanakartryai nagadevyai namo namah | nama astikamatre te jaratkarvyai namo namah
    || 34|| tapasvinyai ca yoginyai nagasvasre namo namah | sadhvyai tapasyarupayai shambhushishye
  devanagari: नमः सिद्धिस्वरूपायै वरदायै नमो नमः । नमः कश्यपकन्यायै शङ्करायै नमो नमः ॥ ३३॥ बालानां रक्षणकर्त्र्यै
    नागदेव्यै नमो नमः । नम आस्तीकमात्रे ते जरत्कार्व्यै नमो नमः ॥ ३४॥ तपस्विन्यै च योगिन्यै नागस्वस्रे
    नमो नमः । साध्व्यै तपस्यारूपायै शम्भुशिष्ये
meaning: {}
