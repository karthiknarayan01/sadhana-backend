id: mrtyumanasa
category: stotram
name:
  english: mrtyumanasa
  devanagari: म्र्त्युमानस
content:
  english: natisvacchena camarayugena | galadalakananapadmam mrityunjaya bhavayami hritpadme || 18|| muktatapatram
    shashikotishubhram shubhapradam kancanadandayuktam | manikyasamsthapitahemakumbham suresha mrityunjaya
    te'rpayami || 19|| manimukure nishpatale trijagadgadhandhakarasaptashve | kandarpakotisadrisham mrityunjaya
    pashya vadanamatmiyam || 20|| karpuracurnam kapilajyaputam dasyami kaleyasamanvitaishca | samudbhavam
    pavanagandhadhupitam mrityunjayangam parikalpayami || 21|| vartitrayopetamakhandadiptya tamoharam
    bahyamathantaram ca | sajyam samastamaravargahridyam suresha mrityunjaya vamshadipam || 22|| rajannam
    madhuranvitam ca mridulam manikyapatre sthitam hingujirakasanmaricimilitaih shakairanekaih shubhaih
    | shakam samyagapupasupasahitam sadyoghritenaplutam shrimrityunjaya parvatipriya vibho saposhanam
    bhujyatam || 23|| kushmandavartakapatolikanam phalani ramyani ca karavallya | supakayuktani sasaurabhani
    shrikantha mrityunjaya bhakshayesha || 24|| shitalam madhuram svaccham pavanam vasitam laghu | madhye
    svikuru paniyam shiva mrityunjaya prabho || 25|| sharkaramilitam snigdham dugdhannam goghritanvitam
    | kadaliphalasammishram bhujyatam mrityusamhara || 26|| kevalamatimadhuryam dugdhaih snigdhaishca
    sharkaramilitaih | elamaricamilitam mrityunjaya deva bhunkshva paramannam || 27|| rambhacutakapitthakanthakaphalairdraksharasasvaduma
  devanagari: नातिस्वच्छेन चामरयुगेन । गलदलकाननपद्मं मृत्युञ्जय भावयामि हृत्पद्मे ॥ १८॥ मुक्तातपत्रं शशिकोटिशुभ्रं
    शुभप्रदं काञ्चनदण्डयुक्तम् । माणिक्यसंस्थापितहेमकुम्भं सुरेश मृत्युञ्जय तेऽर्पयामि ॥ १९॥ मणिमुकुरे
    निष्पटले त्रिजगद्गाढान्धकारसप्ताश्वे । कन्दर्पकोटिसदृशं मृत्युञ्जय पश्य वदनमात्मीयम् ॥ २०॥ कर्पूरचूर्णं
    कपिलाज्यपूतं दास्यामि कालेयसमान्वितैश्च । समुद्भवं पावनगन्धधूपितं मृत्युञ्जयाङ्गं परिकल्पयामि ॥ २१॥
    वर्तित्रयोपेतमखण्डदीप्त्या तमोहरं बाह्यमथान्तरं च । साज्यं समस्तामरवर्गहृद्यं सुरेश मृत्युञ्जय वंशदीपम्
    ॥ २२॥ राजान्नं मधुरान्वितं च मृदुलं माणिक्यपात्रे स्थितं हिङ्गूजीरकसन्मरीचिमिलितैः शाकैरनेकैः शुभैः
    । शाकं सम्यगपूपसूपसहितं सद्योघृतेनाप्लुतं श्रीमृत्युञ्जय पार्वतीप्रिय विभो सापोशनं भुज्यताम् ॥ २३॥
    कूष्माण्डवार्ताकपटोलिकानां फलानि रम्याणि च कारवल्ल्या । सुपाकयुक्तानि ससौरभाणि श्रीकण्ठ मृत्युञ्जय
    भक्षयेश ॥ २४॥ शीतलं मधुरं स्वच्छं पावनं वासितं लघु । मध्ये स्वीकुरु पानीयं शिव मृत्युञ्जय प्रभो ॥
    २५॥ शर्करामिलितं स्निग्धं दुग्धान्नं गोघृतान्वितम् । कदलीफलसंमिश्रं भुज्यतां मृत्युसंहर ॥ २६॥ केवलमतिमाधुर्यं
    दुग्धैः स्निग्धैश्च शर्करामिलितैः । एलामरीचमिलितं मृत्युञ्जय देव भुङ्क्ष्व परमान्नम् ॥ २७॥ रम्भाचूतकपित्थकण्ठकफलैर्द्राक्षारसास्वादुम
