    ध॑क्ष्यत॒सं न शुष्कम् । ऊ॒र्ध्वो भ॑व॒ प्रति॑ वि॒ध्याध्य॒स्मदा॒विष्कृ॑णुष्व॒ दैव्या न्यग्ने। अव॑ स्थि॒रा
