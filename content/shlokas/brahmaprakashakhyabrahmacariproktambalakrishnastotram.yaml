id: brahmaprakashakhyabrahmacariproktambalakrishnastotram
category: stotram
name:
  english: brahmaprakashakhyabrahmacariproktambalakrishnastotram
  devanagari: ब्रह्मप्रकाशाख्यब्रह्मचारिप्रोक्तंबालकृष्णस्तोत्रम्
content:
  english: brahmaprakashakhyabrahmacariproktam balakrishnastotram ityukto brahmanah praha guroryogadaham
    tava | prajvalya sarvapapani karishye mokshanam dhruvam || 83|| yadi shushrushito vahnirguroh shushrushunadanu
    | vratani va sucirnani moksho bhavatu rakshasah || 84|| yadyaham pitaram devam gurum ca mataram harim
    | gauravena'bhivandami moksho bhavatu rakshasah || 85|| yadyaham manasa vaca karmana ca gurum harim
    | na'vamane yojayami moksho bhavatu rakshasah || 86|| japa rakshasa devesham shrikrishnam purushottamam
    | harikrishnam hrishikesham vasudevam janardanam || 87|| pranato'smi jagannatham sa ca moksham dadhatu
    me | caracaragurum natham krishnanarayanam prabhum || 88|| shankhinam cakrinam sharngadharinam dhvajinam
    harim | pranato'smi patim lakshmyah sa ca moksham dadhatu me || 89|| damodaram pundarikanetram ca
    sheshashayinam | pranato'smi ca govindam sa ca moksham dadhatu me || 90|| narayanam naram prithvidharam
    dhamadhivasinam | pranato'smi prabhanatham sa ca moksham dadhatu me || 91|| shrivatsavakshasam shrisham
    shrimatparavatipatim | pranato'smi ramakantam sa ca moksham dadhatu me || 92|| yatayo yam cintayanti
    radha ranjayati prabhum | samastalambanamurtim tamasmi sharanam gatah || 93|| parabrahma'sankhyagopipatim
    shrikambharasutam | sarvadharam sarvagam ca tamasmi sharanam gatah || 94|| paramatmanamatmastham karmakshalanashaktikam
    | punarbhavaprabhettaram tamasmi sharanam gatah || 95|| ishan devanrishin pitrin manava~shca sarisripan
    | padapan jalajan svedodbhavan srijati rakshati || 96|| brahmarupadharam jagadyonim trataramacyutam
    | gopalakrishnabalam ca tamasmi sharanam gatah || 97|| yajnesha cantakam sarvantaryaminam pareshvaram
    | yasmannanyatparam kincit tamasmi sharanam gatah || 98|| shubha'shubhani karyani janmantarakritani
    me | anadishrikrishnanarayanastani vyapohatu || 99|| yannishayam ca yatprataryanmadhyahna'parahnayoh
    | sandhyayoshca kritam papam tanme sarvam pranashyatu || 100|| yattishthata yadvrajata yacca shayyagatena
    vai | kritam duhkhakaram karma kayena manasa gira || 101|| ajnanato jnanato va madaccalitacetasa |
    tatkshipram vilayam yatu balakrishnasya kirtanat || 102|| paradaraparadravyavancchadrohodbhavam ca
    yat | mahatmanam pranindam ca kurvata paraduhkhadam || 103|| kritam papam marmabhedivacasa tatpranashyatu
    | yacca bhojye tatha peye bhakshye coshye vilehane || 104|| yadbalye yacca kaumarye yatpapam yauvane
    mama | vayahparinatau yacca yacca janmantare kritam || 105|| tadanadikrishnanarayaneti japakirtanat
    | prayatu vilayam sadyo mokshadasya prabhavanat || 106|| anadishrikrishnanarayanaya haraye namah |
    kambharashrinandanaya balakrishnaya te namah || 107|| shrimadgopalakrishnasya balakaya namo namah
    | etadbhadra maya''khyatam tava patakanashanam || 108|| svargadam mokshadam divyam stotram yadgurunoditam
    | anena balakrishnam tvam samaradhaya rakshasa
  devanagari: ब्रह्मप्रकाशाख्यब्रह्मचारिप्रोक्तं बालकृष्णस्तोत्रम् इत्युक्तो ब्राह्मणः प्राह गुरोर्योगादहं
    तव । प्रज्वाल्य सर्वपापानि करिष्ये मोक्षणं ध्रुवम् ॥ ८३॥ यदि शुश्रूषितो वह्निर्गुरोः शुश्रूषूणादनु
    । व्रतानि वा सुचीर्णानि मोक्षो भवतु रक्षसः ॥ ८४॥ यद्यहं पितरं देवं गुरुं च मातरं हरिम् । गौरवेणाऽभिवन्दामि
    मोक्षो भवतु रक्षसः ॥ ८५॥ यद्यहं मनसा वाचा कर्मणा च गुरुं हरिम् । नाऽवमाने योजयामि मोक्षो भवतु रक्षसः
    ॥ ८६॥ जप राक्षस देवेशं श्रीकृष्णं पुरुषोत्तमम् । हरिकृष्णं हृषीकेशं वासुदेवं जनार्दनम् ॥ ८७॥ प्रणतोऽस्मि
    जगन्नाथं स च मोक्षं दधातु मे । चराचरगुरुं नाथं कृष्णनारायणं प्रभुम् ॥ ८८॥ शङ्खिनं चक्रिणं शार्ङ्गधारिणं
    ध्वजिनं हरिम् । प्रणतोऽस्मि पतिं लक्ष्म्याः स च मोक्षं दधातु मे ॥ ८९॥ दामोदरं पुण्डरीकनेत्रं च शेषशायिनम्
    । प्रणतोऽस्मि च गोविन्दं स च मोक्षं दधातु मे ॥ ९०॥ नारायणं नरं पृथ्वीधरं धामाधिवासिनम् । प्रणतोऽस्मि
    प्रभानाथं स च मोक्षं दधातु मे ॥ ९१॥ श्रीवत्सवक्षसं श्रीशं श्रीमत्पारवतीपतिम् । प्रणतोऽस्मि रमाकान्तं
    स च मोक्षं दधातु मे ॥ ९२॥ यतयो यं चिन्तयन्ति राधा रञ्जयति प्रभुम् । समस्तालम्बनमूर्तिं तमस्मि शरणं
    गतः ॥ ९३॥ परब्रह्माऽसङ्ख्यगोपीपतिं श्रीकम्भरासुतम् । सर्वाधारं सर्वगं च तमस्मि शरणं गतः ॥ ९४॥ परमात्मानमात्मस्थं
    कर्मक्षालनशक्तिकम् । पुनर्भवप्रभेत्तारं तमस्मि शरणं गतः ॥ ९५॥ ईशान् देवानृषीन् पितॄन् मानवाँश्च सरीसृपान्
    । पादपान् जलजान् स्वेदोद्भवान् सृजति रक्षति ॥ ९६॥ ब्रह्मरूपधरं जगद्योनिं त्रातारमच्युतम् । गोपालकृष्णबालं
    च तमस्मि शरणं गतः ॥ ९७॥ यज्ञेश चान्तकं सर्वान्तर्यामिणं परेश्वरम् । यस्मान्नान्यत्परं किञ्चित् तमस्मि
    शरणं गतः ॥ ९८॥ शुभाऽशुभानि कार्याणि जन्मान्तरकृतानि मे । अनादिश्रीकृष्णनारायणस्तानि व्यपोहतु ॥ ९९॥
    यन्निशायां च यत्प्रातर्यन्मध्याह्नाऽपराह्णयोः । सन्ध्ययोश्च कृतं पापं तन्मे सर्वं प्रणश्यतु ॥ १००॥
    यत्तिष्ठता यद्व्रजता यच्च शय्यागतेन वै । कृतं दुःखकरं कर्म कायेन मनसा गिरा ॥ १०१॥ अज्ञानतो ज्ञानतो
    वा मदाच्चलितचेतसा । तत्क्षिप्रं विलयं यातु बालकृष्णस्य कीर्तनात् ॥ १०२॥ परदारपरद्रव्यवाञ्च्छाद्रोहोद्भवं
    च यत् । महात्मनां प्रनिन्दां च कुर्वता परदुःखदाम् ॥ १०३॥ कृतं पापं मर्मभेदिवचसा तत्प्रणश्यतु । यच्च
    भोज्ये तथा पेये भक्ष्ये चोष्ये विलेहने ॥ १०४॥ यद्बाल्ये यच्च कौमार्ये यत्पापं यौवने मम । वयःपरिणतौ
    यच्च यच्च जन्मान्तरे कृतम् ॥ १०५॥ तदनादिकृष्णनारायणेति जपकीर्तनात् । प्रयातु विलयं सद्यो मोक्षदस्य
    प्रभावनात् ॥ १०६॥ अनादिश्रीकृष्णनारायणाय हरये नमः । कम्भराश्रीनन्दनाय बालकृष्णाय ते नमः ॥ १०७॥ श्रीमद्गोपालकृष्णस्य
    बालकाय नमो नमः । एतद्भद्र मयाऽऽख्यातं तव पातकनाशनम् ॥ १०८॥ स्वर्गदं मोक्षदं दिव्यं स्तोत्रं यद्गुरुणोदितम्
    । अनेन बालकृष्णं त्वं समाराधय राक्षस
