id: annamayya-keerthanas-jagadapu-chanuvula
category: stotram
name:
  english: Annamayya Keerthanas Jagadapu Chanuvula
content:
  english: jagadapu canuvula jajara saginala mancapu jajara || mòllalu turumula mudicina baruvuna mòllapu
    sarasapu muripèmuna | jallana puppòdi jaraga patipai calle patipai calle rativalu jajara || bharapu
    kucamula paipai kadu sim garamu nèrapeti gandhavòdi | ceruva patipai cindaga padatulu sarèku calleru
    jajara || binkapu kutami pènageti cèmatala pankapu putala parimalamu | venkatapatipai vèladulu ninceru
    sankuma dambula jajara ||
  devanagari: जगडपु चनुवुल जाजर सगिनल मञ्चपु जाजर ॥ मॊल्ललु तुरुमुल मुडिचिन बरुवुन मॊल्लपु सरसपु मुरिपॆमुन
    । जल्लन पुप्पॊडि जारग पतिपै चल्ले पतिपै चल्ले रतिवलु जाजर ॥ भारपु कुचमुल पैपै कडु सिं गारमु नॆरपेटि
    गन्धवॊडि । चेरुव पतिपै चिन्दग पडतुलु सारॆकु चल्लेरु जाजर ॥ बिङ्कपु कूटमि पॆनगेटि चॆमटल पङ्कपु पूतल
    परिमलमु । वेङ्कटपतिपै वॆलदुलु निञ्चेरु सङ्कुम दम्बुल जाजर ॥
