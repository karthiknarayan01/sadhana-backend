id: rudrashtadhyayishuklayajurvediya
category: veda
name:
  english: rudrashtadhyayishuklayajurvediya
  devanagari: रुद्राष्टाध्यायीशुक्लयजुर्वेदीय
content:
  english: shi ca me sharirani ca ma ayushca me jara ca me yajnena kalpantam || 3|| jyaishthyam ca ma
    adhipatyam ca me manyushca me bhamashca me'mashca me'mbhashca me jema ca me mahima ca me varima ca
    me prathima ca me varshima ca me draghima ca me vriddham ca me vriddhishca me yajnena kalpantam ||
    4|| satyam ca me shraddha ca me jagacca me dhanam ca me vishvam ca me mahashca me krida ca me modashca
    me jatam ca me janishyamanam ca me suktam ca me sukritam ca me yajnena kalpantam || 5|| ritam ca me'mritam
    ca me'yakshmam ca me'namayacca me jivatushca me dirghayutvam ca me'namitram ca me'bhayam ca me sukham
    ca me shayanam ca me sushashca me sudinam ca me yajnena kalpantam || 6|| yanta ca me dharta ca me
    kshemashca me dhritishca me vishvam ca me mahashca me samvicca me jnatram ca me sushca me prasushaca
    me siram ca me layashca me yajnena kalpantam || 7|| sham ca me mayashca me priyam ca me'nukamashca
    me kamashca me saumanasashca me bhagashca me dravinam ca me bhadram ca me shreyashca me vasiyashca
    me yashashca me yajnena kalpantam || 8|| urkca me sunrita ca me payashca me rasashca me ghritam ca
    me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca me jaitram ca ma audbhidyam ca
    me yajnena kalpantam || 9|| rayishca me rayashca me pushtam ca me pushtishca me vibhu ca me prabhu
    ca me purnam ca me purnataram ca me kuyavam ca me'kshitam ca me'nnam ca me'kshucca me yajnena kalpantam
    || 10|| vittam ca me vedyam ca me bhutam ca me bhavishyacca me sugam ca me supathyam ca ma riddham
    ca ma riddhishca me klriptam ca me klriptishca me matishca me sumatishca me yajnena kalpantam || 11||
    vrihayashca me yavashca me mashashca me tilashca me mudrashca me khalvashca me priyangavashca me'navashca
    me shyamakashca me nivarashca me godhumashca me masurashca me yajnena kalpantam || 12|| ashma ca me
    mrittika ca me girayashca me parvatashca me sikatashca me vanaspatayashca me hiranyam ca me'yashca
    me shyamam ca me loham ca me sisam ca me trapu ca me yajnena kalpantam || 13|| agnishca ma apashca
    me virudhashca ma oshadhayashca me krishtapacyashca me'krishtapacyashca me gramyashca me pashava aranyashca
    me vittam ca me vittishca me bhutam ca me bhutishca me yajnena kalpantam || 14|| vasu ca me vasatishca
    me karma ca me shaktishca me'rthashca ma emashca ma itya ca me gatishca me yajnena kalpantam || 15||
    agnishca ma indrashca me somashca ma indrashca me savita ca ma indrashca me sarasvati ca ma indrashca
    me pusha ca ma indrashca me brihaspatishca ma indrashca me yajnena kalpantam || 16|| mitrashca ma
    indrashca me varunashca ma indrashca me dhata ca ma indrashca me tvashta ca ma indrashca me marutashca
    ma indrashca me vishve ca me deva indrashca me yajnena kalpantam || 17|| prithivi ca ma indrashca
    me'ntariksham ca ma indrashca me dyaushca ma indrashca me samashca ma indrashca me nakshatrani ca
    ma indrashca me dishashca ma indrashca me yajnena kalpantam || 18|| a
  devanagari: षि च मे शरीराणि च म आयुश्च मे जरा च मे यज्ञेन कल्पन्ताम् ॥ ३॥ ज्यैष्ठ्यं च म आधिपत्यं च
    मे मन्युश्च मे भामश्च मेऽमश्च मेऽम्भश्च मे जेमा च मे महिमा च मे वरिमा च मे प्रथिमा च मे वर्षिमा च
    मे द्राघिमा च मे वृद्धं च मे वृद्धिश्च मे यज्ञेन कल्पन्ताम् ॥ ४॥ सत्यं च मे श्रद्धा च मे जगच्च मे
    धनं च मे विश्वं च मे महश्च मे क्रीडा च मे मोदश्च मे जातं च मे जनिष्यमाणं च मे सूक्तं च मे सुकृतं च
    मे यज्ञेन कल्पन्ताम् ॥ ५॥ ऋतं च मेऽमृतं च मेऽयक्ष्मं च मेऽनामयच्च मे जीवातुश्च मे दीर्घायुत्वं च मेऽनमित्रं
    च मेऽभयं च मे सुखं च मे शयनं च मे सूषाश्च मे सुदिनं च मे यज्ञेन कल्पन्ताम् ॥ ६॥ यन्ता च मे धर्ता च
    मे क्षेमश्च मे धृतिश्च मे विश्वं च मे महश्च मे संविच्च मे ज्ञात्रं च मे सूश्च मे प्रसूशच मे सीरं च
    मे लयश्च मे यज्ञेन कल्पन्ताम् ॥ ७॥ शं च मे मयश्च मे प्रियं च मेऽनुकामश्च मे कामश्च मे सौमनसश्च मे
    भगश्च मे द्रविणं च मे भद्रं च मे श्रेयश्च मे वसीयश्च मे यशश्च मे यज्ञेन कल्पन्ताम् ॥ ८॥ ऊर्क्च मे
    सूनृता च मे पयश्च मे रसश्च मे घृतं च मे मधु च मे सग्धिश्च मे सपीतिश्च मे कृषिश्च मे वृष्टिश्च मे जैत्रं
    च म औद्भिद्यं च मे यज्ञेन कल्पन्ताम् ॥ ९॥ रयिश्च मे रायश्च मे पुष्टं च मे पुष्टिश्च मे विभु च मे प्रभु
    च मे पूर्णं च मे पूर्णतरं च मे कुयवं च मेऽक्षितं च मेऽन्नं च मेऽक्षुच्च मे यज्ञेन कल्पन्ताम् ॥ १०॥
    वित्तं च मे वेद्यं च मे भूतं च मे भविष्यच्च मे सुगं च मे सुपथ्यं च म ऋद्धं च म ऋद्धिश्च मे क्लृप्तं
    च मे क्लृप्तिश्च मे मतिश्च मे सुमतिश्च मे यज्ञेन कल्पन्ताम् ॥ ११॥ व्रीहयश्च मे यवाश्च मे माषाश्च मे
    तिलाश्च मे मुद्राश्च मे खल्वाश्च मे प्रियङ्गवश्च मेऽणवश्च मे श्यामाकाश्च मे नीवाराश्च मे गोधूमाश्च
    मे मसूराश्च मे यज्ञेन कल्पन्ताम् ॥ १२॥ अश्मा च मे मृत्तिका च मे गिरयश्च मे पर्वताश्च मे सिकताश्च मे
    वनस्पतयश्च मे हिरण्यं च मेऽयश्च मे श्यामं च मे लोहं च मे सीसं च मे त्रपु च मे यज्ञेन कल्पन्ताम् ॥
    १३॥ अग्निश्च म आपश्च मे वीरुधश्च म ओषधयश्च मे कृष्टपच्याश्च मेऽकृष्टपच्याश्च मे ग्राम्याश्च मे पशव
    आरण्याश्च मे वित्तं च मे वित्तिश्च मे भूतं च मे भूतिश्च मे यज्ञेन कल्पन्ताम् ॥ १४॥ वसु च मे वसतिश्च
    मे कर्म च मे शक्तिश्च मेऽर्थश्च म एमश्च म इत्या च मे गतिश्च मे यज्ञेन कल्पन्ताम् ॥ १५॥ अग्निश्च म
    इन्द्रश्च मे सोमश्च म इन्द्रश्च मे सविता च म इन्द्रश्च मे सरस्वती च म इन्द्रश्च मे पूषा च म इन्द्रश्च
    मे बृहस्पतिश्च म इन्द्रश्च मे यज्ञेन कल्पन्ताम् ॥ १६॥ मित्रश्च म इन्द्रश्च मे वरुणश्च म इन्द्रश्च
    मे धाता च म इन्द्रश्च मे त्वष्टा च म इन्द्रश्च मे मरुतश्च म इन्द्रश्च मे विश्वे च मे देवा इन्द्रश्च
    मे यज्ञेन कल्पन्ताम् ॥ १७॥ पृथिवी च म इन्द्रश्च मेऽन्तरिक्षं च म इन्द्रश्च मे द्यौश्च म इन्द्रश्च
    मे समाश्च म इन्द्रश्च मे नक्षत्राणि च म इन्द्रश्च मे दिशश्च म इन्द्रश्च मे यज्ञेन कल्पन्ताम् ॥ १८॥
    अ
