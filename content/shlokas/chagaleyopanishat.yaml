id: chagaleyopanishat
category: upanishad
name:
  english: chagaleyopanishat
  devanagari: छागलेयोपनिषत्
content:
  english: ugam yadajyam yanmarutvatiyamityatha yanmahavirasambharanani yadagnerabhivartanani yadrajabhikrayanani
    yadabhishavitrani yadaupayamani yadupamantrananyatha yattrivritpancadashah saptadasha ekavimsha iti
    | kvasya tadagadyadayam shavashayitamashayishteti | te hocurnahasamvatsaravasinamanubruyaditi khalu
    nah purve'nvashishan | yatsamvatsaram vatsyathatha vedishyatheti | te ha samvatsaramushuh || tato
    ha balisha ucuravatta va samvatsaramime brahmanah | hantaishamanubravameti | te ha grihitvaivainan
    patho'bhisamiyuh | te ha sankridata eva kubarino rathakatyamavindan | te hocuh sampashyadhvamiti |
    kim hiti | kubarinameva saumya iti | tatheti | kathamiveti | yathaivopasritvaro vardhistiryagullalantibhiriva
    vicibhih shaphabhirevopaskandannutplavedevam haivaishobhisritvaranameva dhuryanam cakramatamarinamutplavatiti
    | yathaivasau pratisritvarena samah sameva kridedevam haisha sankridatiti | yathaivasavitashceto'mutashcamutashca
    sampradravata ivopashupyata ivopaskandamabhimridgatyabhipatayedevam haisha itashcetashcamutashca sampradravata
    ivopashupyata ivopaskandamabhimridgatyabhipatayati | yathaivasau rajanam va rajapurusham va nilayanam
    prayedevam haivaisha yanta nilayanam prapayatiti | te hocurapidam sadhiya iti | sadhiya iti hocuh
    | te ha tasyaiva panthanamanupratishthannantam ha sayahanyevopasampadayamasuh || tam yadavasayashvamstakshapohyapagadatha
    balisha vyalishta | ahidrishat | kathamiveti | te hocuryathaitam kashthabharamanaddhamanupashyamastathaivavasho
    bhusthah spandate | nengate na vivartate na ca vita iti | te ha balisha ucuryadayamidrigabhut kimasyapagaditi
    | takshaiveti | tathaivaitat saumya iti | atma va asya pracodayita karananyashvah shira naddhayo'sthinyupagraha
    asriganjanam karma pratodo vakyam kvananam tvagupanaha iti | sa yatha pracodayitrapojjhito nengenna
    ruruvitaivam haisha prajnenatmanapojjhito na brute na caityapi na shvasatyapi puyatyapi shvana upadhavantyapi
    kakah patantyapi gridhra askandannapi shiva jighatsanniti | te tata eva dragiva vyajnasishuh | te
    ha padayorevabhimarshya balishanucuh | na ha vava nastadyena nishkurma imamevetyanjalim kritvopasthishatetyaha
    bhagavan chagaleyasta ime shlokah
  devanagari: उगं यदाज्यं यन्मरुत्वतीयमित्यथ यन्महावीरसम्भरणानि यदग्नेरभिवर्तनानि यद्राजाभिक्रयणानि यदभिषावित्राणि
    यदौपयामानि यदुपमन्त्रणान्यथ यत्त्रिवृत्पञ्चदशः सप्तदश एकविंश इति । क्वास्य तदगाद्यदयं शवशयितमशयिष्टेति
    । ते होचुर्नहासंवत्सरवासिनामनुब्रूयादिति खलु नः पूर्वेऽन्वशिषन् । यत्संवत्सरं वत्स्यथाथ वेदिष्यथेति
    । ते ह संवत्सरमूषुः ॥ ततो ह बालिशा ऊचुरवात्त वा संवत्सरमिमे ब्राह्मणाः । हन्तैषामनुब्रवामेति । ते
    ह गृहीत्वैवैनान् पथोऽभिसमीयुः । ते ह सङ्क्रीडत एव कूबरिणो रथकट्यामविन्दन् । ते होचुः सम्पश्यध्वमिति
    । किं हीति । कूबरिणमेव सौम्या इति । तथेति । कथमिवेति । यथैवोपसृत्वरो वार्धिस्तिर्यगुल्ललन्तीभिरिव
    वीचिभिः शफाभिरेवोपस्कन्दन्नुत्प्लवेदेवं हैवैषोभिसृत्वराणामेव धुर्याणां चक्रमतामरीणामुत्प्लवतीति ।
    यथैवासौ प्रतिसृत्वरेण समः समेव क्रीडेदेवं हैष सङ्क्रीडतीति । यथैवासावितश्चेतोऽमुतश्चामुतश्च सम्प्रद्रवत
    इवोपशुप्यत इवोपस्कन्दमभिमृद्गात्यभिपातयेदेवं हैष इतश्चेतश्चामुतश्च सम्प्रद्रवत इवोपशुप्यत इवोपस्कन्दमभिमृद्गात्यभिपातयति
    । यथैवासौ राजानं वा राजपुरुषं वा निलयनं प्रायेदेवं हैवैष यन्ता निलयनं प्रापयतीति । ते होचुरपीदं साधीय
    इति । साधीय इति होचुः । ते ह तस्यैव पन्थानमनुप्रातिष्ठन्नन्तं ह सायाहन्येवोपसम्पादयामासुः ॥ तं यदावसायाश्वांस्तक्षापोह्यापागादथ
    बालिशा व्यलिष्ट । अहीदृशत् । कथमिवेति । ते होचुर्यथैतं काष्ठभारमानद्धमनुपश्यामस्तथैवावशो भूस्थः स्पन्दते
    । नेङ्गते न विवर्तते न च वीत इति । ते ह बालिशा ऊचुर्यदयमीदृगभूत् किमस्यापागादिति । तक्षैवेति । तथैवैतत्
    सौम्या इति । आत्मा वा अस्य प्रचोदयिता करणान्यश्वाः शिरा नद्धयोऽस्थीन्युपग्रहा असृगाञ्जनं कर्म प्रतोदो
    वाक्यं क्वाणनं त्वगुपानह इति । स यथा प्रचोदयित्रापोज्झितो नेङ्गेन्न रुरुवीतैवं हैष प्राज्ञेनात्मनापोज्झितो
    न ब्रूते न चैत्यपि न श्वसत्यपि पूयत्यपि श्वान उपधावन्त्यपि काकाः पतन्त्यपि गृध्रा आस्कन्दन्नपि शिवा
    जिघत्सन्निति । ते तत एव द्रागिव व्यज्ञासिषुः । ते ह पादयोरेवाभिमर्श्य बालिशानूचुः । न ह वाव नस्तद्येन
    निष्कुर्म इममेवेत्यञ्जलिं कृत्वोपास्थिषतेत्याह भगवान् छागलेयस्त इमे श्लोकाः
