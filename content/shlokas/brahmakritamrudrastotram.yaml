id: brahmakritamrudrastotram
category: stotram
name:
  english: brahmakritamrudrastotram
  devanagari: ब्रह्मकृतंरुद्रस्तोत्रम्
content:
  english: brahmakritam rudrastotram drishtva brahma haram rushtam tushtava parameshvaram | caturvaktrena
    vedoktastotrena jagatam patih || 9|| brahmovaca | prasida dakshayajnaghna suryam maccharanagatam |
    tvayaiva srishtam srishteshca samarambhe jagadguro || 10|| ashutosha mahabhaga prasida bhaktavatsala
    | kripaya ca kripasindho raksha raksha divanisham || 11|| brahmasvarupa bhagavansrishtisthityantakarana
    | svayam ravim ca nirmaya svayam samhartumicchasi || 12|| svayam brahma svayam shesho dharmah suryo
    hutashanah | indracandradayo devastvatto bhitah paratpara || 13|| rishayo munayashcaiva tvam nishevya
    tapodhanah | tapasam phaladata tvam tapastvam tapasam phalam || 14|| ityevamuktva brahma tam suryamaniya
    bhaktitah | pritya samarpayamasa shankare dinavatsale || 15|| shambhustamashisham kritva vidhim natva
    jagadvidhih | prasannavadanah shrimanalayam prayayau muda || 16|| iti dhatrikritam stotram sankate
    yah pathennarah | bhayatpramucyate bhito baddho mucyeta bandhanat || 17|| rajadvare shmashane ca magnapote
    maharnave | stotrasmaranamatrena mucyate natra samshayah || 18|| iti shribrahmavaivartapurane shrikrishnajanmakhande
    purve ashtacatvarimshadhyayantargatam brahmakritam rudrastotram samaptam | brahmavaivartapurana |
    shrikrishnajanma
  devanagari: ब्रह्मकृतं रुद्रस्तोत्रम् दृष्ट्वा ब्रह्मा हरं रुष्टं तुष्टाव परमेश्वरम् । चतुर्वक्त्रेण
    वेदोक्तस्तोत्रेण जगतां पतिः ॥ ९॥ ब्रह्मोवाच । प्रसीद दक्षयज्ञघ्न सूर्यं मच्छरणागतम् । त्वयैव सृष्टं
    सृष्टेश्च समारम्भे जगद्गुरो ॥ १०॥ आशुतोष महाभाग प्रसीद भक्तवत्सल । कृपया च कृपासिन्धो रक्ष रक्ष दिवानिशम्
    ॥ ११॥ ब्रह्मस्वरूप भगवन्सृष्टिस्थित्यन्तकारण । स्वयं रविं च निर्माय स्वयं संहर्तुमिच्छसि ॥ १२॥ स्वयं
    ब्रह्मा स्वयं शेषो धर्मः सूर्यो हुताशनः । इन्द्रचन्द्रादयो देवास्त्वत्तो भीताः परात्पर ॥ १३॥ ऋषयो
    मुनयश्चैव त्वां निषेव्य तपोधनाः । तपसां फलदाता त्वं तपस्त्वं तपसां फलम् ॥ १४॥ इत्येवमुक्त्वा ब्रह्मा
    तं सूर्यमानीय भक्तितः । प्रीत्या समर्पयामास शङ्करे दीनवत्सले ॥ १५॥ शम्भुस्तमाशिषं कृत्वा विधिं नत्वा
    जगद्विधिः । प्रसन्नवदनः श्रीमानालयं प्रययौ मुदा ॥ १६॥ इति धातृकृतं स्तोत्रं सङ्कटे यः पठेन्नरः । भयात्प्रमुच्यते
    भीतो बद्धो मुच्येत बन्धनात् ॥ १७॥ राजद्वारे श्मशाने च मग्नपोते महार्णवे । स्तोत्रस्मरणमात्रेण मुच्यते
    नात्र संशयः ॥ १८॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे अष्टचत्वारिंशाध्यायान्तर्गतं
    ब्रह्मकृतं रुद्रस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
