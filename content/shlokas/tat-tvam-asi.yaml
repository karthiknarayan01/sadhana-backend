id: tat-tvam-asi
category: mahavakya
name:
  english: Tat Tvam Asi
  devanagari: तत्त्वमसि
content:
  english: tat tvam asi
  devanagari: तत्त्वमसि
meaning:
  english: >-
    "That thou art" — one of the four Mahavakyas of Advaita Vedanta,
    a teaching repeated to Shvetaketu by his father pointing to the
    identity of the individual self with ultimate reality.
source_attribution:
  text_source: Chandogya Upanishad 6.8.7
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
