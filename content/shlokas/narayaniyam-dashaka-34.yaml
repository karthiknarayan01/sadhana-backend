id: narayaniyam-dashaka-34
category: stotram
name:
  english: Narayaniyam Dashaka 34
content:
  english: girvanairarthyamano dashamukhanidhanam kosaleshvrishyashringe putriyamishtimishtva dadushi
    dasharathakshmabhrite payasagryam | tadbhuktya tatpurandhrishvapi tisrishu samam jatagarbhasu jato
    ramastvam lakshmanena svayamatha bharatenapi shatrughnanamna || || kodandi kaushikasya kratuvaramavitum
    lakshmanenanuyato yato'bhustatavaca munikathitamanudvandvashantadhvakhedah | nrinam tranaya banairmunivacanabalattatakam
    patayitva labdhvasmadastrajalam munivanamagamo deva siddhashramakhyam || || maricam dravayitva makhashirasi
    sharairanyarakshamsi nighnan kalyam kurvannahalyam pathi padarajasa prapya vaidehageham | bhindanashcandracudam
    dhanuravanisutamindirameva labdhva rajyam pratishthathastvam tribhirapi ca samam bhratriviraissadaraih
    || || arundhane rushandhe bhrigukula tilake sankramayya svatejo yate yato'syayodhyam sukhamiha nivasan
    kantaya kantamurte | shatrughnenaikadatho gatavati bharate matulasyadhivasam tatarabdho'bhishekastava
    kila vihatah kekayadhishaputrya || || tatoktya yatukamo vanamanujavadhusamyutashcapadharah pauranarudhya
    marge guhanilayagatastvam jataciradhari| nava santirya gangamadhipadavi punastam bharadvajamara nnatva
    tadvakyahetoratisukhamavasashcitrakute girindre || || shrutva putrartikhinnam khalu bharatamukhat
    svargayatam svatatam tapto datva'mbu tasmai nidadhitha bharate padukam medinim ca atrim natva'tha
    gatva vanamativipulam dandakam candakayam hatva daityam viradham sugatimakalayashcaru bhoh sharabhangim
    || || natva'gastyam samastasharanikarasapatrakritim tapasebhyah pratyashraushih priyaishi tadanu ca
    munina vaishnave divyacape | brahmastre capi datte pathi pitrisuhridam vikshya bhuyo jatayum modat
    godatatante pariramasi pura pancavatyam vadhutya || || praptayah shurpanakhya madanacaladhriterarthanairnissahatma
    tam saumitrau visrijya prabalatamarusha tena nirlunanasam | drishtvainam rushtacittam kharamabhipatitam
    dushanam ca trimurdham vyahimsirasharanapyayutasamadhikamstatkshanadakshatoshma || || sodaryaproktavartavivashadashamukhadishtamaricamaya
    saranga sarasakshya sprihitamanugatah pravadhirbanaghatam | tanmayakrandaniryapitabhavadanujam ravanastamaharshi
    ttenarto'pi tvamantah kimapi mudamadhastadvadhopayalabhat || || bhuyastanvim vicinvannahrita dashamukhastvadvadhum
    madvadhene tyuktva yate jatayau divamatha suhridah pratanoh pretakaryam | grihnanam tam kabandham
    jaghanitha shabarim prekshya pampatate tvam samprapto vatasunum bhrishamuditamanah pahi vatalayesha
    ||
  devanagari: गीर्वाणैरर्थ्यमानो दशमुखनिधनं कोसलेष्वृश्यशृङ्गे पुत्रीयामिष्टिमिष्ट्वा ददुषि दशरथक्ष्माभृते
    पायसाग्र्यम् । तद्भुक्त्या तत्पुरन्ध्रीष्वपि तिसृषु समं जातगर्भासु जातो रामस्त्वं लक्ष्मणेन स्वयमथ
    भरतेनापि शत्रुघ्ननाम्ना ॥ ॥ कोदण्डी कौशिकस्य क्रतुवरमवितुं लक्ष्मणेनानुयातो यातोऽभूस्तातवाचा मुनिकथितमनुद्वन्द्वशान्ताध्वखेदः
    । नृणां त्राणाय बाणैर्मुनिवचनबलात्ताटकां पाटयित्वा लब्ध्वास्मादस्त्रजालं मुनिवनमगमो देव सिद्धाश्रमाख्यम्
    ॥ ॥ मारीचं द्रावयित्वा मखशिरसि शरैरन्यरक्षांसि निघ्नन् कल्यां कुर्वन्नहल्यां पथि पदरजसा प्राप्य वैदेहगेहम्
    । भिन्दानश्चान्द्रचूडं धनुरवनिसुतामिन्दिरामेव लब्ध्वा राज्यं प्रातिष्ठथास्त्वं त्रिभिरपि च समं भ्रातृवीरैस्सदारैः
    ॥ ॥ आरुन्धाने रुषान्धे भृगुकुल तिलके सङ्क्रमय्य स्वतेजो याते यातोऽस्ययोध्यां सुखमिह निवसन् कान्तया
    कान्तमूर्ते । शत्रुघ्नेनैकदाथो गतवति भरते मातुलस्याधिवासं तातारब्धोऽभिषेकस्तव किल विहतः केकयाधीशपुत्र्या
    ॥ ॥ तातोक्त्या यातुकामो वनमनुजवधूसंयुतश्चापधारः पौरानारुध्य मार्गे गुहनिलयगतस्त्वं जटाचीरधारी। नावा
    सन्तीर्य गङ्गामधिपदवि पुनस्तं भरद्वाजमारा न्नत्वा तद्वाक्यहेतोरतिसुखमवसश्चित्रकूटे गिरीन्द्रे ॥ ॥
    श्रुत्वा पुत्रार्तिखिन्नं खलु भरतमुखात् स्वर्गयातं स्वतातं तप्तो दत्वाऽम्बु तस्मै निदधिथ भरते पादुकां
    मेदिनीं च अत्रिं नत्वाऽथ गत्वा वनमतिविपुलं दण्डकं चण्डकायं हत्वा दैत्यं विराधं सुगतिमकलयश्चारु भोः
    शारभङ्गीम् ॥ ॥ नत्वाऽगस्त्यं समस्ताशरनिकरसपत्राकृतिं तापसेभ्यः प्रत्यश्रौषीः प्रियैषी तदनु च मुनिना
    वैष्णवे दिव्यचापे । ब्रह्मास्त्रे चापि दत्ते पथि पितृसुहृदं वीक्ष्य भूयो जटायुं मोदात् गोदातटान्ते
    परिरमसि पुरा पञ्चवट्यां वधूट्या ॥ ॥ प्राप्तायाः शूर्पणख्या मदनचलधृतेरर्थनैर्निस्सहात्मा तां सौमित्रौ
    विसृज्य प्रबलतमरुषा तेन निर्लूननासाम् । दृष्ट्वैनां रुष्टचित्तं खरमभिपतितं दूषणं च त्रिमूर्धं व्याहिंसीराशरानप्ययुतसमधिकांस्तत्क्षणादक्षतोष्मा
    ॥ ॥ सोदर्याप्रोक्तवार्ताविवशदशमुखादिष्टमारीचमाया सारङ्ग सारसाक्ष्या स्पृहितमनुगतः प्रावधीर्बाणघातम्
    । तन्मायाक्रन्दनिर्यापितभवदनुजां रावणस्तामहार्षी त्तेनार्तोऽपि त्वमन्तः किमपि मुदमधास्तद्वधोपायलाभात्
    ॥ ॥ भूयस्तन्वीं विचिन्वन्नहृत दशमुखस्त्वद्वधूं मद्वधेने त्युक्त्वा याते जटायौ दिवमथ सुहृदः प्रातनोः
    प्रेतकार्यम् । गृह्णानं तं कबन्धं जघनिथ शबरीं प्रेक्ष्य पम्पातटे त्वं सम्प्राप्तो वातसूनुं भृशमुदितमनाः
    पाहि वातालयेश ॥
