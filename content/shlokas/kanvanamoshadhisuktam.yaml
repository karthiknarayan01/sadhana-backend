id: kanvanamoshadhisuktam
category: sukta
name:
  english: kanvanamoshadhisuktam
  devanagari: काण्वानामोषधिसूक्तम्
content:
  english: ri̱nvanti̱ yashca̭ du̱ram para̭gatah | sarva̭h sa̱ngatya̭ virudho̱syai sanda̭tta vi̱ryyam ||
    20|| na̱sha̱yi̱tri ba̱lasa̱syarsha̭sa upa̱cita̭masi | atho̭ sha̱tasya̱ yakshma̭nam paka̱rora̭si̱ nasha̭ni
    || 21|| mavo̭ rishat khani̱ta yasmai̭ ca̱ham khana̭mi vah | dvi̱paccatṷshpada̱smakam sarva̭mastvanatu̱ram
    || 22|| osha̭dhaya̱h samva̭dante̱ somḙna sa̱ha rajna̭ | yasmai̭ kri̱noti̭ brahma̱nastam ra̭jan parayamasi
    || 23|| tvam ga̭ndha̱rva a̭khana̱m stvami̭ndra̱stvam briha̱spati̭h | tvamo̭shadhe̱ somo̱ raja̭ vi̱dvan
    yakshma̭damucyata || 24|| tvamṷtta̱masyo̭shadhe̱ tava̭ vri̱ksha upa̭sta̱yah | upa̭stirastu so̱'smaka̱m
    yo a̱sma~3 a̭bhi̱dasa̭ti || 25|| ityacaryagovindasya kritishu kanviyasya oshadhisuktasya bhashyam
    sampurnam || sasvarah ya oshadhih purva jata devebhyastriyugam pura | manai nu babhrunamaham shatam
    dhamani sapta ca || 1|| shatam vo amba dhamani sahasramuta vo ruhah | adha shatakratvo yuyamimam me
    agadam krita || 2|| oshadhih prati gribhnita pushpavatih prasuvarih | ashva iva sajitvarirvirudhah
    parayishnavah || 3|| oshadhiriti matarastadvo devirupabruve | saneyamashvam gam vasa atmanam tava
    purusha || 4|| ashvatthe vo nishadanam parnne vo vasatishkrita | gobhaja itkilasatha yatsanavatha
    purusham || 5|| yatraushadhih samagmata rajanah samita iva | viprah sa ucyate bhishag rakshohamivacatanah
    || 6|| ashvavatim somavatimurjjayantimudojasam | avitsi sarva oshadhirasma arishtatataye || 7|| ucchushma
    oshadhinam gavo goshthadiverate | dhanam sanishyantinamatmanam tava purusha || 8|| ishkritirnnama
    vo matatho yuyam stha nishkritih | sirah patatrini sthana yadamayati nishkritha || 9|| ati vishvah
    parishtha stena iva vrajamakramuh | oshadhih pracucyavuryyat kim ca tanvo rapah || 10|| yadima vajayannahamoshadhirhasta
    adadhe | atma yakshmasya nashyati pura jivagribho yatha || 11|| yasyaushadhih prasarppathangamangam
    parushparuh | tato yakshmam vibadhadhva ugro maddhyamashiriva || 12|| sakam yakshma prapata cashena
    kikidivina | sakam vatasya dhrajya sakam nashya nihakaya || 13|| anya vo anyamavatvanyanyasya upavata
    | tah sarvah samvidana idam me pravata vacah || 14|| yah phaliniryya aphala apushpa yashca pushpinih
    | brihaspatiprasutasta no muncantvam hasah || 15|| muncantu ma shapathyadatho varunyaduta | atho yamasya
    padvishat sarvasmad devakilbishat || 16|| avayatih samavadanta diva oshadhayaspari | yam jivamashnavamahai
    na sa rishyati purushah || 17|| ya oshadhih somarajnirbahvih shatavicakshanah | tasamasi tvamuttamaram
    kamaya sham hride || 18|| ya oshadhih somarajnirvishthitah prithivimanu | brihaspatiprasuta asyai
    sandatta viryyam || 19|| yashvedamupasha
  devanagari: ृ॒ण्वन्ति॒ याश्च॑ दू॒रं परा॑गताः । सर्वाः॑ स॒ङ्गत्य॑ वीरुधो॒स्यै सन्द॑त्त वी॒र्य्यम् ॥ २०॥
    ना॒श॒यि॒त्री ब॒लास॒स्यार्श॑स उप॒चिता॑मसि । अथो॑ श॒तस्य॒ यक्ष्मा॑णां पाका॒रोर॑सि॒ नाश॑नी ॥ २१॥ मावो॑
    रिषत् खनि॒ता यस्मै॑ चा॒हं खना॑मि वः । द्वि॒पच्चतु॑ष्पद॒स्माकं सर्व॑मस्त्वनातु॒रम् ॥ २२॥ ओष॑धयः॒ संव॑दन्ते॒
    सोमे॑न स॒ह राज्ञा॑ । यस्मै॑ कृ॒णोति॑ ब्राह्म॒णस्तं रा॑जन् पारयामसि ॥ २३॥ त्वां ग॑न्ध॒र्वा अ॑खनं॒ स्त्वामि॑न्द्र॒स्त्वां
    बृह॒स्पतिः॑ । त्वामो॑षधे॒ सोमो॒ राजा॑ वि॒द्वान् यक्ष्मा॑दमुच्यत ॥ २४॥ त्वमु॑त्त॒मास्यो॑षधे॒ तव॑ वृ॒क्षा
    उप॑स्त॒यः । उप॑स्तिरस्तु सो॒ऽस्माकं॒ यो अ॒स्माँ३ अ॑भि॒दास॑ति ॥ २५॥ इत्याचार्यगोविन्दस्य कृतिषु काण्वीयस्य
    ओषधिसूक्तस्य भाष्यं सम्पूर्णम् ॥ सस्वरः या ओषधीः पूर्वा जाता देवेभ्यस्त्रियुगं पुरा । मनै नु बभ्रुणामहं
    शतं धामानि सप्त च ॥ १॥ शतं वो अम्ब धामानि सहस्रमुत वो रुहः । अधा शतक्रत्वो यूयमिमं मे अगदं कृता ॥
    २॥ ओषधीः प्रति गृभ्णीत पुष्पवतीः प्रसूवरीः । अश्वा इव सजित्वरीर्वीरुधः पारयिष्णवः ॥ ३॥ ओषधीरिति मातरस्तद्वो
    देवीरुपब्रुवे । सनेयमश्वं गां वास आत्मानं तव पूरुष ॥ ४॥ अश्वत्थे वो निषदनं पर्ण्णे वो वसतिष्कृता ।
    गोभाज इत्किलासथ यत्सनवथ पूरुषम् ॥ ५॥ यत्रौषधीः समग्मत राजानः समिता इव । विप्रः स उच्यते भिषग् रक्षोहामीवचातनः
    ॥ ६॥ अश्वावतीं सोमावतीमूर्ज्जयन्तीमुदोजसम् । आवित्सि सर्वा ओषधीरस्मा अरिष्टतातये ॥ ७॥ उच्छुष्मा ओषधीनां
    गावो गोष्ठादिवेरते । धनं सनिष्यन्तीनामात्मानं तव पूरुष ॥ ८॥ इष्कृतिर्न्नाम वो माताथो यूयं स्थ निष्कृतीः
    । सीराः पतत्रिणी स्थन यदामयति निष्कृथ ॥ ९॥ अति विश्वाः परिष्ठा स्तेन इव व्रजमक्रमुः । ओषधीः प्राचुच्यवुर्य्यत्
    किं च तन्वो रपः ॥ १०॥ यदिमा वाजयन्नहमोषधीर्हस्त आदधे । आत्मा यक्ष्मस्य नश्यति पुरा जीवगृभो यथा ॥ ११॥
    यस्यौषधीः प्रसर्प्पथाङ्गमङ्गं परुष्परुः । ततो यक्ष्मं विबाधध्व उग्रो मद्ध्यमशीरिव ॥ १२॥ साकं यक्ष्म
    प्रपत चाषेण किकिदीविना । साकं वातस्य ध्राज्या साकं नश्य निहाकया ॥ १३॥ अन्या वो अन्यामवत्वन्यान्यस्या
    उपावता । ताः सर्वाः संविदाना इदं मे प्रावता वचः ॥ १४॥ याः फलिनीर्य्या अफला अपुष्पा याश्च पुष्पिणीः
    । बृहस्पतिप्रसूतास्ता नो मुञ्चन्त्वं हसः ॥ १५॥ मुञ्चन्तु मा शपथ्यादथो वरुण्यादुत । अथो यमस्य पड्वीशात्
    सर्वस्माद् देवकिल्बिषात् ॥ १६॥ अवयतीः समवदन्त दिव ओषधयस्परि । यं जीवमश्नवामहै न स रिष्याति पूरुषः
    ॥ १७॥ या ओषधीः सोमराज्ञीर्बह्वीः शतविचक्षणाः । तासामसि त्वमुत्तमारं कामाय शं हृदे ॥ १८॥ या ओषधीः सोमराज्ञीर्विष्ठिताः
    पृथिवीमनु । बृहस्पतिप्रसूता अस्यै सन्दत्त वीर्य्यम् ॥ १९॥ याश्वेदमुपश
