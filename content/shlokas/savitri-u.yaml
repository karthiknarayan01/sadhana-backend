id: savitri-u
category: upanishad
name:
  english: savitri u
  devanagari: सवित्रि उ
content:
  english: savitryupanishat savitryupanishadvedyacitsavitrapadojjvalam | pratiyogivinirmuktam ramacandrapadam
    bhaje || savitryatma pashupatam param brahmavadhutakam | tripuratapanam devitripura kathabhavana ||
    om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca | sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam me'stu | tadatmani nirate
    ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || harih om || kah
    savita ka savitri agnireva savita prithivi savitri sa yatragnistatprithivi yatra vai prithivi tatragniste
    dve yoni tadekam mithunam || 1|| kah savita ka savitri varuna eva savitapah savitri sa yatra varunastadapo
    yatra va apastadvarunaste dve yonistadekam mithunam || 2|| kah savita ka savitri vayureva savitakashah
    savitri sa yatra vayustadakasho yatra va akashastadvayuste dve yonistadekam mithunam || 3|| kah savita
    ka savitri yajna eva savita chandamsi savitri sa yatra yajnastatra chandamsi yatra va chandamsi sa
    yajnaste dve yonistadekam mithunam || 4|| kah savita ka savitri stanayitrureva savita vidyutsavitri
    sa yatra stanayitrustadvidyut yatra va vidyuttatra stanayitruste dve yonistadekam mithunam || 5||
    kah savita ka savitri aditya eva savita dyauh savitri sa yatradityastaddyauryatra va dyaustadadityaste
    dve yonistadekam mithunam || 6|| kah savita ka savitri candra eva savita nakshatrani savitri sa yatra
    candrastannakshatrani yatra va nakshatrane sa candramaste dve yonistadekam mithunam || 7|| kah savita
    ka savitri mana eva savita vak savitri sa yatra va manastadvak yatra va vak tanmanaste dve yonistadekam
    mithunam || 8|| kah savita ka savitri purusha eva savita stri savitri sa yatra purushastatstri yatra
    va stri sa purushaste dve yonistadekam mithunam || 9|| savitryah padatrayam tasya eva
  devanagari: सावित्र्युपनिषत् सावित्र्युपनिषद्वेद्यचित्सावित्रपदोज्ज्वलम् । प्रतियोगिविनिर्मुक्तं रामचन्द्रपदं
    भजे ॥ सावित्र्यात्मा पाशुपतं परं ब्रह्मावधूतकम् । त्रिपुरातपनं देवीत्रिपुरा कठभावना ॥ ॐ आप्यायन्तु
    ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च । सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म
    निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेऽस्तु । तदात्मनि निरते य उपनिषत्सु धर्मास्ते
    मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ ॥ कः सविता का सावित्री अग्निरेव सविता
    पृथिवी सावित्री स यत्राग्निस्तत्पृथिवी यत्र वै पृथिवी तत्राग्निस्ते द्वे योनी तदेकं मिथुनम् ॥ १॥ कः
    सविता का सवित्री वरुण एव सवितापः सावित्री स यत्र वरुणस्तदापो यत्र वा आपस्तद्वरुणस्ते द्वे योनिस्तदेकं
    मिथुनम् ॥ २॥ कः सविता का सावित्री वायुरेव सविताकाशः सावित्री स यत्र वायुस्तदाकाशो यत्र वा आकाशस्तद्वायुस्ते
    द्वे योनिस्तदेकं मिथुनम् ॥ ३॥ कः सविता का सावित्री यज्ञ एव सविता छन्दांसि सावित्री स यत्र यज्ञस्तत्र
    छन्दांसि यत्र वा छन्दांसि स यज्ञस्ते द्वे योनिस्तदेकं मिथुनम् ॥ ४॥ कः सविता का सावित्री स्तनयित्रुरेव
    सविता विद्युत्सावित्री स यत्र स्तनयित्रुस्तद्विद्युत् यत्र वा विद्युत्तत्र स्तनयित्रुस्ते द्वे योनिस्तदेकं
    मिथुनम् ॥ ५॥ कः सविता का सावित्री आदित्य एव सविता द्यौः सावित्री स यत्रादित्यस्तद्द्यौर्यत्र वा द्यौस्तदादित्यस्ते
    द्वे योनिस्तदेकं मिथुनम् ॥ ६॥ कः सविता का सावित्री चन्द्र एव सविता नक्षत्राणि सावित्री स यत्र चन्द्रस्तन्नक्षत्राणि
    यत्र वा नक्षत्राणे स चन्द्रमास्ते द्वे योनिस्तदेकं मिथुनम् ॥ ७॥ कः सविता का सावित्री मन एव सविता वाक्
    सावित्री स यत्र वा मनस्तद्वाक् यत्र वा वाक् तन्मनस्ते द्वे योनिस्तदेकं मिथुनम् ॥ ८॥ कः सविता का सावित्री
    पुरुष एव सविता स्त्री सावित्री स यत्र पुरुषस्तत्स्त्री यत्र वा स्त्री स पुरुषस्ते द्वे योनिस्तदेकं
    मिथुनम् ॥ ९॥ सावित्र्याः पादत्रयम् तस्या एव
