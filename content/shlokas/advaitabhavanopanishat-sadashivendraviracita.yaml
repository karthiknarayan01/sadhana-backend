id: advaitabhavanopanishat-sadashivendraviracita
category: upanishad
name:
  english: advaitabhavanopanishat (sadashivendraviracita)
  devanagari: अद्वैतभावनोपनिषत् (सदाशिवेन्द्रविरचिता)
content:
  english: vedasakshinashcaham karmayogo'ham | dharmakarmo'ham | pita'ham | mata'ham | putro'ham | gururaham
    | acaryo'ham | agamo'ham | ramayano'ham | mahabhagavato'ham | mahabharato'ham | shribhagavato'ham
    | shrutishastranyaham | mantro'ham | mantrartho'ham | stavo'ham | kavaco'ham | aham sahasranamani
    | aham gayatri | bijanyaham | kutaksharo'ham | tryakshro'ham | pancashanmatrika'ham | pancabhutanyaham
    | pancamahabhutanyaham | tattvanyaham | sthulo'ham | sukshmo'ham | kulakulashca'ham | kulacalashca'ham
    | pramanadi shodashapadartho'ham | rishayashca'ham | munayashca'ham | lakshmiraham | striyo'ham |
    shriyo'ham | priyo'ham | gauryaham | bhuto'ham | kushmando'ham | preto'ham | lokapalashca'ham | grahashca'ham
    | diggajashca'ham | dashadisho'ham | urdhvo'ham | adho'ham | caturdashabhuvananyaham | tatstho'ham
    | tadasampradarccashraddhanantaram | tadaham samprakuryat | japenmantram vidhanena sankhyam kurvan
    vidhanatah | na dosho manase jape ityaha bhagavan shivah || iti sadashivapranitam advaitabhavam samaptam
    |
  devanagari: वेदसाक्षिणश्चाहम् कर्मयोगोऽहम् । धर्मकर्मोऽहम् । पिताऽहम् । माताऽहम् । पुत्रोऽहम् । गुरुरहम्
    । आचार्योऽहम् । आगमोऽहम् । रामायणोऽहम् । महाभागवतोऽहम् । महाभारतोऽहम् । श्रीभागवतोऽहम् । श्रुतिशास्त्राण्यहम्
    । मन्त्रोऽहम् । मन्त्रार्थोऽहम् । स्तवोऽहम् । कवचोऽहम् । अहं सहस्रनामानि । अहं गायत्री । बीजान्यहम्
    । कूटाक्षरोऽहम् । त्र्यक्ष्रोऽहम् । पञ्चाशन्मातृकाऽहम् । पञ्चभूतान्यहम् । पञ्चमहाभूतान्यहम् । तत्त्वान्यहम्
    । स्थूलोऽहम् । सूक्ष्मोऽहम् । कुलाकुलाश्चाऽहम् । कुलाचलश्चाऽहम् । प्रमाणादि षोडशपदार्थोऽहम् । ऋषयश्चाऽहम्
    । मुनयश्चाऽहम् । लक्ष्मीरहम् । स्त्रियोऽहम् । श्रियोऽहम् । प्रियोऽहम् । गौर्यहम् । भूतोऽहम् । कुष्माण्डोऽहम्
    । प्रेतोऽहम् । लोकपालाश्चाऽहम् । ग्रहाश्चाऽहम् । दिग्गजाश्चाऽहम् । दशदिशोऽहम् । ऊर्ध्वोऽहम् । अधोऽहम्
    । चतुर्दशभुवनान्यहम् । तत्स्थोऽहम् । तदसम्प्रदर्च्चाश्रद्धानन्तरम् । तदहं सम्प्रकुर्यात् । जपेन्मन्त्रं
    विधानेन सङ्ख्यां कुर्वन् विधानतः । न दोषो मानसे जापे इत्याह भगवान् शिवः ॥ इति सदाशिवप्रणीतं अद्वैतभावं
    समाप्तम् ।
meaning: {}
