id: balikritamvamanastotram
category: stotram
name:
  english: balikritamvamanastotram
  devanagari: बलिकृतंवामनस्तोत्रम्
content:
  english: balikritam vamanastotram baliruvaca | adya me saphalam janma adya me saphalo makhah | jivitam
    saphalam me'dya kritartho'smi na samshayah || 109|| amoghamritavrishtirme samayatatidurlabha | tvadagamanamatrena
    hyanayaso mahotsavah || 110|| ete ca rishayah sarve kritartha natra samshayah | yaih purvam hi tapastaptam
    tadadya saphalam prabho || 111|| kritartho'smi kritartho'smi kritartho'smi na samshayah | tasmattubhyam
    namastubhyam namastubhyam namo namah || 112|| tvadajnaya tvanniyogam sadhayamiti manmanah | atyutsahasamayuktam
    samajnapaya mam prabho || 113|| iti naradapurane purvabhage ekadashadhyayantargatam balikritam vamanastotram
    samaptam | brihannaradiyapurana | purvabhaga | adhyaya 10|| 11
  devanagari: बलिकृतं वामनस्तोत्रम् बलिरुवाच । अद्य मे सफलं जन्म अद्य मे सफलो मखः । जीवितं सफलं मेऽद्य
    कृतार्थोऽस्मि न संशयः ॥ १०९॥ अमोघामृतवृष्टिर्मे समायातातिदुर्लभा । त्वदागमनमात्रेण ह्यनायासो महोत्सवः
    ॥ ११०॥ एते च ऋषयः सर्वे कृतार्था नात्र संशयः । यैः पूर्वं हि तपस्तप्तं तदद्य सफलं प्रभो ॥ १११॥ कृतार्थोऽस्मि
    कृतार्थोऽस्मि कृतार्थोऽस्मि न संशयः । तस्मात्तुभ्यं नमस्तुभ्यं नमस्तुभ्यं नमो नमः ॥ ११२॥ त्वदाज्ञया
    त्वन्नियोगं साधयामीति मन्मनः । अत्युत्साहसमायुक्तं समाज्ञापय मां प्रभो ॥ ११३॥ इति नारदपुराणे पूर्वभागे
    एकादशाध्यायान्तर्गतं बलिकृतं वामनस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय १०॥ ११
