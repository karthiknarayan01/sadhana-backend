id: narayaniyam-dashaka-81
category: stotram
name:
  english: Narayaniyam Dashaka 81
content:
  english: snigdham mugdham satatamapi tam lalayan satyabhamam yato bhuyah saha khalu taya yajnasenivivaham
    | parthaprityai punarapi managasthito hastipuryam sashakraprastham puramapi vibho samvidhayagato'bhuh
    || || bhadram bhadram bhavadavarajam kauravenarthyamanam tvadvaca tamahrita kuhanamaskari shakrasunuh
    | tatra kruddham balamanunayan pratyagastena sardham shakraprastham priyasakhamude satyabhamasahayah
    || || tatra kridannapi ca yamunakuladrishtam grihitva tam kalindim nagaramagamah khandavaprinitagnih
    | bhratritrastam pranayavivasham deva paitrishvaseyim rajnam madhye sapadi jahrishe mitravindamavantim
    || || satyam gatva punarudavaho nagnajinnandanam tam badhva saptapi ca vrishavaran saptamurtirnimeshat
    | bhadram nama pradaduratha te deva santardanadya statsodarya varada bhavatah sa'pi paitrishvaseyi
    || || parthadyairapyakritalavanam toyamatrabhilakshyam laksham chitva shapharamavritha lakshmanam
    madrakanyam | ashtavevam tava samabhavan vallabhastatra madhye shushrotha tvam surapatigira bhaumadushceshtitani
    || || smritayatam pakshipravaramadhirudhastvamagamo vahannanke bhamamupavanamivaratibhavanam | vibhindan
    durgani trutitapritanashonitarasaih puram tavat pragjyotishamakuruthah shonitapuram || || murastvam
    pancasyo jaladhivanamadhyadudapatat sa cakre cakrena pradalitashira mankshu bhavata | caturdantairdantavalapatibhirindhanasamaram
    rathangena chitva narakamakarostirnanarakam || || stuto bhumya rajyam sapadi bhagadatte'sya tanaye
    gajancaikam datva prajighayitha nagannijapurim | khalenabaddhanam svagatamanasam shodasha punah sahasrani
    strinamapi ca dhanarashim ca vipulam || || bhaumapahritakundalam tadaditerdatum prayato divam shakradyairmahitah
    samam dayitaya dyustrishu dattahriya | hritva kalpatarum rushabhipatitam jitvendramabhyagama stattu
    shrimadadosha idrisha iti vyakhyatumevakrithah || || kalpadrum satyabhamabhavanabhuvi srijan dvyashtasahasrayoshah
    svikritya pratyagaram vihitabahuvapurlalayan kelibhedaih | ashcaryannaradalokitavividhagatistatra
    tatrapi gehe bhuyah sarvasu kurvan dasha dasha tanayan pahi vatalayesha ||
  devanagari: स्निग्धां मुग्धां सततमपि तां लालयन् सत्यभामां यातो भूयः सह खलु तया याज्ञसेनीविवाहम् । पार्थप्रीत्यै
    पुनरपि मनागास्थितो हस्तिपुर्यां सशक्रप्रस्थं पुरमपि विभो संविधायागतोऽभूः ॥ ॥ भद्रां भद्रां भवदवरजां
    कौरवेणार्थ्यमानां त्वद्वाचा तामहृत कुहनामस्करी शक्रसूनुः । तत्र क्रुद्धं बलमनुनयन् प्रत्यगास्तेन सार्धं
    शक्रप्रस्थं प्रियसखमुदे सत्यभामासहायः ॥ ॥ तत्र क्रीडन्नपि च यमुनाकूलदृष्टां गृहीत्वा तां कालिन्दीं
    नगरमगमः खाण्डवप्रीणिताग्निः । भ्रातृत्रस्तां प्रणयविवशां देव पैतृष्वसेयीं राज्ञां मध्ये सपदि जहृषे
    मित्रविन्दामवन्तीम् ॥ ॥ सत्यां गत्वा पुनरुदवहो नग्नजिन्नन्दनां तां बध्वा सप्तापि च वृषवरान् सप्तमूर्तिर्निमेषात्
    । भद्रां नाम प्रददुरथ ते देव सन्तर्दनाद्या स्तत्सोदर्या वरद भवतः साऽपि पैतृष्वसेयी ॥ ॥ पार्थाद्यैरप्यकृतलवनं
    तोयमात्राभिलक्ष्यं लक्षं छित्वा शफरमवृथा लक्ष्मणां मद्रकन्याम् । अष्टावेवं तव समभवन् वल्लभास्तत्र
    मध्ये शुश्रोथ त्वं सुरपतिगिरा भौमदुश्चेष्टितानि ॥ ॥ स्मृतायातं पक्षिप्रवरमधिरूढस्त्वमगमो वहन्नङ्के
    भामामुपवनमिवारातिभवनम् । विभिन्दन् दुर्गाणि त्रुटितपृतनाशोणितरसैः पुरं तावत् प्राग्ज्योतिषमकुरुथाः
    शोणितपुरम् ॥ ॥ मुरस्त्वां पञ्चास्यो जलधिवनमध्यादुदपतत् स चक्रे चक्रेण प्रदलितशिरा मङ्क्षु भवता । चतुर्दन्तैर्दन्तावलपतिभिरिन्धानसमरं
    रथाङ्गेन छित्वा नरकमकरोस्तीर्णनरकम् ॥ ॥ स्तुतो भूम्या राज्यं सपदि भगदत्तेऽस्य तनये गजञ्चैकं दत्वा
    प्रजिघयिथ नागान्निजपुरीम् । खलेनाबद्धानां स्वगतमनसां षोडश पुनः सहस्राणि स्त्रीणामपि च धनराशिं च विपुलम्
    ॥ ॥ भौमापाहृतकुण्डलं तददितेर्दातुं प्रयातो दिवं शक्राद्यैर्महितः समं दयितया द्युस्त्रीषु दत्तह्रिया
    । हृत्वा कल्पतरुं रुषाभिपतितं जित्वेन्द्रमभ्यागम स्तत्तु श्रीमददोष ईदृश इति व्याख्यातुमेवाकृथाः ॥
    ॥ कल्पद्रुं सत्यभामाभवनभुवि सृजन् द्व्यष्टसाहस्रयोषाः स्वीकृत्य प्रत्यगारं विहितबहुवपुर्लालयन् केलिभेदैः
    । आश्चर्यान्नारदालोकितविविधगतिस्तत्र तत्रापि गेहे भूयः सर्वासु कुर्वन् दश दश तनयान् पाहि वातालयेश
    ॥
