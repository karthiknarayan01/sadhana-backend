id: dakshinamurtisahasranamastotra-2
category: sahasranama
name:
  english: dakshinamurtisahasranamastotra 2
  devanagari: दक्षिणामूर्तिसहस्रनामस्तोत्र २
content:
  english: nah | subrahmanyo jagatsvami lohitakshah shivottamah || 85|| nakshatramalyabharano bhagavan
    tamasah parah | vidhikarta vidhanajnah pradhanapurusheshvarah || 86|| cintamanih suragururdhyeyo nirajanapriyah
    | govindo rajarajesho bahupushparcanapriyah || 87|| sarvanando dayarupi shailajasumanoharah | suvikramah
    sarvagato hetusadhanavarjitah || 88|| vrishanko ramaniyangah satkarta samaparagah | cintashokaprashamanah
    sarvavidyavisharadah || 89|| bhaktavijnaptisandhata vakta girivarakritih | jnanaprado manovasah kshemyo
    mohavinashanah || 90|| surottamashcitrabhanuh sada vaibhavatatparah | suhridagresarah siddho jnanamudro
    ganadhipah || 91|| amarashcarmavasano vanchitarthaphalapradah | asamano'ntarahito devasimhasanadhipah
    || 92|| vivadahanta sarvatma kalah kalavivarjitah | vishvatito vishvakarta vishvesho vishvakaranah
    || 93|| yogidhyeyo yoganishtho yogatma yogavittamah | onkararupo bhagavan bindunadamayah shivah ||
    94|| caturmukhadisamstutyashcaturvargaphalapradah | sahayacalaguhavasi sakshanmoksharasakritih ||
    95|| dakshadhvarasamucchetta pakshapatavivarjitah | onkaravacakah shambhuh shankarah shashishitalah
    || 96|| pankajasanasamsevyah kinkaramaravatsalah | natadaurbhagyatulagnih kritakautukavibhramah ||
    97|| trilokamohanah shriman tripundrankitamastakah | krauncarijanakah shrimadgananathasutanvitah ||
    98|| adbhuto'nantavarado'paricchedyatmavaibhavah | ishtamurtapriyah sharva ekavirapriyamvadah || 99||
    uhapohavinirmukta onkareshvarapujitah | kalanidhih kirtinathah kameshihridayangamah || 100|| kameshvarah
    kamarupo gananathasahodarah | gadho gaganagambhiro gopalo gocaro guruh || 101|| ganesho gayako gopta
    ganapatyaganapriyah | ghantaninadarucirah karnalajjavibhanjanah || 102|| keshavah kevalah kantashcakrapanishcaracarah
    | ghanaghano ghoshayuktashcandihridayanandanah || 103|| citrarpitashcitramayah cintitarthapradayakah
    | chadmacari chadmagatih cidabhasashcidatmakah || 104|| chandomayashchatrapatih chandahshastravisharadah
    | jivano jivanadharo jyotihshastravisharadah || 105|| jyotirjyotsnamayo jeta jimutavaradayakah | janaghanashano
    jivo jivado jivanaushadham || 106|| jaraharo jadyaharo jyotsnajalapravartakah | jnaneshvaro jnanagamyo
    jnanamargaparayanah || 107|| tarusthastarumadhyastho damarishaktiranjakah | tarakastaratamyatma tipastarpanakarakah
    || 108|| tusharacalamadhyasthastusharakarabhushanah | trisugandhastrimurtishca trimukhastrikakuddharah
    || 109|| trilokimudrikabhushah trikalajnastrayimayah | tattvarupastarusthayi tantrivadanatatparah
    || 110|| adbhutanantasangramo dhakkavadanatatparah
  devanagari: नः । सुब्रह्मण्यो जगत्स्वामी लोहिताक्षः शिवोत्तमः ॥ ८५॥ नक्षत्रमाल्याभरणो भगवान् तमसः परः
    । विधिकर्ता विधानज्ञः प्रधानपुरुषेश्वरः ॥ ८६॥ चिन्तामणिः सुरगुरुर्ध्येयो नीराजनप्रियः । गोविन्दो राजराजेशो
    बहुपुष्पार्चनप्रियः ॥ ८७॥ सर्वानन्दो दयारूपी शैलजासुमनोहरः । सुविक्रमः सर्वगतो हेतुसाधनवर्जितः ॥ ८८॥
    वृषाङ्को रमणीयाङ्गः सत्कर्ता सामपारगः । चिन्ताशोकप्रशमनः सर्वविद्याविशारदः ॥ ८९॥ भक्तविज्ञप्तिसन्धाता
    वक्ता गिरिवराकृतिः । ज्ञानप्रदो मनोवासः क्षेम्यो मोहविनाशनः ॥ ९०॥ सुरोत्तमश्चित्रभानुः सदा वैभवतत्परः
    । सुहृदग्रेसरः सिद्धो ज्ञानमुद्रो गणाधिपः ॥ ९१॥ अमरश्चर्मवसनो वाञ्छितार्थफलप्रदः । असमानोऽन्तरहितो
    देवसिंहासनाधिपः ॥ ९२॥ विवादहन्ता सर्वात्मा कालः कालविवर्जितः । विश्वातीतो विश्वकर्ता विश्वेशो विश्वकारणः
    ॥ ९३॥ योगिध्येयो योगनिष्ठो योगात्मा योगवित्तमः । ओङ्काररूपो भगवान् बिन्दुनादमयः शिवः ॥ ९४॥ चतुर्मुखादिसंस्तुत्यश्चतुर्वर्गफलप्रदः
    । सहयाचलगुहावासी साक्षान्मोक्षरसाकृतिः ॥ ९५॥ दक्षाध्वरसमुच्छेत्ता पक्षपातविवर्जितः । ओङ्कारवाचकः शम्भुः
    शङ्करः शशिशीतलः ॥ ९६॥ पङ्कजासनसंसेव्यः किङ्करामरवत्सलः । नतदौर्भाग्यतूलाग्निः कृतकौतुकविभ्रमः ॥ ९७॥
    त्रिलोकमोहनः श्रीमान् त्रिपुण्ड्राङ्कितमस्तकः । क्रौञ्चरिजनकः श्रीमद्गणनाथसुतान्वितः ॥ ९८॥ अद्भुतोऽनन्तवरदोऽपरिच्छेद्यात्मवैभवः
    । इष्टामूर्तप्रियः शर्व एकवीरप्रियंवदः ॥ ९९॥ ऊहापोहविनिर्मुक्त ओङ्कारेश्वरपूजितः । कलानिधिः कीर्तिनाथः
    कामेशीहृदयङ्गमः ॥ १००॥ कामेश्वरः कामरूपो गणनाथसहोदरः । गाढो गगनगम्भीरो गोपालो गोचरो गुरुः ॥ १०१॥ गणेशो
    गायको गोप्ता गाणापत्यगणप्रियः । घण्टानिनादरुचिरः कर्णलज्जाविभञ्जनः ॥ १०२॥ केशवः केवलः कान्तश्चक्रपाणिश्चराचरः
    । घनाघनो घोषयुक्तश्चण्डीहृदयनन्दनः ॥ १०३॥ चित्रार्पितश्चित्रमयः चिन्तितार्थप्रदायकः । छद्मचारी छद्मगतिः
    चिदाभासश्चिदात्मकः ॥ १०४॥ छन्दोमयश्छत्रपतिः छन्दःशास्त्रविशारदः । जीवनो जीवनाधारो ज्योतिःशास्त्रविशारदः
    ॥ १०५॥ ज्योतिर्ज्योत्स्नामयो जेता जीमूतवरदायकः । जनाघनाशनो जीवो जीवदो जीवनौषधम् ॥ १०६॥ जराहरो जाड्यहरो
    ज्योत्स्नाजालप्रवर्तकः । ज्ञानेश्वरो ज्ञानगम्यो ज्ञानमार्गपरायणः ॥ १०७॥ तरुस्थस्तरुमध्यस्थो डामरीशक्तिरञ्जकः
    । तारकस्तारतम्यात्मा टीपस्तर्पणकारकः ॥ १०८॥ तुषाराचलमध्यस्थस्तुषारकरभूषणः । त्रिसुगन्धस्त्रिमूर्तिश्च
    त्रिमुखस्त्रिककुद्धरः ॥ १०९॥ त्रिलोकीमुद्रिकाभूषः त्रिकालज्ञस्त्रयीमयः । तत्त्वरूपस्तरुस्थायी तन्त्रीवादनतत्परः
    ॥ ११०॥ अद्भुतानन्तसङ्ग्रामो ढक्कावादनतत्परः
