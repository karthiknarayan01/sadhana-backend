id: annamayya-keerthanas-ksheerabdi-kanyakaku
category: stotram
name:
  english: Annamayya Keerthanas Ksheerabdi Kanyakaku
content:
  english: adi pallavi kshirabdhi kanyakaku shri mahalakshmikini nirajalayamunaku nirajanam || jalajakshi
    momunaku jakkava kucambulaku nèlakònna kappurapu nirajanam | aliveni turumunaku hastakamalambulaku
    niluvumanikyamula nirajanam || kshirabdhi kanyakaku shri mahalakshmikini nirajalayamunaku nirajanam
    || carana kisalayamulaku sakiyarambhorulaku niratamagu muttela nirajanam | aridi jaghanambunaku ativanijanabhikini
    nirati nanavarna nirajanam || caranam pagatu shrivenkateshu pattapuraniyai nègadu satikalalakunu nirajanam
    | jagati nalamelmanga cakkadanamulakèlla nigudu nija shobhanapu nirajanam || kshirabdhi kanyakaku
    shri mahalakshmikini nirajalayamunaku nirajanam ||
  devanagari: आदि पल्लवि क्षीराब्धि कन्यककु श्री महालक्ष्मिकिनि नीरजालयमुनकु नीराजनं ॥ जलजाक्षि मोमुनकु
    जक्कव कुचम्बुलकु नॆलकॊन्न कप्पुरपु नीराजनं । अलिवेणि तुरुमुनकु हस्तकमलम्बुलकु निलुवुमाणिक्यमुल नीराजनं
    ॥ क्षीराब्धि कन्यककु श्री महालक्ष्मिकिनि नीरजालयमुनकु नीराजनं ॥ चरण किसलयमुलकु सकियरम्भोरुलकु निरतमगु
    मुत्तेल नीराजनं । अरिदि जघनम्बुनकु अतिवनिजनाभिकिनि निरति नानावर्ण नीराजनं ॥ चरणं पगटु श्रीवेङ्कटेशु
    पट्टपुराणियै नॆगडु सतिकललकुनु नीराजनं । जगति नलमेल्मङ्ग चक्कदनमुलकॆल्ल निगुडु निज शोभनपु नीराजनं ॥
    क्षीराब्धि कन्यककु श्री महालक्ष्मिकिनि नीरजालयमुनकु नीराजनं ॥
