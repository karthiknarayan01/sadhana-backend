id: k-ityapaharanabagalamukhisukta
category: sukta
name:
  english: kṟityapaharanabagalamukhisukta
  devanagari: क्ऱित्यापहरणबगलामुखीसूक्त
content:
  english: 12 pathyabrihati || yam tḙ ca̱krura̱me patre̱ yam ca̱krurmi̱shradha̭nye | a̱me ma̱mse kri̱tyam
    yam ca̱kruh puna̱h prati̭ harami̱ tam || 1|| yam tḙ ca̱kruh kri̭ka̱vaka̭va̱je va̱ yam kṷri̱rini̭
    | avya̭m tḙ krityam yam ca̱kruh puna̱h prati̭ harami̱ tam || 2|| yam tḙ ca̱krureka̭shaphe pashu̱namubha̱yada̭ti
    | ga̱rda̱bhe kri̱tyam yam ca̱kruh puna̱h prati̭ harami̱ tam || 3|| yam tḙ ca̱krura̭mu̱laya̭m vala̱gam
    va̭ nara̱cyam | kshetrḙ tḙ kri̱tyam yam ca̱kruh puna̱h prati̭ harami̱ tam || 4|| yam tḙ ca̱krurgarha̭patye
    purva̱gnavu̱ta du̱shcita̭h | shala̭yam kri̱tyam yam ca̱kruh puna̱h prati̭ harami̱ tam || 5|| yam tḙ
    ca̱kruh sa̱bhaya̱m yam ca̱krura̭dhi̱deva̭ne | a̱ksheshṷ kri̱tyam yam ca̱kruh puna̱h prati̭ harami̱
    tam || 6|| yam tḙ ca̱kruh sena̭ya̱m yam ca̱kruri̭shvayu̱dhe | du̱ndu̱bhau kri̱tyam yam ca̱kruh puna̱h
    prati̭ harami̱ tam || 7|| yam tḙ kri̱tyam kupḙ'vada̱dhuh shma̭sha̱ne va̭ nica̱khnuh | sadma̭ni kri̱tyam
    yam ca̱kruh puna̱h prati̭ harami̱ tam || 8|| yam tḙ ca̱kruh pṷrusha̱sthe a̱gnau sanka̭suke ca̱ yam
    | mro̱kam ni̭rda̱ham kra̱vyada̱m puna̱h prati̭ harami̱ tam || 9|| apa̭the̱na ja̭bharaina̱m tam pa̱thetah
    pra hi̭nmasi | adhi̭ro marya̱dhirḙbhya̱h sam ja̭bha̱raci̭ttya || 10|| yashca̱kara̱ na sha̱shaka̱
    kartṷm sha̱shre pada̭ma̱nguri̭m | ca̱kara̭ bha̱drama̱smabhya̭mabha̱go bhaga̭vadbhyah || 11|| kri̱tya̱krita̭m
    vala̱gina̭m mu̱lina̭m shapathe̱yyam | indra̱stam ha̭ntu maha̱ta va̱dhena̱gnirvi̭dhyatva̱staya̭ ||
    12|| iti dvadashah prapathakah || iti pancamam kandam || svararahitam krityapariharanasuktam bagalamukhisuktam
    yam te cakrurame patre yam cakrurmishradhanye | ame mamse krityam yam cakruh punah prati harami tam
    || 1|| yam te cakruh krikavakavaje va yam kuririni | avyam te krityam yam cakruh punah prati harami
    tam || 2|| yam te cakrurekashaphe pashunamubhayadati | gardabhe krityam yam cakruh punah prati harami
    tam || 3|| yam te cakruramulayam valagam va naracyam | kshetre te krityam yam cakruh punah prati harami
    tam || 4|| yam te cakrurgarhapatye purvagnavuta dushcitah | shalayam krityam yam cakruh punah prati
    harami tam || 5|| yam te cakruh sabhayam yam cakruradhidevane | aksheshu krityam yam cakruh punah
    prati harami tam || 6|| yam te cakruh senayam yam cakrurishvayudhe | dundubhau krityam yam cakruh
    punah prati harami tam || 7|| yam te krityam kupe'vadadhuh shmashane va nicakhnuh | sadmani krityam
    yam cakruh punah prati harami tam || 8|| yam te cakruh purushasthe agnau sankasuke ca yam | mrokam
    nirdaham kravyadam punah prati harami tam || 9|| apathena jabharainam tam pathetah pra hinmasi | adhiro
    maryadhirebhyah sam jabharacittya || 10|| yashcakara na shashaka kartum shashre padamangurim | cakara
    bhadramasmabhyamabhago bhagavadbhyah || 11|| krityakritam valaginam mulinam shapatheyyam | indrastam
    hantu mahata vadhenagnirvidhyatvastaya || 12|| iti dvadashah prapathakah || iti pancamam kandam ||
    iti krityapariharanasuktam bagalamukhisuktam |
  devanagari: १२ पथ्याबृहती ॥ यां ते॑ च॒क्रुरा॒मे पात्रे॒ यां च॒क्रुर्मि॒श्रधा॑न्ये । आ॒मे मां॒से कृ॒त्यां
    यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ १॥ यां ते॑ च॒क्रुः कृ॑क॒वाका॑व॒जे वा॒ यां कु॑री॒रिणि॑ । अव्यां॑
    ते॑ कृत्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ २॥ यां ते॑ च॒क्रुरेक॑शफे पशू॒नामुभ॒याद॑ति । ग॒र्द॒भे
    कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ ३॥ यां ते॑ च॒क्रुर॑मू॒लायां॑ वल॒गं वा॑ नरा॒च्याम्
    । क्षेत्रे॑ ते॑ कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ ४॥ यां ते॑ च॒क्रुर्गार्ह॑पत्ये पूर्वा॒ग्नावु॒त
    दु॒श्चितः॑ । शाला॑यां कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ ५॥ यां ते॑ च॒क्रुः स॒भायां॒
    यां च॒क्रुर॑धि॒देव॑ने । अ॒क्षेषु॑ कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ ६॥ यां ते॑ च॒क्रुः
    सेना॑यां॒ यां च॒क्रुरि॑ष्वायु॒धे । दु॒न्दु॒भौ कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒ ताम् ॥ ७॥ यां
    ते॑ कृ॒त्यां कूपे॑ऽवद॒धुः श्म॑शा॒ने वा॑ निच॒ख्नुः । सद्म॑नि कृ॒त्यां यां च॒क्रुः पुनः॒ प्रति॑ हरामि॒
    ताम् ॥ ८॥ यां ते॑ च॒क्रुः पु॑रुषा॒स्थे अ॒ग्नौ सङ्क॑सुके च॒ याम् । म्रो॒कं नि॑र्दा॒हं क्र॒व्यादं॒ पुनः॒
    प्रति॑ हरामि॒ ताम् ॥ ९॥ अप॑थे॒ना ज॑भारैणां॒ तां प॒थेतः प्र हि॑ण्मसि । अधी॑रो मर्या॒धीरे॑भ्यः॒ सं ज॑भा॒राचि॑त्त्या
    ॥ १०॥ यश्च॒कार॒ न श॒शाक॒ कर्तुं॑ श॒श्रे पाद॑म॒ङ्गुरि॑म् । च॒कार॑ भ॒द्रम॒स्मभ्य॑मभ॒गो भग॑वद्भ्यः ॥
    ११॥ कृ॒त्या॒कृतं॑ वल॒गिनं॑ मू॒लिनं॑ शपथे॒य्यम् । इन्द्र॒स्तं ह॑न्तु मह॒ता व॒धेना॒ग्निर्वि॑ध्यत्व॒स्तया॑
    ॥ १२॥ इति द्वादशः प्रपाठकः ॥ इति पञ्चमं काण्डम् ॥ स्वररहितं कृत्यापरिहरणसूक्तं बगलामुखीसूक्तम् यां
    ते चक्रुरामे पात्रे यां चक्रुर्मिश्रधान्ये । आमे मांसे कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥
    १॥ यां ते चक्रुः कृकवाकावजे वा यां कुरीरिणि । अव्यां ते कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥
    २॥ यां ते चक्रुरेकशफे पशूनामुभयादति । गर्दभे कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ३॥ यां ते
    चक्रुरमूलायां वलगं वा नराच्याम् । क्षेत्रे ते कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ४॥ यां ते
    चक्रुर्गार्हपत्ये पूर्वाग्नावुत दुश्चितः । शालायां कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ५॥ यां
    ते चक्रुः सभायां यां चक्रुरधिदेवने । अक्षेषु कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ६॥ यां ते
    चक्रुः सेनायां यां चक्रुरिष्वायुधे । दुन्दुभौ कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ७॥ यां ते
    कृत्यां कूपेऽवदधुः श्मशाने वा निचख्नुः । सद्मनि कृत्यां यां चक्रुः पुनः प्रति हरामि ताम् ॥ ८॥ यां
    ते चक्रुः पुरुषास्थे अग्नौ सङ्कसुके च याम् । म्रोकं निर्दाहं क्रव्यादं पुनः प्रति हरामि ताम् ॥ ९॥
    अपथेना जभारैणां तां पथेतः प्र हिण्मसि । अधीरो मर्याधीरेभ्यः सं जभाराचित्त्या ॥ १०॥ यश्चकार न शशाक
    कर्तुं शश्रे पादमङ्गुरिम् । चकार भद्रमस्मभ्यमभगो भगवद्भ्यः ॥ ११॥ कृत्याकृतं वलगिनं मूलिनं शपथेय्यम्
    । इन्द्रस्तं हन्तु महता वधेनाग्निर्विध्यत्वस्तया ॥ १२॥ इति द्वादशः प्रपाठकः ॥ इति पञ्चमं काण्डम् ॥
    इति कृत्यापरिहरणसूक्तं बगलामुखीसूक्तम् ।
