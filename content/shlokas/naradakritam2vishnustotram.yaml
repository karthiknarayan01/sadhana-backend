id: naradakritam2vishnustotram
category: stotram
name:
  english: naradakritam2vishnustotram
  devanagari: नारदकृतं२विष्णुस्तोत्रम्
content:
  english: 30|| kandarpalavanyavilasasundarah prasannagambhiragirendirotsavah | svamashritanam varakalpapadapah
    prasidatam dinadayardramanasah || 31|| yadanghripadmarcananirmalantara jnanasina shatitabandhahetavah
    | vidanti yadbrahmasukham gataklamah prasidatam dinadayardramanasah || 32|| samsaravarannidhibaddhaseturyah
    srishtipalantavidhanahetuh | upantanama gunalabdhamurtih prasidatam brahmasukhanubhutih || 33|| ya
    indriyadhishthitabhutasukshmadvikasaheturdyutimadvarishthah | jivatmatam gacchati mayaya svaya sa
    eka isho bhagavanprasidatam || 34|| svadriggunairyena vilipyate mahangunashrayam yena ca pancabhautikam
    | eko'pi nanagunasamprayuktah prasidatam dinadayaluvaryah || 35|| yasyanuvartino deva vipadam padamambudhim
    | kritva vatsapadam svarge niratanka vasanti hi || 36|| namaste vasudevaya namah sankarshanaya ca
    | pradyumnayaniruddhaya sarvabhutatmane namah || 37|| adya me jivitam dhanyamadya me saphalam tapah
    | adya me saphalam jnanam darshanatte janardana || 38|| iti shriskandapurane vaishnavakhande badarikashramamahatmye
    tritiyadhyayantargatam naradakritam vishnustotram samaptam | skandapurana | vaishnavakhanda | badarikakhanda
    | adhyaya 3
  devanagari: ३०॥ कन्दर्पलावण्यविलाससुन्दरः प्रसन्नगम्भीरगिरेन्दिरोत्सवः । स्वमाश्रितानां वरकल्पपादपः
    प्रसीदतां दीनदयार्द्रमानसः ॥ ३१॥ यदङ्घ्रिपद्मार्चननिर्मलान्तरा ज्ञानासिना शातितबन्धहेतवः । विदन्ति
    यद्ब्रह्मसुखं गतक्लमाः प्रसीदतां दीनदयार्द्रमानसः ॥ ३२॥ संसारवारान्निधिबद्धसेतुर्यः सृष्टिपालान्तविधानहेतुः
    । उपान्तनामा गुणलब्धमूर्तिः प्रसीदतां ब्रह्मसुखानुभूतिः ॥ ३३॥ य इन्द्रियाधिष्ठितभूतसूक्ष्माद्विकासहेतुर्द्युतिमद्वरिष्ठः
    । जीवात्मतां गच्छति मायया स्वया स एक ईशो भगवान्प्रसीदताम् ॥ ३४॥ स्वदृग्गुणैर्येन विलिप्यते महान्गुणाश्रयं
    येन च पाञ्चभौतिकम् । एकोऽपि नानागुणसम्प्रयुक्तः प्रसीदतां दीनदयालुवर्यः ॥ ३५॥ यस्यानुवर्तिनो देवा
    विपदां पदमम्बुधिम् । कृत्वा वत्सपदं स्वर्गे निरातङ्का वसन्ति हि ॥ ३६॥ नमस्ते वासुदेवाय नमः सङ्कर्षणाय
    च । प्रद्युम्नायानिरुद्धाय सर्वभूतात्मने नमः ॥ ३७॥ अद्य मे जीवितं धन्यमद्य मे सफलं तपः । अद्य मे सफलं
    ज्ञानं दर्शनात्ते जनार्दन ॥ ३८॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे बदरिकाश्रममाहात्म्ये तृतीयाध्यायान्तर्गतं
    नारदकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । बदरिकाखण्ड । अध्याय ३
