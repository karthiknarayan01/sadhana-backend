id: vishnustutimarkandeyoktamnp
category: stotram
name:
  english: vishnustutimarkandeyoktamnP
  devanagari: विष्णुस्तुतिमार्कण्डेयोक्तम्ण्P
content:
  english: naram nrisimham naranathamacyutam pralambabahum kamalayatekshanam | kshitishvarairarcitapadapankajam
    namami vishnum purusham puratanam || 1|| jagatpatim kshirasamudramandiram tam sharngapanim munivrindavanditam
    | shriyah patim shridharamishamishvaram namami govindamanantavarcasam || 2|| ajam varenyam janaduhkhanashanam
    gurum puranam purushottamam prabhum | sahasrasuryadyutimantamacyutam namami bhaktya harimadyamadhavam
    || 3|| puraskritam punyavatam param gatim kshitishvaram lokapatim prajapatim | param paranamapi karanam
    harim namami lokatrayakarmasakshinam || 4|| bhoge tvanantasya payodadhau surah pura hi shete bhagavananadikrit
    | kshirodavicikanikambunokshitam tam shrinivasam pranato'smi keshavam || 5|| yo narasimham vapurasthito
    mahan suro murarirmadhukaitabhantakrit | samastalokartiharam hiranyakam namami vishnum satatam namami
    tam || 6|| anantamavyaktamatindriyam vibhum sve sve hi rupe svayameva samsthitam | yogeshvaraireva
    sada namaskritam namami bhaktya satatam janardanam || 7|| anandamekam virajam vidatmakam vrindalayam
    yogibhireva pujitam | anoraniyamsamavriddhimakshayam namami bhaktapriyamishvaram harim || 8|| iti
    | adhyaya 10 shloka 8
  devanagari: नरं नृसिंहं नरनाथमच्युतं प्रलम्बबाहुं कमलायतेक्षणम् । क्षितीश्वरैरर्चितपादपङ्कजं नमामि विष्णुं
    पुरुषं पुरातनम् ॥ १॥ जगत्पतिं क्षीरसमुद्रमन्दिरं तं शार्ङ्गपाणिं मुनिवृन्दवन्दितम् । श्रियः पतिं श्रीधरमीशमीश्वरं
    नमामि गोविन्दमनन्तवर्चसम् ॥ २॥ अजं वरेण्यं जनदुःखनाशनं गुरुं पुराणं पुरुषोत्तमं प्रभुम् । सहस्रसूर्यद्युतिमन्तमच्युतं
    नमामि भक्त्या हरिमाद्यमाधवम् ॥ ३॥ पुरस्कृतं पुण्यवतां परां गतिं क्षितीश्वरं लोकपतिं प्रजापतिम् । परं
    पराणामपि कारणं हरिं नमामि लोकत्रयकर्मसाक्षिणम् ॥ ४॥ भोगे त्वनन्तस्य पयोदधौ सुरः पुरा हि शेते भगवाननादिकृत्
    । क्षीरोदवीचीकणिकाम्बुनोक्षितं तं श्रीनिवासं प्रणतोऽस्मि केशवम् ॥ ५॥ यो नारसिंहं वपुरास्थितो महान्
    सुरो मुरारिर्मधुकैटभान्तकृत् । समस्तलोकार्तिहरं हिरण्यकं नमामि विष्णुं सततं नमामि तम् ॥ ६॥ अनन्तमव्यक्तमतीन्द्रियं
    विभुं स्वे स्वे हि रूपे स्वयमेव संस्थितम् । योगेश्वरैरेव सदा नमस्कृतं नमामि भक्त्या सततं जनार्दनम्
    ॥ ७॥ आनन्दमेकं विरजं विदात्मकं वृन्दालयं योगिभिरेव पूजितम् । अणोरणीयांसमवृद्धिमक्षयं नमामि भक्तप्रियमीश्वरं
    हरिम् ॥ ८॥ इति । अध्याय १० श्लोक ८
