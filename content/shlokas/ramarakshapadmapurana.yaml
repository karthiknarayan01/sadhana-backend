id: ramarakshapadmapurana
category: stotram
name:
  english: ramarakshapadmapurana
  devanagari: रामरक्षापद्मपुराण
content:
  english: rinvanti narashreshthah te punyah punyarupinah || om ramarakshastotrasya shrimaharshirvishvamitrarishih
    | shriramo devata | anushtupchandah | shrivishnuprityarthe jape viniyogah || atasi pushpasankasham
    pitavasa samacyutam | dhyatva vai pundarikaksham shriramam vishnumavyayam || 1|| patuvo hridayam ramah
    shrikanthah kanthameva ca | nabhim patu makhatrata katim me vishvarakshakah || 2|| karau patu dasharathih
    padau me vishvarupadhrik | cakshushi patu vai deva sitapatiranuttamah || 3|| shikham me patu vishvatma
    karnau me patu kamadah | parshvayostu suratrata kalakoti durasadah || 4|| anantah sarvada patu shariram
    vishvanayakah | jihvam me patu papaghno lokashikshapravarttakah || 5|| raghavah patu me dantan keshan
    rakshatu keshavah | sakthini patu me dattavijayonama vishvasrik || 6|| etam ramabalopetam raksham
    yo vai puman pathet | sacirayuh sukhi vidvan labhate divyasampadam || 7|| raksham karoti bhutebhyah
    sada rakshatu vaishnavi | rameti ramabhadreti ramacandreti yah smaret || 8|| vimuktah sa narah papan
    muktim prapnoti shashvatim | vasishthena idam proktam gurave vishnurupine || 9|| tato me brahmanah
    praptam mayoktam naradam prati | naradena tu bhurloke prapitam sujaneshviha || 10|| suptva va'tha
    grihevapi marge gaccheta eva va | ye pathanti narashreshthah te narah punyabhaginah || 11||
  devanagari: ृण्वन्ति नरश्रेष्ठाः ते पुण्याः पुण्यरूपिणः ॥ ॐ रामरक्षास्तोत्रस्य श्रीमहर्षिर्विश्वामित्रऋषिः
    । श्रीरामो देवता । अनुष्टुप्छन्दः । श्रीविष्णुप्रीत्यर्थे जपे विनियोगः ॥ अतसी पुष्पसङ्काशं पीतवास
    समच्युतम् । ध्यात्वा वै पुण्डरीकाक्षं श्रीरामं विष्णुमव्ययम् ॥ १॥ पातुवो हृदयं रामः श्रीकण्ठः कण्ठमेव
    च । नाभिं पातु मखत्राता कटिं मे विश्वरक्षकः ॥ २॥ करौ पातु दाशरथिः पादौ मे विश्वरूपधृक् । चक्षुषी पातु
    वै देव सीतापतिरनुत्तमः ॥ ३॥ शिखां मे पातु विश्वात्मा कर्णौ मे पातु कामदः । पार्श्वयोस्तु सुरत्राता
    कालकोटि दुरासदः ॥ ४॥ अनन्तः सर्वदा पातु शरीरं विश्वनायकः । जिह्वां मे पातु पापघ्नो लोकशिक्षाप्रवर्त्तकः
    ॥ ५॥ राघवः पातु मे दन्तान् केशान् रक्षतु केशवः । सक्थिनी पातु मे दत्तविजयोनाम विश्वसृक् ॥ ६॥ एतां
    रामबलोपेतां रक्षां यो वै पुमान् पठेत् । सचिरायुः सुखी विद्वान् लभते दिव्यसम्पदाम् ॥ ७॥ रक्षां करोति
    भूतेभ्यः सदा रक्षतु वैष्णवी । रामेति रामभद्रेति रामचन्द्रेति यः स्मरेत् ॥ ८॥ विमुक्तः स नरः पापान्
    मुक्तिं प्राप्नोति शाश्वतीम् । वसिष्ठेन इदं प्रोक्तं गुरवे विष्णुरूपिणे ॥ ९॥ ततो मे ब्रह्मणः प्राप्तं
    मयोक्तं नारदं प्रति । नारदेन तु भूर्लोके प्रापितं सुजनेष्विह ॥ १०॥ सुप्त्वा वाऽथ गृहेवापि मार्गे गच्छेत
    एव वा । ये पठन्ति नरश्रेष्ठः ते नराः पुण्यभागिनः ॥ ११॥
