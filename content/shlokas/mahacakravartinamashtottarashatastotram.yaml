id: mahacakravartinamashtottarashatastotram
category: stotram
name:
  english: mahacakravartinamashtottarashatastotram
  devanagari: महाचक्रवर्तिनामाष्टोत्तरशतस्तोत्रम्
content:
  english: sattvapujasupujaka | mahopaya mahasiddhe vajrasiddhi namo'stu te || 11|| tathagata mahakaya
    tathagatasarasvate | tathagatamahacitta vajracitta namo'stu te || 12|| buddhadhipa jinajnakrid buddhamitra
    jinagraja | mahavairocana vibho shantaraudra namo'stu te || 13|| tathagatamahatattva bhutakote mahanaya
    | sarvaparamitajnana paramartha namo'stu te || 14|| samantabhadra caryagrya mara marapramadarka |
    sarvagrya samatajnana sarvatraga namo'stu te || 15|| buddhahunkara hunkara vajrahunkara damaka | vishvavajradga
    vajrogra vajrapane namo'stu te || 16|| vandayah pujyashca manyashca satkartavyastathagataih | yasmad
    vajradridham cittam vajrasattvastvamucyase || 17|| tvadadhina hi sambodhih pita tvam sarvadarshinam
    | sambhutah sambhavishyanti tvamasadya tathagatah || 18|| anena stotrarajena yah stuyadbai subhaktitah
    | yo gayamstu stuyat so'pi bhavedvajradharopamah || 19|| adhyeshayamastvam natha sarvabuddhavashankaram
    | sarvasattvarthakaryarthamutpadaya svakam kulam || 20|| iti mahacakravartinamashtottarashatadhyeshanastotram
    sampurnam ||
  devanagari: सत्त्वपूजासुपूजक । महोपाय महासिद्धे वज्रसिद्धि नमोऽस्तु ते ॥ ११॥ तथागत महाकाय तथागतसरस्वते
    । तथागतमहाचित्त वज्रचित्त नमोऽस्तु ते ॥ १२॥ बुद्धाधिप जिनाज्ञाकृद् बुद्धमित्र जिनाग्रज । महावैरोचन
    विभो शान्तरौद्र नमोऽस्तु ते ॥ १३॥ तथागतमहातत्त्व भूतकोटे महानय । सर्वपारमिताज्ञान परमार्थ नमोऽस्तु
    ते ॥ १४॥ समन्तभद्र चर्याग्र्य मार मारप्रमदर्क । सर्वाग्र्य समताज्ञान सर्वत्रग नमोऽस्तु ते ॥ १५॥ बुद्धहुङ्कर
    हुङ्कार वज्रहुङ्कर दामक । विश्ववज्राड्ग वज्रोग्र वज्रपाणे नमोऽस्तु ते ॥ १६॥ वन्दयः पूज्यश्च मान्यश्च
    सत्कर्तव्यस्तथागतैः । यस्माद् वज्रदृढं चित्तं वज्रसत्त्वस्त्वमुच्यसे ॥ १७॥ त्वदधीना हि सम्बोधिः पिता
    त्वं सर्वदर्शिनाम् । सम्भूताः सम्भविष्यन्ति त्वामासाद्य तथागताः ॥ १८॥ अनेन स्तोत्रराजेन यः स्तुयाद्बै
    सुभक्तितः । यो गायंस्तु स्तुयात् सोऽपि भवेद्वज्रधरोपमः ॥ १९॥ अध्येषयामस्त्वां नाथ सर्वबुद्धवशङ्करम्
    । सर्वसत्त्वार्थकार्यार्थमुत्पादय स्वकं कुलम् ॥ २०॥ इति महाचक्रवर्तिनामाष्टोत्तरशताध्येषणास्तोत्रं
    सम्पूर्णम् ॥
