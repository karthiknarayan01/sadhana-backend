id: annamayya-keerthanas-hari-naamamu-kadu
category: stotram
name:
  english: Annamayya Keerthanas Hari Naamamu Kadu
content:
  english: pallavi harinamamu kadu nanandakaramu | marugavo marugavo marugavo manasa || nalinakshu shrinamamu
    kalidoshaharamu kaivalyamu | phalasaramu bahubandha mocanamu harinamamu kadu nanandakaramu | nagadharu
    namamu narakaharanamu jagadekahitamu sammatamu | saguna nirgunamu sakshatkaramu pògadavo pògadavo
    pògadavo manasa || harinamamu kadu nanandakaramu | kadagi shrivenkatapati namamu òdi òdine sampatkaramu
    | adiyalam bila nati sukhamulamu tadavavo tadavavo tadavavo manasa || harinamamu kadu nanandakaramu
    | marugavo marugavo marugavo manasa ||
  devanagari: पल्लवि हरिनाममु कडु नानन्दकरमु । मरुगवो मरुगवो मरुगवो मनसा ॥ नलिनाक्षु श्रीनाममु कलिदोषहरमु
    कैवल्यमु । फलसारमु बहुबन्ध मोचनमु हरिनाममु कडु नानन्दकरमु । नगधरु नाममु नरकहरणमु जगदेकहितमु सम्मतमु
    । सगुण निर्गुणमु साक्षात्कारमु पॊगडवो पॊगडवो पॊगडवो मनसा ॥ हरिनाममु कडु नानन्दकरमु । कडगि श्रीवेङ्कटपति
    नाममु ऒडि ऒडिने सम्पत्करमु । अडियालं बिल नति सुखमूलमु तडववो तडववो तडववो मनसा ॥ हरिनाममु कडु नानन्दकरमु
    । मरुगवो मरुगवो मरुगवो मनसा ॥
