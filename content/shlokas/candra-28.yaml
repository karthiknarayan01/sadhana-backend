id: candra-28
category: stotram
name:
  english: candra 28
  devanagari: चन्द्र २८
content:
  english: rinu namani shubhadani mahipate | yani shrutva naro duhkhanmucyate natra samshayah || 1|| sudhakarashca
    somashca glaurabjah kumudapriyah | lokapriyah shubhrabhanushcandrama rohinipatih || 2|| shashi himakaro
    raja dvijarajo nishakarah | atreya induh shitamshuroshadhishah kalanidhih || 3|| jaivatriko ramabhrata
    kshirodarnavasambhavah | nakshatranayakah shambhushirashcudamanirvibhuh || 4|| tapaharta nabhodipo
    namanyetani yah pathet | pratyaham bhaktisamyuktastasya pida vinashyati || 5|| taddine ca pathedyastu
    labhetsarvam samihitam | grahadinam ca sarvesham bhaveccandrabalam sada || 6|| || iti shricandrashtavimshatinamastotram
    sampurnam ||
  devanagari: ृणु नामानि शुभदानि महीपते । यानि श्रुत्वा नरो दुःखान्मुच्यते नात्र संशयः ॥ १॥ सुधाकरश्च
    सोमश्च ग्लौरब्जः कुमुदप्रियः । लोकप्रियः शुभ्रभानुश्चन्द्रमा रोहिणीपतिः ॥ २॥ शशी हिमकरो राजा द्विजराजो
    निशाकरः । आत्रेय इन्दुः शीतांशुरोषधीशः कलानिधिः ॥ ३॥ जैवातृको रमाभ्राता क्षीरोदार्णवसम्भवः । नक्षत्रनायकः
    शम्भुशिरश्चूडामणिर्विभुः ॥ ४॥ तापहर्ता नभोदीपो नामान्येतानि यः पठेत् । प्रत्यहं भक्तिसंयुक्तस्तस्य
    पीडा विनश्यति ॥ ५॥ तद्दिने च पठेद्यस्तु लभेत्सर्वं समीहितम् । ग्रहादीनां च सर्वेषां भवेच्चन्द्रबलं
    सदा ॥ ६॥ ॥ इति श्रीचन्द्राष्टाविंशतिनामस्तोत्रं सम्पूर्णम् ॥
