id: kyts-6-5-indro-vrutraaya-vajramudayacchat-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.5 Indro Vrutraaya Vajramudayacchat - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande pancamah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || indro vritraya vajramudayaccha thsa vritro vajradudyatadabibhe
    'bravinma me pra harasti va ida syamiti tasma ukthya 'bravinma ma pra harasti va ida tasma ukthyameva
    prayaccha ttasmai tritiyamudayaccha vi~shnuranvatishthata jahiti so 'bravinma me pra harasti va ida
    syamiti tasma ukthyameva prayaccha yajno hi tasya maya dyadukthyo grihyata indriyameva ya~jamano bhratrivyasya
    vrinkta indraya tva briha dvate vayasvata ityahendraya hi sa ta tva vishnave tvetyaha yadeva vishnuranvatishthata
    jahiti tasma dvishnumanvabhajati trirnirgrihnati trir ntasmai prayacchadesha te yonih punar havirasityaha
    punahpuna nnirgrihnati cakshurva eta dyajnasya yadukthya stasmadukthyagm hutagm soma anvayanti tasmadatma
    cakshuranveti tasmadekam 'nu yanti tasmadeko bahuna mbhadro bhavati tasmadeko bahvirjaya vindate yadi
    kamayeta nca tishthannava naye datmanameva yajnayashasena rpayati yadi kamayeta yajamanam mityantara
    sadohavirdhane tishthannava naye dyajamanameva yajnayashasena rpayati yadi kamayeta sadasyan yajna
    yashasena rpayeyamiti sada alabhyava naye thsadasyaneva yajnayashasena ddhruva uttamo grahana mprithivya
    ityaha murdhana mityaha vaishvanaragm hi devataya rubhayato vaishvanaro grihyate tasma dubhayatah
    prana adhasta 'nye graha grihyante 'nupopte dhruvastasma dasthnanyah prajah pratitishthanti magmsenanya
    asura va uttaratah prithivi ndeva dhruvenadrigmha ddhruvasya dhruvatvam ssadyate dhritya ayurva eta
    ddhruva atma hota yaddhotricamase dhruva mavanayatyatmanneva yajnasya 'vaniya ityahuh purastaddhyayusho
    bhunkte maddhyato 'vaniya ityahurmaddhyamena hyayusho bhunkta uttarardhe 'vaniya ityahuruttamena hyayusho
    bhunkte vai shvadevyamrici shasyamanayamava nayati vaishvadevyo vai prajah prajasveva kannacatvarigmshacca
    'manyanta manushya no 'nvabhavishyantiti te sam va~thsarena yopayitva suvargam ntamrishaya ritugrahairevanu
    prajanan yadritugraha grihyante suvargasya lokasya prajna tyai dvadasha grihyante dvadasha masa tyai
    saha prathamau grihyete sahottamau tasma ddvaudvavritu ubhayatomukha mmukhamrituna preshyeti sha tkritva
    aha shadva ritava rituneva prinatyritubhiriti catushcatushpada eva pashu nprinati dvih punar ''ha
    dvipada eva prinatyrituna preshyeti sha tkritva ahartubhiriti catustasma ccatushpadah pashava ritunupa
    jivanti dvih ddvipadashcatushpadah pashunupa jivantyrituna preshyeti sha tkritva ahartubhiriti caturdvih
    punar ''ha ''kramanameva ta ya~jamanah kurute suvargasya lokasya samashtyai nanyo 'nyamanu prapadyeta
    yadanyo 'nyamanu prapadyetartur ritumanu prapadyetartavo mohuka rdakshinena prapadyate prasiddha mpratiprasthatottarena
    tasma shshanmaso dakshinenaiti shaduttareno 'syagmhaspatyaya tvetyahasti trayodasho masa ityahusta
    suvargaya va ete lokaya grihyante yadritugraha jyoti mritupatrena grihnati jyoti ddadhati suvargasya
    lokasya 'nukhyatya ojobhritau va etau devanam ya~dindragni yadai ndragno grihyata oja evava rundhe
    vaishvadevagm shukrapatrena grihnati vaishvadevyo vai praja asavaditya shvadevagm shukrapatrena grihnati
    tasma prajah pratyannudeti tasma thsarva eva manyate ma mpratyudagaditi vaishvadevagm shukrapatrena
    grihnati vaishvadevyo vai prajastejah shukro ya shvadevagm shukrapatrena grihnati prajasveva tejo
    dadhati || vi~dyena maddhyandine savane vritramahan yanmaddhyandine savane marutvatiya grihyante vartraghna
    eva te yajamanasya grihyante tasya vritra thsa ritupatrena marutvatiyanagrihna dyadritupatrena marutvatiya
    grihyanta rituna ya~jamano bhratrivyaya pra harati yanmarutvatiya udeva prathamena yacchati pra harati
    dvitiyena strinute tritiyena skurute yanmarutvatiya dhanureva prathamo jya dvitiya ishustritiyah pratyeva
    prathamena dhatte visrijati dvitiyena viddhyati tritiyenendro vritragm hatva para daparadhamiti manyamana
    pranameva prathamena ''tmasparana va ete yajamanasya grihyante yanmarutvatiyah pranameva prathamena
    sprinute ntritiyenendro vritramaha va ayamabhudyo vritramavadhiditi tanmahendrasya mahendratvagm sa
    eta mudaharata vritragm hatva 'nyasu devatasva dhi yanmahendro grihyata uddharameva tam 'nyasu prajasvadhi
    shukrapatrena grihnati yajamanadevatyo vai mahendrastejah shukro yanmahendragm shukrapatrena grihnati
    yajamana eva tejo dadhati || aditih putrakama saddhyebhyo devebhyo ttasya uccheshanamadadusta 'dhatta
    tasyai catvara aditya ajayanta sa dvitiyamapaca 'manyatoccheshananma ime prashishyamito me vasiyagmso
    janishyanta iti sa 'dhatta tasyai vyriddhamandamajayata sa shrantamastviti te 'to jayata asmakagm
    sa eko 'sya prajayamriddhyata asmaka mbhogaya bhavaditi tato vivasvanadityo 'jayata tasya va iya mpraja
    yanmanushya stasveka evardho yo yajate sa devana mbhogaya bhavati deva vai yajna thsa adityananvakramata
    te dvidevatya nna prati prayaccha ntasmadapi vaddhya nna prati prayacchanti tasma bhya adityo nirgrihyate
    yaduccheshana dgrihyate tisribhir rigbhirgrihnati mata pita putrastadeva tanmithuna ngarbho jarayu
    tadeva ta mpashavo va ete yadaditya urgdadhi daddhna maddhyata shshrinatyurjameva pashuna mmaddhyato
    dadhati shritatankyena meddhyatvaya tasmadama pakva nduhe pashavo va ete yadadityah parishritya grihnati
    pratiruddhyaiva ngrihnati pashavo va ete yadaditya esha rudro yadagnih parishritya grihnati rudradeva
    pashu tyesha vai vivasvanadityo yadupagm shusavana ssa etameva somapitha mpari shaya a tritiyasavana
    dvivasva adityaisha te somapitha ityaha vivasvanta ''dityagm somapithena samardhayati ya divya vrishtistaya
    tva shrinamiti vrishtikamasya shriniya dvrishtimevava rundhe yadi taja shukah parjanyah syadyadi ciramavar
    shuko na sadayatyasannaddhi prajah prajayante nanu vasha tkaroti yadanuvashatkurya mpraja anvavasrijenna
    hutvanvi ksheta yadanviksheta cakshurasya pramayukagg ttasmannanvikshyah || antaryamapatrena savitra
    dgrihnati prajapatirva esha yada mprajananaya na sadayatyasannaddhi prajah prajayante nanu vasha tkaroti
    yadanuvashatkurya mpraja anvavasrije desha vai gayatro devanam thsavitaisha gayatriyai loke grihyate
    yada grayano yadantaryamapatrena savitra rnirgrihnati vishve mpratassavanabhagagm santa ntritiyasavanamabhi
    paryanaya ntato vai te tritiyagm savana ttritiyasavane savitro grihyate tritiyasya savanasyodyatyai
    savitripatrena vaishvadeva dgrihnati vaishvadevyo vai praja vai shvadevah kalashah savita prasavanamishe
    ya thsavitripatrena vaishvadeva dgrihnati savitriprasuta evasmai janayati some somamabhi janayati
    some somamabhi grihnati reta eva ta 'si supratishthana ityaha some hi somamabhigrihnati pratishthitya
    etasmin va api grahe manushye bhyo devebhyah pitribhyah kriyate susharma 'si supratishthana ityaha
    manushye bhya evaitena karoti brihadityaha devebhya evaitena karoti nama ityaha pitribhya evaitena
    karotye tavati rvai devatastabhya evainagm sarva bhyo grihnatyesha te yonirvishve bhyastva devebhya
    ityaha vaishvadevo hyeshah || pitribhya evaitena karotye kannavigmshatishca prano va esha yadupagmshu
    ryadupagmshupatrena prathamashco ttamashca grahau grihyete pranamevanu prayanti pranamanudyanti prajapatirva
    esha yada grayanah prana upagmshuh patnih prajah pra janayanti yadupagmshupatrena patnivatama dgrihnati
    prajana mpraja anu pra jayante deva va ita itah patni ntamagrihnata tato vai te suvargam tnivato grihyate
    suvargasya lokasya prajna tyai sa somo natishthata stribhyo grihyamanasta thstriyo nirindriya adayadirapi
    papa tpugmsa upastitaram dghritena patnivatagg shrinati vajrenaivainam va~she kritva grihna mpraja
    anu pra jayante brihaspatisutasya ta ityaha brahma vai devana prajah pra janayatindo ityaha reto va
    indu reta eva ta ddadhatindriyava i tyaha praja va indriya mpraja evasmai pra janayatyagna ityahagnirvai
    retodhah patniva ityaha mithunatvaya sajurdevena tvashtra soma mpibetyaha tvashta vai pashuna mmithunanagm
    rupakri drupameva pashushu dadhati deva vai tvashtaramajighagmsan thsa patnih prapadyata ta nna prati
    prayacchanti tasma tpatnivate tvashtre 'pi grihyate na sadayatyasannaddhi prajah prajayante nanu vasha
    mpraja anvavasrije mpraja anvavasrijati shantamagni gnideva neshtari reto dadhati neshta patniyamu
    nkhyapayati prajapatirva esha yadudgata prajana mprajananayapa upa pra vartayati reta eva ta thsincatyurunopa
    pra vartayatyuruna hi retah sicyate nagna rumupa pra vartayati yada hi nagna ururbhavatyatha mithuni
    bhavato 'tha prajah pra jayante || 'manyata yaddhoshyamyamagm ho shyami yanna hoshyami yajnaveshasa
    nkarishyamiti tamaddhriyata hotugm so rabravinna mayyamagm ho shrinati shritatvaya shrita njuhoti
    bahvibhih shrinatyetavati mushmin ~loke kamadugha bhavantyatho khalvahureta va indrasya prishnayah
    kamadugha yaddhariyojaniriti tasma dbahvibhih shriniyadrikhsame va indrasya hari somapanau tayoh tprahritya
    paridhinjuhoti niradhanabhya mpra yacchatyunneta juhoti yatayameva hyetar mpunaryunakti tadrigeva
    tacchirsha nnadhinidhaya juhoti shir dvikramya juhoti vikramya hindro vritramahan thsamriddhyai pashavo
    vai hariyojanirya mpashavo bhunjanta upatishtheran 'bhunjanta upa tishthera nkaroti bahava evaina
    mpashavo bhunjanta upa tishthanta unnetaryupahava micchante ya eva tatra somapithasta mevava rundhata
    uttaravedya nnivapati pashavo va uttaravedih pashavo hariyojanih pashushveva pashu nprati shthapayanti
    || va anu prajah pashavah pra jayanta upag mavajavayah shukramanthinau purusha ritugraha ngava adityagraho
    bhuyishthabhir rigbhirgrihyate tasma ttrirupagm shugm hastena vigrihnati tasma ddvau trinaja janayatyathavayo
    bhuyasih pita va esha yada grayanah putrah kalasho yada nkshita upadhavati tadrigeva tadya dyatha
    putrah pitara nkshita upadhavati tadrigeva tadatma va esha yajnasya yada grayano yadgraho va kalasho
    vopadasye dgrihniyadatmana evadhi yajna nnishkarotyavijnato va esha grihyate yada ssthalya grihnati
    vayavyena juhoti tasma garbhena 'vijnatena dgarbhena 'vijnatena brahmaha 'vabhrithamava yanti para
    dvayavyani haranti tasma tpumagm sagm haranti ya tpurorucamaha yatha vasyasa aharati tadrigeva ta
    ngrihnati yatha vasyasa ahritya pra thsadayati yatha vasyasa upanidhaya pakramati tadrigeva ta dya
    dvai yajnasya samna yajusha kriyate shithila mpurastadupayama yajusha grihyanta uparishta dupayama
    rica yajnasya dhrityai dapakramati tadrigeva ta pranyani patrani yujyante nanyani yani paracinani
    prayujyante 'mumeva tairlokamabhi jayati paraniva hyasau loko yani punah prayujyanta imameva tairlokamabhi
    jayati punahpuna lo~kah pranyani patrani yujyante nanyani yani paracinani prayujyante tanyanvoshadhayah
    para bhavanti yani punah prayujyante tanyanvoshadhayah punara bhavanti pranyani patrani yujyante nanyani
    yani paracinani prayujyante tanyanvaranyah pashavo mapa yanti yani punah prayujyante tanyanu gramyah
    pashavo grama mupavayanti yo vai grahana ya~dupagmshu shagmsati ta ngrahanametadvai grahana nbhavati
    yo vai grahana ve~da pra prajaya pashubhi ranye graha grihyante vayavyai ranya etadvai grahana ve~da
    pra prajaya pashubhi rjayata indrastvashtu ttairvai sa atmannaramana mpurodasha nirupyante tasma nkurute
    nainagm somo 'ti pavate brahmavadino vadanti narca na yajusha pankti 'tha kim ~yajnasya panktatvamiti
    dhanah karambhah parivapah purodashah payasya tena pankti dyajnasya panktatvam || bhavanti yani punah
    prana upagmshu patre nendro vritramaha || harih om || || krishna yajurvediya taittiriya samhitayam
    shashthakande pancamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे पञ्चमः प्रश्नः सोममन्त्रब्राह्मणनिरूपणं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ इन्द्रो॑ वृ॒त्राय॒ वज्र॒मुद॑यच्छ॒ थ्स वृ॒त्रो वज्रा॒दुद्य॑तादबिभे॒
    ऽब्रवी॒न्मा मे॒ प्र हा॒रस्ति॒ वा इ॒द स्या॒मीति॒ तस्मा॑ उ॒क्थ्य॑ ऽब्रवी॒न्मा म॒ प्र हा॒रस्ति॒ वा इ॒द
    तस्मा॑ उ॒क्थ्य॑मे॒व प्राय॑च्छ॒ त्तस्मै॑ तृ॒तीय॒मुद॑यच्छ॒ विँष्णु॒रन्व॑तिष्ठत ज॒हीति॒ सो ऽब्रवी॒न्मा
    मे॒ प्र हा॒रस्ति॒ वा इ॒द स्या॒मीति॒ तस्मा॑ उ॒क्थ्य॑मे॒व प्राय॑च्छ॒ य॒ज्ञो हि तस्य॑ मा॒या द्यदु॒क्थ्यो॑
    गृ॒ह्यत॑ इन्द्रि॒यमे॒व यँज॑मानो॒ भ्रातृ॑व्यस्य वृङ्क्त॒ इन्द्रा॑य त्वा बृ॒ह द्व॑ते॒ वय॑स्वत॒ इत्या॒हेन्द्रा॑य॒
    हि स त त्वा॒ विष्ण॑वे॒ त्वेत्या॑ह॒ यदे॒व विष्णु॑र॒न्वति॑ष्ठत ज॒हीति॒ तस्मा॒ द्विष्णु॑म॒न्वाभ॑जति॒
    त्रिर्निर्गृ॑ह्णाति॒ त्रिर् न्तस्मै॒ प्राय॑च्छदे॒ष ते॒ योनिः॒ पुन॑र् हविर॒सीत्या॑ह॒ पुनः॑पुन॒ न्निर्गृ॒ह्णाति॒
    चक्षु॒र्वा ए॒त द्य॒ज्ञस्य॒ यदु॒क्थ्य॑ स्तस्मा॑दु॒क्थ्यग्ं॑ हु॒तग्ं सोमा॑ अ॒न्वाय॑न्ति॒ तस्मा॑दा॒त्मा
    चक्षु॒रन्वे॑ति॒ तस्मा॒देकं॒ ऽनु॑ यन्ति॒ तस्मा॒देको॑ बहू॒ना म्भ॒द्रो भ॑वति॒ तस्मा॒देको॑ ब॒ह्वीर्जा॒या
    वि॑न्दते॒ यदि॑ का॒मये॑ता ञ्च॒ तिष्ठ॒न्नव॑ नये दा॒त्मान॑मे॒व य॑ज्ञयश॒सेना र्पयति॒ यदि॑ का॒मये॑त॒ यज॑मानं
    मित्य॑न्त॒रा स॑दोहविर्धा॒ने तिष्ठ॒न्नव॑ नये॒ द्यज॑मानमे॒व य॑ज्ञयश॒सेना र्पयति॒ यदि॑ का॒मये॑त सद॒स्यान्॑
    यज्ञ यश॒सेना र्पयेय॒मिति॒ सद॑ आ॒लभ्याव॑ नये थ्सद॒स्या॑ने॒व य॑ज्ञयश॒सेना द्ध्रु॒व उ॑त्त॒मो ग्रहा॑णा
    म्पृ॑थि॒व्या इत्या॑ह मू॒र्धान॑ मित्या॑ह वैश्वान॒रग्ं हि दे॒वत॒या रुभ॒यतो॑ वैश्वानरो गृह्यते॒ तस्मा॑
    दुभ॒यतः॑ प्रा॒णा अ॒धस्ता ऽन्ये ग्रहा॑ गृ॒ह्यन्ते॒ ऽनु॑पोप्ते ध्रु॒वस्तस्मा॑ द॒स्थ्नान्याः प्र॒जाः
    प्र॑ति॒तिष्ठ॑न्ति मा॒ग्ं॒सेना॒न्या असु॑रा॒ वा उ॑त्तर॒तः पृ॑थि॒वी न्दे॒वा ध्रु॒वेणा॑दृग्ंह॒ द्ध्रु॒वस्य॑
    ध्रुव॒त्वं स्सा॒द्यते॒ धृत्या॒ आयु॒र्वा ए॒त द्ध्रु॒व आ॒त्मा होता॒ यद्धो॑तृचम॒से ध्रु॒व म॑व॒नय॑त्या॒त्मन्ने॒व
    य॒ज्ञस्या ऽव॒नीय॒ इत्या॑हुः पु॒रस्ता॒द्ध्यायु॑षो भु॒ङ्क्ते म॑द्ध्य॒तो॑ ऽव॒नीय॒ इत्या॑हुर्मद्ध्य॒मेन॒
    ह्यायु॑षो भु॒ङ्क्त उ॑त्तरा॒र्धे॑ ऽव॒नीय॒ इत्या॑हुरुत्त॒मेन॒ ह्यायु॑षो भु॒ङ्क्ते वै श्वदे॒व्यामृ॒चि
    श॒स्यमा॑नाया॒मव॑ नयति वैश्वदे॒व्यो॑ वै प्र॒जाः प्र॒जास्वे॒वा का॒न्नच॑त्वारि॒ग्ं॒शच्च॑ ऽमन्यन्त मनु॒ष्या॑
    नो॒ ऽन्वाभ॑विष्य॒न्तीति॒ ते सं॑ वँथ्स॒रेण॑ योपयि॒त्वा सु॑व॒र्गं न्तमृष॑य ऋतुग्र॒हैरे॒वानु॒ प्राजा॑न॒न्॒
    यदृ॑तुग्र॒हा गृ॒ह्यन्ते॑ सुव॒र्गस्य॑ लो॒कस्य॒ प्रज्ञा त्यै॒ द्वाद॑श गृह्यन्ते॒ द्वाद॑श॒ मासा त्यै
    स॒ह प्र॑थ॒मौ गृ॑ह्येते स॒होत्त॒मौ तस्मा॒ द्द्वौद्वा॑वृ॒तू उ॑भ॒यतो॑मुख म्मुख॑मृ॒तुना॒ प्रेष्येति॒ ष
    ट्कृत्व॑ आह॒ षड्वा ऋ॒तव॑ ऋ॒तूने॒व प्री॑णात्यृ॒तुभि॒रिति॑ च॒तुश्चतु॑ष्पद ए॒व प॒शू न्प्री॑णाति॒ द्विः
    पुन॑र् ऽऽह द्वि॒पद॑ ए॒व प्री॑णात्यृ॒तुना॒ प्रेष्येति॒ ष ट्कृत्व॑ आह॒र्तुभि॒रिति॑ च॒तुस्तस्मा॒ च्चतु॑ष्पादः
    प॒शव॑ ऋ॒तूनुप॑ जीवन्ति॒ द्विः द्द्वि॒पाद॒श्चतु॑ष्पदः प॒शूनुप॑ जीवन्त्यृ॒तुना॒ प्रेष्येति॒ ष ट्कृत्व॑
