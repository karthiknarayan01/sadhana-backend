id: dhumavatikavacam
category: kavacha
name:
  english: dhumavatikavacam
  devanagari: धूमावतीकवचम्
content:
  english: rinu devi param guhyam na prakashyam kalau yuge | kavacam shridhumavatyashshatrunigrahakarakam
    || 2|| brahmadyadevi satatam yadvashadarighatinah | yogino bhava shatrughna yasya dhyana prabhavatah
    || 3|| om asya shridhumavatikavacasya pippalada rishih anushtupchandah shridhumavati devata dhum bijam
    svaha shaktih dhumavati kilakam shatruhanane pathe viniyogah || om dhum bijam me shirah patu dhum
    lalatam sadavatu | dhuma netrayugam patu vati karnau sadavatu || 4|| dirgha tudaramadhye tu nabhim
    me malinambara | shurpahanta patu guhyam ruksha rakshatu januni || 5|| mukham me patu bhimakhya svaha
    rakshatu nasikam | sarvam vidyavatu kantham vivarna bahuyugmakam || 6|| cancala hridayam patu dhrishta
    parshvam sadavatu | dhumahasta sada patu padau patu bhayavaha || 7||
  devanagari: ृणु देवि परं गुह्यं न प्रकाश्यं कलौ युगे । कवचं श्रीधूमावत्याश्शत्रुनिग्रहकारकम् ॥ २॥ ब्रह्माद्यादेवि
    सततं यद्वशादरिघातिनः । योगिनो भव शत्रुघ्ना यस्या ध्यान प्रभावतः ॥ ३॥ ॐ अस्य श्रीधूमावतीकवचस्य पिप्पलाद
    ऋषिः अनुष्टुप्छन्दः श्रीधूमावती देवता धूं बीजम् स्वाहा शक्तिः धूमावती कीलकम् शत्रुहनने पाठे विनियोगः
    ॥ ॐ धूं बीजं मे शिरः पातु धूं ललाटं सदावतु । धूमा नेत्रयुगं पातु वती कर्णौ सदावतु ॥ ४॥ दीर्घा तूदरमध्ये
    तु नाभिं मे मलिनाम्बरा । शूर्पहन्ता पातु गुह्यं रूक्षा रक्षतु जानुनी ॥ ५॥ मुखं मे पातु भीमाख्या स्वाहा
    रक्षतु नासिकाम् । सर्वं विद्यावतु कण्ठं विवर्णा बाहुयुग्मकम् ॥ ६॥ चञ्चला हृदयं पातु धृष्टा पार्श्वं
    सदावतु । धूमहस्ता सदा पातु पादौ पातु भयावहा ॥ ७॥
