id: shivaproktamkashimantramahimavarnanam
category: mantra
name:
  english: shivaproktamkashimantramahimavarnanam
  devanagari: शिवप्रोक्तंकाशीमन्त्रमहिमावर्णनम्
content:
  english: '|| 180|| kashiti varnayugmasya prabhavam veda shankarah | kashiti varnadvandva yadbahuduhkhapaharakam
    || 181|| tadvidhuya dvandvaduhkham shuddhamaddha dadati ca | kashityuccarita yena parihasena va yama
    | tena svoparjitanantapapam nashyatyasamshayam || 182|| papakanananashaya kashityesha hutashanah |
    parameshena nirdishtah shishtah kashtavinashakrit || 183|| janmamrityujaraduhkhamaharogaushadham param
    | kashiti paramo mantro santrasayati patakam || 184|| samsarapapamattebhapancananamanamayam | samsaragartamagnanam
    kashityesha mahamanuh || 185|| samakarshakaram spashtam sarvashreyaskaram tatha | samsarasarpadashtena
    kashiti manumulika || 186|| samsaravishashantyartham sevaniya muhurmuhuh | muktikantakarshako''yam
    kashiti manuruttamah || 187|| asakridva sakridvapi kashiti manumuttamam | yo japetsa mahaghebhyah
    sadya eva vimucyate || 188|| yama kashiti vagvalli suvarnadvandvapallava | svargapavargaphalada balapramathanapriya
    || 189|| kashi nama sudha dhanya vasudhatalavasinam | pibanti shraddhaya siddhah shamanaitam tapodhanah
    || 190|| kashiti mantrarajo''yam punyarashisamriddhidah | anantabhedyavividhapaparashimahashanih ||
    191|| kashitvamritamuskrishtam suranamatidurlabham | pibanti sadhavo bhaktya bhalalocanapujakah ||
    192|| pitvapyamritamashasya sura bhutva punarnarah | bhavanti na tatha kashinamamritanipayinah ||
    193|| kashityesha mahamantrah shreshtho''yamamritadapi | amritam nashvaram yasmadanashvaramaya manuh
    |'
  devanagari: ॥ १८०॥ काशीति वर्णयुग्मस्य प्रभावं वेद शङ्करः । काशीति वर्णद्वन्द्व यद्बहुदुःखापहारकम् ॥
    १८१॥ तद्विधूय द्वन्द्वदुःखं शुद्धमद्धा ददाति च । काशीत्युच्चरित येन परिहासेन वा यम । तेन स्वोपार्जितानन्तपापं
    नश्यत्यसंशयम् ॥ १८२॥ पापकानननाशाय काशीत्येष हुताशनः । परमेशेन निर्दिष्टः शिष्टः कष्टविनाशकृत् ॥ १८३॥
    जन्ममृत्युजरादुःखमहारोगौषधं परम् । काशीति परमो मन्त्रो सन्त्रासयति पातकम् ॥ १८४॥ संसारपापमत्तेभपञ्चाननमनामयम्
    । संसारगर्तमग्नानां काशीत्येष महामनुः ॥ १८५॥ समाकर्षकरं स्पष्टं सर्वश्रेयस्करं तथा । संसारसर्पदष्टेन
    काशीति मनुमूलिका ॥ १८६॥ संसारविषशान्त्यर्थं सेवनीया मुहुर्मुहुः । मुक्तिकान्ताकर्षकोऽयं काशीति मनुरुत्तमः
    ॥ १८७॥ असकृद्वा सकृद्वापि काशीति मनुमुत्तमम् । यो जपेत्स महाघेभ्यः सद्य एव विमुच्यते ॥ १८८॥ यम काशीति
    वाग्वल्ली सुवर्णद्वन्द्वपल्लवा । स्वर्गापवर्गफलदा बलप्रमथनप्रिया ॥ १८९॥ काशी नाम सुधा धन्या वसुधातलवासिनाम्
    । पिबन्ति श्रद्धया सिद्धाः शमनैतां तपोधनाः ॥ १९०॥ काशीति मन्त्रराजोऽयं पुण्यराशिसमृद्धिदः । अनन्ताभेद्यविविधपापराशिमहाशनिः
    ॥ १९१॥ काशीत्वमृतमुस्कृष्टं सुराणामतिदुर्लभम् । पिबन्ति साधवो भक्त्या भाललोचनपूजकाः ॥ १९२॥ पीत्वाप्यमृतमाशास्य
    सुरा भूत्वा पुनर्नराः । भवन्ति न तथा काशीनामामृतनिपायिनः ॥ १९३॥ काशीत्येष महामन्त्रः श्रेष्ठोऽयममृतादपि
    । अमृतं नश्वरं यस्मादनश्वरमय मनुः ।
