id: bhu-suktam
category: stotram
name:
  english: Bhu Suktam
content:
  english: taittiriya brahmanam mbhumirbhumna dyaurvarina mmahitva | upasthe te devyadite mannadyayadadhe
    || a 'yangauh prishnirakrami thsuvah || trigmshaddhama virajati vakpatangaya shishriye | pratyasya
    vahadyubhih || asya pranadapanatyantashcarati rocana | vyakhya kruddhah parovapamanyuna yadavartya
    | sukalpamagne tattava punastvoddipayamasi || yatte manyuparoptasya prithivi manudadhvase | aditya
    vishve taddeva vasavashca samabharann || medini devi vasundhara syadvasudha devi vasavi | brahmavarcasah
    pitrinam shrotra ncakshurmanah || devi hiranyagarbhini devi prasodari | sadane satyayane sida | samudravati
    savitri ahano devi mahyangi 'tyatishthat || shringe shringe yajne yajne vibhishani indrapatni vyapini
    sarasija iha | vayumati jalashayani svaya ndharaja satyanto parimedini soparidhattangaya || vishnupatni
    mmadhavapriyam | lakshmi nnamamyacyutavallabham || o ndhanurdharayai vidmahe sarvasiddhyai ca dhimahi
    | tanno dhara pracodaya t | shrinvanti shronamamritasya gopa mpunyamasya upashrinomi vaca vi~shnupatni
    majurya mpraticimenagm havisha yajamah || tredha vishnu rurugayo vicakrame mahi mantariksham | tacchronaiti
    shrava icchamana punyagg shlokam ya~jamanaya krinvati || syonaprithivibhavanriksharaniveshani yacchanashsharma
    saprathah || aditirdeva gandharva manushyah pitaro surasteshagm sarva bhutana mmata medini mahata
    mahi | savitri gayatri jagatyurvi prithvi bahula vishva bhutakatamakayasa satyetyamriteti vasishthah
    || ikshushaliyavasasyaphaladhye parijata tarushobhitamule | svarna ratna mani mantapa madhye cintaye
    thsakala lokadharitrim || shyamam ntungapayodharanvitam | indivarakshi nnavashali manjarim shuka mbhajamahe
    || saktumiva titauna punanto yatra dhira manasa vaca makrata | atra sakhayassakhyani janate bhadraisham
    la~kshmirnihitadhivaci || om shanti
  devanagari: तैत्तिरीय ब्राह्मणम् म्भूमि॑र्भू॒म्ना द्यौर्व॑रि॒णा म्महि॒त्वा । उ॒पस्थे॑ ते देव्यदिते॒
    म॒न्नाद्या॒याद॑धे ॥ आ ऽयङ्गौः पृश्नि॑रक्रमी॒ थ्सुवः॑ ॥ त्रि॒ग्ं॒शद्धाम॒ विरा॑जति॒ वाक्प॑त॒ङ्गाय॑ शिश्रिये
    । प्रत्य॑स्य वह॒द्युभिः॑ ॥ अ॒स्य प्रा॒णाद॑पान॒त्य॑न्तश्च॑रति रोच॒ना । व्य॑ख्य क्रु॒द्धः प॑रो॒वप॑म॒न्युना॒
    यदव॑र्त्या । सु॒कल्प॑मग्ने॒ तत्तव॒ पुन॒स्त्वोद्दी॑पयामसि ॥ यत्ते॑ म॒न्युप॑रोप्तस्य पृथि॒वी मनु॑दध्व॒से
    । आ॒दि॒त्या विश्वे॒ तद्दे॒वा वस॑वश्च स॒माभ॑रन्न् ॥ मे॒दिनी॑ दे॒वी व॒सुन्ध॑रा स्या॒द्वसु॑धा दे॒वी वा॒सवी
    । ब्र॒ह्म॒व॒र्च॒सः पि॑तृ॒णां श्रोत्र॒ ञ्चक्षु॒र्मनः॑ ॥ दे॒वी हि॑रण्यग॒र्भिणी॑ दे॒वी प्र॑सो॒दरी । सद॑ने
    स॒त्याय॑ने सीद । स॒मु॒द्रव॑ती सावि॒त्री आह॒नो दे॒वी म॒ह्य॑ङ्गी ऽत्य॑तिष्ठत् ॥ शृ॒ङ्गे शृ॑ङ्गे य॒ज्ञे
    य॑ज्ञे विभी॒षणी इन्द्र॑पत्नी व्या॒पिनी॒ सर॑सिज इ॒ह । वा॒यु॒मती॑ ज॒लशय॑नी स्व॒य न्धा॒राजा॑ स॒त्यन्तो॒
    परि॑मेदिनी सो॒परि॑धत्तङ्गाय ॥ वि॒ष्णु॒प॒त्नी म्मा॑धव॒प्रियाम् । लक्ष्मी न्न॒मा॒म्यच्यु॑तव॒ल्लभाम्
    ॥ ओ न्ध॒नु॒र्ध॒रायै॑ वि॒द्महे॑ सर्वसि॒द्ध्यै च॑ धीमहि । तन्नो॑ धरा प्रचो॒दया त् । शृ॒ण्वन्ति॑ श्रो॒णाममृत॑स्य
    गो॒पा म्पुण्या॑मस्या॒ उप॑शृणोमि॒ वाच विँष्णु॑पत्नी मजू॒र्या म्प्रती॒ची॑मेनाग्ं ह॒विषा॑ यजामः ॥ त्रे॒धा
    विष्णु॑ रुरुगा॒यो विच॑क्रमे म॒ही म॒न्तरि॑क्षम् । तच्छ्रो॒णैति श्रव॑ इ॒च्छमा॑ना पुण्य॒ग्ग्॒ श्लोकं॒
    यँज॑मानाय कृण्व॒ती ॥ स्यो॒नापृ॑थिवि॒भवा॑नृक्ष॒रानि॒वेश॑नी यच्छा॑न॒श्शर्म॑ स॒प्रथाः ॥ अदि॑तिर्दे॒वा
    ग॑न्ध॒र्वा म॑नु॒ष्याः पि॒तरो सु॑रास्तेषाग्ं स॒र्व भू॒ता॒ना म्मा॒ता मे॒दिनी॑ महता म॒ही । सावि॒त्री
    गा॑य॒त्री जग॑त्यु॒र्वी पृ॒थ्वी ब॑हुला॒ विश्वा॑ भू॒ताक॒तमाकायासा स॒त्येत्य॒मृते॑ति वसि॒ष्ठः ॥ इक्षुशालियवसस्यफलाढ्ये
    पारिजात तरुशोभितमूले । स्वर्ण रत्न मणि मण्टप मध्ये चिन्तये थ्सकल लोकधरित्रीम् ॥ श्यामां न्तुङ्गपयोधरान्विताम्
    । इन्दीवराक्षी न्नवशालि मञ्जरीं शुक म्भजामहे ॥ सक्तु॑मिव॒ तित॑उना पुनन्तो॒ यत्र॒ धीरा॒ मन॑सा॒ वाच॒
    मक्र॑त । अत्रा॒ सखा॑यस्स॒ख्यानि॑ जानते भ॒द्रैषां लँ॒क्ष्मीर्नि॑हि॒ताधि॑वा॒चि ॥ ॐ शान्ति॒
