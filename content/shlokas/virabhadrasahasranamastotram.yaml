id: virabhadrasahasranamastotram
category: sahasranama
name:
  english: virabhadrasahasranamastotram
  devanagari: वीरभद्रसहस्रनामस्तोत्रम्
content:
  english: ringararasajanmabhuh | bhringitandavasantushtho mangalo mangalapradah || 89|| muktendranilatatanko
    muktaharavibhushitah | saktasajjanasadbhavo bhuktimuktiphalapradah || 90|| surupah sundarah shukladharmah
    sukritavigrahah | jitamaradrumah sarvadevaradasamekshanah || 91|| divaspatisahasrakshavikshanavaḻitoshakah
    | divyanamamritaraso divakarapatih prabhuh || 92|| pavakapranasanmitram prakhyatordhvajvalanmahah
    | prakrishtabhanuh purushah purodashabhugishvarah || 93|| samavarti pitripatirdharmaratshamano yami
    | pitrikananasantushto bhutanayakanayakah || 94|| nayanvitah surapatirnanapunyajanashrayah | nairrityadi
    maharakshasendrastutayasho'mbudhih || 95|| pracetajivanapatirdhritapasho digishvarah | dhirodaragunambhodhikaustubho
    bhuvaneshvarah || 96|| sadanubhogasampurnasauhardah sumanojjvalah | sadagatih sararasah sajagatpranajivanah
    || 97|| rajarajah kinnareshah kailasastho dhanapradah | yaksheshvarasakhah kukshinikshiptanekavismayah
    || 98|| ishanah sarvavidyanamishvaro vrishalanchanah | indradidevavilasanmauliramyapadambujah || 99||
    vishvakarma''shrayo vishvatobahurvishvatomukhah | vishvatah pramado vishvanetro vishveshvaro vibhuh
    || 100|| siddhantah siddhasankalpah siddhagandharvasevitah | siddhitah shuddhahridayah sadyojatananashshivah
    || 101|| shrimayah shrikatakshangah shrinama shriganeshvarah | shridah shrivamadevasyah shrikanthah
    shripriyankarah || 102|| ghoraghadhvantamartando ghoretaraphalapradah | ghoraghoramahayantrarajo ghoramukhambujah
    || 103|| tatah sushira suprita tattvadyagamajanmabhuh | tattvamasyadi vakyarthastatpurvamukhamanditah
    || 104|| ashapashavinirmuktah sheshabhushanabhushitah | doshakaralasanmaulirishanamukhanirmalah ||
    105|| pancavaktro dashabhujah pancashadvarnanayakah | pancaksharayutah pancah panca panca sulocanah
    || 106|| varnashramaguruh sarvavarnadharah priyankarah | karnikararka duttura purnapujaphalapradah
    || 107|| yogindrahridayanando yogi yogavidam varah | yogadhyanadisantushto ragadirahito ramah || 108||
    bhavambhodhiplavo bandhamocako bhadradayakah | bhaktanurakto bhavyah sadbhaktido bhaktibhavanah ||
    109|| anadinidhano'bhishto bhimakanto'rjuno balah | aniruddhah satyavadi sadanandashrayo'naghah ||
    110|| alayah sarvavidyanamadharah sarvakarmanam | alokah sarvalokanamavirbhavo mahatmanam || 111||
    ijyapurteshtaphaladah icchashaktyadi samshrayah | inah sarvamararadhya ishvaro jagadishvarah || 112||
    rundapingalamadhyastho rudrakshancitakandharah | runditadharabhaktyadiriditah savanashanah || 113||
    uruvikramabahulya urvyadharo dhurandharah | uttarottarakalyana uttamottamanayakah || 114|| urujanutadidvrinda
    urdhvareta manoharah | uhitanekavibhava uhitamnayamandalah || 115|| rishishvarastutiprito rishivakyapratishthitah
    | rigadi nigamadharo rijukarma manojavah || 116|| rupadi vishayadharo rupatito rishishvarah | rupalavanyasamyukto
    rupanandasvarupadhrit || 117|| lulitanekasangramo lupyamanaripuvrajah | luptakrurandhako varo lukarancitayantradhrit
    || 118|| lukaradi vyadhiharo lusvarancitayantrayuk | lushadi girishah pakshah khalavacamagocarah ||
    119|| eshyamano natajana ekaccito dridhavratah | ekaksharamahabija ekarudro'dvitiyakah || 120|| aishvaryavarnanamanga
    aishvaryaprakarojjvalah | airavanadi lakshmisha aihikamushmikapradah || 121|| oshadhishashikharatna
    onkaraksharasamyutah | okah sakaladevanamojorashirajadyajah || 122|| audaryajivanapara aucityamanijanmabhuh
    | udasinaikagirisha utsavotsavakaranau || 123|| angikritashadanganga angaharamahanatah | angajangajabhasmango
    mangalayatavigrahah || 124|| kah kim tvadanu deveshah kah kinnu varadapradah | kah kinnu bhaktasantapaharah
    karunyasagarah || 125|| stotavyah stotumicchunam mantavyah sharanarthinam | dhyeyo dhyanaikanishthanam
    dhamnah paramapurakah || 126|| bhaganetraharah putah sadhudushakabhushanah | bhadrakaḻimanorajo hamsah
    satkarmasarathih || 127|| sabhyah sadhuh sabharatnam saundaryagirishekharah | sukumarah saukhyakarah
    sahishnuh sadhyasadhanam || 128|| nirmatsaro nishprapanco nirlobho nirguno nayah | vitabhimano nirjato
    niratanko niranjanah || 129|| kalatrayah kaliharo netratrayavirajitah | agnitrayanibhangashca bhasmikritapuratrayah
    || 130|| kritakaryo vratadharo vratanashah pratapavan | nirastadurvidhirnirgatasho nirvananiradhih
    || 131|| nidhanam sarvahetunam nishcitartheshvareshvarah | advaitashambhavamaho sanirvyajordhvalocanah
    || 132|| apurvapurvah paramah sapurvah purvapurvadik | atindriyah satyanidhirakhandanandavigrahah
    || 133|| adidevah prasannatma aradhakajaneshtadah | sarvadevamayah sarvah jagadvyasah sulakshanah
    || 134|| sarvantaratma sadrishah sarvalokaikapujitah | puranapurushah punyah punyashlokah sudhamayah
    || 135|| purvaparajnah purajit purvadevamararcitah | prasannadarshitamukhah pannagavaḻibhushanah ||
    136|| prasiddhah pranatadharah pralayodbhutakaranam | jyotirmayo jvaladdamshtro jyotirmalavaḻivritah
    || 137|| jajjvalyamano jvalananetro jaladharadyutih | kripambhorashiramlano vakyapushto'parajitah
    || 138|| kshapakararkakotiprabhakarah karunakarah | ekamurtistridhamurtirdivyamurtiranakulah || 139||
    anantamurtirakshobhyah kripamurtih sukirtidhrit | akalpitamaratarurakamitasukamadhuk || 140|| acintitamahacintamanirdevashikhamanih
    | atindriyo'jitah pramshurbrahmavishnvadivanditah || 141|| hamso maricirbhimashca ratnasanusharasanah
    | sambhavo'tindriyo vaidyo vishvarupi niranjanah || 142|| vasudah subhujo naikamayo'vyayah pramadanah
    | agado rogaharta ca sharasanavisharadah || 143|| mayavishvadano vyapi pinakakarasambhavah | manovego
    manorupi purnah purushapungavah || 144|| shabdadigo gabhiratma komalangah prajagarah | trikalajno
    munih sakshi paparih sevakapriyah || 145|| uttamah sattvikah satyah satyasandho nirakulah | raso rasajno
    sarajno lokasaro rasatmakah || 146|| pushadantabhidavyagro dakshayajnanishudanah | devagranih shivadhyanatatparah
    paramah shubhah || 147|| jayo jayadih sarvaghashamano bhavabhanjanah | alankarishnuracalo rocishnurvikramottamah
    || 148|| shabdagah pranavo vayuramshumananilatapahrit | vayuramshumananala nirisho nirvikalpashca
    cidrupo jitasadhvasah || 149|| uttarano dushkritiha durdharsho dussaho'bhayah | nakshatramali nakeshah
    svadhishthanashadashrayah || 150|| akayo bhaktakayasthah kalajnani mahanatah | amshuh shabdapatiryogi
    pavanah shikhisarathih || 151|| vasanto madhavo grishmah pavanah pavano'malah | varurvishalyacaturah
    shivacatvarasamsthitah || 152|| atmayogah samamnayatirthadehah shivalayah | mundo virupo vikritirdando
    danto gunottamah || 153|| devasuragururdevo devasuranamaskritah | devasuramahamantro devasuramahashrayah
    || 154|| divo'cintyo devata''tma isho'nisho nagagragah | nandishvaro nandisakho nandistutaparakramah
    || 155|| nagno nagavratadharah pralayakararupadhrit | seshvarah svargadah svargah svarah sarvamayah
    svanah || 156|| bijadhyaksho bijakarta dharmakriddharmavardhanah | dakshayajnamahadveshi vishnukandharapatanah
    || 157|| dhurjatih khandaparashuh sakalo nishkalo'samah | mrido natah purayita punyakruro manojavah
    || 158|| sadbhutah satkritah shantah kalakuto mahanaghah | arthanartho mahakayo naikakarmasamanjasah
    || 159|| bhushayo bhushano bhutirbhushano bhutavahanah | shikhandi kavaci shuli jati mundi ca kundali
    || 160|| mekhali musali khadgi kankanikritavasukih || 161|| uttarabhagam | etatsahasranamankam virabhadrasya
    kirtanam | ekaikaksharamahatmyam mahapatakanashanam || 162|| mahavyadhiharam mrityudaridryatimiranjanam
    | mahasamsarajaladhimagnottarananavikah || 163 dharmarthakamamokshanam nijageham nirargalam | karmabhakticidanandam
    kandakaranakandakam || 164|| rasam rasayanam divyam namamritarasam narah | sha
  devanagari: ृङ्गाररसजन्मभूः । भृङ्गीताण्डवसन्तुष्ठो मङ्गलो मङ्गलप्रदः ॥ ८९॥ मुक्तेन्द्रनीलताटङ्को मुक्ताहारविभूषितः
    । सक्तसज्जनसद्भावो भुक्तिमुक्तिफलप्रदः ॥ ९०॥ सुरूपः सुन्दरः शुक्लधर्मः सुकृतविग्रहः । जितामरद्रुमः
    सर्वदेवराडसमेक्षणः ॥ ९१॥ दिवस्पतिसहस्राक्षवीक्षणावळितोषकः । दिव्यनामामृतरसो दिवाकरपतिः प्रभुः ॥ ९२॥
    पावकप्राणसन्मित्रं प्रख्यातोर्ध्वज्वलन्महः । प्रकृष्टभानुः पुरुषः पुरोडाशभुगीश्वरः ॥ ९३॥ समवर्ती पितृपतिर्धर्मराट्शमनो
    यमी । पितृकाननसन्तुष्टो भूतनायकनायकः ॥ ९४॥ नयान्वितः सुरपतिर्नानापुण्यजनाश्रयः । नैरृत्यादि महाराक्षसेन्द्रस्तुतयशोऽम्बुधिः
    ॥ ९५॥ प्रचेताजीवनपतिर्धृतपाशो दिगीश्वरः । धीरोदारगुणाम्भोधिकौस्तुभो भुवनेश्वरः ॥ ९६॥ सदानुभोगसम्पूर्णसौहार्दः
    सुमनोज्ज्वलः । सदागतिः साररसः सजगत्प्राणजीवनः ॥ ९७॥ राजराजः किन्नरेशः कैलासस्थो धनप्रदः । यक्षेश्वरसखः
    कुक्षिनिक्षिप्तानेकविस्मयः ॥ ९८॥ ईशानः सर्वविद्यानामीश्वरो वृषलाञ्छनः । इन्द्रादिदेवविलसन्मौलिरम्यपदाम्बुजः
    ॥ ९९॥ विश्वकर्माऽऽश्रयो विश्वतोबाहुर्विश्वतोमुखः । विश्वतः प्रमदो विश्वनेत्रो विश्वेश्वरो विभुः ॥
    १००॥ सिद्धान्तः सिद्धसङ्कल्पः सिद्धगन्धर्वसेवितः । सिद्धितः शुद्धहृदयः सद्योजाताननश्शिवः ॥ १०१॥ श्रीमयः
    श्रीकटाक्षाङ्गः श्रीनामा श्रीगणेश्वरः । श्रीदः श्रीवामदेवास्यः श्रीकण्ठः श्रीप्रियङ्करः ॥ १०२॥ घोराघध्वान्तमार्ताण्डो
    घोरेतरफलप्रदः । घोरघोरमहायन्त्रराजो घोरमुखाम्बुजः ॥ १०३॥ ततः सुषिर सुप्रीत तत्त्वाद्यागमजन्मभूः ।
    तत्त्वमस्यादि वाक्यार्थस्तत्पूर्वमुखमण्डितः ॥ १०४॥ आशापाशविनिर्मुक्तः शेषभूषणभूषितः । दोषाकरलसन्मौलिरीशानमुखनिर्मलः
    ॥ १०५॥ पञ्चवक्त्रो दशभुजः पञ्चाशद्वर्णनायकः । पञ्चाक्षरयुतः पञ्चः पञ्च पञ्च सुलोचनः ॥ १०६॥ वर्णाश्रमगुरुः
    सर्ववर्णाधारः प्रियङ्करः । कर्णिकारार्क दुत्तूर पूर्णपूजाफलप्रदः ॥ १०७॥ योगीन्द्रहृदयानन्दो योगी योगविदां
    वरः । योगध्यानादिसन्तुष्टो रागादिरहितो रमः ॥ १०८॥ भवाम्भोधिप्लवो बन्धमोचको भद्रदायकः । भक्तानुरक्तो
    भव्यः सद्भक्तिदो भक्तिभावनः ॥ १०९॥ अनादिनिधनोऽभीष्टो भीमकान्तोऽर्जुनो बलः । अनिरुद्धः सत्यवादी सदानन्दाश्रयोऽनघः
    ॥ ११०॥ आलयः सर्वविद्यानामाधारः सर्वकर्मणाम् । आलोकः सर्वलोकानामाविर्भावो महात्मनाम् ॥ १११॥ इज्यापूर्तेष्टफलदः
    इच्छाशक्त्यादि संश्रयः । इनः सर्वामराराध्य ईश्वरो जगदीश्वरः ॥ ११२॥ रुण्डपिङ्गलमध्यस्थो रुद्राक्षाञ्चितकन्धरः
    । रुण्डिताधारभक्त्यादिरीडितः सवनाशनः ॥ ११३॥ उरुविक्रमबाहुल्य उर्व्याधारो धुरन्धरः । उत्तरोत्तरकल्याण
    उत्तमोत्तमनायकः ॥ ११४॥ ऊरुजानुतडिद्वृन्द ऊर्ध्वरेता मनोहरः । ऊहितानेकविभव ऊहिताम्नायमण्डलः ॥ ११५॥
    ऋषीश्वरस्तुतिप्रीतो ऋषिवाक्यप्रतिष्ठितः । ॠगादि निगमाधारो ऋजुकर्मा मनोजवः ॥ ११६॥ रूपादि विषयाधारो
    रूपातीतो ऋषीश्वरः । रूपलावण्यसम्युक्तो रूपानन्दस्वरूपधृत् ॥ ११७॥ लुलितानेकसङ्ग्रामो लुप्यमानरिपुव्रजः
    । लुप्तक्रूरान्धको वारो लूकाराञ्चितयन्त्रधृत् ॥ ११८॥ लूकारादि व्याधिहरो लूस्वराञ्चितयन्त्रयुक् । लूशादि
    गिरिशः पक्षः खलवाचामगोचरः ॥ ११९॥ एष्यमाणो नतजन एकच्चितो दृढव्रतः । एकाक्षरमहाबीज एकरुद्रोऽद्वितीयकः
    ॥ १२०॥ ऐश्वर्यवर्णनामाङ्ग ऐश्वर्यप्रकरोज्ज्वलः । ऐरावणादि लक्ष्मीश ऐहिकामुष्मिकप्रदः ॥ १२१॥ ओषधीशशिखारत्न
    ओङ्काराक्षरसम्युतः । ओकः सकलदेवानामोजोराशिरजाद्यजः ॥ १२२॥ औदार्यजीवनपर औचित्यमणिजन्मभूः । उदासीनैकगिरिश
    उत्सवोत्सवकारणौ ॥ १२३॥ अङ्गीकृतषडङ्गाङ्ग अङ्गहारमहानटः । अङ्गजाङ्गजभस्माङ्गो मङ्गलायतविग्रहः ॥ १२४॥
    कः किं त्वदनु देवेशः कः किन्नु वरदप्रदः । कः किन्नु भक्तसन्तापहरः कारुण्यसागरः ॥ १२५॥ स्तोतव्यः स्तोतुमिच्छूनां
    मन्तव्यः शरणार्थिनाम् । ध्येयो ध्यानैकनिष्ठानां धाम्नः परमपूरकः ॥ १२६॥ भगनेत्रहरः पूतः साधुदूषकभूषणः
    । भद्रकाळिमनोराजो हंसः सत्कर्मसारथिः ॥ १२७॥ सभ्यः साधुः सभारत्नं सौन्दर्यगिरिशेखरः । सुकुमारः सौख्यकरः
    सहिष्णुः साध्यसाधनम् ॥ १२८॥ निर्मत्सरो निष्प्रपञ्चो निर्लोभो निर्गुणो नयः । वीताभिमानो निर्जातो निरातङ्को
    निरञ्जनः ॥ १२९॥ कालत्रयः कलिहरो नेत्रत्रयविराजितः । अग्नित्रयनिभाङ्गश्च भस्मीकृतपुरत्रयः ॥ १३०॥ कृतकार्यो
    व्रतधरो व्रतनाशः प्रतापवान् । निरस्तदुर्विधिर्निर्गताशो निर्वाणनीरधिः ॥ १३१॥ निधानं सर्वहेतूनां निश्चितार्थेश्वरेश्वरः
    । अद्वैतशाम्भवमहो सनिर्व्याजोर्ध्वलोचनः ॥ १३२॥ अपूर्वपूर्वः परमः सपूर्वः पूर्वपूर्वदिक् । अतीन्द्रियः
    सत्यनिधिरखण्डानन्दविग्रहः ॥ १३३॥ आदिदेवः प्रसन्नात्मा आराधकजनेष्टदः । सर्वदेवमयः सर्वः जगद्व्यासः
    सुलक्षणः ॥ १३४॥ सर्वान्तरात्मा सदृशः सर्वलोकैकपूजितः । पुराणपुरुषः पुण्यः पुण्यश्लोकः सुधामयः ॥ १३५॥
    पूर्वापरज्ञः पुरजित् पूर्वदेवामरार्चितः । प्रसन्नदर्शितमुखः पन्नगावळिभूषणः ॥ १३६॥ प्रसिद्धः प्रणताधारः
    प्रलयोद्भूतकारणम् । ज्योतिर्मयो ज्वलद्दंष्ट्रो ज्योतिर्मालावळीवृतः ॥ १३७॥ जाज्ज्वल्यमानो ज्वलननेत्रो
    जलधरद्युतिः । कृपाम्भोराशीरम्लानो वाक्यपुष्टोऽपराजितः ॥ १३८॥ क्षपाकरार्ककोटिप्रभाकरः करुणाकरः । एकमूर्तिस्त्रिधामूर्तिर्दिव्यमूर्तिरनाकुलः
    ॥ १३९॥ अनन्तमूर्तिरक्षोभ्यः कृपामूर्तिः सुकीर्तिधृत् । अकल्पितामरतरुरकामितसुकामधुक् ॥ १४०॥ अचिन्तितमहाचिन्तामणिर्देवशिखामणिः
    । अतीन्द्रियोऽजितः प्रांशुर्ब्रह्मविष्ण्वादिवन्दितः ॥ १४१॥ हंसो मरीचिर्भीमश्च रत्नसानुशरासनः । सम्भवोऽतीन्द्रियो
    वैद्यो विश्वरूपी निरञ्जनः ॥ १४२॥ वसुदः सुभुजो नैकमायोऽव्ययः प्रमादनः । अगदो रोगहर्ता च शरासनविशारदः
    ॥ १४३॥ मायाविश्वादनो व्यापी पिनाककरसम्भवः । मनोवेगो मनोरुपी पूर्णः पुरुषपुङ्गवः ॥ १४४॥ शब्दादिगो गभीरात्मा
    कोमलाङ्गः प्रजागरः । त्रिकालज्ञो मुनिः साक्षी पापारिः सेवकप्रियः ॥ १४५॥ उत्तमः सात्त्विकः सत्यः सत्यसन्धो
    निराकुलः । रसो रसज्ञो सारज्ञो लोकसारो रसात्मकः ॥ १४६॥ पूषादन्तभिदव्यग्रो दक्षयज्ञनिषूदनः । देवाग्रणीः
    शिवध्यानतत्परः परमः शुभः ॥ १४७॥ जयो जयादिः सर्वाघशमनो भवभञ्जनः । अलङ्करिष्णुरचलो रोचिष्णुर्विक्रमोत्तमः
    ॥ १४८॥ शब्दगः प्रणवो वायुरंशुमाननिलतापहृत् । वायुरंशुमाननल निरीशो निर्विकल्पश्च चिद्रूपो जितसाध्वसः
    ॥ १४९॥ उत्तारणो दुष्कृतिहा दुर्धर्षो दुस्सहोऽभयः । नक्षत्रमाली नाकेशः स्वाधिष्ठानषडाश्रयः ॥ १५०॥ अकायो
    भक्तकायस्थः कालज्ञानी महानटः । अंशुः शब्दपतिर्योगी पवनः शिखिसारथिः ॥ १५१॥ वसन्तो माधवो ग्रीष्मः पवनः
    पावनोऽमलः । वारुर्विशल्यचतुरः शिवचत्वरसंस्थितः ॥ १५२॥ आत्मयोगः समाम्नायतीर्थदेहः शिवालयः । मुण्डो
    विरूपो विकृतिर्दण्डो दान्तो गुणोत्तमः ॥ १५३॥ देवासुरगुरुर्देवो देवासुरनमस्कृतः । देवासुरमहामन्त्रो
    देवासुरमहाश्रयः ॥ १५४॥ दिवोऽचिन्त्यो देवताऽऽत्मा ईशोऽनीशो नगाग्रगः । नन्दीश्वरो नन्दिसखो नन्दिस्तुतपराक्रमः
    ॥ १५५॥ नग्नो नगव्रतधरः प्रलयाकाररूपधृत् । सेश्वरः स्वर्गदः स्वर्गः स्वरः सर्वमयः स्वनः ॥ १५६॥ बीजाध्यक्षो
    बीजकर्ता धर्मकृद्धर्मवर्धनः । दक्षयज्ञमहाद्वेषी विष्णुकन्धरपातनः ॥ १५७॥ धूर्जटिः खण्डपरशुः सकलो निष्कलोऽसमः
    । मृडो नटः पूरयिता पुण्यक्रूरो मनोजवः ॥ १५८॥ सद्भूतः सत्कृतः शान्तः कालकूटो महानघः । अर्थानर्थो महाकायो
    नैककर्मसमञ्जसः ॥ १५९॥ भूशयो भूषणो भूतिर्भूषणो भूतवाहनः । शिखण्डी कवची शूली जटी मुण्डी च कुण्डली ॥
    १६०॥ मेखली मुसली खड्गी कङ्कणीकृतवासुकिः ॥ १६१॥ उत्तरभागम् । एतत्सहस्रनामाङ्कं वीरभद्रस्य कीर्तनम्
    । एकैकाक्षरमाहात्म्यं महापातकनाशनम् ॥ १६२॥ महाव्याधिहरं मृत्युदारिद्र्यतिमिराञ्जनम् । महासंसारजलधिमग्नोत्तारणनाविकः
    ॥ १६३ धर्मार्थकाममोक्षाणां निजगेहं निरर्गलम् । कर्मभक्तिचिदानन्दं कन्दकारणकन्दकम् ॥ १६४॥ रसं रसायनं
    दिव्यं नामामृतरसं नरः । श
