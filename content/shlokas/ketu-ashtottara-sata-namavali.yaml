    । ॐ उपरागखेचराय नमः । ॐ अतिपुरुषकर्मणे नमः ॥ ॥ ॐ तुरीये सुखप्रदाय नमः । ॐ तृतीये वैरदाय नमः । ॐ पापग्रहाय
    नमः । ॐ स्फोटककारकाय नमः । ॐ प्राणनाथाय नमः । ॐ पञ्चमे श्रमकारकाय नमः । ॐ द्वितीयेऽस्फुटवग्दात्रे
    नमः । ॐ विषाकुलितवक्त्रकाय नमः । ॐ कामरूपिणे नमः । ॐ सिंहदन्ताय नमः ॥ ॥ ॐ सत्ये अनृतवते नमः । ॐ चतुर्थे
