id: lakshmikritam1narayanastotram
category: stotram
name:
  english: lakshmikritam1narayanastotram
  devanagari: लक्ष्मीकृतं१नारायणस्तोत्रम्
content:
  english: lakshmikritam 1 narayanastotram shrilakshmiruvaca | kalo maya tatha''tmanah shaktayah santi
    yasya tah | namastasmai bhagavate shaktisvamiparatmane || 1|| yoginiphaladatre te yogapunyaphalatmane
    | yogilabhyaya yogaya yoginipataye namah || 2|| tvameva phaladata'si tvameva'si ca muktikrit | tvameva'dhipatishcasi
    namastasmai mahatmane || 3|| sarvadevasvarupastvam sarvatirthatmako'si ca | sarvavratatmakastvam vai
    tasmai sarvatmane namah || 4|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 253
  devanagari: लक्ष्मीकृतं १ नारायणस्तोत्रम् श्रीलक्ष्मीरुवाच । कालो माया तथाऽऽत्मानः शक्तयः सन्ति यस्य
    ताः । नमस्तस्मै भगवते शक्तिस्वामिपरात्मने ॥ १॥ योगिनीफलदात्रे ते योगपुण्यफलात्मने । योगिलभ्याय योगाय
    योगिनीपतये नमः ॥ २॥ त्वमेव फलदाताऽसि त्वमेवाऽसि च मुक्तिकृत् । त्वमेवाऽधिपतिश्चासि नमस्तस्मै महात्मने
    ॥ ३॥ सर्वदेवस्वरूपस्त्वं सर्वतीर्थात्मकोऽसि च । सर्वव्रतात्मकस्त्वं वै तस्मै सर्वात्मने नमः ॥ ४॥ इति
    श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने २५३
meaning: {}
