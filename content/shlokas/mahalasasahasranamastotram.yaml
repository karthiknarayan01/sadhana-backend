id: mahalasasahasranamastotram
category: sahasranama
name:
  english: mahalasasahasranamastotram
  devanagari: महालसासहस्रनामस्तोत्रम्
content:
  english: onkararupa namya ca nayananandadayini | nitya natipriya nanda mahadevi maheshvari || 1|| mahalasa
    vishnushaktirmahamaya mahalaya | siddhirdhiramrita nanda''nanda''kutiranindita || 2|| adhya''rya'bhaya'shakya'jaya'jeya'mala'mara
    | amurtiraditishcarya''dityamata'guna'vanih || 3|| anandinyasuraghnyarci rupavatyamritaprasuh | akararupa'yodhya'suracchidamaravallabha
    || 4|| akhanditayuranagha calirajirahaskara | amayaghnyalaka'neka cahalya'bhitirakshaya || 5|| annapurna'nasuya'grya'shubhaghni
    cajavandita | adya'bhayaprada'rupa'jara camalavigraha || 6|| aradhya''shapuri cartinashinyamaravandita
    | anakara'tula'bhishta cashesha'bhipsitaprada || 7|| aprameya'runa'lakshya'dvaita'murta'cyuta''kritih
    | ashtasiddhiprada'narghyakaustubha muktakandhara || 8|| anantashaktirajneya canurupa'runakritih |
    avacya'nantarupa capurva'nadyadirishvari || 9|| ishteshtada tathendrani cesheshanindramohini | ileshanamadaghni
    ca ishanavaradendira || 10|| iccheshatphullakamalalocanendivaraprada | idebhasyanuteshanapriya cendunibhanana
    || 11|| idendradistutendrani varadedyendireshvari | uttamotkrishtavarnorvi comorvashyudayaprabha ||
    12|| utirudyadbhanukotiprabha cobhayatomukhi | uragendrashayotkelirurushaktiruruprada || 13|| urdhvakeshi
    corudeha coshthoddhritavasundhara | urnavasonnatakararuponnaddhamadapaha || 14|| rituparnarcita riddhirritupushpa
    likarika | ekaishvaryaprada caindri caindavyonkarasamsthita || 15|| oshadhyannapradatri ca aushadhishcaurvavandita
    | antarvatyambika cambalikambudhishayambudhih || 16|| antakaghni cantakartri cantimantakarupini |
    ambudambarasamsthanka casheshasvarabhushita || 17|| kamya kamaprada krishna kalyani kalpakarini |
    kali kala kalihara kashih kalimalapaha || 18|| kambugriva kalakelih kamalakshi kalanidhih | kaveri
    kulakanta ca kaumari kalika katha || 19|| ketaki kulaja kanya kalakanthi kavitvada | kamabijavati
    kantih kotih kelih kuhu kritih || 20|| kamala kalabhorushca kamakshi kamaniyabhruh | kalankarahita
    kanta kushala kutilalaka || 21|| kashtha kala kurukshetrabhumih kalitadanava | kulya kalavati kirtih
    keshighni kirtidayini || 22|| kaviprita ca karuna kripa kashmiravasini | kadambari kalarava kucamandalamandita
    || 23|| kaushikikritamala ca kaushambi koshavardhini | kushavarta kamadhenuh kapila ca kulodbhava
    || 24|| kunkumankitadeha ca kumari kunkumaruna | kashapushpapratikasha kalamari ca kalika || 25||
    kirana kalpalatika kalpasankhya kumudvati | kashyapi kutuka kudhra krishangi kayavarjita || 26|| kamini
    kuntahasta ca kulavidya ca kauliki | kavyashaktih kelipara kalaha kantilocana || 27|| kanci kanakadhara
    ca kalih kanakakundala | kamalasragdhara kamavarada kamalakritih || 28|| kancikalaparamya ca kamalasanasamstuta
    | kambija kautsavarada kamarupanivasini || 29|| khadgini khadgahasta ca khatvangavaradharini | khetahasta
    khadgadhara khanih khastha khalapaha || 30|| khagamata khagakhyatih khagendravaravahana | khurabhighatasainyaghni
    khecari khetakamada || 31|| kharadushanahantri ca kharasparsha kharupini | gita gitapriya gitirgayatri
    gautamiguruh || 32|| gunadhyaksha gunavati gopicandanacarcita | ganga gopti gunadhya gaurganesha gishca
    gopika || 33|| govardhanadhara gurvi gokulabhayadayini | gandaki gautami gatha gaya gauri ganeshasuh
    || 34|| godavari gosvarupa gautamakhyamunistuta | ganapriya ca gambhira geya gandharvasevita || 35||
    gandharvi gitakirtishca geyavidyavisharada | gambhiranabhirgarima gunarupa gunoddhata || 36|| gopalarupini
    goshthi gahana godhanaprada | gandhapriya gopasakhi garudi gohita gatih || 37|| gopya gurutama gamya
    goda gurusutaprada | ghantanadapriya ghora ghoradaityavinashini || 38|| ghanta ghoravapurdhrishtadaityavakshasthala
    ghrinih | ghatastani ghantika ca ghatoghni ghatajanmasuh || 39|| ghosha ghritahutirghasa ghoraghargharanadini
    | nkarakritisamvishta catushkonasabinduka || 40|| carushcandraprabha cancushcaturashramapujita | caturvedamayi
    cittishcitsvarupa caracara || 41|| citrini cakrini citra citrabharanabhushita | canuramardini canda
    candahartri ca candika || 42|| cidatmika caturvargaphalada caturakritih | cakorakshi caruhasa camari
    caturanana || 43|| catuhshashtihshrisutantrapujaniya ca citsukha | cintya cakshushcandrabhaga capala
    calakundala || 44|| catuhshashtikalajnanadayini cakshushi manuh | carmanvati candrika ca candramata
    ca capini || 45|| chatrachaya chatravati chatrabuddhiprada chavih | chayagrahahara chaya chadmadaityavinashini
    || 46|| jaya jayanti jayada jagattrayahitaishini | jatarupamayi jyotsna janata jatavatsala || 47||
    jagati jangama jyeshtha janmada jvalitadyutih | jagajjiva jagadvandya jaramrityuvinashini || 48||
    jaitri jimutasankasha jivana jivanaprada | jitashvasa jitaratirjanitri janamohini || 49|| jalamurtirjagadbija
    janani janmanashini | jagaddhatri jitendra ca jyotirjaya janeshtada || 50|| jirna ca janamata ca janya
    janakanandini | jalandharahara jatirjanalokanivasini || 51|| jayajayya jayakari jarayurjavana javih
    | jambunadavibhusha ca jvala jambhavadhodyata || 52|| jhallari jhankrinirjhampa jhanajhjhanitanupura
    | jhankararupa jhatitivarada jharjhari jharih || 53|| nkarakritisamvyaktih karnikakusumakshara | tankahasta
    tankriti ca tika tankarabhishana || 54|| tharupa thakritirdimbha damari damarupriya | dhaukitasheshapatala
    dhundhipujya dharupini || 55|| nakarakrityanusyutebhadantakshamalini | tamraparni tirthamayi tapasi
    tapasapriya || 56|| trailokyapujita tara tripada tomara trutih | tantustrayitanustapi tripatha tryambakastuta
    || 57|| tula tamarasabhasya trilokastha trivikrama | tamaladalaruk tanvi taruni tamasi tari || 58||
    tattvatushta tattvarupa tamohantri trishaktidhrik | tapasvini tapoyukta tapasvikulavandita || 59||
    tapapahantri ca tarkshyamata triptistrapa trisha | tapahsiddhistaponishtha tripta tapitadanava ||
    60|| thathathaithaitharitharatalavidyavisharada | daya dayanidhirduhkhahantri danta druteshtada ||
    61|| datri dinartishamani daityadarpavinashini | dvaraka darapanirdrigdivya digdamitendriya || 62||
    daksha ca dakshina diksha dikshita dakshapujita | dirghakeshi dirghanidra dayalurdanujapaha || 63||
    daridryanashini dyaushca dinmandalavikasita | draupadi devamata ca durdharsha didhitiprada || 64||
    dashananahara dola dyutirdipta ditirdanuh | divagatirdarpahara diptapavakalocana || 65|| divyasaukhyaprada
    diptirdikpalavarada dasha | davagninashini dutirdevaduhkhavinashini || 66|| dharmada dhanada dhara
    dharadhara dhanurdhara | dhenuka dhvajini dhira dhulirdhvantahara dhvanih || 67|| dhyeya dhyana dhyanashila
    dhutapapa dhurandhara | dhritirdhurdharmiki dhurya dhanadhanyavivardhini || 68|| dharmishtha dharmaphalada
    dhyanagamya ca dharana | dharanirdhavala nitirnishtha nakagatiprada || 69|| nagarupa nagavalli nila
    nagendrapujita | narasimhi nadi nanda nandyavartapriya tatha || 70|| nidhirnidhipurastha ca nyayasurnyayakovida
    | nabhistuta nayavati narakartihari tatha || 71|| nabhirnasa nutananga narakaghni tatha nutih | nagapashadhara
    nitya nanamangaladayini || 72|| nari narayani nauka nilameghasamaprabha | nati nilambara nakrapothini
    nalini natih || 73|| nishumbhaghni narmada ca nakshatrakhya ca nandini | padmini padmakoshakshi pundalikavaraprada
    || 74|| puranaparama pritih preshtha pitambara para | punya prajna payoshni ca pampa padma payasvini
    || 75|| pivara purusha pushtih paramatmasvarupini | papaghni priyakartrica pavitra parameshvari ||
    76|| putrini paramananda padmahasta pikasvara | purusharthaprada praudha praptih parvatanandini ||
    77|| pativrata patimayi priya ca pritimanjari | patalavasini purtih pancali praninam prasuh || 78||
    parashaktih pashahasta prasiddha padmajarcita | pravaratirasamstha ca putrapautrapradayini || 79||
    pitamahi pitrimata praci purna paratmika | parapavadasamhantri patagendrakritasana || 8॰|| patagendrashaya
    pakahantri ca parashupriya | phanimata ca phalada phalabhuk phenadaityahrit || 81|| phullambujasana
    phulla phullapadmakara balih | balida balika bala badari balashalini || 82|| balabhadrapriya buddhirbahuda
    balisamstuta | balendushikhara bandi balagrahavinashini || 83|| brahmi brihattama bana brahmani brahmanaspatih
    | brihadbhanurbrahmarupa brahmastha ca brihaspatih || 84|| balasaukhyaprada lila banasurakarapaha
    | balimata brihaddhamni badarayanasamstuta || 85|| bhayaghni bhimarupa bhirbhutastha bhimanandini
    | bhutirbhavani bhayada bhishana bhavabhishana || 86|| bhupatirbhudharadhara bhutaveshanivasini |
    bhalanetra bhairavi ca bhutida bhramari bhramih || 87|| bhurbhuvahsvah svarupa ca bhima bhavabhayapaha
    | bhimabhrajanmanigriva bhratripujya ca bhargavi || 88|| bhrajishnurbhasura bhasya bhanukotisamaprabha
    | bhaktigamya bhramaghni ca bhaktakamaduha ca bhuh || 89|| bhavabhitihara bhavya bhrantirbhagavati
    mahi | mahalakshmirmahakali mahishasuraghatini || 90|| mattamatangagamana madhusudanarupini | madhupriya
    madhuravanmadhughni mathura madhuh || 91|| malatikusumarama madamantharagamini | matangi manada mata
    matrimandalavasini || 92|| maya manyapuri mukhya mokshada minarupini | mandarabhudharadhara mandarasragdhara
    makhih || 93|| matamahi matrimata madhyama manasi manuh | menakamunmahejya ca mohinimantradevata ||
    94|| madhusrava matirmedha manisha mrityumarika | mrigatvanma mrigakshi ca mohahantri manasvini ||
    95|| manepsitaprada mata madahrinmadirekshana | yamuna yamabhitighni yamalarjunamadhyaga || 96|| yamalokahara
    yamya yogini yamala yatih | yantroddharavati yatra yoganidra yamapriya || 97|| yashasvini yogigamya
    yogya yogijanapriya | yogangadhyanashila ca yajnabhuryajnavardhini || 98|| yogapattadhara yajna yajnanga
    yajnakamada | yajnarupa yajnakartri yattatpadanibandhini || 99|| yashoda yadavi yutiryuddhajna yaduvamshaja
    | yadavartihara yukta yakshini yavanardini || 100|| raktambaradhara rakta raktabijavadhodyata | ramani
    ramamurtishca ragini raktadantika || 101|| ratipriya ratikari raktakeshi ranapriya | raktakeyuravalaya
    ratiragavivardhini || 102|| rolambapurnamala ca ramaniya ramapatih | raka rakeshavadana ramya ranitanupura
    || 103|| rakshoghni ratidatri ca ragajna ragavallabha | ratnagarbha ratnanakhi rakshasi rajanipriya
    || 104|| ratri rajivanetra ca ranabhumi ranasthira | lakshmirlavanyarupa ca lalita lolalocana || 105||
    lilavati laksharupa lanka ca lavanodadhih | lankeshahantri lekha ca lankarajyaprada lata || 106||
    lila lilanaravapurlola lakshya lasattanuh | lavanasurasamhantri lekhya lavanyabhurlipih || 107|| lakshmana
    lakshanadhya ca lolarkaparipujita | varenya vasudha vira varishtha ca varaprada || 108|| vamana vaidiki
    vidyudvarahi vetravatyapi | vishvesha viramata ca virashrirvaishnavi vibhuh || 109|| vedirvedya vedita
    ca vishnumaya vasundhara | vyomahantri vishvarupa vidya vagvishvavedita || 110|| vriddhirvrittirvara
    vishva vyomarupa vashatkritih | vanamaladhara vyaptirvikhyata vimala vasuh || 111|| vyalarupa vaidyavidya
    vasishthi viryadayini | vatali varuni vishvaksena vacaspatirvadhuh || 112|| virincijanani vedamata
    vahnisvarupadhrik | vagura vadhurupa ca valihantri varapsara || 113|| shambhavi shambhujanani shambarasuraghatini
    | shambari shamani shantih shreshtha shrirshrikari shami || 114|| shatakumbhamayi shaktih shyama shilavati
    shiva | shalagramashila shita shrinidhih shrimatih shubha || 115|| shakambhari shucih shraddha shonakshi
    sheshavandita | shatakshi shabala shanta shasta shokavinashini || 116|| shatrumari shatrurupa sharadhanvadhara
    shrutih | sharadinduprabha shiksha shataghni shantidayini || 117|| shanmatrijanani shashthih shashtihayanarupini
    | shadangajna shadvikararahita shodashi kala | sarvajna sarvashaktishca sulabha sarayuh sakhi || 119||
    sukhada samagitishca smritih satya sama sati | sarani sundari sita subhadra ca sarasvati || 120||
    sushronih sumukhi saumya susparsha sumatih sudha | svacchanda subhaga sadhvi sutantuh suprabha samit
    || 121|| susprishta satviki sari sakalagamapujita | hamsa haihayasamhantri harshadatri haripriya ||
    122|| havirhaladhara hantri hrimbija haravandita | halahaladhara hora hayaga hatadanava || 123|| hayagrivatanurhaimi
    hamsojjvalashiroruha | hunkarahatadaityahirhayaghni hamsavahana || 124|| hahagitapriya havabhumirhasyapriya
    tatha | kshemankari kshitih kshirasamudrashayana kshama || 125|| jneya jnanasvarupa ca jnanada jnanadipika
    || 126|| || jnanadipika om nama iti || brahma uvaca
  devanagari: ओङ्काररूपा नम्या च नयनानन्ददायिनी । नित्या नतिप्रिया नन्दा महादेवी महेश्वरी ॥ १॥ महालसा
    विष्णुशक्तिर्महामाया महालया । सिद्धिर्धीरमृता नन्दाऽऽनन्दाऽऽकूतिरनिन्दिता ॥ २॥ आढ्याऽऽर्याऽभयाऽशक्याऽजयाऽजेयाऽमलाऽमरा
    । अमूर्तिरदितिश्चार्याऽऽदित्यमाताऽगुणाऽवनिः ॥ ३॥ आनन्दिन्यसुरघ्न्यर्ची रूपवत्यमृतप्रसूः । आकाररूपाऽयोध्याऽसुरच्छिदमरवल्लभा
    ॥ ४॥ अखण्डितायुरनघा चालिराजिरहस्करा । आमयघ्न्यलकाऽनेका चाहल्याऽभीतिरक्षया ॥ ५॥ अन्नपूर्णाऽनसूयाऽग्र्याऽशुभघ्नी
    चाजवन्दिता । आद्याऽभयप्रदाऽरूपाऽजरा चामलविग्रहा ॥ ६॥ आराध्याऽऽशापुरी चार्तिनाशिन्यमरवन्दिता । अनाकाराऽतुलाऽभीष्टा
    चाशेषाऽभीप्सितप्रदा ॥ ७॥ अप्रमेयाऽरुणाऽलक्ष्याऽद्वैताऽमूर्ताऽच्युताऽऽकृतिः । अष्टसिद्धिप्रदाऽनर्घ्यकौस्तुभा
    मुक्तकन्धरा ॥ ८॥ अनन्तशक्तिरज्ञेया चाणुरूपाऽरुणाकृतिः । अवाच्याऽनन्तरूपा चापूर्वाऽनाद्यादिरीश्वरी
    ॥ ९॥ इष्टेष्टदा तथेन्द्राणी चेशेशानीन्द्रमोहिनी । इलेशानमदघ्नी च ईशानवरदेन्दिरा ॥ १०॥ इच्छेषत्फुल्लकमललोचनेन्दीवरप्रदा
    । इडेभास्यनुतेशानप्रिया चेन्दुनिभानना ॥ ११॥ इडेन्द्रादिस्तुतेन्द्राणी वरदेड्येन्दिरेश्वरी । उत्तमोत्कृष्टवर्णोर्वी
    चोमोर्वश्युदयप्रभा ॥ १२॥ ऊतिरुद्यद्भानुकोटिप्रभा चोभयतोमुखी । उरगेन्द्रशयोत्केलिरुरुशक्तिरुरुप्रदा
    ॥ १३॥ ऊर्ध्वकेशी चोरुदेहा चोष्ठोद्धृतवसुन्धरा । ऊर्णावासोन्नताकाररूपोन्नद्धमदापहा ॥ १४॥ ऋतुपर्णार्चिता
    ऋद्धिरृतुपुष्पा ऌकारिका । एकैश्वर्यप्रदा चैन्द्री चैन्दव्योङ्कारसंस्थिता ॥ १५॥ ओषध्यन्नप्रदात्री च
    औषधिश्चौर्ववन्दिता । अन्तर्वत्यम्बिका चाम्बालिकाम्बुधिशयाम्बुधिः ॥ १६॥ अन्तकघ्नी चान्तकर्त्री चान्तिमान्तकरूपिणी
    । अम्बुदाम्बरसंस्थाङ्का चाशेषस्वरभूषिता ॥ १७॥ काम्या कामप्रदा कृष्णा कल्याणी कल्पकारिणी । काली कला
    कलिहरा काशिः कलिमलापहा ॥ १८॥ कम्बुग्रीवा कलाकेलिः कमलाक्षी कलानिधिः । कावेरी कुलकान्ता च कौमारी कलिका
    कथा ॥ १९॥ केतकी कुलजा कन्या कलकण्ठी कवित्वदा । कामबीजवती कान्तिः कोटिः केलिः कुहू कृतिः ॥ २०॥ कमला
    कलभोरुश्च कामाक्षी कमनीयभ्रूः । कलङ्करहिता कान्ता कुशला कुटिलालका ॥ २१॥ काष्ठा कला कुरुक्षेत्रभूमिः
    कलितदानवा । कुल्या कलावती कीर्तिः केशिघ्नी कीर्तिदायिनी ॥ २२॥ कविप्रीता च करुणा कृपा काश्मीरवासिनी
    । कादम्बरी कलरवा कुचमण्डलमण्डिता ॥ २३॥ कौशिकीकृतमाला च कौशाम्बी कोशवर्धिनी । कुशावर्ता कामधेनुः कपिला
    च कुलोद्भवा ॥ २४॥ कुङ्कुमाङ्कितदेहा च कुमारी कुङ्कुमारुणा । काशपुष्पप्रतीकाशा कालमारी च कालिका ॥ २५॥
    किरणा कल्पलतिका कल्पसङ्ख्या कुमुद्वती । काश्यपी कुतुका कुध्रा कृशाङ्गी कायवर्जिता ॥ २६॥ कामिनी कुन्तहस्ता
    च कुलविद्या च कौलिकी । काव्यशक्तिः केलिपरा कलहा कान्तिलोचना ॥ २७॥ काञ्ची कनकधारा च कलिः कनककुण्डला
    । कमलस्रग्धरा कामवरदा कमलाकृतिः ॥ २८॥ काञ्चीकलापरम्या च कमलासनसंस्तुता । कम्बीजा कौत्सवरदा कामरूपनिवासिनी
    ॥ २९॥ खड्गिनी खड्गहस्ता च खट्वाङ्गवरधारिणी । खेटहस्ता खड्गधरा खनिः खस्था खलापहा ॥ ३०॥ खगमाता खगाख्यातिः
    खगेन्द्रवरवाहना । खुराभिघातसैन्यघ्नी खेचरी खेटकामदा ॥ ३१॥ खरदूषणहन्त्री च खरस्पर्शा खरूपिणी । गीता
    गीतप्रिया गीतिर्गायत्री गौतमीगुरुः ॥ ३२॥ गुणाध्यक्षा गुणवती गोपीचन्दनचर्चिता । गङ्गा गोप्ती गुणाढ्या
    गौर्गणेशा गीश्च गोपिका ॥ ३३॥ गोवर्धनधरा गुर्वी गोकुलाभयदायिनी । गण्डकी गौतमी गाथा गया गौरी गणेशसूः
    ॥ ३४॥ गोदावरी गोस्वरूपा गौतमाख्यमुनिस्तुता । गानप्रिया च गम्भीरा गेया गन्धर्वसेविता ॥ ३५॥ गान्धर्वी
    गीतकीर्तिश्च गेयविद्याविशारदा । गम्भीरनाभिर्गरिमा गुणरूपा गुणोद्धता ॥ ३६॥ गोपालरूपिणी गोष्ठी गहना
    गोधनप्रदा । गन्धप्रिया गोपसखी गारुडी गोहिता गतिः ॥ ३७॥ गोप्या गुरुतमा गम्या गोदा गुरुसुतप्रदा । घण्टानादप्रिया
    घोरा घोरदैत्यविनाशिनी ॥ ३८॥ घण्टा घोरवपुर्धृष्टदैत्यवक्षस्थला घृणिः । घटस्तनी घण्टिका च घटोघ्नी घटजन्मसूः
    ॥ ३९॥ घोषा घृताहुतिर्घासा घोरघर्घरनादिनी । ङ्काराकृतिसंविष्टा चतुष्कोणसबिन्दुका ॥ ४०॥ चारुश्चन्द्रप्रभा
    चञ्चुश्चतुराश्रमपूजिता । चतुर्वेदमयी चित्तिश्चित्स्वरूपा चराचरा ॥ ४१॥ चित्रिणी चक्रिणी चित्रा चित्राभरणभूषिता
    । चाणूरमर्दिनी चण्डा चण्डहर्त्री च चण्डिका ॥ ४२॥ चिदात्मिका चतुर्वर्गफलदा चतुराकृतिः । चकोराक्षी चारुहासा
    चमरी चतुरानना ॥ ४३॥ चतुःषष्टिःश्रीसुतन्त्रपूजनीया च चित्सुखा । चिन्त्या चक्षुश्चन्द्रभागा चपला चलकुण्डला
    ॥ ४४॥ चतुःषष्टिकलाज्ञानदायिनी चाक्षुषी मनुः । चर्मण्वती चन्द्रिका च चन्द्रमाता च चापिनी ॥ ४५॥ छत्रछाया
    छत्रवती छात्रबुद्धिप्रदा छविः । छायाग्रहहरा छाया छद्मदैत्यविनाशिनी ॥ ४६॥ जया जयन्ती जयदा जगत्त्रयहितैषिणी
    । जातरूपमयी ज्योत्स्ना जनता जातवत्सला ॥ ४७॥ जगती जङ्गमा ज्येष्ठा जन्मदा ज्वलितद्युतिः । जगज्जीवा जगद्वन्द्या
    जरामृत्युविनाशिनी ॥ ४८॥ जैत्री जीमूतसङ्काशा जीवना जीवनप्रदा । जितश्वासा जितारातिर्जनित्री जनमोहिनी
    ॥ ४९॥ जलमूर्तिर्जगद्बीजा जननी जन्मनाशिनी । जगद्धात्री जितेन्द्रा च ज्योतिर्जाया जनेष्टदा ॥ ५०॥ जीर्णा
    च जनमाता च जन्या जनकनन्दिनी । जालन्धरहरा जातिर्जनलोकनिवासिनी ॥ ५१॥ जयाजय्या जयकरी जरायुर्जवना जविः
    । जाम्बूनदविभूषा च ज्वाला जम्भवधोद्यता ॥ ५२॥ झल्लरी झङ्कृनिर्झम्पा झणझ्झणितनूपुरा । झङ्काररूपा झटितिवरदा
    झर्झरी झरिः ॥ ५३॥ ङ्काराकृतिसंव्यक्तिः कर्णिकाकुसुमाक्षरा । टङ्कहस्ता टङ्कृती च टीका टङ्कारभीषणा ॥
    ५४॥ ठरूपा ठाकृतिर्डिम्भा डामरी डमरुप्रिया । ढौकिताशेषपाताला ढुण्ढिपूज्या ढरूपिणी ॥ ५५॥ णकाराकृत्यनुस्यूतेभदन्ताक्षमालिनी
    । ताम्रपर्णी तीर्थमयी तापसी तापसप्रिया ॥ ५६॥ त्रैलोक्यपूजिता तारा त्रिपदा तोमरा त्रुटिः । तन्तुस्त्रयीतनुस्तापी
    त्रिपथा त्र्यम्बकस्तुता ॥ ५७॥ तुला तामरसाभास्या त्रिलोकस्था त्रिविक्रमा । तमालदलरुक् तन्वी तरुणी तामसी
    तरी ॥ ५८॥ तत्त्वतुष्टा तत्त्वरूपा तमोहन्त्री त्रिशक्तिधृक् । तपस्विनी तपोयुक्ता तपस्विकुलवन्दिता ॥
    ५९॥ तापापहन्त्री च तार्क्ष्यमाता तृप्तिस्त्रपा तृषा । तपःसिद्धिस्तपोनिष्ठा तृप्ता तापितदानवा ॥ ६०॥
    थाथाथैथैथरीथारतालविद्याविशारदा । दया दयानिधिर्दुःखहन्त्री दान्ता द्रुतेष्टदा ॥ ६१॥ दात्री दीनार्तिशमनी
    दैत्यदर्पविनाशिनी । द्वारका दरपाणिर्दृग्दिव्या दिग्दमितेन्द्रिया ॥ ६२॥ दक्षा च दक्षिणा दीक्षा दीक्षिता
    दक्षपूजिता । दीर्घकेशी दीर्घनिद्रा दयालुर्दनुजापहा ॥ ६३॥ दारिद्र्यनाशिनी द्यौश्च दिङ्मण्डलविकासिता
    । द्रौपदी देवमाता च दुर्धर्षा दीधितिप्रदा ॥ ६४॥ दशाननहरा दोला द्युतिर्दीप्ता दितिर्दनुः । दिवागतिर्दर्पहरा
    दीप्तपावकलोचना ॥ ६५॥ दिव्यसौख्यप्रदा दीप्तिर्दिक्पालवरदा दशा । दावाग्निनाशिनी दूतिर्देवदुःखविनाशिनी
    ॥ ६६॥ धर्मदा धनदा धारा धराधरा धनुर्धरा । धेनुका ध्वजिनी धीरा धूलिर्ध्वान्तहरा ध्वनिः ॥ ६७॥ ध्येया
    ध्याना ध्यानशीला धूतपापा धुरन्धरा । धृतिर्धूर्धार्मिकी धुर्या धनधान्यविवर्धिनी ॥ ६८॥ धर्मिष्ठा धर्मफलदा
    ध्यानगम्या च धारणा । धरणिर्धवला नीतिर्निष्ठा नाकगतिप्रदा ॥ ६९॥ नागरूपा नागवल्ली नीला नागेन्द्रपूजिता
    । नारसिंही नदी नन्दा नन्द्यावर्तप्रिया तथा ॥ ७०॥ निधिर्निधिपुरस्था च न्यायसूर्न्यायकोविदा । नाभिस्तुता
    नयवती नरकार्तिहरी तथा ॥ ७१॥ नाभिर्नासा नूतनाङ्गा नरकघ्नी तथा नुतिः । नागपाशधरा नित्या नानामङ्गलदायिनी
    ॥ ७२॥ नारी नारायणी नौका नीलमेघसमप्रभा । नटी नीलाम्बरा नक्रपोथिनी नलिनी नतिः ॥ ७३॥ निशुम्भघ्नी नर्मदा
    च नक्षत्राख्या च नन्दिनी । पद्मिनी पद्मकोशाक्षी पुण्डलीकवरप्रदा ॥ ७४॥ पुराणपरमा प्रीतिः प्रेष्ठा पीताम्बरा
    परा । पुण्या प्रज्ञा पयोष्णी च पम्पा पद्मा पयस्विनी ॥ ७५॥ पीवरा पुरुषा पुष्टिः परमात्मस्वरूपिणी ।
    पापघ्नी प्रियकर्त्रीच पवित्रा परमेश्वरी ॥ ७६॥ पुत्रिणी परमानन्दा पद्महस्ता पिकस्वरा । पुरुषार्थप्रदा
    प्रौढा प्राप्तिः पर्वतनन्दिनी ॥ ७७॥ पतिव्रता पतिमयी प्रिया च प्रीतिमञ्जरी । पातालवासिनी पूर्तिः पाञ्चाली
    प्राणिनां प्रसूः ॥ ७८॥ पराशक्तिः पाशहस्ता प्रसिद्धा पद्मजार्चिता । प्रवरातीरसंस्था च पुत्रपौत्रप्रदायिनी
    ॥ ७९॥ पितामही पितृमाता प्राची पूर्णा परात्मिका । परापवादसंहन्त्री पतगेन्द्रकृतासना ॥ ८॰॥ पतगेन्द्रशया
    पाकहन्त्री च परशुप्रिया । फणिमाता च फलदा फलभुक् फेनदैत्यहृत् ॥ ८१॥ फुल्लाम्बुजासना फुल्ला फुल्लपद्मकरा
    बलिः । बलिदा बालिका बाला बदरी बलशालिनी ॥ ८२॥ बलभद्रप्रिया बुद्धिर्बाहुदा बलिसंस्तुता । बालेन्दुशिखरा
    बन्दी बालग्रहविनाशिनी ॥ ८३॥ ब्राह्मी बृहत्तमा बाणा ब्रह्माणी ब्रह्मणस्पतिः । बृहद्भानुर्ब्रह्मरूपा
    ब्रह्मस्था च बृहस्पतिः ॥ ८४॥ बालसौख्यप्रदा लीला बाणासुरकरापहा । बलिमाता बृहद्धाम्नी बादरायणसंस्तुता
    ॥ ८५॥ भयघ्नी भीमरूपा भीर्भूतस्था भीमनन्दिनी । भूतिर्भवानी भयदा भीषणा भवभीषणा ॥ ८६॥ भूपतिर्भूधरधरा
    भूतावेशनिवासिनी । भालनेत्रा भैरवी च भूतिदा भ्रामरी भ्रमिः ॥ ८७॥ भूर्भुवःस्वः स्वरूपा च भीमा भवभयापहा
    । भीमभ्राजन्मणिग्रीवा भ्रातृपूज्या च भार्गवी ॥ ८८॥ भ्राजिष्णुर्भासुरा भास्या भानुकोटिसमप्रभा । भक्तिगम्या
    भ्रमघ्नी च भक्तकामदुहा च भूः ॥ ८९॥ भवभीतिहरा भव्या भ्रान्तिर्भगवती मही । महालक्ष्मीर्महाकाली महिषासुरघातिनी
    ॥ ९०॥ मत्तमातङ्गगमना मधुसूदनरूपिणी । मधुप्रिया मधुरवाङ्मधुघ्नी मथुरा मधुः ॥ ९१॥ मालतीकुसुमारामा मदमन्थरगामिनी
    । मातङ्गी मानदा माता मातृमण्डलवासिनी ॥ ९२॥ माया मान्यापुरी मुख्या मोक्षदा मीनरूपिणी । मन्दारभूधरधरा
    मन्दारस्रग्धरा मखिः ॥ ९३॥ मातामही मातृमाता मध्यमा मानसी मनुः । मेनकामुन्महेज्या च मोहिनीमन्त्रदेवता
    ॥ ९४॥ मधुस्रवा मतिर्मेधा मनीषा मृत्युमारिका । मृगत्वङ्मा मृगाक्षी च मोहहन्त्री मनस्विनी ॥ ९५॥ मनेप्सितप्रदा
    माता मदहृन्मदिरेक्षणा । यमुना यमभीतिघ्नी यमलार्जुनमध्यगा ॥ ९६॥ यमलोकहरा याम्या योगिनी यमला यतिः ।
    यन्त्रोद्धारवती यात्रा योगनिद्रा यमप्रिया ॥ ९७॥ यशस्विनी योगिगम्या योग्या योगिजनप्रिया । योगाङ्गध्यानशीला
    च यज्ञभूर्यज्ञवर्धिनी ॥ ९८॥ योगपट्टधरा यज्ञा यज्ञाङ्गा यज्ञकामदा । यज्ञरूपा यज्ञकर्त्री यत्तत्पदनिबन्धिनी
    ॥ ९९॥ यशोदा यादवी यूतिर्युद्धज्ञा यदुवंशजा । यादवार्तिहरा युक्ता यक्षिणी यवनार्दिनी ॥ १००॥ रक्ताम्बरधरा
    रक्ता रक्तबीजवधोद्यता । रमणी राममूर्तिश्च रागिणी रक्तदन्तिका ॥ १०१॥ रतिप्रिया रतिकरी रक्तकेशी रणप्रिया
    । रक्तकेयूरवलया रतिरागविवर्धिनी ॥ १०२॥ रोलम्बपूर्णमाला च रमणीया रमापतिः । राका राकेशवदना रम्या रणितनूपुरा
    ॥ १०३॥ रक्षोघ्नी रतिदात्री च रागज्ञा रागवल्लभा । रत्नगर्भा रत्ननखी राक्षसी रजनीप्रिया ॥ १०४॥ रात्री
    राजीवनेत्रा च रणभूमी रणस्थिरा । लक्ष्मीर्लावण्यरूपा च ललिता लोललोचना ॥ १०५॥ लीलावती लक्षरूपा लङ्का
    च लवणोदधिः । लङ्केशहन्त्री लेखा च लङ्काराज्यप्रदा लता ॥ १०६॥ लीला लीलानरवपुर्लोला लक्ष्या लसत्तनुः
    । लवणासुरसंहन्त्री लेख्या लावण्यभूर्लिपिः ॥ १०७॥ लक्ष्मणा लक्षणाढ्या च लोलार्कपरिपूजिता । वरेण्या
    वसुधा वीरा वरिष्ठा च वरप्रदा ॥ १०८॥ वामना वैदिकी विद्युद्वाराही वेत्रवत्यपि । विश्वेशा वीरमाता च वीरश्रीर्वैष्णवी
    विभुः ॥ १०९॥ वेदिर्वेद्या वेदिता च विष्णुमाया वसुन्धरा । व्योमहन्त्री विश्वरूपा विद्या वाग्विश्ववेदिता
    ॥ ११०॥ वृद्धिर्वृत्तिर्वरा विश्वा व्योमरूपा वषट्कृतिः । वनमालाधरा व्याप्तिर्विख्याता विमला वसुः ॥
    १११॥ व्यालरूपा वैद्यविद्या वासिष्ठी वीर्यदायिनी । वाताली वारूणी विष्वक्सेना वाचस्पतिर्वधूः ॥ ११२॥
    विरिञ्चिजननी वेदमाता वह्निस्वरूपधृक् । वागुरा वधुरूपा च वालिहन्त्री वराप्सरा ॥ ११३॥ शाम्भवी शम्भुजननी
    शम्बरासुरघातिनी । शाम्बरी शमनी शान्तिः श्रेष्ठा श्रीर्श्रीकरी शमी ॥ ११४॥ शातकुम्भमयी शक्तिः श्यामा
    शीलवती शिवा । शालग्रामशिला शीता श्रीनिधिः श्रीमतिः शुभा ॥ ११५॥ शाकम्भरी शुचिः श्रद्धा शोणाक्षी शेषवन्दिता
    । शताक्षी शबला शान्ता शस्ता शोकविनाशिनी ॥ ११६॥ शत्रुमारी शत्रुरूपा शरधन्वधरा श्रुतिः । शरदिन्दुप्रभा
    शिक्षा शतघ्नी शान्तिदायिनी ॥ ११७॥ षण्मातृजननी षष्ठिः षष्टिहायनरूपिणी । षडङ्गज्ञा षड्विकाररहिता षोडशी
    कला । सर्वज्ञा सर्वशक्तिश्च सुलभा सरयूः सखी ॥ ११९॥ सुखदा सामगीतिश्च स्मृतिः सत्या समा सती । सरणी सुन्दरी
    सीता सुभद्रा च सरस्वती ॥ १२०॥ सुश्रोणिः सुमुखी सौम्या सुस्पर्शा सुमतिः सुधा । स्वच्छन्दा सुभगा साध्वी
    सुतन्तुः सुप्रभा समित् ॥ १२१॥ सुस्पृष्टा सात्विकी सारी सकलागमपूजिता । हंसा हैहयसंहन्त्री हर्षदात्री
    हरिप्रिया ॥ १२२॥ हविर्हलधरा हन्त्री ह्रीम्बीजा हरवन्दिता । हालाहलधरा होरा हयगा हतदानवा ॥ १२३॥ हयग्रीवतनुर्हैमी
    हंसोज्ज्वलशिरोरुहा । हुङ्कारहतदैत्याहिर्हयघ्नी हंसवाहना ॥ १२४॥ हाहागीतप्रिया हावभूमिर्हास्यप्रिया
    तथा । क्षेमङ्करी क्षितिः क्षीरसमुद्रशयना क्षमा ॥ १२५॥ ज्ञेया ज्ञानस्वरूपा च ज्ञानदा ज्ञानदीपिका ॥
    १२६॥ ॥ ज्ञानदीपिका ॐ नम इति ॥ ब्रह्मा उवाच
