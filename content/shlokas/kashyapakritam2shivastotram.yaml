id: kashyapakritam2shivastotram
category: stotram
name:
  english: kashyapakritam2shivastotram
  devanagari: कश्यपकृतं२शिवस्तोत्रम्
content:
  english: kashyapakritam 2 shivastotram kashyapa uvaca | pahi shankara devesha pahi lokanamaskrita |
    pahi pavana vagisha pahi pannagabhushana || 94|| pahi dharma vrisharudha pahi vedatrayekshana | pahi
    godharalakshmisha pahi sharva gajambara || 95|| pahi tripurahannatha pahi somardhabhushana | pahi
    yajnesha somesha pahyabhishtapradayaka || 96|| pahi karunyanilaya pahi mangaladayaka | pahi prabhava
    sarvasya pahi palaka vasava || 97|| pahi bhaskara vittesha pahi brahmanamaskrita | pahi vishvesha
    siddhesha pahi purna namo'stu te || 98|| ghorasamsarakantarasancarodvignacetasam | sharirinam kripasindho
    tvameva sharanam shiva || 99|| evam samstuvatastasya purato'bhudvrishadhvajah | varena cchandayamasa
    kashyapam tam prajapatim || 100|| iti brahmapurane caturvimshadhikashatatamadhyayantargatam kashyapakritam
    shivastotram samaptam | brahmapurana | adhyaya 124
  devanagari: कश्यपकृतं २ शिवस्तोत्रम् कश्यप उवाच । पाहि शङ्कर देवेश पाहि लोकनमस्कृत । पाहि पावन वागीश
    पाहि पन्नगभूषण ॥ ९४॥ पाहि धर्म वृषारूढ पाहि वेदत्रयेक्षण । पाहि गोधरलक्ष्मीश पाहि शर्व गजाम्बर ॥ ९५॥
    पाहि त्रिपुरहन्नाथ पाहि सोमार्धभूषण । पाहि यज्ञेश सोमेश पाह्यभीष्टप्रदायक ॥ ९६॥ पाहि कारुण्यनिलय पाहि
    मङ्गलदायक । पाहि प्रभव सर्वस्य पाहि पालक वासव ॥ ९७॥ पाहि भास्कर वित्तेश पाहि ब्रह्मनमस्कृत । पाहि
    विश्वेश सिद्धेश पाहि पूर्ण नमोऽस्तु ते ॥ ९८॥ घोरसंसारकान्तारसञ्चारोद्विग्नचेतसाम् । शरीरिणां कृपासिन्धो
    त्वमेव शरणं शिव ॥ ९९॥ एवं संस्तुवतस्तस्य पुरतोऽभूद्वृषध्वजः । वरेण च्छन्दयामास कश्यपं तं प्रजापतिम्
    ॥ १००॥ इति ब्रह्मपुराणे चतुर्विंशाधिकशततमाध्यायान्तर्गतं कश्यपकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय १२४
