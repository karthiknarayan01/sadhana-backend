id: vajrapaninamashtottarashatastotram
category: stotram
name:
  english: vajrapaninamashtottarashatastotram
  devanagari: वज्रपाणिनामाष्टोत्तरशतस्तोत्रम्
content:
  english: vajrapaninamashtottarashatastotram vajrasattva mahasattva mahayana mahatmaka | mahaprabha mahashuddha
    mahanatha namo'stu te || 1|| vajraraja mahavajra vajra sarvatathagata | mahasattva mahavirya mahopaya
    namo'stu te || 2|| vajraraga mahashuddha sarvasaukhya mahasukha | sukhagryanadinidhana mahakama namo'stu
    te || 3|| vajrasadhu mahatushti sadhukara praharshaka | mahaharsha mahamoda supramodya namo'stu te
    || 4|| vajraratna maharaja svabhisheka mahamate | sarvaratna mahashobhavibhushana namo'stu te || 5||
    vajrateja mahateja vajraprabha mahadyute | jinaprabha mahajvala buddhaprabha namo'stu te || 6|| vajraketu
    mahaketu mahadhvaja dhanaprada | akashaketo mahayashti tyagadhvaja namo'stu te || 7|| vajrahasa mahahasa
    mahapritipramodana | pritivega ratiprite dharmaprite namo'stu te || 8|| vajradharma mahadharma sarvadharmasushodhaka
    | buddhadharma sudharmagrya ragadharma namo'stu te || 9|| vajratikshna mahakosha prajnajnana mahamate
    | papacchedamahakhadga buddhashastra namo'stu te || 10|| vajrahetu mahacakra buddhacakra mahanidhe
    | sarvamandaladharmagra dharmacakra namo'stu te || 11|| vajrabhasha mahabhasha nishprapanca mahakshara
    | anakshara mahajapa buddhavaca namo'stu te || 12|| vajrakarma sukarmagrya mahakarma sukarmakrit |
    guhyapuja mahapuja buddhapuja namo'stu te || 13|| vajraraksha mahavarma kavacagrya mahadridha | maharaksha
    mahasara buddhavirya namo'stu te || 14|| vajrayaksha mahakrodha sarvadushtabhayanaka | sarvabuddhamahopaya
    agrayaksha namo'stu te || 15|| mahasandhi mahamudra mahasamayabandhaka | mahamushte samudragrya vajramushte
    namo'stu te || 16|| vandyo manyashca pujyashca satkartavyastathagataih | yasmadanadinidhanam bodhicittam
    tvamucyase || 17|| tvamasadya jinah sarve bodhisattvashca shaurinah | sambhutah sambhavishyanti buddhabodhyagrahetavah
    || 18|| namaste vajrasattvaya vajraratnaya te namah | namaste vajradharmaya namaste vajrakarmane ||
    19|| tvamabhishtutya namagraih pranamya ca subhavatah | yatpunyam tena sarvo hi buddhabodhimavapnuyat
    || 20|| idamuccarayetsamyag namashtashatamuttamam | sakridvaram subhaktisthah sarvabuddhatvamapnuyat
    || 21|| iti shrivajrapaninamashtottarashatastotram sampurnam ||
  devanagari: वज्रपाणिनामाष्टोत्तरशतस्तोत्रम् वज्रसत्त्व महासत्त्व महायान महात्मक । महाप्रभ महाशुद्ध महानाथ
    नमोऽस्तु ते ॥ १॥ वज्रराज महावज्र वज्र सर्वतथागत । महासत्त्व महावीर्य महोपाय नमोऽस्तु ते ॥ २॥ वज्रराग
    महाशुद्ध सर्वसौख्य महासुख । सुखाग्र्यानादिनिधन महाकाम नमोऽस्तु ते ॥ ३॥ वज्रसाधु महातुष्टि साधुकार
    प्रहर्षक । महाहर्ष महामोद सुप्रामोद्य नमोऽस्तु ते ॥ ४॥ वज्ररत्न महाराज स्वाभिषेक महामते । सर्वरत्न
    महाशोभविभूषण नमोऽस्तु ते ॥ ५॥ वज्रतेज महातेज वज्रप्रभ महाद्युते । जिनप्रभ महाज्वाल बुद्धप्रभ नमोऽस्तु
    ते ॥ ६॥ वज्रकेतु महाकेतु महाध्वज धनप्रद । आकाशकेतो महायष्टि त्यागध्वज नमोऽस्तु ते ॥ ७॥ वज्रहास महाहास
    महाप्रीतिप्रमोदन । प्रीतिवेग रतिप्रीते धर्मप्रीते नमोऽस्तु ते ॥ ८॥ वज्रधर्म महाधर्म सर्वधर्मसुशोधक
    । बुद्धधर्म सुधर्माग्र्य रागधर्म नमोऽस्तु ते ॥ ९॥ वज्रतीक्ष्ण महाकोश प्रज्ञाज्ञान महामते । पापच्छेदमहाखड्ग
    बुद्धशस्त्र नमोऽस्तु ते ॥ १०॥ वज्रहेतु महाचक्र बुद्धचक्र महानिधे । सर्वमण्डलधर्माग्र धर्मचक्र नमोऽस्तु
    ते ॥ ११॥ वज्रभाष महाभाष निष्प्रपञ्च महाक्षर । अनक्षर महाजाप बुद्धवाच नमोऽस्तु ते ॥ १२॥ वज्रकर्म सुकर्माग्र्य
    महाकर्म सुकर्मकृत् । गुह्यपूज महापूज बुद्धपूज नमोऽस्तु ते ॥ १३॥ वज्ररक्ष महावर्म कवचाग्र्य महादृढ
    । महारक्ष महासार बुद्धवीर्य नमोऽस्तु ते ॥ १४॥ वज्रयक्ष महाक्रोध सर्वदुष्टभयानक । सर्वबुद्धमहोपाय अग्रयक्ष
    नमोऽस्तु ते ॥ १५॥ महासन्धि महामुद्र महासमयबन्धक । महामुष्टे समुद्राग्र्य वज्रमुष्टे नमोऽस्तु ते ॥
    १६॥ वन्द्यो मान्यश्च पूज्यश्च सत्कर्तव्यस्तथागतैः । यस्मादनादिनिधनं बोधिचित्तं त्वमुच्यसे ॥ १७॥ त्वामासाद्य
    जिनाः सर्वे बोधिसत्त्वाश्च शौरिणः । सम्भूताः सम्भविष्यन्ति बुद्धबोध्यग्रहेतवः ॥ १८॥ नमस्ते वज्रसत्त्वाय
    वज्ररत्नाय ते नमः । नमस्ते वज्रधर्माय नमस्ते वज्रकर्मणे ॥ १९॥ त्वामभिष्टुत्य नामाग्रैः प्रणम्य च सुभावतः
    । यत्पुण्यं तेन सर्वो हि बुद्धबोधिमवाप्नुयात् ॥ २०॥ इदमुच्चारयेत्सम्यग् नामाष्टशतमुत्तमम् । सकृद्वारं
    सुभक्तिस्थः सर्वबुद्धत्वमाप्नुयात् ॥ २१॥ इति श्रीवज्रपाणिनामाष्टोत्तरशतस्तोत्रं सम्पूर्णम् ॥
