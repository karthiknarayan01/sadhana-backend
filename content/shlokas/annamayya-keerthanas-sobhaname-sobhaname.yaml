id: annamayya-keerthanas-sobhaname-sobhaname
category: stotram
name:
  english: Annamayya Keerthanas Sobhaname Sobhaname
content:
  english: shobhaname shobhaname vaibhavamula pavana murtiki || aruduga munu narakasurudu | sirulato jèralu
    dèccina satula | paruvapu vayasula badaru velanu | sòridi bèndladina sumukhuniki || cèndina veduka
    shishupaludu | andi pèndladaga navagalinci | vinduvalènè ta viccesi rukumini | sandadi bèndladina
    sarasunuki || devadanavula dhiratanu | davatipadi varthi darupaganu | shri vanitamani jèlagi pèndladina
    | shri venkatagiri shrinidhiki ||
  devanagari: शोभनमे शोभनमे वैभवमुल पावन मूर्तिकि ॥ अरुदुग मुनु नरकासुरुडु । सिरुलतो जॆरलु दॆच्चिन सतुल
    । परुवपु वयसुल बदारु वेलनु । सॊरिदि बॆण्ड्लाडिन सुमुखुनिकि ॥ चॆन्दिन वेडुक शिशुपालुडु । अन्दि पॆण्ड्लाडग
    नवगलिञ्चि । विन्दुवलॆनॆ ता विच्चेसि रुकुमिणि । सन्दडि बॆण्ड्लाडिन सरसुनुकि ॥ देवदानवुल धीरतनु । दावतिपडि
    वार्थि दरुपगनु । श्री वनितामणि जॆलगि पॆण्ड्लाडिन । श्री वेङ्कटगिरि श्रीनिधिकि ॥
