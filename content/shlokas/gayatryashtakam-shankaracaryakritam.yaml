id: gayatryashtakam-shankaracaryakritam
category: stotram
name:
  english: gayatryashtakam (shankaracaryakritam)
  devanagari: गायत्र्यष्टकम् (शङ्कराचार्यकृतम्)
content:
  english: jatipankajaketakikuvalayaih sampujitanghridvayam tattvarthatmikavarnapanktisahitam tattvarthabuddhipradam
  devanagari: जातीपङ्कजकेतकीकुवलयैः संपूजिताङ्घ्रिद्वयां तत्त्वार्थात्मिकवर्णपङ्क्तिसहितां तत्त्वार्थबुद्धिप्रदाम्
meaning: {}
