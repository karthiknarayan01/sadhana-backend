id: mahanarayana
category: upanishad
name:
  english: mahanarayana
  devanagari: महनरयन
content:
  english: huvema paramatsadhasthat | sa nah parshadati durgani vishva kshamaddevo ati duritatyagnih ||
    5|| pratnoshi kamidyo adhvareshu sanacca hota navyashca satsi | svam cagne tanuvam piprayasvasmabhyam
    ca saubhagamayajasva || 6|| gobhirjushtamayujo nishiktam tavendra vishnoranusamcarema | nakasya prishthamabhi
    samvasano vaishnavim loka iha madayantam || 7|| tritiyo'nuvakah | bhurannamagnaye prithivyai svaha
    bhuvo'nnam vayave'ntarikshaya svaha suvarannamadityaya dive svaha bhurbhuvassuvarannam candramase
    digbhyah svaha namo devebhyah svadha pitribhyo bhurbhuvah suvarannamom || 1|| caturtho'nuvakah | bhuragnaye
    prithivyai svaha bhuvo vayave'ntarikshaya svaha suvaradityaya dive svaha bhurbhuvassuvashcandramase
    digbhyah svaha namo devebhyah svadha pitribhyo bhurbhuvahsuvaragna om || 1|| pancamo'nuvakah | bhuragnaye
    ca prithivyai ca mahute ca svaha bhuvo vayave cantarikshaya ca mahate ca svaha suvaradityaya ca dive
    ca mahate ca svaha bhurbhuvassuvashcandramase ca nakshatrebhyashca digbhyashca mahate ca svaha namo
    devebhyah svadha pitribhyo bhurbhuvah suvarmaharom || 1|| shashtho'nuvakah | pahi no agna enase svaha
    pahi no vishvavedase svaha yajnam pahi vibhavaso svaha sarvam pahi shatakrato svaha || 1|| saptamo'nuvakah
    | pahi no agna ekaya pahyuta dvitiyaya pahyurja tritiyaya pahi girbhishcatasribhirvaso svaha || 1||
    ashtamo'nuvakah | yashchandasamrishabho vishvarupashchandobhyashcanda
  devanagari: हुवेम परमात्सधस्थात् । स नः पर्षदति दुर्गाणि विश्वा क्षामद्देवो अति दुरितात्यग्निः ॥ ५॥
    प्रत्नोषि कमीड्यो अध्वरेषु सनाच्च होता नव्यश्च सत्सि । स्वां चाग्ने तनुवं पिप्रयस्वास्मभ्यं च सौभगमायजस्व
    ॥ ६॥ गोभिर्जुष्टमयुजो निषिक्तं तवेन्द्र विष्णोरनुसंचरेम । नाकस्य पृष्ठमभि संवसानो वैष्णवीं लोक इह
    मादयन्ताम् ॥ ७॥ तृतीयोऽनुवाकः । भूरन्नमग्नये पृथिव्यै स्वाहा भुवोऽन्नं वायवेऽन्तरिक्षाय स्वाहा सुवरन्नमादित्याय
    दिवे स्वाहा भूर्भुवस्सुवरन्नं चन्द्रमसे दिग्भ्यः स्वाहा नमो देवेभ्यः स्वधा पितृभ्यो भूर्भुवः सुवरन्नमोम्
    ॥ १॥ चतुर्थोऽनुवाकः । भूरग्नये पृथिव्यै स्वाहा भुवो वायवेऽन्तरिक्षाय स्वाहा सुवरादित्याय दिवे स्वाहा
    भूर्भुवस्सुवश्चन्द्रमसे दिग्भ्यः स्वाहा नमो देवेभ्यः स्वधा पितृभ्यो भूर्भुवःसुवरग्न ओम् ॥ १॥ पञ्चमोऽनुवाकः
    । भूरग्नये च पृथिव्यै च महुते च स्वाहा भुवो वायवे चान्तरिक्षाय च महते च स्वाहा सुवरादित्याय च दिवे
    च महते च स्वाहा भूर्भुवस्सुवश्चन्द्रमसे च नक्षत्रेभ्यश्च दिग्भ्यश्च महते च स्वाहा नमो देवेभ्यः स्वधा
    पितृभ्यो भूर्भुवः सुवर्महरोम् ॥ १॥ षष्ठोऽनुवाकः । पाहि नो अग्न एनसे स्वाहा पाहि नो विश्ववेदसे स्वाहा
    यज्ञं पाहि विभावसो स्वाहा सर्वं पाहि शतक्रतो स्वाहा ॥ १॥ सप्तमोऽनुवाकः । पाहि नो अग्न एकया पाह्युत
    द्वितीयया पाह्यूर्ज तृतीयया पाहि गीर्भिश्चतसृभिर्वसो स्वाहा ॥ १॥ अष्टमोऽनुवाकः । यश्छन्दसामृषभो विश्वरूपश्छन्दोभ्यश्चन्दा
