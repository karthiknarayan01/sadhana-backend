id: budha108namastotra
category: stotram
name:
  english: budha108namastotra
  devanagari: बुध१०८नामस्तोत्र
content:
  english: om bra~ brim braum sah budhaya namah || budho budharcitah saumyah saumyacittah shubhapradah
    | dridhavrato dridhabala shrutijalaprabodhakah || 1|| satyavasah satyavaca shreyasampatiravyayah |
    somajah sukhadah shriman somavamshapradipakah || 2|| vedavidvedatattvajno vedantajnanabhaskarah |
    vidyavicakshana vidur vidvatpritikaro rijah || 3|| vishvanukulasancari visheshavinayanvitah | vividhagamasarajno
    viryavan vigatajvarah || 4|| trivargaphalado'nantah tridashadhipapujitah | buddhiman bahushastrajno
    bali bandhavimocakah || 5|| vakrativakragamano vasavo vasudhadhipah | prasadavadano vandyo varenyo
    vagvilakshanah || 6|| satyavan satyasamkalpah satyabandhih sadadarah | sarvarogaprashamanah sarvamrityunivarakah
    || 7|| vanijyanipuno vashyo vatamgi vatarogahrit | sthulah sthairyagunadhyakshah sthulasukshmadikaranah
    || 8|| aprakashah prakashatma ghano gaganabhushanah | vidhistutyo vishalaksho vidvajjanamanoharah
    || 9|| carushilah svaprakasho capalashca jitendriyah | uda'gmukho makhasakto magadhadhipatirharah
    || 10|| saumyavatsarasanjatah somapriyakarah sukhi | simhadhirudhah sarvajnah shikhivarnah shivamkarah
    || 11|| pitambaro pitavapuh pitacchatradhvajamkitah | khadgacarmadharah karyakarta kalushaharakah
    || 12|| atreyagotrajo'tyantavinayo vishvapavanah | campeyapushpasamkashah caranah carubhushanah ||
    13|| vitarago vitabhayo vishuddhakanakaprabhah | bandhupriyo bandhayukto vanamandalasamshritah ||
    14|| arkeshanapradeshasthah tarkashastravisharadah | prashantah pritisamyuktah priyakrit priyabhashanah
    || 15|| medhavi madhavasakto mithunadhipatih sudhih | kanyarashipriyah kamaprado ghanaphalashrayah
    || 16|| budhasyevamprakarena namnamashtottaram shatam | sampujya vidhivatkarta sarvankamanavapnuyat
    || 17|| || iti budha ashtottarashatanamastotram ||
  devanagari: ॐ ब्राँ ब्रीं ब्रौं सः बुधाय नमः ॥ बुधो बुधार्चितः सौम्यः सौम्यचित्तः शुभप्रदः । दृढव्रतो
    दृढबल श्रुतिजालप्रबोधकः ॥ १॥ सत्यवासः सत्यवचा श्रेयसाम्पतिरव्ययः । सोमजः सुखदः श्रीमान् सोमवंशप्रदीपकः
    ॥ २॥ वेदविद्वेदतत्त्वज्ञो वेदान्तज्ञानभास्करः । विद्याविचक्षण विदुर् विद्वत्प्रीतिकरो ऋजः ॥ ३॥ विश्वानुकूलसञ्चारी
    विशेषविनयान्वितः । विविधागमसारज्ञो वीर्यवान् विगतज्वरः ॥ ४॥ त्रिवर्गफलदोऽनन्तः त्रिदशाधिपपूजितः ।
    बुद्धिमान् बहुशास्त्रज्ञो बली बन्धविमोचकः ॥ ५॥ वक्रातिवक्रगमनो वासवो वसुधाधिपः । प्रसादवदनो वन्द्यो
    वरेण्यो वाग्विलक्षणः ॥ ६॥ सत्यवान् सत्यसंकल्पः सत्यबन्धिः सदादरः । सर्वरोगप्रशमनः सर्वमृत्युनिवारकः
    ॥ ७॥ वाणिज्यनिपुणो वश्यो वातांगी वातरोगहृत् । स्थूलः स्थैर्यगुणाध्यक्षः स्थूलसूक्ष्मादिकारणः ॥ ८॥
    अप्रकाशः प्रकाशात्मा घनो गगनभूषणः । विधिस्तुत्यो विशालाक्षो विद्वज्जनमनोहरः ॥ ९॥ चारुशीलः स्वप्रकाशो
    चपलश्च जितेन्द्रियः । उदऽग्मुखो मखासक्तो मगधाधिपतिर्हरः ॥ १०॥ सौम्यवत्सरसञ्जातः सोमप्रियकरः सुखी ।
    सिंहाधिरूढः सर्वज्ञः शिखिवर्णः शिवंकरः ॥ ११॥ पीताम्बरो पीतवपुः पीतच्छत्रध्वजांकितः । खड्गचर्मधरः कार्यकर्ता
    कलुषहारकः ॥ १२॥ आत्रेयगोत्रजोऽत्यन्तविनयो विश्वपावनः । चाम्पेयपुष्पसंकाशः चारणः चारुभूषणः ॥ १३॥ वीतरागो
    वीतभयो विशुद्धकनकप्रभः । बन्धुप्रियो बन्धयुक्तो वनमण्डलसंश्रितः ॥ १४॥ अर्केशानप्रदेषस्थः तर्कशास्त्रविशारदः
    । प्रशान्तः प्रीतिसंयुक्तः प्रियकृत् प्रियभाषणः ॥ १५॥ मेधावी माधवासक्तो मिथुनाधिपतिः सुधीः । कन्याराशिप्रियः
    कामप्रदो घनफलाश्रयः ॥ १६॥ बुधस्येवम्प्रकारेण नाम्नामष्टोत्तरं शतम् । सम्पूज्य विधिवत्कर्ता सर्वान्कामानवाप्नुयात्
    ॥ १७॥ ॥ इति बुध अष्टोत्तरशतनामस्तोत्रम् ॥
