id: krishnasahasra-2
category: sahasranama
name:
  english: krishnasahasra
  devanagari: क्रिश्नसहस्र
content:
  english: purushavigrahah || 55|| svasamkalpanurupartho vatsavatsaparupadhrik | yathavatsakriyarupo yathasthananiveshanah
    || 56|| yathavrajarbhakakaro gogopistanyapassukhi | ciradvalohito danto brahmavijnatavaibhavah ||
    57|| vicitrashaktirvyalinasrishtagovatsavatsapah | brahmatrapakaro dhatristutassarvarthasadhakah ||
    58|| brahma brahmamayo'vyaktastejorupassukhatmakah | niruktam vyakritirvyakto niralambanabhavanah
    || 59|| prabhavishnuratantriko devapakshartharupadhrik | akamassarvavedadiraniyasthularupavan || 60||
    vyapi vyapyah kripakarta vicitracarasammatah | chandomayah pradhanatma murtamurtidvayakritih || 61||
    anekamurtirakrodhah parah prakritirakramah | sakalavaranopetassarvadevo maheshvarah || 62|| mahaprabhavanah
    purvavatsavatsapadarshakah | krishnayadavagopalo gopalokanaharshitah || 63|| smitekshaharshitabrahma
    bhaktavatsalavakpriyah | brahmanandashrudhautamghrirlilavaicitryakovidah || 64|| balabhadraikahridayo
    namakaritagokulah | gopalabalako bhavyo rajjuyajnopavitavan || 65|| vrikshacchayahatashantirgopotsamgopabarhanah
    | gopasamvahitapado gopavyajanavijitah ||66| gopaganasukhonnidrah shridamarjitasauhridah | sunandasuhridekatma
    subalapranaramjanah || 67|| talivanakritakrido balapatitadhenukah | gopisaubhagyasambhavyo godhulicchuritalakah
    || 68|| gopivirahasantapto gopikakritamajjanah | pralambabahurutphullapundarikavatamsakah || 69||
    vilasalalitasmeragarbhalilavalokanah | sragbhushananulepadhyo jananyupahritannabhuk || 70|| varashayyashayo
    radhapremasallapanirvritah | yamunatatasamcari vishartavrajaharshadah || 71|| kaliyakrodhajanakah
    vriddhahikulaveshtitah | kaliyahiphanaramganatah kaliyamardanah || 72|| nagapatnistutiprito nanaveshasamriddhikrit
    | avishvaktadrigatmeshah khadrigatmastutipriyah || 73|| sarveshvarassarvagunah prasiddhassarvasatvatah
    | akumthadhama candrarkadrishtirakashanirmalah || 74|| anirdeshyagatirnagavanitapatibhaikshadah |
    svamghrimudramkanagendramurdha kaliyasamstutah || 75|| abhayo vishvatashcakshuh stutottamagunah prabhuh
    | ahamatma marutpranah paramatma dyushirshavan || 76|| nagopayanahrishtatma hradotsaritakaliyah |
    balabhadrasukhalapo gopalimgananirvritah || 77|| davagnibhitagopalagopta davagninashanah | nayanacchadanakridalampato
    nripaceshtitah || 78|| kakapakshadharassaumyo balavahakakeliman | balaghatitadurdharshapralambo balavatsalah
    || 79|| munjatavyagnishamanah pravritkalavinodavan | shilanyastannabhriddaityasamharta shadvalasanah
    || 80|| sadaptagopikodgitah karnikaravatamsakah | nataveshadharah padmamalamko gopikavritah || 81||
    gopimanoharapamgo venuvadanatatparah | vinyastavadanambhojashcarushabdakritananah || 82|| bimbadhararpitodaravenurvishvavimohanah
    | vrajasamvarnitashravyavenunadah shrutipriyah || 83|| gogopagopijanmepsurbrahmendradyabhivanditah
    | gitasnutisaritpuro nadanartitabarhinah || 84|| ragapallavitasthanurgitanamitapadapah | vismaritatrinagrasamrigo
    mrigavilobhitah || 85|| vyaghradihimsrasahajavairaharta sugayanah | gadhodiritagovrindapremotkarnitatarnakah
    || 86|| nishpandayanabrahmadivikshito vishvavanditah | shakhotkarnashakuntaughashchatrayitabalahakah
    || 87|| prasannah paramanandashcitrayitacaracarah | gopikamadano gopikucakumkumamudritah || 88|| gopikanyajalakridahrishto
    gopyamshukaprihat | skandharopitagopasragvasah kundanibhasmitah || 89|| gopinetrotpalashashi gopikayacitamshukah
    | gopinamaskriyadeshta gopyekakaravanditah || 90|| gopyamjalivishesharthi gopakridavilobhitah | shantavasasphuradgopikritamjaliraghapahah
    || 91|| gopikelivilasarthi gopisampurnakamadah | gopastriivastrado gopicittacorah kutuhali || 92||
    vrindavanapriyo gopabandhuryajvannayacita | yajnesho yajnabhavajno yajnapatnyabhivanchitah || 93||
    munipatnivitirnannatripto munivadhupriyah | dvijapatnyabhibhavajno dvijapatnivarapradah || 94|| pratiruddhasatimokshaprado
    dvijavimohita | munijnanaprado yajvastuto vasavayagavit || 95|| pitriproktakriyarupashakrayaganivaranah
    | shakra'marshakarashshakravrishtiprashamanonmukhah || 96|| govardhanadharo gopagovrindatranatatparah
    | govardhanagirichatracamdadamdabhujargalah || 97|| saptahavidhritadrindro meghavahanagarvaha | bhujagroparivinyastakshmadharakshmabhridacyutah
    || 98|| svasthanasthapitagirirgopidadhyakshatarcitah | sumanassumanovrishtihrishto vasavavanditah
    || 99|| kamadhenupayahpurabhishiktassurabhistutah | dharamghriroshadhiroma dharmagopta manomayah ||
    100|| jnanayajnapriyashshastranetrassarvarthasarathih | airavatakaranitaviyadgamgapluto vibhuh ||
    101|| brahmabhishikto gogopta sarvalokashubhamkarah | sarvavedamayo magnanandanveshipitripriyah ||
    102|| varunodiritatmekshakautuko varunarcitah | varunanitajanako gopajnatatmavaibhavah || 103|| svarlokalokasamhrishtagopavargatrivargadah
    | brahmahridgopito gopadrashta brahmapadapradah || 104|| sharaccandraviharotkah shripatirvashako kshamah
    | bhayapaho bhartriruddhagopikadhyanagocarah || 105|| gopikanayanasvadyo gopinarmoktinirvritah | gopikamanaharano
    gopikashatayuthapah || 106|| vaijayantisragakalpo gopikamanavardhanah | gopakantasunirdeshta kanto
    manmathamanmathah || 107|| svatmasyadattatambulah phalitotkrishtayauvanah | vallavistanasaktaksho
    vallavipremacalitah || 108|| gopicelamcalasino gopinetrabjashatpadah | rasakridasamasakto gopimandalamandanah
    || 109|| gopihemamanishrenimadhyendramanirujjvalah | vidyadharendushapaghnashshamkhacudashiroharah
    || 110|| shamkhacudashiroratnasamprinitabalo'naghah | arishtarishtakriddushtakeshidaityanishudanah
    || 111|| sarasassasmitamukhassusthiro virahakulah | samkarshanarpitapritirakruradhyanagocarah || 112||
    akrurasamstuto gudho gunavrityupalakshitah | pramanagamyastanmatra'vayavi buddhitatparah || 113||
    sarvapramanapramadhissarvapratyayasadhakah | purushashca pradhanatma viparyasavilocanah || 114|| madhurajanasamvikshyo
    rajakapratighatakah | vicitrambarasamvito malakaravarapradah || 115|| kubjavakratvanirmokta kubjayauvanadayakah
    | kubjamgaragasurabhih kamsakodandakhandanah || 116|| dhirah kuvalayapidamardanah kamsabhitikrit |
    dantidantayudho ramgatrasako mallayuddhavit || 117|| canurahanta kamsarirdevakiharshadayakah | vasudevapadanamrah
    pitribandhavimocanah || 118|| urvibhayapaho bhupa ugrasenadhipatyadah | ajnasthitashacinathassudharmanayanakshamah
    || 119|| adyo dvijatisatkarta shishtacarapradarshakah | sandipanikritabhyastavidyabhyasaikadhissudhih
    || 120|| gurvabhishtakriyadakshah pashcimodadhipujitah | hatapamcajanapraptapamcajanyo yamarcitah
    || 121|| dharmarajajayanitaguruputra urukramah | guruputrapradashshasta madhurajasabhasadah || 122||
    jamadagnyasamabhyarcyo gomantagirisamcarah | gomantadavashamano garudanitabhushanah || 123|| cakradyayudhasamshobhi
    jarasandhamadapahah | srigalavanipalaghnassrigalatmajarajyadah || 124|| vidhvastakalayavano mucukundavarapradah
    | ajnapitamahambhodhirdvarakapurakalpanah || 125|| dvarakanilayo rukmimanahanta yadudvahah | ruciro
    rukminijanih pradyumnajanakah prabhuh || 126|| apakritatrilokartiraniruddhapitamahah | aniruddhapadanveshi
    cakri garudavahanah || 127|| banasurapuriroddha rakshajvalanayantrajit | dhutapramathasamrambho jitamaheshvarajvarah
    || 128|| shatcakrashaktinirjeta bhutavetalamohakrit | shambhutrishulajicchambhujrimbhanashshammbhusamstutah
    || 129|| indriyatmenduhridayassarvayogeshvareshvarah | hiranyagarbhahridayo mohavartanivartanah ||
    130|| atmajnananidhirmedha koshastanmatrarupavan | indro'gnivadanah kalanabhassarvagamadhvagah ||
    131|| turiyasarvadhisakshi dvandvaramatmaduragah | ajnataparo vashyashriravyakritaviharavan || 132||
    atmapradipo vijnanamatratma shriniketanah | banabahuvanacchetta mahendrapritivardhanah || 133|| aniruddhanirodhajno
    jaleshahritagokulah | jaleshavijayi virassatrajidratnayacakah || 134|| prasenanveshanodyukto jambavaddhritaratnadah
    | jitarksharajatanayaharta jambavatipriyah || 135|| satyabhamapriyah kamashshatadhanvashiroharah |
    kalindipatirakrurabandhurakruraratnadah || 136|| kaikeyiramano bhadrabharta nagnajitidhavah | madrimanoharashshaibyapranabandhururukramah
    || 137|| sushiladayito mitravindanetramahotsavah | lakshmanavallabho ruddhapragjyotishamahapurah ||
    138|| surapashavriticchedi murarih krurayuddhavit| hayagrivashiroharta sarvatma sarvadarshanah ||
    139|| narakasuravicchetta narakatmajarajyadah| prithvistutah prakashatma hridyo yajnaphalapradah ||
    140|| gunagrahi gunadrashta gudhasvatma vibhutiman | kavirjagadupadrashta paramaksharavigrahah ||
    141|| prapannapalano mali mahad brahmavivardhanah | vacyavacakashaktyarthassarvavyakritasiddhidah
    || 142|| svayamprabhuranirvedyassvaprakashashcirantanah | nadatma mantrakotisho nanavadanirodhakah
    || 143|| kandarpakotilavanyah pararthaikaprayojakah | amarikritadevaughah kanyakabandhamocanah ||
    144|| shodashastrisahasreshah kantah kantamanobhavah | kridaratnacalaharta varunacchatrashobhitah
    || 145|| shakrabhivanditashshakrajananikundalapradah | aditiprastutastotro brahmanodghushtacetanah
    || 146|| puranassamyami janmaliptah shadvimshako'rthadah | yashasyanitiradyantarahitassatkathapriyah
    || 147|| brahmabodhah paranandah parijatapaharakah | paundrakapranaharanah kashirajanishudanah ||
    148|| krityagarvaprashamano vicakravadhadikshitah | kamsavidhvamsanassambajanako dimmbhakardanah ||
    149|| munirgopta pitrivarapradassavanadikshitah | rathi sarathyanirdeshta phalgunah phalgunipriyah
    || 150|| saptabdhistambhanodbhato harissaptabdhibhedanah | atmaprakashah purnashriradinarayanekshitah
    || 151|| vipraputrapradashcaiva sarvamatrisutapradah | parthavismayakritparthapranavarthaprabodhanah
    || 152|| kailasayatrasumukho badaryashramabhushanah | ghantakarnakriyamaudhyattoshito bhaktavatsalah
    || 153|| munivrindadibhirdhyeyo ghantakarnavarapradah | tapashcaryaparashciravasah pimgajatadharah
    || 154|| pratyakshikritabhuteshashshivastota shivastutah | krishnasvayamvaralokakautuki sarvasammatah
    || 155|| balasamrambhashamano baladarshitapandavah | yativesharjunabhishtadayi sarvatmagocarah ||
    156|| subhadraphalgunodvahakarta prinitaphalgunah | khandavaprinitarcishmanmayadanavamocanah || 157||
    sulabho rajasuyarhayudhishthiraniyojakah | bhimarditajarasandho magadhatmajarajyadah || 158|| rajabandhananirmokta
    rajasuyagrapujanah | caidyadyasahano bhishmastutassatvatapurvajah || 159|| sarvatmarthasamaharta mandaracaladharakah
    | yajnavatarah prahladapratijnapratipalakah || 160|| baliyajnasabhadhvamsi driptakshatrakulantakah
    | dashagrivantako jeta revatipremavallabhah || 161|| sarvavataradhishthata vedabahyavimohanah | kalidoshanirakarta
    dashanama dridhavratah || 162|| ameyatma jagatsvami vagmi caidyashiroharah | draupadiracitastotrah
    keshavah purushottamah || 163|| narayano madhupatirmadhavo doshavarjitah | govindah pundarikaksho
    vishnushca madhusudanah || 164|| trivikramastrilokesho vamanah shridharah puman | hrishikesho vasudevah
    padmanabho mahahradah || 165|| damodarashcaturvyuhah pamcalimanarakshanah | salvaghnassamarashlaghi
    dantavaktranibarhanah || 166|| damodarapriyasakha prithukasvadanapriyah || ghrini damodarah shrido
    gopipunaravekshakah || 167|| gopikamuktido yogi durvasastriptikarakah | avijnatavrajakirnapandavalokano
    jayi || 168|| parthasarathyaniratah prajnah pandavadutyakrit | viduratithyasantushtah kuntisantoshadayakah
    || 169|| suyodhanatiraskarta duryodhanavikaravit | vidurabhishthuto nityo varshneyo mamgalatmakah
    || 170|| pamcavimshatitatveshashcaturvimshatidehabhak | sarvanugrahakassarvadasharhasatatarcitah ||
    171|| acintyo madhuralapassadhudarshi durasadah | manushyadharmanugatah kauravendrakshayekshita ||
    172|| upendro danavaratirurugito mahadyutih | brahmanyadevah shrutiman gobrahmanahitashayah || 173||
    varashilashshivarambhassuvijnanavimurtiman | svabhavashuddhassanmitrassusharanyassulakshanah || 174||
    dhritarashtragatodrishtipradah karnavibhedanah | pratodadhrigvishvarupavismaritadhanamjayah || 175||
    samaganapriyo dharmadhenurvarnottamo'vyayah | caturyugakriyakarta vishvarupapradarshakah || 176||
    brahmabodhaparitratapartho bhishmarthacakrabhrit | arjunayasavidhvamsi kaladamshtravibhushanah ||
    177|| sujatanantamahima svapnavyaparitarjunah | akalasandhyaghatanashcakrantaritabhaskarah || 178||
    dushtapramathanah parthapratijnaparipalakah | sindhurajashirahpatasthanavakta vivekadrik || 179||
    subhadrashokaharano dronotsekadivismitah | parthamanyunirakarta pandavotsavadayakah || 180|| amgushthakrantakaunteyarathashshakto'hishirshajit
    | kalakopaprashamano bhimasenajayapradah || 181|| ashvatthamavadhayasatratapandusutah kriti | ishikastraprashamano
    draunirakshavicaranah |182|| parthapaharitadraunicudamanirabhamgurah | dhritarashtraparamrishtabhimapratikritismayah
    || 183|| bhishmabuddhipradashshantashsharaccandranibhananah | gadagrajanma pamcalipratijnaparipalakah
    || 184|| gandharikopadrigguptadharmasunuranamayah | prapannartibhayacchetta bhishmashalyavyadhavahah
    || 185|| shantashshantanavodirnasarvadharmasamahitah | smaritabrahmavidyarthapritapartho mahastravit
    || 186|| prasadaparamodaro gamgeyasugatipradah | vipakshapakshakshayakritparikshitpranarakshanah ||
    187|| jagadgururdharmasunorvajimedhapravartakah | vihitarthaptasatkaro masakatparivartadah || 188||
    uttamkaharshadatmiyadivyarupapradarshakah | janakavagatasvoktabharatassarvabhavanah || 189|| asodhayadavodreko
    vihitaptadipujanah || samudrasthapitashcaryamusalo vrishnivahakah || 190|| munishapayudhah padmasanaditridasharthitah
    | vrishtipratyavaharotkassvadhamagamanotsukah || 191|| prabhasalokanodyukto nanavidhanimittakrit |
    sarvayadavasamsevyassarvotkrishtaparicchadah || 192|| velakananasamcari velanilahritashramah | kalatma
    yadavo'nantasstutisantushtamanasah || 193|| dvijalokanasantushtah punyatirthamahotsavah | satkarahladitasheshabhusurassuravallabhah
    || 194|| punyatirthaplutah punyah punyadastirthapavanah | viprasatkritagokotishshatakotisuvarnadah
    || 195|| svamayamohita'sheshavrishniviro visheshavit | jalajayudhanirdeshta svatmaveshitayadavah ||
    196|| devatabhishtavaradah kritakrityah prasannadhih | sthirasheshayutabalassahasraphanivikshanah
    || 197|| brahmavrikshavaracchayasinah padmasanasthitah | pratyagatma svabhavarthah pranidhanaparayanah
    || 198|| vyadheshuviddhapujyamghrirnishadabhayamocanah | pulindastutisantushtah pulindasugatipradah
    || 199|| darukarpitaparthadikaraniyoktirishita | divyadundubhisamyuktah pushpavrishtiprapujitah ||
    200|| puranah parameshanah purnabhuma parishtutah | patiradyah param brahma paramatma paratparah ||
    201|| shriparamatma paratparah om namah iti
  devanagari: पुरुषविग्रहः ॥ ५५॥ स्वसंकल्पानुरूपार्थो वत्सवत्सपरूपधृक् । यथावत्सक्रियारूपो यथास्थाननिवेशनः
    ॥ ५६॥ यथाव्रजार्भकाकारो गोगोपीस्तन्यपस्सुखी । चिराद्वलोहितो दान्तो ब्रह्मविज्ञातवैभवः ॥ ५७॥ विचित्रशक्तिर्व्यालीनसृष्टगोवत्सवत्सपः
    । ब्रह्मत्रपाकरो धातृस्तुतस्सर्वार्थसाधकः ॥ ५८॥ ब्रह्म ब्रह्ममयोऽव्यक्तस्तेजोरूपस्सुखात्मकः । निरुक्तं
    व्याकृतिर्व्यक्तो निरालम्बनभावनः ॥ ५९॥ प्रभविष्णुरतन्त्रीको देवपक्षार्थरूपधृक् । अकामस्सर्ववेदादिरणीयस्थूलरूपवान्
    ॥ ६०॥ व्यापी व्याप्यः कृपाकर्ता विचित्राचारसम्मतः । छन्दोमयः प्रधानात्मा मूर्तामूर्तिद्वयाकृतिः ॥
    ६१॥ अनेकमूर्तिरक्रोधः परः प्रकृतिरक्रमः । सकलावरणोपेतस्सर्वदेवो महेश्वरः ॥ ६२॥ महाप्रभावनः पूर्ववत्सवत्सपदर्शकः
    । कृष्णयादवगोपालो गोपालोकनहर्षितः ॥ ६३॥ स्मितेक्षाहर्षितब्रह्मा भक्तवत्सलवाक्प्रियः । ब्रह्मानन्दाश्रुधौतांघ्रिर्लीलावैचित्र्यकोविदः
    ॥ ६४॥ बलभद्रैकहृदयो नामाकारितगोकुलः । गोपालबालको भव्यो रज्जुयज्ञोपवीतवान् ॥ ६५॥ वृक्षच्छायाहताशान्तिर्गोपोत्संगोपबर्हणः
    । गोपसंवाहितपदो गोपव्यजनवीजितः ॥६६। गोपगानसुखोन्निद्रः श्रीदामार्जितसौहृदः । सुनन्दसुहृदेकात्मा सुबलप्राणरंजनः
    ॥ ६७॥ तालीवनकृतक्रीडो बलपातितधेनुकः । गोपीसौभाग्यसम्भाव्यो गोधूलिच्छुरितालकः ॥ ६८॥ गोपीविरहसन्तप्तो
    गोपिकाकृतमज्जनः । प्रलम्बबाहुरुत्फुल्लपुण्डरीकावतंसकः ॥ ६९॥ विलासललितस्मेरगर्भलीलावलोकनः । स्रग्भूषणानुलेपाढ्यो
    जनन्युपहृतान्नभुक् ॥ ७०॥ वरशय्याशयो राधाप्रेमसल्लापनिर्वृतः । यमुनातटसंचारी विषार्तव्रजहर्षदः ॥ ७१॥
    कालियक्रोधजनकः वृद्धाहिकुलवेष्टितः । कालियाहिफणारंगनटः कालियमर्दनः ॥ ७२॥ नागपत्नीस्तुतिप्रीतो नानावेषसमृद्धिकृत्
    । अविष्वक्तदृगात्मेशः खदृगात्मस्तुतिप्रियः ॥ ७३॥ सर्वेश्वरस्सर्वगुणः प्रसिद्धस्सर्वसात्वतः । अकुंठधामा
    चन्द्रार्कदृष्टिराकाशनिर्मलः ॥ ७४॥ अनिर्देश्यगतिर्नागवनितापतिभैक्षदः । स्वांघ्रिमुद्रांकनागेन्द्रमूर्धा
    कालियसंस्तुतः ॥ ७५॥ अभयो विश्वतश्चक्षुः स्तुतोत्तमगुणः प्रभुः । अहमात्मा मरुत्प्राणः परमात्मा द्युशीर्षवान्
    ॥ ७६॥ नागोपायनहृष्टात्मा ह्रदोत्सारितकालियः । बलभद्रसुखालापो गोपालिंगननिर्वृतः ॥ ७७॥ दावाग्निभीतगोपालगोप्ता
    दावाग्निनाशनः । नयनाच्छादनक्रीडालम्पटो नृपचेष्टितः ॥ ७८॥ काकपक्षधरस्सौम्यो बलवाहककेलिमान् । बलघातितदुर्धर्षप्रलम्बो
    बलवत्सलः ॥ ७९॥ मुञ्जाटव्यग्निशमनः प्रावृट्कालविनोदवान् । शिलान्यस्तान्नभृद्दैत्यसंहर्ता शाद्वलासनः
    ॥ ८०॥ सदाप्तगोपिकोद्गीतः कर्णिकारावतंसकः । नटवेषधरः पद्ममालांको गोपिकावृतः ॥ ८१॥ गोपीमनोहरापांगो वेणुवादनतत्परः
    । विन्यस्तवदनाम्भोजश्चारुशब्दकृताननः ॥ ८२॥ बिम्बाधरार्पितोदारवेणुर्विश्वविमोहनः । व्रजसंवर्णितश्राव्यवेणुनादः
    श्रुतिप्रियः ॥ ८३॥ गोगोपगोपीजन्मेप्सुर्ब्रह्मेन्द्राद्यभिवन्दितः । गीतस्नुतिसरित्पूरो नादनर्तितबर्हिणः
    ॥ ८४॥ रागपल्लवितस्थाणुर्गीतानमितपादपः । विस्मारिततृणग्रासमृगो मृगविलोभितः ॥ ८५॥ व्याघ्रादिहिंस्रसहजवैरहर्ता
    सुगायनः । गाढोदीरितगोवृन्दप्रेमोत्कर्णिततर्णकः ॥ ८६॥ निष्पन्दयानब्रह्मादिवीक्षितो विश्ववन्दितः । शाखोत्कर्णशकुन्तौघश्छत्रायितबलाहकः
    ॥ ८७॥ प्रसन्नः परमानन्दश्चित्रायितचराचरः । गोपिकामदनो गोपीकुचकुंकुममुद्रितः ॥ ८८॥ गोपिकन्याजलक्रीडाहृष्टो
    गोप्यंशुकापृहत् । स्कन्धारोपितगोपस्रग्वासाः कुन्दनिभस्मितः ॥ ८९॥ गोपीनेत्रोत्पलशशी गोपिकायाचितांशुकः
    । गोपीनमस्क्रियादेष्टा गोप्येककरवन्दितः ॥ ९०॥ गोप्यंजलिविशेषार्थी गोपक्रीडाविलोभितः । शान्तवासस्फुरद्गोपीकृतांजलिरघापहः
    ॥ ९१॥ गोपीकेलिविलासार्थी गोपीसम्पूर्णकामदः । गोपस्त्रीईवस्त्रदो गोपीचित्तचोरः कुतूहली ॥ ९२॥ वृन्दावनप्रियो
    गोपबन्धुर्यज्वान्नयाचिता । यज्ञेशो यज्ञभावज्ञो यज्ञपत्न्यभिवाञ्छितः ॥ ९३॥ मुनिपत्नीवितीर्णान्नतृप्तो
    मुनिवधूप्रियः । द्विजपत्न्यभिभावज्ञो द्विजपत्नीवरप्रदः ॥ ९४॥ प्रतिरुद्धसतीमोक्षप्रदो द्विजविमोहिता
    । मुनिज्ञानप्रदो यज्वस्तुतो वासवयागवित् ॥ ९५॥ पितृप्रोक्तक्रियारूपशक्रयागनिवारणः । शक्राऽमर्षकरश्शक्रवृष्टिप्रशमनोन्मुखः
    ॥ ९६॥ गोवर्धनधरो गोपगोवृन्दत्राणतत्परः । गोवर्धनगिरिछत्रचंडदंडभुजार्गलः ॥ ९७॥ सप्ताहविधृताद्रीन्द्रो
    मेघवाहनगर्वहा । भुजाग्रोपरिविन्यस्तक्ष्माधरक्ष्माभृदच्युतः ॥ ९८॥ स्वस्थानस्थापितगिरिर्गोपीदध्यक्षतार्चितः
    । सुमनस्सुमनोवृष्टिहृष्टो वासववन्दितः ॥ ९९॥ कामधेनुपयःपूराभिषिक्तस्सुरभिस्तुतः । धरांघ्रिरोषधीरोमा
    धर्मगोप्ता मनोमयः ॥ १००॥ ज्ञानयज्ञप्रियश्शास्त्रनेत्रस्सर्वार्थसारथिः । ऐरावतकरानीतवियद्गंगाप्लुतो
    विभुः ॥ १०१॥ ब्रह्माभिषिक्तो गोगोप्ता सर्वलोकशुभंकरः । सर्ववेदमयो मग्ननन्दान्वेषिपितृप्रियः ॥ १०२॥
    वरुणोदीरितात्मेक्षाकौतुको वरुणार्चितः । वरुणानीतजनको गोपज्ञातात्मवैभवः ॥ १०३॥ स्वर्लोकालोकसंहृष्टगोपवर्गत्रिवर्गदः
    । ब्रह्महृद्गोपितो गोपद्रष्टा ब्रह्मपदप्रदः ॥ १०४॥ शरच्चन्द्रविहारोत्कः श्रीपतिर्वशको क्षमः । भयापहो
    भर्तृरुद्धगोपिकाध्यानगोचरः ॥ १०५॥ गोपिकानयनास्वाद्यो गोपीनर्मोक्तिनिर्वृतः । गोपिकामानहरणो गोपिकाशतयूथपः
    ॥ १०६॥ वैजयन्तीस्रगाकल्पो गोपिकामानवर्धनः । गोपकान्तासुनिर्देष्टा कान्तो मन्मथमन्मथः ॥ १०७॥ स्वात्मास्यदत्तताम्बूलः
    फलितोत्कृष्टयौवनः । वल्लवीस्तनसक्ताक्षो वल्लवीप्रेमचालितः ॥ १०८॥ गोपीचेलांचलासीनो गोपीनेत्राब्जषट्पदः
    । रासक्रीडासमासक्तो गोपीमण्डलमण्डनः ॥ १०९॥ गोपीहेममणिश्रेणिमध्येन्द्रमणिरुज्ज्वलः । विद्याधरेन्दुशापघ्नश्शंखचूडशिरोहरः
    ॥ ११०॥ शंखचूडशिरोरत्नसम्प्रीणितबलोऽनघः । अरिष्टारिष्टकृद्दुष्टकेशिदैत्यनिषूदनः ॥ १११॥ सरसस्सस्मितमुखस्सुस्थिरो
    विरहाकुलः । संकर्षणार्पितप्रीतिरक्रूरध्यानगोचरः ॥ ११२॥ अक्रूरसंस्तुतो गूढो गुणवृत्युपलक्षितः । प्रमाणगम्यस्तन्मात्राऽवयवी
    बुद्धितत्परः ॥ ११३॥ सर्वप्रमाणप्रमधीस्सर्वप्रत्ययसाधकः । पुरुषश्च प्रधानात्मा विपर्यासविलोचनः ॥ ११४॥
    मधुराजनसंवीक्ष्यो रजकप्रतिघातकः । विचित्राम्बरसंवीतो मालाकारवरप्रदः ॥ ११५॥ कुब्जावक्रत्वनिर्मोक्ता
    कुब्जायौवनदायकः । कुब्जांगरागसुरभिः कंसकोदण्डखण्डनः ॥ ११६॥ धीरः कुवलयापीडमर्दनः कंसभीतिकृत् । दन्तिदन्तायुधो
    रंगत्रासको मल्लयुद्धवित् ॥ ११७॥ चाणूरहन्ता कंसारिर्देवकीहर्षदायकः । वसुदेवपदानम्रः पितृबन्धविमोचनः
    ॥ ११८॥ उर्वीभयापहो भूप उग्रसेनाधिपत्यदः । आज्ञास्थितशचीनाथस्सुधर्मानयनक्षमः ॥ ११९॥ आद्यो द्विजातिसत्कर्ता
    शिष्टाचारप्रदर्शकः । सान्दीपनिकृताभ्यस्तविद्याभ्यासैकधीस्सुधीः ॥ १२०॥ गुर्वभीष्टक्रियादक्षः पश्चिमोदधिपूजितः
    । हतपंचजनप्राप्तपांचजन्यो यमार्चितः ॥ १२१॥ धर्मराजजयानीतगुरुपुत्र उरुक्रमः । गुरुपुत्रप्रदश्शास्ता
    मधुराजसभासदः ॥ १२२॥ जामदग्न्यसमभ्यर्च्यो गोमन्तगिरिसंचरः । गोमन्तदावशमनो गरुडानीतभूषणः ॥ १२३॥ चक्राद्यायुधसंशोभी
    जरासन्धमदापहः । सृगालावनिपालघ्नस्सृगालात्मजराज्यदः ॥ १२४॥ विध्वस्तकालयवनो मुचुकुन्दवरप्रदः । आज्ञापितमहाम्भोधिर्द्वारकापुरकल्पनः
    ॥ १२५॥ द्वारकानिलयो रुक्मिमानहन्ता यदूद्वहः । रुचिरो रुक्मिणीजानिः प्रद्युम्नजनकः प्रभुः ॥ १२६॥ अपाकृतत्रिलोकार्तिरनिरुद्धपितामहः
    । अनिरुद्धपदान्वेषी चक्री गरुडवाहनः ॥ १२७॥ बाणासुरपुरीरोद्धा रक्षाज्वलनयन्त्रजित् । धूतप्रमथसंरम्भो
    जितमाहेश्वरज्वरः ॥ १२८॥ षट्चक्रशक्तिनिर्जेता भूतवेतालमोहकृत् । शम्भुत्रिशूलजिच्छम्भुजृम्भणश्शंम्भुसंस्तुतः
    ॥ १२९॥ इन्द्रियात्मेन्दुहृदयस्सर्वयोगेश्वरेश्वरः । हिरण्यगर्भहृदयो मोहावर्तनिवर्तनः ॥ १३०॥ आत्मज्ञाननिधिर्मेधा
    कोशस्तन्मात्ररूपवान् । इन्द्रोऽग्निवदनः कालनाभस्सर्वागमाध्वगः ॥ १३१॥ तुरीयसर्वधीसाक्षी द्वन्द्वारामात्मदूरगः
    । अज्ञातपारो वश्यश्रीरव्याकृतविहारवान् ॥ १३२॥ आत्मप्रदीपो विज्ञानमात्रात्मा श्रीनिकेतनः । बाणबाहुवनच्छेत्ता
    महेन्द्रप्रीतिवर्धनः ॥ १३३॥ अनिरुद्धनिरोधज्ञो जलेशाहृतगोकुलः । जलेशविजयी वीरस्सत्राजिद्रत्नयाचकः ॥
    १३४॥ प्रसेनान्वेषणोद्युक्तो जाम्बवद्धृतरत्नदः । जितर्क्षराजतनयाहर्ता जाम्बवतीप्रियः ॥ १३५॥ सत्यभामाप्रियः
    कामश्शतधन्वशिरोहरः । कालिन्दीपतिरक्रूरबन्धुरक्रूररत्नदः ॥ १३६॥ कैकेयीरमणो भद्राभर्ता नाग्नजितीधवः
    । माद्रीमनोहरश्शैब्याप्राणबन्धुरुरुक्रमः ॥ १३७॥ सुशीलादयितो मित्रविन्दानेत्रमहोत्सवः । लक्ष्मणावल्लभो
    रुद्धप्राग्ज्योतिषमहापुरः ॥ १३८॥ सुरपाशावृतिच्छेदी मुरारिः क्रूरयुद्धवित्। हयग्रीवशिरोहर्ता सर्वात्मा
    सर्वदर्शनः ॥ १३९॥ नरकासुरविच्छेत्ता नरकात्मजराज्यदः। पृथ्वीस्तुतः प्रकाशात्मा हृद्यो यज्ञफलप्रदः ॥
    १४०॥ गुणग्राही गुणद्रष्टा गूढस्वात्मा विभूतिमान् । कविर्जगदुपद्रष्टा परमाक्षरविग्रहः ॥ १४१॥ प्रपन्नपालनो
    माली महद् ब्रह्मविवर्धनः । वाच्यवाचकशक्त्यर्थस्सर्वव्याकृतसिद्धिदः ॥ १४२॥ स्वयंप्रभुरनिर्वेद्यस्स्वप्रकाशश्चिरन्तनः
    । नादात्मा मन्त्रकोटीशो नानावादनिरोधकः ॥ १४३॥ कन्दर्पकोटिलावण्यः परार्थैकप्रयोजकः । अमरीकृतदेवौघः
    कन्यकाबन्धमोचनः ॥ १४४॥ षोडशस्त्रीसहस्रेशः कान्तः कान्तामनोभवः । क्रीडारत्नाचलाहर्ता वरुणच्छत्रशोभितः
    ॥ १४५॥ शक्राभिवन्दितश्शक्रजननीकुण्डलप्रदः । अदितिप्रस्तुतस्तोत्रो ब्राह्मणोद्घुष्टचेतनः ॥ १४६॥ पुराणस्संयमी
    जन्मालिप्तः षड्विंशकोऽर्थदः । यशस्यनीतिराद्यन्तरहितस्सत्कथाप्रियः ॥ १४७॥ ब्रह्मबोधः परानन्दः पारिजातापहारकः
    । पौण्ड्रकप्राणहरणः काशिराजनिषूदनः ॥ १४८॥ कृत्यागर्वप्रशमनो विचक्रवधदीक्षितः । कंसविध्वंसनस्साम्बजनको
    डिंम्भकार्दनः ॥ १४९॥ मुनिर्गोप्ता पितृवरप्रदस्सवनदीक्षितः । रथी सारथ्यनिर्देष्टा फाल्गुनः फाल्गुनिप्रियः
    ॥ १५०॥ सप्ताब्धिस्तम्भनोद्भातो हरिस्सप्ताब्धिभेदनः । आत्मप्रकाशः पूर्णश्रीरादिनारायणेक्षितः ॥ १५१॥
    विप्रपुत्रप्रदश्चैव सर्वमातृसुतप्रदः । पार्थविस्मयकृत्पार्थप्रणवार्थप्रबोधनः ॥ १५२॥ कैलासयात्रासुमुखो
    बदर्याश्रमभूषणः । घण्टाकर्णक्रियामौढ्यात्तोषितो भक्तवत्सलः ॥ १५३॥ मुनिवृन्दादिभिर्ध्येयो घण्टाकर्णवरप्रदः
    । तपश्चर्यापरश्चीरवासाः पिंगजटाधरः ॥ १५४॥ प्रत्यक्षीकृतभूतेशश्शिवस्तोता शिवस्तुतः । कृष्णास्वयंवरालोककौतुकी
    सर्वसम्मतः ॥ १५५॥ बलसंरम्भशमनो बलदर्शितपाण्डवः । यतिवेषार्जुनाभीष्टदायी सर्वात्मगोचरः ॥ १५६॥ सुभद्राफाल्गुनोद्वाहकर्ता
    प्रीणितफाल्गुनः । खाण्डवप्रीणितार्चिष्मान्मयदानवमोचनः ॥ १५७॥ सुलभो राजसूयार्हयुधिष्ठिरनियोजकः । भीमार्दितजरासन्धो
    मागधात्मजराज्यदः ॥ १५८॥ राजबन्धननिर्मोक्ता राजसूयाग्रपूजनः । चैद्याद्यसहनो भीष्मस्तुतस्सात्वतपूर्वजः
    ॥ १५९॥ सर्वात्मार्थसमाहर्ता मन्दराचलधारकः । यज्ञावतारः प्रह्लादप्रतिज्ञाप्रतिपालकः ॥ १६०॥ बलियज्ञसभाध्वंसी
    दृप्तक्षत्रकुलान्तकः । दशग्रीवान्तको जेता रेवतीप्रेमवल्लभः ॥ १६१॥ सर्वावताराधिष्ठाता वेदबाह्यविमोहनः
    । कलिदोषनिराकर्ता दशनामा दृढव्रतः ॥ १६२॥ अमेयात्मा जगत्स्वामी वाग्मी चैद्यशिरोहरः । द्रौपदीरचितस्तोत्रः
    केशवः पुरुषोत्तमः ॥ १६३॥ नारायणो मधुपतिर्माधवो दोषवर्जितः । गोविन्दः पुण्डरीकाक्षो विष्णुश्च मधुसूदनः
    ॥ १६४॥ त्रिविक्रमस्त्रिलोकेशो वामनः श्रीधरः पुमान् । हृषीकेशो वासुदेवः पद्मनाभो महाह्रदः ॥ १६५॥ दामोदरश्चतुर्व्यूहः
    पांचालीमानरक्षणः । साल्वघ्नस्समरश्लाघी दन्तवक्त्रनिबर्हणः ॥ १६६॥ दामोदरप्रियसखा पृथुकास्वादनप्रियः
    ॥ घृणी दामोदरः श्रीदो गोपीपुनरवेक्षकः ॥ १६७॥ गोपिकामुक्तिदो योगी दुर्वासस्तृप्तिकारकः । अविज्ञातव्रजाकीर्णपाण्डवालोकनो
    जयी ॥ १६८॥ पार्थसारथ्यनिरतः प्राज्ञः पाण्डवदूत्यकृत् । विदुरातिथ्यसन्तुष्टः कुन्तीसन्तोषदायकः ॥ १६९॥
    सुयोधनतिरस्कर्ता दुर्योधनविकारवित् । विदुराभिष्ठुतो नित्यो वार्ष्णेयो मंगलात्मकः ॥ १७०॥ पंचविंशतितत्वेशश्चतुर्विंशतिदेहभाक्
    । सर्वानुग्राहकस्सर्वदाशार्हसततार्चितः ॥ १७१॥ अचिन्त्यो मधुरालापस्साधुदर्शी दुरासदः । मनुष्यधर्मानुगतः
    कौरवेन्द्रक्षयेक्षिता ॥ १७२॥ उपेन्द्रो दानवारातिरुरुगीतो महाद्युतिः । ब्रह्मण्यदेवः श्रुतिमान् गोब्राह्मणहिताशयः
    ॥ १७३॥ वरशीलश्शिवारम्भस्सुविज्ञानविमूर्तिमान् । स्वभावशुद्धस्सन्मित्रस्सुशरण्यस्सुलक्षणः ॥ १७४॥ धृतराष्ट्रगतोदृष्टिप्रदः
    कर्णविभेदनः । प्रतोदधृग्विश्वरूपविस्मारितधनंजयः ॥ १७५॥ सामगानप्रियो धर्मधेनुर्वर्णोत्तमोऽव्ययः । चतुर्युगक्रियाकर्ता
    विश्वरूपप्रदर्शकः ॥ १७६॥ ब्रह्मबोधपरित्रातपार्थो भीष्मार्थचक्रभृत् । अर्जुनायासविध्वंसी कालदंष्ट्राविभूषणः
    ॥ १७७॥ सुजातानन्तमहिमा स्वप्नव्यापारितार्जुनः । अकालसन्ध्याघटनश्चक्रान्तरितभास्करः ॥ १७८॥ दुष्टप्रमथनः
    पार्थप्रतिज्ञापरिपालकः । सिन्धुराजशिरःपातस्थानवक्ता विवेकदृक् ॥ १७९॥ सुभद्राशोकहरणो द्रोणोत्सेकादिविस्मितः
    । पार्थमन्युनिराकर्ता पाण्डवोत्सवदायकः ॥ १८०॥ अंगुष्ठाक्रान्तकौन्तेयरथश्शक्तोऽहिशीर्षजित् । कालकोपप्रशमनो
    भीमसेनजयप्रदः ॥ १८१॥ अश्वत्थामवधायासत्रातपाण्डुसुतः कृती । इषीकास्त्रप्रशमनो द्रौणिरक्षाविचारणः ।१८२॥
    पार्थापहारितद्रौणिचूडामणिरभंगुरः । धृतराष्ट्रपरामृष्टभीमप्रतिकृतिस्मयः ॥ १८३॥ भीष्मबुद्धिप्रदश्शान्तश्शरच्चन्द्रनिभाननः
    । गदाग्रजन्मा पांचालीप्रतिज्ञापरिपालकः ॥ १८४॥ गान्धारीकोपदृग्गुप्तधर्मसूनुरनामयः । प्रपन्नार्तिभयच्छेत्ता
    भीष्मशल्यव्यधावहः ॥ १८५॥ शान्तश्शान्तनवोदीर्णसर्वधर्मसमाहितः । स्मारितब्रह्मविद्यार्थप्रीतपार्थो महास्त्रवित्
    ॥ १८६॥ प्रसादपरमोदारो गांगेयसुगतिप्रदः । विपक्षपक्षक्षयकृत्परीक्षित्प्राणरक्षणः ॥ १८७॥ जगद्गुरुर्धर्मसूनोर्वाजिमेधप्रवर्तकः
    । विहितार्थाप्तसत्कारो मासकात्परिवर्तदः ॥ १८८॥ उत्तंकहर्षदात्मीयदिव्यरूपप्रदर्शकः । जनकावगतस्वोक्तभारतस्सर्वभावनः
    ॥ १८९॥ असोढयादवोद्रेको विहिताप्तादिपूजनः ॥ समुद्रस्थापिताश्चर्यमुसलो वृष्णिवाहकः ॥ १९०॥ मुनिशापायुधः
    पद्मासनादित्रिदशार्थितः । वृष्टिप्रत्यवहारोत्कस्स्वधामगमनोत्सुकः ॥ १९१॥ प्रभासालोकनोद्युक्तो नानाविधनिमित्तकृत्
    । सर्वयादवसंसेव्यस्सर्वोत्कृष्टपरिच्छदः ॥ १९२॥ वेलाकाननसंचारी वेलानिलहृतश्रमः । कालात्मा यादवोऽनन्तस्स्तुतिसन्तुष्टमानसः
    ॥ १९३॥ द्विजालोकनसन्तुष्टः पुण्यतीर्थमहोत्सवः । सत्काराह्लादिताशेषभूसुरस्सुरवल्लभः ॥ १९४॥ पुण्यतीर्थाप्लुतः
    पुण्यः पुण्यदस्तीर्थपावनः । विप्रसात्कृतगोकोटिश्शतकोटिसुवर्णदः ॥ १९५॥ स्वमायामोहिताऽशेषवृष्णिवीरो
    विशेषवित् । जलजायुधनिर्देष्टा स्वात्मावेशितयादवः ॥ १९६॥ देवताभीष्टवरदः कृतकृत्यः प्रसन्नधीः । स्थिरशेषायुतबलस्सहस्रफणिवीक्षणः
    ॥ १९७॥ ब्रह्मवृक्षवरच्छायासीनः पद्मासनस्थितः । प्रत्यगात्मा स्वभावार्थः प्रणिधानपरायणः ॥ १९८॥ व्याधेषुविद्धपूज्यांघ्रिर्निषादभयमोचनः
    । पुलिन्दस्तुतिसन्तुष्टः पुलिन्दसुगतिप्रदः ॥ १९९॥ दारुकार्पितपार्थादिकरणीयोक्तिरीशिता । दिव्यदुन्दुभिसंयुक्तः
    पुष्पवृष्टिप्रपूजितः ॥ २००॥ पुराणः परमेशानः पूर्णभूमा परिष्टुतः । पतिराद्यः परं ब्रह्म परमात्मा परात्परः
    ॥ २०१॥ श्रीपरमात्मा परात्परः ओं नमः इति
