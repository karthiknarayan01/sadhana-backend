id: aryatarashtottarashatanamastotram
category: stotram
name:
  english: aryatarashtottarashatanamastotram
  devanagari: आर्यताराष्टोत्तरशतनामस्तोत्रम्
content:
  english: rinuta me | anumodadhvametadva bhavishyadhvam sunirvritah || 27|| om locane sulocane tare tarodbhave
    sarvasattvanukampini sarvasattvatarini sahasrabhuje sahasranetre | om namo bhagavate avalokaya avalokaya
    mam sarvasattvamshca hum hum phat phat svaha | om shuddhe vishuddhe sugatatmaje maitrihridaye nirmale
    shyame shyamarupi mahaprajne prabalavarabhushite | aparajita maharaudri vishvarupi mahabala | om sushriye
    || 28|| om kalyani mahateja lokadhatri mahayashah | sarasvati vishalakshi prajna shrirbuddhivardhini
    || 29|| dhritida pushtida svaha omkara kamarupini | sarvasattvahitodyukta sangramottarini jaya ||
    30|| prajnaparamita devi aryatara manorama | dundubhi shankhini purna vidyarajni priyamvada || 31||
    candranana mahagauri ajita pitavasasa | mahamaya mahashveta mahabalaparakrama || 32|| maharaudri mahacandi
    dushtasattvanishudini | prashanta shantarupa ca vijaya jvalanaprabha || 33|| vidyunmari dhvaji khangi
    cakri capodyatayudha | jambhano stambhani kali kalaratrirnishacari || 34|| rakshani mohani shanta
    kantari dravani shubha | brahmani vedamata ca guhya ca guhyavasini || 35|| mangalya shankari saumya
    jataveda manojava | kapalini mahavega sandhya satya'parajita || 36|| sarthavahakripadrishtirnashtamargapradarshini
    | varada shasani shastri surupa'mritavikrama || 37|| sharvari yogini siddha candari
  devanagari: ृणुत मे । अनुमोदध्वमेतद्वा भविष्यध्वं सुनिर्वृताः ॥ २७॥ ॐ लोचने सुलोचने तारे तारोद्भवे सर्वसत्त्वानुकम्पिनि
    सर्वसत्त्वतारिणि सहस्रभुजे सहस्रनेत्रे । ॐ नमो भगवते अवलोकय अवलोकय मां सर्वसत्त्वांश्च हुं हुं फट्
    फट् स्वाहा । ॐ शुद्धे विशुद्धे सुगतात्मजे मैत्रीहृदये निर्मले श्यामे श्यामरूपि महाप्राज्ञे प्रबलवरभूषिते
    । अपराजिता महारौद्री विश्वरूपी महाबला । ॐ सुश्रिये ॥ २८॥ ॐ कल्याणी महातेजा लोकधात्री महायशाः । सरस्वती
    विशालाक्षी प्रज्ञा श्रीर्बुद्धिवर्धिनी ॥ २९॥ धृतिदा पुष्टिदा स्वाहा ॐकारा कामरूपिणी । सर्वसत्त्वहितोद्युक्ता
    सङ्ग्रामोत्तारिणी जया ॥ ३०॥ प्रज्ञापारमिता देवी आर्यतारा मनोरमा । दुन्दुभी शङ्खिनी पूर्णा विद्याराज्ञी
    प्रियम्वदा ॥ ३१॥ चन्द्रानना महागौरी अजिता पीतवाससा । महामाया महाश्वेता महाबलपराक्रमा ॥ ३२॥ महारौद्री
    महाचण्डी दुष्टसत्त्वनिषूदिनी । प्रशान्ता शान्तरूपा च विजया ज्वलनप्रभा ॥ ३३॥ विद्युन्मारी ध्वजी खङ्गी
    चक्री चापोद्यतायुधा । जम्भनो स्तम्भनी काली कालरात्रिर्निशाचरी ॥ ३४॥ रक्षणी मोहनी शान्ता कान्तारी द्रावणी
    शुभा । ब्रह्माणी वेदमाता च गुह्या च गुह्यवासिनी ॥ ३५॥ माङ्गल्या शाङ्करी सौम्या जातवेदा मनोजवा । कपालिनी
    महावेगा सन्ध्या सत्याऽपराजिता ॥ ३६॥ सार्थवाहकृपादृष्टिर्नष्टमार्गप्रदर्शिनी । वरदा शासनी शास्त्री
    सुरूपाऽमृतविक्रमा ॥ ३७॥ शर्वरी योगिनी सिद्धा चण्डारी
