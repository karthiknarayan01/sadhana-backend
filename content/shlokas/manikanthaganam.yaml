id: manikanthaganam
category: stotram
name:
  english: manikanthaganam
  devanagari: मनिकन्थगानम्
content:
  english: manikanthaganam pahi pahi manikantha pavanamurte manikantha manikantha manikantha shabarigirisha
    manikantha || 1 pahi pahi manikantha bhaktajanapriya manikantha manikantha manikantha devaganavrita
    manikantha || 2 pahi pahi manikantha kaliyugavarada manikantha manikantha manikantha shitikanthatmaja
    manikantha || 3 ehi ehi manikantha kananamarge manikantha manikantha manikantha paramakripalo manikantha
    || 4 ehi ehi manikantha pampatire manikantha manikantha manikantha bhaktaganavrita manikantha || 5
    ehi ehi manikantha pujakale manikantha manikantha manikantha devaganarcita manikantha || 6 dehi dehi
    manikantha darshanabhagyam manikantha manikantha manikantha natajanavarada manikantha || 7 dehi dehi
    manikantha santati bhagyam manikantha manikantha manikantha satgati dayaka manikantha || 8 dehi dehi
    manikantha sarvabhishtam manikantha manikantha manikantha madagajavahana manikantha || 9 namaste namaste
    jvalahchastrahasta namaste namaste mahavetrahasta namaste namaste sphuraddamahasta namaste namaste
    sadajnanahasta ||
  devanagari: मणिकण्ठगानम् पाहि पाहि मणिकण्ठा पावनमूर्ते मणिकण्ठा मणिकण्ठा मणिकण्ठा शबरिगिरीशा मणिकण्ठा
    ॥ १ पाहि पाहि मणिकण्ठा भक्तजनप्रिय मणिकण्ठा मणिकण्ठा मणिकण्ठा देवगणावृत मणिकण्ठा ॥ २ पाहि पाहि मणिकण्ठा
    कलियुगवरदा मणिकण्ठा मणिकण्ठा मणिकण्ठा शितिकण्ठात्मजा मणिकण्ठा ॥ ३ एहि एहि मणिकण्ठा काननमार्गे मणिकण्ठा
    मणिकण्ठा मणिकण्ठा परमकृपालो मणिकण्ठा ॥ ४ एहि एहि मणिकण्ठा पंपातीरे मणिकण्ठा मणिकण्ठा मणिकण्ठा भक्तगणावृत
    मणिकण्ठा ॥ ५ एहि एहि मणिकण्ठा पूजाकाले मणिकण्ठा मणिकण्ठा मणिकण्ठा देवगणार्चित मणिकण्ठा ॥ ६ देहि देहि
    मणिकण्ठा दर्शनभाग्यं मणिकण्ठा मणिकण्ठा मणिकण्ठा नतजनवरदा मणिकण्ठा ॥ ७ देहि देहि मणिकण्ठा सन्तति भाग्यं
    मणिकण्ठा मणिकण्ठा मणिकण्ठा सत्गति दायका मणिकण्ठा ॥ ८ देहि देहि मणिकण्ठा सर्वाभीष्टं मणिकण्ठा मणिकण्ठा
    मणिकण्ठा मदगजवाहना मणिकण्ठा ॥ ९ नमस्ते नमस्ते ज्वलःछस्त्रहस्त नमस्ते नमस्ते महावेत्रहस्त नमस्ते नमस्ते
    स्फुरद्दामहस्त नमस्ते नमस्ते सदाज्ञानहस्त ॥
