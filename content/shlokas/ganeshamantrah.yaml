name:
  english: ganeshamantrah
  devanagari: गणेशमन्त्रः
content:
  english: yo yadi mohaddasyati sa papiyan bhavati sahasravartanat yam yam kamamadhite tam tamanena sadhayet
  devanagari: यो यदि मोहाद्दास्यति स पापीयान् भवति सहस्रावर्तनात् यं यं काममधीते तं तमनेन साधयेत्
