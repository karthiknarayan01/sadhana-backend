id: sri-ranganatha-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sri Ranganatha Ashtottara Sata Nama Stotram
content:
  english: asya shriranganathashtottarashatanamastotramahamantrasya vedavyaso bhagavanrishih anushtupchandah
    bhagavan shrimahavishnurdevata shrirangashayiti bijam shrikanta iti shaktih shriprada iti kilakam
    mama samastapapanasharthe shrirangarajaprasada siddhyarthe jape viniyogah | dhaumya uvaca | shrirangashayi
    shrikantah shripradah shritavatsalah | ananto madhavo jeta jagannatho jagadguruh || || suravaryah
    suraradhyah surarajanujah prabhuh | harirhatarirvishveshah shashvatah shambhuravyayah || || bhaktartibhanjano
    vagmi viro vikhyatakirtiman | bhaskarah shastratattvajno daityashasta'mareshvarah || || narayano naraharirnirajaksho
    narapriyah | brahmanyo brahmakridbrahma brahmango brahmapujitah || || krishnah kritajno govindo hrishikesho'ghanashanah
    | vishnurjishnurjitaratih sajjanapriya ishvarah || || trivikramastrilokeshah trayyarthastrigunatmakah
    | kakutsthah kamalakantah kaliyoragamardanah || || kalambudashyamalangah keshavah kleshanashanah |
    keshiprabhanjanah kanto nandasunurarindamah || || rukminivallabhah shaurirbalabhadro balanujah | damodaro
    hrishikesho vamano madhusudanah || || putah punyajanadhvamsi punyashlokashikhamanih | adimurtirdayamurtih
    shantamurtiramurtiman || || parambrahma parandhama pavanah pavano vibhuh | candrashchandomayo ramah
    samsarambudhitarakah || || aditeyo'cyuto bhanuh shankarashshiva urjitah | maheshvaro mahayogi mahashaktirmahatpriyah
    || || durjanadhvamsako'sheshasajjanopastasatphalam | pakshindravahano'kshobhyah kshirabdhishayano
    vidhuh || || janardano jagaddheturjitamanmathavigrahah | cakrapanih shankhadhari sharngi khadgi gadadharah
    || || evam vishnoshshatam namnamashtottaramiheritam | stotranamuttamam guhyam namaratnastavabhidham
    || || sarvada sarvarogaghnam cintitarthaphalapradam | tvam tu shighram maharaja gaccha rangasthalam
    shubham || || snatva tularke kaveryam mahatmya shravanam kuru | gavashvavastradhanyannabhumikanyaprado
    bhava || || dvadashyam payasannena sahasram dasha bhojaya | namaratnastavakhyena vishnorashtashatena
    ca | stutva shriranganatham tvamabhishtaphalamapnuhi || || iti tulakaverimahatmye shantanum prati
    dhaumyopadishta shriranganathashtottarashatanama stotram |
  devanagari: अस्य श्रीरङ्गनाथाष्टोत्तरशतनामस्तोत्रमहामन्त्रस्य वेदव्यासो भगवानृषिः अनुष्टुप्छन्दः भगवान्
    श्रीमहाविष्णुर्देवता श्रीरङ्गशायीति बीजं श्रीकान्त इति शक्तिः श्रीप्रद इति कीलकं मम समस्तपापनाशार्थे
    श्रीरङ्गराजप्रसाद सिद्ध्यर्थे जपे विनियोगः । धौम्य उवाच । श्रीरङ्गशायी श्रीकान्तः श्रीप्रदः श्रितवत्सलः
    । अनन्तो माधवो जेता जगन्नाथो जगद्गुरुः ॥ ॥ सुरवर्यः सुराराध्यः सुरराजानुजः प्रभुः । हरिर्हतारिर्विश्वेशः
    शाश्वतः शम्भुरव्ययः ॥ ॥ भक्तार्तिभञ्जनो वाग्मी वीरो विख्यातकीर्तिमान् । भास्करः शास्त्रतत्त्वज्ञो
    दैत्यशास्ताऽमरेश्वरः ॥ ॥ नारायणो नरहरिर्नीरजाक्षो नरप्रियः । ब्रह्मण्यो ब्रह्मकृद्ब्रह्मा ब्रह्माङ्गो
    ब्रह्मपूजितः ॥ ॥ कृष्णः कृतज्ञो गोविन्दो हृषीकेशोऽघनाशनः । विष्णुर्जिष्णुर्जितारातिः सज्जनप्रिय ईश्वरः
    ॥ ॥ त्रिविक्रमस्त्रिलोकेशः त्रय्यर्थस्त्रिगुणात्मकः । काकुत्स्थः कमलाकान्तः कालीयोरगमर्दनः ॥ ॥ कालाम्बुदश्यामलाङ्गः
    केशवः क्लेशनाशनः । केशिप्रभञ्जनः कान्तो नन्दसूनुररिन्दमः ॥ ॥ रुक्मिणीवल्लभः शौरिर्बलभद्रो बलानुजः
    । दामोदरो हृषीकेशो वामनो मधुसूदनः ॥ ॥ पूतः पुण्यजनध्वंसी पुण्यश्लोकशिखामणिः । आदिमूर्तिर्दयामूर्तिः
    शान्तमूर्तिरमूर्तिमान् ॥ ॥ परम्ब्रह्म परन्धाम पावनः पवनो विभुः । चन्द्रश्छन्दोमयो रामः संसाराम्बुधितारकः
    ॥ ॥ आदितेयोऽच्युतो भानुः शङ्करश्शिव ऊर्जितः । महेश्वरो महायोगी महाशक्तिर्महत्प्रियः ॥ ॥ दुर्जनध्वंसकोऽशेषसज्जनोपास्तसत्फलम्
    । पक्षीन्द्रवाहनोऽक्षोभ्यः क्षीराब्धिशयनो विधुः ॥ ॥ जनार्दनो जगद्धेतुर्जितमन्मथविग्रहः । चक्रपाणिः
    शङ्खधारी शार्ङ्गी खड्गी गदाधरः ॥ ॥ एवं विष्णोश्शतं नाम्नामष्टोत्तरमिहेरितम् । स्तोत्राणामुत्तमं गुह्यं
    नामरत्नस्तवाभिधम् ॥ ॥ सर्वदा सर्वरोगघ्नं चिन्तितार्थफलप्रदम् । त्वं तु शीघ्रं महाराज गच्छ रङ्गस्थलं
    शुभम् ॥ ॥ स्नात्वा तुलार्के कावेर्यां माहात्म्य श्रवणं कुरु । गवाश्ववस्त्रधान्यान्नभूमिकन्याप्रदो
    भव ॥ ॥ द्वादश्यां पायसान्नेन सहस्रं दश भोजय । नामरत्नस्तवाख्येन विष्णोरष्टशतेन च । स्तुत्वा श्रीरङ्गनाथं
    त्वमभीष्टफलमाप्नुहि ॥ ॥ इति तुलाकावेरीमाहात्म्ये शन्तनुं प्रति धौम्योपदिष्ट श्रीरङ्गनाथाष्टोत्तरशतनाम
    स्तोत्रम् ।
