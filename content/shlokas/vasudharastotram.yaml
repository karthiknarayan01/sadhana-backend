id: vasudharastotram
category: stotram
name:
  english: vasudharastotram
  devanagari: वसुधारास्तोत्रम्
content:
  english: vasudharastotram ya samyaguktavidhibhih paripathyamana lakshmim dadati vipulam sugatopabhogan
    | tam dharanim sakalasattvahitaikacittam bhaktya namami satatam vasudharasamjnam || 1|| ya samsmrita
    sucirasusthataram pravriddham daridrayaduhkhaduritam shamate naranam | tam kalpavrikshasadrishim vasudharasamjnam
    nityam namami shirasa jagatam hitaya || 2|| ratnakarim ratnanidhanakosham vicitraratnam pratibhasavarsham
    | ratnavalim ratnamayim vicitram namami caryam vasudharadharam || 3|| tam ratnapanisaphalamavabhasaya
    te tyagavatamsadayashekharamudvahantim | harardhaharacalakundalabhushitangi
  devanagari: वसुधारास्तोत्रम् या सम्यगुक्तविधिभिः परिपथ्यमाना लक्ष्मीं ददाति विपुलां सुगतोपभोगान् । तां
    धारणीं सकलसत्त्वहितैकचित्तां भक्त्या नमामि सततं वसुधारसंज्ञाम् ॥ १॥ या संस्मृता सुचिरसुस्थतरं प्रवृद्धं
    दारिद्रयदुःखदुरितं शमते नराणाम् । तां कल्पवृक्षसदृशीं वसुधारसंज्ञां नित्यं नमामि शिरसा जगतां हिताय
    ॥ २॥ रत्नाकरीं रत्ननिधानकोषां विचित्ररत्नां प्रतिभासवर्षाम् । रत्नावलीं रत्नमयीं विचित्रां नमामि चार्यां
    वसुधारधाराम् ॥ ३॥ तां रत्नपाणिसफलामवभासया ते त्यागावतंसदयशेखरमुद्वहन्तीम् । हारार्धहारचलकुण्डलभूषिताङ्गी
meaning: {}
