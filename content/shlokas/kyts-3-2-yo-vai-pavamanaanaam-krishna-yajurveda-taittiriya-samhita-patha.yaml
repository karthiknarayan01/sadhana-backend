    इ॒ह ॥ यक्ष॑च्च पि॒प्रय॑च्च नो॒ विप्रो॑ दू॒तः परि॑ष्कृतः । नभ॑न्तामन्य॒के स॑मे ॥ इन्द्रा॑विष्णू दृग्ंहि॒ता
    श्शम्ब॑रस्य॒ नव॒ पुरो॑ नव॒ति ञ्च सा॒कग्ं ह॒थो अ॑प्र॒त्यसु॑रस्य वी॒रान् ॥ उ॒त मा॒ता म॑हि॒ष मन्व॑वेनद॒मी
    त्वा॑ जहति पुत्र दे॒वाः । अथा द्वृ॒त्रमिन्द्रो॑ हनि॒ष्यन् थ्सखे॑ विष्णो वित॒रं ॥ हरिः॑ ओम् ॥ ॥ कृष्ण
    यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे द्वितीयः प्रश्न
