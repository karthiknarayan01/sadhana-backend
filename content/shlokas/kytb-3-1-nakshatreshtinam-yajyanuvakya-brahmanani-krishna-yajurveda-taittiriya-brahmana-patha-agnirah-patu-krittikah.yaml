    सलो॒कता॑माप्नोति । य ए॒तेन॑ ह॒विषा॒ यज॑ते । य उ॑ चैनदे॒वं ऽत्र॑ जुहोति । च॒न्द्रम॑से॒ स्वाहा प्रती॒दृश्या॑यै॒
