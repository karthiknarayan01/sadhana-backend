id: namavali-9-2
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om shanmukhaya namah | om sumukhastrataya namah | om lekhasenapataye namah | om prabhave namah
    | om shaktihastaya namah | om duradharshaya namah | om vitihotrangajaya namah | om baline namah |
    om krauncadrimathanaya namah | om yogine namah | 10 || om subrahmanyaya namah | om makheditaya namah
    | om gangeyaya namah | om vaidyutaya namah | om amoghaya namah | om tarakantakaraya namah | om ravaye
    namah | om mahasenaya namah | om devavaidyaya namah | om pranavarthaprakashakaya namah | 20 || om
    mahasenaya namah | om sharavanodbhavaya namah | om bhavasutaya namah | om anaghaya namah | om vinayakanujaya
    namah | om shurasamharakarakaya namah | om senanine namah | om durduraya namah | om viraya namah |
    om garbhaya namah | 30 || om vishvapataye namah | om kavaye namah | om gurave namah | om harihayaya
    namah | om shastre namah | om sharasanakaraya namah | om sharine namah | om vyapakaya namah | om anantashaktaye
    namah | om sukumaraya namah | 40 || om projjvalangakaya namah | om virabahave namah | om ganadhyakshaya
    namah | om tryakshapritaya namah | om visharadaya namah | om kantaya namah | om shantaya namah | om
    jitarataye namah | om umakantatmajaya namah | om aparaya namah | 50 || om vallipataye namah | om kukkutottamaketanaya
    namah | om shivalingarcanapritaya namah | om gandhapushpadyalankritaya namah | om mukutine namah |
    om angadine namah | om cakrine namah | om gadine namah | om shankhine namah | om shikhine namah |
    60 || om jatine namah | om sanatanaparaya namah | om taraya namah | om tarakaya namah | om tarakantakrite
