    gunavannijashaktikah || 134|| gandharvapranapalesho girvanabalavriddhikrit | girvanalokadhrinnatho
    gadheccho gatibhogadah || 135|| grihitajnanakrinmurtirgrihito girigo gadah | gopagitiprasannatma girirajeshtasadhakah
    || 136|| ganakapravaraprajno gargaharganamshaktikrit | ganakanampatirgoshtho gauravanishvareshvarah
    || 137|| girindrabhayamurtishca guhacintitapuranah | granthasarvasvarupartho gitalapavicakshanah ||
    138|| gihshreshtho gunasampanno girvanendrashiromanih | grihitayogasanmurtirgrihitasthirashemushih
    || 139|| gandharvarajarajeshto girvanaprapitamahah | girvanendrarcitapadapitho gauravavastubhuh ||
    140|| gunamatrasadasakshi gunirupo gunipradah | gayako gandhavadagryo girvaneshashatoditah || 141||
    guhanadapravinashca guhanadajanishrutah | guhapashyantibhurgudhamadhyamanadabhrinmatah || 142|| girdevo
    glasakrid garvo gihsevyo gihpriyankarah | gihshokartiharo govid giranartharthakhandanah || 143|| gambhiraishvaryasamsiddho
    gadhapadvinivarakah gandharvalokabhibhramshi gunishuddho gunishtabhuh || 144|| ganonnito gunollaso
    gunabhrad girnamaskritah | ganarhyo ganasamvito garmudasanasamsthitah || 145|| goyogapaddhatehkarta
    guruyogarthashailikah | goyogavastusandarshi gambhirajapamantradah || 146|| guruso'hamsumantrajno
    gudhayogavibhutivit | gosatyajnanacidbrahma gurupad gurupadukah || 147|| gudhapado gudakajid guhashreshtho
    guhashritah | gatasarvendriyabhaso gathageyo gatanritah || 148|| guruputrastavaradhyo guruputrarcitanghrikah
    | guruputreshtasiddheh krid guruputramahapriyah || 149||| guruyogasamriddhisho guruyogavibhavanah
    | gaurapunyakatho gaurakavyo gitavisharadah || 150|| gathagito gatishashca gauraishvaryo ganartibhit
    | gaurabhairavaso'hanjno gauralokaphalapradah || 151|| gurubhaktasukhambhodhirgaurasurashataprabhah
    | gauravanishasadrupo gopyapatanjalasmritah || 152|| gitakavyakathalapavidagdho gitagayakah | gautraikavishado
    gotratrananandanakarakah || 153|| gotracatakajimuto gotragananatatparah | gatagatabahirbhuto gonityo
    gunadacchavih || 154|| gatakaro gunanando gunyasmitavibhushitah | gaurabhasmavagunthadhyo gunyamalavirajitah
    || 155|| govardhanadharapreshtho gopamandalamadhyagah | gopakashcaiva gopitho gavanugatishobhanah
    || 156|| glanyadiparatantryadivishesharahitah sada | gayatriyogasamsnato gayatrijapatatparah || 157||
    gayatrimulasarvajno gayatryajapajapakah | gaurabjamali guhyarthyo gauragokularakshakah ||| 158|| goyamapreshyabhibhuto
    gokalabhayanashakah | govishvapalako gandhapadananandananditah || 159|| gautamadimaharshisho gurugautamashastradah
    | gautamanyayayuktatma gautamajnanadipakah || 160|| gotravilasagarvishto gotrarakshi gatonnatah |
    godevabrahmavartmatma gobrahmanashiromanih || 161|| gobrahmadevatadurgo gobahmashanipanjarah | gatasarvabhayabhrantirgatasango
    gatanjjanah || 162|| gudhakutasthadhama ca grastakalabhayavyathah | gudhatigomanovacam gudhasankarshanatmakah
    || 163|| gudhahetu gumhitajno grihisarvabhayankarah | gudhavishvo gatonnaho gatashirgodurasadah ||
    164|| gudhasarvagatirgudhamaharudro guhantarah | gatasarvanritaloko gudhakamyo gavamritah || 165||
    gavanullanghyatama vai gudhasarvasukhaikabhuh | gudhavishvapita gudhavishvatomukha eva ca || 166||
    gihsarvashcaryasambhutirgurusarvavikarahrit | gaurasarvarthavishvatma gatisarvasharirijit || 167||
    gadhanantapadashaktirgatapattirgavaksharah | gadhasneho guhahamso guhaso'hamniyojakah || 168|| gudhocetanajivesho
    gadhanantayashah smritah | gotraikavisphuradviryo gatahamvada eva ca || 169|| gataparo gavishthadyo
    gunakalyanasagarah | girishabrahmavaikunthadyutkrishtatara cetanah || 170|| guhantaryamibhrajishnurgaurikotyarimardanah
    | gabhastimadanantabho guhyakeshavibhutidah || 171|| gatrahinashatanantarupalavanyasagarah | girashibrahmavishnvakhyajagadbhangadikarakah
    || 172|| gadhakalamahakalo gambhiryaudaryasagarah | gotradugghasudhamodo gathakavyakathoditah || 173||
    gathavidagdho gaurishto gadyapadyapradipanah | guhyopanishadavedyo guhyabrahmashivatmakah || 174||
    giradyo granthihrid granthi gunavriddhiprayojakah | gunardhidashca sarvesham gishpatishvarapungavah
    || 175|| gadhadharadharo guptasvadhishthanadridhasanah | garbhastamanipurarko guhanahatacakrabhah
    || 176|| guhabjavaso gaganamahapadmapadashrayah | galadeshavishuddhastho galatpiyushajoshanah || 177||
    gobrahmarandhraveshmarko gaganakritinirmalah | gatamandyo gunaprajno gudhajnacakrabhaskarah || 178||
    gurusiddhasanasthayi guhapadmasanasthitah | gudhadharadyupadeshta gopyalakshavicarakrit || 179|| guhastambhopadishtatma
    gopyashunyavidhanadah | gopyadevo gatadvandvo gauradevo gatatrivrit || 180|| geshnurgetnvashrayo geshnupatirgeshnunatapriyah
    | gorag gorakshanathashca godhumaradhyavigrahah || 181|| gopa gopapriyo grahi goparhyo goshthapalakah
    | gupto gopalanamapi gaushthinastho gavishvarah || 182|| gangamaulirgavamisho gogamyo govidangatih
    | gavedyo gaganakaro gratsadhirgodharo grahi || 183|| godhano godhanadhisho guptavastujna eva ca |
    gokuli guptagurgodhug gorajashchuritakritih || 184|| guptendriyakulo guptagoraksho gomatangatih |
    gudhatma guptagorupo gopajyeshtho gavangatih || 185|| geshnuprano gunagamyo geshnujno geshnusarvavit
    | gunaprag gunadhama ca godanavidhivedakah || 186|| goshthipalo gitipaturgitigito gatalasah | gopikagitasantushto
    gitagitavisharadah || 187|| gitiprito guhaguhyo grihyagitavivecakah | gitopanishadagamyo gitopanishadaksharah
    || 188|| gunavidu gunamaryado gandhagrahi gunotkato gojit | garganugrahakarta gargacaryabhramartisamharta
    || 189|| gargapratyarthidhgo girvaneshadisamstuto gobhrat | grahadoshanirakarta gotraprano'tha garvavicchetta
    || 190|| shrigorakshasahasranamakamadastrailokyabhushaspadam shakradyairakhilairajastramamaraistoshtuyyamanam
    bhrisham | gadigranthanigumphita shubhatara vidvanjananandam yogishananunam sadastu bhavatam tushtyai
    ca pushtyai mude || 191|| svasti shrim shreyah shrenayah shrimatam samullasantutaram | iti shri siddhasadhyavidyadharagandharvasiddhayogindra
    devendranarendradivandadaruvrinda vanditanandamakarandavindusandohanisyandipadaravindasya tribhuvanagunostrilocanasya
    gargadimaharshigitasya bhagavato gorakshanathasya gakaradi sahasranamastutih sampurna |
  devanagari: ृङ्गिनिनादभृतः । गुप्तागुप्तो ग्रन्थबलो ग्रन्थार्थप्रतिपादितः ॥ ७९॥ गणकप्रीतिकृद् गर्गदेवो
    गर्गादिसत्कृतः । गोरक्षगणकाग्राण्यो गोरक्षावलिकृत्तमः ॥ ८०॥ ग्रन्थपारायणप्राप्यो गुह्यग्रन्थार्थदीपकः
    । गौरयोगार्थतत्त्वज्ञो गुरुवेदनिरूपितः ॥ ८१॥ गणराडर्चितो नित्यं गोविन्दार्यसमृतिपदः । गोविन्देष्टप्रियादाता
    गौरापारपराक्रमः ॥ ८२॥ गोविन्दात्मा च गम्भीरो गीःप्रियङ्कर एव च । गूढजत्रुर्ग्रस्तशोको गुणगण्यो गुणलकः
    ॥ ८३॥ ग्रन्थप्रयोजको गौरमर्यादो ग्रन्थकेतनः । ग्रन्थार्थद्योतको गोदो ग्रन्थसिद्धान्तभास्करः ॥ ८४॥
    गायकप्रवरप्रेष्ठो गायकेष्टार्थदायकः । गायकवादकानर्तकार्यकानन्दमुक्तिदः ॥ ८५॥ गोङ्कारबीजसंश्लिष्टो
    गुह्यसोऽहंशिवात्मकः । गुरुशिष्यार्थितार्थज्ञो गौरहंसो गुणावृतः ॥। ८६॥ गन्धर्वदेवसेव्याङ्घ्रिर्गन्धर्वपरमेश्वरः
    । गौरसिद्धो गुणावश्यो गौरधर्मज्ञ एव च ॥ ८७॥ गुडाकाहृद् गोपरेशो गिरात्मा गीःप्रियंवदः । गालवर्षिप्रियापाद्यो
    गोष्ठामयविधस्मरः ॥ ८८॥ गायत्रीमन्त्रविद्वेद्यो गोचरप्रियवर्धनः । गमको गौतमो गाता गतियाथार्थ्ययोगकृत
    ॥ ८९॥ गोकर्णारण्यसंरन्ता गोकर्णाश्रमवन्दितः । गान्धारनिर्भयारामो गान्धारक्षोणिपालकः ॥ ९०॥ गुप्तार्थदो
    गुणागम्यो ग्रन्थप्रकटपौरुषः । गतिभृद् गम्यमूर्तिश्च गुणादिशिवसंश्रुतः ॥ ९१॥ गिरागम्यो गवामीशो गिरर्थार्थो
    गिरांवरः । गृहीतगुणवल्लीलो गानविज्ञानपारदः॥ ९२॥ गव्यापालो गणश्रीशो गोस्वयम्भूर्गणेष्टभूः । गणनाथो
    गृहानिष्ठो गानो गानो गमात्मकः ॥ ९३॥ गुणागुणगणातीतो गुणत्रयविभावनः ॥ गोत्राचारप्रियो गोत्रो गोत्रानाथो
    गुणाकरः ॥ ९४॥ गायमानप्रियो ग्लौभृद् गीताङ्गो गीतपेशलः । गानसामसमागेयो गणदुष्कृतनाशनः ॥ ९५॥ गीर्वाणभाषासम्भाष्यो
    ग्रीवागरलशेषभृत् । गणराजाधिराजश्च गतिमान् गणवान् गणी ॥ ९६॥ गुणसृग् गतिधृग् गेयो गर्ववद्दुःखकृत्तमः
    । गुणभ्राजो गणश्रेष्ठो गुणकृद् गुणहृद् गृहः ॥ ९७॥ गुरुज्ञानो गुणाभ्भोधिर्गुहाधामा गणप्रभुः । गोप्यमूर्तिर्गुहीतार्थो
    गृहीतगुणवज्जगत् ॥ ९८॥ गोत्रापालकपालेष्टो गाननादज्ञमन्मथः । गोपस्तोमप्रियानन्दो गौरस्वाध्यायवेदितः
    ॥ ९९॥। गोत्राह्लादकमूर्तिश्च गुणतत्त्वविवेककृत् । गोवेद्यो गोऽर्थविद् गद्यो गद्यभाषाप्रभाषणः ॥ १००॥
    गतोर्मिषट्कवर्षिष्ठो गुणषट्कप्रधानजित् । गतकारणकार्यश्च गतसाम्यातिशायकः ॥ १०१॥ गतसर्वावतारत्वावतारिभेदकल्पनः
    । गुह्यप्रणवचिन्नादो गुहास्थानस्थिरासनः ॥ १०२॥ गायत्रीजपसंसाध्यो गायत्रीमत्प्रपूजितः । गायत्रीमद्गुणाकारो
    गायत्रीमत्परात्मकः ॥ १०३॥ गायत्रीमत्सदातुष्टो गायत्रीमत्सदाशिवः । गायत्रीमदधिष्ठाता गायत्रीमत्फलात्मकः
    ॥ १०४॥ गायत्रीमत्सदासेव्यो गायत्रीमद्यशोवहः । गायत्रीमद्गहान्तःस्थो गायत्रीमत्सुखालयः ॥ १०५॥ गायन्त्रीविदुषांवर्चो
    गायत्रीमद्विवर्धनः । गवात्मवान् गवांवाग्मी गणशत्रुनिवर्हणः ॥ १०६॥ गायत्रीमन्महालोको गायत्रीमत्प्रिङ्करः
    । गायत्रीमत्कुलानन्दी गायत्रीमद्धुरन्धरः ॥ १०७॥ गौरीसरोनिजानन्दो गौरीशसर आश्रमः । गौरीसरस्तपःस्थायी
    गौरीशसर आसनः ॥ १०८॥ गोस्तनीफलभुग् गाढो गौरगात्रो गवायनः । गोग्रामणीर्गुणग्रामो गाढानुग्रहकारकः ॥ १०९॥
    गुरु मोहनिराकर्ता गाथाम्नायदिवाकरः । गरागरासमारन्ता गोस्तनीफलभोजनः ॥ ११०॥ गुरुयोगफलस्त्रष्टा च गाढानन्दामृतात्मकः
    । गढयोगान्तरात्मा च गाढयोगपुरातनः ॥ १११॥ गुणातिशयवान् गण्यो गुण्यो गुणपरायणः । गोसिद्धसाधनानाथो गूढसत्परमार्थदः
    ॥ ११२॥ गुरुसद्गुरुनामा च गुरुशैवशिवार्थदः । गुप्तावधूतशैलीभृद् गुरुयोगिशिवात्मकः ॥ ११३॥ गूढसिद्धान्तसंसिद्धो
    गतक्लेशतरङ्गकः । गताखिलाधिसन्नाथो गुह्यस्वस्मरभूतिमान् ॥ ११४॥ गुह्योङ्कारप्रतिष्ठानो गुहाकञ्जस्थिरासनः
    । गूढधारोदयो गोधा गताखिलकलङ्ककः ॥ ११५॥ गुर्वङ्कभूतिभूषाढ्यो गुरुशो गुरुखात्मकः । गुह्यात्मपरधामा च
    गुह्यशङ्खंसुखार्थकृत् ॥ ११६॥ गोप्यशङ्खंशिरोधायी गाढनिस्सोमसौहृदः । गौरमृगाजिनाधर्ता गुरुशैलीपरार्थवित्
    ॥ ११७॥ गुणषड्वैकृतातीतो गौरपद्धतिपादुकः । गुह्यचिदुल्लसन्मुद्रो गोऽजपाजापशान्तिकृत् ॥ ११८॥ गुरुधैर्यपराशक्तिर्गुहादीपनविग्रहः
    । गौरचिन्मेखलाधारी गृह्ययोगसुवस्त्रभृत् ॥ ११९॥ गताद्वैतेतराभासो गढतन्मयकारकः । गतोपाधिनिजानन्ददिग्देशसुदृढासनः
    ॥। १२०॥ गुहाप्रादेशनिलयो गुहासाक्षात्प्रकाशकः । गतमृत्युमहामोहो गाढाजाजवनीनटः ॥ १२१॥ गाढवासनवल्लीभुग्
    गुहात्मज्ञानसर्वगः । गाढावर्तजगद्वेत्ता गतोत्थानमयात्मकः ॥ १२२॥ गतोत्थाधारधर्मज्ञो गतविश्रान्तिचिन्मयः
    । गृहीतचिन्मयाकारो गृहीतपदमुक्तिदः ॥ १२३॥ गुर्वाज्ञो गौरसिद्धेन्द्रो गुहादेसदाऽमृतः । गणशुद्धो गणाभिज्ञो
    गात्रोद्वारकरप्रभुः ॥ १२४॥ गात्रसत्यो गवेषेष्टो गाढभोक्ता गुहाचलः । गतव्यामोहमात्सर्यो गुरुज्ञानप्रबोधकः
    ॥ १२५॥ गतपारमहामोहतरङ्गाब्धिविशोषणः । गतभीर्गतदैन्यश्च गतलज्जो गतामयः ॥ १२६॥ गतशोको गतार्तिश्च गाढालस्यविवर्जितः
    । गाढमोहमदच्छिच्च गाढदम्भासुखावहः ॥ १२७॥ गतमायो गतभ्रान्तिर्गुर्वाज्ञामार्गदर्शकः । गाढाहङ्कारशून्यश्च
    गर्वमोहपराङ्मुखः ॥ १२८॥ गतात्यन्तमदक्रोधो गाढाविद्याख्यदोषमुट् । गतकामाङ्कुरो गाढासूयाधर्मपराङ्मुखः
    ॥ १२९॥ गुणवद्वादसद्वक्ता गुणवच्छास्त्रविद्वभुः । गुणवद्योगसन्तानो गुणवद्योगसिद्धिदः ॥ १३०॥ गुणेन्द्रियतिरस्कर्ता
    गुणवन्मानवर्धनः । गुणवत्सम्प्रदायेष्टो गुणवद्गुणशोधकः ॥ १३१॥ गर्भामयनिराकर्ता गर्ववत्कुलकन्दनः । गर्ववत्प्राणसंहर्ता
    गुणवद्वृत्तिदायकः ॥ १३२॥ गूढपिण्डादिभूजन्मा गात्रशोधकनामकः । गतसर्वासुरव्यूहो गूढशक्तिप्रदीपकः ॥ १३३॥
    गुणापारापराशक्तिर्गुणवत्परशक्तिकः । गुणवत्सूक्ष्मशक्तिज्ञो गुणवन्निजशक्तिकः ॥ १३४॥ गन्धर्वप्राणपालेशो
    गीर्वाणबलवृद्धिकृत् । गीर्वाणलोकधृङ्नाथो गाढेच्छो गतिभोगदः ॥ १३५॥ गृहीतज्ञानकृन्मूर्तिर्गृहीतो गिरिगो
    गदः । गोपगीतिप्रसन्नात्मा गिरिराजेष्टसाधकः ॥ १३६॥ गणकप्रवरप्रज्ञो गर्गाहर्गणंशक्तिकृत् । गणकानाम्पतिर्गोष्ठो
    गौरवाणीश्वरेश्वरः ॥ १३७॥ गिरीन्द्राभयमूर्तिश्च गुहाचिन्तितपूरणः । ग्रन्थसर्वस्वरूपार्थो गीतालापविचक्षणः
    ॥ १३८॥ गीःश्रेष्ठो गुणसम्पन्नो गीर्वाणेन्द्रशिरोमणिः । गृहीतयोगसन्मूर्तिर्गृहीतस्थिरशेमुषिः ॥ १३९॥
    गन्धर्वराजराजेष्टो गीर्वाणप्रपितामहः । गीर्वाणेन्द्रार्चितापादपीठो गौरववस्तुभूः ॥ १४०॥ गुणमात्रसदासाक्षी
    गुणिरूपो गुणिप्रदः । गायको गन्धवाडग्र्यो गीर्वाणेशशतोदितः ॥ १४१॥ गुहानादप्रवीणश्च गुहानादजनिश्रुतः
    । गुहापश्यन्तीभूर्गूढमध्यमानादभृन्मतः ॥ १४२॥ गीर्देवो ग्लासकृद् गर्वो गीःसेव्यो गीःप्रियङ्करः । गीःशोकार्तिहरो
    गोविद् गिरनर्थार्थखण्डनः ॥ १४३॥ गम्भीरैश्वर्यसंसिद्धो गाढापद्विनिवारकः गन्धर्वलोकभीभ्रंशी गुणिशुद्धो
    गुणीष्टभूः ॥ १४४॥ गणोन्नीतो गुणोल्लासो गुणभ्राड् गीर्नमस्कृतः । गणार्ह्यो गणसंवीतो गर्मुदासनसंस्थितः
    ॥ १४५॥ गोयोगपद्धतेःकर्ता गुरुयोगार्थशैलिकः । गोयोगवस्तुसन्दर्शी गम्भीराजपमन्त्रदः ॥ १४६॥ गुरुसोऽहंसुमन्त्रज्ञो
    गूढयोगविभूतिवित् । गोसत्यज्ञानचिद्ब्रह्म गुरुपाद् गुरुपादुकः ॥ १४७॥ गूढपादो गुडाकाजिद् गुहाश्रेष्ठो
    गुहाश्रितः । गतसर्वेन्द्रियाभासो गाथागेयो गतानृतः ॥ १४८॥ गुरुपुत्रस्तवाराध्यो गुरुपुत्रार्चिताङ्घ्रिकः
    । गुरुपुत्रेष्टसिद्धेः कृद् गुरुपुत्रमहाप्रियः ॥ १४९॥। गुरुयोगसमृद्धीशो गुरुयोगविभावनः । गौरपुण्यकथो
    गौरकाव्यो गीतविशारदः ॥ १५०॥ गाथागीतो गतीशश्च गौरैश्वर्यो गणार्तिभित् । गौरभैरवसोऽहञ्ज्ञो गौरलोकफलप्रदः
    ॥ १५१॥ गुरुभक्तसुखाम्भोधिर्गौरसूरशतप्रभः । गौरवाणीशसद्रूपो गोप्यपातञ्जलस्मृतः ॥ १५२॥ गीतकाव्यकथालापविदग्धो
    गीतगायकः । गौत्रैकविशदो गोत्रात्राणनन्दनकारकः ॥ १५३॥ गोत्राचातकजीमूतो गोत्रागणनतत्परः । गतागतबहिर्भूतो
    गोनित्यो गुणदच्छविः ॥ १५४॥ गताकारो गुणानन्दो गुण्यस्मितविभूषितः । गौरभस्मावगुण्ठाढ्यो गुण्यमालाविराजितः
    ॥ १५५॥ गोवर्धनधरप्रेष्ठो गोपमण्डलमध्यगः । गोपकश्चैव गोपीथो गवानुगतिशोभनः ॥ १५६॥ ग्लान्यादिपारतन्त्र्यादिविशेषरहितः
    सदा । गायत्रीयोगसंस्नातो गायत्रीजपतत्परः ॥ १५७॥ गायत्रीमूलसर्वज्ञो गायत्र्यजपजापकः । गौराब्जमाली गुह्यार्थ्यो
    गौरगोकुलरक्षकः ॥। १५८॥ गोयमप्रेष्यभीभूतो गोकालभयनाशकः । गोविश्वपालको गन्धपादनानन्दनन्दितः ॥ १५९॥ गौतमादिमहर्षीशो
    गुरुगौतमशास्त्रदः । गौतमन्याययुक्तात्मा गौतमज्ञानदीपकः ॥ १६०॥ गोत्राविलासगर्विष्टो गोत्रारक्षी गतोन्नतः
    । गोदेवब्रह्मवर्त्मात्मा गोब्राह्मणशिरोमणिः ॥ १६१॥ गोब्रह्मदेवतादुर्गो गोबह्माशनिपञ्जरः । गतसर्वभयभ्रान्तिर्गतसङ्गो
    गताञ्ज्जनः ॥ १६२॥ गूढकूटस्थधामा च ग्रस्तकालभयव्यथः । गूढातिगोमनोवाचां गूढसङ्कर्षणात्मकः ॥ १६३॥ गूढहेतु
    गूंहीतज्ञो गृहिसर्वाभयङ्करः । गूढविश्वो गतोन्नाहो गताशीर्गोदुरासदः ॥ १६४॥ गूढसर्वगतिर्गूढमहारुद्रो
    गुहान्तरः । गतसर्वानृतालोको गूढकाम्यो गवामृतः ॥ १६५॥ गवानुल्लङ्घ्यतामा वै गूढसर्वसुखैकभूः । गूढविश्वपिता
    गूढविश्वतोमुख एव च ॥ १६६॥ गीःसर्वाश्चर्यसम्भूतिर्गूरुसर्वविकारहृत् । गौरसर्वार्थविश्वात्मा गतिसर्वशरीरिजित्
    ॥ १६७॥ गाढानन्तपदाशक्तिर्गतापत्तिर्गवाक्षरः । गाढस्नेहो गुहाहंसो गुहासोऽहंनियोजकः ॥ १६८॥ गूढोचेतनजीवेशो
    गाढानन्तयशाः स्मृतः । गोत्रैकविस्फुरद्वीर्यो गताहंवाद एव च ॥ १६९॥ गतपारो गविष्ठाद्यो गुणकल्याणसागरः
    । गिरीशब्रह्मवैकुण्ठाद्युत्कृष्टतर चेतनः ॥ १७०॥ गुहान्तर्यामिभ्राजिष्णुर्गौरीकोट्यरिमर्दनः । गभस्तिमदनन्ताभो
    गुह्यकेशविभूतिदः ॥ १७१॥ गात्रहीनशतानन्तरूपलावण्यसागरः । गिरशिब्रह्मविष्ण्वाख्यजगद्भङ्गादिकारकः ॥ १७२॥
    गाढकालमहाकालो गाम्भीर्यौदार्यसागरः । गोत्रादुग्घसुधामोदो गाथाकाव्यकथोदितः ॥ १७३॥ गाथाविदग्धो गौरीष्टो
    गद्यपद्यप्रदीपनः । गुह्योपनिषदावेद्यो गुह्यब्रह्मशिवात्मकः ॥ १७४॥ गिराद्यो ग्रन्थिहृद् ग्रन्थी गुणवृद्धिप्रयोजकः
    । गुणर्धिदश्च सर्वेषां गीष्पतीश्वरपुङ्गवः ॥ १७५॥ गाढाधाराधरो गुप्तस्वाधिष्ठानदृढासनः । गर्भास्तमणिपूरार्को
    गुहानाहतचक्रभः ॥ १७६॥ गुहाब्जवासो गगनमहापद्मपदाश्रयः । गलदेशविशुद्धस्थो गलत्पीयूषजोषणः ॥ १७७॥ गोब्रह्मरन्ध्रवेश्मार्को
    गगनाकृतिनिर्मलः । गतमान्द्यो गुणप्रज्ञो गूढाज्ञाचक्रभास्करः ॥ १७८॥ गुरुसिद्धासनस्थायी गुहापद्मासनस्थितः
    । गूढाधाराद्युपादेष्टा गोप्यलक्षविचारकृत् ॥ १७९॥ गुहास्तम्भोपदिष्टात्मा गोप्यशून्यविधानदः । गोप्यदेवो
    गतद्वन्द्वो गौरदेवो गतत्रिवृत् ॥ १८०॥ गेष्णुर्गेत्ण्वाश्रयो गेष्णुपतिर्गेष्णुनटप्रियः । गोरग् गोरक्षनाथश्च
    गोधूमाराध्यविग्रहः ॥ १८१॥ गोपा गोपाप्रियो ग्राही गोपार्ह्यो गोष्ठपालकः । गुप्तो गोपालनामापि गौष्ठीनस्थो
    गवीश्वरः ॥ १८२॥ गङ्गामौलिर्गवामीशो गोगम्यो गोविदाङ्गतिः । गवेड्यो गगनाकारो ग्रत्साधिर्गोधरो ग्रही
    ॥ १८३॥ गोधनो गोधनाधीशो गुप्तवस्तुज्ञ एव च । गोकुली गुप्तगुर्गोधुग् गोरजश्छुरिताकृतिः ॥ १८४॥ गुप्तेन्द्रियकुलो
    गुप्तगोरक्षो गोमताङ्गतिः । गूढात्मा गुप्तगोरूपो गोपज्येष्ठो गवाङ्गतिः ॥ १८५॥ गेष्णुप्राणो गुणागम्यो
    गेष्णुज्ञो गेष्णुसर्ववित् । गुणप्राग् गुणधामा च गोदानविधिवेदकः ॥ १८६॥ गोष्ठीपालो गीतिपटुर्गीतिगीतो
    गतालसः । गोपिकागीतसन्तुष्टो गीतागीतविशारदः ॥ १८७॥ गीतिप्रीतो गुहागुह्यो गृह्यगीतविवेचकः । गीतोपनिषदागम्यो
    गीतोपनिषदक्षरः ॥ १८८॥ गुणविदू गुणमर्यादो गन्धग्राही गुणोत्कटो गोजित् । गर्गानुग्रहकर्ता गर्गाचार्यभ्रमार्तिसंहर्ता
    ॥ १८९॥ गर्गप्रत्यर्थिध्गो गीर्वाणेशादिसंस्तुतो गोभ्राट् । ग्रहदोषनिराकर्ता गोत्रप्राणोऽथ गर्वविच्छेत्ता
    ॥ १९०॥ श्रीगोरक्षसहस्रनामकमदस्त्रैलोक्यभूषास्पदं शक्राद्यैरखिलैरजस्त्रममरैस्तोष्टूय्यमानं भृशम् ।
    गादिग्रन्थनिगुम्फित शुभतर विद्वञ्जनानन्दं योगीशाननुनं सदास्तु भवतां तुष्ट्यै च पुष्ट्यै मुदे ॥ १९१॥
    स्वस्ति श्रीं श्रेयः श्रेणयः श्रीमतां समुल्लसन्तुतराम् । इति श्री सिद्धसाध्यविद्याधरगन्धर्वसिद्धयोगीन्द्र
    देवेन्द्रनरेन्द्रादिवन्दादारुवृन्द वन्दितानन्दमकरन्दविन्दुसन्दोहनिस्यन्दिपदारविन्दस्य त्रिभुवनगुणोस्त्रिलोचनस्य
    गर्गादिमहर्षिगीतस्य भगवतो गोरक्षनाथस्य गकारादि सहस्रनामस्तुतिः सम्पूर्णा ।
