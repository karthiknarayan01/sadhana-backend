id: vishnukavacabvp
category: kavacha
name:
  english: vishnukavacaBVP
  devanagari: विष्णुकवचBVP
content:
  english: rinu vakshyami brahmesha dharmadam kavacam param | aham dasyami yushmabhyah gopaniyam sudurlabham
    || 19|| yasmai kasmai na datavyam pranatulyam mamaiva hi | yattejo mama dehe'sti tattejah kavace'pi
    ca || 20|| kuru srishtimidam dhritva dhata trijagatam bhava | samharta bhava he shambho mama tulyo
    bhave bhava || 21|| he dharma tvamimam dhritva bhava sakshi ca karmanam | tapasam phaladata ca yuyam
    bhavata madvarat || 22|| brahmandapavanasyasya kavacasya harih svayam | rishishcchandashca gayatri
    devo'ham jagadishvarah || 23|| dharmarthakamamoksheshu viniyogah prakirtitah | trilakshavarapathanat
    siddhidam kavacam vidhe || 24|| yo bhavet siddhakavaco mama tulyo bhavettu sah | tejasa siddhiyogena
    jnanena vikramena ca || 25|| pranavo me shirah patu namo raseshvaraya ca | bhalam payannetrayugmam
    namo radheshvaraya ca || 26|| krishnah payat shrotrayugmam he hare ghranameva ca | jihvikam vahnijaya
    tu krishnayeti ca sarvatah || 27|| shrikrishnaya svaheti ca kantham patu shadaksharah | hrim krishnaya
    namo vaktram klim purvashca bhujadvayam || 28|| namo gopanganeshaya skandhavashtaksharo'vatu | dantapamktimoshthayugmam
    namo gopishvaraya ca || 29|| om namo bhagavate rasamandaleshaya svaha | svayam vakshasthalam patu
    mantro'yam shodashaksharah || 30|| aim krishnaya svaheti ca karnayugmam sadavatu | om vishnave svaheti
    ca kankalam sarvato'vatu || 31|| om haraye nama iti prishtham padam sadavatu | om govardhanadharine
    svaha sarvasharirakam || 32|| pracyam mam patu shrikrishnah agneyyam patu madhavah | dakshine patu
    gopisho nairrityam nandanandanah || 33|| varunyam patu govindo vayavyam radhikeshvarah | uttare patu
    rasesha aishanyamacyutah svayam || 34|| santatam sarvatah patu paro narayanah svayam | iti te kathitam
    brahman kavacam paramadbhutam || 35|| mama jivanatulyam ca yushmabhyam dattameva ca | ashvamedhasahasrani
    vajapeyashatani ca | kalam narhanti tanyeva kavacasyaiva dharanat || 36|| gurumabhyarcya vidhivadvastralankaracandanaih
    | snatva tam ca namaskritya kavacam dharayet sudhih || 37|| kavacasya prasadena jivanmukto bhavennarah
    | yadi syat siddhakavaco vishnureva bhavet dvija || 38|| iti shribrahmavaivarte mahapurushabrahmandapavanam
    kavacam samaptam ||
  devanagari: ृणु वक्ष्यामि ब्रह्मेश धर्मदं कवचं परम् । अहं दास्यामि युष्मभ्यः गोपनीयं सुदुर्लभम् ॥ १९॥
    यस्मै कस्मै न दातव्यं प्राणतुल्यं ममैव हि । यत्तेजो मम देहेऽस्ति तत्तेजः कवचेऽपि च ॥ २०॥ कुरु सृष्टिमिदं
    धृत्वा धाता त्रिजगतां भव । संहर्ता भव हे शम्भो मम तुल्यो भवे भव ॥ २१॥ हे धर्म त्वमिमं धृत्वा भव साक्षी
    च कर्मणाम् । तपसां फलदाता च यूयं भवत मद्वरात् ॥ २२॥ ब्रह्माण्डपावनस्यास्य कवचस्य हरिः स्वयम् । ऋषिश्च्छन्दश्च
    गायत्री देवोऽहं जगदीश्वरः ॥ २३॥ धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः । त्रिलक्षवारपठनात् सिद्धिदं
    कवचं विधे ॥ २४॥ यो भवेत् सिद्धकवचो मम तुल्यो भवेत्तु सः । तेजसा सिद्धियोगेन ज्ञानेन विक्रमेण च ॥ २५॥
    प्रणवो मे शिरः पातु नमो रासेश्वराय च । भालं पायान्नेत्रयुग्मं नमो राधेश्वराय च ॥ २६॥ कृष्णः पायात्
    श्रोत्रयुग्मं हे हरे घ्राणमेव च । जिह्विकां वह्निजाया तु कृष्णायेति च सर्वतः ॥ २७॥ श्रीकृष्णाय स्वाहेति
    च कण्ठं पातु षडक्षरः । ह्रीं कृष्णाय नमो वक्त्रं क्लीं पूर्वश्च भुजद्वयम् ॥ २८॥ नमो गोपाङ्गनेशाय स्कन्धावष्टाक्षरोऽवतु
    । दन्तपंक्तिमोष्ठयुग्मं नमो गोपीश्वराय च ॥ २९॥ ओं नमो भगवते रासमण्डलेशाय स्वाहा । स्वयं वक्षस्थलं
    पातु मन्त्रोऽयं षोडशाक्षरः ॥ ३०॥ ऐं कृष्णाय स्वाहेति च कर्णयुग्मं सदावतु । ओं विष्णवे स्वाहेति च कङ्कालं
    सर्वतोऽवतु ॥ ३१॥ ओं हरये नम इति पृष्ठं पादं सदावतु । ओं गोवर्धनधारिणे स्वाहा सर्वशरीरकम् ॥ ३२॥ प्राच्यां
    मां पातु श्रीकृष्णः आग्नेय्यां पातु माधवः । दक्षिणे पातु गोपीशो नैरृत्यां नन्दनन्दनः ॥ ३३॥ वारुण्यां
    पातु गोविन्दो वायव्यां राधिकेश्वरः । उत्तरे पातु रासेश ऐशान्यामच्युतः स्वयम् ॥ ३४॥ सन्ततं सर्वतः पातु
    परो नारायणः स्वयम् । इति ते कथितं ब्रह्मन् कवचं परमाद्भुतम् ॥ ३५॥ मम जीवनतुल्यं च युष्मभ्यं दत्तमेव
    च । अश्वमेधसहस्राणि वाजपेयशतानि च । कलां नार्हन्ति तान्येव कवचस्यैव धारणात् ॥ ३६॥ गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः
    । स्नात्वा तं च नमस्कृत्य कवचं धारयेत् सुधीः ॥ ३७॥ कवचस्य प्रसादेन जीवन्मुक्तो भवेन्नरः । यदि स्यात्
    सिद्धकवचो विष्णुरेव भवेत् द्विज ॥ ३८॥ इति श्रीब्रह्मवैवर्ते महापुरुषब्रह्माण्डपावनं कवचं समाप्तम्
    ॥
