id: suryakritamshivastotram
category: stotram
name:
  english: suryakritamshivastotram
  devanagari: सूर्यकृतंशिवस्तोत्रम्
content:
  english: 50|| sharvarirahitasharvasarvaga svargamargasukhadapavargada | andhakasuraripo kapardabhrittvam
    nato'smi natavanchitaprada || 51|| shankarogragirijapate pate vishvanatha vidhivishnusamstuta | vedavedya
    vidita'khilengita tvam nato'smi natavanchitaprada || 52|| vishvarupapararupavarjita brahmajihmarahitamritaprada
    | vanmanovishayaduraduraga tvam nato'smi natavanchitaprada || 53|| iti shriskadapurane kashikhande
    purvarddhe ekonapancasatatama
  devanagari: ५०॥ शर्वरीरहितशर्वसर्वग स्वर्गमार्गसुखदापवर्गद । अन्धकासुररिपो कपर्दभृत्त्वां नतोऽस्मि नतवाञ्छितप्रद
    ॥ ५१॥ शङ्करोग्रगिरिजापते पते विश्वनाथ विधिविष्णुसंस्तुत । वेदवेद्य विदिताऽखिलेङ्गित त्वां नतोऽस्मि
    नतवाञ्छितप्रद ॥ ५२॥ विश्वरूपपररूपवर्जित ब्रह्मजिह्मरहितामृतप्रद । वाङ्मनोविषयदूरदूरग त्वां नतोऽस्मि
    नतवाञ्छितप्रद ॥ ५३॥ इति श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे एकोनपञ्चासततमा
meaning: {}
