id: krishnanarayananamasahasrastotram
category: stotram
name:
  english: krishnanarayananamasahasrastotram
  devanagari: कृष्णनारायणनामसहस्रस्तोत्रम्
content:
  english: ringaro dasyado nemirbindurbhasma bhramirmahah || 80|| keshavah kamakrijjishnurbrahmanyo vasukih
    priyah | lekho bimbah pratibimbo nirodho dirghika payah || 81|| prapa panam pishangashca pingaksho
    gayako gayah | nartako natako mayi mantri tantri jitendriyah || 82|| kalpamanirmahaviryam mahadrajo'gryapurushah
    | sadhujanah strijanashca'vyayo vadhujanatmakah || 83|| stanyapah sadhyadevashca dharmajanyo vrishasutah
    | ritambharashcamatkarah svahakarashca karmathah || 84|| arartrikam ca'bhisheko mukutah kanthikapriyah
    | sindurakah kunkumam ca durva vrihiryavastilah || 85|| nagavalli cekshudandah shriphalo bhaktivardhanah
    | pugiphalasvarupashca sugandhah shreya aramah || 86|| shrimayah shrikritaveshah shryangah shryanandasampradah
    | shritilakah shrikritoruh shrishayah shrikathashrayah || 87|| shrisevah shrisamavayah shryashanah
    shrisamadhiman | lakshmilakshma mahalakshmibhavo lakshmivibhavanah || 88|| lakshmiparshvo mahalakshmigarbho
    lakshmidhara'dharah | brahmajno brahmaparamo brahmajapo'nrini manih || 89|| atithih purnacandrashca
    devayano nabhogatih | jagadgururjayanatho lalitakanta ekalah || 90|| stutirjapah sthitih sthairyam
    satta bhutirvibhutiman | harshah pancatmakah sakshi sarah snehah susampavan || 91|| kashayavesho diptatma
    pancagnitapaso nagah | nago nirasho napta ca kamaphalam kumarakah || 92|| svastikah pratibharupah
    pratijnatma pramapakah | sahajah svabhavah shankuh kushah shalashilah shivah || 93|| caityo gartashca
    hunkaro jaghanam vithirajvarah | udgithashcopanishacca puranapurushah shanih || 94|| satparah sannivasashca
    shridrumo'suranashakah | kuncikatma brahmarandhram brahmahrado mahadhruvah || 95|| paridhih kiranam
    keshah pancashikhah parasanah | pravargyashca mahopayo vishishto vidrumo vashah || 96|| modakastandulashcapamargo
    devadhidaivatam | devanikatilakashca mahashvapattasarasah || 97|| jamata dharmavriddhashca sankalpo
    madhuparkakah | sarvatobhadrarupashca pitho vedirbalirjalam || 98|| sthandilo manikshetreshah padmakshetramaheshvarah
    | lomashanandadah patnivratavamshaprabhakarah || 99|| indradyumnasthaliraksho narasimhavaneshvarah
    | vyaghraranyanivasashca rukmangadeshtasampradah || 100|| prabhasikah prabhanushca somakshetrapraposhakah
    | samapadmanishanatho'nadikrishnah prajapatih || 101|| vasantashca kishorashca mahendrah shampradah
    sahah | mangalesho manasesho revesho virajapatih || 102|| ratisho gomatishashca kamadugheshvaro'tulah
    | ekadashipatih svarnarekhakanto hyamurtakah || 103|| nandinishashca doleshah pushpam kalavatipatih
    | badarishashca pampesho darpaha bandhavo dhavah || 104|| bhaktavatsala unneta manakrillokadhrigdharah
    | dhanyashcaturbhujo durgastantukrit sukritam kriti || 105|| sundarashcashvamedhashca parjanyashcamritapatih
    | sulabho'durlabho'shvattho rakshoha daityanashanah || 106|| saptashvah saptajihvashca pragvamshashca
    prabhatakah | ashramashca yamah suryacandranetrastrinetrakah || 107|| viyannabhirbhucarano'nila'surdikchrava
    dyukah | agnyananashca bastyabdhih sarvavarshma ramo'ramah || 108|| ghanashyamo hitastathyo brahmadhama
    svadhamavan | nityashca cetanashcantaryami visheshavittiman || 109|| karyakaranarupashcayojako dhritiman
    padi | pratyayitah shrutigamyo vakyakritsankhyito'vyayah || 110|| svastidata svastikarta svastirupah
    prashastiman | srishtyadhishthanamuttungo golakah kam ca kham khagah || 111|| madhyavastho madhyavasah
    sandhyamsho'bhijidatmakah | amritashca shubho labhah kshemakrit siddhinayakah || 112|| dhanvantarirnalo
    nalah pravaho dadhimandapah | putrah svargashcashiratma pralayo vaishnavarcitah || 113|| navanito'pavargashca
    hriddipah paramarthadah | kalamayapapakarmayamadutabhayapaha || 114|| dvaram dvari candrashalo ghritashi
    ca'dvitiyakah | bahuprajo'prajo jagrat prajanano'ntarangakah || 115|| grantho granthirnagarashca simantah
    simavarjitah | abadhyashca'paricchinno'vivarto'parinamakah || 116|| avacchedaka aishvaryam lakshanam
    lakshyamishanih | itih kavalamannam ca sanatanatamah sanah || 117|| vamshi kadambakah kilah samajah
    sartha adarah | udaro dvyatmakah shreshthi triyugo yugalatmakah || 118|| stripatih svapatih praptistadatmyam
    nirmitih kritih | tattvam svatvamabhiprayashceshtodbhavashca bhavanah || 119|| udayo'yah pramedhashca
    sushumnamurtidarshanah | danam damo daya dishtam ditirdarvi ca dohanam || 120|| vakta vacayita lekhayita'dhyapaka
    uhavan | vanmano'gocarah punyam punyashrutijaparhanah || 121|| jivanam mandahasah satpathacarah pano
    ranah | atmajashcagameyashca naigameyo hyanavarah || 122|| asankhyashcaikasankhyashca nirbhayo bhayanashakah
    | adhvaro havanadashca bhavadano bhavapahah || 123|| urdhvaviryo'praskhalano vighnaha ca narottamah
    | duhsvapnanashakah shantipradah pramodakarakah || 124|| akarshako'kshayapatram paryavasanamaurasah
    | vyahritirvyavaharashca sphurtishcekaksharo dhvanih || 125|| bhuktido muktidah papakshalanah punyadah
    prathah | khyatyatma sarvasenashca diktaro nada ipatih || 126|| sphoto nauka phalam pushpam pishtam
    sadasadatmakah | brahmasutram kankanam ca saddhetuh sarvahetiman || 127|| mulam mulottaram muladimah
    sarvantasamsthitah | alayashca talam sarvodarah sarvasharirakah || 128|| anvayo vyatirekashca nityayukto
    namahpurah | sampanno vikasadbhavo vishvasadbhava onnamah || 129|| itidam pavanam punyam sarvabadhavinashakam
    | anadishrikrishnanarayananamnam sahasrakam || 130|| purushottamasamakhyam stotram lakshmi mayoditam
    | shroturvaktuh kirtayiturmanturnashyatyaghani vai || 131|| iha'mutra na badha syadvighnanasho drutam
    bhavet | vipro vidvan brahmavitsyacchurah kshatro jayi bhavet || 132|| dhani shreshthi vaishyavarno
    bhavecchudrah sukhi bhavet | brahmacari camatkari grihi strisampadanvitah || 133|| vani vanyarddhisampanno
    bhavet sadhuh prashantiman | vindeddharmam dharmarucishcarthecchurarthavan bhavet || 134|| kamecchuh
    kamasampattim mumukshurmokshamricchati | rajyarthi rajyamavindetprajarthi tu prajam labhet || 135||
    putrarthi putramricchedvai bharyarthi strim labhennavam | kanyarthi kanyakamricchet patyarthika patim
    labhet || 136|| vidyarthi prapnuyadvidyam dhanarthi dhanamapnuyat | vrittyarthi vrittiman syacca bhogarthi
    bhogavan bhavet || 137|| ishtarthi ceshtamricchecca griharthi grihamapnuyat | nityam pratah pathedbhaktya
    shuddhantahkaranastu yah || 138|| pradhanatam yashah khyatim shriyam shreyashca vindati | bhayam naiva
    bhavatyasya tejo viryam ca vardhate || 139|| nirogo jayate pathatpushto bali guni bhavet | rupavan
    jayate ramyah kamyo bhavati pathanat || 140|| bandhanam shiryate vakturbhayam nashyati sarvatha |
    apattayo vinashyanti nashyanti shatravo'pi ca || 141|| durgani sugamanyeva bhavanti stuvatah khalu
    | purushottamasharanah syatpurushottamabhaktiman || 142|| mayanjanarahitatma labhate purushottamam
    | madbhaktasya'shubham nasti samsarasya bhayam na ca || 143|| duritam janma mrityushca vyadhirjara
    na rugnata | moghata'bhibhavo naiva madbhaktasya prajayate || 144|| etatpathadbhavedatmasukham shantih
    susampadah | smriddhih shrih kirtiraudaryam pradhanyam pushtirishita || 145|| mukta ishah pitarashca
    siddha deva maharshayah | etatstotrajapenaiva siddhim paramikam yayuh || 146|| ayushman bhavate shrutva
    nishpapah pathanadbhavet | shraddhabhaktiyuto vakta pretya ceha pramodate || 147|| maya'nadikrishnanarayanena
    te prabhashitam | lakshmi stotram matparam tatpathanmatparamo bhavet || 148|| api shlokaikapathena
    patho'syapi krito bhavet | sha
  devanagari: ृङ्गारो दास्यदो नेमिर्बिन्दुर्भस्म भ्रमिर्महः ॥ ८०॥ केशवः कामकृज्जिष्णुर्ब्रह्मण्यो वासुकिः
    प्रियः । लेखो बिम्बः प्रतिबिम्बो निरोधो दीर्घिका पयः ॥ ८१॥ प्रपा पानं पिशङ्गश्च पिङ्गाक्षो गायको गयः
    । नर्तको नटको मायी मन्त्री तन्त्री जितेन्द्रियः ॥ ८२॥ कल्पमणिर्महावीर्यं महद्रजोऽग्र्यपूरुषः । साधुजनः
    स्त्रीजनश्चाऽव्ययो वधूजनात्मकः ॥ ८३॥ स्तन्यपः साध्यदेवश्च धर्मजन्यो वृषासुतः । ऋतम्भरश्चमत्कारः स्वाहाकारश्च
    कर्मठः ॥ ८४॥ आरार्त्रिकं चाऽभिषेको मुकुटः कण्ठिकाप्रियः । सिन्दूरकः कुङ्कुमं च दूर्वा व्रीहिर्यवस्तिलः
    ॥ ८५॥ नागवल्ली चेक्षुदण्डः श्रीफलो भक्तिवर्धनः । पूगीफलस्वरूपश्च सुगन्धः श्रेय आरमः ॥ ८६॥ श्रीमयः
    श्रीकृतवेषः श्र्यङ्गः श्र्यानन्दसम्प्रदः । श्रीतिलकः श्रीकृतोरुः श्रीशयः श्रीकथाश्रयः ॥ ८७॥ श्रीसेवः
    श्रीसमवायः श्र्यशनः श्रीसमाधिमान् । लक्ष्मीलक्ष्मा महालक्ष्मीभवो लक्ष्मीविभावनः ॥ ८८॥ लक्ष्मीपार्श्वो
    महालक्ष्मीगर्भो लक्ष्मीधराऽधरः । ब्रह्मज्ञो ब्रह्मपरमो ब्रह्मजपोऽनृणी मणिः ॥ ८९॥ अतिथिः पूर्णचन्द्रश्च
    देवयानो नभोगतिः । जगद्गुरुर्जयानाथो ललिताकान्त एकलः ॥ ९०॥ स्तुतिर्जपः स्थितिः स्थैर्यं सत्ता भूतिर्विभूतिमान्
    । हर्षः पञ्चात्मकः साक्षी सारः स्नेहः सुसम्पवान् ॥ ९१॥ काषायवेषो दीप्तात्मा पञ्चाग्नितापसो नगः । नागो
    निराशो नप्ता च कामफलं कुमारकः ॥ ९२॥ स्वस्तिकः प्रतिभारूपः प्रतिज्ञात्मा प्रमापकः । सहजः स्वभवः शङ्कुः
    कुशः शालशिलः शिवः ॥ ९३॥ चैत्यो गर्तश्च हुङ्कारो जघनं वीथिरज्वरः । उद्गीथश्चोपनिषच्च पुराणपुरुषः शनीः
    ॥ ९४॥ सत्परः सन्निवासश्च श्रीद्रुमोऽसुरनाशकः । कुञ्चिकात्मा ब्रह्मरन्ध्रं ब्रह्मह्रदो महाध्रुवः ॥
    ९५॥ परिधिः किरणं केशः पञ्चशिखः परासनः । प्रवर्ग्यश्च महोपायो विशिष्टो विद्रुमो वशः ॥ ९६॥ मोदकस्तण्डुलश्चापामार्गो
    देवाधिदैवतम् । देवानीकतिलकश्च महाश्वपट्टसारसः ॥ ९७॥ जामाता धर्मवृद्धश्च सङ्कल्पो मधुपर्ककः । सर्वतोभद्ररूपश्च
    पीठो वेदिर्बलिर्जलम् ॥ ९८॥ स्थण्डिलो मणिक्षेत्रेशः पाद्मक्षेत्रमहेश्वरः । लोमशानन्ददः पत्नीव्रतवंशप्रभाकरः
    ॥ ९९॥ इन्द्रद्युम्नस्थलीरक्षो नारसिंहवनेश्वरः । व्याघ्रारण्यनिवासश्च रुक्माङ्गदेष्टसम्प्रदः ॥ १००॥
    प्राभासिकः प्रभानुश्च सोमक्षेत्रप्रपोषकः । सामपद्मनिशानाथोऽनादिकृष्णः प्रजापतिः ॥ १०१॥ वसन्तश्च किशोरश्च
    महेन्द्रः शम्प्रदः सहः । मङ्गलेशो मानसेशो रेवेशो विरजापतिः ॥ १०२॥ रतीशो गोमतीशश्च कामदुघेश्वरोऽतुलः
    । एकादशीपतिः स्वर्णरेखाकान्तो ह्यमूर्तकः ॥ १०३॥ नन्दिनीशश्च दोलेशः पुष्पं कलावतीपतिः । बदरीशश्च पम्पेशो
    दर्पहा बान्धवो धवः ॥ १०४॥ भक्तवत्सल उन्नेता मानकृल्लोकधृग्धरः । धन्यश्चतुर्भुजो दुर्गस्तन्तुकृत् सुकृतं
    कृती ॥ १०५॥ सुन्दरश्चाश्वमेधश्च पर्जन्यश्चामृतापतिः । सुलभोऽदुर्लभोऽश्वत्थो रक्षोहा दैत्यनाशनः ॥ १०६॥
    सप्ताश्वः सप्तजिह्वश्च प्राग्वंशश्च प्रभातकः । आश्रमश्च यमः सूर्यचन्द्रनेत्रस्त्रिनेत्रकः ॥ १०७॥ वियन्नाभिर्भूचरणोऽनिलाऽसुर्दिक्छ्रवा
    द्युकः । अग्न्याननश्च बस्त्यब्धिः सर्ववर्ष्मा रमोऽरमः ॥ १०८॥ घनश्यामो हितस्तथ्यो ब्रह्मधामा स्वधामवान्
    । नित्यश्च चेतनश्चान्तर्यामी विशेषवित्तिमान् ॥ १०९॥ कार्यकारणरूपश्चायोजको धृतिमान् पदी । प्रत्ययितः
    श्रुतिगम्यो वाक्यकृत्सङ्ख्यितोऽव्ययः ॥ ११०॥ स्वस्तिदाता स्वस्तिकर्ता स्वस्तिरूपः प्रशस्तिमान् । सृष्ट्यधिष्ठानमुत्तुङ्गो
    गोलकः कं च खं खगः ॥ १११॥ मध्यावस्थो मध्यवासः सन्ध्यांशोऽभिजिदात्मकः । अमृतश्च शुभो लाभः क्षेमकृत्
    सिद्धिनायकः ॥ ११२॥ धन्वन्तरिर्नलो नालः प्रवाहो दधिमण्डपः । पुत्रः स्वर्गश्चाशीरात्मा प्रलयो वैष्णवार्चितः
    ॥ ११३॥ नवनीतोऽपवर्गश्च हृद्दीपः परमार्थदः । कालमायापापकर्मयमदूतभयापहा ॥ ११४॥ द्वारं द्वारी चन्द्रशालो
    घृताशी चाऽद्वितीयकः । बहुप्रजोऽप्रजो जाग्रत् प्राजननोऽन्तरङ्गकः ॥ ११५॥ ग्रन्थो ग्रन्थिर्नागरश्च सीमान्तः
    सीमवर्जितः । अबाध्यश्चाऽपरिच्छिन्नोऽविवर्तोऽपरिणामकः ॥ ११६॥ अवच्छेदक ऐश्वर्यं लक्षणं लक्ष्यमीशनीः
    । ईतिः कवलमन्नं च सनातनतमः सनः ॥ ११७॥ वंशी कदम्बकः कीलः समाजः सार्थ आदरः । उदारो द्व्यात्मकः श्रेष्ठी
    त्रियुगो युगलात्मकः ॥ ११८॥ स्त्रीपतिः स्वपतिः प्राप्तिस्तादात्म्यं निर्मितिः कृतिः । तत्त्वं स्वत्वमभिप्रायश्चेष्टोद्भवश्च
    भावनः ॥ ११९॥ उदयोऽयः प्रमेधश्च सुषुम्णामूर्तिदर्शनः । दानं दमो दया दिष्टं दितिर्दर्वी च दोहनम् ॥ १२०॥
    वक्ता वाचयिता लेखयिताऽध्यापक ऊहवान् । वाङ्मनोऽगोचरः पुण्यं पुण्यश्रुतिजपार्हणः ॥ १२१॥ जीवनं मन्दहासः
    सत्पथाचारः पणो रणः । आत्मजश्चागमेयश्च नैगमेयो ह्यनावरः ॥ १२२॥ असङ्ख्यश्चैकसङ्ख्यश्च निर्भयो भयनाशकः
    । आध्वरो हवनादश्च भावादनो भवापहः ॥ १२३॥ ऊर्ध्ववीर्योऽप्रस्खलनो विघ्नहा च नरोत्तमः । दुःस्वप्ननाशकः
    शान्तिप्रदः प्रमोदकारकः ॥ १२४॥ आकर्षकोऽक्षयपात्रं पर्यवसानमौरसः । व्याहृतिर्व्यवहारश्च स्फुर्तिश्चेकाक्षरो
    ध्वनिः ॥ १२५॥ भुक्तिदो मुक्तिदः पापक्षालनः पुण्यदः प्रथः । ख्यात्यात्मा सर्वसेनश्च दिक्तारो नाद ईपतिः
    ॥ १२६॥ स्फोटो नौका फलं पुष्पं पिष्टं सदसदात्मकः । ब्रह्मसूत्रं कङ्कणं च सद्धेतुः सर्वहेतिमान् ॥ १२७॥
    मूलं मूलोत्तरं मूलादिमः सर्वान्तसंस्थितः । आलयश्च तलं सर्वोदरः सर्वशरीरकः ॥ १२८॥ अन्वयो व्यतिरेकश्च
    नित्ययुक्तो नमःपुरः । सम्पन्नो विकसद्भावो विश्वसद्भाव ओन्नमः ॥ १२९॥ इतीदं पावनं पुण्यं सर्वबाधाविनाशकम्
    । अनादिश्रीकृष्णनारायणनाम्नां सहस्रकम् ॥ १३०॥ पुरुषोत्तमसामाख्यं स्तोत्रं लक्ष्मि मयोदितम् । श्रोतुर्वक्तुः
    कीर्तयितुर्मन्तुर्नश्यत्यघानि वै ॥ १३१॥ इहाऽमुत्र न बाधा स्याद्विघ्ननाशो द्रुतं भवेत् । विप्रो विद्वान्
    ब्रह्मवित्स्याच्छूरः क्षत्रो जयी भवेत् ॥ १३२॥ धनी श्रेष्ठी वैश्यवर्णो भवेच्छूद्रः सुखी भवेत् । ब्रह्मचारी
    चमत्कारी गृही स्त्रीसम्पदन्वितः ॥ १३३॥ वनी वन्यर्द्धिसम्पन्नो भवेत् साधुः प्रशान्तिमान् । विन्देद्धर्मं
    धर्मरुचिश्चार्थेच्छुरर्थवान् भवेत् ॥ १३४॥ कामेच्छुः कामसम्पत्तिं मुमुक्षुर्मोक्षमृच्छति । राज्यार्थी
    राज्यमाविन्देत्प्रजार्थी तु प्रजां लभेत् ॥ १३५॥ पुत्रार्थी पुत्रमृच्छेद्वै भार्यार्थी स्त्रीं लभेन्नवाम्
    । कन्यार्थी कन्यकामृच्छेत् पत्यर्थिका पतिं लभेत् ॥ १३६॥ विद्यार्थी प्राप्नुयाद्विद्यां धनार्थी धनमाप्नुयात्
    । वृत्त्यर्थी वृत्तिमान् स्याच्च भोगार्थी भोगवान् भवेत् ॥ १३७॥ इष्टार्थी चेष्टमृच्छेच्च गृहार्थी गृहमाप्नुयात्
    । नित्यं प्रातः पठेद्भक्त्या शुद्धान्तःकरणस्तु यः ॥ १३८॥ प्रधानतां यशः ख्यातिं श्रियं श्रेयश्च विन्दति
    । भयं नैव भवत्यस्य तेजो वीर्यं च वर्धते ॥ १३९॥ नीरोगो जायते पाठात्पुष्टो बली गुणी भवेत् । रूपवान्
    जायते रम्यः काम्यो भवति पाठनात् ॥ १४०॥ बन्धनं शीर्यते वक्तुर्भयं नश्यति सर्वथा । आपत्तयो विनश्यन्ति
    नश्यन्ति शत्रवोऽपि च ॥ १४१॥ दुर्गाणि सुगमान्येव भवन्ति स्तुवतः खलु । पुरुषोत्तमशरणः स्यात्पुरुषोत्तमभक्तिमान्
    ॥ १४२॥ मायाञ्जनरहितात्मा लभते पुरुषोत्तमम् । मद्भक्तस्याऽशुभं नास्ति संसारस्य भयं न च ॥ १४३॥ दुरीतं
    जन्म मृत्युश्च व्याधिर्जरा न रुग्णता । मोघताऽभिभवो नैव मद्भक्तस्य प्रजायते ॥ १४४॥ एतत्पाठाद्भवेदात्मसुखं
    शान्तिः सुसम्पदः । स्मृद्धिः श्रीः कीर्तिरौदार्यं प्राधान्यं पुष्टिरीशिता ॥ १४५॥ मुक्ता ईशाः पितरश्च
    सिद्धा देवा महर्षयः । एतत्स्तोत्रजपेनैव सिद्धिं परमिकां ययुः ॥ १४६॥ आयुष्मान् भवते श्रुत्वा निष्पापः
    पठनाद्भवेत् । श्रद्धाभक्तियुतो वक्ता प्रेत्य चेह प्रमोदते ॥ १४७॥ मयाऽनादिकृष्णनारायणेन ते प्रभाषितम्
    । लक्ष्मि स्तोत्रं मत्परं तत्पाठान्मत्परमो भवेत् ॥ १४८॥ अपि श्लोकैकपाठेन पाठोऽस्यापि कृतो भवेत् ।
    श
