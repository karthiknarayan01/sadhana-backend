id: sree-lakshmi-ashtottara-satanaama-stotram
category: stotram
name:
  english: Sree Lakshmi Ashtottara Satanaama Stotram
content:
  english: '|| ashtottara shatam lakshmyah shrotumicchami tattvatah || ishvara uvaca devi sadhu mahabhage
    mahabhagya pradayakam | sarvaishvaryakaram punyam sarvapapa pranashanam || sarvadaridrya shamanam
    shravanadbhukti muktidam | rajavashyakaram divyam guhyad guhyataram param || durlabham sarvadevanam
    catushshashti kalaspadam | padmadinam varantanam nidhinam nityadayakam || samasta deva samsevyam animadyashta
    siddhidam | kimatra bahunoktena devi pratyakshadayakam || tava prityadya vakshyami samahitamanashshrinu
    | ashtottara shatasyasya mahalakshmistu devata || klim bija padamityuktam shaktistu bhuvaneshvari
    | anganyasah karanyasah sa ityadi prakirtitah || dhyanam vande padmakaram prasannavadanam saubhagyadam
    bhagyadam hastabhyamabhayapradam maniganaih nanavidhaih bhushitam | bhaktabhishta phalapradam harihara
    brahmadhibhissevitam parshve pankaja shankhapadma nidhibhih yuktam sada shaktibhih || sarasija nayane
    sarojahaste dhavala taramshuka gandhamalya shobhe | bhagavati harivallabhe manojne tribhuvana bhutikari
    prasidamahyam || om prakritim vikritim vidyam sarvabhuta hitapradam | shraddham vibhutim surabhim
    namami paramatmikam || || vacam padmalayam padmam shucim svaham svadham sudham | dhanyam hiranmayayim
    lakshmim nityapushtam vibhavarim || || aditim ca ditim diptam vasudham vasudharinim | namami kamalam
    kantam kamakshim krodhasambhavam kamyam kshirodasambhavam || anugrahapradam buddhi managham harivallabham
    | ashoka mamritam diptam lokashokavinashinim || || namami dharmanilayam karunam lokamataram | padmapriyam
    padmahastam padmakshim padmasundarim || || padmodbhavam padmamukhim padmanabhapriyam ramam | padmamaladharam
    devim padminim padmagandhinim || || punyagandham suprasannam prasadabhimukhim prabham | namami candravadanam
    candram candrasahodarim || || caturbhujam candrarupa mindushitalam | ahlada jananim pushtim shivam
    shivakarim satim || || vimalam vishvajananim tushtim daridryanashinim | pritipushkarinim shantam shuklamalyambaram
    shriyam || || bhaskarim bilvanilayam vararoham yashasvinim | vasundhara mudarangam harinim hemamalinim
    || || dhanadhanyakarim siddhim strainasaumyam shubhapradam | nripaveshmagatam nandam varalakshmim
    vasupradam || || shubham hiranyaprakaram samudratanayam jayam | namami mangalam devim vishnuvakshahsthalasthitam
    || prasannakshim narayanasamashritam | daridryadhvamsinim devim sarvopadravavarinim || || navadurgam
    mahakalim brahmavishnushivatmikam | trikalajnanasampannam namami bhuvaneshvarim || || lakshmim kshirasamudraraja
    tanayam shrirangadhameshvarim | dasibhuta samastadeva vanitam lokaika dipankuram || shrimanmanda kataksha
    labdha vibhavad brahmendra gangadharam | tvam trailokya kutumbinim sarasijam vande mukundapriyam ||
    kshirodaje kamala komala garbhagauri prasida satatam samatam sharanye || || trikalam yo japet vidvan
    shanmasam vijitendriyah | daridrya dhvamsanam kritva sarvamapnot yayatnatah | devinama sahasreshu
    punyamashtottaram shatam | yena shriya mavapnoti kotijanma daridratah || || bhriguvare shatam dhiman
    pathet vatsaramatrakam | ashtaishvarya mavapnoti kubera iva bhutale || daridrya mocanam nama stotramambaparam
    shatam | yena shriya mavapnoti kotijanma daridratah || || bhuktvatu vipulan bhogan ante sayujyamapnuyat
    | pratahkale pathennityam sarva duhkhopa shantaye | pathantu cintayeddevim sarvabharana bhushitam
    || || iti shri lakshmyashtottarashatanamastotram sampurnam'
  devanagari: ॥ अष्टोत्तर शतं लक्ष्म्याः श्रोतुमिच्छामि तत्त्वतः ॥ ईश्वर उवाच देवि साधु महाभागे महाभाग्य
    प्रदायकम् । सर्वैश्वर्यकरं पुण्यं सर्वपाप प्रणाशनम् ॥ सर्वदारिद्र्य शमनं श्रवणाद्भुक्ति मुक्तिदम्
    । राजवश्यकरं दिव्यं गुह्याद् गुह्यतरं परम् ॥ दुर्लभं सर्वदेवानां चतुष्षष्टि कलास्पदम् । पद्मादीनां
    वरान्तानां निधीनां नित्यदायकम् ॥ समस्त देव संसेव्यं अणिमाद्यष्ट सिद्धिदम् । किमत्र बहुनोक्तेन देवी
    प्रत्यक्षदायकम् ॥ तव प्रीत्याद्य वक्ष्यामि समाहितमनाश्शृणु । अष्टोत्तर शतस्यास्य महालक्ष्मिस्तु देवता
    ॥ क्लीं बीज पदमित्युक्तं शक्तिस्तु भुवनेश्वरी । अङ्गन्यासः करन्यासः स इत्यादि प्रकीर्तितः ॥ ध्यानं
    वन्दे पद्मकरां प्रसन्नवदनां सौभाग्यदां भाग्यदां हस्ताभ्यामभयप्रदां मणिगणैः नानाविधैः भूषिताम् । भक्ताभीष्ट
    फलप्रदां हरिहर ब्रह्माधिभिस्सेवितां पार्श्वे पङ्कज शङ्खपद्म निधिभिः युक्तां सदा शक्तिभिः ॥ सरसिज नयने
    सरोजहस्ते धवल तरांशुक गन्धमाल्य शोभे । भगवति हरिवल्लभे मनोज्ञे त्रिभुवन भूतिकरि प्रसीदमह्यम् ॥ ॐ प्रकृतिं
    विकृतिं विद्यां सर्वभूत हितप्रदाम् । श्रद्धां विभूतिं सुरभिं नमामि परमात्मिकाम् ॥ ॥ वाचं पद्मालयां
    पद्मां शुचिं स्वाहां स्वधां सुधाम् । धन्यां हिरण्मययीं लक्ष्मीं नित्यपुष्टां विभावरीम् ॥ ॥ अदितिं
    च दितिं दीप्तां वसुधां वसुधारिणीम् । नमामि कमलां कान्तां कामाक्षीं क्रोधसम्भवाम् काम्यां क्षीरोदसम्भवाम्
    ॥ अनुग्रहप्रदां बुद्धि मनघां हरिवल्लभाम् । अशोका ममृतां दीप्तां लोकशोकविनाशिनीम् ॥ ॥ नमामि धर्मनिलयां
    करुणां लोकमातरम् । पद्मप्रियां पद्महस्तां पद्माक्षीं पद्मसुन्दरीम् ॥ ॥ पद्मोद्भवां पद्ममुखीं पद्मनाभप्रियां
    रमाम् । पद्ममालाधरां देवीं पद्मिनीं पद्मगन्धिनीम् ॥ ॥ पुण्यगन्धां सुप्रसन्नां प्रसादाभिमुखीं प्रभाम्
    । नमामि चन्द्रवदनां चन्द्रां चन्द्रसहोदरीम् ॥ ॥ चतुर्भुजां चन्द्ररूपा मिन्दुशीतलाम् । आह्लाद जननीं
    पुष्टिं शिवां शिवकरीं सतीम् ॥ ॥ विमलां विश्वजननीं तुष्टिं दारिद्र्यनाशिनीम् । प्रीतिपुष्करिणीं शान्तां
    शुक्लमाल्याम्बरां श्रियम् ॥ ॥ भास्करीं बिल्वनिलयां वरारोहां यशस्विनीम् । वसुन्धरा मुदाराङ्गां हरिणीं
    हेममालिनीम् ॥ ॥ धनधान्यकरीं सिद्धिं स्त्रैणसौम्यां शुभप्रदाम् । नृपवेश्मगतां नन्दां वरलक्ष्मीं वसुप्रदाम्
    ॥ ॥ शुभां हिरण्यप्राकारां समुद्रतनयां जयाम् । नमामि मङ्गलां देवीं विष्णुवक्षःस्थलस्थिताम् ॥ प्रसन्नाक्षीं
    नारायणसमाश्रिताम् । दारिद्र्यध्वंसिनीं देवीं सर्वोपद्रववारिणीम् ॥ ॥ नवदुर्गां महाकालीं ब्रह्मविष्णुशिवात्मिकाम्
    । त्रिकालज्ञानसम्पन्नां नमामि भुवनेश्वरीम् ॥ ॥ लक्ष्मीं क्षीरसमुद्रराज तनयां श्रीरङ्गधामेश्वरीम् ।
    दासीभूत समस्तदेव वनितां लोकैक दीपाङ्कुराम् ॥ श्रीमन्मन्द कटाक्ष लब्ध विभवद् ब्रह्मेन्द्र गङ्गाधराम्
    । त्वां त्रैलोक्य कुटुम्बिनीं सरसिजां वन्दे मुकुन्दप्रियाम् ॥ क्षीरोदजे कमल कोमल गर्भगौरि प्रसीद सततं
    समतां शरण्ये ॥ ॥ त्रिकालं यो जपेत् विद्वान् षण्मासं विजितेन्द्रियः । दारिद्र्य ध्वंसनं कृत्वा सर्वमाप्नोत्
    ययत्नतः । देवीनाम सहस्रेषु पुण्यमष्टोत्तरं शतम् । येन श्रिय मवाप्नोति कोटिजन्म दरिद्रतः ॥ ॥ भृगुवारे
    शतं धीमान् पठेत् वत्सरमात्रकम् । अष्टैश्वर्य मवाप्नोति कुबेर इव भूतले ॥ दारिद्र्य मोचनं नाम स्तोत्रमम्बापरं
    शतम् । येन श्रिय मवाप्नोति कोटिजन्म दरिद्रतः ॥ ॥ भुक्त्वातु विपुलान् भोगान् अन्ते सायुज्यमाप्नुयात्
    । प्रातःकाले पठेन्नित्यं सर्व दुःखोप शान्तये । पठन्तु चिन्तयेद्देवीं सर्वाभरण भूषिताम् ॥ ॥ इति श्री
    लक्ष्म्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णं
