id: kameshvarakavacam
category: kavacha
name:
  english: kameshvarakavacam
  devanagari: कामेश्वरकवचम्
content:
  english: klim kilakam | caturvargaphalapraptyartham kavacapathe viniyogah | atha dhyanam | udyaccandrasamanadiptimamritanandaikahetum
    param cidrupam bhuvanaikasrishtipralayodbhutaikarakshaparam | koti candragalatsudhadbhutatanum haradibhushojjvalam
    shulam khadgavarau tathabhayakaram kameshvaram bhavaye || ai~ kam kameshvarah patu klim shivo me lalatakam
    | saum me karnau ca kameshah taram me locanadvayam || 1|| shrim gam daum me mahakalo hrim nasam candracudakah
    | ham me oshtau tripureshah sam me dantau ca bhairavah || 2|| ksham me jihvam patu devo mahakameshvarah
    parah | sammohanam sada patu mahavatukabhairavah || 3|| yam me skandhau sada patu mahamrityunjayastatha
    | um me bhujau sada patu shrim devastripurantakah || 4|| sam me hastau trilokeshah ham nakhan patu
    sundarah | ksham dakshah patu shamesho mam kukshim krittika varah || 5|| lam parshvau patu me bala
    vam nabhim brahmabhushakah | ram vastim patu me devo yam prishtham vishnurupakah || 6|| um shishnam
    patu vishveshah amriteshvarabhairavah | yam medhre patu me rudro ram guhyam guhyakeshvarah || 7||
    lam katim pata me nityam shivah paramakaranah | vam uru tripuradhyakshah lam janu devapalakah || 8||
    mam janghe patu mahima yam gulphau suryarupakah | shrim jatharam harah patu hrim manoharasundarah
    || 9|| om buddhim patu me rudrah sauh rasam dakshajapatih | klim raktam patu me devo urdhvam ca vahnirupadhrik
    || 10|| aim saum sam guhyakah patu meruh pashupatistatha | asthim me girijanatho majjam me nilakanthakah
    || 11|| shukram bhuteshvarah patu murdhanam shankaro'vatu | padau shrim sundarishano devah kalantakah
    prabhuh || 12|| padadishirahparyantamaghorah patu sarvada | shirasah padaparyantam sadyojato mamavatu
    || 13|| praudharupah sada patu svaha me sakalam vapuh | kameshvarah prabhate'vyanmadhyahne kalabhairavah
    || 14|| sayam patu kuleshano nishithe nishkaleshvarah | ardharatre vamadevo nishante sumahodayah ||
    15|| sarvada sarvatah patu aim klim saum bijarupadhrik | purve mamasitango'vyat dakshine rurubhairavah
    || 16|| pashcime patu candesho hyuttare krodhabhairavah | aishanyam patu conmattah kapaleshastathagnike
    || 17|| nairrityam bhishanah patu vayau samharako'vatu | urdhvam me kalarudrashca patale parameshvarah
    || 18|| madhye sadashivah patu trikuteshah sadavatu | dashadikshu sada patu mahakameshvaro'vatu ||
    19|| vismaritam ca yatsthanam yatsthanam namavararjitam | tatsarvam patu me devastripurahpatirishvarah
    || 20|| grihe sharvah sada patu bahih payadvrishadhvajah | pathi tripurasundaryah patu sarvatra sarvada
    || 21|| rane rajakule durge durbhikshe shatrusamsadi | dyute maribhaye rashtre viplave vadinam kule
    || 22|| kameshvarah sada patu bhayasthane ca sarvada | ityetatkavacam guhyam trishu lokeshu durlabham
    || 23|| mulamantramayam divyam trilokisaramuttamam | adatavyamabhaktaya kavacam guhyamishvari || 24||
    adrishtavyamashrotavyam dikshahinaya mantrine | paradikshaya shishyaya putraya sharajanmane || 25||
    na datavyam na shrotavyamityajnam mamakim sha
  devanagari: क्लीं कीलकम् । चतुर्वर्गफलप्राप्त्यर्थं कवचपाठे विनियोगः । अथ ध्यानम् । उद्यच्चन्द्रसमानदीप्तिममृतानन्दैकहेतुं
    परं चिद्रूपं भुवनैकसृष्टिप्रलयोद्भूतैकरक्षापरम् । कोटी चन्द्रगलत्सुधाद्भुततनुं हारादिभूषोज्ज्वलं शुलं
    खड्गवरौ तथाभयकरं कामेश्वरं भावये ॥ ऐँ कं कामेश्वरः पातु क्लीं शिवो मे ललाटकम् । सौं मे कर्णौ च कामेशः
    तारं मे लोचनद्वयम् ॥ १॥ श्रीं गं डौं मे महाकालो ह्रीं नासां चन्द्रचूडकः । हं मे ओष्टौ त्रिपुरेशः सं
    मे दन्तौ च भैरवः ॥ २॥ क्षं मे जिह्वां पातु देवो महाकामेश्वरः परः । सम्मोहनं सदा पातु महावटुकभैरवः
    ॥ ३॥ यं मे स्कन्धौ सदा पातु महामृत्युञ्जयस्तथा । ऊं मे भुजौ सदा पातु श्रीं देवस्त्रिपुरान्तकः ॥ ४॥
    सं मे हस्तौ त्रिलोकेशः हं नखान् पातु सुन्दरः । क्षं दक्षः पातु शामेशो मं कुक्षिं कृत्तिका वरः ॥ ५॥
    लं पार्श्वौ पातु मे बाला वं नाभिं ब्रह्मभूषकः । रं वस्तिं पातु मे देवो यं पृष्ठं विष्णुरूपकः ॥ ६॥
    ऊं शिश्नं पातु विश्वेशः अमृतेश्वरभैरवः । यं मेढ्रे पातु मे रुद्रो रं गुह्यं गुह्यकेश्वरः ॥ ७॥ लं कटिं
    पात मे नित्यं शिवः परमकारणः । वं ऊरू त्रिपुराध्यक्षः लं जानू देवपालकः ॥ ८॥ मं जङ्घे पातु महिमा यं
    गुल्फौ सूर्यरूपकः । श्रीं जठरं हरः पातु ह्रीं मनोहरसुन्दरः ॥ ९॥ ॐ बुद्धिं पातु मे रुद्रः सौः रसं दक्षजापतिः
    । क्लीं रक्तं पातु मे देवो ऊर्ध्वं च वह्निरूपधृक् ॥ १०॥ ऐं सौं सं गुह्यकः पातु मेरुः पशुपतिस्तथा ।
    अस्थिं मे गिरिजानाथो मज्जां मे नीलकण्ठकः ॥ ११॥ शुक्रं भूतेश्वरः पातु मूर्धानं शङ्करोऽवतु । पादौ श्रीं
    सुन्दरीशानो देवः कालान्तकः प्रभुः ॥ १२॥ पादादिशिरःपर्यन्तमघोरः पातु सर्वदा । शिरसः पादपर्यन्तं सद्योजातो
    ममावतु ॥ १३॥ प्रौढरूपः सदा पातु स्वाहा मे सकलं वपुः । कामेश्वरः प्रभातेऽव्यान्मध्याह्ने कालभैरवः ॥
    १४॥ सायं पातु कुलेशानो निशीथे निष्कलेश्वरः । अर्धरात्रे वामदेवो निशान्ते सुमहोदयः ॥ १५॥ सर्वदा सर्वतः
    पातु ऐं क्लीं सौं बीजरूपधृक् । पूर्वे मामसिताङ्गोऽव्यात् दक्षिणे रुरुभैरवः ॥ १६॥ पश्चिमे पातु चण्डेशो
    ह्युत्तरे क्रोधभैरवः । ऐशान्यां पातु चोन्मत्तः कपालेशस्तथाग्निके ॥ १७॥ नैरृत्यां भीषणः पातु वायौ संहारकोऽवतु
    । ऊर्ध्वं मे कालरुद्रश्च पाताले परमेश्वरः ॥ १८॥ मध्ये सदाशिवः पातु त्रिकूटेशः सदावतु । दशदिक्षु सदा
    पातु महाकामेश्वरोऽवतु ॥ १९॥ विस्मारितं च यत्स्थानं यत्स्थानं नामवरर्जितम् । तत्सर्वं पातु मे देवस्त्रिपुरःपतिरीश्वरः
    ॥ २०॥ गृहे शर्वः सदा पातु बहिः पायाद्वृषध्वजः । पथि त्रिपुरसुन्दर्यः पातु सर्वत्र सर्वदा ॥ २१॥ रणे
    राजकुले दुर्गे दुर्भिक्षे शत्रुसंसदि । द्यूते मारीभये राष्ट्रे विप्लवे वादिनां कुले ॥ २२॥ कामेश्वरः
    सदा पातु भयस्थाने च सर्वदा । इत्येतत्कवचं गुह्यं त्रिषु लोकेषु दुर्लभम् ॥ २३॥ मूलमन्त्रमयं दिव्यं
    त्रिलोकीसारमुत्तमम् । अदातव्यमभक्ताय कवचं गुह्यमीश्वरि ॥ २४॥ अदृष्टव्यमश्रोतव्यं दीक्षाहीनाय मन्त्रिणे
    । परदीक्षाय शिष्याय पुत्राय शरजन्मने ॥ २५॥ न दातव्यं न श्रोतव्यमित्याज्ञां मामकीं श
