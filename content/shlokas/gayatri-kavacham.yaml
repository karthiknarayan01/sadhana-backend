id: gayatri-kavacham
category: stotram
name:
  english: Gayatri Kavacham
content:
  english: narada uvaca svamin sarvajagannadha samshayo'sti mama prabho catushashti kalabhijna pataka
    dyogavidvara mucyate kena punyena brahmarupah katham bhavet dehashca devatarupo mantra rupo visheshatah
    karmata cchrotu micchami nyasam ca vidhipurvakam rishi shchando'dhi daivanca dhyanam ca vidhiva tprabho
    narayana uvaca asytekam paramam guhyam gayatri kavacam tatha pathana ddharana nmartya ssarvapapaih
    pramucyate sarvankamanavapnoti devi rupashca jayate gayattri kavacasyasya brahmavishnumaheshvarah
    rishayo rigyajussamatharva cchandamsi narada brahmarupa devatokta gayatri parama kala tadbijam bharga
    ityesha shakti rukta manishibhih kilakanca dhiyah proktam mokshardhe viniyojanam caturbhirhridayam
    proktam tribhi rvarnai shshira ssmritam caturbhissyacchikha pashcattribhistu kavacam ssmutam caturbhi
    rnetra muddhishtam caturbhissyattadasrtakam atha dhyanam pravakshyami sadhakabhishtadayakam mukta
    vidruma hemanila dhavala cchayairmukhai strikshanaih yuktamindu nibaddha ratna makutam tatvardha varnatmikam
    | gayattrim varadabhayam kushakashashshubhram kapalam gadam shankham cakra matharavinda yugalam hastairvahantim
    bhaje || gayattri purvatah patu savitri patu dakshine brahma sandhyatu me pashcaduttarayam sarasvati
    parvati me disham rakshe tpavakim jalashayini yatudhanim disham rakshe dyatudhanabhayankari pavamanim
    disham rakshetpavamana vilasini disham raudrinca me patu rudrani rudra rupini urdhvam brahmani me
    rakshe dadhasta dvaishnavi tatha evam dasha disho rakshe tsarvangam bhuvaneshvari tatpadam patu me
    padau janghe me savituhpadam varenyam kati deshetu nabhim bharga stathaivaca devasya me taddhridayam
    dhimahiti ca gallayoh dhiyah padam ca me netre yah padam me lalatakam nah padam patu me murdhni shikhayam
    me pracodayat tatpadam patu murdhanam sakarah patu phalakam cakshushitu vikararno tukarastu kapolayoh
    nasaputam vakararno rakarastu mukhe tatha nikara urdhva moshthantu yakarastvadharoshthakam asyamadhye
    bhakararno gokara shcubuke tatha dekarah kantha deshetu vakara sskandha deshakam syakaro dakshinam
    hastam dhikaro vama hastakam makaro hridayam raksheddhikara udare tatha dhikaro nabhi deshetu yokarastu
    katim tatha guhyam rakshatu yokara uru dvau nah padaksharam prakaro januni rakshe cchokaro jangha
    deshakam dakaram gulpha deshetu yakarah padayugmakam takara vyanjanam caiva sarvange me sadavatu idantu
    kavacam divyam badha shata vinashanam catushshashti kala vidyadayakam mokshakarakam mucyate sarva
    papebhyah param brahmadhigacchati pathana cchravana dvapi go sahasra phalam labhet shri devibhagavatantargata
    gayattri kavacam sampurnam
  devanagari: नारद उवाच स्वामिन् सर्वजगन्नाध संशयोऽस्ति मम प्रभो चतुषष्टि कलाभिज्ञ पातका द्योगविद्वर मुच्यते
    केन पुण्येन ब्रह्मरूपः कथं भवेत् देहश्च देवतारूपो मन्त्र रूपो विशेषतः कर्मत च्छ्रोतु मिच्छामि न्यासं
    च विधिपूर्वकम् ऋषि श्छन्दोऽधि दैवञ्च ध्यानं च विधिव त्प्रभो नारायण उवाच अस्य्तेकं परमं गुह्यं गायत्री
    कवचं तथा पठना द्धारणा न्मर्त्य स्सर्वपापैः प्रमुच्यते सर्वाङ्कामानवाप्नोति देवी रूपश्च जायते गायत्त्री
    कवचस्यास्य ब्रह्मविष्णुमहेश्वराः ऋषयो ऋग्यजुस्सामाथर्व च्छन्दांसि नारद ब्रह्मरूपा देवतोक्ता गायत्री
    परमा कला तद्बीजं भर्ग इत्येषा शक्ति रुक्ता मनीषिभिः कीलकञ्च धियः प्रोक्तं मोक्षार्धे विनियोजनम् चतुर्भिर्हृदयं
    प्रोक्तं त्रिभि र्वर्णै श्शिर स्स्मृतम् चतुर्भिस्स्याच्छिखा पश्चात्त्रिभिस्तु कवचं स्स्मुतम् चतुर्भि
    र्नेत्र मुद्धिष्टं चतुर्भिस्स्यात्तदस्र्तकम् अथ ध्यानं प्रवक्ष्यामि साधकाभीष्टदायकम् मुक्ता विद्रुम
    हेमनील धवल च्छायैर्मुखै स्त्रीक्षणैः युक्तामिन्दु निबद्ध रत्न मकुटां तत्वार्ध वर्णात्मिकाम् । गायत्त्रीं
    वरदाभयां कुशकशाश्शुभ्रं कपालं गदां शङ्खं चक्र मथारविन्द युगलं हस्तैर्वहन्तीं भजे ॥ गायत्त्री पूर्वतः
    पातु सावित्री पातु दक्षिणे ब्रह्म सन्ध्यातु मे पश्चादुत्तरायां सरस्वती पार्वती मे दिशं राक्षे त्पावकीं
    जलशायिनी यातूधानीं दिशं रक्षे द्यातुधानभयङ्करी पावमानीं दिशं रक्षेत्पवमान विलासिनी दिशं रौद्रीञ्च
    मे पातु रुद्राणी रुद्र रूपिणी ऊर्ध्वं ब्रह्माणी मे रक्षे दधस्ता द्वैष्णवी तथा एवं दश दिशो रक्षे त्सर्वाङ्गं
    भुवनेश्वरी तत्पदं पातु मे पादौ जङ्घे मे सवितुःपदम् वरेण्यं कटि देशेतु नाभिं भर्ग स्तथैवच देवस्य मे
    तद्धृदयं धीमहीति च गल्लयोः धियः पदं च मे नेत्रे यः पदं मे ललाटकम् नः पदं पातु मे मूर्ध्नि शिखायां
    मे प्रचोदयात् तत्पदं पातु मूर्धानं सकारः पातु फालकम् चक्षुषीतु विकारार्णो तुकारस्तु कपोलयोः नासापुटं
    वकारार्णो रकारस्तु मुखे तथा णिकार ऊर्ध्व मोष्ठन्तु यकारस्त्वधरोष्ठकम् आस्यमध्ये भकारार्णो गोकार श्चुबुके
    तथा देकारः कण्ठ देशेतु वकार स्स्कन्ध देशकम् स्यकारो दक्षिणं हस्तं धीकारो वाम हस्तकम् मकारो हृदयं रक्षेद्धिकार
    उदरे तथा धिकारो नाभि देशेतु योकारस्तु कटिं तथा गुह्यं रक्षतु योकार ऊरू द्वौ नः पदाक्षरम् प्रकारो जानुनी
    रक्षे च्छोकारो जङ्घ देशकम् दकारं गुल्फ देशेतु याकारः पदयुग्मकम् तकार व्यञ्जनं चैव सर्वाङ्गे मे सदावतु
    इदन्तु कवचं दिव्यं बाधा शत विनाशनम् चतुष्षष्टि कला विद्यादायकं मोक्षकारकम् मुच्यते सर्व पापेभ्यः परं
    ब्रह्माधिगच्छति पठना च्छ्रवणा द्वापि गो सहस्र फलं लभेत् श्री देवीभागवतान्तर्गत गायत्त्री कवचं सम्पूर्णं
