id: shivamahimean
category: stotram
name:
  english: shivamahimean
  devanagari: शिवमहिमेअन्
content:
  english: om namah shivaya | adhinamagadham divyam vyadhinam mulakrintanam | upadravanam dalanam mahadevamupasmahe
    || 1|| aham papi papakshapana nipunah shankara bhavan | aham bhito bhitabhayavitarane te vyasanita
    aham dino dinoddharana vidhisajjastvaditarat na jane'ham vaktum kuru sakala shocye mayi kripam ||
    2|| janastvadapadabjashravanamananadhyananipunah svayam te vistirna na khalu karuna teshu karana |
    bhave line dine mayi mananahine na karuna katham natha khyatastvamasi karunagara sagara iti || 3||
    om mahimnah param te
  devanagari: ॐ नमः शिवाय । आधीनामगधं दिव्यं व्याधीनां मूलकृन्तनम् । उपद्रावाणां दलनं महादेवमुपास्महे
    ॥ १॥ अहं पापी पापक्षपण निपूणाः शङ्कर भवान् । अहं भीतो भीताभयवितरणे ते व्यसनिता अहं दीनो दीनोद्धरण
    विधिसज्जस्त्वदितरत् न जानेऽहं वक्तुं कुरु सकल शोच्ये मयि कृपाम् ॥ २॥ जनस्त्वदपादाब्जश्रवणमननध्याननिपुणाः
    स्वयं ते विस्तीर्णा न खलु करुणा तेषु करणा । भवे लीने दीने मयि मननहीने न करुणा कथं नाथ ख्यातस्त्वमसि
    करुणागार सागर इति ॥ ३॥ ॐ महिम्नः पारं ते
