id: ganeshakavacam-tatha-ganeshashtakam-ca-narayanaproktam-lakshminarayaniyasamhitantargatam
category: kavacha
name:
  english: ganeshakavacam tatha ganeshashtakam ca (narayanaproktam lakshminarayaniyasamhitantargatam)
  devanagari: गणेशकवचम् तथा गणेशाष्टकं च (नारायणप्रोक्तं लक्ष्मीनारायणीयसंहितान्तर्गतम्)
content:
  english: sarvebhyah shravitam maya || 66|| gurumabhyarcya vidhivat kavacam dharayettu yah | kanthe va
    dakshine bahau so'pi vishnusamo bhavet || 67|| sarvatra vijayi pujyo bhavedgrahanamatratah | bhutapretapishacashca
    kushmanda brahmarakshasah || 68|| dakiniyoginiyakshavetala bhairavadayah | balagraha grahashcaiva
    kshetrapaladayastatha || 69|| varmanah shabdamatrena palayante tu bhiravah | rijave gurubhaktaya svashishyaya
    prakashayet || 70|| atha ganeshadevasya'shtakam vakshye sukhapradam | yatpathakam svayam krishno ganesho'vati
    sarvada || 71|| om namo'ntahsusattvaya shivasattvaya te namah | om namah krishnarupaya shailajangaya
    te namah || 72|| om namo vriddhavipraya sattvasamsthaya te namah | om namah pindarupaya nyastacittaya
    te namah || 73|| om namah siddhyadhishthaya sarvavidyaya te namah | om namo gopuratratre matrajnapaya
    te namah || 74|| om namo'stvalakshyapitre pitrishastyaya te namah | om namah skandharupaya karyananaya
    te namah || 75|| om namah shivaputraya sarvapujyaya te namah | om namashcagrajarcaya laddukadyaya
    te namah || 76|| om namo vighnanashaya mushakasanine namah | om namo hetilabhaya cirajivaya te namah
    || 77|| om namo divyavarshmane bhavyavarmane te namah | om namah kavaca''pyaya vaco'vyayaya te namah
    || 78|| om namo mangaladhyaya bhaktidardhyaya te namah | om namah shriganeshaya shrikrishnaya namo
    namah || 79|| iti stutva naro bhaktya'maro bhavati mokshagah | ganeshavrittamityuktam kim bhuyah shrotumicchasi
    || 80|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 105
  devanagari: सर्वेभ्यः श्रावितं मया ॥ ६६॥ गुरुमभ्यर्च्य विधिवत् कवचं धारयेत्तु यः । कण्ठे वा दक्षिणे
    बाहौ सोऽपि विष्णुसमो भवेत् ॥ ६७॥ सर्वत्र विजयी पूज्यो भवेद्ग्रहणमात्रतः । भूतप्रेतपिशाचाश्च कूष्माण्डा
    ब्रह्मराक्षसाः ॥ ६८॥ डाकिनीयोगिनीयक्षवेताला भैरवादयः । बालग्रहा ग्रहाश्चैव क्षेत्रपालादयस्तथा ॥ ६९॥
    वर्मणः शब्दमात्रेण पलायन्ते तु भीरवः । ऋजवे गुरुभक्ताय स्वशिष्याय प्रकाशयेत् ॥ ७०॥ अथ गणेशदेवस्याऽष्टकं
    वक्ष्ये सुखप्रदम् । यत्पाठकं स्वयं कृष्णो गणेशोऽवति सर्वदा ॥ ७१॥ ॐ नमोऽन्तःसुसत्त्वाय शिवसत्त्वाय
    ते नमः । ॐ नमः कृष्णरूपाय शैलजाङ्गाय ते नमः ॥ ७२॥ ॐ नमो वृद्धविप्राय सत्त्वसंस्थाय ते नमः । ॐ नमः
    पिण्डरूपाय न्यस्तचित्ताय ते नमः ॥ ७३॥ ॐ नमः सिद्ध्यधिष्ठाय सर्वविद्याय ते नमः । ॐ नमो गोपुरत्रात्रे
    मात्राज्ञापाय ते नमः ॥ ७४॥ ॐ नमोऽस्त्वलक्ष्यपित्रे पितृशस्त्याय ते नमः । ॐ नमः स्कन्धरूपाय कर्याननाय
    ते नमः ॥ ७५॥ ॐ नमः शिवपुत्राय सर्वपूज्याय ते नमः । ॐ नमश्चाग्रजार्चाय लड्डुकाद्याय ते नमः ॥ ७६॥ ॐ
    नमो विघ्ननाशाय मूषकासनिने नमः । ॐ नमो हेतिलाभाय चिरजीवाय ते नमः ॥ ७७॥ ॐ नमो दिव्यवर्ष्मणे भव्यवर्मणे
    ते नमः । ॐ नमः कवचाऽऽप्याय वचोऽव्ययाय ते नमः ॥ ७८॥ ॐ नमो मङ्गलाढ्याय भक्तिदार्ढ्याय ते नमः । ॐ नमः
    श्रीगणेशाय श्रीकृष्णाय नमो नमः ॥ ७९॥ इति स्तुत्वा नरो भक्त्याऽमरो भवति मोक्षगः । गणेशवृत्तमित्युक्तं
    किं भूयः श्रोतुमिच्छसि ॥ ८०॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १०५
