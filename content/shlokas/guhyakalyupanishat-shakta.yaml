id: guhyakalyupanishat-shakta
category: upanishad
name:
  english: guhyakalyupanishat (shakta)
  devanagari: गुह्यकाल्युपानिषत् (शाक्त)
content:
  english: rinoti jighrati tatha ramate viramatyapi || 33|| taya muktam puram taddhi matamityabhidhiyate
    || 34|| ye tapah kshinadoshaste naiva pashyanti bhavitam | jyotirmayim sharire'ntirdhyayamanam mahatmabhih
    || 35|| brihacca taddivyamacintyarupam sukshmacca tat sukshmataram vibhati | durat sudure tadihasti
    kincit pashyettvihaitannihitam guhayam || 36|| na cakshusha grihyate napi vaca nanyairyogairna hi
    sa karmana va | jnanaprasadena vishuddhasattvah tatastu tam pashyati nishkalam ca || 37|| yatha nadyah
    syandamanah samudre gacchantyastam namarupe vihaya | tatha vidvan namarupadvimuktah parat param jagadambamupaiti
    || 38|| sarve veda yatpadamamananti tapamsi sarvani ca yadvadanti | yadicchanto brahmacaryam caranti
    tatte padam sangrahena bravimi || 39|| saivaitat | eshaivalambanam shreshtham saishaivalambanam param
    | eshaivalambanam jnatva brahmaloke mahiyate || 40|| indriyebhyah para hyartha hyarthebhyashca param
    manah | manasastu para buddhirbuddheratma mahan parah || 41|| mahatah paramavyaktamavyaktat purushah
    parah | purushattu para devi sa kashtha sa para gatih || 42|| yathodakam girau srishtam samudreshu
    vidhavati | evam dharman prithaka pashyamstamevanuvidhavati || 43|| eka guhya sarvabhutantaratma eka
    rupam bahudha ya karoti | tamatmastham ye'nupashyanti dhirah tesham sukham shashvatam netaresham ||
    44|| na tatra suryo bhati na candratarakam nema vidyuto bhanti kuto'yamagnih | tameva bhantimanubhati
    sarvam tasya bhasa sarvamidam vibhati || 45|| yasyah param naparamasti kincit yasya naniyo na jyayo'sti
    kincit | vriksha iva stabdha divi tishthatyeka yadantah purnamavagatya purnah || 46|| sarvananashirogriva
    sarvabhutaguhashaya | sarvatrastha bhagavati tasmat sarvagata shiva || 47|| sarvatah panipadanta sarvato'kshishiromukha
    | sarvatah shrutimatyesha sarvamavritya tishthati || 48|| sarvendriyagunabhasa sarvendriyavivarjita
    | sarvesham prabhurishani sarvesham sharanam suhrit || 49|| navadvare pure devi hamsi lilayatam bahih
    | dhyeya sarvasya lokasya sthavarasya carasya ca || 50|| apanipada janani grahitri pashyatyacakshuh
    sa shrunotyarna | sa vetti vedyam na ca tasyastu vetta tamahuragryam mahatim mahiyasim || 51|| sa
    caivagnih sa ca suryah sa vayuh sa ca candrama | sa caiva shukah sa brahma sa capah sa prajapatih
    | sa caiva stri sa ca puman sa kumarah kumarika || 52|| rico akshare parame vyoman yasyam deva adhirudra
    nisheduh | yastam na veda kimrica karishyati ye tam vidustu ime samasate || 53|| chandamsi yajnah
    kratavo vratani bhritam bhavyam yacca veda vadanti | sarvam devi srijate vishvametat tasyashcanyo
    mayaya sanniruddhah || 54|| mayam tu prakritim vidyat prabhum tasya maheshvarim | asya avayavaih sukshmairvyaptam
    sarvamidam jagat || 55|| ya devanam prabhava codbhava ca vishvadhipa sarvabhuteshu gudha | hiranyagarbham
    janayamasa purvam sa no buddhya shubhaya samyunaktum || 56|| sukshmatisukshmam salilasya madhye vishvasya
    srashtrimanekananakhyam | vishvasya caikam pariveshtayitrim jnatva guhyam shantimatyantameti || 57||
    sa hyeva kale bhuvanasya goptri vishvadhipa sarvabhuteshu gudha | yamyam mukta bradmarshayo'pi devah
    jnatva tam mutyupashanchinatti || 58|| ghritat param mandamivatisukshmam jnatva kalim sarvabhuteshu
    gudham | kalpante vai sarvasamharakatrim jnatva guhyam mucyate sarvapapaih || 59|| esha devi vishvayonirmahatma
    sada jananam hridi sannivishta | hrida manisha manasabhiklipta ye tam viduramritaste bhavanti || 60||
    yada tamastatra diva na ratrih na sanna casadbhagavatyeva guhya | tadaksharam tatsaviturvarenyam prajna
    ca tasyah prasrita para sa || 61|| nainamurdhvam na tiryak ca na madhyam parijagrabhat | na tasyah
    pratimabhishca tasya nama mahadyashah || 62|| na sandrishe tishthati lrupamasyah na cakshusha pashyati
    kashcidenam | hrida manisha manasabhikliptam ya enam viduramritaste bhavanti || 63|| bhuyashca srishtva
    tridashanatheshi sarvadhipatyam kurute bhavani | sarva dishashcordhvamadhashca tiryak prakashayanti
    bhrajate guhyakali || 64|| naiva stri na pumanesha naiva ceyam napumsaka | yadyacchariramadatte tena
    tenaiva yujyate || 65|| dharmavaham papanudam bhageshim jnatvatmasthamamritam vishvamataram | tamishvaranam
    paramam maheshvarim tam devatanam paradevatam ca | patim patinam paramam purastat vidyavatam guhyakalim
    manisham || 66|| tasya na karyam karanam ca vidyate na tatsama capyadhika ca drishyate | parasyah
    shaktirvividhaiva shruyate svabhaviki jnanabalakriya ca || 67|| kashcinna tasyah patirasti loke na
    ceshita naiva tasyashca lingam | sa karanam karanakaranadhipa nasyashca kashcijjanita na cadhipah
    || 68|| eka devi sarvabhuteshu gudha vyapnotyetat sarvabhutantarastha | karmadhyaksha sarvabhutadhivasa
    sakshinyepa kevala nirguna ca || 69|| vashinyeka nishkiyanam bahunam ekam bijam bahudha ya karoti
    | nanarupa dashavaktram vidhatte nanarupan ya ca bahun bibharti || 70|| nitya nityanam cetana cetananam
    eka bahunam vidadhati kaman | tatkaranam sankhyayogadhigamyam jnatva devim mucyate sarvapashaih ||
    71|| ya vai vishnum palane sanniyunkte rudram devam samhritau capi guhya | tam vai devimatmabuddhiprakasham
    mumukshurvai sharanamaham prapadye || 72|| nishkala nishkriyam shantam niravadyam niranjanam | bahvananakaram
    devim guhyamekam samashraye || 73|| iyam hi guhyopanishat sugridha yasya brahma devata vishvayonih
    | etam japamshcanvaham bhaktiyuktah satyam satyam hyamriratah sambabhuva || 74|| vedavedantayorguhyam
    purakalpe pracoditam | naprashantaya datavyam nashishyaya ca vai punah || 75|| yasya devyam para bhaktiryatha
    devyam tatha gurau | tasyaite kathita hyarthah prakashante mahatmanah || 76|| mahakala uvaca
  devanagari: ृणोति जिघ्रति तथा रमते विरमत्यपि ॥ ३३॥ तया मुक्तं पुरं तद्धि मतमित्यभिधीयते ॥ ३४॥ ये तपः
    क्षीणदोषास्ते नैव पश्यन्ति भाविताम् । ज्योतिर्मयीं शरीरेऽन्तिर्ध्यायमानां महात्मभिः ॥ ३५॥ बृहच्च तद्दिव्यमचिन्त्यरूपं
    सूक्ष्माच्च तत् सूक्ष्मतरं विभाति । दूरात् सुदूरे तदिहास्ति किञ्चित् पश्येत्त्विहैतन्निहितं गुहायाम्
    ॥ ३६॥ न चक्षुषा गृह्यते नापि वाचा नान्यैर्योगैर्न हि सा कर्मणा वा । ज्ञानप्रसादेन विशुद्धसत्त्वः ततस्तु
    तां पश्यति निष्कलां च ॥ ३७॥ यथा नद्यः स्यन्दमानाः समुद्रे गच्छन्त्यस्तं नामरूपे विहाय । तथा विद्वान्
    नामरूपाद्विमुक्तः परात् परां जगदम्बामुपैति ॥ ३८॥ सर्वे वेदा यत्पदमामनन्ति तपांसि सर्वाणि च यद्वदन्ति
    । यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं सङ्ग्रहेण ब्रवीमि ॥ ३९॥ सैवैतत् । एषैवालम्बनं श्रेष्ठं सैषैवालम्बनं
    परम् । एषैवालम्बनं ज्ञात्वा ब्रह्मलोके महीयते ॥ ४०॥ इन्द्रियेभ्यः परा ह्यर्था ह्यर्थेभ्यश्च परं मनः
    । मनसस्तु परा बुद्धिर्बुद्धेरात्मा महान् परः ॥ ४१॥ महतः परमव्यक्तमव्यक्तात् पुरुषः परः । पुरुषात्तु
    परा देवी सा काष्ठा सा परा गतिः ॥ ४२॥ यथोदकं गिरौ सृष्टं समुद्रेषु विधावति । एवं धर्मान् पृथक पश्यंस्तामेवानुविधावति
    ॥ ४३॥ एका गुह्या सर्वभूतान्तरात्मा एक रूपं बहुधा या करोति । तामात्मस्थां येऽनुपश्यन्ति धीराः तेषां
    सुखं शाश्वतं नेतरेषाम् ॥ ४४॥ न तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतोऽयमग्निः ।
    तामेव भान्तीमनुभाति सर्वं तस्या भासा सर्वमिदं विभाति ॥ ४५॥ यस्याः परं नापरमस्ति किञ्चित् यस्या नाणीयो
    न ज्यायोऽस्ति किञ्चित् । वृक्ष इव स्तब्धा दिवि तिष्ठत्येका यदन्तः पूर्णामवगत्य पूर्णः ॥ ४६॥ सर्वाननशिरोग्रीवा
    सर्वभूतगुहाशया । सर्वत्रस्था भगवती तस्मात् सर्वगता शिवा ॥ ४७॥ सर्वतः पाणिपादान्ता सर्वतोऽक्षिशिरोमुखा
    । सर्वतः श्रुतिमत्येषा सर्वमावृत्य तिष्ठति ॥ ४८॥ सर्वेन्द्रियगुणाभासा सर्वेन्द्रियविवर्जिता । सर्वेषां
    प्रभुरीशानी सर्वेषां शरणं सुहृत् ॥ ४९॥ नवद्वारे पुरे देवी हंसी लीलायतां बहिः । ध्येया सर्वस्य लोकस्य
    स्थावरस्य चरस्य च ॥ ५०॥ अपाणिपादा जननी ग्रहीत्री पश्यत्यचक्षुः सा श्रुणोत्यर्णा । सा वेत्ति वेद्यं
    न च तस्यास्तु वेत्ता तामाहुरग्र्यां महतीं महीयसीम् ॥ ५१॥ सा चैवाग्निः सा च सूर्यः सा वायुः सा च चन्द्रमा
    । सा चैव शुकः सा ब्रह्म सा चापः सा प्रजापतिः । सा चैव स्त्री सा च पुमान् सा कुमारः कुमारिका ॥ ५२॥
    ऋचो अक्षरे परमे व्योमन् यस्यां देवा अधिरुद्रा निषेदुः । यस्तां न वेद किमृचा करिष्यति ये तां विदुस्तु
    इमे समासते ॥ ५३॥ छन्दांसि यज्ञाः क्रतवो व्रतानि भृतं भव्यं यच्च वेदा वदन्ति । सर्वं देवी सृजते विश्वमेतत्
    तस्याश्चान्यो मायया सन्निरुद्धः ॥ ५४॥ मायां तु प्रकृतिं विद्यात् प्रभुं तस्या महेश्वरीम् । अस्या अवयवैः
    सूक्ष्मैर्व्याप्तं सर्वमिदं जगत् ॥ ५५॥ या देवानां प्रभवा चोद्भवा च विश्वाधिपा सर्वभूतेषु गूढा । हिरण्यगर्भं
    जनयामास पूर्वं सा नो बुद्ध्या शुभया संयुनक्तुम् ॥ ५६॥ सूक्ष्मातिसूक्ष्मं सलिलस्य मध्ये विश्वस्य स्रष्ट्रीमनेकाननाख्याम्
    । विश्वस्य चैकां परिवेष्टयित्रीं ज्ञात्वा गुह्यां शान्तिमत्यन्तमेति ॥ ५७॥ सा ह्येव काले भुवनस्य गोप्त्री
    विश्वाधिपा सर्वभूतेषु गूढा । यम्यां मुक्ता ब्रद्मर्षयोऽपि देवाः ज्ञात्वा तां मुत्युपाशाञ्छिनत्ति ॥
    ५८॥ घृतात् परं मण्डमिवातिसूक्ष्मं ज्ञात्वा कालीं सर्वभूतेषु गूढाम् । कल्पान्ते वै सर्वसंहारकत्रीं
    ज्ञात्वा गुह्यां मुच्यते सर्वपापैः ॥ ५९॥ एषा देवी विश्वयोनिर्महात्मा सदा जनानां हृदि सन्निविष्टा ।
    हृदा मनीषा मनसाभिकॢप्ता ये तां विदुरमृतास्ते भवन्ति ॥ ६०॥ यदा तमस्तत्र दिवा न रात्रिः न सन्न चासद्भगवत्येव
    गुह्या । तदक्षरं तत्सवितुर्वरेण्यं प्रज्ञा च तस्याः प्रसृता परा सा ॥ ६१॥ नैनामूर्ध्वं न तिर्यक् च
    न मध्यं परिजग्रभत् । न तस्याः प्रतिमाभिश्च तस्या नाम महद्यशः ॥ ६२॥ न सन्दृशे तिष्ठति ल्रूपमस्याः न
    चक्षुषा पश्यति कश्चिदेनाम् । हृदा मनीषा मनसाभिकॢप्तां य एनां विदुरमृतास्ते भवन्ति ॥ ६३॥ भूयश्च सृष्ट्वा
    त्रिदशानथेशी सर्वाधिपत्यं कुरुते भवानी । सर्वा दिशश्चोर्ध्वमधश्च तिर्यक् प्रकाशयन्ती भ्राजते गुह्यकाली
    ॥ ६४॥ नैव स्त्री न पुमानेषा नैव चेयं नपुंसका । यद्यच्छरीरमादत्ते तेन तेनैव युज्यते ॥ ६५॥ धर्मावहां
    पापनुदां भगेशीं ज्ञात्वात्मस्थाममृतां विश्वमातरम् । तामीश्वराणां परमां महेश्वरीं तां देवतानां परदेवतां
    च । पतिं पतीनां परमां पुरस्तात् विद्यावतां गुह्यकालीं मनीषाम् ॥ ६६॥ तस्या न कार्यं करणं च विद्यते
    न तत्समा चाप्यधिका च दृश्यते । परास्याः शक्तिर्विविधैव श्रूयते स्वाभाविकी ज्ञानबलक्रिया च ॥ ६७॥ कश्चिन्न
    तस्याः पतिरस्ति लोके न चेशिता नैव तस्याश्च लिङ्गम् । सा कारणं कारणकारणाधिपा नास्याश्च कश्चिज्जनिता
    न चाधिपः ॥ ६८॥ एका देवी सर्वभूतेषु गूढा व्याप्नोत्येतत् सर्वभूतान्तरस्था । कर्माध्यक्षा सर्वभूताधिवासा
    साक्षिण्येपा केवला निर्गुणा च ॥ ६९॥ वशिन्येका निष्कियाणां बहूनां एकं बीजं बहुधा या करोति । नानारूपा
    दशवक्त्रं विधत्ते नानारूपान् या च बाहून् बिभर्ति ॥ ७०॥ नित्या नित्यानां चेतना चेतनानां एका बहूनां
    विदधाति कामान् । तत्कारणं साङ्ख्ययोगाधिगम्यं ज्ञात्वा देवीं मुच्यते सर्वपाशैः ॥ ७१॥ या वै विष्णुं
    पालने सन्नियुङ्क्ते रुद्रं देवं संहृतौ चापि गुह्या । तां वै देवीमात्मबुद्धिप्रकाशां मुमुक्षुर्वै शरणमहं
    प्रपद्ये ॥ ७२॥ निष्कला निष्क्रियां शान्तां निरवद्यां निरञ्जनाम् । बह्वाननकरां देवीं गुह्यामेकां समाश्रये
    ॥ ७३॥ इयं हि गुह्योपनिषत् सुगृढा यस्या ब्रह्मा देवता विश्वयोनिः । एतां जपंश्चान्वहं भक्तियुक्तः सत्यं
    सत्यं ह्यमृरतः सम्बभूव ॥ ७४॥ वेदवेदान्तयोर्गुह्यं पुराकल्पे प्रचोदितम् । नाप्रशान्ताय दातव्यं नाशिष्याय
    च वै पुनः ॥ ७५॥ यस्य देव्यां परा भक्तिर्यथा देव्यां तथा गुरौ । तस्यैते कथिता ह्यर्थाः प्रकाशन्ते महात्मनः
    ॥ ७६॥ महाकाल उवाच
