id: gautamamaharshikritamshivastotram
category: stotram
name:
  english: gautamamaharshikritamshivastotram
  devanagari: गौतममहर्षिकृतंशिवस्तोत्रम्
content:
  english: satyam bhagavannamaste || 13|| atmaikatam svaprakritim kadacidaikshacchivah sampadiyam mameti
    | prithaktadaivabhavadapratarkyacintyaprabhavo bahuvishvamurtih || 14|| bhavo'bhivriddha ca bhave
    bhave ca svakaranam karanamasthita ca | nitya shiva sarvasulakshana va vilakshana vishvakarasya shaktih
    || 15|| utpadanam samsthitirannavriddhilayah satam yatra sanatanaste | ekaiva murtirna samasti kincidasadhyamasya
    dayita harasya || 16|| yadarthamannani dhanani jiva yacchanti kurvanti tapamsi dharman | sa'piyamamba
    jagato janitri priya tu somasya mahasukirtih || 17|| yadikshitam kankshati vasavo'pi yannamato mangalamapnuyacca
    | ya vyapya vishvam vimalikaroti soma sada somasamanarupa || 18|| brahmadijivasya caracarasya buddhyakshicaitanyamanahsukhani
    | yasyah prasadatphalavanti nityam vagishvari lokaguroh suramya || 19|| caturmukhasyapi mano malinam
    kimanyajantoriti cintya mata | ganga'vataram vividhairupayaih sarvam jagatpavayitum cakara || 20||
    shrutih samalakshya haraprabhutvam vishvasya lokah sakalaih pramanaih | kritva ca dharmanbubhuje ca
    bhoganvibhutiresha tu sadashivasya || 21|| karyakriyakarakasadhananam vedoditanamatha laukikanam |
    yatsadhyamutkrishtatamam priyam ca prokta ca sa siddhiranadikartuh || 22|| dhyatva varam brahma param
    pradhanam yatsarabhutam yadupasitavyam | yatprapya mukta na punarbhavanti sadyogino muktirumapatih
    sah || 23|| yatha yatha shambhurameyamayarupani dhatte jagato hitaya | tadyogayogyani tathaiva dhatse
    pativratatvam tvayi matarevam || 24|| iti brahmapurane pancasaptatitamadhyayantargatam gautamamaharshikritam
    shivastotram samaptam | brahmapurana | adhyaya 75
  devanagari: सत्यं भगवन्नमस्ते ॥ १३॥ आत्मैकतां स्वप्रकृतिं कदाचिदैक्षच्छिवः सम्पदियं ममेति । पृथक्तदैवाभवदप्रतर्क्याचिन्त्यप्रभावो
    बहुविश्वमूर्तिः ॥ १४॥ भावोऽभिवृद्धा च भवे भवे च स्वकारणं कारणमास्थिता च । नित्या शिवा सर्वसुलक्षणा
    वा विलक्षणा विश्वकरस्य शक्तिः ॥ १५॥ उत्पादनं संस्थितिरन्नवृद्धिलयाः सतां यत्र सनातनास्ते । एकैव मूर्तिर्न
    समस्ति किञ्चिदसाध्यमस्या दयिता हरस्य ॥ १६॥ यदर्थमन्नानि धनानि जीवा यच्छन्ति कुर्वन्ति तपांसि धर्मान्
    । साऽपीयमम्बा जगतो जनित्री प्रिया तु सोमस्य महासुकीर्तिः ॥ १७॥ यदीक्षितं काङ्क्षति वासवोऽपि यन्नामतो
    मङ्गलमाप्नुयाच्च । या व्याप्य विश्वं विमलीकरोति सोमा सदा सोमसमानरूपा ॥ १८॥ ब्रह्मादिजीवस्य चराचरस्य
    बुद्ध्यक्षिचैतन्यमनःसुखानि । यस्याः प्रसादात्फलवन्ति नित्यं वागीश्वरी लोकगुरोः सुरम्या ॥ १९॥ चतुर्मुखस्यापि
    मनो मलीनं किमन्यजन्तोरिति चिन्त्य माता । गङ्गाऽवतारं विविधैरुपायैः सर्वं जगत्पावयितुं चकार ॥ २०॥ श्रुतीः
    समालक्ष्य हरप्रभुत्वं विश्वस्य लोकः सकलैः प्रमाणैः । कृत्वा च धर्मान्बुभुजे च भोगान्विभूतिरेषा तु
    सदाशिवस्य ॥ २१॥ कार्यक्रियाकारकसाधनानां वेदोदितानामथ लौकिकानाम् । यत्साध्यमुत्कृष्टतमं प्रियं च प्रोक्ता
    च सा सिद्धिरनादिकर्तुः ॥ २२॥ ध्यात्वा वरं ब्रह्म परं प्रधानं यत्सारभूतं यदुपासितव्यम् । यत्प्राप्य
    मुक्ता न पुनर्भवन्ति सद्योगिनो मुक्तिरुमापतिः सः ॥ २३॥ यथा यथा शम्भुरमेयमायारूपाणि धत्ते जगतो हिताय
    । तद्योगयोग्यानि तथैव धत्से पतिव्रतात्वं त्वयि मातरेवम् ॥ २४॥ इति ब्रह्मपुराणे पञ्चसप्ततितमाध्यायान्तर्गतं
    गौतममहर्षिकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ७५
