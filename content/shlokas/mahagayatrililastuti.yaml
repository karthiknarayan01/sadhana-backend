id: mahagayatrililastuti
category: stotram
name:
  english: mahagayatrililastuti
  devanagari: महागायत्रिलीलास्तुति
content:
  english: svatamtrata sharirini babhuva ya maheshituh | dvipatritadibhedato latayamanavigraha trayishvari
    sada tu sa jaganjayaya jayatam || 7|| namami tanmukharavindapancakam malapaham galaikanalakam sadavikasi
    bhaktisambhavam | svabhaktahamsasevitam shucindupadmabandhavah pratikabhutavigraha gata hi yatra pancatam
    || 8|| bhavarnave'tiduhsahasmaradhidigdhamanasam shadurminityapiditam janam didhirshumanasa | shrutidhvanisphuranmukharavindabhusuraih
    sada trisandhyamishvari nuta'stu sa sukhaprada hi nah || 9|| trayiprasuh svadrishtipatadhutabhaktakalmasha
    samairjunairnuta muda svavarnadharmabhedatah | nilimpanimnagamishena padadyautajam jalam yadiyamagatam
    kshirti tanotu nah shivam tu sa || 10|| svadambhavancitakhilam kubhogasaktamanasam sada'shucim kumargagam
    shatham ca shankase yadi | katham svapadacintanotthavaibhavam nahishvari
  devanagari: स्वतंत्रता शरीरिणी बभूव या महेशितुः । द्विपत्रितादिभेदतो लतायमानविग्रहा त्रयीश्वरी सदा तु
    सा जगञ्जयाय जायताम् ॥ ७॥ नमामि तन्मुखारविन्दपञ्चकं मलापहं गलैकनालकं सदाविकासि भक्तिसम्भवम् । स्वभक्तहंससेवितं
    शुचीन्दुपद्मबन्धवः प्रतीकभूतविग्रहा गता हि यत्र पञ्चताम् ॥ ८॥ भवार्णवेऽतिदुःसहस्मराधिदिग्धमानसं षडूर्मिनित्यपीडितं
    जनं दिधीर्षुमानसा । श्रुतिध्वनिस्फुरन्मुखारविन्दभूसुरैः सदा त्रिसन्ध्यमीश्वरी नुताऽस्तु सा सुखप्रदा
    हि नः ॥ ९॥ त्रयीप्रसूः स्वदृष्टिपातधूतभक्तकल्मषा समैर्जुनैर्नुता मुदा स्ववर्णधर्मभेदतः । निलिम्पनिम्नगामिषेण
    पादद्यौतजं जलं यदीयमागतं क्षिर्ति तनोतु नः शिवं तु सा ॥ १०॥ स्वदम्भवञ्चिताखिलं कुभोगसक्तमानसं सदाऽशुचिं
    कुमार्गगं शठं च शङ्कसे यदि । कथं स्वपादचिन्तनोत्थवैभवं नहीश्वरि
