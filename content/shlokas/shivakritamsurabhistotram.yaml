id: shivakritamsurabhistotram
category: stotram
name:
  english: shivakritamsurabhistotram
  devanagari: शिवकृतंसुरभिस्तोत्रम्
content:
  english: shivakritam surabhistotram surabhim gam ca goloke tam tushtava susamyatah | srishtisthitivinashanam
    kartryai matre namo namah || 30|| ya tvam rasamayairbhavairapyayayasi bhutalam | devanam ca tathasanghanpitrinamapi
    vai ganan || 31|| sarvairjnata rasabhijnairmadhurasvadadayini | tvaya vishvamidam sarvam balasnehasamanvitam
    || 32|| tvam mata sarvarudranam vasunam duhita tatha | adityanam svasa caiva tushta vancchitasiddhida
    || 33|| tvam dhritistvam tatha pushtistvam svaha tvam svadha tatha | riddhih siddhistatha lakshmirdhritih
    kirtistatha matih || 34|| kantirlajja mahamaya shraddha sarvarthasadhini | tvaya virahitam kincinnasti
    tribhuvaneshvapi || 35|| vahnestriptipradatri ca devadinam ca triptida | tvaya sarvamidam vyaptam
    jagatsthavarajangamam || 36|| padaste vedashcatvarah samudrah stanatam yayuh | candrarkau locane yasya
    romagreshu ca devatah || 37|| sha
  devanagari: शिवकृतं सुरभिस्तोत्रम् सुरभिं गां च गोलोके तां तुष्टाव सुसंयतः । सृष्टिस्थितिविनाशानां कर्त्र्यै
    मात्रे नमो नमः ॥ ३०॥ या त्वं रसमयैर्भावैराप्याययसि भूतलम् । देवानां च तथासङ्घान्पितॄणामपि वै गणान्
    ॥ ३१॥ सर्वैर्ज्ञाता रसाभिज्ञैर्मधुरास्वाददायिनी । त्वया विश्वमिदं सर्वं बलस्नेहसमन्वितम् ॥ ३२॥ त्वं
    माता सर्वरुद्राणां वसूनां दुहिता तथा । आदित्यानां स्वसा चैव तुष्टा वाञ्च्छितसिद्धिदा ॥ ३३॥ त्वं धृतिस्त्वं
    तथा पुष्टिस्त्वं स्वाहा त्वं स्वधा तथा । ऋद्धिः सिद्धिस्तथा लक्ष्मीर्धृतिः कीर्तिस्तथा मतिः ॥ ३४॥
    कान्तिर्लज्जा महामाया श्रद्धा सर्वार्थसाधिनी । त्वया विरहितं किञ्चिन्नास्ति त्रिभुवनेष्वपि ॥ ३५॥ वह्नेस्तृप्तिप्रदात्री
    च देवादीनां च तृप्तिदा । त्वया सर्वमिदं व्याप्तं जगत्स्थावरजङ्गमम् ॥ ३६॥ पादास्ते वेदाश्चत्वारः समुद्राः
    स्तनतां ययुः । चन्द्रार्कौ लोचने यस्या रोमाग्रेषु च देवताः ॥ ३७॥ श
