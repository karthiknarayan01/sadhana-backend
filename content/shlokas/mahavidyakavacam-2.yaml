id: mahavidyakavacam-2
category: kavacha
name:
  english: mahavidyakavacam 2
  devanagari: महाविद्याकवचम् २
content:
  english: sarvangam sarva nilaya camunda patu me romakupam sarvarthasadhini || 13|| brahmandam me mahavidya
    patu nityam manohara | lingam lingeshvari patu mahapithe maheshvari || 14|| sadashivapriya patu nityam
    patu sureshvari | gauri me sandhideshanca patu vai tripureshvari || 15|| sureshvari sada patu shmashane
    ca shave'vatu | kumbhake recake caiva purake kamamandire || 16|| kamakhya kamanilayam patu durga maheshvari
    | dakini kakini patu nityam ca shakini tatha || 17|| hakini lakini patu rakini patu sarvada | jvalamukhi
    sada patu mukhyamadhye shiva'vatu || 18|| tarini vibhave patu bhavani ca bhave'vatu | trailokyamohini
    patu sarvangam vijaya'vatu || 19|| rajakule mahadyute sangrame shatrusankate | pracanda sadhakam manca
    patu bhairavamohini || 20|| shrirajamohini patu rajadvare vipattishu | sampadprada bhairavi ca patu
    bala balam mama || 21|| nityam mam shambhuvanita patu mam tripurantaka | ityevam kathitam rahasyam
    sarvakalikam || 22|| bhaktidam muktidam saukhyam sarva sampatpradayakam | yah pathet pratarutthaya
    sadhakendro bhavedbhuvi || 23|| kujavare caturdashyamamayam mandavasare | yah pathet manavo bhaktya
    sa yati shiva mandiram || 24|| gurau gurum samabhyarcya yah pathetsadhakottamah | sa yati bhavanam
    devyah satyam satyam na samshayah || 25|| evam yadi vararohe pathedbhakti parayanah | mantrasiddhirbhavettasya
    cacirannatra samshayah || 26|| satyam lakshapurashcaryaphalam prapya shivam yajet | rajamargam shivamargam
    prapya jivah shivo bhavet || 27|| pathitva kavacam stotram muktimapnoti nishcitam | pathitva kavacam
    stotram dashavidyam yajedyadi | vidyasiddhirmantrasiddhirbhavatyeva na samshayah || 28|| tadaiva tambulaih
    siddhirjayate natra samshayah | ashavasiddhishcitasiddhirdurlabha dharanitale || 29|| ayatnasubhaga
    siddhistambulannatra samshayah | nishamukhe nishayanca mahakale nishantake | pathedbhaktya maheshani
    ganapatyam labhet sah || 30|| iti shrimundamalatantre dashamapatale parvatishvarasamvade mantrasiddhistotram
    kavacam athava mahavidyakavacam sampurnam || mundamalatantre dashamah patalah shlokah 57
  devanagari: सर्वाङ्गं सर्व निलया चामुण्डा पातु मे रोमकूपं सर्वार्थसाधिनी ॥ १३॥ ब्रह्माण्डं मे महाविद्या
    पातु नित्यं मनोहरा । लिङ्गं लिङ्गेश्वरी पातु महापीठे महेश्वरी ॥ १४॥ सदाशिवप्रिया पातु नित्यं पातु
    सुरेश्वरी । गौरी मे सन्धिदेशञ्च पातु वै त्रिपुरेश्वरी ॥ १५॥ सुरेश्वरी सदा पातु श्मशाने च शवेऽवतु ।
    कुम्भके रेचके चैव पूरके काममन्दिरे ॥ १६॥ कामाख्या कामनिलयं पातु दुर्गा महेश्वरी । डाकिनी काकिनी पातु
    नित्यं च शाकिनी तथा ॥ १७॥ हाकिनी लाकिनी पातु राकिनी पातु सर्वदा । ज्वालामुखी सदा पातु मुख्यमध्ये शिवाऽवतु
    ॥ १८॥ तारिणी विभवे पातु भवानी च भवेऽवतु । त्रैलोक्यमोहिनी पातु सर्वाङ्गं विजयाऽवतु ॥ १९॥ राजकुले महाद्युते
    सङ्ग्रामे शत्रुसङ्कटे । प्रचण्डा साधकं माञ्च पातु भैरवमोहिनी ॥ २०॥ श्रीराजमोहिनी पातु राजद्वारे विपत्तिषु
    । सम्पद्प्रदा भैरवी च पातु बाल बलं मम ॥ २१॥ नित्यं मां शम्भुवनिता पातु मां त्रिपुरान्तका । इत्येवं
    कथितं रहस्यं सर्वकालिकम् ॥ २२॥ भक्तिदं मुक्तिदं सौख्यं सर्व सम्पत्प्रदायकम् । यः पठेत् प्रातरुत्थाय
    साधकेन्द्रो भवेद्भुवि ॥ २३॥ कुजवारे चतुर्दश्याममायां मन्दवासरे । यः पठेत् मानवो भक्त्या स याति शिव
    मन्दिरम् ॥ २४॥ गुरौ गुरुं समभ्यर्च्य यः पठेत्साधकोत्तमः । स याति भवनं देव्याः सत्यं सत्यं न संशयः
    ॥ २५॥ एवं यदि वरारोहे पठेद्भक्ति परायणः । मन्त्रसिद्धिर्भवेत्तस्य चाचिरान्नात्र संशयः ॥ २६॥ सत्यं
    लक्षपुरश्चर्याफलं प्राप्य शिवां यजेत् । राजमार्गं शिवमार्गं प्राप्य जीवः शिवो भवेत् ॥ २७॥ पठित्वा
    कवचं स्तोत्रं मुक्तिमाप्नोति निश्चितम् । पठित्वा कवचं स्तोत्रं दशविद्यां यजेद्यदि । विद्यासिद्धिर्मन्त्रसिद्धिर्भवत्येव
    न संशयः ॥ २८॥ तदैव ताम्बुलैः सिद्धिर्जायते नात्र संशयः । अशवसिद्धिश्चितासिद्धिर्दुर्लभा धरणीतले ॥
    २९॥ अयत्नसुभगा सिद्धिस्ताम्बूलान्नात्र संशयः । निशामुखे निशायाञ्च महाकाले निशान्तके । पठेद्भक्त्या
    महेशानि गाणपत्यं लभेत् सः ॥ ३०॥ इति श्रीमुण्डमालातन्त्रे दशमपटले पार्वतीश्वरसंवादे मन्त्रसिद्धिस्तोत्रं
    कवचं अथवा महाविद्याकवचं सम्पूर्णम् ॥ मुण्डमालातन्त्रे दशमः पटलः श्लोकाः ५७
