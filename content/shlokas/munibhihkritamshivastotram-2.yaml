id: munibhihkritamshivastotram-2
category: stotram
name:
  english: munibhihkritamshivastotram 2
  devanagari: मुनिभिःकृतंशिवस्तोत्रम् २
content:
  english: munibhih kritam shivastotram munaya ucuh | drishtva samagatam devam devya saha kapardinam |
    pranemuh shirasa bhumau toshayamasurishvaram || 1|| vaidikairvividhairmantraih suktairmaheshvaraih
    shubhaih | atharvashirasa canye rudradyairarccayanbhavam || 2|| namo devadidevaya mahadevaya te namah
    | tryambakaya namastubhyam trishulavaradharine || 3|| namo digvasase tubhyam vikritaya pinakine |
    sarvapranatadevaya svayamapranatatmane || 4|| antakantakrite tubhyam sarvasamharanaya ca | namo'stu
    nrityashilaya namo bhairavarupine || 5|| naranarishariraya yoginam gurave namah | namo dantaya shantaya
    tapasaya haraya ca || 6|| vibhishanaya rudraya namaste krittivasase | namaste lelihanaya shitikanthaya
    te namah || 7|| aghoraghorarupaya vamadevaya vai namah | namah kanakamalaya devyah priyakaraya ca
    || 8|| gangasaliladharaya shambhave parameshthine | namo yogadhipataye brahmadhipataye namah || 9||
    pranaya ca namastubhyam namo bhasmangadharine | namaste havyavahaya damshtrine havyaretase || 10||
    brahmanashca shirohartre namaste kalarupine | agatim te na janimo gatim naiva ca naiva ca || 11||
    vishveshvara mahadeva yo'si so'si namo'stu te | namah pramathanathaya datre ca shubhasampadam || 12||
    kapalapanaye tubhyam namo midhushtamaya te | namah kanakalingaya varilingaya te namah || 13|| namo
    vahnyarkalingaya jnanalingaya te namah | namo bhujangaharaya karnikarapriyaya ca | kiritine kundaline
    kalakalaya te namah || 14|| vamadeva maheshana devadeva trilocana | kshamyatam yatkritam mohat tvameva
    sharanam hi nah || 15|| caritani vicitrani guhyani gahanani ca | brahmadinam ca sarvesham durvijneyo'si
    shankara || 16|| ajnanadyadi va jnanadyatkincitkurute narah | tatsarvam bhagavaneva kurute yogamayaya
    || 17|| evam stutva mahadevam prahrishtenantaratmana | ucuh pranamya girisham pashyamastvam yatha
    pura || 18|| iti kurmapurane uttarabhage ekonacatvarimshadhyayantagatam munibhih kritam shivastotram
    samaptam | kurmapurane uttarabhage 39
  devanagari: मुनिभिः कृतं शिवस्तोत्रम् मुनय ऊचुः । दृष्ट्वा समागतं देवं देव्या सह कपर्दिनम् । प्रणेमुः
    शिरसा भूमौ तोषयामासुरीश्वरम् ॥ १॥ वैदिकैर्विविधैर्मन्त्रैः सूक्तैर्माहेश्वरैः शुभैः । अथर्वशिरसा चान्ये
    रुद्राद्यैरर्च्चयन्भवम् ॥ २॥ नमो देवादिदेवाय महादेवाय ते नमः । त्र्यम्बकाय नमस्तुभ्यं त्रिशूलवरधारिणे
    ॥ ३॥ नमो दिग्वाससे तुभ्यं विकृताय पिनाकिने । सर्वप्रणतदेवाय स्वयमप्रणतात्मने ॥ ४॥ अन्तकान्तकृते तुभ्यं
    सर्वसंहरणाय च । नमोऽस्तु नृत्यशीलाय नमो भैरवरूपिणे ॥ ५॥ नरनारीशरीराय योगिनां गुरवे नमः । नमो दान्ताय
    शान्ताय तापसाय हराय च ॥ ६॥ विभीषणाय रुद्राय नमस्ते कृत्तिवाससे । नमस्ते लेलिहानाय शितिकण्ठाय ते नमः
    ॥ ७॥ अघोरघोररूपाय वामदेवाय वै नमः । नमः कनकमालाय देव्याः प्रियकराय च ॥ ८॥ गङ्गासलिलधाराय शम्भवे परमेष्ठिने
    । नमो योगाधिपतये ब्रह्माधिपतये नमः ॥ ९॥ प्राणाय च नमस्तुभ्यं नमो भस्माङ्गधारिणे । नमस्ते हव्यवाहाय
    दंष्ट्रिणे हव्यरेतसे ॥ १०॥ ब्रह्मणश्च शिरोहर्त्रे नमस्ते कालरूपिणे । आगतिं ते न जनीमो गतिं नैव च नैव
    च ॥ ११॥ विश्वेश्वर महादेव योऽसि सोऽसि नमोऽस्तु ते । नमः प्रमथनाथाय दात्रे च शुभसम्पदाम् ॥ १२॥ कपालपाणये
    तुभ्यं नमो मीढुष्टमाय ते । नमः कनकलिङ्गाय वारिलिङ्गाय ते नमः ॥ १३॥ नमो वह्न्यर्कलिङ्गाय ज्ञानलिङ्गाय
    ते नमः । नमो भुजङ्गहाराय कर्णिकारप्रियाय च । किरीटिने कुण्डलिने कालकालाय ते नमः ॥ १४॥ वामदेव महेशान
    देवदेव त्रिलोचन । क्षम्यतां यत्कृतं मोहात् त्वमेव शरणं हि नः ॥ १५॥ चरितानि विचित्राणि गुह्यानि गहनानि
    च । ब्रह्मादीनां च सर्वेषां दुर्विज्ञेयोऽसि शङ्कर ॥ १६॥ अज्ञानाद्यदि वा ज्ञानाद्यत्किञ्चित्कुरुते
    नरः । तत्सर्वं भगवानेव कुरुते योगमायया ॥ १७॥ एवं स्तुत्वा महादेवं प्रहृष्टेनान्तरात्मना । ऊचुः प्रणम्य
    गिरिशं पश्यामस्त्वां यथा पुरा ॥ १८॥ इति कूर्मपुराणे उत्तरभागे एकोनचत्वारिंशाध्यायान्तगतं मुनिभिः कृतं
    शिवस्तोत्रं समाप्तम् । कूर्मपुराणे उत्तरभागे ३९
