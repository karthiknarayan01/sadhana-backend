id: nimbarkagayatrimantrajapavidhih
category: mantra
name:
  english: nimbarkagayatrimantrajapavidhih
  devanagari: निम्बार्कगायत्रीमन्त्रजपविधिः
content:
  english: om nimbarkaya angushthabhyam namah | vidmahe tarjanibhyam namah | adyacaryaya madhyamabhyam
    namah | dhimahi anamikabhyam namah | tannashcakram kanishthikabhyam namah | pracodayat karatalakaraprishthabhyam
    namah | hridayadinyasah
  devanagari: ॐ निम्बार्काय अङ्गुष्ठाभ्यां नमः । विद्महे तर्जनीभ्यां नमः । आद्याचार्याय मध्यमाभ्यां नमः
    । धीमहि अनामिकाभ्यां नमः । तन्नश्चक्रं कनिष्ठिकाभ्यां नमः । प्रचोदयात् करतलकरपृष्ठाभ्यां नमः । हृदयादिन्यासाः
meaning: {}
