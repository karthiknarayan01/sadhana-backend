id: brahmadibhihkritam1vishnustotram
category: stotram
name:
  english: brahmadibhihkritam1vishnustotram
  devanagari: ब्रह्मादिभिःकृतं१विष्णुस्तोत्रम्
content:
  english: brahmadibhih kritam 1 vishnustotram brahmadaya ucuh | jaya jaya jaya nirguna gunadharin agajagajivatattvashubhakarin
    | sarabhutasadgunamaya tattvairdevan racayati pati gunasattvaih | tasmai namo namo gunarashe devavrindahridi
    krishnavikashe || 7|| rajobhutatattvebhya utashu viracati bhuvi ca naransvayamashu | pati hanti yo
    deva udarastasya shirasi samsthitajagabharah | pahi natha no daityavinashin kalajanitalilagunabhasin
    || 8|| iti bhavishyapurane pratisargaparvani caturthakhande pancavimshadhyayantargatam brahmadibhih
    kritam vishnustotram samaptam | bhavishyapurana | pratisargaparva | caturthakhanda | adhyaya 25
  devanagari: ब्रह्मादिभिः कृतं १ विष्णुस्तोत्रम् ब्रह्मादय ऊचुः । जय जय जय निर्गुण गुणधारिन् अगजगजीवतत्त्वशुभकारिन्
    । सारभूतसद्गुणमय तत्त्वैर्देवान् रचयति पाति गुणसत्त्वैः । तस्मै नमो नमो गुणराशे देववृन्दहृदि कृष्णविकाशे
    ॥ ७॥ रजोभूततत्त्वेभ्य उताशु विरचति भुवि च नरान्स्वयमाशु । पाति हन्ति यो देव उदारस्तस्य शिरसि संस्थितजगभारः
    । पाहि नाथ नो दैत्यविनाशिन् कालजनितलीलागुणभासिन् ॥ ८॥ इति भविष्यपुराणे प्रतिसर्गपर्वणि चतुर्थखण्डे
    पञ्चविंशाध्यायान्तर्गतं ब्रह्मादिभिः कृतं विष्णुस्तोत्रं समाप्तम् । भविष्यपुराण । प्रतिसर्गपर्व ।
    चतुर्थखण्ड । अध्याय २५
meaning: {}
