    jayatu ramo janakivallabho'yam jayatu jayatu ramashcandracudarcitanghrih | jayatu jayatu vaninathanathah
    paratma jayatu jayatu ramo'nathanathah kripaluh || vadatu vadatu vani ramarameti nityam jayatu jayatu
    cittam ramapadaravindam | namatu namatu deham santatam ramacandram na bhavatu mama papam janmajanmantareshu
