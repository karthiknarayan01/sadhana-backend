id: bhishmaproktamvishnustotram
category: stotram
name:
  english: bhishmaproktamvishnustotram
  devanagari: भीष्मप्रोक्तंविष्णुस्तोत्रम्
content:
  english: rinu cedam maharaja brahmabhutastavam mama | brahmarshibhishca devaishca yah pura kathito bhuvi
    || 1|| sadhyanamapi devanam devadeveshvarah prabhuh | lokabhavanabhavajna iti tvam narado'bravit |
    bhutam bhavyam bhavishyam ca markandeyo'bhyuvaca ha || 2|| yajnanam caiva yajnam tvam tapashca tapasamapi
    | devanamapi devam ca tvamaha bhagavanbhriguh | purane bhairavam rupam vishno bhutapateti vai || 3||
    vasudevo vasunam tvam shakram sthapayita tatha | devadevo'si devanamiti dvaipayano'bravit || 4|| purve
    prajanisargeshu dakshamahuh prajapatim | srashtaram sarvabhutanamangirastvam tato'bravit || 5|| avyaktam
    te sharirottham vyaktam te manasi sthitam | deva vaksambhavashceti devalastvasito'bravit || 6|| shirasa
    te divam vyaptam bahubhyam prithivi dhrita | jatharam te trayo lokah purusho'si sanatanah || 7|| evam
    tvamabhijananti tapasa bhavita narah | atmadarshanatriptanamrishinam capi sattamah || 8|| rajarshinamudaranamahaveshvanivartinam
    | sarvadharmapradhananam tvam gatirmadhusudana || 9|| esha te vistarastata sankshepashca prakirtitah
    | keshavasya yathatattvam suprito bhava keshave || 10|| iti mahabharate bhishmaparvani 64 adhyayantargatam
    bhishmaproktam vishnustotram sampurnam | mahabharata | bhishmaparva | adhyaya 64
  devanagari: ृणु चेदं महाराज ब्रह्मभूतस्तवं मम । ब्रह्मर्षिभिश्च देवैश्च यः पुरा कथितो भुवि ॥ १॥ साध्यानामपि
    देवानां देवदेवेश्वरः प्रभुः । लोकभावनभावज्ञ इति त्वां नारदोऽब्रवीत् । भूतं भव्यं भविष्यं च मार्कण्डेयोऽभ्युवाच
    ह ॥ २॥ यज्ञानां चैव यज्ञं त्वां तपश्च तपसामपि । देवानामपि देवं च त्वामाह भगवान्भृगुः । पुराणे भैरवं
    रूपं विष्णो भूतपतेति वै ॥ ३॥ वासुदेवो वसूनां त्वं शक्रं स्थापयिता तथा । देवदेवोऽसि देवानामिति द्वैपायनोऽब्रवीत्
    ॥ ४॥ पूर्वे प्रजानिसर्गेषु दक्षमाहुः प्रजापतिम् । स्रष्टारं सर्वभूतानामङ्गिरास्त्वां ततोऽब्रवीत् ॥
    ५॥ अव्यक्तं ते शरीरोत्थं व्यक्तं ते मनसि स्थितम् । देवा वाक्सम्भवाश्चेति देवलस्त्वसितोऽब्रवीत् ॥ ६॥
    शिरसा ते दिवं व्याप्तं बाहुभ्यां पृथिवी धृता । जठरं ते त्रयो लोकाः पुरुषोऽसि सनातनः ॥ ७॥ एवं त्वामभिजानन्ति
    तपसा भाविता नराः । आत्मदर्शनतृप्तानामृषीणां चापि सत्तमः ॥ ८॥ राजर्षीणामुदाराणामाहवेष्वनिवर्तिनाम्
    । सर्वधर्मप्रधानानां त्वं गतिर्मधुसूदन ॥ ९॥ एष ते विस्तरस्तात सङ्क्षेपश्च प्रकीर्तितः । केशवस्य यथातत्त्वं
    सुप्रीतो भव केशवे ॥ १०॥ इति महाभारते भीष्मपर्वणि ६४ अध्यायान्तर्गतं भीष्मप्रोक्तं विष्णुस्तोत्रं सम्पूर्णम्
    । महाभारत । भीष्मपर्व । अध्याय ६४
