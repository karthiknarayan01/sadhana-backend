id: padmavatikavacam-2
category: kavacha
name:
  english: padmavatikavacam 2
  devanagari: पद्मावतीकवचम् २
content:
  english: gurubhaktaya diyate || 2|| rajye deyam ca sarvasvam kavacam na prakashayet | gurubhaktaya datavyamanyatha
    siddhidam na hi || 3|| aim bijam | kli~ shaktih | hsau~ kilakam | padmavatiprityartha jape viniyogah
    | om parabrahmane namah shirasi | anushtupchando yo namah mukhe | shripadmavatishaktidevatayai namah
    hridaye | am bijaya nama kanthe | hrim shaktaye namah guhye | krau~ kilakaya namah padayoh | shripadmavatikavacasiddhyartham
    jape viniyogah || om padma bijam shirah patu lalatam pancami para | netre kamaprada patu mukham bhuvanasundari
    || 4|| nashikam naganathashca jihvam vagishvari tatha | shrutirupa jagaddhatri karau hrithimavasini
    || 5|| udaram mohadamani kundali nabhimandalam | parshva prishtham katim guhyam shaktisthananivasini
    || 6|| uru janghe tatha padau sarvavighnavinashini | raksha raksha mahamaye padme
  devanagari: गुरुभक्ताय दीयते ॥ २॥ राज्ये देयं च सर्वस्वं कवचं न प्रकाशयेत् । गुरुभक्ताय दातव्यमन्यथा
    सिद्धिदं न हि ॥ ३॥ ऐं बीजम् । क्लीँ शक्तिः । ह्सौँ कीलकम् । पद्मावतीप्रीत्यर्थ जपे विनियोगः । ॐ परब्रह्मणे
    नमः शिरसि । अनुष्टुप्छन्दो यो नमः मुखे । श्रीपद्मावतीशक्तिदेवतायै नमः हृदये । आं बीजाय नम कण्ठे ।
    ह्रीं शक्तये नमः गुह्ये । क्रौँ कीलकाय नमः पादयोः । श्रीपद्मावतीकवचसिद्ध्यर्थं जपे विनियोगः ॥ ॐ पद्मा
    बीजं शिरः पातु ललाटं पञ्चमी परा । नेत्रे कामप्रदा पातु मुखं भुवनसुन्दरी ॥ ४॥ नाशिकां नागनाथश्च जिह्वां
    वागीश्वरी तथा । श्रुतिरूपा जगद्धात्री करौ हृथिमवासिनी ॥ ५॥ उदरं मोहदमनी कुण्डली नाभिमण्डलम् । पार्श्व
    पृष्ठं कटिं गुह्यं शक्तिस्थाननिवासिनी ॥ ६॥ ऊरू जङ्घे तथा पादौ सर्वविघ्नविनाशिनी । रक्ष रक्ष महामाये
    पद्मे
