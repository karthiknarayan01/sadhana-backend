id: rakinikeshavasahasra
category: stotram
name:
  english: rakinikeshavasahasra
  devanagari: राकिणीकेशवसहस्र
content:
  english: rinu tam sakalam natha yatra shraddha sada tava | shravanartham bahuktam tat kripaya te vadamyaha
    || 13|| etat shravanamatrena sarvapapakshayo bhavet | rakinisangamam natha stavanam nama pavanam ||
    14|| ye pathanti shraddhaya cashraddhaya va punah punah | tasya sarvah paparashih kshayam yati kshanadiha
    || 15|| kale kale mahaviro bhavatyeva hi yogirat | samsarottarane yukto mahabalaparakramah || 16||
    om shrikrishno mahamaya yadavo devarakini | govindo vishvajanani mahavishnurmaheshvari || 17|| mukundo
    malati mala vimala vimalakritih | ramanatho mahadevi mahayogi prabhavati || 18|| vaikuntho devajanani
    dahano dahanapriya | daityarirdaityamathini munisho maunabhavita || 19|| narayano jayakala karuno
    karunamayi | hrishikeshah kaushiki ca keshavah keshighatini || 20|| kishorapi kaishori mahakali mahakala
    | mahayajno yajnahartri dakshesho dakshakanyaka || 21|| mahabali mahabala balako devabalika | cakradhari
    cakrakara cakrangah cakramadika || 22|| amaro yuvati bhimo bhaya devo divisthita | shrikaro veshada
    vaidyo guna yogi kulasthita || 23|| samayajno manasajna kriyavijnah kriyanvita | aksharo vanamala
    ca kalarupi kulakshara || 24|| vishalaksho dirghanetra jayado jayavahana | shantah shantikari shyamo
    vimalashyama vigraha || 25|| kamalesho mahalakshmi satyah sadhvi shishuh prabha | vidyutakaravadano
    vidyutpunjanabhodaya || 26|| radheshvaro rakini ca kuladevah kulamara | dakshino dakshini shrida kriyadaksho
    mahalaya || 27|| vashishthagamano vidya vidyesho vaksarasvati | atindriyo yogamata raneshi ranapandita
    || 28|| kritantako balakrishna kamaniyah sukamana | ananto anantagunada vaninatho vilakshana || 29||
    gopalo gopavanita gogopa kulatmaja | mauni maunakarollasa manavo manavatmaja || 30|| sarvacchinno
    mohini ca mayi maya shariraja | akshunno vajradehastha garudastho hi garudi || 31|| satyapriya rukmini
    ca satyaprano'mritapaha | satyakarma satyabhama satyarupi trisatyada || 32|| shashisho vidhuvadana
    krishnavarno vishaladhih | trivikramo vikramastha sthitimargah sthitipriya || 33|| shrimadhavo madhavi
    ca madhuha madhusudani | vaikunthanatho vikala vivekastho vivekini || 34|| vivadastho vivadeshi kumbhakah
    kumbhakarika | sudhapanah sudharupa suvesho devamohini || 35|| prakriyadharako dhanya dhanyartho dhanyavigraha
    | dharanisho mahananta sananto nandanapriya || 36|| priyo vipriyahara ca viprapujyo dvijapriya | kanto
    vidhumukhi vedyo vidya vagishvaro'runa || 37|| akami kamarahita kamro vilacarapriya | pundariko vikundastha
    vaikuntho balabhavini || 38|| padmanetra padmamala padmahasto'mbujanana | padmanabhih padmanetra padmasthah
    padmavahana || 39|| vasudevo brihadgarbha mahamani mahanjana | karunyo balagarbha ca akashastho vibhandaja
    || 40|| tejorashistaijasi ca bhayacchanno bhayaprada | upendro varnajalastha svatantrastho vimanaga
    || 41|| nagendrastho nagini ca nagesho naganandini | sarvabhaumo mahakali nagendrah nandinisuta ||
    42|| kamadevashrayo maya mitrastho mitravasana | manabhangakaro rava varanaripriyah priya || 43||
    ripuha rakini mata sumitro mitrarakshika | kalanta kalaha devi pitavasambarapriya || 44|| papaharta
    papahantri nishpapah papanashini | paranandapriyo mina minarupi malapaha || 45|| indranilamanishyamo
    mahendro nilarupini | nilakanthapriyo durga durgadurgatinashini || 46|| trikonamandirashrido vimaya
    mandirasthita | makarandarasollaso makarandarasapriya || 47|| darunarinihanta ca darunarivinashini
    | kalikalakulacarah kalikalaphalavaha || 48|| kalakshetrasthito raudri vratastho vratadharini | vishalaksho
    vishalasya camatkaro karodyama || 49|| lakarastho lakini ca langali lolayanvita | nakastho nakapadaka
    nakaksho nakarakshaka || 50|| kamago namasambandha samavedavishodhika | samavedah samasandhya samago
    mamsabhakshini || 51|| sarvabhaksho ratrabhaksha retastho retapalini | ratrikari maharatrih kalaratro
    mahanisha || 52|| nanadoshaharo matra marahanta surapaha | candanangi nandaputri nandapalah vilopini
    || 53|| mudrakari mahamudra mudrito mudrita ratih | shakto laksha vedalakshi lopamudra narottama ||
    54|| mahajnanadharo'jnani nira manaharo'mara | satkirtistho mahakirtih kulakhyo kulakirtita || 55||
    ashavasi vasana sa kulavetta sugopita | ashvatthavrikshanilayo vrikshasaranivasini || 56|| nityavriksho
    nityalata klriptah klriptapadasthitah | kalpavriksho kalpalata sukalah kalabhakshika || 57|| sarvalankarabhushadhyo
    sarvalankarabhushita | akalanki nirahara durnirikshyo nirapada || 58|| kamakarta kamakanta kamarupi
    mahajava | jayanto yajayanti ca jayakhya jayadayini || 59|| trijivano jivamata kushalakhyo visundara
    | keshadhari keshini ca kamajo kamajadyada || 60|| kinkarastho vikarastha manasamjno manishini | mithyaharo
    mahamithya mithyasargo nirakriti || 61|| nagayajnopavitashca nagamalavibhushita | nagakhyo nagakulapa
    nayako nayika vadhuh || 62|| nayakakshemado nari naro narayanapriya | kiratavarno rasajni tarako gunatarika
    || 63|| shankarakhyo'mbujakara kripanah kripanavati | deshago deshasantosha darsho darshanivasini
    || 64|| darshanajno darshanastha drig dridiksha suro'surah | surapalo devaraksha triraksho rakshadevata
    || 65|| shriramasevi sukhada sukhado vyasavasini | vrindavanastho vrinda ca vrindavanyo mahattanu
    || 66|| brahmarupi tritari ca tarakaksho hi tarini | tantrarthajnah tantravidya sutantrajnah sutantrika
    || 67|| triptah sutripta lokanam tarpanastho vilasini | mayura mandirarato mathura mandire'mala ||
    68|| mandiro mandiradevi nirmayi mayasamhara | shrivatsahridayo vatsa vatsalo bhaktavatsala || 69||
    bhaktapriyo bhaktagamya bhakto bhaktih prabhuh prabha | jaro jara varo rava havirhema kshamah kshiti
    || 70|| kshonipo vijayollasa vijayojayarupini | jayadata datrijaya balipo balipalika || 71|| krishnamarjararupi
    ca krishnamarjararupini | ghotakastho hayastha ca gajago gajavahana || 72|| gajeshvaro gajadhara gajo
    garjanatatpara | gayasuro gayadevi gajadarpo gajapita || 73|| kamanaphalasiddhyarthi kamanaphalasiddhida
    | dharmadata dharmavidya mokshado mokshadayini || 74|| mokshashrayo mokshakartri nandagopala ishvari
    | shripatih shrimahakali kirano vayurupini || 75|| vayvahari vayunishtha vayubijayashasvini | jeta
    jayanti yagastho yagavidya shivah shiva || 76|| vasavo vasavasthi ca vasakhyo dhanavigraha | akhandalo
    vikhanda ca khandastho khandakhanjani || 77|| khadgahasto banahasta banago banavahana | siddhantajno
    dhvantahantri dhanastho dhanyavarddhini || 78|| lokanurago ragastha sthitah sthapakabhavana | sthanabhrashto'padastha
    ca sharaccandranibhanana || 79|| candrodayashcandravarna carucandro rucisthita | rucikari ruciprita
    racano racanasana || 80|| rajarajo rajakanya bhuvano bhuvanashraya | sarvajnah sarvatobhadra vacalo
    layadhatini || 81|| lingarupadharo linga kalingah kalakeshari | kevalanandarupakhyo nirvanamokshadayini
    || 82|| mahameghagadha mahanandarupa mahameghajalo mahaghorarupa | mahameghamalah sadakarapala mahameghamalamalalolakali
    || 83|| viyadvyapako vyapika sarvadehe mahashuraviro mahadharmavira | mahakalarupi mahacandarupa viveki
    madaiki kuleshah kuleshi || 84|| sumargi sugita shucisvo vinita maharko vitarka sutarko'vitarka |
    kritindro mahendri bhago bhagyacandra caturtho mahartha nagah kirticandra || 85|| vishishto maheshtirmanasvi
    sutushtirmahashaddalastho mahasuprakasha | galaccandradharamritasnigdhadeho galatkotisuryaprakashabhilasha
    || 86|| mahacandavego mahakundavegi maharundakhando mahamundakhanda | kulalabhramaccakrasarah prakara
    kulalo malaka racakraprasari || 87|| kulalakriyavan mahaghorakhandah kulalakramena bhramajnanakhanda
    | pratishthah pratishtha pratikshah pratiksha mahakhyo mahakhya sukalo'tidiksha || 88|| mahapancamacaratushtah
    praceshta mahapancama premaha kantaceshta | mahamattavesho mahamangaleshi sureshah kshapeshi varo
    dirghavesha || 89|| caro bahyanishtha carashcaruvarna kuladyo'kuladya yatiryagavadya | kulokapahanta
    mahamanahantri mahavishnuyogi mahavishnuyoga || 90|| kshitikshobhahanta kshitikshubdhabadha mahargho
    mahargha dhani rajyakarya | maharatri sandrandhakaraprakasho maharatri sandrandhakarapravesha || 91||
    mahabhimagambhirashabdaprashabdo mahabhimagambhirashabdapashabda | kula jnanadatri yamo yamayatra
    vashi sukshmaveshashvago namamatra || 92|| hiranyakshahanta mahashatruhantri vinashapriyo bananashapriya
    ca | mahadakinisho maharakinisho mahadakini sa maharakini sa || 93|| mukundo mahendro mahabhadracandra
    kshitityagakarta mahayogakartri | hito marahantri maheshesha indra gatikshobhabhavo mahabhavapunja
    || 94|| shashinam samuho vidhoh kotishaktih kadambashrito varamukhya satina | mahollasadata mahakalamata
    svayam sarvaputrah svayam lokaputri || 95|| mahapapahanta mahabhavabhartri harih kartiki kartiko devasena
    | jayapto vilipta kulapto ganapta suviryo sabhasha kshitisho'bhiyata || 96|| bhavan bhavalakshmih
    priyah premasukshma janesho dhaneshi kripo manabhanga | kathorotkatanam mahabuddhidata kritistha gunajno
    gunanandavijna || 97|| mahakalapujyo mahakalapujya khagakhyo nagakhya kharah khadgahasta | atharvo'tharvandolitasthah
    mahartha khagakshobhanasha havih kutahala || 98|| mahapadma maladhrito ganapatya ganastho gabhira
    guruh jnanagamya | ghatapranadata ghanakararupa bhayarthonabijanavarinakarta || 99|| bhavo bhavamata
    naro yamadhyata calanto'calakhya cayo'njalika ca | chalajnashchaladhya chakarashchakara jayo jivanastha
    jalesho jalesha || 100|| japanjapakari jagajjivanisha jagatprananatho jagadahladakari | jharo jharjharisha
    jhanatkarashabdo jhananjhanjananadajhankararava || 101|| nacaitanyakari nakaivalyanari hanollasadhari
    tanattankahasta | tharesho pavishtashthakaradikoti daro dakinisho daresho damara || 102|| dhamesho
    hi dhakka varasthanabijo navarna tamalatanuh sthananishtha | thakararnamanasthanistho'samkhya dayavan
    dayardra dhanesho dhanadhya || 103|| navino nagebhagatirnangaharo nageshi parah parani sadipala |
    phalatma phala phalguni phenanashah phalabhushanadhya vashi vasaramya || 104|| bhagatma bhavastri
    mahabijamano mahabijamala mukundah susukshma | yatistha yashastha ratanandakarta ratirlakinisho layartha
    pracanda || 105|| pravalangadhari pravalangamala halohalahelapadah padatala | vashindrah prakasho
    varasthanavasa shivah shridharangah shalaka shila ca || 106|| shadadharavasi shadadharavidya shadambhojasamsthah
    shadabjopavishta | sada sadharogropavishta'paragi susuktapayastha palashrayasthita || 107|| harasthograkarma
    haranandadhara laghustho lipistha kshayikshubdhaka samkhya | ananto nirvanaharakarabija urastho'pyurustha
    ura urdhvarupa || 108|| ricastho hi rigalaso dirghalristha tvameko hi caimbijagurvi gunastha | sadaunkaravarna
    hsaumkarabija asankaracandro hyusah karavira || 109|| harindro harisha harih krishnarupa shivo vedabhasha
    ca shaurih prasanga | ganadhyaksharupi paranandabhaksha paresho ganeshi raso vasapujya || 110|| cakori
    kulapranabuddhisthitistha svayam kamadhenusvarupi virupa | shrihiranyaprabhah shri hiranyaprabhangi
    prabhatarkavarno'runakaranangi || 111|| vibha kotidhara dharadhara kosha ranisho pratyadikuto'dharo
    dharana shaurirarya | mahayajnasamstho mahayajnanishtha sadakarmasangah sadamangaranga || 112|| kiratipati
    rakini kalaputri shilakota nirmanadoha vishala | kalarkakalastho kalakinkinistha kishorah kishori
    kurukshetrakanya || 113|| mahalangalishri baloddhamakrishnah kulaladividya'bhayo bhavashunya | mahalakini
    kakini shakinisho mahasuprakasha paro hakinisha || 114|| kurukshetravasi kurupremamurtirmahabhutibhogi
    mahayogini ca | kulangarakaro kulangishakanya tritiyastritiya'dvitiyo'dvitiya || 115|| mahakandavasi
    mahanandakashi puragramavasi mahapithadesha | jagannatha vakshah sthalastho varenya cyutanandakarta
    rasanandakartri || 116|| jagaddipakalo jagaddipakali mahakamarupi mahakamapitha | mahakamapithasthiro
    bhutashuddhirmahabhutashuddhih mahabhutasiddhih || 117|| prabhantah pravina gurustho giristha galaddharadhari
    mahabhaktavesha | kshanakshunnivrittinivrittantaratma sadantargatastha layasthanagami || 118|| layanandakamya
    visargaptavargo vishalakshamarga kularnah kularna | manastha manahshrih bhayanandadata sada lanagita
    gajajnanadata mahamerupaya || 119|| tarormulavasi tarajnopadarsha sureshah sameshah suresha sukhi
    khadganishtha | bhayatranakarta bhayajnanahantri jananam makhastho makhanandabhanga || 120|| mahasatpathastho
    mahasatpathajna mahabindumano mahabindumana | khagendropavishto visargantarastha visargapravishto
    mahabindunada || 121|| sudhanandabhakto vidhanandamuktih shivanandasustho vinanandadhatri | mahavahanahladakari
    suvaha suranandakara giranandakari || 122|| hayanandakantih matangasthadevo matangadhidevi mahamattarupah
    | tadeko mahacakrapanih pracanda khilapasthalastho'vihamnishapatni || 123|| shikhanandakarta shikhasaravasi
    sushakambhari kroshtari vedavedisugandha | yugo yogakanya davo dirghakanya sharanyah sharanya munijnanagamya
    sudhanyah sudhanya || 124|| shashi vedajanya yami yamavama hyakamo hyakama sada gramakama | dhritishah
    dhritisha sada hatakastha' yanesho'yaneshi bhakaro bhagira || 125|| calatkhanjanasthah khalatkhelanastha
    vivati kirati khilango'khilangi | brihatkhecarastho brihatkhecari ca mahanagarajo mahanagamala ||
    126|| hakararddhasamjna vritoharamala mahakalanemipraha parvati ca | tamisra tamisravrito duhkhahatya
    vipanno vipanna gunanandakanya || 127|| sada duhkhahanta mahaduhkhahantri prabhatarka varnah prabhatarunashrih
    | mahaparvatapremabhavopapanno mahadevapatnishabhavopapanna || 128|| mahamokshanilapriya bhaktidata
    nayananda bhaktiprada devamata || 129|| ityetatkathitam natha mahastotram manoramam | sahasranamayoga'ngamashtottarasamanvitamam
    || 130|| yah pathet pratarutthaya shucirvashucimanasah | bhaktya shantimavapnoti anayasena yogirat
    || 131|| pratyaham dhyanamakritya trisandhyam yah pathet shucih | shanmasat paramo yogi satyam satyam
    sureshvara || 132|| akalamrityuharanam sarvavyadhivinashanam | apamrityvadiharanam varamekam pathedyadi
    || 133|| pathittva ye na gacchanti vipatkale mahanishi | anayasena te yanti mahaghore bhayarnave ||
    134|| akale yah pathennityam sukalastatkshanadbhavet | rajasvaharane caiva suvrittiharanadike || 135||
    masaikapathanadeva rajasvam sa labhed dhruvam | vicaranti mahavirah svarge martye rasatale || 136||
    ganeshatulyavalino mahakrodhasharirinah | etatstotraprasadena jivanmukto mahitale || 137|| mahanamastotrasaram
    dharmadharmanirupanam | akasmat siddhidam kamyam kamyam paramasiddhidam || 138|| mahakulakundalinyah
    bhavanyah sadhane shubhe | abhedyabhedane caiva mahapatakanashane || 139|| mahaghoratare kale pathitva
    siddhimapnuyat | shatcakrastambhanam natha pratyaham yah karoti hi || 140|| manogatistasya haste sa
    shivo na tu manushah | yogabhyasam yah karoti na stavah pathyate yadi || 141|| yogabhrashto bhavet
    kshipram kulacaravilanghanat | kulinaya pradatavyam na khalvakuleshvaram || 142|| kulacaram samakritya
    brahmanah kshatriyadayah | yoginah prabhavantyeva stotrapathat sadamarah || 143|| anandabhairava uvaca
    vada kante rahasyam me maya sarvanca vismritam | mahavisham kalakutam pittva devadirakshanat || 144||
    kanthasthah devatah sarva bhasmibhutah susambhritah | mahavishajvalaya ca mama dehasthadevatah ||
    145|| kaivalyaniratah sarve prarthayanti nirantaram | shatcakram kathayitva tu santosham me kuru prabho
    | shatcakrabhedakathanamamritashravanadikam || 146|| kathitva mama santosham kuru kalyani vallabhe
    | amritanandajaladhau sudhabhih siktavigraham || 147|| krittva kathaya shighram me cayusham parivardhaya
    | anandabhairavi uvaca nigudhartha mahakala kalesha jagadishvara || 148|| bhairavanandanilaya kalakutanishevana
    | idanim sha
  devanagari: ृणु तं सकलं नाथ यत्र श्रद्धा सदा तव । श्रवणार्थं बहूक्तं तत् कृपया ते वदाम्यह ॥ १३॥ एतत्
    श्रवणमात्रेण सर्वपापक्षयो भवेत् । राकिणीसङ्गमं नाथ स्तवनं नाम पावनम् ॥ १४॥ ये पठन्ति श्रद्धया चाश्रद्धया
    वा पुनः पुनः । तस्य सर्वः पापराशिः क्षयं याति क्षणादिह ॥ १५॥ काले काले महावीरो भवत्येव हि योगिराट्
    । संसारोत्तारणे युक्तो महाबलपराक्रमः ॥ १६॥ ॐ श्रीकृष्णो महामाया यादवो देवराकिणी । गोविन्दो विश्वजननी
    महाविष्णुर्महेश्वरी ॥ १७॥ मुकुन्दो मालती माला विमला विमलाकृतिः । रमानाथो महादेवी महायोगी प्रभावती
    ॥ १८॥ वैकुण्ठो देवजननी दहनो दहनप्रिया । दैत्यारिर्दैत्यमथिनी मुनीशो मौनभाविता ॥ १९॥ नारायणो जयकला
    करुणो करुणामयी । हृषीकेशः कौशिकी च केशवः केशिघातिनी ॥ २०॥ किशोरापि कैशोरी महाकाली महाकला । महायज्ञो
    यज्ञहर्त्री दक्षेशो दक्षकन्यका ॥ २१॥ महाबली महाबाला बालको देवबालिका । चक्रधारी चक्रकरा चक्राङ्गः चक्रमदीका
    ॥ २२॥ अमरो युवती भीमो भया देवो दिविस्थिता । श्रीकरो वेशदा वैद्यो गुणा योगी कुलस्थिता ॥ २३॥ समयज्ञो
    मानसज्ञा क्रियाविज्ञः क्रियान्विता । अक्षरो वनमाला च कालरूपी कुलाक्षरा ॥ २४॥ विशालाक्षो दीर्घनेत्रा
    जयदो जयवाहना । शान्तः शान्तिकरी श्यामो विमलश्याम विग्रहा ॥ २५॥ कमलेशो महालक्ष्मी सत्यः साध्वी शिशुः
    प्रभा । विद्युताकारवदनो विद्युत्पुञ्जनभोदया ॥ २६॥ राधेश्वरो राकिणी च कुलदेवः कुलामरा । दक्षिणो दक्षिणी
    श्रीदा क्रियादक्षो महालया ॥ २७॥ वशिष्ठगमनो विद्या विद्येशो वाक्सरस्वती । अतीन्द्रियो योगमाता रणेशी
    रणपण्डिता ॥ २८॥ कृतान्तको बालकृष्णा कमनीयः सुकामना । अनन्तो अनन्तगुणदा वाणीनाथो विलक्षणा ॥ २९॥ गोपालो
    गोपवनिता गोगोप कुलात्मजा । मौनी मौनकरोल्लासा मानवो मानवात्मजा ॥ ३०॥ सर्वाच्छिन्नो मोहिनी च मायी माया
    शरीरजा । अक्षुण्णो वज्रदेहस्था गरुडस्थो हि गारुडी ॥ ३१॥ सत्यप्रिया रुक्मिणी च सत्यप्राणोऽमृतापहा ।
    सत्यकर्मा सत्यभामा सत्यरूपी त्रिसत्यदा ॥ ३२॥ शशीशो विधुवदना कृष्णवर्णो विशालधीः । त्रिविक्रमो विक्रमस्था
    स्थितिमार्गः स्थितिप्रिया ॥ ३३॥ श्रीमाधवो माधवी च मधुहा मधुसूदनी । वैकुण्ठनाथो विकला विवेकस्थो विवेकिनी
    ॥ ३४॥ विवादस्थो विवादेशी कुम्भकः कुम्भकारिका । सुधापानः सुधारूपा सुवेशो देवमोहिनी ॥ ३५॥ प्रक्रियाधारको
    धन्या धन्यार्थो धन्यविग्रहा । धरणीशो महानन्ता सानन्तो नन्दनप्रिया ॥ ३६॥ प्रियो विप्रियहरा च विप्रपूज्यो
    द्विजप्रिया । कान्तो विधुमुखी वेद्यो विद्या वागीश्वरोऽरुणा ॥ ३७॥ अकामी कामरहिता कम्रो विलचरप्रिया
    । पुण्डरीको विकुण्डस्था वैकुण्ठो बालभाविनी ॥ ३८॥ पद्मनेत्र पद्ममाला पद्महस्तोऽम्बुजानना । पद्मनाभिः
    पद्मनेत्रा पद्मस्थः पद्मवाहना ॥ ३९॥ वासुदेवो बृहद्गर्भा महामानी महाञ्जना । कारुण्यो बालगर्भा च आकाशस्थो
    विभाण्डजा ॥ ४०॥ तेजोराशिस्तैजसी च भयाच्छन्नो भयप्रदा । उपेन्द्रो वर्णजालस्था स्वतन्त्रस्थो विमानगा
    ॥ ४१॥ नगेन्द्रस्थो नागिनी च नगेशो नागनन्दिनी । सार्वभौमो महाकाली नगेन्द्रः नन्दिनीसुता ॥ ४२॥ कामदेवाश्रयो
    माया मित्रस्थो मित्रवासना । मानभङ्गकरो रावा वारणारिप्रियः प्रिया ॥ ४३॥ रिपुहा राकिणी माता सुमित्रो
    मित्ररक्षिका । कालान्त कलहा देवी पीतवासाम्बरप्रिया ॥ ४४॥ पापहर्ता पापहन्त्री निष्पापः पापनाशिनी ।
    परानन्दप्रियो मीना मीनरूपी मलापहा ॥ ४५॥ इन्द्रनीलमणिश्यामो महेन्द्रो नीलरूपिणी । नीलकण्ठप्रियो दुर्गा
    दुर्गादुर्गतिनाशिनी ॥ ४६॥ त्रिकोणमन्दिरश्रीदो विमाया मन्दिरस्थिता । मकरन्दरसोल्लासो मकरन्दरसप्रिया
    ॥ ४७॥ दारुणारिनिहन्ता च दारुणारिविनाशिनी । कलिकालकुलाचारः कलिकालफलावहा ॥ ४८॥ कालक्षेत्रस्थितो रौद्री
    व्रतस्थो व्रतधारिणी । विशालाक्षो विशालास्या चमत्कारो करोद्यमा ॥ ४९॥ लकारस्थो लाकिनी च लाङ्गली लोलयान्विता
    । नाकस्थो नाकपदका नाकाक्षो नाकरक्षका ॥ ५०॥ कामगो नामसम्बन्धा सामवेदविशोधिका । सामवेदः सामसन्ध्या सामगो
    मांसभक्षिणी ॥ ५१॥ सर्वभक्षो रात्रभक्षा रेतस्थो रेतपालिनी । रात्रिकारी महारात्रिः कालरात्रो महानिशा
    ॥ ५२॥ नानादोषहरो मात्रा मारहन्ता सुरापहा । चन्दनाङ्गी नन्दपुत्री नन्दपालः विलोपिनी ॥ ५३॥ मुद्राकारी
    महामुद्रा मुद्रितो मुद्रिता रतिः । शाक्तो लाक्षा वेदलाक्षी लोपामुद्रा नरोत्तमा ॥ ५४॥ महाज्ञानधरोऽज्ञानी
    नीरा मानहरोऽमरा । सत्कीर्तीस्थो महाकीर्तीः कुलाख्यो कुलकीर्तीता ॥ ५५॥ आशावासी वासना सा कुलवेत्ता सुगोपिता
    । अश्वत्थवृक्षनिलयो वृक्षसारनिवासिनी ॥ ५६॥ नित्यवृक्षो नित्यलता क्लृप्तः क्लृप्तपदस्थितः । कल्पवृक्षो
    कल्पलता सुकालः कालभक्षिका ॥ ५७॥ सर्वालङ्कारभूषाढ्यो सर्वालङ्कारभूषिता । अकलङ्की निराहारा दुर्नीरीक्ष्यो
    निरापदा ॥ ५८॥ कामकर्ता कामकान्ता कामरूपी महाजवा । जयन्तो याजयन्ती च जयाख्य जयदायिनी ॥ ५९॥ त्रिजीवनो
    जीवमाता कुशलाख्यो विसुन्दरा । केशधारी केशिनी च कामजो कामजाड्यदा ॥ ६०॥ किङ्करस्थो विकारस्था मानसंज्ञो
    मनीषिणी । मिथ्याहरो महामिथ्या मिथ्यासर्गो निराकृति ॥ ६१॥ नागयज्ञोपवीतश्च नागमालाविभूषिता । नागाख्यो
    नागकुलपा नायको नायिका वधूः ॥ ६२॥ नायकक्षेमदो नारी नरो नारायणप्रिया । किरातवर्णो रासज्ञी तारको गुणतारिका
    ॥ ६३॥ शङ्कराख्योऽम्बुजाकारा कृपणः कृपणावती । देशगो देशसन्तोषा दर्शो दर्शनिवासिनी ॥ ६४॥ दर्शनज्ञो दर्शनस्था
    दृग् दृदिक्षा सुरोऽसुराः । सुरपालो देवरक्षा त्रिरक्षो रक्षदेवता ॥ ६५॥ श्रीरामसेवी सुखदा सुखदो व्यासवासिनी
    । वृन्दावनस्थो वृन्दा च वृन्दावन्यो महत्तनू ॥ ६६॥ ब्रह्मरूपी त्रितारी च तारकाक्षो हि तारिणी । तन्त्रर्थज्ञः
    तन्त्रविद्या सुतन्त्रज्ञः सुतन्त्रिका ॥ ६७॥ तृप्तः सुतृप्ता लोकानां तर्पणस्थो विलासिनी । मयूरा मन्दिररतो
    मथुरा मन्दिरेऽमला ॥ ६८॥ मन्दिरो मन्दिरादेवी निर्मायी मायसंहरा । श्रीवत्सहृदयो वत्सा वत्सलो भक्तवत्सला
    ॥ ६९॥ भक्तप्रियो भक्तगम्या भक्तो भक्तिः प्रभुः प्रभा । जरो जरा वरो रावा हविर्हेमा क्षमः क्षिति ॥ ७०॥
    क्षोणीपो विजयोल्लासा विजयोजयरूपिणी । जयदाता दातृजाया बलिपो बलिपालिका ॥ ७१॥ कृष्णमार्जाररूपी च कृष्णमार्जाररूपिणी
    । घोटकस्थो हयस्था च गजगो गजवाहना ॥ ७२॥ गजेश्वरो गजाधारा गजो गर्जनतत्परा । गयासुरो गयादेवी गजदर्पो
    गजापीता ॥ ७३॥ कामनाफलसिद्ध्यर्थी कामनाफलसिद्धिदा । धर्मदाता धर्मविद्या मोक्षदो मोक्षदायिनी ॥ ७४॥ मोक्षाश्रयो
    मोक्षकर्त्री नन्दगोपाल ईश्वरी । श्रीपतिः श्रीमहाकाली किरणो वायुरूपिणी ॥ ७५॥ वाय्वाहारी वायुनिष्ठा
    वायुबीजयशस्विनी । जेता जयन्ती यागस्थो यागविद्या शिवः शिवा ॥ ७६॥ वासवो वासवस्थी च वासाख्यो धनविग्रहा
    । आखण्डलो विखण्डा च खण्डस्थो खण्डखञ्जनी ॥ ७७॥ खड्गहस्तो बाणहस्ता बाणगो बाणवाहना । सिद्धान्तज्ञो ध्वान्तहन्त्री
    धनस्थो धान्यवर्द्धीनी ॥ ७८॥ लोकानुरागो रागस्था स्थितः स्थापकभावना । स्थानभ्रष्टोऽपदस्था च शरच्चन्द्रनिभानना
    ॥ ७९॥ चन्द्रोदयश्चन्द्रवर्णा चारुचन्द्रो रुचिस्थिता । रुचिकारी रुचिप्रीता रचनो रचनासना ॥ ८०॥ राजराजो
    राजकन्या भुवनो भुवनाश्रया । सर्वज्ञः सर्वतोभद्रा वाचालो लयधातिनी ॥ ८१॥ लिङ्गरूपधरो लिङ्गा कलिङ्गः
    कालकेशरी । केवलानन्दरूपाख्यो निर्वाणमोक्षदायिनी ॥ ८२॥ महामेघगाढ महानन्दरूपा महामेघजालो महाघोररूपा
    । महामेघमालः सदाकारपाला महामेघमालामलालोलकाली ॥ ८३॥ वियद्व्यापको व्यापिका सर्वदेहे महाशूरवीरो महाधर्मवीरा
    । महाकालरूपी महाचण्डरूपा विवेकी मदैकी कुलेशः कुलेशी ॥ ८४॥ सुमार्गी सुगीता शुचिस्वो विनिता महार्को
    वितर्का सुतर्कोऽवितर्का । कृतीन्द्रो महेन्द्री भगो भाग्यचन्द्रा चतुर्थो महार्था नगः कीर्तीचन्द्रा
    ॥ ८५॥ विशिष्टो महेष्टिर्मनस्वी सुतुष्टिर्महाषड्दलस्थो महासुप्रकाशा । गलच्चन्द्रधारामृतस्निग्धदेहो
    गलत्कोटिसूर्यप्रकाशाभिलाषा ॥ ८६॥ महाचण्डवेगो महाकुण्डवेगी महारुण्डखण्डो महामुण्डखण्डा । कुलालभ्रमच्चक्रसारः
    प्रकारा कुलालो मलाका रचक्रप्रसारी ॥ ८७॥ कुलालक्रियावान् महाघोरखण्डः कुलालक्रमेण भ्रमज्ञानखण्डा । प्रतिष्ठः
    प्रतिष्ठा प्रतीक्षः प्रतीक्षा महाख्यो महाख्या सुकालोऽतिदीक्षा ॥ ८८॥ महापञ्चमाचारतुष्टः प्रचेष्टा महापञ्चमा
    प्रेमहा कान्तचेष्टा । महामत्तवेशो महामङ्गलेशी सुरेशः क्षपेशी वरो दीर्घवेशा ॥ ८९॥ चरो बाह्यनिष्ठा चरश्चारुवर्णा
    कुलाद्योऽकुलाद्या यतिर्यागवाद्या । कुलोकापहन्ता महामानहन्त्री महाविष्णुयोगी महाविष्णुयोगा ॥ ९०॥ क्षितिक्षोभहन्ता
    क्षितिक्षुब्धबाधा महार्घो महार्घा धनी राज्यकार्या । महारात्रि सान्द्रान्धकारप्रकाशो महारात्रि सान्द्रान्धकारप्रवेशा
    ॥ ९१॥ महाभीमगम्भीरशब्दप्रशब्दो महाभीमगम्भीरशब्दापशब्दा । कुला ज्ञानदात्री यमो यामयात्रा वशी सूक्ष्मवेशाश्वगो
    नाममात्रा ॥ ९२॥ हिरण्याक्षहन्ता महाशत्रुहन्त्री विनाशप्रियो बाणनाशप्रिया च । महाडाकिनीशो महाराकिणीशो
    महाडाकिनी सा महाराकिणी सा ॥ ९३॥ मुकुन्दो महेन्द्रो महाभद्रचन्द्रा क्षितित्यागकर्ता महायोगकर्त्री ।
    हितो मारहन्त्री महेशेश इन्द्रा गतिक्षोभभावो महाभावपुञ्जा ॥ ९४॥ शशीनां समूहो विधोः कोटिशक्तिः कदम्बाश्रितो
    वारमुख्या सतीना । महोल्लासदाता महाकालमाता स्वयं सर्वपुत्रः स्वयं लोकपुत्री ॥ ९५॥ महापापहन्ता महाभावभर्त्री
    हरिः कार्तीकी कार्तीको देवसेना । जयाप्तो विलिप्ता कुलाप्तो गणाप्ता सुवीर्यो सभाषा क्षितीशोऽभियाता
    ॥ ९६॥ भवान् भावलक्ष्मीः प्रियः प्रेमसूक्ष्मा जनेशो धनेशी कृपो मानभङ्गा । कठोरोत्कटानां महाबुद्धिदाता
    कृतिस्था गुणज्ञो गुणानन्दविज्ञा ॥ ९७॥ महाकालपूज्यो महाकालपूज्या खगाख्यो नगाख्या खरः खड्गहस्ता । अथर्वोऽथर्वान्दोलितस्थः
    महार्था खगक्षोभनाशा हविः कूटहाला ॥ ९८॥ महापद्म मालाधृतो गाणपत्या गणस्थो गभीरा गुरुः ज्ञानगम्या । घटप्राणदाता
    घनाकाररूपा भयार्थोङबीजाङवारीङकर्ता ॥ ९९॥ भवो भावमाता नरो यामध्याता चलान्तोऽचलाख्या चयोऽञ्जालिका च
    । छलज्ञश्छलाढ्या छकारश्छकारा जयो जीवनस्था जलेशो जलेशा ॥ १००॥ जपञ्जापकारी जगज्जीवनीशा जगत्प्राणनाथो
    जगदाह्लादकारी । झरो झर्झरीशा झनत्कारशब्दो झनञ्झञ्जनानादझङ्काररावा ॥ १०१॥ ञचैतन्यकारी ञकैवल्यनारी हनोल्लासधारी
    टनत्टङ्कहस्ता । ठरेशो पविष्टश्ठकारादिकोटी डरो डाकिनीशो डरेशो डमारा ॥ १०२॥ ढमेशो हि ढक्का वरस्थानबीजो
    णवर्णा तमालतनुः स्थाननिष्ठा । थकारार्णमानस्थनिस्थोऽसंख्या दयावान् दयार्द्रा धनेशो धनाढ्या ॥ १०३॥ नवीनो
    नगेभागतीर्णाङ्गहारो नगेशी परः पारणी सादिपाला । फलात्मा फला फाल्गुनी फेणनाशः फलाभूषणाढ्या वशी वासरम्या
    ॥ १०४॥ भगात्मा भवस्त्री महाबीजमानो महाबीजमाला मुकुन्दः सुसूक्ष्मा । यतिस्था यशस्था रतानन्दकर्ता रतिर्लाकिनीशो
    लयार्थ प्रचण्डा ॥ १०५॥ प्रवालाङ्गधारी प्रवालाङ्गमाला हलोहालहेलापदः पादताला । वशीन्द्रः प्रकाशो वरस्थानवासा
    शिवः श्रीधराङ्गः शलाका शिला च ॥ १०६॥ षडाधारवासी षडाधारविद्या षडाम्भोजसंस्थः षडब्जोपविष्टा । सदा साधरोग्रोपविष्टाऽपरागी
    सुसूक्तापयस्था पलाश्रयस्थिता ॥ १०७॥ हरस्थोग्रकर्मा हरानन्दधारा लघुस्थो लिपिस्था क्षयीक्षुब्धक संख्या
    । अनन्तो निर्वाणाहराकारबीजा उरस्थोऽप्युरुस्था उरा ऊर्ध्वरूपा ॥ १०८॥ ऋचस्थो हि ॠगालसो दीर्घलृस्था त्वमेको
    हि चैम्बीजगुर्वी गुणस्था । सदौङ्कारवर्णा ह्सौंकारबीजा असङ्कारचन्द्रो ह्युसः कारवीरा ॥ १०९॥ हरीन्द्रो
    हरीशा हरिः कृष्णरूपा शिवो वेदभाषा च शौरिः प्रसङ्गा । गणाध्यक्षरूपी परानन्दभक्षा परेशो गणेशी रसो वासपूज्या
    ॥ ११०॥ चकोरि कुलप्राणबुद्धिस्थितिस्था स्वयं कामधेनुस्वरूपी विरूपा । श्रीहिरण्यप्रभः श्री हिरण्यप्रभाङ्गी
    प्रभातार्कवर्णोऽरुणाकारणाङ्गी ॥ १११॥ विभा कोटिधारा धराधार कोषा रणीशो प्रत्यादिकूटोऽधरो धारणा शौरिरार्या
    । महायज्ञसंस्थो महायज्ञनिष्ठा सदाकर्मसङ्गः सदामङ्गरङ्गा ॥ ११२॥ किरातीपति राकिणी कालपुत्री शिलाकोट
    निर्माणदोहा विशाला । कलार्ककलस्थो कलाकिङ्किणीस्था किशोरः किशोरी कुरुक्षेत्रकन्या ॥ ११३॥ महालाङ्गलिश्री
    बलोद्धामकृष्णः कुलालादिविद्याऽभयो भावशून्या । महालाकिनी काकिनी शाकिनीशो महासुप्रकाशा परो हाकिनीशा
    ॥ ११४॥ कुरुक्षेत्रवासी कुरुप्रेममूर्तीर्महाभूतिभोगी महायोगिनी च । कुलाङ्गारकारो कुलाङ्गीशकन्या तृतीयस्तृतीयाऽद्वितीयोऽद्वितीया
    ॥ ११५॥ महाकन्दवासी महानन्दकाशी पुरग्रामवासी महापीठदेशा । जगन्नाथ वक्षः स्थलस्थो वरेण्या च्युतानन्दकर्ता
    रसानन्दकर्त्री ॥ ११६॥ जगद्दीपकलो जगद्दीपकाली महाकामरूपी महाकामपीठा । महाकामपीठस्थिरो भूतशुद्धिर्महाभूतशुद्धिः
    महाभूतसिद्धिः ॥ ११७॥ प्रभान्तः प्रवीणा गुरुस्थो गिरिस्था गलद्धारधारी महाभक्तवेषा । क्षणक्षुन्निवृत्तिनीवृत्तान्तरात्मा
    सदन्तर्गतस्था लयस्थानगामी ॥ ११८॥ लयानन्दकाम्या विसर्गाप्तवर्गो विशालाक्षमार्गा कुलार्णः कुलार्णा ।
    मनस्था मनःश्रीः भयानन्ददाता सदा लाणगीता गजज्ञानदाता महामेरुपाया ॥ ११९॥ तरोर्मूलवासी तरज्ञोपदर्शा सुरेशः
    समेशः सुरेशा सुखी खड्गनिष्ठा । भयत्राणकर्ता भयज्ञानहन्त्री जनानां मखस्थो मखानन्दभङ्गा ॥ १२०॥ महासत्पथस्थो
    महासत्पथज्ञा महाबिन्दुमानो महाबिन्दुमाना । खगेन्द्रोपविष्टो विसर्गान्तरस्था विसर्गप्रविष्टो महाबिन्दुनादा
    ॥ १२१॥ सुधानन्दभक्तो विधानन्दमुक्तिः शिवानन्दसुस्थो विनानन्दधात्री । महावाहनाह्लादकारी सुवाहा सुरानन्दकारा
    गिरानन्दकारी ॥ १२२॥ हयानन्दकान्तिः मतङ्गस्थदेवो मतङ्गाधिदेवी महामत्तरूपः । तदेको महाचक्रपाणिः प्रचण्डा
    खिलापस्थलस्थोऽविहम्नीशपत्नी ॥ १२३॥ शिखानन्दकर्ता शिखासारवासी सुशाकम्भरी क्रोष्टरी वेदवेदीसुगन्धा ।
    युगो योगकन्या दवो दीर्घकन्या शरण्यः शरण्या मुनिज्ञानगम्या सुधन्यः सुधन्या ॥ १२४॥ शशी वेदजन्या यमी
    यामवामा ह्यकामो ह्यकामा सदा ग्रामकामा । धृतीशः धृतीशा सदा हाटकस्थाऽ यनेशोऽयनेशी भकारो भगीरा ॥ १२५॥
    चलत्खञ्जनस्थः खलत्खेलनस्था विवाती किराती खिलाङ्गोऽखिलाङ्गी । बृहत्खेचरस्थो बृहत्खेचरी च महानागराजो
    महानागमाला ॥ १२६॥ हकारार्द्धसंज्ञा वृतोहारमाला महाकालनेमिप्रहा पार्वती च । तमिस्रा तमिस्रावृतो दुःखहत्या
    विपन्नो विपन्ना गुणानन्दकन्या ॥ १२७॥ सदा दुःखहन्ता महादुःखहन्त्री प्रभातार्क वर्णः प्रभातारुणश्रीः
    । महापर्वतप्रेमभावोपपन्नो महादेवपत्नीशभावोपपन्ना ॥ १२८॥ महामोक्षनीलप्रिया भक्तिदाता नयानन्द भक्तिप्रदा
    देवमाता ॥ १२९॥ इत्येतत्कथितं नाथ महास्तोत्रं मनोरमम् । सहस्रनामयोगाऽङ्गमष्टोत्तरसमन्वितमम् ॥ १३०॥
    यः पठेत् प्रातरुत्थाय शुचिर्वाशुचिमानसः । भक्त्या शान्तिमवाप्नोति अनायासेन योगिराट् ॥ १३१॥ प्रत्यहं
    ध्यानमाकृत्य त्रिसन्ध्यं यः पठेत् शुचिः । षण्मासात् परमो योगी सत्यं सत्यं सुरेश्वर ॥ १३२॥ अकालमृत्युहरणं
    सर्वव्याधिविनाशनम् । अपमृत्य्वादिहरणं वारमेकं पठेद्यदि ॥ १३३॥ पठित्त्वा ये न गच्छन्ति विपत्काले महानिशि
    । अनायासेन ते यान्ति महाघोरे भयार्णवे ॥ १३४॥ अकाले यः पठेन्नित्यं सुकालस्तत्क्षणाद्भवेत् । राजस्वहरणे
    चैव सुवृत्तिहरणादिके ॥ १३५॥ मासैकपठनादेव राजस्वं स लभेद् ध्रुवम् । विचरन्ति महावीराः स्वर्गे मर्त्ये
    रसातले ॥ १३६॥ गणेशतुल्यवलिनो महाक्रोधशरीरिणः । एतत्स्तोत्रप्रसादेन जीवन्मुक्तो महीतले ॥ १३७॥ महानामस्तोत्रसारं
    धर्माधर्मनिरूपणम् । अकस्मात् सिद्धिदं काम्यं काम्यं परमसिद्धिदम् ॥ १३८॥ महाकुलकुण्डलिन्याः भवान्याः
    साधने शुभे । अभेद्यभेदने चैव महापातकनाशने ॥ १३९॥ महाघोरतरे काले पठित्वा सिद्धिमाप्नुयात् । षट्चक्रस्तम्भनं
    नाथ प्रत्यहं यः करोति हि ॥ १४०॥ मनोगतिस्तस्य हस्ते स शिवो न तु मानुषः । योगाभ्यासं यः करोति न स्तवः
    पठ्यते यदि ॥ १४१॥ योगभ्रष्टो भवेत् क्षिप्रं कुलाचारविलङ्घनात् । कुलीनाय प्रदातव्यं न खल्वकुलेश्वरम्
    ॥ १४२॥ कुलाचारं समाकृत्य ब्राह्मणाः क्षत्रियादयः । योगिनः प्रभवन्त्येव स्तोत्रपाठात् सदामराः ॥ १४३॥
    आनन्दभैरव उवाच वद कान्ते रहस्यं मे मया सर्वञ्च विस्मृतम् । महाविषं कालकूटं पीत्त्वा देवादिरक्षणात्
    ॥ १४४॥ कण्ठस्थाः देवताः सर्वा भस्मीभूताः सुसम्भृताः । महाविषज्वालया च मम देहस्थदेवताः ॥ १४५॥ कैवल्यनिरताः
    सर्वे प्रार्थयन्ति निरन्तरम् । षट्चक्रं कथयित्वा तु सन्तोषं मे कुरु प्रभो । षट्चक्रभेदकथनममृतश्रवणादिकम्
    ॥ १४६॥ कथित्वा मम सन्तोषं कुरु कल्याणि वल्लभे । अमृतानन्दजलधौ सुधाभिः सिक्तविग्रहम् ॥ १४७॥ कृत्त्वा
    कथय शीघ्रं मे चायुषं परिवर्धय । आनन्दभैरवी उवाच निगूढार्थ महाकाल कालेश जगदीश्वर ॥ १४८॥ भैरवानन्दनिलय
    कालकूटनिषेवण । इदानीं श
