id: rajarajeshvaristava
category: stotram
name:
  english: rajarajeshvaristava
  devanagari: राजराजेश्वरीस्तव
content:
  english: tyambeti tripureshvariti vacasam vagvadinityannada | ityevam pravadanti sadhumatayah svanandabodhojjvalah
    tam vande hridayatrikonanilayam shrirajarajeshvarim || 3|| ya pratah shikhimandale munijanairgauri
    samaradhyate ya madhye divasasya bhanurucira candamshumadhye param | ya sayam shashirupini himarucermadhye
    trisandhyatmika tam vande hridayatrikonanilayam shrirajarajeshvarim || 4|| ya mulotthitanadasantatilavaih
    samstuyate yogibhih ya purnendukalamritaih kulapathe samsicyate santatam | ya bandhatrayakumbhitonmanipathe
    siddhyashtakenedyate tam vande hridayatrikonanilayam shrirajarajeshvarim || 5|| ya mukasya kavitvavarshanasudhakadambini
    shrikari ya lakshmitanayasya jivanakari sanjivinividyaya | ya dronipuranayika dvijashishoh stanyapradatri
    muda tam vande hridayatrikonanilayam shrirajarajeshvarim || 6|| ya vishvaprabhavadikaryajanani brahmadimurtyatmana
    ya candrarkashikhiprabhasanakari svatmaprabhasattaya | ya sattvadigunatrayeshu samatasamvitpradatri
    satam tam vande hridayatrikonanilayam shrirajarajeshvarim || 7|| ya kshityantashivaditattvavilasatsphurtisvarupa
    param ya brahmandakatahabharanivahanmandukavishvambhari | ya vishvam nikhilam caracaramayam vyapya
    sthita santatam tam vande hridayatrikonanilayam shrirajarajeshvarim || 8|| ya vargashtakavarnapanjarashuki
    vidyaksharalapini nityanandapayo'numodanakari shyama manoharini | satyanandacidishvarapranayini svargapavargaprada
    tam vande hridayatrikonanilayam shrirajarajeshvarim || 9|| ya shrutyantasushuktisamputamahamuktaphalam
    sattvikam saccitsaukhyapayodavrishtiphalitam sarvatmana sundaram | nirmulyam nikhilarthadam nirupamakaram
    bhavahladadam tam vande hridayatrikonanilayam shrirajarajeshvarim || 10|| ya nityavratamandalastutapada
    nityarcanatatpara nityanityavimarshini kulagurorvavayaprakashatmika | krityakrityamatiprabhedashamani
    katsnaryatmalabhaprada tam vande hridayatrikonanilayam shrirajarajeshvarim || 11|| yamuddishya yajanti
    shuddhamatayo nityam paragnau sruca matya pranaghritaplutendriyacarudravyaih samantraksharaih | yatpadambujabhaktidardhyasurasapraptyai
    budhah santatam tam vande hridayatrikonanilayam shrirajarajeshvarim || 12|| ya samvinmakarandapushpalatikasvanandadeshotthita
    satsantanasuveshtanatirucira shreyahphalam tanvati | nirdhutakhilavrittibhaktadhishanabhringanganasevita
    tam vande hridayatrikonanilayam shrirajarajeshvarim || 13|| yamaradhya munirbhavabdhimatarat kleshormijalavritam
    yam dhyatva na nivartate shivapadanandabdhimagnah param | yam smritva svapadaikabodhamayate sthule'pi
    dehe janah tam vande hridayatrikonanilayam shrirajarajeshvarim || 14|| yapashankushacapasayakakara
    candrardhacudalasat kancidamavibhushita smitamukhi mandaramaladhara | nilendivaralocana shubhakari
    tyagadhirajeshvari tam vande hridayatrikonanilayam shrirajarajeshvarim || 15|| ya bhakteshu dadati
    santatasukham vanim ca lakshmim tatha saundaryam nigamagamarthakavitam satputrasampatsukham | satsangam
    sukalatratam suvinayam sayujyamuktim param tam vande hridayatrikonanilayam shrirajarajeshvarim ||
    16|| ityanandanathapadapapadmopajivina kashyapagotrotpannenandhrena tyagarajanamna viracitah shrirajarajeshvaristavah
    sampurnah ||
  devanagari: त्यम्बेति त्रिपुरेश्वरीति वचसां वाग्वादिनीत्यन्नदा । इत्येवं प्रवदन्ति साधुमतयः स्वानन्दबोधोज्ज्वलाः
    तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ ३॥ या प्रातः शिखिमण्डले मुनिजनैर्गौरी समाराध्यते
    या मध्ये दिवसस्य भानुरुचिरा चण्डांशुमध्ये परम् । या सायं शशिरूपिणी हिमरुचेर्मध्ये त्रिसन्ध्यात्मिका
    तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ ४॥ या मूलोत्थितनादसन्ततिलवैः संस्तूयते योगिभिः या
    पूर्णेन्दुकलामृतैः कुलपथे संसिच्यते सन्ततम् । या बन्धत्रयकुम्भितोन्मनिपथे सिद्ध्यष्टकेनेड्यते तां
    वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ ५॥ या मूकस्य कवित्ववर्षणसुधाकादम्बिनी श्रीकरी या लक्ष्मीतनयस्य
    जीवनकरी सञ्जीविनीविद्यया । या द्रोणीपुरनायिका द्विजशिशोः स्तन्यप्रदात्री मुदा तां वन्दे हृदयत्रिकोणनिलयां
    श्रीराजराजेश्वरीम् ॥ ६॥ या विश्वप्रभवादिकार्यजननी ब्रह्मादिमूर्त्यात्मना या चन्द्रार्कशिखिप्रभासनकरी
    स्वात्मप्रभासत्तया । या सत्त्वादिगुणत्रयेषु समतासंवित्प्रदात्री सतां तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम्
    ॥ ७॥ या क्षित्यन्तशिवादितत्त्वविलसत्स्फूर्तिस्वरूपा परं या ब्रह्माण्डकटाहभारनिवहन्मण्डूकविश्वम्भरी
    । या विश्वं निखिलं चराचरमयं व्याप्य स्थिता सन्ततं तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥
    ८॥ या वर्गाष्टकवर्णपञ्जरशुकी विद्याक्षरालापिनी नित्यानन्दपयोऽनुमोदनकरी श्यामा मनोहारिणी । सत्यानन्दचिदीश्वरप्रणयिनी
    स्वर्गापवर्गप्रदा तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ ९॥ या श्रुत्यन्तसुशुक्तिसम्पुटमहामुक्ताफलं
    सात्त्विकं सच्चित्सौख्यपयोदवृष्टिफलितं सर्वात्मना सुन्दरम् । निर्मूल्यं निखिलार्थदं निरुपमाकारं भवाह्लाददं
    तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ १०॥ या नित्याव्रतमण्डलस्तुतपदा नित्यार्चनातत्परा
    नित्यानित्यविमर्शिनी कुलगुरोर्वावयप्रकाशात्मिका । कृत्याकृत्यमतिप्रभेदशमनी कात्स्नर्यात्मलाभप्रदा
    तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ ११॥ यामुद्दिश्य यजन्ति शुद्धमतयो नित्यं पराग्नौ स्रुचा
    मत्या प्राणघृतप्लुतेन्द्रियचरुद्रव्यैः समन्त्राक्षरैः । यत्पादाम्बुजभक्तिदार्ढ्यसुरसप्राप्त्यै बुधाः
    सन्ततं तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ १२॥ या संविन्मकरन्दपुष्पलतिकास्वानन्ददेशोत्थिता
    सत्सन्तानसुवेष्टनातिरुचिरा श्रेयःफलं तन्वती । निर्धूताखिलवृत्तिभक्तधिषणाभृङ्गाङ्गनासेविता तां वन्दे
    हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ १३॥ यामाराध्य मुनिर्भवाब्धिमतरत् क्लेशोर्मिजालावृतं यां ध्यात्वा
    न निवर्तते शिवपदानन्दाब्धिमग्नः परम् । यां स्मृत्वा स्वपदैकबोधमयते स्थूलेऽपि देहे जनः तां वन्दे हृदयत्रिकोणनिलयां
    श्रीराजराजेश्वरीम् ॥ १४॥ यापाषाङ्कुशचापसायककरा चन्द्रार्धचूडालसत् काञ्चीदामविभूषिता स्मितमुखी मन्दारमालाधरा
    । नीलेन्दीवरलोचना शुभकरी त्यागाधिराजेश्वरी तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ १५॥ या
    भक्तेषु ददाति सन्ततसुखं वाणीं च लक्ष्मीं तथा सौन्दर्यं निगमागमार्थकवितां सत्पुत्रसम्पत्सुखम् । सत्सङ्गं
    सुकलत्रतां सुविनयं सयुज्यमुक्तिं परां तां वन्दे हृदयत्रिकोणनिलयां श्रीराजराजेश्वरीम् ॥ १६॥ इत्यानन्दनाथपादपपद्मोपजीविना
    काश्यपगोत्रोत्पन्नेनान्ध्रेण त्यागराजनाम्ना विरचितः श्रीराजराजेश्वरीस्तवः सम्पूर्णः ॥
