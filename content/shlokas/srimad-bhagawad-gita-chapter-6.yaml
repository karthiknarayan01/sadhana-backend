id: srimad-bhagawad-gita-chapter-6
category: stotram
name:
  english: Srimad Bhagawad Gita Chapter 6
content:
  english: om shri paramatmane namah atha shashtho'dhyayah | atmasamyamayogah shribhagavanuvaca anashritah
    karmaphalam karyam karma karoti yah | sa sannyasi ca yogi ca na niragnirna cakriyah || || yam sannyasamiti
    prahuryogam tam viddhi pandava | na hyasannyastasankalpo yogi bhavati kashcana || || arurukshormuneryogam
    karma karanamucyate | yogarudhasya tasyaiva shamah karanamucyate || || yada hi nendriyartheshu na
    karmasvanushajjate | sarvasankalpasannyasi yogarudhastadocyate || || uddharedatmanatmanam natmanamavasadayet
    | atmaiva hyatmano bandhuratmaiva ripuratmanah || || bandhuratmatmanastasya yenatmaivatmana jitah
    | anatmanastu shatrutve vartetatmaiva shatruvat || || jitatmanah prashantasya paramatma samahitah
    | shitoshnasukhaduhkheshu tatha manapamanayoh || || jnanavijnanatriptatma kutastho vijitendriyah |
    yukta ityucyate yogi samaloshtashmakancanah || || suhrinmitraryudasinamadhyasthadveshyabandhushu |
    sadhushvapi ca papeshu samabuddhirvishishyate || || yogi yunjita satatamatmanam rahasi sthitah | ekaki
    yatacittatma nirashiraparigrahah || || shucau deshe pratishthapya sthiramasanamatmanah | natyucchritam
    natinicam cailajinakushottaram || || tatraikagram manah kritva yatacittendriyakriyah | upavishyasane
    yunjyadyogamatmavishuddhaye || || samam kayashirogrivam dharayannacalam sthirah | samprekshya nasikagram
    svam dishashcanavalokayan || || prashantatma vigatabhirbrahmacarivrate sthitah | manah samyamya maccitto
    yukta asita matparah || || yunjannevam sadatmanam yogi niyatamanasah | shantim nirvanaparamam matsamsthamadhigacchati
    || || natyashnatastu yogo'sti na caikantamanashnatah | na catisvapnashilasya jagrato naiva carjuna
    || || yuktaharaviharasya yuktaceshtasya karmasu | yuktasvapnavabodhasya yogo bhavati duhkhaha || ||
    yada viniyatam cittamatmanyevavatishthate | nihsprihah sarvakamebhyo yukta ityucyate tada || || yatha
    dipo nivatastho nengate sopama smrita | yogino yatacittasya yunjato yogamatmanah || || yatroparamate
    cittam niruddham yogasevaya | yatra caivatmanatmanam pashyannatmani tushyati || || sukhamatyantikam
    yattadbuddhigrahyamatindriyam | vetti yatra na caivayam sthitashcalati tattvatah || || yam labdhva
    caparam labham manyate nadhikam tatah | yasminsthito na duhkhena gurunapi vicalyate || || tam vidyadduhkhasamyogaviyogam
    yogasanjnitam | sa nishcayena yoktavyo yogo'nirvinnacetasa || || sankalpaprabhavankamamstyaktva sarvanasheshatah
    | manasaivendriyagramam viniyamya samantatah || || shanaih shanairuparamedbuddhya dhritigrihitaya
    | atmasamstham manah kritva na kincidapi cintayet || || yato yato nishcarati manashcancalamasthiram
    | tatastato niyamyaitadatmanyeva vasham nayet || || prashantamanasam hyenam yoginam sukhamuttamam
    | upaiti shantarajasam brahmabhutamakalmasham || || yunjannevam sadatmanam yogi vigatakalmashah |
    sukhena brahmasamsparshamatyantam sukhamashnute || || sarvabhutasthamatmanam sarvabhutani catmani
    | ikshate yogayuktatma sarvatra samadarshanah || || yo mam pashyati sarvatra sarvam ca mayi pashyati
    | tasyaham na pranashyami sa ca me na pranashyati || || sarvabhutasthitam yo mam bhajatyekatvamasthitah
    | sarvatha vartamano'pi sa yogi mayi vartate || || atmaupamyena sarvatra samam pashyati yo'rjuna |
    sukham va yadi va duhkham sa yogi paramo matah || || arjuna uvaca yo'yam yogastvaya proktah samyena
    madhusudana | etasyaham na pashyami cancalatvatsthitim sthiram || || cancalam hi manah krishna pramathi
    balavaddridham | tasyaham nigraham manye vayoriva sudushkaram || || shribhagavanuvaca asamshayam mahabaho
    mano durnigraham calam | abhyasena tu kaunteya vairagyena ca grihyate || || asamyatatmana yogo dushprapa
    iti me matih | vashyatmana tu yatata shakyo'vaptumupayatah || || arjuna uvaca ayatih shraddhayopeto
    yogaccalitamanasah | aprapya yogasamsiddhim kam gatim krishna gacchati || || kaccinnobhayavibhrashtashchinnabhramiva
    nashyati | apratishtho mahabaho vimudho brahmanah pathi || || etanme samshayam krishna chettumarhasyasheshatah
    | tvadanyah samshayasyasya chetta na hyupapadyate || || shribhagavanuvaca partha naiveha namutra vinashastasya
    vidyate | na hi kalyanakritkashciddurgatim tata gacchati || || prapya punyakritam lokanushitva shashvatih
    samah | shucinam shrimatam gehe yogabhrashto'bhijayate || || athava yoginameva kule bhavati dhimatam
    | etaddhi durlabhataram loke janma yadidrisham || || tatra tam buddhisamyogam labhate paurvadehikam
    | yatate ca tato bhuyah samsiddhau kurunandana || || purvabhyasena tenaiva hriyate hyavasho'pi sah
    | jijnasurapi yogasya shabdabrahmativartate || || prayatnadyatamanastu yogi samshuddhakilbishah |
    anekajanmasamsiddhastato yati param gatim || || tapasvibhyo'dhiko yogi jnanibhyo'pi mato'dhikah |
    karmibhyashcadhiko yogi tasmadyogi bhavarjuna || || yoginamapi sarvesham madgatenantaratmana | shraddhavanbhajate
    yo mam sa me yuktatamo matah || || om tatsaditi shrimadbhagavadgitasupanishatsu brahmavidyayam yogashastre
    shrikrishnarjunasamvade atmasamyamayogo nama shashtho'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ षष्ठोऽध्यायः । आत्मसंयमयोगः श्रीभगवानुवाच अनाश्रितः कर्मफलं कार्यं
    कर्म करोति यः । स सन्न्यासी च योगी च न निरग्निर्न चाक्रियः ॥ ॥ यं सन्न्यासमिति प्राहुर्योगं तं विद्धि
    पाण्डव । न ह्यसन्न्यस्तसङ्कल्पो योगी भवति कश्चन ॥ ॥ आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते । योगारूढस्य
    तस्यैव शमः कारणमुच्यते ॥ ॥ यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते । सर्वसङ्कल्पसन्न्यासी योगारूढस्तदोच्यते
    ॥ ॥ उद्धरेदात्मनात्मानं नात्मानमवसादयेत् । आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ॥ ॥ बन्धुरात्मात्मनस्तस्य
    येनात्मैवात्मना जितः । अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ॥ ॥ जितात्मनः प्रशान्तस्य परमात्मा
    समाहितः । शीतोष्णसुखदुःखेषु तथा मानापमानयोः ॥ ॥ ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः । युक्त
    इत्युच्यते योगी समलोष्टाश्मकाञ्चनः ॥ ॥ सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु । साधुष्वपि च पापेषु
    समबुद्धिर्विशिष्यते ॥ ॥ योगी युञ्जीत सततमात्मानं रहसि स्थितः । एकाकी यतचित्तात्मा निराशीरपरिग्रहः
    ॥ ॥ शुचौ देशे प्रतिष्ठाप्य स्थिरमासनमात्मनः । नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम् ॥ ॥ तत्रैकाग्रं
    मनः कृत्वा यतचित्तेन्द्रियक्रियाः । उपविश्यासने युञ्ज्याद्योगमात्मविशुद्धये ॥ ॥ समं कायशिरोग्रीवं
    धारयन्नचलं स्थिरः । सम्प्रेक्ष्य नासिकाग्रं स्वं दिशश्चानवलोकयन् ॥ ॥ प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते
    स्थितः । मनः संयम्य मच्चित्तो युक्त आसीत मत्परः ॥ ॥ युञ्जन्नेवं सदात्मानं योगी नियतमानसः । शान्तिं
    निर्वाणपरमां मत्संस्थामधिगच्छति ॥ ॥ नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः । न चातिस्वप्नशीलस्य
    जाग्रतो नैव चार्जुन ॥ ॥ युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु । युक्तस्वप्नावबोधस्य योगो भवति दुःखहा
    ॥ ॥ यदा विनियतं चित्तमात्मन्येवावतिष्ठते । निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा ॥ ॥ यथा दीपो
    निवातस्थो नेङ्गते सोपमा स्मृता । योगिनो यतचित्तस्य युञ्जतो योगमात्मनः ॥ ॥ यत्रोपरमते चित्तं निरुद्धं
    योगसेवया । यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति ॥ ॥ सुखमात्यन्तिकं यत्तद्बुद्धिग्राह्यमतीन्द्रियम्
    । वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः ॥ ॥ यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः । यस्मिन्स्थितो
    न दुःखेन गुरुणापि विचाल्यते ॥ ॥ तं विद्याद्दुःखसंयोगवियोगं योगसञ्ज्ञितम् । स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा
    ॥ ॥ सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः । मनसैवेन्द्रियग्रामं विनियम्य समन्ततः ॥ ॥ शनैः शनैरुपरमेद्बुद्ध्या
    धृतिगृहीतया । आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत् ॥ ॥ यतो यतो निश्चरति मनश्चञ्चलमस्थिरम् ।
    ततस्ततो नियम्यैतदात्मन्येव वशं नयेत् ॥ ॥ प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम् । उपैति शान्तरजसं
    ब्रह्मभूतमकल्मषम् ॥ ॥ युञ्जन्नेवं सदात्मानं योगी विगतकल्मषः । सुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते
    ॥ ॥ सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि । ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः ॥ ॥ यो मां पश्यति
    सर्वत्र सर्वं च मयि पश्यति । तस्याहं न प्रणश्यामि स च मे न प्रणश्यति ॥ ॥ सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः
    । सर्वथा वर्तमानोऽपि स योगी मयि वर्तते ॥ ॥ आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन । सुखं वा यदि वा
    दुःखं स योगी परमो मतः ॥ ॥ अर्जुन उवाच योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन । एतस्याहं न पश्यामि
    चञ्चलत्वात्स्थितिं स्थिराम् ॥ ॥ चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम् । तस्याहं निग्रहं मन्ये वायोरिव
    सुदुष्करम् ॥ ॥ श्रीभगवानुवाच असंशयं महाबाहो मनो दुर्निग्रहं चलम् । अभ्यासेन तु कौन्तेय वैराग्येण च
    गृह्यते ॥ ॥ असंयतात्मना योगो दुष्प्राप इति मे मतिः । वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः ॥ ॥ अर्जुन
    उवाच अयतिः श्रद्धयोपेतो योगाच्चलितमानसः । अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति ॥ ॥ कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव
    नश्यति । अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि ॥ ॥ एतन्मे संशयं कृष्ण छेत्तुमर्हस्यशेषतः । त्वदन्यः
    संशयस्यास्य छेत्ता न ह्युपपद्यते ॥ ॥ श्रीभगवानुवाच पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते । न हि
    कल्याणकृत्कश्चिद्दुर्गतिं तात गच्छति ॥ ॥ प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः । शुचीनां श्रीमतां
    गेहे योगभ्रष्टोऽभिजायते ॥ ॥ अथवा योगिनामेव कुले भवति धीमताम् । एतद्धि दुर्लभतरं लोके जन्म यदीदृशम्
    ॥ ॥ तत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम् । यतते च ततो भूयः संसिद्धौ कुरुनन्दन ॥ ॥ पूर्वाभ्यासेन
    तेनैव ह्रियते ह्यवशोऽपि सः । जिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते ॥ ॥ प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः
    । अनेकजन्मसंसिद्धस्ततो याति परां गतिम् ॥ ॥ तपस्विभ्योऽधिको योगी ज्ञानिभ्योऽपि मतोऽधिकः । कर्मिभ्यश्चाधिको
    योगी तस्माद्योगी भवार्जुन ॥ ॥ योगिनामपि सर्वेषां मद्गतेनान्तरात्मना । श्रद्धावान्भजते यो मां स मे
    युक्ततमो मतः ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासूपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे
    आत्मसंयमयोगो नाम षष्ठोऽध्यायः ॥
