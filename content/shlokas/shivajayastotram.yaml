id: shivajayastotram
category: stotram
name:
  english: shivajayastotram
  devanagari: शिवजयस्तोत्रम्
content:
  english: jaya hemasabhapate | jaya sthano pashupate jaya vinalasatkara || 41|| jaya vyaghrajinadhara
    jaya vyaghranghrisevita | jaya saptarshivinuta jaya diptashiroruha || 42|| jaya vipravarakara jaya
    kshipravaraprada | jaya karmadidurastha jaya dharmabhritam vara || 43|| jaya sugunasandoha jaya nirgunavallabha
    | jaya vamangarahita jaya bhamangadayaka || 44|| jaya kshayakarajanda jaya dhyeya mahamate | jaya
    janmajarahina jaya sanmanasamsthita || 45|| jaya trilingahinanga jaya shrilingapujita | jaya tankagadahasta
    jaya shankara dhurjate || 46|| jaya lingashariraghna jaya samsargakovida | jaya tapatrayaccheda jaya
    rupatrayatmaka || 47|| jaya datritvanipuna jaya matrikayadrita | jaya mandarasadbhusha jaya vandarunandita
    || 48|| jaya vanikritastotra jaya manikyakundala | jaya padmarcitapada jaya padmarunaprabha || 49||
    jaya hamsagra sukhada jaya samsarataraka | jaya kalyanapurusha jaya kalyanasantata || 50|| jaya kandalitananda
    jaya kundaradadyute | jaya mandasmitamukha jaya candanashitala || 51|| jaya vijnanavarashe jaya prajnanakalpaka
    | jaya trikala kalatman jaya kalatrayatiga || 52|| jaya sharva bhaveshana jaya sarvajna kamada | jaya
    bharga mahabaho jaya durgartinashana || 53|| jaya kalyanagirisha jaya samharakarana | jaya gokshiravarnanga
    jaya sakshijagattraya || 54|| jaya nityadikalita jayamaravararcita | jaya rauradridambhole jaya bhagikritacyuta
    || 55|| jayagresara vidhvamsin jaya grahavinashaka | jaya shantasuradhvamsin jaya kantaramadhyaga
    || 56|| jaya dandasurahara jaya mundasurantaka | jayeshtikasurahara jayeshtiphaladayaka || 57|| jaya
    kshemankara shiva jaya hemangadojjvala | jaya deva viradrupa jaya kaivalyavallabha || 58|| jaya dehatmamohana
    jaya mohanavigraha | jaya ksharaksharatita jaya ghorartikhandana || 59|| jaya ratnagrihavasa jaya
    ratnamayasana | jaya daurbhagyatulagne jaya garbhadhritakhila || 60|| jaya sancitadoshaghna jaya kancanadehaka
    | jaya vidrumatulyanghra jaya kadrusukharcita || 61|| jaya candapracandesha jaya dandadhanurdhara
    | jaya krurabhicaraghna jaya darasutanvita || 62|| jaya jimutasukhada jayabhumulamandira | jaya khanditapashanda
    jaya candagananvita || 63|| jaya prashantamahiman jaya koshottarasthita | jaya sarvamanudhyeya jaya
    sarvavashikrita || 64|| jaya purnadayadrishte jaya markandarakshaka | jayatha manyusuprita jaya satpadmabhaskara
    || 65|| jaya prapancanirmatarjaya sarva vidhayaka | jaya svatejasabhasa jaya lokaikapalaka || 66||
    jayagnindujaladityavyomanilamahimaya | jaya prakritimukhyesha jaya trigunakalpaka || 67|| jaya nirvyajakaruna
    jaya vidyadhinayaka | jayaparakripasindho jayacintyagunodaya || 68|| jaya shauryamahadhairya jaya
    dharmaikakarana | jaya brahmadikitanta vyaptasvacchandavigraha || 69|| jaya bhashapatishrisha jaya
    varnitavaibhava | jaya pralayasanjata jaya kalagnirudraka || 70|| jaya sankalpanamatravinirmitajagattraya
    | jaya shrishavidhindradya jaya sarvaniyojaka || 71|| jaya hinasamadhikya jaya vardhakyavarjita |
    jaya nilotpalashyama jaya varnavirajita || 72|| jaya karpuradhavala jaya carushubhakrite | jaya dhvajankushabhoga
    jaya cakralasatpada || 73|| jaya sauvarnavasana jaya rajatkatitata | jaya pinorujaghana jayarajitavishvapa
    || 74|| jaya muktaphalihara jaya vajrangadojjvala | jaya dighacaturbaho jaya kankanamandita || 75||
    jaya'bhitivaropeta jaya bahudvayanvita | jaya jvalanmahanila jaya bhushitasadgala || 76|| jaya sundara
    sasmera jaya vaktravirajita | jaya kundalavibhraja jaya kundalikundala || 77|| jaya campeyanasagra
    jaya bimbadharojjvala | jaya pavakacandrarka jaya locanabhushita || 78|| jaya kokanadodbhasa
  devanagari: जय हेमसभापते । जय स्थाणो पशुपते जय वीणालसत्कर ॥ ४१॥ जय व्याघ्राजिनधर जय व्याघ्राङ्घ्रिसेवित
    । जय सप्तर्षिविनुत जय दीप्तशिरोरुह ॥ ४२॥ जय विप्रवराकार जय क्षिप्रवरप्रद । जय कर्मादिदूरस्थ जय धर्मभृतां
    वर ॥ ४३॥ जय सुगुणसन्दोह जय निर्गुणवल्लभ । जय वामाङ्गरहित जय भामाङ्गदायक ॥ ४४॥ जय क्षयकराजाण्ड जय ध्येय
    महामते । जय जन्मजराहीन जय सन्मानसंस्थित ॥ ४५॥ जय त्रिलिङ्गहीनाङ्ग जय श्रीलिङ्गपूजित । जय टङ्कगदाहस्त
    जय शङ्कर धूर्जटे ॥ ४६॥ जय लिङ्गशरीरघ्न जय संसर्गकोविद । जय तापत्रयच्छेद जय रूपत्रयात्मक ॥ ४७॥ जय दातृत्वनिपुण
    जय मातृकयादृत । जय मन्दारसद्भूष जय वन्दारुनन्दित ॥ ४८॥ जय वाणीकृतस्तोत्र जय माणिक्यकुण्डल । जय पद्मार्चितपद
    जय पद्मारुणप्रभ ॥ ४९॥ जय हंसाग्र सुखद जय संसारतारक । जय कल्याणपुरुष जय कल्याणसन्तत ॥ ५०॥ जय कन्दलितानन्द
    जय कुन्दरदद्युते । जय मन्दस्मितमुख जय चन्दनशीतल ॥ ५१॥ जय विज्ञानवाराशे जय प्रज्ञानकल्पक । जय त्रिकाल
    कालात्मन् जय कालत्रयातिग ॥ ५२॥ जय शर्व भवेशान जय सर्वज्ञ कामद । जय भर्ग महाबाहो जय दुर्गार्तिनाशन
    ॥ ५३॥ जय कल्याणगिरिश जय संहारकारण । जय गोक्षीरवर्णाङ्ग जय साक्षिजगत्त्रय ॥ ५४॥ जय नित्यादिकलित जयामरवरार्चित
    । जय रौराद्रिदम्भोले जय भागीकृताच्युत ॥ ५५॥ जयाग्रेसर विध्वंसिन् जय ग्राहविनाशक । जय शान्तासुरध्वंसिन्
    जय कान्तारमध्यग ॥ ५६॥ जय दण्डासुरहर जय मुण्डासुरान्तक । जयेष्टिकासुरहर जयेष्टिफलदायक ॥ ५७॥ जय क्षेमङ्कर
    शिव जय हेमाङ्गदोज्ज्वल । जय देव विराड्रूप जय कैवल्यवल्लभ ॥ ५८॥ जय देहात्ममोहन जय मोहनविग्रह । जय क्षराक्षरातीत
    जय घोरार्तिखण्डन ॥ ५९॥ जय रत्नगृहावास जय रत्नमयासन । जय दौर्भाग्यतूलाग्ने जय गर्भधृताखिल ॥ ६०॥ जय
    सञ्चितदोषघ्न जय काञ्चनदेहक । जय विद्रुमतुल्याङ्घ्र जय कद्रुसुखार्चित ॥ ६१॥ जय चण्डप्रचण्डेश जय दण्डधनुर्धर
    । जय क्रूराभिचारघ्न जय दारसुतान्वित ॥ ६२॥ जय जीमूतसुखद जयभूमूलमन्दिर । जय खण्डितपाषण्ड जय चण्डगणान्वित
    ॥ ६३॥ जय प्रशान्तमहिमन् जय कोशोत्तरस्थित । जय सर्वमनुध्येय जय सर्ववशीकृत ॥ ६४॥ जय पूर्णदयादृष्टे जय
    मार्कण्डरक्षक । जयाथ मन्युसुप्रीत जय सत्पद्मभास्कर ॥ ६५॥ जय प्रपञ्चनिर्मातर्जय सर्व विधायक । जय स्वतेजसाभास
    जय लोकैकपालक ॥ ६६॥ जयाग्नीन्दुजलादित्यव्योमानिलमहीमय । जय प्रकृतिमुख्येश जय त्रिगुणकल्पक ॥ ६७॥ जय
    निर्व्याजकरुण जय विद्याधिनायक । जयापारकृपासिन्धो जयाचिन्त्यगुणोदय ॥ ६८॥ जय शौर्यमहाधैर्य जय धर्मैककारण
    । जय ब्रह्मादिकीटान्त व्याप्तस्वच्छन्दविग्रह ॥ ६९॥ जय भाषापतिश्रीश जय वर्णितवैभव । जय प्रलयसञ्जात
    जय कालाग्निरुद्रक ॥ ७०॥ जय सङ्कल्पनामात्रविनिर्मितजगत्त्रय । जय श्रीशविधीन्द्राद्य जय सर्वनियोजक ॥
    ७१॥ जय हीनसमाधिक्य जय वार्धक्यवर्जित । जय नीलोत्पलश्याम जय वर्णविराजित ॥ ७२॥ जय कर्पूरधवल जय चारुशुभाकृते
    । जय ध्वजाङ्कुशाभोग जय चक्रलसत्पद ॥ ७३॥ जय सौवर्णवसन जय राजत्कटीतट । जय पीनोरुजघन जयराजितविश्वप ॥
    ७४॥ जय मुक्ताफलीहार जय वज्राङ्गदोज्ज्वल । जय दीघचतुर्बाहो जय कङ्कणमण्डित ॥ ७५॥ जयाऽभीतिवरोपेत जय बाहुद्वयान्वित
    । जय ज्वलन्महानील जय भूषितसद्गल ॥ ७६॥ जय सुन्दर सस्मेर जय वक्त्रविराजित । जय कुण्डलविभ्राज जय कुण्डलिकुण्डल
    ॥ ७७॥ जय चाम्पेयनासाग्र जय बिम्बाधरोज्ज्वल । जय पावकचन्द्रार्क जय लोचनभूषित ॥ ७८॥ जय कोकनदोद्भास
