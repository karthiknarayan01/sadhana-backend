id: agastyashtakam
category: stotram
name:
  english: agastyashtakam
  devanagari: अगस्त्याष्टकम्
content:
  english: adya me saphalam janma cadya me saphalam tapah | adya me saphalam jnanam shambho tvatpadadarshanat
    || 1|| kritartho'ham kritartho'ham kritartho'ham maheshvara | adya te padapadmasya darshanatbhaktavatsala
    || 2|| shivashshambhuh shivashshambhuh shivashshambhuh shivashshivah | iti vyaharato nityam dinanyayantu
    yantu me || 3|| shive bhaktishshive bhaktishshive bhaktirbhavebhave | sada bhuyat sada bhuyatsada
    bhuyatsunishcala || 4|| ajanma maranam yasya mahadevanyadaivatam | majanishyata madvamshe jato va
    dragvipadyatam || 5|| jatasya jayamanasya garbhasthasya'pi dehinah | mabhunmama kule janma yasya shambhurna
  devanagari: अद्य मे सफलं जन्म चाद्य मे सफलं तपः । अद्य मे सफलं ज्ञानं शम्भो त्वत्पाददर्शनात् ॥ १॥ कृतार्थोऽहं
    कृतार्थोऽहं कृतार्थोऽहं महेश्वर । अद्य ते पादपद्मस्य दर्शनात्भक्तवत्सल ॥ २॥ शिवश्शम्भुः शिवश्शम्भुः
    शिवश्शम्भुः शिवश्शिवः । इति व्याहरतो नित्यं दिनान्यायान्तु यान्तु मे ॥ ३॥ शिवे भक्तिश्शिवे भक्तिश्शिवे
    भक्तिर्भवेभवे । सदा भूयात् सदा भूयात्सदा भूयात्सुनिश्चला ॥ ४॥ आजन्म मरणं यस्य महादेवान्यदैवतम् । माजनिष्यत
    मद्वंशे जातो वा द्राग्विपद्यताम् ॥ ५॥ जातस्य जायमानस्य गर्भस्थस्याऽपि देहिनः । माभून्मम कुले जन्म
    यस्य शम्भुर्न
meaning: {}
