id: maya-panchakam
category: stotram
name:
  english: Maya Panchakam
content:
  english: nirupamanityaniramshake'pyakhande mayi citi sarvavikalpanadishunye | ghatayati jagadishajivabhedam
    tvaghatitaghatanapatiyasi maya || || shrutishatanigamantashodhakana pyahaha dhanadinidarshanena sadyah
    | kalushayati catushpadadyabhinna naghatitaghatanapatiyasi maya || || sukhacidakhandavibodhamadvitiyam
    viyadanaladivinirmite niyojya | bhramayati bhavasagare nitantam tvaghatitaghatanapatiyasi maya ||
    || apagatagunavarnajatibhede sukhaciti vipravidadyahankritim ca | sphutayati sutadaragehamoham tvaghatitaghatanapatiyasi
    maya || || vidhihariharavibhedamapyakhande bata viracayya budhanapi prakamam | bhramayati hariharabhedabhava
    naghatitaghatanapatiyasi maya ||
  devanagari: निरुपमनित्यनिरंशकेऽप्यखण्डे मयि चिति सर्वविकल्पनादिशून्ये । घटयति जगदीशजीवभेदं त्वघटितघटनापटीयसी
    माया ॥ ॥ श्रुतिशतनिगमान्तशोधकान प्यहह धनादिनिदर्शनेन सद्यः । कलुषयति चतुष्पदाद्यभिन्ना नघटितघटनापटीयसी
    माया ॥ ॥ सुखचिदखण्डविबोधमद्वितीयं वियदनलादिविनिर्मिते नियोज्य । भ्रमयति भवसागरे नितान्तं त्वघटितघटनापटीयसी
    माया ॥ ॥ अपगतगुणवर्णजातिभेदे सुखचिति विप्रविडाद्यहङ्कृतिं च । स्फुटयति सुतदारगेहमोहं त्वघटितघटनापटीयसी
    माया ॥ ॥ विधिहरिहरविभेदमप्यखण्डे बत विरचय्य बुधानपि प्रकामम् । भ्रमयति हरिहरभेदभावा नघटितघटनापटीयसी
    माया ॥
