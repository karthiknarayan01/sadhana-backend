id: shivastotram-11
category: stotram
name:
  english: shivastotram 11
  devanagari: शिवस्तोत्रम् ११
content:
  english: '|| 3|| pavanakara pulapartigopalasakha govahana bhujangakulavibhusha | bhavabhavaharana mam
    palaya kripanidhe kovidastavapatra gumpapurisomesha || 4|| || iti shrishivastotram sampurnam ||'
  devanagari: ॥ ३॥ पावनाकार पुलपर्तिगोपालसख गोवाहन भुजङ्गकुलविभूष । भावभवहरण मां पालय कृपानिधे कोविदस्तवपात्र
    गुम्पपुरिसोमेश ॥ ४॥ ॥ इति श्रीशिवस्तोत्रं सम्पूर्णम् ॥
meaning: {}
