id: ekaksharopanishat
category: upanishad
name:
  english: ekaksharopanishat
  devanagari: एकाक्षरोपनिषत्
content:
  english: upanishad ekaksharopanishat ekaksharapadarudham sarvatmakamakhanditam | sarvavarjitacinmatram
    tripannarayanam bhaje || om saha navavatu saha nau bhunaktu | saha viryam karavavahai | tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om ekaksharam tvakshare'trasti some sushumnayam
    ceha dridhi sa ekah | tvam vishvabhurbhutapatih puranah parjanya eko bhuvanasya gopta || 1|| vishve
    nimagnapadavih kavinam tvam jatavedo bhuvanasya nathah | ajatamagre sa hiranyareta yajnaistvamevaikavibhuh
    puranah || 2|| pranah prasutirbhuvanasya yonirvyaptam tvaya ekapadena vishvam | tvam vishvabhuryoniparah
    svagarbhe kumara eko vishikhah sudhanva || 3|| vitatya banam tarunarkavarnam vyomantare bhasi hiranyagarbhah
    | bhasa tvaya vyomni kritah sutarkshyastavam vai kumarastvamarishtanemih || 4|| tvam vajrabhridbhutapatistvameva
    kamah prajanam nihito'si some | svaha svadha yacca vashat karoti rudrah pashunam guhaya nimagnah ||
    5|| dhata vidhata pavanah suparno vishnurvaraho rajani rahashca | bhutam bhavishyatprabhavah kriyashca
    kalah kramastvam paramaksharam ca || 6|| rico yajumshi prasavanti vaktratsamani samradvasuvantariksham
    | tvam yajnaneta hutabhugvibhushca rudrastatha daityagana vasushca || 7|| sa esha devo'mbaragashca
    cakre anye'bhyadhishtheta tamo nirundhyah | hiranmayam yasya vibhati sarvam vyomantare rashmimivamshunabhih
    || 8|| sa sarvavetta bhuvanasya gopta tabhih prajanam nihita jananam | prota tvamota vicitih kramanam
    prajapatishchandamayo vigarbhah || 9|| samaishcidanto virajashca bahum hiranmayam vedavidam varishtham
    | yamadhvare brahmavidah stuvanti samairyajurbhih kratubhistvameva || 10|| tvam stri pumamstvam ca
    kumara ekastvam vai kumari hyatha bhustvameva | tvameva dhata varunashca raja tvam vatsaro'gnyaryama
    eva sarvam || 11|| mitrah suparnashcandra indro rudrastvashta vishnuh savita gopatistvam | tvam vishnurbhutani
    tu trasi daityamstvayavritam jagadudbhavagarbhah || 12|| tvam bhurbhuvah svastvam hi svayambhuratha
    vishvatomukhah | ya evam nityam vedayate guhashayam prabhum puranam sarvabhutam hiranmayam || 13||
    hiranmayam buddhimatam param gatim sa buddhimanbuddhimatitya tishthatityupanishat || om saha navavatu
    saha nau bhunaktu | saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih
    shantih shantih || ityekaksharopanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् एकाक्षरोपनिषत् एकाक्षरपदारूढं सर्वात्मकमखण्डितम् । सर्ववर्जितचिन्मात्रं त्रिपान्नारायणं
    भजे ॥ ॐ सह नाववतु सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ एकाक्षरं त्वक्षरेऽत्रास्ति सोमे सुषुम्नायां चेह दृढी स एकः । त्वं विश्वभूर्भूतपतिः
    पुराणः पर्जन्य एको भुवनस्य गोप्ता ॥ १॥ विश्वे निमग्नपदवीः कवीनां त्वं जातवेदो भुवनस्य नाथः । अजातमग्रे
    स हिरण्यरेता यज्ञैस्त्वमेवैकविभुः पुराणः ॥ २॥ प्राणः प्रसूतिर्भुवनस्य योनिर्व्याप्तं त्वया एकपदेन
    विश्वम् । त्वं विश्वभूर्योनिपारः स्वगर्भे कुमार एको विशिखः सुधन्वा ॥ ३॥ वितत्य बाणं तरुणार्कवर्णं
    व्योमान्तरे भासि हिरण्यगर्भः । भासा त्वया व्योम्नि कृतः सुतार्क्ष्यस्तवं वै कुमारस्त्वमरिष्टनेमिः
    ॥ ४॥ त्वं वज्रभृद्भूतपतिस्त्वमेव कामः प्रजानां निहितोऽसि सोमे । स्वाहा स्वधा यच्च वषट् करोति रुद्रः
    पशूनां गुहया निमग्नः ॥ ५॥ धाता विधाता पवनः सुपर्णो विष्णुर्वराहो रजनी रहश्च । भूतं भविष्यत्प्रभवः
    क्रियाश्च कालः क्रमस्त्वं परमाक्षरं च ॥ ६॥ ऋचो यजूंशि प्रसवन्ति वक्त्रात्सामानि सम्राड्वसुवन्तरिक्षम्
    । त्वं यज्ञनेता हुतभुग्विभुश्च रुद्रास्तथ दैत्यगणा वसुश्च ॥ ७॥ स एष देवोऽम्बरगश्च चक्रे अन्येऽभ्यधिष्ठेत
    तमो निरुन्ध्यः । हिरण्मयं यस्य विभाति सर्वं व्योमान्तरे रश्मिमिवांशुनाभिः ॥ ८॥ स सर्ववेत्ता भुवनस्य
    गोप्ता ताभिः प्रजानां निहिता जनानाम् । प्रोता त्वमोता विचितिः क्रमाणां प्रजापतिश्छन्दमयो विगर्भः ॥
    ९॥ सामैश्चिदन्तो विरजश्च बाहूं हिरण्मयं वेदविदां वरिष्ठम् । यमध्वरे ब्रह्मविदः स्तुवन्ति सामैर्यजुर्भिः
    क्रतुभिस्त्वमेव ॥ १०॥ त्वं स्त्री पुमांस्त्वं च कुमार एकस्त्वं वै कुमारी ह्यथ भूस्त्वमेव । त्वमेव
    धाता वरुणश्च राजा त्वं वत्सरोऽग्न्यर्यम एव सर्वम् ॥ ११॥ मित्रः सुपर्णश्चन्द्र इन्द्रो रुद्रस्त्वष्टा
    विष्णुः सविता गोपतिस्त्वम् । त्वं विष्णुर्भूतानि तु त्रासि दैत्यांस्त्वयावृतं जगदुद्भवगर्भः ॥ १२॥
    त्वं भूर्भुवः स्वस्त्वं हि स्वयम्भूरथ विश्वतोमुखः । य एवं नित्यं वेदयते गुहाशयं प्रभुं पुराणं सर्वभूतं
    हिरण्मयम् ॥ १३॥ हिरण्मयं बुद्धिमतां परां गतिं स बुद्धिमान्बुद्धिमतीत्य तिष्ठतीत्युपनिषत् ॥ ॐ सह नाववतु
    सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः
    ॥ इत्येकाक्षरोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
