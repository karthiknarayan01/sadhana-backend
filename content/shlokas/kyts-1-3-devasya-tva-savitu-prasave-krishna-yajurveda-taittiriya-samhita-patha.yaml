id: kyts-1-3-devasya-tva-savitu-prasave-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.3 Devasya Tva Savitu Prasave - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande tritiyah prashnah shri gurubhyo namah
    | harih om || devasya tva savituh prasave 'bhrirasi narirasi parilikhitagm rakshah parilikhita arataya
    idamahagm rakshaso griva api krintami yo ndvishma idamasya griva api krintami dive tva 'ntarikshaya
    tva prithivyai tva shundhatam lo~kah pitrishadano yavo yavayaratih pitrinagm sadanamasyuddivagg stabhana
    ndrigmha dyutanastva maruto minotu mitravarunayo rdhruvena dharmana brahmavani ntva kshatravanigm
    suprajavanigm rayasposhavani mparyuhami brahma drigmha kshatra ndrigmha rayasposha ndrigmha ghritena
    dyavaprithivi a prinethamindrasya sado 'si vishvajanasya chaya pari tva girvano gira ima bhavantu
    vishvato vriddhayumanu vriddhayo jushta bhavantu jushtaya indrasya syurasindrasya dhruvamasyaindramasindraya
    tva || rakshohano valagahano vaishnava nnah samano yamasamano nicakhanedamenamadhara nkaromi yo nah
    samano yo 'ratiyati gayatrena chandasa 'vabadho valagah kimatra bhadra ntannau saha viradasi sapatnaha
    samradasi bhratrivyaha svaradasyabhimatiha vishvaradasi vishvasa nnashtranagm hanta rakshohano valagahanah
    prokshami vaishnava nrakshohano valagahano 'va nayami vaishnavan yavo ddvesho yavayarati rakshohano
    valagahano 'va strinami vaishnava nrakshohano valagahano 'bhi juhomi vaishnava nrakshohanau valagahanavupa
    dadhami vaishnavi rakshohanau valagahanau paryuhami vaishnavi rakshohanau valagahanau pari strinami
    vaishnavi rakshohanau valagahanau vaishnavi brihannasi brihadgrava brihatimindraya vacam vibhurasi
    pravahano vahnirasi havyavahana 'si pracetastutho 'si vishvaveda ushigasi kavirangharirasi bambhariravasyurasi
    duvasvanchundhyurasi marjaliyah samradasi krishanuh parishadyo 'si pavamanah pratakva 'si nabhasvanasammrishto
    'si havyasuda ritadhama rbrahmajyotirasi suvardhama 'syekapadahirasi buddhniyo raudrenanikena pahi
    ma 'gne piprihi ma ma ma higmsih || tvagm soma tanukridbhyo dvesho 'nyakritebhya uru yanta 'si varuthagg
    svaha jushano apturajyasya vetu svaha 'yanno agnirvarivah krinotvaya mmridhah pura etu prabhindann
    | ayagm shatru njayatu vajasatau | uru vishno vi kramasvoru kshayaya nah kridhi | ghrita nghritayone
    piba prapra yajnapati ntira | somo jigati gatuvi ddevanameti nishkritamritasya yonimasadamaditya ssada
    a sidaisha vo deva savita ssomastagm rakshaddhva mma vo dabhadetattvagm soma devo devanupaga idamaha
    mmanushyo manushya thsaha prajaya saha rayasposhena namo devebhyah svadha pitribhya idamaha nnirvarunasya
    pasha vra~tapatirasi ya mama tanustvayyabhudiyagm sa mayi ya tava tanu rmayyabhudesha sa tvayi yathayatha
    nnanyanupagamarvaktva parairavida ntva jushe vaishnava ndevayajyayai devastva savita maddhva 'naktvoshadhe
    trayasvainagg svadhite mainagm higmsi rdivamagrena ma lekhirantariksha mmaddhyena ma higmsih prithivya
    sa mbhava vanaspate shataval sho vi roha sahasraval sha vi vayagm ruhema ya svadhitistetijanah praninaya
    mahate saubhagayacchinno rayah suvirah || prithivyai tvantarikshaya tva dive tva shundhatam lo~kah
    pitrishadano yavo ddvesho yavayaratih pitrinagm sadanamasi svavesho 'syagrega netrinam va~naspatiradhi
    tva sthasyati tasya vitta ddevastva savita maddhva 'naktu supippalabhya stvaushadhibhya uddivagg stabhana
    mprina prithivimuparena drigmha te te dhama gamaddhye gavo yatra bhurishringa ayasah | atraha tadurugayasya
    vishnoh mpadamava bhati bhureh || vishnoh karmani pashyata yato vratani paspashe | indrasya yujya
    mpadagm sada pashyanti surayah | diviva cakshuratatam || brahmavani ntva kshatravanigm suprajavanigm
    rayasposhavani mparyuhami brahma drigmha kshatra ndrigmha rayasposha ndrigmha parivirasi pari tva
    daivirvisho mparimagm rayasposho yajamana mmanushya antarikshasya tva sanavava guhami || kannavigmshatishca
    ishe tvopavirasyupo deva rvahnirushijo brihaspate dharaya vasuni havya te ndeva tvashtarvasu ranva
    revati ramaddhva rjanitramasi vrishanau stha urvashyasyayurasi pururava ghritenakte vrishana 'nu pra
    jayasva traishtubha 'nu pra jayasva bhavata ssamanasau samokasavarepasau | ma yajnagm higmsishta njatavedasau
    shivau bhavatamadya nah || agnavagnishcarati pravishta rishina mputro adhiraja eshah | svahakritya
    brahmana te juhomi ma devana mmithuya karbhagadheya a dada ritasya tva devahavih pashena sha manushanadbhyastvaushadhibhyah
    proksha mperurasi svatta thsadevagm havyamapo devi prano vayuna gacchatagm sam ya~jatrairangani sam
    ya~jnapatirashisha ghritenaktau pashu ntrayethagm revati '' vishatoro antariksha saju 'sya havishastmana
    yaja samasya tanuva bhava var shiyasi yajne yajnapati ssampricah pahi namasta atana 'narva prehi ghritasya
    kulyamanu saha prajaya saha rayasposhena ''po devi mparivishtah pariveshtaro vo bhuyasma || catushcatvarigmshacca
    mpranasta a pyayata ncakshusta a pyayatag shrotra prananchugjagama ya cakshurya shrotram ntatta etena
    shundhata nnabhista a pyayata mpayusta a pyayatagm shuddhashcaritra moshadhe trayasvainagg svadhite
    mainagm higmsi rakshasa ndvishma idamenamadhama ntamo nayamishe tva ghritena dyavaprithivi prornvatha
    macchinno rayah suvira urvantarikshamanvihi vayo vihi stokanag svahordhvanabhasa mpranena prano jushta
    thsvahaindrah prano angeange ni de ddhyadaindro 'pano angeange vi bobhuvaddeva tvashtarbhuri te sagmsametu
    vishurupa ya thsalakshmano bhavatha devatra yantamavase sakhayo 'nu tva mata pitaro madantu shrirasyagnistva
    tva dhrajyai pushno ragg hya apamoshadhinagm rohishyai ghrita nghritapavanah pibata vasam 'ntarikshasya
    havirasi svaha 'ntarikshaya dishah pradisha adisho vidisha uddisha ssvaha digbhyo namo digbhyah ||
    ngaccha svaha devagm savitara 'horatre gaccha svaha mitravarunau gaccha svaha soma ngaccha svaha yajna
    ngaccha svaha chandagmsi gaccha svaha dyavaprithivi gaccha svaha nabho divya 'dbhyastvaushadhibhyo
    mano me hardi yaccha tanu nnaptaramashiya shugasi tamabhi shoca yo ndvishmo dhamnodhamno rajannito
    varuna no munca yadapo aghniya varuneti shapamahe tato varuna no munca || havishmatirima apo havishma
    ndevo addhvaro havishmagm a vivasati havishmagm astu suryah || agnervo 'pannagrihasya sadasi sadayami
    sumnaya sumnini ssumne ma dhattendragniyo sstha mitravarunayo sstha yajne jagrita || hride tva manase
    tva dive tva suryaya tvordhvamimamaddhvara nkridhi divi deveshu hotra yaccha soma rajannehyava roha
    ma bherma sam vi~ktha ma tva higmsisha mprajastvamupavaroha prajastvamupavarohantu shrinotvagni mme
    shrinvantvapo dhishana shca devih | shrinota gravano vidusho nu yajnagm shrinotu deva mme | devirapo
    apa havishya indriyava ndevebhyo devatra dhatta shukragm shukrapebhyo yesha mmriddhragm samudrasya
    vo 'kshitya unnaye | yamagne prithsu martyamavo vajeshu ya njunah | sa yanta shashvatirishah || saptacatvarigmshacca
    tvamagne rudro asuro maho divastvagm shardho maruta mpriksha ishishe | tvam va~tairarunairyasi shangayastva
    mpusha vidhatah pasi nutmana || a vo rajanamaddhvarasya rudragm hotaragm satyayajagm rodasyoh | agni
    mpura tanayitno racittaddhiranyarupamavase krinuddhvam || agnir hota ni shasada yajiyanupasthe matu
    ssurabhavu loke | yuva kavih purunishtha ritava dharta krishtinamuta maddhya iddhah ||saddhvimaka
    nno adya yajnasya jihvamavidama guhya thsurabhirvasano bhadramaka nno adya || akrandadagni sstanayanniva
    dyauh kshama rerihadvirudhah samanjann | sadyo jajnano vi himiddho akhyada rodasi bhanuna bhatyantah
    || tve vasuni purvanika hotardosha vastorerire yajniyasah | kshameva vishva bhuvanani yasmin thsagm
    saubhagani dadhire pavake || tubhya nta angirastama vishva ssukshitayah prithak | agne kamaya yemire
    || ashyama ta nkamamagne tavotyashyama rayigm rayiva m | ashyama vajamabhi vajayanto 'shyama dyumnamajarajara
    || vaso purusprihagm rayim || sa shvitanastanyatu rocanastha ajarebhi rnanadadbhiryavishthah | yah
    pavakah purutamah puruni prithunyagniranuyati bharvann || ayushte vishvato dadhadayamagni nyah | punaste
    prana a 'yati para yakshmagm suvami te || ayurda agne havisho jushano ghritapratiko ghritayoniredhi
    | ghrita mpitva madhu caru gavya mpiteva putramabhi rakshatadimam | tasmai te pratiharyate jatavedo
    vicar shane | agne janami sushtutim || divaspari prathama njajne agnirasma mpari jatavedah | tritiyamaphsu
    nrimana ajasramindhana ena njarate svadhih || shucih pavaka vandyo 'gne brihadvi rocase | tva nghritebhirahutah
    || drishano rukma urvya vyadyau shamayuh shriye rucanah | agniramrito abhavadvayobhi nteja anatchuci
    reto nishikta thsudayacca || sa tejiyasa manasa tvota uta shiksha svapatyasya shikshoh | agne rayo
    nritamasya prabhutau bhuyama te sushtutayashca vasvah || agne sahantama bhara dyumnasya prasaha rayim
    | vishva ya carshanirabhyasa vajeshu shcarshanirabhyasa vajeshu sasahat || tamagne pritanasahagm rayigm
    sahasva a bhara | tvagm hi satyo adbhuto data vajasya gomatah || ukshannaya vashannaya somaprishthaya
    vedhase || vadma hi suno asyadmasadva cakre agni ndha rajeva jeravrike kshe shyantah || agna ayugmshi
    pavasa a suvorjamisha nca nah | are badhasva ducchuna m || agne pavasva svapa asme varcah suvirya
    m | dadhatposhagm rayi mmayi || agne pavaka rocisha mandraya deva jihvaya vakshi yakshi ca || sa nah
    pavaka didivo 'gne devagm iha vaha | upa yajnagm havishca nah || agni shshucih kavih | shuci rocata
    ahutah || udagne shucayastava shukra bhrajanta irate | tava jyotigshyarcayah || || harih om || ||
    krishna yajurvediya taittiriya samhitaya mprathamakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे तृतीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ दे॒वस्य॑ त्वा सवि॒तुः प्र॑स॒वे ऽभ्रि॑रसि॒ नारि॑रसि॒ परि॑लिखित॒ग्ं॒ रक्षः॒ परि॑लिखिता॒ अरा॑तय
    इ॒दम॒हग्ं रक्ष॑सो ग्री॒वा अपि॑ कृन्तामि॒ यो न्द्वि॒ष्म इ॒दम॑स्य ग्री॒वा अपि॑ कृन्तामि दि॒वे त्वा॒
    ऽन्तरि॑क्षाय त्वा पृथि॒व्यै त्वा॒ शुन्ध॑तां लोँ॒कः पि॑तृ॒षद॑नो॒ यवो॑ य॒वयारा॑तीः पितृ॒णाग्ं सद॑नम॒स्युद्दिवग्ग्॑
    स्तभा॒ना न्दृग्ं॑ह द्युता॒नस्त्वा॑ मारु॒तो मि॑नोतु मि॒त्रावरु॑णयो र्ध्रु॒वेण॒ धर्म॑णा ब्रह्म॒वनि॑
    न्त्वा क्षत्र॒वनिग्ं॑ सुप्रजा॒वनिग्ं॑ रायस्पोष॒वनि॒ म्पर्यू॑हामि॒ ब्रह्म॑ दृग्ंह क्ष॒त्र न्दृग्ं॑ह
    रा॒यस्पोष॑ न्दृग्ंह घृ॒तेन॑ द्यावापृथिवी॒ आ पृ॑णेथा॒मिन्द्र॑स्य॒ सदो॑ ऽसि विश्वज॒नस्य॑ छा॒या परि॑
    त्वा गिर्वणो॒ गिर॑ इ॒मा भ॑वन्तु वि॒श्वतो॑ वृ॒द्धायु॒मनु॒ वृद्ध॑यो॒ जुष्टा॑ भवन्तु॒ जुष्ट॑य॒ इन्द्र॑स्य॒
    स्यूर॒सीन्द्र॑स्य ध्रु॒वम॑स्यै॒न्द्रम॒सीन्द्रा॑य त्वा ॥ र॒क्षो॒हणो॑ वलग॒हनो॑ वैष्ण॒वा न्नः॑ समा॒नो
    यमस॑मानो निच॒खाने॒दमे॑न॒मध॑र ङ्करोमि॒ यो नः॑ समा॒नो यो ऽराती॒यति॑ गाय॒त्रेण॒ छन्द॒सा ऽव॑बाढो वल॒गः
    किमत्र॑ भ॒द्र न्तन्नौ॑ स॒ह वि॒राड॑सि सपत्न॒हा स॒म्राड॑सि भ्रातृव्य॒हा स्व॒राड॑स्यभिमाति॒हा वि॑श्वा॒राड॑सि॒
    विश्वा॑सा न्ना॒ष्ट्राणाग्ं॑ ह॒न्ता र॑क्षो॒हणो॑ वलग॒हनः॒ प्रोक्षा॑मि वैष्ण॒वा न्र॑क्षो॒हणो॑ वलग॒हनो
    ऽव॑ नयामि वैष्ण॒वान् यवो॑ द्द्वेषो॑ य॒वयारा॑ती रक्षो॒हणो॑ वलग॒हनो ऽव॑ स्तृणामि वैष्ण॒वा न्र॑क्षो॒हणो॑
    वलग॒हनो॒ ऽभि जु॑होमि वैष्ण॒वा न्र॑क्षो॒हणौ॑ वलग॒हना॒वुप॑ दधामि वैष्ण॒वी र॑क्षो॒हणौ॑ वलग॒हनौ॒ पर्यू॑हामि
    वैष्ण॒वी र॑क्षो॒हणौ॑ वलग॒हनौ॒ परि॑ स्तृणामि वैष्ण॒वी र॑क्षो॒हणौ॑ वलग॒हनौ॑ वैष्ण॒वी बृ॒हन्न॑सि बृ॒हद्ग्रा॑वा
    बृह॒तीमिन्द्रा॑य॒ वाचं॑ वि॒भूर॑सि प्र॒वाह॑णो॒ वह्नि॑रसि हव्य॒वाह॑न ऽसि॒ प्रचे॑तास्तु॒थो॑ ऽसि वि॒श्ववे॑दा
    उ॒शिग॑सि क॒विरङ्घा॑रिरसि॒ बम्भा॑रिरव॒स्युर॑सि॒ दुव॑स्वाञ्छु॒न्ध्यूर॑सि मार्जा॒लीयः॑ स॒म्राड॑सि कृ॒शानुः॑
    परि॒षद्यो॑ ऽसि॒ पव॑मानः प्र॒तक्वा॑ ऽसि॒ नभ॑स्वा॒नस॑म्मृष्टो ऽसि हव्य॒सूद॑ ऋ॒तधा॑मा र्ब्रह्म॑ज्योतिरसि॒
    सुव॑र्धामा॒ ऽस्येक॑पा॒दहि॑रसि बु॒द्ध्नियो॒ रौद्रे॒णानी॑केन पा॒हि मा ऽग्ने पिपृ॒हि मा॒ मा मा॑ हिग्ंसीः
    ॥ त्वग्ं सो॑म तनू॒कृद्भ्यो॒ द्वेषो ऽन्यकृ॑तेभ्य उ॒रु य॒न्ता ऽसि॒ वरू॑थ॒ग्ग्॒ स्वाहा॑ जुषा॒णो अ॒प्तुराज्य॑स्य
    वेतु॒ स्वाहा॒ ऽयन्नो॑ अ॒ग्निर्वरि॑वः कृणोत्व॒य म्मृधः॑ पु॒र ए॑तु प्रभि॒न्दन्न् । अ॒यग्ं शत्रू ञ्जयतु॒
    वाज॑सातौ । उ॒रु वि॑ष्णो॒ वि क्र॑मस्वो॒रु क्षया॑य नः कृधि । घृ॒त ङ्घृ॑तयोने पिब॒ प्रप्र॑ य॒ज्ञप॑ति
    न्तिर । सोमो॑ जिगाति गातु॒वि द्दे॒वाना॑मेति निष्कृ॒तमृ॒तस्य॒ योनि॑मा॒सद॒मदि॑त्या॒ स्सद॒ आ सी॑दै॒ष
    वो॑ देव सवित॒ स्सोम॒स्तग्ं र॑क्षद्ध्व॒ म्मा वो॑ दभदे॒तत्त्वग्ं सो॑म दे॒वो दे॒वानुपा॑गा इ॒दम॒ह म्म॑नु॒ष्यो॑
    मनु॒ष्या थ्स॒ह प्र॒जया॑ स॒ह रा॒यस्पोषे॑ण॒ नमो॑ दे॒वेभ्यः॑ स्व॒धा पि॒तृभ्य॑ इ॒दम॒ह न्निर्वरु॑णस्य॒
    पाशा॒ व्रँ॒तप॑तिरसि॒ या मम॑ त॒नूस्त्वय्यभू॑दि॒यग्ं सा मयि॒ या तव॑ त॒नू र्मय्यभू॑दे॒षा सा त्वयि॑ यथाय॒थ
    न्नान्यानुपा॑गाम॒र्वाक्त्वा॒ परै॑रविद न्त्वा॑ जुषे वैष्ण॒व न्दे॑वय॒ज्यायै॑ दे॒वस्त्वा॑ सवि॒ता मद्ध्वा॑
    ऽन॒क्त्वोष॑धे॒ त्राय॑स्वैन॒ग्ग्॒ स्वधि॑ते॒ मैनग्ं॑ हिग्ंसी॒ र्दिव॒मग्रे॑ण॒ मा ले॑खीर॒न्तरि॑क्ष॒ म्मद्ध्ये॑न॒
    मा हिग्ं॑सीः पृथि॒व्या स म्भ॑व॒ वन॑स्पते श॒तव॑ल् शो॒ वि रो॑ह स॒हस्र॑वल् शा॒ वि व॒यग्ं रु॑हेम॒ य स्वधि॑ति॒स्तेति॑जानः
    प्रणि॒नाय॑ मह॒ते सौभ॑गा॒याच्छि॑न्नो॒ रायः॑ सु॒वीरः॑ ॥ पृ॒थि॒व्यै त्वा॒न्तरि॑क्षाय त्वा दि॒वे त्वा॒
    शुन्ध॑तां लोँ॒कः पि॑तृ॒षद॑नो॒ यवो॑ द्द्वेषो॑ य॒वयारा॑तीः पितृ॒णाग्ं सद॑नमसि स्वावे॒शो ऽस्यग्रे॒गा
