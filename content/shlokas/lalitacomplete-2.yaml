id: lalitacomplete-2
category: sahasranama
name:
  english: lalitacomplete
  devanagari: ललितचोम्प्लेते
content:
  english: rinu tvam kumbhasambhava || 15|| atraikanamno ya shaktih patakanam nivartane | tannivartyamagham
    kartum nalam lokashcaturdasha || 16|| yastyaktva namasahasram papahanimabhipsati | sa hi shitanivrityartham
    himashaile nishevate || 17|| bhakto yah kirtayennityamidam namasahasrakam | tasmai shrilitadevi prita'bhishtam
    prayacchati || 18|| akirtayannidam stotram katham bhakto bhavishyati | nityam sankirtanashaktah kirtayetpunyavasare
    || 19|| samkrantau vishuve caiva svajanmatritaye'yane | navamyam va caturdashyam sitayam shukravasare
    || 20|| kirtayennamasahasram paurnamasyam visheshatah | paurnamasyam candrabimbe dhyatva shrilalitambikam
    || 21|| pancopacaraih sampujya pathennamasahasrakam | sarve rogah pranashyanti dirghamayushca vindati
    || 22|| ayamayushkaro nama prayogah kalpacoditah | jvarartam shirasi sprishtva pathennamasahasrakam
    || 23|| tatkshanatprashamam yati shirastodo jvaro'pi ca | sarvavyadhinivrittyartham sprishtva bhasma
    japedidam || 24|| tadbhasmadharanadeva nashyanti vyadhayah kshanat | jalam sammantrya kumbhastham
    namasahasrato mune || 25|| abhishincedgrahagrastangraha nashyanti tatkshanat | sudhasagaramadhyastham
    dhyatva shrilalitambikam || 26|| yah pathennamasahasram visham tasya vinashyati | vandhyanam putralabhaya
    namasahasramantritam || 27|| navanitam pradadyattu putralabho bhaveddhruvam | devyah pashena sambaddhamakrishtamankushena
    ca || 28|| dhyatva'bhishtam striyam ratrau japennamasahasrakam | ayati svasamipam sa yadyapyantah
    puram gata || 29|| rajakarshanakamashcedrajavasathadinmukhah | triratram yah pathedetacchridevidhyanatatparah
    || 30|| sa raja paravashyena turangam va matangajam | aruhyayati nikatam dasavatpranipatya ca || 31||
    tasmai rajyam ca kosham ca dadatyeva vasham gatah | rahasyanamasahasram yah kirtayati nityashah ||
    32|| tanmukhalokamatrena muhyellokatrayam mune | yastvidam namasahasram sakritpathati bhaktiman ||
    33|| tasya ye shatravastesham nihanta sharabheshvarah | yo va'bhicaram kurute namasahasrapathake ||
    34|| nivartya tatkriyam hanyattam vai pratyangira svayam || ye kruradrishtya vikshante namasahasrapathakam
    || 35|| tanandhankurute kshipram svayam martandabhairavah | dhanam yo harate corairnamasahasrajapinah
    || 36|| yatra kutra sthitam vapi kshetrapalo nihanti tam | vidyasu kurute vadam yo vidvannamajapina
    || 37|| tasya vakstambhanam sadyah karoti nakuleshvari | yo raja kurute vairam namasahasrajapina ||
    38|| caturangabalam tasya dandini samharetsvayam | yah pathennamasahasram shanmasam bhaktisamyutah
    || 39|| lakshmishcancalyarahita sada tishthati tadgrihe | masamekam pratidinam trivaram yah pathennarah
    || 40|| bharati tasya jihvagre range nrityati nityashah | yastvekavaram pathati pakshamatramatandritah
    || 41|| muhyanti kamavashaga mrigakshyastasya vikshanat | yah pathennamasahasram janmamadhye sakrinnarah
    || 42|| taddrishtigocarassarve mucyante sarvakilbishaih | yo vetti namasahasram tasmai deyam dvijanmane
    || 43|| annam vastram dhanam dhanyam nanyebhyastu kadacana | shrimantrarajam yo vetti shricakram yah
    samarcati || 44|| yah kirtayati namani tam satpatram vidurbudhah | tasmai deyam prayatnena shridevipritimicchata
    || 45|| na kirtayati namani mantrarajam na vetti yah | pashutulyah sa vijneyastasmai dattam nirarthakam
    || 46|| parikshya vidyavidushastebhyo dadyadvicakshanah | shrimantrarajasadrisho yatha mantro na vidyate
    || 47|| devata lalitatulya yatha nasti ghatodbhava | rahasyanamasahasratulya nasti tatha stutih ||
    48|| likhitva pustake yastu namasahasramuttamam | samarcayetsada bhaktya tasya tushyati sundari ||
    49|| bahunatra kimuktena sha
  devanagari: ृणु त्वं कुम्भसम्भव ॥ १५॥ अत्रैकनाम्नो या शक्तिः पातकानां निवर्तने । तन्निवर्त्यमघं कर्तुं
    नालं लोकाश्चतुर्दश ॥ १६॥ यस्त्यक्त्वा नामसाहस्रं पापहानिमभीप्सति । स हि शीतनिवृत्यर्थं हिमशैले निषेवते
    ॥ १७॥ भक्तो यः कीर्तयेन्नित्यमिदं नामसहस्रकम् । तस्मै श्रीलितादेवी प्रीताऽभीष्टं प्रयच्छति ॥ १८॥ अकीर्तयन्निदं
    स्तोत्रं कथं भक्तो भविष्यति । नित्यं सङ्कीर्तनाशक्तः कीर्तयेत्पुण्यवासरे ॥ १९॥ संक्रान्तौ विषुवे चैव
    स्वजन्मत्रितयेऽयने । नवम्यां वा चतुर्दश्यां सितायां शुक्रवासरे ॥ २०॥ कीर्तयेन्नामसाहस्रं पौर्णमास्यां
    विशेषतः । पौर्णमास्यां चन्द्रबिम्बे ध्यात्वा श्रीललिताम्बिकाम् ॥ २१॥ पञ्चोपचारैः सम्पूज्य पठेन्नामसहस्रकम्
    । सर्वे रोगाः प्रणश्यन्ति दीर्घमायुश्च विन्दति ॥ २२॥ अयमायुष्करो नाम प्रयोगः कल्पचोदितः । ज्वरार्तं
    शिरसि स्पृष्ट्वा पठेन्नामसहस्रकम् ॥ २३॥ तत्क्षणात्प्रशमं याति शिरस्तोदो ज्वरोऽपि च । सर्वव्याधिनिवृत्त्यर्थं
    स्पृष्ट्वा भस्म जपेदिदम् ॥ २४॥ तद्भस्मधारणादेव नश्यन्ति व्याधयः क्षणात् । जलं सम्मन्त्र्य कुम्भस्थं
    नामसाहस्रतो मुने ॥ २५॥ अभिषिञ्चेद्ग्रहग्रस्तान्ग्रहा नश्यन्ति तत्क्षणात् । सुधासागरमध्यस्थां ध्यात्वा
    श्रीललिताम्बिकाम् ॥ २६॥ यः पठेन्नामसाहस्रं विषं तस्य विनश्यति । वन्ध्यानां पुत्रलाभाय नामसाहस्रमन्त्रितम्
    ॥ २७॥ नवनीतं प्रदद्यात्तु पुत्रलाभो भवेद्ध्रुवम् । देव्याः पाशेन सम्बद्धामाकृष्टामङ्कुशेन च ॥ २८॥
    ध्यात्वाऽभीष्टां स्त्रियं रात्रौ जपेन्नामसहस्रकम् । आयाति स्वसमीपं सा यद्यप्यन्तः पुरं गता ॥ २९॥ राजाकर्षणकामश्चेद्राजावसथदिङ्मुखः
    । त्रिरात्रं यः पठेदेतच्छ्रीदेवीध्यानतत्परः ॥ ३०॥ स राजा पारवश्येन तुरङ्गं वा मतङ्गजम् । आरुह्यायाति
    निकटं दासवत्प्रणिपत्य च ॥ ३१॥ तस्मै राज्यं च कोशं च ददात्येव वशं गतः । रहस्यनामसाहस्रं यः कीर्तयति
    नित्यशः ॥ ३२॥ तन्मुखालोकमात्रेण मुह्येल्लोकत्रयं मुने । यस्त्विदं नामसाहस्रं सकृत्पठति भक्तिमान् ॥
    ३३॥ तस्य ये शत्रवस्तेषां निहन्ता शरभेश्वरः । यो वाऽभिचारं कुरुते नामसाहस्रपाठके ॥ ३४॥ निवर्त्य तत्क्रियां
    हन्यात्तं वै प्रत्यङ्गिरा स्वयम् ॥ ये क्रूरदृष्ट्या वीक्षन्ते नामसाहस्रपाठकम् ॥ ३५॥ तानन्धान्कुरुते
    क्षिप्रं स्वयं मार्तण्डभैरवः । धनं यो हरते चोरैर्नामसाहस्रजापिनः ॥ ३६॥ यत्र कुत्र स्थितं वापि क्षेत्रपालो
    निहन्ति तम् । विद्यासु कुरुते वादं यो विद्वान्नामजापिना ॥ ३७॥ तस्य वाक्स्तम्भनं सद्यः करोति नकुलेश्वरी
    । यो राजा कुरुते वैरं नामसाहस्रजापिना ॥ ३८॥ चतुरङ्गबलं तस्य दण्डिनी संहरेत्स्वयम् । यः पठेन्नामसाहस्रं
    षण्मासं भक्तिसंयुतः ॥ ३९॥ लक्ष्मीश्चाञ्चल्यरहिता सदा तिष्ठति तद्गृहे । मासमेकं प्रतिदिनं त्रिवारं
    यः पठेन्नरः ॥ ४०॥ भारती तस्य जिह्वाग्रे रङ्गे नृत्यति नित्यशः । यस्त्वेकवारं पठति पक्षमात्रमतन्द्रितः
    ॥ ४१॥ मुह्यन्ति कामवशगा मृगाक्ष्यस्तस्य वीक्षणात् । यः पठेन्नामसाहस्रं जन्ममध्ये सकृन्नरः ॥ ४२॥ तद्दृष्टिगोचरास्सर्वे
    मुच्यन्ते सर्वकिल्बिषैः । यो वेत्ति नामसाहस्रं तस्मै देयं द्विजन्मने ॥ ४३॥ अन्नं वस्त्रं धनं धान्यं
    नान्येभ्यस्तु कदाचन । श्रीमन्त्रराजं यो वेत्ति श्रीचक्रं यः समर्चति ॥ ४४॥ यः कीर्तयति नामानि तं सत्पात्रं
    विदुर्बुधाः । तस्मै देयं प्रयत्नेन श्रीदेवीप्रीतिमिच्छता ॥ ४५॥ न कीर्तयति नामानि मन्त्रराजं न वेत्ति
    यः । पशुतुल्यः स विज्ञेयस्तस्मै दत्तं निरर्थकम् ॥ ४६॥ परीक्ष्य विद्याविदुषस्तेभ्यो दद्याद्विचक्षणः
    । श्रीमन्त्रराजसदृशो यथा मन्त्रो न विद्यते ॥ ४७॥ देवता ललितातुल्या यथा नास्ति घटोद्भव । रहस्यनामसाहस्रतुल्या
    नास्ति तथा स्तुतिः ॥ ४८॥ लिखित्वा पुस्तके यस्तु नामसाहस्रमुत्तमम् । समर्चयेत्सदा भक्त्या तस्य तुष्यति
    सुन्दरी ॥ ४९॥ बहुनात्र किमुक्तेना श
