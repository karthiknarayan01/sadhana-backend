id: ranganathastutimala
category: shataka
name:
  english: ranganathastutimala
  devanagari: रन्गनाथस्तुतिमाला
content:
  english: '| sukritam ninashya bhajate''calasthitim tvam gajasthamalokya || 17|| haridracurnasuvilepanalobhaniyam
    murtim katham kalayase bata rangabandho | abhiravamanayana iva vashcaniya naitastu colavanitah kutilasvabhavah
    || 48|| nilambudaprakarakantisuhriccharira ramyadyute kathaya kim bhavitum suraktah | haridracurnasuvilepanamatanoshi
    ko veda rangacaritam na jagatprasiddham || 49|| cancatpayodhararucim suharidrayaktam pitambaram bhramatu
    vikshya ca dehamadya | padmam tatah savidhagam svavasham nayamo rangin manah kimiti sapi ca ranganishtha
    || 50|| haridracurnasangadujjvalavapushastava shriyo rangin | dhikkurvanti hi shobham dhatuvicitritavidhupalagravnah
    || 51|| parasparam darpanadarshaniye gandasthale te jayatah shriyashca | satyostayordarpanadharanam
    kim rangesha drashtum nu samam nijangam || 52|| mukurasadanamadhyasthasnu kim nilaratnam | sitarucishubharoci
    shyamalam kim nu nutnam | iti vividhapadavya varnitam nihsapatnam bhavatu sakalalalokashreyase rangaratnam
    || 53|| mukurasadanamadhye prasphuraddiprarupam dishi dishi ca bhavantam vikshya padma dvirupa | nayanahridayacoram
    mayaya dhavanotkam bahulakalitarupam tvam runaddhiti shanke || 54|| pratiphalasi mukuradeshe jade''pi
    hridaye na me katham sphurasi | vimalaya padarajasa tatsamalam cedrangabhumipate || 55|| svamin yoshadvayamapi
    rangakshmapala yuktameva tava | ekaprakritikatapi ca tayormude te bhavatyadhikam || 56|| parshvadvaye''pi
    lakshmibhumyormadhyasthatam prapannena | rangin bhavata bharyadvayanusritiratra shikshyate nunam ||
    57|| seneshapramukheshu vishvajanishu tvacchasanaprepsushu svamin satsu katham nu dhanyagananam tvam
    drashtumudyunjase | karpanyat sa bhavanna vishvasiti kim karpanyamatrairnarai'
  devanagari: । सुकृतं निनाश्य भजतेऽचलस्थितिं त्वां गजस्थमालोक्य ॥ १७॥ हारिद्रचूर्णसुविलेपनलोभनीयां मूर्तिं
    कथं कलयसे बत रङ्गबन्धो । आभीरवामनयना इव वश्चनीया नैतास्तु चोलवनिताः कुटिलस्वभावाः ॥ ४८॥ नीलाम्बुदप्रकरकान्तिसुहृच्छरीर
    रम्यद्युते कथय किं भवितुं सुरक्तः । हारिद्रचूर्णसुविलेपनमातनोषि को वेद रङ्गचरितं न जगत्प्रसिद्धम्
    ॥ ४९॥ चञ्चत्पयोधररुचिं सुहरिद्रयाक्तं पीताम्बरं भ्रमतु वीक्ष्य च देहमद्य । पद्मां ततः सविधगां स्ववशं
    नयामो रङ्गिन् मनः किमिति सापि च रङ्गनिष्ठा ॥ ५०॥ हारिद्रचूर्णसङ्गादुज्ज्वलवपुषस्तव श्रियो रङ्गिन्
    । धिक्कुर्वन्ति हि शोभां धातुविचित्रितविधूपलग्राव्णः ॥ ५१॥ परस्परं दर्पणदर्शनीये गण्डस्थले ते जयतः
    श्रियश्च । सत्योस्तयोर्दर्पणधारणं किं रङ्गेश द्रष्टुं नु समं निजाङ्गम् ॥ ५२॥ मुकुरसदनमध्यस्थास्नु
    किं नीलरत्नम् । सितरुचिशुभरोचि श्यामलं किं नु नूत्नम् । इति विविधपदव्या वर्णितं निःसपत्नं भवतु सकलललोकश्रेयसे
    रङ्गरत्नम् ॥ ५३॥ मुकुरसदनमध्ये प्रस्फुरद्दीप्ररूपं दिशि दिशि च भवन्तं वीक्ष्य पद्मा द्विरूपा । नयनहृदयचोरं
    मायया धावनोत्कं बहुलकलितरूपं त्वां रुणद्धीति शङ्के ॥ ५४॥ प्रतिफलसि मुकुरदेशे जडेऽपि हृदये न मे कथं
    स्फुरसि । विमलय पदरजसा तत्समलं चेद्रङ्गभूमिपते ॥ ५५॥ स्वामिन् योषाद्वयमपि रङ्गक्ष्मापाल युक्तमेव तव
    । एकप्रकृतिकतापि च तयोर्मुदे ते भवत्यधिकम् ॥ ५६॥ पार्श्वद्वयेऽपि लक्ष्मीभूम्योर्मध्यस्थतां प्रपन्नेन
    । रङ्गिन् भवता भार्याद्वयानुसृतिरत्र शिक्ष्यते नुणाम् ॥ ५७॥ सेनेशप्रमुखेषु विश्वजनिषु त्वच्छासनप्रेप्सुषु
    स्वामिन् सत्सु कथं नु धान्यगणनां त्वं द्रष्टुमुद्युञ्जसे । कार्पण्यात् स भवान्न विश्वसिति किं कार्पण्यमात्रैर्नरै
