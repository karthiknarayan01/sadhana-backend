id: ambarishakritamsudarshanacakrastotram
category: stotram
name:
  english: ambarishakritamsudarshanacakrastotram
  devanagari: अम्बरीषकृतंसुदर्शनचक्रस्तोत्रम्
content:
  english: ambarishakritam sudarshanacakrastotram ambarisha uvaca | tvamagnirbhagavan suryastvam somo
    jyotisham patih | tvamapastvam kshitirvyoma vayurmatrendriyani ca || 3|| sudarshana namastubhyam sahasraracyutapriya
    | sarvastraghatin vipraya svasti bhuya idaspate || 4|| tvam dharmastvamritam satyam tvam yajno'khilayajnabhuk
    | tvam lokapalah sarvatma tvam tejah paurusham param || 5|| namah sunabhakhiladharmasetave hyadharmashilasuradhumaketave
    | trailokyagopaya vishuddhavarcase manojavayadbhutakarmane grine || 6|| tvattejasa dharmamayena samhritam
    tamah prakashashca dhrito mahatmanam | duratyayaste mahima giram pate tvadrupametatsadasatparavaram
    || 7|| yada visrishtastvamananjanena vai balam pravishto'jita daityadanavam | bahudarorvanghrishirodharani
    vriknannajasram pradhane virajase || 8|| sa tvam jagattranakhalaprahanaye nirupitah sarvasaho gadabhrita
    | viprasya casmatkuladaivahetave vidhehi bhadram tadanugraho hi nah || 9|| yadyasti dattamishtam va
    svadharmo va svanushthitah | kulam no vipradaivam ceddvijo bhavatu vijvarah || 10|| yadi no bhagavan
    prita ekah sarvagunashrayah | sarvabhutatmabhavena dvijo bhavatu vijvarah || 11|| iti shrimadbhagavatamahapurane
    navamaskandhe pancamadhyayantargatam ambarishakritam sudarshanacakrastotram samaptam | bhagavatapurana
    | adhyaya 9
  devanagari: अम्बरीषकृतं सुदर्शनचक्रस्तोत्रम् अम्बरीष उवाच । त्वमग्निर्भगवान् सूर्यस्त्वं सोमो ज्योतिषां
    पतिः । त्वमापस्त्वं क्षितिर्व्योम वायुर्मात्रेन्द्रियाणि च ॥ ३॥ सुदर्शन नमस्तुभ्यं सहस्राराच्युतप्रिय
    । सर्वास्त्रघातिन् विप्राय स्वस्ति भूया इडस्पते ॥ ४॥ त्वं धर्मस्त्वमृतं सत्यं त्वं यज्ञोऽखिलयज्ञभुक्
    । त्वं लोकपालः सर्वात्मा त्वं तेजः पौरुषं परम् ॥ ५॥ नमः सुनाभाखिलधर्मसेतवे ह्यधर्मशीलासुरधूमकेतवे
    । त्रैलोक्यगोपाय विशुद्धवर्चसे मनोजवायाद्भुतकर्मणे गृणे ॥ ६॥ त्वत्तेजसा धर्ममयेन संहृतं तमः प्रकाशश्च
    धृतो महात्मनाम् । दुरत्ययस्ते महिमा गिरां पते त्वद्रूपमेतत्सदसत्परावरम् ॥ ७॥ यदा विसृष्टस्त्वमनञ्जनेन
    वै बलं प्रविष्टोऽजित दैत्यदानवम् । बाहूदरोर्वङ्घ्रिशिरोधराणि वृक्णन्नजस्रं प्रधने विराजसे ॥ ८॥ स त्वं
    जगत्त्राणखलप्रहाणये निरूपितः सर्वसहो गदाभृता । विप्रस्य चास्मत्कुलदैवहेतवे विधेहि भद्रं तदनुग्रहो
    हि नः ॥ ९॥ यद्यस्ति दत्तमिष्टं वा स्वधर्मो वा स्वनुष्ठितः । कुलं नो विप्रदैवं चेद्द्विजो भवतु विज्वरः
    ॥ १०॥ यदि नो भगवान् प्रीत एकः सर्वगुणाश्रयः । सर्वभूतात्मभावेन द्विजो भवतु विज्वरः ॥ ११॥ इति श्रीमद्भागवतमहापुराणे
    नवमस्कन्धे पञ्चमाध्यायान्तर्गतं अम्बरीषकृतं सुदर्शनचक्रस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ९
