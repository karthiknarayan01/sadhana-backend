  devanagari: सं कीलकम् । कामानां सिद्ध्यर्थे जपे विनियोगः । ॐ नमस्ते भैरवेशाय ब्रह्मविष्णुशिवात्मने ।
    नमस्त्रैलोक्यवन्द्याय वरदाय परात्मने । रत्नसिंहासनस्थाय दिव्याभरणधारिणे । दिव्यमालादिभूषाय नमस्ते
    दिव्यमूर्तये ॥ नमस्तेऽनेकहस्ताय ह्यनेत्रशिरसे नमः । नमस्तेऽनेकभ्रान्त्रे कवीश्वराय ते नमः ॥ नमस्ते
    नीलकण्ठायानेकांशायाथ ते नमः । नमस्तेऽनेकपार्श्वाय ह्यनेकादित्यजेतसे । मन्दारद्रुममूलभाजि महिते माणिक्यसिंहासने
    दिव्ये रत्नमये सुचम्पकरुचा देव्या समालिङ्गितः । भक्तेभ्यो वररत्नपात्रभरितं स्वर्णं ददानो हि सः स्वर्णाकर्षणभैरवो
    विजयते स्वर्गापवर्गैकभूः ॥ अथ नामावलिः । ॐ भैरवाय नमः । भूतनाथाय । भूतात्मने । भूतभावनाय । भूतवासाय
