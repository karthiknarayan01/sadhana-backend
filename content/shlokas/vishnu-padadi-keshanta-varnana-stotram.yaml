id: vishnu-padadi-keshanta-varnana-stotram
category: stotram
name:
  english: Vishnu Padadi Keshanta Varnana Stotram
  devanagari: विष्णुपादादिकेशान्तवर्णनस्तोत्रम्
content:
  english: vishnupadadikeshantavarnanastotram shankaracaryah 1932 vishnupadadikeshantavarnanastotram shankaracaryah
    1932 kavyamala | bhagavatpadashrishamkaracaryakritam vishnupadadikeshantavarnanastotram | tippanasahitam
    | lakshmibharturbhujagre kritavasati sitam yasya rupam vishalam niladrestungashringasthitamiva rajaninathabimbam
    vibhati | payannah pancajanyah sa sakuladitijatrasanaih purayansvai rnidhvanairniradaughadhvaniparibhavadairambaram
    kamburajah || 1 || sa pancajanyo nama kamburajah shankhashreshtho no'smanpayat | kimvishishtah | svairnirdhvanairnitaram
    dhvanairambaram nabhah purayan | nirada meghasteshamogho'vicchinnastomastasya dhvaninam garjitashabdanam
    paribhavamabhibhavam dadatityevamvidhairityarthah | meghaughashankhayoryugapaddhvanatoh shrutimatam
    shankhashabda eva shrutigocaro na meghaughashabda iti meghadhvanayah shankhadhvanibhirabhibhuyanta
    ityucyate | etena visheshanena nirdhvanairityatra nirupasargadyotito'tishayah sadhitah | kulaih saha
    vartamanah sakulaste ca te ditija daityastamstrasayantiti taih | yasya kamburajasya rupam lakshmibhartuh
    shrikantasya bhujagre | vamordhvakara iti yavat | krita vasatiryena rupena tat | sitam shubhram |
    vishalam mahat | utprekshate niladririndranilamaniparvatastasya yattungamunnatam shringam shikharam
    tatra sthitam rajaninathasya candramaso bimbam mandalamiva | indranilagiririva bhagavanmurtistacchringavatkarastatrasthacandramandalavacchankha
    iti yojyam || ahuryasya svarupam kshanamukhamakhilam surayah kalametam dhvantasyaikantamantam yadapi
    ca paramam sarvaghamnam ca dhama | 1 bahavo granthah stotrani ca shamkaracaryakrititvena prasiddhani
    samupalabhyante tani sarvanyapi pradhanashamkaracaryakritaniti na mantavyam kim tu tatsimhasanadhirudhairadhunapi
    shamkaracaryapadaprasiddhaitacchishyaprashishyairapi bahuni viracitaniti jneyam etadvishnupadadikeshantavarnanastotram
    tu pradhanashamkaracaryakritameva bhati yato madhaviyashamkaravijaye caturdashe sarge mumurshusvajananipreranaya
    shamkaracaryairvishnusvarupavarnanamakari ityadika katha vartate sa ca vishnustutiriyameveti bahunam
    matam pradhanashamkaracaryastu khristasamvatsariyashtamashatakasamaptau pradurbabhuvurityaryavidyasudhakaradhritashamkaramandarasaurabhadivacanebhyo'vasiyate
    shashthashatakottarabhage saptamashatakapurvabhage va shamkaracaryasthitirasiditi navyavidusham matam
    etadeva yuciyuktam pratiyate cakram taccakrapaneditijatanugaladraktadharaktadharam shashcanno vishvavandham
    vitaratu vipulam sharma dharmashushobham || 2 || cakrapanernarayanasya taccakra dakshinokarasthitam
    no'laka vipulam sharma sukham vita ratu | kim vishishtam | vishvavandyam | punah kimvishishtam | yuddhavasare
    ditijanam tanubhyo vidaritabhyo ya galantyo raktadharastabhirakta lipta dhara nemyagram yasya tat
    | suravo vidvamsah kshanamukham kshanalavatrutiprabhritikamakhilam samvatsarantametam sarva kalam
    yasya cakrasya kharupamahustaccakramiti samvandhah | api ca yacakram dhvantasyaikantamavyabhica ryantamantakara
    suraya ahuh | antayati nashayatityantam | sarvesham dhannam tejasam capi paramam niratishayam dhamashrayibhutam
    | gha~shoh suyasyeva shobha yasya | surye'pi kalatma kavam niratishayatejomayatvam nihsheshatamonashakavam
    vishvavandhalam ca sarvagamaprasiddhameva || avyannirghataghoro haribhujapavanamarshanadhmatamurte
    ramanvismeranetratridashanutivacahsadhukaraih sutarah | sarva samhartumicchorarikulabhuvanam spharavispharanadah
    samyatkalpantasindhau sharasalilaghatavarmucah karmukasya || 3 || karmukasya dhanushah spharavispharanado'smanavyat
    | spharah prabalo'tishayito va vispharanado dhanushaghoshah ityamarah | vyakarshanavisheshajo dhvani
    retyarthah | kimvishishtah | nirghato'shanipatashabdastabaddhoro duhsahah | punah kimvishishtah |
    kimidamityakasmadvismarani vikasitani netrani yesham te ca te tridashastesham nutivacah sadhukarairvismitadevakritaih
    ityadistuvivacanasatkaraimishritah sansutarah sutaramucah | harenarayanasya bhujah kara eva pavanatanamarshanam
    yadishadakarshanam tenaghmatopacita murtiryasya | sarvamasheshamarikulabhuvanam shatrusamuha eva bhuvanam
    jagatsamhartu nashayitumicchoh | samyatsangrama eva kalpantasindhuh pralayakalinasamudastasmin | shara
    eva salilani tesham ghata dharah | anavacchinnaparampara sharavrishtiriti yavat | tasya varmuk meghastasya
    | atra varmukshabdo meghe rudha eva prayah salilashabdena paunaruktya patat | yatha pralayakalino
    meghah pavanamarshanadhmatamurtih sarvajagatsamharecchuh sarvasamhara kalayasindhupuranaya salilaghatam
    muncati tadvaddhanarapi | jimutashyamabhasa muhurapi bhagavadvahuna mohayanti yuddhepuyamana jhatiti
    tadidivalakshyate yasya murtih | so'sinasakulakshatridasharipuvapuhshonitakhadadripto nityanandaya
    bhuyanmadhumathanamanonandako nandako nah || 4 || so'sih khadgo nandako nandakanama no'smakam nityanandaya
    bhuyat | kimlakshanah | vasenakulanyakshanindriyani yesham te ca te tridasharipavastesham vapumshi
    teshu shonitam rudhiram tasyasvadah panam tena hapto divishtah | madhumathano madhusudanastasya mano
    nandayatiti nandanah| yasya murtiyuddheshu jhatiti shighram tadidiva capalagatiralakshyate | kimlakshana
    murtih | jimutashyamabhasa bhagavato bahuna muhurudbhuyamana kampyamana | apishabdanme ghantastadidiva
    daityadeheshu pravishyamaneti | ata eva mohayanti | daityaniti sheshah| atranuktamapi carma sadgasahacaram
    boddhavyam ashtayudhasahitashtabahuyuktabhagavanmurteh puraneshu prasiddhakhat || kamrakara murareh
    karakamalatalenanuragagrihita samyagvritta sthitagre sapadi na sahate darshanam ya paresham | rajanti
    daityajivasavamadamudita lohitalepanarda kamam diptamshukanta pradishatu dayitevasya kaumodaki nah
    || 5|| evamvishishta sa kaumodaki bhagavadgada no'smabhyam kamamabhishtam pradishatu | kimlakshana
    | kamro manohara akaro yasyah sa | tatha murareh karakamalatale nanuragadgrihita | ni me tarthi pancami
    | samyagvritta vartula | agre bhagavatpuratah sthita| paresham shatrunam darshanam na sahate | sapadi
    sahasaiva tanirbhartsayatiti sheshah | yadva sapadi kadapi paresham darshanam na sahate | rajanti
    shobhamana | daityanam jivo jivanam sa evasavo madyam tadakhadakrita madena harshena mudita | tatha
    daityadehasthalohitakritalepanenaragenai klina | tatha diptairamshubhih kiranaih kanta kamaniya| asya
    bhagavato dayiteva | katham taducyate anuragadgrihitetyantam yathavyakhyatameva | vrittam caritram
    | paresham parapurushanam | lohe tacandanalepanenarda | dipta ujjvalo'shukasya vanna sya'prabhago
    yasyah sa || yo vidhapranabhutastanurapi ca hareryanaketukharusho yam samcintyaiva sadyah svayamuragavadhuvargagarbhah
    patanti | cancaccandostundatrutitaphanivasaraktapakitasya vande chandomayam tam khagapatimamalasvarnavarnam
    suparnam || 6 || tam suparna garudam vande | kimlakshanam | amalam yatsvagam suvarna tasya varna iva
    vi yasya | khagah pakshinastesham patistam | cancaddedipyamanam candamatikopanamuru mahaca yattundam
    mukham tena trutitashchinna ye phaninastesham vasa rakam ca tayoh pankah kardamastena vitam liptamasyam
    mukham yasya | punah kimvishishtam | chandomayam | yo vishvapranabhutah | sarvapranebhyo bhuta udbhutah
    | ekibhutasakalapranibalamurtirityarthah | api ca harestanurmurtya ntaram | tatha tasyaiva yanaketukharupah
    | vahanarupo dhvajarupashcetyarthah | yam samcinyaiva sadya uragavadhuvargasya sarpastrisamuhasya
    garbha jatharantahsthita api nagasamtanah khayam patanti | kavyamala| vishnovishveshvarasya pravarashayanakritsarvalokaikadharta
    so'nantah sarvabhutah prithuvimalayashah sarvavedaishca vedyah | pata vishvasya shashvatsakalasuraripudhvamsanah
    papahanta sarvajnah sarvasakshi sakalavishabhayatpatu bhogishvaro nah || 7 || so'nanto'nantanama bhogishvaro
    nagakulapatinom'smansakalavishabhayatpatu | vishve shvarasya vishnoh pravaram shreshtham yacchayanam
    shayya tatkarotiti | ata eva sarvalokaikadharta | khantahsthitasakalajagatah paramatmano dharayitetyarthah
    | srishtikale sarvabhutamutpannamassa diti sarvabhutah | ata eva prithu mahadvimalam pavayita yasho
    yasya | sarvavedaih | veda ityupa lakshanam | itihasapuranadibhirapi vedya ityarthah | jagasthitikale
    vishvasya pata pala yita | shashvatsada | sakalasuraripudhvamsanah | akhiladharmapratipakshadhvamsana
    ityarthah | nati nutismaranadibhih sarvajananam papahanta | sarvajnah | sarvasakshi | anantasya vishnoravata
    rakhena varnitatvatsarvani visheshanani yuktani || vagbhugauryadibhedairviduriha munayo yam yadiyaishca
    pumsam karunyah katakshah sakridapi patitaih sampadah syuh samagrah | kundenduskhacchamandasmitamadhuramukhambhoruham
    sundarangim vande vandyamasheshairapi murabhiduromandiramindiram tam || 8|| tamindiram lakshmi vande
    | kimlakshanam | murabhido narayanasyoro vaksho mandira griham yasyah | asheshaih samastairvanya |
    sundaranyamani yasyah | kundah kusumavisheshah indushcandrah | kundendu iva khaccham shubhram mandamalpam
    ca tatsmitam tena madhuram manoharam mukha mbhoruham yasyah | yam munayo vyasadayo vaksarasvati padadvidyadinam
    grahanam | tai dairviduh | punah kimlakshanam | yadiyaih karunyah kripa paravashaih katakshah sakridekavaramapi
    patitaih pumsam samaprah sampurnah sampadah syuh | tam || ya sute sattvajalam sakalamapi sada samnidhanena
    pumso dhatte ya sattvayogaccaramacaramidam bhutaye bhutajatam | dhatri sthatri janitri prakritimavikriti
    vishvashaktim vidhatri vishnovishvatmanastam vipulagunamayim prananatham pranaumi || 9 || vishvatmano
    vishnoh prananatham prakriti tam pranaumi prakarshena staumi | vishvasthama tasya | vishvadhishthanasyetyarthah
    | prananatham pranapriyat | bharyamiti yavat | prakriyate prasuyate sarvamasya iti prakriti nimatamupadanam
    | kimlakshanam | vikritirvikarah | na vikritiravikritistam | anadimityarthah | vishvasminprapance
    shaktirutpadanasamarthya yasyah | vishnupadadikeshantavarnanastotram vidhatrim | sthatri sthirakhabhavam
    | janitrimapurvakarotpadayitrim | vipula vistirna gunah sattvadayastanmayim tatsvarupam | lohitashuklakrishnamayimiti
    va | ya pumsah sarva ghishthanasya vishnoh samnidhanena samnidhisattamatrena sattvajalam pranisamuham
    sada sute jana yati | sakalamityanena na kevalam bhumigatanameva prasavitri api tu devadinamapiti
    gamyate | punah ya pumsah sattvayogatsattasambandhadidam pratyakshadisamnidhapitam caram jaga mamacara
    sthavaram ca bhutajatam bhutaye vibhutyartham | pranivistararthamiti yavat | dhatte bibharti || yebhyo'suyadbhiruccaih
    sapadi padamuru tyajyate daityavarga ryebhyo dhartum ca muni sprihayati satatam sarvagirvanavargah
    | nityam nirmulayeyurnicitataramami bhaktinighnatmanam nah padmakshasyabhipadmadvayatalanilayah pamsavah
    papapankam || 10 || agi padmakshasya pundarikakshasya harerashipadmadrayasya talamadhobhagastannilayah
    sthanam yesham te pamsavo renavo no'smakam papapata duritakardamam nityam nirmulayeyuh | nityamiti
    papapakavisheshanam | nitaram citam nicitamuparyupari samcitam tatrapyatishayena nicitam nicitataram
    | purvapurvacitamanutsayaiva punahpunaruparyupari citamityarthah | kathambhutanam nah | bhaktininatmanam
    bhaktyadhinacittanam | yebhyah padatalapamsubhyo'suyadbhih | yannuhya dbhirityarthah | daityavagairasurakulaih
    | uccairunnataih | akrantadevakulairiti yavat | uru badhe| shvaryayuktamapi padam khasthanam sapadi
    tatkshanameva tyajyata utsrijyate | punah kimbhutanam | sarvagirvanavargah satatam mubhi dhartumudvodhum
    yebhyah sprihayati | yandhartu vanchatityarthah || rekha lekhabhivandyashcaranatalagatashcakramatsyadirupah
    snigdhah sukshmah sujata mridulalitatarakshaumasutrayamanah | dadyu mangalani bhramarabharajusha komalenabdhijayah
    kanenanedyamanah kisalayamriduna panina cakrapaneh || 11 || cakrapanernarayanasya caranatalagatashcakramatsyadirupa
    rekha no'smabhyam mangalani dadyuh| kivishishtah | lekha devastairvanya vandanahimh | snigdha arukshah
    | sukshmah krishah | sujatah | khashrayasamatalavavirodhinya ityarthah | mriduni shlakshnani ca tani
    lalitatara gyatishayamanoharani ca yani kshaumasutrani tadvadacarantiti tah | abdhijaya lakshmyah
    paninameḻyamanah punahpunaramrijyamanah | kathambhutena panina | kisalayamriduna | kaprena kamaniyena
    | bhramanti ruvanti veti vyutpattya samshabdam bhramamanani prakoshthanishta karabhushanani shramarani
    tesham bharah stomavam jushate tena | komalena lakshanena || kavyamala| yasmadakramato dyam garudamanishilaketudandayamana
    dashthyotanti babhase surasaridamala vaijayantiva kanta | bhumishtho yastasthanyo bhuvanagriha brihatstambhashobham
    dadhanah patametau payojodaradalitatalau pankajakshasya padau || 12 || yasmatpadadashyotantyapatanti
    surasaridganga | amala nirmalodaka kanta manohara vaijayanti patakeva babhase | kimlakshanat | yamakamatah
    | andakapalasphutanaparyantam dirghakritadityarthah | garudamanirmarakatamanistanmayi ya shila tadrupo
    yah ketudandah pata kashrayabhuta yashtistadvadacaratiti tasmat | evam vamapadam varnayitva dakshinam
    varnayati tathanyo dakshinah pado bhumishthah | bhuvanam trailokyam tadeva griham tasminbrihanmahanyah
    stambha stasya shobham dadhanah | trailokyabhavanottambhanastambha iva sthita ityarthah | yavevamvidhau
    pankajakshasya hareh padau tavetau patam palayetam | asmaniti sheshah | payoja kamalam tasyodaram
    madhyam taddalitam parabhutam yabhyam tadrishe tale yayosti | payojodaradapi sukuma ratalavityarthah||
    akramadbhyam trilokimasurasurapati tatkshanadeva nitau yabhyam vairocanindrau yugapadapi vipatsampadorekadhama
    | tabhyam tamrodarabhyam muhuramajitasyancitabhyamubhabhyam prajyaishvaryapradabhyam pranatimupagatah
    padapakeruhabhyam || 13 || tatkshanadeva yasminkshane balidaityadattodakam haste patitam tadaiva trilokimakramadbhayam
    yabhyamasurasurapati vairocanindrau balishako yugapatsamakalameva kramena vipatsampadoraishvarya bhramshatatsampattyorekaladhama
    mukhya sthanam nitau prapitau | virocanapatyam balivipaddhamatvam indrashca sampaddhamalam nita ityarthah
    | apishabdo virodhadyotakah | ekasyamakramanakriyayam viruddhobhayakaryayogo virodhah | yabhyamevam
    kritam tabhyamubhabhyamajitasya vishnoh pada parehabhyamaham muhuh shashvatpranati namratamupagatah
    | tanetyadini padavisheshanani | tane arake udare adhastale yayoh | ashcitabhyam pujitabhyam | brahmadibhiriti
    sheshah | prajyamadhikamaishvaryam bhavebhyah pradadata iti tabhyam || yebhyo varnashcaturthashcaramata
    udabhudadisarge prajanam sahasri capi samkhya prakatamabhihita sarvavedeshu yesham | vyapta vishvabhara
    yairativitatatanovishvamurvirajo vishnostebhyo mahadbhayah satatamapi namo'stvavipakeruhebhyah ||
    14|| vishvamurtervirajo viratrarupasya vishnostebhyo'pyajipakeruhebhyah satatam sarvada namo'stu |
    vishnupadadikeshantavarnanastotram | ativitatatanoraparicchinna dehasya | kimlakshanebhyah | mahadbhya
    | yebhyah sakashatprajana madisarge caturtho varnah shudrakhyashcaramato varnatrayotpattyanantaramudabhut
    | api ca yeshama nghripankeruhanam sahasri samkhya prakatam sphutam sarvavedeshvabhihita | sahasrakshah
    sahasrapat ityayetyarthah | yairvishvambhara prithivi vyapta purna || vishno padadvayagre vimalanakhamanibhrajita
    rajate ya rajivasyeva ramya himajalakanikalamkritagra dalali | asmakam vismayarhanyakhilamunijanaprarthaniyani
    seyam dadyadadyanavadya tatiratirucira mangalanyangulinam || 15 || seyam vishnorangulinam tatih panktirasmakam
    mangalani dadyat | kimbhuta | adau bhavadya purvasiddha | bhaktanamakhilabhishtakaranabhutetyarthah
    | anavadya nirmala | amlanetyarthah | atirucira | ya padadvayagre vimala nirmala ye nakhamanayastairbhrajita
    sati rajate | rajivasya kamalasya dalali dalapantiriva | kimlakshana dalali | ramya | himajalanam
    kanikabhirvindubhiralamkritanyaprani yasyah sa | kimlakshanani mangalani | vismayarha nyashcaryayogyani
    | adrishtapurvaniti yavat | tathakhilamunijanaprarthaniyani || yasyam drishtvamalayam pratikritimamarah
    kham bhavantyanamantah sendrah sandrikritershyah khaparasurakulashankayatankavantah | sa sadyah satirekam
    sakalasukhakarim sampadam sadhayenna shcancaccarvamshucakra carananalinayoshcakrapanernakhali || 16
    || sa cakrapaneshvarananalinayornakhali no'smakam sampadam sadyah sadhayet | sakalanyai hikamushmikani
    sukhani karoti tam | satirekamadhikam | kimlakshana nakhali| cancantah prasarantashcaravo yemshavastesham
    cakram samuho yasyah | yasyam nakhalyamamalayam sendra amara anamantah santah kham pratikritim pratibimbam
    drishtva khaparasurakulashankaya khapratipakshadevasamuhabhranya sandrikritershya atishayershyayukta
    atankavantah shankanimitta kabhayayuktashca bhavanti || padambhojanmasevasamavanatasuravratabhakhakirita
    pratyuptoccavacashmapravarakaraganaishcitritam yadvibhati | namranganam harerno haridupalamahakurmasaundaryahari
    cchayam shreyahpradayi prapadayugamidam prapayetpapamantam || 17 || hareridam prapadayugam padagradvandvam
    no'smakam papamantam nasham prapayet | kathambhutanam nah | namranganam | sashtangam pranamam kurvatamityarthah
    | kimlakshanam prapadayugam | haridupalo harita kavyamala| varno manivisheshastanirmito yo mahakurmastasya
    saundarya lavanyam haratityevamvidha chaya kantiryasya tat | yatha shreyahpradayi | padavevambhojanmani
    kamale tayoh seva tasyam samavanata ye surastesham yo vratah samuhastasminyani bhakhanti kiritani
    teshu pratyuta nikhata ya uccavaca nanavidha ashmapravara manishreshthastesham kara rashmayastesham
    ganaih samuhaishcitritam karburitam yadvibhati || shrimatyau caruvritte karaparimalananandahrishte
    ramayah saundaryadhyendranilopalaracitamahadandayoh kanticaure | surindraih stuyamane surakulasukhade
    suditaratisamghe janghe narayaniye muhurapi jayatamasmadamho harantyau || 18 || narayanasyeme janghe
    muhuh shashvadasmadamhah papam harantyau satyau jayatam | shrimatyau shobhavasthau | caru sundaram
    yatha syattatha vritte vartule | ramaya lakshmyah karayoh parimala nena ya anandastena hrishte pulakite
    | saundaryena lavanyenadhyo ya indanilopalastena racitau yau mahadandau tayoh kanticaure | surindrairvidvacchreshthaih
    stuyamane varnyamane | surakulasya sukhade | yasmatsuditaratisamghe hatadevashatrukule || samyaksahyam
    vidhatum samamapi satatam janghayoh khinnayorye bharibhutorudandadvayabharanakritottambhabhavam bhajete
    | cicadarsham nighatum mahitamiva satam te samudgayamane vrittakare vidhattam hridi mudamajitasyanisham
    januni nah || 19|| ajitasya hareste januni no'smakam citte mudamanisham vidhattam | vrittakare manda
    lavatsamavartulakare | satam bhaktanam cittadarsha manodarpanam nidhatum samudgayamana ada rshakoshayamane
    iva | mahitam nirmalikritam cittadarsham | ye khinnayorjanghayo tyena sahyam sahatvam | upakaramiti
    yavat | samam yugapadeva bharibhutasyorudandadvayasya yaddharanam dharanam tasminkrita uttambhabhavo'vashtambhalam
    tadbhajete | apishabdah sambhavanayam || devo bhirti vidhatuh sapadi vidadhatau kaitabhakhyam madhumya
    varopyarudhagarvavadhijaladhi yayoreva daityo jaghana | vrittavanyonyatulyau caturamupacayam bibhratavabhranila
    vuru caru haretau mudamatishayinim manase no vidhattam || 20 || harestavuru no'smakam manase'tishayinim
