id: ashtavakra-gita-chapter-7
category: stotram
name:
  english: Ashtavakra Gita Chapter 7
content:
  english: janaka uvaca || mayyanantamahambhodhau vishvapota itastatah | bhramati svantavatena na mamastyasahishnuta
    || || mayyanantamahambhodhau jagadvicih svabhavatah | udetu vastamayatu na me vriddhirna ca kshatih
    || || mayyanantamahambhodhau vishvam nama vikalpana | atishanto nirakara etadevahamasthitah || ||
    natma bhaveshu no bhavastatranante niranjane | ityasakto'sprihah shanta etadevahamasthitah || || aho
    cinmatramevahamindrajalopamam jagat | iti mama katham kutra heyopadeyakalpana ||
  devanagari: जनक उवाच ॥ मय्यनन्तमहाम्भोधौ विश्वपोत इतस्ततः । भ्रमति स्वान्तवातेन न ममास्त्यसहिष्णुता
    ॥ ॥ मय्यनन्तमहाम्भोधौ जगद्वीचिः स्वभावतः । उदेतु वास्तमायातु न मे वृद्धिर्न च क्षतिः ॥ ॥ मय्यनन्तमहाम्भोधौ
    विश्वं नाम विकल्पना । अतिशान्तो निराकार एतदेवाहमास्थितः ॥ ॥ नात्मा भावेषु नो भावस्तत्रानन्ते निरञ्जने
    । इत्यसक्तोऽस्पृहः शान्त एतदेवाहमास्थितः ॥ ॥ अहो चिन्मात्रमेवाहमिन्द्रजालोपमं जगत् । इति मम कथं कुत्र
    हेयोपादेयकल्पना ॥
