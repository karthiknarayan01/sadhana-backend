id: chanakya-neethi-chapter-10
category: stotram
name:
  english: Chanakya Neethi - Chapter 10
content:
  english: dhanahino na hinashca dhanikah sa sunishcayah | vidyaratnena hino yah sa hinah sarvavastushu
    || || drishtiputam nyasetpadam vastraputam pibejjalam | shastraputam vadedvakyah manahputam samacaret
    || || sukharthi cettyajedvidyam vidyarthi cettyajetsukham | sukharthinah kuto vidya sukham vidyarthinah
    kutah || || kavayah kim na pashyanti kim na bhakshanti vayasah | madyapah kim na jalpanti kim na kurvanti
    yoshitah || || rankam karoti rajanam rajanam rankameva ca | dhaninam nirdhanam caiva nirdhanam dhaninam
    vidhih || || lubdhanam yacakah shatrurmurkhanam bodhako ripuh | jarastrinam patih shatrushcauranam
    candrama ripuh || || yesham na vidya na tapo na danam jnanam na shilam na guno na dharmah | te martyaloke
    bhuvi bharabhuta manushyarupena mrigashcaranti || || antahsaravihinanamupadesho na jayate | malayacalasamsarganna
    venushcandanayate || || yasya nasti svayam prajna shastram tasya karoti kim | locanabhyam vihinasya
    darpanah kim karishyati || || durjanam sajjanam kartumupayo nahi bhutale | apanam shatadha dhautam
    na shreshthamindriyam bhavet || || aptadveshadbhavenmrityuh paradveshaddhanakshayah | rajadveshadbhavennasho
    brahmadveshatkulakshayah || || varam vanam vyaghragajendrasevitam drumalayam patraphalambusevanam
    | trineshu shayya shatajirnavalkalam na bandhumadhye dhanahinajivanam || || vipro vrikshastasya mulam
    ca sandhya vedah shakha dharmakarmani patram | tasmanmulam yatnato rakshaniyam chinne mule naiva shakha
    na patram || || mata ca kamala devi pita devo janardanah | bandhava vishnubhaktashca svadesho bhuvanatrayam
    || || ekavrikshasamarudha nanavarna vihangamah | prabhate dikshu dashasu yanti ka tatra vedana ||
    || buddhiryasya balam tasya nirbuddheshca kuto balam | vane simho yadonmattah mashakena nipatitah
    || || ka cinta mama jivane yadi harirvishvambharo giyate no cedarbhakajivanaya jananistanyam katham
    nirmame | ityalocya muhurmuhuryadupate lakshmipate kevalam tvatpadambujasevanena satatam kalo maya
    niyate || || girvanavanishu vishishtabuddhi stathapi bhashantaralolupo'ham | yatha sudhayamamareshu
    satyam svargangananamadharasave rucih || || annaddashagunam pishtam pishtaddashagunam payah | payaso'shtagunam
    mamsam mamsaddashagunam ghritam || || shokena roga vardhante payasa vardhate tanuh | ghritena vardhate
    viryam mamsanmamsam pravardhate ||
  devanagari: धनहीनो न हीनश्च धनिकः स सुनिश्चयः । विद्यारत्नेन हीनो यः स हीनः सर्ववस्तुषु ॥ ॥ दृष्टिपूतं
    न्यसेत्पादं वस्त्रपूतं पिबेज्जलम् । शास्त्रपूतं वदेद्वाक्यः मनःपूतं समाचरेत् ॥ ॥ सुखार्थी चेत्त्यजेद्विद्यां
    विद्यार्थी चेत्त्यजेत्सुखम् । सुखार्थिनः कुतो विद्या सुखं विद्यार्थिनः कुतः ॥ ॥ कवयः किं न पश्यन्ति
    किं न भक्षन्ति वायसाः । मद्यपाः किं न जल्पन्ति किं न कुर्वन्ति योषितः ॥ ॥ रङ्कं करोति राजानं राजानं
    रङ्कमेव च । धनिनं निर्धनं चैव निर्धनं धनिनं विधिः ॥ ॥ लुब्धानां याचकः शत्रुर्मूर्खानां बोधको रिपुः
    । जारस्त्रीणां पतिः शत्रुश्चौराणां चन्द्रमा रिपुः ॥ ॥ येषां न विद्या न तपो न दानं ज्ञानं न शीलां न
    गुणो न धर्मः । ते मर्त्यलोके भुवि भारभूता मनुष्यरूपेण मृगाश्चरन्ति ॥ ॥ अन्तःसारविहीनानामुपदेशो न जायते
    । मलयाचलसंसर्गान्न वेणुश्चन्दनायते ॥ ॥ यस्य नास्ति स्वयं प्रज्ञा शास्त्रं तस्य करोति किम् । लोचनाभ्यां
    विहीनस्य दर्पणः किं करिष्यति ॥ ॥ दुर्जनं सज्जनं कर्तुमुपायो नहि भूतले । अपानं शातधा धौतं न श्रेष्ठमिन्द्रियं
    भवेत् ॥ ॥ आप्तद्वेषाद्भवेन्मृत्युः परद्वेषाद्धनक्षयः । राजद्वेषाद्भवेन्नाशो ब्रह्मद्वेषात्कुलक्षयः
    ॥ ॥ वरं वनं व्याघ्रगजेन्द्रसेवितं द्रुमालयं पत्रफलाम्बुसेवनम् । तृणेषु शय्या शतजीर्णवल्कलं न बन्धुमध्ये
    धनहीनजीवनम् ॥ ॥ विप्रो वृक्षस्तस्य मूलं च सन्ध्या वेदः शाखा धर्मकर्माणि पत्रम् । तस्मान्मूलं यत्नतो
    रक्षणीयं छिन्ने मूले नैव शाखा न पत्रम् ॥ ॥ माता च कमला देवी पिता देवो जनार्दनः । बान्धवा विष्णुभक्ताश्च
    स्वदेशो भुवनत्रयम् ॥ ॥ एकवृक्षसमारूढा नानावर्णा विहङ्गमाः । प्रभाते दिक्षु दशसु यान्ति का तत्र वेदना
    ॥ ॥ बुद्धिर्यस्य बलं तस्य निर्बुद्धेश्च कुतो बलम् । वने सिंहो यदोन्मत्तः मशकेन निपातितः ॥ ॥ का चिन्ता
    मम जीवने यदि हरिर्विश्वम्भरो गीयते नो चेदर्भकजीवनाय जननीस्तन्यं कथं निर्ममे । इत्यालोच्य मुहुर्मुहुर्यदुपते
    लक्ष्मीपते केवलं त्वत्पादाम्बुजसेवनेन सततं कालो मया नीयते ॥ ॥ गीर्वाणवाणीषु विशिष्टबुद्धि स्तथापि
    भाषान्तरलोलुपोऽहम् । यथा सुधायाममरेषु सत्यां स्वर्गाङ्गनानामधरासवे रुचिः ॥ ॥ अन्नाद्दशगुणं पिष्टं
    पिष्टाद्दशगुणं पयः । पयसोऽष्टगुणं मांसां मांसाद्दशगुणं घृतम् ॥ ॥ शोकेन रोगा वर्धन्ते पयसा वर्धते तनुः
    । घृतेन वर्धते वीर्यं मांसान्मांसं प्रवर्धते ॥
