id: sri-dakshina-murthy-sahasra-nama-stotram
category: stotram
name:
  english: Sri Dakshina Murthy Sahasra Nama Stotram
content:
  english: asya shridakshinamurti sahasranamastotrasya brahma rishih anushtup chandah shridakshinamurtirdevata
    om bijam svaha shaktih namah kilakam medhadakshinamurti prasadasiddhyarthe jape viniyogah || hramityadina
    nyasah || dhyanam siddhitoyanidhermadhye ratnagraive manorame | kadambavanikamadhye shrimadvatataroradhah
    || || asinamadyam purushamadimadhyantavarjitam | shuddhasphatikagokshirasharatpurnendushekharam ||
    || dakshine cakshamalam ca vahnim vai vamahastake | jatamandalasamlagnashitamshukaramanditam || ||
    nagaharadharam carukankanaih katisutrakaih | virajamanavrishabham vyaghracarmambaravritam || || cintamanimahabrindaih
    kalpakaih kamadhenubhih | catuhshashtikalavidyamurtibhih shrutimastakaih || || ratnasimhasane sadhudvipicarmasamayute
    | tatrashtadalapadmasya karnikayam sushobhane || || virasane samasinam lambadakshapadambujam | jnanamudram
    pustakam ca varabhitidharam haram || || padamulasamakrantamahapasmaravaibhavam | rudrakshamalabharanabhushitam
    bhutibhasuram || || gajacarmottariyam ca mandasmitamukhambujam | siddhabrindairyogibrindairmunibrindairnishevitam
    || || aradhyamanavrishabhamagninduravilocanam | purayantam kripadrishtya pumarthanashrite jane ||
    || evam vibhavayedisham sarvavidyakalanidhim || || lamityadi pancopacarah || stotram om | devadevo
    mahadevo devanamapi deshikah | dakshinamurtirishano dayapuritadinmukhah || || kailasashikharottungakamaniyanijakritih
    | vatadrumatatidivyakanakasanasamsthitah || || katitatapatibhutakaricarmojjvalakritih | patirapandurakaraparipurnasudhadhipah
    | || jatakotiraghatitasudhakarasudhaplutah | pashyallalatasubhagasundarabhruvilasavan || || katakshasaraniniryatkarunapurnalocanah
    | karnalolatatidvarnakundalojjvalagandabhuh || || tilaprasunasankashanasikaputabhasurah | mandasmitasphuranmugdhamahaniyamukhambujah
    || || kundakudmalasamspardhidantapanktivirajitah | sindurarunasusnigdhakomaladharapallavah || || shankhatopagaladdivyagalavaibhavamanjulah
    | karakandalitajnanamudrarudrakshamalikah || || anyahastatalanyastavinapustollasadvapuh | vishalaruciroraskavalimatpallavodarah
    || || brihatkatinitambadhyah pivarorudvayanvitah | janghavijitatunirastungagulphayugojjvalah || ||
    mridupatalapadabjashcandrabhanakhadidhitih | apasavyoruvinyastasavyapadasaroruhah || || ghorapasmaranikshiptadhiradakshapadambujah
    | sanakadimunidhyeyah sarvabharanabhushitah || || divyacandanaliptangashcaruhasaparishkritah | karpuradhavalakarah
    kandarpashatasundarah || || katyayanipremanidhih karunarasavaridhih | kamitarthapradah shrimatkamalavallabhapriyah
    || || katakshitatmavijnanah kaivalyanandakandalah | mandahasasamanendushchinnajnanatamastatih || ||
    samsaranalasantaptajanatamritasagarah | gambhirahridayambhojanabhomaninibhakritih || || nishakarakarakaravashikritajagattrayah
    | tapasaradhyapadabjastarunanandavigrahah || || bhutibhushitasarvango bhutadhipatirishvarah | vadanendusmitajyotsnanilinatripurakritih
    || || tapatrayatamobhanuh paparanyadavanalah | samsarasagaroddharta hamsagryopasyavigrahah || || lalatahutabhugdagdhamanobhavashubhakritih
    | tucchikritajagajjalastusharakarashitalah || || astangatasamasteccho nistulanandamantharah | dhirodattagunadhara
    udaravaravaibhavah || || aparakarunamurtirajnanadhvantabhaskarah | bhaktamanasahamsagryo bhavamayabhishaktamah
    || || yogindrapujyapadabjo yogapattollasatkatih | shuddhasphatikasankasho baddhapannagabhushanah ||
    || nanamunisamakirno nasagranyastalocanah | vedamurdhaikasamvedyo nadadhyanaparayanah || || dharadharenduranandasandoharasasagarah
    | dvaitabrindavimohandhyaparakritadrigadbhutah || || pratyagatma paranjyotih puranah parameshvarah
    | prapancopashamah prajnah punyakirtih puratanah || || sarvadhishthanasanmatrah svatmabandhaharo harah
    | sarvapremanijahasah sarvanugrahakricchivah || || sarvendriyagunabhasah sarvabhutagunashrayah | saccidanandapurnatma
    sarvabhutagunashrayah || || sarvabhutantarah sakshi sarvajnah sarvakamadah | sanakadimahayogisamaradhitapadukah
    || || adidevo dayasindhuh shikshitasuravigrahah | yakshakinnaragandharvastuyamanatmavaibhavah || ||
    brahmadidevavinuto yogamayaniyojakah | shivayogi shivanandah shivabhaktasamuddharah || || vedantasarasandohah
    sarvasattvavalambanah | vatamulashrayo vagmi manyo malayajapriyah || || sushilo vanchitarthajnah prasannavadanekshanah
    | nrittagitakalabhijnah karmavitkarmamocakah || || karmasakshi karmamayah karmanam ca phalapradah
    | jnanadata sadacarah sarvopadravamocakah || || anathanatho bhagavanashritamarapadapah | varapradah
    prakashatma sarvabhutahite ratah || || vyaghracarmasanasina adikarta maheshvarah | suvikramah sarvagato
    vishishtajanavatsalah || || cintashokaprashamano jagadanandakarakah | rashmiman bhuvaneshashca devasurasupujitah
    || || mrityunjayo vyomakeshah shattrimshattattvasangrahah | ajnatasambhavo bhikshuradvitiyo digambarah
    || || samastadevatamurtih somasuryagnilocanah | sarvasamrajyanipuno dharmamargapravartakah || || vishvadhikah
    pashupatih pashupashavimocakah | ashtamurtirdiptamurtirnamoccaranamuktidah || || sahasradityasankashah
    sadashodashavarshikah | divyakelisamayukto divyamalyambaravritah || || anargharatnasampurno mallikakusumapriyah
    | taptacamikarakaro jitadavanalakritih || || niranjano nirvikaro nijavaso nirakritih | jagadgururjagatkarta
    jagadisho jagatpatih || || kamahanta kamamurtih kalyanavrishavahanah | gangadharo mahadevo dinabandhavimocakah
    || || dhurjatih khandaparashuh sadguno girijasakhah | avyayo bhutaseneshah papaghnah punyadayakah
    || || upadeshta dridhaprajno rudro rogavinashanah | nityanando niradharo haro devashikhamanih || ||
    pranatartiharah somah sandranando mahamatih | ashcaryavaibhavo devah samsararnavatarakah || || yajnesho
    rajarajesho bhasmarudrakshalanchanah | anantastarakah sthanuh sarvavidyeshvaro harih || || vishvarupo
    virupakshah prabhuh paribridho dridhah | bhavyo jitarishadvargo mahodaro vishashanah || || sukirtiradipurusho
    jaramaranavarjitah | pramanabhuto durjneyah punyah parapuranjayah || || gunakaro gunashreshthah saccidanandavigrahah
    | sukhadah karanam karta bhavabandhavimocakah || || anirvinno gunagrahi nishkalankah kalankaha | purushah
    shashvato yogi vyaktavyaktah sanatanah || || caracaratma sukshmatma vishvakarma tamopahrit | bhujangabhushano
    bhargastarunah karunalayah || || animadigunopeto lokavashyavidhayakah | yogapattadharo mukto muktanam
    parama gatih || || gururupadharah shrimatparamanandasagarah | sahasrabahuh sarveshah sahasravayavanvitah
    || || sahasramurdha sarvatma sahasrakshah sahasrapat | nirabhasah sukshmatanurhridi jnatah paratparah
    || || sarvatmagah sarvasakshi nihsango nirupadravah | nishkalah sakaladhyakshashcinmayastamasah parah
    || || jnanavairagyasampanno yoganandamayah shivah | shashvataishvaryasampurno mahayogishvareshvarah
    || || sahasrashaktisamyuktah punyakayo durasadah | tarakabrahmasampurnastapasvijanasamvritah || ||
    vidhindramarasampujyo jyotisham jyotiruttamah | niraksharo niralambah svatmaramo vikartanah || ||
    niravadyo niratanko bhimo bhimaparakramah | virabhadrah puraratirjalandharashiroharah || || andhakasurasamharta
    bhaganetrabhidadbhutah | vishvagraso'dharmashatrurbrahmajnanaikamantharah || || agresarastirthabhutah
    sitabhasmavakunthanah | akunthamedhah shrikantho vaikunthaparamapriyah || || lalatojjvalanetrabjastusharakarashekharah
    | gajasurashirashchetta gangodbhasitamurdhajah || || kalyanacalakodandah kamalapatisayakah | varamshevadhitunirah
    sarojasanasarathih || || trayiturangasankranto vasukijyavirajitah | ravinducaranacaridhararathavirajitah
    || || trayyantapragrahodaracarughantaravojjvalah | uttanaparvalomadhyo lilavijitamanmathah || || jatuprapannajanatajivanopayanotsukah
    | samsararnavanirmagnasamuddharanapanditah || || madadviradadhikkarigatimanjulavaibhavah | mattakokilamadhuryarasanirbharagirganah
    || || kaivalyodadhikallolalilatandavapanditah | vishnurjishnurvasudevah prabhavishnuh puratanah ||
    || vardhishnurvarado vaidyo harirnarayano'cyutah | ajnanavanadavagnih prajnaprasadabhupatih || ||
    sarpabhushitasarvangah karpurojjvalitakritih | anadimadhyanidhano girisho girijapatih || || vitarago
    vinitatma tapasvi bhutabhavanah | devasuragurudhyeyo devasuranamaskritah || || devadidevo devarshirdevasuravarapradah
    | sarvadevamayo'cintyo devatma catmasambhavah || || nirlepo nishprapancatma nirvighno vighnanashakah
    | ekajyotirniratanko vyaptamurtiranakulah || || niravadyapadopadhirvidyarashiranuttamah | nityanandah
    suradhyaksho nihsankalpo niranjanah || || nishkalanko nirakaro nishprapanco niramayah | vidyadharo
    viyatkesho markandeyavarapradah || || bhairavo bhairavinathah kamadah kamalasanah | vedavedyah suranando
    lasajjyotih prabhakarah || || cudamanih suradhisho yajnageyo haripriyah | nirlepo nitiman sutri shrihalahalasundarah
    || || dharmadaksho maharajah kiriti vandito guhah | madhavo yamininathah shambarah shabaripriyah ||
    || sangitavetta lokajnah shantah kalashasambhavah | brahmanyo varado nityah shuli guruvaro harah ||
    || martandah pundarikaksho lokanayakavikramah | mukundarcyo vaidyanathah purandaravarapradah || ||
    bhashavihino bhashajno vighnesho vighnanashanah | kinnaresho brihadbhanuh shrinivasah kapalabhrit
    || || vijayo bhutabhavajno bhimaseno divakarah | bilvapriyo vasishtheshah sarvamargapravartakah ||
    || oshadhisho vamadevo govindo nilalohitah | shadardhanayanah shrimanmahadevo vrishadhvajah || ||
    karpuradipikalolah karpurarasacarcitah | avyajakarunamurtistyagarajah kshapakarah || || ashcaryavigrahah
    sukshmah siddheshah svarnabhairavah | devarajah kripasindhuradvayo'mitavikramah || || nirbhedo nityasatvastho
    niryogakshema atmavan | nirapayo nirasango nihshabdo nirupadhikah || || bhavah sarveshvarah svami
    bhavabhitivibhanjanah | daridryatrinakutagnirdaritasurasantatih || || muktido mudito'kubjo dharmiko
    bhaktavatsalah | abhyasatishayajneyashcandramaulih kaladharah || || mahabalo mahaviryo vibhuh shrishah
    shubhapradah | siddhah puranapurusho ranamandalabhairavah || || sadyojato vataranyavasi purushavallabhah
    | harikesho mahatrata nilagrivah sumangalah || || hiranyabahustikshnamshuh kameshah somavigrahah |
    sarvatma sarvakarta ca tandavo mundamalikah || || agraganyah sugambhiro deshiko vaidikottamah | prasannadevo
    vagishashcintatimirabhaskarah || || gauripatistungamaulirmakharajo mahakavih | shridharah sarvasiddhesho
    vishvanatho dayanidhih || || antarmukho bahirdrishtih siddhaveshamanoharah | krittivasah kripasindhurmantrasiddho
    matipradah || || mahotkrishtah punyakaro jagatsakshi sadashivah | mahakraturmahayajva vishvakarma
    taponidhih || || chandomayo mahajnani sarvajno devavanditah | sarvabhaumah sadanandah karunamritavaridhih
    || || kalakalah kalidhvamsi jaramarananashakah | shitikanthashcidanando yoginiganasevitah || || candishah
    shukasamvedyah punyashloko divaspatih | sthayi sakalatattvatma sadasevakavardhanah || || rohitashvah
    kshamarupi taptacamikaraprabhah | triyambako vararucirdevadevashcaturbhujah || || vishvambharo vicitrango
    vidhata purashasanah | subrahmanyo jagatsvami rohitakshah shivottamah || || nakshatramalabharano maghavan
    aghanashanah | vidhikarta vidhanajnah pradhanapurusheshvarah || || cintamanih suragururdhyeyo nirajanapriyah
    | govindo rajarajesho bahupushparcanapriyah || || sarvanando dayarupi shailajasumanoharah | suvikramah
    sarvagato hetusadhanavarjitah || || vrishanko ramaniyangah sadanghrih samaparagah | mantratma kotikandarpasaundaryarasavaridhih
    || || yajnesho yajnapurushah srishtisthityantakaranam | parahamsaikajijnasyah svaprakashasvarupavan
    || || munimrigyo devamrigyo mrigahasto mrigeshvarah | mrigendracarmavasano narasimhanipatanah || ||
    munivandyo munishreshtho munibrindanishevitah | dushtamrityuradushteho mrityuha mrityupujitah || ||
    avyakto'mbujajanmadikotikotisupujitah | lingamurtiralingatma lingatma lingavigrahah || || yajurmurtih
    samamurtirrinmurtirmurtivarjitah | vishvesho gajacarmaikacelancitakatitatah || || pavanantevasadyogijanasarthasudhakarah
    | anantasomasuryagnimandalapratimaprabhah || || cintashokaprashamanah sarvavidyavisharadah | bhaktavijnaptisandhata
    karta girivarakritih || || jnanaprado manovasah kshemyo mohavinashanah | surottamashcitrabhanuh sadavaibhavatatparah
    || || suhridagresarah siddhajnanamudro ganadhipah | agamashcarmavasano vanchitarthaphalapradah ||
    || antarhito'samanashca devasimhasanadhipah | vivadahanta sarvatma kalah kalavivarjitah || || vishvatito
    vishvakarta vishvesho vishvakaranam | yogidhyeyo yoganishtho yogatma yogavittamah || || onkararupo
    bhagavan bindunadamayah shivah | caturmukhadisamstutyashcaturvargaphalapradah || || sahyacalaguhavasi
    sakshanmoksharasamritah | dakshadhvarasamucchetta pakshapatavivarjitah || || onkaravacakah shambhuh
    shankarah shashishitalah | pankajasanasamsevyah kinkaramaravatsalah || || natadaurbhagyatulagnih kritakautukamangalah
    | trilokamohanah shrimattripundrankitamastakah || || krauncarijanakah shrimadgananathasutanvitah |
    adbhutanantavarado'paricchinatmavaibhavah || || ishtapurtapriyah sharva ekavirah priyamvadah | uhapohavinirmukta
    onkareshvarapujitah || || rudrakshavaksha rudraksharupo rudrakshapakshakah | bhujagendralasatkantho
    bhujangabharanapriyah || || kalyanarupah kalyanah kalyanagunasamshrayah | sundarabhruh sunayanah sulalatah
    sukandharah || || vidvajjanashrayo vidvajjanastavyaparakramah | vinitavatsalo nitisvarupo nitisamshrayah
    || || atiragi vitaragi ragaheturviragavit | ragaha ragashamano ragado ragiragavit || || manonmano
    manorupo balapramathano balah | vidyakaro mahavidyo vidyavidyavisharadah || || vasantakridvasantatma
    vasantesho vasantadah | pravritkrit pravridakarah pravritkalapravartakah || || sharannatho sharatkalanashakah
    sharadashrayah | kundamandarapushpaughalasadvayunishevitah || || divyadehaprabhakutasandipitadigantarah
    | devasuragurustavyo devasuranamaskritah || || vamangabhagavilasacchyamalavikshanapriyah | kirtyadharah
    kirtikarah kirtiheturahetukah || || sharanagatadinartaparitranaparayanah | mahapretasanasino jitasarvapitamahah
    || || muktadamaparitango nanaganavisharadah | vishnubrahmadivandyanghrirnanadeshaikanayakah || ||
    dhirodatto mahadhiro dhairyado dhairyavardhakah | vijnanamaya anandamayah pranamayo'nnadah || || bhavabdhitaranopayah
    kavirduhsvapnanashanah | gaurivilasasadanah pishacanucaravritah || || dakshinapremasantushto daridryavadavanalah
    | adbhutanantasangramo dhakkavadanatatparah || || pracyatma dakshinakarah praticyatmottarakritih |
    urdhvadyanyadigakaro marmajnah sarvashikshakah || || yugavaho yugadhisho yugatma yuganayakah | jangamah
    sthavarakarah kailasashikharapriyah || || hastarajatpundarikah pundarikanibhekshanah | lilavidambitavapurbhaktamanasamanditah
    || || brindarakapriyatamo brindarakavararcitah | nanavidhanekaratnalasatkundalamanditah || || nihsimamahima
    nityalilavigraharupadhrit | candanadravadigdhangashcampeyakusumarcitah || || samastabhaktasukhadah
    paramanurmahahradah | alaukiko dushpradharshah kapilah kalakandharah || || karpuragaurah kushalah
    satyasandho jitendriyah | shashvataishvaryavibhavah poshakah susamahitah || || maharshinathito brahmayonih
    sarvottamottamah | bhumibharartisamharta shadurmirahito mridah || || trivishtapeshvarah sarvahridayambujamadhyagah
    | sahasradalapadmasthah sarvavarnopashobhitah || || punyamurtih punyalabhyah punyashravanakirtanah
    | suryamandalamadhyasthashcandramandalamadhyagah || || sadbhaktadhyananigalah sharanagatapalakah |
    shvetatapatrarucirah shvetacamaravijitah || || sarvavayavasampurnah sarvalakshanalakshitah | sarvamangalamangalyah
    sarvakaranakaranah || || amodo modajanakah sarparajottariyakah | kapali kovidah siddhakantisamvalitananah
    || || sarvasadgurusamsevyo divyacandanacarcitah | vilasinikritollasa icchashaktinishevitah || || anantanandasukhado
    nandanah shriniketanah | amritabdhikritavaso nityaklibo niramayah || || anapayo'nantadrishtiraprameyo'jaro'marah
    | tamomohapratihatirapratarkyo'mrito'ksharah || || amoghabuddhiradhara adharadheyavarjitah | ishanatrayanirmukta
    ihamutravivarjitah || || rigyajuhsamanayano buddhisiddhisamriddhidah | audaryanidhirapurna aihikamushmikapradah
    || || shuddhasanmatrasamviddhisvarupasukhavigrahah | darshanaprathamabhaso drishtidrishyavivarjitah
    || || agraganyo'cintyarupah kalikalmashanashanah | vimarsharupo vimalo nityarupo nirashrayah || ||
    nityashuddho nityabuddho nityamukto'parakritah | maitryadivasanalabhyo mahapralayasamsthitah || ||
    mahakailasanilayah prajnanaghanavigrahah | shriman vyaghrapuravaso bhuktimuktipradayakah || || jagadyonirjagatsakshi
    jagadisho jaganmayah | japo japaparo japyo vidyasimhasanaprabhuh || || tattvanam prakritistattvam
    tattvampadanirupitah | dikkaladyanavacchinnah sahajanandasagarah || || prakritih prakritatito vijnanaikarasakritih
    | nihshankamatidurasthashcaityacetanacintanah || || tarakanam hridantasthastarakastarakantakah | dhyanaikaprakato
    dhyeyo dhyani dhyanavibhushanah || || param vyoma param dhama paramatma param padam | purnanandah
    sadanando nadamadhyapratishthitah || || pramaviparyayatitah pranatajnananashakah | banarcitanghrirbahudo
    balakelikutuhali || || brahmarupi brahmapadam brahmavidbrahmanapriyah | bhukshepadattalakshmiko bhrumadhyadhyanalakshitah
    || || yashaskaro ratnagarbho maharajyasukhapradah | shabdabrahma shamaprapyo labhakrillokavishrutah
    || || shasta shivadrinilayah sharanyo yajakapriyah | samsaravaidyah sarvajnah sabheshajavibheshajah
    || || manovacobhiragrahyah pancakoshavilakshanah | avasthatrayanirmuktastvavasthasakshituryakah ||
    || pancabhutadidurasthah pratyagekaraso'vyayah | shatcakrantargatollasi shadvikaravivarjitah || ||
    vijnanaghanasampurno vinavadanatatparah | niharakaragaurango mahalavanyavaridhih || || parabhicarashamanah
    shadadhvoparisamsthitah | sushumnamargasancari bisatantunibhakritih || || pinaki lingarupashrih mangalavayavojjvalah
    | kshetradhipah susamvedyah shriprado vibhavapradah || || sarvavashyakarah sarvadoshaha putrapautradah
    | tailadipapriyastailapakvannapritamanasah || || tailabhishekasantushtastilabhakshanatatparah | apadakanikamuktabhushashatamanoharah
    || || shanollidhamanishreniramyanghrinakhamandalah | manimanjirakiranakinjalkitapadambujah || || apasmaroparinyastasavyapadasaroruhah
    | kandarpatunabhajangho gulphodancitanupurah || || karihastopameyoruradarshojjvalajanubhrit | vishankatakatinyastavacalamanimekhalah
    || || avartanabhiromalivalimatpallavodarah | muktaharalasattungavipuloraskaranjitah || || virasanasamasino
    vinapustollasatkarah | akshamalalasatpanishcinmudritakarambujah || || manikyakankanollasikarambujavirajitah
    | anargharatnagraiveyavilasatkambukandharah || || anakalitasadrishyacibukashrivirajitah | mugdhasmitaparipakaprakashitaradankurah
    || || carucampeyapushpabhanasikaputaranjitah | varavajrashiladarshaparibhavikapolabhuh || || karnadvayollasaddivyamanikundalamanditah
    | karunalaharipurnakarnantayatalocanah || || ardhacandrabhanitilapatiratilakojjvalah | carucamikarakarajatacarcitacandanah
    | kailasashikharasphardhikamaniyanijakritih || || iti shri dakshinamurti sahasranama stotram ||
  devanagari: अस्य श्रीदक्षिणामूर्ति सहस्रनामस्तोत्रस्य ब्रह्मा ऋषिः अनुष्टुप् छन्दः श्रीदक्षिणामूर्तिर्देवता
    ॐ बीजं स्वाहा शक्तिः नमः कीलकं मेधादक्षिणामूर्ति प्रसादसिद्ध्यर्थे जपे विनियोगः ॥ ह्रामित्यादिना न्यासः
    ॥ ध्यानं सिद्धितोयनिधेर्मध्ये रत्नग्रैवे मनोरमे । कदम्बवनिकामध्ये श्रीमद्वटतरोरधः ॥ ॥ आसीनमाद्यं पुरुषमादिमध्यान्तवर्जितम्
    । शुद्धस्फटिकगोक्षीरशरत्पूर्णेन्दुशेखरम् ॥ ॥ दक्षिणे चाक्षमालां च वह्निं वै वामहस्तके । जटामण्डलसंलग्नशीतांशुकरमण्डितम्
    ॥ ॥ नागहारधरं चारुकङ्कणैः कटिसूत्रकैः । विराजमानवृषभं व्याघ्रचर्माम्बरावृतम् ॥ ॥ चिन्तामणिमहाबृन्दैः
    कल्पकैः कामधेनुभिः । चतुःषष्टिकलाविद्यामूर्तिभिः श्रुतिमस्तकैः ॥ ॥ रत्नसिंहासने साधुद्वीपिचर्मसमायुते
    । तत्राष्टदलपद्मस्य कर्णिकायां सुशोभने ॥ ॥ वीरासने समासीनं लम्बदक्षपदाम्बुजम् । ज्ञानमुद्रां पुस्तकं
    च वराभीतिधरं हरम् ॥ ॥ पादमूलसमाक्रान्तमहापस्मारवैभवम् । रुद्राक्षमालाभरणभूषितं भूतिभासुरम् ॥ ॥ गजचर्मोत्तरीयं
    च मन्दस्मितमुखाम्बुजम् । सिद्धबृन्दैर्योगिबृन्दैर्मुनिबृन्दैर्निषेवितम् ॥ ॥ आराध्यमानवृषभमग्नीन्दुरविलोचनम्
    । पूरयन्तं कृपादृष्ट्या पुमर्थानाश्रिते जने ॥ ॥ एवं विभावयेदीशं सर्वविद्याकलानिधिम् ॥ ॥ लमित्यादि
    पञ्चोपचाराः ॥ स्तोत्रं ओम् । देवदेवो महादेवो देवानामपि देशिकः । दक्षिणामूर्तिरीशानो दयापूरितदिङ्मुखः
    ॥ ॥ कैलासशिखरोत्तुङ्गकमनीयनिजाकृतिः । वटद्रुमतटीदिव्यकनकासनसंस्थितः ॥ ॥ कटीतटपटीभूतकरिचर्मोज्ज्वलाकृतिः
    । पाटीरपाण्डुराकारपरिपूर्णसुधाधिपः । ॥ जटाकोटीरघटितसुधाकरसुधाप्लुतः । पश्यल्ललाटसुभगसुन्दरभ्रूविलासवान्
    ॥ ॥ कटाक्षसरणीनिर्यत्करुणापूर्णलोचनः । कर्णालोलतटिद्वर्णकुण्डलोज्ज्वलगण्डभूः ॥ ॥ तिलप्रसूनसङ्काशनासिकापुटभासुरः
    । मन्दस्मितस्फुरन्मुग्धमहनीयमुखाम्बुजः ॥ ॥ कुन्दकुड्मलसंस्पर्धिदन्तपङ्क्तिविराजितः । सिन्दूरारुणसुस्निग्धकोमलाधरपल्लवः
    ॥ ॥ शङ्खाटोपगलद्दिव्यगलवैभवमञ्जुलः । करकन्दलितज्ञानमुद्रारुद्राक्षमालिकः ॥ ॥ अन्यहस्ततलन्यस्तवीणापुस्तोल्लसद्वपुः
    । विशालरुचिरोरस्कवलिमत्पल्लवोदरः ॥ ॥ बृहत्कटिनितम्बाढ्यः पीवरोरुद्वयान्वितः । जङ्घाविजिततूणीरस्तुङ्गगुल्फयुगोज्ज्वलः
    ॥ ॥ मृदुपाटलपादाब्जश्चन्द्राभनखदीधितिः । अपसव्योरुविन्यस्तसव्यपादसरोरुहः ॥ ॥ घोरापस्मारनिक्षिप्तधीरदक्षपदाम्बुजः
    । सनकादिमुनिध्येयः सर्वाभरणभूषितः ॥ ॥ दिव्यचन्दनलिप्ताङ्गश्चारुहासपरिष्कृतः । कर्पूरधवलाकारः कन्दर्पशतसुन्दरः
    ॥ ॥ कात्यायनीप्रेमनिधिः करुणारसवारिधिः । कामितार्थप्रदः श्रीमत्कमलावल्लभप्रियः ॥ ॥ कटाक्षितात्मविज्ञानः
    कैवल्यानन्दकन्दलः । मन्दहाससमानेन्दुश्छिन्नाज्ञानतमस्ततिः ॥ ॥ संसारानलसन्तप्तजनतामृतसागरः । गम्भीरहृदयाम्भोजनभोमणिनिभाकृतिः
    ॥ ॥ निशाकरकराकारवशीकृतजगत्त्रयः । तापसाराध्यपादाब्जस्तरुणानन्दविग्रहः ॥ ॥ भूतिभूषितसर्वाङ्गो भूताधिपतिरीश्वरः
    । वदनेन्दुस्मितज्योत्स्नानिलीनत्रिपुराकृतिः ॥ ॥ तापत्रयतमोभानुः पापारण्यदवानलः । संसारसागरोद्धर्ता
    हंसाग्र्योपास्यविग्रहः ॥ ॥ ललाटहुतभुग्दग्धमनोभवशुभाकृतिः । तुच्छीकृतजगज्जालस्तुषारकरशीतलः ॥ ॥ अस्तङ्गतसमस्तेच्छो
    निस्तुलानन्दमन्थरः । धीरोदात्तगुणाधार उदारवरवैभवः ॥ ॥ अपारकरुणामूर्तिरज्ञानध्वान्तभास्करः । भक्तमानसहंसाग्र्यो
    भवामयभिषक्तमः ॥ ॥ योगीन्द्रपूज्यपादाब्जो योगपट्टोल्लसत्कटिः । शुद्धस्फटिकसङ्काशो बद्धपन्नगभूषणः ॥
    ॥ नानामुनिसमाकीर्णो नासाग्रन्यस्तलोचनः । वेदमूर्धैकसंवेद्यो नादध्यानपरायणः ॥ ॥ धराधरेन्दुरानन्दसन्दोहरससागरः
    । द्वैतबृन्दविमोहान्ध्यपराकृतदृगद्भुतः ॥ ॥ प्रत्यगात्मा परञ्ज्योतिः पुराणः परमेश्वरः । प्रपञ्चोपशमः
    प्राज्ञः पुण्यकीर्तिः पुरातनः ॥ ॥ सर्वाधिष्ठानसन्मात्रः स्वात्मबन्धहरो हरः । सर्वप्रेमनिजाहासः सर्वानुग्रहकृच्छिवः
    ॥ ॥ सर्वेन्द्रियगुणाभासः सर्वभूतगुणाश्रयः । सच्चिदानन्दपूर्णात्मा सर्वभूतगुणाश्रयः ॥ ॥ सर्वभूतान्तरः
    साक्षी सर्वज्ञः सर्वकामदः । सनकादिमहायोगिसमाराधितपादुकः ॥ ॥ आदिदेवो दयासिन्धुः शिक्षितासुरविग्रहः
    । यक्षकिन्नरगन्धर्वस्तूयमानात्मवैभवः ॥ ॥ ब्रह्मादिदेवविनुतो योगमायानियोजकः । शिवयोगी शिवानन्दः शिवभक्तसमुद्धरः
    ॥ ॥ वेदान्तसारसन्दोहः सर्वसत्त्वावलम्बनः । वटमूलाश्रयो वाग्मी मान्यो मलयजप्रियः ॥ ॥ सुशीलो वाञ्छितार्थज्ञः
    प्रसन्नवदनेक्षणः । नृत्तगीतकलाभिज्ञः कर्मवित्कर्ममोचकः ॥ ॥ कर्मसाक्षी कर्ममयः कर्मणां च फलप्रदः ।
    ज्ञानदाता सदाचारः सर्वोपद्रवमोचकः ॥ ॥ अनाथनाथो भगवानाश्रितामरपादपः । वरप्रदः प्रकाशात्मा सर्वभूतहिते
    रतः ॥ ॥ व्याघ्रचर्मासनासीन आदिकर्ता महेश्वरः । सुविक्रमः सर्वगतो विशिष्टजनवत्सलः ॥ ॥ चिन्ताशोकप्रशमनो
    जगदानन्दकारकः । रश्मिमान् भुवनेशश्च देवासुरसुपूजितः ॥ ॥ मृत्युञ्जयो व्योमकेशः षट्त्रिंशत्तत्त्वसङ्ग्रहः
    । अज्ञातसम्भवो भिक्षुरद्वितीयो दिगम्बरः ॥ ॥ समस्तदेवतामूर्तिः सोमसूर्याग्निलोचनः । सर्वसाम्राज्यनिपुणो
    धर्ममार्गप्रवर्तकः ॥ ॥ विश्वाधिकः पशुपतिः पशुपाशविमोचकः । अष्टमूर्तिर्दीप्तमूर्तिर्नामोच्चारणमुक्तिदः
    ॥ ॥ सहस्रादित्यसङ्काशः सदाषोडशवार्षिकः । दिव्यकेलीसमायुक्तो दिव्यमाल्याम्बरावृतः ॥ ॥ अनर्घरत्नसम्पूर्णो
    मल्लिकाकुसुमप्रियः । तप्तचामीकराकारो जितदावानलाकृतिः ॥ ॥ निरञ्जनो निर्विकारो निजावासो निराकृतिः ।
    जगद्गुरुर्जगत्कर्ता जगदीशो जगत्पतिः ॥ ॥ कामहन्ता काममूर्तिः कल्याणवृषवाहनः । गङ्गाधरो महादेवो दीनबन्धविमोचकः
    ॥ ॥ धूर्जटिः खण्डपरशुः सद्गुणो गिरिजासखः । अव्ययो भूतसेनेशः पापघ्नः पुण्यदायकः ॥ ॥ उपदेष्टा दृढप्रज्ञो
    रुद्रो रोगविनाशनः । नित्यानन्दो निराधारो हरो देवशिखामणिः ॥ ॥ प्रणतार्तिहरः सोमः सान्द्रानन्दो महामतिः
    । आश्चर्यवैभवो देवः संसारार्णवतारकः ॥ ॥ यज्ञेशो राजराजेशो भस्मरुद्राक्षलाञ्छनः । अनन्तस्तारकः स्थाणुः
    सर्वविद्येश्वरो हरिः ॥ ॥ विश्वरूपो विरूपाक्षः प्रभुः परिबृढो दृढः । भव्यो जितारिषड्वर्गो महोदारो विषाशनः
    ॥ ॥ सुकीर्तिरादिपुरुषो जरामरणवर्जितः । प्रमाणभूतो दुर्ज्ञेयः पुण्यः परपुरञ्जयः ॥ ॥ गुणाकरो गुणश्रेष्ठः
    सच्चिदानन्दविग्रहः । सुखदः कारणं कर्ता भवबन्धविमोचकः ॥ ॥ अनिर्विण्णो गुणग्राही निष्कलङ्कः कलङ्कहा
    । पुरुषः शाश्वतो योगी व्यक्ताव्यक्तः सनातनः ॥ ॥ चराचरात्मा सूक्ष्मात्मा विश्वकर्मा तमोपहृत् । भुजङ्गभूषणो
    भर्गस्तरुणः करुणालयः ॥ ॥ अणिमादिगुणोपेतो लोकवश्यविधायकः । योगपट्टधरो मुक्तो मुक्तानां परमा गतिः ॥
    ॥ गुरुरूपधरः श्रीमत्परमानन्दसागरः । सहस्रबाहुः सर्वेशः सहस्रावयवान्वितः ॥ ॥ सहस्रमूर्धा सर्वात्मा
    सहस्राक्षः सहस्रपात् । निराभासः सूक्ष्मतनुर्हृदि ज्ञातः परात्परः ॥ ॥ सर्वात्मगः सर्वसाक्षी निःसङ्गो
    निरुपद्रवः । निष्कलः सकलाध्यक्षश्चिन्मयस्तमसः परः ॥ ॥ ज्ञानवैराग्यसम्पन्नो योगानन्दमयः शिवः । शाश्वतैश्वर्यसम्पूर्णो
    महायोगीश्वरेश्वरः ॥ ॥ सहस्रशक्तिसंयुक्तः पुण्यकायो दुरासदः । तारकब्रह्मसम्पूर्णस्तपस्विजनसंवृतः ॥
    ॥ विधीन्द्रामरसम्पूज्यो ज्योतिषां ज्योतिरुत्तमः । निरक्षरो निरालम्बः स्वात्मारामो विकर्तनः ॥ ॥ निरवद्यो
    निरातङ्को भीमो भीमपराक्रमः । वीरभद्रः पुरारातिर्जलन्धरशिरोहरः ॥ ॥ अन्धकासुरसंहर्ता भगनेत्रभिदद्भुतः
    । विश्वग्रासोऽधर्मशत्रुर्ब्रह्मज्ञानैकमन्थरः ॥ ॥ अग्रेसरस्तीर्थभूतः सितभस्मावकुण्ठनः । अकुण्ठमेधाः
    श्रीकण्ठो वैकुण्ठपरमप्रियः ॥ ॥ ललाटोज्ज्वलनेत्राब्जस्तुषारकरशेखरः । गजासुरशिरश्छेत्ता गङ्गोद्भासितमूर्धजः
    ॥ ॥ कल्याणाचलकोदण्डः कमलापतिसायकः । वारांशेवधितूणीरः सरोजासनसारथिः ॥ ॥ त्रयीतुरङ्गसङ्क्रान्तो वासुकिज्याविराजितः
    । रवीन्दुचरणाचारिधरारथविराजितः ॥ ॥ त्रय्यन्तप्रग्रहोदारचारुघण्टारवोज्ज्वलः । उत्तानपर्वलोमाढ्यो लीलाविजितमन्मथः
    ॥ ॥ जातुप्रपन्नजनताजीवनोपायनोत्सुकः । संसारार्णवनिर्मग्नसमुद्धरणपण्डितः ॥ ॥ मदद्विरदधिक्कारिगतिमञ्जुलवैभवः
    । मत्तकोकिलमाधुर्यरसनिर्भरगीर्गणः ॥ ॥ कैवल्योदधिकल्लोललीलाताण्डवपण्डितः । विष्णुर्जिष्णुर्वासुदेवः
    प्रभविष्णुः पुरातनः ॥ ॥ वर्धिष्णुर्वरदो वैद्यो हरिर्नारायणोऽच्युतः । अज्ञानवनदावाग्निः प्रज्ञाप्रासादभूपतिः
    ॥ ॥ सर्पभूषितसर्वाङ्गः कर्पूरोज्ज्वलिताकृतिः । अनादिमध्यनिधनो गिरीशो गिरिजापतिः ॥ ॥ वीतरागो विनीतात्मा
    तपस्वी भूतभावनः । देवासुरगुरुध्येयो देवासुरनमस्कृतः ॥ ॥ देवादिदेवो देवर्षिर्देवासुरवरप्रदः । सर्वदेवमयोऽचिन्त्यो
    देवात्मा चात्मसम्भवः ॥ ॥ निर्लेपो निष्प्रपञ्चात्मा निर्विघ्नो विघ्ननाशकः । एकज्योतिर्निरातङ्को व्याप्तमूर्तिरनाकुलः
    ॥ ॥ निरवद्यपदोपाधिर्विद्याराशिरनुत्तमः । नित्यानन्दः सुराध्यक्षो निःसङ्कल्पो निरञ्जनः ॥ ॥ निष्कलङ्को
    निराकारो निष्प्रपञ्चो निरामयः । विद्याधरो वियत्केशो मार्कण्डेयवरप्रदः ॥ ॥ भैरवो भैरवीनाथः कामदः कमलासनः
    । वेदवेद्यः सुरानन्दो लसज्ज्योतिः प्रभाकरः ॥ ॥ चूडामणिः सुराधीशो यज्ञगेयो हरिप्रियः । निर्लेपो नीतिमान्
    सूत्री श्रीहालाहलसुन्दरः ॥ ॥ धर्मदक्षो महाराजः किरीटी वन्दितो गुहः । माधवो यामिनीनाथः शम्बरः शबरीप्रियः
    ॥ ॥ सङ्गीतवेत्ता लोकज्ञः शान्तः कलशसम्भवः । ब्रह्मण्यो वरदो नित्यः शूली गुरुवरो हरः ॥ ॥ मार्ताण्डः
    पुण्डरीकाक्षो लोकनायकविक्रमः । मुकुन्दार्च्यो वैद्यनाथः पुरन्दरवरप्रदः ॥ ॥ भाषाविहीनो भाषाज्ञो विघ्नेशो
    विघ्ननाशनः । किन्नरेशो बृहद्भानुः श्रीनिवासः कपालभृत् ॥ ॥ विजयो भूतभावज्ञो भीमसेनो दिवाकरः । बिल्वप्रियो
    वसिष्ठेशः सर्वमार्गप्रवर्तकः ॥ ॥ ओषधीशो वामदेवो गोविन्दो नीललोहितः । षडर्धनयनः श्रीमन्महादेवो वृषध्वजः
    ॥ ॥ कर्पूरदीपिकालोलः कर्पूररसचर्चितः । अव्याजकरुणामूर्तिस्त्यागराजः क्षपाकरः ॥ ॥ आश्चर्यविग्रहः सूक्ष्मः
    सिद्धेशः स्वर्णभैरवः । देवराजः कृपासिन्धुरद्वयोऽमितविक्रमः ॥ ॥ निर्भेदो नित्यसत्वस्थो निर्योगक्षेम
    आत्मवान् । निरपायो निरासङ्गो निःशब्दो निरुपाधिकः ॥ ॥ भवः सर्वेश्वरः स्वामी भवभीतिविभञ्जनः । दारिद्र्यतृणकूटाग्निर्दारितासुरसन्ततिः
    ॥ ॥ मुक्तिदो मुदितोऽकुब्जो धार्मिको भक्तवत्सलः । अभ्यासातिशयज्ञेयश्चन्द्रमौलिः कलाधरः ॥ ॥ महाबलो महावीर्यो
    विभुः श्रीशः शुभप्रदः । सिद्धः पुराणपुरुषो रणमण्डलभैरवः ॥ ॥ सद्योजातो वटारण्यवासी पुरुषवल्लभः । हरिकेशो
    महात्राता नीलग्रीवः सुमङ्गलः ॥ ॥ हिरण्यबाहुस्तीक्ष्णांशुः कामेशः सोमविग्रहः । सर्वात्मा सर्वकर्ता
    च ताण्डवो मुण्डमालिकः ॥ ॥ अग्रगण्यः सुगम्भीरो देशिको वैदिकोत्तमः । प्रसन्नदेवो वागीशश्चिन्तातिमिरभास्करः
    ॥ ॥ गौरीपतिस्तुङ्गमौलिर्मखराजो महाकविः । श्रीधरः सर्वसिद्धेशो विश्वनाथो दयानिधिः ॥ ॥ अन्तर्मुखो बहिर्दृष्टिः
    सिद्धवेषमनोहरः । कृत्तिवासाः कृपासिन्धुर्मन्त्रसिद्धो मतिप्रदः ॥ ॥ महोत्कृष्टः पुण्यकरो जगत्साक्षी
    सदाशिवः । महाक्रतुर्महायज्वा विश्वकर्मा तपोनिधिः ॥ ॥ छन्दोमयो महाज्ञानी सर्वज्ञो देववन्दितः । सार्वभौमः
    सदानन्दः करुणामृतवारिधिः ॥ ॥ कालकालः कलिध्वंसी जरामरणनाशकः । शितिकण्ठश्चिदानन्दो योगिनीगणसेवितः ॥
    ॥ चण्डीशः शुकसंवेद्यः पुण्यश्लोको दिवस्पतिः । स्थायी सकलतत्त्वात्मा सदासेवकवर्धनः ॥ ॥ रोहिताश्वः क्षमारूपी
    तप्तचामीकरप्रभः । त्रियम्बको वररुचिर्देवदेवश्चतुर्भुजः ॥ ॥ विश्वम्भरो विचित्राङ्गो विधाता पुरशासनः
    । सुब्रह्मण्यो जगत्स्वामी रोहिताक्षः शिवोत्तमः ॥ ॥ नक्षत्रमालाभरणो मघवान् अघनाशनः । विधिकर्ता विधानज्ञः
    प्रधानपुरुषेश्वरः ॥ ॥ चिन्तामणिः सुरगुरुर्ध्येयो नीराजनप्रियः । गोविन्दो राजराजेशो बहुपुष्पार्चनप्रियः
    ॥ ॥ सर्वानन्दो दयारूपी शैलजासुमनोहरः । सुविक्रमः सर्वगतो हेतुसाधनवर्जितः ॥ ॥ वृषाङ्को रमणीयाङ्गः सदङ्घ्रिः
    सामपारगः । मन्त्रात्मा कोटिकन्दर्पसौन्दर्यरसवारिधिः ॥ ॥ यज्ञेशो यज्ञपुरुषः सृष्टिस्थित्यन्तकारणम्
    । परहंसैकजिज्ञास्यः स्वप्रकाशस्वरूपवान् ॥ ॥ मुनिमृग्यो देवमृग्यो मृगहस्तो मृगेश्वरः । मृगेन्द्रचर्मवसनो
    नरसिंहनिपातनः ॥ ॥ मुनिवन्द्यो मुनिश्रेष्ठो मुनिबृन्दनिषेवितः । दुष्टमृत्युरदुष्टेहो मृत्युहा मृत्युपूजितः
    ॥ ॥ अव्यक्तोऽम्बुजजन्मादिकोटिकोटिसुपूजितः । लिङ्गमूर्तिरलिङ्गात्मा लिङ्गात्मा लिङ्गविग्रहः ॥ ॥ यजुर्मूर्तिः
    साममूर्तिरृङ्मूर्तिर्मूर्तिवर्जितः । विश्वेशो गजचर्मैकचेलाञ्चितकटीतटः ॥ ॥ पावनान्तेवसद्योगिजनसार्थसुधाकरः
    । अनन्तसोमसूर्याग्निमण्डलप्रतिमप्रभः ॥ ॥ चिन्ताशोकप्रशमनः सर्वविद्याविशारदः । भक्तविज्ञप्तिसन्धाता
    कर्ता गिरिवराकृतिः ॥ ॥ ज्ञानप्रदो मनोवासः क्षेम्यो मोहविनाशनः । सुरोत्तमश्चित्रभानुः सदावैभवतत्परः
    ॥ ॥ सुहृदग्रेसरः सिद्धज्ञानमुद्रो गणाधिपः । आगमश्चर्मवसनो वाञ्छितार्थफलप्रदः ॥ ॥ अन्तर्हितोऽसमानश्च
    देवसिंहासनाधिपः । विवादहन्ता सर्वात्मा कालः कालविवर्जितः ॥ ॥ विश्वातीतो विश्वकर्ता विश्वेशो विश्वकारणम्
    । योगिध्येयो योगनिष्ठो योगात्मा योगवित्तमः ॥ ॥ ओङ्काररूपो भगवान् बिन्दुनादमयः शिवः । चतुर्मुखादिसंस्तुत्यश्चतुर्वर्गफलप्रदः
    ॥ ॥ सह्याचलगुहावासी साक्षान्मोक्षरसामृतः । दक्षाध्वरसमुच्छेत्ता पक्षपातविवर्जितः ॥ ॥ ओङ्कारवाचकः शम्भुः
    शङ्करः शशिशीतलः । पङ्कजासनसंसेव्यः किङ्करामरवत्सलः ॥ ॥ नतदौर्भाग्यतूलाग्निः कृतकौतुकमङ्गलः । त्रिलोकमोहनः
    श्रीमत्त्रिपुण्ड्राङ्कितमस्तकः ॥ ॥ क्रौञ्चारिजनकः श्रीमद्गणनाथसुतान्वितः । अद्भुतानन्तवरदोऽपरिच्छिनात्मवैभवः
    ॥ ॥ इष्टापूर्तप्रियः शर्व एकवीरः प्रियंवदः । ऊहापोहविनिर्मुक्त ओङ्कारेश्वरपूजितः ॥ ॥ रुद्राक्षवक्षा
    रुद्राक्षरूपो रुद्राक्षपक्षकः । भुजगेन्द्रलसत्कण्ठो भुजङ्गाभरणप्रियः ॥ ॥ कल्याणरूपः कल्याणः कल्याणगुणसंश्रयः
    । सुन्दरभ्रूः सुनयनः सुललाटः सुकन्धरः ॥ ॥ विद्वज्जनाश्रयो विद्वज्जनस्तव्यपराक्रमः । विनीतवत्सलो नीतिस्वरूपो
    नीतिसंश्रयः ॥ ॥ अतिरागी वीतरागी रागहेतुर्विरागवित् । रागहा रागशमनो रागदो रागिरागवित् ॥ ॥ मनोन्मनो
    मनोरूपो बलप्रमथनो बलः । विद्याकरो महाविद्यो विद्याविद्याविशारदः ॥ ॥ वसन्तकृद्वसन्तात्मा वसन्तेशो वसन्तदः
    । प्रावृट्कृत् प्रावृडाकारः प्रावृट्कालप्रवर्तकः ॥ ॥ शरन्नाथो शरत्कालनाशकः शरदाश्रयः । कुन्दमन्दारपुष्पौघलसद्वायुनिषेवितः
    ॥ ॥ दिव्यदेहप्रभाकूटसन्दीपितदिगन्तरः । देवासुरगुरुस्तव्यो देवासुरनमस्कृतः ॥ ॥ वामाङ्गभागविलसच्छ्यामलावीक्षणप्रियः
    । कीर्त्याधारः कीर्तिकरः कीर्तिहेतुरहेतुकः ॥ ॥ शरणागतदीनार्तपरित्राणपरायणः । महाप्रेतासनासीनो जितसर्वपितामहः
    ॥ ॥ मुक्तादामपरीताङ्गो नानागानविशारदः । विष्णुब्रह्मादिवन्द्याङ्घ्रिर्नानादेशैकनायकः ॥ ॥ धीरोदात्तो
    महाधीरो धैर्यदो धैर्यवर्धकः । विज्ञानमय आनन्दमयः प्राणमयोऽन्नदः ॥ ॥ भवाब्धितरणोपायः कविर्दुःस्वप्ननाशनः
    । गौरीविलाससदनः पिशचानुचरावृतः ॥ ॥ दक्षिणाप्रेमसन्तुष्टो दारिद्र्यवडवानलः । अद्भुतानन्तसङ्ग्रामो ढक्कावादनतत्परः
    ॥ ॥ प्राच्यात्मा दक्षिणाकारः प्रतीच्यात्मोत्तराकृतिः । ऊर्ध्वाद्यन्यदिगाकारो मर्मज्ञः सर्वशिक्षकः
    ॥ ॥ युगावहो युगाधीशो युगात्मा युगनायकः । जङ्गमः स्थावराकारः कैलासशिखरप्रियः ॥ ॥ हस्तराजत्पुण्डरीकः
    पुण्डरीकनिभेक्षणः । लीलाविडम्बितवपुर्भक्तमानसमण्डितः ॥ ॥ बृन्दारकप्रियतमो बृन्दारकवरार्चितः । नानाविधानेकरत्नलसत्कुण्डलमण्डितः
    ॥ ॥ निःसीममहिमा नित्यलीलाविग्रहरूपधृत् । चन्दनद्रवदिग्धाङ्गश्चाम्पेयकुसुमार्चितः ॥ ॥ समस्तभक्तसुखदः
    परमाणुर्महाह्रदः । अलौकिको दुष्प्रधर्षः कपिलः कालकन्धरः ॥ ॥ कर्पूरगौरः कुशलः सत्यसन्धो जितेन्द्रियः
    । शाश्वतैश्वर्यविभवः पोषकः सुसमाहितः ॥ ॥ महर्षिनाथितो ब्रह्मयोनिः सर्वोत्तमोत्तमः । भूमिभारार्तिसंहर्ता
    षडूर्मिरहितो मृडः ॥ ॥ त्रिविष्टपेश्वरः सर्वहृदयाम्बुजमध्यगः । सहस्रदलपद्मस्थः सर्ववर्णोपशोभितः ॥ ॥
    पुण्यमूर्तिः पुण्यलभ्यः पुण्यश्रवणकीर्तनः । सूर्यमण्डलमध्यस्थश्चन्द्रमण्डलमध्यगः ॥ ॥ सद्भक्तध्याननिगलः
    शरणागतपालकः । श्वेतातपत्ररुचिरः श्वेतचामरवीजितः ॥ ॥ सर्वावयवसम्पूर्णः सर्वलक्षणलक्षितः । सर्वमङ्गलमाङ्गल्यः
    सर्वकारणकारणः ॥ ॥ आमोदो मोदजनकः सर्पराजोत्तरीयकः । कपाली कोविदः सिद्धकान्तिसंवलिताननः ॥ ॥ सर्वसद्गुरुसंसेव्यो
    दिव्यचन्दनचर्चितः । विलासिनीकृतोल्लास इच्छाशक्तिनिषेवितः ॥ ॥ अनन्तानन्दसुखदो नन्दनः श्रीनिकेतनः ।
    अमृताब्धिकृतावासो नित्यक्लीबो निरामयः ॥ ॥ अनपायोऽनन्तदृष्टिरप्रमेयोऽजरोऽमरः । तमोमोहप्रतिहतिरप्रतर्क्योऽमृतोऽक्षरः
    ॥ ॥ अमोघबुद्धिराधार आधाराधेयवर्जितः । ईषणात्रयनिर्मुक्त इहामुत्रविवर्जितः ॥ ॥ ऋग्यजुःसामनयनो बुद्धिसिद्धिसमृद्धिदः
    । औदार्यनिधिरापूर्ण ऐहिकामुष्मिकप्रदः ॥ ॥ शुद्धसन्मात्रसंविद्धीस्वरूपसुखविग्रहः । दर्शनप्रथमाभासो
    दृष्टिदृश्यविवर्जितः ॥ ॥ अग्रगण्योऽचिन्त्यरूपः कलिकल्मषनाशनः । विमर्शरूपो विमलो नित्यरूपो निराश्रयः
    ॥ ॥ नित्यशुद्धो नित्यबुद्धो नित्यमुक्तोऽपराकृतः । मैत्र्यादिवासनालभ्यो महाप्रलयसंस्थितः ॥ ॥ महाकैलासनिलयः
    प्रज्ञानघनविग्रहः । श्रीमान् व्याघ्रपुरावासो भुक्तिमुक्तिप्रदायकः ॥ ॥ जगद्योनिर्जगत्साक्षी जगदीशो
    जगन्मयः । जपो जपपरो जप्यो विद्यासिंहासनप्रभुः ॥ ॥ तत्त्वानां प्रकृतिस्तत्त्वं तत्त्वम्पदनिरूपितः ।
    दिक्कालाद्यनवच्छिन्नः सहजानन्दसागरः ॥ ॥ प्रकृतिः प्राकृतातीतो विज्ञानैकरसाकृतिः । निःशङ्कमतिदूरस्थश्चैत्यचेतनचिन्तनः
    ॥ ॥ तारकानां हृदन्तस्थस्तारकस्तारकान्तकः । ध्यानैकप्रकटो ध्येयो ध्यानी ध्यानविभूषणः ॥ ॥ परं व्योम
    परं धाम परमात्मा परं पदम् । पूर्णानन्दः सदानन्दो नादमध्यप्रतिष्ठितः ॥ ॥ प्रमाविपर्ययातीतः प्रणताज्ञाननाशकः
    । बाणार्चिताङ्घ्रिर्बहुदो बालकेलिकुतूहली ॥ ॥ ब्रह्मरूपी ब्रह्मपदं ब्रह्मविद्ब्राह्मणप्रियः । भूक्षेपदत्तलक्ष्मीको
    भ्रूमध्यध्यानलक्षितः ॥ ॥ यशस्करो रत्नगर्भो महाराज्यसुखप्रदः । शब्दब्रह्म शमप्राप्यो लाभकृल्लोकविश्रुतः
    ॥ ॥ शास्ता शिवाद्रिनिलयः शरण्यो याजकप्रियः । संसारवैद्यः सर्वज्ञः सभेषजविभेषजः ॥ ॥ मनोवचोभिरग्राह्यः
    पञ्चकोशविलक्षणः । अवस्थात्रयनिर्मुक्तस्त्ववस्थासाक्षितुर्यकः ॥ ॥ पञ्चभूतादिदूरस्थः प्रत्यगेकरसोऽव्ययः
    । षट्चक्रान्तर्गतोल्लासी षड्विकारविवर्जितः ॥ ॥ विज्ञानघनसम्पूर्णो वीणावादनतत्परः । नीहाराकारगौराङ्गो
    महालावण्यवारिधिः ॥ ॥ पराभिचारशमनः षडध्वोपरिसंस्थितः । सुषुम्नामार्गसञ्चारी बिसतन्तुनिभाकृतिः ॥ ॥ पिनाकी
    लिङ्गरूपश्रीः मङ्गलावयवोज्ज्वलः । क्षेत्राधिपः सुसंवेद्यः श्रीप्रदो विभवप्रदः ॥ ॥ सर्ववश्यकरः सर्वदोषहा
    पुत्रपौत्रदः । तैलदीपप्रियस्तैलपक्वान्नप्रीतमानसः ॥ ॥ तैलाभिषेकसन्तुष्टस्तिलभक्षणतत्परः । आपादकणिकामुक्ताभूषाशतमनोहरः
    ॥ ॥ शाणोल्लीढमणिश्रेणीरम्याङ्घ्रिनखमण्डलः । मणिमञ्जीरकिरणकिञ्जल्कितपदाम्बुजः ॥ ॥ अपस्मारोपरिन्यस्तसव्यपादसरोरुहः
    । कन्दर्पतूणाभजङ्घो गुल्फोदञ्चितनूपुरः ॥ ॥ करिहस्तोपमेयोरुरादर्शोज्ज्वलजानुभृत् । विशङ्कटकटिन्यस्तवाचालमणिमेखलः
    ॥ ॥ आवर्तनाभिरोमालिवलिमत्पल्लवोदरः । मुक्ताहारलसत्तुङ्गविपुलोरस्करञ्जितः ॥ ॥ वीरासनसमासीनो वीणापुस्तोल्लसत्करः
    । अक्षमालालसत्पाणिश्चिन्मुद्रितकराम्बुजः ॥ ॥ माणिक्यकङ्कणोल्लासिकराम्बुजविराजितः । अनर्घरत्नग्रैवेयविलसत्कम्बुकन्धरः
    ॥ ॥ अनाकलितसादृश्यचिबुकश्रीविराजितः । मुग्धस्मितपरीपाकप्रकाशितरदाङ्कुरः ॥ ॥ चारुचाम्पेयपुष्पाभनासिकापुटरञ्जितः
    । वरवज्रशिलादर्शपरिभाविकपोलभूः ॥ ॥ कर्णद्वयोल्लसद्दिव्यमणिकुण्डलमण्डितः । करुणालहरीपूर्णकर्णान्तायतलोचनः
    ॥ ॥ अर्धचन्द्राभनिटिलपाटीरतिलकोज्ज्वलः । चारुचामीकराकारजटाचर्चितचन्दनः । कैलासशिखरस्फर्धिकमनीयनिजाकृतिः
    ॥ ॥ इति श्री दक्षिणामूर्ति सहस्रनाम स्तोत्रम् ॥
