id: pushkarashtakam
category: stotram
name:
  english: pushkarashtakam
  devanagari: पुष्कराष्टकम्
content:
  english: sa duradeshago'pi yastadangapapanashanam | prapannaduhkhabhanjanam suranjanam sudhakaram namami
    brahmapushkaram savaishnavam sashankaram || 3|| mrikandumankanau pulastyakanvaparvatasita agastyabhargavau
    dadhicinaradau shukadayah| sapadmatirthapavanaikaddashtyo dayakaram namami brahmapushkaram savaishnavam
    sashankaram || 4|| sada pitamahekshitam varahavishnunekshitam tatha'mareshvarekshitam surasuraih samikshitam
    | ihaiva bhuktimuktidam prajakaram ghanakaram namami brahmapushkaram savaishnavam sashankaram || 5||
    tridandidandibrahmacaritapasaih susevitam purardhacandrapraptadevanandikeshvarabhidhaih | savaidyanathanilakanthasevitam
    sudhakaram namami brahmapushkaram savaishnavam sashankaram || 6|| supancadha sarasvati virajate yadanttare
    tathaikayojanayatam vibhati tirthanayakam | anekadaivapaitratirthasagaram rasakaram namami brahmapushkaram
    savaishnavam sashankaram || 7|| yamadisamyuto narastripushkaram nimajjati pitamahashca madhavopyumadhavah
    prasannatam | prayati tatpadam dadatyayatnato gunakaram namami brahmapushkaram savaishnavam sashankaram
    || 8|| idam hi pushkarashtakam sunitinirajashritam sthitam madiyamanase kadapi ma'pagacchatu | trisandhyamapathanti
    ye tripushkarashtakam narah pradiptadehabhushana bhavanti meshakinkarah || 9|| iti shankaracaryaviracitam
    shripushkarashtakam samaptam ||
  devanagari: स दूरदेशगोऽपि यस्तदङ्गपापनाशनम् । प्रपन्नदुःखभञ्जनं सुरञ्जनं सुधाकरं नमामि ब्रह्मपुष्करं
    सवैष्णवं सशङ्करम् ॥ ३॥ मृकण्डुमङ्कणौ पुलस्त्यकण्वपर्वतासिता अगस्त्यभार्गवौ दधीचिनारदौ शुकादयः। सपद्मतीर्थपावनैकद्दष्ट्यो
    दयाकरं नमामि ब्रह्मपुष्करं सवैष्णवं सशङ्करम् ॥ ४॥ सदा पितामहेक्षितं वराहविष्णुनेक्षितं तथाऽमरेश्वरेक्षितं
    सुरासुरैः समीक्षितम् । इहैव भुक्तिमुक्तिदं प्रजाकरं घनाकरं नमामि ब्रह्मपुष्करं सवैष्णवं सशङ्करम् ॥
    ५॥ त्रिदण्डिदण्डिब्रह्मचारितापसैः सुसेवितं पुरार्धचन्द्रप्राप्तदेवनन्दिकेश्वराभिधैः । सवैद्यनाथनीलकण्ठसेवितं
    सुधाकरं नमामि ब्रह्मपुष्करं सवैष्णवं सशङ्करम् ॥ ६॥ सुपञ्चधा सरस्वती विराजते यदन्त्तरे तथैकयोजनायतं
    विभाति तीर्थनायकम् । अनेकदैवपैत्रतीर्थसागरं रसाकरं नमामि ब्रह्मपुष्करं सवैष्णवं सशङ्करम् ॥ ७॥ यमादिसंयुतो
    नरस्त्रिपुष्करं निमज्जति पितामहश्च माधवोप्युमाधवः प्रसन्नताम् । प्रयाति तत्पदं ददात्ययत्नतो गुणाकरं
    नमामि ब्रह्मपुष्करं सवैष्णवं सशङ्करम् ॥ ८॥ इदं हि पुष्कराष्टकं सुनीतिनीरजाश्रितं स्थितं मदीयमानसे
    कदापि माऽपगच्छतु । त्रिसन्ध्यमापठन्ति ये त्रिपुष्कराष्टकं नराः प्रदीप्तदेहभूषणा भवन्ति मेशकिङ्कराः
    ॥ ९॥ इति शङ्कराचार्यविरचितं श्रीपुष्कराष्टकं समाप्तम् ॥
