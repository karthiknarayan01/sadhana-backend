id: taropanishat
category: upanishad
name:
  english: taropanishat
  devanagari: तारोपनिषत्
content:
  english: trividhavighnotsaranabhumyabhimantranam jalabhyukshanakusumashuddhiyantranirmanarupanagamavadi
    likhet | ekalinge pitribhumau cirashunyanirjane devalaye vijane catushpathe ujjate bhudharatate nirjane
    deshe nirjana devagari shriphalamule vijane naditire caityahatte vatashvatthamule svagrihe va puja
    | pancatatvavidhina | akshobhyamunirasyapi chandastu brihati kurcam bijam shaktirbhuvana vadhuh kilakam
    | ekajata tarini vajrodakaikograjata mahapratisara pingograikajata abhimukhyena shadangani indranilavarnabha
    mulamantrabhanji muladharanabhihridayabrahmaranandhreshu bhuvana vadhukurcashoshanadahanaprotsaranamritakritimurtirjananiya
    tattvavidhina | sajalapravrishenyaghanarajinibhahyashtavarsha pinonnatavakshoruha nanavidhastryalankara
    virajita | sarva lambodari bhima vyaghritvagavrita mahacinagurukapalapancamudra virajita bhimadamshtra
    karalasya pinlograikajata khadgakartridakshinakarayuga kapalotpalavamakarayuga akshobhyamaulinduprajvalita
    pitribhumimadhyastha dhyeya | cittatoshnanantaram svayam tariniti atmabhedataya atmani santoshya purvamomkaram
    tata akarah pare surekhe vajrarekhe uttare kurcam tadantastravahnijaya | caturasrashtadalatrikonarupam
    yantram | lakshmi sarasvati ratih pritih kirtih tushtih shantih sadashivashcatra gamagamavashat pushpanjaliyogamulamantrarupapatalavihitakusumaparadravyadanatarpanam
    | naivedyabhutabalidanadimukhyashadangani | gurunapi yathadesham | purvadidishi ganeshavatukakshetrapalayoginyah
    | agneyadishu shankhapandara tarakan | trikoneshu bijatrayam | dishi padmantakayamantakavighnantakanarantakan
    | trikoneshu bijatrayam brahmi vaishnavi maheshvari shaktitrayayuta yathayogyam vastralankara mahashankhamalaya
    laksha niyamenaniyamena va siddhavidyanam devajnanaprakashakanam samjnanasankan | kalikavihitani kalpani
    kuryat | atha hainam bhagavantam parameshthinam sanatkumarah papraccha yena sarvasya sarvam bhavati
    tanmantram kathaya bhagavan ko hi mantranam parama mantradevatananca daivatam kimutasya vidyayugashodhanam
    putrapautrakavitvanca dhanadhanyakavitvanca nirvanamoksham ca labhate budhah | kena vidhina aradhyate
    kena mantrena sarvamiti | athaha bhagavan brahma mantranam paramo mantrastareti parama tara sa devatananca
    devata | sarvada strishu madhyeshu japet | striya yonau sada japet | ritumatim gacchet | tulasim tyajet
    | evam kritva guruh shishyo'yutadvayam nishayam ekaki shunyagrihe timiralaye | tada sarvasya sarvam
    tarati yashasyante narah | om | iti taropanishat samapta | om tarayai namah |
  devanagari: त्रिविधविघ्नोत्सारणभूम्यभिमन्त्रणं जलाभ्युक्षणकुसुमशुद्धियन्त्रनिर्माणरूपानागमवादी लिखेत्
    । एकलिङ्गे पितृभूमौ चिरशून्यनिर्जने देवालये विजने चतुष्पथे उज्जटे भूधरतटे निर्जने देशे निर्जन देवागरि
    श्रीफलमूले विजने नदीतीरे चैत्यहट्टे वटाश्वत्थमूले स्वगृहे वा पूजा । पञ्चतत्वविधिना । अक्षोभ्यमुनिरस्यापि
    छन्दस्तु बृहती कूर्चं बीजं शक्तिर्भुवना वधूः कीलकम् । एकजटा तारिणी वज्रोदकैकोग्रजटा महाप्रतिसरा पिङ्गोग्रैकजटा
    आभिमुख्येन षडङ्गानि इन्द्रनीलावर्णाभा मूलमन्त्रभाञ्जि मूलाधारनाभिहृदयब्रह्मरनन्ध्रेषु भुवना वधूकूर्चशोषणदहनप्रोत्सारणामृताकृतिमूर्तिर्जननीया
    तत्त्वविधिना । सजलप्रावृषेण्यघनराजिनिभाह्यष्टवर्षा पीनोन्नतवक्षोरुहा नानाविधस्त्र्यलङ्कार विराजिता
    । सर्वा लम्बोदरी भीमा व्याघृत्वगावृता महाचीनगुरुकपालपञ्चमुद्रा विराजिता भीमदंष्ट्रा करालास्या पिङ्लोग्रैकजटा
    खड्गकर्तृदक्षिणकरयुगा कपालोत्पलवामकारयुगा अक्षोभ्यमौलीन्दुप्रज्वलिता पितृभूमिमध्यस्ठा ध्येया । चित्ततोष्णानन्तरं
    स्वयम् तारिणीति आत्मभेदतया आत्मनि सन्तोष्य पूर्वमोंकारं तत आकारः परे सुरेखे वज्ररेखे उत्तरे कूर्चं
    तदन्तास्त्रवह्निजाया । चतुरस्राष्टदलत्रिकोणरूपं यन्त्रम् । लक्ष्मी सरस्वती रतिः प्रीतिः कीर्तिः तुष्टिः
    शान्तिः सदाशिवश्चात्र गमागमवशात् पुष्पाञ्जलियोगमूलमन्त्ररूपपटलविहितकुसुमपरद्रव्यदानतर्पणम् । नैवेद्यभूतबलिदानादिमुख्यषडङ्गानि
    । गुरूनपि यथादेशम् । पूर्वादिदिशि गणेशवटुकक्षेत्रपालयोगिन्यः । आग्नेयादिषु शङ्खपाण्डर तारकान् । त्रिकोणेषु
    बीजत्रयम् । दिशि पद्मान्तकयमान्तकविघ्नान्तकनरान्तकान् । त्रिकोणेषु बीजत्रयम् ब्राह्मी वैष्णवी माहेश्वरी
    शक्तित्रययुता यथायोग्यं वस्त्रालङ्कार महाशङ्खमालया लक्ष नियमेनानियमेन वा सिद्धविद्यानाम् देवज्ञानप्रकाशकानाम्
    संज्ञानसङ्कान् । कालिकाविहितानि कल्पानि कुर्यात् । अथ हैनं भगवन्तम् परमेष्ठिनं सनत्कुमारः पप्रच्छ
    येन सर्वस्य सर्वं भवति तन्मन्त्रम् कथय भगवन् को हि मन्त्राणाम् परमा मन्त्रदेवतानाञ्च दैवतम् किमुतास्य
    विद्यायुगशोधनं पुत्रपौत्रकवित्वञ्च धनधान्यकवित्वञ्च निर्वाणमोक्षं च लभते बुधः । केन विधिना आराध्यते
    केन मन्त्रेण सर्वमिति । अथाह भगवान् ब्रह्मा मन्त्राणां परमो मन्त्रस्तारेति परमा तारा सा देवतानाञ्च
    देवता । सर्वदा स्त्रीषु मध्येषु जपेत् । स्त्रिया योनौ सदा जपेत् । ऋतुमतीं गच्छेत् । तुलसीम् त्यजेत्
    । एवम् कृत्वा गुरुः शिष्योऽयुतद्वयं निशायाम् एकाकी शून्यगृहे तिमिरालये । तदा सर्वस्य सर्वं तरति यशस्यन्ते
    नराः । ॐ । इति तारोपनिषत् समाप्ता । ॐ तारायै नमः ।
