id: kardamarishikritamvishnustotram
category: stotram
name:
  english: kardamarishikritamvishnustotram
  devanagari: कर्दमऋषिकृतंविष्णुस्तोत्रम्
content:
  english: tpadaravindam bhavasindhupotam | upasate kamalavaya tesham rasisha kamanniraye'pi ye syuh ||
    14|| tatha sa caham parivodhukamah samanashilam grihamedhadhenum | upeyivan mulamasheshamulam durashayah
    kamadughanghripasya || 15|| prajapateste vacasadhisha tantya lokah kilayam kamahato'nubaddhah | aham
    ca lokanugato vahami balim ca shuklanimishaya tubhyam || 16|| lokamshca lokanugatan pashumshca hitva
    shritaste caranatapatram | parasparam tvadgunavadasidhu
  devanagari: त्पादारविन्दं भवसिन्धुपोतम् । उपासते कामलवाय तेषां रासीश कामान्निरयेऽपि ये स्युः ॥ १४॥ तथा
    स चाहं परिवोढुकामः समानशीलां गृहमेधधेनुम् । उपेयिवान् मूलमशेषमूलं दुराशयः कामदुघाङ्घ्रिपस्य ॥ १५॥
    प्रजापतेस्ते वचसाधीश तन्त्या लोकः किलायं कामहतोऽनुबद्धः । अहं च लोकानुगतो वहामि बलिं च शुक्लानिमिषाय
    तुभ्यम् ॥ १६॥ लोकांश्च लोकानुगतान् पशूंश्च हित्वा श्रितास्ते चरणातपत्रम् । परस्परं त्वद्गुणवादसीधु
meaning: {}
