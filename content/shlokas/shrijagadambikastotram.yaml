id: shrijagadambikastotram
category: stotram
name:
  english: shrijagadambikastotram
  devanagari: श्रीजगदम्बिकास्तोत्रम्
content:
  english: him bijajapitushtam tam mahashaktim namamyaham||1|| klim bijarupinim devimararivinashinim|
    camundam mundadamanim tulajapuravasinim||2|| mundamalalasaddeham mohandhatamasapaham| dakinyadikritartighnim
    pranamami mahamatim||3|| yairyatramasakridgitam te sarvarthayujo'bhavan| vic nityam viragashca yata
    ashu labhennrinam||4|| cetanarupato ya''ste sarvabhuteshu tam bhaje| prasida devi satatamaparadhan
    kshamasva me||5|| || iti shi
  devanagari: हीं बीजजापितुष्टां तां महाशक्तिं नमाम्यहम्॥१॥ क्लीं बीजरूपिणीं देवीमरारिविनाशिनीम्। चामुन्डां
    मुण्डदमनीं तुलजापुरवासिनीम्॥२॥ मुन्डमालालसद्देहां मोहान्धतमसापहाम्। डाकिन्यादिकृतार्तिघ्नीं प्रणमामि
    महामतिम्॥३॥ यैर्यत्रामसकृद्गीतं ते सर्वार्थयुजोऽभवन्। विच् नित्यं विरागश्च यत आशु लभेन्नृणाम्॥४॥ चेतनारूपतो
    याऽऽस्ते सर्वभूतेषु ताम् भजे। प्रसीद देवि सततमपराधान् क्षमस्व मे॥५॥ ।। इति शी
meaning: {}
