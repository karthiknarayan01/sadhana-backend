id: rudrasuktam-3
category: veda
name:
  english: rudrasuktam
  devanagari: रुद्रसूक्तम्
content:
  english: 6|| ma no mahantamuta ma no arbhakam ma na ukshantamuta ma na ukshitam | ma no vadhih pitaram
    mota mataram ma nah priyastanvo rudra ririshah || 1
  devanagari: ६॥ मा नो महान्तमुत मा नो अर्भकं मा न उक्षन्तमुत मा न उक्षितम् । मा नो वधीः पितरं मोत मातरं
    मा नः प्रियास्तन्वो रुद्र रीरिषः ॥ १
meaning: {}
