id: mundaka-upanishad-mundaka-2-section-2
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 2, Section 2
content:
  english: '|| dvitiya mundake dvitiyah khandah || avi thsamarpitam | ejatpranannimishacca yadetajjanatha
    sadasadvarenya vi~jnanadyadvarishtha lloka nihita lokinashca | tadetadakshara mbrahma sa pranastadu
    vanmanah tadetatsatya ntadveddhavyam somya viddhi || || dhanur grihitvaupanishada mmahastram sharam
    hyupasa nishitam sandhayita | ayamya tadbhavagatena cetasa lakshya ntadevaksharam somya viddhi ||
    shsharo hyatma brahma tallakshyamucyate | apramattena veddhavyam sharava ndyauh prithivi cantarikshamotam
    mana ssaha pranaishca sarvaih | tamevaika njanatha atmanamanya vaco vimuncathamritasyaisha setuh ||
    || ara iva rathanabhau samhata yatra nadyah | sa esho ''ntashcarate bahudha jayamanah | omityeva ndhyayatha
    atmanam svasti vah paraya tamasah parastat || ssarvavid yasyaisha mahima bhuvi | divye brahmapure
    hyesha vyomnyatma pratishthitah || manomayah pranashariraneta pratishthito ''nne hridayam sannidhaya
    | tad vijnanena paripashyanti dhira anandarupamamritam || bhidyate hridayagranthishchidyante sarvasamshayah
    | kshiyante casya karmani tasmi || hiranmaye pare koshe viraja mbrahma nishkalam | tacchubhra njyotistad
    yadatmavido viduh || || na tatra suryo bhati na candratarakam nema vidyuto bhanti kuto ''yamagnih
    | tameva bhantamanubhati sarvam tasya bhasa sarvamidam mpurastad brahma pashcad brahma dakshinatashcottarena
    | adhashcordhva || || iti mundakopanishadi dvitiyamundake dvitiyah khandah ||'
  devanagari: ॥ द्वितीय मुण्डके द्वितीयः खण्डः ॥ आवि थ्समर्पितम् । एजत्प्राणन्निमिषच्च यदेतज्जानथ सदसद्वरेण्य
    विँज्ञानाद्यद्वरिष्ठ ल्लोका निहिता लोकिनश्च । तदेतदक्षर म्ब्रह्म स प्राणस्तदु वाङ्मनः तदेतत्सत्य न्तद्वेद्धव्यं
    सोम्य विद्धि ॥ ॥ धनुर् गृहीत्वौपनिषद म्महास्त्रं शरं ह्युपासा निशितं सन्धयीत । आयम्य तद्भावगतेन चेतसा
    लक्ष्य न्तदेवाक्षरं सोम्य विद्धि ॥ श्शरो ह्यात्मा ब्रह्म तल्लक्ष्यमुच्यते । अप्रमत्तेन वेद्धव्यं शरव
    न्द्यौः पृथिवी चान्तरिक्षमोतं मन स्सह प्राणैश्च सर्वैः । तमेवैक ञ्जानथ आत्मानमन्या वाचो विमुञ्चथामृतस्यैष
    सेतुः ॥ ॥ अरा इव रथनाभौ संहता यत्र नाड्यः । स एषो ऽन्तश्चरते बहुधा जायमानः । ओमित्येव न्ध्यायथ आत्मानं
    स्वस्ति वः पाराय तमसः परस्तात् ॥ स्सर्वविद् यस्यैष महिमा भुवि । दिव्ये ब्रह्मपुरे ह्येष व्योम्न्यात्मा
    प्रतिष्ठितः ॥ मनोमयः प्राणशरीरनेता प्रतिष्ठितो ऽन्ने हृदयं सन्निधाय । तद् विज्ञानेन परिपश्यन्ति धीरा
    आनन्दरूपममृतं ॥ भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः । क्षीयन्ते चास्य कर्माणि तस्मि ॥ हिरण्मये
    परे कोशे विरज म्ब्रह्म निष्कलम् । तच्छुभ्र ञ्ज्योतिस्तद् यदात्मविदो विदुः ॥ ॥ न तत्र सूर्यो भाति न
    चन्द्रतारकं नेमा विद्युतो भान्ति कुतो ऽयमग्निः । तमेव भान्तमनुभाति सर्वं तस्य भासा सर्वमिदं म्पुरस्ताद्
    ब्रह्म पश्चाद् ब्रह्म दक्षिणतश्चोत्तरेण । अधश्चोर्ध्व ॥ ॥ इति मुण्डकोपनिषदि द्वितीयमुण्डके द्वितीयः
    खण्डः ॥
