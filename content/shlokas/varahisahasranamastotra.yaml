id: varahisahasranamastotra
category: stotram
name:
  english: varahisahasranamastotra
  devanagari: वाराहीसहस्रनामस्तोत्र
content:
  english: shrikantha karunasindho dinabandho jagatpate | bhutibhushitasarvanga paratparatara prabho ||
    1|| kritanjaliputa bhutva pricchamyekam dayanidhe | adya ya citsvarupa ya nirvikara niranjana || 2||
    bodhatita jnanagamya kutastha''nandavigraha | agrahya'tindriya shuddha niriha svavabhasika || 3||
    gunatita nishprapanca hyavanmanasagocara | prakritirjagadutpattisthitisamharakarini || 4|| raksharthe
    jagatam devakaryartham va suradvisham | nashaya dhatte sa deham tattatkaryaikasadhanam || 5|| tatra
    bhudharanarthaya yajnavistarahetave | vidyutkeshahiranyakshabalakadivadhaya ca || 6|| avirbabhuva
    ya shaktirghora bhudararupini | varahi vikatakara danavasuranashini || 7|| sadyahsiddhikari devi dhora
    ghoratara shiva | tasyah sahasranamakhyam stotram me samudiraya || 8|| kripalesho'sti mayi cedbhagyam
    me yadi va bhavet | anugrahya yadyaham syam tada vada dayanidhe || 9|| ishvara uvaca | sadhu sadhu
    vararohe dhanya bahumatasi me | shushrushadisamutpanna bhaktishraddhasamanvita tava || 10|| sahasranama
    varahyah sarvasiddhividhayi ca | tava cenna pravakshyami priye kasya vadamyaham || 11|| kintu gopyam
    prayatnena samrakshyam pranato'pi ca | visheshatah kaliyuge na deyam yasya kasyacit || sarve'nyatha
    siddhibhajo bhavishyanti varanane || 12|| om asya shrivarahisahasranamastotrasya mahadeva rishih |
    anushtupchandah | varahi devata | aim bijam | krom shaktih | hum kilakam | mama sarvarthasiddhyarthe
    jape viniyogah | om varahi vamani vama bagala vasavi vasuh | vaidehi virasurbala varada vishnuvallabha
    || 13|| vandita vasuda vashya vyattasya vancini bala | vasundhara vitihotra vitaraga vihayasi || 14||
    sarva khanipriya kamya kamala kancani rama | dhumra kapalini vama kurukulla kalavati || 15|| yamya'gneyi
    dhara dhanya dharmini dhyanini dhruva | dhritirlakshmirjaya tushtih shaktirmedha tapasvini || 16||
    vedha jaya kritih kantih svaha shantirdama ratih | lajja matih smritirnidra tandra gauri shiva svadha
    || 17|| candi durga'bhaya bhima bhasha bhama bhayanaka | bhudara bhayapaha bhirurbhairavi bhangara
    bhati || 18|| ghurghura ghoshana ghora ghoshini ghonasamyuta | ghanadhana gharghara ca ghonayukta'ghanashini
    || 19|| purvagneyi patu yamya vayavyuttaravaruni | aishanyurdhvadhahsthita ca prishta dakshagravamaga
    || 20|| hrinnabhibrahmarandhrarkasvargapatalabhumiga | aim shrih hrih klim tirthagatih pritirdhirgih
    kala'vyaya || 21|| rigyajuh samarupa ca para yatrinyudumbara | gadasishakticapeshushulacakrakrashtidharini
    || 22|| jarati yuvati bala caturangabalotkata | satyakshara cadhibhetri dhatri patri para patuh ||
    23|| kshetrajna kampini jyeshtha duradharsha dhurandhara | malini manini mata mananiya manasvini ||
    24|| mahotkata manyukari manurupa manojava | medasvini madyarata madhupa mangala'mara || 25|| maya
    mata''mayahari mridani mahila mritih | mahadevi mohahari manjurmrityunjaya'mala || 26|| mamsala manava
    mula maharatrimahalasa | mriganka minakari syanmahishaghni madantika || 27|| murcchamohamrishamoghamadamrityumalapaha
    | simharkshamahishavyaghramrigakrodanana dhuni || 28|| dharini dharini dhenurdharitri dhavani dhava
    | dharmadhvana dhyanapara dhanadhanyadharaprada || 29|| papadosharipuvyadhinashini siddhidayini |
    kalakashthatrapapaksha'hastrutishvasarupini || 30|| samriddha subhuja raudri radha raka rama'ranih
    | rama ratih priya rushta rakshini ravimadhyaga || 31|| rajani ramani reva rankini ranjini rama |
    rosha roshavati ruksha karirajyaprada rata || 32|| ruksha rupavati rasya rudrani ranapandita | ganga
    ca yamuna caiva sarasvatisvasurmadhuh || 33|| gandaki tungabhadra ca kaveri kaushiki patuh | khatvoragavati
    cara sahasraksha pratardana || 34|| sarvajna shankari shastri jatadharinyayorada | yavani saurabhi
    kubja vakratunda vadhodyata || 35|| candrapida vedavedya shankhini nillaohita | dhyanatita'paricchedya
    mrityurupa trivargada || 36|| arupa bahurupa ca nanarupa natanana | vrishakapirvrisharudha vrisheshi
    vrishavahana || 37|| vrishapriya vrishavarta vrishaparva vrishakritih | kodandini nagacuda cakshushya
    paramarthika || 38|| durvasa durgraha devi suravasa durariha | durga radha durgahantri duraradhya
    daviyasi || 39|| duravasa duhprahasta duhprakampa duruhini | suveni shramani shyama mrigavyadha'rkatapini
    || 40|| durga tarkshi pashupati kaunapi kunapashana | kapardini kamakama kamaniya kalojvala || 41||
    kasavahritkarakani kambukanthi kritagama | karkasha karana kanta kalpa'kalpa katankata || 42|| shmashananilaya
    bhinni gajarudha gajapaha | tatpriya tatpara raya svarbhanuh kalavancini || 43|| shakha vishakha goshakha
    sushakha sheshashakhini | vyanga subhanga vamanga nilanga'nangarupini || 44|| sangopanga ca sharanga
    shubhanga rangarupini | bhadra subhadra bhadrakshi simhika vinata'ditih || 45|| hridya vadya supadya
    ca gadyapadyapriya prasuh | carcika bhogavatyamba sarasi shabari nati || 46|| yogini pushkala'nanta
    para sankhya shaci sati | nimnaga nimnanabhishca sahishnurjagriti lipih || 47|| damayanti dami dandoddandini
    daradayika | dipini dhavini dhatri dakshakanya daridrati || 48|| dahini dravini darvi dandini dandanayika
    | danapriya doshahantri duhkhadaridryanashini || 49|| doshada doshakriddogdhri dohada devika'dana
    | darvikari durvalita duryuga'dvayavadini || 50|| caracara'nantavrishtirunmatta kamalalasa | tarini
    tarakantara paratma kubjalocana || 51|| indurhiranyakavaca vyavastha vyavasayika | ishananda nadi
    nagi yakshini sarpini vari || 52|| sudha sura vishvasaha suvarnangadadharini | janani pritipakeruh
    samrajni samviduttama || 53|| ameya'rishtadamani pingala lingadharini | camunda plavini hala brihajjyotirurukrama
    || 54|| supratika ca sugriva havyavaha pralapini | nabhasya madhavi jyeshtha shishira jvalini rucih
    || 55|| shukla shukra shuca shoka shuki bheki piki bhaki | prishadashva nabhoyoni supratika vibhavari
    || 56|| garvita gurvini ganya gururgurutari gaya | gandharvi ganika gundra garudi gopika'graga ||
    57|| ganeshi gamini gantri gopatirgandhini gavi | garjita ganani gona goraksha govidam gatih || 58||
    grathiki grathikridgoshthi garbharupa gunaishini | paraskari pancanada bahurupa virupika || 59|| uha
    vyuha duruha ca sammoha mohaharini | yajnavigrahini yajna yayajuka yashasvini || 60|| agnishthomo'tyagnishtomo
    vajapeyashca shodashi | pundariko'shvamedhashca rajasuyashca nabhasah || 61|| svishtakridbahusauvarno
    gosavashca mahavratah | vishvajidbrahmayajnashca prajapatyah shilayavah || 62|| ashvakranto rathakranto
    vishnukranto vibhavasuh | suryakranto gajakranto balibhinnagayajnakah || 63|| savitri cardhasavitri
    sarvatobhadravarunah | adityamayagodohagavamayamrigamayah || 64|| sarpamayah kalapinjah kaundinyopanakahalah
    | agnividdvadashahah svopamshuh somadohanah || 65|| ashvapratigraho barhiratho'bhyudaya riddhirat
    | sarvasvadakshino diksha somakhya samidahvayah || 66|| kathayanashca godohah svahakarastanunapat
    | dandapurushamedhashca shyeno vajra ishuryamah || 67|| angira kangabherunda candrayanaparayana |
    jyotishthomah kuto darsho nandyakhyah paurnamasikah || 68|| gajapratigraho ratrih saurabhah shankalayanah
    | saubhagyakricca karisho vaitalayanaramathi || 69|| shocishkari naciketah shantikritpushtikrittatha
    | vainateyoccatanau ca vashikaranamarane || 70|| trailokyamohano virah kandarpabalashatanah | shankhacudo
    gajacchayo raudrakhyo vishnuvikramah || 71|| bhairavah kavahakhyashcavabhritho'shtakapalakah | shraushat
    vaushat vashatkarah pakasamstha parishruti || 72|| cayano naramedhashca kariri ratnadanika | sautramani
    ca bharunda barhaspatyo balangamah || 73|| pracetah sarvasatrashca gajamedhah karambhakah | havihsamstha
    somasamstha pakasamstha garutmati || 74|| satyasuryashcamasah sruksruvolukhalamekshani | capalo manthini
    medhi yupah pragvamshakunjika || 75|| rashmirashushca dobhyashca varunodah pavih kutha | aptoryamo
    dronakalasho maitravaruna ashvinah || 76|| patnivatashca manthi ca hariyojana eva ca | pratiprasthanashukrau
    ca samidheni samitsama || 77|| hota'dhvaryustathodghata neta tvashta ca yotrika | agnidhro'cchavagashtavagravastutpratardakah
    || 78|| subrahmanyo brahmanashca maitravarunavarunau | prastota pratiprasthata yajamana dhruvamtrika
    || 79|| amikshamishadajyam ca havyam kavyam caruh payah | juhuddhunobhrit brahma trayi treta tarashvini
    || 80|| purodashah pashukarshah prekshani brahmayajnini | agnijihva darbharoma brahmashirsha mahodari
    || 81|| amritaprashika narayani nagna digambara | onkarini caturvedarupa shrutiranulvana || 82|| ashtadashabhuja
    rambha satya gaganacarini | bhimavaktra mahavaktra kirtirakrishnapingala || 83|| krishnamurddha mahamurddha
    ghoramurddha bhayanana | ghoranana ghorajihva ghorarava mahavrata || 84|| diptasya diptanetra candapraharana
    jati | surabhi saunabhi vici chaya sandhya ca mamsala || 85|| krishna krishnambara krishnasharngini
    krishnavallabha | trasini mohini dveshya mrityurupa bhayavaha || 86|| bhishana danavendraghni kalpakartri
    kshayankari | abhaya prithivi sadhvi keshini vyadhijanmaha || 87|| akshobhya hladini kanya pavitra
    ropini shubha | kanyadevi suradevi bhimadevi madantika || 88|| shakambari mahashveta dhumra dhumreshvarishvari
    | virabhadra mahabhadra mahadevi mahasuri || 89|| shmashanavasini dipta citisamstha citipriya | kapalahasta
    khatvangi khadgini shulini hali || 90|| kantarini mahayogi yogamarga yugagraha | dhumraketurmahasyayuryuganam
    parivartini || 91|| angarinyankushakara ghantavarna ca cakrini | vetali brahmavetali mahavetalika
    tatha || 92|| vidyarajni moharajni maharajni mahodari | bhutam bhavyam bhavishyam ca sankhyam yogastato
    damah || 93|| adhyatmam cadhidaivam cadhibhutamsha eva ca | ghantarava virupakshi shikhicicchricayapriya
    || 94|| khadgashulagadahasta mahishasuramardini | matangi mattamatangi kaushiki brahmavadini || 95||
    ugrateja siddhasena jrimbhini mohini tatha | jaya ca vijaya caiva vinata kadrureva ca || 96|| dhatri
    vidhatri vikranta dhvasta murccha ca murcchani | damani damini damya chedini tapini tapi || 97|| bandhini
    badhini bandhya bodhatita budhapriya | harini harini hantri dharini dharini dhara || 98|| visadhini
    sadhini ca sandhya sangopani priya | revati kalakarni ca siddhilakshmirarundhati || 99|| dharmapriya
    dharmaratih dharmishtha dharmacarini | vyushtih khyatih sinivali kuhuh ritumati mritih || 100|| tavashtri
    vairocani maitri niraja kaitabheshvari | bhramani bhramani bhrama bhramari bhramari bhrama || 101||
    nishkala kalaha nita kaulakara kalevara | vidyujjihva varshini ca hiranyakshanipatini || 102|| jitakama
    kamrigaya kola kalpangini kala | pradhana taraka tara hitatma hitabhedini || 103|| durakshara parambrahma
    mahatana mahahava | varuni vyaruni vani vina veni vihangama || 104|| modapriya modakini plavani plavini
    plutih | ajara lohita laksha pratapta vishvabhojini || 105|| mano buddhirahankarah kshetrajna kshetrapalika
    | caturveda caturbhara caturanta carupriya || 106|| carvini corini cari cankari carmabhebhairavi |
    nirlepa nishprapanca ca prashanta nityavigraha || 107|| stavya stavapriya vyala gururashritavatsala
    | nishkalanka niralamba nirdvandva nishparigraha || 108|| nirguna nirmala nitya niriha niragha nava
    | nirindriya nirabhasa nirmoha nitinayika || 109|| nirindhana nishkala ca lilakara niramaya | munda
    virupa vikrita pingalakshi gunottara || 110|| padmagarbha mahagarbha vishvagarbha vilakshana | paramatma
    pareshani para para parantapa || 111|| samsarasetuh krurakshi murccha matta manupriya | vismaya durjaya
    daksha tanuhantri dayalaya || 112|| parabrahma''nandarupa sarvasiddhividhayini | om| evamuddamaratantranmayoddhritya
    prakashitam || 113|| gopaniyam prayatnena nakhyeyam yasya kasyacit | yadicchasi drutam siddhim aishvaryam
    cirajivitam || 114|| arogyam nripasammanam tada namani kirtayet | namnam sahasram varahyah maya te
    samudiritam || 115|| yah pathecchrinuyadvapi sarvapapaih pramucyate | ashvamedhasahasrasya vajapeyashatasya
    ca || 116|| pundarikayutasyapi phalam pathat prajayate | pathatah sarvabhavena sarvah syuh siddhayah
    kare || 117|| jayate mahadaishvaryam sarvesham dayito bhavet | dhanasarayate vahniragadho'bdhih kanayate
    || 118|| siddhayashca trinayante vishamapyamritayate | harayante mahasarpah simhah kridamrigayate
    || 119|| dasayante mahipala jaganmitrayate'khilam | tasmannamnam sahasrena stuta sa jagadambika |
    prayacchatyakhilan kaman dehante paramam gatim || 120|| || iti uddamaratantrantargatam shriadivarahisahasranamastotram
    sampurnam ||
  devanagari: श्रीकण्ठ करुणासिन्धो दीनबन्धो जगत्पते । भूतिभूषितसर्वाङ्ग परात्परतर प्रभो ॥ १॥ कृताञ्जलिपुटा
    भूत्वा पृच्छाम्येकं दयानिधे । आद्या या चित्स्वरूपा या निर्विकारा निरञ्जना ॥ २॥ बोधातीता ज्ञानगम्या
    कूटस्थाऽऽनन्दविग्रहा । अग्राह्याऽतीन्द्रिया शुद्धा निरीहा स्वावभासिका ॥ ३॥ गुणातीता निष्प्रपञ्चा ह्यवाङ्मनसगोचरा
    । प्रकृतिर्जगदुत्पत्तिस्थितिसंहारकारिणी ॥ ४॥ रक्षार्थे जगतां देवकार्यार्थं वा सुरद्विषाम् । नाशाय
    धत्ते सा देहं तत्तत्कार्यैकसाधनम् ॥ ५॥ तत्र भूधरणार्थाय यज्ञविस्तारहेतवे । विद्युत्केशहिरण्याक्षबलाकादिवधाय
    च ॥ ६॥ आविर्बभूव या शक्तिर्घोरा भूदाररूपिणी । वाराही विकटाकारा दानवासुरनाशिनी ॥ ७॥ सद्यःसिद्धिकरी
    देवी धोरा घोरतरा शिवा । तस्याः सहस्रनामाख्यं स्तोत्रं मे समुदीरय ॥ ८॥ कृपालेशोऽस्ति मयि चेद्भाग्यं
    मे यदि वा भवेत् । अनुग्राह्या यद्यहं स्यां तदा वद दयानिधे ॥ ९॥ ईश्वर उवाच । साधु साधु वरारोहे धन्या
    बहुमतासि मे । शुश्रूषादिसमुत्पन्ना भक्तिश्रद्धासमन्विता तव ॥ १०॥ सहस्रनाम वाराह्याः सर्वसिद्धिविधायि
    च । तव चेन्न प्रवक्ष्यामि प्रिये कस्य वदाम्यहम् ॥ ११॥ किन्तु गोप्यं प्रयत्नेन संरक्ष्यं प्राणतोऽपि
    च । विशेषतः कलियुगे न देयं यस्य कस्यचित् ॥ सर्वेऽन्यथा सिद्धिभाजो भविष्यन्ति वरानने ॥ १२॥ ॐ अस्य श्रीवाराहीसहस्रनामस्तोत्रस्य
    महादेव ऋषिः । अनुष्टुप्छन्दः । वाराही देवता । ऐं बीजम् । क्रों शक्तिः । हुं कीलकम् । मम सर्वार्थसिद्ध्यर्थे
    जपे विनियोगः । ॐ वाराही वामनी वामा बगला वासवी वसुः । वैदेही विरसूर्बाला वरदा विष्णुवल्लभा ॥ १३॥ वन्दिता
    वसुदा वश्या व्यात्तास्या वञ्चिनी बला । वसुन्धरा वीतिहोत्रा वीतरागा विहायसी ॥ १४॥ सर्वा खनिप्रिया काम्या
    कमला काञ्चनी रमा । धूम्रा कपालिनी वामा कुरुकुल्ला कलावती ॥ १५॥ याम्याऽग्नेयी धरा धन्या धर्मिणी ध्यानिनी
    ध्रुवा । धृतिर्लक्ष्मीर्जया तुष्टिः शक्तिर्मेधा तपस्विनी ॥ १६॥ वेधा जया कृतिः कान्तिः स्वाहा शान्तिर्दमा
    रतिः । लज्जा मतिः स्मृतिर्निद्रा तन्द्रा गौरी शिवा स्वधा ॥ १७॥ चण्डी दुर्गाऽभया भीमा भाषा भामा भयानका
    । भूदारा भयापहा भीरुर्भैरवी भङ्गरा भटी ॥ १८॥ घुर्घुरा घोषणा घोरा घोषिणी घोणसंयुता । घनाधना घर्घरा
    च घोणयुक्ताऽघनाशिनी ॥ १९॥ पूर्वाग्नेयी पातु याम्या वायव्युत्तरवारुणी । ऐशान्यूर्ध्वाधःस्थिता च पृष्टा
    दक्षाग्रवामगा ॥ २०॥ हृन्नाभिब्रह्मरन्ध्रार्कस्वर्गपातालभूमिगा । ऐं श्रीः ह्रीः क्लीं तीर्थगतिः प्रीतिर्धीर्गीः
    कलाऽव्यया ॥ २१॥ ऋग्यजुः सामरूपा च परा यात्रिण्युदुम्बरा । गदासिशक्तिचापेषुशूलचक्रक्रष्टिधारिणी ॥ २२॥
    जरती युवती बाला चतुरङ्गबलोत्कटा । सत्याक्षरा चाधिभेत्री धात्री पात्री परा पटुः ॥ २३॥ क्षेत्रज्ञा कम्पिनी
    ज्येष्ठा दूरधर्शा धुरन्धरा । मालिनी मानिनी माता माननीया मनस्विनी ॥ २४॥ महोत्कटा मन्युकरी मनुरूपा मनोजवा
    । मेदस्विनी मद्यरता मधुपा मङ्गलाऽमरा ॥ २५॥ माया माताऽऽमयहरी मृडानी महिला मृतिः । महादेवी मोहहरी मञ्जुर्मृत्युञ्जयाऽमला
    ॥ २६॥ मांसला मानवा मूला महारात्रिमहालसा । मृगाङ्का मीनकारी स्यान्महिषघ्नी मदन्तिका ॥ २७॥ मूर्च्छामोहमृषामोघामदमृत्युमलापहा
    । सिंहर्क्षमहिषव्याघ्रमृगक्रोडानना धुनी ॥ २८॥ धरिणी धारिणी धेनुर्धरित्री धावनी धवा । धर्मध्वना ध्यानपरा
    धनधान्यधराप्रदा ॥ २९॥ पापदोषरिपुव्याधिनाशिनी सिद्धिदायिनी । कलाकाष्ठात्रपापक्षाऽहस्त्रुटिश्वासरूपिणी
    ॥ ३०॥ समृद्धा सुभुजा रौद्री राधा राका रमाऽरणिः । रामा रतिः प्रिया रुष्टा रक्षिणी रविमध्यगा ॥ ३१॥ रजनी
    रमणी रेवा रङ्किनी रञ्जिनी रमा । रोषा रोषवती रूक्षा करिराज्यप्रदा रता ॥ ३२॥ रूक्षा रूपवती रास्या रुद्राणी
    रणपण्डिता । गङ्गा च यमुना चैव सरस्वतिस्वसूर्मधुः ॥ ३३॥ गण्डकी तुङ्गभद्रा च कावेरी कौशिकी पटुः । खट्वोरगवती
    चारा सहस्राक्षा प्रतर्दना ॥ ३४॥ सर्वज्ञा शाङ्करी शास्त्री जटाधारिण्ययोरदा । यावनी सौरभी कुब्जा वक्रतुण्डा
    वधोद्यता ॥ ३५॥ चन्द्रापीडा वेदवेद्या शङ्खिनी नील्लओहिता । ध्यानातीताऽपरिच्छेद्या मृत्युरूपा त्रिवर्गदा
    ॥ ३६॥ अरूपा बहुरूपा च नानारूपा नतानना । वृषाकपिर्वृषारूढा वृषेशी वृषवाहना ॥ ३७॥ वृषप्रिया वृषावर्ता
    वृषपर्वा वृषाकृतिः । कोदण्डिनी नागचूडा चक्षुष्या परमार्थिका ॥ ३८॥ दुर्वासा दुर्ग्रहा देवी सुरावासा
    दुरारिहा । दुर्गा राधा दुर्गहन्त्री दुराराध्या दवीयसी ॥ ३९॥ दुरावासा दुःप्रहस्ता दुःप्रकम्पा दुरुहिणी
    । सुवेणी श्रमणी श्यामा मृगव्याधाऽर्कतापिनी ॥ ४०॥ दुर्गा तार्क्षी पाशुपती कौणपी कुणपाशना । कपर्दिनी
    कामकामा कमनीया कलोज्वला ॥ ४१॥ कासावहृत्कारकानी कम्बुकण्ठी कृतागमा । कर्कशा कारणा कान्ता कल्पाऽकल्पा
    कटङ्कटा ॥ ४२॥ श्मशाननिलया भिन्नी गजारुढा गजापहा । तत्प्रिया तत्परा राया स्वर्भानुः कालवञ्चिनी ॥ ४३॥
    शाखा विशाखा गोशाखा सुशाखा शेषशाखिनी । व्यङ्गा सुभाङ्गा वामाङ्गा नीलाङ्गाऽनङ्गरूपिणी ॥ ४४॥ साङ्गोपाङ्गा
    च शारङ्गा शुभाङ्गा रङ्गरूपिणी । भद्रा सुभद्रा भद्राक्षी सिंहिका विनताऽदितिः ॥ ४५॥ हृद्या वद्या सुपद्या
    च गद्यपद्यप्रिया प्रसूः । चर्चिका भोगवत्यम्बा सारसी शबरी नटी ॥ ४६॥ योगिनी पुष्कलाऽनन्ता परा साङ्ख्या
    शची सती । निम्नगा निम्ननाभिश्च सहिष्णुर्जागृती लिपिः ॥ ४७॥ दमयन्ती दमी दण्डोद्दण्डिनी दारदायिका ।
    दीपिनी धाविनी धात्री दक्षकन्या दरिद्रती ॥ ४८॥ दाहिनी द्रविणी दर्वी दण्डिनी दण्डनायिका । दानप्रिया
    दोषहन्त्री दुःखदारिद्र्यनाशिनी ॥ ४९॥ दोषदा दोषकृद्दोग्ध्री दोहदा देविकाऽदना । दर्वीकरी दुर्वलिता दुर्युगाऽद्वयवादिनी
    ॥ ५०॥ चराचराऽनन्तवृष्टिरुन्मत्ता कमलालसा । तारिणी तारकान्तारा परात्मा कुब्जलोचना ॥ ५१॥ इन्दुर्हिरण्यकवचा
    व्यवस्था व्यवसायिका । ईशनन्दा नदी नागी यक्षिणी सर्पिणी वरी ॥ ५२॥ सुधा सुरा विश्वसहा सुवर्णाङ्गदधारिणी
    । जननी प्रीतिपाकेरुः साम्राज्ञी संविदुत्तमा ॥ ५३॥ अमेयाऽरिष्टदमनी पिङ्गला लिङ्गधारिणी । चामुण्डा प्लाविनी
    हाला बृहज्ज्योतिरुरुक्रमा ॥ ५४॥ सुप्रतीका च सुग्रीवा हव्यवाहा प्रलापिनी । नभस्या माधवी ज्येष्ठा शिशिरा
    ज्वालिनी रुचिः ॥ ५५॥ शुक्ला शुक्रा शुचा शोका शुकी भेकी पिकी भकी । पृषदश्वा नभोयोनी सुप्रतीका विभावरी
    ॥ ५६॥ गर्विता गुर्विणी गण्या गुरुर्गुरुतरी गया । गन्धर्वी गणिका गुन्द्रा गारुडी गोपिकाऽग्रगा ॥ ५७॥
    गणेशी गामिनी गन्त्री गोपतिर्गन्धिनी गवी । गर्जिता गाननी गोना गोरक्षा गोविदां गतिः ॥ ५८॥ ग्राथिकी ग्रथिकृद्गोष्ठी
    गर्भरूपा गुणैषिणी । पारस्करी पाञ्चनदा बहुरूपा विरूपिका ॥ ५९॥ ऊहा व्यूहा दुरूहा च सम्मोहा मोहहारिणी
    । यज्ञविग्रहिणी यज्ञा यायजूका यशस्विनी ॥ ६०॥ अग्निष्ठोमोऽत्यग्निष्टोमो वाजपेयश्च षोडशी । पुण्डरीकोऽश्वमेधश्च
    राजसूयश्च नाभसः ॥ ६१॥ स्विष्टकृद्बहुसौवर्णो गोसवश्च महाव्रतः । विश्वजिद्ब्रह्मयज्ञश्च प्राजापत्यः
    शिलायवः ॥ ६२॥ अश्वक्रान्तो रथक्रान्तो विष्णुक्रान्तो विभावसुः । सूर्यक्रान्तो गजक्रान्तो बलिभिन्नागयज्ञकः
    ॥ ६३॥ सावित्री चार्धसावित्री सर्वतोभद्रवारुणः । आदित्यामयगोदोहगवामयमृगामयाः ॥ ६४॥ सर्पमयः कालपिञ्जः
    कौण्डिन्योपनकाहलः । अग्निविद्द्वादशाहः स्वोपांशुः सोमदोहनः ॥ ६५॥ अश्वप्रतिग्रहो बर्हिरथोऽभ्युदय ऋद्धिराट्
    । सर्वस्वदक्षिणो दीक्षा सोमाख्या समिदाह्वयः ॥ ६६॥ कठायनश्च गोदोहः स्वाहाकारस्तनूनपात् । दण्डापुरुषमेधश्च
    श्येनो वज्र इषुर्यमः ॥ ६७॥ अङ्गिरा कङ्गभेरुण्डा चान्द्रायणपरायणा । ज्योतिष्ठोमः कुतो दर्शो नन्द्याख्यः
    पौर्णमासिकः ॥ ६८॥ गजप्रतिग्रहो रात्रिः सौरभः शाङ्कलायनः । सौभाग्यकृच्च कारीषो वैतलायनरामठी ॥ ६९॥ शोचिष्कारी
    नाचिकेतः शान्तिकृत्पुष्टिकृत्तथा । वैनतेयोच्चाटनौ च वशीकरणमारणे ॥ ७०॥ त्रैलोक्यमोहनो वीरः कन्दर्पबलशातनः
    । शङ्खचूडो गजाच्छायो रौद्राख्यो विष्णुविक्रमः ॥ ७१॥ भैरवः कवहाख्यश्चावभृथोऽष्टाकपालकः । श्रौषट् वौषट्
    वषट्कारः पाकसंस्था परिश्रुती ॥ ७२॥ चयनो नरमेधश्च कारीरी रत्नदानिका । सौत्रामणी च भारुन्दा बार्हस्पत्यो
    बलङ्गमः ॥ ७३॥ प्रचेताः सर्वसत्रश्च गजमेधः करम्भकः । हविःसंस्था सोमसंस्था पाकसंस्था गरुत्मती ॥ ७४॥
    सत्यसूर्यश्चमसः स्रुक्स्रुवोलूखलमेक्षणी । चपलो मन्थिनी मेढी यूपः प्राग्वंशकुञ्जिका ॥ ७५॥ रश्मिरशुश्च
    दोभ्यश्च वारुणोदः पविः कुथा । आप्तोर्यामो द्रोणकलशो मैत्रावरुण आश्विनः ॥ ७६॥ पात्नीवतश्च मन्थी च हारियोजन
    एव च । प्रतिप्रस्थानशुक्रौ च सामिधेनी समित्समा ॥ ७७॥ होताऽध्वर्युस्तथोद्घाता नेता त्वष्टा च योत्रिका
    । आग्नीध्रोऽच्छवगाष्टावग्रावस्तुत्प्रतर्दकः ॥ ७८॥ सुब्रह्मण्यो ब्राह्मणश्च मैत्रावरुणवारुणौ । प्रस्तोता
    प्रतिप्रस्थाता यजमाना ध्रुवंत्रिका ॥ ७९॥ आमिक्षामीषदाज्यं च हव्यं कव्यं चरुः पयः । जुहूद्धुणोभृत्
    ब्रह्मा त्रयी त्रेता तरश्विनी ॥ ८०॥ पुरोडाशः पशुकर्षः प्रेक्षणी ब्रह्मयज्ञिनी । अग्निजिह्वा दर्भरोमा
    ब्रह्मशीर्षा महोदरी ॥ ८१॥ अमृतप्राशिका नारायणी नग्ना दिगम्बरा । ओङ्कारिणी चतुर्वेदरूपा श्रुतिरनुल्वणा
    ॥ ८२॥ अष्टादशभुजा रम्भा सत्या गगनचारिणी । भीमवक्त्रा महावक्त्रा कीर्तिराकृष्णपिङ्गला ॥ ८३॥ कृष्णमूर्द्धा
    महामूर्द्धा घोरमूर्द्धा भयानना । घोरानना घोरजिह्वा घोररावा महाव्रता ॥ ८४॥ दीप्तास्या दीप्तनेत्रा चण्डप्रहरणा
    जटी । सुरभी सौनभी वीची छाया सन्ध्या च मांसला ॥ ८५॥ कृष्णा कृष्णाम्बरा कृष्णशार्ङ्गिणी कृष्णवल्लभा
    । त्रासिनी मोहिनी द्वेष्या मृत्युरूपा भयावहा ॥ ८६॥ भीषणा दानवेन्द्रघ्नी कल्पकर्त्री क्षयङ्करी । अभया
    पृथिवी साध्वी केशिनी व्याधिजन्महा ॥ ८७॥ अक्षोभ्या ह्लादिनी कन्या पवित्रा रोपिणी शुभा । कन्यादेवी सुरादेवी
    भीमादेवी मदन्तिका ॥ ८८॥ शाकम्बरी महाश्वेता धूम्रा धूम्रेश्वरीश्वरी । वीरभद्रा महाभद्रा महादेवी महासुरी
    ॥ ८९॥ श्मशानवासिनी दीप्ता चितिसंस्था चितिप्रिया । कपालहस्ता खट्वाङ्गी खड्गिनी शूलिनी हली ॥ ९०॥ कान्तारिणी
    महायोगी योगमार्गा युगग्रहा । धूम्रकेतुर्महास्यायुर्युगानां परिवर्तिनी ॥ ९१॥ अङ्गारिण्यङ्कुशकरा घण्टावर्णा
    च चक्रिणी । वेताली ब्रह्मवेताली महावेतालिका तथा ॥ ९२॥ विद्याराज्ञी मोहराज्ञी महाराज्ञी महोदरी । भूतं
    भव्यं भविष्यं च साङ्ख्यं योगस्ततो दमः ॥ ९३॥ अध्यात्मं चाधिदैवं चाधिभूतांश एव च । घण्टारवा विरूपाक्षी
    शिखिचिच्छ्रीचयप्रिया ॥ ९४॥ खड्गशूलगदाहस्ता महिषासुरमर्दिनी । मातङ्गी मत्तमातङ्गी कौशिकी ब्रह्मवादिनी
    ॥ ९५॥ उग्रतेजा सिद्धसेना जृम्भिणी मोहिनी तथा । जया च विजया चैव विनता कद्रुरेव च ॥ ९६॥ धात्री विधात्री
    विक्रान्ता ध्वस्ता मूर्च्छा च मूर्च्छनी । दमनी दामिनी दम्या छेदिनी तापिनी तपी ॥ ९७॥ बन्धिनी बाधिनी
    बन्ध्या बोधातीता बुधप्रिया । हरिणी हारिणी हन्त्री धरिणी धारिणी धरा ॥ ९८॥ विसाधिनी साधिनी च सन्ध्या
    सङ्गोपनी प्रिया । रेवती कालकर्णी च सिद्धिलक्ष्मीररुन्धती ॥ ९९॥ धर्मप्रिया धर्मरतिः धर्मिष्ठा धर्मचारिणी
    । व्युष्टिः ख्यातिः सिनीवाली कुहूः ऋतुमती मृतिः ॥ १००॥ तवाष्ट्री वैरोचनी मैत्री नीरजा कैटभेश्वरी ।
    भ्रमणी भ्रामणी भ्रामा भ्रमरी भ्रामरी भ्रमा ॥ १०१॥ निष्कला कलहा नीता कौलाकारा कलेवरा । विद्युज्जिह्वा
    वर्षिणी च हिरण्याक्षनिपातिनी ॥ १०२॥ जितकामा कामृगया कोला कल्पाङ्गिनी कला । प्रधाना तारका तारा हितात्मा
    हितभेदिनी ॥ १०३॥ दुरक्षरा परम्ब्रह्म महाताना महाहवा । वारुणी व्यरुणी वाणी वीणा वेणी विहङ्गमा ॥ १०४॥
    मोदप्रिया मोदकिनी प्लवनी प्लाविनी प्लुतिः । अजरा लोहिता लाक्षा प्रतप्ता विश्वभोजिनी ॥ १०५॥ मनो बुद्धिरहङ्कारः
    क्षेत्रज्ञा क्षेत्रपालिका । चतुर्वेदा चतुर्भारा चतुरन्ता चरुप्रिया ॥ १०६॥ चर्विणी चोरिणी चारी चाङ्करी
    चर्मभेभैरवी । निर्लेपा निष्प्रपञ्चा च प्रशान्ता नित्यविग्रहा ॥ १०७॥ स्तव्या स्तवप्रिया व्याला गुरुराश्रितवत्सला
    । निष्कलङ्का निरालम्बा निर्द्वन्द्वा निष्परिग्रहा ॥ १०८॥ निर्गुणा निर्मला नित्या निरीहा निरघा नवा
    । निरिन्द्रिया निराभासा निर्मोहा नीतिनायिका ॥ १०९॥ निरिन्धना निष्कला च लीलाकारा निरामया । मुण्डा विरूपा
    विकृता पिङ्गलाक्षी गुणोत्तरा ॥ ११०॥ पद्मगर्भा महागर्भा विश्वगर्भा विलक्षणा । परमात्मा परेशानी परा
    पारा परन्तपा ॥ १११॥ संसारसेतुः क्रूराक्षी मूर्च्छा मत्ता मनुप्रिया । विस्मया दुर्जया दक्षा तनुहन्त्री
    दयालया ॥ ११२॥ परब्रह्माऽऽनन्दरूपा सर्वसिद्धिविधायिनी । ॐ। एवमुड्डामरतन्त्रान्मयोद्धृत्य प्रकाशितम्
    ॥ ११३॥ गोपनीयं प्रयत्नेन नाख्येयं यस्य कस्यचित् । यदीच्छसि द्रुतं सिद्धिं ऐश्वर्यं चिरजीविताम् ॥ ११४॥
    आरोग्यं नृपसम्मानं तदा नामानि कीर्तयेत् । नाम्नां सहस्रं वाराह्याः मया ते समुदीरितम् ॥ ११५॥ यः पठेच्छृणुयाद्वापि
    सर्वपापैः प्रमुच्यते । अश्वमेधसहस्रस्य वाजपेयशतस्य च ॥ ११६॥ पुण्डरीकायुतस्यापि फलं पाठात् प्रजायते
    । पठतः सर्वभावेन सर्वाः स्युः सिद्धयः करे ॥ ११७॥ जायते महदैश्वर्यं सर्वेषां दयितो भवेत् । धनसारायते
    वह्निरगाधोऽब्धिः कणायते ॥ ११८॥ सिद्धयश्च तृणायन्ते विषमप्यमृतायते । हारायन्ते महासर्पाः सिंहः क्रीडामृगायते
    ॥ ११९॥ दासायन्ते महीपाला जगन्मित्रायतेऽखिलम् । तस्मान्नाम्नां सहस्रेण स्तुता सा जगदम्बिका । प्रयच्छत्यखिलान्
    कामान् देहान्ते परमां गतिम् ॥ १२०॥ ॥ इति उड्डामरतन्त्रान्तर्गतं श्रीआदिवाराहीसहस्रनामस्तोत्रं सम्पूर्णम्
    ॥
