id: narayaniyam-dashaka-78
category: stotram
name:
  english: Narayaniyam Dashaka 78
content:
  english: tridivavardhakivardhitakaushalam tridashadattasamastavibhutimat | jaladhimadhyagatam tvamabhushayo
    navapuram vapurancitarocisha || || dadushi revatabhubhriti revatim halabhrite tanayam vidhishasanat
    | mahitamutsavaghoshamapupushah samuditairmuditaih saha yadavaih || || atha vidarbhasutam khalu rukminim
    pranayinim tvayi deva sahodarah | svayamaditsata cedimahibhuje svatamasa tamasadhumupashrayan || ||
    ciradhritapranaya tvayi balika sapadi kankshitabhangasamakula | tava nivedayitum dvijamadishat svakadanam
    kadanangavinirmitam || || dvijasuto'pi ca turnamupayayau tava puram hi durashadurasadam | mudamavapa
    ca sadarapujitah sa bhavata bhavatapahrita svayam || || sa ca bhavantamavocata kundine nripasuta khalu
    rajati rukmini | tvayi samutsukaya nijadhiratarahitaya hi taya prahito'smyaham || || tava hrita'smi
    puraiva gunairaham harati mam kila cedinripo'dhuna | ayi kripalaya palaya mamiti prajagade jagadekapate
    taya || || asharanam yadi mam tvamupekshase sapadi jivitameva jahamyaham | iti gira sutanoratanot
    bhrisham suhridayam hridayam tava kataram || || akathayastvamathainamaye sakhe tadadhika mama manmathavedana
    | nripasamakshamupetya haramyaham tadayi tam dayitamasitekshanam || || pramuditena ca tena samam tada
    rathagato laghu kundinameyivan | gurumarutpuranayaka me bhavan vitanutam tanutam nikhilapadam ||
  devanagari: त्रिदिववर्धकिवर्धितकौशलं त्रिदशदत्तसमस्तविभूतिमत् । जलधिमध्यगतं त्वमभूषयो नवपुरं वपुरञ्चितरोचिषा
    ॥ ॥ ददुषि रेवतभूभृति रेवतीं हलभृते तनयां विधिशासनात् । महितमुत्सवघोषमपूपुषः समुदितैर्मुदितैः सह यादवैः
    ॥ ॥ अथ विदर्भसुतां खलु रुक्मिणीं प्रणयिनीं त्वयि देव सहोदरः । स्वयमदित्सत चेदिमहीभुजे स्वतमसा तमसाधुमुपाश्रयन्
    ॥ ॥ चिरधृतप्रणया त्वयि बालिका सपदि काङ्क्षितभङ्गसमाकुला । तव निवेदयितुं द्विजमादिशत् स्वकदनं कदनङ्गविनिर्मितम्
    ॥ ॥ द्विजसुतोऽपि च तूर्णमुपाययौ तव पुरं हि दुराशदुरासदम् । मुदमवाप च सादरपूजितः स भवता भवतापहृता स्वयम्
    ॥ ॥ स च भवन्तमवोचत कुण्डिने नृपसुता खलु राजति रुक्मिणी । त्वयि समुत्सुकया निजधीरतारहितया हि तया प्रहितोऽस्म्यहम्
    ॥ ॥ तव हृताऽस्मि पुरैव गुणैरहं हरति मां किल चेदिनृपोऽधुना । अयि कृपालय पालय मामिति प्रजगदे जगदेकपते
    तया ॥ ॥ अशरणां यदि मां त्वमुपेक्षसे सपदि जीवितमेव जहाम्यहम् । इति गिरा सुतनोरतनोत् भृशं सुहृदयं हृदयं
    तव कातरम् ॥ ॥ अकथयस्त्वमथैनमये सखे तदधिका मम मन्मथवेदना । नृपसमक्षमुपेत्य हराम्यहं तदयि तां दयितामसितेक्षणाम्
    ॥ ॥ प्रमुदितेन च तेन समं तदा रथगतो लघु कुण्डिनमेयिवान् । गुरुमरुत्पुरनायक मे भवान् वितनुतां तनुतां
    निखिलापदाम् ॥
