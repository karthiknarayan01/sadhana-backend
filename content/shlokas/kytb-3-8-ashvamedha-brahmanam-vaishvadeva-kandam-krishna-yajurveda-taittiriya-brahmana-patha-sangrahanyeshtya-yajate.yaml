    सम॑ष्ट्यै ॥ ब्रह्मौदनाभिधानम् चतु॑ष्टय्य॒ आपो॑ भवन्ति । चतु॑श्शफो॒ वा अश्वः॑ प्राजाप॒त्य स्समृ॑द्ध्यै
    ॥ ता दि॒ग्भ्य स्स॒माभृ॑ता भवन्ति । दि॒क्षु वा आपः॑ । अन्नं॒ वाँ आपः॑ । अ॒द्भ्यो वा अन्न॑ ञ्जायते ।
