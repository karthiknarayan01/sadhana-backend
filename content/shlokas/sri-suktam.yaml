id: sri-suktam
category: stotram
name:
  english: Sri Suktam
  devanagari: श्रीसूक्तं (पौराणीकम्)
content:
  english: devyabhisheke pauranam shrisuktam - hiranyavarnam himaraupyaharam candram tvadiyam ca hiranyarupam
    | lakshmim mrigirupadharam (1) shriyam tvam madarthamakaraya jatavedah || 1|| yasyam sulakshmyamahamagatayam
    hiranyago'shvatmajamitradasan | labheyamashu hyanapayinim tam madarthamakaraya jatavedah || 2|| pratyahvaye
    tamahamashvapurvam devim shriyam madhyaratham samipam | prabodhinim hastisubrimhitenahuta maya sa
    kila sevatam mam || 3|| kamsosmitam tamihadmavarnamadram suvarnavaranam jvalantim | triptam hi bhaktanatha
    tarpayantimupahvaye'ham kamalasanastham || 4|| loke jvalantim yashasa prabhasam candramudamuta devajushtam
    | tam padmarupam sharanam prapadye shriyam vrine tvom vrajatamalakshmih || 5|| vanaspatiste tapaso'dhijato
    vriksho'tha bilvastarunarkavarne | phalani tasya tvadanugrahena maya alakshmishca nudantu bahyah ||
    6|| upaitu mam devasakhah kuberah sa dakshakanya manina ca kirtih | jato'smi rashtre kila martyaloke
    kirtim samriddhim ca dadatu mahyam || 7|| kshuttritkrishangi malinamalakshmim tavagrajam tamutanashayami
    | sarvamabhutim hyasamriddhimambe grihanca (grihacca) nishkasaya me drutam tvam || 8|| kenapyadharshammatha
    gandhacihnam pushtam gavashvadiyutam ca nityam | padmalaye sarvajaneshvarim tam pratyahvaye'ham khalu
    matsamipam || 9|| labhemahi shrimanasashca kamam vacastu satyam ca sukalpitam vai | annasya bhakshyam
    ca payah pashunam sampaddhi mayyashrayatam yashashca || 10|| mayi prasadam kuru kardama tvam prajavati
    shrirabhavattvaya hi | kule pratishthapaya mem shriyam vai tvanmataram tamuta padmamalam || 11|| snigdhani
    capo'bhisrijantvajasram ciklitavasam kuru madgrihe tvam | kule shriyam mataramashume'dya shriputra
    samvasayatam ca devim || 12|| tam pingalam pushkarinim ca lakshmimadram ca pushtim shubhapadmamalam
    || candraprakasham ca hiranyarupam madarthamakaraya jatavedah || 13|| adram(adrim) tatha yashtikaram
    suvarnam tam yashtirupamatha hemamalam | suryaprakasham ca hiranyarupam madarthamakaraya jatavedah
    || 14|| yasyam prabhutam kanakam ca gavo dasyasturanganpurushamshca satyam | vindeyamashu hyanapayinim
    tam madarthamakaraya jatavedah || 15|| shriyah pancadashashlokam suktam pauranamanvaham | yah pathejjuhuyaccajyam
    shriyutah satatam bhavet || 16|| iti pauranikam shrisuktam samaptam | 1 mrigirupadharam shrirdhritva
    harinirupamaranye sancara ha iti puranavacanat
  devanagari: देव्यभिषेके पौराणं श्रीसूक्तम् - हिरण्यवर्णां हिमरौप्यहारां चन्द्रां त्वदीयां च हिरण्यरूपाम्
    । लक्ष्मीं मृगीरूपधरां (१) श्रियं त्वं मदर्थमाकारय जातवेदः ॥ १॥ यस्यां सुलक्ष्म्यामहमागतायां हिरण्यगोऽश्वात्मजमित्रदासान्
    । लभेयमाशु ह्यनपायिनीं तां मदर्थमाकारय जातवेदः ॥ २॥ प्रत्याह्वये तामहमश्वपूर्वां देवीं श्रियं मध्यरथां
    समीपम् । प्रबोधिनीं हस्तिसुबृंहितेनाहूता मया सा किल सेवतां माम् ॥ ३॥ कांसोस्मितां तामिहद्मवर्णामाद्रां
    सुवर्णावरणां ज्वलन्तीम् । तृप्तां हि भक्तानथ तर्पयन्तीमुपह्वयेऽहं कमलासनस्थाम् ॥ ४॥ लोके ज्वलन्तीं
    यशसा प्रभासां चन्द्रामुदामुत देवजुष्टाम् । तां पद्मरूपां शरणं प्रपद्ये श्रियं वृणे त्वों व्रजतामलक्ष्मीः
    ॥ ५॥ वनस्पतिस्ते तपसोऽधिजातो वृक्षोऽथ बिल्वस्तरुणार्कवर्णे । फलानि तस्य त्वदनुग्रहेण माया अलक्ष्मीश्च
    नुदन्तु बाह्याः ॥ ६॥ उपैतु मां देवसखः कुबेरः सा दक्षकन्या मणिना च कीर्तिः । जातोऽस्मि राष्ट्रे किल
    मर्त्यलोके कीर्तिं समृद्धिं च ददातु मह्यम् ॥ ७॥ क्षुत्तृट्कृशाङ्गी मलिनामलक्ष्मीं तवाग्रजां तामुतनाशयामि
    । सर्वामभूतिं ह्यसमृद्धिमम्बे गृहाञ्च (गृहाच्च) निष्कासय मे द्रुतं त्वम् ॥ ८॥ केनाप्यधर्षाम्मथ गन्धचिह्नां
    पुष्टां गवाश्वादियुतां च नित्यम् । पद्मालये सर्वजनेश्वरीं तां प्रत्याह्वयेऽहं खलु मत्समीपम् ॥ ९॥ लभेमहि
    श्रीमनसश्च कामं वाचस्तु सत्यं च सुकल्पितं वै । अन्नस्य भक्ष्यं च पयः पशूनां सम्पद्धि मय्याश्रयतां
    यशश्च ॥ १०॥ मयि प्रसादं कुरु कर्दम त्वं प्रजावती श्रीरभवत्त्वया हि । कुले प्रतिष्ठापय में श्रियं वै
    त्वन्मातरं तामुत पद्ममालाम् ॥ ११॥ स्निग्धानि चापोऽभिसृजन्त्वजस्रं चिक्लीतवासं कुरु मद्गृहे त्वम् ।
    कुले श्रियं मातरमाशुमेऽद्य श्रीपुत्र संवासयतां च देवीम् ॥ १२॥ तां पिङ्गलां पुष्करिणीं च लक्ष्मीमाद्रां
    च पुष्टिं शुभपद्ममालाम् ॥ चन्द्रप्रकाशां च हिरण्यरूपां मदर्थमाकारय जातवेदः ॥ १३॥ आद्रां(आद्रीं) तथा
    यष्टिकरां सुवर्णां तां यष्टिरूपामथ हेममालाम् । सूर्यप्रकाशां च हिरण्यरूपां मदर्थमाकारय जातवेदः ॥ १४॥
    यस्यां प्रभूतं कनकं च गावो दास्यस्तुरङ्गान्पुरुषांश्च सत्याम् । विन्देयमाशु ह्यनपायिनीं तां मदर्थमाकारय
    जातवेदः ॥ १५॥ श्रियः पञ्चदशश्लोकं सूक्तं पौराणमन्वहम् । यः पठेज्जुहुयाच्चाज्यं श्रीयुतः सततं भवेत्
    ॥ १६॥ इति पौराणीकम् श्रीसूक्तं समाप्तम् । १ मृगीरूपधरां श्रीर्धृत्वा हरिणीरूपमरण्ये सञ्चार ह इति पुराणवचनात्
