id: harisahasranamastotram
category: sahasranama
name:
  english: harisahasranamastotram
  devanagari: हरिसहस्रनामस्तोत्रम्
content:
  english: rharaih shekharapanktibhishca hridaye shuklambaram cintaye || 5|| atha sahasranamastotram |
    om svami brahma parabrahma shrikrishnah purushottamah | brahmadhama vasudeva ishesho divyavigrahah
    || 6|| suvratatma gajannatha ishtadah karunanidhih | pratapasimhasharanam shatanandavarapradah ||
    7|| narayano narasakho badarishastapah priyah | svadharmastho munidhyeyo maharshiganapujitah || 8||
    adharmavairi durvasah saptadharmadyanugrahah | dharmavataro dharmatma bhaktidharmanushasanah || 9||
    ramanando janananda auddhavadhvapravartakah | vishnuyagapriyo bhaktidharmaradhita ishvarah || 10||
    vrindavanendurvaradomunisanghahitavahah | dronyartiharta vighnesho dharmasankashtanashanah || 11||
    bhaktidharmatmajo bhuma bhaktidharmatapahphalam | savarnigotratilakomadhvadyanavamijanuh || 12|| janamangaladivyango
    narakritiralaukikah | bhutalanandajanako dvijendrakulabhushanam || 13|| ramapratapavarajo hanumadabhirakshitah
    | harikrishno harih krishno nilakantho vrishatmajah || 14|| strivrindalalito bhaktinandanah priyadarshanah
    | hariprasadaharshabdhidharmapratnistanandhayah || 15|| kridadbalavrajanandah kalidattamadapanut |
    iccharamagrajo'yodyavaso balyamanoharah || 16|| sarayuniyatasnanah sitaramekshanotsukah | pradakshinikritayodhyah
    karattajapamalikah || 17|| varnivratadharo danto gurubhaktah udaradhih | adhitakhilasacchastrah samago
    nirahankritih || 18|| prasupadishtasangatmabhaktirajnanaharakah | pitriprattatmavijnanah pitridivyagatipradah
    || 19|| nirashastivravairagyah santyaktagrihabandhavah | varnivesho mahasattvah svajanajnatanirgamah
    || 20|| asamlambitasacchastrasaroddharalpapustakah | ganamshasmaranastirnasarayudaityamohanah || 21||
    vanavasarucih shraddho viprendro naishthikagranih | himadrisanucarano nirbhayo bhitabhairavah || 22||
    nihshankastho hanumaddattasvaduphalashanah | pulahashramavaso'rkaprinano'rkasamikshanah || 23|| urdhvadorekapadastho
    vismapitatapodhanah | krisho mahatapah shuddho bhaktidharmanishevitah || 24|| gopalayogisampraptasangayogo'tidhairyavan
    | yogakriyapatuh karta kritajno bhuritirthakrit || 25|| brahmatmasamsthitih shantah siddhavallabhapujitah
    | gopalarakshakah siddhadarpaha mantrikarcitah || 26|| tailangavipradoshaghnah krityabhishanadarshanah
    | pivaikamanahakalabhairavatrasadekshanah || 27|| jagannathapuravasa asuraveshahridvibhuh | dharmiko'suragurvoghocchedaheturavikriyah
    || 28|| satradharmarcitah kantah svapratapakshitasurah | nanatirthakritavasah pravridabhravakashakrit
    || 29|| grishmasadhitapancagnih shishirambusthitih shucih | nirmano nirmamo'sneho nishkamo nirjitendiryah
    || 30|| jitanidro jitakrodho nirmado nihspriho'calah | kricchravrati satyavadi kshami dharmanisantatah
    || 31|| jitatryavasyo medhavi dambhahinastapodhanah | upavitivalkavasastarumulaniketanah || 32|| ahimsavrittistejasvi
    nirnimeshavilocanah | dhanurmukteshugamano brahmadarshi mahamatih || 33|| ayacitahritaro nirdvandvo
    nishparigrahah | vayvaharo jalaharo mitaharo'kshatangah || 34|| jnani dhyani jitasvadah pratyaharahatho'smayah
    | pavanastairthikaguruvarnirajo dayakarah || 35|| jati kaupinavasanah shalagramatrishaharah | shivaptasakturakshobhyo
    nihsango'dhyavittamah || 36|| sadasamadhiranandi nirdosho doshanashanah | kantaragatirekakisarvasadhugunalayah
    || 37|| tairthikastirtha dharmajnasatirthasthadharmanashanah | anadritavapuh saukhyah pranayamaparo
    vrati || 38|| rishivrittirmunirmauninirvikalpo'lpabhashanah | vastraputodakapibo yavadarthagaceshtitah
    || 39|| brahmajnasvairavartitvabodhigranthavivarjanah | nirupanadaprishtadhvaghoraranyacaro'bhramah
    || 40|| stryangagandhasaho'sakto jadangirasavartanah | urdhvareta brahmacari yogi yogajnasannatah
    || 41|| yogindra dushcaracarah saurashtrajanapavanah | lojalokamahanandah sadhuh sadhuprapujitah ||
    42|| anuccaritadurvakyo madhuraksharabhashanah | tyagimanyo mahayogi sadashcaryakriyah sthirah ||
    43|| dhyata dhyatrimanodarshimanasvi manado mriduh | prashnottarapaturvedatattvajno buddhimanbudhah
    || 44|| uddhavekshotsuko'nantahpatrilekhapatuh prabhuh | patryuttarajnatanijaishvarya sadhvatimanitah
    || 45|| ramanandasvamivikshanandah sadhupriyah prayah | bodhanyaptamahadiksho gurusevaparo yami ||
    46|| bhakto narayanamunih sahajananda atmadrik | gurumanyo gurupreshtho gurvantikakritanjalih || 47||
    gurvajnakritatatparshvopaveshagamanakriyah | narayanananyamatirekantikamunipriyah || 48|| varnindro
    naishthikapreshtha ekantikasadarcakah | yashasvi bhuritejasvi vaidiko brahmavarcasi || 49|| sannyayavarti
    nirdvesho bhaktiharshavivardhanah | grihitahitavak sarvabhutatattvaviduhavan || 50|| satyapriyah satyaparo
    nishkamanaravallabhah | adrohakah sadodyogi shadurmivijayakshamah || 51|| dharmakaryakshiprakari dirdhadarshi
    vicaravan | deshakaladyavihatasvasvarupacalasthitih || 52|| sattamo damadhriddaksho vinitah smritiman
    rijuh | sacchastravyasano'vyagri'bhimanipurusharucih || 53|| atisarvamatirvagmi satsangijanavallabhah
    | apramatto'tipragalbho'nalaso'nyagunagrahah || 54|| sadacarapriyah shushkajnanivadatamoravih | krishnarpitannagandhadidevatapitriyajakah
    || 55|| sadyah prashnasamadhanavismapitasabhajanah | ajatashatruh samaddak dharmanishthamahadarah
    || 56|| anasuyo'camaprajnah kamashastravivarjanah | dinalpaviklvatvekshajatatipravyathakulah || 57||
    svadharmadigunopetaharya bhaktajanarucih | sanmandalavasaruci sanmandalaparayanam || 58|| sacchastraninditatyagi
    prashastarthanishevakah | sampadapatsamo mokshadhishanah pratibhanavan || 59|| sucirashrutasacchastro
    napamanitasajjanah | vakyarthakshipravicchatrumitradattasamottarah || 60|| agrahyavastvanakankshi
    nashtavastusucojjhitah | yayocitasamarambhah saphalarabdhasatkriyah || 61|| sacchastranugataprajno
    daivapitryasvakarmakrit | apaishunyakridadyutah papisamsargyanadarah || 62|| brahmanindashravahkhedah
    striprasangabhrisharucih | akaryacaranahitah samayocitabhashanah || 63|| nirlajjanatasadvipragurudevapadambujah
    | muktanandanugastushto gunabdi sanmanoharah || 64|| gurudattajanasvamyah suramyavishayarucih | guruyacitabhaktantaduhkhasvapraptisadvarah
    || 65|| atimanushasatkarma sukhasevyo'khileshtadah | prapannabhayadah shrimanuttamottama atmavan ||
    66|| tapatritayahridvartah sadasadvyaktivittamah | satpatih sarvahitakrijjnanado bhavamocakah || 67||
    bhuripratapo nirmoho maharajo nriparcitah | adhrishyo'vikrito'jayah sharanyo bhaktavatsalah || 68||
    atarkyo'nupamo'paro'pramado'vyaya ujjvalah | dharmashamsi dharmaheturvedagudharthabodhakah || 69||
    kalamayabhayatrata bhaktavarma sumangalah | upasanaritivakta brahmadhamavradarshakah || 70|| brahmabhutaparabrahmopasanasthapako'ksharah
    | kandarpadarpadalano naishthikaprataposhakah || 71|| adinadivyacarito manonigrahyuktidah | varaniyo'nyaduhkhajnah
    samsararnavanavikah || 72|| svaminarayano vakyasudhatarpitasatsabhah | vidhavasparshadoshatiprakhyatopashamasthitih
    || 73|| pratibimbamshavadadimatatuladavanalah | sabhaktidharmadharmadhyabhaktiyogapravartakah || 74||
    proktasaddeshakaladidosho nishkapatapriyah | saddeshakaladigunajnapakah satprashamsakah || 75|| svadharmashithilapritirbhaktakalpamahiruhah
    | dharmahinajnanabhaktidoshabhuyastvabodhakah || 76|| svadharmahinapurushatyagi satyapratishrutah
    | bahvannasatro vishnvadipancayatanamananah || 77|| vipraparadhasahanah satyasankalpa ashudah | sanvayadharmamulaghno
    yajnakridbrahmanapriyah || 78|| vishnusvarupavishkaro nirmayah sarvadarshanah | janasahasrayugapatsamadhisthitikarakah
    || 79|| svekshayatanarastryoghanyo'nyasammardasadyashah | viprabhojanasamhrishto vipratma viprapujitah
    || 80|| vedaikavedyo divyango meghajiddarpabhanjanah | sarvayogakalodbhasi svatantrah sarvavidvashi
    || 81|| krishnatma''krishtahridayo deshiko divyadarshanah | golokaramano brahmakrido vaikunthanayakah
    || 82|| anekamurtirandastho bahihstho yogashikshakah | purahsaro manovegah svaneta darshitamarah ||
    83|| vishnuyagasamarambhah shanmasashitavadavah | nanadeshagatirnanayajnakridbhuridakshinah || 84||
    sadyahsamadhih sarvatma nirishamatakhandanah | makarapancakoccheta dharmasargapraposhakah || 85||
    papikritantah paramah punyakirtih prithushruvah | krishodhdhavadhvasamposhta sadhvidharmapravartakah
    || 86|| daityamshagurukhadyotabhaskaro dharmadharakah | lobhadidoshagadita tamasavratavarjanah ||
    87|| suvratah siddhidah siddhah siddheshah siddhipo'cyutah | kauladhvashapadah proktasuralakshma'suratigah
    || 88|| bhujanganagaranando nijabhaktastuto mahan | ahimsasthapako bhurinijaishvaryapradarshakah ||
    89|| duradeshasthatmabhakta datta sakshatsvadarshanah | sacchastroditasatkirtiratyantikagatipradah
    || 90|| parapakarasahasravismritih komalantarah | pashandarakshitatmiyo daityamohanaceshtitah || 91||
    akhanditarshamaryadah paraguhyaprakashakah | patrarpitabahudravyo yathayuktopadeshakah || 92|| avigrahapriyo
    vanidandaparushyavarjitah | brahmanyadevo devejyo dasharupapradarshakah || 93|| akunthitavaca deshacarajno'nadritoddhatah
    | shiksharthakshanarun nityamaitrah sacchastrasangrahi || 94|| dharmipakshah sadhusevi punyashravanakirtanah
    | pranatartiharah pujyo vishayasaktanindakah || 95|| bhaktadehantasamayadattadivyasvadarshanah | yamadutavitasviyo
    narakartinivarakah || 96|| sanmargavartitasheshasvashritah shighrasiddhidah | anayarogivriddharbhabhikshuposhanakarakah
    || 97|| gudhashayo gudhamantrah sarvajivapratarakah | bhaktasadvasanocchetta'sadagrahavivarjanah ||
    98|| poshyavarganuvihitatatsamanamitashanah | apatkalatyaktanijah pancakalarcitacyutah || 99|| yogeshvaro
    munipatirnityamukto mahamunih | bauddhadinastikamatakhandanah panditarcitah || 100|| ahimsayajnaprastota
    vaishnavakratukarakah | madyamamsasuragandhaghranashuddhividhapakah || 101|| mattonmattakhalavadi
    puraskritagunadhikah | nanabhaktajananandah sadasadvyaktidarshakah || 102|| bhrigunandishashapartajanarakshaka
    uttamah | vedavicchastravidvadidurjeyo hritasamshayah || 103|| khatvangatma hridambhojadhyeyo dhyatrimanoharah
    | jyotih samstho'tiramyangah surekharunapattalah || 104|| carvangulirnakhendvalirprabhapahritahrittamah
    | padmakoshatimridulacaranastungagulphakah || 105|| hrasvajangho vrittajanuh samoruh satsitamshukah
    | gambhiranabhirajanubhujastatabhujantarah || 106|| kanthalambitaharalih kambukantho'runadharah |
    praphullapadmavadanah kundadanto mitasmitah || 107|| tilapushpabhanasantashyamabinduh samashravah
    | vamashravo'ntarashyamabinduh padmadalekshanah || 108|| vishalabhalatilakah sukshmavakrashiroruhah
    | shirah patalasatpushpapidarajih svabhaktadrik || 109|| avatari bhayatrata'bhayarajavarapradah |
    kritadurgapuravasah krodhayanta'dbhutakriyah || 110|| nanadeshapreshitasvabhaktanashitadushkriyah
    | asuraklishtasatsanghasantvanah sadhuvallabhah || 111|| sadrohigurubhupalashikshakakshmesharajyadah
    | gavendrarcitapadabjo gavendravarado'nadhah || 112|| bhaktatratoddhavasvamisampradayaprakashakah
    | vipraprashamsanastirthavidhibodhaka artihrit || 113|| viprasantarpano nanapratavakta mahayasha |
    kaulocchidvijayo varnyavishnuyagamahotsavah || 114|| bhaktigamyo bhaktavashah kritadigvijayo'kshayah
    | bhaktidharmakritanandah sarvamangaladarshanah || 115|| uttamatma jayopreshtho laliteshtavarapradah
    | mukundasevasantushto jayanitapayahpibah || 116|| narayanadhritamantro vasudevadattacandanah | gopalamanjitamantro'khandaptarcanasadhanah
    || 117|| umanathaptapushpadirjayaprakshalitambarah | lalitasamskritannadih pancalyaliptapakabhuh ||
    118|| avaramarjitavasah shivopanitapadukah | dayagovindaptavanyo mayaramavitambarah || 119|| prayagoktapuranadhirnishanityakathadarah
    | muktabrahmastutayashah premagitagunashrutih || 120|| mahanubhavamuditah shukarakshitapustakah |
    anandakalpitavasah vijayotsavatoshitah || 121|| yatharhakaritatmiyasevano bhaktakamadhuk | nibaddhotsavaparyayo
    vijayotsavatoshitah || 122|| annakutakritanujno mahasambharaharakah | patradutahutabhaktah pakashalavalokanah
    || 123|| pratyudgatamunivrato manitakhilavaishnavah | satprinanah kshanasvapo dipalimangalaplavah
    || 124|| brahmakshanashuvihitanaityako'khiladharmavit | carucakrakapithastha uttamakshmeshapujitah
    || 125|| bhaktasvekshapradanotko mayaramekshanasmitah | bhaktasamprinanadhritanutanamshukabhushanah
    || 126|| anarghyapitakausheyaparidhanavicakshanah | mukutakritisambaddhashonashirshapatadyutih ||
    127|| sasvarnabindukausumbhasatkancukadhritiprabhah | skandhollasaddhaimapatah katibaddharunamshukah
    || 128|| haimangadalasadbahuh karnashobhitakundalah | kanthalambitasasvarnamuktaharalishobhanah ||
    129|| cancatsuvarnakatakasha
  devanagari: र्हारैः शेखरपङ्क्तिभिश्च हृदये शुक्लाम्बरं चिन्तये ॥ ५॥ अथ सहस्रनामस्तोत्रम् । ॐ स्वामि
    ब्रह्म परब्रह्म श्रीकृष्णाः पुरुषोत्तमः । ब्रह्मधामा वासुदेव ईशेशो दिव्यविग्रहः ॥ ६॥ सुव्रतात्मा गजन्नाथ
    इष्टदः करुणानिधिः । प्रतापसिंहशरणं शतानन्दवरप्रदः ॥ ७॥ नारायणो नरसखो बदरीशस्तपः प्रियः । स्वधर्मस्थो
    मुनिध्येयो महर्षिगणपूजितः ॥ ८॥ अधर्मवैरी दुर्वासः सप्तधर्माद्यनुग्रहः । धर्मावतारो धर्मात्मा भक्तिधर्मानुशासनः
    ॥ ९॥ रामानन्दो जनानन्द औद्धवाध्वप्रवर्तकः । विष्णुयागप्रियो भक्तिधर्माराधित ईश्वरः ॥ १०॥ वृन्दावनेन्दुर्वरदोमुनिसङ्घहितावहः
    । द्रोण्यर्तिहर्ता विघ्नेशो धर्मसङ्कष्टनाशनः ॥ ११॥ भक्तिधर्मात्मजो भूमा भक्तिधर्मतपःफलम् । सावर्णिगोत्रतिलकोमध्वाद्यनवमीजनुः
    ॥ १२॥ जनमङ्गलदिव्याङ्गो नराकृतिरलौकिकः । भूतलानन्दजनको द्विजेन्द्रकुलभूषणम् ॥ १३॥ रामप्रतापावरजो हनूमदभिरक्षितः
    । हरिकृष्णो हरिः कृष्णो नीलकण्ठो वृषात्मजः ॥ १४॥ स्त्रीवृन्दलालितो भक्तिनन्दनः प्रियदर्शनः । हरिप्रसादहर्षाब्धिधर्मप्रत्नीस्तनन्धयः
    ॥ १५॥ क्रीडद्बालव्रजानन्दः कालीदत्तमदापनुत् । इच्छारामाग्रजोऽयोद्यावासो बाल्यमनोहरः ॥ १६॥ सरयूनियतस्नानः
    सीतारामेक्षणोत्सुकः । प्रदक्षिणीकृतायोध्यः करात्तजपमालिकः ॥ १७॥ वर्णिव्रतधरो दान्तो गुरुभक्तः उदारधीः
    । अधीताखिलसच्छास्त्रः सामगो निरहङ्कृतिः ॥ १८॥ प्रसूपदिष्टसाङ्गात्मभक्तिरज्ञानहारकः । पितृप्रत्तात्मविज्ञानः
    पितृदिव्यगतिप्रदः ॥ १९॥ निराशस्तीव्रवैराग्यः सन्त्यक्तगृहबान्धवः । वर्णीवेषो महासत्त्वः स्वजनाज्ञातनिर्गमः
    ॥ २०॥ असंलम्बितसच्छास्त्रसारोद्धाराल्पपुस्तकः । गणंशस्मरणस्तीर्णसरयूदैत्यमोहनः ॥ २१॥ वनवासरुचिः श्राद्धो
    विप्रेन्द्रो नैष्ठिकाग्रणीः । हिमाद्रिसानुचरणो निर्भयो भीतभैरवः ॥ २२॥ निःशङ्कस्थो हनुमद्दत्तस्वादुफलाशनः
    । पुलहाश्रमवासोऽर्कप्रीणनोऽर्कसमीक्षणः ॥ २३॥ ऊर्ध्वदोरेकपादस्थो विस्मापिततपोधनः । कृशो महातपाः शुद्धो
    भक्तिधर्मनिषेवितः ॥ २४॥ गोपालयोगिसम्प्राप्तसाङ्गयोगोऽतिधैर्यवान् । योगक्रियापटुः कर्ता कृतज्ञो भूरितीर्थकृत्
    ॥ २५॥ ब्रह्मात्मसंस्थितिः शान्तः सिद्धवल्लभपूजितः । गोपालरक्षकः सिद्धदर्पहा मान्त्रिकार्चितः ॥ २६॥
    तैलङ्गविप्रदोषघ्नः कृत्याभीषणदर्शनः । पिवैकमानहाकालभैरवत्रासदेक्षणः ॥ २७॥ जगन्नाथपुरावास आसुरावेशहृद्विभुः
    । धार्मिकोऽसुरगुर्वोघोच्छेदहेतुरविक्रियः ॥ २८॥ सत्रधर्मार्चितः कान्तः स्वप्रतापाक्षितासुरः । नानातीर्थकृतावासः
    प्रावृडभ्रावकाशकृत् ॥ २९॥ ग्रीष्मसाधितपञ्चाग्निः शिशिराम्बुस्थितिः शुचिः । निर्मानो निर्ममोऽस्नेहो
    निष्कामो निर्जितेन्दिर्यः ॥ ३०॥ जितनिद्रो जितक्रोधो निर्मदो निःस्पृहोऽचलः । कृच्छ्रव्रती सत्यवादी
    क्षमी धर्मनिसन्ततः ॥ ३१॥ जितत्र्यवस्यो मेधावी दम्भहीनस्तपोधनः । उपवीतीवल्कवासास्तरुमूलनिकेतनः ॥ ३२॥
    अहिंसवृत्तिस्तेजस्वी निर्निमेषविलोचनः । धनुर्मुक्तेषुगमनो ब्रह्मदर्शी महामतिः ॥ ३३॥ अयाचिताहृतारो
    निर्द्वन्द्वो निष्परिग्रहः । वाय्वाहारो जलाहारो मिताहारोऽक्षताङ्गः ॥ ३४॥ ज्ञानी ध्यानी जितस्वादः प्रत्याहारहठोऽस्मयः
    । पावनस्तैर्थिकगुरुवर्णिराजो दयाकरः ॥ ३५॥ जटी कौपीनवासनः शालग्रामतृषाहरः । शिवाप्तसक्तुरक्षोभ्यो निःसङ्गोऽध्यावित्तमः
    ॥ ३६॥ सदासमाधिरानन्दी निर्दोषो दोषनाशनः । कान्तारगतिरेकाकीसर्वसाधुगुणालयः ॥ ३७॥ तैर्थिकस्तीर्थ धर्मज्ञसतीर्थस्थाधर्मनाशनः
    । अनादृतवपुः सौख्यः प्राणायामपरो व्रती ॥ ३८॥ ऋषिवृत्तिर्मुनिर्मौनीनिर्विकल्पोऽल्पभाषणः । वस्त्रपूतोदकपिबो
    यावदर्थागचेष्टितः ॥ ३९॥ ब्रह्मज्ञस्वैरवर्तित्वबोधिग्रन्थविवर्जनः । निरूपानदपृष्टाध्वाघोरारण्यचरोऽभ्रमः
    ॥ ४०॥ स्त्र्यङ्गगन्धासहोऽसक्तो जडाङ्गिरसवर्तनः । ऊर्ध्वरेता ब्रह्मचारी योगी योगज्ञसन्नतः ॥ ४१॥ योगीन्द्र
    दुश्चराचारः सौराष्ट्रजनपावनः । लोजलोकमहानन्दः साधुः साधुप्रपूजितः ॥ ४२॥ अनुच्चारितदुर्वाक्यो मधुराक्षरभाषणः
    । त्यागिमान्यो महायोगी सदाश्चर्यक्रियः स्थिरः ॥ ४३॥ ध्याता ध्यातृमनोदर्शीमनस्वी मानदो मृदुः । प्रश्नोत्तरपटुर्वेदतत्त्वज्ञो
    बुद्धिमान्बुधः ॥ ४४॥ उद्धवेक्षोत्सुकोऽनन्तःपत्रीलेखपटुः प्रभुः । पत्र्युत्तरज्ञातनिजैश्वर्य साध्वतिमानितः
    ॥ ४५॥ रामानन्दस्वामिवीक्षानन्दः साधुप्रियः प्रयः । बोधन्याप्तमहादीक्षो गुरुसेवापरो यमी ॥ ४६॥ भक्तो
    नारायणमुनिः सहजानन्द आत्मदृक् । गुरुमान्यो गुरुप्रेष्ठो गुर्वन्तिककृताञ्जलिः ॥ ४७॥ गुर्वाज्ञाकृततत्पार्श्वोपवेशगमनक्रियः
    । नारायणानन्यमतिरेकान्तिकमुनिप्रियः ॥ ४८॥ वर्णीन्द्रो नैष्ठिकप्रेष्ठ एकान्तिकसदर्चकः । यशस्वी भूरितेजस्वी
    वैदिको ब्रह्मवर्चसी ॥ ४९॥ सन्न्यायवर्ती निर्द्वेषो भक्तिहर्षविवर्धनः । गृहीतहितवाक् सर्वभूततत्त्वविदूहवान्
    ॥ ५०॥ सत्यप्रियः सत्यपरो निष्कामनरवल्लभः । अद्रोहकः सदोद्योगी षडूर्मिविजयक्षमः ॥ ५१॥ धर्मकार्यक्षिप्रकारी
    दीर्धदर्शी विचारवान् । देशकालाद्यविहतस्वस्वरूपाचलस्थितिः ॥ ५२॥ सत्तमो दमधृद्दक्षो विनीतः स्मृतिमान्
    ऋजुः । सच्छास्त्रव्यसनोऽव्यग्रीऽभिमानिपुरुषारुचिः ॥ ५३॥ अतिसर्वमतिर्वाग्मी सत्सङ्गिजनवल्लभः । अप्रमत्तोऽतिप्रगल्भोऽनलसोऽन्यगुणग्रहः
    ॥ ५४॥ सदाचारप्रियः शुष्कज्ञानिवादतमोरविः । कृष्णार्पितान्नगन्धादिदेवतापितृयाजकः ॥ ५५॥ सद्यः प्रश्नसमाधानविस्मापितसभाजनः
    । अजातशत्रुः समद्दक् धर्मनिष्ठमहादरः ॥ ५६॥ अनसूयोऽचमप्रज्ञः कामशास्त्रविवर्जनः । दीनाल्पविक्ल्वत्वेक्षाजाततीप्रव्यथाकुलः
    ॥ ५७॥ स्वधर्मादिगुणोपेतहर्य भक्तजनारुचिः । सन्मण्डलावासरुचि सन्मण्डलपरायणम् ॥ ५८॥ सच्छास्त्रनिन्दितत्यागी
    प्रशास्तार्थनिषेवकः । सम्पदापत्समो मोक्षधिषणः प्रतिभानवान् ॥ ५९॥ सुचिरश्रुतसच्छास्त्रो नापमानितसज्जनः
    । वाक्यार्थक्षिप्रविच्छत्रुमित्रदत्तसमोत्तरः ॥ ६०॥ अग्राह्यवस्त्वनाकाङ्क्षी नष्टवस्तुसुचोज्झितः ।
    ययोचितसमाराम्भः सफलारब्धसत्क्रियः ॥ ६१॥ सच्छास्त्रानुगतप्रज्ञो दैवपित्र्यस्वकर्मकृत् । अपैशुन्यकृदद्यूतः
    पापिसंसर्ग्यनादरः ॥ ६२॥ ब्रह्मनिन्दाश्रवःखेदः स्त्रीप्रसङ्गभृशारुचिः । अकार्याचरणहीतः समयोचितभाषणः
    ॥ ६३॥ निर्लज्जानतसद्विप्रगुरुदेवपदाम्बुजः । मुक्तानन्दानुगस्तुष्टो गुणाब्दि सन्मनोहरः ॥ ६४॥ गुरुदत्तजनस्वाम्यः
    सुरम्यविषयारुचिः । गुरुयाचितभक्तान्तदुःखस्वप्राप्तिसद्वरः ॥ ६५॥ अतिमानुषसत्कर्मा सुखसेव्योऽखिलेष्टदः
    । प्रपन्नाभयदः श्रीमानुत्तमोत्तम आत्मवान् ॥ ६६॥ तापत्रितयहृद्वार्तः सदसद्व्यक्तिवित्तमः । सत्पतिः
    सर्वहितकृज्ज्ञानदो भवमोचकः ॥ ६७॥ भूरिप्रतापो निर्मोहो महाराजो नृपार्चितः । अधृष्योऽविकृतोऽजयः शरण्यो
    भक्तवत्सलः ॥ ६८॥ अतर्क्योऽनुपमोऽपारोऽप्रमादोऽव्यय उज्ज्वलः । धर्मशंसी धर्महेतुर्वेदगूढार्थबोधकः ॥
    ६९॥ कालमायाभयत्राता भक्तवर्म सुमङ्गलः । उपासनारीतिवक्ता ब्रह्मधामव्रदर्शकः ॥ ७०॥ ब्रह्मभूतपरब्रह्मोपासनास्थापकोऽक्षरः
    । कन्दर्पदर्पदलनो नैष्ठिकप्रतपोषकः ॥ ७१॥ अदीनदिव्यचरितो मनोनिग्रह्युक्तिदः । वरणीयोऽन्यदुःखज्ञः संसारार्णवनाविकः
    ॥ ७२॥ स्वामिनारायणो वाक्यसुधातर्पितसत्सभः । विधवास्पर्शदोषातिप्रख्यातोपशमस्थितिः ॥ ७३॥ प्रतिबिम्बांशवादादिमततूलदवानलः
    । सभक्तिधर्मधर्माढ्यभक्तियोगप्रवर्तकः ॥ ७४॥ प्रोक्तासद्देशकालादिदोषो निष्कपटप्रियः । सद्देशकालादिगुणज्ञापकः
    सत्प्रशंसकः ॥ ७५॥ स्वधर्मशिथिलाप्रीतिर्भक्तकल्पमहीरुहः । धर्महीनज्ञानभक्तिदोषभूयस्त्वबोधकः ॥ ७६॥ स्वधर्महीनपुरुषत्यागी
    सत्यप्रतिश्रुतः । बह्वन्नसत्रो विष्ण्वादिपञ्चायतनमाननः ॥ ७७॥ विप्रापराधसहनः सत्यसङ्कल्प आशुदः । सान्वयाधर्ममूलघ्नो
    यज्ञकृद्ब्राह्मणप्रियः ॥ ७८॥ विष्णुस्वरूपाविष्कारो निर्मायः सर्वदर्शनः । जनसाहस्रयुगपत्समाधिस्थितिकारकः
    ॥ ७९॥ स्वेक्षायातनरस्त्र्योघान्योऽन्यसम्मर्दसद्यशाः । विप्रभोजनसंहृष्टो विप्रात्मा विप्रपूजितः ॥ ८०॥
    वेदैकवेद्यो दिव्याङ्गो मेघजिद्दर्पभञ्जनः । सर्वयोगकलोद्भासी स्वतन्त्रः सर्वविद्वशी ॥ ८१॥ कृष्णात्माऽऽकृष्टहृदयो
    देशिको दिव्यदर्शनः । गोलोकरमणो ब्रह्मक्रीडो वैकुण्ठनायकः ॥ ८२॥ अनेकमूर्तिरण्डस्थो बहिःस्थो योगशिक्षकः
    । पुरःसरो मनोवेगः स्वनेता दर्शितामरः ॥ ८३॥ विष्णुयागसमारम्भः षण्मासाशितवाडवः । नानदेशगतिर्नानायज्ञकृद्भूरिदक्षिणः
    ॥ ८४॥ सद्यःसमाधिः सर्वात्मा निरीशमतखण्डनः । मकारपञ्चकोच्छेता धर्मसर्गप्रपोषकः ॥ ८५॥ पापिकृतान्तः परमः
    पुण्यकीर्तिः पृथुश्रुवाः । कृशोध्धवाध्वसम्पोष्टा साध्वीधर्मप्रवर्तकः ॥ ८६॥ दैत्यांशगुरुखद्योतभास्करो
    धर्मधारकः । लोभादिदोषगदिता तामसव्रतवर्जनः ॥ ८७॥ सुव्रतः सिद्धिदः सिद्धः सिद्धेशः सिद्धिपोऽच्युतः ।
    कौलाध्वशापदः प्रोक्तासुरलक्ष्माऽसुरातिगः ॥ ८८॥ भुजङ्गनगरानन्दो निजभक्तस्तुतो महान् । अहिंसास्थापको
    भूरिनिजैश्वर्यप्रदर्शकः ॥ ८९॥ दूरदेशस्थात्मभक्त दत्त साक्षात्स्वदर्शनः । सच्छास्त्रोदितसत्कीर्तिरात्यन्तिकगतिप्रदः
    ॥ ९०॥ परापकारसाहस्रविस्मृतिः कोमलान्तरः । पाषण्डरक्षितात्मीयो दैत्यमोहनचेष्टितः ॥ ९१॥ अखण्डितार्षमर्यादः
    परगुह्याप्रकाशकः । पात्रार्पितबहुद्रव्यो यथायुक्तोपदेशकः ॥ ९२॥ अविग्रहप्रियो वाणीदण्डपारुष्यवर्जितः
    । ब्रह्मण्यदेवो देवेज्यो दशरूपप्रदर्शकः ॥ ९३॥ अकुण्ठितवचा देशाचारज्ञोऽनादृतोद्धतः । शिक्षार्थक्षणरुङ्
    नित्यमैत्रः सच्छास्त्रसङ्ग्रही ॥ ९४॥ धर्मिपक्षः साधुसेवी पुण्यश्रवणकीर्तनः । प्रणतार्तिहरः पूज्यो
    विषयासक्तनिन्दकः ॥ ९५॥ भक्तदेहान्तसमयदत्तदिव्यस्वदर्शनः । यमदूतावितस्वीयो नरकार्तिनिवारकः ॥ ९६॥ सन्मार्गवर्तिताशेषस्वाश्रितः
    शीघ्रसिद्धिदः । अनायरोगिवृद्धार्भभिक्षुपोषणकारकः ॥ ९७॥ गूढाशयो गूढमन्त्रः सर्वजीवप्रतारकः । भक्तासद्वासनोच्छेत्ताऽसदाग्रहविवर्जनः
    ॥ ९८॥ पोष्यवर्गानुविहिततत्समानमिताशनः । आपत्कालात्यक्तनिजः पञ्चकालर्चिताच्युतः ॥ ९९॥ योगेश्वरो मुनिपतिर्नित्यमुक्तो
    महामुनिः । बौद्धादिनास्तिकमतखण्डनः पण्डितार्चितः ॥ १००॥ अहिंसयज्ञप्रस्तोता वैष्णवक्रतुकारकः । मद्यमांससुरागन्धाघ्राणशुद्धिविधापकः
    ॥ १०१॥ मत्तोन्मत्तखलावादी पुरस्कृतगुणाधिकः । नानाभक्तजनानन्दः सदसद्व्यक्तिदर्शकः ॥ १०२॥ भृगुनान्दीशशापार्तजनरक्षक
    उत्तमः । वेदविच्छास्त्रविद्वादिदुर्जेयो हृतसंशयः ॥ १०३॥ खट्वाङ्गात्मा हृदम्भोजध्येयो ध्यातृमनोहरः
    । ज्योतिः संस्थोऽतिरम्याङ्गः सुरेखारुणपत्तलः ॥ १०४॥ चार्वाङ्गुलिर्नखेन्द्वालिर्प्रभापहृतहृत्तमाः ।
    पद्मकोशातिमृदुलचरणस्तुङ्गगुल्फकः ॥ १०५॥ ह्रस्वजङ्घो वृत्तजानुः समोरुः सत्सितांशुकः । गम्भीरनाभिराजानुभुजस्ततभुजान्तरः
    ॥ १०६॥ कण्ठलम्बितहारालिः कम्बुकण्ठोऽरुणाधरः । प्रफुल्लपद्मवदनः कुन्ददन्तो मितस्मितः ॥ १०७॥ तिलपुष्पाभनासान्तश्यामबिन्दुः
    समश्रवाः । वामश्रवोऽन्तरश्यामबिन्दुः पद्मदलेक्षणः ॥ १०८॥ विशालभालतिलकः सूक्ष्मवक्रशिरोरुहः । शिरः
    पटलसत्पुष्पापीडराजिः स्वभक्तदृक् ॥ १०९॥ अवतारी भयत्राताऽभयराजवरप्रदः । कृतदुर्गपुरावासः क्रोधयन्ताऽद्भुतक्रियः
    ॥ ११०॥ नानादेशप्रेषितस्वभक्तनाशितदुष्क्रियः । असुरक्लिष्टसत्सङ्घसान्त्वनः साधुवल्लभः ॥ १११॥ सद्रोहिगुरुभूपालशिक्षकक्ष्मेशराज्यदः
    । गवेन्द्रार्चितपादाब्जो गवेन्द्रवरदोऽनधः ॥ ११२॥ भक्तत्रातोद्धवस्वामिसम्प्रदायप्रकाशकः । विप्रप्रशंसनस्तीर्थविधिबोधक
    आर्तिहृत् ॥ ११३॥ विप्रसन्तर्पणो नानाप्रतवक्ता महायशा । कौलोच्छिद्विजयो वर्ण्यविष्णुयागमहोत्सवः ॥ ११४॥
    भक्तिगम्यो भक्तवशः कृतदिग्विजयोऽक्षयः । भक्तिधर्मकृतानन्दः सर्वमङ्गलदर्शनः ॥ ११५॥ उत्तमात्मा जयोप्रेष्ठो
    ललितेष्टवरप्रदः । मुकुन्दसेवासन्तुष्टो जयानीतपयःपिबः ॥ ११६॥ नारायणधृतामन्त्रो वासुदेवादत्तचन्दनः ।
    गोपलमञ्जितामन्त्रोऽखण्डाप्तार्चनसाधनः ॥ ११७॥ उमानाथाप्तपुष्पादिर्जयप्रक्षालिताम्बरः । ललितासंस्कृतान्नादिः
    पञ्चाल्यालिप्तपाकभूः ॥ ११८॥ अवरामार्जितवासः शिवोपानितपादुकः । दयगोविन्दाप्तवन्यो मयरामाविताम्बरः ॥
    ११९॥ प्रयागोक्तपुराणाधिर्निशानित्यकथादरः । मुक्तब्रह्मस्तुतयशाः प्रेमगीतगुणश्रुतिः ॥ १२०॥ महानुभावमुदितः
    शुकरक्षितपुस्तकः । आनन्दकल्पितावासः विजयोत्सवतोषितः ॥ १२१॥ यथार्हकारितात्मीयसेवनो भक्तकामधुक् । निबद्धोत्सवपर्यायो
    विजयोत्सवतोषितः ॥ १२२॥ अन्नकूटकृतानुज्ञो महासम्भारहारकः । पत्रदूताहूतभक्तः पाकशालावलोकनः ॥ १२३॥ प्रत्युद्गतमुनिव्रातो
    मानिताखिलवैष्णवः । सत्प्रीणनः क्षणस्वापो दीपालीमङ्गलाप्लवः ॥ १२४॥ ब्रह्मक्षणाशुविहितनैत्यकोऽखिलधर्मवित्
    । चारुचक्रकपीठस्थ उत्तमक्ष्मेशपूजितः ॥ १२५॥ भक्तस्वेक्षाप्रदानोत्को मयरामेक्षणस्मितः । भक्तसम्प्रीणनधृतनूतनांशुकभूषणः
    ॥ १२६॥ अनर्घ्यपीतकौशेयपरिधानविचक्षणः । मुकुटाकृतिसम्बद्धशोणशीर्षपटद्युतिः ॥ १२७॥ सस्वर्णबिन्दुकौसुम्भसत्कञ्चुकधृतिप्रभः
    । स्कन्धोल्लसद्धैमपटः कटिबद्धारुणांशुकः ॥ १२८॥ हैमाङ्गदलसद्बाहुः कर्णशोभितकुण्डलः । कण्ठलम्बितसस्वर्णमुक्ताहारालिशोभनः
    ॥ १२९॥ चञ्चत्सुवर्णकटकश
