    नव चरन देखि मुनि जाहीं। ब्रह्मलोक सब कथा कहाहीम् ॥ सुनि बिरञ्चि अतिसय सुख मानहिं। पुनि पुनि तात करहु
    गुन गानहिम् ॥ सनकादिक नारदहि सराहहिं। जद्यपि ब्रह्म निरत मुनि आहहिम् ॥ सुनि गुन गान समाधि बिसारी ॥
