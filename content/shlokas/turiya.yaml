id: turiya
category: upanishad
name:
  english: turiya
  devanagari: तुरिय
content:
  english: turiyatitopanishat om turiyatitopanishadvedyam yatparamaksharam | tatturyatitacinmatram svamatram
    cintaye'nvaham || turiyatitasamnyasaparivrajakshamalika | avyaktaikaksharam purna suryakshyadhyatmakundika
    || harih om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || atha turiyatitavadhutanam ko'yam margastesham ka sthitiriti pitamaho
    bhagavantam pitaramadinarayanam parisametyovaca | tamaha bhagavannarayano yo'yamavadhutamargastho
    loke durlabhataro natu bahulyo yadyeko bhavati sa eva nityaputah sa eva vairagyamurtih sa eva jnanakarah
    sa eva vedapurusha iti jnanino manyante | mahapurusho yastaccittam mayyevavatishthate | aham ca tasminnevavasthitah
    so'yamadau tavatkramena kuticako bahudakatvam prapya bahudako hamsatvamavalambya hamsah paramahamso
    bhutva svarupanusandhanena sarvaprapancam viditva dandakamandalukatisutra
  devanagari: तुरीयातीतोपनिषत् ॐ तुरीयातीतोपनिषद्वेद्यं यत्परमाक्षरम् । तत्तुर्यातीतचिन्मात्रं स्वमात्रं
    चिन्तयेऽन्वहम् ॥ तुरीयातीतसंन्यासपरिव्राजाक्षमालिका । अव्यक्तैकाक्षरं पूर्णा सूर्याक्ष्यध्यात्मकुण्डिका
    ॥ हरिः ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ अथ तुरीयातीतावधूतानां कोऽयं मार्गस्तेषां का स्थितिरिति पितामहो भगवन्तं पितरमादिनारायणं
    परिसमेत्योवाच । तमाह भगवन्नारायणो योऽयमवधूतमार्गस्थो लोके दुर्लभतरो नतु बाहुल्यो यद्येको भवति स एव
    नित्यपूतः स एव वैराग्यमूर्तिः स एव ज्ञानाकारः स एव वेदपुरुष इति ज्ञानिनो मन्यन्ते । महापुरुषो यस्तच्चित्तं
    मय्येवावतिष्ठते । अहं च तस्मिन्नेवावस्थितः सोऽयमादौ तावत्क्रमेण कुटीचको बहूदकत्वं प्राप्य बहूदको हंसत्वमवलम्ब्य
    हंसः परमहंसो भूत्वा स्वरूपानुसन्धानेन सर्वप्रपञ्चं विदित्वा दण्डकमण्डलुकटिसूत्र
