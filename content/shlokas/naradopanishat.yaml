id: naradopanishat
category: upanishad
name:
  english: naradopanishat
  devanagari: नारदोपनिषत्
content:
  english: ityetabhirabhimantrayet | devapitrikamanyarabhamanastrayi nityamurdhvapundram ca kuryanmantraih
    keshavadinam | tatkarma saphalam ca bhavati | na rakshamsi grihniyuh | tadevamabhyuktam bhavati |
    nasadikeshantamurdhvapundram vishnoh sthitasya caranadvayakriti | ayatamekangulam padatarorasya mulam
    | tadutpanne dve rekhe | tathaiva ca dhritam vishnuna va
  devanagari: इत्येताभिरभिमन्त्रयेत् । देवपितृकमाण्यारभमाणस्त्रयी नित्यमूर्ध्वपुण्ड्रं च कुर्यान्मन्त्रैः
    केशवादीनाम् । तत्कर्म सफलं च भवति । न रक्षांसि गृह्णीयुः । तदेवमभ्युक्तं भवति । नासादिकेशान्तमूर्ध्वपुण्ड्रं
    विष्णोः स्थितस्य चरणद्वयाकृति । आयतमेकाङ्गुलं पादतरोरस्य मूलम् । तदुत्पन्ने द्वे रेखे । तथैव च धृतं
    विष्णुना वा
meaning: {}
