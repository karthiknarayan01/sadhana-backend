id: sarasvatisahasranamastotram-2-2
category: sahasranama
name:
  english: sarasvatisahasranamastotram 2
  devanagari: सरस्वतीसहस्रनामस्तोत्रम् २
content:
  english: khecarishvari || 77|| bhadrakali citrarupa kaumari bhagamalini | kalyani kamadhuk jvalamukhi
    cotpalamalika || 78|| bandhuka dhanada suryahridaya nagahastika | ajita karshini ritirbhushundi garudasana
    || 79|| vaishvanari mahamari mahakalavibhushita | mahamayuri vibhava sarvananda ratiprada || 80||
    tadgatih padmamala ca vadhurvegavibhavini | bhavini satkriya devasena hiranyaranjini || 81|| sahasrada
    yajnamata hastinadaprabodhini | virupakshi vishalakshi bhaktanam jayarakshini || 82|| bahurupa surupa
    ca virupa rupavarjita | ghantaninadabahula jimitaghananihsvana || 83|| arya saurya sumadhya ca dharmakamarthamokshada
    | bhaktartishamani bhavya bhavabandhavimocini || 84|| diksha viksha paroksha ca samiksha viravatsala
    | atisiddha susiddha ca vedavidya dhanarcita || 85|| svadiptalilihana ca karali vishvapuraki | cidakasharuca
    rajni toshini vindumalini || 86|| kshiradhara sajalada svaprabha ca svararcita | havyagarbha cajyagarbha
    juhvati yajnasambhava || 87|| sarvakamaprabha bhadra subhadra sarvamangala | shveta sashuklavasana
    shuklamalyanulepana || 88|| hamsahitakari hamsi hrijja hritkamalalaya | sitatapatra sushronih padmapatrayatekshana
    || 89|| savitri satyasankalpa kamada kamadayini | darshaniya dasha daksha sprishya seva varangana
    || 90|| bhogapriya bhogavati bhogindrashayanasana | adripushkarini punya poshini papasudini || 91||
    shrimati ca shubhakara paramaishvaryabhutida | acintyanantavibhava bhavabhavavibhavini || 92|| sushronih
    sarvadehastha sarvabhujanasamskrita | vala valahaka devi gautami gokulalaya || 93|| toshani purnacandrabha
    ekanana shatanana | shatakratupriya sharmadayini sharmasundari || 94|| shivapriya shyenahasta sukeshi
    shukrasundari | shukrapriya shukraratih shukreshta shukrasundari || 95|| shukrananda shukrarasa shukrini
    shukrasudani | shokaha shokamaladhya shukla shokaikasundari || 96|| shuklavasa shuklamukhi shobhanashvashubha
    smrita | bhageshvari bhagavasa bhogini bhogavallabha || 97|| navapithanivasastha shivada shivasundari
    | navendriyaikanilaya gauri girvanasundari || 98|| navagatha ramakasha gatha guganasundari | navaratnavibhushadhya
    brahmi brahmandasundari || 99|| navadipaikavasana pita pavanasundari | navapannagaharadhyapranta pannagasundari
    || 100|| navamatrikramollasa navya nakshatrasundari | kalapini kalagamya bhayada bhayanashini || 101||
    saudamani megharava daityadanavamardini | jaganmata bhavakari bhutadhatri sudurlabha || 102|| dhanya
    dhanyeshvari bhavya ratnadhamashuvarddhini | gandharvi revati ganga shakuni vimalanana || 103|| durgashantikari
    caiva tapasi malayalaya | ajya ca vastrakaumari kheshaya kusumashraya || 104|| jagacchripa simharatha
    durjaya khagavahana | manobhava kamacari siddhida siddhasevita || 105|| vyomalakshmirmahalakshmistejolakshmih
    svatejasa | rasalakshmirjagadyonirgandhalakshmirvanashraya || 106|| shravane shrutida netra rasanaprantacarini
    | virincimata vibhava varada rijuvahana || 107|| vira vireshvari vandya vishoka vasuvardhini | anahata
    kundalini nalini vanavasini || 108|| rajagandharvavanita surendranamita sati | sinivali kuhu raka
    mahotpalanivasini || 109|| arundhati vasumati bhargavi vishnudevata | mayuri vajravetali vajrahasta
    varanana || 110|| anagha dharini dhira dhamani manibhushana | rajashrirupasahita brahmashrirbrahmavandita
    || 111|| jayatri jayada jeya svargashrih svargatih sada | valaka tvankarahita vishala dipani ratih
    || 112|| sambodhini harini ca prabhava bhavabhutida | amritasyandini jivajanani ghatikashrita || 113||
    dhumra kalavati prana bhasvaramshumati shubha | shundadhvanih sati srishtirvikrishtirevatiti ca ||
    114|| prayani prayada prakhya vishva pandavavasini | om aim hrim shrim sarasvati devi caikadashakshari
    || 115|| iti vanyah param namnam sahasram shivabhashitam | sarvamantraikanilayam sundarimanasapriyam
    || 116|| navatattvamayam divyam brahmandantasudhamayam | bhogapavargadam punyam sarvatirthaikasadhakam
    || 117|| varadam sarvada shantam grahanam shantikrit param | bhutapretapishacanam yaksharakshasabhitishu
    || 118|| pathedva pathayennamnam sahasram mantragarbhakam | duradeva palayante khageshadiva pannagah
    || 119|| kushthadayo maharogah shamameshyanti pathanat | sadhakasya sada punyavarddhanam dhanavarddhanam
    || 120|| sarvayajnaikaphaladam sarvamantraikasadhanam | bhurjatvaci likhenmantri ravivare ca sadhakah
    || 121|| marayedripusanghatan sadhayenmantrasancayam | akarshayedapsarasah uccatayati vairinah ||
    122|| pathanacchravanat satyam dharanatsadhakottamah | iha loke sukhi bhutva paratra tridivam vrajet
    || 123|| pathennamnam sahasram tu sadhako mucyate bhayat | kalpakotishatairamyaih kalpakotishatairapi
    || 124|| prabhavamesham namnam vai sahasrasya ca varnitum | na shakto'smi na shakto'smi pancasye na
    yutah shive || 125|| alam vistaramatrena yah pathet sadhakottamah | vicaredbhuvane'pyeko yathaham
    bhairavottamah || 126|| iti namnam sahasram tu sarvamantraikarupakam | vagishyah sarvasarvasve rahasyam
    svargavasinam || 127|| guhyam guptam sada gopyam goptavyam pashusankate | adikshite shathe krure nihsattve
    shucivarjite || 128|| dambhike ca khale murkhe pramatte vismrite'lase | gurushastrasadacaradushake
    kalahapriye || 129|| adikshitaya yo dadat kushilaya duratmane | nindakayanyashishyaya sa mantri nirayibhavet
    || 130|| deyam shishyaya shantaya kulinaya kritarthine | sadhakaya samarthaya gopaniyam mumukshubhih
    || 131|| iti shrirudrayamale tantre umaharasamvade dashavidyarahasye sarasvatisahasranamastotram samaptam
    |
  devanagari: खेचरीश्वरी ॥ ७७॥ भद्रकाली चित्ररूपा कौमारी भगमालिनी । कल्याणी कामधुक् ज्वालामुखी चोत्पलमालिका
    ॥ ७८॥ बन्धूका धनदा सूर्यहृदया नागहस्तिका । अजिता कर्षिणी रीतिर्भुशुण्डी गरुडासना ॥ ७९॥ वैश्वानरी महामारी
    महाकालविभूषिता । महामयूरी विभवा सर्वानन्दा रतिप्रदा ॥ ८०॥ तद्गतिः पद्ममाला च वधूर्वेगविभाविनी । भाविनी
    सत्क्रिया देवसेना हिरण्यरञ्जिनी ॥ ८१॥ सहस्रदा यज्ञमाता हस्तिनादप्रबोधिनी । विरूपाक्षी विशालाक्षी भक्तानां
    जयरक्षिणी ॥ ८२॥ बहुरूपा सुरूपा च विरूपा रूपवर्जिता । घण्टानिनादबहुला जीमीतघननिःस्वना ॥ ८३॥ आर्या सौर्या
    सुमध्या च धर्मकामार्थमोक्षदा । भक्तार्तिशमनी भव्या भवबन्धविमोचिनी ॥ ८४॥ दीक्षा वीक्षा परोक्षा च समीक्षा
    वीरवत्सला । अतिसिद्धा सुसिद्धा च वेदविद्या धनार्चिता ॥ ८५॥ स्वदीप्तलिलिहाना च कराली विश्वपूरकी । चिदाकाशरुचा
    राज्ञी तोषिनी विन्दुमालिनी ॥ ८६॥ क्षीरधारा सजलदा स्वप्रभा च स्वरार्चिता । हव्यगर्भा चाज्यगर्भा जुह्वती
    यज्ञसम्भवा ॥ ८७॥ सर्वकामप्रभा भद्रा सुभद्रा सर्वमङ्गला । श्वेता सशुक्लवसना शुक्लमाल्यानुलेपना ॥ ८८॥
    हंसाहितकरी हंसी हृज्जा हृत्कमलालया । सितातपत्रा सुश्रोणिः पद्मपत्रायतेक्षणा ॥ ८९॥ सावित्री सत्यसङ्कल्पा
    कामदा कामदायिनी । दर्शनीया दशा दक्षा स्पृश्या सेवा वराङ्गना ॥ ९०॥ भोगप्रिया भोगवती भोगीन्द्रशयनासना
    । अद्रिपुष्करिणी पुण्या पोषिणी पापसूदिनी ॥ ९१॥ श्रीमती च शुभाकारा परमैश्वर्यभूतिदा । अचिन्त्यानन्तविभवा
    भावाभावविभाविनी ॥ ९२॥ सुश्रोणिः सर्वदेहस्था सर्वभूजनसंस्कृता । वाला वलाहका देवी गौतमी गोकुलालया ॥
    ९३॥ तोषणी पूर्णचन्द्राभा एकानना शतानना । शतक्रतुप्रिया शर्मदायिनी शर्मसुन्दरी ॥ ९४॥ शिवप्रिया श्येनहस्ता
    सुकेशी शुक्रसुन्दरी । शुक्रप्रिया शुक्ररतिः शुक्रेष्टा शुक्रसुन्दरी ॥ ९५॥ शुक्रानन्दा शुक्ररसा शुक्रिणी
    शुक्रसूदनी । शोकहा शोकमालाढ्या शुक्ला शोकैकसुन्दरी ॥ ९६॥ शुक्लावासा शुक्लमुखी शोभनाश्वशुभा स्मृता
    । भगेश्वरी भगावासा भोगिनी भोगवल्लभा ॥ ९७॥ नवपीठनिवासस्था शिवदा शिवसुन्दरी । नवेन्द्रियैकनिलया गौरी
    गीर्वाणसुन्दरी ॥ ९८॥ नवगाथा रमाकाशा गाथा गुगणसुन्दरी । नवरत्नविभूषाढ्या ब्राह्मी ब्रह्माण्डसुन्दरी
    ॥ ९९॥ नवदीपैकवसना पीता पावनसुन्दरी । नवपन्नगहाराढ्यप्रान्ता पन्नगसुन्दरी ॥ १००॥ नवमातृक्रमोल्लासा
    नव्या नक्षत्रसुन्दरी । कलापिनी कालगम्या भयदा भयनाशिनी ॥ १०१॥ सौदामनी मेघरवा दैत्यदानवमर्दिनी । जगन्माता
    भवकरी भूतधात्री सुदुर्लभा ॥ १०२॥ धन्या धन्येश्वरी भव्या रत्नधामाशुवर्द्धिनी । गान्धर्वी रेवती गङ्गा
    शकुनी विमलानना ॥ १०३॥ दुर्गशान्तिकरी चैव तापसी मलयालया । आज्या च वस्त्रकौमारी खेशया कुसुमाश्रया ॥
    १०४॥ जगच्छ्रीपा सिंहरथा दुर्जया खगवाहना । मनोभवा कामचरी सिद्धिदा सिद्धसेविता ॥ १०५॥ व्योमलक्ष्मीर्महालक्ष्मीस्तेजोलक्ष्मीः
    स्वतेजसा । रसलक्ष्मीर्जगद्योनिर्गन्धलक्ष्मीर्वनाश्रया ॥ १०६॥ श्रावणे श्रुतिदा नेत्रा रसनाप्रान्तचारिणी
    । विरिञ्चिमाता विभवा वरदा ऋजुवाहना ॥ १०७॥ वीरा वीरेश्वरी वन्द्या विशोका वसुवर्धिनी । अनाहता कुण्डलिनी
    नलिनी वनवासिनी ॥ १०८॥ राजगन्धर्ववनिता सुरेन्द्रनमिता सती । सिनीवाली कुहू राका महोत्पलनिवासिनी ॥ १०९॥
    अरुन्धती वसुमती भार्गवी विष्णुदेवता । मायूरी वज्रवेताली वज्रहस्ता वरानना ॥ ११०॥ अनघा धारिणी धीरा धमनी
    मणिभूषणा । राजश्रीरूपसहिता ब्रह्मश्रीर्ब्रह्मवन्दिता ॥ १११॥ जयत्री जयदा जेया स्वर्गश्रीः स्वर्गतिः
    सदा । वलाका त्वङ्करहिता विशाला दीपनी रतिः ॥ ११२॥ सम्बोधिनी हारिणी च प्रभावा भवभूतिदा । अमृतस्यन्दिनी
    जीवजननी घटिकाश्रिता ॥ ११३॥ धूम्रा कलावती प्राणा भास्वरांशुमती शुभा । शुण्डाध्वनिः सती सृष्टिर्विकृष्टीरेवतीति
    च ॥ ११४॥ प्रायणी प्रायदा प्रख्या विश्वा पाण्डववासिनी । ओं ऐं ह्रीं श्रीं सरस्वती देवी चैकादशाक्षरी
    ॥ ११५॥ इति वाण्याः परं नाम्नां सहस्रं शिवभाषितम् । सर्वमन्त्रैकनिलयं सुन्दरीमानसप्रियम् ॥ ११६॥ नवतत्त्वमयं
    दिव्यं ब्रह्माण्डान्तसुधामयम् । भोगापवर्गदं पुण्यं सर्वतीर्थैकसाधकम् ॥ ११७॥ वरदं सर्वदा शान्तं ग्रहाणां
    शान्तिकृत् परम् । भूतप्रेतपिशाचानां यक्षराक्षसभीतिषु ॥ ११८॥ पठेद्वा पाठयेन्नाम्नां सहस्रं मन्त्रगर्भकम्
    । दूरादेव पलायन्ते खगेशादिव पन्नगाः ॥ ११९॥ कुष्ठादयो महारोगाः शममेष्यन्ति पाठनात् । साधकस्य सदा पुण्यवर्द्धनं
    धनवर्द्धनम् ॥ १२०॥ सर्वयज्ञैकफलदं सर्वमन्त्रैकसाधनम् । भूर्जत्वचि लिखेन्मन्त्री रविवारे च साधकः ॥
    १२१॥ मारयेद्रिपुसङ्घातान् साधयेन्मन्त्रसञ्चयम् । आकर्षयेदप्सरसः उच्चाटयति वैरिणः ॥ १२२॥ पठनाच्छ्रवणात्
    सत्यं धारणात्साधकोत्तमः । इह लोके सुखी भूत्वा परत्र त्रिदिवं व्रजेत् ॥ १२३॥ पठेन्नाम्नां सहस्रं तु
    साधको मुच्यते भयात् । कल्पकोटिशतैरम्यैः कल्पकोटिशतैरपि ॥ १२४॥ प्रभावमेषां नाम्नां वै सहस्रस्य च वर्णितुम्
    । न शक्तोऽस्मि न शक्तोऽस्मि पञ्चास्ये न युतः शिवे ॥ १२५॥ अलं विस्तारमात्रेण यः पठेत् साधकोत्तमः ।
    विचरेद्भुवनेऽप्येको यथाहं भैरवोत्तमः ॥ १२६॥ इति नाम्नां सहस्रं तु सर्वमन्त्रैकरूपकम् । वागीश्याः सर्वसर्वस्वे
    रहस्यं स्वर्गवासिनाम् ॥ १२७॥ गुह्यं गुप्तं सदा गोप्यं गोप्तव्यं पशुसङ्कटे । अदीक्षिते शठे क्रूरे निःसत्त्वे
    शुचिवर्जिते ॥ १२८॥ दाम्भिके च खले मूर्खे प्रमत्ते विस्मृतेऽलसे । गुरुशास्त्रसदाचारदूषके कलहप्रिये
    ॥ १२९॥ अदीक्षिताय यो ददात् कुशीलाय दुरात्मने । निन्दकायान्यशिष्याय स मन्त्री निरयीभवेत् ॥ १३०॥ देयं
    शिष्याय शान्ताय कुलीनाय कृतार्थिने । साधकाय समर्थाय गोपनीयं मुमुक्षुभिः ॥ १३१॥ इति श्रीरुद्रयामले
    तन्त्रे उमाहरसंवादे दशविद्यारहस्ये सरस्वतीसहस्रनामस्तोत्रं समाप्तम् ।
