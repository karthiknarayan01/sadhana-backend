id: suryakavacambrahmayamale
category: kavacha
name:
  english: suryakavacambrahmayamale
  devanagari: सूर्यकवचम्ब्रह्मयामले
content:
  english: rinu me kavacam shubham | trailokyamangalam nama kavacam paramadbhutam || 1|| yajjnatva mantravitsamyak
    phalam prapnoti nishcitam | yaddhritva ca mahadevo gananamadhipobhavat || 2|| pathanaddharanadvishnuh
    sarvesham palakah sada | evamindradayah sarve sarvaishcaryamavapmuyuh || 3|| kavacasya rishirbrahma
    chandonushtubudahritah | shrisuryo devata catra sarvadevanamaskritah || 4|| yasha arogyamoksheshu
    viniyogah prakirtitah | pranavo me shirah patu ghrinirme patu bhalakam || 5|| suryo'vyannayanadvandvamadityah
    karnayugmakam | ashtaksharo mahamantrah sarvabhishtaphalapradah || 6|| hrim bijam me mukham patu hridayam
    bhuvaneshvari | candrabimbam vimshadadyam patu me guhyadeshakam || 7|| aksharo'sau mahamantrah sarvatantreshu
    gopitah | shivo vahnisamayukto vamakshibindubhushitah || 8|| ekaksharo mahamantrah shrisuryasya prakirtitah
    | guhyadguhyataro mantro vanchacintamanih smritah || 9|| shirshadipadaparyantam sada patu manuttamah
    | iti te kathitam divyam trishu lokeshu durlabham || 10|| shripradam kantidam nityam dhanarogyavivardhanam
    | kushthadirogashamana mahavyadhivinashanam || 11|| trisandhyam yah pathennityamarogi balavanbhavet
    | bahuna kimihoktena yadyanmanasi vartate || 12|| tatatsarvam bhavettasya kavacasya ca dharanat |
    bhutapretapishacashrca yakshagandharvarakshasah || 13|| brahmarakshasavetala n drashtumapi tam kshamah
    | duradeva palayante tasya sankirtanadapi || 14|| bhurjapatre samalikhya rocanagurukunkumaih | ravivare
    ca sankrantyam saptamyam ca visheshatah | dharayetsadhakashreshthah shrisuryasya priyobhavet || 15||
    trilohamadhyagam kritva dharayeddakshine kare | shikhayamathava kanthe so'pi suryo na samshayah ||
    16|| iti te kathitam samba trailokyamangalabhidham | kavacam durlabham loke tava snehatprakashitam
    || 17|| ajnatva kavacam divyam yo japetsuryamuttamam | siddhirna jayate tasya kalpakotishatairapi
    || 18|| iti shribrahmayamale trailokyamangalam nama suryakavacam sampurnam ||
  devanagari: ृणु मे कवचं शुभम् । त्रैलोक्यमङ्गलं नाम कवचं परमाद्भुतम् ॥ १॥ यज्ज्ञात्वा मन्त्रवित्सम्यक्
    फलं प्राप्नोति निश्चितम् । यद्धृत्वा च महादेवो गणानामधिपोभवत् ॥ २॥ पठनाद्धारणाद्विष्णुः सर्वेषां पालकः
    सदा । एवमिन्द्रादयः सर्वे सर्वैश्चर्यमवाप्मुयुः ॥ ३॥ कवचस्य ऋषिर्ब्रह्मा छन्दोनुष्टुबुदाहृतः । श्रीसूर्यो
    देवता चात्र सर्वदेवनमस्कृतः ॥ ४॥ यश आरोग्यमोक्षेषु विनियोगः प्रकीर्तितः । प्रणवो मे शिरः पातु घृणिर्मे
    पातु भालकम् ॥ ५॥ सूर्योऽव्यान्नयनद्वन्द्वमादित्यः कर्णयुग्मकम् । अष्टाक्षरो महामन्त्रः सर्वाभीष्टफलप्रदः
    ॥ ६॥ ह्रीं बीजं मे मुखं पातु हृदयं भुवनेश्वरी । चन्द्रबिम्बं विंशदाद्यं पातु मे गुह्यदेशकम् ॥ ७॥ अक्षरोऽसौ
    महामन्त्रः सर्वतन्त्रेषु गोपितः । शिवो वह्निसमायुक्तो वामाक्षीबिन्दुभूषीतः ॥ ८॥ एकाक्षरो महामन्त्रः
    श्रीसूर्यस्य प्रकीर्तितः । गुह्याद्गुह्यतरो मन्त्रो वाञ्छाचिन्तामणिः स्मृतः ॥ ९॥ शीर्षादिपादपर्यन्तं
    सदा पातु मनूत्तमः । इति ते कथितं दिव्यं त्रिषु लोकेषु दुर्लभम् ॥ १०॥ श्रीप्रदं कान्तिदं नित्यं धनारोग्यविवर्धनम्
    । कुष्ठादिरोगशमन महाव्याधिविनाशनम् ॥ ११॥ त्रिसन्ध्यं यः पठेन्नित्यमरोगी बलवान्भवेत् । बहुना किमिहोक्तेन
    यद्यन्मनसि वर्तते ॥ १२॥ ततत्सर्वं भवेत्तस्य कवचस्य च धारणात् । भूतप्रेतपिशाचाश्र्च यक्षगन्धर्वराक्षसाः
    ॥ १३॥ ब्रह्मराक्षसवेताला न् द्रष्टुमपि तं क्षमाः । दूरादेव पलायन्ते तस्य सङ्कीर्तणादपि ॥ १४॥ भूर्जपत्रे
    समालिख्य रोचनागुरुकुङ्कुमैः । रविवारे च सङ्क्रान्त्यां सप्तम्यां च विशेषतः । धारयेत्साधकश्रेष्ठः श्रीसूर्यस्य
    प्रियोभवेत् ॥ १५॥ त्रिलोहमध्यगं कृत्वा धारयेद्दक्षिणे करे । शिखायामथवा कण्ठे सोऽपि सूर्यो न संशयः
    ॥ १६॥ इति ते कथितं साम्ब त्रैलोक्यमङ्गलाभिधम् । कवचं दुर्लभं लोके तव स्नेहात्प्रकाशितम् ॥ १७॥ अज्ञात्वा
    कवचं दिव्यं यो जपेत्सूर्यमुत्तमम् । सिद्धिर्न जायते तस्य कल्पकोटिशतैरपि ॥ १८॥ इति श्रीब्रह्मयामले
    त्रैलोक्यमङ्गलं नाम सूर्यकवचं सम्पूर्णम् ॥
