id: amba-pancharatnam
category: stotram
name:
  english: Amba Pancharatnam
content:
  english: ambashambaravairitatabhagini shricandrabimbanana bimboshthi smitabhashini shubhakari kadambavatyashrita
    | hrinkaraksharamantramadhyasubhaga shroninitambankita mamambapuravasini bhagavati herambamatavatu
    || || kalyani kamaniyasundaravapuh katyayani kalika kala shyamalamecakadyutimati kaditripancakshari
    | kamakshi karunanidhih kalimalaranyatidavanala mamambapuravasini bhagavati herambamatavatu || ||
    kancikankanaharakundalavati kotikiritanvita kandarpadyutikotikotisadana piyushakumbhastana | kausumbharunakancanambaravrita
    kailasavasapriya mamambapuravasini bhagavati herambamatavatu || || ya sa shumbhanishumbhadaityashamani
    ya raktabijashani ya shri vishnusarojanetrabhavana ya brahmavidya''sani | ya devi madhukaitabhasuraripurya
    mahishadhvamsini mamambapuravasini bhagavati herambamatavatu || || shrividya paradevata''dijanani
    durga jaya candika bala shritripureshvari shivasati shrirajarajeshvari | shrirajni shivadutika shrutinuta
    shringaracudamanih mamambapuravasini bhagavati herambamatavatu || || ambapancakamadbhutam pathati
    cedyo va prabhate'nisham divyaishvaryashatayuruttamamatim vidyam shriyam shashvatam | labdhva bhumitale
    svadharmaniratam shrisundarim bhaminim ante svargaphalam labhetsa vibudhaih samstuyamano narah ||
    || iti shri amba pancaratna stotram |
  devanagari: अम्बाशम्बरवैरितातभगिनी श्रीचन्द्रबिम्बानना बिम्बोष्ठी स्मितभाषिणी शुभकरी कादम्बवाट्याश्रिता
    । ह्रीङ्काराक्षरमन्त्रमध्यसुभगा श्रोणीनितम्बाङ्किता मामम्बापुरवासिनी भगवती हेरम्बमातावतु ॥ ॥ कल्याणी
    कमनीयसुन्दरवपुः कात्यायनी कालिका काला श्यामलमेचकद्युतिमती कादित्रिपञ्चाक्षरी । कामाक्षी करुणानिधिः
    कलिमलारण्यातिदावानला मामम्बापुरवासिनी भगवती हेरम्बमातावतु ॥ ॥ काञ्चीकङ्कणहारकुण्डलवती कोटीकिरीटान्विता
    कन्दर्पद्युतिकोटिकोटिसदना पीयूषकुम्भस्तना । कौसुम्भारुणकाञ्चनाम्बरवृता कैलासवासप्रिया मामम्बापुरवासिनी
    भगवती हेरम्बमातावतु ॥ ॥ या सा शुम्भनिशुम्भदैत्यशमनी या रक्तबीजाशनी या श्री विष्णुसरोजनेत्रभवना या
    ब्रह्मविद्याऽऽसनी । या देवी मधुकैटभासुररिपुर्या माहिषध्वंसिनी मामम्बापुरवासिनी भगवती हेरम्बमातावतु
    ॥ ॥ श्रीविद्या परदेवताऽऽदिजननी दुर्गा जया चण्डिका बाला श्रीत्रिपुरेश्वरी शिवसती श्रीराजराजेश्वरी ।
    श्रीराज्ञी शिवदूतिका श्रुतिनुता शृङ्गारचूडामणिः मामम्बापुरवासिनी भगवती हेरम्बमातावतु ॥ ॥ अम्बापञ्चकमद्भुतं
    पठति चेद्यो वा प्रभातेऽनिशं दिव्यैश्वर्यशतायुरुत्तममतिं विद्यां श्रियं शाश्वतम् । लब्ध्वा भूमितले
    स्वधर्मनिरतां श्रीसुन्दरीं भामिनीं अन्ते स्वर्गफलं लभेत्स विबुधैः संस्तूयमानो नरः ॥ ॥ इति श्री अम्बा
    पञ्चरत्न स्तोत्रम् ।
