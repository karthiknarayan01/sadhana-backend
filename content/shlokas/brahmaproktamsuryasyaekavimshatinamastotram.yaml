id: brahmaproktamsuryasyaekavimshatinamastotram
category: stotram
name:
  english: brahmaproktamsuryasyaekavimshatinamastotram
  devanagari: ब्रह्मप्रोक्तंसूर्यस्यएकविंशतिनामस्तोत्रम्
content:
  english: rinudhvam bharaskasya vai || 30|| vikarttano vivasvamshca marttando bhaskaro ravih | lokaprakashakah
    shrima~llokacakshurmaheshvarah || 31|| lokasakshi trilokeshah kartta hartta tamisraha | tapanastapanashcaiva
    shucih saptashvavahanah || 32|| gabhastihasto brahma ca sarvadevanamaskritah | ekavimshatirityesha
    stava ishtah sada raveh || 33|| sharirarogyadashcaiva dhanavriddhiyashaskarah | stavaraja iti khyatistrishu
    lokeshu vishrutah || 34|| ya etena dvijashreshtha dvisandhye'stamanodaye | stauti suryam shucirbhutva
    sarvapapaih pramucyate || 35|| manasam vacikam vapi dehajam karmajam tatha | ekajapyena tatsarvam
    nashyatyarkasya sannidhau || 36|| ekajapyashca homashca sandhyopasanameva ca | dhupamantrarghyamantrashca
    balimantrastathaiva ca || 37|| annapradane dane ca pranipate pradakshine | pujito'yam mahamantrah
    sarvapapaharah shubhah || 38|| tasmadyuyam prayatnena stavenanena vai dvijah | stuvidhvam varadam
    devam sarvakamaphalapradam || 39|| iti brahmapurane ekatrimshadhyayantargatam brahmaproktam ekavimshatinamasuryastotram
    samaptam | brahmapurana | adhyaya 31
  devanagari: ृणुध्वं भारस्कस्य वै ॥ ३०॥ विकर्त्तनो विवस्वांश्च मार्त्तण्डो भास्करो रविः । लोकप्रकाशकः
    श्रीमाँल्लोकचक्षुर्महेश्वरः ॥ ३१॥ लोकसाक्षी त्रिलोकेशः कर्त्ता हर्त्ता तमिस्रहा । तपनस्तापनश्चैव शुचिः
    सप्ताश्ववाहनः ॥ ३२॥ गभस्तिहस्तो ब्रह्मा च सर्वदेवनमस्कृतः । एकविंशतिरित्येष स्तव इष्टः सदा रवेः ॥
    ३३॥ शरीरारोग्यदश्चैव धनवृद्धियशस्करः । स्तवराज इति ख्यातिस्त्रिषु लोकेषु विश्रुतः ॥ ३४॥ य एतेन द्विजश्रेष्ठा
    द्विसन्ध्येऽस्तमनोदये । स्तौति सूर्यं शुचिर्भूत्वा सर्वपापैः प्रमुच्यते ॥ ३५॥ मानसं वाचिकं वापि देहजं
    कर्मजं तथा । एकजप्येन तत्सर्वं नश्यत्यर्कस्य सन्निधौ ॥ ३६॥ एकजप्यश्च होमश्च सन्ध्योपासनमेव च । धूपमन्त्रार्घ्यमन्त्रश्च
    बलिमन्त्रस्तथैव च ॥ ३७॥ अन्नप्रदाने दाने च प्रणिपाते प्रदक्षिणे । पूजितोऽयं महामन्त्रः सर्वपापहरः
    शुभः ॥ ३८॥ तस्माद्यूयं प्रयत्नेन स्तवेनानेन वै द्विजाः । स्तुवीध्वं वरदं देवं सर्वकामफलप्रदम् ॥ ३९॥
    इति ब्रह्मपुराणे एकत्रिंशाध्यायान्तर्गतं ब्रह्मप्रोक्तं एकविंशतिनामसूर्यस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ३१
