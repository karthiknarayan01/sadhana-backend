id: pindopanishat-3
category: upanishad
name:
  english: pindopanishat
  devanagari: पिण्डोपनिषत्
content:
  english: pindopanishat pitrinam hamsarupanam yanta shrimajjanardana | bhavatapapranutyartham satatam
    tamaham shraye || 1|| om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevashishyate
    || om shantih shantih shantih || om || devata rishayah sarve brahmanamidamabruvan | mritasya diyate
    pindah katham grihnantycetasah || 1|| bhinne pancatmake dehe gate pancasu pancadha | hamsastyaktva
    gato deham kasmi~sthane vyavasthitah || 2|| tryaham vasati toyeshu tryaham vasati cagnishu | tryahamakashago
    bhutva dinamekam tu vayugah || 3|| prathamena tu pindena kalanam tasya sambhavah | dvitiyena tu pindena
    mamsatvakshonitodbhavah || 4|| tritiyena tu pindena matistasyabhijayate | caturthena tu pindena asthi
    majja prajayate || 5|| pancamena tu pindena hastangulyah shiro mukham | shashthena kritapindena hritkantham
    talu jayate || 6|| saptamena tu pindena dirghamayuh prajayate | ashtamena tu pindena vacam pushyati
    viryavan || 7|| navamena tu pindena sarvendriyasamahritih | dashamena tu pindena bhavanam plavanam
    tatha | pinde pindasharirasya pindadanena sambhavah || 8|| harih om tatsadityupanishat || om purnamadah
    purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevashishyate || om shantih shantih shantih
    || ityatharvaniya pindopanishatsamapta ||
  devanagari: पिण्डोपनिषत् पितॄणां हंसरूपाणां यन्ता श्रीमज्जनार्दन । भवतापप्रणुत्यर्थं सततं तमहं श्रये
    ॥ १॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णामेवाशिष्यते ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ ॐ ॥ देवता ऋषयः सर्वे ब्रह्माणमिदमब्रुवन् । मृतस्य दीयते पिण्डः कथं गृह्णन्त्य्चेतसः
    ॥ १॥ भिन्ने पञ्चात्मके देहे गते पञ्चसु पञ्चधा । हंसस्त्यक्त्वा गतो देहं कस्मिँस्थाने व्यवस्थितः ॥
    २॥ त्र्यहं वसति तोयेषु त्र्यहं वसति चाग्निषु । त्र्यहमाकाशगो भूत्वा दिनमेकं तु वायुगः ॥ ३॥ प्रथमेन
    तु पिण्डेन कलनं तस्य सम्भवः । द्वितीयेन तु पिण्डेन मांसत्वक्षोणितोद्भवः ॥ ४॥ तृतीयेन तु पिण्डेन मतिस्तस्याभिजायते
    । चतुर्थेन तु पिण्डेन अस्थि मज्जा प्रजायते ॥ ५॥ पञ्चमेन तु पिण्डेन हस्ताङ्गुल्यः शिरो मुखम् । षष्ठेन
    कृतपिण्डेन हृत्कण्ठं तालु जायते ॥ ६॥ सप्तमेन तु पिण्डेन दीर्घमायुः प्रजायते । अष्टमेन तु पिण्डेन वाचं
    पुष्यति वीर्यवान् ॥ ७॥ नवमेन तु पिण्डेन सर्वेन्द्रियसमाहृतिः । दशमेन तु पिण्डेन भावानां प्लवनं तथा
    । पिण्डे पिण्डशरीरस्य पिण्डदानेन सम्भवः ॥ ८॥ हरिः ॐ तत्सदित्युपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते
    । पूर्णस्य पूर्णमादाय पूर्णामेवाशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इत्याथर्वणीया पिण्डोपनिषत्समाप्ता
    ॥
