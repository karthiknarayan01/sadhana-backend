    चर अरु अचर हर्षजुत राम जनम सुखमूल ॥ ॥ नौमी तिथि मधु मास पुनीता। सुकल पच्छ अभिजित हरिप्रीता ॥ मध्यदिवस
    अति सीत न घामा। पावन काल लोक बिश्रामा ॥ सीतल मन्द सुरभि बह ब् । हरषित सुर सन्तन मन च् ॥ बन कुसुमित
    गिरिगन मनिआरा। स्त्रवहिं सकल सरिताऽमृतधारा ॥ सो अवसर बिरञ्चि जब जाना। चले सकल सुर साजि बिमाना ॥ गगन
    बिमल सकुल सुर जूथा। गावहिं गुन गन्धर्ब बरूथा ॥ बरषहिं सुमन सुअञ्जलि साजी। गहगहि गगन दुन्दुभी बाजी
    ॥ अस्तुति करहिं नाग मुनि देवा। बहुबिधि लावहिं निज निज सेवा ॥ दो सुर समूह बिनती करि पहुँचे निज निज
    धाम। जगनिवास प्रभु प्रगटे अखिल लोक बिश्राम ॥ भे प्रगट कृपाला दीनदयाला कौसल्या हितकारी। हरषित महतारी
    मुनि मन हारी अद्भुत रूप बिचारी ॥ लोचन अभिरामा तनु घनस्यामा निज आयुध भुज चारी। भूषन बनमाला नयन बिसाला
