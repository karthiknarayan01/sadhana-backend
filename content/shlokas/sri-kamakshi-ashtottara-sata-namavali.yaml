id: sri-kamakshi-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Kamakshi Ashtottara Sata Namavali
content:
  english: om kalakanthyai namah | om tripurayai namah | om balayai namah | om mayayai namah | om tripurasundaryai
    namah | om sundaryai namah | om saubhagyavatyai namah | om klinkaryai namah | om sarvamangalayai namah
    | om ainkaryai namah | om skandajananyai namah | om parayai namah | om pancadashaksharyai namah |
    om trailokyamohanadhishayai namah | om sarvashapuravallabhayai namah | om sarvasankshobhanadhishayai
    namah | om sarvasaubhagyavallabhayai namah | om sarvarthasadhakadhishayai namah | om sarvarakshakaradhipayai
    namah | om sarvarogaharadhishayai namah | om sarvasiddhipradadhipayai namah | om sarvanandamayadhishayai
    namah | om yoginicakranayikayai namah | om bhaktanuraktayai namah | om raktangyai namah | om shankarardhasharirinyai
    namah | om pushpabanekshukodandapashankushakarayai namah | om ujjvalayai namah | om saccidanandalaharyai
    namah | om shrividyayai namah | om parameshvaryai namah | om anangakusumodyanayai namah | om cakreshvaryai
    namah | om bhuvaneshvaryai namah | om guptayai namah | om guptatarayai namah | om nityayai namah |
    om nityaklinnayai namah | om madadravayai namah | om mohinyai namah | om paramanandayai namah | om
    kameshyai namah | om tarunikalayai namah | om kalavatyai namah | om bhagavatyai namah | om padmaragakiritayai
    namah | om raktavastrayai namah | om raktabhushayai namah | om raktagandhanulepanayai namah | om saugandhikalasadvenyai
    namah | om mantrinyai namah | om tantrarupinyai namah | om tattvamayyai namah | om siddhantapuravasinyai
    namah | om shrimatyai namah | om cinmayyai namah | om devyai namah | om kaulinyai namah | om paradevatayai
    namah | om kaivalyarekhayai namah | om vashinyai namah | om sarveshvaryai namah | om sarvamatrikayai
    namah | om vishnusvasre namah | om vedamayyai namah | om sarvasampatpradayinyai namah | om kinkaribhutagirvanyai
    namah | om sutavapivinodinyai namah | om manipurasamasinayai namah | om anahatabjavasinyai namah |
    om vishuddhicakranilayayai namah | om ajnapadmanivasinyai namah | om ashtatrimshatkalamurtyai namah
    | om sushumnadvaramadhyagayai namah | om yogishvaramanodhyeyayai namah | om parabrahmasvarupinyai
    namah | om caturbhujayai namah | om candracudayai namah | om puranagamarupinyai namah | om onkaryai
    namah | om vimalayai namah | om vidyayai namah | om pancapranavarupinyai namah | om bhuteshvaryai
    namah | om bhutamayyai namah | om pancashatpitharupinyai namah | om shodanyasamaharupinyai namah |
    om kamakshyai namah | om dashamatrikayai namah | om adharashaktyai namah | om arunayai namah | om
    lakshmyai namah | om tripurabhairavyai namah | om rahahpujasamalolayai namah | om rahoyantrasvarupinyai
    namah | om trikonamadhyanilayayai namah | om bindumandalavasinyai namah | om vasukonapuravasayai namah
    | om dasharadvayavasinyai namah | om caturdasharacakrasthayai namah | om vasupadmanivasinyai namah
    | om svarabjapatranilayayai namah | om vrittatrayavasinyai namah | om caturasrasvarupasyayai namah
    | om navacakrasvarupinyai namah | om mahanityayai namah | om vijayayai namah | om shrirajarajeshvaryai
    namah || iti shri kamakshyashtottarashatanamavalih |
  devanagari: ॐ कालकण्ठ्यै नमः । ॐ त्रिपुरायै नमः । ॐ बालायै नमः । ॐ मायायै नमः । ॐ त्रिपुरसुन्दर्यै नमः
    । ॐ सुन्दर्यै नमः । ॐ सौभाग्यवत्यै नमः । ॐ क्लीङ्कार्यै नमः । ॐ सर्वमङ्गलायै नमः । ॐ ऐङ्कार्यै नमः
    । ॐ स्कन्दजनन्यै नमः । ॐ परायै नमः । ॐ पञ्चदशाक्षर्यै नमः । ॐ त्रैलोक्यमोहनाधीशायै नमः । ॐ सर्वाशापूरवल्लभायै
    नमः । ॐ सर्वसङ्क्षोभणाधीशायै नमः । ॐ सर्वसौभाग्यवल्लभायै नमः । ॐ सर्वार्थसाधकाधीशायै नमः । ॐ सर्वरक्षाकराधिपायै
    नमः । ॐ सर्वरोगहराधीशायै नमः । ॐ सर्वसिद्धिप्रदाधिपायै नमः । ॐ सर्वानन्दमयाधीशायै नमः । ॐ योगिनीचक्रनायिकायै
    नमः । ॐ भक्तानुरक्तायै नमः । ॐ रक्ताङ्ग्यै नमः । ॐ शङ्करार्धशरीरिण्यै नमः । ॐ पुष्पबाणेक्षुकोदण्डपाशाङ्कुशकरायै
    नमः । ॐ उज्ज्वलायै नमः । ॐ सच्चिदानन्दलहर्यै नमः । ॐ श्रीविद्यायै नमः । ॐ परमेश्वर्यै नमः । ॐ अनङ्गकुसुमोद्यानायै
    नमः । ॐ चक्रेश्वर्यै नमः । ॐ भुवनेश्वर्यै नमः । ॐ गुप्तायै नमः । ॐ गुप्ततरायै नमः । ॐ नित्यायै नमः
    । ॐ नित्यक्लिन्नायै नमः । ॐ मदद्रवायै नमः । ॐ मोहिन्यै नमः । ॐ परमानन्दायै नमः । ॐ कामेश्यै नमः ।
    ॐ तरुणीकलायै नमः । ॐ कलावत्यै नमः । ॐ भगवत्यै नमः । ॐ पद्मरागकिरीटायै नमः । ॐ रक्तवस्त्रायै नमः ।
    ॐ रक्तभूषायै नमः । ॐ रक्तगन्धानुलेपनायै नमः । ॐ सौगन्धिकलसद्वेण्यै नमः । ॐ मन्त्रिण्यै नमः । ॐ तन्त्ररूपिण्यै
    नमः । ॐ तत्त्वमय्यै नमः । ॐ सिद्धान्तपुरवासिन्यै नमः । ॐ श्रीमत्यै नमः । ॐ चिन्मय्यै नमः । ॐ देव्यै
    नमः । ॐ कौलिन्यै नमः । ॐ परदेवतायै नमः । ॐ कैवल्यरेखायै नमः । ॐ वशिन्यै नमः । ॐ सर्वेश्वर्यै नमः ।
    ॐ सर्वमातृकायै नमः । ॐ विष्णुस्वस्रे नमः । ॐ वेदमय्यै नमः । ॐ सर्वसम्पत्प्रदायिन्यै नमः । ॐ किङ्करीभूतगीर्वाण्यै
    नमः । ॐ सुतवापिविनोदिन्यै नमः । ॐ मणिपूरसमासीनायै नमः । ॐ अनाहताब्जवासिन्यै नमः । ॐ विशुद्धिचक्रनिलयायै
    नमः । ॐ आज्ञापद्मनिवासिन्यै नमः । ॐ अष्टत्रिंशत्कलामूर्त्यै नमः । ॐ सुषुम्नाद्वारमध्यगायै नमः । ॐ
    योगीश्वरमनोध्येयायै नमः । ॐ परब्रह्मस्वरूपिण्यै नमः । ॐ चतुर्भुजायै नमः । ॐ चन्द्रचूडायै नमः । ॐ पुराणागमरूपिण्यै
    नमः । ॐ ओङ्कार्यै नमः । ॐ विमलायै नमः । ॐ विद्यायै नमः । ॐ पञ्चप्रणवरूपिण्यै नमः । ॐ भूतेश्वर्यै नमः
    । ॐ भूतमय्यै नमः । ॐ पञ्चाशत्पीठरूपिण्यै नमः । ॐ षोडान्यासमहारूपिण्यै नमः । ॐ कामाक्ष्यै नमः । ॐ दशमातृकायै
    नमः । ॐ आधारशक्त्यै नमः । ॐ अरुणायै नमः । ॐ लक्ष्म्यै नमः । ॐ त्रिपुरभैरव्यै नमः । ॐ रहःपूजासमालोलायै
    नमः । ॐ रहोयन्त्रस्वरूपिण्यै नमः । ॐ त्रिकोणमध्यनिलयायै नमः । ॐ बिन्दुमण्डलवासिन्यै नमः । ॐ वसुकोणपुरावासायै
    नमः । ॐ दशारद्वयवासिन्यै नमः । ॐ चतुर्दशारचक्रस्थायै नमः । ॐ वसुपद्मनिवासिन्यै नमः । ॐ स्वराब्जपत्रनिलयायै
    नमः । ॐ वृत्तत्रयवासिन्यै नमः । ॐ चतुरस्रस्वरूपास्यायै नमः । ॐ नवचक्रस्वरूपिण्यै नमः । ॐ महानित्यायै
    नमः । ॐ विजयायै नमः । ॐ श्रीराजराजेश्वर्यै नमः ॥ इति श्री कामाक्ष्यष्टोत्तरशतनामावलिः ।
