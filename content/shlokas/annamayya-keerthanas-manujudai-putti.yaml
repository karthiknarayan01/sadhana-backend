id: annamayya-keerthanas-manujudai-putti
category: stotram
name:
  english: Annamayya Keerthanas Manujudai Putti
content:
  english: adi pallavi manujudai putti manujuni sevinci anudinamunu duhkhamandanela || juttèdu kadupukai
    còrani cotlu jòcci pattèdu kutikai batimali | puttina cotike pòrali manasuvètti vatti lampatamu vadalaneradugana
    || manujudai putti manujuni sevinci anudinamunu duhkhamandanela andarilo putti andarilo ceri andari
    rupamulatu tanai | andamaina shri venkatadrishu sevinci andarani pada mandènatugana || manujudai putti
    manujuni sevinci anudinamunu duhkhamandanela
  devanagari: आदि पल्लवि मनुजुडै पुट्टि मनुजुनि सेविञ्चि अनुदिनमुनु दुःखमन्दनेला ॥ जुट्टॆडु कडुपुकै चॊरनि
    चोट्लु जॊच्चि पट्टॆडु कूटिकै बतिमालि । पुट्टिन चोटिके पॊरलि मनसुवॆट्टि वट्टि लम्पटमु वदलनेरडुगान ॥
    मनुजुडै पुट्टि मनुजुनि सेविञ्चि अनुदिनमुनु दुःखमन्दनेला अन्दरिलो पुट्टि अन्दरिलो चेरि अन्दरि रूपमुलटु
    तानै । अन्दमैन श्री वेङ्कटाद्रीशु सेविञ्चि अन्दरानि पद मन्दॆनटुगान ॥ मनुजुडै पुट्टि मनुजुनि सेविञ्चि
    अनुदिनमुनु दुःखमन्दनेला
