id: shivastotramrishibhihkritam
category: stotram
name:
  english: shivastotramrishibhihkritam
  devanagari: शिवस्तोत्रमृषिभिःकृतं
content:
  english: yogyaprapyam dhama shambhorudaram || 15|| drishtva yasyaivagrabhagam sa netram tranaya syaddarshanam
    suryatulyam | taddhamedam sthanasarvasya nityam bhaktya stutyam tam namah shambhudeham || 16|| prakashate
    yah prathamadibhagatah sthitah sa vame ya ihaiva neta | so'smakamastu prathamam svasiddhyai harasya
    shaktya vidhrito lalate || 17|| yah pradhanatmakah sattvarajobhyam tamasanvitah | purushah sarvajagatam
    sa haro nah prasidatu || 18|| iti kalikapurane caturcatvarimshadhyayantargatam rishibhih kritam shivastotram
    |
  devanagari: योग्यप्राप्यं धाम शम्भोरुदारम् ॥ १५॥ दृष्ट्वा यस्यैवाग्रभागं स नेत्रं त्राणाय स्याद्दर्शनं
    सूर्यतुल्यम् । तद्धामेदं स्थानसर्वस्य नित्यं भक्त्या स्तुत्यं तं नमः शम्भुदेहम् ॥ १६॥ प्रकाशते यः
    प्रथमादिभागतः स्थितः स वामे य इहैव नेता । सोऽस्माकमस्तु प्रथमं स्वसिद्ध्यै हरस्य शक्त्या विधृतो ललाटे
    ॥ १७॥ यः प्रधानात्मकः सत्त्वरजोभ्यां तमसान्वितः । पुरुषः सर्वजगतां स हरो नः प्रसीदतु ॥ १८॥ इति कालिकापुराणे
    चतुर्चत्वारिंशाध्यायान्तर्गतं ऋषिभिः कृतं शिवस्तोत्रम् ।
