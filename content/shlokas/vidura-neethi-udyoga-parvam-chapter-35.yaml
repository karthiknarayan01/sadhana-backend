id: vidura-neethi-udyoga-parvam-chapter-35
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 35
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani vidurahitavakye pancatrimsho''dhyayah
    || dhritarashtra uvaca | bruhi bhuyo mahabuddhe dharmarthasahitam vacah | shrinvato nasti me triptirvicitraniha
    bhashase || || vidura uvaca | sarvatirtheshu va snanam sarvabhuteshu carjavam | ubhe ete same syatamarjavam
    va vishishyate || || arjavam pratipadyasva putreshu satatam vibho | iha kirtim param prapya pretya
    svargamavapsyasi || || yavatkirtirmanushyasya punya lokeshu giyate | tavatsa purushavyaghra svargaloke
    mahiyate || || atrapyudaharantimamitihasam puratanam | virocanasya samvadam keshinyarthe sudhanvana
    || || keshinyuvaca | kim brahmanah svicchreyamso ditijah svidvirocana | atha kena sma paryankam sudhanva
    nadhirohati || || virocana uvaca | prajapatya hi vai shreshtha vayam keshini sattamah | asmakam khalvime
    lokah ke devah ke dvijatayah || || keshinyuvaca | ihaivassva pratikshava upasthane virocana | sudhanva
    prataraganta pashyeyam vam samagatau || || virocana uvaca | tatha bhadre karishyami yatha tvam bhiru
    bhashase | sudhanvanam ca mam caiva pratardrashtasi sangatau || || vidura uvaca | anvalabhe hiranmayam
    prahrade''ham tavasanam | ekatvamupasampanno na tvaseyam tvaya saha || || virocana uvaca | anvaharantu
    phalakam kurcam vapyatha va brisim | sudhanvanna tvamarho''si maya saha samasanam || || sudhanvovaca
    | pitapi te samasinamupasitaiva mamadhah | balah sukhaidhito gehe na tvam kim cana budhyase || ||
    virocana uvaca | hiranyam ca gavashvam ca yadvittamasureshu nah | sudhanvanvipane tena prashnam pricchava
    ye viduh || || sudhanvovaca | hiranyam ca gavashvam ca tavaivastu virocana | pranayostu panam kritva
    prashnam pricchava ye viduh || || virocana uvaca | avam kutra gamishyavah pranayorvipane krite | na
    hi deveshvaham sthata na manushyeshu karhi cit || || sudhanvovaca | pitaram te gamishyavah pranayorvipane
    krite | putrasyapi sa hetorhi prahrado nanritam vadet || || prahlada uvaca | imau tau sampradrishyete
    yabhyam na caritam saha | ashivishaviva kruddhavekamargamihagatau || || kim vai sahaiva carato na
    pura caratah saha | virocanaitatpricchami kim te sakhyam sudhanvana || || virocana uvaca | na me sudhanvana
    sakhyam pranayorvipanavahe | prahrada tattvamripcchami ma prashnamanritam vadih || || prahlada uvaca
    | udakam madhuparkam capyanayantu sudhanvane | brahmannabhyarcaniyo''si shveta gauh pivari krita ||
    || sudhanvovaca | udakam madhuparkam ca patha evarpitam mama | prahrada tvam tu nau prashnam tathyam
    prabruhi pricchatoh || || prahlada uvaca | purto vanyo bhavanbrahmansakshye caiva bhavetsthitah |
    tayorvivadatoh prashnam kathamasmadvibho vadet || || atha yo naiva prabruyatsatyam va yadi vanritam
    | etatsudhanvanpricchami durvivakta sma kim vaset || || sudhanvovaca | yam ratrimadhivinna stri yam
    caivaksha parajitah | yam ca bharabhitaptango durvivakta sma tam vaset || || nagare pratiruddhah sanbahirdvare
    bubhukshitah | amitranbhuyasah pashyandurvivakta sma tam vaset || || panca pashvanrite hanti dasha
    hanti gavanrite | shatamashvanrite hanti sahasram purushanrite || || hanti jatanajatamshca hiranyartho''nritam
    vadan | sarvam bhumyanrite hanti ma sma bhumyanritam vadih || || prahlada uvaca | mattah shreyanangira
    vai sudhanva tvadvirocana | matasya shreyasi matustasmattvam tena vai jitah || || virocana sudhanvayam
    prananamishvarastava | sudhanvanpunaricchami tvaya dattam virocanam || || sudhanvovaca | yaddharmamavrinithastvam
    na kamadanritam vadih | punardadami te tasmatputram prahrada durlabham || || esha prahrada putraste
    maya datto virocanah | padaprakshalanam kuryatkumaryah sannidhau mama || || vidura uvaca | tasmadrajendra
    bhumyarthe nanritam vaktumarhasi | ma gamah sa sutamatyo''tyayam putrananubhraman || || na deva yashtimadaya
    rakshanti pashupalavat | yam tu rakshitumicchanti buddhya samvibhajanti tam || || yatha yatha hi purushah
    kalyane kurute manah | tatha tathasya sarvarthah sidhyante natra samshayah || || na chandamsi vrijinattarayanti
    ayavinam mayaya vartamanam | nidam shakunta iva jatapakshash chandamsyenam prajahatyantakale || ||
    mattapanam kalaham pugavairam bharyapatyorantaram jnatibhedam | rajadvishtam stripumamsorvivadam varjyanyahuryashca
    panthah pradushthah || || samudrikam vanijam corapurvam shalaka dhurtam ca cikitsakam ca | arim ca
    mitram ca kushilavam ca naitansakhyeshvadhikurvita sapta || || managnihotramuta manamaunam manenadhitamuta
    manayajnah | etani catvaryabhayankarani bhayam prayacchantyayatha kritani || || agara dahi garadah
    kundashi somavikrayi | parva karashca suci ca mitra dhrukparadarikah || || bhrunaha guru talpi ca
    yashca syatpanapo dvijah | atitikshnashca kakashca nastiko veda nindakah || || sruva pragrahano vratyah
    kinashashcarthavanapi | rakshetyuktashca yo himsyatsarve brahmanhanaih samah || || trinoklaya jnayate
    jatarupam yuge bhadro vyavaharena sadhuh | shuro bhayeshvarthakricchreshu dhirah kricchrasvapatsu
    suhridashcarayash ca || || jara rupam harati hi dhairyamasha mrityuh pranandharmacaryamasuya | krodhah
    shriyam shilamanarya seva hriyam kamah sarvamevabhimanah || || shrirmangalatprabhavati pragalbhyatsampravardhate
    | dakshyattu kurute mulam samyamatpratitishthati || || ashtau gunah purusham dipayanti prajna ca kaulyam
    ca damah shrutam ca | parakramashcabahu bhashita ca danam yathashakti kritajnata ca || || etangunamstata
    mahanubhavan eko gunah samshrayate prasahya | raja yada satkurute manushyam sarvangunanesha guno''tibhati
    || || ashtau nripemani manushyaloke svargasya lokasya nidarshanani | catvaryeshamanvavetani sadbhish
    catvaryeshamanvavayanti santah || || yajno danamadhyayanam tapash ca catvaryetanyanvavetani sadbhih
    | damah satyamarjavamanrishamsyam catvaryetanyanvavayanti santah || || na sa sabha yatra na santi
    vriddha na te vriddha ye na vadanti dharmam | nasau harmo yatana satyamasti na tatsatyam yacchalenanuviddham
    || || satyam rupam shrutam vidya kaulyam shilam balam dhanam | shauryam ca cirabhashyam ca dashah
    samsargayonayah || || papam kurvanpapakirtih papamevashnute phalam | punyam kurvanpunyakirtih punyamevashnute
    phalam || || papam prajnam nashayati kriyamanam punah punah | nashtaprajnah papameva nityamarabhate
    narah || || punyam prajnam vardhayati kriyamanam punah punah | vriddhaprajnah punyameva nityamarabhate
    narah || || asuyako danda shuko nishthuro vairakrinnarah | sa kricchram mahadapnoto naciratpapamacaran
    || || anasuyah kritaprajnah shobhananyacaransada | akricchratsukhamapnoti sarvatra ca virajate ||
    || prajnamevagamayati yah prajnebhyah sa panditah | prajno hyavapya dharmarthau shaknoti sukhamedhitum
    || || divasenaiva tatkuryadyena ratau sukham vaset | ashta masena tatkuryadyena varshah sukham vaset
    || || purve vayasi tatkuryadyena vriddhasukham vaset | yavajjivena tatkuryadyena pretya sukham vaset
    || || jirnamannam prashamsanti bharyam ca gatayauvanam | shuram vigatasangramam gataparam tapasvinam
    || || dhanenadharmalabdhena yacchidramapidhiyate | asamvritam tadbhavati tato''nyadavadiryate || ||
    gururatmavatam shasta shasa raja duratmanam | atha pracchannapapanam shasta vaivasvato yamah || ||
    rishinam ca nadinam ca kulanam ca mahamanam | prabhavo nadhigantavyah strinam dushcaritasya ca ||
    || dvijatipujabhirato data jnatishu carjavi | kshatriyah svargabhagrajamshciram palayate mahim ||
    || suvarnapushpam prithivim cinvanti purushastrayah | shurashca kritavidyashca yashca janati sevitum
    || || buddhishreshthani karmani bahumadhyani bharata | tani jangha jaghanyani bharapratyavarani ca
    || || duryodhane ca shakunau mudhe duhshasane tatha | karne caishvaryamadhaya katham tvam bhutimicchasi
    || || sarvairgunairupetashca pandava bharatarshabha | pitrivattvayi vartante teshu vartasva putravat
    || || || iti shrimahabharate udyogaparvani prajagaraparvani vidurahitavakye pancatrimsho''dhyayah
    ||'
  devanagari: ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरहितवाक्ये पञ्चत्रिंशोऽध्यायः ॥ धृतराष्ट्र
    उवाच । ब्रूहि भूयो महाबुद्धे धर्मार्थसहितं वचः । शृण्वतो नास्ति मे तृप्तिर्विचित्राणीह भाषसे ॥ ॥ विदुर
    उवाच । सर्वतीर्थेषु वा स्नानं सर्वभूतेषु चार्जवम् । उभे एते समे स्यातामार्जवं वा विशिष्यते ॥ ॥ आर्जवं
    प्रतिपद्यस्व पुत्रेषु सततं विभो । इह कीर्तिं परां प्राप्य प्रेत्य स्वर्गमवाप्स्यसि ॥ ॥ यावत्कीर्तिर्मनुष्यस्य
    पुण्या लोकेषु गीयते । तावत्स पुरुषव्याघ्र स्वर्गलोके महीयते ॥ ॥ अत्राप्युदाहरन्तीममितिहासं पुरातनम्
    । विरोचनस्य संवादं केशिन्यर्थे सुधन्वना ॥ ॥ केशिन्युवाच । किं ब्राह्मणाः स्विच्छ्रेयांसो दितिजाः स्विद्विरोचन
    । अथ केन स्म पर्यङ्कं सुधन्वा नाधिरोहति ॥ ॥ विरोचन उवाच । प्राजापत्या हि वै श्रेष्ठा वयं केशिनि सत्तमाः
    । अस्माकं खल्विमे लोकाः के देवाः के द्विजातयः ॥ ॥ केशिन्युवाच । इहैवास्स्व प्रतीक्षाव उपस्थाने विरोचन
    । सुधन्वा प्रातरागन्ता पश्येयं वां समागतौ ॥ ॥ विरोचन उवाच । तथा भद्रे करिष्यामि यथा त्वं भीरु भाषसे
    । सुधन्वानं च मां चैव प्रातर्द्रष्टासि सङ्गतौ ॥ ॥ विदुर उवाच । अन्वालभे हिरण्मयं प्राह्रादेऽहं तवासनम्
    । एकत्वमुपसम्पन्नो न त्वासेयं त्वया सह ॥ ॥ विरोचन उवाच । अन्वाहरन्तु फलकं कूर्चं वाप्यथ वा बृसीम्
    । सुधन्वन्न त्वमर्होऽसि मया सह समासनम् ॥ ॥ सुधन्वोवाच । पितापि ते समासीनमुपासीतैव मामधः । बालः सुखैधितो
    गेहे न त्वं किं चन बुध्यसे ॥ ॥ विरोचन उवाच । हिरण्यं च गवाश्वं च यद्वित्तमसुरेषु नः । सुधन्वन्विपणे
    तेन प्रश्नं पृच्छाव ये विदुः ॥ ॥ सुधन्वोवाच । हिरण्यं च गवाश्वं च तवैवास्तु विरोचन । प्राणयोस्तु पणं
    कृत्वा प्रश्नं पृच्छाव ये विदुः ॥ ॥ विरोचन उवाच । आवां कुत्र गमिष्यावः प्राणयोर्विपणे कृते । न हि
    देवेष्वहं स्थाता न मनुष्येषु कर्हि चित् ॥ ॥ सुधन्वोवाच । पितरं ते गमिष्यावः प्राणयोर्विपणे कृते ।
    पुत्रस्यापि स हेतोर्हि प्रह्रादो नानृतं वदेत् ॥ ॥ प्रह्लाद उवाच । इमौ तौ सम्प्रदृश्येते याभ्यां न
    चरितं सह । आशीविषाविव क्रुद्धावेकमार्गमिहागतौ ॥ ॥ किं वै सहैव चरतो न पुरा चरतः सह । विरोचनैतत्पृच्छामि
    किं ते सख्यं सुधन्वना ॥ ॥ विरोचन उवाच । न मे सुधन्वना सख्यं प्राणयोर्विपणावहे । प्रह्राद तत्त्वामृप्च्छामि
    मा प्रश्नमनृतं वदीः ॥ ॥ प्रह्लाद उवाच । उदकं मधुपर्कं चाप्यानयन्तु सुधन्वने । ब्रह्मन्नभ्यर्चनीयोऽसि
    श्वेता गौः पीवरी कृता ॥ ॥ सुधन्वोवाच । उदकं मधुपर्कं च पथ एवार्पितं मम । प्रह्राद त्वं तु नौ प्रश्नं
    तथ्यं प्रब्रूहि पृच्छतोः ॥ ॥ प्रह्लाद उवाच । पुर्तो वान्यो भवान्ब्रह्मन्साक्ष्ये चैव भवेत्स्थितः ।
    तयोर्विवदतोः प्रश्नं कथमस्मद्विभो वदेत् ॥ ॥ अथ यो नैव प्रब्रूयात्सत्यं वा यदि वानृतम् । एतत्सुधन्वन्पृच्छामि
    दुर्विवक्ता स्म किं वसेत् ॥ ॥ सुधन्वोवाच । यां रात्रिमधिविन्ना स्त्री यां चैवाक्ष पराजितः । यां च
    भाराभितप्ताङ्गो दुर्विवक्ता स्म तां वसेत् ॥ ॥ नगरे प्रतिरुद्धः सन्बहिर्द्वारे बुभुक्षितः । अमित्रान्भूयसः
    पश्यन्दुर्विवक्ता स्म तां वसेत् ॥ ॥ पञ्च पश्वनृते हन्ति दश हन्ति गवानृते । शतमश्वानृते हन्ति सहस्रं
    पुरुषानृते ॥ ॥ हन्ति जातानजातांश्च हिरण्यार्थोऽनृतं वदन् । सर्वं भूम्यनृते हन्ति मा स्म भूम्यनृतं
    वदीः ॥ ॥ प्रह्लाद उवाच । मत्तः श्रेयानङ्गिरा वै सुधन्वा त्वद्विरोचन । मातास्य श्रेयसी मातुस्तस्मात्त्वं
    तेन वै जितः ॥ ॥ विरोचन सुधन्वायं प्राणानामीश्वरस्तव । सुधन्वन्पुनरिच्छामि त्वया दत्तं विरोचनम् ॥ ॥
    सुधन्वोवाच । यद्धर्ममवृणीथास्त्वं न कामादनृतं वदीः । पुनर्ददामि ते तस्मात्पुत्रं प्रह्राद दुर्लभम्
    ॥ ॥ एष प्रह्राद पुत्रस्ते मया दत्तो विरोचनः । पादप्रक्षालनं कुर्यात्कुमार्याः सन्निधौ मम ॥ ॥ विदुर
    उवाच । तस्माद्राजेन्द्र भूम्यर्थे नानृतं वक्तुमर्हसि । मा गमः स सुतामात्योऽत्ययं पुत्राननुभ्रमन् ॥
    ॥ न देवा यष्टिमादाय रक्षन्ति पशुपालवत् । यं तु रक्षितुमिच्छन्ति बुद्ध्या संविभजन्ति तम् ॥ ॥ यथा यथा
    हि पुरुषः कल्याणे कुरुते मनः । तथा तथास्य सर्वार्थाः सिध्यन्ते नात्र संशयः ॥ ॥ न छन्दांसि वृजिनात्तारयन्ति
    आयाविनं मायया वर्तमानम् । नीडं शकुन्ता इव जातपक्षाश् छन्दांस्येनं प्रजहत्यन्तकाले ॥ ॥ मत्तापानं कलहं
    पूगवैरं भार्यापत्योरन्तरं ज्ञातिभेदम् । राजद्विष्टं स्त्रीपुमांसोर्विवादं वर्ज्यान्याहुर्यश्च पन्थाः
    प्रदुष्ठः ॥ ॥ सामुद्रिकं वणिजं चोरपूर्वं शलाक धूर्तं च चिकित्सकं च । अरिं च मित्रं च कुशीलवं च नैतान्साख्येष्वधिकुर्वीत
    सप्त ॥ ॥ मानाग्निहोत्रमुत मानमौनं मानेनाधीतमुत मानयज्ञः । एतानि चत्वार्यभयङ्कराणि भयं प्रयच्छन्त्ययथा
    कृतानि ॥ ॥ अगार दाही गरदः कुण्डाशी सोमविक्रयी । पर्व कारश्च सूची च मित्र ध्रुक्पारदारिकः ॥ ॥ भ्रूणहा
    गुरु तल्पी च यश्च स्यात्पानपो द्विजः । अतितीक्ष्णश्च काकश्च नास्तिको वेद निन्दकः ॥ ॥ स्रुव प्रग्रहणो
    व्रात्यः कीनाशश्चार्थवानपि । रक्षेत्युक्तश्च यो हिंस्यात्सर्वे ब्रह्मण्हणैः समाः ॥ ॥ तृणोक्लया ज्ञायते
    जातरूपं युगे भद्रो व्यवहारेण साधुः । शूरो भयेष्वर्थकृच्छ्रेषु धीरः कृच्छ्रास्वापत्सु सुहृदश्चारयश्
    च ॥ ॥ जरा रूपं हरति हि धैर्यमाशा मृत्युः प्राणान्धर्मचर्यामसूया । क्रोधः श्रियं शीलमनार्य सेवा ह्रियं
    कामः सर्वमेवाभिमानः ॥ ॥ श्रीर्मङ्गलात्प्रभवति प्रागल्भ्यात्सम्प्रवर्धते । दाक्ष्यात्तु कुरुते मूलं
    संयमात्प्रतितिष्ठति ॥ ॥ अष्टौ गुणाः पुरुषं दीपयन्ति प्रज्ञा च कौल्यं च दमः श्रुतं च । पराक्रमश्चाबहु
    भाषिता च दानं यथाशक्ति कृतज्ञता च ॥ ॥ एतान्गुणांस्तात महानुभावान् एको गुणः संश्रयते प्रसह्य । राजा
    यदा सत्कुरुते मनुष्यं सर्वान्गुणानेष गुणोऽतिभाति ॥ ॥ अष्टौ नृपेमानि मनुष्यलोके स्वर्गस्य लोकस्य निदर्शनानि
    । चत्वार्येषामन्ववेतानि सद्भिश् चत्वार्येषामन्ववयन्ति सन्तः ॥ ॥ यज्ञो दानमध्ययनं तपश् च चत्वार्येतान्यन्ववेतानि
    सद्भिः । दमः सत्यमार्जवमानृशंस्यं चत्वार्येतान्यन्ववयन्ति सन्तः ॥ ॥ न सा सभा यत्र न सन्ति वृद्धा न
    ते वृद्धा ये न वदन्ति धर्मम् । नासौ हर्मो यतन सत्यमस्ति न तत्सत्यं यच्छलेनानुविद्धम् ॥ ॥ सत्यं रूपं
    श्रुतं विद्या कौल्यं शीलं बलं धनम् । शौर्यं च चिरभाष्यं च दशः संसर्गयोनयः ॥ ॥ पापं कुर्वन्पापकीर्तिः
    पापमेवाश्नुते फलम् । पुण्यं कुर्वन्पुण्यकीर्तिः पुण्यमेवाश्नुते फलम् ॥ ॥ पापं प्रज्ञां नाशयति क्रियमाणं
    पुनः पुनः । नष्टप्रज्ञः पापमेव नित्यमारभते नरः ॥ ॥ पुण्यं प्रज्ञां वर्धयति क्रियमाणं पुनः पुनः । वृद्धप्रज्ञः
    पुण्यमेव नित्यमारभते नरः ॥ ॥ असूयको दन्द शूको निष्ठुरो वैरकृन्नरः । स कृच्छ्रं महदाप्नोतो नचिरात्पापमाचरन्
    ॥ ॥ अनसूयः कृतप्रज्ञः शोभनान्याचरन्सदा । अकृच्छ्रात्सुखमाप्नोति सर्वत्र च विराजते ॥ ॥ प्रज्ञामेवागमयति
    यः प्राज्ञेभ्यः स पण्डितः । प्राज्ञो ह्यवाप्य धर्मार्थौ शक्नोति सुखमेधितुम् ॥ ॥ दिवसेनैव तत्कुर्याद्येन
    रातौ सुखं वसेत् । अष्ट मासेन तत्कुर्याद्येन वर्षाः सुखं वसेत् ॥ ॥ पूर्वे वयसि तत्कुर्याद्येन वृद्धसुखं
    वसेत् । यावज्जीवेन तत्कुर्याद्येन प्रेत्य सुखं वसेत् ॥ ॥ जीर्णमन्नं प्रशंसन्ति भार्यं च गतयौवनाम्
    । शूरं विगतसङ्ग्रामं गतपारं तपस्विनम् ॥ ॥ धनेनाधर्मलब्धेन यच्छिद्रमपिधीयते । असंवृतं तद्भवति ततोऽन्यदवदीर्यते
    ॥ ॥ गुरुरात्मवतां शास्ता शासा राजा दुरात्मनाम् । अथ प्रच्छन्नपापानां शास्ता वैवस्वतो यमः ॥ ॥ ऋषीणां
    च नदीनां च कुलानां च महामनाम् । प्रभवो नाधिगन्तव्यः स्त्रीणां दुश्चरितस्य च ॥ ॥ द्विजातिपूजाभिरतो
    दाता ज्ञातिषु चार्जवी । क्षत्रियः स्वर्गभाग्राजंश्चिरं पालयते महीम् ॥ ॥ सुवर्णपुष्पां पृथिवीं चिन्वन्ति
    पुरुषास्त्रयः । शूरश्च कृतविद्यश्च यश्च जानाति सेवितुम् ॥ ॥ बुद्धिश्रेष्ठानि कर्माणि बाहुमध्यानि भारत
    । तानि जङ्घा जघन्यानि भारप्रत्यवराणि च ॥ ॥ दुर्योधने च शकुनौ मूढे दुःशासने तथा । कर्णे चैश्वर्यमाधाय
    कथं त्वं भूतिमिच्छसि ॥ ॥ सर्वैर्गुणैरुपेताश्च पाण्डवा भरतर्षभ । पितृवत्त्वयि वर्तन्ते तेषु वर्तस्व
    पुत्रवत् ॥ ॥ ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरहितवाक्ये पञ्चत्रिंशोऽध्यायः ॥
