id: devadibhihkritampurushottamastotram-07
category: stotram
name:
  english: devadibhihkritampurushottamastotram 07
  devanagari: देवादिभिःकृतंपुरुषोत्तमस्तोत्रम् ०७
content:
  english: devadibhih kritam purushottamastotram 7 akasmatpralayam jnatva svargalokasya devatah | sarudrendrarkashashino
    rohinandodare sthitah || 16|| tushtuvurbhayamapanna mam tada purushottamam | parabrahma kripasindho
    sarvarakshaka madhava || 17|| namaste bhagavan sarvantaryamin parameshvara | tvam vina rakshako nanyashcakasmikalayadiha
    || 18|| vidyate prananatha tvam raksha raksha mahalayat | ke vayam svargavasashca kutratra gahvare
    gatah || 19|| na janimo vayam krishnanarayana jagadguro | svargam divyam sarvatejomayam mahati gahvare
    || 3
  devanagari: देवादिभिः कृतं पुरुषोत्तमस्तोत्रम् ७ अकस्मात्प्रलयं ज्ञात्वा स्वर्गलोकस्य देवताः । सरुद्रेन्द्रार्कशशिनो
    रोहिणाण्डोदरे स्थिताः ॥ १६॥ तुष्टुवुर्भयमापन्ना मां तदा पुरुषोत्तमम् । परब्रह्म कृपासिन्धो सर्वरक्षक
    माधव ॥ १७॥ नमस्ते भगवन् सर्वान्तर्यामिन् परमेश्वर । त्वां विना रक्षको नान्यश्चाकस्मिकलयादिह ॥ १८॥
    विद्यते प्राणनाथ त्वं रक्ष रक्ष महालयात् । के वयं स्वर्गवासाश्च कुत्रात्र गह्वरे गताः ॥ १९॥ न जानीमो
    वयं कृष्णनरायण जगद्गुरो । स्वर्गं दिव्यं सर्वतेजोमयं महति गह्वरे ॥ ३
meaning: {}
