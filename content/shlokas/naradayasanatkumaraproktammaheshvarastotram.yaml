id: naradayasanatkumaraproktammaheshvarastotram
category: stotram
name:
  english: naradayasanatkumaraproktammaheshvarastotram
  devanagari: नारदायसनत्कुमारप्रोक्तंमाहेश्वरस्तोत्रम्
content:
  english: rinu narada vakshyami divyam maheshvaram stavam || 217|| yasya pathena pujayam siddhyanti manavo'khilah
    || 218|| dharambvagnimaruvdyomamakheshendvarkamurtaye | sarvabhutantarasthaya shankaraya namo namah
    || 219|| shrutyantakritavasaya shrutaye shrutijanmane | atindriyaya mahase shashvataya namo namah
    || 220|| sthulasukshmavibhagabhyamanirdeshyaya shambhave | bhavaya bhavasambhutaduhkhahantre namo
    namah || 221|| tarkamargatiduraya tapasam phaladayine | caturvargavadanyaya sarvajnaya namo namah
    || 222|| adimadhyantashunyaya nirastasheshabhitaye | yogidhyeyaya mahate nirgunaya namo namah || 223||
    vishvatmane viviktaya vilasaccandramaulaye | kandarpadarpanashaya kalahantre namo namah || 224|| vishashanaya
    viharadvrishaskandhamupeyushe | sariddamasamabaddhakapardaya namo namah || 225|| shuddhaya shuddhabhavaya
    shuddhanamantaratmane | purantakaya purnaya punyanamne namo namah || 226|| bhaktaya nijabhaktanam
    bhuktimuktipradayine | vivasase nivasaya vishvesham pataye namah || 227|| trimurtimulabhutaya trinetraya
    trishuline | tridhamne dhamarupaya janmadaya namo namah || 228|| devasurashiroratnakiritarunitanghraye
    | kantaya nijakantayai dattarddhaya namo namah || 229|| etatstotram maheshasya proktam sarvaghanashanam
    | shivasannidhyadam vipra sarpatantraprakashakam || 230|| etatte sumahattantre sarvadevaprakashakam
    | lokabhilashasampurtikriyasadhanasangatam || 231|| iti naradapurane purvabhage ekonashititamadhyayantargatam
    naradaya sanatkumaraproktam maheshvarastotram samaptam | brihannaradiyapurana | purvabhaga | adhyaya
    91
  devanagari: ृणु नारद वक्ष्यामि दिव्यं माहेश्वरं स्तवम् ॥ २१७॥ यस्य पाठेन पूजायां सिद्ध्यन्ति मनवोऽखिलाः
    ॥ २१८॥ धराम्ब्वग्निमरुव्द्योममखेशेन्द्वर्कमूर्तये । सर्वभूतान्तरस्थाय शङ्कराय नमो नमः ॥ २१९॥ श्रुत्यन्तकृतवासाय
    श्रुतये श्रुतिजन्मने । अतीन्द्रियाय महसे शाश्वताय नमो नमः ॥ २२०॥ स्थूलसूक्ष्मविभागाभ्यामनिर्देश्याय
    शम्भवे । भवाय भवसम्भूतदुःखहन्त्रे नमो नमः ॥ २२१॥ तर्कमार्गातिदूराय तपसां फलदायिने । चतुर्वर्गवदान्याय
    सर्वज्ञाय नमो नमः ॥ २२२॥ आदिमध्यान्तशून्याय निरस्ताशेषभीतये । योगिध्येयाय महते निर्गुणाय नमो नमः ॥
    २२३॥ विश्वात्मने विविक्ताय विलसच्चन्द्रमौलये । कन्दर्पदर्पनाशाय कालहन्त्रे नमो नमः ॥ २२४॥ विषाशनाय
    विहरद्वृषस्कन्धमुपेयुषे । सरिद्दामसमाबद्धकपर्दाय नमो नमः ॥ २२५॥ शुद्धाय शुद्धभावाय शुद्धानामन्तरात्मने
    । पुरान्तकाय पूर्णाय पुण्यनाम्ने नमो नमः ॥ २२६॥ भक्ताय निजभक्तानां भुक्तिमुक्तिप्रदायिने । विवाससे
    निवासाय विश्वेषां पतये नमः ॥ २२७॥ त्रिमूर्तिमूलभूताय त्रिनेत्राय त्रिशूलिने । त्रिधाम्ने धामरूपाय
    जन्मदाय नमो नमः ॥ २२८॥ देवासुरशिरोरत्नकिरीटारुणिताङ्घ्रये । कान्ताय निजकान्तायै दत्तार्द्धाय नमो नमः
    ॥ २२९॥ एतत्स्तोत्रं महेशस्य प्रोक्तं सर्वाघनाशनम् । शिवसान्निध्यदं विप्र सर्पतन्त्रप्रकाशकम् ॥ २३०॥
    एतत्ते सुमहत्तन्त्रे सर्वदेवप्रकाशकम् । लोकाभिलाषसम्पूर्तिक्रियासाधनसङ्गतम् ॥ २३१॥ इति नारदपुराणे
    पूर्वभागे एकोनाशीतितमाध्यायान्तर्गतं नारदाय सनत्कुमारप्रोक्तं माहेश्वरस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण
    । पूर्वभाग । अध्याय ९१
