id: brahmasutramvsh
category: sutra
name:
  english: brahmasutramVsh
  devanagari: ब्रह्मसूत्रम्Vष्
content:
  english: vasudevanandasarasvativiracitam brahmasutram cittulajatam yadu cittavrittam trivritkritam yena
    ca bhutajatam | yatpurvajatam yadu naiva jatam tadbrahmasutram dvija dhehyajatam || 1|| trilokasutram
    khalu yatsumantram trivrittagatram navadevamatram | yadvai trimatram yadanantamatram tadbrahmasutram
    dvija dhehyajatam || 2|| prajapateryatkhalu purvajatam yajnopavitam sahajatamaktam | sattvena muktam
    trigunena shaktam tadbrahmasutram dvija dhehyajatam || 3|| dakshoddhritam cedyadu vishvasutram sada
    pavitram prakaroti sutram | enolavitram bhajataikapatram tadbrahmasutram dvija dhehyajatam || 4||
    yadbrahmasutram yadu vastutantram yatah svatantram paratantrayantram | tamahuratreh paramam suputram
    tadbrahmasutram dvija dhehyajatam || 5|| yamatriputram bruvate pavitramasadhvamitram kila sadhumitram
    | ativa citram suvicitragatram tadbrahmasutram dvija dhehyajatam || 6|| ananyaya sutramidam pavitram
    bhaktya dhritam cetsuvishuddhagatram | bhavetpavitratsa pavitra eva tadbrahmasutram dvija dhehyajatam
    || 7|| sa brahmano yo manasa bibharti yadva naro yo vacasa bibharti | yadvapyadambhah shravasa bibharti
    tadbrahmasutram dvija dhehyajatam || 8|| dvijo'pi cedyena vivarjitah sa candala evasya ca dharanena
    | sadbrahmanatvam khalu hinajatestadbrahmasutram dvija dhehyajatam || 9|| navasutramahoratram yo'triputramayam
    dvijah | brahmasutramidam dhatte sa yatiha pavitratam || 10|| iti shri paramapujaniya shrivasudevanandasarasvativiracitam
    brahmasutram sampurnam ||
  devanagari: वासुदेवानन्दसरस्वतीविरचितं ब्रह्मसूत्रम् चित्तूलजातं यदु चित्तवृत्तं त्रिवृत्कृतं येन च
    भूतजातम् । यत्पूर्वजातं यदु नैव जातं तद्ब्रह्मसूत्रं द्विज धेह्यजातम् ॥ १॥ त्रिलोकसूत्रं खलु यत्सुमन्त्रं
    त्रिवृत्तगात्रं नवदेवमात्रम् । यद्वै त्रिमात्रं यदनन्तमात्रं तद्ब्रह्मसूत्रं द्विज धेह्यजातम् ॥ २॥
    प्रजापतेर्यत्खलु पूर्वजातं यज्ञोपवीतं सहजातमाक्तम् । सत्त्वेन मुक्तं त्रिगुणेन शक्तं तद्ब्रह्मसूत्रं
    द्विज धेह्यजातम् ॥ ३॥ दक्षोद्धृतं चेद्यदु विश्वसूत्रं सदा पवित्रं प्रकरोति सूत्रम् । एनोलवित्रं भजतैकपात्रं
    तद्ब्रह्मसूत्रं द्विज धेह्यजातम् ॥ ४॥ यद्ब्रह्मसूत्रं यदु वस्तुतन्त्रं यतः स्वतन्त्रं परतन्त्रयन्त्रम्
    । तमाहुरत्रेः परमं सुपुत्रं तद्ब्रह्मसूत्रं द्विज धेह्यजातम् ॥ ५॥ यमत्रिपुत्रं ब्रुवते पवित्रमसाध्वमित्रं
    किल साधुमित्रम् । अतीव चित्रं सुविचित्रगात्रं तद्ब्रह्मसूत्रं द्विज धेह्यजातम् ॥ ६॥ अनन्यया सूत्रमिदं
    पवित्रं भक्त्या धृतं चेत्सुविशुद्धगात्रम् । भवेत्पवित्रात्स पवित्र एव तद्ब्रह्मसूत्रं द्विज धेह्यजातम्
    ॥ ७॥ स ब्राह्मणो यो मनसा बिभर्ति यद्वा नरो यो वचसा बिभर्ति । यद्वाप्यदम्भः श्रवसा बिभर्ति तद्ब्रह्मसूत्रं
    द्विज धेह्यजातम् ॥ ८॥ द्विजोऽपि चेद्येन विवर्जितः स चण्डाल एवास्य च धारणेन । सद्ब्राह्मणत्वं खलु हीनजातेस्तद्ब्रह्मसूत्रं
    द्विज धेह्यजातम् ॥ ९॥ नवसूत्रमहोरात्रं योऽत्रिपुत्रमयं द्विजः । ब्रह्मसूत्रमिदं धत्ते स यातीह पवित्रताम्
    ॥ १०॥ इति श्री परमपूजनीय श्रीवासुदेवानन्दसरस्वतीविरचितं ब्रह्मसूत्रं सम्पूर्णम् ॥
