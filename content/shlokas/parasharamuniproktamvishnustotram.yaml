id: parasharamuniproktamvishnustotram
category: stotram
name:
  english: parasharamuniproktamvishnustotram
  devanagari: पराशरमुनिप्रोक्तंविष्णुस्तोत्रम्
content:
  english: parasharamuniproktam vishnustotram shriparashara uvaca | avikaraya shuddhaya nityaya paramatmane
    | sadaikaruparupaya vishnave sarvajishnave || 1|| namo hiranyagarbhaya haraye shankaraya ca | vasudevaya
    taraya sargasthityantakarine || 2|| ekanekasvarupaya sthulasukshmatmane namah | avyaktavyaktarupaya
    vishnave muktihetave || 3|| sargasthitivinashanam jagato yo jaganmayah | mulabhuto namastasmai vishnave
    paramatmane || 4|| adharabhutam vishvasyapyaniyamsamaniyasam | pranamya sarvabhutasthamacyutam purushottamam
    || 5|| jnanasvarupamatyantanirmalam paramarthatah | tamevarthasvarupena bhrantidarshanatah sthitam
    || 6|| vishnum grasishnum vishvasya sthitau sarge tatha prabhum | pranamya jagatamishamajamakshayamavyayam
    || 7|| prithivyapastatha tejo vayurakasha eva ca | sarvondriyantah karanam purushakhyam hi yajjagat
    || 68|| sa eva sarvabhutatma vishvarupo yato'vyayah | sargadikam tu tasyaiva bhutasthamupakarakam
    || 69|| sa eva srijyah sa ca sargakarta sa eva patyatti ca palyate ca | brahmadyavasthabhirasheshamurtirvishnurvarishtho
    varado varenyah || 70|| iti vishnupurane prathamabhage dvitiyadhyayantargatam parasharamuniproktam
    vishnustotram samaptam | vishnupurana | adhyaya 1
  devanagari: पराशरमुनिप्रोक्तं विष्णुस्तोत्रम् श्रीपराशर उवाच । अविकाराय शुद्धाय नित्याय परमात्मने ।
    सदैकरूपरूपाय विष्णवे सर्वजिष्णवे ॥ १॥ नमो हिरण्यगर्भाय हरये शङ्कराय च । वासुदेवाय ताराय सर्गस्थित्यन्तकारिणे
    ॥ २॥ एकानेकस्वरूपाय स्थूलसूक्ष्मात्मने नमः । अव्यक्तव्यक्तरूपाय विष्णवे मुक्तिहेतवे ॥ ३॥ सर्गस्थितिविनाशानां
    जगतो यो जगन्मयः । मूलभूतो नमस्तस्मै विष्णवे परमात्मने ॥ ४॥ आधारभूतं विश्वस्याप्यणीयांसमणीयसाम् । प्रणम्य
    सर्वभूतस्थमच्युतं पुरुषोत्तमम् ॥ ५॥ ज्ञानस्वरूपमत्यन्तनिर्मलं परमार्थतः । तमेवार्थस्वरूपेण भ्रान्तिदर्शनतः
    स्थितम् ॥ ६॥ विष्णुं ग्रसिष्णुं विश्वस्य स्थितौ सर्गे तथा प्रभुम् । प्रणम्य जगतामीशमजमक्षयमव्ययम्
    ॥ ७॥ पृथिव्यापस्तथा तेजो वायुराकाश एव च । सर्वोन्द्रियान्तः करणं पुरुषाख्यं हि यज्जगत् ॥ ६८॥ स एव
    सर्वभूतात्मा विश्वरूपो यतोऽव्ययः । सर्गादिकं तु तस्यैव भूतस्थमुपकारकम् ॥ ६९॥ स एव सृज्यः स च सर्गकर्ता
    स एव पात्यत्ति च पाल्यते च । ब्रह्माद्यवस्थाभिरशेषमूर्तिर्विष्णुर्वरिष्ठो वरदो वरेण्यः ॥ ७०॥ इति विष्णुपुराणे
    प्रथमभगे द्वितीयाध्यायान्तर्गतं पराशरमुनिप्रोक्तं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय १
