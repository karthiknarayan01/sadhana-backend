id: dakshina-upan
category: upanishad
name:
  english: dakshina upan
  devanagari: दक्शिन उपन्
content:
  english: taram param ramabijam vadetsambashivaya ca | tubhyam canalajayam manurdvadashavarnakah || 9||
    vinam karaih pustakamakshamalam bibhranamabhrabhagalam varadhyam | phanindrakakshyam munibhih shukadyaih
    sevyam vatadhah kritanidamide || 10|| vishnu rishiranushtup chandah | devata dakshinasyah | mantrena
    nyasah | taram namo bhagavate tubhyam vatapadam tatah | muleti padamuccarya vasine padamuddharet ||
    11|| prajnamedhapadam pashcadadisiddhim tato vadet | dayine padamuccarya mayine nama uddharet || 12||
    vagishaya tatah pashcanmahajnanapadam tatah | vahnijayam tatastvesha dvatrimshadvarnako manuh | anushtubho
    mantrarajah sarvamantrottamotamah || 13|| dhyanam | mudrapustakavahninagavilasadbahum prasannananam
    muktaharavibhushanam shashikalabhasvatkiritojjvalam | ajnanapahamadimadimagiramartham bhavanipatim
    nyagrodhantanivasinam paragurum dhyayamyabhishtaptaye || 14|| maunamudra | so'hamiti yavadasthitih
    sanishtha bhavati | tadabhedena mantramredanam jnanasadhanam | citte tadekatanata parikarah | angaceshtarpanam
    balih | trini dhamani kalah | dvadashantapadam sthanamiti | te ha punah shraddadhanastam pratyucuh
    | katham va'syodayah | kim svarupam | ko va'syopasaka iti | sa hovaca | vairagyatailasampurne bhaktivartisamanvite
    | prabodhapurnapatre tu jnaptidipam vilokayet || 15|| mohandhakare nihsare udeti svayameva hi | vairagyamaranim
    kritva jnanam kritvottararanim || 16|| gadhatamisrasamshantyai gudhamartham nivedayet | mohabhanujasamkrantam
    vivekakhyam mrikandujam || 17|| tattvavicarapashena baddham dvaitabhayaturam | ujjivayannijanande
    svasvarupena samsthitah || 18|| shemushi dakshina prokta sa yasyabhikshane mukham | dakshinabhimukhah
    proktah shivo'sau brahmavadibhih || 19|| sargadikale bhagavanvirinci
  devanagari: तारं परं रमाबीजं वदेत्सांबशिवाय च । तुभ्यं चानलजायां मनुर्द्वादशवर्णकः ॥ ९॥ वीणां करैः पुस्तकमक्षमालां
    बिभ्राणमभ्राभगलं वराढ्यम् । फणीन्द्रकक्ष्यं मुनिभिः शुकाद्यैः सेव्यं वटाधः कृतनीडमीडे ॥ १०॥ विष्णू
    ऋषिरनुष्टुप् छन्दः । देवता दक्षिणास्यः । मन्त्रेण न्यासः । तारं नमो भगवते तुभ्यं वटपदं ततः । मूलेति
    पदमुच्चार्य वासिने पदमुद्धरेत् ॥ ११॥ प्रज्ञामेधापदं पश्चादादिसिद्धिं ततो वदेत् । दायिने पदमुच्चार्य
    मायिने नम उद्धरेत् ॥ १२॥ वागीशाय ततः पश्चान्महाज्ञानपदं ततः । वह्निजायां ततस्त्वेष द्वात्रिंशद्वर्णको
    मनुः । आनुष्टुभो मन्त्रराजः सर्वमन्त्रोत्तमोतमः ॥ १३॥ ध्यानम् । मुद्रापुस्तकवह्निनागविलसद्बाहुं प्रसन्नाननं
    मुक्ताहारविभूषणं शशिकलाभास्वत्किरीटोज्ज्वलम् । अज्ञानापहमादिमादिमगिरामर्थं भवानीपतिं न्यग्रोधान्तनिवासिनं
    परगुरुं ध्यायाम्यभीष्टाप्तये ॥ १४॥ मौनमुद्रा । सोऽहमिति यावदास्थितिः सनिष्ठा भवति । तदभेदेन मन्त्राम्रेडनं
    ज्ञानसाधनम् । चित्ते तदेकतानता परिकरः । अङ्गचेष्टार्पणं बलिः । त्रीणि धामानि कालः । द्वादशान्तपदं
    स्थानमिति । ते ह पुनः श्रद्दधानास्तं प्रत्यूचुः । कथं वाऽस्योदयः । किं स्वरूपम् । को वाऽस्योपासक इति
    । स होवाच । वैराग्यतैलसम्पूर्णे भक्तिवर्तिसमन्विते । प्रबोधपूर्णपात्रे तु ज्ञप्तिदीपं विलोकयेत् ॥
    १५॥ मोहान्धकारे निःसारे उदेति स्वयमेव हि । वैराग्यमरणिं कृत्वा ज्ञानं कृत्वोत्तरारणिम् ॥ १६॥ गाढतामिस्रसंशान्त्यै
    गूढमर्थं निवेदयेत् । मोहभानुजसंक्रान्तं विवेकाख्यं मृकण्डुजम् ॥ १७॥ तत्त्वाविचारपाशेन बद्धं द्वैतभयातुरम्
    । उज्जीवयन्निजानन्दे स्वस्वरूपेण संस्थितः ॥ १८॥ शेमुषी दक्षिणा प्रोक्ता सा यस्याभीक्षणे मुखम् । दक्षिणाभिमुखः
    प्रोक्तः शिवोऽसौ ब्रह्मवादिभिः ॥ १९॥ सर्गादिकाले भगवान्विरिञ्चि
