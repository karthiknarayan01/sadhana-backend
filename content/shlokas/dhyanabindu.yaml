id: dhyanabindu
category: upanishad
name:
  english: dhyanabindu
  devanagari: ध्यनबिन्दु
content:
  english: monkaramekam ravikotidiptim | pashyanti ye sarvajanantarastham hamsatmakam te viraja bhavanti
    || 24|| yanmanastrijagatsrishtisthitivyasanakarmakrit | tanmano vilayam yati tadvishnoh paramam padam
    || 25|| ashtapatram tu hritpadmam dvatrimshatkesaranvitam | tasya madhye sthito bhanurbhanumadhyagatah
    shashi || 26|| shashimadhyagato vahnirvahnimadhyagata prabha | prabhamadhyagatam pitham nanaratnapraveshtitam
    || 27|| tasya madhyagatam devam vasudevam niranjanam | shrivatsakaustubhoraskam muktamanivibhushitam
    || 28|| shuddhasphatikasamkasham candrakotisamaprabham | evam dhyayenmahavishnumevam va vinayanvitah
    || 29|| atasipushpasamkasham nabhisthane pratishthitam | caturbhujam mahavishnum purakena vicintayet
    || 30|| kumbhakena hridisthane cintayetkamalasanam | brahmanam raktagaurabham caturvaktram pitamaham
    || 31|| recakena tu vidyatma lalatastham trilocanam | shuddhasphatikasamkasham nishkalam papanashanam
    || 32|| anjapatramadhahpushpamurdhvanalamadhomukham | kadalipushpasamkasham sarvavedamayam shivam
    || 33|| shataram shatapatradhyam vikirnambujakarnikam | tatrarkacandravahninamuparyupari cintayet
    || 34|| padmasyodghatanam kritva bodhacandragnisuryakam | tasya hridbijamahritya atmanam carate dhruvam
    || 35|| tristhanam ca trimatram ca tribrahma ca trayaksharam | trimatramardhamatram va yastam veda
    sa vedavit || 36|| tailadharamivacchinnadirghaghantaninadavat | bindunadakalatitam yastam veda sa
    vedavit || 37|| yathaivatpalanalena toyamakarshayennarah | tathaivaotkarshayedvayum yogi yogapathe
    sthitah || 38|| ardhamatratmakam kritva koshibhutam tu pankajam | karshayennalamatrena bhruvormadhye
    layam nayet || 39|| bhruvormadhye lalate tu nasikayastu mulatah | janiyadamritam sthanam tadbrahmayatanam
    mahat || 40|| asanam pranasamrodhah pratyaharashca dharana | dhyanam samadhiretani yogangani bhavanti
    shat || 41|| asanani ca tavanti yavantyo jivajatayah | eteshanatulanbhedanvijanati maheshvarah ||
    42|| chidram bhadram tatha simham padmam ceti catushtayam | adharam prathamam cakram svadhishthanam
    dvitiyakam || 43|| yonisthanam tayormadhye kamarupam nigadyate | adharakhye gudasthane pankajam yaccaturdalam
    || 44|| tanmadhye procyate yonih kamakhya siddhavandita | yonimadhye sthitam lingam pashcimabhimukham
    tatha || 45|| mastake manivadbhinnam yo janati sa yogavit | taptacamikarakaram tadillekheva visphurat
    || 46|| caturasramuparyagneradho medhratpratishthitam | svashabdena bhavetpranah svadhishthanam tadashrayam
    || 47|| svadhishthanam tatashcakram medhrameva nigadyate | manivattantuna yatra vayuna puritam vapuh
    || 48|| tannabhimandalam cakram procyate manipurakam | dvadasharamahacakre punyapapaniyantritah ||
    49|| tavajjivo bhramatyevam yavattattvam na vindati | urdhvam medhradatho nabheh kando yo'sti khagandavat
    || 50|| tatra nadyah samutpannah sahasrani dvisaptatih | teshu nadisahasreshu dvisaptatirudahritah
    || 51|| pradhanah pranavahinyo bhuyastatra dasha smritah | ida ca pingala caiva sushumna ca tritiyaka
    || 52|| gandhari hastijihva ca pusha caiva yashasvini | alambusa kuhuratra shankhini dashami smrita
    || 53|| evam nadimayam cakram vijneyam yogina sada | satatam pranavahinyah soma suryagnidevatah ||
    54|| idapingalasushumnastisro nadyah prakirtitah | ida vame sthita bhage pingala dakshine sthita ||
    55|| sushumna madhyadeshe tu pranamargastrayah smritah | prano'panah samanashcodano vyanastathaiva
    ca || 56|| nagah kurmah krikarako devadatto dhananjayah | pranadyah panca vikhyata nagadyah panca
    vayavah || 57|| ete nadisahasreshu vartante jivarupinah | pranapanavasho jivo hyadhashcordhvam pradhavati
    || 58|| vamadakshinamargena cancalatvanna drishyate | akshipto bhujadandena yathoccalati kandukah
    || 59|| pranapanasamakshiptastadvajjivo na vishramet | apanatkarshati prano'panah pranacca karshati
    || 60|| khagarajjuvadityetadyo janati sa yogavit | hakarena bahiryati sakarena vishetpunah || 61||
    hamsahamsetyamam mantram jivo japati sarvada | shatani shatdivaratram sahasranekavimshatih || 62||
    etansankhyanvitam mantram jivo japati sarvada | ajapa nama gayatri yoginam mokshada sada || 63|| asyah
    sankalpamatrena narah papaih pramucyate | anaya sadrishi vidya anaya sadrisho japah || 64|| anaya
    sadrisham punyam na bhutam na bhavishyati | yena margena gantavyam brahmasthanam niramayam || 65||
    mukhenacchadya taddvaram prasupta parameshvari | prabuddha vahniyogena manasa maruta saha || 66||
    sucivadgunamadaya vrajatyurdhvam sushumnaya | udghatayetkapatam tu yatha kuncikaya hathat || 67||
    kundalinya taya yogi mokshadvaram vibhedayet || 68|| kritva samputitau karau dridhataram badhvatha
    padmasanam | gadham vakshasi sannidhaya cubukam dhyanam ca taccetasi || varamvaramamapatamurdhvamanilam
    proccarayanpuritam | muncanpranamupaiti bodhamatulam shaktiprabhavannarah || 69|| padmasanasthito
    yogi nadidvareshu purayan | marutam kumbhayanyastu sa mukto natra samshayah || 70|| anganam mardanam
    kritva shramajatena varina | katvamlalavanatyagi kshirapanaratah sukhi || 71|| brahmacari mitahari
    yogi yogaparayanah | abdadurdhvam bhavetsiddho natra karyam vicarana || 72|| kandordhvakundali shaktih
    sa yogi siddhibhajanam | apanapranayoraikyam kshayanmutrapurishayoh || 73|| yuva bhavati vriddho'pi
    satatam mulabandhanat | parshnibhagena sampidya yonimakuncayedgudam || 74|| apanamurdhvamutkrishya
    mulabandho'yamucyate | udyanam kurute yasmadavishrantamahakhagah || 75|| uddiyanam tadeva syattatra
    bandho vidhiyate | udare pashcimam tanam nabherurdhvam tu karayet || 76|| uddiyano'pyayam bandho mrityumatangakesari
    | badhnati hi shirojatamadhogaminabhojalam || 77|| tato jalandharo bandhah karmaduhkhaughanashanah
    | jalandhare krite bandhe karnasamkocalakshane || 78|| na piyusham patatyagnau na ca vayuh pradhavati
    | kapalakuhare jihva pravishta viparitaga || 79|| bhruvorantargata drishtirmudra bhavati khecari |
    na rogo maranam tasya na nidra na kshudha trisha || 80|| na ca murccha bhavettasya yo mudram vetti
    khecarim | pidyate na ca rogena lipyate na ca karmana || 81|| badhyate na ca kalena yasya mudrasti
    khecari | cittam carati khe yasmajjihva bhavati khegata || 82|| tenaisha khecari nama mudra siddhanamaskrita
    | khecarya mudraya yasya vivaram lambikordhvatah || 83|| binduh ksharati no yasya kaminyalingitasya
    ca | yavadbinduh sthito dehe tavanmrityubhayam kutah || 84|| yavadbaddha nabhomudra tavadbindurna
    gacchati | galito'pi yada binduh samprapto yonimandale || 85|| vrajatyurdhvam hathacchaktya nibaddho
    yonimudraya | sa eva dvividho binduh pandaro lohitastatha || 86|| pandaram shukramityahurlohitakhyam
    maharajah | vidrumadrumasamkasham yonisthane sthitam rajah || 87|| shashisthane vasedbinduhstayoraikyam
    sudurlabham | binduh shivo rajah shaktirbindurindu rajo ravih || 88|| ubhayaoh sangamadeva prapyate
    paramam vapuh | vayuna shakticalena preritam khe yatha rajah || 89|| ravinaikatvamayati bhaveddivyam
    vapustada | shuklam candrena samyuktam rajah suryasamanvitam || 90|| dvayoh samarasibhavam yo janati
    sa yogavit | shodhanam malajalanam ghatanam candrasuryayoh || 91|| rasanam shoshanam samyanmahamudrabhidhiyate
    || 92|| vakshonyastahanurnipidya sushiram yoneshca vamanghrina hastabhyamanudharayanpravitatam padam
    tatha dakshinam || apurya shvasanena kukshiyugalam badhva shanairecaye
  devanagari: मोङ्कारमेकं रविकोटिदीप्तिम् । पश्यन्ति ये सर्वजनान्तरस्थं हंसात्मकं ते विरजा भवन्ति ॥ २४॥
    यन्मनस्त्रिजगत्सृष्टिस्थितिव्यसनकर्मकृत् । तन्मनो विलयं याति तद्विष्णोः परमं पदम् ॥ २५॥ अष्टपत्रं
    तु हृत्पद्मं द्वात्रिंशत्केसरान्वितम् । तस्य मध्ये स्थितो भानुर्भानुमध्यगतः शशी ॥ २६॥ शशिमध्यगतो वह्निर्वह्निमध्यगता
    प्रभा । प्रभामध्यगतं पीठं नानारत्नप्रवेष्टितम् ॥ २७॥ तस्य मध्यगतं देवं वासुदेवं निरञ्जनम् । श्रीवत्सकौस्तुभोरस्कं
    मुक्तामणिविभूषितम् ॥ २८॥ शुद्धस्फटिकसंकाशं चन्द्रकोटिसमप्रभम् । एवं ध्यायेन्महाविष्णुमेवं वा विनयान्वितः
    ॥ २९॥ अतसीपुष्पसंकाशं नाभिस्थाने प्रतिष्ठितम् । चतुर्भुजं महाविष्णुं पूरकेण विचिन्तयेत् ॥ ३०॥ कुम्भकेन
    हृदिस्थाने चिन्तयेत्कमलासनम् । ब्रह्माणं रक्तगौराभं चतुर्वक्त्रं पितामहम् ॥ ३१॥ रेचकेन तु विद्यात्मा
    ललाटस्थं त्रिलोचनम् । शुद्धस्फटिकसंकाशं निष्कलं पापनाशनम् ॥ ३२॥ अञ्जपत्रमधःपुष्पमूर्ध्वनालमधोमुखम्
    । कदलीपुष्पसंकाशं सर्ववेदमयं शिवम् ॥ ३३॥ शतारं शतपत्राढ्यं विकीर्णाम्बुजकर्णिकम् । तत्रार्कचन्द्रवह्नीनामुपर्युपरि
    चिन्तयेत् ॥ ३४॥ पद्मस्योद्घाटनं कृत्वा बोधचन्द्राग्निसूर्यकम् । तस्य हृद्बीजमाहृत्य आत्मानं चरते ध्रुवम्
    ॥ ३५॥ त्रिस्थानं च त्रिमात्रं च त्रिब्रह्म च त्रयाक्षरम् । त्रिमात्रमर्धमात्रं वा यस्तं वेद स वेदवित्
    ॥ ३६॥ तैलधारमिवाच्छिन्नदीर्घघण्टानिनादवत् । बिन्दुनादकलातीतं यस्तं वेद स वेदवित् ॥ ३७॥ यथैवत्पलनालेन
    तोयमाकर्षयेन्नरः । तथैवओत्कर्षयेद्वायुं योगी योगपथे स्थितः ॥ ३८॥ अर्धमात्रात्मकं कृत्वा कोशीभूतं तु
    पङ्कजम् । कर्षयेन्नलमात्रेण भ्रुवोर्मध्ये लयं नयेत् ॥ ३९॥ भ्रुवोर्मध्ये ललाटे तु नासिकायास्तु मूलतः
    । जानीयादमृतं स्थानं तद्ब्रह्मायतनं महत् ॥ ४०॥ आसनं प्राणसंरोधः प्रत्याहारश्च धारणा । ध्यानं समाधिरेतानि
    योगाङ्गानि भवन्ति षट् ॥ ४१॥ आसनानि च तावन्ति यावन्त्यो जीवजातयः । एतेषानतुलान्भेदान्विजानाति महेश्वरः
    ॥ ४२॥ छिद्रं भद्रं तथा सिंहं पद्मं चेति चतुष्टयम् । आधारं प्रथमं चक्रं स्वाधिष्ठानं द्वितीयकम् ॥ ४३॥
    योनिस्थानं तयोर्मध्ये कामरूपं निगद्यते । आधाराख्ये गुदस्थाने पङ्कजं यच्चतुर्दलम् ॥ ४४॥ तन्मध्ये प्रोच्यते
    योनिः कामाख्या सिद्धवन्दिता । योनिमध्ये स्थितं लिङ्गं पश्चिमाभिमुखं तथा ॥ ४५॥ मस्तके मणिवद्भिन्नं
    यो जानाति स योगवित् । तप्तचामीकराकारं तडिल्लेखेव विस्फुरत् ॥ ४६॥ चतुरस्रमुपर्यग्नेरधो मेढ्रात्प्रतिष्ठितम्
    । स्वशब्देन भवेत्प्राणः स्वाधिष्ठानं तदाश्रयम् ॥ ४७॥ स्वाधिष्ठानं ततश्चक्रं मेढ्रमेव निगद्यते । मणिवत्तन्तुना
    यत्र वायुना पूरितं वपुः ॥ ४८॥ तन्नाभिमण्डलं चक्रं प्रोच्यते मणिपूरकम् । द्वादशारमहाचक्रे पुण्यपापनियन्त्रितः
    ॥ ४९॥ तावज्जीवो भ्रमत्येवं यावत्तत्त्वं न विन्दति । ऊर्ध्वं मेढ्रादथो नाभेः कन्दो योऽस्ति खगाण्डवत्
    ॥ ५०॥ तत्र नाड्यः समुत्पन्नाः सहस्राणि द्विसप्ततिः । तेषु नाडीसहस्रेषु द्विसप्ततिरुदाहृताः ॥ ५१॥ प्रधानाः
    प्राणवाहिन्यो भूयस्तत्र दश स्मृताः । इडा च पिङ्गला चैव सुषुम्ना च तृतीयका ॥ ५२॥ गान्धारी हस्तिजिह्वा
    च पूषा चैव यशस्विनि । अलम्बुसा कुहूरत्र शङ्खिनी दशमी स्मृता ॥ ५३॥ एवं नाडीमयं चक्रं विज्ञेयं योगिना
    सदा । सततं प्राणवाहिन्यः सोम सूर्याग्निदेवताः ॥ ५४॥ इडापिङ्गलासुषुम्नास्तिस्रो नाड्यः प्रकीर्तिताः
    । इडा वामे स्थिता भागे पिङ्गला दक्षिणे स्थिता ॥ ५५॥ सुषुम्ना मध्यदेशे तु प्राणमार्गास्त्रयः स्मृताः
    । प्राणोऽपानः समानश्चोदानो व्यानस्तथैव च ॥ ५६॥ नागः कूर्मः कृकरको देवदत्तो धनञ्जयः । प्राणाद्याः पञ्च
    विख्याता नागाद्याः पञ्च वायवः ॥ ५७॥ एते नाडीसहस्रेषु वर्तन्ते जीवरूपिणः । प्राणापानवशो जीवो ह्यधश्चोर्ध्वं
    प्रधावति ॥ ५८॥ वामदक्षिणमार्गेण चञ्चलत्वान्न दृश्यते । आक्षिप्तो भुजदण्डेन यथोच्चलति कन्दुकः ॥ ५९॥
    प्राणापानसमाक्षिप्तस्तद्वज्जीवो न विश्रमेत् । अपानात्कर्षति प्राणोऽपानः प्राणाच्च कर्षति ॥ ६०॥ खगरज्जुवदित्येतद्यो
    जानाति स योगवित् । हकारेण बहिर्याति सकारेण विशेत्पुनः ॥ ६१॥ हंसहंसेत्यमं मन्त्रं जीवो जपति सर्वदा
    । शतानि षट्दिवारात्रं सहस्राणेकविंशतिः ॥ ६२॥ एतन्सङ्ख्यान्वितं मन्त्रं जीवो जपति सर्वदा । अजपा नाम
    गायत्री योगिनां मोक्षदा सदा ॥ ६३॥ अस्याः सङ्कल्पमात्रेण नरः पापैः प्रमुच्यते । अनया सदृशी विद्या अनया
    सदृशो जपः ॥ ६४॥ अनया सदृशं पुण्यं न भूतं न भविष्यति । येन मार्गेण गन्तव्यं ब्रह्मस्थानं निरामयम् ॥
    ६५॥ मुखेनाच्छाद्य तद्द्वारं प्रसुप्ता परमेश्वरी । प्रबुद्धा वह्नियोगेन मनसा मरुता सह ॥ ६६॥ सूचिवद्गुणमादाय
    व्रजत्यूर्ध्वं सुषुम्नया । उद्घाटयेत्कपाटं तु यथा कुञ्चिकया हठात् ॥ ६७॥ कुण्डलिन्या तया योगी मोक्षद्वारं
    विभेदयेत् ॥ ६८॥ कृत्वा सम्पुटितौ करौ दृढतरं बध्वाथ पद्मासनम् । गाढं वक्षसि सन्निधाय चुबुकं ध्यानं
    च तच्चेतसि ॥ वारंवारममपातमूर्ध्वमनिलं प्रोच्चारयन्पूरितम् । मुञ्चन्प्राणमुपैति बोधमतुलं शक्तिप्रभावान्नरः
    ॥ ६९॥ पद्मासनस्थितो योगी नाडीद्वारेषु पूरयन् । मारुतं कुम्भयन्यस्तु स मुक्तो नात्र संशयः ॥ ७०॥ अङ्गानां
    मर्दनं कृत्वा श्रमजातेन वारिणा । कट्वम्ललवणत्यागी क्षीरपानरतः सुखी ॥ ७१॥ ब्रह्मचारी मिताहारी योगी
    योगपरायणः । अब्दादूर्ध्वं भवेत्सिद्धो नात्र कार्यां विचारणा ॥ ७२॥ कन्दोर्ध्वकुण्डली शक्तिः स योगी
    सिद्धिभाजनम् । अपानप्राणयोरैक्यं क्षयन्मूत्रपुरीषयोः ॥ ७३॥ युवा भवति वृद्धोऽपि सततं मूलबन्धनात् ।
    पार्ष्णिभागेन सम्पीड्य योनिमाकुञ्चयेद्गुदम् ॥ ७४॥ अपानमूर्ध्वमुत्कृष्य मूलबन्धोऽयमुच्यते । उड्याणं
    कुरुते यस्मादविश्रान्तमहाखगः ॥ ७५॥ उड्डियाणं तदेव स्यात्तत्र बन्धो विधीयते । उदरे पश्चिमं ताणं नाभेरूर्ध्वं
    तु कारयेत् ॥ ७६॥ उड्डियाणोऽप्ययं बन्धो मृत्युमातङ्गकेसरी । बध्नाति हि शिरोजातमधोगामिनभोजलम् ॥ ७७॥
    ततो जालन्धरो बन्धः कर्मदुःखौघनाशनः । जालन्धरे कृते बन्धे कर्णसंकोचलक्षणे ॥ ७८॥ न पीयूषं पतत्यग्नौ
    न च वायुः प्रधावति । कपालकुहरे जिह्वा प्रविष्टा विपरीतगा ॥ ७९॥ भ्रुवोरन्तर्गता दृष्टिर्मुद्रा भवति
    खेचरी । न रोगो मरणं तस्य न निद्रा न क्षुधा तृषा ॥ ८०॥ न च मूर्च्छा भवेत्तस्य यो मुद्रां वेत्ति खेचरीम्
    । पीड्यते न च रोगेण लिप्यते न च कर्मणा ॥ ८१॥ बध्यते न च कालेन यस्य मुद्रस्ति खेचरी । चित्तं चरति खे
    यस्माज्जिह्वा भवति खेगता ॥ ८२॥ तेनैषा खेचरी नाम मुद्रा सिद्धनमस्कृता । खेचर्या मुद्रया यस्य विवरं
    लम्बिकोर्ध्वतः ॥ ८३॥ बिन्दुः क्षरति नो यस्य कामिन्यालिङ्गितस्य च । यावद्बिन्दुः स्थितो देहे तावन्मृत्युभयं
    कुतः ॥ ८४॥ यावद्बद्धा नभोमुद्रा तावद्बिन्दुर्न गच्छति । गलितोऽपि यदा बिन्दुः सम्प्राप्तो योनिमण्डले
    ॥ ८५॥ व्रजत्यूर्ध्वं हठाच्छक्त्या निबद्धो योनिमुद्रया । स एव द्विविधो बिन्दुः पाण्डरो लोहितस्तथा ॥
    ८६॥ पाण्डरं शुक्रमित्याहुर्लोहिताख्यं महारजः । विद्रुमद्रुमसंकाशं योनिस्थाने स्थितं रजः ॥ ८७॥ शशिस्थाने
    वसेद्बिन्दुःस्तयोरैक्यं सुदुर्लभम् । बिन्दुः शिवो रजः शक्तिर्बिन्दुरिन्दू रजो रविः ॥ ८८॥ उभयओः सङ्गमादेव
    प्राप्यते परमं वपुः । वायुना शक्तिचालेन प्रेरितं खे यथा रजः ॥ ८९॥ रविणैकत्वमायाति भवेद्दिव्यं वपुस्तदा
    । शुक्लं चन्द्रेण संयुक्तं रजः सूर्यसमन्वितम् ॥ ९०॥ द्वयोः समरसीभावं यो जानाति स योगवित् । शोधनं मलजालानां
    घटनं चन्द्रसूर्ययोः ॥ ९१॥ रसानां शोषणं सम्यङ्महामुद्राभिधीयते ॥ ९२॥ वक्षोन्यस्तहनुर्निपीड्य सुषिरं
    योनेश्च वामाङ्घ्रिणा हस्ताभ्यामनुधारयन्प्रविततं पादं तथा दक्षिणम् ॥ आपूर्य श्वसनेन कुक्षियुगलं बध्वा
    शनैरेचये
