id: purandarakritamskandastotram
category: stotram
name:
  english: purandarakritamskandastotram
  devanagari: पुरन्दरकृतंस्कन्दस्तोत्रम्
content:
  english: purandarakritam skandastotram brahmadattavarah skanda tvayayam mahisho hatah devastrinamaya
    yasya babhuvurjayatam vara so'yam tvaya mahabaho shamito devakantakah || 73|| shatam mahishatulyanam
    danavanam tvaya rane | nihatam devashatrunam yairvayam purvatapitah || 74|| tavakairbhakshitashcanye
    danavah shatasanghashah | ajeyastvam rane'rinamumapatiriva prabhuh || 75|| etatte prathamam deva khyatam
    karma bhavishyati trishu lokeshu kirtishca tavakshayya bhavishyati vashagashca bhavishyanti surastava
    suratmaja || 76|| iti mahabharate aranyaparvani 221 adhyayantargatam purandarakritam skandastotram
    sampurnam | mahabharata | aranyakaparva | adhyaya 221
  devanagari: पुरन्दरकृतं स्कन्दस्तोत्रम् ब्रह्मदत्तवरः स्कन्द त्वयायं महिषो हतः देवास्तृणमया यस्य बभूवुर्जयतां
    वर सोऽयं त्वया महाबाहो शमितो देवकण्टकः ॥ ७३॥ शतं महिषतुल्यानां दानवानां त्वया रणे । निहतं देवशत्रूणां
    यैर्वयं पूर्वतापिताः ॥ ७४॥ तावकैर्भक्षिताश्चान्ये दानवाः शतसङ्घशः । अजेयस्त्वं रणेऽरीणामुमापतिरिव
    प्रभुः ॥ ७५॥ एतत्ते प्रथमं देव ख्यातं कर्म भविष्यति त्रिषु लोकेषु कीर्तिश्च तवाक्षय्या भविष्यति वशगाश्च
    भविष्यन्ति सुरास्तव सुरात्मज ॥ ७६॥ इति महाभारते आरण्यपर्वणि २२१ अध्यायान्तर्गतं पुरन्दरकृतं स्कन्दस्तोत्रं
    सम्पूर्णम् । महाभारत । आरण्यकपर्व । अध्याय २२१
meaning: {}
