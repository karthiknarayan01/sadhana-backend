id: priyam-bharatam
category: stotram
name:
  english: Priyam Bharatam
content:
  english: prakritya suramyam vishalam prakamam sarittaraharaih lalamam nikamam | himadrirlalate pade
    caiva sindhuh priyam bharatam sarvada darshaniyam || || dhananam nidhanam dharayam pradhanam idam
    bharatam devalokena tulyam | yasho yasya shubhram videsheshu gitam priyam bharatam tat sada pujaniyam
    || || aneke pradeshah aneke ca veshah anekani rupani bhasha anekah | param yatra sarve vayam bharatiyah
    priyam bharatam tat sada rakshaniyam || || vayam bharatiyah svadesham namamah param dharmamekam sada
    manayamah | tadartham dhanam jivanam carpayama priyam bharatam me sada vandaniyam ||
  devanagari: प्रकृत्या सुरम्यं विशालं प्रकामं सरित्तारहारैः ललामं निकामम् । हिमाद्रिर्ललाटे पदे चैव सिन्धुः
    प्रियं भारतं सर्वदा दर्शनीयम् ॥ ॥ धनानां निधानं धरायां प्रधानं इदं भारतं देवलोकेन तुल्यम् । यशो यस्य
    शुभ्रं विदेशेषु गीतं प्रियं भारतं तत् सदा पूजनीयम् ॥ ॥ अनेके प्रदेशाः अनेके च वेषाः अनेकानि रुपाणि
    भाषा अनेकाः । परं यत्र सर्वे वयं भारतीयाः प्रियं भारतं तत् सदा रक्षणीयम् ॥ ॥ वयं भारतीयाः स्वदेशं
    नमामः परं धर्ममेकं सदा मानयामः । तदर्थं धनं जीवनं चार्पयाम प्रियं भारतं मे सदा वन्दनीयम् ॥
