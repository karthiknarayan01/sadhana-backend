id: hariharaputra108stotra
category: stotram
name:
  english: hariharaputra108stotra
  devanagari: हरिहरपुत्र१०८स्तोत्र
content:
  english: ghritamadhupatram bibhratam hastapadmaih hariharasutamide cakramantratmamurtim || om | mahashasta
    vishvashasta lokashasta tathaiva ca | dharmashasta vedashasta kalashasta gajadhipah || 1|| gajarudho
    ganadhyaksho vyaghrarudho mahadyutih | goptagirvanasamsevyo gatatanko ganagranih || 2|| rigvedarupo
    nakshatram candrarupo balahakah | durvashyamo maharupah kruradrishtiranamayah || 3|| trinetra utpalakarah
    kalahanta naradhipah | khandendumauḻitanayah kalharakusumapriyah || 4|| madano madhavasuto mandarakusumarcitah
    | mahabalo mahotsaho mahapapavinashanah || 5|| mahashuro mahadhiro mahasarpavibhushanah | asihastah
    sharadharo halahaladharatmajah || 6|| arjunesho'gninayanashcanangamadanaturah | dushtagrahadhipah
    shridah shishtarakshanadikshitah || 7|| kasturitilako rajashekharo rajasattamah | rajarajarcito vishnuputro
    vanajanadhipah || 8|| varcaskarovararucirvarado vayuvahanah | vajrakayah khadgapanirvajrahasto baloddhatah
    || 9|| trilokajnashcatibalah pushkalo vrittapavanah | purnadhavah pushkaleshah pashahasto bhayapahah
    || 10|| phatkararupah papaghnah pashandarudhirashanah | pancapandavasantrata parapancaksharashritah
    || 11|| pancavaktrasutah pujyah panditah parameshvarah | bhavatapaprashamano bhaktabhishtapradayakah
    || 12|| kavih kavinamadhipah kripaḻuh kleshanashanah | samo'rupashca senanirbhaktasampatpradayakah
    || 13|| vyaghracarmadharah shuli kapali venuvadanah | kambukanthah kalaravah kiritadivibhushanah ||
    14|| dhurjatirviranilayo viro virenduvanditah | vishvarupo vrishapatirvividharthaphalapradah || 15||
    dirghanaso mahabahushcaturbahurjatadharah | sanakadimunishreshthastutyo hariharatmajah || 16|| iti
    shri hariharaputrashtottarashatanamastotram sampurnam ||
  devanagari: घृतमधुपात्रं बिभ्रतं हस्तपद्मैः हरिहरसुतमीडे चक्रमन्त्रात्ममूर्तिम् ॥ ॐ । महाशास्ता विश्वशास्ता
    लोकशास्ता तथैव च । धर्मशास्ता वेदशास्ता कालशस्ता गजाधिपः ॥ १॥ गजारूढो गणाध्यक्षो व्याघ्रारूढो महद्युतिः
    । गोप्तागीर्वाणसंसेव्यो गतातङ्को गणाग्रणीः ॥ २॥ ऋग्वेदरूपो नक्षत्रं चन्द्ररूपो बलाहकः । दूर्वाश्यामो
    महारूपः क्रूरदृष्टिरनामयः ॥ ३॥ त्रिनेत्र उत्पलकरः कालहन्ता नराधिपः । खण्डेन्दुमौळितनयः कल्हारकुसुमप्रियः
    ॥ ४॥ मदनो माधवसुतो मन्दारकुसुमर्चितः । महाबलो महोत्साहो महापापविनाशनः ॥ ५॥ महाशूरो महाधीरो महासर्पविभूषणः
    । असिहस्तः शरधरो हालाहलधरात्मजः ॥ ६॥ अर्जुनेशोऽग्निनयनश्चानङ्गमदनातुरः । दुष्टग्रहाधिपः श्रीदः शिष्टरक्षणदीक्षितः
    ॥ ७॥ कस्तूरीतिलको राजशेखरो राजसत्तमः । राजराजार्चितो विष्णुपुत्रो वनजनाधिपः ॥ ८॥ वर्चस्करोवररुचिर्वरदो
    वायुवाहनः । वज्रकायः खड्गपाणिर्वज्रहस्तो बलोद्धतः ॥ ९॥ त्रिलोकज्ञश्चातिबलः पुष्कलो वृत्तपावनः । पूर्णाधवः
    पुष्कलेशः पाशहस्तो भयापहः ॥ १०॥ फट्काररूपः पापघ्नः पाषण्डरुधिराशनः । पञ्चपाण्डवसन्त्राता परपञ्चाक्षराश्रितः
    ॥ ११॥ पञ्चवक्त्रसुतः पूज्यः पण्डितः परमेश्वरः । भवतापप्रशमनो भक्ताभीष्टप्रदायकः ॥ १२॥ कविः कवीनामधिपः
    कृपाळुः क्लेशनाशनः । समोऽरूपश्च सेनानिर्भक्तसम्पत्प्रदायकः ॥ १३॥ व्याघ्रचर्मधरः शूली कपाली वेणुवादनः
    । कम्बुकण्ठः कलरवः किरीटादिविभूषणः ॥ १४॥ धूर्जटिर्वीरनिलयो वीरो वीरेन्दुवन्दितः । विश्वरूपो वृषपतिर्विविधार्थफलप्रदः
    ॥ १५॥ दीर्घनासो महाबाहुश्चतुर्बाहुर्जटाधरः । सनकादिमुनिश्रेष्ठस्तुत्यो हरिहरात्मजः ॥ १६॥ इति श्री
    हरिहरपुत्राष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
