id: nava-graha-stotram
category: stotram
name:
  english: Nava Graha Stotram
content:
  english: navagraha dhyana shlokam adityaya ca somaya mangalaya budhaya ca | guru shukra shanibhyashca
    rahave ketave namah || ravih japakusuma sankasham kashyapeyam mahadyutim | tamo'rim sarva papaghnam
    pranatosmi divakaram || candrah dadhishankha tusharabham kshirarnava samudbhavam kshirodarnava sambhavam
    | namami shashinam somam shambho rmakuta bhushanam || kujah dharani garbha sambhutam vidyutkanti samaprabham
    | kumaram shaktihastam tam kujam pranamamyaham || budhah priyangu kalikashyamam rupena pratimam budham
    | saumyam saumya gunopetam tam budham pranamamyaham || guruh devanam ca rishinam ca gurum kancanasannibham
    | buddhimantam trilokesham tam namami brihaspatim || shukrah himakunda mrinalabham daityanam paramam
    gurum | sarvashastra pravaktaram bhargavam pranamamyaham || shanih nilanjana samabhasam raviputram
    yamagrajam | chaya martanda sambhutam tam namami shanaishcaram || rahuh ardhakayam mahaviram candraditya
    vimardhanam | simhika garbha sambhutam tam rahum pranamamyaham || ketuh palasha pushpa sankasham tarakagrahamastakam
    | raudram raudratmakam ghoram tam ketum pranamamyaham || phalashrutih iti vyasa mukhodgitam yah pathetsu
    samahitah | diva va yadi va ratrau vighnashanti nashanam | aishvaryamatulam teshamarogyam pushti vardhanam
    || grahanakshatrajah pidastaskaragni samudbhavah | tassarvah prashamam yanti vyaso brute na samshayah
    || iti vyasa viracitam navagraha stotram sampurnam |
  devanagari: नवग्रह ध्यान श्लोकम् आदित्याय च सोमाय मङ्गलाय बुधाय च । गुरु शुक्र शनिभ्यश्च राहवे केतवे
    नमः ॥ रविः जपाकुसुम सङ्काशं काश्यपेयं महाद्युतिम् । तमोऽरिं सर्व पापघ्नं प्रणतोस्मि दिवाकरम् ॥ चन्द्रः
    दधिशङ्ख तुषाराभं क्षीरार्णव समुद्भवम् क्षीरोदार्णव सम्भवम् । नमामि शशिनं सोमं शम्भो र्मकुट भूषणम्
    ॥ कुजः धरणी गर्भ सम्भूतं विद्युत्कान्ति समप्रभम् । कुमारं शक्तिहस्तं तं कुजं प्रणमाम्यहम् ॥ बुधः प्रियङ्गु
    कलिकाश्यामं रूपेणा प्रतिमं बुधम् । सौम्यं सौम्य गुणोपेतं तं बुधं प्रणमाम्यहम् ॥ गुरुः देवानां च ऋषीणां
    च गुरुं काञ्चनसन्निभम् । बुद्धिमन्तं त्रिलोकेशं तं नमामि बृहस्पतिम् ॥ शुक्रः हिमकुन्द मृणालाभं दैत्यानं
    परमं गुरुम् । सर्वशास्त्र प्रवक्तारं भार्गवं प्रणमाम्यहम् ॥ शनिः नीलाञ्जन समाभासं रविपुत्रं यमाग्रजम्
    । छाया मार्ताण्ड सम्भूतं तं नमामि शनैश्चरम् ॥ राहुः अर्धकायं महावीरं चन्द्रादित्य विमर्धनम् । सिंहिका
    गर्भ सम्भूतं तं राहुं प्रणमाम्यहम् ॥ केतुः पलाश पुष्प सङ्काशं तारकाग्रहमस्तकम् । रौद्रं रौद्रात्मकं
    घोरं तं केतुं प्रणमाम्यहम् ॥ फलश्रुतिः इति व्यास मुखोद्गीतं यः पठेत्सु समाहितः । दिवा वा यदि वा रात्रौ
    विघ्नशान्ति नाशनम् । ऐश्वर्यमतुलं तेषामारोग्यं पुष्टि वर्धनम् ॥ ग्रहनक्षत्रजाः पीडास्तस्कराग्नि समुद्भवाः
    । तास्सर्वाः प्रशमं यान्ति व्यासो ब्रूते न संशयः ॥ इति व्यास विरचितं नवग्रह स्तोत्रं सम्पूर्णम् ।
