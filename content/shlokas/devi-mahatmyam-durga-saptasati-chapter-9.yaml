id: devi-mahatmyam-durga-saptasati-chapter-9
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 9
content:
  english: nishumbhavadhonama navamodhyayah || dhyanam om bandhuka kancananibham rucirakshamalam pashankushau
    ca varadam nijabahudandaih | bibhranamindu shakalabharanam trinetram ardhambikeshamanisham vapurashrayami
    || rajauvaca|| || vicitramidamakhyatam bhagavan bhavata mama | devyashcaritamahatmyam rakta bijavadhashritam
    || || bhuyashcecchamyaham shrotum raktabije nipatite | cakara shumbho yatkarma nishumbhashcatikopanah
    || || cakara kopamatulam raktabije nipatite| shumbhasuro nishumbhashca hateshvanyeshu cahave || ||
    hanyamanam mahasainyam vilokyamarshamudvahan| abhyadavannishumbo'tha mukhyayasura senaya || || tasyagratastatha
    prishthe parshvayoshca mahasurah sandashtaushthaputah kruddha hantum devimupayayuh || || ajagama mahaviryah
    shumbho'pi svabalairvritah| nihantum candikam kopatkritva yuddam tu matribhih || || tato yuddhamativasiddevya
    shumbhanishumbhayoh| sharavarshamativogram meghayoriva varshatoh || || cicchedastancharamstabhyam
    candika svasharotkaraih| tadayamasa cangeshu shastraughairasureshvarau || || nishumbho nishitam khadgam
    carma cadaya suprabham| atadayanmurdhni simham devya vahanamuttamam|| || tadite vahane devi kshura
    prenasimuttamam| shumbhasyashu ciccheda carma capyashta candrakam || || chinne carmani khadge ca shaktim
    cikshepa so'surah| tamapyasya dvidha cakre cakrenabhimukhagatam|| || kopadhmato nishumbho'tha shulam
    jagraha danavah| ayatam mushthipatena devi taccapyacurnayat|| || aviddhyatha gadam so'pi cikshepa
    candikam prati| sapi devyas trishulena bhinna bhasmatvamagata|| || tatah parashuhastam tamayantam
    daityapungavam| ahatya devi banaughairapatayata bhutale|| || tasminni patite bhumau nishumbhe bhimavikrame|
    bhrataryativa sankruddhah prayayau hantumambikam|| || sa rathasthastathatyucchai rgrihitaparamayudhaih|
    bhujairashtabhiratulai rvyapya shesham babhau nabhah|| || tamayantam samalokya devi shankhamavadayat|
    jyashabdam capi dhanusha shcakarativa duhsaham|| || purayamasa kakubho nijaghanta svanena ca| samastadaityasainyanam
    tejovadhavidhayina|| || tatah simho mahanadai styajitebhamahamadaih| purayamasa gaganam gam tathaiva
    disho dasha|| || tatah kali samutpatya gaganam kshmamatadayat| karabhyam tanninadena praksvanaste
    tirohitah|| || attattahasamashivam shivaduti cakara ha| vaih shabdairasurastresuh shumbhah kopam param
    yayau|| || duratmam stishta tishtheti vyaja harambika yada| tada jayetyabhihitam devairakasha samsthitaih||
    || shumbhenagatya ya shaktirmukta jvalatibhishana| ayanti vahnikutabha sa nirasta maholkaya|| || simhanadena
    shumbhasya vyaptam lokatrayantaram| nirghatanihsvano ghoro jitavanavanipate|| || shumbhamuktancharandevi
    shumbhastatprahitancharan| ciccheda svasharairugraih shatasho'tha sahasrashah|| || tatah sa candika
    kruddha shulenabhijaghana tam| sa tadabhi hato bhumau murchito nipapata ha|| || tato nishumbhah samprapya
    cetanamattakarmukah| ajaghana sharairdevim kalim kesarinam tatha|| || punashca kritva bahunamayutam
    danujeshvarah| cakrayudhena ditijashcadayamasa candikam|| || tato bhagavati kruddha durgadurgarti
    nashini| ciccheda devi cakrani svasharaih sayakamshca tan|| || tato nishumbho vegena gadamadaya candikam|
    abhyadhavata vai hantum daitya senasamavritah|| || tasyapatata evashu gadam ciccheda candika| khadgena
    shitadharena sa ca shulam samadade|| || shulahastam samayantam nishumbhamamarardanam| hridi vivyadha
    shulena vegaviddhena candika|| || khinnasya tasya shulena hridayannihsrito h| mahabalo mahaviryastishtheti
    purusho vadan|| || tasya nishkramato devi prahasya svanavattatah| shirashciccheda khadgena tato'savapatadbhuvi||
    || tatah simhashca khadogra damshtrakshunnashirodharan| asuram stamstatha kali shivaduti tathaparan||
    || kaumari shaktinirbhinnah kecinneshurmahasurah brahmani mantraputena toyenanye nirakritah|| || maheshvari
    trishulena bhinnah petustathapare| varahitundaghatena keciccurni krita bhuvi|| || khandam khandam
    ca cakrena vaishnavya danavah kritah| vajrena caindri hastagra vimuktena tathapare|| || kecidvineshurasurah
    kecinnashtamahahavat| bhakshitashcapare kalishivadhuti mrigadhipaih|| || || svasti shri markandeya
    purane savarnike manvantare devi mahatmye nishumbhavadhonama navamodhyaya samaptam || ahuti om klim
    jayanti sangayai sashaktikayai saparivarayai savahanayai mahahutim samarpayami namah svaha ||
  devanagari: निशुम्भवधोनाम नवमोध्यायः ॥ ध्यानं ॐ बन्धूक काञ्चननिभं रुचिराक्षमालां पाशाङ्कुशौ च वरदां
    निजबाहुदण्डैः । बिभ्राणमिन्दु शकलाभरणां त्रिनेत्रां अर्धाम्बिकेशमनिशं वपुराश्रयामि ॥ राजौवाच॥ ॥ विचित्रमिदमाख्यातं
    भगवन् भवता मम । देव्याश्चरितमाहात्म्यं रक्त बीजवधाश्रितम् ॥ ॥ भूयश्चेच्छाम्यहं श्रोतुं रक्तबीजे निपातिते
    । चकार शुम्भो यत्कर्म निशुम्भश्चातिकोपनः ॥ ॥ चकार कोपमतुलं रक्तबीजे निपातिते। शुम्भासुरो निशुम्भश्च
    हतेष्वन्येषु चाहवे ॥ ॥ हन्यमानं महासैन्यं विलोक्यामर्षमुद्वहन्। अभ्यदावन्निशुम्बोऽथ मुख्ययासुर सेनया
    ॥ ॥ तस्याग्रतस्तथा पृष्ठे पार्श्वयोश्च महासुराः सन्दष्टौष्ठपुटाः क्रुद्धा हन्तुं देवीमुपाययुः ॥ ॥
    आजगाम महावीर्यः शुम्भोऽपि स्वबलैर्वृतः। निहन्तुं चण्डिकां कोपात्कृत्वा युद्दं तु मातृभिः ॥ ॥ ततो युद्धमतीवासीद्देव्या
    शुम्भनिशुम्भयोः। शरवर्षमतीवोग्रं मेघयोरिव वर्षतोः ॥ ॥ चिच्छेदास्ताञ्छरांस्ताभ्यां चण्डिका स्वशरोत्करैः।
    ताडयामास चाङ्गेषु शस्त्रौघैरसुरेश्वरौ ॥ ॥ निशुम्भो निशितं खड्गं चर्म चादाय सुप्रभम्। अताडयन्मूर्ध्नि
    सिंहं देव्या वाहनमुत्तमम्॥ ॥ ताडिते वाहने देवी क्षुर प्रेणासिमुत्तमम्। शुम्भस्याशु चिच्छेद चर्म चाप्यष्ट
    चन्द्रकम् ॥ ॥ छिन्ने चर्मणि खड्गे च शक्तिं चिक्षेप सोऽसुरः। तामप्यस्य द्विधा चक्रे चक्रेणाभिमुखागताम्॥
    ॥ कोपाध्मातो निशुम्भोऽथ शूलं जग्राह दानवः। आयातं मुष्ठिपातेन देवी तच्चाप्यचूर्णयत्॥ ॥ आविद्ध्याथ गदां
    सोऽपि चिक्षेप चण्डिकां प्रति। सापि देव्यास् त्रिशूलेन भिन्ना भस्मत्वमागता॥ ॥ ततः परशुहस्तं तमायान्तं
    दैत्यपुङ्गवं। आहत्य देवी बाणौघैरपातयत भूतले॥ ॥ तस्मिन्नि पतिते भूमौ निशुम्भे भीमविक्रमे। भ्रातर्यतीव
    सङ्क्रुद्धः प्रययौ हन्तुमम्बिकाम्॥ ॥ स रथस्थस्तथात्युच्छै र्गृहीतपरमायुधैः। भुजैरष्टाभिरतुलै र्व्याप्या
    शेषं बभौ नभः॥ ॥ तमायान्तं समालोक्य देवी शङ्खमवादयत्। ज्याशब्दं चापि धनुष श्चकारातीव दुःसहम्॥ ॥ पूरयामास
    ककुभो निजघण्टा स्वनेन च। समस्तदैत्यसैन्यानां तेजोवधविधायिना॥ ॥ ततः सिंहो महानादै स्त्याजितेभमहामदैः।
    पुरयामास गगनं गां तथैव दिशो दश॥ ॥ ततः काली समुत्पत्य गगनं क्ष्मामताडयत्। कराभ्यां तन्निनादेन प्राक्स्वनास्ते
    तिरोहिताः॥ ॥ अट्टाट्टहासमशिवं शिवदूती चकार ह। वैः शब्दैरसुरास्त्रेसुः शुम्भः कोपं परं ययौ॥ ॥ दुरात्मं
    स्तिष्ट तिष्ठेति व्याज हाराम्बिका यदा। तदा जयेत्यभिहितं देवैराकाश संस्थितैः॥ ॥ शुम्भेनागत्य या शक्तिर्मुक्ता
    ज्वालातिभीषणा। आयान्ती वह्निकूटाभा सा निरस्ता महोल्कया॥ ॥ सिंहनादेन शुम्भस्य व्याप्तं लोकत्रयान्तरम्।
    निर्घातनिःस्वनो घोरो जितवानवनीपते॥ ॥ शुम्भमुक्ताञ्छरान्देवी शुम्भस्तत्प्रहिताञ्छरान्। चिच्छेद स्वशरैरुग्रैः
    शतशोऽथ सहस्रशः॥ ॥ ततः सा चण्डिका क्रुद्धा शूलेनाभिजघान तम्। स तदाभि हतो भूमौ मूर्छितो निपपात ह॥ ॥
    ततो निशुम्भः सम्प्राप्य चेतनामात्तकार्मुकः। आजघान शरैर्देवीं कालीं केसरिणं तथा॥ ॥ पुनश्च कृत्वा बाहुनामयुतं
    दनुजेश्वरः। चक्रायुधेन दितिजश्चादयामास चण्डिकाम्॥ ॥ ततो भगवती क्रुद्धा दुर्गादुर्गार्ति नाशिनी। चिच्छेद
    देवी चक्राणि स्वशरैः सायकांश्च तान्॥ ॥ ततो निशुम्भो वेगेन गदामादाय चण्डिकाम्। अभ्यधावत वै हन्तुं दैत्य
    सेनासमावृतः॥ ॥ तस्यापतत एवाशु गदां चिच्छेद चण्डिका। खड्गेन शितधारेण स च शूलं समाददे॥ ॥ शूलहस्तं समायान्तं
    निशुम्भममरार्दनम्। हृदि विव्याध शूलेन वेगाविद्धेन चण्डिका॥ ॥ खिन्नस्य तस्य शूलेन हृदयान्निःसृतो ः।
    महाबलो महावीर्यस्तिष्ठेति पुरुषो वदन्॥ ॥ तस्य निष्क्रामतो देवी प्रहस्य स्वनवत्ततः। शिरश्चिच्छेद खड्गेन
    ततोऽसावपतद्भुवि॥ ॥ ततः सिंहश्च खादोग्र दंष्ट्राक्षुण्णशिरोधरान्। असुरां स्तांस्तथा काली शिवदूती तथापरान्॥
    ॥ कौमारी शक्तिनिर्भिन्नाः केचिन्नेशुर्महासुराः ब्रह्माणी मन्त्रपूतेन तोयेनान्ये निराकृताः॥ ॥ माहेश्वरी
    त्रिशूलेन भिन्नाः पेतुस्तथापरे। वाराहीतुण्डघातेन केचिच्चूर्णी कृता भुवि॥ ॥ खण्डं खण्डं च चक्रेण वैष्णव्या
    दानवाः कृताः। वज्रेण चैन्द्री हस्ताग्र विमुक्तेन तथापरे॥ ॥ केचिद्विनेशुरसुराः केचिन्नष्टामहाहवात्।
    भक्षिताश्चापरे कालीशिवधूती मृगाधिपैः॥ ॥ ॥ स्वस्ति श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि
    महत्म्ये निशुम्भवधोनाम नवमोध्याय समाप्तम् ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै
    महाहुतिं समर्पयामि नमः स्वाहा ॥
