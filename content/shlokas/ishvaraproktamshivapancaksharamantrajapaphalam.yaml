id: ishvaraproktamshivapancaksharamantrajapaphalam
category: mantra
name:
  english: ishvaraproktamshivapancaksharamantrajapaphalam
  devanagari: ईश्वरप्रोक्तंशिवपन्चाक्षरमन्त्रजपफलम्
content:
  english: pancaksharam paramapavanametadeva rudratvadayi girije virajo bhavetsah || 26|| veda yajna vrata
    ye shikhimukhavihitam homajalam ca kritsnam kanya prithvi ca vani dvijaganakalitamapyadhanyo bhaveta
    | shripancaksharajapanojjhitamatiryastasya kim sevanaih japyam tvetadanukshanam dvijaganaih pancaksharam
    me param || 27|| pancaksharam pavanamuccarantah patim pashunam hridi bhavayantah | shantah kritantantakamarcayantah
    kshetreshu tishthanti sadaiva santah || 30|| pancaksharavrittikritam ksharedagham ksharam bhuvam tyajya
    tadaksharam vrajet | na yaksharakshahprabhavam bhayam bhavet tryakshaprasadallabhate phalakshayam
    || 31|| pranavadyantamume yatirjapet niyatirvai shruticodita mrisha na | tava bijamume vidharayan
    japatam japyamidam phalayate || 32|| punyani vardhayati papatatim dhunoti mukhyavimuktasadane vasatim
    karoti | pancaksharam mama manum japati sthiranta
  devanagari: पञ्चाक्षरं परमपावनमेतदेव रुद्रत्वदायि गिरिजे विरजो भवेत्सः ॥ २६॥ वेदा यज्ञा व्रता ये शिखिमुखविहितं
    होमजालं च कृत्स्नं कन्या पृथ्वी च वाणी द्विजगणकलितामप्यधन्यो भवेत । श्रीपञ्चाक्षरजापनोज्झितमतिर्यस्तस्य
    किं सेवनैः जाप्यं त्वेतदनुक्षणं द्विजगणैः पञ्चाक्षरं मे परम् ॥ २७॥ पञ्चाक्षरं पावनमुच्चरन्तः पतिं
    पशूनां हृदि भावयन्तः । शान्ताः कृतान्तान्तकमर्चयन्तः क्षेत्रेषु तिष्ठन्ति सदैव सन्तः ॥ ३०॥ पञ्चाक्षरावृत्तिकृतां
    क्षरेदघं क्षारं भुवं त्यज्य तदक्षरं व्रजेत् । न यक्षरक्षःप्रभवं भयं भवेत् त्र्यक्षप्रसादल्लभते फलाक्षयम्
    ॥ ३१॥ प्रणवाद्यन्तमुमे यतिर्जपेत् नियतिर्वै श्रुतिचोदिता मृषा न । तव बीजमुमे विधारयन् जपतां जाप्यमिदं
    फलायते ॥ ३२॥ पुण्यानि वर्धयति पापततिं धुनोति मुख्याविमुक्तसदने वसतिं करोति । पञ्चाक्षरं मम मनुं जपति
    स्थिरान्त
