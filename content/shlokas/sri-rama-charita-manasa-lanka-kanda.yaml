    नृप अगनित बहु बारा ॥ तासु गर्ब जेहि देखत भागा। सो नर क्यों दससीस अभागा ॥ राम मनुज कस रे सठ बङ्गा।
    धन्वी कामु नदी पुनि गङ्गा ॥ पसु सुरधेनु कल्पतरु रूखा। अन्न दान अरु रस पीयूषा ॥ बैनतेय खग अहि सहसानन।
    चिन्तामनि पुनि उपल दसानन ॥ सुनु मतिमन्द लोक बैकुण्ठा। लाभ कि रघुपति भगति अकुण्ठा ॥ दो सेन सहित तब
    मान मथि बन उजारि पुर जारि ॥ कस रे सठ हनुमान कपि गयु जो तव सुत मारि ॥ ॥ सुनु रावन परिहरि चतुराई। भजसि
