id: kyts-4-3-apaan-tvemanthsaadayaami-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.3 Apaan Tvemanthsaadayaami - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande tritiyah prashnah shri gurubhyo namah
    | harih om || apa ntva jyotishi sadayamyapa 'yane sadayamyarnave sadane sida samudre sadane sida salile
    sadane sidapa nkshaye sidapagm sadhishi sidapa ntva sadane sadayamyapa ntva sadhasthe sadayamyapa
    ntva purishe sadayamyapa ntva yonau sadayamyapa ntva pathasi sadayami gayatri chanda pchando jagati
    chando pchandah panktishchandah || mpuro bhuvastasya prano bhauvayano vasantah pranayano gayatri vasanti
    gayatriyai gayatra ngayatradupagm shurupagm shostrivri ttrivrito rathantaragm rathantara dvasishtha
    rishih prajapati grihitaya tvaya ngrihnami prajabhyo ndakshina vishvakarma tasya mano vaishvakarmana
    ngrishmo manasastrishtuggraishmi trishtubha aidamaida tpancadashah pancadasha dbrihato bharadvaja
    rishih prajapati grihitaya tvaya mano grihnami prajabhyo grihnami prajabhyo dvishvavyacastasya cakshurvaishvavyacasam
    va~rshani cakshushani jagati varshi jagatya rikshamamrikshamacchukra dvishvamitra rishih prajapati
    grihitaya tvaya cakshurgrihnami prajabhya idamuttara thsuvastasya shrotragm sauvagm sharacchrautryanushtup
    charadyanushtubhah svaragg svaranmanthi manthina ekavigmsha ekavigmsha vai~rajajjamadagnir rishih
    prajapati grihitaya ngrihnami prajabhya iyamupari matistasyai vammati hemanto va nnidhanavannidhanavata
    agrayana a ttrinavatrayastrigmshau trinavatrayastrigmshabhyagm shakvararaivate sha shih prajapati
    grihitaya tvaya vaca ngrihnami prajabhyah || jamadagnirrishih prajapatigrihitaya va~santa ritunamagnirdevata
    brahma dravina ssa u pancadashavartani stryavirvayah kritamayana ssanaga rishirdakshina disha ngrishma
    ritunamindro devata ssa u saptadasha vartani ndakshinadvato vatah sanatana rishih pratici disham vi~shve
    deva devata vi ddravinagm saptadasha stoma ssa u vekavigm shavartani mpashcadvato vato 'habhuna rishirudici
    dishagm sharad mmitravarunau devata pushta ndravinamekavigmsha ssa u trinavavartani dvaya askando
    'yanamuttara dvato vatah pratna rishirurdhva dishagm hemantashishiravrituna mbrihaspatirdevata varco
    dravina ssa u trayastrigmshavartanih pashthavadvayo 'bhibhurayanam vi~shvagvato vatah suparna rishih
    pitarah pitamahah pare 'vare te nah pantu te no nbrahmannasmin kshatre mpurodhayamasmin karmannasya
    yo~nima sida saddhya | ukhyasya ketu 'ddhvaryu sadayatamiha tva || sve dakshe dakshapiteha sida devatra
    prithivi brihati rarana | svasastha tanuva sam vi~shasva pitevaidhi sunava a susheva ddhvaryu sadayatamiha
    tva || kulayini vasumati vayodha rayi nno vardha bahulagm suvira mbadhamana rayasposhe yajnapatimabhajanti
    suvardhehi yajamanaya poshamashvina 'ddhvaryu sadayatamiha tva || agneh purishamasi devayani ta ntva
    vishve abhi grinantu devah | stomaprishtha ghritavatiha sida prajavadasme dravina ''yajasvashvina
    'ddhvaryu sadayatamiha tva 'si prithivya nabhirvishtambhani dishamadhipatni bhuvananam | urmirdraphso
    apamasi vishvakarma ta rishirashvina 'ddhvaryu sadayatamiha tva ritubhih sajurvidhabhih sajurvasubhi
    tva vaishvanarayashvina 'ddhvaryu sadayatamiha tva mme pahi cakshurma urvya vi bhahi shrotra spinvaushadhirjinva
    dvipa tpahi catushpadava divo vrishtimeraya || tryavirvayastrishtu dvayo virat chandah pancavirvayo
    gayatri chandastrivathso vaya ushniha chanda sturyava dvayo brihati chanda uksha vayah satobrihati
    chanda rishabho vayah kakucchando dhenurvayo jagati chando vayah pankti shchando basto vayo vivala
    nchando vrishnirvayo vishala nchandah purusho vaya standra nchandah sigmho vaya shchadi shchando vishtabhom
    'dhipati shchandah kshatram nchando vishvakarma vayah parameshthi chando murdha vayah prajapati shchandah
    || gni avyathamanamishtaka yu~vam | prishthena dyavaprithivi antariksha nca vi badhatam || vishvakarma
    tva sadayatvantarikshasya prishthe vyacasvati mbhasvatigm surimatima ya dya mbhasya prithivimorvantariksha
    ndrigmhantariksha mma higmsi rvishvasmai pranayapanaya vyanayodanaya pratishthayai caritraya vayustva
    'bhi patu mahya svastya chardisha shantamena taya devataya ddhruva sida || rajnyasi praci dig viradasi
    dakshina di khsamradasi pratici dikh svaradasyudici digadhipatnyasi brihati digayurme pahi prana mme
    pahi cakshurme pahi shrotra mme pahi mano me jinva vaca mme pinva ''tmana mme pahi jyotirme yaccha
    || ma chandah prama chandah pratima chando 'srivi shchandah pankti shchanda ushniha chando brihati
    chando pchando virat chando gayatri chanda pchando jagati chandah prithivi chando 'ntariksha nchando
    dyau shchanda ssama shchando nakshatrani chando mana shchando vak chandah krishi shchando hiranya
    nchando gau shchando 'ja chando 'shva shchandah || agnirdevata vato devata suryo devata candrama devata
    vasavo devata rudra devata ''ditya devata vishve deva devata maruto devata brihaspati rdevatendro
    devata varuno devata murdha 'si dharuna yantryasi yamitrishe tvorje tva krishyai tva kshemaya tva
    yantri ra 'si dharani dhartryasi dharitryayushe tva varcase tvaujase tva balaya tva || dbhantah pancadasho
    vyoma saptadashah pratu rtirashtadasha stapo navadasho 'bhivarta ssavigmsho dharuna ekavigmsho varco
    ssambharanastrayovigmsho yonishcaturvigmsho garbhah pancavigmsha ojastrinavah kraturekatrigmshah pratishtha
    trayastrigmsho braddhnasya vishtapa ncatustrigmsho nakah shattrigmsho vivarto 'shtacatvarigmsho dhartrashcatushtomah
    || 'si dikshaya adhipatya thstoma indrasya bhago 'si vishnoradhipatya sstomo nricakshasa njanitragg
    spritagm saptadasha sstomo mitrasya bhago ndivo vrishtirvata ssprita ekavigmsha 'si pushna adhipatyamojah
    sprita rudranamadhipatya 'si marutamadhipatya sspritah pancavigmsha sstomo devasya saviturbhago 'si
    brihaspateradhipatyagm samicirdishah spritashcatushtoma 'syayavanamadhipatya 'stuvata praja adhiyanta
    prajapatiradhipatirasi ttisribhirastuvata brahmasrijyata brahmanaspati tpancabhirastuvata bhutanyasrijyanta
    bhutana thsaptabhirastuvata saptarshayo nnavabhirastuvata pitaro 'ditiradhipatnyasi rastuvata masa
    asrijyanta sam tpancadashabhirastuvata tpancadashabhirastuvata kshatramasrijyatendro 'dhipatirasi
    thsaptadashabhirastuvata pashavo 'srijyanta brihaspatiradhipati rastuvata shudraryavasrijyetamahoratre
    adhipatni astamekavigm shatya 'stuvataikashaphah pashavo 'srijyanta varuno 'dhipatirasi 'stuvata kshudrah
    pashavo 'srijyanta pusha 'dhipatirasi tpancavigmshatya 'stuvata 'srijyanta vayuradhipatirasi 'stuvata
    dyavaprithivi vyai va~savo rudra aditya anu vyaya nteshamadhipatyamasi 'srijyanta somo 'dhipatirasi
    dekatrigmshata 'stuvata praja asrijyanta yavana ttrayastrigmshata 'stuvata bhutanyashamya nprajapatih
    parameshthyadhipatirasit || iyameva sa ya prathama vyaucchadantarasya ncarati pravishta | vadhurjajana
    navagajjanitri traya ena mmahimanah sacante || chandasvati ushasa pepishane samanam yo~nimanu sancaranti
    | suryapatni vi caratah prajanati ketu nkrinvane ajara bhuriretasa || ritasya panthamanu tisra a 'gustrayo
    gharmaso anu jyotisha ''guh | prajameka rakshatyurjameka vratameka rakshati devayunam || catushtomo
    abhavadya turiya yajnasya pakshavrishayo bhavanti | gayatri 'bharannidam || pancabhirdhata vi dadhavidam
    ttasag svasrirajanaya tpancapanca | tasamu yanti prayavena panca nana rupani kratavo vasanah || trigmsha
    thsvasara upayanti nishkritagm samana mpratimuncamanah | stanvate kavayah prajanatirmaddhyechandasah
    pari yanti bhasvatih || jyotishmati prati muncate nabho ratri devi suryasya vratani | vi pashyanti
    pashavo jayamana nanarupa maturasya upasthe || ekashtaka tapasa tapyamana jajana garbha m | tena dasyun
    vyasahanta deva hanta mabhavacchacibhih || ananujamanuja va~dantyanviccha etat | bhuyasa masya sumatau
    yatha yuyamanya vo anyamati ma pra yukta || abhunmama sumatau vishvaveda ashta pratishthamavidaddhi
    gadham | bhuyasamasya sumatau yatha yuyamanya vo anyamati ma prayukta || panca vyushtiranu panca doha
    ga 'nu panca | panca dishah pancadashena klipta || ritasya garbhah prathama vyushushyapameka mahimana
    mbibharti | suryasyaika carati nishkriteshu gharmasyaika savitaika nni yacchati || ya prathama vyauccha
    thsa dhenurabhavadyame | sa nah payasvati dhukshvottaramuttaragm sama shabha nabhasa jyotisha ''ga
    dvishvarupa shabaliragniketuh | samanamarthagg svapasyamana bibhrati jaramajara usha a nnetri janitri
    prajana m | eka sati bahudhosho vyucchasyaji njarayasi sarvamanyat || patnye kanna vigmshatishca npratyajatanjatavedo
    nudasva | asme didihi sumana aheda ntava syagm sharma ntrivarutha udbhit || sahasa jata npratyajatanjatavedo
    nudasva | adhi no bruhi sumanasyamano vayagg ssapatnan || catushcatvarigmsha sstomo varco dravinagm
    shodasha sstoma ojo dravina mprithivyah purishama syaphso nama | eva shchando variva shchandah shabhum
    shchandah paribhu shchanda acchacchando mana shchando vyaca shchanda ssindhu shchandah samudra ya~cchando
    viyacchando brihacchando rathantara nchando nikaya shchando vivadha shchando gira shchando bhraja
    shchandah sashtu pchandah kakucchanda strikakucchandah kavya padapankti shchando padapankti shchando
    'ksharapankti shchando vishtarapankti shchandah kshuro bhrijvanchandah pracchacchandah paksha shchanda
    eva shchando variva shchando vaya shchando vayaskricchando vishala nchando vishpardha shchanda shchadi
    shchando durohana strayastrigmshacca agnirvritrani janghana ddravinasyurvipanyaya shshukra ahutah
    || tvagm somasi satpatistvagm rajota vritraha | tva mbhadro asi kratuh || bhadra te agne svanika sadringghorasya
    sato vishunasya caruh | na ya tte shocistamasa varanta na dhvasmanastanuvi repa a dhuh || bhadra nte
    agne sahasinnanikamupaka a rocate suryasya | ddrishe dadrishe naktaya cidaru 'nikena suvidatro asme
    yashta devagm ayajishtha ssvasti | adabdho gopa uta nah paraspa agne ddidihi || svasti no divo agne
    prithivya vishvayurdhehi yajathaya deva | ya thsimahi divijata prashasta ntadasmasu dravina ndhehi
    citram || yatha hotarmanusho devatata yajnebhih suno sahaso yajasi | eva no adya samana samananu shannagna
    ushato yakshi devan || agnimide purohitam ya~jnasya devamritvija m | hotaragm ratnadhatamam || vrisha
    soma dyumagm asi vrisha deva vrishavratah | vrisha dharmani dadhishe || santapana idagm havirmarutastajjujushtana
    | yushmakoti rishadasah || yo no marto vasavo dur jighagmsat | druhah pasha mprati sa mucishta tapishthena
    tapasa hantana tam || sam va~thsarina marutah svarka urukshaya ssagana manusheshu | te npra muncantvagmhasa
    ssantapana madira madayishnavah || piprihi devagm ushato yavishtha vidvagm ritugmr ritupate yajeha
    | ye daivya ritvijastebhiragne tvagm hotrinamasyayajishthah || agne yadadya visho addhvarasya hotah
    pavaka shoce veshtvagm hi shoce veshtvagm hi yajva | rita yajasi mahina vi yadbhur havya vaha yavishtha
    ya te adya || agnina rayi tposhameva divedive | yashasam vi~ravattamam || gayasphano amivaha vasuvi
    tpushtivardhanah | sumitra ssoma no bhava || grihamedhasa a gata maruto ma 'pa bhutana | pramuncanto
    no agmhasah || purvibhirhi dadashima sharadbhirmaruto vayam | mahobhi shaninam || prabuddhniya irate
    vo mahagmsi pranamani prayajyavastiraddhvam | sahasriya mmaruto jushaddhvam || upa yameti yuvati |
    upa svainamaramatirva suyuh || imo agne vitatamani havya 'jasro vakshi devatatimaccha | prati na igm
    surabhini viyantu || kridam shshardho marutamanarvanagm ratheshubha kanva abhi pra gayata || atyaso
    na ye maruta ssvanco yakshadrisho na shubhayanta maryah shshishavo na shubhra vathsaso na prakridinah
    payodhah || praishamajmeshu vithureva rejate bhumiryameshu yaddha yunjate shubhe | te kridayo dhunayo
    bhrajadrishtaya mpanayanta dhutayah || upahvareshu yadaciddhvam tpatha | shcotanti kosha upa vo ratheshva
    ghritamukshata madhuvarnamarcate || agnimagnigm havimabhi ssada havanta vishpati mpurupriyam || tagm
    hi shashvanta idate sruca deva | agnigm havyaya vodhave || indra shshnathadvritra mindram vo~ vishvatasparindra
    havisha vavridhano vishvakarman || harih om || || krishna yajurvediya taittiriya samhitaya ncaturtha
    kande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे तृतीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अ॒पा न्त्वा॒ ज्योति॑षि सादयाम्य॒पा ऽय॑ने सादयाम्यर्ण॒वे सद॑ने सीद समु॒द्रे सद॑ने सीद सलि॒ले
    सद॑ने सीदा॒पा ङ्क्षये॑ सीदा॒पाग्ं सधि॑षि सीदा॒पा न्त्वा॒ सद॑ने सादयाम्य॒पा न्त्वा॑ स॒धस्थे॑ सादयाम्य॒पा
    न्त्वा॒ पुरी॑षे सादयाम्य॒पा न्त्वा॒ योनौ॑ सादयाम्य॒पा न्त्वा॒ पाथ॑सि सादयामि गाय॒त्री छन्द॑ प्छन्दो॒
    जग॑ती॒ छन्दो॑ प्छन्दः॑ प॒ङ्क्तिश्छन्दः॑ ॥ म्पु॒रो भुव॒स्तस्य॑ प्रा॒णो भौ॑वाय॒नो व॑स॒न्तः प्रा॑णाय॒नो
    गा॑य॒त्री वा॑स॒न्ती गा॑यत्रि॒यै गा॑य॒त्र ङ्गा॑य॒त्रादु॑पा॒ग्ं॒ शुरु॑पा॒ग्ं॒ शोस्त्रि॒वृ त्त्रि॒वृतो॑
    रथन्त॒रग्ं र॑थन्त॒रा द्वसि॑ष्ठ॒ ऋषिः॑ प्र॒जाप॑ति गृहीतया॒ त्वया ङ्गृ॑ह्णामि प्र॒जाभ्यो॒ न्द॑क्षि॒णा
    वि॒श्वक॑र्मा॒ तस्य॒ मनो॑ वैश्वकर्म॒ण ङ्ग्री॒ष्मो मा॑न॒सस्त्रि॒ष्टुग्ग्रै॒ष्मी त्रि॒ष्टुभ॑ ऐ॒डमै॒डा
    त्प॑ञ्चद॒शः प॑ञ्चद॒शा द्बृ॑ह॒तो भ॒रद्वा॑ज॒ ऋषिः॑ प्र॒जाप॑ति गृहीतया॒ त्वया॒ मनो॑ गृ॒ह्णा॒मि॒ प्र॒जाभ्यो॒
    गृह्णामि प्र॒जाभ्यो॒ द्वि॒श्वव्य॑चा॒स्तस्य॒ चक्षु॑र्वैश्वव्यच॒सं वँ॒र्॒षाणि॑ चाक्षु॒षाणि॒ जग॑ती वा॒र्॒षी
    जग॑त्या॒ ऋक्ष॑म॒मृक्ष॑माच्छु॒क्र द्वि॒श्वामि॑त्र॒ ऋषिः॑ प्र॒जाप॑ति गृहीतया॒ त्वया॒ चक्षु॑र्गृह्णामि
    प्र॒जाभ्य॑ इ॒दमु॑त्त॒रा थ्सुव॒स्तस्य॒ श्रोत्रग्ं॑ सौ॒वग्ं श॒रच्छ्रौ॒त्र्य॑नु॒ष्टुप् छा॑र॒द्य॑नु॒ष्टुभः॑
    स्वा॒रग्ग् स्वा॒रान्म॒न्थी म॒न्थिन॑ एकवि॒ग्ं॒श ए॑कवि॒ग्ं॒शा वैँ॑रा॒जाज्ज॒मद॑ग्नि॒र्॒ ऋषिः॑ प्र॒जाप॑ति
    गृहीतया॒ ङ्गृह्णामि प्र॒जाभ्य॑ इ॒यमु॒परि॑ म॒तिस्तस्यै॒ वाम्मा॒ती हे॑म॒न्तो वा न्नि॒धन॑वन्नि॒धन॑वत
    आग्रय॒ण आ त्त्रि॑णवत्रयस्त्रि॒ग्ं॒शौ त्रि॑णवत्रयस्त्रि॒ग्ं॒शाभ्याग्ं॑ शाक्वररैव॒ते शा षिः॑ प्र॒जाप॑ति
    गृहीतया॒ त्वया॒ वाच॑ ङ्गृह्णामि प्र॒जाभ्यः॑ ॥ ज॒मद॑ग्नि॒र्॒ऋषिः॑ प्र॒जाप॑तिगृहीतया वँ॑स॒न्त ऋ॑तू॒नाम॒ग्निर्दे॒वता॒
    ब्रह्म॒ द्रवि॑ण स्स उ॑ पञ्चद॒शव॑र्तनि॒ स्त्र्यवि॒र्वयः॑ कृ॒तमया॑ना स्सान॑ग॒ ऋषि॑र्दक्षि॒णा दि॒शा ङ्ग्री॒ष्म
    ऋ॑तू॒नामिन्द्रो॑ दे॒वता स्स उ॑ सप्तद॒श व॑र्तनि न्दक्षिणाद्वा॒तो वातः॑ सना॒तन॒ ऋषिः॑ प्र॒तीची॑ दि॒शां
    विँश्वे॑ दे॒वा दे॒वता॒ वि ड्द्रवि॑णग्ं सप्तद॒श स्तोम॒ स्स उ॑ वेकवि॒ग्ं॒ शव॑र्तनि म्पश्चाद्वा॒तो वातो॑
    ऽह॒भून॒ ऋषि॒रुदी॑ची दि॒शाग्ं श॒रद् म्मि॒त्रावरु॑णौ दे॒वता॑ पु॒ष्ट न्द्रवि॑णमेकवि॒ग्ं॒श स्स उ॑ त्रिण॒वव॑र्तनि
    ड्वय॑ आस्क॒न्दो ऽया॑नामुत्तरा द्वा॒तो वातः॑ प्र॒त्न ऋषि॑रू॒र्ध्वा दि॒शाग्ं हे॑मन्तशिशि॒रावृ॑तू॒ना
    म्बृह॒स्पति॑र्दे॒वता॒ वर्चो॒ द्रवि॑ण स्स उ॑ त्रयस्त्रि॒ग्ं॒शव॑र्तनिः पष्ठ॒वाद्वयो॑ ऽभि॒भूरया॑नां विँष्वग्वा॒तो
    वातः॑ सुप॒र्ण ऋषिः॑ पि॒तरः॑ पिताम॒हाः परे ऽव॑रे॒ ते नः॑ पान्तु॒ ते नो॑ न्ब्रह्म॑न्न॒स्मिन् क्ष॒त्रे
