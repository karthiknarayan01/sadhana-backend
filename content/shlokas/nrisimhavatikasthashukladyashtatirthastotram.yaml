id: nrisimhavatikasthashukladyashtatirthastotram
category: stotram
name:
  english: nrisimhavatikasthashukladyashtatirthastotram
  devanagari: नृसिंहवाटिकास्थशुक्लाद्यष्टतीर्थस्तोत्रम्
content:
  english: 74 brahmahatyaharam tirtham krishna pashcimavahini | yatra tatraiva shuklakhyam snanacchuklikaroti
    yat || 1|| tato'gratah papavinashi kamyatirtham varodumbarasannidhau ca | siddhakhryatirtham varadam
    tathaivamareshvarasyamaratirthamagre || 2|| syatkotitirtham tvatha shaktitirtham prayagatirtham ca
    tatastato'gre | shatkula etani parapratire mahashtatirthani mahaghahrinti || 3|| na brahmahatyadimahaghasangho
    yaddarshanadeva nimeshamatram | sthasyatyasheshaghaharashtatirthasnanadipunyam kimu vacyamatra ||
    4|| namo'stu tirthashtaka te ma ashu shripadapadekshanavighnakari | nivarya papam trividham samastam
    vijnanapatram kuru mamihaiva || 5|| iti shrivasudevanandasarasvativiracitam shukladyashtatirthastotram
    sampurnam |
  devanagari: ७४ ब्रह्महत्याहरं तीर्थं कृष्णा पश्चिमवाहिनी । यत्र तत्रैव शुक्लाख्यं स्नानाच्छुक्लीकरोति
    यत् ॥ १॥ ततोऽग्रतः पापविनाशि काम्यतीर्थं वरोदुम्बरसन्निधौ च । सिद्धाख्र्यतीर्थं वरदं तथैवामरेश्वरस्यामरतीर्थमग्रे
    ॥ २॥ स्यात्कोटितीर्थं त्वथ शक्तितीर्थं प्रयागतीर्थं च ततस्ततोऽग्रे । षट्कूल एतानि परप्रतीरे महाष्टतीर्थानि
    महाघहृन्ति ॥ ३॥ न ब्रह्महत्यादिमहाघसङ्घो यद्दर्शनादेव निमेषमात्रम् । स्थास्यत्यशेषाघहराष्टतीर्थस्नानादिपुण्यं
    किमु वाच्यमत्र ॥ ४॥ नमोऽस्तु तीर्थाष्टक ते म आशु श्रीपादपादेक्षणविघ्नकारि । निवार्य पापं त्रिविधं
    समस्तं विज्ञानपात्रं कुरु मामिहैव ॥ ५॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं शुक्लाद्यष्टतीर्थस्तोत्रं
    सम्पूर्णम् ।
