id: durga-nitya-puja-vidhanam
category: stotram
name:
  english: Durga Nitya Puja Vidhanam
content:
  english: durga devi pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri gurubhyo
    namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham
    sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam
    candrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala
    mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam
    namah | umamaheshvarabhyam namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam
    namah | shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om
    keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah
    | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya
    namah | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah
    | om pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah |
    om narasimhaya namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah
    | om shrikrishnaya namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam
    dehi putramshca sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam
    karishyami tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu
    bhutapishacah ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta
    ye bhuta bhumisamsthitah | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo
    jyoti raso mbrahma bhurbhuvassuvarom || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara
    prityartham asmakam sahakutumbasya kshema pujam karishye || tadanga kalasharadhanam karishye || kalasharadhanam
    kalashe gandha pushpakshatairabhyarcya | kalashe udakam purayitva | kalashasyopari hastam nidhaya
    | kalashasya mukhe vishnuh kanthe rudrah samashritah | mule tvasya sthito brahma madhye matriganah
    smritah || kukshau tu sagarah sarve saptadvipa vasundhara | rigvedo'tha yajurvedo samavedo hyatharvanah
    || angaishca sahitah sarve kalashambu samashritah || gange ca yamune caiva godavari sarasvati | narmade
    sindhu kaveri jale'smin sannidhim kuru || kaveri tungabhadra ca krishnaveni ca gautami | bhagirathiti
    vikhyatah pancagangah prakirtitah || ayantu devapujartham mama duritakshayakarakah | kalashodakena
    puja dravyani samprokshya atmanam ca samprokshya || shankhapuja shankham candrarka daivatam madhye
    varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim || trailokye yani tirthani vasudevasya
    ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet || om shankhaya namah | om dhavalaya
    namah | om pancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe akshatan samarpayami ||
    ghantanadah agamartham tu devanam gamanartham tu rakshasam | ghantaravam karomyadau devatahvana lanchanam
    || om ghantadevatabhyo namah | sakalopacara pujarthe akshatan samarpayami || shri mahaganapati puja
    o ntva ganapatigm havamahe kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida
    sadanam || sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnarajo ganadhipah
    || dhumaketurganadhyakshah phalacandro gajananah | vakratundah shurpakarno herambah skandapurvajah
    || om shrimahaganapataye namah | dhyayami | avahayami | asanam samarpayami | padyam samarpayami |
    arghyam samarpayami | acamaniyam samarpayami | snanam samarpayami | vastram samarpayami | yajnopavitam
    samarpayami | gandham samarpayami | pushpani samarpayami | dhupamaghrapayami | dipam darshayami |
    naivedyam samarpayami | tambulam samarpayami | nirajanam samarpayami | mantrapushpam samarpayami |
    pradakshina namaskaran samarpayami || shodashopacara puja durga devi dhyanam om || jatavedase sunavama
    soma maratiyato nidahati vedah | sa nah par shadati durgani vishva naveva sindhu nkatyayanaya vidmahe
    kanyakumari dhimahi | tanno durgih pracodaya t || simhastha shashishekhara marakataprakhyaishcaturbhirbhujaih
    | shankham cakra dhanuh sharamshca dadhati netraistribhih shobhita || amuktangada hara kankanaranatkanciranannupura
    | durga durgatiharini bhavatu no ratnollasatkundala || sarvamangala mangalye shive sarvarthasadhike
    | sharanye tryambake gauri narayani namo'stu te || om shri durgayai namah | dhyayami | dhyanam samarpayami
    || avahanam agaccha varade devi daityadarpavinashini | pujam grihana sumukhi namaste shankarapriye
    || om shri durgayai namah | avahayami | sthapayami | pujayami || asanam anekaratna samyuktam nanamanigananvitam
    | idam hemamayam divyamasanam pratigrihyatam || om shri durgayai namah | asanam samarpayami || padyam
    gangadi sarvatirthebhyo nitam toyamuttamam | padyartham te pradasyami grihana parameshvari || om shri
    durgayai namah | padayoh padyam samarpayami || arghyam gandha pushpakshatairyuktam arghyam sampaditam
    maya | grihana tvam mahadevi prasanna bhava sarvada || om shri durgayai namah | hastayoh arghyam samarpayami
    || acamaniyam karpurena sugandhena vasitam svadu shitalam | toyamacamaniyartham grihana parameshvari
    || om shri durgayai namah | mukhe acamaniyam samarpayami || snanam apo hishtha mayobhuvasta na urje
    dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva matarah
    || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah || om shri durgayai namah |
    shuddhodaka snanam samarpayami || snananantaram acamaniyam samarpayami || vastram vastrayugmam ca
    divyam ca shobhanam priti vardhanam | om shri durgayai namah | vastram samarpayami || yajnopavitam
    yajnopavitam paramam pavitram prajapateryatsahajam purastat | ayushyamagryam pratimunca shubhram yajnopavitam
    balamastu tejah || om shri durgayai namah | yajnopavitam samarpayami || gandham shrikhandam candanam
    divyam gandhadhyam sumanoharam | vilepanam surashreshthe candanam pratigrihyatam || om shri durgayai
    namah | gandham samarpayami || arcana akshatan dhavalan divyan pushpani ca sugandhini | bhaktya dattani
    grihyantam sarvadevah prasidata || anga puja om durgayai namah padau pujayami | om girijayai namah
    gulphau pujayami | om aparnayai namah januni pujayami | om harapriyayai namah uru pujayami | om parvatyai
    namah katim pujayami | om aryayai namah nabhim pujayami | om jaganmatre namah udaram pujayami | om
    mangalayai namah hridayam pujayami | om shivayai namah kantham pujayami | om maheshvaryai namah skandhau
    pujayami | om vishvavandyayai namah bahu pujayami | om kalyai namah hastau pujayami | om adyayai namah
    mukham pujayami | om varadayai namah netre pujayami | om ambikayai namah shirah pujayami | om paradevyai
    namah sarvanyangani pujayami || durga ashtottara shata namavali athava durga namavali pathanam ||
    om shri durgayai namah | ashtottara shata namavali pujam samarpayami | akshatan pushpani ca samarpayami
    || dhupam vanaspatyudbhavairdivyaih nanagandhaih susamyutah | aghreyah sarvadevanam dhupo'yam pratigrihyatam
    || om shri durgayai namah | dhupamaghrapayami || dipam sajyam trivarti samyuktam vahnina yojitam priyam
    | grihana mangalam dipam trailokya timirapaham || om shri durgayai namah | dipam darshayami || naivedyam
    naivedyam grihyatam devi bhaktya sampaditam maya | idam phalam ca paniyam sarvopacara samyutam ||
    o mbhurbhuvassuvah | tatsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva
    ritena parishincami | amritamastu | amritopastaranamasi | om pranaya svaha | om apanaya svaha | om
    vyanaya svaha | om udanaya svaha | om samanaya svaha | madhye madhye paniyam samarpayami | amritapidhanamasi
    | uttaraposhanam samarpayami | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam samarpayami
    || om shri durgayai namah | naivedyam samarpayami || tambulam pugiphalashca karpuraih nagavallidalairyutam
    | muktacurna samyuktam tambulam pratigrihyatam || om shri durgayai namah | tambulam samarpayami ||
    nirajanam nanadipasamayuktam nirajanam manoharam | ajnana timira dhvamsi grihyatam bhaktipurvakam
    || om shri durgayai namah | nirajanam samarpayami || mantrapushpam o nkatyayanaya vidmahe kanyakumari
    dhimahi | tanno durgih pracodaya t || shraddhaya siktaya bhaktya hyardra premna samarpitah | mantrapushpanjalishcayam
    kripaya pratigrihyatam || om shri durgayai namah | mantrapushpam samarpayami || pradakshinam yani
    kani ca papani janmantara kritani ca | tani tani pranashyanti pradakshina pade pade || papo'ham papakarma'ham
    papatma papasambhava | trahi mam kripaya devi sharanagatavatsale || anyatha sharanam nasti tvameva
    sharanam mama | tasmatkarunya bhavena raksha raksha maheshvari || om shri durgayai namah | pradakshina
    namaskaran samarpayami || namaskarah urasa shirasa drishtya manasa vacasa tatha | padbhyam karabhyam
    karnabhyam pranamo'shtanga ucyate || om shri durgayai namah | namaskaran samarpayami || sarvopacarah
    om shri durgayai namah | chatram samarpayami | camaram samarpayami | gitam shravayami | nrityam darshayami
    | samasta rajopacaran devopacaran samarpayami || stotra sukta pathanam durga suktam shri durga sapta
    shloki kshamaprarthana aparadhasahasrani kriyante'harnisham maya | daso'yamiti mam matva kshamasva
    parameshvari || avahanam na janami na janami visarjanam | pujam caiva na janami kshamyatam parameshvari
    || mantrahinam kriyahinam bhaktihinam sureshvari | yatpujitam maya devi paripurnam tadastu te || kayena
    vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam parasmai narayanayeti
    samarpayami || anaya dhyana shodashopacara pujaya shridurga devi suprita suprasanna varada bhavatu
    || udvasanam om shri durgayai namah | yathasthanam udvasayami | shobhanarthe kshemaya punaragamanaya
    ca || prasada grahanam akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram devata padodakam
    shubham || shridurga devi prasadam shirasa grihnami || om shantih shantih shantih || om tatsat brahmarpanamastu
    ||
  devanagari: दुर्गा देवी प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो नमः
    । हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम पूजां करिष्ये ॥ तदङ्ग कलशाराधनं करिष्ये
    ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि हस्तं निधाय । कलशस्य
    मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः स्मृताः ॥ कुक्षौ तु
    सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च सहिताः सर्वे कलशाम्बु
    समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन् सन्निधिं कुरु ॥ कावेरी
    तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः ॥ आयान्तु देवपूजार्थं
    मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य ॥ शङ्खपूजा शङ्खं
    चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम् ॥ त्रैलोक्ये
    यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत् ॥ ॐ शङ्खाय
    नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि ॥ घण्टानादः
    आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ घण्टादेवताभ्यो
    नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां
    उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ सुमुखश्चैकदन्तश्च
    कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः फालचन्द्रो गजाननः । वक्रतुण्डः
    शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । आवाहयामि । आसनं समर्पयामि । पाद्यं
    समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि । वस्त्रं समर्पयामि । यज्ञोपवीतं
    समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि । दीपं दर्शयामि । नैवेद्यं समर्पयामि
    । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ षोडशोपचार पूजा दुर्गा देवी ध्यानम् ओम् ॥ जा॒तवे॑दसे सुनवाम॒ सोम॑ मरातीय॒तो निद॑हाति॒ वेदः॑ । स नः॑
    पर् ष॒दति॑ दु॒र्गाणि॒ विश्वा॑ ना॒वेव॒ सिन्धु॑ ङ्का॒त्या॒य॒नाय॑ वि॒द्महे॑ कन्यकु॒मारि॑ धीमहि । तन्नो॑
    दुर्गिः प्रचो॒दया त् ॥ सिंहस्था शशिशेखरा मरकतप्रख्यैश्चतुर्भिर्भुजैः । शङ्खं चक्र धनुः शरांश्च दधती
    नेत्रैस्त्रिभिः शोभिता ॥ आमुक्ताङ्गद हार कङ्कणरणत्काञ्चीरणन्नूपुरा । दुर्गा दुर्गतिहारिणी भवतु नो
    रत्नोल्लसत्कुण्डला ॥ सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु
    ते ॥ ॐ श्री दुर्गायै नमः । ध्यायामि । ध्यानं समर्पयामि ॥ आवाहनम् आगच्छ वरदे देवि दैत्यदर्पविनाशिनि
    । पूजां गृहाण सुमुखि नमस्ते शङ्करप्रिये ॥ ॐ श्री दुर्गायै नमः । आवाहयामि । स्थापयामि । पूजयामि ॥ आसनम्
    अनेकरत्न संयुक्तं नानामणिगणान्वितम् । इदं हेममयं दिव्यमासनं प्रतिगृह्यताम् ॥ ॐ श्री दुर्गायै नमः ।
    आसनं समर्पयामि ॥ पाद्यम् गङ्गादि सर्वतीर्थेभ्यो नीतं तोयमुत्तमम् । पाद्यार्थं ते प्रदास्यामि गृहाण
    परमेश्वरि ॥ ॐ श्री दुर्गायै नमः । पादयोः पाद्यं समर्पयामि ॥ अर्घ्यम् गन्ध पुष्पाक्षतैर्युक्तं अर्घ्यं
    सम्पादितं मया । गृहाण त्वं महादेवि प्रसन्ना भव सर्वदा ॥ ॐ श्री दुर्गायै नमः । हस्तयोः अर्घ्यं समर्पयामि
    ॥ आचमनीयम् कर्पूरेण सुगन्धेन वासितं स्वादु शीतलम् । तोयमाचमनीयार्थं गृहाण परमेश्वरि ॥ ॐ श्री दुर्गायै
    नमः । मुखे आचमनीयं समर्पयामि ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से
    ॥ यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒
    जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥ ॐ श्री दुर्गायै नमः । शुद्धोदक स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं
    समर्पयामि ॥ वस्त्रम् वस्त्रयुग्मं च दिव्यं च शोभनं प्रीति वर्धनम् । ॐ श्री दुर्गायै नमः । वस्त्रं
    समर्पयामि ॥ यज्ञोपवीतम् यज्ञोपवीतं परमं पवित्रं प्रजापतेर्यत्सहजं पुरस्तात् । आयुष्यमग्र्यं प्रतिमुञ्च
    शुभ्रं यज्ञोपवीतं बलमस्तु तेजः ॥ ॐ श्री दुर्गायै नमः । यज्ञोपवीतं समर्पयामि ॥ गन्धम् श्रीखण्डं चन्दनं
    दिव्यं गन्धाढ्यं सुमनोहरम् । विलेपनं सुरश्रेष्ठे चन्दनं प्रतिगृह्यताम् ॥ ॐ श्री दुर्गायै नमः । गन्धं
    समर्पयामि ॥ अर्चन अक्षतान् धवलान् दिव्यान् पुष्पाणि च सुगन्धीनि । भक्त्या दत्तानि गृह्यन्तां सर्वदेवाः
    प्रसीदत ॥ अङ्ग पूजा ॐ दुर्गायै नमः पादौ पूजयामि । ॐ गिरिजायै नमः गुल्फौ पूजयामि । ॐ अपर्णायै नमः जानुनी
    पूजयामि । ॐ हरप्रियायै नमः ऊरू पूजयामि । ॐ पार्वत्यै नमः कटिं पूजयामि । ॐ आर्यायै नमः नाभिं पूजयामि
    । ॐ जगन्मात्रे नमः उदरं पूजयामि । ॐ मङ्गलायै नमः हृदयं पूजयामि । ॐ शिवायै नमः कण्ठं पूजयामि । ॐ महेश्वर्यै
    नमः स्कन्धौ पूजयामि । ॐ विश्ववन्द्यायै नमः बाहू पूजयामि । ॐ काल्यै नमः हस्तौ पूजयामि । ॐ आद्यायै नमः
    मुखं पूजयामि । ॐ वरदायै नमः नेत्रे पूजयामि । ॐ अम्बिकायै नमः शिरः पूजयामि । ॐ परादेव्यै नमः सर्वाण्यङ्गानि
    पूजयामि ॥ दुर्गा अष्टोत्तर शत नामावली अथवा दुर्गा नामावली पठनम् ॥ ॐ श्री दुर्गायै नमः । अष्टोत्तर
    शत नामावली पूजां समर्पयामि । अक्षतान् पुष्पाणि च समर्पयामि ॥ धूपम् वनस्पत्युद्भवैर्दिव्यैः नानागन्धैः
    सुसंयुतः । आघ्रेयः सर्वदेवानां धूपोऽयं प्रतिगृह्यताम् ॥ ॐ श्री दुर्गायै नमः । धूपमाघ्रापयामि ॥ दीपम्
    साज्यं त्रिवर्ति संयुक्तं वह्निना योजितं प्रियम् । गृहाण मङ्गलं दीपं त्रैलोक्य तिमिरापहम् ॥ ॐ श्री
    दुर्गायै नमः । दीपं दर्शयामि ॥ नैवेद्यम् नैवेद्यं गृह्यतां देवि भक्त्या सम्पादितं मया । इदं फलं च
    पानीयं सर्वोपचार संयुतम् ॥ ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो
    नः॑ प्रचो॒दया त् ॥ सत्यं त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि । ॐ प्राणाय स्वाहा । ॐ
    अपानाय स्वाहा । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये मध्ये पानीयं समर्पयामि
    । अमृतापिधानमसि । उत्तरापोशनं समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि । शुद्धाचमनीयं समर्पयामि
    ॥ ॐ श्री दुर्गायै नमः । नैवेद्यं समर्पयामि ॥ ताम्बूलम् पूगीफलश्च कर्पूरैः नागवल्लीदलैर्युतम् । मुक्ताचूर्ण
    संयुक्तं ताम्बूलं प्रतिगृह्यताम् ॥ ॐ श्री दुर्गायै नमः । ताम्बूलं समर्पयामि ॥ नीराजनम् नानादीपसमायुक्तं
    नीराजनं मनोहरम् । अज्ञान तिमिर ध्वंसि गृह्यतां भक्तिपूर्वकम् ॥ ॐ श्री दुर्गायै नमः । नीराजनं समर्पयामि
    ॥ मन्त्रपुष्पम् ओ ङ्का॒त्या॒य॒नाय॑ वि॒द्महे॑ कन्यकु॒मारि॑ धीमहि । तन्नो॑ दुर्गिः प्रचो॒दया त् ॥ श्रद्धया
    सिक्तया भक्त्या ह्यार्द्र प्रेम्णा समर्पितः । मन्त्रपुष्पाञ्जलिश्चायं कृपया प्रतिगृह्यताम् ॥ ॐ श्री
    दुर्गायै नमः । मन्त्रपुष्पं समर्पयामि ॥ प्रदक्षिणम् यानि कानि च पापानि जन्मान्तर कृतानि च । तानि तानि
    प्रणश्यन्ति प्रदक्षिण पदे पदे ॥ पापोऽहं पापकर्माऽहं पापात्मा पापसम्भव । त्राहि मां कृपया देवि शरणागतवत्सले
    ॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । तस्मात्कारुण्य भावेन रक्ष रक्ष महेश्वरि ॥ ॐ श्री दुर्गायै नमः
    । प्रदक्षिण नमस्कारान् समर्पयामि ॥ नमस्कारः उरसा शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्यां कराभ्यां
    कर्णाभ्यां प्रणामोऽष्टाङ्ग उच्यते ॥ ॐ श्री दुर्गायै नमः । नमस्कारान् समर्पयामि ॥ सर्वोपचाराः ॐ श्री
    दुर्गायै नमः । छत्रं समर्पयामि । चामरं समर्पयामि । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त राजोपचारान्
    देवोपचारान् समर्पयामि ॥ स्तोत्र सूक्त पठनम् दुर्गा सूक्तम् श्री दुर्गा सप्त श्लोकी क्षमाप्रार्थना
    अपराधसहस्राणि क्रियन्तेऽहर्निशं मया । दासोऽयमिति मां मत्वा क्षमस्व परमेश्वरि ॥ आवाहनं न जानामि न जानामि
    विसर्जनम् । पूजां चैव न जानामि क्षम्यतां परमेश्वरि ॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वरि । यत्पूजितं
    मया देवि परिपूर्णं तदस्तु ते ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः स्वभावात् । करोमि
    यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ अनया ध्यान षोडशोपचार पूजया श्रीदुर्गा देवी सुप्रीता सुप्रसन्ना
    वरदा भवतु ॥ उद्वासनम् ॐ श्री दुर्गायै नमः । यथास्थानं उद्वासयामि । शोभनार्थे क्षेमाय पुनरागमनाय च
    ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं देवता पादोदकं शुभम् ॥ श्रीदुर्गा
    देवी प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ब्रह्मार्पणमस्तु ॥
