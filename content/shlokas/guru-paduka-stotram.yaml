id: guru-paduka-stotram
category: stotram
name:
  english: Guru Paduka Stotram
content:
  english: naukayitabhyam gurubhaktidabhyam | vairagyasamrajyada pujanabhyam namo namah shrigurupadukabhyam
    || nishakarabhyam daurbhagya malikabhyam | durikritanamra vipattitabhyam namo namah shrigurupadukabhyam
    || || nata yayoh shripatitam samiyuh kadacidapyashu daridravaryah | mukashca vacaspatitam hi tabhyam
    namo namah shrigurupadukabhyam || padahritabhyam nanavimohadi nivarikabhyam | namajjanabhishta tatipradabhyam
    namo namah shrigurupadukabhyam || kanyakabhyam | nripatvadabhyam natalokapankteh namo namah shrigurupadukabhyam
    || paramparabhyam tapatrayahindra khageshvarabhyam | jadyabdhi vadavabhyam namo namah shrigurupadukabhyam
    || vratadikshitabhyam | ramadhavanghri sthirabhaktidabhyam namo namah shrigurupadukabhyam || makhileshtadabhyam
    svahasahayaksha dhurandharabhyam | svantacchabhava pradapujanabhyam namo namah shrigurupadukabhyam
    || vrajagarudabhyam vivekavairagya nidhipradabhyam | bodhapradabhyam drutamokshadabhyam namo namah
    shrigurupadukabhyam ||
  devanagari: नौकायिताभ्यां गुरुभक्तिदाभ्याम् । वैराग्यसाम्राज्यद पूजनाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ निशाकराभ्यां दौर्भाग्य मालिकाभ्याम् । दूरीकृतानम्र विपत्तिताभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥
    ॥ नता ययोः श्रीपतितां समीयुः कदाचिदप्याशु दरिद्रवर्याः । मूकाश्च वाचस्पतितां हि ताभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ पदाहृताभ्यां नानाविमोहादि निवारिकाभ्याम् । नमज्जनाभीष्ट ततिप्रदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ कन्यकाभ्याम् । नृपत्वदाभ्यां नतलोकपङ्क्तेः नमो नमः श्रीगुरुपादुकाभ्याम् ॥ परम्पराभ्यां तापत्रयाहीन्द्र
    खगेश्वराभ्याम् । जाड्याब्धि वाडवाभ्याम् नमो नमः श्रीगुरुपादुकाभ्याम् ॥ व्रतदीक्षिताभ्याम् । रमाधवाङ्घ्रि
    स्थिरभक्तिदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥ मखिलेष्टदाभ्यां स्वाहासहायाक्ष धुरन्धराभ्याम् । स्वान्ताच्छभाव
    प्रदपूजनाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥ व्रजगारुडाभ्यां विवेकवैराग्य निधिप्रदाभ्याम् । बोधप्रदाभ्यां
    द्रुतमोक्षदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥
