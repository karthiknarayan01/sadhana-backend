id: mukticintamanigayatrikavacam
category: kavacha
name:
  english: mukticintamanigayatrikavacam
  devanagari: मुक्तिचिन्तामणिगायत्रीकवचम्
content:
  english: om dam shrim nairityam svatah | om dham shrim shri varunah patu pashcime mam jaleshvarah ||
    17|| om nam shrim vayuto vayurvayavve mam sada'vatu | om pam shrim mamudare patu kuberoyaksharat sada
    || 18|| om pham yam mamishvarah patu svayamishananayakah | om bam gam urdhvamatmabhurbhagavan sarvada'vatu
    || 19|| om bham glaum patu mam vishnuradhastat sarvada harih | om mam bhai me guruh pratah om yam
    shrim mam madhyavasare || 20|| om ram hrim me'vatat sayam paratpara
  devanagari: ॐ दं श्रीं नैऋत्यां स्वतः । ॐ धं श्रीं श्री वरुणः पातु पश्चिमे मां जलेश्वरः ॥ १७॥ ॐ नं श्रीं
    वायुतो वायुर्वायव्वे मां सदाऽवतु । ॐ पं श्रीं मामुदरे पातु कुबेरोयक्षराट् सदा ॥ १८॥ ॐ फं यं मामीश्वरः
    पातु स्वयमीशाननायकः । ॐ बं गां ऊर्ध्वमात्मभूर्भगवान् सर्वदाऽवतु ॥ १९॥ ॐ भं ग्लौं पातु मां विष्णुरधस्तात्
    सर्वदा हरिः । ॐ मं भै मे गुरुः प्रातः ॐ यं श्रीं मां मध्यवासरे ॥ २०॥ ॐ रं ह्रीं मेऽवतात् सायं परात्पर
meaning: {}
