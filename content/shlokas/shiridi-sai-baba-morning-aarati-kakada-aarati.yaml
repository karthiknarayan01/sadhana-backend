id: shiridi-sai-baba-morning-aarati-kakada-aarati
category: stotram
name:
  english: Shiridi Sai Baba Morning Aarati - Kakada Aarati
content:
  english: shri saccidananda samardha sadguru sayinadha maharaj ki jai joduniya karacarani thevila madha
    parisavi vinanti majhi pandarinadha asonaso bhava tujhiya thaya krupadrushti pahe majakade sadgururaya
    akhandita save vatatepayi shanduni sankòc ttava tòdasa dèyi tukahmane devamajhi vedivakudi name bhava
    pash hati || uthapanduranga ata prabhata samayò patala vaishnavanca mela garuda pari datala garudapara
    pasuni maha dvara paryanta suravaranci mandi ubhi joduni hat shukasanakadika naradatumbara bhaktancyakoti
    trishula dhamaru ghe uni ubha girijeca pati kaliyugica bhaktanama ubhakirtani pathimage ubhidola lavuni
    || utha utha shrisayinadhaguru caranakamala dava adhivyadi bhavatapa varuni tara jadajiva gelituhma
    sodu niyabhava tamara rajanivilaya parihi anyanasi tamaci bhulaviyogamaya shaktina ahmayatkincit hi
    ti jalasaraya tuhmic titesaruni dava mukhajanataraya || || bhhò shainatha maharaja bhava timiriranasaka
    ravi ajnani ahmikiti tava varnavitavadhoravi tivarnitabha gale bahuvadanishesha vidhakavi sakrupa
    ho uni mahima tumaca tuhmica vadavava adivyadhi bhava tapavaruni tarajadajiva utha utha shrisayinadhagurucaranakamala
    dava adivyadhibhava tapavaruni tarajadajiva bhakta mani sadbhava dharunije tuhma anusarale dhyayastavate
    darshnatumace dvari ubethele dhyanasdha tuhmasa pahuni mana amuceghele phari thvadvacanamritha prasayatè
    atura j alè ukhaduni netrakamala dinabandhu ramakanta pahiba krupadrusti balaka jasi mata ranjavi
    madhuravani haritap sayinadha ahmic apulekariya stavatuja kashtavito deva sahanakarishilè ikuvidyavi
    bhet krushnadava utha utha shrisayinadhagurucaranakamala dava adivyadhi bhavatapavaruni tarajadajiva
    || || utha utha paduranga ata darshanadyasakala jhula arunodayasarali nidrecèvela santasadhumuni avaghe
    jhuletigola sodasheje sukh ata bahuja mukhakamala rangamandape mahadvari jhulisedati mana utavila
    rupa pahavaya drushti rayi rakhumabayi tuhma ye udyadaya sheje halavuni jage karadevaraya garuda hanumanta
    hubhe pahativat svargice suravaraghe uni alebhobhat jhule mukta dvara labh jhularokada vishnudas nama
    ubha ghe unikakada || uniya pancarati karubabasi arati utha uthaho bandhava ovalu haramadhava karuniya
    sdhiramana pahugambhirahedhyana krushnanadha dattasayi jadòcitta tujhepayi kakada arati karito sayinadha
    deva cinmayarupa dakhavi ghe uni || kamakrodhamadamatsara atuni kakadakela vairagyace tuv kadhuni
    mito bijivila sayinadhaguru bhakti jvaline tomipetavila tadrvuttijaluni gurune prakashapadila dvaitata
    manasuni milavi tatsyarupi jiva cinmaya rupada khavi ghe uni balakalaghu seva kakada arati karito
    sayinadha deva cinmaya rupada khavi ghe uni balakalaghu seva bhu khecara vyapuni avaghe hrutkamali
    rahasi toci dattadeva shiridi rahuni pavasi rahuniyedhe anyasradhahi tu bhaktastavadhavasi nirasuni
    ya sankatadasa anibhava davisi nakaletvalli lahikonya devava manava cinmayarupadakhavi ghe uni balakaghuseva
    kakada aratikarito sayinadha deva cinmayarupadakhavi ghe uni balakaghuseva tvadrishya dundubhinesare
    ambar he kondale sagunamurti pahanya atura janashiridi ale prashuni tad vacanamruta amucedehaban haraphale
    soduniyadur abhimana manasa tvaccarani vahile krupakaruni sayimavule danapadarighyava cinmayarupadakhavi
    ghe uni balakaghu seva kakada aratikarito sayinadha deva cinmaya rupadakhavi ghe uni balakaghuseva
    bhakticiya potibod kakada jyoti pancapranajive bhave ovalu arati ovalu aratimajhya pandarinadha majhyasayinadha
    doni karajodunicarani thevilamadha kayamahima varnu ata sanganekiti kotibrahma hatyamukha pahata jati
    rayirakhumabayi ubhya doghidobahi mayurapinca camaredaliti sayinca thayi tukahmane dipaghe uni unmanitashobha
    vithevari ubadise lavanya gabha utha sadu santa sada apulale hita ja il hanaradeha magakaica bhagavanta
    uthoniya pahatebaba ubha asevite caranata yance gomati amruta drushti avaloka utha ulasi jalatilapatakan
    cyarashi kakada aratidekhiliya jage kara rukminivara deva ahenijasuran ta vegelimbalon kara drushti
    ho il tayasi dari bajantri vajati dolu damame garjati hotasekakadarati majhya sadguru rayaci simhanadha
    shankha beri anandahotomahadvari keshavaraja vithevari namacarana vandito sayinadha gurumajhe ayi
    majala thava dyavapayi shri saccidananda sadguru sayinadh maharaj ki jai dattaraja gurumajhe ayi majala
    thava dyavapayi sayinadha gurumajhe ayi majala thava dyavapayi prabhata samayinabha shubha ravi prabhapakali
    smare guru sada ashasamayityachale nakali hmanonikarajodunikaru ataguru prardhana samardha gurusayinadha
    puravi manovasana tama nirasi bhanuhaguruhi nasi ajnanata parantuguru cikari naravihikadi samyata
    pun hatimira janmaghe gurukrupeni ajnanana samardha gurusayinadha puravi manovasana ravi pragataho
    uni tvaritaghala vi alasa tasaguruhisodavi sakala dushkruti lalasa haroni abhimanahi jadavi tatpadibhavana
    samardha gurusayinadha puravi manovasana gurusi upamadisevidhi hari haranci iti kavani ya ugipahuni
    tujhica upamatulabaravishobhate sajjana samardha gurusayinadha puravi manovasana samadhi utaroniya
    gurucalamashidikade tvadiya vacanoktiti madhura varitisokade ajataripu sadguro akhila pataka bhanjana
    samardha gurusayinadhapura vi manovasana ahasusamayasiya guru uthoniya baisale vilokuni padashrita
    tadiya apade nasile asasuta kariya jagatikonihi anyana samardha gurusayinadha puravi manovasana ajataripu
    sadguro akhila pataka bhanjana asebahutashahana parinajyagurucikrupa natatrvahita tyakalekaritase
    rikamya gapa jarigurupadadharanisudruda bhaktinetomana samardha gurusayinadhapura vi manovasana gurovinati
    mikari hrudaya mandiri yabasa samasta jag he gurusvarupaci thasomanasa gadosatata satkri atiyatihide
    jagatpavana samardha gurusayinadhapura vi manovasana || || prameya ashtakashiphaduni guruvara prardhitijeprabhati
    tyancecittasideto akhilaharuniya bhrantiminityashanti aise hesayinadhekadhuni sucavile jeviyabalakashi
    tevityakrushnapayi namuni savinaye arpito ashtakashi shri saccidananda sadguru sayinadh maharaj ki
    jai sayiraham najar karana baccokapalan karana sayiraham najar karana baccokapalan karana janatumane
    jagatprasara sabahijhut jamana janatumane jagatprasara sabahijhut jamana sayiraham najar karana baccokapalan
    karana sayiraham najar karana baccokapalan karana mai andhahubanda apakamujhuse prabhudikhalana mai
    andhahubanda apakamujhuse prabhudikhalana sayiraham najar karana baccokapalan karana sayiraham najar
    karana baccokapalan karana dasaganukahe ab kyabolu dhak gayi meri rasana dasaganukahe ab kyabolu dhak
    gayi meri rasana sayiraham najar karana baccokapalan karana sayiraham najar karana baccokapalan karana
    ram najar karo ab moresayi tumabina nahimujhe mabap bhayi ram najar karo mai andhahu banda tumhara
    mai andhahu banda tumhara mainajanu ilahi ram najar karo ram najar karo ab moresayi tumabina nahimujhe
    mabap bhayi ram najar karo ram najar karo ram najar karo khali jamana maine gamaya maine gamaya sadhi
    akhir ka kiyanakoyi ram najar karo ram najar karo ab moresayi tumabina nahimujhe mabap bhayi ram najar
    karo ram najar karo ap nemas jid ka jaduganuhai ap nemas jid ka jaduganuhai malik hamare malik hamare
    malik hamare tum babasayi ram najar karo ram najar karo ab moresayi ram najar karo ram najar karo
    tumabina nahimujhe mabap bhayi || || ram najar karo ram najar karo tujakayade u savalya mibhayatariyo
    tujakayade u savalya mibhayatariyo midubali batika namya cijana shrihari midubali batika namya cijana
    shrihari uccishta tuladenehi goshta nabari yo uccishta tuladenehi goshta nabari tu jagannadh tujace
    kashirebhakari tu jagannadh tujace kashirebhakari nako antamadiya pahu sakhyabhagavanta shrikanta
    madhyahnaratri ulatonige lihi ata anacitta jaho il tujhurekakada kira ulatariyo jaho il tujhurekakada
    kira ulatari anatil bhakta naivedyahi nanapari anatil bhakta naivedyahi nanapari tujakayade u mibhaya
    tariyo yujakayade u sadguru mibhaya tari midubali batika namya cijana shrihari midubali batika namya
    cijana shrihari shrisadguru babasayi ho shrisadguru babasayi tujavacuni ashrayanahibhutali tujavacuni
    ashrayanahibhutali mi papipatitadhimanta mi papipatitadhimanta taranemala gurunadha jhudakari taranemala
    sayinadha jhudakari tushantikshamecameru tushantikshamecameru tumi bhavarna vicetaru guruvara tumi
    bhavarna vicetaru guruvara guruvaramajasi pamara ata uddara tvaritalavalahi tvarita lalahi mibudato
    bhava bhaya dohi uddara shri sadguru babasayi ho shri sadguru babasayi ho tujavacuni ashrayanahibhutali
    tujavacuni ashrayanahibhutali shri saccidananda sadguru sayinadh maharaj ki jai rajadhirajayogiraja
    parabrahma sayinadh maharaj shri saccidananda sadguru sayinadh maharaj ki jai
  devanagari: श्री सच्चिदानन्द समर्ध सद्गुरु सायिनाध महराज् की जै जोडूनिया करचरणि ठेविला माधा परिसावी
    विनन्ती माझी पण्डरीनाधा असोनसो भावा तूझिया ठाया क्रुपाद्रुष्टि पाहे मजकडे सद्गुरूराया अखण्डिता सावे
    वाटतेपायी शन्दूनी सन्कॊच् त्ताव तॊदासा दॆयी तुकाह्मणे देवामाझी वेडीवाकुडी नामे भव पाश् हाति ॥ उथपन्दुरन्ग
    अत प्रभत समयॊ पतल वैष्णवाञ्चा मेला गरुड पारी दाटला गरूडापारा पासुनी महा द्वारा पर्यन्ता सुरवराञ्ची
    मान्दी उभी जोडूनि हात् शुकसनकादिक नारदतुम्बर भक्ताञ्च्याकोटी त्रिशूल ढमरू घे उनि उभा गिरिजेचा पती
    कलियुगीचा भक्तानामा उभाकीर्तनी पाठीमागे उभीडोला लावुनि ॥ उठा उठा श्रीसायिनाधगुरु चरणकमल दावा आधिव्यादि
    भवताप वारुनी तारा जडजीवा गेलीतुह्मा सोडु नियाभव तमर रजनीविलया परिही अङ्यानासी तमची भुलवियोगमाया शक्तिन
    अह्मायत्किञ्चित् ही ति जलासाराया तुह्मीच् तीतेसारुनि दावा मुखजनताराया ॥ ॥ भ्हॊ शैनाथ ंअहराज भव तिमिरिरनासक
    रवी अज्ञानी अह्मीकिति तव वर्णावीतवधोरवी तीवर्णिताभा गले बहुवदनिशेष विधकवी सक्रुप हो उनि महिमा तुमचा
    तुह्मीच वदवावा आदिव्याधि भव तापवारुनि ताराजडजीवा उठा उठा श्रीसायिनाधगुरुचरणकमल दावा आदिव्याधिभव तापवारुनि
    ताराजडजीवा भक्त मनि सद्भाव धरुनिजे तुह्मा अनुसरले ध्यायास्तवते दर्श्नतुमचे द्वारि उबेठेले ध्यानस्धा
    तुह्मास पाहुनी मन अमुचेघेले फरी थ्वद्वचनाम्रिथ प्रासायातॆ आतुर ज् आलॆ उखडुनी नेत्रकमला दीनबन्धू रमाकान्ता
    पाहिबा क्रुपाद्रुस्टी बालका जसी माता रञ्जवी मधुरवाणी हरिताप् सायिनाधा अह्मिच् अपुलेकरिया स्तवतुज कष्टवितो
    देवा सहनकरिशिलॆ इकुविद्यावी भेट् क्रुष्णदावा उठा उठा श्रीसायिनाधगुरुचरणकमल दावा आदिव्याधि भवतापवारुनि
    ताराजडजीवा ॥ ॥ उठा उठा पाडुरङ्गा आता दर्शनद्यासकला झूला अरुणोदयासरली निद्रेचॆवेला सन्तसाधूमुनी अवघे
    झूलेतीगोला सोडाशेजे सुख् आता बहुजा मुखकमला रङ्गमण्डपे महाद्वारी झूलीसेदाटी मन उतावील रूप पहवया द्रुष्टी
    रायि रखुमाबायि तुह्मा ये ऊद्यादया शेजे हालवुनी जागे कारादेवराया गरूड हनुमन्त हुभे पाहातीवाट् स्वर्गीचे
    सुरवरघे उनि आलेभोभाट् झूले मुक्त द्वारा लाभ् झूलारोकडा विष्णुदास् नाम उभा घे उनिकाकड ॥ उनिया पञ्चारती
    करूबाबासी आरती उठा उठाहो बान्धव ओवालु हरमाधव करूनिया स्धिरामन पाहुगम्भीराहेध्यान क्रुष्णनाधा दत्तसायि
    जाडॊचित्त तुझेपायी काकड आरती करीतो सायिनाध देवा चिन्मयरूप दाखवी घे उनि ॥ कामक्रोधमदमत्सर आटुनि काकडकेला
    वैराग्याचे तूव् काढुनी मीतो बिजिवीला सायिनाधगुरु भक्ति ज्वलिने तोमीपेटविला तद्र्वुत्तीजालुनी गुरुने
    प्राकाशपाडिला द्वैतत मानासुनी मिलवी तत्स्यरूपि जीवा चिन्मय रूपदा खवी घे उनि बालकलघु सेवा काकड आरती
    करीतो सायिनाध देवा चिन्मया रूपदा खवी घे उनि बालकलघु सेवा भू खेचर व्यापूनी अवघे ह्रुत्कमली राहसी तोची
    दत्तदेव शिरिडी राहुनि पावसी राहुनियेधे अन्यस्रधहि तू भक्तास्तवधावसी निरसुनि या सङ्कटादासा अनिभव दावीसी
    नकलेत्वल्ली लाहीकोण्या देवावा मानवा चिन्मयरूपदाखवी घे उनि बालकघुसेवा काकड आरतीकरीतो सायिनाध देवा चिन्मयरूपदाखवी
    घे उनि बालकघुसेवा त्वदॄश्य दुन्दुभिनेसारे अम्बर् हे कोन्दले सगुणमूर्ती पाहण्या आतुर जनशिरिडी आले प्राशुनि
    तद् वचनाम्रुत अमुचेदेहबान् हरफले सोडुनियादुर् अभिमान मानस त्वच्चरणि वाहिले क्रुपाकरुनी सायिमावुले
    दानपदरिघ्यावा चिन्मयरूपदाखवी घे उनि बालकघु सेवा काकड आरतीकरीतो सायिनाध देवा चिन्मय रूपदाखवी घे उनि
    बालकघुसेवा भक्तीचिया पोटीबोद् काकड ज्योती पञ्चप्राणजीवे भावे ओवालु आरती ओवालू आरतीमाझ्या पण्डरीनाधा
    माझ्यासायिनाधा दोनी करजोडुनिचरणी ठेविलामाधा कायामहिमा वर्णू आता साङ्गणेकीती कोटिब्रह्म हत्यमुख पाहता
    जाती रायीरखुमाबायी उभ्या दोघीदोबाही मायूरपिञ्च चामरेडालीति सायीञ्च ठायि तुकाह्मणे दीपघे उनि उन्मनीतशोभा
    विठेवरी उबादिसे लावण्या गाभा उठा सादु सन्त सादा आपुलाले हिता जा ईल् हनरदेह मगकैचा भगवन्त उठोनिया पहटेबाबा
    उभा असेवीटे चरणत याञ्चे गोमटी अम्रुत द्रुष्टी अवलोका उठा उलासी जलतिलपातकान् च्याराशी काकड आरतिदेखिलिया
    जागे करा रुक्मिणीवरा देव अहेनिजसुरान् त वेगेलिम्बलोण् करा द्रुष्टि हो ईल् तयासी दारी बाजन्त्री वाजती
    डोलु डमामे गर्जती होतसेकाकडारति माझ्या सद्गुरु रायची सिंहनाध शङ्ख बेरि आनन्दहोतोमहाद्वारी केशवराज
    विठेवरी नामाचरण वन्दितो सायिनाध गुरुमाझे आयी मजला ठावा द्यावापायी श्री सच्चिदानन्द सद्गुरु सायिनाध्
    महाराज् की जै दत्तराज गुरुमाझे आयी मजला ठावा द्यावापायी सायिनाध गुरुमाझे आयी मजला ठावा द्यावापायी
    प्रभात समयीनभा शुभ रवी प्रभापाकली स्मरे गुरु सदा अशासमयीत्याछले नाकली ह्मणोनिकरजोडुनीकरु अतागुरू प्रार्धना
    समर्ध गुरुसायिनाध पुरवी मनोवासना तमा निरसि भानुहगुरुहि नासि अज्ञानता परन्तुगुरु चीकरी नरविहीकदी साम्यता
    पुन् हातिमिर जन्मघे गुरुक्रुपेनि अज्ञनना समर्ध गुरुसायिनाध पुरवी मनोवासना रवि प्रगटहो उनि त्वरितघाल
    वी आलसा तसागुरुहिसोडवी सकल दुष्क्रुती लालसा हरोनि अभिमानही जडवि तत्पदीभावना समर्ध गुरुसायिनाध पुरवी
