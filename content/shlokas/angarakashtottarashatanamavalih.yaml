id: angarakashtottarashatanamavalih
category: stotram
name:
  english: angarakashtottarashatanamavalih
  devanagari: अङ्गारकाष्टोत्तरशतनामावलिः
content:
  english: om mahisutaya namah | om mahabhagaya namah | om mangaḻaya namah | om mangalapradaya namah |
    om mahaviraya namah | om mahashuraya namah | om mahabalaparakramaya namah | om maharaudraya namah
    | om mahabhadraya namah | om mananiyaya namah || 10|| om dayakaraya namah | om manadaya namah | om
    amarshanaya namah | om kruraya namah | om tapapapavivarjitaya namah | om supratikaya namah | om sutamrakshaya
    namah | om subrahmanyaya namah | om sukhapradaya namah | om vakrastambhadigamanaya namah || 20|| om
    varenyaya namah | om varadaya namah | om sukhine namah | om virabhadraya namah | om virupakshaya namah
    | om vidurasthaya namah | om vibhavasave namah | om nakshatracakra samcarine namah | om nakshatrarupaya
    namah | om kshatravarjitaya namah || 30|| om kshayavriddhivinirmuktaya namah | om vicakshanaya namah
    | om akshinaphaladaya namah | om cakshurgocaraya namah | om shubhalakshanaya namah | om vitaragaya
    namah | om vitabhayaya namah | om vijvaraya namah | om vishvakaranaya namah | om nakshatrarashi samcaraya
    namah || 40|| om nanabhaya nikrimtanaya namah | om kamaniyaya namah | om dayasaraya namah | om kanatkanakabhushanaya
    namah | om bhayaghnaya namah | om bhavyaphaladaya namah | om bhaktabhayavarapradaya namah | om shatruhamtre
    namah | om shamopetaya namah | om sharanagata poshakaya namah || 50|| om sahasaya namah | om sadgunadhyakshaya
    namah | om sadhave namah | om samaradurjayaya namah | om dushtaduraya namah | om shishtapujyaya namah
    | om sarvakashtanivarakaya namah | om dushceshtavarakaya namah | om duhkhabhamjanaya namah | om durdharaya
    namah || 60|| om haraye namah | om dussvapnahamtre namah | om durdharshaya namah | om dushtagarvavimocakaya
    namah | om bharadvajakulodbhavaya namah | om bhusutaya namah | om bhavyabhushanaya namah | omraktambaraya
    namah | omraktavavushe namah | om bhaktapalanatatparaya namah || 70|| om caturbhujaya namah | om gadadharine
    namah | om meshavahanaya namah | om mitashanaya namah | om shaktishuladharaya namah | om shaktaya
    namah | om shastravidyavisharadaya namah | om tarkikaya namah | om tamasadharaya namah | om tapasvine
    namah || 80|| om tamralocanaya namah | om taptakamcanasamkashaya namah | om raktakimjalkasannibhaya
    namah | om gotradhidevataya namah | om gomadhyacaraya namah | om gunavibhushanaya namah | om asrije
    namah | om angarakaya namah | om avamtideshadhishaya namah | om janardanaya namah || 90|| om suryayamya
    pradeshasthaya namah | om yauvanaya namah | om yamyadinmukhaya namah | om trikonamamdalagataya namah
    | om tridashadhipasannutaya namah | om shucaye namah | om shucikaraya namah | om shuraya namah | om
    shucivashyaya namah | om shubhavahaya namah || 100|| om meshavrishcikarashishaya namah | om medhavine
    namah | om mitabhashine namah | om sukhapradaya namah | om surupakshaya namah | om sarvabhishtaphalapradaya
    namah | om shrimate angarakaya namah | iti angaraka ashtottara shatanamavalissamapta ||
  devanagari: ॐ महीसुताय नमः । ॐ महाभागाय नमः । ॐ मङ्गळाय नमः । ॐ मङ्गलप्रदाय नमः । ॐ महावीराय नमः । ॐ
    महाशूराय नमः । ॐ महाबलपराक्रमाय नमः । ॐ महारौद्राय नमः । ॐ महाभद्राय नमः । ॐ माननीयाय नमः ॥ १०॥ ॐ
    दयाकराय नमः । ॐ मानदाय नमः । ॐ अमर्षणाय नमः । ॐ क्रूराय नमः । ॐ तापपापविवर्जिताय नमः । ॐ सुप्रतीकाय
    नमः । ॐ सुताम्राक्षाय नमः । ॐ सुब्रह्मण्याय नमः । ॐ सुखप्रदाय नमः । ॐ वक्रस्तंभादिगमनाय नमः ॥ २०॥
    ॐ वरेण्याय नमः । ॐ वरदाय नमः । ॐ सुखिने नमः । ॐ वीरभद्राय नमः । ॐ विरूपाक्षाय नमः । ॐ विदूरस्थाय नमः
    । ॐ विभावसवे नमः । ॐ नक्षत्रचक्र संचारिणे नमः । ॐ नक्षत्ररूपाय नमः । ॐ क्षात्रवर्जिताय नमः ॥ ३०॥ ॐ
    क्षयवृद्धिविनिर्मुक्ताय नमः । ॐ विचक्षणाय नमः । ॐ अक्षीणफलदाय नमः । ॐ चक्षुर्गोचराय नमः । ॐ शुभलक्षणाय
    नमः । ॐ वीतरागाय नमः । ॐ वीतभयाय नमः । ॐ विज्वराय नमः । ॐ विश्वकारणाय नमः । ॐ नक्षत्रराशि संचाराय
    नमः ॥ ४०॥ ॐ नानाभय निकृंतनाय नमः । ॐ कमनीयाय नमः । ॐ दयासाराय नमः । ॐ कनत्कनकभूषणाय नमः । ॐ भयघ्नाय
    नमः । ॐ भव्यफलदाय नमः । ॐ भक्ताभयवरप्रदाय नमः । ॐ शत्रुहंत्रे नमः । ॐ शमोपेताय नमः । ॐ शरणागत पोषकाय
    नमः ॥ ५०॥ ॐ साहसाय नमः । ॐ सद्गुणाध्यक्षाय नमः । ॐ साधवे नमः । ॐ समरदुर्जयाय नमः । ॐ दुष्टदूराय नमः
    । ॐ शिष्टपूज्याय नमः । ॐ सर्वकष्टनिवारकाय नमः । ॐ दुश्चेष्टावारकाय नमः । ॐ दुःखभंजनाय नमः । ॐ दुर्धराय
    नमः ॥ ६०॥ ॐ हरये नमः । ॐ दुस्स्वप्नहंत्रे नमः । ॐ दुर्धर्षाय नमः । ॐ दुष्टगर्वविमोचकाय नमः । ॐ भरद्वाजकुलोद्भवाय
    नमः । ॐ भूसुताय नमः । ॐ भव्यभूषणाय नमः । ॐरक्तांबराय नमः । ॐरक्तववुषे नमः । ॐ भक्तपालनतत्पराय नमः
    ॥ ७०॥ ॐ चतुर्भुजाय नमः । ॐ गदाधारिणे नमः । ॐ मेषवाहनाय नमः । ॐ मिताशनाय नमः । ॐ शक्तिशूलधराय नमः ।
    ॐ शक्ताय नमः । ॐ शस्त्रविद्याविशारदाय नमः । ॐ तार्किकाय नमः । ॐ तामसाधाराय नमः । ॐ तपस्विने नमः ॥
    ८०॥ ॐ ताम्रलोचनाय नमः । ॐ तप्तकांचनसंकाशाय नमः । ॐ रक्तकिंजल्कसन्निभाय नमः । ॐ गोत्राधिदेवताय नमः
    । ॐ गोमध्यचराय नमः । ॐ गुणविभूषणाय नमः । ॐ असृजे नमः । ॐ अङ्गारकाय नमः । ॐ अवंतीदेशाधीशाय नमः । ॐ
    जनार्दनाय नमः ॥ ९०॥ ॐ सूर्ययाम्य प्रदेशस्थाय नमः । ॐ यौवनाय नमः । ॐ याम्यदिङ्मुखाय नमः । ॐ त्रिकोणमंडलगताय
    नमः । ॐ त्रिदशाधिपसन्नुताय नमः । ॐ शुचये नमः । ॐ शुचिकराय नमः । ॐ शूराय नमः । ॐ शुचिवश्याय नमः । ॐ
    शुभावहाय नमः ॥ १००॥ ॐ मेषवृश्चिकराशीशाय नमः । ॐ मेधाविने नमः । ॐ मितभाषिणे नमः । ॐ सुखप्रदाय नमः ।
    ॐ सुरूपाक्षाय नमः । ॐ सर्वाभीष्टफलप्रदाय नमः । ॐ श्रीमते अङ्गारकाय नमः । इति अङ्गारक अष्टोत्तर शतनामावलिस्समाप्ता
    ॥
