id: paramahansaparivrajaka
category: upanishad
name:
  english: paramahansaparivrajaka
  devanagari: परमहन्सपरिव्राजक
content:
  english: mukaramsham sushuptimatracatushtayam makaramsham turiyamatracatushtayamardhamatramsham | ayameva
    brahmapranavah | sa paramahamsaturiyatitavadhutairupasyah | tenaiva brahma prakashate tena videhamuktih
    | bhagavan kathamayajnopavittyashikhi sarvakarmaparityaktah katham brahmanishthaparah katham brahmana
    iti brahma pricchati | sa hovaca vishnurbhobho'rbhaka yasyastyadvaitamatmajnanam tadeva yajnopavitam
    | tasya dhyananishthaiva shikha | tatkarma sa pavitram | sa sarvakarmakrit | sa brahmanah | sa brahmanishthaparah
    | sa devah | sa rishih | sa tapasvi | sa shreshthah | sa eva sarvajyeshthah | sa eva jagadguruh |
    sa evaham viddhi | loke paramahamsaparivrajako durlabhataro yadyeko'sti | sa eva nityaputah | sa eva
    vedapurusho mahapurusho yastaccittam mayyevavatishthate | aham ca tasminnevavasthitah | sa eva nityatriptah
    | sa shitoshnasukhaduhkhamanavamanavarjitah | sa nindamarshasahishnuh | sa shadurmivarjitah | shadbhavavikarashunyah
    | sa jyeshthajyeshthavyavadhanarahitah | sa svavyatirekena nanyadrashta | ashambaro nanamaskaro na
    svahakaro na svadhakarashca navisarjanaparo nindastuti
  devanagari: मुकारांशं सुषुप्तिमात्राचतुष्टयं मकारांशं तुरीयमात्राचतुष्टयमर्धमात्रांशम् । अयमेव ब्रह्मप्रणवः
    । स परमहंसतुरीयातीतावधूतैरुपास्यः । तेनैव ब्रह्म प्रकाशते तेन विदेहमुक्तिः । भगवन् कथमयज्ञोपवीत्त्यशिखी
    सर्वकर्मपरित्यक्तः कथं ब्रह्मनिष्ठापरः कथं ब्राह्मण इति ब्रह्मा पृच्छति । स होवाच विष्णुर्भोभोऽर्भक
    यस्यास्त्यद्वैतमात्मज्ञानं तदेव यज्ञोपवीतम् । तस्य ध्याननिष्ठैव शिखा । तत्कर्म स पवित्रम् । स सर्वकर्मकृत्
    । स ब्राह्मणः । स ब्रह्मनिष्ठापरः । स देवः । स ऋषिः । स तपस्वी । स श्रेष्ठः । स एव सर्वज्येष्ठः ।
    स एव जगद्गुरुः । स एवाहं विद्धि । लोके परमहंसपरिव्राजको दुर्लभतरो यद्येकोऽस्ति । स एव नित्यपूतः ।
    स एव वेदपुरुषो महापुरुषो यस्तच्चित्तं मय्येवावतिष्ठते । अहं च तस्मिन्नेवावस्थितः । स एव नित्यतृप्तः
    । स शीतोष्णसुखदुःखमानावमानवर्जितः । स निन्दामर्षसहिष्णुः । स षडूर्मिवर्जितः । षड्भावविकारशून्यः ।
    स ज्येष्ठाज्येष्ठव्यवधानरहितः । स स्वव्यतिरेकेण नान्यद्रष्टा । आशाम्बरो ननमस्कारो न स्वाहाकारो न स्वधाकारश्च
    नविसर्जनपरो निन्दास्तुति
