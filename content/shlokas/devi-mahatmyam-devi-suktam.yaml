id: devi-mahatmyam-devi-suktam
category: stotram
name:
  english: Devi Mahatmyam Devi Suktam
content:
  english: om aham rudrebhirvasubhishcaramyahama dityairuta vishvade mmitravarunobha bibharmyahami ndragni
    ahamashvinobha || ndadhami dravinam havishmate supravye ye deva vyadadhuh purutra bhuristhatra ||
    maya so annamatti yo vipashyati yah praniti ya im shrinotyuktam | amantavomanta upakshiyanti shrudhi
    shrutam shraddhiva || ahameva svayamidam ndevebhiruta manushebhih | ya || aham rudraya dhanuratanomi
    brahmadvishe sharave hanta va u | aha || aham suve pitaramasya murdha nmama yonirapsvanta ssamudre
    | tato vitishthe bhuvananu vishvotamu || ahameva vata iva prava rabhamana bhuvanani vishva | paro
    divapara ena prithivyai tavati mahina sambabhuva || shshantih || || iti rigvedokta ndevisuktam samaptam
    || ||ta
  devanagari: ॐ अ॒हं रु॒द्रेभि॒र्वसु॑भिश्चराम्य॒हमा दि॒त्यैरु॒त वि॒श्वदे म्मि॒त्रावरु॑णो॒भा बि॑भर्म्य॒हमि
    न्द्रा॒ग्नी अ॒हम॒श्विनो॒भा ॥ न्द॑धामि॒ द्रवि॑णं ह॒विष्म॑ते सुप्रा॒व्ये॒ ये॑ दे॒वा व्य॑दधुः पुरु॒त्रा
    भूरि॑स्थात्रा॒ ॥ मया॒ सो अन्न॑मत्ति यो वि॒पश्य॑ति॒ यः प्राणि॑ति॒ य ईं शृ॒णोत्यु॒क्तम् । अ॒म॒न्त॒वो॒मान्त
    उप॑क्षियन्ति॒ श्रु॒धि श्रु॑तं श्रद्धि॒व ॥ अ॒हमे॒व स्व॒यमि॒दं न्दे॒वेभि॑रु॒त मानु॑षेभिः । य ॥ अ॒हं
    रु॒द्राय॒ धनु॒रात॑नोमि ब्रह्म॒द्विषे॒ शर॑वे हन्त॒ वा उ॑ । अ॒ह ॥ अ॒हं सु॑वे पि॒तर॑मस्य मू॒र्ध न्मम॒
    योनि॑र॒प्स्व॒न्त स्स॑मु॒द्रे । ततो॒ विति॑ष्ठे॒ भुव॒नानु॒ विश्वो॒तामू ॥ अ॒हमे॒व वात॑ इव॒ प्रवा रभ॑माणा॒
    भुव॑नानि॒ विश्वा । प॒रो दि॒वापर॒ ए॒ना पृ॑थि॒व्यै ताव॑ती महि॒ना सम्ब॑भूव ॥ श्शान्तिः॑ ॥ ॥ इति ऋग्वेदोक्त
    न्देवीसूक्तं समाप्तम् ॥ ॥त
