id: vyasamaharshiproktamrudrastotram
category: stotram
name:
  english: vyasamaharshiproktamrudrastotram
  devanagari: व्यासमहर्षिप्रोक्तंरुद्रस्तोत्रम्
content:
  english: vyasamaharshiproktam rudrastotram vyasa uvaca | namo rudraya mahate devadevaya shuline | tryambakaya
    trinetraya yoginam gurave namah || 1|| namo'stu vamadevaya mahadevaya vedhase | shambhave sthanave
    nityam shivaya parameshthine || 2|| namah somaya rudraya mahagrasaya hetave | prapadye'ham virupaksham
    sharanyam brahmacarinam || 3|| mahadevam mahayogamishanam cambikapatim | yoginam yogadataram yogamayasamavritam
    || 4|| yoginam gurumacaryam yogigamyam pinakinam | samsarataranam rudram brahmanam brahmano'dhipam
    || 5|| shashvatam sarvagam shantam brahmanyam brahmanapriyam | kapardinam kalamurttimamurttim parameshvaram
    || 6|| ekamurttim mahamurttim vedavedyam divaspatim | nilakantham vishvamurttim vyapinam vishvaretasam
    || 7|| kalagnim kaladahanam kamadam kamanashanam | namasye girisham devam candravayavabhushanam ||
    8|| vilohitam lelihanamadityam parameshthinam | ugram pashupatim bhimam bhaskaram paramam tapah ||
    9|| iti kurmapurane purvabhage trimshadhyayantargatam vyasamaharshiproktam shivastotram samaptam |
    kurmapurane purvabhage 30
  devanagari: व्यासमहर्षिप्रोक्तं रुद्रस्तोत्रम् व्यास उवाच । नमो रुद्राय महते देवदेवाय शूलिने । त्र्यम्बकाय
    त्रिनेत्राय योगिनां गुरवे नमः ॥ १॥ नमोऽस्तु वामदेवाय महादेवाय वेधसे । शम्भवे स्थाणवे नित्यं शिवाय
    परमेष्ठिने ॥ २॥ नमः सोमाय रुद्राय महाग्रासाय हेतवे । प्रपद्येऽहं विरूपाक्षं शरण्यं ब्रह्मचारिणम् ॥
    ३॥ महादेवं महायोगमीशानं चाम्बिकापतिम् । योगिनां योगदातारं योगमायासमावृतम् ॥ ४॥ योगिनां गुरुमाचार्यं
    योगिगम्यं पिनाकिनम् । संसारतारणं रुद्रं ब्रह्माणं ब्रह्मणोऽधिपम् ॥ ५॥ शाश्वतं सर्वगं शान्तं ब्रह्मण्यं
    ब्राह्मणप्रियम् । कपर्दिनं कालमूर्त्तिममूर्त्तिं परमेश्वरम् ॥ ६॥ एकमूर्त्तिं महामूर्त्तिं वेदवेद्यं
    दिवस्पतिम् । नीलकण्ठं विश्वमूर्त्तिं व्यापिनं विश्वरेतसम् ॥ ७॥ कालाग्निं कालदहनं कामदं कामनाशनम् ।
    नमस्ये गिरिशं देवं चन्द्रावयवभूषणम् ॥ ८॥ विलोहितं लेलिहानमादित्यं परमेष्ठिनम् । उग्रं पशुपतिं भीमं
    भास्करं परमं तपः ॥ ९॥ इति कूर्मपुराणे पूर्वभागे त्रिंशाध्यायान्तर्गतं व्यासमहर्षिप्रोक्तं शिवस्तोत्रं
    समाप्तम् । कूर्मपुराणे पूर्वभागे ३०
