id: runa-vimochana-angaraka-mangala-stotram
category: stotram
name:
  english: Runa Vimochana Angaraka (Mangala) Stotram
content:
  english: skanda uvaca | rinagrastanaranam tu rinamuktih katham bhavet | brahmovaca | vakshye'ham sarvalokanam
    hitartham hitakamadam || asya shri angaraka stotra mahamantrasya gautama rishih angarako devata mama
    rina vimocanarthe jape viniyogah | dhyanam dharani garbha sambhutam vidyutkanti samaprabham | kumaram
    shaktihastam tam kujam pranamamyaham || || raktamalyambaradharah shulashaktigadadharah | caturbhujo
    meshagato varadashca dharasutah || mangalo bhumiputrashca rinaharta dhanapradah | sthirasano mahakayah
    sarvakarmavabodhakah || || lohito lohitangashca samagayi kripakarah | dharmarajah kujo bhaumo bhumijo
    bhuminandanah || || angarako yamashcaiva sarvarogapaharakah | srishtikarta'paharta ca sarvakamaphalapradah
    || || bhutido grahapujyashca vaktro raktavapuh prabhuh | etani kujanamani yo nityam prayatah pathet
    | rinam na jayate tasya dhanam prapnotyasamshayam || || raktapushpaishca gandhaishca dipadhupadibhistatha
    | mangalam pujayitva tu mangale'hani sarvada || || rinarekhah prakartavyah dagdhangaraistadagratah
    | saptavimshatinamani pathitva tu tadantike || || tashca pramarjayetpashcadvamapadena samsprishan
    | evam kritva na sandeho rinahino dhani bhavet || || bhumijasya prasadena grahapida vinashyati | yenarjita
    jagatkirtirbhumiputrena shashvati || || shatravashca hata yena bhaumena mahitatmana | sa priyatam
    tu bhaumo'dya tushto bhuyat sada mama || angaraka mahiputra bhagavan bhaktavatsala | namo'stu te mamashesha
    rinamashu vimocaya || bhumiputra mahatejah svedodbhava pinakinah | rinartastvam prapanno'smi grihanarghyam
    namo'stu te || || iti rina vimocana angaraka stotram ||
  devanagari: स्कन्द उवाच । ऋणग्रस्तनराणां तु ऋणमुक्तिः कथं भवेत् । ब्रह्मोवाच । वक्ष्येऽहं सर्वलोकानां
    हितार्थं हितकामदम् ॥ अस्य श्री अङ्गारक स्तोत्र महामन्त्रस्य गौतम ऋषिः अङ्गारको देवता मम ऋण विमोचनार्थे
    जपे विनियोगः । ध्यानम् धरणी गर्भ सम्भूतं विद्युत्कान्ति समप्रभम् । कुमारं शक्तिहस्तं तं कुजं प्रणमाम्यहम्
    ॥ ॥ रक्तमाल्याम्बरधरः शूलशक्तिगदाधरः । चतुर्भुजो मेषगतो वरदश्च धरासुतः ॥ मङ्गलो भूमिपुत्रश्च ऋणहर्ता
    धनप्रदः । स्थिरासनो महाकायः सर्वकर्मावबोधकः ॥ ॥ लोहितो लोहिताङ्गश्च सामगायी कृपाकरः । धर्मराजः कुजो
    भौमो भूमिजो भूमिनन्दनः ॥ ॥ अङ्गारको यमश्चैव सर्वरोगापहारकः । सृष्टिकर्ताऽपहर्ता च सर्वकामफलप्रदः ॥
    ॥ भूतिदो ग्रहपूज्यश्च वक्त्रो रक्तवपुः प्रभुः । एतानि कुजनामानि यो नित्यं प्रयतः पठेत् । ऋणं न जायते
    तस्य धनं प्राप्नोत्यसंशयम् ॥ ॥ रक्तपुष्पैश्च गन्धैश्च दीपधूपादिभिस्तथा । मङ्गलं पूजयित्वा तु मङ्गलेऽहनि
    सर्वदा ॥ ॥ ऋणरेखाः प्रकर्तव्याः दग्धाङ्गारैस्तदग्रतः । सप्तविंशतिनामानि पठित्वा तु तदन्तिके ॥ ॥ ताश्च
    प्रमार्जयेत्पश्चाद्वामपादेन संस्पृशन् । एवं कृत्वा न सन्देहो ऋणहीनो धनी भवेत् ॥ ॥ भूमिजस्य प्रसादेन
    ग्रहपीडा विनश्यति । येनार्जिता जगत्कीर्तिर्भूमिपुत्रेण शाश्वती ॥ ॥ शत्रवश्च हता येन भौमेन महितात्मना
    । स प्रीयतां तु भौमोऽद्य तुष्टो भूयात् सदा मम ॥ अङ्गारक महीपुत्र भगवन् भक्तवत्सल । नमोऽस्तु ते ममाशेष
    ऋणमाशु विमोचय ॥ भूमिपुत्र महातेजः स्वेदोद्भव पिनाकिनः । ऋणार्तस्त्वां प्रपन्नोऽस्मि गृहाणार्घ्यं नमोऽस्तु
    ते ॥ ॥ इति ऋण विमोचन अङ्गारक स्तोत्रम् ॥
