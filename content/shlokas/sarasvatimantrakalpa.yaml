id: sarasvatimantrakalpa
category: mantra
name:
  english: sarasvatimantrakalpa
  devanagari: सरस्वतीमन्त्रकल्प
content:
  english: rindram shilatalapute kshitimandalastham | sutrena tat parivritam vidhritam dharayam kuryat
    prasutimukhadivyagaternirodham || 60|| lam || 11|| ranjika dvadashayantroddharah || ajapute likhennama
    glam ksham purnenduveshtitam | vajrashtakaparicchinnamagrantabrahmanaksharam || 61|| tadbahye bhupuram
    lekhyam shilayam talakadina | kopadistambhanam kuryat pitapushpaih supujitam || 62|| om gla~ ksham
    tha lam svaha | samlikhya namashtadalabjamadhye mayavritam shodashasatkalabhih | kli~ blu~ tatha dramatha
    yojayitva dikstheshu patreshu sada kramena || 63|| homam likhedankushabijamuccaih kincanyapatreshu
    bahistrimurttih | bhurje himadyairvidhritam svakanthe saubhagyavriddhim kurute'ngananam || 64|| saubhagyaraksha
    || kshajabhamaharephapindaih pashankushabanaranjikayuktaih | pranavadyaih kuru mantrin | shat karmanyudayamavagamya
    || 65|| om kshmlvryum jmlvryum bmlvryum mmlvryum hmlvryum dmlvryum a~ kro~ hri~ kli~ blu~ drim drim
    samvaushat tribhuvane sarah | sahasra 12 japah | dashamshena homah || vashyavidveshanoccate purvamadhyaparanhake
    | sandhyardharatraratryante marane shantipaushtike || 66|| vashad vashye phaducvate hum dveshe paushtike
    svadha | samvaushadakarshane svaha shantike'vyatha marane || 67|| pitarunasitaih pushpaih stambhanakrishtimarane
    | shantipaushtikayoh shvetairjapenmantram prayatnatah || 68|| kuryad hastena vamena vashyakarshanamohanam
    | sheshakarmani homam ca dakshinena vicakshanah || 69|| udadhindramarutantakanairritakuberadikshu
    kritavadanah | shantikarodhoccatanamaranasampushtijanavashye || 70|| shantipushtau bhaveddhomo durvashrikhandatandulaih
    | mahishaksharankambhojaih purakshobho nigadyate || 71|| karavirarunaih pushpairanganakshobhamuttamam
    | homaih kramukapatranam rajavashyam vidhiyate || 72|| grihadhumanimbapatrairdvijapakshairlavanarajikayuktaih
    | hutaistrisandhyavihitaividvesho bhavati manujanam || 73|| pretalayasthikhandaibimbhitakangarasamadhumayutaih
    | saptahavihitahomairaratimaranam budhairdishtam || 7|| naivedyadipadibhirindrasankhyaih suvarnapadavabhipujya
    devyah | svavamadeshasthitasavyahasto mantri pradadyat sahiranyamambhah || 75|| vidya mayeyam bhavate
    pradatta tvaya na deyanyadrishe janaya | tac shravayitva gurudevatanamagreshu vidya vidhina pradeya
    || 76|| ajnakramah kritina mallishenena jinasenasya sununa | racito bharatikalpah shishtalokabhanoharah
    || 77|| suryacandramasau yavanmedinibhudhararnavah | tavat sarasvatikalpah stheyaccetasi dhimatam
    || 78|| shrimallishenasarasvatavidhirayam
  devanagari: रिन्द्रं शिलातलपुटे क्षितिमण्डलस्थम् । सूत्रेण तत् परिवृतं विधृतं धरायां कुर्यात् प्रसूतिमुखदिव्यगतेर्निरोधम्
    ॥ ६०॥ लम् ॥ ११॥ रञ्जिका द्वादशयन्त्रोद्धारः ॥ अजपुटे लिखेन्नाम ग्लां क्षं पूर्णेन्दुवेष्टितम् । वज्राष्टकपरिच्छिन्नमग्रान्तब्राह्मणाक्षरम्
    ॥ ६१॥ तद्बाह्ये भूपुरं लेख्यं शिलायां तालकादिना । कोपादिस्तम्भनं कुर्यात् पीतपुष्पैः सुपूजितम् ॥ ६२॥
    ॐ ग्लाँ क्षं ठ लं स्वाहा । संलिख्य नामाष्टदलाब्जमध्ये मायावृतं षोडशसत्कलाभिः । क्लीँ ब्लूँ तथा द्रामथ
    योजयित्वा दिक्स्थेषु पत्रेषु सदा क्रमेण ॥ ६३॥ होमं लिखेदङ्कुशबीजमुच्चैः किञ्चान्यपत्रेषु बहिस्त्रिमूर्त्तिः
    । भूर्जे हिमाद्यैर्विधृतं स्वकण्ठे सौभाग्यवृद्धिं कुरुतेऽङ्गनानाम् ॥ ६४॥ सौभाग्यरक्षा ॥ क्षजभमहरेफपिण्डैः
    पाशाङ्कुशबाणरञ्जिकायुक्तैः । प्रणवाद्यैः कुरु मन्त्रिन् । षट् कर्माण्युदयमवगम्य ॥ ६५॥ ॐ क्ष्म्ल्व्र्यूं
    ज्म्ल्व्र्यूं ब्म्ल्व्र्यूं म्म्ल्व्र्यूं ह्म्ल्व्र्यूं ड्म्ल्व्र्यूं आँ क्रोँ ह्रीँ क्लीँ ब्लूँ द्रीं
    द्रीं संवौषट् त्रिभुवने सारः । सहस्र १२ जपः । दशांशेन होमः ॥ वश्यविद्वेषणोच्चाटे पूर्वमध्यापराण्हके
    । सन्ध्यार्धरात्ररात्र्यन्ते मारणे शान्तिपौष्टिके ॥ ६६॥ वषड् वश्ये फडुच्वाटे हुं द्वेषे पौष्टिके स्वधा
    । संवौषडाकर्षणे स्वाहा शन्तिकेऽव्यथ मारणे ॥ ६७॥ पीतारुणासितैः पुष्पैः स्तम्भनाकृष्टिमारणे । शान्तिपौष्टिकयोः
    श्वेतैर्जपेन्मन्त्रं प्रयत्नतः ॥ ६८॥ कुर्याद् हस्तेन वामेन वश्याकर्षणमोहनम् । शेषकर्माणि होमं च दक्षिणेन
    विचक्षणः ॥ ६९॥ उदधीन्द्रमारुतान्तकनैरृतकुबेरदिक्षु कृतवदनः । शान्तिकरोधोच्चाटनमारणसम्पुष्टिजनवश्ये
    ॥ ७०॥ शान्तिपुष्टौ भवेद्धोमो दूर्वाश्रीखण्डतण्डुलैः । महिषाक्षरङ्काम्भोजैः पुरक्षोभो निगद्यते ॥ ७१॥
    करवीरारुणैः पुष्पैरङ्गनाक्षोभमुत्तमम् । होमैः क्रमुकपत्राणां राजवश्यं विधीयते ॥ ७२॥ गृहधूमनिम्बपत्रैर्द्विजपक्षैर्लवणराजिकायुक्तैः
    । हुतैस्त्रिसन्ध्यविहितैविद्वेषो भवति मनुजानाम् ॥ ७३॥ प्रेतालयास्थिखण्डैबिम्भीतकाङ्गारसमधूमयुतैः ।
    सप्ताहविहितहोमैररातिमरणं बुधैर्दिष्टम् ॥ ७॥ नैवेद्यदीपादिभिरिन्द्रसङ्ख्यैः सुवर्णपादावभिपूज्य देव्याः
    । स्ववामदेशस्थितसव्यहस्तो मन्त्री प्रदद्यात् सहिरण्यमम्भः ॥ ७५॥ विद्या मयेयं भवते प्रदत्ता त्वया न
    देयान्यदृशे जनाय । तच् श्रावयित्वा गुरुदेवतानामग्रेषु विद्या विधिना प्रदेया ॥ ७६॥ आज्ञाक्रमः कृतिना
    मल्लिषेणेन जिनसेनस्य सुनुना । रचितो भारतीकल्पः शिष्टलोकभनोहरः ॥ ७७॥ सूर्याचन्द्रमसौ यावन्मेदिनीभूधरार्णवाः
    । तावत् सरस्वतीकल्पः स्थेयाच्चेतसि धीमताम् ॥ ७८॥ श्रीमल्लिषेणसारस्वतविधिरयम्
