    । पि॒तर॒ ष्षट्क॑पालग्ं सवि॒ता द्वाद॑शकपालमिन्द्रा॒ग्नी एका॑दशकपाल॒मिन्द्र॒ एका॑दशकपाल॒मिन्द्रो॒ दश॑कपालं॒
