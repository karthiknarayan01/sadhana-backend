id: pracetasakritamvishnustotram
category: stotram
name:
  english: pracetasakritamvishnustotram
  devanagari: प्रचेतसकृतंविष्णुस्तोत्रम्
content:
  english: pracetasakritam vishnustotram pracetasa ucuh | natah sma sarvavacasam pratishtha yatra shashvati
    | tamadyantamasheshasya jagatah paramam prabhum || 23|| jyotiradyamanaupamyamanvanantamaparavat |
    yonibhutamashshasya sthavarasya carasya ca || 24|| yasyahah prathamam rupamarupasya tatha nisha |
    sandhya ca parameshasya tasmai kalatmane namah || 25|| bhujyate'nudinam devaih pitribhishca sudhatmakah
    | bijabhutam samastasya tasmai somatmanena mah || 26|| yastamasyatti tivratma prabhabhirbhasayannabhah
    | gharmashitambhasam yonistasmai suryatmane namah || 27|| kathinyavan yo bibhartti jagadetadasheshatah
    | shabdadisamshrayo vyapi tasmai bhumyatmane namah || 28|| yadyonibhutam jagato bijam yatsarvadehinam
    | tattoyarupamishasya namamo harimedhasah || 29|| yo mukham sarvadevanam havyabhukkavyabhuktatha |
    pitrinam ca namastasmai vishnave pavakatmane || 30|| pancadhavasthito dehe yashceshtam kurute'nisham
    | akashayonirbhagavamstasmai vayvatmane namah || 31|| avakashamasheshanam bhutanam yah prayacchati
    | anantamurtimanchuddhastasmai vyomatmane namah || 32|| samastendriyasargasya yah sada sthanamuttamam
    | tasmai shabdadirupaya namah krishnaya vedhase || 33|| grihnati vishayannityamindriyatmaksharaksharah
    | yastasmai jnanamulaya natah sma harimedhase || 34|| grihitanindriyairarthanatmane yah prayacchati
    | antahkaranarupaya tasmai vishvatmane namah || 35|| yasminnanante sakalam vishvam yasmattathodgatam
    | layasthanam ca yastasmai namah prakritidharmine || 36|| shuddhah samllakshyate bhrantya gunavaniva
    yo'gunah | tamatmarupinam devam natah sma purushottamam || 37|| avikaramajam shuddham nirgunam yanniranjanam
    | natassma tatparam brahma vishnoryatparamam padam || 38|| adirghahrasvamasthulanvanamashyamalohitam
    | asnehacchayamatanumasaktamasharirinam || 39|| anakashamasamsparshamagandhamarasam ca yat | acakshushrotramacalamavakpanimamanisam
    || 40|| anamagomatrasukhamatejaskamahetukam | abhayam bhrantirahitamanidramajaramaram || 41|| arajoshabdamamritamaplutam
    yadasamvritam | purvaparena vai yasmimstadvishnoh paramam padam || 42|| parameshatvagunavatsarvabhutamasamshayam
    | natah sma tatpadam vishnorjihvadriggocaram na yat || 43|| iti vishnupurane caturdashadhyayantargatam
    pracetasakritam vishnustotram samaptam | vishnupurana | adhyaya 14
  devanagari: प्रचेतसकृतं विष्णुस्तोत्रम् प्रचेतस ऊचुः । नताः स्म सर्ववचसां प्रतिष्ठा यत्र शाश्वती । तमाद्यन्तमशेषस्य
    जगतः परमं प्रभुम् ॥ २३॥ ज्योतिराद्यमनौपम्यमण्वनन्तमपारवत् । योनिभूतमश्षस्य स्थावरस्य चरस्य च ॥ २४॥
    यस्याहः प्रथमं रूपमरूपस्य तथा निशा । सन्ध्या च परमेशस्य तस्मै कालात्मने नमः ॥ २५॥ भुज्यतेऽनुदिनं देवैः
    पितृभिश्च सुधात्मकः । बीजभूतं समस्तस्य तस्मै सोमात्मनेन मः ॥ २६॥ यस्तमास्यत्ति तीव्रात्मा प्रभाभिर्भासयन्नभः
    । घर्मशीताम्भसां योनिस्तस्मै सूर्यात्मने नमः ॥ २७॥ काठिन्यवान् यो बिभर्त्ति जगदेतदशेषतः । शब्दादिसंश्रयो
    व्यापी तस्मै भूम्यात्मने नमः ॥ २८॥ यद्योनिभूतं जगतो बीजं यत्सर्वदेहिनाम् । तत्तोयरूपमीशस्य नमामो हरिमेधसः
    ॥ २९॥ यो मुखं सर्वदेवानां हव्यभुक्कव्यभुक्तथा । पितॄणां च नमस्तस्मै विष्णवे पावकात्मने ॥ ३०॥ पञ्चधावस्थितो
    देहे यश्चेष्टां कुरुतेऽनिशम् । आकाशयोनिर्भगवांस्तस्मै वाय्वात्मने नमः ॥ ३१॥ अवकाशमशेषाणां भूतानां
    यः प्रयच्छति । अनन्तमूर्तिमाञ्छुद्धस्तस्मै व्योमात्मने नमः ॥ ३२॥ समस्तेन्द्रियसर्गस्य यः सदा स्थानमुत्तमम्
    । तस्मै शब्दादिरूपाय नमः कृष्णाय वेधसे ॥ ३३॥ गृह्णाति विषयान्नित्यमिन्द्रियात्माक्षराक्षरः । यस्तस्मै
    ज्ञानमूलाय नताः स्म हरिमेधसे ॥ ३४॥ गृहीतानिन्द्रियैरर्थानात्मने यः प्रयच्छति । अन्तःकरणरूपाय तस्मै
    विश्वात्मने नमः ॥ ३५॥ यस्मिन्ननन्ते सकलं विश्वं यस्मात्तथोद्गतम् । लयस्थानं च यस्तस्मै नमः प्रकृतिधर्मिणे
    ॥ ३६॥ शुद्धः संल्लक्ष्यते भ्रान्त्या गुणवानिव योऽगुणः । तमात्मरूपिणं देवं नताः स्म पुरुषोत्तमम् ॥
    ३७॥ अविकारमजं शुद्धं निर्गुणं यन्निरञ्जनम् । नतास्स्म तत्परं ब्रह्म विष्णोर्यत्परमं पदम् ॥ ३८॥ अदीर्घह्रस्वमस्थूलण्वनमश्यामलोहितम्
    । अस्नेहच्छायमतनुमसक्तमशरीरिणम् ॥ ३९॥ अनाकाशमसंस्पर्शमगन्धमरसं च यत् । अचक्षुश्रोत्रमचलमवाक्पाणिममानिसम्
    ॥ ४०॥ अनामगोमत्रसुखमतेजस्कमहेतुकम् । अभयं भ्रान्तिरहितमनिद्रमजरामरम् ॥ ४१॥ अरजोशब्दममृतमप्लुतं यदसंवृतम्
    । पूर्वापरेण वै यस्मिंस्तद्विष्णोः परमं पदम् ॥ ४२॥ परमेशत्वगुणवत्सर्वभूतमसंशयम् । नताः स्म तत्पदं
    विष्णोर्जिह्वादृग्गोचरं न यत् ॥ ४३॥ इति विष्णुपुराणे चतुर्दशाध्यायान्तर्गतं प्रचेतसकृतं विष्णुस्तोत्रं
    समाप्तम् । विष्णुपुराण । अध्याय १४
