id: shrigayatrisahasranamastotram
category: stotram
name:
  english: shrigayatrisahasranamastotram
  devanagari: श्रीगायत्रीसहस्रनामस्तोत्रम्
content:
  english: raktashvetahiranyaniladhavalairyukta trineetrojjvalam raktam raktanavasrajam maniganairyuktam
