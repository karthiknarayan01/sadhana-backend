id: krishnakritamshrikrishnanarayanastotram
category: stotram
name:
  english: krishnakritamshrikrishnanarayanastotram
  devanagari: कृष्णकृतंश्रीकृष्णनारायणस्तोत्रम्
content:
  english: shrikrishnakritam shrikrishnanarayanastotram shrikrishnastam krishnanarayanam pupuja sadaram
    || 38|| suravalam pitapatam kancukam svarnatarakam | shirastranam sakalgim cavatamsakau kausumau shubhau
    || 39|| pushpaharan parijatakritan dadau gale'rbhakam | upanahau svarnasadhyau komalau pradadau tatha
    || 40|| chatram sucamare ramye rashanam kundale dadau | manim kaustubhajatiyottamam malam ca mauktikim
    || 41|| dadau shribalakrishnaya vamshim dadau mridusvaram | yashtim siddhimayim capi dadau simhasanam
    varam || 42|| evam balaprabhum krishnah pujayitva stutim vyadhat | sarvasakshinnamaste'stu sarvavatarakarana
    || 43|| purushottama muktesha paradhaman namo'stu te | vartamanam ca bhutam ca bhavishyatsarvatha
    yatah || 44|| anvitam rajate saumyam suvyavastham kramanugam | ananvitah prashasta tvam tasmai devaya
    te namah || 45|| anantah shaktayaste'tra kushnanrisimharupishu | radharamashrisvarupastam namami pareshvaram
    || 46|| aham me dhama golokastatha narayano rama | shrirvaikuntham camritam satpadam yasmatpravartate
    || 47|| aksharam dhama yasya'gre samurtam sevakam sada | ishvara avatarashca yadamshagunabhushanam
    || 48|| vyuhashceshvarapalashca lokapala maharshayah | kratucchrayah sura yasya gunaikaikamshamurtayah
    || 49|| bhavantiha tu samsare tam namami pareshvaram | antaratmannanantatmanmadatma~ste namo namah
    || 50|| tvam paratman lokasakshinnanantesha namo'stu te | sarvajna tvam parameshthin jnanajneya namo'stu
    te || 51|| adideva duraradhya parameshvara te namah | mahayogeshvara sadho dayalo te namo namah ||
    52|| parajyotirvashatkara svahakara namo'stu te | sarvadarshana samvarta'gnishomatmannamo'stu te ||
    53|| maharajika siddharcya hiranyavaha te namah | manjukeshin balakeshin dayadeshinnamo'stu te ||
    54|| vibho yajnika yajnesha bhaktanukampa te namah | prasida shrikrishnanarayana tubhyam namo namah
    || 55|| ityuktva shrikrishnadevo natva radha tatha prabhum | yayatuh shrikambharayah sannidhau bhuvanantare
    || 56|| iti shrilakshminarayaniyasamhitayah tretayugasantanatmakasya dvitiyakhande 39
  devanagari: श्रीकृष्णकृतं श्रीकृष्णनारायणस्तोत्रम् श्रीकृष्णस्तं कृष्णनारायणं पुपूज सादरम् ॥ ३८॥ सुरवालं
    पीतपटं कञ्चुकं स्वर्णतारकम् । शिरस्त्राणं सकल्गिं चावतंसकौ कौसुमौ शुभौ ॥ ३९॥ पुष्पहारान् पारिजातकृतान्
    ददौ गलेऽर्भकम् । उपानहौ स्वर्णसाध्यौ कोमलौ प्रददौ तथा ॥ ४०॥ छत्रं सुचामरे रम्ये रशनां कुण्डले ददौ
    । मणिं कौस्तुभजातीयोत्तमं मालां च मौक्तिकीम् ॥ ४१॥ ददौ श्रीबालकृष्णाय वंशीं ददौ मृदुस्वराम् । यष्टिं
    सिद्धिमयीं चापि ददौ सिंहासनं वरम् ॥ ४२॥ एवं बालप्रभुं कृष्णः पूजयित्वा स्तुतिं व्यधात् । सर्वसाक्षिन्नमस्तेऽस्तु
    सर्वावतारकारण ॥ ४३॥ पुरुषोत्तम मुक्तेश परधामन् नमोऽस्तु ते । वर्तमानं च भूतं च भविष्यत्सर्वथा यतः
    ॥ ४४॥ अन्वितं राजते सौम्यं सुव्यवस्थं क्रमानुगम् । अनन्वितः प्रशास्ता त्वं तस्मै देवाय ते नमः ॥ ४५॥
    अनन्ताः शक्तयस्तेऽत्र कुष्णनृसिंहरूपिषु । राधारमाश्रीस्वरूपास्तं नमामि परेश्वरम् ॥ ४६॥ अहं मे धाम
    गोलोकस्तथा नारायणो रमा । श्रीर्वैकुण्ठं चामृतं सत्पदं यस्मात्प्रवर्तते ॥ ४७॥ अक्षरं धाम यस्याऽग्रे
    समूर्तं सेवकं सदा । ईश्वरा अवताराश्च यदंशगुणभूषणम् ॥ ४८॥ व्यूहाश्चेश्वरपालाश्च लोकपाला महर्षयः । क्रतूच्छ्रयाः
    सुरा यस्य गुणैकैकांशमूर्तयः ॥ ४९॥ भवन्तीह तु संसारे तं नमामि परेश्वरम् । अन्तरात्मन्ननन्तात्मन्मदात्मँस्ते
    नमो नमः ॥ ५०॥ त्वं परात्मन् लोकसाक्षिन्ननन्तेश नमोऽस्तु ते । सर्वज्ञ त्वं परमेष्ठिन् ज्ञानज्ञेय नमोऽस्तु
    ते ॥ ५१॥ आदिदेव दुराराध्य परमेश्वर ते नमः । महायोगेश्वर साधो दयालो ते नमो नमः ॥ ५२॥ परज्योतिर्वषट्कार
    स्वाहाकार नमोऽस्तु ते । सर्वदर्शन संवर्ताऽग्निषोमात्मन्नमोऽस्तु ते ॥ ५३॥ महाराजिक सिद्धार्च्य हिरण्यवाह
    ते नमः । मञ्जुकेशिन् बालकेशिन् दयादेशिन्नमोऽस्तु ते ॥ ५४॥ विभो याज्ञिक यज्ञेश भक्तानुकम्प ते नमः ।
    प्रसीद श्रीकृष्णनारायण तुभ्यं नमो नमः ॥ ५५॥ इत्युक्त्वा श्रीकृष्णदेवो नत्वा राधा तथा प्रभुम् । ययतुः
    श्रीकम्भरायाः सन्निधौ भुवनान्तरे ॥ ५६॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः त्रेतायुगसन्तानात्मकस्य द्वितीयखण्डे
    ३९
