id: shankarakritamganeshastotram
category: stotram
name:
  english: shankarakritamganeshastotram
  devanagari: शन्करकृतंगणेशस्तोत्रम्
content:
  english: shankarakritam ganeshastotram shankara uvaca | namasyami mahabahum devadevam ganeshvaram |
    hastivaktram mahakayam vyaghracarmambaracchadam || 2|| candrarashmipratikasham carudamshtrojjvalananam
    | bhaktanam vighnashamanam suradyam parvatisutam || 3|| parashvadhadharam viramakshamalavibhushitam
    | brahmanyam varadam saumyam vighnanam patimurjitam || 4|| pinasyam lambajatharam harabhararpitodaram
    | ashtami ca caturthi ca vrita yena caturdashi || 5|| kulmashotklopikapupairmodakairodanena ca | pujayanti
    jana loke dhupamalyanulepanaih || 6|| svastivacanakaishcaiva tesham nastiha durlabham | putrarthi
    labhate putrandhanarthi dhanamuttamam || 7|| vyadhitashca tatha''rogyam baddho mucyeta bandhanat |
    tvam tu sampujayitva vai varadam kamarupinam || 8|| ishtankamanavapnoti natra karya vicarana | yashcadhite
    stavamimam tava nityam ganeshvara || 9|| tasyapi sarvakamanam sada data bhavishyasi | iti vishnudharmottarapurane
    prathamakhande 225
  devanagari: शङ्करकृतं गणेशस्तोत्रम् शङ्कर उवाच । नमस्यामि महाबाहुं देवदेवं गणेश्वरम् । हस्तिवक्त्रं
    महाकायं व्याघ्रचर्माम्बरच्छदम् ॥ २॥ चन्द्ररश्मिप्रतीकाशं चारुदंष्ट्रोज्ज्वलाननम् । भक्तानां विघ्नशमनं
    सुराद्यं पार्वतीसुतम् ॥ ३॥ परश्वधधरं वीरमक्षमालाविभूषितम् । ब्रह्मण्यं वरदं सौम्यं विघ्नानां पतिमूर्जितम्
    ॥ ४॥ पीनास्यं लम्बजठरं हारभारार्पितोदरम् । अष्टमी च चतुर्थी च वृता येन चतुर्दशी ॥ ५॥ कुल्माषोत्क्लोपिकापूपैर्मोदकैरोदनेन
    च । पूजयन्ति जना लोके धूपमाल्यानुलेपनैः ॥ ६॥ स्वस्तिवाचनकैश्चैव तेषां नास्तीह दुर्लभम् । पुत्रार्थी
    लभते पुत्रान्धनार्थी धनमुत्तमम् ॥ ७॥ व्याधितश्च तथाऽऽरोग्यं बद्धो मुच्येत बन्धनात् । त्वां तु सम्पूजयित्वा
    वै वरदं कामरूपिणम् ॥ ८॥ इष्टान्कामानवाप्नोति नात्र कार्या विचारणा । यश्चाधीते स्तवमिमं तव नित्यं गणेश्वर
    ॥ ९॥ तस्यापि सर्वकामानां सदा दाता भविष्यसि । इति विष्णुधर्मोत्तरपुराणे प्रथमखण्डे २२५
