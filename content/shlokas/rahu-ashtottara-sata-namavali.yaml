    नमः । ॐ पैठीनसकुलोद्भवाय नमः ॥ ॥ ॐ दीर्घ कृष्णाय नमः । ॐ अशिरसे नमः । ॐ विष्णुनेत्रारये नमः । ॐ देवाय
    नमः । ॐ दानवाय नमः । ॐ भक्तरक्षाय नमः । ॐ राहुमूर्तये नमः । ॐ सर्वाभीष्टफलप्रदाय नमः ॥
