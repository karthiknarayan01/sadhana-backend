id: ramodantam
category: stotram
name:
  english: ramodantam
  devanagari: रामोदन्तम्
content:
  english: rinu me'bhihitam vakyam jnatva ravanimanasam || 24|| duratmana krita maya rakshasendrasutena
    vai | nikumbhilayam homam tu kritam tenadhuna kila || 25|| lakshmanam preshayadyaiva maya saha samantrina
    | krite home tatra ripurajeyo bhavati dhruvam || 26|| uvaca ramah saumitrim rakshasendrasutam jahi
    | gaccheti shighram suhrida ravanasyanujena sah || 27|| lakshmanastu tada ramamamantrya savibhishanah
    | nikumbhilam prapa turnamindrajidyatra vartate || 28|| adarshayadbhratriputram dharmatma sa vibhishanah
    | lakshmano bhedayamasa rakshasancharasancayaih || 29|| kritva ciram tatra yuddhamaindrenastrena vai
    rusha | shirashciccheda saumitrirdashananasutasya hi || 30|| sa sutasya vadham shrutva ravanah shokakarshitah
    | nashtadhairyo vihvalango vilalapakulendriyah || 31|| nirarthakam tu majjanma jalpitam ca nirarthakam
    | yenahamadya pashyami hatamindrajitam rane || 32|| kva gato'si hatah shura manushena padatina | rajyadbhrashtena
    dinena tyaktva mam putra jivitam || 33|| indram jitva tu tam baddhva lankamaniya vai balat | akarostvam
    pratapena karagrihanivasinam || 34|| mocayamasa brahma tvam santvayitvamaradhipam | tadriktvam kutra
    mam tyaktva gato'dya sudurasadah || 35|| kim karishyamyaham putra kva gacchami vadadhuna | naya mam
    yatra gantasi tatra te na vilambanam || 36|| lokeshu tvatsamo nasti tadrishasya pitasmyaham | ityashaya
    sthitam putra garvitena mayatra hi || 37|| dhumraksho vajradamshtrashca kumbhakarnah pratapavan |
    rakshasa nihatah sarve prahastapramukha api || 38|| anadritya tu tansarvanrakshasanprahritanapi |
    avashtabhya balam putra sukhenavasthitam tava || 39|| ityevam bahudha tatra vilapya sa tu ravanah
    | antarniyamya duhkhani kopam cakre sudarunam || 40|| ratham suta mamagre tvam kshipram kuru jayaishinah
    | ramam salakshmanam hantum nirgamishyamyaham grihat || 41|| ityuktva rathamaruhya shighram sarathivahitam
    | ramena saha sangamya yuddham cakre sudarunam || 42|| tato matalinanitam rathamaindram samaruhan
    | raraja ramo dharmatma hyudayastho yatha ravih || 43|| cakara yuddham tumulam devavrinde ca pashyati
    | sitaharanajatkopadramo dharmabhritam varah || 44|| athagastyasya vacanadravanam lokakantakam | jaghana
    ramo lakshmivanbrahmenastrena tam rane || 45|| mandodari vadham shrutva bhartuh priyatarasya sa |
    vilalapa ranam gatva kurariva bhrishatura || 46|| vibhishano'tha ramena sandishtah saha rakshasaih
    | cakara dahanam tasya ravanasya gatayushah || 47|| athagnivacanatsitam ramo vikshya sunirmalam |
    sandishto devavrindaishca jagraha pitrisannidhau || 48|| tavaiva yuktam karmaitatsarvalokabhayankaram
    | tadvaidehyah krite rama sa tu lakshmirbhavansvabhuh || 49|| ityevam devasanghaishca munibhishcabhipujitah
    | lakshmanashca tutoshatha ramo vishvasamayayau || 50|| vibhishanasya dharmatma satyasandha udaradhih
    | karayamasa lakshmivananujenabhishecanam || 51|| tatah pushpakamaruhya saha mitrairjagatpatih | bharyanujabhyam
    sahitah kishkindham prapa raghavah || 52|| kishkindhanilayah sarvah kapinam yoshitah priyah | sitakutuhalatpushpam
    vimanam tah samaruhan || 53|| atha dasharathih shrimanbharatam drashtumicchaya | bharadvajashramam
    praptastatra tena nivaritah || 54|| bharatasyantikam ramah preshayamasa marutim | ramasyadarshanadvahnipravesham
    kankshato bhrisham || 55|| tatra tena munindrena sanujah sasuhridganah | santoshavivashenatha ramo'pi
    vidhipujitah || 56|| ramo'tha saha sangamya bharatenarighatina | ayodhyam pravishatturnam matribhishcabhinanditah
    || 57|| athayodhyanivasaste janah sarve'pi toshitah | abhigamyabruvanramam dhanya vayamiti drutam
    || 58|| catakastu ghanandrishtva mayurashca yatha shishun | asadya matarastosham tatha prapurjana
    bhuvi || 59|| athabhishekam ramasya vasishthadya muda'nvitah | sahita mantribhishcakrurvasavo vasavam
    yatha || 60|| abhishekotsave sarve sugrivadyah kapishvarah | yatharham pujitashcasan sraggandhambarabhushanaih
    || 61|| vishishya muktaharena sitaya hanumanmudam | pujitashca tatha lebhe yatha sitavalokane || 62||
    sarvasam vanarinam ca kausalya putravatsala | bhushanairbhushayamasa vastracandanakunkumaih || 63||
    ramajnayatha sarve'pi sugrivadiplavangamah | kishkindham lebhire kricchracchriramavirahaturah || 64||
    atibhakto dirghajivi lankasamarasadhakah | anujnatah sa ramena lankam prayadvibhishanah || 65|| pitussimhasanam
    prapya bhratribhih sahito'naghah | viraraja tatha ramo yatha vishnustrivishtape || 66|| lakshmananumate
    ramo yauvarajyam tu dattavan | bharatayaprameyaya pranatpriyataraya sah || 67|| catvaraste mahatmanah
    sabharya raghusattamah | khe sataro yatha candrastatha rejuh svapattane || 68|| || iti shriramodante
    yuddhakandah samaptah || || atha uttarakandah || raja paryagrahideva bharyam ravanadushitam | ityajnajanavadena
    ramastatyaja maithilim || 1|| tadviditvatha valmikiraniyainam nijashramam | antarvartnim samashvasya
    tatraivavasayatsukham || 2|| rishibhih prarthitasyatha raghavasya niyogatah | shatrughno lavanam yuddhe
    nihatyainanapalayat || 3|| tapasyantam tatah shudram shambukakhyam raghuttamah | hatva viprasya kasyapi
    mritam putramajivayat || 4|| rame hemamayim patnim kritva yajnam vitanvati | aniya sasutam sitam tasmai
    pracetaso dadau || 5|| shankyamana punashcaivam ramena janakatmaja | bhumya prarthitaya dattam vivaram
    pravivesha sa || 6||
  devanagari: ृणु मेऽभिहितं वाक्यं ज्ञात्वा रावणिमानसम् ॥ २४॥ दुरात्मना कृता माया राक्षसेन्द्रसुतेन वै
    । निकुम्भिलायां होमं तु कृतं तेनाधुना किल ॥ २५॥ लक्ष्मणं प्रेषयाद्यैव मया सह समन्त्रिणा । कृते होमे
    तत्र रिपुरजेयो भवति ध्रुवम् ॥ २६॥ उवाच रामः सौमित्रिं राक्षसेन्द्रसुतं जहि । गच्छेति शीघ्रं सुहृदा
    रावणस्यानुजेन सः ॥ २७॥ लक्ष्मणस्तु तदा राममामन्त्र्य सविभीषणः । निकुम्भिलां प्राप तूर्णमिन्द्रजिद्यत्र
    वर्तते ॥ २८॥ अदर्शयद्भ्रातृपुत्रं धर्मात्मा स विभीषणः । लक्ष्मणो भेदयामास राक्षसाञ्छरसञ्चयैः ॥ २९॥
    कृत्वा चिरं तत्र युद्धमैन्द्रेणास्त्रेण वै रुषा । शिरश्चिच्छेद सौमित्रिर्दशाननसुतस्य हि ॥ ३०॥ स सुतस्य
    वधं श्रुत्वा रावणः शोककर्शितः । नष्टधैर्यो विह्वलाङ्गो विललापाकुलेन्द्रियः ॥ ३१॥ निरर्थकं तु मज्जन्म
    जल्पितं च निरर्थकम् । येनाहमद्य पश्यामि हतमिन्द्रजितं रणे ॥ ३२॥ क्व गतोऽसि हतः शूर मानुषेण पदातिना
    । राज्याद्भ्रष्टेन दीनेन त्यक्त्वा मां पुत्र जीवितम् ॥ ३३॥ इन्द्रं जित्वा तु तं बद्ध्वा लङ्कामानीय
    वै बलात् । अकरोस्त्वं प्रतापेन कारागृहनिवासिनम् ॥ ३४॥ मोचयामास ब्रह्मा त्वां सान्त्वयित्वामराधिपम्
    । तादृक्त्वं कुत्र मां त्यक्त्वा गतोऽद्य सुदुरासदः ॥ ३५॥ किं करिष्याम्यहं पुत्र क्व गच्छामि वदाधुना
    । नय मां यत्र गन्तासि तत्र ते न विलम्बनम् ॥ ३६॥ लोकेषु त्वत्समो नास्ति तादृशस्य पितास्म्यहम् । इत्याशया
    स्थितं पुत्र गर्वितेन मयात्र हि ॥ ३७॥ धूम्राक्षो वज्रदंष्ट्रश्च कुम्भकर्णः प्रतापवान् । राक्षसा निहताः
    सर्वे प्रहस्तप्रमुखा अपि ॥ ३८॥ अनादृत्य तु तान्सर्वान्राक्षसान्प्रहृतानपि । अवष्टभ्य बलं पुत्र सुखेनावस्थितं
    तव ॥ ३९॥ इत्येवं बहुधा तत्र विलप्य स तु रावणः । अन्तर्नियम्य दुःखानि कोपं चक्रे सुदारुणम् ॥ ४०॥ रथं
    सूत ममाग्रे त्वं क्षिप्रं कुरु जयैषिणः । रामं सलक्ष्मणं हन्तुं निर्गमिष्याम्यहं गृहात् ॥ ४१॥ इत्युक्त्वा
    रथमारुह्य शीघ्रं सारथिवाहितम् । रामेण सह सङ्गम्य युद्धं चक्रे सुदारुणम् ॥ ४२॥ ततो मातलिनानीतं रथमैन्द्रं
    समारुहन् । रराज रामो धर्मात्मा ह्युदयस्थो यथा रविः ॥ ४३॥ चकार युद्धम् तुमुलं देववृन्दे च पश्यति ।
    सीताहरणजात्कोपाद्रामो धर्मभृतां वरः ॥ ४४॥ अथागस्त्यस्य वचनाद्रावणं लोककण्टकम् । जघान रामो लक्ष्मीवान्ब्राह्मेणास्त्रेण
    तं रणे ॥ ४५॥ मन्दोदरी वधं श्रुत्वा भर्तुः प्रियतरस्य सा । विललाप रणं गत्वा कुररीव भृशातुरा ॥ ४६॥ विभीषणोऽथ
    रामेण सन्दिष्टः सह राक्षसैः । चकार दहनं तस्य रावणस्य गतायुषः ॥ ४७॥ अथाग्निवचनात्सीतां रामो वीक्ष्य
    सुनिर्मलाम् । सन्दिष्टो देववृन्दैश्च जग्राह पितृसन्निधौ ॥ ४८॥ तवैव युक्तं कर्मैतत्सर्वलोकभयङ्करम्
    । तद्वैदेह्याः कृते राम सा तु लक्ष्मीर्भवान्स्वभूः ॥ ४९॥ इत्येवं देवसङ्घैश्च मुनिभिश्चाभिपूजितः ।
    लक्ष्मणश्च तुतोषाथ रामो विश्वासमाययौ ॥ ५०॥ विभीषणस्य धर्मात्मा सत्यसन्ध उदारधीः । कारयामास लक्ष्मीवाननुजेनाभिषेचनम्
    ॥ ५१॥ ततः पुष्पकमारुह्य सह मित्रैर्जगत्पतिः । भार्यानुजाभ्यां सहितः किष्किन्धां प्राप राघवः ॥ ५२॥
    किष्किन्धानिलयाः सर्वाः कपीनां योषितः प्रियाः । सीताकुतूहलात्पुष्पं विमानं ताः समारुहन् ॥ ५३॥ अथ दाशरथिः
    श्रीमान्भरतं द्रष्टुमिच्छया । भरद्वाजाश्रमं प्राप्तस्तत्र तेन निवारितः ॥ ५४॥ भरतस्यान्तिकं रामः प्रेषयामास
    मारुतिम् । रामस्यादर्शनाद्वह्निप्रवेशं काङ्क्षतो भृशम् ॥ ५५॥ तत्र तेन मुनीन्द्रेण सानुजः ससुहृद्गणः
    । सन्तोषविवशेनाथ रामोऽपि विधिपूजितः ॥ ५६॥ रामोऽथ सह सङ्गम्य भरतेनारिघातिना । अयोध्यां प्राविशत्तूर्णं
    मातृभिश्चाभिनन्दितः ॥ ५७॥ अथायोध्यानिवासास्ते जनाः सर्वेऽपि तोषिताः । अभिगम्याब्रुवन्रामं धन्या वयमिति
    द्रुतम् ॥ ५८॥ चातकास्तु घनान्दृष्ट्वा मयूराश्च यथा शिशून् । आसाद्य मातरस्तोषं तथा प्रापुर्जना भुवि
    ॥ ५९॥ अथाभिषेकं रामस्य वसिष्ठाद्या मुदाऽन्विताः । सहिता मन्त्रिभिश्चक्रुर्वसवो वासवं यथा ॥ ६०॥ अभिषेकोत्सवे
    सर्वे सुग्रीवाद्याः कपीश्वराः । यथार्हं पूजिताश्चासन् स्रग्गन्धाम्बरभूषणैः ॥ ६१॥ विशिष्य मुक्ताहारेण
    सीतया हनुमान्मुदम् । पूजितश्च तथा लेभे यथा सीतावलोकने ॥ ६२॥ सर्वासां वानरीणां च कौसल्या पुत्रवत्सला
    । भूषणैर्भूषयामास वस्त्रचन्दनकुङ्कुमैः ॥ ६३॥ रामाज्ञयाथ सर्वेऽपि सुग्रीवादिप्लवङ्गमाः । किष्किन्धां
    लेभिरे कृच्छ्राच्छ्रीरामविरहातुराः ॥ ६४॥ अतिभक्तो दीर्घजीवी लङ्कासमरसाधकः । अनुज्ञातः स रामेण लङ्कां
    प्रायाद्विभीषणः ॥ ६५॥ पितुस्सिंहासनं प्राप्य भ्रातृभिः सहितोऽनघः । विरराज तथा रामो यथा विष्णुस्त्रिविष्टपे
    ॥ ६६॥ लक्ष्मणानुमते रामो यौवराज्यं तु दत्तवान् । भरतायाप्रमेयाय प्राणात्प्रियतराय सः ॥ ६७॥ चत्वारस्ते
    महात्मानः सभार्या रघुसत्तमाः । खे सतारो यथा चन्द्रस्तथा रेजुः स्वपत्तने ॥ ६८॥ ॥ इति श्रीरामोदन्ते
    युद्धकाण्डः समाप्तः ॥ ॥ अथ उत्तरकाण्डः ॥ राजा पर्यग्रहीदेव भार्यां रावणदूषिताम् । इत्यज्ञजनवादेन रामस्तत्याज
    मैथिलीम् ॥ १॥ तद्विदित्वाथ वाल्मीकिरानीयैनां निजाश्रमम् । अन्तर्वर्त्नीं समाश्वास्य तत्रैवावासयत्सुखम्
    ॥ २॥ ऋषिभिः प्रार्थितस्याथ राघवस्य नियोगतः । शत्रुघ्नो लवणं युद्धे निहत्यैनानपालयत् ॥ ३॥ तपस्यन्तं
    ततः शूद्रं शम्बूकाख्यं रघूत्तमः । हत्वा विप्रस्य कस्यापि मृतं पुत्रमजीवयत् ॥ ४॥ रामे हेममयीं पत्नीं
    कृत्वा यज्ञं वितन्वति । आनीय ससुतां सीतां तस्मै प्राचेतसो ददौ ॥ ५॥ शङ्क्यमाना पुनश्चैवं रामेण जनकात्मजा
    । भूम्या प्रार्थितया दत्तं विवरं प्रविवेश सा ॥ ६॥
