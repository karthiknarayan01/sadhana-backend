id: hanumanastotram
category: stotram
name:
  english: hanumanastotram
  devanagari: हनुमानस्तोत्रम्
content:
  english: hara sankatam me || 6|| yannamadheyapadakashrutimatrato'pi yebrahmarakshasapishacaganashca
    bhutah | te marikashca sabhayam hyapayanti sa tvam
  devanagari: हर सङ्कटं मे ॥ ६॥ यन्नामधेयपदकश्रुतिमात्रतोऽपि येब्रह्मराक्षसपिशाचगणाश्च भूताः । ते मारिकाश्च
    सभयं ह्यपयान्ति स त्वं
meaning: {}
