id: mahanyasam-complete
category: stotram
name:
  english: Mahanyasam (Complete)
content:
  english: kalasha pratishthapana mantrah brahmajajnana ssuruco vena avah | sa budhniya upama asya vishtha
    masatashca vivah | nake suparna mupaya tpatantagm hrida venanto abhyacaksha tatva | hiranyapaksham
    ya~masya yonau shakuna mbhuranyum | apyayasva sametu te vishvatah soma vrishniyam | bhava vajasya
    sangathe | yo rudro agnau yo aphsu ya oshadhishu yo rudro vishva bhuvana ''vivesha tasmai rudraya
    namo astu | vi~shnu rvicakrame tredha nidadhe padam | samudhamasya pagm sure | indram ngirah | rathitamagm
    rathinam va~janagm satpati m | apo va idamgm sarvam vi~shva bhutanyapah prana va apah pashava apo
    ssamradapo viradapa shchandagshyapo jyotigshyapo yajugshyapa ssarva devata apo bhurbhuvassuvarapa
    om | apah pranayati | shraddha va apah | shraddhamevarabhya praniya pracarati | apah pranayati | yajno
    va apah | yajnamevarabhya praniya pracarati | apah pranayati | vajro va apah | vajrameva bhratrivyebhyah
    prahritya praniya pracarati | apah pranayati | apo vai rakshoghnih | rakshasamapahatyai | apah pranayati
    | apo vai devana ndhama | devanameva priya ndhama praniya pracarati | apah pranayati | apo vai sarva
    devatah | devata evarabhya praniya pracarati | apah pranayati | apo vai shantah | shantabhirevasya
    shucagm shamayati | devo vah savito cchidrena pavitrena vasossuryasya rashmibhih || kurcagrai rrakshasa
    nghoran chindhi karmavighatinah | tvamarpayami kumbhe nkuru karmani | vriksharaja samudbhuta shshakhayah
    pallavatva cah | yushman kumbheshvarpayami sarvapapapanuttaye | nalikera samudbhuta trinetra hara
    sammita | shikhaya duritam sarva nca me nuda | sa hi ratnani dashushe suvati savita bhagah | ta tatva
    yami brahmana vandamana ste yajamano havirbhih | ahedamano varuneha boddhyurushagmsa ma na ayuh pramoshih
    || o mbhurbhuvassuvarom | asmin kumbhe varunamavahayami | varunasya idamasanam | varunaya namah |
    sakalaradhanai ssvarcitam | ratnasimhasanam samarpayami | padyam samarpayami | arghyam samarpayami
    | acamaniyam samarpayami | madhuparkkam samarpayami | snanam samarpayami | snananantaram acamaniyam
    samarpayami | vastrottariyam samarpayami | upavitam samarpayami | gandha ndharayami | akshatan samarpayami
    | pushpani samarpayami | va~runaya namah | nanavidha parimala patra pushpani samarpayami | dhupam
    aghrapayami | dipa shayami | dhupadipanantaram acamaniyam samarpayami | o mbhurbhuvassuvah | tathsaviturvare
    mbhargo devasya dhimahi | dhiyo yona pracodaya t | deva savitah prasuvah | satya ntvartena parishincami
    | ntva satyena parishincami mbhavatu | amritopastaranamasi | o mpranaya svaha | om apanaya svaha |
    om vya~naya svaha | om udanaya svaha | om samanaya svaha | o mbrahmane svaha | kadaliphala nnivedayami
    | maddhyemaddhye amritapaniyam samarpayami | amritapidhanamasi | naivedyanantaram acamaniyam samarpayami
    | tambulam samarpayami | karpura nirajana shayami | nirajananantaram acamaniyam samarpayami | mantra
    pushpam samarpayami | suvarna pushpam samarpayami | samastopacaran samarpayami || pancanga rudranyasah
    athatah pancangarudranam nyasapurvaka khyasyamah | athatah pancangarudranam nyasapurvaka nkarishyamanah
    | harih om athatah pancanga rudranam || onkaramantra sam ndhyayanti yoginah | kamada ntasmai onkaraya
    namo namah || namaste deva devesha namaste parameshvara | namaste vrishabharudha nakaraya namo namah
    || o nnamo bhagavate rudraya || o mbhurbhuvassuvah || o nnam || namaste rudra manyava utota ishave
    namah | namaste astu dhanvane bahubhyamuta te namah || ya ta ishuh shivatama shiva mbabhuva te dhanuh
    | shiva sharavya ya tava taya no rudra mridaya | o nnamo bhagavate rudraya || nam om | purvanga rudraya
    namah || mmahapatakanashanam | mahapapaharam va~nde makaraya namo namah || o mbhurbhuvassuvah || o
    nnidhanapataye namah | nidhanapatantikaya namah | urdhvaya namah | urdhvalingaya namah | hiranyaya
    namah | hiranyalingaya namah | suvarnaya namah | suvarnalingaya namah | divyaya namah | divyalingaya
    namah | bhavayah namah | bhavalingaya namah | sharvaya namah | sharvalingaya namah | shivaya namah
    | shivalingaya namah | jvalaya namah | jvalalingaya namah | atmaya namah | atmalingaya namah | paramaya
    namah | paramalingaya namah | etathsomasya suryasya sarvalingagg sthapayati panimantra nnamo bhagavate
    rudraya || mam om || dakshinanga rudraya namah || lo~kanugrahakaranam | shivameka va~nde shikaraya
    namo namah || o mbhurbhuvassuvah || om shim || apaitumrityuramrita nna agan vaivasvato no abhaya va~naspaterivabhinashshiyatagm
    rayissacata nnamo bhagavate rudraya || shim om || pashcimanga rudraya namah || vri~shabho yasya vasuki
    kanthabhushanam | vame shaktidharam va~nde vakaraya namo namah || o mbhurbhuvassuvah || om ngranthirasi
    rudro ma vishantakah | tenannena nnamo bhagavate rudraya vishnave mrityurme pahi || o nnamo bhagavate
    rudraya || vam om || uttaranga rudraya namah || ndevam sarvavyapinamishvaram | yallinga mbhurbhuvassuvah
    || om ya~m || yo rudro agnau yo apsu ya oshadhishu yo rudro vishva bhuvana vivesha tasmai rudraya
    namo astu || o nnamo bhagavate rudraya || yam om || urdhvanga rudraya namah || nnam || tatpurushaya
    vidmahe mahadevaya dhimahi | tanno rudrah pracodaya va~rtagni tatitpradipta kanaka prasparthi tejomayam
    | gambhiradhvani samavedajanaka ntamradharam sundaram | ardhendudyuti lolapingala jatabharaprabaddhoragam
    | vande siddha surasurendranamita nnamo bhagavate rudraya || o nnam || purva mukhaya namah || aghore
    bhyo ghoraghoratarebhyah || sarve bhyo namaste astu rudrarupebhyah || kalabhrabhramaranjanadyutinibham
    vya~vritta pingekshanam karnodbhasita bhogimastaka maniprodgirna damshtrankuram | sarpaprota kapala
    shukti shakala vyakirna sacchekharam vande dakshinamishvarasya kutila bhrubhanga raudra nnamo bhagavate
    rudraya || o mmam || dakshina mukhaya namah || sadyo jata mprapadyami sadyo jataya vai namo namah
    | bhave bhave nati bhave bhavasva mam | bhavo dbhavaya namah || praleyacalamindukunda dhavala ngokshiraphenaprabham
    bhasmabhyaktamananga deha dahana jvalavali locanam | brahmendradi marudganaisputipadai rabhyarcitam
    nkalankarahitam sthanormukha nnamo bhagavate rudraya || om shim || pashcima mukhaya namah || vamadevaya
    namo jyeshthaya namah shreshthaya namo rudraya namah kalaya namah kalavikaranaya namo balavikaranaya
    namo balaya namo balapramathanaya nama ssarvabhutadamanaya namo manonmanaya namah || gaura nkunkuma
    pankilam stilakam vya~pandu gandasthalam bhruvikshepa kataksha lasatsamsakta karnotphalam | snigdha
    nkritam vande purna shashanka mandalanibham va~ktram harasyottaram || o nnamo bhagavate rudraya ||
    om va~m || uttara mukhaya namah || ishana rbrahmano 'dhipati rbrahma shivo me astu sadashivom || vyaktavyakta
    gunetara mparataram shattrimshatattvatmakam tasmaduttama tattvamaksharamida ndhyeyam sada yogibhih
    | onkaradi samasta mantrajanakam sukshmadi sukshma mpancamamishvarasya vadana vya~pti tejomayam ||
    o nnamo bhagavate rudraya || om va~m || urdhva mukhaya namah || dinnamaskarah purve pashupatih patu
    | dakshine patu shankarah | pashcime patu vishveshah | nilakanthastadottare || ishanya mpatu me sharvah
    | agneya mparvatipatih | nairitya mpatu me rudrah | vayavya nnilalohitah || urdhve trilocanah patu
    | adharaya mmaheshvarah | etabhyo dasha digbhyastu | sarvatah patu shankarah || na rudro rudramarcaye
    'bhishekavidhi vyakhyasyamah | anganyasah ya te rudra shiva tanuraghora 'papakashini | taya na stanuva
    shantamaya girishantabhi cakashihi | shikhayai namah | 'ntarikshe bhava adhi | teshagm sahasrayojane
    'vadhanvani tanmasi | shirase namah | sahasrani sahasrasho ye rudra adhi bhumya 'vadhanvani tanmasi
    | lalataya namah | dvasurantarikshasaddhota vedishadatithi rduronasat | nrishadvara sadvyoma sadabja
    goja ritaja adrija rita mbrihat | bhruvormaddhyaya namah | mpushtivardhanam | urvarukamiva bandhanan
    mrityo ssrutyaya ca pathyaya ca namah katyaya ca nipyaya ca | karnabhya ma nastoke tanaye ma na ayushi
    ma no goshu ma no ashveshu ririshah | viranmano rudra bhamito vadhir havishmanto namasa vidhema te
    | nasikabhya avatatya dhanustvagm sahasraksha shateshudhe | nishirya shalyana mmukha shivo nah sumana
    bhava | mukhaya namah | nilagriva shshitikantha kshamacarah | teshagm sahasrayojane ' vadhanvani tanmasi
    | kanthaya namah | shshitikantha divagm rudra upashritah | teshagm sahasrayojane ' vadhanvani tanmasi
    | upakanthaya namah | namaste astvayudhaya | ubhabhyamuta te namo bahubhya ntava dhanvane | bahubhya
    rmidhushtama haste babhuva te dhanuh | taya 'sman vishvatastva mayakshmaya paribbhuja | upabahubhya
    parino rudrasya heti rvrinaktu paritveshasya durmatiraghayoh | ava sthira maghavadbhyah tanushva midhvastokaya
    tanayaya mridaya | manibandhabhya ye tirthani pracaranti srikavanto nishanginah | teshagm sahasrayojane
    ' vadhanvani tanmasi | hastabhya mprapadyami sadyo jataya vai namo namah | bhave bhave nati bhave
    bhavasva mam | bhavo dbhavaya namah || agumshthabhya jyeshthaya namah shreshthaya namo rudraya namah
    kalaya namah kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya
    namo manonmanaya namah | tarjanibhya bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudra rupebhyah
    || maddhyamabhya tatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodaya ssarvabhutanam rahmadhipati
    rbrahmano 'dhipati rbrahma shivo me astu sadashivom || kanishthikabhya namo vah kirikebhyo devanagm
    hridayebhyah | hridayaya namah | namo ganebhyo ganapatibhyashca vo namah | prishthaya namah | namo
    hiranyabahave senanye dishanca pataye namah | par ndhanuh kapardino vishalyo banavagm uta | aneshannasyeshava
    abhurasya nishangathih | jatharaya namah | hiranyagarbha ssamavartatagre bhutasya jatah patireka asit
    | sadadhara prithivi nkasmai devaya havisha vidhema | nabhyai namah | midhushtama shivatama shivo
    nassumana bhava | parame vriksha ayudha va~sana acara pinaka mbibhradagahi | kathyai namah | madhipatayo
    vishikhasah kapardinah | teshagm sahasrayojane 'vadhanvani tanmasi | guhyaya namah | ye anneshu vividdhyanti
    patreshu pibato janan | teshagm sahasrayojane ' vadhanvani tanmasi | andabhya sa shira jataveda akshara
    mpadam | vedanagm shirasi mata ayushmanta nkarotu mam | apanaya namah | ma no mahantamuta ma no arbhaka
    mma na ukshantamuta ma na ukshitam | ma no vadhih pitara mpriya ma nastanuvo rudra ririshah | urubhya
    stanjushasva tenavasena paro mujavato dhanva pinakahastah krittivasah | janubhya sagm srishtajithsomapa
    bahu rdhva dhanva pratihita | brihaspate paridiya rathena rakshoha 'mitragm apabadhamanah | janghabhya
    nca yat | sarvo hyesha rudra stasmai rudraya namo astu || gulphabhya mpathirakshaya ailabrida yavyudhah
    | teshagm sahasrayojane 'vadhanvani tanmasi | padabhya dadhivakta prathamo daivyo bhishak | ahigshca
    sarva shca yatu dhanyah | kavacaya hum | namo bilmine ca kavacine ca namah shrutaya ca shrutasenaya
    ca | upakavacaya hum | namo astu nilagrivaya sahasrakshaya midhushe | atho ye asya satvano 'karannamah
    | tritiya netraya namah | pramunca dhanvanastva rartniyorjyam | yashca te hasta ishavah para ta bhagavo
    vapa | astraya phat | ya etavantashca bhuyagmsashca disho rudra vitasthire | teshagm sahasrayojane
    'vadhanvani tanmasi | iti digbandhah | shikhadi astraparyantam ekatrimshadanganyasah digbandha sahitah
    prathamah nnamo bhagavate rudraya | iti namaskara ndashanga nyasah dvitiyah pancanga nyasah sadyo
    jata mprapadyami sadyo jataya vai namo namah | bhave bhave natibhave bhavasva mam | bhavo dbhavaya
    namah || padabhya jyeshthaya namah shreshthaya namo rudraya namah kalaya namah kalavikaranaya namo
    balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya namo manonmanaya namah |
    urumadhyamabhya bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudrarupebhyah || hridayaya namah
    | tatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodaya mishvarasarva bhutanam brahmadhipati
    rbrahma shivo me astu sadashivom || murdhne namah | hamsa gayatri asya shri hamsagayatri mahamantrasya
    avyakta parabrahma rishih paramahamso devata | hamsa nkilakam | paramahamsa prasada siddhyarthe jape
    viniyogah || shirase svaha | hamsum netratrayaya vaushat | hamsah mbhurbhuvassuvaromiti digbandhah
    | ntimirapaharam | pashyami te sarvajanantarastha deho devalayah prokto jivo deva ssanatanah | tyajedajnananirmalyam
    so 'hambhavena pujayet || hamsa hamsaya vidmahe paramahamsaya dhimahi | tanno hamsah pracodaya hamsa
    hamseti yo bruya ndikshuvinyasya | o mbhurbhuvassuvah | om om | trataramindra mavitaramindragm have
    have suhavagm shuramindra mpuruhutamindragg svasti no maghava dhatvindrah || o nnamo bhagavate rudraya
    | om om | purvadigbhage indraya namah || mbhurbhuvassuvah | o nno agne varunasya vidvandevasya hedo
    'va yasisishthah | yajishtho vahnitama shshoshucano vishva dveshagmsi pramumugdhyasmat || o nnamo
    bhagavate rudraya | nam om | agneyadigbhage agnaye namah || mbhurbhuvassuvah | o nkrinotu | yasminnakshatre
    yama eti raja | yasminnenamabhyashincanta devah | tadasya citragm havisha yajama || o nnamo bhagavate
    rudraya | mom om | dakshinadigbhage yamaya namah || mbhurbhuvassuvah | o mbham | asunvantamayajamanamiccha
    stenasyetyantaskarasyanveshi | anyamasmadiccha sa ta itya namo devi nir rite tubhyamastu || o nnamo
    bhagavate rudraya | bham om | nir mbhurbhuvassuvah | o ngam | tattva yami brahmana vandamanastada
    sha ste yajamano havirbhih | ahedamano varuneha bodhyurushagmsa ma na ayuh pramoshih || o nnamo bhagavate
    rudraya | gam om | pashcimadigbhage varunaya namah || mbhurbhuvassuvah | om va~m | a no niyudbhih
    shatinibhiradhvaragm | sahasrinibhirupa yahi yajnam | vayo asmin havishi madayasva | yuya nnamo bhagavate
    rudraya | vam om | vayavyadigbhage vayave namah || mbhurbhuvassuvah | o ntem | vayagm soma vrate tava
    | manastanushu bibhratah | prajavanto ashimahi | indrani devi subhaga supatni nnamo bhagavate rudraya
    | tem om | uttaradigbhage kuberaya namah || mbhurbhuvassuvah | om rum | tamisha njagatastasthushaspati
    njinvamavase humahe vayam | pusha no yatha vedasamasadvridhe rakshita payuradabdha nnamo bhagavate
    rudraya | rum om | ishanyadigbhage ishanaya namah || mbhurbhuvassuvah | o ndram | asme rudra mehana
    parvataso vritrahatye bharahutau sajoshah shshamsate stuvate dhayi pajra indrajyeshtha asmam avantu
    devah || o nnamo bhagavate rudraya | dram om | urdhvadigbhage akashaya namah || mbhurbhuvassuvah |
    om ya~m | syona prithivi bhavanrikshara niveshani | yaccha na nnamo bhagavate rudraya | yam om | adhodigbhage
    prithivyai namah || dashanga raudrikaranam o mbhurbhuvassuvah | om om | namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || trataramindra mavitaramindragm
    have have suhavagm shuramindra mpuruhutamindragg svasti no maghava dhatvindrah || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | om om | purvadigbhage lalatasthane indraya namah || mbhurbhuvassuvah | o nnam | namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || tva nno agne
    varunasya vidvandevasya hedo 'va yasisishthah | yajishtho vahnitama shshoshucano vishva dveshagmsi
    pramumugdhyasmat || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya
    ca shivataraya ca || o nnamo bhagavate rudraya | nam om | agneyadigbhage netrayosthane agnaye namah
    || mbhurbhuvassuvah | o mmom | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || suga nkrinotu | yasminnakshatre yama eti raja | yasminnenamabhyashincanta
    devah | tadasya citragm havisha yajama || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | mom om | dakshinadigbhage karnayosthane
    yamaya namah || mbhurbhuvassuvah | o mbham | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || asunvanta mayajamanamicchastenasyetyantaskarasyanveshi | anyamasmadiccha
    sa ta itya namo devi nir rite tubhyamastu || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | bham om | nir ritidigbhage mukhasthane
    nir mbhurbhuvassuvah | o ngam | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || tattvayami brahmana vandamanastada sha ste yajamano havirbhih |
    ahedamano varuneha bodhyurushagmsa ma na ayuh pramoshih || namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | gam om | pashcimadigbhage
    bahvosthane varunaya namah || mbhurbhuvassuvah | om va~m | namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || a no niyudbhih shatinibhiradhvaragm | sahasrinibhirupa
    yahi yajnam | vayo asmin havishi madayasva | yuya ssada nah || namah shambhave ca mayobhave ca namah
    shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | vam om
    | vayavyadigbhage nasikasthane vayave namah || mbhurbhuvassuvah | o ntem | namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || vayagm soma vrate tava |
    manastanushubibhratah | prajavanto ashimahi | indrani devi subhaga supatni || namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya
    | tem om | uttaradigbhage jatharasthane kuberaya namah || mbhurbhuvassuvah | om rum | namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || tamisha njagatastasthushaspati
    njinvamavase humahe vayam | pusha no yatha vedasamasadvridhe rakshita payuradabdha || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | rum om | ishanyadigbhage nabhisthane ishanaya namah || mbhurbhuvassuvah | o ndram | namah
    shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || asme
    rudra mehana parvataso vritrahatye bharahutau sajoshah shshamsate stuvate dhayi pajra indrajyeshtha
    asma~ avantu devah || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya
    ca shivataraya ca || o nnamo bhagavate rudraya | dram om | urdhvadigbhage murdhnisthane akashaya namah
    || mbhurbhuvassuvah | om ya~m | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || syona prithivi bhavanrikshara niveshani | yaccha na || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | yam om | adhodigbhage padasthane prithivyai namah || shodashanga raudrikaranam o mbhurbhuvassuvah
    | om am | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || vibhurasi pravahano raudrenanikena pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | am om | shikhasthane rudraya namah || mbhurbhuvassuvah | om am | namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || vahnirasi havyavahano raudrenanikena
    pahi ma 'gne piprihi ma ma ma higmsih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | am om | shirasthane rudraya namah
