id: annamayya-keerthanas-enda-gaani-needa-gaani
category: stotram
name:
  english: Annamayya Keerthanas Enda Gaani Needa Gaani
content:
  english: adi pallavi èndagani nidagani yemainagani kòndala rayadè makuladaivamu || telugani pamugani
    devapattayinagani galigani dhuligani kaniyemaina | kalakutavishamaina grakkuna mingina nati nilavarnudema
    nijadaivamu || èndagani nidagani yemainagani kòndala rayadè makuladaivamu || cimagani domagani cèladi
    emainagani gamugani namugani kaniyemaina | pamulaninniti mringè balutejipai nèkku dhumaketuvemo dòradaivamu
    || èndagani nidagani yemainagani kòndala rayadè makuladaivamu || pilligani nalligani pinna èlukaina
    gani kallagani pòllagani kani emaina | ballidudai venkatadri painunna yatadi mammèlla kalamu neleti
    yintidaivamu || èndagani nidagani yemainagani kòndala rayadè makuladaivamu ||
  devanagari: आदि पल्लवि ऎण्डगानि नीडगानि येमैनगानि कॊण्डल रायडॆ माकुलदैवमु ॥ तेलुगानि पामुगानि देवपट्टयिनगानि
    गालिगानि धूलिगानि कानियेमैन । कालकूटविषमैना ग्रक्कुन मिङ्गिन नाटि नीलवर्णुडेमा निजदैवमु ॥ ऎण्डगानि
    नीडगानि येमैनगानि कॊण्डल रायडॆ माकुलदैवमु ॥ चीमगानि दोमगानि चॆलदि एमैनगानि गामुगानि नामुगानि कानियेमैन
    । पामुलनिन्निटि म्रिङ्गॆ बलुतेजिपै नॆक्कु धूमकेतुवेमो दॊरदैवमु ॥ ऎण्डगानि नीडगानि येमैनगानि कॊण्डल
    रायडॆ माकुलदैवमु ॥ पिल्लिगानि नल्लिगानि पिन्न ऎलुकैन गानि कल्लगानि पॊल्लगानि कानि एमैन । बल्लिदुडै
    वेङ्कटाद्रि पैनुन्न यातडि मम्मॆल्ल कालमु नेलेटि यिण्टिदैवमु ॥ ऎण्डगानि नीडगानि येमैनगानि कॊण्डल रायडॆ
    माकुलदैवमु ॥
