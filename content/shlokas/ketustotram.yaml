id: ketustotram
category: stotram
name:
  english: ketustotram
  devanagari: केतुस्तोत्रम्
content:
  english: rinu gautama vakshyami stotrametadanuttamam | guhyadguhyatamam ketoh brahmana kirtitam pura
    || 2|| adyah karalavadano dvitiyo raktalocanah | tritiyah pingalakshashca caturtho jnanadayakah ||
    3|| pancamah kapilakshashca shashthah kalagnisannibhah | saptamo himagarbhashca dhumravarnoshtamastatha
    || 4|| navamah krittakanthashca dashamah narapithagah | ekadashastu shrikanthah dvadashastu gadayudhah
    || 5|| dvadashaite mahakrurah sarvopadravakarakah | parvakale pidayanti divakaranishakarau || 6||
    namadvadashakam stotram ketoretanmahatmanah | pathanti ye'nvaham bhaktya tebhyah ketuh prasidati ||
    7|| kulukthadhanye vilikhet shatkonam mandalam shubham | padmamashtadalam tatra vilikhecca vidhanatah
    || 8|| nilam ghatam ca samsthapya divakaranishakarau | ketum ca tatra nikshipya pujayitva vidhanatah
    || 9|| stotrametatpathitva ca dhyayan ketum varapradam | brahmanam shrotriyam shantam pujayitva kutumbinam
    || 10|| ketoh karalavaktrasya pratimam vastrasamyutam | kumbhadibhishca samyuktam citratare pradapayet
    || 11|| danenanena supritah ketuh syattasya saukhyadah | vatsaram prayata bhutva pujayitva vidhanatah
    || 12|| mulamashtottarashatam ye japanti narottamah | tesham ketuprasadena na kadacidbhayam bhavet
    || 13|| iti ketustotram sampurnam |
  devanagari: ृणु गौतम वक्ष्यामि स्तोत्रमेतदनुत्तमम् । गुह्याद्गुह्यतमं केतोः ब्रह्मणा कीर्तितं पुरा ॥
    २॥ आद्यः करालवदनो द्वितीयो रक्तलोचनः । तृतीयः पिङ्गलाक्षश्च चतुर्थो ज्ञानदायकः ॥ ३॥ पञ्चमः कपिलाक्षश्च
    षष्ठः कालाग्निसन्निभः । सप्तमो हिमगर्भश्च धूम्रवर्णोष्टमस्तथा ॥ ४॥ नवमः कृत्तकण्ठश्च दशमः नरपीठगः
    । एकादशस्तु श्रीकण्ठः द्वादशस्तु गदायुधः ॥ ५॥ द्वादशैते महाक्रूराः सर्वोपद्रवकारकाः । पर्वकाले पीडयन्ति
    दिवाकरनिशाकरौ ॥ ६॥ नामद्वादशकं स्तोत्रं केतोरेतन्महात्मनः । पठन्ति येऽन्वहं भक्त्या तेभ्यः केतुः प्रसीदति
    ॥ ७॥ कुलुक्थधान्ये विलिखेत् षट्कोणं मण्डलं शुभम् । पद्ममष्टदलं तत्र विलिखेच्च विधानतः ॥ ८॥ नीलं घटं
    च संस्थाप्य दिवाकरनिशाकरौ । केतुं च तत्र निक्षिप्य पूजयित्वा विधानतः ॥ ९॥ स्तोत्रमेतत्पठित्वा च ध्यायन्
    केतुं वरप्रदम् । ब्राह्मणं श्रोत्रियं शान्तं पूजयित्वा कुटुम्बिनम् ॥ १०॥ केतोः करालवक्त्रस्य प्रतिमां
    वस्त्रसंयुताम् । कुम्भादिभिश्च संयुक्तां चित्रातारे प्रदापयेत् ॥ ११॥ दानेनानेन सुप्रीतः केतुः स्यात्तस्य
    सौख्यदः । वत्सरं प्रयता भूत्वा पूजयित्वा विधानतः ॥ १२॥ मूलमष्टोत्तरशतं ये जपन्ति नरोत्तमाः । तेषां
    केतुप्रसादेन न कदाचिद्भयं भवेत् ॥ १३॥ इति केतुस्तोत्रं सम्पूर्णम् ।
