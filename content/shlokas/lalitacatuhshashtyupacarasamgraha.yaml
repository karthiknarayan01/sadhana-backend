id: lalitacatuhshashtyupacarasamgraha
category: stotram
name:
  english: lalitacatuhshashtyupacarasamgraha
  devanagari: ललिताचतुःषष्ट्युपचारसंग्रह
content:
  english: shrilalita catuhshashtyupacarasangrahah om hrinmadhyanilaye devi lalite paradevate | catushshashtyupacaramste
    bhaktya matah samarpaye || 1|| kameshotsanganilaye padyam grihnishva sadaram | bhushanani samuttarya
    gandhatailam ca te'rpaye || 2|| snanashalam pravishya'tha tatrastha manipithake | upavishya sukhena
    tvam dehodvartanamacara || 3|| ushnodakena lalite snapayamyatha bhaktitah | abhishincami pashcattvam
    sauvarnakalashodakaih || 4|| dhautavastraprocchanam caraktakshaumambaram tatha | kucottariyamarunamarpayami
    maheshvari || 5|| tatah pravishya calepamantapam parameshvari | upavishya ca sauvarnapithe gandhanvilepaya
    || 6|| kalagarujadhupaishca dhupaye keshapashakam | arpayami ca malyadi sarvartukusumasrajah || 7||
    bhushamantapamavishya sthitva sauvarnapithake | manikyamukutam murdhni dayaya sthapayambike || 8||
    sharatparvanacandrasya shakalam tatra shobhatam | sindurena ca simantamalankuru dayanidhe || 9|| bhale
    ca tilakam nyasya netrayoranjanam shive | valiyugaḻamapyamba bhaktya te vinivedaye || 10|| manikundalamapyamba
    nasabharanameva ca | tatankayugaḻam devi yavakancadhare'rpaye || 11|| adyabhushanasauvarnacintakapadakani
    ca | mahapadakamuktavalyekavalyadibhushanam || 12|| channaviram grihanamba keyurayugalam tatha | valayavalimangulyabharanam
    lalitambike || 13|| odyanamatha katyante katisutranca sundari | saubhagyabharanam padakatakam nupuradvayam
    || 14|| arpayami jaganmatah padayoshcanguliyakam | pasham vamordhvahaste te dakshahaste tathankusham
    || 15|| anyasminvamahaste ca tatha pundrekshucapakam | pushpabanamshca dakshadhah panau dharaya sundari
    || 16|| arpayami ca manikyapaduke padayoh shive | arohavritidevibhih cakram parashive muda || 17||
    samanaveshabhushabhih sakam tripurasundari | tatra kameshavamankaparyankopaniveshinim || 18|| amritasavapanena
    muditam tvam sada bhaje | shuddhena gangatoyena punaracamanam kuru || 19|| karpuravitikamasye tato'mba
    viniveshaya | anandollasahasena vilasanmukhapankajam || 20|| bhaktimatkalpalitikam kritisyam tvam
    smaran kada | mangalarartikam chatram camaram darpanam tatha | taḻavrintam gandhapushpadhupadipamshca
    te'rpaye || 21|| shrikameshvari taptahatakakritaih sthalisahasrairbhritam divyannam ghritasupashakabharitam
    citrannabhedairyutam | dugdhannam madhusharkaradadhiyutam manikyapatrarpitam mashapupakapurikadisahitam
    naivedyamamba'rpaye || 22|| sagravimshatipadyoktacatushshashtyupacaratah | hrinmadhyanilaya mata lalita
    paritushyatu || 23|| shrimukhakhyasya varshasya tulayam shuklapakshake | caturthyamaparahne ca lalitarpitamanasah
    || 24|| sagravimshatipadyaistu catushshashtyupacarakan | samagrahitparambayah prityai narayano muda
    || 25|| narayanah shripurushottamatmajo'likhanmahishurapure vasankriti | devisaparyamakhilabhilashadam
    kameshavamankagata prasidatu || iti shrilalita catuhshashtyupacarasangrahah | || iti shivam ||
  devanagari: श्रीललिता चतुःषष्ट्युपचारसङ्ग्रहः ॐ हृन्मध्यनिलये देवि ललिते परदेवते । चतुष्षष्ट्युपचारांस्ते
    भक्त्या मातः समर्पये ॥ १॥ कामेशोत्सङ्गनिलये पाद्यं गृह्णीष्व सादरम् । भूषणानि समुत्तार्य गन्धतैलं
    च तेऽर्पये ॥ २॥ स्नानशालां प्रविश्याऽथ तत्रस्थ मणिपीठके । उपविश्य सुखेन त्वं देहोद्वर्तनमाचर ॥ ३॥
    उष्णोदकेन ललिते स्नापयाम्यथ भक्तितः । अभिषिञ्चामि पश्चात्त्वां सौवर्णकलशोदकैः ॥ ४॥ धौतवस्त्रप्रोच्छनं
    चारक्तक्षौमाम्बरं तथा । कुचोत्तरीयमरुणमर्पयामि महेश्वरि ॥ ५॥ ततः प्रविश्य चालेपमण्टपं परमेश्वरि ।
    उपविश्य च सौवर्णपीठे गन्धान्विलेपय ॥ ६॥ कालगरुजधूपैश्च धूपये केशपाशकम् । अर्पयामि च माल्यादि सर्वर्तुकुसुमस्रजः
    ॥ ७॥ भूषामण्टपमाविश्य स्थित्वा सौवर्णपीठके । माणिक्यमुकुटं मूर्ध्नि दयया स्थापयाम्बिके ॥ ८॥ शरत्पार्वणचन्द्रस्य
    शकलं तत्र शोभताम् । सिन्दूरेण च सीमन्तमलङ्कुरु दयानिधे ॥ ९॥ भाले च तिलकं न्यस्य नेत्रयोरञ्जनं शिवे
    । वालीयुगळमप्यम्ब भक्त्या ते विनिवेदये ॥ १०॥ मणिकुण्डलमप्यम्ब नासाभरणमेव च । ताटङ्कयुगळं देवि यावकञ्चाधरेऽर्पये
    ॥ ११॥ आद्यभूषणसौवर्णचिन्ताकपदकानि च । महापदकमुक्तावल्येकावल्यादिभूषणम् ॥ १२॥ छन्नवीरं गृहाणाम्ब केयूरयुगलं
    तथा । वलयावलिमङ्गुल्याभरणं ललिताम्बिके ॥ १३॥ ओड्याणमथ कट्यन्ते कटिसूत्रञ्च सुन्दरि । सौभाग्याभरणं
    पादकटकं नूपुरद्वयम् ॥ १४॥ अर्पयामि जगन्मातः पादयोश्चाङ्गुलीयकम् । पाशं वामोर्ध्वहस्ते ते दक्षहस्ते
    तथाङ्कुशम् ॥ १५॥ अन्यस्मिन्वामहस्ते च तथा पुण्ड्रेक्षुचापकम् । पुष्पबाणांश्च दक्षाधः पाणौ धारय सुन्दरि
    ॥ १६॥ अर्पयामि च माणिक्यपादुके पादयोः शिवे । आरोहावृतिदेवीभिः चक्रं परशिवे मुदा ॥ १७॥ समानवेषभूषाभिः
    साकं त्रिपुरसुन्दरि । तत्र कामेशवामाङ्कपर्यङ्कोपनिवेशिनीम् ॥ १८॥ अमृतासवपानेन मुदितां त्वां सदा भजे
    । शुद्धेन गाङ्गतोयेन पुनराचमनं कुरु ॥ १९॥ कर्पूरवीटिकामास्ये ततोऽम्ब विनिवेशय । आनन्दोल्लासहासेन विलसन्मुखपङ्कजाम्
    ॥ २०॥ भक्तिमत्कल्पलितिकां कृतीस्यां त्वां स्मरन् कदा । मङ्गलारार्तिकं छत्रं चामरं दर्पणं तथा । ताळवृन्तं
    गन्धपुष्पधूपदीपांश्च तेऽर्पये ॥ २१॥ श्रीकामेश्वरि तप्तहाटककृतैः स्थालीसहस्रैर्भृतम् दिव्यान्नं घृतसूपशाकभरितं
    चित्रान्नभेदैर्युतम् । दुग्धान्नं मधुशर्करादधियुतं माणिक्यपात्रार्पितम् माषापूपकपूरिकादिसहितं नैवेद्यमम्बाऽर्पये
    ॥ २२॥ साग्रविंशतिपद्योक्तचतुष्षष्ट्युपचारतः । हृन्मध्यनिलया माता ललिता परितुष्यतु ॥ २३॥ श्रीमुखाख्यस्य
    वर्षस्य तुलायां शुक्लपक्षके । चतुर्थ्यामपराह्णे च ललितार्पितमानसः ॥ २४॥ साग्रविंशतिपद्यैस्तु चतुष्षष्ट्युपचारकान्
    । समग्रहीत्पराम्बायाः प्रीत्यै नारायणो मुदा ॥ २५॥ नारायणः श्रीपुरुषोत्तमात्मजोऽलिखन्महीषूरपुरे वसन्कृती
    । देवीसपर्यामखिलाभिलाषदां कामेशवामाङ्कगता प्रसीदतु ॥ इति श्रीललिता चतुःषष्ट्युपचारसङ्ग्रहः । ॥ इति
    शिवम् ॥
