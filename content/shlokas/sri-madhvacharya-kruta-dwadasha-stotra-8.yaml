id: sri-madhvacharya-kruta-dwadasha-stotra-8
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 8
content:
  english: atha ashtamastotram vanditasheshavandyoruvrindarakam candanacarcitodarapinamsakam | indiracancalapanganirajitam
    mandaroddharivrittodbhujabhoginam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || srishtisamharalilavilasatatam pushtashadgunyasadvigrahollasinam | dushtanihsheshasamharakarmodyatam
    hrishtapushtatishishta prajasamshrayam | prinayamo vasudevam devatamandalakhandamandanam prinayamo
    vasudevam || || unnataprarthitasheshasamsadhakam sannatalaukikanandadashripadam | bhinnakarmashayapranisamprerakam
    tanna kim neti vidvatsu mimamsitam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || vipramukhyaih sada vedavadonmukhaih supratapaih kshitisheshvaraishcarccitam | apratarkyorusamvidgunam
    nirmalam saprakashajaranandarupam param | prinayamo vasudevam devatamandalakhandamandanam prinayamo
    vasudevam || kenapi na kvapi hi pratyayo yadguneshuttamanam parah | satyasankalpa eko varenyo vashi
    matyanunaih sada vedavadoditah | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || pashyatam duhkhasantananirmulanam drishyatam drishyatamityajesharcitam | nashyatam duragam sarvadapya'tmagam
    vashyatam svecchaya sajjaneshvagatam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || agrajam yah sasarjajamagryakritim vigraho yasya sarve guna eva hi | ugra adyo'pi yasyatmajagryatmajah
    sadgrihitah sada yah param daivatam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || acyuto yo gunairnityamevakhilaih pracyuto'sheshadoshaih sada purtitah | ucyate sarvavedoruvadairajah
    svarcito brahmarudrendrapurvaih sada | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || dharyate yena vishvam sadajadikam varyate'sheshaduhkham nijadhyayinam | paryate sarvamanyairnayatparyate
    karyate cakhilam sarvabhutaih sada | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || || sarvapapaniyatsamsmriteh sankshayam sarvada yanti bhaktya vishuddhatmanam | sharvagurvadigirvana
    samsthanadah kurvate karma yatpritaye sajjanah | prinayamo vasudevam devatamandalakhandamandanam prinayamo
    vasudevam || || akshayam karma yasmin pare svarpitam prakshayam yanti duhkhani yannamatah | aksharo
    yo'jarah sarvadaivamritah kukshigam yasya vishvam sada'jadikam | prinayamo vasudevam devatamandalakhandamandanam
    prinayamo vasudevam || || nanditirthorusannamino nandinah sandadhanah sadanandadeve matim | mandahasaruna
    pangadattonnatim vanditasheshadevadivrindam sada | prinayamo vasudevam devatamandalakhandamandanam
    prinayamo vasudevam || || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu ashtamastotram
    sampurnam
  devanagari: अथ अष्टमस्तोत्रम् वन्दिताशेषवन्द्योरुवृन्दारकं चन्दनाचर्चितोदारपीनांसकम् । इन्दिराचञ्चलापाङ्गनीराजितं
    मन्दरोद्धारिवृत्तोद्भुजाभोगिनम् । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥
    सृष्टिसंहारलीलाविलासाततं पुष्टषाड्गुण्यसद्विग्रहोल्लासिनम् । दुष्टनिःशेषसंहारकर्मोद्यतं हृष्टपुष्टातिशिष्ट
    प्रजासंश्रयम् । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ उन्नतप्रार्थिताशेषसंसाधकं
    सन्नतालौकिकानन्ददश्रीपदम् । भिन्नकर्माशयप्राणिसम्प्रेरकं तन्न किं नेति विद्वत्सु मीमांसितम् । प्रीणयामो
    वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ विप्रमुख्यैः सदा वेदवादोन्मुखैः सुप्रतापैः
    क्षितीशेश्वरैश्चार्च्चितम् । अप्रतर्क्योरुसंविद्गुणं निर्मलं सप्रकाशाजरानन्दरूपं परम् । प्रीणयामो
    वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ केनापि न क्वापि हि प्रत्ययो यद्गुणेषूत्तमानां
    परः । सत्यसङ्कल्प एको वरेण्यो वशी मत्यनूनैः सदा वेदवादोदितः । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं
    प्रीणयामो वासुदेवम् ॥ ॥ पश्यतां दुःखसन्ताननिर्मूलनं दृश्यतां दृश्यतामित्यजेशार्चितम् । नश्यतां दूरगं
    सर्वदाप्याऽत्मगं वश्यतां स्वेच्छया सज्जनेष्वागतम् । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो
    वासुदेवम् ॥ ॥ अग्रजं यः ससर्जाजमग्र्याकृतिं विग्रहो यस्य सर्वे गुणा एव हि । उग्र आद्योऽपि यस्यात्मजाग्र्यात्मजः
    सद्गृहीतः सदा यः परं दैवतम् । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ अच्युतो
    यो गुणैर्नित्यमेवाखिलैः प्रच्युतोऽशेषदोषैः सदा पूर्तितः । उच्यते सर्ववेदोरुवादैरजः स्वर्चितो ब्रह्मरुद्रेन्द्रपूर्वैः
    सदा । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ धार्यते येन विश्वं सदाजादिकं
    वार्यतेऽशेषदुःखं निजध्यायिनाम् । पार्यते सर्वमन्यैर्नयत्पार्यते कार्यते चाखिलं सर्वभूतैः सदा । प्रीणयामो
    वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ सर्वपापानियत्संस्मृतेः सङ्क्षयं सर्वदा यान्ति
    भक्त्या विशुद्धात्मनाम् । शर्वगुर्वादिगीर्वाण संस्थानदः कुर्वते कर्म यत्प्रीतये सज्जनाः । प्रीणयामो
    वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ अक्षयं कर्म यस्मिन् परे स्वर्पितं प्रक्षयं
    यान्ति दुःखानि यन्नामतः । अक्षरो योऽजरः सर्वदैवामृतः कुक्षिगं यस्य विश्वं सदाऽजादिकम् । प्रीणयामो
    वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ॥ नन्दितीर्थोरुसन्नामिनो नन्दिनः सन्दधानाः सदानन्ददेवे
    मतिम् । मन्दहासारुणा पाङ्गदत्तोन्नतिं वन्दिताशेषदेवादिवृन्दं सदा । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं
    प्रीणयामो वासुदेवम् ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु अष्टमस्तोत्रं
    सम्पूर्णम्
