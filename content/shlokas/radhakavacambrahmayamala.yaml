id: radhakavacambrahmayamala
category: kavacha
name:
  english: radhakavacambrahmayamala
  devanagari: राधाकवचम्ब्रह्मयामल
content:
  english: rinushva tat || 3|| rishirnarayanah prokto gayatri chanda ityapi | devata radhikadevi premabhaktipradayika
    || 4|| dharmarthakamamoksheshu viniyogah prakirtitah | taptakashcanagaurangi radha vrindavaneshvari
    || 5|| vrishabhanusutam devim namami shriharipriyam | om radha me hridayam patu mastakam patu gopika
    || 6|| shrikrishnahridayasakta patu nabhim sada muda | shrikrishnanandakalita patu padayugam mama
    || 7|| govindabhavaracita bahuyugmam sadavatu | shriradhayai vahnijaya sarvangam patu sarvada || 8||
    shri klim radhayai tatha svaha patu nityam shadakshari | shri ram him radhayai vahnijayante ca mahamanuh
    || 9|| ashtaksharo mahamantrah sarvakaryeshu rakshatu | vishnuvakshahsthalastha ca putran rakshatu
    me sada || 10|| vishnorbhavena mudita griham patu ca sarvada | krishnabhavarata devi jihvagram mama
    rakshatu || 11|| shyamapremoddhata devi rajyasthane sadavatu | krishne niveditangi ca bhaktibhavam
    sadavatu || 12|| krishnartivarddhini devi sarvabandhun sadavatu | indradyah sakala devah pantu purvadidikshu
    ca || 13|| raksham kurvantu mam nityam dhanadhanyapradayika | om shri radhayai vidmahe vrindavanavilasinyai
    dhimahi tanno radha pracodayat || 14|| iti te kathitam bhadre guhyadguhyataram param | yah pathet
    sadhakashreshtho bhaktiyuktah sada bhuvi || 15|| grihe nivasate lakshmirvani vaktre na samshayah |
    rajano dasatam yanti devatulyo bhavennarah || 16|| kavacam paramam punyam so'pi punyavatam varah |
    sarvasiddhiyuto bhutva trailokyavijayi bhavet || 17|| bhaktiyuktaya shishyaya sadhakaya prakashayet
    | bhaktihinaya dushtaya kadacinna prakashayet || 18|| dvijaya bhaktihinaya kadacinna pradarshayet
    | shvapacaya sada deyam yadi bhaktiyuto bhavet || 19|| bhaktishraddhavihinaya na deyam hi dvijaya
    te | ajnatva kavacam devi radhakrishno bhajettu yah || 20|| yugayutakritaklesham premabhaktirnajayate
    | mayaya rahita dhirah sarvametatparatparam || 21|| yatha radha tatha lakshmistathatvam hi na samshayah
    || 22|| iti shribrahmayamale haragaurisamvade shriradhakavacam sampurnam || || shubham ||
  devanagari: ृणुष्व तत् ॥ ३॥ ऋषिर्नारायणः प्रोक्तो गायत्री छन्द इत्यपि । देवता राधिकादेवी प्रेमभक्तिप्रदायिका
    ॥ ४॥ धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः । तप्तकाश्चनगौराङ्गी राधा वृन्दावनेश्वरी ॥ ५॥ वृषभानुसुतां
    देवीं नमामि श्रीहरिप्रियाम् । ॐ राधा मे हृदयं पातु मस्तकं पातु गोपिका ॥ ६॥ श्रीकृष्णहृदयासक्ता पातु
    नाभिं सदा मुदा । श्रीकृष्णानन्दकलिता पातु पादयुगं मम ॥ ७॥ गोविन्दभावरचिता बाहुयुग्मं सदावतु । श्रीराधायै
    वह्निजाया सर्वाङ्गं पातु सर्वदा ॥ ८॥ श्री क्लीं राधायै तथा स्वाहा पातु नित्यं षडक्षरी । श्री रां हीं
    राधायै वह्निजायान्ते च महामनुः ॥ ९॥ अष्टाक्षरो महामन्त्रः सर्वकार्येषु रक्षतु । विष्णुवक्षःस्थलस्था
    च पुत्रान् रक्षतु मे सदा ॥ १०॥ विष्णोर्भावेन मुदिता गृहं पातु च सर्वदा । कृष्णभावरता देवी जिह्वाग्रं
    मम रक्षतु ॥ ११॥ श्यामप्रेमोद्धता देवी राज्यस्थाने सदावतु । कृष्णे निवेदिताङ्गी च भक्तिभावं सदावतु
    ॥ १२॥ कृष्णार्तिवर्द्धिनी देवी सर्वबन्धून् सदावतु । इन्द्राद्याः सकला देवाः पान्तु पूर्वादिदिक्षु
    च ॥ १३॥ रक्षां कुर्वन्तु मां नित्यं धनधान्यप्रदायिका । ॐ श्री राधायै विद्महे वृन्दावनविलासिन्यै धीमहि
    तन्नो राधा प्रचोदयात् ॥ १४॥ इति ते कथितं भद्रे गुह्याद्गुह्यतरं परम् । यः पठेत् साधकश्रेष्ठो भक्तियुक्तः
    सद भुवि ॥ १५॥ गृहे निवसते लक्ष्मीर्वाणी वक्त्रे न संशयः । राजानो दासतां यान्ति देवतुल्यो भवेन्नरः
    ॥ १६॥ कवचं परमं पुण्यं सोऽपि पुण्यवतां वरः । सर्वसिद्धियुतो भूत्वा त्रैलोक्यविजयी भवेत् ॥ १७॥ भक्तियुक्ताय
    शिष्याय साधकाय प्रकाशयेत् । भक्तिहीनाय दुष्टाय कदाचिन्न प्रकाशयेत् ॥ १८॥ द्विजाय भक्तिहीनाय कदाचिन्न
    प्रदर्शयेत् । श्वपचाय सदा देयं यदि भक्तीयुतो भवेत् ॥ १९॥ भक्तिश्रद्धाविहीनाय न देयं हि द्विजाय ते
    । अज्ञात्वा कवचं देवि राधाकृष्णो भजेत्तु यः ॥ २०॥ युगायुतकृतक्लेशं प्रेमभक्तिर्नजायते । मायया रहिता
    धीराः सर्वमेतत्परात्परम् ॥ २१॥ यथा राधा तथा लक्ष्मीस्तथात्वं हि न संशयः ॥ २२॥ इति श्रीब्रह्मयामले
    हरगौरीसंवादे श्रीराधाकवचं सम्पूर्णम् ॥ ॥ शुभम् ॥
