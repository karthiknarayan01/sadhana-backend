id: aham-brahmasmi
category: mahavakya
name:
  english: Aham Brahmasmi
  devanagari: अहं ब्रह्मास्मि
content:
  english: aham brahmasmi
  devanagari: अहं ब्रह्मास्मि
meaning:
  english: >-
    "I am Brahman" — one of the four Mahavakyas ("great sayings") of
    Advaita Vedanta, pointing to the identity of the individual self
    (atman) with ultimate reality (brahman).
source_attribution:
  text_source: Brihadaranyaka Upanishad 1.4.10
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
