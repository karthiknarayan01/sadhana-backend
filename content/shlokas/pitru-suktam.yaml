id: pitru-suktam
category: stotram
name:
  english: Pitru Suktam
content:
  english: udiratamavara utparasa unmadhyamah pitarah somyasah | asum ya~ iyuravrika ritajnaste no 'vantu
    pitaro haveshu || mpitribhyo namo astvadya ye purvaso ya uparasa iyuh | ye parthive rajasya nishatta
    ye va nunam suvrijanasu vikshu || mpitrinsuvidatram avitsi napata nca vishnoh | bar hishado ye svadhaya
    sutasya bhajanta pitvasta ihagamishthah || rvagima vo havya cakrima jushadhvam | ta a gatavasa shantamenatha
    na upahutah pitarah somyaso bar hishyeshu nidhishu priyeshu | ta a gamantu ta iha shruvantvadhi bruvantu
    te acya janu dakshinato nishadyemam ya~jnamabhi grinita vishve | ma himsishta pitarah kena cinno yadva
    agah purushata karama || asinaso aruninamupasthe rayi ndhatta dashushe martyaya | putrebhyah pitarastasya
    vasvah pra yacchata ta ihorja ye nah purve pitarah somyaso va~sishthah | tebhiryama shyushannushadbhih
    pratikamamattu || ye tatrishurdevatra jehamana hotravida sstomatashtaso arkaih | agne yahi suvidatrebhirarvan
    satyaih kavyaih pitribhirgharmasadbhih || ye satyaso havirado havishpa indrena devai ndadhanah | agne
    yahi sahasra ndevavandaih paraih purvaih pitribhirgharmasadbhih || agnishvattah pitara eha gacchata
    sadahsada ssadata supranitayah | atta havimshi prayatani bar hishyatha rayim sarvavira tvamagna ilito
    jatavedo 'vaddhavyani surabhini kritvi | pradah pitribhyah svadhaya te akshannaddhi tva ndeva prayata
    havimshi || ye ceha pitaro ye ca neha yam shca vidma ya~ u ca na pravidma | tvam ve~ttha yati te jataveda
    ssvadhabhiryajnam sukrita ye agnidagdha ye anagnidagdha madhye diva ssvadhaya madayante | tebhih svaralasunitimetam
  devanagari: उदी॑रता॒मव॑र॒ उत्परा॑स॒ उन्म॑ध्य॒माः पि॒तरः॑ सो॒म्यासः॑ । असुं॒ यँ ई॒युर॑वृ॒का ऋ॑त॒ज्ञास्ते
    नो॑ ऽवन्तु पि॒तरो॒ हवे॑षु ॥ म्पि॒तृभ्यो॒ नमो॑ अस्त्व॒द्य ये पूर्वा॑सो॒ य उप॑रास ई॒युः । ये पार्थि॑वे॒
    रज॒स्या निष॑त्ता॒ ये वा॑ नू॒नं सु॑वृ॒जना॑सु वि॒क्षु ॥ म्पि॒तॄन्सु॑वि॒दत्रां॑ अवित्सि॒ नपा॑त ञ्च॒ विष्णोः॑
    । ब॒र् हि॒षदो॒ ये स्व॒धया॑ सु॒तस्य॒ भज॑न्त पि॒त्वस्त इ॒हाग॑मिष्ठाः ॥ र्वागि॒मा वो॑ ह॒व्या च॑कृमा जु॒षध्व॑म्
    । त आ ग॒ताव॑सा॒ शन्त॑मे॒नाथा॑ न॒ उप॑हूताः पि॒तरः॑ सो॒म्यासो॑ बर् हि॒ष्ये॑षु नि॒धिषु॑ प्रि॒येषु॑ ।
    त आ ग॑मन्तु॒ त इ॒ह श्रु॑व॒न्त्वधि॑ ब्रुवन्तु॒ ते॑ आच्या॒ जानु॑ दक्षिण॒तो नि॒षद्ये॒मं यँ॒ज्ञम॒भि गृ॑णीत॒
    विश्वे॑ । मा हिं॑सिष्ट पितरः॒ केन॑ चिन्नो॒ यद्व॒ आगः॑ पुरु॒षता॒ करा॑म ॥ आसी॑नासो अरु॒णीना॑मु॒पस्थे॑
    र॒यि न्ध॑त्त दा॒शुषे॒ मर्त्या॑य । पु॒त्रेभ्यः॑ पितर॒स्तस्य॒ वस्वः॒ प्र य॑च्छत॒ त इ॒होर्ज॑ ये नः॒ पूर्वे॑
    पि॒तरः॑ सो॒म्यासो॑ वँसि॑ष्ठाः । तेभि॑र्य॒म ष्यु॒शन्नु॒शद्भिः॑ प्रतिका॒मम॑त्तु ॥ ये ता॑तृ॒षुर्दे॑व॒त्रा
    जेह॑माना होत्रा॒विद॒ स्स्तोम॑तष्टासो अ॒र्कैः । आग्ने॑ याहि सुवि॒दत्रे॑भिर॒र्वाङ् स॒त्यैः क॒व्यैः पि॒तृभि॑र्घर्म॒सद्भिः॑
    ॥ ये स॒त्यासो॑ हवि॒रदो॑ हवि॒ष्पा इन्द्रे॑ण दे॒वै न्दधा॑नाः । आग्ने॑ याहि स॒हस्र॑ न्देवव॒न्दैः परैः॒
    पूर्वैः॑ पि॒तृभि॑र्घर्म॒सद्भिः॑ ॥ अग्नि॑ष्वात्ताः पितर॒ एह ग॑च्छत॒ सदः॑सद स्सदत सुप्रणीतयः । अ॒त्ता
    ह॒वींषि॒ प्रय॑तानि ब॒र् हिष्यथा॑ र॒यिं सर्व॑वीर त्वम॑ग्न ईलि॒तो जा॑तवे॒दो ऽवा॑ड्ढ॒व्यानि॑ सुर॒भीणि॑
    कृ॒त्वी । प्रादाः॑ पि॒तृभ्यः॑ स्व॒धया॒ ते अ॑क्षन्न॒द्धि त्व न्दे॑व॒ प्रय॑ता ह॒वींषि॑ ॥ ये चे॒ह पि॒तरो॒
    ये च॒ नेह यां श्च॑ वि॒द्म याँ उ॑ च॒ न प्र॑वि॒द्म । त्वं वेँ॑त्थ॒ यति॒ ते जा॑तवेद स्स्व॒धाभि॑र्य॒ज्ञं
    सुकृ॑त ये अ॑ग्निद॒ग्धा ये अन॑ग्निदग्धा॒ मध्ये॑ दि॒व स्स्व॒धया॑ मा॒दय॑न्ते । तेभिः॑ स्व॒रालसु॑नीतिमे॒तां
