id: shivagauristotram
category: stotram
name:
  english: shivagauristotram
  devanagari: शिवगौरीस्तोत्रम्
content:
  english: mannapradananiratam stanabharanamram | nrityantamindushakalabharanam vilokya hrishtam bhaje
    bhagavatim bhavaduhkhahantrim || 7|| udancitakuncitavamapadam samancitahindukrishanuhastam | annapradam
    vikshya muda maheshim natantamadyam natamashrayamah || 8|| arunarunakotitulyakantim srinipashabhayavanchitapradanaih
    | anuraktakaram navenducudamakhileshim bhuvaneshvarim bhajamah || 9|| balendukalitottamsam balarunasamadyutim
    | pashankushavarabhitikaram shambhum samashraye || 10|| kulacalakutuhalam kusumacapasanjivanam kuce
    kalitavalkalam gurukriparasam locane | japasahridayam rucau japavatabhiramam kare jatanibiditam kace
    jayati jivitam shambhavam || 11|| dattatreyam shivam shantamindranilanibham prabhum | atmamayaratam
    devamavadhutam digambaram || 12|| bhasmoddhulitasarvangam jatajutadharam vibhum | caturbahumudarangam
    praphullakamalekshanam || 13|| jnanayoganidhim vishvagurum yogijanapriyam | bhaktanukampinam sarvasakshinam
    siddhasevitam || 14|| evam yah satatam dhyayed devadevam sanatanam | sa muktah sarvapapebhyo nihshreyasamavapnuyat
    || 15|| iti shrishivagauristotram sampurnam |
  devanagari: मन्नप्रदाननिरतां स्तनभारनम्राम् । नृत्यन्तमिन्दुशकलाभरणं विलोक्य हृष्टां भजे भगवतीं भवदुःखहन्त्रीम्
    ॥ ७॥ उदञ्चिताकुञ्चितवामपादं समञ्चिताहीन्दुकृशानुहस्तम् । अन्नप्रदां वीक्ष्य मुदा महेशीं नटन्तमाद्यं
    नटमाश्रयामः ॥ ८॥ अरुणारुणकोटितुल्यकान्तिं सृणिपाशाभयवाञ्छितप्रदानैः । अनुरक्तकरां नवेन्दुचूडामखिलेशीं
    भुवनेश्वरीं भजामः ॥ ९॥ बालेन्दुकलितोत्तंसं बालारुणसमद्युतिम् । पाशाङ्कुशवराभीतिकरं शम्भुं समाश्रये
    ॥ १०॥ कुलाचलकुतूहलं कुसुमचापसञ्जीवनं कुचे कलितवल्कलं गुरुकृपारसं लोचने । जपासहृदयं रुचौ जपवटाभिरामं
    करे जटानिबिडितं कचे जयति जीवितं शाम्भवम् ॥ ११॥ दत्तात्रेयं शिवं शान्तमिन्द्रनीलनिभं प्रभुम् । आत्ममायारतं
    देवमवधूतं दिगम्बरम् ॥ १२॥ भस्मोद्धूलितसर्वाङ्गं जटाजूटधरं विभुम् । चतुर्बाहुमुदाराङ्गं प्रफुल्लकमलेक्षणम्
    ॥ १३॥ ज्ञानयोगनिधिं विश्वगुरुं योगिजनप्रियम् । भक्तानुकम्पिनं सर्वसाक्षिणं सिद्धसेवितम् ॥ १४॥ एवं
    यः सततं ध्यायेद् देवदेवं सनातनम् । स मुक्तः सर्वपापेभ्यो निःश्रेयसमवाप्नुयात् ॥ १५॥ इति श्रीशिवगौरीस्तोत्रं
    सम्पूर्णम् ।
