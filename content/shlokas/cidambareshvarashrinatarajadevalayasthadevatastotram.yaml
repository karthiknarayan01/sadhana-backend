id: cidambareshvarashrinatarajadevalayasthadevatastotram
category: stotram
name:
  english: cidambareshvarashrinatarajadevalayasthadevatastotram
  devanagari: चिदम्बरेश्वरश्रीनटराजदेवालयस्थदेवतास्तोत्रं
content:
  english: nandajnanamayam nateshashivayoh sammelanam bodhayat | shrijambunadabilvapatraracitaih malaganaih
    lakshitam kasturimasrinam cidambaramidam sthanam rahasyam numah || 115|| lokatishayivibhavam mahadaseve
    cidambararahasyam | pashcakshari yadiya jivatuh sarvalokashubhadatri || 116|| shaktih samagrah grasate
    dinante yasmimshca gaurya valate kapadim | yasmatprage vishvamupaiti shaktim cakasti taccetasi me
    cakastu || 113
  devanagari: नन्दज्ञानमयं नटेशशिवयोः सम्मेलनं बोधयत् । श्रीजाम्बूनदबिल्वपत्ररचितैः मालागणैः लक्षितं कस्तूरीमसृणं
    चिदम्बरमिदं स्थानं रहस्यं नुमः ॥ ११५॥ लोकातिशायिविभवं महदासेवे चिदम्बररहस्यम् । पश्चाक्षरी यदीया जीवातुः
    सर्वलोकशुभदात्री ॥ ११६॥ शक्तीः समग्राः ग्रसते दिनान्ते यस्मिंश्च गौर्या वलते कपदीम् । यस्मात्प्रगे
    विश्वमुपैति शक्तिं चकास्ति तच्चेतसि मे चकास्तु ॥ ११३
meaning: {}
