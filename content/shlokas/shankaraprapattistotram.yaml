id: shankaraprapattistotram
category: stotram
name:
  english: shankaraprapattistotram
  devanagari: शन्करप्रपत्तिस्तोत्रम्
content:
  english: yatpadapadmam nigamantavedyam yatpadapadmam munivrindavandyam | yatpadapadmam vidhivishnumrigyam
    tatpadapadmam sharanam vrajami || 174|| yatpadapadyambujamadivishnuh svanetrapadmena manoharena |
    samarcayamasa tadarcanena saubhagyamukti sulabhena lapsye || 175|| yatpadapadmambujarenumishtam mukundacandrendra
    caturmukhadyah | samarcayantyanvahamadarena tatpadapadmam sharanam vrajami || 176|| yannamasankirtanamekameva
    vinashayatyashu mahaghasangham | tam devamisham sharanam vrajami brahmendravishnvadisuraikavandyam
    || 177|| yannamamatroccaranena sadyo dhanya bhavantyeva hi papino'pi | tam devamisham sharanam vrajami
    brahmendravishnvadisuraikavandyam || 178|| yannama dehakshayapurvakale smritam dadatyeva hi mokshamekam
    | tam devamisham sharanam vrajami brahmendravishnvadisuraikavandyam || 179|| yannamatattvam na vidhirvideda
    yannamatattvam na viveda vishnuh | tam devamisham sharanam vrajami brahmendravishnvadisuraikavandyam
    || 180|| yannamatattvam na viveda vedo
  devanagari: यत्पादपद्मं निगमान्तवेद्यं यत्पादपद्मं मुनिवृन्दवन्द्यम् । यत्पादपद्मं विधिविष्णुमृग्यं
    तत्पादपद्मं शरणं व्रजामि ॥ १७४॥ यत्पादपद्याम्बुजमादिविष्णुः स्वनेत्रपद्मेन मनोहरेण । समर्चायामास तदर्चनेन
    सौभाग्यमुक्ति सुलभेन लप्स्ये ॥ १७५॥ यत्पादपद्माम्बुजरेणुमिष्टं मुकुन्दचन्द्रेन्द्र चतुर्मुखाद्याः
    । समर्चयन्त्यन्वहमादरेण तत्पादपद्मं शरणं व्रजामि ॥ १७६॥ यन्नामसङ्कीर्तनमेकमेव विनाशयत्याशु महाघसङ्घम्
    । तं देवमीशं शरणं व्रजामि ब्रह्मेन्द्रविष्ण्वादिसुरैकवन्द्यम् ॥ १७७॥ यन्नाममात्रोच्चरणेन सद्यो धन्या
    भवन्त्येव हि पापिनोऽपि । तं देवमीशं शरणं व्रजामि ब्रह्मेन्द्रविष्ण्वादिसुरैकवन्द्यम् ॥ १७८॥ यन्नाम
    देहक्षयपूर्वकाले स्मृतं ददात्येव हि मोक्षमेकम् । तं देवमीशं शरणं व्रजामि ब्रह्मेन्द्रविष्ण्वादिसुरैकवन्द्यम्
    ॥ १७९॥ यन्नामतत्त्वं न विधिर्विदेद यन्नामतत्त्वं न विवेद विष्णुः । तं देवमीशं शरणं व्रजामि ब्रह्मेन्द्रविष्ण्वादिसुरैकवन्द्यम्
    ॥ १८०॥ यन्नामतत्त्वं न विवेद वेदो
