id: jinasahasranamastotramjinasenakritam
category: sahasranama
name:
  english: jinasahasranamastotramjinasenakritam
  devanagari: जिनसहस्रनामस्तोत्रम्जिनसेनकृतम्
content:
  english: tya paramaya sudhih | pathedashtotaram namnam sahasram papashantaye || 34|| || iti prastavana
    || pushpanjalih || 1 atha shrimadadishatam | prasiddhashtasahasradvelakshanam tvam girampatim | namnamashtasahasrena
    toshtumo'bhishtasiddhaye || 1|| shriman svayambhurvrishabhah shambhavah shambhuratmabhuh | svayamprabhah
    prabhurbhokta vishvabhurapunarbhavah || 2|| vishvatma vishvalokesha vishvatashcakshuraksharah | vishvavidvishvavidyesho
    vishvayoniranashvarah || 3|| vishvadrishva vibhurdhata vishvesho vishvalocanah | vishvavyapi vidhirvedhah
    shashvato vishvatomukhah || 4|| vishvakarma jagajjyeshtho vishvamurtirjineshvarah | vishvadrik vishvabhutesho
    vishvajyotiranishvarah || 5|| jino jishnurameyatma vishvarisho jagatpatih | anantajidacintyatma bhavyabandhurabandhanah
    || 6|| yugadipurusho brahma pancabrahmamayah shivah | parah paratarah sukshmah parameshthi sanatanah
    || 7|| svayanjyotirajo'janma brahmayonirayonijah | moharivijayi jeta dharmacakri dayadhvajah || 8||
    prashantariranantatma yogi yogishvararcitah | brahmavid brahmatattvajno brahmodyavidyatishvarah ||
    9|| shuddho buddhah prabuddhatma siddharthah siddhashasanah | siddhah siddhantavid dhyeyah siddhasadhyo
    jagaddhitah || 10|| sahishnuracyuto'nantah prabhavishnurbhavodbhavah | prabhushnurajaro'jaryo bhrajishnurdhishvaro'vyayah
    || 11|| vibhavasurasambhushnuh svayambhushnuh puratanah | paramatma paranjyotistrijagatparameshvarah
    || 12|| || iti shrimadadishatam || 1 || udakacandanatandula||| adi shloka || arghyam | 2 atha divyadishatam
    | divyabhashapatirdivyah putavak putashasanah | putatma paramajyotirdharmadhyaksho damishvarah ||
    13|| shripatirbhagavanarhannaraja virajah shucih | tirthamkritkevalishanah pujarhah snatako'malah
    || 14|| anantadiptirjnanatma svayambuddhah prajapatih | muktah shakto nirabadho nishkalo bhuvaneshvarah
    || 15|| niranjano jagajjyotirniruktoktirniramayah | acala sthitirakshobhyah kutasthah sthanurakshayah
    || 16|| agranirgramanirneta praneta nyayashastrakrit | shasta dharmapatirdharyo dharmatma dharmatirthankrit
    || 17|| vrishadhvajo vripadhisho vrishaketuvrishayudhah | vrisho vrishapatirbhartta vrishabhanko vrishodbhavah
    || 18|| hiranyanabhirbhutatma bhutabhridbhutabhavanah | prabhavo vibhavo bhasvan bhavo bhavo bhavantakah
    || 19|| hiranyagarbhah shrigarbhah prabhutavibhavodbhavah | svayamprabhuh prabhutatma bhutanatho jagatprabhuh
    || 20|| sarvadih sarvadrik sarvah sarvajnah sarvadarshanah | sarvatma sarvalokeshah sarvavit sarvalokajit
    || 21|| sugatih sushrutah sushruk suvak surirbahushrutah | vishruto vishvatah pado vishvashirshah
    shucishravah || 22|| sahasrashirshah kshetrajnah sahasrakshah sahasrapat | bhutabhavyabhavadbhartta
    vishvavidyamaheshvarah || 23|| || iti divyadishatam || 2 || arghyam || 3 atha sthavishthadishatam
    | sthavishthah sthavishe jyeshthah prishthah preshto varishtadhih | stheshtho garishtho bamhishthah
    shreshto'nishtho garishthagih || 24|| vishvabhridvishvasrid vishved vishvabhugvishvanayakah | vishvashirvishvarupatma
    vishvajidvijitantakah || 25|| vibhavo vibhayo viro vishoko virujo jaran | virago virato'sango vivikto
    vitamatsarah || 26|| vineyajanatabandhurvilinasheshakalmashah | viyogo yogavidvidvan vidhata suvidhih
    sudhih || 27|| kshantibhak prithivimurttih shantibhak salilatmakah | vayumurtirasangatma vahnimurtiradharmadhak
    || 28|| suyajva yajamanatma sutva sutramapujitah | ritvigyajnapatiryajyo yajnangamamritam havih ||
    29|| vyomamurtiramurttatma nirlepo nirmalo'calah | somamurttih susaumyatma suryamurtirmahaprabhah
    || 30|| mantravinmantrakrinmantri mantramurtiranantagah | svatantrastantrakritsvantah kritantantah
    kritantakrit || 31|| kriti kritarthah satkrityah kritakrityah kritakratuh | nityo mrityunjayo'mrityuramritatma'mritodbhavah
    || 32|| brahmanishthah parambrahma brahmatma brahmasambhavah | mahabrahmapatirbrahmet mahabrahmapadeshvarah
    || 33|| suprasannah prasannatma jnanadharmadamaprabhuh | prashamatma prashantatma puranapurushottamah
    || 34|| || iti sthavishthadishatam || 3 || arghyam || 4 atha mahashokadhvajadishatam | mahashokadhvajo'shokah
    kah srashta padmavishtarah | padmeshah padmasambhutih padmanabhiranuttarah || 35|| padmayonirjagadyonirityah
    stutyah stutishvarah | stavanarho hrishikesho jitajeyah kritakriyah || 36|| ganadhipo ganajyeshtho
    ganyah punyo ganagranih | gunakaro gunambhodhirgunajno gunanayakah || 37|| gunadari gunocchedi nirgunah
    punyagirgunah | sharanyah punyavak puto varenyah punyanayakah || 38|| aganyah punyadhirgunyah punyakritpunyashasanah
    | dharmaramo gunagramah punyapunyanirodhakah || 39|| papapeto vipapatma vipapma vitakalmashah | nidvandvo
    nirmadah shanto nirmoho nirupaplavah || 40|| nirnimesho niraharo nihkriyo nirupaplavah | nishkalanko
    nirastaina nirdhutango nirasravah || 41|| vishalo vipulajyotiratulo'cintyavaibhavah | susamvritah
    sugutmatma subhritsunayatastvavit || 42|| ekavidyo mahavidyo munihparivridhah patih | dhisho vidyanidhihsati
    vineta vitantakah || 43|| pita pitamahah pata pavitrah pavano gatih | trata bhishagvaro varyo varadah
    paramah puman || 44|| kavih puranapurusho varshiyan vrishabhah puruh | pratishthaprasavo heturbhuvanaikapitamahah
    || 45|| || iti mahashokadhvajadishatam || 4 || arghyam || 5 atha shrivrikshalakshanadishatam | shrivrikshalakshanah
    shlakshno lakshanyah shubhalakshanah | nirakshah pundarikakshah pushkalah pushkarekshanah || 46||
    siddhidah siddhasankalpah siddhatma siddhasadhanah | buddhabodhyo mahabodhirvardhamano maharddhikah
    || 47|| vedango vedavidvedyo jatarupo vidamvarah | vedavedyah svasamvedyo vivedo vadatamvarah || 48||
    anadinidhano'vyakto vyaktavagvyaktashasanah | yugadikridyugadharo yugadirjagadadijah || 49|| atindro'tindriyo
    ghindro mahendro'tindriyarthadrik | anindriyo'hamindrarcyo mahendramahito mahan || 50|| udbhavah karanam
    kartta parago bhavatarakah | agahyo gahanam guhyam parardhyah parameshvarah || 51|| anantarddhirameyarddhiracintyarddhih
    samagradhih | pragryah pragraharo'bhyagryah pratyagro'myo'grimo'grajah || 52|| mahatapah mahateja
    mahodarko mahodayah | mahayasha mahadhama mahasattvo mahadhritih || 53|| mahadhairyo mahaviryo mahasampanmahabalah
    | mahashaktirmahajyotirmahabhutirmahadyutih || 54|| mahamatirmahanitirmahakshantirmahodayah | mahaprajno
    mahabhago mahanando mahakavih || 55|| mahamaha mahakirttirmahakantirmahavapuh | mahadano mahajnano
    mahayogo mahagunah || 56|| mahamahapatih praptamahakalyanapancakah | mahaprabhurmahapratiharyadhisho
    maheshvarah || 57|| || iti shrivrikshadishatam || 5 || arghyam || 6 atha mahamunyadishatam | mahamunirmahamauni
    mahadhyano mahadamah | mahakshamo mahashilo mahayajno mahamakhah || 58|| mahavratapatirmahyo mahakantidharo'dhipah
    | mahamaitrimayo'meyo mahopayo mahomayah || 59|| mahakaruniko manta mahamantro mahamatih | mahanado
    mahaghosho mahejyo mahasampatih || 60|| mahadhvaradharo dhuryo mahaudaryo mahishthavak | mahatma mahasandhama
    maharshirmahitodayah || 61|| mahakleshankushah shuro mahabhutapatirguruh | mahaparakramo'nanto mahakrodharipurvashi
    || 62|| mahabhavabdhisantari mahamohadrisudanah | mahagunakarahkshanto mahayogishvarah shami || 63||
    mahadhyanapatirdhyata mahadharma mahavratah | mahakarmarihatmajno mahadevo maheshita || 64|| sarvakleshapaha
    sadhuh sarvadoshaharo harah | asankhyeyo'prameyatma shamatma prashamakarah || 65|| sarvayogishvaro'cintyah
    shrutatma vishtarashravah | dantatma damatirthesho yogatma jnanasarvagah || 66|| pradhanamatma prakritih
    paramah paramodayah | prakshinabandhah kamarih kshemakrit kshemashasanah || 67|| pranavah pranayah
    pranah pranadah pranateshvarah | pramanam pranidhirdaksho dakshino'dhvaryuradhvarah || 68|| anando
    nandano nando vandyo'ninyo'bhinandanah | kamaha kamadah kamyah kamadhenurarinjayah || 69|| || iti
    mahamunyadishatam || 6 || arghyam || 7 atha samskritadishatam | asamskritah susamskarah prakrito vaikritantakrit
    | antakritkantiguh kantashcintamanirabhishtadah || 70|| ajito jitakamariramito'mitashasanah | jitakrodho
    jitamitro jitakresho jitantakah || 71|| jinendrah paramanando munindro dundubhisvanah | mahendravanyo
    yogindro yatindro nabhinandanah || 72|| nabheyo nabhijo'jatah suvrato manuruttamah | abhedyo'natyayo'nashvanadhiko'dhiguruh
    sudhih || 73|| sumedha vikrami svami duradharsho nirutsukah | vishishtah shishtabhuk shishtah pratyayah
    kamano'naghah || 74|| kshemi kshemankaro'kshayyah kshemadharmapatih kshami | agrahyo jnananigrahyo
    dhyanagamyo niruttarah || 75|| sukriti dhaturijyarhah sunayashcaturananah | shrinivasashcaturvaktrashcaturasyashcaturmukhah
    || 76|| satyatma satyavijnanah satyavak satyashasanah | satyashih satyasandhanah satyah satyaparayanah
    || 77|| stheyan sthaviyan nediyan daviyan duradarshanah | anoraniyanananurgururayo gariyasam || 78||
    sadayogah sadabhogah sadatriptah sadashivah | sadagatih sadasaukhyah sadavidyah sadodayah || 79||
    sughoshah sumukhah saumyah sukhadah suhitah suhrit | sugupto guptibhrid gopta lokadhyaksho damishvarah
    || 80| || iti asamskritadishatam || 7 || arghyam || 8 atha brihadadishatam | brihan brihaspatirvagmi
    vacaspatirudaradhih | manishi dhishano dhimanchemushisho girampatih || 81|| naikarupo nayottango naikatma
    naikadharmakrit | avijneyo'pratarkyatma kritajnah kritalakshanah || 82|| jnanagarbho dayagarbho ratnagarbhah
    prabhasvarah | padmagarbho jagadgarbho hemagarbhah sudarshanah || 83|| lakshmivamstridashadhyaksho
    dridhiyanina ishita | manoharo manojnango dhiro gambhirashasanah || 84|| dharmayupo dayayago dharmanemirmunishvarah
    | dharmacakrayudho devah karmaha dharmaghoshanah || 85|| amoghavagamoghajno nirmalo'moghashasanah
    | surupah subhagastyagi samayajnah samahitah || 86|| susthitah svasthyabhak svastho nirajasko nirudvavah
    | alepo nishkalankatma vitarago gatasprihah || 87|| vashyendriyo vimuktatma nihsapatno jitendriyah
    | prashanto'nantadhamarshimangalam malahanaghah || 88|| anidrigupamabhuto dishtirdaivamagocarah |
    amurto murttimaneko naiki nanaikatattvadrik || 89|| adhyatmagamyo gamyatma yogavidyogivanditah | sarvatragah
    sadabhavo trikala vishayarthadrik || 90|| shankarah shamvado danto dami kshantiparayanah | adhipah
    paramanandah paratmajnah paratparah || 91|| trijagadvallabho'bhyarcya stri jaganmangalodayah | trijagatpatipujyanghristrilokagrashikhamanih
    || 92|| || iti brihadadishatam || 8 || arghyam || 9 atha trikaladarshyadishatam | trikaladarshi lokesho
    lokadhata dridhavratah | sarvalokatigah pujyah sarvalokaikasarathih || 93|| puranah purushah purvah
    kritapurvagavistarah | adidevah puranadyah purudevo'dhidevata || 94|| yugamukho yugajyeshtho yugadisthitideshakah
    | kalyanavarnah kalyanah kalyah kalyanalakshanah || 95|| kalyanaprakritirdiptakalyanatma vikalmashah
    | vikalankah kalatitah kalilaghnah kaladharah || 96|| devadevo jagannatho jagadvandhurjagadvibhuh
    | jagadvitaishi lokajnah sarvago jagadagragah || 97|| caracaragururgopyo gudhatma gudhagocarah | sadyojatah
    prakashatma jvalajjvalanasaprabhah || 98|| adityavarno bharmabhah suprabhah kanakaprabhah | suvarnavarno
    rukmabhah suryakotisamaprabhah || 99|| tapaniyanibhastungo balarkabho'nalaprabhah | sandhyabhrababhruhemabhastaptacamikaracchavih
    || 100|| nishtaptakanakacchrayah kanatkancanasannibhah | hiranyavarnah svarnabhah shatakumbhanibhaprabhah
    || 101|| dyunnabho jatarupabho diptajambunadadyutih | sudhautakaladhautashrih pradipto hatakadyutih
    || 102|| shishteshtah pushtidah pushtah spashtah spashtaksharah kshamah | shatrughno'pratigho'moghah
    prashasta shasita svabhuh || 103|| shantinishtho munijyeshthah shivatatih shivapradah | shantidah
    shantikricchantih kantiman kamitapradah || 104|| shreyonidhiradhishthanamapratishthah pratishthitah
    | susthirah sthavarah sthanuh prathiyan prathitah prithuh || 105|| || iti trikaladarshyadishatam ||
    9 || arghyam || 10 atha digvasadishatam | digvasa vatarashano nirgranthesho nirambarah | nishkincano
    nirashamso jnanacakshuramomuhah || 106|| tejorashiranantauja jnanandhih shilasagarah | tejomayo'mitajyotirjyotimurttistamopahah
    || 107|| jagaccudamanirdiptah shamvan vighnavinayakah | kalighnah karmashatrughno lokalokaprakashakah
    || 108|| anidraluratandralurjagarukah pramamayah | lakshmipatirjagajjyotirdharmarajah prajahitah ||
    109|| mumukshurbandhamokshajno jitaksho jitamanmathah | prashantarasashailusho bhavyapetakanayakah
    || 110|| mula kartta'khilajyotirmalaghno mulakaranam | apto vagishvarah shreyandrayasoktirniruktavak
    || 111|| pravakta vacasamisho marajidvishvabhavavit | sutanustanurnirmuktah sugato hatadurnayah ||
    112|| shrishah shrishritapadabjo vitabhirabhayankarah | utsannadosho nirvighno nishcalo lokavatsalah
    || 113|| lokottaro lokapatirlokavakshuraparadhih | dhiradhirbuddhasanmargah shuddhah sunritaputavak
    || 114|| prajnaparamitah prajno yatirniyamitendriyah | bhadanto bhadrakrid bhadrah kalpavriksho varapradah
    || 115|| samunmulitakarmarih karmakashthashushunih | karmanyah karmathah pramshurheyadeyavicakshanah
    || 116|| anantashaktiracchedyastripuraristrilocanah | trinetrastryambakastryakshah kevalajnanavikshanah
    || 117|| samantabhadrah shantarirdharmacaryo dayanidhih | sukshmadarshi jitanangah kripalurdharmadeshakah
    || 118|| shubhamyuh sukhasadbhutah punyarashiranamayah | dharmapalo jagatpalo dharmasamrajyanayakah
    || 119|| || iti digvasadyashtottarashatam || 10 || arghyam || uttarapithika | dhamnam pate tavamuni
    namanyagamakovidaih | samuccitanyanudhyayanpumanputasmritirbhavet || 120|| gocaro'pi giramasantvamavaggocaro
    matah | stota tatha pyasandigdham tvatto'bhishtaphalam bhajet || 121|| tvamato'si jagadbndhustvamato'si
    jagadvishak | tvamato'si jagaddhata tvamato'si jagaddhitah || 122|| tvamekam jagatam jyotistvam dvirupopayogabhak
    | tvam trirupaikamuk
  devanagari: त्या परमया सुधीः । पठेदष्टोतरं नाम्नां सहस्रं पापशान्तये ॥ ३४॥ ॥ इति प्रस्तावना ॥ पुष्पाञ्जलिः
    ॥ १ अथ श्रीमदादिशतम् । प्रसिद्धाष्टसहस्रद्वेलक्षणं त्वां गिराम्पतिम् । नाम्नामष्टसहस्रेण तोष्टुमोऽभीष्टसिद्धये
    ॥ १॥ श्रीमान् स्वयम्भूर्वृषभः शम्भवः शम्भुरात्मभूः । स्वयम्प्रभः प्रभुर्भोक्ता विश्वभूरपुनर्भवः ॥
    २॥ विश्वात्मा विश्वलोकेश विश्वतश्चक्षुरक्षरः । विश्वविद्विश्वविद्येशो विश्वयोनिरनश्वरः ॥ ३॥ विश्वदृश्वा
    विभुर्धाता विश्वेशो विश्वलोचनः । विश्वव्यापी विधिर्वेधाः शाश्वतो विश्वतोमुखः ॥ ४॥ विश्वकर्मा जगज्ज्येष्ठो
    विश्वमूर्तिर्जिनेश्वरः । विश्वदृक् विश्वभूतेशो विश्वज्योतिरनीश्वरः ॥ ५॥ जिनो जिष्णुरमेयात्मा विश्वरीशो
    जगत्पतिः । अनन्तजिदचिन्त्यात्मा भव्यबन्धुरबन्धनः ॥ ६॥ युगादिपुरुषो ब्रह्मा पञ्चब्रह्ममयः शिवः । परः
    परतरः सूक्ष्मः परमेष्ठी सनातनः ॥ ७॥ स्वयञ्ज्योतिरजोऽजन्मा ब्रह्मयोनिरयोनिजः । मोहारिविजयी जेता धर्मचक्री
    दयाध्वजः ॥ ८॥ प्रशान्तारिरनन्तात्मा योगी योगीश्वरार्चितः । ब्रह्मविद् ब्रह्मतत्त्वज्ञो ब्रह्मोद्याविद्यतीश्वरः
    ॥ ९॥ शुद्धो बुद्धः प्रबुद्धात्मा सिद्धार्थः सिद्धशासनः । सिद्धः सिद्धान्तविद् ध्येयः सिद्धसाध्यो जगद्धितः
    ॥ १०॥ सहिष्णुरच्युतोऽनन्तः प्रभविष्णुर्भवोद्भवः । प्रभूष्णुरजरोऽजर्यो भ्राजिष्णुर्धीश्वरोऽव्ययः ॥
    ११॥ विभावसुरसम्भूष्णुः स्वयम्भूष्णुः पुरातनः । परमात्मा परञ्ज्योतिस्त्रिजगत्परमेश्वरः ॥ १२॥ ॥ इति
    श्रीमदादिशतम् ॥ १ ॥ उदकचन्दनतन्दुल॥। आदि श्लोक ॥ अर्घ्यम् । २ अथ दिव्यादिशतम् । दिव्यभाषापतिर्दिव्यः
    पूतवाक् पूतशासनः । पूतात्मा परमज्योतिर्धर्माध्यक्षो दमीश्वरः ॥ १३॥ श्रीपतिर्भगवानर्हन्नरजा विरजाः
    शुचिः । तीर्थंकृत्केवलीशानः पूजार्हः स्नातकोऽमलः ॥ १४॥ अनन्तदीप्तिर्ज्ञानात्मा स्वयम्बुद्धः प्रजापतिः
    । मुक्तः शक्तो निराबाधो निष्कलो भुवनेश्वरः ॥ १५॥ निरञ्जनो जगज्ज्योतिर्निरुक्तोक्तिर्निरामयः । अचल
    स्थितिरक्षोभ्यः कूटस्थः स्थाणुरक्षयः ॥ १६॥ अग्रणीर्ग्रामणीर्नेता प्रणेता न्यायशास्त्रकृत् । शास्ता
    धर्मपतिर्धर्यो धर्मात्मा धर्मतीर्थङ्कृत् ॥ १७॥ वृषध्वजो वृपाधीशो वृषकेतुवृषायुधः । वृषो वृषपतिर्भर्त्ता
    वृषभाङ्को वृषोद्भवः ॥ १८॥ हिरण्यनाभिर्भूतात्मा भूतभृद्भूतभावनः । प्रभवो विभवो भास्वान् भवो भावो भवान्तकः
    ॥ १९॥ हिरण्यगर्भः श्रीगर्भः प्रभूतविभवोद्भवः । स्वयम्प्रभुः प्रभूतात्मा भूतनाथो जगत्प्रभुः ॥ २०॥ सर्वादिः
    सर्वदृक् सार्वः सर्वज्ञः सर्वदर्शनः । सर्वात्मा सर्वलोकेशः सर्ववित् सर्वलोकजित् ॥ २१॥ सुगतिः सुश्रुतः
    सुश्रुक् सुवाक् सूरिर्बहुश्रुतः । विश्रुतो विश्वतः पादो विश्वशीर्षः शुचिश्रवाः ॥ २२॥ सहस्रशीर्षः क्षेत्रज्ञः
    सहस्राक्षः सहस्रपात् । भूतभव्यभवद्भर्त्ता विश्वविद्यामहेश्वरः ॥ २३॥ ॥ इति दिव्यादिशतम् ॥ २ ॥ अर्घ्यम्
    ॥ ३ अथ स्थविष्ठादिशतम् । स्थविष्ठः स्थविशे ज्येष्ठः पृष्ठः प्रेष्टो वरिष्टधीः । स्थेष्ठो गरिष्ठो बंहिष्ठः
    श्रेष्टोऽणिष्ठो गरिष्ठगीः ॥ २४॥ विश्वभृद्विश्वसृड् विश्वेद् विश्वभुग्विश्वनायकः । विश्वाशीर्विश्वरूपात्मा
    विश्वजिद्विजितान्तकः ॥ २५॥ विभवो विभयो वीरो विशोको विरुजो जरन् । विरागो विरतोऽसङ्गो विविक्तो वीतमत्सरः
    ॥ २६॥ विनेयजनताबन्धुर्विलीनाशेषकल्मषः । वियोगो योगविद्विद्वान् विधाता सुविधिः सुधीः ॥ २७॥ क्षान्तिभाक्
    पृथिवीमूर्त्तिः शान्तिभाक् सलिलात्मकः । वायुमूर्तिरसङ्गात्मा वह्निमूर्तिरधर्मधक् ॥ २८॥ सुयज्वा यजमानात्मा
    सुत्वा सुत्रामपूजितः । ऋत्विग्यज्ञपतिर्याज्यो यज्ञाङ्गममृतं हविः ॥ २९॥ व्योममूर्तिरमूर्त्तात्मा निर्लेपो
    निर्मलोऽचलः । सोममूर्त्तिः सुसौम्यात्मा सूर्यमूर्तिर्महाप्रभः ॥ ३०॥ मन्त्रविन्मन्त्रकृन्मन्त्री मन्त्रमूर्तिरनन्तगः
    । स्वतन्त्रस्तन्त्रकृत्स्वान्तः कृतान्तान्तः कृतान्तकृत् ॥ ३१॥ कृती कृतार्थः सत्कृत्यः कृतकृत्यः कृतक्रतुः
    । नित्यो मृत्युञ्जयोऽमृत्युरमृतात्माऽमृतोद्भवः ॥ ३२॥ ब्रह्मनिष्ठः परम्ब्रह्म ब्रह्मात्मा ब्रह्मसम्भवः
    । महाब्रह्मपतिर्ब्रह्मेट् महाब्रह्मपदेश्वरः ॥ ३३॥ सुप्रसन्नः प्रसन्नात्मा ज्ञानधर्मदमप्रभुः । प्रशमात्मा
    प्रशान्तात्मा पुराणपुरुषोत्तमः ॥ ३४॥ ॥ इति स्थविष्ठादिशतम् ॥ ३ ॥ अर्घ्यम् ॥ ४ अथ महाशोकध्वजादिशतम्
    । महाशोकध्वजोऽशोकः कः स्रष्टा पद्मविष्टरः । पद्मेशः पद्मसम्भूतिः पद्मनाभिरनुत्तरः ॥ ३५॥ पद्मयोनिर्जगद्योनिरित्यः
    स्तुत्यः स्तुतीश्वरः । स्तवनार्हो हृषीकेशो जितजेयः कृतक्रियः ॥ ३६॥ गणाधिपो गणज्येष्ठो गण्यः पुण्यो
    गणाग्रणीः । गुणाकरो गुणाम्भोधिर्गुणज्ञो गुणनायकः ॥ ३७॥ गुणादरी गुणोच्छेदी निर्गुणः पुण्यगीर्गुणः ।
    शरण्यः पुण्यवाक् पूतो वरेण्यः पुण्यनायकः ॥ ३८॥ अगण्यः पुण्यधीर्गुण्यः पुण्यकृत्पुण्यशासनः । धर्मारामो
    गुणग्रामः पुण्यापुण्यनिरोधकः ॥ ३९॥ पापापेतो विपापात्मा विपाप्मा वीतकल्मषः । निद्वन्द्वो निर्मदः शान्तो
    निर्मोहो निरुपप्लवः ॥ ४०॥ निर्निमेषो निराहारो निःक्रियो निरुपप्लवः । निष्कलङ्को निरस्तैना निर्धूताङ्गो
    निरास्रवः ॥ ४१॥ विशालो विपुलज्योतिरतुलोऽचिन्त्यवैभवः । सुसंवृतः सुगुत्मात्मा सुभृत्सुनयतस्त्ववित्
    ॥ ४२॥ एकविद्यो महाविद्यो मुनिःपरिवृढः पतिः । धीशो विद्यानिधिःसाती विनेता वितान्तकः ॥ ४३॥ पिता पितामहः
    पाता पवित्रः पावनो गतिः । त्राता भिषग्वरो वर्यो वरदः परमः पुमान् ॥ ४४॥ कविः पुराणपुरुषो वर्षीयान्
    वृषभः पुरुः । प्रतिष्ठाप्रसवो हेतुर्भुवनैकपितामहः ॥ ४५॥ ॥ इति महाशोकध्वजादिशतम् ॥ ४ ॥ अर्घ्यम् ॥ ५
    अथ श्रीवृक्षलक्षणादिशतम् । श्रीवृक्षलक्षणः श्लक्ष्णो लक्षण्यः शुभलक्षणः । निरक्षः पुण्डरीकाक्षः पुष्कलः
    पुष्करेक्षणः ॥ ४६॥ सिद्धिदः सिद्धसङ्कल्पः सिद्धात्मा सिद्धसाधनः । बुद्धबोध्यो महाबोधिर्वर्धमानो महर्द्धिकः
    ॥ ४७॥ वेदाङ्गो वेदविद्वेद्यो जातरूपो विदांवरः । वेदवेद्यः स्वसंवेद्यो विवेदो वदतांवरः ॥ ४८॥ अनादिनिधनोऽव्यक्तो
    व्यक्तवाग्व्यक्तशासनः । युगादिकृद्युगाधारो युगादिर्जगदादिजः ॥ ४९॥ अतीन्द्रोऽतीन्द्रियो घीन्द्रो महेन्द्रोऽतीन्द्रियार्थदृक्
    । अनिन्द्रियोऽहमिन्द्रार्च्यो महेन्द्रमहितो महान् ॥ ५०॥ उद्भवः कारणं कर्त्ता पारगो भवतारकः । अगाह्यो
    गहनं गुह्यं परार्ध्यः परमेश्वरः ॥ ५१॥ अनन्तर्द्धिरमेयर्द्धिरचिन्त्यर्द्धिः समग्रधीः । प्राग्र्यः प्राग्रहरोऽभ्यग्र्यः
    प्रत्यग्रोऽम्योऽग्रिमोऽग्रजः ॥ ५२॥ महातपाः महातेजा महोदर्को महोदयः । महायशा महाधामा महासत्त्वो महाधृतिः
    ॥ ५३॥ महाधैर्यो महावीर्यो महासम्पन्महाबलः । महाशक्तिर्महाज्योतिर्महाभूतिर्महाद्युतिः ॥ ५४॥ महामतिर्महानीतिर्महाक्षान्तिर्महोदयः
    । महाप्राज्ञो महाभागो महानन्दो महाकविः ॥ ५५॥ महामहा महाकीर्त्तिर्महाकान्तिर्महावपुः । महादानो महाज्ञानो
    महायोगो महागुणः ॥ ५६॥ महामहपतिः प्राप्तमहाकल्याणपञ्चकः । महाप्रभुर्महाप्रातिहार्याधीशो महेश्वरः ॥
    ५७॥ ॥ इति श्रीवृक्षादिशतम् ॥ ५ ॥ अर्घ्यम् ॥ ६ अथ महामुन्यादिशतम् । महामुनिर्महामौनी महाध्यानो महादमः
    । महाक्षमो महाशीलो महायज्ञो महामखः ॥ ५८॥ महाव्रतपतिर्मह्यो महाकान्तिधरोऽधिपः । महामैत्रीमयोऽमेयो महोपायो
    महोमयः ॥ ५९॥ महाकारुणिको मन्ता महामन्त्रो महामतिः । महानादो महाघोषो महेज्यो महसाम्पतिः ॥ ६०॥ महाध्वरधरो
    धुर्यो महौदार्यो महिष्ठवाक् । महात्मा महसान्धाम महर्षिर्महितोदयः ॥ ६१॥ महाक्लेशाङ्कुशः शूरो महाभूतपतिर्गुरुः
    । महापराक्रमोऽनन्तो महाक्रोधरिपुर्वशी ॥ ६२॥ महाभवाब्धिसन्तारी महामोहाद्रिसूदनः । महागुणाकरःक्षान्तो
    महायोगीश्वरः शमी ॥ ६३॥ महाध्यानपतिर्ध्याता महाधर्मा महाव्रतः । महाकर्मारिहात्मज्ञो महादेवो महेशिता
    ॥ ६४॥ सर्वक्लेशापह साधुः सर्वदोषहरो हरः । असङ्ख्येयोऽप्रमेयात्मा शमात्मा प्रशमाकरः ॥ ६५॥ सर्वयोगीश्वरोऽचिन्त्यः
    श्रुतात्मा विष्टरश्रवाः । दान्तात्मा दमतीर्थेशो योगात्मा ज्ञानसर्वगः ॥ ६६॥ प्रधानमात्मा प्रकृतिः परमः
    परमोदयः । प्रक्षीणबन्धः कामारिः क्षेमकृत् क्षेमशासनः ॥ ६७॥ प्रणवः प्रणयः प्राणः प्राणदः प्रणतेश्वरः
    । प्रमाणं प्रणिधिर्दक्षो दक्षिणोऽध्वर्युरध्वरः ॥ ६८॥ आनन्दो नन्दनो नन्दो वन्द्योऽनिन्योऽभिनन्दनः ।
    कामहा कामदः काम्यः कामधेनुररिञ्जयः ॥ ६९॥ ॥ इति महामुन्यादिशतम् ॥ ६ ॥ अर्घ्यम् ॥ ७ अथ संस्कृतादिशतम्
    । असंस्कृतः सुसंस्कारः प्राकृतो वैकृतान्तकृत् । अन्तकृत्कान्तिगुः कान्तश्चिन्तामणिरभीष्टदः ॥ ७०॥ अजितो
    जितकामारिरमितोऽमितशासनः । जितक्रोधो जितामित्रो जितक्रेशो जितान्तकः ॥ ७१॥ जिनेन्द्रः परमानन्दो मुनीन्द्रो
    दुन्दुभिस्वनः । महेन्द्रवन्यो योगीन्द्रो यतीन्द्रो नाभिनन्दनः ॥ ७२॥ नाभेयो नाभिजोऽजातः सुव्रतो मनुरुत्तमः
    । अभेद्योऽनत्ययोऽनाश्वानधिकोऽधिगुरुः सुधीः ॥ ७३॥ सुमेधा विक्रमी स्वामी दुराधर्षो निरुत्सुकः । विशिष्टः
    शिष्टभुक् शिष्टः प्रत्ययः कामनोऽनघः ॥ ७४॥ क्षेमी क्षेमङ्करोऽक्षय्यः क्षेमधर्मपतिः क्षमी । अग्राह्यो
    ज्ञाननिग्राह्यो ध्यानगम्यो निरुत्तरः ॥ ७५॥ सुकृती धातुरिज्यार्हः सुनयश्चतुराननः । श्रीनिवासश्चतुर्वक्त्रश्चतुरास्यश्चतुर्मुखः
    ॥ ७६॥ सत्यात्मा सत्यविज्ञानः सत्यवाक् सत्यशासनः । सत्याशीः सत्यसन्धानः सत्यः सत्यपरायणः ॥ ७७॥ स्थेयान्
    स्थवीयान् नेदीयान् दवीयान् दूरदर्शनः । अणोरणीयाननणुर्गुरुरायो गरीयसाम् ॥ ७८॥ सदायोगः सदाभोगः सदातृप्तः
    सदाशिवः । सदागतिः सदासौख्यः सदाविद्यः सदोदयः ॥ ७९॥ सुघोषः सुमुखः सौम्यः सुखदः सुहितः सुहृत् । सुगुप्तो
    गुप्तिभृद् गोप्ता लोकाध्यक्षो दमीश्वरः ॥ ८०। ॥ इति असंस्कृतादिशतम् ॥ ७ ॥ अर्घ्यम् ॥ ८ अथ बृहदादिशतम्
    । बृहन् बृहस्पतिर्वाग्मी वाचस्पतिरुदारधीः । मनीषी धिषणो धीमाञ्छेमुषीशो गिराम्पतिः ॥ ८१॥ नैकरूपो नयोत्तङ्गो
    नैकात्मा नैकधर्मकृत् । अविज्ञेयोऽप्रतर्क्यात्मा कृतज्ञः कृतलक्षणः ॥ ८२॥ ज्ञानगर्भो दयागर्भो रत्नगर्भः
    प्रभास्वरः । पद्मगर्भो जगद्गर्भो हेमगर्भः सुदर्शनः ॥ ८३॥ लक्ष्मीवांस्त्रिदशाध्यक्षो दृढीयानिन ईशिता
    । मनोहरो मनोज्ञाङ्गो धीरो गम्भीरशासनः ॥ ८४॥ धर्मयूपो दयायागो धर्मनेमिर्मुनीश्वरः । धर्मचक्रायुधो देवः
    कर्महा धर्मघोषणः ॥ ८५॥ अमोघवागमोघाज्ञो निर्मलोऽमोघशासनः । सुरूपः सुभगस्त्यागी समयज्ञः समाहितः ॥ ८६॥
    सुस्थितः स्वास्थ्यभाक् स्वस्थो नीरजस्को निरुद्ववः । अलेपो निष्कलङ्कात्मा वीतरागो गतस्पृहः ॥ ८७॥ वश्येन्द्रियो
    विमुक्तात्मा निःसपत्नो जितेन्द्रियः । प्रशान्तोऽनन्तधामर्षिमङ्गलं मलहानघः ॥ ८८॥ अनीदृगुपमाभूतो दिष्टिर्दैवमगोचरः
    । अमूर्तो मूर्त्तिमानेको नैकी नानैकतत्त्वदृक् ॥ ८९॥ अध्यात्मगम्यो गम्यात्मा योगविद्योगिवन्दितः । सर्वत्रगः
    सदाभावो त्रिकाल विषायर्थदृक् ॥ ९०॥ शङ्करः शंवदो दान्तो दमी क्षान्तिपरायणः । अधिपः परमानन्दः परात्मज्ञः
    परात्परः ॥ ९१॥ त्रिजगद्वल्लभोऽभ्यर्च्य स्त्रि जगन्मङ्गलोदयः । त्रिजगत्पतिपूज्याङ्घ्रिस्त्रिलोकाग्रशिखामणिः
    ॥ ९२॥ ॥ इति बृहदादिशतम् ॥ ८ ॥ अर्घ्यम् ॥ ९ अथ त्रिकालदर्श्यादिशतम् । त्रिकालदर्शी लोकेशो लोकधाता दृढव्रतः
    । सर्वलोकातिगः पूज्यः सर्वलोकैकसारथिः ॥ ९३॥ पुराणः पुरुषः पूर्वः कृतपूर्वागविस्तरः । आदिदेवः पुराणाद्यः
    पुरुदेवोऽधिदेवता ॥ ९४॥ युगमुखो युगज्येष्ठो युगादिस्थितिदेशकः । कल्याणवर्णः कल्याणः कल्यः कल्याणलक्षणः
    ॥ ९५॥ कल्याणप्रकृतिर्दीप्तकल्याणात्मा विकल्मषः । विकलङ्कः कलातीतः कलिलघ्नः कलाधरः ॥ ९६॥ देवदेवो जगन्नाथो
    जगद्वन्धुर्जगद्विभुः । जगद्वितैषी लोकज्ञः सर्वगो जगदग्रगः ॥ ९७॥ चराचरगुरुर्गोप्यो गूढात्मा गूढगोचरः
    । सद्योजातः प्रकाशात्मा ज्वलज्ज्वलनसप्रभः ॥ ९८॥ आदित्यवर्णो भर्माभः सुप्रभः कनकप्रभः । सुवर्णवर्णो
    रुक्माभः सूर्यकोटिसमप्रभः ॥ ९९॥ तपनीयनिभस्तुङ्गो बालार्काभोऽनलप्रभः । सन्ध्याभ्रबभ्रुहेमाभस्तप्तचामीकरच्छविः
    ॥ १००॥ निष्टप्तकनकच्छ्रायः कनत्काञ्चनसन्निभः । हिरण्यवर्णः स्वर्णाभः शातकुम्भनिभप्रभः ॥ १०१॥ द्युन्नभो
    जातरूपाभो दीप्तजाम्बूनदद्युतिः । सुधौतकलधौतश्रीः प्रदीप्तो हाटकद्युतिः ॥ १०२॥ शिष्टेष्टः पुष्टिदः
    पुष्टः स्पष्टः स्पष्टाक्षरः क्षमः । शत्रुघ्नोऽप्रतिघोऽमोघः प्रशास्ता शासिता स्वभूः ॥ १०३॥ शान्तिनिष्ठो
    मुनिज्येष्ठः शिवतातिः शिवप्रदः । शान्तिदः शान्तिकृच्छान्तिः कान्तिमान् कामितप्रदः ॥ १०४॥ श्रेयोनिधिरधिष्ठानमप्रतिष्ठः
    प्रतिष्ठितः । सुस्थिरः स्थावरः स्थाणुः प्रथीयान् प्रथितः पृथुः ॥ १०५॥ ॥ इति त्रिकालदर्श्यादिशतम् ॥
    ९ ॥ अर्घ्यम् ॥ १० अथ दिग्वासादिशतम् । दिग्वासा वातरशनो निर्ग्रन्थेशो निरम्बरः । निष्किञ्चनो निराशंसो
    ज्ञानचक्षुरमोमुहः ॥ १०६॥ तेजोराशिरनन्तौजा ज्ञानान्धिः शीलसागरः । तेजोमयोऽमितज्योतिर्ज्योतिमूर्त्तिस्तमोपहः
    ॥ १०७॥ जगच्चूडामणिर्दीप्तः शंवान् विघ्नविनायकः । कलिघ्नः कर्मशत्रुघ्नो लोकालोकप्रकाशकः ॥ १०८॥ अनिद्रालुरतन्द्रालुर्जागरूकः
    प्रमामयः । लक्ष्मीपतिर्जगज्ज्योतिर्धर्मराजः प्रजाहितः ॥ १०९॥ मुमुक्षुर्बन्धमोक्षज्ञो जिताक्षो जितमन्मथः
    । प्रशान्तरसशैलूषो भव्यपेटकनायकः ॥ ११०॥ मूल कर्त्ताऽखिलज्योतिर्मलघ्नो मूलकारणम् । आप्तो वागीश्वरः
    श्रेयान्ड्रायसोक्तिर्निरुक्तवाक् ॥ १११॥ प्रवक्ता वचसामीशो मारजिद्विश्वभाववित् । सुतनुस्तनुर्निर्मुक्तः
    सुगतो हतदुर्णयः ॥ ११२॥ श्रीशः श्रीश्रितपादाब्जो वीतभीरभयङ्करः । उत्सन्नदोषो निर्विघ्नो निश्चलो लोकवत्सलः
    ॥ ११३॥ लोकोत्तरो लोकपतिर्लोकवक्षुरपारधीः । धीरधीर्बुद्धसन्मार्गः शुद्धः सूनृतपूतवाक् ॥ ११४॥ प्रज्ञापारमितः
    प्राज्ञो यतिर्नियमितेन्द्रियः । भदन्तो भद्रकृद् भद्रः कल्पवृक्षो वरप्रदः ॥ ११५॥ समुन्मूलितकर्मारिः
    कर्मकाष्ठाशुशुणिः । कर्मण्यः कर्मठः प्रांशुर्हेयादेयविचक्षणः ॥ ११६॥ अनन्तशक्तिरच्छेद्यस्त्रिपुरारिस्त्रिलोचनः
    । त्रिनेत्रस्त्र्यम्बकस्त्र्यक्षः केवलज्ञानवीक्षणः ॥ ११७॥ समन्तभद्रः शान्तारिर्धर्माचार्यो दयानिधिः
    । सूक्ष्मदर्शी जितानङ्गः कृपालुर्धर्मदेशकः ॥ ११८॥ शुभंयुः सुखसाद्भूतः पुण्यराशिरनामयः । धर्मपालो जगत्पालो
    धर्मसाम्राज्यनायकः ॥ ११९॥ ॥ इति दिग्वासाद्यष्टोत्तरशतम् ॥ १० ॥ अर्घ्यम् ॥ उत्तरपीठिका । धाम्नां पते
    तवामूनि नामान्यागमकोविदैः । समुच्चितान्यनुध्यायन्पुमान्पूतस्मृतिर्भवेत् ॥ १२०॥ गोचरोऽपि गिरामासान्त्वमवाग्गोचरो
    मतः । स्तोता तथा प्यसन्दिग्धं त्वत्तोऽभीष्टफलं भजेत् ॥ १२१॥ त्वमतोऽसि जगद्ब्न्धुस्त्वमतोऽसि जगद्विषक्
    । त्वमतोऽसि जगद्धाता त्वमतोऽसि जगद्धितः ॥ १२२॥ त्वमेकं जगतां ज्योतिस्त्वं द्विरूपोपयोगभाक् । त्वं
    त्रिरूपैकमुक्
