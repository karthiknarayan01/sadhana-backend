id: tyagaraja-pancharatna-keerthanas-duduku-gala
category: stotram
name:
  english: Tyagaraja Pancharatna Keerthanas Duduku Gala
content:
  english: shri tyagarajacaryulu ragam adi duduku gala nanne dòra kòduku brocura ènto duduku gala nanne
    dòra kadu durvishayakrishtudai gadiya gadiyaku nindaru duduku gala nanne dòra shri vanita hritkumudabja
    vangmanasagocara duduku gala nanne dòra sakala bhutamula yandu nivai yundaga madileka poyina duduku
    gala nanne dòra ciruta prayamuna nade bhajanamrita rasavihina kutarkudaina duduku gala nanne dòra
    para dhanamula kòraku nòrula madini karagabaliki kadupu nimpa diriginatti duduku gala nanne dòra tanamadini
    bhuvini saukhyapu jivaname yanucu sada dinamulu gadipèdi duduku gala nanne dòra tèliyani natavita
    kshudrulu vanitalu svavashamauta kupadashinci santasilli svaralayambu lèrungakanu shilatmudai subhaktulaku
    samanamanu duduku gala nanne dòra drishtiki sarambagu lalana sadanarbhaka senamita dhanadulanu devadi
    deva nèranammitini gakanu padabja bhajanambu maracina duduku gala nanne dòra cakkani mukha kamalambunanu
    sada na madilo smarana lekane durmadandha janula kori paritapamulace dagili nògili durvishaya durashalanu
    royaleka satata maparadhinai capala cittudaina duduku gala nanne dòra manavatanu durlabha manucu nènci
    paramananda mòndaleka mada matsara kama lobha mohamulaku dasudai mosaboti gaka mòdati kulajudagucu
    bhuvini shudrula panulu salpucununtini gaka naradhamulanu roya sarahina matamulanu sadhimpa tarumaru
    duduku gala nanne dòra satulakai kònnallasthikai sutulakai kònnallu dhana tatulakai tirigiti nayya
    tyagarajapta ituvanti duduku gala nanne dòra kòduku brocura ènto duduku gala nanne dòra
  devanagari: श्री त्यागराजाचार्युलु रागं आदि दुडुकु गल नन्ने दॊर कॊडुकु ब्रोचुरा ऎन्तो दुडुकु गल नन्ने
    दॊर कडु दुर्विषयाकृश्टुडै गडिय गडियकु निण्डारु दुडुकु गल नन्ने दॊर श्री वनिता हृत्कुमुदाब्ज वाङ्ग्मानसागोचर
    दुडुकु गल नन्ने दॊर सकल भूतमुल यन्दु नीवै युण्डग मदिलेक पोयिन दुडुकु गल नन्ने दॊर चिरुत प्रायमुन नाडे
    भजनामृत रसविहीन कुतर्कुडैन दुडुकु गल नन्ने दॊर पर धनमुल कॊरकु नॊरुल मदिनि करगबलिकि कडुपु निम्प दिरिगिनट्टि
    दुडुकु गल नन्ने दॊर तनमदिनि भुविनि सौख्यपु जीवनमे यनुचु सदा दिनमुलु गडिपॆडि दुडुकु गल नन्ने दॊर तॆलियनि
    नटविट क्षुद्रुलु वनितलु स्ववशमौट कुपदशिञ्चि सन्तसिल्लि स्वरलयम्बु लॆरुङ्गकनु शिलात्मुडै सुभक्तुलकु
    समानमनु दुडुकु गल नन्ने दॊर दृष्टिकि सारम्बगु ललना सदनार्भक सेनामित धनादुलनु देवादि देव नॆरनम्मितिनि
    गाकनु पदाब्ज भजनम्बु मरचिन दुडुकु गल नन्ने दॊर चक्कनि मुख कमलम्बुननु सदा ना मदिलो स्मरण लेकने दुर्मदान्ध
    जनुल कोरि परितापमुलचे दगिलि नॊगिलि दुर्विषय दुराशलनु रोयलेक सतत मपराधिनै चपल चित्तुडैन दुडुकु गल नन्ने
    दॊर मानवतनु दुर्लभ मनुचु नॆञ्चि परमानन्द मॊन्दलेक मद मत्सर काम लोभ मोहमुलकु दासुडै मोसबोति गाक मॊदटि
    कुलजुडगुचु भुविनि शूद्रुल पनुलु सल्पुचुनुण्टिनि गाक नाराधमुलनु रोय सारहीन मतमुलनु साधिम्प तारुमारु
    दुडुकु गल नन्ने दॊर सतुलकै कॊन्नाल्लास्थिकै सुतुलकै कॊन्नाल्लु धन ततुलकै तिरिगिति नय्य त्यागराजाप्त
    इटुवण्टि दुडुकु गल नन्ने दॊर कॊडुकु ब्रोचुरा ऎन्तो दुडुकु गल नन्ने दॊर
