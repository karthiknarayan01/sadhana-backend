id: kyts-jata-1-5-devasurah-samyatta-aasann-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.5 Devasurah Samyatta Aasann - Krishna Yajurveda Taittiriya Samhita
content:
  english: ya~tta devasura devasura devasura iti deva te deva devaste te devah | ndeva deva vijayam |
    vijaya mupayanta upayanto vijayam vi~jaya mupayantah | upayanto 'gna vagna vupayanta upayanto 'gnau
    | va~ma magna vagnau vamam | sanni ni sagm sanni | nyadadhatadadhata ni nyadadhata | adadhate da mida
    madadhatadadhate dam | ida mu vu vida mida mu | u no na u vu nah | no bhavishyati bhavishyati no no
    bhavishyati | bhavishyati yadi yadi bhavishyati bhavishyati yadi | yadi no no yadi yadi nah | no jeshyanti
    jeshyanti no no jeshyanti | jeshyantititi jeshyanti jeshyantiti | rni nyagni ragni nyakamayatakamayata
    ni nyakamayata | akamayata tena tenakamayatakamayata tena | tenapapa tena tenapa | deva vijitya vijitya
    deva deva vijitya | vijityavaruruthsamana avaruruthsamana vijitya vijityavaruruthsamanah | avaruruthsamana
    anvanvavaruruthsamana avaruruthsamana anu | avaruruthsamana ityava asya sahasa sahasa 'syasya sahasa
    | sahasa ''sahasa sahasa | a 'dithsantadithsanta 'dithsanta | adithsanta sa so 'dithsantadithsanta
    sah | drudrasya rudrasya ta rudrasya rudratvagm rudratvagm rudrasya rudrasya rudratvam | drudratvagm
    rudratvam rudratvamiti rudra ashrvashiyatashiyatashrvashrvashiyata | ttadashiyatashiyata tat | hiranyagm
    rajatagm rajatagm hiranyam | hiranya mabhava dabhavaddhiranya hiranyagm rajatagm rajatagm hiranyam
    | hiranya madakshinya madakshinyagm hiranya hiranya madakshinyam | adakshinya mashruja mashruja madakshinya
    madakshinya mashrujam | ashrujagm hi hyashruja mashrujagm hi | yo barhishi barhishi yo yo barhishi
    | barhishi dadati dadati barhishi barhishi dadati | dadati pura pura dadati dadati pura | sya pura
    pura 'sya | va~thsara dasyasya sam grihe rudanti rudanti grihe grihe rudanti | drudanti rudanti tasma
    dbarhishi barhishi tasma barhishi na na barhishi barhishi na | agni rabravi dabravi dagni ragni rabravit
    | dbhagi bhagyabravi dabravi bhagyasanyasani bhagi bhagyasani | asanyathathasanyasanyatha | atha vo
    vo 'thatha vah | ida mititida mida miti | mpunaradheya mititi punaradheya punaradheyamiti punah kevala
    mititi kevala ityabruva nnabruva nnitityabruvann | nnriddhnava driddhnavadabruva nnabruvannriddhnavat
    | tkhalu khalu riddhnavadriddhnava khalu sa sa khalu khalu sah | ityabravi dabraviditi tyabravit |
    maddevatya magni magni mmaddevatya magnim | maddevatyamiti mat agni madadhata adadhata agni magni
    madadhatai | adadhata itityadadhata adadhata iti | pusha 'dhatta dhatta pusha pusha 'dhatta | a 'dhattadhatta
    'dhatta | adhatta tena tenadhattadhatta tena | tena pusha pusha tena tena pusha | || pusha ''rdhnodardhno
    tpusha pusha ''rdhno ttasma dardhno dardhno tpaushnah paushnastasma paushnah pashavah pashavah paushnah
    paushnah pashavah | pashava ucyanta ucyante pashavah pashava ucyante | nta mucyanta ucyante tam |
    ntvashta tvashta ta tvashta ''tvashta tvashta | a 'dhattadhatta 'dhatta | adhatta tena tenadhattadhatta
    tena | tena tvashta tvashta tena tena tvashta ttasma dardhno dardhno ttvashtra stvashtra stasma tvashtrah
    pashavah pashava stvashtra stvashtrah pashavah | pashava ucyanta ucyante pashavah pashava ucyante
    | nta mucyanta ucyante tam | a 'dhattadhatta 'dhatta | adhatta tena tenadhattadhatta tena | rmanustena
    tena manuh | manu rardhno dardhno ttasma dardhno dardhno nmanavyo manavya stasma manavyah prajah praja
    manavyo manavyah prajah | praja ucyanta ucyante prajah praja ucyante | nta mucyanta ucyante tam |
    dhata 'dhattadhatta dhata dhata 'dhatta | a 'dhattadhatta 'dhatta | adhatta tena tenadhattadhatta
    tena | tena dhata dhata tena tena dhata | dhata ''rdhno dardhno ddhata dhata ''rdhno vai dhata dhata
    vai vai dhata | prajah pashavah pashavah prajah prajah pashavah | pashavo 'nvanu pashavah pashavo
    'nu | anu pra pranvanu pra | pra jayante jayante pra pra jayante | jayante yo yo jayante jayante yah
    | mpunaradheyasya punaradheyasyaiva meva punaradheyasya rdhi mriddhi mpunaradheyasya punaradheyasya
    rdhi punaradheyasyeti punah ve~da veda rdhi mriddhim veda rdhnotyriddhnoti veda veda rdhnoti | ||
    riddhnotyevaiva rdhnotyriddhnotyeva | asyaiva meva masyasyaivam | mbandhuta meva meva veda veda bandhuman
    | nbhavati bhavati bandhuma bandhumaniti bandhu agnirahita ahito 'gniragnirahitah | ahita icchamana
    icchamana ahita ahita icchamanah | mpraja micchamana icchamanah prajam | yajamanasya yajamanasya pashu
    yajamanasyopopa yajamanasya yajamanasyopa | upa dodrava dodravopopa dodrava | dodravodvasyodvasya
    dodrava dodravodvasya | udvasya punah puna rudvasyodvasya punah | puna ra punah puna ra | a dadhita
    dadhita dadhita | dadhita bhagadheyena bhagadheyena dadhita dadhita bhagadheyena | bhagadheyenaivaiva
    bhagadheyena bhagadheyenaiva | sa mardhayatyardhayati sagm sa mardhayati | ardhayatyatho atho ardhayatyardhayatyatho
    shshantiratho atho shantih | shantirevaiva shanti esha punarvasvoh punarvasvo reshaisha punarvasvoh
    | punarvasvora punarvasvoh punarvasvora | punarvasvoriti punah a dadhita dadhita dadhita | vai punaradheyasya
    punaradheyasya vai vai punaradheyasya | punaradheyasya nakshatrannakshatra mpunaradheyasya punaradheyasya
    nakshatram | punaradheyasyeti punah nnakshatrannakshatram tpunarvasu punarvasu ya mpunarvasu punarvasu
    svaya punarvasu iti punah svaya mevaiva svaya devataya madhayadhaya devataya ndevataya madhaya | adhaya
    brahmavarcasi brahmavarcasyadhayadhaya brahmavarcasi | brahmavarcasi bhavati bhavati brahmavarcasi
    brahmavarcasi bhavati | brahmavarcasiti brahma rbhavati bhavati darbhaih | a dadhati dadhatya dadhati
    | dadhatyayatayamatvayayatayamatvaya dadhati dadhatyayatayamatvaya | ayatayamatvaya darbhai rdarbhai
    rayatayamatvayayatayamatvaya darbhaih | ayatayamatvayetyayatayama a dadhati dadhatya dadhati | 'dbhyo
    dadhati dadhatyadbhyah | adbhya evaivadbhyo ena moshadhibhya oshadhibhya ena mena moshadhibhyah |
    oshadhibhyo 'varuddhyavaruddhyaushadhibhya oshadhibhyo 'varuddhya | avaruddhya 'varuddhyavaruddhya
    | a dhatte dhatta a dhatte | dhatte pancakapalah pancakapalo dhatte dhatte pancakapalah | pancakapalah
    purodashah purodashah pancakapalah pancakapalah purodashah | pancakapala iti panca purodasho bhavati
    bhavati purodashah purodasho bhavati | bhavati panca panca bhavati bhavati panca | panca vai vai panca
    panca vai | va ritava ritavo vai va ritavah | ritava ritubhya ritubhya ritava ritava ritubhyah | ritubhya
    evaiva rtubhya ritubhya eva | ena mavaruddhya varuddhyaina mena mavaruddhya | avaruddhya 'varuddhyavaruddhya
    | a dhatte dhatta a dhatte | dhatta iti dhatte | || para vai vai para para vai | va esha esha vai
    va eshah | ya~jna mesha esha yajnam | vapati yo yo vapati vapati yah | agni mudvasayata udvasayate
    'gni magni mudvasayate | udvasayate pancakapalah pancakapala udvasayata udvasayate pancakapalah |
    udvasayata ityut pancakapalah purodashah purodashah pancakapalah pancakapalah purodashah | pancakapala
    iti panca purodasho bhavati bhavati purodashah purodasho bhavati | bhavati panktah pankto bhavati
    bhavati panktah | pankto yajno yajnah panktah pankto yajnah | yajnah panktah pankta yajno yajnah panktah
    pashavah pashavah panktah panktah mpashavah pashavo yajnam | npashu nevaiva pashun | ava rundhe rundhe
    'vava rundhe | rundhe viraha viraha rundhe rundhe viraha | viraha vai vai viraha viraha vai | va esha
    esha vai va eshah | ndevana mesha esha devana agni mudvasayata udvasayate 'gni magni mudvasayate |
    udvasayate na nodvasayata udvasayate na | udvasayata ityut va etasyaitasya vai va etasya | etasya
    brahmana bra hmana etasyaitasya brahmanah | brahmana ritayava ritayavo ritayavah pura purartayava
    ritayavah pura | anna makshannakshannanna manna makshann | npanktyah panktyo panktyo yajyanuvakya
    yajyanuvakyah panktyah panktyo yajyanuvakyah yajyanuvakya bhavanti bhavanti yajyanuvakya yajyanuvakya
    bhavanti | yajyanuvakya iti yajya bhavanti panktah pankto bhavanti bhavanti panktah | pankto yajno
    yajnah panktah pankto yajnah | yajnah panktah pankto yajno yajnah panktah | panktah purushah purushah
    panktah panktah purushah | npurushah purusho devan | vi~ra mevaiva viram | viranniravadaya niravadaya
    viram niravadayagni magninniravadaya niravadayagnim | mpunah puna ragni magni puna ra punah puna ra
    | a dhatte dhatta a dhatte | || shshatakshara dhatte dhatte shataksharah | shatakshara bhavanti bhavanti
    shatakshara shshatakshara bhavanti | shatakshara iti shata bhavanti shatayuh shatayu rbhavanti bhavanti
    shatayuh | shatayuh purushah purusha shshatayuh shatayuh purushah | shshatendriyah purushah purusha
    shatendriya ayushyayushi shatendriya shshatendriya ayushi | shatendriya iti shata ayushyevaivayushyayushyeva
    | eve ndriya indriya evaive ndriye | indriye prati prati ndriya indriye prati | prati tishthati tishthati
    prati prati tishthati | ttishthati tishthati yat | agnirahita ahito 'gniragnirahitah | ahito na nahita
    ahito na | na rdhyata riddhyate na na rdhyate riddhyate jyayo jyaya riddhyata riddhyate jyayah | njyayo
    jyayo bhagadheya bhagadheyannikamayamano nikamayamano bhagadheya mbhagadheyannikamayamanah | nnikamayamano
    nikamayamano yat | nikamayamana iti ni mbhavati bhavati sarva bhavati sa sa bhavati bhavati sa | asya
    rdhir riddhirasyasya rdhih | ssagm sa mriddhir riddhi va etasyaitasya vai va etasya | etasya grihe
    griha etasyaitasya grihe | grihe vag vag grihe grihe vak | khsrijyate srijyate vag va ssrijyate srijyate
    yah | agni mudvasayata udvasayate 'gni magni mudvasayate | udvasayate sa sa udvasayata udvasayate
    sah | udvasayata ityut sagmsrishtamiti sam shvaro yajamano yajamana ishvarah | anu parabhavitoh parabhavitoranvanu
    parabhavitoh | rvibhaktayo vibhaktayah parabhavitoh parabhavito vibhaktayo bhavanti bhavanti vibhaktayo
    vibhaktayo bhavanti | bhavanti vaco vaco bhavanti bhavanti vacah | vaco vidhrityai vidhrityai vaco
    vaco vidhrityai | vidhrityai yajamanasya yajamanasya vidhrityai vidhrityai yajamanasya | yajamanasyaparabhavayaparabhavaya
    yajamanasya yajamanasyaparabhavaya | aparabhavaya vibhaktim vi~bhakti maparabhavayaparabhavaya vibhaktim
    | nkaroti karoti vibhaktim karoti brahma brahma karoti karoti brahma | brahmaivaiva brahma brahmaiva
    | yajati yatha yatha yajati yajati yatha vasu vividano vividano vasu vasu vividanah | vividano guhati
    guhati vividano vividano guhati | ktadrig guhati guhati tadrik | mprati pratyagni magni mprati prati
    svishtakrita svishtakritamiti svishta aha yatha yatha ''haha yatha vasu vividano vividano vasu vasu
    vividanah | vividanah prakasha vi~vidano vividanah prakasham | njigamishati jigamishati prakasha ktadrig
    jigamishati jigamishati tadrik | vibhakti muktvoktva vibhaktim vi~bhakti muktva | uktva prayajena
    prayajenoktvoktva prayajena | dvashat prayajena prayajena vashat | karotyayatanadayatana tkaroti karotyayatanat
    | ayatana devaivayatana dayatanadeva | naityeti na naiti | eti yajamano yajamana etyeti yajamanah
    | yajamano vai vai yajamano yajamano vai | vai purodashah purodasho vai vai purodashah | purodashah
    pashavah pashavah purodashah purodashah pashavah | pashava ete ete pashavah pashava ete | ete ahuti
    ahuti ete ete ahuti | dyadahuti ahuti yat | mpurodasha mabhito 'bhitah purodasha purodasha mete ete
    purodasha ete ahuti ahuti ete ete ahuti | ahuti juhoti juhotyahuti ahuti juhoti | njuhoti juhoti yajamanam
    | yajamana mevaiva yajamanam evobhayata ubhayata evaivobhayatah | ubhayatah pashubhih pashubhi rubhayata
    ubhayatah pashubhih | pashubhih pari pari pashubhih pashubhih pari | pari grihnati grihnati pari pari
    grihnati | grihnati kritayajuh kritayaju rgrihnati grihnati kritayajuh | ssambhritasambharah kritayajuh
    kritayaju sambhritasambhara ititi sambhritasambhara ssambhritasambhara iti | sambhritasambhara iti
    sambhrita ityahu rahu ritityahuh | ssambhritya na na sambhrityah sambhara na na sambhara kartavya
    mititi kartavya ityatho atho itityatho atho khalu khalvatho atho khalu | ssambhrityah khalu khalu
    sambhrityah sambhritya evaiva sambhritya ssambhara evaiva sambharah | sambharah kartavya ssambharah
    kartavya ryajnasya yajnasya yaju yajnasya samriddhyai samriddhyai yajnasya yajnasya samriddhyai |
    samriddhyai punarnishkritah punarnishkrita ssamriddhyai samriddhyai punarnishkritah | punarnishkrito
    ratho rathah punarnishkritah punarnishkrito rathah | punarnishkrita iti punah ratho dakshina dakshina
    ratho ratho dakshina | dakshina punaruthsyuta ndakshina dakshina punaruthsyutam | va~sovasah punaruthsyuta
    punaruthsyutamiti punah vasah punaruthsrishtah punaruthsrishto vasovasah punaruthsrishtah | punaruthsrishto
    'nadva nanadva npunaruthsrishtah punaruthsrishto 'nadvan | punaruthsrishta iti punah npunaradheyasya
    punaradheyasyanadva nanadva punaradheyasya samriddhyai samriddhyai punaradheyasya punaradheyasya samriddhyai
    | punaradheyasyeti punah samriddhyai sapta sapta samriddhyai samriddhyai sapta | sapta te te sapta
    sapta te te agne 'gne te te agne | agne samidhah samidho 'gne 'gne samidhah | samidhah sapta sapta
    samidhah samidhah sapta | sapta jihva jihva ssapta sapta jihvah | jihva ititi jihva jihva iti | ityagnihotra
    magnihotra mitityagnihotram | njuhoti juhotyagnihotra magnihotra agnihotramityagni juhoti yatrayatra
    yatrayatra juhoti juhoti yatrayatra | yatrayatraivaiva yatrayatra yatrayatraiva | yatrayatreti yatra
    asya nyaktannyakta masyasya nyaktam | ntatastato nyaktannyakta tata evaiva tatastata eva | || ena
    mavavaina mena mava | ava rundhe rundhe 'vava rundhe | rundhe viraha viraha rundhe rundhe viraha |
    viraha vai vai viraha viraha vai | va esha esha vai va eshah | ndevana mesha esha devana agni mudvasayata
    udvasayate 'gni magni mudvasayate | udvasayate tasya tasyo dvasayata udvasayate tasya | udvasayata
    ityut tasya varuno varunastasya tasya varunah | varuna evaiva varuno varuna eva | eva rnayadrinayadevaiva
    rnayat | gnivaruna mrinayadrinayada agnivaruna mekadashakapala mekadashakapala magnivaruna ma gnivaruna
    mekadashakapalam | agnivarunamitya ekadashakapala manvanvekadashakapala mekadashakapala manu | ekadashakapalamityekadasha
    eva hanti hantyevaiva hanti | hanti yo yo hanti hanti yah | casyasya ca casya | asya rnayadrinayadasyasya
    rnayat | ttau ta vrinayadrinaya tau bhagadheyena bhagadheyena tau tau bhagadheyena | bhagadheyena
    prinati prinati bhagadheyena bhagadheyena prinati | prinati na na prinati prinati na | narti martinna
    narti arti ma ''rti marti ma | arcchatyricchatyarcchati | ricchati yajamano yajamana ricchatyricchati
    yajamanah | yajamana iti yajamanah | || rbhumna bhumna bhumi rbhumna bhumna dyauh | rvarina varina
    dyau varina 'ntariksha mantariksham va~rina varina 'ntariksham | mmahitva mahitva 'ntariksha mantariksha
    upasthe te ta upastha upasthe te | te devi devi te te devi | devyadite 'dite devi devyadite | adite
    'gni magni madite 'dite 'gnim | agni mannada mannada magni magni mannadam | annada mannadyaya nnadyaya
    nnada mannada mannadyaya | annadyaya 'nnadyaya nnadyaya | annadyayetyanna gauh prishnih prishni prishni
    rakrami dakrami tprishnih prishni rakramit | akrami dasana dasana dakrami dakrami dasanat | dhama
    vi vi dhama dhama vi | vi rajati rajati vi vi rajati | rajati vag vag rajati rajati vak | kpatangaya
    patangaya vag va patangaya shishriye shishriye patangaya patangaya shishriye | shishriya iti shishriye
    | pratyasyasya prati pratyasya | asya vaha vahasyasya vaha | tprana dasyasya pranat | prana dapanatyapanati
    prana apanatyanta ranta rapanatyapanatyantah | antashcarati caratyanta rantashcarati | carati rocana
    rocana carati carati rocana | tva kruddhah kruddhastva kruddhah parovapa parovapa kruddhah kruddhah
    parovapa | parovapa manyuna manyuna parovapa parovapa manyuna nmanyuna manyuna yat | yadavartya 'vartya
    ya avartyetyavartya | sukalpa magne 'gne sukalpa ttadagne 'gne tat | tava punah punastava tava punah
    | punastva tva punah punastva | ddipayamasi dipayamasyudu dipayamasiti dipayamasi | te manyuparoptasya
    manyuparoptasya te te manyuparoptasya | manyuparoptasya prithivi mmanyuparoptasya manyuparoptasya
    prithivim | manyuparoptasyeti manyu prithivi manvanu prithivi anu daddhvase daddhvase 'nvanu daddhvase
    | daddhvasa iti daddhvase | aditya vishve vishva aditya aditya vishve dvishve vishve tat | deva vasavo
    vasavo deva deva vasavah | vasavashca ca vasavo vasavashca | rmano mano jyotih | jushata majya majya
    vi~cchinna majya majyam sa mima mimagm sagm sa mimam | ndadhatu dadhatvima mima dadhatviti dadhatu
    | rbrihaspati stanutam | imanno na ima mimannah | no vishve vishve no no vishve vishve deva deva vishve
    vishve devah | deva ihe ha deva deva iha | mmadayanta mihe ha madayantam | madayantamiti madayantam
    | sapta te te sapta sapta te te agne 'gne te te agne | agne samidhah samidho 'gne 'gne samidhah |
    samidhah sapta sapta samidhah samidhah sapta | sapta jihva jihva ssapta sapta jihvah | ssapta sapta
    jihva jihva sapta dhama dhama sapta sapta dhama | dhama priyani priyani dhama dhama priyani | priyaniti
    priyani | sapta hotra hotra ssapta sapta hotrah ssaptadha saptadha hotra hotra tva saptadha saptadha
    tva tva yajanti yajanti tva tva yajanti | yajanti sapta sapta yajanti yajanti sapta | a prinasva prinasva
    prinasva | prinasva ghritena ghritena prinasva prinasva ghritena | ghriteneti ghritena | puna rurjorja
    punah puna rurja | ni vartasva vartasva ni ni vartasva | vartasva punah puna rvartasva vartasva punah
    | puna ragne 'gne punah puna ragne | isha ''yusha ''yusheshesha ''yusha | nah pahi pahi no nah pahi
    | pahi vishvato vishvata spahi pahi vishvatah | vishvata iti vishvatah | saha rayya rayya saha saha
    rayya | rayya ni ni rayya rayya ni | ni vartasva vartasva ni ni vartasva | vartasvagne 'gne vartasva
    vartasvagne agne pinvasva pinvasvagne 'gne pinvasva | pinvasva dharaya dharaya pinvasva pinvasva dharaya
    | vishvaphsniya vishvato vishvato vishvaphsniya vishvaphsniya vishvatah | vishvaphsniyeti vishva vishvata
    spari pari vishvato vishvata spari | ssaleko leko leka sulekaste te sulekah sulekaste | te no naste
    te nah | na aditya aditya no na adityah | aditya ajya majya maditya aditya ajya njushana jushana ajya
    majya jushana viyantu viyantu jushana jushana viyantu | viyantu ketah keto viyantu viyantu ketah |
    ssaketah ketah keta suketaste te suketah suketaste | te no naste te nah | na aditya aditya no na adityah
    | aditya ajya majya maditya aditya ajya njushana jushana ajya majya jushana viyantu viyantu jushana
    jushana viyantu | viyantu vivasvan viyantu viyantu vivasvan | rdevajuti raditi raditi devajutiste
    te devajuti te no naste te nah | na aditya aditya no na adityah | aditya ajya majya maditya aditya
    ajya njushana jushana ajya majya jushana viyantu viyantu jushana jushana viyantu | viyantviti viyantu
    | || rbhumna bhumna bhumi rbhumna bhumna dyauh | rvarina varina dyau varinetiti varina varineti |
    ityahahe tityaha | ahashisha ''shisha ''hahashisha ashishaivaivashisha ''shishaiva | a dhatte dhatta
    a dhatte | ssarpa dhatte dhatte sarpah | vai jiryanto jiryanto vai vai jiryantah | jiryanto 'manyantamanyanta
    jiryanto jiryanto 'manyanta | amanyanta sa so 'manyantamanyanta sah | sa eta metagm sa sa etam | nkasarnirah
