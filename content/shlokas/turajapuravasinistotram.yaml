id: turajapuravasinistotram
category: stotram
name:
  english: turajapuravasinistotram
  devanagari: तुरजापुरवासिनीस्तोत्रम्
content:
  english: turajapuranivasinistotram shriganeshaya namah | namaste'stu te mahadevi shive kalyanashambhavi
    | prasida vedavinute jagadamba namo'stu te || 1|| jagatamadibhuta tvam jagattvam jagadashraya | eka'pyanekarupa'si
    jagadamba namo'stu te || 2|| srishtisthite vinashanam hetubhute munistute | prasida devavinute jagadamba
    namo'stu te || 3|| sarveshvari namastubhyam sarvasaubhagyadayini | sarvashaktiyute'nante jagadamba
    namo'stu te || 4|| vividharishtashamani trividhotpatanashini | prasida devi lalite jagadamba namo'stu
    te || 5|| prasida karunasindho tvattah karunika para | yato nasti mahadevi jagadamba namo'stu te ||
    6|| shatrunjahi jayam dehi sarvan kamamshca dehi me | bhayam nashaya rogamshca jagadamba namo'stu
    te || 7|| jagadamba namo'stu te hite jaya shambhordayite mahamate | kuladevi namo'stu te sada hridi
    me tishtha yato'si sarvada || 8|| tulajapuranivasinyah devyah stotramidam param | yah pathetprayato
    bhaktya sarvan kaman sa apnuyat || 9|| iti shrivasudevanandasarasvatipanditaviracitam turajapuranivasinya
    devyah stotram sampurnam || tulajapuranivasinistotram
  devanagari: तुरजापुरनिवसिनीस्तोत्रम् श्रीगणेशाय नमः । नमस्तेऽस्तु ते महादेवि शिवे कल्याणशाम्भवि । प्रसीद
    वेदविनुते जगदम्ब नमोऽस्तु ते ॥ १॥ जगतामादिभूता त्वं जगत्त्वं जगदाश्रया । एकाऽप्यनेकरूपाऽसि जगदम्ब
    नमोऽस्तु ते ॥ २॥ सृष्टिस्थिते विनाशानां हेतुभूते मुनिस्तुते । प्रसीद देवविनुते जगदम्ब नमोऽस्तु ते
    ॥ ३॥ सर्वेश्वरि नमस्तुभ्यं सर्वसौभाग्यदायिनि । सर्वशक्तियुतेऽनन्ते जगदम्ब नमोऽस्तु ते ॥ ४॥ विविधारिष्टशमनि
    त्रिविधोत्पातनाशिनि । प्रसीद देवि ललिते जगदम्ब नमोऽस्तु ते ॥ ५॥ प्रसीद करुणासिन्धो त्वत्तः कारुणिका
    परा । यतो नास्ति महादेवि जगदम्ब नमोऽस्तु ते ॥ ६॥ शत्रूञ्जहि जयं देहि सर्वान् कामांश्च देहि मे । भयं
    नाशय रोगांश्च जगदम्ब नमोऽस्तु ते ॥ ७॥ जगदम्ब नमोऽस्तु ते हिते जय शम्भोर्दयिते महामते । कुलदेवि नमोऽस्तु
    ते सदा हृदि मे तिष्ठ यतोऽसि सर्वदा ॥ ८॥ तुलजापुरनिवासिन्याः देव्याः स्तोत्रमिदं परम् । यः पठेत्प्रयतो
    भक्त्या सर्वान् कामान् स आप्नुयात् ॥ ९॥ इति श्रीवासुदेवानन्दसरस्वतीपण्डितविरचितं तुरजापुरनिवसिन्या
    देव्याः स्तोत्रं सम्पूर्णम् ॥ तुलजापुरनिवसिनीस्तोत्रम्
