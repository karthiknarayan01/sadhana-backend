id: kyts-jata-2-6-samidho-yajati-vasantam-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 2.6 Samidho Yajati Vasantam - Krishna Yajurveda Taittiriya Samhita
content:
  english: samidho yajati yajati samidhah samidho yajati | ya~jati yajati vasantam | vasanta mevaiva vasantam
    eva rtuna mrituna mevaiva rtunam | rtuna mrituna mava | ava rundhe rundhe 'vava rundhe | ntanunapatagm
    rundhe rundhe tanunapatam | ya~jati yajati tanunapata ya~jati yajati grishmam | grishma mevaiva grishma
    ava rundhe rundhe 'vava rundhe | rundha ida ido rundhe rundha idah | ido yajati yajatida ido yajati
    | yajati varsha varsha yajati yajati varshah | varsha evaiva varsha varsha eva | ava rundhe rundhe
    'vava rundhe | rbarhi rundhe rundhe barhih | ryajati yajati barhi yajati sharadagm sharadam sharada
    mevaiva sharadagm sharada meva | ava rundhe rundhe 'vava rundhe | rundhe svahakaragg svahakaragm rundhe
    rundhe svahakaram | ya~jati yajati svahakaragg svahakaramiti svaha yajati hemantagm hemantam ya~jati
    yajati hemantam | hemanta mevaiva hemantagm hemanta meva | ava rundhe rundhe 'vava rundhe | drundhe
    rundhe tasma ssvahakrita stasma svahakrita heman ssvahakrita hemann | svahakrita iti svaha npashavah
    pashavo heman pashavo 'vava pashavah pashavo 'va | ava sidanti sida ntyavava sidanti | sidanti samidhah
    samidhah sidanti sidanti samidhah | samidho yajati yajati samidhah samidho yajati | yaja tyushasa
    ushaso yajati yaja tyushasah | ushasa evaivoshasa ushasa eva | ndevatana mevaiva devatanam | devatana
    mavava devatana ava rundhe rundhe 'vava rundhe | ntanunapatagm rundhe rundhe tanunapatam | ya~jati
    yajati tanunapata ya~jati yajati yajnam | ava rundhe rundhe 'vava rundhe | rundha ida ido rundhe rundha
    idah | || ido yajati yajatida ido yajati | ava rundhe rundhe 'vava rundhe | rbarhi rundhe rundhe barhih
    | ryajati yajati barhi ya~jati yajati prajam | praja mevaiva praja ava rundhe rundhe 'vava rundhe
    | rundhe samanayate samanayate rundhe rundhe samanayate | samanayata upabhrita upabhritah samanayate
    samanayata upabhritah | upabhrita steja steja upabhrita upabhrita stejah | tejo vai vai teja stejo
    vai | mprajah praja ajya majya rbarhih prajah praja barhih | barhih prajasu prajasu barhi rbarhih
    prajasu | praja svevaiva prajasu praja sveva | eva teja steja evaiva tejah | tejo dadhati dadhati
    teja stejo dadhati | dadhati svahakaragg ndadhati dadhati svahakaram | ya~jati yajati svahakaragg
    svahakaramiti svaha ava rundhe rundhe 'vava rundhe | rundhe dasha dasha rundhe rundhe dasha | mpadyante
    padyante sagm sa kshara padyante padyante dasha dvira danna mannam dviraja viraja vira vira jaivaiva
    viraja virajaiva | eva nnadya mannadya mevaiva nnadya annadya mavava nnadya mannadya mava | ava rundhe
    rundhe 'vava rundhe | rundhe samidhah samidho rundhe rundhe samidhah | samidho yajati yajati samidhah
    samidho yajati | yajati yaja tyasminn | eva loke loka evaiva loke | loke prati prati loke loke prati
    | prati tishthati tishthati prati prati tishthati | tishthati tanunapata ntishthati tishthati tanunapatam
    | ya~jati yajati tanunapata yajati yajne yajne yajati yajati yajne | || yajna evaiva yajne yajna eva
    | eva ntarikshe 'ntariksha evaiva ntarikshe | antarikshe prati pratyantarikshe 'ntarikshe prati |
    prati tishthati tishthati prati prati tishthati | tishthatida ida stishthati tishthatidah | ido yajati
    yajatida ido yajati | yajati pashushu pashushu yajati yajati pashushu | pashu shvevaiva pashushu pashu
    shveva | eva prati pratyevaiva prati | prati tishthati tishthati prati prati tishthati | rbarhi stishthati
    tishthati barhih | ryajati yajati barhi yajati ye ye yajati yajati ye | eva devayana devayana evaiva
    devayanah devayanah panthanah panthano devayana devayanah panthanah | panthana steshu teshu panthanah
    panthana steshu | teshvevaiva teshu teshveva | eva prati pratyevaiva prati | prati tishthati tishthati
    prati prati tishthati | tishthati svahakaragg ntishthati tishthati svahakaram | ya~jati yajati svahakaragg
    svahakaramiti svaha yajati suvarge suvarge yajati yajati suvarge | suvarga evaiva suvarge suvarga
    eva | eva loke loka evaiva loke | loke prati prati loke loke prati | prati tishthati tishthati prati
    prati tishthati | tishtha tyetavanta etavanta stishthati tishtha tyetavantah | etavanto vai va etavanta
    etavanto vai | vai devaloka devaloka vai vai devalokah | devaloka steshu teshu devaloka devaloka steshu
    | teshvevaiva teshu teshveva | ya~thapurva mevaiva yathapurvam | mprati prati yathapurvam yathapurvamiti
    yatha prati tishthati tishthati prati prati tishthati | tishthati devasura devasura stishthati tishthati
    devasurah | devasura eshveshu devasura devasura eshu | devasura iti deva eshu lokeshu loke shveshveshu
    lokeshu | loke shvaspardhanta spardhanta lokeshu loke shvaspardhanta | aspardhanta te te 'spardhanta
    spardhanta te | te deva deva ste te devah | devah prayajaih prayajai rdeva devah prayajaih | prayajai
    rebhya ebhyah prayajaih prayajai rebhyah | ebhyo lokebhyo lokebhya ebhya ebhyo lokebhyah | lokebhyo
    'sura nasuran ~lokebhyo lokebhyo 'suran | npra prasura nasura pranudanta nudanta pra pranudanta |
    ttadanudanta nudanta tat | prayajanamiti pra ya~sya yasya prayajatva prayajatvamiti prayaja vi~dusho
    vidusha eva mevam vidushah prayajah prayaja vidusho vidushah prayajah | prayaja ijyanta ijyante prayajah
    prayaja ijyante ijyante pra pre jyanta ijyante pra | praibhya ebhyah pra praibhyah | ebhyo lokebhyo
    lokebhya ebhya ebhyo lokebhyah | lokebhyo bhratrivya nbhratrivyan ~lokebhyo lokebhyo bhratrivyan |
    nnudate nudate bhratrivya nudate 'bhikrama mabhikrama nnudate nudate 'bhikrama njuhoti juho tyabhikrama
    mabhikrama juho tyabhijitya abhijityai juhoti juho tyabhijityai | abhijityai yo yo 'bhijitya abhijityai
    yah | abhijitya ityabhi prayajanamiti pra veda pra pra veda veda pra | prajaya pra pra prajaya prajaya
    pashubhih pashubhih prajaya rmithunaih pashubhih pashubhi rjayate jayate mithunai jayate samidhah
    samidho jayate jayate samidhah | ssamidhah samidho bahvih | bahvi rive va bahvi iva yajati yajative
    va yajati | ya~jati yajati tanunapatam | tanunapata meka meka eka mive vaika meka miva | mmithuna
    mive va mithunam | rbahvi rida ido bahvih | bahvi rive va bahvi iva yajati yajative va yajati | ryajati
    yajati barhih | eka mive vaika meka miva | mmithuna mive va mithunam | prayajanamiti pra veda pra
    pra veda veda pra | prajaya pra pra prajaya prajaya pashubhih pashubhih prajaya rmithunaih pashubhih
    pashubhi rjayate jayate mithunai njayate jayate devana va anishta anishta vai va anishtah | anishta
    devata devata anishta anishta devatah ndevata devata asann | athasura asura athathasurah | ya~jna
    masura asura yajnam | ya~jna majighagmsann | te deva deva ste te devah | ndeva deva gayatrim | nyaksharani
    panca pancaksharani | aksharani pracinani pracina nyaksharani pracinani | pracinani trini trini pracinani
    pracinani trini | trini praticinani praticinani trini trini praticinani | praticinani tata statah
    praticinani praticinani tatah | tato varma varma tata stato varma | varma yajnaya yajnaya varma varma
    yajnaya | dyajnaya yajnaya bhavat | dvarma varma bhava dabhava varma yajamanaya yajamanaya varma varma
    yajamanaya | dyajamanaya yajamanaya yat | tprayajanuyajah prayajanuyaja ya tprayajanuyajah | prayajanuyaja
    ijyanta ijyante prayajanuyajah prayajanuyaja ijyante prayajanuyaja iti prayaja ijyante varma varme
    jyanta ijyante varma | varmaivaiva varma varmaiva | dyajnaya yajnaya ta yajnaya kriyate kriyate yajnaya
    yajnaya kriyate | kriyate varma varma kriyate kriyate varma | varma yajamanaya yajamanaya varma varma
    yajamanaya | yajamanaya bhratrivyabhibhutyai bhratrivyabhibhutyai yajamanaya yajamanaya bhratrivyabhibhutyai
    | bhratrivyabhibhutyai tasma dbhratrivyabhibhutyai bhratrivyabhibhutyai tasma bhratrivyabhibhutya
    iti bhratrivya pashca ddhrasiyo hrasiyah pashca tpashca ddhrasiyah | hrasiyo deva deva hrasiyo hrasiyo
    devah | deva vai vai deva deva vai | vai pura pura vai vai pura | bhyah pura pura raksho iti svahakarena
    svahakarene titi svahakarena | svahakarena prayajeshu prayajeshu svahakarena svahakarena prayajeshu
    | svahakareneti svaha mprayajeshu prayajeshu yajnam | prayajeshviti pra yajnagm saggsthapyagm saggsthapyam
    ya~jnagm saggsthapya saggsthapya mapashya nthsaggsthapyagm saggsthapya mapashyann | saggsthapyamiti
    sam svahakarena svahakarena ta svahakarena prayajeshu prayajeshu svahakarena svahakarena prayajeshu
    | svahakareneti svaha mprayajeshu prayajeshu sam | prayajeshviti pra nthsagm sa masthapayann | asthapayan
    vi vyasthapaya nchindanti chindanti yajnam dyac chindanti chindanti yat | thsvahakarena svahakarena
    ya svahakarena prayajeshu prayajeshu svahakarena svahakarena prayajeshu | svahakareneti svaha sthapayanti
    prayajeshu prayajeshu sagg prayajeshviti pra saggsthapayanti prayaja nthsaggsthapayanti sagg sthapayanti
    prayajan | saggsthapayantiti sam prayaja nishtveshtva prayaja nprayaja nishtva | ishtva havigmshi
    havigmshi shtveshtva havigmshi | shyabhyabhi havigmshi havig abhi gharayati gharaya tyabhyabhi gharayati
    | gharayati yajnasya yajnasya gharayati gharayati yajnasya | yajnasya santatyai santatyai yajnasya
    yajnasya santatyai | santatya atho atho santatyai santatya atho havi ratho atho havih | evaka raka
    revaivakah | aka ratho atho aka raka ratho ya~thapurva matho atho yathapurvam | yathapurva mupopa
    yathapurvam yathapurvamiti yatha eti pita pitai tyeti pita | pita vai vai pita pita vai | vai prayajah
    prayaja vai vai prayajah | prayajah praja praja prayajah prayajah praja | praja 'nuyaja anuyajah praja
    praja 'nuyajah | dyadanuyaja anuyaja yat | prayaja nishtveshtva prayaja nprayaja nishtva | ishtva
    havigmshi havigmshi shtveshtva havigmshi | shyabhigharaya tyabhigharayati havigmshi havig abhigharayati
    pita pita 'bhigharaya tyabhigharayati pita | pitaivaiva pita pitaiva | tputrena putrena ta putrena
    sadharanagm sadharana mputrena putrena sadharanam | nkurute kurute sadharanagm sadharana tkurute kurute
    tasma tasma dahu rahu stasma veda yo yo veda veda yah | na katha katha na na katha | katha putrasya
    putrasya katha katha putrasya | mputrasya putrasya kevalam | katha sadharanagm sadharana nkatha katha
    sadharanam | ssadharanagm sadharana pitu rititi pituh pitu riti | ityaskanna maskanna miti tyaskannam
    | askanna mevaiva skanna maskanna meva | tprayajeshu prayajeshu ya prayaje shvishte shvishteshu prayajeshu
    prayaje shvishteshu | prayajeshviti pra ishteshu skandati skanda tishteshvishteshu skandati | skandati
    gayatri gayatri skandati skandati gayatri | gayatryevaiva gayatri gayatryeva | eva tena tenaivaiva
    tena | ndhatte dhatte garbha dhatte sa sa dhatte dhatte sa | mprajagm sa sa prajam | yajamanaya yajamanaya
    pashu yajamanaya pra pra yajamanaya yajamanaya pra | pra janayati janayati pra pra janayati | janayatiti
    janayati | || cakshushi vai vai cakshushi cakshushi vai | cakshushi iti cakshushi | va ete ete vai
    va ete | ete yajnasya yajnasyaite ete yajnasya | dyajnasya yajnasya yat | yadajyabhaga vajyabhagau
    ya dyadajyabhaga vajyabhagau yat | ajyabhagavityajya yadajyabhaga vajyabhagau ya ajyabhagau yajati
    yaja tyajyabhaga vajyabhagau yajati | ajyabhagavityajya yajati cakshushi cakshushi yajati yajati cakshushi
    | cakshushi evaiva cakshushi cakshushi eva | cakshushi iti cakshushi | dyajnasya yajnasya ta yajnasya
    prati prati yajnasya yajnasya prati | prati dadhati dadhati prati prati dadhati | dadhati purvardhe
    pu rvardhe dadhati dadhati purvardhe | purvardhe juhoti juhoti purvardhe pu purvardha iti purva j
    juhoti juhoti tasma purvardhe cakshushi cakshushi purvardhe pu rvardhe cakshushi | purvardha iti purva
    kprabahukcakshushi cakshushi prabahuk | cakshushi iti cakshushi | prabahug juhoti juhoti prabahu kprabahug
    juhoti | j juhoti juhoti tasma prabahukcakshushi cakshushi prabahu kprabahukcakshushi | ncakshushi
    cakshushi devalokam | cakshushi iti cakshushi | va agnina 'gnina vai va agnina agnina yajamano yajamano
    'gnina 'gnina yajamanah | yajamano 'nvanu yajamano yajamano 'nu | anu pashyati pashya tyanvanu pashyati
    | pashyati pitriloka mpashyati pashyati pitrilokam | pitrilokagm somena somena pitriloka mpitrilokagm
    somena | pitrilokamiti pitri somenottarardha uttarardhe somena somenottarardhe | 'gnaye 'gnaya uttarardha
    uttarardhe uttarardha ityuttara agnaye juhoti juho tyagnaye 'gnaye juhoti | juhoti dakshinardhe dakshinardhe
    juhoti juhoti dakshinardhe | dakshinardhe somaya somaya dakshinardhe dakshinardhe somaya | dakshinardha
    iti dakshina somayaiva mevagm somaya somayaivam | eva mive vaiva meva miva | iva hi hive va hi | hima
    vimau hi himau | imau lokau loka vima vimau lokau | rlokau loka vanayoh rlokayo ranayo ranayo lokayo
    ranukhyatya anukhyatyai lokayo rlokayo ranukhyatyai | anukhyatyai rajanau rajana vanukhyatya anukhyatyai
    rajanau | anukhyatya ityanu rajanau vai vai rajanau rajanau vai | va eta vetau vai va etau | ndevatana
    meta vetau devatanam | yadagnishoma vagnishomau ya agnishoma vantara 'ntara 'gnishoma vagnishoma vantara
    | agnishomavityagni antara devata devata antara 'ntara devatah devata ijyete ijyete devata devata
    ijyete | ijyete devatana ndevatana mijyete ijyete devatanam | vi~dhrityai vidhrityai devatana dvidhrityai
    vidhrityai tasma drajna rajna tasma rajna manushya manushya rajna rajna manushyah manushya vidhrita
    vidhrita manushya manushya vidhritah | vidhrita brahmavadino brahmavadino vidhrita vidhrita brahmavadinah
    | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina iti brahma va~danti
    vadanti kim | yajne yajamano yajamano yajne yajne yajamanah | yajamanah kurute kurute yajamano yajamanah
    kurute | kurute yena yena kurute kurute yena | yena nyatodato 'nyatodato yena yena nyatodatah | anyatodatashca
    canyatodato 'nyatodatashca | anyatodata ityanyatah ndadhara dadhara pashu dadha robhayatodata ubhayatodato
    dadhara dadha robhayatodatah | ubhayatodatashca cobhayatodata ubhayatodatashca | ubhayatodata ityubhayatah
    ce titi ca ce ti | ityrica mrica miti tyrica rica manucya nucya rca mrica manucya | anucya jyabhagasya
    jyabhagasya nucya nucya jyabhagasya | ajyabhagasya jushanena jushanena jyabhagasya jyabhagasya jushanena
    | ajyabhagasyetyajya jushanena yajati yajati jushanena jushanena yajati | yajati tena tena yajati
    yajati tena | tenanyatodato 'nyatodata stena tenanyatodatah | anyatodato dadhara dadhara nyatodato
    'nyatodato dadhara | anyatodata ityanyatah rica manucya nucya rca mrica manucya | anucya havisho havisho
    'nucya nucya havishah | havisha ricarca havisho havisha rica | rica yajati yaja tyricarca yajati |
    yajati tena tena yajati yajati tena | tenobhayatodata ubhayatodata stena tenobhayatodatah | ubhayatodato
    dadhara dadha robhayatodata ubhayatodato dadhara | ubhayatodata ityubhayatah dadhara murdhanvati murdhanvati
    dadhara dadhara murdhanvati murdhanvati puronuvakya puronuvakya murdhanvati murdhanvati puronuvakya
    murdhanvatiti murdhann puronuvakya bhavati bhavati puronuvakya puronuvakya bhavati | puronuvakyeti
    purah mbhavati bhavati murdhana murdhana mevaiva murdhana enagm samananagm samanana mena menagm samanana
    nkaroti karoti samananagm samanana karoti niyutvatya niyutvatya karoti karoti niyutvatya | || niyutvatya
    yajati yajati niyutvatya niyutvatya yajati | yajati bhratrivyasya bhratrivyasya yajati yajati bhratrivyasya
    | bhratrivya syaivaiva bhratrivyasya bhratrivya syaiva | npashu nevaiva pashun | ni yuvate yuvate
    ni ni yuvate | keshinagm ha ha keshina ndarbhyagm ha ha darbhyam | nkeshi keshi darbhya ssatyakamih
    keshi keshi satyakamih | satyakami ruvacovaca satyakami ssatyakami ruvaca | satyakamiriti satya uvaca
    saptapadagm saptapada muvacovaca saptapadam | nte te saptapadagm saptapada saptapadamiti sapta te
    shakvarigm shakvari nte te shakvarim | shshakvarigm shakvarig shvah | shvo yajne yajne shva yajne
    prayoktase prayoktase yajne yajne prayoktase prayoktase yasyai yasyai prayoktasa iti pra yasyai viryena
    viryena yasyai yasyai viryena | viryena pra pra viryena viryena pra | nbhratrivyan jatan jata nnudate
    nudate bhratrivya nudate prati prati nudate nudate prati | prati janishyamanan janishyamana nprati
    prati janishyamanan | yasyai yasyai janishyamanan janishyamanan yasyai viryena viryena yasyai yasyai
    viryena | viryenobhayo rubhayo rviryena viryenobhayoh rlokayo rubhayo rubhayo rdhatte dhatte jyoti
    dhatte yasyai yasyai dhatte dhatte yasyai yasyai viryena viryena yasyai yasyai viryena | viryena purvardhena
    purvardhena viryena viryena purvardhena | purvardhena nadva nanadva rvardhena purvardhena nadvan |
    purvardheneti purva nbhunakti bhunaktyanadva nanadva bhunakti jaghanardhena jaghanardhena bhunakti
    bhunakti jaghanardhena | rjaghanardhena jaghanardhena dhenuh | jaghanardheneti jaghana llakshmetiti
    purasta llakshma puronuvakya puronuvakya purasta llakshma puronuvakya llakshmeti purasta puronuvakya
    bhavati bhavati puronuvakya puronuvakya bhavati | puronuvakyeti purah bhavati jatan jata nbhavati
    bhavati jatan | jata nevaiva jatan jata neva | nbhratrivya nevaiva bhratrivyan | npra pra bhratrivya
    pra nudate nudate pra pra nudate | nudata uparishtalla kshmoparishtallakshma nudate nudata uparishtallakshma
    | uparishtallakshma yajya yajyoparishtalla kshmoparishtallakshma yajya uparishtallakshmetyuparishtat
    yajya janishyamanan janishyamanan yajya yajya janishyamanan | janishyamana nevaiva janishyamanan janishyamana
    neva | eva prati pratyevaiva prati | prati nudate nudate prati prati nudate | llakshma nudate nudate
    purasta llakshma puronuvakya puronuvakya purasta llakshma puronuvakya llakshmeti purasta puronuvakya
    bhavati bhavati puronuvakya puronuvakya bhavati | puronuvakyeti purah nbhavati bhava tyasminn | eva
    loke loka evaiva loke | rloke loke jyotih | rdhatte dhatte jyoti dhatta uparishtalla kshmoparishtallakshma
    dhatte dhatta uparishtallakshma | uparishtallakshma yajya yajyoparishtalla kshmoparishtallakshma yajya
    uparishtallakshmetyuparishtat yajya yajya 'mushminn | eva loke loka evaiva loke | rloke loke jyotih
    | rdhatte dhatte jyoti dhatte jyotishmantau jyotishmantau dhatte dhatte jyotishmantau | jyotishmanta
    vasma asmai jyotishmantau jyotishmanta vasmai | asma ima vima vasma asma imau | imau lokau loka vima
    vimau lokau | lokau bhavato bhavato lokau lokau bhavatah | bhavato yo yo bhavato bhavato yah | llakshma
    veda veda purasta llakshma puronuvakya puronuvakya purasta llakshma puronuvakya llakshmeti purasta
    puronuvakya bhavati bhavati puronuvakya puronuvakya bhavati | puronuvakyeti purah tpurvardhena purvardhena
    tasma purvardhena nadva nanadva rvardhena purvardhena nadvan | purvardheneti purva nbhunakti bhuna
    ktyanadva nanadva bhuna ktyuparishtalla kshmoparishtallakshma bhunakti bhuna ktyuparishtallakshma
    | uparishtallakshma yajya yajyoparishtalla kshmoparishtallakshma yajya uparishtallakshmetyuparishtat
