id: gayatrirahasyopanishat
category: upanishad
name:
  english: gayatrirahasyopanishat
  devanagari: गायत्रीरहस्योपनिषत्
content:
  english: gayatrirahasyopanishat || gayatrirahasyopanishat || om svasti siddham | om namo brahmane |
    om namaskritya yajnavalkya rishih svayambhuvam paripricchati | he brahman gayatrya utpattih shrotumicchami
    | athato vasishthah svayambhuvam paripricchati | yo brahma sa brahmovaca | brahmajnanotpatteh prakritim
    vyakhyasyamah | ko nama svayambhu purusha iti | tenangulimathyamanat salilamabhavat | salilat phenamabhavat
    | phenadbudbudamabhavat | budbudadandamabhavat | andadbrahmabhavat | brahmano vayurabhavat | vayoragnirabhavat
    | agneronkaro'bhavat | onkaradvyahritirabhavat | vyahritya gayatryabhavat |gayatrya savitryabhavat
    | savitrya sarasvatyabhavat | sarasvatya sarve veda abhavan | sarvebhyo vedebhyah sarve loka abhavan
    | sarvebhyo lokebhyah sarve pranino'bhavan | athato gayatri vyahritayashca pravartante | ka ca gayatri
    kashca vyahritayah | kim bhuh kim bhuvah kim suvah kim mahah kim janah kim tapah kim satyam kim tat
    kim savituh kim varenyam kim bhargah kim devasya kim dhimahi kim dhiyah kim yah kim nah kim pracodayat
    | om bhuriti bhuvo lokah | bhuva ityantarikshalokah | svariti svargalokah | maha iti maharlokah |
    jana iti janolokah | tapa iti tapolokah | satyamiti satyalokah | taditi tadasau tejomaya tejo'gnirdevata
    | savituriti savita savitramadityo vai | varenyamityatra prajapatih | bharga ityapo vai bhargah |
    devasya itindro devo dyotata iti sa indrastasmat sarvapurusho nama rudrah | dhimahityantaratma | dhiya
    ityantaratma parah | ya iti sadashivapurushah | no ityasmakam svadharme | pracodayaditi pracodita
    kama iman lokan pratyashrayate yah paro dharma ityesha gayatri | sa ca kim gotra katyakshara katipada
    | kati kukshayah | kani shirshani | samkhyayanagotra sa caturvimshatyakshara gayatri tripada catushpada
    | punastasyashcatvarah padah shat kukshikah panca shirshani bhavanti | ke ca padah kashca kukshayah
    kani shirshani | rigvedo'syah prathamah pado bhavati | yajurvedo dvitiyah padah | samavedastritiyah
    padah | atharvavedashcaturthah padah | purva dik prathama kukshirbhavati | dakshina dvitiya kukshirbhavati
    | pashcima tritiya kukshirbhavati | uttara caturthi kukshirbhavati | urdhvam pancami kukshirbhavati
    | adhah shashthi kukshirbhavati | vyakarano'syah prathamah shirsho bhavati | shiksha dvitiyah| kalpastritiyah
    | niruktashcaturthah | jyotishamayanamiti pancamah | ka dik ko varnah kimayatanam kah svarah kim lakshanam
  devanagari: गायत्रीरहस्योपनिषत् ॥ गायत्रीरहस्योपनिषत् ॥ ॐ स्वस्ति सिद्धम् । ॐ नमो ब्रह्मणे । ॐ नमस्कृत्य
    याज्ञवल्क्य ऋषिः स्वयंभुवं परिपृच्छति । हे ब्रह्मन् गायत्र्या उत्पत्तिः श्रोतुमिच्छामि । अथातो वसिष्ठः
    स्वयंभुवं परिपृच्छति । यो ब्रह्मा स ब्रह्मोवाच । ब्रह्मज्ञानोत्पत्तेः प्रकृतिं व्याख्यास्यामः । को
    नाम स्वयंभू पुरुष इति । तेनाङ्गुलीमथ्यमानात् सलिलमभवत् । सलिलात् फेनमभवत् । फेनाद्बुद्बुदमभवत् । बुद्बुदादण्डमभवत्
    । अण्डाद्ब्रह्माभवत् । ब्रह्मणो वायुरभवत् । वायोरग्निरभवत् । अग्नेरोङ्कारोऽभवत् । ओङ्काराद्व्याहृतिरभवत्
    । व्याहृत्या गायत्र्यभवत् ।गायत्र्या सावित्र्यभवत् । सावित्र्या सरस्वत्यभवत् । सरस्वत्या सर्वे वेदा
    अभवन् । सर्वेभ्यो वेदेभ्यः सर्वे लोका अभवन् । सर्वेभ्यो लोकेभ्यः सर्वे प्राणिनोऽभवन् । अथातो गायत्री
    व्याहृतयश्च प्रवर्तन्ते । का च गायत्री काश्च व्याहृतयः । किं भूः किं भुवः किं सुवः किं महः किं जनः
    किं तपः किं सत्यं किं तत् किं सवितुः किं वरेण्यं किं भर्गः किं देवस्य किं धीमहि किं धियः किं यः किं
    नः किं प्रचोदयात् । ॐ भूरिति भुवो लोकः । भुव इत्यन्तरिक्षलोकः । स्वरिति स्वर्गलोकः । मह इति महर्लोकः
    । जन इति जनोलोकः । तप इति तपोलोकः । सत्यमिति सत्यलोकः । तदिति तदसौ तेजोमय तेजोऽग्निर्देवता । सवितुरिति
    सविता सावित्रमादित्यो वै । वरेण्यमित्यत्र प्रजापतिः । भर्ग इत्यापो वै भर्गः । देवस्य इतीन्द्रो देवो
    द्योतत इति स इन्द्रस्तस्मात् सर्वपुरुषो नाम रुद्रः । धीमहीत्यन्तरात्मा । धिय इत्यन्तरात्मा परः । य
    इति सदाशिवपुरुषः । नो इत्यस्माकं स्वधर्मे । प्रचोदयादिति प्रचोदित काम इमान् लोकान् प्रत्याश्रयते यः
    परो धर्म इत्येषा गायत्री । सा च किं गोत्रा कत्यक्षरा कतिपादा । कति कुक्षयः । कानि शीर्षाणि । सांख्यायनगोत्रा
    स चतुर्विंशत्यक्षरा गायत्री त्रिपादा चतुष्पादा । पुनस्तस्याश्चत्वारः पादाः षट् कुक्षिकाः पञ्च शीर्षाणि
    भवन्ति । के च पादाः काश्च कुक्षयः कानि शीर्षाणि । ऋग्वेदोऽस्याः प्रथमः पादो भवति । यजुर्वेदो द्वितीयः
    पादः । सामवेदस्तृतीयः पादः । अथर्ववेदश्चतुर्थः पादः । पूर्वा दिक् प्रथमा कुक्षिर्भवति । दक्षिणा द्वितीया
    कुक्षिर्भवति । पश्चिमा तृतीया कुक्षिर्भवति । उत्तरा चतुर्थी कुक्षिर्भवति । ऊर्ध्वं पञ्चमी कुक्षिर्भवति
    । अधः षष्ठी कुक्षिर्भवति । व्याकरणोऽस्याः प्रथमः शीर्षो भवति । शिक्षा द्वितीयः। कल्पस्तृतीयः । निरुक्तश्चतुर्थः
    । ज्योतिषामयनमिति पञ्चमः । का दिक् को वर्णः किमायतनं कः स्वरः किं लक्षणम्
