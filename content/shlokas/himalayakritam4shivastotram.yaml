id: himalayakritam4shivastotram
category: stotram
name:
  english: himalayakritam4shivastotram
  devanagari: हिमालयकृतं४शिवस्तोत्रम्
content:
  english: himalayakritam 4 shivastotram devadeva mahadeva yogirupa namo'stu te || 7|| nirgunaya sagunaya
    lilakaraya te namah | paripurnaya vikritirahitaya ca te namah || 8|| shantaya sukharupaya brahmane
    te namonamah | tapahphalapradatre te tapahsthaya namonamah || 9|| abahirbhogakaraya namaste paramatmane
    | paramatmasvarupaya te satipataye namah || 10|| bhagyodayaphalam me'tra tvagatastvam mama grihe |
    sanatham kritavan mam tvam prabho sadhusukhaprada || 11|| adya me saphalam janma saphalam jivanam
    mama | adya me saphalam sarvam yadatra tvam samagatah || 12|| jnatva'nanyam tava dasam cajnam dehi
    yadi prabho | tvatsevam tu sada pritya kuryam dasyavidhanatah || 13|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 185
  devanagari: हिमालयकृतं ४ शिवस्तोत्रम् देवदेव महादेव योगिरूप नमोऽस्तु ते ॥ ७॥ निर्गुणाय सगुणाय लीलाकाराय
    ते नमः । परिपूर्णाय विकृतिरहिताय च ते नमः ॥ ८॥ शान्ताय सुखरूपाय ब्रह्मणे ते नमोनमः । तपःफलप्रदात्रे
    ते तपःस्थाय नमोनमः ॥ ९॥ अबहिर्भोगकाराय नमस्ते परमात्मने । परमात्मस्वरूपाय ते सतीपतये नमः ॥ १०॥ भाग्योदयफलं
    मेऽत्र त्वागतस्त्वं मम गृहे । सनाथं कृतवान् मां त्वं प्रभो साधुसुखप्रद ॥ ११॥ अद्य मे सफलं जन्म सफलं
    जीवनं मम । अद्य मे सफलं सर्वं यदत्र त्वं समागतः ॥ १२॥ ज्ञात्वाऽनन्यं तव दासं चाज्ञां देहि यदि प्रभो
    । त्वत्सेवां तु सदा प्रीत्या कुर्यां दास्यविधानतः ॥ १३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    १८५
