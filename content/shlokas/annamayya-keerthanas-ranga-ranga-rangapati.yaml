id: annamayya-keerthanas-ranga-ranga-rangapati
category: stotram
name:
  english: Annamayya Keerthanas Ranga Ranga Rangapati
content:
  english: sindhu bhairava ranga ranga ranga pati ranganadha ni | singaralè taracaya shri ranga nadha
    || patta pagale mato palucaga navvevu | òttulela taligirincu vadi ni matalu vintè | rattadivi meramiraku
    ranganadha | ranganadha shri ranganadha || kaveti rangamuna kantapai padalu saci | ravu povu èkkadiki
    ranga nadha | shri venkatadri mida ceri nanu kuditivi | evala cucina niveyita ranganadha || ranganadha
    shri ranganadha
  devanagari: सिन्धु भैरव रङ्ग रङ्ग रङ्ग पति रङ्गनाधा नी । सिङ्गारालॆ तरचाय श्रि रङ्ग नाधा ॥ पट्ट पगले
    मातो पलुचग नव्वेवु । ऒट्टुलेल टलिगिरिञ्चु वडि नी माटलु विण्टॆ । रट्टडिवि मेरमीरकु रङ्गनाधा । रङ्गनाधा
    श्री रङ्गनाधा ॥ कावेटि रङ्गमुन कान्तपै पादालु साचि । रावु पोवु ऎक्कडिकि रङ्ग नाधा । श्री वेङ्कटाद्रि
    मीद चेरि ननु कूडितिवि । एवल चूचिन नीवेयिट रङ्गनाधा ॥ रङ्गनाधा श्री रङ्गनाधा
meaning: {}
