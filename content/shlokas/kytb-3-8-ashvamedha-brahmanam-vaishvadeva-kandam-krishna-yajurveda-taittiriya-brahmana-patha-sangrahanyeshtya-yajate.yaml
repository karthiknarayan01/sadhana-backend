    प्र॒जा अ॒भिसग्ग् प्र॒जाप॑तिरकामयताश्वमे॒धेन॑ प्र॒जाप॑ति॒र्न किञ्च॒ न प्र॒जाप॑ति॒ रक्षाग्ं॑सि पुरु॑ष॒
    स्त्रयो॑विग्ंशतिः प्राणापा॒नावे॒वास्मि॒न् ॥ हरिः ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके
    अष्टमः प्रपाठक
