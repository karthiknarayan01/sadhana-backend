    || 222|| vimuktanityamuktatmasevito vicyutisvakah | vimuktanayananando vimuktahridayapriyah || 223||
    vimuktahridayaramo vimuktoktatmatattvakah | vimuktajanasamvadi vimuktajanatarpanah || 224|| virajatoyasamsargaprakritatmakritasvakah
    | virajatirakantaravihrito virajapriyah || 225|| virajatoyasamsargatprakritatmikritasvakah || 226||
  devanagari: ृङ्गमकुटो विशदोपलकुण्डलः ॥ ७०॥ विश्वकेतुधनुःप्रायभ्रूलतो विस्तृताननः । विश्वमात्राशयहरो
    विलोलमधुपालकः ॥ ७१॥ विमुग्धनासिकादण्डो विशालहनुसुन्दरः । विश्वमात्राधर्मगण्डो विनीलश्मश्रुमण्डलः ॥
    ७२॥ विशालाक्ष्यारक्तरेखो विस्तीर्णश्रीकृतिश्रवाः । विश्वमातृकरग्राह्यचिबुको विशदस्मितः ॥ ७३॥ विशालफालो
    विषजग्रीवो विषजरत्नधृत् । विलम्बिहाररुक्पूरविशदोरस्थलान्तरः ॥ ७४॥ विषध्रेन्द्रायतभुजो विषाणिरिपुमध्यमः
    । विनिम्ननाभिर्विपुलश्रोणिर्विविधलेपनः ॥ ७५॥ विनदत्स्वर्णवलयो विद्युद्र्वततिमेखलः । विषाणिकरमुग्धोरुर्यजतूणीरजङ्घिकः
    ॥ ७६॥ विगूढजत्रुर्विश्वौघशरण्याङ्घ्रिपयोरुहः । विसारवज्रचक्राब्जहलकेत्वङ्कधृत्पदः ॥ ७७॥ विद्रुमारक्तनखरो
    विविधाम्नायनूपुरः । विमुग्धस्निग्धरक्ताङ्घ्रितलो विसदृशाकृतिः ॥ ७८॥ विद्याराजो विद्यमानो विद्याकमलिनीरविः
    । विद्यमानागामीभूतप्रभुर्विद्यादुरन्वयः ॥ ७९॥ विद्यावल्लीमूलकन्दो विद्यानन्दाब्धिखेलनः । विद्यालतोपघ्नभुजो
    विद्याम्भोरुहबम्भरः ॥ ८०॥ विद्यापद्ममरन्दात्मा विद्यापुष्करचन्द्रमाः । विद्याविनयसम्पन्नब्रह्महस्त्यादि
    तुल्यधीः ॥ ८१॥ विद्यानन्दमयो विद्यानन्दबिम्बो विविद्यकः । विद्याप्रदायी विद्यात्मा विद्याफलमयाकृतिः
    ॥ ८२॥ विद्यालक्ष्मीत्रपाकीर्तितुष्टिपुष्टिसतीवृतः । विक्रान्तो विह्वलत्राता वियातो विनयान्वितः ॥ ८३॥
    विरोधहीनो विस्नेहो विगुणो विमदो विमः । विक्लमो विगताधर्मो विवृद्धिर्विपरिक्षयः ॥ ८४॥ विस्वेदो विमलो
    विस्रहीनो विक्षुर्वितृड्विभीः । विप्राकृतो विभापिण्डो विप्रमाणो विबन्धनः ॥ ८५॥ विप्रकृष्टो विकुर्वाणो
    विहारी विरलोदयः । विशाम्पतिर्विश्रुतात्मा विविधाम्नायमृग्यकृत् ॥ ८६॥ विविक्तसेविनेदीयान् विनायकविवर्जितः
    । विदैवो विप्लवाहर्ता विधेयाखिलदैवतः ॥ ८७॥ विकुण्ठलोकनिर्माता विकुण्ठेशो विकुण्ठभः । विकुण्ठाकूटतनयो
    विकुण्ठनगरीप्रियः ॥ ८८॥ विकुण्ठपद्ममार्तण्डो विकुण्ठविभवाश्रयः । विकुण्ठलोलो विकुण्ठनारीनयनचन्द्रमा
    ॥ ८९॥ विनतासुतसद्भाहुभासको दुर्विभासकः । विलोलतुलसीमालो विकचाब्जविधूननः ॥ ९०॥ विशदोपलमुक्तौघछत्रद्वयसमञ्चितः
    । विवस्वदयुतच्छद्मप्रदीपो विचलत्पटः ॥ ९१॥ विधुबिम्बमयप्राज्या रात्रिकोडुप्रदीपितः । विमर्दोत्थापारगन्धमूर्छिताशाप्रबोधनः
    ॥ ९२॥ विश्वम्भराकराम्भोजचामरानिलसेवितः । विद्युद्भूषणभूषाङ्गश्रीमुखेन्दुप्रभार्चितः ॥ ९३॥ विध्यंसविन्यस्तभुजो
    विष्वक्सेनादिसंवृतः । विध्यण्डरेणुसञ्चारक्षमरोमान्धुजालकः ॥ ९४॥ विश्वम्भरारजःपुञ्जगणकागण्यवीर्यवान्
    । विष्टपत्रयपूर्वोर्ध्वलोकविष्कम्भकस्यदः ॥ ९५॥ विरिञ्चिकल्पान्तसाक्षी विरिञ्चिप्रीतिवर्धनः । विरिञ्च्ययुतसाहस्रजनको
    विधिपावकः ॥ ९६॥ विरिञ्चिदत्तप्रवररक्षःखण्डनपण्डितः । विरिञ्चिकार्यनिर्वाहो विरिञ्चिपरदैवतम् ॥ ९७॥
    विरिञ्चिपुत्रोपदिष्टतत्त्वो विधिहृदालयः । विपञ्चीशिल्पदेवर्षिसङ्गीतो विधिसौहृदः ॥ ९८॥ विधिसत्त्वोन्मेषकारी
    विधिवक्राटवीहरिः । विधिलोकातिनेदीयान् विधिमुक्तिप्रदायकः ॥ ९९॥ विधिबम्भरनाभ्यब्जो विधिवक्त्राब्जभास्करः
    । विधिलोककृतश्रेया विधिबन्धुर्विधीष्टदः ॥ १००॥ विष्टपेशीकृतविधिर्विधिदत्ताखिलागमः । विधिसौभाग्यसन्धाता
    विधिचेतोविशोधनः ॥ १०१॥ विश्वोपजीव्यो विश्वान्यो विश्वानन्यो विडर्दनः । विश्वशम्भुर्विरूपाक्षजिह्वारङ्गस्थलीनटः
    ॥ १०२॥ विरूपाक्षजटाकाशगङ्गावर्षबलाहकः । विरूपाक्षशरण्याङ्घ्रिर्विरूपाक्षत्रिशूलदः ॥ १०३॥ विरूपाक्षद्विषद्भस्मासुरप्राणविनाशनः
    । विरूपाक्षपरित्त्राता विरूपाक्षशुभप्रदः ॥ १०४॥ विरूपाक्षबलाधाता विरूपाक्षजयप्रदः । विरूपाक्षस्मयाहर्ता
    विरूपाक्षेषुभूतभः ॥ १०५॥ विरूपाक्षजयी विभ्राड्विरूपाक्षविपक्षहृत् । विरूपाक्षप्रीतिपात्रं विरूपाक्षमनोगतः
    ॥ १०६॥ विरूपाक्षमयो विद्धविरूपाक्षतमोऽशुभः । विरूपाक्षानन्तकोटिक्षयसाक्षी विरोधजित् ॥ १०७॥ विरूपनेत्रहृदयं
    विरूपाक्षपितामहः । विरूपनेत्रसद्बन्धुर्विरूपाक्षमुखोक्षिदः ॥ १०८॥ विरूपाक्षसमानात्मा विरूपाक्षाष्टसिद्धिदः
    । विरूपाक्षमहादेवो विरूपाक्षमहागुरुः ॥ १०९॥ विरूपनेत्रान्तरात्मा विरूपाक्षसमीरणः । विरूपाक्षपरिज्ञेयतत्त्वो
    विविधमार्गकृत् ॥ ११०॥ विरूपाक्षब्रह्महत्याहरभिक्षाप्रदापनः । विरूपाक्षाभयकरो विरूपाक्षविमोहनः ॥ १११॥
    विरूपनेत्रोपभुक्तविषववीर्यविनाशनः । विरूपाक्षकृतत्त्रासो विश्वभव्यमहातपाः ॥ ११२॥ विरूपाक्षप्रजारक्षो
    विरूपाक्षविमोक्षदः । विरूपाक्षमताविष्टपाषण्डजनतापनः ॥ ११३॥ विरूपाक्षललाटाक्षि वीतिहोत्राहितप्रभः ।
    विधिरुद्रादिकुल्यान्तर्वृष्टशक्तिजलाम्बुदः ॥ ११४॥ विधिरुद्रादिमानौघपूर्णमायापयोनिधिः । विश्वप्राणान्तरो
    विश्वप्राणाधिष्ठातृपौरुषः ॥ ११५॥ विनायकाभ्यवहृतिक्रियाविघ्ननिवारकः । विनायकायुताधीश विष्यक्सेनोपसेवितः
    ॥ ११६॥ विनायककराब्धारास्नपितश्रीस्वयंवृतः । विनायकैकरदनच्छेदशान्तसुदर्शनः ॥ ११७॥ विनायकसमुद्गीतो विनायकवरप्रदः
    । विनायकपरित्राता विनायकभयावहः ॥ ११८॥ विनायकशरण्याङ्घ्रिर्विनायकशुभप्रदः । विनायकोदरस्थाग्निज्वालावर्धनमारुतः
    ॥ ११९॥ विश्वजन्तूदराग्न्यात्मा विश्वान्नप्रतिपादकः । विश्वम्भरापुण्यगन्धो विद्युत्त्वत्पुष्पसद्रसः
    ॥ १२०॥ विरोचनलसद्रूपं वियच्छब्दो विटेड्द्धृतिः । विरोचनसखस्पर्शो विधुज्योत्स्नाविकातपः ॥ १२१॥ विषशेवधिगाम्भीर्यं
    विश्वज्ञानं विवित्सुखम् । विश्वमङ्गलमाङ्गल्यं विश्वपूरुषपौरुषम् ॥ १२२॥ विश्वम्भराक्षमा विद्युद्रुचिर्विक्रान्तविक्रमः
    । विद्युत्त्वदुदयो विद्युद्भङ्गो विधुविभेदनः ॥ १२३॥ विकम्पनो विषनिधिसन्निवृत्तिर्विवित्पतिः । विनिवृत्तिर्विप्रवृत्तिर्विभावसुगतिर्विदः
    ॥ १२४॥ विश्वाधिको विटवरात्युच्छ्रितो विटधारयः । विटेन्द्रो विटराट्छृङ्गनिलयो विटवर्धनः ॥ १२५॥ विषराण्मन्थनो
    विद्युत्स्फुरन्मकरकुण्डलः । विटकूटाक्रान्तभुजो विषध्रेन्द्रविकर्षणः ॥ १२६॥ विष्फुरद्भुजसन्दोहपर्यायाक्रान्तमन्दरः
    । विध्वनत्करसाहस्रभर्त्सितार्ककरोत्करः ॥ १२७॥ विचलत्कचवृन्दाभ्रमालाञ्जनवपुर्धरः । विस्तीर्णवलिमद्रक्तकण्ठो
    विमृदितप्रजः ॥ १२८॥ विवल्गत्पृथुलश्रोणिर्विरणन्मणिकङ्कणः । विभ्रस्यदूर्ध्वकौशेयो विविधद्रुसुमाप्लुतः
    ॥ १२९॥ विविधस्वरसम्पूर्णमञ्जुगीतविनोदनः । विषधीन्द्रकरोदञ्चत्पयःक्षालितसत्पदः ॥ १३०॥ विभ्रमाक्रान्तविबुधवल्लवीदृष्टिमानसः
    । विस्फुरद्धासविभवध्वस्तसर्वाद्रिकश्मलः ॥ १३१॥ विधुवक्त्रस्मितज्योत्स्नावर्धितक्षीरवारिधिः । विशिखापाङ्गनिहतलक्ष्मीचित्तो
    विनोदभाक् ॥ १३२॥ विश्वावस्वादिगन्धर्वगीयमानगुणेहितः । विधिरुद्रेन्द्रकलितजयशब्दो विषार्दनः ॥ १३३॥
    विश्राणनगुणाक्रान्तकामधेनुसुरद्रुमः । विबुधद्विपसङ्क्रान्तगतिगाम्भीर्यसद्गुणः ॥ १३४॥ विधुमण्डलसङ्क्रान्तमुखकञ्जप्रभाकलः
    । विबुधाश्वोपसङ्क्रान्तवैशद्यविशदश्रवाः ॥ १३५॥ विबुधाहारसङ्क्रान्तमाधुर्यमधुराधरः । विबुधक्षितिवामाक्षीक्रान्तसौन्दर्यविग्रहः
    ॥ १३६॥ विषरत्नोपसङ्क्रान्ततेजा विश्वप्रमाणदित् । विश्वव्यवस्थासन्धाता विश्वसङ्ग्रहनिग्रहः ॥ १३७॥ विषराट्छीकरर्क्षौघचित्रिताकारपुष्करः
    । विषाक्लेद्यो विषादाह्यो विषधिर्विषनाशनः ॥ १३८॥ विश्वमातृस्मरोन्मेषो विश्वमातृस्वयंवृतः । विश्वमातृकटाक्षालिपीयमानपदाम्बुजः
    ॥ १३९॥ विश्वमातृसमानात्मा विश्वमातृपरीक्षितः । विश्वमातृस्मिताहारो विश्वमातृपदाङ्कितः ॥ १४०॥ विश्वमातृकलाभूषो
    विश्वमात्रधरस्पृहः । विश्वाम्बिकोरोजकुम्भनाभिलेपायिताकृतिः ॥ १४१॥ विश्वमातृमुखाम्भोजकस्तूरीतिलकद्दृशः
    । विश्वमातृशिरोजौघमेघमण्डलभृत्करः ॥ १४२॥ विश्वमातृकुचोर्वीध्रविश्रान्ताद्भुतवारिदः । विश्वमातृमुखानङ्कचन्द्रमण्डलमानदः
    ॥ १४३॥ विश्वमातृमुखाम्भोजपीयमानाधरामृतः । विश्वमातृभुजव्याजिचम्पकस्रग्लसद्गलः ॥ १४४॥ विश्वमातृकुचद्वन्द्वपीडितोरस्थलस्रजः
    । विश्वमातृदृशाभृङ्गीपीतहृत्पद्मसद्रसः ॥ १४५॥ विश्वमातृकपोलान्तःप्रतिबिम्बितसन्मुखः । विश्वमातृमुखाम्भोजप्रतिमाभृत्कपोलकः
    ॥ १४६॥ विश्वमातृश्रवोभूषारुक्पूरश्वेतिताननः । विद्रुमीकृतपद्मासन्नासिकामौक्तिकाधरः ॥ १४७॥ विश्वमातृशिरस्सौरीश्लिष्टगङ्गाकृताप्लवः
    । विश्वमातृदृगन्ताभाक्षणनीलोत्तराधरः ॥ १४८॥ विश्वमातृदृगम्भोजसङ्कोचोन्मेषदेक्षणः । विश्वमात्रलकाक्षेपासहनेन्दुकलानखः
    ॥ १४९॥ विश्वमात्राननादर्शवृन्तश्चिबुकधृत्करः । विश्वमात्रोष्ठपीयूषपानत्यक्तसुधाघटः ॥ १५०॥ विपञ्चीस्वरजिल्लक्ष्मीगानमाधुर्यविस्मितः
    । विश्वमातृस्वर्णलतावपन्तायतविग्रहः ॥ १५१॥ विश्वमातृश्रुतिद्वन्द्वभूषणायितभाषणः । विश्वमातृवचःपुष्पमरन्दापूरिताशयः
    ॥ १५२॥ विश्वमातृस्वर्णपुत्रीभूषिताङ्कोपशोभितः । विश्वमातृमनोज्ञांसलक्ष्मीलालितसद्भुजः ॥ १५३॥ विश्वाम्बाकरकञ्जातनखाभारञ्जितस्तनः
    । विश्वाम्बापाङ्गनीलाब्जपूजितो विश्वमन्मथः ॥ १५४॥ विश्वाम्बाकैशिकामोदाघ्राणकेलिविचक्षणः । विश्वाम्बास्पर्शसुखितो
    विश्वाम्बामूर्धचुम्बकः ॥ १५५॥ विश्वाम्बामोहपाशाभवनमालाविभूषितः । विश्वाम्बाकुचकाश्मीररञ्जितोत्तरसत्पटः
    ॥ १५६॥ विश्वम्भरालसत्पृष्ठो विश्वाम्बादृढसौहृदः । विश्वम्भराविश्वमातृमण्डितोभयपार्श्वकः ॥ १५७॥ विश्वम्भराधृताम्भोजच्छत्रो
    विश्वम्भराप्रियः । विश्वाम्बाकरगस्वर्णवालव्यजनवीजितः ॥ १५८॥ विश्वम्भराविश्वमातृवामसव्यकुचग्रहः । विश्वम्भराविश्वमातृन्यस्तैकैकाम्बुजेक्षणः
    ॥ १५९॥ विश्वम्भरासमुल्लासो विश्वाम्बामानवर्धनः । विश्वाम्बानुनयाभिज्ञो विश्वाम्बावचनानुगः ॥ १६०॥ विश्वम्भराविश्वमातृसव्यासव्यकरग्रहः
    । विश्वम्भराकृष्णवेणीसंसेवासुखिताशयः ॥ १६१॥ विश्वम्भरोपथिभुजो विश्वाम्बाकशिपूदरः । विश्वम्भराश्लेषिदिव्यभव्यार्चाविग्रहायुतः
    ॥ १६२॥ विश्वम्भरागर्भदाता विश्वाम्बाभोगवर्धनः । विश्वम्भरासमुद्धर्ता विश्वाम्बानित्यसंयुतः ॥ १६३॥
    विश्वम्भरानित्यबन्धुर्विश्वाम्बाजन्मभूरुचिः । विश्वम्भराकराम्भोजशुकसंस्तुतसद्गुणः ॥ १६४॥ विश्वम्भरागर्भलीनदिव्यौषधिसमुद्धरः
    । विश्वम्भराधेनुवृषो विश्वधर्मपरायणम् ॥ १६५॥ विरुद्धधर्मनिर्हर्ता विविधत्रातृविग्रहः । विश्वम्भरापराधारो
    विश्वकञ्चुकिताकृतिः ॥ १६६॥ विश्वबीजब्रह्मयोनिर्विश्वयोनिप्रकल्पकः । विश्वविश्वेदेवदेवो विश्वभाषाविशारदः
    ॥ १६७॥ विविधग्रन्थविषयो विश्वमन्त्रार्थसङ्ग्रहः । विविधानन्तमन्त्रार्थो विश्वमन्त्राधिदैवतम् ॥ १६८॥
    विग्रहोपलसन्मन्त्रो विश्वमन्त्रफलप्रदः । विश्वाम्नायमयो विश्वमन्त्रादिर्विश्वमन्त्रसत् ॥ १६९॥ विविधास्त्रप्रयोगज्ञो
    विविधास्त्रमयाकृतिः । विविधास्त्रोपसंहारवेत्ता विश्वास्त्रभञ्जनः ॥ १७०॥ विश्वास्त्रवारणात्मास्त्रो
    विश्वास्त्रास्पृश्यविग्रहः । विश्वास्त्रबलसन्धाता विविधास्त्रसमुद्भवः ॥ १७१॥ वितथेतरवागस्त्रो विविधास्त्रमहेश्वरः
    । विविधाम्नायनिश्श्वासो विदीप्तश्रुतिमस्तकः ॥ १७२॥ विश्ववेदैकसंवेद्यो विहिताम्नायमस्तकः । विग्रहाञ्चाद्वेदवन्तिस्तुतो
    विविधवेदवित् ॥ १७३॥ विविधाम्नायसन्मालानायको विवृतश्रुतिः । विध्यर्थवादाविषयो विलसच्छ्रुतिवल्लभः ॥
    १७४॥ विश्वम्भराप्रविष्टात्मधृतभूतो विलाघवः । विधुभूतात्मसम्पुष्टविविधौषधिमण्डलः ॥ १७५॥ विश्वानरसुताविष्टस्वतेजःपाचितौदनः
    । विरोचनसभाऽऽविष्टस्वशक्त्वुज्जीवितप्रजः ॥ १७६॥ विभावसुसमाविष्टस्वतेजोवृष्टभूतलः । विश्वोपसङ्क्रान्तसच्चित्सुखांशो
    विश्वविभ्रमः ॥ १७७॥ विभक्त्यर्थो विभक्तिस्थशक्तिरूपो विभक्तिकृत् । विभक्त्यगोचरपदो विभक्त्यात्मा विभक्तिभृत्
    ॥ १७८॥ विश्वापोहो विश्ववृत्तिर्विश्वज्ञानो विभोजनः । विश्वस्मृतिर्विश्वनिद्रो विश्वजागरणो विदृक् ॥
    १७९॥ विश्वप्रेमास्पदवदो विश्वभूतादिवत्सलः । विश्वरत्नोदरो विश्ववसुजिद्विश्वमन्दिरः ॥ १८०॥ विषशेवधिजामाता
    विषधिश्वशुरोत्तमः । विश्वप्रियाबुद्धिगुरुर्विश्वसूप्रकृतिप्रियः ॥ १८१॥ विश्रवस्तनयाधीशो विश्रवस्सुतशेवधिः
    । विश्रवस्तनयोदारधनदो विश्रवस्सुतः ॥ १८२॥ विश्रवस्सुतसंसेव्यो विश्रवस्सुतबान्धवः । विश्रवस्सुतसन्त्राता
    विश्रवस्सुतकामदः ॥ १८३॥ विश्रवस्सुतहृद्वासो विश्रवस्सुतचोदनः । विश्रवस्सुतदुर्ज्ञेयो विश्रवस्सुततोषितः
    ॥ १८४॥ विश्रवस्सुतदत्तोत्तराशो विश्रवाश्रयः । विश्रवस्तवयैश्वर्यप्रदलक्ष्मीदृगञ्चलः ॥ १८५॥ विबुधेश्वरदृक्पद्मसहस्रामितसौभगः
    । विबुधाधिपसोदर्यो विबुधाधिपपालनः ॥ १८६॥ विबुधेन्द्रो विबुधराड्वितीर्णविबुधालयः । विबुधेन्द्रारिसंहर्ता
    विबुधेन्द्रविपद्धरः ॥ १८७॥ विबुधेन्द्रविपद्बन्धुर्विबुधेन्द्रप्रसादितः । विबुधेन्द्रकृतैश्वर्यो विबुधेश्वरकामदः
    ॥ १८८॥ विबुधेन्द्रशतैश्वर्यो विरोचनसुतान्दनः । विबुधेन्द्रकृतशतक्रतुर्विबुधनाथजित् ॥ १८९॥ विबुधाधीशपक्षपातो
    विबुधस्त्रीप्रणर्तितः । विबुधस्त्रीलतोपघ्नो विबुधेश्वरसाह्यकृत् ॥ १९०॥ विबुधेन्द्रायुधस्थात्मतेजा
    विबुधदीपनः । विबुधाहारितसुधो विबुधोत्साहवर्धनः ॥ १९१॥ विबुधासुरसङ्ग्रामजयलक्ष्मीसमञ्चितः । विबुधास्याब्जमार्तण्डो
    विबुधेन्द्रपुरोहितः ॥ १९२॥ विबुधाचार्यसंशास्ता विबुधाचार्यदेशिकः । विबुधाचार्यसंस्तुत्यो विबुधाचार्यमानदः
    ॥ १९३॥ विबुधद्रुमसन्तानपुष्पलक्ष्मीनिषेवितः । विबुधद्रुममूलस्थो विबुधद्रुमजन्मकृत् ॥ १९४॥ विबुधध्वजिनीपालो
    विशाखामितवीर्यदः । विशाखातनयत्त्राता विशाखहृदयान्तरः ॥ १९५॥ विशाखविन्यस्तनिजतेजा विजिततारकः । विशाखाद्भुतदर्पाब्धिकुम्भभूर्विबुधोदयः
    ॥ १९६॥ विशाखषण्मुखाश्रान्तगीतषड्गुणभूषणः । विशाखातनयव्यूहसेनापालनपण्डितः ॥ १९७॥ विशाखासुतविद्यादो
    विशाखासुतचोदनः । विशाखप्रीतहृदयो विशाखपरिपूजितः ॥ १९८॥ विशाखनिर्दम्भबन्धुर्विशाखपरदैवतम् । विशाखपरमोदारतपोवल्लीफलप्रदः
    ॥ १९९॥ विकैतवतपोरूपो विदोषतपाश्रयः । विदर्शनतपःप्राप्यो विविघ्नसुतपःप्रियः ॥ २००॥ विषाधीशो विषाधीशचेतःकमलभास्करः
    । विषाधीशप्रतीचीदो विषेशज्ञानदायकः ॥ २०१॥ विषाधीशान्तरारामो विषाधीशहृदीश्वरः । विषाधीश्वरविज्ञाततत्त्वो
    विषपतिप्रियः ॥ २०२॥ विविक्तद्वारनवकब्रह्मपत्तनभासनः । विस्रुतामृतसम्पूर्णब्रह्मपुर्यन्तरुज्ज्वलः ॥
    २०३॥ विशुद्धचक्रनिलयो विशुद्दारिदृगर्चितः । विशुद्धचक्रावेशितासुप्राप्यो विविधचक्रकृत् ॥ २०४॥ विविक्तषट्चक्रपुरस्वामी
    विविधचक्रगः । विशुद्धचक्रोपरिस्थपूर्णचन्द्रो विशुद्धदृक् ॥ २०५॥ विधुभास्वन्नाडिकान्तस्सुषुम्नाग्रतलालयः
    । विविक्तोत्थापिताहीन्द्रस्रुतामृतपसत्प्रियः ॥ २०६॥ विरतस्वान्तकमलप्रतीतो वितमःप्रभः । विपरानुभवाकारो
    विश्वशून्यविचक्षणः ॥ २०७॥ विविकल्पसमाध्यात्मा विविकल्पसमाधिभाक् । विविकल्पसमाध्यास्यो विविकल्पसमाधिदृक्
    ॥ २०८॥ विकल्पितसमाधिस्थपुरुषाज्ञेयसत्पदः । विविक्तसच्चित्सुखात्मा विश्वमायादुरन्वयः ॥ २०९॥ विकल्पितदभावानाकलितो
    विलयोदयः । विद्याविद्योपाधिहीनो विद्याविद्याप्रकल्पनः ॥ २१०॥ विशेषहीनचिद्रूपमायाकल्पितदेहभाक् । विवादाविषयावार्यमायो
    विप्रकृतिप्रभः ॥ २११॥ विषुवाद्यपरिच्छेद्यो विभावर्यादिकल्पनः । विभावर्याद्यवयववत्सरात्मकचक्रकृत् ॥
    २१२॥ विनिरोधाब्दचक्रोरुवेगात्तपुरुषायुषः । विश्वत्त्राणात्मचरणप्रसन्नध्रुवसद्गतिः ॥ २१३॥ विभ्रमत्कालनेमिघ्नो
    विषुवो विषुवप्रभुः । विकालचक्रपदगो विवस्वद्भ्रमणातिगः ॥ २१४॥ विवस्वदायुःकलनो विवस्वत्सुतशासनः । विवस्वत्तनयोदारदण्डपाशाहितप्रभः
    ॥ २१५॥ विकलाकाष्ठादिसत्यकालो विश्वोत्तरापदः । विपूर्वो विप्रतीचीको विधिलोकादिदक्षिणः ॥ २१६॥ विवस्वद्द्विधुतारादिभ्रमणागोचरालयः
    । विध्वादिमच्छिंशुमारचक्रनित्यभ्रमावहः ॥ २१७॥ विश्वामित्रादिसप्तर्षिपूजितध्रुवलोककृत् । विश्वामित्रादिसप्तर्षिदत्तज्योतिर्मयक्षितिः
    ॥ २१८॥ विविक्तनक्षत्रपथो वियद्गङ्गाधुनीधरः । विवस्वत्स्यन्दनाधारो विधुलोकरसावहः ॥ २१९॥ विद्युद्विवस्वद्वरुणाद्यातिवाहिककल्पकः
    । विरोचनज्योतिराद्यापुनरावृत्तिमार्गकृत् ॥ २२०॥ विधूतकलुषोदारभक्तदत्तात्मरूपकः । विमानप्रवरानीतभक्तदर्शनकौतुकः
    ॥ २२१॥ विधिरुद्रादिसत्कारतुष्टभक्तप्रियंवदः । विद्युदम्बरसच्छङ्खचक्रभक्तगणावृतः ॥ २२२॥ विमुक्तनित्यमुक्तात्मसेवितो
    विच्युतिस्वकः । विमुक्तनयनानन्दो विमुक्तहृदयप्रियः ॥ २२३॥ विमुक्तहृदयारामो विमुक्तोक्तात्मतत्त्वकः
    । विमुक्तजनसंवादी विमुक्तजनतर्पणः ॥ २२४॥ विरजातोयसंसर्गाप्राकृतात्मकृतस्वकः । विरजातीरकान्तारविहृतो
    विरजाप्रियः ॥ २२५॥ विरजातोयसंसर्गात्प्राकृतात्मीकृतस्वकः ॥ २२६॥
