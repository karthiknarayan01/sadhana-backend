id: lalitahridayastotram-2
category: hridaya
name:
  english: lalitahridayastotram 2
  devanagari: ललिताहृदयस्तोत्रम् २
content:
  english: garbhitam || 31|| stotranamuttamam stotram mantranamuttamam manum | bijanamuttamam bijam shaktanamuttamam
    shivam || 32|| pathed bhaktya tri
  devanagari: गर्भितम् ॥ ३१॥ स्तोत्राणामुत्तमं स्तोत्रं मन्त्राणामुत्तमं मनुम् । बीजानामुत्तमं बीजं शाक्तानामुत्तमं
    शिवम् ॥ ३२॥ पठेद् भक्त्या त्रि
meaning: {}
