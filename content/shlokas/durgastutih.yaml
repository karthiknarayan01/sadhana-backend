id: durgastutih
category: stotram
name:
  english: durgastutih
  devanagari: दुर्गास्तुतिः
content:
  english: namami devim kamalayatakshim surendrabrindadi natamghriyugmam | samunnatasheshasuraprapalinim
    namami durgam duritapahantrim || 1 || kiritakotyullikhitabjapadam manojavam tam parameshabhaminim
    | shashamkarekhanvitamastakagram sureshvarim tam pranamami durgam || 2 || mulashribhairavatmatrividhapadamahadevatabhih
    parite divye simhasanendre sthitamakhilakalabodhakam deshikesham | tasyanke sannishannamarunarucicaya
    ranjitashavakasham devimanandapurnamamritakaratalamashraye'bhishtasiddhyai || 3 || kalpantanalakotikotisadrisham
    ghoram trishulayudham panibhyam parigrihya pancavadanaskandhe'dhiruhya sthitam | vishvasavritavirashaktivividhakridavishesharavaih
    tattatkshudrasamastashatrunivaham vande mahashulinim || 4 || bhasakundashashankashamkhasadrisham kanthiravadhyasinim
    kodandeshukapalapustakajapasrak shuladanabhayam | sarveshim nikhilaghasamghashamanim bhaktanukampaparam
    devim vishvamanorathaikavaradam dhyayetparamambikam || 5 || meghashyamalakomalam smitamukhim simhasanam
    shankarim capajyodgatavarunastragalitairapuritashashtakaih | toyairbhaktaviruddhasainikaganam samstambhayantyanvaham
    vishvakaraniyapanam vidadhatim dhyayenmahashulinim || 6 || aruhya simhamasikhetarathangashamkha
  devanagari: नमामि देवीं कमलायताक्षीं सुरेन्द्रबृन्दादि नतांघ्रियुग्माम् । समुन्नताशेषसुरप्रपालिनीं नमामि
    दुर्गां दुरितापहन्त्रीम् ।। १ ।। किरीटकोट्युल्लिखिताब्जपादां मनोजवां तां परमेशभामिनीम् । शशांकरेखान्वितमस्तकाग्रां
    सुरेश्वरीं तां प्रणमामि दुर्गाम् ।। २ ।। मूलश्रीभैरवात्मत्रिविधपदमहादेवताभिः परीते दिव्ये सिंहासनेन्द्रे
    स्थितमखिलकलाबोधकं देशिकेशम् । तस्याङ्के सन्निषण्णामरुणरुचिचया रञ्जिताशावकाशां देवीमानन्दपूर्णाममृतकरतलामाश्रयेऽभीष्टसिद्ध्यै
    ।। ३ ।। कल्पान्तानलकोटिकोटिसदृशं घोरं त्रिशूलायुधं पाणिभ्यां परिगृह्य पञ्चवदनस्कन्धेऽधिरुह्य स्थिताम्
    । विश्वासावृतवीरशक्तिविविधक्रीडाविशेषारवैः तत्तत्क्षुद्रसमस्तशत्रुनिवहां वन्दे महाशूलिनीम् ।। ४ ।।
    भासाकुन्दशशाङ्कशंखसदृशां कण्ठीरवाध्यासिनीं कोदाण्डेषुकपालपुस्तकजपस्रक् शूलदानाभयाम् । सर्वेशीं निखिलाघसंघशमनीं
    भक्तानुकम्पापरां देवीं विश्वमनोरथैकवरदां ध्यायेत्परामम्बिकाम् ।। ५ ।। मेघश्यामलकोमलां स्मितमुखीं सिंहासनां
    शाङ्करीं चापज्योद्गतवारुणास्त्रगलितैरापूरिताशाष्टकैः । तोयैर्भक्तविरुद्धसैनिकगणं संस्तम्भयन्त्यन्वहं
    विश्वाकारनियापनं विदधतीं ध्यायेन्महाशूलिनीम् ।। ६ ।। आरुह्य सिंहमसिखेटरथाङ्गशंख
