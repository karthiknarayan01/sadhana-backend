id: munibhihkritamskandashatashtanamastotram
category: stotram
name:
  english: munibhihkritamskandashatashtanamastotram
  devanagari: मुनिभिःकृतंस्कन्दशताष्टनामस्तोत्रम्
content:
  english: skando guhah shanmukhashca bhalanetrasutah prabhuh | pingaḻah krittikasunuh shikhivaho dvishadbhujah
    || 141|| dvishannetrah kumarashca pishitashanabhanjanah | tarakasurasamharta rakshobalanishudanah
    || 141|| mattah pramatta unmattah surasainyabhirakshakah | devasenapatih prajnah kripalurbhaktavatsalah
    || 142|| umasuto mahasenah kumarah krauncadaranah | senaniragrajanma ca vishakhah shankaratmajah ||
    143|| shivasvami ganasvami sarvasvami sanatanah | anantashaktirakshobhyah parvatipriyanandanah ||
    144|| gangasutah sharodbhuta ahutah pavakatmajah | jrimbhah prajrimbha ujjrimbhah kamalasanasannutah
    || 145|| ekavarno dvivarnashca trivarnah sumanoharah | caturvarnyah pancavarnah prajapatirahahpatih
    || 146|| agnigarbhah shamigarbho vishvagarbhah surariha | haridvarnah shubhakarah patuvak vatuveshadhrik
    || 147|| pusha gabhastirgaganashcandravarnah kaladharah | mayadharo mahamayah kailasavasathah shikhi
    || 148|| vishvayonirameyatma tejonidhiranamayah | parameshthi parabrahma vedagarbho virad vasuh ||
    149|| pulindakanyabharta ca mahasarasvatapradah | ashritakhiladata ca coraghno roganashanah || 150||
    anantashaktiranandah shikhandikritaketanah | dambhah paramadambhashca mahadambho vrishakapih || 151||
    karanam kantadehashca karanatitavigrahah | ahirupo'mritavapuh pranayamaparayanah || 152|| viruddhaharta
    viraghno raktashyamalalocanah | bahuvarno ganapatih svabhaktabhishtadayakah || 153|| sarveshvaro lokagururasuranikanashanah
    | subrahmanyo guhah skando brahmanyo brahmanapriyah || 154||
  devanagari: स्कन्दो गुहः षण्मुखश्च भालनेत्रसुतः प्रभुः । पिङ्गळः कृत्तिकासूनुः शिखिवाहो द्विषड्भुजः
    ॥ १४१॥ द्विषण्णेत्रः कुमारश्च पिशिताशनभञ्जनः । तारकासुरसंहर्ता रक्षोबलनिषूदनः ॥ १४१॥ मत्तः प्रमत्त
    उन्मत्तः सुरसैन्याभिरक्षकः । देवसेनापतिः प्राज्ञः कृपालुर्भक्तवत्सलः ॥ १४२॥ उमासुतो महासेनः कुमारः
    क्रौञ्चदारणः । सेनानीरग्रजन्मा च विशाखः शङ्कारात्मजः ॥ १४३॥ शिवस्वामी गणस्वामी सर्वस्वामी सनातनः ।
    अनन्तशक्तिरक्षोभ्यः पार्वतीप्रियनन्दनः ॥ १४४॥ गङ्गासुतः शरोद्भूत आहुतः पावकात्मजः । जृम्भः प्रजृम्भ
    उज्जृम्भः कमलासनसन्नुतः ॥ १४५॥ एकवर्णो द्विवर्णश्च त्रिवर्णः सुमनोहरः । चातुर्वर्ण्यः पञ्चवर्णः प्रजापतिरहःपतिः
    ॥ १४६॥ अग्निगर्भः शमीगर्भो विश्वगर्भः सुरारिहा । हरिद्वर्णः शुभकरः पटुवाक् वटुवेषधृक् ॥ १४७॥ पूषा
    गभस्तिर्गगनश्चन्द्रवर्णः कलाधरः । मायाधरो महामायः कैलासावसथः शिखी ॥ १४८॥ विश्वयोनिरमेयात्मा तेजोनिधिरनामयः
    । परमेष्ठी परब्रह्म वेदगर्भो विराड् वसुः ॥ १४९॥ पुलिन्दकन्याभर्ता च महासारस्वतप्रदः । आश्रिताखिलदाता
    च चोरघ्नो रोगनाशनः ॥ १५०॥ अनन्तशक्तिरानन्दः शिखण्डिकृतकेतनः । डम्भः परमडम्भश्च महाडम्भो वृषाकपिः ॥
    १५१॥ कारणं कान्तदेहश्च कारणातीतविग्रहः । अहिरूपोऽमृतवपुः प्राणायामपरायणः ॥ १५२॥ विरुद्धहर्ता वीरघ्नो
    रक्तश्यामललोचनः । बहुवर्णो गणपतिः स्वभक्ताभीष्टदायकः ॥ १५३॥ सर्वेश्वरो लोकगुरुरसुरानीकनाशनः । सुब्रह्मण्यो
    गुहः स्कन्दो ब्रह्मण्यो ब्राह्मणप्रियः ॥ १५४॥
