id: yugalamantrakramah
category: mantra
name:
  english: yugalamantrakramah
  devanagari: युगलमन्त्रक्रमः
content:
  english: om hrim shrim klim radhakrishnau premanandavigrahau mama hridi sannidhattam svaha || om asya
    shriparamayugalamantrasya narayanarishih | jagatichandah | shriradhakrishnau devata | paramapremasiddhyartham
    jape viniyogah || 9
  devanagari: ॐ ह्रीं श्रीं क्लीं राधाकृष्णौ प्रेमानन्दविग्रहौ मम हृदि सन्निधत्तां स्वाहा ॥ ॐ अस्य श्रीपरमयुगलमन्त्रस्य
    नारायणऋषिः । जगतीछन्दः । श्रीराधाकृष्णौ देवता । परमप्रेमसिद्ध्यर्थं जपे विनियोगः ॥ ९
meaning: {}
