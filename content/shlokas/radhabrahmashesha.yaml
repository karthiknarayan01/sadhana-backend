id: radhabrahmashesha
category: stotram
name:
  english: radhabrahmashesha
  devanagari: राधाब्रह्मशेश
content:
  english: shriradhastotram brahmeshasheshadikritam || atha brahmeshasheshadikritam shriradhastotram ||
    shashtivarshasahasrani divyani parameshvari | pushkare ca tapastaptam punyakshetre ca bharate || 1
    || tvatpadapadmamadhuramadhulubdhena cetasa | madhuvratena lobhena preritena maya sati || 2 || tathapi
    na maya labdham tvadpadapadamipsitam | na drishtamapi svapne'pi jata vagasharirini || 3 || varahe
    bharate varshe punye vrindavane vane | siddhashrame ganeshasya padapadmam ca drakshyasi || 4 || radhamadhavayordasyam
    kuto vishayinastava | nivartasva mahabhaga parametat sudurlabham || 5 || iti shrutva nivritto'ham
    kuto vishayinastava | nivartasva mahabhaga parametat sudurlabham || 6 || shrimahadeva uvaca | padmaih
    padmarcitam padapadmam yasya sudurlabham | dhyayante dhyananishtashca shashvad brahmadayah surah ||
    7 || munayo manavashcaiva siddhah santashca yoginah | drashtum naiva kshamah svapne bhavati tasya
    vakshasi || 8 || anata uvaca | vedashca vedamata ca puranani ca suvrate | aham sarasvati santah stotum
    nalam ca santatam || 9 || asmakam stavane yasya bhrabhangashca sudurlabhabhah | tavaiva bhartsane
    bhitashcavayorantaram harih || 10 || || iti shribrahmavaivarte brahmeshasheshadikritam shriradhastotram
    sampurnam ||
  devanagari: श्रीराधास्तोत्रं ब्रह्मेशशेषादिकृतम् ॥ अथ ब्रह्मेशशेषादिकृतम् श्रीराधास्तोत्रम् ॥ षष्टिवर्षसहस्राणि
    दिव्यानि परमेश्वरि । पुष्करे च तपस्तप्तं पुण्यक्षेत्रे च भारते ॥ १ ॥ त्वत्पादपद्ममधुरमधुलुब्धेन चेतसा
    । मधुव्रतेन लोभेन प्रेरितेन मया सति ॥ २ ॥ तथापि न मया लब्धं त्वद्पादपदमीप्सितम् । न दृष्टमपि स्वप्नेऽपि
    जाता वागशरीरिणी ॥ ३ ॥ वाराहे भारते वर्षे पुण्ये वृन्दावने वने । सिद्धाश्रमे गणेशस्य पादपद्मं च द्रक्ष्यसि
    ॥ ४ ॥ राधामाधवयोर्दास्यं कुतो विषयिणस्तव । निवर्तस्व महाभाग परमेतत् सुदुर्लभम् ॥ ५ ॥ इति श्रुत्वा
    निवृत्तोऽहं कुतो विषयिणस्तव । निवर्तस्व महाभाग परमेतत् सुदुर्लभम् ॥ ६ ॥ श्रीमहादेव उवाच । पद्मैः पद्मार्चितं
    पादपद्मं यस्य सुदुर्लभम् । ध्यायन्ते ध्याननिष्टाश्च शश्वद् ब्रह्मादयः सुराः ॥ ७ ॥ मुनयो मनवश्चैव सिद्धाः
    सन्तश्च योगिनः । द्रष्टुं नैव क्षमाः स्वप्ने भवती तस्य वक्षसि ॥ ८ ॥ अनत उवाच । वेदाश्च वेदमाता च पुराणानि
    च सुव्रते । अहं सरस्वती सन्तः स्तोतुं नालं च सन्ततम् ॥ ९ ॥ अस्माकं स्तवने यस्य भ्रभङ्गश्च सुदुर्लभभः
    । तवैव भर्त्सने भीतश्चावयोरन्तरं हरिः ॥ १० ॥ ॥ इति श्रीब्रह्मवैवर्ते ब्रह्मेशशेषादिकृतं श्रीराधास्तोत्रं
    सम्पूर्णम् ॥
