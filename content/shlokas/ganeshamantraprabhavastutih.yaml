id: ganeshamantraprabhavastutih
category: mantra
name:
  english: ganeshamantraprabhavastutih
  devanagari: गणेशमन्त्रप्रभावस्तुतिः
content:
  english: shriganeshamantraprabhavastutih omityadau vedavido yam pravadanti brahmadya yam lokavidhane
    pranamanti | yo'ntaryami pranigananam hridayasthah tam vighnesham duhkhavinasham kalayami || 1|| gangagaurishankarasantoshakavrittam
    gandharvaligitacaritram supavitram | yo devanamadiranadirjagadishah tam vighnesham duhkhavinasham
    kalayami || 2|| gacchetsiddhim yanmanujapi karyanam ganta param samsritisindhoryadvetta | garvagrantheryah
    kila bhetta ganarajah tam vighnesham duhkhavinasham kalayami || 3|| tanyetyuccairvarnajamadau pujartham
    yadyantrantah pashcimakone nirdishtam | bijam dhyatuh pushtidamathvaranavakyaih tam vighnesham duhkhavinasham
    kalayami || 4|| padbhyam padmashrimadahridbhyam pratyushe muladharambhoruha bhasvadbhanubhyam | yogi
    yasya pratyahamajaparpanadakshah tam vighnesham duhkhavinasham kalayami || 5|| tattvam yasya shrutiguruvakyairadhigatya
    jnani prarabdhanubhavante nijadhama | shantavidyastatkritabodhah svayamiyat tam vighnesham duhkhavinasham
    kalayami || 6|| ye ye bhoga lokahitarthah sapumarthah ye ye yogah sadhyasulokah sukritarthah | te
    sarve syuryanmanujapatah purushanam tam vighnesham duhkhavinasham kalayami || 7|| natva nityam yasya
    padabjam muhurarthi nirdvaitatmakhandasukhah syaddhatamohah | kamanprapnotiti kimashcaryamidanim tam
    vighnesham duhkhavinasham kalayami || 8|| mastaprodyaccandrakishoram karivaktram pustakshasrakpasha
    srinisphitakarabjam | shurpashrotram sundaragatram shivaputram tam vighnesham duhkhavinasham kalayami
    || 9|| siddhantartham siddhiganeshastutimenam subrahmanyahvayasuryuktamanuyuktam | uktva shrutvapekshitakaryam
    nirvighnam muktva moham bodhamupeyattadbhaktah || 10|| iti shrisubrahmanyayogikrita shriganeshamantraprabhavastutih
    samapta |
  devanagari: श्रीगणेशमन्त्रप्रभावस्तुतिः ओमित्यादौ वेदविदो यं प्रवदन्ति ब्रह्माद्या यं लोकविधाने प्रणमन्ति
    । योऽन्तर्यामी प्राणिगणानां हृदयस्थः तं विघ्नेशं दुःखविनाशं कलयामि ॥ १॥ गङ्गागौरीशङ्करसन्तोषकवृत्तं
    गन्धर्वालीगीतचरित्रं सुपवित्रम् । यो देवानामादिरनादिर्जगदीशः तं विघ्नेशं दुःखविनाशं कलयामि ॥ २॥ गच्छेत्सिद्धिं
    यन्मनुजापी कार्याणां गन्ता पारं संसृतिसिन्धोर्यद्वेत्ता । गर्वग्रन्थेर्यः किल भेत्ता गणराजः तं विघ्नेशं
    दुःखविनाशं कलयामि ॥ ३॥ तण्येत्युच्चैर्वर्णजमादौ पूजार्थं यद्यन्त्रान्तः पश्चिमकोणे निर्दिष्टम् । बीजं
    ध्यातुः पुष्टिदमाथ्वरणवाक्यैः तं विघ्नेशं दुःखविनाशं कलयामि ॥ ४॥ पद्भ्यां पद्मश्रीमदहृद्भ्यां प्रत्यूषे
    मूलाधाराम्भोरुह भास्वद्भानुभ्याम् । योगी यस्य प्रत्यहमजपार्पणदक्षः तं विघ्नेशं दुःखविनाशं कलयामि ॥
    ५॥ तत्त्वं यस्य श्रुतिगुरुवाक्यैरधिगत्य ज्ञानी प्रारब्धानुभवान्ते निजधाम । शान्ताविद्यस्तत्कृतबोधः
    स्वयमीयात् तं विघ्नेशं दुःखविनाशं कलयामि ॥ ६॥ ये ये भोगा लोकहितार्थाः सपुमार्थाः ये ये योगाः साध्यसुलोकाः
    सुकृतार्थाः । ते सर्वे स्युर्यन्मनुजपतः पुरुषाणां तं विघ्नेशं दुःखविनाशं कलयामि ॥ ७॥ नत्वा नित्यं
    यस्य पदाब्जं मुहुरर्थी निर्द्वैतात्माखण्डसुखः स्याद्धतमोहः । कामान्प्राप्नोतीति किमाश्चर्यमिदानीं
    तं विघ्नेशं दुःखविनाशं कलयामि ॥ ८॥ मस्तप्रोद्यच्चन्द्रकिशोरं करिवक्त्रं पुस्ताक्षस्रक्पाश सृणीस्फीतकराब्जम्
    । शूर्पश्रोत्रं सुन्दरगात्रं शिवपुत्रं तं विघ्नेशं दुःखविनाशं कलयामि ॥ ९॥ सिद्धान्तार्थां सिद्धिगणेशस्तुतिमेनां
    सुब्रह्मण्याह्वयसूर्युक्तामनुयुक्ताम् । उक्त्वा श्रुत्वापेक्षितकार्यं निर्विघ्नं मुक्त्वा मोहं बोधमुपेयात्तद्भक्तः
    ॥ १०॥ इति श्रीसुब्रह्मण्ययोगिकृता श्रीगणेशमन्त्रप्रभावस्तुतिः समाप्ता ।
