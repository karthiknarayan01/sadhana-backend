id: radhikatrailokyamangalakavacam
category: kavacha
name:
  english: radhikatrailokyamangalakavacam
  devanagari: राधिकात्रैलोक्यमन्गलकवचम्
content:
  english: mahavidya sadhana gopyarthe viniyogah || om purve ca patu sa devi rukmini shubhadayini | hrim
    pashcime patu satya sarvakamaprapurini || 7|| yamyam hrim jambavati patu sarvakamaphalaprada | uttare
    patu bhadra hrim bhadrashaktisamanvita || 8|| urdhvam patu mahadevi klim krishnapriya yashasvini |
    adhashca patu bho devi aim patalatalavasini || 9|| adhare radhika patu aim patu hridayam mama | namah
    patu ca sarvangam neyuta ca punah punah || 10|| sarvatra patu me devi ishvari bhuvaneshvari | aim
    hrim radhikayai hrim aim shirah patu mam || 11|| klim klim radhikayai klim klim dakshabahum rakshatu
    mama | hrim hrim radhikayai hrim hrim vamangam rakshatu padmini padmagandhini || 12|| om hrim radhikayai
    aim aim dakshapadam rakshatu namah | klim klim aim aim radhikayai hrim hrim aim aim klim kalim om
    sarvangam mama rakshatu | hrim radhikayai hrim vamapadam rakshatu sada padmini | hrim radhikayai hrim
    akshiyugma rakshatu mama | aim radhikayai aim karnayugmam sada rakshatu mama | om hrim radhikayai
    hrim om dantapanktim sada patu sarasvati | hrim bhuvaneshvari lalatam patu hrim kali me mukhamandalam
    sadapatu | hrim hrim hrim mahishamardinyai hrim hrim mahishamardini dvarakavasini sahasraram rakshatu
    sada mama | aim hrim aim matangi hridayam sada mama rakshatu | hrim aim hrim ugratara nabhipadma sada
    rakshatu mama | klim aim klim sundari klim aim klim svadhishthanam lingamulam rakshatu mama | lam
    aim lam prithivi gudamandalam rakshatu mama | aim aim aim bagala aim aim aim stanadvayam rakshatu
    mama | hesauh bhairavi hesauh skandhadvayam rakshatu mama | hrim annapurna hrim ghatam rakshatu mama
    | aim hrim aim bijatrayam sada patu prishthadesham mama | om mahadevah patu sarvangam me om narayanah
    patu sarvangam sada mama | om om krishnah patu sada gatram rukmininathah | rukmini satyabhama ca saivya
    jambavati tatha | lakshmishca mitravinda ca bhadra nagnajita tatha || etah sarva yuvatayah shobhanashva
    sulocanah | raksheyurmamastu dikshu satatam shubhadarshanah || om narayanashca govindah shivah padmadalekshanah
    | sarvange me sada rakshet keshavah keshiha harih || padminyah parameshani upavidyasu sangatam ||
    yah pathet pathayedvapi satatam bhaktitatparah | niraharo jalatyagi ayutam vatsare yada || tadaiva
    parameshani padmini vashatamiyat | etatte kathitam devi kavacam bhuvi durlabham || phalamulajalam
    tyaktva pathet samvatsaram yadi | padmini vashamayati tadaiva naganandini || anenaiva vidhanena yah
    pathet kavacam param | vishnulokamavapnoti nanyatha vacanam mama || sangopya pujayedvidya mahavidya
    varanane | prakatarthamidam devi kavacam prapathet sada || mahavidyam vina bhadre yah pathet kavacam
    priye | tadaiva sahasa bhadre kumbhipake vrajet priye || || iti vasudevarahasye radhatantre ekatrimshatpatale
    shriradhikatrailokyamangalakavacam ||
  devanagari: महाविद्या साधन गोप्यर्थे विनियोगः ॥ ॐ पूर्वे च पातु सा देवी रुक्मिणी शुभदायिनी । ह्रीं पश्चिमे
    पातु सत्या सर्वकामप्रपूरिणी ॥ ७॥ याम्यां ह्रीं जाम्बवती पातु सर्वकामफलप्रदा । उत्तरे पातु भद्रा ह्रीं
    भद्रशक्तिसमन्विता ॥ ८॥ ऊर्ध्वं पातु महादेवी क्लीं कृष्णप्रिया यशस्विनी । अधश्च पातु भो देवी ऐं पातालतलवासिनी
    ॥ ९॥ अधरे राधिका पातु ऐं पातु हृदयं मम । नमः पातु च सर्वाङ्गं ङेयुता च पुनः पुनः ॥ १०॥ सर्वत्र पातु
    मे देवी ईश्वरी भुवनेश्वरी । ऐं ह्रीं राधिकायै ह्रीं ऐं शिरः पातु माम् ॥ ११॥ क्लीं क्लीं राधिकायै क्लीं
    क्लीं दक्षबाहुं रक्षतु मम । ह्रीं ह्रीं राधिकायै ह्रीं ह्रीं वामाङ्गं रक्षतु पद्मिनी पद्मगन्धिनी ॥
    १२॥ ॐ ह्रीं राधिकायै ऐं ऐं दक्षपादं रक्षतु नमः । क्लीं क्लीं ऐं ऐं राधिकायै ह्रीं ह्रीं ऐं ऐं क्लीं
    कलीं ॐ सर्वाङ्गं मम रक्षतु । ह्रीं राधिकायै ह्रीं वामपादं रक्षतु सदा पद्मिनी । ह्रीं राधिकायै ह्रीं
    अक्षियुग्म रक्षतु मम । ऐं राधिकायै ऐं कर्णयुग्मं सदा रक्षतु मम । ॐ ह्रीं राधिकायै ह्रीं ॐ दन्तपङ्क्तिं
    सदा पातु सरस्वती । ह्रीं भुवनेश्वरी ललाटं पातु ह्रीं काली मे मुखमण्डलं सदापातु । ह्रीं ह्रीं ह्रीं
    महिषमर्दिन्यै ह्रीं ह्रीं महिषमर्दिनी द्वारकावासिनी सहस्रारं रक्षतु सदा मम । ऐं ह्रीं ऐं मातङ्गी हृदयं
    सदा मम रक्षतु । ह्रीं ऐं ह्रीं उग्रतारा नाभिपद्म सदा रक्षतु मम । क्लीं ऐं क्लीं सुन्दरी क्लीं ऐं क्लीं
    स्वाधिष्ठानं लिङ्गमूलं रक्षतु मम । लं ऐं लं पृथिवी गुदमण्डलं रक्षतु मम । ऐं ऐं ऐं बगला ऐं ऐं ऐं स्तनद्वयं
    रक्षतु मम । हेसौः भैरवी हेसौः स्कन्धद्वयं रक्षतु मम । ह्रीं अन्नपूर्णा ह्रीं घाटां रक्षतु मम । ऐं
    ह्रीं ऐं बीजत्रयं सदा पातु पृष्ठदेशं मम । ॐ महादेवः पातु सर्वाङ्गं मे ॐ नारायणः पातु सर्वाङ्गं सदा
    मम । ॐ ॐ कृष्णः पातु सदा गात्रं रुक्मिणीनाथः । रुक्मिणी सत्यभामा च सैव्या जाम्बवती तथा । लक्ष्मीश्च
    मित्रविन्दा च भद्रा नाग्नजिता तथा ॥ एताः सर्वा युवतयः शोभनाश्वा सुलोचनाः । रक्षेयुर्मामस्तु दिक्षु
    सततं शुभदर्शनाः ॥ ॐ नारायणश्च गोविन्दः शिवः पद्मदलेक्षणः । सर्वाङ्गे मे सदा रक्षेत् केशवः केशिहा हरिः
    ॥ पद्मिन्याः परमेशानि उपविद्यासु सङ्गतम् ॥ यः पठेत् पाठयेद्वापि सततं भक्तितत्परः । निराहरो जलत्यागी
    अयुतं वत्सरे यदा ॥ तदैव परमेशानि पद्मिनी वशतामियात् । एतत्ते कथितं देवि कवचं भुवि दुर्लभम् ॥ फलमूलजलं
    त्यक्त्वा पठेत् संवत्सरं यदि । पद्मिनी वशमायाति तदैव नगनन्दिनि ॥ अनेनैव विधानेन यः पठेत् कवचं परम्
    । विष्णुलोकमवाप्नोति नान्यथा वचनं मम ॥ सङ्गोप्य पूजयेद्विद्या महाविद्या वरानने । प्रकटार्थमिदं देवि
    कवचं प्रपठेत् सदा ॥ महाविद्यां विना भद्रे यः पठेत् कवचं प्रिये । तदैव सहसा भद्रे कुम्भीपाके व्रजेत्
    प्रिये ॥ ॥ इति वासुदेवरहस्ये राधातन्त्रे एकत्रिंशत्पटले श्रीराधिकात्रैलोक्यमङ्गलकवचम् ॥
