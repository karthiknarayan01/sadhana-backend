id: praneshvarashrikrishnamantrah
category: mantra
name:
  english: praneshvarashrikrishnamantrah
  devanagari: प्राणेश्वरश्रीकृष्णमन्त्रः
content:
  english: praneshvarashrikrishnamantrah || viniyogah || om asya shripraneshvarashrikrishnamantrasya bhagavan
    shrivedavyasa rishih | gayatri chandah | shrikrishnaparamatma devata | klim bijam | shrim shaktih
    | aim kilakam | om vyapakah | mama samastakleshapariharartham caturvargapraptaye saubhagyavriddhyartham
    ca jape viniyogah || || rishyadinyasah || shrivedavyasarishaye namah shirasi | gayatrichandase namah
    mukhe | shrikrishnaparamatmadevatayai namah hridi | klim bijaya namah guhye | shrim shaktaye namah
    nabhau | aim kilakaya namah padayoh | om vyapakaya namah sarvange | mama samastakleshapariharartham
    caturvargapraptaye saubhagyavriddhyartham ca jape viniyogaya namah anjalau || || karanyasah || om
    aim shrim klim angushthabhyam namah | pranavallabhaya tarjanibhyam svaha | sauh madhyamabhyam vashat
    | saubhagyadaya anamikabhyam hum | shrikrishnaya kanishthikabhyam vaushat | svaha karatalakaraprishthabhyam
    phat || || anganyasah || om aim shrim klim hridayaya namah | pranavallabhaya shirase svaha | sauh
    shikhayai vashat | saubhagyadaya kavacaya hum | shrikrishnaya netratrayaya vaushat | svaha astraya
    phat || || dhyanam || krishnam jaganmohanarupavarnam vilokya lajjakulitam smaradhyam | madhukamalayutakrishnadeham
    vilokya cashlishya harim smarantim || navambudashyamatanum manojnam pitambaram kundaladiptagandam
    | radhankasamlagnamanantalilam vande mukundam pranavallabham tam || || mantrah || om aim shrim klim
    pranavallabhaya sauh saubhagyadaya shrikrishnaya svaha || iti shripraneshvarashrikrishnamantrah sampurnah
    |
  devanagari: प्राणेश्वरश्रीकृष्णमन्त्रः ॥ विनियोगः ॥ ॐ अस्य श्रीप्राणेश्वरश्रीकृष्णमन्त्रस्य भगवान् श्रीवेदव्यास
    ऋषिः । गायत्री छन्दः । श्रीकृष्णपरमात्मा देवता । क्लीं बीजम् । श्रीं शक्तिः । ऐं कीलकम् । ॐ व्यापकः
    । मम समस्तक्लेशपरिहारार्थं चतुर्वर्गप्राप्तये सौभाग्यवृद्ध्यर्थं च जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः
    ॥ श्रीवेदव्यासऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीकृष्णपरमात्मदेवतायै नमः हृदि । क्लीं बीजाय
    नमः गुह्ये । श्रीं शक्तये नमः नाभौ । ऐं कीलकाय नमः पादयोः । ॐ व्यापकाय नमः सर्वाङ्गे । मम समस्तक्लेशपरिहारार्थं
    चतुर्वर्गप्राप्तये सौभाग्यवृद्ध्यर्थं च जपे विनियोगाय नमः अञ्जलौ ॥ ॥ करन्यासः ॥ ॐ ऐं श्रीं क्लीं अङ्गुष्ठाभ्यां
    नमः । प्राणवल्लभाय तर्जनीभ्यां स्वाहा । सौः मध्यमाभ्यां वषट् । सौभाग्यदाय अनामिकाभ्यां हुं । श्रीकृष्णाय
    कनिष्ठिकाभ्यां वौषट् । स्वाहा करतलकरपृष्ठाभ्यां फट् ॥ ॥ अङ्गन्यासः ॥ ॐ ऐं श्रीं क्लीं हृदयाय नमः ।
    प्राणवल्लभाय शिरसे स्वाहा । सौः शिखायै वषट् । सौभाग्यदाय कवचाय हुं । श्रीकृष्णाय नेत्रत्रयाय वौषट्
    । स्वाहा अस्त्राय फट् ॥ ॥ ध्यानम् ॥ कृष्णं जगन्मोहनरूपवर्णं विलोक्य लज्जाकुलितां स्मराढ्याम् । मधूकमालायुतकृष्णदेहं
    विलोक्य चाश्लिष्य हरिं स्मरन्तीम् ॥ नवाम्बुदश्यामतनुं मनोज्ञं पीताम्बरं कुण्डलदीप्तगण्डम् । राधाङ्कसंलग्नमनन्तलीलं
    वन्दे मुकुन्दं प्राणवल्लभं तम् ॥ ॥ मन्त्रः ॥ ॐ ऐं श्रीं क्लीं प्राणवल्लभाय सौः सौभाग्यदाय श्रीकृष्णाय
    स्वाहा ॥ इति श्रीप्राणेश्वरश्रीकृष्णमन्त्रः सम्पूर्णः ।
