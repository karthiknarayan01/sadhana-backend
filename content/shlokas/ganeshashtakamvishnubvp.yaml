id: ganeshashtakamvishnubvp
category: stotram
name:
  english: ganeshashtakamvishnuBVP
  devanagari: गणेशाष्टकम्विष्णुBVP
content:
  english: rinu matarharapriye | stotranam sarabhutam ca sarvavighnaharam param || jnanarthavacako gashca
    nashca nirvanavacakah | tayorisham param brahma ganesham pranamamyaham || 1|| ekashabdah pradhanartho
    dantashca balavacakah | balam pradhanam sarvasmadekadantam namamyaham || 2|| dinarthavacako heshca
    rambah palakavacakah | palakam dinalokanam herambam pranamamyaham || 3||
  devanagari: ृणु मातर्हरप्रिये । स्तोत्राणां सारभूतं च सर्वविघ्नहरं परम् ॥ ज्ञानार्थवाचको गश्च णश्च निर्वाणवाचकः
    । तयोरीशं परं ब्रह्म गणेशं प्रणमाम्यहम् ॥ १॥ एकशब्दः प्रधानार्थो दन्तश्च बलवाचकः । बलं प्रधानं सर्वस्मादेकदन्तं
    नमाम्यहम् ॥ २॥ दीनार्थवाचको हेश्च रम्बः पालकवाचकः । पालकं दीनलोकानां हेरम्बं प्रणमाम्यहम् ॥ ३॥
meaning: {}
