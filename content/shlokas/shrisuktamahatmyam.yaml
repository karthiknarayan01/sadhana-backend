id: shrisuktamahatmyam
category: sukta
name:
  english: shrisuktamahatmyam
  devanagari: श्रीसूक्तमहात्म्यम्
content:
  english: shrisuktena tu padmanam ghritaktanam bhriguttama | ayutam homayedyastu vahnau bhaktiyuto narah
    || 8|| padmahasta ca sa devi tam naram tupatishtati | dashayutam tu padmanam juhuyadyastatha jale
    || 9||
  devanagari: श्रीसूक्तेन तु पद्मानां घृताक्तानां भृगूत्तम । अयुतं होमयेद्यस्तु वह्नौ भक्तियुतो नरः ॥
    ८॥ पद्महस्ता च सा देवी तं नरं तूपतिष्टति । दशायुतं तु पद्मानां जुहुयाद्यस्तथा जले ॥ ९॥
meaning: {}
