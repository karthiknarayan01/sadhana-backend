id: subhashitaratnakoshah-14-madanavrajya
category: subhashita
name:
  english: subhashitaratnakoshah/14 madanavrajya
  devanagari: सुभाषितरत्नकोशः/१४ मदनव्रज्या
content:
  english: nilapatahasya bhrusharngakrishtamuktah kuvalayamadhupastomalakshmimusho ye kshepiyah krishnasara
    narahridayabhidas taravakrurashalyah | te dirghapangapunkhah smitavishavishamah pakshmalah strikatakshah
    payasur vo'tiviryas tribhuvanajayinah pancabanasya banah 14
  devanagari: नीलपटहस्य भ्रूशार्ङ्गाकृष्टमुक्ताः कुवलयमधुपस्तोमलक्ष्मीमुषो ये क्षेपीयाः कृष्णसारा नरहृदयभिदस्
    तारवक्रूरशल्याः । ते दीर्घापाङ्गपुङ्खाः स्मितविषविषमाः पक्ष्मलाः स्त्रीकटाक्षाः पायासुर् वोऽतिवीर्यास्
    त्रिभुवनजयिनः पञ्चबाणस्य बाणाः १४
meaning: {}
