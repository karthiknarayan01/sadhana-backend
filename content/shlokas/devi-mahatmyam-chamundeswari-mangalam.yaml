id: devi-mahatmyam-chamundeswari-mangalam
category: stotram
name:
  english: Devi Mahatmyam Chamundeswari Mangalam
content:
  english: shri shailaraja tanaye canda munda nishudini mrigendra vahane tubhyam camundayai sumangalam|
    | panca vimshati saladya shri cakrapura nivasini bindupitha sthitè tubhyam camundayai sumangalam||
    || raja rajeshvari shrimad kameshvara kutumbinim yuga nadha tate tubhyam camundayai sumangalam|| ||
    mahakali mahalakshmi mahavani manonmani yoganidratmake tubhyam camundayai sumangalam|| || matrini
    dandini mukhya yogini gana sevite| bhanda daitya hare tubhyam camundayai sumangalam|| || nishumbha
    mahisha shumbhe raktabijadi mardini mahamaye shivetubhyam camundayai sumangalam|| kala ratri mahadurge
    narayana sahodari vindhya vasini tubhyam camundayai sumangalam|| candra lekha lasatpale shri madsimhasaneshvari
    kameshvari namastubhyam camundayai sumangalam|| prapanca srishti rakshadi panca karya dhrandhare pancapretasane
    tubhyam camundayai sumangalam|| madhukaitabha samhatrim kadambavana vasini mahendra varade tubhyam
    camundayai sumangalam|| nigamagama samvedye shri devi lalitambike odyana pithagade tubhyam camundayai
    sumangalam|| || pundeshu khanda danda pushpa kantha lasatkare sadashiva kale tubhyam camundayai sumangalam||
    || kamesha bhakta mangalya shrimad tripura sundari| suryagnindu trilocani tubhyam camundayai sumangalam||
    || cidagni kunda sambhute mula prakriti svarupini kandarpa dipake tubhyam camundayai sumangalam||
    || maha padmatavi madhye sadananda dviharini pasankusha dhare tubhyam camundayai sumangalam|| || sarvamantratmike
    prajne sarva yantra svarupini sarvatantratmike tubhyam camundayai sumangalam|| || sarva prani sute
    vase sarva shakti svarupini sarva bhishta prade tubhyam camundayai sumangalam|| || vedamata maharajni
    lakshmi vani vashapriye trailokya vandite tubhyam camundayai sumangalam|| || brahmopendra surendradi
    sampujita padambuje sarvayudha kare tubhyam camundayai sumangalam|| || mahavidhya sampradayai savidhyenija
    vaibahve| sarva mudra kare tubhyam camundayai sumangalam|| || eka pancashate pithe nivasatma vilasini
    apara mahime tubhyam camundayai sumangalam|| || tejo mayidayapurne saccidananda rupini sarva varnatmike
    tubhyam camundayai sumangalam|| || hamsarudhe catuvaktre brahmi rupa samanvite dhumrakshas hantrike
    tubhyam camundayai sumangalam|| || mahesvari svarupayai pancasyai vrishabhavahane| sugriva pancike
    tubhyam camundayai sumangalam|| || mayura vahe sht vaktre ka'umari rupa shobhite shakti yukta kare
    tubhyam camundayai sumangalam|| pakshiraja samarudhe shankha cakra lasatkare| vaishnavi sanjnike tubhyam
    camundayai sumangalam|| varahi mahisharudhe ghora rupa samanvite damshtrayudha dharè tubhyam camundayai
    sumangalam|| gajendra vahana rudhe indrani rupa vasure vajrayudha karè tubhyam camundayai sumangalam||
    caturbhujè simha vahe jata mandila mandite candikè shubhage tubhyam camundayai sumangalam|| damshtra
    karala vadane simha vaktrè caturbhuje narasimhi sada tubhyam camundayai sumangalam|| jvala jihva karalasye
    candakopa samanvite jvala malini tubhyam camundayai sumangalam|| bhrigine darshitatmiya prabhave paramesvari
    nana rupa dhare tubhya camundayai sumangalam|| ganesha skanda janani matangi bhuvaneshvari bhadrakali
    sada tubyam camundayai sumangalam|| agastyaya hayagriva prakati krita vaibhave anantakhya sute tubhyam
    camundayai sumangalam|| ||iti shri camundeshvari mangalam sampurnam||
  devanagari: श्री शैलराज तनये चण्ड मुण्ड निषूदिनी मृगेन्द्र वाहने तुभ्यं चामुण्डायै सुमङ्गलं। । पञ्च
    विंशति सालाड्य श्री चक्रपुर निवासिनी बिन्दुपीठ स्थितॆ तुभ्यं चामुण्डायै सुमङ्गलं॥ ॥ राज राजेश्वरी
    श्रीमद् कामेश्वर कुटुम्बिनीं युग नाध तते तुभ्यं चामुण्डायै सुमङ्गलं॥ ॥ महाकाली महालक्ष्मी महावाणी
    मनोन्मणी योगनिद्रात्मके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ मत्रिनी दण्डिनी मुख्य योगिनी गण सेविते। भण्ड
    दैत्य हरे तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ निशुम्भ महिषा शुम्भे रक्तबीजादि मर्दिनी महामाये शिवेतुभ्यं
    चामूण्डायै सुमङ्गलं॥ काल रात्रि महादुर्गे नारायण सहोदरी विन्ध्य वासिनी तुभ्यं चामूण्डायै सुमङ्गलं॥
    चन्द्र लेखा लसत्पाले श्री मद्सिंहासनेश्वरी कामेश्वरी नमस्तुभ्यं चामूण्डायै सुमङ्गलं॥ प्रपञ्च सृष्टि
    रक्षादि पञ्च कार्य ध्रन्धरे पञ्चप्रेतासने तुभ्यं चामूण्डायै सुमङ्गलं॥ मधुकैटभ संहत्रीं कदम्बवन वासिनी
    महेन्द्र वरदे तुभ्यं चामूण्डायै सुमङ्गलं॥ निगमागम संवेद्ये श्री देवी ललिताम्बिके ओड्याण पीठगदे तुभ्यं
    चामूण्डायै सुमङ्गलं॥ ॥ पुण्देषु खण्ड दण्ड पुष्प कण्ठ लसत्करे सदाशिव कले तुभ्यं चामूण्डायै सुमङ्गलं॥
    ॥ कामेश भक्त माङ्गल्य श्रीमद् त्रिपुर सुन्दरी। सूर्याग्निन्दु त्रिलोचनी तुभ्यं चामूण्डायै सुमङ्गलं॥
    ॥ चिदग्नि कुण्ड सम्भूते मूल प्रकृति स्वरूपिणी कन्दर्प दीपके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ महा पद्माटवी
    मध्ये सदानन्द द्विहारिणी पासाङ्कुश धरे तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ सर्वमन्त्रात्मिके प्राज्ञे सर्व
    यन्त्र स्वरूपिणी सर्वतन्त्रात्मिके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ सर्व प्राणि सुते वासे सर्व शक्ति
    स्वरूपिणी सर्वा भिष्ट प्रदे तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ वेदमात महाराज्ञी लक्ष्मी वाणी वशप्रिये त्रैलोक्य
    वन्दिते तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ ब्रह्मोपेन्द्र सुरेन्द्रादि सम्पूजित पदाम्बुजे सर्वायुध करे
    तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ महाविध्या सम्प्रदायै सविध्येनिज वैबह्वे। सर्व मुद्रा करे तुभ्यं चामूण्डायै
    सुमङ्गलं॥ ॥ एक पञ्चाशते पीठे निवासात्म विलासिनी अपार महिमे तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ तेजो मयीदयापूर्णे
    सच्चिदानन्द रूपिणी सर्व वर्णात्मिके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ हंसारूढे चतुवक्त्रे ब्राह्मी रूप
    समन्विते धूम्राक्षस् हन्त्रिके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ माहेस्वरी स्वरूपयै पञ्चास्यै वृषभवाहने।
    सुग्रीव पञ्चिके तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥ मयूर वाहे ष्ट् वक्त्रे कऽउमरी रूप शोभिते शक्ति युक्त
    करे तुभ्यं चामूण्डायै सुमङ्गलं॥ पक्षिराज समारूढे शङ्ख चक्र लसत्करे। वैष्नवी सञ्ज्ञिके तुभ्यं चामूण्डायै
    सुमङ्गलं॥ वाराही महिषारूढे घोर रूप समन्विते दंष्त्रायुध धरॆ तुभ्यं चामूण्डायै सुमङ्गलं॥ गजेन्द्र वाहना
    रुढे इन्द्राणी रूप वासुरे वज्रायुध करॆ तुभ्यं चामूण्डायै सुमङ्गलं॥ चतुर्भुजॆ सिंह वाहे जता मण्डिल
    मण्डिते चण्डिकॆ शुभगे तुभ्यं चामूण्डायै सुमङ्गलं॥ दंश्ट्रा कराल वदने सिंह वक्त्रॆ चतुर्भुजे नारसिंही
    सदा तुभ्यं चामूण्डायै सुमङ्गलं॥ ज्वल जिह्वा करालास्ये चण्डकोप समन्विते ज्वाला मालिनी तुभ्यं चामूण्डायै
    सुमङ्गलं॥ भृगिणे दर्शितात्मीय प्रभावे परमेस्वरी नन रूप धरे तुभ्य चामूण्डायै सुमङ्गलं॥ गणेश स्कन्द
    जननी मातङ्गी भुवनेश्वरी भद्रकाली सदा तुब्यं चामूण्डायै सुमङ्गलं॥ अगस्त्याय हयग्रीव प्रकटी कृत वैभवे
    अनन्ताख्य सुते तुभ्यं चामूण्डायै सुमङ्गलं॥ ॥इति श्री चामुण्डेश्वरी मङ्गलं सम्पूर्णं॥
