id: viprakritam1vishnustotram
category: stotram
name:
  english: viprakritam1vishnustotram
  devanagari: विप्रकृतं१विष्णुस्तोत्रम्
content:
  english: viprakritam 1 vishnustotram tam drishtva bhaktimandevam stotukamo vyavasthitah | jayesha jaya
    vagisha jaya divyangabhushana || 25|| jaya devapate shrimansakshadbrahma sanatana | tava lokah sharirasthastvam
    gatih parameshvara || 26|| tvadadhara hi devesha sarve loka vyavasthitah | tvam shreshthah sarvasattvanam
    tvam karta dharanidharah || 27|| tvam hautramagnihotranam sutramantrastvameva ca | gokarnam bhadrakarnam
    ca tvam ca maheshvaram padam || 28|| tvam kirtih sarvakirtinam dainyapapapranashini | tvam naimisham
    kurukshetram tvam ca vishnupadam param || 29|| tvaya tu lilaya deva padakranta ca medini | tvaya baddho
    balirdeva tvayendrasya padam kritam || 30|| tvam kalirdvaparam deva treta kritayugam tatha | pralambadamanashca
    tvam srashta tvam ca vinashakrit || 31|| tvaya vai dharyate lokastvam kalah sarvasankshayah | tvaya
    hi deva srishtastah sarva vai devayonayah || 32|| tvam panthah sarvalokanam tvam ca mokshah para gatih
    | brahma tvadudbhavo devo rajorupah sanatanah | rudrah krodhodbhavo'pyevam tvam ca sattve vyavasthitah
    || 33|| etaccaracaram deva kridanartham tvaya kritam | iti shriskandapurane avantyakhande revakhande
    vimshadhyayantargatam viprakritam vishnustotram samaptam | skandapurana | avantyakhanda | revakhanda
    | adhyaya 20
  devanagari: विप्रकृतं १ विष्णुस्तोत्रम् तं दृष्ट्वा भक्तिमान्देवं स्तोतुकामो व्यवस्थितः । जयेश जय वागीश
    जय दिव्याङ्गभूषण ॥ २५॥ जय देवपते श्रीमन्साक्षाद्ब्रह्म सनातन । तव लोकाः शरीरस्थास्त्वं गतिः परमेश्वर
    ॥ २६॥ त्वदाधारा हि देवेश सर्वे लोका व्यवस्थिताः । त्वं श्रेष्ठः सर्वसत्त्वानां त्वं कर्ता धरणीधरः
    ॥ २७॥ त्वं हौत्रमग्निहोत्राणां सूत्रमन्त्रस्त्वमेव च । गोकर्णं भद्रकर्णं च त्वं च माहेश्वरं पदम् ॥
    २८॥ त्वं कीर्तिः सर्वकीर्तीनां दैन्यपापप्रणाशिनी । त्वं नैमिषं कुरुक्षेत्रं त्वं च विष्णुपदं परम्
    ॥ २९॥ त्वया तु लीलया देव पदाक्रान्ता च मेदिनी । त्वया बद्धो बलिर्देव त्वयेन्द्रस्य पदं कृतम् ॥ ३०॥
    त्वं कलिर्द्वापरं देव त्रेता कृतयुगं तथा । प्रलम्बदमनश्च त्वं स्रष्टा त्वं च विनाशकृत् ॥ ३१॥ त्वया
    वै धार्यते लोकास्त्वं कालः सर्वसङ्क्षयः । त्वया हि देव सृष्टास्ताः सर्वा वै देवयोनयः ॥ ३२॥ त्वं पन्थाः
    सर्वलोकानां त्वं च मोक्षः परा गतिः । ब्रह्मा त्वदुद्भवो देवो रजोरूपः सनातनः । रुद्रः क्रोधोद्भवोऽप्येवं
    त्वं च सत्त्वे व्यवस्थितः ॥ ३३॥ एतच्चराचरं देव क्रीडनार्थं त्वया कृतम् । इति श्रीस्कन्दपुराणे आवन्त्यखण्डे
    रेवाखण्डे विंशाध्यायान्तर्गतं विप्रकृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । रेवाखण्ड
    । अध्याय २०
