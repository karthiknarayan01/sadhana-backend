id: kamakritamshivastotram
category: stotram
name:
  english: kamakritamshivastotram
  devanagari: कामकृतंशिवस्तोत्रम्
content:
  english: kamakritam shivastotram parvatya vasatah sarddham kamo drishtipatham yayau | vayurupah shivam
    drishtva kamah provaca shankaram || 33|| namaste sarvarupaya namaste vrishabhadhvaja | namaste gananathaya
    pahi natha namo'stu te || 34|| tvaya virahitam lokam shavavatsprishate mahi | na tvaya rahitam kinciddrishyate
    sacaracare || 35|| tvam gopta tvam vidhata ca lokasamharakarakah | kripam kuru mahadeva dehadanam
    prayaccha me || 36|| iti shriskandapurane nagarakhande pancacatvarimshadhikadvishatatamadhyayantargatam
    kamakritam shivastotram samaptam | skandapurana | nagarakhanda | adhyaya 245
  devanagari: कामकृतं शिवस्तोत्रम् पार्वत्या वसतः सार्द्धं कामो दृष्टिपथं ययौ । वायुरूपः शिवं दृष्ट्वा
    कामः प्रोवाच शङ्करम् ॥ ३३॥ नमस्ते सर्वरूपाय नमस्ते वृषभध्वज । नमस्ते गणनाथाय पाहि नाथ नमोऽस्तु ते
    ॥ ३४॥ त्वया विरहितं लोकं शववत्स्पृशते मही । न त्वया रहितं किञ्चिद्दृश्यते सचराचरे ॥ ३५॥ त्वं गोप्ता
    त्वं विधाता च लोकसंहारकारकः । कृपां कुरु महादेव देहदानं प्रयच्छ मे ॥ ३६॥ इति श्रीस्कन्दपुराणे नागरखण्डे
    पञ्चचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं कामकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय
    २४५
meaning: {}
