id: cidambarastutih
category: stotram
name:
  english: cidambarastutih
  devanagari: चिदम्बरस्तुतिः
content:
  english: 92 cidambarasya cinta no jadym hritva vyadarshayat | sarvavyapakatam tacca cintaniyam cidambaram
    || 1|| udayastamaya bhava sati citsvaprabhadvaya | ambarabha sukha tacca cintaniyam cidambaram ||
    2|| sukham nityam nirutkarsham bhumaiva nirupadhikam | svarupameva yattacca cintaniyam cidambaram
    || 3|| payadambaralingam no yaccidambaranamakam | sheshashayiprabhritipundoshaharisuravritam || 4||
    iti shrivasudevanandasarasvativiracita cidambarastutih samapta |
  devanagari: ९२ चिदम्बरस्य चिन्ता नो जाड्य्ं हृत्वा व्यदर्शयत् । सर्वव्यापकतां तच्च चिन्तनीयं चिदम्बरम्
    ॥ १॥ उदयास्तमया भावा सती चित्स्वप्रभाद्वया । अम्बराभा सुखा तच्च चिन्तनीयं चिदम्बरम् ॥ २॥ सुखं नित्यं
    निरुत्कर्षं भूमैव निरुपाधिकम् । स्वरूपमेव यत्तच्च चिन्तनीयं चिदम्बरम् ॥ ३॥ पायादम्बरलिङ्गं नो यच्चिदम्बरनामकम्
    । शेषशायिप्रभृतिपुन्दोषहारिसुरावृतम् ॥ ४॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिता चिदम्बरस्तुतिः समाप्ता
    ।
