id: annamayya-keerthanas-maccha-kurma-varaha
category: stotram
name:
  english: Annamayya Keerthanas Maccha Kurma Varaha
content:
  english: macca kurma varaha manushya simha vamana yicca rama rama rama hita budhdha kaliki || nannugavu
    keshava narayana madhava mannincu govinda vishnu madhusudana | vannèla trivikrama vamana shridhara
    sannutince hrishikesha saraku padmanabha || kantimi damodara sankarshana vasudeva antejalu pradyumnuda
    anirudhdhuda | tònte purushottama athokshaja narasimhama jantavayuku macyuta janardana || mòkkemu
    vupendra hari mohana shrikrishnaraya yèkkiti shrivenkata mindiranatha | yikkuva ni namamulu yiviye
    na japamulu cakkaga ni dasulamu sarvesha ananta ||
  devanagari: मच्च कूर्म वराह मनुष्य सिंह वामना यिच्च राम राम राम हित बुध्ध कलिकी ॥ नन्नुगावु केशव नारायण
    माधव मन्निञ्चु गोविन्द विष्णु मधुसूदन । वन्नॆल त्रिविक्रम वामना श्रीधरा सन्नुतिञ्चे हृषिकेश सारकु
    पद्मनाभ ॥ कण्टिमि दामोदर सङ्कर्षण वासुदेव अण्टेजालु प्रद्युम्नुडा अनिरुध्धुडा । तॊण्टे पुरुषोत्तम
    अथोक्षजा नारसिंहमा जण्टवायुकु मच्युत जनार्दन ॥ मॊक्केमु वुपेन्द्र हरि मोहन श्रीकृष्णराय यॆक्किति श्रीवेङ्कट
    मिन्दिरानाथ । यिक्कुव नी नाममुलु यिविये ना जपमुलु चक्कगा नी दासुलमु सर्वेश अनन्त ॥
