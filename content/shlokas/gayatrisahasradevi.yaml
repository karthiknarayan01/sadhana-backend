id: gayatrisahasradevi
category: stotram
name:
  english: gayatrisahasradevi
  devanagari: गायत्रिसहस्रदेवि
content:
  english: pattipashadhara panktih pitrilokapradayini | purani punyashila ca pranatartivinashini || 97||
    pradyumnajanani pushta pitamahaparigraha | pundarikapuravasa pundarikasamanana || 98|| prithujangha
    prithubhuja prithupada prithudari | pravalashobha pingakshi pitavasah pracapala || 99|| prasava pushtida
    punya pratishtha pranavagatih | pancavarna pancavani pancika panjarasthita || 100|| paramaya parajyotih
    parapritih paragatih | parakashtha pareshani pavini pavakadyutih || 101|| punyabhadra paricchedya
    pushpahasa prithudari | pitangi pitavasana pitashayya pishacini || 102|| pitakriya pishacaghni patalakshi
    patukriya | pancabhakshapriyacara putanapranaghatini || 103|| punnagavanamadhyastha punyatirthanishevita
    | pancangi ca parashaktih paramahladakarini || 104|| pushpakandasthita pusha poshitakhilavishtapa
    | panapriya pancashikha pannagoparishayini || 105|| pancamatratmika prithvi pathika prithudohini |
    purananyayamimamsa patali pushpagandhini || 106|| punyapraja paradatri paramargaikagocara | pravalashobha
    purnasha pranava pallavodari || 107|| phalini phalada phalguh phutkari phalakakritih | phanindrabhogashayana
    phanimandalamandita || 108|| balabala bahumata balatapanibhamshuka | balabhadrapriya vandya vadava
    buddhisamstuta || 109|| bandidevi bilavati badishaghni balipriya | bandhavi bodhita buddhirbandhukakusumapriya
    || 110|| balabhanuprabhakara brahmi brahmanadevata | brihaspatistuta vrinda vrindavanaviharini ||
    111|| balakini bilahara bilavasa bahudaka | bahunetra bahupada bahukarnavatamsika || 112|| bahubahuyuta
    bijarupini bahurupini | bindunadakalatita bindunadasvarupini || 113|| baddhagodhangulitrana badaryashramavasini
    | vrindaraka brihatskandha brihati banapatini || 114|| vrindadhyaksha bahunuta vanita bahuvikrama
    | baddhapadmasanasina bilvapatratalasthita || 115|| bodhidrumanijavasa badistha bindudarpana | bala
    banasanavati vadavanalavegini || 116|| brahmandabahirantahstha brahmakankanasutrini | bhavani bhishanavati
    bhavini bhayaharini || 117|| bhadrakali bhujangakshi bharati bharatashaya | bhairavi bhishanakara
    bhutida bhutimalini || 118|| bhamini bhoganirata bhadrada bhurivikrama | bhutavasa bhrigulata bhargavi
    bhusurarcita || 119|| bhagirathi bhogavati bhavanastha bhishagvara | bhamini bhogini bhasha bhavani
    bhuridakshina || 120|| bhargatmika bhimavati bhavabandhavimocini | bhajaniya bhutadhatriranjita bhuvaneshvari
    || 121|| bhujangavalaya bhima bherunda bhagadheyini | mata maya madhumati madhujihva madhupriya ||
    122|| mahadevi mahabhaga malini minalocana | mayatita madhumati madhumamsa madhudrava || 123|| manavi
    madhusambhuta mithilapuravasini | madhukaitabhasamhartri medini meghamalini || 124|| mandodari mahamaya
    maithili masrinapriya | mahalakshmirmahakali mahakanya maheshvari || 125|| mahendri merutanaya mandarakusumarcita
    | manjumanjiracarana mokshada manjubhashini || 126|| madhuradravini mudra malaya malayanvita | medha
    marakatashyama magadhi menakatmaja || 127|| mahamari mahavira mahashyama manustuta | matrika mihirabhasa
    mukundapadavikrama || 128|| muladharasthita mugdha manipurakavasini | mrigakshi mahisharudha mahishasuramardini
    || 129|| yogasana yogagamya yoga yauvanakashraya | yauvani yuddhamadhyastha yamuna yugadharini ||
    130|| yakshini yogayukta ca yaksharajaprasutini | yatra yanavidhanajna yaduvamshasamudbhava || 131||
    yakaradihakaranta yajushi yajnarupini | yamini yoganirata yatudhanabhayankari || 132|| rukmini ramani
    rama revati renuka ratih | raudri raudrapriyakara ramamata ratipriya || 133|| rohini rajyada reva
    rama rajivalocana | rakeshi rupasampanna ratnasimhasanasthita || 134|| raktamalyambaradhara raktagandhanulepana
    | rajahamsasamarudha rambha raktabalipriya || 135|| ramaniyayugadhara rajitakhilabhutala | rurucarmaparidhana
    rathini ratnamalika || 136|| rogeshi rogashamani ravini romaharshini | ramacandrapadakranta ravanacchedakarini
    || 137|| ratnavastraparicchanna rathastha rukmabhushana | lajjadhidevata lola lalita lingadharini
    || 138|| lakshmirlola luptavisha lokini lokavishruta | lajja lambodari devi lalana lokadharini ||
    139|| varada vandita vidya vaishnavi vimalakritih | varahi viraja varsha varalakshmirvilasini || 140||
    vinata vyomamadhyastha varijasanasamsthita | varuni venusambhuta vitihotra virupini || 141|| vayumandalamadhyastha
    vishnurupa vidhipriya | vishnupatni vishnumati vishalakshi vasundhara || 142|| vamadevapriya vela
    vajrini vasudohini | vedaksharaparitangi vajapeyaphalaprada || 143|| vasavi vamajanani vaikunthanilaya
    vara | vyasapriya varmadhara valmikiparisevita || 144|| shakambhari shiva shanta sharada sharanagatih
    | shatodari shubhacara shumbhasuravimardini || 145|| shobhavati shivakara shamkarardhasharirini |
    shona shubhashaya shubhra shirahsandhanakarini || 146|| sharavati sharananda sharajjyotsna shubhanana
    | sharabha shulini shuddha shabari shukavahana || 147|| shrimati shridharananda shravananandadayini
    | sharvani sharvarivandya shadbhasha shadritupriya || 148|| shadadharasthita devi shanmukhapriyakarini
    | shadangarupasumatisurasuranamaskrita || 149|| sarasvati sadadhara sarvamangalakarini | samaganapriya
    sukshma savitri samasambhava || 150|| sarvavasa sadananda sustani sagarambara | sarvaishvaryapriya
    siddhih sadhubandhuparakrama || 151|| saptarshimandalagata somamandalavasini | sarvajna sandrakaruna
    samanadhikavarjita || 152|| sarvottunga sangahina sadguna sakaleshtada | saragha suryatanaya sukeshi
    somasamhatih || 153|| hiranyavarna harini hrimkari hamsavahini | kshaumavastraparitangi kshirabdhitanaya
    kshama || 154|| gayatri caiva savitri parvati ca sarasvati | vedagarbha vararoha shrigayatri parambika
    || 155|| iti sahasrakam namnam gayatryashcaiva narada | punyadam sarvapapaghnam mahasampattidayakam
    || 156|| evam namani gayatryastoshotpattikarani hi | ashtamyam ca visheshena pathitavyam dvijaih saha
    || 157|| japam kritva homapujadhyanam kritva visheshatah | yasmai kasmai na datavyam gayatryastu visheshatah
    || 158|| subhaktaya sushishyaya vaktavyam bhusuraya vai | bhrashtebhyah sadhakebhyashca bandhavebhyo
    na darshayet || 159|| yadgrihe likhitam shastram bhayam tasya na kasyacit | cancalapi sthira bhutva
    kamala tatra tishthati || 160|| idam rahasyam paramam guhyadguhyataram mahat | punyapradam manushyanam
    daridranam nidhipradam || 161|| mokshapradam mumukshunam kaminam sarvakamadam | rogadvai mucyate rogi
    baddho mucyeta bandhanat || 162|| brahmahatyasurapanasuvarnasteyino narah | gurutalpagato vapi patakanmucyate
    sakrit || 163|| asatpratigrahaccaiva'bhakshyabhakshadvisheshatah | pakhandanrityamukhyebhyah pathanadeva
    mucyate || 164|| idam rahasyamamalam mayoktam padmajodbhava | brahmasayujyadam nrinam satyam santyam
    na samshaya || 165|| || iti shridevibhagavate mahapurane dvadashaskandhe gayatrisahasranama stotrakathanam
    nama shashtho'dhyayah ||
  devanagari: पट्टिपाशधरा पङ्क्तिः पितृलोकप्रदायिनी । पुराणी पुण्यशीला च प्रणतार्तिविनाशिनी ॥ ९७॥ प्रद्युम्नजननी
    पुष्टा पितामहपरिग्रहा । पुण्डरीकपुरावासा पुण्डरीकसमानना ॥ ९८॥ पृथुजङ्घा पृथुभुजा पृथुपादा पृथूदरी
    । प्रवालशोभा पिङ्गाक्षी पीतवासाः प्रचापला ॥ ९९॥ प्रसवा पुष्टिदा पुण्या प्रतिष्ठा प्रणवागतिः । पञ्चवर्णा
    पञ्चवाणी पञ्चिका पञ्जरस्थिता ॥ १००॥ परमाया परज्योतिः परप्रीतिः परागतिः । पराकाष्ठा परेशानी पाविनी
    पावकद्युतिः ॥ १०१॥ पुण्यभद्रा परिच्छेद्या पुष्पहासा पृथूदरी । पीताङ्गी पीतवसना पीतशय्या पिशाचिनी ॥
    १०२॥ पीतक्रिया पिशाचघ्नी पाटलाक्षी पटुक्रिया । पञ्चभक्षप्रियाचारा पूतनाप्राणघातिनी ॥ १०३॥ पुन्नागवनमध्यस्था
    पुण्यतीर्थनिषेविता । पञ्चाङ्गी च पराशक्तिः परमाह्लादकारिणी ॥ १०४॥ पुष्पकाण्डस्थिता पूषा पोषिताखिलविष्टपा
    । पानप्रिया पञ्चशिखा पन्नगोपरिशायिनी ॥ १०५॥ पञ्चमात्रात्मिका पृथ्वी पथिका पृथुदोहिनी । पुराणन्यायमीमांसा
    पाटली पुष्पगन्धिनी ॥ १०६॥ पुण्यप्रजा पारदात्री परमार्गैकगोचरा । प्रवालशोभा पूर्णाशा प्रणवा पल्लवोदरी
    ॥ १०७॥ फलिनी फलदा फल्गुः फूत्कारी फलकाकृतिः । फणीन्द्रभोगशयना फणिमण्डलमण्डिता ॥ १०८॥ बालबाला बहुमता
    बालातपनिभांशुका । बलभद्रप्रिया वन्द्या वडवा बुद्धिसंस्तुता ॥ १०९॥ बन्दीदेवी बिलवती बडिशघ्नी बलिप्रिया
    । बान्धवी बोधिता बुद्धिर्बन्धूककुसुमप्रिया ॥ ११०॥ बालभानुप्रभाकारा ब्राह्मी ब्राह्मणदेवता । बृहस्पतिस्तुता
    वृन्दा वृन्दावनविहारिणी ॥ १११॥ बालाकिनी बिलाहारा बिलवासा बहूदका । बहुनेत्रा बहुपदा बहुकर्णावतंसिका
    ॥ ११२॥ बहुबाहुयुता बीजरूपिणी बहुरूपिणी । बिन्दुनादकलातीता बिन्दुनादस्वरूपिणी ॥ ११३॥ बद्धगोधाङ्गुलित्राणा
    बदर्याश्रमवासिनी । वृन्दारका बृहत्स्कन्धा बृहती बाणपातिनी ॥ ११४॥ वृन्दाध्यक्षा बहुनुता वनिता बहुविक्रमा
    । बद्धपद्मासनासीना बिल्वपत्रतलस्थिता ॥ ११५॥ बोधिद्रुमनिजावासा बडिस्था बिन्दुदर्पणा । बाला बाणासनवती
    वडवानलवेगिनी ॥ ११६॥ ब्रह्माण्डबहिरन्तःस्था ब्रह्मकङ्कणसूत्रिणी । भवानी भीषणवती भाविनी भयहारिणी ॥ ११७॥
    भद्रकाली भुजङ्गाक्षी भारती भारताशया । भैरवी भीषणाकारा भूतिदा भूतिमालिनी ॥ ११८॥ भामिनी भोगनिरता भद्रदा
    भूरिविक्रमा । भूतवासा भृगुलता भार्गवी भूसुरार्चिता ॥ ११९॥ भागीरथी भोगवती भवनस्था भिषग्वरा । भामिनी
    भोगिनी भाषा भवानी भूरिदक्षिणा ॥ १२०॥ भर्गात्मिका भीमवती भवबन्धविमोचिनी । भजनीया भूतधात्रीरञ्जिता भुवनेश्वरी
    ॥ १२१॥ भुजङ्गवलया भीमा भेरुण्डा भागधेयिनी । माता माया मधुमती मधुजिह्वा मधुप्रिया ॥ १२२॥ महादेवी महाभागा
    मालिनी मीनलोचना । मायातीता मधुमती मधुमांसा मधुद्रवा ॥ १२३॥ मानवी मधुसम्भूता मिथिलापुरवासिनी । मधुकैटभसंहर्त्री
    मेदिनी मेघमालिनी ॥ १२४॥ मन्दोदरी महामाया मैथिली मसृणप्रिया । महालक्ष्मीर्महाकाली महाकन्या महेश्वरी
    ॥ १२५॥ माहेन्द्री मेरुतनया मन्दारकुसुमार्चिता । मञ्जुमञ्जीरचरणा मोक्षदा मञ्जुभाषिणी ॥ १२६॥ मधुरद्राविणी
    मुद्रा मलया मलयान्विता । मेधा मरकतश्यामा मागधी मेनकात्मजा ॥ १२७॥ महामारी महावीरा महाश्यामा मनुस्तुता
    । मातृका मिहिराभासा मुकुन्दपदविक्रमा ॥ १२८॥ मूलाधारस्थिता मुग्धा मणिपूरकवासिनी । मृगाक्षी महिषारूढा
    महिषासुरमर्दिनी ॥ १२९॥ योगासना योगगम्या योगा यौवनकाश्रया । यौवनी युद्धमध्यस्था यमुना युगधारिणी ॥ १३०॥
    यक्षिणी योगयुक्ता च यक्षराजप्रसूतिनी । यात्रा यानविधानज्ञा यदुवंशसमुद्भवा ॥ १३१॥ यकारादिहकारान्ता
    याजुषी यज्ञरूपिणी । यामिनी योगनिरता यातुधानभयङ्करी ॥ १३२॥ रुक्मिणी रमणी रामा रेवती रेणुका रतिः । रौद्री
    रौद्रप्रियाकारा राममाता रतिप्रिया ॥ १३३॥ रोहिणी राज्यदा रेवा रमा राजीवलोचना । राकेशी रूपसम्पन्ना रत्नसिंहासनस्थिता
    ॥ १३४॥ रक्तमाल्याम्बरधरा रक्तगन्धानुलेपना । राजहंससमारूढा रम्भा रक्तबलिप्रिया ॥ १३५॥ रमणीययुगाधारा
    राजिताखिलभूतला । रुरुचर्मपरीधाना रथिनी रत्नमालिका ॥ १३६॥ रोगेशी रोगशमनी राविणी रोमहर्षिणी । रामचन्द्रपदाक्रान्ता
    रावणच्छेदकारिणी ॥ १३७॥ रत्नवस्त्रपरिच्छन्ना रथस्था रुक्मभूषणा । लज्जाधिदेवता लोला ललिता लिङ्गधारिणी
    ॥ १३८॥ लक्ष्मीर्लोला लुप्तविषा लोकिनी लोकविश्रुता । लज्जा लम्बोदरी देवी ललना लोकधारिणी ॥ १३९॥ वरदा
    वन्दिता विद्या वैष्णवी विमलाकृतिः । वाराही विरजा वर्षा वरलक्ष्मीर्विलासिनी ॥ १४०॥ विनता व्योममध्यस्था
    वारिजासनसंस्थिता । वारुणी वेणुसम्भूता वीतिहोत्रा विरूपिणी ॥ १४१॥ वायुमण्डलमध्यस्था विष्णुरूपा विधिप्रिया
    । विष्णुपत्नी विष्णुमती विशालाक्षी वसुन्धरा ॥ १४२॥ वामदेवप्रिया वेला वज्रिणी वसुदोहिनी । वेदाक्षरपरीताङ्गी
    वाजपेयफलप्रदा ॥ १४३॥ वासवी वामजननी वैकुण्ठनिलया वरा । व्यासप्रिया वर्मधरा वाल्मीकिपरिसेविता ॥ १४४॥
    शाकम्भरी शिवा शान्ता शारदा शरणागतिः । शातोदरी शुभाचारा शुम्भासुरविमर्दिनी ॥ १४५॥ शोभावती शिवाकारा
    शंकरार्धशरीरिणी । शोणा शुभाशया शुभ्रा शिरःसन्धानकारिणी ॥ १४६॥ शरावती शरानन्दा शरज्ज्योत्स्ना शुभानना
    । शरभा शूलिनी शुद्धा शबरी शुकवाहना ॥ १४७॥ श्रीमती श्रीधरानन्दा श्रवणानन्ददायिनी । शर्वाणी शर्वरीवन्द्या
    षड्भाषा षडृतुप्रिया ॥ १४८॥ षडाधारस्थिता देवी षण्मुखप्रियकारिणी । षडङ्गरूपसुमतिसुरासुरनमस्कृता ॥ १४९॥
    सरस्वती सदाधारा सर्वमङ्गलकारिणी । सामगानप्रिया सूक्ष्मा सावित्री सामसम्भवा ॥ १५०॥ सर्वावासा सदानन्दा
    सुस्तनी सागराम्बरा । सर्वैश्वर्यप्रिया सिद्धिः साधुबन्धुपराक्रमा ॥ १५१॥ सप्तर्षिमण्डलगता सोममण्डलवासिनी
    । सर्वज्ञा सान्द्रकरुणा समानाधिकवर्जिता ॥ १५२॥ सर्वोत्तुङ्गा सङ्गहीना सद्गुणा सकलेष्टदा । सरघा सूर्यतनया
    सुकेशी सोमसंहतिः ॥ १५३॥ हिरण्यवर्णा हरिणी ह्रींकारी हंसवाहिनी । क्षौमवस्त्रपरीताङ्गी क्षीराब्धितनया
    क्षमा ॥ १५४॥ गायत्री चैव सावित्री पार्वती च सरस्वती । वेदगर्भा वरारोहा श्रीगायत्री पराम्बिका ॥ १५५॥
    इति साहस्रकं नाम्नां गायत्र्याश्चैव नारद । पुण्यदं सर्वपापघ्नं महासम्पत्तिदायकम् ॥ १५६॥ एवं नामानि
    गायत्र्यास्तोषोत्पत्तिकराणि हि । अष्टम्यां च विशेषेण पठितव्यं द्विजैः सह ॥ १५७॥ जपं कृत्वा होमपूजाध्यानं
    कृत्वा विशेषतः । यस्मै कस्मै न दातव्यं गायत्र्यास्तु विशेषतः ॥ १५८॥ सुभक्ताय सुशिष्याय वक्तव्यं भूसुराय
    वै । भ्रष्टेभ्यः साधकेभ्यश्च बान्धवेभ्यो न दर्शयेत् ॥ १५९॥ यद्गृहे लिखितं शास्त्रं भयं तस्य न कस्यचित्
    । चञ्चलापि स्थिरा भूत्वा कमला तत्र तिष्ठति ॥ १६०॥ इदं रहस्यं परमं गुह्याद्गुह्यतरं महत् । पुण्यप्रदं
    मनुष्याणां दरिद्राणां निधिप्रदम् ॥ १६१॥ मोक्षप्रदं मुमुक्षूणां कामिनां सर्वकामदम् । रोगाद्वै मुच्यते
    रोगी बद्धो मुच्येत बन्धनात् ॥ १६२॥ ब्रह्महत्यासुरापानसुवर्णस्तेयिनो नराः । गुरुतल्पगतो वापि पातकान्मुच्यते
    सकृत् ॥ १६३॥ असत्प्रतिग्रहाच्चैवाऽभक्ष्यभक्षाद्विशेषतः । पाखण्डानृत्यमुख्येभ्यः पाठनादेव मुच्यते ॥
    १६४॥ इदं रहस्यममलं मयोक्तं पद्मजोद्भव । ब्रह्मसायुज्यदं नॄणां सत्यं सन्त्यं न संशय ॥ १६५॥ ॥ इति श्रीदेवीभागवते
    महापुराणे द्वादशस्कन्धे गायत्रीसहस्रनाम स्तोत्रकथनं नाम षष्ठोऽध्यायः ॥
