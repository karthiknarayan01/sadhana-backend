id: chandogyopanishadbhashyam
category: upanishad
name:
  english: chandogyopanishadbhashyam
  devanagari: छान्दोग्योपनिषद्भाष्यम्
content:
  english: 3 yathayam drishtanto vayvadinamakashadisamyagamanavadavidyaya samsaravasthayam sharirasamyamapanno'hamamushya
    putro jato jirno marishya ityevamprakaram prajapatineva maghavanyathoktena kramena nasi tvam dehendriyadidharma
    tattvamasiti pratibodhitah sansa esha samprasado jivo'smacchariradakashadiva vayvadayah samutthaya
    dehadivailakshanyamatmano rupamavagamya dehatmabhavanam hitvetyetat | svena rupena sadatmanaivabhinishpadyata
    iti vyakhyatam purastat | sa yena svena rupena samprasado'bhinishpadyate prakpratibodhattadbhrantinimittatsarpo
    bhavati yata rajjuh pashcatkritaprakasha rajjvatmana svena rupenabhinishpadyate | evam ca sa uttamapurusha
    uttamashcasau purushashcetyuttamapurushah sa evottamapurusho'kshisvapnapurushau vyaktavavyaktashca
    sushuptah samastah samprasanno'sharirashca svena rupeneti | eshamesha svena rupenavasthitah ksharaksharau
    vyakritavyakritavapekshyottamapurushah kritanirvacano hyayam gitasu | sa samprasadah svena rupena
    tatra svatmani svasthataya sarvatmabhutah paryeti kvacidindradyatmana jakshaddhasanbhakshayanva bhakshyanuccavacanipsitankvacinmanomatraih
    samkalpadeva samutthitairbrahmalaukikairva kridanstryadibhi ramamanashca manasaiva nopajanam sripumsayoranyonyopagamena
    jayata ityupajanamatmabhavena va'tmasamipyena jayata ityupajanamidam shariram tanna smaran | tatsmarane
    hi duhkhameva syat | duhkhatmakatvattasya | nanvanubhutam cenna smaredasarvajnatvam muktasya | naisha
    doshah | yena mithyajnanadina janitam tacca mithyajnanadi vidyayoccheditamatastannanubhutameveti na
    tadasmarane sarvajnatvahanih | na hyu nmattena grahagrihitena va yadanubhutam tadunmadadyapadame'pi
    smartavyam syattathehapi samsaribhiravidyadoshavadbhiryadanubhuyate tatsarvatmanamashariram na sprishati
    | avidyanimittabhavat | ye tucchinnadoshairmriditakashayairmanasah satyah kama anritapidhana anubhuyante
    vidyabhivyangyatvatta eva muktena sarvatmabhutena sambadhyanta ityatmajnanastutaye nirdishyante'tah
    sadhvetadvishinashtiya ete brahmaloka iti | yatra kvacana bhavanto'pi brahmanyeva hi te loke bhavantiti
    sarvatmatvadbrahmana ucyante | nanu kathamekah'sannanyatpashyati nanyadvijanati sa bhuma'kamamshca
    brahmalaukikan'pashyan ramata'iti ca viruddham | yathaiko yasminneva kshane pashyati sa tasminneva
    kshane na pashyati ceti | naisha doshah | shrutyantare parihritatvat | drashturdrishteraviparilopatpashyanneva
    bhavati | drashturanyatvena kamanamabhavanna pashyati ceti | yadyapi sushupte taduktam muktasyapi
    sarvaikatvatsamano dvitiyabhavah | kena kam pashyediti coktameva | asharirasvarupo'pahatapapmadilakshanah
    sankathamesha purusho'kshini drishyata ityuktah prajapatina | tatra yathasavakshini sakshaddrishyate
    tadvaktavyamitidamarabhyate | tatra ko heturakshini darshana ityahasa drishtanto yatha prayogyah prayogyaparo
    va sashabdah | prayujyata iti prayogyo'shvo balivarde va | yatha loka acaratyanenetyacarano ratho'no
    va tasminnacarane yuktastadakarshanaya
  devanagari: ३ यथायं दृष्टान्तो वाय्वादीनामाकाशादिसाम्यगमनवदविद्यया संसारावस्थायां शरीरसाम्यमापन्नोऽहममुष्य
    पुत्रो जातो जीर्णो मरिष्य इत्येवंप्रकारं प्रजापतिनेव मघवान्यथोक्तेन क्रमेण नासि त्वं देहेन्द्रियादिधर्मा
    तत्त्वमसीति प्रतिबोधितः सन्स एष संप्रसादो जीवोऽस्माच्छरीरादाकाशादिव वाय्वादयः समुत्थाय देहादिवैलक्षण्यमात्मनो
    रूपमवगम्य देहात्मभावनां हित्वेत्येतत् । स्वेन रूपेण सदात्मनैवाभिनिष्पद्यत इति व्याख्यातं पुरस्तात्
    । स येन स्वेन रूपेण संप्रसादोऽभिनिष्पद्यते प्राक्प्रतिबोधात्तद्भ्रान्तिनिमित्तात्सर्पो भवति यता रज्जुः
    पश्चात्कृतप्रकाशा रज्ज्वात्मना स्वेन रूपेणाभिनिष्पद्यते । एवं च स उत्तमपुरुष उत्तमश्चासौ पुरुषश्चेत्युत्तमपुरुषः
    स एवोत्तमपुरुषोऽक्षिस्वप्नपुरुषौ व्यक्तावव्यक्तश्च सुषुप्तः समस्तः संप्रसन्नोऽशरीरश्च स्वेन रूपेणेति
    । एषामेष स्वेन रूपेणावस्थितः क्षराक्षरौ व्याकृताव्याकृतावपेक्ष्योत्तमपुरुषः कृतनिर्वचनो ह्ययं गीतासु
    । स संप्रसादः स्वेन रूपेण तत्र स्वात्मनि स्वस्थतया सर्वात्मभूतः पर्येति क्वचिदिन्द्राद्यात्मना जक्षद्धसन्भक्षयन्वा
    भक्ष्यानुच्चावचानीप्सितान्क्वचिन्मनोमात्रैः संकल्पादेव समुत्थितैर्ब्राह्मलौकिकैर्वा क्रीडन्स्त्र्यादिभी
    रममाणश्च मनसैव नोपजनं स्रीपुंसयोरन्योन्योपगमेन जायत इत्युपजनमात्मभावेन वाऽत्मसामीप्येन जायत इत्युपजनमिदं
    शरीरं तन्न स्मरन् । तत्स्मरणे हि दुःखमेव स्यात् । दुःखात्मकत्वात्तस्य । नन्वनुभूतं चेन्न स्मरेदसर्वज्ञत्वं
    मुक्तस्य । नैष दोषः । येन मिथ्याज्ञानादिना जनितं तच्च मिथ्याज्ञानादि विद्ययोच्छेदितमतस्तन्नानुभूतमेवेति
    न तदस्मरणे सर्वज्ञत्वहानिः । न ह्यु न्मत्तेन ग्रहगृहीतेन वा यदनुभूतं तदुन्मादाद्यपदमेऽपि स्मर्तव्यं
    स्यात्तथेहापि संसारिभिरविद्यादोषवद्भिर्यदनुभूयते तत्सर्वात्मानमशरीरं न स्पृशति । अविद्यानिमित्ताभावात्
    । ये तूच्छिन्नदोषैर्मृदितकषायैर्मानसाः सत्याः कामा अनृतापिधाना अनुभूयन्ते विद्याभिव्यङ्ग्यत्वात्त
    एव मुक्तेन सर्वात्मभूतेन संबध्यन्त इत्यात्मज्ञानस्तुतये निर्दिश्यन्तेऽतः साध्वेतद्विशिनष्टिय एते ब्रह्मलोक
    इति । यत्र क्वचन भवन्तोऽपि ब्रह्मण्येव हि ते लोके भवन्तीति सर्वात्मत्वाद्ब्रह्मण उच्यन्ते । ननु कथमेकःऽसन्नान्यत्पश्यति
    नान्यद्विजानाति स भूमाऽकामांश्च ब्राह्मलौकिकान्ऽपश्यन् रमतऽइति च विरुद्धम् । यथैको यस्मिन्नेव क्षणे
    पश्यति स तस्मिन्नेव क्षणे न पश्यति चेति । नैष दोषः । श्रुत्यन्तरे परिहृतत्वात् । द्रष्टुर्दृष्टेरविपरिलोपात्पश्यन्नेव
    भवति । द्रष्टुरन्यत्वेन कामानामभावान्न पश्यति चेति । यद्यपि सुषुप्ते तदुक्तं मुक्तस्यापि सर्वैकत्वात्समानो
    द्वितीयाभावः । केन कं पश्येदिति चोक्तमेव । अशरीरस्वरूपोऽपहतपाप्मादिलक्षणः सन्कथमेष पुरुषोऽक्षिणि दृश्यत
    इत्युक्तः प्रजापतिना । तत्र यथासावक्षिणि साक्षाद्दृश्यते तद्वक्तव्यमितीदमारभ्यते । तत्र को हेतुरक्षिणि
    दर्शन इत्याहस दृष्टान्तो यथा प्रयोग्यः प्रयोग्यपरो वा सशब्दः । प्रयुज्यत इति प्रयोग्योऽश्वो बलीवर्दे
    वा । यथा लोक आचरत्यनेनेत्याचरणो रथोऽनो वा तस्मिन्नाचरणे युक्तस्तदाकर्षणाय
