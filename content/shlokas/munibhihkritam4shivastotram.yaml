id: munibhihkritam4shivastotram
category: stotram
name:
  english: munibhihkritam4shivastotram
  devanagari: मुनिभिःकृतं४शिवस्तोत्रम्
content:
  english: vishveshvara mahadeva yo'si so'si namo'stu te | stuvanti tvam mahatmano devadevam maheshvaram
    || 66|| namo bhavaya bhavyaya bhavanayodbhavaya ca | anantabalaviryaya bhutanam pataye namah || 67||
    samhartre kapishangaya avyayaya vyayaya ca | ganga saliladharaya cadharaya gunatmane || 68|| tryambakaya
    trinetraya trishulavaradharine | kandarpaya namastubhyam namo'stu paramatmane || 69|| shankaraya vrishankaya
    gananam pataye namah | dandahastaya kalaya pashahastaya vai namah || 70|| vedamantrapradhanaya shatajihvaya
    te namah | bhutam bhavyam bhavishyacca sthavaram jangamam ca yat || 71|| tava dehatsamutpannam deva
    sarvamidam jagat | shambho pahi ca bhadram te prasida bhagavamstatah || 72|| ajnanadyadi va jnanadyatkincitkurute
    narah | tatsarvam bhagavaneva kurute yogamayaya || 73|| evam stutva tu munayah prahrishtenantaratmana
    | yacante tapasa yuktah pashyamastvam yatha pura || 74|| prakritistham ca te lingam tathaivastu yatha
    pura | namo digvasase nityam kinkinijalamaline || 75|| vikataya karalaya karalavadanaya ca | arupaya
    surupaya vishvarupaya te namah || 76|| katankataya rudraya svahakaraya vai namah | sarvapranatmane
    tubhyam gunadehaya vai namah || 77|| durgandhaya sugandhaya shulahastaya vai namah | svayam nilashikhandaya
    shrikanthaya namo namah | nilakanthaya devaya citabhasmangaragine || 78|| gunatrayatmane tubhyam namo
    vishvaya vedhase | shmashanavasine nityam pretarupaya vai namah || 79|| tvam brahma sarvadevanam rudranam
    nilalohitah | atma ca sarvabhutanam sankhyaih purusha ucyate || 80|| parvatanam mahamerurnakshatranam
    ca candramah | rishinam ca vasishthastvam devanam vasavastatha || 81|| om karah sarvavedanam jyeshthasama
    ca samasu | aranyanam ca sarvesham simhastvam parameshvarah || 82|| gramyanamrishabhashcapi bhagava~llokapujitah
    | sarvatha varttamano'pi yo yo bhavo bhavishyati || 83|| tvameva tatra pashyamo brahmana kathitam
    yatha | kamah krodhashca lobhashca vishado mada eva ca || 84|| etadicchama vai roddhum prasida parameshvara
    | mahasamharane prapte tvaya deva kritatmana || 85|| karam lalate sampidya vahnirutpaditastvaya |
    tenagnina tada loka arcirbhih sarvato vritah || 86|| tasmadagnisama hyete bahavo vikritagnayah | yani
    canyanibhutani sthavarani carani ca || 87|| dahyante praninaste tu tvatsamutthena vahnina | asmakam
    dahyamananam trata bhava sureshvara || 88|| tvam ca lokahitarthaya bhutani parishincasi | maheshvara
    mahabhaga prabho shubhanirikshaka || 89|| ajnapaya vayam natha karttaro vacanam tava | rupakotisahasreshu
    rupakotishateshu ca || 90|| iti brahmandapurane purvabhage saptavimshadhyayantargatam munibhih kritam
    shivastotram samaptam | brahmandapurana | anushanga | adhyaya 27
  devanagari: विश्वेश्वर महादेव योऽसि सोऽसि नमोऽस्तु ते । स्तुवन्ति त्वां महात्मानो देवदेवं महेश्वरम्
    ॥ ६६॥ नमो भवाय भव्याय भावनायोद्भवाय च । अनन्तबलवीर्याय भूतानां पतये नमः ॥ ६७॥ संहर्त्रे कपिशाङ्गाय
    अव्ययाय व्ययाय च । गङ्गा सलिलधाराय चाधाराय गुणात्मने ॥ ६८॥ त्र्यम्बकाय त्रिनेत्राय त्रिशूलवरधारिणे
    । कन्दर्पाय नमस्तुभ्यं नमोऽस्तु परमात्मने ॥ ६९॥ शङ्कराय वृषाङ्काय गणानां पतये नमः । दण्डहस्ताय कालाय
    पाशहस्ताय वै नमः ॥ ७०॥ वेदमन्त्रप्रधानाय शतजिह्वाय ते नमः । भूतं भव्यं भविष्यच्च स्थावरं जङ्गमं च
    यत् ॥ ७१॥ तव देहात्समुत्पन्नं देव सर्वमिदं जगत् । शम्भो पाहि च भद्रं ते प्रसीद भगवंस्ततः ॥ ७२॥ अज्ञानाद्यदि
    वा ज्ञानाद्यत्किञ्चित्कुरुते नरः । तत्सर्वं भगवानेव कुरुते योगमायया ॥ ७३॥ एवं स्तुत्वा तु मुनयः प्रहृष्टेनान्तरात्मना
    । याचन्ते तपसा युक्ताः पश्यामस्त्वां यथा पुरा ॥ ७४॥ प्रकृतिस्थं च ते लिङ्गं तथैवास्तु यथा पुरा । नमो
    दिग्वाससे नित्यं किङ्किणीजालमालिने ॥ ७५॥ विकटाय करालाय करालवदनाय च । अरूपाय सुरूपाय विश्वरूपाय ते
    नमः ॥ ७६॥ कटङ्कटाय रूद्राय स्वाहाकाराय वै नमः । सर्वप्राणात्मने तुभ्यं गुणदेहाय वै नमः ॥ ७७॥ दुर्गन्धाय
    सुगन्धाय शूलहस्ताय वै नमः । स्वयं नीलशिखण्डाय श्रीकण्ठाय नमो नमः । नीलकण्ठाय देवाय चिताभस्माङ्गरागिणे
    ॥ ७८॥ गुणत्रयात्मने तुभ्यं नमो विश्वाय वेधसे । श्मशानवासिने नित्यं प्रेतरूपाय वै नमः ॥ ७९॥ त्वं ब्रह्मा
    सर्वदेवानां रुद्राणां नीललोहितः । आत्मा च सर्वभूतानां साङ्ख्यैः पुरुष उच्यते ॥ ८०॥ पर्वतानां महामेरुर्नक्षत्राणां
    च चन्द्रमाः । ऋषीणां च वसिष्ठस्त्वं देवानां वासवस्तथा ॥ ८१॥ ॐ करः सर्ववेदानां ज्येष्ठसाम च सामसु ।
    आरण्यानां च सर्वेषां सिंहस्त्वं परमेश्वरः ॥ ८२॥ ग्राम्याणामृषभश्चापि भगवाँल्लोकपूजितः । सर्वथा वर्त्तमानोऽपि
    यो यो भावो भविष्यति ॥ ८३॥ त्वामेव तत्र पश्यामो ब्रह्मणा कथितं यथा । कामः क्रोधश्च लोभश्च विषादो मद
    एव च ॥ ८४॥ एतदिच्छाम वै रोद्धुं प्रसीद परमेश्वर । महासंहरणे प्राप्ते त्वया देव कृतात्मना ॥ ८५॥ करं
    ललाटे सम्पीड्य वह्निरुत्पादितस्त्वया । तेनाग्निना तदा लोका अर्चिर्भिः सर्वतो वृताः ॥ ८६॥ तस्मादग्निसमा
    ह्येते बहवो विकृताग्नयः । यानि चान्यानिभूतानि स्थावराणि चराणि च ॥ ८७॥ दह्यन्ते प्राणिनस्ते तु त्वत्समुत्थेन
    वाह्निना । अस्माकं दह्यमानानां त्राता भव सुरेश्वर ॥ ८८॥ त्वं च लोकहितार्थाय भूतानि परिषिञ्चसि । महेश्वर
    महाभाग प्रभो शुभनिरीक्षक ॥ ८९॥ आज्ञापय वयं नाथ कर्त्तारो वचनं तव । रूपकोटिसहस्रेषु रूपकोटिशतेषु च
    ॥ ९०॥ इति ब्रह्माण्डपुराणे पूर्वभागे सप्तविंशाध्यायान्तर्गतं मुनिभिः कृतं शिवस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण
    । अनुषङ्ग । अध्याय २७
