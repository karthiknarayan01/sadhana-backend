id: raghavendrapratikulasvanukulikaranastotram
category: stotram
name:
  english: raghavendrapratikulasvanukulikaranastotram
  devanagari: राघवेन्द्रप्रतिकूलस्वानुकूलीकरणस्तोत्रम्
content:
  english: shriraghavendrapratikulasvanukulikaranastotram shribhupe kupe sukhavaram kritacittam citte
    tvam dhyayami ca bhuyo'hamamattah | svamin bhuman bho gururaja pratikulam darapatyadyam sakalam kurvanukulam
    || 1|| rashtre rashtre khyatayashastoma vibhasin vasin dhyatushcetasi datah karunavan | svamin bhuman
    bho gururaja pratikulam darapatyadyam sakalam kurvanukulam || 2|| ghore samsare patito'ham tava putrah
    kutraveyam tvamapahaya prabhumishtam | svamin bhuman bho gururaja pratikulam darapatyadyam sakalam
    kurvanukulam || 3|| vedaham no sadgatihetum tava potah putam padadanyadrite samsritivardheh | svamin
    bhuman bho gururaja pratikulam darapatyadyam sakalam kurvanukulam || 4|| dravam dravam nashyati kashtam
    tava drishtya kashtyapam tvatah kuru tushtam vrishapushpam | svamin bhuman bho gururaja pratikulam
    darapatyadyam sakalam kurvanukulam || 5|| yatyatucca tvadvarenum gatamanau daryam dharyam murdhani
    varyannadamidhe | svamin bhuman bho gururaja pratikulam darapatyadyam sakalam kurvanukulam || 6||
    nana nana daivakadambe savilambe lambe smalambam sukhadam tvamavilambam | svamin bhuman bho gururaja
    pratikulam darapatyadyam sakalam kurvanukulam || 6|| mantram te mantralayadhaman bhuvi japtuh patuh
    padambho laghu nashyatyatiduhkham | svamin bhuman bho gururaja pratikulam darapatyadyam sakalam kurvanukulam
    || 7|| cakre'shtashlokimavadhutah kavikrishnah tatpathena tvam bhava tushto hara kashtam | svamin
    bhuman bho gururaja pratikulam darapatyadyam sakalam kurvanukulam || 9|| iti shrikrishnavadhutaviracite
    shriraghavendratantre navamapatale pratikula
  devanagari: श्रीराघवेन्द्रप्रतिकूलस्वानुकूलीकरणस्तोत्रम् श्रीभूपे कूपे सुखवारां कृतचित्तं चित्ते त्वां
    ध्यायामि च भूयोऽहममत्तः । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारापत्याद्यं सकलं कुर्वनुकूलम् ॥ १॥
    राष्ट्रे राष्ट्रे ख्यातयशस्तोम विभासिन् वासिन् ध्यातुश्चेतसि दातः करुणावान् । स्वामिन् भूमन् भो गुरुराज
    प्रतिकूलं दारापत्याद्यं सकलं कुर्वनुकूलम् ॥ २॥ घोरे संसारे पतितोऽहं तव पुत्रः कुत्रावेयं त्वामपहाय
    प्रभुमिष्टम् । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारापत्याद्यं सकलं कुर्वनुकूलम् ॥ ३॥ वेदाहं नो
    सद्गतिहेतुं तव पोतः पूतं पादादन्यदृते संसृतिवार्धेः । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारपत्याद्यं
    सकलं कुर्वनुकूलम् ॥ ४॥ द्रावं द्रावं नश्यति कष्टं तव दृष्ट्या कष्ट्यापं त्वातः कुरु तुष्टं वृषपुष्पम्
    । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारपत्याद्यं सकलं कुर्वनुकूलम् ॥ ५॥ यत्यतुच्च त्वद्वरेणुं गतमानौ
    दार्यं धार्यं मूर्धनि वार्यन्नदमीढे । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारापत्याद्यं सकलं कुर्वनुकूलम्
    ॥ ६॥ नाना नाना दैवकदम्बे सविलम्बे लम्बे स्मालम्बं सुखदं त्वामविलम्बम् । स्वामिन् भूमन् भो गुरुराज
    प्रतिकूलं दारपत्याद्यं सकलं कुर्वनुकूलम् ॥ ६॥ मन्त्रं ते मन्त्रालयधामन् भुवि जप्तुः पातुः पादाम्भो
    लघु नश्यत्यतिदुःखम् । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारापत्याद्यं सकलं कुर्वनुकूलम् ॥ ७॥ चक्रेऽष्टश्लोकीमवधूतः
    कविकृष्णः तत्पाठेन त्वं भव तुष्टो हर कष्टम् । स्वामिन् भूमन् भो गुरुराज प्रतिकूलं दारापत्याद्यं सकलं
    कुर्वनुकूलम् ॥ ९॥ इति श्रीकृष्णावधूतविरचिते श्रीराघवेन्द्रतन्त्रे नवमपटले प्रतिकूल
