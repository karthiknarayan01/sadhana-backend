id: paramahamsa-upan
category: upanishad
name:
  english: paramahamsa upan
  devanagari: परमहम्स उपन्
content:
  english: rinuyama deva bhadram pashyemakshabhiryajatrah | sthirairangaistushtuvamsastanubhirvyashema
    devahitam yadayuh | svasti na indro vriddhashravah svasti nah pusha vishvavedah | svasti nastarkshyo'rishtanemih
    svasti no brihaspatirdadhatu | om shantih shantih shantih | harih om || atha yoginam paramahamsanam
    ko'yam margastesham ka sthitiriti narado bhagavantamupagatyovaca | tam bhagavanaha | yo'yam paramahamsamargo
    loke durlabhataro na tu bahulyo yadyeko bhavati sa eva nityaputasthah sa eva vedapurusha iti vidusho
    manyante mahapurusho yaccittam tatsarvada mayyevavatishtate tasmadaham ca tasminnevavasthiyate | asau
    svaputramitrakalatrabandhvadinshikhayajnopavite svadhyayam ca sarvakarmani samnyasyayam brahmandam
    ca hitva kaupinam dandamacchadanam ca svashariropabhogarthaya ca lokasyopakararthaya ca parigrahettacca
    na mukhyo'sti ko'yam mukhya iti cedayam mukhyah || 1|| na dandam na shikham na yajnopavitam na cacchadanam
    carati paramahamsah | na shitam na coshnam na sukham na duhkham na manavamane ca shadurmivarjam nindagarvamatsaradambhadarpecchadveshasukhaduhkhakamakrodhalobha
  devanagari: ृणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवंसस्तनूभिर्व्यशेम देवहितं
    यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्योऽरिष्टनेमिः
    स्वस्ति नो बृहस्पतिर्दधातु । ॐ शान्तिः शान्तिः शान्तिः । हरिः ॐ ॥ अथ योगिनं परमहंसनं कोऽयं मार्गस्तेषं
    का स्थितिरिति नारदो भगवन्तमुपगत्योवाच । तं भगवानाह । योऽयं परमहंसमार्गो लोके दुर्लभतरो न तु बाहुल्यो
    यद्येको भवति स एव नित्यपूतस्थः स एव वेदपुरुष इति विदुषो मन्यन्ते महापुरुषो यच्चित्तं तत्सर्वदा मय्येवावतिष्टते
    तस्मादहं च तस्मिन्नेवावस्थीयते । असौ स्वपुत्रमित्रकलत्रबन्ध्वादीञ्शिखायज्ञोपवीते स्वाध्यायं च सर्वकर्माणि
    संन्यस्यायं ब्रह्माण्डं च हित्वा कौपीनं दण्डमाच्छादनं च स्वशरीरोपभोगार्थाय च लोकस्योपकारार्थाय च परिग्रहेत्तच्च
    न मुख्योऽस्ति कोऽयं मुख्य इति चेदयं मुख्यः ॥ १॥ न दण्डं न शिखां न यज्ञोपवीतं न चाच्छादनं चरति परमहंसः
    । न शितं न चोष्णं न सुखं न दुःखं न मानावमाने च षडूर्मिवर्जं निन्दागर्वमत्सरदम्भदर्पेच्छाद्वेषसुखदुःखकामक्रोधलोभ
