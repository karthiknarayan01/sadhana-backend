id: devakritopanishatsararudrastavah
category: upanishad
name:
  english: devakritopanishatsararudrastavah
  devanagari: देवकृतोपनिषत्साररुद्रस्तवः
content:
  english: devakritopanishatsara rudrastavah yo vai rudrassa bhagavanyashca brahma tasmai vai namo namah
    | yo vai rudrassa bhagavanyashca vishnustasmai vai namo namah || 1|| yo vai rudrassa bhagavanyashca
    rudrastasmai vai namo namah | yo vai rudrassa bhagavanya coma tasmai vai namo namah || 2|| yo vai
    rudrassa bhagavanyashca vinayakastasmai vai namo namah | yo vai rudrassa bhagavanyashca skandastasmai
    vai namo namah || 3|| yo vai rudrassa bhagavanyashcendrastasmai vai namo namah | yo vai rudrassa bhagavanyashcagnistasmai
    vai namo namah || 4|| yo vai rudrassa bhagavanyashca vayustasmai vai namo namah | yo vai rudrassa
    bhagavanyashca suryastasmai vai namo namah || 5|| yo vai rudrassa bhagavanyashca varunastasmai vai
    namo namah | yo vai rudrassa bhagavanyashca yamastasmai vai namo namah || 6|| yo vai rudrassa bhagavanyashca
    nirritistasmai vai namo namah | yo vai rudrassa bhagavanyashca ishanastasmai vai namo namah || 7||
    yo vai rudrassa bhagavanyashca kuberastasmai vai namo namah | yo vai rudrassa bhagavanyashca nakshatrani
    tasmai vai namo namah || 8|| yo vai rudrassa bhagavanyashcashtau grahastasmai vai namo namah | yo
    vai rudrassa bhagavanyashca rishayastasmai vai namo namah || 9|| yo vai rudrassa bhagavanyashcashtau
    vasavastasmai vai namo namah | yo vai rudrassa bhagavanyashca dvadashadityastasmai vai namo namah
    || 10|| yo vai rudrassa bhagavanyashca ekadasharudrastasmai vai namo namah | yo vai rudrassa bhagavanyashca
    prithivi tasmai vai namo namah || 11|| yo vai rudrassa bhagavanyashcapastasmai vai namo namah | yo
    vai rudrassa bhagavanyashca tejastasmai vai namo namah || 12|| yo vai rudrassa bhagavanyashca vayustasmai
    vai namo namah | yo vai rudrassa bhagavanyashcakashastasmai vai namo namah || 13|| yo vai rudrassa
    bhagavanyashca bhustasmai vai namo namah | yo vai rudrassa bhagavanyashca bhuvastasmai vai namo namah
    || 14|| yo vai rudrassa bhagavanyashca suvastasmai vai namo namah | yo vai rudrassa bhagavanyashca
    mahastasmai vai namo namah || 15|| yo vai rudrassa bhagavanyashca janastasmai vai namo namah | yau
    vai rudrassa bhagavanyashca tapastasmai vai namo namah || 16|| yo vai rudrassa bhagavanyashca satyam
    tasmai vai namo namah | yo vai rudrassa bhagavanyashca pranastasmai vai namo namah || 17|| yo vai
    rudrassa bhagavanyashca manastasmai vai namo namah | yo vai rudrassa bhagavanyashca sarvam tasmai
    vai namo namah || 18|| yo vai rudrassa bhagavanyashca kalastasmai vai namo namah | yo vai rudrassa
    bhagavanyashca mrityustasmai vai namo namah || 19|| yo vai rudrassa bhagavanyashca bhutam tasmai vai
    namo namah | yo vai rudrassa bhagavanyashca bhavishyattasmai vai namo namah || 20|| yo vai rudrassa
    bhagavanyashca vartamanam tasmai vai namo namah | omadavante ca bhurbhuvasvastrironkritih || 21||
    || iti shivarahasyantargate maheshvarakhye devakritopanishatsara rudrastavah ||
  devanagari: देवकृतोपनिषत्सार रुद्रस्तवः यो वै रुद्रस्स भगवान्यश्च ब्रह्मा तस्मै वै नमो नमः । यो वै रुद्रस्स
    भगवान्यश्च विष्णुस्तस्मै वै नमो नमः ॥ १॥ यो वै रुद्रस्स भगवान्यश्च रुद्रस्तस्मै वै नमो नमः । यो वै
    रुद्रस्स भगवान्या चोमा तस्मै वै नमो नमः ॥ २॥ यो वै रुद्रस्स भगवान्यश्च विनायकस्तस्मै वै नमो नमः ।
    यो वै रुद्रस्स भगवान्यश्च स्कन्दस्तस्मै वै नमो नमः ॥ ३॥ यो वै रुद्रस्स भगवान्यश्चेन्द्रस्तस्मै वै
    नमो नमः । यो वै रुद्रस्स भगवान्यश्चाग्निस्तस्मै वै नमो नमः ॥ ४॥ यो वै रुद्रस्स भगवान्यश्च वायुस्तस्मै
    वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च सूर्यस्तस्मै वै नमो नमः ॥ ५॥ यो वै रुद्रस्स भगवान्यश्च वरुणस्तस्मै
    वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च यमस्तस्मै वै नमो नमः ॥ ६॥ यो वै रुद्रस्स भगवान्यश्च निरृतिस्तस्मै
    वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च ईशानस्तस्मै वै नमो नमः ॥ ७॥ यो वै रुद्रस्स भगवान्यश्च कुबेरस्तस्मै
    वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च नक्षत्राणि तस्मै वै नमो नमः ॥ ८॥ यो वै रुद्रस्स भगवान्यश्चाष्टौ
    ग्रहास्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च ऋषयस्तस्मै वै नमो नमः ॥ ९॥ यो वै रुद्रस्स भगवान्यश्चाष्टौ
    वसवस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च द्वादशादित्यास्तस्मै वै नमो नमः ॥ १०॥ यो वै रुद्रस्स
    भगवान्यश्च एकादशरुद्रास्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च पृथीवी तस्मै वै नमो नमः ॥ ११॥
    यो वै रुद्रस्स भगवान्यश्चापस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च तेजस्तस्मै वै नमो नमः ॥
    १२॥ यो वै रुद्रस्स भगवान्यश्च वायुस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्चाकाशस्तस्मै वै नमो
    नमः ॥ १३॥ यो वै रुद्रस्स भगवान्यश्च भूस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च भुवस्तस्मै वै
    नमो नमः ॥ १४॥ यो वै रुद्रस्स भगवान्यश्च सुवस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च महस्तस्मै
    वै नमो नमः ॥ १५॥ यो वै रुद्रस्स भगवान्यश्च जनस्तस्मै वै नमो नमः । यौ वै रुद्रस्स भगवान्यश्च तपस्तस्मै
    वै नमो नमः ॥ १६॥ यो वै रुद्रस्स भगवान्यश्च सत्यं तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च प्राणास्तस्मै
    वै नमो नमः ॥ १७॥ यो वै रुद्रस्स भगवान्यश्च मनस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च सर्वं
    तस्मै वै नमो नमः ॥ १८॥ यो वै रुद्रस्स भगवान्यश्च कालस्तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च
    मृत्युस्तस्मै वै नमो नमः ॥ १९॥ यो वै रुद्रस्स भगवान्यश्च भूतं तस्मै वै नमो नमः । यो वै रुद्रस्स भगवान्यश्च
    भविष्यत्तस्मै वै नमो नमः ॥ २०॥ यो वै रुद्रस्स भगवान्यश्च वर्तमानं तस्मै वै नमो नमः । ओमादावन्ते च
    भूर्भुवस्वस्त्रिरोङ्कृतिः ॥ २१॥ ॥ इति शिवरहस्यान्तर्गते माहेश्वराख्ये देवकृतोपनिषत्सार रुद्रस्तवः
    ॥
