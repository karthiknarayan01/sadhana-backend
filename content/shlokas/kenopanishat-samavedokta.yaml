id: kenopanishat-samavedokta
category: upanishad
name:
  english: kenopanishat (samavedokta)
  devanagari: केनोपनिषत् (सामवेदोक्त)
content:
  english: sarvam daheyam yadidam prithivyamiti || 5|| tasmai trinam nidadhavetaddaheti | tadupapreyaya
    sarvajavena tanna shashaka dagdhum sa tata eva nivavrite naitadashakam vijnatum yadetadyakshamiti
    || 6|| atha vayumabruvanvayavetadvijanihi kimetadyakshamiti tatheti || 7|| tadabhyadravattamabhyavadatko'siti
    vayurva ahamasmityabravinmatarishva va ahamasmiti || 8|| tasmi~stvayi kim viryamityapida~ sarvamadadiya
    yadidam prithivyamiti || 9|| tasmai trinam nidadhavetadadatsveti tadupapreyaya sarvajavena tanna shashakadatum
    sa tata eva nivavrite naitadashakam vijnatum yadetadyakshamiti || 10|| athendramabruvanmaghavannetadvijanihi
    kimetadyakshamiti tatheti tadabhyadravattasmattirodadhe || 11|| sa tasminnevakashe striyamajagama
    bahushobhamanamuma~ haimavatim ta~hovaca kimetadyakshamiti || 12|| || iti kenopanishadi tritiyah khandah
    || sa brahmeti hovaca brahmano va etadvijaye mahiyadhvamiti tato haiva vidancakara brahmeti || 1||
    tasmadva ete deva atitaramivanyandevanyadagnirvayurindraste hyenannedishtham pasparshuste hyenatprathamo
    vidancakara brahmeti || 2|| tasmadva indro'titaramivanyandevansa hyenannedishtham pasparsha sa hyenatprathamo
    vidancakara brahmeti || 3|| tasyaisha adesho yadetadvidyuto vyadyutada3
  devanagari: सर्वं दहेयं यदिदं पृथिव्यामिति ॥ ५॥ तस्मै तृणं निदधावेतद्दहेति । तदुपप्रेयाय सर्वजवेन तन्न
    शशाक दग्धुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति ॥ ६॥ अथ वायुमब्रुवन्वायवेतद्विजानीहि
    किमेतद्यक्षमिति तथेति ॥ ७॥ तदभ्यद्रवत्तमभ्यवदत्कोऽसीति वायुर्वा अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति
    ॥ ८॥ तस्मिँस्त्वयि किं वीर्यमित्यपीदँ सर्वमाददीय यदिदं पृथिव्यामिति ॥ ९॥ तस्मै तृणं निदधावेतदादत्स्वेति
    तदुपप्रेयाय सर्वजवेन तन्न शशाकादातुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति ॥ १०॥ अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहि
    किमेतद्यक्षमिति तथेति तदभ्यद्रवत्तस्मात्तिरोदधे ॥ ११॥ स तस्मिन्नेवाकाशे स्त्रियमाजगाम बहुशोभमानामुमाँ
    हैमवतीं ताँहोवाच किमेतद्यक्षमिति ॥ १२॥ ॥ इति केनोपनिषदि तृतीयः खण्डः ॥ सा ब्रह्मेति होवाच ब्रह्मणो
    वा एतद्विजये महीयध्वमिति ततो हैव विदाञ्चकार ब्रह्मेति ॥ १॥ तस्माद्वा एते देवा अतितरामिवान्यान्देवान्यदग्निर्वायुरिन्द्रस्ते
    ह्येनन्नेदिष्ठं पस्पर्शुस्ते ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति ॥ २॥ तस्माद्वा इन्द्रोऽतितरामिवान्यान्देवान्स
    ह्येनन्नेदिष्ठं पस्पर्श स ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति ॥ ३॥ तस्यैष आदेशो यदेतद्विद्युतो व्यद्युतदा३
