id: brahmanakritam10shivastotram
category: stotram
name:
  english: brahmanakritam10shivastotram
  devanagari: ब्रह्मणाकृतं१०शिवस्तोत्रम्
content:
  english: brahmana kritam 10 shivastotram brahmovaca | namaste bhagavan rudra bhaskaramitatejase | namo
    bhavaya devaya rasayambumayatmane || 41|| sharvaya kshitirupaya nandisurabhaye namah || 41|| ishaya
    vasave tubhyam namassparshamayatmane | pashunam pataye caiva pavakayatitejase | bhimaya vyomarupaya
    shabdamatraya te namah || 42|| ugrayograsvarupaya yajamanatmane namah | mahadevaya somaya namo'stvamritamurtaye
    || 43|| iti shivapurane vayaviyasamhitayam purvakhande dvadashadhyayantargatam brahmana kritam shivastotram
    samaptam | shivapurana | vayaviyasamhita | purvabhaga | adhyaya 12
  devanagari: ब्रह्मणा कृतं १० शिवस्तोत्रम् ब्रह्मोवाच । नमस्ते भगवन् रुद्र भास्करामिततेजसे । नमो भवाय
    देवाय रसायाम्बुमयात्मने ॥ ४१॥ शर्वाय क्षितिरूपाय नन्दीसुरभये नमः ॥ ४१॥ ईशाय वसवे तुभ्यं नमस्स्पर्शमयात्मने
    । पशूनां पतये चैव पावकायातितेजसे । भीमाय व्योमरूपाय शब्दमात्राय ते नमः ॥ ४२॥ उग्रायोग्रस्वरूपाय यजमानात्मने
    नमः । महादेवाय सोमाय नमोऽस्त्वमृतमूर्तये ॥ ४३॥ इति शिवपुराणे वायवीयसंहितायां पूर्वखण्डे द्वादशाध्यायान्तर्गतं
    ब्रह्मणा कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । वायवीयसंहिता । पूर्वभाग । अध्याय १२
meaning: {}
