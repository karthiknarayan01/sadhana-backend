id: ganeshakavacam-mudgalakritam-ganeshapuranantargatam
category: kavacha
name:
  english: ganeshakavacam mudgalakritam (ganeshapuranantargatam)
  devanagari: गणेशकवचं मुद्गलकृतम् (गणेशपुराणान्तर्गतम्)
content:
  english: tretayantu mayuravahanamimam shadbahukam siddhidam | dvapare tu gajananam yugabhujam raktangaragam
    vibhum turye tu dvibhujam sitangaruciram sarvarthadam sarvada || 18|| vinayakah shikham patu paramatma
    paratparah | atisundarakayastu mastakam sumahotkatah || 19|| lalatam kashyapah patu bhruyugantu mahodarah
    | nayane bhalacandrastu gajasyatvoshthapallavau || 20|| jihvam patu ganakridashcibukam girijasutah
    | vacam vinayakah patu dantan rakshatu durmukhah || 21|| shravanau pashapanistu nasikam cintitarthadah
    | ganeshastu mukham kantham patu devo gananjayah || 22|| skandhau patu gajaskandhah stanau vighnavinashanah
    | hridayam gananathastu herambo jatharam mahan || 23|| dharadharah patu parshve prishtham vighnaharah
    shubhah | lingam guhyam sada patu vakratundo mahabalah || 24|| ganakrido janujanghe urumangalamurtiman
    | ekadanto mahabuddhih padau gulphau sada'vatu || 25|| kshipraprasadano bahu pani ashaprapurakah |
    angulishca nakhan patu padmahasto'rinashanah || 26|| sarvangani mayuresho vishvavyapi sada'vatu |
    anuktamapi yat sthanam dhumraketuh sada'vatu || 27|| amodastvagratah patu pramodah prishthato'vatu
    | pracyam rakshatu buddhisha agneyyam siddhidayakah || 28|| dakshinasyamumaputro nairrityam tu ganeshvarah
    | praticyam vighnaharta'vyad vayavyam gajakarnakah || 29|| kauberyyam nidhipah payadishanyamishanandanah
    | diva'vyadekadantastu ratrau sandhyasu vighnahrit || 30|| rakshasasuravetalagrahabhutapishacatah
    | pashankushadharah patu rajah sattvam tamah smritim || 31|| jnanam dharmanca lakshminca lajjam kirtim
    dayam kulam | vapurdhanam cadhanyam cagrihan daran sutan sakhin || 32|| sarvayudhadharah pautran mayuresho'vatat
    sada | kapilo'javikam patu gavashvam vikato'vatu || 33|| bhurjapatre likhitvedam yah kanthe dharayet
    sudhih | na bhayam jayate tasya yaksharakshah pishacatah || 34|| trisandhyam japate yastu vajrasaratanurbhavet
    | yatrakale pathed yastu nirvighnena phalam labhet || 35|| yuddhakale pathedyastu vijayam prapnuyad
    dhruvam | maranoccatanakarshastambhamohanakarmani || 36|| saptavaram pathed yastu dinanamekavimshatim
    | tat tat phalamavapnoti sadhako natra samshayah || 37|| ekavimshativaranca pathet tavad dinani yah
    | karagrihagatam sadyo rajna vadhyam camocayet || 38|| rajadarshanavelayam pathedetat trivaratah |
    sa rajanam vasham nitva prakritim casabham jayet || 39|| idam ganeshakavacam mudgalena samiritam |
    kashyapaya ca tena'tha mandavyaya maharshaye || 40|| mahyam sa praha kripaya kavacam sarvasiddhidam
    | na deyam bhaktihinaya deyam shraddhavate shubham || sarvarakshakaram sarvamanahkamaprapurakam ||
    41|| anenasya krita raksha na badha'sya bhavet kvacit | rakshasasuravetaladaityadanavasambhava ||
    42|| iti shriganeshapuranantargatam mudgalakritam ganeshakavacam sampurnam |
  devanagari: त्रेतायान्तु मयूरवाहनमिमं षड्बाहुकं सिद्धिदम् । द्वापारे तु गजाननं युगभुजं रक्ताङ्गरागं
    विभुं तुर्ये तु द्विभुजं सिताङ्गरुचिरं सर्वार्थदं सर्वदा ॥ १८॥ विनायकः शिखां पातु परमात्मा परात्परः
    । अतिसुन्दरकायस्तु मस्तकं सुमहोत्कटः ॥ १९॥ ललाटं काश्यपः पातु भ्रूयुगन्तु महोदरः । नयने भालचन्द्रस्तु
    गजास्यत्वोष्ठपल्लवौ ॥ २०॥ जिह्वां पातु गणक्रीडश्चिबुकं गिरिजासुतः । वाचं विनायकः पातु दन्तान् रक्षतु
    दुर्मुखः ॥ २१॥ श्रवणौ पाशपाणिस्तु नासिकां चिन्तितार्थदः । गणेशस्तु मुखं कण्ठं पातु देवो गणञ्जयः ॥
    २२॥ स्कन्धौ पातु गजस्कन्धः स्तनौ विघ्नविनाशनः । हृदयं गणनाथस्तु हेरम्बो जठरं महान् ॥ २३॥ धराधरः पातु
    पार्श्वे पृष्ठं विघ्नहरः शुभः । लिङ्गं गुह्यं सदा पातु वक्रतुण्डो महाबलः ॥ २४॥ गणक्रीडो जानुजङ्घे
    ऊरुमङ्गलमूर्तिमान् । एकदन्तो महाबुद्धिः पादौ गुल्फौ सदाऽवतु ॥ २५॥ क्षिप्रप्रसादनो बाहू पाणी आशाप्रपूरकः
    । अङ्गुलीश्च नखान् पातु पद्महस्तोऽरिनाशनः ॥ २६॥ सर्वाङ्गानि मयूरेशो विश्वव्यापी सदाऽवतु । अनुक्तमपि
    यत् स्थानं धूम्रकेतुः सदाऽवतु ॥ २७॥ आमोदस्त्वग्रतः पातु प्रमोदः पृष्ठतोऽवतु । प्राच्यां रक्षतु बुद्धीश
    आग्नेय्यां सिद्धिदायकः ॥ २८॥ दक्षिणस्यामुमापुत्रो नैरृत्यां तु गणेश्वरः । प्रतीच्यां विघ्नहर्ताऽव्याद्
    वायव्यां गजकर्णकः ॥ २९॥ कौबेर्य्यां निधिपः पायादीशान्यामीशनन्दनः । दिवाऽव्यादेकदन्तस्तु रात्रौ सन्ध्यासु
    विघ्नहृत् ॥ ३०॥ राक्षसासुरवेतालग्रहभूतपिशाचतः । पाशाङ्कुशधरः पातु रजः सत्त्वं तमः स्मृतिम् ॥ ३१॥ ज्ञानं
    धर्मञ्च लक्ष्मीञ्च लज्जां कीर्तिं दयां कुलम् । वपुर्धनं चधान्यं चगृहान् दारान् सुतान् सखीन् ॥ ३२॥
    सर्वायुधधरः पौत्रान् मयूरेशोऽवतात् सदा । कपिलोऽजाविकं पातु गवाश्वं विकटोऽवतु ॥ ३३॥ भूर्जपत्रे लिखित्वेदं
    यः कण्ठे धारयेत् सुधीः । न भयं जायते तस्य यक्षरक्षः पिशाचतः ॥ ३४॥ त्रिसन्ध्यं जपते यस्तु वज्रसारतनुर्भवेत्
    । यात्राकाले पठेद् यस्तु निर्विघ्नेन फलं लभेत् ॥ ३५॥ युद्धकाले पठेद्यस्तु विजयं प्राप्नुयाद् ध्रुवम्
    । मारणोच्चाटनाकर्षस्तम्भमोहनकर्मणि ॥ ३६॥ सप्तवारं पठेद् यस्तु दिनानामेकविंशतिम् । तत् तत् फलमवाप्नोति
    साधको नात्र संशयः ॥ ३७॥ एकविंशतिवारञ्च पठेत् तावद् दिनानि यः । कारागृहगतं सद्यो राज्ञा वध्यं चमोचयेत्
    ॥ ३८॥ राजदर्शनवेलायां पठेदेतत् त्रिवारतः । स राजानं वशं नीत्वा प्रकृतिं चसभां जयेत् ॥ ३९॥ इदं गणेशकवचं
    मुद्गलेन समीरितम् । कश्यपाय च तेनाऽथ माण्डव्याय महर्षये ॥ ४०॥ मह्यं स प्राह कृपया कवचं सर्वसिद्धिदम्
    । न देयं भक्तिहीनाय देयं श्रद्धावते शुभम् ॥ सर्वरक्षाकरं सर्वमनःकामप्रपूरकम् ॥ ४१॥ अनेनास्य कृता रक्षा
    न बाधाऽस्य भवेत् क्वचित् । राक्षसासुरवेतालदैत्यदानवसम्भवा ॥ ४२॥ इति श्रीगणेशपुराणान्तर्गतं मुद्गलकृतं
    गणेशकवचं सम्पूर्णम् ।
