id: vishnukritam10shivastotram
category: stotram
name:
  english: vishnukritam10shivastotram
  devanagari: विष्णुकृतं१०शिवस्तोत्रम्
content:
  english: 10|| srashta tvam sarvajagatam rakshita sarvadehinam | harta ca sarvabhutanam tvam vinaivasti
    ko'parah || 11|| anunamapyaniyamstvam mahamstvam mahatamapi | antarbahistvamevaitajjagadakramya vartase
    || 12|| nigamastava nishvasa vishvam te shilpavaibhavam | sa tvam tvadiya evasi jnanamatma tava prabho
    || 13|| amara danava daityah siddha vidyadhara narah | praninah pakshinah shailah shikhino'pi tvameva
    hi || 14|| svargastvamapavargastvam tvamonkarastvamadhvarah | tvam yogastvam para samvitkim tvam na
    bhavasishvara || 15|| tvamadirmadhyamantashca tasthusham jagmushamapi | kalasvarupatam prapya kalayasyakhilam
    jagat || 16|| pareshah paratah shasta sarvanugrahakah shivah | sa esha me kathankaram sakshadbhavati
    dhurjatih || 17|| yam drishtva sharanam prapto nihshreyasamavapnuyat | atha va staumi taddhama jatamatram
    yathamati || 18|| tacchrutvaisha kripam kuryadavashyam sarvatah shrutih | iti nishcitya vaikunthah
    stotum samupacakrame || 19|| tameva taijasam stambham pranamya parameshvaram | adimadhyantarahitam
    matva tam jagadishvaram | hathattena virancena varyamano'pi sasmitam || 3
  devanagari: १०॥ स्रष्टा त्वं सर्वजगतां रक्षिता सर्वदेहिनाम् । हर्ता च सर्वभूतानां त्वां विनैवास्ति कोऽपरः
    ॥ ११॥ अणूनामप्यणीयांस्त्वं महांस्त्वं महतामपि । अन्तर्बहिस्त्वमेवैतज्जगदाक्रम्य वर्तसे ॥ १२॥ निगमास्तव
    निश्वासा विश्वं ते शिल्पवैभवम् । स त्वं त्वदीय एवासि ज्ञानमात्मा तव प्रभो ॥ १३॥ अमरा दानवा दैत्याः
    सिद्धा विद्याधरा नराः । प्राणिनः पक्षिणः शैलाः शिखिनोऽपि त्वमेव हि ॥ १४॥ स्वर्गस्त्वमपवर्गस्त्वं त्वमोङ्कारस्त्वमध्वरः
    । त्वं योगस्त्वं परा संवित्किं त्वं न भवसीश्वर ॥ १५॥ त्वमादिर्मध्यमन्तश्च तस्थुषां जग्मुषामपि । कालस्वरूपतां
    प्राप्य कलयस्यखिलं जगत् ॥ १६॥ परेशः परतः शास्ता सर्वानुग्राहकः शिवः । स एष मे कथङ्कारं साक्षाद्भवति
    धूर्जटिः ॥ १७॥ यं दृष्ट्वा शरणं प्राप्तो निःश्रेयसमवाप्नुयात् । अथ वा स्तौमि तद्धाम जातमात्रं यथामति
    ॥ १८॥ तच्छ्रुत्वैष कृपां कुर्यादवश्यं सर्वतः श्रुतिः । इति निश्चित्य वैकुण्ठः स्तोतुं समुपचक्रमे ॥
    १९॥ तमेव तैजसं स्तम्भं प्रणम्य परमेश्वरम् । आदिमध्यान्तरहितं मत्वा तं जगदीश्वरम् । हठात्तेन विरञ्चेन
    वार्यमाणोऽपि सस्मितम् ॥ ३
