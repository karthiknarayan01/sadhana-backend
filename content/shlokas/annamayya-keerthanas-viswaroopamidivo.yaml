id: annamayya-keerthanas-viswaroopamidivo
category: stotram
name:
  english: Annamayya Keerthanas Viswaroopamidivo
content:
  english: adi pallavi vishvarupamidivo vishnurupamidivo shashvatulamaitiminka jayamu najanmamu || kòndavanti
    harirupu gurutaina tirumala pandina vrikshamule kalpataruvulu | nindina mrigadulèlla nityamuktajanamulu
    mènduga pratyakshamayè meluvonajanmamu || vishvarupamidivo vishnurupamidivo medavanti harirupu mincainapaidi
    gopura madane valina pakshula marulu | vadala koneti cutla vaikuntha nagaramu yidamaku pòdacupè ihamepoparamu
    || vishvarupamidivo vishnurupamidivo kotimadanulavanti gudilo cakkani murti yituleni shri venkateshuditadu
    | vatapu sòmmulu mudra vakshaputalamelmanga kutuvainanneliti yèkkuvanonatapamu || vishvarupamidivo
    vishnurupamidivo shashvatulamaitiminka jayamu najanmamu ||
  devanagari: आदि पल्लवि विश्वरूपमिदिवो विष्णुरूपमिदिवो शाश्वतुलमैतिमिङ्क जयमु नाजन्ममु ॥ कॊण्डवण्टि हरिरूपु
    गुरुतैन तिरुमल पण्डिन वृक्षमुले कल्पतरुवुलु । निण्डिन मृगादुलॆल्ल नित्यमुक्तजनमुलु मॆण्डुग प्रत्यक्षमायॆ
    मेलुवोनाजन्ममु ॥ विश्वरूपमिदिवो विष्णुरूपमिदिवो मेडवण्टि हरिरूपु मिञ्चैनपैडि गोपुर माडने वालिन पक्षुल
    मरुलु । वाडल कोनेटि चुट्ल वैकुण्ठ नगरमु यीडमाकु पॊडचूपॆ इहमेपोपरमु ॥ विश्वरूपमिदिवो विष्णुरूपमिदिवो
    कोटिमदनुलवण्टि गुडिलो चक्कनि मूर्ति यीटुलेनि श्री वेङ्कटेशुडितडु । वाटपु सॊम्मुलु मुद्र वक्षपुटलमेल्मङ्ग
    कूटुवैनन्नेलिति यॆक्कुवनोनातापमु ॥ विश्वरूपमिदिवो विष्णुरूपमिदिवो शाश्वतुलमैतिमिङ्क जयमु नाजन्ममु
    ॥
