id: devisuktam-vagambhrinisuktam-rigveda-10-125
category: sukta
name:
  english: devisuktam vagambhrinisuktam (rigveda 10|125)
  devanagari: देवीसूक्तम् वागाम्भृणीसूक्तम् (ऋग्वेद १०।१२५)
content:
  english: rinotyuktam | amantavomanta upakshiyanti shrudhishruta shraddhivam te vadami || 4|| ahameva
    svayamidam vadami jushtam devebhiruta manushebhih | yam kamaye tam tamugram krinomi tam brahmanam
    tamrishim tam sumedham || 5|| aham rudraya dhanuratanomi brahmadvishe sharavehanta va u | aham janaya
    samadam krinomyaham dyavaprithivi avivesha || 6|| aham suve pitaramasya murdhan mama yonirapsva antah
    samudre | tato vitishthe bhuvananu vishvo tamum dyam varshmanopasprishami || 7|| ahameva vata'iva
    pravamyarabhamana bhuvanani vishva | paro diva paraena prithivyai tavati mahina sambabhuva || 8||
    om shantih shantih shantih ||
  devanagari: ृणोत्युक्तम् । अमन्तवोमान्त उपक्षियन्ति श्रुधिश्रुत श्रद्धिवं ते वदामि ॥ ४॥ अहमेव स्वयमिदं
    वदामि जुष्टं देवेभिरुत मानुषेभिः । यं कामये तं तमुग्रं कृणोमि तं ब्रह्माणं तमृषिं तं सुमेधाम् ॥ ५॥
    अहं रुद्राय धनुरातनोमि ब्रह्मद्विषे शरवेहन्त वा उ । अहं जनाय समदं कृणोम्यहं द्यावापृथिवी आविवेश ॥
    ६॥ अहं सुवे पितरमस्य मूर्धन् मम योनिरप्स्व अन्तः समुद्रे । ततो वितिष्ठे भुवनानु विश्वो तामूं द्यां
    वर्ष्मणोपस्पृशामि ॥ ७॥ अहमेव वातऽइव प्रवाम्यारभमाणा भुवनानि विश्वा । परो दिवा परएना पृथिव्यै तावती
    महिना सम्बभूव ॥ ८॥ ॐ शान्तिः शान्तिः शान्तिः ॥
