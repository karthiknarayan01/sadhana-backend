id: kartaviryarjunamantrah-1
category: mantra
name:
  english: kartaviryarjunamantrah 1
  devanagari: कार्तवीर्यार्जुनमन्त्रः १
content:
  english: tham krom || abadhnami dridhapashairalamasmadvirodhinam | svadire dhme mahatyagnau kshipatvaksharapavikramah
    || tham krom || 33|| rem rim || yugantaghananirghatanirjharairatibhishanaih || asmadriporharatvayurarjunah
    shankhanisvanaih || rem rim || 34|| dham num || dhanuh pancashatadhvananirgatapranamarutam | kalpantarudrakalpo'sau
    kuryanme ratibhanjanam || dham num || 35|| svam lam || mallairullasitaphalairujvaladbhih vicetasam
    | kuryadanaryamaryasmadaratim kritaviryajah || svam lam || 36|| prom hum | svabahunirgataih pancashatasankhyaissitashugaih
    | shirah krintatu macchatrorjitashatruganorjunah || pro hum || 37|| klim hrim || atitikshnakarairugrairarinigrahavigrahe
    | karavalaih karaḻagraishchindyat madarimarjunah || klim hrim || 38|| gam am || gadabhiratibhimabhirayasabhirarindama
    | samharakalasambandhabhimanirghatabhishanaih || gam am || 39|| sara sara || musalaihkhalasange'rim
    nidaryam mardayarjuna | ayatabhiranayasam hana hehaya bhupate || sara sara || 40|| yum am || yuganto
    gambhiramahanirghoshanishthuram | attahasairaratim me hana hehaya bhupate || yum am || 41|| nam sam
    || sahasrakarasahasra dussahodagratejase | namastubhyam sahasrare hana hehaya madripun || nam sam
    || 42|| karukali || kalakanthagalakarakaralakritimarjuna | kalibhyo'libalim dadyadasmadripukalebaram
    || 43|| ghana ghana || atinilagajarudho nirudhamitavikramah | aghattatu mamaratimarjuno nishitamshukaih
    || ghana ghana || 44|| yum dam || yugantakarburodagrarocisha cakshusha tvaci | daha deva mamaratim
    daha bhuyo hararjuna | yum dam || 45|| tham sum | gadham grihitva kesheshu bhramayitva'tivegatah |
    prakshipyoccaivyasum bhumau patayarim mamarjuna || tham sum || 46|| sam ham || tvayi garjitasangrame
    samrambho jrimbate'rjuna | brahmandamapi bhinnandam bhavetkimarimandalam || sam ham || 47|| nam rom
    mam || madhyandinadinadhishamannirikshyati bhishanah | kshanenaiva mamaratim kuryannirjivamarjunah
    || nam rom mam || 48|| kham dam || atibhishananirghosho yudhi nirjitashatravah | alamasmadarim kuryadacirayushamarjunah
    || kham dam || 49|| nara nara || avicaramanacaramaciradacirayusham | racayedacirapatairishubhirme'rimarjunah
    || nara nara || 50|| ham sam | paracakravinirbhinnarathacakravimardanam | mama shatrumimam hanyajjitashatruganorjunah
    || ham sam || 51|| nam sham || kalameghanibham kalam kalakanthatibhishanah | kalayasadhanuh kalavasham
    nayatu me ripum || nam sham || 52|| dham pham || adhivaranamarudho madavaranavikramah | vidadharuno'kshosmadarimaranamarjunah
    || dham pham || 53|| mam dam || parayuharano ghoradhurinamadavaranam | niyodhaya mamaratim harane
    hehayeshvara | mam dam || 54|| jam nam || kharakotikhurapatakshitirenusamutthitaih | hayasadibhiradyaiva
    hana me ripumarjuna || jam nam || 55|| vim sham || pralayesha samadishtah pramathairiva sadbhataih
    | parikrintaya macchatrun sharanam bhava me'rjuna | vim sham || 56|| khrom lim || pracimashritya haritam
    yatamasmadvirodhanam | nihanyannishitaishshastraishcoramarivibhanjanah || khrom lim || 57|| jam rim
    || disha dakshinaya yadam nigrihyasmadripun balat | nihanyaddhritacapeshumahamarivibhajjanah || jam
    rim || 58|| kram krim | pashcimaya disha yataparetapragrahatithim | tanotvasmadripum bhallairnigrihyedaribhanjanah
    || kram krim || 59|| sam phim || saumyashaya samakrantam samakrantam sureshvara | samapayatu sarvayuh
    madareh saumyadiksthitah || sam phim || 60|| ram lam || grihitacapabanosau bali dushtanibarhanah |
    nibarhayatu macchatrum makhacchakaharisthitah || ram lam || 61|| dam phum | dvishantam mama devesha
    vishantam marutashayat | vishantam vishikhairenam nihanyaduritapahah || dam phum || 62|| shivashaya
    vivriddhasya shitankurashilimukhaih | shirashchedaya macchatrormahamayavibhanjana | om ah || urdhvashayotpatishyantam
    madvishantam mahabala | mahacakrena vicchidyanmahamrityuvibhanjana || om ah || 63|| aum dam | rasarandhramapyasmatsapatnamadharashaya
    | shankhadhvanena vidhvaste sa hanyad duhkhabhanjanah || aum dam || 64|| shri dattatreyo jayatu ||
    iti kartaviryarjunamantrah 1 sampurnah |
  devanagari: ठं क्रोम् ॥ आबध्नामि दृढपाशैरलमस्मद्विरोधिनम् । स्वादिरे ध्मे महत्यग्नौ क्षिपत्वक्षरपविक्रमः
    ॥ ठं क्रोम् ॥ ३३॥ रें रिम् ॥ युगान्तघननिर्घातनिर्झरैरतिभीषणैः ॥ अस्मद्रिपोर्हरत्वायुरर्जुनः शङ्खनिस्वनैः
    ॥ रें रिम् ॥ ३४॥ धं नुम् ॥ धनुः पञ्चशतध्वाननिर्गतप्राणमारुतम् । कल्पान्तरुद्रकल्पोऽसौ कुर्यान्मे रातिभञ्जनम्
    ॥ धं नुम् ॥ ३५॥ स्वां लम् ॥ मल्लैरुल्लसितफलैरुज्वलद्भिः विचेतसम् । कुर्यादनार्यमार्यस्मदरातिं कृतवीर्यजः
    ॥ स्वां लम् ॥ ३६॥ प्रों हुम् । स्वबाहुनिर्गतैः पञ्चशतसङ्ख्यैस्सिताशुगैः । शिरः कृन्ततु मच्छत्रोर्जितशत्रुगणोर्जुनः
    ॥ प्रो हुम् ॥ ३७॥ क्लीं ह्रीम् ॥ अतितीक्ष्णकरैरुग्रैररिनिग्रहविग्रहे । करवालैः कराळाग्रैश्छिन्द्यात्
    मदरिमर्जुनः ॥ क्लीं ह्रीम् ॥ ३८॥ गं आम् ॥ गदाभिरतिभीमाभिरायसाभिररिन्दम । संहारकालसम्बन्धभीमनिर्घातभीषणैः
    ॥ गं आम् ॥ ३९॥ सर सर ॥ मुसलैःखलसङ्गेऽरिं निदर्यं मर्दयार्जुन । आयताभिरनायासं हन हेहय भूपते ॥ सर सर
    ॥ ४०॥ युं अम् ॥ युगान्तो गम्भीरमहानिर्घोषनिष्ठुरम् । अट्टहासैररातिं मे हन हेहय भूपते ॥ युं अम् ॥ ४१॥
    नं सम् ॥ सहस्रकरसाहस्र दुस्सहोदग्रतेजसे । नमस्तुभ्यं सहस्रारे हन हेहय मद्रिपून् ॥ नं सम् ॥ ४२॥ करुकालि
    ॥ कालकण्ठगलाकारकरालाकृतिमर्जुन । कालिभ्योऽलिबलिं दद्यादस्मद्रिपुकलेबरम् ॥ ४३॥ घण घण ॥ अतिनीलगजारुढो
    निरूढामितविक्रमः । आघट्टतु ममारातिमर्जुनो निशितांशुकैः ॥ घण घण ॥ ४४॥ युं दम् ॥ युगान्तकर्बुरोदग्ररोचिषा
    चक्षुषा त्वचि । दह देव ममारातिं दह भूयो हरार्जुन । युं दम् ॥ ४५॥ ठं सुम् । गाढं गृहीत्वा केशेषु भ्रामयित्वाऽतिवेगतः
    । प्रक्षिप्योच्चैव्यसुं भूमौ पातयारिं ममार्जुन ॥ ठं सुम् ॥ ४६॥ सं हाम् ॥ त्वयि गर्जितसङ्ग्रामे संरम्भो
    जृम्बतेऽर्जुन । ब्रह्माण्डमपि भिन्नाण्डं भवेत्किमरिमण्डलम् ॥ सं हाम् ॥ ४७॥ नं रों मम् ॥ मध्यन्दिनदिनाधीशामन्निरीक्ष्याति
    भीषणः । क्षणेनैव ममारातिं कुर्यान्निर्जीवमर्जुनः ॥ नं रों मम् ॥ ४८॥ खं डम् ॥ अतिभीषणानिर्घोषो युधि
    निर्जितशात्रवः । अलमस्मदरिं कुर्यादचिरायुषमर्जुनः ॥ खं डम् ॥ ४९॥ नर नर ॥ अविचारमनाचारमचिरादचिरायुषम्
    । रचयेदचिरापातैरिषुभिर्मेऽरिमर्जुनः ॥ नर नर ॥ ५०॥ हं साम् । परचक्रविनिर्भिन्नरथचक्रविमर्दनम् । मम
    शत्रुमिमं हन्याज्जितशत्रुगणोर्जुनः ॥ हं साम् ॥ ५१॥ नां षम् ॥ कालमेघनिभं कालं कालकण्ठातिभीषणः । कालायसधनुः
    कालवशं नयतु मे रिपुम् ॥ नां षम् ॥ ५२॥ धं फम् ॥ अधिवारणमारुढो मदवारणाविक्रमः । विदधारुणोऽक्षोस्मदरिमारणमर्जुनः
    ॥ धं फम् ॥ ५३॥ मं दम् ॥ परायुहरणो घोरधुरीणमदवारणम् । नियोधय ममारातिं हरणे हेहयेश्वर । मं दम् ॥ ५४॥
    जं ञम् ॥ खरकोटिखुरापातक्षितिरेणुसमुत्थितैः । हयसादिभिरद्यैव हन मे रिपुमर्जुन ॥ जं ञम् ॥ ५५॥ विं शम्
    ॥ प्रलयेश समादिष्टः प्रमथैरिव सद्भटैः । परिकृन्तय मच्छत्रून् शरणं भव मेऽर्जुन । विं शम् ॥ ५६॥ ख्रों
    लिम् ॥ प्राचीमाश्रित्य हरितं यातमस्मद्विरोधनम् । निहन्यान्निशितैश्शस्त्रैश्चोरमारीविभञ्जनः ॥ ख्रों
    लिम् ॥ ५७॥ जं रिम् ॥ दिशा दक्षिणया यादं निगृह्यास्मद्रिपुन् बलात् । निहन्याद्धृतचापेषुमहामारीविभज्जनः
    ॥ जं रिम् ॥ ५८॥ क्रां क्रीम् । पश्चिमया दिशा यातपरेतप्रग्रहातिथिम् । तनोत्वस्मद्रिपुं भल्लैर्निगृह्येदरिभञ्जनः
    ॥ क्रां क्रीम् ॥ ५९॥ सं फिम् ॥ सौम्याशया समाक्रान्तं समाक्रान्तं सुरेश्वर । समापयतु सर्वायुः मदरेः
    सौम्यदिक्स्थितः ॥ सं फिम् ॥ ६०॥ रां लाम् ॥ गृहीतचापबाणोसौ बली दुष्टनिबर्हणः । निबर्हयतु मच्छत्रुं
    मखच्छकहरिस्थितः ॥ रां लाम् ॥ ६१॥ डं फुम् । द्विषन्तं मम देवेश विशन्तं मारुताशयात् । विशन्तं विशिखैरेनं
    निहन्यादुरितापहः ॥ डं फुम् ॥ ६२॥ शिवाशया विवृद्धस्य शिताङ्कुरशिलीमुखैः । शिरश्छेदय मच्छत्रोर्महामायाविभञ्जन
    । ॐ अः ॥ ऊर्ध्वाशयोत्पतिष्यन्तं मद्विषन्तं महाबल । महाचक्रेण विच्छिद्यान्महामृत्युविभञ्जन ॥ ॐ अः ॥
    ६३॥ औं डम् । रसारन्ध्रामप्यस्मत्सपत्नमधराशया । शङ्खध्वानेन विध्वस्ते स हन्याद् दुःखभञ्जनः ॥ औं डम्
    ॥ ६४॥ श्री दत्तात्रेयो जयतु ॥ इति कार्तवीर्यार्जुनमन्त्रः १ सम्पूर्णः ।
