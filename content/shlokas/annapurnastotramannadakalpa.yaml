id: annapurnastotramannadakalpa
category: stotram
name:
  english: annapurnastotramannadakalpa
  devanagari: अन्नपूर्णास्तोत्रमन्नदाकल्प
content:
  english: kathayami tava snehat stotrani kavacani ca | annapurnapritidani savadhano'vadharaya || 2||
    hrimkaram prathamam namo bhagavati svahavasanam dhruvam mantram saptadashaksharam japati te maheshvari
    prokshitam | dhyaye'mbe tarunarunam tava vapurnityannapurne shive gehe tasya virajate sarabhasam divyannarashirdhruvam
    || 3|| hrimkaramurtim kamaniyavaktram candrankarekhanvitabhalabhagam | ishankantam pranamami nityam
    lakshmivilasaspadapadapitham || 4|| namo'stu tubhyam girirajakanye namo'stu kamantakavallabhayai |
    namo'stu panke ruhalocanayai namah shivayai shashibhushanayai || 5|| vame kare'mritamayam kalashanca
    dakshe svarnankitam nanu pallannamayinca darvim | citram suvarnavasanam girishasya kantam satpadmapatranayanam
    manasahamide || 6|| vame manikyapatram madhurasabharitam bibhratim panipadme divyairatnaih prapurnam
    manimayavalaye dakshine ratnadarvim | raktangi pinatungastanabharavilasamstaraharam trinetram vande
    purnendubimbapratinidhivadanamambikamannapurnam || 7|| bhagavati bhavarogat piditam dushkritotthat
    sutaduhitrikalatropadravenanujatam | vilasadamritadrishtya vikshya vibhrantacittam sakalabhuvanamatastrahi
    mamannapurne || 8|| maheshvarimashritakalpavallimaham bhavacchedakarim bhavanim | kshudhartajayatanayabhyupetastvamannapurnam
    sharanam prapadye || 9|| daridryadavanaladahyamanam namo'nnapurne girirajakanye | kripambuvarshairabhishinca
    tvam mam tvatpadapadmarpitacittavrittim || 10|| ityannapurnastavaratnametacchlokashtakam yah pathatiha
    bhaktya | tasmai dadatyannasamriddhirashim shriyanca vidyanca paratra muktim || 11|| ityannadakalpe
    shodashapatale annapurnastotram samaptam |
  devanagari: कथयामि तव स्नेहात् स्तोत्राणि कवचानि च । अन्नपूर्णाप्रीतिदानि सावधानोऽवधारय ॥ २॥ ह्रींकारं
    प्रथमं नमो भगवति स्वाहावसानां ध्रुवं मन्त्रं सप्तदशाक्षरं जपति ते माहेश्वरि प्रोक्षितम् । ध्यायेऽम्बे
    तरुणारुणं तव वपुर्नित्यान्नपूर्णे शिवे गेहे तस्य विराजते सरभसं दिव्यान्नराशिर्ध्रुवम् ॥ ३॥ ह्रींकारमुर्तिं
    कमनीयवक्त्रां चन्द्राङ्करेखान्वितभालभागाम् । ईशान्कान्तां प्रणमामि नित्यां लक्ष्मीविलासास्पदपादपीठाम्
    ॥ ४॥ नमोऽस्तु तुभ्यं गिरिराजकन्ये नमोऽस्तु कामान्तकवल्लभायै । नमोऽस्तु पङ्के रुहलोचनायै नमः शिवायै
    शशिभूषणायै ॥ ५॥ वामे करेऽमृतमयं कलशञ्च दक्षे स्वर्णाङ्कितां ननु पल्लान्नमयीञ्च दर्वीम् । चित्रां सुवर्णवसनां
    गिरिशस्य कान्तां सत्पद्मपत्रनयनां मनसाहमीडे ॥ ६॥ वामे माणिक्यपात्रं मधुरसभरितं बिभ्रतीं पाणिपद्मे
    दिव्यैरत्नैः प्रपूर्णां मणिमयवलये दक्षिणे रत्नदर्वीम् । रक्ताङ्गी पीनतुङ्गस्तनभरविलसंस्तारहारां त्रिनेत्रां
    वन्दे पूर्णेन्दुबिम्बप्रतिनिधिवदनामम्बिकामन्नपूर्णाम् ॥ ७॥ भगवति भवरोगात् पीडितं दुष्कृतोत्थात् सुतदुहितृकलत्रोपद्रवेणानुजातम्
    । विलसदमृतदृष्ट्या वीक्ष्य विभ्रान्तचित्तम् सकलभुवनमातस्त्राहि मामन्नपूर्णे ॥ ८॥ माहेश्वरीमाश्रितकल्पवल्लीमहं
    भवच्छेदकरीं भवानीम् । क्षुधार्तजायातनयाभ्युपेतस्त्वामन्नपूर्णां शरणं प्रपद्ये ॥ ९॥ दारिद्र्यदावानलदह्यमानं
    नमोऽन्नपूर्णे गिरिराजकन्ये । कृपाम्बुवर्षैरभिषिञ्च त्वं मां त्वत्पादपद्मार्पितचित्तवृत्तिम् ॥ १०॥
    इत्यन्नपूर्णास्तवरत्नमेतच्छ्लोकाष्टकं यः पठतीह भक्त्या । तस्मै ददात्यन्नसमृद्धिराशिं श्रियञ्च विद्याञ्च
    परत्र मुक्तिम् ॥ ११॥ इत्यन्नदाकल्पे षोडशपटले अन्नपूर्णास्तोत्रं समाप्तम् ।
