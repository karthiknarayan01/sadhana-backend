id: sri-tripura-bhairavi-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Tripura Bhairavi Ashtottara Sata Namavali
content:
  english: om bhairavyai namah | om bhairavaradhyayai namah | om bhutidayai namah | om bhutabhavanayai
    namah | om aryayai namah | om brahmyai namah | om kamadhenave namah | om sarvasampatpradayinyai namah
    | om trailokyavanditadevyai namah | om devyai namah | | om mahishasuramardinyai namah | om mohaghnyai
    namah | om malatyai namah | om malayai namah | om mahapatakanashinyai namah | om krodhinyai namah
    | om krodhanilayayai namah | om krodharaktekshanayai namah | om kuhve namah | om tripurayai namah
    | | om tripuradharayai namah | om trinetrayai namah | om bhimabhairavyai namah | om devakyai namah
    | om devamatre namah | om devadushtavinashinyai namah | om damodarapriyayai namah | om dirghayai namah
    | om durgayai namah | om durgatinashinyai namah | | om lambodaryai namah | om lambakarnayai namah
    | om pralambitapayodharayai namah | om pratyangirayai namah | om pratipadayai namah | om pranatakleshanashinyai
    namah | om prabhavatyai namah | om gunavatyai namah | om ganamatre namah | om guhyeshvaryai namah
    | | om kshirabdhitanayayai namah | om kshemyayai namah | om jagattranavidhayinyai namah | om mahamaryai
    namah | om mahamohayai namah | om mahakrodhayai namah | om mahanadyai namah | om mahapatakasamhartryai
    namah | om mahamohapradayinyai namah | om vikaralayai namah | | om mahakalayai namah | om kalarupayai
    namah | om kalavatyai namah | om kapalakhatvangadharayai namah | om khadgakharparadharinyai namah
    | om kumaryai namah | om kunkumapritayai namah | om kunkumarunaranjitayai namah | om kaumodakyai namah
    | om kumudinyai namah | | om kirtyayai namah | om kirtipradayinyai namah | om navinayai namah | om
    niradayai namah | om nityayai namah | om nandikeshvarapalinyai namah | om ghargharayai namah | om
    gharghararavayai namah | om ghorayai namah | om ghorasvarupinyai namah | | om kalighnyai namah | om
    kalidharmaghnyai namah | om kalikautukanashinyai namah | om kishoryai namah | om keshavapritayai namah
    | om kleshasanghanivarinyai namah | om mahonmattayai namah | om mahamattayai namah | om mahavidyayai
    namah | om mahimayyai namah | | om mahayajnayai namah | om mahavanyai namah | om mahamandaradharinyai
    namah | om mokshadayai namah | om mohadayai namah | om mohayai namah | om bhuktimuktipradayinyai namah
    | om attattahasaniratayai namah | om kvanannupuradharinyai namah | om dirghadamshtrayai namah | |
    om dirghamukhyai namah | om dirghaghonayai namah | om dirghikayai namah | om danujantakaryai namah
    | om dushtayai namah | om duhkhadaridryabhanjinyai namah | om duracarayai namah | om doshaghnyai namah
    | om damapatnyai namah | om dayaparayai namah | | om manobhavayai namah | om manumayyai namah | om
    manuvamshapravardhinyai namah | om shyamayai namah | om shyamatanave namah | om shobhayai namah |
    om saumyayai namah | om shambhuvilasinyai namah |
  devanagari: ॐ भैरव्यै नमः । ॐ भैरवाराध्यायै नमः । ॐ भूतिदायै नमः । ॐ भूतभावनायै नमः । ॐ आर्यायै नमः
    । ॐ ब्राह्म्यै नमः । ॐ कामधेनवे नमः । ॐ सर्वसम्पत्प्रदायिन्यै नमः । ॐ त्रैलोक्यवन्दितदेव्यै नमः ।
    ॐ देव्यै नमः । । ॐ महिषासुरमर्दिन्यै नमः । ॐ मोहघ्न्यै नमः । ॐ मालत्यै नमः । ॐ मालायै नमः । ॐ महापातकनाशिन्यै
    नमः । ॐ क्रोधिन्यै नमः । ॐ क्रोधनिलयायै नमः । ॐ क्रोधरक्तेक्षणायै नमः । ॐ कुह्वे नमः । ॐ त्रिपुरायै
    नमः । । ॐ त्रिपुराधारायै नमः । ॐ त्रिनेत्रायै नमः । ॐ भीमभैरव्यै नमः । ॐ देवक्यै नमः । ॐ देवमात्रे
    नमः । ॐ देवदुष्टविनाशिन्यै नमः । ॐ दामोदरप्रियायै नमः । ॐ दीर्घायै नमः । ॐ दुर्गायै नमः । ॐ दुर्गतिनाशिन्यै
    नमः । । ॐ लम्बोदर्यै नमः । ॐ लम्बकर्णायै नमः । ॐ प्रलम्बितपयोधरायै नमः । ॐ प्रत्यङ्गिरायै नमः । ॐ
    प्रतिपदायै नमः । ॐ प्रणतक्लेशनाशिन्यै नमः । ॐ प्रभावत्यै नमः । ॐ गुणवत्यै नमः । ॐ गणमात्रे नमः । ॐ
