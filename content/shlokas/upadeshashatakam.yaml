id: upadeshashatakam
category: shataka
name:
  english: upadeshashatakam
  devanagari: उपदेशशतकम्
content:
  english: upadeshashatakam trishu deveshu mahantam bhrigurbubhutsuh parikshya harimekam | mene'dhikam
    mahimna sevyah sarvottamo vishnuh || 1|| rukmangadah svaputram nihatya khadgena mohinivacasa | satyam
    raraksha vacam na sankate'pi tyajeddharmam || 2|| nirvasito hitepsurvibhishano ravanena lankayah |
    tannashaheturasinnahi nijabandhurviroddhavyah || 3|| hritarajyadarpasaram suyodhanam nigrahitumapi
    shaktah | proshurvaneshu partha dhirah samayam pratiksheta || 4|| manihetorabhishaptah krishnah satrajitatha
    jambavatah | jitva dadau tamasmai janapavadadbhajedbhitim || 5|| svarajyamashnuvanah prakopya nahusho
    muninahirbhutva | nyapatattvaritamadhastatpraptaishvaryo na driptah syat || 6|| sahadharminim vanantaddasharathasunorjahara
    dashavaktrah | bandhanamapa samudro na durjanasyantike nivaset || 7|| hantum devakatanayam vasudevenodyatayudhah
    kamsah | madhuroktibhiranunitah samna murkham vashe kuryat || 8|| bhratarmahadaticaro na yukta iti
    vadinam dashagrivah | dhanadam babandha yuddhe mudhamatirnopadeshtavyah || 9|| vishrabdhashcatuvacanaih
    kaikeyyai dasharatho varam dattva | sankatamapa durantam strishu na kurvita vishvasam || 10|| garvadyoddhumupetah
    paulastyah sapadi kartaviryena | kridamriga iva baddho na balodriktena yoddhavyam || 11|| sandipitagrapuccho
    baddhatanustadito'pi rakshobhih | lankam marutiradahadvipadi vijahyanna shuratvam || 12|| rukmi chalena
    divyanbalam vijityatha parihasannuccaih | dragvadhamapa sabhayam nopahasennirjitam dyute || 13|| shakunisuyodhanakarnairjito'kshadhutairyudhishthiro
    dyute | nirvasitah svarashtratkitavaih saha nacareddyutam || 14|| makharakshanaya putram vishvamitraya
    dasharatho'rthayate | prayacchadgatashankam dustyajamapyarthine deyam || 15|| tyaja parthaih saha
    ranamiti vidurenokto'mbikasutah satatam | tadamatva kshayamapatkartavyam bhashitam suhridam || 16||
    shishupalah kratukale harimarham garhayannanarhoktya | tatkshanamiyaya nasham na mahantam kvapi garheta
    || 17|| anyadvijaya mohannrigo vadanyo dvijasya gam dattva | sadyo'bhutkrikalaso brahmasvam durato
    visrijet || 18|| sugrivo raghupatina hritadarenopagamya hritadarah | dridhamababandha sakhyam samanaduhkhah
    sakha karyah || 19|| viro vaitanikah sanviratanagaroshitah kumarinam | nartayitarjuna asidbhajedavasthocita
    vrittim || 20|| dushyantah svavadhumapi kanvanitam shakuntalam sasutam | suciram vimrishya bheje karyam
    sahasa na vidadhita || 21|| jamadagnina niyuktah sadyo nijaghana mataram ramah | nirdoshah punarasidguruktamavicaritam
    kuryat || 22|| shatayojanatatamabdhim vilanghya vatatmajo'vishallankam | viragratahsaro'bhudyasho'rjayansahasam
    kuryat || 23|| prahitah surairjigishurharam prahartum smaro'bhyayadyavat | bhasmibabhuva tavanna cikirsheddushkaram
    karma || 24|| sankutya padaghataih kalindyam kauliyam kritagaskam | nirayapayanmukundo dushte dandah
    prayoktavyah || 25|| kulishahatihritashirase'pyadatkabandhaya jivate shakrah | ashanayorasi vadanam
    dino ripurapyanugrahyah || 26|| sugrivaya shukah svaddashamukhasandeshamadishankapibhih | santadya
    sapadi baddho na dutabhavam bhajedasatah || 27|| ashvatthama hata iti yudhi giramanritam yudhishthiro'vadit
    | punaranutapamavapatpapam kritvanutapyeta || 28|| bhoganbahunyayatirbhuktva vayasa sutasya cirakalam
    | niravidyatavitriptah kamam manyeta dushpuram || 29|| balirindrajittrilokyam bhunjanbhogamshciradvinashtashrih
    | sutale'badhyata pashairbhogankshanabhanguranvidyat || 30|| vilapantam hataputram dhritarashtra vikshya
    karunaya krishnah | kshanamanushushoca sasram duhkhitamanu duhkhito bhuyat || 31|| nihkshatriyam na
    cakre yavadramo bhuvam rusha tavat | asidranaikatano viramedasamapya narabdham || 32|| duhita videhabharturdasharatherbhamini
    sita | vadhamapa rakshasinam vidhervicitra gatirbodhya || 33|| nigamagamaikavetta dronastaptva tapo'rthamanvicchan
    | dhanushkavrittirasiddharmam cartham ca seveta || 34|| adhishambhumauli nivasannekakalatma yatharcyate
    candrah | na tatha sa purnabimbah shrayenmahantam mahattvaya || 35|| sharatalpamadhishayanadbhishmadakarnya
    dharmajo dharman | duhkham jahau durantam prashtavyah satpatham vriddhah || 36|| karnena ghatayitva
    ghatotkacam shakrashaktinirmokshat | jivitamarakshi parthaih svatmanam sarvato rakshet || 37|| prithukopaharapanirharim
    sakhayam prapadya dinatma | shrimanabhutsudama shrayeta sanmittramapatsu || 38|| drishtva harih samaksham
    banatranaya kotavim nagnam | samare paranmukho'bhutstriyam vivastram na viksheta || 39|| adishallakshmanahetormarutimanetumoshadhim
    ramah | tamanayatsa duraddhuryah karye niyoktavyah || 40|| aradhya kaitavajno raudram rudradvriko
    varam labdhva | gaurimiyesha hartum na vinitam vishvaseddhurtam || 41|| dashakantharakshitayam lankayam
    rakshasamabhudvasatam | grihavittabandhunasho vasenna rashtre kubhupale || 42|| shaptvambarishamaryam
    durvasah kopano niragaskam | cakrena tapito'bhunna vidadhyatkrodhamasthane || 43|| makhashikhini huyamanam
    takshakamavitum prapannamasamarthah | ajahanna tu puruhutah sharanamupeto na hatavyah || 44|| hatva
    svasustanujansadyo jatanbahunkhalah kamsah | utsannah sahasabhunna kutsitam karma kurvita || 45||
    sitam visrijya ramah sakam munibhirmunivrato rajyam | shasannuvasa puryam neyah sadbhih samam samayah
    || 46|| krishnadhananjayabhimandvijaveshasthanjarasutashcihnaih | kshatraih kshipramajanadakarairingitam
    vidyat || 47|| yam yam disham gato'bhuddhiranyakashipuryadricchaya vicaran | tam tam surah pranemurdushtajanam
    duratah pranamet || 48|| kurvannapi munishaptah svajivitarthi parikshito yatnam | dashto'hina vinashto
    jneyo mrityuh sudurvarah || 49|| saditi pratiyamanam jaganmrishaiveti kevalam buddhva | janako vimuktimagatsvapnavadantarjagadbodhyam
    || 50|| viharanvadhubhirantahpure'gnivarno divanisham kami | grasto'tha yakshmanabhudvishayanvishabhishananvidyat
    || 51|| viprah patirvrishalya himsro'pyabhivadananmaharshinam | valmikirmunirasitpurushanabhivadayenmahatah
    || 52|| nishi kamayanduratma drupadasutam kicako rahah praptam | vadhamapa bhimasenatparastriyam nabhikanketa
    || 53|| yudhi kuravah kritavaira viram vyuham vishantamabhimanyum | bahavo nijaghnurevam naiko ripumandalam
    pravishet || 54|| pushkaranirjitarajyah puramrituparnasya naishadho gatva | sarathirabhunnigudho duravastho
    na prakashah syat || 55|| kshatram vimrishya dharmam manyairgurubhirdvijaih samam samare | yuyudhe'rjuno
    dhanushmanghoramapi svam careddharmam || 56|| harirambudhimathanottham sudham surebhyah suram suraribhyah
    | vyataratsamam yatharham yogyam yogyaya datavyam || 57|| atha caikatvamavaptah suram nipiyoddhata
    mitho ghnantah | yudhi yadavah praneshurdhimanmadyam na seveta || 58|| yajnotsave svapitra hathadanakarita
    sati gatva | tanumajahatparibhuta kvapi na gacchedanahutah || 59|| mucukundena mukundo yadubhiravadhyasya
    kalayavanasya | chalato'cikaradantam vadhyo'rirvancayitvapi || 60|| asakridyudhi vijitadapi bhito
    barhadrathajjale durgam | kritva harinyavatsidvijito'pyashankaniyo'rih || 61|| turagarthe'bhisarantah
    prakopya kapilam kshanatsamam sarve | sagarasutah kshayamiyurna kopayettapasam shantam || 62|| munirapi
    vishvamitrah shva bhutva gudhamurvashivashagah | anvavrajatsmararto bhetavyam durjayatkamat || 63||
    baladarpitastrilokyam trinavadganayandashananah shuran | yudhi nirjitah plavangairna vahedgarvambudho
    manasa || 64|| maturvaksharaviddhah pancabdo dushkaram tapastaptva | dhruva uccaihpadamabhajatpumsa
    vyavasayina bhavyam || 65|| nita rahasi sakhibhyo bahumahita ballavi pathi shranta | vaha mamiti harimuce
    na hyatisammanayetpramadam || 66|| dadhatah svalakshma yuddhe muhuh sha
  devanagari: उपदेशशतकम् त्रिषु देवेषु महान्तं भृगुर्बुभुत्सुः परीक्ष्य हरिमेकम् । मेनेऽधिकं महिम्ना सेव्यः
    सर्वोत्तमो विष्णुः ॥ १॥ रुक्माङ्गदः स्वपुत्रं निहत्य खड्गेन मोहिनीवचसा । सत्यां ररक्ष वाचं न सङ्कटेऽपि
    त्यजेद्धर्मम् ॥ २॥ निर्वासितो हितेप्सुर्विभीषणो रावणेन लङ्कायाः । तन्नाशहेतुरासीन्नहि निजबन्धुर्विरोद्धव्यः
    ॥ ३॥ हृतराज्यदर्पसारं सुयोधनं निग्रहीतुमपि शक्ताः । प्रोषुर्वनेषु पार्था धीरः समयं प्रतीक्षेत ॥ ४॥
    मणिहेतोरभिशप्तः कृष्णः सत्राजिताथ जाम्बवतः । जित्वा ददौ तमस्मै जनापवादाद्भजेद्भीतिम् ॥ ५॥ स्वाराज्यमश्नुवानः
    प्रकोप्य नहुषो मुनीनहिर्भूत्वा । न्यपतत्त्वरितमधस्तात्प्राप्तैश्वर्यो न दृप्तः स्यात् ॥ ६॥ सहधर्मिणीं
    वनान्ताद्दशरथसूनोर्जहार दशवक्त्रः । बन्धनमाप समुद्रो न दुर्जनस्यान्तिके निवसेत् ॥ ७॥ हन्तुं देवकतनयां
    वसुदेवेनोद्यतायुधः कंसः । मधुरोक्तिभिरनुनीतः साम्ना मूर्खं वशे कुर्यात् ॥ ८॥ भ्रातर्महदतिचारो न युक्त
    इति वादिनं दशग्रीवः । धनदं बबन्ध युद्धे मूढमतिर्नोपदेष्टव्यः ॥ ९॥ विश्रब्धश्चटुवचनैः कैकेय्यै दशरथो
    वरं दत्त्वा । सङ्कटमाप दुरन्तं स्त्रीषु न कुर्वीत विश्वासम् ॥ १०॥ गर्वाद्योद्धुमुपेतः पौलस्त्यः सपदि
    कार्तवीर्येण । क्रीडामृग इव बद्धो न बलोद्रिक्तेन योद्धव्यम् ॥ ११॥ सन्दीपिताग्रपुच्छो बद्धतनुस्ताडितोऽपि
    रक्षोभिः । लङ्कां मारुतिरदहद्विपदि विजह्यान्न शूरत्वम् ॥ १२॥ रुक्मी छलेन दीव्यन्बलं विजित्याथ परिहसन्नुच्चैः
    । द्राग्वधमाप सभायां नोपहसेन्निर्जितं द्यूते ॥ १३॥ शकुनिसुयोधनकर्णैर्जितोऽक्षधूतैर्युधिष्ठिरो द्यूते
    । निर्वासितः स्वराष्ट्रात्कितवैः सह नाचरेद्द्यूतम् ॥ १४॥ मखरक्षणाय पुत्रं विश्वामित्राय दशरथोऽर्थयते
    । प्रायच्छद्गतशङ्कं दुस्त्यजमप्यर्थिने देयम् ॥ १५॥ त्यज पार्थैः सह रणमिति विदुरेणोक्तोऽम्बिकासुतः
    सततम् । तदमत्वा क्षयमापत्कर्तव्यं भाषितं सुहृदाम् ॥ १६॥ शिशुपालः क्रतुकाले हरिमर्हं गर्हयन्ननर्होक्त्या
    । तत्क्षणमियाय नाशं न महान्तं क्वापि गर्हेत ॥ १७॥ अन्यद्विजाय मोहान्नृगो वदान्यो द्विजस्य गां दत्त्वा
    । सद्योऽभूत्कृकलासो ब्रह्मस्वं दूरतो विसृजेत् ॥ १८॥ सुग्रीवो रघुपतिना हृतदारेणोपगम्य हृतदारः । दृढमाबबन्ध
    सख्यं समानदुःखः सखा कार्यः ॥ १९॥ वीरो वैतनिकः सन्विराटनगरोषितः कुमारीणाम् । नर्तयितार्जुन आसीद्भजेदवस्थोचिता
    वृत्तिम् ॥ २०॥ दुष्यन्तः स्ववधूमपि कण्वानीतां शकुन्तलां ससुताम् । सुचिरं विमृश्य भेजे कार्यं सहसा
    न विदधीत ॥ २१॥ जमदग्निना नियुक्तः सद्यो निजघान मातरं रामः । निर्दोषः पुनरासीद्गुरूक्तमविचारितं कुर्यात्
    ॥ २२॥ शतयोजनततमब्धिं विलङ्घ्य वातात्मजोऽविशल्लङ्काम् । वीराग्रतःसरोऽभूद्यशोऽर्जयन्साहसं कुर्यात् ॥
    २३॥ प्रहितः सुरैर्जिगीषुर्हरं प्रहर्तुं स्मरोऽभ्ययाद्यावत् । भस्मीबभूव तावन्न चिकीर्षेद्दुष्करं कर्म
    ॥ २४॥ सङ्कुट्य पादघातैः कालिन्द्यां कौलियं कृतागस्कम् । निरयापयन्मुकुन्दो दुष्टे दण्डः प्रयोक्तव्यः
    ॥ २५॥ कुलिशाहतिहृतशिरसेऽप्यदात्कबन्धाय जीवते शक्रः । अशनायोरसि वदनं दीनो रिपुरप्यनुग्राह्यः ॥ २६॥
    सुग्रीवाय शुकः स्वाद्दशमुखसन्देशमादिशन्कपिभिः । सन्ताड्य सपदि बद्धो न दूतभावं भजेदसतः ॥ २७॥ अश्वत्थामा
    हत इति युधि गिरमनृतां युधिष्ठिरोऽवादीत् । पुनरनुतापमवापत्पापं कृत्वानुतप्येत ॥ २८॥ भोगान्बहून्ययातिर्भुक्त्वा
    वयसा सुतस्य चिरकालम् । निरविद्यतावितृप्तः कामं मन्येत दुष्पूरम् ॥ २९॥ बलिरिन्द्रजित्त्रिलोक्यां भुञ्जन्भोगांश्चिराद्विनष्टश्रीः
    । सुतलेऽबध्यत पाशैर्भोगान्क्षणभङ्गुरान्विद्यात् ॥ ३०॥ विलपन्तं हतपुत्रं धृतराष्ट्र वीक्ष्य करुणया
    कृष्णः । क्षणमनुशुशोच सास्रं दुःखितमनु दुःखितो भूयात् ॥ ३१॥ निःक्षत्रियां न चक्रे यावद्रामो भुवं रुषा
    तावत् । आसीद्रणैकतानो विरमेदसमाप्य नारब्धम् ॥ ३२॥ दुहिता विदेहभर्तुर्दाशरथेर्भामिनी सीता । वधमाप राक्षसीनां
    विधेर्विचित्रा गतिर्बोध्या ॥ ३३॥ निगमागमैकवेत्ता द्रोणस्तप्त्वा तपोऽर्थमन्विच्छन् । धानुष्कवृत्तिरासीद्धर्मं
    चार्थं च सेवेत ॥ ३४॥ अधिशम्भुमौलि निवसन्नेककलात्मा यथार्च्यते चन्द्रः । न तथा स पूर्णबिम्बः श्रयेन्महान्तं
    महत्त्वाय ॥ ३५॥ शरतल्पमधिशयानाद्भीष्मादाकर्ण्य धर्मजो धर्मान् । दुःखं जहौ दुरन्तं प्रष्टव्याः सत्पथं
    वृद्धाः ॥ ३६॥ कर्णेन घातयित्वा घटोत्कचं शक्रशक्तिनिर्मोक्षात् । जीवितमरक्षि पार्थैः स्वात्मानं सर्वतो
    रक्षेत् ॥ ३७॥ पृथुकोपहारपाणिर्हरिं सखायं प्रपद्य दीनात्मा । श्रीमानभूत्सुदामा श्रयेत सन्मित्त्रमापत्सु
    ॥ ३८॥ दृष्ट्वा हरिः समक्षं बाणत्राणाय कोटवीं नग्नाम् । समरे पराङ्मुखोऽभूत्स्त्रियं विवस्त्रां न वीक्षेत
    ॥ ३९॥ अदिशल्लक्ष्मणहेतोर्मारुतिमानेतुमोषधीं रामः । तामानयत्स दूराद्धुर्यः कार्ये नियोक्तव्यः ॥ ४०॥
    आराध्य कैतवज्ञो रौद्रं रुद्राद्वृको वरं लब्ध्वा । गौरीमियेष हर्तुं न विनीतं विश्वसेद्धूर्तम् ॥ ४१॥
    दशकण्ठरक्षितायां लङ्कायां रक्षसामभूद्वसताम् । गृहवित्तबन्धुनाशो वसेन्न राष्ट्रे कुभूपाले ॥ ४२॥ शप्त्वाम्बरीषमार्यं
    दुर्वासाः कोपनो निरागस्कम् । चक्रेण तापितोऽभून्न विदध्यात्क्रोधमस्थाने ॥ ४३॥ मखशिखिनि हूयमानं तक्षकमवितुं
    प्रपन्नमसमर्थः । अजहान्न तु पुरुहूतः शरणमुपेतो न हातव्यः ॥ ४४॥ हत्वा स्वसुस्तनूजान्सद्यो जातान्बहून्खलः
    कंसः । उत्सन्नः सहसाभून्न कुत्सितं कर्म कुर्वीत ॥ ४५॥ सीतां विसृज्य रामः साकं मुनिभिर्मुनिव्रतो राज्यम्
    । शासन्नुवास पुर्यां नेयः सद्भिः समं समयः ॥ ४६॥ कृष्णधनञ्जयभीमान्द्विजवेषस्थाञ्जरासुतश्चिह्नैः । क्षात्रैः
    क्षिप्रमजानादाकारैरिङ्गितं विद्यात् ॥ ४७॥ यां यां दिशं गतोऽभूद्धिरण्यकशिपुर्यदृच्छया विचरन् । तां
    तां सुराः प्रणेमुर्दुष्टजनं दूरतः प्रणमेत् ॥ ४८॥ कुर्वन्नपि मुनिशप्तः स्वजीवितार्थी परीक्षितो यत्नम्
    । दष्टोऽहिना विनष्टो ज्ञेयो मृत्युः सुदुर्वारः ॥ ४९॥ सदिति प्रतीयमानं जगन्मृषैवेति केवलं बुद्ध्वा
    । जनको विमुक्तिमागात्स्वप्नवदन्तर्जगद्बोध्यम् ॥ ५०॥ विहरन्वधूभिरन्तःपुरेऽग्निवर्णो दिवानिशं कामी ।
    ग्रस्तोऽथ यक्ष्मणाभूद्विषयान्विषभीषणान्विद्यात् ॥ ५१॥ विप्रः पतिर्वृषल्या हिंस्रोऽप्यभिवादनान्महर्षीणाम्
    । वाल्मीकिर्मुनिरासीत्पुरुषानभिवादयेन्महतः ॥ ५२॥ निशि कामयन्दुरात्मा द्रुपदसुतां कीचको रहः प्राप्ताम्
    । वधमाप भीमसेनात्परस्त्रियं नाभिकाङ्केत ॥ ५३॥ युधि कुरवः कृतवैरा वीरं व्यूहं विशन्तमभिमन्युम् । बहवो
    निजघ्नुरेवं नैको रिपुमण्डलं प्रविशेत् ॥ ५४॥ पुष्करनिर्जितराज्यः पुरमृतुपर्णस्य नैषधो गत्वा । सारथिरभून्निगूढो
    दुरवस्थो न प्रकाशः स्यात् ॥ ५५॥ क्षात्रं विमृष्य धर्मं मान्यैर्गुरुभिर्द्विजैः समं समरे । युयुधेऽर्जुनो
    धनुष्मान्घोरमपि स्वं चरेद्धर्मम् ॥ ५६॥ हरिरम्बुधिमथनोत्थां सुधां सुरेभ्यः सुरां सुरारिभ्यः । व्यतरत्समं
    यथार्हं योग्यं योग्याय दातव्यम् ॥ ५७॥ अथ चैकत्वमवाप्ताः सुरां निपीयोद्धता मिथो घ्नन्तः । युधि यादवाः
    प्रणेशुर्धीमान्मद्यं न सेवेत ॥ ५८॥ यज्ञोत्सवे स्वपित्रा हठादनाकारिता सती गत्वा । तनुमजहात्परिभूता
    क्वापि न गच्छेदनाहूतः ॥ ५९॥ मुचुकुन्देन मुकुन्दो यदुभिरवध्यस्य कालयवनस्य । छलतोऽचीकरदन्तं वध्योऽरिर्वञ्चयित्वापि
    ॥ ६०॥ असकृद्युधि विजितादपि भीतो बार्हद्रथाज्जले दुर्गम् । कृत्वा हरिन्यवात्सीद्विजितोऽप्याशङ्कनीयोऽरिः
    ॥ ६१॥ तुरगार्थेऽभिसरन्तः प्रकोप्य कपिलं क्षणात्समं सर्वे । सगरसुताः क्षयमीयुर्न कोपयेत्तापसं शान्तम्
    ॥ ६२॥ मुनिरपि विश्वामित्रः श्वा भूत्वा गूढमुर्वशीवशगः । अन्वव्रजत्स्मरार्तो भेतव्यं दुर्जयात्कामात्
    ॥ ६३॥ बलदर्पितस्त्रिलोक्यां तृणवद्गणयन्दशाननः शूरान् । युधि निर्जितः प्लवङ्गैर्न वहेद्गर्वम्बुधो मनसा
    ॥ ६४॥ मातुर्वाक्शरविद्धः पञ्चाब्दो दुष्करं तपस्तप्त्वा । ध्रुव उच्चैःपदमभजत्पुंसा व्यवसायिना भाव्यम्
    ॥ ६५॥ नीता रहसि सखीभ्यो बहुमहिता बल्लवी पथि श्रान्ता । वह मामिति हरिमूचे न ह्यतिसम्मानयेत्प्रमदाम्
    ॥ ६६॥ दधतः स्वलक्ष्म युद्धे मुहुः श
