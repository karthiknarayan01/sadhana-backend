id: anahateshvarasammohanakavacam-rudrayamalantargatam
category: kavacha
name:
  english: anahateshvarasammohanakavacam (rudrayamalantargatam)
  devanagari: अनाहतेश्वरसम्मोहनकवचम् (रुद्रयामलान्तर्गतम्)
content:
  english: 7|| etacchrisammohanamahakavacasya brahma rishiranushtup chandah ishvaro devata kakini shaktih
    krum kilakam dhyanasadhanasiddhaye hridabjabhedarthe jape viniyogah | pranavo me patu shirsham lalatam
    ca sadashivah | prasado hridayam patu bahuyugmam maheshvarah || 63
  devanagari: ७॥ एतच्छ्रीसम्मोहनमहाकवचस्य ब्रह्मा ऋषिरनुष्टुप् छन्दः ईश्वरो देवता काकिनी शक्तिः क्रूं
    कीलकं ध्यानसाधनसिद्धये हृदब्जभेदार्थे जपे विनियोगः । प्रणवो मे पातु शीर्षं ललाटं च सदाशिवः । प्रासादो
    हृदयं पातु बाहुयुग्मं महेश्वरः ॥ ६३
meaning: {}
