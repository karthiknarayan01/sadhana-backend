id: durga-suktam
category: stotram
name:
  english: Durga Suktam
content:
  english: om || jatavedase sunavama soma maratiyato nidahati vedah | sa nah par shadati durgani vishva
    naveva sindhu 'tyagnih || tamagnivarna nkarmaphaleshu jushta mprapadye sutarasi tarase namah || agne
    tva mparaya navyo asman thsvastibhirati durgani vishva | pushca prithvi bahula na urvi bhava tokaya
    tanayaya sham yo~h || vishvani no durgaha jataveda ssindhunna nava durita shi | agne atrivanmanasa
    grinano m || pritana jitagm sahamanamugramagnigm huvema paramathsadhastha shadati durgani vishva kshamaddevo
    ati durita 'tyagnih || pratnoshi kamidyo adhvareshu sanacca hota navyashca satsi | svanca mpiprayasvasmabhya
    nca saubhagamayajasva || gobhirjushtamayujo nishikta ndra vishnoranusancarema | nakasya prishthamabhi
    sam lo~ka iha madayantam || o nkatyayanaya vidmahe kanyakumari dhimahi | tanno durgih pracodaya
  devanagari: ओम् ॥ जा॒तवे॑दसे सुनवाम॒ सोम॑ मरातीय॒तो निद॑हाति॒ वेदः॑ । स नः॑ पर् ष॒दति॑ दु॒र्गाणि॒ विश्वा॑
    ना॒वेव॒ सिन्धु॑ ऽत्य॒ग्निः ॥ ताम॒ग्निव॑र्णा॒ ङ्क॑र्मफ॒लेषु॒ जुष्टा म्प्रप॑द्ये सु॒तर॑सि तरसे॒ नमः॑
    ॥ अग्ने॒ त्व म्पा॑रया॒ नव्यो॑ अ॒स्मान् थ्स्व॒स्तिभि॒रति॑ दु॒र्गाणि॒ विश्वा । पूश्च॑ पृ॒थ्वी ब॑हु॒ला
    न॑ उ॒र्वी भवा॑ तो॒काय॒ तन॑याय॒ शं योँः ॥ विश्वा॑नि नो दु॒र्गहा॑ जातवेद॒ स्सिन्धु॒न्न ना॒वा दु॑रि॒ता
    षि । अग्ने॑ अत्रि॒वन्मन॑सा गृणा॒नो म् ॥ पृ॒त॒ना॒ जित॒ग्ं॒ सह॑मानमु॒ग्रम॒ग्निग्ं हु॑वेम पर॒माथ्स॒धस्था
    ष॒दति॑ दु॒र्गाणि॒ विश्वा॒ क्षाम॑द्दे॒वो अति॑ दुरि॒ता ऽत्य॒ग्निः ॥ प्र॒त्नोषि॑ क॒मीड्यो॑ अध्व॒रेषु॑
    स॒नाच्च॒ होता॒ नव्य॑श्च॒ सत्सि॑ । स्वाञ्चा म्पि॒प्रय॑स्वा॒स्मभ्य॑ ञ्च॒ सौभ॑ग॒माय॑जस्व ॥ गोभि॒र्जुष्ट॑मयुजो॒
    निषि॑क्त॒ न्द्र विष्णो॒रनु॒सञ्च॑रेम । नाक॑स्य पृ॒ष्ठम॒भि सं॒ लोँ॒क इ॒ह मा॑दयन्ताम् ॥ ओ ङ्का॒त्या॒य॒नाय॑
    वि॒द्महे॑ कन्यकु॒मारि॑ धीमहि । तन्नो॑ दुर्गिः प्रचो॒दया
