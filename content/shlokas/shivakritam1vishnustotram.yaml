id: shivakritam1vishnustotram
category: stotram
name:
  english: shivakritam1vishnustotram
  devanagari: शिवकृतं१विष्णुस्तोत्रम्
content:
  english: 22|| mamashubham nashaya vigrahastham yadbrahmahatya'bhibhavam babhuva | dagdho'smi nashto'smyasamikshyakari
    punihi tirtho'si namo namaste || 3
  devanagari: २२॥ ममाशुभं नाशय विग्रहस्थं यद्ब्रह्महत्याऽभिभवं बभूव । दग्धोऽस्मि नष्टोऽस्म्यसमीक्ष्यकारी
    पुनीहि तीर्थोऽसि नमो नमस्ते ॥ ३
meaning: {}
