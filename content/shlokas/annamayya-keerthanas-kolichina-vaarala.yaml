id: annamayya-keerthanas-kolichina-vaarala
category: stotram
name:
  english: Annamayya Keerthanas Kolichina Vaarala
content:
  english: unknòvn pallavi kòlicina varala kòngupaiditadu | balimi taraka brahmamitadu || inavamshambudhi
    nègasina tejamu | ghanayajnambula gala phalamu | manujarupamuna maniyèdi brahmamu | ninuvula raghukula
    nidhanamitadu || kòlicina varala kòngupaiditadu paramannamulopali sarapujavi | paraginadivijula bhayaharamu
    | mariginasita mangalasutramu | dharalo ramavatarambitadu || kòlicina varala kòngupaiditadu cakitadanavula
    samharacakramu | sakala vanacarula jayakaramu | vikasitamagu shrivenkata nilayamu | prakatita dasharatha
    bhagyambitadu || kòlicina varala kòngupaiditadu
  devanagari: ऊन्क्नॊव्न् पल्लवि कॊलिचिन वारल कॊङ्गुपैडितडु । बलिमि तारक ब्रह्ममीतडु ॥ इनवंशाम्बुधि नॆगसिन
    तेजमु । घनयज्ञम्बुल गल फलमु । मनुजरूपमुन मनियॆडि ब्रह्ममु । निनुवुल रघुकुल निधानमीतडु ॥ कॊलिचिन वारल
    कॊङ्गुपैडितडु परमान्नमुलोपलि सारपुजवि । परगिनदिविजुल भयहरमु । मरिगिनसीता मङ्गलसूत्रमु । धरलो रामावतारम्बितडु
    ॥ कॊलिचिन वारल कॊङ्गुपैडितडु चकितदानवुल संहारचक्रमु । सकल वनचरुल जयकरमु । विकसितमगु श्रीवेङ्कट निलयमु
    । प्रकटित दशरथ भाग्यम्बितडु ॥ कॊलिचिन वारल कॊङ्गुपैडितडु
