id: m-itasanjivinimantra
category: mantra
name:
  english: mṟitasanjivinimantra
  devanagari: म्ऱितसन्जीविनीमन्त्र
content:
  english: nyasam mulena | viniyogah samakhyata stricatushcaikakam punah | shat catu dvikakenaiva shadamgani
    samacaret | 1 hrim hamsah
  devanagari: न्यासं मूलेन । विनियोगः समाख्यात स्त्रिचतुश्चैककं पुनः । षट् चतु द्विककेनैव षडंगानि समाचरेत्
    । १ ह्रीं हंसः
meaning: {}
source_attribution:
