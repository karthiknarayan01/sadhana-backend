id: bhaktajanaihkritamshivastotram
category: stotram
name:
  english: bhaktajanaihkritamshivastotram
  devanagari: भक्तजनैःकृतंशिवस्तोत्रम्
content:
  english: bhaktajanaih kritam shivastotram sadyojatamahadevaya te castu namo muhuh | mahakalaya ca kalabhairavaya
    ca te namah || 108|| ajapalaya ca virabhadraya te namo muhuh | mrityunjayaya ca mahakalyai candyai
    namo muhu || 109|| durgayai nama ityeva dinaprajastadocire | iti shrilakshminarayaniyasamhita | khanda
    2| adhyaya 90
  devanagari: भक्तजनैः कृतं शिवस्तोत्रम् सद्योजातमहादेवाय ते चास्तु नमो मुहुः । महाकालाय च कालभैरवाय च
    ते नमः ॥ १०८॥ अजापालाय च वीरभद्राय ते नमो मुहुः । मृत्युञ्जयाय च महाकाल्यै चाण्ड्यै नमो मुहु ॥ १०९॥
    दुर्गायै नम इत्येव दीनप्रजास्तदोचिरे । इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय ९०
meaning: {}
