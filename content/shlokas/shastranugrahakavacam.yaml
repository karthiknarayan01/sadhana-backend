id: shastranugrahakavacam
category: kavacha
name:
  english: shastranugrahakavacam
  devanagari: शास्त्रनुग्रहकवचम्
content:
  english: rinushvavahita priye || 9 asya shri mahashastuh kavacamantrasya | brahma rishih | gayatrih
    chandah | mahashasta devata | hram bijam | hrim shaktih | hrum kilakam | shri mahashastuh prasada
    siddhyarthe jape viniyogah || hram ityadi shadanganyasah || dhyanam || tejomandala madhyagam trinayanam
    divyambaralankritam devam pushpashareshu karmukalasanmanikyapatrabhayam | bibhranam karapankajaih
    madagaja skandhadhirudham vibhum shastaram sharanam vrajami satatam trailokya sammohanam || lam ityadi
    pancopacara puja || mahashasta shirah patu phalam hariharatmajah | kamarupi drisham patu sarvajno
    me shruti sada || 1 ghranam patu kripadhyaksho mukham gauripriyah sada | vedadhyayi ca me jihvam patu
    me cibukam guruh || 2 kantham patu vishuddhatma skandhau patu surarcitah | bahu patu virupakshah karau
    tu kamalapriyah || 3 bhutadhipo me hridayam madhyam patu mahabalah | nabhim patu mahavirah kamalaksho'vatat
    katim || 4 sanipam patu vishvesho guhyam guhyarthavitsada | uru patu gajarudho vajradhari ca januni
    || 5 janghe pashankushadharah padau patu mahamatih | sarvangam patu me nityam mahamayavisharadah ||
    6 itidam kavacam punyam sarvaghaughanikrintanam | mahavyadhiprashamanam mahapataka nashanam || 7 jnanavairagyadam
    divyamanimadivibhushitam | ayurarogyajananam mahavashyakaram param || 8 yam yam kamayate kamam tam
    tamapnotyasamshayah | trisandhyam yah pathedvidvan sa yati paramam gatim || iti shriguhyaratna cintamanau
    shrimahashastranugrahakavacam samaptam ||
  devanagari: ृणुष्वावहिता प्रिये ॥ ९ अस्य श्री महाशास्तुः कवचमन्त्रस्य । ब्रह्मा ऋषिः । गायत्रीः छन्दः
    । महाशास्ता देवता । ह्रां बीजम् । ह्रीं शक्तिः । ह्रूं कीलकम् । श्री महाशास्तुः प्रसाद सिद्ध्यर्थे
    जपे विनियोगः ॥ ह्रां इत्यादि षडङ्गन्यासः ॥ ध्यानम् ॥ तेजोमण्डल मध्यगं त्रिनयनं दिव्याम्बरालङ्कृतं
    देवं पुष्पशरेषु कार्मुकलसन्माणिक्यपात्राभयम् । बिभ्राणं करपङ्कजैः मदगज स्कन्धाधिरूढं विभुं शास्तारं
    शरणं व्रजामि सततं त्रैलोक्य संमोहनम् ॥ लं इत्यादि पञ्चोपचार पूजा ॥ महाशास्ता शिरः पातु फालं हरिहरात्मजः
    । कामरूपी दृशं पातु सर्वज्ञो मे श्रुती सदा ॥ १ घ्राणं पातु कृपाध्यक्षो मुखं गौरीप्रियः सदा । वेदाध्यायी
    च मे जिह्वां पातु मे चिबुकं गुरुः ॥ २ कण्ठं पातु विशुद्धात्मा स्कन्धौ पातु सुरार्चितः । बाहु पातु
    विरूपाक्षः करौ तु कमलाप्रियः ॥ ३ भूताधिपो मे हृदयं मध्यं पातु महाबलः । नाभिं पातु महावीरः कमलाक्षोऽवतात्
    कटीम् ॥ ४ सनीपं पातु विश्वेशो गुह्यं गुह्यार्थवित्सदा । ऊरु पातु गजारूढो वज्रधारी च जानुनी ॥ ५ जङ्घे
    पाशाङ्कुशधरः पादौ पातु महामतिः । सर्वाङ्गं पातु मे नित्यं महामायाविशारदः ॥ ६ इतीदं कवचं पुण्यं सर्वाघौघनिकृन्तनम्
    । महाव्याधिप्रशमनं महापातक नाशनम् ॥ ७ ज्ञानवैराग्यदं दिव्यमणिमादिविभूषितम् । आयुरारोग्यजननं महावश्यकरं
    परम् ॥ ८ यं यं कामयते कामं तं तमाप्नोत्यसंशयः । त्रिसन्ध्यं यः पठेद्विद्वान् स याति परमां गतिम् ॥
    इति श्रीगुह्यरत्न चिन्तामणौ श्रीमहाशास्त्रनुग्रहकवचं समाप्तम् ॥
