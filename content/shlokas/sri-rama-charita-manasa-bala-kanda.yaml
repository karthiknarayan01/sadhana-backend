    अबिनासी। साजु अमङ्गल मङ्गल रासी ॥ सुक सनकादि सिद्ध मुनि जोगी। नाम प्रसाद ब्रह्मसुख भोगी ॥ नारद जानेउ
    नाम प्रतापू। जग प्रिय हरि हरि हर प्रिय आपू ॥ नामु जपत प्रभु कीन्ह प्रसादू। भगत सिरोमनि भे प्रहलादू
    ॥ ध्रुवँ सगलानि जपेउ हरि न् ँ। पायु अचल अनूपम ठ् ँ ॥ सुमिरि पवनसुत पावन नामू। अपने बस करि राखे रामू
    ॥ अपतु अजामिलु गजु गनिक् । भे मुकुत हरि नाम प्रभ् ॥ कहौं कहाँ लगि नाम बड़आई। रामु न सकहिं नाम गुन
    गाई ॥ दो नामु राम को कलपतरु कलि कल्यान निवासु। जो सुमिरत भयो भाँग तें तुलसी तुलसीदासु ॥ ॥ चहुँ जुग
    तीनि काल तिहुँ लोका। भे नाम जपि जीव बिसोका ॥ बेद पुरान सन्त मत एहू। सकल सुकृत फल राम सनेहू ॥ ध्यानु
    प्रथम जुग मखबिधि दूजें। द्वापर परितोषत प्रभु पूजेम् ॥ कलि केवल मल मूल मलीना। पाप पयोनिधि जन जन मीना
    ॥ नाम कामतरु काल कराला। सुमिरत समन सकल जग जाला ॥ राम नाम कलि अभिमत दाता। हित परलोक लोक पितु माता ॥
    नहिं कलि करम न भगति बिबेकू। राम नाम अवलम्बन एकू ॥ कालनेमि कलि कपट निधानू। नाम सुमति समरथ हनुमानू ॥
    दो राम नाम नरकेसरी कनककसिपु कलिकाल। जापक जन प्रहलाद जिमि पालिहि दलि सुरसाल ॥ ॥ भायँ कुभायँ अनख आलसहूँ।
    नाम जपत मङ्गल दिसि दसहूँ ॥ सुमिरि सो नाम राम गुन गाथा। करुँ नाइ रघुनाथहि माथा ॥ मोरि सुधारिहि सो सब
