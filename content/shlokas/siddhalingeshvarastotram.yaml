  devanagari: निवृत्यध्वचारिणे गुरवे नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३२॥ नमः प्रवृत्तिनाशाय
    सद्वृत्यादर्श ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३३॥ नमो लिङ्गाङ्गसंयोगविदुषेयतये
    नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३४॥ नमस्ते श्री षट्स्थलज्ञ सार्वभौमाद्य ते नमः । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३५॥ नमःपूजक सत्कल्पभूजाय सुहृदे नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ३६॥ नमस्ते विश्वगुरुवे प्रमथावृत ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३७॥ नमस्ते
    शिष्यहृत्पापविच्छेद महते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३८॥ नमश्यिखाचक्रमध्यभासते
    ख्यात ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ३९॥ नमस्तेस्तु शरण्याय बुधगण्याय ते नमः ।
    नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४०॥ नमस्ते ब्रह्मवित्पूज्य चित्क्रियाराज ते नमः । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४१॥ नमस्ते जन्मनाशाय मृत्युदूराय ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ४२॥ नमस्ते विश्वरूपाय धूततापाय ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४३॥ नमः
    श्रुत्यन्त तत्त्वार्थबोधकायाढ्य ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४४॥ नमस्ते निष्कळङ्काय
    निर्विकल्पाय ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४५॥ नमशुद्ध सम्यज्ञाय समताभाव ते नमः
    । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४६॥ नमश्यिवस्वरूपाय भवरुग्भिषजे नमः । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ४७॥ नमस्ते विधिनिषेधरहितामेय ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः
    ॥ ४८॥ नमस्ते मोक्षलक्ष्मीश शिक्षिताहित ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ४९॥ नमस्ते
    जघ्द्भागधेयदाय सुक्षण ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५०॥ नमो भक्तमनोभीष्टददते
    सुधये नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५१॥ नमःपूतचरित्राय सर्वज्ञाय नमो नमः । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५२॥ नमस्ते नागभूषाय भूषितोडुप ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ५३॥ नमस्ते धृतकाषाय वस्त्रायानन्त ते नमः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५४॥
    पाहिमां परदारघ्नमन्यवित्तापहारिणम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५५॥ पाहिमामनृतोत्सुक्यं
    कोपविह्वलमानसम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५६॥ पाहिमां दुर्मदोन्मत्तं लोभावेशविजृम्भितम्
    । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ५७॥ पाहिमां कामसन्तप्तं मात्सर्यगुणलोलुपम् । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ५८॥ पाहिमां विषयासक्तं साधुसन्दोहदुःखदम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ५९॥ पाहिमां खलसंसर्गं दुर्भाषणकरोत्तमम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६०॥ पाहिमामुपकारघ्नं
    पिशुनत्वविहारिणम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६१॥ पाहिमामन्यसुगुरणान् तृणीकृत्य जयोद्वहम्
    । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६२॥ पाहिमां सत्यविमुखं नीचञ्चासत्यवादिनम् । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ६३॥ पाहिमां दुर्भवाम्भोधि लुठन्तं गुप्तपातकम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ६४॥ पाहिमां शान्तिरहितं रन्ध्रान्वेषणतत्परम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥
    ६५॥ पाहिमां त्यक्तसद्धर्मं शिवरामविभञ्जनम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६६॥ पाहिमां
    कृतविद्वेषमुक्तसद्गुरुदूषणम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६७॥ पाहिमामकृत श्रेष्ठलिङ्ग
    सद्गुरुपूजनम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६८॥ पाहिमां सर्वसम्पूज्य भस्मरुद्राक्षदूषणम्
    । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ६९॥ पाहिमां मदभूयिष्ठं मित्रभेदकरं खलम् । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ७०॥ पाहिमामज्ञसङ्गण्यं दुराशाकुलकीलितम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते
    नमः ॥ ७१॥ पाहिमां जननी भ्रातृ पितृशासन भञ्जनम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७२॥ पाहिमां
    दुर्वचोरम्यं स्वकीयोदर पोषकम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७३॥ पाहिमामयसम्पृक्तमाधिव्यूह
    समावृतम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७४॥ पाहिमां लसदाचारविहीनं कूटसाक्षिणम् । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७५॥ पाहिमां वसुधाभारभूतं दुर्वत्तिगामिनम् । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ७६॥ पाहिमां कुमताचारप्रवर्तकमनारतम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः
    ॥ ७७॥ पाहिमां दुर्यशोयुक्तं चित्क्रियामार्गतामसम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७८॥
    पाहिमां सद्भक्तिशून्यं करुणारसवर्जितम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ७९॥ पाहिमामविनीताग्रेसरं
    पापानुरागिणम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ८०॥ पाहिमां दीनभावाङ्कं शरणागतमन्वहम् ।
    नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ८१॥ ममापराधसन्दोहं क्षमस्वार्चकवत्सल । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ८२॥ अहम्भक्ति विहीनोपि पूजयामिष्टदो भव । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते
    नमः ॥ ८३॥ त्वत्तः परं देशिकेन्द्रं नजाने मुक्तिदायकम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥
    ८४॥ ममस्वान्ते सदा स्थित्वा ज्ञानं देहि गुरूत्तम । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ८५॥ त्वदीयपूतचारित्र्यं
    वर्णयामि सदा मुदा । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ८६॥ जय सर्वजगन्नाथ करुणारससागर । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ८७॥ जययोगीन्द्र साम्बापरावतार महेश्वर । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ८८॥ भवदङ्ग्रिद्वयं दुर्भवाब्धिमग्न नृणां प्लवम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः
    ॥ ८९॥ मन्त्रमूलं भवद्वाक्यं पूजामूलं पदं तव । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९०॥ मुक्तेस्तवदयाबीजं
    ध्यानहेतुस्तवाकृतिः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९१॥ प्रणामं कुर्वति मयि तव कोपः कथं
    भवेत् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९२॥ बालेनरचितेमन्तौ जनकस्तं त्यजेत्किमु । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९३॥ त्वमेव माता पिता दैवं बन्धुर्मित्रं सुखोत्सवम् । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ ९४॥ त्वां विना नहि लोकेस्मिन् भवरोगचिकित्सकः । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय
    ते नमः ॥ ९५॥ अतस्त्वत्पदमाश्रित्य याचे सुज्ञानसम्पदम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥
    ९६॥ मत्वायं भृत्य इति मां त्राहि त्राहि कृपाकर । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९७॥ स्तोत्रं
    कर्तुं न शक्नोमि न मन्ये पूजनक्रममम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९८॥ यच्छेत्तुष्टि
    यद्भवतस्तन्मया नविचारितम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ ९९॥ ज्ञानिभिस्सह पुत्रैश्च मां
    रक्ष जडधीषणम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १००॥ नभजेभवतस्त्वन्यं संस्थितेदातरित्वयि
    । नमस्ते सिद्धलिङ्गायं तोण्टदार्याय ते नमः ॥ १०१॥ जययोगीन्द्रतिलक पापपङ्कजकुञ्जर । नमस्ते सिद्धलिङ्गाय
    तोण्टदार्याय ते नमः ॥ १०२॥ जयमुक्तिरमाकान्त जयनिश्चिन्तनिर्व्यय । नमस्ते सिद्धलिङ्गायं तोण्टदार्याय
    ते नमः ॥ १०३॥ नत्यजत्वं कृपासिन्धो रक्ष मां शरणागतम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १०४॥
    मद्धृदज्ञानतिमिरं निवारय चिदर्क भो । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १०५॥ पापकूपनिमग्नाय
    मह्यं देहि कराश्रयम् । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १०६॥ त्वदङ्घ्रिदर्शनाज्जन्मसफलं देशिकेश्वर
    । नमस्ते सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १०७॥ भगवत्पदाब्ज सद्भक्तिं प्रार्थयामि जगद्गुरो । नमस्ते
    सिद्धलिङ्गाय तोण्टदार्याय ते नमः ॥ १०८॥ एतत् स्तोत्रं पठेद्यस्तु सप्राप्नोति महत्सुखम् । वित्तार्थी
    लभते वित्तं ज्ञानार्थी लभते चिदम् ॥ मोक्षार्थी लभते मोक्षं पुत्रार्थी लभते सुतम् । समस्तेष्टार्थसिद्धिस्स्यात्सयं
    सत्यमिदं वचः ॥ श्रीमत् तोण्टदार्यस्य स्तोत्रस्याष्टोत्तरं शुभम् । कथितं भक्तिभावेन माकुटी वीर सूरिणा
    ॥ इति मागडि श्रीवीरप्पशास्त्रिविरचितं श्रीसिद्धलिङ्गेश्वरस्तोत्रं सम्पूर्णम् ।
