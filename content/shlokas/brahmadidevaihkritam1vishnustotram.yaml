id: brahmadidevaihkritam1vishnustotram
category: stotram
name:
  english: brahmadidevaihkritam1vishnustotram
  devanagari: ब्रह्मादिदेवैःकृतं१विष्णुस्तोत्रम्
content:
  english: brahmadidevaih kritam 1 vishnustotram deva ucuh | namah pareshaya paratmarupine paratparayapararupadharine
    | brahmatmane brahmaratatmabuddhaye namo'stu te'vyahatakarmashiline || 11
  devanagari: ब्रह्मादिदेवैः कृतं १ विष्णुस्तोत्रम् देवा ऊचुः । नमः परेशाय परात्मरूपिणे परात्परायापररूपधारिणे
    । ब्रह्मात्मने ब्रह्मरतात्मबुद्धये नमोऽस्तु तेऽव्याहतकर्मशीलिने ॥ ११
meaning: {}
