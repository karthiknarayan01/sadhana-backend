    गिरजा गनराजा। मुदित महीपति सहित समाजा ॥ दो होहिं सगुन बरषहिं सुमन सुर दुन्दुभीं बजाइ। बिबुध बधू नाचहिं
    मुदित मञ्जुल मङ्गल गाइ ॥ ॥ मागध सूत बन्दि नट नागर। गावहिं जसु तिहु लोक उजागर ॥ जय धुनि बिमल बेद बर
    बानी। दस दिसि सुनिअ सुमङ्गल सानी ॥ बिपुल बाजने बाजन लागे। नभ सुर नगर लोग अनुरागे ॥ बने बराती बरनि
    न जाहीं। महा मुदित मन सुख न समाहीम् ॥ पुरबासिंह तब राय जोहारे। देखत रामहि भे सुखारे ॥ करहिं निछावरि
