id: dakshinamurtyupanishat
category: upanishad
name:
  english: dakshinamurtyupanishat
  devanagari: दक्षिणामूर्त्युपनिषत्
content:
  english: '| dayine padamuccarya mayine nama uddharet || 17 || anushtubho mantrarajah sarvamantrottamotamah
    || 18 || dhyanam | mudrapustakavahninagavilasadbahum prasannananam muktaharavibhushanam shashikalabhasvatkiritojjvalam
    | ajnanapahamadimadimagiramartham bhavanipatim nyagrodhantanivasinam paragurum dhyayamyabhishtaptaye
    || 19 || maunamudra | so''hamiti yavadasthitih sa nishtha bhavati ||20|| tadabhedena mantramredanam
    jnanasadhanam ||21|| citte tadekatanata parikarah ||22|| angaceshtarpanam balih ||23|| trini dhamani
    kalah |||24|| dvadashantapadam sthanamiti ||25|| te ha punah shraddadhanastam pratyucuh | katham va''syodayah
    | kim svarupam | ko va''syopasaka iti ||26|| sa hovaca | vairagyatailasampurne bhaktivartisamanvite
    | prabodhapurnapatre tu jnaptidipam vilokayet || 27 || mohandhakare nihsare udeti svayameva hi | vairagyamaranim
    kritva jnanam kritvottararanim || 28 || gadhatamisrasamshantyai gudhamartham nivedayet | mohabhanujasamkrantam
    vivekakhyam mrikandujam || 29 || tattvavicarapashena baddham dvaitabhayaturam | ujjivayannijanande
    svasvarupena samsthitah || 30 || shemushi dakshina prokta sa yasyabhikshane mukham | dakshinabhimukhah
    proktah shivo''sau brahmavadibhih || 31 || sargadikale bhagavanvirincirupasyainam sargasamarthyamapya
    | tutosha citte vanchitarthamshca labdhva dhanyah sopasyopasako bhavati dhata || 32 || ya imam paramarahasyashivatattvavidyamadhite
    sa sarvapapebhyo mukto bhavati | ya evam veda sa kaivalyamanubhavatityupanishat ||33|| iti dakshinamurtyupanishatsamapta'
  devanagari: । दायिने पदमुच्चार्य मायिने नम उद्धरेत् ॥ १७ ॥ आनुष्टुभो मन्त्रराजः सर्वमन्त्रोत्तमोतमः
    ॥ १८ ॥ ध्यानम् । मुद्रापुस्तकवह्निनागविलसद्बाहुं प्रसन्नाननं मुक्ताहारविभूषणं शशिकलाभास्वत्किरीटोज्ज्वलम्
    । अज्ञानापहमादिमादिमगिरामर्थं भवानीपतिं न्यग्रोधान्तनिवासिनं परगुरुं ध्यायाम्यभीष्टाप्तये ॥ १९ ॥ मौनमुद्रा
    । सोऽहमिति यावदास्थितिः सा निष्ठा भवति ॥२०॥ तदभेदेन मन्त्राम्रेडनं ज्ञानसाधनम् ॥२१॥ चित्ते तदेकतानता
    परिकरः ॥२२॥ अङ्गचेष्टार्पणं बलिः ॥२३॥ त्रीणि धामानि कालः ॥।२४॥ द्वादशान्तपदं स्थानमिति ॥२५॥ ते ह पुनः
    श्रद्दधानास्तं प्रत्यूचुः । कथं वाऽस्योदयः । किं स्वरूपम् । को वाऽस्योपासक इति ॥२६॥ स होवाच । वैराग्यतैलसंपूर्णे
    भक्तिवर्तिसमन्विते । प्रबोधपूर्णपात्रे तु ज्ञप्तिदीपं विलोकयेत् ॥ २७ ॥ मोहान्धकारे निःसारे उदेति स्वयमेव
    हि । वैराग्यमरणिं कृत्वा ज्ञानं कृत्वोत्तरारणिम् ॥ २८ ॥ गाढतामिस्रसंशान्त्यै गूढमर्थं निवेदयेत् ।
    मोहभानुजसंक्रान्तं विवेकाख्यं मृकण्डुजम् ॥ २९ ॥ तत्त्वाविचारपाशेन बद्धं द्वैतभयातुरम् । उज्जीवयन्निजानन्दे
    स्वस्वरूपेण संस्थितः ॥ ३० ॥ शेमुषी दक्षिणा प्रोक्ता सा यस्याभीक्षणे मुखम् । दक्षिणाभिमुखः प्रोक्तः
    शिवोऽसौ ब्रह्मवादिभिः ॥ ३१ ॥ सर्गादिकाले भगवान्विरिञ्चिरुपास्यैनं सर्गसामर्थ्यमाप्य । तुतोष चित्ते
    वाञ्छितार्थांश्च लब्ध्वा धन्यः सोपास्योपासको भवति धाता ॥ ३२ ॥ य इमां परमरहस्यशिवतत्त्वविद्यामधीते
    स सर्वपापेभ्यो मुक्तो भवति । य एवं वेद स कैवल्यमनुभवतीत्युपनिषत् ॥३३॥ इति दक्षिणामुर्त्युपनिषत्समाप्त
