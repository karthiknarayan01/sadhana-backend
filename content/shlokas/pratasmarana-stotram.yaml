id: pratasmarana-stotram
category: stotram
name:
  english: Pratasmarana Stotram
content:
  english: pratah smarami hridi samsphuradatmatattvam saccitsukham paramahamsagatim turiyam | yatsvapnajagarasushuptamavaiti
    nityam tadbrahma nishkalamaham na ca bhutasanghah || || pratarbhajami manasam vacasamagamyam vaco
    vibhanti nikhila yadanugrahena | yannetineti vacanairnigama avocuh tam devadevamajamacyutamahuragryam
    || || pratarnamami tamasah paramarkavarnam purnam sanatanapadam purushottamakhyam | yasminnidam jagadasheshamasheshamurtau
    rajjvam bhujangama iva pratibhasitam vai || || shlokatrayamidam punyam lokatrayavibhushanam pratah
    kale pathedyastu sa gacchetparamam padam ||
  devanagari: प्रातः स्मरामि हृदि संस्फुरदात्मतत्त्वं सच्चित्सुखं परमहंसगतिं तुरीयम् । यत्स्वप्नजागरसुषुप्तमवैति
    नित्यं तद्ब्रह्म निष्कलमहं न च भूतसङ्घः ॥ ॥ प्रातर्भजामि मनसां वचसामगम्यं वाचो विभान्ति निखिला यदनुग्रहेण
    । यन्नेतिनेति वचनैर्निगमा अवोचुः तं देवदेवमजमच्युतमाहुरग्र्यम् ॥ ॥ प्रातर्नमामि तमसः परमर्कवर्णं पूर्णं
    सनातनपदं पुरुषोत्तमाख्यम् । यस्मिन्निदं जगदशेषमशेषमूर्तौ रज्ज्वां भुजङ्गम इव प्रतिभासितं वै ॥ ॥ श्लोकत्रयमिदं
    पुण्यं लोकत्रयविभूषणम् प्रातः काले पठेद्यस्तु स गच्छेत्परमं पदम् ॥
