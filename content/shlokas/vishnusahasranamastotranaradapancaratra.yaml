id: vishnusahasranamastotranaradapancaratra
category: sahasranama
name:
  english: vishnusahasranamastotranaradapancaratra
  devanagari: विष्णुसहस्रनामस्तोत्रनारदपन्चरात्र
content:
  english: ringo jagadbijavahitradhrik | lilavyaptanilambhodhishcaturvedaprarvatakah || 66|| adikurmo'khiladharastrinikritajagadbhavah
    | amarikritadevaughah piyushotpattikaranam || 67|| atmadharo dharadharo yajnango dharanidharah | hiranyakshaharah
    pridhvipatih shraddhadikalpakah || 68|| samastapitribhitighnah samastapitrijivanam | havyakavyaikabhugbhavyo
    gunabhavyaikadayakah || 69|| lomantalinajaladhih kshobhitasheshasagarah | mahavaraho yajnaghnadhvamsano
    yajnikashrayah || 70|| narasimho divyasimhah sarvarishtartiduhkhaha | ekaviro'dbhutabalo yantramantraikabhanjanam
    || 71|| brahmadiduhsahajyotiryugantagnyatibhishanah | kotivajradhikanakho gajadushprekshamurtidhrik
    || 72|| matricakrapramathano mahamatriganeshvarah | acintyo'moghaviryadhyah samastasuraghasmarah ||
    73|| hiranyakashipucchedi kalah sankarshanah patih | kritantavahanah sadyah samastabhayanashanah ||
    74|| sarvavighnantakah sarvasiddhidah sarvapurakah | samastapatakadhvamsi siddhamantradhikahvayah
    || 75|| bhairavesho harartighna kalakalpo durasadah | daityagarbhasravinama sphuradbrahmandavarjitah
    || 76|| smritimatrakhilatrata bhutarupo mahaharih | brahmacarmashirahpatta dikpalo'rdhangabhushanah
    || 77|| dvadasharkashirodama rudrashirshaikanupurah | yoginigrastagirijarato bhairavatarjakah || 78||
    viracakreshvaro'tyugro yamarih kalasamvarah | krodheshvaro rudracandiparivadi sudushtabhak || 79||
    sarvakshah sarvamrityushca mrityurmrityunirvatakah | asadhyah sarvarogaghnah sarvadurgrahasaumyakrit
    || 80|| ganeshakotidarpaghno duhsaho'sheshagotraha | devadanavadurdhasho jagadbhakshyapradah pita
    || 81|| samastadurgatitrata jagadbhakshakabhakshakah | ugresho'suramarjarah kalamushakabhakshakah
    || 82|| anantayudhadorddando nrisimho virabhadrajit | yoginicakraguhyeshah shakrarih pashumamsabhuk
    || 83|| rudro narayano mesharupashankaravahanah | mesharupi shivatrata dushtashaktisahasrabhuk ||
    84|| tulasivallabho viro'cintyamayo'khileshtadah | mahashivah shivarudro bhairavaikakapalabhut ||
    85|| bhillashcakreshvarah shakro divyamohanarupadhrik | gaurisaubhagyado mayanidhirmayabhayapahah
    || 86|| brahmatejomayo brahma shrimayashca trayimayah | subrahmanyo balidhvamsi vamano'ditiduhkhaha
    || 87|| upendro nripatirvishnuh kashyapanvayamandanah | balisvarajyadah sarvadevavipratmado'cyutah
    || 88|| urukramastirthapadastridashashca trivikramah | vyomapadah svapadambhahpavitritajagattrayah
    || 89|| brahmeshadyabhivandyanghrirdrutakarmadridharanah | acintyadbhutavistaro vishvavriksho mahabalah
    || 90|| bahumurdha paranchidrabhrigupatnishiroharah | papasteyah sadapunyo daityesho nityakhandakah
    || 91|| puritakhiladevesho vishvarthaikavatarakrit | amaro nityaguptatma bhaktacintamanih sada ||
    92|| varadah kartaviryadirajarajyaprado'naghah | vishvashlaghyo'mitacaro dattatreyo munishvarah ||
    93|| parashaktisamayukto yoganandamadonmadah | samastendraritejohrit paramanandapadapah || 94|| anasuyagarbharatno
    bhogamokshasukhapradah | jamadagnikuladityo renukadbhutashaktihrit || 95|| matrihatyaghanirlepah skandajidviprarajyadah
    | sarvakshatrantakridviradarpaha kartaviryajit || 96|| yogi yogavatarashca yogisho yogavatparah |
    paramanandadata ca shivacaryayashahpradah || 97|| bhimah parashuramashca shivacaryaikavishvabhuh |
    shivakhilajnanakosho bhishmacaryo'gnidaivatah || 98|| dronacaryagururvishvajaitradhanva kritantakrit
    | advitiyatamomurtirbrahmacaryaikadakshinah || 99|| manushreshthah satam seturmahiyan vrishabho virat
    | adirajah kshitipita sarvaratnaikadohakrit || 100|| prithujanmadyekadaksho hrih shrih kirtih svayamdhritih
    | jagadvrittipradashcakravartishreshtho durastradhrik || 101|| sanakadimunipraptabhagavadbhaktivardhanah
    | varnashramadidharmanam karta vakta pravartakah || 102|| suryavamshadhvajo ramo radhavah sadgunarnavah
    | kakutsthaviratadharmo rajadharmadhurandharah || 103|| nityasusthashayah sarvabhadragrahi shubhaikadrik
    | navaratnam ratnanidhih sarvadhyaksho mahanidhih || 104|| sarvashreshthashrayah sarvashastrastragramaviryavan
    | jagadvashi dasharathih sarvaratnashrayo nripah || 105|| dharmah samastadharmastho dharmadrashtakhilartihrit
    | atindro jnanavijnanaparadrishva kshamambudhih || 106|| sarvaprakrishtah shishteshto harshashokadhanakulah
    | pitrajnatyaktasamrajyah sapatnodayanirbhayah || 107|| guhadesharpitaishvaryah shivasparddhajatadharah
    | citrakutaptaratnadrijagadisho ranecarah || 108|| yatheshtamoghashastrastro devendratanayakshiha
    | brahmendradinataishiko maricaghno viradhaha || 109|| brahmashapahatasheshadandakaranyapavanah |
    caturdashasahasragryarakshoghnaikasharaikabhrit || 110|| khararistrishirohanta dushanaghno janardanah
    | jatayusho'gnigatido kabandhasvargadayakah || 111|| liladhunahkotyapastadundubhyasthimahacayah |
    saptatalavyathakrishtadhvajapataladanavah || 112|| sugrive rajyado dhiman manasaivabhayapradah | hanumadrudramukhyeshah
    samastakapidehabhrit || 113|| agnidaivatyabanaikavyakulikritasagarah | samlicchakotibanaikashushkanirdagdhasagarah
    || 114|| sanagadaityadhamaikavyakulikritasagarah | samudradbhutapurvaikabaddhaseturyashonidhih ||
    115|| asadhyasadhako lankasamulotkarshadakshinah | varadriptajanasthanapaulastyakalakrintanah || 116||
    ravanaghnah prahastacchit kumbhakarnabhidugraha | ravanaikamukhacchetta nihshankendraikarajyadah ||
    117|| svargasvargatvavicchedi devendradindrataharah | rakshodevatvahriddharma dharmaharmyah purushtutah
    || 118|| natimatradashasyarirdattarajyavibhishanah | sudhasrishtibhritasheshasvasainyajivanaikakrit
    || 119|| devabrahmananamaikadhata sarvamararcitah | brahmasuryendrarudradivandyo'rcitasatam priyah
    || 120|| ayodhyakhilarajagrya sarvabhutamanoharah | svamyatulyakripadatto hinoshkrishtaikasatpriyah
    || 121|| svapakshadinyayadarshi hinartho'dhikasadhakah | badhavyajanucitakrittavako'khilatushtikrit
    || 122|| parvatyadhikayuktatma priyatyaktah surarijit | sakshatkushalavatsadmendragninato'parajitah
    || 123|| koshalendro virabahuh satyarthatyaktasodarah | yashodanandano nandi dharanimandalodayah ||
    124|| brahmadikamyasannidhyasanathikritadaivatah | brahmalokaptacandaladyasheshapranisarthapah ||
    125|| svarnitagardabhashvadicirayodhyabalaikakrit | ramadvitiyah saumitrilakshmanaprahatendrajit ||
    126|| vishnubhaktashivamhahchitpadukarajyanirvritah | bharato'sahyagandharvakotighno lavanantakah
    || 127|| shatrughno vaidyaradayurvedagarbhaushadhipatih | nityanityakaro dhanvantariryajno jagaddharah
    || 128|| suryavighnah surajivo dakshinesho dvijapriyah | chinnamurdhopadesharkatanujakritamaitrikah
    || 129|| sheshangasthapitanarah kapilah kardamatmajah | yogatmakadhyanabhangasagaratmajabhasmakrit
    || 130|| dharmo vishvendrasurabhipatih shuddhatmabhavitah | shambhustripuradahaikasthairyavishvarathoddhatah
    || 131|| vishvatmashesharudrarthashirashchedakshatakritih | vajapeyadinamagnirvedadharmaparayanah
    || 132|| shvetadvipapatih sankhyapraneta sarvasiddhirat | vishvaprakashitadhyanayogo mohatamisraha
    || 133|| bhaktashambhujito daityamritavapisamastapah | mahapralayavishvaiko'dvitiyo'khiladaityarat
    || 134|| sheshadevah sahasrakshah sahasranghishirobhujah | phani phaniphanakarayojitabdhyambudakshitih
    || 135|| kalagnirudrajanako musalastro halayudhah | nilambaro varunisho manovakkayadoshaha || 136||
    svasantoshatriptimatrah patitaikadashananah | balisamyamano ghoro rauhineyah pralambaha || 137|| mushtikaghno
    dvividaha kalindibhedano balah | revatiramanah purvabhaktirevacyutagrajah || 138|| devakivasudevottho'ditikashyapanandanah
    | varshneyah satvatam shreshthah shauriryadukulodvahah || 139|| narakritih purnabrahma savyasaci parantapah
    | brahmadikamananityajagatparvetashaishavah || 140|| putanaghnah shakatabhidyamalarjunabhanjanah |
    vatsamurarih keshighno dhenukarirgavishvarah || 141|| damodaro gopadevo yashodanandakarakah | kaliyamarddanah
    sarvagopagopijanapriyah || 142|| lilagovardhanadharo govindo gokulotsavah | arishtamathanah kamonmattagopivimuktidah
    || 143|| sadyah kuvalayapidaghati canuramardanah | kamsarirugrasenadirajyasthayyariha'marah || 144||
    sudharmamkitabhuloko jarasandhabalantakah | tyaktabhaktajarasandhabhimasenayashahpradah || 145|| sandipanimritapatyadata
    kalantakadijit | rukminiramano rukmishasano narakantakrit || 146|| samastanarakatrata sarvabhupatikotijit
    | samastasundarikanto'surarirgarudadhvajah || 147|| ekakijitarudrarkamarudapo'khileshvarah | devendradarpaha
    kalpadrumalankritabhutalah || 148|| banabahusahasracchitskandadiganakotijit | lilajitamahadevo mahadevaikapujitah
    || 149|| indrartharjunanirmatsurjayadah pandavaikadhrik | kashirajashiraschetta rudrashaktyekamardanah
    || 150|| vishveshvaraprasadadhyah kashirajasutardanah | shambhupratijnapata ca svayambhuganapujakah
    || 151|| kashishaganakotighno lokashikshadvijarcakah | shivativratapovashyah pura shivavarapradah
    || 152|| gayasurapratijnadhrik svamshashankarapujakah | shivakanyavratapatih krishnarupashivariha
    || 153|| mahalakshmivapurgauritrano devalavataha | vinidramucukundaikabrahmastrayuvanashvahrit ||
    154|| akruro'kruramukhyaikabhaktasvacchandamuktidah | sabalastrijalakridakritavapikritarnavah || 155||
    yamunapatiranitaparinitadvijatmakah | shridamashankubhaktarthabhumyanitendrabhairavah || 156|| durvrittashishupalaikamuktikoddharakeshvarah
    | acandaladikam prapya dvarakanidhikotikrit || 157|| brahmastradagdhagarbhasthaparikshijjivanaikakrit
    | parinitadvijasutaneta'rjunamadapahah || 158|| gudhamudrakritigrastabhishmadyakhilagauravah | partharthakhanditasheshadivyastrah
    parthamohabhrit || 159|| brahmashapacchaladhvastayadavo vibhavavahah | anange jitagaurisho ratikantah
    sadepsitah || 160|| pushpeshurvishvavijayi smarah kameshvaripatih | ushapatirvishvaheturvishvatripto'dhipurushah
    || 161|| caturatma caturvarnashcaturvedavidhayakah | caturvishvaikavishvatma sarvotkrishtasu kotishu
    || 162|| ashrayatma puranarshirvyasah shastrasahasrakrit | mahabharatanirmata kavindro vadarayanah
    || 163|| krishnadvaipayanah sarvapurusharthakabodhakah | vedantakarta brahmaikavyanjakah puruvamshakrit
    || 164|| buddho dhyanajitasheshadevadevo jagatpriyah | nirayudho jagajjaitrah shridhano dushtamohanah
    || 165|| daityavedabahishkartta vedarthashrutigopakah | shuddhodanirnashtadishtah sukhadah sadasatpatih
    || 166|| yathayogyakhilakupah sarvashunyo'khileshtadah | catushkotiprithaktattvam prajnaparamiteshvarah
    || 167|| pashandashrutimargena pashandashrutigopakah | kalki vishnuyashah putah kalikalavilopakah
    || 168|| samastamlecchahastaghnah sarvashishtadvijatikrit | satyapravarttako devadvijadirghakshudhapahah
    || 169|| avagavadivedena prithvidurgatinashanah | sadyah kshmanantalakshmikrit nashtanih shesha dharmakrit
    || 170|| anantasvargayagaikahemapurnakhiladvijah | asadhyaikajagacchasta vishvavandyo jayadhvajah
    || 171|| atmatattvadhipah krirtrishreshtho vidhirumapatih | bhartuh shreshthah prajeshagryo maricijanakagranih
    || 172|| kashyapo devaradindrah prahlado daityarat shashi | nakshatresho ravistejah shreshthah shukrah
    kavishvarah || 173|| maharshirat bhrigurvishnuradityesho balih svarat | vayurvahnih shucishreshthah
    shankaro rudrarat guruh || 174|| vidvattamashcitraratho gandharvagryo vasuttamah | varnadiragrya stri
    gauri shaktyagrya shrishca naradah || 175|| devarshirat pandavagryo'rjuno naradavadarat | pavanah
    pavaneshano varuno yadasampatih || 176|| gangatirthottamodbhutam chatrakagryavaraushadham | annam
    sudarshanastragryo vajrapraharanottamam || 177|| uccaihshrava vajirajah airavata ibheshvarah | arundhatyekapatnisho
    hyashvattho'sheshavriksharat || 178|| adhyatmavidyavidyatma pranavashchandasam varah | merurgiripatirbhargo
    masagryah kalasattamah || 179|| dinadyatma purvasiddhih kapilah samavedarat | tarkshyah khagendro
    ritvagryo vasantah kalpapadapah || 180|| datrishreshthah kamadhenurartighnagryah surottamah | cintamanirgurushreshtho
    mata hitatamah pita || 181|| simho mrigendro nagendro vasukirbhudharo nripah | vanasho brahmanashcantah
    karanagryam namo namah || 182|| ityetadvasudevasya vishnornamasahasrakam | sarvaparadhashamanam param
    bhaktivivarddhanam || 183|| akshayabrahmalokadisarvarthapyekasadhanam | vishnulokaikasopanam sarvadu
  devanagari: ृङ्गो जगद्बीजवहित्रधृक् । लीलाव्याप्तानिलाम्भोधिश्चतुर्वेदप्रर्वतकः ॥ ६६॥ आदिकूर्मोऽखिलाधारस्तृणीकृतजगद्भवः
    । अमरीकृतदेवौघः पीयूषोत्पत्तिकारणम् ॥ ६७॥ आत्माधारो धराधारो यज्ञाङ्गो धरणीधरः । हिरण्याक्षहरः पृध्वीपतिः
    श्राद्धादिकल्पकः ॥ ६८॥ समस्तपितृभीतिघ्नः समस्तपितृजीवनम् । हव्यकव्यैकभुग्भव्यो गुणभव्यैकदायकः ॥ ६९॥
    लोमान्तलीनजलधिः क्षोभिताशेषसागरः । महावराहो यज्ञघ्नध्वंसनो याज्ञिकाश्रयः ॥ ७०॥ नरसिंहो दिव्यसिंहः
    सर्वारिष्टार्तिदुःखहा । एकवीरोऽद्भुतबलो यन्त्रमन्त्रैकभञ्जनम् ॥ ७१॥ ब्रह्मादिदुःसहज्योतिर्युगान्ताग्न्यतिभीषणः
    । कोटिवज्राधिकनखो गजदुष्प्रेक्षमूर्तिधृक् ॥ ७२॥ मातृचक्रप्रमथनो महामातृगणेश्वरः । अचिन्त्योऽमोघवीर्याढ्यः
    समस्तासुरघस्मरः ॥ ७३॥ हिरण्यकशिपुच्छेदी कालः सङ्कर्षणः पतिः । कृतान्तवाहनः सद्यः समस्तभयनाशनः ॥ ७४॥
    सर्वविघ्नान्तकः सर्वसिद्धिदः सर्वपूरकः । समस्तपातकध्वंसी सिद्धमन्त्राधिकाह्वयः ॥ ७५॥ भैरवेशो हरार्तिघ्न
    कालकल्पो दुरासदः । दैत्यगर्भस्राविनामा स्फुरद्ब्रह्माण्डवर्जितः ॥ ७६॥ स्मृतिमात्राखिलत्राता भूतरूपो
    महाहरिः । ब्रह्मचर्मशिरःपट्टा दिक्पालोऽर्धाङ्गभूषणः ॥ ७७॥ द्वादशार्कशिरोदामा रुद्रशीर्षैकनूपुरः ।
    योगिनीग्रस्तगिरिजारतो भैरवतर्जकः ॥ ७८॥ वीरचक्रेश्वरोऽत्युग्रो यमारिः कालसंवरः । क्रोधेश्वरो रुद्रचण्डीपरिवादी
    सुदुष्टभाक् ॥ ७९॥ सर्वाक्षः सर्वमृत्युश्च मृत्युर्मृत्युनिर्वतकः । असाध्यः सर्वरोगघ्नः सर्वदुर्ग्रहसौम्यकृत्
    ॥ ८०॥ गणेशकोटिदर्पघ्नो दुःसहोऽशेषगोत्रहा । देवदानवदुर्धषो जगद्भक्ष्यप्रदः पिता ॥ ८१॥ समस्तदुर्गतित्राता
    जगद्भक्षकभक्षकः । उग्रेशोऽसुरमार्जारः कालमूषकभक्षकः ॥ ८२॥ अनन्तायुधदोर्द्दण्डो नृसिंहो वीरभद्रजित्
    । योगिनीचक्रगुह्येशः शक्रारिः पशुमांसभुक् ॥ ८३॥ रुद्रो नारायणो मेषरूपशङ्करवाहनः । मेषरूपी शिवत्राता
    दुष्टशक्तिसहस्रभुक् ॥ ८४॥ तुलसीवल्लभो वीरोऽचिन्त्यमायोऽखिलेष्टदः । महाशिवः शिवारुद्रो भैरवैककपालभूत्
    ॥ ८५॥ भिल्लश्चक्रेश्वरः शक्रो दिव्यमोहनरूपधृक् । गौरीसौभाग्यदो मायानिधिर्मायाभयापहः ॥ ८६॥ ब्रह्मतेजोमयो
    ब्रह्म श्रीमयश्च त्रयीमयः । सुब्रह्मण्यो बलिध्वंसी वामनोऽदितिदुःखहा ॥ ८७॥ उपेन्द्रो नृपतिर्विष्णुः
    कश्यपान्वयमण्डनः । बलिस्वाराज्यदः सर्वदेवविप्रात्मदोऽच्युतः ॥ ८८॥ उरुक्रमस्तीर्थपादस्त्रिदशश्च त्रिविक्रमः
    । व्योमपादः स्वपादाम्भःपवित्रितजगत्त्रयः ॥ ८९॥ ब्रह्मेशाद्यभिवन्द्याङ्घ्रिर्द्रुतकर्माद्रिधारणः ।
    अचिन्त्याद्भुतविस्तारो विश्ववृक्षो महाबलः ॥ ९०॥ बहुमूर्धा पराङ्छिद्रभृगुपत्नीशिरोहरः । पापस्तेयः सदापुण्यो
    दैत्येशो नित्यखण्डकः ॥ ९१॥ पूरिताखिलदेवेशो विश्वार्थैकावतारकृत् । अमरो नित्यगुप्तात्मा भक्तचिन्तामणिः
    सदा ॥ ९२॥ वरदः कार्तवीर्यादिराजराज्यप्रदोऽनघः । विश्वश्लाघ्योऽमिताचारो दत्तात्रेयो मुनीश्वरः ॥ ९३॥
    पराशक्तिसमायुक्तो योगानन्दमदोन्मदः । समस्तेन्द्रारितेजोहृत् परमानन्दपादपः ॥ ९४॥ अनसूयागर्भरत्नो भोगमोक्षसुखप्रदः
    । जमदग्निकुलादित्यो रेणुकाद्भुतशक्तिहृत् ॥ ९५॥ मातृहत्यघनिर्लेपः स्कन्दजिद्विप्रराज्यदः । सर्वक्षत्रान्तकृद्वीरदर्पहा
    कार्तवीर्यजित् ॥ ९६॥ योगी योगावतारश्च योगीशो योगवत्परः । परमानन्ददाता च शिवाचार्ययशःप्रदः ॥ ९७॥ भीमः
    परशुरामश्च शिवाचार्यैकविश्वभूः । शिवाखिलज्ञानकोषो भीष्माचार्योऽग्निदैवतः ॥ ९८॥ द्रोणाचार्यगुरुर्विश्वजैत्रधन्वा
    कृतान्तकृत् । अद्वितीयतमोमूर्तिर्ब्रह्मचर्यैकदक्षिणः ॥ ९९॥ मनुश्रेष्ठः सतां सेतुर्महीयान् वृषभो विराट्
    । आदिराजः क्षितिपिता सर्वरत्नैकदोहकृत् ॥ १००॥ पृथुजन्माद्येकदक्षो ह्रीः श्रीः कीर्तिः स्वयंधृतिः ।
    जगद्वृत्तिप्रदश्चक्रवर्तिश्रेष्ठो दुरस्त्रधृक् ॥ १०१॥ सनकादिमुनिप्राप्तभगवद्भक्तिवर्धनः । वर्णाश्रमादिधर्माणां
    कर्ता वक्ता प्रवर्तकः ॥ १०२॥ सूर्यवंशध्वजो रामो राधवः सद्गुणार्णवः । काकुत्स्थवीरताधर्मो राजधर्मधुरन्धरः
    ॥ १०३॥ नित्यसुस्थाशयः सर्वभद्रग्राही शुभैकदृक् । नवरत्नं रत्ननिधिः सर्वाध्यक्षो महानिधिः ॥ १०४॥ सर्वश्रेष्ठाश्रयः
    सर्वशस्त्रास्त्रग्रामवीर्यवान् । जगद्वशी दाशरथिः सर्वरत्नाश्रयो नृपः ॥ १०५॥ धर्मः समस्तधर्मस्थो धर्मद्रष्टाखिलार्तिहृत्
    । अतीन्द्रो ज्ञानविज्ञानपारदृश्वा क्षमाम्बुधिः ॥ १०६॥ सर्वप्रकृष्टः शिष्टेष्टो हर्षशोकाधनाकुलः । पित्राज्ञात्यक्तसाम्राज्यः
    सपत्नोदयनिर्भयः ॥ १०७॥ गुहादेशार्पितैश्वर्यः शिवस्पर्द्धाजटाधरः । चित्रकूटाप्तरत्नाद्रिजगदीशो रणेचरः
    ॥ १०८॥ यथेष्टामोघशस्त्रास्त्रो देवेन्द्रतनयाक्षिहा । ब्रह्मेन्द्रादिनतैषीको मारीचघ्नो विराधहा ॥ १०९॥
    ब्रह्मशापहताशेषदण्डकारण्यपावनः । चतुर्दशसहस्राग्र्यरक्षोघ्नैकशरैकभृत् ॥ ११०॥ खरारिस्त्रिशिरोहन्ता
    दूषणघ्नो जनार्दनः । जटायुषोऽग्निगतिदो कबन्धस्वर्गदायकः ॥ १११॥ लीलाधुनःकोट्यापास्तदुन्दुभ्यस्थिमहाचयः
    । सप्ततालव्यथाकृष्टध्वजपातालदानवः ॥ ११२॥ सुग्रीवे राज्यदो धीमान् मनसैवाभयप्रदः । हनूमद्रुद्रमुख्येशः
    समस्तकपिदेहभृत् ॥ ११३॥ अग्निदैवत्यबाणैकव्याकुलीकृतसागरः । सम्लिच्छकोटिबाणैकशुष्कनिर्दग्धसागरः ॥ ११४॥
    सनागदैत्यधामैकव्याकुलीकृतसागरः । समुद्राद्भुतपूर्वैकबद्धसेतुर्यशोनिधिः ॥ ११५॥ असाध्यसाधको लङ्कासमूलोत्कर्षदक्षिणः
    । वरदृप्तजनस्थानपौलस्त्यकलकृन्तनः ॥ ११६॥ रावणघ्नः प्रहस्तच्छित् कुम्भकर्णभिदुग्रहा । रावणैकमुखच्छेत्ता
    निःशङ्केन्द्रैकराज्यदः ॥ ११७॥ स्वर्गास्वर्गत्वविच्छेदी देवेन्द्रादिन्द्रताहरः । रक्षोदेवत्वहृद्धर्मा
    धर्महर्म्यः पुरुष्टुतः ॥ ११८॥ नातिमात्रदशास्यारिर्दत्तराज्यविभीषणः । सुधासृष्टिभृताशेषस्वसैन्यजीवनैककृत्
    ॥ ११९॥ देवब्राह्मणनामैकधाता सर्वामरार्चितः । ब्रह्मसूर्येन्द्ररुद्रादिवन्द्योऽर्चितसतां प्रियः ॥ १२०॥
    अयोध्याखिलराजाग्र्य सर्वभूतमनोहरः । स्वाम्यतुल्यकृपादत्तो हीनोष्कृष्टैकसत्प्रियः ॥ १२१॥ स्वपक्षादिन्यायदर्शी
    हीनार्थोऽधिकसाधकः । बाधव्याजानुचितकृत्तावकोऽखिलतुष्टिकृत् ॥ १२२॥ पार्वत्यधिकयुक्तात्मा प्रियात्यक्तः
    सुरारिजित् । साक्षात्कुशलवत्सद्मेन्द्राग्निनातोऽपराजितः ॥ १२३॥ कोशलेन्द्रो वीरबाहुः सत्यार्थत्यक्तसोदरः
    । यशोदानन्दनो नन्दी धरणीमण्डलोदयः ॥ १२४॥ ब्रह्मादिकाम्यसान्निध्यसनाथीकृतदैवतः । ब्रह्मलोकाप्तचाण्डालाद्यशेषप्राणिसार्थपः
    ॥ १२५॥ स्वर्णीतगर्दभश्वादिचिरायोध्याबलैककृत् । रामाद्वितीयः सौमित्रिलक्ष्मणप्रहतेन्द्रजित् ॥ १२६॥
    विष्णुभक्ताशिवांहःछित्पादुकाराज्यनिर्वृतः । भरतोऽसह्यगन्धर्वकोटिघ्नो लवणान्तकः ॥ १२७॥ शत्रुघ्नो वैद्यराडायुर्वेदगर्भौषधीपतिः
    । नित्यानित्यकरो धन्वन्तरिर्यज्ञो जगद्धरः ॥ १२८॥ सूर्यविघ्नः सुराजीवो दक्षिणेशो द्विजप्रियः । छिन्नमूर्धोपदेशार्कतनूजकृतमैत्रिकः
    ॥ १२९॥ शेषाङ्गस्थापितनरः कपिलः कर्दमात्मजः । योगात्मकध्यानभङ्गसगरात्मजभस्मकृत् ॥ १३०॥ धर्मो विश्वेन्द्रसुरभीपतिः
    शुद्धात्मभावितः । शम्भुस्त्रिपुरदाहैकस्थैर्यविश्वरथोद्धतः ॥ १३१॥ विश्वात्माशेषरुद्रार्थशिरश्छेदाक्षताकृतिः
    । वाजपेयादिनामाग्निर्वेदधर्मापरायणः ॥ १३२॥ श्वेतद्वीपपतिः साङ्ख्यप्रणेता सर्वसिद्धिराट् । विश्वप्रकाशितध्यानयोगो
    मोहतमिस्रहा ॥ १३३॥ भक्तशम्भुजितो दैत्यामृतवापीसमस्तपः । महाप्रलयविश्वैकोऽद्वितीयोऽखिलदैत्यराट् ॥ १३४॥
    शेषदेवः सहस्राक्षः सहस्राङ्घिशिरोभुजः । फणी फणिफणाकारयोजिताब्ध्यम्बुदक्षितिः ॥ १३५॥ कालाग्निरुद्रजनको
    मुसलास्त्रो हलायुधः । नीलाम्बरो वारुणीशो मनोवाक्कायदोषहा ॥ १३६॥ स्वसन्तोषतृप्तिमात्रः पातितैकदशाननः
    । बलिसंयमनो घोरो रौहिणेयः प्रलम्बहा ॥ १३७॥ मुष्टिकघ्नो द्विविदहा कालिन्दीभेदनो बलः । रेवतीरमणः पूर्वभक्तिरेवाच्युताग्रजः
    ॥ १३८॥ देवकीवसुदेवोत्थोऽदितिकश्यपनन्दनः । वार्ष्णेयः सात्वतां श्रेष्ठः शौरिर्यदुकुलोद्वहः ॥ १३९॥ नराकृतिः
    पूर्णब्रह्म सव्यसाची परन्तपः । ब्रह्मादिकामनानित्यजगत्पर्वेतशैशवः ॥ १४०॥ पूतनाघ्नः शकटभिद्यमलार्जुनभञ्जनः
    । वत्सामुरारिः केशिघ्नो धेनुकारिर्गवीश्वरः ॥ १४१॥ दामोदरो गोपदेवो यशोदानन्दकारकः । कालीयमर्द्दनः सर्वगोपगोपीजनप्रियः
    ॥ १४२॥ लीलागोवर्धनधरो गोविन्दो गोकुलोत्सवः । अरिष्टमथनः कामोन्मत्तगोपीविमुक्तिदः ॥ १४३॥ सद्यः कुवलयापीडघाती
    चाणूरमर्दनः । कंसारिरुग्रसेनादिराज्यस्थाय्यरिहाऽमरः ॥ १४४॥ सुधर्मांकितभूलोको जरासन्धबलान्तकः । त्यक्तभक्तजरासन्धभीमसेनयशःप्रदः
    ॥ १४५॥ सान्दीपनिमृतापत्यदाता कालान्तकादिजित् । रुक्मिणीरमणो रुक्मिशासनो नरकान्तकृत् ॥ १४६॥ समस्तनरकत्राता
    सर्वभूपतिकोटिजित् । समस्तसुन्दरीकान्तोऽसुरारिर्गरुडध्वजः ॥ १४७॥ एकाकीजितरुद्रार्कमरुदापोऽखिलेश्वरः
    । देवेन्द्रदर्पहा कल्पद्रुमालङ्कृतभूतलः ॥ १४८॥ बाणबाहुसहस्रच्छित्स्कन्दादिगणकोटिजित् । लीलाजितमहादेवो
    महादेवैकपूजितः ॥ १४९॥ इन्द्रार्थार्जुननिर्मत्सुर्जयदः पाण्डवैकधृक् । काशीराजशिरस्छेत्ता रुद्रशक्त्येकमर्दनः
    ॥ १५०॥ विश्वेश्वरप्रसादाढ्यः काशीराजसुतार्दनः । शम्भुप्रतिज्ञापाता च स्वयम्भुगणपूजकः ॥ १५१॥ काशीशगणकोटिघ्नो
    लोकशिक्षाद्विजार्चकः । शिवतीव्रतपोवश्यः पुरा शिववरप्रदः ॥ १५२॥ गयासुरप्रतिज्ञाधृक् स्वांशशङ्करपूजकः
    । शिवकन्याव्रतपतिः कृष्णरूपशिवारिहा ॥ १५३॥ महालक्ष्मीवपुर्गौरीत्राणो देवलवातहा । विनिद्रमुचुकुन्दैकब्रह्मास्त्रयुवनाश्वहृत्
    ॥ १५४॥ अक्रूरोऽक्रूरमुख्यैकभक्तस्वच्छन्दमुक्तिदः । सबालस्त्रीजलक्रीडाकृतवापीकृतार्णवः ॥ १५५॥ यमुनापतिरानीतपरिणीतद्विजात्मकः
    । श्रीदामशङ्कुभक्तार्थभूम्यानीतेन्द्रभैरवः ॥ १५६॥ दुर्वृत्तशिशुपालैकमुक्तिकोद्धारकेश्वरः । आचाण्डालादिकं
    प्राप्य द्वारकानिधिकोटिकृत् ॥ १५७॥ ब्रह्मास्त्रदग्धगर्भस्थपरीक्षिज्जीवनैककृत् । परिणीतद्विजसुतानेताऽर्जुनमदापहः
    ॥ १५८॥ गूढमुद्राकृतिग्रस्तभीष्माद्यखिलगौरवः । पार्थार्थखण्डिताशेषदिव्यास्त्रः पार्थमोहभृत् ॥ १५९॥
    ब्रह्मशापच्छलध्वस्तयादवो विभवावहः । अनङ्गे जितगौरीशो रतिकान्तः सदेप्सितः ॥ १६०॥ पुष्पेषुर्विश्वविजयी
    स्मरः कामेश्वरीपतिः । उषापतिर्विश्वहेतुर्विश्वतृप्तोऽधिपूरुषः ॥ १६१॥ चतुरात्मा चतुर्वर्णश्चतुर्वेदविधायकः
    । चतुर्विश्वैकविश्वात्मा सर्वोत्कृष्टासु कोटिषु ॥ १६२॥ आश्रयात्मा पुराणर्षिर्व्यासः शास्त्रसहस्रकृत्
    । महाभारतनिर्माता कवीन्द्रो वादरायणः ॥ १६३॥ कृष्णद्वैपायनः सर्वपुरुषार्थकबोधकः । वेदान्तकर्ता ब्रह्मैकव्यञ्जकः
    पुरुवंशकृत् ॥ १६४॥ बुद्धो ध्यानजिताशेषदेवदेवो जगत्प्रियः । निरायुधो जगज्जैत्रः श्रीधनो दुष्टमोहनः
    ॥ १६५॥ दैत्यवेदबहिष्कर्त्ता वेदार्थश्रुतिगोपकः । शुद्धोदनिर्नष्टदिष्टः सुखदः सदसत्पतिः ॥ १६६॥ यथायोग्याखिलकुपः
    सर्वशून्योऽखिलेष्टदः । चतुष्कोटिपृथक्तत्त्वं प्रज्ञापारमितेश्वरः ॥ १६७॥ पाषण्डश्रुतिमार्गेण पाषण्डश्रुतिगोपकः
    । कल्की विष्णुयशः पूतः कलिकालविलोपकः ॥ १६८॥ समस्तम्लेच्छहस्तघ्नः सर्वशिष्टद्विजातिकृत् । सत्यप्रवर्त्तको
    देवद्विजदीर्घक्षुधापहः ॥ १६९॥ अवगवादिवेदेन पृथ्वीदुर्गतिनाशनः । सद्यः क्ष्मानन्तलक्ष्मीकृत् नष्टनिः
    शेष धर्मकृत् ॥ १७०॥ अनन्तस्वर्गयागैकहेमपूर्णाखिलद्विजः । असाध्यैकजगच्छास्ता विश्ववन्द्यो जयध्वजः ॥
    १७१॥ आत्मतत्त्वाधिपः कृर्तृश्रेष्ठो विधिरुमापतिः । भर्तुः श्रेष्ठः प्रजेशाग्र्यो मरीचिजनकाग्रणीः ॥
    १७२॥ कश्यपो देवरादिन्द्रः प्रह्लादो दैत्यराट् शशी । नक्षत्रेशो रविस्तेजः श्रेष्ठः शुक्रः कवीश्वरः
    ॥ १७३॥ महर्षिराट् भृगुर्विष्णुरादित्येशो बलिः स्वराट् । वायुर्वह्निः शुचिश्रेष्ठः शङ्करो रुद्रराट्
    गुरुः ॥ १७४॥ विद्वत्तमश्चित्ररथो गन्धर्वाग्र्यो वसूत्तमः । वर्णादिरग्र्या स्त्री गौरी शक्त्यग्र्या
    श्रीश्च नारदः ॥ १७५॥ देवर्षिराट् पाण्डवाग्र्योऽर्जुनो नारदवादराट् । पवनः पवनेशानो वरुणो यादसाम्पतिः
    ॥ १७६॥ गङ्गातीर्थोत्तमोद्भूतं छत्रकाग्र्यवरौषधम् । अन्नं सुदर्शनास्त्राग्र्यो वज्रप्रहरणोत्तमम् ॥
    १७७॥ उच्चैःश्रवा वाजिराजः ऐरावत इभेश्वरः । अरुन्धत्येकपत्नीशो ह्यश्वत्थोऽशेषवृक्षराट् ॥ १७८॥ अध्यात्मविद्याविद्यात्मा
    प्रणवश्छन्दसां वरः । मेरुर्गिरिपतिर्भार्गो मासाग्र्यः कालसत्तमः ॥ १७९॥ दिनाद्यात्मा पूर्वसिद्धिः कपिलः
    सामवेदराट् । तार्क्ष्यः खगेन्द्रो ऋत्वग्र्यो वसन्तः कल्पपादपः ॥ १८०॥ दातृश्रेष्ठः कामधेनुरार्तिघ्नाग्र्यः
    सुरोत्तमः । चिन्तामणिर्गुरुश्रेष्ठो माता हिततमः पिता ॥ १८१॥ सिंहो मृगेन्द्रो नागेन्द्रो वासुकिर्भूधरो
    नृपः । वणशो ब्राह्मणश्चान्तः करणाग्र्यं नमो नमः ॥ १८२॥ इत्येतद्वासुदेवस्य विष्णोर्नामसहस्रकम् । सर्वापराधशमनं
    परं भक्तिविवर्द्धनम् ॥ १८३॥ अक्षयब्रह्मलोकादिसर्वार्थाप्येकसाधनम् । विष्णुलोकैकसोपानं सर्वदु
