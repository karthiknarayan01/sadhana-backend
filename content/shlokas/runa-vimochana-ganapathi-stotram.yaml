id: runa-vimochana-ganapathi-stotram
category: stotram
name:
  english: Runa Vimochana Ganapathi Stotram
content:
  english: smarami devadevesham vakratundam mahabalam | shadaksharam kripasindhum namami rinamuktaye ||
    || ekaksharam hyekadantam ekam brahma sanatanam | ekamevadvitiyam ca namami rinamuktaye || || mahaganapatim
    devam mahasattvam mahabalam | mahavighnaharam shambhoh namami rinamuktaye || || krishnambaram krishnavarnam
    krishnagandhanulepanam | krishnasarpopavitam ca namami rinamuktaye || || raktambaram raktavarnam raktagandhanulepanam
    | raktapushpapriyam devam namami rinamuktaye || || pitambaram pitavarnam pitagandhanulepanam | pitapushpapriyam
    devam namami rinamuktaye || || dhumrambaram dhumravarnam dhumragandhanulepanam | homadhumapriyam devam
    namami rinamuktaye || || phalanetram phalacandram pashankushadharam vibhum | camaralankritam devam
    namami rinamuktaye || || idam tvrinaharam stotram sandhyayam yah pathennarah | shanmasabhyantarenaiva
    rinamukto bhavishyati || || iti rinavimocana mahaganapati stotram |
  devanagari: स्मरामि देवदेवेशं वक्रतुण्डं महाबलम् । षडक्षरं कृपासिन्धुं नमामि ऋणमुक्तये ॥ ॥ एकाक्षरं
    ह्येकदन्तं एकं ब्रह्म सनातनम् । एकमेवाद्वितीयं च नमामि ऋणमुक्तये ॥ ॥ महागणपतिं देवं महासत्त्वं महाबलम्
    । महाविघ्नहरं शम्भोः नमामि ऋणमुक्तये ॥ ॥ कृष्णाम्बरं कृष्णवर्णं कृष्णगन्धानुलेपनम् । कृष्णसर्पोपवीतं
    च नमामि ऋणमुक्तये ॥ ॥ रक्ताम्बरं रक्तवर्णं रक्तगन्धानुलेपनम् । रक्तपुष्पप्रियं देवं नमामि ऋणमुक्तये
    ॥ ॥ पीताम्बरं पीतवर्णं पीतगन्धानुलेपनम् । पीतपुष्पप्रियं देवं नमामि ऋणमुक्तये ॥ ॥ धूम्राम्बरं धूम्रवर्णं
    धूम्रगन्धानुलेपनम् । होमधूमप्रियं देवं नमामि ऋणमुक्तये ॥ ॥ फालनेत्रं फालचन्द्रं पाशाङ्कुशधरं विभुम्
    । चामरालङ्कृतं देवं नमामि ऋणमुक्तये ॥ ॥ इदं त्वृणहरं स्तोत्रं सन्ध्यायां यः पठेन्नरः । षण्मासाभ्यन्तरेणैव
    ऋणमुक्तो भविष्यति ॥ ॥ इति ऋणविमोचन महागणपति स्तोत्रम् ।
