id: muniproktamrudramantrajapopadesham
category: mantra
name:
  english: muniproktamrudramantrajapopadesham
  devanagari: मुनिप्रोक्तंरुद्रमन्त्रजपोपदेशम्
content:
  english: vai shambhoh priyatamo matah | vastraputena toyena avicchinnam prakalpayet || 16|| dharam pritya
    prakalpeta shivalinge dvijottamah | japadapyuttamah sekah shrirudradhyayapurvakah || 17|| japaddashagunah
    prokto hyabhisheko maheshituh | candanairbilvapatraishca pujayedindushekharam || 18|| rudraih stuvita
    devesham sambam samsarabheshajam | stutva rudrairmahadeva sannidhau ganapo bhavet || 19|| rudrairhomam
    prakurvita carunamadhusarpisha | namabhirdevadevasya svahantaishca prithak prithak || 20|| graharishte
    samutpanne utpate kshmadikampane | deshopasarge durbhukshe rajacoradyupadrave || 21|| prajapashumritau
    capi japahomarcanam caret | rudrairmantrairayutasho dhyayandevam pinakinam || 22|| brahmanaih shambhavaireva
    bhasmarudrakshadharibhih | karayedvidhivadraja dhanadhyo vapi kashcana || 23|| gavo bhumirhiranyadyah
    pradeyah shaktisaratah | shambhavebhyah sada rogatapapapaih pramucyate || 24|| rudramantrajape yogyah
    shambhava eva kevalam | atirudravidhanam va maharudramathapi va || 25|| kuryatsarvopasargebhyo na
    bhayam jayate kvacit | ghritadharam patayetavicchinnam rudramantratah || 26|| vahnau kunde shivam
    dhyatva shambhavashtottaraih shataih | ekadashanuvrittyaivam mandalam dhanadhanyavan || 27|| muktah
    shivamayo bhuyadakamah kamavan yadi | sarvakamanavapnoti vatsarante na samshayah || 28|| goshthe vapi
    nadirite rudrakshetre shatottaram | japyaiva karma kritvapi phalam vindeddashottaram || 29|| kshirabhishekam
    linge tu rudramantraih samacaret | na bhuyasstanyapo maturbhavishyati na samshayah || 30|| yo rudre
    va namaskaram pradakshinamathapi va | kuryacchivalaye shambhoh sannidhau sa tu muktibhak || 31|| rudramantraih
    shulinam yah stuvannartanamacaret | sa shambhorganapo bhuyadvatsarena na samshayah || 32|| avimukte
    shivakshetreshvanyeshvapi yatha balam | rudram japanpramucyeta papebhyo natra samshayah || 33|| yo
    bilvamule rudramshca japeddhyayanmaheshvaram | sa kotirudrasamyasya phalam labdhva vimucyate || 34||
    jabala amanantyeva mahimam rudrajapinah | kim japyenamritamiti rudraireveti sa shrutih || 35|| yatishca
    prajapennityam vane varni grihi tatha | yavannamo'ntam tu yateranye tu grihamedhinah || 36|| yatra
    sthito rudrajapi tatra shambhuh sthitah sada | tasmai dattam shambhavaya dattam tacchambhave sada
    || 37|| gam bhumimatha vaso va dhanam dhanyam hiranyakam | datva shivaprasadasya patram shrirudrajapine
    || 38|| ekavaram japanrudram tadgrame shantimricchati | grame asminnanaturamiti mantrarthaparagah
    || 39|| shatavaram tu nagare pure'yutajapadbhavet | tatrasthanam shubham bhuyadyatra rudrajapo bhavet
    || 40|| kumbham samsprishya yo rudram sodakam prajapan dvijah | snapayeccapi rogarttam rogi rogaih
    pramucyate || 41|| vandhya kumaram sute cativa premaspadam sthiram | evam rahasyamanagham shatarudramantra
  devanagari: वै शम्भोः प्रियतमो मतः । वस्त्रपूतेन तोयेन अविच्छिन्नां प्रकल्पयेत् ॥ १६॥ धारां प्रीत्या
    प्रकल्पेत शिवलिङ्गे द्विजोत्तमः । जपादप्युत्तमः सेकः श्रीरुद्राध्यायपूर्वकः ॥ १७॥ जपाद्दशगुणः प्रोक्तो
    ह्यभिषेको महेशितुः । चन्दनैर्बिल्वपत्रैश्च पूजयेदिन्दुशेखरम् ॥ १८॥ रुद्रैः स्तुवीत देवेशं साम्बं संसारभेषजम्
    । स्तुत्वा रुद्रैर्महादेव सन्निधौ गणपो भवेत् ॥ १९॥ रुद्रैर्होमं प्रकुर्वीत चरुणामधुसर्पिषा । नामभिर्देवदेवस्य
    स्वाहान्तैश्च पृथक् पृथक् ॥ २०॥ ग्रहारिष्टे समुत्पन्ने उत्पाते क्ष्मादिकम्पने । देशोपसर्गे दुर्भुक्षे
    राजचोराद्युपद्रवे ॥ २१॥ प्रजापशुमृतौ चापि जपहोमार्चनं चरेत् । रुद्रैर्मन्त्रैरयुतशो ध्यायन्देवं पिनाकिनम्
    ॥ २२॥ ब्राह्मणैः शाम्भवैरेव भस्मरुद्राक्षधारिभिः । कारयेद्विधिवद्राजा धनाढ्यो वापि कश्चन ॥ २३॥ गावो
    भूमिर्हिरण्याद्याः प्रदेयाः शक्तिसारतः । शाम्भवेभ्यः सदा रोगतापपापैः प्रमुच्यते ॥ २४॥ रुद्रमन्त्रजपे
    योग्याः शाम्भवा एव केवलम् । अतिरुद्रविधानं वा महारुद्रमथापि वा ॥ २५॥ कुर्यात्सर्वोपसर्गेभ्यो न भयं
    जायते क्वचित् । घृतधारां पातयेताविच्छिन्नां रुद्रमन्त्रतः ॥ २६॥ वह्नौ कुण्डे शिवं ध्यात्वा शाम्भवाष्टोत्तरैः
    शतैः । एकादशानुवृत्त्यैवं मण्डलं धनधान्यवान् ॥ २७॥ मुक्तः शिवमयो भूयादकामः कामवान् यदि । सर्वकामानवाप्नोति
    वत्सरान्ते न संशयः ॥ २८॥ गोष्ठे वापि नदीरीते रुद्रक्षेत्रे शतोत्तरम् । जप्यैव कर्म कृत्वापि फलं विन्देद्दशोत्तरम्
    ॥ २९॥ क्षीराभिषेकं लिङ्गे तु रुद्रमन्त्रैः समाचरेत् । न भूयस्स्तन्यपो मातुर्भविष्यति न संशयः ॥ ३०॥
    यो रुद्रे वा नमस्कारं प्रदक्षिणमथापि वा । कुर्याच्छिवालये शम्भोः सन्निधौ स तु मुक्तिभाक् ॥ ३१॥ रुद्रमन्त्रैः
    शूलिनं यः स्तुवन्नर्तनमाचरेत् । स शम्भोर्गणपो भूयाद्वत्सरेण न संशयः ॥ ३२॥ अविमुक्ते शिवक्षेत्रेष्वन्येष्वपि
    यथा बलम् । रुद्रं जपन्प्रमुच्येत पापेभ्यो नात्र संशयः ॥ ३३॥ यो बिल्वमूले रुद्रांश्च जपेद्ध्यायन्महेश्वरम्
    । स कोटिरुद्रसाम्यस्य फलं लब्ध्वा विमुच्यते ॥ ३४॥ जाबाला आमनन्त्येव महिमां रुद्रजापिनः । किं जप्येनामृतमिति
    रुद्रैरेवेति सा श्रुतिः ॥ ३५॥ यतिश्च प्रजपेन्नित्यं वने वर्णी गृही तथा । यावन्नमोऽन्तं तु यतेरन्ये
    तु गृहमेधिनः ॥ ३६॥ यत्र स्थितो रुद्रजापी तत्र शम्भुः स्थितः सदा । तस्मै दत्तं शाम्भवाय दत्तं तच्छम्भवे
    सदा ॥ ३७॥ गां भूमिमथ वासो वा धनं धान्यं हिरण्यकम् । दत्वा शिवप्रसादस्य पात्रं श्रीरुद्रजापिने ॥ ३८॥
    एकवारं जपन्रुद्रं तद्ग्रामे शान्तिमृच्छति । ग्रामे अस्मिन्ननातुरमिति मन्त्रार्थपारगः ॥ ३९॥ शतवारं
    तु नगरे पुरेऽयुतजपाद्भवेत् । तत्रस्थानां शुभं भूयाद्यत्र रुद्रजपो भवेत् ॥ ४०॥ कुम्भं संस्पृश्य यो
    रुद्रं सोदकं प्रजपन् द्विजः । स्नापयेच्चापि रोगार्त्तं रोगी रोगैः प्रमुच्यते ॥ ४१॥ वन्ध्या कुमारं
    सूते चातीव प्रेमास्पदं स्थिरम् । एवं रहस्यमनघं शतरुद्रमन्त्र
