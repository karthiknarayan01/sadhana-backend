id: hitanjalimuniproktambalakrishnamantrastotram
category: stotram
name:
  english: hitanjalimuniproktambalakrishnamantrastotram
  devanagari: हितान्जलिमुनिप्रोक्तंबालकृष्णमन्त्रस्तोत्रम्
content:
  english: '| hitanjalimunirbadri mantranevamvidhan bahun || 38|| mumukshubhyo''rpayatyeva karoti bandhavarjitan
    | mahabhagavatan lokan kritva dadati mokshanam || 39|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya
    caturthakhande 36'
  devanagari: । हिताञ्जलिमुनिर्बद्रि मन्त्रानेवंविधान् बहून् ॥ ३८॥ मुमुक्षुभ्योऽर्पयत्येव करोति बन्धवर्जितान्
    । महाभागवतान् लोकान् कृत्वा ददाति मोक्षणम् ॥ ३९॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    चतुर्थखण्डे ३६
meaning: {}
