id: nirvanashatkam
category: stotram
name:
  english: nirvanashatkam
  devanagari: निर्वाणषट्कम्
content:
  english: nirvanashatkam manobuddhyahamkaracittani naham na ca shrotrajihve na ca ghrananetre | na ca
    vyomabhumirna tejo na vayuh cidanandarupah shivo'ham shivo'ham ||1|| na ca pranasamjno na vai pancavayuh
    na va saptadhaturna va pancakoshah | na vakpanipadam na copasthapayu cidanandarupah shivo'ham shivo'ham
    ||2|| na me dvesharagau na me lobhamohau mado naiva me naiva matsaryabhavah | na dharmo na cartho
    na kamo na mokshah cidanandarupah shivo'ham shivo'ham ||3|| na punyam na papam na saukhyam na duhkham
    na mantro na tirtho na veda na yajnah | aham bhojanam naiva bhojyam na bhokta cidanandarupah shivo'ham
    shivo'ham ||4|| na me mrityushanka na me jatibhedah
  devanagari: निर्वाणषट्कम् मनोबुद्ध्यहंकारचित्तानि नाहं न च श्रोत्रजिह्वे न च घ्राणनेत्रे । न च व्योमभूमिर्न
    तेजो न वायुः चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥१॥ न च प्राणसंज्ञो न वै पञ्चवायुः न वा सप्तधातुर्न वा
    पञ्चकोशः । न वाक्पाणिपादं न चोपस्थपायू चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥२॥ न मे द्वेषरागौ न मे लोभमोहौ
    मदो नैव मे नैव मात्सर्यभावः । न धर्मो न चार्थो न कामो न मोक्षः चिदानन्दरूपः शिवोऽहं शिवोऽहम् ॥३॥ न
    पुण्यं न पापं न सौख्यं न दुःखं न मन्त्रो न तीर्थो न वेदा न यज्ञः । अहं भोजनं नैव भोज्यं न भोक्ता चिदानन्दरूपः
    शिवोऽहं शिवोऽहम् ॥४॥ न मे मृत्युशङ्का न मे जातिभेदः
meaning: {}
