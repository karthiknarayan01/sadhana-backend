    ब्राह्मणवरप्रदा । श्रीं क्लीं हत्यापहा स्वाहा ह्रीं श्रीं क्लीं हरिसेविता ॥ ५२॥ ॐ श्रीं हरार्चिता
    स्वाहा जुं हौं सः जृम्भिनी पयः । ॐ जां जालन्धरी स्वाहा ॐ श्रीं ह्रीं ह्सौः हरिवाहना ॥ ५३॥ ॐ क्लीं
    ह्रीं हरिदश्वाक्षी ॐ ह्रीं हरिहरार्चिता । ॐ श्रीं क्लीं हैहयेष्टा च ॐ ह्रीं श्रीं हयगामिनी ॥ ५४॥ अं
    श्रीं अम्भोदनीलाङ्गी अं क्रीं अश्वसुखप्रिया । अं ऐं अम्भोजहस्ता च अं क्लीं अम्भोजनी पयः ॥ ५५॥ ॐ श्रीं
    क्लीं श्रौं शतानन्दा श्रौं शतानन्दघातिनी । ॐ श्रीं गीतप्रिया स्वाहा ॐ गीं गीतज्ञा च ग्लौं गतिः ॥ ५६॥
    ॐ श्रीं गीं गुणिवत्सा च ॐ गीं श्रीं गुणिरागिणी । ॐ गीं श्रीं गारुडीविद्याङ्गी श्रीं गीं गोमती पयः
    ॥ ५७॥ ॐ गीं गाथा ह्सौः स्वाहा ॐ गीं गन्धर्वसेविता । ॐ गीं गणेशसेव्या च ऐं सौः गीं गणवल्लभा ॥ ५८॥ ऐं
    क्लीं गीं गजराजेष्टा गीं श्रीं गौरी ह्सौः गतिः । क्रीं गीं गलद्रसा ॐ गीं गजाननसमर्चिता ॥ ५९॥ ॐ प्रीं
    श्रीं पद्मभूः स्वाहा ॐ सौः जुं आत्मभू पयः । ॐ श्रीं मधुमक्षिका ॐ ऐं सौः म्रीं मदालसा ॥ ६०॥ ॐ श्रीं
    म्रीं माधवेष्टा च श्रीं मा ह्रीं श्रीं रसा पयः । ॐ ह्रीं श्रीं इन्दिरा श्रीं क्लीं श्रीदा ऐं सौः च
    श्रीमती ॥ ६१॥ ॐ श्रीं क्लीं ललिता स्वाहा ॐ श्रीं गीं गरुडाश्रिता । ऐं क्लीं निशुम्भहन्त्री च श्रीं
    ह्रीं महिषगामिनी ॥ ६२॥ ॐ ऐं सौः पद्मजा ह्रीं श्रीं महिषासुरघातिनी । मधुकैटभहन्त्री ॐ ह्रीं श्रीं म्रीं
    मधुराक्षरा ॥ ६३॥ ॐ ऐं भगोदरा स्वाहा श्रीं क्लीं म्रीं मन्मथातुरा । ॐ ह्रीं श्रीं मतिदा श्रीं म्रीं
    क्रीं हूं मातङ्गिनी पयः ॥ ६४॥ ॐ श्रीं ऐं खेटहस्ता च क्ष्म्यूं क्षीराम्बुधिसम्भवा । ॐ क्ष्मीं क्षुरितकेशा
    च ऐं सौः क्लीं श्रीं क्षमावती ॥ ६५॥ ॐ श्रीं ऐं सौः क्षमा ॐ श्रीं क्ष्मा ॐ ऐं सौः क्षमाधरा । ॐ श्रीं
    क्रीं क्ष्म्यूं च क्षणदा ॐ श्रीं क्ष्म्यां क्षालिताम्बरा ॥ ६६॥ ॐ श्रीं ऐं सौः जनावासा ॐ जुं सः हूं
    जरातुरा । ॐ श्रीं ऐं क्लीं ह्सौः श्रद्धा ॐ प्रीं श्री पुरातना ॥ ६७॥ ॐ प्रीं पुराणप्रकृतिः ॐ ऐं क्लीं
