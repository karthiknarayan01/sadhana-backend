id: narayanottaratapiniyopanishat
category: upanishad
name:
  english: narayanottaratapiniyopanishat
  devanagari: नारायणोत्तरतापिनीयोपनिषत्
content:
  english: narayanottaratapiniyopanishat prathamah khandah sa hovaca bhagavan brahma anandam brahmano
    vidvan saccidanandasvarupo bhavati | dva suparna sayuja sakhaya samanam vriksham parishasvajate |
    tayoranyah pippalam svadvattyanashnannanyo abhicakashiti || yo vedadau svarah prokto vedante ca pratishthitah
    | tasya prakritilinasya yah parah sa maheshvarah || anoraniyanmahato mahiyanatma guhayam nihito'sya
    jantoh | tamakratum pashyati vitashoko dhatuh prasadanmahimanamisham || vasanadvasudevasya vasitam
    hi jagattrayam | sarvabhutanivaso'si vasudeva namo'stu te || bhushca narayanah | bhuvashca narayanah
    | suvashca narayanah | mahashca narayanah | janashca narayanah | tapashca narayanah | satyam ca narayanah
    | narayanah param brahma | narayana evedam sarvam | narayananna kincidasti | satya jnanamanantam brahma
    | yo veda nihitam guhayam parame vyoman | tasmadva etasmadatmana akashah sambhutah | akashadvayuh
    | vayoragnih | agnerapah | adbhyah prithivi | prithivya oshadhayah | oshadhibhyo'nnam | annatpurushah
    | narayanah sarvapurusha evedam parabrahma | narayanah sarvabhutantaryamyatma | atmedam sarvam narayanah
    | narayanah svayam jyotih | tasmatprakashatma || nivarashukavattanvi pita bhasvatyanupama | tasyah
    shikhaya madhye paramatma vyavasthitah || pashabaddhah smrito jivah pashamuktah sanatanah | tushena
    baddho vrihih syattushabhavena tandulah || parabrahma svayam catma sakshannarayanah smritah | narayanamanadim
    ca yoganidraparayanam || jagratsvapnasushuptishu sarvakalavyavasthitam | narayanam mahatmanam mahadhyanaparayanam
    | sarvavedantasamlakshyam tadbrahmetyabhidhiyate || hovaca bhagavan narayana evedam sarvam pratishthitam
    ya evam veda | ityupanishat || ityatharvanarahasye narayanottaratapiniye prathamah khandah dvitiyah
    khandah sa hovaca bhagavan brahma narayanah paravastu bhavatiti vijnayate | saccidanandarupaya jnanayamitatejase
    | parabrahmasvarupaya narayana namo'stu te || nityashuddhaya buddhaya nityayadvaitarupine | anandayatmarupaya
    narayana namo'stu te || om namo bhagavate shrimannarayanaya mahavishnave amitabalaparakramaya shankhacakragadadharaya
    lakshmisametaya garudavahanaya dashavataraya sarvadushtadaityadanavasamharanaya shishtapratipalakaya
    parabrahmarupaya mahatmane paramapurushaya pundarikakshaya puranapurushaya shuddhabuddhaya saccidanandasvarupaya
    mahatmane ghrinih surya aditya om namo narayanaya sahasrara hum phat svaha || narayanaya shantaya
    shashvataya muraraye | yajneshvaraya yajnaya sharanyaya namo namah || sa hovaca bhagavan brahma sarvam
    vishvamidam narayanah ya evam veda ityupanishat || ityatharvanarahasye narayanottaratapiniye dvitiyah
    khandah tritiyah khandah sa hovaca bhagavan brahma narayanah parabrahmeti ya evam veda | narayanatma
    vedam sarvam nirvikaram niranjanavastu pratipadyate | sa narayano viratpurusho bhavati | devanam vasavo
    bhavati | indriyanam mano bhavati | sarvesham vastunam mukhyavastu bhavati | om namo narayanadanyo
    mantrah narayanadanyopastirnasti | nanyannarayanadupasitavyam | sarvam narayana eva bhavatiti vijnayate
    | yo'dhite nityam sarvan kamanavapnoti | sa brahmahatyayah puto bhavati | surapanat puto bhavati |
    svarnasteyat puto bhavati | gurutalpagamanat puto bhavati | agamyagamanat puto bhavati | abhakshyabhakshat
    puto bhavati | sa upapatakamahapatakebhyah puto bhavati | sarvavedamadhiyano bhavati| sarvakratuphalam
    prapnoti| sarvakarmakarta bhavati| catu
  devanagari: नारायणोत्तरतापिनीयोपनिषत् प्रथमः खण्डः स होवाच भगवान् ब्रह्मा आनन्दं ब्रह्मणो विद्वान् सच्चिदानन्दस्वरूपो
    भवति । द्वा सुपर्णा सयुजा सखाया समानं वृक्षं परिषस्वजाते । तयोरन्यः पिप्पलं स्वाद्वत्त्यनश्नन्नन्यो
    अभिचाकशीति ॥ यो वेदादौ स्वरः प्रोक्तो वेदान्ते च प्रतिष्ठितः । तस्य प्रकृतिलीनस्य यः परः स महेश्वरः
    ॥ अणोरणीयान्महतो महीयानात्मा गुहायां निहितोऽस्य जन्तोः । तमक्रतुं पश्यति वीतशोको धातुः प्रसादान्महिमानमीशम्
    ॥ वासनाद्वासुदेवस्य वासितं हि जगत्त्रयम् । सर्वभूतनिवासोऽसि वासुदेव नमोऽस्तु ते ॥ भूश्च नारायणः ।
    भुवश्च नारायणः । सुवश्च नारायणः । महश्च नारायणः । जनश्च नारायणः । तपश्च नारायणः । सत्यं च नारायणः
    । नारायणः परं ब्रह्म । नारायण एवेदं सर्वम् । नारायणान्न किञ्चिदस्ति । सत्य ज्ञानमनन्तं ब्रह्म । यो
    वेद निहितं गुहायां परमे व्योमन् । तस्माद्वा एतस्मादात्मन आकाशः संभूतः । आकाशाद्वायुः । वायोरग्निः
    । अग्नेरापः । अद्भ्यः पृथिवी । पृथिव्या ओषधयः । ओषधीभ्योऽन्नम् । अन्नात्पुरुषः । नारायणः सर्वपुरुष
    एवेदं परब्रह्म । नारायणः सर्वभूतान्तर्याम्यात्मा । आत्मेदं सर्वं नारायणः । नारायणः स्वयं ज्योतिः ।
    तस्मात्प्रकाशात्मा ॥ नीवारशूकवत्तन्वी पीता भास्वत्यणूपमा । तस्याः शिखाया मध्ये परमात्मा व्यवस्थितः
    ॥ पाशबद्धः स्मृतो जीवः पाशमुक्तः सनातनः । तुषेण बद्धो व्रीहिः स्यात्तुषाभावेन तण्डुलः ॥ परब्रह्म स्वयं
    चात्मा साक्षान्नारायणः स्मृतः । नारायणमनादिं च योगनिद्रापरायणम् ॥ जाग्रत्स्वप्नसुषुप्तीषु सर्वकालव्यवस्थितम्
    । नारायणं महात्मानं महाध्यानपरायणम् । सर्ववेदान्तसंलक्ष्यं तद्ब्रह्मेत्यभिधीयते ॥ होवाच भगवान् नारायण
    एवेदं सर्वं प्रतिष्ठितं य एवं वेद । इत्युपनिषत् ॥ इत्याथर्वणरहस्ये नारायणोत्तरतापिनीये प्रथमः खण्डः
    द्वितीयः खण्डः स होवाच भगवान् ब्रह्मा नारायणः परवस्तु भवतीति विज्ञायते । सच्चिदानन्दरूपाय ज्ञानायामिततेजसे
    । परब्रह्मस्वरूपाय नारायण नमोऽस्तु ते ॥ नित्यशुद्धाय बुद्धाय नित्यायाद्वैतरूपिणे । आनन्दायात्मरूपाय
    नारायण नमोऽस्तु ते ॥ ओं नमो भगवते श्रीमन्नारायणाय महाविष्णवे अमितबलपराक्रमाय शङ्खचक्रगदाधराय लक्ष्मीसमेताय
    गरुडवाहनाय दशावताराय सर्वदुष्टदैत्यदानवसंहरणाय शिष्टप्रतिपालकाय परब्रह्मरूपाय महात्मने परमपुरुषाय
    पुण्डरीकाक्षाय पुराणपुरुषाय शुद्धबुद्धाय सच्चिदानन्दस्वरूपाय महात्मने घृणिः सूर्य आदित्य ॐ नमो नारायणाय
    सहस्रार हुं फट् स्वाहा ॥ नारायणाय शान्ताय शाश्वताय मुरारये । यज्ञेश्वराय यज्ञाय शरण्याय नमो नमः ॥
    स होवाच भगवान् ब्रह्मा सर्वं विश्वमिदं नारायणः य एवं वेद इत्युपनिषत् ॥ इत्याथर्वणरहस्ये नारायणोत्तरतापिनीये
    द्वितीयः खण्डः तृतीयः खण्डः स होवाच भगवान् ब्रह्मा नारायणः परब्रह्मेति य एवं वेद । नारायणात्मा वेदं
    सर्वं निर्विकारं निरञ्जनवस्तु प्रतिपाद्यते । स नारायणो विराट्पुरुषो भवति । देवानां वासवो भवति । इन्द्रियाणां
    मनो भवति । सर्वेषां वस्तूनां मुख्यवस्तु भवति । ॐ नमो नारायणादन्यो मन्त्रः नारायणादन्योपास्तिर्नास्ति
    । नान्यन्नारायणादुपासितव्यम् । सर्वं नारायण एव भवतीति विज्ञायते । योऽधीते नित्यं सर्वान् कामानवाप्नोति
    । स ब्रह्महत्यायाः पूतो भवति । सुरापानात् पूतो भवति । स्वर्णस्तेयात् पूतो भवति । गुरुतल्पगमनात् पूतो
    भवति । अगम्यागमनात् पूतो भवति । अभक्ष्यभक्षात् पूतो भवति । स उपपातकमहापातकेभ्यः पूतो भवति । सर्ववेदमधीयानो
    भवति। सर्वक्रतुफलं प्राप्नोति। सर्वकर्मकर्ता भवति। चतु
