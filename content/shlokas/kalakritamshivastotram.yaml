id: kalakritamshivastotram
category: stotram
name:
  english: kalakritamshivastotram
  devanagari: कालकृतंशिवस्तोत्रम्
content:
  english: kalakritam shivastotram kala uvaca | kalantaka tripuresha tripurantakara prabho | madano hi
    tvaya deva krito'nango jagatpate || 60|| dakshayajnavinashashca krito hi paramadbhutah | kalakutam
    duhprasaham sarvesham kshayakrinmahat || 61|| grasitam tattvaya shambho anyeshamapi durddharam | lingarupena
    mahata vyaptamasijjagattrayam || 62|| layanallingamityuktam sarvairapi surasuraih | yasyantam na vidurddeva
    brahmavishnupurogamah || 63|| lingasya devadevasya mahimanam parasya ca | namaste parameshaya namaste
    vishvamangala | namaste shitikanthaya namastasmai kapardine || 64|| namo namah karanakaranaya te namo
    namo mangalamangalatmane | jnanatmane jnanavidam manishinam tvamadidevo'si pumanpuranah || 65|| tvameva
    sarvam jagadekabandho vedantavedyo'si mahanubhavah | mahanubhavaih parikirttaniyastvameva vishveshvara
    vishvamanyah || 66|| tvam pasi lumpasi jagattritayam mahesha | srashtasi bhutapatireva na kashcidanyah
    || 67|| iti shriskandapurane maheshvarakhande
  devanagari: कालकृतं शिवस्तोत्रम् काल उवाच । कालान्तक त्रिपुरेश त्रिपुरान्तकर प्रभो । मदनो हि त्वया देव
    कृतोऽनङ्गो जगत्पते ॥ ६०॥ दक्षयज्ञविनाशश्च कृतो हि परमाद्भुतः । कालकूटं दुःप्रसहं सर्वेषां क्षयकृन्महत्
    ॥ ६१॥ ग्रसितं तत्त्वया शम्भो अन्येषामपि दुर्द्धरम् । लिङ्गरूपेण महता व्याप्तमासीज्जगत्त्रयम् ॥ ६२॥
    लयनाल्लिङ्गमित्युक्तं सर्वैरपि सुरासुरैः । यस्यान्तं न विदुर्द्देवा ब्रह्मविष्णुपुरोगमाः ॥ ६३॥ लिङ्गस्य
    देवदेवस्य महिमानं परस्य च । नमस्ते परमेशाय नमस्ते विश्वमङ्गल । नमस्ते शितिकण्ठाय नमस्तस्मै कपर्दिने
    ॥ ६४॥ नमो नमः कारणकारणाय ते नमो नमो मङ्गलमङ्गलात्मने । ज्ञानात्मने ज्ञानविदां मनीषिणां त्वमादिदेवोऽसि
    पुमान्पुराणः ॥ ६५॥ त्वमेव सर्वं जगदेकबन्धो वेदान्तवेद्योऽसि महानुभावः । महानुभावैः परिकीर्त्तनीयस्त्वमेव
    विश्वेश्वर विश्वमान्यः ॥ ६६॥ त्वं पासि लुम्पसि जगत्त्रितयं महेश । स्रष्टासि भूतपतिरेव न कश्चिदन्यः
    ॥ ६७॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
meaning: {}
