  devanagari: ककारादिकालीशतनामावलिः श्रीकरालवदनायै नमः । श्रीकाल्यै नमः । श्रीकामिन्यै नमः । श्रीकमलायै
    नमः । श्रीकलायै नमः । श्रीक्रियावत्यै नमः । श्रीकोटराक्ष्यै नमः । श्रीकामाक्ष्यायै नमः । श्रीकामसुन्दर्यै
    नमः । श्रीकपालायै नमः । १० श्रीकरालायै नमः । श्रीकाल्यै नमः । श्रीकात्यायन्यै नमः । श्रीकुहवे नमः
    । श्रीकङ्कालायै नमः । श्रीकालदमनायै नमः । श्रीकरुणायै नमः । श्रीकमलार्च्चितायै नमः । श्रीकादम्बर्यै
    नमः । श्रीकालहरायै नमः । २० श्रीकौतुक्यै नमः । श्रीकारणप्रियायै नमः । श्रीकृष्णायै नमः । श्रीकृष्णप्रियायै
    नमः । श्रीकृष्णपूजितायै नमः । श्रीकृष्णवल्लभायै नमः । श्रीकृष्णापराजितायै नमः । श्रीकृष्णप्रियायै
    नमः । श्रीकृष्णरूपिन्यै नमः । श्रीकालिकायै नमः । ३० श्रीकालरात्र्यै नमः । श्रीकुलजायै नमः । श्रीकुलपण्डितायै
    नमः । श्रीकुलधर्मप्रियायै नमः । श्रीकामायै नमः । श्रीकाम्यकर्मविभूषितायै नमः । श्रीकुलप्रियायै नमः
    । श्रीकुलरतायै नमः । श्रीकुलीनपरिपूजितायै नमः । श्रीकुलज्ञायै नमः । ४० श्रीकमलापूज्यायै नमः । श्रीकैलासनगभूषितायै
    नमः । श्रीकूटजायै नमः । श्रीकेशिन्यै नमः । श्रीकाम्यायै नमः । श्रीकामदायै नमः । श्रीकामपण्डितायै नमः
    । श्रीकरालास्यायै नमः । श्रीकन्दर्पकामिन्यै नमः । श्रीरूपशोभितायै नमः । ५० श्रीकोलम्बकायै नमः । श्रीकोलरतायै
    नमः । श्रीकेशिन्यै नमः । श्रीकेशभूषितायै नमः । श्रीकेशवस्यप्रियायै नमः । श्रीकाशायै नमः । श्रीकाश्मीरायै
    नमः । श्रीकेशवार्च्चितायै नमः । श्रीकामेश्वर्यै नमः । श्रीकामरूपायै नमः । ६० श्रीकामदानविभूषितायै
    नमः । श्रीकालहन्त्र्यै नमः । श्रीकूर्ममांसप्रियायै नमः । श्रीकूर्मादिपूजितायै नमः । श्रीकोलिन्यै नमः
    । श्रीकरकाकारायै नमः । श्रीकरकर्मनिषेविण्यै नमः । श्रीकटकेश्वरमध्यस्थायै नमः । श्रीकटक्यै नमः । श्रीकटकार्च्चितायै
    नमः । ७० श्रीकटप्रियायै नमः । श्रीकटरतायै नमः । श्रीकटकर्मनिषेविण्यै नमः । श्रीकुमारीपूजनरतायै नमः
    । श्रीकुमारीगणसेवितायै नमः । श्रीकुलाचारप्रियायै नमः । श्रीकौलप्रियायै नमः । श्रीकौलनिषेविण्यै नमः
    । श्रीकुलीनायै नमः । श्रीकुलधर्मज्ञायै नमः । ८० श्रीकुलभीतिविमर्द्दिन्यै नमः । श्रीकालधर्मप्रियायै
    नमः । श्रीकाम्य
