id: bhairavacatuhshashtinamavalih-1
category: stotram
name:
  english: bhairavacatuhshashtinamavalih 1
  devanagari: भैरवचतुःषष्टिनामावलिः १
content:
  english: om hrim asitangabhairavaya namah | om hrim vishalakshabhairavaya namah | om hrim martandabhairavaya
    namah | om hrim modakapriyabhairavaya namah | om hrim svacchandabhairavaya namah | om hrim vighnasantushtabhairavaya
    namah | om hrim khecarabhairavaya namah | om hrim sacaracarabhairavaya namah | om hrim rurubhairavaya
    namah | om hrim krodadamshtrabhairavaya namah | 10|| om hrim jatadharabhairavaya namah | om hrim vishvarupabhairavaya
    namah | om hrim virupakshabhairavaya namah | om hrim nanarupadharabhairavaya namah | om hrim parabhairavaya
    namah | om hrim vajrahastabhairavaya namah | om hrim mahakayabhairavaya namah | om hrim candabhairavaya
    namah | om hrim pralayantakabhairavaya namah | om hrim bhumikampabhairavaya namah | 20|| om hrim nilakanthabhairavaya
    namah | om hrim vishnubhairavaya namah | om hrim kulapalakabhairavaya namah | om hrim mundapalabhairavaya
    namah | om hrim kamapalabhairavaya namah | om hrim krodhabhairavaya namah | om hrim pingalekshanabhairavaya
    namah | om hrim abhrarupabhairavaya namah | om hrim dharapalabhairavaya namah | om hrim kutilabhairavaya
    namah | 30|| om hrim mantranayakabhairavaya namah | om hrim rudrabhairavaya namah | om hrim pitamahabhairavaya
    namah | om hrim unmattabhairavaya namah | om hrim vatunayakabhairavaya namah | om hrim shankarabhairavaya
    namah | om hrim bhutavetalabhairavaya namah | om hrim trinetrabhairavaya namah | om hrim tripurantakabhairavaya
    namah | om hrim varadabhairavaya namah | 40|| om hrim parvatavasabhairavaya namah | om hrim kapalabhairavaya
    namah | om hrim shashibhushanabhairavaya namah | om hrim hasticarmambaradharabhairavaya namah | om
    hrim yogishabhairavaya namah | om hrim brahmarakshasabhairavaya namah | om hrim sarvajnabhairavaya
    namah | om hrim sarvadeveshabhairavaya namah | om hrim sarvabhutahridisthitabhairavaya namah | om
    hrim bhishanabhairavaya namah | 50|| om hrim bhayaharabhairavaya namah | om hrim sarvajnabhairavaya
    namah | om hrim kalagnibhairavaya namah | om hrim maharaudrabhairavaya namah | om hrim dakshinabhairavaya
    namah | om hrim mukharabhairavaya namah | om hrim asthirabhairavaya namah | om hrim samharabhairavaya
    namah | om hrim atiriktangabhairavaya namah | om hrim nagapasha
  devanagari: ॐ ह्रीं असिताङ्गभैरवाय नमः । ॐ ह्रीं विशालाक्षभैरवाय नमः । ॐ ह्रीं मार्तण्डभैरवाय नमः ।
    ॐ ह्रीं मोदकप्रियभैरवाय नमः । ॐ ह्रीं स्वच्छन्दभैरवाय नमः । ॐ ह्रीं विघ्नसन्तुष्टभैरवाय नमः । ॐ ह्रीं
    खेचरभैरवाय नमः । ॐ ह्रीं सचराचरभैरवाय नमः । ॐ ह्रीं रुरुभैरवाय नमः । ॐ ह्रीं क्रोडदंष्ट्रभैरवाय नमः
    । १०॥ ॐ ह्रीं जटाधरभैरवाय नमः । ॐ ह्रीं विश्वरूपभैरवाय नमः । ॐ ह्रीं विरूपाक्षभैरवाय नमः । ॐ ह्रीं
    नानारूपधरभैरवाय नमः । ॐ ह्रीं परभैरवाय नमः । ॐ ह्रीं वज्रहस्तभैरवाय नमः । ॐ ह्रीं महाकायभैरवाय नमः
    । ॐ ह्रीं चण्डभैरवाय नमः । ॐ ह्रीं प्रलयान्तकभैरवाय नमः । ॐ ह्रीं भूमिकम्पभैरवाय नमः । २०॥ ॐ ह्रीं
    नीलकण्ठभैरवाय नमः । ॐ ह्रीं विष्णुभैरवाय नमः । ॐ ह्रीं कुलपालकभैरवाय नमः । ॐ ह्रीं मुण्डपालभैरवाय
    नमः । ॐ ह्रीं कामपालभैरवाय नमः । ॐ ह्रीं क्रोधभैरवाय नमः । ॐ ह्रीं पिङ्गलेक्षणभैरवाय नमः । ॐ ह्रीं
    अभ्ररूपभैरवाय नमः । ॐ ह्रीं धरापालभैरवाय नमः । ॐ ह्रीं कुटिलभैरवाय नमः । ३०॥ ॐ ह्रीं मन्त्रनायकभैरवाय
    नमः । ॐ ह्रीं रुद्रभैरवाय नमः । ॐ ह्रीं पितामहभैरवाय नमः । ॐ ह्रीं उन्मत्तभैरवाय नमः । ॐ ह्रीं वटुनायकभैरवाय
    नमः । ॐ ह्रीं शङ्करभैरवाय नमः । ॐ ह्रीं भूतवेतालभैरवाय नमः । ॐ ह्रीं त्रिनेत्रभैरवाय नमः । ॐ ह्रीं
    त्रिपुरान्तकभैरवाय नमः । ॐ ह्रीं वरदभैरवाय नमः । ४०॥ ॐ ह्रीं पर्वतावासभैरवाय नमः । ॐ ह्रीं कपालभैरवाय
    नमः । ॐ ह्रीं शशिभूषणभैरवाय नमः । ॐ ह्रीं हस्तिचर्माम्बरधरभैरवाय नमः । ॐ ह्रीं योगीशभैरवाय नमः । ॐ
    ह्रीं ब्रह्मराक्षसभैरवाय नमः । ॐ ह्रीं सर्वज्ञभैरवाय नमः । ॐ ह्रीं सर्वदेवेशभैरवाय नमः । ॐ ह्रीं सर्वभूतहृदिस्थितभैरवाय
    नमः । ॐ ह्रीं भीषणभैरवाय नमः । ५०॥ ॐ ह्रीं भयहरभैरवाय नमः । ॐ ह्रीं सर्वज्ञभैरवाय नमः । ॐ ह्रीं कालाग्निभैरवाय
    नमः । ॐ ह्रीं महारौद्रभैरवाय नमः । ॐ ह्रीं दक्षिणभैरवाय नमः । ॐ ह्रीं मुखरभैरवाय नमः । ॐ ह्रीं अस्थिरभैरवाय
    नमः । ॐ ह्रीं संहारभैरवाय नमः । ॐ ह्रीं अतिरिक्ताङ्गभैरवाय नमः । ॐ ह्रीं नागपाश
