id: budha-25
category: stotram
name:
  english: budha 25
  devanagari: बुध २५
content:
  english: budhaprityartham jape viniyogah || budho buddhimatam shreshtho buddhidata dhanapradah | priyangukalikashyamah
    kanjanetro manoharah || 1|| grahopamo rauhineyo nakshatresho dayakarah | viruddhakaryahanta ca saumyo
    buddhivivardhanah || 2|| candratmajo vishnurupi jnani jno jnaninayakah | grahapidaharo daraputradhanyapashupradah
    || 3|| lokapriyah saumyamurtirgunado gunivatsalah | pancavimshatinamani budhasyaitani yah pathet ||
    4|| smritva budham sada tasya pida sarva vinashyati | taddine va pathedyastu labhate sa manogatam
    || 5|| || iti shripadmapurane budhapancavimshatinamastotram sampurnam ||
  devanagari: बुधप्रीत्यर्थं जपे विनियोगः ॥ बुधो बुद्धिमतां श्रेष्ठो बुद्धिदाता धनप्रदः । प्रियङ्गुकलिकाश्यामः
    कञ्जनेत्रो मनोहरः ॥ १॥ ग्रहोपमो रौहिणेयो नक्षत्रेशो दयाकरः । विरुद्धकार्यहन्ता च सौम्यो बुद्धिविवर्धनः
    ॥ २॥ चन्द्रात्मजो विष्णुरूपी ज्ञानी ज्ञो ज्ञानिनायकः । ग्रहपीडाहरो दारपुत्रधान्यपशुप्रदः ॥ ३॥ लोकप्रियः
    सौम्यमूर्तिर्गुणदो गुणिवत्सलः । पञ्चविंशतिनामानि बुधस्यैतानि यः पठेत् ॥ ४॥ स्मृत्वा बुधं सदा तस्य
    पीडा सर्वा विनश्यति । तद्दिने वा पठेद्यस्तु लभते स मनोगतम् ॥ ५॥ ॥ इति श्रीपद्मपुराणे बुधपञ्चविंशतिनामस्तोत्रं
    सम्पूर्णम् ॥
meaning: {}
