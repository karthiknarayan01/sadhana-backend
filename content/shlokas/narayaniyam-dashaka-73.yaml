id: narayaniyam-dashaka-73
category: stotram
name:
  english: Narayaniyam Dashaka 73
content:
  english: nishamayya tavatha yanavartam bhrishamartah pashupalabalikastah | kimidam kimidam katham nvitimah
    samavetah paridevitanyakurvan || || karunanidhiresha nandasunuh kathamasman visrijedananyanathah |
    bata nah kimu daivamevamasiditi tastvadgatamanasa vilepuh || || caramaprahare pratishthamanah saha
    pitra nijamitramandalaishca | paritapabharam nitambininam shamayishyan vyamucah sakhayamekam || ||
    aciradupayami sannidhim vo bhavita sadhu mayaiva sangamashrih | amritambunidhau nimajjayishye drutamityashvasita
    vadhurakarshih || || savishadabharam sayacnamuccaih atiduram vanitabhirikshyamanah | mridu taddishi
    patayannapangan sabalo'krurarathena nirgato'bhuh || || anasa bahulena vallavanam manasa canugato'tha
    vallabhanam | vanamartamrigam vishannavriksham samatito yamunatatimayasih || || niyamaya nimajya varini
    tvamabhivikshyatha rathe'pi gandineyah | vivasho'jani kim nvidam vibhoste nanu citram tvavalokanam
    samantat || || punaresha nimajya punyashali purusham tvam paramam bhujangabhoge | arikambugadambujaih
    sphurantam surasiddhaughaparitamaluloke || || sa tada paramatmasaukhyasindhau vinimagnah pranuvan
    prakarabhedaih | avilokya punashca harshasindhoranuvrittya pulakavrito yayau tvam || || kimu shitalima
    mahan jale yat pulako'saviti coditena tena | atiharshaniruttarena sardham rathavasi pavanesha pahi
    mam tvam ||
  devanagari: निशमय्य तवाथ यानवार्तां भृशमार्ताः पशुपालबालिकास्ताः । किमिदं किमिदं कथं न्वितीमाः समवेताः
    परिदेवितान्यकुर्वन् ॥ ॥ करुणानिधिरेष नन्दसूनुः कथमस्मान् विसृजेदनन्यनाथाः । बत नः किमु दैवमेवमासीदिति
    तास्त्वद्गतमानसा विलेपुः ॥ ॥ चरमप्रहरे प्रतिष्ठमानः सह पित्रा निजमित्रमण्डलैश्च । परितापभरं नितम्बिनीनां
    शमयिष्यन् व्यमुचः सखायमेकम् ॥ ॥ अचिरादुपयामि सन्निधिं वो भविता साधु मयैव सङ्गमश्रीः । अमृताम्बुनिधौ
    निमज्जयिष्ये द्रुतमित्याश्वसिता वधूरकार्षीः ॥ ॥ सविषादभरं सयाच्ञमुच्चैः अतिदूरं वनिताभिरीक्ष्यमाणः
    । मृदु तद्दिशि पातयन्नपाङ्गान् सबलोऽक्रूररथेन निर्गतोऽभूः ॥ ॥ अनसा बहुलेन वल्लवानां मनसा चानुगतोऽथ
    वल्लभानाम् । वनमार्तमृगं विषण्णवृक्षं समतीतो यमुनातटीमयासीः ॥ ॥ नियमाय निमज्य वारिणि त्वामभिवीक्ष्याथ
    रथेऽपि गान्दिनेयः । विवशोऽजनि किं न्विदं विभोस्ते ननु चित्रं त्ववलोकनं समन्तात् ॥ ॥ पुनरेष निमज्य
    पुण्यशाली पुरुषं त्वां परमं भुजङ्गभोगे । अरिकम्बुगदाम्बुजैः स्फुरन्तं सुरसिद्धौघपरीतमालुलोके ॥ ॥ स
    तदा परमात्मसौख्यसिन्धौ विनिमग्नः प्रणुवन् प्रकारभेदैः । अविलोक्य पुनश्च हर्षसिन्धोरनुवृत्त्या पुलकावृतो
    ययौ त्वाम् ॥ ॥ किमु शीतलिमा महान् जले यत् पुलकोऽसाविति चोदितेन तेन । अतिहर्षनिरुत्तरेण सार्धं रथवासी
    पवनेश पाहि मां त्वम् ॥
