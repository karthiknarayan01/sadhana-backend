id: mukunda-mala-stotram
category: stotram
name:
  english: Mukunda Mala Stotram
  devanagari: मुकुन्दमालास्तोत्रम् (कुलशेखरविरचितम्)
content:
  english: samskaran - 1 shloka samkhya 40 shrivallabheti varadeti dayapareti bhaktapriyeti bhavalunthanakovideti
    | natheti nagashayaneti jagannivasety alapinam pratidinam kuru mam mukunda || 1|| jayatu jayatu devo
    devakinandano'yam jayatu jayatu krishno vrishnivamshapradipah | jayatu jayatu meghashyamalah komalango
    jayatu jayatu prithvibharanasho mukundah || 2|| || ka 2|| mukunda murdhna pranipatya yace bhavantamekantamiyantamartham
    | avismritistvaccaranaravinde bhave bhave me'stu bhavatprasadat || 3|| || ka 3|| naham vande tava
    caranayordvandvamadvandvahetoh kumbhipakam gurumapi hare narakam napanetum | ramyaramamridutanulata
    nandane napi rantum bhave bhave hridayabhavane bhavayeyam bhavantam || 4|| || ka 5|| nastha dharme
    na vasunicaye naiva kamopabhoge yad bhavyam tad bhavatu bhagavanpurvakarmanurupam | etatprarthyam
    mama bahumatam janmajanmantare'pi tvatpadambhoruhayugagata nishcala bhaktirastu || 5|| || ka 6|| divi
    va bhuvi va mamastu vaso narake va narakantaka prakamam | avadhiritasharadaravindau caranau te marane'pi
    cintayami || 6|| || ka 7|| krishna tvadiyapadapankajapanjarantam adyaiva me vishatu manasarajahamsah
    | pranaprayanasamaye kaphavatapittaih kanthavarodhanavidhau smaranam kutaste || 7|| cintayami harimeva
    santatam mandahasamuditananambujam nandagopatanayam parat param naradadimunivrindavanditam || 8||
    karacaranasaroje kantimannetramine shramamushi bhujavicivyakule'gadhamarge | harisarasi vigahyapiya
    tejojalaugham bhavamaruparikhinnah kleshamadya tyajami || 9|| sarasijanayane sashankhacakre murabhidi
    ma viramasva citta rantum | var virameha sukhataramaparam na jatu jane var sukhakara haricaranasmaranamritena
    tulyam || 10|| || ka 8|| mabhirmandamano vicintya bahudha yamishciram yatanah var mabhairmandamano
    nami nah prabhavanti paparipavah svami nanu shridharah | alasyam vyapaniya bhaktisulabham dhyayasva
    narayanam lokasya vyasanapanodanakaro dasasya kim na kshamah || 11|| || ka 9|| bhavajaladhigatanam
    dvandvavatahatanam sutaduhitrikalatratranabhararditanam | vishamavishayatoye majjatamaplavanam bhavatu
    sharanameko vishnupoto naranam || 12|| bhavajaladhimagadham dustaram nistareyam kathamahamiti ceto
    ma sma gah kataratvam | sarasijadrishi deve taraki bhaktireka var tavaki narakabhidi nishanna tarayishyatyavashyam
    || 13|| || ka 10|| trishnatoye madanapavanoddhutamohormimale daravarte tanayasahajagrahasanghakule
    ca | samsarakhye mahati jaladhau majjatam nastridhaman padambhoje varada bhavato bhaktinavam prayaccha
    || 14|| || ka 11|| madraksham kshinapunyankshanamapi bhavato bhaktihinanpadabje mashrausham shravyabandham
    tava caritamapasyanyadakhyanajatam | var shravyabaddham masmarsham madhava tvamapi bhuvanapate cetasapahnuvanan
    var maspraksham mabhuvam tvatsaparyaparikararahito janmajanmantare'pi || 15|| || ka 23|| var tvatsaparyavyatikararahito
    jihve kirtaya keshavam muraripum ceto bhaja shridharam panidvandva samarcayacyutakathah shrotradvaya
    tvam shrinu | krishnam lokaya locanadvaya harergacchanghriyugmalayam jighra ghrana mukundapadatulasim
    murdhan namadhokshajam || 16|| || ka 26|| he lokah shrunuta prasutimaranavyadheshcikitsamimam var
    bho lokah yogajnah samudaharanti munayo yam yajnavalkyadayah | antarjyotirameyamekamamritam krishnakhyamapiyatam
    tatpitam paramaushadham vitanute nirvanamatyantikam || 17|| || ka 18|| var yatpitam he martyah paramam
    hitam shrunuta vo vakshyami sankshepatah samsararnavamapadurmibahulam samyak pravishya sthitah | nanajnanamapasya
    cetasi namo narayanayetyamum mantram sapranavam pranamasahitam pravartayadhvam muhuh || 18|| prithvirenuranuh
    payamsi kanikah phalgusphulingo'nala - stejo nihshvasanam marut tanutaram randhram susukshmam nabhah
    | kshudra rudrapitamahaprabhritayah kitah samastah sura drishte yatra sa tavako vijayate "bhumavadhutavadhih
    || 19|| || ka 12|| baddhenanjalina natena shirasa gatraih saromodgamaih kanthena svaragadgadena nayanenodgirnabashpambuna
    | nityam tvaccaranaravindayugaladhyanamritasvadinam asmakam sarasiruhaksha satatam sampadyatam jivitam
    || 20|| || ka 19|| he gopalaka he kripajalanidhe he sindhukanyapate he kamsantaka he gajendrakarunaparina
    he madhava | he ramanuja he jagattrayaguro he pundarikaksha mam he gopijananatha palaya param janami
    na tvam vina || 21|| bhaktapayabhujangagarudamanistrailokyarakshamanir var bhaktadveshi gopilocanacatakambudamanih
    saundaryamudramanih yah kantamanirukminighanakucadvandvaikabhushamanih var shri kanta shreyo devashikhamanirdishatu
    no gopalacudamanih || 22|| || ka 28|| var shreyo dhyeya shatrucchedaikamantram sakalamupanishadvakyasampujyamantram
    samsarottaramantram samucitatamasah sanghaniryanamantram | var samuditamanasam sarvaishvaryaikamantram
    vyasanabhujagasandashtasantranamantram jihve shrikrishnamantram japa japa satatam janmasaphalyamantram
    || 23|| || ka 29 || vyamohaprashamaushadham munimanovrittipravrittyaushadham var vyamohoddalanaushadham
    daityendrartikaraushadham trijagatam sanjivanaikaushadham | var daityanarthakaraushadham bhaktatyantahitaushadham
    bhavabhayapradhvamsanaikaushadham var bhaktartiprashamaushadham bhavabhayapradhvamsi divyaushadham
    shreyahpraptikaraushadham piba manah shrikrishnadivyaushadham || 24|| || ka 30 || var shrikrishnanamaushadham
    amnayabhyasananyaranyaruditam vedavratanyanvaham var kricchuvratanyanvaham medashchedaphalani purtavidhayah
    sarvam hutam bhasmani | var medacchedapadani tirthanamavagahanani ca gajasnanam vina yatpada - dvandvambhoruhasamsmritim
    vijayate devah sa narayanah || 25|| || ka 13|| var dvandvambhoruhasamstutim shrimannama procya narayanakhyam
    kena prapurvanchitam papino'pi | var yena ha nah purvam vakpravritta na tasmim - stena praptam garbhavasadiduhkham
    || 26|| || ka 22|| majjanmanah phalamidam madhukaitabhare matprarthaniyamadanugraha esha eva | tvadbhrityabhrityaparicarakabhrityabhritya-
    bhrityasya bhritya iti mam smara lokanatha || 27|| nathe nahpurushottame trijagatamekadhipe cetasa
    var shripurushottame sevye svasya padasya datari pare narayane tishthati | yam kancitpurushadhamam
    katipayagrameshamalparthadam sevayai mrigayamahe naramaho mudha varaka vayam || 28|| || ka 17|| madana
    parihara sthitim madiye manasi mukundapadaravindadhamni | haranayanakrishanuna krisho'si smarasi na
    cakraparakramam murareh || 29|| || ka 24|| tattvam bruvanani param parastan var parasmat madhu ksharantiva
    mudavahani | var aho ksharantiva sudham padani | pravartaya pranjalirasmi jihve var avartaya namani
    narayanagocarani || 30|| || ka 20|| idam shariram parinamapeshalam var shlathasandhijarjaram patatyavashyam
    parinamapeshalam | var patatyavashyam shlathasamdhi jarjaram | kimaushadhaih klishyasi mudha durmate
    niramayam krishnarasayanam piba || 31|| || ka 21|| dara varakaravarasuta te tanujo virincih var te'ngajo'yam
    stota vedastava suragano bhrityavargah prasadah | muktirmaya jagad avikalam tavaki devaki te var muktirmadhye
    mata mitram balaripusutastattvadanyamna jane || 32|| || ka 25|| var balaripusutastattvato'nyanna krishno
    rakshatu no jagattrayaguruh krishnam namadhvam sada krishnenakhilashatravo vinihatah krishnaya tasmai
    namah | krishnadeva samutthitam jagadidam krishnasya daso'smyaham krishne tishthati vishvametad akhilam
    he! krishna rakshasva mam || 33|| tat tvam prasida bhagavan kuru mayyanathe vishno kripam paramakarunikah
    khalu tvam | samsarasagaranimagnamananta dinam uddhartumarhasi hare purushottamo'si || 34|| namami
    narayanapadapankajam karomi narayanapujanam sada | vadami narayananama nirmalam smarami narayanatattvamavyayam
    || 35|| shrinatha narayana vasudeva shrikrishna bhaktapriya cakrapane | shripadmanabhacyuta kaitabhare
    shrirama padmaksha hare murare || 36|| ananta vaikuntha mukunda krishna var ananda govinda mukunda
    rama govinda damodara madhaveti | var narayanananta niramayeti | vaktum samartho'pi na vakti kashcit
    aho jananam vyasanabhimukhyam || 37|| || ka 14 || var vyasananimokshe dhyayanti ye vishnumanantamavyayam
    hritpadmamadhye satatam vyavasthitam | samahitanam satatabhayapradam te yanti siddhim paramam tu vaishnavim
    || 38|| kshirasagaratarangashikara - saratarakitacarumurtaye | bhogibhogashayaniyashayine madhavaya
    madhuvidvishe namah || 39|| || ka 15|| yasya priyau shrutidharau kavilokavirau var kavilokagitau mitre
    dvijanmavarapadmasharavabhutam | var dvijanmaparivarashivavabhutam | tenambujakshacaranambujashatpadena
    rajna krita kritiriyam kulashekharena || 40|| || ka 34|| var stutiriyam || iti shrikulashekharena
    viracita mukundamala sampurna
  devanagari: संस्करण् - १ श्लोक संख्या ४० श्रीवल्लभेति वरदेति दयापरेति भक्तप्रियेति भवलुण्ठनकोविदेति
    । नाथेति नागशयनेति जगन्निवासेत्य् आलापिनं प्रतिदिनं कुरु मां मुकुन्द ॥ १॥ जयतु जयतु देवो देवकीनन्दनोऽयं
    जयतु जयतु कृष्णो वृष्णिवंशप्रदीपः । जयतु जयतु मेघश्यामलः कोमलाङ्गो जयतु जयतु पृथ्वीभारनाशो मुकुन्दः
    ॥ २॥ ॥ का २॥ मुकुन्द मूर्ध्ना प्रणिपत्य याचे भवन्तमेकान्तमियन्तमर्थम् । अविस्मृतिस्त्वच्चरणारविन्दे
    भवे भवे मेऽस्तु भवत्प्रसादात् ॥ ३॥ ॥ का ३॥ नाहं वन्दे तव चरणयोर्द्वन्द्वमद्वन्द्वहेतोः कुम्भीपाकं
    गुरुमपि हरे नारकं नापनेतुम् । रम्यारामामृदुतनुलता नन्दने नापि रन्तुं भावे भावे हृदयभवने भावयेयं भवन्तम्
    ॥ ४॥ ॥ का ५॥ नास्था धर्मे न वसुनिचये नैव कामोपभोगे यद् भाव्यं तद् भवतु भगवन्पूर्वकर्मानुरूपम् । एतत्प्रार्थ्यं
    मम बहुमतं जन्मजन्मान्तरेऽपि त्वत्पादाम्भोरुहयुगगता निश्चला भक्तिरस्तु ॥ ५॥ ॥ का ६॥ दिवि वा भुवि वा
    ममास्तु वासो नरके वा नरकान्तक प्रकामम् । अवधीरितशारदारविन्दौ चरणौ ते मरणेऽपि चिन्तयामि ॥ ६॥ ॥ का ७॥
    कृष्ण त्वदीयपदपङ्कजपञ्जरान्तं अद्यैव मे विशतु मानसराजहंसः । प्राणप्रयाणसमये कफवातपित्तैः कण्ठावरोधनविधौ
    स्मरणं कुतस्ते ॥ ७॥ चिन्तयामि हरिमेव सन्ततं मन्दहासमुदिताननाम्बुजं नन्दगोपतनयं परात् परं नारदादिमुनिवृन्दवन्दितम्
    ॥ ८॥ करचरणसरोजे कान्तिमन्नेत्रमीने श्रममुषि भुजवीचिव्याकुलेऽगाधमार्गे । हरिसरसि विगाह्यापीय तेजोजलौघं
    भवमरुपरिखिन्नः क्लेशमद्य त्यजामि ॥ ९॥ सरसिजनयने सशङ्खचक्रे मुरभिदि मा विरमस्व चित्त रन्तुम् । वर्
    विरमेह सुखतरमपरं न जातु जाने वर् सुखकर हरिचरणस्मरणामृतेन तुल्यम् ॥ १०॥ ॥ का ८॥ माभीर्मन्दमनो विचिन्त्य
    बहुधा यामीश्चिरं यातनाः वर् माभैर्मन्दमनो नामी नः प्रभवन्ति पापरिपवः स्वामी ननु श्रीधरः । आलस्यं व्यपनीय
    भक्तिसुलभं ध्यायस्व नारायणं लोकस्य व्यसनापनोदनकरो दासस्य किं न क्षमः ॥ ११॥ ॥ का ९॥ भवजलधिगतानां द्वन्द्ववाताहतानां
    सुतदुहितृकलत्रत्राणभारार्दितानाम् । विषमविषयतोये मज्जतामप्लवानां भवतु शरणमेको विष्णुपोतो नराणाम् ॥
    १२॥ भवजलधिमगाधं दुस्तरं निस्तरेयं कथमहमिति चेतो मा स्म गाः कातरत्वम् । सरसिजदृशि देवे तारकी भक्तिरेका
    वर् तावकी नरकभिदि निषण्णा तारयिष्यत्यवश्यम् ॥ १३॥ ॥ का १०॥ तृष्णातोये मदनपवनोद्धूतमोहोर्मिमाले दारावर्ते
    तनयसहजग्राहसङ्घाकुले च । संसाराख्ये महति जलधौ मज्जतां नस्त्रिधामन् पादाम्भोजे वरद भवतो भक्तिनावं प्रयच्छ
    ॥ १४॥ ॥ का ११॥ माद्राक्षं क्षीणपुण्यान्क्षणमपि भवतो भक्तिहीनान्पदाब्जे माश्रौषं श्राव्यबन्धं तव चरितमपास्यान्यदाख्यानजातम्
    । वर् श्राव्यबद्धं मास्मार्षं माधव त्वामपि भुवनपते चेतसापह्नुवानान् वर् मास्प्राक्षं माभूवं त्वत्सपर्यापरिकररहितो
    जन्मजन्मान्तरेऽपि ॥ १५॥ ॥ का २३॥ वर् त्वत्सपर्याव्यतिकररहितो जिह्वे कीर्तय केशवं मुररिपुं चेतो भज
    श्रीधरं पाणिद्वन्द्व समर्चयाच्युतकथाः श्रोत्रद्वय त्वं शृणु । कृष्णं लोकय लोचनद्वय हरेर्गच्छाङ्घ्रियुग्मालयं
    जिघ्र घ्राण मुकुन्दपादतुलसीं मूर्धन् नमाधोक्षजम् ॥ १६॥ ॥ का २६॥ हे लोकाः श्रुणुत प्रसूतिमरणव्याधेश्चिकित्सामिमां
    वर् भो लोकाः योगज्ञाः समुदाहरन्ति मुनयो यां याज्ञवल्क्यादयः । अन्तर्ज्योतिरमेयमेकममृतं कृष्णाख्यमापीयतां
    तत्पीतं परमौषधं वितनुते निर्वानमत्यन्तिकम् ॥ १७॥ ॥ का १८॥ वर् यत्पितं हे मर्त्याः परमं हितं श्रुणुत
    वो वक्ष्यामि सङ्क्षेपतः संसारार्णवमापदूर्मिबहुलं सम्यक् प्रविश्य स्थिताः । नानाज्ञानमपास्य चेतसि नमो
    नारायणायेत्यमुं मन्त्रं सप्रणवं प्रणामसहितं प्रावर्तयध्वं मुहुः ॥ १८॥ पृथ्वीरेणुरणुः पयांसि कणिकाः
    फल्गुस्फुलिङ्गोऽनल - स्तेजो निःश्वसनं मरुत् तनुतरं रन्ध्रं सुसूक्ष्मं नभः । क्षुद्रा रुद्रपितामहप्रभृतयः
    कीटाः समस्ताः सुरा दृष्टे यत्र स तावको विजयते "भूमावधूतावधिः ॥ १९॥ ॥ का १२॥ बद्धेनाञ्जलिना नतेन शिरसा
    गात्रैः सरोमोद्गमैः कण्ठेन स्वरगद्गदेन नयनेनोद्गीर्णबाष्पाम्बुना । नित्यं त्वच्चरणारविन्दयुगलध्यानामृतास्वादिनां
    अस्माकं सरसीरुहाक्ष सततं सम्पद्यतां जीवितम् ॥ २०॥ ॥ का १९॥ हे गोपालक हे कृपाजलनिधे हे सिन्धुकन्यापते
    हे कंसान्तक हे गजेन्द्रकरुणापारीण हे माधव । हे रामानुज हे जगत्त्रयगुरो हे पुण्डरीकाक्ष मां हे गोपीजननाथ
    पालय परं जानामि न त्वां विना ॥ २१॥ भक्तापायभुजङ्गगारुडमणिस्त्रैलोक्यरक्षामणिर् वर् भक्ताद्वेषि गोपीलोचनचातकाम्बुदमणिः
    सौन्दर्यमुद्रामणिः यः कान्तामणिरुक्मिणीघनकुचद्वन्द्वैकभूषामणिः वर् श्री कान्ता श्रेयो देवशिखामणिर्दिशतु
    नो गोपालचूडामणिः ॥ २२॥ ॥ का २८॥ वर् श्रेयो ध्येय शत्रुच्छेदैकमन्त्रं सकलमुपनिषद्वाक्यसम्पूज्यमन्त्रं
    संसारोत्तारमन्त्रं समुचिततमसः सङ्घनिर्याणमन्त्रम् । वर् समुदितमनसां सर्वैश्वर्यैकमन्त्रं व्यसनभुजगसन्दष्टसन्त्राणमन्त्रं
    जिह्वे श्रीकृष्णमन्त्रं जप जप सततं जन्मसाफल्यमन्त्रम् ॥ २३॥ ॥ का २९ ॥ व्यामोहप्रशमौषधं मुनिमनोवृत्तिप्रवृत्त्यौषधं
    वर् व्यामोहोद्दलनौषधं दैत्येन्द्रार्तिकरौषधं त्रिजगतां सञ्जीवनैकौषधम् । वर् दैत्यानर्थकरौषधं भक्तात्यन्तहितौषधं
    भवभयप्रध्वंसनैकौषधं वर् भक्तार्तिप्रशमौषधं भवभयप्रध्वंसि दिव्यौषधं श्रेयःप्राप्तिकरौषधं पिब मनः श्रीकृष्णदिव्यौषधम्
    ॥ २४॥ ॥ का ३० ॥ वर् श्रीकृष्णनामौषधम् आम्नायाभ्यसनान्यरण्यरुदितं वेदव्रतान्यन्वहं वर् कृच्छूव्रतान्यन्वहं
    मेदश्छेदफलानि पूर्तविधयः सर्वं हुतं भस्मनि । वर् मेदच्छेदपदानि तीर्थानामवगाहनानि च गजस्नानं विना यत्पद
    - द्वन्द्वाम्भोरुहसंस्मृतिं विजयते देवः स नारायणः ॥ २५॥ ॥ का १३॥ वर् द्वन्द्वाम्भोरुहसंस्तुतिं श्रीमन्नाम
    प्रोच्य नारायणाख्यं केन प्रापुर्वाञ्छितं पापिनोऽपि । वर् येन हा नः पूर्वं वाक्प्रवृत्ता न तस्मिं -
    स्तेन प्राप्तं गर्भवासादिदुःखम् ॥ २६॥ ॥ का २२॥ मज्जन्मनः फलमिदं मधुकैटभारे मत्प्रार्थनीयमदनुग्रह एष
    एव । त्वद्भृत्यभृत्यपरिचारकभृत्यभृत्य- भृत्यस्य भृत्य इति मां स्मर लोकनाथ ॥ २७॥ नाथे नःपुरुषोत्तमे
    त्रिजगतामेकाधिपे चेतसा वर् श्रीपुरुषोत्तमे सेव्ये स्वस्य पदस्य दातरि परे नारायणे तिष्ठति । यं कञ्चित्पुरुषाधमं
    कतिपयग्रामेशमल्पार्थदं सेवायै मृगयामहे नरमहो मूढा वराका वयम् ॥ २८॥ ॥ का १७॥ मदन परिहर स्थितिं मदीये
    मनसि मुकुन्दपदारविन्दधाम्नि । हरनयनकृशानुना कृशोऽसि स्मरसि न चक्रपराक्रमं मुरारेः ॥ २९॥ ॥ का २४॥ तत्त्वं
    ब्रुवाणानि परं परस्तान् वर् परस्मात् मधु क्षरन्तीव मुदावहानि । वर् अहो क्षरन्तीव सुधां पदानि । प्रवर्तय
    प्राञ्जलिरस्मि जिह्वे वर् आवर्तय नामानि नारायणगोचराणि ॥ ३०॥ ॥ का २०॥ इदं शरीरं परिणामपेशलं वर् श्लथसन्धिजर्जरं
    पतत्यवश्यं परिणामपेशलम् । वर् पतत्यवश्यं श्लथसंधि जर्जरम् । किमौषधैः क्लिश्यसि मूढ दुर्मते निरामयं
    कृष्णरसायनं पिब ॥ ३१॥ ॥ का २१॥ दारा वाराकरवरसुता ते तनूजो विरिञ्चिः वर् तेऽङ्गजोऽयं स्तोता वेदस्तव
    सुरगणो भृत्यवर्गः प्रसादः । मुक्तिर्माया जगद् अविकलं तावकी देवकी ते वर् मुक्तिर्मध्ये माता मित्रं
    बलरिपुसुतस्तत्त्वदन्यंन जाने ॥ ३२॥ ॥ का २५॥ वर् बलरिपुसुतस्तत्त्वतोऽन्यन्न कृष्णो रक्षतु नो जगत्त्रयगुरुः
    कृष्णं नमध्वं सदा कृष्णेनाखिलशत्रवो विनिहताः कृष्णाय तस्मै नमः । कृष्णादेव समुत्थितं जगदिदं कृष्णस्य
    दासोऽस्म्यहं कृष्णे तिष्ठति विश्वमेतद् अखिलं हे! कृष्ण रक्षस्व माम् ॥ ३३॥ तत् त्वं प्रसीद भगवन् कुरु
    मय्यनाथे विष्णो कृपां परमकारुणिकः खलु त्वम् । संसारसागरनिमग्नमनन्त दीनं उद्धर्तुमर्हसि हरे पुरुषोत्तमोऽसि
    ॥ ३४॥ नमामि नारायणपादपङ्कजं करोमि नारायणपूजनं सदा । वदामि नारायणनाम निर्मलं स्मरामि नारायणतत्त्वमव्ययम्
    ॥ ३५॥ श्रीनाथ नारायण वासुदेव श्रीकृष्ण भक्तप्रिय चक्रपाणे । श्रीपद्मनाभाच्युत कैटभारे श्रीराम पद्माक्ष
    हरे मुरारे ॥ ३६॥ अनन्त वैकुण्ठ मुकुन्द कृष्ण वर् आनन्द गोविन्द मुकुन्द राम गोविन्द दामोदर माधवेति
    । वर् नारायणानन्त निरामयेति । वक्तुं समर्थोऽपि न वक्ति कश्चित् अहो जनानां व्यसनाभिमुख्यम् ॥ ३७॥ ॥
    का १४ ॥ वर् व्यसनानिमोक्षे ध्यायन्ति ये विष्णुमनन्तमव्ययं हृत्पद्ममध्ये सततं व्यवस्थितम् । समाहितानां
    सतताभयप्रदं ते यान्ति सिद्धिं परमां तु वैष्णवीम् ॥ ३८॥ क्षीरसागरतरङ्गशीकरा - सारतारकितचारुमूर्तये
    । भोगिभोगशयनीयशायिने माधवाय मधुविद्विषे नमः ॥ ३९॥ ॥ का १५॥ यस्य प्रियौ श्रुतिधरौ कविलोकवीरौ वर् कविलोकगीतौ
    मित्रे द्विजन्मवरपद्मशरावभूताम् । वर् द्विजन्मपरिवारशिवावभूताम् । तेनाम्बुजाक्षचरणाम्बुजषट्पदेन राज्ञा
    कृता कृतिरियं कुलशेखरेण ॥ ४०॥ ॥ का ३४॥ वर् स्तुतिरियं ॥ इति श्रीकुलशेखरेण विरचिता मुकुन्दमाला सम्पूर्णा
