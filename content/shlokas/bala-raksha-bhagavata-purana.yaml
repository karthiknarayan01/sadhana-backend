id: bala-raksha-bhagavata-purana
category: stotram
name:
  english: Bala Raksha (Bhagavata Purana)
content:
  english: shri ganeshaya namah | avyadajo'nghri manimamstava janvathoru yajno'cyutah katitatam jatharam
    hayasyah | hritkeshavastvadura isha inastu kantham vishnurbhujam mukhamurukrama ishvarah kam || ||
    cakryagratah sahagado harirastu pashcat tvatparshvayordhanurasi madhuhajanashca | koneshu shankha
    urugaya uparyupendras tarkshyah kshitau haladharah purushah samantat || || indriyani hrishikeshah
    pranannarayano'vatu | shvetadvipapatishcittam mano yogeshvaro'vatu || || prishnigarbhastu te buddhimatmanam
    bhagavanparah | kridantam patu govindah shayanam patu madhavah || || vrajantamavyadvaikuntha asinam
    tvam shriyah patih | bhunjanam yajnabhukpatu sarvagrahabhayankarah || || dakinyo yatudhanyashca kushmanda
    ye'rbhakagrahah | bhutapretapishacashca yaksharakshovinayakah || || kotara revati jyeshtha putana
    matrikadayah | unmada ye hyapasmara dehapranendriyadruhah || || svapnadrishta mahotpata vriddhabalagrahashca
    ye | sarve nashyantu te vishnornamagrahanabhiravah || || || iti shrimadbhagavate dashamaskandhe gopikritabalaraksha
    samapta ||
  devanagari: श्री गणेशाय नमः । अव्यादजोऽङ्घ्रि मणिमांस्तव जान्वथोरू यज्ञोऽच्युतः कटितटं जठरं हयास्यः
    । हृत्केशवस्त्वदुर ईश इनस्तु कण्ठं विष्णुर्भुजं मुखमुरुक्रम ईश्वरः कम् ॥ ॥ चक्र्यग्रतः सहगदो हरिरस्तु
    पश्चात् त्वत्पार्श्वयोर्धनुरसी मधुहाजनश्च । कोणेषु शङ्ख उरुगाय उपर्युपेन्द्रस् तार्क्ष्यः क्षितौ हलधरः
    पुरुषः समन्तात् ॥ ॥ इन्द्रियाणि हृषीकेशः प्राणान्नारायणोऽवतु । श्वेतद्वीपपतिश्चित्तं मनो योगेश्वरोऽवतु
    ॥ ॥ पृश्निगर्भस्तु ते बुद्धिमात्मानं भगवान्परः । क्रीडन्तं पातु गोविन्दः शयानं पातु माधवः ॥ ॥ व्रजन्तमव्याद्वैकुण्ठ
    आसीनं त्वां श्रियः पतिः । भुञ्जानं यज्ञभुक्पातु सर्वग्रहभयङ्करः ॥ ॥ डाकिन्यो यातुधान्यश्च कुष्माण्डा
    येऽर्भकग्रहाः । भूतप्रेतपिशाचाश्च यक्षरक्षोविनायकाः ॥ ॥ कोटरा रेवती ज्येष्ठा पूतना मातृकादयः । उन्मादा
    ये ह्यपस्मारा देहप्राणेन्द्रियद्रुहः ॥ ॥ स्वप्नदृष्टा महोत्पाता वृद्धबालग्रहाश्च ये । सर्वे नश्यन्तु
    ते विष्णोर्नामग्रहणभीरवः ॥ ॥ ॥ इति श्रीमद्भागवते दशमस्कन्धे गोपीकृतबालरक्षा समाप्ता ॥
