id: suryastavarajastotra
category: stotram
name:
  english: suryastavarajastotra
  devanagari: सूर्यस्तवराजस्तोत्र
content:
  english: om vikartano vivasvamshca martando bhaskaro ravih | lokaprakashakah shriman lokacakshu graheshvarah
    || lokasakshi trilokeshah karta harta tamisraha | tapanah tapanah caiva shucih saptashvavahanah ||
    gabhastihasto bradhnashca sarvadevanamaskritah | ekavimshatih ityesha stava ishtah sada mama || ||
    phalashrutih || shrih arogyakarah caiva dhanavriddhiyashaskarah | stavaraja iti khyatah trishu lokeshu
    vishrutah || yah etena mahabaho dve sandhye stimitodaye | stauti mam pranato bhutva sarva papaih pramucyate
    || kayikam vacikam caiva manasam yacca dushkritam | ekajapyena tat sarvam pranashyati mamagratah ||
    ekajapyashca homashca sandhyopasanameva ca | balimantro'rghyamantrashca dhupamantrastathaiva ca ||
    annapradane snane ca pranipati pradakshine | pujito'yam mahamantrah sarvavyadhiharah shubhah || evam
    uktava tu bhagavanah bhaskaro jagadishvarah | amantrya krishnatanayam tatraivantaradhiyata || sambo'pi
    stavarajena stutva saptashvavahanah | putatma nirujah shriman tasmadrogadvimuktavan || bhagavan suryanamavali
    1
  devanagari: ॐ विकर्तनो विवस्वांश्च मार्तण्डो भास्करो रविः । लोकप्रकाशकः श्रीमान् लोकचक्षु ग्रहेश्वरः
    ॥ लोकसाक्षी त्रिलोकेशः कर्ता हर्ता तमिस्रहा । तपनः तापनः चैव शुचिः सप्ताश्ववाहनः ॥ गभस्तिहस्तो ब्रध्नश्च
    सर्वदेवनमस्कृतः । एकविंशतिः इत्येष स्तव इष्टः सदा मम ॥ ॥ फलश्रुतिः ॥ श्रीः आरोग्यकरः चैव धनवृद्धियशस्करः
    । स्तवराज इति ख्यातः त्रिषु लोकेषु विश्रुतः ॥ यः एतेन महाबहो द्वे सन्ध्ये स्तिमितोदये । स्तौति मां
    प्रणतो भूत्वा सर्व पापैः प्रमुच्यते ॥ कायिकं वाचिकं चैव मानसं यच्च दुष्कृतम् । एकजप्येन तत् सर्वं
    प्रणश्यति ममाग्रतः ॥ एकजप्यश्च होमश्च सन्ध्योपासनमेव च । बलिमन्त्रोऽर्घ्यमन्त्रश्च धूपमन्त्रस्तथैव
    च ॥ अन्नप्रदाने स्नाने च प्रणिपाति प्रदक्षिणे । पूजितोऽयं महामन्त्रः सर्वव्याधिहरः शुभः ॥ एवं उक्तवा
    तु भगवानः भास्करो जगदीश्वरः । आमन्त्र्य कृष्णतनयं तत्रैवान्तरधीयत ॥ साम्बोऽपि स्तवराजेन स्तुत्वा सप्ताश्ववाहनः
    । पूतात्मा नीरुजः श्रीमान् तस्माद्रोगाद्विमुक्तवान् ॥ भगवान् सूर्यनामावली १
