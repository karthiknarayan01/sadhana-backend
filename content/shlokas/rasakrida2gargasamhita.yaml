id: rasakrida2gargasamhita
category: stotram
name:
  english: rasakrida2gargasamhita
  devanagari: रासक्रीडा२गर्गसम्हिता
content:
  english: gopya ucuh adharabimbavidambitavidrumam madhuravenuninadavinoditam | kamalakomalanilamukhambujam
    tamapi gopakumaramupasmahe || 1|| shyamalam vipinakelilampatam komalam kamalapatralocanam | kamadam
    vrajavilasinidrisham shitalam matiharam bhajamahe || 2|| tam visancalitalocanancalam samikudmalitakomaladharam
    | vamshavalgitakarangulimukham venunadarasikam bhajamahe || 3|| ishadankuritadantakundalam bhushanam
    bhuvanamangalashriyam | ghoshasaurabhamanoharam harerveshameva mrigayamahe vayam || 4|| astu nityamaravindalocanah
    shreyase hi tu surarcitakritih | yasya padasarasiruhamritam sevyamanamanisham munishvaraih || 5||
    gopakai racitamallasangaram sangare jitavidagdhayauvanam | cintayami manasa sadaiva tam daivatam nikhilayoginamapi
    || 6|| ullasannavapayodameva tam phullatamarasalocanancalam | ballavihridayapashyatoharam pallavadharamupasmahe
    vayam || 7|| yaddhananjayarathasya mandanam khandanam tadapi sancitainasam | jivanam shrutigiram sadamalam
    shyamalam manasi me'stu tanmahah || 8|| gopikastanavilolalocanaprantalocanaparamparavritam | balakelirasalalasam
    bhramam madhavam tamanisham vibhavaye || 9|| nilakanthakritapicchashekharam nilameghatulitangavaibhavam
    | nilapankajapalashalocanam nilakuntaladharam bhajamahe || 10|| ghoshayoshidanugitavaibhavam komalasvaritavenunihsvanam
    | sarabhutamabhiramasampadam dhama tamarasalocanam bhaje || 11|| mohanam manasi sharnginam param nirgatam
    kila vihaya maninih | naradadimunibhishca sevitam nandagopatanayam bhajamahe || 12|| shriharistu ramanibhiravrito
    yastu vai jayati rasamandale | radhaya saha vane ca duhkhitastam priyam hi mrigayamahe vayam || 13||
    devadeva vrajarajanandana dehi darshanamalam ca no hare | sarvaduhkhaharanam ca purvavatsannirikshya
    tava shulkadasikah || 14|| kshititaloddharanaya dadhara yah sakalayajnavarahavapuh param | ditisutam
    vidadara ca damshtraya sa tu sadoddharanaya kshamo'stu nah || 15|| manumatadrucijo divijaih saha vasu
    dudoha dharamapi yah prithuh | shrutimapaddhritamatsyavapuh param sa sharanam kila no'stvashubhakshane
    || 16|| avahadabdhimaho girimurjitam kamatharupadharah paramastu yah | asuharam nriharistamadandayatsa
    ca harih paramam sharanam ca nah || 17|| nripabalim chalayandalayannarinmunijanananugrihya cacara
    yah | kurupuram ca halena vikarshayanyaduvarah sa gatirmama sarvatha || 18|| vrajapashungirirajamathoddharan
    vrajapagopajanam ca jugopa yah | drupadarajasutam kurukashmaladbhavatu taccaranabjaratishca nah ||
    19|| vishamahagnimahastravipadganatsakalapandusutah parirakshitah | yaduvarena parena ca yena vai
    bhavatu taccaranah sharanam ca nah || 20|| malam barhimanojnakuntalabharam vanyaprasunoshitam shaileyaguruklriptacitratilakam
    shashvanmanoharinim | lilavenuravamritaikarasikam lavanyalakshmimayim balam balatamalanilavapusham
    vandamahe devatam || 21|| garga uvaca
  devanagari: गोप्य ऊचुः अधरबिम्बविडम्बितविद्रुमं मधुरवेणुनिनादविनोदितम् । कमलकोमलनीलमुखाम्बुजं तमपि गोपकुमारमुपास्महे
    ॥ १॥ श्यामलं विपिनकेलिलम्पटं कोमलं कमलपत्रलोचनम् । कामदं व्रजविलासिनीदृशां शीतलं मतिहरं भजामहे ॥ २॥
    तं विसञ्चलितलोचनाञ्चलं सामिकुड्मलितकोमलाधरम् । वंशवल्गितकराङ्गुलीमुखं वेणुनादरसिकं भजामहे ॥ ३॥ ईषदङ्कुरितदन्तकुण्डलं
    भूषणं भुवनमङ्गलश्रियम् । घोषसौरभमनोहरं हरेर्वेषमेव मृगयामहे वयम् ॥ ४॥ अस्तु नित्यमरविन्दलोचनः श्रेयसे
    हि तु सुरार्चिताकृतिः । यस्य पादसरसीरुहामृतं सेव्यमानमनिशं मुनीश्वरैः ॥ ५॥ गोपकै रचितमल्लसङ्गरं सङ्गरे
    जितविदग्धयौवनम् । चिन्तयामि मनसा सदैव तं दैवतं निखिलयोगिनामपि ॥ ६॥ उल्लसन्नवपयोदमेव तं फुल्लतामरसलोचनाञ्चलम्
    । बल्लवीहृदयपश्यतोहरं पल्लवाधरमुपास्महे वयम् ॥ ७॥ यद्धनञ्जयरथस्य मण्डनं खण्डनं तदपि सञ्चितैनसाम् ।
    जीवनं श्रुतिगिरां सदामलं श्यामलं मनसि मेऽस्तु तन्महः ॥ ८॥ गोपिकास्तनविलोललोचनप्रान्तलोचनपरम्परावृतम्
    । बालकेलिरसलालसं भ्रमं माधवं तमनिशं विभावये ॥ ९॥ नीलकण्ठकृतपिच्छशेखरं नीलमेघतुलिताङ्गवैभवम् । नीलपङ्कजपलाशलोचनं
    नीलकुन्तलधरं भजामहे ॥ १०॥ घोषयोषिदनुगीतवैभवं कोमलस्वरितवेणुनिःस्वनम् । सारभूतमभिरामसम्पदां धाम तामरसलोचनं
    भजे ॥ ११॥ मोहनं मनसि शार्ङ्गिणं परं निर्गतं किल विहाय मानिनीः । नारदादिमुनिभिश्च सेवितं नन्दगोपतनयं
    भजामहे ॥ १२॥ श्रीहरिस्तु रमणीभिरावृतो यस्तु वै जयति रासमण्डले । राधया सह वने च दुःखितास्तं प्रियं
    हि मृगयामहे वयम् ॥ १३॥ देवदेव व्रजराजनन्दन देहि दर्शनमलं च नो हरे । सर्वदुःखहरणं च पूर्ववत्सन्निरीक्ष्य
    तव शुल्कदासिकाः ॥ १४॥ क्षितितलोद्धरणाय दधार यः सकलयज्ञवराहवपुः परम् । दितिसुतं विददार च दंष्ट्रया
    स तु सदोद्धरणाय क्षमोऽस्तु नः ॥ १५॥ मनुमताद्रुचिजो दिविजैः सह वसु दुदोह धरामपि यः पृथुः । श्रुतिमपाद्धृतमत्स्यवपुः
    परं स शरणं किल नोऽस्त्वशुभक्षणे ॥ १६॥ अवहदब्धिमहो गिरिमूर्जितं कमठरूपधरः परमस्तु यः । असुहरं नृहरिस्तमदण्डयत्स
    च हरिः परमं शरणं च नः ॥ १७॥ नृपबलिं छलयन्दलयन्नरीन्मुनिजनाननुगृह्य चचार यः । कुरुपुरं च हलेन विकर्षयन्यदुवरः
    स गतिर्मम सर्वथा ॥ १८॥ व्रजपशून्गिरिराजमथोद्धरन् व्रजपगोपजनं च जुगोप यः । द्रुपदराजसुतां कुरुकश्मलाद्भवतु
    तच्चरणाब्जरतिश्च नः ॥ १९॥ विषमहाग्निमहास्त्रविपद्गणात्सकलपाण्डुसुताः परिरक्षिताः । यदुवरेण परेण च
    येन वै भवतु तच्चरणः शरणं च नः ॥ २०॥ मालां बर्हिमनोज्ञकुन्तलभरां वन्यप्रसूनोषितां शैलेयागुरुक्लृप्तचित्रतिलकां
    शश्वन्मनोहारिणीम् । लीलावेणुरवामृतैकरसिकां लावण्यलक्ष्मीमयीं बालां बालतमालनीलवपुषं वन्दामहे देवताम्
    ॥ २१॥ गर्ग उवाच
