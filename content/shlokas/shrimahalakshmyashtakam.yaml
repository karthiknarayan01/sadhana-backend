id: shrimahalakshmyashtakam
category: stotram
name:
  english: shrimahalakshmyashtakam
  devanagari: श्रीमहालक्ष्म्यष्टकम्
content:
  english: khahare devi mahalakshmi namo'stute ||3|| siddhibuddhiprade devi bhuktimuktipradayini | mamtramurte
    sada devi mahalakshmi namo'stute ||4|| adyamtarahite devi adyashakti maheshvari | yogaje yogasambhute
    mahalakshmi namo'stute ||5|| shula sukshmamaharaudre mahashakti mahodare | mahapapahare devi mahalakshmi
    namo'stute ||6|| padmasanasthite devi parabrahmasvarupini | parameshi jaganmatarmahalakshmi namo'stute
    ||7|| shvetambaradhare devi nanalamkara bhushite | jagatsthite jaganmatarmahalakshmi namo'stute ||8||
    mahalakshmyashtakam stotram ya
  devanagari: खहरे देवी महालक्ष्मि नमोऽस्तुते ॥३॥ सिद्धिबुद्धिप्रदे देवी भुक्तिमुक्तिप्रदायिनि । मंत्रमूर्ते
    सदा देवी महालक्ष्मि नमोऽस्तुते ॥४॥ आद्यंतरहिते देवी आद्यशक्ति महेश्वरि । योगजे योगसंभूते महालक्ष्मि
    नमोऽस्तुते ॥५॥ शूल सूक्ष्ममहारौद्रे महाशक्ति महोदरे । महापापहरे देवी महालक्ष्मि नमोऽस्तुते ॥६॥ पद्मासनस्थिते
    देवी परब्रह्मस्वरुपिणि । परमेशि जगन्मातार्महालक्ष्मि नमोऽस्तुते ॥७॥ श्वेतांबरधरे देवी नानालंकार भूषिते
    । जगत्स्थिते जगन्मातार्महालक्ष्मि नमोऽस्तुते ॥८॥ महालक्ष्म्यष्टकं स्तोत्रं य
