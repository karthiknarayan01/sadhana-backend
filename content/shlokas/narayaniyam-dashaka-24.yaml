id: narayaniyam-dashaka-24
category: stotram
name:
  english: Narayaniyam Dashaka 24
content:
  english: hiranyakshe potripravaravapusha deva bhavata hate shokakrodhaglapitadhritiretasya sahajah |
    hiranyaprarambhah kashipuramararatisadasi pratijnamatene tava kila vadhartham madhuripo || || vidhataram
    ghoram sa khalu tapasitva naciratah purah sakshatkurvan suranaramrigadyairanidhanam | varam labdhva
    dripto jagadiha bhavannayakamidam parikshundannindradaharata divam tvamaganayan || || nihantum tvam
    bhuyastava padamavaptasya ca ripo rbahirdrishterantardadhitha hridaye sukshmavapusha | nadannuccaistatrapyakhilabhuvanante
    ca mrigayan bhiya yatam matva sa khalu jitakashi nivavrite || || tato'sya prahladah samajani suto
    garbhavasatau munervinapaneradhigatabhavadbhaktimahima | sa vai jatya daityah shishurapi sametya tvayi
    ratim gatastvadbhaktanam varada paramodaharanatam || || surarinam hasyam tava caranadasyam nijasute
    sa drishtva dushtatma gurubhirashishikshacciramamum | guruproktam casavidamidamabhadraya dridhami
    tyapakurvan sarvam tava caranabhaktyaiva vavridhe || || adhiteshu shreshtham kimiti pariprishte'tha
    tanaye bhavadbhaktim varyamabhigadati paryakuladhritih | gurubhyo roshitva sahajamatirasyetyabhividan
    vadhopayanasmin vyatanuta bhavatpadasharane || || sa shulairaviddhah subahu mathito diggajaganai rmahasarpairdashto'pyanashanagaraharavidhutah
    | girindravakshipto'pyahaha paramatmannayi vibho tvayi nyastatmatvat kimapi na nipidamabhajata ||
    || tatah shankavishtah sa punaratidushto'sya janako guruktya tadgehe kila varunapashaistamarunat |
    guroshcasannidhye sa punaranugan daityatanayan bhavadbhaktestattvam paramamapi vijnanamashishat ||
    || pita shrinvan balaprakaramakhilam tvatstutiparam rushandhah prahainam kulahataka kaste balamiti
    | balam me vaikunthastava ca jagatam capi sa balam sa eva trailokyam sakalamiti dhiro'yamagadit ||
    || are kvasau kvasau sakalajagadatma haririti prabhinte sma stambham calitakaravalo ditisutah | atah
    pashcadvishno na hi vaditumisho'smi sahasa kripatman vishvatman pavanapuravasin mridaya mam ||
  devanagari: हिरण्याक्षे पोत्रिप्रवरवपुषा देव भवता हते शोकक्रोधग्लपितधृतिरेतस्य सहजः । हिरण्यप्रारम्भः
    कशिपुरमरारातिसदसि प्रतिज्ञमातेने तव किल वधार्थं मधुरिपो ॥ ॥ विधातारं घोरं स खलु तपसित्वा नचिरतः पुरः
    साक्षात्कुर्वन् सुरनरमृगाद्यैरनिधनम् । वरं लब्ध्वा दृप्तो जगदिह भवन्नायकमिदं परिक्षुन्दन्निन्द्रादहरत
    दिवं त्वामगणयन् ॥ ॥ निहन्तुं त्वां भूयस्तव पदमवाप्तस्य च रिपो र्बहिर्दृष्टेरन्तर्दधिथ हृदये सूक्ष्मवपुषा
    । नदन्नुच्चैस्तत्राप्यखिलभुवनान्ते च मृगयन् भिया यातं मत्वा स खलु जितकाशी निववृते ॥ ॥ ततोऽस्य प्रह्लादः
    समजनि सुतो गर्भवसतौ मुनेर्वीणापाणेरधिगतभवद्भक्तिमहिमा । स वै जात्या दैत्यः शिशुरपि समेत्य त्वयि रतिं
    गतस्त्वद्भक्तानां वरद परमोदाहरणताम् ॥ ॥ सुरारीणां हास्यं तव चरणदास्यं निजसुते स दृष्ट्वा दुष्टात्मा
    गुरुभिरशिशिक्षच्चिरममुम् । गुरुप्रोक्तं चासाविदमिदमभद्राय दृढमि त्यपाकुर्वन् सर्वं तव चरणभक्त्यैव
    ववृधे ॥ ॥ अधीतेषु श्रेष्ठं किमिति परिपृष्टेऽथ तनये भवद्भक्तिं वर्यामभिगदति पर्याकुलधृतिः । गुरुभ्यो
    रोषित्वा सहजमतिरस्येत्यभिविदन् वधोपायानस्मिन् व्यतनुत भवत्पादशरणे ॥ ॥ स शूलैराविद्धः सुबहु मथितो दिग्गजगणै
    र्महासर्पैर्दष्टोऽप्यनशनगराहारविधुतः । गिरीन्द्रवक्षिप्तोऽप्यहह परमात्मन्नयि विभो त्वयि न्यस्तात्मत्वात्
    किमपि न निपीडामभजत ॥ ॥ ततः शङ्काविष्टः स पुनरतिदुष्टोऽस्य जनको गुरूक्त्या तद्गेहे किल वरुणपाशैस्तमरुणत्
    । गुरोश्चासान्निध्ये स पुनरनुगान् दैत्यतनयान् भवद्भक्तेस्तत्त्वं परममपि विज्ञानमशिषत् ॥ ॥ पिता शृण्वन्
    बालप्रकरमखिलं त्वत्स्तुतिपरं रुषान्धः प्राहैनं कुलहतक कस्ते बलमिति । बलं मे वैकुण्ठस्तव च जगतां चापि
    स बलं स एव त्रैलोक्यं सकलमिति धीरोऽयमगदीत् ॥ ॥ अरे क्वासौ क्वासौ सकलजगदात्मा हरिरिति प्रभिन्ते स्म
    स्तम्भं चलितकरवालो दितिसुतः । अतः पश्चाद्विष्णो न हि वदितुमीशोऽस्मि सहसा कृपात्मन् विश्वात्मन् पवनपुरवासिन्
    मृडय माम् ॥
