id: r-07
category: veda
name:
  english: r 07
  devanagari: र् ०७
content:
  english: 03 yah pra̱vato̭ ni̱vata̭ u̱dvata̭ uda̱nvati̭ranuda̱kashca̱ yah | ta a̱smabhya̱m paya̭sa̱ pinva̭manah
    shi̱va de̱vira̭shipa̱da bha̭vantu̱ sarva̭ na̱dyo̭ ashimi̱da bha̭vantu || 7
  devanagari: ०३ याः प्र॒वतो॑ नि॒वत॑ उ॒द्वत॑ उद॒न्वती॑रनुद॒काश्च॒ याः । ता अ॒स्मभ्यं॒ पय॑सा॒ पिन्व॑मानाः
    शि॒वा दे॒वीर॑शिप॒दा भ॑वन्तु॒ सर्वा॑ न॒द्यो॑ अशिमि॒दा भ॑वन्तु ॥ ७
meaning: {}
