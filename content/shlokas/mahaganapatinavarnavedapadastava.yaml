id: mahaganapatinavarnavedapadastava
category: stotram
name:
  english: mahaganapatinavarnavedapadastava
  devanagari: महागणपतिनवार्णवेदपादस्तव
content:
  english: dhyayine tubhyam senanibhyashca vo namah || 6|| ye bhajantyaksharam tvam te prapnuvantyaksharatmatam|
    naikarupaya mahate mushnatam pataye namah || 7|| nagaja
  devanagari: ध्यायिने तुभ्यं सेनानिभ्यश्च वो नमः ॥ ६॥ ये भजन्त्यक्षरं त्वां ते प्राप्नुवन्त्यक्षरात्मताम्।
    नैकरूपाय महते मुष्णतां पतये नमः ॥ ७॥ नगजा
meaning: {}
