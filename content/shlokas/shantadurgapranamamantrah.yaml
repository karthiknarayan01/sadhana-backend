id: shantadurgapranamamantrah
category: mantra
name:
  english: shantadurgapranamamantrah
  devanagari: शान्तादुर्गाप्रणाममन्त्रः
content:
  english: rupini | palanartham svabhaktanam shantadurgabhidhamata || 1|| namo durge mahadurge navadurgasvarupini
    | kaivalyavasini shrimacchantadurge namo'stu te || 2|| shantyai namo'stu sharanagatarakshanayai kantyai
    namo'stu kamaniyagunashrayayai | kshatyai namo'stu duritakshayakaranayai dhantyai namo'stu dhanadhanyasamriddhidayai
    || 3|| shantadurge namastubhyam sarvakamarthasadhike | mama siddhimasiddhim va svapne sarvam pradarshaya
    || 4|| shantadurge jaganmate sharanagatavatsale | kaivalyavasini devi shantadurge namo'stu te || 5||
    iti shrishantadurga pranamamantrah sampurnah |
  devanagari: रूपिणी । पालनार्थं स्वभक्तानां शान्तादुर्गाभिधामता ॥ १॥ नमो दुर्गे महादुर्गे नवदुर्गास्वरूपिणी
    । कैवल्यवासिनी श्रीमच्छान्तादुर्गे नमोऽस्तु ते ॥ २॥ शान्त्यै नमोऽस्तु शरणागतरक्षणायै कान्त्यै नमोऽस्तु
    कमनीयगुणाश्रयायै । क्षात्यै नमोऽस्तु दुरितक्षयकारणायै धान्त्यै नमोऽस्तु धनधान्यसमृद्धिदायै ॥ ३॥ शान्तादुर्गे
    नमस्तुभ्यं सर्वकामार्थसाधिके । मम सिद्धिमसिद्धिं वा स्वप्ने सर्वं प्रदर्शय ॥ ४॥ शान्तादुर्गे जगन्माते
    शरणागतवत्सले । कैवल्यवासिनी देवि शान्तादुर्गे नमोऽस्तु ते ॥ ५॥ इति श्रीशान्तादुर्गा प्रणाममन्त्रः
    सम्पूर्णः ।
