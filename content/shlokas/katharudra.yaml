id: katharudra
category: upanishad
name:
  english: katharudra
  devanagari: कथरुद्र
content:
  english: tato vijnana atma tu tato'nyashcantarah svatah || 18|| anandamaya atma tu tato'nyashcantarasthitah
    | yo'yamannamayah so'yam purnah pranamayena tu || 19|| manomayena prano'pi tatha purnah svabhavatah
    | tatha manomayo hyatma purno jnanamayena tu || 20|| anandena sada purnah sada jnanamayah sukham |
    tathanandamayashcapi brahmano'nyena sakshina || 21|| sarvantarena purnashca brahma nanyena kenacit
    | yadidam brahmapucchakhyam satyajnanadvayatmakam || 22|| sarameva rasam labdhva sakshaddehi sanatanam
    | sukhi bhavati sarvatra anyatha sukhata kutah || 23|| asatyasminparanande svatmabhute'khilatmanam
    | ko jivati naro jantuh ko va nityam viceshtate || 24|| tasmatsarvatmana citte bhasamano hyasau narah
    | anandayati duhkhadhyam jivatmanam sada janah || 25|| yada hyevaisha etasminnadrishyatvadilakshane
    | nirbhedam paramadvaitam vindate ca mahayatih || 26|| tadevabhayamatyantakalyanam paramamritam |
    sadrupam paramam brahma triparicchedavarjitam || 27|| yada hyevaisha etasminnalpamapyantaram narah
    | vijanati tada tasya bhayam syannatra samshayah || 28|| asyaivanandakoshena stambanta vishnupurvakah
    | bhavanti sukhino nityam taratamyakramena tu || 29|| tattatpadaviraktasya shrotriyasya prasadinah
    | svarupabhuta anandah svayam bhati pare yatha || 30|| nimittam kincidashritya khalu shabdah pravartate
    | yato vaco nivartante nimittanamabhavatah || 31|| nirvisheshe paranande katham shabdah pravartate
    |
  devanagari: ततो विज्ञान आत्मा तु ततोऽन्यश्चान्तरः स्वतः ॥ १८॥ आनन्दमय आत्मा तु ततोऽन्यश्चान्तरस्थितः
    । योऽयमन्नमयः सोऽयं पूर्णः प्राणमयेन तु ॥ १९॥ मनोमयेन प्राणोऽपि तथा पूर्णः स्वभावतः । तथा मनोमयो ह्यात्मा
    पूर्णो ज्ञानमयेन तु ॥ २०॥ आनन्देन सदा पूर्णः सदा ज्ञानमयः सुखम् । तथानन्दमयश्चापि ब्रह्मणोऽन्येन साक्षिणा
    ॥ २१॥ सर्वान्तरेण पूर्णश्च ब्रह्म नान्येन केनचित् । यदिदं ब्रह्मपुच्छाख्यं सत्यज्ञानद्वयात्मकम् ॥
    २२॥ सारमेव रसं लब्ध्वा साक्षाद्देही सनातनम् । सुखी भवति सर्वत्र अन्यथा सुखता कुतः ॥ २३॥ असत्यस्मिन्परानन्दे
    स्वात्मभूतेऽखिलात्मनाम् । को जीवति नरो जन्तुः को वा नित्यं विचेष्टते ॥ २४॥ तस्मात्सर्वात्मना चित्ते
    भासमानो ह्यसौ नरः । आनन्दयति दुःखाढ्यं जीवात्मानं सदा जनः ॥ २५॥ यदा ह्येवैष एतस्मिन्नदृश्यत्वादिलक्षणे
    । निर्भेदं परमाद्वैतं विन्दते च महायतिः ॥ २६॥ तदेवाभयमत्यन्तकल्याणं परमामृतम् । सद्रूपं परमं ब्रह्म
    त्रिपरिच्छेदवर्जितम् ॥ २७॥ यदा ह्येवैष एतस्मिन्नल्पमप्यन्तरं नरः । विजानाति तदा तस्य भयं स्यान्नात्र
    संशयः ॥ २८॥ अस्यैवानन्दकोशेन स्तम्बान्ता विष्णुपूर्वकाः । भवन्ति सुखिनो नित्यं तारतम्यक्रमेण तु ॥
    २९॥ तत्तत्पदविरक्तस्य श्रोत्रियस्य प्रसादिनः । स्वरूपभूत आनन्दः स्वयं भाति परे यथा ॥ ३०॥ निमित्तं
    किञ्चिदाश्रित्य खलु शब्दः प्रवर्तते । यतो वाचो निवर्तन्ते निमित्तानामभवतः ॥ ३१॥ निर्विशेषे परानन्दे
    कथं शब्दः प्रवर्तते ।
