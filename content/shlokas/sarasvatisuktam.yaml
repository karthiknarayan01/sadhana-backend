id: sarasvatisuktam
category: sukta
name:
  english: sarasvatisuktam
  devanagari: सरस्वतीसूक्तम्
content:
  english: 14 prakshodasa dhayasa sasra esha sarasvati dharunamayasi puh | prababadhana rathyeva yati
    vishvaapo mahina sindhuranyah || 1|| ekacetat sarasvati nadinam shuciryati giribhya a samudrat | rayashcetanti
    bhuvanasya bhurerghritam payo duduhe nahushaya || 2|| sa vavridhe naryo yoshanasu vrisha shishurvrishabho
    yajniyasu | sa vajinam maghavadbhyo dadhati vi sataye tanvam mamrijita || 3|| uta sya nah sarasvati
    jushanopa shravatsubhaga yajne asmin | mitajnubhirnamasyairiyana raya yuja ciduttara sakhibhyah ||
    4|| ima juhvana yupmada namobhih prati stomam sarasvati jushasva | tava sharman priyatame dadhana
    upa stheyama sharanam na vriksham || 5|| apamu te sarasvati vasishtho dvaravritasya subhage vyavah
    | vardha shubhre stuvate rasi vajan yuyam pata svastibhih sadanah || 6|| brihadu gayishe vaco'surya
    nadinam | sarasvatiminmahaya suvriktibhih stomairvasishtha rodasi || 7|| ubhe yatte mahina shubhre
    andhasi adhikshiyanti puravah | sa no bodhyavitri marutsakha coda radho maghonam || 8|| bhadramid
    bhadra krinavat sarasvatyakavari cetati vajinivati | grinana jamadagnivat stuvana ca vasishthavat
    || 9|| janiyanto nvagravah putriyantah sudanavah | sarasvantam havamahe || 10|| ye te sarasva urmayo
    madhumanto ghritashcutah | tebhirno'vita bhava || 11|| pipivamsam sarasvatah stanam yo vishvadarshatah
    | bhakshimahi prajamisham || 12|| ambitame naditame devitame sarasvati | aprashasta iva smasi prashastimamba
    naskridhi || 13|| tve vishva sarasvati citayumshi devyam | shunahotreshu matsva prajam devi dididdhi
    nah || 14|| ima brahma sarasvati jushasva vajinivati | ya te manma gritsamada ritavari priya deveshu
    juhvati || 15|| pavaka nah sarasvati bajebhirvajinivati | yajna vashtu dhiyavasuh || 16|| codayitri
    sunritanam cetanti sumatinam | yajnam dadhe sarasvati || 17|| maho arnah sarasvati pra cetayati ketuna
    | dhiyo vishva vi rijati || 18|| sarasvatim daivyanto havante sarasvatimadhvare tayamane | sarasvatim
    sukrito ahvayanta sarasvati dashushe varyamdat || 19|| sarasvati ya saratham yayatha svadhabhirdevi
    pitribhirmadanti | asadyasmin barhishi madayasvanamiva isha a dhehyasme || 20|| sarasvatim yam pitaro
    havante dakshina yajnamabhinakshamanah | sahasrarghamiḻo atra bhagam rayasposham yajamaneshu dhehi
    || 21|| a no divo brihatah parvatada sarasvati yajata gantu yajnam | havam devi jujushana ghritaci
    shagmam no vacamushati sha
  devanagari: १४ प्रक्षोदसा धायसा सस्र एषा सरस्वती धरुणमायसी पूः । प्रबाबधाना रथ्येव याति विश्वाअपो महिना
    सिन्धुरन्याः ॥ १॥ एकाचेतत् सरस्वती नदीनां शुचिर्यती गिरिभ्य आ समुद्रात् । रायश्चेतन्ती भुवनस्य भूरेर्घृतं
    पयो दुदुहे नाहुषाय ॥ २॥ स वावृधे नर्यो योषणासु वृषा शिशुर्वृषभो यज्ञियासु । स वाजिनं मघवद्भ्यो दधाति
    वि सातये तन्वं मामृजीत ॥ ३॥ उत स्या नः सरस्वती जुषाणोप श्रवत्सुभगा यज्ञे अस्मिन् । मितज्ञुभिर्नमस्यैरियाना
    राया युजा चिदुत्तरा सखिभ्यः ॥ ४॥ इमा जुह्वाना युप्मदा नमोभिः प्रति स्तोमं सरस्वति जुषस्व । तव शर्मन्
    प्रियतमे दधाना उप स्थेयाम शरणं न वृक्षम् ॥ ५॥ अपमु ते सरस्वति वसिष्ठो द्वारावृतस्य सुभगे व्यावः ।
    वर्ध शुभ्रे स्तुवते रासि वाजान् यूयं पात स्वस्तिभिः सदानः ॥ ६॥ बृहदु गायिषे वचोऽसुर्या नदीनाम् । सरस्वतीमिन्महया
    सुवृक्तिभिः स्तोमैर्वसिष्ठ रोदसी ॥ ७॥ उभे यत्ते महिना शुभ्रे अन्धसी अधिक्षियन्ति पूरवः । सा नो बोध्यवित्री
    मरुत्सखा चोद राधो मघोनाम् ॥ ८॥ भद्रमिद् भद्रा कृणवत् सरस्वत्यकवारी चेतति वाजिनीवती । गृणाना जमदग्निवत्
    स्तुवाना च वसिष्ठवत् ॥ ९॥ जनीयन्तो न्वग्रवः पुत्रीयन्तः सुदानवः । सरस्वन्तं हवामहे ॥ १०॥ ये ते सरस्व
    ऊर्मयो मधुमन्तो घृतश्चुतः । तेभिर्नोऽविता भव ॥ ११॥ पीपिवांसं सरस्वतः स्तनं यो विश्वदर्शतः । भक्षीमहि
    प्रजामिषम् ॥ १२॥ अम्बितमे नदीतमे देवितमे सरस्वति । अप्रशस्ता इव स्मसि प्रशस्तिमम्ब नस्कृधि ॥ १३॥ त्वे
    विश्वा सरस्वति चितायूंषि देव्याम् । शुनहोत्रेषु मत्स्व प्रजां देवि दिदिड्ढि नः ॥ १४॥ इमा ब्रह्म सरस्वति
    जुषस्व वाजिनीवति । या ते मन्म गृत्समदा ऋतावरि प्रिया देवेषु जुह्वति ॥ १५॥ पावका नः सरस्वती बाजेभिर्वाजिनीवती
    । यज्ञ वष्टु धियावसूः ॥ १६॥ चोदायित्री सूनृतानां चेतन्ती सुमतीनाम् । यज्ञं दधे सरस्वती ॥ १७॥ महो अर्णः
    सरस्वती प्र चेतयति केतुना । धियो विश्वा वि रीजति ॥ १८॥ सरस्वतीं दैव्यन्तो हवन्ते सरस्वतीमध्वरे तायमाने
    । सरस्वतीं सुकृतो अह्वयन्त सरस्वती दाशुषे वार्यंदात् ॥ १९॥ सरस्वति या सरथं ययाथ स्वधाभिर्देवि पितृभिर्मदन्ती
    । आसद्यास्मिन् बर्हिषि मादयस्वानमीवा इष आ धेह्यस्मे ॥ २०॥ सरस्वतीं यां पितरो हवन्ते दक्षिणा यज्ञमभिनक्षमाणाः
    । सहस्रार्घमिळो अत्र भागं रायस्पोषं यजमानेषु धेहि ॥ २१॥ आ नो दिवो बृहतः पर्वतादा सरस्वती यजता गन्तु
    यज्ञम् । हवं देवी जुजुषाणा घृताची शग्मां नो वाचमुशती श
