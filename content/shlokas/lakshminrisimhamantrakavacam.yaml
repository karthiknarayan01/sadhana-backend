id: lakshminrisimhamantrakavacam
category: mantra
name:
  english: lakshminrisimhamantrakavacam
  devanagari: लक्ष्मीनृसिंहमन्त्रकवचम्
content:
  english: chatribhutaphanindramindudhavalam lakshminrisimham bhaje || 1|| om kshraum praum hraum raum
    braum jraum namo nrisimhaya | iti mulamantrah | om namo nrisimhasimhaya sarvadushtavinashanaya sarvajanamohanaya
    sarvarajyavashyam kuru kuru svaha || om namo nrisimhasimhaya simharajaya narakeshaya namo namaste
    | om namah kalaya kaladamshtraya karalavadanaya ugraya ugraviraya ugravikataya ugravajraya vajradehine
    rudraya rudraghoraya bhadraya bhadrakarine om jrim hrim nrisimhaya namah svaha | om nrisimhaya kapilaya
    kapilajataya amoghavacaya satyam satyam vratam mahogra pracandarupaya om hram hram hrim hrim hrum
    hrum hraum hraum kshram kshram kshrim kshrim kshraum kshraum phat svaha | om nrisimhaya sarvajne mama
    sarvarogan bandha bandha sarvagrahan bandha bandha sarvadoshadinam bandha bandha sarvacoranam bandha
    bandha sarvavyaghranam bandha bandha bandha sarvapannaganam bandha || sarvavrishcikadinam bandha bandha
    sarva bhutapretapishacashakinidakini yantra mantradin bandha bandha parayantra paratantra bandha bandha
    kilaya kilaya mardaya mardaya curnaya curnaya evam mama virodhinam sarvan sarvato haranam om aim aim
    ehi ehi etam madvirodhatam sarvato hara hara daha daha matha matha paca paca curnaya curnaya cakrena
    gadaya vajrena bhasmi kuru kuru svaha || om kshraum praum hraum raum braum jraum jrim hrim nrisimhaya
    namah | om klim shrim hrim hrim kshrim kshrim kshraum nrisimhaya namah | om am hrim kshraum kraum
    hrum phat | om namo bhagavate sudarshananrisimhaya mama vijayarupe karye jvala jvala prajjvala prajjvala
    asadhyamenakarya shighram sadhaya sadhaya enam sarvapratibandhakebhyah sarvato raksha raksha hum phat
    svaha | abhyamabhayatmani bhuyishthah om kshaum | om namo bhagavate tubhyam purushaya mahatmane haryadbhutasimhaya
    brahmane paramatmane | om ugram ugram mahavishnum sakaladharam sarvatomukham | nrisimha bhishanam
    bhadram mrityumrityum namamyaham | iti nrisimhamantrarajatmakam sampurnamastu | shrilakshminrisimharpanamastu
    |
  devanagari: छत्रीभूतफणीन्द्रमिन्दुधवलं लक्ष्मीनृसिंहं भजे ॥ १॥ ॐ क्ष्रौं प्रौं ह्रौं रौं ब्रौं ज्रौं
    नमो नृसिंहाय । इति मूलमन्त्रः । ॐ नमो नृसिंहसिंहाय सर्वदुष्टविनाशनाय सर्वजनमोहनाय सर्वराज्यवश्यं कुरु
    कुरु स्वाहा ॥ ॐ नमो नृसिंहसिंहाय सिंहराजाय नरकेशाय नमो नमस्ते । ॐ नमः कालाय कालदंष्ट्राय करालवदनाय
    उग्राय उग्रवीराय उग्रविकटाय उग्रवज्राय वज्रदेहिने रुद्राय रुद्रघोराय भद्राय भद्रकारिणे ॐ ज्रीं ह्रीं
    नृसिंहाय नमः स्वाहा । ॐ नृसिंहाय कपिलाय कपिलजटाय अमोघवाचाय सत्यं सत्यं व्रतं महोग्र प्रचण्डरूपाय ॐ
    ह्रां ह्रां ह्रीं ह्रीं ह्रूं ह्रूं ह्रौं ह्रौं क्ष्रां क्ष्रां क्ष्रीं क्ष्रीं क्ष्रौं क्ष्रौं फट्
    स्वाहा । ॐ नृसिंहाय सर्वज्ञे मम सर्वरोगान् बन्ध बन्ध सर्वग्रहान् बन्ध बन्ध सर्वदोषादीनां बन्ध बन्ध
    सर्वचोराणां बन्ध बन्ध सर्वव्याघ्राणां बन्ध बन्ध बन्ध सर्वपन्नगानां बन्ध ॥ सर्ववृश्चिकादिनां बन्ध बन्ध
    सर्व भूतप्रेतपिशाचशाकिनिडाकिनि यन्त्र मन्त्रादिन् बन्ध बन्ध परयन्त्र परतन्त्र बन्ध बन्ध कीलय कीलय
    मर्दय मर्दय चूर्णय चूर्णय एवं मम विरोधीनां सर्वान् सर्वतो हरणं ॐ ऐं ऐं एहि एहि एतां मद्विरोधतां सर्वतो
    हर हर दह दह मथ मथ पच पच चूर्णय चूर्णय चक्रेण गदया वज्रेण भस्मी कुरु कुरु स्वाहा ॥ ॐ क्ष्रौं प्रौं
    ह्रौं रौं ब्रौं ज्रौं ज्रीं ह्रीं नृसिंहाय नमः । ॐ क्लीं श्रीं ह्रीं ह्रीं क्ष्रीं क्ष्रीं क्ष्रौं
    नृसिंहाय नमः । ॐ आं ह्रीं क्ष्रौं क्रौं ह्रुं फट् । ॐ नमो भगवते सुदर्शननृसिंहाय मम विजयरूपे कार्ये
    ज्वल ज्वल प्रज्ज्वल प्रज्ज्वल असाध्यमेनकार्य शीघ्रं साधय साधय एनं सर्वप्रतिबन्धकेभ्यः सर्वतो रक्ष
    रक्ष हुं फट् स्वाहा । अभ्यमभयात्मनि भूयिष्ठाः ॐ क्षौं । ॐ नमो भगवते तुभ्यं पुरुषाय महात्मने हर्यद्भुतसिंहाय
    ब्रह्मणे परमात्मने । ॐ उग्रं उग्रं महाविष्णुं सकलाधारं सर्वतोमुखं । नृसिंह भीषणं भद्रं मृत्युमृत्युं
    नमाम्यहम् । इति नृसिंहमन्त्रराजात्मकं सम्पूर्णमस्तु । श्रीलक्ष्मीनृसिंहार्पणमस्तु ।
