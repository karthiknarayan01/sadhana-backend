id: namavali-61
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om karyaya namah | om vishvaya namah | om vishnave namah | om brahmarupine namah | om hiranyabahave
    namah | om sakshaddhiranyapataye namah | om sharvaya namah | om sharvarupaya namah | om purushaya
    namah | om rudraya namah | 10 || om nilarudraya namah | om kadrudraya namah | om pracetase namah |
    om kalaya namah | om kalarupaya namah | om kalangaharine namah | om midhushtamaya namah | om devaya
    namah | om shipivishtaya namah | om shambhave namah | 20 || om dhatave namah | om manyave namah |
    om rudramurtaye namah | om kapardine namah | om nilakanthaya namah | om shrikanthaya namah | om maheshaya
    namah | om balaya namah | om trishulahastaya namah | om ugraya namah | 30 || om bhimaya namah | om
    mrigendraya namah | om bhimarupaya namah | om bandhave namah | om bhasmadigdhashariraya namah | om
    dindimundishvaraya namah | om hrasvaya namah | om dirghaya namah | om vamanaya namah | om urumedhase
    namah | 40 || om agrevadhaya namah | om devaya namah | om durevadhaya namah | om dhanvine namah |
    om shuline namah | om gadine namah | om haline namah | om cakrine namah | om carmine namah | om daityadanavabhedine
    namah | 50 || om sadyaya namah | om hridyarupaya namah | om parnashadyaya namah | om sadyojataya namah
    | om vamaya namah | om aghoraya namah | om purushaya namah | om pareshaya namah | om purusharthapradaya
    namah | om gahvareshthaya namah | 60 || om shishtaya namah | om vishishtaya namah | om parameshthine
    namah| om virupaya namah | om vishvarupaya namah | om mahagrasaya namah | om dharaya namah | om trishuklaya
    namah | om suvaidyute namah | om ishanaya namah | 70 || om ishvaraya namah | om suraya namah | om
    brahmanyaya namah | om brahmanyeshaya namah | om brahmane namah | om brahmarupaya namah | om brahmanyarcyapadaya
    namah | om vishvadhikaya namah | om sukshmaya namah | om padmamaladharaya namah | 80 || om shvetaya
    namah | om harikeshaya namah | om nilagrivaya namah | om hetave namah | om nishangavaraprishthaya
    namah | om sharahetidharaya namah | om mahadamshtrakaralaya namah | om shmashrave namah | om jatilaya
    namah | om tanaya namah | 90 || om layamadhyaya namah | om mahadamaruvadine namah | om garudadhvajapujyaya
    namah | om ijyadhyakshaya namah | om bhavine namah | om vishnuraktaprapanaya namah | || iti shivarahasyavyutpannam
    maghamasakrite shivashatashtanamavalih sampurna ||
