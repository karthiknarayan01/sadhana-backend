id: pitamahakritamshrikrishnastotram
category: stotram
name:
  english: pitamahakritamshrikrishnastotram
  devanagari: पितामहकृतंश्रीकृष्णस्तोत्रम्
content:
  english: pitamahakritam shrikrishnastotram pitamaha uvaca | nihatya danavapatinmahavarshma mahabalah
    | esha devo mahayogi bhutatma bhutabhavanah || 29|| sarvabhuteshvaro yogi yoniratma tathatmanah |
    sthiribhavata krishno'yam sarvapapapranashanah || 30|| kritva karmatisadhvetadashakyamamitaprabhah
    | samayatah svamatmanam mahabhago mahadyutih | padmanabho mahayogi bhutatma bhutabhavanah || 31||
    na santapo na bhih karya shoko va surasattamah | vidhiresha prabhavashca kalah sankshayakarakah |
    lokandharayatanena nado mukto mahatmana || 32|| sa eva hi mahabhagah sarvalokanamaskritah | acyutah
    pundarikakshah sarvabhutasamudbhavah || 33|| iti mahabharate shantiparvani 202 adhyayantargatam pitamahakritam
    shrikrishnastotram sampurnam | mahabharata | shantiparva | adhyaya 202
  devanagari: पितामहकृतं श्रीकृष्णस्तोत्रम् पितामह उवाच । निहत्य दानवपतीन्महावर्ष्मा महाबलः । एष देवो
    महायोगी भूतात्मा भूतभावनः ॥ २९॥ सर्वभूतेश्वरो योगी योनिरात्मा तथात्मनः । स्थिरीभवत कृष्णोऽयं सर्वपापप्रणाशनः
    ॥ ३०॥ कृत्वा कर्मातिसाध्वेतदशक्यममितप्रभः । समायातः स्वमात्मानं महाभागो महाद्युतिः । पद्मनाभो महायोगी
    भूतात्मा भूतभावनः ॥ ३१॥ न सन्तापो न भीः कार्या शोको वा सुरसत्तमाः । विधिरेष प्रभावश्च कालः सङ्क्षयकारकः
    । लोकान्धारयतानेन नादो मुक्तो महात्मना ॥ ३२॥ स एव हि महाभागः सर्वलोकनमस्कृतः । अच्युतः पुण्डरीकाक्षः
    सर्वभूतसमुद्भवः ॥ ३३॥ इति महाभारते शान्तिपर्वणि २०२ अध्यायान्तर्गतं पितामहकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम्
    । महाभारत । शान्तिपर्व । अध्याय २०२
