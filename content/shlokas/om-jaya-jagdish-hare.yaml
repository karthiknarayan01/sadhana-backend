id: om-jaya-jagdish-hare
category: stotram
name:
  english: Om Jaya Jagdish Hare
content:
  english: om jaya jagadisha hare svami jaya jagadisha hare bhakta janom ke sankata dukha binase mana
    ka svami dukha binase mana ka sukha sammati ghara ave kashta mite tana ka om jaya jagadisha hare ||
    sharana gahum maim kisaki svami sharana gahum maim kisaki asa karum maim jisaki om jaya jagadisha
    hare || tuma antarayami svami tuma antarayami parabrahma parameshvara tuma saba ke svami om jaya jagadisha
    hare || tuma palanakarta svami tuma palanakarta maim murakha khala kami maim sevaka tuma svami kripa
    karo bhartara om jaya jagadisha hare || svami sabake pranapati tumako maim kumati om jaya jagadisha
    hare || svami tuma mere apane hatha uthavo apani sharana lagavo dvara pada tere om jaya jagadisha
    hare || santana ki seva om jaya jagadisha hare ||
  devanagari: ॐ जय जगदीश हरे स्वामी जय जगदीश हरे भक्त जनों के सङ्कट दुख बिनसे मन का स्वामी दुख बिनसे मन
    का सुख सम्मति घर आवे कष्ट मिटे तन का ॐ जय जगदीश हरे ॥ शरण गहूं मैं किसकी स्वामी शरण गहूं मैं किसकी
    आस करूं मैं जिसकी ॐ जय जगदीश हरे ॥ तुम अन्तरयामी स्वामी तुम अन्तरयामी परब्रह्म परमेश्वर तुम सब के
    स्वामी ॐ जय जगदीश हरे ॥ तुम पालनकर्ता स्वामी तुम पालनकर्ता मैं मूरख खल कामी मैं सेवक तुम स्वामी कृपा
    करो भर्तार ॐ जय जगदीश हरे ॥ स्वामी सबके प्राणपति तुमको मैं कुमति ॐ जय जगदीश हरे ॥ स्वामी तुम मेरे
    अपने हाथ उठावो अपनी शरण लगावो द्वार पडा तेरे ॐ जय जगदीश हरे ॥ सन्तन की सेवा ॐ जय जगदीश हरे ॥
