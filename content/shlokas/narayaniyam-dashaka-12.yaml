id: narayaniyam-dashaka-12
category: stotram
name:
  english: Narayaniyam Dashaka 12
content:
  english: svayambhuvo manuratho janasargashilo drishtva mahimasamaye salile nimagnam | srashtaramapa
    sharanam bhavadanghriseva tushtashayam munijanaih saha satyaloke || || kashtam prajah srijati mayyavanirnimagna
    sthanam sarojabhava kalpaya tat prajanam | ityevamesha kathito manuna svayambhuh rambhoruhaksha tava
    padayugam vyacintit || || ha ha vibho jalamaham nyapibam purasta dadyapi majjati mahi kimaham karomi
    | ittham tvadanghriyugalam sharanam yato'sya nasaputat samabhavah shishukolarupi | || angushthamatravapurutpatitah
    purastat bhoyo'tha kumbhisadrishah samajrimbhathastvam | abhre tathavidhamudikshya bhavantamuccai
    rvismeratam vidhiragat saha sunubhih svaih || || ko'savacintyamahima kitirutthito me nasaputat kimu
    bhavedajitasya maya | ittham vicintayati dhatari shailamatrah sadyo bhavan kila jagarjitha ghoraghoram
    || || tam te ninadamupakarnya janastapahsthah satyasthitashca munayo nunuvurbhavantam | tatstotraharshulamanah
    parinadya bhuya stoyashayam vipulamurtiravatarastvam || || urdhvaprasariparidhumravidhutaroma protkshiptavaladhiravanmukhaghoraghonah
    | turnapradirnajaladah parighurnadakshna stotrin munin shishirayannavateritha tvam || || antarjalam
    tadanusankulanakracakram bhramyattimingilakulam kalushormimalam | avishya bhishanaravena rasatalastha
    nakampayan vasumatimagaveshayastvam || || drishtva'tha daityahatakena rasatalante samveshitam jhatiti
    kutakitirvibho tvam | apatukanaviganayya surarikhetan damshtrankurena vasudhamadadhah salilam || ||
    abhyuddharannatha dharam dashanagralagna mustankurankita ivadhikapivaratma | uddhutaghorasalilajjaladherudancan
    kridavarahavapurishvara pahi rogat ||
  devanagari: स्वायम्भुवो मनुरथो जनसर्गशीलो दृष्ट्वा महीमसमये सलिले निमग्नाम् । स्रष्टारमाप शरणं भवदङ्घ्रिसेवा
    तुष्टाशयं मुनिजनैः सह सत्यलोके ॥ ॥ कष्टं प्रजाः सृजति मय्यवनिर्निमग्ना स्थानं सरोजभव कल्पय तत् प्रजानाम्
    । इत्येवमेष कथितो मनुना स्वयम्भूः रम्भोरुहाक्ष तव पादयुगं व्यचिन्तीत् ॥ ॥ हा हा विभो जलमहं न्यपिबं
    पुरस्ता दद्यापि मज्जति मही किमहं करोमि । इत्थं त्वदङ्घ्रियुगलं शरणं यतोऽस्य नासापुटात् समभवः शिशुकोलरूपी
    । ॥ अङ्गुष्ठमात्रवपुरुत्पतितः पुरस्तात् भोयोऽथ कुम्भिसदृशः समजृम्भथास्त्वम् । अभ्रे तथाविधमुदीक्ष्य
    भवन्तमुच्चै र्विस्मेरतां विधिरगात् सह सूनुभिः स्वैः ॥ ॥ कोऽसावचिन्त्यमहिमा किटिरुत्थितो मे नासापुटात्
    किमु भवेदजितस्य माया । इत्थं विचिन्तयति धातरि शैलमात्रः सद्यो भवन् किल जगर्जिथ घोरघोरम् ॥ ॥ तं ते
    निनादमुपकर्ण्य जनस्तपःस्थाः सत्यस्थिताश्च मुनयो नुनुवुर्भवन्तम् । तत्स्तोत्रहर्षुलमनाः परिणद्य भूय
    स्तोयाशयं विपुलमूर्तिरवातरस्त्वम् ॥ ॥ ऊर्ध्वप्रसारिपरिधूम्रविधूतरोमा प्रोत्क्षिप्तवालधिरवाङ्मुखघोरघोणः
    । तूर्णप्रदीर्णजलदः परिघूर्णदक्ष्णा स्तोतृन् मुनीन् शिशिरयन्नवतेरिथ त्वम् ॥ ॥ अन्तर्जलं तदनुसङ्कुलनक्रचक्रं
    भ्राम्यत्तिमिङ्गिलकुलं कलुषोर्मिमालम् । आविश्य भीषणरवेण रसातलस्था नाकम्पयन् वसुमतीमगवेषयस्त्वम् ॥
    ॥ दृष्ट्वाऽथ दैत्यहतकेन रसातलान्ते संवेशितां झटिति कूटकिटिर्विभो त्वम् । आपातुकानविगणय्य सुरारिखेटान्
    दंष्ट्राङ्कुरेण वसुधामदधाः सलीलम् ॥ ॥ अभ्युद्धरन्नथ धरां दशनाग्रलग्न मुस्ताङ्कुराङ्कित इवाधिकपीवरात्मा
    । उद्धूतघोरसलिलाज्जलधेरुदञ्चन् क्रीडावराहवपुरीश्वर पाहि रोगात् ॥
