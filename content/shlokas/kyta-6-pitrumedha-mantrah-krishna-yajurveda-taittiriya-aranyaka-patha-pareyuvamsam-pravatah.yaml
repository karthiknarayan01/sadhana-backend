    ञ्जा॒तग्ं हि॒मव॑त॒स्परि॑ । तेना॒मृत॑स्य॒ मूले॒नारा॑ती र्जम्भयामसि ॥ यथा॒ त्व थ्स्यो॑षधे पृथि॒व्या
    अधि॑ । ए॒वमि॒म उद्भि॑न्दन्तु की॒र्त्या यश॑सा ब्रह्मवर्च॒सेन॑ ॥ अ॒जो ऽस्यजा॒स्मद॒घा द्वेषाग्ं॑सि य॒वो॑
    ऽसि य॒वया॒स्मद॒घा द्वेषाग्ं॑सि ॥ ज॒म्भ॒या॒म॒सि॒ त्रीणि॑ च श्शोशु॑चद॒घमग्ने॑ शुशु॒द्ध्या र॒यिम् । अप॑
    न॒ श्शोशु॑चद॒घम् ॥ सु॒क्षे॒त्रि॒या सु॑गातु॒या व॑सू॒या च॑ यजामहे । अप॑ न॒ श्शोशु॑चद॒घम् ॥ प्र य म्प्रास्माका॑सश्च
    सू॒रयः॑ । अप॑ न॒ श्शोशु॑चद॒घम् ॥ प्रयद॒ग्ने स्सह॑स्वतो वि॒श्वतो॒ यन्ति॑ सू॒रयः॑ । अप॑ न॒ श्शोशु॑चद॒घम्
    ॥ प्रयत्ते॑ अग्ने सू॒रयो॒ जाये॑महि॒ प्र ते॑ व॒यम् । अप॑ न॒ ॥ त्वग्ं हि वि॑श्वतोमुख वि॒श्वतः॑ परि॒भूरसि॑
    । अप॑ न॒ श्शोशु॑चद॒घम् ॥ द्विषो॑ नो विश्वतोमु॒खाति॑ ना॒वेव॑ पारय । अप॑ न॒ श्शोशु॑चद॒घम् ॥ स न॒ श्शोशु॑चद॒घम्
    ॥ आपः॑ प्रव॒णादि॑व य॒ती थ्स्य॑न्दताम॒घम् । अप॑ न॒ श्शोशु॑चद॒घम् ॥ उ॒द्व॒ना थ्स्य॑न्दताम॒घम् । अप॑
    न॒ श्शोशु॑चद॒घम् ॥ आ॒न॒न्दाय॑ प्रमो॒दाय॒ पुन॒रागा॒ग्॒ स्वान्गृ॒हान् । अप॑ न॒ श्शोशु॑चद॒घम् ॥ न वै
    तत्र॒ प्रमी॑यते॒ गौरश्वः॒ पुरु॑षः प॒शुः । यत्रे॒द म्ब्रह्म॑ क्रि॒यते॑ परि॒धिर्जीव॑नाय॒ कमप॑ न॒ म्प॑रिणी॒यमा॑नाम्
    । अ॒न्धेन॒ या तम॑सा॒ प्रावृ॑ता न्नरि॑ष्ट्यै ॥ मयै॒ता म्भ्रि॒यमा॑णा दे॒वी स॒ती पि॑तृलो॒कम् ँयदैषि॑
    । वि॒श्ववा॑रा॒ नभ॑सा॒ सं व्यँ॑यन्त्यु॒भौ नो॑ लो॒कौ पय॒सा ऽऽवृ॑णीहि ॥ रयि॑ष्ठाम॒ग्नि म्मधु॑मन्तमू॒र्मिण॒मूर्जः॑
    सन्त न्त्वा॒ पय॒सोप॒ सग्ंस॑देम । सग्ं र॒य्या समु॒ वर्च॑सा॒ सच॑स्वा न ॥ ये जी॒वा ये च॑ मृ॒ता ये जा॒ता
    ये च॒ जन्त्याः । तेभ्यो॑ घृ॒तस्य॑ धारयितु॒ म्मधु॑धारा व्युन्द॒ती ॥ मा॒ता रु॒द्राणा न्दुहि॒ता वसू॑ना॒ग्॒
    स्वसा॑ मृत॑स्य॒ नाभिः॑ । प्रणु॒वोच॑ ञ्चिकि॒तुषे॒ जना॑य॒ मा गामना॑गा॒मदि॑तिम् ँवधिष्ट ॥ पिब॑तूद॒क न्भुव॑नस्या॒भ्याव॑
    वृथ्स्वा॒ जो भा॒गो॑ ऽयम् ँवै चतुश्चत्वारिग्ंशत् । य ए॒तस्य॒ त्व त्पञ्च॑ । प्रके॒तुने॒दन्ते॒ नाके॑
    सुप॒र्णम् ँयौ ते॒ ये युद्ध्य॑न्ते॒ तप॒सा स्सग्ंर॑भद्ध्वम॒ष्टाविग्ं॑शतिः । य न्ते॒ यत्त॒ उत्तिष्ठा॒त॑
    इ॒दन्त॒ उत्ति॑ष्ठ॒ प्रेह्यश्म॒न्॒ म्पञ्च॑विग्ंशतिः । आया॑तु त्रि॒ग्ं॒शत् । वै॒श्वा॒न॒रे तस्मि॑ न्द्र॒फ्स
    इ॒ममपे॒ताहो॑भि र्युज्यन्तामघ्नि॒या अ॑दिते पा॒रम् ँव॒ आ प्या॑यस्व स॒प्तविग्ं॑शतिः । उत्ते॑ गृहे ऽखाषि॑ति॒स्तेभ्यः॑
    पृ॑थि॒व्या अ॒न्तरि॑क्षस्य॒ द्वात्रिग्ं॑शत् । अ॒पू॒पवा॑नसौ॒ दश॑ श॒त द॑श । ए॒तास्ते॑ ते॒ दिश॒ स्सर्वा॑
    इ॒दमश्म॑न् विग्ंश॒तिः । ओ॑रोहत त॒नुवै ञ्च॒कार॒ पुन॑र्मृ॒त्यवे॒ मा नो नु॑ गा द्दद्मह इ॒मा नारीः॒ परि॒
    त्रयो॑विग्ंशतिः । अप॑ न स्सुक्षेत्रि॒या प्र यद्भ न्दि॑ष्ठः॒ प्र यद॒ग्नेः प्र यत्ते॑ अग्ने॒ त्वग्ं
    हि द्विष॒ स्सिन्धु॒मापः॑ प्रव॒णादु॑ द्व॒नादा॑न॒न्दाय॒ न वै तत्र॒ यत्रे॒द ञ्चतु॑र्विग्ंशतिः॒ । अप॑श्या॒मावृ॑णीहि॒
    द्वाद॑श द्वादश । त्वे॒तास्ते॑ स॒प्तविग्ं॑शतिः ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके षष्ठः
    प्रपाठक
