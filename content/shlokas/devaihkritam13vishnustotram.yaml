id: devaihkritam13vishnustotram
category: stotram
name:
  english: devaihkritam13vishnustotram
  devanagari: देवैःकृतं१३विष्णुस्तोत्रम्
content:
  english: syudirnavatormiravaih karale | eko'ravindatpatitastatara tasmadbhayadyena sa no'stu parah ||
    24|| ya eka isho nijamayaya nah sasarja yenanusrijama vishvam | vayam na yasyapi purah samihatah pashyama
    lingam prithagishamaninah || 25|| yo nah sapatnairbhrishamardyamanan devarshitiryannrishu nitya eva
    | kritavatarastanubhih svamayaya kritva''tmasatpati yuge yuge ca || 26|| tameva devam vayamatmadaivatam
    param pradhanam purusham vishvamanyam | vrajama sarve sharanam sharanyam svanam sa no dhasyati sham
    mahatma || 27|| iti shrimadbhagavatamahapurane shashthaskandhe navamadhyayantargatam devaih kritam
    vishnustotram samaptam | bhagavatapurana | adhyaya 6
  devanagari: स्युदीर्णवातोर्मिरवैः कराले । एकोऽरविन्दात्पतितस्ततार तस्माद्भयाद्येन स नोऽस्तु पारः ॥ २४॥
    य एक ईशो निजमायया नः ससर्ज येनानुसृजाम विश्वम् । वयं न यस्यापि पुरः समीहतः पश्याम लिङ्गं पृथगीशमानिनः
    ॥ २५॥ यो नः सपत्नैर्भृशमर्द्यमानान् देवर्षितिर्यङ्नृषु नित्य एव । कृतावतारस्तनुभिः स्वमायया कृत्वाऽऽत्मसात्पाति
    युगे युगे च ॥ २६॥ तमेव देवं वयमात्मदैवतं परं प्रधानं पुरुषं विश्वमन्यम् । व्रजाम सर्वे शरणं शरण्यं
    स्वानां स नो धास्यति शं महात्मा ॥ २७॥ इति श्रीमद्भागवतमहापुराणे षष्ठस्कन्धे नवमाध्यायान्तर्गतं देवैः
    कृतं विष्णुस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ६
meaning: {}
