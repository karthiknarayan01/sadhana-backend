id: nandikeshwara-ashtottara-sata-namavali
category: stotram
name:
  english: Nandikeshwara Ashtottara Sata Namavali
  devanagari: नन्दिकेश्वराष्टोत्तरशतनामावली
content:
  english: vibhranam parashum mrigam karatalairishapranamanjalim bhasmoddhulana-pandaram shashikala-gamga-kapardojvalam|
    paryaya-tripurantakam pramathapa-shreshtam ganam daivatam brahnendracyuta-pujitamghrikamalam shrinandikesham
    bhaje|| om nandikeshaya namah | om brahmarupine namah | om shivadhyanaparayanaya namah | om tikshnashringaya
    namah | om vedapadaya namah om virupaya namah | om vrishabhaya namah | om tungashailaya namah | om
    devadevaya namah | om shivapriyaya namah | 10| om virajamanaya namah | om natanaya namah | om agnirupaya
    namah | om dhanapriyaya namah | om sitacamaradharine namah om vedangaya namah | om kanakapriyaya namah
    | om kailasavasine namah | om devaya namah | om sthitapadaya namah | 20| om shrutipriyaya namah |
    om shvetopavitine namah | om natyanandakaya namah | om kimkinidharaya namah | om mattashringine namah
    om hatakeshaya namah | om hemabhushanaya namah | om vishnurupine namah | om prithvirupine namah |
    om nidhishaya namah | 30| om shivavahanaya namah | om gulapriyaya namah | om caruhasaya namah | om
    shringine namah | om navatrinapriyaya namah om vedasaraya namah | om mantrasaraya namah | om pratyakshaya
    namah | om karunakaraya namah | om shighraya namah | 40| om lalamakalikaya namah | om shivayogine
    namah | om jaladhipaya namah | om carurupaya namah | om vrisheshaya namah om somasuryagnilocanaya
    namah | om sundaraya namah | om somabhushaya namah | om suvaktraya namah | om kalinashanaya namah
    | 50| om suprakashaya namah | om mahaviryaya namah | om hamsaya namah | om agnimayaya namah | om prabhave
    namah om varadaya namah | om rudrarupaya namah | om madhuraya namah | om kamikapriyaya namah | om
    vishishtaya namah | 60| om divyarupaya namah | om ujvaline namah | om jvalanetraya namah | om samvartaya
    namah | om kalaya namah om keshavaya namah | om sarvadevataya namah | om shvetavarnaya namah | om
    shivasinaya namah | om cinmayaya namah | 70| om shringapattaya namah | om shvetacamarabhushaya namah
    | om devarajaya namah | om prabhanandine namah | om panditaya namah om parameshvaraya namah | om virupaya
    namah | om nirakaraya namah | om chinnadaityaya namah | om nasasutrine namah | 80| om ananteshaya
    namah | om tilatandulabhakshanaya namah | om varanandine namah | om sarasaya namah | om vimalaya namah
    om pattasutraya namah | om kalakanthaya namah | om shailadine namah | om shiladanasunandanaya namah
    | om karanaya namah | 90| om shrutibhaktaya namah | om viraghantadharaya namah | om dhanyaya namah
    | om vishnunandine namah | om shivajvalagrahine namah om bhadraya namah | om anaghaya namah | om viraya
    namah | om dhruvaya namah | om dhatre namah | 100| om shashvataya namah | om pradoshapriyarupine namah
    | om vrishaya namah | om kundaladhrite namah | om bhimaya namah om sitavarnasvarupine namah | om sarvatmane
    namah | om sarvavikhyataya namah | 108|
  devanagari: विभ्राणं परशुं मृगं करतलैरीशप्रणामाञ्जलिं भस्मोद्धूलन-पाण्डरं शशिकला-गंगा-कपर्दोज्वलम्।
    पर्याय-त्रिपुरान्तकं प्रमथप-श्रेष्टं गणं दैवतं ब्रह्नेन्द्राच्युत-पूजितांघ्रिकमलं श्रीनन्दिकेशं भजे॥
