    tvamidevatamamesamashvayurgavyuragremathinam 800006011 etatta indraviryam girbhirgrinamti karavah
    | 800006012 te stobhanta urjamavanghritashcutam pauraso nakshandhitibhih 800006021 nakshanta indramavase
    sukrityaya yesham suteshu mandase | 800006022 yatha samvarte amado yatha krisha evasme indramatsva
    800006031 a no vishve sajoshaso devaso gantanopanah | 800006032 vasavo rudra avasena agamanchrinvamtu
    maruto havam 800006041 pusha vishnurhavanam me sarasvatyavantu saptasindhavah | 800006042 apo vatah
    parvataso vanaspatih sha
  devanagari: वालखिल्यानि सूक्तानि । ८००००१०११ अभिप्रवः सुरासधसमिन्द्रमर्चयथाविदे । ८००००१०१२ यो जरितृभ्यो
    मघवा पुरूवसुः सहस्रेणेवशिक्षति ८००००१०२१ शतानीकेव प्रजिगाति धृष्णुया हंति वृत्राणि दाशुषे । ८००००१०२२
    गिरेरिव प्ररसा अस्य पिन्विरेदत्राणि पुरुभोजसः ८००००१०३१ आत्वा सुतास इन्दवो मदाय इन्द्रगिर्वणः । ८००००१०३२
    आपोनवज्रिन्नन्वोक्यं सरः पृणन्ति शूरराधसे ८००००१०४१ अनेहसं प्रतरणं विवक्षणं मध्वः स्वादिष्ठमीं पिब
    । ८००००१०४२ आ यथा मन्दसानः किरासिनः प्रक्षुद्रेवत्मना धृषत् ८००००१०५१ आ नः स्तोममुपद्रवद्धियानो अश्वोनसोतृभिः
    । ८००००१०५२ यन्ते स्वधावन् त्स्वदयंति धेनव इन्द्रकण्वेषुरातयः ८००००१०६१ उग्रं न वीरं नमसोपसेदिमविभूतिमक्षिता
    वसुम् । ८००००१०६२ उद्रीववज्रिन्नवतोन सिंचते क्षरंतींद्रधीतयः ८००००१०७१ यद्धनूनं यद्वायज्ञे यद्वा पृथिव्यामधि
    । ८००००१०७२ अतो नो यज्ञमाशुभिर्महेमत उग्र उग्रेभिरागहि ८००००१०८१ अजिरासो हरयो येत आशवो वाता इव प्रसक्षिणः
    । ८००००१०८२ येभिरपत्यं मनुषः परीयसे येभिर्विश्वं स्वर्दृशे ८००००१०९१ एतावतस्त ईमह इन्द्रसुम्नस्य गोमतः
    । ८००००१०९२ यथाप्रावो मघवन्मेध्यातिथिं यथा नीपातिथिं धने ८००००११०१ यथा कण्वे मघवन्त्रसदस्यवियथा पक्थे
    दशव्रजे । ८००००११०२ यथा गोशर्ये असनोऋ र्जिश्वनींद्रगोमद्धिरण्यवत् ८००००२०११ प्रसुश्रुतं सुराधसमर्चाशक्रमभिष्टये
    । ८००००२०१२ यः सुन्वते स्तुवते काम्यं वसुसहस्रेणेवमंहते ८००००२०२१ शतानीकाहेतयो अस्यदुष्टरा इन्द्रस्य
    समिषोमहीः । ८००००२०२२ गिरिर्न भुज्मा मघवत्सुपिन्वते यदीं सुता अमन्दिषुः ८००००२०३१ यदीं सुतास इन्दवोभिप्रियममन्दिषुः
    । ८००००२०३२ आपोनधायि सवनं म आवसो दुघा इवो पदाशुषे ८००००२०४१ अनेहसंवो हवमानमूतये मध्वःक्षरंति धीतयः
    । ८००००२०४२ आत्वा वसो हवमानास इन्दव उपस्तोत्रेषु दधिरे ८००००२०५१ आ नः सोमेस्वध्वर इयानो अत्योनतो शते
    । ८००००२०५२ यन्तेस्वदावन् त्स्वदन्ति गूर्तयः पौरे छन्दयसे हवम् ८००००२०६१ प्रवीरमुग्रं विविचिं धनस्पृतं
    विभूतिं राधसो महः । ८००००२०६२ उद्रीव वज्रिन्नवतोवसुत्वनासदापीपेथदाशुषे ८००००२०७१ यद्धनूनं परावति यद्वा
    पृथिव्यां दिवि । ८००००२०७२ युजान इन्द्र हरिभिर्महेमत ऋष्व ऋष्वेभिरागहि ८००००२०८१ रथिरासो हरयो ये ते
    अस्रिध ओजोवातस्यपिप्रति । ८००००२०८२ येभिर्निदस्युं मनुषो निघोषयो येभिः स्वः परीयसे ८००००२०९१ एतावतस्तेवसो
    विद्यामशूरनव्यसः । ८००००२०९२ यथा प्राव एतशंकृत्व्येधने यथावशं दशव्रजे ८००००२१०१ यथा कण्वे मघवन्मेघे
    अध्वरेदीर्घनीथेदमूनसि । ८००००२१०२ यथा गोशर्ये असिषासो अद्रिवोमयि गोत्रं हरिश्रियम् ८००००३०११ यथा मनौसां
    वरणौ सोममिन्द्रापिबः सुतम् । ८००००३०१२ नीपाथितौ मघवन्मेध्यातिथौ पुष्टिगौश्रुष्टिगौसचा ८००००३०२१ पार्षद्वाणः
    प्रस्कण्वं समसादयच्छयानं जिव्रिमुद्धितम् । ८००००३०२२ सहस्राण्यसिषासद्गवामृषिस्त्वोतोदस्यवेवृकः ८००००३०३१
    य उक्थेभिर्नविन्धते चिकिद्य ऋषिचोदनः । ८००००३०३२ इन्द्रं तमच्छावदनव्यस्यामत्यरिष्यन्तं न भोजसे ८००००३०४१
    यस्मा अर्कं सप्तशीर्षाणमानृचुस्त्रिधातुमुत्तमे पदे । ८००००३०४२ सत्विमा विश्वा भुवनानि चिक्रददादिज्जनिष्टपौंस्यम्
    ८००००३०५१ यो नो दातावसूनामिंद्रंतं हूमहे वयम् । ८००००३०५२ विद्मास्य सुमतिं नवीयसीं गमेम गोमतिव्रजे
    ८००००३०६१ यस्मै त्वं वसोदानायशिक्षसि स रायस्पोषमश्नुते । ८००००३०६२ तं त्वा वयं मघवन्निन्द्रगिर्वणः
    सुतावन्तो हवामहे ८००००३०७१ कदाचनस्तरीरसि नेन्द्रसश्चसिदाशुषे । ८००००३०७२ उपोपेन्नु मघवन्भूय इन्नुते
    दानं देवस्य पृच्यते ८००००३०८१ प्रयोननक्षे अभ्योजसाक्रिविं वधैः शुष्णं निघोष्यन् । ८००००३०८२ यदेद्रस्तंभीत्प्रथयन्नमूं
    दिवमादिज्जनिष्ट पार्थिवः ८००००३०९१ यस्यायं विश्व आर्योदासः शेवधिपा अरिः । ८००००३०९२ तिरश्चिदर्येरुशमेपवीरवितुभ्येत्सो
    अज्यते रयिः ८००००३१०१ तुरण्यवो मधुमन्तं घृतश्चुतं विप्रासो अर्कमानृचुः । ८००००३१०२ अस्मे रयिः पप्रथे
    वृष्ण्यंशवोस्मेस्सुवानास इन्दवः ८००००४०११ यथा मनौ विवस्वति सोमं शक्रापिबः सुतम् । ८००००४०१२ यथा त्रितेछन्द
    इन्द्रजुजोषस्यायौ मादसयसे सचा ८००००४०२१ पृषध्रे मेध्ये मातरिश्वनीन्द्रसुवाने अमन्दथाः । ८००००४०२२
    यथा सोमं दशशिप्रे दशोण्ये स्यूमरश्मावृजूनसि ८००००४०३१ य उक्था केवलादधे यः सोमं धृषितापिबत् । ८००००४०३२
    यस्मै विष्णुस्त्रीणिपदा विचक्रम उपमित्रस्य धर्मभिः ८००००४०४१ यस्य त्वमिन्द्रस्तोमेषु चाक नो वाजे वाजिञ्छतक्रतो
    । ८००००४०४२ तं त्वा वयं सुदुघामिव गोदुहो जुहूम सिश्रवस्यवः ८००००४०५१ यो नो दातासनः पितामहाँ उग्र ईशानकृत्
    । ८००००४०५२ अयामन्नुग्रो मघवा पुरूवसुर्गोरश्वस्यप्रदातु नः ८००००४०६१ यस्मै त्वं वसो दानाय मंहसे सरायस्पोषमिन्वति
    । ८००००४०६२ वसूयवो वसुपतिं शतक्रतुं स्तोमैरिन्द्रं हवामहे ८००००४०७१ कदाचन प्रयुच्छस्युभेनिपासि जन्मनी
    । ८००००४०७२ तुरीयादित्यहवनं त इन्द्रियमातस्थावमृतं दिवि ८००००४०८१ यस्मै त्वं मघवन्निन्द्रगिर्वणः शिक्षोशिक्षसि
    दाशुषे । ८००००४०८२ अस्माकं गिर उत सुष्टुतिं वसोकण्ववच्छृणुधी हवम् ८००००४०९१ अस्ताविमन्मपूर्व्यं ब्रह्मेन्द्राय
    वोचत । ८००००४०९२ पूर्वीऋ र्तस्य बृहतीरनूषतस्तोतुर्मेधा असृक्षत ८००००४१०१ समिन्द्रोरायो बृहतीरधूनुत
    संक्षोणीसमुसूर्यम् । ८००००४१०२ संशुक्रासः शुचयः संगवाशिरः सोमा इन्द्रममंदिषुः ८००००५०११ उपमं त्वा
    मघोनां ज्येष्ठं च वृषभाणाम् । ८००००५०१२ पूर्भित्तमंघवन्निन्द्रगोविदमीशानं राय ईमहे ८००००५०२१ य आयुं
    कुत्समतिथिग्वमर्दयो वावृधानो दिवेदिवे । ८००००५०२२ तं त्वा वयं हर्यश्वं शतक्रतुं वाजयन्तो हवामहे ८००००५०३१
    आ नो विश्वेषां रसं मध्वः सिंचंत्वद्रयः । ८००००५०३२ ये परावति सुन्विरे जनेष्वाये अर्वावतीं दवः ८००००५०४१
    विश्वाद्वेषां सिजहिचावचाकृधि विश्वेसन्वं त्वा वसु । ८००००५०४२ शीष्टेषु चित्ते मदिरासो अंशवो यत्रा
    सोमस्य तृंपसि ८००००५०५१ इन्द्रनेदीय एदिहि मितमेधाभिरूतिभिः । ८००००५०५२ आशंतमशंतमाभिरभिष्टिभिरास्वापेस्वापिभिः
    ८००००५०६१ आजितुरं सत्पतिं विश्वचर्षणिं कृधि प्रजास्वाभगम् । ८००००५०६२ प्रसूतिराशचीभिर्येत उक्थिनः
    क्रतुं पुनत आनुषक् ८००००५०७१ यस्ते साधिष्ठो वसेते स्याम भरेषु ते । ८००००५०७२ वयं होत्राभिरुत देवहूतिभिः
    ससवांसो मनामहे ८००००५०८१ अहं हि ते हरिवो ब्रह्मवाजयुराजिं यामि सदोतिभिः । ८००००५०८२ त्वामिदेवतममेसमश्वयुर्गव्युरग्रेमथीनाम्
    ८००००६०११ एतत्त इन्द्रवीर्यं गीर्भिर्गृणंति कारवः । ८००००६०१२ ते स्तोभन्त ऊर्जमावन्घृतश्चुतं पौरासो
    नक्षन्धीतिभिः ८००००६०२१ नक्षन्त इन्द्रमवसे सुकृत्यया येषां सुतेषु मन्दसे । ८००००६०२२ यथा संवर्ते अमदो
    यथा कृश एवास्मे इन्द्रमत्स्व ८००००६०३१ आ नो विश्वे सजोषसो देवासो गन्तनोपनः । ८००००६०३२ वसवो रुद्रा
    अवसेन आगमञ्छृण्वंतु मरुतो हवम् ८००००६०४१ पूषा विष्णुर्हवनं मे सरस्वत्यवन्तु सप्तसिन्धवः । ८००००६०४२
    आपो वातः पर्वतासो वनस्पतिः श
