id: sri-ganapathi-stavam
category: stotram
name:
  english: Sri Ganapathi Stavam
content:
  english: brahmavishnumahesha ucuh | ajam nirvikalpam nirakaramekam niranandamadvaitamanandapurnam |
    param nirgunam nirvishesham niriham parabrahmarupam ganesham bhajema || || gunatitamadyam cidanandarupam
    cidabhasakam sarvagam jnanagamyam | munidhyeyamakasharupam paresham parabrahmarupam ganesham bhajema
    || || jagatkaranam karanajnanarupam suradim sukhadim yugadim ganesham | jagadvyapinam vishvavandyam
    suresham parabrahmarupam ganesham bhajema || || rajoyogato brahmarupam shrutijnam sada karyasaktam
    hridacintyarupam | jagatkarakam sarvavidyanidhanam parabrahmarupam ganesham natasmah || || sada sattvayogam
    muda kridamanam surarinharantam jagatpalayantam | anekavataram nijajnanaharam sada vishnurupam ganesham
    namamah || || tamoyoginam rudrarupam trinetram jagaddharakam tarakam jnanahetum | anekagamaih svam
    janam bodhayantam sada sharvarupam ganesham namamah || || tamastomaharam janajnanaharam trayivedasaram
    parabrahmaparam | munijnanakaram vidurevikaram sada brahmarupam ganesham namamah || || nijairoshadhistarpayantam
    karodyaih saraughankalabhih sudhasravinibhih | dineshamshu santapaharam dvijesham shashankasvarupam
    ganesham namamah || || prakashasvarupam nabhovayurupam vikaradihetum kalakalabhutam | anekakriyanekashaktisvarupam
    sada shaktirupam ganesham namamah || || pradhanasvarupam mahattattvarupam dharavarirupam digishadirupam
    | asatsatsvarupam jagaddhetubhutam sada vishvarupam ganesham natasmah || || tvadiye manah sthapayedanghriyugme
    jano vighnasanghanna pidam labheta | lasatsuryabimbe vishale sthito'yam janodhvanta pidam katham va
    labheta || || vayam bhramitah sarvatha'jnanayoga dalabdha tavanghrim bahunvarshapugan | idanimavaptastavaiva
    prasada tprapannansada pahi vishvambharadya || || ganesha uvaca | idam yah pathetpratarutthaya dhiman
    trisandhyam sada bhaktiyukto vishuddhah | saputran shriyam sarvakaman labheta parabrahmarupo bhavedantakale
    || || iti ganeshapurane upasanakhande trayodasho'dhyaye shriganapatistavah |
  devanagari: ब्रह्मविष्णुमहेशा ऊचुः । अजं निर्विकल्पं निराकारमेकं निरानन्दमद्वैतमानन्दपूर्णम् । परं निर्गुणं
    निर्विशेषं निरीहं परब्रह्मरूपं गणेशं भजेम ॥ ॥ गुणातीतमाद्यं चिदानन्दरूपं चिदाभासकं सर्वगं ज्ञानगम्यम्
    । मुनिध्येयमाकाशरूपं परेशं परब्रह्मरूपं गणेशं भजेम ॥ ॥ जगत्कारणं कारणज्ञानरूपं सुरादिं सुखादिं युगादिं
    गणेशम् । जगद्व्यापिनं विश्ववन्द्यं सुरेशं परब्रह्मरूपं गणेशं भजेम ॥ ॥ रजोयोगतो ब्रह्मरूपं श्रुतिज्ञं
    सदा कार्यसक्तं हृदाचिन्त्यरूपम् । जगत्कारकं सर्वविद्यानिधानं परब्रह्मरूपं गणेशं नतास्मः ॥ ॥ सदा सत्त्वयोगं
    मुदा क्रीडमानं सुरारीन्हरन्तं जगत्पालयन्तम् । अनेकावतारं निजज्ञानहारं सदा विष्णुरूपं गणेशं नमामः ॥
    ॥ तमोयोगिनं रुद्ररूपं त्रिनेत्रं जगद्धारकं तारकं ज्ञानहेतुम् । अनेकागमैः स्वं जनं बोधयन्तं सदा शर्वरूपं
    गणेशं नमामः ॥ ॥ तमस्तोमहारं जनाज्ञानहारं त्रयीवेदसारं परब्रह्मपारम् । मुनिज्ञानकारं विदूरेविकारं सदा
    ब्रह्मरूपं गणेशं नमामः ॥ ॥ निजैरोषधीस्तर्पयन्तं करोद्यैः सरौघान्कलाभिः सुधास्राविणीभिः । दिनेशांशु
    सन्तापहारं द्विजेशं शशाङ्कस्वरूपं गणेशं नमामः ॥ ॥ प्रकाशस्वरूपं नभोवायुरूपं विकारादिहेतुं कलाकालभूतम्
    । अनेकक्रियानेकशक्तिस्वरूपं सदा शक्तिरूपं गणेशं नमामः ॥ ॥ प्रधानस्वरूपं महत्तत्त्वरूपं धरावारिरूपं
    दिगीशादिरूपम् । असत्सत्स्वरूपं जगद्धेतुभूतं सदा विश्वरूपं गणेशं नतास्मः ॥ ॥ त्वदीये मनः स्थापयेदङ्घ्रियुग्मे
    जनो विघ्नसङ्घान्न पीडां लभेत । लसत्सूर्यबिम्बे विशाले स्थितोऽयं जनोध्वान्त पीडां कथं वा लभेत ॥ ॥ वयं
    भ्रामिताः सर्वथाऽज्ञानयोगा दलब्धा तवाङ्घ्रिं बहून्वर्षपूगान् । इदानीमवाप्तास्तवैव प्रसादा त्प्रपन्नान्सदा
    पाहि विश्वम्भराद्य ॥ ॥ गणेश उवाच । इदं यः पठेत्प्रातरुत्थाय धीमान् त्रिसन्ध्यं सदा भक्तियुक्तो विशुद्धः
    । सपुत्रान् श्रियं सर्वकामान् लभेत परब्रह्मरूपो भवेदन्तकाले ॥ ॥ इति गणेशपुराणे उपासनाखण्डे त्रयोदशोऽध्याये
    श्रीगणपतिस्तवः ।
