name:
  english: Shyamala Ashtottara Sata Namavali
content:
  english: om matangyai namah | om vijayayai namah | om shyamayai namah | om saciveshyai namah | om shukapriyayai
    namah | om nipapriyayai namah | om kadambeshyai namah | om madaghurnitalocanayai namah | om bhaktanuraktayai
    namah | om mantreshyai namah | om pushpinyai namah | om mantrinyai namah | om shivayai namah | om
    kalavatyai namah | om raktavastrayai namah | om abhiramayai namah | om sumadhyamayai namah | om trikonamadhyanilayayai
    namah | om carucandravatamsinyai namah | om rahah pujyayai namah | om rahah kelaye namah | om yonirupayai
    namah | om maheshvaryai namah | om bhagapriyayai namah | om bhagaradhyayai namah | om subhagayai namah
    | om bhagamalinyai namah | om ratipriyayai namah | om caturbahave namah | om suvenyai namah | om caruhasinyai
    namah | om madhupriyayai namah | om shrijananyai namah | om sharvanyai namah | om shivatmikayai namah
    | om rajyalakshmipradayai namah | om nityayai namah | om nipodyananivasinyai namah | om vinavatyai
    namah | om kambukanthyai namah | om kameshyai namah | om yajnarupinyai namah | om sangitarasikayai
    namah | om nadapriyayai namah | om nilotpaladyutaye namah | om matangatanayayai namah | om lakshmyai
    namah | om vyapinyai namah | om sarvaranjinyai namah | om divyacandanadigdhangyai namah | om yavakardrapadambujayai
    namah | om kasturitilakayai namah | om subhruve namah | om bimboshthyai namah | om madalasayai namah
    | om vidyarajnyai namah | om bhagavatyai namah | om sudhapananumodinyai namah | om shankhatatankinyai
    namah | om guhyayai namah | om yoshitpurushamohinyai namah | om kinkaribhutagirvanyai namah | om kaulinyai
    namah | om akshararupinyai namah | om vidyutkapolaphalikayai namah | om muktaratnavibhushitayai namah
    | om sunasayai namah | om tanumadhyayai namah | om shrividyayai namah | om bhuvaneshvaryai namah |
    om prithustanyai namah | om brahmavidyayai namah | om sudhasagaravasinyai namah | om guhyavidyayai
    namah | om anavadyangyai namah | om yantrinyai namah | om ratilolupayai namah | om trailokyasundaryai
    namah | om ramyayai namah | om sragvinyai namah | om kiradharinyai namah | om atmaikyasumukhibhutajagadahladakarinyai
    namah | om kalpatitayai namah | om kundalinyai namah | om kaladharayai namah | om manasvinyai namah
    | om acintyanantavibhavayai namah | om ratnasimhasaneshvaryai namah | om padmasanayai namah | om kamakalayai
    namah | om svayambhukusumapriyayai namah | om kalyanyai namah | om nityapushpayai namah | om shambhavivaradayinyai
    namah | om sarvavidyapradayai namah | om vacyayai namah | om guhyopanishaduttamayai namah | om nripavashyakaryai
    namah | om bhoktryai namah | om jagatpratyakshasakshinyai namah | om brahmavishnvishajananyai namah
    | om sarvasaubhagyadayinyai namah | om guhyatiguhyagoptryai namah | om nityaklinnayai namah | om amritodbhavayai
    namah | om kaivalyadatryai namah | om vashinyai namah | om sarvasampatpradayinyai namah | iti shri
    shyamalashtottarashatanamavalih |
  devanagari: ॐ मातङ्ग्यै नमः । ॐ विजयायै नमः । ॐ श्यामायै नमः । ॐ सचिवेश्यै नमः । ॐ शुकप्रियायै नमः ।
    ॐ नीपप्रियायै नमः । ॐ कदम्बेश्यै नमः । ॐ मदघूर्णितलोचनायै नमः । ॐ भक्तानुरक्तायै नमः । ॐ मन्त्रेश्यै
    नमः । ॐ पुष्पिण्यै नमः । ॐ मन्त्रिण्यै नमः । ॐ शिवायै नमः । ॐ कलावत्यै नमः । ॐ रक्तवस्त्रायै नमः ।
    ॐ अभिरामायै नमः । ॐ सुमध्यमायै नमः । ॐ त्रिकोणमध्यनिलयायै नमः । ॐ चारुचन्द्रावतंसिन्यै नमः । ॐ रहः
    पूज्यायै नमः । ॐ रहः केलये नमः । ॐ योनिरूपायै नमः । ॐ महेश्वर्यै नमः । ॐ भगप्रियायै नमः । ॐ भगाराध्यायै
    नमः । ॐ सुभगायै नमः । ॐ भगमालिन्यै नमः । ॐ रतिप्रियायै नमः । ॐ चतुर्बाहवे नमः । ॐ सुवेण्यै नमः । ॐ
    चारुहासिन्यै नमः । ॐ मधुप्रियायै नमः । ॐ श्रीजनन्यै नमः । ॐ शर्वाण्यै नमः । ॐ शिवात्मिकायै नमः । ॐ
