id: subala
category: upanishad
name:
  english: subala
  devanagari: सुबाल
content:
  english: manantaramabahyam na tadashnati kimcana na tadashnati kashcanaitadvai satyena danena tapasa'nashakena
    brahmacaryena nirvedanenanashakena shadangenaiva sadhayedetatrayam viksheta damam danam dayamiti na
    tasya prana utkramantyatraiva samavaliyante brahmaiva sanbrahmapyeti ya evam veda || iti tritiyah
    khandah || 3|| hridayasya madhye lohitam mamsapindam yasmimstaddaharam pundarikam kumudamivanekadha
    vikasitam hridayasya dasha chidrani bhavanti yeshu pranah pratishthitah sa yada pranena saha samyujyate
    tada pashyati nadyo nagarani bahuni vividhani ca yada vyanena saha samyujyate tada pashyati devamshca
    rishimshca yadapanena saha samyujyate tada pashyati yaksharakshasagandharvanyada udanena saha samyujyate
    tada pashyati devalokandevanskandam jayantam ceti yada samanena saha samyujyate tada pashyati devalokandhanani
    ca yada vairambhena saha samyujyate tada pashyati drishtam ca shrutam ca bhuktam cabhuktam ca saccasacca
    sarvam pashyati athema dasha dasha nadyo bhavanti tasamekaikasya dvasaptatirdvasaptatih shakha nadisahasrani
    bhavanti yasminnayamatma svapiti shabdanam ca karotyatha yaddvitiye sankoshe svapiti tademam ca lokam
    param ca lokam pashyati sarvanchabdanvijanati sa samprasada ityacakshate pranah shariram parirakshati
    haritasya nilasya pitasya lohitasya shvetasya nadyo rudhirasya purna athatraitaddaharam pundarikam
    kumudamivanekadha vikasitam yatha keshah sahasradha bhinnastatha hita nama nadyo bhavanti hridyakashe
    pare koshe divyo'yamatma svapiti yatra supto na kancana kamam kamayate na kancana svapnam pashyati
    na tatra deva na devaloka yajna na yajna va na mata na pita na bandhurna bandhavo na steno na brahmaha
    tejaskayamamritam salila evedam salilam vanam bhuyastenaiva margena jagraya dhavati samraditi hovaca
    || iti caturthah khandah || 4|| sthanani sthanibhyo yacchati nadi tesham nibandhanam cakshuradhyatmam
    drashtavyamadhibhutamadityastatradhidaivatam nadi tesham nibandhanam yashcakshushi yo drashtavye ya
    aditye yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati
    so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || shrotramadhyatmam shrotavyamadhibhutam
    dishastatradhidaivatam nadi tesham nibandhanam yah shrotre yah shrotavye yo dikshu yo nadyam yah prane
    yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || nasadhyatmam ghratavyamadhibhutam prithivi tatradhidaivatam nadi tesham nibandhanam yo nasayam
    yo ghratavye yah prithivyam yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || jihvadhyatmam rasayitavyamadhibhutam
    varunastatradhidaivatam nadi tesham nibandhanam yastvaci yah sparshayitavye yo varune yo nadyam yah
    prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamamritamabhayamashokamanantam
    || tvagadhyatmam sparshayitavyamadhibhutam vayustatradhidaivatam nadi tesham nibandhanam yastvaci
    yah sparshayitavye yo vayau yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || mano'dhyatmam mantavyamadhibhutam
    candrastatradhidaivatam nadi tesham nibandhanam yo manasi yo mantavye yashcandre yo nadyam yah prane
    yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || buddhiradhyatmam boddhavyamadhibhutam brahma tatradhidaivatam nadi tesham nibandhanam yo buddhau
    yo boddhavye yo brahmani yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || ahankaro'dhyatmamahamkartavyamadhibhutam
    rudrastatradhidaivatam nadi tesham nibandhanam yo'hankare yo'hamkartavye yo rudre yo nadyam yah prane
    yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || cittamadhyatmam cetayitavyamadhibhutam kshetrajnastatradhidaivatam nadi tesham nibandhanam yashcitte
    yashcetayitavye yah kshetrajne yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || vagadhyatmam vaktavyamadhibhutamagnistatradhidaivatam
    nadi tesham nibandhanam yo vaci yo vaktavye yo'gnau yo nadyam yah prane yo vijnane ya anande yo hridyakashe
    ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || hastavadhyatmamadatavyamadhibhutamindrastatradhidaivatam nadi tesham nibandhanam yo haste ya adatavye
    ya indre yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati
    so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || padavadhyatmam gantavyamadhibhutam
    vishnustatradhidaivatam nadi tesham nibandhanam yah pade yo gantavye yo vishnau yo nadyam yah prane
    yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || payuradhyatmam visarjayitavyamadhibhutam mrityustatradhidaivatam nadi tesham nibandhanam yah payau
    yo visarjayitavye yo mrityau yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || upastho'dhyatmamanandayitavyamadhibhutam
    prajapatistatradhidaivatam nadi tesham nibandhanam ya upasthe ya anandayitavye yah prajapatau yo nadyam
    yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so'yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || esha sarvajna esha sarveshvara esha sarvadhipatiresho'ntaryamyesha yonih sarvasya sarvasaukhyerupasyamano
    na ca sarvasaukhyanyupasyati vedashastrairupasyamano na ca vedashastranyupasyati yasyanamidam sarve
    na ca yo'nnam bhavatyatah param sarvanayanah prashastannamayo bhutatma pranamaya indriyatma manomayah
    samkalpatma vijnanamayah kalatmanandamayo layatmaikatvam nasti dvaitam kuto martyam nastyamritam kuto
    nantahprajno na bahihprajno nobhayatahprajno na prajnaghano na prajno naprajno'pi no viditam vedyam
    nastityetannirvananushasanamiti vedanushasanamiti vedanushasanam || iti pancamah khandah || 5|| naiveha
    kimcanagra asidamulamanadharamimah prajah prajayante divyo deva eko narayanashcakshushca drashtavyam
    ca narayanah shrotram ca shrotavyam ca narayano ghranam ca ghratavyam ca narayano jihva ca rasayitavyam
    ca narayanastvak ca sparshayitavyam ca narayano matashca mantavyam ca narayano buddhishca boddhavyam
    ca narayano'hankarashcahamkartavyam ca narayanashcittam ca cetayitavyam ca narayano vak ca vaktavyam
    ca narayano hastau cadatavyam ca narayanah padau ca gantavyam ca narayanah payushca visarjayitavyam
    ca narayana upasthashcanandayitavyam ca narayano dhata vidhata karta vikarta divyo deva eko narayana
    aditya rudra maruto vasavo'shvinavrico yajumshi samani mantro'gni
  devanagari: मनन्तरमबाह्यं न तदश्नाति किंचन न तदश्नाति कश्चनैतद्वै सत्येन दानेन तपसाऽनाशकेन ब्रह्मचर्येण
    निर्वेदनेनानाशकेन षडङ्गेनैव साधयेदेतत्रयं वीक्षेत दमं दानं दयामिति न तस्य प्राणा उत्क्रामन्त्यत्रैव
    समवलीयन्ते ब्रह्मैव सन्ब्रह्माप्येति य एवं वेद ॥ इति तृतीयः खण्डः ॥ ३॥ हृदयस्य मध्ये लोहितं मांसपिण्डं
    यस्मिंस्तद्दहरं पुण्डरीकं कुमुदमिवानेकधा विकसितं हृदयस्य दश छिद्राणि भवन्ति येषु प्राणाः प्रतिष्ठिताः
    स यदा प्राणेन सह संयुज्यते तदा पश्यति नद्यो नगराणि बहूनि विविधानि च यदा व्यानेन सह संयुज्यते तदा पश्यति
    देवांश्च ऋषींश्च यदापानेन सह संयुज्यते तदा पश्यति यक्षराक्षसगन्धर्वान्यदा उदानेन सह संयुज्यते तदा
    पश्यति देवलोकान्देवान्स्कन्दं जयन्तं चेति यदा समानेन सह संयुज्यते तदा पश्यति देवलोकान्धनानि च यदा
    वैरम्भेण सह संयुज्यते तदा पश्यति दृष्टं च श्रुतं च भुक्तं चाभुक्तं च सच्चासच्च सर्वं पश्यति अथेमा
    दश दश नाड्यो भवन्ति तासामेकैकस्य द्वासप्ततिर्द्वासप्ततिः शाखा नाडीसहस्राणि भवन्ति यस्मिन्नयमात्मा
    स्वपिति शब्दानां च करोत्यथ यद्द्वितीये सङ्कोशे स्वपिति तदेमं च लोकं परं च लोकं पश्यति सर्वाञ्छब्दान्विजानाति
    स सम्प्रसाद इत्याचक्षते प्राणः शरीरं परिरक्षति हरितस्य नीलस्य पीतस्य लोहितस्य श्वेतस्य नाड्यो रुधिरस्य
    पूर्णा अथात्रैतद्दहरं पुण्डरीकं कुमुदमिवानेकधा विकसितं यथा केशः सहस्रधा भिन्नस्तथा हिता नाम नाड्यो
    भवन्ति हृद्याकाशे परे कोशे दिव्योऽयमात्मा स्वपिति यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं
    पश्यति न तत्र देवा न देवलोका यज्ञा न यज्ञा वा न माता न पिता न बन्धुर्न बान्धवो न स्तेनो न ब्रह्महा
    तेजस्कायममृतं सलिल एवेदं सलिलं वनं भूयस्तेनैव मार्गेण जाग्राय धावति सम्राडिति होवाच ॥ इति चतुर्थः
    खण्डः ॥ ४॥ स्थानानि स्थानिभ्यो यच्छति नाडी तेषां निबन्धनं चक्षुरध्यात्मं द्रष्टव्यमधिभूतमादित्यस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यश्चक्षुषि यो द्रष्टव्ये य आदित्ये यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो
    हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ श्रोत्रमध्यात्मं
    श्रोतव्यमधिभूतं दिशस्तत्राधिदैवतं नाडी तेषां निबन्धनं यः श्रोत्रे यः श्रोतव्ये यो दिक्षु यो नाड्यां
    यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ नासाध्यात्मं घ्रातव्यमधिभूतं पृथिवी तत्राधिदैवतं नाडी तेषां निबन्धनं यो नासायां यो घ्रातव्ये यः
    पृथिव्यां यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति
    सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ जिह्वाध्यात्मं रसयितव्यमधिभूतं वरुणस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यस्त्वचि यः स्पर्शयितव्ये यो वरुणे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो
    हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरमममृतमभयमशोकमनन्तम् ॥ त्वगध्यात्मं
    स्पर्शयितव्यमधिभूतं वायुस्तत्राधिदैवतं नाडी तेषां निबन्धनं यस्त्वचि यः स्पर्शयितव्ये यो वायौ यो नाड्यां
    यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ मनोऽध्यात्मं मन्तव्यमधिभूतं चन्द्रस्तत्राधिदैवतं नाडी तेषां निबन्धनं यो मनसि यो मन्तव्ये यश्चन्द्रे
    यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा
    तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ बुद्धिरध्यात्मं बोद्धव्यमधिभूतं ब्रह्मा तत्राधिदैवतं नाडी तेषां
    निबन्धनं यो बुद्धौ यो बोद्धव्ये यो ब्रह्मणि यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ अहङ्कारोऽध्यात्ममहंकर्तव्यमधिभूतं
    रुद्रस्तत्राधिदैवतं नाडी तेषां निबन्धनं योऽहङ्कारे योऽहंकर्तव्ये यो रुद्रे यो नाड्यां यः प्राणे यो
    विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ चित्तमध्यात्मं चेतयितव्यमधिभूतं क्षेत्रज्ञस्तत्राधिदैवतं नाडी तेषां निबन्धनं यश्चित्ते यश्चेतयितव्ये
    यः क्षेत्रज्ञे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे
    संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ वागध्यात्मं वक्तव्यमधिभूतमग्निस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यो वाचि यो वक्तव्ये योऽग्नौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ हस्तावध्यात्ममादातव्यमधिभूतमिन्द्रस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यो हस्ते य आदातव्ये य इन्द्रे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ पादावध्यात्मं
    गन्तव्यमधिभूतं विष्णुस्तत्राधिदैवतं नाडी तेषां निबन्धनं यः पादे यो गन्तव्ये यो विष्णौ यो नाड्यां यः
    प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ पायुरध्यात्मं विसर्जयितव्यमधिभूतं मृत्युस्तत्राधिदैवतं नाडी तेषां निबन्धनं यः पायौ यो विसर्जयितव्ये
    यो मृत्यौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति
    सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ उपस्थोऽध्यात्ममानन्दयितव्यमधिभूतं प्रजापतिस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं य उपस्थे य आनन्दयितव्ये यः प्रजापतौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे
    यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपसीताजरममृतमभयमशोकमनन्तम् ॥ एष
    सर्वज्ञ एष सर्वेश्वर एष सर्वाधिपतिरेषोऽन्तर्याम्येष योनिः सर्वस्य सर्वसौख्येरुपास्यमानो न च सर्वसौख्यान्युपास्यति
    वेदशास्त्रैरुपास्यमानो न च वेदशास्त्राण्युपास्यति यस्यानमिदं सर्वे न च योऽन्नं भवत्यतः परं सर्वनयनः
    प्रशास्तान्नमयो भूतात्मा प्राणमय इन्द्रियात्मा मनोमयः संकल्पात्मा विज्ञानमयः कालात्मानन्दमयो लयात्मैकत्वं
    नास्ति द्वैतं कुतो मर्त्यं नास्त्यमृतं कुतो नान्तःप्रज्ञो न बहिःप्रज्ञो नोभयतःप्रज्ञो न प्रज्ञाघनो
    न प्रज्ञो नाप्रज्ञोऽपि नो विदितं वेद्यं नास्तीत्येतन्निर्वाणानुशासनमिति वेदानुशासनमिति वेदानुशासनम्
    ॥ इति पञ्चमः खण्डः ॥ ५॥ नैवेह किंचनाग्र आसीदमूलमनाधारमिमाः प्रजाः प्रजायन्ते दिव्यो देव एको नारायणश्चक्षुश्च
    द्रष्टव्यं च नारायणः श्रोत्रं च श्रोतव्यं च नारायणो घ्राणं च घ्रातव्यं च नारायणो जिह्वा च रसयितव्यं
    च नारायणस्त्वक् च स्पर्शयितव्यं च नारायणो मतश्च मन्तव्यं च नरायणो बुद्धिश्च बोद्धव्यं च नारायणोऽहङ्कारश्चाहंकार्तव्यं
    च नारायणश्चित्तं च चेतयितव्यं च नारायणो वाक् च वक्तव्यं च नारायणो हस्तौ चादातव्यं च नारायणः पादौ च
    गन्तव्यं च नारायणः पायुश्च विसर्जयितव्यं च नारायण उपस्थश्चानन्दयितव्यं च नारायणो धाता विधाता कर्ता
    विकर्ता दिव्यो देव एको नारायण आदित्या रुद्रा मरुतो वसवोऽश्विनावृचो यजूंषि सामानि मन्त्रोऽग्नि
