id: rinamocanastotram
category: stotram
name:
  english: rinamocanastotram
  devanagari: ऋणमोचनस्तोत्रम्
content:
  english: narasimharinamocanastotram devatakaryasiddhayartham sabhastambhasamudbhavam | shrinrisimha
    mahaviram namami rinamuktaye || 1|| lakshmyalingitavamangam bhaktanam varadayakam | shrinrisimha mahaviram
    namami rinamuktaye || 2|| antramaladharam shankhacakrabjayudhadharinam | shrinrisimha mahaviram namami
    rinamuktaye || 3|| smaranatsarvapapaghnam kadrujavishanashanam | shrinrisimha mahaviram namami rinamuktaye
    || 4|| simhanadena mahata digdantibhayanashanam | shrinrisimha mahaviram namami rinamuktaye || 5||
    prahladavaradam shrisham daityeshvaravidaranam | shrinrisimha mahaviram namami rinamuktaye || 6||
    kruragraheh piditanam bhaktanamabhayapradam | shrinrisimha mahaviram namami rinamuktaye || 7|| vedavedantayajnesham
    brahmarudradivanditam | shrinrisimha mahaviram namami rinamuktaye || 8|| ya idam pathate nityamrinamocanasamjnitam
    | anrinim jayate sadyo dhanam shighramavapnuyat || 9|| iti shrimadvadirajapujyacaranaviracitam rinamocanastotram
    sampurnam | bharatiramanamukhyapranantargata shrikrishnarpanamastu |
  devanagari: नरसिंहऋणमोचनस्तोत्रम् देवताकार्यसिद्धयर्थं सभास्तम्भसमुद्भवम् । श्रीनृसिंह महावीरं नमामि
    ऋणमुक्तये ॥ १॥ लक्ष्म्यालिङ्गितवामाङ्गं भक्तानां वरदायकम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये ॥ २॥
    आन्त्रमालाधरं शङ्खचक्राब्जायुधधारिणम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये ॥ ३॥ स्मरणात्सर्वपापघ्नं
    कद्रुजविषनाशनम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये ॥ ४॥ सिंहनादेन महता दिग्दन्तिभयनाशनम् । श्रीनृसिंह
    महावीरं नमामि ऋणमुक्तये ॥ ५॥ प्रह्लादवरदं श्रीशं दैत्येश्वरविदारणम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये
    ॥ ६॥ क्रूरग्रहेः पीडितानां भक्तानामभयप्रदम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये ॥ ७॥ वेदवेदान्तयज्ञेशं
    ब्रह्मरुद्रादिवन्दितम् । श्रीनृसिंह महावीरं नमामि ऋणमुक्तये ॥ ८॥ य इदं पठते नित्यमृणमोचनसंज्ञितम्
    । अनृणीं जायते सद्यो धनं शीघ्रमवाप्नुयात् ॥ ९॥ इति श्रीमद्वादिराजपूज्यचरणविरचितं ऋणमोचनस्तोत्रं सम्पूर्णम्
    । भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु ।
