id: aparadhakshamapanastotram
category: stotram
name:
  english: aparadhakshamapanastotram
  devanagari: अपराधक्षमापणस्तोत्रम्
content:
  english: yanmatrabindubindudvitayapadapadadvandvavarnadihinam bhaktyabhaktyanupurvam prasabhakritivashat
    vyakttamavyakttamamba
  devanagari: यन्मात्राबिन्दुबिन्दुद्वितयपदपदद्वन्द्ववर्णादिहीनं भक्त्याभक्त्यानुपूर्वं प्रसभकृतिवशात्
    व्यक्त्तमव्यक्त्तमम्ब
meaning: {}
