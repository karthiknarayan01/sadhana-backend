id: kyts-7-5-gaavo-vaa-etathsatramaasata-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 7.5 Gaavo Vaa Etathsatramaasata - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam saptamakande pancamah prashnah shri gurubhyo namah
    | harih om || gavo va eta shshringani no jayanta iti kamena tasa ndashamasa nishanna asannatha shringa
    nyajayanta ta udatishthannarathsmetyatha yasa nnarathsmeti yasa nnarathsmeti gosatram mupayantyriddhnuvantyeva
    tasma shikau masau partva carati satrabhijitagghyasyai tasma nca grihe kriyate tadapta va~ ete pra
    plavante ye sam va~thsaramupayanti yo vai samudrasya para nna pashyati na vai sa tata udeti sam ya~datiratrau
    ya evam 'tiratro 'savuttaro manah purvo vaguttarah pranah purvo 'pana uttarah prarodhana mpurva udayanamuttaro
    jyotishtomo vaishvanaro 'tiratro bhavati jyotireva purasta ddadhate suvargasya lokasya nukhyatyai
    caturvigmshah prayaniyo bhavati caturvigmshati va~thsarah prayanta eva sam va~thsare prati tishthanti
    tasya trini ca shatani shashtishca stotriyastavati va~thsarasya ratraya ubhe eva sam sthitya arishtya
    uttarairahobhishcaranti shadaha bhavanti sha va~thsara ritushveva sam va~thsare prati tishthanti gaushca
    va~thsarasyaiva tanmithuna dadhati prajananaya jyotirabhito bhavati vimocanameva tacchandagsyeva ta
    jyotishaiva shadahena suvargam ya~nti brahmavadino vadantyasate kena yantiti devayanena patheti bruyacchandagmsi
    vai devayanah pantha gayatri trishtub jagatijyotirvai gayatri gaustrishtugayurjagati yadete stoma
    bhavanti devayanenaiva tpatha yanti samanagm sama bhavati devaloko vai sama devalokadeva nayantyanyaanya
    rico bhavanti manushyaloko va rico manushyalokadevanyamanya ndevalokamabhyarohanto yantyabhivarto
    brahmasama mbhavati suvargasya lokasyabhivritya abhiji dbhavati suvargasya lokasyabhijityai vishvaji
    dbhavati vishvasya jityai masimasi prishthanyupa yanti masima syatigrahya grihyante masima mpratishthitya
    uparishtanmasa mprishthanyupa yanti tasmaduparishtadoshadhayah phala thsatramasatashringa shshringani
    sishasantistasa ndasha masa nishanna asannatha shringa nyajayanta ta abruvannarathsmo nkamamaruthsmahi
    yena kamena nyashadameti tasamu tva abruvannardhava yavatirva ''samaha evemaudvadashau masau sam va~thsaragm
    sampadyo ttishthameti tasa ndvadashe masi shringani pravartanta shraddhaya va 'shraddhaya va ta ima
    yastupara ubhayyo vava ta a yashca shringanyasanvan yashcorjamavarundhatardhnoti dashasu masu ttishthannriddhnoti
    dvadashasu ya evam ve~da padena khalu va ete yanti vindati khalu vai padena ya ntadva etadriddhamayana
    tishthameti tasam prathame masi prishthanyupa yanti maddhyama upa yantyuttama upa yanti tadahuryam
    vai~ trirekasyahna upasidanti dahram ndvadasha kritva upasidantiti sam va~thsaragm sampadyo tprishthanyupeyusta
    mpashunava rundhate samudram mpra plavante ye sam va~thsaramupayanti ya drathantare anvarjeyuryatha
    maddhye samudrasya plavamanvarjeyustadri drathantarabhyamitva pratishtha ssarvan kamanava rundhate
    || samanya rico bhavanti manushyaloko va rico manushyalokadeva na yantyanyadanya thsama bhavati devaloko
    vai sama devalokadevanyamanya mpratyavarohanto yanti jagatimagra upa yanti jagatim vai~ chandagmsi
    pratyavarohantya tprishthani trayastrigmshagg npratyavarohati vaishvakarmano grihyatevishva nyeva
    tena karmani yajamana ava rundhata adityo va~ aditirasyameva prati tishthantyanyo 'nyo grihyete mithunatvaya
    praja vai~ dasharatrena prajapatih praja asrijata ya ddasharatro bhavati praja eva ta ssrijanta etagm
    ha va udanka ssatrasyardhimuvaca ya ddasharatro bhavati satrasyardhya atho yadeva purveshvahassu viloma
    kriyate tasyaivai yadi somau sagmsutau syata mmahati ratriyai prataranuvaka mpurvo devatah purva shchandagmsi
    vrinkte vrishanvati tpratassavanadevaishamindram vri~nkte 'tho khalvahussavanamukhe savanamukhe karyeti
    savanamukha ve~shayopaveshaya gayatriyastrishtubho jagatya anushtubhah panktya abhibhu tyai svaha
    chandagmsi vai sam nchandagmsi vrinkte sajaniyagm shasyam vi~havyagm shasyamagastyasya kayashubhiyagm
    shasyametavadva asti yavadeta dyavadevasti tadesham vri~nkte yadi pratassavane kalasho diryeta vaishnavishu
    shipivishtavatishu stuviran tiricyate vishnu ntacchipivishtamabhyati ricyate tadvishnuh shipivishto
    'tirikta evatirikta ndadhatyatho atiriktenaiva 'va rundhate yadi maddhyandine diryeta vashatkaranidhanagm
    sama kuryurvashatkaro vai yajnasya pratishtha pratishthamevaina dgamayanti yadi tritiyasavana etadeva
    || kannavigmshatishca thsampashyantyamavasyaya masa thsrijantyamavasyaya hi masa thsampashyanti paurnamasya
    masa thsrijanti paurnamasya hi masa thsampashyanti yo vai purna asincati para sa sincati yah purnadudacati
    ndadhati tadanu satrinah prananti yadaharno thsrijeyuryatha dritirupanaddho vipatatyevagm sam va~thsaro
    vi patedarti va~thsarayaiva tadudana ndadhati tadanu satrina u marcchanti purnamase vai devanagm suto
    ya thsrijanti devanameva ta mpratyavarohanti vi va eta thshadahasatantagm santamathaharu thsrijanti
    prajapatya mpashuma labhante prajapati ssarva devata devatabhireva yajnagm sa ntanvanti yanti va ete
    savanadye mbhavati tenaiva savananna yanti samupahuya bhakshayantyetath va~ eteshagm savanabhajo devata
    gacchanti ye nnirvapanti yathayatanadeva savanabhajo devata ava rundhate 'shtakapala npratassavana
    ekadashakapala nmaddhyandine savane dvadashakapalag stritiyasavane chandagsyeva 'va rundhate vaishvadeva
    ntritiyasavane nirvapanti vaishvadevam ntenaiva tritiyasavananna yanti || miti mimagmsante brahmavadina
    thsrijyamityahurete hi yajnam va~hata iti te tvava nothsrijye ityahurye avantaram mbhejate iti ya
    prathama vyashtaka tasyamu thsrijyamityahuresha vai maso vishara iti na muthsrijeyuryadrishe punah
    paryaplave maddhye shadahasya sampadyeta shadahairmasa stadagnaye vasumate purodashamashtakapala nnirvapeyuraindra
    ndadhindraya marutvate purodashamekadashakapalam ndvadashakapalamagnervai vasumatah pratassavanam
    ya~dagnaye vasumate purodashamashtakapala nnirvapanti devatameva ta mashtabhirupa yanti yadaindra
    ndadhi bhavatindrameva ta dbhagadheyanna cyavayantindrasya vai marutvato maddhyandinagm savanam ya~dindraya
    marutvate purodashamekadashakapala nnirvapanti devatameva ta nkurvanti savanamekadashabhirupa yanti
    vishvesham vai~ devanamribhumata nnirvapanti devata eva ta rupa yanti prajapatya mpashuma labhante
    yajno vai prajapati nanusargayabhivarta ita shshanmaso brahmasama mbhavati brahma va abhivarto brahmanaiva
    ta mabhivartayanto yanti pratikulamiva hita ssuvargo loka indra kratu nna a bhara pita putrebhyo yatha
    npuruhuta yamani jiva jyoti muta ayatagm shanmaso brahmasama vai~ loko jyotih praja jyotirimameva
    talloka 'bhivadanta a yanti || njagmushamindriyam tkroshenavarundhata ta tkroshasya kroshatvam tkroshena
    catvalasyante stuvanti yajnasyaivanta vi~ryamava rundhate satrasyardhya ''havaniyasyante nkritvardhimupa
    yanti prajapaterhridayena havirdhane sstuvanti premanamevasya gacchanti shlokena purasta stuvantyanushlokena
    sstuvantyanushlokena pashca ngatva shlokabhajo bhavanti navabhi dgayati nava vai purushe pranah prananeva
    yajamaneshu dadhati sarva aindriyo bhavanti praneshvevendriya 'ngani pratyacati shira eva na pancadashagmrathantara
    mbhavatindriyamevava rundhate saptadasha 'varuddhya atho praiva tena jayanta ekavigmsha ndvipadasu
    pratishthityai patnaya upa gayanti mithunatvaya praja tyai prajapatih praja asrijata so mpariyamiti
    tasagm rajanenaiva rajya drajanasya rajanatvam mbhavati prajanameva ta mpari yanti pancavigmsha sstuvanti
    devalokamevabhi jayanti pancabhirasina manushyalokamevabhi jayanti dasha sampadyante dasha nnadyamava
    rundhate pancadha vinishadya stuvanti panca disho dikshveva pratitishthantyekaikaya 'stutaya samayanti
    digbhya evannadyagm sa dgayati digbhya eva sambhritya teja atma ndadhate tasmadekah prana nyavatyatho
    yatha suparna utpatishyanchira uttama dyajamanah prajanamuttama bhavantyasandi mudgata ''rohati samra
    jyameva gacchanti plenkhagm hota nakasyaiva prishthagm rohanti kurcavaddhvaryu rbraddhnasyaiva vishtapa
    ngacchantyetavanto vai devalokasteshveva yathapurva mprati tishthantyatho akramanameva ta ya~jamanah
    kurvate suvargasya lokasya samashtyai || rgayati digbhya evannadyam arkyena vai sahasrashah prajapatih
    praja asrijata tabhya ila lu~tamavarundha yadarkya mbhavati praja eva ta mbhavati prajabhya eva srishtabhya
    iram lu~tamava rundhate tasmadyagm samagm satragm samriddha nkshodhukastagm sama mpraja ishagg hyasamurjamadadate
    yagm samam makshodhukastagm sama nkurvate yatha bandha nmumucana utkroda nkurvata evameva ta nmumucana
    utkroda nkurvata ishamurjamatma shshatatanturbhavati shatayuh purusha shshatendriya ayushyevendriye
    prati tishthantyaji ndhavantyanabhijitasya bhijityai dundubhin thsamaghnanti parama va esha vagya
    dundubhau paramameva vacamava rundhate bhumidundubhima ghnanti yaivemam kpravishta tamevava rundhate
    'tho imameva jayanti sarva vaco vadanti sarvasam va~camavaruddhya ardrecarman vyayacchete indriyasya
    varuddhya a 'nyah kroshati pranya shshagmsati ya akroshati punatyevainan thsa yah prashagmsati puteshveva
    nca purvairmasairava rundhate ya dbhutecchadagm samani bhavantyubhayasyavaruddhyai yanti va ete mithunadye
    sam mupayantyantarvedi mithunau sa mbhavatastenaiva mithunanna yanti || vyriddhamakshodhukastagm sama
    carmava bhindanti papmanamevaishamava bhindanti ma 'ti vyathsirityaha sampratyevaisha mpapmanamava
    bhindantyudakumbhanadhinidhaya dasyo marjaliya mpari nrityanti pado nighnatiridammadhu ngayantyo madhu
    vai devana nnadyamava rundhate pado ni ghnanti mahiyamevaishu dadhati || prithivyai svaha 'ntarikshaya
    svaha dive svaha samploshyate svaha saplam va~manaya svaha samplutaya svaha meghayishyate svaha meghayate
    svaha meghitaya svaha meghaya svaha niharaya svaha nihakayai svaha pracalakayai svaha vidyotishyate
    svaha vidyotamanaya svaha sam vi~dyotamanaya svaha stanayate svaha var shishyate svaha var shate svaha
    'bhivar shate svaha parivar shate svaha shikayishyate svaha shikayate svaha shikitaya svaha prushnate
    svaha pariprushnate svaho dgrahishyate svaho dgrihitaya svaha viploshyate svaha viplavamanaya svaha
    viplutaya svaha ''taphsyate svaha ''tapate svaho ssvaha yajurbhya ssvaha 'ngirobhya ssvaha narashagmsibhya
    ssvaha sarvasmai svaha datvate svaha 'dantakaya svaha 'pranaya svaha mukhavate svaha 'mukhaya svaha
    nasikavate svaha 'nasikaya svaha 'nakshikaya svaha karnine svaha 'karnakaya svaha shir 'shirshakaya
    svaha padvate svaha 'padakaya svaha pranate svaha 'pranate svaha vadate svaha 'vadate svaha pashyate
    svaha 'pashyate svaha shrinvate svaha 'shrinvate svaha manasvine svaha 'manase svaha retasvine svaha
    'retaskaya svaha prajananaya svaha lomavate svaha 'lomakaya svaha tvace svaha 'tvakkaya svaha carmanvate
    svaha 'carmakaya svaha lohitavate svaha 'lohitaya svaha magmsanvate svaha 'magmsakaya svaha snavabhya
    'nasthikaya svaha majjanvate svaha 'majjakaya svaha 'ngine svaha 'nangaya svaha ''tmane svaha 'na
    tmane svaha sarvasmai svaha kastva yunakti sa tva yunaktu vishnustva yunaktvasya yajnasyardhyai mahyagm
    sannatya amushmai kamaya ''yushe tva pranaya tva 'panaya tva vyanaya tva vyushtyai tva rayyai tva
    radhase tva ghoshaya tva poshaya tva ''radghoshaya tva pracyutyai tva || agnaye gayatraya trivrite
    rathantaraya vasantaya shtakapala indraya traishtubhaya pancadashaya bar hataya graishmayaikadashakapalo
    vishve bhyo devebhyo jagatebhya ssaptadashebhyo vairupebhyo var shikebhyo dvadashakapalo mitravarunabhya
    vai~rajabhyagm sharadabhya mpayasya brihaspataye panktaya trinavaya shakvaraya haimantikaya caru ssavitra
    aticchandasaya trayastrigmshaya raivataya shaishiraya dvadashakapalo 'dityai vishnupatnyai caruragnaye
    vaishvanaraya dvadashakapalo 'numatyai caruh kaya ekakapalah || yo va agnavagnih prahriyate yashca
    somo raja tayoresha atithyam 'thaisha rudro yashciyate ya 'gnavetani havigmshi na nirvapedesha eva
    rudro nta upotthaya praja mpashun yajamanasyabhi manyeta ya 'gnavetani havigmshi nirvapati bhagadheyenaivainagm
    shamayati nasya rudro mpashunabhi manyate dasha havigmshi bhavanti nava vai purushe prana nabhirdashami
    prananeva yajamane dadhatyatho dasha dvirajyevannadye prati tishthatyritubhirva esha chandobhi prishthaishcetavya
    ityahuryadetani havigmshi nirvapatyritubhirevaina prishthaishcinute dishah sushuvanena bhijitya ityahuryadetani
    havigmshi nirvapati dishamabhijitya etaya va indra ntasmadindrasava etaya manu nmanusavo yathendro
    devanam ya~tha manurmanushyanameva vi~dvanetayeshtya yajate digvatih puro 'nuvakya bhavanti sarvasa
    ndishamabhijityai || yah pranato nimishato mahitvaika idraja jagato babhuva | ya ishe asya dvipadashcatushpadah
    kasmai devaya havisha vidhema || upayamagrihito 'si prajapataye tva jushta ngrihnami tasya te dyaurmahima
    nakshatrani rupamadityaste tejastasmai tva mahimne prajapataye svaha yah pranato dyauradityo tmada
    balada yasya vishva upasate prashisham ya~sya devah | yasya chaya ya~sya mrityuh kasmai devaya havisha
    vidhema || upayamagrihito 'si prajapataye tva jushta ngrihnami tasya te prithivi mahimaushadhayo vanaspatayo
    rupamagniste tejastasmai tva mahimne prajapataye svaha tmadah prithivyagni rekannacatvarigmshat nbrahmano
    brahmavarcasi jayatama 'smi nrashtre rajanya ishavyah shuro maharatho jayata ndogdhridhenurvodha 'nadvanashu
    ssaptih purandhiryosha jishnu ratheshtha ssabheyo yuva ''sya yajamanasya viro jayata nnikamenikame
    nah parjanyo var shatu phalinyo na oshadhayah pacyantam yo~gakshemonah kalpatam || 'kran vaji prithivimagnim
    yu~jamakrita vajyarva ''kran vajyantariksham yu~jamakrita vajyarva dyam 'kraggsta suryam yu~jamakrita
    vajyarva 'gniste vajin yunnanu tva '' rabhe svasti ma sa mparaya vayuste vajin yunnanu tva '' rabhe
    svasti ma sa paraya ''dityaste mparaya ''dityaste vajin yunnanu tva '' rabhe svasti ma sa mparaya
    pranadhrigasi prana mme drigmha vyanadhrigasi vyana mme drigmha 'panadhrigasyapana mma drigmha cakshurasi
    cakshurmayi dhehi shrotramasi shrotra mmayi dhehyayurasyayurmayi dhehi || vayuste vajin yunnanu tva
    '' rabhe svasti ma sam shta parjanyah pakta sasyagm supippala oshadhaya ssvadhicaraneyagm supasadano
    ssvaddhyakshamantarikshagmsupavah pavamana shshivamasau tapan yathapurvamahoratre pancadashino strigmshino
    masah klipta ritavah shanta 'shtakapalah paushnashcaru raudrashcaruragnaye vaishvanaraya dvadashakapalo
    mrigakhare yadi na mpayo vayavya ajyabhagah || 'shtakapala indraya 'gmhomuca ekadashakapalo mitravarunabhya
    mpayasya vayosavitra agomugbhya ndhana marudbhya enomugbhyah saptakapalo vishve bhyo devebhya enomugbhyo
    dvadashakapalo 'numatyai caruragnaye vaishvanaraya dvadashakapalo dyavaprithivibhya tprithivyai samanamadyatha
    'gnih prithivya samanamadeva nnamantu vayave samanamadantarikshaya samanamadyatha vayurantarikshena
    suryaya samanamaddive samanamadyatha suryo diva candramase samanamannakshatrebhya ssamanamadyatha
    candrama nakshatrairvarunaya samanamadadbhya ssamne samanamadrice samanamadyatha samarca brahmane
    samanama tkshatraya samanamadyatha brahma kshatrena rajne samanama dvishe samanamadyatha raja visha
    rathaya ssavitah purvyaso 'renavo vitata antarikshe | tebhirno adya pathibhih sugebhi raksha ca no
    adhi ca deva bruhi || namo 'gnaye prithivikshite lokasprite lokamasmai yajamanaya dehi namo vayave
    'ntarikshakshite lokasprite lokamasmai yajamanaya dehi nama ssuryaya divikshite lokasprite lokamasmai
    yajamanaya dehi || yo va ashvasya meddhyasya shiro veda shir nmeddhyo bhavatyusha va ashvasya meddhyasya
    shira ssuryashcakshurvatah pranashcandrama ndishah pada avantaradishah par 'rdhamasah parvani masa
    va~thsara atma rashmayah kesha nakshatrani rupa ntaraka asthani nabho magmsanyoshadhayo lomani vanaspatayo
    vala agnirmukham vai~shvanaro vyattagm samudra udaramantariksha samudra udaramantariksha rdyavaprithivi
    andau grava shepa ssomo reto yajjanjabhyate tadvi dyotate yadvidhunute ta thstanayati yanmehati tadvar
    shati vagevasya vagaharva ashvasya jayamanasya mahima purasta mmahima pashcadanu jayata etau vai mahimana
    mbabhuvaturhayo devanavaha darva 'suran vaji gandharva thsamudro va ashvasya yonih samudro bandhuh
    || yo va ashvasyameddhyasya shirah rva ete devakritanca 'bhijitya ityahu yoni ssamudro bandhuh ||
    harih om || || krishna yajurvediya taittiriya samhitayam saptamakande pancamah prashna ssamaptah ||
    || iti taittiriyasamhita samapta ||
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां सप्तमकाण्डे पञ्चमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ गावो॒ वा ए॒त श्शृङ्गा॑णि नो जायन्ता॒ इति॒ कामे॑न॒ तासा॒ न्दश॒मासा॒ निष॑ण्णा॒ आस॒न्नथ॒ शृङ्गा
    ण्यजायन्त॒ ता उद॑तिष्ठ॒न्नरा॒थ्स्मेत्यथ॒ यासा॒ न्नरा॒थ्स्मेति॒ यासा॒ न्नरा॒थ्स्मेति॑ गोस॒त्रं मु॑प॒यन्त्यृ॑द्ध्नु॒वन्त्ये॒व
    तस्मा षि॑कौ॒ मासौ॒ पर्त्वा॑ चरति स॒त्राभि॑जित॒ग्ग्॒ह्य॑स्यै॒ तस्मा ञ्च॑ गृ॒हे क्रि॒यते॒ तदा॒प्त वाँ
    ए॒ते प्र प्ल॑वन्ते॒ ये सं॑ वँथ्स॒रमु॑प॒यन्ति॒ यो वै स॑मु॒द्रस्य॑ पा॒र न्न पश्य॑ति॒ न वै स तत॒ उदे॑ति
    सं यँद॑तिरा॒त्रौ य ए॒वं ऽतिरा॒त्रो॑ ऽसावुत्त॑रो॒ मनः॒ पूर्वो॒ वागुत्त॑रः प्रा॒णः पूर्वो॑ ऽपा॒न उत्त॑रः
    प्र॒रोध॑न॒ म्पूर्व॑ उ॒दय॑न॒मुत्त॑रो॒ ज्योति॑ष्टोमो वैश्वान॒रो॑ ऽतिरा॒त्रो भ॑वति॒ ज्योति॑रे॒व पु॒रस्ता
    द्दधते सुव॒र्गस्य॑ लो॒कस्या नु॑ख्यात्यै चतुर्वि॒ग्ं॒शः प्रा॑य॒णीयो॑ भवति॒ चतु॑र्विग्ंशति वँथ्स॒रः
    प्र॒यन्त॑ ए॒व सं॑ वँथ्स॒रे प्रति॑ तिष्ठन्ति॒ तस्य॒ त्रीणि॑ च श॒तानि॑ ष॒ष्टिश्च॑ स्तो॒त्रीया॒स्ताव॑ती
    वँथ्स॒रस्य॒ रात्र॑य उ॒भे ए॒व सं॑ स्थि॑त्या॒ अरि॑ष्ट्या॒ उत्त॑रै॒रहो॑भिश्चरन्ति षड॒हा भ॑वन्ति॒ ष वँथ्स॒र
