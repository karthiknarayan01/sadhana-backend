id: renukastotramshridharasvami
category: stotram
name:
  english: renukastotramshridharasvami
  devanagari: रेणुकास्तोत्रम्श्रीधरस्वामि
content:
  english: aho karmajalam phalam va tadiyam | na jaivam na shaivam jagannaiva mayam cidekasvarupam bhaje
    renukam tam || 4|| anekantikam sarvabhedatirupam tamo'jnanaduhkhatigam shuddharupam | sada'dhyatmavidyapradanaikashilam
    bhaje renukam muktisaukhyadhidevim || 5|| tritapaprashantyai samaradhyamanam sada jivaloke svasaukhyapradatrim
    | bhavombodhisetum cidanandakandam bhaje renukam jnanamudraikalakshyam || 6|| sada bhaktahritkaumudim
    bhadrabhadram sadonkaravacyam varenyam sharanyam | svabhaktartinasham shubhangam gunadhyam bhaje renukam
    bhaktasaukhyabdhirupam || 7|| sada bhaktavatsalyapurnam suramyam surendradibhih stuyamanam sushuktaih
    | sada bhaktavrindaishca samsevyamanam bhaje renukam bhaktabhagyam bhavanim || 8|| pathedyah sada
    bhaktiyuto vishuddhah svavarnashramacarato nityayuktah | sa muktah kriti renukayah prasadat sada rajate
    rajate lokapujya || 9|| iti shrimatparamahamsaparivrajakacaryasadgurubhagavata shridharasvamina viracitam
    shrirenukastotram sampurnam ||
  devanagari: अहो कर्मजालं फलं वा तदीयम् । न जैवं न शैवं जगन्नैव मायां चिदेकस्वरूपां भजे रेणुकां ताम्
    ॥ ४॥ अनेकान्तिकां सर्वभेदातिरूपां तमोऽज्ञानदुःखातिगां शुद्धरूपाम् । सदाऽध्यात्मविद्याप्रदानैकशीलं
    भजे रेणुकां मुक्तिसौख्याधिदेवीम् ॥ ५॥ त्रितापप्रशन्त्यै समाराध्यमानां सदा जीवलोके स्वसौख्यप्रदात्रीम्
    । भवोम्बोधिसेतुं चिदानन्दकन्दां भजे रेणुकां ज्ञानमुद्रैकलक्ष्याम् ॥ ६॥ सदा भक्तहृत्कौमुदीं भद्रभद्रां
    सदोङ्कारवाच्यां वरेण्यां शरण्याम् । स्वभक्तार्तिनाशां शुभाङ्गां गुणाढ्यां भजे रेणुकां भक्तसौख्याब्धिरूपाम्
    ॥ ७॥ सदा भक्तवात्सल्यपूर्णां सुरम्यां सुरेन्द्रादिभिः स्तूयमानां सुषूक्तैः । सदा भक्तवृन्दैश्च संसेव्यमानां
    भजे रेणुकां भक्तभाग्यां भवानीम् ॥ ८॥ पठेद्यः सदा भक्तियुतो विशुद्धः स्ववर्णाश्रमाचारतो नित्ययुक्तः
    । स मुक्तः कृती रेणुकायाः प्रसादात् सदा राजते राजते लोकपूज्या ॥ ९॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यसद्गुरुभगवता
    श्रीधरस्वामिना विरचितं श्रीरेणुकास्तोत्रं सम्पूर्णम् ॥
