id: shankaracaryastava
category: stotram
name:
  english: shankaracaryastava
  devanagari: शन्करचर्यस्तव
content:
  english: shrimajjagadgurushankarabhagavatpujyapadacaryastavah om shri gurubhyo namah | muda karena pustakam
    dadhanamisharupinam tatha'parena mudrikam namattamovinashinim | kusumbhavasasavritam vibhutibhasiphalakam
    nataghanashane ratam namami shankaram gurum || 1|| parasharatmajapriyam pavitritakshamatalam puranasaravedinam
    sanandanadisevitam | prasannavaktrapankajam prapannalokarakshakam prakashitadvitiyatattvamashrayami
    deshikam || 2|| sudhamshushekhararcakam sudhindrasevyapadukam sutadimohanashakam sushantidantidayakam
    | samastavedaparagam sahasrasuryabhasuram samahitakhilendriyam sada bhajami shankaram || 3|| yamindracakravartinam
    yamadiyogavedinam yatharthatattvabodhakam yamantakatmajarcakam | yameva muktikankshaya samashrayanti
    sajjana namamyaham sada gurum tameva shankarabhidham || 4|| svabalya eva nirbharam ya atmano dayalutam
    daridravipramandire suvarnavrishtimanayan | pradarshya vismayambudhau nyamajjayat saman janan sa eva
    shankarah sada jagadgururgatirmama || 5|| yadiyapunyajanmana prasiddhimapa kalati yadiyashishyatam
    vrajan sa totako'pi paprathe | ya eva sarvadehinam vimuktimargadarshako narakritim sadashivam tamashrayami
    sadgurum || 6|| sanatanasya vartmanah sadaiva palanaya yah caturdishasu sanmathan cakara lokavishrutan
    | vibhandakatmajashramadisusthaleshu pavanan tameva lokashankaram namami shankaram gurum || 7|| yadiyahastavarijatasupratishthita
    sati prasiddhasha
  devanagari: श्रीमज्जगद्गुरुशङ्करभगवत्पूज्यपादाचार्यस्तवः ॐ श्री गुरुभ्यो नमः । मुदा करेण पुस्तकं दधानमीशरूपिणं
    तथाऽपरेण मुद्रिकां नमत्तमोविनाशिनीम् । कुसुम्भवाससावृतं विभूतिभासिफालकं नताघनाशने रतं नमामि शङ्करं
    गुरुम् ॥ १॥ पराशरात्मजप्रियं पवित्रितक्षमातलं पुराणसारवेदिनं सनन्दनादिसेवितम् । प्रसन्नवक्त्रपङ्कजं
    प्रपन्नलोकरक्षकं प्रकाशिताद्वितीयतत्त्वमाश्रयामि देशिकम् ॥ २॥ सुधांशुशेखारार्चकं सुधीन्द्रसेव्यपादुकं
    सुतादिमोहनाशकं सुशान्तिदान्तिदायकम् । समस्तवेदपारगं सहस्रसूर्यभासुरं समाहिताखिलेन्द्रियं सदा भजामि
    शङ्करम् ॥ ३॥ यमीन्द्रचक्रवर्तिनं यमादियोगवेदिनं यथार्थतत्त्वबोधकं यमान्तकात्मजार्चकम् । यमेव मुक्तिकाङ्क्षया
    समाश्रयन्ति सज्जना नमाम्यहं सदा गुरुं तमेव शङ्कराभिधम् ॥ ४॥ स्वबाल्य एव निर्भरं य आत्मनो दयालुतां
    दरिद्रविप्रमन्दिरे सुवर्णवृष्टिमानयन् । प्रदर्श्य विस्मयाम्बुधौ न्यमज्जयत् समान् जनान् स एव शङ्करः
    सदा जगद्गुरुर्गतिर्मम ॥ ५॥ यदीयपुण्यजन्मना प्रसिद्धिमाप कालटी यदीयशिष्यतां व्रजन् स तोटकोऽपि पप्रथे
    । य एव सर्वदेहिनां विमुक्तिमार्गदर्शको नराकृतिं सदाशिवं तमाश्रयामि सद्गुरुम् ॥ ६॥ सनातनस्य वर्त्मनः
    सदैव पालनाय यः चतुर्दिशासु सन्मठान् चकार लोकविश्रुतान् । विभाण्डकात्मजाश्रमादिसुस्थलेषु पावनान् तमेव
    लोकशङ्करं नमामि शङ्करं गुरुम् ॥ ७॥ यदीयहस्तवारिजातसुप्रतिष्ठिता सती प्रसिद्धश
