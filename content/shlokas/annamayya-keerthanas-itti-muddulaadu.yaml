id: annamayya-keerthanas-itti-muddulaadu
category: stotram
name:
  english: Annamayya Keerthanas Itti Muddulaadu
content:
  english: eka pallavi itti mudduladi balu dedavadu vani batti tècci pòttaninda balu voyare || gamidai
    paritènci kagèdi vènnèlalona cema puvu kadiyala ceyi pètti | cima guttènani tana cèkkita ganniru jara
    vemaru vapoye vani vèddu vèttare || itti mudduladi balu dedavadu muccuvalè vacci tana munga muruvula
    ceyi taccèdi pèrugulona dagabètti | nòccènani ceyidisi nora nèlla jòllugara vòccèli vapovuvani nuradincare
    || itti mudduladi balu dedavadu èppudu vaccèno ma yillu còcci pèttèloni cèpparani vungarala ceyi pètti
    | appadaina venkatadri asavalakudu gana tappakunda bèttè itti mudduladi balu dedavadu vani batti tècci
    pòttaninda balu voyare ||
  devanagari: एक पल्लवि इट्टि मुद्दुलाडि बालु डेडवाडु वानि बट्टि तॆच्चि पॊट्टनिण्ड बालु वोयरे ॥ गामिडै
    पारितॆञ्चि कागॆडि वॆन्नॆललोन चेम पूवु कडियाल चेयि पॆट्टि । चीम गुट्टॆननि तन चॆक्किट गन्नीरु जार वेमरु
    वापोये वानि वॆड्डु वॆट्टरे ॥ इट्टि मुद्दुलाडि बालु डेडवाडु मुच्चुवलॆ वच्चि तन मुङ्ग मुरुवुल चेयि तच्चॆडि
    पॆरुगुलोन दगबॆट्टि । नॊच्चॆननि चेयिदीसि नोर नॆल्ल जॊल्लुगार वॊच्चॆलि वापोवुवानि नूरडिञ्चरे ॥ इट्टि
    मुद्दुलाडि बालु डेडवाडु ऎप्पुडु वच्चॆनो मा यिल्लु चॊच्चि पॆट्टॆलोनि चॆप्परानि वुङ्गराल चेयि पॆट्टि
    । अप्पडैन वेङ्कटाद्रि असवालकुडु गान तप्पकुण्ड बॆट्टॆ इट्टि मुद्दुलाडि बालु डेडवाडु वानि बट्टि तॆच्चि
    पॊट्टनिण्ड बालु वोयरे ॥
