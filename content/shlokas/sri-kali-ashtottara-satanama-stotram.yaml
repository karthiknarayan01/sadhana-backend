id: sri-kali-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Kali Ashtottara Satanama Stotram
content:
  english: bhairava uvaca shatanama pravakshyami kalikaya varanane | yasya prapathanadvagmi sarvatra vijayi
    bhavet || || kali kapalini kanta kamada kamasundari | kalaratrih kalika ca kalabhairavapujita || ||
    kurukulla kamini ca kamaniyasvabhavini | kulina kulakartri ca kulavartmaprakashini || || kasturirasanila
    ca kamya kamasvarupini | kakaravarnanilaya kamadhenuh karalika || || kulakanta karalasya kamarta ca
    kalavati | krishodari ca kamakhya kaumari kulapalini || || kulaja kulakanya ca kulaha kulapujita |
    kameshvari kamakanta kunjareshvaragamini || || kamadatri kamahartri krishna caiva kapardini | kumuda
    krishnadeha ca kalindi kulapujita || || kashyapi krishnamata ca kulishangi kala tatha | krim rupa
    kulagamya ca kamala krishnapujita || || krishangi kinnari kartri kalakanthi ca kartiki | kambukanthi
    kaulini ca kumuda kamajivini || || kulastri kirtika kritya kirtishca kulapalika | kamadevakala kalpalata
    kamangavardhini || || kunta ca kumudaprita kadambakusumotsuka | kadambini kamalini krishnanandapradayini
    || || kumaripujanarata kumariganashobhita | kumariranjanarata kumarivratadharini || || kankali kamaniya
    ca kamashastravisharada | kapalakhatvangadhara kalabhairavarupini || || kotari kotarakshi ca kashikailasavasini
    | katyayani karyakari kavyashastrapramodini || || kamakarshanarupa ca kamapithanivasini | kankini
    kakini krida kutsita kalahapriya || || kundagolodbhavaprana kaushiki kirtivardhini | kumbhastani kataksha
    ca kavya kokanadapriya || || kantaravasini kantih kathina krishnavallabha | iti te kathitam devi guhyadguhyataram
    param || || prapathedya idam nityam kalinamashatashtakam | trishu lokeshu deveshi tasya'sadhyam na
    vidyate || || pratahkale ca madhyahne sayahne ca sada nishi | yah pathetparaya bhaktya kalinamashatashtakam
    || || kalika tasya gehe ca samsthanam kurute sada | shunyagare shmashane va prantare jalamadhyatah
    || || vahnimadhye ca sangrame tatha pranasya samshaye | shatashtakam japanmantri labhate kshemamuttamam
    || || kalim samsthapya vidhivat stutva namashatashtakaih | sadhakah siddhimapnoti kalikayah prasadatah
    || || iti shri kali kakarashtottarashatanama stotram |
  devanagari: भैरव उवाच शतनाम प्रवक्ष्यामि कालिकाया वरानने । यस्य प्रपठनाद्वाग्मी सर्वत्र विजयी भवेत्
    ॥ ॥ काली कपालिनी कान्ता कामदा कामसुन्दरी । कालरात्रिः कालिका च कालभैरवपूजिता ॥ ॥ कुरुकुल्ला कामिनी
    च कमनीयस्वभाविनी । कुलीना कुलकर्त्री च कुलवर्त्मप्रकाशिनी ॥ ॥ कस्तूरीरसनीला च काम्या कामस्वरूपिणी
    । ककारवर्णनिलया कामधेनुः करालिका ॥ ॥ कुलकान्ता करालास्या कामार्ता च कलावती । कृशोदरी च कामाख्या कौमारी
    कुलपालिनी ॥ ॥ कुलजा कुलकन्या च कुलहा कुलपूजिता । कामेश्वरी कामकान्ता कुञ्जरेश्वरगामिनी ॥ ॥ कामदात्री
    कामहर्त्री कृष्णा चैव कपर्दिनी । कुमुदा कृष्णदेहा च कालिन्दी कुलपूजिता ॥ ॥ काश्यपी कृष्णमाता च कुलिशाङ्गी
    कला तथा । क्रीं रूपा कुलगम्या च कमला कृष्णपूजिता ॥ ॥ कृशाङ्गी किन्नरी कर्त्री कलकण्ठी च कार्तिकी ।
    कम्बुकण्ठी कौलिनी च कुमुदा कामजीविनी ॥ ॥ कुलस्त्री कीर्तिका कृत्या कीर्तिश्च कुलपालिका । कामदेवकला
    कल्पलता कामाङ्गवर्धिनी ॥ ॥ कुन्ता च कुमुदप्रीता कदम्बकुसुमोत्सुका । कादम्बिनी कमलिनी कृष्णानन्दप्रदायिनी
    ॥ ॥ कुमारीपूजनरता कुमारीगणशोभिता । कुमारीरञ्जनरता कुमारीव्रतधारिणी ॥ ॥ कङ्काली कमनीया च कामशास्त्रविशारदा
    । कपालखट्वाङ्गधरा कालभैरवरूपिणी ॥ ॥ कोटरी कोटराक्षी च काशीकैलासवासिनी । कात्यायनी कार्यकरी काव्यशास्त्रप्रमोदिनी
    ॥ ॥ कामाकर्षणरूपा च कामपीठनिवासिनी । कङ्किनी काकिनी क्रीडा कुत्सिता कलहप्रिया ॥ ॥ कुण्डगोलोद्भवप्राणा
    कौशिकी कीर्तिवर्धिनी । कुम्भस्तनी कटाक्षा च काव्या कोकनदप्रिया ॥ ॥ कान्तारवासिनी कान्तिः कठिना कृष्णवल्लभा
    । इति ते कथितं देवि गुह्याद्गुह्यतरं परम् ॥ ॥ प्रपठेद्य इदं नित्यं कालीनामशताष्टकम् । त्रिषु लोकेषु
    देवेशि तस्याऽसाध्यं न विद्यते ॥ ॥ प्रातःकाले च मध्याह्ने सायाह्ने च सदा निशि । यः पठेत्परया भक्त्या
    कालीनामशताष्टकम् ॥ ॥ कालिका तस्य गेहे च संस्थानं कुरुते सदा । शून्यागारे श्मशाने वा प्रान्तरे जलमध्यतः
    ॥ ॥ वह्निमध्ये च सङ्ग्रामे तथा प्राणस्य संशये । शताष्टकं जपन्मन्त्री लभते क्षेममुत्तमम् ॥ ॥ कालीं
    संस्थाप्य विधिवत् स्तुत्वा नामशताष्टकैः । साधकः सिद्धिमाप्नोति कालिकायाः प्रसादतः ॥ ॥ इति श्री काली
    ककाराष्टोत्तरशतनाम स्तोत्रम् ।
