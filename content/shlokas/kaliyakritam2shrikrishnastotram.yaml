id: kaliyakritam2shrikrishnastotram
category: stotram
name:
  english: kaliyakritam2shrikrishnastotram
  devanagari: कालियकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: kaliyakritam 2 shrikrishnastotram kaliyauvaca | yasmadbrahma ca rudrashva candrendramaruto'shvinau
    | vasavashva sahadityaistasya stoshyami kim nvaham || 5
  devanagari: कालियकृतं २ श्रीकृष्णस्तोत्रम् कालियउवाच । यस्माद्ब्रह्मा च रुद्रश्व चन्द्रेन्द्रमरुतोऽश्विनौ
    । वसवश्व सहादित्यैस्तस्य स्तोष्यामि किं न्वहम् ॥ ५
meaning: {}
