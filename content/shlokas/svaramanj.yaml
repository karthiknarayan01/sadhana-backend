id: svaramanj
category: veda
name:
  english: svaramanj
  devanagari: स्वरमन्ज्
content:
  english: sthanavashannityam shabdanamuccanicata | udattanugunashcartho darshaniya iti sthitih || 88||
    sthanarthayorabhede tu shabdasya sadrishah svarah | yada na tam svaram pashyedanyathartham tada nayet
    || 89|| evam pade samase va yatrodatto vyavasthitah | tatparyam tatra shabdasya sthapayediti nirnayah
    || 90|| andhakare ca dipena gacchanna sskhalati kvacit | svaraprakashitashcaivam vedarthe na pramadyati
    || 91||
  devanagari: स्थानवशान्नित्यं शब्दानामुच्चनीचता । उदात्तानुगुणश्चार्थो दर्शनीय इति स्थितिः ॥ ८८॥ स्थानार्थयोरभेदे
    तु शब्दस्य सदृशः स्वरः । यदा न तं स्वरं पश्येदन्यथार्थं तदा नयेत् ॥ ८९॥ एवं पदे समासे वा यत्रोदात्तो
    व्यवस्थितः । तात्पर्यं तत्र शब्दस्य स्थापयेदिति निर्णयः ॥ ९०॥ अन्धकारे च दीपेन गच्छन्न स्स्खलति क्वचित्
    । स्वरप्रकाशितश्चैवं वेदार्थे न प्रमाद्यति ॥ ९१॥
meaning: {}
