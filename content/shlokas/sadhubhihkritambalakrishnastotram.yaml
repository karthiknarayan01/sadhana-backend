id: sadhubhihkritambalakrishnastotram
category: stotram
name:
  english: sadhubhihkritambalakrishnastotram
  devanagari: साधुभिःकृतंबालकृष्णस्तोत्रम्
content:
  english: '|| 41|| evam ratanti nityam tam paramesham hi sadhavah | tesham satsangalabhena purusharthacatushtayam
    || 42|| namastebhyah samastebhyah sadhubhyo''stu muhurmuhuh | namah sadhusvarupaya shrikrishnasvamine
    namah || 43|| namah sarvadhipataye sarvapurvaya cakrine | namo''vatarapujyaya srishtinam prabhave
    namah || 44|| jnananam prabhave tasmai karmanam prabhave namah | ishvaranam prashastre ca devanam
    prabhave namah || 45|| rishinam ca grahanam ca rikshanam prabhave namah | vidyutam taijasanam ca meghanam
    prabhave namah || 46|| varshanam ca bhudharanam nadinam prabhave namah | sarvaushadhinam bhakshyanam
    triptinam prabhave namah || 47|| namo dharmadirupanam janayitre paratmane | tasmai rasanam prabhave
    ratnanam prabhave namah || 48|| ritvadinam prabhave ca vartanam prabhave namah | vishvanam prabhave
    sarvavidyanam prabhave namah || 49|| vratanam prabhave tasmai mantranam prabhave namah | siddhinam
    prabhave sarvaujasam ca prabhave namah || 50|| lakshminam pataye tasmai shrisvamine namo namah | namastasmai
    varadaya prajeshaya mahatmane || 51|| anave mahate tasmai sarvagaya namo namah | namo yajnasvarupaya
    namah pujatmakaya ca || 52|| namah shastrastradharaya madhavishtaya te namah | namastirthaya devaya
    vedishilaya te namah || 53|| namo viryaya kamaya sadanandaya te namah | namah shribalakrishnaya''bhayadanaya
    te namah || 54|| varadaya varenyaya namaste''pratimaya ca | havyakavyadirupaya medhyaya vishnave namah
    || 55|| panktipavanarupaya narayanaya te namah | namah shuddhaya buddhaya sarvanetraya te namah ||
    56|| drishyadrishyasvarupaya dampatirupine namah | tyagine ca suvarnaya saumyarupaya te namah || 57||
    namah kantaya shrishaya vallabharyaya te namah | vatsalayopajivyaya mrityughnaya ca te namah || 58||
    aprameyaya brihate kulalaya namo namah | rakshoghnaya vishaghnaya bhaktavedyaya te namah || 59|| nirvisheshaya
    hridyaya mokshadaya ca te namah | namo gopalabalaya kambharashribhavaya ca || 60|| kamadaya ca yuvatisevitaya
    namo namah | namo vriddhativriddhaya puranaya ca te namah || 61|| lokadhatri tviyam bhumirmurtirdivya
    hi te mata | dyauh sarvam mastakam yasya patalam padasamjnitam || 62|| srishtayashcodare yasya tasmai
    krishnaya te namah | anadishrikrishnanarayanaya paramatmane || 63|| kunkumavapikakshetravasabalaya
    te namah | sarvahritsu nivasaya''ntaryamine ca te namah || 64|| narayanastavenaivam ye stuvantyatmanam
    patim | sha'
  devanagari: ॥ ४१॥ एवं रटन्ति नित्यं तं परमेशं हि साधवः । तेषां सत्सङ्गलाभेन पुरुषार्थचतुष्टयम् ॥ ४२॥
    नमस्तेभ्यः समस्तेभ्यः साधुभ्योऽस्तु मुहुर्मुहुः । नमः साधुस्वरूपाय श्रीकृष्णस्वामिने नमः ॥ ४३॥ नमः
    सर्वाधिपतये सर्वपूर्वाय चक्रिणे । नमोऽवतारपूज्याय सृष्टीनां प्रभवे नमः ॥ ४४॥ ज्ञानानां प्रभवे तस्मै
    कर्मणां प्रभवे नमः । ईश्वराणां प्रशास्त्रे च देवानां प्रभवे नमः ॥ ४५॥ ऋषीणां च ग्रहाणां च ऋक्षाणां
    प्रभवे नमः । विद्युतां तैजसानां च मेघानां प्रभवे नमः ॥ ४६॥ वर्षाणां च भूधराणां नदीनां प्रभवे नमः ।
    सर्वौषधीनां भक्ष्याणां तृप्तीनां प्रभवे नमः ॥ ४७॥ नमो धर्मादिरूपाणां जनयित्रे परात्मने । तस्मै रसानां
    प्रभवे रत्नानां प्रभवे नमः ॥ ४८॥ ऋत्वादीनां प्रभवे च वार्तानां प्रभवे नमः । विश्वानां प्रभवे सर्वविद्यानां
    प्रभवे नमः ॥ ४९॥ व्रतानां प्रभवे तस्मै मन्त्राणां प्रभवे नमः । सिद्धीनां प्रभवे सर्वौजसां च प्रभवे
    नमः ॥ ५०॥ लक्ष्मीनां पतये तस्मै श्रीस्वामिने नमो नमः । नमस्तस्मै वरदाय प्रजेशाय महात्मने ॥ ५१॥ अणवे
    महते तस्मै सर्वगाय नमो नमः । नमो यज्ञस्वरूपाय नमः पूजात्मकाय च ॥ ५२॥ नमः शस्त्रास्त्रधाराय माधवीष्टाय
    ते नमः । नमस्तीर्थाय देवाय वेदिशीलाय ते नमः ॥ ५३॥ नमो वीर्याय कामाय सदानन्दाय ते नमः । नमः श्रीबालकृष्णायाऽभयदानाय
    ते नमः ॥ ५४॥ वरदाय वरेण्याय नमस्तेऽप्रतिमाय च । हव्यकव्यादिरूपाय मेध्याय विष्णवे नमः ॥ ५५॥ पङ्क्तिपावनरूपाय
    नारायणाय ते नमः । नमः शुद्धाय बुद्धाय सर्वनेत्राय ते नमः ॥ ५६॥ दृश्यादृश्यस्वरूपाय दम्पतीरूपिणे नमः
    । त्यागिने च सुवर्णाय सौम्यरूपाय ते नमः ॥ ५७॥ नमः कान्ताय श्रीशाय वल्लभार्याय ते नमः । वत्सलायोपजीव्याय
    मृत्युघ्नाय च ते नमः ॥ ५८॥ अप्रमेयाय बृहते कुलालाय नमो नमः । रक्षोघ्नाय विषघ्नाय भक्तवेद्याय ते नमः
    ॥ ५९॥ निर्विशेषाय हृद्याय मोक्षदाय च ते नमः । नमो गोपालबालाय कम्भराश्रीभवाय च ॥ ६०॥ कामदाय च युवतीसेविताय
    नमो नमः । नमो वृद्धातिवृद्धाय पुराणाय च ते नमः ॥ ६१॥ लोकधात्री त्वियं भूमिर्मूर्तिर्दिव्या हि ते मता
    । द्यौः सर्वं मस्तकं यस्य पातालं पादसंज्ञितम् ॥ ६२॥ सृष्टयश्चोदरे यस्य तस्मै कृष्णाय ते नमः । अनादिश्रीकृष्णनारायणाय
    परमात्मने ॥ ६३॥ कुङ्कुमवापिकाक्षेत्रवासबालाय ते नमः । सर्वहृत्सु निवासायाऽन्तर्यामिणे च ते नमः ॥ ६४॥
    नारायणस्तवेनैवं ये स्तुवन्त्यात्मनां पतिम् । श
