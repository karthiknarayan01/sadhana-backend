id: mahaganapatikavacam
category: kavacha
name:
  english: mahaganapatikavacam
  devanagari: महागणपतिकवचम्
content:
  english: indro'maravatim labdhva pathanat kavacasya tu | devanamadhipatyam vai tathavapa maheshvari
    || 22|| srishtim vitanute brahma sthitim vitanute harih | samharam tanute rudro'pyahameva na samshayah
    || 23|| bhajedvilirupa kavacam dharayedbhaktitah param | yam yam cintayate loke tam tam prapnoti sarvada
    || 24|| gandharvo gayate dhirah sarvalokavashankarah | kamatulyo'pi narinam yogi yogapatiryatha ||
    25|| na deyam parashishyebhyo deyam shishyebhya eva ca | aprashishyaya dushtaya kritaghnaya duratmane
    || 26|| bhaktishraddhavihinaya paranindaparaya ca | yo dadati nishiddhebhyo kavacam paramadbhutam
    || 27|| tasya nashyanti deveshi putrayuhkirtisampadah | shishyaya bhaktiyuktaya gurubhaktirataya ca
    || 28|| shantaya vishnubhaktaya shivapujaparaya ca | devyarcanaparayasmai svajanaya mahatmane || 29||
    dadati cedyat kavacam shighrasiddhipradam bhavet | etat kavacamajnatva yo japecca ganadhipam || 30||
    daridram paramam labdhva so'ciranmrityumapnuyat |
  devanagari: इन्द्रोऽमरावतीं लब्ध्वा पठनात् कवचस्य तु । देवनामाधिपत्यं वै तथावाप महेश्वरि ॥ २२॥ सृष्टिं
    वितनुते ब्रह्मा स्थितिं वितनुते हरिः । संहारं तनुते रुद्रोऽप्यहमेव न संशयः ॥ २३॥ भजेद्विलिरूप कवचं
    धारयेद्भक्तितः परम् । यं यं चिन्तयते लोके तं तं प्राप्नोति सर्वदा ॥ २४॥ गन्धर्वो गायते धीरः सर्वलोकवशङ्करः
    । कामतुल्योऽपि नारीणां योगी योगपतिर्यथा ॥ २५॥ न देयं परशिष्येभ्यो देयं शिष्येभ्य एव च । अप्रशिष्याय
    दुष्टाय कृतघ्नाय दुरात्मने ॥ २६॥ भक्तिश्रद्धाविहीनाय परनिन्दापराय च । यो ददाति निषिद्धेभ्यो कवचं परमाद्भुतम्
    ॥ २७॥ तस्य नश्यन्ति देवेशि पुत्रायुःकीर्तिसम्पदः । शिष्याय भक्तियुक्ताय गुरुभक्तिरताय च ॥ २८॥ शान्ताय
    विष्णुभक्ताय शिवपूजापराय च । देव्यर्चनपरायास्मै स्वजनाय महात्मने ॥ २९॥ ददाति चेद्यत् कवचं शीघ्रसिद्धिप्रदं
    भवेत् । एतत् कवचमज्ञात्वा यो जपेच्च गणाधिपम् ॥ ३०॥ दारिद्रं परमं लब्ध्वा सोऽचिरान्मृत्युमाप्नुयात्
    ।
