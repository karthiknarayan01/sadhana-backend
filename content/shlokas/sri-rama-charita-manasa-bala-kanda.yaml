    प्रभु कौतुकी प्रनत हितकारी ॥ सेवत सुलभ सकल दुख हारी ॥ सो सुर नर मुनि कौ नाहिं जेहि न मोह माया प्रबल
    ॥ अस बिचारि मन माहिं भजिअ महामाया पतिहि ॥ ॥ अपर हेतु सुनु सैलकुमारी। कहुँ बिचित्र कथा बिस्तारी ॥ जेहि
    कारन अज अगुन अरूपा। ब्रह्म भयु कोसलपुर भूपा ॥ जो प्रभु बिपिन फिरत तुम्ह देखा। बन्धु समेत धरें मुनिबेषा
    ॥ जासु चरित अवलोकि भवानी। सती सरीर रहिहु बौरानी ॥ अजहुँ न छाया मिटति तुम्हारी। तासु चरित सुनु भ्रम
    रुज हारी ॥ लीला कीन्हि जो तेहिं अवतारा। सो सब कहिहुँ मति अनुसारा ॥ भरद्वाज सुनि सङ्कर बानी। सकुचि
