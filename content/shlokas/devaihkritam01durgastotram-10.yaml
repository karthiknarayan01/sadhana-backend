id: devaihkritam01durgastotram-10
category: stotram
name:
  english: devaihkritam01durgastotram 10
  devanagari: देवैःकृतं०१दुर्गास्तोत्रम् १०
content:
  english: devaih kritam 1 durgastotram 10 amarapatimukutacumbitacaranambujasakalabhuvanasukhajanani |
    jayati jagadishavandita sakalamalanishkala durga || 11|| vikritanakhadashanabhushanarudhiravashacchuritakshatakhadgahasta
    | jayati naramundamuditapishitasuraharakriccandi || 12|| pracchaditashikhiganodbalavikatajatabaddhacandramanishobha
    | jayati digambarabhusha siddhavatesha mahalakshmih || 13|| karakamalajanitashobha padmasanabaddhapadmavadana
    ca | jayati kamandaluhasta nandadevi natartihara || 14|| digvasana vikritamukha phetkaroddamapuritadishaugha
    | jayati vikaraladeha kshemankari raudrabhavastha || 15|| kroshitabrahmandodarasuravaramukharahunkritaninada
    | jayati madatimihasta shivaduti prathamashivashaktih || 16|| muktattahasabhairavaduhsahataracakitasakaladikcakra
    | jayati bhujagendramanishobhitakarna mahatunda || 17|| patupatahamurajamardalajhallarijhankaranartitavayava
    | jayati madhuvratarupa daityahari bhramaridevi || 18|| shanta prashantavadana simhavara dhyanayogatannishtha
    | jayati caturbhujadeha candrakala candramandala devi || 19|| pakshaputacancughataih sancurnitavividhashatrusanghata
    | jayati shitashulahasta bahurupa revati bhadra || 20|| paryatati jagati hrishta pitrivananilayeshu
    yoginisahita | jayati harasiddhinamni harasiddhirvandita siddhaih || 21|| iti bhavishyapurane uttaraparvani
    ekashashtitamadhyayantargatam devaih kritam durgastotram samaptam | bhavishyapurana | uttarabhaga
    | adhyaya 61
  devanagari: देवैः कृतं १ दुर्गास्तोत्रम् १० अमरपतिमुकुटचुम्बितचरणाम्बुजसकलभुवनसुखजननी । जयति जगदीशवन्दिता
    सकलामलनिष्कला दुर्गा ॥ ११॥ विकृतनखदशनभूषणरुधिरवशाच्छुरितक्षतखड्गहस्ता । जयति नरमुण्डमुडितपिशितसुराहारकृच्चण्डी
    ॥ १२॥ प्रच्छादितशिखिगणोद्बलविकटजटाबद्धचन्द्रमणिशोभा । जयति दिगम्बरभूषा सिद्धवटेशा महालक्ष्मीः ॥ १३॥
    करकमलजनितशोभा पद्मासनबद्धपद्मवदना च । जयति कमण्डलुहस्ता नन्दादेवी नतार्तिहरा ॥ १४॥ दिग्वसना विकृतमुखा
    फेत्कारोद्दामपूरितदिशौघा । जयति विकरालदेहा क्षेमङ्करी रौद्रभावस्था ॥ १५॥ क्रोशितब्रह्माण्डोदरसुरवरमुखरहुङ्कृतनिनादा
    । जयति मदातिमिहस्ता शिवदूती प्रथमशिवशक्तिः ॥ १६॥ मुक्ताट्टहासभैरवदुःसहतरचकितसकलदिक्चक्रा । जयति भुजगेन्द्रमणिशोभितकर्णा
    महातुण्डा ॥ १७॥ पटुपटहमुरजमर्दलझल्लरिझङ्कारनर्तितावयवा । जयति मधुव्रतरूपा दैत्यहरी भ्रामरीदेवी ॥ १८॥
    शान्ता प्रशान्तवदना सिंहवरा ध्यानयोगतन्निष्ठा । जयति चतुर्भुजदेहा चन्द्रकला चन्द्रमण्डला देवी ॥ १९॥
    पक्षपुटचञ्चुघातैः सञ्चूर्णितविविधशत्रुसङ्घाता । जयति शितशूलहस्ता बहुरूपा रेवती भद्रा ॥ २०॥ पर्यटति
    जगति हृष्टा पितृवननिलयेषु योगिनीसहिता । जयति हरसिद्धिनाम्नी हरसिद्धिर्वन्दिता सिद्धैः ॥ २१॥ इति भविष्यपुराणे
    उत्तरपर्वणि एकषष्टितमाध्यायान्तर्गतं देवैः कृतं दुर्गास्तोत्रं समाप्तम् । भविष्यपुराण । उत्तरभाग ।
    अध्याय ६१
