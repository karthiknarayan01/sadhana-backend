id: annamayya-keerthanas-siruta-navvulavaadu
category: stotram
name:
  english: Annamayya Keerthanas Siruta Navvulavaadu
content:
  english: adi pallavi siruta navvulavadu sinnèka vidu vèrapèrugadu sudave sinnèka || pòlasu menivadu
    boravipu vadu sèlasu moravadu sinnèka | gòlusula vankala koralatobumi vèlisinadu sudave sinnèka ||
    siruta navvulavadu sinnèka vidu meti kurucavadu mèdamidi gòddali sitakalavadu sinnèka | atadanibasi
    adavilo rakashi vetaladi judave sinnèka || siruta navvulavadu sinnèka vidu binkapu motala pillagovivadu
    sinka supulavadu sinnèka | kònkaka kalikiyai kòsari kudè nannu venkateshudu sudave sinnèka || siruta
    navvulavadu sinnèka vidu vèrapèrugadu sudave sinnèka ||
  devanagari: आदि पल्लवि सिरुत नव्वुलवाडु सिन्नॆका वीडु वॆरपॆरुगडु सूडवे सिन्नॆका ॥ पॊलसु मेनिवाडु बोरवीपु
    वाडु सॆलसु मोरवाडु सिन्नॆका । गॊलुसुल वङ्कल कोरलतोबूमि वॆलिसिनाडु सूडवे सिन्नॆका ॥ सिरुत नव्वुलवाडु
    सिन्नॆका वीडु मेटि कुरुचवाडु मॆडमीदि गॊड्डलि सीटकालवाडु सिन्नॆका । आटदानिबासि अडविलो राकाशि वेटलाडी
    जूडवे सिन्नॆका ॥ सिरुत नव्वुलवाडु सिन्नॆका वीडु बिङ्कपु मोतल पिल्लगोविवाडु सिङ्क सूपुलवाडु सिन्नॆका
    । कॊङ्कक कलिकियै कॊसरि कूडॆ नन्नु वेङ्कटेशुडु सूडवे सिन्नॆका ॥ सिरुत नव्वुलवाडु सिन्नॆका वीडु वॆरपॆरुगडु
    सूडवे सिन्नॆका ॥
