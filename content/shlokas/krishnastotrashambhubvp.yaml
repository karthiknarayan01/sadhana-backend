id: krishnastotrashambhubvp
category: stotram
name:
  english: krishnastotrashambhuBVP
  devanagari: क्रिश्नस्तोत्रशम्भुBVP
content:
  english: shrikrishnastotram brahmavaivartapurane shambhukritam mahadeva uvaca | jayasvarupam jayadam
    jayesham jayakaranam | pravaram jayadanam ca vande tamaparajitam || 1|| vishvam vishveshvaresham ca
    vishvesham vishvakaranam | vishvadharam ca vishvastham vishvakaranakaranam || 2|| vishvarakshakaranam
    ca vishvaghnam vishvajam param | phalabijam phaladharam phalam ca tatphalapradam || 3|| tejahsvarupam
    tejodam sarvatejasvinam varam | ityevamuktva tam natva ratnasimhasane vare | narayanam ca sambhashya
    uvasa sa tadajnaya || 4|| iti shambhukritam stotram yo janah samyatah pathet | sarvasiddhirbhavettasya
    vijayam ca pade pade || 5|| samtatam vardhate mitram dhanamaishvaryameva ca | shatrusainyam kshayam
    yati duhkhani duritani ca || 6|| iti brahmavaivarte shambhukritam shrikrishnastotram |
  devanagari: श्रीकृष्णस्तोत्रं ब्रह्मवैवर्तपुराणे शम्भुकृतम् महादेव उवाच । जयस्वरुपं जयदं जयेशं जयकारणम्
    । प्रवरं जयदानां च वन्दे तमपराजितम् ॥ १॥ विश्वं विश्वेश्वरेशं च विश्वेशं विश्वकारणम् । विश्वाधारं
    च विश्वस्थं विश्वकारणकारणम् ॥ २॥ विश्वरक्षाकारणं च विश्वघ्नं विश्वजं परम् । फलबीजं फलाधारं फलं च तत्फलप्रदम्
    ॥ ३॥ तेजःस्वरुपं तेजोदं सर्वतेजस्विनां वरम् । इत्येवमुक्त्वा तं नत्वा रत्नसिंहासने वरे । नारायणं च
    संभाष्य उवास स तदाज्ञया ॥ ४॥ इति शंभुकृतं स्तोत्रं यो जनः संयतः पठेत् । सर्वसिद्धिर्भवेत्तस्य विजयं
    च पदे पदे ॥ ५॥ संततं वर्धते मित्रं धनमैश्वर्यमेव च । शत्रुसैन्यं क्षयं याति दुःखानि दुरितानि च ॥ ६॥
    इति ब्रह्मावैवर्ते शम्भुकृतं श्रीकृष्णस्तोत्रम् ।
