id: devaihkritampurushottamastotram-08
category: stotram
name:
  english: devaihkritampurushottamastotram 08
  devanagari: देवैःकृतंपुरुषोत्तमस्तोत्रम् ०८
content:
  english: 30|| tada jatashcatha devah svaguroh sharanam yayuh | sadaspatirdevagurushca'staunmam parameshvaram
    || 31|| candrasya rakshanarthaya lokarakshanahetave | namo devadhidevaya suryacandrapracakshushe ||
    32|| sarvantaryamine rakshakaraya paramatmane | purushottamasamjnaya sudhapradaya sharngine || 33||
    grahanakshatrataranam bhaskaraya mahatmane | namashcantaravedyaya ca'bhaktakshayakarine || 34|| samayahi
    hare shighram raksham tvam shashinah kuru | mahadevo dhyanamagnashcirakari virajate || 35|| shighram
    dhumradraksha muktapate shriparameshvara | stutashcaivam tada caham narayanishri
  devanagari: ३०॥ तदा जाताश्चाथ देवाः स्वगुरोः शरणं ययुः । सदस्पतिर्देवगुरुश्चाऽस्तौन्मां परमेश्वरम् ॥
    ३१॥ चन्द्रस्य रक्षणार्थाय लोकरक्षणहेतवे । नमो देवाधिदेवाय सूर्यचन्द्रप्रचक्षुषे ॥ ३२॥ सर्वान्तर्यामिणे
    रक्षाकराय परमात्मने । पुरुषोत्तमसंज्ञाय सुधाप्रदाय शार्ङ्गिणे ॥ ३३॥ ग्रहनक्षत्रताराणां भास्कराय महात्मने
    । नमश्चान्तरवेद्याय चाऽभक्तक्षयकारिणे ॥ ३४॥ समायाहि हरे शीघ्रं रक्षां त्वं शशिनः कुरु । महादेवो ध्यानमग्नश्चिरकारी
    विराजते ॥ ३५॥ शीघ्रं धूम्राद्रक्ष मुक्तपते श्रीपरमेश्वर । स्तुतश्चैवं तदा चाहं नारायणीश्रि
meaning: {}
