    पुरुषः द्वितीयान्तरिक्षं स उकारः सयजुर्भिर्यजुर्वेदो विष्णुरुद्रात्रिष्टुप् दक्षिणाग्निः स्व प्रस्थानोन्तः
    प्रज्ञः सप्ताङ्गएकोनविंशतिमुखः प्रविविक्तमुक्तैजसो द्वितीयः पादः । उं ज्वलन्तं सर्वतोमुखं ॐ ह्रीं
    घृणिः सूर्यादित्यः श्रीं उं कृष्णवर्णाय प्रियात्मने शिरसे स्वाहा ॥ ततस्तृतीयं पादं प्रगाय नृसिंहं
    भीषणं भद्रं ॐ भूरित्यादि यजुर्लक्ष्मीं पठित्वा वसुरादित्यैः सर्वैर्देवैः सेवितं दिवं य ओषधीनां प्रभवति
    तारापतिः सोमः तृतीया द्यौः समकारः स सामभिः सामवेदो रुद्रादित्याः जगत्याहवनीयः यत्र सुप्तोनकञ्चनकामं
    कामयते न कञ्चन स्व प्रपश्यति तत्सुषुप्तं सुषुप्तस्थानएकीभूतः प्रज्ञानघन एवानन्दमयो स्वानन्दभुक् चेतोमुखः
    प्राज्ञस्तृतीयः पादः एष सर्वेश्वर एष सर्वज्ञ एषोतर्याम्येषयोनिः सर्वस्य प्रभावाप्ययौ हि भूतानाम् ।
    मं नृसिंहं भीषणं भद्रं ॐ भूर्लक्ष्मीः भुवर्लक्ष्मीः सुवः कालकर्ण कालकर्ण । तन्नो महालक्ष्मीः प्रचोदयात्
    । मं पिङ्गलवर्णाय ज्योतिरात्मने शिखायै वषट् ॥ ततश्चतुर्थपादं प्रगाय । मृत्युमृत्युं नमाम्यहं नृसिंहगायत्रीं
    च प्रगाय । ॐ नृसिंहाय विद्महे वज्रनखाय धीमहि तन्नः सिंहः प्रचोदयात् । मिश्रणं च प्रगाय ई मा हा भू
    ई मा हा भू ब्रह्मस्वरूपं निरञ्जनं परमव्योम्निकं सब्रह्मा सशिवः सहरिः सेन्द्रः सोक्षरः परमस्वराट् यावसानेस्य
    चतुर्थ्यर्धमात्रा सा सोमलोक ओङ्कारः सा अथर्वणैर्मन्त्रैरथर्ववेदः संवर्तकोग्निर्मरुतो विराडेकऋषिर्भास्वती
    स्मृता । न वहि प्रज्ञं नान्तः प्रज्ञं नोभयतः प्रज्ञं न प्रज्ञं ना प्रज्ञं न प्रज्ञानघनं अदृष्टमव्यवहार्य
    मग्रात्मलक्षण मचित्यमव्यपदेश्यमेकात्मप्रत्ययसारं प्रपञ्चोपशमं शिवमद्वैतं चतुर्थं मन्यते स आत्मा सविज्ञेयः
    । ॐ मृत्युमृत्युं नमाम्यहं ॐ नृसिंहाय धीमहि तन्नः सिंहः प्रचोदयात् । हं ईं ॐ ॐ हेमवर्णाय मायात्मने
    कवचाय हुम् । अथ पञ्चमं महाचक्राख्यम्मस्त्रमुच्यते । षट्स्वरसाम्नैव प्रणवं शक्तिबीजं च प्रगाय प्रथमपादं
    गीत्वा तदङ्गप्रणवं च प्रगाय द्वितीयपादं गीत्वा सौरसावित्रीं समरहितं पठेत् । ततस्तृतीयपादं गीत्वा यजुलक्ष्मीं
    सामरहितां पठेत् ॥ ततश्चतुर्थपादं नृसिंहगायत्री च प्रगाय मिश्रणसामं गायेत् । चत्वारो वेदाः साङ्गाः
    सशाखाः चत्वारः पादा भवन्ति प्रणवं सर्वं पञ्चमं भवति षडरं वा एतत्सुदर्शनं महाचक्रं तस्मात्षडरं भवति
    षट्पत्रं चक्रं भवति षड् वा ऋतव ऋतुभिः समितम् । भवति मध्ये नाभिर्भवति नाभ्यां वा एते अराः प्रतिष्ठिताः
    । मा यथा वा एतत्सर्वं वेष्टितं भवति नात्मानं माया स्पृशति तस्माद्यथा बहिर्वेष्टितं भवति अथाष्टारमष्टपत्रं
    चक्रं भवति ऋचो अक्षरे परमे व्योमन्यस्मिन्देवा अधिविश्वेनिषेदुः यस्तं न वेद किमृचा करिष्यति य एतद्विदुस्त
    इमे समासते ॥ इति एतत्सर्वं पठित्वा स्वशरीरं ब्रह्माण्डं भावयित्वा शरीरमध्ये नाभि ध्यात्वा तस्मिन्क्षीरसागरं
    ध्यात्वा श्वेतद्वीपं च ध्यात्वा शेषपर्यङ्के प्रणवं विचिन्त्य नृसिंहैका क्षरं विचित्य ॐ रौं ॐ सहस्रार
    हुं फट् ॐ नमो नारायणाय ॐ नमो भगवते वासुदेवाय अं आं अं अ ॐ ॐ ॐ ग्रं ॐ म्यं ॐ ॐ हं ॐ एवं सर्वत्र क खं
    गं जः वसूनां स्थानानि । सं जं दं धं रुद्राणां स्थानानि नं घं शं षं आदित्य स्थानानि सं हं लं क्षं विश्वेदेवानां
    स्थानानि ॐ उं मं ब्रह्मविष्णुमहेश्वराणां स्थानानि हं सं सूर्याचन्द्रमसोः स्थाने ॐ ईं हं उग्रं
