id: candikashtakam
category: stotram
name:
  english: candikashtakam
  devanagari: चण्डिकाष्टकम्
content:
  english: padapamkajam bhaje bhavanti tatra shatruvo na yatra tadvibhavanam || 8|| durgagrato'tigarimaprabhavam
    bhavanya bhavyamimam stutimumapatina pranitam | yah shravayet sapuruhutapuradhipatya bhagyam labheta
    ripavashca trinani tasya || 9|| ramashtamka shashamke'bde'shtamyam shuklashvine gurau | shaktashrijagadanandasharmanyupahrita
    stutih || 10|| || iti kavipatyupanamaka
  devanagari: पादपंकजं भजे भवन्ति तत्र शत्रुवो न यत्र तद्विभावनम् ।। ८।। दुर्गाग्रतोऽतिगरिमप्रभवां भवान्या
    भव्यामिमां स्तुतिमुमापतिना प्रणीताम् । यः श्रावयेत् सपुरूहूतपुराधिपत्य भाग्यं लभेत रिपवश्च तृणानि
    तस्य ।। ९।। रामाष्टांक शशांकेऽब्देऽष्टम्यां शुक्लाश्विने गुरौ । शाक्तश्रीजगदानन्दशर्मण्युपहृता स्तुतिः
    ।। १०।। ।। इति कविपत्युपनामक
meaning: {}
