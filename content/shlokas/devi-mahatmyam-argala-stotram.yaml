id: devi-mahatmyam-argala-stotram
category: stotram
name:
  english: Devi Mahatmyam Argala Stotram
content:
  english: asyashri argala stotra mantrasya vishnuh rishih| anushtupchandah| shri mahalakshirdevata| mantrodita
    devyobijam| navarno mantra shaktih| shri saptashati mantrastatvam shri jagadamba prityarthe saptashati
    patham gatvena jape viniyogah|| dhyanam om bandhuka kusumabhasam pancamundadhivasinim| sphuraccandrakalaratna
    mukutam mundamalinim|| trinetram rakta vasanam pinonnata ghatastanim| pustakam cakshamalam ca varam
    cabhayakam kramat|| dadhatim samsmarennityamuttaramnayamanitam| athava ya candi madhukaitabhadi daityadalani
    ya mahishonmulini ya dhumrekshana candamundamathani ya rakta bijashani| shaktih shumbhanishumbhadaityadalani
    ya siddhi datri para sa devi nava koti murti sahita mam patu vishveshvari|| om namashcandikayai markandeya
    uvaca om jayatvam devi camunde jaya bhutapaharini| jaya sarva gate devi kala ratri namo'stute|| ||
    madhukaithabhavidravi vidhatru varade namah om jayanti mangala kali bhadrakali kapalini || || durga
    shiva kshama dhatri svaha svadha namo'stute rupam dehi jayam dehi yasho dehi dvisho jahi || || mahishasura
    nirnashi bhaktanam sukhade namah| rupam dehi jayam dehi yasho dehi dvisho jahi|| || dhumranetra vadhe
    devi dharma kamartha dayini| rupam dehi jayam dehi yasho dehi dvisho jahi|| || rakta bija vadhe devi
    canda munda vinashini | rupam dehi jayam dehi yasho dehi dvisho jahi|| || nishumbhashumbha nirnashi
    trailokya shubhade namah rupam dehi jayam dehi yasho dehi dvisho jahi|| || vandi tanghriyuge devi
    sarvasaubhagya dayini| rupam dehi jayam dehi yasho dehi dvisho jahi|| || acintya rupa carite sarva
    shatru vinashini| rupam dehi jayam dehi yasho dehi dvisho jahi|| || natebhyah sarvada bhaktya caparne
    duritapahe| rupam dehi jayam dehi yasho dehi dvisho jahi|| || stuvadbhyobhaktipurvam tvam candike
    vyadhi nashini rupam dehi jayam dehi yasho dehi dvisho jahi|| || candike satatam yuddhe jayanti papanashini|
    rupam dehi jayam dehi yasho dehi dvisho jahi|| || dehi saubhagyamarogyam dehi devi param sukham| rupam
    dhehi jayam dehi yasho dhehi dvisho jahi|| || vidhehi devi kalyanam vidhehi vipulam shriyam| rupam
    dehi jayam dehi yasho dehi dvisho jahi|| || vidhehi dvishatam nasham vidhehi balamuccakaih| rupam
    dehi jayam dehi yasho dehi dvisho jahi|| || surasurashiro ratna nighrishtacarane'mbike| rupam dehi
    jayam dehi yasho dehi dvisho jahi|| || vidhyavantam yashasvantam lakshmivantanca mam kuru| rupam dehi
    jayam dehi yasho dehi dvisho jahi|| || devi pracanda dordanda daitya darpa nishudini| rupam dehi jayam
    dehi yasho dehi dvisho jahi|| || pracanda daityadarpaghne candike pranatayame| rupam dehi jayam dehi
    yasho dehi dvisho jahi|| || caturbhuje caturvaktra samstute parameshvari| rupam dehi jayam dehi yasho
    dehi dvisho jahi|| || krishnena samstute devi shashvadbhaktya sadambike| rupam dehi jayam dehi yasho
    dehi dvisho jahi|| || himacalasutanathasamstute parameshvari| rupam dehi jayam dehi yasho dehi dvisho
    jahi|| || indrani patisadbhava pujite parameshvari| rupam dehi jayam dehi yasho dehi dvisho jahi ||
    || devi bhaktajanoddama dattanandodaye'mbike| rupam dehi jayam dehi yasho dehi dvisho jahi || || bharyam
    manoramam dehi manovrittanusarinim| rupam dehi jayam dehi yasho dehi dvisho jahi|| || tarinim durga
    samsara sagara syacalodbhave| rupam dehi jayam dehi yasho dehi dvisho jahi || || idamstotram pathitva
    tu mahastotram pathennarah| saptashatim samaradhya varamapnoti durlabham || || || iti shri argala
    stotram samaptam ||
  devanagari: अस्यश्री अर्गला स्तोत्र मन्त्रस्य विष्णुः ऋषिः। अनुष्टुप्छन्दः। श्री महालक्षीर्देवता। मन्त्रोदिता
    देव्योबीजं। नवार्णो मन्त्र शक्तिः। श्री सप्तशती मन्त्रस्तत्वं श्री जगदम्बा प्रीत्यर्थे सप्तशती पठां
    गत्वेन जपे विनियोगः॥ ध्यानं ॐ बन्धूक कुसुमाभासां पञ्चमुण्डाधिवासिनीं। स्फुरच्चन्द्रकलारत्न मुकुटां
    मुण्डमालिनीं॥ त्रिनेत्रां रक्त वसनां पीनोन्नत घटस्तनीं। पुस्तकं चाक्षमालां च वरं चाभयकं क्रमात्॥ दधतीं
    संस्मरेन्नित्यमुत्तराम्नायमानितां। अथवा या चण्डी मधुकैटभादि दैत्यदलनी या माहिषोन्मूलिनी या धूम्रेक्षन
    चण्डमुण्डमथनी या रक्त बीजाशनी। शक्तिः शुम्भनिशुम्भदैत्यदलनी या सिद्धि दात्री परा सा देवी नव कोटि मूर्ति
    सहिता मां पातु विश्वेश्वरी॥ ॐ नमश्चण्डिकायै मार्कण्डेय उवाच ॐ जयत्वं देवि चामुण्डे जय भूतापहारिणि।
    जय सर्व गते देवि काल रात्रि नमोऽस्तुते॥ ॥ मधुकैठभविद्रावि विधात्रु वरदे नमः ॐ जयन्ती मङ्गला काली भद्रकाली
    कपालिनी ॥ ॥ दुर्गा शिवा क्षमा धात्री स्वाहा स्वधा नमोऽस्तुते रूपं देहि जयं देहि यशो देहि द्विषो जहि
    ॥ ॥ महिषासुर निर्नाशि भक्तानां सुखदे नमः। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ धूम्रनेत्र वधे
    देवि धर्म कामार्थ दायिनि। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ रक्त बीज वधे देवि चण्ड मुण्ड विनाशिनि
    । रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ निशुम्भशुम्भ निर्नाशि त्रैलोक्य शुभदे नमः रूपं देहि जयं
    देहि यशो देहि द्विषो जहि॥ ॥ वन्दि ताङ्घ्रियुगे देवि सर्वसौभाग्य दायिनि। रूपं देहि जयं देहि यशो देहि
    द्विषो जहि॥ ॥ अचिन्त्य रूप चरिते सर्व शत्रु विनाशिनि। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ नतेभ्यः
    सर्वदा भक्त्या चापर्णे दुरितापहे। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ स्तुवद्भ्योभक्तिपूर्वं
    त्वां चण्डिके व्याधि नाशिनि रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ चण्डिके सततं युद्धे जयन्ती पापनाशिनि।
    रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ देहि सौभाग्यमारोग्यं देहि देवी परं सुखं। रूपं धेहि जयं देहि
    यशो धेहि द्विषो जहि॥ ॥ विधेहि देवि कल्याणं विधेहि विपुलां श्रियं। रूपं देहि जयं देहि यशो देहि द्विषो
    जहि॥ ॥ विधेहि द्विषतां नाशं विधेहि बलमुच्चकैः। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ सुरासुरशिरो
    रत्न निघृष्टचरणेऽम्बिके। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ विध्यावन्तं यशस्वन्तं लक्ष्मीवन्तञ्च
    मां कुरु। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ देवि प्रचण्ड दोर्दण्ड दैत्य दर्प निषूदिनि। रूपं
    देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ प्रचण्ड दैत्यदर्पघ्ने चण्डिके प्रणतायमे। रूपं देहि जयं देहि यशो
    देहि द्विषो जहि॥ ॥ चतुर्भुजे चतुर्वक्त्र संस्तुते परमेश्वरि। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥
    ॥ कृष्णेन संस्तुते देवि शश्वद्भक्त्या सदाम्बिके। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ हिमाचलसुतानाथसंस्तुते
    परमेश्वरि। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥ इन्द्राणी पतिसद्भाव पूजिते परमेश्वरि। रूपं देहि
    जयं देहि यशो देहि द्विषो जहि ॥ ॥ देवि भक्तजनोद्दाम दत्तानन्दोदयेऽम्बिके। रूपं देहि जयं देहि यशो देहि
    द्विषो जहि ॥ ॥ भार्यां मनोरमां देहि मनोवृत्तानुसारिणीं। रूपं देहि जयं देहि यशो देहि द्विषो जहि॥ ॥
    तारिणीं दुर्ग संसार सागर स्याचलोद्भवे। रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ ॥ इदंस्तोत्रं पठित्वा
    तु महास्तोत्रं पठेन्नरः। सप्तशतीं समाराध्य वरमाप्नोति दुर्लभं ॥ ॥ ॥ इति श्री अर्गला स्तोत्रं समाप्तम्
    ॥
