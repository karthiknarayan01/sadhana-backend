id: candikadandakastotram
category: stotram
name:
  english: candikadandakastotram
  devanagari: चण्डिकादण्डकस्तोत्रम्
content:
  english: pishacam hum hum hunkaranadaih sakalabhayaharam siddhicandi namaste || 2|| vram vram vram vyomaghoram
    bhramati bhuvanatah saptapatalatalam kram kram kram kamarupam dhadhakitadhakitam tasya haste trishulam
    | drum drum drum durgarupam bhramati ca caritam tasya dehasvarupam mam mam mam mantrasiddham sakalabhayaharam
    siddhicandi namaste || 3|| jham jham jhankararupam jhamati jhamajhama jhanjhamana samantat kam kam
    kankaladhari dhudhuritadhuritam dhundhumari kumari | dhum dhum dhum dhumravarna bhramati bhuvanatah
    kalapastrishulam tam tam tam tivrarupam mama bhayaharanam siddhicandi namaste || 4|| ram ram ram rayarudram
    rurudhitarudhitam dirghajihvakaralam pam pam pam pretarupam samayavijayinam sumbhadambhe nisumbhe
    | sangrame pritiyate jayatu vijayate srishtisamharakari hrim hrim hrinkaranade bhavabhayaharanam siddhicandi
    namaste || 5|| hunkari kalarupi narapishitamukha sandraraudrarajihve hunkari ghoranade paramashirashikha
    harati pingalakshe | panke jatabhijate curu curu curute kamini kandakanthe kankali kalaratri bhagavati
    varade siddhicandi namaste || 6|| shtrim shtrim shtrinkaranade tribhuvananamite ghoraghoratighoram
    kam kam kam kalarupam ghughuritaghuritam ghum ghuma bindurupi | dhum dhum dhum dhumravarna bhramati
    bhuvanatah kalapashatrishulam tam tam tam tivrarupam mama bhayaharanam siddhicandi namaste || 7||
    jhrim jhrim jhrinkaravrinde pracaritamahasa vamahaste kaphlam kham kham kham khangahaste damarudimadimam
    mundamalasushobham | rum rum rum rudramalabharanavibhushita dirghajihva karala devi shri ugracandi
    bhagavati varade siddhicandi namaste || 8|| arunavarnasankasha khadgaphetakabinduka | kamarupi mahadevi
    ugracandi namo'stute || 9|| iti shri candikadandakastotram sampurnam ||
  devanagari: पिशाचं हूं हूं हूङ्कारनादैः सकलभयहरं सिद्धिचण्डी नमस्ते ॥ २॥ व्रं व्रं व्रं व्योमघोरं भ्रमति
    भुवनतः सप्तपातालतालं क्रं क्रं क्रं कामरूपं धधकितधकितं तस्य हस्ते त्रिशूलम् । द्रुं द्रुं द्रुं दुर्गरूपं
    भ्रमति च चरितं तस्य देहस्वरूपं मं मं मं मन्त्रसिद्धं सकलभयहरं सिद्धिचण्डी नमस्ते ॥ ३॥ झं झं झङ्काररूपं
    झमति झमझमा झञ्झमाना समन्तात् कं कं कङ्कालधारी धुधुरितधुरितं धुन्धुमारी कुमारी । धूं धूं धूं धूम्रवर्णा
    भ्रमति भुवनतः कालपास्त्रिशूलं तं तं तं तीव्ररूपं मम भयहरणं सिद्धिचण्डी नमस्ते ॥ ४॥ रं रं रं रायरुद्रं
    रुरुधितरुधितं दीर्घजिह्वाकरालं पं पं पं प्रेतरूपं समयविजयिनं सुम्भदम्भे निसुम्भे । सङ्ग्रामे प्रीतियाते
    जयतु विजयते सृष्टिसंहारकारी ह्रीं ह्रीं ह्रीङ्कारनादे भवभयहरणं सिद्धिचण्डी नमस्ते ॥ ५॥ हूङ्कारी कालरूपी
    नरपिशितमुखा सान्द्ररौद्रारजिह्वे हूङ्कारी घोरनादे परमशिरशिखा हारती पिङ्गलाक्षे । पङ्के जाताभिजाते
    चुरु चुरु चुरुते कामिनी काण्डकण्ठे कङ्काली कालरात्री भगवति वरदे सिद्धिचण्डी नमस्ते ॥ ६॥ ष्ट्रीं ष्ट्रीं
    ष्ट्रीङ्कारनादे त्रिभुवननमिते घोरघोरातिघोरं कं कं कं कालरूपं घुघुरितघुरितं घुं घुमा बिन्दुरूपी । धूं
    धूं धूं धूम्रवर्णा भ्रमति भुवनतः कालपाशत्रिशूलं तं तं तं तीव्ररूपं मम भयहरणं सिद्धिचण्डी नमस्ते ॥
    ७॥ झ्रीं झ्रीं झ्रीङ्कारवृन्दे प्रचरितमहसा वामहस्ते कप्ःलं खं खं खं खङ्गहस्ते डमरुडिमडिमां मुण्डमालासुशोभाम्
    । रुं रुं रुं रुद्रमालाभरणविभूषिता दिर्घजिह्वा कराला देवि श्री उग्रचण्डी भगवति वरदे सिद्धिचण्डी नमस्ते
    ॥ ८॥ आरुणवर्णसङ्काशा खड्गफेटकबिन्दुका । कामरूपी महादेवी उग्रचण्डी नमोऽस्तुते ॥ ९॥ इति श्री चण्डिकादण्डकस्तोत्रं
    सम्पूर्णम् ॥
