id: kyta-8-brahmananda-valli-krishna-yajurveda-taittiriya-aranyaka-patha-brahmavidapnoti-param
category: stotram
name:
  english: KYTA 8 Brahmananda Valli - Krishna Yajurveda Taittiriya Aranyaka Patha - Brahmavidapnoti Param
content:
  english: krishna yajurvediya taittiriya aranyake ashtamah prapathakah shri gurubhyo namah | harih om
    || brahmananda valli anuvakam saha na vavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvina
    vadhitamastu ma vidvishavahai mbrahma | yo veda nihita mparame vyomann | so 'shnute sarvan kama thsaha
    | brahmana vipashciteti || tasmadva etasmadatmana akasha ssambhutah | akasha dvayuh | vayoragnih |
    agnerapah | adbhyah prithivi | prithivya oshadhayah | oshadhibhyo tpurushah || sa va esha purusho
    'nnarasamayah || tasyedameva shirah | aya ndakshinah pakshah | ayamuttarah pakshah | ayamatma mpratishtha
    || tadapyesha shloko bhavati || || annadvai prajah prajayante | yah kashca prithivig shritah | atho
    annenaiva jivanti | athainadapiyantyantatah | annagm hi bhutana thsarvaushadha mucyate | sarvam 'nnamapnuvanti
    | ye mbrahmopasate | annagm hi bhutana thsarvaushadha mucyate | anna dbhutani jayante | jatanyannena
    vardhante | adyate 'tti ca bhutani | tasmadanna ntaducyata iti || tasmadva etasma dannarasamayat |
    anyo prana mayah | tenaisha purnah || sa va esha purushavidha eva | tasya purusha vidhatam | anvaya
    mpurusha vidhah | tasya prana eva shirah || vyano dakshinah pakshah | apana uttarah pakshah | akasha
    atma | prithivi puccha mpratishtha || tadapyesha shloko bhavati || ndeva anuprananti | manushyah pashavashca
    ye | prano hi bhutanamayuh | tasma thsarvayusha mucyate | sarvameva ta ayuryanti | ye prana mbrahmopasate
    | prano hi bhutanamayuh | tasma mucyata iti || tasyaisha eva sharira atma | yah purvasya || tasmadva
    etasma tpranamayat | anyo 'ntara atma manomayah | tenaisha purnah || sa va esha purushavidha eva |
    tasya purushavidhatam | anvaya mpurushavidhah | tasya yajureva shirah | rig dakshinah pakshah | samottarah
    pakshah | adesha atma | atharvangirasah puccha mpratishtha || tadapyesha shloko bhavati || || yato
    vaco nivartante | apra pya manasa saha | ananda mbrahmano vidvan | na bibheti kadacaneti || tasyaisha
    eva sharira atma | yah purvasya || tasmadva etasma 'ntara atma vijnanamayah | tenaisha purnah || sa
    va esha purushavidha eva | tasya purusha vidhatam | anvaya mpurusha vidhah | tasya shraddhaiva shirah
    | rita ndakshinah pakshah | satyamuttarah pakshah | yoga atma | mahah puccha mpratishtha || tadapyesha
    shloko bhavati || ntanute | karmani tanute mupasate | vijnana dveda | tasmaccenna pramadyati | sharire
    papmano hitva | sarvan thsamashnuta iti || tasyaisha eva sharira atma | yah purvasya || tasmadva etasma
    dvijnanamayat | anyo ''nandamayah | tenaisha purnah || sa va esha purushavidha eva | tasya purushavidhatam
    | anvaya mpurushavidhah | tasya priya meva shirah | modo dakshinah pakshah | pramoda uttarah pakshah
    | ananda atma | brahma puccha mpratishtha || tadapyesha shloko bhavati || || asanneva sa bhavati |
    asa dbrahmeti veda cet | asti brahmeti ce ntato viduriti || tasyaisha eva sharira atma | yah purvasya
    || athato 'nu prashnah || uta vidva namum mpretya | kashcana gacchati mprajayeyeti | sa tapo 'tapyata
    | sa tapastaptva | idagm sarva nkinca | tathsrishtva | tadevanu pravishat || tadanupravishya | sacca
    tyaccabhavat | nirukta mitya cakshate || tadapyesha shloko bhavati || || asadva idamagra asit | tato
    vai sadajayata | tadatmanagg thsukritamucyata iti || yadvai ta thsukritam | raso vai sah | rasagg
    ''nandi bhavati || ko hyevanya tkah pranyat | yadesha akasha anando na syat | esha hyevanandayati
    || yada hyevaisha etasmi nnadrishye 'natmye 'nirukte 'nilayane 'bhayam pratishtham ngato bhavati ||
    yada hyevaisha etasmi nkurute | atha tasya bhaya mbhavati || tattveva bhayam 'manvanasya || tadapyesha
    shloko bhavati || dvatah pavate | bhishodeti suryah | bhisha shcendrashca | mrityu rdhavati pancama
    iti || saisha ''nandasya mimagmsa bhavati || yuva sya 'ddhyayakah | ashishtho dridhishtho balishthah
    | tasyeya mprithivi sarva vittasya purna syat | sa eko manusha anandah || te ye shata mmanusha anandah
    | || manandah | shrotriyasya cakamahatasya || te ye shata manandah | sa eko deva manandah | shrotriyasya
    cakamahatasya || te ye shata manandah | sa ekah pitrina manandah | shrotriyasya cakamahatasya || te
    ye shata manandah | sa eka ajanajana b || shrotriyasya cakamahatasya || te ye shata ndevana manandah
    | sa ekah karma manandah | ye karmana devanapi yanti | shrotriyasya cakamahatasya || te ye shata manandah
    | sa eko devana manandah | shrotriyasya cakamahatasya || te ye shata manandah | sa eka indrasyanandah
    | || c || shrotriyasya cakamahatasya || te ye shatamindra ''nandah | sa eko brihaspate ranandah |
    shrotriyasya cakamahatasya || te ye shata mbrihaspate ranandah | sa ekah prajapate ranandah | shrotriyasya
    cakamahatasya || te ye shata ranandah | sa eko brahmana anandah | shrotriyasya cakamahatasya || mpurushe
    | yashcasa vaditye | sa ekah || sa ya evam vi~t | asmalloka tpretya | etamannamaya mupasankramati
    | eta mupasankramati | eta mupasankramati | etam mupasankramati | etamanandamaya mupasankramati ||
    tadapyesha shloko bhavati || è || yato vaco nivartante | apra pya manasa saha | ananda mbrahmano vidvan
    | na bibheti kutashcaneti || etagm ha va va na tapati | kimahagm sadhu nakaravam | kimaha vi~dvanete
    atmanagg sprinute || ubhe hyevaisha ete atmanagg ve~da || ityupanishat || || saha na vavatu | saha
    nau bhunaktu | saha virya nkaravavahai | tejasvina vadhitamastu ma vidvishavahai brahmavididamayamidamekavigmshatih
    | anna dannarasamaya 'pana akashah prithivi pucchagm shadvigmshatih | prana 'tharvangirasah puccha
    ndvavigmshatih | yatah shraddhartagm satyam ~yogo maho 'shtadasha | vijnana mmodah pramoda anando
    brahma puccha ndvavigmshatih | asannevathashtavi gmshatih | asa nmanusho manushyagandharvana mpitrinamciralokalokana
    majanajana nkarmadevanam ~ye karmana devanamindrasya brihaspateh prajapate ssa yashva sankramatyekapancashat
    | yatah kutashca naitamekadasha nava || iti brahmanandavalli samapta || || harih om || || krishna
    yajurvediya taittiriya aranyake ashtamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके अष्टमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ ब्रह्मानन्द
    वल्ली अनुवाकं स॒ह ना॑ ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒ वधी॑तमस्तु॒ मा
    वि॑द्विषा॒वहै म्ब्रह्म॑ । यो वेद॒ निहि॑त॒ म्पर॒मे व्यो॑मन्न् । सो ऽश्नुते॒ सर्वा॒न् कामा थ्स॒ह । ब्रह्म॑णा
    विप॒श्चितेति॑ ॥ तस्मा॒द्वा ए॒तस्मा॑दा॒त्मन॑ आका॒श स्सम्भू॑तः । आ॒का॒शा द्वा॒युः । वा॒योर॒ग्निः । अ॒ग्नेरापः॑
    । अ॒द्भ्यः पृ॑थि॒वी । पृ॒थि॒व्या ओष॑धयः । ओष॑धी॒भ्यो त्पुरु॑षः ॥ स वा एष पुरुषो ऽन्न॑रस॒मयः ॥ तस्येद॑मेव॒
    शिरः । अय न्दक्षि॑णः प॒क्षः । अयमुत्त॑रः प॒क्षः । अयमात्मा म्प्रति॒ष्ठा ॥ तदप्येष श्लो॑को भ॒वति ॥
    ॥ अन्ना॒द्वै प्र॒जाः प्र॒जाय॑न्ते । याः काश्च॑ पृथि॒वीग् श्रि॒ताः । अथो॒ अन्ने॑नै॒व जी॑वन्ति । अथै॑न॒दपि॑यन्त्यन्त॒तः
    । अन्न॒ग्ं॒ हि भू॒ताना॒ थ्सर्वौष॒ध मु॑च्यते । सर्वं॒ ऽन्न॑माप्नुवन्ति । ये म्ब्रह्मो॒पास॑ते । अन्न॒ग्ं॒
    हि भू॒ताना॒ थ्सर्वौष॒ध मु॑च्यते । अन्ना द्भू॒तानि॒ जाय॑न्ते । जाता॒न्यन्ने॑न वर्धन्ते । अद्यते ऽत्ति
    च॑ भूता॒नि । तस्मादन्न न्तदुच्य॑त इ॒ति ॥ तस्माद्वा एतस्मा दन्न॑रस॒मयात् । अन्यो प्राण॒ मयः । तेनै॑ष
    पू॒र्णः ॥ स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑ष वि॒धताम् । अन्वय॑ म्पुरुष॒ विधः । तस्य प्राण॑ एव॒ शिरः
    ॥ व्यानो दक्षि॑णः प॒क्षः । अपान उत्त॑रः प॒क्षः । आका॑श आ॒त्मा । पृथिवी पुच्छ॑ म्प्रति॒ष्ठा ॥ तदप्येष
    श्लो॑को भ॒वति ॥ न्दे॒वा अनु॒प्राण॑न्ति । म॒नु॒ष्याः प॒शव॑श्च॒ ये । प्रा॒णो हि भू॒ताना॒मायुः॑ । तस्मा
    थ्सर्वायु॒ष मु॑च्यते । सर्व॑मे॒व त॒ आयु॑र्यन्ति । ये प्रा॒ण म्ब्रह्मो॒पास॑ते । प्राणो हि भूता॑नामा॒युः
    । तस्मा मुच्य॑त इ॒ति ॥ तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य ॥ तस्माद्वा एतस्मा त्प्राण॒मयात् ।
    अन्यो ऽन्तर आत्मा॑ मनो॒मयः । तेनै॑ष पू॒र्णः ॥ स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑षवि॒धताम् । अन्वय॑
    म्पुरुष॒विधः । तस्य यजु॑रेव॒ शिरः । ऋग् दक्षि॑णः प॒क्षः । सामोत्त॑रः प॒क्षः । आदे॑श आ॒त्मा । अथर्वाङ्गिरसः
    पुच्छ॑ म्प्रति॒ष्ठा ॥ तदप्येष श्लो॑को भ॒वति ॥ ॥ यतो॒ वाचो॒ निव॑र्तन्ते । अप्रा प्य॒ मन॑सा स॒ह । आनन्द
    म्ब्रह्म॑णो वि॒द्वान् । न बिभेति कदा॑चने॒ति ॥ तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य ॥ तस्माद्वा
    एतस्मा ऽन्तर आत्मा वि॑ज्ञान॒मयः । तेनै॑ष पू॒र्णः ॥ स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑ष वि॒धताम् ।
    अन्वय॑ म्पुरुष॒ विधः । तस्य श्र॑द्धैव॒ शिरः । ऋत न्दक्षि॑णः प॒क्षः । सत्यमुत्त॑रः प॒क्षः । यो॑ग आ॒त्मा
    । महः पुच्छ॑ म्प्रति॒ष्ठा ॥ तदप्येष श्लो॑को भ॒वति ॥ न्त॑नुते । कर्मा॑णि तनु॒ते मुपा॑सते । वि॒ज्ञान॒
    द्वेद॑ । तस्मा॒च्चेन्न प्र॒माद्य॑ति । श॒रीरे॑ पाप्म॑नो हि॒त्वा । सर्वान् थ्समश्नु॑त इ॒ति ॥ तस्यैष
    एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य ॥ तस्माद्वा एतस्मा द्वि॑ज्ञान॒मयात् । अन्यो ऽऽनन्द॒मयः । तेनै॑ष पू॒र्णः
    ॥ स वा एष पुरुषवि॑ध ए॒व । तस्य पुरु॑षवि॒धताम् । अन्वय॑ म्पुरुष॒विधः । तस्य प्रिय॑ मेव॒ शिरः । मोदो
    दक्षि॑णः प॒क्षः । प्रमोद उत्त॑रः प॒क्षः । आन॑न्द आ॒त्मा । ब्रह्म पुच्छ॑ म्प्रति॒ष्ठा ॥ तदप्येष श्लो॑को
    भ॒वति ॥ ॥ अस॑न्ने॒व स॑ भवति । अस॒ द्ब्रह्मेति॒ वेद॒ चेत् । अस्ति ब्रह्मेति॑ चे न्ततो वि॑दुरि॒ति ॥
    तस्यैष एव शारी॑र आ॒त्मा । यः॑ पूर्व॒स्य ॥ अथातो॑ ऽनु प्र॒श्नाः ॥ उ॒ता वि॒द्वा न॒मुं म्प्रेत्य॑ । कश्च॒न
    ग॑च्छ॒ती म्प्रजा॑ये॒येति॑ । स तपो॑ ऽतप्यत । स तप॑स्त॒प्त्वा । इ॒दग्ं सर्व॑ ङ्किञ्च॑ । तथ्सृ॒ष्ट्वा
    । तदे॒वानु॒ प्रावि॑शत् ॥ तद॑नुप्र॒विश्य॑ । सच्च॒ त्यच्चा॑भवत् । नि॒रुक्त॒ मि॑त्या च॒क्षते ॥ तदप्येष
    श्लो॑को भ॒वति ॥ ॥ अस॒द्वा इ॒दमग्र॑ आसीत् । ततो॒ वै सद॑जायत । तदात्मानग्ग् थ्सुकृतमुच्य॑त इ॒ति ॥ यद्वै॑
    त थ्सु॒कृतम् । र॑सो वै॒ सः । रसग्ग् ऽऽन॑न्दी भ॒वति ॥ को ह्येवान्या त्कः प्रा॒ण्यात् । यदेष आकाश आन॑न्दो
    न॒ स्यात् । एष ह्येवान॑न्दया॒ति ॥ य॒दा ह्ये॑वैष॒ एतस्मि न्नदृश्ये ऽनात्म्ये ऽनिरुक्ते ऽनिलयने ऽभयं
    प्रति॑ष्ठां ङ्ग॑तो भ॒वति ॥ य॒दा ह्ये॑वैष॒ एतस्मि ङ्कु॒रुते । अथ तस्य भ॑य म्भ॒वति ॥ तत्त्वेव भयं ऽम॑न्वान॒स्य
    ॥ तदप्येष श्लो॑को भ॒वति ॥ द्वातः॑ पवते । भी॒षोदे॑ति॒ सूर्यः॑ । भीषा श्चेन्द्र॒श्च । मृत्यु र्धावति
    पञ्च॑म इ॒ति ॥ सैषा ऽऽनन्दस्य मीमाग्ं॑सा भ॒वति ॥ युवा स्या ऽद्ध्या॒यकः । आशिष्ठो दृढिष्ठो॑ बलि॒ष्ठः
    । तस्येय म्पृथिवी सर्वा वित्तस्य॑ पूर्णा॒ स्यात् । स एको मानुष॑ आन॒न्दः ॥ ते ये शत म्मानुषा॑ आन॒न्दाः
    । ॥ मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत मान॒न्दाः । स एको देव मान॒न्दः । श्रोत्रियस्य
    चाकाम॑हत॒स्य ॥ ते ये शत मान॒न्दाः । स एकः पितृणा मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत मान॒न्दाः
    । स एक आजानजाना ब् ॥ श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत न्देवाना॑ मान॒न्दाः । स एकः कर्म मान॒न्दः
    । ये कर्मणा देवान॑पि य॒न्ति । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत मान॒न्दाः । स एको देवाना॑ मान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत मान॒न्दाः । स एक इन्द्र॑स्यान॒न्दः । ॥ च् ॥ श्रोत्रियस्य चाकाम॑हत॒स्य
    ॥ ते ये शतमिन्द्र॑ ऽऽन॒न्दाः । स एको बृहस्पते॑ रान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत म्बृहस्पते॑
    रान॒न्दाः । स एकः प्रजापते॑ रान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ ते ये शत रान॒न्दाः । स एको ब्रह्मण॑
    आन॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य ॥ म्पु॒रुषे । यश्चासा॑ वादि॒त्ये । स एकः॑ ॥ स य॑ एवं॒ विँत् ।
    अस्माल्लो॑का त्प्रे॒त्य । एतमन्नमय मुप॑सङ्क्रा॒मति । एत मुप॑सङ्क्रा॒मति । एत मुप॑सङ्क्रा॒मति । एतं
    मुप॑सङ्क्रा॒मति । एतमानन्दमय मुप॑सङ्क्रा॒मति ॥ तदप्येष श्लो॑को भ॒वति ॥ ऎ ॥ यतो॒ वाचो॒ निव॑र्तन्ते
    । अप्रा प्य॒ मन॑सा स॒ह । आनन्द म्ब्रह्म॑णो वि॒द्वान् । न बिभेति कुत॑श्चने॒ति ॥ एतग्ं ह वा व॑ न त॒पति
    । किमहग्ं साधु॑ नाक॒रवम् । किमह विँद्वानेते आत्मा॑नग्ग् स्पृ॒णुते ॥ उ॒भे ह्ये॑वैष॒ एते आत्मा॑नग्ग्
    वेँद॑ ॥ इत्यु॑प॒निष॑त् ॥ ॥ स॒ह ना॑ ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒ वधी॑तमस्तु॒
    मा वि॑द्विषा॒वहै ब्र॒ह्म॒विदिदमयमिदमेक॑विग्ंशतिः । अन्ना॒ दन्न॑रस॒मया ऽपान आका॑शः॒ पृथिवी पुच्छ॒ग्ं॒
    षड्विग्ं॑शतिः । प्रा॒ण ऽथर्वाङ्गिरसः पुच्छ॒ न्द्वाविग्ं॑शतिः । यतः॑ श्र॒द्धर्तग्ं सत्यम् ँयो॑गो॒ महो॑
    ऽष्टाद॑श । वि॒ज्ञान॒ म्मोदः प्रमोद आन॑न्दो॒ ब्रह्म पुच्छ॒ न्द्वाविग्ं॑शतिः । अस॑न्ने॒वाथाष्टावि ग्ं॑शतिः
    । अस॒ न्मानुषो॒ मनुष्यगन्धर्वाणा॒ म्पितृणाम्चिरलोकलोकाना॒ माजानजाना ङ्कर्मदेवानाम् ँये कर्मणा देवाना॒मिन्द्र॑स्य॒
    बृहस्पतेः॒ प्रजापते॒ स्स यश्व॑ सङ्क्रा॒मत्येक॑पञ्चा॒शत् । यतः॒ कुत॑श्च॒ नैतमेका॑दश॒ नव॑ ॥ इति ब्रह्मानन्दवल्ली
    समाप्ता ॥ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके अष्टमः प्रपाठक
