id: pradosha
category: stotram
name:
  english: pradosha
  devanagari: प्रदोश
content:
  english: pradoshastotram shri ganeshaya namah | jaya deva jagannatha jaya shankara shashvata | jaya
    sarvasuradhyaksha jaya sarvasurarcita || 1|| jaya sarvagunatita jaya sarvavaraprada | jaya nitya niradhara
    jaya vishvambharavyaya || 2|| jaya vishvaikavandyesha jaya nagendrabhushana | jaya gauripate shambho
    jaya candrardhashekhara || 3|| jaya kotyarkasankasha jayanantagunashraya | jaya bhadra virupaksha
    jayacintya niranjana || 4|| jaya natha kripasindho jaya bhaktartibhanjana | jaya dustarasamsarasagarottarana
    prabho || 5|| prasida me mahadeva samsarartasya khidyatah | sarvapapakshayam kritva raksha mam parameshvara
    || 6|| mahadaridryamagnasya mahapapahatasya ca | mahashokanivishtasya maharogaturasya ca || 7|| rinabharaparitasya
    dahyamanasya karmabhih | grahaih prapidyamanasya prasida mama shankara || 8|| daridrah prarthayeddevam
    pradoshe girijapatim | arthadhyo va'tha raja va prarthayeddevamishvaram || 9|| dirghamayuh sadarogyam
    koshavriddhirbalonnatih | mamastu nityamanandah prasadattava shankara || 10|| shatravah samkshayam
    yantu prasidantu mama prajah | nashyantu dasyavo rashtre janah santu nirapadah || 11|| durbhikshamarisantapah
    shamam yantu mahitale | sarvasasyasamriddhishca bhuyatsukhamaya dishah || 12|| evamaradhayeddevam
    pujante girijapatim | brahmananbhojayet pashcaddakshinabhishca pujayet || 13|| sarvapapakshayakari
    sarvaroganivarani | shivapuja maya''khyata sarvabhishtaphalaprada || 14|| || iti pradoshastotram sampurnam
    ||
  devanagari: प्रदोषस्तोत्रम् श्री गणेशाय नमः । जय देव जगन्नाथ जय शङ्कर शाश्वत । जय सर्वसुराध्यक्ष जय
    सर्वसुरार्चित ॥ १॥ जय सर्वगुणातीत जय सर्ववरप्रद । जय नित्य निराधार जय विश्वम्भराव्यय ॥ २॥ जय विश्वैकवन्द्येश
    जय नागेन्द्रभूषण । जय गौरीपते शम्भो जय चन्द्रार्धशेखर ॥ ३॥ जय कोट्यर्कसङ्काश जयानन्तगुणाश्रय । जय
    भद्र विरूपाक्ष जयाचिन्त्य निरञ्जन ॥ ४॥ जय नाथ कृपासिन्धो जय भक्तार्तिभञ्जन । जय दुस्तरसंसारसागरोत्तारण
    प्रभो ॥ ५॥ प्रसीद मे महादेव संसारार्तस्य खिद्यतः । सर्वपापक्षयं कृत्वा रक्ष मां परमेश्वर ॥ ६॥ महादारिद्र्यमग्नस्य
    महापापहतस्य च । महाशोकनिविष्टस्य महारोगातुरस्य च ॥ ७॥ ऋणभारपरीतस्य दह्यमानस्य कर्मभिः । ग्रहैः प्रपीड्यमानस्य
    प्रसीद मम शङ्कर ॥ ८॥ दरिद्रः प्रार्थयेद्देवं प्रदोषे गिरिजापतिम् । अर्थाढ्यो वाऽथ राजा वा प्रार्थयेद्देवमीश्वरम्
    ॥ ९॥ दीर्घमायुः सदारोग्यं कोशवृद्धिर्बलोन्नतिः । ममास्तु नित्यमानन्दः प्रसादात्तव शङ्कर ॥ १०॥ शत्रवः
    संक्षयं यान्तु प्रसीदन्तु मम प्रजाः । नश्यन्तु दस्यवो राष्ट्रे जनाः सन्तु निरापदः ॥ ११॥ दुर्भिक्षमरिसन्तापाः
    शमं यान्तु महीतले । सर्वसस्यसमृद्धिश्च भूयात्सुखमया दिशः ॥ १२॥ एवमाराधयेद्देवं पूजान्ते गिरिजापतिम्
    । ब्राह्मणान्भोजयेत् पश्चाद्दक्षिणाभिश्च पूजयेत् ॥ १३॥ सर्वपापक्षयकरी सर्वरोगनिवारणी । शिवपूजा मयाऽऽख्याता
    सर्वाभीष्टफलप्रदा ॥ १४॥ ॥ इति प्रदोषस्तोत्रं सम्पूर्णम् ॥
