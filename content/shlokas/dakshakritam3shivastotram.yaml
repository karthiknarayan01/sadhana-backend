id: dakshakritam3shivastotram
category: stotram
name:
  english: dakshakritam3shivastotram
  devanagari: दक्षकृतं३शिवस्तोत्रम्
content:
  english: 23|| iti shivapurane vayaviyasamhitayam purvakhande trayovimshadhyayantargatam dakshakritam
    shivastotram samaptam | shivapurana | vayaviyasamhita | purvabhaga | adhyaya 23
  devanagari: २३॥ इति शिवपुराणे वायवीयसंहितायां पूर्वखण्डे त्रयोविंशाध्यायान्तर्गतं दक्षकृतं शिवस्तोत्रं
    समाप्तम् । शिवपुराण । वायवीयसंहिता । पूर्वभाग । अध्याय २३
meaning: {}
