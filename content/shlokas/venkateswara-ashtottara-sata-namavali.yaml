id: venkateswara-ashtottara-sata-namavali
category: stotram
name:
  english: Venkateswara Ashtottara Sata Namavali
content:
  english: om shri venkateshaya namah om shrinivasaya namah om lakshmipataye namah om anamayaya namah
    om amritashaya namah om jagadvandyaya namah om govindaya namah om shashvataya namah om prabhave namah
    om sheshadrinilayaya namah om devaya namah om keshavaya namah om madhusudanaya namah om amritaya namah
    om madhavaya namah om krishnaya namah om shriharaye namah om jnanapanjaraya namah om shrivatsavakshase
    namah om sarveshaya namah om gopalaya namah om purushottamaya namah om gopishvaraya namah om parasmai
    jyotishe namah om vtèkuntha pataye namah om avyayaya namah om sudhatanave namah om yadavendraya namah
    om nitya yauvanarupavate namah om caturvedatmakaya namah om vishnave namah om acyutaya namah om padminipriyaya
    namah om dharapataye namah om surapataye namah om nirmalaya namah om devapujitaya namah om caturbhujaya
    namah om cakradharaya namah om tridhamne namah om trigunashrayaya namah om nirvikalpaya namah om nishkalankaya
    namah om nirantakaya namah om niranjanaya namah om virabhasaya namah om nityatriptaya namah om nirgunaya
    namah om nirupadravaya namah om gadadharaya namah ngapanaye namah om nandakine namah om shankhadharakaya
    namah om anekamurtaye namah om avyaktaya namah om katihastaya namah om varapradaya namah om anekatmane
    namah om dinabandhave namah om artalokabhayapradaya namah om akasharajavaradaya namah om yogihritpadmamandiraya
    namah om damodaraya namah om jagatpalaya namah om papaghnaya namah om bhaktavatsalaya namah om trivikramaya
    namah om shimshumaraya namah om jatamakuta shobhitaya namah om shankhamadyollasa nmanjukinkinyadhyakarandakaya
    namah om nilamoghashyama tanave namah om bilvapatrarcana priyaya namah om jagadvyapine namah om jagatkartre
    namah om jagatsakshine namah om jagatpataye namah om cintitarthapradaya namah om jishnave namah om
    dasharhaya namah om dasharupavate namah om devaki nandanaya namah om shauraye namah om hayagrivaya
    namah om janardanaya namah om kanyashravanatarejyaya namah om pitambaradharaya namah om anaghaya namah
    om vanamaline namah om padmanabhaya namah om mrigayasakta manasaya namah om ashvarudhaya namah om
    khadgadharine namah om dhanarjana samutsukaya namah om ghanasara lasanmadhyakasturi tilakojjvalaya
    namah om saccitanandarupaya namah om jaganmangala dayakaya namah om yajnarupaya namah om yajnabhoktre
    namah om cinmayaya namah om parameshvaraya namah om paramarthapradayakaya namah om shantaya namah
    om shrimate namah om dordanda vikramaya namah om paratparaya namah om parasmai brahmane namah om shrivibhave
    namah om jagadishvaraya namah iti shrivenkateshvarashtottara shatanamavalih sampurnah
