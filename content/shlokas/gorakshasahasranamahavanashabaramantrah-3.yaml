    mrityunjayasvarupa namo svaha | om kevala yoga dvara prapti ko prapta karane vale namo svaha | om
    bhairava shaktirupa namo svaha | om shabara mantra pracita namo svaha | om tantra mantra mahasiddha
    namo svaha | om yogya margadashaka namo svaha | om sarva sarvatah guru satagurusvarupa namo svaha
