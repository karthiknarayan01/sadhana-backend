id: renukasaptakam
category: stotram
name:
  english: renukasaptakam
  devanagari: रेणुकासप्तकम्
content:
  english: shrirenukasaptakam shriganeshaya namah | purato vilokya vrishabham parshve lingam paratparasya
    vibhoh | prishthe skandaganeshau tvam kalim manmahe matah || 1|| na tvam lakshmimatah yallakshminayakasya
    mata'si | janayitri rakshasareh tasmattvam manmahe kalim || 2|| samharanayikatvat maritvadugravesharupatvat
    | madhyamalokanivasat tvam kalim manmahe matah || 3|| jamadagnih shivabhagah bhagastvam devi shailakanyayah
    | evam jnatva yastvam bhajati sa dhanyo mahabhagah || 4|| tvam candikam pracandamahustantrani janimatam
    matah | tasmattvam shivakanta na shrirna preyasi ca vidheh || 5|| gauri shrirva vagva na vishesho
    jagati bhaktalokasya | mama tu vishishta gauri sakshadasyah suto yadaham || 6|| tisrishu paradevatasu
    shreshthatvam nocyate mayaikasyah | pritirme girijayam lakshmito bharatitashca || 7|| || iti shribhagavanmaharshiramanantevasino
    vasishthasya narasimhasunorganapateh kritih renukasaptakam samaptam ||
  devanagari: श्रीरेणुकासप्तकम् श्रीगणेशाय नमः । पुरतो विलोक्य वृषभं पार्श्वे लिङ्गं परात्परस्य विभोः
    । पृष्ठे स्कन्दगणेशौ त्वां कालीं मन्महे मातः ॥ १॥ न त्वं लक्ष्मीमातः यल्लक्ष्मीनायकस्य माताऽसि । जनयित्रि
    राक्षसारेः तस्मात्त्वां मन्महे कालीम् ॥ २॥ संहारनायिकत्वात् मारीत्वादुग्रवेषरूपत्वात् । मध्यमलोकनिवासात्
    त्वां कालीं मन्महे मातः ॥ ३॥ जमदग्निः शिवभागः भागस्त्वं देवि शैलकन्यायाः । एवं ज्ञात्वा यस्त्वां भजति
    स धन्यो महाभागः ॥ ४॥ त्वां चण्डिकां प्रचण्डामाहुस्तन्त्राणि जनिमतां मातः । तस्मात्त्वं शिवकान्ता न
    श्रीर्न प्रेयसी च विधेः ॥ ५॥ गौरी श्रीर्वा वाग्वा न विशेषो जगति भक्तलोकस्य । मम तु विशिष्टा गौरी साक्षादस्याः
    सुतो यदहम् ॥ ६॥ तिसृषु परदेवतासु श्रेष्ठत्वं नोच्यते मयैकस्याः । प्रीतिर्मे गिरिजायां लक्ष्मीतो भारतीतश्च
    ॥ ७॥ ॥ इति श्रीभगवन्महर्षिरमणान्तेवासिनो वासिष्ठस्य नरसिंहसूनोर्गणपतेः कृतिः रेणुकासप्तकं समाप्तम्
    ॥
