id: sri-pratyangira-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Pratyangira Ashtottara Sata Namavali
content:
  english: om pratyangirayai namah | om onkararupinyai namah | om ksham hram bijapreritayai namah | om
    vishvarupastyai namah | om virupakshapriyayai namah | om rinmantraparayanapritayai namah | om kapalamalalankritayai
    namah | om nagendrabhushanayai namah | om nagayajnopavitadharinyai namah | om kuncitakeshinyai namah
    | | om kapalakhatvangadharinyai namah | om shulinyai namah | om raktanetrajvalinyai namah | om caturbhujayai
    namah | om damarukadharinyai namah | om jvalakaralavadanayai namah | om jvalajihvayai namah | om karaladamshtrayai
    namah | om abhicarikahomagnisamutthitayai namah | om simhamukhayai namah | | om mahishasuramardinyai
    namah | om dhumralocanayai namah | om krishnangayai namah | om pretavahanayai namah | om pretasanayai
    namah | om pretabhojinyai namah | om raktapriyayai namah | om shakamamsapriyayai namah | om ashtabhairavasevitayai
    namah | om dakiniparisevitayai namah | | om madhupanapriyayai namah | om balipriyayai namah | om simhavahanayai
    namah | om simhagarjinyai namah | om paramantravidarinyai namah | om parayantravinashinyai namah |
    om parakrityavidhvamsinyai namah | om guhyavidyayai namah | om siddhavidyayai namah | om yonirupinyai
    namah | | om navayonicakratmikayai namah | om virarupayai namah | om durgarupayai namah | om mahabhishanayai
    namah | om ghorarupinyai namah | om mahakrurayai namah | om himacalanivasinyai namah | om varabhayapradayai
    namah | om vishurupayai namah | om shatrubhayankaryai namah | | om vidyudghatayai namah | om shatrumurdhasphotanayai
    namah | om vidhumagnisamaprabhayai namah | om mahamayayai namah | om maheshvarapriyayai namah | om
    shatrukaryahanikaryai namah | om mamakaryasiddhikarye namah | om shatrunam udyogavighnakaryai namah
    | om mamasarvodyogavashyakaryai namah | om shatrupashuputravinashinyai namah | | om trinetrayai namah
    | om surasuranishevitayai namah | om tivrasadhakapujitayai namah | om navagrahashasinyai namah | om
    ashritakalpavrikshayai namah | om bhaktaprasannarupinyai namah | om anantakalyanagunabhiramayai namah
    | om kamarupinyai namah | om krodharupinyai namah | om moharupinyai namah | | om madarupinyai namah
    | om ugrayai namah | om narasimhyai namah | om mrityumrityusvarupinyai namah | om animadisiddhipradayai
    namah | om antashshatruvidarinyai namah | om sakaladuritavinashinyai namah | om sarvopadravanivarinyai
    namah | om durjanakalaratryai namah | om mahaprajnayai namah | | om mahabalayai namah | om kalirupinyai
    namah | om vajrangayai namah | om dushtaprayoganivarinyai namah | om sarvashapavimocanyai namah |
    om nigrahanugraha kriyanipunayai namah | om icchajnanakriyashaktirupinyai namah | om brahmavishnushivatmikayai
    namah | om hiranyasatacchatayai namah | om indradidikpalakasevitayai namah | | om paraprayoga pratyak
    pracodinyai namah | om khadgamalarupinyai namah | om nrisimhasalagramanivasinyai namah | om bhaktashatrubhakshinyai
    namah | om brahmastrasvarupayai namah | om sahasrarashakyai namah | om siddheshvaryai namah | om yogishvaryai
    namah | om atmarakshanashaktidayinyai namah | om sarvavighnavinashinyai namah | | om sarvantakanivarinyai
    namah | om sarvadushtapradushtashirashchedinyai namah | om atharvanavedabhasitayai namah | om shmashanavasinyai
    namah | om bhutabhetalasevitayai namah | om siddhamandalapujitayai namah | om mahabhairavapriyaya
    namah | om pratyangira bhadrakali devatayai namah |
  devanagari: ॐ प्रत्यङ्गिरायै नमः । ॐ ओङ्काररूपिण्यै नमः । ॐ क्षं ह्रां बीजप्रेरितायै नमः । ॐ विश्वरूपास्त्यै
    नमः । ॐ विरूपाक्षप्रियायै नमः । ॐ ऋङ्मन्त्रपारायणप्रीतायै नमः । ॐ कपालमालालङ्कृतायै नमः । ॐ नागेन्द्रभूषणायै
    नमः । ॐ नागयज्ञोपवीतधारिण्यै नमः । ॐ कुञ्चितकेशिन्यै नमः । । ॐ कपालखट्वाङ्गधारिण्यै नमः । ॐ शूलिन्यै
    नमः । ॐ रक्तनेत्रज्वालिन्यै नमः । ॐ चतुर्भुजायै नमः । ॐ डमरुकधारिण्यै नमः । ॐ ज्वालाकरालवदनायै नमः
    । ॐ ज्वालाजिह्वायै नमः । ॐ करालदंष्ट्रायै नमः । ॐ आभिचारिकहोमाग्निसमुत्थितायै नमः । ॐ सिंहमुखायै नमः
    । । ॐ महिषासुरमर्दिन्यै नमः । ॐ धूम्रलोचनायै नमः । ॐ कृष्णाङ्गायै नमः । ॐ प्रेतवाहनायै नमः । ॐ प्रेतासनायै
    नमः । ॐ प्रेतभोजिन्यै नमः । ॐ रक्तप्रियायै नमः । ॐ शाकमांसप्रियायै नमः । ॐ अष्टभैरवसेवितायै नमः ।
    ॐ डाकिनीपरिसेवितायै नमः । । ॐ मधुपानप्रियायै नमः । ॐ बलिप्रियायै नमः । ॐ सिंहावाहनायै नमः । ॐ सिंहगर्जिन्यै
    नमः । ॐ परमन्त्रविदारिण्यै नमः । ॐ परयन्त्रविनाशिन्यै नमः । ॐ परकृत्याविध्वंसिन्यै नमः । ॐ गुह्यविद्यायै
    नमः । ॐ सिद्धविद्यायै नमः । ॐ योनिरूपिण्यै नमः । । ॐ नवयोनिचक्रात्मिकायै नमः । ॐ वीररूपायै नमः । ॐ
    दुर्गारूपायै नमः । ॐ महाभीषणायै नमः । ॐ घोररूपिण्यै नमः । ॐ महाक्रूरायै नमः । ॐ हिमाचलनिवासिन्यै नमः
    । ॐ वराभयप्रदायै नमः । ॐ विषुरूपायै नमः । ॐ शत्रुभयङ्कर्यै नमः । । ॐ विद्युद्घातायै नमः । ॐ शत्रुमूर्धस्फोटनायै
    नमः । ॐ विधूमाग्निसमप्रभायै नमः । ॐ महामायायै नमः । ॐ माहेश्वरप्रियायै नमः । ॐ शत्रुकार्यहानिकर्यै
    नमः । ॐ ममकार्यसिद्धिकर्ये नमः । ॐ शात्रूणां उद्योगविघ्नकर्यै नमः । ॐ ममसर्वोद्योगवश्यकर्यै नमः ।
    ॐ शत्रुपशुपुत्रविनाशिन्यै नमः । । ॐ त्रिनेत्रायै नमः । ॐ सुरासुरनिषेवितायै नमः । ॐ तीव्रसाधकपूजितायै
    नमः । ॐ नवग्रहशासिन्यै नमः । ॐ आश्रितकल्पवृक्षायै नमः । ॐ भक्तप्रसन्नरूपिण्यै नमः । ॐ अनन्तकल्याणगुणाभिरामायै
    नमः । ॐ कामरूपिण्यै नमः । ॐ क्रोधरूपिण्यै नमः । ॐ मोहरूपिण्यै नमः । । ॐ मदरूपिण्यै नमः । ॐ उग्रायै
    नमः । ॐ नारसिंह्यै नमः । ॐ मृत्युमृत्युस्वरूपिण्यै नमः । ॐ अणिमादिसिद्धिप्रदायै नमः । ॐ अन्तश्शत्रुविदारिण्यै
    नमः । ॐ सकलदुरितविनाशिन्यै नमः । ॐ सर्वोपद्रवनिवारिण्यै नमः । ॐ दुर्जनकालरात्र्यै नमः । ॐ महाप्राज्ञायै
    नमः । । ॐ महाबलायै नमः । ॐ कालीरूपिण्यै नमः । ॐ वज्राङ्गायै नमः । ॐ दुष्टप्रयोगनिवारिण्यै नमः । ॐ
    सर्वशापविमोचन्यै नमः । ॐ निग्रहानुग्रह क्रियानिपुणायै नमः । ॐ इच्छाज्ञानक्रियाशक्तिरूपिण्यै नमः ।
    ॐ ब्रह्मविष्णुशिवात्मिकायै नमः । ॐ हिरण्यसटाच्छटायै नमः । ॐ इन्द्रादिदिक्पालकसेवितायै नमः । । ॐ परप्रयोग
    प्रत्यक् प्रचोदिन्यै नमः । ॐ खड्गमालारूपिण्यै नमः । ॐ नृसिंहसालग्रामनिवासिन्यै नमः । ॐ भक्तशत्रुभक्षिण्यै
    नमः । ॐ ब्रह्मास्त्रस्वरूपायै नमः । ॐ सहस्रारशक्यै नमः । ॐ सिद्धेश्वर्यै नमः । ॐ योगीश्वर्यै नमः ।
    ॐ आत्मरक्षणशक्तिदायिन्यै नमः । ॐ सर्वविघ्नविनाशिन्यै नमः । । ॐ सर्वान्तकनिवारिण्यै नमः । ॐ सर्वदुष्टप्रदुष्टशिरश्छेदिन्यै
    नमः । ॐ अथर्वणवेदभासितायै नमः । ॐ श्मशानवासिन्यै नमः । ॐ भूतभेतालसेवितायै नमः । ॐ सिद्धमण्डलपूजितायै
    नमः । ॐ महाभैरवप्रियाय नमः । ॐ प्रत्यङ्गिरा भद्रकाली देवतायै नमः ।
