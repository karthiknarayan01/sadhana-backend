id: maitravarunikritamsarasvatistotram
category: stotram
name:
  english: maitravarunikritamsarasvatistotram
  devanagari: मैत्रावरुणिकृतंसरस्वतीस्तोत्रम्
content:
  english: maitravarunikritam sarasvatistotram pitamahasya sarasah pravrittasi sarasvati | vyaptam cedam
    jagatsarvam tavaivambhobhiruttamaih || 29|| tvamevakashaga devi megheshutsrijase payah | sarvashcapastvameveti
    tvatto vayamadhimahe || 30|| pushtirdyutistatha kirtih siddhirvriddhiruma tatha | tvameva vani svaha
    tvam tvayyayattamidam jagat || 31|| tvameva sarvabhuteshu vasasiha caturvidha || 31|| iti mahabharate
    shalyaparvani 41 adhyayantargatam maitravarunikritam sarasvatistotram sampurnam | mahabharata | shalyaparva
    | adhyaya 41
  devanagari: मैत्रावरुणिकृतं सरस्वतीस्तोत्रम् पितामहस्य सरसः प्रवृत्तासि सरस्वति । व्याप्तं चेदं जगत्सर्वं
    तवैवाम्भोभिरुत्तमैः ॥ २९॥ त्वमेवाकाशगा देवि मेघेषूत्सृजसे पयः । सर्वाश्चापस्त्वमेवेति त्वत्तो वयमधीमहे
    ॥ ३०॥ पुष्टिर्द्युतिस्तथा कीर्तिः सिद्धिर्वृद्धिरुमा तथा । त्वमेव वाणी स्वाहा त्वं त्वय्यायत्तमिदं
    जगत् ॥ ३१॥ त्वमेव सर्वभूतेषु वससीह चतुर्विधा ॥ ३१॥ इति महाभारते शल्यपर्वणि ४१ अध्यायान्तर्गतं मैत्रावरुणिकृतं
    सरस्वतीस्तोत्रं सम्पूर्णम् । महाभारत । शल्यपर्व । अध्याय ४१
meaning: {}
