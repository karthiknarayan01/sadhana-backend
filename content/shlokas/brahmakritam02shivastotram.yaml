id: brahmakritam02shivastotram
category: stotram
name:
  english: brahmakritam02shivastotram
  devanagari: ब्रह्मकृतं०२शिवस्तोत्रम्
content:
  english: brahmakritam 2 shivastotram tadantare shivam devah sendrah sabrahmakah prabhum || 31|| samprapya
    tushtavuh sarvam vijnapya mrigarupinah | tato brahmadayasturnam samstuya parameshvaram || 32|| atmatranaya
    sharanam jagmuh paramakaranam | mandarastham mahadevam kridamanam sahomaya || 33|| sevitam ganagandharvaih
    siddhairapsarasam ganaih | devatabhih saha brahma bhitabhitah sagadgadam | pranamya dandavadbhumau
    tushtava parameshvaram || 34|| brahmovaca | namaste kalakalaya namaste rudra manyave | namah shivaya
    rudraya shankaraya shivaya te || 35|| ugro'si sarvabhutanam niyantasi shivo'si nah | namah shivaya
    sharvaya shankarayarttiharine || 36|| mayaskaraya vishvaya vishnave brahmane namah | antakaya namastubhyamumayah
    pataye namah || 37|| hiranyabahave sakshaddhiranyapataye namah | sharvaya sarvarupaya purushaya namo
    namah || 38|| sadasadvyaktihinaya mahatah karanaya te | nityaya vishvarupaya jayamanaya te namah ||
    39|| jataya bahudha loke prabhutaya namo namah | rudraya nilarudraya kadrudraya pracetase || 40||
    kalaya kalapupaya namah kalangaharine | midhushtamaya devaya shitikanthaya te namah || 41|| mahiyase
    namastubhyam hantre devarinam sada | taraya ca sutaraya taranaya namo namah || 42|| harikeshaya devaya
    shambhave paramatmane | devanam shambhave tubhyam bhutanam shambhave namah || 43|| shambhave haimavatyashca
    manyave rudrarupine | kapardine namastubhyam kalakanthaya te namah || 44|| hiranyaya maheshaya shrikanthaya
    namo namah | bhasmadigdhashariraya dandamundishvaraya ca || 45|| namo hrasvaya dirghaya vamanaya namo
    namah | nama ugratrishulaya ugraya ca namo namah || 46|| bhimaya bhimarupaya bhimakarmarataya te |
    agrevadhaya vai bhutva namo durevadhaya ca || 47|| dhanvine shuline tubhyam gadine haline namah |
    cakrine varmine nityam daityanam karmabhedine || 48|| sadyaya sadyarupaya sadyojataya te namah | vamaya
    vamarupaya vamanetraya te namah || 49|| aghorarupaya vikataya vikatashariraya te namah | purusharupaya
    purushaikatatpurushaya vai namah || 50|| purusharthapradanaya pataye parameshthine | ishanaya namastubhyamishvaraya
    namo namah || 51|| brahmane brahmarupaya namah sakshacchivaya te | sarvavishnurnrisimhasya rupamasthaya
    vishvakrit || 52|| hiranyakashipum hatva karajairnishitaih svayam | daityendrairbahubhih sardham hitartham
    jagatam prabhuh || 53|| saimhim samanayanyonim badhate nikhilam jagat | yatkrityamatra devesha tatkurushva
    bhavaniha || 54|| ugro'si sarvadushtanam niyametasi shivo'si nah | kalakutadivapusha trahi nah sharanagatan
    || 55|| shukram tu vrittam vishveshakrida vai kevalam vayam | tavonmeshanimeshabhyamasmakam pralayodayau
    || 56|| unmilaye ttvayi brahmanvinasho'sti na te shiva | santaptah smo vayam deva harinamitatejasa
    || 57|| sarvalokahitayainam tattvam samharttumicchasi | iti shrilingamahapurane purvabhage pancanavatitamadhyayantargatam
    brahmakritam shivastotram samaptam | lingapurana | purvabhaga | adhyaya 95
  devanagari: ब्रह्मकृतं २ शिवस्तोत्रम् तदन्तरे शिवं देवाः सेन्द्राः सब्रह्मकाः प्रभुम् ॥ ३१॥ सम्प्राप्य
    तुष्टवुः सर्वं विज्ञाप्य मृगरूपिणः । ततो ब्रह्मादयस्तूर्णं संस्तूय परमेश्वरम् ॥ ३२॥ आत्मत्राणाय शरणं
    जग्मुः परमकारणम् । मन्दरस्थं महादेवं क्रीडमानं सहोमया ॥ ३३॥ सेवितं गणगन्धर्वैः सिद्धैरप्सरसां गणैः
    । देवताभिः सह ब्रह्मा भीतभीतः सगद्गदम् । प्रणम्य दण्डवद्भूमौ तुष्टाव परमेश्वरम् ॥ ३४॥ ब्रह्मोवाच ।
    नमस्ते कालकालाय नमस्ते रुद्र मन्यवे । नमः शिवाय रुद्राय शङ्कराय शिवाय ते ॥ ३५॥ उग्रोऽसि सर्वभूतानां
    नियन्तासि शिवोऽसि नः । नमः शिवाय शर्वाय शङ्करायार्त्तिहारिणे ॥ ३६॥ मयस्कराय विश्वाय विष्णवे ब्रह्मणे
    नमः । अन्तकाय नमस्तुभ्यमुमायाः पतये नमः ॥ ३७॥ हिरण्यबाहवे साक्षाद्धिरण्यपतये नमः । शर्वाय सर्वरूपाय
    पुरुषाय नमो नमः ॥ ३८॥ सदसद्व्यक्तिहीनाय महतः कारणाय ते । नित्याय विश्वरूपाय जायमानाय ते नमः ॥ ३९॥
    जाताय बहुधा लोके प्रभूताय नमो नमः । रुद्राय नीलरुद्राय कद्रुद्राय प्रचेतसे ॥ ४०॥ कालाय कालपूपाय नमः
    कालाङ्गहारिणे । मीढुष्टमाय देवाय शितिकण्ठाय ते नमः ॥ ४१॥ महीयसे नमस्तुभ्यं हन्त्रे देवारिणां सदा ।
    ताराय च सुताराय तारणाय नमो नमः ॥ ४२॥ हरिकेशाय देवाय शम्भवे परमात्मने । देवानां शम्भवे तुभ्यं भूतानां
    शम्भवे नमः ॥ ४३॥ शम्भवे हैमवत्याश्च मन्यवे रुद्ररूपिणे । कपर्दिने नमस्तुभ्यं कालकण्ठाय ते नमः ॥ ४४॥
    हिरण्याय महेशाय श्रीकण्ठाय नमो नमः । भस्मदिग्धशरीराय दण्डमुण्डीश्वराय च ॥ ४५॥ नमो ह्रस्वाय दीर्घाय
    वामनाय नमो नमः । नम उग्रत्रिशूलाय उग्राय च नमो नमः ॥ ४६॥ भीमाय भीमरूपाय भीमकर्मरताय ते । अग्रेवधाय
    वै भूत्वा नमो दूरेवधाय च ॥ ४७॥ धन्विने शूलिने तुभ्यं गदिने हलिने नमः । चक्रिणे वर्मिणे नित्यं दैत्यानां
    कर्मभेदिने ॥ ४८॥ सद्याय सद्यरूपाय सद्योजाताय ते नमः । वामाय वामरूपाय वामनेत्राय ते नमः ॥ ४९॥ अघोररूपाय
    विकटाय विकटशरीराय ते नामः । पुरुषरूपाय पुरुषैकतत्पुरुषाय वै नमः ॥ ५०॥ पुरुषार्थप्रदानाय पतये परमेष्ठिने
    । ईशानाय नमस्तुभ्यमीश्वराय नमो नमः ॥ ५१॥ ब्रह्मणे ब्रह्मरूपाय नमः साक्षाच्छिवाय ते । सर्वविष्णुर्नृसिंहस्य
    रूपमास्थाय विश्वकृत् ॥ ५२॥ हिरण्यकशिपुं हत्वा करजैर्निशितैः स्वयम् । दैत्येन्द्रैर्बहुभिः सार्धं हितार्थं
    जगतां प्रभुः ॥ ५३॥ सैंहीं समानयन्योनिं बाधते निखिलं जगत् । यत्कृत्यमत्र देवेश तत्कुरुष्व भवानिह ॥
    ५४॥ उग्रोऽसि सर्वदुष्टानां नियमेतासि शिवोऽसि नः । कालकूटादिवपुषा त्राहि नः शरणागतान् ॥ ५५॥ शुक्रं
    तु वृत्तं विश्वेशक्रीडा वै केवलं वयम् । तवोन्मेषनिमेषाभ्यामस्माकं प्रलयोदयौ ॥ ५६॥ उन्मीलये त्त्वयि
    ब्रह्मन्विनाशोऽस्ति न ते शिव । सन्तप्ताः स्मो वयं देव हरिणामिततेजसा ॥ ५७॥ सर्वलोकहितायैनं तत्त्वं
    संहर्त्तुमिच्छसि । इति श्रीलिङ्गमहापुराणे पूर्वभागे पञ्चनवतितमाध्यायान्तर्गतं ब्रह्मकृतं शिवस्तोत्रं
    समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ९५
