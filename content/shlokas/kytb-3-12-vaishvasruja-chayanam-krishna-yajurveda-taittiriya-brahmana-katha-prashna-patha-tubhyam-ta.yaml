id: kytb-3-12-vaishvasruja-chayanam-krishna-yajurveda-taittiriya-brahmana-katha-prashna-patha-tubhyam-ta
category: stotram
name:
  english: KYTB 3.12 Vaishvasruja Chayanam - Krishna Yajurveda Taittiriya Brahmana Katha Prashna Patha
    - Tubhyam Ta
content:
  english: krishna yajurvediya taittiriya brahmane kathake tritiyah prashnah shri gurubhyo namah | harih
    om || catur vaishvasrijacayanangabhutah divashshyenaya ishtayah tubhya nta angirastama vishva ssukshitayah
    prithak | agne kamaya yemire || ashyama ta nkamamagne tavo tyashyama rayigm rayiva m | ashyama vajamabhi
    vajayanto 'shyama dyumnamajarajara ntva ''shapalebhyah | caturbhyo amrite mbhutasyadhyakshebhyah |
    vidhema havisha vayam || vishva asha madhuna sagmsrijami | anamiva apa oshadhayo bhavantu | ayam ya~jamano
    mridho vyasyatam agribhitah pashavah santu sarve ndeveshu manyatam | agnishca havyavahano bhavata
    ndashushe mayah || anvidanumate tva mmanyasai shancanah kridhi | kratve dakshaya no hinu prana ayugmshi
    tarishah || | kamo bhutasya bhavyasya | samradeko virajati | sa ida mprati paprathe | ritunu thsrijate
    vashi || kamastadagre samavartatadhi | manaso retah prathamam t | sato bandhumasati niravindann |
    hridi pratishya kavayo manisha || | brahma jajnana mpurastadvi simata ssuruco vena avah | sa budhniya
    upama asya vishtha ssatashca yonimasatashca vivah || pita virajamrishabho rayinam | antariksham vi~shvarupa
    avivesha | tamarkai rabhyarcanti vathsam | brahma santa mbrahmana vardhayantah || | yajno rayo yajna
    ishe vasunam | yajna ssasyanamuta sukshitinam | yajna ishtah purvacitti ndadhatu | yajno brahmanvagm
    apyetu devan || ayam ve~dih svapatya suvira mbarhirati barhig vi~shve avantu devah || | apo bhadra
    ghritamidapa asuragni shomau bibhratyapa i ttah | tivro raso madhuprica marangama a ma pranena saha
    varcasa gann || adi tpashyamyuta va shrinomya ma ghosho gacchati vanna asam | manye bhejano amritasya
    tar hi hiranyavarna atripam ya~da vah || | tubhya mbharanti kshitayo yavishtha | balimagne anti ta
    ota durat | a bhandishthasya sumati ncikiddhi | brihatte agne mahi sharma bhadram || yo dehyo anamayadvadhasnaih
    | yo aryapatni rushasashcakara | sa nirudhya nahusho yahvo agnih | vishashcakre balihrita ssahobhih
    || | purva nupashyanjanmabhih | janmanyavaraih parani | vedani deva ayamasmiti mam | ahagm hitva sharira
    t || pranapanau cakshu mmanasi sambhritam | hitva sharira va~yamashnavamahai || | havyavaha mpritanasu
    jishnum | jyotishmanta mpurandhim | agnigg svishtakritama huvema || svishtamagne abhi ta tprinahi
    | vishva deva pritana abhishya | uru mpradishanvi bhahi | jyotishmaddhehyajara mbrahmanam devebhyo
    vai svargo lokastiro 'bhavat | te prajapati mabruvann | prajapate svargo vai no lokastiro 'bhut |
    tamanviccheti | tam rnanvavindat | tamishtibhi ranvavindat | tadishtina mishtitvam | eshtayo havai
    nama | ta ishtaya ityacakshate parokshena | paroksha priya iva hi devah || 'bravit | prajapata ashaya
    vai shra myasi | ahamu va asha nnu yajasva | atha te satya ''sha bhavishyati | anu svargam ve~thsyasiti
    | sa etamagnaye kamaya purodasha nniravapat | ashayai carum | anumatyai carum | tato vai tasya satya
    ''sha 'bhavat | anu svargam mavindat | satya ha va asyasha bhavati | anu svargam vi~ndati | ya etena
    havisha yajate | ya u cainadevam 'tra juhoti | agnaye kamaya svaha | svargaya lokaya svaha svishtakrite
    svaheti || 'bravit | prajapate kamena vai shra myasi | ahamuvai kamo nnu yajasva | atha te satyah
    kamo bhavishyati | anu svargam ve~thsyasiti | sa etamagnaye kamaya purodasha nniravapat | kamaya carum
    | anumatyai carum | tato vai tasya satyah kamo 'bhavat | anu svargam lo~kamavindat | satyo ha va asya
    kamo bhavati | anu svargam vi~ndati | ya etena havisha yajate | ya u cainadevam 'tra juhoti | agnaye
    kamaya svaha kamaya svaha | svargaya lokaya svaha svishtakrite svaheti || 'bravit | prajapate brahmana
    vaishra myasi | ahamu vai brahma nnu yajasva | atha te brahmanvan yajno bhavishyati | anu svargam
    ve~thsyasiti | sa etamagnaye kamaya purodasha nniravapat | brahmane carum | anumatyai carum | tato
    vai tasya brahmanvan 'bhavat | anu svargam lo~kamavindat | brahmanvan ha va asya yajno bhavati | anu
    svargam vi~ndati | ya etena havisha yajate | ya ucainadevam 'tra juhoti | agnaye kamaya svaha brahmane
    svaha | svargaya lokaya svaha 'gnaye svishtakrite svaheti || 'bravit | prajapate yajnena vai shra
    myasi | ahamu vai yajno nnu yajasva | atha te satyo yajno bhavashyati | anu svargam ve~thsyasiti |
    sa etamagnaye kamaya purodasha nniravapat | yajnaya carum | anumatyai carum | tato vai tasya satyo
    yajno 'bhavat | anu svargam lo~kamavindat | satyo ha va asya yajno bhavati | anu svargam vi~ndati
    | ya etena havisha yajate | ya ucainadevam 'tra juhoti | agnaye kamaya svaha yajnaya svaha | svargaya
    lokaya svaha svishtakrite svaheti || 'bruvann | prajapate 'phsu vai sarve kama shshritah | vayamu
    va apassmah | asmannu yajasva | atha tvayi sarve kama shshrayishyante | anu svargam ve~thsyasiti |
    sa etamagnaye kamaya purodasha nniravapat | adbhyashcarum | anumatyai carum | tato vai tasmin thsarve
    kama ashrayanta | anu svargam lo~kamavindat | sarve ha va asmin kama shshrayante | anu svargam vi~ndati
    | ya etena havisha yajate | ya ucainadevam 'tra juhoti | agnaye kamaya svaha 'dbhya | svargaya lokaya
    svaha svishtakrite svaheti || || tamagni rbalimanabravit | prajapate 'gnaye vai balimate sarvani bhutani
    baligm haranti | ahamu va agni rbalimanasmi | ma nnu yajasva | atha te sarvani bhutani baligm harishyanti
    | anu svargam ve~thsyasiti | sa etamagnaye kamaya purodasha nniravapat | agnaye balimate carum | anumatyai
    carum | tato vai tasmai sarvani bhutani bali maharann | anu svargam lo~kamavindat | sarvani ha va
    asmai bhutani baligm haranti | anu svargam vi~ndati | ya etena havisha yajate | ya ucainadevam 'tra
    juhoti | agnaye kamaya svaha 'gnaye balimate svaha | svargaya lokaya svaha svishtakrite svaheti ||
    bravit | prajapate svargam vivithsasi | ahamu va anuvittirasmi | ma nnu yajasva | atha te satya 'nuvitti
    rbhavishyati | anu svargam ve~thsyasiti | sa etamagnaye kamaya purodasha nniravapat | anuvittyai carum
    | anumatyai carum | tato vai tasya satya 'nuvittirabhavat | anu svargam mavindat | satya ha va asyanuvitti
    rbhavati | anu svargam vi~ndati | ya etena havisha yajate | ya ucainadevam 'tra juhoti | agnaye kamaya
    svaha 'nuvittyai svaha | svargaya lokaya svaha svishtakrite svaheti || ssapta svargasya lokasya dvarah
    | diva shshyenayo 'nuvittayo nama | asha prathamagm rakshati | kamo m | brahma tritiya m | yajnashcaturthim
    | apah pancamim | agni rbaliman thshashthim | anuvitti ssaptamim | anu ha vai svargam vi~ndati | kamacaro
    'sya svarge loke bhavati | ya etabhi ryajate | ya ucaina evam ve~da | tasvanvishti | pashthauhi vara
    tkagm sanca | striyai cabharagm samriddhyai || upagha nameshtayah tapasa deva devata magra ayann |
    tapasar ssvaranvavindann | tapasa sapatna npranudamaratih | yenedam ya~dasti || prathamaja ndevagm
    havisha vidhema | svayabhu ntapo yat | sa eva putra ssa pita sa mata | tapo ha yaksha mprathamagm
    sambabhuva || shraddhaya devo devatva mashnute | shraddha pratishtha lokasya devi || || sa no jushanopa
    yajna t | kamavathsa 'mrita nduhana || shraddha devi prathamaja ritasya | vishvasya bhartri jagatah
    pratishtha | tag shraddhagm havisha yajamahe | sa no loka ndadhatu | ishana devi bhuvanasyadhipatni
    || aga ddeva jajnire bhuvananca vishve | tasmai vidhema havisha ghritena || mmadema || yasya pratishtho
    rvantariksham | yasma ddeva jajnire bhuvananca sarve rupamodamanam || manaso vashe sarvamida mbabhuva
    | nanyasya mano vashamanviyaya | bhishmo hi deva ssahiyan | sa no jushana upa yajnamaga vi~pashcim
    | mano rajanamiha vardhayantah | upahave 'sya sumatau syama || carana mpuranam | yena putastarati
    dushkritani | tena pavitrena shuddhena putah | ati papmana ntarema || lokasya dvara mmahasvat | amritasya
    dhara bahudha dohamanam | carana ndadhatu || agnirmurdha divah kaku tpatih prithivya ayam | apagm
    retagmsi jinvati || bhuvo yajnasya rajasashca neta yatra niyudbhi ssacase shivabhih | divi murdhana
    njihvamagne cakrishe havyavaha ndeveshu manyatam | agnishca havyavahano bhavata ndashushe mayah ||
    anvidanumate tva mmanyasai shancanah kridhi | kratve dakshaya no hinu prana ayugmshi tarishah || ||
    havyavaha mpritanasu jishnum | jyotishmanta mpurandhim | agnigg svishtakritama huvema || svishtamagne
    abhi ta tprinahi | vishva deva pritana abhishya | uru mpradishanvi bhahi | jyotishmaddhehyajara mbrahmanam
    devebhyo vai svargo lokastiro 'bhavat | te prajapati mabruvann | prajapate svargo vai no lokastiro
    'bhut | tamanviccheti | tam ya~jnakratubhi rnanvavindat | tamishtibhi ranvavindat | tadishtina mishtitvam
    | eshtayo ha vai nama | ta ishtaya itya cakshate parokshena | parokshapriya iva hi devah || ' bravit
    | prajapate tapasa vai shra myasi | ahamu vai tapo nnu yajasva | atha te satya ntapo bhavishyati |
    anu svargam ve~thsyasiti | sa etama nniravapat | tapase carum | anumatyai carum | tato vai tasya satya
    ntapo 'bhavat | anu svargam lo~kamavindat | satya gm ha va asya tapo bhavati | anu svargam vi~ndati
    | ya etena havisha yajate | ya u cainadevam 'tra juhoti | agnaye svaha tapase svaha | svargaya lokaya
    svaha svishtakrite svaheti || 'bravit | prajapate shraddhaya vai shra myasi | ahamu vai shraddha nnu
    yajasva | atha te satya shraddha bhavishyati | anu svargam ve~thsyasiti | sa etama nniravapat | shraddhayai
    carum | anumatyai carum | tato vai tasya satya shraddha 'bhavat | anu svargam lo~kamavindat | satya
    ha va asya shraddha bhavati | anu svargam vi~ndati | ya etena havisha yajate | ya u cainadevam 'tra
    juhoti | agnaye svaha | svargaya lokaya svaha svishtakrite svaheti || mabravit | prajapate satyena
    vai shra myasi | ahamu vai satyamasmi | ma nnu yajasva | atha te satyagm satya mbhavishyati | anu
    svargam ve~thsyasiti | sa etama nniravapat | satyaya carum | anumatyai carum | tato vai tasya satyagm
    satyamabhavat | anu svargam lo~kamavindat | satyagm ha va asya satya mbhavati | anu svargam vi~ndati
    | ya etena havisha yajate | ya ucainadevam 'tra juhoti | agnaye svaha satyaya svaha | svargaya lokaya
    svaha svishtakrite svaheti || 'bravit | prajapate manasa vai shra myasi | ahamu vai mano nnu yajasva
    | atha te satya mmano bhavishyati | anu svargam ve~thsyasiti | sa etama nniravapat | manase carum
    | anumatyai carum | tato vai tasya satya 'bhavat | anu svargam lo~kamavindat | satyagm ha va asya
    mano bhavati | anu svargam vi~ndati | ya etena havisha yajate | ya ucaina devam 'tra juhoti | agnaye
    svaha manase svaha | svargaya lokaya svaha svishtakrite svaheti || mabravit | prajapate caranena vai
    shra myasi | ahamu vai caranamasmi | ma nnu yajasva | atha te satya mbhavishyati | anu svargam ve~thsyasiti
    | sa etama nniravapat | caranaya carum | anumatyai carum | tato vai tasya satya ncaranamabhavat |
    anu svargam lo~kamavindat | satyagm ha va asya carana mbhavati | anusvargam vi~ndati | ya etena havisha
    yajate | ya ucainadevam 'tra juhoti | agnaye svaha caranaya svaha | svargaya lokaya svaha svishtakrite
    svaheti || || ta va etah panca svargasya lokasya dvarah | apagha anuvittayo nama | tapah prathamagm
    rakshati | shraddha dvitiya m | manashcaturthim | carana mpancamim | anu ha vai svargam vi~ndati |
    kamacaro 'sya svarge loke bhavati | ya etabhi ryajate | ya ucaina evam hotracayanam brahma vai catur
    'dhi yajno nirmitah | nainagm shaptam | nabhicarita ve~da || yo ha vai catur ve~da | atho panca hotritvam
    | sarva hasmai dishah kalpante | vacaspatir hota dashahotrinam | prithivi hota catur hota pancahotrinam
    | vaghota shaddhotrinam | mahahavir hota saptahotrinam | etadvai catur hotritvam | atho pancahotritvam
    | sarva hasmai dishah kalpante | ya evam ve~da || esha vai sarva vidya | eta dbheshajam | esha pankti
    ssvargasya lokasya tyachadirdarshe yavattarasa m | svareti | anapabrava ssarvamayureti | vindate prajam
    | rayasposha ngaupatyam | brahmavarcasi bhavati || etan 'ddhyaiti | sprinotyatmana va aruna aupaveshi
    rvidancakara || || etairadhivadamapajayat | atho vishva m | svaryayau | etan 'ddhyaiti | adhivada
    njayati | atho vishva m | svareti || etairagni ncinvita svargakamah | etairayushkamah | praja pashukamo
    va || mupadadhati yavatpadam | hridayam ya~jushi patnyau ca | dakshinatah pranca hotaram | pashcadudanca
    mpanca hotaram | uttaratah prancagm shaddhotaram | uparishta tprancagm saptahotaram | hridayam ya~jugmshi
    patnyashca | yathavakasha ngrahan | yathavakasha mpratigrahan ~loka mprinashca | sarva hasyaita devatah
    prita abhishta bhavanti || ncinute || rathasaminta shcetavyah | vajro vai rathah | vajrenaiva papmana
    shcetavyah | etavan vai rathah | yavatpakshah | rathasamintameva cinute || imameva loka mpashubandhenabhijayati
    | atho agnishtomena || mukthyena | svaratiratrena | sarva n ~lokanahinena | atho satrena || varo dakshina
    | varenaiva varagg sprinoti | atma hi varah || ekavigmshati rdakshina dadati | ekavigmsho va ita ssvargo
    lokah | prasvargam || asavaditya ekavigmshah | amumeva ndadati | shatayuh purusha shshatendriyah |
    ayushyevendriye pratitishthati || sahasra ndadati | sahasra sammita ssvargo lokah | svargasya lokasya
    bhijityai || anvishtaka ndakshina dadati | sarvani vayagmsi || varuddhyai || yadi na vindeta | manthanetavato
    dadyadodanan m | yasmai kamaya ndadyat | sa hi sarvani vayagmsi | sarvasyaptyai lo~kameti || vaso
    dadati | tenayuh pratirate || veditritiye yajeta | trishatya hi devah | sa satyamagni tpashubandhe
    brahmana mbruyat | netareshu yajneshu || yo ha vai catur || tripyati prajaya pashubhih | upainagm
    somapitho namati | ete vai catur hmana bahuvidah | tebhyo yaddakshina na naye syat | agnimasya vrinjirann
    | tebhyo yatha shraddha ndadyat | svishtamevaitatkriyate | nasyagnim || hiranyeshtako bhavati | yavaduttama
    ya~jna parusha sammitam | tejo hiranyam || yadi hiranya nna vindet | sharkara akta upadaddhyat | tejo
    ghritam | satejasame ncinute || agnincitva sau tramanya yajeta maitravarunya va | viryena va esha
    vyriddhyate | yo ssayujyagm salokata mapnoti | etasameva devatanagm sayujyam | sar shtitagm samana
    lokata mapnoti | ya etamagni ncinute | ya ucainamevam ve~da || etadeva savitre brahmanam | atho nacikete
    || sarvasyaptyai sarvasyavaruddhyai vaishvasrijacayanam yaccamritam m | yacca praniti yacca na | sarvasta
    ishtakah kritva | upa kamadugha dadhe | tenar shina tena brahmana | taya devataya ddhruva sida ||
    sarva pumanca yat | sarvastah || yavantah pagmsavo bhumeh || sankhyata devamayaya | sarvastah || yavanta
    ushah pashunam | prithivya hitah | sarvastah || yavati | aphsvantashca ya shshritah | sarvastah ||
    yavati || sarvastah || yavanto mprithivyam | pratishthasu pratishthitah | sarvastah || yavati rvirudha
    | vishthitah prithivimanu | sarvastah || yavatiroshadhi | vishthitah prithivimanu | sarvastah || ||
    yavanto vanaspatayah | asya mprithivyamadhi | sarvastah || yavanto gramyah pashava | aranyashca ye
    | sarvastah || ye dvipada shcatushpadah | apada udarasarpinah | sarvastah || yavadanja || devatra
    yacca manusham | sarvastah || yavatkrishnayasagm sarva m | devatra yacca manusham | sarvastah || yava
    llohayasagm sarva m | devatra yacca manusham | sarvastah || sarvagm sisagm sarva ntrapu | devatra
    yacca manusham || || sarvastah || sarvagm hiranyagm rajatam | devatra yacca manusham | sarvastah ||
    sarvagm suvarnagm haritam | devatra yacca manusham | sarvasta ishtakah kritva | upakamadugha dadhe
    | tenar shina tena brahmana | taya devataya vishthitah prithivimanu sarvasta yacca striyah pagmsava
    usha shsharkara ashmano virudha oshadhi rvanaspatayo gramya ye dvipado yavadanjanam tkrishnayasam
    ~lohayasagm sisagm hiranyagm suvarnagm haritamashtadasha vaishvasrijacayanam sarva disho dikshu |
    yaccanta rbhuta mpratishthitam | sarvasta ishtakah kritva | upa kamadugha dadhe | tenar shina tena
    brahmana | taya devataya ddhruva sida || antarikshanca kevalam | yaccasmi nnantarahitam | sarvastah
    || antarikshyashca yah prajah || phsarasashca ye | sarvastah || sarva thsalilan | antarikshe pratishthitan
    | sarvastah || sarva thsalilan | sthavarah proshya shca ye | sarvastah || sarva dhvagmsan | himo yacca
    shiyate || sarvastah || sarva vitatan | niharo yacca shiyate | sarvastah || sarva vidyuta thstanayitnun
    | hraduni ryacca shiyate | sarvastah || sarva ssaritah | sarvamaphsu caranca yat | sarvastah || ||
    yashca kupya yashca nadya | yashca vaishantiruta prasaciryah | sarvastah || ye cottishthanti jimutah
    shanti vrishtayah | sarvastah || tapasteja akasham | yaccakashe pratishthitam | sarvastah || vayum
    va~yagmsi sarvani || || antarikshacaranca yat | sarvastah || agnigm surya ncandram | mitram m | sarvastah
    || satyagg m | nama rupanca bhutana m | sarvasta ishtakah kritva | upa kamadugha dadhe | tenar shina
    tena brahmana | taya devataya 'ntarikshamantarikshya udaranudara vidyutah sravantiryashca ye ca tapo
    vayumagnigm satya vaishvasrijacayanam sarva ndivi | yaccanta rbhuta mpratishthitam | sarvasta ishtakah
    kritva | upa kamadugha dadhe | tenar shina tena brahmana | taya devataya dhruva sida || yavati staraka
    | vitata rocane divi | sarvastah || rico yajugmshi samani || || atharvangirasashca ye | sarvastah
    || itihasapurananca | sarpadevajanashca ye | sarvastah || ye ca loka ye calokah | anta rbhuta mpratishthitam
    | sarvastah || yacca brahma yacca brahma | anta rbrahma || sarvastah || ahoratrani sarvani | adrdhamasag
    shca kevalan | sarvastah || sarvanritun va~thsaranca kevalam | sarvastah || sarva 'dhi bhavishyati
    | sarvasta ishtakah kritva | upa kamadugha dadhe | tenar shina tena brahmana | taya devataya ntaraka
    rica itihasapurana nca ye ca yaccahoratranyritu brahma sadasyasino vaushvasrijan vyacashte rica mpraci
    mahati digucyate | dakshina mahu ryajushamaparam | atharvana mudici mahati digucyate || rigbhih pu
    rvahne divi deva iyate | yajurvede tishthati maddhye ahnah | samavede stamaye mahiyate | vedai stribhireti
    suryah || rigbhyo jatagm sarvasho murti mahuh | sarva gati ryajushi haiva shashvat || nteja ssamarupyagm
    ha shashvat | sarvagm heda mbrahmana haiva srishtam || rigbhyo jatam m | samavedo bra mprasutih |
    purve purve ncinvanah | purve vishva srijo sha sahasrani | dikshita dgrihapatih | brahma brahmabhava
    thsvayam | satyagm ha ho taishamasi dvishvasrija asata || amrita mebhya udagayat | sahasra mparivathsaran
    | bhutagm ha prasto taishamasi tprati caharat || prano addhvaryu rabhavat | idagm sarvagm sishasatam
    || navritah | prati pratishtha daddhvare || artava upagatarah | sadasya ritavo 'bhavann | ardhamasashca
    masa 'bhavann || ashagm sa stejah | acchavako 'bhava dvishva srija asata || mudavahat | dhruva gopa
    dvishva srija asata || apacitih potriya mayajat | neshtriya dvidushi satyam | shraddha haiva yaja
    thsvayam || ira patni vishva srija || iddhmagm ha kshuc cai bhya ugre | trishna ca vahatamubhe ||
    vageshagm subrahmanya t | chando yogan vijanati | kalpatantrani tanvana 'hah | saggsthashca sarvashah
    || ahoratre pashupalyau | muhurtah preshya abhavann | mrityus tada ddhata | shamito gro visha || vishvasrijah
    prathama mprasutena yantah | tato ha jajne bhuvanasya gopah | hiranmayah shakuni rbrahma nama || yena
    surya ddhah | pita putrena pitriman yoniyonau | navedavi matmanagm samparaye || esha nityo mahima
    bra hmanasya | na karmana vardhate no kaniyan || || tasyaivatma padavittam vi~ditva | na karmana lipyate
