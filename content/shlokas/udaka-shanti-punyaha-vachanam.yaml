    प्रच॑रति । अ॒पः प्रण॑यति । आपो॒ वै सर्वा॑ दे॒वताः । दे॒वता॑ ए॒वारभ्य॑ प्र॒णीय॒ प्रच॑रति । अ॒पः प्रण॑यति
    । आपो॒ वै शा॒न्ताः । शा॒न्ताभि॑रे॒वास्य॒ शुचग्ं॑ शमयति । दे॒वो वः॑ सवि॒तो च्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒स्सूर्य॑स्य
