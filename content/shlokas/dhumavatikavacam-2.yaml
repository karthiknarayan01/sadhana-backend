id: dhumavatikavacam-2
category: kavacha
name:
  english: dhumavatikavacam 2
  devanagari: धूमावतीकवचम् २
content:
  english: shridhumavatikavacam 2 om patu shiro dhumavati lalatam dhumravarnini | netre patu virupakshi
    bhruvau ca kalarupini || 1|| karnau patu karalasya nasam shurpadhara'vatu | kapolau patu candi ca
    oshthau me malinambara || 2|| dantan patu mahamaya jihvam patu digambari | mukham patu kalacakra kantham
    kankali'vatu || 3|| skandhau patu mahakali bahu patu ca candika | hastau patu karali ca karamulam
    vilocana || 4|| vakshah patu camunda hridayasthanavasini | jatharam patu dushtatma nabhim patu kuhustatha
    || 5|| katim patu ca matangi uru patu vinashini | januni patu vriddha ca janghe patu mahonmatta ||
    6|| gulphau patu kriyavati padau patu sudhanvini | angulishca shavarudha nakhani kakavahana || 7||
    prishthadesham sudirghangi parshvau patu mahatmika | sarvangam patu durjeya sarvasankatanashini ||
    8|| yuddhakshetre mahabhime shatrusanghavinashini | karagare ripugraste raksha mam dhumralocana ||
    9|| antah patu mahonmada bahyam patu bhayankari | aghoracaraputa ca sarvatah patu mam sada || 10||
    vastudoshan haro dhumra vidyayam ca prapalayet | karye vitte ca vidyayam kalaratrih prapalayet ||
    11|| pathi patu mahabhima griham rakshatu sundari | shatrun bhakshaya nityam tvam madrakshartham prayatnatah
    || 12|| dishi dikpalakah sarve vidikshu ca tatha sthitah | madiyam rakshanam kurvantu dhumavatyajnaya
    sada || 13|| nakhante ca shikhagrante madhye capi vyavasthitam | kavacam me sada patu dhumavati trilokapa
    || 14|| iti guhyam mahaguhyam dhumavatyah kavacakam | yah pathet sadhakah so'pi sarvasiddhimavapnuyat
    || 15|| ya idam kavacam divyam pathate niyatah sudhih | sa bhavet sarvada mukto mahapatakakotitah
    || 16|| karagare ripugraste duhsvapne ca mahabhaye | pathanadasya mantrasya sadyo mucyeta sadhakah
    || 17|| shatravah pralayam yanti darpastesham vinashyati | dhumavatyah prasadena vagmi ca syat kshitau
    puman || 18|| na tasya mrityubhayam syat na vyadhirna ca daridryam | bhutapretapishacashca palayante
    disho dasha || 19|| rajadvare mahayuddhe durge ca vishame pathi | yah pathet susamahitastasya raksham
    karoti sa || 20|| brahmahatyadikam papam mahaghoram ca yadbhavet | tatsarvam vilayam yati pathanatkavacasya
    tu || 21|| na hyatra samshayo devi na canya kapi siddhida | dhumavati svayameva rakshate sadhakam
    sada || 22|| yatha shmashanavasinyah prasado labhyate nrinam | tatha samastasiddhih syat kavacadasya
    dharanat || 23|| iti dhumavatikavacam sampurnam |
  devanagari: श्रीधूमावतीकवचम् २ ॐ पातु शिरो धूमावती ललाटं धूम्रवर्णिनी । नेत्रे पातु विरूपाक्षी भ्रुवौ
    च कालरूपिणी ॥ १॥ कर्णौ पातु करालास्या नासां शूर्पधराऽवतु । कपोलौ पातु चण्डी च ओष्ठौ मे मलिनाम्बरा
    ॥ २॥ दन्तान् पातु महामाया जिह्वां पातु दिगम्बरी । मुखं पातु कालचक्रा कण्ठं कङ्कालीऽवतु ॥ ३॥ स्कन्धौ
    पातु महाकाली बाहू पातु च चण्डिका । हस्तौ पातु कराली च करमूलं विलोचना ॥ ४॥ वक्षः पातु चामुण्डा हृदयस्थानवासिनी
    । जठरं पातु दुष्टात्मा नाभिं पातु कुहूस्तथा ॥ ५॥ कटिं पातु च मातङ्गी ऊरू पातु विनाशिनी । जानुनी पातु
    वृद्धा च जङ्घे पातु महोन्मत्ता ॥ ६॥ गुल्फौ पातु क्रियावती पादौ पातु सुधन्विनी । अङ्गुलीश्च शवारूढा
    नखानि काकवाहना ॥ ७॥ पृष्ठदेशं सुदीर्घाङ्गी पार्श्वौ पातु महात्मिका । सर्वाङ्गं पातु दुर्जेया सर्वसङ्कटनाशिनी
    ॥ ८॥ युद्धक्षेत्रे महाभीमे शत्रुसङ्घविनाशिनी । कारागारे रिपुग्रस्ते रक्ष मां धूम्रलोचना ॥ ९॥ अन्तः
    पातु महोन्मादा बाह्यं पातु भयङ्करी । अघोराचारपूता च सर्वतः पातु मां सदा ॥ १०॥ वास्तुदोषान् हरो धूम्रा
    विद्यायां च प्रपालयेत् । कार्ये वित्ते च विद्यायां कालरात्रिः प्रपालयेत् ॥ ११॥ पथि पातु महाभीमा गृहं
    रक्षतु सुन्दरी । शत्रून् भक्षय नित्यं त्वं मद्रक्षार्थं प्रयत्नतः ॥ १२॥ दिशि दिक्पालकाः सर्वे विदिक्षु
    च तथा स्थिताः । मदीयं रक्षणं कुर्वन्तु धूमावत्याज्ञया सदा ॥ १३॥ नखान्ते च शिखाग्रान्ते मध्ये चापि
    व्यवस्थितम् । कवचं मे सदा पातु धूमावती त्रिलोकपा ॥ १४॥ इति गुह्यं महागुह्यं धूमावत्याः कवचकम् । यः
    पठेत् साधकः सोऽपि सर्वसिद्धिमवाप्नुयात् ॥ १५॥ य इदं कवचं दिव्यं पठते नियतः सुधीः । स भवेत् सर्वदा
    मुक्तो महापातककोटितः ॥ १६॥ कारागारे रिपुग्रस्ते दुःस्वप्ने च महाभये । पठनादस्य मन्त्रस्य सद्यो मुच्येत
    साधकः ॥ १७॥ शत्रवः प्रलयं यान्ति दर्पस्तेषां विनश्यति । धूमावत्याः प्रसादेन वाग्मी च स्यात् क्षितौ
    पुमान् ॥ १८॥ न तस्य मृत्युभयं स्यात् न व्याधिर्न च दारिद्र्यम् । भूतप्रेतपिशाचाश्च पलायन्ते दिशो दश
    ॥ १९॥ राजद्वारे महायुद्धे दुर्गे च विषमे पथि । यः पठेत् सुसमाहितस्तस्य रक्षां करोति सा ॥ २०॥ ब्रह्महत्यादिकं
    पापं महाघोरं च यद्भवेत् । तत्सर्वं विलयं याति पठनात्कवचस्य तु ॥ २१॥ न ह्यत्र संशयो देवि न चान्या कापि
    सिद्धिदा । धूमावती स्वयमेव रक्षते साधकं सदा ॥ २२॥ यथा श्मशानवासिन्याः प्रसादो लभ्यते नृणाम् । तथा
    समस्तसिद्धिः स्यात् कवचादस्य धारणात् ॥ २३॥ इति धूमावतीकवचं सम्पूर्णम् ।
