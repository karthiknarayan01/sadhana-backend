id: sri-swaminatha-panchakam
category: stotram
name:
  english: Sri Swaminatha Panchakam
content:
  english: he svaminathartabandho | bhasmaliptanga gangeya karunyasindho || rudrakshadharinnamaste raudrarogam
    hara tvam purarergurorme | rakenduvaktram bhavantam mararupam kumaram bhaje kamapuram || || mam pahi
    rogadaghorat mangalapangapatena bhangatsvaranam | kalacca dushpakakulat kalakalasyasunum bhaje krantasanum
    || || brahmadayo yasya shishyah brahmaputra girau yasya sopanabhutah | sainyam surashcapi sarve samavedadigeyam
    bhaje kartikeyam || || kashaya samvita gatram kamarogadi samhari bhikshanna patram | karunya sampurna
    netram shaktihastam pavitram bhaje shambhuputram || || shrisvami shaile vasantam sadhusanghasya rogan
    sada samharantam | onkaratattvam vadantam shambhukarne hasantam bhaje'ham shishum tam || || stotram
    kritam citracitram dikshitanantaramena sarvarthasiddhyai | bhaktya pathedyah prabhate devadevaprasadat
    labhetashtasiddhim || || iti shrianantaramadikshitar kritam shri svaminatha pancakam |
  devanagari: हे स्वामिनाथार्तबन्धो । भस्मलिप्ताङ्ग गाङ्गेय कारुण्यसिन्धो ॥ रुद्राक्षधारिन्नमस्ते रौद्ररोगं
    हर त्वं पुरारेर्गुरोर्मे । राकेन्दुवक्त्रं भवन्तं माररूपं कुमारं भजे कामपूरम् ॥ ॥ मां पाहि रोगादघोरात्
    मङ्गलापाङ्गपातेन भङ्गात्स्वराणाम् । कालाच्च दुष्पाककूलात् कालकालस्यसूनुं भजे क्रान्तसानुम् ॥ ॥ ब्रह्मादयो
    यस्य शिष्याः ब्रह्मपुत्रा गिरौ यस्य सोपानभूताः । सैन्यं सुराश्चापि सर्वे सामवेदादिगेयं भजे कार्तिकेयम्
    ॥ ॥ काषाय संवीत गात्रं कामरोगादि संहारि भिक्षान्न पात्रम् । कारुण्य सम्पूर्ण नेत्रं शक्तिहस्तं पवित्रं
    भजे शम्भुपुत्रम् ॥ ॥ श्रीस्वामि शैले वसन्तं साधुसङ्घस्य रोगान् सदा संहरन्तम् । ओङ्कारतत्त्वं वदन्तं
    शम्भुकर्णे हसन्तं भजेऽहं शिशुं तम् ॥ ॥ स्तोत्रं कृतं चित्रचित्रं दीक्षितानन्तरामेण सर्वार्थसिद्ध्यै
    । भक्त्या पठेद्यः प्रभाते देवदेवप्रसादात् लभेताष्टसिद्धिम् ॥ ॥ इति श्रीअनन्तरामदीक्षितर् कृतं श्री
    स्वामिनाथ पञ्चकम् ।
