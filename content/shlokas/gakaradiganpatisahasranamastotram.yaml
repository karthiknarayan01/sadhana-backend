    gunagryo gunaparadrik | gunapracari gunayug gunagunavivekakrit || 25|| gunakaro gunakaro gunapravanavardhanah
    | gunagudhacaro gaunasarvasamsaraceshtitah || 26|| gunadakshinasauhardo gunalakshanatattvavit | gunahari
