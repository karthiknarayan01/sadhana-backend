id: shivaproktamcidambarakshetravarnanam
category: raksha
name:
  english: shivaproktamcidambarakshetravarnanam
  devanagari: शिवप्रोक्तंचिदम्बरक्षेत्रवर्णनम्
content:
  english: shrishivah cidambarabhidham kshetram shivakshetramanuttamam | tadapyekam mahatsthanam mama
    priyakaram shive || 1|| vasami tatra satatam brahmavishnvadipujitah | tatra mam munayah sarve sevante
    pratyaham shive || 2|| tasminneva shivasthane kotishah santi shankarah | tatra ramyani tirthani santi
    papaharani ca || 3|| rudrakshavanamastyekam tatra papabhayapaham | tatra bilvavanam casti sarvada
    navapallavam || 4|| nityam shivakathalapah jayante tatra vallabhe | shivaikasharana eva tatra santi
    mama priyah || 5|| sada madasaktacittah sada matpujanapriyah | sada madekasharanah sada madupapadakah
    || 6|| kecidvadanti mamisham gaurinatheti sadaram | gaurinatheti namnaiva pujayanti muhurmahuh ||
    7|| kecidvadanti mamisham shivetyanishamadaran | tannamnaiva namah purvam bilvairabhyarcayanti mam
    || 8|| kecidvadanti mamisham shankaretyanisham muda | tannamnaiva namah purvam bilvairabhyarcayanti
    mam || 9|| kecidvadanti mamisham candracudeti sadaram | tannamnaiva namah purvam bilvairabhyarcayanti
    mam || 10|| kecidvadati mamisham vishvanatheti sadaram | tannamnaiva namah purvam bilvairabhyarcayanti
    mam || 10|| kecidvadanti mamishamumanatheti sadaram | yavantah santi viprendra nityam shrimaccidambare
    || 12|| sarve vadanti te nityam mahadeva shiveti ca | mannamacihnitah sarve santi shrimaccidambare
    || 13|| mannamamritapah sarve shricidambaravasinah | shrimaccidambare tirthe yavantah santi sadhavah
    || 14|| tavanto'pyarcayantyete mannamamritapayinah | amitah santi shaivendra nityam shrimaccidambare
    || 15|| cidambarasthashaivanam na sankhya vidyate shive | shivagangabhidham tirtham tatrastyekam varanane
    || 16|| tatra snatva narah sadyo mucyate papakotibhih | adrayam patayuktayam tatra snatva yathavidhi
    || 17|| datva suvarnam shaivaya mucyate bhavabandhanat | shivagangatate ramye natyasthalamume'sti
    me || 18|| tatra natyam maya devi kriyate tava sannidhau | shrimadabhrasabhanatham nrityantam mam
    maheshvaram
  devanagari: श्रीशिवः चिदम्बराभिधं क्षेत्रं शिवक्षेत्रमनुत्तमम् । तदप्येकं महत्स्थानं मम प्रियकरं शिवे
    ॥ १॥ वसामि तत्र सततं ब्रह्मविष्ण्वादिपूजितः । तत्र मां मुनयः सर्वे सेवन्ते प्रत्यहं शिवे ॥ २॥ तस्मिन्नेव
    शिवस्थाने कोटिशः सन्ति शाङ्कराः । तत्र रम्याणि तीर्थानि सन्ति पापहराणि च ॥ ३॥ रुद्राक्षवनमस्त्येकं
    तत्र पापभयापहम् । तत्र बिल्ववनं चास्ति सर्वदा नवपल्लवम् ॥ ४॥ नित्यं शिवकथालापाः जायन्ते तत्र वल्लभे
    । शिवैकशरणा एव तत्र सन्ति मम प्रियाः ॥ ५॥ सदा मदासक्तचित्ताः सदा मत्पूजनप्रियाः । सदा मदेकशरणाः सदा
    मदुपपादकाः ॥ ६॥ केचिद्वदन्ति मामीशं गौरीनाथेति सादरम् । गौरीनाथेति नाम्नैव पूजयन्ति मुहुर्महुः ॥ ७॥
    केचिद्वदन्ति मामीशं शिवेत्यनिशमादरान् । तन्नाम्नैव नमः पूर्वं बिल्वैरभ्यर्चयन्ति माम् ॥ ८॥ केचिद्वदन्ति
    मामीशं शङ्करेत्यनिशं मुदा । तन्नाम्नैव नमः पूर्वं बिल्वैरभ्यर्चयन्ति माम् ॥ ९॥ केचिद्वदन्ति मामीशं
    चन्द्रचूडेति सादरम् । तन्नाम्नैव नमः पूर्वं बिल्वैरभ्यर्चयन्ति माम् ॥ १०॥ केचिद्वदति मामीशं विश्वनाथेति
    सादरम् । तन्नाम्नैव नमः पूर्वं बिल्वैरभ्यर्चयन्ति माम् ॥ १०॥ केचिद्वदन्ति मामीशमुमानाथेति सादरम् ।
    यावन्तः सन्ति विप्रेन्द्रा नित्यं श्रीमच्चिदम्बरे ॥ १२॥ सर्वे वदन्ति ते नित्यं महादेव शिवेति च । मन्नामचिह्निताः
    सर्वे सन्ति श्रीमच्चिदम्बरे ॥ १३॥ मन्नामामृतपाः सर्वे श्रीचिदम्बरवासिनः । श्रीमच्चिदम्बरे तीर्थे यावन्तः
    सन्ति साधवः ॥ १४॥ तावन्तोऽप्यर्चयन्त्येते मन्नामामृतपायिनः । अमिताः सन्ति शैवेन्द्रा नित्यं श्रीमच्चिदम्बरे
    ॥ १५॥ चिदम्बरस्थशैवानां न सङ्ख्या विद्यते शिवे । शिवगङ्गाभिधं तीर्थं तत्रास्त्येकं वरानने ॥ १६॥ तत्र
    स्नात्वा नरः सद्यो मुच्यते पापकोटिभिः । आद्रायां पातयुक्तायां तत्र स्नात्वा यथाविधि ॥ १७॥ दत्वा सुवर्णं
    शैवाय मुच्यते भवबन्धनात् । शिवगङ्गातटे रम्ये नाट्यस्थलमुमेऽस्ति मे ॥ १८॥ तत्र नाट्यं मया देवि क्रियते
    तव सन्निधौ । श्रीमदभ्रसभानाथं नृत्यन्तं मां महेश्वरं
