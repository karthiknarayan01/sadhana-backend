id: ramanujastavashlokah
category: stotram
name:
  english: ramanujastavashlokah
  devanagari: रामानुजस्तवश्लोकाः
content:
  english: shriman ramanujaryo jagati vijayatamagrayayi yatinam yannamollapamatrat narapatitanayam pratyajat
    brahmarakshah | yasyabhati tridandi cidacidapi param ceti tattvatrayasya sthityadisthapanartham prithagabhikalita
    ketudandatrayiva || 6|| yatkirtih svamatapraveshasuhridamangeshu pundrayate svante sattvagunayate'tha
    bhagavaddhyanakhyagangayate | santoshadadhirohatam haripadam tatsutrayantrayate jiyadesha yatishvaro
    bhuvi ciram bhuyacca nassapade || 7|| valmikaprabhavo munih svayamiha prokto budhendraih kavih valmikaprabhavendra
    esha yaminam shreshthah shrutah panditah | vyasasso'pi parasharena janitah shrikeshavaryaih guruh
    sheshashca svayamityabodhi dharanau ko va yatindossamah || 8||
  devanagari: श्रीमान् रामानुजार्यो जगति विजयतामग्रयायी यतीनां यन्नामोल्लापमात्रात् नरपतितनयां प्रात्यजत्
    ब्रह्मरक्षः । यस्याभाति त्रिदण्डी चिदचिदपि परं चेति तत्त्वत्रयस्य स्थित्यादिस्थापनार्थं पृथगभिकलिता
    केतुदण्डत्रयीव ॥ ६॥ यत्कीर्तिः स्वमतप्रवेशसुहृदामङ्गेषु पुण्ड्रायते स्वान्ते सत्त्वगुणायतेऽथ भगवद्ध्यानाख्यगङ्गायते
    । सन्तोषादधिरोहतां हरिपदं तत्सूत्रयन्त्रायते जीयादेष यतीश्वरो भुवि चिरं भूयाच्च नस्सपदे ॥ ७॥ वल्मीकप्रभवो
    मुनिः स्वयमिह प्रोक्तो बुधेन्द्रैः कविः वल्मीकप्रभवेन्द्र एष यमिनां श्रेष्ठः श्रुतः पण्डितः । व्यासस्सोऽपि
    पराशरेण जनितः श्रीकेशवार्यैः गुरुः शेषश्च स्वयमित्यबोधि धरणौ को वा यतीन्दोस्समः ॥ ८॥
