id: narayaniyam-dashaka-25
category: stotram
name:
  english: Narayaniyam Dashaka 25
content:
  english: stambhe ghattayato hiranyakashipoh karnau samacurnaya nnaghurnajjagadandakundakuharo ghorastavabhudravah
    | shrutva yam kila daityarajahridaye purvam kadapyashrutam kampah kashcana sampapata calito'pyambhojabhurvishtarat
    || || daitye dikshu visrishtacakshushi mahasamrambhini stambhatah sambhutam na mrigatmakam na manujakaram
    vapuste vibho | kim kim bhishanametadadbhutamiti vyudbhrantacitte'sure visphurjjaddhavalograromavikasadvarshma
    samajrimbhathah || || taptasvarnasavarnaghurnadatirukshaksham satakesara protkampapranikumbitambaramaho
    jiyattavedam vapuh | vyattavyaptamahadarisakhamukham khadgogravalganmaha jihvanirgamadrishyamanasumahadamshtrayugoddamaram
    || || utsarpadvalibhangabhishanahanu hrasvasthaviyastara grivam pivaradoshshatodgatanakhakruramshudurolbanam
    | vyomollanghi ghanaghanopamaghanapradhvananirdhavita spardhaluprakaram namami bhavatastannarasimham
    vapuh || || nunam vishnurayam nihanmyamumiti bhramyadgadabhishanam daityendram samupadravantamadhritha
    dorbhyam prithubhyamamum | viro nirgalito'tha khadgaphalakau grihnanvicitrashraman vyavrinvan punarapapata
    bhuvanagrasodyatam tvamaho || || bhramyantam ditijadhamam punarapi prodgrihya dorbhyam javat dvare'thoruyuge
    nipatya nakharan vyutkhaya vakshobhuvi | nirbhindannadhigarbhanirbharagaladraktambu baddhotsavam payam
    payamudairayo bahu jagatsamharisimharavan || || tyaktva tam hatamashu raktalaharisiktonnamadvarshmani
    pratyutpatya samastadaityapatalim cakhadyamane tvayi | bhramyadbhumi vikampitambudhikulam vyalolashailotkaram
    protsarpatkhacaram caracaramaho duhsthamavastham dadhau || || tavanmamsavapakaralavapusham ghorantramaladharam
    tvam madhyesabhamiddhakopamushitam durvaragurvaravam | abhyetum na shashaka kopi bhuvane dure sthita
    bhiravah sarve sharvavirincavasavamukhah pratyekamastoshata || || bhuyo'pyakshataroshadhamni bhavati
    brahmajnaya balake prahlade padayornamatyapabhaye karunyabharakulah | shantastvam karamasya murdhni
    samadhah stotrairathodgayata stasyakamadhiyo'pi tenitha varam lokaya canugraham || || evam natitaraudraceshtita
    vibho shritapaniyabhidha shrutyantasphutagitasarvamahimannatyantashuddhakrite | tattadrinnikhilottaram
    punaraho kastvam paro langhayet prahladapriya he marutpurapate sarvamayatpahi mam ||
  devanagari: स्तम्भे घट्टयतो हिरण्यकशिपोः कर्णौ समाचूर्णय न्नाघूर्णज्जगदण्डकुण्डकुहरो घोरस्तवाभूद्रवः
    । श्रुत्वा यं किल दैत्यराजहृदये पूर्वं कदाप्यश्रुतं कम्पः कश्चन सम्पपात चलितोऽप्यम्भोजभूर्विष्टरात्
    ॥ ॥ दैत्ये दिक्षु विसृष्टचक्षुषि महासंरम्भिणि स्तम्भतः सम्भूतं न मृगात्मकं न मनुजाकारं वपुस्ते विभो
    । किं किं भीषणमेतदद्भुतमिति व्युद्भ्रान्तचित्तेऽसुरे विस्फूर्ज्जद्धवलोग्ररोमविकसद्वर्ष्मा समाजृम्भथाः
    ॥ ॥ तप्तस्वर्णसवर्णघूर्णदतिरूक्षाक्षं सटाकेसर प्रोत्कम्पप्रनिकुम्बिताम्बरमहो जीयात्तवेदं वपुः । व्यात्तव्याप्तमहादरीसखमुखं
    खड्गोग्रवल्गन्महा जिह्वानिर्गमदृश्यमानसुमहादंष्ट्रायुगोड्डामरम् ॥ ॥ उत्सर्पद्वलिभङ्गभीषणहनु ह्रस्वस्थवीयस्तर
    ग्रीवं पीवरदोश्शतोद्गतनखक्रूरांशुदूरोल्बणम् । व्योमोल्लङ्घि घनाघनोपमघनप्रध्वाननिर्धावित स्पर्धालुप्रकरं
    नमामि भवतस्तन्नारसिंहं वपुः ॥ ॥ नूनं विष्णुरयं निहन्म्यमुमिति भ्राम्यद्गदाभीषणं दैत्येन्द्रं समुपाद्रवन्तमधृथा
    दोर्भ्यां पृथुभ्याममुम् । वीरो निर्गलितोऽथ खड्गफलकौ गृह्णन्विचित्रश्रमान् व्यावृण्वन् पुनरापपात भुवनग्रासोद्यतं
    त्वामहो ॥ ॥ भ्राम्यन्तं दितिजाधमं पुनरपि प्रोद्गृह्य दोर्भ्यां जवात् द्वारेऽथोरुयुगे निपात्य नखरान्
    व्युत्खाय वक्षोभुवि । निर्भिन्दन्नधिगर्भनिर्भरगलद्रक्ताम्बु बद्धोत्सवं पायं पायमुदैरयो बहु जगत्संहारिसिंहारवान्
    ॥ ॥ त्यक्त्वा तं हतमाशु रक्तलहरीसिक्तोन्नमद्वर्ष्मणि प्रत्युत्पत्य समस्तदैत्यपटलीं चाखाद्यमाने त्वयि
    । भ्राम्यद्भूमि विकम्पिताम्बुधिकुलं व्यालोलशैलोत्करं प्रोत्सर्पत्खचरं चराचरमहो दुःस्थामवस्थां दधौ
    ॥ ॥ तावन्मांसवपाकरालवपुषं घोरान्त्रमालाधरं त्वां मध्येसभमिद्धकोपमुषितं दुर्वारगुर्वारवम् । अभ्येतुं
    न शशाक कोपि भुवने दूरे स्थिता भीरवः सर्वे शर्वविरिञ्चवासवमुखाः प्रत्येकमस्तोषत ॥ ॥ भूयोऽप्यक्षतरोषधाम्नि
    भवति ब्रह्माज्ञया बालके प्रह्लादे पदयोर्नमत्यपभये कारुण्यभाराकुलः । शान्तस्त्वं करमस्य मूर्ध्नि समधाः
    स्तोत्रैरथोद्गायत स्तस्याकामधियोऽपि तेनिथ वरं लोकाय चानुग्रहम् ॥ ॥ एवं नाटितरौद्रचेष्टित विभो श्रीतापनीयाभिध
    श्रुत्यन्तस्फुटगीतसर्वमहिमन्नत्यन्तशुद्धाकृते । तत्तादृङ्निखिलोत्तरं पुनरहो कस्त्वां परो लङ्घयेत्
    प्रह्लादप्रिय हे मरुत्पुरपते सर्वामयात्पाहि माम् ॥
