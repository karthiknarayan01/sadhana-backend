id: narayaniyam-dashaka-76
category: stotram
name:
  english: Narayaniyam Dashaka 76
content:
  english: gatva sandipanimatha catushshashtimatrairahobhih sarvajnastvam saha musalina sarvavidya grihitva
    | putram nashtam yamanilayanadahritam dakshinartham datva tasmai nijapuramaga nadayan pancajanyam
    || || smritva smritva pashupasudrishah premabharapranunnah karunyena tvamapi vivashah prahinoruddhavam
    tam | kincamushmai paramasuhride bhaktavaryaya tasam bhaktyudrekam sakalabhuvane durlabham darshayishyan
    || || tvanmahatmyaprathimapishunam gokulam prapya sayam tvadvartabhirbahu sa ramayamasa nandam yashodam
    | pratarddrishtva manimayaratham shankitah pankajakshyah shrutva praptam bhavadanucaram tyaktakaryah
    samiyuh || || drishtva cainam tvadupamalasadveshabhushabhiramam smritva smritva tava vilasitanyuccakaistani
    tani | ruddhalapah kathamapi punargadgadam vacamucuh saujanyadin nijaparabhidamapyalam vismarantyah
    || || shriman kim tvam pitrijanakrite preshito nirdayena kvasau kanto nagarasudrisham ha hare natha
    payah | ashleshanamamritavapusho hanta te cumbanana munmadanam kuhakavacasam vismaret kanta ka va
    || || rasakridalulitalalitam vishlathatkeshapasham mandodbhinnashramajalakanam lobhaniyam tvadangam
    | karunyabdhe sakridapi samalingitum darshayeti premonmadadbhuvanamadana tvatpriyastvam vilepuh ||
    || evamprayairvivashavacanairakula gopikasta stvatsandeshaih prakritimanayat so'tha vijnanagarbhaih
    | bhuyastabhirmuditamatibhistvanmayibhirvadhubhi stattadvartasarasamanayat kanicidvasarani || || tvatprodganaih
    sahitamanisham sarvato gehakrityam tvadvartaiva prasarati mithah saiva cotsvapalapah | ceshtah prayastvadanukritayastvanmayam
    sarvamevam drishtva tatra vyamuhadadhikam vismayaduddhavo'yam || || radhaya me priyatamamidam matpriyaivam
    braviti tvam kim maunam kalayasi sakhe maninimatpriyeva| ityadyeva pravadati sakhi tvatpriyo nirjane
    ma mitthamvadairaramadayam tvatpriyamutpalakshim || || eshyami draganupagamanam kevalam karyabhara
    dvishleshe'pi smaranadridhatasambhavanmastu khedah | brahmanande milati nacirat sangamo va viyoga
    stulyo vah syaditi tava gira so'karonnirvyathastah || || evam bhakti sakalabhuvane nekshita na shruta
    va kim shastraughaih kimiha tapasa gopikabhyo namo'stu | ityanandakulamupagatam gokuladuddhavam tam
    drishtva hrishto gurupurapate pahi mamamayaughat ||
  devanagari: गत्वा सान्दीपनिमथ चतुष्षष्टिमात्रैरहोभिः सर्वज्ञस्त्वं सह मुसलिना सर्वविद्या गृहीत्वा ।
    पुत्रं नष्टं यमनिलयनादाहृतं दक्षिणार्थं दत्वा तस्मै निजपुरमगा नादयन् पाञ्चजन्यम् ॥ ॥ स्मृत्वा स्मृत्वा
    पशुपसुदृशः प्रेमभारप्रणुन्नाः कारुण्येन त्वमपि विवशः प्राहिणोरुद्धवं तम् । किञ्चामुष्मै परमसुहृदे
    भक्तवर्याय तासां भक्त्युद्रेकं सकलभुवने दुर्लभं दर्शयिष्यन् ॥ ॥ त्वन्माहात्म्यप्रथिमपिशुनं गोकुलं
    प्राप्य सायं त्वद्वार्ताभिर्बहु स रमयामास नन्दं यशोदाम् । प्रातर्द्दृष्ट्वा मणिमयरथं शङ्किताः पङ्कजाक्ष्यः
    श्रुत्वा प्राप्तं भवदनुचरं त्यक्तकार्याः समीयुः ॥ ॥ दृष्ट्वा चैनं त्वदुपमलसद्वेषभूषाभिरामं स्मृत्वा
    स्मृत्वा तव विलसितान्युच्चकैस्तानि तानि । रुद्धालापाः कथमपि पुनर्गद्गदां वाचमूचुः सौजन्यादीन् निजपरभिदामप्यलं
    विस्मरन्त्यः ॥ ॥ श्रीमान् किं त्वं पितृजनकृते प्रेषितो निर्दयेन क्वासौ कान्तो नगरसुदृशां हा हरे नाथ
    पायाः । आश्लेषाणाममृतवपुषो हन्त ते चुम्बनाना मुन्मादानां कुहकवचसां विस्मरेत् कान्त का वा ॥ ॥ रासक्रीडालुलितललितं
    विश्लथत्केशपाशं मन्दोद्भिन्नश्रमजलकणं लोभनीयं त्वदङ्गम् । कारुण्याब्धे सकृदपि समालिङ्गितुं दर्शयेति
    प्रेमोन्मादाद्भुवनमदन त्वत्प्रियास्त्वां विलेपुः ॥ ॥ एवम्प्रायैर्विवशवचनैराकुला गोपिकास्ता स्त्वत्सन्देशैः
    प्रकृतिमनयत् सोऽथ विज्ञानगर्भैः । भूयस्ताभिर्मुदितमतिभिस्त्वन्मयीभिर्वधूभि स्तत्तद्वार्तासरसमनयत्
    कानिचिद्वासराणि ॥ ॥ त्वत्प्रोद्गानैः सहितमनिशं सर्वतो गेहकृत्यं त्वद्वार्तैव प्रसरति मिथः सैव चोत्स्वापलापाः
    । चेष्टाः प्रायस्त्वदनुकृतयस्त्वन्मयं सर्वमेवं दृष्ट्वा तत्र व्यमुहदधिकं विस्मयादुद्धवोऽयम् ॥ ॥ राधाया
    मे प्रियतममिदं मत्प्रियैवं ब्रवीति त्वं किं मौनं कलयसि सखे मानिनीमत्प्रियेव। इत्याद्येव प्रवदति सखि
    त्वत्प्रियो निर्जने मा मित्थंवादैररमदयं त्वत्प्रियामुत्पलाक्षीम् ॥ ॥ एष्यामि द्रागनुपगमनं केवलं कार्यभारा
    द्विश्लेषेऽपि स्मरणदृढतासम्भवान्मास्तु खेदः । ब्रह्मानन्दे मिलति नचिरात् सङ्गमो वा वियोग स्तुल्यो
    वः स्यादिति तव गिरा सोऽकरोन्निर्व्यथास्ताः ॥ ॥ एवं भक्ति सकलभुवने नेक्षिता न श्रुता वा किं शास्त्रौघैः
    किमिह तपसा गोपिकाभ्यो नमोऽस्तु । इत्यानन्दाकुलमुपगतं गोकुलादुद्धवं तं दृष्ट्वा हृष्टो गुरुपुरपते पाहि
    मामामयौघात् ॥
