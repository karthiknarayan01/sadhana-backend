id: shrikrishnalilamritam
category: stotram
name:
  english: shrikrishnalilamritam
  devanagari: श्रीकृष्णलीलामृतम्
content:
  english: shrikrishnalilamritam adau devakidevi garbhajananam gopigrihe vardhanam mayaputana jivitapa
    haranam govardhanodhdaranam kamsacchedana kauravadi hananam kumtitanujavanam etad bhagatavam puranakathanam
    shrikrishnalilamritam|
  devanagari: श्रीकृष्णलीलामृतम् आदौ देवकीदेवी गर्भजननं गोपिगृहे वर्धनम् मायापूतन जीविताप हरणम् गोवर्धनोध्दारणम्
    कंसच्छेदन कौरवादि हननं कुंतीतनुजावनम् एतद् भागतवम् पुराणकथनम् श्रीकृष्णलीलामृतम्।
meaning: {}
