id: andhakakritamparvatistotram
category: stotram
name:
  english: andhakakritamparvatistotram
  devanagari: अन्धककृतंपार्वतीस्तोत्रम्
content:
  english: andhakakritam parvatistotram athandhako maheshvarim dadarsha devaparshvagam | papata dandavatkshitau
    nanama padapadmayoh || andhakovaca | namami devavallabhamanadimadrijamimam | yatah pradhanapurushau
    nihanti ya'khilam jagat || 1|| vibhati ya shivasane shivena sakamavyaya hiranmaye'tinirmale namami
    tam himadrijam | yadantarakhilam jagajjaganti yanti sankshayam namami yatra tamumamasheshabhedavarjitam
    || 2|| na jayate na hiyate na varddhate ca tamumam namami ya gunatigam girishaputrikamimam | kshamasva
    devi shailaje kritam maya vimohitam surasurairnamaskritam namami te padambujam || 3|| ittham bhagavati
    divi bhaktinamrena parvati | samstuta daityapatina putratve jagrihe'ndhakam || 4|| iti kurmapurane
    purvabhage shodashadhyayantargatam andhakakritam parvatistotram samaptam | kurmapurane purvabhage
    16
  devanagari: अन्धककृतं पार्वतीस्तोत्रम् अथान्धको महेश्वरीं ददर्श देवपार्श्वगाम् । पपात दण्डवत्क्षितौ
    ननाम पादपद्मयोः ॥ अन्धकोवाच । नमामि देववल्लभामनादिमद्रिजामिमाम् । यतः प्रधानपूरुषौ निहन्ति याऽखिलं
    जगत् ॥ १॥ विभाति या शिवासने शिवेन साकमव्यया हिरण्मयेऽतिनिर्मले नमामि तां हिमाद्रिजाम् । यदन्तराखिलं
    जगज्जगन्ति यान्ति सङ्क्षयं नमामि यत्र तामुमामशेषभेदवर्जिताम् ॥ २॥ न जायते न हीयते न वर्द्धते च तामुमां
    नमामि या गुणातिगां गिरीशपुत्रिकामिमाम् । क्षमस्व देवि शैलजे कृतं मया विमोहितं सुरासुरैर्नमस्कृतं नमामि
    ते पदाम्बुजम् ॥ ३॥ इत्थं भगवती दिवी भक्तिनम्रेण पार्वती । संस्तुता दैत्यपतिना पुत्रत्वे जगृहेऽन्धकम्
    ॥ ४॥ इति कूर्मपुराणे पूर्वभागे षोडशाध्यायान्तर्गतं अन्धककृतं पार्वतीस्तोत्रं समाप्तम् । कूर्मपुराणे
    पूर्वभागे १६
