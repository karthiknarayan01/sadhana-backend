id: vidyapatikritamvishnustotram
category: stotram
name:
  english: vidyapatikritamvishnustotram
  devanagari: विद्यापतिकृतंविष्णुस्तोत्रम्
content:
  english: vidyapatikritam vishnustotram vidyapatiruvaca | pradhanapurushatita sarvavyapinparatpara |
    caracaraparinamaparamartha namo'stu te || 22|| shrutismritipuranetihasasampratipaditaih | karmabhistvam
    samaradhya eka eva jagatpate || 23|| tvatta etajjagatsarvam srishtau sampadyate vibho | tvadadharamidam
    deva tvayaiva paripalyate || 24|| kalpante samhritam sarvam tvatkukshau savakashakam | sukham vasati
    sarvatmannantaryaminnamo'stu te || 25|| namaste devadevaya trayirupaya te namah | candrasuryadirupena
    jagadbhasayase sada || 26|| sarvatirthamayi ganga yasya padabjasangamat | punati sakala~llokamstasmai
    pavayate namah || 27|| havimshi mantraputani samyagdattani vahnishu | parinamakrite tubhyam | jagajjivayate
    namah || 28|| yadamshamupajivanti jagantyanandarupinah | sarvakalmashahinaya tasmai brahmatmane namah
    || 29|| nirmalaya svarupaya shubharupaya mayine | sarvasangavihinaya namaste vishvasakshine || 2
  devanagari: विद्यापतिकृतं विष्णुस्तोत्रम् विद्यापतिरुवाच । प्रधानपुरुषातीत सर्वव्यापिन्परात्पर । चराचरपरीणामपरमार्थ
    नमोऽस्तु ते ॥ २२॥ श्रुतिस्मृतिपुराणेतिहाससम्प्रतिपादितैः । कर्मभिस्त्वं समाराध्य एक एव जगत्पते ॥ २३॥
    त्वत्त एतज्जगत्सर्वं सृष्टौ सम्पद्यते विभो । त्वदाधारमिदं देव त्वयैव परिपाल्यते ॥ २४॥ कल्पान्ते संहृतं
    सर्वं त्वत्कुक्षौ सावकाशकम् । सुखं वसति सर्वात्मन्नन्तर्यामिन्नमोऽस्तु ते ॥ २५॥ नमस्ते देवदेवाय त्रयीरूपाय
    ते नमः । चन्द्रसूर्यादिरुपेण जगद्भासयसे सदा ॥ २६॥ सर्वतीर्थमयी गङ्गा यस्य पादाब्जसङ्गमात् । पुनाति
    सकलाँल्लोकांस्तस्मै पावयते नमः ॥ २७॥ हवींषि मन्त्रपूतानि सम्यग्दत्तानि वह्निषु । परिणामकृते तुभ्यम्
    । जगज्जीवयते नमः ॥ २८॥ यदंशमुपजीवन्ति जगन्त्यानन्दरूपिणः । सर्वकल्मषहीनाय तस्मै ब्रह्मात्मने नमः ॥
    २९॥ निर्मलाय स्वरूपाय शुभरूपाय मायिने । सर्वसङ्गविहीनाय नमस्ते विश्वसाक्षिणे ॥ २
