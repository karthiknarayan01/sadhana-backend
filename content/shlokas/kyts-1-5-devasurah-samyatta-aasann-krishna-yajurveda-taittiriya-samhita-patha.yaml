id: kyts-1-5-devasurah-samyatta-aasann-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.5 Devasurah Samyatta Aasann - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande pancamah prashnah shri gurubhyo namah
    | harih om || devasura ya~tta asante deva vijayamupayanto 'gnau vamam nnyadadhatedamu no bhavishyati
    yadi no jeshyantiti tadagnirnyakamayata tenapa ttaddeva vijityavaruruthsamana anvaya ''dithsanta so
    'rodidyadarodi drudrasya rudratvam drajatagm hiranyamabhava mashrujagm hi yo barhishi dadati pura
    dgrihe rudanti tasma dbarhishi na deyagm so dbhagyasanyatha va idamiti punaradheya nte kevalamityabruva
    tkhalu sa ityabravidyo maddevatya tpaushnah pashava ucyante ta ''dhatta tena tvashta ttvashtrah pashava
    ucyante ta 'dhatta tena manurardhno nmanavyah praja ucyante ta va~thsaro vai dhata tasma 'nu pra jayante
    ya eva mpunaradheyasyardhim mpunaradheyasyardhim va~ agnirahita icchamanah praja mpashun yajamanasyopa
    dodravodvasya punara dadhita bhagadheyenaivainagm samardhayatyatho shantirevasyaisha punarvasvora
    dadhitaitadvai punaradheyasya nakshatram tpunarvasu svayamevaina ndevatayamadhaya brahmavarcasi bhavati
    darbhai ra dadhatyayatayamatvaya darbhaira dadhatyadbhya evainamoshadhibhyo 'varuddhya ''dhatte pancakapalah
    purodasho bhavati panca va ritava ritubhya evainamavaruddhya ''dhatte || darbhaih pancavigmshatishca
    'gnimudvasayate pancakapalah purodasho bhavati pankto yajnah panktah pashavo yajnameva pashunava rundhe
    viraha va esha devanam 'gnimudvasayate na va etasya brahmana ritayavah pura npanktyo yajyanuvakya
    bhavanti pankto yajnah panktah purusho devaneva vira dhatte shatakshara bhavanti dhatte shatakshara
    bhavanti shatayuh purusha shshatendriya ayushyevendriye prati tishthati yadva agnirahito nardhyate
    jyayo bhagadheya mbhavati saivasyardhi va~ etasya grihe vak srijyate yo 'gnimudvasayate sa vacagm
    sagmsrishtam rvibhaktayo bhavanti vaco vidhrityai yajamanasya nkaroti brahmaiva tadakarupagmshu yajati
    yatha vamam va~su vividano guhati tadrigeva tadagni mprati svishtakrita nniraha yatha vamam va~su
    vividanah prakasha njigamishati tadrigeva tadvibhaktimuktva prayajena vashatkarotyayatanadeva naiti
    yajamano vai purodashah pashava ete ahuti yadabhitah purodashamete ahuti juhoti yajamanamevobhayatah
    pashubhih pari grihnati kritayaju ssambhritasambhara ityahurna sambhritya ssambhara na yajuh kartavyamityatho
    khalu sambhritya eva sambharah kartavyam ryajnasya samriddhyai punarnishkrito ratho dakshina punaruthsyutam
    va~sah punaruthsrishto npunaradheyasya samriddhyai sapta te agne samidhah sapta jihva ityagnihotra
    njuhoti yatrayatraivasya nyakta evainamava rundhe viraha va esha devanam 'gnimudvasayate tasya varuna
    evarnayada mekadashakapalamanu nirvapedya syarnayattau bhagadheyena prinati na ''rtimarcchati yajamanah
    || mmahitva | upasthe te devyadite 'gnimannadamannadyaya ngauh prishnirakramidasana thsuvah || trigmshaddhama
    vi rajati va kpatangaya shishriye | pratyasya vaha dyubhih || asya pranadapanatyantashcarati rocana
    | vyakhya kruddhah parovapa manyuna yadavartya | sukalpamagne tattava punastvoddipayamasi ||yatte
    manyuparoptasya prithivimanu daddhvase | aditya vishve taddeva vasavashca samabharann || mano jyoti
    ndadhatu | brihaspatistanutamima nno vishve deva iha madayantam || sapta te agne samidhah sapta jihva
    ssapta dhama priyani | sapta hotra ssaptadha tva yajanti sapta yonira prinasva ghritena || punarurja
    ni vartasva punaragna isha ''yusha | punarnah pahi vishvatah || saha rayya ni vartasvagne pinvasva
    dharaya | vishvaphsniya vishvataspari || leka ssulekaste na aditya ajya njushana viyantu keta ssuketaste
    na aditya ajya njushana viyantu vivasvagm aditi rdevajutiste na aditya ajya njushana viyantu || ''shishaivainama
    dhatte sarpa vai jiryanto 'manyanta sa eta nkasarnirah kadraveyo mantramapashya ttato vai te jirnastanurapa
    ghnata sarparajniya rigbhi hapatyama dadhati punarnavamevainamajara 'tho putameva prithivimannadya
    ttato vai tamannadya sarparajniya rigbhi tyannadyasyavaruddhya atho asyamevaina mpratishthitama dhatte
    yattva kruddhah parovapetyahapahnuta evasmai ta tpunastvoddipayamasityaha samindha evainam ya~tte
    manyuparoptasyetyaha devatabhirevai mbharati vi va etasya yajnashchidyate yo 'gnimudvasayate brihaspativatyarcopa
    tishthate brahma vai devana rbrahmanaiva yajnagm sa ndadhati vicchinnam ndadhatvityaha santatyai vishve
    deva iha madayantamityaha santatyaiva yajna 'nu dishati sapta te agne samidhah sapta jihva ityaha
    saptasapta vai saptadha 'gneh priyastanuvasta evava rundhe punarurja saha rayyetyabhitah purodashamahuti
    juhoti yajamanamevorja ca rayya cobhayatah pari grihnatyaditya va asmallokadamum 'mushmin ~loke vyatrishya
    mpunarabhyavetya 'gnimadhayai mpunaradheyadagnimadadhita sa etan ''ditya riddhimardhnuva upaprayanto
    addhvara | are asme ca shrinvate || asya pratnamanu dyutagm shukra nduduhre ahrayah | payah sahasrasamrishi
    rmurdha divah kakutpatih prithivya ayam | apagm retagmsi jinvati || ayamiha prathamo dhayi dhatribhir
    hota yajishtho adhvareshvidyah || yamapnavano bhrigavo virurucurvaneshu citram vi~shevishe || ubha
    vamindragni ahuvaddhya | ubha dataravishagm rayinamubha vajasya sataye huve vam || aya ritviyo yato
    jato arocathah | ta njanannagna a rohatha no vardhaya rayim || agna ayugmshi pavasa a suvorjamisha
    nca nah | are badhasva ducchuna m || agne pavasva svapa asme varcah suvirya m | dadhatposhagm rayi
    mmayi || agne pavaka rocisha mandraya deva jihvaya vakshi yakshi ca || sa nah pavaka didivo 'gne devagm
    iha ''vaha | upa yajnagm havishca nah || agni shshucih kavih | shuci rocata ahutah || udagne shucayastava
    shukra bhrajanta irate | tava jyotigshyarcayah || ayurda agne dehi varcoda agne 'si varco me dehi
    tanupa agne mme pahyagne yanme tanuva una ntanma a prina citravaso svasti te paramashiyendhanastva
    shatagm hima ssamidhimahi vayasvanto vayaskritam ya~shasvanto yashaskritagm suviraso ada bhyam | agne
    sapatnadambhanam ntvamagne suryasya varcasa 'gatha | tvamagne suryavarca asi sa mmamayusha varcasa
    prajaya srija || mpashyami praja aha midaprajaso manavih | sarva bhavantu no grihe | ambha ssthambho
    vo bhakshiya mahah stha maho vo bhakshiya sahah stha saho vo bhakshiyorja vo~ bhakshiya revati ramaddhva
    'smin yonavihaiva steto ma 'pa gata bahvirme bhuyasta 'si vishvarupira morja visha ''gaupatyena ''rayasposhena
    sahasraposham mmayi vo rayah shrayantam || upa tva 'gne divedive doshavastardhiya vayam | namo bharanta
    emasi || rajantamaddhvarana ngopamritasya didivim | vardhamanagg sve dame || sa nah piteva sunave
    'gne supayano bhava | sacasva na nno antamah | uta trata shivo bhava varutthyah || ta ntva shocishtha
    didivah | sumnaya nunamimahe sakhibhyah || vasuragni rvasushravah | accha nakshi dyumattamo rayi ||
    urja vah pashyamyurja ma pashyata rayasposhena vah pashyami rayasposhena ma pashyateda sstha madhukritah
    syona ma ''vishatera madah | sahasraposham mmayi vo rayah shrayantam || tathsavitu mbhargo devasya
    dhimahi | dhiyo yonah pracodaya t || somanagg svarana nkrinuhi brahmanaspate | kakshivantam ya~ aushijam
    || kada cana starirasi nendra sashcasi dashushe nbhuya innu te dana ndevasya pricyate || pari tva
    vi~pragm sahasya dhimahi || dhrishadvarna ndivedive bhettara mbhanguravatah || agne grihapate sugrihapatiraha
    ntvaya grihapatina bhuyasagm sugrihapatirmaya tva shshatagm himastamashishama shase tantave jyotishmati
    ntamashishama shase 'mushmai jyotishmatim || mekannatrigmshacca 'samopaprayanto addhvaramityaha stomamevasmai
    yunaktyupetyaha praja vai pashava upemam mprajameva pashunimam tyasya pratnamanu dyutamityaha suvargo
    vai lokah pratna ssuvargameva lokagm samarohatyagni rmurdha divah kakudityaha murdhana nkarotyatho
    devalokadeva manushyaloke prati tishthatyayamiha prathamo dhayi dhatribhirityaha mukhyamevaina nkarotyubha
    vamindragni ahuvaddhya ityahaujo balamevava rundhe 'ya ritviya ityaha pashavo vai rayih pashunevava
    rundhe shadbhirupa tishthate shadva ritava ritushveva prati tishthati shadbhiruttarabhirupa tishthate
    dvadasha sa mpadyante dvadasha masa ssam~vathsara eva prati tishthati yatha vai purusho magnirahito
    jiryati sam va~thsarasya parastadagnipavamanibhi rupa tishthate punarnava nkarotyatho punatyevopa
    tishthate yoga evasyaisha upa tishthate dama evasyaisha upa tishthate yacnaiva 'syaishopa tishthate
    yatha papiyanchreyasa ahritya namasyati tadrigeva tadayurda agne 'syayurme dehityaha ''yurda hyesha
    varcoda agne 'si varco me dehityaha varcoda hyesha tanupa agne 'gne yanme tanuva una ntanma a prinetyaha
    yanme prajayai pashunamuna ntanma a purayeti vavaitadaha citravaso svasti te paramashiyetyaha ratri
    rvai citravasuravyushtyai va etasyai pura bra rvyushtimevava rundha indhanastva shatagm hima ityaha
    shatayuh purusha shshatendriya ayushyevendriye prati tishthatyesha vai surmi karnakavatyetaya ha sma
    vai deva asuranagm shatatarhag strigmhanti yadetaya samidhamadadhati vajramevaitacchataghnim ya~jamano
    bhratrivyaya pra harati stritya achambatkaragm sa ntvamagne suryasya varcasa 'gatha ityahaitattvamasidamaha
    mbhuyasamiti vavaitadaha tvamagne suryavarca asityaha mpashyami praja ahamityaha yavanta eva gramyah
    pashavastanevava rundhe ssthambho vo bhakshiyetyahambho hyeta mahah stha maho vo bhakshiyetyaha maho
    hyeta ssahah stha saho vo bhakshiyetyaha saho hyeta urja tyahorjo hyeta revati ramaddhvamityaha pashavo
    vai revatih nramayata ihaiva steto ma 'pa gatetyaha dhruva evaina anapagah kuruta ishtakacidva anyo
    ssagmhitasi vishvarupiriti vathsamabhi mrishatyupaivaina 'smallokaccyavate ya ahavaniya hapatyamupa
    tishthate 'sminneva loke prati tishthatyatho gar hapatyayaiva ni hnute gayatribhirupa tishthate tejo
    vai gayatri teja evatma ntricamanvaha santatyai gar va~ anu dvipado virah pra jayante ya evam 'sya
    viro jayata urja vah pashyamyurja ma pashyatetyaha ''shishamevaitama sha tyai somanagg svaranamityaha
    somapithamevava rundhe krinuhi brahmanaspata ityaha brahmavarcasamevava rundhe kada cana starirasityaha
    na starigm ratrim mupatishthate pari tva va~yamityaha paridhimevaita mpari dadhatyaskandayagne grihapata
    ityaha yathayajurevaitacchatagm hima ityaha shata ntva hemantanindhishiyeti vavaitadaha putrasya nama
    grihnatyannadamevaina nkaroti tamashishama shase tantave jyotishmatimiti bruyadyasya putro ttejasvyevasya
    brahmavarcasi putro jayate tamashishama shase 'mushmai jyotishmati miti bruyadyasya putro jata mekannatrigmshacca
    ntasyaiva tadretah sincati prajanane prajananagm hi va agnirathaushadhirantagata dahati tastato bhuyasih
    pra jayante yathsaya njuhoti reta eva tathsincati praiva pratastanena janayati tadretah sikta mprajayate
    yavaccho vai retasa tvashta rupani vikaroti tavaccho vai tatpra jayata esha vai daivyastvashta yo
    yajate bahvibhirupa tishthate retasa eva siktasya bahusho rupani vi karoti sa praiva jayate shvasshvo
    bhuya nbhavati ya evam ~vidvanagnimupatishthate 'hardevanamasi vi~ttam ~vedyamasittena saha 'vishante
    deva hina amanyanta te 'pashyannagneyi ratriragneyah pashava imamevagnigg stavama sa nah stutah pashu
    npunardasyatiti te sstuto ratriya addhyaharabhi pashunnira rjatte devah pashun vittva kamagm akurvata
    ya evam vi~dvanagnimupatishthate pashuma tyadityo va asmallokadamum lo~kamagatya mrityorabibhenmrityusam
    vi~dvanagnimupatishthate suvargameva lokameti sarvamayuretyabhi va esho 'gni a rohati ya enavupatishthate
    yatha khalu vai shreyanabhyarudhah kamayate tatha karoti naktamupa tishthate na prata vra~tani srijyante
    saha shreyagshca papiyag shcasate jyotirva agnistamo ratrirya nnaktamupatishthate jyotishaiva tamastaratyupastheyo
    'gni rmanushyayennvai yo ya~cati sa innvai tamupa rcchatyatha ko devanaharaharyacishyatiti tasmannopastheyo
    'tho khalvahurashishe vai kam ya~jamano yajata ityesha khalu va ryadagnimupatishthate tasmadupastheyah
    prajapatih pashunasrijata te srishta ahoratre pra rupatishthate svameva tadanvicchati na tatra jamyastityahuryo
    'haraharupa tishthata iti yo va agni mpratyannupa tishthate pratyenamoshati yah param mprajaya pashubhi
    reti kavatiryannivopa tishtheta naina mpratyoshati na vishva mprajaya pashubhireti || njatavedah pita
    mata ca dadhaturyadagre mbibhrihi punara madaitostavaha nnama bibharanyagne || mama nama tava ca jatavedo
    vasasi iva vivasanau ye caravah | ayushe tva vi~ pari dadhavahai punaste || namo 'gnaye 'pratividdhaya
    namo 'nadhrishtaya namah samraje agnirbrihadvaya vishvaji shshreshtho gandharvah | tvatpitaro agne
    deva stvadvivacanah | sa ngaupatyena suhite ma dhah || ayamagni mbhagavattamo 'yagm sahasrasatamah
    | asma astu suvirya rjushatamajyam ~vicchinnam ndadhatu | ya ishta ushaso nimrucashca ta ndadhami
    havisha ghritena || payasvatiroshadhayah mpayaso yatpayastena mamindra sagm srija || agne ncarishyami
    tacchakeya ntanme raddhyatam || agnigm hotaramiha tagm huve devan havamahe || a yantu deva ssumanasyamana
    viyantu deva havisho me asya || kastva yunakti sa tva yunaktu yani gharme kapala vedhasah | pushnastanyapi
    vrata indravayu vi muncatam ||abhinno gharmo jiradanuryata attastadaga npunah | iddhmo vedih paridhayashca
    sarve yajnasya ncaranti || trayastrigmsha ttantavo ye vitatnire ya imam svadhaya dadante tesha ddadhami
    svaha gharmo devagm apyetu || vaishvanaro na utya '' pra yatu paravatah | agnirukthena vahasa || ritavanam
    vai~shvanaramritasya jyotishaspati ngharmamimahe || vaishvanarasya dagmsana bhyo brihadarinadekah
    svapasyaya kavih | ubha pitara mahayannajayatagni rdyavaprithivi bhuriretasa || prishto divi prishto
    agnih prithivya mprishto vishva oshadhira vivesha | vaishvanara ssahasa prishto agni m || jato yadagne
    bhuvana vyakhyah pashu nna gopa iryah parijma | vaishvanara brahmane vinda gatum ssada nah || tvamagne
    shocisha shoshucana a rodasi aprina jayamanah | tva ndevagm abhishasteramunco vaishvanara jatavedo
    mahitva || asmakamagne maghavathsu dharayanami kshatramajaragm suvirya njayema shatinagm sahasrinam
    vajamagne tavotibhih || vaishvanarasya sumatau syama raja hika mabhishrih | ito jato vishvamidam vi~
    cashte vaishvanaro yatate suryena || ava te hedo varuna namobhirava yajnebhirimahe havirbhih | kshayannasmabhyamasura
    praceto rajannenagmsi shishrathah kritani || uduttamam va~runa pashamasmadava shrathaya | atha vayamaditya
    'nagaso aditaye syama || dadhikrav njishnorashvasya vajinah || surabhino mukha kara tprana ayugmshi
    tarishat || a dadhikra shshavasa panca krishti ssurya iva jyotisha 'pastatana | sahasrasa shshatasa
    vajyarva prinaktu maddhva samima vacagmsi | agni bhuvah | maruto yaddhavo diva ssumnayanto havamahe
    | a tu na shsharma shashamanaya santi tridhatuni dashushe yacchatadhi | asmabhya ntani maruto vi yanta
    rayi rna urushyatvaditi shsharma yacchatu | aditih patvagmhasah || mahimushu mataragm suvratanamritasya
    patnimavase huvema | tuvikshatra murucigm susharmanamaditigm supranitim || sutramana ndyamanehasagm
    susharmana maditigm supranitim | daivi nnavagg svaritra masravantima ruhema svastaye 'ruhagm shataritragm
    shatasphya 'nehasagm susharmana mekannavigmshatishca || harih om || || krishna yajurvediya taittiriya
    samhitaya mprathamakande pancamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे पञ्चमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ दे॒वा॒सु॒रा यँ॑त्ता आस॒न्ते दे॒वा वि॑ज॒यमु॑प॒यन्तो॒ ऽग्नौ वा॒मं न्न्य॑दधते॒दमु॑ नो भविष्यति॒
    यदि॑ नो जे॒ष्यन्तीति॒ तद॒ग्निर्न्य॑कामयत॒ तेनापा त्तद्दे॒वा वि॒जित्या॑व॒रुरु॑थ्समाना॒ अन्वा॑य॒ ऽऽदि॑थ्सन्त॒
    सो॑ ऽरोदी॒द्यदरो॑दी॒ द्रु॒द्रस्य॑ रुद्र॒त्वं द्र॑ज॒तग्ं हिर॑ण्यमभव॒ म॑श्रु॒जग्ं हि यो ब॒र्॒हिषि॒ ददा॑ति
    पु॒रा द्गृ॒हे रु॑दन्ति॒ तस्मा द्ब॒र्॒हिषि॒ न देय॒ग्ं॒ सो द्भा॒ग्य॑सा॒न्यथ॑ व इ॒दमिति॑ पुनरा॒धेय॑ न्ते॒
    केव॑ल॒मित्य॑ब्रुव त्खलु॒ स इत्य॑ब्रवी॒द्यो म॑द्देव॒त्य॑ त्पौ॒ष्णाः प॒शव॑ उच्यन्ते॒ त ऽऽध॑त्त॒ तेन॒
    त्वष्टा त्त्वा॒ष्ट्राः प॒शव॑ उच्यन्ते॒ त ऽध॑त्त॒ तेन॒ मनु॑रा॒र्ध्नो॒ न्मान॒व्यः॑ प्र॒जा उ॑च्यन्ते॒
    त वँथ्स॒रो वै धा॒ता तस्मा ऽनु॒ प्र जा॑यन्ते॒ य ए॒व म्पु॑नरा॒धेय॒स्यर्धिं॒ म्पु॑नरा॒धेय॒स्यर्धिं॒ वाँ
    अ॒ग्निराहि॑त इ॒च्छमा॑नः प्र॒जा म्प॒शून् यज॑मान॒स्योप॑ दोद्रावो॒द्वास्य॒ पुन॒रा द॑धीत भाग॒धेये॑नै॒वैन॒ग्ं॒
    सम॑र्धय॒त्यथो॒ शान्ति॑रे॒वास्यै॒षा पुन॑र्वस्वो॒रा द॑धीतै॒तद्वै पु॑नरा॒धेय॑स्य॒ नक्ष॑त्रं॒ त्पुन॑र्वसू॒
    स्वाया॑मे॒वैन॑ न्दे॒वता॑यामा॒धाय॑ ब्रह्मवर्च॒सी भ॑वति द॒र्भै रा द॑धा॒त्यया॑तयामत्वाय द॒र्भैरा द॑धात्य॒द्भ्य
    ए॒वैन॒मोष॑धीभ्यो ऽव॒रुद्ध्या ऽऽध॑त्ते॒ पञ्च॑कपालः पुरो॒डाशो॑ भवति॒ पञ्च॒ वा ऋ॒तव॑ ऋ॒तुभ्य॑ ए॒वैन॑मव॒रुद्ध्या
    ऽऽध॑त्ते ॥ द॒र्भैः पञ्च॑विग्ंशतिश्च ऽग्निमु॑द्वा॒सय॑ते॒ पञ्च॑कपालः पुरो॒डाशो॑ भवति॒ पाङ्क्तो॑ य॒ज्ञः
