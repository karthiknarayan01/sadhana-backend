id: rajasattamebhyahharinadattahsvamantrah
category: mantra
name:
  english: rajasattamebhyahharinadattahsvamantrah
  devanagari: राजसत्तमेभ्यःहरिणादत्ताःस्वमन्त्राः
content:
  english: rajasattamebhyah harina dattah svamantrah sarvotkrishtam grihe yadyadrajye rashtre tathottamam
    | tattacchrikrishnasevayam nyadhuste rajasattamah || 75|| arartrikam pracakrushca papuh padamritam
    hareh | prasadam bhakshayamasuh shrisvamikrishnahastatah || 76|| sevayamasuratyartham padasamvahanadibhih
    | enam prasadayamasurbhaktya padmavatipatim || 77|| jagrihuste mahamantran prajnanarayanananat |
  devanagari: राजसत्तमेभ्यः हरिणा दत्ताः स्वमन्त्राः सर्वोत्कृष्टं गृहे यद्यद्राज्ये राष्ट्रे तथोत्तमम्
    । तत्तच्छ्रीकृष्णसेवायां न्यधुस्ते राजसत्तमाः ॥ ७५॥ आरार्त्रिकं प्रचक्रुश्च पपुः पादामृतं हरेः । प्रसादं
    भक्षयामासुः श्रीस्वामिकृष्णहस्ततः ॥ ७६॥ सेवयामासुरत्यर्थं पादसंवाहनादिभिः । एनं प्रसादयामासुर्भक्त्या
    पद्मावतीपतिम् ॥ ७७॥ जगृहुस्ते महामन्त्रान् प्रज्ञानारायणाननात् ।
meaning: {}
