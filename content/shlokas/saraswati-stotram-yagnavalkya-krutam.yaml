id: saraswati-stotram-yagnavalkya-krutam
category: stotram
name:
  english: Saraswati Stotram (Yagnavalkya Krutam)
content:
  english: narayana uvaca | vagdevatayah stavanam shruyatam sarvakamadam | mahamuniryajnavalkyo yena tushtava
    tam pura || || gurushapacca sa munirhatavidyo babhuva ha | tada jagama duhkharto ravisthanam ca punyadam
    || || samprapyatapasa suryam konarke drishtigocare | tushtava suryam shokena ruroda ca punah punah
    || || suryastam pathayamasa vedavedangamishvarah | uvaca stuhi vagdevim bhaktya ca smritihetave ||
    || tamityuktva dinanatho hyantardhanam jagama sah | munih snatva ca tushtava bhaktinamratmakandharah
    || || yajnavalkya uvaca | kripam kuru jaganmatarmamevam hatatejasam | gurushapatsmritibhrashtam vidyahinam
    ca duhkhitam || || jnanam dehi smritim dehi vidyam vidyadhidevate | pratishtham kavitam dehi shaktim
    shishyaprabodhikam || || granthanirmitishaktim ca sacchishyam supratishthitam | pratibham satsabhayam
    ca vicarakshamatam shubham || || luptam sarvam daivavashannavam kuru punah punah | yathankuram janayati
    bhagavanyogamayaya || || brahmasvarupa parama jyotirupa sanatani | sarvavidyadhidevi ya tasyai vanyai
    namo namah || || yaya vina jagatsarvam shashvajjivanmritam sada | jnanadhidevi ya tasyai sarasvatyai
    namo namah || || yaya vina jagatsarvam mukamunmattavatsada | vagadhishthatridevi ya tasyai vanyai
    namo namah || || himacandanakundendukumudambhojasannibha | varnadhidevi ya tasyai caksharayai namo
    namah || || visarga bindumatranam yadadhishthanameva ca | ittham tvam giyase sadbhirbharatyai te namo
    namah || || yaya vina'tra sankhyakritsankhyam kartum na shaknute | kalasankhyasvarupa ya tasyai devyai
    namo namah || || vyakhyasvarupa ya devi vyakhyadhishthatridevata | bhramasiddhantarupa ya tasyai devyai
    namo namah || || smritishaktirjnanashaktirbuddhishaktisvarupini | pratibha kalpanashaktirya ca tasyai
    namo namah || || sanatkumaro brahmanam jnanam papraccha yatra vai | babhuva jadavatso'pi siddhantam
    kartumakshamah || || tadajagama bhagavanatma shrikrishna ishvarah | uvaca sattamam stotram vanya iti
    vidhim tada || || sa ca tushtava tam brahma cajnaya paramatmanah | cakara tatprasadena tada siddhantamuttamam
    || || yadapyanantam papraccha jnanamekam vasundhara | babhuva mukavatso'pi siddhantam kartumakshamah
    || || tada tvam ca sa tushtava santrastah kashyapajnaya | tatashcakara siddhantam nirmalam bhramabhanjanam
    || || vyasah puranasutram ca samapricchata valmikim | maunibhutah sa sasmara tvameva jagadambikam
    || || tada cakara siddhantam tvadvarena munishvarah | sa prapa nirmalam jnanam pramadadhvamsakaranam
    || || purana sutram shrutva sa vyasah krishnakalodbhavah | tvam sisheve ca dadhyau ca shatavarsham
    ca pushkare || || tada tvatto varam prapya sa kavindro babhuva ha | tada vedavibhagam ca puranani
    cakara ha || || yada mahendre papraccha tattvajnanam shiva shivam | kshanam tvameva sancintya tasyai
    jnanam dadhau vibhuh || || papraccha shabdashastram ca mahendrashca brihaspatim | divyam varshasahasram
    ca sa tvam dadhyau ca pushkare || || tada tvatto varam prapya divyam varshasahasrakam | uvaca shabdashastram
    ca tadartham ca sureshvaram || || adhyapitashca yaih shishyah yairadhitam munishvaraih | te ca tvam
    parisancintya pravartante sureshvari || || tvam samstuta pujita ca munindramanumanavaih | daityendraishca
    suraishcapi brahmavishnushivadibhih || || jadibhutah sahasrasyah pancavaktrashcaturmukhah | yam stotum
    kimaham staumi tamekasyena manavah || || ityuktva yajnavalkyashca bhaktinamratmakandharah | prananama
    niraharo ruroda ca muhurmuhuh || || tada jyotissvarupa sa tenadrishtapyuvaca tam | sukavindro bhavetyuktva
    vaikuntham ca jagama ha || || yajnavalkya kritam vanistotram yah samyatah pathet | sa kavindro mahavagmi
    brihaspati samo bhavet || || mahamurkhashca durmedha varshamekam ca yah pathet | sa panditashca medhavi
    sukavishca bhaveddhruvam || || iti shri brahmavaivarte mahapurane prakriti khande narada narayana
    samvade yajnavalkyokta vani stavanam nama pancamo'dhyayah ||
  devanagari: नारायण उवाच । वाग्देवतायाः स्तवनं श्रूयतां सर्वकामदम् । महामुनिर्याज्ञवल्क्यो येन तुष्टाव
    तां पुरा ॥ ॥ गुरुशापाच्च स मुनिर्हतविद्यो बभूव ह । तदा जगाम दुःखार्तो रविस्थानं च पुण्यदम् ॥ ॥ सम्प्राप्यतपसा
    सूर्यं कोणार्के दृष्टिगोचरे । तुष्टाव सूर्यं शोकेन रुरोद च पुनः पुनः ॥ ॥ सूर्यस्तं पाठयामास वेदवेदाङ्गमीश्वरः
    । उवाच स्तुहि वाग्देवीं भक्त्या च स्मृतिहेतवे ॥ ॥ तमित्युक्त्वा दीननाथो ह्यन्तर्धानं जगाम सः । मुनिः
    स्नात्वा च तुष्टाव भक्तिनम्रात्मकन्धरः ॥ ॥ याज्ञवल्क्य उवाच । कृपां कुरु जगन्मातर्मामेवं हततेजसम्
    । गुरुशापात्स्मृतिभ्रष्टं विद्याहीनं च दुःखितम् ॥ ॥ ज्ञानं देहि स्मृतिं देहि विद्यां विद्याधिदेवते
    । प्रतिष्ठां कवितां देहि शक्तिं शिष्यप्रबोधिकाम् ॥ ॥ ग्रन्थनिर्मितिशक्तिं च सच्छिष्यं सुप्रतिष्ठितम्
    । प्रतिभां सत्सभायां च विचारक्षमतां शुभाम् ॥ ॥ लुप्तां सर्वां दैववशान्नवं कुरु पुनः पुनः । यथाङ्कुरं
    जनयति भगवान्योगमायया ॥ ॥ ब्रह्मस्वरूपा परमा ज्योतिरूपा सनातनी । सर्वविद्याधिदेवी या तस्यै वाण्यै नमो
    नमः ॥ ॥ यया विना जगत्सर्वं शश्वज्जीवन्मृतं सदा । ज्ञानाधिदेवी या तस्यै सरस्वत्यै नमो नमः ॥ ॥ यया विना
    जगत्सर्वं मूकमुन्मत्तवत्सदा । वागधिष्ठातृदेवी या तस्यै वाण्यै नमो नमः ॥ ॥ हिमचन्दनकुन्देन्दुकुमुदाम्भोजसन्निभा
    । वर्णाधिदेवी या तस्यै चाक्षरायै नमो नमः ॥ ॥ विसर्ग बिन्दुमात्राणां यदधिष्ठानमेव च । इत्थं त्वं गीयसे
    सद्भिर्भारत्यै ते नमो नमः ॥ ॥ यया विनाऽत्र सङ्ख्याकृत्सङ्ख्यां कर्तुं न शक्नुते । कालसङ्ख्यास्वरूपा
    या तस्यै देव्यै नमो नमः ॥ ॥ व्याख्यास्वरूपा या देवी व्याख्याधिष्ठातृदेवता । भ्रमसिद्धान्तरूपा या तस्यै
    देव्यै नमो नमः ॥ ॥ स्मृतिशक्तिर्ज्ञानशक्तिर्बुद्धिशक्तिस्वरूपिणी । प्रतिभा कल्पनाशक्तिर्या च तस्यै
    नमो नमः ॥ ॥ सनत्कुमारो ब्रह्माणं ज्ञानं पप्रच्छ यत्र वै । बभूव जडवत्सोऽपि सिद्धान्तं कर्तुमक्षमः ॥
    ॥ तदाजगाम भगवानात्मा श्रीकृष्ण ईश्वरः । उवाच सत्तमं स्तोत्रं वाण्या इति विधिं तदा ॥ ॥ स च तुष्टाव
    तां ब्रह्मा चाज्ञया परमात्मनः । चकार तत्प्रसादेन तदा सिद्धान्तमुत्तमम् ॥ ॥ यदाप्यनन्तं पप्रच्छ ज्ञानमेकं
    वसुन्धरा । बभूव मूकवत्सोऽपि सिद्धान्तं कर्तुमक्षमः ॥ ॥ तदा त्वां च स तुष्टाव सन्त्रस्तः कश्यपाज्ञया
    । ततश्चकार सिद्धान्तं निर्मलं भ्रमभञ्जनम् ॥ ॥ व्यासः पुराणसूत्रं च समपृच्छत वाल्मिकिम् । मौनीभूतः
    स सस्मार त्वामेव जगदम्बिकाम् ॥ ॥ तदा चकार सिद्धान्तं त्वद्वरेण मुनीश्वरः । स प्राप निर्मलं ज्ञानं
    प्रमादध्वंसकारणम् ॥ ॥ पुराण सूत्रं श्रुत्वा स व्यासः कृष्णकलोद्भवः । त्वां सिषेवे च दध्यौ च शतवर्षं
    च पुष्करे ॥ ॥ तदा त्वत्तो वरं प्राप्य स कवीन्द्रो बभूव ह । तदा वेदविभागं च पुराणानि चकार ह ॥ ॥ यदा
    महेन्द्रे पप्रच्छ तत्त्वज्ञानं शिवा शिवम् । क्षणं त्वामेव सञ्चिन्त्य तस्यै ज्ञानं दधौ विभुः ॥ ॥ पप्रच्छ
    शब्दशास्त्रं च महेन्द्रश्च बृहस्पतिम् । दिव्यं वर्षसहस्रं च स त्वां दध्यौ च पुष्करे ॥ ॥ तदा त्वत्तो
    वरं प्राप्य दिव्यं वर्षसहस्रकम् । उवाच शब्दशास्त्रं च तदर्थं च सुरेश्वरम् ॥ ॥ अध्यापिताश्च यैः शिष्याः
    यैरधीतं मुनीश्वरैः । ते च त्वां परिसञ्चिन्त्य प्रवर्तन्ते सुरेश्वरि ॥ ॥ त्वं संस्तुता पूजिता च मुनीन्द्रमनुमानवैः
    । दैत्येन्द्रैश्च सुरैश्चापि ब्रह्मविष्णुशिवादिभिः ॥ ॥ जडीभूतः सहस्रास्यः पञ्चवक्त्रश्चतुर्मुखः ।
    यां स्तोतुं किमहं स्तौमि तामेकास्येन मानवः ॥ ॥ इत्युक्त्वा याज्ञवल्क्यश्च भक्तिनम्रात्मकन्धरः । प्रणनाम
    निराहारो रुरोद च मुहुर्मुहुः ॥ ॥ तदा ज्योतिस्स्वरूपा सा तेनादृष्टाप्युवाच तम् । सुकवीन्द्रो भवेत्युक्त्वा
    वैकुण्ठं च जगाम ह ॥ ॥ याज्ञवल्क्य कृतं वाणीस्तोत्रं यः संयतः पठेत् । स कवीन्द्रो महावाग्मी बृहस्पति
    समो भवेत् ॥ ॥ महामूर्खश्च दुर्मेधा वर्षमेकं च यः पठेत् । स पण्डितश्च मेधावी सुकविश्च भवेद्ध्रुवम्
    ॥ ॥ इति श्री ब्रह्मवैवर्ते महापुराणे प्रकृति खण्डे नारद नारायण संवादे याज्ञवल्क्योक्त वाणी स्तवनं
    नाम पञ्चमोऽध्यायः ॥
