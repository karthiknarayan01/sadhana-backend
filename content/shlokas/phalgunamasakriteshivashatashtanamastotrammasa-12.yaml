id: phalgunamasakriteshivashatashtanamastotrammasa-12
category: stotram
name:
  english: phalgunamasakriteshivashatashtanamastotrammasa 12
  devanagari: फाल्गुनमासकृतेशिवशताष्टनामस्तोत्रम्मास १२
content:
  english: om namah shivaya shantaya sahamanaya shambhave || 25|| bhavaya shivarupaya shatavartaya vedhase
    | dundubhyaya varenyaya sharanyaya pinakine || 26|| yogine dhyanagamyaya ramyaya gurave namah | avasanyaya
    vanyaya ahananyaya te namah || 27|| kamanashaya vasaya haranaya visarine | namo'stu te maheshaya namah
    shantamumapate || 28|| pradhanapurusheshaya yogadhipataye namah | namastrikagnikalaya tryambakaya
    pinakine || 29|| namah kalaya rudraya mahasatraya shuline | namo dhurjataye tubhyam jatilaya krishaya
    ca || 30|| brahmadhipataye tubhyam brahmavidyadhipaya ca | vishnoshca janakayatha kamakayantakaya
    ca || 31|| namo vedarahasyaya harshatarshaya te namah | vedavedantasaraya suparaya namo namah || 32||
    atitanagatajnaya vartamanaya brimhate | merukodandahastaya gangamastaya darine || 33|| namo buddhaya
    shuddhaya medhyaya paramatmane | bhutanathaya bhavyaya havyakavyabhuje namah || 34|| namo digvasase
    tubhyam dandine mundine namah | anadimalahinaya jnanagamyaya te namah || 35|| pradhanaparamanvadimurtaye'nantashaktaye
    | vicitramahimadharasvarupaya namonamah || 36|| bhumne simne vedadhamne vyomasamne namonamah | namastaraya
    tirthaya sargadiparamaya ca || 37|| namah paryaya varyaya sharvaya pratimaya ca | kukkuraya visheshaya
    madhyantarahitaya ca || 38|| prasannaya parayatha kamangaya suretase | garjate tarjate caiva marjate
    brahmarupine || 39|| urjaya kalanetraya durgagamyaya bhasvate | tamraya tarunayatha karanaya namonamah
    || 40|| namo dharmadigamyaya viragaya suragine | namaste nishprapancaya nirabhasaya te namah || 41||
    brahmane vishvarupaya sanatanaya manyave | pattinam pataye caiva karananam ca karine || 42|| namah
    paradaviryaya durgartishamanaya ca |
  devanagari: ॐ नमः शिवाय शान्ताय सहमानाय शम्भवे ॥ २५॥ भवाय शिवरूपाय शतावर्ताय वेधसे । दुन्दुभ्याय वरेण्याय
    शरण्याय पिनाकिने ॥ २६॥ योगिने ध्यानगम्याय रम्याय गुरवे नमः । अवसान्याय वन्याय आहनन्याय ते नमः ॥ २७॥
    कामनाशाय वासाय हरणाय विसारिणे । नमोऽस्तु ते महेशाय नमः शान्तमुमापते ॥ २८॥ प्रधानपुरुषेशाय योगाधिपतये
    नमः । नमस्त्रिकाग्निकालाय त्र्यम्बकाय पिनाकिने ॥ २९॥ नमः कालाय रुद्राय महासत्राय शूलिने । नमो धूर्जटये
    तुभ्यं जटिलाय कृशाय च ॥ ३०॥ ब्रह्माधिपतये तुभ्यं ब्रह्मविद्याधिपाय च । विष्णोश्च जनकायाथ कामकायान्तकाय
    च ॥ ३१॥ नमो वेदरहस्याय हर्षतर्षाय ते नमः । वेदवेदान्तसाराय सुपाराय नमो नमः ॥ ३२॥ अतीतानागतज्ञाय वर्तमानाय
    बृंहते । मेरुकोदण्डहस्ताय गङ्गामस्ताय दारिणे ॥ ३३॥ नमो बुद्धाय शुद्धाय मेध्याय परमात्मने । भूतनाथाय
    भव्याय हव्यकव्यभुजे नमः ॥ ३४॥ नमो दिग्वाससे तुभ्यं दण्डिने मुण्डिने नमः । अनादिमलहीनाय ज्ञानगम्याय
    ते नमः ॥ ३५॥ प्रधानपरमाण्वादिमूर्तयेऽनन्तशक्तये । विचित्रमहिमाधारस्वरूपाय नमोनमः ॥ ३६॥ भूम्ने सीम्ने
    वेदधाम्ने व्योमसाम्ने नमोनमः । नमस्ताराय तीर्थाय सर्गादिपरमाय च ॥ ३७॥ नमः पार्याय वार्याय शर्वाय प्रतिमाय
    च । कुक्कुराय विशेषाय मध्यान्तरहिताय च ॥ ३८॥ प्रसन्नाय परायाथ कामाङ्गाय सुरेतसे । गर्जते तर्जते चैव
    मार्जते ब्रह्मरूपिणे ॥ ३९॥ ऊर्जाय कालनेत्राय दुर्गगम्याय भास्वते । ताम्राय तरुणायाथ कारणाय नमोनमः
    ॥ ४०॥ नमो धर्मादिगम्याय विरागाय सुरागिणे । नमस्ते निष्प्रपञ्चाय निराभासाय ते नमः ॥ ४१॥ ब्रह्मणे विश्वरूपाय
    सनातनाय मन्यवे । पत्तीनां पतये चैव कारणानां च कारिणे ॥ ४२॥ नमः पारदवीर्याय दुर्गार्तिशमनाय च ।
