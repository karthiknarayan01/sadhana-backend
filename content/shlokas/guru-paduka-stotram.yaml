id: guru-paduka-stotram
category: stotram
name:
  english: Guru Paduka Stotram
  devanagari: गुरुपादुकास्तोत्रम् २ (सच्चिदानन्दशिवाभिनवनृसिंहभारतीविरचितम् नालीकनीकाशपदादृताभ्याम्)
content:
  english: nalikanikashapadadritabhyam narivimohadinivarakabhyam | namajjanabhishtatatipradabhyam namo
    namah shrigurupadukabhyam || 1|| shamadishatkapradavaibhavabhyam samadhidanavratadikshitabhyam | ramadhavanghristhirabhaktidabhyam
    namo namah shrigurupadukabhyam || 2|| nripalimaulivrajaratnakantisaridvirajajjhashakanyakabhyam |
    nripatvadabhyam natalokapankternamo namah shrigurupadukabhyam || anantasamsarasamudrataranaukayitabhyam
    gurubhaktidabhyam | vairagyasamrajyadapujanabhyam namo namah shrigurupadukabhyam || 4|| papandhakararkaparamparabhyam
    tapatrayahindrakhageshvarabhyam | jadyabdhisamshoshanabadavabhyam namo namah shrigurupadukabhyam ||
    5|| kavitvavarashinishakarabhyam daridryadavambudamalikabhyam | durikritanamravipattatibhyam namo
    namah shrigurupadukabhyam || 6|| nata yayoh shripatitam samiyuh kadacidapyashu daridravaryah | mukashca
    vacaspatitam hi tabhyam namo namah shrigurupadukabhyam || 7|| (mukashca) kamadisarpavrajabhanjakabhyam
    vivekavairagyanidhipradabhyam | bodhapradabhyam drutamokshadabhyam namo namah shrigurupadukabhyam
    || 8|| svarcaparanamakhileshtadabhyam svahasahayakshadhurandharabhyam | svantacchabhavapradapujanabhyam
    namo namah shrigurupadukabhyam || 9|| iti shringeri shrijagadguru shrisaccidanandashivabhinavanrisimha-
    bharatisvamibhih viracitam shrigurupadukastotram sampurnam | shudha tarangini by the composer shaccidananda
    shivabhinavanrisimhabharati of shringeri Pitham| shome sites online have reshuffled these verses and
    they differ slightly|
  devanagari: नालीकनीकाशपदादृताभ्यां नारीविमोहादिनिवारकाभ्याम् । नमज्जनाभीष्टततिप्रदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ १॥ शमादिषट्कप्रदवैभवाभ्यां समाधिदानव्रतदीक्षिताभ्याम् । रमाधवाङ्घ्रिस्थिरभक्तिदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ २॥ नृपालिमौलिव्रजरत्नकान्तिसरिद्विराजज्झषकन्यकाभ्याम् । नृपत्वदाभ्यां नतलोकपङ्क्तेर्नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ अनन्तसंसारसमुद्रतारनौकायिताभ्यां गुरुभक्तिदाभ्याम् । वैराग्यसाम्राज्यदपूजनाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम्
    ॥ ४॥ पापान्धकारार्कपरम्पराभ्यां तापत्रयाहीन्द्रखगेश्वराभ्याम् । जाड्याब्धिसंशोषणबाडवाभ्यां नमो नमः
    श्रीगुरुपादुकाभ्याम् ॥ ५॥ कवित्ववाराशिनिशाकराभ्यां दारिद्र्यदावाम्बुदमालिकाभ्याम् । दूरीकृतानम्रविपत्ततिभ्यां
    नमो नमः श्रीगुरुपादुकाभ्याम् ॥ ६॥ नता ययोः श्रीपतितां समीयुः कदाचिदप्याशु दरिद्रवर्याः । मूकश्च वाचस्पतितां
    हि ताभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥ ७॥ (मूकाश्च) कामादिसर्पव्रजभञ्जकाभ्यां विवेकवैराग्यनिधिप्रदाभ्याम्
    । बोधप्रदाभ्यां द्रुतमोक्षदाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥ ८॥ स्वार्चापराणामखिलेष्टदाभ्यां स्वाहासहायाक्षधुरन्धराभ्याम्
    । स्वान्ताच्छभावप्रदपूजनाभ्यां नमो नमः श्रीगुरुपादुकाभ्याम् ॥ ९॥ इति शृङ्गेरि श्रीजगद्गुरु श्रीसच्चिदानन्दशिवाभिनवनृसिंह-
    भारतीस्वामिभिः विरचितं श्रीगुरुपादुकास्तोत्रं सम्पूर्णम् । षुध टरन्गिनि ब्य् थे चोम्पोसेर् षच्चिदानन्द
    षिवभिनवनृसिंहभारति ओफ़् ष्रिन्गेरि Pईथम्। षोमे सितेस् ओन्लिने हवे रेशुफ़्फ़्लेद् थेसे वेर्सेस् अन्द्
    थेय् दिफ़्फ़ेर् स्लिघ्त्ल्य्।
