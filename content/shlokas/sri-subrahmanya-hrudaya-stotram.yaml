id: sri-subrahmanya-hrudaya-stotram
category: stotram
name:
  english: Sri Subrahmanya Hrudaya Stotram
content:
  english: asya shrisubrahmanyahridayastotramahamantrasya agastyo bhagavan rishih shrisubrahmanyo devata
    shrisubrahmanya prasadasiddhyarthe jape viniyogah || karanyasah subrahmanyaya angushthabhyam namah
    | shanmukhaya tarjanibhyam namah | shaktidharaya madhyamabhyam namah | shatkonasamsthitaya anamikabhyam
    namah | sarvatomukhaya kanishthikabhyam namah | tarakantakaya karatalakaraprishthabhyam namah || hridayadi
    nyasah subrahmanyaya hridayaya namah | shanmukhaya shirase svaha | shaktidharaya shikhayai vashat
    | shatkonasamsthitaya kavacaya hum | sarvatomukhaya netratrayaya vaushat | tarakantakaya astraya phat
    | bhurbhuvassuvaromiti digbandhah || dhyanam | shadvaktram shikhivahanam trinayanam citrambaralankritam
    vajram shaktimasim trishulamabhayam khetam dhanushcakrakam | pasham kukkutamankusham ca varadam dorbhirdadhanam
    sada dhyayamipsita siddhidam shivasutam shridvadashaksham guham || lamityadi pancapujam kuryat | pithika
    | satyaloke sadanande munibhih pariveshtitam | papracchurmunayah sarve brahmanam jagatam gurum ||
    || bhagavan sarvalokesha sarvajna kamalasana | sadananda jnanamurte sarvabhutahite rata || || bahudha
    proktametasya guhasya caritam mahat | hridayam shrotumicchamah tasyaiva krauncabhedinah || || brahmovaca
    | shrinvantu munayah sarve guhyadguhyataram mahat | subrahmanyasya hridayam sarvabhutahitodayam ||
    || sarvarthasiddhidam punyam sarvakaryaika sadhanam | dharmarthakamadam guhyam dhanadhanyapravardhanam
    || || rahasyametaddevanam adeyam yasya kasyacit | sarvamitrakaram gopyam tejobalasamanvitam || ||
    pravakshyami hitartham vah paritushtena cetasa | hritpadmakarnikamadhye dhyayetsarvamanoharam || ||
    atha hridayam | suvarnamandapam divyam ratnatoranarajitam | ratnastambhasahasraishca shobhitam paramadbhutam
    || || paramanandanilayam bhasvatsuryasamaprabham | devadanavagandharvagarudairyakshakinnaraih | ||
    || sevarthamagataih siddhaih sadhyairadhyushitam sada | mahayogindrasamsevyam mandaratarumanditam
    || || manividrumavedibhirmahatibhirudancitam | tanmadhye'nantaratna shricchatamandalashobhitam ||
    || ratnasimhasanam divyam ravikotisamaprabham | sarvashcaryamayam punyam sarvatah suparishkritam ||
    || tanmadhye'shtadalam padmam udyadarkaprabhodayam | nigamagamarolambalambitam cinmayodayam || ||
    divyam tejomayam divyam devatabhirnamaskritam | dedipyamanam rucibhirvishalam sumanoharam || || tanmadhye
    sarvalokesham dhyayetsarvangasundaram | anantadityasankasham ashritabhishtadayakam || || acintyajnanavijnanatejobalasamanvitam
    | sarvayudhadharam divyam sarvashcaryamayam guham || || maharha ratnakhacita shatkiritavirajitam |
    shashankardhakalaramya samudyanmaulibhushanam || || madanojjvalakodandamangalabhruvirajitam | vistirnarunapadmashri
    vilasaddvadashekshanam || || carushrivarnasampurnamukhashobhavibhasuram | maniprabhasamagrashrisphuranmakarakundalam
    || || lasaddarpanadarpadhya gandasthalavirajitam | divyakancanapushpashrinasaputavirajitam || || mandahasaprabhajalamadhuradhara
    shobhitam | sarvalakshanalakshmibhritkambukandhara sundaram || || mahanarghamaharatnadivyaharavirajitam
    | samagranagakeyurasannaddhabhujamandalam || || ratnakankanasambhasvatkaragra shrimahojjvalam | mahamanikavatabhavakshahsthalavirajitam
    || || atigambhiryasambhavyanabhinavasaroruham | ratnashrikalitabaddhalasanmadhyapradeshakam || ||
    sphuratkanakasamvitapitambarasamavritam | shringararasasampurna ratnastambhopamorukam || || svarnakahalarocishnu
    janghayugalamandalam | ratnamanjirasannaddha ramaniya padambujam || || bhaktabhishtapradam devam brahmavishnvadisamstutam
    | katakshaih karunadakshaistoshayantam jagatpatim || || cidanandajnanamurtim sarvalokapriyankaram
    | shankarasyatmajam devam dhyayeccharavanodbhavam || || anantadityacandragni tejah sampurnavigraham
    | sarvalokaikavaradam sarvavidyarthatattvakam || || sarveshvaram sarvavibhum sarvabhutahite ratam
    | evam dhyatva tu hridayam shanmukhasya mahatmanah || || sarvankamanavapnoti samyak jnanam ca vindati
    | shucau deshe samasinah shuddhatma caritahnikah || || pranmukho yatacittashca japeddhridayamuttamam
    | sakrideva manum japtva samprapnotyakhilam shubham || || idam sarvaghaharanam mrityudaridryanashanam
    | sarvasampatkaram punyam sarvaroganivaranam || || sarvakamakaram divyam sarvabhishtapradayakam |
    prajakaram rajyakaram bhagyadam bahupunyadam || || guhyadguhyataram bhuyo devanamapi durlabham | idam
    tu natapaskaya nabhaktaya kadacana || || na cashushrushave deyam na madandhaya karhicit | sacchishyaya
    kulinaya skandabhaktirataya ca || || satamabhimatayedam datavyam dharmavardhanam | ya idam paramam
    punyam nityam japati manavah | tasya shri bhagavan skandah prasanno bhavati dhruvam || || iti shriskandapurane
    subrahmanyahridayastotram ||
  devanagari: अस्य श्रीसुब्रह्मण्यहृदयस्तोत्रमहामन्त्रस्य अगस्त्यो भगवान् ऋषिः श्रीसुब्रह्मण्यो देवता
    श्रीसुब्रह्मण्य प्रसादसिद्ध्यर्थे जपे विनियोगः ॥ करन्यासः सुब्रह्मण्याय अङ्गुष्ठाभ्यां नमः । षण्मुखाय
    तर्जनीभ्यां नमः । शक्तिधराय मध्यमाभ्यां नमः । षट्कोणसंस्थिताय अनामिकाभ्यां नमः । सर्वतोमुखाय कनिष्ठिकाभ्यां
    नमः । तारकान्तकाय करतलकरपृष्ठाभ्यां नमः ॥ हृदयादि न्यासः सुब्रह्मण्याय हृदयाय नमः । षण्मुखाय शिरसे
    स्वाहा । शक्तिधराय शिखायै वषट् । षट्कोणसंस्थिताय कवचाय हुम् । सर्वतोमुखाय नेत्रत्रयाय वौषट् । तारकान्तकाय
    अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानम् । षड्वक्त्रं शिखिवाहनं त्रिनयनं चित्राम्बरालङ्कृतं
    वज्रं शक्तिमसिं त्रिशूलमभयं खेटं धनुश्चक्रकम् । पाशं कुक्कुटमङ्कुशं च वरदं दोर्भिर्दधानं सदा ध्यायामीप्सित
    सिद्धिदं शिवसुतं श्रीद्वादशाक्षं गुहम् ॥ लमित्यादि पञ्चपूजां कुर्यात् । पीठिका । सत्यलोके सदानन्दे
    मुनिभिः परिवेष्टितम् । पप्रच्छुर्मुनयः सर्वे ब्रह्माणं जगतां गुरुम् ॥ ॥ भगवन् सर्वलोकेश सर्वज्ञ कमलासन
    । सदानन्द ज्ञानमूर्ते सर्वभूतहिते रत ॥ ॥ बहुधा प्रोक्तमेतस्य गुहस्य चरितं महत् । हृदयं श्रोतुमिच्छामः
    तस्यैव क्रौञ्चभेदिनः ॥ ॥ ब्रह्मोवाच । शृण्वन्तु मुनयः सर्वे गुह्याद्गुह्यतरं महत् । सुब्रह्मण्यस्य
    हृदयं सर्वभूतहितोदयम् ॥ ॥ सर्वार्थसिद्धिदं पुण्यं सर्वकार्यैक साधनम् । धर्मार्थकामदं गुह्यं धनधान्यप्रवर्धनम्
    ॥ ॥ रहस्यमेतद्देवानां अदेयं यस्य कस्यचित् । सर्वमित्रकरं गोप्यं तेजोबलसमन्वितम् ॥ ॥ प्रवक्ष्यामि हितार्थं
    वः परितुष्टेन चेतसा । हृत्पद्मकर्णिकामध्ये ध्यायेत्सर्वमनोहरम् ॥ ॥ अथ हृदयम् । सुवर्णमण्डपं दिव्यं
    रत्नतोरणराजितम् । रत्नस्तम्भसहस्रैश्च शोभितं परमाद्भुतम् ॥ ॥ परमानन्दनिलयं भास्वत्सूर्यसमप्रभम् ।
    देवदानवगन्धर्वगरुडैर्यक्षकिन्नरैः । ॥ ॥ सेवार्थमागतैः सिद्धैः साध्यैरध्युषितं सदा । महायोगीन्द्रसंसेव्यं
    मन्दारतरुमण्डितम् ॥ ॥ मणिविद्रुमवेदीभिर्महतीभिरुदञ्चितम् । तन्मध्येऽनन्तरत्न श्रीच्छटामण्डलशोभितम्
    ॥ ॥ रत्नसिंहासनं दिव्यं रविकोटिसमप्रभम् । सर्वाश्चर्यमयं पुण्यं सर्वतः सुपरिष्कृतम् ॥ ॥ तन्मध्येऽष्टदलं
    पद्मं उद्यदर्कप्रभोदयम् । निगमागमरोलम्बलम्बितं चिन्मयोदयम् ॥ ॥ दिव्यं तेजोमयं दिव्यं देवताभिर्नमस्कृतम्
    । देदीप्यमानं रुचिभिर्विशालं सुमनोहरम् ॥ ॥ तन्मध्ये सर्वलोकेशं ध्यायेत्सर्वाङ्गसुन्दरम् । अनन्तादित्यसङ्काशं
    आश्रिताभीष्टदायकम् ॥ ॥ अचिन्त्यज्ञानविज्ञानतेजोबलसमन्वितम् । सर्वायुधधरं दिव्यं सर्वाश्चर्यमयं गुहम्
    ॥ ॥ महार्ह रत्नखचित षट्किरीटविराजितम् । शशाङ्कार्धकलारम्य समुद्यन्मौलिभूषणम् ॥ ॥ मदनोज्ज्वलकोदण्डमङ्गलभ्रूविराजितम्
    । विस्तीर्णारुणपद्मश्री विलसद्द्वादशेक्षणम् ॥ ॥ चारुश्रीवर्णसम्पूर्णमुखशोभाविभासुरम् । मणिप्रभासमग्रश्रीस्फुरन्मकरकुण्डलम्
    ॥ ॥ लसद्दर्पणदर्पाढ्य गण्डस्थलविराजितम् । दिव्यकाञ्चनपुष्पश्रीनासापुटविराजितम् ॥ ॥ मन्दहासप्रभाजालमधुराधर
    शोभितम् । सर्वलक्षणलक्ष्मीभृत्कम्बुकन्धर सुन्दरम् ॥ ॥ महानर्घमहारत्नदिव्यहारविराजितम् । समग्रनागकेयूरसन्नद्धभुजमण्डलम्
    ॥ ॥ रत्नकङ्कणसम्भास्वत्कराग्र श्रीमहोज्ज्वलम् । महामणिकवाटाभवक्षःस्थलविराजितम् ॥ ॥ अतिगाम्भीर्यसम्भाव्यनाभीनवसरोरुहम्
    । रत्नश्रीकलिताबद्धलसन्मध्यप्रदेशकम् ॥ ॥ स्फुरत्कनकसंवीतपीताम्बरसमावृतम् । शृङ्गाररससम्पूर्ण रत्नस्तम्भोपमोरुकम्
    ॥ ॥ स्वर्णकाहलरोचिष्णु जङ्घायुगलमण्डलम् । रत्नमञ्जीरसन्नद्ध रमणीय पदाम्बुजम् ॥ ॥ भक्ताभीष्टप्रदं देवं
    ब्रह्मविष्ण्वादिसंस्तुतम् । कटाक्षैः करुणादक्षैस्तोषयन्तं जगत्पतिम् ॥ ॥ चिदानन्दज्ञानमूर्तिं सर्वलोकप्रियङ्करम्
    । शङ्करस्यात्मजं देवं ध्यायेच्छरवणोद्भवम् ॥ ॥ अनन्तादित्यचन्द्राग्नि तेजः सम्पूर्णविग्रहम् । सर्वलोकैकवरदं
    सर्वविद्यार्थतत्त्वकम् ॥ ॥ सर्वेश्वरं सर्वविभुं सर्वभूतहिते रतम् । एवं ध्यात्वा तु हृदयं षण्मुखस्य
    महात्मनः ॥ ॥ सर्वान्कामानवाप्नोति सम्यक् ज्ञानं च विन्दति । शुचौ देशे समासीनः शुद्धात्मा चरिताह्निकः
    ॥ ॥ प्राङ्मुखो यतचित्तश्च जपेद्धृदयमुत्तमम् । सकृदेव मनुं जप्त्वा सम्प्राप्नोत्यखिलं शुभम् ॥ ॥ इदं
    सर्वाघहरणं मृत्युदारिद्र्यनाशनम् । सर्वसम्पत्करं पुण्यं सर्वरोगनिवारणम् ॥ ॥ सर्वकामकरं दिव्यं सर्वाभीष्टप्रदायकम्
    । प्रजाकरं राज्यकरं भाग्यदं बहुपुण्यदम् ॥ ॥ गुह्याद्गुह्यतरं भूयो देवानामपि दुर्लभम् । इदं तु नातपस्काय
    नाभक्ताय कदाचन ॥ ॥ न चाशुश्रूषवे देयं न मदान्धाय कर्हिचित् । सच्छिष्याय कुलीनाय स्कन्दभक्तिरताय च
    ॥ ॥ सतामभिमतायेदं दातव्यं धर्मवर्धनम् । य इदं परमं पुण्यं नित्यं जपति मानवः । तस्य श्री भगवान् स्कन्दः
    प्रसन्नो भवति ध्रुवम् ॥ ॥ इति श्रीस्कान्दपुराणे सुब्रह्मण्यहृदयस्तोत्रम् ॥
