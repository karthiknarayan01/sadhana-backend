id: kyta-3-caturhotra-chayanam-krishna-yajurveda-taittiriya-aranyaka-patha-cittih-sruk
category: stotram
name:
  english: KYTA 3 Caturhotra Chayanam - Krishna Yajurveda Taittiriya Aranyaka Patha - Cittih Sruk
content:
  english: krishna yajurvediya taittiriya aranyake tritiyah prapathakah shri gurubhyo namah | harih om
    || anuvakam ssruk | cittamajya m | vagvedih | adhita mbarhih | keto agnih | vijnatamagnih | vakpatirhota
    | mana upavakta | prano havih | sama ddhvaryuh || vacaspate vidhe namann | vidhema te nama | vidhestva
    addhvaryuh panca ca | dyauraddhvaryuh | rudro 'gnit | brihaspatirupavakta || vacaspate vaco viryena
    | sambhritata menayakshyase | yajamanaya varya m | a suvaskarasmai | vacaspati mpibati | jajanadindramindriyaya
    svaha 'ddhvaryu | tvashta 'gnit | mitra upavakta || soma ssomasya purogah | shukra shshukrasya purogah
    | shratasta indra somah nte cakshuh | vata mprishtham | antarikshamatma | angai ryajnam | prithivigm
    shariraih || vacaspate 'cchidraya vaca | acchidraya juhva | divi devavridhagm hotra merayasva svaha
    | satyahaviraddhvaryuh | acyutapaja agnit | acyutamana upavakta | anadhrishyashca pratidhrishyashca
    yajnasyabhigarau | ayasya udgata || vacaspate hridvidhe namann | vidhema te nama | vidhestvamasmaka
    ssomamapat | ma daivyastantu shchedi ma manushyah | namo dive | namah prithivyai svaha 'bhigarah |
    mano havih | tapasi juhomi || bhurbhuvassuvah | brahma svayambhu | brahmane svayambhuve svaha brahmana
    ekahota | sa yajnah | sa me dadatu praja ya~shah | yajnashca me bhuyat || agni rdvihota | sa bharta
    | sa me dadatu praja ya~shah | bharta ca me bhuyat || prithivi trihota | sa pratishtha || || sa me
    dadatu praja ya~shah | pratishtha ca me bhuyat || antariksha hota | sa vishthah | sa me dadatu praja
    ya~shah | vishthashca me bhuyat || vayuh pancahota | sa pranah | sa me dadatu praja ya~shah | pranashca
    me bhuyat || shshaddhota | sa ritun kalpayati | sa me dadatu praja ya~shah | ritavashca me kalpantam
    || annagm saptahota | sa pranasya pranah | sa me dadatu praja ya~shah | pranasya ca me prano bhuyat
    || dyaurashtahota | so || sa me dadatu praja ya~shah | anadhrishyashca bhuyasam || adityo navahota
    | sa tejasvi | sa me dadatu praja ya~shah | tejasvi ca bhuyasam || prajapati rdashahota | sa idagm
    sarva m | sa me dadatu praja 'gnirbharta prithivi pratishtha vi~shtha vayuh pranashcandrama ritunannagm
    sa pranasya prano dyauranadhrishya adityah sa tejasvi prajapati ssa idagm sarvagm sarva ryajurbhih
    | savita stomaih | indra ukthamadaih | mitravarunavashisha | angiraso dhishniyairagnibhih | marutah
    sadohavirdhanabhya m | apah prokshanibhih | oshadhayo barhisha || tvashteddhmena | vishnu ryajnena
    | vasava ajyena | aditya dakshinabhih | vishve deva urja | pusha svagakarena | brihaspatih purodhaya
    | prajapatirudgithena | antariksha mpavitrena | vayuh patraih senendrasya | dhena brihaspateh | patthya
    pushnah | vagvayoh | diksha somasya | prithivyagneh | vasuna ngayatri | rudrana ntrishtuk | adityana
    njagati | vishnoranushtuk || || varunasya virat | yajnasya panktih | prajapateranumatih | mitrasya
    shraddha | savituh prasutih | suryasya maricih | candramaso rohini | rishinamarundhati | parjanyasya
    vidyut | catasro dishah | catasro 'vantaradishah | ahashca ratrishca | krishishca vrishtishca | tvishishcapacitishca
    | apashcaushadhayashca | urkca sunrita ca devana devasya tva savituh prasave | ashvino mpratigrihnami
    | raja tva varuno nayatu devi dakshine 'gnaye hiranyam | tenamritatvamashyam | vayo datre | mayo mahyamastu
    pratigrahitre | ka ida nkasma adat | kamah kamaya | kamo data || || kamah pratigrahita | kamagm samudramavisha
    | kamena tva pratigrihnami | kamaitatte | esha te kama dakshina | uttanastva ''ngirasah pratigrihnatu
    | somaya vasah | rudraya gam | varunayashva m | prajapataye purusham || ritya ashvataragardabhau |
    himavato hastina sragalankarane | vishve bhyo devebhyo dhanyam | vace m | brahmana odanam | samudrayapah
    || ngirasayanah | vaishvanaraya ratha m || vaishvanarah pratnatha nakamaruhat | divah prishtha ssumanmabhih
    | sa pu rvavajjanayajjantave dhana m | samanamajma pariyati jagrivih || raja tva varuno nayatu devi
    dakshine vaishvanaraya ratha m | tenamritatvamashyam | vayo datre | mayo mahyamastu pratigrahitre
    || nkasma adat | kamah kamaya | kamo data | kamah pratigrahita | kamagm samudramavisha | kamena tva
    pratigrihnami | kamaitatte | esha te kama dakshina | uttanastva ''ngirasah pratigrihnatu || mpariveda
    venam | indrasyatmana ndashadha carantam | anta ssamudre manasa carantam | brahma shshasta jananam
    | eka ssanbahudha vicarah | shatagm shukrani yatraika mbhavanti | sarve veda yatraika mbhavanti |
    sarve hotaro yatraika mbhavanti | sa manasina atma jananam || shshasta jananagm sarva hotaro yatra
    sampada ngacchanti devaih | sa manasina atma jananam || brahmendramagni njagatah pratishtham | diva
    atmanagm savitara 'nu klaptam | vaco virya 'nvavindat || antah pravishta nkartarametam | tvashtaragm
    rupani vikurvantam ya~jnametam | catur nkavayo nicikyuh || antah pravishta nkartarametam | devana
    nguhasu | amritena klaptam ya~jnametam | catur nkavayo nicikyuh || shata nniyutah pariveda vishva
    vishvavarah | vishvamidam vri~nati | indrasyatma nihitah pancahota | amrita ndevanamayuh prajana ||
    indragm rajanagm savitarametam | vayoratmana nkavayo nicikyuh | rashmigm rashmina mmaddhye tapantam
    | ritasya pade kavayo nipa mbibharti | anirbhinna ndakoshagm shushmamahuh pranamulba m | tena klripto
    'mritenahamasmi || suvarna nkoshagm rajasa parivritam | devanam || amritasya purnantamu kalam vi~cakshate
    | padagm shaddhoturna kilavi vithse || yenartavah pancadhota klaptah | uta va shaddha manasota klriptah
    | tagm shaddhotaramritubhih kalpamanam | ritasya pade kavayo nipa nti || antah pravishta nkartarametam
    | antashcandramasi manasa carantam | sahaiva santa nna vijananti devah | indrasyatmanagm shatadha
    carantam || || indro raja jagato ya ishe | saptahota saptadha viklriptah || parena tantu mparishicyamanam
    | antaraditye manasa carantam | devanagm hridaya 'nvavindat || brahmaitadbrahmana ujjabhara | arkagg
    shcotantagm sarirasya maddhye thsapta peravah | mehanti bahulag m | bahvashvamindra gomatim || m |
    sa harirvasuvittamah | perurindraya pinvate || bahvashvamindra gomatim | acyuta m | mahyamindro niyacchatu
    || shatagm shata asya yukta harinam | arvama yatu vasubhi rashmirindrah | pramagmhamano bahulag m
    | rashmirindrah savita me niyacchatu || ntejo madhumadindriyam | mayyayamagnirdadhatu || harih patangah
    patari suparnah | divikshayo nabhasa ya eti | sa na indrah kamavara mparivartate prithu | hiranyajyoti
    njyotirnabhasa sarpadeti | sa na indrah kamavara ndadatu || sapta yunjanti rathamekacakram || || eko
    ashvo vahati saptanama | trinabhi cakramajaramanarvam | yenema vishva bhuvanani tasthuh || bhadra
    mpashyanta upaseduragre ssuvarvidah | tatah kshatra mbalamojashca jatam | tadasmai deva abhi sa nnamantu
    || shvetagm rashmi mbobhujyamanam | apa mbhuvanasya gopam | indra nnicikyuh parame vyomann || || rohinih
    pingala ekarupah | ksharantih pingala ekarupah | shatagm sahasrani prayutani navyanam || ayam ya~shshveto
    rashmih | pari sarvamida ndadatu || shveto rashmih pari sarva mbabhuva | suvanmahya vishvarupan ||
    patangamaktamasurasya mayaya || hrida pashyanti manasa manishinah | samudre antah kavayo vicakshate
    | maricina mpadamicchanti vedhasah || patango vaca mmanasa bibharti | ta dgarbhe antah | ta mmanisham
    | ritasya pade kavayo nipa nti || ye gramyah pashavo vishvarupah | virupa ssanto bahudhaikarupah |
    agnistagm agre pramumoktu devah || || prajapatih prajaya sam stukestuke | yuvamasmasu niyacchatam
    | prapra yajnapati ntira || ye gramyah pashavo vishvarupah | virupa ssanto bahudhaikarupah | teshagm
    saptanamiha rantirastu | rayasposhaya suprajastvaya suviryaya || ya aranyah pashavo vishvarupah |
    virupa ssanto bahudhaikarupah || || vayustagm agre pramumoktu devah | prajapatih prajaya sam vi~danah
    || idayai sripta nghritavaccaracaram | deva anvavindanguha hitam || ya aranyah pashavo vishvarupah
    | virupa ssanto bahudhaikarupah | teshagm saptanamiha rantirastu | rayasposhaya suprajastvaya suviryaya
    || sha purushah | sahasraksha ssahasrapat | sa bhumim vi~shvato vritva | atyatishtha ddashangulam
    || purusha evedagm sarva m | utamritatvasyeshanah | yadannenatirohati || etavanasya mahima | ato jyayagshca
    purushah || 'sya vishva bhutani | tripadasyamrita ndivi || tripadurdhva udaitpurushah | pado tpunah
    | tato vishvam vya~kramat | sashananashane abhi || tasma dviradajayata | virajo adhi purushah | sa
    jato atyaricyata | pashca || yatpurushena havisha | deva yajnamatanvata | vasanto asyasidajya m |
    grishma iddhma shsharaddhavih || saptasyasa ssapta samidhah kritah | deva ya ntanvanah | abaddhna
    mbarhishi praukshann | purusha || tena deva ayajanta | saddhya rishayashca ye || tasma thsarvahutah
    | sambhrita mprishadajyam | pashug shcakre vayavyan | aranya ngramyashca ye || tasma ssamani jajnire
    | chandagmsi jajnire tasma || tasmadashva ajayanta | ye ke cobhayadatah | gavo ha jajnire tasma jjata
    ajavayah || ya vya~dadhuh | katidha vyakalpayann | mukha nkimasya kau bahu | kavuru padavucyete ||
    brahmano 'sya mukhamasit | bahu rajanyah kritah || dvaishyah | padbhyagm shudro ajayata || candrama
    manaso jatah | caksho ssuryo ajayata | mukhadindrashcagnishca | prana dvayurajayata || nabhya asidantariksham
    | shir ssamavartata | padbhya t | tatha lokagm akalpayann || ntamasastu pare | sarvani rupani vicitya
    dhirah | namani kritva || dhata purastadyamudajahara | shakrah pravidva npradishashcatasrah | tamevam
    vi~dvanamrita iha bhavati | nanyah pantha ayanaya vidyate || yajnena yajnamayajanta devah | tani dharmani
    prathamanyasann | te ha naka mmahimanah sacante | yatra purve saddhya ssambhutah prithivyai rasa ssamavartatadhi
    | tasya tvashta vidadha tpurushasya vishvamajanamagre ntamasah parastat | tamevam vi~dvanamrita iha
    bhavati | nanyah pantha vidyate 'yanaya || prajapatishcarati garbhe antah | ajayamano bahudha vijayate
    || || tasya dhirah parijananti yoni mpadamicchanti vedhasah || yo devebhya atapati | yo devana mpurohitah
    | purvo yo devebhyo jatah | namo rucaya brahmaye || ruca njanayantah | deva agre tadabruvann | yastvaiva
    hmano vidyat | tasya deva asanvashe || hrishca te lakshmishca patnyau | ahoratre par shve | nakshatrani
    rupam | ashvinau vyatta nbhriyamano bibharti | eko devo bahudha nivishtah | yada bhara ntandrayate
    sa bhartu mpunarastameti || tameva mrityumamrita ntamu goptaramahuh | sa bhrito bhriyamano bibharti
    | ya enam ve~da satyena bhartu m || sadyo jatamuta jahatyeshah | uto jaranta || uto bahunekamaharjahara
    | atandro deva ssadameva prarthah || yastadveda yata ababhuva | sandha nca yagm sandadhe brahmanaishah
    | ramate tasminnuta jirne shayane | naina njahatyahassu purvyeshu || tvamapo anu sarva shcaranti janatih
    | vathsa mpayasa punanah | tvamagnigm havyavahagm sami mbharta matarishva ya~jnastvamu vevasi somah
    | tava deva havamayanti sarve 'si bahunanupravishtah | namaste astu suhavo ma edhi || namo vamastu
    shrinutagm hava mme | pranapanavajiragm sacamrantau | hvayami va mbrahmana turtameta yu~vana || pranapanau
    sam vi~danau jahitam | amushyasuna ma sangasatham || mme deva brahmana sam vi~danau | vadhaya datta
    ntamahagm hanami || asajjajana sata ababhuva | yam njajana sa u gopo asya | yada bhara ntandrayate
    sa bhartu mpunarastameti || tadvai tva mprano abhavah | mahanbhogah prajapateh | bhujah karishyamanah
    | yaddevanpranayo nava || harigm harantamanuyanti devah | vishvasyeshanam mmatinam | brahma sarupamanu
    medamaga rvikramasva || macchido mrityo ma vadhih | ma me balam vi~vriho ma pramoshih | praja mma
    me ririsha ayurugra | nricakshasa ntva havisha vidhema || sadyashcakamanaya | pravepanaya mrityave
    || prasma asha ashrinvann | kamenajanaya npunah || kamena me kama aga t | hridayadddhridaya mmrityoh
    | yadamishamadah priyam | tadaitupa mamabhi || para mmrityo anu parehi pantha m | yaste sva itaro
    devayana t | cakshushmate shrinvate te bravimi | ma nah prajagm ririsho mota viran || pra purvya mmanasa
    vandamanah | nadhamano vrishabha shaninam | yah prajanamekaranmanushinam | mrityum ya~je prathamajamritasya
    || shato jyotishkridasi surya | vishvamabhasi rocanam | upayamagrihito 'si suryaya tva bhrajasvata
    esha te yoni ssuryaya tva bhrajasvate || a pyayasva madintama soma vishvabhirutibhih | bhava na iyushte
    ye purvataramapashyan vyucchantimushasa mmartyasah | asmabhiru nu praticakshya 'bhudo te yanti ye
    aparishu pashyan || ntva sadayami jyotishkrita ntva sadayami jyotirvida ntva sadayami bhasvati ntva
    sadayami jvalanti ntva sadayami malmalabhavanti ntva sadayami dipyamana ntva sadayami rocamanam tva
    sadayamyajasra ntva sadayami brihajjyotisha ntva sadayami bodhayanti ntva sadayami jagrati ''yasaya
    svaha viyasaya svaha sam 'vayasaya svaha shuce svaha shokaya svaha tapyatvai svaha tapate svaha brahmahatyayai
    svaha sarvasmai svaha cittagm santanena bhavam ntanimna pashupatigg sthulahridayenagnigm hridayena
    rudram mmatasnabhyam mahadevamantah pa shvenaushishthahanagm shinginikoshya r mahahavir hota citta
    mekavigmshatih || harih om || || krishna yajurvediya taittiriya aranyake tritiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके तृतीयः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं
    स्स्रुक् । चि॒त्तमाज्य म् । वाग्वेदिः॑ । आधी॑त म्ब॒र्॒हिः । केतो॑ अ॒ग्निः । विज्ञा॑तम॒ग्निः । वाक्प॑ति॒र्॒होता
    । मन॑ उपव॒क्ता । प्रा॒णो ह॒विः । सामा द्ध्व॒र्युः ॥ वाच॑स्पते विधे नामन्न् । वि॒धेम॑ ते॒ नाम॑ । वि॒धेस्त्व
    अ॒द्ध्व॒र्युः पञ्च च । द्यौर॑द्ध्व॒र्युः । रु॒द्रो ऽग्नीत् । बृह॒स्पति॑रुपव॒क्ता ॥ वाच॑स्पते वा॒चो
    वी॒र्ये॑ण । सम्भृ॑तत मे॒नाय॑क्ष्यसे । यज॑मानाय॒ वार्य म् । आ सुव॒स्कर॑स्मै । वा॒चस्पति॒ म्पिबति ।
    ज॒जन॒दिन्द्र॑मिन्द्रि॒याय॒ स्वाहा ऽद्ध्व॒र्यू । त्वष्टा॒ ऽग्नीत् । मि॒त्र उ॑पव॒क्ता ॥ सोम॒ स्सोम॑स्य
    पुरो॒गाः । शु॒क्र श्शु॒क्रस्य॑ पुरो॒गाः । श्रा॒तास्त॑ इन्द्र॒ सोमाः न्ते॒ चक्षुः॑ । वात॑ म्पृ॒ष्ठम्
    । अ॒न्तरि॑क्षमा॒त्मा । अङ्गै र्य॒ज्ञम् । पृ॒थि॒वीग्ं शरी॑रैः ॥ वाच॑स्प॒ते ऽच्छि॑द्रया वा॒चा । अच्छि॑द्रया
    जु॒ह्वा । दि॒वि दे॑वा॒वृध॒ग्ं॒ होत्रा॒ मेर॑यस्व॒ स्वाहा । स॒त्यह॑विरद्ध्व॒र्युः । अच्यु॑तपाजा अ॒ग्नीत्
    । अच्यु॑तमना उपव॒क्ता । अ॒ना॒धृ॒ष्यश्चा प्रतिधृ॒ष्यश्च॑ य॒ज्ञस्या॑भिग॒रौ । अ॒यास्य॑ उद्गा॒ता ॥ वाच॑स्पते
    हृद्विधे नामन्न् । वि॒धेम॑ ते॒ नाम॑ । वि॒धेस्त्वम॒स्माक॒ स्सोम॑मपात् । मा दैव्य॒स्तन्तु॒ श्छेदि॒ मा
    म॑नु॒ष्यः॑ । नमो॑ दि॒वे । नमः॑ पृथि॒व्यै स्वाहा ऽभिग॒रः । मनो॑ ह॒विः । तप॑सि जुहोमि ॥ भूर्भुव॒स्सुवः॑
    । ब्रह्म॑ स्वय॒म्भु । ब्रह्म॑णे स्वय॒म्भुवे॒ स्वाहा ब्रा॒ह्म॒ण एक॑होता । स य॒ज्ञः । स मे॑ ददातु प्र॒जा
    यँशः॑ । य॒ज्ञश्च॑ मे भूयात् ॥ अ॒ग्नि र्द्विहो॑ता । स भ॒र्ता । स मे॑ ददातु प्र॒जा यँशः॑ । भ॒र्ता च॑
    मे भूयात् ॥ पृ॒थि॒वी त्रिहो॑ता । स प्र॑ति॒ष्ठा ॥ ॥ स मे॑ ददातु प्र॒जा यँशः॑ । प्र॒ति॒ष्ठा च॑ मे भूयात्
    ॥ अ॒न्तरि॑क्ष॒ होता । स वि॒ष्ठाः । स मे॑ ददातु प्र॒जा यँशः॑ । वि॒ष्ठाश्च॑ मे भूयात् ॥ वा॒युः पञ्च॑होता
    । स प्रा॒णः । स मे॑ ददातु प्र॒जा यँशः॑ । प्रा॒णश्च॑ मे भूयात् ॥ ष्षड्ढो॑ता । स ऋ॒तून् क॑ल्पयाति ।
    स मे॑ ददातु प्र॒जा यँशः॑ । ऋ॒तव॑श्च मे कल्पन्ताम् ॥ अन्नग्ं॑ स॒प्तहो॑ता । स प्रा॒णस्य॑ प्रा॒णः । स
