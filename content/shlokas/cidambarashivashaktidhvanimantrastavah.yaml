id: cidambarashivashaktidhvanimantrastavah
category: mantra
name:
  english: cidambarashivashaktidhvanimantrastavah
  devanagari: चिदम्बरशिवशक्तिध्वनिमन्त्रस्तवः
content:
  english: pralayagniprabham raudram sahasrashirasa yutam | dvisahasrakaram dirgham sakalayudhapanikam
    || 2|| sattahasam mahabhimam sarvasamharatandavam | dhyayenmayanca ehyehi dhvanimantram samuccaret
    || 3|| onkarapanjaravasam onkarakarabhasuram | cintayami mahadevam cidambarasabhanatam || 4|| hrinkararupininetra
    shadanghrikamalananam | cintayami mahadevam cidambarasabhanatam || 5|| ejajjagadadhishanam edhamanaprabhavalim
    | cintayami mahadevam cidambarasabhanatam || 6|| hiranmayasabhantasssatham himavattanayapatim | cintayami
    mahadevam cidambarasabhanatam || 7|| enankajvalanarkasham enonashakaram prabhum | cintayami mahadevam
    cidambarasabhanatam || 8|| himodacandanasnananirmalikritavigraham | cintayami mahadevam cidambarasabhanatam
    || 9|| shivam shivapradataram shitikantham shivanvitam | cintayami mahadevam cidambarasabhanatam ||
    10|| varishtham sarvadevanam varadam vashisamstutam | cintayami mahadevam cidambarasabhanatam || 11||
    shishoh kshirapradataram shiladatanayarcitam | cintayami mahadevam cidambarasabhanatam || 12|| vasishthabhaginipujyam
    valarivijayapradam | cintayami mahadevam cidambarasabhanatam || 13|| sharodbhavasya janakam sharaccandranibhakritim
    | cintayami mahadevam cidambarasabhanatam || 14|| rasaratham rasesheshum ravicandrarathangakam | cintayami
    mahadevam cidambarasabhanatam || 15|| nanta
  devanagari: प्रलयाग्निप्रभं रौद्रं सहस्रशिरसा युतम् । द्विसहस्रकरं दीर्घं सकलायुधपाणिकम् ॥ २॥ साट्टहासं
    महाभीमं सर्वसंहारताण्डवम् । ध्यायेन्मायाञ्च एह्येहि ध्वनिमन्त्रं समुच्चरेत् ॥ ३॥ ओङ्कारपञ्जरावासं
    ओङ्काराकारभासुरम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ ४॥ ह्रीङ्काररूपिणीनेत्र षडङ्घ्रिकमलाननम् ।
    चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ ५॥ एजज्जगदधीशानं एधमानप्रभावलिम् । चिन्तयामि महादेवं चिदम्बरसभानटम्
    ॥ ६॥ हिरण्मयसभान्तस्स्सथं हिमवत्तनयापतिम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ ७॥ एणाङ्कज्वलनार्काशं
    एनोनाशकरं प्रभुम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ ८॥ हिमोदचन्दनस्नाननिर्मलीकृतविग्रहम् । चिन्तयामि
    महादेवं चिदम्बरसभानटम् ॥ ९॥ शिवं शिवप्रदातारं शितिकण्ठं शिवान्वितम् । चिन्तयामि महादेवं चिदम्बरसभानटम्
    ॥ १०॥ वरिष्ठं सर्वदेवानां वरदं वशिसंस्तुतम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ ११॥ शिशोः क्षीरप्रदातारं
    शिलादतनयार्चितम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ १२॥ वसिष्ठभगिनीपूज्यं वलारिविजयप्रदम् । चिन्तयामि
    महादेवं चिदम्बरसभानटम् ॥ १३॥ शरोद्भवस्य जनकं शरच्चन्द्रनिभाकृतिम् । चिन्तयामि महादेवं चिदम्बरसभानटम्
    ॥ १४॥ रसारथं रसेशेषुं रविचन्द्ररथाङ्गकम् । चिन्तयामि महादेवं चिदम्बरसभानटम् ॥ १५॥ णान्ता
