id: shakambharikavacam
category: kavacha
name:
  english: shakambharikavacam
  devanagari: शाकम्भरीकवचम्
content:
  english: dhyarthe jape viniyogah || dhyanam | shulam khadgam ca damarum dadhanamabhayapradam | simhasanastham
    dhyayami devi shakambharimaham || 3|| atha kavacam | shakambhari shirah patu netre me raktadantika
    | karno rame nandajah patu nasikam patu parvati || 4|| oshthau patu mahakali mahalakshmishca me mukham
    | mahasarasvati jihvam camunda'vatu me radam || 5|| kalakanthasati kantham bhadrakali karadvayam |
    hridayam patu kaumari kukshim me patu vaishnavi || 6|| nabhim me'vatu varahi brahmi parshve mamavatu
    | prishtham me narasimhi ca yogisha patu me katim || 7|| uru me patu vamorurjanuni jagadambika | janghe
    me candikam patu padau me patu shambhavi || 8|| shirahprabhriti padantam patu mam sarvamangala | ratrau
    patu diva patu trisandhyam patu mam shiva || 9|| gacchantam patu tishthantam shayanam patu shulini
    | rajadvare ca kantare khadgini patu mam pathi || 10|| sangrame sankate vade nadyuttare mahavane |
    bhramanenatmashulasya patu mam parameshvari || 11|| griham patu kutumbam me pashukshetradhanadikam
    | yogakshaimam ca satatam patu me banashankari || 12|| itidam kavacam punyam shakambharyah prakirtitam
    | yastrisandhyam pathecchakra sarvapadbhih sa mucyate || 13|| tushtim pushtim tatharogyam santatim
    sampadam ca sham | shatrukshayam samapnoti kavacasyasya pathatah || 14|| shakinidakinibhuta balagrahamahagrahah
    | nashyanti darshanattrastah kavacam pathatastvidam || 15|| sarvatra jayamapnoti dhanalabham ca pushkalam
    | vidyam vakpatutam capi shakambharyah prasadatah || 16|| avartanasahasrena kavacasyasya vasava |
    yadyatkamayate'bhishtam tatsarvam prapnuyad dhruvam || 17|| || iti shri skandapurane skandaproktam
    shakambhari kavacam sampurnam ||
  devanagari: ध्यर्थे जपे विनियोगः ॥ ध्यानम् । शूलं खड्गं च डमरुं दधानामभयप्रदम् । सिंहासनस्थां ध्यायामि
    देवी शाकम्भरीमहम् ॥ ३॥ अथ कवचम् । शाकम्भरी शिरः पातु नेत्रे मे रक्तदन्तिका । कर्णो रमे नन्दजः पातु
    नासिकां पातु पार्वती ॥ ४॥ ओष्ठौ पातु महाकाली महालक्ष्मीश्च मे मुखम् । महासरस्वती जिह्वां चामुण्डाऽवतु
    मे रदाम् ॥ ५॥ कालकण्ठसती कण्ठं भद्रकाली करद्वयम् । हृदयं पातु कौमारी कुक्षिं मे पातु वैष्णवी ॥ ६॥
    नाभिं मेऽवतु वाराही ब्राह्मी पार्श्वे ममावतु । पृष्ठं मे नारसिंही च योगीशा पातु मे कटिम् ॥ ७॥ ऊरु
    मे पातु वामोरुर्जानुनी जगदम्बिका । जङ्घे मे चण्डिकां पातु पादौ मे पातु शाम्भवी ॥ ८॥ शिरःप्रभृति पादान्तं
    पातु मां सर्वमङ्गला । रात्रौ पातु दिवा पातु त्रिसन्ध्यं पातु मां शिवा ॥ ९॥ गच्छन्तं पातु तिष्ठन्तं
    शयानं पातु शूलिनी । राजद्वारे च कान्तारे खड्गिनी पातु मां पथि ॥ १०॥ सङ्ग्रामे सङ्कटे वादे नद्युत्तारे
    महावने । भ्रामणेनात्मशूलस्य पातु मां परमेश्वरी ॥ ११॥ गृहं पातु कुटुम्बं मे पशुक्षेत्रधनादिकम् । योगक्षैमं
    च सततं पातु मे बनशङ्करी ॥ १२॥ इतीदं कवचं पुण्यं शाकम्भर्याः प्रकीर्तितम् । यस्त्रिसन्ध्यं पठेच्छक्र
    सर्वापद्भिः स मुच्यते ॥ १३॥ तुष्टिं पुष्टिं तथारोग्यं सन्ततिं सम्पदं च शम् । शत्रुक्षयं समाप्नोति
    कवचस्यास्य पाठतः ॥ १४॥ शाकिनीडाकिनीभूत बालग्रहमहाग्रहाः । नश्यन्ति दर्शनात्त्रस्ताः कवचं पठतस्त्विदम्
    ॥ १५॥ सर्वत्र जयमाप्नोति धनलाभं च पुष्कलम् । विद्यां वाक्पटुतां चापि शाकम्भर्याः प्रसादतः ॥ १६॥ आवर्तनसहस्रेण
    कवचस्यास्य वासव । यद्यत्कामयतेऽभीष्टं तत्सर्वं प्राप्नुयाद् ध्रुवम् ॥ १७॥ ॥ इति श्री स्कन्दपुराणे
    स्कन्दप्रोक्तं शाकम्भरी कवचं सम्पूर्णम् ॥
