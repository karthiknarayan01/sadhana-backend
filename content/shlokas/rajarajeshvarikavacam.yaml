id: rajarajeshvarikavacam
category: kavacha
name:
  english: rajarajeshvarikavacam
  devanagari: राजराजेश्वरीकवचम्
content:
  english: patu nityam haripriya || 23|| adhare vagbhavah patu kamarajo hridi priye | shaktikutam tatha
    patu bhruvormadhye ca parvati || 24|| shirshe kutatrayam patu lalate sarvamantrakah | ashtavimshativarneyam
    mukhavritte sada'vatu || 25|| shodashiyam mahavidya brahmavidyaiva kevala | bhogamokshaprada devi
    kevalatmasvarupini || 26|| kameshvari lalate'vyanmukheshu bhagamalini | dakshanetre sada patu nityaklinna
    mahodaya || 27|| bherunda vamanetre'vyat karne vai vahnivasini | mahavidyeshvari patu vamakarnapradeshake
    || 28|| dakshanasapute patu shivaduti maheshvari | vamanasapute patu tvarita sarvasiddhida || 29||
    dakshagande sada patu nityam mam kulasundari | trailokyavimala patu vamagandapradeshake || 30|| oshthe
    nilapataka'vyadadhare vijaya'vatu | urdhvadante sada patu devi mam sarvamangala || 31|| adhodantapradeshe'vyannityam
    jvalamshumalini | vicitra sarvada patu nityam murddhani parvati || 32|| asam pradhanabhuta ya mahatripurasundari
    | shodashi sa sada patu mukhe vai parameshvari || 33|| prishthadeshe sada pantu guravastrividhashca
    te | padayoh sarvada patu tripura parameshvari || 34|| anudeshe sada patu devi mam tripureshvari |
    urudvaye sada patu devi tripurasundari || 35|| tripuravasini devi katideshe sada'vatu | tripurashrishca
    mam nityam guhyadeshe sada'vatu || 36|| muladhare sada patu devi tripuramalini | nabhau tripurasiddha'vyat
    tripura ca sada hridi || 37|| brahmarandhre sada patu mahatripurasundari | asam tu mantrabijani proktasthaneshu
    vinyaset || 38|| pashandaganamadhye tu buddho mam parirakshatu | brahma'vyad brahmasamha
  devanagari: पातु नित्यं हरिप्रिया ॥ २३॥ आधारे वाग्भवः पातु कामराजो हृदि प्रिये । शक्तिकूटं तथा पातु
    भ्रुवोर्मध्ये च पार्वति ॥ २४॥ शीर्षे कूटत्रयं पातु ललाटे सर्वमन्त्रकः । अष्टाविंशतिवर्णेयं मुखवृत्ते
    सदाऽवतु ॥ २५॥ षोडशीयं महाविद्या ब्रह्मविद्यैव केवला । भोगमोक्षप्रदा देवी केवलात्मस्वरूपिणी ॥ २६॥ कामेश्वरी
    ललाटेऽव्यान्मुखेषु भगमालिनी । दक्षनेत्रे सदा पातु नित्यक्लिन्ना महोदया ॥ २७॥ भेरुण्डा वामनेत्रेऽव्यात्
    कर्णे वै वह्निवासिनी । महाविद्येश्वरी पातु वामकर्णप्रदेशके ॥ २८॥ दक्षनासापुटे पातु शिवदूती महेश्वरी
    । वामनासापुटे पातु त्वरिता सर्वसिद्धिदा ॥ २९॥ दक्षगण्डे सदा पातु नित्यं मां कुलसुन्दरी । त्रैलोक्यविमला
    पातु वामगण्डप्रदेशके ॥ ३०॥ ओष्ठे नीलपताकाऽव्यादधरे विजयाऽवतु । ऊर्ध्वदन्ते सदा पातु देवी मां सर्वमङ्गला
    ॥ ३१॥ अधोदन्तप्रदेशेऽव्यान्नित्यं ज्वालांशुमालिनी । विचित्रा सर्वदा पातु नित्यं मूर्द्धनि पार्वति
    ॥ ३२॥ आसां प्रधानभूता या महात्रिपुरसुन्दरी । षोडशी सा सदा पातु मुखे वै परमेश्वरी ॥ ३३॥ पृष्ठदेशे सदा
    पान्तु गुरवस्त्रिविधाश्च ते । पादयोः सर्वदा पातु त्रिपुरा परमेश्वरी ॥ ३४॥ अनुदेशे सदा पातु देवी मां
    त्रिपुरेश्वरी । ऊरुद्वये सदा पातु देवी त्रिपुरसुन्दरी ॥ ३५॥ त्रिपुरवासिनी देवी कटिदेशे सदाऽवतु । त्रिपुराश्रीश्च
    मां नित्यं गुह्यदेशे सदाऽवतु ॥ ३६॥ मूलाधारे सदा पातु देवी त्रिपुरमालिनी । नाभौ त्रिपुरसिद्धाऽव्यात्
    त्रिपुरा च सदा हृदि ॥ ३७॥ ब्रह्मरन्ध्रे सदा पातु महात्रिपुरसुन्दरी । आसां तु मन्त्रबीजानि प्रोक्तस्थानेषु
    विन्यसेत् ॥ ३८॥ पाषण्डगणमध्ये तु बुद्धो मां परिरक्षतु । ब्रह्माऽव्याद् ब्रह्मसंहा
