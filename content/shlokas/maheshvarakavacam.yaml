id: maheshvarakavacam
category: kavacha
name:
  english: maheshvarakavacam
  devanagari: माहेश्वरकवचम्
content:
  english: shikhilocanah || 7|| bhutesho dakshine bhage nairrityam bhimadarshanah | varune vrishaketushca
    vayau rakshatu shankarah || 8|| digvasah saumyato nityamaishanyam madanantakah | vamadeva urdhvato
    rakshedadhorakshettrilocanah || 9|| purarih puratah patu kapardi patu prishthatah | vishvesho dakshine
    bhage vame kalipatih sada || 10|| maheshvarah shirobhage bhavo bhale sadavatu | bhruvormadhye mahatejastrinetro
    netrayordvayoh || 11|| pinaki nasika deshe karnayorgirijapatih | ugrah kapolato rakshenmukhadeshe
    mahabhujah || 12|| jihvayamandhakadhvamsi dantanrakshatu mrityujit | nilakanthah sadakanthe prishthe
    kamanganashanah || 13|| tripurarih skandhadeshe bahvoshca candrashekharah | hasticarmadharo haste
    nakhangulishu shulabhrit || 14|| bhavanishah patu hridayam patudarakatirmridah | gude linge ca medhre
    ca nabhau ca pramathadhipah || 15|| janghorucarane bhimah sarvangekeshavapriyah | romakupe virupakshah
    shabde sparsheca yogavit || 16|| raktamajjavasamasashukrevasuganarcitah | pranapanasamaneshudanavyaneshudhurjjatih
    || 17|| rakshahinantuyatsthanam varjitam kavacena yat | tatsarvam rakshame deva vyathidurgajvaraditah
    || 18|| karyam karma tvidam prajnairdipam prajvalya sarpisha | nivedya shikhinetraya varayeccottaram
    mukham || 19|| jvaradahaparikrantam tathanyavyadhisamyutam | kushaihsammarjya samarjyakshipeddipashikhejvaram
    || 20|| aikahikam dvyahikam va tritiyakacaturthakam | vatapittakaphodbhutam sannipatogratejasam ||
    21|| anyadduhkhaduradharsham karma cabhicarikam | dhatustham kaphasammishram vishama kamasambhavam
    || 22|| bhutabhishangasagartam bhutaceshtadisasthitam | shivajnam ghoramantrena purvavrittam svayam
    smara || 23|| jahi deham manushyasya dipam gaccha mahajvara | kritva tu kavacam divyam sarvavyadhibhayardanam
    || 24|| na badhante vyadhayastam balagrahabhayashca ye | lutavisphotakam ghorashirortticcharddivigraham
    || 25||
  devanagari: शिखिलोचनः ॥ ७॥ भूतेशो दक्षिणे भागे नैरृत्यां भीमदर्शनः । वारुणे वृषकेतुश्च वायौ रक्षतु शङ्करः
    ॥ ८॥ दिग्वासाः सौम्यतो नित्यमैशान्यां मदनान्तकः । वामदेव ऊर्ध्वतो रक्षेदधोरक्षेत्त्रिलोचनः ॥ ९॥ पुरारिः
    पुरतः पातु कपर्दी पातु पृष्ठतः । विश्वेशो दक्षिणे भागे वामे कालीपतिः सदा ॥ १०॥ माहेश्वरः शिरोभागे
    भवो भाले सदावतु । भ्रुवोर्मध्ये महातेजास्त्रिनेत्रो नेत्रयोर्द्वयोः ॥ ११॥ पिनाकी नासिका देशे कर्णयोर्गिरिजापतिः
    । उग्रः कपोलतो रक्षेन्मुखदेशे महाभुजः ॥ १२॥ जिह्वायामन्धकध्वंसी दन्तान्रक्षतु मृत्युजित् । नीलकण्ठः
    सदाकण्ठे पृष्ठे कामाङ्गनाशनः ॥ १३॥ त्रिपुरारिः स्कन्धदेशे बाह्वोश्च चन्द्रशेखरः । हस्तिचर्मधरो हस्ते
    नखाङ्गुलिषु शूलभृत् ॥ १४॥ भवानीशः पातु हृदयं पातूदरकटीर्मृडः । गुदे लिङ्गे च मेढ्रे च नाभौ च प्रमथाधिपः
    ॥ १५॥ जङ्घोरुचरणे भीमः सर्वाङ्गेकेशवप्रियः । रोमकूपे विरूपाक्षः शब्दे स्पर्शेच योगवित् ॥ १६॥ रक्तमज्जावसामासशुक्रेवसुगणार्चितः
    । प्राणापानसमानेषुदानव्यानेषुधूर्ज्जटीः ॥ १७॥ रक्षाहीनन्तुयत्स्थानं वर्जितं कवचेन यत् । तत्सर्वं रक्षमे
    देव व्याथिदुर्गज्वरादितः ॥ १८॥ कार्यं कर्म त्विदं प्राज्ञैर्दीपं प्रज्वाल्य सर्पिषा । निवेद्य शिखिनेत्राय
    वारयेच्चोत्तरं मुखम् ॥ १९॥ ज्वरदाहपरिक्रान्तं तथान्यव्याधिसंयुतम् । कुशैःसंमार्ज्य समार्ज्यक्षिपेद्दीपशिखेज्वरम्
    ॥ २०॥ ऐकाहिकं द्व्याहिकं वा तृतीयकचतुर्थकम् । वातपित्तकफोद्भूतं सन्निपातोग्रतेजसम् ॥ २१॥ अन्यद्दुःखदुराधर्षं
    कर्म चाभिचारिकम् । धातुस्थं कफसंमिश्रं विषम कामसम्भवम् ॥ २२॥ भूताभिषङ्गसगर्तं भूतचेष्टादिसस्थितम्
    । शिवाज्ञां घोरमन्त्रेण पूर्ववृत्तं स्वयं स्मर ॥ २३॥ जहि देहं मनुष्यस्य दीपं गच्छ महाज्वर । कृत्वा
    तु कवचं दिव्यं सर्वव्याधिभयार्दनम् ॥ २४॥ न बाधन्ते व्याधयस्तं बालग्रहभयाश्च ये । लूताविस्फोटकं घोरशिरोर्त्तिच्छर्द्दिविग्रहम्
    ॥ २५॥
