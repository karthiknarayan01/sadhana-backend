id: devaihkritam08durgastotram-21
category: stotram
name:
  english: devaihkritam08durgastotram 21
  devanagari: देवैःकृतं०८दुर्गास्तोत्रम् २१
content:
  english: devaih kritam 8 durgastotram 21 devah kailasamasadya susthane pranipadya ca | sasmarushca pranemushca
    tushtuvushca tada satim || 3|| devyubhe omiti tvam vai gayatri parameshvari | pujita brahmamunibhirurjita
    rajabhirnripaih || 4|| tvam bhuritividbhih prithvi shudraih shiveti pujita | kshantirmuninamakshobhya
    daya niyaminamapi || 5|| tvam mahopayasandoha nitirnayavisarpinam | paricitistvamarthanam tvamiha
    pranihricchraya || 6|| tvam muktih sarvabhutanam tvam matih sarvadehinam | itistvam raktacittanam
    pritistvam hridi dehinam || 7|| tvam kirtih satyabhutanam tvam shantirdushtakarmanam | tvam bhrantih
    sarvabhutanam tvam gatih kratuyajinam || 8|| tvam samudramahavela tvam ca lila vilasinam | sambhutistvam
    padarthanam sthitistvam lokapalinam || 9|| tvam kalaratrirnihsheshabhuvanavalivasini | priyakanthagrahanandadayini
    tvam vibhavari || 10|| rakshika tvamanathanam darshanam dehi cambike | anekairvividhairloke rupairdevi
    tvamarcita || 11|| sada shivapriye durge tvam namamo maheshvari | shrishaktim pavanim pushtim mahadavyaktarupinim
    || 12|| vayam namamahe bhaktya shuddham brahmaparayanam | antarvidyasuvidyabhyam supritam tvam namamahe
    || 13|| tvam didhitih suryagata kaumudi candrasangata | apyayayasi brahmaditrinantam tvam namamahe
    || 14|| gayatri tvam vedamata tvam savitri sarasvati | tvam varta sarvajagatam tvam trayi dharmarupini
    || 15|| tvam nidra sarvabhuteshu kshudha triptistvameva ha | tvam lakshmih punyakartrinamalakshmih
    papinam tatha || 16|| tvam shantih sarvajagatam tvam dhatri pranaposhini | gitistvam samavedasya granthistvam
    yajusham hutih || 17|| rigvedasya tatha matra'tharvanasya para gatih | samastagirvanashaktirduhkhanistarakarini
    || 18|| shive rudrani sannidre cande katyayani sati | kaushiki candike kali narayani namo'stu te ||
    19|| tapahpriye sadadrishye parvati te namonamah | prasanna bhava deveshi darshanam dehi suvrate ||
    20|| menayam labha putritvam mahadevi namo'stu te | ittham devaih stuta devi durga durgatinashini
    || 21|| avirbabhuva devanam purato jagadambika | babhuva''nandasandohah sarvesham tridivaukasam ||
    22|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 180
  devanagari: देवैः कृतं ८ दुर्गास्तोत्रम् २१ देवाः कैलासमासाद्य सुस्थाने प्रणिपद्य च । सस्मरुश्च प्रणेमुश्च
    तुष्टुवुश्च तदा सतीम् ॥ ३॥ देव्युभे ओमिति त्वं वै गायत्री परमेश्वरी । पूजिता ब्रह्ममुनिभिरूर्जिता
    राजभिर्नृपैः ॥ ४॥ त्वं भूरितिविड्भिः पृथ्वी शूद्रैः शिवेति पूजिता । क्षान्तिर्मुनीनामक्षोभ्या दया
    नियमिनामपि ॥ ५॥ त्वं महोपायसन्दोहा नीतिर्नयविसर्पिणाम् । परिचितिस्त्वमर्थानां त्वमीहा प्राणिहृच्छ्रया
    ॥ ६॥ त्वं मुक्तिः सर्वभूतानां त्वं मतिः सर्वदेहिनाम् । ईतिस्त्वं रक्तचित्तानां प्रीतिस्त्वं हृदि देहिनाम्
    ॥ ७॥ त्वं कीर्तिः सत्यभूतानां त्वं शान्तिर्दुष्टकर्मणाम् । त्वं भ्रान्तिः सर्वभूतानां त्वं गतिः क्रतुयाजिनाम्
    ॥ ८॥ त्वं समुद्रमहावेला त्वं च लीला विलासिनाम् । सम्भूतिस्त्वं पदार्थानां स्थितिस्त्वं लोकपालिनाम्
    ॥ ९॥ त्वं कालरात्रिर्निःशेषभुवनावलिवासिनी । प्रियकण्ठग्रहानन्ददायिनी त्वं विभावरी ॥ १०॥ रक्षिका त्वमनाथानां
    दर्शनं देहि चाम्बिके । अनेकैर्विविधैर्लोके रूपैर्देवि त्वमर्चिता ॥ ११॥ सदा शिवप्रिये दुर्गे त्वां
    नमामो महेश्वरि । श्रीशक्तिं पावनीं पुष्टिं महदव्यक्तरूपिणीम् ॥ १२॥ वयं नमामहे भक्त्या शुद्धां ब्रह्मपरायणाम्
    । अन्तर्विद्यासुविद्याभ्यां सुप्रीतां त्वां नमामहे ॥ १३॥ त्वं दीधितिः सूर्यगता कौमुदी चन्द्रसङ्गता
    । आप्याययसि ब्रह्मादितृणान्तं त्वां नमामहे ॥ १४॥ गायत्री त्वं वेदमाता त्वं सावित्री सरस्वती । त्वं
    वार्ता सर्वजगतां त्वं त्रयी धर्मरूपिणी ॥ १५॥ त्वं निद्रा सर्वभूतेषु क्षुधा तृप्तिस्त्वमेव ह । त्वं
    लक्ष्मीः पुण्यकर्तॄणामलक्ष्मीः पापिनां तथा ॥ १६॥ त्वं शान्तिः सर्वजगतां त्वं धात्री प्राणपोषिणी ।
    गीतिस्त्वं सामवेदस्य ग्रन्थिस्त्वं यजुषां हुतिः ॥ १७॥ ऋग्वेदस्य तथा मात्राऽथर्वणस्य परा गतिः । समस्तगीर्वाणशक्तिर्दुःखनिस्तारकारिणी
    ॥ १८॥ शिवे रुद्राणि सन्निद्रे चण्डे कात्यायनि सति । कौशिकि चण्डिके कालि नारायणि नमोऽस्तु ते ॥ १९॥
    तपःप्रिये सदादृश्ये पार्वति ते नमोनमः । प्रसन्ना भव देवेशि दर्शनं देहि सुव्रते ॥ २०॥ मेनायां लभ पुत्रीत्वं
    महादेवि नमोऽस्तु ते । इत्थं देवैः स्तुता देवी दुर्गा दुर्गतिनाशिनी ॥ २१॥ आविर्बभूव देवानां पुरतो जगदम्बिका
    । बभूवाऽऽनन्दसन्दोहः सर्वेषां त्रिदिवौकसाम् ॥ २२॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    १८०
