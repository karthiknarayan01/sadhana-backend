id: dakshinakalikakavacam-2
category: kavacha
name:
  english: dakshinakalikakavacam 2
  devanagari: दक्षिणकालिकाकवचम् २
content:
  english: virupaksha uvaca | namami gurumakshobhyam mantrashaktisamanvitam | prasannam jnanamajnanam
    hetum buddhiprakashakam || 1|| gajendravadanam naumi raktam vighnavidarakam | pashankushavarabhiti
    lasadbhujacatushtayam || 2|| bhairavah sarvada patu rishirme shirasopari | mukhe chandah sada patu
    trishtup ca vijayatmakam || 3|| gunatrayamayi shaktih parashaktistu idita | brahmasvarupini patu hridaye
    mama kalika || 4|| bijasvarupini patu krinkari shaktirupini | hum shakti sarvada patu sarvarakshasvarupini
    || 5|| mahakalah sada patu mahabhimaparakramah | dadatu mama kamani sarvasiddhishvaro yatah || 6||
    adi livarnaparyantah hridaye mamamatrikah | eghante nadi cantashca rakshantu bahuyugmake || 7|| nabhomadhyagata
    varna madikshantastathaiva ca | savindavah sada pantu janghayorubhayormama || 8|| bhutapretapishacadya
    vighnadehastatha punah | prithagbhavah samadhyashca varna rakshantu mam sada || 9|| samastaromakupeshu
    marmasthanishu sandhishu | nadidhatuvikareshu rakshantu mama matrikah || 10|| shaktiradhararupa ya
    sa patu parameshvari | avarnah sarvada patu sarvadevamayah svayam || 11|| phanagata'vanih patu samudrah
    patu mam sada | ratnadvipah sada patu rakshantu kalpapadapah || 12|| shmashanapithakah patu patu mam
    manavedika | sadashiva mahapreta shavo mam parirakshatu || 13|| dvaradeshe dvarapala yoginyah pantu
    mam sada | siddhayo'shtau sada pantu purvadi vasudiggatah || 14|| kalim kapalinim kullam kurukullam
    tathaiva ca | virodhinim vipracittam namami sarvasiddhaye || 15|| etastu vashayoginyo bahih shatkonakesthitah
    | rakshantu mam sada devyo mataro bhaktavatsalah || 16|| ugramugraprabham diptam namamyatmavibhutaye
    | sarvasiddhim prayacchantu pantu mam putravat sada || 17|| nilam ghanam valakanca pranamami samutsukah
    | sarvavighnan samutsaryya racantu kalusharnavat || 18|| matramudramitananca namami caranambujam |
    devipremasakhinanca sharanam yami siddhaye || 19|| etah pancadashe kone ekaika varada sada | tarjanim
    vamahastena khadgam dakshinapanina || 20|| mundamaladharah shirshe nilanjanacayopamah | shatrubhyah
    siddhidashcandah pantu mam kalikapriyah || 21|| bahihpadmadalante tu brahmanyadyashtashaktayah | rakshantu
    me prayacchantu sarvasiddhim dayanvitam || 22|| brahmani patu mam purve sarvah shivavarapradah | vahnau
    narayani patu sarvakamarthasiddhida || 23|| maheshi dakshine patu sarvamangalakarini | camunda nairrite
    patu sarvashatrupramardini || 24|| kaumari pashcime patu shaktihasta visudinim | aparajita ca vayavya
    patu mam jayada shubha || 25|| uttare patu varahi varada ghorarupini | narasimhi sada patu aishanyam
    bhayanashini || 26|| etastu varavidyayah shaktayashcashtadevatah | brahmavishnushivadinam tejobhinnakalevara
    || 27|| suryyenduvahnipithe tu baindave parameshvari | namami dakshinamurttim kalikam parabhairavim
    || 28|| bhinnanjanacayaprakhyam pravinashavasamsthitam | galacchonitadharabhih smerananasaroruham
    || 29|| pinonnatakucadvandvam pinavakshonitambinim | dakshine muktakesham ca digambaravinodinim ||
    30|| mahakalasamavishtam smameranandopari sthitam | sukhasandrasmitamodamodinim madavihvalam || 31||
    araktasukhasandradinetralibhirvirajitam | shavadvayakritottamsam sinduratilakojjvalam || 32|| pancashanmurttighatitamalam
    shonitalohitam | nanamanivishobhadhyam nanalankarashobhitam || 33|| shavasthikritakeyurashankhakankanamanditam
    | shavavakshah samarudham lelihanam shavam kvacit || 34|| shavamamsakritagrasam sattahasam muhurmuhuh
    | khadgamundadharam vame savye'bhayavarapradam || 35|| danturanca maharaudrim candanadatibhishanam
    | shivabhirghoraravabhirveshtitam bhayanashinim || 36|| mabhairmabhaih svabhakteshu jalpantim ghoranisvane
    | yuyam kimicchatha brutha dadamitiprabhashinim || 37|| tvam gatih sharanam devi
  devanagari: विरूपाक्ष उवाच । नमामि गुरुमक्षोभ्यं मन्त्रशक्तिसमन्वितम् । प्रसन्नं ज्ञानमज्ञानं हेतुं
    बुद्धिप्रकाशकम् ॥ १॥ गजेन्द्रवदनं नौमि रक्तं विघ्नविदारकम् । पाशाङ्कुशवराभीति लसद्भुजचतुष्टयम् ॥ २॥
    भैरवः सर्वदा पातु ऋषिर्मे शिरसोपरि । मुखे छन्दः सदा पातु त्रिष्टुप् च विजयात्मकम् ॥ ३॥ गुणत्रयमयी
    शक्तिः परशक्तिस्तु ईडिता । ब्रह्मस्वरूपिणी पातु हृदये मम कालिका ॥ ४॥ बीजस्वरूपिणी पातु क्रीङ्कारी
    शक्तिरूपिणी । हूं शक्ति सर्वदा पातु सर्वरक्षास्वरूपिणी ॥ ५॥ महाकालः सदा पातु महाभीमपराक्रमः । ददातु
    मम कामानि सर्वसिद्धीश्वरो यतः ॥ ६॥ आदि ॡवर्णपर्यन्ताः हृदये मममातृकाः । एघान्ते ङादि चान्ताश्च रक्षन्तु
    बाहुयुग्मके ॥ ७॥ नभोमध्यगता वर्णा मादिक्षान्तास्तथैव च । सविन्दवः सदा पान्तु जङ्घयोरुभयोर्मम ॥ ८॥
    भूतप्रेतपिशाचाद्या विघ्नदेहास्तथा पुनः । पृथग्भावाः समध्याश्च वर्णा रक्षन्तु मां सदा ॥ ९॥ समस्तरोमकूपेषु
    मर्मस्थानिषु सन्धिषु । नाडीधातुविकारेषु रक्षन्तु मम मातृकाः ॥ १०॥ शक्तिराधाररूपा या सा पातु परमेश्वरी
    । अवर्णः सर्वदा पातु सर्वदेवमयः स्वयम् ॥ ११॥ फणागताऽवनिः पातु समुद्रः पातु मां सदा । रत्नद्वीपः सदा
    पातु रक्षन्तु कल्पपादपाः ॥ १२॥ श्मशानपीठकः पातु पातु मां मानवेदिका । सदाशिव महाप्रेत शवो मां परिरक्षतु
    ॥ १३॥ द्वारदेशे द्वारपाला योगिन्यः पान्तु मां सदा । सिद्धयोऽष्टौ सदा पान्तु पूर्वादि वसुदिग्गताः ॥
    १४॥ कालीं कपालिणीं कुल्लां कुरुकुल्लां तथैव च । विरोधिनीं विप्रचित्तां नमामि सर्वसिद्धये ॥ १५॥ एतास्तु
    वशयोगिन्यो बहिः षट्कोणकेस्थिताः । रक्षन्तु मां सदा देव्यो मातरो भक्तवत्सलाः ॥ १६॥ उग्रामुग्रप्रभां
    दीप्तां नमाम्यात्मविभूतये । सर्वसिद्धिं प्रयच्छन्तु पान्तु मां पुत्रवत् सदा ॥ १७॥ नीलां घनां वलाकाञ्च
    प्रणमामि समुत्सुकः । सर्वविघ्नान् समुत्सार्य्य रचन्तु कलुषार्णवात् ॥ १८॥ मात्रामुद्रामितानाञ्च नमामि
    चरणाम्बुजम् । देवीप्रेमसखीनाञ्च शरणं यामि सिद्धये ॥ १९॥ एताः पञ्चदशे कोणे एकैका वरदा सदा । तर्जनीं
    वामहस्तेन खड्गं दक्षिणपाणिना ॥ २०॥ मुण्डमालाधराः शीर्षे नीलाञ्जनचयोपमाः । शत्रुभ्यः सिद्धिदाश्चण्डाः
    पान्तु मां कालिकाप्रियाः ॥ २१॥ बहिःपद्मदलान्ते तु ब्रह्माण्याद्यष्टशक्तयः । रक्षन्तु मे प्रयच्छन्तु
    सर्वसिद्धिं दयान्विताम् ॥ २२॥ ब्रह्माणी पातु मां पूर्वे सर्वाः शिववरप्रदाः । वह्नौ नारायणी पातु सर्वकामार्थसिद्धिदा
    ॥ २३॥ माहेशी दक्षिणे पातु सर्वमङ्गलकारिणी । चामुण्डा नैरॄते पातु सर्वशत्रुप्रमर्दिनी ॥ २४॥ कौमारी
    पश्चिमे पातु शक्तिहस्ता विसूदिनीम् । अपराजिता च वायव्या पातु मां जयदा शुभा ॥ २५॥ उत्तरे पातु वाराही
    वरदा घोररूपिणी । नारसिंही सदा पातु ऐशान्यां भयनाशिनी ॥ २६॥ एतास्तु वरविद्यायाः शक्तयश्चाष्टदेवताः
    । ब्रह्मविष्णुशिवादीनां तेजोभिन्नकलेवरा ॥ २७॥ सूर्य्येन्दुवह्निपीठे तु बैन्दवे परमेश्वरी । नमामि दक्षिणामूर्त्तिं
    कालिकां परभैरवीम् ॥ २८॥ भिन्नाञ्जनचयप्रख्यां प्रवीनशवसंस्थिताम् । गलच्छोणितधाराभिः स्मेराननसरोरुहाम्
    ॥ २९॥ पीनोन्नतकुचद्वन्द्वां पीनवक्षोनितम्बिनीम् । दक्षिणे मुक्तकेशां च दिगम्बरविनोदिनीम् ॥ ३०॥ महाकालसमाविष्टां
    स्ममेरानन्दोपरि स्थिताम् । सुखसान्द्रस्मितामोदमोदिनीं मदविह्वलाम् ॥ ३१॥ आरक्तसुखसान्द्रादिनेत्रालीभिर्विराजिताम्
    । शवद्वयकृतोत्तंसां सिन्दूरतिलकोज्ज्वलाम् ॥ ३२॥ पञ्चाशन्मूर्त्तिघटितमालां शोणितलोहिताम् । नानामणिविशोभाढ्यां
    नानालङ्कारशोभिताम् ॥ ३३॥ शवास्थिकृतकेयूरशङ्खकङ्कणमण्डिताम् । शववक्षः समारूढां लेलिहानां शवं क्वचित्
    ॥ ३४॥ शवमांसकृतग्रासां साट्टहासां मुहुर्मुहुः । खड्गमुण्डधरां वामे सव्येऽभयवरप्रदाम् ॥ ३५॥ दन्तुराञ्च
    महारौद्रीं चण्डनादातिभीषणाम् । शिवाभिर्घोररावाभिर्वेष्टितां भयनाशिनीम् ॥ ३६॥ माभैर्माभैः स्वभक्तेषु
    जल्पन्तीं घोरनिस्वने । यूयं किमिच्छथ ब्रूथ ददामीतिप्रभाषिणीम् ॥ ३७॥ त्वं गतिः शरणं देवि
