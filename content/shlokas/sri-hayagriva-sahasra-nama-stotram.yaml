  devanagari: ॥ श्रीः ॥ शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजं प्रसन्नवदनं ध्यायेत्सर्वविघ्नोपशान्तये
    । यस्य द्विरदवक्राद्याः पारिषद्याः परश्शतं विघ्नं निघ्नन्ति सततं विष्वक्सेनं तमाश्रये । श्रीकाश्यपः
    । तात मे श्रीहयग्रीवनाम्नां साहस्रमुत्तमम् । अध्येतुं जायते काङ्क्षा तत्प्रसीद मयि प्रभो ॥ ॥ इतिपृष्टस्ततोवाच
    ब्रह्मा लोक पितामहः । श्रेयसामपि च श्रेयः काश्यपेह विशाम्पते ॥ ॥ अमत्या विहितं पापं मूलतो हि विनश्यति
    । रहस्यानां रहस्यं च पावनानां च पावनम् ॥ ॥ प्रायश्चित्ते कृते तस्य कर्तान निरयी भवेत् । कामतस्तु कृते
    पापे प्रायश्चित्तशतेन च ॥ ॥ तन्न नश्यति तत्कर्ता व्यवहार्यस्तु जायते । एवं दुरपनोदानां बुद्धिपूर्वमहांहसाम्
    ॥ ॥ आवर्जनकराणामप्यन्ते निष्कृतिरीरिता । प्रणम्य मानवतया मन्त्ररत्नानुकीर्तनम् ॥ ॥ हंसनामसहस्रस्यपठनं
    शिरसान्वहम् । प्रणम्य भगवद्भक्तपादोदक निषेवणम् ॥ ॥ तदेतत्त्त्रितयं सर्वपापसङ्घातनाशनम् । इतीदं परमं
    गुह्यं हंसो हयशिराहरिः ॥ ॥ वेदोपदेशसमये मां निबोध्योपदिष्टवान । अनेन मन्त्ररत्नेन महाश्वशिरसो हरेः
    ॥ ॥ सहस्रनामभिस्तुल्या निष्कृतिर्नेतरांहसाम् । अनन्यभगवद्भक्तपादोदकनिषेवणम् ॥ ॥ एतद्द्वयोपदेशाङ्गमादौ
    स्वीकार्यमिष्यते । इत्युक्त्वाऽनन्तगरुडविष्वक्सेनपदोदकम् ॥ ॥ आदौ मां प्राशयन्नन्ते परिशोष्येकृतांहसि
    । आत्मनो नामसाहस्रं सर्षिच्छन्दोऽधिदैवतम् ॥ ॥ सन्यासमुद्रिकाभेदं मह्यं साङ्गमुपादिशत् । यथावत्तदिदं
    वत्स दद्यां ते शृणु तत्त्वतः ॥ ॥ यत्प्राप्यात्यन्तिकी वृत्त्या निवृत्त्या मोक्षमेष्यति । हयास्यनामसाहस्रस्तोत्रराजस्य
    वैभवम् ॥ ॥ ऋषिश्श्रीमान् हयग्रीवो विद्यामूर्तिस्स्वयं हरिः । देवता च स एवास्य छन्दोनुष्टुबिति श्रुतम्
    ॥ ॥ हंसो हंसोऽहमित्येते बीजं शक्तिस्तुकीलकम् । हंसीं हंसोऽहमित्येते प्राज्ञप्या मनवस्त्रयः ॥ ॥ एकैकस्य
    दशावृत्तिरितिसङ्ख्याविधीयते । प्रणवत्रयमन्त्रं स्यात्कवचं श्रीश्श्रियो भवेत् ॥ ॥ श्रीविभूषण इत्येतद्धृदयं
    परिकीर्तितम् । परोरजाः परं ब्रह्मेत्यपि योनिरुदाहृता ॥ ॥ विद्यामूर्तिरिति ध्यानं विश्वात्मेति च गद्यते
    । विश्वमङ्गलनाम्नोऽस्य विनियोगो यथारुचि ॥ ॥ भ्रूनेत्राश्रोत्रनासाहन्वोष्ठतालूरदे क्रमात् । षोडशस्वरविन्यासो
    दक्षिणारम्भमिष्यते ॥ ॥ जिह्वातलेऽपि तन्मूले स्वरावन्त्यौ च विन्यसेत् । तदा तालुद्वयन्याससखायोस्तु
    परित्यजेत् ॥ ॥ अयं हि विद्याकामानामाद्यस्त्वन्य फलैषिणाम् । दोःपत्सक्थ्यङ्गुलीशीर्षे वर्गान्कचटतान्न्यसेत्
    ॥ ॥ पार्श्वयोस्तु वफौ पृष्टोदरयोस्तु बभौ न्यसेत् । मकारं हृदये न्यस्य जीवे वा पञ्चविंशके ॥ ॥ नाभिपायूदरे
    गुह्ये यरलवान्विनिक्षिपेत् । शषौ कुण्डलयोश्शीर्षं हारे च कटिसूत्रके ॥ ॥ सहौ हृदब्जे हर्दे च लमापादशिखे
    न्यसेत् । क्षञ्च शीर्षादि पादान्तं मातृकान्यास एष तु ॥ ॥ अस्य श्रीहयग्रीवसहस्रनाम स्तोत्रमहामन्त्रस्य
    श्रीहयग्रीव ऋषिः । अनुष्टुप् छन्दः श्रीहयग्रीव परमात्मा देवता हंस इति बीजम् । हंसोहमिति शक्तिः हंसां
    हंसीमिति कीलकम् ॐ ॐ ओमित्यस्त्रम् । श्रीः श्रियः इति कवचम् श्रीविभूषण इति हृदयम् । परोरजाः परं ब्रह्मेति
    योनिः विद्यामूर्तिर्विश्वात्मा इति ध्यानम् । हंसामङ्गुष्ठाभ्यां नमः हंसीं तर्जनीभ्यां नमः । हंसूं
    मध्यमाभ्यां नमः हंसों अनामिकाभ्यां नमः । हंसौं कनिष्ठिकाभ्यां नमः हंसः करतलकरपृष्ठाभ्यां नमः । एवं
    हृदयादिन्यासः । हंसां ज्ञानाय हृदयाय नमः हंसीं ऐश्वर्याय शिरसे स्वाहा । हंसूं शक्तयै शिखायै वषट् हंसों
    बलाय कवचाय हुम् । हंसौं तेजसे नेत्राभ्यां वौषट् । हंसः वीर्यायास्त्राय फट् ओमिति दिग्बन्धः । अथ मातृकान्यासः
    । ॐ अं आं भ्रुवोः ऋं ॠं नासिकयोः । लृं लॄं कपोलयोः ॐ ॐ दन्तपङ्क्त्योः । अं जिह्वातले अः जिह्वामूले
    । कवर्गं दक्षिणे बाहूमूले कूर्परे मणिबन्धे करतले हस्ताग्रे । चवर्गं वामे बाहूमूले कूर्परे मणिबन्धे
    करतले हस्ताग्रे । टवर्गं दक्षिणे पादमूले जानुनि पादपार्ष्णौ पादतले पादाग्रे । तवर्गं वामे पादमूले
    जानुनि पादपार्ष्णौ पादतले पादाग्रे । पफौ पार्श्वयोः मं हृदि । यं रं लं वं नाभौ पायौ उदरे गुह्ये शषौ
    हस्तयोः । सहौ शीर्षे कट्याम् लक्षौ हृदब्जे हार्दे उति मातृकान्यासः । विद्यामूर्तिमखण्डचन्द्रवलयश्वेतारविन्दस्थितं
    हृद्याभं स्फटिकाद्रिनिर्मलतनुं विद्योतमानंश्रिया । वामाङ्कस्थितवल्लभां प्रति सदाव्याख्यान्तमाम्नायवा
