id: shivaraksha
category: stotram
name:
  english: shivaraksha
  devanagari: शिवरक्श
content:
  english: shrishivarakshastotram athava abhayankarakavacam shri ganeshaya namah || asya shrishivarakshastotramantrasya
    yajnavalkya rishih || shri sadashivo devata || anushtup chandah || shrisadashivaprityartham shivarakshastotrajape
    viniyogah || caritam devadevasya mahadevasya pavanam | aparam paramodaram caturvargasya sadhanam ||
    1|| gaurivinayakopetam pancavaktram trinetrakam | shivam dhyatva dashabhujam shivaraksham pathennarah
    || 2|| gamgadharah shirah patu bhalam ardhendushekharah | nayane madanadhvamsi karno sarpavibhushana
    || 3|| ghranam patu puraratih mukham patu jagatpatih | jihvam vagishvarah patu kamdharam shitikamdharah
    || 4|| shrikanthah patu me kantham skandhau vishvadhurandharah | bhujau bhubharasamharta karau patu
    pinakadhrik || 5|| hridayam shamkarah patu jatharam girijapatih | nabhim mrityunjayah patu kati vyaghrajinambarah
    || 6|| sakthini patu dinartasharanagatavatsalah | uru maheshvarah patu januni jagadishvarah || 7||
    janghe patu jagatkarta gulphau patu ganadhipah | caranau karunasimdhuh sarvangani sadashivah || 8||
    etam shivabalopetam raksham yah sukriti pathet | sa bhuktva sakalankaman shivasayujyamapnuyat || 9||
    grahabhutapishacadyastrailokye vicaranti ye | duradashu palayante shivanamabhirakshanat || 10 || abhayankaranamedam
    kavacam parvatipateh | bhaktya bibharti yah kanthe tasya vashyam jagattrayam || 11|| imam narayanah
    svapne shivaraksham yatha''dishat | pratarutthaya yogindro yajnavalkyah tatha'likhat || 12|| iti shriyajnavalkyaproktam
    shivarakshastotram athava abhayankarakavacam sampurnam ||
  devanagari: श्रीशिवरक्षास्तोत्रम् अथवा अभयङ्करकवचम् श्री गणेशाय नमः ॥ अस्य श्रीशिवरक्षास्तोत्रमन्त्रस्य
    याज्ञवल्क्य ऋषिः ॥ श्री सदाशिवो देवता ॥ अनुष्टुप् छन्दः ॥ श्रीसदाशिवप्रीत्यर्थं शिवरक्षास्तोत्रजपे
    विनियोगः ॥ चरितं देवदेवस्य महादेवस्य पावनम् । अपारं परमोदारं चतुर्वर्गस्य साधनम् ॥ १॥ गौरीविनायकोपेतं
    पञ्चवक्त्रं त्रिनेत्रकम् । शिवं ध्यात्वा दशभुजं शिवरक्षां पठेन्नरः ॥ २॥ गंगाधरः शिरः पातु भालं अर्धेन्दुशेखरः
    । नयने मदनध्वंसी कर्णो सर्पविभूषण ॥ ३॥ घ्राणं पातु पुरारातिः मुखं पातु जगत्पतिः । जिह्वां वागीश्वरः
    पातु कंधरां शितिकंधरः ॥ ४॥ श्रीकण्ठः पातु मे कण्ठं स्कन्धौ विश्वधुरन्धरः । भुजौ भूभारसंहर्ता करौ पातु
    पिनाकधृक् ॥ ५॥ हृदयं शंकरः पातु जठरं गिरिजापतिः । नाभिं मृत्युञ्जयः पातु कटी व्याघ्राजिनाम्बरः ॥ ६॥
    सक्थिनी पातु दीनार्तशरणागतवत्सलः । उरू महेश्वरः पातु जानुनी जगदीश्वरः ॥ ७॥ जङ्घे पातु जगत्कर्ता गुल्फौ
    पातु गणाधिपः । चरणौ करुणासिंधुः सर्वाङ्गानि सदाशिवः ॥ ८॥ एतां शिवबलोपेतां रक्षां यः सुकृती पठेत् ।
    स भुक्त्वा सकलान्कामान् शिवसायुज्यमाप्नुयात् ॥ ९॥ ग्रहभूतपिशाचाद्यास्त्रैलोक्ये विचरन्ति ये । दूरादाशु
    पलायन्ते शिवनामाभिरक्षणात् ॥ १० ॥ अभयङ्करनामेदं कवचं पार्वतीपतेः । भक्त्या बिभर्ति यः कण्ठे तस्य वश्यं
    जगत्त्रयम् ॥ ११॥ इमां नारायणः स्वप्ने शिवरक्षां यथाऽऽदिशत् । प्रातरुत्थाय योगीन्द्रो याज्ञवल्क्यः
    तथाऽलिखत् ॥ १२॥ इति श्रीयाज्ञवल्क्यप्रोक्तं शिवरक्षास्तोत्रं अथवा अभयङ्करकवचं सम्पूर्णम् ॥
