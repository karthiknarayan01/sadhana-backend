id: durgasukta
category: sukta
name:
  english: durgasukta
  devanagari: दुर्गासूक्त
content:
  english: huvema paramathsadhasthat | sa nah parshadati durgani vishva kshamaddevo ati duritatyagnih
    || 5|| pratnoshi kamidyo adhvareshu sanacca hota navyashca sathsi | svancagne tanuvam piprayasvasmabhyam
    ca saubhagamayajasva || 6|| gobhirjushtamayujo nishiktantavendra vishnoranusamcarema | nakasya prishthamabhi
    samvasano vaishnavim loka iha madayantam || 7|| om katyayanaya vidmahe kanyakumari dhimahi | tanno
    durgih pracodayat || || iti durgasuktam || om shantih shantih shantih || taittiriyaranyakam 4
  devanagari: हुवेम परमाथ्सधस्थात् । स नः पर्षदति दुर्गाणि विश्वा क्षामद्देवो अति दुरितात्यग्निः ॥ ५॥
    प्रत्नोषि कमीड्यो अध्वरेषु सनाच्च होता नव्यश्च सथ्सि । स्वाञ्चाग्ने तनुवं पिप्रयस्वास्मभ्यं च सौभगमायजस्व
    ॥ ६॥ गोभिर्जुष्टमयुजो निषिक्तन्तवेन्द्र विष्णोरनुसंचरेम । नाकस्य पृष्ठमभि संवसानो वैष्णवीं लोक इह
    मादयन्ताम् ॥ ७॥ ॐ कात्यायनाय विद्महे कन्याकुमारि धीमहि । तन्नो दुर्गिः प्रचोदयात् ॥ ॥ इति दुर्गासूक्तम्
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ तैत्तिरीयारण्यकम् ४
