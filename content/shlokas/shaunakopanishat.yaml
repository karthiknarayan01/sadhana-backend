id: shaunakopanishat
category: upanishad
name:
  english: shaunakopanishat
  devanagari: शौनकोपनिषत्
content:
  english: vimeva pratisandidesha | sa hovaca | bibhemi va etadetebhyo yathaitatparavritanniti | sa pranavamevasyah
    purogamakarodesha vava te gopyayeti | sa hovaca | yadesha purogah udesha me bhagadheyi syaditi | sa
    hovaca | na ha vavaisha tvadbhagadheyi bhavati | mahanva asya mahima na ha va mahiyamso bhagaklriptimapyabhajantiti
    | vishvaminnu samanvalabhadhvamiti | senanyastu prathamajanapyayayishyasityomiti hovaca | sa hovaca
    yatprathamam nabhyakirtayo namagrahamatha nanuvatsya iti | namagrahametena sarvamabhipadyante | sarvam
    va esha sarvamashnotiti | aksharam va eshah | tasmadomityanujananti | omiti pratipadyanta omityabhyadadata
    omityabhinidhapayanti | tadetadaksharam jaitramabhitvaram sarvani bhutanyabhyattam yadanekamekam nanavarnam
    nanarupam nanashabdam nanagandham nanarasam nanasparshamiti | atho khalvahurindro va caitadaksharam
    | sarvani ha va imani bhutanyetadaksharamanvayattani sarve vedah sarve yajna ityatha khalvindramanvayattamiti
    || sa mandrenaivanvabhakto vididyute'njasaiva bhratrivyanapahananiti | tasmanmandram pratahsavanamabhavadyadgayatram
    tadgayatri tadgayatram yadvasavah tadvasavyam | sa ha pranava uvaca | yadaham sarvam bhavani yadgayatri
    vai purogah tatkim me syaditi | gayatramanveva gayatrimanveva tva sarvarupamimam kritva hinkurvanti
    | sa hapashyannaitadanjasaiva sarva rupanyevamabhicakshiranniti | sa hantata evatmanamupasamhritya
    tavadevagrahayat | sa visha
  devanagari: वीमेव प्रतिसन्दिदेश । सा होवाच । बिभेमि वा एतदेतेभ्यो यथैतत्परावृतन्निति । स प्रणवमेवास्याः
    पुरोगमकरोदेष वाव ते गोप्यायेति । सा होवाच । यदेष पुरोगाः उदेष मे भागधेयी स्यादिति । स होवाच । न ह
    वावैष त्वद्भागधेयी भवति । महान्वा अस्य महिमा न ह वा महीयांसो भागक्लृप्तिमप्याभजन्तीति । विश्वमिन्नु
    समन्वालभध्वमिति । सेनान्यास्तु प्रथमजानाप्याययिष्यसीत्योमिति होवाच । स होवाच यत्प्रथमं नाभ्यकीर्तयो
    नामग्राहमथ नानुवत्स्य इति । नामग्राहमेतेन सर्वमभिपद्यन्ते । सर्वं वा एष सर्वमश्नोतीति । अक्षरं वा
    एषः । तस्मादोमित्यनुजानन्ति । ओमिति प्रतिपद्यन्त ओमित्यभ्याददत ओमित्यभिनिधापयन्ति । तदेतदक्षरं जैत्रमभित्वरं
    सर्वाणि भूतान्यभ्यात्तं यदनेकमेकं नानावर्णं नानारूपं नानाशब्दं नानागन्धं नानारसं नानास्पर्शमिति ।
    अथो खल्वाहुरिन्द्रो वा चैतदक्षरम् । सर्वाणि ह वा इमानि भूतान्येतदक्षरमन्वायत्तानि सर्वे वेदाः सर्वे
    यज्ञा इत्यथ खल्विन्द्रमन्वायत्तमिति ॥ स मन्द्रेणैवान्वाभक्तो विदिद्युतेऽञ्जसैव भ्रातृव्यानपहनानीति
    । तस्मान्मन्द्रं प्रातःसवनमभवद्यद्गायत्रं तद्गायत्री तद्गायत्रं यद्वसवः तद्वसव्यम् । स ह प्रणव उवाच
    । यदहं सर्वं भवानि यद्गायत्री वै पुरोगाः तत्किं मे स्यादिति । गायत्रमन्वेव गायत्रीमन्वेव त्वा सर्वरूपमिमं
    कृत्वा हिङ्कुर्वन्ति । स हापश्यन्नैतदञ्जसैव सर्वा रूपाण्येवमभिचक्षीरन्निति । स हान्तत एवात्मानमुपसंहृत्य
    तावदेवाग्राहयत् । स विश
