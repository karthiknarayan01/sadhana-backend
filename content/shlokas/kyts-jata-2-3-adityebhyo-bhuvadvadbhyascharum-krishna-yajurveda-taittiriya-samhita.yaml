id: kyts-jata-2-3-adityebhyo-bhuvadvadbhyascharum-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 2.3 Adityebhyo BhuvadvadbhyaScharum - Krishna Yajurveda Taittiriya Samhita
content:
  english: adityebhyo bhuvadvadbhyo bhuvadvadbhya adityebhya adityebhyo bhuvadvadbhyah | mbhuvadvadbhyo
    bhuvadvadbhya shcarum | bhuvadvadbhya iti bhuvadvat dbhutikamo bhutikamo vape bhutikama aditya aditya
    bhutikamo bhutikama adityah | bhutikama iti bhuti aditya vai va aditya aditya vai | mbhutyai bhutya
    eta meta bhutyai prati prati bhutyai bhutyai prati | prati nudante nudante prati prati nudante | nudante
    yo yo nudante nudante yah | mbhutyai bhutya ala mala nbhutyai bhutyai sann | na prapnoti prapnoti
    na na prapnoti | prapno tyaditya naditya nprapnoti prapno tyadityan | aditya nevaivaditya naditya
    neva | eva bhuvadvato bhuvadvata evaiva bhuvadvatah | ssvena svena bhuvadvato bhuvadvata bhuvadvata
    iti bhuvat svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena
    bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati te te dhavati dhavati te | evaina mena
    me vaivaina ngamayanti gamayanti bhuti gamayanti bhavati bhavati gamayanti gamayanti bhavati | bhava
    tyevaiva bhavati bhava tyeva | evadityebhya adityebhya evaivadityebhyah | adityebhyo dharayadvadbhyo
    dharayadvadbhya adityebhya adityebhyo dharayadvadbhyah | dharayadvadbhya shcaru ndharayadvadbhyo dharayadvadbhya
    shcarum | dharayadvadbhya iti dharayadvat vape daparuddho 'paruddho vape aparuddho va va 'paruddho
    'paruddho va | va 'paruddhyamano 'paruddhyamano va va 'paruddhyamanah | aparuddhyamano va va 'paruddhyamano
    'paruddhyamano va | aparuddhyamana ityapa va ''ditya aditya va va ''dityah | aditya vai va aditya
    aditya vai | va aparoddharo 'paroddharo vai va aparoddharah | aparoddhara aditya aditya aparoddharo
    'paroddhara adityah | aparoddhara ityapa aditya avagamayitaro 'vagamayitara aditya aditya avagamayitarah
    | avagamayitara aditya naditya navagamayitaro 'vagamayitara adityan | avagamayitara ityava aditya
    nevai vaditya naditya neva | eva dharayadvato dharayadvata evaiva dharayadvatah | ssvena svena dharayadvato
    dharayadvata dharayadvata iti dharayat svena bhagadheyena bhagadheyena svena svena bhagadheyena |
    bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati te te dhavati
    dhavati te | vi~shi vishyena menam ddhrati daddhrati vishi vishi da daddhra tyanaparuddhyo 'naparuddhyo
    da ddhrati daddhra tyanaparuddhyah | anaparuddhyo bhavati bhava tyanaparuddhyo 'naparuddhyo bhavati
    | anaparuddhya ityanapa bhava tyadite 'dite bhavati bhava tyadite | adite 'nvanvadite 'dite 'nu |
    anu manyasva manyasva nvanu manyasva | manyasve titi manyasva manyasve ti | ityaparuddhyamano 'paruddhyamana
    iti tyaparuddhyamanah | aparuddhyamano 'syasya paruddhyamano 'paruddhyamano 'sya | aparuddhyamana
    ityapa mpada masyasya padam | a dadita dadita dadita | ndadita dadite yam | aditi riya miya maditi
    raditi riyam | iya mevaive ya miya meva | evasma asma evaivasmai asmai rajyagm rajya masma asmai rajyam
    | rajya manvanu rajyagm rajya manu | anu manyate manyate 'nvanu manyate | manyate satya satya manyate
    manyate satya | ssatya satya ''shih | ashi riti tyashi rashi riti | ityahahe tityaha | aha satyagm
    satya mahaha satyam | satya mevaiva satyagm satya meva | evashisha mashisha mevaivashisha nkurute
    kuruta ashisha mashisha kuruta ihe ha kurute kuruta iha | iha mano mana ihe ha manah | mana ititi
    mano mana iti | ityahahe tityaha | aha prajah praja ahaha prajah | praja evaiva prajah praja eva |
    evasma asma evaivasmai ssamanaso 'sma asmai samanasah | samanasah karoti karoti samanasa karo tyupopa
    karoti karo tyupa | upa pra propopa pra | pre te ta pra pre ta | ita maruto maruta ite ta marutah
    | ssudanavo maruto maruta sudanava enaina sudanava ena vishpatina vishpati nainaina vishpatina | vishpatina
    'bhyabhi vishpatina vishpatina 'bhi | abhyamu mamu mabhya amugm rajanagm rajana mamu mamugm rajanam
    | rajana mititi rajanagm rajana miti | ityahahe tityaha | aha maruti maru tyahaha maruti | maruti
    vai vai maruti maruti vai | djyeshtho jyeshtho vi rjyeshtho jyeshtho vishpatih | rvisha visha vishpati
    vishaivaiva visha vishaiva | enagm rashtrena rashtrenaina menagm rashtrena | rashtrena sagm sagm rashtrena
    rashtrena sam | sa mardhaya tyardhayati sagm sa mardhayati | 'rdhaya tyardhayati yah | gramyavaditi
    gramya ttasya tasya grihat | vrihi na vrihin vrihi na | a hare ddhareda haret | hare ddharec chuklan
    | ca krishnan krishnag shca ca krishnan krishnag vi cinuyac cinuya dye ye cinuyac cinuya shshukla
    ye ye shuklah | ta maditya maditya ncaru maditya maditya vape daditya ''ditya vape aditya vai va aditya
    ''ditya vai | vai devataya devataya vai vai devataya | ddevataya devataya vit | ava gacchati gaccha
    tyavava gacchati | gaccha tyavagata 'vagata gacchati gaccha tyavagata | || avagata 'syasya vagata
    'vagata 'sya | dvidasyasya vit | anavagatagm rashtragm rashtra manavagata manavagatagm rashtram |
    rashtra mititi rashtragm rashtra miti | ityahu rahu riti tyahuh | ye krishnah krishna ye ye krishnah
    | ssyuh krishnah krishna vai rashtragm rashtram rashtra mubhe ubhe rashtragm rashtra mubhe | ubhe
    evaivobhe ubhe eva | ca rashtragm rashtra nca ca rashtragm rashtra ava gacchati gaccha tyavava gacchati
    | gacchati yadi yadi gacchati gacchati yadi | yadi na na yadi yadi na | navagacche davagacche avagacche
    dima mima mavagacche davagacche dimam | ima maha maha mima mima maham | aha madityebhya adityebhyo
    'ha maha madityebhyah | mbhaga madityebhya adityebhyo bhagam | vapamya vapami vapamya | a 'mushma
    damushmada 'mushma amushma damushya amushya amushma damushma damushyai amushyai visho visho 'mushya
    amushyai vishah | visho 'vaganto ravaganto rvisho visho 'vagantoh | avaganto riti tyavaganto ravaganto
    riti | vape daditya aditya vape aditya evai vaditya aditya eva | mprephsantah prephsanto bhagadheya
    mprephsantah prephsanto visha prephsanta iti pra ava gamayanti gamaya ntyavava gamayanti | || gamayanti
    yadi yadi gamayanti gamayanti yadi | yadi na na yadi yadi na | navagacche davagacche avagacche dashvattha
    nashvattha navagacche davagacche dashvatthan | nmayukha nashvattha nashvattha nthsapta sapta mayukha
    sapta maddhyameshaya mmaddhyameshayagm sapta sapta maddhyameshaya maddhyameshaya mupopa maddhyameshaya
    mmaddhyameshaya mupa | maddhyameshayamiti maddhyama upa hanya ddhanya dupopa hanyat | hanya dida midagm
    hanya ddhanya didam | ida maha maha mida mida maham | aha maditya naditya naha maha madityan | nbadhnami
    badhna myaditya naditya badhnamya badhnami badhnamya | a 'mushma damushmada 'mushma amushma damushya
    amushya amushma damushma damushyai amushyai visho visho 'mushya amushyai vishah | visho 'vaganto ravaganto
    rvisho visho 'vagantoh | avaganto riti tyavaganto ravaganto riti | ityaditya aditya iti tyadityah
    | aditya evai vaditya aditya eva | mbaddhavira baddhavira ena mena mbaddhavira baddhavira visha baddhavira
    iti baddha ava gamayanti gamaya ntyavava gamayanti | gamayanti yadi yadi gamayanti gamayanti yadi
    | yadi na na yadi yadi na | navagacche davagacche avagacchedeta meta mavagacche davagacche detam |
    eta mevaivaita meta meva | evaditya maditya mevai vadityam | ncaru maditya maditya vape diddhma iddhme
    vape iddhme 'pyapiddhma iddhme 'pi | nmayukha napyapi mayukhan | nahye danaparuddhya manaparuddhya
    nnahye danaparuddhyam | anaparuddhya mevaivanaparuddhya manaparuddhya meva | anaparuddhyamityanapa
    ava gacchati gaccha tyavava gacchati | gaccha tyashvattha ashvattha gacchati gaccha tyashvatthah |
    ashvattha bhavanti bhava ntyashvattha ashvattha bhavanti | mbhavanti bhavanti maruta eta doja oja
    eta deta dojah | ashvattha ojasaujasa 'shvattho oja saivai vauja saujasaiva | ava gacchati gaccha
    tyavava gacchati | gacchati sapta sapta gacchati gacchati sapta | sapta bhavanti bhavanti sapta sapta
    bhavanti | ssaptagana bhavanti bhavanti saptaganah | saptagana vai vai saptagana saptagana iti sapta
    vai maruto maruto vai vai marutah | maruto ganasho ganasho maruto maruto ganashah | ganasha evaiva
    ganasho ganasha eva | ava gacchati gaccha tyavava gacchati | gacchatiti gacchati | || deva vai vai
    deva deva vai | mrityo rabibhayu rabibhayu rmrityo rabibhayuh | abibhayu ste te 'bibhayu rabibhayu
    ste | nte te prajapatim | prajapati mupopa prajapati mprajapati mupa | prajapatimiti praja ntebhya
    stebhyo 'dhava ntebhya stebhya etam | mprajapatya meta meta prajapatyagm shatakrishnalagm shatakrishnala
    mprajapatyagm shatakrishnalam | prajapatyamiti praja shshatakrishnalagm shatakrishnala shatakrishnalamiti
    shata ttaya taya 'vapa davapa tayaivaiva taya tayaiva | eshvamrita mamrita meshve shvamrita amrita
    madadha dadadha damrita mamrita madadhat | ttasmai tasmai bibhiya ntasmai tasma etam | mprajapatya
    meta meta prajapatyagm shatakrishnalagm shatakrishnala mprajapatyagm shatakrishnalam | prajapatyamiti
    praja shshatakrishnalagm shatakrishnala shatakrishnalamiti shata prajapati mevaiva prajapati prajapatimiti
    praja eva svena svenaivaiva svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa
    bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah
    | nnevaivasminn | rdadhati dadha tyayu rayu dadhati sarvagm sarva ssarvagm sarva mayuh | ayu retye
    tyayu rayureti | eti shatakrishnala shatakrishnalaityeti shatakrishnala | shatakrishnala bhavati bhavati
    shatakrishnala shatakrishnala bhavati | bhavati shatayuh shatayu rbhavati bhavati shatayuh | shatayuh
    purushah purusha shshatayuh shatayuh purushah | shshatendriyah purushah purusha shatendriya ayushyayushi
    shatendriya shshatendriya ayushi | shatendriya iti shata ayu shyevai vayu shyayu shyeva | eve ndriya
    indriya evaive ndriye | indriye prati prati ndriya indriye prati | || prati tishthati tishthati prati
    prati tishthati | tishthati ghrite ghrite tishthati tishthati ghrite | ghrite bhavati bhavati ghrite
    ghrite bhavati | rbhavati bhava tyayuh | amritagm hiranyagm hiranya mamrita mamritagm hiranyam | hiranya
    mayu rayur hiranyagm hiranya mayuh | ayushca cayu rayushca | evasma asma evaivasmai asma amrita mamrita
    masma asma amrita ca samici samici ca ca samici samici dadhati dadhati samici samici dadhati | dadhati
    catvaricatvari catvaricatvari dadhati dadhati catvaricatvari | catvaricatvari krishnalani krishnalani
    catvaricatvari catvaricatvari krishnalani | catvaricatvariti catvari krishnalanyavava krishnalani
    krishnalanyava | ava dyati dyatyavava dyati | dyati caturavattasya caturavattasya dyati dyati caturavattasya
    | caturavattasyaptya aptyai caturavattasya caturavattasyaptyai caturavattasyeti catuh aptya ekadhaikadha
    ''ptya aptya ekadha | brahmana eka dhaikadha brahmane brahmana upopa brahmane upa harati hara tyupopa
    harati | ha ratyeka dhaikadha harati hara tyekadha | eka dhaivai vaika dhaikadhaiva | eva yajamane
    yajamana evaiva yajamane | ryajamane yajamana ayuh | rdadhati dadha tyayu rayu dadhatyasa vasau dadhati
    dadhatyasau | asa vaditya adityo 'sa vasa vadityah | adityo na naditya adityo na | vyarocata rocata
    vi vyarocata | arocata tasmai tasma arocata rocata tasmai tasmai deva deva stasmai tasmai devah |
    devah prayashcitti ndeva devah prayashcittim | prayashcitti maiccha mprayashcitti maicchann | ntasmai
    tasma aiccha ntasmai tasma etam | etagm sauryagm saurya meta metagm sauryam | ncarugm sauryagm saurya
    tenaivaiva tena tenaiva | nnevaivasminn | nrucagm ruca masmi ruca madadhu radadhu rucagm ruca madadhuh
    | yo brahmavarcasakamo brahmavarcasakamo yo yo brahmavarcasakamah | brahmavarcasakama dbrahmavarcasakamo
    brahmavarcasakama brahmavarcasakama iti brahmavarcasa ttasmai tasmai sya ntasmai tasma etam | etagm
    sauryagm saurya meta metagm sauryam | ncarugm sauryagm saurya amu mevaivamu mamu meva | evaditya maditya
    mevai vadityam | svena svenaditya madityagg svena bhagadheyena bhagadheyena svena svena bhagadheyena
    | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati sa sa
    dhavati dhavati sah | nnevaivasminn | mbrahmavarcasa masmi ndadhati dadhati brahmavarcasa brahmavarcasamiti
    brahma dadhati brahmavarcasi brahmavarcasi dadhati dadhati brahmavarcasi | brahmavarca syevaiva brahmavarcasi
    brahmavarca syeva | brahmavarcasiti brahma eva bhavati bhava tyevaiva bhavati | bhava tyubhayata ubhayato
    bhavati bhava tyubhayatah | ubhayato rukmau rukma vubhayata ubhayato rukmau | rukmau bhavato bhavato
    rukmau rukmau bhavatah | bhavata ubhayata ubhayato bhavato bhavata ubhayatah | ubhayata evaivo bhayata
    ubhayata eva | nnevaivasminn | nrucagm ruca masmi ndadhati dadhati rucagm ruca dadhati prayajeprayaje
    prayajeprayaje dadhati dadhati prayajeprayaje | prayajeprayaje krishnala mprayajeprayaje prayajeprayaje
    krishnala prayajeprayaja iti prayaje njuhoti juhoti krishnala juhoti digbhyo digbhyo juhoti juhoti
    digbhyah | digbhya evaiva digbhyo digbhya eva | evasma asma evaivasmai asmai brahmavarcasa mbrahmavarcasa
    masma asmai brahmavarcasam | brahmavarcasa mavava brahmavarcasa mbrahmavarcasa mava | brahmavarcasamiti
    brahma ava rundhe rundhe 'vava rundhe | gneyagm rundhe rundha agneyam | agneya mashtakapala mashtakapala
    magneya ma gneya mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta thsavitragm savitram
    ndvadashakapalagm savitragm savitra mbhumyai bhumyai dvadashakapala dvadashakapalamiti dvadasha mbhumyai
    bhumyai carum | || yah kamayeta kamayeta yo yah kamayeta | kamayeta hiranyagm hiranya nkamayeta kamayeta
    hiranyam | vi~ndeya vindeya hiranyagm hiranyam vindeya hiranyagm hiranyam vi~ndeya vindeya hiranyam
    | mma ma hiranyagm hiranya nname dupopa namet | agneyo bhavati bhava tyagneya a mbhavati bhava tyagneyam
    | vai hiranyagm hiranyam ya~sya yasya hiranyagm hiranyam yasyaivaiva yasya yasyaiva | eva hiranyagm
    hiranya mevaiva hiranyam | ntena tena hiranyagm hiranya tenaivaiva tena tenaiva | evaina dena devaivainat
    | dvindate vindata ena dena vindate savitra ssavitro vindate vindate savitrah | savitro bhavati bhavati
    savitra ssavitro bhavati | bhavati savitriprasuta ssavitriprasuto bhavati bhavati savitriprasutah
    | savitriprasuta evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri evaina dena
    devaivainat | dvindate vindata ena dena vindate bhumyai bhumyai vindate vindate bhumyai rbhumyai bhumyai
    caruh | rbhavati bhavati caru shcaru bhava tyasya masya mbhavati bhava tyasyam | asya mevaivasya masya
    meva | evaina dena devaivainat | dvindate vindata ena dena vindata upopa vindate vindata upa | upaina
    mena mupopainam | enagm hiranyagm hiranya mena menagm hiranyam | nnamati namati hiranyagm hiranya
    namati vi vi namati namati vi | va esha esha vai va eshah | ndriyenaisha esha indriyena | indriyena
    viryena viryene ndriyene ndriyena viryena | ddhyata riddhyate viryena viryena r riddhyate yo ya riddhyata
    riddhyate yah | yo hiranyagm hiranyam vi~ndate vindate hiranyagm hiranyam vindata eta metam vi~ndate
    vindata etam | eta mevaivaita meta meva | || vape ddhiranyagm hiranyam dvape ddhiranyam | vi~ttva
    vittva hiranyagm hiranyam vittva na na vittva vittva na | ndriyena na ne ndriyena | indriyena viryena
    viryene ndriyene ndriyena viryena | viryena vi vi viryena viryena vi | vyriddhyata riddhyate vi vyriddhyate
    | riddhyata eta meta mriddhyata riddhyata etam | eta mevaivaita meta meva | yasya hiranyagm hiranyam
    ya~sya yasya hiranyam | nnashye ddhiranyagm hiranya agneyo bhavati bhava tyagneya a mbhavati bhava
    tyagneyam | vai hiranyagm hiranyam ya~sya yasya hiranyagm hiranyam yasyaivaiva yasya yasyaiva | eva
    hiranyagm hiranya mevaiva hiranyam | ntena tena hiranyagm hiranya tenaivaiva tena tenaiva | evaina
    dena devaivainat | dvindati vinda tyena dena vindati savitra ssavitro vindati vindati savitrah | savitro
    bhavati bhavati savitra ssavitro bhavati | bhavati savitriprasuta ssavitriprasuto bhavati bhavati
    savitriprasutah | savitriprasuta evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri
    evaina dena devaivainat | dvindati vinda tyena dena vindati bhumyai bhumyai vindati vindati bhumyai
    rbhumyai bhumyai caruh | rbhavati bhavati caru shcaru bhava tyasya masya mbhavati bhava tyasyam |
    vai~ va asya masyam nnashyati nashya tyeta deta nnashyati nashyati yat | nnashyati nashyati ya nashya
    tyasya masya nnashyati nashya tyasyam | asya mevaivasya masya meva | evaina dena devaivainat | dvindati
    vinda tyena dena vindatindra indro vindati vindatindrah | indra stvashtu stvashtu rindra indra stvashtuh
    | || ntvashtu stvashtu soma mabhishaha 'bhishaha somagm soma mabhishaha abhishaha 'piba dapiba dabhishaha
    'bhishaha 'pibat | ndriyena sa sa indriyena | indriyena somapithena somapithene ndriyena somapithena
    | somapithena vi vi somapithena somapithena vi | rdhyata rdhyata vi vya rdhyata rdhyata sah | urdhva
    mudavami dudavami durdhva murdhva mudavamit | tte ta udavami dudavami shshyamaka ste te shyamakah
    shshyamaka abhavann | mprajapatigm sa sa prajapatim | prajapati mupopa prajapati mprajapati mupa |
    prajapatimiti praja upadhava dadhava dupopa dhavat | ttasmai tasma adhava dadhava ntasmai tasma etam
    | etagm somendragm somendra meta metagm somendram | shyamakagm somendragm somendragg ttena tena vapa
    davapa tenaivaiva tena tenaiva | nnevaivasminn | nnindriya mindriya masmi indriyagm somapithagm somapitha
    mindriya mindriyagm somapitham | thsomapithagm somapitha madadhat | va esha esha vai va eshah | ndriyenaisha
    esha indriyena | indriyena somapithena somapithene ndriyena somapithena | somapithena rdhyata riddhyate
    somapithena somapithena rdhyate | riddhyate yo ya riddhyata riddhyate yah | va~miti vamiti somagm
    somam vamiti yo yo vamiti vamiti yah | ssomavami somavami yo ya thsomavami somavami syat | ttasmai
    tasmai sya ntasmai tasma etam | || etagm somendragm somendra meta metagm somendram | shyamakagm somendragm
    somendragg nca ca somagm soma eve ndra mindra mevaive ndra nca ce ndra mindra ca svena svena ca ca
    svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati tau tau dhavati dhavati tau | ta vevaiva tau ta veva
    | nnevaivasminn | nnindriya mindriya masmi indriyagm somapithagm somapitha mindriya mindriyagm somapitham
    | ssomapithagm somapitha dhatto na na dhatto dhatto na | ndriyena na ne ndriyena | indriyena somapithena
    somapithene ndriyena somapithena | somapithena vi vi somapithena somapithena vi | vyriddhyata riddhyate
    vi vyriddhyate | dyadriddhyata riddhyate yat | saumyo bhavati bhavati saumya bhavati somapithagm somapitha
    mbhavati bhavati somapitham | somapitha mevaiva somapithagm somapitha meva | ava rundhe rundhe 'vava
    rundhe | drundhe rundhe yat | yadaindra aindro ya aindro bhavati bhava tyaindra aindro bhavati | bhavatindriya
    mindriya mbhavati bhavatindriyam | vai~ va indriya mindriyam ssomapitho vai vai somapithah | somapitha
    indriya mindriyagm somapitha ssomapitha indriyam | indriya mevaive ndriya mindriya meva | eva somapithagm
