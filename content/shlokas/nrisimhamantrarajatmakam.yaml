id: nrisimhamantrarajatmakam
category: mantra
name:
  english: nrisimhamantrarajatmakam
  devanagari: नृसिंहमन्त्रराजात्मकम्
content:
  english: shrinrisimhamantrarajatmakam shri ganeshaya namah | shri lakshminrisimhaya namah | brahmovaca
    | aneka mantra kotishah nrisimhanama ucyate | anyo vidhi na rakshayai visharoga nivarane ||| 1|| om
    asya shri lakshminrisimhamantrakavacasya | brahma rishih anushtubh chandah aim kilakam | shrinrisimhodevata
    | mama sarvaroganam sarva devanam caurapannagavyaghravrishcikabhutapretapishaca shakinidikini yantramantranekanivaranarthe
    nrisimharajaprityarthe jape viniyogah || atha karanyasah | om kshrom angushthabhyam namah | om praum
    tarjanibhyam namah | om hraum madhyamabhyam namah | om hraim anamikabhyam namah | om vaum kanishthikabhyam
    namah | om jyaim karatalakaraprishthabhyam namah || evam hridayadi nyasah | atha dhyanam | satyajnanasukhasvarupamamalakshirabdhimadhyasthitam
    yogarudha matiprasannavadanam bhushasahasrojvalam | tryakshancakrapinakasabhayavaran bibhranamekacchavim
    chatribhutaphanindramindudhavalam lakshminrisimham bhaje || 1|| om kshraum praum hlaum raum braum
    jraum namo nrisimhaya sarva dushtavinashanaya sarvajanamohanaya sarvarajyam vashyam kuru kuru svaha
    || om namo nrisimhasimhaya simharajaya narakeshaya namah | om kalaya damshtrakaralavadanaya ugraya
    ugraviraya ugravikataya vajraya vajradehine bhadraya bhadrakarine jrim hrim nrisimhaya namah | om
    nrisimhaya kapilajataya amodavaca satyam vratyam mahogra pracandarupaya sarvajna roganabandha bandha
    sarvograhanabandha sarvadevadoshanabandha bandha sarvacoranabandha bandha sarva vyaghranabandha bandha
    bandha sarvapannaganabandha || bandha sarvarrishcikanabandha sarva bhutapretapishaca
  devanagari: श्रीनृसिंहमन्त्रराजात्मकम् श्री गणेशाय नमः । श्री लक्ष्मीनृसिंहाय नमः । ब्रह्मोवाच । अनेक
    मन्त्र कोटीशः नृसिंहनाम उच्यते । अन्यो विधि न रक्षायै विषरोग निवारणे ॥। १॥ ॐ अस्य श्री लक्ष्मीनृसिंहमन्त्रकवचस्य
    । ब्रह्मा ऋषिः अनुष्टुभ् छन्दः ऐं कीलकम् । श्रीनृसिंहोदेवता । मम सर्वरोगानां सर्व देवानां चौरपन्नगव्याघ्रवृश्चिकभूतप्रेतपिशाच
    शाकिनीडीकिनी यन्त्रमन्त्रानेकनिवारणार्थे नृसिंहराजप्रीत्यर्थे जपे विनियोगः ॥ अथ करन्यासः । ॐ क्ष्रों
    अङ्गुष्ठाभ्यां नमः । ॐ प्रौं तर्जनीभ्यां नमः । ॐ ह्रौं मध्यमाभ्यां नमः । ॐ ह्रैं अनामिकाभ्यां नमः
    । ॐ वौं कनिष्ठिकाभ्यां नमः । ॐ ज्यैं करतलकरपृष्ठाभ्यां नमः ॥ एवं हृदयादि न्यासः । अथ ध्यानम् । सत्यज्ञानसुखस्वरूपममलक्षीराब्धिमध्यस्थितं
    योगारूढ मतिप्रसन्नवदनं भूषासहस्रोज्वलम् । त्र्यक्षञ्चक्रपिनाकसाभयवरान् बिभ्राणमेकच्छविं छत्रीभूतफणीन्द्रमिन्दुधवलं
    लक्ष्मीनृसिंहं भजे ॥ १॥ ॐ क्ष्रौं प्रौं ह्लौं रौं ब्रौं ज्रौं नमो नृसिंहाय सर्व दुष्टविनाशानाय सर्वजनमोहनाय
    सर्वराज्यं वश्यं कुरु कुरु स्वाहा ॥ ॐ नमो नृसिंहसिंहाय सिंहराजाय नरकेशाय नमः । ॐ कालाय दंष्ट्राकरालवदनाय
    उग्राय उग्रवीराय उग्रविकटाय वज्राय वज्रदेहिने भद्राय भद्रकारिणे ज्रीं ह्रीं नृसिंहाय नमः । ॐ नृसिंहाय
    कपिलजटाय अमोदवाचा सत्यं व्रत्यं महोग्र प्रचण्डरूपाय सर्वज्ञ रोगानाबन्ध बन्ध सर्वोग्रहानाबन्ध सर्वदेवदोषानाबन्ध
    बन्ध सर्वचोराणाबन्ध बन्ध सर्व व्याघ्रानाबन्ध बन्ध बन्ध सर्वपन्नगानाबन्ध ॥ बन्ध सर्वरृश्चिकानाबन्ध
    सर्व भूतप्रेतपिशाच
