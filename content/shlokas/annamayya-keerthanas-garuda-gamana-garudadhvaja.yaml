id: annamayya-keerthanas-garuda-gamana-garudadhvaja
category: stotram
name:
  english: Annamayya Keerthanas Garuda Gamana Garudadhvaja
content:
  english: rupakam pallavi garuda gamana garudadhvaja narahari namonamo namo || caranam kamalapati kamalanabha
    kamalaja janmakaranika | kamalanayana kamalaptakula namonamo hari namo namo || jaladhi bandhana jaladhishayana
    jalanidhi madhya jantukala | jaladhijamata jaladhigambhira haladhara namo hari namo || ghanadivyarupa
    ghanamahimanka ghanaghana ghanakaya varna | anagha shrivenkatadhipateham namo namohari namo namo ||
    garuda gamana garudadhvaja
  devanagari: रूपकम् पल्लवि गरुड गमन गरुडध्वज नरहरि नमोनमो नमो ॥ चरणं कमलापति कमलनाभा कमलज जन्मकारणिक
    । कमलनयन कमलाप्तकुल नमोनमो हरि नमो नमो ॥ जलधि बन्धन जलधिशयन जलनिधि मध्य जन्तुकल । जलधिजामात जलधिगम्भीर
    हलधर नमो हरि नमो ॥ घनदिव्यरूप घनमहिमाङ्क घनघना घनकाय वर्ण । अनघ श्रीवेङ्कटाधिपतेहं नमो नमोहरि नमो
    नमो ॥ गरुड गमन गरुडध्वज
