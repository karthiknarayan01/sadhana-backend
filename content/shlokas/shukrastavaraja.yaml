id: shukrastavaraja
category: stotram
name:
  english: shukrastavaraja
  devanagari: शुक्रस्तवराज
content:
  english: shukrastavarajah asya shrishukrastavarajasya prajapatih rishih anushtup chandah shukro devata
    shrishukraprityarthe pathe viniyogah || namaste bhargavashreshtha daityadanavapujita | vrishtirodhaprakartre
    ca vrishtikartre namo namah || 1|| devayanipitastubhyam vedavedangaparaga | parena tapasa shuddhah
    shankaro lokasundarah || 2|| praptau vidyam jivanakhyam tasmai shukratmane namah | namastasmai bhagavate
    bhriguputraya vedhase || 3|| taramandalamadhyastha svabhasabhasitambarah | yasyodaye jagatsarvam mangalarham
    bhavediha || 4|| astam yate hyarishtam syattasmai mangalarupine | tripuravasino daityan shivabanaprapiditan
    || 5|| vidyaya'jivayacchukro namaste bhrigunandana | yayatigurave tubhyam namaste kavinandana || 6||
    valirajyaprado jivastasmai jivatmane namah | bhargavaya namastubhyam purvagirvanavandita || 7|| jivaputraya
    yo vidyam pradattasmai namo namah | namah shukraya kavyaya bhriguputraya dhimahi || 8|| namah karanarupaya
    namaste karanatmane | stavarajamimam punyam bhargavasya mahatmanah || 9|| yah pathecchrinuyadvapi
    labhate vanchitam phalam | putrakamo labhetputran shrikamo labhate shriyam || 10|| rajyakamo labhedrajyam
    strikamah striyamuttamam | bhriguvare prayatnena pathitavyam samahiteh || 11|| anyavare tu horayam
    pujayedbhrigunandanam | rogarto mucyate rogadbhayarto mucyate bhayat || 12|| yadyatprarthayate jantustattatprapnoti
    sarvada | pratahkale prakartavya bhrigupuja prayatnatah | sarvapapavinirmuktah prapnuyacchivasannidhim
    || 13|| iti shribrahmayamale shukrastavarajah sampurnah ||
  devanagari: शुक्रस्तवराजः अस्य श्रीशुक्रस्तवराजस्य प्रजापतिः ऋषिः अनुष्टुप् छन्दः शुक्रो देवता श्रीशुक्रप्रीत्यर्थे
    पाठे विनियोगः ॥ नमस्ते भार्गवश्रेष्ठ दैत्यदानवपूजित । वृष्टिरोधप्रकर्त्रे च वृष्टिकर्त्रे नमो नमः
    ॥ १॥ देवयानिपितस्तुभ्यं वेदवेदाङ्गपारग । परेण तपसा शुद्धः शङ्करो लोकसुन्दरः ॥ २॥ प्राप्तौ विद्यां
    जीवनाख्यां तस्मै शुक्रात्मने नमः । नमस्तस्मै भगवते भृगुपुत्राय वेधसे ॥ ३॥ तारामण्डलमध्यस्थ स्वभासाभासिताम्बरः
    । यस्योदये जगत्सर्वं मङ्गलार्हं भवेदिह ॥ ४॥ अस्तं याते ह्यरिष्टं स्यात्तस्मै मङ्गलरूपिणे । त्रिपुरावासिनो
    दैत्यान् शिवबाणप्रपीडितान् ॥ ५॥ विद्ययाऽजीवयच्छुक्रो नमस्ते भृगुनन्दन । ययातिगुरवे तुभ्यं नमस्ते कविनन्दन
    ॥ ६॥ वलिराज्यप्रदो जीवस्तस्मै जीवात्मने नमः । भार्गवाय नमस्तुभ्यं पूर्वगीर्वाणवन्दित ॥ ७॥ जीवपुत्राय
    यो विद्यां प्रादात्तस्मै नमो नमः । नमः शुक्राय काव्याय भृगुपुत्राय धीमहि ॥ ८॥ नमः कारणरूपाय नमस्ते
    कारणात्मने । स्तवराजमिमं पुण्यं भार्गवस्य महात्मनः ॥ ९॥ यः पठेच्छृणुयाद्वापि लभते वाञ्छितं फलम् ।
    पुत्रकामो लभेत्पुत्रान् श्रीकामो लभते श्रियम् ॥ १०॥ राज्यकामो लभेद्राज्यं स्त्रीकामः स्त्रियमुत्तमाम्
    । भृगुवारे प्रयत्नेन पठितव्यं समाहितेः ॥ ११॥ अन्यवारे तु होरायां पूजयेद्भृगुनन्दनम् । रोगार्तो मुच्यते
    रोगाद्भयार्तो मुच्यते भयात् ॥ १२॥ यद्यत्प्रार्थयते जन्तुस्तत्तत्प्राप्नोति सर्वदा । प्रातःकाले प्रकर्तव्या
    भृगुपूजा प्रयत्नतः । सर्वपापविनिर्मुक्तः प्राप्नुयाच्छिवसन्निधिम् ॥ १३॥ इति श्रीब्रह्मयामले शुक्रस्तवराजः
    सम्पूर्णः ॥
