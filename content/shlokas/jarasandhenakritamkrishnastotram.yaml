id: jarasandhenakritamkrishnastotram
category: stotram
name:
  english: jarasandhenakritamkrishnastotram
  devanagari: जरासन्धेनकृतंकृष्णस्तोत्रम्
content:
  english: jarasandhena kritam krishnastotram krishna krishnaprameyatman prapannabhayabhanjana | vayam
    tvam sharanam yamo bhavabhitah prithagdhiyah || 25|| loko vikarmaniratah kushale pramattah karmanyayam
    tvadudite bhavadarcane sve | yastavadasya balavaniha jivitasham sadyashchinattyanimishaya namo'stu
    tasmai || 26|| loke bhavanjagadinah kalayavatirnah sadrakshanaya khalanigrahanaya canyah | kashcittvadiyamatiyati
    nideshamisha kim va janah svakritamricchati tanna vidmah || 27|| svapnayitam nripasukham paratantramisha
    shashvadbhayena mritakena dhuram vahamah | hitva tadatmani sukham tvadanihalabhyam klishyamahe'tikripanastava
    mayayeha || 28|| tanno bhavan pranatashokaharanghriyugmo baddhan viyunkshva magadhahvayakarmapashat
    | yo bhubhujo'yutamatangajaviryameko bibhradrurodha bhavane mrigaradivavih || 29|| yo vai tvaya dvinavakritva
    udattacakra
  devanagari: जरासन्धेन कृतं कृष्णस्तोत्रम् कृष्ण कृष्णाप्रमेयात्मन् प्रपन्नभयभञ्जन । वयं त्वां शरणं यामो
    भवभीताः पृथग्धियः ॥ २५॥ लोको विकर्मनिरतः कुशले प्रमत्तः कर्मण्ययं त्वदुदिते भवदर्चने स्वे । यस्तावदस्य
    बलवानिह जीविताशां सद्यश्छिनत्त्यनिमिषाय नमोऽस्तु तस्मै ॥ २६॥ लोके भवाञ्जगदिनः कलयावतीर्णः सद्रक्षणाय
    खलनिग्रहणाय चान्यः । कश्चित्त्वदीयमतियाति निदेशमीश किं वा जनः स्वकृतमृच्छति तन्न विद्मः ॥ २७॥ स्वप्नायितं
    नृपसुखं परतन्त्रमीश शश्वद्भयेन मृतकेन धुरं वहामः । हित्वा तदात्मनि सुखं त्वदनीहलभ्यं क्लिश्यामहेऽतिकृपणास्तव
    माययेह ॥ २८॥ तन्नो भवान् प्रणतशोकहराङ्घ्रियुग्मो बद्धान् वियुङ्क्ष्व मगधाह्वयकर्मपाशात् । यो भूभुजोऽयुतमतङ्गजवीर्यमेको
    बिभ्रद्रुरोध भवने मृगराडिवावीः ॥ २९॥ यो वै त्वया द्विनवकृत्व उदात्तचक्र
