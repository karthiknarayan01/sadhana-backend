id: payovratasamayekaraniyamvishnustotram
category: stotram
name:
  english: payovratasamayekaraniyamvishnustotram
  devanagari: पयोव्रतसमयेकरणीयंविष्णुस्तोत्रम्
content:
  english: ringaya sutrine || 19|| saptahastaya kratave vedatrayatmane namah | mahadevaya rudraya vrishabhaya
    namo namah || 20|| yavadvidya'dhishthitaya praninam pataye namah | namo hiranyakoshaya jagatpranatmane
    namah || 21|| yogasiddhyaishvaryavate yogakartre ca te namah | namah sarvadidevaya namaste catmavartine
    || 22|| namaste harikrishnaya naranarayanarshaye | namah indivarashyamavapushe shrimate namah || 23||
    namaste keshavananta
  devanagari: ृङ्गाय सूत्रिणे ॥ १९॥ सप्तहस्ताय क्रतवे वेदत्रयात्मने नमः । महादेवाय रुद्राय वृषभाय नमो
    नमः ॥ २०॥ यावद्विद्याऽधिष्ठिताय प्राणिनां पतये नमः । नमो हिरण्यकोशाय जगत्प्राणात्मने नमः ॥ २१॥ योगसिद्ध्यैश्वर्यवते
    योगकर्त्रे च ते नमः । नमः सर्वादिदेवाय नमस्ते चात्मवर्तिने ॥ २२॥ नमस्ते हरिकृष्णाय नरनारायणर्षये ।
    नमः इन्दीवरश्यामवपुषे श्रीमते नमः ॥ २३॥ नमस्ते केशवानन्त
meaning: {}
