id: rudrashtakam
category: stotram
name:
  english: Rudrashtakam
  devanagari: रुद्राष्टकम्
content:
  english: namamishamishana nirvana rupam| vibhum vyapakam brahma vedasvarupam||1|| nijam nirgunam nirvikalpam
    niriham| cidakashamakashavasam bhajeham||2|| nirakaramomkaramulam turiyam| gira jnana gotitamisham
    girisham||3|| karalam mahakala kalam kripalam| gunagara samsaraparam natoham||4|| tusharadri samkasha
    gauram gambhiram| manobhuta koti prabha shri shariram||5|| sphuranmauli kallolini caru gamga| lasadbhalabalemdu
    kamthe bhujamga||6|| calatkumdalam bhru sunetram vishalam| prasannananam nilakamtha dayalam||7|| mrigadhishacarmambaram
    mundamalam| priyam shamkaram sarvanatham bhajami||8|| pracamdam prakrishtam pragalbham paresham| akhamdam
    ajam bhanukotiprakasham||9|| traya shula nirmulanam shulapanim| bhajeham bhavanipatim bhavagamyam||10||
    kalatita kalyana kalpantakari| sada sajjananandadata purari||11|| cidanamdasamdoha mohapahari| prasida
    prasida prabho manmathari||12|| na yavad umanatha padaravindam| bhajamtiha loke pare va naranam||13||
    na tavatsukham shamti santapanasham| prasida prabho sarvabhutadhivasam||14|| na janami yogam japam
    naiva pujam| natoham sada sarvada shambhu tubhyam||15|| jara janma du khaugha tatapyamanam| prabho
    pahi apannamashisha shambho||16|| rudrashtakamidam proktam viprena haratoshaye| ye pathanti nara bhaktya
    tesham shambhuh prasidati||
  devanagari: नमामिशमीशान निर्वाण रूपं। विभुं व्यापकं ब्रह्म वेदस्वरूपं॥१॥ निजं निर्गुणं निर्विकल्पं निरीहं।
    चिदाकाशमाकाशवासं भजेहं॥२॥ निराकारमोंकारमूलं तुरीयं। गिरा ज्ञान गोतीतमीशं गिरीशं॥३॥ करालं महाकाल कालं
    कृपालं। गुणागार संसारपारं नतोहं॥४॥ तुषाराद्रि संकाश गौरं गंभीरं। मनोभूत कोटि प्रभा श्री शरीरं॥५॥ स्फुरन्मौलि
    कल्लोलिनी चारु गंगा। लसद्भालबालेंदु कंठे भुजंगा॥६॥ चलत्कुंडलं भ्रू सुनेत्रं विशालं। प्रसन्नाननं नीलकंठ
    दयालं॥७॥ मृगाधीशचर्माम्बरं मुण्डमालं। प्रियं शंकरं सर्वनाथं भजामि॥८॥ प्रचंडं प्रकृष्टं प्रगल्भं परेशं।
    अखंडं अजं भानुकोटिप्रकाशं॥९॥ त्रय शूल निर्मूलनं शूलपाणिं। भजेहं भवानीपतिं भावगम्यं॥१०॥ कलातीत कल्याण
    कल्पान्तकारी। सदा सज्जनानन्ददाता पुरारी॥११॥ चिदानंदसंदोह मोहपहारी। प्रसीद प्रसीद प्रभो मन्मथारी॥१२॥
    न यावद् उमानाथ पादारविन्दं। भजंतीह लोके परे वा नराणां॥१३॥ न तावत्सुखं शांति सन्तापनाशं। प्रसीद प्रभो
    सर्वभूताधिवासं॥१४॥ न जानामि योगं जपं नैव पूजां। नतोहं सदा सर्वदा शंभु तुभ्यं॥१५॥ जरा जन्म दु खौघ तातप्यमानं।
    प्रभो पाहि आपन्नमाशीश शंभो॥१६॥ रुद्राष्टकमिदं प्रोक्तं विप्रेण हरतोषये। ये पठन्ति नरा भक्त्या तेषां
    शम्भुः प्रसीदति॥
