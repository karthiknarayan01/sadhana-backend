id: catushshlokibhagavatam
category: stotram
name:
  english: catushshlokibhagavatam
  devanagari: चतुश्श्लोकीभागवतम्
content:
  english: catuhshlokibhagavatam shribhagavanuvaca | jnanam paramaguhyam me yadvijnanasamanvitam | sarahasyam
    tadangam ca grihana gaditam maya || 1|| yavanaham yathabhavo yadrupagunakarmakah | tathaiva tattvavijnanamastu
    te madanugrahat || 2|| ahamevasamevagre nanyadyatsadasatparam | pashcadaham yadetacca yo'vashishyeta
    so'smyaham || 3|| rite'rtham yatpratiyeta na pratiyeta catmani | tadvidyadatmano mayam yatha''bhaso
    yatha tamah || 4|| yatha mahanti bhutani bhuteshuccavaceshvanu | pravishtanyapravishtani tatha teshu
    na teshvaham || 5|| etavadeva jijnasyam tattvajijnasuna''tmanah | anvayavyatirekabhyam yatsyatsarvatra
    sarvada || 6|| etanmatam samatishtha paramena samadhina | bhavankalpavikalpeshu na vimuhyati karhicit
    || 7|| || iti shrimadbhagavate mahapurane'shtadashasahasryam samhitayam vaiyasikyam dvitiyaskandhe
    bhagavadbrahmasamvade navamadhyayantargatam catuhshlokibhagavatam samaptam ||
  devanagari: चतुःश्लोकीभागवतम् श्रीभगवानुवाच । ज्ञानं परमगुह्यं मे यद्विज्ञानसमन्वितम् । सरहस्यं तदङ्गं
    च गृहाण गदितं मया ॥ १॥ यावानहं यथाभावो यद्रूपगुणकर्मकः । तथैव तत्त्वविज्ञानमस्तु ते मदनुग्रहात् ॥
    २॥ अहमेवासमेवाग्रे नान्यद्यत्सदसत्परम् । पश्चादहं यदेतच्च योऽवशिष्येत सोऽस्म्यहम् ॥ ३॥ ऋतेऽर्थं यत्प्रतीयेत
    न प्रतीयेत चात्मनि । तद्विद्यादात्मनो मायां यथाऽऽभासो यथा तमः ॥ ४॥ यथा महान्ति भूतानि भूतेषूच्चावचेष्वनु
    । प्रविष्टान्यप्रविष्टानि तथा तेषु न तेष्वहम् ॥ ५॥ एतावदेव जिज्ञास्यं तत्त्वजिज्ञासुनाऽऽत्मनः । अन्वयव्यतिरेकाभ्यां
    यत्स्यात्सर्वत्र सर्वदा ॥ ६॥ एतन्मतं समातिष्ठ परमेण समाधिना । भवान्कल्पविकल्पेषु न विमुह्यति कर्हिचित्
    ॥ ७॥ ॥ इति श्रीमद्भागवते महापुराणेऽष्टादशसाहस्र्यां संहितायां वैयसिक्यां द्वितीयस्कन्धे भगवद्ब्रह्मसंवादे
    नवमाध्यायान्तर्गतं चतुःश्लोकीभागवतं समाप्तम् ॥
