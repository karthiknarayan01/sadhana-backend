id: narayaniyam-dashaka-61
category: stotram
name:
  english: Narayaniyam Dashaka 61
content:
  english: tatashca vrindavanato'tidurato vanam gatastvam khalu gopagokulaih | hridantare bhaktataradvijangana
    kadambakanugrahanagraham vahan || || tato nirikshyasharane vanantare kishoralokam kshudhitam trishakulam
    | adurato yajnaparan dvijan prati vyasarjayo didiviyacanaya tan || || gateshvatho teshvabhidhaya te'bhidham
    kumarakeshvodanayacishu prabho | shrutisthira apyabhininyurashrutim na kinciducushca mahisurottamah
    || || anadarat khinnadhiyo hi balakah | samayayuryuktamidam hi yajvasu | ciradabhaktah khalu te mahisurah
    katham hi bhaktam tvayi taih samarpyate || || nivedayadhvam grihinijanaya mam disheyurannam karunakula
    imah | iti smitardram bhavaterita gata ste daraka darajanam yayacire || || grihitanamni tvayi sambhramakula
    shcaturvidham bhojyarasam pragrihya tah | cirandhritatvatpravilokanagrahah svakairniruddha api turnamayayuh
    || || vilolapincham cikure kapolayoh samullasatkundalamardramikshite | nidhaya bahum suhridamsasimani
    sthitam bhavantam samalokayanta tah || || tada ca kacittvadupagamodyata grihitahasta dayitena yajvana
    | tadaiva sancintya bhavantamanjasa vivesha kaivalyamaho kritinyasau || || adaya bhojyanyanugrihya
    tah puna stvadangasangasprihayojjhatirgriham | vilokya yajnaya visarjayannima shcakartha bhartrinapi
    tasvagarhanan || || nirupya dosham nijamanganajane vilokya bhaktim ca punarvicaribhih prabuddhatattvaistvamabhishtuto
    dvijai rmarutpuradhisha nirundhi me gadan ||
  devanagari: ततश्च वृन्दावनतोऽतिदूरतो वनं गतस्त्वं खलु गोपगोकुलैः । हृदन्तरे भक्ततरद्विजाङ्गना कदम्बकानुग्रहणाग्रहं
    वहन् ॥ ॥ ततो निरीक्ष्याशरणे वनान्तरे किशोरलोकं क्षुधितं तृषाकुलम् । अदूरतो यज्ञपरान् द्विजान् प्रति
    व्यसर्जयो दीदिवियाचनाय तान् ॥ ॥ गतेष्वथो तेष्वभिधाय तेऽभिधां कुमारकेष्वोदनयाचिषु प्रभो । श्रुतिस्थिरा
    अप्यभिनिन्युरश्रुतिं न किञ्चिदूचुश्च महीसुरोत्तमाः ॥ ॥ अनादरात् खिन्नधियो हि बालकाः । समाययुर्युक्तमिदं
    हि यज्वसु । चिरादभक्ताः खलु ते महीसुराः कथं हि भक्तं त्वयि तैः समर्प्यते ॥ ॥ निवेदयध्वं गृहिणीजनाय
    मां दिशेयुरन्नं करुणाकुला इमाः । इति स्मितार्द्रं भवतेरिता गता स्ते दारका दारजनं ययाचिरे ॥ ॥ गृहीतनाम्नि
    त्वयि सम्भ्रमाकुला श्चतुर्विधं भोज्यरसं प्रगृह्य ताः । चिरन्धृतत्वत्प्रविलोकनाग्रहाः स्वकैर्निरुद्धा
    अपि तूर्णमाययुः ॥ ॥ विलोलपिञ्छं चिकुरे कपोलयोः समुल्लसत्कुण्डलमार्द्रमीक्षिते । निधाय बाहुं सुहृदंससीमनि
    स्थितं भवन्तं समलोकयन्त ताः ॥ ॥ तदा च काचित्त्वदुपागमोद्यता गृहीतहस्ता दयितेन यज्वना । तदैव सञ्चिन्त्य
    भवन्तमञ्जसा विवेश कैवल्यमहो कृतिन्यसौ ॥ ॥ आदाय भोज्यान्यनुगृह्य ताः पुन स्त्वदङ्गसङ्गस्पृहयोज्झतीर्गृहम्
    । विलोक्य यज्ञाय विसर्जयन्निमा श्चकर्थ भर्तृनपि तास्वगर्हणान् ॥ ॥ निरूप्य दोषं निजमङ्गनाजने विलोक्य
    भक्तिं च पुनर्विचारिभिः प्रबुद्धतत्त्वैस्त्वमभिष्टुतो द्विजै र्मरुत्पुराधीश निरुन्धि मे गदान् ॥
