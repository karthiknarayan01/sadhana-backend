id: shiva-mangalashtakam
category: stotram
name:
  english: Shiva Mangalashtakam
content:
  english: bhavaya candracudaya nirgunaya gunatmane | kalakalaya rudraya nilagrivaya mangalam || || vrisharudhaya
    bhimaya vyaghracarmambaraya ca | pashunampataye tubhyam gaurikantaya mangalam || || bhasmoddhulitadehaya
    nagayajnopavitine | rudrakshamalabhushaya vyomakeshaya mangalam || || suryacandragninetraya namah
    kailasavasine | saccidanandarupaya pramatheshaya mangalam || || mrityunjayaya sambaya srishtisthityantakarine
    | trayambakaya shantaya trilokeshaya mangalam || || gangadharaya somaya namo hariharatmane | ugraya
    tripuraghnaya vamadevaya mangalam || || sadyojataya sharvaya bhavya jnanapradayine | ishanaya namastubhyam
    pancavakraya mangalam || || sadashiva svarupaya namastatpurushaya ca | aghoraya ca ghoraya mahadevaya
    mangalam || || shricamundapreritena racitam mangalaspadam | tasyabhishtapradam shambhoh yah pathenmangalashtakam
    || || mahadevasya devasya yah pathenmangalashtakam | sarvartha siddhi mapnoti sa sayujyam tatah param
    ||
  devanagari: भवाय चन्द्रचूडाय निर्गुणाय गुणात्मने । कालकालाय रुद्राय नीलग्रीवाय मङ्गलम् ॥ ॥ वृषारूढाय
    भीमाय व्याघ्रचर्माम्बराय च । पशूनाम्पतये तुभ्यं गौरीकान्ताय मङ्गलम् ॥ ॥ भस्मोद्धूलितदेहाय नागयज्ञोपवीतिने
    । रुद्राक्षमालाभूषाय व्योमकेशाय मङ्गलम् ॥ ॥ सूर्यचन्द्राग्निनेत्राय नमः कैलासवासिने । सच्चिदानन्दरूपाय
    प्रमथेशाय मङ्गलम् ॥ ॥ मृत्युञ्जयाय साम्बाय सृष्टिस्थित्यन्तकारिणे । त्रयम्बकाय शान्ताय त्रिलोकेशाय
    मङ्गलम् ॥ ॥ गङ्गाधराय सोमाय नमो हरिहरात्मने । उग्राय त्रिपुरघ्नाय वामदेवाय मङ्गलम् ॥ ॥ सद्योजाताय
    शर्वाय भव्य ज्ञानप्रदायिने । ईशानाय नमस्तुभ्यं पञ्चवक्राय मङ्गलम् ॥ ॥ सदाशिव स्वरूपाय नमस्तत्पुरुषाय
    च । अघोराय च घोराय महादेवाय मङ्गलम् ॥ ॥ श्रीचामुण्डाप्रेरितेन रचितं मङ्गलास्पदम् । तस्याभीष्टप्रदं
    शम्भोः यः पठेन्मङ्गलाष्टकम् ॥ ॥ महादेवस्य देवस्य यः पठेन्मङ्गलाष्टकम् । सर्वार्थ सिद्धि माप्नोति स
    सायुज्यं ततः परम् ॥
