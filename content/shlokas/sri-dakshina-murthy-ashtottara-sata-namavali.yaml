id: sri-dakshina-murthy-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Dakshina Murthy Ashtottara Sata Namavali
content:
  english: om vidyarupine namah | om mahayogine namah | om shuddhajnanine namah | om pinakadhrite namah
    | om ratnalankritasarvangaya namah | om ratnamaline namah | om jatadharaya namah | om gangadharine
    namah | om acalavasine namah | om sarvajnanine namah | | om samadhidhrite namah | om aprameyaya namah
    | om yoganidhaye namah | om tarakaya namah | om bhaktavatsalaya namah | om brahmarupine namah | om
    jagadvyapine namah | om vishnumurtaye namah | om purantakaya namah | om ukshavahaya namah | | om carmavasase
    namah | om pitambaravibhushanaya namah | om mokshasiddhaye namah | om mokshadayine namah | om danavaraye
    namah | om jagatpataye namah | om vidyadharine namah | om shuklatanave namah | om vidyadayine namah
    | om ganadhipaya namah | | om papapasmritisamhartre namah | om shashimaulaye namah | om mahasvanaya
    namah | om samapriyaya namah | om svayam sadhave namah | om sarvadevairnamaskritaya namah | om hastavahnidharaya
    namah | om shrimate namah | om mrigadharine namah | om shankaraya namah | | om yajnanathaya namah
    | om kratudhvamsine namah | om yajnabhoktre namah | om yamantakaya namah | om bhaktanugrahamurtaye
    namah | om bhaktasevyaya namah | om vrishadhvajaya namah | om bhasmoddhulitasarvangaya namah | om
    akshamaladharaya namah | om mahate namah | | om trayimurtaye namah | om parasmai brahmane namah |
    om nagarajairalankritaya namah | om shantarupaya namah | om mahajnanine namah | om sarvalokavibhushanaya
    namah | om ardhanarishvaraya namah | om devaya namah | om munisevyaya namah | om surottamaya namah
    | | om vyakhyanadevaya namah | om bhagavate namah | om agnicandrarkalocanaya namah | om jagatsrashtre
    namah | om jagadgoptre namah | om jagaddhvamsine namah | om trilocanaya namah | om jagadgurave namah
    | om mahadevaya namah | om mahanandaparayanaya namah | | om jatadharine namah | om mahaviraya namah
    | om jnanadevairalankritaya namah | om vyomagangajalasnataya namah | om siddhasanghasamarcitaya namah
    | om tattvamurtaye namah | om mahayogine namah | om mahasarasvatapradaya namah | om vyomamurtaye namah
    | om bhaktanamishtakamaphalapradaya namah | | om viramurtaye namah | om virupine namah | om tejomurtaye
    namah | om anamayaya namah | om vedavedangatattvajnaya namah | om catushshashtikalanidhaye namah |
    om bhavarogabhayadhvamsine namah | om bhaktanamabhayapradaya namah | om nilagrivaya namah | om lalatakshaya
    namah | | om gajacarmane namah | om jnanadaya namah | om arogine namah | om kamadahanaya namah | om
    tapasvine namah | om vishnuvallabhaya namah | om brahmacarine namah | om sannyasine namah | om grihasthashramakaranaya
    namah | om dantashamavatam shreshthaya namah | | om sattvarupadayanidhaye namah | om yogapattabhiramaya
    namah | om vinadharine namah | om vicetanaya namah | om mantraprajnanugacaraya namah | om mudrapustakadharakaya
    namah | om ragahikkadiroganam vinihantre namah | om sureshvaraya namah | | iti shri dakshinamurtyashtottarashatanamavalih
    ||
  devanagari: ॐ विद्यारूपिणे नमः । ॐ महायोगिने नमः । ॐ शुद्धज्ञानिने नमः । ॐ पिनाकधृते नमः । ॐ रत्नालङ्कृतसर्वाङ्गाय
