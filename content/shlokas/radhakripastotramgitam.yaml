id: radhakripastotramgitam
category: stotram
name:
  english: radhakripastotramgitam
  devanagari: राधाकृपास्तोत्रम्गीतम्
content:
  english: shriradhakripastotram krishnapremavinodini krishnanandapradayini krishnananda sadananda krishnasangasushobhini
    | krishnapraneshvari krishna kamalakunjavasini radhe radhe radhe radhe namo dinakripalini || 1|| krishnakamabibardhini
    krishnapremapradayini krishnakama krishnapriya krishnalila shiromani | krishnavakshasthitadevi kundadamasushobhini
    radhe radhe radhe radhe namo dinakripalini || 2|| krishnakrishnakrishnakrishna krishnanamapradayini
    krishnashakti krishnabhakti krishnanamebiharini | shrikrishna vallabhadevi subalaveshadharini radhe
    radhe radhe radhe namo dinakripalini || 3|| shrikrishnapriyavadini krishnadhamapradayini krishnakanta
    krishnavandya krishnacarucitramani | krishnapremasadonmatta gandhamalyadidharini radhe radhe radhe
    radhe namo dinakripalini || 4|| krishnanityasamyogini krishnasangapradayini krishnadasi krishnarashi
    krishnanikunjasvamini | krishnacandrapriyadhira ghorasamsaratarini radhe radhe radhe radhe namo dinakripalini
    || 5|| krishnayogapradarshini krishnasukhapradayini jitendriya yajnarupa shrikrishnayajnakarini |
    trailokyalokatarini jananilokapalini radhe radhe radhe radhe namo dinakripalini || 6|| krishnapranapriyaradhe
    krishnasevapradayini nishkalanka nityarupa krishnabhaveahlladini | yashodanandadayini nilapadmavidharini
    radhe radhe radhe radhe namo dinakripalini || 7|| shrikrishnacittamohini krishnabhavapradayini padmagandha
    padmahasta padmamala
  devanagari: श्रीराधाकृपास्तोत्रम् कृष्णप्रेमविनोदिनि कृष्णानन्दप्रदायिनि कृष्णानन्दा सदानन्दा कृष्णसङ्गसुशोभिनि
    । कृष्णप्राणेश्वरी कृष्णा कमलाकुञ्जवासिनि राधे राधे राधे राधे नमो दीनकृपालिनि ॥ १॥ कृष्णकामबिबर्धिनि
    कृष्णप्रेमप्रदायिनि कृष्णकामा कृष्णप्रिया कृष्णलीला शिरोमणि । कृष्णवक्षस्थितादेवी कुन्ददामसुशोभिनि
    राधे राधे राधे राधे नमो दीनकृपालिनि ॥ २॥ कृष्णकृष्णकृष्णकृष्ण कृष्णनामप्रदायिनि कृष्णशक्ति कृष्णभक्ति
    कृष्णनामेबिहारिणि । श्रीकृष्ण वल्लभादेवी सुबलावेशधारिणी राधे राधे राधे राधे नमो दीनकृपालिनि ॥ ३॥ श्रीकृष्णप्रियवादिनि
    कृष्णधामप्रदायिनि कृष्णकान्ता कृष्णवन्द्या कृष्णचारुचित्रमणि । कृष्णप्रेमसदोन्मत्ता गन्धमाल्यादिधारिणि
    राधे राधे राधे राधे नमो दीनकृपालिनि ॥ ४॥ कृष्णनित्यसंयोगिनि कृष्णसङ्गप्रदायिनि कृष्णदासि कृष्णराशि
    कृष्णनिकुञ्जस्वामिनि । कृष्णचन्द्रप्रियाधीरा घोरसंसारतारिणि राधे राधे राधे राधे नमो दीनकृपालिनि ॥
    ५॥ कृष्णयोगप्रदर्शिनि कृष्णसुखप्रदायिनि जितेन्द्रिया यज्ञरूपा श्रीकृष्णयज्ञकारिणि । त्रैलोक्यलोकतारिणि
    जननीलोकपालिनि राधे राधे राधे राधे नमो दीनकृपालिनि ॥ ६॥ कृष्णप्राणप्रियाराधे कृष्णसेवाप्रदायिनि निष्कलङ्का
    नित्यरूपा कृष्णभावेआह्ल्लादिनि । यशोदानन्ददायिनि नीलपद्मविधारिणि राधे राधे राधे राधे नमो दीनकृपालिनि
    ॥ ७॥ श्रीकृष्णचित्तमोहिनि कृष्णभावप्रदायिनि पद्मगन्धा पद्महस्ता पद्ममाला
