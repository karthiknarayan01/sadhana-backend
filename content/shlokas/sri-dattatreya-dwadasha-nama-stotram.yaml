id: sri-dattatreya-dwadasha-nama-stotram
category: stotram
name:
  english: Sri Dattatreya Dwadasha Nama Stotram
content:
  english: asya shridattatreya dvadashanama stotramantrasya paramahamsa rishih shridattatreya paramatma
    devata anushtupchandah sakalakamanasiddhyarthe jape viniyogah | prathamastu mahayogi dvitiyah prabhurishvarah
    | tritiyashca trimurtishca caturtho jnanasagarah || || pancamo jnanavijnanam shashthasyat sarvamangalam
    | saptamo pundarikaksho ashtamo devavallabhah || || navamo nandadevesho dashamo nandadayakah | ekadasho
    maharudro dvadasho karunakarah || || etani dvadashanamani dattatreya mahatmanah | mantrarajeti vikhyatam
    dattatreya harah parah || || kshayopasmara kushthadi tapajvaranivaranam | rajadvare pade ghore sangrameshu
    jalantare || || gire guhantare'ranye vyaghracorabhayadishu | avartane sahasreshu labhate vanchitam
    phalam || || trikale yah pathennityam mokshasiddhimavapnuyat | dattatreya sada rakshet yada satyam
    na samshayah || || vidyarthi labhate vidyam rogi rogat pramucyate | aputro labhate putram daridro
    labhate dhanam || || abharyo labhate bharyam sukharthi labhate sukham | mucyate sarvapapebhyo sarvatra
    vijayi bhavet || || iti shri dattatreya dvadashanama stotram |
  devanagari: अस्य श्रीदत्तात्रेय द्वादशनाम स्तोत्रमन्त्रस्य परमहंस ऋषिः श्रीदत्तात्रेय परमात्मा देवता
    अनुष्टुप्छन्दः सकलकामनासिद्ध्यर्थे जपे विनियोगः । प्रथमस्तु महायोगी द्वितीयः प्रभुरीश्वरः । तृतीयश्च
    त्रिमूर्तिश्च चतुर्थो ज्ञानसागरः ॥ ॥ पञ्चमो ज्ञानविज्ञानं षष्ठस्यात् सर्वमङ्गलम् । सप्तमो पुण्डरीकाक्षो
    अष्टमो देववल्लभः ॥ ॥ नवमो नन्ददेवेशो दशमो नन्ददायकः । एकादशो महारुद्रो द्वादशो करुणाकरः ॥ ॥ एतानि
    द्वादशनामानि दत्तात्रेय महात्मनः । मन्त्रराजेति विख्यातं दत्तात्रेय हरः परः ॥ ॥ क्षयोपस्मार कुष्ठादि
    तापज्वरनिवारणम् । राजद्वारे पदे घोरे सङ्ग्रामेषु जलान्तरे ॥ ॥ गिरे गुहान्तरेऽरण्ये व्याघ्रचोरभयादिषु
    । आवर्तने सहस्रेषु लभते वाञ्छितं फलम् ॥ ॥ त्रिकाले यः पठेन्नित्यं मोक्षसिद्धिमवाप्नुयात् । दत्तात्रेय
    सदा रक्षेत् यदा सत्यं न संशयः ॥ ॥ विद्यार्थी लभते विद्यां रोगी रोगात् प्रमुच्यते । अपुत्रो लभते पुत्रं
    दरिद्रो लभते धनम् ॥ ॥ अभार्यो लभते भार्यां सुखार्थी लभते सुखम् । मुच्यते सर्वपापेभ्यो सर्वत्र विजयी
    भवेत् ॥ ॥ इति श्री दत्तात्रेय द्वादशनाम स्तोत्रम् ।
