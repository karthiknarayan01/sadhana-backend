id: nrisimhottaratapaniyopanishada
category: upanishad
name:
  english: nrisimhottaratapaniyopanishada
  devanagari: नृसिंहोत्तरतापनीयोपनिषद
content:
  english: dathaitamevamatmanam paramam brahmonkaram turiyonkaragravidyotam pranavena samcintyanushtubha
    natva saccidanandapurnatmasu navatmakam saccidanandapurnatmanam param brahma sambhavyahamityatmanamadaya
    manasa brahmanaikikuryadyadanushtubhaiva va esha upavasannesha hi sarvatra sarvada sarvatma san sarvamatti
    nrisimho'sau parameshvaro'sau hi sarvatra sarvada sarvatma santsarvamatti nrisimha evaikala esha turiya
    esha evogra esha eva vira esha eva mahanesha eva vishnuresha eva jvalannesha eva sarvatomukha esha
    esha nrisimha esha eva bhishana esha eva bhadra esha eva mrityumrityuresha eva namamyesha evahamevam
    yogarudho brahmanyevanushtubham sandadhyadonkara iti||tadetau shlokau bhavatah|| samstabhya simha
    svasutangunarthansamyojya shringairrishabhasya hatva|| vashyam sphurantimasatim nipidya sambhakshya
    simhena sa esha virah|| shringaprotanpadansprishtva hatva tanagrasatsvayam| natva ca bahudha drishtva
    nrisimhah svayamudbabhaviti|| iti caturthah khandah||4|| athaisha u eva akara aptatamartha atmanyeva
    nrisimhe deve brahmani vartata esha hyevaptatama esha hi sakshyesha ishvarastatsarvagato nahidam sarvamesha
    hi vyaptatamaidam sarvam yadayamatma mayamatra esha evogra esha hi vyaptatama esha eva vira esha hi
    vyaptatama esha eva mahanesha hi vyaptatama esha eva vishnuresha hi vyaptatama esha eva jvalannesha
    hi vyaptatama esha eva sarvatomukha esha hi vyaptatama esha eva nrisimha esha hi vyaptatama esha eva
    bhishana esha hi vyaptatama esha eva bhadra esha hi vyaptatama esha eva mrityumrityuresha hi vyaptatama
    esha eva namamyesha hi vyaptatama esha evahamesha hi vyaptatama atmaiva nrisimho devo brahma bhavati
    ya evam veda so'kamo nishkama aptakama atmakamena tasya prana utkramantyatraiva samavaliyante brahmaiva
    sanbrahmapyetyathaisha evonkara utkrishtatamartha atmanyeva nrisimhe deve brahmani vartate tasmadesha
    satyasvarupo na hyanyadastyaprameyamanatmaprakashamesha hi svaprakasho'sango'nyanna vikshata atmato
    nanyatha praptiratmamatram hyetadutkrishtamesha evogra esha hyevotkrishta esha eva vishnuresha hyevotkrishta
    esha eva jvalannesha hyevotkrishta esha eva sarvatomukha esha hyevotkrishta esha eva nrisimha esha
    hyevotkrishta esha eva bhishana esha hyevotkrishta esha eva bhadra esha hyevotkrishta esha eva mrityumrityuresha
    hyevotkrishta esha eva namamyesha hyevotkrishta esha evahamesha hyevotkrishtastasmadatmanamevainam
    janiyadatmaiva nrisimho devo brahma bhavati ya evam veda so'kamo nishkama aptakama atmakamo na tasya
    prana utkramantyatraiva samavaliyante brahmaiva sanbrahmapyetyathaisha eva makaro mahavibhutyartha
    atmanyaiva nrisimhe deve brahmani vartate tasmadayamanalpo bhinnarupah svaprakasho brahmaivaptatama
    utkrishtatama etadeva brahmapi sarvajnam mahamayam mahavibhutyetadevogrametaddhi mahavibhutyetadeva
    virametaddhi mahavibhutyatadeva mahadetaddhi mahavibhutyetadeva vishnvetaddhi mahavibhutyetadeva jvaladetaddhi
    mahavibhutyetadeva sarvatomukhametaddhi mahavibhutyetadeva nrisimhametaddhi mahavibhutyetadeva bhishanametaddhi
    mahavibhutyetadeva bhadrametaddhi mahavibhutyetadeva mrityumrityvetaddhi mahavibhutyetadeva namamyetaddhi
    mahavibhutyetadevahametaddhi mahavibhuti tasmadakarokarabhyamimamatmanamaptatamamutkrishtatamam cinmatram
    sarvadrashtaram sarvasakshinam sarvagrasam sarvapremaspadam saccidanandamatramekarasam purato'smatsarvasmatsuvibhatamanvishyaptatamamutkrishtatamam
    mahamayam mahavibhuti saccidanandamatramekarasam purameva brahma makarena janiyadatmaiva nrisimho
    devah parameva brahma bhavati ya evam veda so'kamo nishkama aptakama atmakamo na tasya prana utkramantyatraiva
    samavaliyante brahmaiva sanbrahmapyetiti ha prajapatiruvaca prajapatiruvaca|| iti pancamah khandah||5||
    te deva imamatmanam jnatumaicchamstanhasurah papma parijagraha ta aikshantahantainamasuram papmanam
    grasama ityetamevonkaragravidyotam turiyaturiyamatmanamugramanugram viramaviram mahantamamahantam
    vishnumavishnum jvalantamajvalantam sarvatomukhamasarvatomukham nrisimhamanrisimham bhishanamabhishanam
    bhadramabhadram mrityumrityumamrityumrityum namamyanamamyahamanaham nrisimhanushtubhaiva bubudhire
    tebhyo hasavasurah papma saccidanandaghanajyotirabhavattasmadapakvakashaya imamevonkaragravidyotam
    turiyaturiyamatmanam nrisimhanushtubhaiva janiyattasyasurah papma saccidanandaghanajyotirbhavati te
    deva jyotiruttitirshavo dvitiyadbhayameva pashyanta imamevonkaragravidyotam turiyaturiyamatmanamanushtubhanvishya
    pranavenaiva tasminnavasthitastebhyastajjyotirasya sarvasya puratah suvibhatamavibhatamadvaitamacintyamalingam
    svaprakashamanandaghanam shunyamabhavadevamvitsvaprakasham parameva brahma bhavati te devah putraishanayashca
    vittaishanayashca lokaishanayashca sasadhanebhyo vyutthaya nirakara nishparigraha ashikha ayajnopavita
    andha badhira mugdhah kliba muka unmatta iva parivartamanah shanta danta uparatastitikshavah samahita
    atmarataya atmakrida atmamithuna atmanandah pranavameva param brahmatmaprakasham shunyam janantastatraiva
    parisamaptastasmaddevanam vratamacarannonkare pare brahmani paryavasito bhavetsa atmanyevatmanam param
    brahma pashyati|| tadesha shlokah|| shringeshvashringam samyojya simham shringeshu yojayet| shringabhyam
    shringamabadhya trayo deva upasata iti|| iti shashthah khandah||6|| deva ha vai prajapatimabruvan
    bhuya eva no bhagavanvijnapayatviti tathetyajatvadamaratvada
  devanagari: दथैतमेवमात्मानं परमं ब्रह्मोङ्कारं तुरीयोङ्काराग्रविद्योतं प्रणवेन संचिन्त्यानुष्टुभा नत्वा
    सच्चिदानन्दपूर्णात्मसु नवात्मकं सच्चिदानन्दपूर्णात्मानं परं ब्रह्म संभाव्याहमित्यात्मानमादाय मनसा
    ब्रह्मणैकीकुर्याद्यदनुष्टुभैव वा एष उपवसन्नेष हि सर्वत्र सर्वदा सर्वात्मा सन् सर्वमत्ति नृसिंहोऽसौ
    परमेश्वरोऽसौ हि सर्वत्र सर्वदा सर्वात्मा सन्त्सर्वमत्ति नृसिंह एवैकल एष तुरीय एष एवोग्र एष एव वीर
    एष एव महानेष एव विष्णुरेष एव ज्वलन्नेष एव सर्वतोमुख एष एष नृसिंह एष एव भीषण एष एव भद्र एष एव मृत्युमृत्युरेष
    एव नमाम्येष एवाहमेवं योगारूढो ब्रह्मण्येवानुष्टुभं सन्दध्यादोङ्कार इति॥तदेतौ श्लोकौ भवतः॥ संस्तभ्य
    सिंह स्वसुतान्गुणार्थान्संयोज्य शृङ्गैरृषभस्य हत्वा॥ वश्यां स्फुरन्तीमसतीं निपीड्य संभक्ष्य सिंहेन
    स एष वीरः॥ शृङ्गप्रोतान्पादान्स्पृष्ट्वा हत्वा तानग्रसत्स्वयम्। नत्वा च बहुधा दृष्ट्वा नृसिंहः स्वयमुद्बभाविति॥
    इति चतुर्थः खण्डः॥४॥ अथैष उ एव अकार आप्ततमार्थ आत्मन्येव नृसिंहे देवे ब्रह्मणि वर्तत एष ह्येवाप्ततम
    एष हि साक्ष्येष ईश्वरस्तत्सर्वगतो नहीदं सर्वमेष हि व्याप्ततमैदं सर्वं यदयमात्मा मायामात्र एष एवोग्र
    एष हि व्याप्ततम एष एव वीर एष हि व्याप्ततम एष एव महानेष हि व्याप्ततम एष एव विष्णुरेष हि व्याप्ततम एष
    एव ज्वलन्नेष हि व्याप्ततम एष एव सर्वतोमुख एष हि व्याप्ततम एष एव नृसिंह एष हि व्याप्ततम एष एव भीषण
    एष हि व्याप्ततम एष एव भद्र एष हि व्याप्ततम एष एव मृत्युमृत्युरेष हि व्याप्ततम एष एव नमाम्येष हि व्याप्ततम
    एष एवाहमेष हि व्याप्ततम आत्मैव नृसिंहो देवो ब्रह्म भवति य एवं वेद सोऽकामो निष्काम आप्तकाम आत्मकामेन
    तस्य प्राणा उत्क्रामन्त्यत्रैव समवलीयन्ते ब्रह्मैव सन्ब्रह्माप्येत्यथैष एवोङ्कार उत्कृष्टतमार्थ आत्मन्येव
    नृसिंहे देवे ब्रह्मणि वर्तते तस्मादेष सत्यस्वरूपो न ह्यन्यदस्त्यप्रमेयमनात्मप्रकाशमेष हि स्वप्रकाशोऽसङ्गोऽन्यन्न
    वीक्षत आत्मातो नान्यथा प्राप्तिरात्ममात्रं ह्येतदुत्कृष्टमेष एवोग्र एष ह्येवोत्कृष्ट एष एव विष्णुरेष
    ह्येवोत्कृष्ट एष एव ज्वलन्नेष ह्येवोत्कृष्ट एष एव सर्वतोमुख एष ह्येवोत्कृष्ट एष एव नृसिंह एष ह्येवोत्कृष्ट
    एष एव भीषण एष ह्येवोत्कृष्ट एष एव भद्र एष ह्येवोत्कृष्ट एष एव मृत्युमृत्युरेष ह्येवोत्कृष्ट एष एव
    नमाम्येष ह्येवोत्कृष्ट एष एवाहमेष ह्येवोत्कृष्टस्तस्मादात्मानमेवैनं जानीयादात्मैव नृसिंहो देवो ब्रह्म
    भवति य एवं वेद सोऽकामो निष्काम आप्तकाम आत्मकामो न तस्य प्राणा उत्क्रामन्त्यत्रैव समवलीयन्ते ब्रह्मैव
    सन्ब्रह्माप्येत्यथैष एव मकारो महाविभूत्यर्थ आत्मन्यैव नृसिंहे देवे ब्रह्मणि वर्तते तस्मादयमनल्पो भिन्नरूपः
    स्वप्रकाशो ब्रह्मैवाप्ततम उत्कृष्टतम एतदेव ब्रह्मापि सर्वज्ञं महामायं महाविभूत्येतदेवोग्रमेतद्धि महाविभूत्येतदेव
    वीरमेतद्धि महाविभूत्यतदेव महदेतद्धि महाविभूत्येतदेव विष्ण्वेतद्धि महाविभूत्येतदेव ज्वलदेतद्धि महाविभूत्येतदेव
    सर्वतोमुखमेतद्धि महाविभूत्येतदेव नृसिंहमेतद्धि महाविभूत्येतदेव भीषणमेतद्धि महाविभूत्येतदेव भद्रमेतद्धि
    महाविभूत्येतदेव मृत्युमृत्य्वेतद्धि महाविभूत्येतदेव नमाम्येतद्धि महाविभूत्येतदेवाहमेतद्धि महाविभूति
    तस्मादकारोकाराभ्यामिममात्मानमाप्ततममुत्कृष्टतमं चिन्मात्रं सर्वद्रष्टारं सर्वसाक्षिणं सर्वग्रासं सर्वप्रेमास्पदं
    सच्चिदानन्दमात्रमेकरसं पुरतोऽस्मात्सर्वस्मात्सुविभातमन्विष्याप्ततममुत्कृष्टतमं महामायं महाविभूति सच्चिदानन्दमात्रमेकरसं
    पुरमेव ब्रह्म मकारेण जानीयादात्मैव नृसिंहो देवः परमेव ब्रह्म भवति य एवं वेद सोऽकामो निष्काम आप्तकाम
    आत्मकामो न तस्य प्राणा उत्क्रामन्त्यत्रैव समवलीयन्ते ब्रह्मैव सन्ब्रह्माप्येतीति ह प्रजापतिरुवाच प्रजापतिरुवाच॥
    इति पञ्चमः खण्डः॥५॥ ते देवा इममात्मानं ज्ञातुमैच्छंस्तान्हासुरः पाप्मा परिजग्राह त ऐक्षन्तहन्तैनमासुरं
    पाप्मानं ग्रसाम इत्येतमेवोङ्काराग्रविद्योतं तुरीयतुरीयमात्मानमुग्रमनुग्रं वीरमवीरं महान्तममहान्तं
    विष्णुमविष्णुं ज्वलन्तमज्वलन्तं सर्वतोमुखमसर्वतोमुखं नृसिंहमनृसिंहं भीषणमभीषणं भद्रमभद्रं मृत्युमृत्युममृत्युमृत्युं
    नमाम्यनमाम्यहमनहं नृसिंहानुष्टुभैव बुबुधिरे तेभ्यो हासावासुरः पाप्मा सच्चिदानन्दघनज्योतिरभवत्तस्मादपक्वकषाय
    इममेवोङ्काराग्रविद्योतं तुरीयतुरीयमात्मानं नृसिंहानुष्टुभैव जानीयात्तस्यासुरः पाप्मा सच्चिदानन्दघनज्योतिर्भवति
    ते देवा ज्योतिरुत्तितीर्षवो द्वितीयाद्भयमेव पश्यन्त इममेवोङ्काराग्रविद्योतं तुरीयतुरीयमात्मानमनुष्टुभान्विष्य
    प्रणवेनैव तस्मिन्नवस्थितास्तेभ्यस्तज्ज्योतिरस्य सर्वस्य पुरतः सुविभातमविभातमद्वैतमचिन्त्यमलिङ्गं स्वप्रकाशमानन्दघनं
    शून्यमभवदेवंवित्स्वप्रकाशं परमेव ब्रह्म भवति ते देवाः पुत्रैषणायाश्च वित्तैषणायाश्च लोकैषणायाश्च ससाधनेभ्यो
    व्युत्थाय निराकारा निष्परिग्रहा अशिखा अयज्ञोपवीता अन्धा बधिरा मुग्धाः क्लीबा मूका उन्मत्त इव परिवर्तमानाः
    शान्ता दान्ता उपरतास्तितिक्षवः समाहिता आत्मरतय आत्मक्रीडा आत्ममिथुना आत्मानन्दाः प्रणवमेव परं ब्रह्मात्मप्रकाशं
    शून्यं जानन्तस्तत्रैव परिसमाप्तास्तस्माद्देवानां व्रतमाचरन्नोङ्कारे परे ब्रह्मणि पर्यवसितो भवेत्स
    आत्मन्येवात्मानं परं ब्रह्म पश्यति॥ तदेष श्लोकः॥ शृङ्गेश्वशृङ्गं संयोज्य सिंहं शृङ्गेषु योजयेत्। शृङ्गाभ्यां
    शृङ्गमाबध्य त्रयो देव उपासत इति॥ इति षष्ठः खण्डः॥६॥ देवा ह वै प्रजापतिमब्रुवन् भूय एव नो भगवान्विज्ञापयत्विति
    तथेत्यजत्वादमरत्वाद
