id: devaihkritam05vishnustotram
category: stotram
name:
  english: devaihkritam05vishnustotram
  devanagari: देवैःकृतं०५विष्णुस्तोत्रम्
content:
  english: 41|| putramitrakalatradisamyuta viharamahe | iti naradapurane uttarabhage dvatrimshadhyayantargatam
    devaih kritam vishnustotram samaptam | brihannaradiyapurana | uttarabhaga | adhyaya 32
  devanagari: ४१॥ पुत्रमित्रकलत्रादिसंयुता विहरामहे । इति नारदपुराणे उत्तरभागे द्वात्रिंशाध्यायान्तर्गतं
    देवैः कृतं विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । उत्तरभाग । अध्याय ३२
meaning: {}
