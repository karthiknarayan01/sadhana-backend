id: durvasasakritamshrikrishnastotram
category: stotram
name:
  english: durvasasakritamshrikrishnastotram
  devanagari: दुर्वाससाकृतंश्रीकृष्णस्तोत्रम्
content:
  english: durvasasa kritam 1 shrikrishnastotram svastyastu bhavate krishna jagatam svasti sarvada | kim
    nu nama jagannatha duhsadhyam tava keshava || 1|| trilokesha tridhamasi sargasamharakarakah | devanamapi
    devesha sarvatra samadarshanah || 2|| vishno deva hare krishna namaste cakrapanaye | namah svabhavashuddhaya
    shuddhaya niyataya ca || 3|| shabdagocara devesha namaste bhaktavatsala | ajnanadatha va jnanadyanmayoktam
    kshamasva tat || 4|| tvamevaham jagannatha navayorantaram prithak | atah kshamasva bhagavan kshamasara
    hi sadhavah || 5|| iti harivamshantargatam durvasasa kritam shrikrishnastotram sampurnam | harivamsha
    | anubandha
  devanagari: दुर्वाससा कृतं १ श्रीकृष्णस्तोत्रम् स्वस्त्यस्तु भवते कृष्ण जगतां स्वस्ति सर्वदा । किं नु
    नाम जगन्नाथ दुःसाध्यं तव केशव ॥ १॥ त्रिलोकेश त्रिधामासि सर्गसंहारकारकः । देवानामपि देवेश सर्वत्र समदर्शनः
    ॥ २॥ विष्णो देव हरे कृष्ण नमस्ते चक्रपाणये । नमः स्वभावशुद्धाय शुद्धाय नियताय च ॥ ३॥ शब्दागोचर देवेश
    नमस्ते भक्तवत्सल । अज्ञानादथ वा ज्ञानाद्यन्मयोक्तं क्षमस्व तत् ॥ ४॥ त्वमेवाहं जगन्नाथ नावयोरन्तरं
    पृथक् । अतः क्षमस्व भगवन् क्षमासारा हि साधवः ॥ ५॥ इति हरिवंशान्तर्गतं दुर्वाससा कृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । हरिवंश । अनुबन्ध
meaning: {}
