id: tulasikavacam-2-vriddhapadmatah-kavacam-tava
category: kavacha
name:
  english: tulasikavacam 2 (vriddhapadmatah kavacam tava)
  devanagari: तुलसीकवचम् २ (वृद्धपाद्मतः कवचं तव)
content:
  english: tulasikavacam 2 kavacam tava vakshyami bhavasankramanashanam | yasya japena siddhyanti sarvartha
    natiyatnatah || 1|| tulasi patu me nityam shirovaktroshthanasikah | shrotranetralalatam ca bhrukapolam
    nirantaram || 2|| shrisakhi patu me kantham bhujau vakshashca kakshakam | prishtham ca pitharam sarvam
    stanam janu ca hrittatam || 3|| shubha patudaram nabhim parshvam hastangulim tatha | jatharam vahnimakhilam
    gudam jaghanaguhyakam || 4|| papaharinyavatu me uru sphinmamsajanukam | punyada'vatu me janghe padau
    naradasevita || 5|| yaduktam yacca noktam me yadbahyam yattathantaram | sarvangam patu me devi narayanamanah
    priya || 6|| itidam kavacam divyam tulasyah sarvasiddhikrit | trisandhyam yo japettasya shrirvidya''yushca
    vardhate || 7|| pracih shad vilikhedrekhah udicim panca caiva hi | sankhyanam vimshatistatra koshthanam
    tu bhavishyati || 8|| koshthe koshthe likhetpadam mantrasyasya yathakramam | bhurje rocanaya vidvan
    koshtham kunkumamishraya || 9|| yasya yantramidam murdhni bhuje kanthe'thava bhavet | sangrame vyavahare
    ca coravyaghrabhayeshu ca || 10|| maribhaye varshabhaye nirghata bhayapidite | kshayapasmarapidasu
    sarpavrishcikalula
  devanagari: तुलसीकवचम् २ कवचं तव वक्ष्यामि भवसङ्क्रमनाशनम् । यस्य जापेन सिद्ध्यन्ति सर्वार्था नातियत्नतः
    ॥ १॥ तुलसी पातु मे नित्यं शिरोवक्त्रोष्ठनासिकाः । श्रोत्रनेत्रललाटं च भ्रूकपोलं निरन्तरम् ॥ २॥ श्रीसखी
    पातु मे कण्ठं भुजौ वक्षश्च कक्षकम् । पृष्ठं च पिठरं सर्वं स्तनं जानू च हृत्तटम् ॥ ३॥ शुभा पातूदरं
    नाभिं पार्श्वं हस्ताङ्गुलिं तथा । जाठरं वह्निमखिलं गुदं जघनगुह्यकम् ॥ ४॥ पापहारिण्यवतु मे ऊरू स्फिङ्मांसजानुकम्
    । पुण्यदाऽवतु मे जङ्घे पादौ नारदसेविता ॥ ५॥ यदुक्तं यच्च नोक्तं मे यद्बाह्यं यत्तथान्तरम् । सर्वाङ्गं
    पातु मे देवी नारायणमनः प्रिया ॥ ६॥ इतीदं कवचं दिव्यं तुलस्याः सर्वसिद्धिकृत् । त्रिसन्ध्यं यो जपेत्तस्य
    श्रीर्विद्याऽऽयुश्च वर्धते ॥ ७॥ प्राचीः षड् विलिखेद्रेखाः उदीचीं पञ्च चैव हि । सङ्ख्यानां विंशतिस्तत्र
    कोष्ठानां तु भविष्यति ॥ ८॥ कोष्ठे कोष्ठे लिखेत्पादं मन्त्रस्यास्य यथाक्रमम् । भूर्जे रोचनया विद्वान्
    कोष्ठं कुङ्कुममिश्रया ॥ ९॥ यस्य यन्त्रमिदं मूर्ध्नि भुजे कण्ठेऽथवा भवेत् । सङ्ग्रामे व्यवहारे च चोरव्याघ्रभयेषु
    च ॥ १०॥ मारीभये वर्षभये निर्घात भयपीडिते । क्षयापस्मारपीडासु सर्पवृश्चिकलूल
