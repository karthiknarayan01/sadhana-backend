id: tricha-kalpa-surya-namaskara-krama
category: stotram
name:
  english: Tricha Kalpa Surya Namaskara Krama
content:
  english: acamya | prananayamya | deshakalau sankirtya | ganapati puja nkritva | sankalpah purvokta eva
    ngunavisheshana vishishtayam shubhatithau shruti smriti puranokta phalapraptyartham shrisavitrisuryanarayana
    prityartha mbhavishyottarapuranokta tricakalpavidhina ekavrittya namaskarakhya nkarma karishye ||
    dhyanam dhyeya ssada savitrimandalamadhyavarti narayana ssarasijasanasannivishtah | keyurava nmakarakundalavan
    kiriti hari hiranmayavapurdhritashankhacakrah || urasa shirasa drishtya manasa vacasa tatha | padbhya
    mbhurbhuvassuvah | om hram udyannadya mitramahah hram om | mitraya namah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hrim arohannuttara hrim
    om | ravaye namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami ||
    mbhurbhuvassuvah | om hrum hridroga mmama surya hrum om | suryaya namah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hraim harimana nca nashaya
    hraim om | bhanave namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami
    || mbhurbhuvassuvah | om hraum shuke hraum om | khagaya namah | shrisavitrisuryanarayana parabrahmane
    nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hrah ropanaka su dadhmasi hrah om
    | pushne namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah
    | om hram atho haridraveshu me hram om | hiranyagarbhaya namah | shrisavitrisuryanarayana parabrahmane
    nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hrim harimana nnidadhmasi hrim om
    | maricaye namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami ||
    mbhurbhuvassuvah | om hrum udagadayama dityah hrum om | adityaya namah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hraim na sahasa saha
    hraim om | savitre namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami
    || mbhurbhuvassuvah | om hrau randhayann hraum om | arkaya namah | shrisavitrisuryanarayana parabrahmane
    nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hrah mo aha ndvishate radham hrah
    om | bhaskaraya namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami
    || mbhurbhuvassuvah | om hram hrim udyannadya mitramaha arohannuttara hram hrim om | mitraravibhya
    nnamah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah
    | om hrum haim hridroga nca nashaya hrum hraim om | suryabhanubhya nnamah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hraum hra su dadhmasi
    hraum hrah om | khagapushabhya nnamah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran
    samarpayami || mbhurbhuvassuvah | om hram hrim atho haridraveshu me harimana nni dadhmasi hram hrim
    om | hiranyagarbhamaricibhya nnamah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran
    samarpayami || mbhurbhuvassuvah | om hrum hraim udagadayama na sahasa saha hrum hraim om | adityasavitribhya
    nnamah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah
    | om hraum hrah dvishanta ndvishate radham hraum hrah om | arkabhaskarabhya nnamah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hram hrim hrum hraim
    udyannadya mitramaha arohannuttara nca nashaya | hram hrim hrum hraim om | mitraravisuryabhanubhyo
    namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah
    | om hraum hrah hram hrim shuke haridraveshu me harimana nni dadhmasi | hraum hrah hram hrim om |
    khagapushahiranyagarbhamaricibhyo namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran
    samarpayami || mbhurbhuvassuvah | om hrum hraim hraum hrah udagadayama na sahasa saha | dvishanta
    ndvishate radham | hrum hraim hraum hrah om | adityasavitrarkabhaskarebhyo namah | shrisavitrisuryanarayana
    parabrahmane nama ssashtanga namaskaran samarpayami || mbhurbhuvassuvah | om hram hrim hrum hraim
    hraum hrah hram hrim hrum hraim hraum hrah udyannadya mitramaha arohannuttara haridraveshu me harimana
    nni dadhmasi | udagadayama na sahasa saha | dvishanta ndvishate radham | hram hrim hrum hraim hraum
    hrah hram hrim hrum hraim hraum hrah om | mitra ravi surya bhanu khaga pusha hiranyagarbha maricyadityasavitrarka
    bhaskarebhyo namah | shrisavitrisuryanarayana parabrahmane nama ssashtanga namaskaran samarpayami
    || anena maya krita tricakalpanamaskarena bhagavan sarvatmaka shshripadmini usha chaya sameta shrisavitrisuryanarayana
    suprito suprasanno bhavantu ||
  devanagari: आचम्य । प्राणानायम्य । देशकालौ सङ्कीर्त्य । गणपति पूजा ङ्कृत्वा । सङ्कल्पः पूर्वोक्त एव
    ङ्गुणविशेषण विशिष्टायां शुभतिथौ श्रुति स्मृति पुराणोक्त फलप्राप्त्यर्थं श्रीसवितृसूर्यनारायण प्रीत्यर्थ
    म्भविष्योत्तरपुराणोक्त तृचकल्पविधिना एकावृत्त्या नमस्काराख्य ङ्कर्म करिष्ये ॥ ध्यानम् ध्येय स्सदा
    सवितृमण्डलमध्यवर्ती नारायण स्सरसिजासनसन्निविष्टः । केयूरवा न्मकरकुण्डलवान् किरीटी हारी हिरण्मयवपुर्धृतशङ्खचक्रः
    ॥ उरसा शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्या म्भूर्भुव॒स्सुवः॑ । ॐ ह्रां उ॒द्यन्न॒द्य मि॑त्रमहः ह्रां
    ओम् । मित्राय नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ ह्रीं आ॒रोह॒न्नुत्त॑रा॒ ह्रीं ओम् । रवये नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग
    नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रूं हृ॒द्रो॒ग म्मम॑ सूर्य ह्रूं ओम् । सूर्याय नमः ।
    श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रैं
    हरि॒माण ञ्च नाशय ह्रैं ओम् । भानवे नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान्
    समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रौं शुके ह्रौं ओम् । खगाय नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे
    नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रः रोप॒णाका सु दध्मसि ह्रः ओम् । पूष्णे
    नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ
    ह्रां अथो हारिद्र॒वेषु॑ मे ह्रां ओम् । हिरण्यगर्भाय नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग
    नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रीं हरि॒माण॒ न्निद॑ध्मसि ह्रीं ओम् । मरीचये नमः । श्रीसवितृसूर्यनारायण
    परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रूं उद॑गाद॒यमा दि॒त्यः ह्रूं
    ओम् । आदित्याय नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ ह्रैं न॒ सह॑सा स॒ह ह्रैं ओम् । सवित्रे नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान्
    समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रौ र॒न्धय॒न्न्॑ ह्रौं ओम् । अर्काय नमः । श्रीसवितृसूर्यनारायण
    परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रः मो अ॒ह न्द्वि॑ष॒ते र॑धं
    ह्रः ओम् । भास्कराय नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ ह्रां ह्रीं उ॒द्यन्न॒द्य मि॑त्रमह आ॒रोह॒न्नुत्त॑रा॒ ह्रां ह्रीं ओम् । मित्ररविभ्या न्नमः । श्रीसवितृसूर्यनारायण
    परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रूं हैं हृ॒द्रो॒ग ञ्च नाशय
    ह्रूं ह्रैं ओम् । सूर्यभानुभ्या न्नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान्
    समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रौं ह्र सु दध्मसि ह्रौं ह्रः ओम् । खगपूषभ्या न्नमः । श्रीसवितृसूर्यनारायण
    परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रां ह्रीं अथो हारिद्र॒वेषु॑
    मे हरि॒माण॒ न्नि द॑ध्मसि ह्रां ह्रीं ओम् । हिरण्यगर्भमरीचिभ्या न्नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे
    नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रूं ह्रैं उद॑गाद॒यमा न॒ सह॑सा स॒ह ह्रूं
    ह्रैं ओम् । आदित्यसवितृभ्या न्नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि
    ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रौं ह्रः द्वि॒षन्त॒ न्द्वि॑ष॒ते र॑धं ह्रौं ह्रः ओम् । अर्कभास्कराभ्या न्नमः
    । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रां
    ह्रीं ह्रूं ह्रैं उ॒द्यन्न॒द्य मि॑त्रमह आ॒रोह॒न्नुत्त॑रा॒ ञ्च नाशय । ह्रां ह्रीं ह्रूं ह्रैं ओम् ।
    मित्ररविसूर्यभानुभ्यो नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥
    म्भूर्भुव॒स्सुवः॑ । ॐ ह्रौं ह्रः ह्रां ह्रीं शुके हारिद्र॒वेषु॑ मे हरि॒माण॒ न्नि द॑ध्मसि । ह्रौं ह्रः
    ह्रां ह्रीं ओम् । खगपूषहिरण्यगर्भमरीचिभ्यो नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान्
    समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रूं ह्रैं ह्रौं ह्रः उद॑गाद॒यमा न॒ सह॑सा स॒ह । द्वि॒षन्त॒ न्द्वि॑ष॒ते
    र॑धम् । ह्रूं ह्रैं ह्रौं ह्रः ओम् । आदित्यसवित्रर्कभास्करेभ्यो नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे
    नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ म्भूर्भुव॒स्सुवः॑ । ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः ह्रां
    ह्रीं ह्रूं ह्रैं ह्रौं ह्रः उ॒द्यन्न॒द्य मि॑त्रमह आ॒रोह॒न्नुत्त॑रा॒ हारिद्र॒वेषु॑ मे हरि॒माण॒ न्नि
    द॑ध्मसि । उद॑गाद॒यमा न॒ सह॑सा स॒ह । द्वि॒षन्त॒ न्द्वि॑ष॒ते र॑धम् । ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः
    ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः ओम् । मित्र रवि सूर्य भानु खग पूष हिरण्यगर्भ मरीच्यादित्यसवित्रर्क
    भास्करेभ्यो नमः । श्रीसवितृसूर्यनारायण परब्रह्मणे नम स्साष्टाङ्ग नमस्कारान् समर्पयामि ॥ अनेन मया कृत
    तृचाकल्पनमस्कारेण भगवान् सर्वात्मक श्श्रीपद्मिनी उषा छाया समेत श्रीसवितृसूर्यनारायण सुप्रीतो सुप्रसन्नो
    भवन्तु ॥
