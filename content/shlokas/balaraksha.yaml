id: balaraksha
category: raksha
name:
  english: balaraksha
  devanagari: बालरक्षा
content:
  english: shribalaraksha shri ganeshaya namah | avyadajo'nghri manimamstava janvathoru yajno'cyutah katitatam
    jatharam hayasyah | hritkeshavastvadura isha inastu kantham vishnurbhujam mukhamurukrama ishvarah
    kam || 1|| cakryagratah sahagado harirastu pashcat tvatparshvayordhanurasi madhuhajanashca | koneshu
    shankha urugaya uparyupendras tarkshyah kshitau haladharah purushah samantat || 2|| indriyani hrishikeshah
    pranannarayano'vatu | shvetadvipapatishcittam mano yogeshvaro'vatu || 3|| prishnigarbhastu te buddhimatmanam
    bhagavanparah |
  devanagari: श्रीबालरक्षा श्री गणेशाय नमः । अव्यादजोऽङ्घ्रि मणिमांस्तव जान्वथोरू यज्ञोऽच्युतः कटितटं
    जठरं हयास्यः । हृत्केशवस्त्वदुर ईश इनस्तु कण्ठं विष्णुर्भुजं मुखमुरुक्रम ईश्वरः कम् ॥ १॥ चक्र्यग्रतः
    सहगदो हरिरस्तु पश्चात् त्वत्पार्श्वयोर्धनुरसी मधुहाजनश्च । कोणेषु शङ्ख उरुगाय उपर्युपेन्द्रस् तार्क्ष्यः
    क्षितौ हलधरः पुरुषः समन्तात् ॥ २॥ इन्द्रियाणि हृषीकेशः प्राणान्नारायणोऽवतु । श्वेतद्वीपपतिश्चित्तं
    मनो योगेश्वरोऽवतु ॥ ३॥ पृश्निगर्भस्तु ते बुद्धिमात्मानं भगवान्परः ।
