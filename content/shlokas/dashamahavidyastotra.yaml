id: dashamahavidyastotra
category: stotram
name:
  english: dashamahavidyastotra
  devanagari: दशमहाविद्यास्तोत्र
content:
  english: sarvah siddhyanti siddhayah | om namaste candike candi candamundavinashini | namaste kalike
    kalamahabhayavinashini || 1|| shive raksha jagaddhatri prasida haravallabhe | pranamami jagaddhatrim
    jagatpalanakarinim || 2|| jagat kshobhakarim vidyam jagatsrishtividhayinim | karalam vikatam ghoram
    mundamalavibhushitam || 3|| hararcitam hararadhyam namami haravallabham | gaurim gurupriyam gauravarnalankarabhushitam
    || 4|| haripriyam mahamayam namami brahmapujitam | siddham siddheshvarim siddhavidyadharanganairyutam
    || 5|| mantrasiddhipradam yonisiddhidam lingashobhitam | pranamami mahamayam durgam durgatinashinim
    || 6|| ugramugramayimugrataramugraganairyutam | nilam nilaghanashyamam namami nilasundarim || 7||
    shyamangim shyamaghatitam shyamavarnavibhushitam | pranamami jagaddhatrim gaurim sarvarthasadhinim
    || 8|| vishveshvarim mahaghoram vikatam ghoranadinim | adyamadyaguroradyamadyanathaprapujitam || 9||
    shrim durgam dhanadamannapurnam padmam sureshvarim | pranamami jagaddhatrim candrashekharavallabham
    || 10|| tripuram sundarim balamabalaganabhushitam | shivadutim shivaradhyam shivadhyeyam sanatanim
    || 11|| sundarim tarinim sarvashivaganavibhushitam | narayanim vishnupujyam brahmavishnuharapriyam
    || 12|| sarvasiddhipradam nityamanityam gunavarjitam | sagunam nirgunam dhyeyamarcitam sarvasiddhidam
    || 13|| vidyam siddhipradam vidyam mahavidyam maheshvarim | maheshabhaktam maheshim mahakalaprapujitam
    || 14|| pranamami jagaddhatrim shumbhasuravimardinim | raktapriyam raktavarnam raktabijavimardinim
    || 15|| bhairavim bhuvanam devim lolajihvam sureshvarim | caturbhujam dashabhujamashtadashabhujam
    shubham || 16|| tripureshim vishvanathapriyam vishveshvarim shivam | attahasamattahasapriyam dhumravinashinim
    || 17|| kamalam chinnabhalanca matangim surasundarim | shodashim vijayam bhimam dhumanca vagalamukhim
    || 18|| sarvasiddhipradam sarvavidyamantravishodhinim | pranamami jagattaram saranca mantrasiddhaye
    || 19|| ityevanca vararohe stotram siddhikaram param | pathitva mokshamapnoti satyam vai girinandini
    || 20|| kujavare caturdashyamamayam jivavasare | shukre nishigate stotram pathitva mokshamapnuyat
    || tripakshe mantrasiddhi syatstotrapathaddhi shamkari | caturdashyam nishabhage nishi bhaume'shtamidine
    || nishamukhe pathetstotram mantra siddhimavapnuyat | kevalam stotrapathaddhi tantrasiddhiranuttama
    | jagarti satatam candi stavapathadbhujangini ||
  devanagari: सर्वाः सिद्ध्यन्ति सिद्धयः । ॐ नमस्ते चण्डिके चण्डि चण्डमुण्डविनाशिनि । नमस्ते कालिके कालमहाभयविनाशिनि
    ॥ १॥ शिवे रक्ष जगद्धात्रि प्रसीद हरवल्लभे । प्रणमामि जगद्धात्रीं जगत्पालनकारिणीम् ॥ २॥ जगत् क्षोभकरीं
    विद्यां जगत्सृष्टिविधायिनीम् । करालां विकटां घोरां मुण्डमालाविभूषिताम् ॥ ३॥ हरार्चितां हराराध्यां
    नमामि हरवल्लभाम् । गौरीं गुरुप्रियां गौरवर्णालङ्कारभूषिताम् ॥ ४॥ हरिप्रियां महामायां नमामि ब्रह्मपूजिताम्
    । सिद्धां सिद्धेश्वरीं सिद्धविद्याधरङ्गणैर्युताम् ॥ ५॥ मन्त्रसिद्धिप्रदां योनिसिद्धिदां लिङ्गशोभिताम्
    । प्रणमामि महामायां दुर्गां दुर्गतिनाशिनीम् ॥ ६॥ उग्रामुग्रमयीमुग्रतारामुग्रगणैर्युताम् । नीलां नीलघनश्यामां
    नमामि नीलसुन्दरीम् ॥ ७॥ श्यामाङ्गीं श्यामघटितां श्यामवर्णविभूषिताम् । प्रणमामि जगद्धात्रीं गौरीं सर्वार्थसाधिनीम्
    ॥ ८॥ विश्वेश्वरीं महाघोरां विकटां घोरनादिनीम् । आद्यामाद्यगुरोराद्यामाद्यनाथप्रपूजिताम् ॥ ९॥ श्रीं
    दुर्गां धनदामन्नपूर्णां पद्मां सुरेश्वरीम् । प्रणमामि जगद्धात्रीं चन्द्रशेखरवल्लभाम् ॥ १०॥ त्रिपुरां
    सुन्दरीं बालामबलागणभूषिताम् । शिवदूतीं शिवाराध्यां शिवध्येयां सनातनीम् ॥ ११॥ सुन्दरीं तारिणीं सर्वशिवागणविभूषिताम्
    । नारायणीं विष्णुपूज्यां ब्रह्मविष्णुहरप्रियाम् ॥ १२॥ सर्वसिद्धिप्रदां नित्यामनित्यां गुणवर्जिताम्
    । सगुणां निर्गुणां ध्येयामर्चितां सर्वसिद्धिदाम् ॥ १३॥ विद्यां सिद्धिप्रदां विद्यां महाविद्यां महेश्वरीम्
    । महेशभक्तां माहेशीं महाकालप्रपूजिताम् ॥ १४॥ प्रणमामि जगद्धात्रीं शुम्भासुरविमर्दिनीम् । रक्तप्रियां
    रक्तवर्णां रक्तबीजविमर्दिनीम् ॥ १५॥ भैरवीं भुवनां देवीं लोलजिह्वां सुरेश्वरीम् । चतुर्भुजां दशभुजामष्टादशभुजां
    शुभाम् ॥ १६॥ त्रिपुरेशीं विश्वनाथप्रियां विश्वेश्वरीं शिवाम् । अट्टहासामट्टहासप्रियां धूम्रविनाशिनीम्
    ॥ १७॥ कमलां छिन्नभालाञ्च मातङ्गीं सुरसुन्दरीम् । षोडशीं विजयां भीमां धूमाञ्च वगलामुखीम् ॥ १८॥ सर्वसिद्धिप्रदां
    सर्वविद्यामन्त्रविशोधिनीम् । प्रणमामि जगत्तारां साराञ्च मन्त्रसिद्धये ॥ १९॥ इत्येवञ्च वरारोहे स्तोत्रं
    सिद्धिकरं परम् । पठित्वा मोक्षमाप्नोति सत्यं वै गिरिनन्दिनि ॥ २०॥ कुजवारे चतुर्दश्याममायां जीववासरे
    । शुक्रे निशिगते स्तोत्रं पठित्वा मोक्षमाप्नुयात् ॥ त्रिपक्षे मन्त्रसिद्धि स्यात्स्तोत्रपाठाद्धि शंकरि
    । चतुर्दश्यां निशाभागे निशि भौमेऽष्टमीदिने ॥ निशामुखे पठेत्स्तोत्रं मन्त्र सिद्धिमवाप्नुयात् । केवलं
    स्तोत्रपाठाद्धि तन्त्रसिद्धिरनुत्तमा । जागर्ति सततं चण्डी स्तवपाठाद्भुजङ्गिनी ॥
