id: bhrigumaharshikritamkarunabhyudayamnamashivastotram
category: stotram
name:
  english: bhrigumaharshikritamkarunabhyudayamnamashivastotram
  devanagari: भृगुमहर्षिकृतंकरुणाभ्युदयंनामशिवस्तोत्रम्
content:
  english: bhrigumaharshikritam karunabhyudayam nama shivastotram bhriguruvaca | pranipatya bhutanatham
    bhavodbhavam tvamaham divyarupam | bhavatito bhuvanapate prabho tu vijnapaye kincit || 34|| tvadgunanikaranvaktum
    kah shakto bhavati manusho nama | vasukirapi hi kadacidvadanasahasram bhavedyasya || 35|| bhaktya
    tatha'pi shankara bhuvanapate tvatstutau mukharah | vadatah kshamasva bhagavanprasida me tava caranapatitasya
    || 36|| sattvam rajastamastvam sthityutpattyorvinashane deva | tvam muktva bhuvanapate bhuvaneshvara
    naiva daivatam kincit || 37|| yamaniyamayajnadanavedabhyasashca dharana yogah | tvadbhakteh sarvamidam
    narhati hi kalasahasramsham || 38|| ucchishtarasarasayanakhadganjanapadukavivarasiddhirva | cihnam
    bhavavratanam drishyati ceha janmani prakatam || 39|| shathyena namati yadyapi dadasi tvam bhutimicchato
    deva | bhaktirbhavabhedakari mokshaya vinirmita natha || 40|| paradaraparasvaratam paraparibhavaduhkhashokasantaptam
    | paravadanavikshanaparam parameshvaram mam paritrahi || 41|| mithyabhimanadagdham kshanabhanguradehavilasitam
    kruram | kupathabhimukham patitam tvam mam papatparitrahi || 42|| dine dvijaganasarthe bandhujanenaiva
    dushita hyasha | trishna tatha'pi shankara kim mudham mam vidambayati || 43|| trishnam harasva shighram
    lakshmim pradatsva yavadasinim nityam | chindhi madamohapashanuttaraya mam mahadeva || 44|| karunabhyudayam
    nama stotramidam sarvasiddhidam divyam | yah pathati bhaktiyuktastasya tushyedbhrigoryatha ca shivah
    || 45|| iti matsyapurane trinavatyadhikashatatamadhyayantargatam bhrigumaharshikritam karunabhyudayam
    nama shivastotram samaptam | matsyapurana | adhyaya 193
  devanagari: भृगुमहर्षिकृतं करुणाभ्युदयं नाम शिवस्तोत्रम् भृगुरुवाच । प्रणिपत्य भूतनाथं भवोद्भवं त्वामहं
    दिव्यरूपम् । भवातीतो भुवनपते प्रभो तु विज्ञापये किञ्चित् ॥ ३४॥ त्वद्गुणनिकरान्वक्तुं कः शक्तो भवति
    मानुषो नाम । वासुकिरपि हि कदाचिद्वदनसहस्रं भवेद्यस्य ॥ ३५॥ भक्त्या तथाऽपि शङ्कर भुवनपते त्वत्स्तुतौ
    मुखरः । वदतः क्षमस्व भगवन्प्रसीद मे तव चरणपतितस्य ॥ ३६॥ सत्त्वं रजस्तमस्त्वं स्थित्युत्पत्त्योर्विनाशने
    देव । त्वां मुक्त्वा भुवनपते भुवनेश्वर नैव दैवतं किञ्चित् ॥ ३७॥ यमनियमयज्ञदानवेदाभ्यासाश्च धारणा योगः
    । त्वद्भक्तेः सर्वमिदं नार्हति हि कलासहस्रांशम् ॥ ३८॥ उच्छिष्टरसरसायनखड्गाञ्जनपादुकाविवरसिद्धिर्वा
    । चिह्नं भवव्रतानां दृश्यति चेह जन्मनि प्रकटम् ॥ ३९॥ शाठ्येन नमति यद्यपि ददासि त्वं भूतिमिच्छतो देव
    । भक्तिर्भवभेदकरी मोक्षाय विनिर्मिता नाथ ॥ ४०॥ परदारपरस्वरतं परपरिभवदुःखशोकसन्तप्तम् । परवदनवीक्षणपरं
    परमेश्वरं मां परित्राहि ॥ ४१॥ मिथ्याभिमानदग्धं क्षणभङ्गुरदेहविलसितं क्रूरम् । कुपथाभिमुखं पतितं त्वं
    मां पापात्परित्राहि ॥ ४२॥ दीने द्विजगणसार्थे बन्धुजनेनैव दूषिता ह्याशा । तृष्णा तथाऽपि शङ्कर किं मूढं
    मां विडम्बयति ॥ ४३॥ तृष्णां हरस्व शीघ्रं लक्ष्मीं प्रदत्स्व यावदासिनीं नित्यम् । छिन्धि मदमोहपाशानुत्तारय
    मां महादेव ॥ ४४॥ करुणाभ्युदयं नाम स्तोत्रमिदं सर्वसिद्धिदं दिव्यम् । यः पठति भक्तियुक्तस्तस्य तुष्येद्भृगोर्यथा
    च शिवः ॥ ४५॥ इति मत्स्यपुराणे त्रिनवत्यधिकशततमाध्यायान्तर्गतं भृगुमहर्षिकृतं करुणाभ्युदयं नाम शिवस्तोत्रं
    समाप्तम् । मत्स्यपुराण । अध्याय १९३
