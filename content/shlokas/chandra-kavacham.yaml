id: chandra-kavacham
category: stotram
name:
  english: Chandra Kavacham
content:
  english: asya shri candra kavacasya | gautama rishih | anushtup chandah | shri candro devata | candra
    prityarthe jape viniyogah || dhyanam samam caturbhujam vande keyura makutojvalam | vasudevasya nayanam
    shankarasya ca bhushanam || evam dhyatva japennityam shashinah kavacam shubham || atha candra kavacam
    shashi patu shirodesham bhalam patu kalanidhih | cakshushi candramah patu shruti patu nishapatih ||
    || pranam kshapakarah patu mukham kumudabandhavah | patu kantham ca me somah skandhe jaivatrikastatha
    || || karau sudhakarah patu vakshah patu nishakarah | hridayam patu me candro nabhim shankarabhushanah
    || || madhyam patu surashreshthah katim patu sudhakarah | uru tarapatih patu mriganko januni sada
    || || abdhijah patu me janghe patu padau vidhuh sada | sarvanyanyani cangani patu candrokhilam vapuh
    || || phalashrutih etaddhi kavacam divyam bhukti mukti pradayakam | yah pathecchrinuyadvapi sarvatra
    vijayi bhavet || || || iti shricandra kavacam sampurnam ||
  devanagari: अस्य श्री चन्द्र कवचस्य । गौतम ऋषिः । अनुष्टुप् छन्दः । श्री चन्द्रो देवता । चन्द्र प्रीत्यर्थे
    जपे विनियोगः ॥ ध्यानं समं चतुर्भुजं वन्दे केयूर मकुटोज्वलम् । वासुदेवस्य नयनं शङ्करस्य च भूषणम् ॥
    एवं ध्यात्वा जपेन्नित्यं शशिनः कवचं शुभम् ॥ अथ चन्द्र कवचम् शशी पातु शिरोदेशं भालं पातु कलानिधिः ।
    चक्षुषी चन्द्रमाः पातु श्रुती पातु निशापतिः ॥ ॥ प्राणं क्षपकरः पातु मुखं कुमुदबान्धवः । पातु कण्ठं
    च मे सोमः स्कन्धे जैवातृकस्तथा ॥ ॥ करौ सुधाकरः पातु वक्षः पातु निशाकरः । हृदयं पातु मे चन्द्रो नाभिं
    शङ्करभूषणः ॥ ॥ मध्यं पातु सुरश्रेष्ठः कटिं पातु सुधाकरः । ऊरू तारापतिः पातु मृगाङ्को जानुनी सदा ॥
    ॥ अब्धिजः पातु मे जङ्घे पातु पादौ विधुः सदा । सर्वाण्यन्यानि चाङ्गानि पातु चन्द्रोखिलं वपुः ॥ ॥ फलश्रुतिः
    एतद्धि कवचं दिव्यं भुक्ति मुक्ति प्रदायकम् । यः पठेच्छृणुयाद्वापि सर्वत्र विजयी भवेत् ॥ ॥ ॥ इति श्रीचन्द्र
    कवचं सम्पूर्णम् ॥
