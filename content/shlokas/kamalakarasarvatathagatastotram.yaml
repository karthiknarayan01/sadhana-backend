id: kamalakarasarvatathagatastotram
category: stotram
name:
  english: kamalakarasarvatathagatastotram
  devanagari: कमलाकरसर्वतथागतस्तोत्रम्
content:
  english: kamalakarasarvatathagatastotram atha khalu kamalavane sarvatathagatastavenatitanagatapratyutpannanam
    buddhanam bhagavato'tyastavit ye jinapurvakaye bhavanti ye ca dhriyanti dashadishi loke | tan hi jinamshca
    karomi pranamam tam jinasanghamaham prabhijashye || 1|| shantaprashantavishuddhamunindram svarnasuvarnaprabhasitagatram
    | sarvasurasurasusvaraghosham brahmarutasvaragarjitaghosham || 2|| shatpadabhaumramahiruhakesham nilasukuncitakashanikasham
    | shankhatusharasupandaradantam hemavirajitabhashitanabham || 3|| nilavishalavishuddhasunetram nilamivotpalaphullitakshetram
    | padmasuvarnavibhantasujihvam padmaprabhashitapadmasukhabham || 4|| shankhamrinalanibham sukhatarnam
    dakshinavartitavedulitarnam | sukshmanishakarakshinashashiva matrasumantrasarojasunabham || 5|| kancanakotisuvarnasunasamunnatamridutarapadapapatram
    | agradharagravishishtanasagram mridukarasarvajinam satatam tam || 6|| ekasamekataromamukhagram balasuromapradakshinavartam
    | nilanibhojjvalakundalajatam nilavirajitamaulasugrivam || 7|| jatasamanaprabhashitagatram pujitasarvadashadishi
    loke | duhkhamanantam prashamitalokam sarvasukhena ca tarpitalokam || 8|| narakasthasu ca tiryaggatishu
    pretasurasuramanujagatishu | sarvapishacasukharpitasattvam sarvaprashantamapayagatishu || 9|| varnasuvarnam
    kanakanibhasam kancanataptaprabhasitagatram | saumyashashankasuvimalavaktram vikasitarajitasuvimalavadanam
    || 10|| tarunaruhagrakakomalagatram simhavivadakavikramanadam | lambitahastapralambitabahum marutapreritasalalajihvam
    || 11|| vyomaprabhojjvalamuncitarashmim suryamiva prabhaya pratapantam | nirmalagatravarebhi munindram
    sarvaprabhasitakshetramanantam || 12|| candranishakarabhaskarajalam kshetramanantasahasragateshu |
    te'pi ca nishcitasarvi babhuva buddhaprabhasavirocanatayai || 13|| buddhadivakaralokapradipam buddhadivakararashmisahasram
    | kshetramanantasahasragateshu pashyatu lokatathagatasuryam || 14|| punyashatani sahasra ca kritva
    sarvagunebhiralankritagatram | sauragajendranibham jitabahum vimalarakshitamanditabahum || 15|| bhumitalopama
    shalitatulyam sukshmarajopamamagatabuddhah | sukshmarajopama ye ca bhavanti sukshmarajopama ye tishthanti
    || 16|| tamshca jinan prakaromi pranamam kayena vaca manasa prasanna | pushpapradana sugandhapradanairvarnashatena
    shucishca smarami || 17|| jihvashatairapi buddhagunanam kalpasahasrashatena hi vaktum | ye ca sunirvritasadhujinanam
    sa ca lalata vicitra anekaih || 18|| ekajinasya gunan nahi shakyo jihvasahasrena bhashitu kincit |
    kamamashakti hi sarvajinanamekagunasya hi vistaravaktum || 19|| sarva sadevakuloktasamuhah sarvabhavagra
    bhavajalapurnan | ye jalagrahanatu shakyapramanam naiva tu ekaguna sugatantam || 20|| varnitu sustutamajjinasarvam
    kayatu vaca prasannamanena | prameya sancita punyaphalagram tena ca sattva prabhotu jinatvam || 21||
    eva tu vishvam narapatibuddhameva karomi nripahpranidhanam | yatra ca kutra ci mabhyabhaveta jati
    anagata kalpamananta || 22|| idrishabheri pashyami svapne idrishanadam tatra sha
  devanagari: कमलाकरसर्वतथागतस्तोत्रम् अथ खलु कमलवने सर्वतथागतस्तवेनातीतानागतप्रत्युत्पन्नानां बुद्धानां
    भगवतोऽत्यस्तावीत् ये जिनपूर्वकाये भवन्ति ये च ध्रियन्ति दशदिशि लोके । तान् हि जिनांश्च करोमि प्रणामं
    तं जिनसङ्घमहं प्रभिजष्ये ॥ १॥ शान्तप्रशान्तविशुद्धमुनीन्द्रं स्वर्णसुवर्णप्रभासितगात्रम् । सर्वसुरासुरसुस्वरघोषं
    ब्रह्मरुतस्वरगर्जितघोषम् ॥ २॥ षट्पदभौंरमहीरुहकेशं नीलसुकुञ्चितकाशनिकाशम् । शङ्खतुषारसुपाण्डरदन्तं
    हेमविराजितभाषितनाभम् ॥ ३॥ नीलविशालविशुद्धसुनेत्रं नीलमिवोत्पलफुल्लितक्षेत्रम् । पद्मसुवर्णविभान्तसुजिह्वं
    पद्मप्रभाषितपद्मसुखाभम् ॥ ४॥ शङ्खमृणालनिभं सुखतार्णं दक्षिणवर्तितवेडुलितर्णम् । सूक्ष्मनिशाकरक्षीणशशीव
    मात्रसुमन्त्रसरोजसुनाभम् ॥ ५॥ काञ्चनकोटिसुवर्णसुनासमुन्नतमृदुतरपादपपत्रम् । अग्रधराग्रविशिष्टनासाग्रं
    मृदुकरसर्वजिनं सततं तम् ॥ ६॥ एकसमेकतरोममुखाग्रं बालसुरोमप्रदक्षिणवर्तम् । नीलनिभोज्ज्वलकुण्डलजातं
    नीलविराजितमौलसुग्रीवम् ॥ ७॥ जातसमानप्रभाषितगात्रं पूजितसर्वदशदिशि लोके । दुःखमनन्तं प्रशमितलोकं सर्वसुखेन
    च तर्पितलोकम् ॥ ८॥ नरकस्थासु च तिर्यग्गतिषु प्रेतसुरासुरमनुजगतीषु । सर्वपिशाचसुखार्पितसत्त्वं सर्वप्रशान्तमपायगतीषु
    ॥ ९॥ वर्णसुवर्णं कनकनिभासं काञ्चनतप्तप्रभासितगात्रम् । सौम्यशशाङ्कसुविमलवक्त्रं विकसितराजितसुविमलवदनम्
    ॥ १०॥ तरुणरुहाग्रककोमलगात्रं सिंहविवादकविक्रमनादम् । लम्बितहस्तप्रलम्बितबाहुं मारुतप्रेरितसाललजिह्वम्
    ॥ ११॥ व्योमप्रभोज्ज्वलमुञ्चितरश्मिं सूर्यमिव प्रभया प्रतपन्तम् । निर्मलगात्रवरेभि मुनीन्द्रं सर्वप्रभासितक्षेत्रमनन्तम्
    ॥ १२॥ चन्द्रनिशाकरभास्करजालं क्षेत्रमनन्तसहस्रगतेषु । तेऽपि च निश्चितसर्वि बभूव बुद्धप्रभासविरोचनतायै
    ॥ १३॥ बुद्धदिवाकरलोकप्रदीपं बुद्धदिवाकररश्मिसहस्रम् । क्षेत्रमनन्तसहस्रगतेषु पश्यतु लोकतथागतसूर्यम्
    ॥ १४॥ पुण्यशतानि सहस्र च कृत्वा सर्वगुणेभिरलङ्कृतगात्रम् । सौरगजेन्द्रनिभं जितबाहुं विमलरक्षितमण्डितबाहुम्
    ॥ १५॥ भूमितलोपम शालिततुल्यं सूक्ष्मरजोपममागतबुद्धाः । सूक्ष्मरजोपम ये च भवन्ति सूक्ष्मरजोपम ये तिष्ठन्ति
    ॥ १६॥ तांश्च जिनान् प्रकरोमि प्रणामं कायेन वाचा मनसा प्रसन्ना । पुष्पप्रदान सुगन्धप्रदानैर्वर्णशतेन
    शुचिश्च स्मरामि ॥ १७॥ जिह्वशतैरपि बुद्धगुणानां कल्पसहस्रशतेन हि वक्तुम् । ये च सुनिर्वृतसाधुजिनानां
    सा च ललाट विचित्र अनेकैः ॥ १८॥ एकजिनस्य गुणान् नहि शक्यो जिह्वसहस्रेण भाषितु किञ्चित् । काममशक्ति
    हि सर्वजिनानामेकगुणस्य हि विस्तरवक्तुम् ॥ १९॥ सर्व सदेवकुलोक्तसमूहः सर्वभवाग्र भवजलपूर्णान् । ये जलग्रहणतु
    शक्यप्रमाणं नैव तु एकगुणा सुगतान्तम् ॥ २०॥ वर्णितु सुस्तुतमज्जिनसर्वं कायतु वाच प्रसन्नमनेन । प्रमेय
    सञ्चित पुण्यफलाग्रं तेन च सत्त्व प्रभोतु जिनत्वम् ॥ २१॥ एव तु विश्वं नरपतिबुद्धमेव करोमि नृपःप्रणिधानम्
    । यत्र च कुत्र चि मभ्यभवेत जाति अनागत कल्पमनन्ता ॥ २२॥ ईदृशभेरी पश्यमि स्वप्ने ईदृशनादं तत्र श
