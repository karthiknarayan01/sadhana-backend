id: vishvanarakritam2shivastotram
category: stotram
name:
  english: vishvanarakritam2shivastotram
  devanagari: विश्वानरकृतं२शिवस्तोत्रम्
content:
  english: vishvanarakritam 2 shivastotram atha trayodashe mase snatva gangajale dvijah | pratyusha eva
    viresham yavadayati bhusurah || 21|| tavallingantare balam dadarsha'shtasamam shubham | pingajatam
    dirghanetram shvetam vibhutibhushitam || 22|| tamalokya stutim cakre vishvanaro'timodavan | ekameva'dvitiyam
    yat parambrahma paratparam || 23|| krishnanarayanasamjnam shivadam shiva te namah | kartri poshtri
    ca samhartri tejo vividhatam gatam || 24|| yanmurterekabhagasthamaishvaryam jvalanadikam | saurabhyadi
    yato bhumau tasmai balaya te namah || 25|| yad grihitri gantri drashtri dhatri niyantri cantaram |
    sarvakamapradatri tat tasmai balaya te namah || 26|| stutveti padayostasya vishvanarah papata ha |
    balo varam vrinihiti provaca hasitananah || 27|| vishvanarah pratyuvaca bhavan sarvaprado yatah |
    putram dehi tvadrisham te pranato'smi punah punah || 28|| balah praha tathastvityacirena te manorathah
    | shucishmatyamaham putro bhavishyami phalishyati || 29|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 459
  devanagari: विश्वानरकृतं २ शिवस्तोत्रम् अथ त्रयोदशे मासे स्नात्वा गङ्गाजले द्विजः । प्रत्यूष एव वीरेशं
    यावदायाति भूसुरः ॥ २१॥ तावल्लिङ्गान्तरे बालं ददर्शाऽष्टसमं शुभम् । पिङ्गजटं दीर्घनेत्रं श्वेतं विभूतिभूषितम्
    ॥ २२॥ तमालोक्य स्तुतिं चक्रे विश्वानरोऽतिमोदवान् । एकमेवाऽद्वितीयं यत् परम्ब्रह्म परात्परम् ॥ २३॥
    कृष्णनारायणसंज्ञं शिवदं शिव ते नमः । कर्तृ पोष्टृ च संहर्तृ तेजो विविधतां गतम् ॥ २४॥ यन्मूर्तेरेकभागस्थमैश्वर्यं
    ज्वलनादिकम् । सौरभ्यादि यतो भूमौ तस्मै बालाय ते नमः ॥ २५॥ यद् गृहीतृ गन्तृ द्रष्टृ धातृ नियन्तृ चान्तरम्
    । सर्वकामप्रदातृ तत् तस्मै बालाय ते नमः ॥ २६॥ स्तुत्वेति पादयोस्तस्य विश्वानरः पपात ह । बालो वरं वृणीहीति
    प्रोवाच हसिताननः ॥ २७॥ विश्वानरः प्रत्युवाच भवान् सर्वप्रदो यतः । पुत्रं देहि त्वादृशं ते प्रणतोऽस्मि
    पुनः पुनः ॥ २८॥ बालः प्राह तथास्त्वित्यचिरेण ते मनोरथः । शुचिष्मत्यामहं पुत्रो भविष्यामि फलिष्यति
    ॥ २९॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ४५९
