id: shrigayatrishapavimocanam
category: stotram
name:
  english: shrigayatrishapavimocanam
  devanagari: श्रीगायत्रीशापविमोचनम्
content:
  english: shapa mukta hi gayatri caturvarga phala prada | ashapa mukta gayatri caturvarga phalantaka
    || om asya shri gaytri | brahmashapa vimocana mantrasya | brahma rishih | gayatri chandah | bhukti
    muktiprada brahmashapa vimocani gayatri shaktih devata | brahma shapa vimocanarthe jape viniyogah
    || om gayatri brahmetyupasita yadrupam brahmavido viduh | tam pashyanti dhirah sumanasam vacagratah
    | om vedanta nathaya vidmahe hiranyagarbhaya dhimahi | tanno brahma pracodayat | om gayatri tvam brahma
    shapat vimukta bhava || om asya shri vasishta shapa vimocana mantrasya nigraha anugraha karta vasishta
    rishi | vishvodbhava gayatri chandah | vasishta anugrahita gayatri shaktih devata | vasishta shapa
    vimocanarthe jape viniyogah || om soham arkamayam jyotiraham shiva atma jyotiraham shukrah sarva jyotirasah
    asmyaham |
  devanagari: शाप मुक्ता हि गायत्री चतुर्वर्ग फल प्रदा । अशाप मुक्ता गायत्री चतुर्वर्ग फलान्तका ।। ॐ अस्य
    श्री गाय्त्री । ब्रह्मशाप विमोचन मन्त्रस्य । ब्रह्मा ऋषिः । गायत्री छन्दः । भुक्ति मुक्तिप्रदा ब्रह्मशाप
    विमोचनी गायत्री शक्तिः देवता । ब्रह्म शाप विमोचनार्थे जपे विनियोगः ।। ॐ गायत्री ब्रह्मेत्युपासीत यद्रूपं
    ब्रह्मविदो विदुः । तां पश्यन्ति धीराः सुमनसां वाचग्रतः । ॐ वेदान्त नाथाय विद्महे हिरण्यगर्भाय धीमही
    । तन्नो ब्रह्म प्रचोदयात् । ॐ गायत्री त्वं ब्रह्म शापत् विमुक्ता भव ।। ॐ अस्य श्री वसिष्ट शाप विमोचन
    मन्त्रस्य निग्रह अनुग्रह कर्ता वसिष्ट ऋषि । विश्वोद्भव गायत्री छन्दः । वसिष्ट अनुग्रहिता गायत्री शक्तिः
    देवता । वसिष्ट शाप विमोचनार्थे जपे विनियोगः ।। ॐ सोहं अर्कमयं ज्योतिरहं शिव आत्म ज्योतिरहं शुक्रः
    सर्व ज्योतिरसः अस्म्यहं ।
