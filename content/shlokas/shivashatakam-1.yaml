id: shivashatakam-1
category: shataka
name:
  english: shivashatakam 1
  devanagari: शिवशतकम् १
content:
  english: parijnayakhyante jadamatiraham so'pi kathaye || 93|| bhavadbhaktirhyeka yadi dridhatara samba
    bhagavan bhavambhodhim tartum kimiha karanaishcapi bahubhih | mahadaridryabdhim bahuladuritakshvelakalilam
    parijnaya prayastava caranamevarcchati manah || 94|| sushuptau svapne va shiva tava ca jagratyahamiha
    bravimyuccairnama prashamasamupetairmuniganaih | pragitam sarvaghaksharanakaranam sangaratale jitaraterbherininadamiva
    dhatribalaripoh || 95|| sutau tavutsange guhagajamukhakhyau vapushi ca priyam gaurim gangamapi shirasi
    parshve paricaran | vidhayatisnigdham shubhavrishabhamaruhya bhagavan pinaki rakshayai mama bhavatu
    bhitasya yamatah || 96|| jagannathashrishaprabhritisurasevya tripurajit smarare kalare shvashuramakhaharin
    pashupate | gajare bhutesha pramathagananathadya bhagavan itiha krandantam paramakripaya palaya vibho
    || 97|| sudhabhanuttamsasmitamukhasharaccandravadana pranamrapadbhangapravanahridayambhojanayana |
    mrida shrisha snigdhalikanayana shubhranga bhagavan itiha krandantam paramakripaya palaya vibho ||
    98|| nagadhisha tryakshakhilashubhada gangadhara vibho shiva kshvelagriva dyumanishashabhridvahninayana
    | mahadeva svacchasphatikamanisacchaya bhagavan itiha krandantam paramakripaya palaya vibho || 99||
    nirasanga shriman niravadhikakarunyanilaya pranamapritantahkaranamunivrindaikasharana | vrisharudha
    praudhapramathagananathadya bhagavan itiha krandantam paramakripaya palaya vibho || 100|| bhuyobhuyah
    sharanam bhutesho'sau bhavabdhimagnanasya | avalambahinamanaso ha heti kroshato mamedanim || 101||
    durgadhisha mamedam daurgatyam durato nirasyaiva | tava namakirtanam me tarakamekam sada dishanandam
    || 102|| sahajamaharajapuragramanivasi vivekimurdhanyah | shriviraraghavakhyah sankhyavan stotrametadatanishta
    || 103|| || iti shrishivashatakam sampurnam ||
  devanagari: परिज्ञायाख्यान्ते जडमतिरहं सोऽपि कथये ॥ ९३॥ भवद्भक्तिर्ह्येका यदि दृढतरा साम्ब भगवन् भवाम्भोधिं
    तर्तुं किमिह करणैश्चापि बहुभिः । महादारिद्र्याब्धिं बहुलदुरितक्ष्वेलकलिलं परिज्ञाय प्रायस्तव चरणमेवर्च्छति
    मनः ॥ ९४॥ सुषुप्तौ स्वप्ने वा शिव तव च जाग्रत्यहमिह ब्रवीम्युच्चैर्नाम प्रशमसमुपेतैर्मुनिगणैः । प्रगीतं
    सर्वाघक्षरणकरणं सङ्गरतले जितारातेर्भेरीनिनदमिव धात्रीबलरिपोः ॥ ९५॥ सुतौ तावुत्सङ्गे गुहगजमुखाख्यौ
    वपुषि च प्रियां गौरीं गङ्गामपि शिरसि पार्श्वे परिचरान् । विधायातिस्निग्धं शुभवृषभमारुह्य भगवान् पिनाकी
    रक्षायै मम भवतु भीतस्य यमतः ॥ ९६॥ जगन्नाथश्रीशप्रभृतिसुरसेव्य त्रिपुरजित् स्मरारे कालारे श्वशुरमखहारिन्
    पशुपते । गजारे भूतेश प्रमथगणनाथाद्य भगवन् इतीह क्रन्दन्तं परमकृपया पालय विभो ॥ ९७॥ सुधाभानूत्तंसस्मितमुखशरच्चन्द्रवदन
    प्रणम्रापद्भङ्गप्रवणहृदयाम्भोजनयन । मृड श्रीश स्निग्धालिकनयन शुभ्राङ्ग भगवन् इतीह क्रन्दन्तं परमकृपया
    पालय विभो ॥ ९८॥ नगाधीश त्र्यक्षाखिलशुभद गङ्गाधर विभो शिव क्ष्वेलग्रीव द्युमणिशशभृद्वह्निनयन । महादेव
    स्वच्छस्फटिकमणिसच्छाय भगवन् इतीह क्रन्दन्तं परमकृपया पालय विभो ॥ ९९॥ निरासङ्ग श्रीमन् निरवधिककारुण्यनिलय
    प्रणामप्रीतान्तःकरणमुनिवृन्दैकशरण । वृषारूढ प्रौढप्रमथगणनाथाद्य भगवन् इतीह क्रन्दन्तं परमकृपया पालय
    विभो ॥ १००॥ भूयोभूयः शरणं भूतेशोऽसौ भवाब्धिमग्ननस्य । अवलम्बहीनमनसो हा हेति क्रोशतो ममेदानीम् ॥ १०१॥
    दुर्गाधीश ममेदं दौर्गत्यं दूरतो निरस्यैव । तव नामकीर्तनं मे तारकमेकं सदा दिशानन्दम् ॥ १०२॥ सहजमहाराजपुरग्रामनिवासी
    विवेकिमूर्धन्यः । श्रीवीरराघवाख्यः सङ्ख्यावान् स्तोत्रमेतदतनिष्ट ॥ १०३॥ ॥ इति श्रीशिवशतकं सम्पूर्णम्
    ॥
