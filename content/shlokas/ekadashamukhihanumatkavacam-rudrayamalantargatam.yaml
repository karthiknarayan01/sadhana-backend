id: ekadashamukhihanumatkavacam-rudrayamalantargatam
category: kavacha
name:
  english: ekadashamukhihanumatkavacam (rudrayamalantargatam)
  devanagari: एकादशमुखिहनुमत्कवचम् (रुद्रयामलान्तर्गतम्)
content:
  english: bharanalankritabhushanaya kiritabilvavanamalavibhushitaya kanakayajnopavitine kaupinakatisutravirajitaya
    shriviraramacandramanobhilashitaya lankadidahanakaranaya ghanakulagirivajradandaya akshakumarasamharakaranaya
    om yam om namo bhagavate ramadutaya phat svaha || om aim hrim hraum hanumate sitaramadutaya sahasramukharajavidhvamsakaya
    anjanigarbhasambhutaya shakinidakinividhvamsanaya kilikilicucu karena vibhishanaya virahanumaddevaya
    om hrim shrim hrau hram phat svaha || om shrivirahanumate haum hrum phat svaha | om shrivirahanumate
    sphrum hrum phat svaha | om shrivirahanumate hraum hrum phat svaha | om shrivirahanumate sphrum phat
    svaha | om hram shrivirahanumate hraum hum phat svaha | om shrivirahanumate hraim hum phat svaha |
    om hram purvamukhe vanaramukhahanumate lam sakalashatrusamharakaya hum phat svaha | om agneyamukhe
    matsyamukhahanumate ram sakalashatrusakalashatrusamharakaya hum phat svaha | om dakshinamukhe kurmamukhahanumate
    mam sakalashatrusakalashatrusamharakaya hum phat svaha | om nairritimukhe varahamukhahanumate ksham
    sakalashatrusakalashatrusamharakaya hum phat svaha | om pashcimamukhe narasimhamukhahanumate vam sakalashatrusakalashatrusamharakaya
    hum phat svaha | om vayavyamukhe garudamukhahanumate yam sakalashatrusakalashatrusamharakaya hum phat
    svaha | om uttaramukhe sharabhamukhahanumate sam sakalashatrusakalashatrusamharakaya hum phat svaha
    | om ishanamukhe vrishabhamukhahanumate hum am sakalashatrusakalashatrusamharakaya hum phat svaha
    | om urdhvamukhe jvalamukhahanumate am sakalashatrusakalashatrusamharakaya hum phat svaha | om adhomukhe
    marjaramukhahanumate hrim sakalashatrusakalashatrusamharakaya hum phat svaha | om sarvatra jaganmukhe
    hanumate sphrum sakalashatrusakalashatrusamharakaya hum phat svaha | om shrisitaramapadukadharaya
    mahaviraya vayuputraya kanishthaya brahmanishthaya ekadasharudramurtaye mahabalaparakramaya bhanumandalagrasanagrahaya
    caturmukhavaraprasadaya mahabhayarakshakaya yam haum | om hasphem hasphem hasphem shrivirahanumate
    namah ekadashavirahanuman mam raksha raksha shantim kuru kuru tushtim kuru karu pushtim kuru kuru
    maharogyam kuru kuru abhayam kuru kuru avighnam kuru kuru mahavijayam kuru kuru saubhagyam kuru kuru
    sarvatra vijayam kuru kuru mahalakshmim dehi hum phat svaha || phalashrutih ityetatkavacam divyam
    shivena parikirtitam | yah pathetprayato bhutva sarvankamanavapnuyat || dvikalamekakalam va trivaram
    yah pathennarah | rogan punah kshanat jitva sa puman labhate shriyam || madhyahne ca jale sthitva
    caturvaram pathedyadi | kshayapasmarakushthaditapatrayanivaranam || yah pathetkavacam divyam hanumaddhyanatatparah
    | trihsakridva yathajnanam so'pi punyavatam varah || devamabhyarcya vidhivatpurashcaryam samarabhet
    | ekadashashatam japyam dashamshahavanadikam || yah karoti naro bhaktya kavacasya samadaram | tatah
    siddhirbhavettasya paricaryavidhanatah || gadyapadyamaya vani tasya vaktre prajayate | brahmahatyadipapebhyo
    mucyate natra samshayah ||
  devanagari: भरणालङ्कृतभूषणाय किरीटबिल्ववनमालाविभूषिताय कनकयज्ञोपवीतिने कौपीनकटिसूत्रविराजिताय श्रीवीररामचन्द्रमनोभिलषिताय
    लङ्कादिदहनकारणाय घनकुलगिरिवज्रदण्डाय अक्षकुमारसंहारकारणाय ॐ यं ॐ नमो भगवते रामदूताय फट् स्वाहा ॥ ॐ
    ऐं ह्रीं ह्रौं हनुमते सीतारामदूताय सहस्रमुखराजविध्वंसकाय अञ्जनीगर्भसम्भूताय शाकिनीडाकिनीविध्वंसनाय
    किलिकिलिचुचु कारेण विभीषणाय वीरहनुमद्देवाय ॐ ह्रीं श्रीं ह्रौ ह्रां फट् स्वाहा ॥ ॐ श्रीवीरहनुमते हौं
    ह्रूं फट् स्वाहा । ॐ श्रीवीरहनुमते स्फ्रूं ह्रूं फट् स्वाहा । ॐ श्रीवीरहनुमते ह्रौं ह्रूं फट् स्वाहा
    । ॐ श्रीवीरहनुमते स्फ्रूं फट् स्वाहा । ॐ ह्रां श्रीवीरहनुमते ह्रौं हूं फट् स्वाहा । ॐ श्रीवीरहनुमते
    ह्रैं हुं फट् स्वाहा । ॐ ह्रां पूर्वमुखे वानरमुखहनुमते लं सकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ आग्नेयमुखे
    मत्स्यमुखहनुमते रं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ दक्षिणमुखे कूर्ममुखहनुमते मं सकलशत्रुसकलशत्रुसंहारकाय
    हुं फट् स्वाहा । ॐ नैरृतिमुखे वराहमुखहनुमते क्षं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ पश्चिममुखे
    नारसिंहमुखहनुमते वं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ वायव्यमुखे गरुडमुखहनुमते यं सकलशत्रुसकलशत्रुसंहारकाय
    हुं फट् स्वाहा । ॐ उत्तरमुखे शरभमुखहनुमते सं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ ईशानमुखे
    वृषभमुखहनुमते हूं आं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ ऊर्ध्वमुखे ज्वालामुखहनुमते आं सकलशत्रुसकलशत्रुसंहारकाय
    हुं फट् स्वाहा । ॐ अधोमुखे मार्जारमुखहनुमते ह्रीं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ सर्वत्र
    जगन्मुखे हनुमते स्फ्रूं सकलशत्रुसकलशत्रुसंहारकाय हुं फट् स्वाहा । ॐ श्रीसीतारामपादुकाधराय महावीराय
    वायुपुत्राय कनिष्ठाय ब्रह्मनिष्ठाय एकादशरुद्रमूर्तये महाबलपराक्रमाय भानुमण्डलग्रसनग्रहाय चतुर्मुखवरप्रसादाय
    महाभयरक्षकाय यं हौम् । ॐ हस्फें हस्फें हस्फें श्रीवीरहनुमते नमः एकादशवीरहनुमन् मां रक्ष रक्ष शान्तिं
    कुरु कुरु तुष्टिं कुरु करु पुष्टिं कुरु कुरु महारोग्यं कुरु कुरु अभयं कुरु कुरु अविघ्नं कुरु कुरु
    महाविजयं कुरु कुरु सौभाग्यं कुरु कुरु सर्वत्र विजयं कुरु कुरु महालक्ष्मीं देहि हुं फट् स्वाहा ॥ फलश्रुतिः
    इत्येतत्कवचं दिव्यं शिवेन परिकीर्तितम् । यः पठेत्प्रयतो भूत्वा सर्वान्कामानवाप्नुयात् ॥ द्विकालमेककालं
    वा त्रिवारं यः पठेन्नरः । रोगान् पुनः क्षणात् जित्वा स पुमान् लभते श्रियम् ॥ मध्याह्ने च जले स्थित्वा
    चतुर्वारं पठेद्यदि । क्षयापस्मारकुष्ठादितापत्रयनिवारणम् ॥ यः पठेत्कवचं दिव्यं हनुमद्ध्यानतत्परः ।
    त्रिःसकृद्वा यथाज्ञानं सोऽपि पुण्यवतां वरः ॥ देवमभ्यर्च्य विधिवत्पुरश्चर्यां समारभेत् । एकादशशतं जाप्यं
    दशांशहवनादिकम् ॥ यः करोति नरो भक्त्या कवचस्य समादरम् । ततः सिद्धिर्भवेत्तस्य परिचर्याविधानतः ॥ गद्यपद्यमया
    वाणी तस्य वक्त्रे प्रजायते । ब्रह्महत्यादिपापेभ्यो मुच्यते नात्र संशयः ॥
