id: nigraheshvarisahasranamastotram
category: sahasranama
name:
  english: nigraheshvarisahasranamastotram
  devanagari: निग्रहेश्वरीसहस्रनामस्तोत्रम्
content:
  english: ringastha kadividyaprakashini || 33|| kalindanandini kali kaulini kalivarddhini | karmasamnyasikaradhya
    karbburi kalinashini || 34|| karvva karmavipaka ca kanjodyanaviharini | kalmashakanthabhayada kalyani
    kanakaprabha || 35|| kadambari ca kantanghridohadaranyavasini | kantarabhitisantrastarakshini kapirupini
    || 36|| kapisheyasanarudha kapisheyapatipriya | kamakallolasamrajni kameshi kapisharcita || 37|| kamajanarava
    kamakelipandityavigraha | kamarupamahayonipithastha kamarupini || 38|| kamavasayita kamalatalakshya
    ca kamini | kamarekhalayadhisha kamakhya kamarakshini || 39|| karttasvarambara kayastha kayasthaprapujita
    | karttaviryantajanani karttaviryakulambika || 40|| karttantika ca karunyasindhusampurnamanasa | karttikeyaprasuh
    kalakanthagatranakhakshata || 41|| kinashanashakartri ca kilalapavimardini | kutumbaposhanasakta kuthatankadharaprasuh
    || 42|| kunindavyapini kuntha kundini kuntakodara | kundapayyaphaladhyaksha kuntalishiraposhini ||
    43|| kumari kumudavasa kubjika ca kumodini | kurukulla kumbhayonistuta kulakulayika || 44|| kulastri
    kulanakshatra kulavaraprapujita | kulata kuladharmishtha kulaparvatavasini || 45|| kuleshashasana
    kauleshvari ca kulishasana | krikavakudhvajakshetra kulina kulashasana || 46|| kulaka kunjararativahana
    kalahapriya | kuberacalasamrajni kusritih kapateshvari || 47|| kuhukantharavaprita kutastha kulishankusha
    | kutarthabhashita krittivasovakshoviharini || 48|| krishangi kurmacakrastha krishkararddhangaharini
    | kripitayonimadhyastha kritantajanani kripa || 49|| krishnapujya krishnajaya krishnakhya krishnavallabha
    | krishnadvaipayanajnanadayini krishnapingala || 50|| krishnasarathisampujya krishnasarangarupini
    | krishnashrita krishnasvasa kelikopavanashraya || 51|| keshyaripreyasi krishnasakhi keshinisudana
    | kaitaryyavrikshahindola kaitabhi kaitabheshvari || 52|| kaivartti kairavi kokabandhumata kiratini
    | kotara kaushikarativahanaprasava tatha || 53|| kaushitaki kaushiki ca kaushikarshivaraprada | kratudviddaityasamhantri
    kaustubhasvamigehini || 54|| krauncaratipriya krauncabhagini krauncadarana | krodasya kshitija kshipta
    kshitisantanacandika || 55|| kshirashukla kshirasindhusuta kshetradhidevata | kshemankari ca kshetrajna
    kshetrakshetrajnabodhini || 56|| khagendraketuramani khararudha khagasana | kharabdankurakabha ca
    khara khatvangadharini || 57|| khadgahasta khagasya ca khavaspalayanandini | khasatmajantaka khashpa
    khastani khandavantaka || 58|| khonkaha khaduka khasphatikasya kholmukaprasuh | khecari khecarimudra
    khyatih khinkhiravigraha || 59|| gaganadhvajanetra ca ganga gangeyapujita | gangadharasuta gangadharagarhasthyadharmini
    || 60|| gajasahvayasamrajyeshvaranirvanadayini | gajaryasanasamrudha gajasya gajagamini || 61|| ganadevasamaradhya
    gananathavaraprada | ganaprasurganadrisha ganika gananayika || 62|| ganeshajanani gauri gadahasta
    gadantaka | gatarttava ganadravya gatvara gandhakalika || 63|| garudagrajapadmastha garudadhvajamohini
    | garbhasamrakshanakari garbhini garbhaghatini || 64|| gayatri gautami gita girdevi gunasagara | guhyakali
    guhyavidya guhyayonirguhaprasuh || 65|| gokuleshi ca gaurgopi goshthastha gopavallabha | golokavasini
    gola golangulavaraprada || 66|| govindapreyasi gramya grahakallolabhitiha | ghatodbhava ghanashyama
    ghushta ghanteshvaraprasuh || 67|| ghanavalli ghanajvala ghanapakhandakhandini | cakrapushkarinikshetrapretamokshapradayini
    || 68|| cakranki cakrahasta ca cakrayudhanamaskrita | cakreshvari ca cakrastha cakrarajanivasini ||
    69|| cakshushmati candika ca cancala candanayika | camunda raktacamunda candamundavinashini || 70||
    cakradhivasini candi cakrini cakranayika | caturdantagajarudha caturvargaphalaprada || 71|| caturvidya
    caturveda catura ca caturgatih | candanacalavishrama candradvipadhidevata || 72|| candrakutadrisamsthana
    candrika candrashekhara | candrahasa candrakala candrashekharavallabha || 73|| caranavyuhavijnanabodhita
    caramacala | carccika carmamunda ca caturmasyamahotsava || 74|| caturashramyamaryada camikarasamujjvala
    | carvakarhantavidhvamsa citra cittasamunnatih || 75|| cintamanishcitralekha citramekhalavahana |
    citrakutanivasa ca citraguptavaraprada || 76|| chayamrigadharajyotsna chaya chagabalipriya | jagadgauri
    jagaddhatri jatala jagadambika || 77|| jagadvaha jagadyonirjatharastha janashraya | janamejayasampujya
    janani janakatmaja || 78|| jambhala jahnutanaya japayajnaparayana | jamadagnipriya jambhadvidaradhya
    jayaprada || 79|| jaratkarurjaratkarupriya jatirjvarapaha | jhashodari jhashankaripriya tankaranadini
    || 80|| dakini dakinipujya tattvajnanavidhayini | tantunagasamarudha tattvanyasaphalaprada || 81||
    tantropadeshika tantramargapujya tapasvini | tandra tapasya tanmatra tantriki tapanatmaja || 82||
    tandavapreyasi tarkavidya tapatamasvini | tamasi tarini tara tripura tripurantaka || 83|| tilapushpasamaghrana
    triptistripurabhairavi | tilottama tikshnadamshtra tivra talankavallabha || 84|| tejasvini traparanda
    trikalajna trilocana | trailokyaishvaryavarada triguna tridashodbhava || 85|| trisandhyavyapini tisrapithacaryaprakashini
    | trihayani ca trailokyavijaya tryambakanuga || 86|| tvishampatiprasurdakshakanya dakshavinashini
    | dakshayani dakshinasheshvari dakshinakalika || 87|| dakshinacarasantushta dakshina dagdhavigraha
    | dandanatha dandanitirdandanarayanapriya || 88|| dadhicyasthisthita dadhyani daityadvidvaraprada
    | damayanti ca dambholihasta dambhanivarana || 89|| daridra darddura darddarikaghosha dasharuha |
    deveshadashanocchishta dashagrivanipatini || 90|| dashavatarajanani digvastra caiva dasrasuh | dasharharamani
    dashanandini dahanapriya || 91|| devamata ditirdevi devalokanivasini | divaspatipriya divya divyavastra
    digambara || 92|| dugdhabdhija divyagandha ca dishtantavidhayika | diptapingalasamsthana dipta divyopapaduka
    || 93|| durishtadamani durga durgartitranakarana | durjaya durjanadvesha durvasovaradayini || 94||
    dushanaripriya drishtivikshepastraprakashini | durlabha durvinita ca duryodhanakshayankari || 95||
    devapatni devasena devata devakatmaja | daivavani ca daivajna deshika daivakovida || 96|| doshajna
    dushtasamharini dordandaparakrama | dvatrimshannamasampujya draupadi dravideshvari || 97|| dvarikadhishatanaya
    dvarikadhishagehini | dvarikakulavidhvamsakarini dvaravasini || 98|| divyakarttasvaragendradhanushkotiprakashini
    | dvijarajapriya kshetrapaladvahsthitadarshaka || 99|| dvijendravarada dvaimaturakshetra dharasuta
    | dharitri dhenukadharmacarini dharmacarini || 100|| dharmacinta dhanurvidya dharmarajajayaprada |
    dhumavati ca dhishana dhumralocanaghatini || 101|| dhvantasammardini dhautakausheyi dhvankshavahana
    | naktancaracamubhaksha nakulishaprapujita || 102|| nakshatramalini nakraghatini nakharayudha | nagamba
    nagabhagini nagaja naganandini || 103|| nateshvarapriya natyavidya nanda nateshvari | nandikeshvaraprishthastha
    nandaja nandanandini || 104|| nabhomandaladipasya nabhodvipasamasvara | narakeshta narakantakari narakadevata
    || 105|| naranarayanaradhya naravishvananashini | naramedhapriya nakanayika nahushapriya || 106||
    navoddhritasugandha ca navaratrasamarcita | nananushthanasadrupa nagaratishavallabha || 107|| narayani
    nirakara nikashatmajavairini | nikumbhila nigraheshi nigraheshvarakamini || 108|| nigrahagamasantushta
    nigrahagamapujita | nihsheshanigrahadhyaksha nigrahajnapravarttini || 109|| nigrahacaryavarada nigrahacaryarakshini
    | nigrahanugrahakari nigrahi nigraheshvari || 110|| nigrahacaranipuna dushtanigrahakarika | niralamba
    niramba ca nirguna niravagraha || 111|| nirvikalpasamadhistha nirvinna nivarakritih | nivatakavacatrasakarini
    ca nishadvari || 112|| nilimpanirjhari nitirnitishastravisharada | nishumbhashumbhahanani nilagirnilakuntala
    || 113|| nilacalanivasa ca nilamadhavagehini | nilabjavadana nilalohiteshvaravallabha || 114|| nrisimharupini
    nyakshaghatini nigamastuta | pancapretasanarudha pancakrityavidhayini || 115|| pancananasamarudha
    pancananaratipriya | pancamnayamahavidya pancamananakrintani || 116|| prajapatipriya pancangulih pancarthadayini
    | pancatharvashiromantrasiddhida priyavadini || 117|| pancakoshasthita pancayatanastha ca pancadha
    | pancaratrastuta pancakleshahantri ca pandita || 118|| prakritishca plavangendramahasainyaprapujita
    | phetkarini phaladhyaksha phalada phalgunapriya || 119|| bakajidrakshini balya bakaghni badavamukhi
    | balabhadrapriya bala bagala balavarddhini || 120|| balindamashiracchetri balaratijayaprada | banaganga
    banamata banasuranipatini || 121|| babhravi balasandhya ca balidanapriya bala | balarkamandalabhasa
    bilvavrikshanivasini || 122|| brahmakarmasamadhistha bauddhapakhandakhandini | brahmajna brahmaramani
    brahmani brahmacarini || 123|| brahmajnanapradatri ca brahmadandapraharini | brahmanirvanarupa ca
    brahmarakshasabhitiha || 124|| brahmarshipujita brahmavidya brahmasvarupini | brahmavedastuta brahmasutra
    brahmavaraprada || 125|| brahmastravidya brahmastrastambhini brahmaghatini | bhaktirbhagavati bhaktavanchasankalpapadapa
    || 126|| bhagirathasuta bhaktapalini bhagamalini | bhandasuranihantri ca bhadrakali bhayaprada ||
    127|| bhadra bhadrahara bhadraprada bhadreshvarapriya | bhadratmajadhara bhadrashrayasancarcitastani
    || 128|| bharadvajastuta bhavya bharati bharataprasuh | bhargoyukta bhagakara bharatapranarakshini
    || 129|| bhavapriya bhavani ca bhavada bhavanashini | bhasmasuravinasha ca bhasmacalanivasini || 130||
    bhargavi bhargavaradhya bhashyakaravaraprada | bhaskareshta bhagavatashlokacaritravarddhini || 131||
    bhutatmika bhutahantri bhima bhimaparakrama | bhutabhumivihara ca bhutani bhutanayika || 132|| bhringisharddhasharirastha
    bhuputri bhillasundari | bherunda bhairavi bhogavali bhairavavallabha || 133|| makarastha magaradhya
    makaradhvajavarddhini | mangalangi mahamaya madhavi magadheshvari || 134|| matsyodari matsyagandha
    manidvipadhidevata | mattebhagamana matta matangi manikarnika || 135|| madana madanavastha madanayudharupini
    | madirakshi ca manasa minakshi madanotsava || 136|| mayavini manogupta mantrajihva manasvini | mandakini
    mahakali maryada ca mahodari || 137|| mahalakshmirmahakalapriya marttandabhairavi | mahishaghni mahapapahara
    mahishamardini || 138|| mayasita mahakaulajnanadatri mahashaya | maheshvari ca makatarupini manasalaya
    || 139|| murddhabhishiktaharmyastha muralidharamohini | muladharasthita mulaprakritirmenakatmaja ||
    140|| maharudrapriya mena mainakadrisahodara | mangalyada maharatrirmoharatrishca mohini || 141||
    yakshini yaksharatrishca yajnanarayanaprasuh | yajnanarayanaradhya yajnanarayanapriya || 142|| yajnopavitini
    yajnapashusvargasukhaprada | yathashastrasadacara yatharthaphaladayini || 143|| yadavendrakularadhya
    yadavendravaraprada | yami yamavati yami yamapatni yashasvini || 144|| yuvati yuddhadaksha ca yudhishthiraprapujita
    | yonimudra yogamaya yoganidra ca yogini || 145|| yogishvari ca yogastha yogeshvaranamaskrita | yogeshvari
    ca raktakshi raktabijashani rama || 146|| raktavastra raktajihva raktangi raktadantika | rakshoghni
    rakshika rakshojanani ranganayika || 147|| rajatadrinivasa ca rajanicaravallabha | rajanikaradara
    ca rajanicaranashini || 148|| ranalankaranaprema ranasthanaviharini | ratarthini rati randa ratimandirasundari
    || 149|| ratnaparayanadhvamsakari ratnakarapriya | ratnaparayanavasa ratnabharanabhushita || 150||
    rathakrantagamaradhya rathangayudhayodhini | rathangapaniramani ramani ramanapriya || 151|| rasatalanivasa
    ca rasajna ravilocana | rasavaridhimadhyastha raseshi rasikeshvari || 152|| raseshvari rasasvada rakshasendravaraprada
    | radhika rajalakshmishca rakshasendravinashini || 153|| ramastuta ramamata ramacandrajayaprada |
    ramanghripavita ramabhagini ramavallabha || 154|| ramarativinasha ca ramadutavaraprada | ramayanakathavaktri
    raghavananyarupini || 155|| rasabhastha ripudroha rasamandalanayika | rukmini rukmavarna ca rukminisutavallabha
    || 156|| rudrakshamalini rudragehini rogaharini | rudrani rudracandi ca renuka ripubhakshini || 157||
    lakshmirlajja lokamata lopamudra ca lankini | laksharuna lokakanta lalita lalitapriya || 158|| lakshmanapreyasi
    lakshyabhedini lavanantaka | latasadhanasampujya lohitasravamandita || 159|| lokaghni lokajanani vamacaraparayana
    | varahi vangadeshastha vajrini vajrakalika || 160|| vajrajvala tatha vajravarahi vajrasha
  devanagari: ृङ्गस्था कादिविद्याप्रकाशिनी ॥ ३३॥ कलिन्दनन्दिनी काली कौलिनी कलिवर्द्धिनी । कर्मसंन्यासिकाराध्या
    कर्ब्बुरी कलिनाशिनी ॥ ३४॥ कर्व्वा कर्मविपाका च कञ्जोद्यानविहारिणी । कल्माषकण्ठभयदा कल्याणी कनकप्रभा
    ॥ ३५॥ कादम्बरी च कान्ताङ्घ्रिदोहदारण्यवासिनी । कान्तारभीतिसन्त्रस्तरक्षिणी कपिरूपिणी ॥ ३६॥ कापिशेयासनारूढा
    कापिशेयपतिप्रिया । कामकल्लोलसाम्राज्ञी कामेशी कापिशार्चिता ॥ ३७॥ कामजानरवा कामकेलिपाण्डित्यविग्रहा
    । कामरूपमहायोनिपीठस्था कामरूपिणी ॥ ३८॥ कामावसायिता कामलतालक्ष्या च कामिनी । कामरेखालयाधीशा कामाख्या
    कामरक्षिणी ॥ ३९॥ कार्त्तस्वराम्बरा कायस्था कायस्थप्रपूजिता । कार्त्तवीर्यान्तजननी कार्त्तवीर्यकुलाम्बिका
    ॥ ४०॥ कार्त्तान्तिका च कारुण्यसिन्धुसम्पूर्णमानसा । कार्त्तिकेयप्रसूः कालकण्ठगात्रनखक्षता ॥ ४१॥ कीनाशनाशकर्त्री
    च कीलालपविमर्दिनी । कुटुम्बपोषणासक्ता कुठाटङ्कधरप्रसूः ॥ ४२॥ कुणिन्दव्यापिनी कुण्ठा कुन्दिनी कुण्टकोदरा
    । कुण्डपाय्यफलाध्यक्षा कुन्तलीशीरपोषिणी ॥ ४३॥ कुमारी कुमुदावासा कुब्जिका च कुमोदिनी । कुरुकुल्ला कुम्भयोनिस्तुता
    कुलकुलायिका ॥ ४४॥ कुलस्त्री कुलनक्षत्रा कुलवारप्रपूजिता । कुलटा कुलधर्मिष्ठा कुलपर्वतवासिनी ॥ ४५॥
    कुलेशशासना कौलेश्वरी च कुलिशासना । कृकवाकुध्वजक्षेत्रा कुलीना कुलशासना ॥ ४६॥ कुलका कुञ्जरारातिवाहना
    कलहप्रिया । कुबेराचलसाम्राज्ञी कुसृतिः कपटेश्वरी ॥ ४७॥ कुहूकण्ठरवप्रीता कूटस्था कुलिशाङ्कुशा । कूटार्थभाषिता
    कृत्तिवासोवक्षोविहारिणी ॥ ४८॥ कृशाङ्गी कूर्मचक्रस्था कृष्करार्द्धाङ्गहारिणी । कृपीटयोनिमध्यस्था कृतान्तजननी
    कृपा ॥ ४९॥ कृष्णपूज्या कृष्णजाया कृष्णाख्या कृष्णवल्लभा । कृष्णद्वैपायनज्ञानदायिनी कृष्णपिङ्गला ॥
    ५०॥ कृष्णसारथिसम्पूज्या कृष्णसारङ्गरूपिणी । कृष्णाश्रिता कृष्णस्वसा केलिकोपवनाश्रया ॥ ५१॥ केश्यरिप्रेयसी
    कृष्णसखी केशिनिसूदना । कैटर्य्यवृक्षहिन्दोला कैटभी कैटभेश्वरी ॥ ५२॥ कैवर्त्ती कैरवी कोकबन्धुमाता किरातिनी
    । कोटरा कौशिकारातिवाहनप्रसवा तथा ॥ ५३॥ कौशीतकी कौशिकी च कौशिकर्षिवरप्रदा । क्रतुद्विड्दैत्यसंहन्त्री
    कौस्तुभस्वामिगेहिनी ॥ ५४॥ क्रौञ्चारातिप्रिया क्रौञ्चभगिनी क्रौञ्चदारणा । क्रोडास्या क्षितिजा क्षिप्ता
    क्षितिसन्तानचण्डिका ॥ ५५॥ क्षीरशुक्ला क्षीरसिन्धुसुता क्षेत्राधिदेवता । क्षेमङ्करी च क्षेत्रज्ञा क्षेत्रक्षेत्रज्ञबोधिनी
    ॥ ५६॥ खगेन्द्रकेतुरमणी खरारूढा खगासना । खराब्दाङ्कुरकाभा च खरा खट्वाङ्गधारिणी ॥ ५७॥ खड्गहस्ता खगास्या
    च खवास्पालयनन्दिनी । खसात्मजान्तका खष्पा खस्तनी खाण्डवान्तका ॥ ५८॥ खोङ्काहा खादुका खस्फाटिकास्या खोल्मुकप्रसूः
    । खेचरी खेचरीमुद्रा ख्यातिः खिङ्खिरविग्रहा ॥ ५९॥ गगनध्वजनेत्रा च गङ्गा गाङ्गेयपूजिता । गङ्गाधरसुता
    गङ्गाधरगार्हस्थ्यधर्मिणी ॥ ६०॥ गजसाह्वयसाम्राज्येश्वरनिर्वाणदायिनी । गजार्यासनसंरूढा गजास्या गजगामिनी
    ॥ ६१॥ गणदेवसमाराध्या गणनाथवरप्रदा । गणप्रसूर्गणाद्रीशा गणिका गणनायिका ॥ ६२॥ गणेशजननी गौरी गदाहस्ता
    गदान्तका । गतार्त्तवा गणद्रव्या गत्वरा गन्धकालिका ॥ ६३॥ गरुडाग्रजपद्मस्था गरुडध्वजमोहिनी । गर्भसंरक्षणकरी
    गर्भिणी गर्भघातिनी ॥ ६४॥ गायत्री गौतमी गीता गीर्देवी गुणसागरा । गुह्यकाली गुह्यविद्या गुह्ययोनिर्गुहप्रसूः
    ॥ ६५॥ गोकुलेशी च गौर्गोपी गोष्ठस्था गोपवल्लभा । गोलोकवासिनी गोला गोलाङ्गूलवरप्रदा ॥ ६६॥ गोविन्दप्रेयसी
    ग्राम्या ग्रहकल्लोलभीतिहा । घटोद्भवा घनश्यामा घुष्टा घण्टेश्वरप्रसूः ॥ ६७॥ घनवल्ली घनज्वाला घनपाखण्डखण्डिनी
    । चक्रपुष्करिणीक्षेत्रप्रेतमोक्षप्रदायिनी ॥ ६८॥ चक्राङ्की चक्रहस्ता च चक्रायुधनमस्कृता । चक्रेश्वरी
    च चक्रस्था चक्रराजनिवासिनी ॥ ६९॥ चक्षुष्मती चण्डिका च चञ्चला चण्डनायिका । चामुण्डा रक्तचामुण्डा चण्डमुण्डविनाशिनी
    ॥ ७०॥ चक्राधिवासिनी चण्डी चक्रिणी चक्रनायिका । चतुर्दन्तगजारूढा चतुर्वर्गफलप्रदा ॥ ७१॥ चतुर्विद्या
    चतुर्वेदा चतुरा च चतुर्गतिः । चन्दनाचलविश्रामा चन्द्रद्वीपाधिदेवता ॥ ७२॥ चन्द्रकूटाद्रिसंस्थाना चन्द्रिका
    चन्द्रशेखरा । चन्द्रहासा चन्द्रकला चन्द्रशेखरवल्लभा ॥ ७३॥ चरणव्यूहविज्ञानबोधिता चरमाचला । चर्च्चिका
    चर्ममुण्डा च चातुर्मास्यमहोत्सवा ॥ ७४॥ चातुराश्रम्यमर्यादा चामीकरसमुज्ज्वला । चार्वाकार्हन्तविध्वंसा
    चित्रा चित्तसमुन्नतिः ॥ ७५॥ चिन्तामणिश्चित्रलेखा चित्रमेखलवाहना । चित्रकूटनिवासा च चित्रगुप्तवरप्रदा
    ॥ ७६॥ छायामृगधरज्योत्स्ना छाया छागबलिप्रिया । जगद्गौरी जगद्धात्री जटाला जगदम्बिका ॥ ७७॥ जगद्वहा जगद्योनिर्जठरस्था
    जनाश्रया । जनमेजयसम्पूज्या जननी जनकात्मजा ॥ ७८॥ जम्भला जह्नुतनया जपयज्ञपरायणा । जमदग्निप्रिया जम्भद्विडाराध्या
    जयप्रदा ॥ ७९॥ जरत्कारुर्जरत्कारुप्रिया जातिर्ज्वरापहा । झषोदरी झषाङ्कारिप्रिया टङ्कारनादिनी ॥ ८०॥
    डाकिनी डाकिनीपूज्या तत्त्वज्ञानविधायिनी । तन्तुनागसमारूढा तत्त्वन्यासफलप्रदा ॥ ८१॥ तन्त्रोपदेशिका
    तन्त्रमार्गपूज्या तपस्विनी । तन्द्रा तपस्या तन्मात्रा तान्त्रिकी तपनात्मजा ॥ ८२॥ ताण्डवप्रेयसी तर्कविद्या
    तापतमस्विनी । तामसी तारिणी तारा त्रिपुरा त्रिपुरान्तका ॥ ८३॥ तिलपुष्पसमघ्राणा तृप्तिस्त्रिपुरभैरवी
    । तिलोत्तमा तीक्ष्णदंष्ट्रा तीव्रा तालाङ्कवल्लभा ॥ ८४॥ तेजस्विनी त्रपारण्डा त्रिकालज्ञा त्रिलोचना
    । त्रैलोक्यैश्वर्यवरदा त्रिगुणा त्रिदशोद्भवा ॥ ८५॥ त्रिसन्ध्यव्यापिनी तिस्रपीठाचार्यप्रकाशिनी । त्रिहायणी
    च त्रैलोक्यविजया त्र्यम्बकानुगा ॥ ८६॥ त्विषाम्पतिप्रसूर्दक्षकन्या दक्षविनाशिनी । दाक्षायणी दक्षिणाशेश्वरी
    दक्षिणकालिका ॥ ८७॥ दक्षिणाचारसन्तुष्टा दक्षिणा दग्धविग्रहा । दण्डनाथा दण्डनीतिर्दण्डनारायणप्रिया ॥
    ८८॥ दधीच्यस्थिस्थिता दध्यानी दैत्यद्विड्वरप्रदा । दमयन्ती च दम्भोलिहस्ता दम्भनिवारणा ॥ ८९॥ दरिद्रा
    दर्द्दुरा दर्द्दरीकघोषा दशारुहा । देवेशदशनोच्छिष्टा दशग्रीवनिपातिनी ॥ ९०॥ दशावतारजननी दिग्वस्त्रा
    चैव दस्रसूः । दाशार्हरमणी दाशनन्दिनी दहनप्रिया ॥ ९१॥ देवमाता दितिर्देवी देवलोकनिवासिनी । दिवस्पतिप्रिया
    दिव्या दिव्यवस्त्रा दिगम्बरा ॥ ९२॥ दुग्धाब्धिजा दिव्यगन्धा च दिष्टान्तविधायिका । दीप्तपिङ्गलसंस्थाना
    दीप्ता दिव्योपपादुका ॥ ९३॥ दुरिष्टदमनी दुर्गा दुर्गार्तित्राणकारणा । दुर्जया दुर्जनद्वेषा दुर्वासोवरदायिनी
    ॥ ९४॥ दूषणारिप्रिया दृष्टिविक्षेपास्त्रप्रकाशिनी । दुर्लभा दुर्विनीता च दुर्योधनक्षयङ्करी ॥ ९५॥ देवपत्नी
    देवसेना देवता देवकात्मजा । दैववाणी च दैवज्ञा देशिका दैवकोविदा ॥ ९६॥ दोषज्ञा दुष्टसंहारिणी दोर्दण्डपराक्रमा
    । द्वात्रिंशन्नामसम्पूज्या द्रौपदी द्रविडेश्वरी ॥ ९७॥ द्वारिकाधीशतनया द्वारिकाधीशगेहिनी । द्वारिकाकुलविध्वंसकारिणी
    द्वारवासिनी ॥ ९८॥ दिव्यकार्त्तस्वरागेन्द्रधनुष्कोटिप्रकाशिनी । द्विजराजप्रिया क्षेत्रपालद्वाःस्थितदर्शका
    ॥ ९९॥ द्विजेन्द्रवरदा द्वैमातुरक्षेत्रा धरासुता । धरित्री धेनुकाधर्मचारिणी धर्मचारिणी ॥ १००॥ धर्मचिन्ता
    धनुर्विद्या धर्मराजजयप्रदा । धूमावती च धिषणा धूम्रलोचनघातिनी ॥ १०१॥ ध्वान्तसम्मर्दिनी धौतकौशेयी ध्वाङ्क्षवाहना
    । नक्तञ्चरचमूभक्षा नकुलीशप्रपूजिता ॥ १०२॥ नक्षत्रमालिनी नक्रघातिनी नखरायुधा । नागाम्बा नागभगिनी नगजा
    नगनन्दिनी ॥ १०३॥ नटेश्वरप्रिया नाट्यविद्या नन्दा नटेश्वरी । नन्दिकेश्वरपृष्ठस्था नन्दजा नन्दनन्दिनी
    ॥ १०४॥ नभोमण्डलदीपास्या नभोद्वीपसमस्वरा । नरकेष्टा नरकान्तकरी नरकदेवता ॥ १०५॥ नरनारायणाराध्या नरविष्वणनाशिनी
    । नरमेधप्रिया नाकनायिका नहुषप्रिया ॥ १०६॥ नवोद्धृतसुगन्धा च नवरात्रसमर्चिता । नानानुष्ठानसद्रूपा नागारातीशवल्लभा
    ॥ १०७॥ नारायणी निराकारा निकषात्मजवैरिणी । निकुम्भिला निग्रहेशी निग्रहेश्वरकामिनी ॥ १०८॥ निग्रहागमसन्तुष्टा
    निग्रहागमपूजिता । निःशेषनिग्रहाध्यक्षा निग्रहाज्ञाप्रवर्त्तिनी ॥ १०९॥ निग्रहाचार्यवरदा निग्रहाचार्यरक्षिणी
    । निग्रहानुग्रहकरी निग्रही निग्रहेश्वरी ॥ ११०॥ निग्रहाचारनिपुणा दुष्टनिग्रहकारिका । निरालम्बा निरम्बा
    च निर्गुणा निरवग्रहा ॥ १११॥ निर्विकल्पसमाधिस्था निर्विण्णा निवराकृतिः । निवातकवचत्रासकारिणी च निषद्वरी
    ॥ ११२॥ निलिम्पनिर्झरी नीतिर्नीतिशास्त्रविशारदा । निशुम्भशुम्भहननी नीलगीर्नीलकुन्तला ॥ ११३॥ नीलाचलनिवासा
    च नीलमाधवगेहिनी । नीलाब्जवदना नीललोहितेश्वरवल्लभा ॥ ११४॥ नृसिंहरूपिणी न्यक्षघातिनी निगमस्तुता । पञ्चप्रेतासनारूढा
    पञ्चकृत्यविधायिनी ॥ ११५॥ पञ्चाननसमारूढा पञ्चाननरतिप्रिया । पञ्चाम्नायमहाविद्या पञ्चमाननकृन्तनी ॥ ११६॥
    प्रजापतिप्रिया पञ्चाङ्गुलिः पञ्चार्थदायिनी । पञ्चाथर्वशिरोमन्त्रसिद्धिदा प्रियवादिनी ॥ ११७॥ पञ्चकोषस्थिता
    पञ्चायतनस्था च पञ्चधा । पञ्चरात्रस्तुता पञ्चक्लेशहन्त्री च पण्डिता ॥ ११८॥ प्रकृतिश्च प्लवङ्गेन्द्रमहासैन्यप्रपूजिता
    । फेत्कारिणी फलाध्यक्षा फलदा फाल्गुनप्रिया ॥ ११९॥ बकजिद्रक्षिणी बल्या बकघ्नी बडवामुखी । बलभद्रप्रिया
    बाला बगला बलवर्द्धिनी ॥ १२०॥ बलिन्दमशिरच्छेत्री बलारातिजयप्रदा । बाणगङ्गा बाणमाता बाणासुरनिपातिनी
    ॥ १२१॥ बाभ्रवी बालसन्ध्या च बलिदानप्रिया बला । बालार्कमण्डलाभासा बिल्ववृक्षनिवासिनी ॥ १२२॥ ब्रह्मकर्मसमाधिस्था
    बौद्धपाखण्डखण्डिनी । ब्रह्मज्ञा ब्रह्मरमणी ब्रह्माणी ब्रह्मचारिणी ॥ १२३॥ ब्रह्मज्ञानप्रदात्री च ब्रह्मदण्डप्रहारिणी
    । ब्रह्मनिर्वाणरूपा च ब्रह्मराक्षसभीतिहा ॥ १२४॥ ब्रह्मर्षिपूजिता ब्रह्मविद्या ब्रह्मस्वरूपिणी । ब्रह्मवेदस्तुता
    ब्रह्मसूत्रा ब्रह्मवरप्रदा ॥ १२५॥ ब्रह्मास्त्रविद्या ब्रह्मास्त्रस्तम्भिनी ब्रह्मघातिनी । भक्तिर्भगवती
    भक्तवाञ्छासङ्कल्पपादपा ॥ १२६॥ भगीरथसुता भक्तपालिनी भगमालिनी । भण्डासुरनिहन्त्री च भद्रकाली भयप्रदा
    ॥ १२७॥ भद्रा भद्रहरा भद्रप्रदा भद्रेश्वरप्रिया । भद्रात्मजधरा भद्राश्रयसञ्चर्चितस्तनी ॥ १२८॥ भरद्वाजस्तुता
    भव्या भारती भरतप्रसूः । भर्गोयुक्ता भगाकारा भरतप्राणरक्षिणी ॥ १२९॥ भवप्रिया भवानी च भवदा भवनाशिनी
    । भस्मासुरविनाशा च भस्माचलनिवासिनी ॥ १३०॥ भार्गवी भार्गवाराध्या भाष्यकारवरप्रदा । भास्करेष्टा भागवतश्लोकचारित्रवर्द्धिनी
    ॥ १३१॥ भूतात्मिका भूतहन्त्री भीमा भीमपराक्रमा । भूतभूमिविहारा च भूतनी भूतनायिका ॥ १३२॥ भृङ्गीशार्द्धशरीरस्था
    भूपुत्री भिल्लसुन्दरी । भेरुण्डा भैरवी भोगावली भैरववल्लभा ॥ १३३॥ मकरस्था मगाराध्या मकरध्वजवर्द्धिनी
    । मङ्गलाङ्गी महामाया माधवी मगधेश्वरी ॥ १३४॥ मत्स्योदरी मत्स्यगन्धा मणिद्वीपाधिदेवता । मत्तेभगमना मत्ता
    मातङ्गी मणिकर्णिका ॥ १३५॥ मदना मदनावस्था मदनायुधरूपिणी । मदिराक्षी च मनसा मीनाक्षी मदनोत्सवा ॥ १३६॥
    मायाविनी मनोगुप्ता मन्त्रजिह्वा मनस्विनी । मन्दाकिनी महाकाली मर्यादा च महोदरी ॥ १३७॥ महालक्ष्मीर्महाकालप्रिया
    मार्त्तण्डभैरवी । महिषघ्नी महापापहरा महिषमर्दिनी ॥ १३८॥ मायासीता महाकौलज्ञानदात्री महाशया । माहेश्वरी
    च माकातारूपिणी मानसालया ॥ १३९॥ मूर्द्धाभिषिक्तहर्म्यस्था मुरलीधरमोहिनी । मूलाधारस्थिता मूलप्रकृतिर्मेनकात्मजा
    ॥ १४०॥ महारुद्रप्रिया मेना मैनाकाद्रिसहोदरा । माङ्गल्यदा महारात्रिर्मोहरात्रिश्च मोहिनी ॥ १४१॥ यक्षिणी
    यक्षरात्रिश्च यज्ञनारायणप्रसूः । यज्ञनारायणाराध्या यज्ञनारायणप्रिया ॥ १४२॥ यज्ञोपवीतिनी यज्ञपशुस्वर्गसुखप्रदा
    । यथाशास्त्रसदाचारा यथार्थफलदायिनी ॥ १४३॥ यादवेन्द्रकुलाराध्या यादवेन्द्रवरप्रदा । यमी यामवती यामी
    यमपत्नी यशस्विनी ॥ १४४॥ युवती युद्धदक्षा च युधिष्ठिरप्रपूजिता । योनिमुद्रा योगमाया योगनिद्रा च योगिनी
    ॥ १४५॥ योगीश्वरी च योगस्था योगेश्वरनमस्कृता । योगेश्वरी च रक्ताक्षी रक्तबीजाशनी रमा ॥ १४६॥ रक्तवस्त्रा
    रक्तजिह्वा रक्ताङ्गी रक्तदन्तिका । रक्षोघ्नी रक्षिका रक्षोजननी रङ्गनायिका ॥ १४७॥ रजताद्रिनिवासा च
    रजनीचरवल्लभा । रजनीकरदारा च रजनीचरनाशिनी ॥ १४८॥ रणालङ्करणप्रेमा रणस्थानविहारिणी । रतार्थिनी रती रण्डा
    रतिमन्दिरसुन्दरी ॥ १४९॥ रत्नपारायणध्वंसकरी रत्नाकरप्रिया । रत्नपारायणावासा रत्नाभरणभूषिता ॥ १५०॥ रथक्रान्तागमाराध्या
    रथाङ्गायुधयोधिनी । रथाङ्गपाणिरमणी रमणी रमणप्रिया ॥ १५१॥ रसातलनिवासा च रसज्ञा रविलोचना । रसवारिधिमध्यस्था
    रासेशी रसिकेश्वरी ॥ १५२॥ रसेश्वरी रसास्वादा राक्षसेन्द्रवरप्रदा । राधिका राजलक्ष्मीश्च राक्षसेन्द्रविनाशिनी
    ॥ १५३॥ रामस्तुता राममाता रामचन्द्रजयप्रदा । रामाङ्घ्रिपाविता रामभगिनी रामवल्लभा ॥ १५४॥ रामारातिविनाशा
    च रामदूतवरप्रदा । रामायणकथावक्त्री राघवानन्यरूपिणी ॥ १५५॥ रासभस्था रिपुद्रोहा रासमण्डलनायिका । रुक्मिणी
    रुक्मवर्णा च रुक्मिणीसुतवल्लभा ॥ १५६॥ रुद्राक्षमालिनी रुद्रगेहिनी रोगहारिणी । रुद्राणी रुद्रचण्डी
    च रेणुका रिपुभक्षिणी ॥ १५७॥ लक्ष्मीर्लज्जा लोकमाता लोपामुद्रा च लङ्किनी । लाक्षारुणा लोककान्ता ललिता
    ललितप्रिया ॥ १५८॥ लक्ष्मणप्रेयसी लक्ष्यभेदिनी लवणान्तका । लतासाधनसम्पूज्या लोहितस्रवमण्डिता ॥ १५९॥
    लोकघ्नी लोकजननी वामाचारपरायणा । वाराही वङ्गदेशस्था वज्रिणी वज्रकालिका ॥ १६०॥ वज्रज्वाला तथा वज्रवाराही
    वज्रश
