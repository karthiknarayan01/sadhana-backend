id: jagannatha-1
category: stotram
name:
  english: jagannatha 1
  devanagari: जगन्नाथ १
content:
  english: kshamo yadi bhavet karunyasindhustada || 2|| anathasya jagannatha nathastvam me na samshayah
    | yasya natho jagannathastasya duhkham katham prabho || 3|| ya tvara draupaditrane ya tvara gajamokshane
    | mayyarte karunamurte sa tvara kva gata hare || 4|| matsamo pataki nasti tvatsamo nasti papaha |
    iti vijnaya devesha yathayogyam tatha kuru || 5||
  devanagari: क्षमो यदि भवेत् कारुण्यसिन्धुस्तदा ॥ २॥ अनाथस्य जगन्नाथ नाथस्त्वं मे न संशयः । यस्य नाथो
    जगन्नाथस्तस्य दुःखं कथं प्रभो ॥ ३॥ या त्वरा द्रौपदीत्राणे या त्वरा गजमोक्षणे । मय्यार्ते करुणामूर्ते
    सा त्वरा क्व गता हरे ॥ ४॥ मत्समो पातकी नास्ति त्वत्समो नास्ति पापहा । इति विज्ञाय देवेश यथायोग्यं
    तथा कुरु ॥ ५॥
meaning: {}
