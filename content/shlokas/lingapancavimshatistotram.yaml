id: lingapancavimshatistotram
category: stotram
name:
  english: lingapancavimshatistotram
  devanagari: लिन्गपन्चविंशतिस्तोत्रम्
content:
  english: managhamanantamabadhitalingam | munijanamanuvanajasthitalingam tam bhaja vishveshvarashivalingam
    || 18|| mananavihinamanonmanalingam vinutavishuddhasanatanalingam | jananavinashamanakulalingam tam
    bhaja vishveshvara shivalingam || 19|| sphutataramodasureshvaralingam patutarahathayogapriyalingam
    | vatatarumulatatalayalingam tam bhaja vishveshvarashivalingam || 20|| ugrakaramanugrahalingam nigraharupamanugrahalingam
    | vyaghrapadarcitamagrajalingam tam bhaja vishveshvarashivalingam || 21|| ikshanaduranirikshanalingam
    sukshmamajaramanapekshita
  devanagari: मनघमनन्तमबाधितलिङ्गम् । मुनिजनमनुवनजस्थितलिङ्गं तं भज विश्वेश्वरशिवलिङ्गम् ॥ १८॥ मननविहीनमनोन्मनलिङ्गं
    विनुतविशुद्धसनातनलिङ्गम् । जननविनाशमनाकुललिङ्गं तं भज विश्वेश्वर शिवलिङ्गम् ॥ १९॥ स्फुटतरमोदसुरेश्वरलिङ्गं
    पटुतरहठयोगप्रियलिङ्गम् । वटतरुमूलतटालयलिङ्गं तं भज विश्वेश्वरशिवलिङ्गम् ॥ २०॥ उग्राकारमनुग्रहलिङ्गं
    निग्रहरूपमनुग्रहलिङ्गम् । व्याघ्रपदार्चितमग्रजलिङ्गं तं भज विश्वेश्वरशिवलिङ्गम् ॥ २१॥ ईक्षणदूरनिरीक्षणलिङ्गं
    सूक्ष्ममजरमनपेक्षित
meaning: {}
