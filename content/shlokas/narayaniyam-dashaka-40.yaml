id: narayaniyam-dashaka-40
category: stotram
name:
  english: Narayaniyam Dashaka 40
content:
  english: tadanu nandamamandashubhaspadam nripapurim karadanakrite gatam| samavalokya jagada bhavatpita
    viditakamsasahayajanodyamah || || ayi sakhe tava balakajanma mam sukhayate'dya nijatmajajanmavat |
    iti bhavatpitritam vrajanayake samadhiropya shashamsa tamadarat || || iha ca santyanimittashatani
    te katakasimni tato laghu gamyatam | iti ca tadvacasa vrajanayako bhavadapayabhiya drutamayayau ||
    || avasare khalu tatra ca kacana vrajapade madhurakritirangana | taralashatpadalalitakuntala kapatapotaka
    te nikatam gata || || sapadi sa hritabalakacetana nishicaranvayaja kila putana | vrajavadhushviha
    keyamiti kshanam vimrishatishu bhavantamupadade || || lalitabhavavilasahritatmabhiryuvatibhih pratiroddhumaparita
    | stanamasau bhavanantanishedushi pradadushi bhavate kapatatmane || || samadhiruhya tadankamashankitastvamatha
    balakalopanaroshitah | mahadivamraphalam kucamandalam praticucushitha durvishadushitam || || asubhireva
    samam dhayati tvayi stanamasau stanitopamanisvana | nirapatadbhayadayi nijam vapuh pratigata pravisarya
    bhujavubhau || || bhayadaghoshanabhishanavigrahashravanadarshanamohitavallave | vrajapade tadurahsthalakhelanam
    nanu bhavantamagrihnata gopikah || || bhuvanamangalanamabhireva te yuvatibhirbahudha kritarakshanah
    | tvamayi vataniketananatha mamagadayan kuru tavakasevakam ||
  devanagari: तदनु नन्दममन्दशुभास्पदं नृपपुरीं करदानकृते गतम्। समवलोक्य जगाद भवत्पिता विदितकंससहायजनोद्यमः
    ॥ ॥ अयि सखे तव बालकजन्म मां सुखयतेऽद्य निजात्मजजन्मवत् । इति भवत्पितृतां व्रजनायके समधिरोप्य शशंस
    तमादरात् ॥ ॥ इह च सन्त्यनिमित्तशतानि ते कटकसीम्नि ततो लघु गम्यताम् । इति च तद्वचसा व्रजनायको भवदपायभिया
    द्रुतमाययौ ॥ ॥ अवसरे खलु तत्र च काचन व्रजपदे मधुराकृतिरङ्गना । तरलषट्पदलालितकुन्तला कपटपोतक ते निकटं
    गता ॥ ॥ सपदि सा हृतबालकचेतना निशिचरान्वयजा किल पूतना । व्रजवधूष्विह केयमिति क्षणं विमृशतीषु भवन्तमुपाददे
    ॥ ॥ ललितभावविलासहृतात्मभिर्युवतिभिः प्रतिरोद्धुमपारिता । स्तनमसौ भवनान्तनिषेदुषी प्रददुषी भवते कपटात्मने
    ॥ ॥ समधिरुह्य तदङ्कमशङ्कितस्त्वमथ बालकलोपनरोषितः । महदिवाम्रफलं कुचमण्डलं प्रतिचुचूषिथ दुर्विषदूषितम्
    ॥ ॥ असुभिरेव समं धयति त्वयि स्तनमसौ स्तनितोपमनिस्वना । निरपतद्भयदायि निजं वपुः प्रतिगता प्रविसार्य
    भुजावुभौ ॥ ॥ भयदघोषणभीषणविग्रहश्रवणदर्शनमोहितवल्लवे । व्रजपदे तदुरःस्थलखेलनं ननु भवन्तमगृह्णत गोपिकाः
    ॥ ॥ भुवनमङ्गलनामभिरेव ते युवतिभिर्बहुधा कृतरक्षणः । त्वमयि वातनिकेतननाथ मामगदयन् कुरु तावकसेवकम् ॥
