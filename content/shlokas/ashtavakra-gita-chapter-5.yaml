id: ashtavakra-gita-chapter-5
category: stotram
name:
  english: Ashtavakra Gita Chapter 5
content:
  english: ashtavakra uvaca || na te sango'sti kenapi kim shuddhastyaktumicchasi | sanghatavilayam kurvannevameva
    layam vraja || || udeti bhavato vishvam varidheriva budbudah | iti jnatvaikamatmanamevameva layam
    vraja || || pratyakshamapyavastutvad vishvam nastyamale tvayi | rajjusarpa iva vyaktamevameva layam
    vraja || || samaduhkhasukhah purna ashanairashyayoh samah | samajivitamrityuh sannevameva layam vraja
    ||
  devanagari: अष्टावक्र उवाच ॥ न ते सङ्गोऽस्ति केनापि किं शुद्धस्त्यक्तुमिच्छसि । सङ्घातविलयं कुर्वन्नेवमेव
    लयं व्रज ॥ ॥ उदेति भवतो विश्वं वारिधेरिव बुद्बुदः । इति ज्ञात्वैकमात्मानमेवमेव लयं व्रज ॥ ॥ प्रत्यक्षमप्यवस्तुत्वाद्
    विश्वं नास्त्यमले त्वयि । रज्जुसर्प इव व्यक्तमेवमेव लयं व्रज ॥ ॥ समदुःखसुखः पूर्ण आशानैराश्ययोः समः
    । समजीवितमृत्युः सन्नेवमेव लयं व्रज ॥
