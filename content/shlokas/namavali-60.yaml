id: namavali-60
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: namah | om bhrumadhye samsthitaya namah | om nadamadhyasthitaya namah | 50 || om candrabimbasthitaya
    namah | om shivaya namah | om shivadehine namah | om vahnisomarkarupaya namah | om trimshacchaktisvarupine
    namah | om trimatrapranavaya namah | om tridhamasthitaye namah | om sadashivaya namah | om shantaya
    namah | om maheshaya namah | 60 || om pinakine namah | om sarvajnaya namah | om sharanyaya namah |
    om sadyojataya namah | om aghoraya namah | om vamadevaya namah | om tatpurshaya namah | om ishanaya
    namah | om ananteshaya namah | om sukshmaya namah | 70 || om utapaya namah | om ekakshaya namah |
    om ekarudraya namah | om trimurtaye namah | om shrikanthaya namah | om shikhandine namah | om anantasanasamsthaya
    namah | om sarvadaya namah | om gadabhrite namah | om vimalaya namah | 80 || om vishalaya namah |
    om vimalangaya namah | om vedagamartharupaya namah | om yogasankhyarataya namah | om yogasamsthaya
    namah | om divyaya namah | om yogine namah | om yogadayine namah | om samastashokasamhartre namah
    | om drigdrishyatitatejase namah | 90 || om pratyaharaya namah | om shuddhaya namah | om yamaya namah
    | om niyamaya namah | om dhyanadhyeyaya namah | om duraya namah | om nirvyaparaya namah | om alingine
    namah | om lingaya namah | om lingasthanaya namah | 100 || || iti shivarahasyavyutpannam paushyamasakrite
    shivashatashtanamavalih sampurna ||
  devanagari: नमः । ॐ भ्रूमध्ये संस्थिताय नमः । ॐ नादमध्यस्थिताय नमः । ५० ॥ ॐ चन्द्रबिम्बस्थिताय नमः ।
    ॐ शिवाय नमः । ॐ शिवदेहिने नमः । ॐ वह्निसोमार्करूपाय नमः । ॐ त्रिंशच्छक्तिस्वरूपिणे नमः । ॐ त्रिमात्रप्रणवाय
    नमः । ॐ त्रिधामस्थितये नमः । ॐ सदाशिवाय नमः । ॐ शान्ताय नमः । ॐ महेशाय नमः । ६० ॥ ॐ पिनाकिने नमः ।
    ॐ सर्वज्ञाय नमः । ॐ शरण्याय नमः । ॐ सद्योजाताय नमः । ॐ अघोराय नमः । ॐ वामदेवाय नमः । ॐ तत्पूर्षाय
    नमः । ॐ ईशानाय नमः । ॐ अनन्तेशाय नमः । ॐ सूक्ष्माय नमः । ७० ॥ ॐ उतपाय नमः । ॐ एकाक्षाय नमः । ॐ एकरुद्राय
    नमः । ॐ त्रिमूर्तये नमः । ॐ श्रीकण्ठाय नमः । ॐ शिखण्डिने नमः । ॐ अनन्तासनसंस्थाय नमः । ॐ सर्वदाय नमः
    । ॐ गदाभृते नमः । ॐ विमलाय नमः । ८० ॥ ॐ विशालाय नमः । ॐ विमलाङ्गाय नमः । ॐ वेदागमार्थरूपाय नमः । ॐ
    योगसाङ्ख्यरताय नमः । ॐ योगसंस्थाय नमः । ॐ दिव्याय नमः । ॐ योगिने नमः । ॐ योगदायिने नमः । ॐ समस्तशोकसंहर्त्रे
    नमः । ॐ दृग्दृश्यातीततेजसे नमः । ९० ॥ ॐ प्रत्याहाराय नमः । ॐ शुद्धाय नमः । ॐ यमाय नमः । ॐ नियमाय नमः
    । ॐ ध्यानध्येयाय नमः । ॐ दूराय नमः । ॐ निर्व्यापाराय नमः । ॐ अलिङ्गिने नमः । ॐ लिङ्गाय नमः । ॐ लिङ्गस्थानाय
    नमः । १०० ॥ ॥ इति शिवरहस्यव्युत्पन्नं पौष्यमासकृते शिवशताष्टनामावलिः सम्पूर्णा ॥
