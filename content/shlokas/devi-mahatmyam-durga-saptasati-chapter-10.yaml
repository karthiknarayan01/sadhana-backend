id: devi-mahatmyam-durga-saptasati-chapter-10
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 10
content:
  english: shumbhovadho nama dashamo'dhyayah || rishiruvaca|| || nishumbham nihatam drishtva bhratarampranasammitam|
    hanyamanam balam caiva shumbah kriddho'bravidvacah || || balavalepadushte tvam ma durge garva mavaha|
    anyasam balamashritya yuddyase catimanini || || ekaivaham jagatyatra dvitiya ka mamapara| pashyaita
    dushta mayyeva vishantyo madvibhutayah || || tatah samastasta devyo brahmani pramukhalayam| tasya
    devyastanau jagmurekaivasittadambika || || aham vibhutya bahubhiriha rupairyadasthita| tatsamhritam
    mayaikaiva tishtamyajau sthiro bhava || || tatah pravavrite yuddham devyah shumbhasya cobhayoh| pashyatam
    sarvadevanam asuranam ca darunam || || shara varshaih shitaih shastraistatha castraih sudarunaih|
    tayoryuddamabhudbhuyah sarvalokabhayajnkaram || || divyanyashtrani shatasho mumuce yanyathambika|
    babhajna tani daityendrastatpratighatakartribhih || || muktani tena castrani divyani parameshvari|
    babhanja lilayaivogra hujkaroccaranadibhih|| || tatah sharashatairdevim accadayata so'surah| sapi
    tatkupita devi dhanushcichceda ceshubhih|| || cinne dhanushi daityendrastatha shaktimathadade| cichceda
    devi cakrena tamapyasya karesthitam|| || tatah khadga mupadaya shata candram ca bhanumat| abhyadhavattada
    devim daityanamadhipeshvarah|| || tasyapatata evashu khadgam ciccheda candika| dhanurmuktaih shitairbanaishcarma
    carkakaramalam|| || hatashvah patata evashu khadgam cichceda candika| jagraha mudgaram ghoram ambikanidhanodyatah||
    || cicchedapatatastasya mudgaram nishitaih sharaih| tathapi so'bhyadhavattam mushtimudyamyavegavan||
    || sa mushtim patayamasa hridaye daitya pungavah| devyastam capi sa devi tale no rasya tadayat|| ||
    talapraharabhihato nipapata mahitale| sa daityarajah sahasa punareva tathotthitah|| || utpatya ca
    pragrihyoccair devim gaganamasthitah| tatrapi sa niradhara yuyudhe tena candika|| || niyuddham khe
    tada daitya shcandika ca parasparam| cakratuh pradhamam siddha munivismayakarakam|| || tato niyuddham
    suciram kritva tenambika saha| utpatya bhramayamasa cikshepa dharanitale|| || sakshiptodharanim prapya
    mushtimudyamya vegavan| abhyadhavata dushtatma candikanidhanecchaya|| || tamayantam tato devi sarvadaityajanesharvam|
    jagatyam patayamasa bhitva shulena vakshasi|| || sa gatasuh papatorvyam devishulagravikshatah| calayan
    sakalam prithvim sabdidvipam saparvatam || || tatah prasanna makhilam hate tasmin duratmani| jagatsvasthyamativapa
    nirmalam cabhavannabhah || || utpatameghah solka yepragasamste shamam yayuh| sarito margavahinyastathasamstatra
    patite || || tato deva ganah sarve harsha nirbharamanasah| babhuvurnihate tasmin gandarva lalitam
    jaguh|| || avadayam stathaivanye nanritushcapsaroganah| vavuh punyastatha vatah suprabho' bhuddhivakarah||
    || jajvalushcagnayah shantah shantadigjanitasvanah|| || || svasti shri markandeya purane savarnikemanvantare
    devi mahatmye shumbhovadho nama dashamo dhyayah samaptam || ahuti om klim jayanti sangayai sashaktikayai
    saparivarayai savahanayai kameshvaryai mahahutim samarpayami namah svaha ||
  devanagari: शुम्भोवधो नाम दशमोऽध्यायः ॥ ऋषिरुवाच॥ ॥ निशुम्भं निहतं दृष्ट्वा भ्रातरम्प्राणसम्मितं। हन्यमानं
    बलं चैव शुम्बः कृद्धोऽब्रवीद्वचः ॥ ॥ बलावलेपदुष्टे त्वं मा दुर्गे गर्व मावह। अन्यासां बलमाश्रित्य
    युद्द्यसे चातिमानिनी ॥ ॥ एकैवाहं जगत्यत्र द्वितीया का ममापरा। पश्यैता दुष्ट मय्येव विशन्त्यो मद्विभूतयः
    ॥ ॥ ततः समस्तास्ता देव्यो ब्रह्माणी प्रमुखालयम्। तस्या देव्यास्तनौ जग्मुरेकैवासीत्तदाम्बिका ॥ ॥ अहं
    विभूत्या बहुभिरिह रूपैर्यदास्थिता। तत्संहृतं मयैकैव तिष्टाम्याजौ स्थिरो भव ॥ ॥ ततः प्रववृते युद्धं
    देव्याः शुम्भस्य चोभयोः। पश्यतां सर्वदेवानां असुराणां च दारुणम् ॥ ॥ शर वर्षैः शितैः शस्त्रैस्तथा चास्त्रैः
    सुदारुणैः। तयोर्युद्दमभूद्भूयः सर्वलोकभयज्ञ्करम् ॥ ॥ दिव्यान्यश्त्राणि शतशो मुमुचे यान्यथाम्बिका।
    बभज्ञ तानि दैत्येन्द्रस्तत्प्रतीघातकर्तृभिः ॥ ॥ मुक्तानि तेन चास्त्राणि दिव्यानि परमेश्वरी। बभञ्ज
    लीलयैवोग्र हूज्कारोच्चारणादिभिः॥ ॥ ततः शरशतैर्देवीं आच्चादयत सोऽसुरः। सापि तत्कुपिता देवी धनुश्चिछ्चेद
    चेषुभिः॥ ॥ चिन्ने धनुषि दैत्येन्द्रस्तथा शक्तिमथाददे। चिछ्चेद देवी चक्रेण तामप्यस्य करेस्थिताम्॥ ॥
    ततः खड्ग मुपादाय शत चन्द्रं च भानुमत्। अभ्यधावत्तदा देवीं दैत्यानामधिपेश्वरः॥ ॥ तस्यापतत एवाशु खड्गं
    चिच्छेद चण्डिका। धनुर्मुक्तैः शितैर्बाणैश्चर्म चार्ककरामलम्॥ ॥ हताश्वः पतत एवाशु खड्गं चिछ्चेद चण्डिका।
    जग्राह मुद्गरं घोरं अम्बिकानिधनोद्यतः॥ ॥ चिच्छेदापततस्तस्य मुद्गरं निशितैः शरैः। तथापि सोऽभ्यधावत्तं
    मुष्टिमुद्यम्यवेगवान्॥ ॥ स मुष्टिं पातयामास हृदये दैत्य पुङ्गवः। देव्यास्तं चापि सा देवी तले नो रस्य
    ताडयत्॥ ॥ तलप्रहाराभिहतो निपपात महीतले। स दैत्यराजः सहसा पुनरेव तथोत्थितः॥ ॥ उत्पत्य च प्रगृह्योच्चैर्
    देवीं गगनमास्थितः। तत्रापि सा निराधारा युयुधे तेन चण्डिका॥ ॥ नियुद्धं खे तदा दैत्य श्चण्डिका च परस्परम्।
    चक्रतुः प्रधमं सिद्ध मुनिविस्मयकारकम्॥ ॥ ततो नियुद्धं सुचिरं कृत्वा तेनाम्बिका सह। उत्पाट्य भ्रामयामास
    चिक्षेप धरणीतले॥ ॥ सक्षिप्तोधरणीं प्राप्य मुष्टिमुद्यम्य वेगवान्। अभ्यधावत दुष्टात्मा चण्डिकानिधनेच्छया॥
    ॥ तमायन्तं ततो देवी सर्वदैत्यजनेशर्वम्। जगत्यां पातयामास भित्वा शूलेन वक्षसि॥ ॥ स गतासुः पपातोर्व्यां
    देवीशूलाग्रविक्षतः। चालयन् सकलां पृथ्वीं साब्दिद्वीपां सपर्वताम् ॥ ॥ ततः प्रसन्न मखिलं हते तस्मिन्
    दुरात्मनि। जगत्स्वास्थ्यमतीवाप निर्मलं चाभवन्नभः ॥ ॥ उत्पातमेघाः सोल्का येप्रागासंस्ते शमं ययुः। सरितो
    मार्गवाहिन्यस्तथासंस्तत्र पातिते ॥ ॥ ततो देव गणाः सर्वे हर्ष निर्भरमानसाः। बभूवुर्निहते तस्मिन् गन्दर्वा
    ललितं जगुः॥ ॥ अवादयं स्तथैवान्ये ननृतुश्चाप्सरोगणाः। ववुः पुण्यास्तथा वाताः सुप्रभोऽ भूद्धिवाकरः॥
    ॥ जज्वलुश्चाग्नयः शान्ताः शान्तदिग्जनितस्वनाः॥ ॥ ॥ स्वस्ति श्री मार्कण्डेय पुराणे सावर्निकेमन्वन्तरे
    देवि महत्म्ये शुम्भोवधो नाम दशमो ध्यायः समाप्तम् ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै
    सवाहनायै कामेश्वर्यै महाहुतिं समर्पयामि नमः स्वाहा ॥
