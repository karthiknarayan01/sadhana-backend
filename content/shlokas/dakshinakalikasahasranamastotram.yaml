id: dakshinakalikasahasranamastotram
category: stotram
name:
  english: dakshinakalikasahasranamastotram
  devanagari: दक्षिणकालिकासहस्रनामस्तोत्रम्
content:
  english: ka jnanini jyeshtha bhushundi prakatatithih || 80|| dravini gopani maya kamabijeshvari kriya
    | shambhavi kekara mena musalastra tilottama || 81|| ameyavikrama krura sampatshala trilocana | susthi
    havyavaha pritirushma dhumrarcirangada || 82|| tapini tapini vishva bhogada dharini dhara | trikhanda
    bodhini vashya sakala shabdarupini || 83|| bijarupa mahamudra yogini yonirupini | anangakusumanangamekhalanangarupini
    || 87|| vajreshvari ca jayini sarvadvandvakshayankari | shadangayuvati yogayukta jvalamshumalini ||
    88|| durashaya duradhara durjaya durgarupini | duranta dushkritihara durdhyeya duratikrama || 89||
    hamseshvari trikonastha shakambharyyanukampini | trikonanilaya nitya paramamritaranjita || 90|| mahavidyeshvari
    shveta bherunda kulasundari | tvarita bhaktisamsakta bhaktavashya sanatani || 91|| bhaktanandamayi
    bhaktabhavika bhaktashankari | sarvasaundaryyanilaya sarvasaubhagyashalini || 92|| sarvasambhogabhavana
    sarvasaukhyanirupini | kumaripujanarata kumarivratacarini || 93|| kumaribhaktisukhini kumarirupadharini
    | kumaripujakaprita kumaripritida priya || 94|| kumarisevakasanga kumarisevakalaya | anandabhairavi
    bala bhairavi vatubhairavi || 95|| shmashanabhairavi kalabhairavi purabhairavi | mahabhairavapatni
    ca paramanandabhairavi || 96|| sudhanandabhairavi ca unmadanandabhairavi | muktanandabhairavi ca tatha
    tarunabhairavi || 97|| jnananandabhairavi ca amritanandabhairavi | mahabhayankari tivra tivravega
    tapasvini || 98|| tripura parameshani sundari purasundari | tripureshi pancadashi pancami puravasini
    || 99|| mahasaptadashi caiva shodashi tripureshvari | mahankushasvarupa ca mahacakreshvari tatha ||
    100|| navacakreshvari cakreshvari tripuramalini | rajarajeshvari dhira mahatripurasundari || 101||
    sindurapurarucira shrimattripurasundari | sarvangasundari rakta raktavastrottariyini || 102|| javayavakasinduraraktacandanadharini
    | javayavakasinduraraktacandanarupadhrik || 103|| camaribalakutilanirmalashyamakeshini | vajramauktikaratnadhyakiritamukutojjvala
    || 104|| ratnakundalasamsaktasphuradgandamanorama | kunjareshvarakumbhotthamuktaranjitanasika || 105||
    muktavidrumamanikyaharadhyastanamandala | suryyakantendukantadhyasparshashmakanthabhushana || 106||
    bijapurasphuradbijadantapanktiranuttama | kamakodandakabhugnabhrukatakshapravarshini || 107|| matangakumbhavakshoja
    lasatkokanadekshana | manojnashashkulikarna hamsigatividambini || 108|| padmaragangadajyotirdoshcatushkaprakashini
    | nanamaniparisphurjacchuddhakancanakankana || 109|| nagendradantanirmanavalayankitapanini | anguriyakacitrangi
    vicitrakshudraghantika || 110|| pattambaraparidhana kalamanjirashinjini | karpuragurukasturikunkamadravalepita
    || 111|| vicitraratnaprithivikalpashakhitalasthita | ratnadvipasphuradraktasimhasanavilasini || 112||
    shatcakrabhedanakari paramanandarupini | sahasradalapadmantashcandramandalavarttini || 113|| brahmarupashivakrodananasukhavilasini
    | haravishnuvirincindragrahanayakasevita || 114|| shiva shaiva ca rudrani tathaiva shivavadini | matangini
    shrimati ca tathaivanandamekhala || 115|| dakini yogini caiva tathopayogini mata | maheshvari vaishnavi
    ca bhramari shivarupini || 116|| alambusha vegavati krodharupa sumekhala | gandhari hastijihva ca
    ida caiva shubhankari || 117|| pingala brahmaduti ca sushumna caiva gandhini | atmayonirbrahmayonirjagadyonirayonija
    || 118|| bhagarupa bhagasthatri bhagini bhagarupini | bhagatmika bhagadhararupini bhagamalini || 119||
    lingakhya caiva lingeshi tripurabhairavi tatha | lingagitih sugitishca lingastha lingarupadhrik ||
    120|| lingamana lingabhava lingalinga ca parvati | bhagavati kaushiki ca prema caiva priyamvada ||
    121|| gridhrarupa shivarupa cakrini cakrarupadhrik | lingabhidhayini lingapriya linganivasini || 122||
    lingastha lingini lingarupini lingasundari | lingagitirmahaprita bhagagitirmahasukha || 123|| linganamasadananda
    bhaganamasadagatih | lingamalakanthabhusha bhagamalavibhushana || 124|| bhagalingamritaprita bhagalingamritatmika
    | bhagalingarcanaprita bhagalingasvarupini || 125|| bhagalingasvarupa ca bhagalingasukhavaha || 126||
    svayambhukusumaprita svayambhukusumarcita | svayambhukusumaprana svayambhukusumotthita | svayambhukusumasnata
    svayambhupushpatarpita || 127|| svayambhupushpaghatita svayambhupushpadharini | svayambhupushpatilaka
    svayambhupushpacarcita || 128|| svayambhupushpanirata svayambhukusumagraha | svayambhupushpayajnamsha
    svayambhukusumatmika || 129|| svayambhupushpanicita svayambhukusumapriya | svayambhukusumadanalalasonmattamanasa
    || 130|| svayambhukusumanandalaharisnigdhadehini | svayambhukusumadhara svayambhukusumakula || 131||
    svayambhupushpanilaya svayambhupushpavasini | svayambhukusumasnigdha svayambhukusumatmika || 132||
    svayambhupushpakarini svayambhupushpapanika | svayambhukusumadhyana svayambhukusumaprabha || 133||
    svayambhukusumajnana svayambhupushpabhogini | svayambhukusumollasa svayambhupushpavarshini || 134||
    svayambhukumumotsaha svayambhupushparupini | svayambhukusumonmada svayambhupushpasundari || 135||
    svayambhukusumaradhya svayambhukusumodbhava | svayambhukusumavyagra svayambhupushpapurnita || 136||
    svayambhupujakaprajna svayambhuhotrimatrika | svayambhudatrirakshitri svayambhuraktatarika || 137||
    svayambhupujakagrasta svayambhupujakapriya | svayambhuvandakadhara svayambhunindakantaka || 138||
    svayambhupradasarvasva svayambhupradaputtrini | svayambhupradasasmera svayambhupradasharirini | sarvakalodbhavaprita
    sarvakalodbhavatmika || 139|| sarvakalodbhavodbhava sarvakalodbhavodbhava | kundapushpasadapritirgolapushpasadaratih
    || 140|| kundagolodbhavaprana kundagolodbhavatmika | svayambhu
  devanagari: का ज्ञानिनी ज्येष्ठा भुशुण्डी प्रकटातिथिः ॥ ८०॥ द्रविणी गोपनी माया कामबीजेश्वरी क्रिया ।
    शाम्भवी केकरा मेना मूसलास्त्रा तिलोत्तमा ॥ ८१॥ अमेयविक्रमा क्रूरा सम्पत्शाला त्रिलोचना । सुस्थी हव्यवहा
    प्रीतिरुष्मा धूम्रार्चिरङ्गदा ॥ ८२॥ तपिनी तापिनी विश्वा भोगदा धारिणी धरा । त्रिखण्डा बोधिनी वश्या
    सकला शब्दरूपिणी ॥ ८३॥ बीजरूपा महामुद्रा योगिनी योनिरूपिणी । अनङ्गकुसुमानङ्गमेखलानङ्गरूपिणी ॥ ८७॥ वज्रेश्वरी
    च जयिनी सर्वद्वन्द्वक्षयङ्करी । षडङ्गयुवती योगयुक्ता ज्वालांशुमालिनी ॥ ८८॥ दुराशया दुराधारा दुर्जया
    दुर्गरूपिणी । दुरन्ता दुष्कृतिहरा दुर्ध्येया दुरतिक्रमा ॥ ८९॥ हंसेश्वरी त्रिकोणस्था शाकम्भर्य्यनुकम्पिनी
    । त्रिकोणनिलया नित्या परमामृतरञ्जिता ॥ ९०॥ महाविद्येश्वरी श्वेता भेरुण्डा कुलसुन्दरी । त्वरिता भक्तिसंसक्ता
    भक्तवश्या सनातनी ॥ ९१॥ भक्तानन्दमयी भक्तभाविका भक्तशङ्करी । सर्वसौन्दर्य्यनिलया सर्वसौभाग्यशालिनी
    ॥ ९२॥ सर्वसम्भोगभवना सर्वसौख्यनिरूपिणी । कुमारीपूजनरता कुमारीव्रतचारिणी ॥ ९३॥ कुमारीभक्तिसुखिनी कुमारीरूपधारिणी
    । कुमारीपूजकप्रीता कुमारीप्रीतिदा प्रिया ॥ ९४॥ कुमारीसेवकासङ्गा कुमारीसेवकालया । आनन्दभैरवी बाला भैरवी
    वटुभैरवी ॥ ९५॥ श्मशानभैरवी कालभैरवी पुरभैरवी । महाभैरवपत्नी च परमानन्दभैरवी ॥ ९६॥ सुधानन्दभैरवी च
    उन्मादानन्दभैरवी । मुक्तानन्दभैरवी च तथा तरुणभैरवी ॥ ९७॥ ज्ञानानन्दभैरवी च अमृतानन्दभैरवी । महाभयङ्करी
    तीव्रा तीव्रवेगा तपस्विनी ॥ ९८॥ त्रिपुरा परमेशानी सुन्दरी पुरसुन्दरी । त्रिपुरेशी पञ्चदशी पञ्चमी पुरवासिनी
    ॥ ९९॥ महासप्तदशी चैव षोडशी त्रिपुरेश्वरी । महाङ्कुशस्वरूपा च महाचक्रेश्वरी तथा ॥ १००॥ नवचक्रेश्वरी
    चक्रेश्वरी त्रिपुरमालिनी । राजराजेश्वरी धीरा महात्रिपुरसुन्दरी ॥ १०१॥ सिन्दूरपूररुचिरा श्रीमत्त्रिपुरसुन्दरी
    । सर्वाङ्गसुन्दरी रक्ता रक्तवस्त्रोत्तरीयिणी ॥ १०२॥ जवायावकसिन्दूररक्तचन्दनधारिणी । जवायावकसिन्दूररक्तचन्दनरूपधृक्
    ॥ १०३॥ चामरीबालकुटिलनिर्मलश्यामकेशिनी । वज्रमौक्तिकरत्नाढ्यकिरीटमुकुटोज्ज्वला ॥ १०४॥ रत्नकुण्डलसंसक्तस्फुरद्गण्डमनोरमा
    । कुञ्जरेश्वरकुम्भोत्थमुक्तारञ्जितनासिका ॥ १०५॥ मुक्ताविद्रुममाणिक्यहाराढ्यस्तनमण्डला । सूर्य्यकान्तेन्दुकान्ताढ्यस्पर्शाश्मकण्ठभूषणा
    ॥ १०६॥ बीजपूरस्फुरद्बीजदन्तपङ्क्तिरनुत्तमा । कामकोदण्डकाभुग्नभ्रूकटाक्षप्रवर्षिणी ॥ १०७॥ मातङ्गकुम्भवक्षोजा
    लसत्कोकनदेक्षणा । मनोज्ञशष्कुलीकर्णा हंसीगतिविडम्बिनी ॥ १०८॥ पद्मरागाङ्गदज्योतिर्दोश्चतुष्कप्रकाशिनी
    । नानामणिपरिस्फूर्जच्छुद्धकाञ्चनकङ्कना ॥ १०९॥ नागेन्द्रदन्तनिर्माणवलयाङ्कितपाणिनी । अङ्गुरीयकचित्राङ्गी
    विचित्रक्षुद्रघण्टिका ॥ ११०॥ पट्टाम्बरपरीधाना कलमञ्जीरशिञ्जिनी । कर्पूरागुरुकस्तूरीकुङ्कमद्रवलेपिता
    ॥ १११॥ विचित्ररत्नपृथिवीकल्पशाखितलस्थिता । रत्नद्वीपस्फुरद्रक्तसिंहासनविलासिनी ॥ ११२॥ षट्चक्रभेदनकरी
    परमानन्दरूपिणी । सहस्रदलपद्मान्तश्चन्द्रमण्डलवर्त्तिनी ॥ ११३॥ ब्रह्मरूपशिवक्रोडनानासुखविलासिनी । हरविष्णुविरिञ्चीन्द्रग्रहनायकसेविता
    ॥ ११४॥ शिवा शैवा च रुद्राणी तथैव शिववादिनी । मातङ्गिनी श्रीमती च तथैवानन्दमेखला ॥ ११५॥ डाकिनी योगिनी
    चैव तथोपयोगिनी मता । माहेश्वरी वैष्णवी च भ्रामरी शिवरूपिणी ॥ ११६॥ अलम्बुषा वेगवती क्रोधरूपा सुमेखला
    । गान्धारी हस्तिजिह्वा च ईडा चैव शुभङ्करी ॥ ११७॥ पिङ्गला ब्रह्मदूती च सुषुम्ना चैव गन्धिनी । आत्मयोनिर्ब्रह्मयोनिर्जगद्योनिरयोनिजा
    ॥ ११८॥ भगरूपा भगस्थात्री भगिनी भगरूपिणी । भगात्मिका भगाधाररूपिणी भगमालिनी ॥ ११९॥ लिङ्गाख्या चैव लिङ्गेशी
    त्रिपुराभैरवी तथा । लिङ्गगीतिः सुगीतिश्च लिङ्गस्था लिङ्गरूपधृक् ॥ १२०॥ लिङ्गमाना लिङ्गभवा लिङ्गलिङ्गा
    च पार्वती । भगवती कौशिकी च प्रेमा चैव प्रियंवदा ॥ १२१॥ गृध्ररूपा शिवारूपा चक्रिणी चक्ररूपधृक् । लिङ्गाभिधायिनी
    लिङ्गप्रिया लिङ्गनिवासिनी ॥ १२२॥ लिङ्गस्था लिङ्गिनी लिङ्गरूपिणी लिङ्गसुन्दरी । लिङ्गगीतिर्महाप्रीता
    भगगीतिर्महासुखा ॥ १२३॥ लिङ्गनामसदानन्दा भगनामसदागतिः । लिङ्गमालाकण्ठभूषा भगमालाविभूषणा ॥ १२४॥ भगलिङ्गामृतप्रीता
    भगलिङ्गामृतात्मिका । भगलिङ्गार्चनप्रीता भगलिङ्गस्वरूपिणी ॥ १२५॥ भगलिङ्गस्वरूपा च भगलिङ्गसुखावहा ॥
    १२६॥ स्वयम्भूकुसुमप्रीता स्वयम्भूकुसुमार्चिता । स्वयम्भूकुसुमप्राणा स्वयम्भूकुसुमोत्थिता । स्वयम्भूकुसुमस्नाता
    स्वयम्भूपुष्पतर्पिता ॥ १२७॥ स्वयम्भूपुष्पघटिता स्वयम्भूपुष्पधारिणी । स्वयम्भूपुष्पतिलका स्वयम्भूपुष्पचर्चिता
    ॥ १२८॥ स्वयम्भूपुष्पनिरता स्वयम्भूकुसुमग्रहा । स्वयम्भूपुष्पयज्ञांशा स्वयम्भूकुसुमात्मिका ॥ १२९॥ स्वयम्भूपुष्पनिचिता
    स्वयम्भूकुसुमप्रिया । स्वयम्भूकुसुमादानलालसोन्मत्तमानसा ॥ १३०॥ स्वयम्भूकुसुमानन्दलहरीस्निग्धदेहिनी
    । स्वयम्भूकुसुमाधारा स्वयम्भूकुसुमाकुला ॥ १३१॥ स्वयम्भूपुष्पनिलया स्वयम्भूपुष्पवासिनी । स्वयम्भूकुसुमस्निग्धा
    स्वयम्भूकुसुमात्मिका ॥ १३२॥ स्वयम्भूपुष्पकरिणी स्वयम्भूपुष्पपाणिका । स्वयम्भूकुसुमध्याना स्वयम्भूकुसुमप्रभा
    ॥ १३३॥ स्वयम्भूकुसुमज्ञाना स्वयम्भूपुष्पभोगिनी । स्वयम्भूकुसुमोल्लासा स्वयम्भूपुष्पवर्षिणी ॥ १३४॥
    स्वयम्भूकुमुमोत्साहा स्वयम्भूपुष्परूपिणी । स्वयम्भूकुसुमोन्मादा स्वयम्भूपुष्पसुन्दरी ॥ १३५॥ स्वयम्भूकुसुमाराध्या
    स्वयम्भूकुसुमोद्भवा । स्वयम्भूकुसुमव्यग्रा स्वयम्भूपुष्पपूर्णिता ॥ १३६॥ स्वयम्भूपूजकप्रज्ञा स्वयम्भूहोतृमातृका
    । स्वयम्भूदातृरक्षित्री स्वयम्भूरक्ततारिका ॥ १३७॥ स्वयम्भूपूजकग्रस्ता स्वयम्भूपूजकप्रिया । स्वयम्भूवन्दकाधारा
    स्वयम्भूनिन्दकान्तका ॥ १३८॥ स्वयम्भूप्रदसर्वस्वा स्वयम्भूप्रदपुत्त्रिणी । स्वयम्भूप्रदसस्मेरा स्वयम्भूप्रदशरीरिणी
    । सर्वकालोद्भवप्रीता सर्वकालोद्भवात्मिका ॥ १३९॥ सर्वकालोद्भवोद्भावा सर्वकालोद्भवोद्भवा । कुण्डपुष्पसदाप्रीतिर्गोलपुष्पसदारतिः
    ॥ १४०॥ कुण्डगोलोद्भवप्राणा कुण्डगोलोद्भवात्मिका । स्वयम्भु
