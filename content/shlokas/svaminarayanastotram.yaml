id: svaminarayanastotram
category: stotram
name:
  english: svaminarayanastotram
  devanagari: स्वामिनारायणस्तोत्रम्
content:
  english: shrisvaminarayanastotram urdhva tathadho nahi yasya manam tasmin mahodhamani rajamanam | muktavrajanamadhirajamanam
    shrisvaminarayanamanamami || 1|| brahmandasandohavibhasikantim naikatmakalyananigudhakantim | manushyaruparpitadivyashantim
    shrisvaminarayanamanamami || 2|| manushyarupam pratimasvarupam tathakshare dhamani divyarupam | yasyastyabhinnam
    kamaniyarupam shrisvaminarayanamanamami || 3|| divyambarabhushanabhushitangam divyadvitiyakritimanjulangam
    | divyatvasampadakasangisangam shrisvaminarayanamanamami || 4|| svasvaminarayananamamantram svayam
    dishantam bhavaparayantram | praudhapratapashritalokatantram shrisvaminarayanamanamami || 5|| yogadvina
    karitasatsamadhim sadbhaktasanghatavinashitadhim | samprapayantam tamanadyupadhim shrisvaminarayanamanamami
    || 6|| sarvavataran pravilapayantam sarvavataritvamaho dharantam | svaraditi svan paridarshayantam
    shrisvaminarayanamanamami || 7|| maye shabrahmaksharasanghabijam ye'nadimukta api teshu bijam | tam
    sarvadatyantikamuktibijam shrisvaminarayanamanamami || 8|| pratyaksha evasmi sadeti bhanam datva svakebhyo
    nijamurtidanam | yavadravindu prakatapramanam shrisvaminarayanamanamami || 9|| iti shrisvaminarayana
    gadi
  devanagari: श्रीस्वामिनारायणस्तोत्रम् ऊर्ध्व तथाधो नहि यस्य मानं तस्मिन् महोधामनि राजमानम् । मुक्तव्रजानामधिराजमानं
    श्रीस्वामिनारायणमानमामि ॥ १॥ ब्रह्माण्डसन्दोहविभासिकान्तिं नैकात्मकल्याणनिगूढकान्तिम् । मनुष्यरूपार्पितदिव्यशान्तिं
    श्रीस्वामिनारायणमानमामि ॥ २॥ मनुष्यरूपं प्रतिमास्वरूपं तथाक्षरे धामनि दिव्यरूपम् । यस्यास्त्यभिन्नं
    कमनीयरूपं श्रीस्वामिनारायणमानमामि ॥ ३॥ दिव्याम्बराभूषणभूषिताङ्गं दिव्याद्वितीयाकृतिमञ्जुलाङ्गम् ।
    दिव्यत्वसम्पादकसङ्गिसङ्गं श्रीस्वामिनारायणमानमामि ॥ ४॥ स्वस्वामिनारायणनाममन्त्रं स्वयं दिशन्तं भवपारयन्त्रम्
    । प्रौढप्रतापाश्रितलोकतन्त्रं श्रीस्वामिनारायणमानमामि ॥ ५॥ योगाद्विना कारितसत्समाधिं सद्भक्तसङ्घातविनाशिताधिम्
    । सम्प्रापयन्तं तमनाद्युपाधिं श्रीस्वामिनारायणमानमामि ॥ ६॥ सर्वावतारान् प्रविलापयन्तं सर्वावतारित्वमहो
    धरन्तम् । स्वराडिति स्वान् परिदर्शयन्तं श्रीस्वामिनारायणमानमामि ॥ ७॥ माये शब्रह्माक्षरसङ्घबीजं येऽनादिमुक्ता
    अपि तेषु बीजम् । तं सर्वदात्यन्तिकमुक्तिबीजं श्रीस्वामिनारायणमानमामि ॥ ८॥ प्रत्यक्ष एवास्मि सदेति
    भानं दत्वा स्वकेभ्यो निजमूर्तिदानम् । यावद्रवीन्दू प्रकटप्रमाणं श्रीस्वामिनारायणमानमामि ॥ ९॥ इति श्रीस्वामिनारायण
    गादी
