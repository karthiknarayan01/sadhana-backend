id: varahastotram-2
category: stotram
name:
  english: varahastotram 2
  devanagari: वराहस्तोत्रम् २
content:
  english: cidanandaghanam shuddham vishvamangalakarakam | mokshahetum hi tam vishnum vande varaharupinam
    || 1|| neti neti shrutirbrute yasya rupam vinirnayan | parabrahmahitam vishnum vande varaharupinam
    || 2|| tattvamasiti vaktaramavirbhutam jagatpatim | shrisadgurum hitam vishnum vande varaharupinam
    || 3|| rasatalagatam bhumim gajah kamalinimiva | uddadhara hi tam vishnum vande varaharupinam || 4||
    avadhidyo hiranyaksham vishvakantakarakshasam | vishvapalahitam vishnum vande varaharupinam || 5||
    dharmoddharavataro'yam sajjanavanahetukam | jagatpatim hitam vishnum vande varaharupinam || 6|| atyantakarunasandram
    jagaduddharakam param | bhavataram hi tam vishnum vande varaharupinam || 7|| sadaivaklishtakarmanam
    jagatassthitihetave | bhavanaukam hi tam vishnum vande varaharupinam || 8|| iti shrimat paramahamsaparivrajakacarya
    sadguru bhagavan shridharasvamimaharajaviracitam shrivarahastotram sampurnam | varahajayanti
  devanagari: चिदानन्दघनं शुद्धं विश्वमङ्गलकारकम् । मोक्षहेतुं हि तं विष्णुं वन्दे वाराहरूपिणम् ॥ १॥ नेति
    नेति श्रुतिर्ब्रूते यस्य रूपं विनिर्णयन् । परब्रह्महितं विष्णुं वन्दे वाराहरूपिणम् ॥ २॥ तत्त्वमसीति
    वक्तारमाविर्भूतं जगत्पतिम् । श्रीसद्गुरुं हितं विष्णुं वन्दे वाराहरूपिणम् ॥ ३॥ रसातलगतां भूमिं गजः
    कमलिनीमिव । उद्दधार हि तं विष्णुं वन्दे वाराहरूपिणम् ॥ ४॥ अवधीद्यो हिरण्याक्षं विश्वकण्टकराक्षसम्
    । विश्वपालहितं विष्णुं वन्दे वाराहरूपिणम् ॥ ५॥ धर्मोद्धारावतारोऽयं सज्जनावनहेतुकम् । जगत्पतिं हितं
    विष्णुं वन्दे वाराहरूपिणम् ॥ ६॥ अत्यन्तकरुणासान्द्रं जगदुद्धारकं परम् । भवतारं हि तं विष्णुं वन्दे
    वाराहरूपिणम् ॥ ७॥ सदैवाक्लिष्टकर्माणं जगतस्स्थितिहेतवे । भवनौकां हि तं विष्णुं वन्दे वाराहरूपिणम्
    ॥ ८॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीवराहस्तोत्रं सम्पूर्णम्
    । वराहजयन्ति
