id: kyts-jata-7-5-gaavo-vaa-etathsatramaasata-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 7.5 Gaavo Vaa Etathsatramaasata - Krishna Yajurveda Taittiriya Samhita
content:
  english: gavo vai vai gavo gavo vai | thsatragm satra meta deta satra masata sata satragm satra masata
    | asata shringa ashringa asata sata shringah | ssati rashringa ashringa shshringani shringani sati
    shshringani shringani nah | no jayantai jayantai no no jayantai | jayanta ititi jayantai jayanta iti
    | iti kamena kamenetiti kamena | nkamena kamena tasa dasha masa masa dasha dasha masah masa nishanna
    nishanna masa masa nishannah | nnishanna nishanna asann | atha shringani shringa nyathatha shringani
    | nyajayanta jayanta shringani shringa ajayanta ta sta ajayanta jayanta tah | nnudu datishthann |
    arathsmetitya rathsma rathsmeti | na jayanta jayanta na na jayanta | ajayanta ta sta ajayanta jayanta
    tah | va~thsara maptva ''ptva sam aptvodu daptva ''ptvot | nnudu datishthann | arathsme titya rathsma
    rathsmeti | ca jayanta jayanta ca ca jayanta | ya~sa majayanta jayanta yasa ta ubhayi rubhayi sta
    sta ubhayih ubhayi rudu dubhayi rubhayi rut | nnudu datishthann | arathsme titya rathsma rathsmeti
    | ngosatra mititi gosatram | vi~dvagmso vidvagmsa eva mevam vi~dvagmso vidvagmsah sam va~thsara mupaya
    ntyupayanti sam va~thsara mupayanti | upaya ntyriddhnuva ntyriddhnuva ntyupaya ntyupaya ntyriddhnuvanti
    | riddhnuva ntyevaiva rdhnuva ntyriddhnuva ntyeva | ttasma devaiva tasma ttupara tupara tasma shikau
    tupara tupara var shikau masau masau var masau partva partva masau masau partva partva carati carati
    partva partva carati | carati satrabhijitagm satrabhijita ncarati carati satrabhijitam | satrabhijitagm
    hi hi satrabhijitagm satrabhijitagm hi | satrabhijitamiti satra hyasya asyai hi hyasyai | ttasma dasya
    asyai tasma va~thsarasada iti sam ca grihe grihe ca ca grihe | kriyate grihe grihe kriyate apta mavaruddha
    mavaruddha mapta mapta mavaruddham | avaruddha mabhijita mabhijita mavaruddha mavaruddha mabhijitam
    | nkriyate kriyate 'bhijita mabhijita kriyate samudragm samudra nkriyate kriyate samudram | vai~ vai
    samudragm samudram va eta ete vai va ete | ete pra praita ete pra | pra plavante plavante pra pra
    plavante | plavante ye ye plavante plavante ye | va~thsara mupaya ntyupayanti sam va~thsara mupayanti
    | upayanti yo ya upaya ntyupayanti yah | vai samudrasya samudrasya vai vai samudrasya | mparagm samudrasya
    samudrasya param | na pashyati pashyati na na pashyati | pashyati na na pashyati pashyati na | ssamudro
    vai vai samudrah | samudra stasya tasya samudra ssamudra stasya | yadatiratra vatiratrau ya atiratrau
    ye ye 'tiratra vatiratrau ye | atiratravityati vi~dvagmso vidvagmsa eva mevam vi~dvagmso vidvagmsah
    sam va~thsara mupaya ntyupayanti sam va~thsara mupayanti | rta upaya ntyupaya ntyana evodrica mudrica
    mevai vodrica ngacchanti gaccha ntyudrica mudrica ngacchanti gacchantiyam | vai purvah purvo vai vai
    purvah | purvo 'tiratro 'tiratrah purvah purvo 'tiratrah | atiratro 'sa vasa vatiratro 'tiratro 'sau
    | asa vuttara uttaro 'sa vasa vuttarah | uttaro mano mana uttara uttaro manah | manah purvah purvo
    mano manah purvah | kpurvah purvo vak | vaguttara uttaro vag vaguttarah | uttarah pranah prana uttara
    uttarah pranah | pranah purvah purvah pranah pranah purvah | purvo 'pano 'panah purvah purvo 'panah
    | apana uttara uttaro 'pano 'pana uttarah | mprarodhana muttara uttarah prarodhanam | mpurvah purvah
    prarodhana purva udayana mudayana mpurvah purva udayanam | udayana muttara uttara udayana mudayana
    muttarah | uttaro jyotishtomo jyotishtoma uttara uttaro jyotishtomah | jyotishtomo vaishvanaro vai
    shvanaro jyotishtomo jyotishtomo vaishvanarah | jyotishtoma iti jyotih vaishvanaro 'tiratro 'tiratro
    vai shvanaro 'tiratrah | atiratro bhavati bhava tyatiratro 'tiratro bhavati | rbhavati bhavati jyotih
    | jyoti revaiva jyoti tpurasta devaiva purasta ddadhate dadhate purasta dadhate suvargasya suvargasya
    dadhate dadhate suvargasya | suvargasya lokasya lokasya suvargasya suvargasya lokasya | suvargasyeti
    suvah lokasya nukhyatya anukhyatyai lokasya lokasya nukhyatyai | anukhyatyai caturvigmsha shcaturvigmsho
    'nukhyatya anukhyatyai caturvigmshah | anukhyatya ityanu caturvigmshah prayaniyah prayaniya shcaturvigmsha
    shcaturvigmshah prayaniyah | caturvigmsha iti catuh prayaniyo bhavati bhavati prayaniyah prayaniyo
    bhavati | prayaniya iti pra bhavati caturvigmshati shcaturvigmshati rbhavati bhavati caturvigmshatih
    | caturvigmshati rardhamasa ardhamasa shcaturvigmshati shcaturvigmshati rardhamasah | caturvigmshatiriti
    catuh 'rdhamasa ardhamasa ardhamasa ityardha va~thsarah prayantah prayantah sam va~thsarah prayantah
    | prayanta evaiva prayantah prayanta eva | va~thsare prati prati sam prati tishthanti tishthanti prati
    prati tishthanti | tishthanti tasya tasya tishthanti tishthanti tasya | tasya trini trini tasya tasya
    trini | trini ca ca trini trini ca | ca shatani shatani ca ca shatani | shatani shashti shshashti
    shshatani shatani shashtih | shashtishca ca shashti shshashtishca | stotriya stavati stavati sstotriya
    stavatih | va~thsarasya tavati stavati va~thsarasya ratrayo ratraya va~thsarasya ratrayah | ratraya
    ubhe ubhe ratrayo ratraya ubhe | ubhe evaivobhe ubhe eva | va~thsarasyai vaiva sam va~thsarasya rupe
    rupe sam pnuva ntyapnuvanti rupe rupe a apnuvanti te ta a pnuva ntyapnuvanti te | sthityai te te sagg
    sthitya arishtya arishtyai sagg sthitya arishtyai | arishtya uttarai ruttarai rarishtya arishtya uttaraih
    | uttarai rahobhi rahobhi ruttarai ruttarai rahobhih | ahobhi shcaranti cara ntyahobhi rahobhi shcaranti
    | caranti shadaha shshadaha shcaranti caranti shadahah | shadaha bhavanti bhavanti shadaha shshadaha
    bhavanti | dbhavanti bhavanti shat | va ritava ritavo vai va ritavah | va~thsara ritava ritavah sam
    va~thsara ritush vritushu sam va~thsare prati prati sam prati tishthanti tishthanti prati prati tishthanti
    | rgau stishthanti tishthanti gauh | cayu rayu shca cayuh | ayu shca cayu rayu shca | ca maddhyato
    maddhyata shca ca maddhyatah | sstomau stomau maddhyato maddhyata sstomau stomau bhavatah | va~thsarasya
    bhavato bhavata va~thsara syaivaiva sam mmaddhyato maddhyato mithuna maddhyato dadhati dadhati maddhyato
    maddhyato dadhati | || dadhati prajananaya prajananaya dadhati dadhati prajananaya | rjyotih prajananaya
    prajananaya jyotih | jyoti rabhito 'bhito jyoti abhito bhavati bhava tyabhito 'bhito bhavati | mbhavati
    bhavati vimocanam | vimocana mevaiva vimocanam tac chandagmsi chandagmsi ta chandag syevaiva chandagmsi
    chandag syeva | ya~nti yanti vimokam yantyatho atho yanti yantyatho jyotisha 'tho atho ubhayato jyoti
    shaivai vobhayato jyotishetyubhayatah eva shadahena shadahe naivaiva shadahena | shadahena suvargagm
    suvargagm shadahena shadahena suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~nti
    yanti lokam ~lokam yanti brahmavadino brahmavadino yanti yanti brahmavadinah | brahmavadino vadanti
    vadanti brahmavadino brahmavadino vadanti | brahmavadina iti brahma vada ntyasata asate vadanti vada
    ntyasate | asate kena kenasata asate kena | kena yanti yanti kena kena yanti | yantititi yanti yantiti
    | iti devayanena devayane netiti devayanena | devayanena patha patha devayanena devayanena patha |
    pathetiti patha patheti | dbruyadititi bruyat | bruyac chandagmsi chandagmsi bruya dbruyac chandagmsi
    | chandagmsi vai vai chandagmsi chandagmsi vai | vai devayano devayano vai vai devayanah | devayanah
    panthah pantha devayano devayanah panthah pantha gayatri gayatri panthah pantha gayatri | ptrishtub
    gayatri gayatri trishtup | bjagati jagati trishtu rjagati jagati jyotih | vai gayatri gayatri vai
    vai gayatri | rgayatri gayatri gauh | rgau strishtuk | trishtu gayu rayush trishtu ktrishtu gayuh
    | rjagati jaga tyayu rayu dyaj jagati jagati yat | sstoma eta ete stomah stoma bhavanti bhavanti stoma
    bhavanti davayanena davayanena bhavanti bhavanti davayanena | davayane naivaiva davayanena davayane
    naiva | patha yanti yanti patha patha yanti | yanti samanagm samanam ya~nti yanti samanam | samanagm
    sama sama samanagm samanagm sama | sama bhavati bhavati sama sama bhavati | bhavati devaloko devaloko
    bhavati bhavati devalokah | devaloko vai vai devaloko devaloko vai | vai sama sama vai vai sama |
    thsama sama devalokat | devaloka devaiva devaloka na yanti yanti na na yanti | yantyanyaanya anyaanya
    yanti yantyanyaanyah | anyaanya rica rico 'nyaanya anyaanya ricah | anyaanya ityanyah rico bhavanti
    bhava ntyrica rico bhavanti | bhavanti manushyaloko manushyaloko bhavanti bhavanti manushyalokah |
    manushyaloko vai vai manushyaloko manushyaloko vai | manushyaloka iti manushya va rica rico vai va
    ricah | nmanushyaloka drica rico manushyalokat | manushyaloka devaiva manushyaloka nmanushyaloka deva
    | manushyalokaditi manushya eva nyamanya manyamanya mevai vanyamanyam | ndevaloka manyamanya manyamanya
    anyamanyamityanyam devaloka mabhyarohanto 'bhyarohanto devaloka ndevaloka mabhyarohantah | abhyarohanto
    yanti yantyabhyarohanto 'bhyarohanto yanti | abhyarohanta ityabhi yantyabhivarto 'bhivarto yanti yantyabhivartah
    | abhivarto brahmasama mbrahmasama mabhivarto 'bhivarto brahmasamam | mbhavati bhavati brahmasama
    brahmasamamiti brahma bhavati suvargasya suvargasya bhavati bhavati suvargasya | suvargasya lokasya
    lokasya suvargasya suvargasya lokasya | suvargasyeti suvah lokasya bhivritya abhivrityai lokasya lokasya
    bhivrityai | abhivritya abhiji dabhiji dabhivritya abhivritya abhijit | abhivritya ityabhi dbhavati
    bhava tyabhiji dabhiji bhavati suvargasya suvargasya bhavati bhavati suvargasya | suvargasya lokasya
    lokasya suvargasya suvargasya lokasya | suvargasyeti suvah lokasya bhijitya abhijityai lokasya lokasya
    bhijityai | abhijityai vishvaji dvishvaji dabhijitya abhijityai vishvajit | abhijitya ityabhi dbhavati
    bhavati vishvaji vishvajiditi vishva bhavati vishvasya vishvasya bhavati bhavati vishvasya | vishvasya
    jityai jityai vishvasya vishvasya jityai jityai masimasi masimasi jityai jityai masimasi | masimasi
    prishthani prishthani masimasi masimasi prishthani | prishtha nyupopa prishthani prishtha nyupa |
    upa yanti yantyupopa yanti | yanti masimasi masimasi yanti yanti masimasi | syatigrahya atigrahya
    masimasi masima atigrahya grihyante grihyante 'tigrahya atigrahya grihyante | atigrahya ityati grihyante
    masimasi masimasi grihyante grihyante masimasi | syevaiva masimasi masima vi~rya mevaiva virya ndadhati
    dadhati viryam ndadhati dadhati masam | mpratishthityai pratishthityai masa pratishthitya uparishta
    duparishta tpratishthityai pratishthitya uparishtat | pratishthitya iti prati mmasa muparishta duparishta
    mprishthani prishthani masa prishtha nyupopa prishthani prishtha nyupa | upa yanti yantyupopa yanti
    | dyanti yanti tasma tasma duparishta duparishta ttasma duparishtat | uparishta doshadhaya oshadhaya
    uparishta duparishta doshadhayah | mphala moshadhaya oshadhayah phala ngrihnanti grihnanti phala grihnantiti
    grihnanti | || gavo vai vai gavo gavo vai | thsatragm satra meta deta satra masata sata satragm satra
    masata | asata shringa ashringa asata sata shringah | ssati rashringa ashringa shshringani shringani
    sati shringani sishasanti shshringani shringani sishasantih | ntasagm sishasanti ssishasanti stasa
    dasha masa masa dasha dasha masah masa nishanna nishanna masa masa nishannah | nnishanna nishanna
    asann | atha shringani shringa nyathatha shringani | nyajayanta jayanta shringani shringa ajayanta
    ta sta ajayanta jayanta tah | nta sta abruvann | araths modu darathsma rathsmot | ttishthama tishtha
    modu tishthama vava tishthama tishtha mava | kama maruthsma hyaruthsmahi kama aruthsmahi yena yena
    ruthsma hyaruthsmahi yena | yena kamena kamena yena yena kamena | kamena nyashadama nyashadama kamena
    kamena nyashadama | nyashadametiti nyashadama nyashadameti | ntasa mititi tasa nnardha ardha abruva
    ardha va va 'rdha ardha va va ''samaha asamahai va va ''samahai | asamaha evaiva samaha asamaha eva
    | evema vima vevaivemau | imau dvadashau dvadasha vima vimau dvadashau | dvadashau masau masau dvadashau
    dvadashau masau va~thsaragm sampadya sampadya sam va~thsaragm sampadya | thsampadya sampa dyot | ttishthama
    tishtha modu tishtha metiti tishthama tishtha meti | ntasa mititi tasa ndvadashe dvadashe tasa dvadashe
    masi masi dvadashe dvadashe masi | masi shringani shringani masi masi shringani | shringani pra pra
    shringani shringani pra | pra vartanta vartanta pra pra vartanta | avartanta shraddhaya shraddhaya
    'vartanta vartanta shraddhaya shraddhaya va va shraddhaya va 'shraddhaya 'shraddhaya va va 'shraddhaya
    | ashraddhaya va va 'shraddhaya 'shraddhaya va | ashraddhayetyashrat va ta sta va va tah | ta ima
    ima sta sta imah | ima ya ya ima ima yah | ya stupara stupara ya ya stuparah | tupara ubhayya ubhayya
    stupara stupara ubhayyah | ubhayyo vava vavobhayya ubhayyo vava | vava ta sta vava vava tah | ya shca
    ca ya ya shca | ca shringani shringani ca ca shringani | nchringani shringa nyasanvann | ya shca ca
    ya ya shca | urja mavarundhata varundha torja murja mavarundhata | ddhno tyriddhno tyavarundhata varundhata
    r riddhnoti dashasu dasha svriddhno tyriddhnoti dashasu | dashasu masu masu dashasu dashasu masu |
    nnriddhno tyriddhno tyuttishtha uttishthannityut riddhnoti dvadashasu dvadasha svriddhno tyriddhnoti
    dvadashasu | dvadashasu yo yo dvadashasu dvadashasu yah | dvadashasviti dvadasha veda padena padena
    veda veda padena | padena khalu khalu padena padena khalu | khalu vai vai khalu khalu vai | va eta
    ete vai va ete | ete yanti yantyeta ete yanti | yanti vindati vindati yanti yanti vindati | vindati
    khalu khalu vindati vindati khalu | khalu vai vai khalu khalu vai | vai padena padena vai vai padena
    | npadena padena yann | eta driddha mriddha meta deta driddham | riddha mayana mayana mriddha mriddha
    mayanam | ttasma dayana mayana dgosani gosa nyeta deta prathame masi masi prathame prathame masi |
    masi prishthani prishthani masi masi prishthani | prishtha nyupopa prishthani prishtha nyupa | upa
    yanti yantyupopa yanti | yanti maddhyame maddhyame yanti yanti maddhyame | maddhyama upopa maddhyame
    maddhyama upa | upa yanti yantyupopa yanti | yantyuttama uttame yanti yantyuttame | upa yanti yantyupopa
    yanti | dyanti yanti tat | tri reka syaikasya tri stri rekasya | eka syahno 'hna eka syaika syahnah
    | ahna upasida ntyupasida ntyahno 'hna upasidanti | ndahra mupasida ntyupasidanti dahram | sa 'parabhya
    maparabhyagm sa sa 'parabhyam | bhya maparabhya maparabhya duhe 'thatha duhe duhe 'tha | atha kutah
    kuto 'thatha kutah | kshyate dhokshyate sa sa dho kshyate dhokshyate yam | ndvadasha dvadasha yam
    dvadasha kritvah kritvo dvadasha dvadasha kritvah | kritva upasida ntyupasidanti kritvah kritva upasidanti
    | upasidantiti tyupasida ntyupasidantiti | va~thsaragm sampadya sampadya sam va~thsaragm sampadya
    | ttama uttame sampadya sampadyo uttame masi masyuttama uttame masi | nmasi masi sakrit | tprishthani
    prishthani sakri prishtha nyupopa prishthani prishtha nyupa | upeyu riyu rupopeyuh | ttadiyu riyu
    stat | dyajamana yajamana sta ya~jamana yajamana yajnam | ava rundhate rundhate 'vava rundhate | rundhate
    samudragm samudragm rundhate rundhate samudram | vai~ vai samudragm samudram va eta ete vai va ete
    | || ete 'navara manavara meta ete 'navaram | anavara mapara mapara manavara manavara maparam | mpra
    pra para mapara pra plavante plavante pra pra plavante | plavante ye ye plavante plavante ye | va~thsara
    mupaya ntyupayanti sam va~thsara mupayanti | dyadupaya ntyupayanti yat | dbrihadrathantare brihadrathantare
    ya brihadrathantare anvarjeyu ranvarjeyu rbrihadrathantare brihadrathantare anvarjeyuh | brihadrathantare
    iti brihat ryatha yatha 'nvarjeyu ranvarjeyu anvarjeyurityanu yatha maddhye maddhye yatha yatha maddhye
    maddhye samudrasya samudrasya maddhye maddhye samudrasya | mplavagm samudrasya samudrasya plavam |
    plava manvarjeyu ranvarjeyuh plava mplava manvarjeyuh | anvarjeyu stadri ktadri ganvarjeyu ranvarjeyu
    stadrik | anvarjeyurityanu tadanuthsarga manuthsarga mbrihadrathantarabhya manuthsarga manuthsarga
    anuthsargamityanut brihadrathantarabhya mitvetva brihadrathantarabhya mbrihadrathantarabhya mitva
    | brihadrathantarabhyamiti brihat mpratishtha mitvetva pratishtham | ngacchanti gacchanti pratishtha
    pratishthamiti prati bhyo gacchanti gacchanti sarve dyajamana yajamana sta sarvan kaman kama nthsarvan
    kaman | kama navava kaman kama nava | ava rundhate rundhate 'vava rundhate | rundhata iti rundhate
    | || samanya rica ricah samanyah samanya ricah | rico bhavanti bhavantyrica rico bhavanti | bhavanti
    manushyaloko manushyaloko bhavanti bhavanti manushyalokah | manushyaloko vai vai manushyaloko manushyaloko
    vai | manushyaloka iti manushya va rica rico vai va ricah | nmanushyaloka drica rico manushyalokat
    | manushyaloka devaiva manushyaloka nmanushyaloka deva | manushyalokaditi manushya na yanti yanti
    na na yanti | yantyanyada nyadanyadanya dyanti yantyanyadanyat | thsama sama nyadanyada nyadanya anyadanyadityanyat
    sama bhavati bhavati sama sama bhavati | bhavati devaloko devaloko bhavati bhavati devalokah | devaloko
    vai vai devaloko devaloko vai | vai sama sama vai vai sama | thsama sama devalokat | devaloka devaiva
    devaloka eva nyamanya manyamanya mevai vanyamanyam | mmanushyaloka manyamanya manyamanya anyamanyamityanyam
    mpratyavarohantah pratyavarohanto manushyaloka mpratyavarohantah | manushyalokamiti manushya pratyavarohanto
    yanti yanti pratyavarohantah pratyavarohanto yanti | pratyavarohanta iti prati ya~nti yanti jagatim
    | jagati magre 'gre jagati agra upopagre 'gra upa | upa yanti yantyupopa yanti | ya~nti yanti jagatim
    | vai chandagmsi chandagmsi vai vai chandagmsi | chandagmsi pratyavarohanti pratyavarohanti chandagmsi
    chandagmsi pratyavarohanti | pratyavaroha ntyagrayana ma mpratyavarohanti pratyavaroha ntyagrayanam
    | pratyavarohantiti prati ngraha graha agrayana ma dgraha graha brihat | tprishthani prishthani briha
    prishthani trayastrigmsha mprishthani prishthani trayastrigmsham | trayastrigmshagg ntrayastrigmshagg
    trayastrigmshamiti trayah tasmaj jyayagmsa ttasmaj jyayagmsam | nkaniyan kaniyan jyayagmsa npratyavarohati
    pratyavarohati kaniyan kaniya pratyavarohati vaishvakarmano vai shvakarmanah pratyavarohati pratyavarohati
    vaishvakarmanah | pratyavarohatiti prati vaishvakarmano grihyate grihyate vaishvakarmano vai shvakarmano
    grihyate | vaishvakarmana iti vaishva grihyate vishvani vishvani grihyate grihyate vishvani | nyevaiva
    vishvani vishva eva tena tenaivaiva tena | tena karmani karmani tena tena karmani | karmani yajamana
    yajamanah karmani karmani yajamanah | yajamana avava yajamana yajamana ava | ava rundhate rundhate
    'vava rundhate | rundhata aditya adityo rundhate rundhata adityah | adityo grihyate grihyata aditya
    adityo grihyate | || ngrihyate grihyata iyam | aditi rasya masya maditi raditi rasyam | asya mevai
    vasya masya meva | eva prati pratyevaiva prati | prati tishthanti tishthanti prati prati tishthanti
    | nya stishthanti tishtha ntyanyo nyo grihyete grihyete anyo grihyete mithunatvaya mithunatvaya grihyete
    grihyete mithunatvaya | grihyete iti grihyete | mithunatvaya praja tyai mithunatvaya mithunatvaya
    praja mithunatvayeti mithuna tya avantara mavantara vai~ va avantara mavantaram vai dasharatrena dasharatrena
    vai vai dasharatrena | dasharatrena prajapatih prajapati rdasharatrena dasharatrena prajapatih | prajapatih
