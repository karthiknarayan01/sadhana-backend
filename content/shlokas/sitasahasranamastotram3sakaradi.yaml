id: sitasahasranamastotram3sakaradi
category: stotram
name:
  english: sitasahasranamastotram3sakaradi
  devanagari: सीतासहस्रनामस्तोत्रम्३सकारादि
content:
  english: rinu parvatanandini || 10|| asya sahasranamasya rishirbrahma prakirtitah | chando'nushtup proktashca
    sitadevi prakirtita || 11|| saurabham bijamakhyatam kamalashaktiririta | kilakam pashabijena viniyogastatah
    param || 12|| atha dhyanam pravakshyami sitayah paramadbhutam | sarvapapaharam divyam sarvakamaphalapradam
    || 13|| ayuh kirtikaram punyam sarvaghaughavinashanam | jnatva samyakvidhanena nyasajalam samacaret
    || 14|| om asya shrisitasahasranamamantrasya brahmarishih anushtup chandah shrisitadevatayainamah
    | hrim hrim klim bijaya namah shrishaktaye namah am kilakaya namah mamasakalabhishtasiddhyarthe jape
    viniyogah | atha dhyanam | dhyayejjanaki ramyam muktaharasushobhitam | anantaratnaracitam simhasanavirajitam
    || udyatsuryasahasrabham dadimikusumaprabham | suvrittanividottungakucamandalarajitam || anarghya
    mauktikasphara harabharavirajitam | navaratnaprabharaji graiveyavarabhushanam || shrutibhushamanoramyam
    sugandasthalabhushanan | namami paramam devim ramavamankagam shivam || iti dhyatva hridyupacaraissampujya
    stotrakam pathet | atha sahasranamastotram | om sita simantini sima sanmantraphaladayini || 1|| satya
    satyavati sama satviki sarvamangala | satprabhava satisadhvi satkala sakaleshtada || 2|| samasta samada
    sandra sandranilasamaprabha | saubhagyajanani sevya saumya sundararupinim || 3|| sambhrama sambhramatita
    santushtaphaladayini | sarvottungakala sarva sarveshta sangamapriya || 4|| shantipriya shantimati
    simantamanibhushana | savitri sanmukhi siddha sharada ca samaprabha || 5|| svatantra satyasankalpa
    samadrishtiphalaprada | sarangasadrisha shyama sarasa shashishekhara || 6|| samana samaga shuddha
    samastasurasammukhi | sarvasampatpradatri ca shamada sindhusevini || 7|| sarasiruhamadhyastha sarovaraviharini
    | sarasvati suvahnishri shrijaya shubhadayini || 8|| sarvamangalyajanani sarvabhaumapradayini | samrajyakarini
    samra samrajyaphaladayini || 9|| satyavrata satyapara sadbhava satparayana | sanmargakartri sammanya
    sammanasukhadayini || 10|| satyajnanapradatri ca sumanaradhyapaduka | svarnakanti samaprakhya svarnabharanabhushita
    || 11|| satsankalpaprada sajya sukhi saukhyavaraprada | samsarasagararudha samsarabhayanashini ||
    12|| sarvarthasadhini sarva sharvani shankarapriya | shashvatasthanaphalada shasana shasanapriya ||
    13|| samata samatasara sarasvataphalaprada | sinjanamanimanjira sasmita'dharapallava || 14|| sarvasaundaryanilaya
    sarvasaubhagyashalini | sanjananandanilaya satkarmaphaladayini || 15|| sukshma sukshmagatisstutya
    sukshmajnanapradayini | saudamini sudhadevi sindhurupa ca sambika || 16|| siddhiprada siddhibandhu
    siddheshi siddhasundari | sandhyeyatri sandhyanjara sandhyatarunyalalita || 17|| shamada shankari
    setu sukola sarasiruha | someshvari somakala somapanasusammata || 18|| saumyanana saumyarupa somasya
    somasundari | suryaprabha suryamukhi suryaja suryasundari || 19|| suryakotipratikasha suryatejomayi
    sati | somakotiprabha shobha somamandalavasini || 20|| shatananda shrutidhara sushumna shobhanapriya
    | shobhavati sushobhadhya shobhana subhaga sukha || 21|| shatakshi shambaradhvamsi sahasrakshi sahodari
    | sahasrashirsha sarveshi sahasrapadasamyuta || 22|| sahasrakshi suvastradhya sahasrabhujavallika
    | shubhavastrapriya sunda shatrughni shantanupriya || 23|| shatanana ca shabari sahasrapadapankaja
    | shishupavrikshanilaya shambarari sukhaprada || 24|| shrantiha santatih satya santanaphaladayini
    | shrinkararupini shraddha shreyada shramanashini || 25|| shreshtha shreshthakari shreya shrutirupa
    shrutipriya | shrenipati samaradhya sushtunganapriyankari || 26|| sthanupatni sthitikara sthitistha
    sthitivarddhini | shraddhavati ca shramada shraddhabhaktisamanvita || 27|| shrividya shodashi shodha
    shodhanyasaphalaprada | shuklambaraparidhana shuklagandhanulepana || 28|| shuklapushpapriya shukla
    shuklabharanabhushita | svayanjyotih svayankartri svayamanandavigraha || 29|| sheshadishayini shesha
    shridhararcitapaduka | sankarshanapriya sabhya sabhamandalavasini || 30|| sarvendriya
  devanagari: ृणु पर्वतनन्दिनी ॥ १०॥ अस्य सहस्रनामस्य ऋषिर्ब्रह्मा प्रकीर्तितः । छन्दोऽनुष्टुप् प्रोक्तश्च
    सीतादेवी प्रकीर्तिता ॥ ११॥ सौरभं बीजमाख्यातं कमलाशक्तिरीरिता । कीलकं पाशबीजेन विनियोगस्ततः परम् ॥
    १२॥ अथ ध्यानं प्रवक्ष्यामि सीतायाः परमाद्भुतम् । सर्वपापहरं दिव्यं सर्वकामफलप्रदम् ॥ १३॥ आयुः कीर्तिकरं
    पुण्यं सर्वाघौघविनाशनम् । ज्ञात्वा सम्यक्विधानेन न्यासजालं समाचरेत् ॥ १४॥ ॐ अस्य श्रीसीतासहस्रनाममन्त्रस्य
    ब्रह्माऋषिः अनुष्टुप् छन्दः श्रीसीतादेवतायैनमः । ह्रीं ह्रीं क्लीं बीजाय नमः श्रीशक्तये नमः आं कीलकाय
    नमः ममसकलाभीष्टसिद्ध्यर्थे जपे विनियोगः । अथ ध्यानम् । ध्यायेज्जानकी रम्यां मुक्ताहारसुशोभिताम् ।
    अनन्तरत्नरचितां सिंहासनविराजिताम् ॥ उद्यत्सूर्यसहस्राभां दाडिमीकुसुमप्रभाम् । सुवृत्तनिविडोत्तुङ्गकुचमण्डलराजिताम्
    ॥ अनर्घ्य मौक्तिकस्फार हारभारविराजिताम् । नवरत्नप्रभाराजि ग्रैवेयवरभूषणाम् ॥ श्रुतिभूषामनोरम्यां सुगण्डस्थलभूषणान्
    । नमामि परमां देवीं रामवामाङ्कगां शिवाम् ॥ इति ध्यात्वा हृद्युपचारैस्सम्पूज्य स्तोत्रकं पठेत् । अथ
    सहस्रनामस्तोत्रम् । ॐ सीता सीमन्तिनी सीमा सन्मन्त्रफलदायिनी ॥ १॥ सत्या सत्यवती सामा सात्विकी सर्वमङ्गला
    । सत्प्रभावा सतीसाध्वी सत्कला सकलेष्टदा ॥ २॥ समस्ता समदा सान्द्रा सान्द्रनीलसमप्रभा । सौभाग्यजननी
    सेव्या सौम्या सुन्दररूपिणीम् ॥ ३॥ सम्भ्रमा सम्भ्रमातीता सन्तुष्टफलदायिनी । सर्वोत्तुङ्गकला सर्वा सर्वेष्टा
    सङ्गमप्रिया ॥ ४॥ शान्तिप्रिया शान्तिमती सीमन्तमणिभूषणा । सावित्री सन्मुखी सिद्धा शारदा च समप्रभा ॥
    ५॥ स्वतन्त्रा सत्यसङ्कल्पा समदृष्टिफलप्रदा । सारङ्गसदृशा श्यामा सरसा शशिशेखरा ॥ ६॥ समाना सामगा शुद्धा
    समस्तसुरसम्मुखी । सर्वसम्पत्प्रदात्री च शमदा सिन्धुसेविनी ॥ ७॥ सरसीरुहमध्यस्था सरोवरविहारिणी । सरस्वती
    सुवह्निश्री श्रीजया शुभदायिनी ॥ ८॥ सर्वमाङ्गल्यजननी सार्वभौमप्रदायिनी । साम्राज्यकारिणी साम्रा साम्राज्यफलदायिनी
    ॥ ९॥ सत्यव्रता सत्यपरा सद्भावा सत्परायणा । सन्मार्गकर्त्री सम्मान्या सम्मानसुखदायिनी ॥ १०॥ सत्यज्ञानप्रदात्री
    च सुमनाराध्यपादुका । स्वर्णकान्ति समप्रख्या स्वर्णाभरणभूषिता ॥ ११॥ सत्सङ्कल्पप्रदा सज्या सुखी सौख्यवरप्रदा
    । संसारसागरारूढा संसारभयनाशिनी ॥ १२॥ सर्वार्थसाधिनी सर्वा शर्वाणी शङ्करप्रिया । शाश्वतस्थानफलदा शासना
    शासनप्रिया ॥ १३॥ समता समतासारा सारस्वतफलप्रदा । सिञ्जानमणिमञ्जिरा सस्मिताऽधरपल्लवा ॥ १४॥ सर्वसौन्दर्यनिलया
    सर्वसौभाग्यशालिनी । सञ्जनानन्दनिलया सत्कर्मफलदायिनी ॥ १५॥ सूक्ष्मा सूक्ष्मगतिस्स्तुत्या सूक्ष्मज्ञानप्रदायिनी
    । सौदामिनी सुधादेवी सिन्धुरूपा च साम्बिका ॥ १६॥ सिद्धिप्रदा सिद्धिबन्धु सिद्धेशी सिद्धसुन्दरी । सन्ध्येयत्री
    सन्ध्यञ्जरा सन्ध्यातारुण्यलालिता ॥ १७॥ शमदा शाङ्करी सेतु सुकोला सरसीरुहा । सोमेश्वरी सोमकला सोमपानसुसम्मता
    ॥ १८॥ सौम्यानना सौम्यरूपा सोमस्या सोमसुन्दरी । सूर्यप्रभा सूर्यमुखी सूर्यजा सूर्यसुन्दरी ॥ १९॥ सूर्यकोटिप्रतीकाशा
    सूर्यतेजोमयी सती । सोमकोटिप्रभा शोभा सोममण्डलवासिनी ॥ २०॥ शतानन्दा श्रुतिधरा सुषुम्ना शोभनप्रिया ।
    शोभावती सुशोभाढ्या शोभना सुभगा सुखा ॥ २१॥ शताक्षी शम्बरध्वंसी सहस्राक्षी सहोदरी । सहस्रशीर्षा सर्वेशी
    सहस्रपदसंयुता ॥ २२॥ सहस्राक्षी सुवस्त्राढ्या सहस्रभुजवल्लिका । शुभवस्त्रप्रिया सुन्दा शत्रुघ्नी शन्तनुप्रिया
    ॥ २३॥ शतानना च शबरी सहस्रपदपङ्कजा । शिशुपावृक्षनिलया शम्बरारि सुखप्रदा ॥ २४॥ श्रान्तिहा सन्ततिः सत्या
    सन्तानफलदायिनी । श्रीङ्काररूपिणी श्रद्धा श्रेयदा श्रमनाशिनी ॥ २५॥ श्रेष्ठा श्रेष्ठकरी श्रेया श्रुतिरूपा
    श्रुतिप्रिया । श्रेणीपति समाराध्या सुष्टुङ्गानप्रियङ्करी ॥ २६॥ स्थाणुपत्नि स्थितिकरा स्थितिस्था स्थितिवर्द्धिनि
    । श्रद्धावती च श्रमदा श्रद्धाभक्तिसमन्विता ॥ २७॥ श्रीविद्या षोडशी षोढा षोढान्यासफलप्रदा । शुक्लाम्बरपरीधाना
    शुक्लगन्धानुलेपना ॥ २८॥ शुक्लपुष्पप्रिया शुक्ला शुक्लाभरणभूषिता । स्वयञ्ज्योतिः स्वयङ्कर्त्री स्वयमानन्दविग्रहा
    ॥ २९॥ शेषादिशायिनी शेषा श्रीधरार्चितपादुका । सङ्कर्षणप्रिया सभ्या सभामण्डलवासिनी ॥ ३०॥ सर्वेन्द्रिया
