id: lakshminarayanakavacam
category: kavacha
name:
  english: lakshminarayanakavacam
  devanagari: लक्ष्मीनारायणकवचम्
content:
  english: bhogapavargasiddhyarthe pathe viniyogah | atha dhyanam | purnenduvadanam pitavasanam kamalasanam
    | lakshmya shritam caturbahum lakshminarayanam bhaje || 9|| atha kavacam | om vasudevo'vatu me mastakam
    sashiroruham | hrim lalatam sada patu lakshmivishnuh samantatah || 10|| hsauh netre'vatallakshmigovindo
    jagatam patih | hrim nasam sarvada patu lakshmidamodarah prabhuh || 11|| shrim mukham satatam patu
    devo lakshmitrivikramah | lakshmi kantham sada patu devo lakshmijanardanah || 12|| narayanaya bahu
    me patu lakshmigadagrajah | namah parshvau sada patu lakshminandaikanandanah || 13|| am am im im patu
    vaksho om lakshmitripureshvarah | um um rim rim patu kukshim hrim lakshmigarudadhvajah || 14|| lim
    lim em aim patu prishtham hsauh lakshminrisimhakah | om aum am ah patu nabhim hrim lakshmivishtarashravah
    || 15|| kam kham gam gham gudam patu shrim lakshmikaitabhantakah | cam cham jam jham patu shishrnam
    lakshmi lakshmishvarah prabhuh || 16|| tam tham dam dham katim patu narayanaya nayakah | tam tham
    dam dham patu coru namo lakshmijagatpatih || 17|| pam pham bam bham patu janu om hrim lakshmicaturbhujah
    | yam ram lam vam patu janghe hsauh lakshmigadadharah || 18|| sham sham sam ham patu gulphau hrim
    shrim lakshmirathangabhrit | ḻam kshah padau sada patu mulam lakshmisahasrapat || 19|| nam nam nam
    nam mam me patu lakshmishah sakalam vapuh | indro mam purvatah patu vahnirvahnau sadavatu || 20||
    yamo mam dakshine patu nairrityam nirritishca mam | varunah pashcime'vyanmam vayavye'vatu mam marut
    || 21|| uttare dhanadah payadaishanyamishvaro'vatu | vajrashaktidandakhadga pashayashtidhvajankitah
    || 22|| sashulah sarvada pantu digishah paramarthadah | anantah patvadho nityamurdhve brahmavatacca
    mam || 23|| dashadikshu sada patu lakshminarayanah prabhuh | prabhate patu mam vishnurmadhyahne vasudevakah
    || 24|| damodaro'vatat sayam nishadau narasimhakah | sankarshano'rdharatre'vyat prabhate'vyat trivikramah
    || 25|| aniruddhah sarvakalam vishvaksenashca sarvatah | rane rajakule dyute vivade shatrusankate
    om hrim hsauh hrim shrim mulam lakshminarayano'vatu || 26|| omomomranarajacaurariputah payacca mam
    keshavah hrimhrimhrimhahhahsauh hsahsauh vahnervatanmadhavah | hrimhrimhrimjalaparvatagnibhayatah
    payadananto vibhuh shrimshrimshrimshashashalalam pratidinam lakshmidhavah patu mam || 27|| itidam
    kavacam divyam vajrapanjarakabhidham | lakshminarayanasyeshtam caturvargaphalapradam || 28|| sarvasaubhagyanilayam
    sarvasarasvatapradam | lakshmisamvananam tattvam paramartharasayanam || 29|| mantragarbham jagatsaram
    rahasyam tridivaukasam | dashavaram pathedratrau ratante vaishnavottamah || 30|| svapne varapradam
    pashyellakshminarayanam sudhih | trisandhyam yah pathennityam kavacam manmukhoditam || 31|| sa yati
    paramam dhama vaishnavam vaishnaveshvarah | mahacinapadastho'pi yah pathedatmacintakah || 32|| anandapuritasturnam
    labhed moksham sa sadhakah | gandhashtakena vilikhedravau bhurje japanmanum || 33|| pitasutrena samveshtya
    sauvarnenatha veshtayet | dharayedgutikam murdhni lakshminarayanam smaran || 34|| rane ripun vijityashu
    kalyani grihamavishet | vandhya va kakavandhya va mritavatsa ca yangana || 35|| sa badhniyan kanthadeshe
    labhet putramshcirayushah | gurupadeshato dhritva gurum dhyatva manum japan || 36|| varnalakshapurashcarya
    phalamapnoti sadhakah | bahunoktena kim devi kavacasyasya parvati || 37|| vinanena na siddhih syanmantrasyasya
    maheshvari | sarvagamarahasyadhyam tattvat tattvam parat param || 38|| abhaktaya na datavyam kucailaya
    duratmane | dikshitaya kulinaya svashishyaya mahatmane || 39|| mahacinapadasthaya datavyam kavacottamam
    | guhyam gopyam mahadevi lakshminarayanapriyam | vajrapanjarakam varma gopaniyam svayonivat || 40||
    || iti shrirudrayamale tantre shridevirahasye lakshminarayanakavacam sampurnam ||
  devanagari: भोगापवर्गसिद्ध्यर्थे पाठे विनियोगः । अथ ध्यानम् । पूर्णेन्दुवदनं पीतवसनं कमलासनम् । लक्ष्म्या
    श्रितं चतुर्बाहुं लक्ष्मीनारायणं भजे ॥ ९॥ अथ कवचम् । ॐ वासुदेवोऽवतु मे मस्तकं सशिरोरुहम् । ह्रीं ललाटं
    सदा पातु लक्ष्मीविष्णुः समन्ततः ॥ १०॥ ह्सौः नेत्रेऽवताल्लक्ष्मीगोविन्दो जगतां पतिः । ह्रीं नासां सर्वदा
    पातु लक्ष्मीदामोदरः प्रभुः ॥ ११॥ श्रीं मुखं सततं पातु देवो लक्ष्मीत्रिविक्रमः । लक्ष्मी कण्ठं सदा
    पातु देवो लक्ष्मीजनार्दनः ॥ १२॥ नारायणाय बाहू मे पातु लक्ष्मीगदाग्रजः । नमः पार्श्वौ सदा पातु लक्ष्मीनन्दैकनन्दनः
    ॥ १३॥ अं आं इं ईं पातु वक्षो ॐ लक्ष्मीत्रिपुरेश्वरः । उं ऊं ऋं ॠं पातु कुक्षिं ह्रीं लक्ष्मीगरुडध्वजः
    ॥ १४॥ ऌं ॡं एं ऐं पातु पृष्ठं ह्सौः लक्ष्मीनृसिंहकः । ओं औं अं अः पातु नाभिं ह्रीं लक्ष्मीविष्टरश्रवः
    ॥ १५॥ कं खं गं घं गुदं पातु श्रीं लक्ष्मीकैटभान्तकः । चं छं जं झं पातु शिश्र्नं लक्ष्मी लक्ष्मीश्वरः
    प्रभुः ॥ १६॥ टं ठं डं ढं कटिं पातु नारायणाय नायकः । तं थं दं धं पातु चोरू नमो लक्ष्मीजगत्पतिः ॥ १७॥
    पं फं बं भं पातु जानू ॐ ह्रीं लक्ष्मीचतुर्भुजः । यं रं लं वं पातु जङ्घे ह्सौः लक्ष्मीगदाधरः ॥ १८॥
    शं षं सं हं पातु गुल्फौ ह्रीं श्रीं लक्ष्मीरथाङ्गभृत् । ळं क्षः पादौ सदा पातु मूलं लक्ष्मीसहस्रपात्
    ॥ १९॥ ङं ञं णं नं मं मे पातु लक्ष्मीशः सकलं वपुः । इन्द्रो मां पूर्वतः पातु वह्निर्वह्नौ सदावतु ॥
    २०॥ यमो मां दक्षिणे पातु नैरृत्यां निरृतिश्च माम् । वरुणः पश्चिमेऽव्यान्मां वायव्येऽवतु मां मरुत्
    ॥ २१॥ उत्तरे धनदः पायादैशान्यामीश्वरोऽवतु । वज्रशक्तिदण्डखड्ग पाशयष्टिध्वजाङ्किताः ॥ २२॥ सशूलाः सर्वदा
    पान्तु दिगीशाः परमार्थदाः । अनन्तः पात्वधो नित्यमूर्ध्वे ब्रह्मावताच्च माम् ॥ २३॥ दशदिक्षु सदा पातु
    लक्ष्मीनारायणः प्रभुः । प्रभाते पातु मां विष्णुर्मध्याह्ने वासुदेवकः ॥ २४॥ दामोदरोऽवतात् सायं निशादौ
    नरसिंहकः । सङ्कर्षणोऽर्धरात्रेऽव्यात् प्रभातेऽव्यात् त्रिविक्रमः ॥ २५॥ अनिरुद्धः सर्वकालं विश्वक्सेनश्च
    सर्वतः । रणे राजकुले द्युते विवादे शत्रुसङ्कटे ॐ ह्रीं ह्सौः ह्रीं श्रीं मूलं लक्ष्मीनारायणोऽवतु ॥
    २६॥ ॐॐॐरणराजचौररिपुतः पायाच्च मां केशवः ह्रींह्रींह्रींहह्हाह्सौः ह्सह्सौः वह्नेर्वतान्माधवः । ह्रींह्रींह्रींजलपर्वताग्निभयतः
    पायादनन्तो विभुः श्रींश्रींश्रींशशशाललं प्रतिदिनं लक्ष्मीधवः पातु माम् ॥ २७॥ इतीदं कवचं दिव्यं वज्रपञ्जरकाभिधम्
    । लक्ष्मीनारायणस्येष्टं चतुर्वर्गफलप्रदम् ॥ २८॥ सर्वसौभाग्यनिलयं सर्वसारस्वतप्रदम् । लक्ष्मीसंवननं
    तत्त्वं परमार्थरसायनम् ॥ २९॥ मन्त्रगर्भं जगत्सारं रहस्यं त्रिदिवौकसाम् । दशवारं पठेद्रात्रौ रतान्ते
    वैष्णवोत्तमः ॥ ३०॥ स्वप्ने वरप्रदं पश्येल्लक्ष्मीनारायणं सुधीः । त्रिसन्ध्यं यः पठेन्नित्यं कवचं मन्मुखोदितम्
    ॥ ३१॥ स याति परमं धाम वैष्णवं वैष्णवेश्वरः । महाचीनपदस्थोऽपि यः पठेदात्मचिन्तकः ॥ ३२॥ आनन्दपूरितस्तूर्णं
    लभेद् मोक्षं स साधकः । गन्धाष्टकेन विलिखेद्रवौ भूर्जे जपन्मनुम् ॥ ३३॥ पीतसूत्रेण संवेष्ट्य सौवर्णेनाथ
    वेष्टयेत् । धारयेद्गुटिकां मूर्ध्नि लक्ष्मीनारायणं स्मरन् ॥ ३४॥ रणे रिपुन् विजित्याशु कल्याणी गृहमाविशेत्
    । वन्ध्या वा काकवन्ध्या वा मृतवत्सा च याङ्गना ॥ ३५॥ सा बध्नीयान् कण्ठदेशे लभेत् पुत्रांश्चिरायुषः
    । गुरुपदेशतो धृत्वा गुरुं ध्यात्वा मनुं जपन् ॥ ३६॥ वर्णलक्षपुरश्चर्या फलमाप्नोति साधकः । बहुनोक्तेन
    किं देवि कवचस्यास्य पार्वति ॥ ३७॥ विनानेन न सिद्धिः स्यान्मन्त्रस्यास्य महेश्वरि । सर्वागमरहस्याढ्यं
    तत्त्वात् तत्त्वं परात् परम् ॥ ३८॥ अभक्ताय न दातव्यं कुचैलाय दुरात्मने । दीक्षिताय कुलीनाय स्वशिष्याय
    महात्मने ॥ ३९॥ महाचीनपदस्थाय दातव्यं कवचोत्तमम् । गुह्यं गोप्यं महादेवि लक्ष्मीनारायणप्रियम् । वज्रपञ्जरकं
    वर्म गोपनीयं स्वयोनिवत् ॥ ४०॥ ॥ इति श्रीरुद्रयामले तन्त्रे श्रीदेवीरहस्ये लक्ष्मीनारायणकवचं सम्पूर्णम्
    ॥
