id: badrinarayanastotram-2
category: stotram
name:
  english: badrinarayanastotram 2
  devanagari: बद्रीनारायणस्तोत्रम् २
content:
  english: vishvadikam | yasminnityamaham jale jalamiva prapyaikatam samsthitah nityam tam badarishvaram
    guruvaram saccitsukham naumyaham || 2|| ekasmin kathamidrisham jagadidam maya'pi va bhavyate naikasminnitarasya
    bhava iti yatsatyam shruteh sammatam || dvaitam heturaho bhayasya gaditam jnatvaikyamalambya ca nityam
    tam badarishvaram guruvaram saccitsukham naumyaham || 3|| vandhyaputrajaniryathaimva kilataddhetustathaimva
    mrisha vishvam
  devanagari: विश्वादिकम् । यस्मिन्नित्यमहं जले जलमिव प्राप्यैकतां संस्थितः नित्यं तं बदरीश्वरं गुरुवरं
    सच्चित्सुखं नौम्यहम् ॥ २॥ एकस्मिन् कथमीदृशं जगदिदं मायाऽपि वा भाव्यते नैकस्मिन्नितरस्य भाव इति यत्सत्यं
    श्रुतेः सम्मतम् ॥ द्वैतं हेतुरहो भयस्य गदितं ज्ञात्वैक्यमालम्ब्य च नित्यं तं बदरीश्वरं गुरुवरं सच्चित्सुखं
    नौम्यहम् ॥ ३॥ वन्ध्यापुत्रजनिर्यथैंव किलतद्धेतुस्तथैंव मृषा विश्वं
meaning: {}
