id: sarthatharva
category: upanishad
name:
  english: sarthatharva
  devanagari: सार्थाथर्व
content:
  english: '|| phalashruti || etadatharvashirsham yo''dhite || sa brahmabhuyaya kalpate || sa sarvatah
    sukhamedhate || sa sarva vighnairnabadhyate || sa pamcamahapapatpramucyate || sayamadhiyano divasakritam
    papam nashayati || prataradhiyano ratrikritam papam nashayati || sayampratah prayumjano apapo bhavati
    || sarvatradhiyano''pavighno bhavati || dharmarthakamamoksham ca vimdati || idamatharvashirshamashishyaya
    na deyam || yo yadi mohaddasyati sa papiyan bhavati sahasravartanat yam yam kamamadhite tam tamanena
    sadhayet || 11|| phala'
  devanagari: ॥ फलश्रुति ॥ एतदथर्वशीर्षं योऽधीते ॥ स ब्रह्मभूयाय कल्पते ॥ स सर्वतः सुखमेधते ॥ स सर्व विघ्नैर्नबाध्यते
    ॥ स पंचमहापापात्प्रमुच्यते ॥ सायमधीयानो दिवसकृतं पापं नाशयति ॥ प्रातरधीयानो रात्रिकृतं पापं नाशयति
    ॥ सायंप्रातः प्रयुंजानो अपापो भवति ॥ सर्वत्राधीयानोऽपविघ्नो भवति ॥ धर्मार्थकाममोक्षं च विंदति ॥ इदमथर्वशीर्षमशिष्याय
    न देयम् ॥ यो यदि मोहाद्दास्यति स पापीयान् भवति सहस्रावर्तनात् यं यं काममधीते तं तमनेन साधयेत् ॥ ११॥
    फल
