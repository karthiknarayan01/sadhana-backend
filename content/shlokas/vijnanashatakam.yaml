id: vijnanashatakam
category: shataka
name:
  english: vijnanashatakam
  devanagari: विज्नानशतकम्
content:
  english: stadvadriptakadantavaidyakakalakalpo'pi nishkincanah | yatra kvapi vinashaya krishatanurbhupalasevaparo
    jivanneva mritayate kimaparam samsaraduhsagare || 81|| adhyah kashcidapandito'pi vidusham sevyah sada
    dharmiko vishveshamupajarako mrigadrishamanandakandakarah | karpuradyutikirtibhushitaharidbhumandale
    giyate shashvaddvandijanairmahitanubhritah punyairna kasyodayah || 82|| kartavyam na karoti bandhubhirapi
    snehatmabhirvoditah kamitvadabhimanyate hitamatam dhiropyabhishtam narah | nishkamasya na vikriya
    tanubhrito loke kvaciddrishyate yattasmadayameva mulamakhilanarthasya nirdharitam || 83|| nishkama
    munayah paravaradrisho nirdhutapapmodaya nihsanga nirahankrita nirupamanandam param lebhire | yadgatva
    na luthanti matrijathare duhkhakare manava durgandhe punaretyakamamakare samsarapathonidhau || 84||
    kamasyapi nidanamahurapare mayam mahashasana nishcitkam sakalaprapancaracanacaturyalilavatim | yatsangadbhagavanapi
    prabhavati pratyanmahamohaha shrirango bhuvanodayavanalayavyaparacakrekriyah || 85|| tulyarthena tvamaikyam
    tribhuvanajanakastatpadarthahprapadya pratyaksham mohajanma tyajati bhagavati tvampadartho'pi jivah
    | shrutyacaryaprasadannirupamavilasadbrahmavidyaistadaikyam prapyanandapratishtho bhavati vigalitanadyavidyoparihah
    || 86|| samnyaso vihitasya keshavapadadvandve vyadhayi shruta vedanta niravadyanishkalaparanandah
    sunishthashciram | samsare vadhabandhaduhkhabahule mayavilase'vyayam brahmasmiti vihaya nanyadadhuna
    kartavyamaste kvacit || 87|| hitva vishvadyavasthah prakritivilasita jagradadyairvisheshaih sardham
    caitanyadhatau prakritimapi samam karyajatairasheshaih | jnananandam turiyam vigalitagunakam deshakaladyatitam
    svatmanam vitanidrah satatamadhikritashcintayedadvitiyam || 88|| agrepashcadadhastadupari ca parito
    dikshu dhanyasvanadih kutastha samvideka sakalatanubhritamantaratmaniyantri | yasyanandasvabhava sphurati
    shubhadhiyah pratyaham nishprapanca jivanmuktah sa loke jayati gatamahamohavishvaprapancah || 90||
    kvaham brahmeti vidya niratishayasukham darshayanti vishuddham kutastham svaprakasham prakriti sucarita
    khandayanti ca mayam | kvavidyaham mameti sthagitaparasukha cittabhittau likhanti sarvanarthananarthan
    vishayagiribhuva vasanagairikena || 91|| aham brahmasmiti sphuradamalabodho yadi bhave
  devanagari: स्तद्वदृप्तकदन्तवैद्यककलाकल्पोऽपि निष्किञ्चनः । यत्र क्वापि विनाशया कृशतनुर्भूपालसेवापरो
    जीवन्नेव मृतायते किमपरं संसारदुःसागरे ॥ ८१॥ आढ्यः कश्चिदपण्डितोऽपि विदुषां सेव्यः सदा धार्मिको विश्वेषामुपजारको
    मृगदृशामानन्दकन्दाकरः । कर्पूरद्युतिकीर्तिभूषितहरिद्भूमण्डले गीयते शश्वद्द्वन्दिजनैर्महीतनुभृतः पुण्यैर्न
    कस्योदयः ॥ ८२॥ कर्तव्यं न करोति बन्धुभिरपि स्नेहात्मभिर्वोदितः कामित्वादभिमन्यते हितमतं धीरोप्यभीष्टं
    नरः । निष्कामस्य न विक्रिया तनुभृतो लोके क्वचिद्दृश्यते यत्तस्मादयमेव मूलमखिलानर्थस्य निर्धारितम्
    ॥ ८३॥ निष्कामा मुनयः परावरदृशो निर्धूतपाप्मोदया निःसङ्गा निरहङ्कृता निरुपमानन्दं परं लेभिरे । यद्गत्वा
    न लुठन्ति मातृजठरे दुःखाकरे मानवा दुर्गन्धे पुनरेत्यकाममकरे संसारपाथोनिधौ ॥ ८४॥ कामस्यापि निदानमाहुरपरे
    मायां महाशासना निश्चित्कां सकलप्रपञ्चरचनाचातुर्यलीलावतीम् । यत्सङ्गाद्भगवानपि प्रभवति प्रत्यङ्महामोहहा
    श्रीरङ्गो भुवनोदयावनलयव्यापारचक्रेक्रियाः ॥ ८५॥ तुल्यार्थेन त्वमैक्यं त्रिभुवनजनकस्तत्पदार्थःप्रपद्य
    प्रत्यक्षं मोहजन्म त्यजति भगवति त्वंपदार्थोऽपि जीवः । श्रुत्याचार्यप्रसादान्निरुपमविलसद्ब्रह्मविद्यैस्तदैक्यं
    प्राप्यानन्दप्रतिष्ठो भवति विगलितानाद्यविद्योपरीहः ॥ ८६॥ संन्यासो विहितस्य केशवपदद्वन्द्वे व्यधायि
    श्रुता वेदान्ता निरवद्यनिष्कलपरानन्दाः सुनिष्ठाश्चिरम् । संसारे वधबन्धदुःखबहुले मायाविलासेऽव्ययं ब्रह्मास्मीति
    विहाय नान्यदधुना कर्तव्यमास्ते क्वचित् ॥ ८७॥ हित्वा विश्वाद्यवस्थाः प्रकृतिविलसिता जाग्रदाद्यैर्विशेषैः
    सार्धं चैतन्यधातौ प्रकृतिमपि समं कार्यजातैरशेषैः । ज्ञानानन्दं तुरीयं विगलितगुणकं देशकालाद्यतीतं स्वात्मानं
    वीतनिद्रः सततमधिकृतश्चिन्तयेदद्वितीयम् ॥ ८८॥ अग्रेपश्चादधस्तादुपरि च परितो दिक्षु धान्यास्वनादिः कूटस्था
    संविदेका सकलतनुभृतामन्तरात्मानियन्त्री । यस्यानन्दस्वभावा स्फुरति शुभधियः प्रत्यहं निष्प्रपञ्चा जीवन्मुक्तः
    स लोके जयति गतमहामोहविश्वप्रपञ्चः ॥ ९०॥ क्वाहं ब्रह्मेति विद्या निरतिशयसुखं दर्शयन्ती विशुद्धं कूटस्थं
    स्वप्रकाशं प्रकृति सुचरिता खण्डयन्ती च मायाम् । क्वाविद्याहं ममेति स्थगितपरसुखा चित्तभित्तौ लिखन्ती
    सर्वानर्थाननर्थान् विषयगिरिभुवा वासनागैरिकेण ॥ ९१॥ अहं ब्रह्मास्मीति स्फुरदमलबोधो यदि भवे
