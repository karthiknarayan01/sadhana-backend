id: dhruvasuktam
category: sukta
name:
  english: dhruvasuktam
  devanagari: ध्रुवसूक्तम्
content:
  english: dhruvasuktam a tva̭harshama̱ntarḙdhi dhru̱vasti̱shthavi̭cacalih | visha̭stva̱ sarva̭ vanchantu̱
    ma tvadra̱shtramadhi̭ bhrashat || 10
  devanagari: ध्रुवसूक्तम् आ त्वा॑हार्षम॒न्तरे॑धि ध्रु॒वस्ति॒ष्ठावि॑चाचलिः । विश॑स्त्वा॒ सर्वा॑ वाञ्छन्तु॒
    मा त्वद्रा॒ष्ट्रमधि॑ भ्रशत् ॥ १०
meaning: {}
