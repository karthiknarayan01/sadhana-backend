id: sankarshanopanishat
category: upanishad
name:
  english: sankarshanopanishat
  devanagari: सन्कर्षणोपनिषत्
content:
  english: sankarshanopanishat atha tadvishnoh iti shantih | atha sankarshanopanishaducyate | shesho ha
    vai vasudevatsankarshano nama jata asit | so'kamayata prajah srijeyeti | tatah pradyumnasamjnam mana
    asit | tasmadahankaranama'niruddhah | tato hiranyagarbho'jayata | tasmaddasha prajapatayo maricyadayah
    sthanudakshakardamapriyavratottanapadadayo'pyajayanta | tebhyah sarvani bhutani ca | tasmaccheshadeva
    sarvani samutpadyante | tasminneva praliyante | sa eva bahudha jayamanah sarvan paripati | sa eva
    kadraveyo vyakaranajyautishadishastrani nirmimano bahubhirmumukshubhirupasyamano'khilam bhuvamekasmin
    shirshni siddharthavaddhara
  devanagari: सङ्कर्षणोपनिषत् अथ तद्विष्णोः इति शान्तिः । अथ सङ्कर्षणोपनिषदुच्यते । शेषो ह वै वासुदेवात्सङ्कर्षणो
    नाम जात आसीत् । सोऽकामयत प्रजाः सृजेयेति । ततः प्रद्युम्नसंज्ञं मन आसीत् । तस्मादहङ्कारनामाऽनिरुद्धः
    । ततो हिरण्यगर्भोऽजायत । तस्माद्दश प्रजापतयो मरीच्यादयः स्थाणुदक्षकर्दमप्रियव्रतोत्तानपादादयोऽप्यजायन्त
    । तेभ्यः सर्वाणि भूतानि च । तस्माच्छेषादेव सर्वाणि समुत्पद्यन्ते । तस्मिन्नेव प्रलीयन्ते । स एव बहुधा
    जायमानः सर्वान् परिपाति । स एव काद्रवेयो व्याकरणज्यौतिषादिशास्त्राणि निर्मिमाणो बहुभिर्मुमुक्षुभिरुपास्यमानोऽखिलां
    भुवमेकस्मिन् शीर्ष्णि सिद्धार्थवद्धार
meaning: {}
