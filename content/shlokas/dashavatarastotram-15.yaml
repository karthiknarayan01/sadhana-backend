id: dashavatarastotram-15
category: stotram
name:
  english: dashavatarastotram 15
  devanagari: दशावतारस्तोत्रम् १५
content:
  english: dashavatarastotram 15 bhaktartibhanga kshamaya dhiya yah | stambhantahalanudito nrisimhah ||
    ripum suranam nishitairnakhayaih | vidarayatam na ca vismarami || iti dashavatarastotram sampurnam
    |
  devanagari: दशावतारस्तोत्रम् १५ भक्तार्तिभङ्ग क्षमया धिया यः । स्तम्भान्तहालानुदितो नृसिंहः ॥ रिपुं
    सुराणां निशितैर्नखायैः । विदारयतं न च विस्मरामि ॥ इति दशावतारस्तोत्रं सम्पूर्णम् ।
meaning: {}
