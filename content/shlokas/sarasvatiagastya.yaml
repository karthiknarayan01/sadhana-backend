id: sarasvatiagastya
category: stotram
name:
  english: sarasvatiagastya
  devanagari: सरस्वतिआगस्त्य
content:
  english: sa mam patu sarasvati bhagavati nishsheshajadyapaha || 1|| dorbhiryukta caturbhih sphatikamaninibhairakshamalandadhana
    hastenaikena padmam sitamapica shukam pustakam caparena | bhasa kundendushankhasphatikamaninibha bhasamana'samana
    sa me vagdevateyam nivasatu vadane sarvada suprasanna || 2|| surasurasevitapadapankaja kare virajatkamaniyapustaka
    | virincipatni kamalasanasthita sarasvati nrityatu vaci me sada || 3|| sarasvati sarasijakesaraprabha
    tapasvini sitakamalasanapriya | ghanastani kamalavilolalocana manasvini bhavatu varaprasadini || 4||
    sarasvati namastubhyam varade kamarupini | vidyarambham karishyami siddhirbhavatu me sada || 5|| sarasvati
    namastubhyam sarvadevi namo namah | shantarupe shashidhare sarvayoge namo namah || 6|| nityanande
    niradhare nishkalayai namo namah | vidyadhare vishalakshi shuddhajnane namo namah || 7|| shuddhasphatikarupayai
    sukshmarupe namo namah | shabdabrahmi caturhaste sarvasid
  devanagari: सा मां पातु सरस्वती भगवती निश्शेषजाड्यापहा ॥ १॥ दोर्भिर्युक्ता चतुर्भिः स्फटिकमणिनिभैरक्षमालान्दधाना
    हस्तेनैकेन पद्मं सितमपिच शुकं पुस्तकं चापरेण । भासा कुन्देन्दुशङ्खस्फटिकमणिनिभा भासमानाऽसमाना सा मे
    वाग्देवतेयं निवसतु वदने सर्वदा सुप्रसन्ना ॥ २॥ सुरासुरासेवितपादपङ्कजा करे विराजत्कमनीयपुस्तका । विरिञ्चिपत्नी
    कमलासनस्थिता सरस्वती नृत्यतु वाचि मे सदा ॥ ३॥ सरस्वती सरसिजकेसरप्रभा तपस्विनी सितकमलासनप्रिया । घनस्तनी
    कमलविलोललोचना मनस्विनी भवतु वरप्रसादिनी ॥ ४॥ सरस्वति नमस्तुभ्यं वरदे कामरूपिणि । विद्यारम्भं करिष्यामि
    सिद्धिर्भवतु मे सदा ॥ ५॥ सरस्वति नमस्तुभ्यं सर्वदेवि नमो नमः । शान्तरूपे शशिधरे सर्वयोगे नमो नमः ॥
    ६॥ नित्यानन्दे निराधारे निष्कलायै नमो नमः । विद्याधरे विशालाक्षि शुद्धज्ञाने नमो नमः ॥ ७॥ शुद्धस्फटिकरूपायै
    सूक्ष्मरूपे नमो नमः । शब्दब्रह्मि चतुर्हस्ते सर्वसिद्
