    vidutidi magatana mòkkòya arunacala eti ki nidura nannitarulu lagaga idi niku nyayama arunacala pancendriya
    khalulu madilona duruco madini nivundavo arunacala òkadavau ninu maya mònarinci vaccuvarèvaridi ni
    jalamu arunacala arunacala shiva arunacala shiva arunacala shiva arunacala arunacala shiva arunacala
