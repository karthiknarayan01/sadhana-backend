id: radhauddhava
category: stotram
name:
  english: radhauddhava
  devanagari: राधाउद्धव
content:
  english: shriradhaprarthana uddhavakrita uddhava uvaca | cetanam kuru kalyani jaganmatarnamo'stute |
    tvameva praktanam sarvam krishnam drakshyasi sampratam || 1|| tvatto vishvam pavitram ca tvatpadarajasa
    mahi | supavitram tvadvadanam punyavatyashca gopikah || 2|| lokastvameva gayanti gitairmangalasamstavaih
    | tvatsukirtim ca vedashca sanakadyashca samtatam || 3|| kritapapaharam punyam tirthapujam ca nirmalam
    | haribhaktipradam bhadram sarvavighnavinashinim || 4|| tvameva radha tvam krishnastvam puman prakritih
    para | radhamadhavayorbhedo na purane shrutau tatha || 5 || || iti shribrahmavaivarte purane shrikrishnajanmakhande
    uddhavakrita shriradha prarthana sampurna ||
  devanagari: श्रीराधाप्रार्थना उद्धवकृता उद्धव उवाच । चेतनं कुरु कल्याणि जगन्मातर्नमोऽस्तुते । त्वमेव
    प्राक्तनं सर्वं कृष्णं द्रक्ष्यसि साम्प्रतम् ॥ १॥ त्वत्तो विश्वं पवित्रं च त्वत्पादरजसा मही । सुपवित्रं
    त्वद्वदनं पुण्यवत्यश्च गोपिकाः ॥ २॥ लोकास्त्वामेव गायन्ति गीतैर्मङ्गलसंस्तवैः । त्वत्सुकीर्तिं च वेदाश्च
    सनकाद्याश्च संततम् ॥ ३॥ कृतपापहरां पुण्यां तीर्थपुजां च निर्मलाम् । हरिभक्तिप्रदां भद्रां सर्वविघ्नविनाशिनीम्
    ॥ ४॥ त्वमेव राधा त्वं कृष्णस्त्वं पुमान् प्रकृतिः परा । राधामाधवयोर्भेदो न पुराणे श्रुतौ तथा ॥ ५ ॥
    ॥ इति श्रीब्रह्मवैवर्ते पुराणे श्रीकृष्णजन्मखण्डे उद्धवकृता श्रीराधा प्रार्थना सम्पूर्णा ॥
