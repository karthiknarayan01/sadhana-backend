id: brahmanaproktamsarasvatamvishnustotram
category: stotram
name:
  english: brahmanaproktamsarasvatamvishnustotram
  devanagari: ब्राह्मणप्रोक्तंसारस्वतंविष्णुस्तोत्रम्
content:
  english: om harim kushnam hrishikesham vasudevam janardanam | pranato'smi jagannatham sa me papam vyapohatu
    || 66|| caracaragurum natham govindam sheshashayinam | pranato'smi param devam sa me papam vyapohatu
    || 67|| shankhinam cakrinam sharngadharinam sragdharam param | pranato'smi patim lakshmyah sa me papam
    vyapohatu || 68|| damodaramudaraksham pundarikakshamacyutam | pranato'smi stutam stutyaih sa me papam
    vyapohatu || 69|| narayanam naram shaurim madhavam madhusudanam | pranato'smi dharadharam sa me papam
    vyapohatu || 70|| keshavam candrasuryaksham kamsakeshinishudanam | pranato'smi mahabahum sa me papam
    vyapohatu || 71|| shrivatsavakshasam shrisham shridharam shriniketanam | pranato'smi shriyah kantam
    sa me papam vyapohatu || 72|| yamisham sarvabhutanam dhyayanti yatayo | aksharam|vasudevamanirdeshyam
    tamasmi sharanam gatah || 73|| samastalambanebhyo yam vyavrittya manaso gatim | dhyayanti vasudevakhyam
    tamasmi sharanam gatah || 74|| sarvagam sarvabhutam ca sarvasyadharamishvaram | vasudevam param brahma
    tamasmi sharanam gatah || 75|| paramatmanamavyaktam yam prayanti sumedhasah | karmakshaye'kshayam
    devam tamasmi sharanam gatah || 76|| punyapapavinirmukta yam pravishya punarbhavam | na yoginah prapnuvanti
    tamasmi sharanam gatah || 77|| brahma bhutva jagatsarvam sadevasuramanusham | yah srijatyacyuto devastamasmi
    sharanam gatah || 78|| brahmatve yasya vaktrebhyashcaturvedamayam vapuh | prabhuh puratano jajne tamasmi
    sharanam gatah || 79|| brahmarupadharam devam jagadyonim janardanam | srashtritve samsthitam srishtau
    pranato'smi sanatanam || 80|| srashta bhutva sthito yogi sthitavasurasudanah | tamadipurusham vishnum
    pranato'smi janardanam || 81|| dhrita mahi hata daityah paritratastatha surah | yena tam vishnumadyesham
    pranato'smi janardanam || 82|| yajnairyajanti yam vipra yajnesham yajnabhavanam | tam yajnapurusham
    vishnum pranato'smi sanatanam || 83|| patalavithibhutani tatha lokan nihanti yah | tamantapurusham
    rudram pranato'smi sanatanam || 84|| sambhakshayitva sakalam yathasrishtamidam jagat | yo vai nrityati
    rudratma pranato'smi janardanam || 85|| surasurah pitriganah yakshagandharvarakshasah | sambhuta yasya
    devasya sarvagam tam namamyaham || 86|| samastadevah sakala manushyanam ca jatayah | yasyamshabhuta
    devasya sarvagam tam nato'smyaham || 87|| vrikshagulmadayo yasya tatha pashumrigadayah | ekamshabhuta
    devasya sarvagam tam namamyaham || 88|| yasmannanyatparam kincidyasmin sarvam mahatmani | yah sarvamadhyago'nantah
    sarvagam tam namamyaham || 89|| yatha sarveshu bhuteshu gudho'gniriva darushu | vishnurevam tatha
    papam mamashesham pranashyatu || 90|| yatha vishnumayam sarvam brahmadi sacaracaram | yacca jnanaparicchedyam
    papam nashyatu me tatha || 91|| shubhashubhani karmani rajahsattvatamamsi ca | anekajanmakarmottham
    papam nashyatu me tatha || 92|| yannishayam ca yatprataryanmadhyahnaparahnayoh | sandhyayoshca kritam
    papam karmana manasa gira || 93|| yattishthata yadvrajata yacca shayyagatena me | kritam yadashubham
    karma kayena manasa gira || 94|| ajnanato jnanato va madaccalitamanasaih | tatkshipram vilayam yatu
    vasudevasya kirtanat || 95|| paradaraparadravyavanchadrohodbhavam ca yat | parapidodbhavam nindam
    kurvata yanmahatmanam || 96|| yacca bhojye tatha peye bhakshye coshye vilehane | tadyatu vilayam toye
    yatha lavanabhajanam || 97|| yadbalye yacca kaumare yatpapam yauvane mama | vayah parinatau yacca
    yacca janmatare kritam || 98|| tannarayana
  devanagari: ॐ हरिं कुष्णं हृषीकेशं वासुदेवं जनार्दनम् । प्रणतोऽस्मि जगन्नाथं स मे पापं व्यपोहतु ॥ ६६॥
    चराचरगुरुं नाथं गोविन्दं शेषशायिनम् । प्रणतोऽस्मि परं देवं स मे पापं व्यपोहतु ॥ ६७॥ शङ्खिनं चक्रिणं
    शार्ङ्गधारिणं स्रग्धरं परम् । प्रणतोऽस्मि पतिं लक्ष्म्याः स मे पापं व्यपोहतु ॥ ६८॥ दामोदरमुदाराक्षं
    पुण्डरीकाक्षमच्युतम् । प्रणतोऽस्मि स्तुतं स्तुत्यैः स मे पापं व्यपोहतु ॥ ६९॥ नारायणं नरं शौरिं माधवं
    मधुसूदनम् । प्रणतोऽस्मि धराधारं स मे पापं व्यपोहतु ॥ ७०॥ केशवं चन्द्रसूर्याक्षं कंसकेशिनिषूदनम् ।
    प्रणतोऽस्मि महाबाहुं स मे पापं व्यपोहतु ॥ ७१॥ श्रीवत्सवक्षसं श्रीशं श्रीधरं श्रीनिकेतनम् । प्रणतोऽस्मि
    श्रियः कान्तं स मे पापं व्यपोहतु ॥ ७२॥ यमीशं सर्वभूतानां ध्यायन्ति यतयो । अक्षरम्।वासुदेवमनिर्देश्यं
    तमस्मि शरणं गतः ॥ ७३॥ समस्तालम्बनेभ्यो यं व्यावृत्त्य मनसो गतिम् । ध्यायन्ति वासुदेवाख्यं तमस्मि शरणं
    गतः ॥ ७४॥ सर्वगं सर्वभूतं च सर्वस्याधारमीश्वरम् । वासुदेवं परं ब्रह्म तमस्मि शरणं गतः ॥ ७५॥ परमात्मानमव्यक्तं
    यं प्रयान्ति सुमेधसः । कर्मक्षयेऽक्षयं देवं तमस्मि शरणं गतः ॥ ७६॥ पुण्यपापविनिर्मुक्ता यं प्रविश्य
    पुनर्भवम् । न योगिनः प्राप्नुवन्ति तमस्मि शरणं गतः ॥ ७७॥ ब्रह्म भूत्वा जगत्सर्वं सदेवासुरमानुषम् ।
    यः सृजत्यच्युतो देवस्तमस्मि शरणं गतः ॥ ७८॥ ब्रह्मत्वे यस्य वक्त्रेभ्यश्चतुर्वेदमयं वपुः । प्रभुः पुरातनो
    जज्ञे तमस्मि शरणं गतः ॥ ७९॥ ब्रह्मरूपधरं देवं जगद्योनिं जनार्दनम् । स्रष्टृत्वे संस्थितं सृष्टौ प्रणतोऽस्मि
    सनातनम् ॥ ८०॥ स्रष्टा भूत्वा स्थितो योगी स्थितावसुरसूदनः । तमादिपुरुषं विष्णुं प्रणतोऽस्मि जनार्दनम्
    ॥ ८१॥ धृता मही हता दैत्याः परित्रातास्तथा सुराः । येन तं विष्णुमाद्येशं प्रणतोऽस्मि जनार्दनम् ॥ ८२॥
    यज्ञैर्यजन्ति यं विप्रा यज्ञेशं यज्ञभावनम् । तं यज्ञपुरुषं विष्णुं प्रणतोऽस्मि सनातनम् ॥ ८३॥ पातालवीथीभूतानि
    तथा लोकान् निहन्ति यः । तमन्तपुरुषं रुद्रं प्रणतोऽस्मि सनातनम् ॥ ८४॥ सम्भक्षयित्वा सकलं यथासृष्टमिदं
    जगत् । यो वै नृत्यति रुद्रात्मा प्रणतोऽस्मि जनार्दनम् ॥ ८५॥ सुरासुराः पितृगणाः यक्षगन्धर्वराक्षसाः
    । सम्भूता यस्य देवस्य सर्वगं तं नमाम्यहम् ॥ ८६॥ समस्तदेवाः सकला मनुष्याणां च जातयः । यस्यांशभूता देवस्य
    सर्वगं तं नतोऽस्म्यहम् ॥ ८७॥ वृक्षगुल्मादयो यस्य तथा पशुमृगादयः । एकांशभूता देवस्य सर्वगं तं नमाम्यहम्
    ॥ ८८॥ यस्मान्नान्यत्परं किञ्चिद्यस्मिन् सर्वं महात्मनि । यः सर्वमध्यगोऽनन्तः सर्वगं तं नमाम्यहम् ॥
    ८९॥ यथा सर्वेषु भूतेषु गूढोऽग्निरिव दारुषु । विष्णुरेवं तथा पापं ममाशेषं प्रणश्यतु ॥ ९०॥ यथा विष्णुमयं
    सर्वं ब्रह्मादि सचराचरम् । यच्च ज्ञानपरिच्छेद्यं पापं नश्यतु मे तथा ॥ ९१॥ शुभाशुभानि कर्माणि रजःसत्त्वतमांसि
    च । अनेकजन्मकर्मोत्थं पापं नश्यतु मे तथा ॥ ९२॥ यन्निशायां च यत्प्रातर्यन्मध्याह्नापराह्नयोः । सन्ध्ययोश्च
    कृतं पापं कर्मणा मनसा गिरा ॥ ९३॥ यत्तिष्ठता यद्व्रजता यच्च शय्यागतेन मे । कृतं यदशुभं कर्म कायेन मनसा
    गिरा ॥ ९४॥ अज्ञानतो ज्ञानतो वा मदाच्चलितमानसैः । तत्क्षिप्रं विलयं यातु वासुदेवस्य कीर्तनात् ॥ ९५॥
    परदारपरद्रव्यवाञ्छाद्रोहोद्भवं च यत् । परपीडोद्भवां निन्दां कुर्वता यन्महात्मनाम् ॥ ९६॥ यच्च भोज्ये
    तथा पेये भक्ष्ये चोष्ये विलेहने । तद्यातु विलयं तोये यथा लवणभाजनम् ॥ ९७॥ यद्बाल्ये यच्च कौमारे यत्पापं
    यौवने मम । वयः परिणतौ यच्च यच्च जन्मातरे कृतम् ॥ ९८॥ तन्नारायण
