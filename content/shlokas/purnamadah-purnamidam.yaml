id: purnamadah-purnamidam
category: shanti_mantra
name:
  english: Purnamadah Purnamidam
  devanagari: पूर्णमदः पूर्णमिदम्
content:
  english: >-
    om purnam adah purnam idam purnat purnam udachyate, purnasya
    purnam adaya purnam evavashishyate
  devanagari: >-
    ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय
    पूर्णमेवावशिष्यते ॥
meaning:
  english: >-
    That is whole, this is whole; wholeness arises from wholeness.
    Take wholeness from wholeness, and only wholeness remains.
source_attribution:
  text_source: Brihadaranyaka Upanishad 5.1.1 (also invoked before the Isha Upanishad)
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
