id: skandaproktamrudramantrahomamupadesham
category: mantra
name:
  english: skandaproktamrudramantrahomamupadesham
  devanagari: स्कन्दप्रोक्तंरुद्रमन्त्रहोममुपदेशम्
content:
  english: savyamantro namorajasya ityatha | namah shushkyaya ca tatha harityayaparo manuh || 37|| namo
    lopyatha cetyanyo nama ulapya ityatha | namo urvyaya capyanyo nama paryaya capyatha || 38|| namo'paguramaneti
    tathabhighnata ityatha | nama akkhitadate namo vah kiriko manuh || 39|| namo devadihridayam namo vikshinakam
    param | namo vicinvatkebhyashca nama anirhate param || 40|| nama amivanmanushca proccaretsiddhavidyakah
    | drape andhasa ityanyo yate rudra shivetyatha || 41|| ima rudraya vidyanya mridano rudramantrakah
    | mano mahantamityanyo manastoke manustatha || 42|| aratte gaghna ityanyohyasmin ityaparo manuh |
    nilagriva iti hyanyo nilagriva itiritah || 43|| ye vriksheshu mantro'nyo ye bhutanamathaparah | ye
    anneshu ityanyo ye patham pathi mantrakah || 44|| yetirthani mantro'nyo ya etantashca ityapi | namorudrebhya
    ityanya tam ve jambheti ca tribhih || 45|| evam shatam te mantrah syuh shatarudrah samiritah | ashtapancashadadhikah
    shatam mantrah prakirtitah || 46|| yete'mritakhya mantrahsyuramritatvapradayakah | shrirudrayedam
    na mametyuccaryam brahmanottamaih || 47|| ashta pancashadadhikashatamantraih phalapradaih | hutva
    pashcadvasordharamekonahutimacaret || 48|| evamekadashavrittya rudraikadashini smrita | shraddhaya
    namakantasthairmantrairhutvajyamadarat || 49|| vasordharam japannante kurvannevahutim budhah | rudraikadashinihomam
    rudravrittya samacaret || 50|| maharudrangahomo'yam sarvaghaughavinashanah | atirudraistatha kuryuh
    shatamekadashottaram || 51|| namakenanuvakena homam kritva vicakshanah | camakenanuvakena homam kuryustato
    dvijah || 52|| punah samagranamakam japtvante vahnivallabham | ekamekahutim kuryatsamagranamakam tatah
    || 53|| japtva'nte vahnidayitamuccaryaikahutim caret | iti varatrayam kuryatpurnahutimatah param ||
    54|| atirudranga homo'yam sarvapratyuhanashanah | etacca dvigunam proktam maharudrajapo
  devanagari: सव्यमन्त्रो नमोरजस्य इत्यथ । नमः शुष्क्याय च तथा हरित्यायापरो मनुः ॥ ३७॥ नमो लोप्याथ चेत्यन्यो
    नम उलप्य इत्यथ । नमो ऊर्व्याय चाप्यन्यो नम पर्याय चाप्यथ ॥ ३८॥ नमोऽपगुरमाणेति तथाभिघ्नत इत्यथ । नम
    आक्खितदते नमो वः किरिको मनुः ॥ ३९॥ नमो देवादिहृदयं नमो विक्षीणकं परम् । नमो विचिन्वत्केभ्यश्च नम आनिर्हते
    परम् ॥ ४०॥ नम आमीवन्मनुश्च प्रोच्चरेत्सिद्धविद्यकः । द्रापे अन्धस इत्यन्यो याते रुद्र शिवेत्यथ ॥ ४१॥
    इमा रुद्राय विद्यान्या मृडानो रुद्रमन्त्रकः । मानो महान्तमित्यन्यो मानस्तोके मनुस्तथा ॥ ४२॥ आरात्ते
    गाघ्न इत्यन्योह्यस्मिन् इत्यपरो मनुः । नीलग्रीवा इति ह्यन्यो नीलग्रीवा इतीरिताः ॥ ४३॥ ये वृक्षेषु
    मन्त्रोऽन्यो ये भूतानामथापरः । ये अन्नेषु इत्यन्यो ये पथां पथि मन्त्रकः ॥ ४४॥ येतीर्थानि मन्त्रोऽन्यो
    य एतान्तश्च इत्यपि । नमोरुद्रेभ्य इत्यन्य तं वे जम्भेति च त्रिभिः ॥ ४५॥ एवं शतं ते मन्त्राः स्युः
    शतरुद्राः समीरिताः । अष्टपञ्चाशदधिकाः शतं मन्त्राः प्रकीर्तिताः ॥ ४६॥ येतेऽमृताख्या मन्त्राःस्युरमृतत्वप्रदायकाः
    । श्रीरुद्रायेदं न ममेत्युच्चार्यं ब्राह्मणोत्तमैः ॥ ४७॥ अष्ट पञ्चाशदधिकशतमन्त्रैः फलप्रदैः । हुत्वा
    पश्चाद्वसोर्धारामेकोनाहुतिमाचरेत् ॥ ४८॥ एवमेकादशावृत्त्या रुद्रैकादशिनी स्मृता । श्रद्धया नमकान्तस्थैर्मन्त्रैर्हुत्वाज्यमादरात्
    ॥ ४९॥ वसोर्धारां जपन्नन्ते कुर्वन्नेवाहुतिं बुधः । रुद्रैकादशिनीहोमं रुद्रावृत्त्या समाचरेत् ॥ ५०॥
    महारुद्राङ्गहोमोऽयं सर्वाघौघविनाशनः । अतिरुद्रैस्तथा कुर्युः शतमेकादशोत्तरम् ॥ ५१॥ नमकेनानुवाकेन होमं
    कृत्वा विचक्षणः । चमकेनानुवाकेन होमं कुर्युस्ततो द्विजाः ॥ ५२॥ पुनः समग्रनमकं जप्त्वान्ते वह्निवल्लभाम्
    । एकामेकाहुतिं कुर्यात्समग्रनमकं ततः ॥ ५३॥ जप्त्वाऽन्ते वह्निदयितामुच्चार्यैकाहुतिं चरेत् । इति वारत्रयं
    कुर्यात्पूर्णाहुतिमतः परम् ॥ ५४॥ अतिरुद्राङ्ग होमोऽयं सर्वप्रत्यूहनाशनः । एतच्च द्विगुणं प्रोक्तं
    महारुद्रजपो
