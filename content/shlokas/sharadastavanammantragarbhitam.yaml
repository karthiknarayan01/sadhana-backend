id: sharadastavanammantragarbhitam
category: mantra
name:
  english: sharadastavanammantragarbhitam
  devanagari: शारदास्तवनम्मन्त्रगर्भितम्
content:
  english: jadyavaridhim nistaranti tarasa rasasprishah || 4|| dravyabhavatimirapanodinim tavakinavadanenducandrikam
    | yasya locanacakorakadvayi piyate bhuvi sa eva punyabhak || 5|| vibhradangakamidam tvadarpitasnehamantharadrisha
    tarangitam | varnamatravadanakshamo'pyaham svam kritarthamavayami nishcitam || 6|| mauktikakshavalayabjakacchapipustakankitakaropashobhite
    | padmavasini
  devanagari: जाड्यवारिधिं निस्तरन्ति तरसा रसास्पृशः ॥ ४॥ द्रव्यभावतिमिरापनोदिनीं तावकीनवदनेन्दुचन्द्रिकाम्
    । यस्य लोचनचकोरकद्वयी पीयते भुवि स एव पुण्यभाक् ॥ ५॥ विभ्रदङ्गकमिदं त्वदर्पितस्नेहमन्थरदृशा तरङ्गितम्
    । वर्णमात्रवदनाक्षमोऽप्यहं स्वं कृतार्थमवयामि निश्चितम् ॥ ६॥ मौक्तिकाक्षवलयाब्जकच्छपीपुस्तकाङ्कितकरोपशोभिते
    । पद्मवासिनि
meaning: {}
