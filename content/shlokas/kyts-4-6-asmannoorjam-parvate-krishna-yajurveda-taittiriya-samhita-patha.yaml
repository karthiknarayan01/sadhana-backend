    यदूव॑द्ध्यमु॒दर॑स्याप॒वाति॒ य आ॒मस्य॑ क्र॒विषो॑ ग॒न्धो अस्ति॑ । सु॒कृ॒ता तच्छ॑मि॒तारः॑ कृण्वन्तू॒त
    मेधग्ं॑ शृत॒पाक॑ त्ते॒ गात्रा॑द॒ग्निना॑ प॒च्यमा॑नाद॒भि शूल॒ न्निह॑तस्याव॒धाव॑ति । मा त न्मा तृणे॑षु
    दे॒वेभ्य॒स्तदु॒शद्भ्यो॑ रा॒तम॑स्तु ॥ म्परि॒पश्य॑न्ति प॒क्वं ह॒रेति॑ । ये चार्व॑तो माग्ंसभि॒क्षामु॒पास॑त
    उ॒तो तेषा॑म॒भिगू र्तिर्न इन्वतु ॥ यन्नीक्ष॑ण म्मा॒ग्॒स्पच॑न्या उ॒खाया॒ या पात्रा॑णि यू॒ष्ण आ॒सेच॑नानि
    । ऊ॒ष्म॒ण्या॑ ऽपि॒धाना॑ चरू॒णाम॒ङ्का स्सू॒नाः परि॑ भूष॒न्त्यश्व यँच्च॒ पड्बी॑श॒मर्व॑तः । यच्च॑ प॒पौ
    यच्च॑ घा॒सि ञ्ज॒घास॒ सर्वा॒ ता ते॒ अपि॑ दे॒वेष्व॑स्तु ॥ मा त्वा॒ द्धू॒मग॑न्धि॒र्मोखा भ्राज॑न्त्य॒भि
    वि॑क्त॒ जघ्रिः॑ । इ॒ष्टं न्दे॒वासः॒ प्रति॑ गृभ्ण॒न्त्यश्व म् ॥ यदश्वा॑य॒ वास॑ उपस्तृ॒णन्त्य॑धीवा॒सं
    याँ हिर॑ण्यान्यस्मै । स॒न्दान॒मर्व॑न्त॒ म्प्रि॒या दे॒वेष्वा या॑मयन्ति ॥ य त्ते॑ सा॒दे मह॑सा॒ शूकृ॑तस्य॒
    पार् वा तु॒तोद॑ । स्रु॒चेव॒ ता ह॒विषो॑ अद्ध्व॒रेषु॒ सर्वा॒ ता ते॒ ब्रह्म॑णा सूदयामि ॥ चतु॑स्त्रिग्ंश
    द्वा॒जिनो॑ दे॒वब॑न्धो॒ स्समे॑ति । अच्छि॑द्रा॒ गात्रा॑ व॒युना॑ कृणोत॒ परु॑ष्परुरनु॒घुष्या॒ वि श॑स्त
    ॥ एक॒स्त्वष्टु॒रश्व॑स्या विश॒स्ता द्वा य॒न्तारा॑ भवत॒स्तथ॒र्तुः । या ते॒ गात्रा॑णामृतु॒था कृ॒णोमि॒
    ताता॒ पिण्डा॑ना॒ म्प्र जु॑होम्य॒ग्नौ ॥ मा त्वा॑ तप म्मा स्वधि॑तिस्त॒नुव॒ आ ति॑ष्ठिप त्ते । मा ते॑
    गृ॒द्ध्नु ऽति॒हाय॑ छि॒द्रा गात्रा ण्य॒सिना॒ मिथू॑ कः ॥ न वा उ॑वे॒तन्म्रि॑यसे॒ न रि॑ष्यसि दे॒वाग्ं
    इदे॑षि प॒थिभिः॑ सु॒गेभिः॑ । हरी॑ ते॒ युञ्जा॒ पृष॑ती अभूता॒मुपा द्वा॒जी धु॒रि रास॑भस्य ॥ सु॒गव्य॑ न्नो
    वा॒जी स्वश्वि॑य म्पु॒ग्ं॒सः पु॒त्राग्ं उ॒त वि॑श्वा॒पुषग्ं॑ र॒यिम् । अ॒ना॒गा॒स्त्व न्नो॒ अदि॑तिः कृणोतु
    क्ष॒त्र न्नो॒ अश्वो॑ वनताग्ं ह॒विष्मान्॑ ॥ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थ
    काण्डे षष्ठः प्रश्न
