id: patangakritamshivastotram
category: stotram
name:
  english: patangakritamshivastotram
  devanagari: पतन्गकृतंशिवस्तोत्रम्
content:
  english: prakashavaramaulidhrikpramathanatha vishvadhika | gajantakamahahava tripuraghorasamharaka prasiddhacaritadhuna
    madhuharakshipujyanghrika || 30|| deva vedanigamantavedya hrittapapapavinivaraka shambho | kalakala
    karunakara shambho pahi mamakhiladuhkhasamuhat || 31|| || iti shivarahasyantargate patangakritam shivastotram
    sampurnam ||
  devanagari: प्रकाशवरमौलिधृक्प्रमथनाथ विश्वाधिक । गजान्तकमहाहव त्रिपुरघोरसंहारक प्रसिद्धचरिताधुना मधुहराक्षिपूज्याङ्घ्रिक
    ॥ ३०॥ देव वेदनिगमान्तवेद्य हृत्तापपापविनिवारक शम्भो । कालकाल करुणाकर शम्भो पाहि मामखिलदुःखसमूहात्
    ॥ ३१॥ ॥ इति शिवरहस्यान्तर्गते पतङ्गकृतं शिवस्तोत्रं सम्पूर्णम् ॥
meaning: {}
