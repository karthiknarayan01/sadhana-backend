id: navagrahadhyanam
category: stotram
name:
  english: navagrahadhyanam
  devanagari: नवग्रहध्यानम्
content:
  english: kubjikasarvasve santaptakancananibham dvibhujam dayalum pitambaram dhritasaroruhadvandvashulam
    | krauncasanam hyasurasevitapadapadmam shukram smare dvinayanam hridi pankaje'ham || 6|| atha shanerdhyanam
  devanagari: कुब्जिकासर्वस्वे सन्तप्तकाञ्चननिभं द्विभुजं दयालुं पीताम्बरं धृतसरोरुहद्वन्द्वशूलम् । क्रौञ्चासनं
    ह्यसुरसेवितपादपद्मं शुक्रं स्मरे द्विनयनं हृदि पङ्कजेऽहम् ॥ ६॥ अथ शनेर्ध्यानं
meaning: {}
