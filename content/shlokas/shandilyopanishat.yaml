id: shandilyopanishat
category: upanishad
name:
  english: shandilyopanishat
  devanagari: शाण्डिल्योपनिषत्
content:
  english: 11|| iti prathamo'dhyayah || 1|| atha ha shandilyo ha vai brahmarishishcaturshu vedeshu brahmavidyamalabhamanah
    kim nametyatharvanam bhagavantamupasannah papracchadhihi bhagavan brahmavidyam yena shreyo'vapsyamiti
    | sa hovacatharva shandilya satyam vijnanamanantam brahma yasminnidamotam ca protam ca | yasminnidam
    sam ca vicaiti sarvam yasminvijnate sarvamidam vijnatam bhavati | tadapanipadamacakshuhshrotramajihvamashariramagrahyamanirdeshyam
    | yato vaco nivartante | aprapya manasa saha | yatkevalam jnanagamyam | prajna ca yasmatprasrita purani
    | yadekamadvitiyam | akashavatsarvagatam susukshmam niranjanam nishkriyam sanmatram cidanandaikarasam
    shivam prashantamamritam tatparam ca brahma | tattvamasi | tajjnanena hi vijanihi ya eko deva atmashaktipradhanah
    sarvajnah sarveshvarah sarvabhutantaratma sarvabhutadhivasah sarvabhutanigudho bhutayoniryogaikagamyah
    | yashca vishvam srijati vishvam bibharti vishvam bhunkte sa atma | atmani tam tam lokam vijanihi
    | ma shociratmavijnani shokasyantam gamishyati || iti dvitiyo'dhyayah || 2|| athainam shandilyo'tharvanam
    papraccha yadekamaksharam nishkriyam shivam sanmatram parambrahma | tasmatkathamidam vishvam jayate
    katham sthiyate kathamasmimlliyate | tanme samshayam chettumarhasiti | sa hovacatharva satyam shandilya
    parambrahma nishkriyamaksharamiti | athapyasyarupasya brahmanastrini rupani bhavanti sakalam nishkalam
    sakalanishkalam ceti | yatsatyam vijnanamanandam nishkriyam niranjanam sarvagatam susukshmam sarvatomukhamanirdeshyamamritamasti
    tadidam nishkalam rupam | athasya ya sahajastyavidya mulaprakritirmaya lohitashuklakrishna | taya
    sahayavan devah krishnapingalo mameshvara ishte | tadidamasya sakalanishkalam rupam || athaisha jnanamayena
    tapasa ciyamano'kamayata bahu syam prajayeyeti | athaitasmattapyamanatsatyakamattrinyaksharanyajayanta
    | tisro vyahritayastripada gayatri trayo vedastrayo devastrayo varnastrayo'gnayashca jayante | yo'sau
    devo bhagavansarvaishvaryasampannah sarvavyapi sarvabhutanam hridaye samnivishto mayavi mayaya kridati
    sa brahma sa vishnuh sa rudrah sa indrah sa sarve devah sarvani bhutani sa eva purastatsa eva pashcatsa
    evottaratah sa eva dakshinatah sa evadhastatsa evoparishtatsa eva sarvam | athasya devasyatmashakteratmakridasya
    bhaktanukampino dattatreyarupa surupa tanuravasa indivaradalaprakhya caturbahuraghorapapakashini |
    tadidamasya sakalam rupam || 3
  devanagari: ११॥ इति प्रथमोऽध्यायः ॥ १॥ अथ ह शाण्डिल्यो ह वै ब्रह्मऋषिश्चतुर्षु वेदेषु ब्रह्मविद्यामलभमानः
    किं नामेत्यथर्वाणं भगवन्तमुपसन्नः पप्रच्छाधीहि भगवन् ब्रह्मविद्यां येन श्रेयोऽवाप्स्यामीति । स होवाचाथर्वा
    शाण्डिल्य सत्यं विज्ञानमनन्तं ब्रह्म यस्मिन्निदमोतं च प्रोतं च । यस्मिन्निदं सं च विचैति सर्वं यस्मिन्विज्ञाते
    सर्वमिदं विज्ञातं भवति । तदपाणिपादमचक्षुःश्रोत्रमजिह्वमशरीरमग्राह्यमनिर्देश्यम् । यतो वाचो निवर्तन्ते
    । अप्राप्य मनसा सह । यत्केवलं ज्ञानगम्यम् । प्रज्ञा च यस्मात्प्रसृता पुराणी । यदेकमद्वितीयम् । आकाशवत्सर्वगतं
    सुसूक्ष्मं निरञ्जनं निष्क्रियं सन्मात्रं चिदानन्दैकरसं शिवं प्रशान्तममृतं तत्परं च ब्रह्म । तत्त्वमसि
    । तज्ज्ञानेन हि विजानीहि य एको देव आत्मशक्तिप्रधानः सर्वज्ञः सर्वेश्वरः सर्वभूतान्तरात्मा सर्वभूताधिवासः
    सर्वभूतनिगूढो भूतयोनिर्योगैकगम्यः । यश्च विश्वं सृजति विश्वं बिभर्ति विश्वं भुङ्क्ते स आत्मा । आत्मनि
    तं तं लोकं विजानीहि । मा शोचीरात्मविज्ञानी शोकस्यान्तं गमिष्यति ॥ इति द्वितीयोऽध्यायः ॥ २॥ अथैनं शाण्डिल्योऽथर्वाणं
    पप्रच्छ यदेकमक्षरं निष्क्रियं शिवं सन्मात्रं परम्ब्रह्म । तस्मात्कथमिदं विश्वं जायते कथं स्थीयते कथमस्मिंल्लीयते
    । तन्मे संशयं छेत्तुमर्हसीति । स होवाचाथर्वा सत्यं शाण्डिल्य परम्ब्रह्म निष्क्रियमक्षरमिति । अथाप्यस्यारूपस्य
    ब्रह्मणस्त्रीणि रूपाणि भवन्ति सकलं निष्कलं सकलनिष्कलं चेति । यत्सत्यं विज्ञानमानन्दं निष्क्रियं निरञ्जनं
    सर्वगतं सुसूक्ष्मं सर्वतोमुखमनिर्देश्यममृतमस्ति तदिदं निष्कलं रूपम् । अथास्य या सहजास्त्यविद्या मूलप्रकृतिर्माया
    लोहितशुक्लकृष्णा । तया सहायवान् देवः कृष्णपिङ्गलो ममेश्वर ईष्टे । तदिदमस्य सकलनिष्कलं रूपम् ॥ अथैष
    ज्ञानमयेन तपसा चीयमानोऽकामयत बहु स्यां प्रजायेयेति । अथैतस्मात्तप्यमानात्सत्यकामात्त्रीण्यक्षराण्यजायन्त
    । तिस्रो व्याहृतयस्त्रिपदा गायत्री त्रयो वेदास्त्रयो देवास्त्रयो वर्णास्त्रयोऽग्नयश्च जायन्ते । योऽसौ
    देवो भगवान्सर्वैश्वर्यसम्पन्नः सर्वव्यापी सर्वभूतानां हृदये संनिविष्टो मायावी मायया क्रीडति स ब्रह्मा
    स विष्णुः स रुद्रः स इन्द्रः स सर्वे देवाः सर्वाणि भूतानि स एव पुरस्तात्स एव पश्चात्स एवोत्तरतः स
    एव दक्षिणतः स एवाधस्तात्स एवोपरिष्टात्स एव सर्वम् । अथास्य देवस्यात्मशक्तेरात्मक्रीडस्य भक्तानुकम्पिनो
    दत्तात्रेयरूपा सुरूपा तनूरवासा इन्दीवरदलप्रख्या चतुर्बाहुरघोरापापकशिनी । तदिदमस्य सकलं रूपम् ॥ ३
