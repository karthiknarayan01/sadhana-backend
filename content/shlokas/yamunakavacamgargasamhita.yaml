id: yamunakavacamgargasamhita
category: kavacha
name:
  english: yamunakavacamgargasamhita
  devanagari: यमुनाकवचंगर्गसम्हिता
content:
  english: yamunayashca kavacam sarvarakshakaram nrinam | catushpadarthadam sakshacchrinu rajanmahamate
    || 2|| krishnam caturbhujam shyamam pundarikadalekshanam | rathastham sundarim dhyatva dharayetkavacam
    tatah || 3|| snatah purvamukho mauni kritasandhyah kushasane | kushairbaddhashikho viprah pathedvai
    svastikasanah || 4|| yamuna me shirah patu krishna netradvayam sada | shyama bhrubhangadesham ca nasikam
    nakavasini || 5|| kapolau patu me sakshatparamanandarupini | krishnavamamsasambhuta patu karnadvayam
    mama || 6|| adharau patu kalindi cibukam suryakanyaka | yamasvasa kandharam ca hridayam me mahanadi
    || 7|| krishnapriya patu prishtham tatini me bhujadvayam | shronitatam ca sushroni katim me carudarshana
    || 8|| urudvayam tu rambhorurjanuni tvanghribhedini | gulphau raseshvari patu padau papapraharini
    || 9|| antarbahiradhashcordhvam dishasu vidishasu ca | samantatpatu jagatah paripurnatamapriya ||
    10|| idam shriyamunayashca kavacam paramadbhutam | dashavaram pathedbhaktya nirdhano dhanavanbhavet
    || 11|| tribhirmasaih patheddhiman brahmacari mitashanah | sarvarajyadhipatyanca prapyate natra samshayah
    || 12|| dashottarashatam nityam trimasavadhi bhaktitah | yah pathetprayato bhutva tasya kim kim na
    jayate || 13|| yah pathetpratarutthaya sarvatirthaphalam labhet | ante vrajetparam dhama golokam yogidurlabham
    || 14|| iti gargasamhitayam madhuryakhande shodashadhyayantargatam yamuna kavacam sampurnam |
  devanagari: यमुनायाश्च कवचं सर्वरक्षाकरं नृणाम् । चतुष्पदार्थदं साक्षाच्छृणु राजन्महामते ॥ २॥ कृष्णां
    चतुर्भुजां श्यामां पुण्डरीकदलेक्षणाम् । रथस्थां सुन्दरीं ध्यात्वा धारयेत्कवचं ततः ॥ ३॥ स्नातः पूर्वमुखो
    मौनी कृतसन्ध्यः कुशासने । कुशैर्बद्धशिखो विप्रः पठेद्वै स्वस्तिकासनः ॥ ४॥ यमुना मे शिरः पातु कृष्णा
    नेत्रद्वयं सदा । श्यामा भ्रूभङ्गदेशं च नासिकां नाकवासिनी ॥ ५॥ कपोलौ पातु मे साक्षात्परमानन्दरूपिणी
    । कृष्णवामांससम्भूता पातु कर्णद्वयं मम ॥ ६॥ अधरौ पातु कालिन्दी चिबुकं सूर्यकन्यका । यमस्वसा कन्धरां
    च हृदयं मे महानदी ॥ ७॥ कृष्णप्रिया पातु पृष्ठं तटिनि मे भुजद्वयम् । श्रोणीतटं च सुश्रोणी कटिं मे चारुदर्शना
    ॥ ८॥ ऊरुद्वयं तु रम्भोरुर्जानुनी त्वङ्घ्रिभेदिनी । गुल्फौ रासेश्वरी पातु पादौ पापप्रहारिणी ॥ ९॥ अन्तर्बहिरधश्चोर्ध्वं
    दिशासु विदिशासु च । समन्तात्पातु जगतः परिपूर्णतमप्रिया ॥ १०॥ इदं श्रीयमुनायाश्च कवचं परमाद्भुतम् ।
    दशवारं पठेद्भक्त्या निर्धनो धनवान्भवेत् ॥ ११॥ त्रिभिर्मासैः पठेद्धीमान् ब्रह्मचारी मिताशनः । सर्वराज्याधिपत्यञ्च
    प्राप्यते नात्र संशयः ॥ १२॥ दशोत्तरशतं नित्यं त्रिमासावधि भक्तितः । यः पठेत्प्रयतो भूत्वा तस्य किं
    किं न जायते ॥ १३॥ यः पठेत्प्रातरुत्थाय सर्वतीर्थफलं लभेत् । अन्ते व्रजेत्परं धाम गोलोकं योगिदुर्लभम्
    ॥ १४॥ इति गर्गसंहितायां माधुर्यखण्डे षोडशाध्यायान्तर्गतं यमुना कवचं सम्पूर्णम् ।
