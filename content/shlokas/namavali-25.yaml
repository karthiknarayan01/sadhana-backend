id: namavali-25
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shrinrisimhashtottarashatanamavali 2 om narasimhaya namah | om tikshnadamshtraya namah | om
    vajranakhaya namah | om vishnave namah | om jishnave namah | 5| om sarvabijaya namah | om satyaya
    namah | om sarvacaitanyarupine namah | om sarvadharaya namah | om sarvasmai namah | 10| om sarvagaya
    namah | om vishvasmai namah | om vishvavandyaya namah | om virincijanakaya namah | om vagishvaraya
    namah | om vedyaya namah | om vedhase namah | om vedamaulaye namah | om rudraya namah | om bhadraya
    namah | 20| om mangalaya namah | om mahatmane namah | om karanaya namah | om turiyaya namah | om shivaya
    namah | om paramatmane namah | om hiranyakashipu
  devanagari: श्रीनृसिंहाष्टोत्तरशतनामावली २ ॐ नारसिंहाय नमः । ॐ तीक्ष्णदंष्ट्राय नमः । ॐ वज्रनखाय नमः
    । ॐ विष्णवे नमः । ॐ जिष्णवे नमः । ५। ॐ सर्वबीजाय नमः । ॐ सत्याय नमः । ॐ सर्वचैतन्यरूपिणे नमः । ॐ सर्वाधाराय
    नमः । ॐ सर्वस्मै नमः । १०। ॐ सर्वगाय नमः । ॐ विश्वस्मै नमः । ॐ विश्ववन्द्याय नमः । ॐ विरिञ्चिजनकाय
    नमः । ॐ वागीश्वराय नमः । ॐ वेद्याय नमः । ॐ वेधसे नमः । ॐ वेदमौलये नमः । ॐ रुद्राय नमः । ॐ भद्राय नमः
    । २०। ॐ मङ्गलाय नमः । ॐ महात्मने नमः । ॐ कारणाय नमः । ॐ तुरीयाय नमः । ॐ शिवाय नमः । ॐ परमात्मने नमः
    । ॐ हिरण्यकशिपु
