id: parabrahmakavacam-2
category: kavacha
name:
  english: parabrahmakavacam 2
  devanagari: परब्रह्मकवचम् २
content:
  english: rinu pravakshyami na vakshyami kadacana | tava premavashenaiva rahasyam yatprakashitam || 4||
    yatha nigudhamangam hi tatha gopyamidam sada | guhyadguhyataram mantram mahapanjarasamjnakam || 5||
    parabrahma mahakavacametadgopyam sudurlabham | asya rishishca parabrahma chando'nushtup prakirtitam
    || 6|| parabrahma svarupam ca devata parigiyate | paranjyotihsvarupena tripurasundari mata || 7||
    pranavam bijamityuktam maya shaktih prakirtita | brahmaiva kilakam proktam kurcabijam tu shulakam
    || 8|| shadaksharam parabrahma mantram sacchiddvayam smritam | pranavena samayuktam mayabijasamanvitam
    || 9|| shadaksharatmana mantrairnyasam kritva yathavidhi | brahmagayatrimuccarya dashakritvastatah
    param || 10|| dhyatva tanmama sarvasvam dhyatva tadbrahmapanjaram | shunyam shunyataram yacca upamanavivarjitam
    || 11|| pranavena samudbhutam parashaktyatmavigraham | parabrahma parashaktim namamyahamananyadhih
    || 12|| om shulini hauravidyaya shiro desham prapalayet | bhagyalekhinyasau patu lalatam ca karadvayam
    || 13|| trimurtishcakshushi patu netramadhyam tathaiva ca | cakshushmati tatha vidya akshigolam prarakshatu
    || 14|| nasam rakshatu kalaratrih sarvabhayavinashini | jatharagnim sada durga rakshatu sarvakarmasu
    || 15|| nilakantho grivam patu skandhau patu pavanasutah | bahudandam bahubali rakshatu brahmatejasa
    || 16|| hastau ca parabrahmani pancanguli tatha'nagha | kuberi patu me nakhan siddhiriddhih sada'vatu
    || 17|| hridayam kalika patu parabrahmasvarupini | stanau ca gandharvaraksham kuryat mantramayi sada
    || 18|| jatavedi ca udaram nabhim kundalini tatha | sarvavayavato devim lalitambambikamimam || 19||
    hridaye'ham sada dhyayet parabrahma ca vigraham | yathaksharamayam vishvam tatha panjarasamsthitam
    || 20|| nabheradhastadguhyam ca rakshatu brahmacarini | prishthadesham sada patu shambhuh sharvah
    sada'vatu || 21|| antahstham patu me vishnurantaryami sanatanah | bahyam patu sada brahma caracarapatirvibhuh
    || 22|| katim rakshatu kapali uru patu vinayakah | januni rakshatu bhimah janghe patu maheshvarah
    || 23|| gulphau patu sada rudro hyangulishca shivastatha | nakhani patu yogindrah padagram patu shuladhrik
    || 24|| asthini patu mantresho majjam patu sadashivah | raktam patu mahadevo mamsam patu pinakadhrik
    || 25|| tvacam rakshatu me sharvah pranam patu sadashivah | romaromeshu deveshah vasantvanantashaktayah
    || 26|| idayamapi catmanam pingalayam vibhavayet | sushumnayam ca satatam brahmarandhram prapalayet
    || 27|| guhyadguhyataram mantram sarvasampatpradam nrinam | sarvesham ca shariranam sandhau sandhau
    ca rakshatu || 28|| indriyani ca me patu pancabhutaniyamakah | ahankaram ca cittam ca rakshatvamritavallabhah
    || 29|| yatra yatra bhaveddeshe sharire me vyavasthitam | tatra tatra parabrahma rakshatu jnanarupinam
    || 30|| bahyabhyantaratah patu patu mam sarvatomukham | panjarabhyantare sthitva patu mamambikapatih
    || 31|| yatkincitsarvabhuteshu yatkincitsarvavastushu | tatra tatra sthita shaktih parabrahmasvarupini
    || 32|| matpade januni katau hridaye kanthadeshake | mastake sarvagatreshu mantramurtih prapalayet
    || 33|| na me bhayam kvaciddeshe na me duhkham kadacana | parabrahmasvarupo'ham mahapanjararakshitah
    || 34|| vaishnavi vijayam dadyaddharmam narayanyavatu | artham kamam ca moksham ca prayacchatvabhayatmika
    || 35|| patim patu sada bhairah patnim patu ca bhairavi | putran shukrena raksheta duhitrirbrahmanaspatih
    || 36|| mata suryasvarupena pita candrastathaiva ca | mitravargamshca mitro'pi mangalo'pi prapalayet
    || 37|| karyam vittam ca vidyam ca mukuteshah prapalayet | griham grihalakshmi devi gramam grameshvari
    tatha || 38|| kuladevi kulanyuccaih sthanam sthaneshvari tatha | vastudoshan haro vastupurusho'pi
    sada'vatu || 39|| mantran patu surendro'pi dhanavantariramayam | sarve'pi mantradeveshah kurvantu
    madrakshanam || 40|| etah sarvah shalyadevyo dehabhageshu samsthitah | mahatripurasundaryah katakshenaiva
    rakshitah || 41|| dishi dikpalakah sarve vidikshu ca tatha sthitah | madiyam rakshanam kurvantu parabrahmasvarupinah
    || 42|| nakhante ca shikhagrante madhye capi vyavasthitam | mahatripurasundaryah kavacam patu sarvatah
    || 43|| anumatram na visramsi na skhalati kadacana | panjare'smin sthita devi mam rakshatu nirantaram
    || 44|| brahmarandhram tatha nabhim hridayam nabhimandalam | sarvavayavato devim sarvatranukulam bhavet
    || 45|| vidyullatavadbhasvanti sarvabharanabhushita | mahatripurasundari mam rakshatu ca vishvatah
    || 46|| antaryami sada patu bahiryami ca sarvada | mantraksharamayam deham rakshatu mayi devata ||
    47|| svayam parabrahmarupi ca svayam shaktisvarupini | ekibhuya sthita nityam mama deham prapalayet
    || 48|| na canyat patu me kincit na canyat rakshatu kvacit | panjaro'yam mahadivyo deham vyapnoti
    sarvatah || 49|| iti guhyat param guhyam mahapanjaramavyayam | parabrahma svarupam ca sada rakshati
    sadhakam || 50|| ya idam kavacam divyam pathate niyatah sudhih | na padam vinyaset kshonyam vina caitatpathan
    sakrit || 51|| sandhyam naiva samacaret sthanam naiva ca shodhayet | gurupadesharahito'pi parabrahmamayo
    bhavet || 52|| brahmarakshasavetala bhutapretapishacakah | dakinyo'tha ca shakinyo hakinyo bhayavihvalah
    || 53|| palayante disho nashtah shrutva'sya sadhakasya ca | brahmasadhaka evayam sakshadbrahmasvarupakah
    || 54|| yadyadvanchati vai martyastattatprapnoti nishcitam | aganitam ca siddhim vai nidhishriyamavapnuyat
    || 55|| shrividyaratnametaddhi sarvabhishtapradayakam | vaishnavo va'tha shaivo va shakto va ganapatipriyah
    || 56|| nasya mantrasya dosho'sti na mantram ca viniyujyate | na kilakam na setushca na coddharo'tra
    kalpyate || 57|| mukhe vasati vagdevi grihe lakshmih sada sthita | rajamano'khilairlokairbrahmasayujyamapnuyat
    || 58|| na purashcaranam tatra na ca kalo'tra nishcitah | yatra kutrapi va sthatum kavacenatra rakshitah
    || 59|| yannoktamatra deshe'pi tatsarvam rakshitam svayam | pratyangira svahastena raksham kuryannirantaram
    || 60|| pumanetatsamadhaya dakshine bahau vinyaset | vamabhage tatha strinam kanya dharayate'nagha
    || 61|| na ganapatipuja va nyasayogo na cavashyakah | sakritpathatphalam labhyam sarvastotrasamam
    dhruvam || 62|| nasti bhutala etattulyam kavacam devadurlabham | sakridapi yah pathedekam sa na yati
    naram kacit || 63|| narakasya tu dvaram vai na pashyati kadapi sah | maranam mohanam stambham vashyam
    caiva susiddhayet || 64|| etanna shapitam loke na cotkilanamarhati | na marjanam na ca homo na ca
    tarpanamasti ca || 65|| yo na pathedidam nityam mokshasiddhim ca kankshati | pashanasya purastacca
    krandanam tasya varnitam || 66|| parabrahmasvarupam ca sarvamantramayam param | mahapanjaramidam divyam
    sarvasiddhikaram shubham || 67|| mantrabijam parabrahma mantrashaktih para gatih | etanmayena kayena
    bhavatyeva sadashivah || 68|| yatra yatra sthito bhakto yatra yatra pathedidam | tatra tatraiva sakshaddhi
    brahma tishthati mantrakrit || 69|| na tasya durlabham kincit na tasyastyashubham kvacit | mahapanjarabhavena
    sarvam brahmamayam bhavet || 70|| om tatsat | iti parabrahmakavacam
  devanagari: ृणु प्रवक्ष्यामि न वक्ष्यामि कदाचन । तव प्रेमवशेनैव रहस्यं यत्प्रकाशितम् ॥ ४॥ यथा निगूढमङ्गं
    हि तथा गोप्यमिदं सदा । गुह्याद्गुह्यतरं मन्त्रं महापञ्जरसंज्ञकम् ॥ ५॥ परब्रह्म महाकवचमेतद्गोप्यं सुदुर्लभम्
    । अस्य ऋषिश्च परब्रह्म छन्दोऽनुष्टुप् प्रकीर्तितम् ॥ ६॥ परब्रह्म स्वरूपं च देवता परिगीयते । परञ्ज्योतिःस्वरूपेण
    त्रिपुरसुन्दरी मता ॥ ७॥ प्रणवं बीजमित्युक्तं माया शक्तिः प्रकीर्तिता । ब्रह्मैव कीलकं प्रोक्तं कूर्चबीजं
    तु शूलकम् ॥ ८॥ षडक्षरं परब्रह्म मन्त्रं सच्छिद्द्वयं स्मृतम् । प्रणवेन समायुक्तं मायाबीजसमन्वितम्
    ॥ ९॥ षडक्षरात्मना मन्त्रैर्न्यासं कृत्वा यथाविधि । ब्रह्मगायत्रीमुच्चार्य दशकृत्वस्ततः परम् ॥ १०॥
    ध्यात्वा तन्मम सर्वस्वं ध्यात्वा तद्ब्रह्मपञ्जरम् । शून्यं शून्यतरं यच्च उपमानविवर्जितम् ॥ ११॥ प्रणवेन
    समुद्भूतं परशक्त्यात्मविग्रहम् । परब्रह्म परशक्तिं नमाम्यहमनन्यधीः ॥ १२॥ ॐ शूलिनी हौरविद्यया शिरो
    देशं प्रपालयेत् । भाग्यलेखिन्यसौ पातु ललाटं च करद्वयम् ॥ १३॥ त्रिमूर्तिश्चक्षुषी पातु नेत्रमध्यं तथैव
    च । चक्षुष्मती तथा विद्या अक्षिगोलं प्ररक्षतु ॥ १४॥ नासां रक्षतु कालरात्रिः सर्वभयविनाशिनी । जठराग्निं
    सदा दुर्गा रक्षतु सर्वकर्मसु ॥ १५॥ नीलकण्ठो ग्रीवां पातु स्कन्धौ पातु पवनसुतः । बाहुदण्डं बाहुबली
    रक्षतु ब्रह्मतेजसा ॥ १६॥ हस्तौ च परब्रह्माणि पञ्चाङ्गुली तथाऽनघा । कुबेरी पातु मे नखान् सिद्धिरिद्धिः
    सदाऽवतु ॥ १७॥ हृदयं कालिका पातु परब्रह्मस्वरूपिणी । स्तनौ च गन्धर्वरक्षां कुर्यात् मन्त्रमयी सदा ॥
    १८॥ जातावेदी च उदरं नाभिं कुण्डलिनी तथा । सर्वावयवतो देवीं ललिताम्बाम्बिकामिमाम् ॥ १९॥ हृदयेऽहं सदा
    ध्यायेत् परब्रह्म च विग्रहम् । यथाक्षरमयं विश्वं तथा पञ्जरसंस्थितम् ॥ २०॥ नाभेरधस्ताद्गुह्यं च रक्षतु
    ब्रह्मचारिणी । पृष्ठदेशं सदा पातु शम्भुः शर्वः सदाऽवतु ॥ २१॥ अन्तःस्थं पातु मे विष्णुरन्तर्यामी सनातनः
    । बाह्यं पातु सदा ब्रह्मा चराचरपतिर्विभुः ॥ २२॥ कटिं रक्षतु कपाली ऊरू पातु विनायकः । जानुनी रक्षतु
    भीमः जङ्घे पातु महेश्वरः ॥ २३॥ गुल्फौ पातु सदा रुद्रो ह्यङ्गुलीश्च शिवस्तथा । नखानि पातु योगीन्द्रः
    पादाग्रं पातु शूलधृक् ॥ २४॥ अस्थीनि पातु मन्त्रेशो मज्जां पातु सदाशिवः । रक्तं पातु महादेवो मांसं
    पातु पिनाकधृक् ॥ २५॥ त्वचं रक्षतु मे शर्वः प्राणां पातु सदाशिवः । रोमरोमेषु देवेशाः वसन्त्वनन्तशक्तयः
    ॥ २६॥ इडायामपि चात्मानं पिङ्गलायां विभावयेत् । सुषुम्णायां च सततं ब्रह्मरन्ध्रं प्रपालयेत् ॥ २७॥ गुह्याद्गुह्यतरं
    मन्त्रं सर्वसम्पत्प्रदं नृणाम् । सर्वेषां च शरीराणां सन्धौ सन्धौ च रक्षतु ॥ २८॥ इन्द्रियाणि च मे पातु
    पञ्चभूतनियमकः । अहङ्कारं च चित्तं च रक्षत्वमृतवल्लभः ॥ २९॥ यत्र यत्र भवेद्देशे शरीरे मे व्यवस्थितम्
    । तत्र तत्र परब्रह्म रक्षतु ज्ञानरूपिणम् ॥ ३०॥ बाह्याभ्यन्तरतः पातु पातु मां सर्वतोमुखम् । पञ्जराभ्यन्तरे
    स्थित्वा पातु मामम्बिकापतिः ॥ ३१॥ यत्किञ्चित्सर्वभूतेषु यत्किञ्चित्सर्ववस्तुषु । तत्र तत्र स्थिता
    शक्तिः परब्रह्मस्वरूपिणी ॥ ३२॥ मत्पादे जानुनि कटौ हृदये कण्ठदेशके । मस्तके सर्वगात्रेषु मन्त्रमूर्तिः
    प्रपालयेत् ॥ ३३॥ न मे भयं क्वचिद्देशे न मे दुःखं कदाचन । परब्रह्मस्वरूपोऽहं महापञ्जररक्षितः ॥ ३४॥
    वैष्णवी विजयं दद्याद्धर्मं नारायण्यवतु । अर्थं कामं च मोक्षं च प्रयच्छत्वभयात्मिका ॥ ३५॥ पतिं पातु
    सदा भैरः पत्नीं पातु च भैरवी । पुत्रान् शुक्रेण रक्षेत दुहितृर्ब्रह्मणस्पतिः ॥ ३६॥ माता सूर्यस्वरूपेण
    पिता चन्द्रस्तथैव च । मित्रवर्गांश्च मित्रोऽपि मङ्गलोऽपि प्रपालयेत् ॥ ३७॥ कार्यं वित्तं च विद्यां
    च मुकुटेशः प्रपालयेत् । गृहं गृहलक्ष्मी देवी ग्रामं ग्रामेश्वरी तथा ॥ ३८॥ कुलदेवी कुलान्युच्चैः स्थानं
    स्थानेश्वरी तथा । वास्तुदोषान् हरो वास्तुपुरुषोऽपि सदाऽवतु ॥ ३९॥ मन्त्रान् पातु सुरेन्द्रोऽपि धनवन्तारिरामयम्
    । सर्वेऽपि मन्त्रदेवेशाः कुर्वन्तु मद्रक्षणम् ॥ ४०॥ एताः सर्वाः शल्यदेव्यो देहभागेषु संस्थिताः । महात्रिपुरसुन्दर्याः
    कटाक्षेणैव रक्षिताः ॥ ४१॥ दिशि दिक्पालकाः सर्वे विदिक्षु च तथा स्थिताः । मदीयं रक्षणं कुर्वन्तु परब्रह्मस्वरूपिणः
    ॥ ४२॥ नखान्ते च शिखाग्रान्ते मध्ये चापि व्यवस्थितम् । महात्रिपुरसुन्दर्याः कवचं पातु सर्वतः ॥ ४३॥
    अणुमात्रं न विस्रंसि न स्खलति कदाचन । पञ्जरेऽस्मिन् स्थिता देवी मां रक्षतु निरन्तरम् ॥ ४४॥ ब्रह्मरन्ध्रं
    तथा नाभिं हृदयं नाभिमण्डलम् । सर्वावयवतो देवीं सर्वत्रानुकूलं भवेत् ॥ ४५॥ विद्युल्लतावद्भास्वन्ती
    सर्वाभरणभूषिता । महात्रिपुरसुन्दरी मां रक्षतु च विश्वतः ॥ ४६॥ अन्तर्यामी सदा पातु बहिर्यामी च सर्वदा
    । मन्त्राक्षरमयं देहं रक्षतु मयि देवता ॥ ४७॥ स्वयं परब्रह्मरूपी च स्वयं शक्तिस्वरूपिणी । एकीभूय स्थिता
    नित्यं मम देहं प्रपालयेत् ॥ ४८॥ न चान्यत् पातु मे किञ्चित् न चान्यत् रक्षतु क्वचित् । पञ्जरोऽयं महादिव्यो
    देहं व्याप्नोति सर्वतः ॥ ४९॥ इति गुह्यात् परं गुह्यं महापञ्जरमव्ययम् । परब्रह्म स्वरूपं च सदा रक्षति
    साधकम् ॥ ५०॥ य इदं कवचं दिव्यं पठते नियतः सुधीः । न पादं विन्यसेत् क्षोण्यां विना चैतत्पठन् सकृत्
    ॥ ५१॥ सन्ध्यां नैव समाचरेत् स्थानं नैव च शोधयेत् । गुरूपदेशरहितोऽपि परब्रह्ममयो भवेत् ॥ ५२॥ ब्रह्मराक्षसवेताला
    भूतप्रेतपिशाचकाः । डाकिन्योऽथ च शाकिन्यो हाकिन्यो भयविह्वलाः ॥ ५३॥ पलायन्ते दिशो नष्टाः श्रुत्वाऽस्य
    साधकस्य च । ब्रह्मसाधक एवायं साक्षाद्ब्रह्मस्वरूपकः ॥ ५४॥ यद्यद्वाञ्छति वै मर्त्यस्तत्तत्प्राप्नोति
    निश्चितम् । अगणितं च सिद्धिं वै निधिश्रियमवाप्नुयात् ॥ ५५॥ श्रीविद्यारत्नमेतद्धि सर्वाभीष्टप्रदायकम्
    । वैष्णवो वाऽथ शैवो वा शाक्तो वा गणपतिप्रियः ॥ ५६॥ नास्य मन्त्रस्य दोषोऽस्ति न मन्त्रं च विनियुज्यते
    । न कीलकं न सेतुश्च न चोद्धारोऽत्र कल्प्यते ॥ ५७॥ मुखे वसति वाग्देवी गृहे लक्ष्मीः सदा स्थिता । राजमानोऽखिलैर्लोकैर्ब्रह्मसायुज्यमाप्नुयात्
    ॥ ५८॥ न पुरश्चरणं तत्र न च कालोऽत्र निश्चितः । यत्र कुत्रापि वा स्थातुं कवचेनात्र रक्षितः ॥ ५९॥ यन्नोक्तमत्र
    देशेऽपि तत्सर्वं रक्षितं स्वयम् । प्रत्यङ्गिरा स्वहस्तेन रक्षां कुर्यान्निरन्तरम् ॥ ६०॥ पुमानेतत्समाधाय
    दक्षिणे बाहौ विन्यसेत् । वामभागे तथा स्त्रीणां कन्या धारयतेऽनघा ॥ ६१॥ न गणपतिपूजा वा न्यासयोगो न चावश्यकः
    । सकृत्पाठात्फलं लभ्यं सर्वस्तोत्रसमं ध्रुवम् ॥ ६२॥ नास्ति भूतल एतत्तुल्यं कवचं देवदुर्लभम् । सकृदपि
    यः पठेदेकं स न याति नरं कचित् ॥ ६३॥ नरकस्य तु द्वारं वै न पश्यति कदापि सः । मारणं मोहनं स्तम्भं वश्यं
    चैव सुसिद्धयेत् ॥ ६४॥ एतन्न शापितं लोके न चोत्कीलनमर्हति । न मार्जनं न च होमो न च तर्पणमस्ति च ॥ ६५॥
    यो न पठेदिदं नित्यं मोक्षसिद्धिं च काङ्क्षति । पाषाणस्य पुरस्ताच्च क्रन्दनं तस्य वर्णितम् ॥ ६६॥ परब्रह्मस्वरूपं
    च सर्वमन्त्रमयं परम् । महापञ्जरमिदं दिव्यं सर्वसिद्धिकरं शुभम् ॥ ६७॥ मन्त्रबीजं परब्रह्म मन्त्रशक्तिः
    परा गतिः । एतन्मयेन कायेन भवत्येव सदाशिवः ॥ ६८॥ यत्र यत्र स्थितो भक्तो यत्र यत्र पठेदिदम् । तत्र तत्रैव
    साक्षाद्धि ब्रह्म तिष्ठति मन्त्रकृत् ॥ ६९॥ न तस्य दुर्लभं किञ्चित् न तस्यास्त्यशुभं क्वचित् । महापञ्जरभावेन
    सर्वं ब्रह्ममयं भवेत् ॥ ७०॥ ॐ तत्सत् । इति परब्रह्मकवचं
