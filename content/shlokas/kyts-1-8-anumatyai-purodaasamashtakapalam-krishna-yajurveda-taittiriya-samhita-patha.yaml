    मित्रावरुणा घृ॒तै र्गव्यू॑तिमुक्षतम् । मद्ध्वा॒ रजाग्ं॑सि सुक्रतू ॥ प्र बा॒हवा॑ सिसृत ञ्जी॒वसे॑ न॒
