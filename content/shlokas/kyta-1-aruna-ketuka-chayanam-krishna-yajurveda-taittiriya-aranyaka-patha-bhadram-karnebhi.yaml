id: kyta-1-aruna-ketuka-chayanam-krishna-yajurveda-taittiriya-aranyaka-patha-bhadram-karnebhi
category: stotram
name:
  english: KYTA 1 Aruna Ketuka Chayanam - Krishna Yajurveda Taittiriya Aranyaka Patha - Bhadram Karnebhi
content:
  english: krishna yajurvediya taittiriya aranyake prathamah prapathakah shri gurubhyo namah | harih om
    || anuvakam shshrinuyama devah | bhadra ryajatrah | sthirairangai stushtuvagm sastanubhih | vyashema
    devahitam ya~dayuh || svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti nastarkshyo
    arishtanemih | svasti no brihaspati rdadhatu || apamapamapa || agnirvayushca suryashca | saha sanca
    skarardhiya || vayvashva rashmipatayah | mari cyatmano adruhah | devi rbhuvana suvarih | putravattvaya
    me suta || mahanamni rmahamanah | mahaso mahasa ssvah | devih parjanya suvarih | putravattvaya me
    suta || mapa rakshah | apashnyushni m | apa devirito hita || vajra ndevasuvarih | adityanaditi ndevim
    | yoninordhva shshantama bhavantu | divya apa oshadhayah | sumridika sarasvati | ma te vyoma sandrishi
    || smritih pratyaksha shcatushtayam | etairaditya mandalam | sarvaireva vidha syate || suryo maricimadatte
    | sarvasma dbhuvanadadhi | tasyah paka visheshena | smrita nkala visheshanam || nadiva prabhava tkacit
    | akshayya 'bhi samayanti | soru ssati na nivartate || evannana samutthanah | kala shritah | anushashca
    mahashashca | sarve samavayantri tam || sa tai ssamavishtah | uru ssanna nivartate | adhi sam vi~dyat
    | tadeva lakshane || || anubhishca mahadbhishca | samarudhah pradrishyate | sam va~thsarah pratyakshena
    | nadhisattvah pradrishyate || pataro viklidhah pingah | eta dvaruna lakshanam | yatraita dupadrishyate
    | sahasra ntatra niyate || ekagm hi shiro nana mukhe | krithsna ndriyani | jalpita ntveva dihyate
    || shuklakrishne sam va~thsarasya | dakshina vamayoh par shvayoh | tasyaisha bhavati || shukra nte
    anyat | vishurupe ahani dyaurivasi | vishva hi maya avasi svadhavah | bhadra te pushanniha ratirastviti
    || natra bhuvanam | na pusha | na pashavah | naditya va~thsara eva pratyakshena priyatamam vi~dyat
    | etadvai sam va~thsarasya priyatamagm rupam | yo 'sya mahanartha utpathsyamano bhavati | ida nkurushveti
    | tamaharana sakanjanagm saptathamahu rekajam | shadudyama rishayo devaja iti | teshamishtani vihitani
    dhamashah | sthatre rejante vikritani rupashah || konu marya amithitah | sakha sakhayamabravit | jahako
    asmadishate || yastityaja sakhividagm sakhayam | na tasya vacyapi bhago asti | yadigm shrinotyalakagm
    shrinoti || || na hi praveda sukritasya panthamiti || ritur rituna nudyamanah | vinanadabhidhavah
    | shashtishca trigmshaka valgah | shuklakrishnau ca shashtikau || saragavastrai rjaradakshah | vasanto
    vasubhi va~thsarasya savituh | praishakri ssmritah || amunadaya shca parirakshatah | eta vacah prayujyante
    | yatrai tadupadrishyate || etadeva vijaniyat | pramana nkalaparyaye | visheshana ntu vakshyamah |
    rituna ntannibodhata || shuklavasa rudraganah | grishmenavartate saha | nijaha nprithivigm sarvam
    || 'pratikhyena sah || vishvarupani vasagmsi | adityana rdadatagm saha || aduhkho duhkha cakshuriva
    | tadma pita iva drishyate | shitena vyathayanniva | rurudaksha iva drishyate || hladayate jvalatashcaiva
    | shamyatashcasya cakshushi | yavai praja bhraggshyante | sam va~thsaratta bhraggshyante || yah pratitishthanti
    | sam va~thsare tah pratitishthanti | varshabhya ityarthah || akshiduhkhotthitasyaiva | viprasanne
    kaninike | ankte cadgana ntannibodhata || kanakabhani vasagmsi | ahatani nibodhata | annamashrnita
    mrijmita | aham vo~ jivanapradah || eta vacah prayujyante | sharadyatropa drishyate || 'bhighnanta
    iva | vatavanto marudganah || amuto jetumishumukhamiva | sannaddha ssaha dadrishe ha | apaddhvastai
    rvastivarnairiva | vishikhasah kapardinah || akruddhasya yothsyamanasya | kriddhasyeva lohini | hematashcakshushi
    vidyat | akshnayoh ndevalokeshu | manunamudaka ngrihe | eta vacah pravadantih | vaidyuto yanti shaishirih
    || ta agnih pavamana anvai kshata | iha jivikama paripashyann | tasyaisha bhavati || iheha vah svatapasah
    | maruta ssuryatvacah | sharma sapratha avrine || ati tamrani vasagmsi | ashtivajri shataghni ca |
    vishve deva vipraharanti | agnijihva asashcata || naiva devo na martyah | na raja varuno vibhuh |
    nagni rnendro na pavamanah | matrikkacca na vidyate || divyasyaika dhanurartnih | prithivyamapara
    shrita || || tasyendro vamrirupena | dhanurjya machinathsvayam || tadindradhanurityajyam | abhravarneshu
    cakshate | etadeva sham drudrasya dhanuh || rudrasya tveva dhanurartnih | shira utpipesha | sa pravargyo
    ssapravargyena yajnena yajate | rudrasya sa shirah pratidadhati | nainagm rudra aruko bhavati | ya
    evam 'tirashcat | shishirah pradrishyate | naiva rupa nna vasagmsi | na cakshuh pratidrishyate ||
    anyonya ddevalakshanam | lohito shnih | suryasyodayana nkaroshi nyanjalikam | tva nkaroshi nijanukam
    || nyanjalika | ami vaca mupasatamiti || tasmai sarva ritavo namante | maryada karatva tprapurodham
    | brahmana apnoti | ya evam ssaha | indraya sarvan kamanabhivahati | sa draphsah | tasyaisha bhavati
    || || ava draphso agmshamatimatishthat | iyanah krishno dashabhih sahasraih shshacya dhamantam | upasnuhi
    ta mathadramiti || etayai vendra ssala vrikya saha | asura nparivrishcati | prithivyagm shumati |
    tamanva va~thsaro divanca | naivam ntevasinau | anyonyasmai druhyatam | yo druhyati | bhrashyate svarga
    llokat | ityatu mandalani | surya mandala nyakhyayikah | ata urdhvagmsanirvacanah || arogo bhrajah
    patarah patangah | svarnaro jyotishiman vibhasah | te asmai sarve divamatapanti | urja nduhana anapasphuranta
    iti || kashyapo nna jahati | tasyaisha bhavati || yatte shilpa nkashyapa rocanavat | indriyava ncitrabhanu
    | yasmi nthsurya arpita madhivishrayemamiti || te asmai sarve kashyapa thsomah kashyapadadhi nirdhamati
    | bhrasta karma kridivaivam || prano jivanindriya jivani | sapta shir shanyah pranah | surya ityacaryah
    || apashyamaha metan ryaniti | pancakarno vathsyayanah | saptakarnashca plakshih || || anushravika
    eva nau kashyapa iti | ubhau vedayite | na hi shekumiva mahameru ngantum || apashyamahameta mparivartamanam
    | gargyah pranatratah | gacchanta mahamerum | ekancajahatam || bhrajapatara patanga nihane | tishthannatapanti
    | tasmadiha taptri tapah || || amutretare | tasmadiha taptri tapah || teshamesha bhavati || sapta
    surya diva manu pravishtah | tananveti pathibhi rdakshinavan | te asmai sarve ghritamatapanti | urja
    nduhana anapasphuranta iti || saptartvija ssurya ityacaryah || teshamesha bhavati || sapta disho nana
    suryah || || sapta hotara ritvijah | deva aditya ye sapta | tebhi ssomabhi rakshana iti || tadapyamnayah
    | digbhraja ritu n karoti || etayaivavrita ''sahasrasuryataya iti vaishampayanah || tasyaisha bhavati
    || yaddyava indra te shatagm shata | uta syuh | na tva vajrin thsahasragm suryah || anu na jatamashta
    rodasi iti || nana lingatva nnana suryatvam || ashtau tu vyavasita iti || suryamandala nyashtata urdhvam
    || teshamesha bhavati || citra mudagadanikam | cakshu rmitrasya varunasyagneh | a 'pra dyava prithivi
    antariksham | surya atma jagatastasthushashceti || nnivishate | kvayagm sam va~thsaro mithah | kvahah
    kveya ndeva ratri | kva masa ritava shshritah || ardhamasa muhurtah | nimeshastutibhih saha | kvema
    apo nivishante | yadito yanti samprati || kala aphsu nivishante | apa ssurye samahitah || nyapah prapadyante
    | vidyuthsurye samahita || anavarne ime bhumi | iyancasau ca rodasi || kigg svidatrantara bhutam |
    yeneme vidhrite ubhe | vishnuna vidhrite bhumi | iti vathsasya vedana || iravati dhenumati hi bhutam
    | suyavasini manushe dashasye drodasi vishnavete | dadhartha prithivi dvishno rbalamahuh | ka diptih
    ki mparayanam | eko yaddha raya ddevah | rejati rodasi ubhe || vatadvishno rbala mahuh | akshara ddipti
    rucyate | tripadaddharaya ddevah | yadvishnoreka || agnayo vayavashcaiva | etadasya parayanam || pricchami
    tva para mmaddhyamancatum | lokanca punyapapanam | eta tpricchami samprati || amumahuh para mmrityum
    | pavamana ntu maddhyamam | agnirevavamo mrityuh | candrama ya~nti sarvada | abhogastveva sam ya~nti
    | yatra punyakrito janah || tato maddhyamamayanti | catumagninca samprati || pricchami tva papakritah
    | yatra yatayate yamah | tvannasta nprabruhi | yadi ve ssuryah | papannirghnanti sarvada | rodasyoranta
    rdesheshu | tatra nyasyante vasavaih || te 'sharirah prapadyante | yatha 'punyasya karmanah | apa
    nyapada keshasah | tatra te 'yonija janah || mritva punarmrityu mapadyante | adyamana || ashatikah
    krimaya iva | tatah puyante vasavaih || apaita vi~dbrahmanah | dirghashruttamo bhavati | kashyapasyatithi
    ssiddhagamanah || tasyaisha bhavati || ayasmina thsapta vasavah | rohanti purvya ruhah || ha dirghashruttamah
    | indrasya gharmo atithiriti || kashyapah pashyako bhavati | yathsarva mparipashyatiti saukshmyat
    || athagnerashtapurushasya | tasyaisha bhavati || agne naya supatha raye asman | vishvani deva vayunani
    vidvan | yuyoddhyasma jjuhuranamenah | bhuyishthante nama uktim agnishca jatavedashca | sahoja ajiraprabhuh
    | vaishvanaro naryapashca | panktiradhashca saptamah | visarpe vashtamo kshita iti || yathartve rarcirvarna
    visheshah | nilarcishca pitaka rcishceti || atha vayo purushasyaikadashastrikasya || prabhrajamana
    vyavadatah || || yashca vasuki vaidyutah | rajatah parusha shshyamah | kapila atilohitah | urdhva
    avapatantashca | vaidyuta ityekadasha || nainam vai~dyuto hinasti | ya evam ve~da || sa hovaca vyasah
    parasharyah | vidyudvadhamevaha cchamiti || na tvakamagm hanti || ve~da || atha gandharvaganah | svana
    bhrat | anghari ssuhastah | krishanu rvishvavasuh | murdhanvan ryavarcah | kritirityekadasha gandharvaganah
    || devashca mahadevah | rashmayashca deva garagirah || ngaro hinasti | ya evam ve~da || gauri mimaya
    salilani takshati | ekapadi dvipadi sa catushpadi | ashtapadi navapadi babhuvushi | sahasrakshara
    parame vyomanniti || vaco visheshanam || atha nigadavyakhyatah | tananukramishyamah || varahavah nmahaso
    dhupayah | shvapayo grihamedha shcetyete | ye ceme 'shimividvishah || parjanya ssapta prithivimabhivar
    shanti | vrishtibhiriti | etayaiva vibhakti viparitah | saptabhirvatai rudiritah | amum shanti | teshamesha
    bhavati || samana || uccaityava cahabhih | bhumi mparjanya jinvanti | diva tyagnaya iti || yadakshara
    mbhutakritam | vishve deva upasate | mahar makurvata || jamadagni rapyayate | chandobhi shcaturuttaraih
    | rajna ssomasya triptasah || || brahmana viryavata | shiva nah pradisho dishah || taccham yo~ra vrinimahe
    | gatum svastirastu nah | svasti rmanushebhyah | urdhva njigatu bheshajam | shanno astu dvipade |
    shancatushpade || somapa iti nigadavyakhyatah || vyo~ma sahasravrit | ashvina bhujyu nasatya | vishvasya
    jagataspati || jaya bhumih patirvyoma | mithunanta aturyathuh | putro brihaspati rudrah | sarama iti
    stripumam || shukram va~manyat | vishurupe ahani dyauriva sthah || || vishva hi maya avatha ssvadhavantau
    | bhadra va mpushanaviha ratirastu || vasa tyau citrau jagato nidhanau | dyavabhumi carathah sagm
    sakhayau | tavashvina rasabha mme | shubhaspati agatagm suryaya saha || tyugro ha bhujyu mashvinoda
    meghe | rayinna kashci vatibhih | antariksha prudbhira kshapastriraha 'tivrajadbhih | nasatya bhujyumuhathuh
    patangaih | samudrasya dhanvannardrasya pare | tribhi rathai shshadashvaih || savitaram vi~tanvantam
    | anubaddhnati shambarah | apapur barashcaiva | savita 'repaso 'bhavat || tyagm sutriptam vi~ditvaiva
    | bahusoma giram || anveti tugro vakriyantam | ayasuyan thsomatriphsushu || sa sangrama 'tyotah |
    vaco gah pipati tat | sa tadgobhi 'tyetyanye | rakshasa 'nanvitashca ye || anveti parivrittya 'stah
    | evametau stho ashvina | te ete dyuh prithivyoh | aharaha || tayo retau vathsa vahoratre | prithivya
    ahah | divo ratrih | ta avisrishtau | dampati eva bhavatah || tayo retau vathsau | agnishca dityashca
    | ratrervathsah | shveta adityah | ahno || tamro arunah | ta avisrishtau | dampati eva bhavatah ||
    tayo retau vathsau | vritrashca vaidyutashca | agnervritrah | vaidyuta adityasya | ta avisrishtau
    | dampati eva bhavatah || tayo retau vathsau || || ushma ca niharashca | vritrasyoshma | vaidyutasya
    niharah | tau taveva pratipadyete || seyagm ratri garbhini putrena sam va~sati | tasya va etadulbana
    m | yadratrau rashmayah | yatha gorgarbhinya ulbana m | evametasya ulbana m || prajayishnuh prajaya
    ca pashubhishca bhavati | ya evam mapiyantanceti | adityah punyasya vathsah | atha pavitrangirasah
    || pavitravantah parivajamasate | pitaisha mpratno abhirakshati vratam | mahassamudram va~runa stirodadhe
    | dhira icchekurdharuneshvarabha | prabhurgatrani paryeshi vishvatah | ataptatanu rna tadamo ashnute
    | shritasa idvahan thsamashata || brahma devana mpadavih kavinamrishirviprana m | shyeno gridhranag
    svadhiti rvananagm somah pavitramatyeti rebhann || asata ssaptatrishca yat | sarve 'trayo agastyashca
    | nakshatrai shshankrito 'vasann || atha savitu shshyavashvasya 'vartikamasya || ami ya riksha nihita
    sa ucca | nakta ndadrishre kuhaciddiveyuh | adabdhani varunasya vratani | vicakasha ccandrama nakshatrameti
    || ta nyam | bhargo devasya dhimahi || || dhiyo yo nah pracodaya ndevasya bhojanam | shreshthagm sarvadhatamam
    | tura mbhagasya dhimahi || apaguhata savita tribhin | sarva ndivo andhasah | nakta ndrishe | asthyasthna
    sambhavishyamah || nama namaiva nama me mpumagstryasmi | sthavaro 'smyatha jangamah | yaje 'yakshi
    yashtahe ca || maya bhutanyayakshata | pashavo mama bhutani | anubandhyo 'smyaham vi~bhuh || striyah
    satih | ta u me pugmsa ahuh | pashyadakshanvanna vicetadandhah | kaviryah putra 'sat || andho manimavindat
    | tamananguli ravayat | agrivah pratyamuncat | tamajihva asashcata || urdhvamula mavakchakham | vriksham
    ya~ veda samprati | na sa jatu janah shraddaddhyat | mrityurma marayaditih || hasitagm ruditangitam
    || || vina pana valasitam | mritanjivanca yatkincit | angani sneva viddhi tat || atrishyaggstrishya
    dhyayat | asmajjata me mithu carann | putro nir ritya vaidehah | aceta yashca cetanah || sa ta mmanimavindat
    | so 'nanguliravayat | so 'grivah pratyamuncat || 'jihvo asashcata || naitamrishim mpravishet | yadi
    pravishet | mithau caritva pravishet | tathsambhavasya vratam || a tamagne rathantishtha | eka shvameka
    yojanam | ekacakra mekadhuram | vata dhraji gatim vi~bho || na rishyati na vyathate || || nasyaksho
    yatu sajjati | yacchveta shcagneh | rathe yuktva 'dhitishthati || ekaya ca dashabhishca svabhute |
    dvabhya mishtaye vigmshatya ca | tisribhishca vahase trigmshata ca | niyudbhi rvayaviha ta vimunca
    || atanushva pratanushva | uddhamadhama sandhama | aditye candravarnanam | garbha ma dhehi yah puman
    || ita ssiktagm suryagatam | candramase rasankridhi | varada 'gnim | ya eko rudra ucyate || asa ssahasrani
    | smaryate na ca drishyate || || evametannibodhata || a mandrai rindra haribhih | ya hi mayura romabhih
    | matva kecinniye murinna pashinah | dadhanveva ta ihi || ma mandrai rindra haribhih | yami mayura
    romabhih | ma ma kecinniye murinna pashinah | nidhanveva ta~ imi || anubhishca mahadbhishca || ||
    nighrishvai rasamayutaih | kalair haritvamapannaih | indrayahi sahasra yuk || agni rvibhrashti vasanah
    | vayu shshvetasikadrukah | sam va~thsaro vishu varnaih | nityaste 'nucarastava || subrahmanyogm subrahmanyogm
    subrahmanyom | indragaccha hariva agaccha medhatitheh | mesha vrishanashvasya mene || halyayai jara
    | kaushika brahmana gautamabruvana || arunashva ihagatah | vasavah prithivi kshitah | ashtau digvasaso
    'gnayah | agnishca jataveda shcetyete || tamrashva stamrarathah | tamravarna khadagdatah | ito rudrah
    mpramananca pura ita || brihaspatishca savita ca | vishvarupai rihagatam | rathenodakavartmana | aphsusha
    iti taddvayoh || ukto vesho vasagmsi ca | kalavayavana mitah pratijya | vasatya ityashvinoh | ko 'ntarikshe
    shabdankarotiti | vasishtho rauhino mimagmsa ncakre | tasyaisha bhavati || vashreva vidyunmimati vathsa
    nna mata sishakti | yadesham vri~shtirasarji || diti || brahmana udaranamasi | brahmana udiranamasi
    | brahmana astaranamasi | brahmana upastaranamasi || mashtaputram | ashtapatni ve~da na me mrityuh
    | na camrityuraghaharat || ashtayo nyashta putram | ashtapadida mantariksham | aham ve~da na me mrityuh
    | na camrityuraghaharat | ashtayoni mashtaputram | ashtapatni ve~da na me mrityuh | na camrityuraghaharat
    || sutramana ndyamanehasagm susharmana maditigm supranitim | daivi nnavagg svaritramanagasamasravantima
    ruhema svastaye || mahimushumahimu shu mataragm suvratanamritasya patnimavase huvema | tuvikshatramajarantimurucigm
    susharmanamaditigm supranitim || aditirdyau rantariksham | aditi rmata sa pita sa putrah | vishve
    deva aditih panca janah rjanitvam || ashtau putraso aditeh | ye jata stanvah pari | deva~ || para
    martandamasyat || saptabhih putrai m | prajayai mrityave tat | para martanda mabharaditi || tananukramishyamah
    || mitrashca varunashca | dhata ca ryama ca | agmshashca bhagashca | indrashca vivasvagshcetyete ||
    hiranyagarbha ssamavartatagre bhutasya jatah patireka asit | sa dadhara prithivi nkasmai devaya havisha
    vidhema || hagmsa saddhota vedishadatithi rduronasat | nrisha dvyomasadabja goja ritaja adrija ritam
    brihat || brahma jajnana mpurastadvi simata ssuruco vena avah | sa budhniya upama asya vishtha ssatashca
    yonimasatashca vivah || taditpada nna viciketa vidvan | yanmritah punarapyeti jivan | trivridya dbhuvanasya
    rathavrit | jivo garbho na mrita ssa jivat || miti || garbhah prajapatyah | atha purusha 'sau tapannudeti
    | sa sarvesha mprananadayodeti | ma me prajaya ma pashunam | ma mama prananadayodagah || asau yo 'stameti
    | sa sarvesha mprananadayastameti | ma me prajaya ma pashunam | ma mama prananadaya stangah || asau
    ya apuryati | sa sarvesha mpranai rapuryati || prajaya ma pashunam | ma mama pranai rapurishthah ||
    asau yo 'pakshiyati | sa sarvesha prajaya ma pashunam | ma mama pranai rapaksheshthah || amuni nakshatrani
    | sarvesha mpranairapa prasarpanti cothsarpanti ca | ma me prajaya ma pashunam | ma mama pranairapa
    prasripata mothsripata || shcardhamasashca | sarvesha mpranairapa prasarpanti cothsarpanti ca | ma
    me prajaya ma pashunam | ma mama pranairapa prasripata mothsripata | ima ritavah | sarvesha mpranairapa
    prasarpanti cothsarpanti ca | ma me prajaya ma pashunam | ma mama pranairapa prasripata mothsripata
    || ayagm sam mpranairapa prasarpati cothsarpati ca || prajaya ma pashunam | ma mama pranairapa prasripa
    mothsripa || idamahah | sarvesha rapa prasarpati cothsarpati ca | ma me prajaya ma pashunam | ma mama
    pranairapa prasripa mothsripa | iyagm ratrih | sarvesha rapa prasarpati cothsarpati ca | ma me prajaya
    ma pashunam | ma mama pranairapa prasripa mothsripa || au mbhurbhuvassvah || etadvo mithuna mma no
    mithunagm ridhvam || yosau shodashamuni dvadashaya udetyastametyapuryatyapakshiyatyamuni nakshatrani
    me masa ima ritavo va~thsara idamahariyagm ratrirdasha athadityasyashta purushasya || vasuna madityanag
    sthane svatejasa bhani || rudrana sthane svatejasa bhani || adityana sthane svatejasa bhani || satagmsatyanam
    | adityanag sthane svatejasa bhani || abhidhunvata mabhighnatam | vatavata mmarutam | adityanag sthane
    svatejasa bhani || ribhuna sthane svatejasa bhani || vishvesha ndevanam | adityanag sthane svatejasa
