id: kyts-jata-5-3-uthsannayagno-vaa-esha-yadagnih-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.3 Uthsannayagno Vaa Esha Yadagnih - Krishna Yajurveda Taittiriya Samhita
content:
  english: uthsannayajno vai va uthsannayajna uthsannayajno vai | uthsannayajna ityuthsanna va esha esha
    vai va eshah | nki magni ragnih kim | va 'haha va va 'ha | ahaita syaita syaha haitasya | kriyata
    eta syaitasya kriyate vai yajnasya yajnasya vai vai yajnasya | yajnasya kriyamanasya kriyamanasya
    yajnasya yajnasya kriyamanasya | kriyamanasya ntarya ntyantaryanti kriyamanasya kriyamanasya ntaryanti
    | antaryanti puyati puya tyantarya ntyantaryanti puyati | antaryantityantah puyati vai vai puyati
    puyati vai | va asyasya vai va asya | ttada syasya tat | upa dadhati dadha tyupopa dadhati | dadha
    tyashvina vashvinau dadhati dadha tyashvinau ashvinau vai va ashvina vashvinau vai | mbhishajau bhishajau
    devana mbhishajau bhishajau tabhya tabhya mevaiva tabhya evasma asma evai vasmai mbheshaja masma asmai
    bheshajam | nkaroti karoti bheshaja karoti panca panca karoti karoti panca | pancopopa panca pancopa
    | upa dadhati dadha tyupopa dadhati | dadhati panktah pankto dadhati dadhati panktah | pankto yajno
    yajnah panktah pankto yajnah | yajno yajno yavan | yava nevaiva yavan eva yajno yajna evaiva yajnah
    | yajna stasmai tasmai yajno yajna stasmai ntasmai tasmai bheshajam | nkaroti karoti bheshaja karo
    tyritavya ritavyah karoti karo tyritavyah tavya ritavya upa | upa dadhati dadha tyupopa dadhati |
    dadha tyrituna mrituna ndadhati dadha tyritunam | nklriptyai klriptya rituna mrituna klriptyai panca
    panca klriptyai klriptyai panca | || pancopopa panca pancopa | upa dadhati dadha tyupopa dadhati |
    dadhati panca panca dadhati dadhati panca | panca vai vai panca panca vai | va ritava ritavo vai va
    ritavah | ritavo yavanto yavanta ritava ritavo yavantah | yavanta evaiva yavanto yavanta eva | sta
    nritava ritava stan | tan kalpayati kalpayati tag kalpayati samanaprabhritaya ssamanaprabhritayah
    kalpayati kalpayati samanaprabhritayah | samanaprabhritayo bhavanti bhavanti samanaprabhritaya ssamanaprabhritayo
    bhavanti | samanaprabhritaya iti samana bhavanti samanodarka ssamanodarka bhavanti bhavanti samanodarkah
    | samanodarka stasma ssamanodarka stasma samanodarka iti samana samana ritava ritavah samana ritava
    ekenaikena rtava ritava ekena | ekena padena padenaike naikena padena | padena vyavartante vyavartante
    padena padena vyavartante | vyavartante tasma dvyavartante vyavartante tasma vyavartanta iti vi tasma
    dritava ritava stasma ritavo vyavartante vyavartanta ritava ritavo vyavartante | vyavartante pranabhritah
    pranabhrito vyavartante vyavartante pranabhritah | vyavartanta iti vi pranabhrita upopa pranabhritah
    pranabhrita upa | pranabhrita iti prana upa dadhati dadha tyupopa dadhati | dadha tyritu shvritushu
    dadhati dadha tyritushu | nprana nevaiva pranan | ndadhati dadhati prana ddadhati dadhati tasma ryanti
    jiryanti na na ji ntyatho atho jiryanti jirya atho pra pratho atho pra | pra janayati janayati pra
    pra janayati | janaya tyevaiva janayati janaya tyeva | evaina nena nevai vainan | ena nesha esha ena
    nena neshah | esha vai va esha esha vai | tpranah prano yat | yadritavya ritavya ya ritavya upadhayo
    padhaya r tavya ritavya upadhaya | upadhaya pranabhritah pranabhrita upadhayo padhaya pranabhritah
    | tyupadadhati pranabhritah pranabhrita upadadhati | pranabhrita iti prana nthsarva nritun | ritu
    nanvan vritu nritu nanu | rvayu ranvanu vayuh | a varivarti varivartya varivarti | varivarti vrishtisani
    rvarivarti varivarti vrishtisanih vrishtisani rupopa vrishtisani rvrishtisani rupa | vrishtisaniriti
    vrishti upa dadhati dadha tyupopa dadhati | ndadhati dadhati vrishti vrishti mevaiva vrishtim ava
    rundhe rundhe 'vava rundhe | drundhe rundhe yat | ekadho padaddhya dupadaddhya deka dhaikadho padaddhyat
    | upadaddhya deka meka mupadaddhya dupadaddhya deka upadaddhyadityupa eka mritu mritu meka meka mritum
    | varshe danuparihara manupariharam anupariharagm sadayati sadaya tyanuparihara manupariharagm sadayati
    | anupariharamityanu thsadayati sadayati tasma nthsarva nritun | tpranabhritah pranabhrito ya pranabhrita
    upadha yopadhaya pranabhritah pranabhrita upadhaya | pranabhrita iti prana rvrishtisani rupadha yopadhaya
    vrishtisanih vrishtisani rupadadha tyupadadhati vrishtisani rvrishtisani rupadadhati | vrishtisaniriti
    vrishti dvayupracyuta vayupracyuta tasma vayupracyuta divo divo vayupracyuta vayupracyuta divah |
    vayupracyuteti vayu rdivo divo vrishtih | vrishti rirta irte vrishti irte pashavah pashava irta irte
    pashavah | pashavo vai vai pashavah pashavo vai | vai vayasya vayasya vai vai vayasyah vayasya nanamanaso
    nanamanaso vayasya vayasya nanamanasah | nanamanasah khalu khalu nanamanaso nanamanasah khalu | khalu
    vai vai khalu khalu vai | vai pashavah pashavo vai vai pashavah | vratah pashavah pashavo nana 'po
    'pa ste te 'pah | apa evaivapo 'pa eva | ssamanaso 'bhyabhi samanasah | nkamayeta kamayeta yam kamayeta
    pashu rapashuh kamayeta kamayeta pashuh | iti vayasya vayasya ititi vayasyah stasya tasya vayasya
    vayasya tasyopadha yopadhaya tasya tasyopadhaya | upadhaya pasya apasya upadha yopadhaya pasyah apasya
    upopa pasya apasya upa | ddaddhya dupopa daddhyat | evasma asma evai vasmai asmai pashubhih pashubhi
    rasma asmai pashubhih | pashubhih karoti karoti pashubhih pashubhih karoti | karo tyapashu rapashuh
    karoti karo tyapashuh | apashu revaiva pashura pashu reva | eva bhavati bhava tyevaiva bhavati | nkamayeta
    kamayeta yam npashuman kamayeta kamayeta pashuman | ityapasya apasya ititya pasyah stasya tasya pasya
    apasya tasyopadha yopadhaya tasya tasyopadhaya | upadhaya vayasya vayasya upadha yopadhaya vayasyah
    vayasya upopa vayasya vayasya upa | ddaddhya dupopa daddhyat | evasma asma evai vasmai asmai pashubhih
    pashubhi rasma asmai pashubhih | pashubhih karoti karoti pashubhih pashubhih karoti | npashuman karoti
    karoti pashuman | pashuma nevaiva pashuma eva bhavati bhava tyevaiva bhavati | bhavati catasra shcatasro
    bhavati bhavati catasrah | tpurastac catasra shcatasrah purasta purasta dupopa purasta upa dadhati
    dadha tyupopa dadhati | ddadhati dadhati tasma c catvari catvari tasma catvari cakshusha shcakshusha
    shcatvari catvari cakshushah | cakshusho rupani rupani cakshusha shcakshusho rupani | rupani dve dve
    rupani rupani dve | dve shukle shukle dve dve shukle | shukle dve dve shukle shukle dve | shukle iti
    shukle | dve krishne krishne dve dve krishne | krishne iti krishne | || rbhavanti bhavanti murdhanvati
    murdhanvatiriti murdhann dbhavanti bhavanti tasma nmurdha murdha purasta murdha panca panca murdha
    murdha panca | mpanca panca dakshinayam | dakshinayag shronyag shronya ndakshinayag shronya shronya
    mupopa shronyag shronya mupa | upa dadhati dadha tyupopa dadhati | dadhati panca panca dadhati dadhati
    panca | panco ttarasya muttarasya mpanca panco ttarasyam | ttasma duttarasya muttarasya tpravanah
    pashuh pashuh purasta tpravana iti purasta rbasto bastah pashuh pashu basto vayo vayo basto basto
    vayah | vaya ititi vayo vaya iti | iti dakshine dakshina ititi dakshine | dakshine 'gmse 'gmse dakshine
    dakshine 'gmse agmsa upopagmse 'gmsa upa | upa dadhati dadha tyupopa dadhati | rdadhati dadhati vrishnih
    | vaya ititi vayo vaya iti | ityuttara uttara iti tyuttare | uttare 'gmsa vagmsa vuttara uttare 'gmsau
    agmsa vevai vagmsa vagmsa veva | eva prati pratyevaiva prati | prati dadhati dadhati prati prati dadhati
    | dadhati vyaghro vyaghro dadhati dadhati vyaghrah | vyaghro vyaghro vayah | vaya ititi vayo vaya
    iti | iti dakshine dakshina ititi dakshine | dakshine pakshe pakshe dakshine dakshine pakshe | paksha
    upopa pakshe paksha upa | upa dadhati dadha tyupopa dadhati | ssigmho dadhati dadhati sigmhah | sigmho
    vayo vayah sigmha vaya ititi vayo vaya iti | ityuttara uttara itityuttare | pakshayo ruttara uttare
    pakshayoh pakshayo revaiva pakshayoh vi~rya mevaiva virya ndadhati dadhati viryam dadhati purushah
    purusho dadhati dadhati purushah | purusho vayo vayah purushah purusho vayah | vaya ititi vayo vaya
    iti | iti maddhye maddhya ititi maddhye nmaddhye maddhye tasma tpurushah purusha stasma mpurushah
    purushah pashunam | pashuna madhipati radhipatih pashuna mpashuna madhipatih | gni avyathamana mavyathamana
    mindra gni avyathamanam | avyathamana mititya vyathamana mavyathamana miti | iti svayamatrinnag svayamatrinna
    mititi svayamatrinnam | svayamatrinna mupopa svayamatrinnag svayamatrinna mupa | svayamatrinnamiti
    svayam upa dadhati dadha tyupopa dadhati | dadhati ndragnibhya mindragnibhya ndadhati dadhati ndragnibhya
    vai~ va indragnibhya mindragnibhyam indragnibhyamiti va ima vimau vai va imau | imau lokau loka vima
    vimau lokau | lokau vidhritau vidhritau lokau lokau vidhritau | vidhrita vanayo ranayo rvidhritau
    vidhrita vanayoh rlokayo ranayo ranayo rvidhrityai vidhrityai lokayo vidhritya adhrita 'dhrita vidhrityai
    vidhritya adhrita | adhriteve vadhrita 'dhriteva | ivavai va iveva vai | va eshaisha vai va esha |
    nmaddhyama maddhyama ya maddhyama citi shciti rmaddhyama maddhyama citih | citi rantariksha mantariksha
    nciti shciti rantariksham | antariksha mive vantariksha mantariksha miva | iva vai va iveva vai |
    va eshaisha vai va esha | itya hahe tityaha | ahendragni indragni aha hendragni | indragni vai va
    indragni indragni vai | devana mojobhrita vojobhritau devana ndevana mojobhritau ojobhrita vojasau
    jasaujo bhrita vojobhrita vojasa | oja saivaivauja saujasaiva | evaina mena mevai vaina ena mantarikshe
    'ntariksha ena mena mantarikshe | antarikshe cinute cinute 'ntarikshe 'ntarikshe cinute | cinute dhrityai
    dhrityai cinute cinute dhrityai svayamatrinna mupopa svayamatrinnag svayamatrinna mupa | svayamatrinnamiti
    svayam upa dadhati dadha tyupopa dadhati | dadha tyantariksha mantariksha ndadhati dadha tyantariksham
    | vai~ va antariksha mantariksham vai svayamatrinna svayamatrinna vai vai svayamatrinna | svayamatrinna
    'ntariksha mantarikshagg svayamatrinna svayamatrinna 'ntariksham | svayamatrinneti svayam antariksha
    mevai vantariksha mantariksha meva | upa dhatte dhatta upopa dhatte | ashva mupopashva mashva mupa
    | upa ghrapayati ghrapaya tyupopa ghrapayati | || nghrapayati ghrapayati pranam | prana mevaiva prana
    evasya masya mevai vasya ndadhati dadha tyasya masya dadha tyatho atho dadhati dadha tyatho prajapatyah
    prajapatyo 'tho atho prajapatyo vai vai prajapatyah prajapatyo vai | prajapatya iti praja va ashvo
    'shvo vai va ashvah | ashvah prajapatina prajapatina 'shvo 'shvah prajapatina | prajapati naivaiva
    prajapatina prajapati naiva | prajapatineti praja evagni magni mevai vagnim | ncinute cinute 'gni
    magni cinute svayamatrinna svayamatrinna cinute cinute svayamatrinna | svayamatrinna bhavati bhavati
    svayamatrinna svayamatrinna bhavati | svayamatrinneti svayam mbhavati bhavati pranana pranana muthsrishtya
    uthsrishtyai pranana mpranana muthsrishtyai | uthsrishtya atho atho uthsrishtya uthsrishtya atho uthsrishtya
    ityut atho suvargasya suvarga syatho atho suvargasya | suvargasya lokasya lokasya suvargasya suvargasya
    lokasya | suvargasyeti suvah lokasya nukhyatya anukhyatyai lokasya lokasya nukhyatyai | anukhyatyai
    devana ndevana manukhyatya anukhyatyai devana anukhyatya ityanu vai suvargagm suvargam suvargam ~lokam
    ~lokagm suvargagm suvargam ~lokam | ya~tam ~lokam ~lokam sa mavliyanta vliyanta sagm sa mavliyanta
    | 'vliyanta vliyanta te | ta eta eta ste ta etah | eta dishya dishya eta eta dishyah ndishya dishya
    apashyann | ta upopa ta sta upa | upa dadhata dadhato popa dadhata | adadhata tabhi stabhi radadhata
    dadhata tabhih | rvai vai tabhi stabhi te disho disha ste te dishah | ndisho disho 'drigmhann | tyupadadhati
    dishya dishya upadadhati | tyupadadhati disham | vi~dhrityai vidhrityai disha vidhrityai dasha dasha
    vidhrityai vidhrityai dasha | dasha pranabhritah pranabhrito dasha dasha pranabhritah | pranabhritah
    purasta tpranabhritah pranabhritah purasta pranabhrita iti prana purasta dupopa purasta upa dadhati
    dadha tyupopa dadhati | || dadhati nava nava dadhati dadhati nava | nava vai vai nava nava vai | vai
    purushe purushe vai vai purushe | purushe pranah pranah purushe purushe pranah | rnabhih pranah prana
    nabhih | rdashami dashami nabhi ndashami dashami pranan | prana nevaiva prana tpurasta devaiva purasta
    ddhatte dhatte purasta ddhatte dhatte tasma tpranah pranah purasta prana jyotishmati mpranah prana
    jyotishmatim | jyotishmati muttama muttama njyotishmati muttamam | ttama muttama mupa | upa dadhati
    dadha tyupopa dadhati | ddadhati dadhati tasma rvag vag jyotih | jyoti ruttamo ttama jyoti rjyoti
    ruttama | dasho popa dasha dashopa | upa dadhati dadha tyupopa dadhati | kshara dadhati dadhati dasha
    dvirat chandasam | rjyoti shchandasa jyoti revaiva jyoti tpurasta devaiva purasta ddhatte dhatte purasta
    ddhatte dhatte tasma tpurastaj jyotih | jyoti rupopa jyoti asmahe chandagmsi chandag syasmaha asmahe
    chandagmsi | chandagmsi pashushu pashushu chandagmsi chandagmsi pashushu | mpashushu pashu shvajim
    | aji mayu rayu raji maji mayuh | sta nayu rayustan | nbrihati brihati tag dbrihati briha tyut | udajaya
    dajaya dudu dajayat | hatah pashavah pashavo bar pashava ucyanta ucyante pashavah pashava ucyante
    | ucyante ma mocyanta ucyante ma | ma chanda shchando ma ma chandah | chanda ititi chanda shchanda
    iti | iti dakshinato dakshinata ititi dakshinatah | dakshinata upopa dakshinato dakshinata upa | upa
    dadhati dadha tyupopa dadhati | ddadhati dadhati tasma ddakshinavrito dakshinavrita stasma dakshinavrito
    masa masa dakshinavrito dakshinavrito masah dakshinavrita iti dakshina prithivi prithivi masa masah
    prithivi chanda shchandah prithivi prithivi chandah | chanda ititi chanda shchanda iti | tpashca dititi
    pashcat | tpratishthityai pratishthityai pashca pratishthitya agni ragnih pratishthityai pratishthitya
    agnih | pratishthitya iti prati rdevata devata 'gni ragni deva tetiti devata deva teti | ityuttarata
    uttarata iti tyuttaratah | uttarata oja oja uttarata uttarata ojah | ojo vai va oja ojo vai | agni
    roja ojo 'gni ragni rojah | oja evai vauja oja eva | evottarata uttarata evai vottaratah | uttarato
    dhatte dhatta uttarata uttarato dhatte | ddhatte dhatte tasma tasma duttaratobhipraya yyuttaratobhiprayayi
    tasma ttasma duttaratobhiprayayi | uttaratobhiprayayi jayati jaya tyuttaratobhipraya yyuttaratobhiprayayi
    jayati | uttaratobhiprayayityuttaratah jayati shattrigmsha thshattrigmshaj jayati jayati shattrigmshat
    | thsagm sagm shattrigmsha thshattrigmsha shattrigmshaditi shat mpadyante padyante sagm sa padyante
    shattrigmshadakshara shattrigmshadakshara padyante padyante shattrigmshadakshara | shattrigmshadakshara
    brihati brihati shattrigmshadakshara shattrigmshadakshara brihati | shattrigmshadakshareti shattrigmshat
    hata brihati brihati bar hatah pashavah pashavo bar pashavo brihatya brihatya pashavah pashavo brihatya
    | brihatyaivaiva brihatya brihatyaiva | evasma asma evai vasmai npashu nasma asmai pashun | ava rundhe
    rundhe 'vava rundhe | rundhe brihati brihati rundhe rundhe brihati | mbrihati brihati chandasam |
    nchandasag svara pari yayeyaya pari pariyaya | iyaya yasya yasyeyaye yaya yasya | yasyaita eta yasya
    yasyaitah | eta upadhiyanta upadhiyanta eta eta upadhiyante upadhiyante gacchati gaccha tyupadhiyanta
    upadhiyante gacchati | upadhiyanta ityupa ngacchati gacchati svara jyagm sapta sapta svara sapta valakhilya
    valakhilya ssapta sapta valakhilyah | valakhilyah purasta dvalakhilya valakhilyah purasta valakhilya
    iti vala purasta dupopa purasta upa dadhati dadha tyupopa dadhati | dadhati sapta sapta dadhati dadhati
    sapta | thsapta sapta pashcat | thsapta sapta pashca sapta vai vai sapta sapta vai | prana dvau dvau
    pranah prana dvau | prananagm saviryatvaya saviryatvaya pranana mprananagm saviryatvaya | saviryatvaya
    murdha murdha saviryatvaya saviryatvaya murdha | saviryatvayeti savirya murdha 'syasi murdha murdha
    'si | asi rad rada syasi rat | radititi rad raditi | tpurasta dititi purasta purasta dupopa purasta
    upa dadhati dadha tyupopa dadhati | dadhati yantri yantri dadhati dadhati yantri yantri rad rad yantri
    yantri rat | radititi rad raditi | tpashca dititi pashcat | prana nevaiva prana evasma asma evai vasmai
    asmai samicah samico 'sma asmai samicah | samico dadhati dadhati samicah samico dadhati | dadhatiti
    dadhati | || deva vai vai deva deva vai | yajne 'kurvata kurvata yajne yajne 'kurvata | ttadakurvata
    kurvata tat | tadasura asura sta asura akurvata kurvata sura asura akurvata | akurvata te te 'kurvata
    kurvata te | te deva deva ste te devah | deva eta eta deva deva etah | eta akshnayastomiya akshnayastomiya
    eta eta akshnayastomiyah akshnayastomiya apashya nnakshnayastomiya akshnayastomiya apashyann | akshnayastomiya
    ityakshnaya ta anyatha 'nyatha ta sta anyatha anyatha 'nucya nucya nyatha 'nyatha 'nucya | anucya
    nyatha 'nyatha 'nucya nucya nyatha anyathopopa nyatha 'nyathopa | upa dadhata dadhatopopa dadhata
    | ttadadadhata dadhata tat | tadasura asura sta asura na nasura asura na | ntata stato 'nvavaya anvavayannityanu
    tato deva deva stata stato devah | ndeva deva abhavann | para 'sura asurah para para 'surah | dyadasura
    asura yat | yadakshnayastomiya akshnayastomiya ya dyadakshnayastomiyah akshnayastomiya anyatha 'nyatha
    'kshnayastomiya akshnayastomiya anyatha akshnayastomiya ityakshnaya anyatha 'nucya nucya nyatha 'nyatha
    'nucya | anucya nyatha 'nyatha 'nucya nucya nyatha tyanyatha 'nyatho padadhati | upadadhati bhratrivyabhibhutyai
    bhratrivyabhibhutya upadadha tyupadadhati bhratrivyabhibhutyai | bhratrivyabhibhutyai bhavati bhavati
    bhratrivyabhibhutyai bhratrivyabhibhutyai bhavati | bhratrivyabhibhutya iti bhratrivya bhava tyatmana
    ''tmana bhavati bhava tyatmana atmana para para ''tmana ''tmana para asya bhratrivyo bhratrivyo 'syasya
    bhratrivyah | bhratrivyo bhavati bhavati bhratrivyo bhratrivyo bhavati | rbhavati bhava tyashuh |
    ttrivri dashu rashu strivrit | trivri dititi trivri tpurasta dititi purasta purasta dupopa purasta
    upa dadhati dadha tyupopa dadhati | dadhati yajnamukham ndadhati dadhati yajnamukham | yajnamukhamiti
    yajna yajnamukha mevaiva yajnamukham yajnamukhamiti yajna tpurasta devaiva purasta vi yatayati yatayati
    vi vi yatayati | yatayati vyoma vyoma yatayati yatayati vyoma | ssaptadasho vyoma vyoma saptadashah
    | saptadasha ititi saptadasha iti dakshinato dakshinata ititi dakshinatah | dakshinato 'nna manna
    ndakshinato dakshinato 'nna vai vyoma vyoma vai vai vyoma | ssaptadasho 'nna mannagm saptadashah |
    saptadasho 'nna mannagm saptadasha anna mevaivanna manna meva | eva dakshinato dakshinata evaiva dakshinatah
    | dakshinato dhatte dhatte dakshinato dakshinato dhatte | ddhatte dhatte tasma ddakshinena dakshinena
    tasma dakshine nanna manna ndakshinena dakshine nanna anna madyate 'dyate 'nna manna madyate | adyate
