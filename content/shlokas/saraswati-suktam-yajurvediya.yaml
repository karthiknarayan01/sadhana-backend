id: saraswati-suktam-yajurvediya
category: stotram
name:
  english: Saraswati Suktam (Yajurvediya)
content:
  english: pra no devi sarasvati vajebhirvajinivati | dhinamavitryavatu || a no divo brihatah parvatada
    sarasvati yajata gantu yajnam | hava ndevi jujushana ghritaci shagma nno vacamushati shrinotu || paviravi
    kanya citrayu ssarasvati virapatni dhiya ndhat | gnabhiracchidragm sharanagm sajosha duradhar ngrinate
    sharma yagmsat || sarasvati jushasva | tava sharma na upa stheyama sharana yaste stanah shashayo yo
    mayobhuryena vishva pushyasi varyani | yo ratnadha vasuvidya ssarasvati tamiha dhatave kah || neshi
    vasyo mapa spharih payasa ma na a dhak | jushasva na tkshetranyaranani ganma || bhirbisakha ivarujatsanu
    girina ntavishebhirurmibhih | paravataghnimavase suvriktibhissarasvati ma vivasema dhitibhih || om
    shanti
  devanagari: प्र णो॑ दे॒वी सर॑स्वती॒ वाजे॑भिर्वा॒जिनी॑वती । धी॒नाम॑वि॒त्र्य॑वतु ॥ आ नो॑ दि॒वो बृ॑ह॒तः
    पर्व॑ता॒दा सर॑स्वती यज॒ता ग॑न्तु य॒ज्ञम् । हव॑ न्दे॒वी जु॑जुषा॒णा घृ॒ताची॑ श॒ग्मा न्नो॒ वाच॑मुश॒ती
    शृ॑णोतु ॥ पावी॑रवी क॒न्या॑ चि॒त्रायु॒ स्सर॑स्वती वी॒रप॑त्नी॒ धिय॑ न्धात् । ग्नाभि॒रच्छि॑द्रग्ं शर॒णग्ं
    स॒जोषा॑ दुरा॒धर् ङ्गृण॒ते शर्म॑ यग्ंसत् ॥ सरस्वति जुषस्व । तव॒ शर्म ना॒ उप॑ स्थेयाम शर॒ण यस्ते॒ स्तनः॑
    शश॒यो यो म॑यो॒भूर्येन॒ विश्वा॒ पुष्य॑सि॒ वार्या॑णि । यो र॑त्न॒धा व॑सु॒विद्य स्सर॑स्वति॒ तमि॒ह धात॑वे
    कः ॥ नेषि॒ वस्यो॒ माप॑ स्फरीः॒ पय॑सा॒ मा न॒ आ ध॑क् । जु॒षस्व॑ न त्क्षेत्रा॒ण्यर॑णानि गन्म ॥ भिर्बिस॒खा
    इ॑वारुज॒त्सानु॑ गिरी॒णा न्त॑वि॒षेभि॑रू॒र्मिभिः॑ । पा॒रा॒व॒त॒घ्नीमव॑से सुवृ॒क्तिभि॑स्सर॑स्वती॒ मा वि॑वासेम
    धी॒तिभिः॑ ॥ ॐ शान्ति॒
