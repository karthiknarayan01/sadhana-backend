id: n-isimhastotramgarudapurana
category: stotram
name:
  english: nṟisimhastotramgarudapurana
  devanagari: न्ऱिसिंहस्तोत्रम्गरुडपुराण
content:
  english: nrisimhastotram garudapuranantargatam suta uvaca | narasimhastutim vakshye shivoktam shaunakadhuna
    | purvam matriganah sarve shankaram vakyamabruvan || 1|| bhagavanbhakshayishyamah sadevasuramanusham
    | tvatprasadajjagatsarvam tadanujnatumarhasi || 2|| shankarauvaca | bhavatibhih prajah sarva rakshaniya
    na samshayah | tasmadvorataraprayam manah shighram nivartyatam || 3|| ityevam shankarenoktamanadritya
    tu tadvacah | bhakshayamasuravyagrastrailokyam sacaracaram || 4|| trailokye bhakshyamane tu tada matriganena
    vai | nrisimharupinam devam pradadhyau bhagavanchivah || 5|| anadinidhanam devam sarvabhutabhavodbhavam
    | vidyujjihvam mahadamshtram sphuratkesaramalinam || 6|| ratnangadam samukutam hemakesarabhushitam
    | khonisutrena mahata kancanena virajitam || 7|| nilotpaladalashyamam ratnanupurabhushitam | tejasakrantasakalabrahmandodaramandapam
    || 8|| avartasadrishakaraih samyuktam deharomabhih | sarvapushpairyojitanca dharayamshca mahastrajam
    || 9|| sa dhyatamatro bhagavanpradadau tasya darshanam | yadrishena rupena dhyato rudraistu bhaktitah
    || 10|| tadrishenaiva rupena durnirikshyena daivataih | pranipatya tu devesham tada tushtava shankarah
    || 11|| shankara uvaca | namaste'sta jagannatha narasimhavapurdhara | daityeshvarendrasamharinakhashuktivirajita
    || 12|| nakhamandalasabhinnahemapingalavigraha | namo'stu padmanabhaya shobhanaya jagadguro | kalpantambhodanirghosha
    suryakotisamaprabha || 13|| sahasrayamasamtrasa sahasrendraparakrama | hasastradhanadasphita sahasracaranatmaka
    || 14|| sahasracandapratima
  devanagari: नृसिंहस्तोत्रम् गरुडपुराणान्तर्गतम् सूत उवाच । नारसिंहस्तुतिं वक्ष्ये शिवोक्तं शौनकाधुना
    । पूर्वं मातृगणाः सर्वे शङ्करं वाक्यमब्रुवन् ॥ १॥ भगवन्भक्षयिष्यामः सदेवासुरमानुषम् । त्वत्प्रसादाज्जगत्सर्वं
    तदनुज्ञातुमर्हसि ॥ २॥ शङ्करौवाच । भवतीभिः प्रजाः सर्वा रक्षणीया न संशयः । तस्माड्वोरतरप्रायं मनः शीघ्रं
    निवर्त्यताम् ॥ ३॥ इत्येवं शङ्करेणोक्तमनादृत्य तु तद्वचः । भक्षयामासुरव्यग्रास्त्रैलोक्यं सचराचरम्
    ॥ ४॥ त्रैलोक्ये भक्ष्यमाणे तु तदा मातृगणेन वै । नृसिंहरूपिणं देवं प्रदध्यौ भगवाञ्छिवः ॥ ५॥ अनादिनिधनं
    देवं सर्वभूतभवोद्भवम् । विद्युज्जिह्वं महादंष्ट्रं स्फुरत्केसरमालिनम् ॥ ६॥ रत्नाङ्गदं समुकुटं हेमकेसरभूषितम्
    । खोणिसूत्रेण महता काञ्चनेन विराजितम् ॥ ७॥ नीलोत्पलदलश्यामं रत्ननूपुरभूषितम् । तेजसाक्रान्तसकलब्रह्माण्डोदरमण्डपम्
    ॥ ८॥ आवर्तसदृशाकारैः संयुक्तं देहरोमभिः । सर्वपुष्पैर्योजिताञ्च धारयंश्च महास्त्रजम् ॥ ९॥ स ध्यातमात्रो
    भगवान्प्रददौ तस्य दर्शनम् । यादृशेन रूपेण ध्यातो रुद्रैस्तु भक्तितः ॥ १०॥ तादृशेनैव रूपेण दुर्निरीक्ष्येण
    दैवतैः । प्रणिपत्य तु देवेशं तदा तुष्टाव शङ्करः ॥ ११॥ शङ्कर उवाच । नमस्तेऽस्त जगन्नाथ नरसिंहवपुर्धर
    । दैत्येश्वरेन्द्रसंहारिनखशुक्तिविराजित ॥ १२॥ नखमण्डलसभिन्नहेमपिङ्गलविग्रह । नमोऽस्तु पद्मनाभाय शोभनाय
    जगद्गुरो । कल्पान्ताम्भोदनिर्घोष सूर्यकोटिसमप्रभ ॥ १३॥ सहस्रयमसंत्रास सहस्रेन्द्रपराक्रम । हसस्त्रधनदस्फीत
    सहस्रचरणात्मक ॥ १४॥ सहस्रचन्दप्रतिम
