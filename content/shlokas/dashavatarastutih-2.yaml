id: dashavatarastutih-2
category: stotram
name:
  english: dashavatarastutih 2
  devanagari: दशावतारस्तुतिः २
content:
  english: nayushman yasya bhaktya prabhavati purushah svargamarge'pavarge | matsyah kurmo varahah purushaharivapurvamano
    jamadagnyah kakutsthah kamsahanta sa ca sugatamunih karkinama ca vishnuh || 2|| adi matsyah sa jayatad
    yah shvasocchravasitairjalaih | gagane vidadhe'mbhodhim gaganam ca mahodadhau || 3|| tam namaskurmahe
    kurmam yah kavatamasankatam | atitasarvabrahmandamavasheshamivavahat || 4|| varaham naumi sananta
    yenotkshipta kshitih param | adhodhritardhacchatreva talastharkatapasaha || 5|| jayaya nriharirvo'stu
    daityorah shonitarnave | haramauktikagarbhastashceruryannakhashuktayah || 6|| trivikramo'stu bhutyai
    vah prag laghvi madhyama tatah | yasya pashcadanantabhut satsangatirivakritih || 7|| abhagnam jamadagnyo
    vah prayacchatu jayodayam | yatkutharakathoragnau bhupalaih shalabhayitam || 8|| naumi ramam riposhcakre
    yah kancananibhaih sharaih | homanalashikharudhamiva vaktravanam punah || 9|| shaurirjayati kamsasya
    jivitaprathamatithih | yashcakre cakradanena banabahupratigraham || 10|| yasya sabhrubhramakampa mararamah
    sasainikah | cakrurna ragam na dvesham sa shantyai sugato'stu vah || 11|| svacchandaprocchalanmlecchatimirodbhedasacchavih
    | karkivishnuh prakashaya prabhatarka ivastu vah || 12|| avatarakathayuktya bhaktya bhagavato hareh
    | shrivyasadasah kshemendrah kurute sarasam stutim || 13|| iti mahakavishrikshemendraviracite dashavataracarite
    dashavatarastutih samapta ||
  devanagari: नायुष्मान् यस्य भक्त्या प्रभवति पुरुषः स्वर्गमार्गेऽपवर्गे । मत्स्यः कूर्मो वराहः पुरुषहरिवपुर्वामनो
    जामदग्न्यः काकुत्स्थः कंसहन्ता स च सुगतमुनिः कर्किनामा च विष्णुः ॥ २॥ आदि मत्स्यः स जयताद् यः श्वासोच्छ्रवासितैर्जलैः
    । गगने विदधेऽम्भोधिं गगनं च महोदधौ ॥ ३॥ तं नमस्कुर्महे कूर्मं यः कवाटमसङ्कटम् । अतीतसर्वब्रह्माण्डमवशेषमिवावहत्
    ॥ ४॥ वराहं नौमि सानन्ता येनोत्क्षिप्ता क्षितिः परम् । अधोधृतार्धच्छत्रेव तलस्थार्कातपासहा ॥ ५॥ जयाय
    नृहरिर्वोऽस्तु दैत्योरः शोणितार्णवे । हारमौक्तिकगर्भास्ताश्चेरुर्यन्नखशुक्तयः ॥ ६॥ त्रिविक्रमोऽस्तु
    भूत्यै वः प्राग् लघ्वी मध्यमा ततः । यस्य पश्चादनन्ताभूत् सत्सङ्गतिरिवाकृतिः ॥ ७॥ अभग्नं जामदग्न्यो
    वः प्रयच्छतु जयोदयम् । यत्कुठारकठोराग्नौ भूपालैः शलभायितम् ॥ ८॥ नौमि रामं रिपोश्चक्रे यः काञ्चननिभैः
    शरैः । होमानलशिखारूढमिव वक्त्रवनं पुनः ॥ ९॥ शौरिर्जयति कंसस्य जीवितप्रथमातिथिः । यश्चक्रे चक्रदानेन
    बाणबाहुप्रतिग्रहम् ॥ १०॥ यस्य सभ्रूभ्रमाकम्पा माररामाः ससैनिकाः । चक्रुर्न रागं न द्वेषं स शान्त्यै
    सुगतोऽस्तु वः ॥ ११॥ स्वच्छन्दप्रोच्छलन्म्लेच्छतिमिरोद्भेदसच्छविः । कर्किविष्णुः प्रकाशाय प्रभातार्क
    इवास्तु वः ॥ १२॥ अवतारकथायुक्त्या भक्त्या भगवतो हरेः । श्रीव्यासदासः क्षेमेन्द्रः कुरुते सरसां स्तुतिम्
    ॥ १३॥ इति महाकविश्रीक्षेमेन्द्रविरचिते दशावतारचरिते दशावतारस्तुतिः समाप्ता ॥
