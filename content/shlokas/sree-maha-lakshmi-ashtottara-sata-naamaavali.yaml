    om adityai namah om dityai namah om diptayai namah om vasudhayai namah om vasudharinyai namah om kamalayai
    namah om kantayai namah om kamakshyai namah om kshirodasambhavayai namah om anugrahaparayai namah
    om buddhaye namah om anaghayai namah om harivallabhayai namah om ashokayai namah om amritayai namah
    om diptayai namah om lokashoka vinashinyai namah om dharmanilayayai namah om karunayai namah om lokamatre
    namah om padmapriyayai namah om padmahastayai namah om padmakshyai namah om padmasundaryai namah om
    padmodbhavayai namah om padmamukhyai namah om padmanabhapriyayai namah om ramayai namah om padmamaladharayai
