    यह कल्यान अब संसय तजहु गिरीस ॥ ॥ कहि अस ब्रह्मभवन मुनि गयू। आगिल चरित सुनहु जस भयू ॥ पतिहि एकान्त
    पाइ कह मैना। नाथ न मैं समुझे मुनि बैना ॥ जौं घरु बरु कुलु होइ अनूपा। करिअ बिबाहु सुता अनुरुपा ॥ न
    त कन्या बरु रहु कुआरी। कन्त उमा मम प्रानपिआरी ॥ जौं न मिलहि बरु गिरिजहि जोगू। गिरि जड़ सहज कहिहि सबु
    लोगू ॥ सोइ बिचारि पति करेहु बिबाहू। जेहिं न बहोरि होइ उर दाहू ॥ अस कहि परि चरन धरि सीसा। बोले सहित
