  devanagari: ॥ श्री गणेशाय नमः ॥ श्रीजानकीवल्लभो विजयते श्री रामचरित मानस प्रथम सोपान वर्णानामर्थसङ्घानां
    रसानां छन्दसामपि। मङ्गलानां च कर्त्तारौ वन्दे वाणीविनायकौ ॥ ॥ भवानीशङ्करौ वन्दे श्रद्धाविश्वासरूपिणौ।
    याभ्यां विना न पश्यन्ति सिद्धाःस्वान्तःस्थमीश्वरम् ॥ ॥ वन्दे बोधमयं नित्यं गुरुं शङ्कररूपिणम्। यमाश्रितो
    हि वक्रोऽपि चन्द्रः सर्वत्र वन्द्यते ॥ ॥ सीतारामगुणग्रामपुण्यारण्यविहारिणौ। वन्दे विशुद्धविज्ञानौ
    कबीश्वरकपीश्वरौ ॥ ॥ उद्भवस्थितिसंहारकारिणीं क्लेशहारिणीम्। सर्वश्रेयस्करीं सीतां नतोऽहं रामवल्लभाम्
    ॥ ॥ यन्मायावशवर्तिं विश्वमखिलं ब्रह्मादिदेवासुरा यत्सत्वादमृषैव भाति सकलं रज्जौ यथाहेर्भ्रमः। यत्पादप्लवमेकमेव
    हि भवाम्भोधेस्तितीर्षावतां वन्देऽहं तमशेषकारणपरं रामाख्यमीशं हरिम् ॥ ॥ नानापुराणनिगमागमसम्मतं यद्
    रामायणे निगदितं क्वचिदन्यतोऽपि। स्वान्तःसुखाय तुलसी रघुनाथगाथा भाषानिबन्धमतिमञ्जुलमातनोति ॥ जो सुमिरत
    सिधि होइ गन नायक करिबर बदन। करु अनुग्रह सोइ बुद्धि रासि सुभ गुन सदन ॥ ॥ मूक होइ बाचाल पङ्गु चढि गिरिबर
    गहन। जासु कृपाँ सो दयाल द्रवु सकल कलि मल दहन ॥ ॥ नील सरोरुह स्याम तरुन अरुन बारिज नयन। करु सो मम उर
    धाम सदा छीरसागर सयन ॥ ॥ कुन्द इन्दु सम देह उमा रमन करुना अयन। जाहि दीन पर नेह करु कृपा मर्दन मयन ॥
    ॥ बन्दु गुरु पद कञ्ज कृपा सिन्धु नररूप हरि। महामोह तम पुञ्ज जासु बचन रबि कर निकर ॥ ॥ बन्दु गुरु पद
    पदुम परागा। सुरुचि सुबास सरस अनुरागा ॥ अमिय मूरिमय चूरन चारू। समन सकल भव रुज परिवारू ॥ सुकृति सम्भु
    तन बिमल बिभूती। मञ्जुल मङ्गल मोद प्रसूती ॥ जन मन मञ्जु मुकुर मल हरनी। किएँ तिलक गुन गन बस करनी ॥ श्रीगुर
    पद नख मनि गन जोती। सुमिरत दिब्य द्रृष्टि हियँ होती ॥ दलन मोह तम सो सप्रकासू। बड़ए भाग उर आवि जासू
    ॥ उघरहिं बिमल बिलोचन ही के। मिटहिं दोष दुख भव रजनी के ॥ सूझहिं राम चरित मनि मानिक। गुपुत प्रगट जहँ
    जो जेहि खानिक ॥ दो जथा सुअञ्जन अञ्जि दृग साधक सिद्ध सुजान। कौतुक देखत सैल बन भूतल भूरि निधान ॥ ॥ गुरु
    पद रज मृदु मञ्जुल अञ्जन। नयन अमिअ दृग दोष बिभञ्जन ॥ तेहिं करि बिमल बिबेक बिलोचन। बरनुँ राम चरित भव
    मोचन ॥ बन्दुँ प्रथम महीसुर चरना। मोह जनित संसय सब हरना ॥ सुजन समाज सकल गुन खानी। करुँ प्रनाम सप्रेम
    सुबानी ॥ साधु चरित सुभ चरित कपासू। निरस बिसद गुनमय फल जासू ॥ जो सहि दुख परछिद्र दुरावा। बन्दनीय जेहिं
    जग जस पावा ॥ मुद मङ्गलमय सन्त समाजू। जो जग जङ्गम तीरथराजू ॥ राम भक्ति जहँ सुरसरि धारा। सरसि ब्रह्म
    बिचार प्रचारा ॥ बिधि निषेधमय कलि मल हरनी। करम कथा रबिनन्दनि बरनी ॥ हरि हर कथा बिराजति बेनी। सुनत सकल
    मुद मङ्गल देनी ॥ बटु बिस्वास अचल निज धरमा। तीरथराज समाज सुकरमा ॥ सबहिं सुलभ सब दिन सब देसा। सेवत सादर
    समन कलेसा ॥ अकथ अलौकिक तीरथर् । देइ सद्य फल प्रगट प्रभ् सुनि समुझहिं जन मुदित मन मज्जहिं अति अनुराग।
    लहहिं चारि फल अछत तनु साधु समाज प्रयाग ॥ ॥ मज्जन फल पेखिअ ततकाला। काक होहिं पिक बकु मराला ॥ सुनि आचरज
    करै जनि कोई। सतसङ्गति महिमा नहिं गोई ॥ बालमीक नारद घटजोनी। निज निज मुखनि कही निज होनी ॥ जलचर थलचर
    नभचर नाना। जे जड़ चेतन जीव जहाना ॥ मति कीरति गति भूति भलाई। जब जेहिं जतन जहाँ जेहिं पाई ॥ सो जानब
    सतसङ्ग प्रभ् । लोकहुँ बेद न आन उप् ॥ बिनु सतसङ्ग बिबेक न होई। राम कृपा बिनु सुलभ न सोई ॥ सतसङ्गत मुद
    मङ्गल मूला। सोइ फल सिधि सब साधन फूला ॥ सठ सुधरहिं सतसङ्गति पाई। पारस परस कुधात सुहाई ॥ बिधि बस सुजन
    कुसङ्गत परहीं। फनि मनि सम निज गुन अनुसरहीम् ॥ बिधि हरि हर कबि कोबिद बानी। कहत साधु महिमा सकुचानी ॥
    सो मो सन कहि जात न कैसें। साक बनिक मनि गुन गन जैसेम् ॥ दो बन्दुँ सन्त समान चित हित अनहित नहिं कोइ।
    अञ्जलि गत सुभ सुमन जिमि सम सुगन्ध कर दोइ ॥ ॥ सन्त सरल चित जगत हित जानि सुभाउ सनेहु। बालबिनय सुनि करि
    कृपा राम चरन रति देहु ॥ ॥ बहुरि बन्दि खल गन सतिभाएँ। जे बिनु काज दाहिनेहु बाएँ ॥ पर हित हानि लाभ जिन्ह
    केरें। उजरें हरष बिषाद बसेरेम् ॥ हरि हर जस राकेस राहु से। पर अकाज भट सहसबाहु से ॥ जे पर दोष लखहिं
    सहसाखी। पर हित घृत जिन्ह के मन माखी ॥ तेज कृसानु रोष महिषेसा। अघ अवगुन धन धनी धनेसा ॥ उदय केत सम हित
    सबही के। कुम्भकरन सम सोवत नीके ॥ पर अकाजु लगि तनु परिहरहीं। जिमि हिम उपल कृषी दलि गरहीम् ॥ बन्दुँ
    खल जस सेष सरोषा। सहस बदन बरनि पर दोषा ॥ पुनि प्रनवुँ पृथुराज समाना। पर अघ सुनि सहस दस काना ॥ बहुरि
    सक्र सम बिनवुँ तेही। सन्तत सुरानीक हित जेही ॥ बचन बज्र जेहि सदा पिआरा। सहस नयन पर दोष निहारा ॥ दो
    उदासीन अरि मीत हित सुनत जरहिं खल रीति। जानि पानि जुग जोरि जन बिनती करि सप्रीति ॥ ॥ मैं अपनी दिसि कीन्ह
    निहोरा। तिन्ह निज ओर न लाउब भोरा ॥ बायस पलिअहिं अति अनुरागा। होहिं निरामिष कबहुँ कि कागा ॥ बन्दुँ
    सन्त असज्जन चरना। दुखप्रद उभय बीच कछु बरना ॥ बिछुरत एक प्रान हरि लेहीं। मिलत एक दुख दारुन देहीम् ॥
    उपजहिं एक सङ्ग जग माहीं। जलज जोङ्क जिमि गुन बिलगाहीम् ॥ सुधा सुरा सम साधू असाधू। जनक एक जग जलधि अगाधू
    ॥ भल अनभल निज निज करतूती। लहत सुजस अपलोक बिभूती ॥ सुधा सुधाकर सुरसरि साधू। गरल अनल कलिमल सरि ब्याधू
    ॥ गुन अवगुन जानत सब कोई। जो जेहि भाव नीक तेहि सोई ॥ दो भलो भलाइहि पै लहि लहि निचाइहि नीचु। सुधा सराहिअ
    अमरताँ गरल सराहिअ मीचु ॥ ॥ खल अघ अगुन साधू गुन गाहा। उभय अपार उदधि अवगाहा ॥ तेहि तें कछु गुन दोष बखाने।
    सङ्ग्रह त्याग न बिनु पहिचाने ॥ भलेउ पोच सब बिधि उपजाए। गनि गुन दोष बेद बिलगाए ॥ कहहिं बेद इतिहास पुराना।
    बिधि प्रपञ्चु गुन अवगुन साना ॥ दुख सुख पाप पुन्य दिन राती। साधु असाधु सुजाति कुजाती ॥ दानव देव ऊँच
    अरु नीचू। अमिअ सुजीवनु माहुरु मीचू ॥ माया ब्रह्म जीव जगदीसा। लच्छि अलच्छि रङ्क अवनीसा ॥ कासी मग सुरसरि
    क्रमनासा। मरु मारव महिदेव गवासा ॥ सरग नरक अनुराग बिरागा। निगमागम गुन दोष बिभागा ॥ दो जड़ चेतन गुन
    दोषमय बिस्व कीन्ह करतार। सन्त हंस गुन गहहिं पय परिहरि बारि बिकार ॥ ॥ अस बिबेक जब देइ बिधाता। तब तजि
    दोष गुनहिं मनु राता ॥ काल सुभाउ करम बरिआई। भलेउ प्रकृति बस चुकि भलाई ॥ सो सुधारि हरिजन जिमि लेहीं।
    दलि दुख दोष बिमल जसु देहीम् ॥ खलु करहिं भल पाइ सुसङ्गू। मिटि न मलिन सुभाउ अभङ्गू ॥ लखि सुबेष जग बञ्चक
    जेऊ। बेष प्रताप पूजिअहिं तेऊ ॥ उधरहिं अन्त न होइ निबाहू। कालनेमि जिमि रावन राहू ॥ किएहुँ कुबेष साधु
    सनमानू। जिमि जग जामवन्त हनुमानू ॥ हानि कुसङ्ग सुसङ्गति लाहू। लोकहुँ बेद बिदित सब काहू ॥ गगन चढ़इ रज
    पवन प्रसङ्गा। कीचहिं मिलि नीच जल सङ्गा ॥ साधु असाधु सदन सुक सारीं। सुमिरहिं राम देहिं गनि गारी ॥ धूम
    कुसङ्गति कारिख होई। लिखिअ पुरान मञ्जु मसि सोई ॥ सोइ जल अनल अनिल सङ्घाता। होइ जलद जग जीवन दाता ॥ दो
    ग्रह भेषज जल पवन पट पाइ कुजोग सुजोग। होहि कुबस्तु सुबस्तु जग लखहिं सुलच्छन लोग ॥ ॥ सम प्रकास तम पाख
    दुहुँ नाम भेद बिधि कीन्ह। ससि सोषक पोषक समुझि जग जस अपजस दीन्ह ॥ ॥ जड़ चेतन जग जीव जत सकल राममय जानि।
    बन्दुँ सब के पद कमल सदा जोरि जुग पानि ॥ ॥ देव दनुज नर नाग खग प्रेत पितर गन्धर्ब। बन्दुँ किन्नर रजनिचर
    कृपा करहु अब सर्ब ॥ ॥ आकर चारि लाख चौरासी। जाति जीव जल थल नभ बासी ॥ सीय राममय सब जग जानी। करुँ प्रनाम
    जोरि जुग पानी ॥ जानि कृपाकर किङ्कर मोहू। सब मिलि करहु छाड़इ छल छोहू ॥ निज बुधि बल भरोस मोहि नाहीं।
    तातें बिनय करुँ सब पाही ॥ करन चहुँ रघुपति गुन गाहा। लघु मति मोरि चरित अवगाहा ॥ सूझ न एकु अङ्ग उप्
    । मन मति रङ्क मनोरथ र् ॥ मति अति नीच ऊँचि रुचि आछी। चहिअ अमिअ जग जुरि न छाछी ॥ छमिहहिं सज्जन मोरि
    ढिठाई। सुनिहहिं बालबचन मन लाई ॥ जौ बालक कह तोतरि बाता। सुनहिं मुदित मन पितु अरु माता ॥ हँसिहहि कूर
    कुटिल कुबिचारी। जे पर दूषन भूषनधारी ॥ निज कवित केहि लाग न नीका। सरस हौ अथवा अति फीका ॥ जे पर भनिति
    सुनत हरषाही। ते बर पुरुष बहुत जग नाहीम् ॥ जग बहु नर सर सरि सम भाई। जे निज बाढ़इ बढ़हिं जल पाई ॥ सज्जन
    सकृत सिन्धु सम कोई। देखि पूर बिधु बाढ़इ जोई ॥ दो भाग छोट अभिलाषु बड़ करुँ एक बिस्वास। पैहहिं सुख सुनि
    सुजन सब खल करहहिं उपहास ॥ ॥ खल परिहास होइ हित मोरा। काक कहहिं कलकण्ठ कठोरा ॥ हंसहि बक दादुर चातकही।
    हँसहिं मलिन खल बिमल बतकही ॥ कबित रसिक न राम पद नेहू। तिन्ह कहँ सुखद हास रस एहू ॥ भाषा भनिति भोरि मति
    मोरी। हँसिबे जोग हँसें नहिं खोरी ॥ प्रभु पद प्रीति न सामुझि नीकी। तिन्हहि कथा सुनि लागहि फीकी ॥ हरि
    हर पद रति मति न कुतरकी। तिन्ह कहुँ मधुर कथा रघुवर की ॥ राम भगति भूषित जियँ जानी। सुनिहहिं सुजन सराहि
    सुबानी ॥ कबि न हौँ नहिं बचन प्रबीनू। सकल कला सब बिद्या हीनू ॥ आखर अरथ अलङ्कृति नाना। छन्द प्रबन्ध
    अनेक बिधाना ॥ भाव भेद रस भेद अपारा। कबित दोष गुन बिबिध प्रकारा ॥ कबित बिबेक एक नहिं मोरें। सत्य कहुँ
    लिखि कागद कोरे ॥ दो भनिति मोरि सब गुन रहित बिस्व बिदित गुन एक। सो बिचारि सुनिहहिं सुमति जिन्ह कें
    बिमल बिवेक ॥ ॥ एहि महँ रघुपति नाम उदारा। अति पावन पुरान श्रुति सारा ॥ मङ्गल भवन अमङ्गल हारी। उमा सहित
    जेहि जपत पुरारी ॥ भनिति बिचित्र सुकबि कृत जोऊ। राम नाम बिनु सोह न सोऊ ॥ बिधुबदनी सब भाँति सँवारी।
    सोन न बसन बिना बर नारी ॥ सब गुन रहित कुकबि कृत बानी। राम नाम जस अङ्कित जानी ॥ सादर कहहिं सुनहिं बुध
    ताही। मधुकर सरिस सन्त गुनग्राही ॥ जदपि कबित रस एकु नाही। राम प्रताप प्रकट एहि माहीम् ॥ सोइ भरोस मोरें
    मन आवा। केहिं न सुसङ्ग बडप्पनु पावा ॥ धूमु तजि सहज करुआई। अगरु प्रसङ्ग सुगन्ध बसाई ॥ भनिति भदेस बस्तु
    भलि बरनी। राम कथा जग मङ्गल करनी ॥ छं मङ्गल करनि कलि मल हरनि तुलसी कथा रघुनाथ की ॥ गति कूर कबिता सरित
    की ज्यों सरित पावन पाथ की ॥ प्रभु सुजस सङ्गति भनिति भलि होइहि सुजन मन भावनी ॥ भव अङ्ग भूति मसान की
    सुमिरत सुहावनि पावनी ॥ दो प्रिय लागिहि अति सबहि मम भनिति राम जस सङ्ग। दारु बिचारु कि करि कौ बन्दिअ
    मलय प्रसङ्ग ॥ ॥ स्याम सुरभि पय बिसद अति गुनद करहिं सब पान। गिरा ग्राम्य सिय राम जस गावहिं सुनहिं सुजान
    ॥ ॥ मनि मानिक मुकुता छबि जैसी। अहि गिरि गज सिर सोह न तैसी ॥ नृप किरीट तरुनी तनु पाई। लहहिं सकल सोभा
    अधिकाई ॥ तैसेहिं सुकबि कबित बुध कहहीं। उपजहिं अनत अनत छबि लहहीम् ॥ भगति हेतु बिधि भवन बिहाई। सुमिरत
    सारद आवति धाई ॥ राम चरित सर बिनु अन्हवाएँ। सो श्रम जाइ न कोटि उपाएँ ॥ कबि कोबिद अस हृदयँ बिचारी। गावहिं
    हरि जस कलि मल हारी ॥ कीन्हें प्राकृत जन गुन गाना। सिर धुनि गिरा लगत पछिताना ॥ हृदय सिन्धु मति सीप
    समाना। स्वाति सारदा कहहिं सुजाना ॥ जौं बरषि बर बारि बिचारू। होहिं कबित मुकुतामनि चारू ॥ दो जुगुति
    बेधि पुनि पोहिअहिं रामचरित बर ताग। पहिरहिं सज्जन बिमल उर सोभा अति अनुराग ॥ ॥ जे जनमे कलिकाल कराला।
    करतब बायस बेष मराला ॥ चलत कुपन्थ बेद मग छाँड़ए। कपट कलेवर कलि मल भाँड़एम् ॥ बञ्चक भगत कहाइ राम के।
    किङ्कर कञ्चन कोह काम के ॥ तिन्ह महँ प्रथम रेख जग मोरी। धीङ्ग धरमध्वज धन्धक धोरी ॥ जौं अपने अवगुन सब
    कहूँ। बाढ़इ कथा पार नहिं लहूँ ॥ ताते मैं अति अलप बखाने। थोरे महुँ जानिहहिं सयाने ॥ समुझि बिबिधि बिधि
    बिनती मोरी। कौ न कथा सुनि देइहि खोरी ॥ एतेहु पर करिहहिं जे असङ्का। मोहि ते अधिक ते जड़ मति रङ्का ॥
    कबि न हौँ नहिं चतुर कहावुँ। मति अनुरूप राम गुन गावुँ ॥ कहँ रघुपति के चरित अपारा। कहँ मति मोरि निरत
    संसारा ॥ जेहिं मारुत गिरि मेरु उड़आहीं। कहहु तूल केहि लेखे माहीम् ॥ समुझत अमित राम प्रभुताई। करत कथा
    मन अति कदराई ॥ दो सारद सेस महेस बिधि आगम निगम पुरान। नेति नेति कहि जासु गुन करहिं निरन्तर गान ॥ ॥
    सब जानत प्रभु प्रभुता सोई। तदपि कहें बिनु रहा न कोई ॥ तहाँ बेद अस कारन राखा। भजन प्रभाउ भाँति बहु
    भाषा ॥ एक अनीह अरूप अनामा। अज सच्चिदानन्द पर धामा ॥ ब्यापक बिस्वरूप भगवाना। तेहिं धरि देह चरित कृत
    नाना ॥ सो केवल भगतन हित लागी। परम कृपाल प्रनत अनुरागी ॥ जेहि जन पर ममता अति छोहू। जेहिं करुना करि
    कीन्ह न कोहू ॥ गी बहोर गरीब नेवाजू। सरल सबल साहिब रघुराजू ॥ बुध बरनहिं हरि जस अस जानी। करहि पुनीत
    सुफल निज बानी ॥ तेहिं बल मैं रघुपति गुन गाथा। कहिहुँ नाइ राम पद माथा ॥ मुनिन्ह प्रथम हरि कीरति गाई।
    तेहिं मग चलत सुगम मोहि भाई ॥ दो अति अपार जे सरित बर जौं नृप सेतु कराहिं। चढि पिपीलिकु परम लघु बिनु
    श्रम पारहि जाहिम् ॥ ॥ एहि प्रकार बल मनहि देखाई। करिहुँ रघुपति कथा सुहाई ॥ ब्यास आदि कबि पुङ्गव नाना।
    जिन्ह सादर हरि सुजस बखाना ॥ चरन कमल बन्दुँ तिन्ह केरे। पुरवहुँ सकल मनोरथ मेरे ॥ कलि के कबिन्ह करुँ
    परनामा। जिन्ह बरने रघुपति गुन ग्रामा ॥ जे प्राकृत कबि परम सयाने। भाषाँ जिन्ह हरि चरित बखाने ॥ भे जे
    अहहिं जे होइहहिं आगें। प्रनवुँ सबहिं कपट सब त्यागेम् ॥ होहु प्रसन्न देहु बरदानू। साधु समाज भनिति सनमानू
    ॥ जो प्रबन्ध बुध नहिं आदरहीं। सो श्रम बादि बाल कबि करहीम् ॥ कीरति भनिति भूति भलि सोई। सुरसरि सम सब
    कहँ हित होई ॥ राम सुकीरति भनिति भदेसा। असमञ्जस अस मोहि अँदेसा ॥ तुम्हरी कृपा सुलभ सौ मोरे। सिअनि सुहावनि
    टाट पटोरे ॥ दो सरल कबित कीरति बिमल सोइ आदरहिं सुजान। सहज बयर बिसराइ रिपु जो सुनि करहिं बखान ॥ ॥ सो
    न होइ बिनु बिमल मति मोहि मति बल अति थोर। करहु कृपा हरि जस कहुँ पुनि पुनि करुँ निहोर ॥ ॥ कबि कोबिद
    रघुबर चरित मानस मञ्जु मराल। बाल बिनय सुनि सुरुचि लखि मोपर होहु कृपाल ॥ बन्दुँ मुनि पद कञ्जु रामायन
    जेहिं निरमयु। सखर सुकोमल मञ्जु दोष रहित दूषन सहित ॥ ॥ बन्दुँ चारिउ बेद भव बारिधि बोहित सरिस। जिन्हहि
    न सपनेहुँ खेद बरनत रघुबर बिसद जसु ॥ ॥ बन्दुँ बिधि पद रेनु भव सागर जेहि कीन्ह जहँ। सन्त सुधा ससि धेनु
    प्रगटे खल बिष बारुनी ॥ बिबुध बिप्र बुध ग्रह चरन बन्दि कहुँ कर जोरि। होइ प्रसन्न पुरवहु सकल मञ्जु मनोरथ
    मोरि ॥ ॥ पुनि बन्दुँ सारद सुरसरिता। जुगल पुनीत मनोहर चरिता ॥ मज्जन पान पाप हर एका। कहत सुनत एक हर
    अबिबेका ॥ गुर पितु मातु महेस भवानी। प्रनवुँ दीनबन्धु दिन दानी ॥ सेवक स्वामि सखा सिय पी के। हित निरुपधि
    सब बिधि तुलसीके ॥ कलि बिलोकि जग हित हर गिरिजा। साबर मन्त्र जाल जिन्ह सिरिजा ॥ अनमिल आखर अरथ न जापू।
    प्रगट प्रभाउ महेस प्रतापू ॥ सो उमेस मोहि पर अनुकूला। करिहिं कथा मुद मङ्गल मूला ॥ सुमिरि सिवा सिव पाइ
    पस् । बरनुँ रामचरित चित च् ॥ भनिति मोरि सिव कृपाँ बिभाती। ससि समाज मिलि मनहुँ सुराती ॥ जे एहि कथहि
    सनेह समेता। कहिहहिं सुनिहहिं समुझि सचेता ॥ होइहहिं राम चरन अनुरागी। कलि मल रहित सुमङ्गल भागी ॥ दो
    सपनेहुँ साचेहुँ मोहि पर जौं हर गौरि पसाउ। तौ फुर हौ जो कहेउँ सब भाषा भनिति प्रभाउ ॥ ॥ बन्दुँ अवध पुरी
    अति पावनि। सरजू सरि कलि कलुष नसावनि ॥ प्रनवुँ पुर नर नारि बहोरी। ममता जिन्ह पर प्रभुहि न थोरी ॥ सिय
    निन्दक अघ ओघ नसाए। लोक बिसोक बनाइ बसाए ॥ बन्दुँ कौसल्या दिसि प्राची। कीरति जासु सकल जग माची ॥ प्रगटेउ
    जहँ रघुपति ससि चारू। बिस्व सुखद खल कमल तुसारू ॥ दसरथ राउ सहित सब रानी। सुकृत सुमङ्गल मूरति मानी ॥
    करुँ प्रनाम करम मन बानी। करहु कृपा सुत सेवक जानी ॥ जिन्हहि बिरचि बड़ भयु बिधाता। महिमा अवधि राम पितु
    माता ॥ सो बन्दुँ अवध भुआल सत्य प्रेम जेहि राम पद। बिछुरत दीनदयाल प्रिय तनु तृन इव परिहरेउ ॥ ॥ प्रनवुँ
    परिजन सहित बिदेहू। जाहि राम पद गूढ़ सनेहू ॥ जोग भोग महँ राखेउ गोई। राम बिलोकत प्रगटेउ सोई ॥ प्रनवुँ
    प्रथम भरत के चरना। जासु नेम ब्रत जाइ न बरना ॥ राम चरन पङ्कज मन जासू। लुबुध मधुप इव तजि न पासू ॥ बन्दुँ
    लछिमन पद जलजाता। सीतल सुभग भगत सुख दाता ॥ रघुपति कीरति बिमल पताका। दण्ड समान भयु जस जाका ॥ सेष सहस्रसीस
    जग कारन। जो अवतरेउ भूमि भय टारन ॥ सदा सो सानुकूल रह मो पर। कृपासिन्धु सौमित्रि गुनाकर ॥ रिपुसूदन पद
    कमल नमामी। सूर सुसील भरत अनुगामी ॥ महावीर बिनवुँ हनुमाना। राम जासु जस आप बखाना ॥ सो प्रनवुँ पवनकुमार
    खल बन पावक ग्यानधन। जासु हृदय आगार बसहिं राम सर चाप धर ॥ ॥ कपिपति रीछ निसाचर राजा। अङ्गदादि जे कीस
    समाजा ॥ बन्दुँ सब के चरन सुहाए। अधम सरीर राम जिन्ह पाए ॥ रघुपति चरन उपासक जेते। खग मृग सुर नर असुर
    समेते ॥ बन्दुँ पद सरोज सब केरे। जे बिनु काम राम के चेरे ॥ सुक सनकादि भगत मुनि नारद। जे मुनिबर बिग्यान
    बिसारद ॥ प्रनवुँ सबहिं धरनि धरि सीसा। करहु कृपा जन जानि मुनीसा ॥ जनकसुता जग जननि जानकी। अतिसय प्रिय
    करुना निधान की ॥ ताके जुग पद कमल मनावुँ। जासु कृपाँ निरमल मति पावुँ ॥ पुनि मन बचन कर्म रघुनायक। चरन
    कमल बन्दुँ सब लायक ॥ राजिवनयन धरें धनु सायक। भगत बिपति भञ्जन सुख दायक ॥ दो गिरा अरथ जल बीचि सम कहिअत
    भिन्न न भिन्न। बदुँ सीता राम पद जिन्हहि परम प्रिय खिन्न ॥ ॥ बन्दुँ नाम राम रघुवर को। हेतु कृसानु भानु
    हिमकर को ॥ बिधि हरि हरमय बेद प्रान सो। अगुन अनूपम गुन निधान सो ॥ महामन्त्र जोइ जपत महेसू। कासीं मुकुति
    हेतु उपदेसू ॥ महिमा जासु जान गनराउ। प्रथम पूजिअत नाम प्रभ् ॥ जान आदिकबि नाम प्रतापू। भयु सुद्ध करि
