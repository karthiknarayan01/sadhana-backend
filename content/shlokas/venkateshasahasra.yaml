id: venkateshasahasra
category: stotram
name:
  english: venkateshasahasra
  devanagari: वेन्कतेशसहस्र
content:
  english: bhasvacchamdramasau yadiyanayane bharya yadiya rama yasmadvishvasridapyabhudyamikulam yaddhyanayuktam
    sada natho yo jagatam nagendraduhiturnatho'pi yadbhaktiman tato yo madanasya yo duritaha tam venkatesham
    bhaje || urdhvai hastau yadiyau suraripudaḻane bibhratau shankhacakre sevyavanghri svakiyavabhidadhadadharo
    dakshino yasya panih | tavanmatram bhavabdhim gamayati bhajatamurugo vamapanih shrivatsankashca lakshmiryadurasi
    lasatastam bhaje venkatesham || iti dhyayan venkatesham shrivatsankam ramapatim | venkatesho virupaksha
    ityarabhya japetkramat || 10|| om venkatesho virupaksho vishvesho vishvabhavanah | vishvasrin vishvasamharta
    vishvaprano viradvapuh || 11|| sheshadrinilayo'sheshabhaktaduhkhapranashanah | sheshastutyah sheshashayi
    visheshajno vibhuh svabhuh || 12|| vishnurjishnushca vardhishnurutsavishnuh sahishnukah | bhrajishnushca
    grasishnushca vartishnushca bharishnukah || 13|| kalayanta kalagopta kalah kalantako'khilah | kalagamyah
    kalakanthavandyah kalakaleshvarah || 14|| shambhuh svayambhurambhojanabhistambhitavaridhih | ambhodhinandinijanih
    shonambhojapadaprabhah || 15|| kambugrivah shambararirupah shambarajekshanah | bimbadharo bimbarupi
    pratibimbakriyatigah || 16|| gunavan gunagamyashca gunatito gunapriyah durgunadhvamsakritsarvasuguno
    gunabhasakah || 17|| pareshah paramatma ca paranjyotih para gatih | param padam viyadvasah paramparyashubhapradah
    || 18|| brahmandagarbho brahmanyo brahmasridhbrahmabodhitah | brahmastutyo brahmavadi brahmacaryaparayanah
    || 19|| satyavratarthasantushtassatyarupi jhashangavan | somakapranahari canitamnayo'bdhisancarah
    || 20|| devasuravarastutyah patanmandaradharakah | dhanvantarih kacchapangah payonidhivimanthakah
    || 21|| amaramritasandhata dhritasammohinivapuh | haramohakamayavi rakshahsandohabhanjanah || 22||
    hiranyakshavidari ca yajno yajna vibhavanah | yajniyorvisaguddharta lilakrodah pratapavan || 23||
    dandakasuravidhvamsi vakradamshtra kshamadharah | gandharvashapaharanah punyagandho vicakshanah ||
    24|| karalavaktrah somarkanetrah shadgunavaibhavah | shvetaghoni ghurnitabhrurghurghuradhvanivibhramah
    || 25|| draghiyan nilakeshi ca jagradambujalocanah | ghrinavan ghrinisammoho mahakalagnididhitih ||
    26|| jvalakaralavadano maholkakulavikshanah | satanirbhinnameghaugho damshtrarugvyaptadiktatah ||
    27|| ucchvasakrishtabhutesho nihshvasatyaktavishvasrit | antarbhramajjagadgarbho'nanto brahmakapalahrit
    || 28|| ugro viro mahavishnurjvalanah sarvatomukhah | nrisimho bhishano bhadro mrityumrityuh sanatanah
    || 29|| sabhastambhodbhavo bhimah shiromali maheshvarah | dvadashadityacudalah kalpadhumasatacchavih
    || 30|| hiranyakorasthalabhinnanakhah simhamukho'naghah | prahladavarado dhiman bhaktasangha pratishthitah
    || 31|| brahmarudradisamsevyah siddhasadhyaprapujitah | lakshminrisimho devesho jvalajihvantramalikah
    || 32|| khadgi kheti maheshvasi kapali musali hali | pashi shuli mahabahurjvaraghno rogalunthakah
    || 33|| maunjiyuk chatrako dandi krishnajinadharo vatuh | adhitavedo vedantoddharako brahmanaishthikah
    || 34|| ahinashayanapritah aditeyo'nagho harih | samvitpriyassamavedyo baliveshmapratishthitah ||
    35|| balikshalitapadabjo vindyavalivimanitah | tripadabhumisvikarta vishvarupapradarshakah || 36||
    dhritatrivikramah sanghrinakhabhinnandakharparah | pajjatavahinidharapavitritajagattrayah || 37||
    vidhisammanitah punyo daityayoddha jayorjitah | surarajyapradah shukramadahrit sugatishvarah || 38||
    jamadagnyah kuthari ca kartaviryavidaranah | renukayashshirohari dushtakshatriyamardanah || 39|| varcasvi
    danashilashca dhanushman brahmavittamah | atyudagrah samagrashca nyagrodho dushtanigrahah || 40||
    ravivamshasamudbhuto raghavo bharatagrajah | kausalyatanayo ramo vishvamitra priyankarah ||41|| tatakarih
    subahughno balatibalamantravan | ahalyashapavicchedi pravishtajanakalayah || 42|| svayamvarasabhasamstha
    ishacapaprabhanjanah | janakiparineta ca janakadhishasamstutah || 43|| jamadagnitanujatayoddha'yodhyadhipagranih
    | pitrivakyapratipalastyaktarajyah salakshmanah || 44|| sasitashcitrakutastho bharatahitarajyakah
    | kakadarpapraharta ca dandakaranyavasakah || 45|| pancavatyam vihari ca svadharmapariposhakah | viradhaha'gastyamukhyamunisammanitah
    || 46|| indracapadharah khadgadharashcakshayasayakah | kharantako dushanaristrishiraskaripurvrishah
    || 47|| tatah shurpanakhanasacchetta valkaladharakah | jatavan parnashalastho maricabalamardakah ||
    48|| pakshiratkritasamvado raviteja mahabalah | shabaryanitaphalabhugdhanumatparitoshitah || 49||
    sugrivabhayado daityakayakshepanabhasurah | saptatalasamucchetta valihritkapisamvritah || 50|| vayusunukritasevastyaktapampah
    kushasanah | udanvattiragah shuro vibhishanavarapradah || 51|| setukriddaityaha praptalanko'lankaravan
    svayam | atikayashirashchetta kumbhakarnavibhedanah || 52|| dashakanthashirodhvamsi jambavatpramukhavritah
    | janakishah suradhyakshah saketeshah puratanah || 53|| punyashloko vedavedyah svamitirthanivasakah
    | lakshmisarahkeḻilolo lakshmisho lokarakshakah || 54|| devakigarbhasambhuto yashodekshanalalitah
    | vasudevakritastotro nandagopamanoharah || 55|| caturbhujah komalango gadavannilakuntalah | putanapranasamharta
    trinavartavinashanah || 56|| gargaropitanamanko vasudevo hyadhokshajah | gopikastanyapayi ca balabhadranujo'cyutah
    || 57|| vaiyaghranakhabhushashca vatsajidvatsavardhanah | kshirasarashanarato dadhibhandapramardanah
    || 58 || navanitapaharta ca nilaniradabhasurah | abhiradrishtadaurjanyo nilapadmanibhananah || 59||
    matridarshitavishvasyah ulukhalanibandhanah | nalakubarashapanto godhulicchuritangakah || 60|| gosangharakshakah
    shrisho vrindaranyanivasakah | vatsantako bakadveshi daityambudamahanilah || 61 || mahajagaracandagnih
    shakatapranakantakah | indrasevyah punyagatrah kharajinvandadidhitih || 62|| talapakvaphalashi ca
    kaḻiyaphanidarpaha | nagapatnistutipritah pralambasurakhandanah || 63|| davagnibalasamhari phalahari
    gadagrajah | gopanganacelacorah patholilavisharadah || 64|| vamshiganapravinashca gopihastambujarcitah
    | munipatnyahritaharo munishreshtho munipriyah || 65|| govarddhanadrisandharta sankrandanatamo'pahah
    | sadudyanavilasi ca rasakridaparayanah || 66|| varunabhyarcito gopiprarthitah purushottamah | akrurastutisampritah
    kubjayauvanadayakah || 67|| mushtikorahprahari ca canurodaradaranah | mallayuddhagraganyashca pitribandhanamocakah
    || 68|| mattamatangapancasyah kamsagrivanikrintanah | ugrasenapratishtata ratnasimhasanasthitah ||
    69|| kalanemikhaladveshi mucukundavarapradah | salvasevitadurdharsharajasmayanivaranah || 70|| rukmagarvapahari
    ca rukmininayanotsavah | pradyumnajanakah kami pradyumno dvarakadhipah || 71|| manyaharta mahamayo
    jambavatkritasangarah | jambunadambaradharo gamyo jambavativibhuh || 72|| kalindiprathitaramakelirgunjavatamsakah
    | mandarasumanobhasvan shacishabhishtadayakah || 73|| satrajinmanasollasi satyajanih shubhavahah |
    shatadhanvaharah siddhah pandavapriyakotsavah || 74|| bhadrapriyah subhadraya bhrata nagnajitivibhuh
    | kiritakundaladharah kalpapallavalalitah || 75|| bhaishmipranayabhashavan mitravindadhipo'bhayah
    | svamurtikelisamprito lakshmanodaramanasah || 76|| pragjyotishadhipadhvamsi tatsainyantakaro'mritah
    | bhumistuto bhuribhogo bhushanambarasamyutah || 77|| bahuramakritahlado gandhamalyanulepanah | naradadrishtacarito
    devesho vishvarad guruh || 78|| banabahuvidarashca tapajvaravinashakah | ushoddharshayita'vyaktah
    shivavaktushtamanasah || 79|| maheshajvarasamstutyah shitajvarabhayantakah | nrigarajoddharakashca
    paundrakadivadhodyatah || 80|| vividharicchalodvignabrahmaneshu dayaparah | jarasandhabaladveshi keshidaityabhayankarah
    || 81|| cakri caidyantakah sabhyo rajabandhavimocakah | rajasuyahavirbhokta snigdhangah shubhalakshanah
    || 82|| dhanabhakshanasampritah kucelabhishtadayakah | sattvadigunagambhiro draupadimanarakshakah
    || 83|| bhishmadhyeyo bhaktavashyo bhimapujyo dayanidhih | dantavaktrashirashchetta krishnah krishnasakhah
    svarat || 84|| vaijayantipramodi ca barhibarhavibhushanah | parthakauravasandhanakari duhshasanantakah
    || 85|| buddo vishuddhah sarvajnah kratuhimsavinindakah | tripurastrimanabhangah sarvashastravisharadah
    || 86|| nirvikaro nirmamashca nirabhaso niramayah | jaganmohakadharmi ca digvastro dikpatishvarah
    || 87|| kalki mlecchapraharta ca dushtanigrahakarakah | dharmapratishtakari ca caturvarnyavibhagakrit
    || 88|| yugantako yugakranto yugakridyugabhasakah | kamarih kamakari ca nishkamah kamitarthadah ||
    89|| bhargo varenyam savituh sharngi vaikunthamandirah | hayagrivah kaitabharih grahaghno gajarakshakah
    || 90|| sarvasamshayavicchetta sarvabhaktasamutsukah | kapardi kamahari ca kala kashta smritirdhritih
    || 91|| anadiraprameyaujnah pradhanah sannirupakah | nirlopo nihspriho'sango nirbhayo nitiparagah
    || 92|| nishpeshyo nishkriyah shanto nishprapanco nidhirnayah karmyakarmi vikarmi ca karmepsuh karmabhavanah
    || 93|| karmangah karmavinyaso mahakarmi mahavrati | karmabhukkarmaphaladah karmeshah karmanigrahah
    || 94|| naro narayano dantah kapilah kamadah shucih | tapta japta'kshamalavan ganta neta layo gatih
    || 95|| shishto drashta ripudveshta roshta veshta mahanatah | roddha boddha mahayoddha shraddhavan
    satyadhih shubhah || 96|| mantri mantro mantragamyo mantrakrit paramantrahrit | mantrabhrinmantraphalado
    mantresho mantravigrahah || 97|| mantrango mantravinyaso mahamantro mahakramah | sthiradhih sthiravijnanah
    sthiraprajnah sthirasanah || 98|| sthirayogah sthiradharah sthiramargah sthiragamah| nishshreyaso
    niriho'gnirniravadyo niranjanah || 99|| nirvairo nirahankaro nirdambho nirasuyakah | ananto'nantabahururanantanghriranantadrik
    || 100|| anantavaktro'nantango'nantarupo hyanantakrit | urdhvareta urdhvalingo hyurdhvamurdhvordhvashakhakah
    || 101|| urdhva urdhvadhvarakshi ca hyurdhvajvalo nirakulah | bijam bijaprado nityo nidanam nishkritih
    kriti || 102|| mahananiyan garima sushama citramalikah | nabhassprinnabhaso jyotirnabhasvannirnabha
    nabhah || 103|| abhurvibhuh prabhuh shambhurmahiyana bhurbhuvakritih | mahanando mahashuro mahorashirmahotsavah
    || 104|| mahakrodho mahajvalo mahashanto mahagunah | satyavratah satyaparah satyasandhah satamgatih
    || 105|| satyeshah satyasankalpah satyacaritralakshanah | antashcaro hyantaratma paramatma cidatmakah
    || 106|| rocano rocamanashca sakshi shaurirjanardanah | mukundo nandanishpandah svarnabinduh purandarah
    || 107|| arindamah sumandashca kundamandarahasavan | syandanarudhacandango hyanandi nandanandanah
    || 108|| anasuyanandano'trinetranandah sunandavan | shankhavanpankajakarah kunkumanko jayankushah
    || 109|| ambhojamakarandadhyo nishpanko'garupankilah | indrashcandrarathashcandro'ticandrashcandrabhasakah
    || 110|| upendra indrarajashca vagindrashcandralocana | pratyak parak paramdhama paramarthah paratparah
    || 111|| aparavak paragami paravarah paravarah | sahasvanarthadata ca sahanah sahasi jayi || 112||
    tejasvi vayuvishikhi tapasvi tapasottamah | aishvaryodbhutikridbhutiraishvaryangakalapavan || 113||
    ambhodhishayi bhagavan sarvajnassamaparagah | mahayogi mahadhiro mahabhogi mahaprabhuh || 114|| mahaviro
    mahatushtirmahapushtirmahagunah | mahadevo mahabahurmahadharmo maheshvarah || 115|| samipago duragami
    svargamarganirargalah | nago nagadharo nago nagesho nagapalakah || 116|| hiranmayah svarnareta hiranyarcirhiranyadah
    | gunaganyah sharanyashca punyakirtih puranagah || 117|| janmabhrijjanyasannaddho divyapancayudho
    vashi | daurjanyabhangah parjanyah saujanyanilayo'layah || 118|| jalandharantako bhasmadaityanashi
    mahamanah | shreshtashshravishtho draghishtho garishtho garudadhvajah || 119|| jyeshtho dradhishtho
    varshishtho draghiyan pranavah phani | sampradayakarah svami suresho madhavo madhuh || 120|| nirnimesho
    vidhirvedha balavan jivanam bali | smarta shrota vikarta ca dhyata neta samo'samah || 121|| hota pota
    mahavakta ranta manta khalantakah | data grahayita mata niyanta'nanta vaibhavah || 122|| gopta gopayita
    hanta dharmajagarita dhavah | karta kshetrakarah kshetrapradah kshetrajna atmavit || 123|| kshetri
    kshetraharah kshetrapriyah kshemakaro marut | bhaktiprado muktidayi shaktido yuktidayakah || 124||
    shaktiyunjauktikasragvi suktiramnayasuktigah | dhananjayo dhanadhyaksho dhaniko dhanadadhipah || 125||
    mahadhano mahamani duryodhanavimanitah | ratnakaro ratnaroci ratnagarbhashrayah shucih || 126|| ratnasanunidhirmauḻiratnabha
    ratnakankanah | antarlakshyo'ntaramyasi cantardhyeyo jitasanah || 127|| antarango dayavamshca hyamtarmayo
    maharnavah | sarasasiddharasikah siddhih sadhyah sadagatih || 128|| ayuhprado mahayushmanarcishmanoshadhipatih
    | ashtashrirashtabhago'shtakakubvyaptayasho trati || 129|| ashtapadah suvarnabho hyashtamurtistrimurtiman
    | asvapnah svapnagah svapnah susvapnaphaladayakah || 130|| duhsvapnadhvamsako dhvastadurnimittah shivankarah
    | suvarnavarnassambhavyo varnito varnasammukhah || 131|| suvarnamukharitirashivadhyatapadambujah |
    dakshayanivacastushto durvasodrishtigocarah || 132|| ambarishavrataprito mahakrittivibhanjanah | mahabhicarakadhvamsi
    kalasarpabhayantakah || 133|| sudarshanah kalameghashyamashshrimantrabhavitah | hemambujasarahsnayi
    shrimanobhavitakritih || 134|| shripradatambujasragvi shrikelih shrinidhirbhavah | shriprado vamano
    lakshminayakashca caturbhujah || 135|| samtriptastarpitastirthasnatrisaukhyapradarshakah | agastyastutisamhrishto
    darshitavyaktabhavanah || 136|| kapilarcih kapilavan susnataghavipatanah | vrishakapih kapisvamimano'ntahsthitavigrahah
    || 137|| vahnipriyo'rthasambhavyo janalokavidhayakah | vahniprabho vahnitejah shubhabhishtaprado yami
    || 138|| varunakshetranilayo varuno varanarcitah | vayusthanakritavaso vayugo vayusambhritah || 139||
    yamantako'bhijanano yamalokanivaranah | yaminamagraganyashca samyami yamabhavitah || 140|| indrodyanasamipastha
    indradrigvishayah prabhuh | yaksharat sarasivaso hyakshayyanidhikoshakrit || 141|| svamitirthakritavasah
    svamidhyeyo hyadhokshajah | varahadyashtatirthabhisevitanghrisaroruhah || 142|| pandutirthabhishiktango
    yudhishthiravarapradah | bhimantahkaranarudhah shvetavahanasakhyavan || 143|| nakulabhayado madrisahadevabhivanditah
    | krishnashapathasandhata kuntistutirato dami || 144|| naradadimunistutyo nityakarmaparayanah | darshitavyaktarupashca
    vinanadapramoditah || 145|| shatkotitirthacaryavan devatirthakritashramah | bilvamalajalasnayi sarasvatyambusevitah
    || 146|| tumburudaka samsparshajanacittatamo'pahah | matsyavamanakurmaditirtharajah puranabhrit ||
    147|| cakradhyeyapadambhojah shankhapujitapadukah | ramatirthavihari ca balabhadrapratishtitah ||
    148|| jamadagnyasarastirthajalasecanatarpitah | papapaharikilalasusnataghavinashanah || 149|| nabhogangabhishiktashca
    nagatirthabhishekavan | kumaradharatirthastho vatuveshah sumekhalah || 150|| vriddhasya sukumaratvapradah
    saundaryavan sukhi | priyamvado mahakukshirikshvakukulanandanah || 151|| nilagokshiradharabhurvarahacalanayakah
    | bharadvajapratishthavan brihaspativibhavitah || 152|| anjanakritapujavan anjaneyakararcitah | anjanadrinivasashca
    munjakeshah purandarah || 153|| kinnaradvayasambandhibandhamokshapradayakah | vaikhanasamakharambho
    vrishajneyo vrishacalah || 154|| vrishakayaprabhetta ca kridanacarasambhramah | sauvarcaleyavinyastarajyo
    narayana priyah || 155|| durmedhobhanjakah prajno brahmotsavamahotsukah | bhadrasurashirashceta bhadrakshetri
    subhadravan || 156|| mrigaya'kshinasannahah shankharajanyatushtidah | sthanustho vainateyangabhavito
    hyashariravan || 157|| bhogindrabhogasamsthano brahmadiganasevitah | sahasrarkacchatabhasvadyimanantahsthito
    guni || 158|| vishvaksenakritastotrah sanandanavarivritah | jahnavyadinadisevyah sureshadyabhivanditah
    || 159|| surangananrityaparo gandharvodgayanapriyah | rakendusankashanakhah komalanghrasaroruhah ||
    160|| kacchapaprapadah kundagulpakah svacchakurparah | medurasvarnavastradhyakatideshasthamekhalah
    || 161|| prollasacchurikabhasvatkatideshah shubhankarah | anantapadmajasthananabhirmauktikamalikah
    || 162|| mandaracampeyamali ratnabharanasambhritah | lambayajnopaviti ca candrashrikhandalepavan ||
    163|| varado'bhayadashcakri shankhi kaustubhadiptiman | shrivatsankitavakshasko lakshmisamshritahrittatah
    || 164|| nilotpala nibhakarah shonambhojasamananah | kotimanmathalavanyacandrikasmitapuritah || 165||
    sudhasvacchordhvapundrashca kasturitilakancitah | pundarikekshanah svaccho maulishobhavirajitah ||
    166|| padmasthah padmanabhashca somamandalago budhah | vahnimamdalagah suryah suryamandalasamsthitah
    || 167|| shripatirbhumijanishca vimaladyabhisamvritah | jagatkutumbajanita rakshakah kamitapradah
    || 168|| avasthatrayayanta ca vishvatejassvarupavan | jnaptirjneyo jnanagamyo jnanatitah suratigah
    || 169|| brahmandantarbahirvyapto venkatadrigadadharah | venkatadrigadadhara om namah iti || evam
    shrivenkateshasya kirtitam paramadbhutam || 170|| namnam sahasram samshravyam pavitram punyavarddhanam
    | shravanatsarvadoshaghnam rogaghnam mrityunashanam || 171|| daridryabhedanam dharmyam sarvaishvaryaphalapradam
    | kalahivishavicchedijvarapasmarabhanjanam || 172|| shatrukshayakaram rajagrahapidanivaranam | brahmarakshasakushmamdabhetalabhayabhamjanam
    || 173|| vidyabhilashi vidyavan dhanarthi dhanavan bhavet | anantakalpajivi syadayushkamo mahayashah
    || 174|| putrarthi sugunanputran labheta''yushmatastanah | sangrame shatruvijayi sabhayam prativadijit
    || 175|| divyairnamabhirebhistu tulasipujanatsakrit | vaikunthavasi bhagavatsadrisho vishnusannidhau
    || 176|| kahlarapujananmasat dvitiya iva yaksharat | nilotpalarcanatsarvarajapujyah sada bhavet ||
    177|| hritsamsthitairnamabhistu bhuyaddrigvishayo harih | vanchitartha tada datva vaikuntham ca prayacchati
    || 178|| trisandhyam yo japennityam sampujya vidhina vibhum | trivaram pancavaram va pratyaham kramasho
    yami || 179|| masadalakshminashah syat dvimasat syannarendrata | trimasanmahadaishvaryam tatassambhashanam
    bhavet || 180|| masam pathannyunakarmamurtim ca samavapnuyat | margabhrashtashca sanmargam gatasvah
    svam svakiyakam || 181|| cancalyacitto'cancalyam manassvasthyam ca gacchati | ayurarogyamaishvaryam
    jnanam moksham ca vindati || 182|| sarvankamanavapnoti shashvatam ca padam tatha | satyam satyam punassatyam
    satyam satyam na samshayah || 183|| shri brahmandapurane vasishthanaradasamvade shrivenkatacalamahatmye
    shri venkatesha sahasranama stotradhyayah samaptah ||
  devanagari: भास्वच्छंद्रमसौ यदीयनयने भार्या यदीया रमा यस्माद्विश्वसृडप्यभूद्यमिकुलं यद्ध्यानयुक्तं सदा
    नाथो यो जगतां नगेन्द्रदुहितुर्नाथोऽपि यद्भक्तिमान् तातो यो मदनस्य यो दुरितहा तं वेङ्कटेशं भजे ॥ ऊर्ध्वै
    हस्तौ यदीयौ सुररिपुदळने बिभ्रतौ शङ्खचक्रे सेव्यावङ्घ्री स्वकीयावभिदधदधरो दक्षिणो यस्य पाणिः । तावन्मात्रं
    भवाब्धिं गमयति भजतामूरुगो वामपाणिः श्रीवत्साङ्कश्च लक्ष्मीर्यदुरसि लसतस्तं भजे वेङ्कटेशम् ॥ इति ध्यायन्
    वेङ्कटेशं श्रीवत्साङ्कं रमापतिम् । वेङ्कटेशो विरूपाक्ष इत्यारभ्य जपेत्क्रमात् ॥ १०॥ ॐ वेङ्कटेशो विरूपाक्षो
    विश्वेशो विश्वभावनः । विश्वसृङ् विश्वसंहर्ता विश्वप्राणो विराड्वपुः ॥ ११॥ शेषाद्रिनिलयोऽशेषभक्तदुःखप्रणाशनः
    । शेषस्तुत्यः शेषशायी विशेषज्ञो विभुः स्वभूः ॥ १२॥ विष्णुर्जिष्णुश्च वर्धिष्णुरुत्सविष्णुः सहिष्णुकः
    । भ्राजिष्णुश्च ग्रसिष्णुश्च वर्तिष्णुश्च भरिष्णुकः ॥ १३॥ कालयन्ता कालगोप्ता कालः कालान्तकोऽखिलः ।
    कालगम्यः कालकण्ठवन्द्यः कालकलेश्वरः ॥ १४॥ शम्भुः स्वयम्भूरम्भोजनाभिस्तम्भितवारिधिः । अम्भोधिनन्दिनीजानिः
    शोणाम्भोजपदप्रभः ॥ १५॥ कम्बुग्रीवः शम्बरारिरूपः शम्बरजेक्षणः । बिम्बाधरो बिम्बरूपी प्रतिबिम्बक्रियातिगः
    ॥ १६॥ गुणवान् गुणगम्यश्च गुणातीतो गुणप्रियः दुर्गुणध्वंसकृत्सर्वसुगुणो गुणभासकः ॥ १७॥ परेशः परमात्मा
    च परञ्ज्योतिः परा गतिः । परं पदं वियद्वासाः पारम्पर्यशुभप्रदः ॥ १८॥ ब्रह्माण्डगर्भो ब्रह्मण्यो ब्रह्मसृढ्ब्रह्मबोधितः
    । ब्रह्मस्तुत्यो ब्रह्मवादी ब्रह्मचर्यपरायणः ॥ १९॥ सत्यव्रतार्थसन्तुष्टस्सत्यरूपी झषाङ्गवान् । सोमकप्राणहारी
    चानीताम्नायोऽब्धिसञ्चरः ॥ २०॥ देवासुरवरस्तुत्यः पतन्मन्दरधारकः । धन्वन्तरिः कच्छपाङ्गः पयोनिधिविमन्थकः
    ॥ २१॥ अमरामृतसन्धाता धृतसम्मोहिनीवपुः । हरमोहकमायावी रक्षःसन्दोहभञ्जनः ॥ २२॥ हिरण्याक्षविदारी च यज्ञो
    यज्ञ विभावनः । यज्ञीयोर्वीसगुद्धर्ता लीलाक्रोडः प्रतापवान् ॥ २३॥ दण्डकासुरविध्वंसी वक्रदंष्ट्र क्षमाधरः
    । गन्धर्वशापहरणः पुण्यगन्धो विचक्षणः ॥ २४॥ करालवक्त्रः सोमार्कनेत्रः षड्गुणवैभवः । श्वेतघोणी घूर्णितभ्रूर्घुर्घुरध्वनिविभ्रमः
    ॥ २५॥ द्राघीयान् नीलकेशी च जाग्रदम्बुजलोचनः । घृणावान् घृणिसम्मोहो महाकालाग्निदीधितिः ॥ २६॥ ज्वालाकरालवदनो
    महोल्काकुलवीक्षणः । सटानिर्भिण्णमेघौघो दंष्ट्रारुग्व्याप्तदिक्तटः ॥ २७॥ उच्छ्वासाकृष्टभूतेशो निःश्वासत्यक्तविश्वसृट्
    । अन्तर्भ्रमज्जगद्गर्भोऽनन्तो ब्रह्मकपालहृत् ॥ २८॥ उग्रो वीरो महाविष्णुर्ज्वलनः सर्वतोमुखः । नृसिंहो
    भीषणो भद्रो मृत्युमृत्युः सनातनः ॥ २९॥ सभास्तम्भोद्भवो भीमः शीरोमाली महेश्वरः । द्वादशादित्यचूडालः
    कल्पधूमसटाच्छविः ॥ ३०॥ हिरण्यकोरस्थलभिन्ननखः सिंहमुखोऽनघः । प्रह्लादवरदो धीमान् भक्तसङ्घ प्रतिष्ठितः
    ॥ ३१॥ ब्रह्मरुद्रादिसंसेव्यः सिद्धसाध्यप्रपूजितः । लक्ष्मीनृसिंहो देवेशो ज्वालाजिह्वान्त्रमालिकः ॥
    ३२॥ खड्गी खेटी महेष्वासी कपाली मुसली हली । पाशी शूली महाबाहुर्ज्वरघ्नो रोगलुण्ठकः ॥ ३३॥ मौञ्जीयुक्
    छात्रको दण्डी कृष्णाजिनधरो वटुः । अधीतवेदो वेदान्तोद्धारको ब्रह्मनैष्ठिकः ॥ ३४॥ अहीनशयनप्रीतः आदितेयोऽनघो
    हरिः । संवित्प्रियस्सामवेद्यो बलिवेश्मप्रतिष्ठितः ॥ ३५॥ बलिक्षालितपादाब्जो विन्द्यावलिविमानितः । त्रिपादभूमिस्वीकर्ता
    विश्वरूपप्रदर्शकः ॥ ३६॥ धृतत्रिविक्रमः साङ्घ्रिनखभिन्नाण्डखर्परः । पज्जातवाहिनीधारापवित्रितजगत्त्रयः
    ॥ ३७॥ विधिसम्मानितः पुण्यो दैत्ययोद्धा जयोर्जितः । सुरराज्यप्रदः शुक्रमदहृत् सुगतीश्वरः ॥ ३८॥ जामदग्न्यः
    कुठारी च कार्तवीर्यविदारणः । रेणुकायाश्शिरोहारी दुष्टक्षत्रियमर्दनः ॥ ३९॥ वर्चस्वी दानशीलश्च धनुष्मान्
    ब्रह्मवित्तमः । अत्युदग्रः समग्रश्च न्यग्रोधो दुष्टनिग्रहः ॥ ४०॥ रविवंशसमुद्भूतो राघवो भरताग्रजः ।
    कौसल्यातनयो रामो विश्वामित्र प्रियङ्करः ॥४१॥ ताटकारिः सुबाहुघ्नो बलातिबलमन्त्रवान् । अहल्याशापविच्छेदी
    प्रविष्टजनकालयः ॥ ४२॥ स्वयंवरसभासंस्थ ईशचापप्रभञ्जनः । जानकीपरिणेता च जनकाधीशसंस्तुतः ॥ ४३॥ जमदग्नितनूजातयोद्धाऽयोध्याधिपाग्रणीः
    । पितृवाक्यप्रतीपालस्त्यक्तराज्यः सलक्ष्मणः ॥ ४४॥ ससीतश्चित्रकूटस्थो भरताहितराज्यकः । काकदर्पप्रहर्ता
    च दण्डकारण्यवासकः ॥ ४५॥ पञ्चवट्यां विहारी च स्वधर्मपरिपोषकः । विराधहाऽगस्त्यमुख्यमुनिसम्मानितः ॥ ४६॥
    इन्द्रचापधरः खड्गधरश्चाक्षयसायकः । खरान्तको दूषणारिस्त्रिशिरस्करिपुर्वृषः ॥ ४७॥ ततः शूर्पणखानासाच्छेत्ता
    वल्कलधारकः । जटावान् पर्णशालास्थो मारीचबलमर्दकः ॥ ४८॥ पक्षिराट्कृतसंवादो रवितेजा महाबलः । शबर्यानीतफलभुग्धनूमत्परितोषितः
    ॥ ४९॥ सुग्रीवाभयदो दैत्यकायक्षेपणभासुरः । सप्ततालसमुच्छेत्ता वालिहृत्कपिसंवृतः ॥ ५०॥ वायुसूनुकृतासेवस्त्यक्तपम्पः
    कुशासनः । उदन्वत्तीरगः शूरो विभीषणवरप्रदः ॥ ५१॥ सेतुकृद्दैत्यहा प्राप्तलङ्कोऽलङ्कारवान् स्वयम् । अतिकायशिरश्छेत्ता
    कुम्भकर्णविभेदनः ॥ ५२॥ दशकण्ठशिरोध्वंसी जांबवत्प्रमुखावृतः । जानकीशः सुराध्यक्षः साकेतेशः पुरातनः
    ॥ ५३॥ पुण्यश्लोको वेदवेद्यः स्वामितीर्थनिवासकः । लक्ष्मीसरःकेळिलोलो लक्ष्मीशो लोकरक्षकः ॥ ५४॥ देवकीगर्भसंभूतो
    यशोदेक्षणलालितः । वसुदेवकृतस्तोत्रो नन्दगोपमनोहरः ॥ ५५॥ चतुर्भुजः कोमलाङ्गो गदावान्नीलकुन्तलः । पूतनाप्राणसंहर्ता
    तृणावर्तविनाशनः ॥ ५६॥ गर्गारोपितनामाङ्को वासुदेवो ह्याधोक्षजः । गोपिकास्तन्यपायी च बलभद्रानुजोऽच्युतः
    ॥ ५७॥ वैयाघ्रनखभूषश्च वत्सजिद्वत्सवर्धनः । क्षीरसाराशनरतो दधिभाण्डप्रमर्दनः ॥ ५८ ॥ नवनीतापहर्ता च
    नीलनीरदभासुरः । अभीरदृष्टदौर्जन्यो नीलपद्मनिभाननः ॥ ५९॥ मातृदर्शितविश्वास्यः उलूखलनिबन्धनः । नलकूबरशापान्तो
    गोधूलिच्छुरिताङ्गकः ॥ ६०॥ गोसङ्घरक्षकः श्रीशो वृन्दारण्यनिवासकः । वत्सान्तको बकद्वेषी दैत्याम्बुदमहानिलः
    ॥ ६१ ॥ महाजगरचण्डाग्निः शकटप्राणकण्टकः । इन्द्रसेव्यः पुण्यगात्रः खरजिञ्वण्डदीधितिः ॥ ६२॥ तालपक्वफलाशी
    च काळीयफणिदर्पहा । नागपत्नीस्तुतिप्रीतः प्रलम्बासुरखण्डनः ॥ ६३॥ दावाग्निबलसंहारी फलहारी गदाग्रजः ।
    गोपाङ्गनाचेलचोरः पाथोलीलाविशारदः ॥ ६४॥ वंशीगानप्रवीणश्च गोपीहस्ताम्बुजार्चितः । मुनिपत्न्याहृताहारो
    मुनिश्रेष्ठो मुनिप्रियः ॥ ६५॥ गोवर्द्धनाद्रिसन्धर्ता सङ्क्रन्दनतमोऽपहः । सदुद्यानविलासी च रासक्रीडापरायणः
    ॥ ६६॥ वरुणाभ्यर्चितो गोपीप्रार्थितः पुरुषोत्तमः । अक्रूरस्तुतिसम्प्रीतः कुब्जायौवनदायकः ॥ ६७॥ मुष्टिकोरःप्रहारी
    च चाणूरोदरदारणः । मल्लयुद्धाग्रगण्यश्च पितृबन्धनमोचकः ॥ ६८॥ मत्तमातङ्गपञ्चास्यः कंसग्रीवानिकृन्तनः
    । उग्रसेनप्रतिष्टाता रत्नसिंहासनस्थितः ॥ ६९॥ कालनेमिखलद्वेषी मुचुकुन्दवरप्रदः । साल्वसेवितदुर्धर्षराजस्मयनिवारणः
    ॥ ७०॥ रुक्मगर्वापहारी च रुक्मिणीनयनोत्सवः । प्रद्युम्नजनकः कामी प्रद्युम्नो द्वारकाधिपः ॥ ७१॥ मण्याहर्ता
    महामायो जाम्बवत्कृतसङ्गरः । जाम्बूनदाम्बरधरो गम्यो जाम्बवतीविभुः ॥ ७२॥ कालिन्दीप्रथितारामकेलिर्गुञ्जावतंसकः
    । मन्दारसुमनोभास्वान् शचीशाभीष्टदायकः ॥ ७३॥ सत्राजिन्मानसोल्लासी सत्याजानिः शुभावहः । शतधन्वहरः सिद्धः
    पाण्डवप्रियकोत्सवः ॥ ७४॥ भद्रप्रियः सुभद्राया भ्राता नाग्नाजितीविभुः । किरीटकुण्डलधरः कल्पपल्लवलालितः
    ॥ ७५॥ भैष्मीप्रणयभाषावान् मित्रविन्दाधिपोऽभयः । स्वमूर्तिकेलिसम्प्रीतो लक्ष्मणोदारमानसः ॥ ७६॥ प्राग्ज्योतिषाधिपध्वंसी
    तत्सैन्यान्तकरोऽमृतः । भूमिस्तुतो भूरिभोगो भूषणाम्बरसंयुतः ॥ ७७॥ बहुरामाकृताह्लादो गन्धमाल्यानुलेपनः
    । नारदादृष्टचरितो देवेशो विश्वराड् गुरुः ॥ ७८॥ बाणबाहुविदारश्च तापज्वरविनाशकः । उषोद्धर्षयिताऽव्यक्तः
    शिववाक्तुष्टमानसः ॥ ७९॥ महेशज्वरसंस्तुत्यः शीतज्वरभयान्तकः । नृगराजोद्धारकश्च पौण्ड्रकादिवधोद्यतः
    ॥ ८०॥ विविधारिच्छलोद्विग्नब्राह्मणेषु दयापरः । जरासन्धबलद्वेषी केशिदैत्यभयङ्करः ॥ ८१॥ चक्री चैद्यान्तकः
    सभ्यो राजबन्धविमोचकः । राजसूयहविर्भोक्ता स्निग्धाङ्गः शुभलक्षणः ॥ ८२॥ धानाभक्षणसम्प्रीतः कुचेलाभीष्टदायकः
    । सत्त्वादिगुणगम्भीरो द्रौपदीमानरक्षकः ॥ ८३॥ भीष्मध्येयो भक्तवश्यो भीमपूज्यो दयानिधिः । दन्तवक्त्रशिरश्छेत्ता
    कृष्णः कृष्णासखः स्वराट् ॥ ८४॥ वैजयन्तीप्रमोदी च बर्हिबर्हविभूषणः । पार्थकौरवसन्धानकारी दुःशासनान्तकः
    ॥ ८५॥ बुद्दो विशुद्धः सर्वज्ञः क्रतुहिंसाविनिन्दकः । त्रिपुरस्त्रीमानभङ्गः सर्वशास्त्रविशारदः ॥ ८६॥
    निर्विकारो निर्ममश्च निराभासो निरामयः । जगन्मोहकधर्मी च दिग्वस्त्रो दिक्पतीश्वरः ॥ ८७॥ कल्की म्लेच्छप्रहर्ता
    च दुष्टनिग्रहकारकः । धर्मप्रतिष्टाकारी च चातुर्वर्ण्यविभागकृत् ॥ ८८॥ युगान्तको युगाक्रान्तो युगकृद्युगभासकः
    । कामारिः कामकारी च निष्कामः कामितार्थदः ॥ ८९॥ भर्गो वरेण्यं सवितुः शार्ङ्गी वैकुण्ठमन्दिरः । हयग्रीवः
    कैटभारिः ग्राहघ्नो गजरक्षकः ॥ ९०॥ सर्वसंशयविच्छेत्ता सर्वभक्तसमुत्सुकः । कपर्दी कामहारी च कला काष्टा
    स्मृतिर्धृतिः ॥ ९१॥ अनादिरप्रमेयौज्ञाः प्रधानः सन्निरूपकः । निर्लोपो निःस्पृहोऽसङ्गो निर्भयो नीतिपारगः
    ॥ ९२॥ निष्पेष्यो निष्क्रियः शान्तो निष्प्रपञ्चो निधिर्नयः कर्म्यकर्मी विकर्मी च कर्मेप्सुः कर्मभावनः
    ॥ ९३॥ कर्माङ्गः कर्मविन्यासो महाकर्मी महाव्रती । कर्मभुक्कर्मफलदः कर्मेशः कर्मनिग्रहः ॥ ९४॥ नरो नारायणो
    दान्तः कपिलः कामदः शुचिः । तप्ता जप्ताऽक्षमालावान् गन्ता नेता लयो गतिः ॥ ९५॥ शिष्टो द्रष्टा रिपुद्वेष्टा
    रोष्टा वेष्टा महानटः । रोद्धा बोद्धा महायोद्धा श्रद्धावान् सत्यधीः शुभः ॥ ९६॥ मन्त्री मन्त्रो मन्त्रगम्यो
    मन्त्रकृत् परमन्त्रहृत् । मन्त्रभृन्मन्त्रफलदो मन्त्रेशो मन्त्रविग्रहः ॥ ९७॥ मन्त्राङ्गो मन्त्रविन्यासो
    महामन्त्रो महाक्रमः । स्थिरधीः स्थिरविज्ञानः स्थिरप्रज्ञः स्थिरासनः ॥ ९८॥ स्थिरयोगः स्थिराधारः स्थिरमार्गः
    स्थिरागमः। निश्श्रेयसो निरीहोऽग्निर्निरवद्यो निरञ्जनः ॥ ९९॥ निर्वैरो निरहङ्कारो निर्दम्भो निरसूयकः
    । अनन्तोऽनन्तबाहूरुरनन्ताङ्घ्रिरनन्तदृक् ॥ १००॥ अनन्तवक्त्रोऽनन्ताङ्गोऽनन्तरूपो ह्यनन्तकृत् । ऊर्ध्वरेता
    ऊर्ध्वलिङ्गो ह्यूर्ध्वमूर्ध्वोर्ध्वशाखकः ॥ १०१॥ ऊर्ध्व ऊर्ध्वाध्वरक्षी च ह्यूर्ध्वज्वालो निराकुलः
    । बीजं बीजप्रदो नित्यो निदानं निष्कृतिः कृती ॥ १०२॥ महानणीयन् गरिमा सुषमा चित्रमालिकः । नभस्स्पृङ्नभसो
    ज्योतिर्नभस्वान्निर्नभा नभः ॥ १०३॥ अभुर्विभुः प्रभुः शम्भुर्महीयान भूर्भुवाकृतिः । महानन्दो महाशूरो
    महोराशिर्महोत्सवः ॥ १०४॥ महाक्रोधो महाज्वालो महाशान्तो महागुणः । सत्यव्रतः सत्यपरः सत्यसन्धः सतांगतिः
    ॥ १०५॥ सत्येशः सत्यसङ्कल्पः सत्यचारित्रलक्षणः । अन्तश्चरो ह्यन्तरात्मा परमात्मा चिदात्मकः ॥ १०६॥ रोचनो
    रोचमानश्च साक्षी शौरिर्जनार्दनः । मुकुन्दो नन्दनिष्पन्दः स्वर्णबिन्दुः पुरन्दरः ॥ १०७॥ अरिन्दमः सुमन्दश्च
    कुन्दमन्दारहासवान् । स्यन्दनारूढचण्डाङ्गो ह्यानन्दी नन्दनन्दनः ॥ १०८॥ अनसूयानन्दनोऽत्रिनेत्रानन्दः
    सुनन्दवान् । शङ्खवान्पङ्कजकरः कुङ्कुमाङ्को जयाङ्कुशः ॥ १०९॥ अम्भोजमकरन्दाढ्यो निष्पङ्कोऽगरुपङ्किलः
    । इन्द्रश्चन्द्ररथश्चन्द्रोऽतिचन्द्रश्चन्द्रभासकः ॥ ११०॥ उपेन्द्र इन्द्रराजश्च वागिन्द्रश्चन्द्रलोचन
    । प्रत्यक् पराक् परंधाम परमार्थः परात्परः ॥ १११॥ अपारवाक् पारगामी पारावारः परावरः । सहस्वानर्थदाता
    च सहनः साहसी जयी ॥ ११२॥ तेजस्वी वायुविशिखी तपस्वी तापसोत्तमः । ऐश्वर्योद्भूतिकृद्भूतिरैश्वर्याङ्गकलापवान्
    ॥ ११३॥ अम्भोधिशायी भगवान् सर्वज्ञस्सामपारगः । महायोगी महाधीरो महाभोगी महाप्रभुः ॥ ११४॥ महावीरो महातुष्टिर्महापुष्टिर्महागुणः
    । महादेवो महाबाहुर्महाधर्मो महेश्वरः ॥ ११५॥ समीपगो दूरगामी स्वर्गमार्गनिरर्गलः । नगो नगधरो नागो नागेशो
    नागपालकः ॥ ११६॥ हिरण्मयः स्वर्णरेता हिरण्यार्चिर्हिरण्यदः । गुणगण्यः शरण्यश्च पुण्यकीर्तिः पुराणगः
    ॥ ११७॥ जन्मभृज्जन्यसन्नद्धो दिव्यपञ्चायुधो वशी । दौर्जन्यभङ्गः पर्जन्यः सौजन्यनिलयोऽलयः ॥ ११८॥ जलन्धरान्तको
    भस्मदैत्यनाशी महामनाः । श्रेष्टश्श्रविष्ठो द्राघिष्ठो गरिष्ठो गरुडध्वजः ॥ ११९॥ ज्येष्ठो द्रढिष्ठो
    वर्षिष्ठो द्राघियान् प्रणवः फणी । सम्प्रदायकरः स्वामी सुरेशो माधवो मधुः ॥ १२०॥ निर्निमेषो विधिर्वेधा
    बलवान् जीवनं बली । स्मर्ता श्रोता विकर्ता च ध्याता नेता समोऽसमः ॥ १२१॥ होता पोता महावक्ता रन्त मन्ता
    खलान्तकः । दाता ग्राहयिता माता नियन्ताऽनन्त वैभवः ॥ १२२॥ गोप्ता गोपयिता हन्ता धर्मजागरिता धवः । कर्ता
    क्षेत्रकरः क्षेत्रप्रदः क्षेत्रज्ञ आत्मवित् ॥ १२३॥ क्षेत्री क्षेत्रहरः क्षेत्रप्रियः क्षेमकरो मरुत्
    । भक्तिप्रदो मुक्तिदायी शक्तिदो युक्तिदायकः ॥ १२४॥ शक्तियुङ्जौक्तिकस्रग्वी सूक्तिराम्नायसूक्तिगः ।
    धनञ्जयो धनाध्यक्षो धनिको धनदाधिपः ॥ १२५॥ महाधनो महामानी दुर्योधनविमानितः । रत्नाकरो रत्नरोची रत्नगर्भाश्रयः
    शुचिः ॥ १२६॥ रत्नसानुनिधिर्मौळिरत्नाभा रत्नकङ्कणः । अन्तर्लक्ष्योऽन्तरम्यासी चान्तर्ध्येयो जितासनः
    ॥ १२७॥ अन्तरङ्गो दयावांश्च ह्यांतर्मायो महार्णवः । सरससिद्धरसिकः सिद्धिः साध्यः सदागतिः ॥ १२८॥ आयुःप्रदो
    महायुष्मानर्चिष्मानोषधीपतिः । अष्टश्रीरष्टभागोऽष्टककुब्व्याप्तयशो त्रती ॥ १२९॥ अष्टापदः सुवर्णाभो
    ह्यष्टमूर्तिस्त्रिमूर्तिमान् । अस्वप्नः स्वप्नगः स्वप्नः सुस्वप्नफलदायकः ॥ १३०॥ दुःस्वप्नध्वंसको ध्वस्तदुर्निमित्तः
    शिवङ्करः । सुवर्णवर्णस्सम्भाव्यो वर्णितो वर्णसम्मुखः ॥ १३१॥ सुवर्णमुखरीतीरशिवध्यातपदाम्बुजः । दाक्षायणीवचस्तुष्टो
    दूर्वासोदृष्टिगोचरः ॥ १३२॥ अम्बरीषव्रतप्रीतो महाकृत्तिविभञ्जनः । महाभिचारकध्वंसी कालसर्पभयान्तकः ॥
    १३३॥ सुदर्शनः कालमेघश्यामश्श्रीमन्त्रभावितः । हेमाम्बुजसरःस्नायी श्रीमनोभाविताकृतिः ॥ १३४॥ श्रीप्रदताम्बुजस्रग्वी
    श्रीकेलिः श्रीनिधिर्भवः । श्रीप्रदो वामनो लक्ष्मीनायकश्च चतुर्भुजः ॥ १३५॥ संतृप्तस्तर्पितस्तीर्थस्नातृसौख्यप्रदर्शकः
    । अगस्त्यस्तुतिसंहृष्टो दर्शिताव्यक्तभावनः ॥ १३६॥ कपिलार्चिः कपिलवान् सुस्नाताघविपाटनः । वृषाकपिः
    कपिस्वामिमनोऽन्तःस्थितविग्रहः ॥ १३७॥ वह्निप्रियोऽर्थसंभाव्यो जनलोकविधायकः । वह्निप्रभो वह्नितेजाः
    शुभाभीष्टप्रदो यमी ॥ १३८॥ वारुणक्षेत्रनिलयो वरुणो वारणार्चितः । वायुस्थानकृतावासो वायुगो वायुसंभृतः
    ॥ १३९॥ यमान्तकोऽभिजननो यमलोकनिवारणः । यमिनामग्रगण्यश्च संयमी यमभावितः ॥ १४०॥ इन्द्रोद्यानसमीपस्थ इन्द्रदृग्विषयः
    प्रभुः । यक्षराट् सरसीवासो ह्यक्षय्यनिधिकोशकृत् ॥ १४१॥ स्वामितीर्थकृतावासः स्वामिध्येयो ह्यधोक्षजः
    । वराहाद्यष्टतीर्थाभिसेविताङ्घ्रिसरोरुहः ॥ १४२॥ पाण्डुतीर्थभिषिक्ताङ्गो युधिष्ठिरवरप्रदः । भीमान्तःकरणारूढः
    श्वेतवाहनसख्यवान् ॥ १४३॥ नकुलाभयदो माद्रीसहदेवाभिवन्दितः । कृष्णाशपथसन्धाता कुन्तीस्तुतिरतो दमी ॥
    १४४॥ नारदादिमुनिस्तुत्यो नित्यकर्मपरायणः । दर्शिताव्यक्तरूपश्च वीणानादप्रमोदितः ॥ १४५॥ षट्कोटितीर्थचर्यावान्
    देवतीर्थकृताश्रमः । बिल्वामलजलस्नायी सरस्वत्यम्बुसेवितः ॥ १४६॥ तुम्बुरूदक संस्पर्शजनचित्ततमोऽपहः ।
    मत्स्यवामनकूर्मादितीर्थराजः पुराणभृत् ॥ १४७॥ चक्रध्येयपदाम्भोजः शङ्खपूजितपादुकः । रामतीर्थविहारी च
    बलभद्रप्रतिष्टितः ॥ १४८॥ जामदग्न्यसरस्तीर्थजलसेचनतर्पितः । पापापहारिकीलालसुस्नाताघविनाशनः ॥ १४९॥ नभोगङ्गाभिषिक्तश्च
    नागतीर्थाभिषेकवान् । कुमारधारातीर्थस्थो वटुवेषः सुमेखलः ॥ १५०॥ वृद्धस्य सुकुमारत्वप्रदः सौन्दर्यवान्
    सुखी । प्रियंवदो महाकुक्षिरिक्ष्वाकुकुलनन्दनः ॥ १५१॥ नीलगोक्षीरधाराभूर्वराहाचलनायकः । भरद्वाजप्रतिष्ठावान्
    बृहस्पतिविभावितः ॥ १५२॥ अञ्जनाकृतपूजावान् आञ्जनेयकरार्चितः । अञ्जनाद्रिनिवासश्च मुञ्जकेशः पुरन्दरः
    ॥ १५३॥ किन्नरद्वयसम्बन्धिबन्धमोक्षप्रदायकः । वैखानसमखारम्भो वृषज्ञेयो वृषाचलः ॥ १५४॥ वृषकायप्रभेत्ता
    च क्रीडनाचारसंभ्रमः । सौवर्चलेयविन्यस्तराज्यो नारायण प्रियः ॥ १५५॥ दुर्मेधोभञ्जकः प्राज्ञो ब्रह्मोत्सवमहोत्सुकः
    । भद्रासुरशिरश्चेता भद्रक्षेत्री सुभद्रवान् ॥ १५६॥ मृगयाऽक्षीणसन्नाहः शङ्खराजन्यतुष्टिदः । स्थाणुस्थो
    वैनतेयाङ्गभावितो ह्यशरीरवान् ॥ १५७॥ भोगीन्द्रभोगसंस्थानो ब्रह्मादिगणसेवितः । सहस्रार्कच्छटाभास्वद्यिमानन्तःस्थितो
    गुणी ॥ १५८॥ विष्वक्सेनकृतस्तोत्रः सनन्दनवरीवृताः । जाह्नव्यादिनदीसेव्यः सुरेशाद्यभिवन्दितः ॥ १५९॥
    सुराङ्गनानृत्यपरो गन्धर्वोद्गायनप्रियः । राकेन्दुसङ्काशनखः कोमलाङ्घ्रसरोरुहः ॥ १६०॥ कच्छपप्रपदः कुन्दगुल्पकः
    स्वच्छकूर्परः । मेदुरस्वर्णवस्त्राढ्यकटिदेशस्थमेखलः ॥ १६१॥ प्रोल्लसच्छुरिकाभास्वत्कटिदेशः शुभङ्करः
    । अनन्तपद्मजस्थाननाभिर्मौक्तिकमालिकः ॥ १६२॥ मन्दारचाम्पेयमाली रत्नाभरणसंभृतः । लम्बयज्ञोपवीती च चन्द्रश्रीखण्डलेपवान्
    ॥ १६३॥ वरदोऽभयदश्चक्री शङ्खी कौस्तुभदीप्तिमान् । श्रीवत्साङ्कितवक्षस्को लक्ष्मीसंश्रितहृत्तटः ॥ १६४॥
    नीलोत्पल निभाकारः शोणाम्भोजसमाननः । कोटीमन्मथलावण्यचन्द्रिकास्मितपूरितः ॥ १६५॥ सुधास्वच्छोर्ध्वपुण्ड्रश्च
    कस्तूरीतिलकाञ्चितः । पुण्डरीकेक्षणः स्वच्छो मौलिशोभाविराजितः ॥ १६६॥ पद्मस्थः पद्मनाभश्च सोममण्डलगो
    बुधः । वह्निमंडलगः सूर्यः सूर्यमण्डलसंस्थितः ॥ १६७॥ श्रीपतिर्भूमिजानिश्च विमलाद्यभिसंवृतः । जगत्कुटुम्बजनिता
    रक्षकः कामितप्रदः ॥ १६८॥ अवस्थात्रययन्ता च विश्वतेजस्स्वरूपवान् । ज्ञप्तिर्ज्ञेयो ज्ञानगम्यो ज्ञानातीतः
    सुरातिगः ॥ १६९॥ ब्रह्माण्डान्तर्बहिर्व्याप्तो वेङ्कटाद्रिगदाधरः । वेङ्कटाद्रिगदाधर ॐ नमः इति ॥ एवं
    श्रीवेङ्कटेशस्य कीर्तितं परमाद्भुतम् ॥ १७०॥ नाम्नां सहस्रं संश्राव्यं पवित्रं पुण्यवर्द्धनम् । श्रवणात्सर्वदोषघ्नं
    रोगघ्नं मृत्युनाशनम् ॥ १७१॥ दारिद्र्यभेदनं धर्म्यं सर्वैश्वर्यफलप्रदम् । कालाहिविषविच्छेदिज्वरापस्मारभञ्जनम्
    ॥ १७२॥ शत्रुक्षयकरं राजग्रहपीडानिवारणम् । ब्रह्मराक्षसकूष्मांडभेतालभयभंजनम् ॥ १७३॥ विद्याभिलाषी विद्यावान्
    धनार्थी धनवान् भवेत् । अनन्तकल्पजीवी स्यादायुष्कामो महायशाः ॥ १७४॥ पुत्रार्थी सुगुणान्पुत्रान् लभेताऽऽयुष्मतस्तनः
    । सङ्ग्रामे शत्रुविजयी सभायां प्रतिवादिजित् ॥ १७५॥ दिव्यैर्नामभिरेभिस्तु तुलसीपूजनात्सकृत् । वैकुण्ठवासी
    भगवत्सदृशो विष्णुसन्निधौ ॥ १७६॥ कह्लारपूजनान्मासात् द्वितीय इव यक्षराट् । नीलोत्पलार्चनात्सर्वराजपूज्यः
    सदा भवेत् ॥ १७७॥ हृत्संस्थितैर्नामभिस्तु भूयाद्दृग्विषयो हरिः । वाञ्छितार्थ तदा दत्वा वैकुण्ठं च प्रयच्छति
    ॥ १७८॥ त्रिसन्ध्यं यो जपेन्नित्यं संपूज्य विधिना विभुम् । त्रिवारं पञ्चवारं वा प्रत्यहं क्रमशो यमी
    ॥ १७९॥ मासादलक्ष्मीनाशः स्यात् द्विमासात् स्यान्नरेन्द्रता । त्रिमासान्महदैश्वर्यं ततस्संभाषणं भवेत्
    ॥ १८०॥ मासं पठन्न्यूनकर्ममूर्तिं च समवाप्नुयात् । मार्गभ्रष्टश्च सन्मार्गं गतस्वः स्वं स्वकीयकम् ॥
    १८१॥ चाञ्चल्यचित्तोऽचाञ्चल्यं मनस्स्वास्थ्यं च गच्छति । आयुरारोग्यमैश्वर्यं ज्ञानं मोक्षं च विन्दति
    ॥ १८२॥ सर्वान्कामानवाप्नोति शाश्वतं च पदं तथा । सत्यं सत्यं पुनस्सत्यं सत्यं सत्यं न संशयः ॥ १८३॥
    श्री ब्रह्माण्डपुराणे वसिष्ठनारदसंवादे श्रीवेङ्कटाचलमाहात्म्ये श्री वेङ्कटेश सहस्रनाम स्तोत्राध्यायः
    समाप्तः ॥
