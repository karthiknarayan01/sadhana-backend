id: ishvaraproktamshivastotram
category: stotram
name:
  english: ishvaraproktamshivastotram
  devanagari: ईश्वरप्रोक्तंशिवस्तोत्रम्
content:
  english: stutaya stutirupaya stuyamanaya sarvada | stutihetunidhanaya namastrinayanaya te || 12|| devaya
    divyarupaya namo divyatamaya te | paraya parameshaya paramarthaikahetave || 13|| paraparavimuktaya
    namah parataraya te | pujyaya pujyapujyaya sarvapujyaikahetave || 14|| pujyanamapi pujyaya namah pujyatamaya
    te | nityaya nityanityaya sarvanityaikahetave || 15|| nityanamapi nityaya namo nityatamaya te | diptaya
    diptadiptaya sarvadiptyekahetave || 16|| diptanamapi diptaya namo diptatamaya te | saraya sararupaya
    sarvasaraikahatave || 17|| saranamapi saraya namah sarataraya te | shantaya shantarupaya sarvashantyekahetave
    || 18|| shuddhanamapi shuddhaya namah shuddhatamaya te | kalaya kalarupaya sarvakalaikahetave || 19||
    kalanamapi kalaya namah kalatamaya te | sarvamantrashariraya sarvamantraikahetave || 20|| mantranamapi
    mantraya namo mantratamaya te | vyomapramanarupaya ishanaya namo namah || 21|| vyomapramanabhasaya
    aghoraya namo namah | vyomapramanasadyaya sadyojataya te namah || 22|| vyomapramanavidyaya vidyeshaya
    namo namah | vyomapramanakalaya kaleshaya namo namah || 23|| vyomapramanadharmaya dharmeshaya namo
    namah | vyomapramanabhogaya bhogeshaya namo namah || 24|| vyomapramamamokshaya moksheshaya namo namah
    | vyomapramanavishvaya vishveshvara namo'stu te || 25|| ekadehadvidehaya bahudehaya te namah | dehatitamarajnaya
    vishveshaya namo'stu te || 26|| ekakaladvikalaya bahukalaya te namah | kalasankhyasvarupaya trinetraya
    namo namah || 27|| ekavaktradvivaktraya bahuvaktraya te namah | vaktrasankhyeyayuktaya vaktreshaya
    namo namah || 28|| ekanetradvinetraya bahunetraya te namah | netrasankhyeyayuktaya tryambakaya namo
    namah || 29|| ekakanthadvikanthaya bahukanthaya te namah | ekanasadvinasaya bahunasaya te namah ||
    30|| nasa'sankhyeyayuktaya nityam sharvaya te namah | ekajihvadvijihvaya bahujihvaya te namah || 31||
    jihva'sankhyeyayuktaya nilakanthaya te namah | ekahastadvihastaya bahuhastaya te namah || 32|| hastasankhyeyayuktaya
    shankaraya namo namah | ekashastradvishastraya bahushastraya te namah || 33|| shastrasankhyeyayuktaya
    ishanaya namo namah | ekapadadvipadaya bahupadaya te namah || 34|| padasankhyeyayuktaya mahadeva namo'stu
    te | avyaktaya namastubhyam shashvataya namo namah || 35|| maheshvara namaste'stu mahayoginnamo'stu
    te | mahottama namaste'stu maharupa namo'stu te || 36|| sadashiva namaste'stu sadashuddha namo'stu
    te | sadojjvala namaste'stu mahadeva namo'stu te || 37|| namaste bhagavan shanta namaste bhagavan
    dhruva namaste bhagavan dipta namaste bhagavan hara || 38|| ajitaya namastubhyam bhasmangaya namo'stu
    te | anantaya namastubhyam sarvagaya namo'stu te || 39||
  devanagari: स्तुताय स्तुतिरूपाय स्तूयमानाय सर्वदा । स्तुतिहेतुनिधानाय नमस्त्रिणयनाय ते ॥ १२॥ देवाय दिव्यरूपाय
    नमो दिव्यतमाय ते । पराय परमेशाय परमार्थैकहेतवे ॥ १३॥ परापरविमुक्ताय नमः परतराय ते । पूज्याय पूज्यपूज्याय
    सर्वपूज्यैकहेतवे ॥ १४॥ पूज्यानामपि पूज्याय नमः पूज्यतमाय ते । नित्याय नित्यनित्याय सर्वनित्यैकहेतवे
    ॥ १५॥ नित्यानामपि नित्याय नमो नित्यतमाय ते । दीप्ताय दीप्तदीप्ताय सर्वदीप्त्येकहेतवे ॥ १६॥ दीप्तनामपि
    दीप्ताय नमो दीप्ततमाय ते । साराय साररूपाय सर्वसारैकहतवे ॥ १७॥ साराणामपि साराय नमः सारतराय ते । शान्ताय
    शान्तरूपाय सर्वशान्त्येकहेतवे ॥ १८॥ शुद्धानामपि शुद्धाय नमः शुद्धतमाय ते । कालाय कालरूपाय सर्वकालैकहेतवे
    ॥ १९॥ कालानामपि कालाय नमः कालतमाय ते । सर्वमन्त्रशरीराय सर्वमन्त्रैकहेतवे ॥ २०॥ मन्त्राणामपि मन्त्राय
    नमो मन्त्रतमाय ते । व्योमप्रमाणरूपाय ईशानाय नमो नमः ॥ २१॥ व्योमप्रमाणभासाय अघोराय नमो नमः । व्योमप्रमाणसद्याय
    सद्योजाताय ते नमः ॥ २२॥ व्योमप्रमाणविद्याय विद्येशाय नमो नमः । व्योमप्रमाणकालाय कालेशाय नमो नमः ॥
    २३॥ व्योमप्रमाणधर्माय धर्मेशाय नमो नमः । व्योमप्रमाणभोगाय भोगेशाय नमो नमः ॥ २४॥ व्योमप्रमाममोक्षाय
    मोक्षेशाय नमो नमः । व्योमप्रमाणविश्वाय विश्वेश्वर नमोऽस्तु ते ॥ २५॥ एकदेहद्विदेहाय बहुदेहाय ते नमः
    । देहातीतामरज्ञाय विश्वेशाय नमोऽस्तु ते ॥ २६॥ एककालद्विकालाय बहुकालाय ते नमः । कालसङ्ख्यास्वरूपाय
    त्रिणेत्राय नमो नमः ॥ २७॥ एकवक्त्रद्विवक्त्राय बहुवक्त्राय ते नमः । वक्त्रासङ्ख्येययुक्ताय वक्त्रेशाय
    नमो नमः ॥ २८॥ एकनेत्रद्विनेत्राय बहुनेत्राय ते नमः । नेत्रासङ्ख्येययुक्ताय त्र्यम्बकाय नमो नमः ॥ २९॥
    एककण्ठद्विकण्ठाय बहुकण्ठाय ते नमः । एकनासद्विनासाय बहुनासाय ते नमः ॥ ३०॥ नासाऽसङ्ख्येययुक्ताय नित्यं
    शर्वाय ते नमः । एकजिह्वद्विजिह्वाय बहुजिह्वाय ते नमः ॥ ३१॥ जिह्वाऽसङ्ख्येययुक्ताय नीलकण्ठाय ते नमः
    । एकहस्तद्विहस्ताय बहुहस्ताय ते नमः ॥ ३२॥ हस्तासङ्ख्येययुक्ताय शङ्कराय नमो नमः । एकशस्त्रद्विशस्त्राय
    बहुशस्त्राय ते नमः ॥ ३३॥ शस्त्रासङ्ख्येययुक्ताय ईशानाय नमो नमः । एकपादद्विपादाय बहुपादाय ते नमः ॥
    ३४॥ पादासङ्ख्येययुक्ताय महादेव नमोऽस्तु ते । अव्यक्ताय नमस्तुभ्यं शाश्वताय नमो नमः ॥ ३५॥ महेश्वर नमस्तेऽस्तु
    महायोगिन्नमोऽस्तु ते । महोत्तम नमस्तेऽस्तु महारूप नमोऽस्तु ते ॥ ३६॥ सदाशिव नमस्तेऽस्तु सदाशुद्ध नमोऽस्तु
    ते । सदोज्ज्वल नमस्तेऽस्तु महादेव नमोऽस्तु ते ॥ ३७॥ नमस्ते भगवन् शान्त नमस्ते भगवन् ध्रुव नमस्ते भगवन्
    दीप्त नमस्ते भगवन् हर ॥ ३८॥ अजिताय नमस्तुभ्यं भस्माङ्गाय नमोऽस्तु ते । अनन्ताय नमस्तुभ्यं सर्वगाय
    नमोऽस्तु ते ॥ ३९॥
