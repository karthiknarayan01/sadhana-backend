id: annamayya-keerthanas-nagavulu-nijamini
category: stotram
name:
  english: Annamayya Keerthanas Nagavulu Nijamini
content:
  english: sa pallavi nagavulu nijamani nammeda | vòginadiyasalu vòddanave || tòlliti karmamu dòntala
    nundaga | cèllaboyika jeseda | yèlla lokamulu yeleti devuda | vòlla nòllanika nòddanave || nagavulu
    nijamani nammeda poyina janmamu pòrugulanundaga | ciyanaka yindu jèlageda | veyinamamula vènnudamayalu
    | o yayya yinka nòddanave || caranam nali ninamamu nalikanundaga | talakòni yitaramu cadaveda | balu
    shri venkatapati ninnugòlici | vòluku cancalamu lòddanave || nagavulu nijamani nammeda | vòginadiyasalu
    vòddanave ||
  devanagari: स पल्लवि नगवुलु निजमनि नम्मेदा । वॊगिनडियासलु वॊद्दनवे ॥ तॊल्लिटि कर्ममु दॊन्तल नुण्डग ।
    चॆल्लबोयिक जेसेदा । यॆल्ल लोकमुलु येलेटि देवुड । वॊल्ल नॊल्लनिक नॊद्दनवे ॥ नगवुलु निजमनि नम्मेदा पोयिन
    जन्ममु पॊरुगुलनुण्डग । चीयनक यिन्दु जॆलगेदा । वेयिनाममुल वॆन्नुडमायलु । ओ यय्य यिङ्क नॊद्दनवे ॥ चरणं
    नलि नीनाममु नालिकनुण्डग । तलकॊनि यितरमु चडवेदा । बलु श्री वेङ्कटपति निन्नुगॊलिचि । वॊलुकु चञ्चलमु
    लॊद्दनवे ॥ नगवुलु निजमनि नम्मेदा । वॊगिनडियासलु वॊद्दनवे ॥
