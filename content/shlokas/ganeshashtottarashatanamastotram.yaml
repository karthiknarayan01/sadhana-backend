id: ganeshashtottarashatanamastotram
category: stotram
name:
  english: ganeshashtottarashatanamastotram
  devanagari: गणेशाष्टोत्तरशतनामस्तोत्रम्
content:
  english: jnanada guhagraja brahmapa parshvaputra vadantamevam tyajata prabhitah || 43|| sindhoshca shatro
    parashuprapane shamisha pushpapriya vighnaharin | durvabharairarcita devadeva vadantamevam tyajata
    prabhitah || 44|| dhiyah pradatashca shamipriyeti susiddhidatashca sushantidatah | ameyamayamitavikrameti
    vadantamevam tyajata prabhitah || 45|| dvidha caturthipriya kashyapajja dhanaprada jnanaprada prakasha
    | cintamane cittaviharakarin vadantamevam tyajata prabhitah || 46|| yamasya shatro abhimanashatro
    vidherjahantah kapilasya suno | vidherjahantah
  devanagari: ज्ञानद गुहाग्रज ब्रह्मप पार्श्वपुत्र वदन्तमेवं त्यजत प्रभीताः ॥ ४३॥ सिन्धोश्च शत्रो परशुप्रपाणे
    शमीश पुष्पप्रिय विघ्नहारिन् । दूर्वाभरैरर्चित देवदेव वदन्तमेवं त्यजत प्रभीताः ॥ ४४॥ धियः प्रदातश्च
    शमीप्रियेति सुसिद्धिदातश्च सुशान्तिदातः । अमेयमायामितविक्रमेति वदन्तमेवं त्यजत प्रभीताः ॥ ४५॥ द्विधा
    चतुर्थीप्रिय कश्यपाज्ज धनप्रद ज्ञानप्रद प्रकाश । चिन्तामणे चित्तविहारकारिन् वदन्तमेवं त्यजत प्रभीताः
    ॥ ४६॥ यमस्य शत्रो अभिमानशत्रो विधेर्जहन्तः कपिलस्य सूनो । विधेर्जहन्तः
