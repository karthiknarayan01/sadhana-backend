id: devaihkritam20shivastotram
category: stotram
name:
  english: devaihkritam20shivastotram
  devanagari: देवैःकृतं२०शिवस्तोत्रम्
content:
  english: 20|| indrasomagnivaruna devasuramahoragah | prahvastvamanutishthanti stuvanto vividhaih stavaih
    || 21|| tvaya vyaptani bhutani sarvani bhuvaneshvara | tvayi tushte jagattushtam tvayi kruddhe mahadbhayam
    || 22|| bhayanamapanetasi tvamekah shatrusudanah | asuranam samarthanam vinashashca tvaya kritah ||
    23|| na ca vikramanairdeva nirvanamagamatparam | tvam hi kartta vikartta ca bhutanamiha sarvashah
    || 24|| aradhayitva sarve te namasyanti ca sarvashah || iti shriskandapurane avantyakhande caturashitilingamahatmye
    shodashadhyayantargatam devaih kritam shivastotram samaptam | skandapurana | avantyakhanda | revakhanda
    | adhyaya 193
  devanagari: २०॥ इन्द्रसोमाग्निवरुणा देवासुरमहोरगाः । प्रह्वास्त्वामनुतिष्ठन्ति स्तुवन्तो विविधैः स्तवैः
    ॥ २१॥ त्वया व्याप्तानि भूतानि सर्वाणि भुवनेश्वर । त्वयि तुष्टे जगत्तुष्टं त्वयि क्रुद्धे महद्भयम्
    ॥ २२॥ भयानामपनेतासि त्वमेकः शत्रुसूदनः । असुराणां समर्थानां विनाशश्च त्वया कृतः ॥ २३॥ न च विक्रमणैर्देव
    निर्वाणमगमत्परम् । त्वं हि कर्त्ता विकर्त्ता च भूतानामिह सर्वशः ॥ २४॥ आराधयित्वा सर्वे ते नमस्यन्ति
    च सर्वशः ॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये षोडषाध्यायान्तर्गतं देवैः कृतं
    शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । रेवाखण्ड । अध्याय १९३
meaning: {}
