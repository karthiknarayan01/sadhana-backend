    नमः । ६० ॐ ऐं ग्लौं शिवायै नमः । ॐ ऐं ग्लौं स्वधायै नमः । ॐ ऐं ग्लौं चण्ड्यै नमः । ॐ ऐं ग्लौं दुर्गायै
