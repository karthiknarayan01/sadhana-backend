id: nigamanashlokah
category: stotram
name:
  english: nigamanashlokah
  devanagari: निगमनश्लोकाः
content:
  english: nigamana shlokah || shri || || shrimate ramanujaya namah || sarvadeshadashakaleshvavyahataparakrama
    | ramanujaryadivyajna vardhatamabhivardhatam || 1|| ramanujaryadivyajna prativasaramujjvala | digantavyapini
    bhuyat sa hi lokahitaishini || 2|| natah param kimapi me tvayi nathaniyam matardaye
  devanagari: निगमन श्लोकाः ॥ श्री ॥ ॥ श्रीमते रामानुजाय नमः ॥ सर्वदेशदशाकालेष्वव्याहतपराक्रमा । रामानुजार्यदिव्याज्ञा
    वर्धतामभिवर्धताम् ॥ १॥ रामानुजार्यदिव्याज्ञा प्रतिवासरमुज्ज्वला । दिगन्तव्यापिनी भूयात् सा हि लोकहितैषिणी
    ॥ २॥ नातः परं किमपि मे त्वयि नाथनीयं मातर्दये
meaning: {}
