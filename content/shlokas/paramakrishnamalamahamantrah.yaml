id: paramakrishnamalamahamantrah
category: mantra
name:
  english: paramakrishnamalamahamantrah
  devanagari: परमकृष्णमालामहामन्त्रः
content:
  english: chayasu ratnasanamadhyasamstham | radhasamalingitavamabhagam vande param shyamamacintyarupam
    || venum vahantam madhurasmitadhyam pitambaram kaustubhabhasitangam | gopiganaih sevitapadapadmam
    bhaje param premamayam mukundam || || malamantrah || om hrim shrim klim glaum paramakrishna paramatman
    radhapranavallabha golokanatha gopijanajivana nandanandana shyamasundara venuvilasin rasikeshvara
    rasamandalamadhyavartin premamritasindho bhaktavatsala karunanidhe anandarupa saccidanandavigraha
    darshaya darshaya | prakashaya prakashaya | avirbhavaya avirbhavaya | premam dehi dehi | bhaktim dehi
    dehi | karunam kuru kuru | cittam shuddhaya shuddhaya | moham hara hara | ajnanam bhinddhi bhinddhi
    | duhkham nashaya nashaya | vighnan daha daha | sarvasankatan chindhi chindhi | hridaye nivasa nivasa
    | radhaya saha rama rama | golokam smaraya smaraya | rasanandam puraya puraya | hrim shrim klim glaum
    hum phat svaha || || phalashrutih || yah pathenmalamantram vai shraddhabhaktisamanvitah | tasya citte
    vasetkrishno radhaya saha sarvada || bhaktim prema param jnanam shantim saukhyam manogatam | dadati
    paramakrishnah prasanno bhaktavatsalah || || iti shriparamakrishnamalamahamantrah sampurnah ||
  devanagari: छायासु रत्नासनमध्यसंस्थम् । राधासमालिङ्गितवामभागं वन्दे परं श्याममचिन्त्यरूपम् ॥ वेणुं वहन्तं
    मधुरस्मिताढ्यं पीताम्बरं कौस्तुभभासिताङ्गम् । गोपीगणैः सेवितपादपद्मं भजे परं प्रेममयं मुकुन्दम् ॥
    ॥ मालामन्त्रः ॥ ॐ ह्रीं श्रीं क्लीं ग्लौं परमकृष्ण परमात्मन् राधाप्राणवल्लभ गोलोकनाथ गोपीजनजीवन नन्दनन्दन
    श्यामसुन्दर वेणुविलासिन् रसिकेश्वर रासमण्डलमध्यवर्तिन् प्रेमामृतसिन्धो भक्तवत्सल करुणानिधे आनन्दरूप
    सच्चिदानन्दविग्रह दर्शय दर्शय । प्रकाशय प्रकाशय । आविर्भावय आविर्भावय । प्रेमं देहि देहि । भक्तिं
    देहि देहि । करुणां कुरु कुरु । चित्तं शुद्धय शुद्धय । मोहं हर हर । अज्ञानं भिन्द्धि भिन्द्धि । दुःखं
    नाशय नाशय । विघ्नान् दह दह । सर्वसङ्कटान् छिन्धि छिन्धि । हृदये निवस निवस । राधया सह रम रम । गोलोकं
    स्मारय स्मारय । रसानन्दं पूरय पूरय । ह्रीं श्रीं क्लीं ग्लौं हूं फट् स्वाहा ॥ ॥ फलश्रुतिः ॥ यः पठेन्मालामन्त्रं
    वै श्रद्धाभक्तिसमन्वितः । तस्य चित्ते वसेत्कृष्णो राधया सह सर्वदा ॥ भक्तिं प्रेम परं ज्ञानं शान्तिं
    सौख्यं मनोगतम् । ददाति परमकृष्णः प्रसन्नो भक्तवत्सलः ॥ ॥ इति श्रीपरमकृष्णमालामहामन्त्रः सम्पूर्णः
    ॥
