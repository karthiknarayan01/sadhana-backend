id: annamayya-keerthanas-chandamama-raavo
category: stotram
name:
  english: Annamayya Keerthanas Chandamama Raavo
content:
  english: adi pallavi candamama ravo jabilli ravo kundanapu paidi kora vènna palu tevo || nagumomu cakkani
    yayyaku naluva buttincina tandriki nigamamu landunde yappaku ma nila varnuniki | jagamèlla nelina
    svamiki cakkani indira maganiki muguriki mòdalaina ghanuniki ma muddula murari baluniki || kundanapu
    paidi kora vènna palu tevo candamama ravo jabilli ravo kundanapu paidi kora vènna palu tevo tèlidammi
    kannula metiki manci tiyyani matala gummaku kaliki cetala kodèkuma katala kari i biddaku | kula muddhincina
    pattèku manci gunamulu kaligina kodèku niluvèlla nindu vòyyariki nava nidhula cupula juse sugununaku||
    kundanapu paidi kora vènna palu tevo candamacma ravo jabilli ravo kundanapu paidi kora vènna palu
    tevo surala gacina devaraku cuncu garuduni nèkkina gabbiki nèravadi buddhula pèddaku ma nitu cetala
    pattiki | virula vinti vani yayyaku vevelu rupula svamiki sirimincu nèravadi janaku ma shri venkateshvaruniki
    || kundanapu paidi kora vènna palu tevo candamama ravo jabilli ravo kundanapu paidi kora vènna palu
    tevo
  devanagari: आदि पल्लवि चन्दमाम रावो जाबिल्लि रावो कुन्दनपु पैडि कोर वॆन्न पालु तेवो ॥ नगुमोमु चक्कनि
    यय्यकु नलुव बुट्टिञ्चिन तण्ड्रिकि निगममु लन्दुण्डे यप्पकु मा नील वर्णुनिकि । जगमॆल्ल नेलिन स्वामिकि
    चक्कनि इन्दिर मगनिकि मुगुरिकि मॊदलैन घनुनिकि मा मुद्दुल मुरारि बालुनिकि ॥ कुन्दनपु पैडि कोर वॆन्न
    पालु तेवो चन्दमाम रावो जाबिल्लि रावो कुन्दनपु पैडि कोर वॆन्न पालु तेवो तॆलिदम्मि कन्नुल मेटिकि मञ्चि
    तिय्यनि माटल गुम्मकु कलिकि चेतल कोडॆकुमा कतल कारि ई बिड्डकु । कुल मुद्धिञ्चिन पट्टॆकु मञ्चि गुणमुलु
    कलिगिन कोडॆकु निलुवॆल्ल निण्डु वॊय्यारिकि नव निधुल चूपुल जूसे सुगुणुनकु॥ कुन्दनपु पैडि कोर वॆन्न पालु
    तेवो चन्दमाच्म रावो जाबिल्लि रावो कुन्दनपु पैडि कोर वॆन्न पालु तेवो सुरल गाचिन देवरकु चुञ्चु गरुडुनि
    नॆक्किन गब्बिकि नॆरवादि बुद्धुल पॆद्दकु मा नीटु चेतल पट्टिकि । विरुल विण्टि वानि यय्यकु वेवेलु रूपुल
    स्वामिकि सिरिमिञ्चु नॆरवादि जाणकु मा श्री वेङ्कटेश्वरुनिकि ॥ कुन्दनपु पैडि कोर वॆन्न पालु तेवो चन्दमाम
    रावो जाबिल्लि रावो कुन्दनपु पैडि कोर वॆन्न पालु तेवो
