id: sri-surya-panjara-stotram
category: stotram
name:
  english: Sri Surya Panjara Stotram
content:
  english: om udayagirimupetam bhaskaram padmahastam sakalabhuvananetram ratnarajjupameyam | timirakarimrigendram
    bodhakam padmininam suravaramabhivandyam sundaram vishvadipam || || om shikhayam bhaskaraya namah
    | lalate suryaya namah | bhrumadhye bhanave namah | karnayoh divakaraya namah | nasikayam bhanave
    namah | netrayoh savitre namah | mukhe bhaskaraya namah | oshthayoh parjanyaya namah | padayoh prabhakaraya
    namah || || om hram hrim hrum hraim hraum hrah | om hamsam hamsim hamsum hamsaim hamsaum hamsah ||
    || om satyatejojjvalajvalamaline manikumbhaya hum phat svaha | om sthitirupakakaranaya purvadigbhage
    mam rakshatu || || om brahmatejojjvalajvalamaline manikumbhaya hum phat svaha | om tarakabrahmarupaya
    parayantra sarvopadravanashanartham dakshinadigbhage mam rakshatu || || om vishnutejojjvalajvalamaline
    manikumbhaya hum phat svaha | om pracandamartanda ugratejorupine mukuravarnaya tejovarnaya mama sarvarajastripurusha
    vashikaranartham pashcimadigbhage mam rakshatu || || om rudratejojjvalajvalamaline manikumbhaya hum
    phat svaha | om bhavaya rudrarupine uttaradigbhage sarvamrityopashamanartham mam rakshatu || || om
    agnitejojjvalajvalamaline manikumbhaya hum phat svaha | om timiratejase sarvaroganivaranaya urdhvadigbhage
    mam rakshatu || || om sarvatejojjvalajvalamaline manikumbhaya hum phat svaha | om namaskarapriyaya
    shrisuryanarayanaya adhodigbhage sarvabhishtasiddhyartham mam rakshatu || || martandaya namah bhanave
    namah hamsaya namah suryaya namah divakaraya namah tapanaya namah bhaskaraya namah mam rakshatu ||
    bhaskarebhyo namah shirasthane mam rakshatu || || suryadi navagrahebhyo namah lalatasthane mam rakshatu
    || || dharaya namah dhrivaya namah somaya namah atharvaya namah anilaya namah analaya namah pratyushaya
    namah pratapaya namah murdhnisthane mam rakshatu || || virabhadraya namah girishaya namah shambhave
    namah ajaikapade namah ahirbudhne namah pinakine namah bhuvanadhishvaraya namah dishantapataye namah
    pashupataye namah sthanave namah bhavaya namah lalatasthane mam rakshatu || || dhatre namah amshumate
    namah pushne namah parjanyaya namah vishnave namah netrasthane mam rakshatu || || arunaya namah suryaya
    namah indraya namah ravaye namah suvarnaretase namah yamaya namah divakaraya namah karnasthane mam
    rakshatu || || asitangabhairavaya namah rurubhairavaya namah candabhairavaya namah krodhabhairavaya
    namah unmattabhairavaya namah bhishanabhairavaya namah kalabhairavaya namah samharabhairavaya namah
    mukhasthane mam rakshatu || || brahmyai namah maheshvaryai namah kaumaryai namah vaishnavyai namah
    varahyai namah indranyai namah camundayai namah kanthasthane mam rakshatu || || indraya namah agnaye
    namah yamaya namah nir ritaye namah varunaya namah vayave namah kuberaya namah ishanaya namah bahusthane
    mam rakshatu || || meshadidvadasharashibhyo namah hridayasthane mam rakshatu || || vajrayudhaya namah
    shaktyayudhaya namah dandayudhaya namah khadgayudhaya namah pashayudhaya namah ankushayudhaya namah
    gadayudhaya namah trishulayudhaya namah padmayudhaya namah cakrayudhaya namah katisthane mam rakshatu
    || || mitraya namah dakshinahaste mam rakshatu | ravaye namah vamahaste mam rakshatu | suryaya namah
    hridaye mam rakshatu | bhanave namah murdhnisthane mam rakshatu | khagaya namah dakshinapade mam rakshatu
    | pushne namah vamapade mam rakshatu | hiranyagarbhaya namah nabhisthane mam rakshatu | maricaye namah
    kanthasthane mam rakshatu | adityaya namah dakshinacakshushi mam rakshatu | savitre namah vamacakshushi
    mam rakshatu | bhaskaraya namah haste mam rakshatu | arkaya namah kavace mam rakshatu || om bhaskaraya
    vidmahe mahadyutikaraya dhimahi | tanno adityah pracodayat || || iti shri surya panjara stotram ||
  devanagari: ॐ उदयगिरिमुपेतं भास्करं पद्महस्तं सकलभुवननेत्रं रत्नरज्जूपमेयम् । तिमिरकरिमृगेन्द्रं बोधकं
    पद्मिनीनां सुरवरमभिवन्द्यं सुन्दरं विश्वदीपम् ॥ ॥ ॐ शिखायां भास्कराय नमः । ललाटे सूर्याय नमः । भ्रूमध्ये
    भानवे नमः । कर्णयोः दिवाकराय नमः । नासिकायां भानवे नमः । नेत्रयोः सवित्रे नमः । मुखे भास्कराय नमः
    । ओष्ठयोः पर्जन्याय नमः । पादयोः प्रभाकराय नमः ॥ ॥ ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः । ॐ हंसां
    हंसीं हंसूं हंसैं हंसौं हंसः ॥ ॥ ॐ सत्यतेजोज्ज्वलज्वालामालिने मणिकुम्भाय हुं फट् स्वाहा । ॐ स्थितिरूपककारणाय
    पूर्वादिग्भागे मां रक्षतु ॥ ॥ ॐ ब्रह्मतेजोज्ज्वलज्वालामालिने मणिकुम्भाय हुं फट् स्वाहा । ॐ तारकब्रह्मरूपाय
    परयन्त्र सर्वोपद्रवनाशनार्थं दक्षिणदिग्भागे मां रक्षतु ॥ ॥ ॐ विष्णुतेजोज्ज्वलज्वालामालिने मणिकुम्भाय
    हुं फट् स्वाहा । ॐ प्रचण्डमार्ताण्ड उग्रतेजोरूपिणे मुकुरवर्णाय तेजोवर्णाय मम सर्वराजस्त्रीपुरुष वशीकरणार्थं
    पश्चिमदिग्भागे मां रक्षतु ॥ ॥ ॐ रुद्रतेजोज्ज्वलज्वालामालिने मणिकुम्भाय हुं फट् स्वाहा । ॐ भवाय रुद्ररूपिणे
    उत्तरदिग्भागे सर्वमृत्योपशमनार्थं मां रक्षतु ॥ ॥ ॐ अग्नितेजोज्ज्वलज्वालामालिने मणिकुम्भाय हुं फट्
    स्वाहा । ॐ तिमिरतेजसे सर्वरोगनिवारणाय ऊर्ध्वदिग्भागे मां रक्षतु ॥ ॥ ॐ सर्वतेजोज्ज्वलज्वालामालिने मणिकुम्भाय
    हुं फट् स्वाहा । ॐ नमस्कारप्रियाय श्रीसूर्यनारायणाय अधोदिग्भागे सर्वाभीष्टसिद्ध्यर्थं मां रक्षतु ॥
    ॥ मार्ताण्डाय नमः भानवे नमः हंसाय नमः सूर्याय नमः दिवाकराय नमः तपनाय नमः भास्कराय नमः मां रक्षतु ॥
    भास्करेभ्यो नमः शिरस्थाने मां रक्षतु ॥ ॥ सूर्यादि नवग्रहेभ्यो नमः ललाटस्थाने मां रक्षतु ॥ ॥ धराय नमः
    धृवाय नमः सोमाय नमः अथर्वाय नमः अनिलाय नमः अनलाय नमः प्रत्यूषाय नमः प्रतापाय नमः मूर्ध्निस्थाने मां
    रक्षतु ॥ ॥ वीरभद्राय नमः गिरीशाय नमः शम्भवे नमः अजैकपदे नमः अहिर्बुध्ने नमः पिनाकिने नमः भुवनाधीश्वराय
    नमः दिशान्तपतये नमः पशुपतये नमः स्थाणवे नमः भवाय नमः ललाटस्थाने मां रक्षतु ॥ ॥ धात्रे नमः अंशुमते
    नमः पूष्णे नमः पर्जन्याय नमः विष्णवे नमः नेत्रस्थाने मां रक्षतु ॥ ॥ अरुणाय नमः सूर्याय नमः इन्द्राय
    नमः रवये नमः सुवर्णरेतसे नमः यमाय नमः दिवाकराय नमः कर्णस्थाने मां रक्षतु ॥ ॥ असिताङ्गभैरवाय नमः रुरुभैरवाय
    नमः चण्डभैरवाय नमः क्रोधभैरवाय नमः उन्मत्तभैरवाय नमः भीषणभैरवाय नमः कालभैरवाय नमः संहारभैरवाय नमः
    मुखस्थाने मां रक्षतु ॥ ॥ ब्राह्म्यै नमः महेश्वर्यै नमः कौमार्यै नमः वैष्णव्यै नमः वराह्यै नमः इन्द्राण्यै
    नमः चामुण्डायै नमः कण्ठस्थाने मां रक्षतु ॥ ॥ इन्द्राय नमः अग्नये नमः यमाय नमः निर् ऋतये नमः वरुणाय
    नमः वायवे नमः कुबेराय नमः ईशानाय नमः बाहुस्थाने मां रक्षतु ॥ ॥ मेषादिद्वादशराशिभ्यो नमः हृदयस्थाने
    मां रक्षतु ॥ ॥ वज्रायुधाय नमः शक्त्यायुधाय नमः दण्डायुधाय नमः खड्गायुधाय नमः पाशायुधाय नमः अङ्कुशायुधाय
    नमः गदायुधाय नमः त्रिशूलायुधाय नमः पद्मायुधाय नमः चक्रायुधाय नमः कटिस्थाने मां रक्षतु ॥ ॥ मित्राय
    नमः दक्षिणहस्ते मां रक्षतु । रवये नमः वामहस्ते मां रक्षतु । सूर्याय नमः हृदये मां रक्षतु । भानवे नमः
    मूर्ध्निस्थाने मां रक्षतु । खगाय नमः दक्षिणपादे मां रक्षतु । पूष्णे नमः वामपादे मां रक्षतु । हिरण्यगर्भाय
    नमः नाभिस्थाने मां रक्षतु । मरीचये नमः कण्ठस्थाने मां रक्षतु । आदित्याय नमः दक्षिणचक्षूषि मां रक्षतु
    । सवित्रे नमः वामचक्षुषि मां रक्षतु । भास्कराय नमः हस्ते मां रक्षतु । अर्काय नमः कवचे मां रक्षतु ॥
    ॐ भास्कराय विद्महे महाद्युतिकराय धीमहि । तन्नो आदित्यः प्रचोदयात् ॥ ॥ इति श्री सूर्य पञ्जर स्तोत्रम्
    ॥
