id: ganeshastotrambauddha
category: stotram
name:
  english: ganeshastotrambauddha
  devanagari: गणेशस्तोत्रम्बौद्ध
content:
  english: strailokyashcaryamurtirjayati trijagatamishvarah kunjarasyah || 5|| ganapatishca herambo vighnarajo
    vinayakah | deviputro mahateja mahabalaparakramah || 6|| mahodaro mahakayashcaikadanto gajananah |
    shvetavastro mahadiptastrinetro gananayakah || 7|| akshamalam ca dantam ca grihnan vai dakshine kare
    | parashum modakapatram ca vamahaste vidharayan || 8|| nanapushparato devo nanagandhanulepanah | nagayajnopavitango
    nanavighnavinashanah || 9|| devasuramanushyanam siddhagandharvavanditam | trailokyavighnahartaramakhvarudham
    namamyaham || 10|| sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnarajo vinayakah
    || 11|| dhumraketurganadhyaksho bhalacandro gajananah | vakratundah shurpakarno herambah skandapurvajah
    || 12|| shodashaitani namani yah pathecchunuyadapi | vidyarambhe vivahe ca praveshe nirgame tatha
    || 13|| sangrame sankate caiva vighnastasya na jayate | vighnavallikutharaya ganadhipataye namah ||
    14|| iti shriganeshastotram sampurnam ||
  devanagari: स्त्रैलोक्याश्चर्यमूर्तिर्जयति त्रिजगतामीश्वरः कुञ्जरास्यः ॥ ५॥ गणपतिश्च हेरम्बो विघ्नराजो
    विनायकः । देवीपुत्रो महातेजा महाबलपराक्रमः ॥ ६॥ महोदरो महाकायश्चैकदन्तो गजाननः । श्वेतवस्त्रो महादीप्तस्त्रिनेत्रो
    गणनायकः ॥ ७॥ अक्षमालां च दन्तं च गृह्णन् वै दक्षिणे करे । परशुं मोदकपात्रं च वामहस्ते विधारयन् ॥ ८॥
    नानापुष्परतो देवो नानागन्धानुलेपनः । नागयज्ञोपवीताङ्गो नानाविघ्नविनाशनः ॥ ९॥ देवासुरमनुष्याणां सिद्धगन्धर्ववन्दितम्
    । त्रैलोक्यविघ्नहर्तारमाख्वारूढं नमाम्यहम् ॥ १०॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो
    विघ्नराजो विनायकः ॥ ११॥ धूम्रकेतुर्गणाध्यक्षो भालचन्द्रो गजाननः । वक्रतुण्डः शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः
    ॥ १२॥ षोडशैतानि नामानि यः पठेच्छुणुयादपि । विद्यारम्भे विवाहे च प्रवेशे निर्गमे तथा ॥ १३॥ सङ्ग्रामे
    सङ्कटे चैव विघ्नस्तस्य न जायते । विघ्नवल्लीकुठाराय गणाधिपतये नमः ॥ १४॥ इति श्रीगणेशस्तोत्रं सम्पूर्णम्
    ॥
