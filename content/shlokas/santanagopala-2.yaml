id: santanagopala-2
category: shataka
name:
  english: santanagopala
  devanagari: सन्तानगोपाल
content:
  english: om shrim hrim klim glaum devakisuta govinda vasudeva jagatpate | om devakisuta govinda vasudeva
    jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || om namo bhagavate vasudevaya | atha
    santanagopalastotram | shrisham kamalapatraksham devakinandanam harim | sutasampraptaye krishnam namami
    madhusudanam || 1|| namamyaham vasudevam sutasampraptaye harim | yashodankagatam balam gopalam nandanandanam
    || 2|| asmakam putralabhaya govindam munivanditam | namamyaham vasudevam devakinandanam sada || 3|
    || gopalam dimbhakam vande kamalapatimacyutam | putrasampraptaye krishnam namami yadupungavam || 4||
    putrakameshtiphaladam kanjaksham kamalapatim | devakinandanam vande sutasampraptaye mama || 5|| padmapate
    padmanetra padmanabha janardana | dehi me tanayam shrisha vasudeva jagatpate || 6|| yashodankagatam
    balam govindam munivanditam | asmakam putralabhaya namami shrishamacyutam || 7|| shripate devadevesha
    dinartiharanacyuta | govinda me sutam dehi namami tvam janardana || 8|| bhaktakamada govinda bhaktam
    raksha shubhapradam | dehi me tanayam krishna rukminivallabha prabho || 9|| rukmininatha sarvesha
    dehi me tanayam sada | bhaktamandara padmaksha tvamaham sharanam gatah || 10|| devakisuta govinda
    vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || 11|| vasudeva jagadvandya
    shripate purushottama | dehi me tanayam krishna tvamaham sharanam gatah || 12|| kanjaksha kamalanatha
    parakarunikottama | dehi me tanayam krishna tvamaham sharanam gatah || 13|| lakshmipate padmanabha
    mukunda munivandita | dehi me tanayam krishna tvamaham sharanam gatah || 14|| karyakaranarupaya vasudevaya
    te sada | namami putralabhartham sukhadaya budhaya te || 15|| rajivanetra shrirama ravanare hare kave
    | tubhyam namami devesha tanayam dehi me hare || 16|| asmakam putralabhaya bhajami tvam jagatpate
    | dehi me tanayam krishna vasudeva ramapate || 17|| shrimaninimanacora gopivastrapaharaka | dehi me
    tanayam krishna vasudeva jagatpate || 18| asmakam putrasampraptim kurushva yadunandana | ramapate
    vasudeva mukunda munivandita || 19|| vasudeva sutam dehi tanayam dehi madhava | putram me dehi shrikrishna
    vatsam dehi mahaprabho || 20|| dimbhakam dehi shrikrishna atmajam dehi raghava | bhaktamandara me
    dehi tanayam nandanandana || 21|| nandanam dehi me krishna vasudeva jagatpate | kamalanatha govinda
    mukunda munivandita || 22|| anyatha sharanam nasti tvameva sharanam mama | sutam dehi shriyam dehi
    shriyam putram pradehi me || 23|| yashodastanyapanajnam pibantam yadunandanam | vande'ham putralabhartham
    kapilaksham harim sada || 24|| nandanandana devesha nandanam dehi me prabho | ramapate vasudeva shriyam
    putram jagatpate || 25|| putram shriyam shriyam putram putram me dehi madhava | asmakam dinavakyasya
    avadharaya shripate || 26|| gopaladimbha govinda vasudeva ramapate | asmakam dimbhakam dehi shriyam
    dehi jagatpate || 27|| madvanchitaphalam dehi devakinandanacyuta | mama putrarthitam dhanyam kurushva
    yadunandana || 28|| yace'ham tvam shriyam putram dehi me putrasampadam | bhaktacintamane rama kalpavriksha
    mahaprabho || 29|| atmajam nandanam putram kumaram dimbhakam sutam | arbhakam tanayam dehi sada me
    raghunandana || 30|| vande santanagopalam madhavam bhaktakamadam | asmakam putrasampraptyai sada govindamacyutam
    || 31|| omkarayuktam gopalam shriyuktam yadunandanam | klimyuktam devakiputram namami yadunayakam
    || 32|| vasudeva mukundesha govinda madhavacyuta | dehi me tanayam krishna ramanatha mahaprabho ||
    33|| rajivanetra govinda kapilaksha hare prabho | samastakamyavarada dehi me tanayam sada || 34||
    abjapadmanibham padmavrindarupa jagatpate | dehi me varasatputram ramanayaka madhava || 35|| nandapala
    dharapala govinda yadunandana | dehi me tanayam krishna rukminivallabha prabho || 36|| dasamandara
    govinda mukunda madhavacyuta | gopala pundarikaksha dehi me tanayam shriyam || 37|| yadunayaka padmesha
    nandagopavadhusuta | dehi me tanayam krishna shridharah prananayaka || 38|| asmakam vanchitam dehi
    dehi putram ramapate | bhagavan krishna sarvesha vasudeva jagatpate || 39|| ramahridayasambhara satyabhamamanahpriya
    | dehi me tanayam krishna rukminivallabha prabho || 40|| candrasuryaksha govinda pundarikaksha madhava
    | asmakam bhagyasatputram dehi deva jagatpate || 41|| karunyarupa padmaksha padmanabhasamarcita |
    dehi me tanayam krishna devakinandanandana || 42|| devakisuta shrinatha vasudeva jagatpate | samastakamaphalada
    dehi me tanayam sada || 43|| bhaktamandara gambhira shankaracyuta madhava | dehi me tanayam gopabalavatsala
    shripate || 44|| shripate vasudevesha devakipriyanandana | bhaktamandara me dehi tanayam jagatam prabho
    || 45|| jagannatha ramanatha bhuminatha dayanidhe | vasudevesha sarvesha dehi me tanayam prabho ||
    46|| shrinatha kamalapatraksha vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah
    || 47|| dasamandara govinda bhaktacintamane prabho | dehi me tanayam krishna tvamaham sharanam gatah
    || 48|| govinda pundarikaksha ramanatha mahaprabho | dehi me tanayam krishna tvamaham sharanam gatah
    || 49|| shrinatha kamalapatraksha govinda madhusudana | matputraphalasiddhyartham bhajami tvam janardana
    || 50|| stanyam pibantam jananimukhambujam vilokya mandasmitamujjvalangam | sprishantamanyastanamangulibhirvande
    yashodankagatam mukundam || 51|| yace'ham putrasantanam bhavantam padmalocana | dehi me tanayam krishna
    tvamaham sharanam gatah || 52|| asmakam putrasampatteshcintayami jagatpate | shighram me dehi datavyam
    bhavata munivandita || 53|| vasudeva jagannatha shripate purushottama | kuru mam putradattam ca krishna
    devendrapujita || 54|| kuru mam putradattam ca yashodapriyanandana | mahyam ca putrasantanam datavyam
    bhavata hare || 55|| vasudeva jagannatha govinda devakisuta | dehi me tanayam rama kausalyapriyanandana
    || 56|| padmapatraksha govinda vishno vamana madhava | dehi me tanayam sitaprananayaka raghava ||
    57|| kanjaksha krishna devendramandita munivandita | lakshmanagraja shrirama dehi me tanayam sada
    || 58|| dehi me tanayam rama dasharathapriyanandana | sitanayaka kanjaksha mucukundavaraprada || 59||
    vibhishanasya ya lanka pradatta bhavata pura | asmakam tatprakarena tanayam dehi madhava || 60|| bhavadiyapadambhoje
    cintayami nirantaram | dehi me tanayam sitapranavallabha raghava || 61|| rama matkamyavarada putrotpattiphalaprada
    | dehi me tanayam shrisha kamalasanavandita || 62|| rama raghava sitesha lakshmananuja dehi me | bhagyavatputrasantanam
    dasharathatmaja shripate || 63|| devakigarbhasanjata yashodapriyanandana | dehi me tanayam rama krishna
    gopala madhava || 64|| krishna madhava govinda vamanacyuta shankara | dehi me tanayam shrisha gopabalakanayaka
    || 65|| gopabala mahadhanya govindacyuta madhava | dehi me tanayam krishna vasudeva jagatpate || 66||
    dishatu dishatu putram devakinandano'yam dishatu dishatu shighram bhagyavatputralabham | dishatu dishatu
    shrisho raghavo ramacandro dishatu dishatu putram vamshavistarahetoh || 67|| diyatam vasudevena tanayo
    matpriyah sutah | kumaro nandanah sitanayakena sada mama || 68|| rama raghava govinda devakisuta madhava
    | dehi me tanayam shrisha gopabalakanayaka || 69|| raghava
  devanagari: ॐ श्रीं ह्रीं क्लीं ग्लौं देवकीसुत गोविन्द वासुदेव जगत्पते । ॐ देवकीसुत गोविन्द वासुदेव
    जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॐ नमो भगवते वासुदेवाय । अथ सन्तानगोपालस्तोत्रम् ।
    श्रीशं कमलपत्राक्षं देवकीनन्दनं हरिम् । सुतसम्प्राप्तये कृष्णं नमामि मधुसूदनम् ॥ १॥ नमाम्यहं वासुदेवं
    सुतसम्प्राप्तये हरिम् । यशोदाङ्कगतं बालं गोपालं नन्दनन्दनम् ॥ २॥ अस्माकं पुत्रलाभाय गोविन्दं मुनिवन्दितम्
    । नमाम्यहं वासुदेवं देवकीनन्दनं सदा ॥ ३। ॥ गोपालं डिम्भकं वन्दे कमलापतिमच्युतम् । पुत्रसम्प्राप्तये
    कृष्णं नमामि यदुपुङ्गवम् ॥ ४॥ पुत्रकामेष्टिफलदं कञ्जाक्षं कमलापतिम् । देवकीनन्दनं वन्दे सुतसम्प्राप्तये
    मम ॥ ५॥ पद्मापते पद्मनेत्र पद्मनाभ जनार्दन । देहि मे तनयं श्रीश वासुदेव जगत्पते ॥ ६॥ यशोदाङ्कगतं बालं
    गोविन्दं मुनिवन्दितम् । अस्माकं पुत्रलाभाय नमामि श्रीशमच्युतम् ॥ ७॥ श्रीपते देवदेवेश दीनार्तिहरणाच्युत
    । गोविन्द मे सुतं देहि नमामि त्वां जनार्दन ॥ ८॥ भक्तकामद गोविन्द भक्तं रक्ष शुभप्रदम् । देहि मे तनयं
    कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ९॥ रुक्मिणीनाथ सर्वेश देहि मे तनयं सदा । भक्तमन्दार पद्माक्ष त्वामहं शरणं
    गतः ॥ १०॥ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ११॥ वासुदेव जगद्वन्द्य
    श्रीपते पुरुषोत्तम । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ १२॥ कञ्जाक्ष कमलानाथ परकारुणिकोत्तम । देहि
    मे तनयं कृष्ण त्वामहं शरणं गतः ॥ १३॥ लक्ष्मीपते पद्मनाभ मुकुन्द मुनिवन्दित । देहि मे तनयं कृष्ण त्वामहं
    शरणं गतः ॥ १४॥ कार्यकारणरूपाय वासुदेवाय ते सदा । नमामि पुत्रलाभार्थं सुखदाय बुधाय ते ॥ १५॥ राजीवनेत्र
    श्रीराम रावणारे हरे कवे । तुभ्यं नमामि देवेश तनयं देहि मे हरे ॥ १६॥ अस्माकं पुत्रलाभाय भजामि त्वां
    जगत्पते । देहि मे तनयं कृष्ण वासुदेव रमापते ॥ १७॥ श्रीमानिनीमानचोर गोपीवस्त्रापहारक । देहि मे तनयं
    कृष्ण वासुदेव जगत्पते ॥ १८। अस्माकं पुत्रसम्प्राप्तिं कुरुष्व यदुनन्दन । रमापते वासुदेव मुकुन्द मुनिवन्दित
    ॥ १९॥ वासुदेव सुतं देहि तनयं देहि माधव । पुत्रं मे देहि श्रीकृष्ण वत्सं देहि महाप्रभो ॥ २०॥ डिम्भकं
    देहि श्रीकृष्ण आत्मजं देहि राघव । भक्तमन्दार मे देहि तनयं नन्दनन्दन ॥ २१॥ नन्दनं देहि मे कृष्ण वासुदेव
    जगत्पते । कमलानाथ गोविन्द मुकुन्द मुनिवन्दित ॥ २२॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । सुतं देहि श्रियं
    देहि श्रियं पुत्रं प्रदेहि मे ॥ २३॥ यशोदास्तन्यपानज्ञं पिबन्तं यदुनन्दनम् । वन्देऽहं पुत्रलाभार्थं
    कपिलाक्षं हरिं सदा ॥ २४॥ नन्दनन्दन देवेश नन्दनं देहि मे प्रभो । रमापते वासुदेव श्रियं पुत्रं जगत्पते
    ॥ २५॥ पुत्रं श्रियं श्रियं पुत्रं पुत्रं मे देहि माधव । अस्माकं दीनवाक्यस्य अवधारय श्रीपते ॥ २६॥ गोपालडिम्भ
    गोविन्द वासुदेव रमापते । अस्माकं डिम्भकं देहि श्रियं देहि जगत्पते ॥ २७॥ मद्वाञ्छितफलं देहि देवकीनन्दनाच्युत
    । मम पुत्रार्थितं धन्यं कुरुष्व यदुनन्दन ॥ २८॥ याचेऽहं त्वां श्रियं पुत्रं देहि मे पुत्रसम्पदम् ।
    भक्तचिन्तामणे राम कल्पवृक्ष महाप्रभो ॥ २९॥ आत्मजं नन्दनं पुत्रं कुमारं डिम्भकं सुतम् । अर्भकं तनयं
    देहि सदा मे रघुनन्दन ॥ ३०॥ वन्दे सन्तानगोपालं माधवं भक्तकामदम् । अस्माकं पुत्रसम्प्राप्त्यै सदा गोविन्दमच्युतम्
    ॥ ३१॥ ॐकारयुक्तं गोपालं श्रीयुक्तं यदुनन्दनम् । क्लींयुक्तं देवकीपुत्रं नमामि यदुनायकम् ॥ ३२॥ वासुदेव
    मुकुन्देश गोविन्द माधवाच्युत । देहि मे तनयं कृष्ण रमानाथ महाप्रभो ॥ ३३॥ राजीवनेत्र गोविन्द कपिलाक्ष
    हरे प्रभो । समस्तकाम्यवरद देहि मे तनयं सदा ॥ ३४॥ अब्जपद्मनिभं पद्मवृन्दरूप जगत्पते । देहि मे वरसत्पुत्रं
    रमानायक माधव ॥ ३५॥ नन्दपाल धरापाल गोविन्द यदुनन्दन । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ३६॥
    दासमन्दार गोविन्द मुकुन्द माधवाच्युत । गोपाल पुण्डरीकाक्ष देहि मे तनयं श्रियम् ॥ ३७॥ यदुनायक पद्मेश
    नन्दगोपवधूसुत । देहि मे तनयं कृष्ण श्रीधरः प्राणनायक ॥ ३८॥ अस्माकं वाञ्छितं देहि देहि पुत्रं रमापते
    । भगवन् कृष्ण सर्वेश वासुदेव जगत्पते ॥ ३९॥ रमाहृदयसम्भार सत्यभामामनःप्रिय । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ
    प्रभो ॥ ४०॥ चन्द्रसूर्याक्ष गोविन्द पुण्डरीकाक्ष माधव । अस्माकं भाग्यसत्पुत्रं देहि देव जगत्पते ॥
    ४१॥ कारुण्यरूप पद्माक्ष पद्मनाभसमर्चित । देहि मे तनयं कृष्ण देवकीनन्दनन्दन ॥ ४२॥ देवकीसुत श्रीनाथ
    वासुदेव जगत्पते । समस्तकामफलद देहि मे तनयं सदा ॥ ४३॥ भक्तमन्दार गम्भीर शङ्कराच्युत माधव । देहि मे
    तनयं गोपबालवत्सल श्रीपते ॥ ४४॥ श्रीपते वासुदेवेश देवकीप्रियनन्दन । भक्तमन्दार मे देहि तनयं जगतां प्रभो
    ॥ ४५॥ जगन्नाथ रमानाथ भूमिनाथ दयानिधे । वासुदेवेश सर्वेश देहि मे तनयं प्रभो ॥ ४६॥ श्रीनाथ कमलपत्राक्ष
    वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ४७॥ दासमन्दार गोविन्द भक्तचिन्तामणे प्रभो
    । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ४८॥ गोविन्द पुण्डरीकाक्ष रमानाथ महाप्रभो । देहि मे तनयं कृष्ण
    त्वामहं शरणं गतः ॥ ४९॥ श्रीनाथ कमलपत्राक्ष गोविन्द मधुसूदन । मत्पुत्रफलसिद्ध्यर्थं भजामि त्वां जनार्दन
    ॥ ५०॥ स्तन्यं पिबन्तं जननीमुखाम्बुजं विलोक्य मन्दस्मितमुज्ज्वलाङ्गम् । स्पृशन्तमन्यस्तनमङ्गुलीभिर्वन्दे
    यशोदाङ्कगतं मुकुन्दम् ॥ ५१॥ याचेऽहं पुत्रसन्तानं भवन्तं पद्मलोचन । देहि मे तनयं कृष्ण त्वामहं शरणं
    गतः ॥ ५२॥ अस्माकं पुत्रसम्पत्तेश्चिन्तयामि जगत्पते । शीघ्रं मे देहि दातव्यं भवता मुनिवन्दित ॥ ५३॥
    वासुदेव जगन्नाथ श्रीपते पुरुषोत्तम । कुरु मां पुत्रदत्तं च कृष्ण देवेन्द्रपूजित ॥ ५४॥ कुरु मां पुत्रदत्तं
    च यशोदाप्रियनन्दन । मह्यं च पुत्रसन्तानं दातव्यं भवता हरे ॥ ५५॥ वासुदेव जगन्नाथ गोविन्द देवकीसुत ।
    देहि मे तनयं राम कौसल्याप्रियनन्दन ॥ ५६॥ पद्मपत्राक्ष गोविन्द विष्णो वामन माधव । देहि मे तनयं सीताप्राणनायक
    राघव ॥ ५७॥ कञ्जाक्ष कृष्ण देवेन्द्रमण्डित मुनिवन्दित । लक्ष्मणाग्रज श्रीराम देहि मे तनयं सदा ॥ ५८॥
    देहि मे तनयं राम दशरथप्रियनन्दन । सीतानायक कञ्जाक्ष मुचुकुन्दवरप्रद ॥ ५९॥ विभीषणस्य या लङ्का प्रदत्ता
    भवता पुरा । अस्माकं तत्प्रकारेण तनयं देहि माधव ॥ ६०॥ भवदीयपदाम्भोजे चिन्तयामि निरन्तरम् । देहि मे
    तनयं सीताप्राणवल्लभ राघव ॥ ६१॥ राम मत्काम्यवरद पुत्रोत्पत्तिफलप्रद । देहि मे तनयं श्रीश कमलासनवन्दित
    ॥ ६२॥ राम राघव सीतेश लक्ष्मणानुज देहि मे । भाग्यवत्पुत्रसन्तानं दशरथात्मज श्रीपते ॥ ६३॥ देवकीगर्भसञ्जात
    यशोदाप्रियनन्दन । देहि मे तनयं राम कृष्ण गोपाल माधव ॥ ६४॥ कृष्ण माधव गोविन्द वामनाच्युत शङ्कर । देहि
    मे तनयं श्रीश गोपबालकनायक ॥ ६५॥ गोपबाल महाधन्य गोविन्दाच्युत माधव । देहि मे तनयं कृष्ण वासुदेव जगत्पते
    ॥ ६६॥ दिशतु दिशतु पुत्रं देवकीनन्दनोऽयं दिशतु दिशतु शीघ्रं भाग्यवत्पुत्रलाभम् । दिशतु दिशतु श्रीशो
    राघवो रामचन्द्रो दिशतु दिशतु पुत्रं वंशविस्तारहेतोः ॥ ६७॥ दीयतां वासुदेवेन तनयो मत्प्रियः सुतः । कुमारो
    नन्दनः सीतानायकेन सदा मम ॥ ६८॥ राम राघव गोविन्द देवकीसुत माधव । देहि मे तनयं श्रीश गोपबालकनायक ॥ ६९॥
    राघव
