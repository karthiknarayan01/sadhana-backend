id: sri-rudram-chamakam
category: veda
name:
  english: Sri Rudram Chamakam
  devanagari: चमकप्रश्नः
content:
  english: '|| camakaprashnah || om agnavishnu sajoshasema vardhantu vam girah | dyumnairvajebhiragatam
    | vajashca me prasavashca me prayatishca me prasitishca me dhitishca me kratushca me svarashca me
    shlokashca me shravashca me shrutishca me jyotishca me suvashca me pranashca me''panashca me vyanashca
    me''sushca me cittam ca ma adhitam ca me vakca me manashca me cakshushca me shrotram ca me dakshashca
    me balam ca ma ojashca me sahashca ma ayushca me jara ca ma atma ca me tanushca me sharma ca me varma
    ca me''ngani ca me''sthani ca me parushi ca me sharirani ca me || 1|| jyaishthyam ca ma adhipatyam
    ca me manyushca me bhamashca me''mashca me''mbhashca me jema ca me mahima ca me varima ca me prathima
    ca me varshma ca me draghuya ca me vriddham ca me vriddhishca me satyam ca me shraddha ca me jagacca
    me dhanam ca me vashashca me tvishishca me krida ca me modashca me jatam ca me janishyamanam ca me
    suktam ca me sukritam ca me vittam ca me vedyam ca me bhutam ca me bhavishyacca me sugam ca me supatham
    ca ma riddham ca ma riddhishca me kliptam ca me kliptishca me matishca me sumatishca me || 2|| sham
    ca me mayashca me priyam ca me''nukamashca me kamashca me saumanasashca me bhadram ca me shreyashca
    me vasyashca me yashashca me bhagashca me dravinam ca me yanta ca me dharta ca me kshemashca me dhritishca
    me vishvam ca me mahashca me samvicca me jnatram ca me sushca me prasushca me siram ca me layashca
    ma ritam ca me''mritam ca me''yakshmam ca me''namayacca me jivatushca me dirghayutvam ca me''namitram
    ca me''bhayam ca me sugam ca me shayanam ca me susha ca me sudinam ca me || 3|| urkca me sunrita ca
    me payashca me rasashca me ghritam ca me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca
    me jaitram ca ma audbhidyam ca me rayishca me rayashca me pushtam ca me pushtishca me vibhu ca me
    prabhu ca me bahu ca me bhuyashca me purnam ca me purnataram ca me''kshitishca me kuyavashca me''nnam
    ca me''kshucca me vrihayashca me yavashca me mashashca me tilashca me mudgashca me khalvashca me godhumashca
    me masurashca me priyangavashca me''navashca me shyamakashca me nivarashca me || 4|| ashma ca me mrittika
    ca me girayashca me parvatashca me sikatashca me vanaspatayashca me hiranyam ca me''yashca me sisam
    ca me trapushca me shyamam ca me loham ca me''gnishca ma apashca me virudhashca ma oshadhayashca me
    krishtapacyam ca me''krishtapacyam ca me gramyashca me pashava aranyashca yajnena kalpantam vittam
    ca me vittishca me bhutam ca me bhutishca me vasu ca me vasatishca me karma ca me shaktishca me''rthashca
    ma emashca ma itishca me gatishca me || 5|| agnishca ma indrashca me somashca ma indrashca me savita
    ca ma indrashca me sarasvati ca ma indrashca me pusha ca ma indrashca me brihaspatishca ma indrashca
    me mitrashca ma indrashca me varunashca ma indrashca me tvashta ca ma indrashca me dhata ca ma indrashca
    me vishnushca ma indrashca me''shvinau ca ma indrashca me marutashca ma indrashca me vishve ca me
    deva indrashca me prithivi ca ma indrashca me''ntariksham ca ma indrashca me dyaushca ma indrashca
    me dishashca ma indrashca me murdha ca ma indrashca me prajapatishca ma indrashca me || 6|| ashushca
    me rashmishca me''dabhyashca me''dhipatishca ma upashushca me''ntaryamashca ma aindravayavashca me
    maitravarunashca ma ashvinashca me pratiprasthanashca me shukrashca me manthi ca ma agrayanashca me
    vaishvadevashca me dhruvashca me vaishvanarashca ma ritugrahashca me''tigrahyashca ma aindragnashca
    me vaishvadevashca me marutvatiyashca me mahendrashca ma adityashca me savitrashca me sarasvatashca
    me paushnashca me patnivatashca me hariyojanashca me || 7|| idhmashca me barhishca me vedishca me
    dhishniyashca me srucashca me camasashca me gravanashca me svaravashca ma uparavashca me''dhishavane
    ca me dronakalashashca me vayavyani ca me putabhricca ma adhavaniyashca ma agnidhram ca me havirdhanam
    ca me grihashca me sadashca me purodashashca me pacatashca me''vabhrithashca me svagakarashca me ||
    8|| agnishca me gharmashca me''rkashca me suryashca me pranashca me''shvamedhashca me prithivi ca
    me''ditishca me ditishca me dyaushca me shakkvarirangulayo dishashca me yajnena kalpantamrikca me
    sama ca me stomashca me yajushca me diksha ca me tapashca ma ritushca me vratam ca me''horatrayorvrishtya
    brihadrathantare ca me yajnena kalpetam || 9|| garbhashca me vatsashca me tryavishca me tryavi ca
    me dityavat ca me dityauhi ca me pancavishca me pancavi ca me trivatsashca me trivatsa ca me turyavat
    ca me turyauhi ca me pashthavat ca me pashthauhi ca ma uksha ca me vasha ca ma rishabhashca me vehacca
    me''nadvanca me dhenushca ma ayuryajnena kalpatam prano yajnena kalpatamapano yajnena kalpatam vyano
    yajnena kalpatam cakshuryajnena kalpata shrotram yajnena kalpatam mano yajnena kalpatam vagyajnena
    kalpatamatma yajnena kalpatam yajno yajnena kalpatam || 10|| eka ca me tisrashca me panca ca me sapta
    ca me nava ca ma ekadasha ca me trayodasha ca me pancadasha ca me saptadasha ca me navadasha ca ma
    ekavishatishca me trayovishatishca me pancavishatishca me saptavishatishca me navavishatishca ma ekatrishacca
    me trayastrishacca me catasrashca me''shtau ca me dvadasha ca me shodasha ca me vishatishca me caturvishatishca
    me''shtavishatishca me dvatrishacca me shattrishacca me catvarishacca me catushcatvarishacca me''shtacatvarishacca
    me vajashca prasavashcapijashca kratushca suvashca murdha ca vyashniyashcantyayanashcantyashca bhauvanashca
    bhuvanashcadhipatishca || 11|| om ida devahurmanuryajnanirbrihaspatirukthamadani shasishadvishvedevah
    suktavacah prithivimatarma ma hisirmadhu manishye madhu janishye madhu vakshyami madhu vadishyami
    madhumatim devebhyo vacamudyasa shushrushenyam manushyebhyastam ma deva avantu shobhayai pitaro''numadantu||
    om shantih shantih shantih || || om shantih shantih shantih || || iti shri krishnayajurvediya taittiriya
    samhitayam caturthakande saptamah prapathakah ||'
  devanagari: ॥ चमकप्रश्नः ॥ ॐ अग्नाविष्णू सजोषसेमा वर्धन्तु वां गिरः । द्युम्नैर्वाजेभिरागतम् । वाजश्च
    मे प्रसवश्च मे प्रयतिश्च मे प्रसितिश्च मे धीतिश्च मे क्रतुश्च मे स्वरश्च मे श्लोकश्च मे श्रावश्च मे
    श्रुतिश्च मे ज्योतिश्च मे सुवश्च मे प्राणश्च मेऽपानश्च मे व्यानश्च मेऽसुश्च मे चित्तं च म आधीतं च
    मे वाक्च मे मनश्च मे चक्षुश्च मे श्रोत्रं च मे दक्षश्च मे बलं च म ओजश्च मे सहश्च म आयुश्च मे जरा च
    म आत्मा च मे तनूश्च मे शर्म च मे वर्म च मेऽङ्गानि च मेऽस्थानि च मे परूषि च मे शरीराणि च मे ॥ १॥ ज्यैष्ठ्यं
    च म आधिपत्यं च मे मन्युश्च मे भामश्च मेऽमश्च मेऽम्भश्च मे जेमा च मे महिमा च मे वरिमा च मे प्रथिमा
    च मे वर्ष्मा च मे द्राघुया च मे वृद्धं च मे वृद्धिश्च मे सत्यं च मे श्रद्धा च मे जगच्च मे धनं च मे
    वशश्च मे त्विषिश्च मे क्रीडा च मे मोदश्च मे जातं च मे जनिष्यमाणं च मे सूक्तं च मे सुकृतं च मे वित्तं
    च मे वेद्यं च मे भूतं च मे भविष्यच्च मे सुगं च मे सुपथं च म ऋद्धं च म ऋद्धिश्च मे कॢप्तं च मे कॢप्तिश्च
    मे मतिश्च मे सुमतिश्च मे ॥ २॥ शं च मे मयश्च मे प्रियं च मेऽनुकामश्च मे कामश्च मे सौमनसश्च मे भद्रं
    च मे श्रेयश्च मे वस्यश्च मे यशश्च मे भगश्च मे द्रविणं च मे यन्ता च मे धर्ता च मे क्षेमश्च मे धृतिश्च
    मे विश्वं च मे महश्च मे संविच्च मे ज्ञात्रं च मे सूश्च मे प्रसूश्च मे सीरं च मे लयश्च म ऋतं च मेऽमृतं
    च मेऽयक्ष्मं च मेऽनामयच्च मे जीवातुश्च मे दीर्घायुत्वं च मेऽनमित्रं च मेऽभयं च मे सुगं च मे शयनं च
    मे सूषा च मे सुदिनं च मे ॥ ३॥ ऊर्क्च मे सूनृता च मे पयश्च मे रसश्च मे घृतं च मे मधु च मे सग्धिश्च
    मे सपीतिश्च मे कृषिश्च मे वृष्टिश्च मे जैत्रं च म औद्भिद्यं च मे रयिश्च मे रायश्च मे पुष्टं च मे पुष्टिश्च
    मे विभु च मे प्रभु च मे बहु च मे भूयश्च मे पूर्णं च मे पूर्णतरं च मेऽक्षितिश्च मे कूयवाश्च मेऽन्नं
    च मेऽक्षुच्च मे व्रीहयश्च मे यवाश्च मे माषाश्च मे तिलाश्च मे मुद्गाश्च मे खल्वाश्च मे गोधूमाश्च मे
    मसुराश्च मे प्रियङ्गवश्च मेऽणवश्च मे श्यामकाश्च मे नीवाराश्च मे ॥ ४॥ अश्मा च मे मृत्तिका च मे गिरयश्च
    मे पर्वताश्च मे सिकताश्च मे वनस्पतयश्च मे हिरण्यं च मेऽयश्च मे सीसं च मे त्रपुश्च मे श्यामं च मे लोहं
    च मेऽग्निश्च म आपश्च मे वीरुधश्च म ओषधयश्च मे कृष्टपच्यं च मेऽकृष्टपच्यं च मे ग्राम्याश्च मे पशव आरण्याश्च
    यज्ञेन कल्पन्तां वित्तं च मे वित्तिश्च मे भूतं च मे भूतिश्च मे वसु च मे वसतिश्च मे कर्म च मे शक्तिश्च
    मेऽर्थश्च म एमश्च म इतिश्च मे गतिश्च मे ॥ ५॥ अग्निश्च म इन्द्रश्च मे सोमश्च म इन्द्रश्च मे सविता च
    म इन्द्रश्च मे सरस्वती च म इन्द्रश्च मे पूषा च म इन्द्रश्च मे बृहस्पतिश्च म इन्द्रश्च मे मित्रश्च
    म इन्द्रश्च मे वरुणश्च म इन्द्रश्च मे त्वष्टा च म इन्द्रश्च मे धाता च म इन्द्रश्च मे विष्णुश्च म इन्द्रश्च
    मेऽश्विनौ च म इन्द्रश्च मे मरुतश्च म इन्द्रश्च मे विश्वे च मे देवा इन्द्रश्च मे पृथिवी च म इन्द्रश्च
    मेऽन्तरिक्षं च म इन्द्रश्च मे द्यौश्च म इन्द्रश्च मे दिशश्च म इन्द्रश्च मे मूर्धा च म इन्द्रश्च मे
    प्रजापतिश्च म इन्द्रश्च मे ॥ ६॥ अशुश्च मे रश्मिश्च मेऽदाभ्यश्च मेऽधिपतिश्च म उपाशुश्च मेऽन्तर्यामश्च
    म ऐन्द्रवायवश्च मे मैत्रावरुणश्च म आश्विनश्च मे प्रतिप्रस्थानश्च मे शुक्रश्च मे मन्थी च म आग्रयणश्च
    मे वैश्वदेवश्च मे ध्रुवश्च मे वैश्वानरश्च म ऋतुग्रहाश्च मेऽतिग्राह्याश्च म ऐन्द्राग्नश्च मे वैश्वदेवश्च
    मे मरुत्वतीयाश्च मे माहेन्द्रश्च म आदित्यश्च मे सावित्रश्च मे सारस्वतश्च मे पौष्णश्च मे पात्नीवतश्च
    मे हारियोजनश्च मे ॥ ७॥ इध्मश्च मे बर्हिश्च मे वेदिश्च मे धिष्णियाश्च मे स्रुचश्च मे चमसाश्च मे ग्रावाणश्च
    मे स्वरवश्च म उपरवाश्च मेऽधिषवणे च मे द्रोणकलशश्च मे वायव्यानि च मे पूतभृच्च म आधवनीयश्च म आग्नीध्रं
    च मे हविर्धानं च मे गृहाश्च मे सदश्च मे पुरोडाशाश्च मे पचताश्च मेऽवभृथश्च मे स्वगाकारश्च मे ॥ ८॥ अग्निश्च
    मे घर्मश्च मेऽर्कश्च मे सूर्यश्च मे प्राणश्च मेऽश्वमेधश्च मे पृथिवी च मेऽदितिश्च मे दितिश्च मे द्यौश्च
    मे शक्क्वरीरङ्गुलयो दिशश्च मे यज्ञेन कल्पन्तामृक्च मे साम च मे स्तोमश्च मे यजुश्च मे दीक्षा च मे तपश्च
    म ऋतुश्च मे व्रतं च मेऽहोरात्रयोर्वृष्ट्या बृहद्रथन्तरे च मे यज्ञेन कल्पेताम् ॥ ९॥ गर्भाश्च मे वत्साश्च
    मे त्र्यविश्च मे त्र्यवी च मे दित्यवाट् च मे दित्यौही च मे पञ्चाविश्च मे पञ्चावी च मे त्रिवत्सश्च
    मे त्रिवत्सा च मे तुर्यवाट् च मे तुर्यौही च मे पष्ठवाट् च मे पष्ठौही च म उक्षा च मे वशा च म ऋषभश्च
    मे वेहच्च मेऽनड्वाञ्च मे धेनुश्च म आयुर्यज्ञेन कल्पतां प्राणो यज्ञेन कल्पतामपानो यज्ञेन कल्पतां व्यानो
    यज्ञेन कल्पतां चक्षुर्यज्ञेन कल्पता श्रोत्रं यज्ञेन कल्पतां मनो यज्ञेन कल्पतां वाग्यज्ञेन कल्पतामात्मा
    यज्ञेन कल्पतां यज्ञो यज्ञेन कल्पताम् ॥ १०॥ एका च मे तिस्रश्च मे पञ्च च मे सप्त च मे नव च म एकादश च
    मे त्रयोदश च मे पञ्चदश च मे सप्तदश च मे नवदश च म एकविशतिश्च मे त्रयोविशतिश्च मे पञ्चविशतिश्च मे सप्तविशतिश्च
    मे नवविशतिश्च म एकत्रिशच्च मे त्रयस्त्रिशच्च मे चतस्रश्च मेऽष्टौ च मे द्वादश च मे षोडश च मे विशतिश्च
    मे चतुर्विशतिश्च मेऽष्टाविशतिश्च मे द्वात्रिशच्च मे षट्त्रिशच्च मे चत्वरिशच्च मे चतुश्चत्वारिशच्च
    मेऽष्टाचत्वारिशच्च मे वाजश्च प्रसवश्चापिजश्च क्रतुश्च सुवश्च मूर्धा च व्यश्नियश्चान्त्यायनश्चान्त्यश्च
    भौवनश्च भुवनश्चाधिपतिश्च ॥ ११॥ ॐ इडा देवहूर्मनुर्यज्ञनीर्बृहस्पतिरुक्थामदानि शसिषद्विश्वेदेवाः सूक्तवाचः
    पृथिवीमातर्मा मा हिसीर्मधु मनिष्ये मधु जनिष्ये मधु वक्ष्यामि मधु वदिष्यामि मधुमतीं देवेभ्यो वाचमुद्यास
    शुश्रूषेण्यां मनुष्येभ्यस्तं मा देवा अवन्तु शोभायै पितरोऽनुमदन्तु॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ ॐ
    शान्तिः शान्तिः शान्तिः ॥ ॥ इति श्री कृष्णयजुर्वेदीय तैत्तिरीय संहितायां चतुर्थकाण्डे सप्तमः प्रपाठकः
    ॥
