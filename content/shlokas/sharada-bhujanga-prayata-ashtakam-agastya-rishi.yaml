id: sharada-bhujanga-prayata-ashtakam-agastya-rishi
category: stotram
name:
  english: Sharada Bhujanga Prayata Ashtakam (Agastya Rishi)
content:
  english: suvakshojakumbham sudhapurnakumbham prasadavalambam prapunyavalambam | sadasyendubimbam sadanoshthabimbam
    bhaje sharadambamajasram madambam || || katakshe dayardram kare jnanamudram kalabhirvinidram kalapaih
    subhadram | purastrim vinidram purastungabhadram bhaje sharadambamajasram madambam || || lalamankaphalam
    lasadganalolam svabhaktaikapalam yashahshrikapolam | kare tvakshamalam kanatpatralolam bhaje sharadambamajasram
    madambam || || susimantavenim drisha nirjitainim ramatkiravanim namadvajrapanim | sudhamantharasyam
    muda cintyavenim bhaje sharadambamajasram madambam || || sushantam sudeham drigante kacantam lasatsallatangimanantamacintyam
    | smarettapasaih sargapurvasthitam tam bhaje sharadambamajasram madambam || || kurange turange mrigendre
    khagendre marale madebhe mahokshe'dhirudham | mahatyam navamyam sada samarupam bhaje sharadambamajasram
    madambam || || jvalatkantivahnim jaganmohanangim bhaje manasambhoja subhrantabhringim | nijastotrasangitanrityaprabhangim
    bhaje sharadambamajasram madambam || || bhavambhojanetrajasampujyamanam lasanmandahasaprabhavaktracihnam
    | calaccancalacarutatankakarnam bhaje sharadambamajasram madambam || || || iti shrimacchankaracaryaviracita
    shri sharada bhujanga prayatashtakam ||
  devanagari: सुवक्षोजकुम्भां सुधापूर्णकुम्भां प्रसादावलम्बां प्रपुण्यावलम्बाम् । सदास्येन्दुबिम्बां सदानोष्ठबिम्बां
    भजे शारदाम्बामजस्रं मदम्बाम् ॥ ॥ कटाक्षे दयार्द्रां करे ज्ञानमुद्रां कलाभिर्विनिद्रां कलापैः सुभद्राम्
    । पुरस्त्रीं विनिद्रां पुरस्तुङ्गभद्रां भजे शारदाम्बामजस्रं मदम्बाम् ॥ ॥ ललामाङ्कफालां लसद्गानलोलां
    स्वभक्तैकपालां यशःश्रीकपोलाम् । करे त्वक्षमालां कनत्पत्रलोलां भजे शारदाम्बामजस्रं मदम्बाम् ॥ ॥ सुसीमन्तवेणीं
    दृशा निर्जितैणीं रमत्कीरवाणीं नमद्वज्रपाणीम् । सुधामन्थरास्यां मुदा चिन्त्यवेणीं भजे शारदाम्बामजस्रं
    मदम्बाम् ॥ ॥ सुशान्तां सुदेहां दृगन्ते कचान्तां लसत्सल्लताङ्गीमनन्तामचिन्त्याम् । स्मरेत्तापसैः सर्गपूर्वस्थितां
    तां भजे शारदाम्बामजस्रं मदम्बाम् ॥ ॥ कुरङ्गे तुरङ्गे मृगेन्द्रे खगेन्द्रे मराले मदेभे महोक्षेऽधिरूढाम्
    । महत्यां नवम्यां सदा सामरूपां भजे शारदाम्बामजस्रं मदम्बाम् ॥ ॥ ज्वलत्कान्तिवह्निं जगन्मोहनाङ्गीं
    भजे मानसाम्भोज सुभ्रान्तभृङ्गीम् । निजस्तोत्रसङ्गीतनृत्यप्रभाङ्गीं भजे शारदाम्बामजस्रं मदम्बाम् ॥
    ॥ भवाम्भोजनेत्राजसम्पूज्यमानां लसन्मन्दहासप्रभावक्त्रचिह्नाम् । चलच्चञ्चलाचारुताटङ्ककर्णां भजे शारदाम्बामजस्रं
    मदम्बाम् ॥ ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता श्री शारदा भुजङ्ग प्रयाताष्टकम् ॥
