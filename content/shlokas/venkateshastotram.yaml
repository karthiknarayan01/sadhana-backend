id: venkateshastotram
category: stotram
name:
  english: venkateshastotram
  devanagari: वेन्कटेशस्तोत्रम्
content:
  english: stomaprastasamastavistritatamashshrimandirabhyantaram | vyakocambujasundaram caranayordvandvam
    vrishadrishituh cakshurbhyamanubhuya sarvasulabham prapsyami modam kada || 5|| satkritya samakalalabdhatanubhirgopibhiratyadarat
    vinyastau vadane kuce ca nitaram romancarohancite | padmabhukarapallavaih sacakitam samvahyamanau
    mridu manyau venkatabhudhareshacaranau marge drishoh stam mama || 6|| pratah phullapayoruhantaradalasnigdharunantasthalau
    nishpitakhilaniraniradhilasannilambudabhau bahih | rakashitamaricisannibhanakhajyotirvitanancitau
    padau pannagapungavacalapatermadhyemanasstam mama || 7|| mandaraprasavabhiramashirasam vrindarakashreyasam
    vrindairindukalabhrita ca vidhina vandhau dhritanandathu | bandhacchedavidhayinau vinamatam chandashshatabhishtutau
    vande sheshamahidhareshacaranau vandarucintamani || 8|| cincamulakritasanena munina tattvardhasandarshina
    karunyena jagaddhitam kathayata svanushthitiravyapanat | nishcikye sharanam yadeva paramam prapyam
    ca sarvatmanam tatpadabjayugam bhajami vrishabhakshonidharadhishituh || 9|| nandishyami kada'hametya
    mahata gharmena tapto yatha mandodancitamarutam marutale martyo mahantam hradam | santapto bhavatapadavashikhina
    sarvartisamshamakam padadvandvamahishabhudharapaternirdvandvahrinmandiram || 10|| yau vrindavanabhutale
    vyaharatam dauteyavrindavrite kupyatkaliyavistritocchritaphanarangeshu canrityatam | kincanassamudasthatam
    kisalayapraspardhinavasuram tanvatam mama venkateshacaranau tavamhasam samhritim || 11|| sheshitvapramukhannipiya
    tu gunannitya haressurayo vaikunthe tata etya venkatagirim saulabhyamukhyaniha | nityodancitasamnidhernirupamannirvishya
    tasyadbhutan nirgantum prabhavanti hanta na tato vaikunthakunthadarah || 12|| samphulladbhutapushpabharavinamacchakhashatanam
    sada saurabhyanubhavabhiyanmadhuliham sanghairvrite bhuruham | udyadrashmibhirujjvalairmaniganairuttungasha
  devanagari: स्तोमप्रास्तसमस्तविस्तृततमश्श्रीमन्दिराभ्यन्तरम् । व्याकोचाम्बुजसुन्दरं चरणयोर्द्वन्द्वं
    वृषाद्रीशितुः चक्षुर्भ्यामनुभूय सर्वसुलभं प्राप्स्यामि मोदं कदा ॥ ५॥ सत्कृत्या समकाललब्धतनुभिर्गोपीभिरत्यादरात्
    विन्यस्तौ वदने कुचे च नितरां रोमाञ्चरोहाञ्चिते । पद्माभूकरपल्लवैः सचकितं संवाह्यमानौ मृदू मान्यौ वेङ्कटभूधरेशचरणौ
    मार्गे दृशोः स्तां मम ॥ ६॥ प्रातः फुल्लपयोरुहान्तरदलस्निग्धारुणान्तस्थलौ निष्पीताखिलनीरनीरधिलसन्नीलाम्बुदाभौ
    बहिः । राकाशीतमरीचिसन्निभनखज्योतिर्वितानाञ्चितौ पादौ पन्नगपुङ्गवाचलपतेर्मध्येमनस्स्तां मम ॥ ७॥ मन्दारप्रसवाभिरामशिरसां
    वृन्दारकश्रेयसां वृन्दैरिन्दुकलाभृता च विधिना वन्धौ धृतानन्दथू । बन्धच्छेदविधायिनौ विनमतां छन्दश्शताभिष्टुतौ
    वन्दे शेषमहीधरेशचरणौ वन्दारुचिन्तामणी ॥ ८॥ चिञ्चामूलकृतासनेन मुनिना तत्त्वार्धसन्दर्शिना कारुण्येन
    जगद्धितं कथयता स्वानुष्ठितिरव्यापनात् । निश्चिक्ये शरणं यदेव परमं प्राप्यं च सर्वात्मनां तत्पादाब्जयुगं
    भजामि वृषभक्षोणीधराधीशितुः ॥ ९॥ नन्दिष्यामि कदाऽहमेत्य महता घर्मेण तप्तो यथा मन्दोदञ्चितमारुतं मरुतले
    मर्त्यो महान्तं ह्रदम् । सन्तप्तो भवतापदावशिखिना सर्वार्तिसंशामकं पादद्वन्द्वमहीशभूधरपतेर्निर्द्वन्द्वहृन्मन्दिरम्
    ॥ १०॥ यौ वृन्दावनभूतले व्यहरतां दौतेयवृन्दावृते कुप्यत्कालियविस्तृतोच्छ्रितफणारङ्गेषु चानृत्यताम्
    । किञ्चानस्समुदास्थतां किसलयप्रस्पर्धिनावासुरं तन्वातां मम वेङ्कटेशचरणौ तावंहसां संहृतिम् ॥ ११॥ शेषित्वप्रमुखान्निपीय
    तु गुणान्नित्या हरेस्सूरयो वैकुण्ठे तत एत्य वेङ्कटगिरिं सौलभ्यमुख्यानिह । नित्योदञ्चितसंनिधेर्निरुपमान्निर्विश्य
    तस्याद्भुतान् निर्गन्तुं प्रभवन्ति हन्त न ततो वैकुण्ठकुण्ठादराः ॥ १२॥ सम्फुल्लाद्भुतपुष्पभारविनमच्छाखाशतानां
    सदा सौरभ्यानुभवाभियन्मधुलिहां सङ्घैर्वृते भूरुहाम् । उद्यद्रश्मिभिरुज्ज्वलैर्मणिगणैरुत्तुङ्गश
