id: apaduddharakabatukabhairavashtottarashatanamastotram
category: stotram
name:
  english: apaduddharakabatukabhairavashtottarashatanamastotram
  devanagari: आपदुद्धारकबटुकभैरवाष्टोत्तरशतनामस्तोत्रं
content:
  english: om hrim bhairavo bhutanathashca bhutatma bhutabhavanah | kshetrajnah kshetrapalashca kshetradah
    kshatriyo virat || 1|| shmashanavasi mamsashi kharparashi smarantakah | raktapah panapah siddhah siddhidah
    siddhasevitah || 2|| kankalah kalashamanah kalakashthatanuh kavih | trinetro bahunetrashca tatha pingalalocanah
    || 3|| shulapanih khadgapanih kankali dhumralocanah | abhirurbhairavinatho bhutapo yoginipatih ||
    4|| dhanado'dhanahari ca dhanavan pratibhanavan | nagaharo nagapasho vyomakeshah kapalabhrit || 5||
    kalah kapalamali ca kamaniyah kalanidhih | trilocano jvalannetrastrishikhi ca trilokapah || 6|| trinetratanayo
    dimbhashantah shantajanapriyah | batuko bahuveshashca khatvangavaradharakah || 7|| bhutadhyakshah
    pashupatirbhikshukah paricarakah | dhurto digambarah shuro harinah pandulocanah || 8|| prashantah
    shantidah shuddhah shankarapriyabandhavah | ashtamurtirnidhishashca jnanacakshustapomayah || 9|| ashtadharah
    shadadharah sarpayukta shikhisakhah | bhudharo bhudharadhisho bhupatirbhudharatmajah || 10|| kankaladhari
    mandi ca antrayajnopavitavan | jrimbhano mohanah stambhi maranah kshobhanastatha || 11|| shuddhanilanjanaprakhyo
    daityaha mundabhushitah | balibhug balibhunnatho balo'balaparakramah || 12|| sarvapattarano durgo
    dushtabhutanishevitah | kami kalanidhikantah kaminivashakrid vashi || 13|| jagadrakshakaro'nanto mayamantraushadhimayah
    | sarvasiddhiprado vaidyah prabhavishnuritiva hri hrim om || 14
  devanagari: ॐ ह्रीं भैरवो भूतनाथश्च भूतात्मा भूतभावनः । क्षेत्रज्ञः क्षेत्रपालश्च क्षेत्रदः क्षत्रियो
    विराट् ॥ १॥ श्मशानवासी मांसाशी खर्पराशी स्मरान्तकः । रक्तपः पानपः सिद्धः सिद्धिदः सिद्धसेवितः ॥ २॥
    कङ्कालः कालशमनः कलाकाष्ठातनुः कविः । त्रिनेत्रो बहुनेत्रश्च तथा पिङ्गललोचनः ॥ ३॥ शूलपाणिः खड्गपाणिः
    कङ्काली धूम्रलोचनः । अभीरुर्भैरवीनाथो भूतपो योगिनीपतिः ॥ ४॥ धनदोऽधनहारी च धनवान् प्रतिभानवान् । नागहारो
    नागपाशो व्योमकेशः कपालभृत् ॥ ५॥ कालः कपालमाली च कमनीयः कलानिधिः । त्रिलोचनो ज्वलन्नेत्रस्त्रिशिखी
    च त्रिलोकपः ॥ ६॥ त्रिनेत्रतनयो डिम्भशान्तः शान्तजनप्रियः । बटुको बहुवेषश्च खट्वाङ्गवरधारकः ॥ ७॥ भूताध्यक्षः
    पशुपतिर्भिक्षुकः परिचारकः । धूर्तो दिगम्बरः शूरो हरिणः पाण्डुलोचनः ॥ ८॥ प्रशान्तः शान्तिदः शुद्धः
    शङ्करप्रियबान्धवः । अष्टमूर्तिर्निधीशश्च ज्ञानचक्षुस्तपोमयः ॥ ९॥ अष्टाधारः षडाधारः सर्पयुक्त शिखीसखः
    । भूधरो भूधराधीशो भूपतिर्भूधरात्मजः ॥ १०॥ कङ्कालधारी मण्डी च आन्त्रयज्ञोपवीतवान् । जृम्भणो मोहनः स्तम्भी
    मारणः क्षोभणस्तथा ॥ ११॥ शुद्धनीलाञ्जनप्रख्यो दैत्यहा मुण्डभूषितः । बलिभुग् बलिभुङ्नाथो बालोऽबालपराक्रमः
    ॥ १२॥ सर्वापत्तारणो दुर्गो दुष्टभूतनिषेवितः । कामी कलानिधिकान्तः कामिनीवशकृद् वशी ॥ १३॥ जगद्रक्षाकरोऽनन्तो
    मायामन्त्रौषधीमयः । सर्वसिद्धिप्रदो वैद्यः प्रभविष्णुरितीव ह्रि ह्रीं ॐ ॥ १४
