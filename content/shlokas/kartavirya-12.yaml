id: kartavirya-12
category: stotram
name:
  english: kartavirya 12
  devanagari: कार्तवीर्य १२
content:
  english: kartavirya dvadashanamastotram kartaviryarjuno nama raja bahusahasravan | tasya smaranamatrena
    gatam nashtam ca labhyate || 1|| kartaviryah khaladveshi kritaviryasuto bali | sahasrabahuh shatrughno
    raktavasa dhanurdharah || 2|| raktagandho raktamalyo raja smarturabhishtadah | dvadashaitani namani
    kartaviryasya yah pathet || 3|| sampadastatra jayante janastatra vasham gatah | anayatyashu durastham
    kshemalabhayutam priyam || 4|| kartavirya mahabaho sarvadishtavibarhana | sarvam raksha sada tishtha
    dushtannashaya pahi mam || 5|| sahasrabahusasharam mahitam sacapam raktambaram raktakiritakundalam
    | coradi
  devanagari: कार्तवीर्य द्वादशनामस्तोत्रम् कार्तवीर्यार्जुनो नाम राजा बाहुसहस्रवान् । तस्य स्मरणमात्रेण
    गतं नष्टं च लभ्यते ॥ १॥ कार्तवीर्यः खलद्वेषी कृतवीर्यसुतो बली । सहस्रबाहुः शत्रुघ्नो रक्तवासा धनुर्धरः
    ॥ २॥ रक्तगन्धो रक्तमाल्यो राजा स्मर्तुरभीष्टदः । द्वादशैतानि नामानि कार्तवीर्यस्य यः पठेत् ॥ ३॥ सम्पदस्तत्र
    जायन्ते जनस्तत्र वशं गतः । आनयत्याशु दूरस्थं क्षेमलाभयुतं प्रियम् ॥ ४॥ कार्तवीर्य महाबाहो सर्वदिष्टविबर्हण
    । सर्वं रक्ष सदा तिष्ठ दुष्टान्नाशय पाहि माम् ॥ ५॥ सहस्रबाहुसशरं महितं सचापं रक्ताम्बरं रक्तकिरीटकुण्डलम्
    । चोरादि
