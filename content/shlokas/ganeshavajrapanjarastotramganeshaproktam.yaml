id: ganeshavajrapanjarastotramganeshaproktam
category: stotram
name:
  english: ganeshavajrapanjarastotramganeshaproktam
  devanagari: गणेशवज्रपन्जरस्तोत्रम्गणेशप्रोक्तम्
content:
  english: trinetram gajasyam caturbahudharam parashvadishastrairyutam bhalacandram | narakaradeham sada
    yogashantam ganesham bhaje sarvavandyam paresham || 38|| evam dhyatva ganeshanam manasairupacarakaih
    | pujayettam namaskritya dharayedvajrapanjaram || 39|| bindurupo vakratundo rakshatu me hridi sthitah
    | dehamshcaturvidhamstatvamstatvadharah sanatanah || 40|| dehamohayutam hyekadantah so'ham svarupadhrik
    | dehinam mam visheshena rakshatu bhramanashakah || 41|| mahodarastatha devo nanabodhan pratapavan
    | sada rakshatu me bodhanandasamstho hyaharnisham || 42|| sankhyan rakshatu sankhyesho gajananah susiddhidah
    | asatyeshu sthitam mam sa lambodarashca rakshatu || 43|| satsu sthitam sumohena vikato mam paratparah
    | rakshatu bhaktavatsalyat sadaikamritadharakah || 44|| anandeshu sthitam nityam mam rakshatu samatmakah
    | vighnarajo mahavighnairnanakhelakarah prabhuh || 45|| avyakteshu sthitam nityam dhumravarnasvarupadhrik
    | mam rakshatu sukhakarah sahajah sarvapujitah || 46|| svasamvedyeshu samstham mam ganeshah svasvarupadhrik
    | rakshatu yogabhavena samsthito bhavanayakah || 47|| ayogeshu sthitam nityam mam rakshatu ganeshvarah
    | nivrittirupadhrik sakshadasamadhisukhe ratah || 48|| yogashantidharo mam tu rakshatu yogasamsthitam
    | ganadhishah prasannatma siddhibuddhisamanvitah || 49|| puro mam gajakarnashca rakshatu vighnaharakah
    | vahnyam yamyam ca nairrityam cintamanirvarapradah || 50|| rakshatu pashcime dhundhirherambo vayudik
    sthitam | vinayakashcottare tu pramodashceshadik sthitam || 51|| urdhvam siddhipatih patu buddhisho'dhah
    sthitam sada | sarvangeshu mayureshah patu mam bhaktilalasah || 52|| yatra tatra sthitam mam tu sada
    rakshatu yogapah | parashupashasamyukto varadabhayadharakah || 53|| idam ganapateh proktam vajrapanjarakam
    param | dharayasva mahadeva vijayi tvam bhavishyasi || 54|| ya idam panjaram dhritva yatra kutra sthito
    bhavet | na tasya jayate kvapi bhayam nanasvabhavajam || 55|| yah pathet panjaram nityam sa ipsitamavapnuyat
    | vajrasaratanurbhutva caret sarvatra manavah || 56|| trikalam yah pathennityam sa ganesha ivaparah
    | nirvighnah sarvakaryeshu brahmabhuto bhavennarah || 57|| yah sha
  devanagari: त्रिनेत्रं गजास्यं चतुर्बाहुधारं परश्वादिशस्त्रैर्युतं भालचन्द्रम् । नराकारदेहं सदा योगशान्तं
    गणेशं भजे सर्ववन्द्यं परेशम् ॥ ३८॥ एवं ध्यात्वा गणेशानं मानसैरुपचारकैः । पूजयेत्तं नमस्कृत्य धारयेद्वज्रपञ्जरम्
    ॥ ३९॥ बिन्दुरूपो वक्रतुण्डो रक्षतु मे हृदि स्थितः । देहांश्चतुर्विधांस्तत्वांस्तत्वाधारः सनातनः ॥
    ४०॥ देहमोहयुतं ह्येकदन्तः सोऽहं स्वरूपधृक् । देहिनं मां विशेषेण रक्षतु भ्रमनाशकः ॥ ४१॥ महोदरस्तथा
    देवो नानाबोधान् प्रतापवान् । सदा रक्षतु मे बोधानन्दसंस्थो ह्यहर्निशम् ॥ ४२॥ साङ्ख्यान् रक्षतु साङ्ख्येशो
    गजाननः सुसिद्धिदः । असत्येषु स्थितं मां स लम्बोदरश्च रक्षतु ॥ ४३॥ सत्सु स्थितं सुमोहेन विकटो मां परात्परः
    । रक्षतु भक्तवात्सल्यात् सदैकामृतधारकः ॥ ४४॥ आनन्देषु स्थितं नित्यं मां रक्षतु समात्मकः । विघ्नराजो
    महाविघ्नैर्नानाखेलकरः प्रभुः ॥ ४५॥ अव्यक्तेषु स्थितं नित्यं धूम्रवर्णस्वरूपधृक् । मां रक्षतु सुखाकारः
    सहजः सर्वपूजितः ॥ ४६॥ स्वसंवेद्येषु संस्थं मां गणेशः स्वस्वरूपधृक् । रक्षतु योगभावेन संस्थितो भवनायकः
    ॥ ४७॥ अयोगेषु स्थितं नित्यं मां रक्षतु गणेश्वरः । निवृत्तिरूपधृक् साक्षादसमाधिसुखे रतः ॥ ४८॥ योगशान्तिधरो
    मां तु रक्षतु योगसंस्थितम् । गणाधीशः प्रसन्नात्मा सिद्धिबुद्धिसमन्वितः ॥ ४९॥ पुरो मां गजकर्णश्च रक्षतु
    विघ्नहारकः । वाह्न्यां याम्यां च नैरृत्यां चिन्तामणिर्वरप्रदः ॥ ५०॥ रक्षतु पश्चिमे ढुण्ढिर्हेरम्बो
    वायुदिक् स्थितम् । विनायकश्चोत्तरे तु प्रमोदश्चेशदिक् स्थितम् ॥ ५१॥ ऊर्ध्वं सिद्धिपतिः पातु बुद्धीशोऽधः
    स्थितं सदा । सर्वाङ्गेषु मयूरेशः पातु मां भक्तिलालसः ॥ ५२॥ यत्र तत्र स्थितं मां तु सदा रक्षतु योगपः
    । परशुपाशसंयुक्तो वरदाभयधारकः ॥ ५३॥ इदं गणपतेः प्रोक्तं वज्रपञ्जरकं परम् । धारयस्व महादेव विजयी त्वं
    भविष्यसि ॥ ५४॥ य इदं पञ्जरं धृत्वा यत्र कुत्र स्थितो भवेत् । न तस्य जायते क्वापि भयं नानास्वभावजम्
    ॥ ५५॥ यः पठेत् पञ्जरं नित्यं स ईप्सितमवाप्नुयात् । वज्रसारतनुर्भूत्वा चरेत् सर्वत्र मानवः ॥ ५६॥ त्रिकालं
    यः पठेन्नित्यं स गणेश इवापरः । निर्विघ्नः सर्वकार्येषु ब्रह्मभूतो भवेन्नरः ॥ ५७॥ यः श
