id: narayaniyam-dashaka-48
category: stotram
name:
  english: Narayaniyam Dashaka 48
content:
  english: muda suraughaistvamudarasammadai rudirya damodara ityabhishtutah | mridudarah svairamulukhale
    laga nnadurato dvau kakubhavudaikshathah || || kuberasunurnalakubarabhidhah paro manigriva iti pratham
    gatah | maheshasevadhigatashriyonmadau ciram kila tvadvimukhavakhelatam || || surapagayam kila tau
    madotkatau surapagayadbahuyauvatavritau | vivasasau keliparau sa narado bhavatpadaikapravano niraikshata
    || || bhiya priyalokamupattavasasam puro nirikshyapi madandhacetasau | imau bhavadbhaktyupashantisiddhaye
    munirjagau shantimrite kutah sukham || || yuvamavaptau kakubhatmatam ciram harim nirikshyatha padam
    svamapnutam | itiretau tau bhavadikshanaspriham gatau vrajante kakubhau babhuvatuh || || atandramindradruyugam
    tathavidham sameyusha mantharagamina tvaya | tirayitolukhalarodhanirdhutau ciraya jirnau paripatitau
    taru || || abhaji shakhidvitayam yada tvaya tadaiva tadgarbhatalannireyusha | mahatvisha yakshayugena
    tatkshana dabhaji govinda bhavanapi stavaih || || ihanyabhakto'pi sameshyati kramat bhavantametau
    khalu rudrasevakau | muniprasadadbhavdanghrimagatau gatau vrinanau khalu bhaktimuttamam || || tatastaruddaranadarunarava
    prakampisampatini gopamandale | vilajjitatvajjananimukhekshina vyamokshi nandena bhavan vimokshadah
    || || mahiruhormadhyagato batarbhako hareh prabhavadaparikshato'dhuna | iti bruvanairgamito griham
    bhavan marutpuradhishvara pahi mam gadat ||
  devanagari: मुदा सुरौघैस्त्वमुदारसम्मदै रुदीर्य दामोदर इत्यभिष्टुतः । मृदुदरः स्वैरमुलूखले लग न्नदूरतो
    द्वौ ककुभावुदैक्षथाः ॥ ॥ कुबेरसूनुर्नलकूबराभिधः परो मणिग्रीव इति प्रथां गतः । महेशसेवाधिगतश्रियोन्मदौ
    चिरं किल त्वद्विमुखावखेलताम् ॥ ॥ सुरापगायां किल तौ मदोत्कटौ सुरापगायद्बहुयौवतावृतौ । विवाससौ केलिपरौ
    स नारदो भवत्पदैकप्रवणो निरैक्षत ॥ ॥ भिया प्रियालोकमुपात्तवाससं पुरो निरीक्ष्यापि मदान्धचेतसौ । इमौ
    भवद्भक्त्युपशान्तिसिद्धये मुनिर्जगौ शान्तिमृते कुतः सुखम् ॥ ॥ युवामवाप्तौ ककुभात्मतां चिरं हरिं निरीक्ष्याथ
    पदं स्वमाप्नुतम् । इतीरेतौ तौ भवदीक्षणस्पृहां गतौ व्रजान्ते ककुभौ बभूवतुः ॥ ॥ अतन्द्रमिन्द्रद्रुयुगं
    तथाविधं समेयुषा मन्थरगामिना त्वया । तिरायितोलूखलरोधनिर्धुतौ चिराय जीर्णौ परिपातितौ तरू ॥ ॥ अभाजि शाखिद्वितयं
    यदा त्वया तदैव तद्गर्भतलान्निरेयुषा । महात्विषा यक्षयुगेन तत्क्षणा दभाजि गोविन्द भवानपि स्तवैः ॥ ॥
    इहान्यभक्तोऽपि समेष्यति क्रमात् भवन्तमेतौ खलु रुद्रसेवकौ । मुनिप्रसादाद्भव्दङ्घ्रिमागतौ गतौ वृणानौ
    खलु भक्तिमुत्तमाम् ॥ ॥ ततस्तरूद्दारणदारुणारव प्रकम्पिसम्पातिनि गोपमण्डले । विलज्जितत्वज्जननीमुखेक्षिणा
    व्यमोक्षि नन्देन भवान् विमोक्षदः ॥ ॥ महीरुहोर्मध्यगतो बतार्भको हरेः प्रभावादपरिक्षतोऽधुना । इति ब्रुवाणैर्गमितो
    गृहं भवान् मरुत्पुराधीश्वर पाहि मां गदात् ॥
