id: vishnuproktamshivastotram
category: stotram
name:
  english: vishnuproktamshivastotram
  devanagari: विष्णुप्रोक्तंशिवस्तोत्रम्
content:
  english: vishnuproktam shivastotram vishnuruvaca | kritvapi sumahatpapam yastvam smarati manavah | adharam
    jagatamisha tasya papam viliyate || 34|| yatha tamo na tishtheta sannidhavamshumalinah | tathaiva
    tava yo bhaktah papam tasya vrajetkshayam || 35|| yashcintayati punyatma tava padambujadvayam | brahmahatyakritamapi
    papam tasya vrajetkshayam || 36|| tava namanurakta vagyasya pumso jagatpate | apyadrikutatulitam nainastamanubadhate
    || 37|| paramatmanparandhama svecchabhidhritavigraha | kutuhalam taveshedam kripanadhinateshvara ||
    38|| adya dhanyo'smi devesha yatra pashyanti yoginah | pashyami tam jaganmurttim parameshvaramavyayam
    || 39|| adya me paramo labhastvadya me mangalam param | tam drishtvamritatriptasya trinam svargapavargakam
    || 9
  devanagari: विष्णुप्रोक्तं शिवस्तोत्रम् विष्णुरुवाच । कृत्वापि सुमहत्पापं यस्त्वां स्मरति मानवः । आधारं
    जगतामीश तस्य पापं विलीयते ॥ ३४॥ यथा तमो न तिष्ठेत सन्निधावंशुमालिनः । तथैव तव यो भक्तः पापं तस्य व्रजेत्क्षयम्
    ॥ ३५॥ यश्चिन्तयति पुण्यात्मा तव पादाम्बुजद्वयम् । ब्रह्महत्याकृतमपि पापं तस्य व्रजेत्क्षयम् ॥ ३६॥
    तव नामानुरक्ता वाग्यस्य पुंसो जगत्पते । अप्यद्रिकूटतुलितं नैनस्तमनुबाधते ॥ ३७॥ परमात्मन्परन्धाम स्वेच्छाभिधृतविग्रह
    । कुतूहलं तवेशेदं कृपणाधीनतेश्वर ॥ ३८॥ अद्य धन्योऽस्मि देवेश यत्र पश्यन्ति योगिनः । पश्यामि तं जगन्मूर्त्तिं
    परमेश्वरमव्ययम् ॥ ३९॥ अद्य मे परमो लाभस्त्वद्य मे मङ्गलं परम् । तं दृष्ट्वामृततृप्तस्य तृणं स्वर्गापवर्गकम्
    ॥ ९
