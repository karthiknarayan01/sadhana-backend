id: nrisimhasahasraksharimantrah
category: mantra
name:
  english: nrisimhasahasraksharimantrah
  devanagari: नृसिंहसहस्राक्षरीमन्त्रः
content:
  english: nrisimhasahasraksharimantrah shrilakshminrisimhaya namah | om asya shrisahasraksharamantrasya
    kapila mahavishnurishiranushtup chandah | shrilakshminrisimho devata | kshraum bijam dram shaktih
    shrim kilakam | shrilakshminrisimhaprityarthe jape viniyogah | om kshram sahasrajvalajvalitashrilakshminrisimhaya
    angushthabhyam namah | om kshrim mahavikata shrinrisimhaya tarjanibhyam namah | om kshrum taptahatakakeshaya
    jvalatpavakalocanavajradhikanakhasparshadivyasimham namo'stu te mahadhvanidhvastajagadbhayashrinrisimhaya
    madhyamabhyam namah | om kshraim savarnadamitavijvalitashrinrisimhaya anamikabhyam namah | om kshraum
    sahasrakshiravishvarupadharine pradiptadik cakrakanitnaya shrinrisimhaya kanishthikabhyam namah |
    om kshrah sahasrasripitakalmasha murtaye sahasrabahave sahasrayudhadharaya nrisimhaya karatalakaraprishthabhyam
    namah | astraya phat | atha dhyanam | kopaduddhritakarnah sphuradadharadalallasallolajihvah | prodbhagnabhrukutijvaladalanibhashcakshurangaraghorah
    | samram bhojjam manashaputaratidanilodbhranta bhubhritsahasram garjan vajrogradamshtrapurataratichandah
    patu bhimo nrisimhah || 1|| evam dhyatva om kshraum hrim lakshminrisimhamantramarvatayishyami sa ca
    tadyatha om krodhamurtaye mahapurushadhyanadharmadharmanirmocanakalapurushakalantakah vishveshvarah
    vishvamtaka nivishtacaitanyacitsadabhasa kalatita nityoditanudayastamayau dinditaparamakarunyaka hridayabjacartudalanivishtacaitanya
    ekatman shodashatman caturvimshatman pancavimshatman shad vimshatman saptavimshatman sahasramurte
    ehi ehi bhagavannrisimha krodheshvara ramashatasahasravanditapada kalpantagnisahasrakotaroma mahadeva
    nikayashadashadanavan amalanayana pingalekshana chatadamshtranakhayudhadhara danavendra daityendrakarana
    shronitasamsikta vigrahabhritatma shmarapala dhyanasurasuravandyamanapadapankaja bhagavan vyomacakreshvara
    prabhavavyayarupin tishtha tishtha avidya nicayam daha jnanaishvaryam prakashaya prakashaya sarva
    asheshajrimbhajrimbhita satpurusha sahasrabaho dashasvasan madhyanivishtam vai mama duhkhasvapnabhayam
    nigadabhayam kantarabhayam agnicaurabhayam vishamajvaragrahadakinibhayam krityadbhayam adhvakhedabhayam
    chayabhayam maribhayam mahamaribhayam durbhikshabhayam ashanibhayam chayaskamshmarabhayam rajabhayam
    jalasubhrabhayam gajasimhabhujangabhayam nirmocaya nirmocaya prashamaya prashamaya ajeyarupadharin
    brihatsamapurusha sarvabhayanivaranaya ashta'shtaka catuhshashticaika vidyavritamaya stridevakotimutpadapankajanvita
    sahasravadana sahasrekshana sahasrodara sahasrabhuja sahasrapata jihvasahasram lalaya lalaya sahasrayudhadhara
    tamaprakasham sakalayamayamapuramanthana sarvamantrarajeshvaravaibhavaya gatiprada patalayantrapramardana
    ghorattahasyahasita vishvavasudeva yantrakshara akrurahayamukha paramahamsa vishveshvara nivishtacaitanya
    citpradurbhavakaraka rishikesha suchandaprada nihsheshajivagrasaka mahapisitasrikkagrasalampata khecarisiddhipradayaka
    ajeyavyayavyaktabrahmandodara brahmandakotisahasrakritamalamanditamunda matsyakurmavarahanrisimhavamana
    trailokyakramanapadashilinriramatraya krishnabuddhakalkirupadhara tattvatraya pranavadhara tichisantanivishta
    svasvadhi vaushat puranadhara adirajapranapananivishta pancaratrika ditijananidhanakara mahamayadaityendradarpadalane
    tejorashine | om klim mrityai phat om na na phat om ghram vayave phat om acyutaya phat om hrim murtaye
    phat om kshraum vishvamurtaye phat || om krim tejashvaraya phat | om glaum tejastraya phat | prasasanti
    phat || om gham hi evamrupadharine phat | om kshraum arupadharine phat | om ghraum tryavishvatmane
    phat | om tryashvatmane phat | om syum mam caturatmane phat | om nri nrisimharupadharine phat | om
    dram dram rsam phat | om saum paramahamse phat | klah klah ashtangavidyasamnyasta sanyasarupadharine
    phat | om draum nishitarupadharine phat | om ham arupadharine phat | om om hram hram hram hram hram
    hram ha khah khah svadaya svadaya svadaya svadaya | om glaum abhishtamanaya mahatmyam darshaya darshaya
    | sanidhyam kuru kuru | shrilakshminrisimhaya namah | om kshram kshrim kshrum kshraim kshraum kshrah
    | om nrisimharupita kalmashamurtaye om dram drim drum draim draum drah | om shrim shrim nrisimhaya
    jnanatmane namah shrilakshmayai namah | om om om om om om om om om om namo bhagavate viranrisimhaya
    jvalamalaya pradipta damshtrakaralaya jnanagninetraya sarvarakshoghnaya sarvabhutavinashaya sarva
    alpamrityuvinashaya sarvavyadhivinashaya sarvadushtavinashaya sarvavishavinashaya hana hana daha daha
    paca paca matha matha bandha bandha raksha raksha mam hum phat hum phat svaha || hamsa so'ham nrisimhatmako'ham
    shrim hrim kshraum om om a | om a a gha gha ra ghe ghe lah khah khah svaha | om shrinrisimhaya namah
    | sahasraksharena mantrena yo harim stauti nityashah | nrisimhastu susiddhasyat sarve mantravashanugah
    || surantamamalam cakram bhrumadhye yatsudarshanam | tasya prabhavat bahuh prekshyah hantum pretapishacakan
    || iti shri kapiladevaviracitam shrinrisimhasahasraksharimantram sampurnam | shrirastu kalyanamastu
    |
  devanagari: नृसिंहसहस्राक्षरीमन्त्रः श्रीलक्ष्मीनृसिंहाय नमः । ॐ अस्य श्रीसहस्राक्षरमन्त्रस्य कपिल महाविष्णुऋषिरनुष्टुप्
    छन्दः । श्रीलक्ष्मीनृसिंहो देवता । क्ष्रौं बीजं द्रां शक्तिः श्रीं कीलकम् । श्रीलक्ष्मीनृसिंहप्रीत्यर्थे
    जपे विनियोगः । ॐ क्ष्रां सहस्रज्वालाज्वलितश्रीलक्ष्मीनृसिंहाय अङ्गुष्ठाभ्यां नमः । ॐ क्ष्रीं महाविकट
    श्रीनृसिंहाय तर्जनीभ्यां नमः । ॐ क्ष्रूं तप्तहाटककेशाय ज्वलत्पावकलोचनवज्राधिकनखस्पर्शदिव्यसिंहं नमोऽस्तु
    ते महाध्वनिध्वस्तजगद्भयश्रीनृसिंहाय मध्यमाभ्यां नमः । ॐ क्ष्रैं सवर्णदमितविज्वलितश्रीनृसिंहाय अनामिकाभ्यां
    नमः । ॐ क्ष्रौं सहस्राक्षिरविश्वरूपधारिणे प्रदीप्तदिक् चक्रकानित्नाय श्रीनृसिंहाय कनिष्ठिकाभ्यां नमः
    । ॐ क्ष्रः सहस्रसृपिताकल्मष मूर्तये सहस्रबाहवे सहस्रायुधधराय नृसिंहाय करतलकरपृष्ठाभ्यां नमः । अस्त्राय
    फट् । अथ ध्यानम् । कोपादुद्धृतकर्णः स्फुरदधरदलल्लसल्लोलजिह्वः । प्रोद्भग्नभ्रुकुटीज्वलदलनिभश्चक्षुरङ्गारघोरः
    । संरं भोज्जं मनाशापुटरटिदनिलोद्भ्रान्त भूभृत्सहस्रं गर्जन् वज्रोग्रदंष्ट्रापुरटरटिछन्दः पातु भीमो
    नृसिंहः ॥ १॥ एवं ध्यात्वा ॐ क्ष्रौं ह्रीं लक्ष्मीनृसिंहमन्त्रमार्वतयिष्यामि स च तद्यथा ॐ क्रोधमूर्तये
    महापुरुषध्यानधर्माधर्मनिर्मोचनकालपुरुषकालान्तकः विश्वेश्वरः विश्वांतक निविष्टचैतन्यचित्सदाभास कालातीत
    नित्योदितनुदयास्तमयौ डिण्डितपरमकारुण्यक हृदयाब्जचर्तुदलनिविष्टचैतन्य एकात्मन् षोडशात्मन् चतुर्विंशात्मन्
    पञ्चविंशात्मन् षड् विंशात्मन् सप्तविंशात्मन् सहस्रमूर्ते एहि एहि भगवन्नृसिंह क्रोधेश्वर रामशतसहस्रवन्दितपाद
    कल्पान्ताग्निसहस्रकोटरोम महादेव निकायशदशदानवान् अमलनयन पिङ्गलेक्षण छटादंष्ट्रानखायुधधर दानवेन्द्र
    दैत्येन्द्रकरण श्रोणितसंसिक्त विग्रहभृतात्मा श्मरपाल ध्यानसुरासुरवन्द्यमानपादपङ्कज भगवान् व्योमचक्रेश्वर
    प्रभवाव्ययरूपिन् तिष्ठ तिष्ठ अविद्या निचयं दह ज्ञानैश्वर्यं प्रकाशय प्रकाशय सर्व अशेषजृम्भाजृम्भित
    सत्पुरुष सहस्रबाहो दशस्वसन् मध्यानिविष्टं वै मम दुःखस्वप्नभयं निगडभयं कान्तारभयं अग्निचौरभयं विषमज्वरग्रहडाकिनीभयं
    कृत्याद्भयं अध्वखेदभयं छायाभयं मारीभयं माहामारीभयं दुर्भिक्षभयं अशनिभयं छायास्कंश्मरभयं राजभयं जलसुभ्रभयं
    गजसिंहभुजङ्गभयं निर्मोचय निर्मोचय प्रशामय प्रशामय अजेयरूपधारिन् बृहत्सामपुरुष सर्वभयनिवारणाय अष्टाऽष्टक
    चतुःषष्टिचैक विद्यावृतमय स्त्रिदेवकोटिमुत्पादपङ्कजान्वित सहस्रवदन सहस्रेक्षण सहस्रोदर सहस्रभुज सहस्रपात
    जिह्वासहस्रं लालय लालय सहस्रायुधधर तमप्रकाशं सकलयमयमपुरमन्थन सर्वमन्त्रराजेश्वरवैभवाय गतिप्रद पातालयन्त्रप्रमर्दन
    घोराट्टहास्यहासित विश्ववासुदेव यन्त्राक्षर अक्रूरहयमुख परमहंस विश्वेश्वर निविष्टचैतन्य चित्प्रादुर्भावकारक
    ऋषिकेश सुछन्दप्रद निःशेषजीवग्रासक महापिसितासृक्कग्रासलम्पट खेचरीसिद्धिप्रदायक अजेयाव्ययाव्यक्तब्रह्माण्डोदर
    ब्रह्माण्डकोटिसहस्रकृतमालामण्डितमुण्ड मत्स्यकूर्मवराहनृसिंहवामन त्रैलोक्याक्रमणपादशीलिनृरामत्रय कृष्णबुद्धकाल्किरूपधर
    तत्त्वत्रय प्रणवाधार तिछिसान्तनिविष्ट स्वस्वधी वौषट् पुराणाधार आदिराजप्राणापाननिविष्ट पञ्चरात्रिक
    दितिजननिधनकर महामायदैत्येन्द्रदर्पदलने तेजोराशिने । ॐ क्लीं मृत्यै फट् ॐ न न फट् ॐ घ्रां वायवे फट्
    ॐ अच्युताय फट् ॐ ह्रीं मूर्तये फट् ॐ क्ष्रौं विश्वमूर्तये फट् ॥ ॐ क्रीं तेजश्वराय फट् । ॐ ग्लौं तेजस्त्राय
    फट् । प्रससन्ति फट् ॥ ॐ घं हि एवंरूपधारिणे फट् । ॐ क्ष्रौं अरूपधारिणे फट् । ॐ घ्रौं त्र्यविश्वात्मने
    फट् । ॐ त्र्यश्वात्मने फट् । ॐ स्यूं मं चतुरात्मने फट् । ॐ नृ नृसिंहरूपधारिणे फट् । ॐ द्रं द्रं र्सं
    फट् । ॐ सौं परमहंसे फट् । क्लः क्लः अष्टाङ्गविद्यासंन्यस्त सन्यासरूपधारिणे फट् । ॐ द्रौं निशितरूपधारिणे
    फट् । ॐ हं अरूपधारिणे फट् । ॐ ॐ ह्रं ह्रं ह्रं ह्रं ह्रं ह्रं ह खः खः स्वादय स्वादय स्वादय स्वादय
    । ॐ ग्लौं अभिष्टमानय माहात्म्यं दर्शय दर्शय । सानिध्यं कुरु कुरु । श्रीलक्ष्मीनृसिंहाय नमः । ॐ क्ष्रां
    क्ष्रीं क्ष्रूं क्ष्रैं क्ष्रौं क्ष्रः । ॐ नृसिंहरूपिता कल्मषमूर्तये ॐ द्रां द्रीं द्रूं द्रैं द्रौं
    द्रः । ॐ श्रीं श्रीं नृसिंहाय ज्ञानात्मने नमः श्रीलक्ष्मयै नमः । ॐ ॐ ॐ ॐ ॐ ॐ ॐ ॐ ॐ ॐ नमो भगवते वीरनृसिंहाय
    ज्वालामालाय प्रदीप्त दंष्ट्राकरालाय ज्ञानाग्निनेत्राय सर्वरक्षोघ्नाय सर्वभूतविनाशाय सर्व अल्पमृत्यूविनाशाय
    सर्वव्याधिविनाशाय सर्वदुष्टविनाशाय सर्वविषविनाशाय हन हन दह दह पच पच मथ मथ बन्ध बन्ध रक्ष रक्ष मां
    हुं फट् हुं फट् स्वाहा ॥ हंस सोऽहं नृसिंहात्मकोऽहं श्रीं ह्रीं क्ष्रौं ॐ ॐ अ । ॐ अ अ घ घ र घे घे लः
    खः खः स्वाहा । ॐ श्रीनृसिंहाय नमः । सहस्राक्षरेण मन्त्रेण यो हरिं स्तौति नित्यशः । नृसिंहस्तु सुसिद्धस्यात्
    सर्वे मन्त्रवशानुगाः ॥ सुरान्तममलं चक्रं भ्रूमध्ये यत्सुदर्शनम् । तस्य प्रभावात् बहुः प्रेक्ष्याः
    हन्तुं प्रेतपिशाचकान् ॥ इति श्री कपिलदेवविरचितं श्रीनृसिंहसहस्राक्षरीमन्त्रं सम्पूर्णम् । श्रीरस्तु
    कल्याणमस्तु ।
