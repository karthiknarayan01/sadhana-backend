id: agastyakritam01shivastotram
category: stotram
name:
  english: agastyakritam01shivastotram
  devanagari: अगस्त्यकृतं०१शिवस्तोत्रम्
content:
  english: agastyakritam 1 shivastotram agastya uvaca | namah kalyanaveshaya kalikalmashanashine | namo
    viharine vishvavibudhanam hridangane | namah svantanivasaya shantanam samacetasam || 71|| asadharanakrityaya
    namaste krittivasase | nilagrivaya nityaya nissamaptyudayatmane || 72|| paravamardhavapushe namah
    kshemankaraya te | ardham marakatakaramardham sphatikasannibham || 73|| advaitamapi yattejo dvaitibhutam
    namo namah | kantam kalyananilayam kalitasheshakautukam || 74|| kandarpakotilavanyam yuvanam sambamishvaram
    | mangalaya mahastomaprastutashcaryarupine || 75|| gaurinathaya nathaya namassomardhadharine | shivaya
    paripurnaya purnanandaya vedhase || 76|| mahavrishabhavahaya mahadevaya te namah | shuline nilakanthaya
    phalacandravatamsine || 77|| bhavaya bhavanashaya pashunam pataye namah | jaya natha kripadrishtya
    vatsam secaya mam prabho || 78|| ma munca padayugaladanatham tvatparigraham | ekasmadagaso dvabhyam
    tribhyo va raksha mam muhuh || 79|| bahubhyo hi mahadeva mam pahi karunanidhe | tvatsannidhividhanena
    hrishto'smi nitaram vibho || 80|| ahladaya kripadrishtya vrishtya bhuvamivambudah | gharmatapto'dhvagodhvanamatitya
    bahuyojanam || 81|| anghripankeruhacchayamaptam pahi jagadguro | na vedmi tvatpadambhojadaparam daivatam
    param || 82|| ata eva mahadeva tvamasmi sharanam gatah | prasida gaurinatha tvam prasida girijapate
    || 83|| prasida satatam mahyam natha kantimatipate | namo venuvaneshaya mahakalyanarupine || 84||
    hatakambhojinitiravasine shuline namah | tamratarangasanklinnapadambhojaya te namah || 85|| brahmavriddhapurishaya
    purvapurvaya te namah | iti tamraparnimahatmye shodashadhyayantargatam agastyakritam shivastotram
    sampurnam | tamraparnimahatmya | adhyaya 16
  devanagari: अगस्त्यकृतं १ शिवस्तोत्रम् अगस्त्य उवाच । नमः कल्याणवेषाय कलिकल्मषनाशिने । नमो विहारिणे
    विश्वविबुधानां हृदङ्गणे । नमः स्वान्तनिवासाय शान्तानां समचेतसाम् ॥ ७१॥ असाधारणकृत्याय नमस्ते कृत्तिवाससे
    । नीलग्रीवाय नित्याय निस्समाप्त्युदयात्मने ॥ ७२॥ परवामार्धवपुषे नमः क्षेमङ्कराय ते । अर्धं मरकताकारमर्धं
    स्फटिकसन्निभम् ॥ ७३॥ अद्वैतमपि यत्तेजो द्वैतीभूतं नमो नमः । कान्तं कल्याणनिलयं कलिताशेषकौतुकम् ॥ ७४॥
    कन्दर्पकोटिलावण्यं युवानं साम्बमीश्वरम् । मङ्गलाय महस्तोमप्रस्तुताश्चर्यरूपिणे ॥ ७५॥ गौरीनाथाय नाथाय
    नमस्सोमार्धधारिणे । शिवाय परिपूर्णाय पूर्णानन्दाय वेधसे ॥ ७६॥ महावृषभवाहाय महादेवाय ते नमः । शूलिने
    नीलकण्ठाय फालचन्द्रावतंसिने ॥ ७७॥ भवाय भवनाशाय पशूनां पतये नमः । जय नाथ कृपादृष्ट्या वत्सं सेचय मां
    प्रभो ॥ ७८॥ मा मुञ्च पादयुगलादनाथं त्वत्परिग्रहम् । एकस्मादागसो द्वाभ्यां त्रिभ्यो वा रक्ष मां मुहुः
    ॥ ७९॥ बहुभ्यो हि महादेव मां पाहि करुणानिधे । त्वत्सन्निधिविधानेन हृष्टोऽस्मि नितरां विभो ॥ ८०॥ आह्लादय
    कृपादृष्ट्या वृष्ट्या भुवमिवाम्बुदः । घर्मतप्तोऽध्वगोध्वानमतीत्य बहुयोजनम् ॥ ८१॥ अङ्घ्रिपङ्केरुहच्छायमाप्तं
    पाहि जगद्गुरो । न वेद्मि त्वत्पदाम्भोजादपरं दैवतं परम् ॥ ८२॥ अत एव महादेव त्वामस्मि शरणं गतः । प्रसीद
    गौरीनाथ त्वं प्रसीद गिरिजापते ॥ ८३॥ प्रसीद सततं मह्यं नाथ कान्तिमतीपते । नमो वेणुवनेशाय महाकल्याणरूपिणे
    ॥ ८४॥ हाटकाम्भोजिनीतीरवासिने शूलिने नमः । ताम्रातरङ्गसङ्क्लिन्नपादाम्भोजाय ते नमः ॥ ८५॥ ब्रह्मवृद्धपुरीशाय
    पूर्वपूर्वाय ते नमः । इति ताम्रपर्णीमाहात्म्ये षोडशाध्यायान्तर्गतं अगस्त्यकृतं शिवस्तोत्रं सम्पूर्णम्
    । ताम्रपर्णीमाहात्म्य । अध्याय १६
