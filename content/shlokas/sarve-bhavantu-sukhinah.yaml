id: sarve-bhavantu-sukhinah
category: shanti_mantra
name:
  english: Sarve Bhavantu Sukhinah
  devanagari: सर्वे भवन्तु सुखिनः
content:
  english: >-
    om sarve bhavantu sukhinah sarve santu niramayah, sarve bhadrani
    pashyantu ma kaschid duhkha-bhag bhavet
  devanagari: >-
    ॐ सर्वे भवन्तु सुखिनः सर्वे सन्तु निरामयाः । सर्वे भद्राणि
    पश्यन्तु मा कश्चिद्दुःखभाग्भवेत् ॥
meaning:
  english: >-
    May all beings be happy, may all be free from illness, may all
    see what is auspicious, may none suffer.
source_attribution:
  text_source: Traditional Vedic shanti mantra, Brihadaranyaka Upanishad tradition
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
