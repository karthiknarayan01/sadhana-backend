id: ravi-graha-pancharatna-stotram
category: stotram
name:
  english: Ravi Graha Pancharatna Stotram
content:
  english: japakusuma sankasham kashyapeyam mahadyutim | tamorim sarvapapaghnam pranatosmidivakaram ||
    || suryo aryama bhagastvashta pusharkassaritaravih | gabhasti manajah kalo mrityurdata prabhakarah
    || || bhutashrayo bhutapatih sarvaloka namaskritah | srashta samvartako vahnih sarvasyadiralolupah
    || || brahma svarupa udaye madhyahnetu maheshvarah | astakale svayam vishnum trayimurti divakarah
    || || saptashvarathamarudham pracandam kashyapatmajam | shvetapadmadharam devam tam suryam pranamamyaham
    || || om graharajaya vidmahe kaladhipaya dhimahi tanno ravih pracodayat ||
  devanagari: जपाकुसुम सङ्काशं काश्यपेयं महाद्युतिम् । तमोरिं सर्वपापघ्नं प्रणतोस्मिदिवाकरम् ॥ ॥ सूर्यो
    अर्यमा भगस्त्वष्टा पूषार्कस्सरितारविः । गभस्ति मानजः कालो मृत्युर्दाता प्रभाकरः ॥ ॥ भूताश्रयो भूतपतिः
    सर्वलोक नमस्कृतः । स्रष्टा संवर्तको वह्निः सर्वस्यादिरलोलुपः ॥ ॥ ब्रह्म स्वरूप उदये मध्याह्नेतु महेश्वरः
    । अस्तकाले स्वयं विष्णुं त्रयीमूर्ती दिवाकरः ॥ ॥ सप्ताश्वरथमारूढं प्रचण्डं कश्यपात्मजम् । श्वेतपद्मधरं
    देवं तं सूर्यं प्रणमाम्यहम् ॥ ॥ ॐ ग्रहराजाय विद्महे कालाधिपाय धीमहि तन्नो रविः प्रचोदयात् ॥
