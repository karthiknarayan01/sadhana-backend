id: candrashekharabharatipancaratnastotram
category: stotram
name:
  english: candrashekharabharatipancaratnastotram
  devanagari: चन्द्रशेखरभारतिपन्चरत्नस्तोत्रम्
content:
  english: shricandrashekharabharati pancaratnastotram shrimacchankaradeshikendrakalite vyakhyanasimhasane
    shrimadvartikakaramukhyamunibhih sarvajnakalpaih pura | adhyudhe vimale'bhishiktamadhuna satyatmanishthaparam
    vande deshikasarvabhaumamanisham shricandracudahvayam || 1|| nanadeshasamagatan padanatamshchatran
    vibhinnashayan adhivyadhivicitratapavivashan svasthyam ninishurmunih | tattatkankshitapuranaya varadam
    samprarthayannambikam yo lokatrayadeshiko vijayate seve tadanghridvayam || 2|| mithyajnanavijrimbhitam
    bhavasukham santyajya nityam sukham praptum sviyapadambujam shritavato bhaktasya punyatmanah | brahmatmaikyavibodhakashrutivacahpiyushasandayinam
    vande brahmaviduttamam pratidinam shrisha
  devanagari: श्रीचन्द्रशेखरभारति पञ्चरत्नस्तोत्रम् श्रीमच्छङ्करदेशिकेन्द्रकलिते व्याख्यानसिंहासने श्रीमद्वार्तिककारमुख्यमुनिभिः
    सर्वज्ञकल्पैः पुरा । अध्यूढे विमलेऽभिषिक्तमधुना सत्यात्मनिष्ठापरं वन्दे देशिकसार्वभौममनिशं श्रीचन्द्रचूडाह्वयम्
    ॥ १॥ नानादेशसमागतान् पदनतांश्छात्रान् विभिन्नाशयान् आधिव्याधिविचित्रतापविवशान् स्वास्थ्यं निनीषुर्मुनिः
    । तत्तत्काङ्क्षितपूरणाय वरदां संप्रार्थयन्नम्बिकां यो लोकत्रयदेशिको विजयते सेवे तदङ्घ्रिद्वयम् ॥ २॥
    मिथ्याज्ञानविजृम्भितं भवसुखं सन्त्यज्य नित्यं सुखं प्राप्तुं स्वीयपदाम्बुजं श्रितवतो भक्तस्य पुण्यात्मनः
    । ब्रह्मात्मैक्यविबोधकश्रुतिवचःपीयूषसन्दायिनं वन्दे ब्रह्मविदुत्तमं प्रतिदिनं श्रीश
