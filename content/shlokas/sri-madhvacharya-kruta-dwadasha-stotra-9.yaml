id: sri-madhvacharya-kruta-dwadasha-stotra-9
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 9
content:
  english: atha navamastotram atimatatamogirisamitivibhedana pitamahabhutida gunagananilaya | shubhatama
    kathashaya paramasadodita jagadekakarana ramaramaramana || || vidhibhavamukhasurasatatasuvanditaramamanovallabha
    bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || || aganitagunaganamayasharira
    he vigatagunetara bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana
    || || aparimitasukhanidhivimalasudeha he vigata sukhetara bhava mama sharanam | shubhatama kathashaya
    paramasadodita jagadekakarana ramaramaramana || || pracalitalayajalaviharana shashvatasukhamayamina
    he bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || ||
    suraditijasubalavilulitamandaradhara para kurma he bhava mama sharanam | shubhatama kathashaya paramasadodita
    jagadekakarana ramaramaramana || || sagirivaradharatalavaha susukaraparamavibodha he bhava mama sharanam
    | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || || atibaladitisuta hridaya
    vibhedana jayanrihare'mala bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana
    ramaramaramana || || balimukhaditisutavijayavinashana jagadavanajita bhava mama sharanam | shubhatama
    kathashaya paramasadodita jagadekakarana ramaramaramana || || avijitakunripatisamitivikhandana ramavara
    virapa bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana ||
    || kharataranishicaradahana paramrita raghuvara manada bhava mama sharanam | shubhatama kathashaya
    paramasadodita jagadekakarana ramaramaramana || || sulalitatanuvara varada mahabala yaduvara parthapa
    bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || || ditisutavimohana
    vimalavibodhana paragunabuddha he bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana
    ramaramaramana || || kalimalahutavaha subhaga mahotsava sharanada kalkisha bhava mama sharanam | shubhatama
    kathashaya paramasadodita jagadekakarana ramaramaramana || || akhilajanivilaya parasukhakarana parapurushottama
    bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || || iti
    tava nutivarasatataraterbhava susharanamurusukhatirthamuneh bhagavan | shubhatama kathashaya paramasadodita
    jagadekakarana ramaramaramana || || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu
    navamastotram sampurnam
  devanagari: अथ नवमस्तोत्रम् अतिमततमोगिरिसमितिविभेदन पितामहभूतिद गुणगणनिलय । शुभतम कथाशय परमसदोदित जगदेककारण
    रामरमारमण ॥ ॥ विधिभवमुखसुरसततसुवन्दितरमामनोवल्लभ भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण
    ॥ ॥ अगणितगुणगणमयशरीर हे विगतगुणेतर भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ अपरिमितसुखनिधिविमलसुदेह
    हे विगत सुखेतर भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ प्रचलितलयजलविहरण शाश्वतसुखमयमीन
    हे भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ सुरदितिजसुबलविलुलितमन्दरधर पर कूर्म
    हे भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ सगिरिवरधरातलवह सुसूकरपरमविबोध हे भव
    मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ अतिबलदितिसुत हृदय विभेदन जयनृहरेऽमल भव मम
    शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ बलिमुखदितिसुतविजयविनाशन जगदवनाजित भव मम शरणम्
    । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ अविजितकुनृपतिसमितिविखण्डन रमावर वीरप भव मम शरणम् ।
    शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ खरतरनिशिचरदहन परामृत रघुवर मानद भव मम शरणम् । शुभतम
    कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ॥ सुललिततनुवर वरद महाबल यदुवर पार्थप भव मम शरणम् । शुभतम कथाशय
    परमसदोदित जगदेककारण रामरमारमण ॥ ॥ दितिसुतविमोहन विमलविबोधन परगुणबुद्ध हे भव मम शरणम् । शुभतम कथाशय
    परमसदोदित जगदेककारण रामरमारमण ॥ ॥ कलिमलहुतवह सुभग महोत्सव शरणद कल्कीश भव मम शरणम् । शुभतम कथाशय परमसदोदित
    जगदेककारण रामरमारमण ॥ ॥ अखिलजनिविलय परसुखकारण परपुरुषोत्तम भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण
    रामरमारमण ॥ ॥ इति तव नुतिवरसततरतेर्भव सुशरणमुरुसुखतीर्थमुनेः भगवन् । शुभतम कथाशय परमसदोदित जगदेककारण
    रामरमारमण ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु नवमस्तोत्रं सम्पूर्णम्
