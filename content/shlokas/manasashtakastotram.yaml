id: manasashtakastotram
category: stotram
name:
  english: manasashtakastotram
  devanagari: मानसाष्टकस्तोत्रम्
content:
  english: se samanvita hai isi prakara yaha trigunatmaka samasta jagat bhi hai atah isa caracaratmaka
    jagat se yaha mana kaise prithak ho || 5|| cintaturo jagatsrashta tada krishnah kriparnavah | hamsarupena
    bhuloke'vatatara ca pushkare || 6|| maharshivara shrisanakadikom ke dvara prashna kiye jane para jaba
    jagatsrashta shribrahma ativa cinta magna hogaye taba kriparnava shrikrishna bhagavan shrihamsarupa
    mem shribrahmadeva ke nikata sarvatirtha guru shripushkara ki pavana dharitri para avatirna hue ||
    6|| vidhaya ca samadhanamantardadhana keshavah | sarveshvarah kripadhama sarvakalyanakarakah || 7||
    sabhi jivamatra ka kalyana karane vale kripanidhi sarvantaratma sarveshvara krishnarupa shrihamsa
    bhagavan ne shrisanakadikom ke prashna ka samadhana karake antardhana hogaye || 7|| atastavanmanovyadhirhatavya
    ca sudhijanaih | tadaiva jivane shantirbhavatiti sunishcitam || 8|| ataeva isa manasika vyadhi ko
    buddhiman purushom ko cahie use sarvatha tyaga karadem tabhi isa manava jivana mem nishcita rupa se
    parama shanti prapta hogi || 8|| shrimanasashtakam stotram jnanabhaktipradayakam | radhasarveshvaradyena
    sharanantena nirmitam || 9|| viveka aura shriharibhakti ko pradana karane vala yaha
  devanagari: से समन्वित है इसी प्रकार यह त्रिगुणात्मक समस्त जगत् भी है अतः इस चराचरात्मक जगत् से यह मन
    कैसे पृथक् हो ॥ ५॥ चिन्तातुरो जगत्स्रष्टा तदा कृष्णः कृपार्णवः । हंसरूपेण भूलोकेऽवततार च पुष्करे ॥
    ६॥ महर्षिवर श्रीसनकादिकों के द्वारा प्रश्न किये जाने पर जब जगत्स्रष्टा श्रीब्रह्मा अतीव चिन्ता मग्न
    होगये तब कृपार्णव श्रीकृष्ण भगवान् श्रीहंसरूप में श्रीब्रह्मदेव के निकट सर्वतीर्थ गुरु श्रीपुष्कर
    की पावन धरित्री पर अवतीर्ण हुए ॥ ६॥ विधाय च समाधानमन्तर्दधान केशवः । सर्वेश्वरः कृपाधाम सर्वकल्याणकारकः
    ॥ ७॥ सभी जीवमात्र का कल्याण करने वाले कृपानिधि सर्वान्तरात्मा सर्वेश्वर कृष्णरूप श्रीहंस भगवान् ने
    श्रीसनकादिकों के प्रश्न का समाधान करके अन्तर्धान होगये ॥ ७॥ अतस्तावन्मनोव्याधिर्हातव्या च सुधीजनैः
    । तदैव जीवने शान्तिर्भवतीति सुनिश्चितम् ॥ ८॥ अतएव इस मानसिक व्याधि को बुद्धिमान् पुरुषों को चाहिए
    उसे सर्वथा त्याग करदें तभी इस मानव जीवन में निश्चित रूप से परम शान्ति प्राप्त होगी ॥ ८॥ श्रीमानसाष्टकं
    स्तोत्रं ज्ञानभक्तिप्रदायकम् । राधासर्वेश्वराद्येन शरणान्तेन निर्मितम् ॥ ९॥ विवेक और श्रीहरिभक्ति
    को प्रदान करने वाला यह
