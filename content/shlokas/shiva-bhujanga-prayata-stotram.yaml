id: shiva-bhujanga-prayata-stotram
category: stotram
name:
  english: Shiva Bhujanga Prayata Stotram
content:
  english: kripasagarayashukavyapradaya pranamrakhilabhishtasandayakaya | yatindrairupasyanghripathoruhaya
    prabodhapradatre namah shankaraya || || cidanandarupaya cinmudrikodya tkarayeshaparyayarupaya tubhyam
    | muda giyamanaya vedottamangaih shritanandadatre namah shankaraya || || jatajutamadhye pura ya suranam
    dhuni sadya karmandirupasya shambhoh gale mallikamalikavyajataste vibhatiti manye guro kim tathaiva
    || || nakhenduprabhadhutanamraliharda ndhakaravrajayabjamandasmitaya | mahamohapathonidherbadabaya
    prashantaya kurmo namah shankaraya || || pranamrantarangabjabodhapradatre divaratramavyahatosraya
    kamam | kshapeshaya citraya lakshma kshayabhyam vihinaya kurmo namah shankaraya || || pranamrasyapathojamodapradatre
    sadantastamastomasamharakartre | rajanya mapiddhaprakashaya kurmo hyapurvaya pushne namah shankaraya
    || || natanam hridabjani phullani shighram karomyashu yogapradanena nunam | prabodhaya cettham sarojani
    dhatse praphullani kim bho guro bruhi mahyam || || prabhadhutacandrayutayakhileshta pradayanatanam
    samuhaya shighram| pratipaya namraughaduhkhaghapankte rmuda sarvada syannamah shankaraya || || vinishkasitanisha
    tattvavabodha nnatanam manobhyo hyananyashrayani | rajamsi prapannani padambujatam guro raktavastrapadeshadbibharshi
    || || matervedashirshadhvasamprapakaya natanam jananam kripardraih katakshaih | tateh papabrindasya
    shighram nihantre smitasyaya kurmo namah shankaraya || || suparvoktigandhena hinaya turnam pura totakayakhilajnanadatre|
    pravaliyagarvapaharasya kartre padabjamradimna namah shankaraya || || bhavambhodhimagnanjananduhkhayuktan
    javaduddidhirshurbhavanityaho'ham | viditva hi te kirtimanyadrishambho sukham nirvishankah svapimyastayatnah
    || || ||iti shrishankaracarya bhujangaprayatastotram||
  devanagari: कृपासागरायाशुकाव्यप्रदाय प्रणम्राखिलाभीष्टसन्दायकाय । यतीन्द्रैरुपास्याङ्घ्रिपाथोरुहाय प्रबोधप्रदात्रे
    नमः शङ्कराय ॥ ॥ चिदानन्दरूपाय चिन्मुद्रिकोद्य त्करायेशपर्यायरूपाय तुभ्यम् । मुदा गीयमानाय वेदोत्तमाङ्गैः
    श्रितानन्ददात्रे नमः शङ्कराय ॥ ॥ जटाजूटमध्ये पुरा या सुराणां धुनी साद्य कर्मन्दिरूपस्य शम्भोः गले
    मल्लिकामालिकाव्याजतस्ते विभातीति मन्ये गुरो किं तथैव ॥ ॥ नखेन्दुप्रभाधूतनम्रालिहार्दा न्धकारव्रजायाब्जमन्दस्मिताय
    । महामोहपाथोनिधेर्बाडबाय प्रशान्ताय कुर्मो नमः शङ्कराय ॥ ॥ प्रणम्रान्तरङ्गाब्जबोधप्रदात्रे दिवारात्रमव्याहतोस्राय
    कामम् । क्षपेशाय चित्राय लक्ष्म क्षयाभ्यां विहीनाय कुर्मो नमः शङ्कराय ॥ ॥ प्रणम्रास्यपाथोजमोदप्रदात्रे
    सदान्तस्तमस्तोमसंहारकर्त्रे । रजन्या मपीद्धप्रकाशाय कुर्मो ह्यपूर्वाय पूष्णे नमः शङ्कराय ॥ ॥ नतानां
    हृदब्जानि फुल्लानि शीघ्रं करोम्याशु योगप्रदानेन नूनम् । प्रबोधाय चेत्थं सरोजानि धत्से प्रफुल्लानि
    किं भो गुरो ब्रूहि मह्यम् ॥ ॥ प्रभाधूतचन्द्रायुतायाखिलेष्ट प्रदायानतानां समूहाय शीघ्रम्। प्रतीपाय
    नम्रौघदुःखाघपङ्क्ते र्मुदा सर्वदा स्यान्नमः शङ्कराय ॥ ॥ विनिष्कासितानीश तत्त्वावबोधा न्नतानां मनोभ्यो
    ह्यनन्याश्रयाणि । रजांसि प्रपन्नानि पादाम्बुजातं गुरो रक्तवस्त्रापदेशाद्बिभर्षि ॥ ॥ मतेर्वेदशीर्षाध्वसम्प्रापकाया
    नतानां जनानां कृपार्द्रैः कटाक्षैः । ततेः पापबृन्दस्य शीघ्रं निहन्त्रे स्मितास्याय कुर्मो नमः शङ्कराय
    ॥ ॥ सुपर्वोक्तिगन्धेन हीनाय तूर्णं पुरा तोटकायाखिलज्ञानदात्रे। प्रवालीयगर्वापहारस्य कर्त्रे पदाब्जम्रदिम्ना
    नमः शङ्कराय ॥ ॥ भवाम्भोधिमग्नान्जनान्दुःखयुक्तान् जवादुद्दिधीर्षुर्भवानित्यहोऽहम् । विदित्वा हि ते
    कीर्तिमन्यादृशाम्भो सुखं निर्विशङ्कः स्वपिम्यस्तयत्नः ॥ ॥ ॥इति श्रीशङ्कराचार्य भुजङ्गप्रयातस्तोत्रम्॥
