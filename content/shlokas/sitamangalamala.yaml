id: sitamangalamala
category: shataka
name:
  english: sitamangalamala
  devanagari: सीतामन्गलमाला
content:
  english: vinashinyai ca rakshasam | dharmarakshavidhayinyai shrisitayai sumangalam || 17|| mithileshatanujayai
    bhumijayai tathaiva ca | priyayai raghavendrasya shrisitayai sumangalam || 18|| brahmandanamanantanam
    hetave caghaketave | setave ca bhavambhodheh shrisitayai sumangalam || 19|| surasureshvaraishcatha
    pujitayai munishvaraih | karmanam phaladayai ca shrisitayai sumangalam || 20|| ramena parinita ya
    vane ramanugamini | tasyai patyanuvarttinyai shrisitayai sumangalam || 21|| citrakutam gata ya ca
    citrakutastha pujita | tasyai citrakutirayai shrisitayai sumangalam || 22|| anasuyopadishtayai rakshitayai
    ca shangina | mandakini viharinyai shrisitayai sumangalam || 23|| phalaharena tushtayai hrishtayai
    ramasevaya | godavariviharinyai shrisitayai sumangalam || 24|| suvarnavat suvarnayai suvarnamrigalipsave
    | sindhave ca satittvasya shrisitayai sumangalam || 25|| ravanena hritayai ca rakshitayai jatayusha
    | ashokavanavasinyai shrisitayai sumangalam || 26|| ya rakshita svadharmena rakshasibhishca tarjita
    | tasyai mahavipannayai shrisitayai sumangalam || 27|| marutya''shvasitayai ca sandishtayai ca sharngina
    | mudrikam prapya hrishtayai shrisitayai sumangalam || 28|| pranapriyasya ramasya saddarshanaika hetave
    | pranashca dharayantyai hi shrisitayai sumangalam || 29|| anvishtayai ca marutya vanditayai tathaiva
    ca | marutervaradayai ca shrisitayai sumangalam || 30|| lankayam ca pradagdhayam mani dattva ca marutim
    | sandeshapreshayitryai ca shrisitayai sumangalam || 31|| brahmadibhih surairya ca stuta vanarasenaya
    | tasyai cagniprashastayai shrisitayai sumangalam || 32|| bhavabdhitarini ya ca karini sarvasampadam
    | tasyai vipattiharinyai shrisitayai sumangalam || 33|| saphalapujana ya ca saphalastuti kirtana |
    tasyai saphalanatyai ca shrisitayai sumangalam || 34|| ramecchya vina ya ca kincitkartum hi necchati
    | tasyai ramanukulayai shrisitayai sumangalam || 35|| yadicchya vinaramah kartum kincinna vanchati
    | tasyai ramanusarinyai shrisitayai sumangalam || 36|| yasyashca nadhika kacit kacinnasti ca yadrishi
    | tasyai samyavihinayai shrisitayai sumangalam || 37|| aishvarye catha madhurye ramabrahmasama hi
    ya | tasyai ramanurupayai shrisitayai sumangalam || 38|| ramavat satyasankalpa satyakama ca ya tatha
    | tasyai ramasamanayai shrisitayai sumangalam || 39|| ramasya harshada ya ca yasya ramo'pi harshadah
    | tasyai ramasamanayai shrisitayai sumangalam || 40|| ramavat doshahina ya ramavat ya gunambudhih
    | tasyai ramasamanayai shrisitayai sumangalam || 41|| ramavat sarvashaktirya jagaddhetushca ramavat
    | tasyai ramasamanayai shrisitayai sumangalam || 42|| ramavadbhukttida ya ca ramavanmukttida ca ya
    | tasyai ramasamanayai shrisitayai sumangalam || 43|| ramavat sakalatma ya sarveshvari ca ramavat
    | tasyai ramasamanayai shrisitayai sumangalam || 44|| sarvebhyo'bhayadatri ya prapattya ramavacca
    ya | tasyai ramasamanayai shrisitayai sumangalam || 45|| ramavadvikshate ya na shritaghamshcatmavattaya
    | tasyai ramasamanayai shrisitayai sumangalam || 46|| vishishta sthulasukshmabhyam cidacidbhyam ca
    ramavat | tasyai hi cadvitiyayai shrisitayai sumangalam || 47|| yasya smaranamatrena bahyabhyantashca
    shudhyati | shucinam shucaye tasyai shrisitayai sumangalam || 48|| namakirtanato yasya apurnam purnatamiyat
    | tasyai purnasvarupayai shrisitayai sumangalam || 49|| yadbhaktirmuktidhamnashcakantaka rajapaddhatih
    | tasyai ca bhajaniyayai shrisitayai sumangalam || 50|| yasyah prapattitashcaiva daivi maya nivarttate
    | tasyai sharanyavaryayai shrisitayai sumangalam || 51|| niradhara tatha ya hi sarvadharasvarupini
    | tasyai svamahimasthayai shrisitayai sumangalam || 52|| dharmarthakamamokshakhyapurusharthaprada
    ca ya | tasyai vadanyavaryayai shrisitayai sumangalam || 53|| saccaritrena yukta ya sarvabhutahitaishini
    | tasyai doshavihinayai shrisitayai sumangalam || 54|| kshamaputri kshamakarti ya'pakaram karoti na
    | tasyai kshamabdhirupayai shrisitayai sumangalam || 55|| kotisuryaprabhadhya ya shitala koticandravat
    | tasyai cadbhutarupayai shrisitayai sumangalam || 56|| jagadantarbahishthayai sarvabrahmandayonaye
    | anadinidhanayai ca shrisitayai sumangalam || 57|| yogadayai suyogyayai yogidyayai tathaiva ca |
    yogaphalapradayinyai shrisitayai sumangalam || 58|| shokahantryai vishokayai sarvadayai ca sarvada
    | ramabhinnasvarupinyai shrisitayai sumangalam || 59|| gunatitasvarupayai prashastryai shastrayonaye
    | parabhaktyaivaprapyayai shrisitayai sumangalam || 60|| paranandavati ya ca paranandapradayini |
    paranandatmane tasyai shrisitayai sumangalam || 61|| shaktikricchaktirupa ya mahashaktyabhivandita
    | tasyai shaktivishishtayai shrisitayai sumangalam || 62|| vedavid vedamata ya vedavidyaprakashini
    | tasyai ca vedavandyayai shrisitayai sumangalam || 63|| vishvakrid vishvabhrid ya ca vishvahrid vishvarupini
    | vishvasya hetave tasyai shrisitayai sumangalam || 64|| anugrahasharira ya ya canugrahavaridhih |
    tasyai nigrahashunyayai shrisitayai sumangalam || 65|| acintya yogicintya ya cintaya rahita ca ya
    | tasyai cintapaharinyai shrisitayai sumangalam || 66|| ya hiranyalatatulya hiranyagarbhasamstuta
    | tasyai hiranyavarnayai shrisitayai sumangalam || 67|| padmajasamstuta ya ca padmatulya sukomala
    | tasyai padmasanayai hi shrisitayai sumangalam || 68|| amritavacana ya ca ya'mritapadadayini | tasyai
    ca mrityuharinyai shrisitayai sumangalam || 69|| yasya bhasa vibhantyatra bhasaka bhaskaradayah |
    tasyai mahavibhasinyai shrisitayai sumangalam || 70|| brahmanyumaramadinam devinancaikahetave | brahmanyadisuvandyayai
    shrisitayai sumangalam || 71|| samstuta ya ca vagdevisindhujagirijadibhih | karunasindhave tasyai
    shrisitayai sumangalam || 72|| yajjnanat sarvavijnanam ya'khilajnanadayini | tasyai jnanasvarupayai
    shrisitayai sumangalam || 73|| jagajjanmadiheturya jaganmulam jagacca ya | tasyai jagajjananyai hi
    shrisitayai sumangalam || 74|| bhayabhayavidhatarah sarve yadvashavarttinah | tasyai ca nikhileshvaryai
    shrisitayai sumangalam || 75|| yasyah sitetinamoktiryamadutaughatarjini | tasyai cabhayadayinyai shrisitayai
    sumangalam || 76|| shaktida bhuktida ya ca bhakttida muktida ca ya | tasyai hitasvarupayai shrisitayai
    sumangalam || 77|| anoraniyasi ya ca mahatashca mahiyasi | tasyai ca vibhumanayai shrisitayai sumangalam
    || 78|| rajasa tamasa shunya ya tamah paravarttini | tasyai paratparayai ca shrisitayai sumangalam
    || 79|| adityantah sthita ya ca hyadityasya prakashada | tasyai cadityavarnayai shrisitayai sumangalam
    || 80|| vishvam kartunca saktayai bharttum harttum tathaiva ca | shadvidhaishvaryayuktayai shrisitayai
    sumangalam || 81|| sadacararata ya ca sadacaropadeshika | tasyai dharmapravartinyai shrisitayai sumangalam
    || 82|| bodhika trirahasyanamakaratrayashikshika | tasyai mahopakatryai ca shrisitayai sumangalam
    || 83|| prakritagunashunyatvannirguna ya prakirtita | sadgunambudhaye tasyai shrisitayai sumangalam
    || 84|| cidacidvyapikayai ca cidacittanave tatha | cidacittattvabhinnayai shrisitayai sumangalam ||
    85|| vatsalyarasasindhurya karunavarunalayah | lavanyanidhaye tasyai shrisitayai sumangalam || 86||
    sarvatra sarvada ya ca shrimadramaparayana | tasyai mahasatishvaryai shrisitayai sumangalam || 87||
    lokabhiramalokayai lokabhiramamurtaye | lokabhiramabhavayai shrisitayai sumangalam || 88|| yasyashcanandavijnanajjayate
    na bhayam kvacit | tasyai canandadayinyai shrisitayai sumangalam || 89|| prananam pranarupayai jyotisham
    jyotishe tatha | suryantavasashilayai shrisitayai sumangalam || 90|| murtamurttasvarupayai tathaikaneka
    murtaye | dure'dure sthitayai ca shrisitayai sumangalam || 91|| sarvarcanarcaniya ya sarvebhyah phalada
    ca ya | tasyai sarvasharirayai shrisitayai sumangalam || 92|| vede ramayane caiva purane bharate tatha
    | pancaratre ca gitayai shrisitayai sumangalam || 93|| medhaya vedapathena tapasalabhyate na ya |
    tasyai bhaktyaikalabhyayai shrisitayai sumangalam || 94|| karmadyaparatantrayai purnashadgunyamurttaye
    | vikararahitayai ca shrisitayai sumangalam || 95|| jnaninam jneyarupayai caradhyayai ca karminam
    | bhaktanam bhajaniyayai shrisitayai sumangalam || 96|| mahapurusha ramasya priyayai divyamurttaye
    | pradhanapurusheshvarye shrisitayai sumangalam || 97|| jagadvandyapadabjayai jagato gurave tatha
    | vijnanambudhirupayai shrisitayai sumangalam || 98|| yasyah smaranato yati bahyabhyantah pavitratam
    | pavitratabdhaye tasyai shrisitayai sumangalam || 99|| yacchaktya shaktimantashca vidhivishnushivadayah
    | shaktivaridhaye tasyai shrisitayai sumangalam || 100|| rakshati sakalam vishvam yasyah patyushcapaduka
    | tasyai patipriyayai ca shrisitayai sumangalam || 101|| yasyah shaktya jagat sarvam yantravad bhramyate
    sada | tasyai jaganniyantrinyai shrisitayai sumangalam || 102|| ramena srijyate vishvam yatkarunyadidrikshuna
    | karunyambudhaye tasyai shrisitayai sumangalam || 103|| upadanam nimittam ya jagatashcornanabhivat
    | hetave jagatastasyai shrisitayai sumangalam || 104|| sevyam ca yatparam nasti kirtaniyam na yatparam
    | tattvam na yatparam tasyai shrisitayai sumangalam || 105|| karanam karananam ya mangalananca mangalam
    | tasyai cashrayaniyayai shrisitayai sumangalam || 106|| data na yatparah kashcit trata na yatparah
    kvacit | tasyai parasharanyayai shrisitayai sumangalam || 107|| shritanamanukula ya pratikula shritadvisham
    | tasyai prapadaniyayai shrisitayai sumangalam || 108|| ya shriyah shrisvarupa shrisampradayapravarttika
    | gurunam gurave tasyai shrisitayai sumangalam || 109|| durvadadhvantamartandaraghavanandanirmita
    | shrisitamangalanam ca mala syanmangalaprada || 110|| iti durvadadhvantamarttanda jagadguru shriraghavanandacarya
    siddhasamratpranita shrisitamangalamala samapta |
  devanagari: विनाशिन्यै च रक्षसाम् । धर्मरक्षाविधायिन्यै श्रीसीतायै सुमङ्गलम् ॥ १७॥ मिथिलेशतनूजायै भूमिजायै
    तथैव च । प्रियायै राघवेन्द्रस्य श्रीसीतायै सुमङ्गलम् ॥ १८॥ ब्रह्माण्डानामनन्तानां हेतवे चाघकेतवे ।
    सेतवे च भवाम्भोधेः श्रीसीतायै सुमङ्गलम् ॥ १९॥ सुरासुरेश्वरैश्चाथ पूजितायै मुनीश्वरैः । कर्मणां फलदायै
    च श्रीसीतायै सुमङ्गलम् ॥ २०॥ रामेण परिणीता या वने रामानुगामिनी । तस्यै पत्यनुवर्त्तिन्यै श्रीसीतायै
    सुमङ्गलम् ॥ २१॥ चित्रकूटं गता या च चित्रकूटस्थ पूजिता । तस्यै चित्रकूटीरायै श्रीसीतायै सुमङ्गलम् ॥
    २२॥ अनसूयोपदिष्टायै रक्षितायै च शाङ्गिणा । मन्दाकिनी विहारिण्यै श्रीसीतायै सुमङ्गलम् ॥ २३॥ फलाहारेण
    तुष्टायै हृष्टायै रामसेवया । गोदावरीविहारिण्यै श्रीसीतायै सुमङ्गलम् ॥ २४॥ सुवर्णवत् सुवर्णायै सुवर्णमृगलिप्सवे
    । सिन्धवे च सतीत्त्वस्य श्रीसीतायै सुमङ्गलम् ॥ २५॥ रावणेन हृतायै च रक्षितायै जटायुषा । अशोकवनवासिन्यै
    श्रीसीतायै सुमङ्गलम् ॥ २६॥ या रक्षिता स्वधर्मेण राक्षसीभिश्च तर्जिता । तस्यै महाविपन्नायै श्रीसीतायै
    सुमङ्गलम् ॥ २७॥ मारुत्याऽऽश्वासितायै च सन्दिष्टायै च शार्ङ्गिणा । मुद्रिकां प्राप्य हृष्टायै श्रीसीतायै
    सुमङ्गलम् ॥ २८॥ प्राणप्रियस्य रामस्य सद्दर्शनैक हेतवे । प्राणाश्च धारयन्त्यै हि श्रीसीतायै सुमङ्गलम्
    ॥ २९॥ अन्विष्टायै च मारुत्या वन्दितायै तथैव च । मारुतेर्वरदायै च श्रीसीतायै सुमङ्गलम् ॥ ३०॥ लङ्कायां
    च प्रदग्धायां मणि दत्त्वा च मारुतिम् । सन्देशप्रेषयित्र्यै च श्रीसीतायै सुमङ्गलम् ॥ ३१॥ ब्रह्मादिभिः
    सुरैर्या च स्तुता वानरसेनया । तस्यै चाग्निप्रशस्तायै श्रीसीतायै सुमङ्गलम् ॥ ३२॥ भवाब्धितारिणी या च
    कारिणी सर्वसम्पदाम् । तस्यै विपत्तिहारिण्यै श्रीसीतायै सुमङ्गलम् ॥ ३३॥ सफलपूजना या च सफलस्तुति कीर्तना
    । तस्यै सफलनत्यै च श्रीसीतायै सुमङ्गलम् ॥ ३४॥ रामेच्छ्या विना या च किञ्चित्कर्तुं हि नेच्छति । तस्यै
    रामानुकूलायै श्रीसीतायै सुमङ्गलम् ॥ ३५॥ यदिच्छ्या विनारामः कर्तुं किञ्चिन्न वाञ्छति । तस्यै रामानुसारिण्यै
    श्रीसीतायै सुमङ्गलम् ॥ ३६॥ यस्याश्च नाधिका काचित् काचिन्नास्ति च यादृशी । तस्यै साम्यविहीनायै श्रीसीतायै
    सुमङ्गलम् ॥ ३७॥ ऐश्वर्ये चाथ माधुर्ये रामब्रह्मसमा हि या । तस्यै रामानुरूपायै श्रीसीतायै सुमङ्गलम्
    ॥ ३८॥ रामवत् सत्यसङ्कल्पा सत्यकामा च या तथा । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ३९॥ रामस्य हर्षदा
    या च यस्या रामोऽपि हर्षदः । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ४०॥ रामवत् दोषहीना या रामवत् या
    गुणाम्बुधिः । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ४१॥ रामवत् सर्वशक्तिर्या जगद्धेतुश्च रामवत्
    । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ४२॥ रामवद्भुक्त्तिदा या च रामवन्मुक्त्तिदा च या । तस्यै
    रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ४३॥ रामवत् सकलात्मा या सर्वेश्वरी च रामवत् । तस्यै रामसमानायै श्रीसीतायै
    सुमङ्गलम् ॥ ४४॥ सर्वेभ्योऽभयदात्री या प्रपत्त्या रामवच्च या । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम्
    ॥ ४५॥ रामवद्वीक्षते या न श्रिताघांश्चात्मवत्तया । तस्यै रामसमानायै श्रीसीतायै सुमङ्गलम् ॥ ४६॥ विशिष्टा
    स्थूलसूक्ष्माभ्यां चिदचिद्भ्यां च रामवत् । तस्यै हि चाद्वितीयायै श्रीसीतायै सुमङ्गलम् ॥ ४७॥ यस्य स्मरणमात्रेण
    बाह्याभ्यन्तश्च शुध्यति । शुचीनां शुचये तस्यै श्रीसीतायै सुमङ्गलम् ॥ ४८॥ नामकीर्तनतो यस्या अपूर्णं
    पूर्णतामियात् । तस्यै पूर्णस्वरूपायै श्रीसीतायै सुमङ्गलम् ॥ ४९॥ यद्भक्तिर्मुक्तिधाम्नश्चाकण्टका राजपद्धतिः
    । तस्यै च भजनीयायै श्रीसीतायै सुमङ्गलम् ॥ ५०॥ यस्याः प्रपत्तितश्चैव दैवी माया निवर्त्तते । तस्यै शरण्यवर्यायै
    श्रीसीतायै सुमङ्गलम् ॥ ५१॥ निराधारा तथा या हि सर्वाधारस्वरूपिणी । तस्यै स्वमहिमस्थायै श्रीसीतायै सुमङ्गलम्
    ॥ ५२॥ धर्मार्थकाममोक्षाख्यपुरुषार्थप्रदा च या । तस्यै वदान्यवर्यायै श्रीसीतायै सुमङ्गलम् ॥ ५३॥ सच्चारित्रेण
    युक्ता या सर्वभूतहितैषिणी । तस्यै दोषविहीनायै श्रीसीतायै सुमङ्गलम् ॥ ५४॥ क्षमापुत्री क्षमाकर्ती याऽपकारं
    करोति न । तस्यै क्षमाब्धिरूपायै श्रीसीतायै सुमङ्गलम् ॥ ५५॥ कोटिसूर्यप्रभाढ्या या शीतला कोटिचन्द्रवत्
    । तस्यै चाद्भूतरूपायै श्रीसीतायै सुमङ्गलम् ॥ ५६॥ जगदन्तर्बहिष्ठायै सर्वब्रह्माण्डयोनये । अनादिनिधनायै
    च श्रीसीतायै सुमङ्गलम् ॥ ५७॥ योगदायै सुयोग्यायै योगीड्यायै तथैव च । योगफलप्रदायिन्यै श्रीसीतायै सुमङ्गलम्
    ॥ ५८॥ शोकहन्त्र्यै विशोकायै सर्वदायै च सर्वदा । रामाभिन्नस्वरूपिण्यै श्रीसीतायै सुमङ्गलम् ॥ ५९॥ गुणातीतस्वरूपायै
    प्रशास्त्र्यै शास्त्रयोनये । परभक्त्यैवप्राप्यायै श्रीसीतायै सुमङ्गलम् ॥ ६०॥ परानन्दवती या च परानन्दप्रदायिनी
    । परानन्दात्मने तस्यै श्रीसीतायै सुमङ्गलम् ॥ ६१॥ शक्तिकृच्छक्तिरूपा या महाशक्त्यभिवन्दिता । तस्यै
    शक्तिविशिष्टायै श्रीसीतायै सुमङ्गलम् ॥ ६२॥ वेदविद् वेदमाता या वेदविद्याप्रकाशिनी । तस्यै च वेदवन्द्यायै
    श्रीसीतायै सुमङ्गलम् ॥ ६३॥ विश्वकृद् विश्वभृद् या च विश्वहृद् विश्वरूपिणी । विश्वस्य हेतवे तस्यै श्रीसीतायै
    सुमङ्गलम् ॥ ६४॥ अनुग्रहशरीरा या या चानुग्रहवारिधिः । तस्यै निग्रहशून्यायै श्रीसीतायै सुमङ्गलम् ॥ ६५॥
    अचिन्त्या योगिचिन्त्या या चिन्तया रहिता च या । तस्यै चिन्तापहारिण्यै श्रीसीतायै सुमङ्गलम् ॥ ६६॥ या
    हिरण्यलतातुल्या हिरण्यगर्भसंस्तुता । तस्यै हिरण्यवर्णायै श्रीसीतायै सुमङ्गलम् ॥ ६७॥ पद्मजासंस्तुता
    या च पद्मतुल्या सुकोमला । तस्यै पद्मासनायै हि श्रीसीतायै सुमङ्गलम् ॥ ६८॥ अमृतवचना या च याऽमृतपददायिनी
    । तस्यै च मृत्युहारिण्यै श्रीसीतायै सुमङ्गलम् ॥ ६९॥ यस्या भासा विभान्त्यत्र भासका भास्करादयः । तस्यै
    महाविभासिन्यै श्रीसीतायै सुमङ्गलम् ॥ ७०॥ ब्रह्माण्युमारमादीनां देवीनाञ्चैकहेतवे । ब्रह्माण्यादिसुवन्द्यायै
    श्रीसीतायै सुमङ्गलम् ॥ ७१॥ संस्तुता या च वाग्देवीसिन्धुजागिरिजादिभिः । करुणासिन्धवे तस्यै श्रीसीतायै
    सुमङ्गलम् ॥ ७२॥ यज्ज्ञानात् सर्वविज्ञानं याऽखिलज्ञानदायिनी । तस्यै ज्ञानस्वरूपायै श्रीसीतायै सुमङ्गलम्
    ॥ ७३॥ जगज्जन्मादिहेतुर्या जगन्मूलं जगच्च या । तस्यै जगज्जनन्यै हि श्रीसीतायै सुमङ्गलम् ॥ ७४॥ भयाभयविधातारः
    सर्वे यद्वशवर्त्तिनः । तस्यै च निखिलेश्वर्यै श्रीसीतायै सुमङ्गलम् ॥ ७५॥ यस्याः सीतेतिनामोक्तिर्यमदूतौघतर्जिनी
    । तस्यै चाभयदायिन्यै श्रीसीतायै सुमङ्गलम् ॥ ७६॥ शक्तिदा भुक्तिदा या च भक्त्तिदा मुक्तिदा च या । तस्यै
    हितस्वरूपायै श्रीसीतायै सुमङ्गलम् ॥ ७७॥ अणोरणीयसी या च महतश्च महीयसी । तस्यै च विभुमानायै श्रीसीतायै
    सुमङ्गलम् ॥ ७८॥ रजसा तमसा शून्या या तमः परवर्त्तिनी । तस्यै परात्परायै च श्रीसीतायै सुमङ्गलम् ॥ ७९॥
    आदित्यान्तः स्थिता या च ह्यादित्यस्य प्रकाशदा । तस्यै चादित्यवर्णायै श्रीसीतायै सुमङ्गलम् ॥ ८०॥ विश्वं
    कर्तुञ्च सक्तायै भर्त्तुं हर्त्तुं तथैव च । षड्विधैश्वर्ययुक्तायै श्रीसीतायै सुमङ्गलम् ॥ ८१॥ सदाचाररता
    या च सदाचारोपदेशिका । तस्यै धर्मप्रवर्तिन्यै श्रीसीतायै सुमङ्गलम् ॥ ८२॥ बोधिका त्रीरहस्यानामाकारत्रयशिक्षिका
    । तस्यै महोपकत्र्यै च श्रीसीतायै सुमङ्गलम् ॥ ८३॥ प्राकृतगुणशून्यत्वान्निर्गुणा या प्रकीर्तिता । सद्गुणाम्बुधये
    तस्यै श्रीसीतायै सुमङ्गलम् ॥ ८४॥ चिदचिद्व्यापिकायै च चिदचित्तनवे तथा । चिदचित्तत्त्वभिन्नायै श्रीसीतायै
    सुमङ्गलम् ॥ ८५॥ वात्सल्यरससिन्धुर्या करुणावरुणालयः । लावण्यनिधये तस्यै श्रीसीतायै सुमङ्गलम् ॥ ८६॥
    सर्वत्र सर्वदा या च श्रीमद्रामपरायणा । तस्यै महासतीश्वर्यै श्रीसीतायै सुमङ्गलम् ॥ ८७॥ लोकाभिरामलोकायै
    लोकाभिराममूर्तये । लोकाभिरामभावायै श्रीसीतायै सुमङ्गलम् ॥ ८८॥ यस्याश्चानन्दविज्ञानाज्जायते न भयं क्वचित्
    । तस्यै चानन्ददायिन्यै श्रीसीतायै सुमङ्गलम् ॥ ८९॥ प्राणानां प्राणरूपायै ज्योतिषां ज्योतिषे तथा । सूर्यान्तवासशीलायै
    श्रीसीतायै सुमङ्गलम् ॥ ९०॥ मूर्तामूर्त्तस्वरूपायै तथैकानेक मूर्तये । दूरेऽदूरे स्थितायै च श्रीसीतायै
    सुमङ्गलम् ॥ ९१॥ सर्वार्चनार्चनीया या सर्वेभ्यः फलदा च या । तस्यै सर्वशरीरायै श्रीसीतायै सुमङ्गलम्
    ॥ ९२॥ वेदे रामायणे चैव पुराणे भारते तथा । पाञ्चरात्रे च गीतायै श्रीसीतायै सुमङ्गलम् ॥ ९३॥ मेधया वेदपाठेन
    तपसालभ्यते न या । तस्यै भक्त्यैकलभ्यायै श्रीसीतायै सुमङ्गलम् ॥ ९४॥ कर्माद्यपरतन्त्रायै पूर्णषाड्गुण्यमूर्त्तये
    । विकाररहितायै च श्रीसीतायै सुमङ्गलम् ॥ ९५॥ ज्ञानिनां ज्ञेयरूपायै चाराध्यायै च कर्मिणाम् । भक्तानां
    भजनीयायै श्रीसीतायै सुमङ्गलम् ॥ ९६॥ महापुरुष रामस्य प्रियायै दिव्यमूर्त्तये । प्रधानपुरुषेश्वर्ये
    श्रीसीतायै सुमङ्गलम् ॥ ९७॥ जगद्वन्द्यपदाब्जायै जगतो गुरवे तथा । विज्ञानाम्बुधिरूपायै श्रीसीतायै सुमङ्गलम्
    ॥ ९८॥ यस्याः स्मरणतो याति बाह्याभ्यन्तः पवित्रताम् । पवित्रताब्धये तस्यै श्रीसीतायै सुमङ्गलम् ॥ ९९॥
    यच्छक्त्या शक्तिमन्तश्च विधिविष्णुशिवादयः । शक्तिवारिधये तस्यै श्रीसीतायै सुमङ्गलम् ॥ १००॥ रक्षति
    सकलं विश्वं यस्याः पत्युश्चपादुका । तस्यै पतिप्रियायै च श्रीसीतायै सुमङ्गलम् ॥ १०१॥ यस्याः शक्त्या
    जगत् सर्वं यन्त्रवद् भ्राम्यते सदा । तस्यै जगन्नियन्त्रिण्यै श्रीसीतायै सुमङ्गलम् ॥ १०२॥ रामेण सृज्यते
    विश्वं यत्कारुण्यदिदृक्षुणा । कारुण्याम्बुधये तस्यै श्रीसीतायै सुमङ्गलम् ॥ १०३॥ उपादानं निमित्तं या
    जगतश्चोर्णनाभिवत् । हेतवे जगतस्तस्यै श्रीसीतायै सुमङ्गलम् ॥ १०४॥ सेव्यं च यत्परं नास्ति कीर्तनीयं
    न यत्परम् । तत्त्वं न यत्परं तस्यै श्रीसीतायै सुमङ्गलम् ॥ १०५॥ कारणं कारणानां या मङ्गलानाञ्च मङ्गलम्
    । तस्यै चाश्रयणीयायै श्रीसीतायै सुमङ्गलम् ॥ १०६॥ दाता न यत्परः कश्चित् त्राता न यत्परः क्वचित् । तस्यै
    परशरण्यायै श्रीसीतायै सुमङ्गलम् ॥ १०७॥ श्रितानामनुकूला या प्रतिकूला श्रितद्विषाम् । तस्यै प्रपदनीयायै
    श्रीसीतायै सुमङ्गलम् ॥ १०८॥ या श्रियः श्रीस्वरूपा श्रीसम्प्रदायप्रवर्त्तिका । गुरुणां गुरवे तस्यै
    श्रीसीतायै सुमङ्गलम् ॥ १०९॥ दुर्वादध्वान्तमार्तण्डराघवानन्दनिर्मिता । श्रीसीतामङ्गलानां च माला स्यान्मङ्गलप्रदा
    ॥ ११०॥ इति दुर्वादध्वान्तमार्त्तण्ड जगद्गुरु श्रीराघवानन्दाचार्य सिद्धसंराट्प्रणीता श्रीसीतामङ्गलमाला
    समाप्ता ।
