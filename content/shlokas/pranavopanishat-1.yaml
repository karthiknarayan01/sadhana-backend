id: pranavopanishat-1
category: upanishad
name:
  english: pranavopanishat (1)
  devanagari: प्रणवोपनिषत् (१)
content:
  english: om saha navastu | saha nau bhunaktu | saha viryam karavavahai | tejasvi navadhitamastu ma vidvishavahe
    | om shantih shantih shantih || purastadbrahmanastasya vishnoradbhutakarmanah | rahasyam brahmavidyaya
    dhritagnim sampracakshate || omityekaksharam brahma yaduktam brahmavadibhih | shariram tasya vakshyami
    sthanakalatrayam tatha || tatra devastrayah prokta loka vedastrayo'gnayah | tisro matrardhamatra ca
    pratyakshasya shivasya tat || rigvedo garhapatyam ca prithivi brahma eva ca | akarasya shariram tu
    vyakhyatam brahmavadibhih || yajurvedo'ntariksham ca dakshinagnistathaiva ca | vishnushca bhagavan
    deva ukarah parikirtitah || samavedastatha dyaushcahavaniyastathaiva ca | ishvarah paramo devo makarah
    parikirtitah || suryamandalamabhati hyakarashcandramadhyagah | ukarashcandrasamkashastasya madhye
    vyavasthitah | makarashcagnisamkasho vidhumo vidyutopamah | tisro matrastatha jneyah somasuryagnitejasah
    || shikha ca dipasamkasha yaminnu parivartate | ardhamatra tatha jneya pranavasyopari sthita || padmasutranibha
    sukshma shikhabha drishyate para | nasadisuryasamkasha suryam hitva tathaparam | dvisaptatisahasrani
    nadibhistva tu murdhani | varadam sarvabhutanam sarvam vyapyaiva tishthati || kamsyaghantaninadah
    syadyada lipyati shantaye| onkarastu tatha yojyah shrutaye sarvamicchati || yasmin sa liyate shabdastatparam
    brahma giyate | so'mritatvaya kalpate so'mritatvaya kalpate || iti || iti pranavopanishatsamapta
  devanagari: ॐ सह नावस्तु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु मा विद्विषावहे ।
    ॐ शान्तिः शान्तिः शान्तिः ।। पुरस्ताद्ब्रह्मणस्तस्य विष्णोरद्भुतकर्मणः । रहस्यं ब्रह्मविद्याया धृताग्निं
    संप्रचक्षते ।। ओमित्येकाक्षरं ब्रह्म यदुक्तं ब्रह्मवादिभिः । शरीरं तस्य वक्ष्यामि स्थानकालत्रयं तथा
    ॥ तत्र देवास्त्रयः प्रोक्ता लोका वेदास्त्रयोऽग्नयः । तिस्रो मात्रार्धमात्रा च प्रत्यक्षस्य शिवस्य
    तत् ॥ ऋग्वेदो गार्हपत्यं च पृथिवी ब्रह्म एव च । अकारस्य शरीरं तु व्याख्यातं ब्रह्मवादिभिः ॥ यजुर्वेदोऽन्तरिक्षं
    च दक्षिणाग्निस्तथैव च । विष्णुश्च भगवान् देव उकारः परिकीर्तितः ॥ सामवेदस्तथा द्यौश्चाहवनीयस्तथैव च
    । ईश्वरः परमो देवो मकारः परिकीर्तितः ॥ सूर्यमण्डलमाभाति ह्यकारश्चन्द्रमध्यगः । उकारश्चन्द्रसंकाशस्तस्य
    मध्ये व्यवस्थितः । मकारश्चाग्निसंकाशो विधूमो विद्युतोपमः । तिस्रो मात्रास्तथा ज्ञेयाः सोमसूर्याग्नितेजसः
    ॥ शिखा च दीपसंकाशा यमिन्नु परिवर्तते । अर्धमात्रा तथा ज्ञेया प्रणवस्योपरि स्थिता ॥ पद्मसूत्रनिभा सूक्ष्मा
    शिखाभा दृश्यते परा । नासादिसूर्यसंकाशा सूर्यं हित्वा तथापरम् । द्विसप्ततिसहस्राणि नाडिभिस्त्वा तु
    मूर्धनि । वरदं सर्वभूतानां सर्वं व्याप्यैव तिष्ठति ॥ कांस्यघण्टानिनादः स्याद्यदा लिप्यति शान्तये।
    ओङ्कारस्तु तथा योज्यः श्रुतये सर्वमिच्छति ॥ यस्मिन् स लीयते शब्दस्तत्परं ब्रह्म गीयते । सोऽमृतत्वाय
    कल्पते सोऽमृतत्वाय कल्पते ।। इति ।। इति प्रणवोपनिषत्समाप्ता
