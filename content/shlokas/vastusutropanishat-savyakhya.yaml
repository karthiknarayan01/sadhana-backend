id: vastusutropanishat-savyakhya
category: upanishad
name:
  english: vastusutropanishat savyakhya
  devanagari: वास्तुसूत्रोपनिषत् सव्याख्या
content:
  english: devanandartham nrityanti | sarve mishrayonayah shodashakoshthakakshetre urdhvakonagatakshetre
    nidheyah upadaivakshetre | ye nara daivabhavaparayanaste yajaka | dhyane tesham satta divyeva vibhati
    | tan jaivakshetrasya parshvagatakshetre adhahkshetradvaye nyaset | evam daivarupam shodashakoshthake
    dhyeyam | te tu dhanya ye kratu~shca yajnanacaranti upasante rupani | rupajnanad prajna prabhavati
    loke | prajnarthametad vastupakhyanam || 26|| etadartham prajnam vyakhyapayama iti | vastusutropanishad
    bhagavatah pippaladasya bhavyam vyakhyanam | yo janati sa rupacaryo bhavatiti vastudgata iti dhyeyam
    | ye dhyayanti te muktah | paramarishibhyo namah| stuta maya varada vedamata pra codayantam pavamani
    dvijanam | ayuh pranam prajam pashum kirti dravinam brahmavarcasam | mahyam dattva vrajata brahmalokam
    ||
  devanagari: देवानन्दार्थं नृत्यन्ति । सर्वे मिश्रयोनयः षोडशकोष्ठकक्षेत्रे ऊर्ध्वकोणगतक्षेत्रे निधेयाः
    उपदैवक्षेत्रे । ये नरा दैवभावपरायणास्ते याजका । ध्याने तेषां सत्ता दिव्येव विभाति । तान् जैवक्षेत्रस्य
    पार्श्वगतक्षेत्रे अधःक्षेत्रद्वये न्यसेत् । एवं दैवरूपं षोडशकोष्ठके ध्येयम् । ते तु धन्या ये क्रतूँश्च
    यज्ञानाचरन्ति उपासन्ते रूपाणि । रूपज्ञानाद् प्रज्ञा प्रभवति लोके । प्रज्ञार्थमेतद् वास्तूपाख्यानम्
    ॥ २६॥ एतदर्थं प्रज्ञां व्याख्यापयाम इति । वास्तुसूत्रोपनिषद् भगवतः पिप्पलादस्य भव्यं व्याख्यानम् ।
    यो जानाति स रूपाचार्यो भवतीति वास्तूद्गाता इति ध्येयम् । ये ध्यायन्ति ते मुक्ताः । परमऋषिभ्यो नमः।
    स्तुता मया वरदा वेदमाता प्र चोदयन्तां पावमानी द्विजानाम् । आयुः प्राणं प्रजां पशुं कीर्ति द्रविणं
    ब्रह्मवर्चसम् । मह्यं दत्त्वा व्रजत ब्रह्मलोकम् ॥
