id: shivavishnukritamsuryastotram-16
category: stotram
name:
  english: shivavishnukritamsuryastotram 16
  devanagari: शिवविष्णुकृतंसूर्यस्तोत्रम् १६
content:
  english: shivavishnukritam suryastotram 16 mahadeva uvaca | jaya bhava jayajeya jaya hamsa divakara
    | jaya shambho mahabaho khaga gocara bhudhara || 60|| jaya lokapradipena jaya bhano jagatpate | jaya
    kala jayananta samvatsara shubhanana || 61|| jaya devaditeh putra kashyapanandavardhana | tamoghna
    jaya saptesha jaya saptashvavahana || 62|| mahesha jaya kantisha jaya kalesha shankara | arthakamesha
    dharmesha jaya mokshesha sharmada || 63|| jaya vedangarupaya graharupaya vai namah | satyaya satyarupaya
    surupaya shubhaya ca || 64|| krodhalobhavinashaya kamanashaya vai jaya | kalmashapakshirupaya yatirupaya
    shambhave || 65|| vishvaya vishvarupaya vishvakarmaya vai jaya | jayonkara vashatkara svahakara svadhamaya
    || 66|| jayashvamedharupaya cagniruparyamaya ca | samsararnavapitaya mokshadvarapradaya ca || 67||
    samsararnavamagnasya mama deva jagatpate | hastavalambano deva bhava tvam gopate'dbhuta || 68|| isho'pyevamahinangam
    stutva bhanum prayatnatah | virarama maharaja pranamya shirasa ravim || 69|| atha vishnurmahatejah
    kritanjaliputo ravim | uvaca rajashardula bhaktya shraddhasamanvitah || 70|| vishnuruvaca | namami
    devadevesham bhutabhavanamavyayam | divakaram ravim bhanum martandam bhaskaram bhagam || 71|| indram
    vishnum harim hamsamarkam lokagurum vibhum | trinetram tryaksharam tryangam trimurtim trigatim shubham
    || 72|| shanmukhaya namo nityam trinetraya namo namah | caturvimshatipadaya namo dvadashapanaye ||
    73|| namaste bhutapataye lokanam pataye namah | devanam pataye nityam varnanam pataye namah || 74||
    tvam brahma tvam jagannatho rudrastvam ca prajapatih | tvam somastvam tatha''dityastvamonkaraka eva
    hi || 75|| brihaspatirbudhastvam hi tvam shukrastvam vibhavasuh | yamastvam varunastvam hi namaste
    kashyapatmaja || 76|| tvaya tatamidam sarvam jagatsthavarajangamam | tvatta eva samutpannam sadevasuramanusham
    || 77|| brahma caham ca rudrashca samutpanna jagatpate | kalpadau tu pura deva sthitaye jagato'nagha
    || 78|| namaste vedarupaya ahorupaya vai namah | namaste jnanarupaya yajnaya ca namo namah || 79||
    prasidasmasu devesha bhutesha kiranojjvala | samsararnavamagnanam prasadam kuru gopate || 80|| vedantaya
    namo nityam namo yajnakalaya ca | iti bhavishyapurane brahme parvani trayahpancashadadhikashatatamadhyayantargatam
    shiva
  devanagari: शिवविष्णूकृतं सूर्यस्तोत्रम् १६ महादेव उवाच । जय भाव जयाजेय जय हंस दिवाकर । जय शम्भो महाबाहो
    खग गोचर भूधर ॥ ६०॥ जय लोकप्रदीपेन जय भानो जगत्पते । जय काल जयानन्त संवत्सर शुभानन ॥ ६१॥ जय देवादितेः
    पुत्र कश्यपानन्दवर्धन । तमोघ्न जय सप्तेश जय सप्ताश्ववाहन ॥ ६२॥ महेश जय कान्तीश जय कालेश शङ्कर । अर्थकामेश
    धर्मेश जय मोक्षेश शर्मद ॥ ६३॥ जय वेदाङ्गरूपाय ग्रहरूपाय वै नमः । सत्याय सत्यरूपाय सुरूपाय शुभाय च
    ॥ ६४॥ क्रोधलोभविनाशाय कामनाशाय वै जय । कल्माषपक्षिरूपाय यतिरूपाय शम्भवे ॥ ६५॥ विश्वाय विश्वरूपाय विश्वकर्माय
    वै जय । जयोङ्कार वषट्कार स्वाहाकार स्वधामय ॥ ६६॥ जयाश्वमेधरूपाय चाग्निरूपार्यमाय च । संसारार्णवपीताय
    मोक्षद्वारप्रदाय च ॥ ६७॥ संसारार्णवमग्नस्य मम देव जगत्पते । हस्तावलम्बनो देव भव त्वं गोपतेऽद्भुत ॥
    ६८॥ ईशोऽप्येवमहीनाङ्गं स्तुत्वा भानुं प्रयत्नतः । विरराम महाराज प्रणम्य शिरसा रविम् ॥ ६९॥ अथ विष्णुर्महातेजाः
    कृताञ्जलिपुटो रविम् । उवाच राजशार्दूल भक्त्या श्रद्धासमन्वितः ॥ ७०॥ विष्णुरुवाच । नमामि देवदेवेशं
    भूतभावनमव्ययम् । दिवाकरं रविं भानुं मार्तण्डं भास्करं भगम् ॥ ७१॥ इन्द्रं विष्णुं हरिं हंसमर्कं लोकगुरुं
    विभुम् । त्रिनेत्रं त्र्यक्षरं त्र्यङ्गं त्रिमूर्तिं त्रिगतिं शुभम् ॥ ७२॥ षण्मुखाय नमो नित्यं त्रिनेत्राय
    नमो नमः । चतुर्विंशतिपादाय नमो द्वादशपाणये ॥ ७३॥ नमस्ते भूतपतये लोकानां पतये नमः । देवानां पतये नित्यं
    वर्णानां पतये नमः ॥ ७४॥ त्वं ब्रह्मा त्वं जगन्नाथो रुद्रस्त्वं च प्रजापतिः । त्वं सोमस्त्वं तथाऽऽदित्यस्त्वमोङ्कारक
    एव हि ॥ ७५॥ बृहस्पतिर्बुधस्त्वं हि त्वं शुक्रस्त्वं विभावसुः । यमस्त्वं वरुणस्त्वं हि नमस्ते कश्यपात्मज
    ॥ ७६॥ त्वया ततमिदं सर्वं जगत्स्थावरजङ्गमम् । त्वत्त एव समुत्पन्नं सदेवासुरमानुषम् ॥ ७७॥ ब्रह्मा चाहं
    च रुद्रश्च समुत्पन्ना जगत्पते । कल्पादौ तु पुरा देव स्थितये जगतोऽनघ ॥ ७८॥ नमस्ते वेदरूपाय अहोरूपाय
    वै नमः । नमस्ते ज्ञानरूपाय यज्ञाय च नमो नमः ॥ ७९॥ प्रसीदास्मासु देवेश भूतेश किरणोज्ज्वल । संसारार्णवमग्नानां
    प्रसादं कुरु गोपते ॥ ८०॥ वेदान्ताय नमो नित्यं नमो यज्ञकलाय च । इति भविष्यपुराणे ब्राह्मे पर्वणि त्रयःपञ्चाशदधिकशततमाध्यायान्तर्गतं
    शिव
