    nidu nakalanka magu kirti hani seyaka brovu arunacala hastalamalaka nidu sadrasamuna sukhonmada mòndaga
    nelu arunacala vala nunci bhaktula parimarcu ninu gattukòni yètlu jivintunu arunacala arunacala shiva
    arunacala shiva arunacala shiva arunacala arunacala shiva arunacala shiva arunacala shiva arunacala
    koparahita guna gurigaga nanu gònu kòrayemi cesiti arunacala gautama pujita karuna ghana nagama kada
    ganta eluma arunacala sakalamu kabalincu karakantiyina mano jalaja maralpuma arunacala tindini ninjeritini
    tina na nenu shantamai povudunu arunacala madi callapada bhadrakara munci yamritanor tèru manugrahacandra
    arunacala vannènu cèraci nirvana mònarci kripavannè nidi brovumarunacala sukha samudramu pònga vak
    manammuladanga nuraka namaru mandarunacala vancintuvela nan shodhimpakika nidu jyoti rupamu cupum
    arunacala paravidya garapi yi bhumi maikamu vidi rupagu vidya jupu arunacala cerakunnanu menu niruga
    garagi kanniterayi nashintu arunacala chi yani drosina ceyu karma tapana gakedi manu maram arunacala
    cèppaka cèpi nivu maunata nundani yuraka yunduve arunacala arunacala shiva arunacala shiva arunacala
    shiva arunacala arunacala shiva arunacala shiva arunacala shiva arunacala somari naitini minnani sukha
    nidra kanna verèdi gati arunacala shauryamu jupiti shamiyincè nani maya caliyi pa kunnavu arunacala
    kukkaku nnicame nene gurutugòni vèdaki ninjerudu arunacala jnanamu leka ni yasa dainyamu bapa jnanamu
    dèlpi brovumarunacala teti valènu nivu vikasimpa ledani yèduta nilutuvela arunacala tatva mèrugajala
    nantayai nilutuve yidiyemi tatvamo arunacala ta nenu tananu tatva middanini tanuga cupintu arunacala
    trippi yahantanu nèppudu lo drushti gana dèliyu nanunade arunacala tiramundani yèda vèdakiyu ninnu
    ne tirigi pònditi brovu marunacala satya jnanamu leni yi janma phalamemi yòppaga ravela arunacala
    shuddha vangmana yutulam docu ni nija hanta galpi nanu brovu arunacala daiva manucu ninnu dariceraga
    nannu purna nasha mònarciti arunacala arunacala shiva arunacala shiva arunacala shiva arunacala arunacala
    shiva arunacala shiva arunacala shiva arunacala vèdukaka ganina saccriyanugrahanidhi madi tègul tirci
    brovu arunacala dhairyamu parugidu ni nijahamaraya ne nashamaiti brovu arunacala taki kripakaramu
    nanu galiyakunna nijamu nashintu brovu arunacala dosharahita nivu nato naikyamayi nityananda mayamonarparunacala
    nagaku nèdamukadu ninvèdakina nannu ganu kripanaga vesi arunacala nana ledè vèduka nenayi ni vònti
    sthanuvai nilicitivi arunacala ni jvala galcinan niru sesèdu munnè ni kripa varshimpu arunacala nivu
    ne nanaga nityanandamayamuga nilucu sthiti karuni pu arunacala anurupu ninnu ne minnu rupum cera bhavormulèpudagu
    arunacala sutra jnanamu leni pamaru na maya jnanamu kosikavu arunacala makki makki karagi ne ninnu
    sharananda nagnudavai nilciti arunacala nestamundani naku ni yasha cupinan mosagimpaka brovu arunacala
