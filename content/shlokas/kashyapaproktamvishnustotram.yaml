id: kashyapaproktamvishnustotram
category: stotram
name:
  english: kashyapaproktamvishnustotram
  devanagari: कश्यपप्रोक्तंविष्णुस्तोत्रम्
content:
  english: ringaya tantave | saptahastaya yajnaya trayividyatmane namah || 31|| namah shivaya rudraya
    namah shaktidharaya ca | sarvavidyadhipataye bhutanam pataye namah || 32|| namo hiranyagarbhaya pranaya
    jagadatmane | yogaishvaryashariraya namaste yogahetave || 33|| namasta adidevaya sakshibhutaya te
    namah | narayanaya rishaye naraya haraye namah || 34|| namo marakatashyamavapushe'dhigatashriye |
    keshavaya namastubhyam namaste pitavasase || 35|| tvam sarvavaradah pumsam varenya varadarshabha |
    ataste shreyase dhirah padarenumupasate || 36|| anvavartanta yam devah shrishca tatpadapadmayoh |
    sprihayanta ivamodam bhagavan me prasidatam || 37|| iti shrimadbhagavatamahapurane ashtamaskandhe
    shodashadhyayantargatam kashyapaproktam vishnustotram samaptam | bhagavatapurana | adhyaya 8
  devanagari: ृङ्गाय तन्तवे । सप्तहस्ताय यज्ञाय त्रयीविद्यात्मने नमः ॥ ३१॥ नमः शिवाय रुद्राय नमः शक्तिधराय
    च । सर्वविद्याधिपतये भूतानां पतये नमः ॥ ३२॥ नमो हिरण्यगर्भाय प्राणाय जगदात्मने । योगैश्वर्यशरीराय
    नमस्ते योगहेतवे ॥ ३३॥ नमस्त आदिदेवाय साक्षीभूताय ते नमः । नारायणाय ऋषये नराय हरये नमः ॥ ३४॥ नमो मरकतश्यामवपुषेऽधिगतश्रिये
    । केशवाय नमस्तुभ्यं नमस्ते पीतवाससे ॥ ३५॥ त्वं सर्ववरदः पुंसां वरेण्य वरदर्षभ । अतस्ते श्रेयसे धीराः
    पादरेणुमुपासते ॥ ३६॥ अन्ववर्तन्त यं देवाः श्रीश्च तत्पादपद्मयोः । स्पृहयन्त इवामोदं भगवान् मे प्रसीदताम्
    ॥ ३७॥ इति श्रीमद्भागवतमहापुराणे अष्टमस्कन्धे षोडशाध्यायान्तर्गतं कश्यपप्रोक्तं विष्णुस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ८
