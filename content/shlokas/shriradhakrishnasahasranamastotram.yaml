id: shriradhakrishnasahasranamastotram
category: stotram
name:
  english: shriradhakrishnasahasranamastotram
  devanagari: श्रीराधाकृष्णसहस्रनामस्तोत्रम्
content:
  english: '| akruratapashamano rajakayuhpranashanah ||80|| mathuranandadayi ca kamsavastravilunthanah
    | kamsavastraparidhano gopavastrapradayakah ||81|| sudamagrihagami ca sudamaparipujitah | tantuvayakasampritah
    kubjacandanalepanah ||82|| kubjarupaprado vijno mukundo vishtarashravah | sarvajno mathuraloki sarvalokabhinandanah
    || 83|| kripakatakshadarshi ca daityarirdevapalakah | sarvaduhkhaprashamano dhanurbhangi mahotsavah
    ||84|| kuvalayapidahanta dantaskandhabalagranih | kalparupadharo dhiro divyavastranulepanah ||85||
    mallarupo mahakalah kamarupi balanvitah | kamsatrasakaro bhimo mushtikantashca kamsaha ||86|| canuraghno
    bhayaharah shalaristoshalantakah | vaikunthavasi kamsarih sarvadushtanishudanah ||87|| devadundubhinirghoshi
    pitrishokanivaranah | yadavendrah satamnatho yadavaripramarddanah ||88|| shaurishokavinashi ca devakitapanashanah
    | ugrasenaparitrata ugrasenabhipujitah ||89|| ugrasenabhisheki ca ugrasenadayaparah | sarvasatvatasakshi
    ca yadunamabhinandanah ||90|| sarvamathurasamsevyah karuno bhaktabandhavah | sarvagopaladhanado gopigopalalalasah
    ||91|| shauridattopaviti ca ugrasenadayakarah | gurubhakto brahmacari nigamadhyayane ratah ||92||
    samkarshanasahadhyayi sudamasuhrideva ca | vidyanidhih kalakosho mritaputrapradastatha ||93|| cakri
    pancajani caiva sarvanarakimocanah | yamarcitah paro devo namoccaravasho''cyutah ||94|| kubjavilasi
    subhago dinabandhuranupamah | akruragrihagopta ca pratijnapalakah shubhah ||95|| jarasandhajayi vidvan
    yavananto dvijashrayah | mucukundapriyakaro jarasandhapalayitah ||96|| dvarakajanako gudho brahmanyah
    satyasangarah | liladharah priyakaro vishvakarma yashahpradah ||97|| rukminipriyasandesho rukmashokavivarddhanah
    | caidyashokalayah shreshtho dushtarajanyanashanah || 98|| rukmivairupyakarano rukminivacane ratah
    | balabhadravacograhi muktarukmi janardanah ||99|| rukminiprananathashca satyabhamapatih svayam |
    bhaktapakshi bhaktivashyo hyakruramanidayakah ||100|| shatadhanvapranahari riksharajasutapriyah |
    satrajittanayakanto mitravindapaharakah ||101|| satyapatirlakshmanajitpujyo bhadrapriyankarah | narakasuraghati
    ca lilakanyaharo jayi ||102|| murarirmadanesho''pi dharitriduhkhanashanah | vainateyi svargagami aditya
    kundalapradah ||103|| indrarcito ramakanto vajribharyaprapujitah | parijatapahari ca shakramanapaharakah
    ||104|| pradyumnajanakah sambatato bahusuto vidhuh | gargacaryah satyagatirdharmadharo dharadharah
    ||105|| dvarakamandanah shlokyah sushloko nigamalayah | paundrakapranahari ca kashirajashiroharah
    ||106|| avaishnavavipradahi sudakshinabhayavahah | jarasandhavidari ca dharmanandanayajnakrit ||107||
    shishupalashirashchedi dantavaktravinashanah | vidurathantakah shrishah shrido dvividanashanah ||108||
    rukminimanahari ca rukminimanavarddhanah | devarshishapaharta ca draupadivakyapalakah ||109|| durvasobhayahari
    ca pancalismaranagatah | parthadutah parthamantri parthaduhkhaughanashanah ||110|| parthamanapahari
    ca parthajivanadayakah | pancalivastradata ca vishvapalakapalakah ||111|| shvetashvasarathih satyah
    satyasadhyo bhayapahah | satyasandhah satyaratih satyapriya udaradhih ||112|| mahasenajayi caiva shivasainyavinashanah
    | banasurabhujacchetta banabahuvarapradah ||113|| tarkshyamanapahari ca tarkshyatejovivarddhanah |
    ramasvarupadhari ca satyabhamamudavahah ||114|| ratnakarajalakrido vrajalilapradarshakah | svapratijnaparidhvamsi
    bhishmajnaparipalakah ||115|| virayudhaharah kalah kalikesho mahabalah | varvarishashirohari varvarishashirahpradah
    ||116|| dharmaputrajayi shuraduryodhanamadantakah | gopikapritinirbandhanityakrido vrajeshvarah ||117||
    radhakundaratirdhanyah sadandolasamashritah | sadamadhuvananandi sadavrindavanapriyah ||118|| ashokavanasannaddhah
    sadatilakasangatah | sadagovarddhanaratih sada gokulavallabhah ||119|| bhandiravatasamvasi nityam
    vamshivatasthitah | nandagramakritavaso vrishabhanugrahapriyah ||120|| grihitakaminirupo nityam rasavilasakrit
    | vallavijanasangopta vallavijanavallabhah ||121|| devasharmakripakarta kalpapadapasamsthitah | shilanugandhanilayah
    padacari ghanacchavih ||122|| atasikusumaprakhyah sada lakshmikripakarah | tripuraripriyakaro hyugradhanvaparajitah
    ||123|| shaddhuradhvamsakarta ca nikumbhapranaharakah | vajranabhapuradhvamsi paundrakapranaharakah
    ||124|| bahulashvapritikarta dvijavaryapriyankarah | shivasankatahari ca vrikasuravinashanah ||125||
    bhrigusatkarakari ca shivasattvikatapradah | gokarnapujakah sambakushthavidhvamsakaranah ||126|| vedastuto
    vedavetta yaduvamshavivarddhanah | yaduvamshavinashi ca uddhavoddharakarakah ||127|| radha ca radhika
    caiva ananda vrishabhanuja | vrindavaneshvari punya krishnamanasaharini ||128|| pragalbha catura kama
    kamini harimohini | lalita madhura madhvi kishori kanakaprabha ||129|| jitacandra jitamriga jitasimha
    jitadvipa | jitarambha jitapika govindahridayodbhava ||130|| jitabimba jitashuka jitapadma kumarika
    | shrikrishnakarshana devi nityam yugmasvarupini ||131|| nityam viharini kanta rasika krishnavallabha
    | amodini modavati nandanandanabhushita || 132|| divyambara divyahara muktamanivibhushita | kunjapriya
    kunjavasa kunjanayakanayika ||133|| carurupa caruvaktra caruhemangada shubha | shrikrishnavenusangita
    muraliharini shiva ||134|| bhadra bhagavati shanta kumuda sundari priya | krishnakrida krishnaratih
    shrikrishnasahacarini ||135|| vamshivatapriyasthana yugmayugmasvarupini | bhandiravasini shubhra gopinathapriya
    sakhi ||136|| shrutinihshvasita divya govindarasadayini | shrikrishnaprarthanishana mahanandapradayini
    ||137|| vaikunthajanasamsevya kotilakshmisukhavaha | kotikandarpalavanya ratikotiratiprada ||138||
    bhaktigrahya bhaktirupa lavanyasarasi uma | brahmarudradisamradhya nityam kautuhalanvita ||139|| nityalila
    nityakama nityashringarabhushita | nityavrindavanarasa nandanandanasamyuta ||140|| gopikamandaliyukta
    nityam gopalasangata | gorasakshepani shura sanandanandadayini ||141|| mahalila prakrishta ca nagari
    nagacarini | nityamaghurnita purna kasturitilakanvita ||142|| padma shyama mrigakshi ca siddhirupa
    rasavaha | koticandranana gauri kotikokilasusvara ||143|| shilasaundaryanilaya nandanandanalalita
    | ashokavanasamvasa bhandiravanasangata ||144|| kalpadrumatalavishta krishna vishva haripriya | ajagamya
    bhavagamya govarddhanakritalaya ||145|| yamunatiranilaya shashvadgovindajalpini | shashvanmanavati
    snigdha shrikrishnaparivandita ||146|| krishnastuta krishnavrita shrikrishnahridayalaya | devadrumaphala
    sevya vrindavanarasalaya ||147|| kotitirthamayi satya kotitirthaphalaprada | kotiyogasudushprapya
    kotiyajnadurashraya ||148|| manasa shashilekha ca shrikotisubhaga''nagha | kotimuktasukha saumya lakshmikotivilasini
    ||149|| tilottama trikalastha trikalajnapyadhishvari | trivedajna trilokajna turiyantanivasini ||150||
    durgaradhya ramaradhya vishvaradhya cidatmika | devaradhya pararadhya brahmaradhya paratmika ||151||
    shivaradhya premasadhya bhaktaradhya rasatmika | krishnapranarpini bhama shuddhapremavilasini ||152||
    krishnaradhya bhaktisadhya bhaktavrindanishevita | vishvadhara kripadhara jivadharatinayika ||153||
    shuddhapremamayi lajja nityasiddha shiromanih | divyarupa divyabhoga divyavesha mudanvita ||154||
    divyanganavrindasara nityanutanayauvana | parabrahmavrita dhyeya maharupa mahojjvala ||155|| kotisuryaprabha
    koticandrabimbadhikacchavih | komalamritavagadya vedadya vedadurlabha ||156|| krishnasakta krishnabhakta
    candravalinishevita | kalashodashasampurna krishnadeharddhadharini ||157|| krishnabuddhih krishnasara
    krishnarupaviharini | krishnakanta krishnadhana krishnamohanakarini ||158|| krishnadrishtih krishnagotri
    krishnadevi kulodvaha | sarvabhutasthitavatma sarvalokanamaskrita ||159|| krishnadatri premadhatri
    svarnagatri manorama | nagadhatri yashodatri mahadevi shubhankari ||160|| shrisheshadevajanani avataraganaprasuh
    | utpalankaravindanka prasadanka dvitiyaka ||161|| rathanka kunjaranka ca kundalankapadasthita | chatranka
    vidyudanka ca pushpamalankitapi ca ||162|| dandanka mukutanka ca purnacandra shukankita | krishnannaharapaka
    ca vrindakunjaviharini ||163|| krishnaprabodhanakari krishnasheshannabhojini | padmakesaramadhyastha
    sangitagamavedini ||164|| kotikalpantabhrubhanga apraptapralayacyuta | sarvasattvanidhih padmashankhadinidhisevita
    ||165|| animadigunaishvarya devavrindavimohini | sarvanandaprada sarva suvarnalatikakritih ||166||
    krishnabhisarasanketa malini nrityapandita | gopisindhusakashahva gopamandapashobhini ||167|| shrikrishnapritida
    bhita pratyangapulakancita | shrikrishnalinganarata govindavirahakshama ||168|| anantagunasampanna
    krishnakirtanalalasa | bijatrayamayi murtih krishnanugrahavanchita ||169|| vimaladinishevya ca lalitadyarcita
    sati | padmavrindasthita hrishta tripuraparisevita ||170|| vrintavatyarcita shraddha durjneya bhaktavallabha
    | durlabha sandrasaukhyatma shreyohetuh subhogada ||171|| saranga sharada bodha sadvrindavanacarini
    | brahmananda cidananda dhyananandarddhamatrika ||172|| gandharva suratajna ca govindapranasangama
    | krishnangabhushana ratnabhushana svarnabhushita ||173|| shrikrishnahridayavasamuktakanakanali'
  devanagari: । अक्रूरतापशमनो रजकायुःप्रणाशनः ॥८०॥ मथुरानन्ददायी च कंसवस्त्रविलुण्ठनः । कंसवस्त्रपरीधानो
    गोपवस्त्रप्रदायकः ॥८१॥ सुदामगृहगामी च सुदामपरिपूजितः । तन्तुवायकसंप्रीतः कुब्जाचन्दनलेपनः ॥८२॥ कुब्जारूपप्रदो
    विज्ञो मुकुन्दो विष्टरश्रवाः । सर्वज्ञो मथुरालोकी सर्वलोकाभिनन्दनः ॥ ८३॥ कृपाकटाक्षदर्शी च दैत्यारिर्देवपालकः
    । सर्वदुःखप्रशमनो धनुर्भङ्गी महोत्सवः ॥८४॥ कुवलयापीडहन्ता दन्तस्कन्धबलाग्रणीः । कल्परूपधरो धीरो दिव्यवस्त्रानुलेपनः
    ॥८५॥ मल्लरूपो महाकालः कामरूपी बलान्वितः । कंसत्रासकरो भीमो मुष्टिकान्तश्च कंसहा ॥८६॥ चाणूरघ्नो भयहरः
    शलारिस्तोशलान्तकः । वैकुण्ठवासी कंसारिः सर्वदुष्टनिषूदनः ॥८७॥ देवदुन्दुभिनिर्घोषी पितृशोकनिवारणः ।
    यादवेन्द्रः सतांनाथो यादवारिप्रमर्द्दनः ॥८८॥ शौरिशोकविनाशी च देवकीतापनाशनः । उग्रसेनपरित्राता उग्रसेनाभिपूजितः
    ॥८९॥ उग्रसेनाभिषेकी च उग्रसेनदयापरः । सर्वसात्वतसाक्षी च यदूनामभिनन्दनः ॥९०॥ सर्वमाथुरसंसेव्यः करुणो
    भक्तबान्धवः । सर्वगोपालधनदो गोपीगोपाललालसः ॥९१॥ शौरिदत्तोपवीती च उग्रसेनदयाकरः । गुरुभक्तो ब्रह्मचारी
    निगमाध्ययने रतः ॥९२॥ संकर्षणसहाध्यायी सुदामसुहृदेव च । विद्यानिधिः कलाकोशो मृतपुत्रप्रदस्तथा ॥९३॥
    चक्री पाञ्चजनी चैव सर्वनारकिमोचनः । यमार्चितः परो देवो नामोच्चारवशोऽच्युतः ॥९४॥ कुब्जाविलासी सुभगो
    दीनबन्धुरनूपमः । अक्रूरगृहगोप्ता च प्रतिज्ञापालकः शुभः ॥९५॥ जरासन्धजयी विद्वान् यवनान्तो द्विजाश्रयः
    । मुचुकुन्दप्रियकरो जरासन्धपलायितः ॥९६॥ द्वारकाजनको गूढो ब्रह्मण्यः सत्यसङ्गरः । लीलाधरः प्रियकरो
    विश्वकर्मा यशःप्रदः ॥९७॥ रुक्मिणीप्रियसन्देशो रुक्मशोकविवर्द्धनः । चैद्यशोकालयः श्रेष्ठो दुष्टराजन्यनाशनः
    ॥ ९८॥ रुक्मिवैरूप्यकरणो रुक्मिणीवचने रतः । बलभद्रवचोग्राही मुक्तरुक्मी जनार्दनः ॥९९॥ रुक्मिणीप्राणनाथश्च
    सत्यभामापतिः स्वयम् । भक्तपक्षी भक्तिवश्यो ह्यक्रूरमणिदायकः ॥१००॥ शतधन्वाप्राणहारी ऋक्षराजसुताप्रियः
    । सत्राजित्तनयाकान्तो मित्रविन्दापहारकः ॥१०१॥ सत्यापतिर्लक्ष्मणाजित्पूज्यो भद्राप्रियङ्करः । नरकासुरघाती
    च लीलाकन्याहरो जयी ॥१०२॥ मुरारिर्मदनेशोऽपि धरित्रीदुःखनाशनः । वैनतेयी स्वर्गगामी अदित्य कुण्डलप्रदः
    ॥१०३॥ इन्द्रार्चितो रमाकान्तो वज्रिभार्याप्रपूजितः । पारिजातापहारी च शक्रमानापहारकः ॥१०४॥ प्रद्युम्नजनकः
    साम्बतातो बहुसुतो विधुः । गर्गाचार्यः सत्यगतिर्धर्माधारो धराधरः ॥१०५॥ द्वारकामण्डनः श्लोक्यः सुश्लोको
    निगमालयः । पौण्ड्रकप्राणहारी च काशीराजशिरोहरः ॥१०६॥ अवैष्णवविप्रदाही सुदक्षिणभयावहः । जरासन्धविदारी
    च धर्मनन्दनयज्ञकृत् ॥१०७॥ शिशुपालशिरश्छेदी दन्तवक्त्रविनाशनः । विदूरथान्तकः श्रीशः श्रीदो द्विविदनाशनः
    ॥१०८॥ रुक्मिणीमानहारी च रुक्मिणीमानवर्द्धनः । देवर्षिशापहर्ता च द्रौपदीवाक्यपालकः ॥१०९॥ दुर्वासोभयहारी
    च पाञ्चालीस्मरणागतः । पार्थदूतः पार्थमन्त्री पार्थदुःखौघनाशनः ॥११०॥ पार्थमानापहारी च पार्थजीवनदायकः
    । पाञ्चालीवस्त्रदाता च विश्वपालकपालकः ॥१११॥ श्वेताश्वसारथिः सत्यः सत्यसाध्यो भयापहः । सत्यसन्धः सत्यरतिः
    सत्यप्रिय उदारधीः ॥११२॥ महासेनजयी चैव शिवसैन्यविनाशनः । बाणासुरभुजच्छेत्ता बाणबाहुवरप्रदः ॥११३॥ तार्क्ष्यमानापहारी
    च तार्क्ष्यतेजोविवर्द्धनः । रामस्वरूपधारी च सत्यभामामुदावहः ॥११४॥ रत्नाकरजलक्रीडो व्रजलीलाप्रदर्शकः
    । स्वप्रतिज्ञापरिध्वंसी भीष्माज्ञापरिपालकः ॥११५॥ वीरायुधहरः कालः कालिकेशो महाबलः । वर्वरीषशिरोहारी
    वर्वरीषशिरःप्रदः ॥११६॥ धर्मपुत्रजयी शूरदुर्योधनमदान्तकः । गोपिकाप्रीतिनिर्बन्धनित्यक्रीडो व्रजेश्वरः
    ॥११७॥ राधाकुण्डरतिर्धन्यः सदान्दोलसमाश्रितः । सदामधुवनानन्दी सदावृन्दावनप्रियः ॥११८॥ अशोकवनसन्नद्धः
    सदातिलकसङ्गतः । सदागोवर्द्धनरतिः सदा गोकुलवल्लभः ॥११९॥ भाण्डीरवटसंवासी नित्यं वंशीवटस्थितः । नन्दग्रामकृतावासो
    वृषभानुग्रहप्रियः ॥१२०॥ गृहीतकामिनीरूपो नित्यं रासविलासकृत् । वल्लवीजनसङ्गोप्ता वल्लवीजनवल्लभः ॥१२१॥
    देवशर्मकृपाकर्ता कल्पपादपसंस्थितः । शिलानुगन्धनिलयः पादचारी घनच्छविः ॥१२२॥ अतसीकुसुमप्रख्यः सदा लक्ष्मीकृपाकरः
    । त्रिपुरारिप्रियकरो ह्युग्रधन्वापराजितः ॥१२३॥ षड्धुरध्वंसकर्ता च निकुम्भप्राणहारकः । वज्रनाभपुरध्वंसी
    पौण्ड्रकप्राणहारकः ॥१२४॥ बहुलाश्वप्रीतिकर्ता द्विजवर्यप्रियङ्करः । शिवसङ्कटहारी च वृकासुरविनाशनः ॥१२५॥
    भृगुसत्कारकारी च शिवसात्त्विकताप्रदः । गोकर्णपूजकः साम्बकुष्ठविध्वंसकारणः ॥१२६॥ वेदस्तुतो वेदवेत्ता
    यदुवंशविवर्द्धनः । यदुवंशविनाशी च उद्धवोद्धारकारकः ॥१२७॥ राधा च राधिका चैव आनन्दा वृषभानुजा । वृन्दावनेश्वरी
    पुण्या कृष्णमानसहारिणी ॥१२८॥ प्रगल्भा चतुरा कामा कामिनी हरिमोहिनी । ललिता मधुरा माध्वी किशोरी कनकप्रभा
    ॥१२९॥ जितचन्द्रा जितमृगा जितसिंहा जितद्विपा । जितरम्भा जितपिका गोविन्दहृदयोद्भवा ॥१३०॥ जितबिम्बा जितशुका
    जितपद्मा कुमारिका । श्रीकृष्णाकर्षणा देवी नित्यं युग्मस्वरूपिणी ॥१३१॥ नित्यं विहारिणी कान्ता रसिका
    कृष्णवल्लभा । आमोदिनी मोदवती नन्दनन्दनभूषिता ॥ १३२॥ दिव्याम्बरा दिव्यहारा मुक्तामणिविभूषिता । कुञ्जप्रिया
    कुञ्जवासा कुञ्जनायकनायिका ॥१३३॥ चारुरूपा चारुवक्त्रा चारुहेमाङ्गदा शुभा । श्रीकृष्णवेणुसङ्गीता मुरलीहारिणी
    शिवा ॥१३४॥ भद्रा भगवती शान्ता कुमुदा सुन्दरी प्रिया । कृष्णक्रीडा कृष्णरतिः श्रीकृष्णसहचारिणी ॥१३५॥
    वंशीवटप्रियस्थाना युग्मायुग्मस्वरूपिणी । भाण्डीरवासिनी शुभ्रा गोपीनाथप्रिया सखी ॥१३६॥ श्रुतिनिःश्वसिता
    दिव्या गोविन्दरसदायिनी । श्रीकृष्णप्रार्थनीशाना महानन्दप्रदायिनी ॥१३७॥ वैकुण्ठजनसंसेव्या कोटिलक्ष्मीसुखावहा
    । कोटिकन्दर्पलावण्या रतिकोटिरतिप्रदा ॥१३८॥ भक्तिग्राह्या भक्तिरूपा लावण्यसरसी उमा । ब्रह्मरुद्रादिसंराध्या
    नित्यं कौतूहलान्विता ॥१३९॥ नित्यलीला नित्यकामा नित्यशृङ्गारभूषिता । नित्यवृन्दावनरसा नन्दनन्दनसंयुता
    ॥१४०॥ गोपिकामण्डलीयुक्ता नित्यं गोपालसङ्गता । गोरसक्षेपणी शूरा सानन्दानन्ददायिनी ॥१४१॥ महालीला प्रकृष्टा
    च नागरी नगचारिणी । नित्यमाघूर्णिता पूर्णा कस्तूरीतिलकान्विता ॥१४२॥ पद्मा श्यामा मृगाक्षी च सिद्धिरूपा
    रसावहा । कोटिचन्द्रानना गौरी कोटिकोकिलसुस्वरा ॥१४३॥ शीलसौन्दर्यनिलया नन्दनन्दनलालिता । अशोकवनसंवासा
    भाण्डीरवनसङ्गता ॥१४४॥ कल्पद्रुमतलाविष्टा कृष्णा विश्वा हरिप्रिया । अजागम्या भवागम्या गोवर्द्धनकृतालया
    ॥१४५॥ यमुनातीरनिलया शश्वद्गोविन्दजल्पिनी । शश्वन्मानवती स्निग्धा श्रीकृष्णपरिवन्दिता ॥१४६॥ कृष्णस्तुता
    कृष्णवृता श्रीकृष्णहृदयालया । देवद्रुमफला सेव्या वृन्दावनरसालया ॥१४७॥ कोटितीर्थमयी सत्या कोटितीर्थफलप्रदा
    । कोटियोगसुदुष्प्राप्या कोटियज्ञदुराश्रया ॥१४८॥ मनसा शशिलेखा च श्रीकोटिसुभगाऽनघा । कोटिमुक्तसुखा सौम्या
    लक्ष्मीकोटिविलासिनी ॥१४९॥ तिलोत्तमा त्रिकालस्था त्रिकालज्ञाप्यधीश्वरी । त्रिवेदज्ञा त्रिलोकज्ञा तुरीयान्तनिवासिनी
    ॥१५०॥ दुर्गाराध्या रमाराध्या विश्वाराध्या चिदात्मिका । देवाराध्या पराराध्या ब्रह्माराध्या परात्मिका
    ॥१५१॥ शिवाराध्या प्रेमसाध्या भक्ताराध्या रसात्मिका । कृष्णप्राणार्पिणी भामा शुद्धप्रेमविलासिनी ॥१५२॥
    कृष्णाराध्या भक्तिसाध्या भक्तवृन्दनिषेविता । विश्वाधारा कृपाधारा जीवधारातिनायिका ॥१५३॥ शुद्धप्रेममयी
    लज्जा नित्यसिद्धा शिरोमणिः । दिव्यरूपा दिव्यभोगा दिव्यवेषा मुदान्विता ॥१५४॥ दिव्याङ्गनावृन्दसारा नित्यनूतनयौवना
    । परब्रह्मावृता ध्येया महारूपा महोज्ज्वला ॥१५५॥ कोटिसूर्यप्रभा कोटिचन्द्रबिम्बाधिकच्छविः । कोमलामृतवागाद्या
    वेदाद्या वेददुर्लभा ॥१५६॥ कृष्णासक्ता कृष्णभक्ता चन्द्रावलिनिषेविता । कलाषोडशसम्पूर्णा कृष्णदेहार्द्धधारिणी
    ॥१५७॥ कृष्णबुद्धिः कृष्णसारा कृष्णरूपविहारिणी । कृष्णकान्ता कृष्णधना कृष्णमोहनकारिणी ॥१५८॥ कृष्णदृष्टिः
    कृष्णगोत्री कृष्णदेवी कुलोद्वहा । सर्वभूतस्थितावात्मा सर्वलोकनमस्कृता ॥१५९॥ कृष्णदात्री प्रेमधात्री
    स्वर्णगात्री मनोरमा । नगधात्री यशोदात्री महादेवी शुभङ्करी ॥१६०॥ श्रीशेषदेवजननी अवतारगणप्रसूः । उत्पलाङ्कारविन्दाङ्का
    प्रसादाङ्का द्वितीयका ॥१६१॥ रथाङ्का कुञ्जराङ्का च कुण्डलाङ्कपदस्थिता । छत्राङ्का विद्युदङ्का च पुष्पमालाङ्कितापि
    च ॥१६२॥ दण्डाङ्का मुकुटाङ्का च पूर्णचन्द्रा शुकाङ्किता । कृष्णान्नाहारपाका च वृन्दाकुञ्जविहारिणी ॥१६३॥
    कृष्णप्रबोधनकरी कृष्णशेषान्नभोजिनी । पद्मकेसरमध्यस्था सङ्गीतागमवेदिनी ॥१६४॥ कोटिकल्पान्तभ्रूभङ्गा
    अप्राप्तप्रलयाच्युता । सर्वसत्त्वनिधिः पद्मशङ्खादिनिधिसेविता ॥१६५॥ अणिमादिगुणैश्वर्या देववृन्दविमोहिनी
    । सर्वानन्दप्रदा सर्वा सुवर्णलतिकाकृतिः ॥१६६॥ कृष्णाभिसारसङ्केता मालिनी नृत्यपण्डिता । गोपीसिन्धुसकाशाह्वा
    गोपमण्डपशोभिनी ॥१६७॥ श्रीकृष्णप्रीतिदा भीता प्रत्यङ्गपुलकाञ्चिता । श्रीकृष्णालिङ्गनरता गोविन्दविरहाक्षमा
    ॥१६८॥ अनन्तगुणसम्पन्ना कृष्णकीर्तनलालसा । बीजत्रयमयी मूर्तिः कृष्णानुग्रहवाञ्छिता ॥१६९॥ विमलादिनिषेव्या
    च ललिताद्यर्चिता सती । पद्मवृन्दस्थिता हृष्टा त्रिपुरापरिसेविता ॥१७०॥ वृन्तावत्यर्चिता श्रद्धा दुर्ज्ञेया
    भक्तवल्लभा । दुर्लभा सान्द्रसौख्यात्मा श्रेयोहेतुः सुभोगदा ॥१७१॥ सारङ्गा शारदा बोधा सद्वृन्दावनचारिणी
    । ब्रह्मानन्दा चिदानन्दा ध्यानानन्दार्द्धमात्रिका ॥१७२॥ गन्धर्वा सुरतज्ञा च गोविन्दप्राणसङ्गमा । कृष्णाङ्गभूषणा
    रत्नभूषणा स्वर्णभूषिता ॥१७३॥ श्रीकृष्णहृदयावासमुक्ताकनकनालि
