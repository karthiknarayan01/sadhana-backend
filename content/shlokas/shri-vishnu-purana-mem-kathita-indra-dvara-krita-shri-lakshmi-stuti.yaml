id: shri-vishnu-purana-mem-kathita-indra-dvara-krita-shri-lakshmi-stuti
category: stotram
name:
  english: shri vishnu purana mem kathita indra dvara krita shri lakshmi stuti
  devanagari: श्री विष्णु पुराण में कथित इन्द्र द्वारा कृत श्री लक्ष्मी स्तुति
content:
  english: shri vishnu purana mem kathita indra dvara krita namastasyai sarvabhutanam jananimabjasambhavam
    shriyamunindrapadmakshim vishnuvakshahsthalasthitam|| padmalayam padmakaram padmapatranibhekshanam
    vande padmamukhim devim padmanabhapriyamyaham|| tvam siddhistvam svadha svaha sudha tvam lokapavani
    sandhaya ratrih prabha bhutirmedha shraddha sarasvati|| yajnavidya mahavidya guhyavidya ca shobhane
    atmavidya ca devi tvam vimuktiphaladayini|| anvikshiki trayivarta dandanitistvameva ca saumyasaumyerjagadrupaistvayaitaddevi
    puritam|| ka tvanya tvamrite devi sarvayajnamayam vapuh adhyaste devadevasya yogicintyam gadabhritah||
    tvaya devi parityaktam sakalam bhuvanatrayam vinashtaprayamabhavattvayedanim samedhitam|| darah putrastatha''garam
    suhriddhanyadhanadikam bhavatyetanmahabhage nityam tvadvikshanannrinam|| sharirarogyamaishvaryamaripakshakshayah
    sukham devi tvadrishtidrishtanam purushanam na durlabham|| tvamamba sarvabhutanam devadevo harih pita
    tvayaitadvishnuna camba jagadvayaptam caracaram|| manahkoshastatha goshtham ma griham ma paricchadam
    ma shariram kalatram ca tyajethah sarvapavani|| ma putranma suhridvarganma pashunma vibhushanam tyajetha
    mama devasya vishnorvakshahsthalashraye|| sattvena satyashaucabhyam tatha shiladibhirgunaih tyajyante
    te narah sadyah santyakta ye tvaya'male|| tvaya'valokitah sadyah shiladyairakhilairgunaih kulaishvaryaishca
    yujyante purusha nirguna api|| sashlaghyah saguni dhanyah sa kulinah sa buddhiman sa shurah sacavikranto
    yastvaya devi vikshitah|| sadyovaigunyamayanti shiladyah sakala gunah parangamukhi jagaddhatri yasya
    tvam vishnuvallabhe|| na te varnayitum shaktagunanjihva'pi vedhasah prasida devi padmakshi ma'smamstyakshih
    kadacana|| shriparashara bole evam shrih samstuta smayak praha hrishta shatakratum shrrinvatam sarvadevanam
    sarvabhutasthita dvija|| shri bolim paritushtasmi devesha stotrenanena te hareh varam vrinishva yastvishto
    varada'ham tavagata|| indra bole varada yadimedevi vararho yadiva'pyaham trailokyam na tvaya tyacyamesha
    me'stu varah parah|| stotrena yastavaitena tvam stoshyatyabdhisambhave sa tvaya na parityajyo dvitiyo'stuvaro
    mama|| shri bolim trailokyam tridashashreshtha na santyakshyami vasava datto varo maya'yam te stotraradhanatushtaya||
    yashca sayam tatha pratah stotrenanena manavah stoshyate cenna tasyaham bhavishyami parangamukhi||
    sambamdhita kar̤iya~
  devanagari: श्री विष्णु पुराण में कथित इन्द्र द्वारा कृत नमस्तस्यै सर्वभूतानां जननीमब्जसम्भवाम् श्रियमुनिन्द्रपद्माक्षीं
    विष्णुवक्षःस्थलस्थिताम्॥ पद्मालयां पद्मकरां पद्मपत्रनिभेक्षणाम् वन्दे पद्ममुखीं देवीं पद्मनाभप्रियाम्यहम्॥
    त्वं सिद्धिस्त्वं स्वधा स्वाहा सुधा त्वं लोकपावनी सन्धया रात्रिः प्रभा भूतिर्मेधा श्रद्धा सरस्वती॥
    यज्ञविद्या महाविद्या गुह्यविद्या च शोभने आत्मविद्या च देवि त्वं विमुक्तिफलदायिनी॥ आन्वीक्षिकी त्रयीवार्ता
    दण्डनीतिस्त्वमेव च सौम्यासौम्येर्जगद्रूपैस्त्वयैतद्देवि पूरितम्॥ का त्वन्या त्वमृते देवि सर्वयज्ञमयं
    वपुः अध्यास्ते देवदेवस्य योगिचिन्त्यं गदाभृतः॥ त्वया देवि परित्यक्तं सकलं भुवनत्रयम् विनष्टप्रायमभवत्त्वयेदानीं
    समेधितम्॥ दाराः पुत्रास्तथाऽऽगारं सुहृद्धान्यधनादिकम् भवत्येतन्महाभागे नित्यं त्वद्वीक्षणान्नृणाम्॥
    शरीरारोग्यमैश्वर्यमरिपक्षक्षयः सुखम् देवि त्वदृष्टिदृष्टानां पुरुषाणां न दुर्लभम्॥ त्वमम्बा सर्वभूतानां
    देवदेवो हरिः पिता त्वयैतद्विष्णुना चाम्ब जगद्वयाप्तं चराचरम्॥ मनःकोशस्तथा गोष्ठं मा गृहं मा परिच्छदम्
    मा शरीरं कलत्रं च त्यजेथाः सर्वपावनि॥ मा पुत्रान्मा सुहृद्वर्गान्मा पशून्मा विभूषणम् त्यजेथा मम देवस्य
    विष्णोर्वक्षःस्थलाश्रये॥ सत्त्वेन सत्यशौचाभ्यां तथा शीलादिभिर्गुणैः त्यज्यन्ते ते नराः सद्यः सन्त्यक्ता
    ये त्वयाऽमले॥ त्वयाऽवलोकिताः सद्यः शीलाद्यैरखिलैर्गुणैः कुलैश्वर्यैश्च युज्यन्ते पुरुषा निर्गुणा अपि॥
    सश्लाघ्यः सगुणी धन्यः स कुलीनः स बुद्धिमान् स शूरः सचविक्रान्तो यस्त्वया देवि वीक्षितः॥ सद्योवैगुण्यमायान्ति
    शीलाद्याः सकला गुणाः पराङ्गमुखी जगद्धात्री यस्य त्वं विष्णुवल्लभे॥ न ते वर्णयितुं शक्तागुणञ्जिह्वाऽपि
    वेधसः प्रसीद देवि पद्माक्षि माऽस्मांस्त्याक्षीः कदाचन॥ श्रीपराशर बोले एवं श्रीः संस्तुता स्मयक् प्राह
    हृष्टा शतक्रतुम् श्रृण्वतां सर्वदेवानां सर्वभूतस्थिता द्विज॥ श्री बोलीं परितुष्टास्मि देवेश स्तोत्रेणानेन
    ते हरेः वरं वृणीष्व यस्त्विष्टो वरदाऽहं तवागता॥ इन्द्र बोले वरदा यदिमेदेवि वरार्हो यदिवाऽप्यहम् त्रैलोक्यं
    न त्वया त्याच्यमेष मेऽस्तु वरः परः॥ स्तोत्रेण यस्तवैतेन त्वां स्तोष्यत्यब्धिसम्भवे स त्वया न परित्याज्यो
    द्वितीयोऽस्तुवरो मम॥ श्री बोलीं त्रैलोक्यं त्रिदशश्रेष्ठ न सन्त्यक्ष्यामि वासव दत्तो वरो मयाऽयं ते
    स्तोत्राराधनतुष्टया॥ यश्च सायं तथा प्रातः स्तोत्रेणानेन मानवः स्तोष्यते चेन्न तस्याहं भविष्यामि पराङ्गमुखी॥
    संबंधित कड़ियाँ
