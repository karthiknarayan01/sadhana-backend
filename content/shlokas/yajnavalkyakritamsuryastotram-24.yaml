id: yajnavalkyakritamsuryastotram-24
category: stotram
name:
  english: yajnavalkyakritamsuryastotram 24
  devanagari: याज्नवल्क्यकृतंसूर्यस्तोत्रम् २४
content:
  english: yamayajushkama upasaramiti || 72|| iti shrimadbhagavatamahapurane dvadashaskandhe shashthadhyayantargatam
    yajnavalkyakritam suryastotram samaptam | bhagavatapurana | adhyaya 12
  devanagari: यामयजुष्काम उपसरामीति ॥ ७२॥ इति श्रीमद्भागवतमहापुराणे द्वादशस्कन्धे षष्ठाध्यायान्तर्गतं
    याज्ञवल्क्यकृतं सूर्यस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १२
meaning: {}
