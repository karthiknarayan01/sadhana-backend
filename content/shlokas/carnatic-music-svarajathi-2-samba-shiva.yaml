id: carnatic-music-svarajathi-2-samba-shiva
category: stotram
name:
  english: Carnatic Music Svarajathi 2 (Samba Shiva)
content:
  english: catusra jati triputa talam cinnakrishna dasar pallavi sambashivayanave rajitagiri shambhavimanohara
    paratpara kripakara shri caranam nive guru daivambani ye velanu sevimpucu sada madini shiva caranam
    parama dayanidhi vanucu maruvaka na hridayamuna mahadeva mahaprabho sundara nayana suravara dayaka
    bhavabhaya harashiva caranam sthira madhurapuramuna varamulòsagu haruni niratamunu dalaci caranam
    shri shubhakara shashi makutadhara jaya vijaya tripurahara shritajana loladbhuta gunashila kritanutapala
    patituni lola mudambala ranga padabjamulandu padambulujercu pashupatini jnanamu dhyanamu snanamu panamu
    danamu manamu abhimanamanucu kanikaramuna caranambulu kanu gònu shritulannutula sharananucu sarèsarègu
    ni nama mantram korinanu ni padambuja mantram dasudau cinni krishnuniki dikku niveyani shòkkanathuni
    nammukòni svarah pallavi sa ga | ma pa da ni || la nu se || sa sa sa sa | ma ma ma ma | pa pa pa pa
    | da da da da | ma ha de va | ma ha pra bho | sun da pa | da pa ma ga | ma pa da ni || su ra va ra
    | da ya ka | bha va bha ya | ha ra shi va || | pa da ni da | sthi ra ma dhu | ra pu ra mu | na | va
    ra mu lò | pa ma ga ga | ma | pa ni da ni | da pa da ni || sa gu ha ru | ni | ni ra ta mu | nu da
    la ci || ni | ni da da pa | pa ma ga ga | shri shu bha | ka ra sha shi | ma ku ta dha | ma pa da |
    ni da ma ga | ma pa da ni || ra ja ya | vi ja ya tri | pu ra ha ra || sa rcu | pa shu pa ti | ni |
    na ma nu cu || ga ma pa da | ni sa | ka ni ka ra | mu na ca ra | nam | bu lu ka nu | da ni pa da |
    ma | da pa ma ga | ma pa da ni || gò nu shri tu | lan | nu tu la sha | ra na nu cu ||
  devanagari: चतुस्र जाति त्रिपुट तालम् चिन्नकृष्ण दासर् पल्लवि साम्बशिवायनवे राजितगिरि शाम्भवीमनोहरा
    परात्परा कृपाकरा श्री चरणं नीवे गुरु दैवम्बनि ये वेलनु सेविम्पुचु सदा मदिनि शिव चरणं परम दयानिधि वनुचु
    मरुवक ना हृदयमुन महादेव महाप्रभो सुन्दर नयन सुरवर दायक भवभय हरशिव चरणं स्थिर मधुरापुरमुन वरमुलॊसगु
    हरुनि निरतमुनु दलचि चरणं श्री शुभकर शशि मकुटधर जय विजय त्रिपुरहरा श्रितजन लोलाद्भुत गुणशीला कृतनुतपाला
    पतितुनि लोला मुदम्बल रङ्ग पदाब्जमुलन्दु पदम्बुलुजेर्चु पशुपतिनि ज्ञानमु ध्यानमु स्नानमु पानमु दानमु
    मानमु अभिमानमनुचु कनिकरमुन चरणम्बुलु कनु गॊनु शृतुलन्नुतुल शरणनुचु सारॆसारॆगु नी नाम मन्त्रं कोरिनानु
    नी पादाम्बुज मन्त्रम् दासुडौ चिन्नि कृष्णुनिकि दिक्कु नीवेयनि शॊक्कनाथुनि नम्मुकॊनि स्वराः पल्लवि
    स ग । म प द नि ॥ ल नु से ॥ स स स स । म म म म । प प प प । द द द द । म हा दे व । म हा प्र भो । सुन्
    द प । द प म ग । म प द नि ॥ सु र व र । दा य क । भ व भ य । ह र शि व ॥ । प द नि द । स्थि र म धु । रा
    पु र मु । न । व र मु लॊ । प म ग ग । म । प नि द नि । द प द नि ॥ स गु ह रु । नि । नि र त मु । नु द ल
    चि ॥ नि । नि द द प । प म ग ग । श्री शु भ । क र श शि । म कु ट ध । म प द । नि द म ग । म प द नि ॥ रा
    ज य । वि ज य त्रि । पु र ह रा ॥ स र्चु । प शु प ति । नि । न म नु चु ॥ ग म प द । नि स । क नि क र ।
    मु न च र । णम् । बु लु क नु । द नि प द । म । द प म ग । म प द नि ॥ गॊ नु शृ तु । लन् । नु तु ल श ।
    र ण नु चु ॥
