id: navakshari
category: stotram
name:
  english: navakshari
  devanagari: नवाक्शरी
content:
  english: navaksharistotram shrigurucaranasarojam shrikarabhavataranasukaradridhanavam | maccitamadhupajhankritamanandam
    naumi shankaram sharanyam || 1|| aindradhanurmaratakamamairavatanathagirbhirabhyarcyam | ainkararthasvarupamaishaninathasevitam
    vande || 2|| hrinatadaityasamuham hridyam suralokasevitanghriyugam | hrimkarantyasarupam hridayavilasapracoditam
    vande || 3|| klimkarakamajananim klimitishabdaprapuritadigantam | klibastripumshabdakridarupam namami
    vishvamayim || 4|| camarabibhradvanicandrasajatasusevyaparshvayugam | caranatalamahishamundam capadikaram
    namami camundam || 5|| mundamaniharakanthim mukurakapolaprabhasushobhamukhim | muhurasphalitadhanusham
    muraharabhaginim namami mugdhatanum || 6|| dakinyadyabhitushtam damarukanadena puritadigantam | dambhabhimanahantrim
    damaratantraprakashitam vande || 7|| yaivarnasatyamayayasyai dattanyayudhani shakradyaih | yauvanamadasamrajyayai
    tasyai namo'stu vidyayai || 8|| vishvottirnam vidyam vividhajagaccitrakalpanarupam | viyadadisrishtihetum
    vishvasaikaprakashitam naumi || 9|| cetasi nitaram vasitacetomayi caityacetane cature | campakakalikanase
    camikarabhasurangi naumi tvam || 10|| aksharanavakshariyam nikshepamayi suvaksudharupa | etat stotram
    pathatam yacchati saubhagyakirtipushtidhritih || 11|| || ityanandanathapadapadmopajivina kashyapagotrotpannenandhrena
    tyagarajanamna viracitam navaksharistotram sampurnam ||
  devanagari: नवाक्षरीस्तोत्रम् श्रीगुरुचरणसरोजं श्रीकरभवतरणसुकरदृढनावम् । मच्चितमधुपझङ्कृतमानन्दं नौमि
    शाङ्करं शरण्यम् ॥ १॥ ऐन्द्रधनुर्मरतकमामैरावतनाथगीर्भिरभ्यर्च्याम् । ऐङ्कारार्थस्वरूपामैशानीनाथसेवितां
    वन्दे ॥ २॥ ह्रीनतदैत्यसमूहां हृद्यां सुरलोकसेविताङ्घ्रियुगाम् । ह्रींकारान्त्यसरूपां हृदयविलासप्रचोदितां
    वन्दे ॥ ३॥ क्लींकारकामजननीं क्लीमितिशब्दप्रपूरितदिगन्ताम् । क्लीबस्त्रीपुंशब्दक्रीडारूपां नमामि विश्वमयीम्
    ॥ ४॥ चामरबिभ्रद्वाणीचन्द्रसजातासुसेव्यपार्श्वयुगाम् । चरणतलमहिषमुण्डां चापादिकरां नमामि चामुण्डाम्
    ॥ ५॥ मुण्डमणिहारकण्ठीं मुकुरकपोलप्रभासुशोभमुखीम् । मुहुरास्फालितधनुषं मुरहरभागिनीं नमामि मुग्धतनुम्
    ॥ ६॥ डाकिन्याद्यभितुष्टां डमरुकनादेन पूरितदिगन्ताम् । डम्भाभिमानहन्त्रीं डामरतन्त्रप्रकाशितां वन्दे
    ॥ ७॥ यैवर्णसत्यमायायस्यै दत्तान्यायुधानि शक्राद्यैः । यौवनमदसाम्राज्यायै तस्यै नमोऽस्तु विद्यायै ॥
    ८॥ विश्वोत्तीर्णां विद्यां विविधजगच्चित्रकल्पनारूपाम् । वियदादिसृष्टिहेतुं विश्वासैकप्रकाशितां नौमि
    ॥ ९॥ चेतसि नितरां वासितचेतोमयि चैत्यचेतने चतुरे । चम्पककलिकानासे चामीकरभासुराङ्गि नौमि त्वाम् ॥ १०॥
    अक्षरनवाक्षरीयं निक्षेपमयी सुवाक्सुधारूपा । एतत् स्तोत्रम् पठतां यच्छति सौभाग्यकीर्तिपुष्टिधृतीः ॥
    ११॥ ॥ इत्यानन्दनाथपादपद्मोपजीविना काश्यपगोत्रोत्पन्नेनान्ध्रेण त्यागराजनाम्ना विरचितं नवाक्षरीस्तोत्रं
    सम्पूर्णम् ॥
