id: mudgalopanishat
category: upanishad
name:
  english: mudgalopanishat
  devanagari: मुद्गलोपनिषत्
content:
  english: tadbrahma tapatrayatitam shatkoshavinirmuktam shadurmivarjitam pancakoshatitam shadbhavavikarashunyamevamadi
    sarvavilakshanam bhavati ||1|| tapatrayam tvadhyatmikadhibhautikadhidaivikam kartrikarmakaryajnatrijnanajneya
    bhoktribhogabhogyamiti trividham ||2|| tvanmamsashonitasthi snayumajjah shatkoshah ||3|| kamakrodhalobhamohamadamatsaryamityarishadvargah
    ||4|| annamayapranamayamanomayavijnanamayanandamaya iti pancakoshah ||5|| priyatmajananavardhanaparinamakshayanashah
    shadbhavah ||6|| ashanayapipasashokamohajaramarananiti shadurmayah ||7|| kulagotrajativarnashramarupani
    shadbhramah ||8|| etadyogena paramapurusho jivo bhavati nanyah ||9|| ya etadupanishadam nityamadhite
    so'gniputo bhavati | sa vayuputo bhavati | sa adityaputo bhavati | arogi bhavati | shrimamshca bhavati
    | putrapautradibhih samriddho bhavati | vidvamshca bhavati | mahapatakatputo bhavati | surapanatputo
    bhavati | agamyagamanatputo bhavati | matrigamanatputo bhavati | duhitrisnushabhigamanatputo bhavati
    | svarnasteyatputo bhavati | vedijanmahanatputo bhavati | gurorashushrushanatputo bhavati | ayajyayajanatputo
    bhavati | abhakshyabhakshanatputo bhavati | ugrapratigrahatputo bhavati | paradaragamanatputo bhavati
    | kamakrodhalobhamohershyadibhirabadhito bhavati | sarvebhyah papebhyo mukto bhavati | iha janmani
    purusho bhavati ||10|| tasmadeta tpurushasuktarthamatirahasyam rajaguhyam devaguhyam guhyadapi guhyataram
    nadikshitayopadishet | nanucanaya | nayajnashilaya | navaishnavaya | nayogine | na bahubhashine |
    napriyavadine | nasamvatsaravedine | natushtaya | nanadhitavedayopadishet ||11|| gururapyevamvicchucau
    deshe punyanakshatre prananayamya purusham dhyayannupasannaya shishyaya dakshinakarne purushasuktarthamupadishedvidvan
    | na bahusho vadet | yatayamo bhavati | asakritkarnamupadishet | etatkurvano'dhyetadhyapakashca iha
    janmani purusho bhavatityupanishat ||12|| om vanme manasi pratishthita mano me vaci pratishthita maviravirma
    edhi || vedasya ma anisthah shrutam me ma prahasiranenadhitenahoratransandadhamyritam vadishyami satyam
    vadishyami || tanmamavatu tadvaktaramavatu avatu mamavatu vaktaramavatu vaktaram || om shantih shantih
    shantih || ||iti mudgalopanishatsamapta|| adhikadhyayanaya
  devanagari: तद्ब्रह्म तापत्रयातीतं षट्कोशविनिर्मुक्तं षडूर्मिवर्जितं पञ्चकोशातीतं षड्भावविकारशून्यमेवमादि
    सर्वविलक्षणं भवति ॥१॥ तापत्रयं त्वाध्यात्मिकाधिभौतिकाधिदैविकं कर्तृकर्मकार्यज्ञातृज्ञानज्ञेय भोक्तृभोगभोग्यमिति
    त्रिविधम् ॥२॥ त्वङ्मांसशोणितास्थि स्नायुमज्जाः षट्कोशाः ॥३॥ कामक्रोधलोभमोहमदमात्सर्यमित्यरिषड्वर्गः
    ॥४॥ अन्नमयप्राणमयमनोमयविज्ञानमयानन्दमया इति पञ्चकोशाः ॥५॥ प्रियात्मजननवर्धनपरिणामक्षयनाशाः षड्भावाः
    ॥६॥ अशनायापिपासाशोकमोहजरामरणानीति षडूर्मयः ॥७॥ कुलगोत्रजातिवर्णाश्रमरूपाणि षड्भ्रमाः ॥८॥ एतद्योगेन
    परमपुरुषो जीवो भवति नान्यः ॥९॥ य एतदुपनिषदं नित्यमधीते सोऽग्निपूतो भवति । स वायुपूतो भवति । स आदित्यपूतो
    भवति । अरोगी भवति । श्रीमांश्च भवति । पुत्रपौत्रादिभिः समृद्धो भवति । विद्वांश्च भवति । महापातकात्पूतो
    भवति । सुरापानात्पूतो भवति । अगम्यागमनात्पूतो भवति । मातृगमनात्पूतो भवति । दुहितृस्नुषाभिगमनात्पूतो
    भवति । स्वर्णस्तेयात्पूतो भवति । वेदिजन्महानात्पूतो भवति । गुरोरशुश्रूषणात्पूतो भवति । अयाज्ययाजनात्पूतो
    भवति । अभक्ष्यभक्षणात्पूतो भवति । उग्रप्रतिग्रहात्पूतो भवति । परदारगमनात्पूतो भवति । कामक्रोधलोभमोहेर्ष्यादिभिरबाधितो
    भवति । सर्वेभ्यः पापेभ्यो मुक्तो भवति । इह जन्मनि पुरुषो भवति ॥१०॥ तस्मादेत त्पुरुषसूक्तार्थमतिरहस्यं
    राजगुह्यं देवगुह्यं गुह्यादपि गुह्यतरं नादीक्षितायोपदिशेत् । नानूचानाय । नायज्ञशीलाय । नावैष्णवाय
    । नायोगिने । न बहुभाषिणे । नाप्रियवादिने । नासंवत्सरवेदिने । नातुष्टाय । नानधीतवेदायोपदिशेत् ॥११॥
    गुरुरप्येवंविच्छुचौ देशे पुण्यनक्षत्रे प्राणानायम्य पुरुषं ध्यायन्नुपसन्नाय शिष्याय दक्षिणकर्णे पुरुषसूक्तार्थमुपदिशेद्विद्वान्
    । न बहुशो वदेत् । यातयामो भवति । असकृत्कर्णमुपदिशेत् । एतत्कुर्वाणोऽध्येताध्यापकश्च इह जन्मनि पुरुषो
    भवतीत्युपनिषत् ॥१२॥ ॐ वाङ्मे मनसि प्रतिष्ठिता मनो मे वाचि प्रतिष्ठित माविरावीर्म एधि ॥ वेदस्य म आणीस्थः
    श्रुतं मे मा प्रहासीरनेनाधीतेनाहोरात्रान्सन्दधाम्यृतं वदिष्यामि सत्यं वदिष्यामि ॥ तन्मामवतु तद्वक्तारमवतु
    अवतु मामवतु वक्तारमवतु वक्तारम् ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥इति मुद्गलोपनिषत्समाप्ता॥ अधिकाध्ययनाय
