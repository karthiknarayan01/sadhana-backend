id: aparajitastotra
category: stotram
name:
  english: aparajitastotra
  devanagari: अपराजितास्तोत्र
content:
  english: shoshani sammohini | nilapatake mahanile mahagauri mahashriye | mahacandri mahasauri mahamayuri
    adityarashmi jahnavi | yamaghante kini kini cintamani | sugandhe surabhe surasurotpanne sarvakamadughe
    | yadyatha manishitam karyam tanmama siddhyatu svaha | om svaha | om bhuh svaha | om bhuvah svaha
    | om svah svaha | om mahah svaha | om janah svaha | om tapah svaha | om satyam svaha | om bhurbhuvah
    svah svaha | yata evagatam papam tatraiva pratigacchatu svahetyom | amoghaisha mahavidya vaishnavi
    caparajita || 32|| svayam vishnupranita ca siddheyam pathatah sada | esha mahabala nama kathita te'parajita
    || 33|| nanaya sadrishi raksha trishu lokeshu vidyate | tamogunamayi sakshadraudri shaktiriyam mata
    || 34|| kritanto'pi yato bhitah padamule vyavasthitah | muladhare nyasedetam ratravenam ca samsmaret
    || 35|| nilajimutasankasham taditkapilakeshikam | udyadadityasankasham netratrayavirajitam || 36||
    shaktim trishulam shankham ca panapatram ca vibhratim | vyaghracarmaparidhanam kinkinijalamanditam
    || 37|| dhavantim gaganasyantah padukahitapadakam | damshtrakaralavadanam vyalakundalabhushitam ||
    38|| vyattavaktram lalajjihvam bhrikutikutilalakam | svabhaktadveshinam raktam pibantim panapatratah
    || 39|| saptadhatun shoshayantim kruradrishtya vilokanat | trishulena ca tajjihvam kilayantim muhurmuhuh
    || 40|| pashena baddhva tam sadhamanavantim tadantike | arddharatrasya samaye devim dhayenmahabalam
    || 41|| yasya yasya vadennama japenmantram nishantake | tasya tasya tathavastham kurute sapi yogini
    || 42|| om bale mahabale asiddhasadhani svaheti | amogham pathati siddham shrivaishnavim || 43|| shrimadaparajitavidyam
    dhyayet | duhsvapne durarishte ca durnimitte tathaiva ca | vyavahare bhevetsiddhih pathedvighnopashantaye
    || 44|| yadatra pathe jagadambike maya visargabindva'ksharahinamiditam | tadastu sampurnatamam prayantu
    me sankalpasiddhistu sadaiva jayatam || 45|| tava tattvam na janami kidrishasi maheshvari | yadrishasi
    mahadevi tadrishayai namo namah || 46|| isa stotra ka vidhivata patha karane se saba prakara ke roga
    tatha saba prakara ke shatru aura saba bandhya dosha nashta hota hai | vishesha rupa se mukadamem
    mem saphalata aura rajakiya karyom mem aparajita rahane ke liye yaha patha ramabana hai |
  devanagari: शोषणि सम्मोहिनि । नीलपताके महानीले महागौरि महाश्रिये । महाचान्द्रि महासौरि महामायूरि आदित्यरश्मि
    जाह्नवि । यमघण्टे किणि किणि चिन्तामणि । सुगन्धे सुरभे सुरासुरोत्पन्ने सर्वकामदुघे । यद्यथा मनीषितं
    कार्यं तन्मम सिद्ध्यतु स्वाहा । ॐ स्वाहा । ॐ भूः स्वाहा । ॐ भुवः स्वाहा । ॐ स्वः स्वहा । ॐ महः स्वहा
    । ॐ जनः स्वहा । ॐ तपः स्वाहा । ॐ सत्यं स्वाहा । ॐ भूर्भुवः स्वः स्वाहा । यत एवागतं पापं तत्रैव प्रतिगच्छतु
    स्वाहेत्योम् । अमोघैषा महाविद्या वैष्णवी चापराजिता ॥ ३२॥ स्वयं विष्णुप्रणीता च सिद्धेयं पाठतः सदा
    । एषा महाबला नाम कथिता तेऽपराजिता ॥ ३३॥ नानया सदृशी रक्षा त्रिषु लोकेषु विद्यते । तमोगुणमयी साक्षद्रौद्री
    शक्तिरियं मता ॥ ३४॥ कृतान्तोऽपि यतो भीतः पादमूले व्यवस्थितः । मूलाधारे न्यसेदेतां रात्रावेनं च संस्मरेत्
    ॥ ३५॥ नीलजीमूतसङ्काशां तडित्कपिलकेशिकाम् । उद्यदादित्यसङ्काशां नेत्रत्रयविराजिताम् ॥ ३६॥ शक्तिं त्रिशूलं
    शङ्खं च पानपात्रं च विभ्रतीम् । व्याघ्रचर्मपरीधानां किङ्किणीजालमण्डिताम् ॥ ३७॥ धावन्तीं गगनस्यान्तः
    पादुकाहितपादकाम् । दंष्ट्राकरालवदनां व्यालकुण्डलभूषिताम् ॥ ३८॥ व्यात्तवक्त्रां ललज्जिह्वां भृकुटीकुटिलालकाम्
    । स्वभक्तद्वेषिणां रक्तं पिबन्तीं पानपात्रतः ॥ ३९॥ सप्तधातून् शोषयन्तीं क्रूरदृष्ट्या विलोकनात् ।
    त्रिशूलेन च तज्जिह्वां कीलयन्तीं मुहुर्मुहुः ॥ ४०॥ पाशेन बद्ध्वा तं साधमानवन्तीं तदन्तिके । अर्द्धरात्रस्य
    समये देवीं धायेन्महाबलाम् ॥ ४१॥ यस्य यस्य वदेन्नाम जपेन्मन्त्रं निशान्तके । तस्य तस्य तथावस्थां कुरुते
    सापि योगिनी ॥ ४२॥ ॐ बले महाबले असिद्धसाधनी स्वाहेति । अमोघां पठति सिद्धां श्रीवैष्णवीम् ॥ ४३॥ श्रीमदपराजिताविद्यां
    ध्यायेत् । दुःस्वप्ने दुरारिष्टे च दुर्निमित्ते तथैव च । व्यवहारे भेवेत्सिद्धिः पठेद्विघ्नोपशान्तये
    ॥ ४४॥ यदत्र पाठे जगदम्बिके मया विसर्गबिन्द्वऽक्षरहीनमीडितम् । तदस्तु सम्पूर्णतमं प्रयान्तु मे सङ्कल्पसिद्धिस्तु
    सदैव जायताम् ॥ ४५॥ तव तत्त्वं न जानामि कीदृशासि महेश्वरि । यादृशासि महादेवी तादृशायै नमो नमः ॥ ४६॥
    इस स्तोत्र का विधिवत पाठ करने से सब प्रकार के रोग तथा सब प्रकार के शत्रु और सब बन्ध्या दोष नष्ट होता
    है । विशेष रूप से मुकदमें में सफलता और राजकीय कार्यों में अपराजित रहने के लिये यह पाठ रामबाण है ।
