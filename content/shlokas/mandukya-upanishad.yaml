id: mandukya-upanishad
category: stotram
name:
  english: Mandukya Upanishad
content:
  english: shshrinuyama devah | bhadra ryajatrah | sthirairangai stushtuvagm sastanubhih | vyashema devahitam
    ya~dayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih
    | svasti no brihaspati shshantih || || atha mandukyopanishat || harih om | omityetadaksharamidagm
    sarva ntasyopavyakhyanam bhuta mbhavad bhavishyaditi sarvamonkara eva yaccanya || sarvagm hyetad brahmayamatma
    brahma so 'yamatma catushpat || || jagaritasthano bahishprajna ssaptanga ekonavimshatimukhah sthulabhugvaishvanarah
    prathamah padah || ssaptanga ekonavimshatimukhah praviviktabhuktaijaso dvitiyah padah || || yatra
    supto na kancana kama nkamayate na kancana svapnam pashyati ta thsushuptam | sushuptasthana ekibhutah
    prajnanaghana evanandamayo hyanandabhukcetomukhah prajnastritiyah padah || || esha sarveshvarah esha
    sarvajna esho ssarvasya prabhavapyayau hi bhutanam || nna prajnanaghanam na prajna nnaprajnam | adrishtamavyavaharyamagrahyamalakshanam
    acintyamavyapadeshyamekatmapratyayasara mprapancopashamam shantam shivamadvaita mmanyante sa atma
    sa vijneyah || 'yamatmadhyaksharamonkaro mpada matra matrashca pada akara ukaro makara iti || || jagaritasthano
    vaishvanaro ''pteradimattvad va ''pnoti ha vai sarvan kamanadishca bhavati ya evam || svapnasthanastaijasa
    ukaro dvitiya matrotkar shat ubhayatvadvotkar shati ha vai jnanasantatim samanashca bhavati nasyabrahmavitkule
    bhavati ya evam || sushuptasthanah prajno makarastritiya matra miterapiterva minoti ha va idam sarvamapitishca
    bhavati ya evam 'vyavaharyah prapancopashama 'dvaita evamonkara atmaiva sam || || iti mandukyopanisha
  devanagari: श्शृणु॒याम॑ देवाः । भ॒द्र र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म
    दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति
    न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑ श्शान्तिः॑ ॥ ॥ अथ माण्डूक्योपनिषत् ॥ हरिः ओम्
    । ओमित्येतदक्षरमिदग्ं सर्व न्तस्योपव्याख्यानं भूत म्भवद् भविष्यदिति सर्वमोङ्कार एव यच्चान्य ॥ सर्वग्ं
    ह्येतद् ब्रह्मायमात्मा ब्रह्म सो ऽयमात्मा चतुष्पात् ॥ ॥ जागरितस्थानो बहिष्प्रज्ञ स्सप्ताङ्ग एकोनविंशतिमुखः
    स्थूलभुग्वैश्वानरः प्रथमः पादः ॥ स्सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः ॥ ॥ यत्र
    सुप्तो न कञ्चन काम ङ्कामयते न कञ्चन स्वप्नं पश्यति त थ्सुषुप्तम् । सुषुप्तस्थान एकीभूतः प्रज्ञानघन
    एवानन्दमयो ह्यानन्दभुक्चेतोमुखः प्राज्ञस्तृतीयः पादः ॥ ॥ एष सर्वेश्वरः एष सर्वज्ञ एषो स्सर्वस्य प्रभवाप्ययौ
    हि भूतानाम् ॥ न्न प्रज्ञानघनं न प्रज्ञ न्नाप्रज्ञम् । अदृष्टमव्यवहार्यमग्राह्यमलक्षणं अचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसार
    म्प्रपञ्चोपशमं शान्तं शिवमद्वैत म्मन्यन्ते स आत्मा स विज्ञेयः ॥ ऽयमात्माध्यक्षरमोङ्कारो म्पादा मात्रा
    मात्राश्च पादा अकार उकारो मकार इति ॥ ॥ जागरितस्थानो वैश्वानरो ऽऽप्तेरादिमत्त्वाद् वा ऽऽप्नोति ह वै
    सर्वान् कामानादिश्च भवति य एवं ॥ स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर् षात् उभयत्वाद्वोत्कर्
    षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति य एवं ॥ सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया
    मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं ऽव्यवहार्यः प्रपञ्चोपशम ऽद्वैत एवमोङ्कार
    आत्मैव सं ॥ ॥ इति माण्डूक्योपनिष
