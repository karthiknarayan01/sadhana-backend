id: ashtavakra-gita-chapter-4
category: stotram
name:
  english: Ashtavakra Gita Chapter 4
content:
  english: janaka uvaca || hantatmajnanasya dhirasya khelato bhogalilaya | na hi samsaravahikairmudhaih
    saha samanata || || yat padam prepsavo dinah shakradyah sarvadevatah | aho tatra sthito yogi na harshamupagacchati
    || || tajjnasya punyapapabhyam sparsho hyantarna jayate | na hyakashasya dhumena drishyamanapi sangatih
    || || atmaivedam jagatsarvam jnatam yena mahatmana | yadricchaya vartamanam tam nisheddhum kshameta
    kah || || abrahmastambaparyante bhutagrame caturvidhe | vijnasyaiva hi samarthyamicchanicchavivarjane
    || || atmanamadvayam kashcijjanati jagadishvaram | yad vetti tatsa kurute na bhayam tasya kutracit
    ||
  devanagari: जनक उवाच ॥ हन्तात्मज्ञानस्य धीरस्य खेलतो भोगलीलया । न हि संसारवाहीकैर्मूढैः सह समानता ॥
    ॥ यत् पदं प्रेप्सवो दीनाः शक्राद्याः सर्वदेवताः । अहो तत्र स्थितो योगी न हर्षमुपगच्छति ॥ ॥ तज्ज्ञस्य
    पुण्यपापाभ्यां स्पर्शो ह्यन्तर्न जायते । न ह्याकाशस्य धूमेन दृश्यमानापि सङ्गतिः ॥ ॥ आत्मैवेदं जगत्सर्वं
    ज्ञातं येन महात्मना । यदृच्छया वर्तमानं तं निषेद्धुं क्षमेत कः ॥ ॥ आब्रह्मस्तम्बपर्यन्ते भूतग्रामे
    चतुर्विधे । विज्ञस्यैव हि सामर्थ्यमिच्छानिच्छाविवर्जने ॥ ॥ आत्मानमद्वयं कश्चिज्जानाति जगदीश्वरम् ।
    यद् वेत्ति तत्स कुरुते न भयं तस्य कुत्रचित् ॥
