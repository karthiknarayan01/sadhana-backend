id: shyamala
category: stotram
name:
  english: shyamala
  devanagari: श्यामल
content:
  english: panipadmadvayenakshamalamapi sphatikim jnanasaratmakam pustakam caparenankusham pashamabibhrati
    yena sancintyase cetasa tasya vaktrantarat gadyapadyatmika bharati nissaret ||
  devanagari: पाणिपद्मद्वयेनाक्षमालामपि स्फाटिकीं ज्ञानसारात्मकं पुस्तकं चापरेणाङ्कुशं पाशमाबिभ्रती येन
    सञ्चिन्त्यसे चेतसा तस्य वक्त्रान्तरात् गद्यपद्यात्मिका भारती निस्सरेत् ॥
meaning: {}
