id: bhagavadgita-parayana-gita-mahatmyam
category: stotram
name:
  english: Bhagavadgita Parayana - Gita Mahatmyam
content:
  english: atha gitamahatmyam dharovaca bhagavan parameshana bhaktiravyabhicarini | prarabdham bhujyamanasya
    katham bhavati he prabho || || shrivishnuruvaca prarabdham bhujyamano hi gitabhyasaratah sada | sa
    muktah sa sukhi loke karmana nopalipyate || || mahapapadipapani gitadhyanam karoti cet | kvacitsparsham
    na kurvanti nalinidalamambuvat || || gitayah pustakam yatra yatra pathah pravartate | tatra sarvani
    tirthani prayagadini tatra vai || || sarve devashca rishayah yoginah pannagashca ye | gopala gopika
    va'pi naradoddhavaparshadaih || || sahayo jayate shighram yatra gita pravartate | yatra gitavicarashca
    pathanam pathanam shrutam | tatraham nishcitam prithvi nivasami sadaiva hi || || gitashraye'ham tishthami
    gita me cottamam griham | gitajnanamupashritya tri~llokan || gita me parama vidya brahmarupa na samshayah
    | ardhamatrakshara nitya svanirvacyapadatmika || || cidanandena krishnena prokta svamukhato'rjunam
    | vedatrayi parananda tattvarthajnanasamyuta || || yo'shtadasham japennityam naro nishcalamanasah
    | jnanasiddhim sa labhate tato yati param padam || || pathe'samarthah sampurne tato'rdham pathamacaret
    | tada godanajam punyam labhate natra samshayah || || tribhagam pathamanastu gangasnanaphalam labhet
    | shadamsham japamanastu somayagaphalam labhet || || èkadhyayam tuyo nityam pathate bhaktisamyutah
    | rudralokamavapnoti gano bhutva vasecciram || || adhyayam shlokapadam va nityam yah pathate narah
    | sa yati naratam yavat manvantaram vasundhare || || gitayah shlokadashakam sapta panca catushtayam
    | dvautrinekam tadardham va shlokanam yah pathennarah || || candralokamavapnoti varshanamayutam dhrivam
    | gitapathasamayuktah mrito manushatam vrajet || || gitabhyasam punah kritva labhate muktimuttamam
    | gitetyuccarasamyuktah mriyamano gatim labhet || || gitarthashravanasaktah mahapapayuto'pi va | vaikuntham
    samavapnoti vishnuna sahamodate || || gitartham dhyayate nityam kritva karmani bhurishah | jivanmuktah
    sa vijneyah dehante paramam padam || || malanirmocanam pumsam jalasnanam dine dine | sakridgitambhasi
    snanam samsaramalanashanam || || gitamashritya bahavah bhubhujo janakadayah | nirdhutakalmasha loke
    gita yatah param padam || || te shrinvanti pathantyeva gitashastramaharnisham | na te vai manusha
    jneya deva eva na samshayah || || jnanajnanakritam nityam indriyairjanitam ca yat | tatsarvam nashamayati
    gitapathena takshanam || || dhik tasya jnanamacaram vratam ceshtam tapo yashah | gitarthapathanam
    na'sti nadhamastatparo janah || || samsarasagaram ghoram tartumicchati yo janah | gitanavam samaruhya
    param yati sukhena sah || || gitayah pathanam kritva mahatmyam naiva yah pathet | vritha patho bhavettasya
    shrama eva hyudahritah || || etanmahatmyasamyuktam gitabhyasam karoti yah | sa tatphalamavapnoti durlabham
    gatimapnuyat || || suta uvaca mahatmyametadgitayah maya proktam sanatanam | gitante ca pathedyastu
    yaduktam tatphalam bhavet || || iti shri varahapurane shri gitamahatmyam sampurnam || om shantih shantih
    shantih ||
  devanagari: अथ गीतामाहात्म्यं धरोवाच भगवन् परमेशान भक्तिरव्यभिचारिणी । प्रारब्धं भुज्यमानस्य कथं भवति
    हे प्रभो ॥ ॥ श्रीविष्णुरुवाच प्रारब्धं भुज्यमानो हि गीताभ्यासरतः सदा । स मुक्तः स सुखी लोके कर्मणा
    नोपलिप्यते ॥ ॥ महापापादिपापानि गीताध्यानं करोति चेत् । क्वचित्स्पर्शं न कुर्वन्ति नलिनीदलमम्बुवत्
    ॥ ॥ गीतायाः पुस्तकं यत्र यत्र पाठः प्रवर्तते । तत्र सर्वाणि तीर्थानि प्रयागादीनि तत्र वै ॥ ॥ सर्वे
    देवाश्च ऋषयः योगिनः पन्नगाश्च ये । गोपाला गोपिका वाऽपि नारदोद्धवपार्षदैः ॥ ॥ सहायो जायते शीघ्रं यत्र
    गीता प्रवर्तते । यत्र गीताविचारश्च पठनं पाठनं श्रुतम् । तत्राहं निश्चितं पृथ्वि निवसामि सदैव हि ॥
    ॥ गीताश्रयेऽहं तिष्ठामि गीता मे चोत्तमं गृहम् । गीताज्ञानमुपाश्रित्य त्रीँल्लोकान् ॥ गीता मे परमा
    विद्या ब्रह्मरूपा न संशयः । अर्धमात्राक्षरा नित्या स्वानिर्वाच्यपदात्मिका ॥ ॥ चिदानन्देन कृष्णेन प्रोक्ता
    स्वमुखतोऽर्जुनम् । वेदत्रयी परानन्दा तत्त्वार्थज्ञानसंयुता ॥ ॥ योऽष्टादशं जपेन्नित्यं नरो निश्चलमानसः
    । ज्ञानसिद्धिं स लभते ततो याति परं पदम् ॥ ॥ पाठेऽसमर्थः सम्पूर्णे ततोऽर्धं पाठमाचरेत् । तदा गोदानजं
    पुण्यं लभते नात्र संशयः ॥ ॥ त्रिभागं पठमानस्तु गङ्गास्नानफलं लभेत् । षडंशं जपमानस्तु सोमयागफलं लभेत्
    ॥ ॥ ऎकाध्यायं तुयो नित्यं पठते भक्तिसंयुतः । रुद्रलोकमवाप्नोति गणो भूत्वा वसेच्चिरम् ॥ ॥ अध्यायं श्लोकपादं
    वा नित्यं यः पठते नरः । स याति नरतां यावत् मन्वन्तरं वसुन्धरे ॥ ॥ गीतायाः श्लोकदशकं सप्त पञ्च चतुष्टयम्
    । द्वौत्रीनेकं तदर्धं वा श्लोकानां यः पठेन्नरः ॥ ॥ चन्द्रलोकमवाप्नोति वर्षाणामयुतं धृवम् । गीतापाठसमायुक्तः
    मृतो मानुषतां व्रजेत् ॥ ॥ गीताभ्यासं पुनः कृत्वा लभते मुक्तिमुत्तमम् । गीतेत्युच्चारसंयुक्तः म्रियमाणो
    गतिं लभेत् ॥ ॥ गीतार्थश्रवणासक्तः महापापयुतोऽपि वा । वैकुण्ठं समवाप्नोति विष्णुना सहमोदते ॥ ॥ गीतार्थं
    ध्यायते नित्यं कृत्वा कर्माणि भूरिशः । जीवन्मुक्तः स विज्ञेयः देहान्ते परमं पदम् ॥ ॥ मलनिर्मोचनं पुंसां
    जलस्नानं दिने दिने । सकृद्गीताम्भसि स्नानं संसारमलनाशनम् ॥ ॥ गीतामाश्रित्य बहवः भूभुजो जनकादयः । निर्धूतकल्मषा
    लोके गीता याताः परं पदम् ॥ ॥ ते शृण्वन्ति पठन्त्येव गीताशास्त्रमहर्निशम् । न ते वै मानुषा ज्ञेया देवा
    एव न संशयः ॥ ॥ ज्ञानाज्ञानकृतं नित्यं इन्द्रियैर्जनितं च यत् । तत्सर्वं नाशमायाति गीतापाठेन तक्षणम्
    ॥ ॥ धिक् तस्य ज्ञानमाचारं व्रतं चेष्टां तपो यशः । गीतार्थपठनं नाऽस्ति नाधमस्तत्परो जनः ॥ ॥ संसारसागरं
    घोरं तर्तुमिच्छति यो जनः । गीतानावं समारुह्य पारं याति सुखेन सः ॥ ॥ गीतायाः पठनं कृत्वा माहात्म्यं
    नैव यः पठेत् । वृथा पाठो भवेत्तस्य श्रम एव ह्युदाहृतः ॥ ॥ एतन्माहात्म्यसंयुक्तं गीताभ्यासं करोति यः
    । स तत्फलमवाप्नोति दुर्लभां गतिमाप्नुयात् ॥ ॥ सूत उवाच माहात्म्यमेतद्गीतायाः मया प्रोक्तं सनातनम्
    । गीतान्ते च पठेद्यस्तु यदुक्तं तत्फलं भवेत् ॥ ॥ इति श्री वराहपुराणे श्री गीतामाहात्म्यं सम्पूर्णम्
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
