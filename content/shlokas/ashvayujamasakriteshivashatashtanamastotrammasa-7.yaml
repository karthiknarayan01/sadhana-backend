id: ashvayujamasakriteshivashatashtanamastotrammasa-7
category: stotram
name:
  english: ashvayujamasakriteshivashatashtanamastotrammasa 7
  devanagari: अश्वायुजमासकृतेशिवशताष्टनामस्तोत्रम्मास ७
content:
  english: tryambakayambikabhartre shambarankadharaya ca | namo vanyaya phenyaya manyaya ca namonamah
    || 51|| namo bhavaya bhavyaya bhavanayodbhavaya ca | anantabalaviryaya bhutanam pataye namah || 52||
    samhartre catha sharvaya avyathaya vyathaya ca | gangasaliladharaya adharaya gunatmane || 53|| kandarpadarpaghataya
    medhyaya ca sushilpine | vatacakrapravrittaya kratunam prabhave namah || 54|| kratupujyaya idyaya
    sajjamanaya te namah | shankaraya vrishankaya gananam pataye namah || 55|| dandahastaya kalaya pashahastaya
    te namah | sahamanaya shantaya cakrapraharanaya ca || 56|| trayimayaya satraya suhotraya kapardine
    | vedatantrapradhanaya shatajihvaya vedhase || 57|| ganapriyaya tushtaya vaidyutaya prabhavate | dharadharaya
    paraya suparaya ranaya ca || 58|| janjapukaya dharmaya damshtrine ghoshine namah | vicaraya harayatha
    ghoraya pashupaya ca || 59|| uragabharanayatha duragayamaraya ca | karandhamaya dhaumyaya sharmavarmakaraya
    ca || 60|| gahvareshtaya shishtaya vishishtayakshataya ca | urugavyaya sevyaya urvaryaya garaya ca
    || 61|| stavaya stava
  devanagari: त्र्यम्बकायाम्बिकाभर्त्रे शम्बराङ्कधराय च । नमो वन्याय फेन्याय मान्याय च नमोनमः ॥ ५१॥ नमो
    भवाय भव्याय भावनायोद्भवाय च । अनन्तबलवीर्याय भूतानां पतये नमः ॥ ५२॥ संहर्त्रे चाथ शर्वाय अव्यथाय व्यथाय
    च । गङ्गासलिलधाराय आधाराय गुणात्मने ॥ ५३॥ कन्दर्पदर्पघाताय मेध्याय च सुशिल्पिने । वातचक्रप्रवृत्ताय
    क्रतूनां प्रभवे नमः ॥ ५४॥ क्रतुपूज्याय ईड्याय सज्जमानाय ते नमः । शङ्कराय वृषाङ्काय गणानां पतये नमः
    ॥ ५५॥ दण्डहस्ताय कालाय पाशहस्ताय ते नमः । सहमानाय शान्ताय चक्रप्रहरणाय च ॥ ५६॥ त्रयीमयाय सत्राय सुहोत्राय
    कपर्दिने । वेदतन्त्रप्रधानाय शतजिह्वाय वेधसे ॥ ५७॥ गानप्रियाय तुष्टाय वैद्युताय प्रभावते । धाराधराय
    पाराय सुपाराय रणाय च ॥ ५८॥ जञ्जपूकाय धर्माय दंष्ट्रिणे घोषिणे नमः । विचाराय हरायाथ घोराय पशुपाय च
    ॥ ५९॥ उरगाभरणायाथ दूरगायामराय च । करन्धमाय धौम्याय शर्मवर्मकराय च ॥ ६०॥ गह्वरेष्टाय शिष्टाय विशिष्टायाक्षताय
    च । उरुगव्याय सेव्याय उर्वर्याय गराय च ॥ ६१॥ स्तवाय स्तव
