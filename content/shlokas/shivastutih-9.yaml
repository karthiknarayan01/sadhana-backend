id: shivastutih-9
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: rinu || 59|| gitavaditrabahulairapsarogananartanaih | gandhasraganuliptango divyabharanabhushitah
    || 60|| kancanena vimanena yati shambhorvaralayam | capasthite divanathe tasminnushasi pujanam ||
    61|| mama devi priyakaram sada lingarcanam mama | samudgannam ghritaktam ca nivedya parameshvare ||
    62|| yavanmasam visheshena pujanam tatra shasyate | shatavarsheshu ya puja mosenoshasi sa dhruvam
    || 63|| tatphalam labhate gauri tasmin masi visheshatah | cape raudrarkshake devi paurnamyam shashishekharam
    || 64|| nartamanam trayinetram krishanuvarahastakam | tvaya yuktam visheshena shashibhushanamishvaram
    || 65|| sampujya snapayeddevamabhishecanakakramaih | gandham sugandhamalipya dhupadipasumaih shive
    || 66|| naivedyaih phalamulaishca havisha'pupasamyutam | drishtva pramucyate papairbuddhipurvam kritairapi
    || 67|| pundarikapure vapi pashyennrityantamishvaram | raudrarkshe capasamyukte masyasmin purnimatithau
    || 68|| snatva'tha shivagangayam pashyeddevam pinakinam | brahmahatyadibhirmukto bhakto muktim ca
    vindati || 69|| || iti shivarahasyantargate ishvaraproktam margashirshamasakrite shivastutih sampurna
    ||
  devanagari: ृणु ॥ ५९॥ गीतवादित्रबहुलैरप्सरोगणनर्तनैः । गन्धस्रगनुलिप्ताङ्गो दिव्याभरणभूषितः ॥ ६०॥ काञ्चनेन
    विमानेन याति शम्भोर्वरालयम् । चापस्थिते दिवानाथे तस्मिन्नुषसि पूजनम् ॥ ६१॥ मम देवि प्रियकरं सदा लिङ्गार्चनं
    मम । समुद्गान्नं घृताक्तं च निवेद्य परमेश्वरे ॥ ६२॥ यावन्मासं विशेषेण पूजनं तत्र शस्यते । शतवर्षेषु
    या पूजा मोसेनोषसि सा ध्रुवम् ॥ ६३॥ तत्फलं लभते गौरि तस्मिन् मासि विशेषतः । चापे रौद्रर्क्षके देवि
    पौर्णम्यां शशिशेखरम् ॥ ६४॥ नर्तमानं त्रयीनेत्रं कृशानुवरहस्तकम् । त्वया युक्तं विशेषेण शशिभूषणमीश्वरम्
    ॥ ६५॥ सम्पूज्य स्नापयेद्देवमभिषेचनकक्रमैः । गन्धं सुगन्धमालिप्य धूपदीपसुमैः शिवे ॥ ६६॥ नैवेद्यैः फलमूलैश्च
    हविषाऽपूपसंयुतम् । दृष्ट्वा प्रमुच्यते पापैर्बुद्धिपूर्वं कृतैरपि ॥ ६७॥ पुण्डरीकपुरे वापि पश्येन्नृत्यन्तमीश्वरम्
    । रौद्रर्क्षे चापसंयुक्ते मास्यस्मिन् पूर्णिमातिथौ ॥ ६८॥ स्नात्वाऽथ शिवगङ्गायां पश्येद्देवं पिनाकिनम्
    । ब्रह्महत्यादिभिर्मुक्तो भक्तो मुक्तिं च विन्दति ॥ ६९॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं मार्गशीर्षमासकृते
    शिवस्तुतिः सम्पूर्णा ॥
