id: renukastotramvinayakashastri
category: stotram
name:
  english: renukastotramvinayakashastri
  devanagari: रेणुकास्तोत्रम्विनायकशास्त्रि
content:
  english: kiritakulasankulam parimala'lamanghryutpalam | manolirayamumadah sapadi te'nujighranmanak tadanyasumanassu
    kim vrajati nadhuna tatsmaran || bhajantu vishayan sajurvishayino vishanivate rasarasikamaulina mama
    mano'linanyakkritah | shrutam tadavalokitam bhavatu tatsprishan jighrata rasalapadapankajam janani
    te sada svadyatam || vijitya hridupasthito muhurupasthitanandakam vishuddhimupasamharan viramatabhavadbhaktishu
    | gira bhajatu nama te karaghritarcanopaskaram prayatu tava mandiram visrijatu tvadanyadaram || mumoca
    kila mam prasuh rathavidagraniragraja pita'pi dayito'grajah para ihashrayo yasya me | shraye'hamadhunehakam
    vrajina
  devanagari: किरीटकुलसङ्कुलं परिमलाऽलमङ्घ्र्युत्पलम् । मनोलिरयमुमदः सपदि तेऽनुजिघ्रन्मनाक् तदन्यसुमनस्सु
    किं व्रजति नाधुना तत्स्मरन् ॥ भजन्तु विषयान् सजूर्विषयिणो विषाणीवते रसारसिकमौलिना मम मनोऽलिनान्यक्कृताः
    । श्रुतं तदवलोकितं भवतु तत्स्पृशन् जिघ्रता रसालपदपङ्कजं जननि ते सदा स्वाद्यताम् ॥ विजित्य हृदुपस्थितो
    मुहुरुपस्थितानन्दकम् विशुद्धिमुपसंहरन् विरमताभवद्भक्तिषु । गिरा भजतु नाम ते करघृतार्चनोपस्करम् प्रयातु
    तव मन्दिरं विसृजतु त्वदन्यादरम् ॥ मुमोच किल मां प्रसूः रथविदग्रणीरग्रजा पिताऽपि दयितोऽग्रजः पर इहाश्रयो
    यस्य मे । श्रयेऽहमधुनेहकं व्रजिन
meaning: {}
