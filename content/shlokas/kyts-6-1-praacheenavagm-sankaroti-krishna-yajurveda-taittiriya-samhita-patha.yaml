id: kyts-6-1-praacheenavagm-sankaroti-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.1 Praacheenavagm Sankaroti - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande prathamah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || pracinavagmsha nkaroti devamanushya disho vyabhajanta praci ndeva
    dakshina pitarah pratici mmanushya udicigm rudra ya nkaroti devalokameva ta dyajamana upavartate pari
    shrayatyantar hitohi devaloko manushyaloka thsvetavyamivetyahuh ko hi ta 'sti va na veti dikshvati
    kashan karo dikshvati kashan karoti rabhijityai keshashmashru vapate nakhani ni krintate mrita va
    esha tvagameddhya ya tkeshashmashru mritameva tvacama meddhyamapahatya yajniyo bhutva medhamupaityangirasa
    kshatapasi praveshayannaphsu snati sakshadeva di kshatapasi ava rundhe tirthe snati tirthe hi te ta
    tirthameva samanana 'shnatyantarata eva meddhyo bhavati vasasa dikshayati saumyam ndevataya somamesha
    devatamupaiti yo dikshate somasya tanurasi tanuva mme pahityaha svameva devatamupaityatho ashishamevaitama
    sha ste 'gnestushadhanam mpracinatano vishvesha ndevanamotu rnakshatrana dvasasa dikshayati sarvabhirevaina
    rdikshayati bahihprano vai manushyasta 'shnati saprana eva di kshata ashito bhavati yavanevasya pranastena
    saha medhamupaiti ghrita ya~nnavanitenabhyankte sarva eva devatah prinati pracyuto va esho 'smallokadagato
    devalokam nnavanitenabhyankte 'nulomam ya~jusha vyavrittya indro vritramaha ntasya kaninika para bhavadyadankte
    cakshureva bhratrivyasya vrinkte dakshina mmanushya anjate na ni dhavate niva hi manushya dhavante
    panca kritva a kshara panktih pankto yajno yajnamevava rundhe parimitamankte 'parimitagm hi manushya
    anjate satulaya 'patulaya hi manushya anjate vyavrittyai yadapatulayanjita vajra iva sya ''nkte mitratvaye
    ndro vritramahan ya~jniyagm sadevamasi tte darbha abhavan yaddarbhapunjilaih pavayati ya eva meddhya
    yajniya ssadeva apastabhirevaina horatrabhyamevaina mpavayati tribhih pavayati traya ime loka ebhirevainam
    lo~kaih pavayati pancabhih kshara panktih pankto yajno yajnayaivaina mpavayati shadbhih pavayati shadva
    ritava ritubhirevaina mpavayati saptabhih pavayati sapta chandagmsi chandobhirevaina mpavayati navabhih
    pavayati nava vai purushe prana mpavayatyekavigmshatya pavayati dasha hastya angulayo dasha padya
    atmaikavigmsho yavaneva purushasta pavayati citpatistva mpavayati citpatistva punatvityaha mano vai
    citpatirmanasaivaina mpavayati vakpatistva punatvityaha vacaivaina mpavayati devastva savita punatvityaha
    savitriprasuta evaina mpavayati tasya te pavitrapate pavitrena yasmai ka mpune tacchakeyamitya atikashan
    karotya mashtacatvarigmshacca yavanto vai deva yajnayapunata ta evabhavan yajnaya punite bhavatyeva
    bahih pavayitva 'ntah pra padayati manushyaloka evaina ssruvena catasro juhoti dikshitatvaya sruca
    pancami kshara panktih pankto yajno yajnamevava rundha aku tya hi purusho yajnamabhi prayunkte yajeyeti
    medhayai manase 'gnaye svahetyaha medhaya hi manasa purusho yajnamabhigacchati sarasvatyai pushne
    'gnaye svahetyaha vagvai sarasvati prithivi pusha vacaiva prithivya yajna mprayunkta apo devi rvishvashambhuva
    ityaha ya vai var lo~kama gaccheyurapo devi rvishvashambhuva ityahasma evaina lokaya shamayati tasma
    lo~kama gacchanti dyavaprithivi ityaha dyavaprithivyor hi yajna urvantariksha mityahantarikshe hi
    yajno brihaspatirno havisha vridha tvityaha brahma vai devana rbrahmanaivasmai yajnamava rundhe yad
    dvidheriti yajnasthanumricche dvridhatvityaha yajnasthanumeva pari vrinakti prajapati thsa pra yajuravlina
    tpra sama tamrigudayaccha juhoti yajnasyodyatya juhoti yajnasyodyatya anushtup hustasmadanushtubha
    juhoti yajnasyodyatyai dvadasha vathsabandhanyudayaccha rvathsabandhavido dikshayanti sa va esharganushtug
    yadetayarca dikshayati vacaivainagm sarvaya dikshayati vishve devasya neturityaha savitryetena marto
    vrinita sakhya mityaha pitridevatyaitena vishve raya ishuddhyasityaha vaishvadevyetena dyumnam vri~nita
    pushyasa ityaha paushnyetena sa va esharkhsarvadevatya yadetayarca dikshayati sarvabhirevaina ndevatabhirdikshayati
    saptakshara mpadamashtaksharani trini yani trini tanyashtavupa yanti yani catvari tanyashtau yadashtakshara
    tena gayatri yadekadashakshara gayatri yadekadashakshara tena trishtugya ddvadashakshara tena jagati
    sa va esharkhsarvani chandagmsi yadetayarca dikshayati sarvebhirevaina nchandobhirdikshayati saptakshara
    mpadagm saptapada shakvari pashava shshakvari pashunevava rundha ekasmadaksharadana ntanmanushya upa
    jivanti purnaya juhoti purna iva hi prajapatih prajapateraptyai nyunaya juhoti nyunaddhi prajapatih
    praja asrijata prajanagm srishtyai khsame vai devebhyo yajnaya 'tishthamane krishno rupa va~ ime upavarthsyata
    mbhavishyatiti te upamantrayanta te ahoratrayo mapanidhaya devanupavartetamesha va rico varno yacchukla
    nkrishnajinasyaisha samno ya tkrishnamrikhsamayo stha ityaharkhsame eva va ahno varno yacchukla nkrishnajinasyaisha
    ratriya ya ya~devainayostatra nyakta ntadevava rundhe krishnajinena dikshayati brahmano va eta ndhiyagm
    shikshamanasya devetyaha yathayajurevaita va~sah prornute tasma dgarbhah pravrita jayante na pura
    somasya krayadapo tpura somasya krayadapornvita garbhah ssyuh krite some rnute jayata eva tadatho
    yatha vasiyagm sa mpratyapornute tadrigeva tadangirasa vya~bhajanta tato yadatyashishyata te shara
    abhavannurgvai shara yaccharamayi mekhala bhavatyurjamevava rundhe maddhyata ssannahyati maddhyata
    evasma urja nmaddhyata urja bhunjata urdhvam vai~ purushasya nabhyai meddhya ssanamhyati meddhya ncaivasyameddhya
    nca vyavartayatindro vritraya vajra thsphyastritiyagm rathastritiyam ryanta te shara abhava ntaccharanagm
    sharatvam tkhalu vai manushyasya bhratrivyo yaccharamayi mekhala bhavati vajrenaiva saksha dbhavati
    trivridvai pranastrivritameva prana mmaddhyato yajamane dadhati prithvi bhavati rajjunam vya~vrityai
    mekhalaya yajamana ndikshayati yoktrena patni yajno dakshinamabhyaddhyaya 'manyata yo va ito janishyate
    sa ida ttasya indra evajayata so 'manyata yo vai madito 'paro janishyate sa ida mbhavishyatiti tasya
    anumrishya yonima tagm haste nyaveshtayata tagm haste nyaveshtayata ta 'bhavadindrasya yonirasi ma
    ma higmsiriti krishnavishana mpra yacchati sayonimeva yajna ndakshinagm sayonimindragm sayonitvaya
    krishyai tva susasyaya ityaha tasmadakrishtapacya oshadhayah pacyante supippalabhya stvaushadhibhya
    ityaha tasmadoshadhayah phala ngrihnanti yaddhastena mbhavukah krishnavishanaya kanduyate 'pigrihya
    smayate prajana ngopithaya na pura dakshinabhyo netoh krishnavishanamava critedya tpura dakshinabhyo
    netoh mparapatuka syannitasu dakshinasu catvale krishnavishana mprasyati yonirvai yajnasya catvalam
    yo~nih krishnavishana yonaveva yoni ndadhati yajnasya sayonitvaya || 'shtacatvarigmshacca vagvai devebhyo
    'pa dyajnayatishthamana sa vanaspati thsaisha vagvanaspatishu vadati ya dundubhau ya tunave ya vinayam
    mprayacchati vacamevava rundha audubamro bhavatyurgva udubamra urjamevava rundhe mukhena sammito bhavati
    mukhata evasma urja nmukhata urja bhunjate krite some maitravarunaya danda mpra yacchati maitravaruno
    hi purasta dritvigbhyo vacam vi~bhajati tamritvijo yajamane prati shthapayanti svaha yajna mmanasetyaha
    manasa hi purusho yajnamabhigacchati svaha dyavaprithivibhya mityaha dyavaprithivyor dityahantarikshe
    hi yajna va~tada rabha ityaha ~vava yah pavate sa yajnastameva sakshada rabhate mushti karoti vacam
    ya~cchati yajnasya dhritya adi hmana iti trirupagshvaha devebhya evaina ''ha triruccairubhaye ndevamanushyebhyah
    pra ''ha na pura nakshatrebhyo vacam dyatpura nakshatrebhyo vacam duditeshu nakshatreshu vrata vi~
    srijati yajnavrato vai di kshito yajnamevabhi vacam vi~ srijati yadi visrije shnavimricamanu bruya
    dyajno vai vishnuryajnenaiva yajnagm sa mmanamaha ityaha yajnameva tanmradayati supara no asadvasha
    ityaha vyushtimevava rundhe brahmavadino vadanti brahmavadino vadanti hotavya ndikshitasya griha dyajamanasyavadaya
    juhuya dyajnaparurantariyadye deva manojata manoyuja ityaha prana vai deva manojata manoyujasteshveva
    paroksha njuhoti tanneva huta kshitagm rakshagmsi jighagmsantyagnih 'gne tvagm su jagrihi vayagm su
    mandishimahityahagni nkritva svapiti rakshasamapahatya avratyamiva va esha karoti yo di ssvapiti tvamagne
    vratapa asityahagnirvai devanam ya~ti deva a martyeshvetyaha devo ya~jneshvidya ityahaitagm hi yajneshvidate
    thsushupusha indriya kramanti vishve deva abhi mama dyavata eva pashunabhi diksheta tavanto 'sya pashavah
    syu rasveya pashavah syu rasveyat '' bhuyo bharetyaha parimitaneva pashunava rundhe candramasi mama
    bhogaya bhavetyaha yathadevatamevainah prati grihnati vayave tva varunaya tveti yadevameta nanudishedayathadevata
    ndakshina gamayeda devata bhyo vrishcyeta yadevameta anudishati yathadevatameva dakshina gamayati
    na devata vrishcyate devirapo vrishcyate devirapo apa nnapadityaha yadvo meddhyam ya~jniyagm sadeva
    'va kramishamiti vavaitadahacchinna mprithivya anu geshamityaha setumeva kritva maddhyavasaya disho
    na prajana ntvaya pra janama tvayeti te 'dityagm samaddhrayanta tvaya pra janameti sa vri~nai matprayana
    eva vo yajna madudayana asanniti tasmadadityah prayaniyo yajnanamaditya udayaniyah panca devata yajati
    panca disho disha kshara panktih pankto yajno yajnamevava rundhe pathyag svastimayaja npracimeva taya
    disha mprajanannagnina dakshina somena praticigm savitrodici mpathyag svastim ~yajati pracimeva taya
    disha mpra janati pathyag svastimishtva 'gnishomau yajati cakshushi va ete yajnasya yadagnishomau
    tabhyamevanu pashya vishtva savitaram ya~jati savitriprasuta evanu pashyati savitaramishtva va~ aditirasyameva
    pratishthayanu pashyatyaditimishtva marutimricamanvaha maruto vai devanam mmanushyavishamanu kalpate
    ya nmarutimricamanvaha visha brahmavadino vadanti prayajavadananuyaja mitime vai prayaja ami anuyaja
    ssaiva sa yajnasya santatista ttatha na karyamatma vai prayajah praja nantariyadatmanama tprajamantariyadyatah
    khalu vai yajnasya vitatasya na kriyate tadanu yajnah para bhavati yajna para bhavati prayajavadeva
    mprayajavadanuyajava ''tmanamantareti na praja nna yajnah parabhavati na yajamanah prayaniyasya nishkasa
    udayaniyamabhi nirvapati saiva sa yajnasya santatiryah prayaniyasya yajya ya tta udayaniyasya yajyah
    ssyadyah prayaniyasya puro sta udayaniyasya yajyah karotyasminneva loke prati tishthati || kadrushca
    vai suparni ca ''tmarupayoraspardhetagm sa kadru ttritiyasyamito divi somastama hara tena nnishkrinishvetiyam
    vai~ kadrurasau suparni chandagmsi sauparneya ssabravidasmai vai pitarau putra stritiyasyamito divi
    somastama hara tena ti ma kadruravocaditi jagatyudapata ccaturdashakshara sati sa 'pra pya nyavartata
    tasyai dve akshare amiyetagm sa pashubhishca dikshaya ca ttasmajjagati chandasa ndikshopa namati trishtugudapata
    ttrayodashakshara sati sa 'pra pya nyavartata tasyai dve akshare amiyetagm sa dakshinabhishca ttrishtubho
    loke maddhyandine savane dakshina niyanta eta tkhalu vava tapa ityahurya ndadatiti gayatryudapataccaturakshara
    satyajaya jyotisha tamasya aja 'bhyarundha tadajaya ajatvagm sa soma ''haraccatvari caksharani sa
    'shtakshara samapadyata brahmavadino vadanti brahmavadino vadanti dgayatri kanishtha chandasagm sati
    yajnamukha mpariyayeti yadevada ttejasvinitama padbhya ndve savane samagrihna ya~nmukhena samagrihna
    ddve savane shukravati pratassavana ttritiya savana rijishamabhi shunvanti dhitamiva hi manyanta ashiramava
    nayati sashukratvayatho sa ngandharvo vishvavasah paryamushna thsa tisro ratrih parimushito ssomo
    vasati te deva abruvan thstrikama vai gandharva sstriya nishkrinameti te vacagg striyamekahayani nkritva
    taya nirakrinan nkritva gandharvebhyo drohito janma te deva abruvannapa yushmadakrami pavartate vi
    hvayamaha iti brahma gandharva avadannagaya ngayata upavartata tasma dgayantagg striyah kamayante
    kamuka enagg striyo bhavanti ya evam vi~dvanapi janyeshu bhavati tebhya eva dadatyuta ya bhavantyekahayanya
    krinati vacaivainagm sarvaya krinati tasmadekahayana manushya vacam va~dantyakutaya 'karnaya ' kanayashlonaya
    'saptashaphaya krinati sarvayaivaina nkrinati yacchvetaya ddushcarma yajamana tpramayuko yajamana
    ddvirupaya vartraghni sya 'nyo jiniyadarunaya pingakshya krinatyetadvai somasya rupagg ndevataya krinati
    || ttasmadadbhyo hiranya mpunanti brahmavadino vadanti kasma thsatyadanasthikena prajah praviyante
    'sthanvati rjayanta iti yaddhiranya 'vadhaya juhoti tasmadanasthikena prajah pra viyante 'sthanvati
    rjayanta etadva agneh priya ntejo hiranyamiyante shukra tanuridam va~rca ityaha satejasamevainagm
    satanu ssyurbaddhamava dadhati garbhana ndhrityai nishtarkya mbaddhnati prajana mprajananaya vagva
    esha ya thsomakrayani jurasityaha yaddhi manasa javate ta dvaca vadati dhrita manasetyaha manasa hi
    vagdhrita jushta vishnava ityaha yajno vai vishnu ryajnayaivaina ste satyasavasah prasava ityaha savitri
    prasutameva vacamava rundhe kandekande vai kriyamane yajnagm rakshagmsi jighagmsantyesha khalu va
    arakshohatah pantha yo 'gneshca suryasya ca suryasya cakshura 'ruhamagnerakshnah kaninikamityaha ya
    evarakshohatah panthastagm samarohati thsomakrayani cidasi mana 'sityaha shastyevainameta cchishtah
    praja jayante cidasityaha yaddhi manasa cetayate ta 'sityaha yaddhi manasa tkaroti dhirasityaha yaddhi
    manasa dhyayati ta 'sityaha dakshina hyesha yajniya 'sityaha yajniyamevaina nkaroti kshatriyasityaha
    kshatriya hyesha 'ditirasyubhayatashshir ''dityah prayaniyo yajnanamaditya udayaniya stasmadevamaha
    yadabaddha syadayata syadya tpramayuko yajamana tkarnagrihita vartraghni sya 'nyo jiniyanmitrastva
    padi baddhnatvityaha mitro vai shivo devana mpadi baddhnati pusha 'ddhvanah patvityaheyam vai~ pushemamevasya
    adhipamaka ssamashtya indraya ddhyakshayetyahendramevasya addhyaksha tyanu tva mata manyatamanu pitetyaha
    numatayaivainaya krinati sa devi devamacchehityaha devi hyesha deva ssoma indraya somamityahendraya
    hi soma ahriyate yadeta cyeva somakrayaniya '' vartayatvityaha rudro vai kruro ntamevasyai parasta
    ddadhatyavrittyai kruramiva va eta drudrasya kirtayati mitrasya pathetyaha shantyai vaca va esha vi
    krinite ya ssomakrayanya svasti somasakha punarehi saha rayyetyaha vacaiva vikriya punaratman vaca
    'sya vagbhavati ya evam shat padanyanu ni kramati shadaham va~nnati vadatyuta sam va~thsarasyayane
    yavatyeva vaktamava rundhe saptame pade juhoti saptapada shakvari pashava shshakvari pashunevava rundhe
    sapta gramyah pashavah sapta varuddhyai vasvyasi rudra 'sityaha rupamevasya eta vyacashte brihaspatistva
    ~vyacashte brihaspatistva sumne ranvatvityaha brahma vai devana rbrahmanaivasmai pashunava rundhe
    rudro vasubhira ciketvityaha ''vrittyai prithivyastva murdhanna jigharmi devayajana ityaha prithivya
    hyesha murdha ya ddevayajanamidayah pada ityahedayai hyeta thsomakrayanyai ghritavati svahe tyaha
    yadevasyai pada dyata tasmadevamaha yadaddhvaryuranagnavahuti drakshagmsi yajnagm hanyurhiranyamupasya
    juhotyagnivatyeva juhoti nandho 'ddhvaryu rbhavati na yajnagm rakshagmsi ghnanti kandekande vai kriyamane
    yajnagm rakshagmsi jighagmsanti parilikhitagm rakshah parilikhita arataya ityaha rakshasa idamahagm
    rakshaso griva api krintami yo ndvishma ityaha dvau vava purushau ya ncaiva dveshti yashcaina ngrivah
    krintati pashavo vai somakrayanyai padam va~pati pashunevava rundhe 'sme raya iti sam ~vapatyatmana
    pashubhyo nantareti tve raya iti yajamanaya pra yacchati yajamana eva rayi ndadhati tote raya iti
    patniya ardho va esha atmano ya tpatni yatha griheshu nidhatte tadrigeva ta ttvashtimati te sapeyetyaha
    tvashta vai pashuna mmithunanagm rupakri drupameva pashushu dadhatyasmai vai lokaya gar hapatya a
    dhiyate 'mushma ahavaniyo ya hapatya upavapedasmin ~loke pashaman dyadahavaniye 'mushmin ~loke pashuman
    thsyadubhayorupa vapatyubhayorevainam brahmavadino vadanti vicitya iti somo va oshadhinagm raja tasmin
    ngrasitamevasya ta nnishkhidati tadrigeva tadyanna vicinuya dyatha 'kshannapannam vi~dhavati tadrigeva
    ta tkshodhuko 'ddhvaryu tkshodhuko yajamana thsomagm shodhayetyeva bruya mubhayenaiva somavikrayina
    thsomavikrayi kshodhuko 'runo ha sma ntritiya savanamava rundha iti pashuna nmimite pashunevava rundhe
    pashavo hi tritiyagm savanam stasya mimitarksham diti lomatastasya mimitaitadvai pashunagm rupagm
    rupenaiva 'smai pashunava rundhe pashumaneva bhavatyapamante krinati sarasamevaina nkurute shukraste
    graha ityaha shukro hyasya graho 'nasa mevasyaccha yatyanasa danovahyagm same jivanam ya~tra khalu
    va etagm shir ngirau jivanamabhi tya ndevagm savitaramityati cchandasarca mimite 'ticchanda vai sarvani
    chandagmsi sarvebhirevaina nchandobhirmimite var shma va esha chandasam ya~daticchanda yadaticchandasarca
    mimite var shmaivainagm samanana mmimite 'yatayamniyayatayamniyaivaina mmimite tasmannanavirya angulaya
    svangushthamupa ni grihnati tasma rangulibhistasma thsaha sarvabhirmimita sagg shlishta angulayo jayera
    dvibhakta jayante panca kritvo yajusha mimite panca kshara panktih pankto yajno yajnamevava rundhe
    panca kritva dvirajaivannadyamava rundhe ya dyajusha mimite bhutamevava rundhe ya mmimite yajamanasyaiva
    syannapi sadasyana mprajabhyastvetyupa samuhati sadasyanevanva bhajati vasasopa nahyati sarvadevatyam
    ssamardhayati pashavo vai somah pranaya tvetyupa nahyati pranameva pashushu dadhati vyanaya tvetyanu
    shrinthati vyanameva pashushu dadhati tasma tkalaya te shaphena te krinaniti panetagoarghagm soma
    dgava te krinanityeva bruya ngoarghamaddhvaryu nna gormahimanamava tiratyajaya krinati satapasamevaina
    nkrinati hiranyena krinati sashukramevai nkrinati dhenva krinati nkrinati dhenva krinati sashiramevaina
    nkrinatyrishabhena krinati sendramevaina krinati vahnirva anadvan vahninaiva vahni yajnasya krinati
    mithunabhya nkrinati mithunasyava ruddhyai vasasa krinati sarvadevatyam bhyah krinati dasha sa dvirajaivannadyamava
    rundhe stanurasi prajapate rvarna ityaha pashubhya eva tadaddhva ryurni hnuta atmano vraskaya gacchati
    shriya nte shukrena krinamityaha yatha yajurevaita ddeva vai yena hiranyena somamakrina 'dadata ko
    hi tejasa vikreshyata iti yena hiranyena ttadabhishaha punara dadita teja eva 'sme jyotih somavikrayini
    tama ityaha jyotireva yajamane dadhati tamasa somavikrayinamarpayati yadanupagrathya hanya ddandashukastagm
    samagm sarpa ssyuridamahagm sarpana ngriva upa grathnamityaha dandashukastagm samagm sarpa bhavanti
    tamasa somavikrayinam bhrajetyahaite va amushmin ~loke somamaraksha yadetebhyah somakrayana nnanudishedakrito
    'sya somah syannasyaite 'mushmin ~loke somagm raksheyuryadetebhyah somakrayanananudishati krito 'sya
    somo bhavatyete 'syamushmin ~loke somagm rakshanti || iti yena hiranyena catushcatvarigmshacca ssoma
    upanaddho mitro na ehi sumitradha ityaha shantya indrasyoruma visha dakshinamityaha deva vai yagm
    somamakrina ntamindrasyorau dakshina a 'sadayannesha khalu va etar hindro yo yajate tasmadevamahodayusha
    svayushetyaha devata eva ssada a sidetyaha yathayajurevaita dvi va enametadardhayati ya nkaroti varunyarca
    '' sadayati svayaivaina ndevataya samardhayati vasasa paryanahyati sarvadevatyam ssamardhayatyatho
    rakshasamapahatyai vaneshu vyantariksha ntatanetyaha vaneshu hi vyantariksha ntatana vajamarvathsvityaha
    vajagg hyarvathsu payo aghniyasvityaha payo hyaghniyasu hrithsu kratumityaha hrithsu hi kratum va~runo
    vikshvagnimityaha varuno hi vikshvagni mityaha divi hi suryagm somamadravityaha gravano va adrayasteshu
    va esha soma ndadhati yo yajate tasmadevamahodu tya njatavedasamiti sauryarca krishnajina mpratyanahyati
    rakshasamapahatya usraveta shahavityaha yathayajurevaita tpra cyavasva bhuvaspata ityaha bhutanag
    hye nyabhi dhamanityaha vishvani hye 'bhi dhamani pracyavate ma tva paripari vidadityaha yadevada
    ngandharvo vishvavasuh paryamushna devamahaparimoshaya yajamanasya svastyayanyasityaha yajamanasyaivaisha
    yajnasya nvarabhom 'navacchittyai varuno va esha yajamanamabhyaiti ya ssoma upanaddho namo ssoma upanaddho
    namo mitrasya varunasya cakshasa ityaha shantya a somam va~hantyagnina prati tishthate tau sabham
    va~ntau yajamanamabhi sa mbhavatah pura khalu vavaisha medhaya ''tmanamarabhya carati yo di kshito
    yadagnishomiya mpashumalabhata atmanishkrayana evasya sa tasma mpurushanishkrayana iva hyatho khalvahu
    ragnishoma va~ indro vritramahanniti yadagnishomiya mpashumalabhata vartraghna evasya sa tasma va~runyarca
    pari carati svayaivaina ndevataya pari carati || brahmavadino vicityo pracinavagmshagg || harih om
    || || krishna yajurvediya taittiriya samhitayam shashthakande prathamah prashna
