id: sambakritadvadasharyasuryastuti
category: stotram
name:
  english: sambakritadvadasharyasuryastuti
  devanagari: साम्बकृतद्वादशार्यासूर्यस्तुति
content:
  english: suryastuti dvadasharya sambakrita atha shrisambakritadvadasharyasuryastutih | udyannadyavivasvanarohannuttaram
    divam devah | hridrogam mama suryo harimanam cashu nashayatu || 1|| nimishardhenaikena dve ca shate
    dve sahasre dve | kramamana yojananam namo'stute nalinanathaya || 2|| karmajnanakhadashakam manashca
    jiva iti vishvasargaya | dvadashadha yo vicarati sa dvadashamurtirastu modaya || 3|| tvam hi yajuriksamah
    tvamagamastvam vashatkarah | tvam vishvam tvam hamsah tvam bhano paramahamsashca || 4|| shivarupat
    jnanamaham tvatto muktim janardanakarat | shikhirupadaishvaryam tvattashcarogyamicchami || 5|| tvaci
    dosha drishi doshah hridi dosha ye'khilendriyajadoshah | tan pusha hatadoshah kincid roshagnina dahatu
    || 6|| dharmarthakamamokshapratirodhanugratapavegakaran | bandikritendriyaganan gadan vikhandayatu
    candamshuh || 7|| yena vinedam timiram jagadetya grasati caramacaramakhilam | dhritabodham tam nalinibhartaram
    hartaramapadamide || 8|| yasya sahasrabhishorabhishu lesho himamshubimbagatah | bhasayati naktamakhilam
    bhedayatu vipadgananarunah || 9|| timiramiva netratimiram patalamivashesharogapatalam nah | kashamivadhinikayam
    kalapita rogayuktatam haratat || 10|| vatashmarigadarshastvagdoshamahodarapramehamshca | grahanibhagandharakhya
    mahatistvam me rujo hamsi || 11|| tvam mata tvam sharanam tvam dhata tvam dhanam tvamacaryah | tvam
    trata tvam harta vipadamarka prasida mama bhano || 12|| ityaryadvadashakam sambasya puro nabhahsthalat
    patitam | pathatam bhagyasamriddhih samastarogakshayashca syat || 13|| iti shrisambakritadvadasharyasuryastutih
    sampurna |
  devanagari: सूर्यस्तुती द्वादशार्या साम्बकृत अथ श्रीसाम्बकृतद्वादशार्यासूर्यस्तुतिः । उद्यन्नद्यविवस्वानारोहन्नुत्तरां
    दिवं देवः । हृद्रोगं मम सूर्यो हरिमाणं चाशु नाशयतु ॥ १॥ निमिषार्धेनैकेन द्वे च शते द्वे सहस्रे द्वे
    । क्रममाण योजनानां नमोऽस्तुते नलिननाथाय ॥ २॥ कर्मज्ञानखदशकं मनश्च जीव इति विश्वसर्गाय । द्वादशधा यो
    विचरति स द्वादशमूर्तिरस्तु मोदाय ॥ ३॥ त्वं हि यजूऋक्सामः त्वमागमस्त्वं वषट्कारः । त्वं विश्वं त्वं
    हंसः त्वं भानो परमहंसश्च ॥ ४॥ शिवरूपात् ज्ञानमहं त्वत्तो मुक्तिं जनार्दनाकारात् । शिखिरूपादैश्वर्यं
    त्वत्तश्चारोग्यमिच्छामि ॥ ५॥ त्वचि दोषा दृशि दोषाः हृदि दोषा येऽखिलेन्द्रियजदोषाः । तान् पूषा हतदोषः
    किञ्चिद् रोषाग्निना दहतु ॥ ६॥ धर्मार्थकाममोक्षप्रतिरोधानुग्रतापवेगकरान् । बन्दीकृतेन्द्रियगणान् गदान्
    विखण्डयतु चण्डांशुः ॥ ७॥ येन विनेदं तिमिरं जगदेत्य ग्रसति चरमचरमखिलम् । धृतबोधं तं नलिनीभर्तारं हर्तारमापदामीडे
    ॥ ८॥ यस्य सहस्राभीशोरभीशु लेशो हिमांशुबिम्बगतः । भासयति नक्तमखिलं भेदयतु विपद्गणानरुणः ॥ ९॥ तिमिरमिव
    नेत्रतिमिरं पटलमिवाशेषरोगपटलं नः । काशमिवाधिनिकायं कालपिता रोगयुक्ततां हरतात् ॥ १०॥ वाताश्मरीगदार्शस्त्वग्दोषमहोदरप्रमेहांश्च
    । ग्रहणीभगन्धराख्या महतीस्त्वं मे रुजो हंसि ॥ ११॥ त्वं माता त्वं शरणं त्वं धाता त्वं धनं त्वमाचार्यः
    । त्वं त्राता त्वं हर्ता विपदामर्क प्रसीद मम भानो ॥ १२॥ इत्यार्याद्वादशकं साम्बस्य पुरो नभःस्थलात्
    पतितम् । पठतां भाग्यसमृद्धिः समस्तरोगक्षयश्च स्यात् ॥ १३॥ इति श्रीसाम्बकृतद्वादशार्यासूर्यस्तुतिः
    सम्पूर्णा ।
