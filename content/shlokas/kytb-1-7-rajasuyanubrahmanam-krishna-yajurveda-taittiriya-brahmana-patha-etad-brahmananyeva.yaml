id: kytb-1-7-rajasuyanubrahmanam-krishna-yajurveda-taittiriya-brahmana-patha-etad-brahmananyeva
category: stotram
name:
  english: KYTB 1.7 Rajasuyanubrahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Etad Brahmananyeva
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake saptamah prapathakah rajasuyanubrahmanam
    o shri gurubhyo namah | harih om || anuvakam shunasiriyendraturiyapancavattiyapamargahomah eta hmananyeva
    panca havigmshi | athendraya shunasiraya purodasha va~thsaro va indra shunasirah | sam va~thsarenaivasma
    annamava rundhe | vayavya mpayo bhavati | vayurvai vrishtyai pradapayita | sa evasmai vrishti mpradapayati
    | saurya ekakapalo bhavati | suryena va amushmi~lloke vrishtirdhrita | sa evasmai vrishti || dvadashagavagm
    sira ndakshina samriddhyai | devasura ya~tta asann | te deva agnimabruvann | tvaya virenasurana vi~karishya
    iti | sa tredha ''tmanam nturiyamiti | ahamitindro ntu srijavaha iti | tau samasrijetam | sa indrasturiya
    turiyatvam | tato vai deva vyajayanta | yadindraturiya nnirupyate vijityai || dgauh | tena raudri
    | ya ddhenuh | tenaindri | yathstri sati danta | tena varuni samriddhyai | prajapati || tagm srishtagm
    rakshagsyajighagmsann | sa etah prajapati ratmano devata niramimita | tabhirvai sa digbhyo rakshagmsi
    pranudata | ya njuhoti | digbhya eva ta dyajamano rakshagmsi pranudate | samudhagm raksha ssandagdhagm
    raksha ityaha | rakshagsyeva sandahati | agnaye rakshoghne svahetyaha | devata bhya eva vijigyanabhyo
    bhagadheya nkaroti | prashtivahi ratho dakshina samriddhyai || || indro vritragm hatva | asura nparabhavya
    | namucimasura nnalabhata | tagm shacya 'grihnat | tau samalabhetam | so 'bravit | sadhamgm sandadhavahai
    | atha tva 'va srakshyami | na ma shushkena nardrena hanah || || na diva na naktamiti | sa etamapa
    mphenamasincat | na va esha shushko nardro vyushta ''sit | anudita ssuryah | na va eta m | tasyaitasmin
    ~loke | apa mphenena shira udavartayat | tadenamanvavartata | mitradrugiti || || sa etanapamarganajanayat
    | tanajuhot | tairvai sa rakshagsyapahata | yadapamarga homo bhavati | rakshasa mapahatyai | ekol
    mukena yanti | taddhi rakshasa ya~nti | esha vai rakshasa ndik | svayameva dishi rakshagmsi hanti
    || || svakrita irine juhoti pradare va dvai rakshasamayatanam | sva evayatane rakshagmsi hanti | parnamayena
    sruvena juhoti | brahma vai parnah | brahmanaiva rakshagmsi hanti | devasya tva savituh prasava ityaha
    | savitriprasuta eva rakshagmsi hanti | hatagm raksho 'vadhishma raksha ityaha | rakshasag strityai
    ddakshina niravattyai | apratikshama yanti | rakshasa devikavahavimshi dhatre purodasha va~thsaro
    vai dhata | sam prajah prajanayati | anvevasma anumatirmanyate | rate raka | pra sinivali janayati
    | prajasveva prajatasu kuhva vaca ndadhati | mithunau gavau dakshina samriddhyai | agnavaishnava nnirvapati
    | aindravaishnava ntrikapalam | viryam va~ agnih | viryamindrah | viryam vi~shnuh | praja eva prajata
    virye pratishthapayati | tasma tpraja viryavatih | vamana rishabho vahi dakshina | yadvahi | tena
    gneyah | yadrishabhah || || tenaindrah | yadvamanah | tena vaishnava ssamriddhyai | agnishomiya nnirvapati
    | indrasomiya mekadashakapalam | saumya ncarum | somo vai retodhah | agnih prajana mprajanayita |
    vriddhanamindrah pradapayita | soma evasmai reto dadhati || mprajanayati | vriddhamindrah prayacchati
    | babhru rdakshina samriddhyai | somapaushna nnirvapati | aindrapaushna ncarum | somo vai retodhah
    | pusha pashuna mprajanayita | vriddhanamindrah pradapayita | soma evasmai reto dadhati | pusha pashu
    || vriddhanindrah prayacchati | paushnashcaru vai~ pusha | asyameva prati tishthati | shyamo dakshina
    samriddhyai | bahu vai purusho mupagacchati | vaishvanara va~thsarenaivainagg svadayati | hiranya
    vai~ hiranyam | punatyevaina m | bahu vai rajanyo 'nrita nkaroti | upa jamyai harate | jinati brahmanam
    | vadatyanritam | anrite khalu vai kriyamane varuno grihnati | varunam nnirvapati | varunapashadevaina
    mmuncati | ashvo dakshina | varuno hi devataya aindravaishnavamekadashakapalam ratninam havimshi ratninametani
    havigmshi bhavanti | ete vai rashtrasya pradatarah | ete 'padatarah | ya eva rashtrasya pradatarah
    | ye 'padatarah | ta evasmai rashtra mprayacchanti | rashtrameva bhavati | ya thsamahritya nirvape
    nnirvapati ratnitvaya || t | yavatimekena havisha ''shishamava rundhe | tavatimava rundhita | anvaha
    nnirvapati | bhuyasimevashishamava rundhe | bhuyaso yajnakratunupaiti | barhaspatya nnirvapati brahmano
    grihe | mukhata evasmai brahma sagg shyati | atho brahmanneva kshatra manvarambhayati | shitiprishtho
    dakshina samriddhyai || mekadashakapalagm rajanyasya grihe | indriyamevava rundhe | rishabho dakshina
    samriddhyai | aditya mmahishyai grihe | iyam va~ aditih | asyameva pratitishthati | dhenu rdakshina
    samriddhyai | bhagaya carum va~vatayai grihe | bhagamevasmi ndadhati | vicittagarbha pashthauhi dakshina
    samriddhyai || mparivriktyai grihe krishnanam nnakhanirbhinnam | papmanameva nir nniravadayate | krishna
    kuta dakshina samriddhyai | agneya mashtakapalagm senanyo grihe | senamevasya sagg ndakshina samriddhyai
    | varuna ndashakapalagm sutasya grihe | varunasavamevava rundhe | mahanirashto dakshina samriddhyai
    | marutagm saptakapala ngramanyo grihe || vai~ marutah | annamevava rdakshina samriddhyai | savitra
    nkshatturgrihe prasu tyai | upaddhvasto dakshina samriddhyai | ashvina ndvikapalagm sagramhiturgrihe
    | ashvinau vai devana | tabhyamevasmai bheshaja nkaroti | savatyau dakshina samriddhyai | paushna
    mbhagadughasya grihe || vai~ pusha | annamevava rundhe | shyamo dakshina samriddhyai | raudra ncarumakshavapasya
    grihe | antata eva rudra nniravadayate | shabala udvaro dakshina samriddhyai | dvadashaitani havigmshi
    bhavanti | dvadasha masa va~thsarenaivasmai rashtramava rundhe | rashtrameva bhavati || || yanna prati
    nirvape t | ratnina ashisho 'varundhirann | prati nirvapati | indraya sutramne purodasha mekadashakapalam
    | indrayagmhomuce | ashisha evavarundhe | aya nno raja vritraha raja bhutva vritram va~ddhyadityaha
    | ashishamevaitamasha shvetavathsayai dugdhe || || barhaspatye maitramapi dadhati | brahma caivasmai
    nca samici dadhati | atho brahmanneva kshatra mpratishthapayati | barhaspatyena purvena pracarati
    | mukhata evasmai brahma sagg shyati | atho brahmanneva kshatra manvarambhayati | svaya nkrita vedirbhavati
    | svayadinna mbarhih | svayakrinta iddhmah | anabhijitasya mabhijitam | saiva shveta shvetavathsa
    dakshina samriddhyai || pashthauhi dakshina samriddhyai devasuvam havimshi devasuvametani havigmshi
    bhavanti | etavanto vai devanagm savah | ta evasmai sava nprayacchanti | ta enagm suvante | agnirevaina
    ngrihapatinagm suvate | somo vanaspatinam | rudrah pashunam | brihaspati || varuno dharmapatinam |
    etadeva sarva mbhavati | savita tva prasavanagm suvatamiti hasta tyai | ye deva devasuva ssthetyaha
    | yatha yajurevai tat | mahate kshatraya mahata adhipatyaya mahate janarajyayetyaha | ashishamevaitamasha
    ste | esha vo bharata raja somo mbrahmananagm rajetyaha | tasma thsomarajano brahmanah | prati tyannama
    rajyamadhayityaha || nprati dadhati | sva va~runo ashishredityaha | varunasavameva rmitrasya vratya
    abhumetyaha | shucimevainam nkaroti | amanmahi mahata ritasya nametyaha | manuta evaina m | sarve
    vrata varunasya bhuvannityaha | sarvavratamevaina nkaroti | vi mitra evairarati ntarayati | asushudanta
    yajniya ritenetyaha | svadayatyevaina m | vyu trito jarimana nna anadityaha | ayurevasmi ndadhati
    | dvabhyam vi~mrishte | dvipa dyajamanah pratishthityai | agnishomiyasya caikadashakapalasya devasuva
    svishtakrite samavadyati | devatabhirevaina mubhayatah parigrihnati | vishnukraman kramate | vishnureva
    bhutvema~lloka abhishekarthamapangrahagrahanam artheta sstheti juhoti | ahutyaivaina nishkriya grihnati
    | atho havishkritanamevabhighritana ngrihnati | vahantina ngrihnati | eta va apagm rashtram | rashtramevasmai
    grihnati | atho shriyamevainamabhi vahanti | apa mpatirasityaha | mithunamevakah | vrisha 'syurmirityaha
    || || urmimantamevaina nkaroti | vrishaseno 'sityaha | senamevasya sagg shyati | vrajakshita ssthetyaha
    | eta va apam vi~shah | vishamevasmai paryuhati | marutamoja ssthetyaha | annam vai~ marutah | annameva
    varundhe | suryavarcasa || rashtrameva varcasvyakah | suryatvacasa ssthetyaha | satyam shati | satyanrite
    evavarundhe | nainagm satyanrite udite higgstah | ya evam ssthetyaha | rashtrameva brahmavarcasyakah
    || ssthetyaha | rashtrameva vashyakah | shakvari ssthetyaha | pashavo vai shakvarih | pashunevava
    rundhe | vishvabhrita ssthetyaha | rashtrameva payasvyakah | janabhrita ssthetyaha | rashtramevendriyavyakah
    | agnestejasya || rashtrameva tejasvyakah | apamoshadhinagm rasa ssthetyaha | rashtrameva madhavyamakah
    | sarasvata ngrihnati | esha va apa mprishtham | yathsarasvati | prishthamevainagm samanana rgrihnati
    | shodashakalo vai purushah | yavaneva purushah | tasmin virya rgrihnati | dvatrigmsha thsampadyante
    | dvatrigmshadakshara 'nushtuk | vaganushtu phsarvani chandagmsi | vacaivainagm sarvebhi abhishekarthajalasamskarah
    devirapa ssrijyaddhvamityaha | brahmanaivaina ssagm srijati | anadhrishta ssidatetyaha | brahmanaivaina
    ssadayati | antara hotushca dhishniya mbrahmanacchagm sinashca sadayati | agneyo vai hota hmanacchagmsi
    | tejasa caivendriyena cobhayato rashtra mparigrihnati | hiranyeno tpunati | ahutyai hi pavitra bhyamutpunanti
    vyavrittyai || mbhavati | shatayuh purusha shshatendriyah | ayushyevendriye pratitishthati | anibhrishtamasityaha
    | anibhrishtagg hyetat | vaco bandhurityaha | vaco hyesha bandhuh | tapoja ityaha | tapoja hyetat
    | somasya datramasityaha || || somasya hyetaddatram | shukra vah shukrenotpunamityaha | shukra hyapah
    | shukragm hiranyam | candrashcandrenetyaha | candra hyapah | candragm hiranyam | amrita amritenetyaha
    | amrita hyapah | amritagm hiranyam || || svaha rajasuyayetyaha | rajasuyaya hyena utpunati | sadhamado
    dyumninirurja eta iti varunyarca grihnati | varunasavameva varundhe | ekaya grihnati | ekadhaiva yajamane
    virya ndadhati | kshatrasyolbamasi kshatrasya yonirasiti tarpya nca prayacchati sayonitvaya | ekashatena
    darbhapunjilaih pavayati | shatayurvai purusha ryah | atmaikashatah || || yavaneva purushah | tasmin
    virya ndadhati | daddhyashayati | indriyameva varundhe | udumbara mashayati | annadyasyava ruddhyai
    | shashpa nkaroti | avida eta bhavanti | avidamevaina hapatyenavati | indra indriyena | pusha pashubhih
    | mitravarunau pranapanabhya m | indro vritraya vajramudayacchat | sa divamalikhat | so 'ryamnah pantha
    abhavat | sa avinne dyavaprithivi dhritavrate iti dyavaprithivi upadhavat | sa abhyameva prasuta indro
    vritraya vajra mpraharat | avinne dyavaprithivi dhritavrate iti yadaha || || abhyameva prasuto yajamano
    vajra mbhratrivyaya praharati | avinna devyaditi rvishvarupityaha | iyam rvishvarupi | asyameva prati
    tishthati | avinno nrashtra ityaha | vishaivainagm rashtrena samardhayati | mahate kshatraya mahata
    adhipatyaya mahate janarajyayetyaha | ashishamevaitamasha ste | esha vo bharata raja somo mbrahmananagm
    rajetyaha | tasma thsomarajano brahmanah || || indrasya vajro 'si vartraghna iti dhanuh prayacchati
    vijityai | shatrubadhana ssthetishun | shatrunevasya badhante | pata ma mpata ma tiryancamanvanca
    mma patetyaha | tisro vai sharavyah | pratici tirashcyanuci mpanti | digbhyo ma patetyaha | digbhya
    evaina bhyo ma nashtrabhyah patetyaha | aparimitadevaina mpanti | hiranyavarnavushasam vi~roka iti
    trishtubha bahu u dgrihnati | indriyam ntrishtuk | indriyameva virya nashtrabhyah patetyaha catvari
    ca digvyasthapanam disho vyasthapayati | dishamabhijityai | yadanu prakrame t | abhi disho jayet |
    uttu ma 'nu prakramati | abhi disho jayati | nonma dyati | samidhama tishthetyaha | teja evavarundhe
    || || ugrama tishthetyaha | indriyamevava rundhe | virajama tishthetyaha | annadyamevava rundhe |
    udicima tishthetyaha | pashunevava rundhe | urdhvama tishthetyaha | suvargameva loka mabhijayati |
    anujjihite | suvargasya lokasya samashtyai || || maruta esha bhavati | annam vai~ marutah | annamevava
    rundhe | ekavigmshatikapalo bhavati pratishthityai | yo 'ranye 'nuvakyo ganah | ta mmaddhyata upadadhati
    | gramyaireva pashubhi nparigrihnati | tasma dgramyaih pashubhiraranyah pashavah parigrihitah | prithirvainyah
    | abhyashicyata || nnabhavat | sa etani parthanyapashyat | tanyajuhot | tairvai sa rashtra mabhavat
    | yatparthani juhoti | rashtrameva bhavati | barhaspatya mbhavati | aindramuttaresha mprathamam |
    brahma caivasmai nca samici dadhati | atho brahmanneva kshatra dabhishekasya juhoti | shaduparishtat
    | dvadasha sa mpadyante | dvadasha masa va~thsarah khalu vai devana mpuh | devanameva pura mmaddhyato
    vyavasarpati | tasya na kutashca nopa vyadho bhavati | bhutana rjayate | yatra yatraiva mrityu rjayate
    | tata evainamavayajate | tasma ssarvamayureti | sarve hyasya mrityavo drajasuyenejano nabhicaritavai
    | pratyagena abhishekah somasya tvishirasi taveva me tvishirbhuyaditi shardulacarmopastrinati | yaiva
    some tvishih | ya sha rdule | tamevava rundhe | mrityorva esha varnah | yaccha rdulah | amritagm hiranyam
    | amritamasi mrityorma pahiti hiranya syati | amritameva mrityoranta shshatendriyah | ayushyevendriye
    prati tishthati | didyonma pahityuparishtadadhi nidadhati | ubhayata evasmai sharma dadhati | ave
    shta dandashuka iti klibagm sisena viddhyati | dandashuka nevava yajate | tasma ndandashuka dagmshukah
    | nirasta shshira iti lohitayasa nnirasyati | papmanameva namuci nniravadayate | prana atmanah purve
    'bhishicya ityahuh || || somo raja varunah | deva dharmasuvashca ye | te te vacagm suvanta pranagm
    suvantamityaha | prananevatmanah purva dbruyat | agnestva tejasa 'bhishincamiti | tejasvyeva sya t
    | dushcarma tu bhavet | somasya tva dyumnena bhishincamityaha | saumyo vai devataya purushah || 'bhishincati
    | agne stejasetyaha | teja evasmi ndadhati | suryasya varcasetyaha | varca evasmi ndadhati | indrasye
    ndriyenetyaha | indriyamevasmi ndadhati | mitravarunayo rviryenetyaha | viryamevasmi ndadhati | marutamojasetyaha
    || ndadhati | kshatrana nkshatrapatirasityaha | kshatranamevaina nkaroti | ati divaspahityaha | atyanya
    npahiti vavaitadaha | samavavritranna rityaha | rashtramevasmi ndhruvamakah | uccheshanena juhoti
    | uccheshanabhago vai rudrah | bhagadheyenaiva rudra ddhre juhoti | esha vai rudrasya dik | svayameva
    dishi rudra nniravadayate | rudra yatte krayi para nnametyaha | yadva asya krayi para nnama | tena
    va esha hinasti | yagm hinasti | tenaivainagm saha shamayati | tasmai hutamasi yameshtamasityaha |
    yamadevasya mrityumavayajate || || prajapate na tvadetanyanya iti tasyai grihe juhuyat | ya nkamayeta
    rashtramasyai praja syaditi | rashtramevasyai praja bhavati | parna rabhishincati | brahmavarcasamevasmin
    ndadhati | audumbarena rajanyah | urjamevasmi ndadhati | ashvatthena vaishyah | vishamevasmi ndadhati
    | naiyagrodhena janyah | mitranyevasmai kalpayati | atho pratishthityai || vijayah indrasya vajro
    'si vartraghna iti rathamupavaharati vijityai | mitravarunayostva prashastroh prashisha yunajmityaha
    | brahmanaivaina yu~nakti | prashtivahinam yu~nakti | prashtivahi vai devarathah | devaratha mevasmai
    yunakti | trayo 'shva bhavanti | rathashcaturthah | dvau savyeshthasarathi | shat || shadva ritavah
    | ritubhirevainam yu~nakti | vishnukraman kramate | vishnureva bhutveman ~lokanabhijayati | yah kshatriyah
    pratihitah | so 'nvarabhate | rashtrameva bhavati | trishtubha 'nvarabhate | indriyam vai~ trishtuk
    | indriyameva yajamane dadhati || mprasave jeshamityaha | marudbhireva prasuta ujjayati | apta mmana
    ityaha | yadeva manasaiphsi t | tadapat | rajanya kranta evakramate | vi va esha indriyena viryenardhyate
    | yo rajanya njinati | samahamindriyena viryenetyaha || || indriyameva viryamatman mmanyurasi taveva
    me manyurbhuyaditi varahi upanahavupa muncate | pashunam dvarahah | tenaiva pashuna ndhatte | abhi
    va iyagm sushuvana vi~ryamadatoh | varahi upanahavupamuncate | asya evantardhatte | indriyasya viryasyana
    || namo matre prithivya ityahahigm sayai | iyadasya yurasyayurme dhehityaha | ayurevatman dhatte |
    urgasyurja mme dhehityaha | urjamavatma ndhatte | yunnasi varco 'si varco mayi dhehityaha | varca
    evatma ndhatte | ekadha brahmana upa harati | ekadhaiva yajamana ayururjam va~rco dadhati | rathavimocaniya
    juhoti pratishthityai || 'shva bhavanti | rathashcaturthah | tasma ccaturjuhoti | yadubhau sahavatishthetam
    | samanam lo~kamiyatam | saha sagramhitra rathavahane rathamadadhati | suvargadevainam lo~kadantardadhati
    | hagmsa shshucishaditya dadhati | brahmanaivaina mupavaharati | brahmana ''dadhati | aticchandasa
    ''dadhati | aticchanda vai sarvani chandagmsi | sarvebhirevaina shma va esha chandasam | yadaticchandah
    | yadaticchandasa dadhati | var shmaivainagm samanana va~ ahah | varuni ratrih | ahoratrabhya mupavaharati
    | mitro 'si varunosityaha | maitro vai dakshinah | varuna ssavyah | vaishvadevyamiksha | svamevainau
    bhagadheya || vaishvadevyo vai prajah | ta evadyah kurute | kshatrasya nabhirasi kshatrasya yoni strinati
    sayonitvaya | syonamasida sushadamasidetyaha | yatha yajurevai tat | ma tva higmsi nma ma higmsidityaha
    higmsayai | nishasada dhritavrato varunah pastya jyaya sukraturityaha | samra jyamevainagm sukratu
    'si satyasava ityaha | savitara 'si satyauja ityaha | indramevainagm satyaujasa 'si susheva ityaha
    | mitramevainagm susheva 'si satyadharmetyaha | varunamevainagm satyadharmana 'si satyasava ityaha
    | gayatri mevaitenabhivyaharati | indro 'si satyauja ityaha | trishtubha 'si susheva ityaha | jagati
    mevaitenabhivyaharati | satyameta devatah | satyametani chandagmsi | satyamevava rundhe | varuno 'si
    satyadharmetyaha | anushtubha mevaitenabhivyaharati | satyanrite va anushtup | satyanrite varunah
    | satyanrite evavarundhe || || nainagm satyanrite udite higgstah | ya evam ve~da | indrasya vajro
    'si vartraghna iti sphya mprayacchati | vajro vai sphyah | vajrenaivasma avaraparagm randhayati |
    evagm hi tacchreyah | yadasma ete raddhyeyuh | disho 'bhyayagm raja 'bhuditi pancakshan prayacchati
    | ete vai sarve || odanamudbruvate | parameshthi va eshah | yadodanah | paramamevainagg shriya ngamayati
    | sushloka~ nityaha | ashishamevaitama sha shshepamakhyapayate | varunapasha mbhavati | shatayuh purusha
    | ayushyevendriye pratitishthati | marutasya caikavigmshatikapalasya vaishvadevyai camikshaya agnaye
    svishtakrite samavadyati | devatabhirevaina mubhayatah parigrihnati | apa nnaptre svahorjo naptre
    svaha 'gnaye grihapataye svaheti tisra ahuti rjuhoti | traya ime lokah | eshveva lokeshu prati tishthati
    || trishtubhamevaitenabhi vyaharati satyanrite evavarundhe || harih om || || krishna yajurvediya taittiriya
    brahmane prathamashtake saptamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके सप्तमः प्रपाठकः राजसूयानुब्राह्मणं ओ श्री
