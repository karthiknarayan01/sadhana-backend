    पि॒तुर्गोत॑मा॒द न्वि॑याय । त्वन्नो॑ अ॒स्य वच॑स श्चिकिद्धि॒ होत॑र्यविष्ठ सुक्रतो॒ दमू॑नाः ॥ अस्व॑प्नज
    स्त॒रण॑य स्सु॒शेवा॒ अत॑न्द्रासो ऽवृ॒का अश्र॑मिष्ठाः । ते पा॒यवः॑ स॒द्ध्रिय॑ञ्चो नि॒षद्या ऽग्ने॒ तव॑नः
    पान्त्वमूर ॥ ये पा॒यवो॑ मामते॒य न्ते॑ अग्ने॒ पश्य॑न्तो अ॒न्ध न्दु॑रि॒तादर॑क्षन्न् । र॒रक्ष॒तान् थ्सु॒कृतो॑
    वि॒श्ववे॑दा॒ दिफ्स॑न्त॒ इद्रि॒पवो॒ ना ह॑ देभुः ॥ त्वया॑ व॒यग्ं स॑ध॒न्य॑ त्यश्याम॒ वाजान्॑ । उ॒भा शग्ंसा॑
    सूदय सत्यताते ऽनुष्ठु॒या कृ॑णुह्यह्रयाण ॥ अ॒या ते॑ अग्ने स॒मिधा॑ विधेम॒ प्रति॒स्तोमग्ं॑ श॒स्यमा॑न
    ङ्गृभाय । दहा॒शसो॑ र॒क्षसः॑ पा॒ह्य॑स्मा न्द्रु॒हो नि॒दो मि॑त्रमहो अव॒द्यात् ॥ र॒क्षो॒हणं॑ ँवा॒जिन॒माजि॑घर्मि
    मि॒त्र मुप॑यामि॒ शर्म॑ । शिशा॑नो अ॒ग्निः क्रतु॑भि॒ स्समि॑द्ध॒स्सनो॒ दिवा॒ म् ॥ विज्योति॑षा बृह॒ता
    भा र्विश्वा॑नि कृणुते महि॒त्वा । प्रादे॑वी श्शिशी॑ते॒ शृङ्गे॒ रक्ष॑से वि॒निक्षे ॥ उ॒त स्वा॒नासो॑ दि॒विष॑न्त्व॒ग्ने
    स्ति॒ग्मायु॑धा॒ रक्ष॑से॒ हन्त॒वा उ॑ । मदे॑ चिदस्य॒ प्ररु॑जन्ति॒ भामा॒ न व॑रन्ते परि॒बाधो॒ अदे॑वीः
    ॥ वस्व्य॑स्य॒ग्ं॒ शुना॑ ते॒ श्चतु॑स्त्रिग्ंशत् । ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया
    म्प्रथमकाण्डे द्वितीयः प्रश्न
