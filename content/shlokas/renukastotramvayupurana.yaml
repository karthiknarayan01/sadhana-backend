id: renukastotramvayupurana
category: stotram
name:
  english: renukastotramvayupurana
  devanagari: रेणुकास्तोत्रम्वायुपुराण
content:
  english: rishipatni ca devate || 13|| ekavire maharaudre malini vishvabhairavi | yogini yogayukta ca
    mahadevi maheshvari || 14|| kamakshi bhadrakali ca hunkari tripureshvari | raktavastre raktanetre
    mahatripurasundari || 15|| renuka sunuyogi ca bhaktanamabhayankari | bhogalakshmiryogalakshmirdivyalakshmishca
    sarvada || 16|| kalaratri maharatri madyamamsashivapriye | bhaktanam shripade devi lokatrayavimohini
    || 17|| klinkari kamapithe ca hrinkari ca prabodhyata | shrinkari ca shriya devi siddhalakshmishca
    suprabha || 18|| mahalakshmishca kaumari kauberi simhavahini | simhapretasane devi raudri kruravatarini
    || 19|| daitya nari kumari ca raudradaityanipatini | trinetra shvetarupa ca suryakotisamaprabha ||
    20|| khadgini banahasta carudha mahishavahini | mahakundalini sakshat kankali bhuvaneshvari || 21||
    krittivasa vishnurupa hridaya devatamaya | devamarutamata ca bhaktamata ca shankari || 22|| caturbhuje
    caturvaktre svastipadmasanasthite | pancavaktra mahaganga gauri shankaravallabha || 23|| kapalini
    devamata kamadhenustrayoguni | vidya ekamahavidya shmashanapretavasini || 24|| devatrigunatrailokya
    jagattrayavilokini | raudra vaitali kankali bhavani bhavavallabha || 25|| kali kapalini krodha matangi
    venudharini | rudrasya na parabhuta rudradeharddhadharini || 26|| jaya ca vijaya caiva ajaya caparajita
    | renukayai namaste'stu siddhadevyai namo namah || 27|| shriyai devyai namaste'stu dinanathe namo
    namah | jaya tvam devadeveshi sarvadevi namo'stu te || 28|| devadevasya janani pancapranaprapurite
    | tvatprasadaya deveshi devah krandanti vishnave || 29|| mahabale maharaudre sarvadaityanipatini |
    adhara buddhida shaktih kundali tanturupini || 30|| shatcakramane devi yogini divyarupini | kamika
    kamarakta ca lokatrayavilokini || 31|| mahanidra madyanidra madhukaitabhabhanjini | bhadrakali trisandhya
    ca mahakali kapalini || 32|| rakshita sarvabhutanam daityanam ca kshayankari | sharanyam sarvasattvanam
    raksha tvam parameshvari || 33|| tvamaradhayate loke tesham rajyam ca bhutale | ashadhe kartike caiva
    purne purnacaturdashi || 34|| ashvine paushamase ca kritva pujam prayatnatah | gandhapushpaishca naivedyaistoshitam
    pancabhih saha || 35|| yam yam prarthayate nityam tam tam prapnoti nishcitam | tattvam me varade devi
    raksha mam parameshvari || 36|| tava vamankitam devi raksha me sakaleshvari | sarvabhutodaye devi
    prasada varade shive || 37|| shridevyuvaca varam bruhi mahabhaga rajyam kuru mahitale | mamaradhyate
    loke bhayam kvapi na vidyate || 38|| mama marge ca ayanti bhirdevi mama sannidhau | abharyo labhate
    bharyam nirdhano labhate dhanam || 39|| vidyam putramavapnoti shatrunasham ca vindati | aputro labhate
    putran baddho mucyeta bandhanat || 40|| kamarthi labhate kamam rogi arogyamapnuyat | mama aradhanam
    nityam rajyam prapnoti bhutale || 41|| sarvakaryani sidhyanti prasadanme na samshayah | sarvakaryanyavapnoti
    dirghayushca labhetsukhi || 42|| shriparashurama uvaca atra sthaneshu bhavatam abhayam kuru sarvada
    | yam yam prarthayate nityam tam tam prapnoti nishcitam || 43|| prayage pushkare caiva gangasagarasangame
    | snanam ca kurute nityam nityam ca caranodake || 44|| idam stotram pathennityam trisandhyam shraddhayanvitah
    | sarvan kamanavapnoti prapyate paramam padam || 45|| iti shrivayupurane parashuramakritam shrirenukastotram
    sampurnam || || shrirenukarpanamastu ||
  devanagari: ऋषिपत्नी च देवते ॥ १३॥ एकवीरे महारौद्रे मालिनी विश्वभैरवि । योगिनी योगयुक्ता च महादेवी महेश्वरी
    ॥ १४॥ कामाक्षी भद्रकाली च हुङ्कारी त्रिपुरेश्वरी । रक्तवस्त्रे रक्तनेत्रे महात्रिपुरसुन्दरि ॥ १५॥
    रेणुका सूनुयोगी च भक्तानामभयङ्करी । भोगलक्ष्मीर्योगलक्ष्मीर्दिव्यलक्ष्मीश्च सर्वदा ॥ १६॥ कालरात्रि
    महारात्रि मद्यमांसशिवप्रिये । भक्तानां श्रीपदे देवि लोकत्रयविमोहिनि ॥ १७॥ क्लीङ्कारी कामपीठे च ह्रीङ्कारी
    च प्रबोध्यता । श्रीङ्कारी च श्रिया देवि सिद्धलक्ष्मीश्च सुप्रभा ॥ १८॥ महालक्ष्मीश्च कौमारी कौबेरी
    सिंहवाहिनी । सिंहप्रेतासने देवि रौद्रि क्रूरावतारिणि ॥ १९॥ दैत्या नारी कुमारी च रौद्रदैत्यनिपातिनी
    । त्रिनेत्रा श्वेतरूपा च सूर्यकोटिसमप्रभा ॥ २०॥ खड्गिनी बाणहस्ता चारूढा महिषवाहिनी । महाकुण्डलिनी
    साक्षात् कङ्काली भुवनेश्वरी ॥ २१॥ कृत्तिवासा विष्णुरूपा हृदया देवतामया । देवमारुतमाता च भक्तमाता च
    शङ्करी ॥ २२॥ चतुर्भुजे चतुर्वक्त्रे स्वस्तिपद्मासनस्थिते । पञ्चवक्त्रा महागङ्गा गौरी शङ्करवल्लभा ॥
    २३॥ कपालिनी देवमाता कामधेनुस्त्रयोगुणी । विद्या एकमहाविद्या श्मशानप्रेतवासिनी ॥ २४॥ देवत्रिगुणत्रैलोक्या
    जगत्त्रयविलोकिनी । रौद्रा वैतालि कङ्काली भवानी भववल्लभा ॥ २५॥ काली कपालिनी क्रोधा मातङ्गी वेणुधारिणी
    । रुद्रस्य न पराभूता रुद्रदेहार्द्धधारिणी ॥ २६॥ जया च विजया चैव अजया चापराजिता । रेणुकायै नमस्तेऽस्तु
    सिद्धदेव्यै नमो नमः ॥ २७॥ श्रियै देव्यै नमस्तेऽस्तु दीननाथे नमो नमः । जय त्वं देवदेवेशि सर्वदेवि नमोऽस्तु
    ते ॥ २८॥ देवदेवस्य जननि पञ्चप्राणप्रपूरिते । त्वत्प्रसादाय देवेशि देवाः क्रन्दन्ति विष्णवे ॥ २९॥ महाबले
    महारौद्रे सर्वदैत्यनिपातिनि । आधारा बुद्धिदा शक्तिः कुण्डली तन्तुरूपिणी ॥ ३०॥ षट्चक्रमणे देवि योगिनि
    दिव्यरूपिणि । कामिका कामरक्ता च लोकत्रयविलोकिनी ॥ ३१॥ महानिद्रा मद्यनिद्रा मधुकैटभभञ्जिनी । भद्रकाली
    त्रिसन्ध्या च महाकाली कपालिनी ॥ ३२॥ रक्षिता सर्वभूतानां दैत्यानां च क्षयङ्करी । शरण्यं सर्वसत्त्वानां
    रक्ष त्वं परमेश्वरि ॥ ३३॥ त्वामाराधयते लोके तेषां राज्यं च भूतले । आषाढे कार्तिके चैव पूर्णे पूर्णचतुर्दशी
    ॥ ३४॥ आश्विने पौषमासे च कृत्वा पूजां प्रयत्नतः । गन्धपुष्पैश्च नैवेद्यैस्तोषितां पञ्चभिः सह ॥ ३५॥
    यं यं प्रार्थयते नित्यं तं तं प्राप्नोति निश्चितम् । तत्त्वं मे वरदे देवि रक्ष मां परमेश्वरि ॥ ३६॥
    तव वामाङ्कितं देवि रक्ष मे सकलेश्वरि । सर्वभूतोदये देवि प्रसाद वरदे शिवे ॥ ३७॥ श्रीदेव्युवाच वरं ब्रूहि
    महाभाग राज्यं कुरु महीतले । मामाराध्यते लोके भयं क्वापि न विद्यते ॥ ३८॥ मम मार्गे च आयान्ती भीर्देवी
    मम सन्निधौ । अभार्यो लभते भार्यां निर्धनो लभते धनम् ॥ ३९॥ विद्यां पुत्रमवाप्नोति शत्रुनाशं च विन्दति
    । अपुत्रो लभते पुत्रान् बद्धो मुच्येत बन्धनात् ॥ ४०॥ कामार्थी लभते कामं रोगी आरोग्यमाप्नुयात् । मम
    आराधनं नित्यं राज्यं प्राप्नोति भूतले ॥ ४१॥ सर्वकार्याणि सिध्यन्ति प्रसादान्मे न संशयः । सर्वकार्याण्यवाप्नोति
    दीर्घायुश्च लभेत्सुखी ॥ ४२॥ श्रीपरशुराम उवाच अत्र स्थानेषु भवतां अभयं कुरु सर्वदा । यं यं प्रार्थयते
    नित्यं तं तं प्राप्नोति निश्चितम् ॥ ४३॥ प्रयागे पुष्करे चैव गङ्गासागरसङ्गमे । स्नानं च कुरुते नित्यं
    नित्यं च चरणोदके ॥ ४४॥ इदं स्तोत्रं पठेन्नित्यं त्रिसन्ध्यं श्रद्धयान्वितः । सर्वान् कामानवाप्नोति
    प्राप्यते परमं पदम् ॥ ४५॥ इति श्रीवायुपुराणे परशुरामकृतं श्रीरेणुकास्तोत्रं सम्पूर्णम् ॥ ॥ श्रीरेणुकार्पणमस्तु
    ॥
