id: gopalashatakam
category: shataka
name:
  english: gopalashatakam
  devanagari: गोपालशतकम्
content:
  english: shcaparopanashaktileshavidhurairbhupairanekaih stutah shighraropitacapataditajhasho viryarjitam
    lakshmanam yo madradhipajam priyamudavahannitva pumrim tam bhaje || 90|| krishnah patnya sameto'marapativacanad
    vainateyadhirudho gatva prajyotishakhyam nagaramatha muram sanugam tatra hatva | yudhyantam yuddhashaundam
    kritabahunidhano bhaumamapyashu hatva bhumeh pautraya yo'dadabhayamatimuda bhustutastam prapadye ||
    91|| ratnadrim prahinod yo'maraganapataye vasavam varunam ca cchatram rajne jalanamatha narakahritam
    shodashastrisahasram | svapeksham divyaratnai rathaturagadhanaih kunjaradyaih sametam shvetairdivyairgajendrairanayadakhiladrik
    svam purim tam namami || 92|| gatva tarkshyadhirudho'marapatibhavanam satyaya bhaumagehad vittai ratnairmaghonamarapuramahito
    mataram tatra natva | matre dityai svapatnya kshititanayahritam kundalam dapayitva patniprityai viveshamarapatidayitam
    nandanam yo bhaje tam || 93|| hartavyah parijatah surapatimahishigarvahetuh suramyo devyaivam prerito
    yo'marapatidayitam parijatam ca hritva | tatkopayatarudrantakamukhavibudhan devarajam ca jiva satyahutena
    tena stutanijamahima svam purim prapa so'vyat || 94|| yatputrah shulidatto hyagatadashadinah shambarena
    pragrihya kshipto'mbhodhau nigirno jhashajatharagato dhivaraih sangrihitat | minat tasmaddhatangadavanimadhigatah
    shambarasyaiva gehe hritva tam shambararim nijapuramagamad bharyaya tam prapadye || 95|| hatva kritrimashankhacakragarudam
    paundram harih svagrajam tatsahayyakaram ca kashyadhipatim matamaham samyuge | krityam tatsutakalpitam
    nijapuridahaya cakrena yo vidravyashcadahat taya tamapi tadvaranasim tam bhaje || 96|| krishnah praptashamantapancakamahakshetro
    grahe bhasvato nanadeshasamagatakhilanripaih sampujitah sanugah | parthairnandamukhaih sabandhuvanita
    bhrityaistatha yogibhih pitra kshetrakrite makhe sumahito yo'gat puri so'vatat || 97|| pat putrah
    kamsabhagnah kila mama bhagavamstan prayaccheti matuh shrutva vakyam saramo balisadanagatastena sampujya
    dattan | urnajjatanmariceh prahasanakupitad devalad danavamstan hairanyana devakijananayadatha hatan
    mataram yah sa no'vyat || 98|| paravarapravishtan nripaganacakitamstyaktarajasanan na
  devanagari: श्चापारोपणशक्तिलेशविधुरैर्भूपैरनेकैः स्तुतः शीघ्रारोपितचापताडितझषो वीर्यार्जितां लक्ष्मणां
    यो मद्राधिपजां प्रियामुदवहन्नीत्वा पुंरीं तं भजे ॥ ९०॥ कृष्णः पत्न्या समेतोऽमरपतिवचनाद् वैनतेयाधिरूढो
    गत्वा प्राज्योतिषाख्यं नगरमथ मुरं सानुगं तत्र हत्वा । युध्यन्तं युद्धशौण्डं कृतबहुनिधनो भौममप्याशु
    हत्वा भूमेः पौत्राय योऽदादभयमतिमुदा भूस्तुतस्तं प्रपद्ये ॥ ९१॥ रत्नाद्रिं प्राहिणोद् योऽमरगणपतये वासवं
    वारुणं च च्छत्रं राज्ञे जलानामथ नरकहृतं षोडशस्त्रीसहस्रम् । स्वापेक्षं दिव्यरत्नै रथतुरगधनैः कुञ्जराद्यैः
    समेतं श्वेतैर्दिव्यैर्गजेन्द्रैरनयदखिलदृक् स्वां पुरीं तं नमामि ॥ ९२॥ गत्वा तार्क्ष्याधिरूढोऽमरपतिभवनं
    सत्यया भौमगेहाद् वित्तै रत्नैर्मघोनामरपुरमहितो मातरं तत्र नत्वा । मात्रे दित्यै स्वपत्न्या क्षितितनयहृतं
    कुण्डलं दापयित्वा पत्नीप्रीत्यै विवेशामरपतिदयितं नन्दनं यो भजे तम् ॥ ९३॥ हर्तव्यः पारिजातः सुरपतिमहिषीगर्वहेतुः
    सुरम्यो देव्यैवं प्रेरितो योऽमरपतिदयितं पारिजातं च हृत्वा । तत्कोपायातरुद्रान्तकमुखविबुधान् देवराजं
    च जिवा सत्याहूतेन तेन स्तुतनिजमहिमा स्वां पुरीं प्राप सोऽव्यात् ॥ ९४॥ यत्पुत्रः शूलिदत्तो ह्यगतदशदिनः
    शम्बरेण प्रगृह्य क्षिप्तोऽम्भोधौ निगीर्णो झषजठरगतो धीवरैः सङ्गृहीतात् । मीनात् तस्माद्धताङ्गादवनिमधिगतः
    शम्बरस्यैव गेहे हृत्वा तं शम्बरारिं निजपुरमगमद् भार्यया तं प्रपद्ये ॥ ९५॥ हत्वा कृत्रिमशङ्खचक्रगरुडं
    पौण्ड्रं हरिः स्वाग्रजं तत्साहाय्यकरं च काश्यधिपतिं मातामहं संयुगे । कृत्यां तत्सुतकल्पितां निजपुरीदाहाय
    चक्रेण यो विद्राव्याश्चदहत् तया तमपि तद्वाराणसीं तं भजे ॥ ९६॥ कृष्णः प्राप्तशमन्तपञ्चकमहाक्षेत्रो
    ग्रहे भास्वतो नानादेशसमागताखिलनृपैः सम्पूजितः सानुगः । पार्थैर्नन्दमुखैः सबन्धुवनिता भृत्यैस्तथा योगिभिः
    पित्रा क्षेत्रकृते मखे सुमहितो योऽगात् पुरी सोऽवतात् ॥ ९७॥ पट् पुत्राः कंसभग्णाः किल मम भगवंस्तान्
    प्रयच्छेति मातुः श्रुत्वा वाक्यं सरामो बलिसदनगतस्तेन सम्पूज्य दत्तान् । ऊर्णाज्जातान्मरीचेः प्रहसनकुपिताद्
    देवलाद् दानवांस्तान् हैरण्यान देवकीजाननयदथ हतान् मातरं यः स नोऽव्यात् ॥ ९८॥ पारावारप्रविष्टान् नृपगणचकितांस्त्यक्तराजासनान्
    न
