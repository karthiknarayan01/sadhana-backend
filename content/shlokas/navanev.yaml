id: navanev
category: stotram
name:
  english: navanev
  devanagari: नवनेव्
content:
  english: stotram japakusumasamkasham kashyapeyam mahadyutim | tamo'rim sarvapapaghnam pranato'smi divakaram
    || 1|| dadhishankhatusharabham kshirodarnavasambhavam | namami shashinam somam shambhormukutabhushanam
    || 2|| dharanigarbhasambhutam vidyutkantisamaprabham | kumaram shaktihastam tam mangalam pranamamyaham
    || 3|| priyangukalikashyamam rupenapratimam budham | saumyam saumyagunopetam tam budham pranamamyaham
    || 4|| devanam ca rishinam ca gurum kancanasamnibham | buddhibhutam trilokesham tam namami brihaspatim
    || 5|| himakundamrinalabham daityanam paramam gurum | sarvashastrapravaktaram bhargavam pranamamyaham
    || 6|| nilamjanasamabhasam raviputram yamagrajam | chayamartandasambhutam tam namami shanaishcaram
    || 7|| ardhakayam mahaviryam candradityavimardanam | simhikagarbhasambhutam tam rahum pranamamyaham
    || 8|| palashapushpasamkasham tarakagrahamastakam | raudram raudratmakam ghoram tam ketum pranamamyaham
    || 9|| iti vyasamukhodgitam yah pathetsusamahitah | diva va yadi va ratrau vighnashantirbhavishyati
    || 10|| naranarinripanam ca bhavedduhsvapnanashanam | aishvaryamatulam teshamarogyam pushtivardhanam
    || grahanakshatrajah pidastaskaragnisamudbhavah | tah sarvah prashamam yanti vyaso brute na samshayah
    || || iti shrivyasaviracitam navagrahastotram sampurnam ||
  devanagari: स्तोत्रम् जपाकुसुमसंकाशं काश्यपेयं महाद्युतिम् । तमोऽरिं सर्वपापघ्नं प्रणतोऽस्मि दिवाकरम्
    ॥ १॥ दधिशङ्खतुषाराभं क्षीरोदार्णवसंभवम् । नमामि शशिनं सोमं शम्भोर्मुकुटभूषणम् ॥ २॥ धरणीगर्भसंभूतं
    विद्युत्कान्तिसमप्रभम् । कुमारं शक्तिहस्तं तं मङ्गलं प्रणमाम्यहम् ॥ ३॥ प्रियङ्गुकलिकाश्यामं रूपेणाप्रतिमं
    बुधम् । सौम्यं सौम्यगुणोपेतं तं बुधं प्रणमाम्यहम् ॥ ४॥ देवानां च ऋषीणां च गुरुं काञ्चनसंनिभम् । बुद्धिभूतं
    त्रिलोकेशं तं नमामि बृहस्पतिम् ॥ ५॥ हिमकुन्दमृणालाभं दैत्यानां परमं गुरुम् । सर्वशास्त्रप्रवक्तारं
    भार्गवं प्रणमाम्यहम् ॥ ६॥ नीलांजनसमाभासं रविपुत्रं यमाग्रजम् । छायामार्तण्डसंभूतं तं नमामि शनैश्चरम्
    ॥ ७॥ अर्धकायं महावीर्यं चन्द्रादित्यविमर्दनम् । सिंहिकागर्भसंभूतं तं राहुं प्रणमाम्यहम् ॥ ८॥ पलाशपुष्पसंकाशं
    तारकाग्रहमस्तकम् । रौद्रं रौद्रात्मकं घोरं तं केतुं प्रणमाम्यहम् ॥ ९॥ इति व्यासमुखोद्गीतं यः पठेत्सुसमाहितः
    । दिवा वा यदि वा रात्रौ विघ्नशान्तिर्भविष्यति ॥ १०॥ नरनारीनृपाणां च भवेद्दुःस्वप्ननाशनम् । ऐश्वर्यमतुलं
    तेषामारोग्यं पुष्टिवर्धनम् ॥ ग्रहनक्षत्रजाः पीडास्तस्कराग्निसमुद्भवाः । ताः सर्वाः प्रशमं यान्ति व्यासो
    ब्रूते न संशयः ॥ ॥ इति श्रीव्यासविरचितं नवग्रहस्तोत्रं सम्पूर्णम् ॥
