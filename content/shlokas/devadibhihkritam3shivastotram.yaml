id: devadibhihkritam3shivastotram
category: stotram
name:
  english: devadibhihkritam3shivastotram
  devanagari: देवादिभिःकृतं३शिवस्तोत्रम्
content:
  english: 15|| rishayashca tatah sapta vasishthatripurogamah | tushtuvurvividhaih stotraih svasti svastiti
    vadinah | vedoktibhirathagryabhirvalakhilyashca tushtuvuh || 151|| valakhilya ucuh | namaste riksvarupaya
    samarupaya te namah | yajuhsvaruparupaya samnam dhamaga te namah || 152|| jnanaikarupadehaya nirdhutatamase
    namah | shuddhajyotihsvarupaya trimurtayamalatmane || 153|| varishthaya varenyaya sarvasmai paramatmane
    | namo'khilajagadvyapirupayanantamurttaye || 154|| sarvakaranabhutaya nishthaya jnanacetasam | namah
    suryasvarupaya prakashalakshyarupine || 155|| bhaskaraya namastubhyam tatha dinakrite namah | sarvasmai
    hetave caiva sandhyajyotsnakrite namah || 156|| tvam sarvametadbhagavanjagacca bhramata tvaya | bhramatya
    vishvamakhilam brahmandam sacaracaram | tvadamshubhiridam sarvam sprishtam vai jayate shuci || 157||
    kriyate tvatkarasparshairjaladinam pavitrata || 158|| homadanadiko dharmo nopakaraya jayate | tata
    yavanna samyogi jagadetattvadamshubhih || 159|| ricaste sakala hyetastatha yani yajumshi ca | sakalani
    ca samani nipatanti tvadangatah || 1
  devanagari: १५॥ ऋषयश्च ततः सप्त वसिष्ठात्रिपुरोगमाः । तुष्टुवुर्विविधैः स्तोत्रैः स्वस्ति स्वस्तीति
    वादिनः । वेदोक्तिभिरथाग्र्याभिर्वालखिल्याश्च तुष्टुवुः ॥ १५१॥ वालखिल्या ऊचुः । नमस्ते ऋक्स्वरूपाय
    सामरूपाय ते नमः । यजुःस्वरूपरूपाय साम्नां धामग ते नमः ॥ १५२॥ ज्ञानैकरूपदेहाय निर्धूततमसे नमः । शुद्धज्योतिःस्वरूपाय
    त्रिमूर्तायामलात्मने ॥ १५३॥ वरिष्ठाय वरेण्याय सर्वस्मै परमात्मने । नमोऽखिलजगद्व्यापिरूपायानन्तमूर्त्तये
    ॥ १५४॥ सर्वकारणभूताय निष्ठाय ज्ञानचेतसाम् । नमः सूर्यस्वरूपाय प्रकाशालक्ष्यरूपिणे ॥ १५५॥ भास्कराय
    नमस्तुभ्यं तथा दिनकृते नमः । सर्वस्मै हेतवे चैव सन्ध्याज्योत्स्नाकृते नमः ॥ १५६॥ त्वं सर्वमेतद्भगवञ्जगच्च
    भ्रमता त्वया । भ्रमत्या विश्वमखिलं ब्रह्माण्डं सचराचरम् । त्वदंशुभिरिदं सर्वं स्पृष्टं वै जायते शुचि
    ॥ १५७॥ क्रियते त्वत्करस्पर्शैर्जलादीनां पवित्रता ॥ १५८॥ होमदानादिको धर्मो नोपकाराय जायते । तात यावन्न
    संयोगि जगदेतत्त्वदंशुभिः ॥ १५९॥ ऋचस्ते सकला ह्येतास्तथा यानि यजूंषि च । सकलानि च सामानि निपतन्ति त्वदङ्गतः
    ॥ १
