id: naradakritamvishnustotram
category: stotram
name:
  english: naradakritamvishnustotram
  devanagari: नारदकृतंविष्णुस्तोत्रं
content:
  english: naradakritam vishnustotram narada uvaca | param paranamamritam puranam param param vishnumanantaviryam
    | namami nityam purusham puranam parayanam paragatam paranam || 11|| puratanam tvapratimam puranam
    paraparam paragamugratejasam | gambhiragambhiradhiyam pradhanam nato'smi devam harimishitaram || 12||
    paratparam caparamam pradhanam paraspadam shuddhapadam vishalam | paratparesham purusham puranam narayanam
    staumi vishuddhabhavah || 13|| pura puram shunyamidam sasarjja tada sthitatvat purushah pradhanah
    | jane prasiddhah sharanam mamastu narayano vitamalah puranah || 14|| param param vishnumapararupam
    puratanam nitimatam pradhanam | dhritakshamam shantidharam kshitisham shubham sada staumi mahanubhavam
    || 15|| sahasramurdhanamanantapadamanekabahum shashisuryanetram | ksharaksharam kshirasamudranidram
    narayanam staumyamritam paresham || 16|| trivedagamyam trinavaikamurtim trishuklasamstham trihutashabhedam
    | tritattvalakshyam triyugam trinetram namami narayanamaprameyam || 17|| krite sitam raktatanum tatha
    ca tretayuge putatanum puranam | tatha harim dvaparatah kalau ca krishnikritatmanamatho namami ||
    18|| sasarja yo vaktrata eva vipran bhujantare kshatramathoruyugme | vishah padagreshu tathaiva shudran
    namami tam vishvatanum puranam || 19|| paratparam paragatam prameyam yudhampatim karyata eva krishnam
    | gadasicarmanyabhritotthapanim namami narayanamaprameyam || 20|| iti varahapurane tritiyadhyayantargata
    naradakrita vishnustutih samapta | varahapurana | adhyaya 3
  devanagari: नारदकृतं विष्णुस्तोत्रम् नारद उवाच । परं पराणाममृतं पुराणं पारं परं विष्णुमनन्तवीर्यम् ।
    नमामि नित्यं पुरुषं पुराणं परायणं पारगतं पराणाम् ॥ ११॥ पुरातनं त्वप्रतिमं पुराणं परापरं पारगमुग्रतेजसम्
    । गम्भीरगम्भीरधियां प्रधानं नतोऽस्मि देवं हरिमीशितारम् ॥ १२॥ परात्परं चापरमं प्रधानं परास्पदं शुद्धपदं
    विशालम् । परात्परेशं पुरुषं पुराणं नारायणं स्तौमि विशुद्धभावः ॥ १३॥ पुरा पुरं शून्यमिदं ससर्ज्ज तदा
    स्थितत्वात् पुरुषः प्रधानः । जने प्रसिद्धः शरणं ममास्तु नारायणो वीतमलः पुराणः ॥ १४॥ पारं परं विष्णुमपाररूपं
    पुरातनं नीतिमतां प्रधानम् । धृतक्षमं शान्तिधरं क्षितीशं शुभं सदा स्तौमि महानुभावम् ॥ १५॥ सहस्रमूर्धानमनन्तपादमनेकबाहुं
    शशिसूर्यनेत्रम् । क्षराक्षरं क्षीरसमुद्रनिद्रं नारायणं स्तौम्यमृतं परेशम् ॥ १६॥ त्रिवेदगम्यं त्रिनवैकमूर्तिं
    त्रिशुक्लसंस्थं त्रिहुताशभेदम् । त्रितत्त्वलक्ष्यं त्रियुगं त्रिनेत्रं नमामि नारायणमप्रमेयम् ॥ १७॥
    कृते सितं रक्ततनुं तथा च त्रेतायुगे पूततनुं पुराणम् । तथा हरिं द्वापरतः कलौ च कृष्णीकृतात्मानमथो नमामि
    ॥ १८॥ ससर्ज यो वक्त्रत एव विप्रान् भुजान्तरे क्षत्रमथोरुयुग्मे । विशः पदाग्रेषु तथैव शूद्रान् नमामि
    तं विश्वतनुं पुराणम् ॥ १९॥ परात्परं पारगतं प्रमेयं युधाम्पतिं कार्यत एव कृष्णम् । गदासिचर्मण्यभृतोत्थपाणिं
    नमामि नारायणमप्रमेयम् ॥ २०॥ इति वराहपुराणे तृतीयाध्यायान्तर्गता नारदकृता विष्णुस्तुतिः समाप्ता । वराहपुराण
    । अध्याय ३
