id: jabali
category: upanishad
name:
  english: jabali
  devanagari: जबलि
content:
  english: pasanaditi | punah sa tamuvaca bhagavankripaya me sarahasyam sarvam nivedayeti | sa tena prishtah
    sarvam nivedayamasa tattvam | pashupatirahankaravishtah samsari jivah sa eva pashuh | sarvajnah pancakrityasampannah
    sarveshvara ishah pashupatih | ke pashava iti punah sa tamuvaca jivah pashava uktah | tatpatitvatpashupatih
    | sa punastam hovaca katham jivah pashava iti | katham tatpatiriti | sa tamuvaca yatha trinashino
    vivekahinah parapreshyah krishyadikarmasu niyuktah sakaladuhkhasahah svasvamibadhyamana gavadayah
    pashavah | yatha tatsvamina iva sarvajna ishah pashupatih | tajjnanam kenopayena jayate | punah sa
    tamuvaca vibhutidharanadeva | tatprakarah kathamiti | kutrakutra dharyam | punah sa tamuvaca sadyojatadipancabrahmamantrairbhasma
    samgrihyagniriti bhasmetyanenabhimantrya manastoka iti samuddhritya jalena samsrijya tryayupamiti
    shirolalatavakshahskandheshviti tisribhistryayupaistriyambakaistisro rekhah prakurvita | vratametacchambhavam
    sarveshu vedeshu vedavadibhiruktam bhavati | tatsamacarenmumukshurna punarbhavaya | atha sanatkumarah
    pramanam pricchati | tripundradharanasya tridhah rekha alalatadacakshushorabhruvormadhyatashca | yasya
    prathama rekha sa garhapatyashcakaro rajo bhurlokah svatma kriyashaktih rigvedah pratahsavanam prajapatirdevo
    devateti | yasya dvitiya rekha sa dakshinagnirukarah satvamantarikshamantaratma cecchashaktiryajurvedo
    madhyandinasavanam vishnurdevo devateti | yasya tritiya rekha sahavaniyo makarastamo dyaurlokah paramatma
    jnanashaktih samavedastritiyasavanam mahadevo devateti tripundram bhasmana karoti | yo vidvanbrahmacari
    grihi vanaprastho yatirva sa mahapatakopapatakebhyah puto bhavati | sa sarvandevandhyato bhavati |
    sa sarveshu tirtheshu snato bhavati | sa sakalarudramantrajapi bhavati | na sa punaravartate na sa
    punaravartate || iti | om satyamityupanishat || om apyayantu mamangani vakpranashcakshuh shrotramatho
    balamindriyani ca || sarvani sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    mestu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih
    || harih om tatsat || iti shrijabalyupanishatsamapta ||
  devanagari: पासनादिति । पुनः स तमुवाच भगवन्कृपया मे सरहस्यं सर्वं निवेदयेति । स तेन पृष्टः सर्वं निवेदयामास
    तत्त्वम् । पशुपतिरहङ्काराविष्टः संसारी जीवः स एव पशुः । सर्वज्ञः पञ्चकृत्यसम्पन्नः सर्वेश्वर ईशः पशुपतिः
    । के पशव इति पुनः स तमुवाच जीवाः पशव उक्ताः । तत्पतित्वात्पशुपतिः । स पुनस्तं होवाच कथं जीवाः पशव
    इति । कथं तत्पतिरिति । स तमुवाच यथा तृणाशिनो विवेकहीनाः परप्रेष्याः कृष्यादिकर्मसु नियुक्ताः सकलदुःखसहाः
    स्वस्वामिबध्यमाना गवादयः पशवः । यथा तत्स्वामिन इव सर्वज्ञ ईशः पशुपतिः । तज्ज्ञानं केनोपायेन जायते
    । पुनः स तमुवाच विभूतिधारणादेव । तत्प्रकारः कथमिति । कुत्रकुत्र धार्यम् । पुनः स तमुवाच सद्योजातादिपञ्चब्रह्ममन्त्रैर्भस्म
    संगृह्याग्निरिति भस्मेत्यनेनाभिमन्त्र्य मानस्तोक इति समुद्धृत्य जलेन संसृज्य त्र्यायुपमिति शिरोललाटवक्षःस्कन्धेष्विति
    तिसृभिस्त्र्यायुपैस्त्रियम्बकैस्तिस्रो रेखाः प्रकुर्वीत । व्रतमेतच्छाम्भवं सर्वेषु वेदेषु वेदवादिभिरुक्तं
    भवति । तत्समाचरेन्मुमुक्षुर्न पुनर्भवाय । अथ सनत्कुमारः प्रमाणं पृच्छति । त्रिपुण्ड्रधारणस्य त्रिधः
    रेखा आललाटादाचक्षुषोराभ्रुवोर्मध्यतश्च । यास्य प्रथमा रेखा सा गार्हपत्यश्चाकारो रजो भूर्लोकः स्वात्मा
    क्रियाशक्तिः ऋग्वेदः प्रातःसवनं प्रजापतिर्देवो देवतेति । यास्य द्वितीया रेखा सा दक्षिणाग्निरुकारः
    सत्वमन्तरिक्षमन्तरात्मा चेच्छाशक्तिर्यजुर्वेदो माध्यन्दिनसवनं विष्णुर्देवो देवतेति । यास्य तृतीया
    रेखा साहवनीयो मकारस्तमो द्यौर्लोकः परमात्मा ज्ञानशक्तिः सामवेदस्तृतीयसवनं महादेवो देवतेति त्रिपुण्ड्रं
    भस्मना करोति । यो विद्वान्ब्रह्मचारी गृही वानप्रस्थो यतिर्वा स महापातकोपपातकेभ्यः पूतो भवति । स सर्वान्देवान्ध्यातो
    भवति । स सर्वेषु तीर्थेषु स्नातो भवति । स सकलरुद्रमन्त्रजापी भवति । न स पुनरावर्तते न स पुनरावर्तते
    ॥ इति । ॐ सत्यमित्युपनिषत् ॥ ॐ आप्यायन्तु मामाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च
    ॥ सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेस्तु
    तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत्
    ॥ इति श्रीजाबाल्युपनिषत्समाप्ता ॥
