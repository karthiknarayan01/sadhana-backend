id: vibhishanakritamramanathastotram
category: stotram
name:
  english: vibhishanakritamramanathastotram
  devanagari: विभीषणकृतंरामनाथस्तोत्रम्
content:
  english: vibhishanakritam ramanathastotram vibhishana uvaca | samsaravanamadhye mam vinashtanijamargake
    | vyadhicaure krodhasimhe janmavyaghre layorage || 43|| balyayauvanavardhakyamahabhimandhakupake |
    krodhershyalobhavahnau ca vishayakruraparvate || 44|| trasabhukantakadhye ca sidantamadhunandhakam
    | shobhanam padavim shambho naya rameshvaradhuna || 45|| vibhishanasaciva ucuh | varadaya varenyaya
    trinetraya trishuline | yogidhyeyaya nityaya ramanathaya te namah || 92|| iti shriskandapurane brahmakhande
    setukhande ekonapancashattamadhyayantargatam vibhishanadikritam ramanathastotram samaptam | skandapurana
    | brahmakhanda | setulkhanda | adhyaya 49
  devanagari: विभीषणकृतं रामनाथस्तोत्रम् विभीषण उवाच । संसारवनमध्ये मां विनष्टनिजमार्गके । व्याधिचौरे
    क्रोधसिंहे जन्मव्याघ्रे लयोरगे ॥ ४३॥ बाल्ययौवनवार्धक्यमहाभीमान्धकूपके । क्रोधेर्ष्यालोभवह्नौ च विषयक्रूरपर्वते
    ॥ ४४॥ त्रासभूकण्टकाढ्ये च सीदन्तमधुनान्धकम् । शोभनां पदवीं शम्भो नय रामेश्वराधुना ॥ ४५॥ विभीषणसचिवा
    ऊचुः । वरदाय वरेण्याय त्रिनेत्राय त्रिशूलिने । योगिध्येयाय नित्याय रामनाथाय ते नमः ॥ ९२॥ इति श्रीस्कन्दपुराणे
    ब्रह्मखण्डे सेतुखण्डे एकोनपञ्चाशत्तमाध्यायान्तर्गतं विभीषणादिकृतं रामनाथस्तोत्रं समाप्तम् । स्कन्दपुराण
    । ब्रह्मखण्ड । सेतुल्खण्ड । अध्याय ४९
