id: bhavani-ashtakam
category: stotram
name:
  english: Bhavani Ashtakam
content:
  english: na tato na mata na bandhurna data na putro na putri na bhrityo na bharta na jaya na vidya na
    vrittirmamaiva gatistvam gatistvam tvameka bhavani || || bhavabdhavapare mahaduhkhabhiru papata prakami
    pralobhi pramattah kusamsarapashaprabaddhah sadaham gatistvam gatistvam tvameka bhavani || || na janami
    danam na ca dhyanayogam na janami tantram na ca stotramantram na janami pujam na ca nyasayogam gatistvam
    gatistvam tvameka bhavani || || na janami punyam na janami tirtham na janami muktim layam va kadacit
    na janami bhaktim vratam vapi matah gatistvam gatistvam tvameka bhavani || || kukarmi kusangi kubuddhih
    kudasah kulacarahinah kadacaralinah kudrishtih kuvakyaprabandhah sadaham gatistvam gatistvam tvameka
    bhavani || || prajesham ramesham mahesham suresham dinesham nishitheshvaram va kadacit na janami canyat
    sadaham sharanye gatistvam gatistvam tvameka bhavani || || vivade vishade pramade pravase jale canale
    parvate shatrumadhye aranye sharanye sada mam prapahi gatistvam gatistvam tvameka bhavani || || anatho
    daridro jararogayukto mahakshinadinah sada jadyavaktrah vipattau pravishtah pranashtah sadaham gatistvam
    gatistvam tvameka bhavani || || || iti shrimadadishankaracaryaviracitam bhavanyashtakam sampurnam
    ||
  devanagari: न तातो न माता न बन्धुर्न दाता न पुत्रो न पुत्री न भृत्यो न भर्ता न जाया न विद्या न वृत्तिर्ममैव
    गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥ ॥ भवाब्धावपारे महादुःखभीरु पपात प्रकामी प्रलोभी प्रमत्तः कुसंसारपाशप्रबद्धः
    सदाहं गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥ ॥ न जानामि दानं न च ध्यानयोगं न जानामि तन्त्रं न च स्तोत्रमन्त्रम्
    न जानामि पूजां न च न्यासयोगं गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥ ॥ न जानामि पुण्यं न जानामि तीर्थं
    न जानामि मुक्तिं लयं वा कदाचित् न जानामि भक्तिं व्रतं वापि मातः गतिस्त्वं गतिस्त्वं त्वमेका भवानि
    ॥ ॥ कुकर्मी कुसङ्गी कुबुद्धिः कुदासः कुलाचारहीनः कदाचारलीनः कुदृष्टिः कुवाक्यप्रबन्धः सदाहं गतिस्त्वं
    गतिस्त्वं त्वमेका भवानि ॥ ॥ प्रजेशं रमेशं महेशं सुरेशं दिनेशं निशीथेश्वरं वा कदाचित् न जानामि चान्यत्
    सदाहं शरण्ये गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥ ॥ विवादे विषादे प्रमादे प्रवासे जले चानले पर्वते
    शत्रुमध्ये अरण्ये शरण्ये सदा मां प्रपाहि गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥ ॥ अनाथो दरिद्रो जरारोगयुक्तो
    महाक्षीणदीनः सदा जाड्यवक्त्रः विपत्तौ प्रविष्टः प्रनष्टः सदाहं गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥
    ॥ ॥ इति श्रीमदादिशङ्कराचार्यविरचितं भवान्यष्टकं सम्पूर्णम् ॥
