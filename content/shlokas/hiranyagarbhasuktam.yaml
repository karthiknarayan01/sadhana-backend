id: hiranyagarbhasuktam
category: sukta
name:
  english: hiranyagarbhasuktam
  devanagari: हिरण्यगर्भसूक्तम्
content:
  english: 10 svararahitam | hiranyagarbhah samavartatagre bhutasya jatah patireka asit | sa dadhara prithivim
    dyamutemam kasmai devaya havisha vidhema || 10
  devanagari: १० स्वररहितम् । हिरण्यगर्भः समवर्तताग्रे भूतस्य जातः पतिरेक आसीत् । स दाधार पृथिवीं द्यामुतेमां
    कस्मै देवाय हविषा विधेम ॥ १०
meaning: {}
