id: avyaktopanishat
category: upanishad
name:
  english: avyaktopanishat
  devanagari: अव्यक्तोपनिषत्
content:
  english: upanishad avyaktopanishat svajnanasuraradgrasasvajnananarakesari | pratiyogivinirmuktam brahmamatram
    karotu mam || om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca || sarvani sarvam
    brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakarana mastvanirakaranam mestu
    tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih ||
    harih om | pura kiledam na kimcannasinna dyaurnantariksham na prithivi kevalam jyotirupamanadyanantamananvasthularupamarupam
    rupavadavijneyam jnanarupamanandamayamasit | tadananyattaddvedhabhuddharitamekam raktamaparam | tatra
    yadraktam tatpumso rupamabhut | yaddharitam tanmayayah | tau samagacchatah | tayorviryamevamanandat
    | tadavardhata | tadandamabhudhaimam | tatparinamamanamabhut | tatah parameshthi vyajayata | so'bhijijnasata
    kim me kulam kim me krityamiti | tam ha vagadrishyamanabhyuvaca bhobho prajapate tvamavyaktadutpanno'si
    vyaktam te krityamiti | kimavyaktam yasmadahamasisham | kim tadvyaktam yanme krityamiti | sabravidavijneyam
    hi tatsaumya tejah | yadavijneyam tadavyaktam | taccejjijnasasi mavagaccheti | sa hovaca kaisha tvam
    brahmavagyadasi shamsatmanamiti | sa tvabravittapasa mam vijijnasasveti | sa ha sahasram sama brahmacaryamadhyuvasadhyuvasa
    || 1|| athapashyadricamanushtubhim paramam vidyam yasyanganyanye mantrah | yatra brahma pratishthitam
    | vishvedevah pratishthitah | yastam na veda kimanyairvedaih karishyati | tam viditva sa ca raktam
    jijnasayamasa | tamevamanucanam gayannasishta | sahasram sama adyantanihitonkarena padanyagayat |
    sahasram samastathaivaksharashah | tato'pashyajjyotirmayam shriyalingitam suparnaratham sheshaphanacchaditamaulim
    mrigamukham naravapusham shashisuryahavyavahanatmakanayanatrayam | tatah prajapatih pranipapata namonama
    iti | tathaivarcatha tamastaut | ugramityaha ugrah khalu va esha mrigarupatvat | viramityaha viro
    va esha viryavattvat | mahavishnumityaha mahatam va ayam mahanrodasi vyapya sthitah | jvalantamityaha
    jvalanniva khalvasavavasthitah | sarvatomukhamityaha sarvatah khalvayam mukhavanvishvarupatvat | nrisimhamityaha
    yatha yajurevaitat | bhishanamityaha bhisha va asmadaditya udeti bhitashcandrama bhito vayurvati bhito'gnirdahati
    bhitah parjanyo varshati | bhadramityaha bhadrah khalvayam shriya jushtah | mrityormrityumityaha mrityorva
    ayam mrityuramritatvam prajanamannadanam | namamityaha yatha yajurevaitat | ahamityaha yatha yajurevaitat
    || 2|| atha bhagavamstamabravitprajapate prito'ham kim tavepsitam tadashamseti | sa hovaca bhagavannavyaktadutpanno'smi
    vyaktam mama krityamiti purashravi | tatravyaktam bhavanityajnayi vyaktam me kathayeti | vyaktam vai
    vishvam caracaratmakam | yadvyajyate tadvyaktasya vyaktatvamiti | sa hovaca na shaknomi jagatsrashtumupayam
    me kathayeti | tamuvaca purushah prajapate shrinu srishterupayam paramam yam viditva sarvam jnasyasi
    | sarvatra shakshyasi sarvam karishyasi | mayyagnau svatmanam havirdhyayettayaivanushtubharca | dhyanayajno'yameva
    | etadvai mahopanishaddevanam guhyam | na ha va etasya samna narca na yajushartho nu vidyate | ya
    ima veda sa sarvankamanavapya sarvamllokanjitva mamevabhyupaiti na sa punaravartate ya evam vedeti
    || 3|| prajapatistam yajnayam vasiyamsamatmanam manyamano manoyajneneje | sapranavaya tayaivarca havirdhyatvatmana
    matmanyagnau juhuyat | sarvamajanatsarvatrashakatsarvamakarot | ya evamvidvanimam dhyanayajnamanutishthetsa
    sarvajno'nantashaktih sarvakarta bhavati | sa sarvam|
  devanagari: उपनिषद् अव्यक्तोपनिषत् स्वाज्ञानासुरराड्ग्रासस्वज्ञाननरकेसरी । प्रतियोगिविनिर्मुक्तं ब्रह्ममात्रं
    करोतु माम् ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च ॥ सर्वाणि सर्वं
    ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरण मस्त्वनिराकरणं मेस्तु तदात्मनि
    निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ । पुरा किलेदं
    न किंचन्नासीन्न द्यौर्नान्तरिक्षं न पृथिवी केवलं ज्योतीरूपमनाद्यनन्तमनण्वस्थूलरूपमरूपं रूपवदविज्ञेयं
    ज्ञानरूपमानन्दमयमासीत् । तदनन्यत्तद्द्वेधाभूद्धरितमेकं रक्तमपरम् । तत्र यद्रक्तं तत्पुंसो रूपमभूत्
    । यद्धरितं तन्मायायाः । तौ समगच्छतः । तयोर्वीर्यमेवमनन्दत् । तदवर्धत । तदण्डमभूधैमम् । तत्परिणममानमभूत्
    । ततः परमेष्ठी व्यजायत । सोऽभिजिज्ञासत किं मे कुलं किं मे कृत्यमिति । तं ह वागदृश्यमानाभ्युवाच भोभो
    प्रजापते त्वमव्यक्तादुत्पन्नोऽसि व्यक्तं ते कृत्यमिति । किमव्यक्तं यस्मादहमासिषम् । किं तद्व्यक्तं
    यन्मे कृत्यमिति । साब्रवीदविज्ञेयं हि तत्सौम्य तेजः । यदविज्ञेयं तदव्यक्तम् । तच्चेज्जिज्ञाससि मावगच्छेति
    । स होवाच कैषा त्वं ब्रह्मवाग्यदसि शंसात्मानमिति । सा त्वब्रवीत्तपसा मां विजिज्ञासस्वेति । स ह सहस्रं
    समा ब्रह्मचर्यमध्युवासाध्युवास ॥ १॥ अथापश्यदृचमानुष्टुभीं परमां विद्यां यस्याङ्गान्यन्ये मन्त्राः
    । यत्र ब्रह्म प्रतिष्ठितम् । विश्वेदेवाः प्रतिष्ठिताः । यस्तां न वेद किमन्यैर्वेदैः करिष्यति । तां
    विदित्वा स च रक्तं जिज्ञासयामास । तामेवमनूचानां गायन्नासिष्ट । सहस्रं समा आद्यन्तनिहितोङ्कारेण पदान्यगायत्
    । सहस्रं समास्तथैवाक्षरशः । ततोऽपश्यज्ज्योतिर्मयं श्रियालिङ्गितं सुपर्णरथं शेषफणाच्छदितमौलिं मृगमुखं
    नरवपुषं शशिसूर्यहव्यवाहनात्मकनयनत्रयम् । ततः प्रजापतिः प्रणिपपात नमोनम इति । तथैवर्चाथ तमस्तौत् ।
    उग्रमित्याह उग्रः खलु वा एष मृगरूपत्वात् । वीरमित्याह वीरो वा एष वीर्यवत्त्वात् । महाविष्णुमित्याह
    महतां वा अयं महान्रोदसी व्याप्य स्थितः । ज्वलन्तमित्याह ज्वलन्निव खल्वसाववस्थितः । सर्वतोमुखमित्याह
    सर्वतः खल्वयं मुखवान्विश्वरूपत्वात् । नृसिंहमित्याह यथा यजुरेवैतत् । भीषणमित्याह भीषा वा अस्मादादित्य
    उदेति भीतश्चन्द्रमा भीतो वायुर्वाति भीतोऽग्निर्दहति भीतः पर्जन्यो वर्षति । भद्रमित्याह भद्रः खल्वयं
    श्रिया जुष्टः । मृत्योर्मृत्युमित्याह मृत्योर्वा अयं मृत्युरमृतत्वं प्रजानामन्नादानाम् । नमामीत्याह
    यथा यजुरेवैतत् । अहमित्याह यथा यजुरेवैतत् ॥ २॥ अथ भगवांस्तमब्रवीत्प्रजापते प्रीतोऽहं किं तवेप्सितं
    तदाशंसेति । स होवाच भगवन्नव्यक्तादुत्पन्नोऽस्मि व्यक्तं मम कृत्यमिति पुराश्रावि । तत्राव्यक्तं भवानित्यज्ञायि
    व्यक्तं मे कथयेति । व्यक्तं वै विश्वं चराचरात्मकम् । यद्व्यज्यते तद्व्यक्तस्य व्यक्तत्वमिति । स होवाच
    न शक्नोमि जगत्स्रष्टुमुपायं मे कथयेति । तमुवाच पुरुषः प्रजापते शृणु सृष्टेरुपायं परमं यं विदित्वा
    सर्वं ज्ञास्यसि । सर्वत्र शक्ष्यसि सर्वं करिष्यसि । मय्यग्नौ स्वात्मानं हविर्ध्यायेत्तयैवानुष्टुभर्चा
    । ध्यानयज्ञोऽयमेव । एतद्वै महोपनिषद्देवानां गुह्यम् । न ह वा एतस्य साम्ना नर्चा न यजुषार्थो नु विद्यते
    । य इमा वेद स सर्वान्कामानवाप्य सर्वांल्लोकाञ्जित्वा मामेवाभ्युपैति न स पुनरावर्तते य एवं वेदेति ॥
    ३॥ प्रजापतिस्तं यज्ञायं वसीयांसमात्मानं मन्यमानो मनोयज्ञेनेजे । सप्रणवया तयैवर्चा हविर्ध्यात्वात्मान
    मात्मन्यग्नौ जुहुयात् । सर्वमजानात्सर्वत्राशकत्सर्वमकरोत् । य एवंविद्वानिमं ध्यानयज्ञमनुतिष्ठेत्स
    सर्वज्ञोऽनन्तशक्तिः सर्वकर्ता भवति । स सर्वां।
