id: nakshatra-suktam-nakshatreshti
category: stotram
name:
  english: Nakshatra Suktam (Nakshatreshti)
content:
  english: agnih om agnirnah patu krittikah | nakshatra ndevamindriyam | idamasam vi~cakshanam | havirasa
    njuhotana | yasya bhanti rashmayo yasya ketavah | yasyema vishva bhuvanani sarva va~sanah | agnirno
    devassuvite dadhatu || prajapatih prajapate rohinivetu patni | vishvarupa brihati citrabhanuh | sa
    no yajnasya suvite dadhatu | yatha jivema sharadassavirah | rohini devyudagatpurasta t | vishva rupani
    pratimodamana | prajapatigm havisha vardhayanti | priya devana somah somo raja mrigashirshena agann
    | shiva mpriyamasya dhama | apyayamano bahudha janeshu | retah prajam ya~jamane dadhatu | yatte nakshatra
    mmrigashirshamasti | priyagm raja m | tasmai te soma havisha vidhema | shanna edhi dvipade shancatushpade
    || rudrah ardraya rudrah prathama na eti | shreshtho devana m | nakshatramasya havisha vidhema | ma
    nah prajagm ririshanmota viran | heti rudrasya parino vrinaktu | ardra nakshatra njushatagm havirnah
    | pramuncamanau duritani vishva aditih punarno devyaditi sprinotu | punarvasu nah punaretam ya~jnam
    | punarno deva abhiyantu sarve | punah punarvo havisha yajamah | eva na devya ditiranarva | vishvasya
    bhartri jagatah pratishtha | punarvasu havisha vardhayanti | priya brihaspatih brihaspatih prathamanjayamanah
    | tishya nnakshatramabhi sambabhuva | shreshtho devana mpritanasu jishnuh | disho 'nu sarva abhayanno
    astu | tishyah purastaduta madhyato nah | brihaspatirnah paripatu pashcat | badhe tandvesho abhaya
    nkrinutam | suviryasya patayasyama || sarpah idagm sarpebhyo havirastu jushta m | ashresha yeshamanuyanti
    cetah | ye antariksha kshiyanti | tena ssarpaso havamagamishthah | ye rocane suryasyapi sarpah | ye
    diva manusancaranti | yeshamashresha anuyanti kama pitarah upahutah pitaro ye maghasu | manojavasa
    ssukrityah | te no nakshatre havamagamishthah | svadhabhiryajna njushantam | ye agnidagdha ye shca
    vidmayagm u ca na pravidma | maghasu yajnagm sukrita namasi tvam | tadaryamanvaruna mitra caru | ta
    ntva vayagm sanitaragm saninam | jiva jivantamupa sam vi~shema | yenema vishva bhuvanani sanjita |
    yasya deva anusam ya~nti cetah | aryama raja 'jarastu vishman | phalgunina bhagah shreshtho devana
    mbhagavo bhagasi | tattva viduh phalguni stasya vittat | asmabhyam kshatramajaragm suvirya deha |
    bhagoha data bhaga itpradata | bhago devih phalguni ravivesha | bhagasyetta ngamema | yatra devai
    ssavito payatu | hiranyayena suvrita rathena | vahana vi~dmanapasam | prayacchanta mpunyamaccha |
    hastah prayaccha tvamritam va~siyah | dakshinena pratigribhnima enat | datara madya savita videya
    | yo no hastaya prasuvati yajnam || tvashta tvashta nakshatra mabhyeti citram | subhagm sasam yu~vatigm
    rocamanam | niveshaya nmartyagshca | rupani pigmsha | tannastvashta tadu citra vicashtam | tannakshatra
    mbhurida astu mahya vi~ravatigm sanotu | gobhirno ashvai ssamanaktu yajnam || m | tigmashringo vrishabho
    roruvanah | samiraya | apa dveshagmsi nudatamaratih | tanno vayastadu nishtya shrinotu | tannakshatra
    mbhurida astu mahya m | tanno devaso anu janantu kama m | yatha tarema duritani vishva indragni duramasmacchatravo
    yantu bhitah | tadindragni krinuta ntadvishakhe | tanno deva anumadantu yajnam | pashca dabhayanno
    astu | nakshatrana madhipatni vishakhe | shreshtha vindragni bhuvanasya gopau | vishuca shshatrunapabadhamanau
    | apakshudha paurnamasi purna pashcaduta purna purasta rnamasi jigaya | tasya va~santah | uttame naka
    iha madayantam | prithvi suvarca yuvati | paurnamasyudaga cchobhamana | apyayayanti duritani vishva
    mitrah riddhyasma havyai mmitradheyanno astu | anuradhan havisha vardhayantah | shata t | anuradha
    sa iti yadvadanti | tanmitra eti pathibhi jyeshtha manu nakshatrameti | yasmin vritram vri~tra turye
    tatara | tasminvaya nduhanah | kshudhantarema duriti ndurishtim | purandaraya vrishabhaya dhrishnave
    | ashadhaya sahamanaya midhushe | indraya jyeshtha madhumadduhana | uru nkrinotu yajamanaya lokam
    || ritih paraca | gobhi m | aharno adya suvite dadhatu | mula nnakshatramiti yadvadanti | paracim
    mprajayai shivamastu mahya apah ya divya apah payasa sambabhuvuh | ya antariksha uta parthiviryah
    | yasamashadha anuyanti kama syona bhavantu | yashca kupya yashca nadya | yashca vaishantiruta prasaciryah
    | yasamashadha madhu bhakshayanti | ta na apa vishvedevah tanno vishve upa shrinvantu devah | tadashadha
    abhisam ya~ntu yajnam | tannakshatra ryajamanaya kalpatam | shubhrah kanya yuvataya ssupeshasah |
    karmakrita ssukrito viryavatih | vishva havisha vardhayantih | ashadhah kama mupayantu yajnam || thsarvametat
    | amunca loka midamuca sarva m | tanno nakshatra dvijitya | shriya hriniyamanam | ubhau lokau brahmana
    sanjitemau | tanno nakshatra dvicashtam | tasmin vaya mpritana ssanjayema | tanno devaso anujanantu
    kama vishnuh shrinvanti shrona mamritasya gopam | punyamasya upashrinomi vaca vi~shnupatni majuryam
    | pratici menagm havisha yajamah | tredha vishnu rurugayo vicakrame | mahi mantariksham | tacchronaiti
    shrava icchamana | punyagg shlokam ya~jamanaya krinvati || vasavah ashtau deva vasavassomyasah | catasro
    devi rajara shshravishthah | te yajna mamritagg svasti | yajna nnah pantu vasavah purasta 'bhiyantu
    shravishthah | punyannakshatramabhi sam vi~shama | ma no arati raghashagm sagann || varunah kshatrasya
    raja varuno 'dhirajah | nakshatranagm shatabhishag vasishthah | tau devebhyah krinuto dirghamayah
    | shatagm sahasra bheshajani dhattah | yajnanno raja varuna upayatu | tanno vishve abhisam ya~ntu
    devah | tanno nakshatragm shatabhishag jushanam | dirghamayuh pratira ajayekapadah aja ekapa t | vishva
    bhutani prati modamanah | tasya devah prasavam | proshthapadaso amritasya gopah | vibhrajamana ssamidhana
    ugrah | a dgandyam | tagm surya majamekapadam | proshthapadaso anuyanti sarve rbudhniyah prathamana
    eti | shreshtho devanamuta manushanam | ta ssomyasah | proshthapadaso abhirakshanti sarve | catvara
    ekamabhi karma devah | proshthapadasa iti yan vadanti | te budhniya mparishadyagg stuvantah | ahigm
    rakshanti namasopa sadya || pusha pusha revatyanveti pantha m | pushtipati pashupa vajabastyau | imani
    havya prayata jushana | sugairno yanairupayatam ya~jnam | kshudra nrakshatu revati nah | gavo no ashvagm
    anvetu pusha | annagm rakshantau bahudha virupam | vajagm sanutam ashvini deva tadashvina payatam
    | shubhangamishthau suyamebhirashvaih | svannakshatragm havisha yajantau | maddhva sampriktau yajusha
    samaktau | yau devana mbhishajau havyavahau | vishvasya duta vamritasya gopau | tau nakshatram rbharantu
    | tadyamo raja bhagavan vicashtam | lokasya raja mahato mahan hi | sugannah panthamabhaya nnakshatre
    yama eti raja mabhyashincanta devah | tadasya citragm havisha yajama | apa papmana amavasi niveshani
    sangamani vasunam vi~shva rupani vasu veshayanti | sahasra poshagm subhaga rarana sa na agan varcasa
    sam vi~dana | yatte deva adadhu va~santo mahitva | sa no yajna mpiprihi vishvavare rayinno dhehi subhage
    suvira candrama navo navo bhavati jayamano ndevebhyo vidadhatyaya stiriti dirghamayuh || yamaditya
    agmshuma pyayayanti yamakshita makshitayah pibanti | tena no raja varuno brihaspati rapyayayantu bhuvanasya
    gopah || aho ratra ye virupe samanasa sam | vibhu prabhu anubhu vishvato huve | te no nakshatre havamaga
    ndevi brahmana sam vi~danah | suratnaso devaviti ndadhanah | ahoratre havisha vardhayantah | ati papmana
    usha pratyuva drishyayati | vyucchanti duhita divah | apo mahi vrinute cakshusha | tamo jyotish ssacate
    suryah | sa ca udyannakshatra marcimat | ta vedusho vyushi suryasya ca | sambhaktena gamemahi || nakshatrah
    tanno nakshatra marcimat | bhanumatteja uccharat | upayajna mihagamat | pranakshatraya devaya | indrayendugm
    havamahe | sa na ssavita suvathsanim | pushtidam va~hanti ketavah | drishe vishvaya surya ndevana
    mudagadanika rmitrasya varunasyagneh | a 'pra dyavaprithivi antarikshagm surya atma jagatastasthushashca
    || aditih aditirna urushya shsharma yacchatu | aditih patvagm hasah| mahimushu mataragm suvratana
    mritasya patni mavase huvema | tuvikshatra majaranti murucigm susharmana maditigm supranitim || rvicakrame
    tredha nidadhe padam | samudhamasya pagm sure | pratadvishnu stavate viryaya | mrigo na bhimah kucaro
    girishthah | yasyorushu trishu vikramaneshu | adhikshiyanti bhuvanani vishva rdha divah kakutpatih
    prithivya ayam | apagm retagmsi jinvati | bhuvo yajnasya rajasashca neta yatra niyudbhi ssacase shivabhih
    | divi mud njihvamagne cakrishe havyavaham ndeveshu manyatam | agnishca havyavahano bhavata ndashushe
    mayah | anvidanumate tva mmanyasai shanca nah kridhi | kratve dakshaya no hinu prana ayugmshi tarishah
    || mpritanasu jishnum | jyotishmanta mpurandhim | agnigg svishta kritamahuvema | svishta magne abhita
    tprinahi | vishva deva pritana abhishya | urunnah pantha mpradishan vibhahi | jyotishmaddhehya jaranna
    ayuh ||
  devanagari: अग्निः ॐ अ॒ग्निर्नः॑ पातु॒ कृत्ति॑काः । नक्ष॑त्र न्दे॒वमि॑न्द्रि॒यम् । इ॒दमा॑सां विँचक्ष॒णम्
    । ह॒विरा॒स ञ्जु॑होतन । यस्य॒ भान्ति॑ र॒श्मयो॒ यस्य॑ के॒तवः॑ । यस्ये॒मा विश्वा॒ भुव॑नानि॒ सर्वा वँसा॑नः
    । अ॒ग्निर्नो॑ दे॒वस्सु॑वि॒ते द॑धातु ॥ प्रजापतिः प्र॒जाप॑ते रोहि॒णीवे॑तु॒ पत्नी । वि॒श्वरू॑पा बृह॒ती
    चि॒त्रभा॑नुः । सा नो॑ य॒ज्ञस्य॑ सुवि॒ते द॑धातु । यथा॒ जीवे॑म श॒रद॒स्सवी॑राः । रो॒हि॒णी दे॒व्युद॑गात्पु॒रस्ता
    त् । विश्वा॑ रू॒पाणि॑ प्रति॒मोद॑माना । प्र॒जाप॑तिग्ं ह॒विषा॑ व॒र्धय॑न्ती । प्रि॒या दे॒वाना॒ सोमः सोमो॒
    राजा॑ मृगशी॒र्॒षेण॒ आगन्न्॑ । शि॒व म्प्रि॒यम॑स्य॒ धाम॑ । आ॒प्याय॑मानो बहु॒धा जने॑षु । रेतः॑ प्र॒जां
    यँज॑माने दधातु । यत्ते॒ नक्ष॑त्र म्मृगशी॒र्॒षमस्ति॑ । प्रि॒यग्ं रा॑ज म् । तस्मै॑ ते सोम ह॒विषा॑ विधेम
    । शन्न॑ एधि द्वि॒पदे॒ शञ्चतु॑ष्पदे ॥ रुद्रः आ॒र्द्रया॑ रु॒द्रः प्रथ॑मा न एति । श्रेष्ठो॑ दे॒वाना॒
    म् । नक्ष॑त्रमस्य ह॒विषा॑ विधेम । मा नः॑ प्र॒जाग्ं री॑रिष॒न्मोत वी॒रान् । हे॒ती रु॒द्रस्य॒ परि॑णो
    वृणक्तु । आ॒र्द्रा नक्ष॑त्र ञ्जुषताग्ं ह॒विर्नः॑ । प्र॒मु॒ञ्चमा॑नौ दुरि॒तानि॒ विश्वा अदितिः पुन॑र्नो
    दे॒व्यदि॑ति स्पृणोतु । पुन॑र्वसू नः॒ पुन॒रेतां यँ॒ज्ञम् । पुन॑र्नो दे॒वा अ॒भिय॑न्तु॒ सर्वे । पुनः॑
    पुनर्वो ह॒विषा॑ यजामः । ए॒वा न दे॒व्य दि॑तिरन॒र्वा । विश्व॑स्य भ॒र्त्री जग॑तः प्रति॒ष्ठा । पुन॑र्वसू
    ह॒विषा॑ व॒र्धय॑न्ती । प्रि॒य बृहस्पतिः बृह॒स्पतिः॑ प्रथ॒मञ्जाय॑मानः । ति॒ष्य॑ न्नक्ष॑त्रम॒भि सम्ब॑भूव
    । श्रेष्ठो॑ दे॒वाना॒ म्पृत॑नासु जि॒ष्णुः । दि॒शो ऽनु॒ सर्वा॒ अभ॑यन्नो अस्तु । ति॒ष्यः॑ पु॒रस्ता॑दु॒त
    म॑ध्य॒तो नः॑ । बृह॒स्पति॑र्नः॒ परि॑पातु प॒श्चात् । बाधे॑ ता॒न्द्वेषो॒ अभ॑य ङ्कृणुताम् । सु॒वीर्य॑स्य॒
    पत॑यस्याम ॥ सर्पाः इ॒दग्ं स॒र्पेभ्यो॑ ह॒विर॑स्तु॒ जुष्ट म् । आ॒श्रे॒षा येषा॑मनु॒यन्ति॒ चेतः॑ । ये
    अ॒न्तरि॑क्ष क्षि॒यन्ति॑ । तेन॑ स्स॒र्पासो॒ हव॒माग॑मिष्ठाः । ये रो॑च॒ने सूर्य॒स्यापि॑ स॒र्पाः । ये
    दिव॑ मनु॑स॒ञ्चर॑न्ति । येषा॑माश्रे॒षा अ॑नु॒यन्ति॒ काम पितरः उप॑हूताः पि॒तरो॒ ये म॒घासु॑ । मनो॑जवस
    स्सुकृ॒त्याः । ते नो॒ नक्ष॑त्रे॒ हव॒माग॑मिष्ठाः । स्व॒धाभि॑र्य॒ज्ञ ञ्जुषन्ताम् । ये अ॑ग्निद॒ग्धा ये
    श्च॑ वि॒द्मयाग्ं उ॑ च॒ न प्र॑वि॒द्म । म॒घासु॑ य॒ज्ञग्ं सुकृ॑त नामसि॒ त्वम् । तद॑र्यमन्वरुण मित्र॒
    चारु॑ । त न्त्वा॑ व॒यग्ं स॑नि॒तारग्ं॑ सनी॒नाम् । जी॒वा जीव॑न्त॒मुप॒ सं विँ॑शेम । येने॒मा विश्वा॒ भुव॑नानि॒
    सञ्जि॑ता । यस्य॑ दे॒वा अ॑नुसं॒ यँन्ति॒ चेतः॑ । अ॒र्य॒मा राजा॒ ऽजर॒स्तु वि॑ष्मान् । फल्गु॑नीना भगः
    श्रेष्ठो॑ दे॒वाना म्भगवो भगासि । तत्त्वा॑ विदुः॒ फल्गु॑नी॒ स्तस्य॑ वित्तात् । अ॒स्मभ्यं॑ क्ष॒त्रम॒जरग्ं॑
    सु॒वीर्य दे॒ह । भगो॑ह दा॒ता भग॒ इत्प्र॑दा॒ता । भगो॑ दे॒वीः फल्गु॑नी॒ रावि॑वेश । भग॒स्येत्त ङ्ग॑मेम
    । यत्र॑ दे॒वै स्स॑वि॒तो प॑यातु । हि॒र॒ण्यये॑न सु॒वृता॒ रथे॑न । वह॒न॒ विँद्म॒नाप॑सम् । प्र॒यच्छ॑न्त॒
    म्पुण्य॒मच्छ॑ । हस्तः॒ प्रय॑च्छ त्व॒मृतं॒ वँसी॑यः । दक्षि॑णेन॒ प्रति॑गृभ्णीम एनत् । दा॒तार॑ म॒द्य
    स॑वि॒ता वि॑देय । यो नो॒ हस्ता॑य प्रसु॒वाति॑ य॒ज्ञम् ॥ त्वष्टा त्वष्टा॒ नक्ष॑त्र म॒भ्ये॑ति चि॒त्राम्
    । सु॒भग्ं स॑सं युँव॒तिग्ं रोच॑मानाम् । नि॒वे॒शय॑ न्मर्त्याग्॑श्च । रू॒पाणि॑ पि॒ग्ं॒श । तन्न॒स्त्वष्टा॒
    तदु॑ चि॒त्रा विच॑ष्टाम् । तन्नक्ष॑त्र म्भूरि॒दा अ॑स्तु॒ मह्य वीँ॒रव॑तीग्ं सनोतु । गोभि॑र्नो॒ अश्वै॒
    स्सम॑नक्तु य॒ज्ञम् ॥ म् । ति॒ग्मशृ॑ङ्गो वृष॒भो रोरु॑वाणः । स॒मी॒रय॒ । अप॒ द्वेषाग्ं॑सि नुदता॒मरा॑तीः
    । तन्नो॑ वा॒यस्तदु॒ निष्ट्या॑ शृणोतु । तन्नक्ष॑त्र म्भूरि॒दा अ॑स्तु॒ मह्य म् । तन्नो॑ दे॒वासो॒ अनु॑
    जानन्तु॒ काम म् । यथा॒ तरे॑म दुरि॒तानि॒ विश्वा इन्द्राग्नी दू॒रम॒स्मच्छत्र॑वो यन्तु भी॒ताः । तदि॑न्द्रा॒ग्नी
    कृ॑णुता॒ न्तद्विशा॑खे । तन्नो॑ दे॒वा अनु॑मदन्तु य॒ज्ञम् । प॒श्चा दभ॑यन्नो अस्तु । नक्ष॑त्राणा॒ मधि॑पत्नी॒
    विशा॑खे । श्रेष्ठा॑ विन्द्रा॒ग्नी भुव॑नस्य गो॒पौ । विषू॑च॒ श्शत्रू॑नप॒बाध॑मानौ । अप॒क्षुध॑ पौर्णमासि
    पू॒र्णा प॒श्चादु॒त पू॒र्णा पु॒रस्ता र्णमा॒सी जि॑गाय । तस्या वँस॑न्तः । उ॒त्त॒मे नाक॑ इ॒ह मा॑दयन्ताम्
