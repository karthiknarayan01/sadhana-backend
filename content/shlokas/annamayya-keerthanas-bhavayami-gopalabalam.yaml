id: annamayya-keerthanas-bhavayami-gopalabalam
category: stotram
name:
  english: Annamayya Keerthanas Bhavayami Gopalabalam
content:
  english: khanda capu pallavi bhavayami gopalabalam mana ssevitam tatpadam cintayeham sada || caranam
    kati ghatita mekhala khacitamani ghantika patala ninadena vibhrajamanam | kutila pada ghatita sankula
    shinjitenatam catula natana samujjvala vilasam || bhavayami gopalabalam ssevitam tatpadam cintayeham
    sada || niratakara kalita navanitam brahmadi sura nikara bhavana shobhita padam | tiruvenkatacala
    sthitam anupamam harim parama purusham gopalabalam || bhavayami gopalabalam ssevitam tatpadam cintayeham
    sada ||
  devanagari: खण्ड चापु पल्लवि भावयामि गोपालबालं मन स्सेवितं तत्पदं चिन्तयेहं सदा ॥ चरणं कटि घटित मेखला
    खचितमणि घण्टिका पटल निनदेन विभ्राजमानं । कुटिल पद घटित सङ्कुल शिञ्जितेनतं चटुल नटना समुज्ज्वल विलासं
    ॥ भावयामि गोपालबालं स्सेवितं तत्पदं चिन्तयेहं सदा ॥ निरतकर कलित नवनीतं ब्रह्मादि सुर निकर भावना शोभित
    पदं । तिरुवेङ्कटाचल स्थितं अनुपमं हरिं परम पुरुषं गोपालबालं ॥ भावयामि गोपालबालं स्सेवितं तत्पदं चिन्तयेहं
    सदा ॥
