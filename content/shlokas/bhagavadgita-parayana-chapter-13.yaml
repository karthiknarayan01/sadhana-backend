id: bhagavadgita-parayana-chapter-13
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 13
content:
  english: om shri paramatmane namah atha trayodasho'dhyayah kshetrakshetrajnavibhagayogah arjuna uvaca
    prakritim purusham caiva kshetram kshetrajnameva ca | etat veditumicchami jnanam jneyam ca keshava
    || || shri bhagavanuvaca idam shariram kaunteya kshetramityabhidhiyate | etadyo vetti tam prahuh kshetrajna
    iti tadvidah || || kshetrajnam capi mam viddhi sarvakshetreshu bharata | kshetrakshetrajnayorjnanam
    yattajjnanam matam mama || || tatkshetram yacca yadrikca yadvikari yatashca yat | sa ca yo yatprabhavashca
    tatsamasena me shrinu || || rishibhirbahudha gitam chandobhirvividhaih prithak | brahmasutrapadaishcaiva
    hetumadbhirvinishcitaih || || mahabhutanyahankarah buddhiravyaktameva ca | indriyani dashaikam ca
    panca cendriyagocarah || || iccha dveshah sukham duhkham sanghatashcetana dhritih | etatkshetram samasena
    savikaramudahritam || || amanitvamadambhitvam ahimsa kshantirarjavam | acaryopasanam shaucam sthairyamatmavinigrahah
    || || indriyartheshu vairagyam anahankara eva ca | janmamrityujaravyadhi || asaktiranabhishvangah
    putradaragrihadishu | nityam ca samacittatvam ishtanishtopapattishu || || mayi cananyayogena bhaktiravyabhicarini
    | viviktadeshasevitvam aratirjanasamsadi || || adhyatmajnananityatvam tattvajnanarthadarshanam | etajjnanamiti
    proktam ajnanam yadato'nyatha || || jneyam yattatpravakshyami yajjnatva'mritamashnute | anadimatparam
    brahma na sattannasaducyate || || sarvatah panipadam tat sarvato'kshishiromukham | sarvatah shrutimalloke
    sarvamavritya tishthati || || sarvendriyagunabhasam sarvendriyavivarjitam | asaktam sarvabhriccaiva
    nirgunam gunabhoktri ca || || bahirantashca bhutanam acaram carameva ca | sukshmatvattadavijneyam
    durastham cantike ca tat || || avibhaktam ca bhuteshu vibhaktamiva ca sthitam | bhutabhartri ca tajjneyam
    grasishnu prabhavishnu ca || || jyotishamapi tajjyotih tamasah paramucyate | jnanam jneyam jnanagamyam
    hridi sarvasya vishthitam || || iti kshetram tatha jnanam jneyam coktam samasatah | madbhakta etadvijnaya
    madbhavayopapadyate || || prakritim purusham caiva viddhyanadi ubhavapi | vikaramshca gunamshcaiva
    viddhi prakritisambhavan || || karyakaranakartritve hetuh prakritirucyate | purushah sukhaduhkhanam
    bhoktritve heturucyate || || purushah prakritistho hi bhunkte prakritijangunan | karanam gunasango'sya
    sadasadyonijanmasu || || upadrashta'numanta ca bharta bhokta maheshvarah | paramatmeti capyuktah dehe'sminpurushah
    parah || || ya evam vetti purusham prakritim ca gunaih saha | sarvatha vartamano'pi na sa bhuyo'bhijayate
    || || dhyanenatmani pashyanti kecidatmanamatmana | anye sankhyena yogena karmayogena capare || ||
    anye tvevamajanantah shrutva'nyebhya upasate | te'pi catitarantyeva mrityum shrutiparayanah || ||
    yavatsanjayate kincit sattvam sthavarajangamam | kshetrakshetrajnasamyogat tadviddhi bharatarshabha
    || || samam sarveshu bhuteshu tishthantam parameshvaram | vinashyatsvavinashyantam yah pashyati sa
    pashyati || || samam pashyanhi sarvatra samavasthitamishvaram | na hinastyatmana''tmanam tato yati
    param gatim || || prakrityaiva ca karmani kriyamanani sarvashah | yah pashyati tatha''tmanam akartaram
    sa pashyati || || yada bhutaprithagbhavam ekasthamanupashyati | tata eva ca vistaram brahma sampadyate
    tada || || anaditvannirgunatvat paramatmayamavyayah | sharirastho'pi kaunteya na karoti na lipyate
    || || yatha sarvagatam saukshmyat akasham nopalipyate | sarvatravasthito dehe tatha''tma nopalipyate
    || || yatha prakashayatyekah kritsnam lokamimam ravih | kshetram kshetri tatha kritsnam prakashayati
    bharata || || kshetrakshetrajnayorevam antaram jnanacakshusha | bhutaprakritimoksham ca ye viduryanti
    te param || || || om tatsaditi shrimadbhagavadgitasu upanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade
    kshetrakshetrajnavibhagayogo nama trayodasho'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ त्रयोदशोऽध्यायः क्षेत्रक्षेत्रज्ञविभागयोगः अर्जुन उवाच प्रकृतिं
    पुरुषं चैव क्षेत्रं क्षेत्रज्ञमेव च । एतत् वेदितुमिच्छामि ज्ञानं ज्ञेयं च केशव ॥ ॥ श्री भगवानुवाच
    इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते । एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः ॥ ॥ क्षेत्रज्ञं
    चापि मां विद्धि सर्वक्षेत्रेषु भारत । क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम ॥ ॥ तत्क्षेत्रं
    यच्च यादृक्च यद्विकारि यतश्च यत् । स च यो यत्प्रभावश्च तत्समासेन मे शृणु ॥ ॥ ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः
    पृथक् । ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्चितैः ॥ ॥ महाभूतान्यहङ्कारः बुद्धिरव्यक्तमेव च । इन्द्रियाणि
    दशैकं च पञ्च चेन्द्रियगोचराः ॥ ॥ इच्छा द्वेषः सुखं दुःखं सङ्घातश्चेतना धृतिः । एतत्क्षेत्रं समासेन
    सविकारमुदाहृतम् ॥ ॥ अमानित्वमदम्भित्वम् अहिंसा क्षान्तिरार्जवम् । आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः
    ॥ ॥ इन्द्रियार्थेषु वैराग्यम् अनहङ्कार एव च । जन्ममृत्युजराव्याधि ॥ असक्तिरनभिष्वङ्गः पुत्रदारगृहादिषु
    । नित्यं च समचित्तत्वम् इष्टानिष्टोपपत्तिषु ॥ ॥ मयि चानन्ययोगेन भक्तिरव्यभिचारिणी । विविक्तदेशसेवित्वम्
    अरतिर्जनसंसदि ॥ ॥ अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम् । एतज्ज्ञानमिति प्रोक्तम् अज्ञानं
    यदतोऽन्यथा ॥ ॥ ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वाऽमृतमश्नुते । अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते
    ॥ ॥ सर्वतः पाणिपादं तत् सर्वतोऽक्षिशिरोमुखम् । सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति ॥ ॥ सर्वेन्द्रियगुणाभासं
    सर्वेन्द्रियविवर्जितम् । असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च ॥ ॥ बहिरन्तश्च भूतानाम् अचरं चरमेव
    च । सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत् ॥ ॥ अविभक्तं च भूतेषु विभक्तमिव च स्थितम् । भूतभर्तृ
    च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च ॥ ॥ ज्योतिषामपि तज्ज्योतिः तमसः परमुच्यते । ज्ञानं ज्ञेयं ज्ञानगम्यं
    हृदि सर्वस्य विष्ठितम् ॥ ॥ इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः । मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते
    ॥ ॥ प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि । विकारांश्च गुणांश्चैव विद्धि प्रकृतिसम्भवान् ॥ ॥ कार्यकरणकर्तृत्वे
    हेतुः प्रकृतिरुच्यते । पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ॥ ॥ पुरुषः प्रकृतिस्थो हि भुङ्क्ते
    प्रकृतिजान्गुणान् । कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु ॥ ॥ उपद्रष्टाऽनुमन्ता च भर्ता भोक्ता महेश्वरः
    । परमात्मेति चाप्युक्तः देहेऽस्मिन्पुरुषः परः ॥ ॥ य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह । सर्वथा
    वर्तमानोऽपि न स भूयोऽभिजायते ॥ ॥ ध्यानेनात्मनि पश्यन्ति केचिदात्मानमात्मना । अन्ये साङ्ख्येन योगेन
    कर्मयोगेन चापरे ॥ ॥ अन्ये त्वेवमजानन्तः श्रुत्वाऽन्येभ्य उपासते । तेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः
    ॥ ॥ यावत्सञ्जायते किञ्चित् सत्त्वं स्थावरजङ्गमम् । क्षेत्रक्षेत्रज्ञसंयोगात् तद्विद्धि भरतर्षभ ॥ ॥
    समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् । विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ॥ ॥ समं पश्यन्हि
    सर्वत्र समवस्थितमीश्वरम् । न हिनस्त्यात्मनाऽऽत्मानं ततो याति परां गतिम् ॥ ॥ प्रकृत्यैव च कर्माणि क्रियमाणानि
    सर्वशः । यः पश्यति तथाऽऽत्मानम् अकर्तारं स पश्यति ॥ ॥ यदा भूतपृथग्भावम् एकस्थमनुपश्यति । तत एव च विस्तारं
    ब्रह्म सम्पद्यते तदा ॥ ॥ अनादित्वान्निर्गुणत्वात् परमात्मायमव्ययः । शरीरस्थोऽपि कौन्तेय न करोति न
    लिप्यते ॥ ॥ यथा सर्वगतं सौक्ष्म्यात् आकाशं नोपलिप्यते । सर्वत्रावस्थितो देहे तथाऽऽत्मा नोपलिप्यते
    ॥ ॥ यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः । क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ॥ ॥ क्षेत्रक्षेत्रज्ञयोरेवम्
    अन्तरं ज्ञानचक्षुषा । भूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम् ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु
    उपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे क्षेत्रक्षेत्रज्ञविभागयोगो नाम त्रयोदशोऽध्यायः
    ॥
