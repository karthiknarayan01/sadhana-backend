id: garudakritam1vishnustotram
category: stotram
name:
  english: garudakritam1vishnustotram
  devanagari: गरुडकृतं१विष्णुस्तोत्रम्
content:
  english: 10|| api ca | ashtashaktisahito vanamali pitacailakusumavalishobhah | pankajakaravirajitapadah
    patu mamavahitendriyavargah || 11|| bhaktahritkamalarajitamurtirdushtadaityadalanotthitakirtih | baddhaseturavita''shritalokah
    patu mamanudinam bhuvaneshah || 12|| sthiracalatrividhatapahimamshurbhasamanataranipratibhasah | eka
    eva bahudha kritavesho mayayavatu mahamatirishah || 13|| bhaktacintanakrite kritarupah shaishavena
    bahushasitabhupah | vedamarga urudha hitakari ritirishituriyam gunashali || 14|| yajnabhugghridayabandhanadhari
    vishvamurtirabalamshukahari | palane'pi mahatam bahudeho rasa esha tanumanavatannah || 15|| premabhaktipurushairupalabhyah
    purushah kritasamastanivasah | dasyavrindahrishito nijadasah prekshanaikakaruno'vatu vishvam || 16||
    kanthalambitatarakshunakhagrakrushtagoparamanikucabharah | lilaya yuvatibhih kritaveshah shesha esha
    bhavatadupashantyai || 17|| dandapanirayameva jananam shasitatmaniyamoktahitanam | pavanaya mahatamanushali
    vishvaduhkhashamano bhavatannah || 18|| iti shriskandapurane vaishnavakhande badarikashramamahatmye
    caturthadhyayantargatam garudakritam vishnustotram samaptam | skandapurana | vaishnavakhanda | badarikakhanda
    | adhyaya 4
  devanagari: १०॥ अपि च । अष्टशक्तिसहितो वनमाली पीतचैलकुसुमावलिशोभः । पङ्कजाकरविराजितपादः पातु मामवहितेन्द्रियवर्गः
    ॥ ११॥ भक्तहृत्कमलराजितमूर्तिर्दुष्टदैत्यदलनोत्थितकीर्तिः । बद्धसेतुरविताऽऽश्रितलोकः पातु मामनुदिनं
    भुवनेशः ॥ १२॥ स्थिरचलत्रिविधतापहिमांशुर्भासमानतरणिप्रतिभासः । एक एव बहुधा कृतवेषो माययावतु महामतिरीशः
    ॥ १३॥ भक्तचिन्तनकृते कृतरूपः शैशवेन बहुशासितभूपः । वेदमार्ग उरुधा हितकारी रीतिरीशितुरियं गुणशाली ॥
    १४॥ यज्ञभुग्घृदयबन्धनधारी विश्वमूर्तिरबलांशुकहारी । पालनेऽपि महतां बहुदेहो रास एष तनुमानवतान्नः ॥
    १५॥ प्रेमभक्तिपुरुषैरुपलभ्यः पूरुषः कृतसमस्तनिवासः । दास्यवृन्दहृषितो निजदासः प्रेक्षणैककरुणोऽवतु
    विश्वम् ॥ १६॥ कण्ठलम्बिततरक्षुनखाग्रक्रुष्टगोपरमणीकुचभारः । लीलया युवतिभिः कृतवेषः शेष एष भवतादुपशान्त्यै
    ॥ १७॥ दण्डपाणिरयमेव जनानां शासितात्मनियमोक्तहितानाम् । पावनाय महतामनुशाली विश्वदुःखशमनो भवतान्नः ॥
    १८॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे बदरिकाश्रममाहात्म्ये चतुर्थाध्यायान्तर्गतं गरुडकृतं विष्णुस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । बदरिकाखण्ड । अध्याय ४
