id: kalleshvarastotram
category: stotram
name:
  english: kalleshvarastotram
  devanagari: कल्लेश्वरस्तोत्रम्
content:
  english: jiveshavishvasurayakshanrirakshasadyah yasmin sthitashca khalu yena viceshtitashca | yasmatparam
    na ca tatha''paramasti kincit kalleshvaram bhavabhayartiharam prapadye || 1|| yo nishkriyo vigatamayavibhuh
    pareshah nityo vikararahito bhuvi nirvikalpah | satyo'dvitiya iti yam shrutayo bruvanti kalleshvaram
    bhavabhayartiharam prapadye || 2|| kalpadrumam pranatabhaktahridandhakaram mayavilasamakhilam vinivartayantam
    | citsuryarupamakhilam vinivartayantam kalleshvaram bhavabhayartiharam prapadye || 3|| stotram kalleshvarasyedam
    satkamitasuradrumam | pathanti ye narastesham bhavabandho'pi nashyati || iti shrimat paramahamsaparivrajakacarya
    sadguru bhagavan shridharasvamimaharajaviracitam shrikalleshvarastotram sampurnam | racanasthanam
  devanagari: जीवेशविश्वसुरयक्षनृराक्षसाद्याः यस्मिन् स्थिताश्च खलु येन विचेष्टिताश्च । यस्मात्परं न च
    तथाऽऽपरमस्ति किञ्चित् कल्लेश्वरं भवभयार्तिहरं प्रपद्ये ॥ १॥ यो निष्क्रियो विगतमायविभुः परेशः नित्यो
    विकाररहितो भुवि निर्विकल्पः । सत्योऽद्वितीय इति यं श्रुतयो ब्रुवन्ति कल्लेश्वरं भवभयार्तिहरं प्रपद्ये
    ॥ २॥ कल्पद्रुमं प्रणतभक्तहृदन्धकारं मायाविलासमखिलं विनिवर्तयन्तम् । चित्सूर्यरूपमखिलं विनिवर्तयन्तं
    कल्लेश्वरं भवभयार्तिहरं प्रपद्ये ॥ ३॥ स्तोत्रं कल्लेश्वरस्येदं सत्कामितसुरद्रुमम् । पठन्ति ये नरास्तेषां
    भवबन्धोऽपि नश्यति ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीकल्लेश्वरस्तोत्रं
    सम्पूर्णम् । रचनास्थानं
