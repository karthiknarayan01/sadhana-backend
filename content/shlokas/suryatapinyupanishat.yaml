id: suryatapinyupanishat
category: upanishad
name:
  english: suryatapinyupanishat
  devanagari: सूर्यतापिन्युपनिषत्
content:
  english: rinotu bhavanekamanah sarvada yamamananti yannamasyanti devah sa brahma sa shivah sa harissendrah
    so'ksharah paramah svarat sa suryo bhagavan sahasramshuh tam suryam bhagavantam sarvasvarupinam nigama
    bahudha varnayanti | kashyapah pashyako bhavati | yatsarvam paripashyatiti saukshmyat | kashyapaduditah
    suryah papannirghnanti sarvada | rodasyorantardesheshu | apaitam mrityum jayati | ya evam veda | yo'sau
    tapannudeti | asau yo'stameti | asau yo'kshiyati | esha hi devah pradisho'nusarvah purvo hi jatah
    sa u garbhe antah | sa vijayamanah sa janishyamanah pratyanmukhastishthati vishvatomukhah | asau yo'vasarpati
    nilagrivo vilohitah | utainam gopa adrishannadrishannudaharyah | utainam vishva bhutani sa drishto
    mridayati nah | rigbhih purvahne divi deva iyate | yajurvede tishthati madhye ahnah | samavedenastamaye
    mahiyate | vedairashunyastribhireti suryah | rigbhyo jatam sarvasho murtimahuh || esha brahma ca vishnushca
    rudra esha hi bhaskarah | trimurtyatma trivedatma sarvadevamayo ravih || iti | yogena urdhvamanthinah
    suryam bhagavantamupasate | dhanadhanyabahuratnavanto nirvyadhivanta ayushyavanta arogyavanto rayivanto
    dhanavanto balavanto bahuputravanta iti | yah shrikamah shantikamah tushtikamah pushtikamo medhakamah
    prajnakama ayushkama arogyakamo'nnadyakamo bhaskaram bhagavantamupasita | sayonih sarupatam salokatam
    gatva stutva mahanandamudakamupasprishyapo'vagahya vagyatah nityakarma kritva shucau deshe'pyasino
    darbhan dharayamanah pranmukha upavishya prananayamya deshakalau sankirtya trivedamayam trimurtim
    trigunam catushpadam pancarupam shadarnavedyam saptashvamashtashapeti
  devanagari: ृणोतु भवानेकमनाः सर्वदा यमामनन्ति यन्नमस्यन्ति देवाः स ब्रह्मा स शिवः स हरिस्सेन्द्रः सोऽक्षरः
    परमः स्वराट् स सूर्यो भगवान् सहस्रांशुः तं सूर्यं भगवन्तं सर्वस्वरूपिणं निगमा बहुधा वर्णयन्ति । कश्यपः
    पश्यको भवति । यत्सर्वं परिपश्यतीति सौक्ष्म्यात् । कश्यपादुदिताः सूर्याः पापान्निर्घ्नन्ति सर्वदा ।
    रोदस्योरन्तर्देशेषु । अपैतं मृत्युं जयति । य एवं वेद । योऽसौ तपन्नुदेति । असौ योऽस्तमेति । असौ योऽक्षीयति
    । एष हि देवः प्रदिशोऽनुसर्वाः पूर्वो हि जातः स उ गर्भे अन्तः । स विजायमानः स जनिष्यमाणः प्रत्यङ्मुखास्तिष्ठति
    विश्वतोमुखः । असौ योऽवसर्पति नीलग्रीवो विलोहितः । उतैनं गोपा अदृशन्नदृशन्नुदहार्यः । उतैनं विश्वा
    भूतानि स दृष्टो मृडयाति नः । ऋग्भिः पूर्वाह्णे दिवि देव ईयते । यजुर्वेदे तिष्ठति मध्ये अह्नः । सामवेदेनास्तमये
    महीयते । वेदैरशून्यस्त्रिभिरेति सूर्यः । ऋग्भ्यो जातां सर्वशो मूर्तिमाहुः ॥ एष ब्रह्मा च विष्णुश्च
    रुद्र एष हि भास्करः । त्रिमूर्त्यात्मा त्रिवेदात्मा सर्वदेवमयो रविः ॥ इति । योगेन ऊर्ध्वमन्थिनः सूर्यं
    भगवन्तमुपासते । धनधान्यबहुरत्नवन्तो निर्व्याधिवन्त आयुष्यवन्त आरोग्यवन्तो रयिवन्तो धनवन्तो बलवन्तो
    बहुपुत्रवन्त इति । यः श्रीकामः शान्तिकामः तुष्टिकामः पुष्टिकामो मेधाकामः प्रज्ञाकाम आयुष्काम आरोग्यकामोऽन्नाद्यकामो
    भास्करं भगवन्तमुपासीत । सयोनिः सरूपतां सलोकतां गत्वा स्तुत्वा महानन्दमुदकमुपस्पृश्यापोऽवगाह्य वाग्यतः
    नित्यकर्म कृत्वा शुचौ देशेऽप्यासीनो दर्भान् धारयमाणः प्राङ्मुख उपविश्य प्राणानायम्य देशकालौ सङ्कीर्त्य
    त्रिवेदमयं त्रिमूर्तिं त्रिगुणं चतुष्पदं पञ्चरूपं षडर्णवेद्यं सप्ताश्वमष्टशापेति
