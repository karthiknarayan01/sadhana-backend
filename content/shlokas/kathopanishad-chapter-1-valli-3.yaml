id: kathopanishad-chapter-1-valli-3
category: stotram
name:
  english: Kathopanishad - Chapter 1, Valli 3
content:
  english: mpibantau sukritasya loke guha mpravishtau parame parardhe| chayatapau brahmavido vadanti pancagnayo
    ye ca trinaciketah || mbrahma yatparam| abhaya vi~ddhi shariram rathameva tu| buddhi vi~ddhi manah
    pragrahameva ca || || indriyani hayanahurvishayamsteshu gocaran| atmendriyamanoyukta mbhoktetyahurmanishinah
    || || yastvavijnanavanbhavatyayuktena manasa sada| tasyendriyanyavashyani dushtashva iva saratheh
    || || yastu vijnanavanbhavati yuktena manasa sada| tasyendriyani vashyani sadashva iva saratheh ||
    || yastvavijnanavanbhavatyamanaska 'shucih| na sa tatpadamapnoti samsara || yastu vijnanavanbhavati
    samanaska ssada shucih| sa tu tatpadamapnoti yasmad bhuyo na jayate || || vijnanasarathiryastu manah
    pragrahavannarah| so 'dhvanah paramapnoti tadvishnoh parama || indriyebhyah para hyartha arthebhyashca
    para mmanah| manasastu para buddhirbuddheratma mahanparah || || mahatah paramavyaktamavyaktatpurushah
    parah| purushanna para nkincitsa kashtha sa para gatih || || esha sarveshu bhuteshu gudho ''tma na
    prakashate| drishyate tvagryaya buddhya sukshmaya sukshmadar || yacchedvanmanasi prajnastadyacchejjnana
    atmani| jnanamatmani mahati niyacchettadyacchecchanta atmani || || uttishthata jagrata prapya varannibodhata|
    kshurasya dhara nishita duratyaya durga mpathastatkavayo vadanti || nnityamagandhavacca yat| anadyananta
    nnicayya tanmrityumukha mmrityuproktam sanatanam| uktva shrutva ca medhavi brahmaloke mahiyate ||
    nguhyam shravayed brahmasamsadi| prayata shshraddhakale va tadanantyaya kalpate| tadanantyaya kalpata
    iti ||
  devanagari: म्पिबन्तौ सुकृतस्य लोके गुहा म्प्रविष्टौ परमे परार्धे। छायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो
    ये च त्रिणाचिकेताः ॥ म्ब्रह्म यत्परम्। अभय विँद्धि शरीरं रथमेव तु। बुद्धि विँद्धि मनः प्रग्रहमेव च
    ॥ ॥ इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान्। आत्मेन्द्रियमनोयुक्त म्भोक्तेत्याहुर्मनीषिणः ॥ ॥ यस्त्वविज्ञानवान्भवत्ययुक्तेन
    मनसा सदा। तस्येन्द्रियाण्यवश्यानि दुष्टाश्वा इव सारथेः ॥ ॥ यस्तु विज्ञानवान्भवति युक्तेन मनसा सदा।
    तस्येन्द्रियाणि वश्यानि सदश्वा इव सारथेः ॥ ॥ यस्त्वविज्ञानवान्भवत्यमनस्क ऽशुचिः। न स तत्पदमाप्नोति
    संसार ॥ यस्तु विज्ञानवान्भवति समनस्क स्सदा शुचिः। स तु तत्पदमाप्नोति यस्माद् भूयो न जायते ॥ ॥ विज्ञानसारथिर्यस्तु
    मनः प्रग्रहवान्नरः। सो ऽध्वनः पारमाप्नोति तद्विष्णोः परम ॥ इन्द्रियेभ्यः परा ह्यर्था अर्थेभ्यश्च पर
    म्मनः। मनसस्तु परा बुद्धिर्बुद्धेरात्मा महान्परः ॥ ॥ महतः परमव्यक्तमव्यक्तात्पुरुषः परः। पुरुषान्न
    पर ङ्किञ्चित्सा काष्ठा सा परा गतिः ॥ ॥ एष सर्वेषु भूतेषु गूढो ऽऽत्मा न प्रकाशते। दृश्यते त्वग्र्यया
    बुद्ध्या सूक्ष्मया सूक्ष्मदर् ॥ यच्छेद्वाङ्मनसी प्राज्ञस्तद्यच्छेज्ज्ञान आत्मनि। ज्ञानमात्मनि महति
    नियच्छेत्तद्यच्छेच्छान्त आत्मनि ॥ ॥ उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत। क्षुरस्य धारा निशिता दुरत्यया
    दुर्ग म्पथस्तत्कवयो वदन्ति ॥ न्नित्यमगन्धवच्च यत्। अनाद्यनन्त न्निचाय्य तन्मृत्युमुखा म्मृत्युप्रोक्तं
    सनातनम्। उक्त्वा श्रुत्वा च मेधावी ब्रह्मलोके महीयते ॥ ङ्गुह्यं श्रावयेद् ब्रह्मसंसदि। प्रयत श्श्राद्धकाले
    वा तदानन्त्याय कल्पते। तदानन्त्याय कल्पत इति ॥
