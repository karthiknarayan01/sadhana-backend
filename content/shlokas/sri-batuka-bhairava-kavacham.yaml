id: sri-batuka-bhairava-kavacham
category: stotram
name:
  english: Sri Batuka Bhairava Kavacham
content:
  english: shribhairava uvaca | deveshi deharakshartham karanam kathyatam dhruvam | mriyante sadhaka yena
    vina shmashanabhumishu || raneshu catighoreshu mahavayujaleshu ca | shringimakaravajreshu jvaradivyadhivahnishu
    || shridevyuvaca | kathayami shrinu prajna batostu kavacam shubham | gopaniyam prayatnena matrijaropamam
    yatha || tasya dhyanam tridha proktam sattvikadiprabhedatah | sattvikam rajasam caiva tamasam deva
    tat shrinu || dhyanam vande balam sphatikasadrisham kundalodbhasivaktram divyakalpairnavamanimayaih
    kinkininupuradyaih | diptakaram vishadavadanam suprasannam trinetram hastabjabhyam batukamanisham
    shulakhadgaudadhanam || || udyadbhaskarasannibham trinayanam raktangaragasrajam smerasyam varadam
    kapalamabhayam shulam dadhanam karaih | nilagrivamudarabhushanashatam shitamshucudojjvalam bandhukarunavasasam
    bhayaharam devam sada bhavaye || || dhyayenniladrikantam shashishakaladharam mundamalam mahesham digvastram
    pingakesham damarumatha srinim khadgashulabhayani | nagam ghantam kapalam karasarasiruhairvibhratam
    bhimadamshtram sarpakalpam trinetram manimayavilasatkinkini nupuradhyam || || asya vatukabhairavakavacasya
    mahakala rishiranushtupchandah shrivatukabhairavo devata bam bijam hrim shaktirapaduddharanayeti kilakam
    mama sarvabhishtasiddhyarthe viniyogah | kavacam om shiro me bhairavah patu lalatam bhishanastatha
    | netre ca bhutahananah sarameyanugo bhruvau || bhutanathashca me karnau kapolau pretavahanah | nasaputau
    tathoshthau ca bhasmangah sarvabhushanah || bhishanasyo mamasyam ca shaktihasto galam mama | skandhau
    daityaripuh patu bahu atulavikramah || pani kapali me patu mundamaladharo hridam | vakshahsthalam
    tatha shantah kamacari stanam mama || udaram ca sa me tushtah kshetreshah parshvatastatha | kshetrapalah
    prishthadesham kshetrakhyo nabhitastatha || katim papaughanashashca batuko lingadeshakam | gudam rakshakarah
    patu uru rakshakarah sada || janu ca ghurghuraravo janghe rakshatu raktapah | gulphau ca padukasiddhah
    padaprishtham sureshvarah || apadamastakam caiva apaduddharanastatha | sahasrare mahapadme karpuradhavalo
    guruh || patu mam vatuko devo bhairavah sarvakarmasu | purva syamasitango me dishi rakshatu sarvada
    || agneyyam ca ruruh patu dakshine candabhairavah | nairrityam krodhanah patu mamunmattastu pashcime
    || vayavyam me kapali ca nityam payat sureshvarah | bhishano bhairavah patuttarasyam dishi sarvada
    || samharabhairavah patu dishyaishanyam maheshvarah | urdhve patu vidhata vai patale nandiko vibhuh
    || sadyojatastu mam payat sarvato devasevitah | vamadevo'vatu prito rane ghore tathavatu || jale tatpurushah
    patu sthale patu guruh sada | dakiniputrakah patu daramstu lakinisutah || patu sakalako bhratrin shriyam
    me satatam girah | lakiniputrakah patu pashunashvanajamstatha || mahakalo'vatu cchatram sainyam vai
    kalabhairavah | rajyam rajyashriyam payat bhairavo bhitiharakah || rakshahinantu yat sthanam varjitam
    kavacena ca | tat sarvam raksha me deva tvam yatah sarvarakshakah || etat kavacamishana tava snehat
    prakashitam | nakhyeyam naralokeshu sarabhutam ca sushriyam || yasmai kasmai na datavyam kavacesham
    sudurlabham | na deyam parashishyebhyah kripanebhyashca shankara || yo dadati nishiddhebhyah sa vai
    bhrashto bhaveddhruvam | anena kavaceshena raksham kritva dvijottamah || vicaran yatra kutrapi vighnaughaih
    prapyate na sah | mantrena mriyate yogi kavacam yanna rakshitah || tasmat sarvaprayatnena durlabham
    papacetasam | bhurje rambhatvace vapi likhitva vidhivat prabho || dharayet pathayedvapi sampathedvapi
    nityashah | samprapnoti prabhavam vai kavacasyasya varnitam || namo bhairavadevaya sarabhutaya vai
    namah | namastrailokyanathaya nathanathaya vai namah || iti vishvasaroddharatantre apaduddharakalpe
    bhairavabhairavisamvade vatukabhairavakavacam samaptam ||
  devanagari: श्रीभैरव उवाच । देवेशि देहरक्षार्थं कारणं कथ्यतां ध्रुवम् । म्रियन्ते साधका येन विना श्मशानभूमिषु
    ॥ रणेषु चातिघोरेषु महावायुजलेषु च । शृङ्गिमकरवज्रेषु ज्वरादिव्याधिवह्निषु ॥ श्रीदेव्युवाच । कथयामि
    शृणु प्राज्ञ बटोस्तु कवचं शुभम् । गोपनीयं प्रयत्नेन मातृजारोपमं यथा ॥ तस्य ध्यानं त्रिधा प्रोक्तं
    सात्त्विकादिप्रभेदतः । सात्त्विकं राजसं चैव तामसं देव तत् शृणु ॥ ध्यानम् वन्दे बालं स्फटिकसदृशं कुण्डलोद्भासिवक्त्रं
    दिव्याकल्पैर्नवमणिमयैः किङ्किणीनूपुराद्यैः । दीप्ताकारं विशदवदनं सुप्रसन्नं त्रिनेत्रं हस्ताब्जाभ्यां
    बटुकमनिशं शूलखड्गौदधानम् ॥ ॥ उद्यद्भास्करसन्निभं त्रिनयनं रक्ताङ्गरागस्रजं स्मेरास्यं वरदं कपालमभयं
    शूलं दधानं करैः । नीलग्रीवमुदारभूषणशतं शीतांशुचूडोज्ज्वलं बन्धूकारुणवाससं भयहरं देवं सदा भावये ॥ ॥
    ध्यायेन्नीलाद्रिकान्तं शशिशकलधरं मुण्डमालं महेशं दिग्वस्त्रं पिङ्गकेशं डमरुमथ सृणिं खड्गशूलाभयानि
    । नागं घण्टां कपालं करसरसिरुहैर्विभ्रतं भीमदंष्ट्रं सर्पाकल्पं त्रिनेत्रं मणिमयविलसत्किङ्किणी नूपुराढ्यम्
    ॥ ॥ अस्य वटुकभैरवकवचस्य महाकाल ऋषिरनुष्टुप्छन्दः श्रीवटुकभैरवो देवता बं बीजं ह्रीं शक्तिरापदुद्धारणायेति
    कीलकं मम सर्वाभीष्टसिद्ध्यर्थे विनियोगः । कवचम् ॐ शिरो मे भैरवः पातु ललाटं भीषणस्तथा । नेत्रे च भूतहननः
    सारमेयानुगो भ्रुवौ ॥ भूतनाथश्च मे कर्णौ कपोलौ प्रेतवाहनः । नासापुटौ तथोष्ठौ च भस्माङ्गः सर्वभूषणः
    ॥ भीषणास्यो ममास्यं च शक्तिहस्तो गलं मम । स्कन्धौ दैत्यरिपुः पातु बाहू अतुलविक्रमः ॥ पाणी कपाली मे
    पातु मुण्डमालाधरो हृदम् । वक्षःस्थलं तथा शान्तः कामचारी स्तनं मम ॥ उदरं च स मे तुष्टः क्षेत्रेशः पार्श्वतस्तथा
    । क्षेत्रपालः पृष्ठदेशं क्षेत्राख्यो नाभितस्तथा ॥ कटिं पापौघनाशश्च बटुको लिङ्गदेशकम् । गुदं रक्षाकरः
    पातु ऊरू रक्षाकरः सदा ॥ जानू च घुर्घुरारावो जङ्घे रक्षतु रक्तपः । गुल्फौ च पादुकासिद्धः पादपृष्ठं
    सुरेश्वरः ॥ आपादमस्तकं चैव आपदुद्धारणस्तथा । सहस्रारे महापद्मे कर्पूरधवलो गुरुः ॥ पातु मां वटुको देवो
    भैरवः सर्वकर्मसु । पूर्व स्यामसिताङ्गो मे दिशि रक्षतु सर्वदा ॥ आग्नेय्यां च रुरुः पातु दक्षिणे चण्डभैरवः
    । नैरृत्यां क्रोधनः पातु मामुन्मत्तस्तु पश्चिमे ॥ वायव्यां मे कपाली च नित्यं पायात् सुरेश्वरः । भीषणो
    भैरवः पातूत्तरस्यां दिशि सर्वदा ॥ संहारभैरवः पातु दिश्यैशान्यां महेश्वरः । ऊर्ध्वे पातु विधाता वै
    पाताले नन्दिको विभुः ॥ सद्योजातस्तु मां पायात् सर्वतो देवसेवितः । वामदेवोऽवतु प्रीतो रणे घोरे तथावतु
    ॥ जले तत्पुरुषः पातु स्थले पातु गुरुः सदा । डाकिनीपुत्रकः पातु दारांस्तु लाकिनीसुतः ॥ पातु साकलको
    भ्रातॄन् श्रियं मे सततं गिरः । लाकिनीपुत्रकः पातु पशूनश्वानजांस्तथा ॥ महाकालोऽवतु च्छत्रं सैन्यं वै
    कालभैरवः । राज्यं राज्यश्रियं पायात् भैरवो भीतिहारकः ॥ रक्षाहीनन्तु यत् स्थानं वर्जितं कवचेन च । तत्
    सर्वं रक्ष मे देव त्वं यतः सर्वरक्षकः ॥ एतत् कवचमीशान तव स्नेहात् प्रकाशितम् । नाख्येयं नरलोकेषु सारभूतं
    च सुश्रियम् ॥ यस्मै कस्मै न दातव्यं कवचेशं सुदुर्लभम् । न देयं परशिष्येभ्यः कृपणेभ्यश्च शङ्कर ॥ यो
    ददाति निषिद्धेभ्यः स वै भ्रष्टो भवेद्ध्रुवम् । अनेन कवचेशेन रक्षां कृत्वा द्विजोत्तमः ॥ विचरन् यत्र
    कुत्रापि विघ्नौघैः प्राप्यते न सः । मन्त्रेण म्रियते योगी कवचं यन्न रक्षितः ॥ तस्मात् सर्वप्रयत्नेन
    दुर्लभं पापचेतसाम् । भूर्जे रम्भात्वचे वापि लिखित्वा विधिवत् प्रभो ॥ धारयेत् पाठयेद्वापि सम्पठेद्वापि
    नित्यशः । सम्प्राप्नोति प्रभावं वै कवचस्यास्य वर्णितम् ॥ नमो भैरवदेवाय सारभूताय वै नमः । नमस्त्रैलोक्यनाथाय
    नाथनाथाय वै नमः ॥ इति विश्वसारोद्धारतन्त्रे आपदुद्धारकल्पे भैरवभैरवीसंवादे वटुकभैरवकवचं समाप्तम् ॥
