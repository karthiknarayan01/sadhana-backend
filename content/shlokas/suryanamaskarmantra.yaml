id: suryanamaskarmantra
category: mantra
name:
  english: suryanamaskarmantra
  devanagari: सुर्यनमस्कार्मन्त्र
content:
  english: suryanamaskara mantrah om dhyeyah sada savitrimandala madhyavarti narayanah sarasijasansamnivishtah
    | keyuravana makarakundalavana kiriti hari hiranmayavapudhritashamkhacakrah || om hram mitraya namah
    | om hrim ravaye namah | om hrum suryaya namah | om hraim bhanave namah | om hraum khagaya namah |
    om hrah pushne namah | om hram hiranyagarbhaya namah | om hrim maricaye namah | om hrum adityaya namah
    | om hraim savitre namah | om hraum arkaya namah | om hrah bhaskaraya namah | om hram hrim hrum hraim
    hraum hrah om shrisavitrisuryanarayanaya namah || aditasya namaskaran ye kurvanti dine dine janmantarasahasreshu
    daridryam doshanashate | akalamrityuharanam sarvavyadhivinashanam suryapadodakam tirtham jathare dharayamyaham
    || yogena cittasya padena vaca malam sharirasya ca vaidyakena | yopakarottam pravaram muninam patamjalim
    pramjaliranato'smi ||
  devanagari: सूर्यनमस्कार मन्त्राः ॐ ध्येयः सदा सवितृमण्डल मध्यवर्ति नारायणः सरसिजासन्संनिविष्टः । केयूरवान
    मकरकुण्डलवान किरीटी हारी हिरण्मयवपुधृतशंखचक्रः ॥ ॐ ह्रां मित्राय नमः । ॐ ह्रीं रवये नमः । ॐ ह्रूं
    सूर्याय नमः । ॐ ह्रैं भानवे नमः । ॐ ह्रौं खगाय नमः । ॐ ह्रः पूष्णे नमः । ॐ ह्रां हिरण्यगर्भाय नमः
    । ॐ ह्रीं मरीचये नमः । ॐ ह्रूं आदित्याय नमः । ॐ ह्रैं सवित्रे नमः । ॐ ह्रौं अर्काय नमः । ॐ ह्रः भास्कराय
    नमः । ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः ॐ श्रीसवितृसूर्यनारायणाय नमः ॥ आदितस्य नमस्कारान् ये कुर्वन्ति
    दिने दिने जन्मान्तरसहस्रेषु दारिद्र्यं दोषनाशते । अकालमृत्युहरणं सर्वव्याधिविनाशनम् सूर्यपादोदकं तीर्थं
    जठरे धारयाम्यहम् ॥ योगेन चित्तस्य पदेन वाचा मलं शरीरस्य च वैद्यकेन । योपाकरोत्तं प्रवरं मुनीनां पतंजलिं
    प्रांजलिरानतोऽस्मि ॥
meaning: {}
