id: kalikavacam-athava-dakshinakalikakavacam-kalikulasarvasve
category: kavacha
name:
  english: kalikavacam athava dakshinakalikakavacam (kalikulasarvasve)
  devanagari: कालीकवचम् अथवा दक्षिणकालिकाकवचम् (कालीकुलसर्वस्वे)
content:
  english: shankapi jayate vatsa tava snehat prakashitam | na vaktavyam na drashtavyamatiguhyataram mahat
    || 3|| kalika jagatam mata shokaduhkhavinashini | visheshatah kaliyuge mahapatakaharini || 4|| kali
    me puratah patu prishthatashca kapalini | kulla me dakshine patu kurukulla tathottare || 5|| virodhini
    shirah patu vipracitta tu cakshushi | ugra me nasikam patu karnau cograprabha mata || 6|| vadanam
    patu me dipta nila ca cibukam sada | ghana grivam sada patu balaka bahuyugmakam || 7|| matra patu
    karadvandvam vakshomudra sadavatu | mita patu stanadvandvam yonimandaladevata || 8|| brahmi me jatharam
    patu nabhim narayani tatha | uru maheshvari nityam camunda patu lingakam || 9|| kaumari ca katim patu
    tathaiva januyugmakam | aparajita ca padau me varahi patu cangulin || 10|| sandhisthanam narasimhi
    patrastha devatavatu | rakshahinantu yatsthanam varjitam kavacena tu || 11|| tatsarvam raksha me devi
    kalike ghoradakshine | urddhamadhastatha dikshu patu devi svayam vapuh || 12|| himsrebhyah sarvada
    patu sadhakanca jaladhikat | dakshinakalika devi vyapakatve sadavatu || 13|| idam kavacamajnatva yo
    japeddevadakshinam | na pujaphalamapnoti vighnastasya pade pade || 14|| kavacenavrito nityam yatra
    tatraiva gacchati | tatra tatrabhayam tasya na kshobham vidyate kvacit || 15|| iti kalikulasarvasve
    kalikavacam athava shrimaddakshinakalikakavacam samaptam ||
  devanagari: शङ्कापि जायते वत्स तव स्नेहात् प्रकाशितम् । न वक्तव्यं न द्रष्टव्यमतिगुह्यतरं महत् ॥ ३॥
    कालिका जगतां माता शोकदुःखविनाशिनी । विशेषतः कलियुगे महापातकहारिणी ॥ ४॥ काली मे पुरतः पातु पृष्ठतश्च
    कपालिनी । कुल्ला मे दक्षिणे पातु कुरुकुल्ला तथोत्तरे ॥ ५॥ विरोधिनी शिरः पातु विप्रचित्ता तु चक्षुषी
    । उग्रा मे नासिकां पातु कर्णौ चोग्रप्रभा मता ॥ ६॥ वदनं पातु मे दीप्ता नीला च चिबुकं सदा । घना ग्रीवां
    सदा पातु बलाका बाहुयुग्मकम् ॥ ७॥ मात्रा पातु करद्वन्द्वं वक्षोमुद्रा सदावतु । मिता पातु स्तनद्वन्द्वं
    योनिमण्डलदेवता ॥ ८॥ ब्राह्मी मे जठरं पातु नाभिं नारायणी तथा । ऊरु माहेश्वरी नित्यं चामुण्डा पातु लिङ्गकम्
    ॥ ९॥ कौमारी च कटीं पातु तथैव जानुयुग्मकम् । अपराजिता च पादौ मे वाराही पातु चाङ्गुलीन् ॥ १०॥ सन्धिस्थानं
    नारसिंही पत्रस्था देवतावतु । रक्षाहीनन्तु यत्स्थानं वर्जितं कवचेन तु ॥ ११॥ तत्सर्वं रक्ष मे देवि कालिके
    घोरदक्षिणे । ऊर्द्धमधस्तथा दिक्षु पातु देवी स्वयं वपुः ॥ १२॥ हिंस्रेभ्यः सर्वदा पातु साधकञ्च जलाधिकात्
    । दक्षिणाकालिका देवी व्यपकत्वे सदावतु ॥ १३॥ इदं कवचमज्ञात्वा यो जपेद्देवदक्षिणाम् । न पूजाफलमाप्नोति
    विघ्नस्तस्य पदे पदे ॥ १४॥ कवचेनावृतो नित्यं यत्र तत्रैव गच्छति । तत्र तत्राभयं तस्य न क्षोभं विद्यते
    क्वचित् ॥ १५॥ इति कालीकुलसर्वस्वे कालीकवचं अथवा श्रीमद्दक्षिणकालिकाकवचम् समाप्तम् ॥
