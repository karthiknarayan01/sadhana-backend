id: dashopanishatsarashriramabhadrastotram
category: upanishad
name:
  english: dashopanishatsarashriramabhadrastotram
  devanagari: दशोपनिषत्सारश्रीरामभद्रस्तोत्रम्
content:
  english: shrimadramapadaravindamadhu ye bhringah saraga ami sevante sanakah shukadimunayastesham na
    kacitspriha | shrimadramapadaravindamadhuno jananti vai te rasam tatsvadatparasaukhyada bhavati ya
    sa syatsthitirnah sada || 1|| ishavasyamidam jagatbhavati bho jivah sukhanveshakah nastyasmin sukhalesha
    ityuta iha bute shrutirma gridhah | bhunajitha itaram ca ramapadavim tyaktena tenadhuna moho nasti
    na shoka ityapi bhavedekatmatadarshane || 2|| shishyah pricchati kena khani ca manah prana guro ceshitah
    yacchrotram shravanasya vakca vacasashcittasya cetopi tat | cakshurgacchati no mano na ca vaco yatrasti
    tatko vadet etatte prabhuramarupamagunam yakshatmakam sarvabhrit || 3|| shreyah preya iti dvayam khalu
    tayostacchreya evabhayam dhiro yastu viraktacittavilayasandhanyah kriti catmavit | suryacandramasau
    na yatra hutabhug ramasya tasmin pade shuddhe shuddhajalam yatha bhavati sah svatmaiva vakti shrutih
    || 4|| tam vedyam purusham hi veda na param vedyam na tanmrityubhih yo'syamevatanau vibhati satatam
    shubhro bhavatyaksharah | yajjnatva mudamashrute'tra sakalam bhadram ca sarvajnatam tacchriramapadasvarupamamalam
    jneyam ca geyam punah || 5|| yadjnanadviditam jagattadavikriddhamasvarupam svayam vijnaya svagurormukhatparamito
    bhinnam na vetti kvacit | sindhum prapya yatha na munacati nadi vidvana param vindate yo vai tatparamam
    ca veda satatam brahmaiva sa brahmavit || 6|| onkaram vyabhajacashrutirvadati tadabhutam bhavishyadgavat
    jiveshau ca vibhavayatyapi punarbrute tayorekatam | yadjnatva nitaramabhinnapadavim prapnotyamatram
    shivam shuddham tuyari madam sphutam parimiti shriramabhadrovyayah || 7|| samsarasya ca reriva mama
    tu ya kirtirgirerunnata yaturdhva jagato'sya mulamiti tad brahmatmamadrupakam | yajjnatva svamritam
    param vibhuraham brute trishanakuryatah tacchriramapradaravindabhajane kim va bhaveddurghatam || 8||
    anandatsamudirya yanbahuvidhanbahyanparam shvaparan satyam jnanamanantamaksharamaham yo veda nishkamatah
    | sarvan so'shruta ityapi shrutiraho bute param vindate tat shri ramapadam bhajadhvamadhuna brahmaiva
    yannibhayam || 9|| yatsririshtasthitipalanam vidalanam dhritvapi sakshi svayam annam pranamanomatibhya
    iti taccanandakoshagatima | yanmayarahitam cakasti satatam karyam na yasmin kvacit tacchri ramapadam
    bhajami nitaramanandamatram shivam || 10|| yenedam mana inndriyani ca tatha prana jagajjayate janmadishvapi
    jagradadishu tatha yajjnapakam visphutam | yasminsarvajagatpratishthitamidam rajvam yatha hi bhramah
    prajnanam prabhuramarupamacalam taccintaye siddhaye || 11|| yo bhuma sukhamadvitiyamadhuna janihi
    tattvam brihat tacchriramapadatmarupamiti yatsukshmacca sukshmam param | shraddhatsveti punashca tattvamasi
    bherabu
  devanagari: श्रीमद्रामपदारविन्दमधु ये भृङ्गाः सरागा अमी सेवन्ते सनकाः शुकादिमुनयस्तेषां न काचित्स्पृहा
    । श्रीमद्रामपदारविन्दमधुनो जानन्ति वै ते रसं तत्स्वादात्परसौख्यदा भवति या सा स्यात्स्थितिर्नः सदा
    ॥ १॥ ईशावास्यमिदं जगत्भवति भो जीवाः सुखान्वेषकाः नास्त्यस्मिन् सुखलेश इत्युत इह बूते श्रुतिर्मा गृधः
    । भुञजीथा इतरां च रामपदवीं त्यक्तेन तेनाधुना मोहो नास्ति न शोक इत्यपि भवेदेकात्मतादर्शने ॥ २॥ शिष्यः
    पृच्छति केन खानि च मनः प्राणा गुरो चेशिताः यच्छ्रोत्रं श्रवणस्य वाक्च वचसश्चित्तस्य चेतोपि तत् । चक्षुर्गच्छति
    नो मनो न च वचो यत्रास्ति तत्को वदेत् एतत्ते प्रभुरामरूपमगुणं यक्षात्मकं सर्वभृत् ॥ ३॥ श्रेयः प्रेय
    इति द्वयं खलु तयोस्तच्छ्रेय एवाभयं धीरो यस्तु विरक्तचित्तविलयसन्धन्यः कृती चात्मवित् । सूर्याचन्द्रमसौ
    न यत्र हुतभुग् रामस्य तस्मिन् पदे शुद्धे शुद्धजलं यथा भवति सः स्वात्मैव वक्ति श्रुतिः ॥ ४॥ तं वेद्यं
    पुरुषं हि वेद न परं वेद्यं न तन्मृत्युभिः योऽस्यामेवतनौ विभाति सततं शुभ्रो भवत्यक्षरः । यज्ज्ञात्वा
    मुदमश्रुतेऽत्र सकलं भद्रं च सर्वज्ञतां तच्छ्रीरामपदस्वरूपममलं ज्ञेयं च गेयं पुनः ॥ ५॥ यद्ज्ञानाद्विदितं
    जगत्तदविकृद्धामस्वरूपं स्वयं विज्ञाय स्वगुरोर्मुखात्परमितो भिन्नं न वेत्ति क्वचित् । सिन्धुं प्राप्य
    यथा न मुञचति नदी विद्वान परं विन्दते यो वै तत्परमं च वेद सततं ब्रह्मैव स ब्रह्मवित् ॥ ६॥ ओङ्कारं व्यभजचश्रुतिर्वदति
    तदभुतं भविष्यद्गवत् जीवेशौ च विभावयत्यपि पुनर्ब्रूते तयोरेकताम् । यद्ज्ञात्वा नितरामभिन्नपदवीं प्राप्नोत्यमात्रां
    शिवां शुद्धं तुयरि मदं स्फुटं परिमिति श्रीरामभद्रोव्ययः ॥ ७॥ संसारस्य च रेरिवा मम तु या कीर्तिर्गिरेरुन्नता
    यतूर्ध्व जगतोऽस्य मूलमिति तद् ब्रह्मात्ममद्रूपकम् । यज्ज्ञात्वा स्वमृतं परं विभुरहं ब्रूते त्रिशङकुर्यतः
    तच्छ्रीरामप्रदारविन्दभजने किं वा भवेद्दुर्घटम् ॥ ८॥ आनन्दात्समुदीर्य यान्बहुविधान्बाह्यान्परां श्वापरान्
    सत्यं ज्ञानमनन्तमक्षरमहं यो वेद निष्कामतः । सर्वान् सोऽश्रुत इत्यपि श्रुतिरहो बूते परं विन्दते तत्
    श्री रामपदं भजध्वमधुना ब्रह्मैव यन्निभयम् ॥ ९॥ यत्सृऋष्टस्थितिपालनं विदलनं धृत्वापि साक्षी स्वयं अन्नं
    प्राणमनोमतिभ्य इति तच्चानन्दकोशागतिम । यन्मायारहितं चकास्ति सततं कार्यं न यस्मिन् क्वचित् तच्छ्री
    रामपदं भजामि नितरामानन्दमात्रं शिवम् ॥ १०॥ येनेदं मन इन्न्द्रियाणि च तथा प्राणा जगज्जायते जन्मादिष्वपि
    जाग्रदादिषु तथा यज्ज्ञापकं विस्फुटम् । यस्मिन्सर्वजगत्प्रतिष्ठितमिदं रज्वां यथा हि भ्रमः प्रज्ञानं
    प्रभुरामरूपमचलं तच्चिन्तये सिद्धये ॥ ११॥ यो भूमा सुखमद्वितीयमधुना जानीहि तत्त्वं बृहत् तच्छ्रीरामपदात्मरूपमिति
    यत्सूक्ष्माच्च सूक्ष्मं परम् । श्रद्धत्स्वेति पुनश्च तत्त्वमसि भेराबू
