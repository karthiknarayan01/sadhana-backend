id: sushlokacaitanyashatakam
category: shataka
name:
  english: sushlokacaitanyashatakam
  devanagari: सुश्लोकचैतन्यशतकम्
content:
  english: '|| 12|| sarveshamavataranam puranairyatshrutam phalam | tasmanme nishkritirnasti ataste sharanam
    gatah || 13|| vicitra madhurakshara shrutimanojna gito muda svabhaktagana mandali racita madhyagami
    prabhuh | manohara manoharo natati gauracandrah svayam jagattraya vibhushano paramadhama nilacale
    || 14|| vilokya purushottamam kanaka gaura deho harir muda hridaya pankaje jaladakanti alingitum |
    papata dharanitale sakalabhava sammurcchitah kadacidapi nengate paramadhari samspandanam || 15|| gaurasya
    nayane dhara sagadgada vaco mukhe | pulakankita sarvango bhave luthati bhutale || 16|| caitanya caranambhoje
    yasyasti pritiracyuta | vrindatavishayostasya bhaktisyacchata janmani || 17|| yatha radha padambhoje
    bhaktih syatpremalakshana | tathaiva krishnacaitanye vardhate madhura ratih || 18|| kanakamukurakantim
    caru vaktraravindam madhuramukura hasyam pakva bimbadharoshtham | suvalita lalitangam kambukantham
    natendram tribhuvana kamaniyam gauracandram prapadye || 19|| sudirghasumanoharam madhurakanti candrananam
    praphullakamalekshanam dashanapankti muktaphalam | supushpa navamanjari shravanayugma sadbhushanam
    pradiptamani kankanam kashitahema gauram bhaje || 20|| akhilabhuvanabandho premasindho jane''smin
    sakalakapatapurne jnanahine prapanne | tava caranasaroje dehi dasyam prabho tvam patita tarana nama
    pradurasit yataste || 21|| urdhvikritya bhujadvayam karunaya sarvanjananadishet re re bhagavata harim
    vada vada shrigauracandrah svayam | premna nrityati hunkriti vikurate ha ha ravairvyakulo bhumau lunthati
    murcchati svahridaye hastau vinikshipyati || 22|| harenama krishnanama ganadana karinim shokamoha
    lobhatapa sarvavighna nashinim | padapadmalubdha bhaktavrinda bhaktidayinim gauramurtimashu naumi
    nama sutradharinim || 23|| malatimallikadama baddha kuncita kuntalam | bhalodyattilakam ganda ratnakundalamanditam
    || 24|| shrikhandaguruliptangam kankanangada bhushitam | kvananmanjira caranam gauracandramaham bhaje
    || 25|| madhuram madhuram kanakabha tanumarunambara satparidheyamaho | jagadeka shubham sakalaika
    param karunapravanam bhaja tam paramam || 26|| krishnarupam parityajya kalau gauro babhuva yah | tam
    vande paramanandam shricaitanya mahaprabhum || 27|| pitamshukam parityajya shonambara dharoti yah
    | tam gauram karuna sindhumashraye bhuvanashrayam || 28|| avatirnah punah krishno gauracandra sanatanah
    | magnastribhaga papesmintesham tranasya hetave || 29|| avatirne kalau gaure candaladyah kujatayah
    | yavantah papinashcapi prayaso vaishnava ami || 30|| patitam durgatam drishtva vaishnava lokapavanah
    | karau dhritva harernama yacanti kripaya kalau || 31|| sankirtanarambhakrite''pi gaure dhavanti jivashravane
    gunani | ashuddhacittah kimu shuddhacittah shrutva pramattah khalu te nanartuh || 32|| kimashcaryam
    kimashcaryam kalau jate shacisute | stribala jadamurkhadyah sarve namaparayanah || 33|| candala yavana
    murkhah sarve kurvanti kirtanam | harernamnam gunanam ca gaure jate kalau yuge || 34|| kimadbhutam
    gaurahareshcaritram tato''dhikam tatpriya sevakanam | sankirtanamoda jananuraga premapradanam vitanoti
    loke || 35|| suvalitamani malairbaddhacudam manojnah sulalita mridubhale candanenanucitram | shravanayugalarandhre
    kundalau yasya bhatau hridivinihitaharam naumi tam gauracandram || 36|| caitanyarupagunakarma manojnavesham
    yah sarvada smarati dehamanovacobhih | tasyaiva padatalapadmarajobhilashi sevam karomi shatajanmani
    bandhuputraih || 37|| iyam rasajna tava namakirtane shrotrau mano me shravane''nucintane | netre ca
    te rupanirikshane sada shiro''stu caitanya padabhivandane || 38|| sankirtananandarasa svarupah premapradanaih
    khalu shuddhacittah | sarve mahantah kila krishna tulyah samsara lokanparitarayanti || 39|| yasmindeshe
    kulacaro dharmacarashca nasti vai | tathapi dhanyastaddesho nama sankirtanaddhareh || 40|| yavatam
    ca kutantranam samuddharasya hetave | avatirnah kalau krishnacaitanyo jagatam patih || 41|| sarvavatara
    bhajatam jananam tratum samarthah kila sadhuvarta | bhaktanabhaktanapi gauracandrastatara krishnamritanamadanaih
    || 42|| caitanya premadatakhila bhuvana jananbhava hunkar nadairgovindakrishta cittankuvishaya viratankarayamasa
    shighram | evam shrigauracandre jagati ca janite vancito yahi murkhastapi papi surapi hariguruvimukhah
    sarvada vancitah sah || 43|| tribhuvanakamaniye gauracandre''vatirne patitayavanamurkhah sarvatha
    sphotayantah | iha jagati samasta nama sankirtanarta vayamapi ca kritarthah krishnanamashrayat ||
    44|| madhuramadhurametad vaishnavanam caritram kalimalakrita hinandoshabuddhya na jagmuh | sakala
    nigamasaram namadatum ca tatra prabalakarunaya shrigauracandro''vatirnah || 45|| lokansamastankalidurga
    varidhernamna samuttarya svatah samarpitam | shrigauracandrairhari vaishnavanam namnashca tattvam
    kathitam jane jane || 46|| yavanto vaishnava loke paritranasya hetave | ratanti prabhunadishta deshe
    deshe grihe grihe || 47|| jagadbandhorjagatkarturjagatam tranahetave | yatra tatra hareh seva kirtane
    sthapite sukhe || 48|| gaurangah premamurtirjagati yadavadhi premadanam karoti papi tapi surapi nikhila
    janadhanasyapahari kritaghnah | sarvandharmansvakiyanvishamiva vishayam samparityajya krishnam gayantyuccaih
    pramattastadavadhi vikalah premasindhau vimagnah || 49|| yesham kasminkali yuge noddharo bahu janmasu
    | kalau te te sukhe magna namaganaprasadatah || 50|| harernamnam prasadena nistaretpataki janah |
    upadeshta svayam krishnacaitanyo jagadishvarah || 51|| akhilabhuvana bandhurnama data kripaluh kashitakanakavarnah
    sarvamadhuryapurnah | atisumadhurahasah snigdhadrikpremabhasah sphuratu hridayamadhye gauracandro
    natendrah || 52|| atimadhuracaritrah krishnanamaikamantro bhuvanavidita sarvapremadata nitantah |
    vipula pulaka dhari citta hari jananam sphuratu hridaya madhye gauracandro natendrah || 53|| sakala
    nigama sarah purna purnavatarah kali kalusha vinashah prema bhakti prakashah | priya sahacara sange
    ranga bhangya vilasi sphuratu hridaya madhye gauracandro natendrah || 54|| jagadatulamanojno natya
    lilabhivijnah kalitamadhuravesho murchitasheshadeshah | prabalagunagabhirah shuddhasattvasvabhavah
    sphuratu hridaya madhye gauracandro natendrah || 55|| niravadhi galadashruh sveda yuktah sakampah
    pulakavalitadehah sarvalavanyagehah | manasijashatacittakshobhakari yashasvi sphuratu hridaya madhye
    gauracandro natendrah || 56|| shamanadamananama krishnanamapradanah paramapatitadinatrana karunyasimah
    | vrajavipinarahasya prollasaccarugatrah sphuratu hridaya madhye gauracandro natendrah || 57|| sakalarasavidagdhah
    krishnanamapramodah prabalagunagabhirah praninistaradhirah | nirupamatanurupah dyotitanangabhupah
    sphuratu hridaya madhye gauracandro natendrah || 58|| vimalakamalavaktrah pakvabimbadharoshthas tilakusumasunasah
    kambukanthah sudirgha | suvalitabhujadando nabhigambhirarupah sphuratu hridaya madhye gauracandro
    natendrah || 59|| kashitakanakakanteh saralavanyamurtih kalikalushavihanta yasyakirtivarishthah |
    akhilabhuvanaloke premabhaktih pradata sphuratu hridaya madhye gauracandro natendrah || 60|| bahuvidhamanimala
    baddhakesho vicitro malayaja tilakodyad bhaladesho''lakalih | shravanayugala lolatkuntalo haravakshah
    sphuratu hridaya madhye gauracandro natendrah || 61|| yadavadhi harinama pradurasitprithivyam tadavadhi
    khalu loka vaishnavah sarvataste | tilakavimalamala namayuktah pavitrah hari hari kalimadhye evamevam
    babhuva || 62|| jive purnodaya yatah karunaya ha ha ravairprarthanam he he krishna kripanidhe'
  devanagari: ॥ १२॥ सर्वेषामवताराणां पुराणैर्यत्श्रुतं फलम् । तस्मान्मे निष्कृतिर्नास्ति अतस्ते शरणं गतः
    ॥ १३॥ विचित्र मधुराक्षर श्रुतिमनोज्ञ गीतो मुदा स्वभक्तगण मण्डली रचित मध्यगामी प्रभुः । मनोहर मनोहरो
    नटति गौरचन्द्रः स्वयं जगत्त्रय विभूषणो परमधाम नीलाचले ॥ १४॥ विलोक्य पुरुषोत्तमं कनक गौर देहो हरिर्
    मुदा हृदय पन्कजे जलदकान्ति आलिङ्गितुम् । पपात धरणीतले सकलभाव सम्मूर्च्छितः कदाचिदपि नेङ्गते परमधारि
    संस्पन्दनम् ॥ १५॥ गौरस्य नयने धारा सगद्गद वचो मुखे । पुलकाङ्कित सर्वाङ्गो भावे लुठति भूतले ॥ १६॥ चैतन्य
    चरणाम्भोजे यस्यास्ति प्रीतिरच्युता । वृन्दातवीशयोस्तस्य भक्तिस्याच्छत जन्मनि ॥ १७॥ यथा राधा पदाम्भोजे
    भक्तिः स्यात्प्रेमलक्षणा । तथैव कृष्णचैतन्ये वर्धते मधुरा रतिः ॥ १८॥ कनकमुकुरकान्तिं चारु वक्त्रारविन्दं
    मधुरमुकुर हास्यं पक्व बिम्बाधरोष्ठम् । सुवलित ललिताङ्गं कम्बुकण्ठं नटेन्द्रं त्रिभुवन कमनीयं गौरचन्द्रं
    प्रपद्ये ॥ १९॥ सुदीर्घसुमनोहरं मधुरकान्ति चन्द्राननं प्रफुल्लकमलेक्षणं दशनपङ्क्ति मुक्ताफलम् । सुपुष्प
    नवमञ्जरी श्रवणयुग्म सद्भूषणं प्रदीप्तमणि कङ्कणं कषितहेम गौरं भजे ॥ २०॥ अखिलभुवनबन्धो प्रेमसिन्धो जनेऽस्मिन्
    सकलकपटपूर्णे ज्ञानहीने प्रपन्ने । तव चरणसरोजे देहि दास्यं प्रभो त्वं पतित तरण नाम प्रादुरासीत् यतस्ते
    ॥ २१॥ ऊर्ध्वीकृत्य भुजद्वयं करुणया सर्वान्जनानादिशेत् रे रे भागवता हरिं वद वद श्रीगौरचन्द्रः स्वयम्
    । प्रेम्णा नृत्यति हुङ्कृति विकुरते हा हा रवैर्व्याकुलो भूमौ लुण्ठति मूर्च्छति स्वहृदये हस्तौ विनिक्षिप्यति
    ॥ २२॥ हरेनाम कृष्णनाम गानदान कारिनीं शोकमोह लोभताप सर्वविघ्न नाशिनीम् । पादपद्मलुब्ध भक्तवृन्द भक्तिदायिनीं
    गौरमूर्तिमाशु नौमि नाम सूत्रधारिणीम् ॥ २३॥ मालतीमल्लिकादाम बद्ध कुञ्चित कुन्तलम् । भालोद्यत्तिलकं
    गण्ड रत्नकुण्डलमण्डितम् ॥ २४॥ श्रीखण्डागुरुलिप्ताङ्गं कङ्कणाङ्गद भूषितम् । क्वनन्मङ्जीर चरणं गौरचन्द्रमहं
    भजे ॥ २५॥ मधुरं मधुरं कनकाभ तनुमरुणाम्बर सत्परिधेयमहो । जगदेक शुभं सकलैक परं करुणप्रवणं भज तं परमम्
    ॥ २६॥ कृष्णरूपं परित्यज्य कलौ गौरो बभूव यः । तं वन्दे परमानन्दं श्रीचैतन्य महाप्रभुम् ॥ २७॥ पीतांशुकं
    परित्यज्य शोणाम्बर धरोति यः । तं गौरं करुणा सिन्धुमाश्रये भुवनाश्रयम् ॥ २८॥ अवतीर्णः पुनः कृष्णो गौरचन्द्र
    सनातनः । मग्नास्त्रिभाग पापेस्मिन्तेषां त्राणस्य हेतवे ॥ २९॥ अवतीर्णे कलौ गौरे चण्डालाद्याः कुजातयः
    । यावन्तः पापिनश्चापि प्रायसो वैष्णवा अमी ॥ ३०॥ पतितं दुर्गतं दृष्ट्वा वैष्णवा लोकपावनाः । करौ धृत्वा
    हरेर्नाम याचन्ति कृपया कलौ ॥ ३१॥ सङ्कीर्तनारम्भकृतेऽपि गौरे धावन्ति जीवश्रवणे गुणानि । अशुद्धचित्ताः
    किमु शुद्धचित्ताः श्रुत्वा प्रमत्ताः खलु ते ननर्तुः ॥ ३२॥ किमाश्चर्यं किमाश्चर्यं कलौ जाते शचीसुते
    । स्त्रीबाल जडमूर्खाद्याः सर्वे नामपरायणाः ॥ ३३॥ चण्डाल यवना मूर्खाः सर्वे कुर्वन्ति कीर्तनम् । हरेर्नाम्नां
    गुणानां च गौरे जाते कलौ युगे ॥ ३४॥ किमद्भुतं गौरहरेश्चरित्रं ततोऽधिकं तत्प्रिय सेवकानाम् । सङ्कीर्तनामोद
    जनानुराग प्रेमप्रदानं वितनोति लोके ॥ ३५॥ सुवलितमणि मालैर्बद्धचूडं मनोज्ञः सुललित मृदुभाले चन्दनेनाणुचित्रम्
    । श्रवणयुगलरन्ध्रे कुण्डलौ यस्य भातौ हृदिविनिहितहारं नौमि तं गौरचन्द्रम् ॥ ३६॥ चैतन्यरूपगुणकर्म मनोज्ञवेशं
    यः सर्वदा स्मरति देहमनोवचोभिः । तस्यैव पादतलपद्मरजोभिलाषी सेवां करोमि शतजन्मनि बन्धुपुत्रैः ॥ ३७॥
    इयं रसज्ञा तव नामकीर्तने श्रोत्रौ मनो मे श्रवणेऽनुचिन्तने । नेत्रे च ते रूपनिरीक्षणे सदा शिरोऽस्तु
    चैतन्य पादाभिवन्दने ॥ ३८॥ सङ्कीर्तनानन्दरस स्वरूपाः प्रेमप्रदानैः खलु शुद्धचित्ताः । सर्वे महान्तः
    किल कृष्ण तुल्याः संसार लोकान्परितारयन्ति ॥ ३९॥ यस्मिन्देशे कुलाचारो धर्माचारश्च नास्ति वै । तथापि
    धन्यस्तद्देशो नाम सङ्कीर्तनाद्धरेः ॥ ४०॥ यावतां च कुतन्त्राणां समुद्धारस्य हेतवे । अवतीर्णः कलौ कृष्णचैतन्यो
    जगतां पतिः ॥ ४१॥ सर्वावतारा भजतां जनानां त्रातुं समर्थाः किल साधुवार्ता । भक्तानभक्तानपि गौरचन्द्रस्ततार
    कृष्णामृतनामदानैः ॥ ४२॥ चैतन्य प्रेमदाताखिल भुवन जनान्भाव हुङ्कार् नादैर्गोविन्दाकृष्ट चित्तान्कुविषय
    विरतान्कारयामास शीघ्रम् । एवं श्रीगौरचन्द्रे जगति च जनिते वञ्चितो यहि मूर्खस्तापी पापी सुरापी हरिगुरुविमुखः
    सर्वदा वञ्चितः सः ॥ ४३॥ त्रिभुवनकमणीये गौरचन्द्रेऽवतीर्णे पतितयवनमूर्खाः सर्वथा स्फोटयन्तः । इह जगति
    समस्ता नाम सङ्कीर्तनार्ता वयमपि च कृतार्थाः कृष्णनामाश्रयात् ॥ ४४॥ मधुरमधुरमेतद् वैष्णवानां चरित्रं
    कलिमलकृत हीनान्दोषबुद्ध्या न जग्मुः । सकल निगमसारं नामदातुं च तत्र प्रबलकरुणया श्रीगौरचन्द्रोऽवतीर्णः
    ॥ ४५॥ लोकान्समस्तान्कलिदुर्ग वारिधेर्नाम्ना समुत्तार्य स्वतः समर्पितम् । श्रीगौरचन्द्रैर्हरि वैष्णवानां
    नाम्नश्च तत्त्वं कथितं जने जने ॥ ४६॥ यावन्तो वैष्णवा लोके परित्राणस्य हेतवे । रटन्ति प्रभुनादिष्टा
    देशे देशे गृहे गृहे ॥ ४७॥ जगद्बन्धोर्जगत्कर्तुर्जगतां त्राणहेतवे । यत्र तत्र हरेः सेवा कीर्तने स्थापिते
    सुखे ॥ ४८॥ गौराङ्गः प्रेममूर्तिर्जगति यदवधि प्रेमदानं करोति पापी तापी सुरापी निखिल जनधनस्यापहारी कृतघ्नः
    । सर्वान्धर्मान्स्वकीयान्विषमिव विषयं सम्परित्यज्य कृष्णं गायन्त्युच्चैः प्रमत्तास्तदवधि विकलाः प्रेमसिन्धौ
    विमग्नाः ॥ ४९॥ येषां कस्मिन्कलि युगे नोद्धारो बहु जन्मसु । कलौ ते ते सुखे मग्ना नामगानप्रसादतः ॥ ५०॥
    हरेर्नाम्नां प्रसादेन निस्तरेत्पातकी जनः । उपदेष्टा स्वयं कृष्णचैतन्यो जगदीश्वरः ॥ ५१॥ अखिलभुवन बन्धुर्नाम
    दाता कृपालुः कषितकनकवर्णः सर्वमाधुर्यपूर्णः । अतिसुमधुरहासः स्निग्धदृक्प्रेमभासः स्फुरतु हृदयमध्ये
    गौरचन्द्रो नटेन्द्रः ॥ ५२॥ अतिमधुरचरित्रः कृष्णनामैकमन्त्रो भुवनविदित सर्वप्रेमदाता नितान्तः । विपुल
    पुलक धारी चित्त हारी जनानां स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ५३॥ सकल निगम सारः पूर्ण पूर्णावतारः
    कलि कलुष विनाशः प्रेम भक्ति प्रकाशः । प्रिय सहचर सङ्गे रङ्ग भङ्ग्या विलासी स्फुरतु हृदय मध्ये गौरचन्द्रो
    नटेन्द्रः ॥ ५४॥ जगदतुलमनोज्ञो नाट्य लीलाभिविज्ञः कलितमधुरवेशो मूर्छिताशेषदेशः । प्रबलगुणगभीरः शुद्धसत्त्वस्वभावः
    स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ५५॥ निरवधि गलदश्रुः स्वेद युक्तः सकम्पः पुलकवलितदेहः सर्वलावण्यगेहः
    । मनसिजशतचित्तक्षोभकारी यशस्वी स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ५६॥ शमनदमननाम कृष्णनामप्रदानः
    परमपतितदीनत्राण कारुण्यसीमः । व्रजविपिनरहस्य प्रोल्लसच्चारुगात्रः स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः
    ॥ ५७॥ सकलरसविदग्धः कृष्णनामप्रमोदः प्रबलगुणगभीरः प्राणिनिस्तारधीरः । निरुपमतनुरूपः द्योतितानङ्गभूपः
    स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ५८॥ विमलकमलवक्त्रः पक्वबिम्बाधरोष्ठस् तिलकुसुमसुनासः कम्बुकण्ठः
    सुदीर्घ । सुवलितभुजदण्डो नाभिगम्भीररूपः स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ५९॥ कषितकनककान्तेः
    सारलावण्यमूर्तिः कलिकलुषविहन्ता यस्यकीर्तिवरिष्ठाः । अखिलभुवनलोके प्रेमभक्तिः प्रदाता स्फुरतु हृदय
    मध्ये गौरचन्द्रो नटेन्द्रः ॥ ६०॥ बहुविधमणिमाला बद्धकेशो विचित्रो मलयज तिलकोद्यद् भालदेशोऽलकालिः ।
    श्रवणयुगल लोलत्कुन्तलो हारवक्षाः स्फुरतु हृदय मध्ये गौरचन्द्रो नटेन्द्रः ॥ ६१॥ यदवधि हरिनाम प्रादुरासीत्पृथिव्यां
    तदवधि खलु लोका वैष्णवाः सर्वतस्ते । तिलकविमलमाला नामयुक्ताः पवित्राः हरि हरि कलिमध्ये एवमेवं बभूव
    ॥ ६२॥ जीवे पूर्णोदया यतः करुणया हा हा रवैर्प्रार्थनां हे हे कृष्ण कृपानिधे
