id: bhaktakritamshrikrishnastotram
category: stotram
name:
  english: bhaktakritamshrikrishnastotram
  devanagari: भक्तकृतंश्रीकृष्णस्तोत्रम्
content:
  english: bhaktakritam shrikrishnastotram bhakta uvaca | he krishna radhikanatha karunasagara prabho
    | samsarasagaradghorat mamuddhara bhayanakat || 82|| shatajanmakritayasadudvignasya mama prabho |
    svakarmapashanigadairbaddhasya mokshanam kuru || 83|| pranatam padapadme te pashya mam sharanagatam
    | bhavapashabhayadbhitam pahi tvam sharanagatam || 84|| bhaktihinam kriyahinam vidhihinam ca vedatah
    | vastumantravihinam yattatsampurnam kuru prabho || 89|| vedoktavihita'jnanatsvangahine ca karmani
    | tvannamoccaranenaiva sarvam purnam bhaveddhare || 86|| iti stutva tam pranamya dattva vipraya dakshinam
    | mahotsavam vidhayatha kuryajjagaranam vrati || 87|| iti shribrahmavaivartapurane shrikrishnajanmakhande
    purve shadvimshadhyayantargatam bhaktakritam shrikrishnastotram samaptam | brahmavaivartapurana |
    shrikrishnajanma
  devanagari: भक्तकृतं श्रीकृष्णस्तोत्रम् भक्त उवाच । हे कृष्ण राधिकानाथ करुणासागर प्रभो । संसारसागराद्घोरात्
    मामुद्धर भयानकात् ॥ ८२॥ शतजन्मकृतायासादुद्विग्नस्य मम प्रभो । स्वकर्मपाशनिगडैर्बद्धस्य मोक्षणं कुरु
    ॥ ८३॥ प्रणतं पादपद्मे ते पश्य मां शरणागतम् । भवपाशभयाद्भीतं पाहि त्वं शरणागतम् ॥ ८४॥ भक्तिहीनं क्रियाहीनं
    विधिहीनं च वेदतः । वस्तुमन्त्रविहीनं यत्तत्सम्पूर्णं कुरु प्रभो ॥ ८९॥ वेदोक्तविहिताऽज्ञानात्स्वाङ्गहीने
    च कर्मणि । त्वन्नामोच्चारणेनैव सर्वं पूर्णं भवेद्धरे ॥ ८६॥ इति स्तुत्वा तं प्रणम्य दत्त्वा विप्राय
    दक्षिणाम् । महोत्सवं विधायाथ कुर्याज्जागरणं व्रती ॥ ८७॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    पूर्वे षड्विंशाध्यायान्तर्गतं भक्तकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
