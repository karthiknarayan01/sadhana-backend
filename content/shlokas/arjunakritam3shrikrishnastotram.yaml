id: arjunakritam3shrikrishnastotram
category: stotram
name:
  english: arjunakritam3shrikrishnastotram
  devanagari: अर्जुनकृतं३श्रीकृष्णस्तोत्रम्
content:
  english: arjunakritam 3 shrikrishnastotram vishvakarmannamaste'stu vishvatmanvishvasambhava | yathaham
    tva vijanami yatha caham bhavanmanah || 8|| tvattejahsambhavo nityam hutasho madhusudana | ratih kridamayi
    tubhyam maya te rodasi vibho || 9|| tvayi sarvamidam vishvam yadidam sthanujangamam | tvam hi sarvam
    vikurushe bhutagramam sanatanam || 10|| prithivim cantariksham ca tatha sthavarajangamam | hasitam
    te'mala jyotsna ritavashcendriyanvayah || 11|| prano vayuh satatagah krodho mrityuh sanatanah | prasade
    capi padma shrirnityam tvayi mahamate || 12|| ratistushtirdhritih kshantistvayi cedam caracaram |
    tvameveha yuganteshu nidhanam procyase'nagha || 13|| sudirghenapi kalena na te shakya guna maya |
    atma ca paramo vaktum namaste nalinekshana || 14|| iti mahabharate ashvamedhikaparvani 51 adhyayantargatam
    arjunakritam shrikrishnastotram sampurnam | mahabharata | ashvaparva | adhyaya 51
  devanagari: अर्जुनकृतं ३ श्रीकृष्णस्तोत्रम् विश्वकर्मन्नमस्तेऽस्तु विश्वात्मन्विश्वसम्भव । यथाहं त्वा
    विजानामि यथा चाहं भवन्मनाः ॥ ८॥ त्वत्तेजःसम्भवो नित्यं हुताशो मधुसूदन । रतिः क्रीडामयी तुभ्यं माया
    ते रोदसी विभो ॥ ९॥ त्वयि सर्वमिदं विश्वं यदिदं स्थाणुजङ्गमम् । त्वं हि सर्वं विकुरुषे भूतग्रामं सनातनम्
    ॥ १०॥ पृथिवीं चान्तरिक्षं च तथा स्थावरजङ्गमम् । हसितं तेऽमला ज्योत्स्ना ऋतवश्चेन्द्रियान्वयाः ॥ ११॥
    प्राणो वायुः सततगः क्रोधो मृत्युः सनातनः । प्रसादे चापि पद्मा श्रीर्नित्यं त्वयि महामते ॥ १२॥ रतिस्तुष्टिर्धृतिः
    क्षान्तिस्त्वयि चेदं चराचरम् । त्वमेवेह युगान्तेषु निधनं प्रोच्यसेऽनघ ॥ १३॥ सुदीर्घेणापि कालेन न ते
    शक्या गुणा मया । आत्मा च परमो वक्तुं नमस्ते नलिनेक्षण ॥ १४॥ इति महाभारते आश्वमेधिकपर्वणि ५१ अध्यायान्तर्गतं
    अर्जुनकृतं श्रीकृष्णस्तोत्रम् सम्पूर्णम् । महाभारत । आश्वपर्व । अध्याय ५१
