    ॥ ॥ ए दारिका परिचारिका करि पालिबीं करुना नी। अपराधु छमिबो बोलि पठे बहुत हौं ढीट्यो की ॥ पुनि भानुकुलभूषन
    सकल सनमान निधि समधी किए। कहि जाति नहिं बिनती परस्पर प्रेम परिपूरन हिए ॥ ॥ बृन्दारका गन सुमन बरिसहिं
    राउ जनवासेहि चले। दुन्दुभी जय धुनि बेद धुनि नभ नगर कौतूहल भले ॥ तब सखीं मङ्गल गान करत मुनीस आयसु पाइ
    कै। दूलह दुलहिनिन्ह सहित सुन्दरि चलीं कोहबर ल्याइ कै ॥ पुनि पुनि रामहि चितव सिय सकुचति मनु सकुचै न।
    हरत मनोहर मीन छबि प्रेम पिआसे नैन ॥ ग्यारहवाँ विश्राम स्याम सरीरु सुभायँ सुहावन। सोभा कोटि मनोज लजावन
    ॥ जावक जुत पद कमल सुहाए। मुनि मन मधुप रहत जिन्ह छाए ॥ पीत पुनीत मनोहर धोती। हरति बाल रबि दामिनि जोती
    ॥ कल किङ्किनि कटि सूत्र मनोहर। बाहु बिसाल बिभूषन सुन्दर ॥ पीत जनेउ महाछबि देई। कर मुद्रिका चोरि चितु
    लेई ॥ सोहत ब्याह साज सब साजे। उर आयत उरभूषन राजे ॥ पिअर उपरना काखासोती। दुहुँ आँचरन्हि लगे मनि मोती
    ॥ नयन कमल कल कुण्डल काना। बदनु सकल सौन्दर्ज निधाना ॥ सुन्दर भृकुटि मनोहर नासा। भाल तिलकु रुचिरता निवासा
    ॥ सोहत मौरु मनोहर माथे। मङ्गलमय मुकुता मनि गाथे ॥ छं गाथे महामनि मौर मञ्जुल अङ्ग सब चित चोरहीं। पुर
    नारि सुर सुन्दरीं बरहि बिलोकि सब तिन तोरहीम् ॥ मनि बसन भूषन वारि आरति करहिं मङ्गल गावहिं। सुर सुमन
    बरिसहिं सूत मागध बन्दि सुजसु सुनावहीम् ॥ ॥ कोहबरहिं आने कुँअर कुँअरि सुआसिनिन्ह सुख पाइ कै। अति प्रीति
    लौकिक रीति लागीं करन मङ्गल गाइ कै ॥ लहकौरि गौरि सिखाव रामहि सीय सन सारद कहैं। रनिवासु हास बिलास रस
    बस जन्म को फलु सब लहैम् ॥ ॥ निज पानि मनि महुँ देखिअति मूरति सुरूपनिधान की। चालति न भुजबल्ली बिलोकनि
    बिरह भय बस जानकी ॥ कौतुक बिनोद प्रमोदु प्रेमु न जाइ कहि जानहिं अलीं। बर कुअँरि सुन्दर सकल सखीं लवाइ
    जनवासेहि चलीम् ॥ ॥ तेहि समय सुनिअ असीस जहँ तहँ नगर नभ आनँदु महा। चिरु जिअहुँ जोरीं चारु चारयो मुदित
    मन सबहीं कहा ॥ जोगीन्द्र सिद्ध मुनीस देव बिलोकि प्रभु दुन्दुभि हनी। चले हरषि बरषि प्रसून निज निज लोक
    जय जय जय भनी ॥ सहित बधूटिन्ह कुअँर सब तब आए पितु पास। सोभा मङ्गल मोद भरि उमगेउ जनु जनवास ॥ ॥ पुनि
    जेवनार भी बहु भाँती। पठे जनक बोलाइ बराती ॥ परत पाँवड़ए बसन अनूपा। सुतन्ह समेत गवन कियो भूपा ॥ सादर
    सबके पाय पखारे। जथाजोगु पीढ़न्ह बैठारे ॥ धोए जनक अवधपति चरना। सीलु सनेहु जाइ नहिं बरना ॥ बहुरि राम
    पद पङ्कज धोए। जे हर हृदय कमल महुँ गोए ॥ तीनिउ भाई राम सम जानी। धोए चरन जनक निज पानी ॥ आसन उचित सबहि
    नृप दीन्हे। बोलि सूपकारी सब लीन्हे ॥ सादर लगे परन पनवारे। कनक कील मनि पान सँवारे ॥ दो सूपोदन सुरभी
    सरपि सुन्दर स्वादु पुनीत। छन महुँ सब कें परुसि गे चतुर सुआर बिनीत ॥ ॥ पञ्च कवल करि जेवन लागे। गारि
