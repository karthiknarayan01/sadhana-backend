id: raghuttamagurustotram
category: stotram
name:
  english: raghuttamagurustotram
  devanagari: रघूत्तमगुरुस्तोत्रम्
content:
  english: siddhantabdhimanantashishyakumudavratam vikasam nayan | udbhuto raghuvaryatirthajaladhestapatrayam
    trasayan yastam naumi raghuttamakhyashashinam shrivishnupadashrayam || 2|| udyanmartandasankasham
    dandamalakamandalun | dharam kaupinasutram ca sitaraghavamanasam || 3|| shrinivasena vandyanghrim
    tulasidamabhushanam | dhyayedraghuttamagurum sarvasaukhyapradam nrinam || 4|| raghuttamagurum naumi
    shantyadigunamanditam | raghuttamapadadvandvakanjabhringayitantaram || 5|| raghuttamagurum vande raghuttamapadarcakam
    | gambhiryenarthabahulyatikatatparyabodhakam || 6|| bhavabodhakritam naumi bhavabhavitabhavukam |
    bhavabhajam bhavajadiparibhavaparayanam || 7|| sannyayavivriteshtikasheshasampurnakarinam | tikam
    drishtva petikanam nicayam ca cakara yah prameyamanimalanam sthapanaya mahamatih || 8|| yacchishyashishyashishyadyashtippanyacaryasamjnitah
    | tamalam bhavabodharyam bhuyo bhuyo namamyaham || 9|| shukena shantyadishu vanmayeshu vyasena dhairye'mbudhinopameyam
    | manojajityam manasam hi patya raghuttamakhyam svagurum namami || 10|| rama rama tava padapankajam
    cintayami bhavabandhamuktaye | vanditam suranarendramaulibhirdhyayate manasi yogibhih sada|| 11||
    pinakinirasanjashtadeshe vasamanoramam | pinakipujyashrimadhvashastravardhinishakaram || 12|| pancakairbhavabodhakhyairgranthaih
    panca lasanmukhaih | tattvavijnapakaih svanamupameyam pinakina || 13|| gambhirye sarvadurvadigiripakshavidarane
    | vishayeshu viragitve copameyam pinakina || 14|| dharane bhagavanmurterbharane bhaktasantateh | vina
    vina copameyam meyam tattvaprakashane || 15|| gurutve'khilalokanam pradane'bhishtasantateh | shishyebhyastattvavijnanapradane
    paramam gurum || 16|| sadararamapadabjasadaratisudhakaram | sada'ribhedane vishnugadarisadrisham sada
    || 17|| raghunathanghrisadbhaktau raghunathanujayitam | raghunatharyapanyuttharaghuvaryakaroditam
    || 18|| vedesharcitapadabjam vedeshanghryabjapujakam | raghuttamagurum vande raghuttamapadarcakam
    || 19|| raghuttamagurustotrasyashtakam yah pathennarah | raghuttamaprasadacca sa sarvabhishtabhagbhavet
    || 20|| yadvrindavanapurvatah phalavati dhatri jagatpavani yamyayam tu pinakini caladalo murtitrayadhishthitah
    | varunyam dishi vamatah pratikritau chayakrita tintrini tadvrindavanamadhyago guruvaro bhuyat sa
    nah shreyase || 21|| pranamatkamadhenum ca bhajatsuratarupamam | shribhavabodhakritpadacintamanimupasmahe
    || 22|| iti shriraghuttamagurustotram sampurnam |
  devanagari: सिद्धान्ताब्धिमनन्तशिष्यकुमुदव्रातं विकासं नयन् । उद्भूतो रघुवर्यतीर्थजलधेस्तापत्रयं त्रासयन्
    यस्तं नौमि रघूत्तमाख्यशशिनं श्रीविष्णुपादाश्रयम् ॥ २॥ उद्यन्मार्तण्डसङ्काशं दण्डमालाकमण्डलून् । धरं
    कौपीनसूत्रं च सीताराघवमानसम् ॥ ३॥ श्रीनिवासेन वन्द्याङ्घ्रिं तुलसीदामभूषणम् । ध्यायेद्रघूत्तमगुरुं
    सर्वसौख्यप्रदं नृणाम् ॥ ४॥ रघूत्तमगुरुं नौमि शान्त्यादिगुणमण्डितम् । रघूत्तमपदद्वन्द्वकञ्जभृङ्गायितान्तरम्
    ॥ ५॥ रघूत्तमगुरुं वन्दे रघूत्तमपदार्चकम् । गाम्भीर्येणार्थबाहुल्यटीकातात्पर्यबोधकम् ॥ ६॥ भावबोधकृतं
    नौमि भावभावितभावुकम् । भावभाजं भावजादिपरीभावपरायणम् ॥ ७॥ सन्न्यायविवृतेष्टीकाशेषसम्पूर्णकारिणम् ।
    टीकां दृष्ट्वा पेटिकानां निचयं च चकार यः प्रमेयमणिमालानां स्थापनाय महामतिः ॥ ८॥ यच्छिष्यशिष्यशिष्याद्याष्टिप्पण्याचार्यसंज्ञिताः
    । तमलं भावबोधार्यं भूयो भूयो नमाम्यहम् ॥ ९॥ शुकेन शान्त्यादिषु वाङ्मयेषु व्यासेन धैर्येऽम्बुधिनोपमेयम्
    । मनोजजित्यां मनसां हि पत्या रघूत्तमाख्यं स्वगुरुं नमामि ॥ १०॥ राम राम तव पादपङ्कजं चिन्तयामि भवबन्धमुक्तये
    । वन्दितं सुरनरेन्द्रमौलिभिर्ध्यायते मनसि योगिभिः सदा॥ ११॥ पिनाकिनीरसञ्जष्टदेशे वासमनोरमम् । पिनाकिपूज्यश्रीमध्वशास्त्रवार्धिनिशाकरम्
    ॥ १२॥ पञ्चकैर्भावबोधाख्यैर्ग्रन्थैः पञ्च लसन्मुखैः । तत्त्वविज्ञापकैः स्वानामुपमेयं पिनाकिना ॥ १३॥
    गाम्भीर्ये सर्वदुर्वादिगिरिपक्षविदारणे । विषयेषु विरागित्वे चोपमेयं पिनाकिना ॥ १४॥ धरणे भगवन्मूर्तेर्भरणे
    भक्तसन्ततेः । विना विना चोपमेयं मेयं तत्त्वप्रकाशने ॥ १५॥ गुरुत्वेऽखिललोकानां प्रदानेऽभीष्टसन्ततेः
    । शिष्येभ्यस्तत्त्वविज्ञानप्रदाने परमं गुरुम् ॥ १६॥ सदाररामपादाब्जसदारतिसुधाकरम् । सदाऽरिभेदने विष्णुगदारिसदृशं
    सदा ॥ १७॥ रघुनाथाङ्घ्रिसद्भक्तौ रघुनाथानुजायितम् । रघुनाथार्यपाण्युत्थरघुवर्यकरोदितम् ॥ १८॥ वेदेशार्चितपादाब्जं
    वेदेशाङ्घ्र्यब्जपूजकम् । रघूत्तमगुरुं वन्दे रघूत्तमपदार्चकम् ॥ १९॥ रघूत्तमगुरुस्तोत्रस्याष्टकं यः
    पठेन्नरः । रघूत्तमप्रसादाच्च स सर्वाभीष्टभाग्भवेत् ॥ २०॥ यद्वृन्दावनपूर्वतः फलवती धात्री जगत्पावनी
    याम्यायां तु पिनाकिनी चलदलो मूर्तित्रयाधिष्ठितः । वारुण्यां दिशि वामतः प्रतिकृतौ छायाकृता तिन्त्रिणी
    तद्वृन्दावनमध्यगो गुरुवरो भूयात् स नः श्रेयसे ॥ २१॥ प्रणमत्कामधेनुं च भजत्सुरतरूपमम् । श्रीभावबोधकृत्पादचिन्तामणिमुपास्महे
    ॥ २२॥ इति श्रीरघूत्तमगुरुस्तोत्रं सम्पूर्णम् ।
