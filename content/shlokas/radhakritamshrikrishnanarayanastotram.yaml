id: radhakritamshrikrishnanarayanastotram
category: stotram
name:
  english: radhakritamshrikrishnanarayanastotram
  devanagari: राधाकृतंश्रीकृष्णनारायणस्तोत्रम्
content:
  english: shriradhakritam shrikrishnanarayanastotram shriradhika uvaca | om namah shriparabrahma paresha
    paramatmane | anadishrikrishnanarayanaya'ksharashasine || 1|| tretasantanasatpitre radhakantaya yogine
    | lakshminarayanaya shrimanikyavahine namah || 2|| svaprabhasvamine manjulalakayatmavasine | ishaparavatishaya
    namah sagunamurtaye || 3|| hamsajyotisvarupaya shaktyaishvaryadisambhrite | kunkumavapikakshetraprakataya
    namo namah || 4|| sarvadhamadhipeshaya namo'ntaryamine muhuh | svargamokshadidatre te namah shriharaye
    namah || 5|| niravadhisamaishvaryagunavaibhavashaline | asankhyamuktasevyaya'ksharadhipataye namah
    || 6|| eko'pi bahudha drishtah krishnanarayanadiman | isheshanyadirupashca tasmai shrisvamine namah
    || 7|| paravidyadhidevaya brahmapriya'dhishayine | gitopanishatpataye jayantipataye namah || 8|| ekadashipriyayaradhanakantaya
    sharngine | mahalakshmishvarayapi bhaktishaya namo namah || 9|| mukteshaya rameshaya gangeshaya namo
    namah | pativratadhipataye rukminishaya te namah || 1
  devanagari: श्रीराधाकृतं श्रीकृष्णनारायणस्तोत्रम् श्रीराधिका उवाच । ॐ नमः श्रीपरब्रह्म परेश परमात्मने
    । अनादिश्रीकृष्णनारायणायाऽक्षरशासिने ॥ १॥ त्रेतासन्तानसत्पित्रे राधाकान्ताय योगिने । लक्ष्मीनारायणाय
    श्रीमाणिक्यावाहिने नमः ॥ २॥ स्वप्रभास्वामिने मञ्जुलालकायात्मवासिने । ईशापारवतीशाय नमः सगुणमूर्तये
    ॥ ३॥ हंसज्योतिस्वरूपाय शक्त्यैश्वर्यादिसम्भृते । कुङ्कुमवापिकाक्षेत्रप्रकटाय नमो नमः ॥ ४॥ सर्वधामाधिपेशाय
    नमोऽन्तर्यामिणे मुहुः । स्वर्गमोक्षादिदात्रे ते नमः श्रीहरये नमः ॥ ५॥ निरवधिसमैश्वर्यगुणवैभवशालिने
    । असङ्ख्यमुक्तसेव्यायाऽक्षराधिपतये नमः ॥ ६॥ एकोऽपि बहुधा दृष्टः कृष्णनारायणादिमान् । ईशेशान्यादिरूपश्च
    तस्मै श्रीस्वामिने नमः ॥ ७॥ परविद्याधिदेवाय ब्रह्मप्रियाऽधिशायिने । गीतोपनिषत्पतये जयन्तीपतये नमः
    ॥ ८॥ एकादशीप्रियायाराधनाकान्ताय शार्ङ्गिणे । महालक्ष्मीश्वरायापि भक्तीशाय नमो नमः ॥ ९॥ मुक्तेशाय रमेशाय
    गङ्गेशाय नमो नमः । पतिव्रताधिपतये रुक्मिणीशाय ते नमः ॥ १
