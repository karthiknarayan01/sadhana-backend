id: sandipanikritamshrikrishnastotram
category: stotram
name:
  english: sandipanikritamshrikrishnastotram
  devanagari: सान्दीपनिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: sandipanikritam shrikrishnastotram sandipaniruvaca | param brahma param dhama paramisha paratpara
    | svecchamayam svayanjyotirniliptaiko nirankushah || 6|| bhaktaikanatha bhakteshta bhaktanugrahavigraha
    | bhaktavanchakalpataro bhaktanam pranavallabha || 7|| mayaya balarupo'si brahmeshasheshavanditah
    | mayaya bhuvi bhupala bhuvo bharakshayaya ca || 8|| yogino yam vidantyevam brahmajyotih sanatanam
    | dhyayante bhaktanivaha jyotirabhyantare muda || 9|| dvibhujam muralihastam sundaram shyamarupakam
    | candanokshitasarvangam sasmitam bhaktavatsalam || 10|| pitambaradharam devam vanamalavibhushitam
    | lilapangatarangaishca ninditanangamurcchitam || 11|| alaktabhavanam tadvatpadapadmam sushobhanam
    | kaustubhodbhasitangam ca divyamurtim manoharam || 12|| ishaddhasyaprasannam ca suvesham prastutam
    suraih | devadevam jagannatham trailokyamohanam param || 13|| kotikandarpalilabham kamaniyamanishvaram
    | amulyaratnanirmanabhushanaughena bhushitam || 14|| varam varanyam varadam varadanamabhipsitam |
    caturnamapi vedanam karananam ca karanam || 15|| pathartha matpriyasthanamagato'si ca mayaya | patham
    te lokashikshartham ramanam gamanam ranam | svatmaramasya ca vibhoh paripurnatamasya ca || 16|| iti
    shribrahmavaivartapurane shrikrishnajanmakhande uttare dvyadhikashatatamadhyayantargatam sandipanikritam
    shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: सान्दीपनिकृतं श्रीकृष्णस्तोत्रम् सान्दीपनिरुवाच । परं ब्रह्म परं धाम परमीश परात्पर । स्वेच्छामयं
    स्वयञ्ज्योतिर्निलिप्तैको निरङ्कुशः ॥ ६॥ भक्तैकनाथ भक्तेष्ट भक्तानुग्रहविग्रह । भक्तवाञ्छाकल्पतरो भक्तानां
    प्राणवल्लभ ॥ ७॥ मायया बालरूपोऽसि ब्रह्मेशशेषवन्दितः । मायया भुवि भूपाल भुवो भारक्षयाय च ॥ ८॥ योगिनो
    यं विदन्त्येवं ब्रह्मज्योतिः सनातनम् । ध्यायन्ते भक्तनिवहा ज्योतिरभ्यन्तरे मुदा ॥ ९॥ द्विभुजं मुरलीहस्तं
    सुन्दरं श्यामरूपकम् । चन्दनोक्षितसर्वाङ्गं सस्मितं भक्तवत्सलम् ॥ १०॥ पीताम्बरधरं देवं वनमालाविभूषितम्
    । लीलापाङ्गतरङ्गैश्च निन्दितानङ्गमूर्च्छितम् ॥ ११॥ अलक्तभवनं तद्वत्पादपद्मं सुशोभनम् । कौस्तुभोद्भासिताङ्गं
    च दिव्यमूर्तिं मनोहरम् ॥ १२॥ ईषद्धास्यप्रसन्नं च सुवेषं प्रस्तुतं सुरैः । देवदेवं जगन्नाथं त्रैलोक्यमोहनं
    परम् ॥ १३॥ कोटिकन्दर्पलीलाभं कमनीयमनीश्वरम् । अमूल्यरत्ननिर्माणभूषणौघेन भूषितम् ॥ १४॥ वरं वरण्यं वरदं
    वरदानामभीप्सितम् । चतुर्णामपि वेदानां कारणानां च कारणम् ॥ १५॥ पाठार्थ मत्प्रियस्थानमागतोऽसि च मायया
    । पाठं ते लोकशिक्षार्थं रमणं गमनं रणम् । स्वात्मारामस्य च विभोः परिपूर्णतमस्य च ॥ १६॥ इति श्रीब्रह्मवैवर्तपुराणे
    श्रीकृष्णजन्मखण्डे उत्तरे द्व्यधिकशाततमाध्यायान्तर्गतं सान्दीपनिकृतं श्रीकृष्णस्तोत्रं समाप्तम् ।
    ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
