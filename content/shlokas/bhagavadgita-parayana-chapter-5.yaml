id: bhagavadgita-parayana-chapter-5
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 5
content:
  english: om shri paramatmane namah atha pancamo'dhyayah karmasannyasayogah arjuna uvaca sannyasam karmanam
    krishna punaryogam ca shamsasi | yacchreya etayorekam tanme bruhi sunishcitam || || shri bhagavanuvaca
    sannyasah karmayogashca nishshreyasakaravubhau | tayostu karmasannyasat karmayogo vishishyate || ||
    jneyah sa nityasannyasi yo na dveshti na kankshati | nirdvandvo hi mahabaho sukham bandhatpramucyate
    || || sankhyayogau prithagbalah pravadanti na panditah | ekamapyasthitah samyak ubhayorvindate phalam
    || || yatsankhyaih prapyate sthanam tadyogairapi gamyate | ekam sankhyam ca yogam ca yah pashyati
    sa pashyati || || sannyasastu mahabaho duhkhamaptumayogatah | yogayukto munirbrahma nacirenadhigacchati
    || || yogayukto vishuddhatma vijitatma jitendriyah | sarvabhutatmabhutatma kurvannapi na lipyate ||
    || naiva kincitkaromiti yukto manyeta tattvavit | pashyanshrinvansprishanjighran ashnangacchansvapanshvasan
    || || pralapanvisrijangrihnan unmishannimishannapi | indriyanindriyartheshu vartanta iti dharayan
    || || brahmanyadhaya karmani sangam tyaktva karoti yah | lipyate na sa papena padmapatramivambhasa
    || || kayena manasa buddhya kevalairindriyairapi | yoginah karma kurvanti sangam tyaktvatmashuddhaye
    || || yuktah karmaphalam tyaktva shantimapnoti naishthikim | ayuktah kamakarena phale sakto nibadhyate
    || || sarvakarmani manasa sannyasyaste sukham vashi | navadvare pure dehi naiva kurvanna karayan ||
    || na kartritvam na karmani lokasya srijati prabhuh | na karmaphalasamyogam svabhavastu pravartate
    || || nadatte kasyacitpapam na caiva sukritam vibhuh | ajnanenavritam jnanam tena muhyanti jantavah
    || || jnanena tu tadajnanam yesham nashitamatmanah | teshamadityavajjnanam prakashayati tatparam ||
    || tadbuddhayastadatmanah tannishthastatparayanah | gacchantyapunaravrittim jnananirdhutakalmashah
    || || vidyavinayasampanne brahmane gavi hastini | shuni caiva shvapake ca panditah samadarshinah ||
    || ihaiva tairjitah sargah yesham samye sthitam manah | nirdosham hi samam brahma tasmat brahmani
    te sthitah || || na prahrishyetpriyam prapya nodvijetprapya capriyam | sthirabuddhirasammudhah brahmavit
    brahmani sthitah || || bahyasparsheshvasaktatma vindatyatmani yatsukham | sa brahmayogayuktatma sukhamakshayamashnute
    || || ye hi samsparshaja bhogah duhkhayonaya eva te | adyantavantah kaunteya na teshu ramate budhah
    || || shaknotihaiva yah sodhum prakshariravimokshanat | kamakrodhodbhavam vegam sa yuktah sa sukhi
    narah || || yo'ntahsukho'ntararamah tathantarjyotireva yah | sa yogi brahmanirvanam brahmabhuto'dhigacchati
    || || labhante brahmanirvanam rishayah kshinakalmashah | chinnadvaidha yatatmanah sarvabhutahite ratah
    || || kamakrodhaviyuktanam yatinam yatacetasam | abhito brahmanirvanam vartate viditatmanam || ||
    sparshankritva bahirbahyan cakshushcaivantare bhruvoh pranapanau samau kritva nasabhyantaracarinau
    || || yatendriyamanobuddhih munirmokshaparayanah | vigatecchabhayakrodhah yah sada mukta eva sah ||
    || bhoktaram yajnatapasam sarvalokamaheshvaram | suhridam sarvabhutanam jnatva mam shantimricchati
    || || || om tatsaditi shrimadbhagavadgitasu upanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade
    karmasannyasayogo nama pancamo'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ पञ्चमोऽध्यायः कर्मसन्न्यासयोगः अर्जुन उवाच सन्न्यासं कर्मणां कृष्ण
    पुनर्योगं च शंससि । यच्छ्रेय एतयोरेकं तन्मे ब्रूहि सुनिश्चितम् ॥ ॥ श्री भगवानुवाच सन्न्यासः कर्मयोगश्च
    निश्श्रेयसकरावुभौ । तयोस्तु कर्मसन्न्यासात् कर्मयोगो विशिष्यते ॥ ॥ ज्ञेयः स नित्यसन्न्यासी यो न द्वेष्टि
    न काङ्क्षति । निर्द्वन्द्वो हि महाबाहो सुखं बन्धात्प्रमुच्यते ॥ ॥ साङ्ख्ययोगौ पृथग्बालाः प्रवदन्ति
    न पण्डिताः । एकमप्यास्थितः सम्यक् उभयोर्विन्दते फलम् ॥ ॥ यत्साङ्ख्यैः प्राप्यते स्थानं तद्योगैरपि
    गम्यते । एकं साङ्ख्यं च योगं च यः पश्यति स पश्यति ॥ ॥ सन्न्यासस्तु महाबाहो दुःखमाप्तुमयोगतः । योगयुक्तो
    मुनिर्ब्रह्म नचिरेणाधिगच्छति ॥ ॥ योगयुक्तो विशुद्धात्मा विजितात्मा जितेन्द्रियः । सर्वभूतात्मभूतात्मा
    कुर्वन्नपि न लिप्यते ॥ ॥ नैव किञ्चित्करोमीति युक्तो मन्येत तत्त्ववित् । पश्यन्शृण्वन्स्पृशञ्जिघ्रन्
    अश्नन्गच्छन्स्वपन्श्वसन् ॥ ॥ प्रलपन्विसृजन्गृह्णन् उन्मिषन्निमिषन्नपि । इन्द्रियाणीन्द्रियार्थेषु
    वर्तन्त इति धारयन् ॥ ॥ ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः । लिप्यते न स पापेन पद्मपत्रमिवाम्भसा
    ॥ ॥ कायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि । योगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वात्मशुद्धये ॥ ॥ युक्तः
    कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम् । अयुक्तः कामकारेण फले सक्तो निबध्यते ॥ ॥ सर्वकर्माणि
    मनसा सन्न्यस्यास्ते सुखं वशी । नवद्वारे पुरे देही नैव कुर्वन्न कारयन् ॥ ॥ न कर्तृत्वं न कर्माणि लोकस्य
    सृजति प्रभुः । न कर्मफलसंयोगं स्वभावस्तु प्रवर्तते ॥ ॥ नादत्ते कस्यचित्पापं न चैव सुकृतं विभुः । अज्ञानेनावृतं
    ज्ञानं तेन मुह्यन्ति जन्तवः ॥ ॥ ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः । तेषामादित्यवज्ज्ञानं प्रकाशयति
    तत्परम् ॥ ॥ तद्बुद्धयस्तदात्मानः तन्निष्ठास्तत्परायणाः । गच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धूतकल्मषाः
    ॥ ॥ विद्याविनयसम्पन्ने ब्राह्मणे गवि हस्तिनि । शुनि चैव श्वपाके च पण्डिताः समदर्शिनः ॥ ॥ इहैव तैर्जितः
    सर्गः येषां साम्ये स्थितं मनः । निर्दोषं हि समं ब्रह्म तस्मात् ब्रह्मणि ते स्थिताः ॥ ॥ न प्रहृष्येत्प्रियं
    प्राप्य नोद्विजेत्प्राप्य चाप्रियम् । स्थिरबुद्धिरसम्मूढः ब्रह्मवित् ब्रह्मणि स्थितः ॥ ॥ बाह्यस्पर्शेष्वसक्तात्मा
    विन्दत्यात्मनि यत्सुखम् । स ब्रह्मयोगयुक्तात्मा सुखमक्षयमश्नुते ॥ ॥ ये हि संस्पर्शजा भोगाः दुःखयोनय
    एव ते । आद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः ॥ ॥ शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात् । कामक्रोधोद्भवं
    वेगं स युक्तः स सुखी नरः ॥ ॥ योऽन्तःसुखोऽन्तरारामः तथान्तर्ज्योतिरेव यः । स योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति
    ॥ ॥ लभन्ते ब्रह्मनिर्वाणम् ऋषयः क्षीणकल्मषाः । छिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः ॥ ॥ कामक्रोधवियुक्तानां
    यतीनां यतचेतसाम् । अभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम् ॥ ॥ स्पर्शान्कृत्वा बहिर्बाह्यान् चक्षुश्चैवान्तरे
    भ्रुवोः प्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ ॥ ॥ यतेन्द्रियमनोबुद्धिः मुनिर्मोक्षपरायणः । विगतेच्छाभयक्रोधः
    यः सदा मुक्त एव सः ॥ ॥ भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम् । सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति
    ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु उपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे कर्मसन्न्यासयोगो
    नाम पञ्चमोऽध्यायः ॥
