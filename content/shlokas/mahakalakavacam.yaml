id: mahakalakavacam
category: kavacha
name:
  english: mahakalakavacam
  devanagari: महाकालकवचम्
content:
  english: shri mahakalakavacam om shriganeshaya namah | shribhairava uvaca atha vakshyami deveshi kavacam
    mantragarbhakam | mulamantrasvarupam ca vishvamangalakabhidham || 1|| sarvasampatpradam caiva mahakalasya
    parvati | guhyatiguhyaparamam mulavidyamayam dhruvam || 2|| paramarthapradam nityam bhogamokshaikakaranam
    | mahabhayaharam devi mahaishvaryapradam shive || 3|| kavacasyasya deveshi rishirbhairava iritah|
    anushtupchanda ityuktam mahakalashca devata || 4|| kurcabijam parashaktistaram kilakamiritam | dharmarthakamamoksharthe
    viniyogah prakirtitah|| 5|| atha dhyanam | shyamavarnam mahakayam mahakalam trilocanam | nilakantham
    svatejaskam netratrayavibhushitam || 6|| khatvangacarmadharam devam varadabhayapanikam | shulahastam
    ca khatvangadharinam mantranayakam || 7|| pinakahastam devesham tomaram bibhratam vibhum | pratah
    pathetsahasram vai bhairavam tu sada smaret | evam vidhena dhyanena manasa cintayedvibhum || 8|| atha
    kavacam | om hram shirah patu me kalah lalate hrim sada mama | hram karakam praticyam me bijadvayasvarupini
    || 1|| hrim patu locanadvandvam mukham hrimbijarupini | hrim karakam kanthadeshe hrim patu skandhayormama
    || 2|| mahakalah sada patu bhujau savye nasau mama | hrinkaram hridayam patu hram me'vyadudaram sada
    || 3|| hrim nabhim patu satatam devi hrinkararupini | avyanme lingadesham ca hrim rakshedguhyadeshake
    || 4|| kurcayugmam patu padau svaha padatalam mama | shrishodashaksharah patu sarvange mama sarvada
    || 5|| antarvahnishca mam patu devadattashca bhairavah| nagalingamritapritah sarvasandhishu rakshatu
    || 6|| mahogro mam sada patu mamendriyasamuhakam | shivo mamendriyartheshu rakshayeddakshineshvapi
    || 7|| mahakalah pashcime'vyaddakshine devadattakah| bhagalingamritam prito bhagalingasvarupakah||
    8|| udicyamurdhvagah patu purve samharabhairavah| digambarah shmashanasthah patu dikshu vidikshu ca
    || 9|| phalashrutih | shatalaksham prajapto'pi tasya mantram na sidhyati | sa shastrajnanamapnoti
    so'ciranmrityumapnuyat || 10|| mantrena mriyate yogi rakshayet kavacam tatah | trisandhyam pathanadasya
    kavacasya tu parvati || 11|| siddhayo'shtau kare tasya mahesha iva caparah | rupena smaratulyeshto
    kamininam priyo bhavet || 12|| tasmadetatsukavacam na deyam yasyakasyacit | bhaktiyuktaya shantaya
    danashilaya dhimate || 13|| yo dadati sushishyebhyo vashye tasya jagadbhavet | guhyadguhyataram guhyam
    maharudrena bhashitam || 14|| ravau bhurje likhedvarma svayambhuh kusumastraja | kunkumenashtagandhena
    raktena nijaretasa ||| 15|| dharayanmurdhni va bahau prapnuyatparamam gatim | dhanakamo labhedvittam
    putrakamo labhetprajam || 16|| sarvan ripun rane jitva kalyani grihamavishet | yasya kanthagatam tasya
    karasthah sarvasiddhayah|| 17|| shrivishvakavacam nama kavacam na prakashayet | rahasyatirahasyam
    ca gopaniyam svayonivat || 18|| iti shrirudrayamale tantre vishvamangalam nama mahakalakavacam sampurnam
    |
  devanagari: श्री महाकालकवचम् ॐ श्रीगणेशाय नमः । श्रीभैरव उवाच अथ वक्ष्यामि देवेशि कवचम् मन्त्रगर्भकम्
    । मूलमन्त्रस्वरूपं च विश्वमङ्गलकाभिधम् ॥ १॥ सर्वसम्पत्प्रदं चैव महाकालस्य पार्वति । गुह्यातिगुह्यपरमं
    मूलविद्यामयं ध्रुवम् ॥ २॥ परमार्थप्रदं नित्यं भोगमोक्षैककारणम् । महाभयहरं देवि महैश्वर्यप्रदं शिवे
    ॥ ३॥ कवचस्यास्य देवेशि ऋषिर्भैरव ईरितः। अनुष्टुप्छन्द इत्युक्तं महाकालश्च देवता ॥ ४॥ कूर्चबीजं पराशक्तिस्तारं
    कीलकमीरितम् । धर्मार्थकाममोक्षार्थे विनियोगः प्रकीर्तितः॥ ५॥ अथ ध्यानम् । श्यामवर्णं महाकायं महाकालं
    त्रिलोचनम् । नीलकण्ठं स्वतेजस्कं नेत्रत्रयविभूषितम् ॥ ६॥ खट्वाङ्गचर्मधरं देवं वरदाभयपाणिकम् । शूलहस्तं
    च खट्वाङ्गधारिणं मन्त्रनायकम् ॥ ७॥ पिनाकहस्तं देवेशं तोमरं बिभ्रतं विभुम् । प्रातः पठेत्सहस्रं वै
    भैरवं तु सदा स्मरेत् । एवं विधेन ध्यानेन मनसा चिन्तयेद्विभुम् ॥ ८॥ अथ कवचम् । ॐ ह्रं शिरः पातु मे
    कालः ललाटे ह्रीं सदा मम । ह्रं कारकं प्रतीच्यां मे बीजद्वयस्वरूपिणी ॥ १॥ ह्रीं पातु लोचनद्वन्द्वं
    मुखं ह्रीम्बीजरूपिणि । ह्रीं कारकं कण्ठदेशे ह्रीं पातु स्कन्धयोर्मम ॥ २॥ महाकालः सदा पातु भुजौ सव्ये
    नसौ मम । ह्रीङ्कारं हॄदयं पातु ह्रं मेऽव्यादुदरं सदा ॥ ३॥ ह्रीं नाभिं पातु सततं देवी ह्रीङ्काररूपिणी
    । अव्यान्मे लिङ्गदेशं च ह्रीं रक्षेद्गुह्यदेशके ॥ ४॥ कूर्चयुग्मं पातु पादौ स्वाहा पादतलं मम । श्रीषोडशाक्षरः
    पातु सर्वाङ्गे मम सर्वदा ॥ ५॥ अन्तर्वह्निश्च मां पातु देवदत्तश्च भैरवः। नगलिङ्गामृतप्रीतः सर्वसन्धिषु
    रक्षतु ॥ ६॥ महोग्रो मां सदा पातु ममेन्द्रियसमूहकम् । शिवो ममेन्द्रियार्थेषु रक्षयेद्दक्षिणेष्वपि ॥
    ७॥ महाकालः पश्चिमेऽव्याद्दक्षिणे देवदत्तकः। भगलिङ्गामृतं प्रीतो भगलिङ्गस्वरूपकः॥ ८॥ उदीच्यामूर्ध्वगः
    पातु पूर्वे सम्हारभैरवः। दिगम्बरः श्मशानस्थः पातु दिक्षु विदिक्षु च ॥ ९॥ फलश्रुतिः । शतलक्षं प्रजप्तोऽपि
    तस्य मन्त्रं न सिध्यति । स शास्त्रज्ञानमाप्नोति सोऽचिरान्मृत्युमाप्नुयात् ॥ १०॥ मन्त्रेण म्रियते योगी
    रक्षयेत् कवचं ततः । त्रिसन्ध्यं पठनादस्य कवचस्य तु पार्वति ॥ ११॥ सिद्धयोऽष्टौ करे तस्य महेश इव चापरः
    । रूपेण स्मरतुल्येष्टो कामिनीनां प्रियो भवेत् ॥ १२॥ तस्मादेतत्सुकवचं न देयं यस्यकस्यचित् । भक्तियुक्ताय
    शान्ताय दानशीलाय धीमते ॥ १३॥ यो ददाति सुशिष्येभ्यो वश्ये तस्य जगद्भवेत् । गुह्याद्गुह्यतरं गुह्यं
    महारुद्रेण भाषितम् ॥ १४॥ रवौ भूर्जे लिखेद्वर्म स्वयम्भूः कुसुमस्त्रजा । कुङ्कुमेनाष्टगन्धेन रक्तेन
    निजरेतसा ॥। १५॥ धारयन्मूर्ध्नि वा बाहौ प्राप्नुयात्परमां गतिम् । धनकामो लभेद्वित्तं पुत्रकामो लभेत्प्रजाम्
    ॥ १६॥ सर्वान् रिपून् रणे जित्वा कल्याणी गृहमाविशेत् । यस्य कण्ठगतं तस्य करस्थाः सर्वसिद्धयः॥ १७॥ श्रीविश्वकवचं
    नाम कवचं न प्रकाशयेत् । रहस्यातिरहस्यं च गोपनीयं स्वयोनिवत् ॥ १८॥ इति श्रीरुद्रयामले तन्त्रे विश्वमङ्गलं
    नाम महाकालकवचं सम्पूर्णम् ।
