id: dattatreyasamkshiptakavacam
category: kavacha
name:
  english: dattatreyasamkshiptakavacam
  devanagari: दत्तात्रेयसंक्षिप्तकवचम्
content:
  english: trailokya vashamavaya svaha om dram om || iti shrigurudattatreya sankshipta kavacam sampurnam
    |
  devanagari: त्रैलोक्य वशमावय स्वाहा ॐ द्रां ओम् ॥ इति श्रीगुरुदत्तात्रेय सङ्क्षिप्त कवचं सम्पूर्णम्
    ।
