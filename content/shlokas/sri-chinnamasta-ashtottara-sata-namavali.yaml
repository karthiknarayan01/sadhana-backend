    नमः । ॐ डाकिनीसङ्गनिरतायै नमः । ॐ डाकिनीप्रेमपूरितायै नमः । ॐ खट्वाङ्गधारिण्यै नमः । ॐ खर्वायै नमः
    । ॐ खड्गखर्परधारिण्यै नमः । । ॐ प्रेतासनायै नमः । ॐ प्रेतयुतायै नमः । ॐ प्रेतसङ्गविहारिण्यै नमः ।
