id: aikamatya-suktam
category: stotram
name:
  english: Aikamatya Suktam
content:
  english: rigvede antimam suktam om samsamidyuvase vrishannagne vishva nyarya a | ilaspade samidhyase
    sa no vasunyabhara || sangacchadhvam sam si janatam | deva bhagam sanjanana upasate || samano mantra
    juhomi || samani va aku ssamana hridayani vah | samanamastu vo mano yatha ssusahasati || om shanti
  devanagari: ऋग्वेदे अन्तिमं सूक्तं ॐ संस॒मिद्युवसे वृष॒न्नग्ने॒ विश्वा न्य॒र्य आ । इ॒लस्प॒दे समि॑ध्यसे॒
    स नो॒ वसू॒न्याभर ॥ सङ्ग॑च्छध्वं॒ सं सि जानताम् । दे॒वा भा॒गं सञ्जाना॒ना उ॒पासते ॥ स॒मा॒नो मन्त्र॒
    जुहोमि ॥ स॒मा॒नी व॒ आकू स्समा॒ना हृदयानि वः । स॒मा॒नम॑स्तु वो॒ मनो॒ यथा स्सुस॒हासति ॥ ॐ शान्ति॒
