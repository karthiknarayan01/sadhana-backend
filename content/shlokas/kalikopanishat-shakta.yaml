id: kalikopanishat-shakta
category: upanishad
name:
  english: kalikopanishat (shakta)
  devanagari: कालिकोपनिषत् (शाक्त)
content:
  english: brahmarandhre brahmarupinimapnoti | subhagam trigunitam muktasubhagam kamarephendirasamastarupinimetani
    trigunitani tadanu kurcabijam vyomashashthasvaram vindumelanarupam taddvayam mayadvayam dakshine kalike
    cetyabhimukhagatam tadanu banjasaptakamuccarya brihadbhanujayamuccaret | sa tu shivamayo bhavet |
    sarvasiddhishvaro bhavet | gatistasyastiti | nanyasya gatirastati | sa tu vagishvarah | sa tu narishvarah
    | sa tu deveshvarah | sa tu sarveshvarah | abhinavajaladasankasha ghanastani bhatihavedashta shavagana
    kalika dhyeya | trinenam pancakonam navakonam padmam | tasmin devi sarvange'bhyarcya tadidam rvangam
    kali kapalini kulla kurukulla virodhini vipracitta ugra ugraprabha dipta nila ghana balaka bhatra
    mudra'mita caiva pancadashakonagah | brahmi narayani maheshvari kaumari | aparajita varahi narasimhika
    cetyashtapatragah | podashamvarabhedena prathamena manvavibhagah | tanmulenavahanam tenaiva pujanam
    | ya evam mantrarajam niyamena va lakshamavartayati sa papmanam hanti | sa brahmatvam bhajati | sah
    amritatvam bhajati | sa ayurarogyamaishvaryam bhajati | sada pancamakarena pujayet | sada gurubhakto
    bhavet | sada devabhakto bhavet | dharmishthatam pushtimahatavacam vipra labhante | mantrajapino hyatma
    vidyaprapurito bhavati | sa jivanmukto bhavati | sa sarvashastram janati | sa sarvapunyakari bhavati
    | sa sarvayajnayaji bhavati | rajano dasatam yanti | japtva sa sarvametam mantrarajam svayam shiva
    evahamityanimadivibhutinamishvarah kalikam labhet || avayoh patrabhutah san sukriti tyaktakalmashah
    | jivanmuktah sa vijneyo yasmai labdha hi dakshina || dashamsham homayettadanu tarpayet | atha haike
    yajnankamanadvaitajnanadinaniruddhasarasvatiti | atha haishah kalikamanujapi yah sada shuddhatma jnanavairagyayuktah
    shambhavidikshasu raktah shaktasu | yadi va brahmacari ratrau nagnah sarvada madhuna'shakto manasa
    japapujadiniyamavan | yoshitpriyakaro bhagodakena tarpanam tenaiva pujanam kuryat | sarvada kalikarupamatmanam
    vibhavayet | sa sarvada yoshidasakto bhavet | sa sarvahatya tarati tena madhudanena | atha shancamakarena
    sarvamayadividyam pashudhanadhanyam sarveshatvam ca kavitvam ca | nanyah paramah pantha vidyate mokshaya
    jnanaya dharmadharmaya | tatsarvam bhutam bhavyam yatkinciddrishyamanam sthavarajangamam tatsarvam
    kalikatantre otam protam veda | ya evam manujapi sa papmanam tarati | sa bhrunahatyam tarati | so'gamyagamanam
    tarati | sa sarvasukhamapnoti | sa sarvam janati | sa sarvasamnyasai bhavati | sa virakto bhavati
    | lsa sarvavedadhyayi bhavati | sa sarvamantrajapi bhavati | sa sarvashasravetta bhavati | sa sarvajnanakari
    bhavati | sa avayormitrabhuto bhavati | ityaha bhagavan shivah | nirvikalpena manasa sa vandyo bhavati
    || atha hainam | muladhare smareddivyam trikonam tejasam nidhim | shikha aniya tasyagneratha turdhvam
    vyavasthita || nalitoyadamadhyastha vidyullekheva bhasvara | nivarashukavattanvi pita bhasvatyanupama
    || tasyah shikhaya madhye paramatma vyavasthitah | sa brahma sa shivah sendrah soksharah paramah svarat
    || sa eva vishnuh sa pranah sa kalo'gnih sa candramah | iti kundalinim dhyatva sarvapapaih pramucyate
    || mahapatakebhyah puto bhutva sarvamantrasiddhim kritva bhairavo bhavet | mahakalabhairavo'sya rishih
    | anushtup chandah
  devanagari: ब्रह्मरन्ध्रे ब्रह्मरूपिणीमाप्नोति । सुभगां त्रिगुणितां मुक्तासुभगां कामरेफेन्दिरासमस्तरूपिणीमेतानि
    त्रिगुणितानि तदनु कूर्चबीजं व्योमषष्ठस्वरां विन्दुमेलनरूपां तद्द्वयं मायाद्वयं दक्षिणे कालिके चेत्यभिमुखगतां
    तदनु बाञ्जसप्तकमुच्चार्य बृहद्भानुजायामुच्चरेत् । स तु शिवमयो भवेत् । सर्वसिद्धिश्वरो भवेत् । गतिस्तस्यास्तीति
    । नान्यस्य गतिरस्ताति । स तु वागीश्वरः । स तु नारीश्वरः । स तु देवेश्वरः । स तु सर्वेश्वरः । अभिनवजलदसङ्काशा
    घनस्तनी भटिहवेदष्टा शवागना कालिका ध्येया । त्रिणेणं पञ्चकोणं नवकोणं पद्मम् । तस्मिन् देवी सर्वाङ्गेऽभ्यर्च्य
    तदिदं र्वाङ्गं काली कापालिनी कुल्ला कुरुकुल्ला विरोधिनी विप्रचित्ता उग्रा उग्रप्रभा दीप्ता नीला घना
    बलाका भात्रा मुद्राऽमिता चैव पञ्चदशकोणगाः । ब्राह्मी नारायणी माहेश्वरी कौमारी । अपराजिता वाराही नारसिंहिका
    चेत्यष्टपत्रगाः । पोडशम्वरभेदेन प्रथमेन मन्वविभागः । तन्मूलेनावाहनं तेनैव पूजनम् । य एवं मन्त्रराजं
    नियमेन वा लक्षमावर्तयति स पाप्मानं हन्ति । स ब्रह्मत्वं भजति । सः अमृतत्वं भजति । स आयुरारोग्यमैश्वर्यं
    भजति । सदा पञ्चमकारेण पूजयेत् । सदा गुरुभक्तो भवेत् । सदा देवभक्तो भवेत् । धर्मिष्ठतां पुष्टिमहतवाचं
    विप्रा लभन्ते । मन्त्रजापिनो ह्यात्मा विद्याप्रपूरितो भवति । स जीवन्मुक्तो भवति । स सर्वशास्त्रं जानाति
    । स सर्वपुण्यकारी भवति । स सर्वयज्ञयाजी भवति । राजानो दासतां यान्ति । जप्त्वा स सर्वमेतं मन्त्रराजं
    स्वयं शिव एवाहमित्यणिमादिविभूतीनामीश्वरः कालिकां लभेत् ॥ आवयोः पात्रभूतः सन् सुकृती त्यक्तकल्मषः ।
    जीवन्मुक्तः स विज्ञेयो यस्मै लब्धा हि दक्षिणा ॥ दशांशं होमयेत्तदनु तर्पयेत् । अथ हैके यज्ञान्कामानद्वैतज्ञानादीननिरुद्धसरस्वतीति
    । अथ हैषः कालिकामनुजापी यः सदा शुद्धात्मा ज्ञानवैराग्ययुक्तः शाम्भवीदीक्षासु रक्तः शाक्तासु । यदि
    वा ब्रह्मचारी रात्रौ नग्नः सर्वदा मधुनाऽशक्तो मनसा जपपूजादिनियमवान् । योषित्प्रियकरो भगोदकेन तर्पणं
    तेनैव पूजनं कुर्यात् । सर्वदा कालिकारूपमात्मानं विभावयेत् । स सर्वदा योषिदासक्तो भवेत् । स सर्वहत्या
    तरति तेन मधुदानेन । अथ षञ्चमकारेण सर्वमायादिविद्यां पशुधनधान्यं सर्वेशत्वं च कवित्वं च । नान्यः परमः
    पन्था विद्यते मोक्षाय ज्ञानाय धर्माधर्माय । तत्सर्वं भूतं भव्यं यत्किञ्चिद्दृश्यमानं स्थावरजङ्गमं
    तत्सर्वं कालिकातन्त्रे ओतं प्रोतं वेद । य एवं मनुजापी स पाप्मानं तरति । स भ्रूणहत्यां तरति । सोऽगम्यागमनं
    तरति । स सर्वसुखमाप्नोति । स सर्वं जानाति । स सर्वसंन्यासई भवति । स विरक्तो भवति । ल्स सर्ववेदाध्यायी
    भवति । स सर्वमन्त्रजापी भवति । स सर्वशास्रवेत्ता भवति । स सर्वज्ञानकारी भवति । स आवयोर्मित्रभूतो भवति
    । इत्याह भगवान् शिवः । निर्विकल्पेन मनसा स वन्द्यो भवति ॥ अथ हैनाम् । मूलाधारे स्मरेद्दिव्यं त्रिकोणं
    तेजसां निधिम् । शिखा आनीय तस्याग्नेरथ तूर्ध्वं व्यवस्थिता ॥ नलितोयदमध्यस्था विद्युल्लेखेव भास्वरा
    । नीवारशूकवत्तन्वी पीता भास्वत्यणूपमा ॥ तस्याः शिखाया मध्ये परमात्मा व्यवस्थितः । स ब्रह्मा स शिवः
    सेन्द्रः सोक्षरः परमः स्वराट् ॥ स एव विष्णुः स प्राणः स कालोऽग्निः स चन्द्रमाः । इति कुण्डलिनीं ध्यात्वा
    सर्वपापैः प्रमुच्यते ॥ महापातकेभ्यः पूतो भूत्वा सर्वमन्त्रसिद्धिं कृत्वा भैरवो भवेत् । महाकालभैरवोऽस्य
    ऋषिः । अनुष्टुप् छन्दः
