id: ekashloki
category: stotram
name:
  english: ekashloki
  devanagari: एकश्लोकि
content:
  english: ekashloki kim jyotistavabhanumanahani me ratrau pradipadikam syadevam ravidipadarshanavidhau
    kim jyotirakhyahi me | cakshustasya nimilanadisamaye kim dhirdhiyo darshane kim tatrahamato bhavanparamakam
    jyotistadasmi prabho || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau ekashloki sampurna ||
  devanagari: एकश्लोकी किं ज्योतिस्तवभानुमानहनि मे रात्रौ प्रदीपादिकं स्यादेवं रविदीपदर्शनविधौ किं ज्योतिराख्याहि
    मे । चक्षुस्तस्य निमीलनादिसमये किं धीर्धियो दर्शने किं तत्राहमतो भवान्परमकं ज्योतिस्तदस्मि प्रभो ॥
    इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ एकश्लोकी
    सम्पूर्णा ॥
meaning: {}
