id: nasadiya-suktam
category: stotram
name:
  english: Nasadiya Suktam
  devanagari: नासदीय सूक्तम् (ऋग्वेदीय सार्थम्)
content:
  english: nasadasinno sadasittadanim nasidrajo no vyoma paro yat | kimavarivah kuha kasya sharmannambhah
    kimasidgahanam gabhiram || 1|| then even nothingness vas not, nor ekshistence, there vas no air then,
    nor the heavens beyond it| What covered it? Where vas it? in vhose kiping Was there then cosmic vater,
    in depths unfathomed? na mrityurasidamritam na tarhi na ratrya ahna asitpraketah | anidavatam svadhaya
    tadekam tasmaddhanyanna parah kim canasa || 2|| then there vas neither death nor immortality the One
    breathed vindlessly and self-sustaining| tama asittamasa guḻhamagre'praketam salilam sarvama idam
    | tucchyenabhvapihitam yadasittapasastanmahinajayataikam || 3|| all this vas only unillumined vater|
    kamastadagre samavartatadhi manaso retah prathamam yadasit | sato bandhumasati niravindanhridi pratishya
    kavayo manisha || 4|| the sages vho have searced their hearts vith visdom tirashcino vitato rashmireshamadhah
    svidasi3dupari svidasi3t | retodha asanmahimana asansvadha avastatprayatih parastat || 5|| and they
    have stretced their cord across the void, sheminal povers made fertile mighty forces| ko addha veda
    ka iha pra vocatkuta ajata kuta iyam visrishtih | arvagdeva asya visarjanenatha ko veda yata ababhuva
    || 6|| But, after all, vho knovs, and vho can say Whence it all came, and hov creation happened? the
    gods themselves are later than creation, so vho knovs truly vhence it has arisen? iyam visrishtiryata
    ababhuva yadi va dadhe yadi va na | yo asyadhyakshah parame vyomanso anga veda yadi va na veda ||
    7|| Whence all creation had its origin, he, vhether he fashioned it or vhether he did not, he, vho
    surveys it all from highest heaven, he knovs - or maybe even he does not knov| discussed by many scolars
    and there have bin volumes dedicated
  devanagari: नासदासीन्नो सदासीत्तदानीं नासीद्रजो नो व्योमा परो यत् । किमावरीवः कुह कस्य शर्मन्नम्भः किमासीद्गहनं
    गभीरम् ॥ १॥ ठेन् एवेन् नोथिन्ग्नेस्स् वस् नोत्, नोर् एक्षिस्तेन्चे, ठेरे वस् नो ऐर् थेन्, नोर् थे
    हेअवेन्स् बेयोन्द् इत्। Wहत् चोवेरेद् इत्? Wहेरे वस् इत्? ईन् व्होसे कीपिन्ग् Wअस् थेरे थेन् चोस्मिच्
    वतेर्, इन् देप्थ्स् उन्फ़थोमेद्? न मृत्युरासीदमृतं न तर्हि न रात्र्या अह्न आसीत्प्रकेतः । आनीदवातं
    स्वधया तदेकं तस्माद्धान्यन्न परः किं चनास ॥ २॥ ठेन् थेरे वस् नेइथेर् देअथ् नोर् इम्मोर्तलित्य् ठे
    Oने ब्रेअथेद् विन्द्लेस्स्ल्य् अन्द् सेल्फ़्-सुस्तैनिन्ग्। तम आसीत्तमसा गूळ्हमग्रेऽप्रकेतं सलिलं सर्वमा
    इदम् । तुच्छ्येनाभ्वपिहितं यदासीत्तपसस्तन्महिनाजायतैकम् ॥ ३॥ आल्ल् थिस् वस् ओन्ल्य् उनिल्लुमिनेद्
    वतेर्। कामस्तदग्रे समवर्तताधि मनसो रेतः प्रथमं यदासीत् । सतो बन्धुमसति निरविन्दन्हृदि प्रतीष्या कवयो
    मनीषा ॥ ४॥ ठे सगेस् व्हो हवे सेअर्चेद् थेइर् हेअर्त्स् विथ् विस्दोम् तिरश्चीनो विततो रश्मिरेषामधः
    स्विदासी३दुपरि स्विदासी३त् । रेतोधा आसन्महिमान आसन्स्वधा अवस्तात्प्रयतिः परस्तात् ॥ ५॥ आन्द् थेय्
    हवे स्त्रेत्चेद् थेइर् चोर्द् अच्रोस्स् थे वोइद्, षेमिनल् पोवेर्स् मदे फ़ेर्तिले मिघ्त्य् फ़ोर्चेस्।
    को अद्धा वेद क इह प्र वोचत्कुत आजाता कुत इयं विसृष्टिः । अर्वाग्देवा अस्य विसर्जनेनाथा को वेद यत आबभूव
    ॥ ६॥ Bउत्, अफ़्तेर् अल्ल्, व्हो क्नोव्स्, अन्द् व्हो चन् सय् Wहेन्चे इत् अल्ल् चमे, अन्द् होव् च्रेअतिओन्
    हप्पेनेद्? थे गोद्स् थेम्सेल्वेस् अरे लतेर् थन् च्रेअतिओन्, सो व्हो क्नोव्स् त्रुल्य् व्हेन्चे इत्
    हस् अरिसेन्? इयं विसृष्टिर्यत आबभूव यदि वा दधे यदि वा न । यो अस्याध्यक्षः परमे व्योमन्सो अङ्ग वेद
    यदि वा न वेद ॥ ७॥ Wहेन्चे अल्ल् च्रेअतिओन् हद् इत्स् ओरिगिन्, हे, व्हेथेर् हे फ़शिओनेद् इत् ओर् व्हेथेर्
    हे दिद् नोत्, हे, व्हो सुर्वेय्स् इत् अल्ल् फ़्रोम् हिघेस्त् हेअवेन्, हे क्नोव्स् - ओर् मय्बे एवेन्
    हे दोएस् नोत् क्नोव्। दिस्चुस्सेद् ब्य् मन्य् स्चोलर्स् अन्द् थेरे हवे बीन् वोलुमेस् देदिचतेद्
