id: shivakritamparashaktistotram
category: stotram
name:
  english: shivakritamparashaktistotram
  devanagari: शिवकृतंपराशक्तिस्तोत्रम्
content:
  english: shribhagavanuvaca | namaste devadeveshi namaste bhaktivallabhe | sarvage sarvade devi namaste
    vishvadharini || 60|| namaste shaktirupena srishtipralayakarini | namaste prabhaya yukte vidyujjvalitakundale
    || 61|| tvam svaha tvam svadha devi tvam srishtistvam shucirdhritih | arundhati tathendrani tvam lakshmistvam
    ca parvati || 62|| yatkincitstrisvarupam ca samastam bhuvanatraye | tatsarvam tvatsvarupam syaditi
    shastreshu nishcayah || 63|| iti shriskandapurane nagarakhande ekonapancashattamadhikashatatamadhyayantargatam
    shivakritam parashaktistotram samaptam | skandapurana | nagarakhanda | adhyaya 149
  devanagari: श्रीभगवानुवाच । नमस्ते देवदेवेशि नमस्ते भक्तिवल्लभे । सर्वगे सर्वदे देवि नमस्ते विश्वधारिणि
    ॥ ६०॥ नमस्ते शक्तिरूपेण सृष्टिप्रलयकारिणि । नमस्ते प्रभया युक्ते विद्युज्ज्वलितकुण्डले ॥ ६१॥ त्वं
    स्वाहा त्वं स्वधा देवि त्वं सृष्टिस्त्वं शुचिर्धृतिः । अरुन्धती तथेन्द्राणी त्वं लक्ष्मीस्त्वं च पार्वती
    ॥ ६२॥ यत्किञ्चित्स्त्रीस्वरूपं च समस्तं भुवनत्रये । तत्सर्वं त्वत्स्वरूपं स्यादिति शास्त्रेषु निश्चयः
    ॥ ६३॥ इति श्रीस्कन्दपुराणे नागरखण्डे एकोनपञ्चाशत्तमाधिकशततमाध्यायान्तर्गतं शिवकृतं पराशक्तिस्तोत्रं
    समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय १४९
meaning: {}
