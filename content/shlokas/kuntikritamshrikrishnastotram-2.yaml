id: kuntikritamshrikrishnastotram-2
category: stotram
name:
  english: kuntikritamshrikrishnastotram
  devanagari: कुन्तीकृतंश्रीकृष्णस्तोत्रम्
content:
  english: kuntikritam shrikrishnastotram krishna krishna mahayogin vishvatman vishvabhavana | prapannam
    pahi govinda shishubhishcavasidatim || 11|| nanyattava padambhojatpashyami sharanam nrinam | bibhyatam
    mrityusamsaradishvarasyapavargikat || 12|| namah krishnaya shuddhaya brahmane paramatmane | yogeshvaraya
    yogaya tvamaham sharanam gata || 13|| iti shrimadbhagavatamahapurane dashamaskandhe purvardhe ekonapancashattamadhyayantargatam
    kuntikritam shrikrishnastotram samaptam | bhagavatapurana | adhyaya 10
  devanagari: कुन्तीकृतं श्रीकृष्णस्तोत्रम् कृष्ण कृष्ण महायोगिन् विश्वात्मन् विश्वभावन । प्रपन्नां पाहि
    गोविन्द शिशुभिश्चावसीदतीम् ॥ ११॥ नान्यत्तव पदाम्भोजात्पश्यामि शरणं नृणाम् । बिभ्यतां मृत्युसंसारादीश्वरस्यापवर्गिकात्
    ॥ १२॥ नमः कृष्णाय शुद्धाय ब्रह्मणे परमात्मने । योगेश्वराय योगाय त्वामहं शरणं गता ॥ १३॥ इति श्रीमद्भागवतमहापुराणे
    दशमस्कन्धे पूर्वार्धे एकोनपञ्चाशत्तमाध्यायान्तर्गतं कुन्तीकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण
    । अध्याय १०
meaning: {}
