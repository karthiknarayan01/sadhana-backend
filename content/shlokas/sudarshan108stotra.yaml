id: sudarshan108stotra
category: stotram
name:
  english: sudarshan108stotra
  devanagari: सुदर्शन्१०८स्तोत्र
content:
  english: prabhamayah || 12|| sadasatparamah purno vanmayo varado'cyutah | jivo gururhamsarupah pancashatpitharupakah
    || 13|| matrikamandaladhyaksho madhudhvamsi manomayah | buddhirupashcittasakshi saro hamsaksharadvayah
    || 14|| mantra
  devanagari: प्रभामयः ॥ १२॥ सदसत्परमः पूर्णो वाङ्मयो वरदोऽच्युतः । जीवो गुरुर्हंसरूपः पञ्चाशत्पीठरूपकः
    ॥ १३॥ मातृकामण्डलाध्यक्षो मधुध्वंसी मनोमयः । बुद्धिरूपश्चित्तसाक्षी सारो हंसाक्षरद्वयः ॥ १४॥ मन्त्र
meaning: {}
