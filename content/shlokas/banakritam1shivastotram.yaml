id: banakritam1shivastotram
category: stotram
name:
  english: banakritam1shivastotram
  devanagari: बाणकृतं१शिवस्तोत्रम्
content:
  english: banakritam 1 shivastotram bana uvaca | devadeva mahadeva sharanagatavatsala | tvam namami maheshana
    dinabandho dayanidhe || 21|| krita mayi kripativa kripasagara shankara | garvo'paharitassarvah prasannena
    mama prabho || 22|| tvam brahma paramatma hi sarvavyapyakhileshvarah | brahmandatanurugresho virat
    sarvanvitah parah || 23|| nabhirnabho'gnirvadanamambu reto dishah shrutih | dyaushshirshamanghrirurvi
    te manashcandrastava prabho || 24|| drigarko jatharam varddhirbhujendro dhishana vidhih | prajapatirvisargashca
    dharmo hi hridayam tava || 25|| romanyaushadhayo natha kesha jalamucastava | gunastrayastrinetrani
    sarvatma purusho bhavan || 26|| brahmanam te mukham prahurbahum kshatriyameva ca | urujam vaishyamahuste
    padajam shudrameva ca || 27|| tvameva sarvadopasyassarvairjivairmaheshvara | tvam bhajanparamam muktim
    labhate purusho dhruvam || 28|| yastvam visrijate martya atmanam priyamishvaram | viparyayendriyarthartham
    vishamattyamritam tyajan || 29|| vishnurbrahma'tha vibudha munayashcamalashayah | sarvatmana prapannastvam
    shankaram priyamishvaram || 30|| iti shivapurane rudrasamhitayam yuddhakhande shatpancashattamadhyayantargatam
    banakritam shivastotram samaptam | shivapurana | rudrasamhita | yuddhakhanda 5 | adhyaya 56
  devanagari: बाणकृतं १ शिवस्तोत्रम् बाण उवाच । देवदेव महादेव शरणागतवत्सल । त्वां नमामि महेशान दीनबन्धो
    दयानिधे ॥ २१॥ कृता मयि कृपातीव कृपासागर शङ्कर । गर्वोऽपहारितस्सर्वः प्रसन्नेन मम प्रभो ॥ २२॥ त्वं
    ब्रह्म परमात्मा हि सर्वव्याप्यखिलेश्वरः । ब्रह्माण्डतनुरुग्रेशो विराट् सर्वान्वितः परः ॥ २३॥ नाभिर्नभोऽग्निर्वदनमम्बु
    रेतो दिशः श्रुतिः । द्यौश्शीर्षमङ्घ्रिरुर्वी ते मनश्चन्द्रस्तव प्रभो ॥ २४॥ दृगर्को जठरं वार्द्धिर्भुजेन्द्रो
    धिषणा विधिः । प्रजापतिर्विसर्गश्च धर्मो हि हृदयं तव ॥ २५॥ रोमाण्यौषधयो नाथ केशा जलमुचस्तव । गुणास्त्रयस्त्रिनेत्राणि
    सर्वात्मा पुरुषो भवान् ॥ २६॥ ब्राह्मणं ते मुखं प्राहुर्बाहुं क्षत्रियमेव च । ऊरुजं वैश्यमाहुस्ते पादजं
    शूद्रमेव च ॥ २७॥ त्वमेव सर्वदोपास्यस्सर्वैर्जीवैर्महेश्वर । त्वां भजन्परमां मुक्तिं लभते पुरुषो ध्रुवम्
    ॥ २८॥ यस्त्वां विसृजते मर्त्य आत्मानं प्रियमीश्वरम् । विपर्ययेन्द्रियार्थार्थं विषमत्त्यमृतं त्यजन्
    ॥ २९॥ विष्णुर्ब्रह्माऽथ विबुधा मुनयश्चामलाशयाः । सर्वात्मना प्रपन्नास्त्वां शङ्करं प्रियमीश्वरम् ॥
    ३०॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे षट्पञ्चाशत्तमाध्यायान्तर्गतं बाणकृतं शिवस्तोत्रं समाप्तम्
    । शिवपुराण । रुद्रसंहिता । युद्धखण्ड ५ । अध्याय ५६
