id: kalapurushakritamshrikrishnastotram
category: stotram
name:
  english: kalapurushakritamshrikrishnastotram
  devanagari: कालपुरुषकृतंश्रीकृष्णस्तोत्रम्
content:
  english: kalapurushakritam shrikrishnastotram kalapurusha uvaca | ko va'ham ko yamah ka ca mrityukanya
    ca vyadhayah | vayam bhramamah satatamishajnaparipalakah || 43|| yasya srishta ca prakritirbrahmavishnushivadayah
    | sura munindra manavo manavah sarvajantavah || 44|| dhyayante tatpadambhojam yoginashca vicakshanah
    | japanti shashvannamani punyani paramatmanah || 45|| yadbhayadvati vato'yam suryastapati yadbhayat
    | srashta brahma''jnaya yasya pata vishnuryadajnaya || 46|| samhartta shankarah sarvajagatam yasya
    shasanat | dharmashca karmanam sakshi yasyajnaparipalakah || 47|| rashicakram grahah sarve bhramanti
    yasya shasanat | digishashcaiva dikpala yasyajnaparipalakah || 48|| yasyajnaya ca taravah pushpani
    ca phalani ca | bibhratyeva dadatyeva kale malavatisati || 49|| yasyajnaya jaladhara sarvadhara vasundhara
    | kshamavati prithivi kampita na bhayena ca || 50|| sahasa mohita maya mayaya yasya santatam | sarvaprasurya
    prakritih sa bhita yadbhayadaho || 51|| yasyantam na vidurveda vastunam bhavaga api | puranani ca
    sarvani yasyaiva stutipathakah || 52|| yasya nama vidhirvishnuh sevate sumahanvirat | shodashamsho
    bhagavatah sa eva tejaso vibhoh || 53|| sarveshvarah kalakalo mrityormrityuh paratparah | sarvavighnavinashaya
    tam krishnam paricintaya || 54|| sarvabhishtam ca bharttaram pradasyati kripanidhih | ime yatpreritah
    sarve sa data sarvasampadam || 55|| iti brahmavaivartapaharane brahmakhande pancadashadhyayantargatam
    kalapurushakritam shrikrishnastotram samaptam | brahmavaivartapurana | brahmakhanda | adhyaya 15
  devanagari: कालपुरुषकृतं श्रीकृष्णस्तोत्रम् कालपुरुष उवाच । को वाऽहं को यमः का च मृत्युकन्या च व्याधयः
    । वयं भ्रमामः सततमीशाज्ञापरिपालकाः ॥ ४३॥ यस्य सृष्टा च प्रकृतिर्ब्रह्मविष्णुशिवादयः । सुरा मुनीन्द्रा
    मनवो मानवाः सर्वजन्तवः ॥ ४४॥ ध्यायन्ते तत्पदाम्भोजं योगिनश्च विचक्षणाः । जपन्ति शश्वन्नामानि पुण्यानि
    परमात्मनः ॥ ४५॥ यद्भयाद्वाति वातोऽयं सूर्यस्तपति यद्भयात् । स्रष्टा ब्रह्माऽऽज्ञया यस्य पाता विष्णुर्यदाज्ञया
    ॥ ४६॥ संहर्त्ता शङ्करः सर्वजगतां यस्य शासनात् । धर्मश्च कर्मणां साक्षी यस्याज्ञापरिपालकः ॥ ४७॥ राशिचक्रं
    ग्रहाः सर्वे भ्रमन्ति यस्य शासनात् । दिगीशाश्चैव दिक्पाला यस्याज्ञापरिपालकाः ॥ ४८॥ यस्याज्ञया च तरवः
    पुष्पाणि च फलानि च । बिभ्रत्येव ददत्येव काले मालावतीसति ॥ ४९॥ यस्याज्ञया जलाधारा सर्वाधारा वसुन्धरा
    । क्षमावती पृथिवी कम्पिता न भयेन च ॥ ५०॥ सहसा मोहिता माया मायया यस्य सन्ततम् । सर्वप्रसूर्या प्रकृतिः
    सा भीता यद्भयादहो ॥ ५१॥ यस्यान्तं न विदुर्वेदा वस्तूनां भावगा अपि । पुराणानि च सर्वाणि यस्यैव स्तुतिपाठकाः
    ॥ ५२॥ यस्य नाम विधिर्विष्णुः सेवते सुमहान्विराट् । षोडशांशो भगवतः स एव तेजसो विभोः ॥ ५३॥ सर्वेश्वरः
    कालकालो मृत्योर्मृत्युः परात्परः । सर्वविघ्नविनाशाय तं कृष्णं परिचिन्तय ॥ ५४॥ सर्वाभीष्टं च भर्त्तारं
    प्रदास्यति कृपानिधिः । इमे यत्प्रेरिताः सर्वे स दाता सर्वसम्पदाम् ॥ ५५॥ इति ब्रह्मवैवर्तपहराणे ब्रह्मखण्डे
    पञ्चदशाध्यायान्तर्गतं कालपुरुषकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । ब्रह्मखण्ड । अध्याय
    १५
