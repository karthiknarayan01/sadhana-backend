id: mukundamala
category: stotram
name:
  english: mukundamala
  devanagari: मुकुन्दमाला
content:
  english: 1 shloka samkhya 40 shrivallabheti varadeti dayapareti bhaktapriyeti bhavalunthanakovideti
    | natheti nagashayaneti jagannivasety alapinam pratidinam kuru mam mukunda || 1|| jayatu jayatu devo
    devakinandano'yam jayatu jayatu krishno vrishnivamshapradipah | jayatu jayatu meghashyamalah komalango
    jayatu jayatu prithvibharanasho mukundah || 2|||| ka 2|| mukunda murdhna pranipatya yace bhavantamekantamiyantamartham
    | avismritistvaccaranaravinde bhave bhave me'stu bhavatprasadat || 3|||| ka 3|| naham vande tava caranayordvandvamadvandvahetoh
    kumbhipakam gurumapi hare narakam napanetum | ramyaramamridutanulata nandane napi rantum bhave bhave
    hridayabhavane bhavayeyam bhavantam || 4|||| ka 5|| nastha dharme na vasunicaye naiva kamopabhoge
    yad bhavyam tad bhavatu bhagavanpurvakarmanurupam | etatprarthyam mama bahumatam janmajanmantare'pi
    tvatpadambhoruhayugagata nishcala bhaktirastu || 5|||| ka 6|| divi va bhuvi va mamastu vaso narake
    va narakantaka prakamam | avadhiritasharadaravindau caranau te marane'pi cintayami || 6|||| ka 7||
    krishna tvadiyapadapankajapanjarantam adyaiva me vishatu manasarajahamsah | pranaprayanasamaye kaphavatapittaih
    kanthavarodhanavidhau smaranam kutaste || 7|| cintayami harimeva santatam mandahasamuditananambujam
    nandagopatanayam parat param naradadimunivrindavanditam || 8|| karacaranasaroje kantimannetramine
    shramamushi bhujavicivyakule'gadhamarge | harisarasi vigahyapiya tejojalaugham bhavamaruparikhinnah
    kleshamadya tyajami || 9|| sarasijanayane sashankhacakre murabhidi ma viramasva citta rantum |
  devanagari: १ श्लोक संख्या ४० श्रीवल्लभेति वरदेति दयापरेति भक्तप्रियेति भवलुण्ठनकोविदेति । नाथेति नागशयनेति
    जगन्निवासेत्य् आलापिनं प्रतिदिनं कुरु मां मुकुन्द ॥ १॥ जयतु जयतु देवो देवकीनन्दनोऽयं जयतु जयतु कृष्णो
    वृष्णिवंशप्रदीपः । जयतु जयतु मेघश्यामलः कोमलाङ्गो जयतु जयतु पृथ्वीभारनाशो मुकुन्दः ॥ २॥॥ का २॥ मुकुन्द
    मूर्ध्ना प्रणिपत्य याचे भवन्तमेकान्तमियन्तमर्थम् । अविस्मृतिस्त्वच्चरणारविन्दे भवे भवे मेऽस्तु भवत्प्रसादात्
    ॥ ३॥॥ का ३॥ नाहं वन्दे तव चरणयोर्द्वन्द्वमद्वन्द्वहेतोः कुम्भीपाकं गुरुमपि हरे नारकं नापनेतुम् । रम्यारामामृदुतनुलता
    नन्दने नापि रन्तुं भावे भावे हृदयभवने भावयेयं भवन्तम् ॥ ४॥॥ का ५॥ नास्था धर्मे न वसुनिचये नैव कामोपभोगे
    यद् भाव्यं तद् भवतु भगवन्पूर्वकर्मानुरूपम् । एतत्प्रार्थ्यं मम बहुमतं जन्मजन्मान्तरेऽपि त्वत्पादाम्भोरुहयुगगता
    निश्चला भक्तिरस्तु ॥ ५॥॥ का ६॥ दिवि वा भुवि वा ममास्तु वासो नरके वा नरकान्तक प्रकामम् । अवधीरितशारदारविन्दौ
    चरणौ ते मरणेऽपि चिन्तयामि ॥ ६॥॥ का ७॥ कृष्ण त्वदीयपदपङ्कजपञ्जरान्तं अद्यैव मे विशतु मानसराजहंसः ।
    प्राणप्रयाणसमये कफवातपित्तैः कण्ठावरोधनविधौ स्मरणं कुतस्ते ॥ ७॥ चिन्तयामि हरिमेव सन्ततं मन्दहासमुदिताननाम्बुजं
    नन्दगोपतनयं परात् परं नारदादिमुनिवृन्दवन्दितम् ॥ ८॥ करचरणसरोजे कान्तिमन्नेत्रमीने श्रममुषि भुजवीचिव्याकुलेऽगाधमार्गे
    । हरिसरसि विगाह्यापीय तेजोजलौघं भवमरुपरिखिन्नः क्लेशमद्य त्यजामि ॥ ९॥ सरसिजनयने सशङ्खचक्रे मुरभिदि
    मा विरमस्व चित्त रन्तुम् ।
