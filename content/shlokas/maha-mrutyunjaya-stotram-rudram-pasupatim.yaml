id: maha-mrutyunjaya-stotram-rudram-pasupatim
category: stotram
name:
  english: Maha Mrutyunjaya Stotram (Rudram Pasupatim)
content:
  english: shriganeshaya namah | om asya shrimahamrityunjayastotramantrasya shri markandeya rishih shrimrityunjayo
    devata mama sarvarishtasamastamrityushantyartham sakalaishvaryapraptyartham jape vinoyogah | dhyanam
    candrarkagnivilocanam smitamukham padmadvayantasthitam mudrapashamrigakshasatravilasatpanim himamshuprabham
    | kotindupragalatsudhaplutatamum haradibhushojjvalam kantam vishvavimohanam pashupatim mrityunjayam
    bhavayet || rudram pashupatim sthanum nilakanthamumapatim | namami shirasa devam kim no mrityuh karishyati
    || || nilakantham kalamurttim kalajnam kalanashanam | namami shirasa devam kim no mrityuh karishyati
    || || nilakantham virupaksham nirmalam nilayapradam | namami shirasa devam kim no mrityuh karishyati
    || || vamadevam mahadevam lokanatham jagadgurum | namami shirasa devam kim no mrityuh karishyati ||
    || devadevam jagannatham devesham vrishabhadhvajam | namami shirasa devam kim no mrityuh karishyati
    || || tryaksham caturbhujam shantam jatamakutadharinam | namami shirasa devam kim no mrityuh karishyati
    || || bhasmoddhulitasarvangam nagabharanabhushitam | namami shirasa devam kim no mrityuh karishyati
    || || anantamavyayam shantam akshamaladharam haram | namami shirasa devam kim no mrityuh karishyati
    || || anandam paramam nityam kaivalyapadadayinam | namami shirasa devam kim no mrityuh karishyati
    || || arddhanarishvaram devam parvatiprananayakam | namami shirasa devam kim no mrityuh karishyati
    || || pralayasthitikarttaramadikarttaramishvaram | namami shirasa devam kim no mrityuh karishyati
    || || vyomakesham virupaksham candrarddhakritashekharam | namami shirasa devam kim no mrityuh karishyati
    || || gangadharam shashidharam shankaram shulapaninam | gangadharam mahadevam sarvabharanabhushitam
    | namami shirasa devam kim no mrityuh karishyati || || anathah paramanantam kaivalyapadagamini | namami
    shirasa devam kim no mrityuh karishyati || || svargapavargadataram srishtisthityantakaranam | namami
    shirasa devam kim no mrityuh karishyati || || kalpayurddehi me punyam yavadayurarogatam | namami shirasa
    devam kim no mrityuh karishyati || || shiveshanam mahadevam vamadevam sadashivam | namami shirasa
    devam kim no mrityuh karishyati || || utpattisthitisamharakartaramishvaram gurum | namami shirasa
    devam kim no mrityuh karishyati || || phalashruti markandeyakritam stotram yah pathecchivasannidhau
    | tasya mrityubhayam nasti nagnicaurabhayam kvacit || || shatavarttam prakartavyam sankate kashtanashanam
    | shucirbhutva pathetstotram sarvasiddhipradayakam || || mrityunjaya mahadeva trahi mam sharanagatam
    | janmamrityujararogaih piditam karmabandhanaih || || tavakastvadgatah pranastvaccitto'ham sada mrida
    | iti vijnapya devesham tryambakakhyamanum japet || || namah shivaya sambaya haraye paramatmane |
    pranatakleshanashaya yoginam pataye namah || || shatangayurmantrah | om hrim shrim hrim hraim hrah
    hana hana daha daha paca paca grihana grihana maraya maraya mardaya mardaya mahamahabhairava bhairavarupena
    dhunaya dhunaya kampaya kampaya vighnaya vighnaya vishveshvara kshobhaya kshobhaya katukatu mohaya
    mohaya hum phat svaha iti mantramatrena samabhishto bhavati || || iti shrimarkandeyapurane markandeyakrita
    mahamrityunjayastotram sampurnam ||
  devanagari: श्रीगणेशाय नमः । ॐ अस्य श्रीमहामृत्युञ्जयस्तोत्रमन्त्रस्य श्री मार्कण्डेय ऋषिः श्रीमृत्युञ्जयो
    देवता मम सर्वारिष्टसमस्तमृत्युशान्त्यर्थं सकलैश्वर्यप्राप्त्यर्थं जपे विनोयोगः । ध्यानम् चन्द्रार्काग्निविलोचनं
    स्मितमुखं पद्मद्वयान्तस्थितं मुद्रापाशमृगाक्षसत्रविलसत्पाणिं हिमांशुप्रभम् । कोटीन्दुप्रगलत्सुधाप्लुततमुं
    हारादिभूषोज्ज्वलं कान्तं विश्वविमोहनं पशुपतिं मृत्युञ्जयं भावयेत् ॥ रुद्रं पशुपतिं स्थाणुं नीलकण्ठमुमापतिम्
    । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ नीलकण्ठं कालमूर्त्तिं कालज्ञं कालनाशनम् । नमामि शिरसा
    देवं किं नो मृत्युः करिष्यति ॥ ॥ नीलकण्ठं विरूपाक्षं निर्मलं निलयप्रदम् । नमामि शिरसा देवं किं नो
    मृत्युः करिष्यति ॥ ॥ वामदेवं महादेवं लोकनाथं जगद्गुरुम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति
    ॥ ॥ देवदेवं जगन्नाथं देवेशं वृषभध्वजम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ त्र्यक्षं चतुर्भुजं
    शान्तं जटामकुटधारिणम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ भस्मोद्धूलितसर्वाङ्गं नागाभरणभूषितम्
    । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ अनन्तमव्ययं शान्तं अक्षमालाधरं हरम् । नमामि शिरसा देवं
    किं नो मृत्युः करिष्यति ॥ ॥ आनन्दं परमं नित्यं कैवल्यपददायिनम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति
    ॥ ॥ अर्द्धनारीश्वरं देवं पार्वतीप्राणनायकम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ प्रलयस्थितिकर्त्तारमादिकर्त्तारमीश्वरम्
    । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ व्योमकेशं विरूपाक्षं चन्द्रार्द्धकृतशेखरम् । नमामि
    शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ गङ्गाधरं शशिधरं शङ्करं शूलपाणिनम् । गङ्गाधरं महादेवं सर्वाभरणभूषितम्
    । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ अनाथः परमानन्तं कैवल्यपदगामिनि । नमामि शिरसा देवं किं
    नो मृत्युः करिष्यति ॥ ॥ स्वर्गापवर्गदातारं सृष्टिस्थित्यन्तकारणम् । नमामि शिरसा देवं किं नो मृत्युः
    करिष्यति ॥ ॥ कल्पायुर्द्देहि मे पुण्यं यावदायुररोगताम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति
    ॥ ॥ शिवेशानां महादेवं वामदेवं सदाशिवम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ उत्पत्तिस्थितिसंहारकर्तारमीश्वरं
    गुरुम् । नमामि शिरसा देवं किं नो मृत्युः करिष्यति ॥ ॥ फलश्रुति मार्कण्डेयकृतं स्तोत्रं यः पठेच्छिवसन्निधौ
    । तस्य मृत्युभयं नास्ति नाग्निचौरभयं क्वचित् ॥ ॥ शतावर्त्तं प्रकर्तव्यं सङ्कटे कष्टनाशनम् । शुचिर्भूत्वा
    पथेत्स्तोत्रं सर्वसिद्धिप्रदायकम् ॥ ॥ मृत्युञ्जय महादेव त्राहि मां शरणागतम् । जन्ममृत्युजरारोगैः पीडितं
    कर्मबन्धनैः ॥ ॥ तावकस्त्वद्गतः प्राणस्त्वच्चित्तोऽहं सदा मृड । इति विज्ञाप्य देवेशं त्र्यम्बकाख्यमनुं
    जपेत् ॥ ॥ नमः शिवाय साम्बाय हरये परमात्मने । प्रणतक्लेशनाशाय योगिनां पतये नमः ॥ ॥ शताङ्गायुर्मन्त्रः
    । ॐ ह्रीं श्रीं ह्रीं ह्रैं ह्रः हन हन दह दह पच पच गृहाण गृहाण मारय मारय मर्दय मर्दय महामहाभैरव भैरवरूपेण
    धुनय धुनय कम्पय कम्पय विघ्नय विघ्नय विश्वेश्वर क्षोभय क्षोभय कटुकटु मोहय मोहय हुं फट् स्वाहा इति मन्त्रमात्रेण
    समाभीष्टो भवति ॥ ॥ इति श्रीमार्कण्डेयपुराणे मार्कण्डेयकृत महामृत्युञ्जयस्तोत्रं सम्पूर्णम् ॥
