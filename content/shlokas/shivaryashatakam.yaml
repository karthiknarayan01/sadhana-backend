id: shivaryashatakam
category: shataka
name:
  english: shivaryashatakam
  devanagari: शिवार्याशतकम्
content:
  english: tvam matkrite sthanuh || 34|| santatamadrinivasatkathoranamnavanau nitah | api kakolaharatvatkarunakripara
    evasi || 35|| dagdhe dividvrinde paritah plushte'pi govinde | brahmandamandape'sminkshubdhe 6vedasha
    eva tvam || 36|| payasa plavitasatye klipta vaikuntha akante | smaritavishtapavritta dharta tvam sveva
    gangayah || 37|| vrindayamapi vishnum tadvatparameshthinam ca kanyayam | yunktvapyato jigishuh smartavyatma
    smarastvattah || 38|| garvadakharvakarta tvahamiti bhavadrito bodhah | tvamapi savidhe vimanamshchinnah
    kapalabhushayai || 39|| kecidvadanti guninam nirgunameke'pi vidvamsah | nirnetumeva dhatse trigunim
    mundavalim nityah || 40|| nityanityaviveke nityastvatto'sti naivanyah | nikhilam tvameva dagdha dhatse
    bhasmangaragaya || 41|| bhasmasuro'pi kashciddhasmarashaktih pura bhaktah | vismritashaivacapetah
    kapati bhasmaiva sanjatah || 42|| khyatastvameva devastvameva nikhile mahadevah | rudradanyabhave
    sa nasmi vishnurna va dhata || 43|| dhatustvameva dhata pata vishnoshca vishnutvata | api ca harasya
    harastvam natastratah para kashta || 44|| kashthavaso vaso yasya trailokyadhrilishu | yuktam nikhile
    dagdhe sheshavasashca vasaya || 45|| vaso yasya hridabje bhasah sarveshu bhuteshu | hasah kalo nrityaddasastasyahamekasya
    || 46|| ekasya dve niyamatkashcidvaipashcito'ssvarthah | jane'ham tu yadange girijagange tamevaikam
    || 47|| eko rudrah prathama sarvo rudrah para brite | paramrigyajushoktinam siddhah siddhanta evaikah
    || 48|| eko'ham tu bahu syamanaya vacaiva sa siddhih | tasmatsiddhinidanam rudram janantu bhadraya
    || 49|| bhadraya rajamudra vedo brute shivah shivadah | natah pumarthasiddhih kacitkashcinna siddhantah
    || 50|| siddhantadaraduram duratvannama piyushat | piyushamshukaladharadhara mam canathanathatvat
    || 51|| natha
  devanagari: त्वं मत्कृते स्थाणुः ॥ ३४॥ सन्ततमाद्रिनिवासात्कठोरनाम्नावनौ नीतः । अपि काकोलहरत्वात्करुणाकृपार
    एवासि ॥ ३५॥ दग्धे दिविद्वृन्दे परितः प्लुष्टेऽपि गोविन्दे । ब्रह्माण्डमण्डपेऽस्मिन्क्षुब्धे ६वेडाश
    एव त्वम् ॥ ३६॥ पयसा प्लावितसत्ये कॢप्त वैकुण्ठ आकण्टे । स्मारितविष्टपवृत्त धर्ता त्वं स्वेव गङ्गायाः
    ॥ ३७॥ वृन्दायामपि विष्णुं तद्वत्परमेष्ठिनं च कन्यायां । युङ्क्त्वाप्यतो जिगीषुः स्मर्तव्यात्मा स्मरस्त्वत्तः
    ॥ ३८॥ गर्वादखर्वकर्ता त्वहमिति भावादृतो बोधः । त्वामपि सविधे विमनंश्छिन्नः कापालभूषायै ॥ ३९॥ केचिद्वदन्ति
    गुणिनं निर्गुणमेकेऽपि विद्वांसः । निर्णेतुमेव धत्से त्रिगुणीं मुण्डावलिं नित्यः ॥ ४०॥ नित्यानित्यविवेके
    नित्यस्त्वत्तोऽस्ति नैवान्यः । निखिलं त्वमेव दग्धा धत्से भस्माङ्गरागाय ॥ ४१॥ भस्मासुरोऽपि कश्चिद्धस्मरशक्तिः
    पुरा भक्तः । विस्मृतशैवचपेटः कपटी भस्मैव सञ्जातः ॥ ४२॥ ख्यातस्त्वमेव देवस्त्वमेव निखिले महादेवः ।
    रुद्रादन्याभावे स नास्मि विष्णुर्न वा धाता ॥ ४३॥ धातुस्त्वमेव धाता पाता विष्णोश्च विष्णुत्वात । अपि
    च हरस्य हरस्त्वं नातस्त्रातः परा काष्टा ॥ ४४॥ काष्ठावासो वासो यस्य त्रैलोक्यधृलीषु । युक्तं निखिले
    दग्धे शेषावासश्च वासाय ॥ ४५॥ वासो यस्य हृदब्जे भासः सर्वेषु भूतेषु । हासः कालो नृत्याद्दासस्तस्याहमेकस्य
    ॥ ४६॥ एकस्य द्वे नियमात्कश्चिद्वैपश्चितोऽस्स्वर्थः । जानेऽहं तु यदङ्गे गिरिजागङ्गे तमेवैकम् ॥ ४७॥
    एको रुद्रः प्रथमा सर्वो रुद्रः परा बृते । परमृग्यजुषोक्तीनां सिद्धः सिद्धान्त एवैकः ॥ ४८॥ एकोऽहं तु
    बहु स्यामनया वाचैव सा सिद्धिः । तस्मात्सिद्धिनिदानं रुद्रं जानन्तु भद्राय ॥ ४९॥ भद्राय राजमुद्रा वेदो
    ब्रूते शिवः शिवदः । नातः पुमर्थसिद्धिः काचित्कश्चिन्न सिद्धान्तः ॥ ५०॥ सिद्धान्तादरदूरं दूरत्वान्नाम
    पीयूषात् । पीयूषांशुकलाधरधर मां चानाथनाथत्वात् ॥ ५१॥ नाथ
