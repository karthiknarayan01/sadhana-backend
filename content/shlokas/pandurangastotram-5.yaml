id: pandurangastotram-5
category: stotram
name:
  english: pandurangastotram 5
  devanagari: पाण्डुरन्गस्तोत्रम् ५
content:
  english: vajravedendubhrinnaradah | sthapayamasa saddharmikah ko'pi tam cetasaivashraye sadhubhirgopitam
    || 3|| panipadmadvayanyasarajatkatim shyamalam komalam pitavidyutpatim | sadhubhirnrityamanamudaram
    natim sampibamodbhutangim sudhaya ghatim || 4|| gadhamalingyate ya sada papibhi ramyarupa yaya nekshyate
    kapi bhih | svairgunairmugdhagitaih sada mohitam tam vishankam svamaturvadamo hitam || 5|| mayyapatye
    svakarmalase'lam krudha cintaya sadhubhistamyate kim mudha | bhimarathyastate
  devanagari: वज्रवेदेन्दुभृन्नारदाः । स्थापयामास सद्धार्मिकः कोऽपि तां चेतसैवाश्रये साधुभिर्गोपिताम्
    ॥ ३॥ पाणिपद्मद्वयन्यासराजत्कटिं श्यामलां कोमलां पीतविद्युत्पटीं । साधुभिर्नृत्यमानामुदारां नटीं सम्पिबामोद्भुताङ्गीं
    सुधाया घटीम् ॥ ४॥ गाढमालिङ्ग्यते या सदा पापिभी रम्यरूपा यया नेक्ष्यते कापि भीः । स्वैर्गुणैर्मुग्धगीतैः
    सदा मोहितां तां विशङ्कं स्वमातुर्वदामो हिताम् ॥ ५॥ मय्यपत्ये स्वकर्मालसेऽलं क्रुधा चिन्तया साधुभिस्ताम्यते
    कीं मुधा । भीमरथ्यास्तटे
meaning: {}
