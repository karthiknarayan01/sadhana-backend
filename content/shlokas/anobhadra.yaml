id: anobhadra
category: sukta
name:
  english: anobhadra
  devanagari: आनोभद्रा
content:
  english: bha̱drah krata̭vo yantu vi̱shvato'da̭bdhaso̱ apa̭ritasa u̱dbhida̭h | de̱va no̱ yatha̱ sada̱mid
    vri̱dhe asa̱nnapra
  devanagari: भ॒द्राः क्रत॑वो यन्तु वि॒श्वतोऽद॑ब्धासो॒ अप॑रीतास उ॒द्भिदः॑ । दे॒वा नो॒ यथा॒ सद॒मिद् वृ॒धे
    अस॒न्नप्रा
meaning: {}
