id: chintamani-shatpadi
category: stotram
name:
  english: Chintamani Shatpadi
content:
  english: dviradavadana vishamarada varada jayeshana shantavarasadana | sadanavasadana dayaya kuru sadanamantarayasya
    || || indukala kalitalika salikashumbhatkapolapaliyuga | vikatasphutakatadharadharo'syasya prapancasya
    || || varaparashupashapane panitapanayapanayito'si yatah | aruhya vajradantam akhum vidadhasi vipadantam
    || || lambodara durvasana shayadhritasamodamodakashanaka | shanakairavalokaya mam yamantarayapaharicarudrisha
    || || anandatundilakhilavrindarakavrindavanditanghriyuga | sukhadhritadandarasalo nagajabhalo'tibhasi
    vibho || || aganeyaguneshatmaja cintakacintamane ganeshana | svacaranasharanam karunavarunalaya deva
    pahi mam dinam || || ruciravaco'mritaravonnita nita divam stutih sphita | iti shatpadi madiya ganapatipadambuje
    vishatu || || iti cintamanishatpadi ||
  devanagari: द्विरदवदन विषमरद वरद जयेशान शान्तवरसदन । सदनवसादन दयया कुरु सादनमन्तरायस्य ॥ ॥ इन्दुकला
    कलितालिक सालिकशुम्भत्कपोलपालियुग । विकटस्फुटकटधाराधारोऽस्यस्य प्रपञ्चस्य ॥ ॥ वरपरशुपाशपाणे पणितपणायापणायितोऽसि
    यतः । आरूह्य वज्रदन्तं आखुं विदधासि विपदन्तम् ॥ ॥ लम्बोदर दूर्वासन शयधृतसामोदमोदकाशनक । शनकैरवलोकय
    मां यमान्तरायापहारिचारुदृशा ॥ ॥ आनन्दतुन्दिलाखिलवृन्दारकवृन्दवन्दिताङ्घ्रियुग । सुखधृतदण्डरसालो नागजभालोऽतिभासि
    विभो ॥ ॥ अगणेयगुणेशात्मज चिन्तकचिन्तामणे गणेशान । स्वचरणशरणं करुणावरुणालय देव पाहि मां दीनम् ॥ ॥ रुचिरवचोऽमृतरावोन्नीता
    नीता दिवं स्तुतिः स्फीता । इति षट्पदी मदीया गणपतिपादाम्बुजे विशतु ॥ ॥ इति चिन्तामणिषट्पदी ॥
