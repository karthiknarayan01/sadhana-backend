id: banasurakritamrudrastotram
category: stotram
name:
  english: banasurakritamrudrastotram
  devanagari: बाणासुरकृतंरुद्रस्तोत्रम्
content:
  english: haraya namo bhava bhima maheshvara sarva namah | kusumayudhadehavinashakara tripurantaka andhakashuladhara
    || 67|| pramadapri kanta virakta namah sasurasurasiddhaganairnamita | hayavanarasimhagajendramukhairatihrasvasudirghavishalamukhaih
    || 68|| upalabdhumashakyatarairasuraih prathito'smi ca bahushatairbahubhih | pranato'smi bhavam bhavabhaktiratashcalacandrakalankura
    deva namah || 69|| na ca putrakalatrahayadi dhanam mama tu tvadanusmaranam sharanam | vyathito'smi
    sharirashatairbahubhirgamita ca mahanarakasya gatih || 70|| na nivartati janma na papamatih shucikarma
    nibaddhamapi tyajati | anukampati vibhramati trasati mama caiva kukarma nivarayati || 71|| yah pathettotakam
    divyam prayatah shucimanasah | banasyeva yatha rudrastasyapi varado bhavet || 72|| iti matsyapurane
    ashtasyadhikashatatamadhyayantargata banasurakrita shivastutih samapta | matsyapurana | adhyaya 188
  devanagari: हराय नमो भव भीम महेश्वर सर्व नमः । कुसुमायुधदेहविनाशकर त्रिपुरान्तक अन्धकशूलधर ॥ ६७॥ प्रमदाप्रि
    कान्त विरक्त नमः ससुरासुरसिद्धगणैर्नमित । हयवानरसिंहगजेन्द्रमुखैरतिह्रस्वसुदीर्घविशालमुखैः ॥ ६८॥ उपलब्धुमशक्यतरैरसुरैः
    प्रथितोऽस्मि च बाहुशतैर्बहुभिः । प्रणतोऽस्मि भवं भवभक्तिरतश्चलचन्द्रकलाङ्कुर देव नमः ॥ ६९॥ न च पुत्रकलत्रहयादि
    धनं मम तु त्वदनुस्मरणं शरणम् । व्यथितोऽस्मि शरीरशतैर्बहुभिर्गमिता च महानरकस्य गतिः ॥ ७०॥ न निवर्तति
    जन्म न पापमतिः शुचिकर्म निबद्धमपि त्यजति । अनुकम्पति विभ्रमति त्रसति मम चैव कुकर्म निवारयति ॥ ७१॥
    यः पठेत्तोटकं दिव्यं प्रयतः शुचिमानसः । बाणस्येव यथा रुद्रस्तस्यापि वरदो भवेत् ॥ ७२॥ इति मत्स्यपुराणे
    अष्टास्यधिकशततमाध्यायान्तर्गता बाणासुरकृता शिवस्तुतिः समाप्ता । मत्स्यपुराण । अध्याय १८८
meaning: {}
