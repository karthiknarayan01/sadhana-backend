id: mahakalasahasranamastotra
category: stotram
name:
  english: mahakalasahasranamastotra
  devanagari: महाकालसहस्रनामस्तोत्र
content:
  english: bhaktayabhashitam maya || 6|| kuru bilvarpanam tena yena tvam vindase sukham | sahasrasyasya
    rishyo'ham chando'nushtup tathaiva ca || 7|| devah prokto mahakalo viniyogashca siddhaye | sankalpyaivam
    tato dhyayenmahakalavibhum muda || 8|| viniyogah | om asya shrimahakalasahasranamastotramalamantrasya
    shrikrishnarishih | anushtupchandah | shrimahakalo devata | om bijam | namah shaktih | mahakalayeti
    kilakam | sarvarthasiddhyarthe pathe viniyogah | rishyadinyasah | om shrikrishnarshaye namah shirasi
    | anushtupchandase namah mukhe | mahakaladevatayai namah hridaye | om bijaya namah guhye | namah shaktaye
    namah padayoh | mahakalayeti kilakaya namah nabhau || shrimahakalaprityarthe sahasranamastotrapathe
    viniyogaya namah sarvange || karanyasah evam hridayadinyasah || karanyasah | om angushthabhyam namah
    | mahakalaya tarjanibhyam namah | namah madhyamabhyam namah | om anamikabhyam namah | mahakalaya kanishthikabhyam
    namah | namah karatalakaraprishthabhyam namah || anganyasah | om hridayaya namah | mahakalaya shirase
    svaha | namah shikhayai vashat | om kavacaya hum | mahakalaya netratrayaya vaushat | namah astraya
    phat | vyapakanyasah om mahakalaya namah || atha dhyanam kunkumagarukasturikesharena vicarcitam |
    nanapushpasrajalankridbilvamaulivalanvitam || 9|| puro nandi sthito vame girirajakumarika | brahmanairavritam
    nityam mahakalamaham bhaje || 10|| || iti dhyanam || atha sahasranamastotram | om mahakalo maharupo
    mahadevo maheshvarah | mahaprajno mahashambhurmahesho mohabhanjanah || 11|| manyo manmathahanta ca
    mohano mrityunashanah | manyado madhavo moksho mokshado maranapaha || 12|| muhurto munivandyashca
    manurupo manurmanuh | manmatharirmahaprajno manonando mamatvaha || 13|| munisho munikarta ca mahattvam
    mahadadhipah | mainako mainakavandyo madhvaripranavallabhah || 14|| mahalayeshvaro moksho meghanadeshvarabhidhah
    | muktishvaro mahamukto mantrajno mantrakarakah || 15|| mangalo mangaladhisho madhyadeshapatirmahan
    | magadho manmatho matto matango malatipatih || 16|| mathuro mathuranatho malavadhishamanyupah | marutirminapo
    mauno markando mandalo mridah || 17|| madhupriyo madhusnayi mishtabhoji mrinaladhrik | manjulo mallamodajno
    modakrinmodadayakah || 18|| muktido muktarupashca muktamalavibhushitah | mrikando modapo modo modakashanakarakah
    || 19|| yajno yajnapatiryajno yajnesho yajnanashanah | yajnateja yasho yogi yogisho yogadayakah ||
    20|| yatirupo yajnavalkyo yajnakrid yajnaluptaha | yajnamrid yajnaha yajno yajnabhug yajnasadhakah
    || 21|| yajnango yajnahota ca yajvano yajano yatih | yashahprado yashahkarta yasho yajnopavitadhrik
    || 22|| yajnaseno yajnikashca yashodavaradayakah | yamesho yamakarta ca yamadutanivaranah || 23||
    yacako yamunakrido yajnasenihitapradah | yavapriyo yavarupo yavananto yavi yavah || 24|| rigvedo rogahanta
    ca rantidevo ranagranih | raivato raivatadhisho raivateshvarasamjnakah || 25|| rameshvaro rakarashca
    ramapriyo ramapriyah | rani ranaharo raksho rakshako rinaharakah || 26|| rakshita rajarupo rat ravo
    rupo rajahpradah | ramacandrapriyo raja rakshoghno rakshasadhipah || 27|| rakshasam varado ramo rakshasantakaro
    rathi | rathapriyo rathasthayi rathaha rathaharakah || 28|| ravanapriyakridravasvarupashca riturajah
    || rativarapradata ca rantidevavarapradah || 29|| rajadhaniprado reto revabhanjo ravi raji | ritvijo
    rasakarta ca rasajno rasadayakah || 30|| rudro rudrakshadhrigraudro ratno ratnairvibhushitah | rupeshvaro
    ramapujyo rururajyasthaleshvarah || 31|| laksho lakshapatirlingo ladduko laddukapriyah | lilambaradharo
    labho labhado labhakritsada || 32|| lajjaraksho laghurupo lekhako lekhakapriyah | langalo lavanabdhisho
    lakshmipujitalakshakah || 33|| lokapaleshvaro lampo lankesho lampakeshvarah | vahirnetro varangashca
    vasurupo vasupradah || 34|| varenyo varado vedo vedavedangaparagah | vriddhakaleshvaro vriddho vibhavo
    vibhavapradah || 35|| venugitapriyo vaidyo varanasisthitah sada | vishvesho vishvakarta ca vishvanatho
    vinayakah || 36|| vedajno varnakridvarno varnashramaphalapradah | vishvavandyo vishvavetta vishvavasurvibhavasuh
    || 37|| vittarupo vittakarta vittado vishvabhavanah | vishvatma vaishvadevashca vanesho vanapalakah
    || 38|| vanavasi vrishasthayi vrishabho vrishabhapriyah | vilvidalapriyo vilvo vishalanetrasamsthitah
    || 39|| vrishadhvajo vrishadhisho vrishabhesho vrishapriyah | vilveshvaro varo viro vireshashca vaneshvarah
    || 40|| vibhutibhushito venyo vyalayajnopavitakah | vishveshvaro varanando vatarupo vateshvarah ||
    41|| sarveshah sattvah sarango sattvarupah sanatanah | sadvandyah saccidanandah sadanandah shivapriyah
    || 42|| shivadah shivakritsambah shashishekharashobhanah | sharanyah sukhadah sevyah shatanandavarapradah
    || 43|| sattvikah sattvatah shambhuh shankarah sarvagah shivah | sevaphalapradata ca sevakapratipalakah
    || 44|| shatrughnah samagah shaurih senanih sharvaripriyah | shmashani skandasadvedah sada surasaritpriyah
    || 45|| sudarshanadharah shuddhah sarvasaubhagyadayakah | saubhagyah subhagah surah suryah sarangamuktidah
    || 46|| saptasvarashca saptashvah saptah saptarshipujitah | shitikanthah shivadhishah sangamah sangameshvarah
    || 47|| someshah somatirtheshah sarpadhriksvarnakarakah | svarnajaleshvarah siddhah siddheshah siddhidayakah
    || 48|| sarvasakshi sarvarupah sarvajnah shastrasamskritah | saubhagyeshvarah simhasthah shiveshah
    simhakeshvarah || 49|| shuleshvarah shukanandah sahasradhenukeshvarah | syandanasthah suradhishah
    sanakadyarcitah sudhih || 50|| shadurmih shat|sucakrajnah shatcakrakavibhedakah | shadananah shadangajnah
    shadrasajnah shadananah || 51|| haro hamso hataratirhiranyo hatakeshvarah | herambo havano hota hayarupo
    hayapradah || 52|| hastido hastitvagdhari hahahuhuvarapradah | havyahemahavishyanno hatakesho havihpriyah
    || 53|| hiranyareta hamsajno hiranyo hatakeshvarah | hanumadisho haro harsho harasiddhipithagah ||
    54|| haimo haimalayo huhuhahaheturhatho hathi | kshatrah kshatrapradah kshatri kshetrajnah kshetranayakah
    || 55|| kshemah kshemapradata ca kshantikrit kshantivardhanah | kshirarnavah kshirabhokta kshiprakulakshiteh
    patih || 56|| kshaudrarasapriyah kshirah kshiprasiddhipradah sada | jnano jnanaprado jneyo jnanatito
    jnapo jnayah || 57|| jnanarupo jnanagamyo jnani jnanavatamvarah | ajo hyanantashcavyakta adya anandadayakah
    || 58|| akatha atma hyanandashcajeyo hyaja atmabhuh | adyarupo hyaricchetta'namayashcapyalaukikah
    || atirupo hyakhandatma catmajnanaratah sada | atmavetta hyatmasakshi anadishcantaratmagah || 60||
    anandesho'vimukteshashcalarkesho'psareshvarah | adikalpeshvaro'gastyashcakruresho'runeshvarah || 61||
    idarupa ibhacchetta ishvarashcendirarcitah | indurindivarashcesha ishaneshvara irshaha || 62|| ijya
    indivarashcebha ikshurikshurasapriyah | umakanta umasvami tathomayah pramodakrit || 63|| urvashivaradashcaiva
    uccairuttungadharakah | ekarupa ekasvami hyekatma caikarupavan || 64|| airavata aisthiratma caikaraishvaryadayakah
    | okara ojasvamshcaiva hyaukharashcaukharadhipah || 65|| aushadhya aushadhijnata hyojoda aushadhishvarah
    | ananto hyantakashcanto hyandhakasurasudanah || 66|| acyutashcaprameyatma aksharashcashvadayakah
    | arihanta hyavantishashcahibhushanabhritsada || 67|| avantipuravasi capyavantipurapalakah | amarashcamaradhisho
    hyamararivihimsakah || 68|| kamaha kamakamashca kamadah karunakarah | karunyah kamalapujyah kapali
    kalinashanah || 69|| kamarikritkallolah kalikeshashca kalajit | kapilah kotitirtheshah kalpantah kalaha
    kavih || 70|| kaleshvarah kalakarta kalpabdhih kalpavrikshakah | kotishah kamadhenvishah kushalah
    kushalapradah || 71|| kiriti kundali kunti kavaci karparapriyah | karpurabhah kaladakshah kalajnah
    kilbishapaha || 72|| kukkuteshah karkateshah kuladah kulapalakah | kanjabhilashi kedarah kunkumarcitavigrahah
    || 73|| kundapushpapriyah kanjah kamarih kamadahakah | krishnarupah kriparupashcatha krishnarcitanghrikah
    || 74|| kundah kundeshvarah kanvah keshavaih paripujitah | kameshvarah kalanathah kantheshah kunkumeshvarah
    || 75|| kanthadeshah kapaleshah kayavarohaneshvarah | karabheshah kutumbeshah karkeshah kaushaleshvarah
    || 76|| koshadah koshabhrit koshah kausheyah kaushikapriyah | khacarah khacaradhishah khacareshah
    kharantakah || 77|| khecaraih pujitapadah khecarisevakapriyah | khandeshvarah khadgarupah khadgagrahi
    khageshvarah || 78|| khetah khetapriyah khandah khandapalah khalantakah | khandavah khandavadhishah
    khadgatasangamasthitah || 79|| girisho girijadhisho gajaritvagvibhushitah | gautamo girirajashca gangadharo
    gunakarah || 80|| gautamitatavasi ca galavo gopatishvarah | gokarno gopatirgarvo majarirgarudapriyah
    || 81|| gangamaulirgunagrahi garudividyaya yutah | gurorgururgajaratirgopalo gomatipriyah || 82||
    gunado gunakarta ca ganesho ganapujitah | ganako gauravo gargo gandharvena prapujitah || 83|| goraksho
    gurvinitrata geho gehapradayakah | gitadhyayi gayadhisho gopatirgitamohitah || 84|| giratito gunatito
    gadahgesho guhyakeshvarah | graho grahapatirgamyo grahapidanivaranah || 85|| ghatanadirghanadharo
    ghaneshvaro ghanakarah | ghushmeshvaro ghanakaro ghanarupo ghanagranih || 86|| ghantevaro ghatadhisho
    ghargharo ghasmarapaha | ghushmesho ghoshakridghoshi ghoshaghosho ghanadhvanih || 87|| ghritapriyo
    ghritabdhisho ghanto ghantaghatotkacah | ghatotkacaya varado ghatajanma ghateshvarah || 88|| ghakaro
    nakrito nashca nakaro nakritangajah | caracarashcidanandashcinmayashcandrashekharah || 89|| candreshvarashcamareshashcamarena
    vibhushitah | camarashcamaradhishashcaracarapatishcirah || 90|| camatkritashcandravarnashcarmabhriccarma
    camari | canakyashcarmadhari ca ciracamaradayakah || 91|| cyavaneshashcarushcarushcandradityeshvarabhidhah
    | candrabhagapriyashcandashcamaraih parivijitah || 92|| chatreshvarashchatradhari chatradashchalaha
    chali | chatreshashchatrakricchatri chandavicchandadayakah || 93|| jagannatho janadharo jagadisho
    janardanah | jahnavidhrigjagatkarta jaganmayo janadhipah || 94|| jivo jivapradata ca jeta'tho jivanapradah
    | jangamashca jagaddhata jagatkenaprapujitah || 95|| jatadharo jatajuti jatilo jalarupadhrik | jalandharashirashchetta
    jalajanghrirjagatpatih || 96|| janatrata jagannidhirjateshvaro jaleshvarah | jharjharo jharanakari
    jhunjhakrit jhujhaha jharah || 97|| nakarashca namuvasi najanapriyakarakah | takarashca thakarashca
    damaro damarupriyah || 98|| dandadhrigdamaruhasto dakihriddamakeshvarah | dhundho dhundheshvaro dhakko
    dhakkanadapriyah sada || 99|| nakaro nasvarupashca nunoninonakaranah | tantrajnastryambakastantritumburustulasipriyah
    || 100|| tuniradhrik tadakarastandavi tandaveshvarah | tattvajnastattvarupashca tattvikastaraviprabhah
    || 101|| trinetrastarunastattvastakarastalavasakrit | tejasvi tejorupi ca tejahpunjaprakashakah ||
    102|| tantrikastantrakarta ca tantravidyaprakashakah | tamrarupastadakarastattvadastaranipriyah ||
    103|| tantreyastamoha tanvi tamasastamasapaha | tamrastamrapradata ca tamravarnastarupriyah || 104||
    tapasvi tapasi tejastejorupastalapriyah | tilastilapradata ca tulastulapradayakah || 105|| tapishastamraparnishastilakastranakarakah
    | tripuraghnastrayatitastrilocanastrilokapah || 106|| trivishtapeshvarastejastripurastripuradahakah
    | tirthastarapatistrata tadikeshastadijjavah || 107|| thakarashca sthulakarah sthulah sthavirah sthanadah
    | sthanuh sthayi sthavareshah sthambhah sthavarapidaha || 108|| sthularupasthiteh karta sthuladuhkhavinashanah
    | thandilasthadalah sthalyah sthalakrit sthalabhrit sthali || 109|| sthaleshvarah sthalakarah sthalagrajah
    sthaleshvarah | daksho dakshaharo dravyo dundubhirvaradayakah || 110|| devo devagrajo dano danavarirdineshvarah
    | devakriddevabhriddata dayarupi divaspatih || 111|| damodaro daladharo dugdhasnayi dadhipriyah |
    devarajo divanatho devajno devatapriyah || 112|| devadevo danarupo durvadalapriyah sada | digvasa
    darabho danto daridraghno digambarah || 113|| dinabandhurduraradhyo duranto dushtadarpaha | dakshaghno
    dakshahanta ca dakshajamata devajit || 114|| dvandvaha duhkhaha dogdha durdharo durdhareshvarah |
    danapto danabhriddiptadiptirdivyo divakarah || 115|| dambhaha dambhakriddambhi dakshajapatirdiptiman
    | dhanvi dhanurdharo dhiro dhanyakriddhanyadayakah || 116|| dharmadharmabhrito dhanyo dharmamurtirdhaneshvarah
    | dhanado dhurjatirdhanyo dhamado dharmiko dhani || 117|| dharmarajo dhanadharo dharadharo dharapatih
    | dhanurvidyadharo dhurto dhulidhusaravigrahah || 118|| dhanusho dhanushakaro dhanurdharabhritamvarah
    | dharanatho dharadhisho dhanesho dhanadagrajah || 119|| dharmabhriddharmasantrata dharmaraksho dhanakarah
    | narmado narmadajato narmadesho nripeshvarah || 120|| nagabhrinnagalokesho nagabhushanabhushitah
    | nagayajnopaviteyo nago nagaripujitah || 121|| nanyo naravaro nemo nupuro nupureshvarah | nagacandeshvaro
    nago naganatho nageshvarah || 122|| nilagangapriyo nado navanatho nagadhipah | prithukeshah prayageshah
    pattaneshah parasharah || 123|| pushpadanteshvarah pushpah pingaleshvarapurvajah | pishaceshah pannageshah
    pashupatishvarah priyah || 124|| parvatipujitah pranah praneshah papanashanah | parvatiprananathashca
    pranabhrit pranajivanah || 125|| puranapurushah prajnah premajnah parvatipatih | pushkarah pushkaradhishah
    patrah patraih prapujitah || 126|| putradah punyadah purnah patambaravibhushitah | padmakshah padmasragdhari
    padmena parishobhitah || 127|| phanibhrit phaninathashca phenikabhakshakarakah | sphatikah pharshudhari
    ca sphatikabho phalapradah || 128|| badrisho balarupashca bahubhoji baturbatuh | balakhilyarcito balo
    brahmesho brahmanarcitah || 129|| brahmano brahmaha brahma brahmajno brahmanapriyah | brahmanastho
    brahmarupo brahmanaparipalakah || 130|| brahmamurtirbrahmasvami brahmanaih parishobhitah | brahmanariharo
    brahma brahmanasyaih pratarpitah || 131|| bhutesho bhutanathashca bhasmango bhimavikramah | bhimo
    bhavaharo bhavyo bhairavo bhayabhanjanah || 132|| bhutido bhuvanadharo bhuvanesho bhrigurbhavah |
    bharatisho bhujangesho bhaskaro bhindipaladhrik || 133|| bhuto bhayaharo bhanurbhavano bhavanashanah
    | sahasranamabhishcaitairmahakalah prasidatu || 134|| atha mahakalasahasranamamahatmyam | suta uvaca
  devanagari: भक्तायाभाषितं मया ॥ ६॥ कुरु बिल्वार्पणं तेन येन त्वं विन्दसे सुखम् । सहस्रस्यास्य ऋष्योऽहं
    छन्दोऽनुष्टुप् तथैव च ॥ ७॥ देवः प्रोक्तो महाकालो विनियोगश्च सिद्धये । सङ्कल्प्यैवं ततो ध्यायेन्महाकालविभुं
    मुदा ॥ ८॥ विनियोगः । ॐ अस्य श्रीमहाकालसहस्रनामस्तोत्रमालामन्त्रस्य श्रीकृष्णऋषिः । अनुष्टुप्छन्दः
    । श्रीमहाकालो देवता । ॐ बीजम् । नमः शक्तिः । महाकालायेति कीलकम् । सर्वार्थसिद्ध्यर्थे पाठे विनियोगः
    । ऋष्यादिन्यासः । ॐ श्रीकृष्णर्षये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । महाकालदेवतायै नमः हृदये
    । ॐ बीजाय नमः गुह्ये । नमः शक्तये नमः पादयोः । महाकालायेति कीलकाय नमः नाभौ ॥ श्रीमहाकालप्रीत्यर्थे
    सहस्रनामस्तोत्रपाठे विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः एवं हृदयादिन्यासः ॥ करन्यासः । ॐ अङ्गुष्ठाभ्यां
    नमः । महाकालाय तर्जनीभ्यां नमः । नमः मध्यमाभ्यां नमः । ॐ अनामिकाभ्यां नमः । महाकालाय कनिष्ठिकाभ्यां
    नमः । नमः करतलकरपृष्ठाभ्यां नमः ॥ अङ्गन्यासः । ॐ हृदयाय नमः । महाकालाय शिरसे स्वाहा । नमः शिखायै वषट्
    । ॐ कवचाय हुम् । महाकालाय नेत्रत्रयाय वौषट् । नमः अस्त्राय फट् । व्यापकन्यासः ॐ महाकालाय नमः ॥ अथ
    ध्यानं कुङ्कुमागरुकस्तूरीकेशरेण विचर्चितम् । नानापुष्पस्रजालङ्कृद्बिल्वमौलिवलान्वितम् ॥ ९॥ पुरो नन्दी
    स्थितो वामे गिरिराजकुमारिका । ब्राह्मणैरावृतं नित्यं महाकालमहं भजे ॥ १०॥ ॥ इति ध्यानम् ॥ अथ सहस्रनामस्तोत्रम्
    । ॐ महाकालो महारूपो महादेवो महेश्वरः । महाप्राज्ञो महाशम्भुर्महेशो मोहभञ्जनः ॥ ११॥ मान्यो मन्मथहन्ता
    च मोहनो मृत्युनाशनः । मान्यदो माधवो मोक्षो मोक्षदो मरणापहा ॥ १२॥ मुहूर्तो मुनिवन्द्यश्च मनुरूपो मनुर्मनुः
    । मन्मथारिर्महाप्राज्ञो मनोनन्दो ममत्वहा ॥ १३॥ मुनीशो मुनिकर्ता च महत्त्वं महदाधिपः । मैनाको मैनकावन्द्यो
    मध्वरिप्राणवल्लभः ॥ १४॥ महालयेश्वरो मोक्षो मेघनादेश्वराभिधः । मुक्तीश्वरो महामुक्तो मन्त्रज्ञो मन्त्रकारकः
    ॥ १५॥ मङ्गलो मङ्गलाधीशो मध्यदेशपतिर्महान् । मागधो मन्मथो मत्तो मातङ्गो मालतीपतिः ॥ १६॥ माथुरो मथुरानाथो
    मालवाधीशमन्युपः । मारुतिर्मीनपो मौनो मार्कण्डो मण्डलो मृडः ॥ १७॥ मधुप्रियो मधुस्नायी मिष्टभोजी मृणालधृक्
    । मञ्जुलो मल्लमोदज्ञो मोदकृन्मोददायकः ॥ १८॥ मुक्तिदो मुक्तरूपश्च मुक्तामालाविभूषितः । मृकण्डो मोदपो
    मोदो मोदकाशनकारकः ॥ १९॥ यज्ञो यज्ञपतिर्यज्ञो यज्ञेशो यज्ञनाशनः । यज्ञतेजा यशो योगी योगीशो योगदायकः
    ॥ २०॥ यतिरूपो याज्ञवल्क्यो यज्ञकृद् यज्ञलुप्तहा । यज्ञमृद् यज्ञहा यज्ञो यज्ञभुग् यज्ञसाधकः ॥ २१॥ यज्ञाङ्गो
    यज्ञहोता च यज्वानो यजनो यतिः । यशःप्रदो यशःकर्ता यशो यज्ञोपवीतधृक् ॥ २२॥ यज्ञसेनो याज्ञिकश्च यशोदावरदायकः
    । यमेशो यमकर्ता च यमदूतनिवारणः ॥ २३॥ याचको यमुनाक्रीडो याज्ञसेनीहितप्रदः । यवप्रियो यवरूपो यवनान्तो
    यवी यवः ॥ २४॥ ऋग्वेदो रोगहन्ता च रन्तिदेवो रणाग्रणीः । रैवतो रैवताधीशो रैवतेश्वरसंज्ञकः ॥ २५॥ रामेश्वरो
    रकारश्च रामप्रियो रमाप्रियः । रणी रणहरो रक्षो रक्षको ऋणहारकः ॥ २६॥ रक्षिता राजरूपो राट् रवो रूपो रजःप्रदः
    । रामचन्द्रप्रियो राजा रक्षोघ्नो राक्षसाधिपः ॥ २७॥ रक्षसां वरदो रामो राक्षसान्तकरो रथी । रथप्रियो
    रथस्थायी रथहा रथहारकः ॥ २८॥ रावणप्रियकृद्रावस्वरूपश्च ऋतूरजः ॥ रतिवरप्रदाता च रन्तिदेववरप्रदः ॥ २९॥
    राजधानीप्रदो रेतो रेवाभञ्जो रवी रजी । ऋत्विजो रसकर्ता च रसज्ञो रसदायकः ॥ ३०॥ रुद्रो रुद्राक्षधृग्रौद्रो
    रत्नो रत्नैर्विभूषितः । रूपेश्वरो रमापूज्यो रुरुराज्यस्थलेश्वरः ॥ ३१॥ लक्षो लक्षपतिर्लिङ्गो लड्डुको
    लड्डुकप्रियः । लीलाम्बरधरो लाभो लाभदो लाभकृत्सदा ॥ ३२॥ लज्जारक्षो लघुरूपो लेखको लेखकप्रियः । लाङ्गलो
    लवणाब्धीशो लक्ष्मीपूजितलक्षकः ॥ ३३॥ लोकपालेश्वरो लम्पो लङ्केशो लम्पकेश्वरः । वहिर्नेत्रो वराङ्गश्च
    वसुरूपो वसुप्रदः ॥ ३४॥ वरेण्यो वरदो वेदो वेदवेदाङ्गपारगः । वृद्धकालेश्वरो वृद्धो विभवो विभवप्रदः ॥
    ३५॥ वेणुगीतप्रियो वैद्यो वाराणसीस्थितः सदा । विश्वेशो विश्वकर्ता च विश्वनाथो विनायकः ॥ ३६॥ वेदज्ञो
    वर्णकृद्वर्णो वर्णाश्रमफलप्रदः । विश्ववन्द्यो विश्ववेत्ता विश्वावसुर्विभावसुः ॥ ३७॥ वित्तरूपो वित्तकर्ता
    वित्तदो विश्वभावनः । विश्वात्मा वैश्वदेवश्च वनेशो वनपालकः ॥ ३८॥ वनवासी वृषस्थायी वृषभो वृषभप्रियः
    । विल्वीदलप्रियो विल्वो विशालनेत्रसंस्थितः ॥ ३९॥ वृषध्वजो वृषाधीशो वृषभेशो वृषप्रियः । विल्वेश्वरो
    वरो वीरो वीरेशश्च वनेश्वरः ॥ ४०॥ विभूतिभूषितो वेण्यो व्यालयज्ञोपवीतकः । विश्वेश्वरो वरानन्दो वटरूपो
    वटेश्वरः ॥ ४१॥ सर्वेशः सत्त्वः सारङ्गो सत्त्वरूपः सनातनः । सद्वन्द्यः सच्चिदानन्दः सदानन्दः शिवप्रियः
    ॥ ४२॥ शिवदः शिवकृत्साम्बः शशिशेखरशोभनः । शरण्यः सुखदः सेव्यः शतानन्दवरप्रदः ॥ ४३॥ सात्त्विकः सात्त्वतः
    शम्भुः शङ्करः सर्वगः शिवः । सेवाफलप्रदाता च सेवकप्रतिपालकः ॥ ४४॥ शत्रुघ्नः सामगः शौरिः सेनानीः शर्वरीप्रियः
    । श्मशानी स्कन्दसद्वेदः सदा सुरसरित्प्रियः ॥ ४५॥ सुदर्शनधरः शुद्धः सर्वसौभाग्यदायकः । सौभाग्यः सुभगः
    सूरः सूर्यः सारङ्गमुक्तिदः ॥ ४६॥ सप्तस्वरश्च सप्ताश्वः सप्तः सप्तर्षिपूजितः । शितिकण्ठः शिवाधीशः सङ्गमः
    सङ्गमेश्वरः ॥ ४७॥ सोमेशः सोमतीर्थेशः सर्पधृक्स्वर्णकारकः । स्वर्णजालेश्वरः सिद्धः सिद्धेशः सिद्धिदायकः
    ॥ ४८॥ सर्वसाक्षी सर्वरूपः सर्वज्ञः शास्त्रसंस्कृतः । सौभाग्येश्वरः सिंहस्थः शिवेशः सिंहकेश्वरः ॥ ४९॥
    शूलेश्वरः शुकानन्दः सहस्रधेनुकेश्वरः । स्यन्दनस्थः सुराधीशः सनकाद्यर्चितः सुधीः ॥ ५०॥ षडूर्मिः षट्।सुचक्रज्ञः
    षट्चक्रकविभेदकः । षडाननः षडङ्गज्ञः षड्रसज्ञः षडाननः ॥ ५१॥ हरो हंसो हतारातिर्हिरण्यो हाटकेश्वरः । हेरम्बो
    हवनो होता हयरूपो हयप्रदः ॥ ५२॥ हस्तिदो हस्तित्वग्धारी हाहाहूहूवरप्रदः । हव्यहेमहविष्यान्नो हाटकेशो
    हविःप्रियः ॥ ५३॥ हिरण्यरेता हंसज्ञो हिरण्यो हाटकेश्वरः । हनुमदीशो हरो हर्षो हरसिद्धिपीठगः ॥ ५४॥ हैमो
    हैमालयो हूहूहाहाहेतुर्हठो हठी । क्षत्रः क्षत्रप्रदः क्षत्री क्षेत्रज्ञः क्षेत्रनायकः ॥ ५५॥ क्षेमः
    क्षेमप्रदाता च क्षान्तिकृत् क्षान्तिवर्धनः । क्षीरार्णवः क्षीरभोक्ता क्षिप्राकूलक्षितेः पतिः ॥ ५६॥
    क्षौद्ररसप्रियः क्षीरः क्षिप्रसिद्धिप्रदः सदा । ज्ञानो ज्ञानप्रदो ज्ञेयो ज्ञानातीतो ज्ञपो ज्ञयः ॥
    ५७॥ ज्ञानरूपो ज्ञानगम्यो ज्ञानी ज्ञानवतांवरः । अजो ह्यनन्तश्चाव्यक्त आद्य आनन्ददायकः ॥ ५८॥ अकथ आत्मा
    ह्यानन्दश्चाजेयो ह्यज आत्मभूः । आद्यरूपो ह्यरिच्छेत्ताऽनामयश्चाप्यलौकिकः ॥ अतिरूपो ह्यखण्डात्मा चात्मज्ञानरतः
    सदा । आत्मवेत्ता ह्यात्मसाक्षी अनादिश्चान्तरात्मगः ॥ ६०॥ आनन्देशोऽविमुक्तेशश्चालर्केशोऽप्सरेश्वरः
    । आदिकल्पेश्वरोऽगस्त्यश्चाक्रूरेशोऽरुणेश्वरः ॥ ६१॥ इडारूप इभच्छेत्ता ईश्वरश्चेन्दिरार्चितः । इन्दुरिन्दीवरश्चेश
    ईशानेश्वर ईर्षहा ॥ ६२॥ इज्य इन्दीवरश्चेभ इक्षुरिक्षुरसप्रियः । उमाकान्त उमास्वामी तथोमायाः प्रमोदकृत्
    ॥ ६३॥ उर्वशीवरदश्चैव उच्चैरुत्तुङ्गधारकः । एकरूप एकस्वामी ह्येकात्मा चैकरूपवान् ॥ ६४॥ ऐरावत ऐस्थिरात्मा
    चैकारैश्वर्यदायकः । ओकार ओजस्वांश्चैव ह्यौखरश्चौखराधिपः ॥ ६५॥ औषध्य औषधिज्ञाता ह्योजोद औषधीश्वरः ।
    अनन्तो ह्यन्तकश्चान्तो ह्यन्धकासुरसूदनः ॥ ६६॥ अच्युतश्चाप्रमेयात्मा अक्षरश्चाश्वदायकः । अरिहन्ता ह्यवन्तीशश्चाहिभूषणभृत्सदा
    ॥ ६७॥ अवन्तीपुरवासी चाप्यवन्तीपुरपालकः । अमरश्चामराधीशो ह्यमरारिविहिंसकः ॥ ६८॥ कामहा कामकामश्च कामदः
    करुणाकरः । कारुण्यः कमलापूज्यः कपाली कलिनाशनः ॥ ६९॥ कामारिकृत्कल्लोलः कालिकेशश्च कालजित् । कपिलः कोटितीर्थेशः
    कल्पान्तः कालहा कविः ॥ ७०॥ कालेश्वरः कालकर्ता कल्पाब्धिः कल्पवृक्षकः । कोटीशः कामधेन्वीशः कुशलः कुशलप्रदः
    ॥ ७१॥ किरीटी कुण्डली कुन्ती कवची कर्परप्रियः । कर्पूराभः कलादक्षः कलाज्ञः किल्बिषापहा ॥ ७२॥ कुक्कुटेशः
    कर्कटेशः कुलदः कुलपालकः । कञ्जाभिलाषी केदारः कुङ्कुमार्चितविग्रहः ॥ ७३॥ कुन्दपुष्पप्रियः कञ्जः कामारिः
    कामदाहकः । कृष्णरूपः कृपारूपश्चाथ कृष्णार्चिताङ्घ्रिकः ॥ ७४॥ कुण्डः कुण्डेश्वरः काण्वः केशवैः परिपूजितः
    । कामेश्वरः कलानाथः कण्ठेशः कुङ्कुमेश्वरः ॥ ७५॥ कन्थडेशः कपालेशः कायावरोहणेश्वरः । करभेशः कुटुम्बेशः
    कर्केशः कौशलेश्वरः ॥ ७६॥ कोशदः कोशभृत् कोशः कौशेयः कौशिकप्रियः । खचरः खचराधीशः खचरेशः खरान्तकः ॥ ७७॥
    खेचरैः पूजितपदः खेचरीसेवकप्रियः । खण्डेश्वरः खड्गरूपः खड्गग्राही खगेश्वरः ॥ ७८॥ खेटः खेटप्रियः खण्डः
    खण्डपालः खलान्तकः । खाण्डवः खाण्डवाधीशः खड्गतासङ्गमस्थितः ॥ ७९॥ गिरिशो गिरिजाधीशो गजारित्वग्विभूषितः
    । गौतमो गिरिराजश्च गङ्गाधरो गुणाकरः ॥ ८०॥ गौतमीतटवासी च गालवो गोपतीश्वरः । गोकर्णो गोपतिर्गर्वो मजारिर्गरुडप्रियः
    ॥ ८१॥ गङ्गामौलिर्गुणग्राही गारुडीविद्यया युतः । गुरोर्गुरुर्गजारातिर्गोपालो गोमतीप्रियः ॥ ८२॥ गुणदो
    गुणकर्ता च गणेशो गणपूजितः । गणको गौरवो गर्गो गन्धर्वेण प्रपूजितः ॥ ८३॥ गोरक्षो गुर्विणीत्राता गेहो
    गेहप्रदायकः । गीताध्यायी गयाधीशो गोपतिर्गीतमोहितः ॥ ८४॥ गिरातीतो गुणातीतो गडःगेशो गुह्यकेश्वरः । ग्रहो
    ग्रहपतिर्गम्यो ग्रहपीडानिवारणः ॥ ८५॥ घटनादिर्घनाधारो घनेश्वरो घनाकरः । घुश्मेश्वरो घनाकारो घनरूपो
    घनाग्रणीः ॥ ८६॥ घण्टेवरो घटाधीशो घर्घरो घस्मरापहा । घुष्मेशो घोषकृद्घोषी घोषाघोषो घनध्वनिः ॥ ८७॥ घृतप्रियो
    घृताब्धीशो घण्टो घण्टघटोत्कचः । घटोत्कचाय वरदो घटजन्मा घटेश्वरः ॥ ८८॥ घकारो ङकृतो ङश्च ङकारो ङकृताङ्गजः
    । चराचरश्चिदानन्दश्चिन्मयश्चन्द्रशेखरः ॥ ८९॥ चन्द्रेश्वरश्चामरेशश्चामरेण विभूषितः । चामरश्चामराधीशश्चराचरपतिश्चिरः
    ॥ ९०॥ चमत्कृतश्चन्द्रवर्णश्चर्मभृच्चर्म चामरी । चाणक्यश्चर्मधारी च चिरचामरदायकः ॥ ९१॥ च्यवनेशश्चरुश्चारुश्चन्द्रादित्येश्वराभिधः
    । चन्द्रभागाप्रियश्चण्डश्चामरैः परिवीजितः ॥ ९२॥ छत्रेश्वरश्छत्रधारी छत्रदश्छलहा छली । छत्रेशश्छत्रकृच्छत्री
    छन्दविच्छन्ददायकः ॥ ९३॥ जगन्नाथो जनाधारो जगदीशो जनार्दनः । जाह्नवीधृग्जगत्कर्ता जगन्मयो जनाधिपः ॥
    ९४॥ जीवो जीवप्रदाता च जेताऽथो जीवनप्रदः । जङ्गमश्च जगद्धाता जगत्केनप्रपूजितः ॥ ९५॥ जटाधरो जटाजूटी
    जटिलो जलरूपधृक् । जालन्धरशिरश्छेत्ता जलजाङ्घ्रिर्जगत्पतिः ॥ ९६॥ जनत्राता जगन्निधिर्जटेश्वरो जलेश्वरः
    । झर्झरो झरणाकारी झूञ्झकृत् झूझहा झरः ॥ ९७॥ ञकारश्च ञमुवासी ञजनप्रियकारकः । टकारश्च ठकारश्च डामरो
    डमरुप्रियः ॥ ९८॥ डण्डधृग्डमरुहस्तो डाकिहृड्डमकेश्वरः । ढुण्ढो ढुण्ढेश्वरो ढक्को ढक्कानादप्रियः सदा
    ॥ ९९॥ णकारो णस्वरूपश्च णुणोणिणोणकारणः । तन्त्रज्ञस्त्र्यम्बकस्तन्त्रीतुम्बुरुस्तुलसीप्रियः ॥ १००॥
    तूणीरधृक् तदाकारस्ताण्डवी ताण्डवेश्वरः । तत्त्वज्ञस्तत्त्वरूपश्च तात्त्विकस्तरविप्रभः ॥ १०१॥ त्रिनेत्रस्तरुणस्तत्त्वस्तकारस्तलवासकृत्
    । तेजस्वी तेजोरूपी च तेजःपुञ्जप्रकाशकः ॥ १०२॥ तान्त्रिकस्तन्त्रकर्ता च तन्त्रविद्याप्रकाशकः । ताम्ररूपस्तदाकारस्तत्त्वदस्तरणिप्रियः
    ॥ १०३॥ तान्त्रेयस्तमोहा तन्वी तामसस्तामसापहा । ताम्रस्ताम्रप्रदाता च ताम्रवर्णस्तरुप्रियः ॥ १०४॥ तपस्वी
    तापसी तेजस्तेजोरूपस्तलप्रियः । तिलस्तिलप्रदाता च तूलस्तूलप्रदायकः ॥ १०५॥ तापीशस्ताम्रपर्णीशस्तिलकस्त्राणकारकः
    । त्रिपुरघ्नस्त्रयातीतस्त्रिलोचनस्त्रिलोकपः ॥ १०६॥ त्रिविष्टपेश्वरस्तेजस्त्रिपुरस्त्रिपुरदाहकः । तीर्थस्तारापतिस्त्राता
    ताडिकेशस्तडिज्जवः ॥ १०७॥ थकारश्च स्थुलाकारः स्थूलः स्थविरः स्थानदः । स्थाणुः स्थायी स्थावरेशः स्थम्भः
    स्थावरपीडहा ॥ १०८॥ स्थूलरूपस्थितेः कर्ता स्थूलदुःखविनाशनः । थन्दिलस्थदलः स्थाल्यः स्थलकृत् स्थलभृत्
    स्थली ॥ १०९॥ स्थलेश्वरः स्थलाकारः स्थलाग्रजः स्थलेश्वरः । दक्षो दक्षहरो द्रव्यो दुन्दुभिर्वरदायकः
    ॥ ११०॥ देवो देवाग्रजो दानो दानवारिर्दिनेश्वरः । देवकृद्देवभृद्दाता दयारूपी दिवस्पतिः ॥ १११॥ दामोदरो
    दलाधारो दुग्धस्नायी दधिप्रियः । देवराजो दिवानाथो देवज्ञो देवताप्रियः ॥ ११२॥ देवदेवो दानरूपो दूर्वादलप्रियः
    सदा । दिग्वासा दरभो दन्तो दरिद्रघ्नो दिगम्बरः ॥ ११३॥ दीनबन्धुर्दुराराध्यो दुरन्तो दुष्टदर्पहा । दक्षघ्नो
    दक्षहन्ता च दक्षजामात देवजित् ॥ ११४॥ द्वन्द्वहा दुःखहा दोग्धा दुर्धरो दुर्धरेश्वरः । दानाप्तो दानभृद्दीप्तदीप्तिर्दिव्यो
    दिवाकरः ॥ ११५॥ दम्भहा दम्भकृद्दम्भी दक्षजापतिर्दीप्तिमान् । धन्वी धनुर्धरो धीरो धान्यकृद्धान्यदायकः
    ॥ ११६॥ धर्माधर्मभृतो धन्यो धर्ममूर्तिर्धनेश्वरः । धनदो धूर्जटिर्धान्यो धामदो धार्मिको धनी ॥ ११७॥ धर्मराजो
    धनाधारो धराधरो धरापतिः । धनुर्विद्याधरो धूर्तो धूलिधूसरविग्रहः ॥ ११८॥ धनुषो धनुषाकारो धनुर्धरभृतांवरः
    । धरानाथो धराधीशो धनेशो धनदाग्रजः ॥ ११९॥ धर्मभृद्धर्मसन्त्राता धर्मरक्षो धनाकरः । नर्मदो नर्मदाजातो
    नर्मदेशो नृपेश्वरः ॥ १२०॥ नागभृन्नागलोकेशो नागभूषणभूषितः । नागयज्ञोपवीतेयो नगो नागारिपूजितः ॥ १२१॥
    नान्यो नरवरो नेमो नूपुरो नूपुरेश्वरः । नागचण्डेश्वरो नागो नगनाथो नगेश्वरः ॥ १२२॥ नीलगङ्गाप्रियो नादो
    नवनाथो नगाधिपः । पृथुकेशः प्रयागेशः पत्तनेशः पराशरः ॥ १२३॥ पुष्पदन्तेश्वरः पुष्पः पिङ्गलेश्वरपूर्वजः
    । पिशाचेशः पन्नगेशः पशुपतीश्वरः प्रियः ॥ १२४॥ पार्वतीपूजितः प्राणः प्राणेशः पापनाशनः । पार्वतीप्राणनाथश्च
    प्राणभृत् प्राणजीवनः ॥ १२५॥ पुराणपुरुषः प्राज्ञः प्रेमज्ञः पार्वतीपतिः । पुष्करः पुष्कराधीशः पात्रः
    पात्रैः प्रपूजितः ॥ १२६॥ पुत्रदः पुण्यदः पूर्णः पाटाम्बरविभूषितः । पद्माक्षः पद्मस्रग्धारी पद्मेन
    परिशोभितः ॥ १२७॥ फणिभृत् फणिनाथश्च फेनिकाभक्षकारकः । स्फटिकः फर्शुधारी च स्फटिकाभो फलप्रदः ॥ १२८॥
    बद्रीशो बलरूपश्च बहुभोजी बटुर्बटुः । बालखिल्यार्चितो बालो ब्रह्मेशो ब्राह्मणार्चितः ॥ १२९॥ ब्राह्मणो
    ब्रह्महा ब्रह्मा ब्रह्मज्ञो ब्राह्मणप्रियः । ब्राह्मणस्थो ब्रह्मरूपो ब्राह्मणपरिपालकः ॥ १३०॥ ब्रह्ममूर्तिर्ब्रह्मस्वामी
    ब्राह्मणैः परिशोभितः । ब्राह्मणारिहरो ब्रह्म ब्राह्मणास्यैः प्रतर्पितः ॥ १३१॥ भूतेशो भूतनाथश्च भस्माङ्गो
    भीमविक्रमः । भीमो भवहरो भव्यो भैरवो भयभञ्जनः ॥ १३२॥ भूतिदो भुवनाधारो भुवनेशो भृगुर्भवः । भारतीशो भुजङ्गेशो
    भास्करो भिन्दिपालधृक् ॥ १३३॥ भूतो भयहरो भानुर्भावनो भवनाशनः । सहस्रनामभिश्चैतैर्महाकालः प्रसीदतु ॥
    १३४॥ अथ महाकालसहस्रनाममाहात्म्यम् । सूत उवाच
