id: ashtadikpalakastotram
category: stotram
name:
  english: ashtadikpalakastotram
  devanagari: अष्टदिक्पालकस्तोत्रम्
content:
  english: vrishabharudham trishulam vyaladharinam | sharaccandrasamakaram trinetram nilakanthakam ||
    8|| iti ashtadikpalakastotram sampurnam |
  devanagari: वृषभारूढं त्रिशूलं व्यालधारिणम् । शरच्चन्द्रसमाकारं त्रिनेत्रं नीलकण्ठकम् ॥ ८॥ इति अष्टदिक्पालकस्तोत्रं
    सम्पूर्णम् ।
meaning: {}
