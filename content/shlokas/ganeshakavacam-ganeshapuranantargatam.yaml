id: ganeshakavacam-ganeshapuranantargatam
category: kavacha
name:
  english: ganeshakavacam (ganeshapuranantargatam)
  devanagari: गणेशकवचम् (गणेशपुराणान्तर्गतम्)
content:
  english: agre kim karma karteti na jane munisattama || 1|| daitya nanavidha dushtah sadhudevadruhah
    khalah | ato'sya kanthe kincittvam rakshartham baddhamarhasi || 2|| muniruvaca | dhyayetsimhahatam
    vinayakamamum digbahumadye yuge tretayam tu mayuravahanamamum shadbahukam siddhidam | dvapare tu gajananam
    yugabhujam raktangaragam vibhum turye tu dvibhujam sitangaruciram sarvarthadam sarvada || 3|| vinayakah
    shikham patu paramatma paratparah | atisundarakayastu mastakam sumahotkatah || 4|| lalatam kashyapah
    patu bhriyugam tu mahodarah | nayane bhalacandrastu gajasyastvoshthapallavau || 5|| jihvam patu ganakridashcibukam
    girijasutah | vacam vinayakah patu dantan rakshatu vighnaha || 6|| shravanau pashapanistu nasikam
    cintitarthadah | ganeshastu mukham kantham patu devo gananjayah || 7|| skandhau patu gajaskandhah
    stanau vighnavinashanah | hridayam gananathastu herambo jatharam mahan || 8|| dharadharah patu parshvau
    prishtham vighnaharah shubhah | lingam guhyam sada patu vakratundo mahabalah || 9|| ganakrido janusanghe
    uru mangalamurtiman | ekadanto mahabuddhih padau gulphau sada'vatu || 10|| kshipraprasadano bahu pani
    ashaprapurakah | angulishca nakhanpatu padmahasto'rinashanah || 11|| sarvangani mayuresho vishvavyapi
    sada'vatu | anuktamapi yatsthanam dhumraketuh sada'vatu || 12|| amodastvagratah patu pramodah prishthato'vatu
    | pracyam rakshatu buddhisha agneyam siddhidayakah ||13|| dakshinasyamumaputro nairrityam tu ganeshvarah
    | praticyam vighnaharta'vyadvayavyam gajakarnakah || 14|| kauberyam nidhipah payadishanyamishanandanah
    | diva'vyadekadantastu ratrau sandhyasu vighnahrit || 15|| rakshasasuravetalagrahabhutapishacatah
    | pashankushadharah patu rajahsattvatamah smritih || 16|| jnanam dharmam ca lakshmim ca lajjam kirti
    tatha kulam | vapurdhanam ca dhanyam ca grihandaransutansakhin || 17|| sarvayudhadharah pautran mayuresho'vatatsada
    | kapilo'jadikam patu gajashvanvikato'vatu || 18|| bhurjapatre likhitvedam yah kanthe dharayetsudhih
    | na bhayam jayate tasya yaksharakshahpishacatah || 18|| trisandhyam japate yastu vajrasaratanurbhavet
    | yatrakale pathedyastu nirvighnena phalam labhet || 20|| yuddhakale pathedyastu vijayam capnuyaddrutam
    | maranoccatakakarshastambhamohanakarmani || 21|| saptavaram japedetaddinanamekavimshatim | tattatphalavapnoti
    sadhako natrasamshayah ||22|| ekavimshativaram ca pathettavaddinani yah | karagrihagatam sadyorajna
    vadhyam ca mocayet || 23|| rajadarshanavelayam pathedetattrivaratah | sa rajasam vasham nitva prakritishca
    sabham jayet || 24|| idam ganeshakavacam kashyapena samiritam | mudgalaya ca te natha mandavyaya maharshaye
    || 25|| mahyam sa praha kripaya kavacam sarvasiddhidam | na deyam bhaktihinaya deyam shraddhavate
    shubham || 26||
  devanagari: अग्रे किं कर्म कर्तेति न जाने मुनिसत्तम ॥ १॥ दैत्या नानाविधा दुष्टाः साधुदेवद्रुहः खलाः
    । अतोऽस्य कण्ठे किञ्चित्त्वं रक्षार्थं बद्धमर्हसि ॥ २॥ मुनिरुवाच । ध्यायेत्सिंहहतं विनायकममुं दिग्बाहुमाद्ये
    युगे त्रेतायां तु मयूरवाहनममुं षड्बाहुकं सिद्धिदम् । द्वापारे तु गजाननं युगभुजं रक्ताङ्गरागं विभुम्
    तुर्ये तु द्विभुजं सिताङ्गरुचिरं सर्वार्थदं सर्वदा ॥ ३॥ विनायकः शिखां पातु परमात्मा परात्परः । अतिसुन्दरकायस्तु
    मस्तकं सुमहोत्कटः ॥ ४॥ ललाटं कश्यपः पातु भृयुगं तु महोदरः । नयने भालचन्द्रस्तु गजास्यस्त्वोष्ठपल्लवौ
    ॥ ५॥ जिह्वां पातु गणक्रीडश्चिबुकं गिरिजासुतः । वाचं विनायकः पातु दन्तान् रक्षतु विघ्नहा ॥ ६॥ श्रवणौ
    पाशपाणिस्तु नासिकां चिन्तितार्थदः । गणेशस्तु मुखं कण्ठं पातु देवो गणञ्जयः ॥ ७॥ स्कन्धौ पातु गजस्कन्धः
    स्तनौ विघ्नविनाशनः । हृदयं गणनाथस्तु हेरंबो जठरं महान् ॥ ८॥ धराधरः पातु पार्श्वौ पृष्ठं विघ्नहरः शुभः
    । लिङ्गं गुह्यं सदा पातु वक्रतुण्डो महाबलः ॥ ९॥ गणक्रीडो जानुसङ्घे ऊरु मङ्गलमूर्तिमान् । एकदन्तो महाबुद्धिः
    पादौ गुल्फौ सदाऽवतु ॥ १०॥ क्षिप्रप्रसादनो बाहू पाणी आशाप्रपूरकः । अङ्गुलीश्च नखान्पातु पद्महस्तोऽरिनाशनः
    ॥ ११॥ सर्वाङ्गानि मयूरेशो विश्वव्यापी सदाऽवतु । अनुक्तमपि यत्स्थानं धूम्रकेतुः सदाऽवतु ॥ १२॥ आमोदस्त्वग्रतः
    पातु प्रमोदः पृष्ठतोऽवतु । प्राच्यां रक्षतु बुद्धीश आग्नेयां सिद्धिदायकः ॥१३॥ दक्षिणास्यामुमापुत्रो
    नैरृत्यां तु गणेश्वरः । प्रतीच्यां विघ्नहर्ताऽव्याद्वायव्यां गजकर्णकः ॥ १४॥ कौबेर्यां निधिपः पायादीशान्यामीशनन्दनः
    । दिवाऽव्यादेकदन्तस्तु रात्रौ सन्ध्यासु विघ्नहृत् ॥ १५॥ राक्षसासुरवेतालग्रहभूतपिशाचतः । पाशाङ्कुशधरः
    पातु रजःसत्त्वतमः स्मृतिः ॥ १६॥ ज्ञानं धर्मं च लक्ष्मीं च लज्जां कीर्ति तथा कुलम् । वपुर्धनं च धान्यं
    च गृहान्दारान्सुतान्सखीन् ॥ १७॥ सर्वायुधधरः पौत्रान् मयूरेशोऽवतात्सदा । कपिलोऽजादिकं पातु गजाश्वान्विकटोऽवतु
    ॥ १८॥ भूर्जपत्रे लिखित्वेदं यः कण्ठे धारयेत्सुधीः । न भयं जायते तस्य यक्षरक्षःपिशाचतः ॥ १८॥ त्रिसन्ध्यं
    जपते यस्तु वज्रसारतनुर्भवेत् । यात्राकाले पठेद्यस्तु निर्विघ्नेन फलं लभेत् ॥ २०॥ युद्धकाले पठेद्यस्तु
    विजयं चाप्नुयाद्द्रुतम् । मारणोच्चाटकाकर्षस्तम्भमोहनकर्मणि ॥ २१॥ सप्तवारं जपेदेतद्दिनानामेकविंशतिम्
    । तत्तत्फलवाप्नोति साधको नात्रसंशयः ॥२२॥ एकविंशतिवारं च पठेत्तावद्दिनानि यः । कारागृहगतं सद्योराज्ञा
    वध्यं च मोचयेत् ॥ २३॥ राजदर्शनवेलायां पठेदेतत्त्रिवारतः । स राजसं वशं नीत्वा प्रकृतीश्च सभां जयेत्
    ॥ २४॥ इदं गणेशकवचं कश्यपेन समीरितम् । मुद्गलाय च ते नाथ माण्डव्याय महर्षये ॥ २५॥ मह्यं स प्राह कृपया
    कवचं सर्वसिद्धिदम् । न देयं भक्तिहीनाय देयं श्रद्धावते शुभम् ॥ २६॥
