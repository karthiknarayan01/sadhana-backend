id: brahma-sutra-9
category: sahasranama
name:
  english: brahma sutra
  devanagari: ब्रह्म सूत्र
content:
  english: 29|| iti shrimatkrishnadvaipayanakritabrahmasutreshu prathamadhyayasya caturthah padah samaptah
    || iti prathamo'dhyayah|| || atha dvitiyo'dhyayah|| om smrityanavakashadoshaprasanga iti cennanyasmrityanavakashadoshaprasangat
    om || 2
  devanagari: २९॥ इति श्रीमत्कृष्णद्वैपायनकृतब्रह्मसूत्रेषु प्रथमाध्यायस्य चतुर्थः पादः समाप्तः ॥ इति
    प्रथमोऽध्यायः॥ ॥ अथ द्वितीयोऽध्यायः॥ ॐ स्मृत्यनवकाशदोषप्रसङ्ग इति चेन्नान्यस्मृत्यनवकाशदोषप्रसङ्गात्
    ॐ ॥ २
meaning: {}
