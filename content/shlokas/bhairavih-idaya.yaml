id: bhairavih-idaya
category: hridaya
name:
  english: bhairavihṟidaya
  devanagari: भैरवीह्ऱिदय
content:
  english: viniyogah || || atha karanyasah || om hrim angushthabhyam namah | om shrim tarjanibhyam namah
    | om aim madhyamabhyam namah | om hrim anamikabhyam namah | om shrim kanishthikabhyam namah | om aim
    karatalakaraprishthabhyam namah || || iti karanyasah || || atha hridayadishadanganyasah || om hrim
    hridayaya namah | om shrim shirase svaha | om aim shikhayai vashat | om hrim kavacaya hum | om shrim
    netratrayaya vaushat | om aim astraya phat || || iti hridayadishadanganyasah || || atha dhyanam ||
    devairdhdye yantrinetramasuradalaghanaranyaroragnirupam raudrim raktambaradhyam ratighatighatitorojayugmograrupam
    | candrarddhabhrajibhavyabharanakaralasadbhalabimbambhavanim sindurapuritangim tribhuvanajananim bhairavim
    bhavayami || bhavabhramatsamastabhutavedamargadayini
  devanagari: विनियोगः ॥ ॥ अथ करन्यासः ॥ ॐ ह्रीं अङ्गुष्ठाभ्यां नमः । ॐ श्रीं तर्जनीभ्यां नमः । ॐ ऐं मध्यमाभ्यां
    नमः । ॐ ह्रीं अनामिकाभ्यां नमः । ॐ श्रीं कनिष्ठिकाभ्यां नमः । ॐ ऐं करतलकरपृष्ठाभ्यां नमः ॥ ॥ इति करन्यासः
    ॥ ॥ अथ हृदयादिषडङ्गन्यासः ॥ ॐ ह्रीं हृदयाय नमः । ॐ श्रीं शिरसे स्वाहा । ॐ ऐं शिखायै वषट् । ॐ ह्रीं
    कवचाय हुम् । ॐ श्रीं नेत्रत्रयाय वौषट् । ॐ ऐं अस्त्राय फट् ॥ ॥ इति हृदयादिषडङ्गन्यासः ॥ ॥ अथ ध्यानम्
    ॥ देवैर्ध्द्ये यान्त्रिनेत्रामसुरदलघनारण्यरोराग्निरूपां रौद्रीं रक्ताम्बराढ्यां रतिघटिघटितोरोजयुग्मोग्ररूपाम्
    । चन्द्रार्द्धभ्राजिभव्याभरणकरलसद्भालबिम्बाम्भवानीं सिन्दूरापूरिताङ्गीं त्रिभुवनजननीं भैरवीं भावयामि
    ॥ भवभ्रमत्समस्तभूतवेदमार्गदायिनी
