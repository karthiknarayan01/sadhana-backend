    dyaushca dishashcavantaradishashca sa vai sarvamida njagathsa sabhutagm sa bhavya njijnasa klripta
    ritaja rayishtha shraddha satyo mahasva ntapaso parishthad mmanasa hrida ca bhuyo na mrityu rvasuranvo
    vibhurasi prane tvamasi sandhata brahma ntvamasi vishvadhritte jodas tvamasyagni stvamasi suryasya
    dyumnoda stvamasi candramasa upayamagrihito yu~njitaitadvai mahopanishada ve~da brahmano mahimana
    dbrahmano mahimana vi~dusho yajnasyatma yajamanah shradhdapatni sharira rdamah shamayita dakshina
    prana udgata cakshuradhvaryu rmano brahma shrotramagni dhyavadhdriyate sa diksha yadashrnati tadhdavi
    ryatpibati tadasya somapanam ya~dramate tadupasado ya tyuttishthate ca sapravargyo yanmukha ntadahavaniyo
    ya vyahriti ntajjuhoti yathsaya mprataratti tathsamidham rmaddhyandinagm saya nca tani savanani ye
    ahoratre te dar shca te caturmasyani ya ritavaste pashubandha ye sam va~thsarashca parivathsarashca
    te ntadavabhritha etadvai jaramarya magnihotragm satram nudagayane pramiyate devanameva mahimana ''dityasya
    sayujya ngacchatyatha yo dakshine pramiyate pitrina ngatva candramasa ssayujyagm salokata dbrahmano
    mahimanamapnoti tasma dbrahmano mahimana saha na vavatu | saha nau bhunaktu | saha virya nkaravavahai
    | tejasvina vadhitamastu ma vidvishavahai shshantih || harih om | iti mahanarayanopanisha ambhasyaikapancashacchatam
    jatavedase caturdasha pahi catvari catvari yatha vrikshasyaika meka manoraniyag shcatustrigmshath
    sahasrashishagm shatvigmshati adityo vai teja ekamekam nidhanapataye trayovigmshatih statpurushaya
    dve dve namo hiranyabahava ekameka kadrudraya trini rapo va idagm sarva mekameka mapah punantu catva
    brahma devanamidam vi~rahatyamekanna vigmshati rekannavigmshati mma indrashcatvari catvarya tilah
    krinshashcorasya shrih prajnatu jataveda ktvak chira uttishtha purusha panca prithivi shabda mano
    vag vyakta 'ntaratma paramatma me gnaye svahaikacatvarigmsha mprane nivishta shcaturvigmshatih ngushtha
    matrah purusho dve ngranthirasi dve dve tvamagne dyubhir dve shivena me santishthasva stasyaiva meka
    meka mashatih
