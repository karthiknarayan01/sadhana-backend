id: lakshmanasahasranamastotrambhushundiramayana
category: sahasranama
name:
  english: lakshmanasahasranamastotrambhushundiramayana
  devanagari: लक्ष्मणसहस्रनामस्तोत्रम्भुशुण्डीरामायण
content:
  english: pranahanano umapatirumanatha umasevanatatparah || 61|| vanaravratamadhyastho jambuvadganasastutah
    | jambuvadbhaktasukhado jamburjambumatisakhah || 62|| jambuvadbhaktivashyashca jambunadaparishkritah
    | kotikalpasmritivyagro varishtho varaniyabhah || 63|| shriramacaranotsangamadhyalalitamastakah |
    sitacaranasamsparshavinitadhvamahashramah || 64|| samudradvipacari ca ramakainkaryasadhakah | keshaprasadhanamarshi
    mahavrataparayanah || 65|| rajasvalo'timalino'vadhuto dhutapatakah | putanama pavitrango gangajalasupavanah
    || 66|| hayashirshamahamantravipashcinmantrikottamah | vishajvaranihanta ca kalakrityavinashanah ||
    67|| madoddhato mahayano kalindipatabhedanah | kalindibhayadata ca khatvangi mukharo'nalah || 68||
    talankah karmavikhyatirdharitribharadharakah | maniman kritiman dipto baddhakaksho mahatanuh || 69||
    uttungo girisamsthano ramamahatmyavarddhanah | kirtiman shrutikirtishca lankavijayamantradah || 70||
    lankadhinathavishaho vibhishanagatipradah | mandodarikritashcaryo rakshasishataghatakah || 71|| kadalivananirmata
    dakshinapathapavanah | kritapratijno balavan sushrih santoshasagarah || 72|| kapardi rudradurdarsho
    virupavadanakritih | ranoddhuro ranaprashni ranaghantavalambanah || 73|| kshudraghantanadakatih kathinango
    vikasvarah | vajrasarah saradharah sharngi varunasamstutah || 74|| samudralanghanodyogi ramanamanubhavavit
    | dharmajushto ghrinisprishto varmi varmabharakulah || 75|| dharmayajo dharmadaksho dharmapathavidhanavit
    | ratnavastro ratnadhautro ratnakaupinadharakah || 76|| lakshmano ramasarvasvam ramapranayavihvalah
    | sabalo'pi sudamapi susakha madhumangalah || 77|| ramarasavinodajno ramarasavidhanavit | ramarasakritotsaho
    ramarasasahayan || 78|| vasantotsavanirmata sharatkalavidhayakah | ramakelibharanandi durotsaritakantakah
    || 79|| itidam tava putrasya dvitiyasya mahatmanah | yah pathennamasahasram sa yati paramam padam
    || 80|| pidayam vapi sangrame mahabhaya upasthite | yah pathennamasahasram lakshmanasya mahau medhaya
    | sa sadyah shubhamapnoti lakshmanasya prasadatah || 81|| sarvan durgan taratyashu lakshmanetyekanamatah
    | dvitiyanamojvarena devam vashayati dhruvam || 82|| pathitva namasahasram shatavritya samahitah |
    pratinamahutim datva kumaran bhojayeddasha || 83|| sarvan kamanavapnoti ramanujakripavashat | lakshmaneti
    trivargasya mahima kena varnyate || 84|| yacchrutva janakijanerhadi modo vivarddhate | yatha ramastatha
    lakshmiryatha shrirlakshmanastatha || 85||
  devanagari: प्रानहननो उमापतिरुमानाथ उमासेवनतत्परः ॥ ६१॥ वानरव्रातमध्यस्थो जाम्बुवद्गणसस्तुतः । जाम्बुवद्भक्तसुखदो
    जाम्बुर्जाम्बुमतीसखः ॥ ६२॥ जाम्बुवद्भक्तिवश्यश्च जाम्बूनदपरिष्कृतः । कोटिकल्पस्मृतिव्यग्रो वरिष्ठो
    वरणीयभाः ॥ ६३॥ श्रीरामचरणोत्सङ्गमध्यलालितमस्तकः । सीताचरणसंस्पर्शविनीताध्वमहाश्रमः ॥ ६४॥ समुद्रद्वीपचारी
    च रामकैङ्कर्यसाधकः । केशप्रसाधनामर्षी महाव्रतपरायणः ॥ ६५॥ रजस्वलोऽतिमलिनोऽवधूतो धूतपातकः । पूतनामा
    पवित्राङ्गो गङ्गाजलसुपावनः ॥ ६६॥ हयशीर्षमहामन्त्रविपश्चिन्मन्त्रिकोत्तमः । विषज्वरनिहन्ता च कालकृत्याविनाशनः
    ॥ ६७॥ मदोद्धतो महायानो कालिन्दीपातभेदनः । कालिन्दीभयदाता च खट्वाङ्गी मुखरोऽनलः ॥ ६८॥ तालाङ्कः कर्मविख्यातिर्धरित्रीभरधारकः
    । मणिमान् कृतिमान् दीप्तो बद्धकक्षो महातनुः ॥ ६९॥ उत्तुङ्गो गिरिसंस्थानो राममाहात्म्यवर्द्धनः । कीर्तिमान्
    श्रुतिकीर्तिश्च लङ्काविजयमन्त्रदः ॥ ७०॥ लङ्काधिनाथविषहो विभीषणगतिप्रदः । मन्दोदरीकृताश्चर्यो राक्षसीशतघातकः
    ॥ ७१॥ कदलीवननिर्माता दक्षिणापथपावनः । कृतप्रतिज्ञो बलवान् सुश्रीः सन्तोषसागरः ॥ ७२॥ कपर्दी रुद्रदुर्दर्शो
    विरूपवदनाकृतिः । रणोद्धुरो रणप्रश्नी रणघण्टावलम्बनः ॥ ७३॥ क्षुद्रघण्टानादकटिः कठिनाङ्गो विकस्वरः ।
    वज्रसारः सारधरः शार्ङ्गी वरुणसंस्तुतः ॥ ७४॥ समुद्रलङ्घनोद्योगी रामनामानुभाववित् । धर्मजुष्टो घृणिस्पृष्टो
    वर्मी वर्मभराकुलः ॥ ७५॥ धर्मयाजो धर्मदक्षो धर्मपाठविधानवित् । रत्नवस्त्रो रत्नधौत्रो रत्नकौपीनधारकः
    ॥ ७६॥ लक्ष्मणो रामसर्वस्वं रामप्रणयविह्वलः । सबलोऽपि सुदामापि सुसखा मधुमङ्गलः ॥ ७७॥ रामरासविनोदज्ञो
    रामरासविधानवित् । रामरासकृतोत्साहो रामराससहायान् ॥ ७८॥ वसन्तोत्सवनिर्माता शरत्कालविधायकः । रामकेलीभरानन्दी
    दूरोत्सारितकण्टकः ॥ ७९॥ इतीदं तव पुत्रस्य द्वितीयस्य महात्मनः । यः पठेन्नामसाहस्रं स याति परमं पदम्
    ॥ ८०॥ पीडायां वापि सङ्ग्रामे महाभय उपस्थिते । यः पठेन्नामसाहस्रं लक्ष्मणस्य महौ मेधय । स सद्यः शुभमाप्नोति
    लक्ष्मणस्य प्रसादतः ॥ ८१॥ सर्वान् दुर्गान् तरत्याशु लक्ष्मणेत्येकनामतः । द्वितीयनामोज्वारेण देवं वशयति
    ध्रुवम् ॥ ८२॥ पठित्वा नामसाहस्रं शतावृत्या समाहितः । प्रतिनामाहुतिं दत्वा कुमारान् भोजयेद्दश ॥ ८३॥
    सर्वान् कामानवाप्नोति रामानुजकृपावशात् । लक्ष्मणेति त्रिवर्गस्य महिमा केन वर्ण्यते ॥ ८४॥ यच्छ्रुत्वा
    जानकीजानेर्हदि मोदो विवर्द्धते । यथा रामस्तथा लक्ष्मीर्यथा श्रीर्लक्ष्मणस्तथा ॥ ८५॥
