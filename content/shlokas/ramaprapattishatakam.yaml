id: ramaprapattishatakam
category: shataka
name:
  english: ramaprapattishatakam
  devanagari: रामप्रपत्तिशतकम्
content:
  english: rabhyarthito nikhilarakshasanashanaya | tebhyastatheti dayaya vidadhe pratijnam tam ramamartiharanam
    sharanam bhajami || 31|| yo yatudhananidhane vidhritapratijnah kalam vyapekshya nivasan varapancavatyam
    | mitram jatayushamavapya tutosha kamam tam ramamartiharanam sharanam bhajami || 32|| yo durmatim
    jhatiti shurpanakham vibhikam svasmin sagarbhakaracurnitakarnanasam | kritva mumoca dayaya vipine
    sajivam tam ramamartiharanam sharanam bhajami || 33|| yo dushanatrishirasau ca kharam tadiyam sainyam
    caturdashagunoktasahasrasankhyam | eko nihatya mumude sahasa jayena tam ramamartiharanam sharanam
    bhajami || 34|| yah panktikandharahritam mrigayan svakantam tasyah krite khagapatim pathi muktajivam
    | dagdhva svatatavadamushya dadau ca muktim tam ramamartiharanam sharanam bhajami || 35|| yo bhakshitum
    svamanujam ca kritaprayatnam dagdhva kabandhamapi yojanadirghabahum | shrutva taduktashabaricarito
    nananda tam ramamartiharanam sharanam bhajami || 36|| yastapasim sasahajah shabarimupetya tatkalpitapracurapujanalabdhaharshah
    | tadbhuktasheshaphalabhuk pramumoda kamam tam ramamartiharanam sharanam bhajami || 37|| yo vyadhayoshidabhisucitamaitrapatram
    sugrivameva mrigayan samupetya pampam | tatranjaneyamabhigrihya nananda gadham tam ramamartiharanam
    sharanam bhajami || 38|| yo vayusunughatitatulamaitrahrishta sugrivadattanijadaravibhushanani | drishtva
    tutosha ramanimiva vikshya sakshat tam ramamartiharanam sharanam bhajami || 39|| yo mitraputrakathitagrajavairaduhkha
  devanagari: रभ्यर्थितो निखिलराक्षसनाशनाय । तेभ्यस्तथेति दयया विदधे प्रतिज्ञां तं राममार्तिहरणं शरणं
    भजामि ॥ ३१॥ यो यातुधाननिधने विधृतप्रतिज्ञः कालं व्यपेक्ष्य निवसन् वरपञ्चवट्याम् । मित्रं जटायुषमवाप्य
    तुतोष कामं तं राममार्तिहरणं शरणं भजामि ॥ ३२॥ यो दुर्मतिं झटिति शूर्पणखां विभीकां स्वस्मिन् सगर्भकरचूर्णितकर्णनासाम्
    । कृत्वा मुमोच दयया विपिने सजीवां तं राममार्तिहरणं शरणं भजामि ॥ ३३॥ यो दूषणत्रिशिरसौ च खरं तदीयं सैन्यं
    चतुर्दशगुणोक्तसहस्रसङ्ख्यम् । एको निहत्य मुमुदे सहसा जयेन तं राममार्तिहरणं शरणं भजामि ॥ ३४॥ यः पङ्क्तिकन्धरहृतां
    मृगयन् स्वकान्तां तस्याः कृते खगपतिं पथि मुक्तजीवम् । दग्ध्वा स्वतातवदमुष्य ददौ च मुक्तिं तं राममार्तिहरणं
    शरणं भजामि ॥ ३५॥ यो भक्षितुं स्वमनुजं च कृतप्रयत्नं दग्ध्वा कबन्धमपि योजनदीर्घबाहुम् । श्रुत्वा तदुक्तशबरीचरितो
    ननन्द तं राममार्तिहरणं शरणं भजामि ॥ ३६॥ यस्तापसीं ससहजः शबरीमुपेत्य तत्कल्पितप्रचुरपूजनलब्धहर्षः ।
    तद्भुक्तशेषफलभुक् प्रमुमोद कामं तं राममार्तिहरणं शरणं भजामि ॥ ३७॥ यो व्याधयोषिदभिसूचितमैत्रपात्रं
    सुग्रीवमेव मृगयन् समुपेत्य पम्पाम् । तत्राञ्जनेयमभिगृह्य ननन्द गाढं तं राममार्तिहरणं शरणं भजामि ॥
    ३८॥ यो वायुसूनुघटितातुलमैत्रहृष्ट सुग्रीवदत्तनिजदारविभूषणानि । दृष्ट्वा तुतोष रमणीमिव वीक्ष्य साक्षात्
    तं राममार्तिहरणं शरणं भजामि ॥ ३९॥ यो मित्रपुत्रकथिताग्रजवैरदुःख
