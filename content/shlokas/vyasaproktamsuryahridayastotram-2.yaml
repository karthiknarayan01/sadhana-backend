id: vyasaproktamsuryahridayastotram-2
category: hridaya
name:
  english: vyasaproktamsuryahridayastotram
  devanagari: व्यासप्रोक्तंसूर्यहृदयस्तोत्रम्
content:
  english: vyasaproktam suryahridayastotram vyasa uvaca | athopatishthedadityamudayantam samahitah | mantraistu
    vividhaih saurai rigyajuhsamasambhavaih || 1|| upasthaya mahayogam devadevam divakaram | kurvita pranatim
    bhumau murdhna tenaiva mantratah || 2|| om nkhadyotaya ca shantaya karanatrayahetave | nivedayami
    catmanam namaste jnanarupine || 3|| namaste ghrinine tubhyam suryaya brahmarupine | tvameva brahma
    paramamapo jyoti raso'mritam | bhurbhuvahsvastvamonkarah sharvarudrah sanatanah || 4|| purushah sanmaho'ntastham
    pranamami kapardinam | tvameva vishvam bahudha jata yajjayate ca yat | namo rudraya suryaya tvamaham
    sharanam gatah || 5|| pracetase namastubhyam namo midhushtamaya te | namo namaste rudraya tvamaham
    sharanam gatah | hiranyabahave tubhyam hiranyapataye namah || 6|| ambikapataye tubhyamumayah pataye
    namah | namo'stu nilagrivaya namastubhyam pinakine || 7|| vilohitaya bhargaya sahasrakshaya te namah
    | namo hamsaya te nityamadityaya namo'stu te || 8|| namaste vajrahastaya tryambakaya namo namah |
    prapadye tvam virupaksham mahantam parameshvaram || 9|| hiranmaye grihe guptamatmanam sarvadehinam
    | namasyami param jyotirbrahmanam tvam param gatim || 10|| vishvam pashupatim bhimam naranarisharirinam
    | namah suryaya rudraya bhasvate parameshthine || 11|| ugraya sarvabhakshaya tvam prapadye sadaiva
    hi | etadvai suryahridayam japtva stavamanuttamam || 12|| pratah kale'tha madhyahne namaskuryaddivakaram
    | idam putraya shishyaya dharmikaya dvijataye || 13|| pradeyam suryahridayam brahmana tu pradarshitam
    | sarvapapaprashamanam vedasarasamudbhavam | brahmananam hitam punyamrishisanghairnishevitam || 14||
    athagamya griham viprah samacamya yathavidhi | prajvalya vihnim vidhivajjuhuyajjatavedasam || 15||
    ritvikputro'tha patni va shishyo va'pi sahodarah | prapyanujnam visheshena juhuyurva yatavidhi ||
    16|| pavitrapanih putatma shuklambaradharah shucih | ananyamanaso vahnim juhuyat samyatendriyah ||
    17|| iti kurmapurane uttarabhage ashtadashadhyayantargatam vyasaproktam suryahridayastotram samaptam
    | kurmapurane uttarabhage 18
  devanagari: व्यासप्रोक्तं सूर्यहृदयस्तोत्रम् व्यास उवाच । अथोपतिष्ठेदादित्यमुदयन्तं समाहितः । मन्त्रैस्तु
    विविधैः सौरै ऋग्यजुःसामसम्भवैः ॥ १॥ उपस्थाय महायोगं देवदेवं दिवाकरम् । कुर्वीत प्रणतिं भूमौ मूर्ध्ना
    तेनैव मन्त्रतः ॥ २॥ ॐ ङ्खद्योताय च शान्ताय कारणत्रयहेतवे । निवेदयामि चात्मानं नमस्ते ज्ञानरूपिणे ॥
    ३॥ नमस्ते घृणिने तुभ्यं सूर्याय ब्रह्मरूपिणे । त्वमेव ब्रह्म परममापो ज्योती रसोऽमृतम् । भूर्भुवःस्वस्त्वमोङ्कारः
    शर्वरुद्रः सनातनः ॥ ४॥ पुरुषः सन्महोऽन्तस्थं प्रणमामि कपर्दिनम् । त्वमेव विश्वं बहुधा जात यज्जायते
    च यत् । नमो रुद्राय सूर्याय त्वामहं शरणं गतः ॥ ५॥ प्रचेतसे नमस्तुभ्यं नमो मीढुष्टमाय ते । नमो नमस्ते
    रुद्राय त्वामहं शरणं गतः । हिरण्यबाहवे तुभ्यं हिरण्यपतये नमः ॥ ६॥ अम्बिकापतये तुभ्यमुमायाः पतये नमः
    । नमोऽस्तु नीलग्रीवाय नमस्तुभ्यं पिनाकिने ॥ ७॥ विलोहिताय भर्गाय सहस्राक्षाय ते नमः । नमो हंसाय ते
    नित्यमादित्याय नमोऽस्तु ते ॥ ८॥ नमस्ते वज्रहस्ताय त्र्यम्बकाय नमो नमः । प्रपद्ये त्वां विरूपाक्षं
    महान्तं परमेश्वरम् ॥ ९॥ हिरण्मये गृहे गुप्तमात्मानं सर्वदेहिनाम् । नमस्यामि परं ज्योतिर्ब्रह्माणं
    त्वां परां गतिम् ॥ १०॥ विश्वं पशुपतिं भीमं नरनारीशरीरिणम् । नमः सूर्याय रुद्राय भास्वते परमेष्ठिने
    ॥ ११॥ उग्राय सर्वभक्षाय त्वां प्रपद्ये सदैव हि । एतद्वै सूर्यहृदयं जप्त्वा स्तवमनुत्तमम् ॥ १२॥ प्रातः
    कालेऽथ मध्याह्ने नमस्कुर्याद्दिवाकरम् । इदं पुत्राय शिष्याय धार्मिकाय द्विजातये ॥ १३॥ प्रदेयं सूर्यहृदयं
    ब्रह्मणा तु प्रदर्शितम् । सर्वपापप्रशमनं वेदसारसमुद्भवम् । ब्राह्मणानां हितं पुण्यमृषिसङ्घैर्निषेवितम्
    ॥ १४॥ अथागम्य गृहं विप्रः समाचम्य यथाविधि । प्रज्वाल्य विह्निं विधिवज्जुहुयाज्जातवेदसम् ॥ १५॥ ऋत्विक्पुत्रोऽथ
    पत्नी वा शिष्यो वाऽपि सहोदरः । प्राप्यानुज्ञां विशेषेण जुहुयुर्वा यताविधि ॥ १६॥ पवित्रपाणिः पूतात्मा
    शुक्लाम्बरधरः शुचिः । अनन्यमानसो वह्निं जुहुयात् संयतेन्द्रियः ॥ १७॥ इति कूर्मपुराणे उत्तरभागे अष्टादशाध्यायान्तर्गतं
    व्यासप्रोक्तं सूर्यहृदयस्तोत्रं समाप्तम् । कूर्मपुराणे उत्तरभागे १८
