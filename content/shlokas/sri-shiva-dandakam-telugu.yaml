id: sri-shiva-dandakam-telugu
category: stotram
name:
  english: Sri Shiva Dandakam (Telugu)
content:
  english: shrikantha lokesha lokodbhavasthanasamharakari purari murari priya candradhari mahendradi brindarakanandasandohasandhayi
    punyasvarupa virupaksha dakshadhvaradhvamsaka deva nidaiva tattvambu bhedinci buddhim bradhanambu
    garmambu vijnana madhyatmayogambu sarva kriyakaranam bancu nanaprakarambul buddhimantul vicarincucun
    ninnu bhavintu rishana sarveshvara sharva sarvajna sarvatmaka nirvikalpa prabhava bhavanipati nivu
    lokatrayivartanambun mahivayukhatmagni somarkatoyambulam jesi kavinci samsaracakra kriyayantravahundavai
    tadideva mahadeva nityambu natyantayogasthitin nirmalajnanadipa prabhajala vidhvasta nissara samsara
    mayandhakarul jitakrodha ragadidoshul yatatmul yatindrul bhavatpada pankeruhadhyana piyusha dharanubhutin
    sadatriptulai nityulai ravya yabhavya sevyabhava bharga bhattaraka bhargavagastyakutsadi nanamunistotradattavadhana
    lalatekshanogragnibhasmikritananga bhasmanuliptanga gangadhara ni prasadambun sarvagirvanagandharvulun
    siddhasadhyoragendra surendradulun shashvataishvarya sampraptulai rishvara vishvakarta surabhyarcita
    naku nabhyarthitambul prasadimpu karunyamurti trilokaikanatha namaste namaste namah || iti shrimahabharate
    nannayya viracita shiva dandakam ||
  devanagari: श्रीकण्ठ लोकेश लोकोद्भवस्थानसंहारकारी पुरारी मुरारि प्रिया चन्द्रधारी महेन्द्रादि बृन्दारकानन्दसन्दोहसन्धायि
    पुण्यस्वरूपा विरूपाक्ष दक्षाध्वरध्वंसका देव नीदैव तत्त्वम्बु भेदिञ्चि बुद्धिं ब्रधानम्बु गर्मम्बु
    विज्ञान मध्यात्मयोगम्बु सर्व क्रियाकारणं बञ्चु नानाप्रकारम्बुल् बुद्धिमन्तुल् विचारिञ्चुचुन् निन्नु
    भाविन्तु रीशान सर्वेश्वरा शर्व सर्वज्ञ सर्वात्मका निर्विकल्प प्रभावा भवानीपती नीवु लोकत्रयीवर्तनम्बुन्
    महीवायुखात्माग्नि सोमार्कतोयम्बुलं जेसि काविञ्चि संसारचक्र क्रियायन्त्रवाहुण्डवै तादिदेवा महादेव नित्यम्बु
    नत्यन्तयोगस्थितिन् निर्मलज्ञानदीप प्रभाजाल विध्वस्त निस्सार संसार मायान्धकारुल् जितक्रोध रागादिदोषुल्
    यतात्मुल् यतीन्द्रुल् भवत्पाद पङ्केरुहध्यान पीयूष धारानुभूतिन् सदातृप्तुलै नित्युलै रव्य याभव्य सेव्याभवा
    भर्ग भट्टारका भार्गवागस्त्यकुत्सादि नानामुनिस्तोत्रदत्तावधाना ललाटेक्षणोग्राग्निभस्मीकृतानङ्ग भस्मानुलिप्ताङ्ग
    गङ्गाधरा नी प्रसादम्बुन् सर्वगीर्वाणगन्धर्वुलुन् सिद्धसाध्योरगेन्द्रा सुरेन्द्रादुलुन् शाश्वतैश्वर्य
    सम्प्राप्तुलै रीश्वरा विश्वकर्ता सुराभ्यर्चिता नाकु नभ्यर्थितम्बुल् प्रसादिम्पु कारुण्यमूर्ती त्रिलोकैकनाथा
    नमस्ते नमस्ते नमः ॥ इति श्रीमहाभारते नन्नय्य विरचित शिव दण्डकम् ॥
