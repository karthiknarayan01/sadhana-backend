id: hanumatkritam1ramastotram-12
category: stotram
name:
  english: hanumatkritam1ramastotram 12
  devanagari: हनुमत्कृतं१रामस्तोत्रम् १२
content:
  english: hanumatkritam 1 ramastotram 12 hanumanuvaca | namo ramaya haraye vishnave prabhavishnave |
    adidevaya devaya puranaya gadabhrite || 31|| vishtare pushpakam nityam nivishtaya mahatmane | prahrishtavanaranikajushtapadambujaya
    te || 32|| nishpishta rakshasendraya jagadishtavidhayine | namah sahasrashirase sahasracaranaya ca
    || 33|| sahasrakshaya shuddhaya raghavaya ca vishnave | bhaktartiharine tubhyam sitayah pataye namah
    || 34|| haraye narasimhaya daityarajavidarine | namastubhyam varahaya damshtroddhritavasundhara ||
    35|| trivikramaya bhavate baliyajnavibhedine | namo vamanarupaya namo mandaradharine || 36|| namaste
    matsyarupaya trayipalanakarine | namah parashuramaya kshatriyantakaraya te || 37|| namaste rakshasaghnaya
    namo raghavarupine | mahadeva mahabhima mahakodandabhedine || 38|| kshatriyantakarakrurabhargavatrasakarine
    | namo'stvahilya santapaharine capaharine || 39|| nagayutavalopetatatakadehaharine | shilakathinavistaravalivakshovibhedine
    || 1
  devanagari: हनुमत्कृतं १ रामस्तोत्रम् १२ हनुमानुवाच । नमो रामाय हरये विष्णवे प्रभविष्णवे । आदिदेवाय
    देवाय पुराणाय गदाभृते ॥ ३१॥ विष्टरे पुष्पकं नित्यं निविष्टाय महात्मने । प्रहृष्टवानरानीकजुष्टपादाम्बुजाय
    ते ॥ ३२॥ निष्पिष्ट राक्षसेन्द्राय जगदिष्टविधायिने । नमः सहस्रशिरसे सहस्रचरणाय च ॥ ३३॥ सहस्राक्षाय
    शुद्धाय राघवाय च विष्णवे । भक्तार्तिहारिणे तुभ्यं सीतायाः पतये नमः ॥ ३४॥ हरये नारसिंहाय दैत्यराजविदारिणे
    । नमस्तुभ्यं वराहाय दंष्ट्रोद्धृतवसुन्धर ॥ ३५॥ त्रिविक्रमाय भवते बलियज्ञविभेदिने । नमो वामनरूपाय नमो
    मन्दरधारिणे ॥ ३६॥ नमस्ते मत्स्यरूपाय त्रयीपालनकारिणे । नमः परशुरामाय क्षत्रियान्तकराय ते ॥ ३७॥ नमस्ते
    राक्षसघ्नाय नमो राघवरूपिणे । महादेव महाभीम महाकोदण्डभेदिने ॥ ३८॥ क्षत्रियान्तकरक्रूरभार्गवत्रासकारिणे
    । नमोऽस्त्वहिल्या सन्तापहारिणे चापहारिणे ॥ ३९॥ नागायुतवलोपेतताटकादेहहारिणे । शिलाकठिनविस्तारवालिवक्षोविभेदिने
    ॥ १
