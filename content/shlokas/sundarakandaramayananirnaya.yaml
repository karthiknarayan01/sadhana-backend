id: sundarakandaramayananirnaya
category: stotram
name:
  english: sundarakandaramayananirnaya
  devanagari: सुन्दरकाण्डरामायणनिर्णय
content:
  english: rinoddashananah kapindraceshtitam param | didesha kinkaran bahun kapirnigrihyatamiti || 18||
    samastasho vimrityavo varaddharasya kinkarah | samasadanmahabalam surantaratmano'ngajam || 19|| ashitikotiyuthapam
    purahsarashtakayutam | anekahetisankulam kapindramavrinodbalam || 20|| samavritastatha''yudhaih sa
    taditashca tairbhrisham | cakara tan samastashastalapraharacurnitan || 21|| punashca mantriputrakan
    sa ravanapracoditan | mamarda saptaparvataprabhan varabhirakshitan || 22|| balagragaminastatha sa
    sharvavaksugarvitan | nihatya sarvarakshasam tritiyabhagamakshinot || 23|| anaupamam harerbalam nishamya
    rakshasadhipah | kumaramakshamatmanah samam sutam nyayojayat || 24|| sa sarvalokasakshinah sutam sharairvavarsha
    ha | shitairvarastramantritairna cainamabhyacalayat || 25|| sa mandamadhyagasutam samikshya ravanopamam
    | tritiya esha bhamshako balasya hityacintayat || 26|| nidharya eva ravano raghavasya nanyatha | yudhindrajinmaya
    hato na casya shaktirikshyate || 27|| atastayoh samo maya tritiya esha hanyate | vicarya caivamashu
    tam padoh pragrihya pupluve || 28|| sa cakravadbhramaturam vidhaya ravanatmajam | apothayaddharatale
    kshanena marutitanuh || 29|| vicurnite dharatale nije sute sa ravanah | nishamya shokatapitastadagrajam
    samadishat || 30|| athendrajinmahasharairvarastrasamprayojitaih | tatashca vanarottamam na cashakadvicalane
    || 31|| athastramuttamam vidhermumoca sarvaduhsaham | sa tena tadito harirvyacintayannirakulah ||
    32|| maya vara vilanghita hyanekashah svayambhuvah | sa mananiya eva me tato'tra manayamyaham || 33||
    ime ca kuryuratra kim prahrishtarakshasam ganah | itiha lakshyameva me sa ravanashca drishyate ||
    34|| idam samikshya baddhavat sthitam kapindramashu te | babandhuranyapashakairjagama castramasya
    tat || 35|| atha pragrihya tam kapim samipamanayamshca te | nishacareshvarasya tam sa prishtavamshca
    ravanah || 36|| kape kuto'si kasya va kimarthamidrisham kritam | itiritah sa cavadat pranamya ramamishvaram
    || 37|| avehi dutamagatam durantavikramasya mam | raghuttamasya marutim kulakshaye taveshvaram ||
    38|| na cet pradasyasi tvaran raghuttamapriyam tada | saputramitrabandhavo vinashamashu yasyasi ||
    39|| na ramabanadharane kshamah sureshvara api | virincasharvapurvakah kimu tvamalpasarakah || 40||
    prakopitasya tasya kah purah sthitau kshamo bhavet | surasuroragadike jagatyacintyakarmanah || 41||
    itirite vadhodyatam nyavarayadvibhishanah | sa pucchadahakarmane nyayojayannishacaran || 42|| athasya
    vastrasancayaih pidhaya pucchamagnaye | dadurdadaha nasya tanmarutsakho hutashanah || 43|| mamarsha
    sarvaceshtitam sa rakshasam niramayah | baloddhatashca kautukat pradagdhumeva tam purim || 44|| dadaha
    cakhilam purim svapucchagena vahnina | kritistu vishvakarmano'pyadahyatasya tejasa || 45|| suvarnaratnakaritam
    sa rakshasottamaih saha | pradahya sarvashah purim mudanvito jagarja vai || 46|| sa ravanam saputrakam
    trinopamam vidhaya vai | tayoh prapashyatoh purim vidhaya bhasmasadyayau || 47|| vilanghya carnavam
    punah svajatibhih prapujitah | prabhakshya vanareshiturmadhu prabhum sameyivan || 48|| ramam sureshvaramaganyagunabhiramam
    samprapya sarvakapiviravaraih sametah | cudamanim pavanajah padayornidhaya sarvangakaih pranatimasya
    cakara bhaktya || 49|| ramo'pi nanyadanudatumamushya yogyam
  devanagari: ृणोद्दशाननः कपीन्द्रचेष्टितं परम् । दिदेश किङ्करान् बहून् कपिर्निगृह्यतामिति ॥ १८॥ समस्तशो
    विमृत्यवो वराद्धरस्य किङ्कराः । समासदन्महाबलं सुरान्तरात्मनोऽङ्गजम् ॥ १९॥ अशीतिकोटियूथपं पुरःसराष्टकायुतम्
    । अनेकहेतिसङ्कुलं कपीन्द्रमावृणोद्बलम् ॥ २०॥ समावृतस्तथाऽऽयुधैः स ताडितश्च तैर्भृशम् । चकार तान् समस्तशस्तलप्रहारचूर्णितान्
    ॥ २१॥ पुनश्च मन्त्रिपुत्रकान् स रावणप्रचोदितान् । ममर्द सप्तपर्वतप्रभान् वराभिरक्षितान् ॥ २२॥ बलाग्रगामिनस्तथा
    स शर्ववाक्सुगर्वितान् । निहत्य सर्वरक्षसां तृतीयभागमक्षिणोत् ॥ २३॥ अनौपमं हरेर्बलं निशम्य राक्षसाधिपः
    । कुमारमक्षमात्मनः समं सुतं न्ययोजयत् ॥ २४॥ स सर्वलोकसाक्षिणः सुतं शरैर्ववर्ष ह । शितैर्वरास्त्रमन्त्रितैर्न
    चैनमभ्यचालयत् ॥ २५॥ स मण्डमध्यगासुतं समीक्ष्य रावणोपमम् । तृतीय एष भांशको बलस्य हीत्यचिन्तयत् ॥ २६॥
    निधार्य एव रावणो राघवस्य नान्यथा । युधीन्द्रजिन्मया हतो न चास्य शक्तिरीक्ष्यते ॥ २७॥ अतस्तयोः समो
    मया तृतीय एष हन्यते । विचार्य चैवमाशु तं पदोः प्रगृह्य पुप्लुवे ॥ २८॥ स चक्रवद्भ्रमातुरं विधाय रावणात्मजम्
    । अपोथयद्धरातले क्षणेन मारुतीतनुः ॥ २९॥ विचूर्णिते धरातले निजे सुते स रावणः । निशम्य शोकतापितस्तदग्रजं
    समादिशत् ॥ ३०॥ अथेन्द्रजिन्महाशरैर्वरास्त्रसम्प्रयोजितैः । ततश्च वानरोत्तमं न चाशकद्विचालने ॥ ३१॥
    अथास्त्रमुत्तमं विधेर्मुमोच सर्वदुःसहम् । स तेन ताडितो हरिर्व्यचिन्तयन्निराकुलः ॥ ३२॥ मया वरा विलङ्घिता
    ह्यनेकशः स्वयम्भुवः । स माननीय एव मे ततोऽत्र मानयाम्यहम् ॥ ३३॥ इमे च कुर्युरत्र किं प्रहृष्टरक्षसां
    गणाः । इतीह लक्ष्यमेव मे स रावणश्च दृश्यते ॥ ३४॥ इदं समीक्ष्य बद्धवत् स्थितं कपीन्द्रमाशु ते । बबन्धुरन्यपाशकैर्जगाम
    चास्त्रमस्य तत् ॥ ३५॥ अथ प्रगृह्य तं कपिं समीपमानयंश्च ते । निशाचरेश्वरस्य तं स पृष्टवांश्च रावणः
    ॥ ३६॥ कपे कुतोऽसि कस्य वा किमर्थमीदृशं कृतम् । इतीरितः स चावदत् प्रणम्य राममीश्वरम् ॥ ३७॥ अवेहि दूतमागतं
    दुरन्तविक्रमस्य माम् । रघूत्तमस्य मारुतिं कुलक्षये तवेश्वरम् ॥ ३८॥ न चेत् प्रदास्यसि त्वरन् रघूत्तमप्रियां
    तदा । सपुत्रमित्रबान्धवो विनाशमाशु यास्यसि ॥ ३९॥ न रामबाणधारणे क्षमाः सुरेश्वरा अपि । विरिञ्चशर्वपूर्वकाः
    किमु त्वमल्पसारकः ॥ ४०॥ प्रकोपितस्य तस्य कः पुरः स्थितौ क्षमो भवेत् । सुरासुरोरगादिके जगत्यचिन्त्यकर्मणः
    ॥ ४१॥ इतीरिते वधोद्यतं न्यवारयद्विभीषणः । स पुच्छदाहकर्मणे न्ययोजयन्निशाचरान् ॥ ४२॥ अथास्य वस्त्रसञ्चयैः
    पिधाय पुच्छमग्नये । ददुर्ददाह नास्य तन्मरुत्सखो हुताशनः ॥ ४३॥ ममर्ष सर्वचेष्टितं स रक्षसां निरामयः
    । बलोद्धतश्च कौतुकात् प्रदग्धुमेव तां पुरीम् ॥ ४४॥ ददाह चाखिलां पुरीं स्वपुच्छगेन वह्निना । कृतिस्तु
    विश्वकर्मणोऽप्यदह्यतास्य तेजसा ॥ ४५॥ सुवर्णरत्नकारितां स राक्षसोत्तमैः सह । प्रदह्य सर्वशः पुरीं मुदान्वितो
    जगर्ज वै ॥ ४६॥ स रावणं सपुत्रकं तृणोपमं विधाय वै । तयोः प्रपश्यतोः पुरीं विधाय भस्मसाद्ययौ ॥ ४७॥ विलङ्घ्य
    चार्णवं पुनः स्वजातिभिः प्रपूजितः । प्रभक्ष्य वानरेशितुर्मधु प्रभुं समेयिवान् ॥ ४८॥ रामं सुरेश्वरमगण्यगुणाभिरामं
    सम्प्राप्य सर्वकपिवीरवरैः समेतः । चूडामणिं पवनजः पदयोर्निधाय सर्वाङ्गकैः प्रणतिमस्य चकार भक्त्या ॥
    ४९॥ रामोऽपि नान्यदनुदातुममुष्य योग्यम्
