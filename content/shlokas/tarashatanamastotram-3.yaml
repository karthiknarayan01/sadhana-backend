id: tarashatanamastotram-3
category: stotram
name:
  english: tarashatanamastotram 3
  devanagari: ताराशतनामस्तोत्रम् ३
content:
  english: shridevyuvaca | shrunu parvati vakshyami shatanama shubhani ca || 1|| asya shrishatanama stotrasya
    shrisadashiva rishirgayatrocchandah shritaradevata caturvargasiddhaye viniyogah || om advaitarupini
    adya asita anima tatha | ambika capara caiva aparna aliniti ca || 2|| alambusha aghora ca akrura ghorarupini
    | shobha ca sukhada satya sada santoshakarini || 3|| simantini ida caiva alanga pingala tatha | dalitanjanasankasha
    tarini tarunekshana || 4|| tapasi tapanaradhya tara ca taralekshana | turiya tirtharupa ca karini
    ragarupini || 5|| vishnushaktih sadaradhya sarvashaktih sadarcita | maheshashaktirmaheshi nanamuniganarcita
    || 6|| ragini renukaramya raktapadmadalekshana | ramashakti ramapujya nitya shriramacarcita || 7||
    ratnaranga ranadhyaksha ranadhira ranagranih | krishnavarna krishnapujya krishnashaktih karalini ||
    8|| dhanuira ca dhanushko dhanya dharmapradayini | kalushaghna papahara paparih papanashini || 8||
    paparupa ca nishpapa akalanka kalankino | kalankanashini kali kalikalmashanashini || 10|| ganga ca
    yamuna caiva tatha godavariti ca | narmanda sindhurupa ca kavero puskara tatha || 11|| sundari bhairavi
    bhavya matangi vagalamukhi | kailasavasini nitya kalaratrih karalika || 12|| kashiprayagarupa ca kaumari
    kaushiki tatha | krodharupa ca akrodha khela hela halahala || 13|| shatanama ca te bhaktya tarayah
    parikirttitam | ashtottarashatam japtva dashadhava varanane || 14|| tatah stavam pathitva vai sarvasiddhishvaro
    bhavet | trisandhyam yah pathennityam kalikalasya sammatam || 15|| ashtasiddhishvaro bhutva viharet
    kshitimandale | pujakale nishithe va pathitvamuktimapnuyat || 16|| iti shrikalivilasatantre shritarashatanamastotram
    samaptam | om tatsadityadi | iti shrikalivilasatantre dvadashapatalah samaptah |
  devanagari: श्रीदेव्युवाच । श्रुणु पार्वति वक्ष्यामि शतनाम शुभानि च ॥ १॥ अस्य श्रीशतनाम स्तोत्रस्य श्रीसदाशिव
    ऋषिर्गायत्रोच्छन्दः श्रीतारादेवता चतुर्वर्गसिद्धये विनियोगः ॥ ॐ अद्वैतरूपिणी आद्या असिता अणिमा तथा
    । अम्बिका चापरा चैव अपर्णा अलिनीति च ॥ २॥ अलम्बुषा अघोरा च अक्रूरा घोररूपिणी । शोभा च सुखदा सत्या
    सदा सन्तोषकारिणी ॥ ३॥ सीमन्तिनी इडा चैव अलङ्ग पिङ्गला तथा । दलिताञ्जनसङ्काशा तारिणी तरुणेक्षणा ॥ ४॥
    तापसी तपनाराध्या तारा च तरलेक्षण । तूरीया तीर्थरूपा च कारिणी रागरूपिणी ॥ ५॥ विष्णुशक्तिः सादाराध्या
    सर्वशक्तिः सदार्चिता । महेशशक्तिर्माहेशी नानामुणिगणार्चिता ॥ ६॥ रागिणी रेणुकारम्या रक्तपद्मदलेक्षणा
    । रामशक्ती रामपूज्या नित्या श्रीरामचर्चिता ॥ ७॥ रत्नरङ्गा रणाध्यक्षा रणधीरा रणाग्रणीः । कृष्णवर्णा
    कृष्णपूज्या कृष्णशक्तिः करालिनी ॥ ८॥ धनुईरा च धानुष्को धन्या धर्मप्रदायिनी । कलुषघ्ना पापहरा पापारिः
    पापनाशिनी ॥ ८॥ पापरूपा च निष्पापा अकलङ्का कलङ्किनो । कलङ्कनाशिनी काली कलिकल्मषनाशिनी ॥ १०॥ गङ्गा च
    यमुना चैव तथा गोदावरीति च । नर्मन्दा सिन्धुरूपा च कावेरो पुस्करा तथा ॥ ११॥ सुन्दरी भैरवी भव्या मातङ्गी
    वगलामुखी । कैलासवासिनी नित्या कालरात्रिः करालिका ॥ १२॥ काशीप्रयागरूपा च कौमारी कौषिकी तथा । क्रोधरूपा
    च अक्रोधा खेला हेला हलाहला ॥ १३॥ शतनाम च ते भक्त्या तारायाः परिकीर्त्तितम् । अष्टोत्तरशतं जप्त्वा
    दशधावा वरानने ॥ १४॥ ततः स्तवं पठित्वा वै सर्वसिद्धीश्वरो भवेत् । त्रिसन्ध्यं यः पठेन्नित्यं कलिकालस्य
    सम्मतम् ॥ १५॥ अष्टसिद्धीश्वरो भूत्वा विहरेत् क्षितिमण्डले । पूजाकाले निशीथे वा पठित्वामुक्तिमाप्नुयात्
    ॥ १६॥ इति श्रीकालीविलासतन्त्रे श्रीताराशतनामस्तोत्रं समाप्तम् । ॐ तत्सदित्यादि । इति श्रीकालीविलासतन्त्रे
    द्वादशपटलः समाप्तः ।
