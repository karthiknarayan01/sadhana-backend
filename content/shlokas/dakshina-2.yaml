id: dakshina-2
category: stotram
name:
  english: dakshina 2
  devanagari: दक्शिन २
content:
  english: shridakshinamurtistotram 2 upasakanam yadupasaniyamupattavasam vatashakhimule | taddhama dakshinyajusha
    svamurtya jagartu citte mama bodharupam || 1|| adrakshamakshinadayanidhanamacaryamadyam vatamulabhage
    | maunena mandasmitabhushitena maharshilokasya tamo nudantam || 2|| vidravitasheshatamoganena mudravisheshena
    muhurmuninam | nirasya mayam dayaya vidhatte devo mahamstattvamasiti bodham || 3|| aparakarunyasudhatarangairapangapatairavalokayantam
    | kathorasamsaranidaghataptanmuninaham naumi gurum gurunam || 4|| mamadyadevo vatamulavasi kripavisheshatkritasannidhanah
    | omkararupamupadishya vidyamavidyakadhvantamapakarotu || 5|| kalabhirindoriva kalpitangam muktakalapairiva
    baddhamurtim | alokaye deshikamaprameyamanadyavidyatimiraprabhatam || 6|| svadakshajanusthitavamapadam
    padodaralamkritayogapattam | apasmriterahitapadamange pranaumi devam pranidhanavantam || 7|| tattvarthamantevasatamrishinam
    yuva'pi yah sannupadeshtumishte | pranaumi tam praktanapunyajalairacaryamashcaryagunadhivasam || 8||
    ekena mudram parashum karena karena canyena mrigam dadhanah | svajanuvinyastakarah purastadacaryacudamaniravirastu
    || 9|| alepavantam madanangabhutya shardulakrittya paridhanavantam | alokaye kancana deshikendramajnanavarakaravadavagnim
    || 10|| carusmitam somakalavatamsam vinadharam vyaktajatakalapam | upasate kecana yoginastvamupattanadanubhavapramodam
    || 11|| upasate yam munayah shukadya nirashisho nirmamatadhivasah | tam dakshinamurtitanum maheshamupasmahe
    mohamahartishantyai || 12|| kantya ninditakundakandalavapurnyagrodhamule vasa
  devanagari: श्रीदक्षिणामूर्तिस्तोत्रम् २ उपासकानां यदुपासनीयमुपात्तवासं वटशाखिमूले । तद्धाम दाक्षिण्यजुषा
    स्वमूर्त्या जागर्तु चित्ते मम बोधरूपम् ॥ १॥ अद्राक्षमक्षीणदयानिधानमाचार्यमाद्यं वटमूलभागे । मौनेन
    मन्दस्मितभूषितेन महर्षिलोकस्य तमो नुदन्तम् ॥ २॥ विद्राविताशेषतमोगणेन मुद्राविशेषेण मुहुर्मुनीनाम्
    । निरस्य मायां दयया विधत्ते देवो महांस्तत्त्वमसीति बोधम् ॥ ३॥ अपारकारुण्यसुधातरङ्गैरपाङ्गपातैरवलोकयन्तम्
    । कठोरसंसारनिदाघतप्तान्मुनीनहं नौमि गुरुं गुरूणाम् ॥ ४॥ ममाद्यदेवो वटमूलवासी कृपाविशेषात्कृतसन्निधानः
    । ओंकाररूपामुपदिश्य विद्यामाविद्यकध्वान्तमपाकरोतु ॥ ५॥ कलाभिरिन्दोरिव कल्पिताङ्गं मुक्ताकलापैरिव बद्धमूर्तिम्
    । आलोकये देशिकमप्रमेयमनाद्यविद्यातिमिरप्रभातम् ॥ ६॥ स्वदक्षजानुस्थितवामपादं पादोदरालंकृतयोगपट्टम्
    । अपस्मृतेराहितपादमङ्गे प्रणौमि देवं प्रणिधानवन्तम् ॥ ७॥ तत्त्वार्थमन्तेवसतामृषीणां युवाऽपि यः सन्नुपदेष्टुमीष्टे
    । प्रणौमि तं प्राक्तनपुण्यजालैराचार्यमाश्चर्यगुणाधिवासम् ॥ ८॥ एकेन मुद्रां परशुं करेण करेण चान्येन
    मृगं दधानः । स्वजानुविन्यस्तकरः पुरस्तादाचार्यचूडामणिराविरस्तु ॥ ९॥ आलेपवन्तं मदनाङ्गभूत्या शार्दूलकृत्त्या
    परिधानवन्तम् । आलोकये कञ्चन देशिकेन्द्रमज्ञानवाराकरवाडवाग्निम् ॥ १०॥ चारुस्मितं सोमकलावतंसं वीणाधरं
    व्यक्तजटाकलापम् । उपासते केचन योगिनस्त्वामुपात्तनादानुभवप्रमोदम् ॥ ११॥ उपासते यं मुनयः शुकाद्या निराशिषो
    निर्ममताधिवासाः । तं दक्षिणामूर्तितनुं महेशमुपास्महे मोहमहार्तिशान्त्यै ॥ १२॥ कान्त्या निन्दितकुन्दकन्दलवपुर्न्यग्रोधमूले
    वस
