id: kavacam
category: kavacha
name:
  english: kavacam
  devanagari: कवचम्
content:
  english: rinu matpranavallabhe | candikatantrasarvasvam batukasya visheshatah || 4|| tatra mantradyaksharam
    tu vasudevasvarupakam | shankhavarnadvayo brahma batukashcandrashekharah || 5|| apaduddharano devo
    bhairavah parikirtitah | pravakshyami samasena caturvargaprasiddhaye || 6|| pranavah kamadam vidya
    lajjabijam ca siddhidam | batukayeti vijneyam mahapatakanashanam || 7|| apaduddharanayeti tvapaduddharanam
    nrinam | kurudvayam maheshani mohane parikirtitam || 8|| batukaya maheshani stambhane parikirtitam
    | lajjabijam tatha vidyanmuktidam parikirtitam || 9|| dvavimshatyaksharo mantrah kramena jagadishvari
    | || om hrim batukaya apaduddharanaya kuru kuru batukaya hrim || isaka japa kavaca se pahale aura
    bada mem 11 ya 21 bara karem || om asya shribatukabhairavabrahmakavacasya bhairava rishih | anushtup
    chandah | shribatukabhairavo devata | mama shribatukabhairavaprasadasiddhayarthe jape viniyogah ||
    atha pathah | om patu nityam shirasi patu hrim kanthadeshake || 10|| batukaya patu nabhau capaduddharanaya
    ca || kurudvayam lingamule tvadhare vatukaya ca || 11|| sarvada patu hrim bijam bahvoryugalameva ca
    || shadangasahito devo nityam rakshatu bhairavah || 12|| om hrim batukaya satatam sarvangam mama sarvada
    || om hrim padau mahakalah patu virasano hridi || 13|| om hrim kalah shirah patu kanthadeshe tu bhairavah
    | ganarat patu jihvayamashtabhih shaktibhih saha || 14|| om hrim dandapanirguhyamule bhairavisahitastatha
    | om hrim vishvanathah sada patu sarvangam mama sarvadah || 15|| om hrim annapurna sada patu camsau
    rakshatu candika | asitangah shirah patu lalatam rurubhairavah || 16|| om hrim candabhairavah patu
    vaktram kantham shrikrodhabhairavah | unmattabhairavah patu hridayam mama sarvada || 17|| om hrim
    nabhideshe kapali ca linge bhishanabhairavah | samharabhairavah patu muladharam ca sarvada || 18||
    om hrim bahuyugmam sada patu bhairavo mama kevalam | hamsabijam patu hridi so'ham rakshatu padayoh
    || 19|| om hrim pranapanau samanam ca udanam vyanameva ca | rakshatu dvaramule ca dashadikshu samantatah
    || 20|| om hrim pranavam patu sarvangam lajjabijam mahabhaye | iti shribrahmakavacam bhairavasya prakirtitam
    || 21|| catuvargapradam nityam svayam devaprakashitam |
  devanagari: ृणु मत्प्राणवल्लभे । चण्डिकातन्त्रसर्वस्वं बटुकस्य विशेषतः ॥ ४॥ तत्र मन्त्राद्यक्षरं तु
    वासुदेवस्वरूपकम् । शङ्खवर्णद्वयो ब्रह्मा बटुकश्चन्द्रशेखरः ॥ ५॥ आपदुद्धारणो देवो भैरवः परिकीर्तितः
    । प्रवक्ष्यामि समासेन चतुर्वर्गप्रसिद्धये ॥ ६॥ प्रणवः कामदं विद्या लज्जाबीजं च सिद्धिदम् । बटुकायेति
    विज्ञेयं महापातकनाशनम् ॥ ७॥ आपदुद्धारणायेति त्वापदुद्धारणं नृणाम् । कुरुद्वयं महेशानि मोहने परिकीर्तितम्
    ॥ ८॥ बटुकाय महेशानि स्तम्भने परिकीर्तितम् । लज्जाबीजं तथा विद्यान्मुक्तिदं परिकीर्तितम् ॥ ९॥ द्वाविंशत्यक्षरो
    मन्त्रः क्रमेण जगदीश्वरि । ॥ ॐ ह्रीं बटुकाय आपदुद्धारणाय कुरु कुरु बटुकाय ह्रीं ॥ इसका जप कवच से पहले
    और बाद में ११ या २१ बार करें ॥ ॐ अस्य श्रीबटुकभैरवब्रह्मकवचस्य भैरव ऋषिः । अनुष्टुप् छन्दः । श्रीबटुकभैरवो
    देवता । मम श्रीबटुकभैरवप्रसादसिद्धयर्थे जपे विनियोगः ॥ अथ पाठः । ॐ पातु नित्यं शिरसि पातु ह्रीं कण्ठदेशके
    ॥ १०॥ बटुकाय पातु नाभौ चापदुद्धारणाय च ॥ कुरुद्वयं लिङ्गमूले त्वाधारे वटुकाय च ॥ ११॥ सर्वदा पातु ह्रीं
    बीजं बाह्वोर्युगलमेव च ॥ षडङ्गसहितो देवो नित्यं रक्षतु भैरवः ॥ १२॥ ॐ ह्रीं बटुकाय सततं सर्वाङ्गं मम
    सर्वदा ॥ ॐ ह्रीं पादौ महाकालः पातु वीरासनो हृदि ॥ १३॥ ॐ ह्रीं कालः शिरः पातु कण्ठदेशे तु भैरवः । गणराट्
    पातु जिह्वायामष्टाभिः शक्तिभिः सह ॥ १४॥ ॐ ह्रीं दण्डपाणिर्गुह्यमूले भैरवीसहितस्तथा । ॐ ह्रीं विश्वनाथः
    सदा पातु सर्वाङ्गं मम सर्वदः ॥ १५॥ ॐ ह्रीं अन्नपूर्णा सदा पातु चांसौ रक्षतु चण्डिका । आसिताङ्गः शिरः
    पातु ललाटं रुरुभैरवः ॥ १६॥ ॐ ह्रीं चण्डभैरवः पातु वक्त्रं कण्ठं श्रीक्रोधभैरवः । उन्मत्तभैरवः पातु
    हृदयं मम सर्वदा ॥ १७॥ ॐ ह्रीं नाभिदेशे कपाली च लिङ्गे भीषणभैरवः । संहारभैरवः पातु मूलाधारं च सर्वदा
    ॥ १८॥ ॐ ह्रीं बाहुयुग्मं सदा पातु भैरवो मम केवलम् । हंसबीजं पातु हृदि सोऽहं रक्षतु पादयोः ॥ १९॥ ॐ
    ह्रीं प्राणापानौ समानं च उदानं व्यानमेव च । रक्षतु द्वारमूले च दशदिक्षु समन्ततः ॥ २०॥ ॐ ह्रीं प्रणवं
    पातु सर्वाङ्गं लज्जाबीजं महाभये । इति श्रीब्रह्मकवचं भैरवस्य प्रकीर्तितम् ॥ २१॥ चतुवर्गप्रदं नित्यं
    स्वयं देवप्रकाशितम् ।
