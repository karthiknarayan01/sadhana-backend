    नरसृष्टि अनूपा ॥ दम्पति धरम आचरन नीका। अजहुँ गाव श्रुति जिन्ह कै लीका ॥ नृप उत्तानपाद सुत तासू। ध्रुव
    हरि भगत भयु सुत जासू ॥ लघु सुत नाम प्रिय्रब्रत ताही। बेद पुरान प्रसंसहि जाही ॥ देवहूति पुनि तासु कुमारी।
    जो मुनि कर्दम कै प्रिय नारी ॥ आदिदेव प्रभु दीनदयाला। जठर धरेउ जेहिं कपिल कृपाला ॥ साङ्ख्य सास्त्र
    जिन्ह प्रगट बखाना। तत्त्व बिचार निपुन भगवाना ॥ तेहिं मनु राज कीन्ह बहु काला। प्रभु आयसु सब बिधि प्रतिपाला
    ॥ सो होइ न बिषय बिराग भवन बसत भा चौथपन। हृदयँ बहुत दुख लाग जनम गयु हरिभगति बिनु ॥ ॥ बरबस राज सुतहि
    तब दीन्हा। नारि समेत गवन बन कीन्हा ॥ तीरथ बर नैमिष बिख्याता। अति पुनीत साधक सिधि दाता ॥ बसहिं तहाँ
    मुनि सिद्ध समाजा। तहँ हियँ हरषि चलेउ मनु राजा ॥ पन्थ जात सोहहिं मतिधीरा। ग्यान भगति जनु धरें सरीरा
    ॥ पहुँचे जाइ धेनुमति तीरा। हरषि नहाने निरमल नीरा ॥ आए मिलन सिद्ध मुनि ग्यानी। धरम धुरन्धर नृपरिषि
    जानी ॥ जहँ जँह तीरथ रहे सुहाए। मुनिन्ह सकल सादर करवाए ॥ कृस सरीर मुनिपट परिधाना। सत समाज नित सुनहिं
    पुराना । दो द्वादस अच्छर मन्त्र पुनि जपहिं सहित अनुराग। बासुदेव पद पङ्करुह दम्पति मन अति लाग ॥ ॥ करहिं
    अहार साक फल कन्दा। सुमिरहिं ब्रह्म सच्चिदानन्दा ॥ पुनि हरि हेतु करन तप लागे। बारि अधार मूल फल त्यागे
    ॥ उर अभिलाष निंरन्तर होई। देखा नयन परम प्रभु सोई ॥ अगुन अखण्ड अनन्त अनादी। जेहि चिन्तहिं परमारथबादी
    ॥ नेति नेति जेहि बेद निरूपा। निजानन्द निरुपाधि अनूपा ॥ सम्भु बिरञ्चि बिष्नु भगवाना। उपजहिं जासु अंस
    तें नाना ॥ ऐसेउ प्रभु सेवक बस अही। भगत हेतु लीलातनु गही ॥ जौं यह बचन सत्य श्रुति भाषा। तौ हमार पूजहि
    अभिलाषा ॥ दो एहि बिधि बीतें बरष षट सहस बारि आहार। सम्बत सप्त सहस्र पुनि रहे समीर अधार ॥ ॥ बरष सहस
    दस त्यागेउ सोऊ। ठाढ़ए रहे एक पद दोऊ ॥ बिधि हरि तप देखि अपारा। मनु समीप आए बहु बारा ॥ मागहु बर बहु
    भाँति लोभाए। परम धीर नहिं चलहिं चलाए ॥ अस्थिमात्र होइ रहे सरीरा। तदपि मनाग मनहिं नहिं पीरा ॥ प्रभु
    सर्बग्य दास निज जानी। गति अनन्य तापस नृप रानी ॥ मागु मागु बरु भै नभ बानी। परम गभीर कृपामृत सानी ॥
    मृतक जिआवनि गिरा सुहाई। श्रबन रन्ध्र होइ उर जब आई ॥ ह्रष्टपुष्ट तन भे सुहाए। मानहुँ अबहिं भवन ते आए
    ॥ दो श्रवन सुधा सम बचन सुनि पुलक प्रफुल्लित गात। बोले मनु करि दण्डवत प्रेम न हृदयँ समात ॥ ॥ सुनु सेवक
    सुरतरु सुरधेनु। बिधि हरि हर बन्दित पद रेनू ॥ सेवत सुलभ सकल सुख दायक। प्रनतपाल सचराचर नायक ॥ जौं अनाथ
    हित हम पर नेहू। तौ प्रसन्न होइ यह बर देहू ॥ जो सरूप बस सिव मन माहीं। जेहि कारन मुनि जतन कराहीम् ॥
    जो भुसुण्डि मन मानस हंसा। सगुन अगुन जेहि निगम प्रसंसा ॥ देखहिं हम सो रूप भरि लोचन। कृपा करहु प्रनतारति
    मोचन ॥ दम्पति बचन परम प्रिय लागे। मुदुल बिनीत प्रेम रस पागे ॥ भगत बछल प्रभु कृपानिधाना। बिस्वबास प्रगटे
    भगवाना ॥ दो नील सरोरुह नील मनि नील नीरधर स्याम। लाजहिं तन सोभा निरखि कोटि कोटि सत काम ॥ ॥ सरद मयङ्क
    बदन छबि सींवा। चारु कपोल चिबुक दर ग्रीवा ॥ अधर अरुन रद सुन्दर नासा। बिधु कर निकर बिनिन्दक हासा ॥ नव
    अबुञ्ज अम्बक छबि नीकी। चितवनि ललित भावँती जी की ॥ भुकुटि मनोज चाप छबि हारी। तिलक ललाट पटल दुतिकारी
    ॥ कुण्डल मकर मुकुट सिर भ्राजा। कुटिल केस जनु मधुप समाजा ॥ उर श्रीबत्स रुचिर बनमाला। पदिक हार भूषन
    मनिजाला ॥ केहरि कन्धर चारु जनेउ। बाहु बिभूषन सुन्दर तेऊ ॥ करि कर सरि सुभग भुजदण्डा। कटि निषङ्ग कर
    सर कोदण्डा ॥ दो तडित बिनिन्दक पीत पट उदर रेख बर तीनि ॥ नाभि मनोहर लेति जनु जमुन भवँर छबि छीनि ॥ ॥
    पद राजीव बरनि नहि जाहीं। मुनि मन मधुप बसहिं जेन्ह माहीम् ॥ बाम भाग सोभति अनुकूला। आदिसक्ति छबिनिधि
    जगमूला ॥ जासु अंस उपजहिं गुनखानी। अगनित लच्छि उमा ब्रह्मानी ॥ भृकुटि बिलास जासु जग होई। राम बाम दिसि
    सीता सोई ॥ छबिसमुद्र हरि रूप बिलोकी। एकटक रहे नयन पट रोकी ॥ चितवहिं सादर रूप अनूपा। तृप्ति न मानहिं
    मनु सतरूपा ॥ हरष बिबस तन दसा भुलानी। परे दण्ड इव गहि पद पानी ॥ सिर परसे प्रभु निज कर कञ्जा। तुरत उठाए
    करुनापुञ्जा ॥ दो बोले कृपानिधान पुनि अति प्रसन्न मोहि जानि। मागहु बर जोइ भाव मन महादानि अनुमानि ॥
    ॥ सुनि प्रभु बचन जोरि जुग पानी। धरि धीरजु बोली मृदु बानी ॥ नाथ देखि पद कमल तुम्हारे। अब पूरे सब काम
    हमारे ॥ एक लालसा बड़इ उर माही। सुगम अगम कहि जात सो नाहीम् ॥ तुम्हहि देत अति सुगम गोसाईं। अगम लाग मोहि
    निज कृपनाईम् ॥ जथा दरिद्र बिबुधतरु पाई। बहु सम्पति मागत सकुचाई ॥ तासु प्रभा जान नहिं सोई। तथा हृदयँ
    मम संसय होई ॥ सो तुम्ह जानहु अन्तरजामी। पुरवहु मोर मनोरथ स्वामी ॥ सकुच बिहाइ मागु नृप मोहि। मोरें
    नहिं अदेय कछु तोही ॥ दो दानि सिरोमनि कृपानिधि नाथ कहुँ सतिभाउ ॥ चाहुँ तुम्हहि समान सुत प्रभु सन कवन
    दुराउ ॥ ॥ देखि प्रीति सुनि बचन अमोले। एवमस्तु करुनानिधि बोले ॥ आपु सरिस खोजौं कहँ जाई। नृप तव तनय
    होब मैं आई ॥ सतरूपहि बिलोकि कर जोरें। देबि मागु बरु जो रुचि तोरे ॥ जो बरु नाथ चतुर नृप मागा। सोइ कृपाल
    मोहि अति प्रिय लागा ॥ प्रभु परन्तु सुठि होति ढिठाई। जदपि भगत हित तुम्हहि सोहाई ॥ तुम्ह ब्रह्मादि जनक
    जग स्वामी। ब्रह्म सकल उर अन्तरजामी ॥ अस समुझत मन संसय होई। कहा जो प्रभु प्रवान पुनि सोई ॥ जे निज भगत
    नाथ तव अहहीं। जो सुख पावहिं जो गति लहहीम् ॥ दो सोइ सुख सोइ गति सोइ भगति सोइ निज चरन सनेहु ॥ सोइ बिबेक
    सोइ रहनि प्रभु हमहि कृपा करि देहु ॥ ॥ सुनु मृदु गूढ़ रुचिर बर रचना। कृपासिन्धु बोले मृदु बचना ॥ जो
    कछु रुचि तुम्हेर मन माहीं। मैं सो दीन्ह सब संसय नाहीम् ॥ मातु बिबेक अलोकिक तोरें। कबहुँ न मिटिहि अनुग्रह
    मोरेम् । बन्दि चरन मनु कहेउ बहोरी। अवर एक बिनति प्रभु मोरी ॥ सुत बिषिक तव पद रति होऊ। मोहि बड़ मूढ़
    कहै किन कोऊ ॥ मनि बिनु फनि जिमि जल बिनु मीना। मम जीवन तिमि तुम्हहि अधीना ॥ अस बरु मागि चरन गहि रहेऊ।
    एवमस्तु करुनानिधि कहेऊ ॥ अब तुम्ह मम अनुसासन मानी। बसहु जाइ सुरपति रजधानी ॥ सो तहँ करि भोग बिसाल तात
    गुँ कछु काल पुनि। होइहहु अवध भुआल तब मैं होब तुम्हार सुत ॥ ॥ इच्छामय नरबेष सँवारें। होइहुँ प्रगट निकेत
    तुम्हारे ॥ अंसन्ह सहित देह धरि ताता। करिहुँ चरित भगत सुखदाता ॥ जे सुनि सादर नर बड़भागी। भव तरिहहिं
    ममता मद त्यागी ॥ आदिसक्ति जेहिं जग उपजाया। सौ अवतरिहि मोरि यह माया ॥ पुरुब मैं अभिलाष तुम्हारा। सत्य
    सत्य पन सत्य हमारा ॥ पुनि पुनि अस कहि कृपानिधाना। अन्तरधान भे भगवाना ॥ दम्पति उर धरि भगत कृपाला। तेहिं
    आश्रम निवसे कछु काला ॥ समय पाइ तनु तजि अनयासा। जाइ कीन्ह अमरावति बासा ॥ दो यह इतिहास पुनीत अति उमहि
    कही बृषकेतु। भरद्वाज सुनु अपर पुनि राम जनम कर हेतु ॥ पाँचवाँ विश्राम सुनु मुनि कथा पुनीत पुरानी। जो
    गिरिजा प्रति सम्भु बखानी ॥ बिस्व बिदित एक कैकय देसू। सत्यकेतु तहँ बसि नरेसू ॥ धरम धुरन्धर नीति निधाना।
    तेज प्रताप सील बलवाना ॥ तेहि कें भे जुगल सुत बीरा। सब गुन धाम महा रनधीरा ॥ राज धनी जो जेठ सुत आही।
    नाम प्रतापभानु अस ताही ॥ अपर सुतहि अरिमर्दन नामा। भुजबल अतुल अचल सङ्ग्रामा ॥ भाइहि भाइहि परम समीती।
    सकल दोष छल बरजित प्रीती ॥ जेठे सुतहि राज नृप दीन्हा। हरि हित आपु गवन बन कीन्हा ॥ दो जब प्रतापरबि भयु
    नृप फिरी दोहाई देस। प्रजा पाल अति बेदबिधि कतहुँ नहीं अघ लेस ॥ ॥ नृप हितकारक सचिव सयाना। नाम धरमरुचि
    सुक्र समाना ॥ सचिव सयान बन्धु बलबीरा। आपु प्रतापपुञ्ज रनधीरा ॥ सेन सङ्ग चतुरङ्ग अपारा। अमित सुभट सब
    समर जुझारा ॥ सेन बिलोकि राउ हरषाना। अरु बाजे गहगहे निसाना ॥ बिजय हेतु कटकी बनाई। सुदिन साधि नृप चलेउ
    बजाई ॥ जँह तहँ परीं अनेक लराईं। जीते सकल भूप बरिआई ॥ सप्त दीप भुजबल बस कीन्हे। लै लै दण्ड छाड़इ नृप
    दीन्हेम् ॥ सकल अवनि मण्डल तेहि काला। एक प्रतापभानु महिपाला ॥ दो स्वबस बिस्व करि बाहुबल निज पुर कीन्ह
    प्रबेसु। अरथ धरम कामादि सुख सेवि समयँ नरेसु ॥ ॥ भूप प्रतापभानु बल पाई। कामधेनु भै भूमि सुहाई ॥ सब
    दुख बरजित प्रजा सुखारी। धरमसील सुन्दर नर नारी ॥ सचिव धरमरुचि हरि पद प्रीती। नृप हित हेतु सिखव नित
    नीती ॥ गुर सुर सन्त पितर महिदेवा। करि सदा नृप सब कै सेवा ॥ भूप धरम जे बेद बखाने। सकल करि सादर सुख
    माने ॥ दिन प्रति देह बिबिध बिधि दाना। सुनहु सास्त्र बर बेद पुराना ॥ नाना बापीं कूप तड़आगा। सुमन बाटिका
    सुन्दर बागा ॥ बिप्रभवन सुरभवन सुहाए। सब तीरथन्ह बिचित्र बनाए ॥ दो जँह लगि कहे पुरान श्रुति एक एक सब
    जाग। बार सहस्र सहस्र नृप किए सहित अनुराग ॥ ॥ हृदयँ न कछु फल अनुसन्धाना। भूप बिबेकी परम सुजाना ॥ करि
    जे धरम करम मन बानी। बासुदेव अर्पित नृप ग्यानी ॥ चढ़इ बर बाजि बार एक राजा। मृगया कर सब साजि समाजा ॥
    बिन्ध्याचल गभीर बन गयू। मृग पुनीत बहु मारत भयू ॥ फिरत बिपिन नृप दीख बराहू। जनु बन दुरेउ ससिहि ग्रसि
    राहू ॥ बड़ बिधु नहि समात मुख माहीं। मनहुँ क्रोधबस उगिलत नाहीम् ॥ कोल कराल दसन छबि गाई। तनु बिसाल पीवर
    अधिकाई ॥ घुरुघुरात हय आरौ पाएँ। चकित बिलोकत कान उठाएँ ॥ दो नील महीधर सिखर सम देखि बिसाल बराहु। चपरि
    चलेउ हय सुटुकि नृप हाँकि न होइ निबाहु ॥ ॥ आवत देखि अधिक रव बाजी। चलेउ बराह मरुत गति भाजी ॥ तुरत कीन्ह
    नृप सर सन्धाना। महि मिलि गयु बिलोकत बाना ॥ तकि तकि तीर महीस चलावा। करि छल सुअर सरीर बचावा ॥ प्रगटत
    दुरत जाइ मृग भागा। रिस बस भूप चलेउ सङ्ग लागा ॥ गयु दूरि घन गहन बराहू। जहँ नाहिन गज बाजि निबाहू ॥ अति
    अकेल बन बिपुल कलेसू। तदपि न मृग मग तजि नरेसू ॥ कोल बिलोकि भूप बड़ धीरा। भागि पैठ गिरिगुहाँ गभीरा ॥
    अगम देखि नृप अति पछिताई। फिरेउ महाबन परेउ भुलाई ॥ दो खेद खिन्न छुद्धित तृषित राजा बाजि समेत। खोजत
    ब्याकुल सरित सर जल बिनु भयु अचेत ॥ ॥ फिरत बिपिन आश्रम एक देखा। तहँ बस नृपति कपट मुनिबेषा ॥ जासु देस
    नृप लीन्ह छड़आई। समर सेन तजि गयु पराई ॥ समय प्रतापभानु कर जानी। आपन अति असमय अनुमानी ॥ गयु न गृह मन
    बहुत गलानी। मिला न राजहि नृप अभिमानी ॥ रिस उर मारि रङ्क जिमि राजा। बिपिन बसि तापस कें साजा ॥ तासु
    समीप गवन नृप कीन्हा। यह प्रतापरबि तेहि तब चीन्हा ॥ राउ तृषित नहि सो पहिचाना। देखि सुबेष महामुनि जाना
