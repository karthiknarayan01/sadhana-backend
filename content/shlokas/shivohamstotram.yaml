id: shivohamstotram
category: stotram
name:
  english: shivohamstotram
  devanagari: शिवोहंस्तोत्रम्
content:
  english: svarcih satyasya satyam gunarahitaparakasharupam prashantam sarvasmin yatsvamatram saditi ciditi
    va drishyashunyam vishuddham | maya'vidyadihinam niratishayasukham nistarangabdhivadyat advaitam brahma
    nityam shrutishu nigaditam kevalam tacchivo'ham || 1|| vishvam neti pramanadvigalitajagadakarabhasa
    svamatrah samyak sacciddhanaikamritasukhakalasvadatripto viveki | nirdvandvo nityamukto vigalitamamatahankritirnityatriptah
    aste yadbrahmamatram shrutishu nigaditam kevalam tacchivo'ham || 2|| adau madhye tathante janimritiphaladam
    karmamulam suduhkham chittva samsaravriksham nijaniratishaya'sangashastrena purnam | bhasa yasyaiva
    sarvam bhasitayatiruca bhasakam bhavananam jivo brahmaiva yatsyacchrutishu nigaditam kevalam tacchivo'ham
    || 3|| jnatva nihsaramevam jagadakhilamidam bhrantimohapradam yat tyaktva bhogaikavancham viratiyuta
    ito manyate yatsvasaukhyam | amrityorbahmalokam shata shata gunitam taratamyena bhantam yasminnalpam
    sukham yacchrutishu nigaditam kevalam tacchivo'ham || 4|| mrityorapnoti mrityum sa iha jagadidam yastu
    naneva pashyet uktva yatpurnarupam shrutishirasi matam neha nanasti vaca | aptoktya bhati yadvadvyapagataphaninirajjureka
    bhramante tadvadbrahmadvayam yacchrutishu nigaditam kevalam tacchivoha'm || 5||
  devanagari: स्वार्चिः सत्यस्य सत्यं गुणरहितपराकाशरूपं प्रशान्तं सर्वस्मिन् यत्स्वमात्रं सदिति चिदिति
    वा दृश्यशून्यं विशुद्धम् । मायाऽविद्यादिहीनं निरतिशयसुखं निस्तरङ्गाब्धिवद्यत् अद्वैतं ब्रह्म नित्यं
    श्रुतिषु निगदितं केवलं तच्छिवोऽहम् ॥ १॥ विश्वं नेति प्रमाणाद्विगलितजगदाकारभासा स्वमात्रः सम्यक् सच्चिद्धनैकामृतसुखकलास्वादतृप्तो
    विवेकी । निर्द्वन्द्वो नित्यमुक्तो विगलितममताहङ्कृतिर्नित्यतृप्तः आस्ते यद्ब्रह्ममात्रं श्रुतिषु निगदितं
    केवलं तच्छिवोऽहम् ॥ २॥ आदौ मध्ये तथान्ते जनिमृतिफलदं कर्ममूलं सुदुःखं छित्त्वा संसारवृक्षं निजनिरतिशयाऽसङ्गशस्त्रेण
    पूर्णम् । भासा यस्यैव सर्वं भसितयतिरुचा भासकं भावनानां जीवो ब्रह्मैव यत्स्याच्छ्रुतिषु निगदितं केवलं
    तच्छिवोऽहम् ॥ ३॥ ज्ञात्वा निःसारमेवं जगदखिलमिदं भ्रान्तिमोहप्रदं यत् त्यक्त्वा भोगैकवाञ्छां विरतियुत
    इतो मन्यते यत्स्वसौख्यम् । आमृत्योर्बह्मलोकं शत शत गुणितं तारतम्येन भान्तं यस्मिन्नल्पं सुखं यच्छ्रुतिषु
    निगदितं केवलं तच्छिवोऽहम् ॥ ४॥ मृत्योराप्नोति मृत्युं स इह जगदिदं यस्तु नानेव पश्येत् उक्त्वा यत्पूर्णरूपं
    श्रुतिशिरसि मतं नेह नानास्ति वाचा । आप्तोक्त्या भाति यद्वद्व्यपगतफणिनीरज्जुरेका भ्रमान्ते तद्वद्ब्रह्माद्वयं
    यच्छ्रुतिषु निगदितं केवलं तच्छिवोहऽम् ॥ ५॥
