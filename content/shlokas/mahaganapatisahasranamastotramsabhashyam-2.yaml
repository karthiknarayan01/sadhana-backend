id: mahaganapatisahasranamastotramsabhashyam-2
category: sahasranama
name:
  english: mahaganapatisahasranamastotramsabhashyam
  devanagari: महागणपतिसहस्रनामस्तोत्रंसभाष्यम्
content:
  english: iti vainayakam namnam sahasramidamiritam || 172|| phalashrutih idam brahme muhurte yah pathati
    pratyaham narah | karastham tasya sakalamaihikamushmikam sukham || 173|| ayurarogyamaishvaryam dhairyam
    shauryam balam yashah | medha prajna dhritih kantih saubhagyamatirupata || 174|| satyam daya kshama
    shantirdakshinyam dharmashilata | jagatsamyamanam vishvasamvado vadapatavam || 175|| sabhapandityamaudaryam
    gambhiryam brahmavarcasam | aunnatyam ca kulam shilam pratapo viryamaryata || 176|| jnanam vijnanamastikyam
    sthairyam vishvatishayita | dhanadhanyabhivriddhishca sakridasya japadbhavet || 177|| vashyam caturvidham
    nrinam japadasya prajayate | rajno rajakalatrasya rajaputrasya mantrinah || 178|| japyate yasya vashyartham
    sa dasastasya jayate | dharmarthakamamokshanamanayasena sadhanam || 179|| shakinidakinirakshoyakshoragabhayapaham
    | samrajyasukhadam caiva samastaripumardanam || 180|| samastakalahadhvamsi dagdhabijaprarohanam |
    duhsvapnanashanam kruddhasvamicittaprasadanam || 189|| shatkarmashtamahasiddhitrikalajnanasadhanam
    | parakrityaprashamanam paracakravimardanam || 182|| sangramarange sarveshamidamekam jayavaham | sarvavandhyatvadoshaghnam
    garbharakshaikakaranam || 183|| pathyate pratyaham yatra stotram ganapateridam | deshe tatra na durbhikshabhitayo
    duritani ca || 184|| na tatgriham jahati shriryatrayam pathyate stavah | kshayakushthaprameharshobhagandaravishucikah
    || 185|| gulmam plihanamashmanam atisaram mahodaram | kasam shvasamudavartam shulashophadisambhavam
    || 186|| shirorogam vamim hikkam gandamalamarocakam | vatapittakaphadvandva tridoshajanitajvaram ||
    187|| agantum vishamam shitamushnam caikahikadikam | ityadyuktamanuktam va rogam doshadisambhavam
    || 188|| sarvam prashamayatyashu stotrasyasya sakrijjapah | sakritpathena samsiddhah strishudrapatitairapi
    || 189|| sahasranamamantro'yam japitavyah shubhaptaye | mahaganapateh stotram sakamah prajapannidam
    || 190|| icchitansakalan bhoganupabhujyeha parthivan | manorathaphalairdivyairvyomayanairmanoramaih
    || 191|| candrendrabhaskaropendrabrahmasharvadisadmasu | kamarupah kamagatih kamato vicaranniha ||
    192|| bhuktva yathepsitan bhoganabhishtan saha bandhubhih | ganeshanucaro bhutva mahaganapateh priyah
    || 193|| nandishvaradisanandi nanditah sakalairganaih | shivabhyam kripaya putranirvishesham ca lalitah
    || 194|| shivabhaktah purnakamo ganeshvaravaratpunah | jatismaro dharmaparah sarvabhaumo'bhijayate
    || 195|| nishkamastu japannityam bhaktya vighneshatatparah | yogasiddhim param prapya jnanavairagyasamsthitah
    || 196|| nirantaroditanande paramanandasamvidi | vishvottirne pare pare punaravrittivarjite || 197||
    lino vainayake dhamni ramate nityanirvritah | yo namabhirhunedetairarcayetpujayennarah || 198|| rajano
    vashyatam yanti ripavo yanti dasatam | mantrah siddhyanti sarve'pi sulabhastasya siddhayah || 199||
    mulamantradapi stotramidam priyataram mama | nabhasye masi shuklayam caturthyam mama janmani || 200||
    durvabhirnamabhih pujam tarpanam vidhivaccaret | ashtadravyairvisheshena juhuyadbhaktisamyutah ||
    201|| tasyepsitani sarvani siddhyantyatra na samshayah | idam prajaptam pathitam pathitam shravitam
    shrutam || 202|| vyakritam carcitam dhyatam vimrishtamabhinanditam | ihamutra ca sarvesham vishvaishvaryapradayakam
    || 203|| svacchandacarinapyesha yenayam dharyate stavah | sa rakshyate shivodbhutairganairadhyushtakotibhih
    || 204|| pustake likhitam yatra grihe stotram pupujayet | tatra sarvottama lakshmih sannidhatte nirantaram
    || 205|| danairasheshairakhilairvrataishca tirthairashaishairakhilairmakhaishca | na tatphalam vindati
    yatganeshasahasranamnam smaranena sadyah || 206|| etannamnam sahasram pathati dinamanau pratyaham
    projjihane sayam madhyandine va trishavanamathava santatam va jano yah | sa syadaishvaryadhuryah prabhavati
    ca satam kirtimuccaistanoti pratyuham hanti vishvam bashayati suciram vardhate putrapautraih || 207||
    akincano'pi matprapticintako niyatashanah | japettu caturo masan ganesharcanatatparah || 208|| daridratam
    samunmulya saptajanmanugamapi | labhate mahati lakshmimityajna parameshvari || 209|| ayushyam vitarogam
    kulamativimalam sampadashcartadanah kirtirnityavadata bhanitirabhinava kantiravyadhibhavya | putrah
    santah kalatram gunavadabhimatam yadyadetacca satyam nityam yah stotrametatpathati ganapatestasya
    haste samastam || 210|| laghusahasranamastotram gananjayo ganapatirherambo dharanidharah | mahaganapatirlakshapradah
    kshipraprasadanah || 211|| amoghasiddhirami
  devanagari: इति वैनायकं नाम्नां सहस्रमिदमीरितम् ॥ १७२॥ फलश्रुतिः इदं ब्राह्मे मुहूर्ते यः पठति प्रत्यहं
    नरः । करस्थं तस्य सकलमैहिकामुष्मिकं सुखम् ॥ १७३॥ आयुरारोग्यमैश्वर्यं धैर्यं शौर्यं बलं यशः । मेधा
    प्रज्ञा धृतिः कान्तिः सौभाग्यमतिरूपता ॥ १७४॥ सत्यं दया क्षमा शान्तिर्दाक्षिण्यं धर्मशीलता । जगत्संयमनं
    विश्वसंवादो वादपाटवम् ॥ १७५॥ सभापाण्डित्यमौदार्यं गाम्भीर्यं ब्रह्मवर्चसम् । औन्नत्यं च कुलं शीलं
    प्रतापो वीर्यमार्यता ॥ १७६॥ ज्ञानं विज्ञानमास्तिक्यं स्थैर्यं विश्वातिशायिता । धनधान्याभिवृद्धिश्च
    सकृदस्य जपाद्भवेत् ॥ १७७॥ वश्यं चतुर्विधं नृणां जपादस्य प्रजायते । राज्ञो राजकलत्रस्य राजपुत्रस्य
    मन्त्रिणः ॥ १७८॥ जप्यते यस्य वश्यार्थं स दासस्तस्य जायते । धर्मार्थकाममोक्षाणामनायासेन साधनम् ॥ १७९॥
    शाकिनीडाकिनीरक्षोयक्षोरगभयापहम् । साम्राज्यसुखदं चैव समस्तरिपुमर्दनम् ॥ १८०॥ समस्तकलहध्वंसि दग्धबीजप्ररोहणम्
    । दुःस्वप्ननषनं क्रुद्धस्वामिचित्तप्रसादनम् ॥ १८९॥ षट्कर्माष्टमहासिद्धित्रिकालज्ञानसाधनम् । परकृत्याप्रशमनं
    परचक्रविमर्दनम् ॥ १८२॥ सङ्ग्रामरङ्गे सर्वेषामिदमेकं जयावहम् । सर्ववन्ध्यात्वदोषघ्नं गर्भरक्षैककारणम्
    ॥ १८३॥ पठ्यते प्रत्यहं यत्र स्तोत्रं गणपतेरिदम् । देशे तत्र न दुर्भिक्षभीतयो दुरितानि च ॥ १८४॥ न तत्गृहं
    जहाति श्रीर्यत्रायं पठ्यते स्तवः । क्षयकुष्ठप्रमेहार्शोभगन्दरविषूचिकाः ॥ १८५॥ गुल्मं प्लीहानमश्मानं
    अतिसारं महोदरम् । कासं श्वासमुदावर्तं शूलशोफादिसम्भवम् ॥ १८६॥ शिरोरोगं वमिं हिक्कां गण्डमालामरोचकम्
    । वातपित्तकफद्वन्द्व त्रिदोषजनितज्वरम् ॥ १८७॥ आगन्तुं विषमं शीतमुष्णं चैकाहिकादिकम् । इत्याद्युक्तमनुक्तं
    वा रोगं दोषादिसम्भवम् ॥ १८८॥ सर्वं प्रशमयत्याशु स्तोत्रस्यास्य सकृज्जपः । सकृत्पाठेन संसिद्धः स्त्रीशूद्रपतितैरपि
    ॥ १८९॥ सहस्रनाममन्त्रोऽयं जपितव्यः शुभाप्तये । महागणपतेः स्तोत्रं सकामः प्रजपन्निदम् ॥ १९०॥ इच्छितान्सकलान्
    भोगानुपभुज्येह पार्थिवान् । मनोरथफलैर्दिव्यैर्व्योमयानैर्मनोरमैः ॥ १९१॥ चन्द्रेन्द्रभास्करोपेन्द्रब्रह्मशर्वादिसद्मसु
    । कामरूपः कामगतिः कामतो विचरन्निह ॥ १९२॥ भुक्त्वा यथेप्सितान् भोगानभीष्टान् सह बन्धुभिः । गणेशानुचरो
    भूत्वा महागणपतेः प्रियः ॥ १९३॥ नन्दीश्वरादिसानन्दी नन्दितः सकलैर्गणैः । शिवाभ्यां कृपया पुत्रनिर्विशेषं
    च लालितः ॥ १९४॥ शिवभक्तः पूर्णकामो गणेश्वरवरात्पुनः । जातिस्मरो धर्मपरः सार्वभौमोऽभिजायते ॥ १९५॥ निष्कामस्तु
    जपन्नित्यं भक्त्या विघ्नेशतत्परः । योगसिद्धिं परां प्राप्य ज्ञानवैराग्यसंस्थितः ॥ १९६॥ निरन्तरोदितानन्दे
    परमानन्दसंविदि । विश्वोत्तीर्णे परे पारे पुनरावृत्तिवर्जिते ॥ १९७॥ लीनो वैनायके धाम्नि रमते नित्यनिर्वृतः
    । यो नामभिर्हुनेदेतैरर्चयेत्पूजयेन्नरः ॥ १९८॥ राजानो वश्यतां यान्ति रिपवो यान्ति दासताम् । मन्त्राः
    सिद्ध्यन्ति सर्वेऽपि सुलभास्तस्य सिद्धयः ॥ १९९॥ मूलमन्त्रादपि स्तोत्रमिदं प्रियतरं मम । नभस्ये मासि
    शुक्लायां चतुर्थ्यां मम जन्मनि ॥ २००॥ दूर्वाभिर्नामभिः पूजां तर्पणं विधिवच्चरेत् । अष्टद्रव्यैर्विशेषेण
    जुहुयाद्भक्तिसंयुतः ॥ २०१॥ तस्येप्सितानि सर्वाणि सिद्ध्यन्त्यत्र न संशयः । इदं प्रजप्तं पठितं पाठितं
    श्रावितं श्रुतम् ॥ २०२॥ व्याकृतं चर्चितं ध्यातं विमृष्टमभिनन्दितम् । इहामुत्र च सर्वेषां विश्वैश्वर्यप्रदायकम्
    ॥ २०३॥ स्वच्छन्दचारिणाप्येष येनायं धार्यते स्तवः । स रक्ष्यते शिवोद्भूतैर्गणैरध्युष्टकोटिभिः ॥ २०४॥
    पुस्तके लिखितं यत्र गृहे स्तोत्रं पूपूजयेत् । तत्र सर्वोत्तमा लक्ष्मीः सन्निधत्ते निरन्तरम् ॥ २०५॥
    दानैरशेषैरखिलैर्व्रतैश्च तीर्थैरशैषैरखिलैर्मखैश्च । न तत्फलं विन्दति यत्गणेशसहस्रनाम्नां स्मरणेन सद्यः
    ॥ २०६॥ एतन्नाम्नां सहस्रं पठति दिनमणौ प्रत्यहं प्रोज्जिहाने सायं मध्यन्दिने वा त्रिषवणमथवा सन्ततं
    वा जनो यः । स स्यादैश्वर्यधुर्यः प्रभवति च सतां कीर्तिमुच्चैस्तनोति प्रत्यूहं हन्ति विश्वं बशयति सुचिरं
    वर्धते पुत्रपौत्रैः ॥ २०७॥ अकिञ्चनोऽपि मत्प्राप्तिचिन्तको नियताशनः । जपेत्तु चतुरो मासान् गणेशार्चनतत्परः
    ॥ २०८॥ दरिद्रतां समुन्मूल्य सप्तजन्मानुगामपि । लभते महती लक्ष्मीमित्याज्ञा पारमेश्वरी ॥ २०९॥ आयुष्यं
    वीतरोगं कुलमतिविमलं सम्पदश्चार्तदानाः कीर्तिर्नित्यावदाता भणितिरभिनवा कान्तिरव्याधिभव्या । पुत्राः
    सन्तः कलत्रं गुणवदभिमतं यद्यदेतच्च सत्यं नित्यं यः स्तोत्रमेतत्पठति गणपतेस्तस्य हस्ते समस्तम् ॥ २१०॥
    लघुसहस्रनामस्तोत्रम् गणञ्जयो गणपतिर्हेरम्बो धरणीधरः । महागणपतिर्लक्षप्रदः क्षिप्रप्रसादनः ॥ २११॥ अमोघसिद्धिरमि
