id: balamantrakavacastotram
category: mantra
name:
  english: balamantrakavacastotram
  devanagari: बालामन्त्रकवचस्तोत्रम्
content:
  english: vishajvaraharam bhutavetaladinibarhanam | apasmaragadashulanetrarogadinashanam || 12|| pathyamanam
    tu satatam bahuduhkhapaham nrinam | japetkumarikavacam trikaleshu trimasakam || 13|| mucyate sakaladrogat
    kancukadiva pannagah | pathedyah prayato varsham kumari tasya siddhida || 14|| gangatarangavilasacchikaraktamukhambuja
    | nishkalanka prasannasya sudhasindhusamujjvala || 15|| anekamantrarajo'yamashesham yo japennarah
    | tasya samrakshanam mantram varshamatrasya samshayah || 16|| pratahkale tu salilam brahmanah prayatah
    shucih | mantram japan triravrittya varmasiddho bhavennarah || 17|| asya mantraprabhavena vyakhyata
    sa bhaveddhruvam | yaddussadhyatamam karyam tattu sadhyam bhavejjapat || 18|| tattastotrena labhate
    natra karya vicarana | karastham kancanam kritva kavacam sa mahanbhavet || 19|| bahuna'tra kimuktena
    sarvakaryeshu sarvada | yadyadarthe prayatnah syattattadarthamidam japet || 20|| iti shribalamantrakavacastotram
    sampurnam | balatripurasundarikavacam ca |
  devanagari: विषज्वरहरं भूतवेतालादिनिबर्हणम् । अपस्मारगदाशूलनेत्ररोगादिनाशनम् ॥ १२॥ पठ्यमानं तु सततं
    बहुदुःखापहं नृणाम् । जपेत्कुमारीकवचं त्रिकालेषु त्रिमासकम् ॥ १३॥ मुच्यते सकलाद्रोगात् कञ्चुकादिव पन्नगः
    । पठेद्यः प्रयतो वर्षं कुमारी तस्य सिद्धिदा ॥ १४॥ गङ्गातरङ्गविलसच्छीकराक्तमुखाम्बुजा । निष्कलङ्का
    प्रसन्नास्या सुधासिन्धुसमुज्ज्वला ॥ १५॥ अनेकमन्त्रराजोऽयमशेषं यो जपेन्नरः । तस्य संरक्षणं मन्त्रं
    वर्षमात्रस्य संशयः ॥ १६॥ प्रातःकाले तु सलिलं ब्राह्मणः प्रयतः शुचिः । मन्त्रं जपन् त्रिरावृत्त्या
    वर्मसिद्धो भवेन्नरः ॥ १७॥ अस्य मन्त्रप्रभावेन व्याख्याता स भवेद्ध्रुवम् । यद्दुस्साध्यतमं कार्यं तत्तु
    साध्यं भवेज्जपात् ॥ १८॥ तत्तस्तोत्रेण लभते नात्र कार्या विचारणा । करस्थं काञ्चनं कृत्वा कवचं स महान्भावेत्
    ॥ १९॥ बहुनाऽत्र किमुक्तेन सर्वकार्येषु सर्वदा । यद्यदर्थे प्रयत्नः स्यात्तत्तदर्थमिदं जपेत् ॥ २०॥
    इति श्रीबालामन्त्रकवचस्तोत्रं सम्पूर्णम् । बालात्रिपुरसुन्दरीकवचम् च ।
