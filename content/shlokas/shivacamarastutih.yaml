id: shivacamarastutih
category: stotram
name:
  english: shivacamarastutih
  devanagari: शिवचामरस्तुतिः
content:
  english: shivacamarastutih atibhishanakatubhashanayamakinkirapatali kritatadanaparipidanamaranagamasamaye
    | umaya saha mama cetasi yamashasana nivasan shivashankara shivashankara hara me hara duritam || 1||
    atidurnaya catulendriya ripu sancaya dalite pavi karkasha katu jalpita khalagarhana calite | shivaya
    saha mamacetasi shashishekhara nivasan shivashankara shivashankara hara me hara duritam || 2|| bhavabhanjana
    suraranjana khalavancana purahan danujantaka madanantaka ravijantaka bhagavan | girijavara karunakara
    parameshvara bhayahan shivashankara shivashankara hara me hara duritam || 3|| shakrashasana kratushasana
    caturashrama vishaye kali vigrahabhavadurgraharipudurbala samaye | dvija kshatriya vanitashishudara
    kampita hridaye shivashankara shivashankara hara me hara duritam || 4|| bhava sambhava vividhamaya
    paripidita vapusham dayitatmaja mamatabhara kalushikrita hridayam | kuru mam nija caranarcana niratam
    bhava satatam shivashankara shivashankara hara me hara duritam || 5|| iti shivacamarastutih samapta
    |
  devanagari: शिवचामरस्तुतिः अतिभीषणकटुभाषणयमकिङ्किरपटली कृतताडनपरिपीडनमरणागमसमये । उमया सह मम चेतसि यमशासन
    निवसन् शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ १॥ अतिदुर्नय चटुलेन्द्रिय रिपु सञ्चय दलिते पवि कर्कश कटु
    जल्पित खलगर्हण चलिते । शिवया सह ममचेतसि शशिशेखर निवसन् शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ २॥ भवभञ्जन
    सुररञ्जन खलवञ्चन पुरहन् दनुजान्तक मदनान्तक रविजान्तक भगवन् । गिरिजावर करुणाकर परमेश्वर भयहन् शिवशङ्कर
    शिवशङ्कर हर मे हर दुरितम् ॥ ३॥ शक्रशासन क्रतुशासन चतुराश्रम विषये कलि विग्रहभवदुर्ग्रहरिपुदुर्बल समये
    । द्विज क्षत्रिय वनिताशिशुदर कम्पित हृदये शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ ४॥ भव सम्भव विविधामय
    परिपीडित वपुषं दयितात्मज ममताभर कलुषीकृत हृदयम् । कुरु मां निज चरणार्चन निरतं भव सततम् शिवशङ्कर शिवशङ्कर
    हर मे हर दुरितम् ॥ ५॥ इति शिवचामरस्तुतिः समाप्ता ।
