id: kubera-ashtottara-sata-namavali
category: stotram
name:
  english: Kubera Ashtottara Sata Namavali
content:
  english: om kuberaya namah | om dhanadaya namah | om shrimate namah | om yaksheshaya namah | om guhyakeshvaraya
    namah | om nidhishaya namah | om shankarasakhaya namah | om mahalakshminivasabhuve namah | om mahapadmanidhishaya
    namah | om purnaya namah | om padmanidhishvaraya namah | om shankhakhyanidhinathaya namah | om makarakhyanidhipriyaya
    namah | om sukacchapanidhishaya namah | om mukundanidhinayakaya namah | om kundakhyanidhinathaya namah
    | om nilanidhyadhipaya namah | om mahate namah | om kharvanidhyadhipaya namah | om pujyaya namah |
    om lakshmisamrajyadayakaya namah | om ilavidaputraya namah | om koshadhishaya namah | om kuladhishaya
    namah | om ashvarudhaya namah | om vishvavandyaya namah | om visheshajnaya namah | om visharadaya
    namah | om nalakubaranathaya namah | om manigrivapitre namah | om gudhamantraya namah | om vaishravanaya
    namah | om citralekhamanahpriyaya namah | om ekapinchaya namah | om alakadhishaya namah | om paulastyaya
    namah | om naravahanaya namah | om kailasashailanilayaya namah | om rajyadaya namah | om ravanagrajaya
    namah | om citracaitrarathaya namah | om udyanaviharaya namah | om viharasukutuhalaya namah | om mahotsahaya
    namah | om mahaprajnaya namah | om sadapushpakavahanaya namah | om sarvabhaumaya namah | om anganathaya
    namah | om somaya namah | om saumyadikeshvaraya namah | om punyatmane namah | om puruhuta shriyai
    namah | om sarvapunyajaneshvaraya namah | om nityakirtaye namah | om nidhivetre namah | om lankaprakdhananayakaya
    namah | om yakshinivritaya namah | om yakshaya namah | om paramashantatmane namah | om yaksharajaya
    namah | om yakshini hridayaya namah | om kinnareshvaraya namah | om kimpurushanathaya namah | om nathaya
    namah | om khadgayudhaya namah | om vashine namah | om ishanadakshaparshvasthaya namah | om vayuvamasamashrayaya
    namah | om dharmamargaikanirataya namah | om dharmasammukhasamsthitaya namah | om vitteshvaraya namah
    | om dhanadhyakshaya namah | om ashtalakshmyashritalayaya namah | om manushyadharmine namah | om satkritaya
    namah | om koshalakshmi samashritaya namah | om dhanalakshmi nityanivasaya namah | om dhanyalakshmi
    nivasabhuve namah | om ashtalakshmi sadavasaya namah | om gajalakshmi sthiralayaya namah | om rajyalakshmi
    janmagehaya namah | om dhairyalakshmi kripashrayaya namah | om akhandaishvarya samyuktaya namah |
    om nityanandaya namah | om sagarashrayaya namah | om nityatriptaya namah | om nidhidhatre namah |
    om nirashrayaya namah | om nirupadravaya namah | om nityakamaya namah | om nirakankshaya namah | om
    nirupadhikavasabhuve namah | om shantaya namah | om sarvagunopetaya namah | om sarvajnaya namah |
    om sarvasammataya namah | om sarvanikarunapatraya namah | om sadanandakripalayaya namah | om gandharvakulasamsevyaya
    namah | om saugandhikakusumapriyaya namah | om svarnanagarivasaya namah | om nidhipithasamashrayaya
    namah | om mahameruttarasthayine namah | om maharshiganasamstutaya namah | om tushtaya namah | om
    shurpanakha jyeshthaya namah | om shivapujarataya namah | om anaghaya namah | iti shri kubera ashtottarashatanamavalih
    ||
