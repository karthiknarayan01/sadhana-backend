id: ishavasyopanishat-sabhashya-shankarabhashya-2-shuklayajurvedokta
category: upanishad
name:
  english: ishavasyopanishat sabhashya (shankarabhashya 2) (shuklayajurvedokta)
  devanagari: ईशावास्योपनिशत् सभाष्य (शाङ्करभाष्य २) (शुक्लयजुर्वेदोक्त)
content:
  english: atra kurvanneva jijivishediti na vidhih | jivanecchayah ragapraptatvat api tu yadi jijivishet
    tada kurvanneva jijivishediti icchamanudya karmakaranam vidhiyate | purvamantrasya tu ma gridha iti
    icchanishedhat samnyasavishayatvam | asya tu icchanuvadad grihasthavishayatvam ca spashtameva | tato
    mantrayoh bhinnavishayatvad brahmavida eva karmavidhiriti na yuktam | stutaye'numatirva
  devanagari: अत्र कुर्वन्नेव जिजीविषेदिति न विधिः । जीवनेच्छायाः रागप्राप्तत्वात् अपि तु यदि जिजीविषेत्
    तदा कुर्वन्नेव जिजीविषेदिति इच्छामनूद्य कर्मकरणं विधीयते । पूर्वमन्त्रस्य तु मा गृध इति इच्छानिषेधात्
    संन्यासविषयत्वम् । अस्य तु इच्छानुवादाद् गृहस्थविषयत्वं च स्पष्टमेव । ततो मन्त्रयोः भिन्नविषयत्वाद्
    ब्रह्मविद एव कर्मविधिरिति न युक्तम् । स्तुतयेऽनुमतिर्वा
meaning: {}
