id: mohinyaivasuproktampurushottamastotram-03
category: stotram
name:
  english: mohinyaivasuproktampurushottamastotram 03
  devanagari: मोहिन्यैवसुप्रोक्तंपुरुषोत्तमस्तोत्रम् ०३
content:
  english: mohinyai vasuproktam purushottamastotram 3 vasuruvaca | evamabhyarcya halinam tatah krishnam
    vicakshanah | dvadashaksharamantrena pujayetsusamahitah || 40|| dvishadvarnakamantrena bhaktya ye
    purushottamam | pujayanti sada dhiraste moksham prapnuvanti vai || 41|| na tam gatim sura yanti yogino
    naiva somapah | yam gatim yanti vidhije dvadashaksharatatparah || 42|| tasmattenaiva mantrena bhaktya
    krishnam jagadgurum | sampujya gandhapushpadyaih pranipatya prasadayet || 43|| jaya krishna jagannatha
    jaya sarvaghanashana | jaya canurakeshighna jaya kamsanishudana || 44|| jaya padmapalashaksha jaya
    cakragadadhara | jaya nilambudashyama jaya sarvasukhaprada || 45|| jaya deva jagatpujya jaya samsaranashana
    | jaya lokapate natha jaya vanchaphalaprada || 46|| samsarasagare ghore nihsare duhkhaphenile | krodhagrahakule
    raudre vishayodakasamplave || 47|| nanarogormikalile mohavartasudustare | nimagno'ham surashreshtha
    trahi mam purushottama || 48|| iti naradapurane uttarabhage pancapancashattamadhyayantargatam vasuproktam
    purushottamastotram samaptam | brihannaradiyapurana | uttarabhaga | adhyaya 55
  devanagari: मोहिन्यै वसुप्रोक्तं पुरुषोत्तमस्तोत्रम् ३ वसुरुवाच । एवमभ्यर्च्य हलिनं ततः कृष्णं विचक्षणः
    । द्वादशाक्षरमन्त्रेण पूजयेत्सुसमाहितः ॥ ४०॥ द्विषड्वर्णकमन्त्रेण भक्त्या ये पुरुषोत्तमम् । पूजयन्ति
    सदा धीरास्ते मोक्षं प्राप्नुवन्ति वै ॥ ४१॥ न तां गतिं सुरा यान्ति योगिनो नैव सोमपाः । यां गतिं यान्ति
    विधिजे द्वादशाक्षरतत्पराः ॥ ४२॥ तस्मात्तेनैव मन्त्रेण भक्त्या कृष्णं जगद्गुरुम् । सम्पूज्य गन्धपुष्पाद्यैः
    प्रणिपत्य प्रसादयेत् ॥ ४३॥ जय कृष्ण जगन्नाथ जय सर्वाघनाशन । जय चाणूरकेशिघ्न जय कंसनिषूदन ॥ ४४॥ जय
    पद्मपलाशाक्ष जय चक्रगदाधर । जय नीलाम्बुदश्याम जय सर्वसुखप्रद ॥ ४५॥ जय देव जगत्पूज्य जय संसारनाशन ।
    जय लोकपते नाथ जय वाञ्छाफलप्रद ॥ ४६॥ संसारसागरे घोरे निःसारे दुःखफेनिले । क्रोधग्राहाकुले रौद्रे विषयोदकसम्प्लवे
    ॥ ४७॥ नानारोगोर्मिकलिले मोहावर्तसुदुस्तरे । निमग्नोऽहं सुरश्रेष्ठ त्राहि मां पुरुषोत्तम ॥ ४८॥ इति
    नारदपुराणे उत्तरभागे पञ्चपञ्चाशत्तमाध्यायान्तर्गतं वसुप्रोक्तं पुरुषोत्तमस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण
    । उत्तरभाग । अध्याय ५५
