    बेद सुसाहिब रीतीं। बिनय सुनत पहिचानत प्रीती ॥ गनी गरीब ग्रामनर नागर। पण्डित मूढ़ मलीन उजागर ॥ सुकबि
    कुकबि निज मति अनुहारी। नृपहि सराहत सब नर नारी ॥ साधु सुजान सुसील नृपाला। ईस अंस भव परम कृपाला ॥ सुनि
    सनमानहिं सबहि सुबानी। भनिति भगति नति गति पहिचानी ॥ यह प्राकृत महिपाल सुभ् । जान सिरोमनि कोसलर् ॥ रीझत
    राम सनेह निसोतें। को जग मन्द मलिनमति मोतेम् ॥ दो सठ सेवक की प्रीति रुचि रखिहहिं राम कृपालु। उपल किए
    जलजान जेहिं सचिव सुमति कपि भालु ॥ ॥ हौहु कहावत सबु कहत राम सहत उपहास। साहिब सीतानाथ सो सेवक तुलसीदास
    ॥ ॥ अति बड़इ मोरि ढिठाई खोरी। सुनि अघ नरकहुँ नाक सकोरी ॥ समुझि सहम मोहि अपडर अपनें। सो सुधि राम कीन्हि
    नहिं सपनेम् ॥ सुनि अवलोकि सुचित चख चाही। भगति मोरि मति स्वामि सराही ॥ कहत नसाइ होइ हियँ नीकी। रीझत
    राम जानि जन जी की ॥ रहति न प्रभु चित चूक किए की। करत सुरति सय बार हिए की ॥ जेहिं अघ बधेउ ब्याध जिमि
    बाली। फिरि सुकण्ठ सोइ कीन्ह कुचाली ॥ सोइ करतूति बिभीषन केरी। सपनेहुँ सो न राम हियँ हेरी ॥ ते भरतहि
    भेण्टत सनमाने। राजसभाँ रघुबीर बखाने ॥ दो प्रभु तरु तर कपि डार पर ते किए आपु समान ॥ तुलसी कहूँ न राम
    से साहिब सीलनिधान ॥ ॥ राम निकाईं रावरी है सबही को नीक। जों यह साँची है सदा तौ नीको तुलसीक ॥ ॥ एहि
    बिधि निज गुन दोष कहि सबहि बहुरि सिरु नाइ। बरनुँ रघुबर बिसद जसु सुनि कलि कलुष नसाइ ॥ ॥ जागबलिक जो कथा
    सुहाई। भरद्वाज मुनिबरहि सुनाई ॥ कहिहुँ सोइ सम्बाद बखानी। सुनहुँ सकल सज्जन सुखु मानी ॥ सम्भु कीन्ह
    यह चरित सुहावा। बहुरि कृपा करि उमहि सुनावा ॥ सोइ सिव कागभुसुण्डिहि दीन्हा। राम भगत अधिकारी चीन्हा
    ॥ तेहि सन जागबलिक पुनि पावा। तिन्ह पुनि भरद्वाज प्रति गावा ॥ ते श्रोता बकता समसीला। सवँदरसी जानहिं
    हरिलीला ॥ जानहिं तीनि काल निज ग्याना। करतल गत आमलक समाना ॥ औरु जे हरिभगत सुजाना। कहहिं सुनहिं समुझहिं
    बिधि नाना ॥ दो मै पुनि निज गुर सन सुनी कथा सो सूकरखेत। समुझी नहि तसि बालपन तब अति रहेउँ अचेत ॥ ॥ श्रोता
    बकता ग्याननिधि कथा राम कै गूढ़। किमि समुझौं मै जीव जड़ कलि मल ग्रसित बिमूढ़ ॥ तदपि कही गुर बारहिं
    बारा। समुझि परी कछु मति अनुसारा ॥ भाषाबद्ध करबि मैं सोई। मोरें मन प्रबोध जेहिं होई ॥ जस कछु बुधि बिबेक
    बल मेरें। तस कहिहुँ हियँ हरि के प्रेरेम् ॥ निज सन्देह मोह भ्रम हरनी। करुँ कथा भव सरिता तरनी ॥ बुध
    बिश्राम सकल जन रञ्जनि। रामकथा कलि कलुष बिभञ्जनि ॥ रामकथा कलि पन्नग भरनी। पुनि बिबेक पावक कहुँ अरनी
    ॥ रामकथा कलि कामद गाई। सुजन सजीवनि मूरि सुहाई ॥ सोइ बसुधातल सुधा तरङ्गिनि। भय भञ्जनि भ्रम भेक भुअङ्गिनि
    ॥ असुर सेन सम नरक निकन्दिनि। साधु बिबुध कुल हित गिरिनन्दिनि ॥ सन्त समाज पयोधि रमा सी। बिस्व भार भर
    अचल छमा सी ॥ जम गन मुहँ मसि जग जमुना सी। जीवन मुकुति हेतु जनु कासी ॥ रामहि प्रिय पावनि तुलसी सी। तुलसिदास
    हित हियँ हुलसी सी ॥ सिवप्रय मेकल सैल सुता सी। सकल सिद्धि सुख सम्पति रासी ॥ सदगुन सुरगन अम्ब अदिति
    सी। रघुबर भगति प्रेम परमिति सी ॥ दो राम कथा मन्दाकिनी चित्रकूट चित चारु। तुलसी सुभग सनेह बन सिय रघुबीर
    बिहारु ॥ ॥ राम चरित चिन्तामनि चारू। सन्त सुमति तिय सुभग सिङ्गारू ॥ जग मङ्गल गुन ग्राम राम के। दानि
    मुकुति धन धरम धाम के ॥ सदगुर ग्यान बिराग जोग के। बिबुध बैद भव भीम रोग के ॥ जननि जनक सिय राम प्रेम
    के। बीज सकल ब्रत धरम नेम के ॥ समन पाप सन्ताप सोक के। प्रिय पालक परलोक लोक के ॥ सचिव सुभट भूपति बिचार
    के। कुम्भज लोभ उदधि अपार के ॥ काम कोह कलिमल करिगन के। केहरि सावक जन मन बन के ॥ अतिथि पूज्य प्रियतम
    पुरारि के। कामद घन दारिद दवारि के ॥ मन्त्र महामनि बिषय ब्याल के। मेटत कठिन कुअङ्क भाल के ॥ हरन मोह
    तम दिनकर कर से। सेवक सालि पाल जलधर से ॥ अभिमत दानि देवतरु बर से। सेवत सुलभ सुखद हरि हर से ॥ सुकबि
    सरद नभ मन उडगन से। रामभगत जन जीवन धन से ॥ सकल सुकृत फल भूरि भोग से। जग हित निरुपधि साधु लोग से ॥ सेवक
    मन मानस मराल से। पावक गङ्ग तंरग माल से ॥ दो कुपथ कुतरक कुचालि कलि कपट दम्भ पाषण्ड। दहन राम गुन ग्राम
    जिमि इन्धन अनल प्रचण्ड ॥ ॥ रामचरित राकेस कर सरिस सुखद सब काहु। सज्जन कुमुद चकोर चित हित बिसेषि बड़
    लाहु ॥ ॥ कीन्हि प्रस्न जेहि भाँति भवानी। जेहि बिधि सङ्कर कहा बखानी ॥ सो सब हेतु कहब मैं गाई। कथाप्रबन्ध
    बिचित्र बनाई ॥ जेहि यह कथा सुनी नहिं होई। जनि आचरजु करैं सुनि सोई ॥ कथा अलौकिक सुनहिं जे ग्यानी। नहिं
    आचरजु करहिं अस जानी ॥ रामकथा कै मिति जग नाहीं। असि प्रतीति तिन्ह के मन माहीम् ॥ नाना भाँति राम अवतारा।
    रामायन सत कोटि अपारा ॥ कलपभेद हरिचरित सुहाए। भाँति अनेक मुनीसन्ह गाए ॥ करिअ न संसय अस उर आनी। सुनिअ
    कथा सारद रति मानी ॥ दो राम अनन्त अनन्त गुन अमित कथा बिस्तार। सुनि आचरजु न मानिहहिं जिन्ह कें बिमल
    बिचार ॥ ॥ एहि बिधि सब संसय करि दूरी। सिर धरि गुर पद पङ्कज धूरी ॥ पुनि सबही बिनवुँ कर जोरी। करत कथा
    जेहिं लाग न खोरी ॥ सादर सिवहि नाइ अब माथा। बरनुँ बिसद राम गुन गाथा ॥ सम्बत सोरह सै एकतीसा। करुँ कथा
    हरि पद धरि सीसा ॥ नौमी भौम बार मधु मासा। अवधपुरीं यह चरित प्रकासा ॥ जेहि दिन राम जनम श्रुति गावहिं।
    तीरथ सकल तहाँ चलि आवहिम् ॥ असुर नाग खग नर मुनि देवा। आइ करहिं रघुनायक सेवा ॥ जन्म महोत्सव रचहिं सुजाना।
    करहिं राम कल कीरति गाना ॥ दो मज्जहि सज्जन बृन्द बहु पावन सरजू नीर। जपहिं राम धरि ध्यान उर सुन्दर स्याम
    सरीर ॥ ॥ दरस परस मज्जन अरु पाना। हरि पाप कह बेद पुराना ॥ नदी पुनीत अमित महिमा अति। कहि न सकि सारद
    बिमलमति ॥ राम धामदा पुरी सुहावनि। लोक समस्त बिदित अति पावनि ॥ चारि खानि जग जीव अपारा। अवध तजे तनु
    नहि संसारा ॥ सब बिधि पुरी मनोहर जानी। सकल सिद्धिप्रद मङ्गल खानी ॥ बिमल कथा कर कीन्ह अरम्भा। सुनत नसाहिं
    काम मद दम्भा ॥ रामचरितमानस एहि नामा। सुनत श्रवन पाइअ बिश्रामा ॥ मन करि विषय अनल बन जरी। होइ सुखी जौ
    एहिं सर परी ॥ रामचरितमानस मुनि भावन। बिरचेउ सम्भु सुहावन पावन ॥ त्रिबिध दोष दुख दारिद दावन। कलि कुचालि
    कुलि कलुष नसावन ॥ रचि महेस निज मानस राखा। पाइ सुसमु सिवा सन भाषा ॥ तातें रामचरितमानस बर। धरेउ नाम
    हियँ हेरि हरषि हर ॥ कहुँ कथा सोइ सुखद सुहाई। सादर सुनहु सुजन मन लाई ॥ दो जस मानस जेहि बिधि भयु जग
    प्रचार जेहि हेतु। अब सोइ कहुँ प्रसङ्ग सब सुमिरि उमा बृषकेतु ॥ ॥ सम्भु प्रसाद सुमति हियँ हुलसी। रामचरितमानस
    कबि तुलसी ॥ करि मनोहर मति अनुहारी। सुजन सुचित सुनि लेहु सुधारी ॥ सुमति भूमि थल हृदय अगाधू। बेद पुरान
    उदधि घन साधू ॥ बरषहिं राम सुजस बर बारी। मधुर मनोहर मङ्गलकारी ॥ लीला सगुन जो कहहिं बखानी। सोइ स्वच्छता
    करि मल हानी ॥ प्रेम भगति जो बरनि न जाई। सोइ मधुरता सुसीतलताई ॥ सो जल सुकृत सालि हित होई। राम भगत जन
    जीवन सोई ॥ मेधा महि गत सो जल पावन। सकिलि श्रवन मग चलेउ सुहावन ॥ भरेउ सुमानस सुथल थिराना। सुखद सीत
    रुचि चारु चिराना ॥ दो सुठि सुन्दर सम्बाद बर बिरचे बुद्धि बिचारि। तेइ एहि पावन सुभग सर घाट मनोहर चारि
    ॥ ॥ सप्त प्रबन्ध सुभग सोपाना। ग्यान नयन निरखत मन माना ॥ रघुपति महिमा अगुन अबाधा। बरनब सोइ बर बारि
    अगाधा ॥ राम सीय जस सलिल सुधासम। उपमा बीचि बिलास मनोरम ॥ पुरिनि सघन चारु चौपाई। जुगुति मञ्जु मनि सीप
    सुहाई ॥ छन्द सोरठा सुन्दर दोहा। सोइ बहुरङ्ग कमल कुल सोहा ॥ अरथ अनूप सुमाव सुभासा। सोइ पराग मकरन्द
    सुबासा ॥ सुकृत पुञ्ज मञ्जुल अलि माला। ग्यान बिराग बिचार मराला ॥ धुनि अवरेब कबित गुन जाती। मीन मनोहर
    ते बहुभाँती ॥ अरथ धरम कामादिक चारी। कहब ग्यान बिग्यान बिचारी ॥ नव रस जप तप जोग बिरागा। ते सब जलचर
    चारु तड़आगा ॥ सुकृती साधु नाम गुन गाना। ते बिचित्र जल बिहग समाना ॥ सन्तसभा चहुँ दिसि अवँराई। श्रद्धा
    रितु बसन्त सम गाई ॥ भगति निरुपन बिबिध बिधाना। छमा दया दम लता बिताना ॥ सम जम नियम फूल फल ग्याना। हरि
    पत रति रस बेद बखाना ॥ औरु कथा अनेक प्रसङ्गा। तेइ सुक पिक बहुबरन बिहङ्गा ॥ दो पुलक बाटिका बाग बन सुख
    सुबिहङ्ग बिहारु। माली सुमन सनेह जल सीञ्चत लोचन चारु ॥ ॥ जे गावहिं यह चरित सँभारे। तेइ एहि ताल चतुर
    रखवारे ॥ सदा सुनहिं सादर नर नारी। तेइ सुरबर मानस अधिकारी ॥ अति खल जे बिषी बग कागा। एहिं सर निकट न
    जाहिं अभागा ॥ सम्बुक भेक सेवार समाना। इहाँ न बिषय कथा रस नाना ॥ तेहि कारन आवत हियँ हारे। कामी काक
    बलाक बिचारे ॥ आवत एहिं सर अति कठिनाई। राम कृपा बिनु आइ न जाई ॥ कठिन कुसङ्ग कुपन्थ कराला। तिन्ह के
    बचन बाघ हरि ब्याला ॥ गृह कारज नाना जञ्जाला। ते अति दुर्गम सैल बिसाला ॥ बन बहु बिषम मोह मद माना। नदीं
    कुतर्क भयङ्कर नाना ॥ दो जे श्रद्धा सम्बल रहित नहि सन्तन्ह कर साथ। तिन्ह कहुँ मानस अगम अति जिन्हहि
    न प्रिय रघुनाथ ॥ ॥ जौं करि कष्ट जाइ पुनि कोई। जातहिं नीन्द जुड़आई होई ॥ जड़ता जाड़ बिषम उर लागा। गेहुँ
    न मज्जन पाव अभागा ॥ करि न जाइ सर मज्जन पाना। फिरि आवि समेत अभिमाना ॥ जौं बहोरि कौ पूछन आवा। सर निन्दा
    करि ताहि बुझावा ॥ सकल बिघ्न ब्यापहि नहिं तेही। राम सुकृपाँ बिलोकहिं जेही ॥ सोइ सादर सर मज्जनु करी।
    महा घोर त्रयताप न जरी ॥ ते नर यह सर तजहिं न क् । जिन्ह के राम चरन भल भ् ॥ जो नहाइ चह एहिं सर भाई।
    सो सतसङ्ग करु मन लाई ॥ अस मानस मानस चख चाही। भि कबि बुद्धि बिमल अवगाही ॥ भयु हृदयँ आनन्द उछाहू। उमगेउ
    प्रेम प्रमोद प्रबाहू ॥ चली सुभग कबिता सरिता सो। राम बिमल जस जल भरिता सो ॥ सरजू नाम सुमङ्गल मूला। लोक
    बेद मत मञ्जुल कूला ॥ नदी पुनीत सुमानस नन्दिनि। कलिमल तृन तरु मूल निकन्दिनि ॥ दो श्रोता त्रिबिध समाज
    पुर ग्राम नगर दुहुँ कूल। सन्तसभा अनुपम अवध सकल सुमङ्गल मूल ॥ ॥ रामभगति सुरसरितहि जाई। मिली सुकीरति
    सरजु सुहाई ॥ सानुज राम समर जसु पावन। मिलेउ महानदु सोन सुहावन ॥ जुग बिच भगति देवधुनि धारा। सोहति सहित
    सुबिरति बिचारा ॥ त्रिबिध ताप त्रासक तिमुहानी। राम सरुप सिन्धु समुहानी ॥ मानस मूल मिली सुरसरिही। सुनत
    सुजन मन पावन करिही ॥ बिच बिच कथा बिचित्र बिभागा। जनु सरि तीर तीर बन बागा ॥ उमा महेस बिबाह बराती। ते
    जलचर अगनित बहुभाँती ॥ रघुबर जनम अनन्द बधाई। भवँर तरङ्ग मनोहरताई ॥ दो बालचरित चहु बन्धु के बनज बिपुल
    बहुरङ्ग। नृप रानी परिजन सुकृत मधुकर बारिबिहङ्ग ॥ ॥ सीय स्वयम्बर कथा सुहाई। सरित सुहावनि सो छबि छाई
    ॥ नदी नाव पटु प्रस्न अनेका। केवट कुसल उतर सबिबेका ॥ सुनि अनुकथन परस्पर होई। पथिक समाज सोह सरि सोई
    ॥ घोर धार भृगुनाथ रिसानी। घाट सुबद्ध राम बर बानी ॥ सानुज राम बिबाह उछाहू। सो सुभ उमग सुखद सब काहू
    ॥ कहत सुनत हरषहिं पुलकाहीं। ते सुकृती मन मुदित नहाहीम् ॥ राम तिलक हित मङ्गल साजा। परब जोग जनु जुरे
    समाजा ॥ काई कुमति केकी केरी। परी जासु फल बिपति घनेरी ॥ दो समन अमित उतपात सब भरतचरित जपजाग। कलि अघ
    खल अवगुन कथन ते जलमल बग काग ॥ ॥ कीरति सरित छहूँ रितु रूरी। समय सुहावनि पावनि भूरी ॥ हिम हिमसैलसुता
    सिव ब्याहू। सिसिर सुखद प्रभु जनम उछाहू ॥ बरनब राम बिबाह समाजू। सो मुद मङ्गलमय रितुराजू ॥ ग्रीषम दुसह
    राम बनगवनू। पन्थकथा खर आतप पवनू ॥ बरषा घोर निसाचर रारी। सुरकुल सालि सुमङ्गलकारी ॥ राम राज सुख बिनय
    बड़आई। बिसद सुखद सोइ सरद सुहाई ॥ सती सिरोमनि सिय गुनगाथा। सोइ गुन अमल अनूपम पाथा ॥ भरत सुभाउ सुसीतलताई।
    सदा एकरस बरनि न जाई ॥ दो अवलोकनि बोलनि मिलनि प्रीति परसपर हास। भायप भलि चहु बन्धु की जल माधुरी सुबास
    ॥ ॥ आरति बिनय दीनता मोरी। लघुता ललित सुबारि न थोरी ॥ अदभुत सलिल सुनत गुनकारी। आस पिआस मनोमल हारी ॥
    राम सुप्रेमहि पोषत पानी। हरत सकल कलि कलुष गलानौ ॥ भव श्रम सोषक तोषक तोषा। समन दुरित दुख दारिद दोषा
    ॥ काम कोह मद मोह नसावन। बिमल बिबेक बिराग बढ़आवन ॥ सादर मज्जन पान किए तें। मिटहिं पाप परिताप हिए तेम्
    ॥ जिन्ह एहि बारि न मानस धोए। ते कायर कलिकाल बिगोए ॥ तृषित निरखि रबि कर भव बारी। फिरिहहि मृग जिमि जीव
    दुखारी ॥ दो मति अनुहारि सुबारि गुन गनि मन अन्हवाइ। सुमिरि भवानी सङ्करहि कह कबि कथा सुहाइ ॥ ॥ अब रघुपति
    पद पङ्करुह हियँ धरि पाइ प्रसाद । कहुँ जुगल मुनिबर्ज कर मिलन सुभग सम्बाद ॥ ॥ भरद्वाज मुनि बसहिं प्रयागा।
    तिन्हहि राम पद अति अनुरागा ॥ तापस सम दम दया निधाना। परमारथ पथ परम सुजाना ॥ माघ मकरगत रबि जब होई। तीरथपतिहिं
    आव सब कोई ॥ देव दनुज किन्नर नर श्रेनी। सादर मज्जहिं सकल त्रिबेनीम् ॥ पूजहि माधव पद जलजाता। परसि अखय
    बटु हरषहिं गाता ॥ भरद्वाज आश्रम अति पावन। परम रम्य मुनिबर मन भावन ॥ तहाँ होइ मुनि रिषय समाजा। जाहिं
    जे मज्जन तीरथराजा ॥ मज्जहिं प्रात समेत उछाहा। कहहिं परसपर हरि गुन गाहा ॥ दो ब्रह्म निरूपम धरम बिधि
    बरनहिं तत्त्व बिभाग। कहहिं भगति भगवन्त कै सञ्जुत ग्यान बिराग ॥ ॥ एहि प्रकार भरि माघ नहाहीं। पुनि सब
    निज निज आश्रम जाहीम् ॥ प्रति सम्बत अति होइ अनन्दा। मकर मज्जि गवनहिं मुनिबृन्दा ॥ एक बार भरि मकर नहाए।
    सब मुनीस आश्रमन्ह सिधाए ॥ जगबालिक मुनि परम बिबेकी। भरव्दाज राखे पद टेकी ॥ सादर चरन सरोज पखारे। अति
    पुनीत आसन बैठारे ॥ करि पूजा मुनि सुजस बखानी। बोले अति पुनीत मृदु बानी ॥ नाथ एक संसु बड़ मोरें। करगत
    बेदतत्व सबु तोरेम् ॥ कहत सो मोहि लागत भय लाजा। जौ न कहुँ बड़ होइ अकाजा ॥ दो सन्त कहहि असि नीति प्रभु
    श्रुति पुरान मुनि गाव। होइ न बिमल बिबेक उर गुर सन किएँ दुराव ॥ ॥ अस बिचारि प्रगटुँ निज मोहू। हरहु
    नाथ करि जन पर छोहू ॥ रास नाम कर अमित प्रभावा। सन्त पुरान उपनिषद गावा ॥ सन्तत जपत सम्भु अबिनासी। सिव
    भगवान ग्यान गुन रासी ॥ आकर चारि जीव जग अहहीं। कासीं मरत परम पद लहहीम् ॥ सोऽपि राम महिमा मुनिराया।
    सिव उपदेसु करत करि दाया ॥ रामु कवन प्रभु पूछुँ तोही। कहिअ बुझाइ कृपानिधि मोही ॥ एक राम अवधेस कुमारा।
    तिन्ह कर चरित बिदित संसारा ॥ नारि बिरहँ दुखु लहेउ अपारा। भयहु रोषु रन रावनु मारा ॥ दो प्रभु सोइ राम
    कि अपर कौ जाहि जपत त्रिपुरारि। सत्यधाम सर्बग्य तुम्ह कहहु बिबेकु बिचारि ॥ ॥ जैसे मिटै मोर भ्रम भारी।
    कहहु सो कथा नाथ बिस्तारी ॥ जागबलिक बोले मुसुकाई। तुम्हहि बिदित रघुपति प्रभुताई ॥ राममगत तुम्ह मन क्रम
    बानी। चतुराई तुम्हारी मैं जानी ॥ चाहहु सुनै राम गुन गूढ़आ। कीन्हिहु प्रस्न मनहुँ अति मूढ़आ ॥ तात सुनहु
    सादर मनु लाई। कहुँ राम कै कथा सुहाई ॥ महामोहु महिषेसु बिसाला। रामकथा कालिका कराला ॥ रामकथा ससि किरन
    समाना। सन्त चकोर करहिं जेहि पाना ॥ ऐसेइ संसय कीन्ह भवानी। महादेव तब कहा बखानी ॥ दो कहुँ सो मति अनुहारि
    अब उमा सम्भु सम्बाद। भयु समय जेहि हेतु जेहि सुनु मुनि मिटिहि बिषाद ॥ ॥ एक बार त्रेता जुग माहीं। सम्भु
    गे कुम्भज रिषि पाहीम् ॥ सङ्ग सती जगजननि भवानी। पूजे रिषि अखिलेस्वर जानी ॥ रामकथा मुनीबर्ज बखानी। सुनी
    महेस परम सुखु मानी ॥ रिषि पूछी हरिभगति सुहाई। कही सम्भु अधिकारी पाई ॥ कहत सुनत रघुपति गुन गाथा। कछु
    दिन तहाँ रहे गिरिनाथा ॥ मुनि सन बिदा मागि त्रिपुरारी। चले भवन सँग दच्छकुमारी ॥ तेहि अवसर भञ्जन महिभारा।
    हरि रघुबंस लीन्ह अवतारा ॥ पिता बचन तजि राजु उदासी। दण्डक बन बिचरत अबिनासी ॥ दो ह्दयँ बिचारत जात हर
    केहि बिधि दरसनु होइ। गुप्त रुप अवतरेउ प्रभु गेँ जान सबु कोइ ॥ सङ्कर उर अति छोभु सती न जानहिं मरमु
    सोइ ॥ तुलसी दरसन लोभु मन डरु लोचन लालची ॥ ॥ रावन मरन मनुज कर जाचा। प्रभु बिधि बचनु कीन्ह चह साचा ॥
    जौं नहिं जाउँ रहि पछितावा। करत बिचारु न बनत बनावा ॥ एहि बिधि भे सोचबस ईसा। तेहि समय जाइ दससीसा ॥ लीन्ह
    नीच मारीचहि सङ्गा। भयु तुरत सोइ कपट कुरङ्गा ॥ करि छलु मूढ़ हरी बैदेही। प्रभु प्रभाउ तस बिदित न तेही
    ॥ मृग बधि बन्धु सहित हरि आए। आश्रमु देखि नयन जल छाए ॥ बिरह बिकल नर इव रघुराई। खोजत बिपिन फिरत दौ भाई
    ॥ कबहूँ जोग बियोग न जाकें। देखा प्रगट बिरह दुख ताकेम् ॥ दो अति विचित्र रघुपति चरित जानहिं परम सुजान।
    जे मतिमन्द बिमोह बस हृदयँ धरहिं कछु आन ॥ ॥ सम्भु समय तेहि रामहि देखा। उपजा हियँ अति हरपु बिसेषा ॥
    भरि लोचन छबिसिन्धु निहारी। कुसमय जानिन कीन्हि चिन्हारी ॥ जय सच्चिदानन्द जग पावन। अस कहि चलेउ मनोज
    नसावन ॥ चले जात सिव सती समेता। पुनि पुनि पुलकत कृपानिकेता ॥ सतीं सो दसा सम्भु कै देखी। उर उपजा सन्देहु
    बिसेषी ॥ सङ्करु जगतबन्द्य जगदीसा। सुर नर मुनि सब नावत सीसा ॥ तिन्ह नृपसुतहि नह परनामा। कहि सच्चिदानन्द
    परधामा ॥ भे मगन छबि तासु बिलोकी। अजहुँ प्रीति उर रहति न रोकी ॥ दो ब्रह्म जो व्यापक बिरज अज अकल अनीह
    अभेद। सो कि देह धरि होइ नर जाहि न जानत वेद ॥ ॥ बिष्नु जो सुर हित नरतनु धारी। सौ सर्बग्य जथा त्रिपुरारी
    ॥ खोजि सो कि अग्य इव नारी। ग्यानधाम श्रीपति असुरारी ॥ सम्भुगिरा पुनि मृषा न होई। सिव सर्बग्य जान सबु
    कोई ॥ अस संसय मन भयु अपारा। होई न हृदयँ प्रबोध प्रचारा ॥ जद्यपि प्रगट न कहेउ भवानी। हर अन्तरजामी सब
    जानी ॥ सुनहि सती तव नारि सुभ् । संसय अस न धरिअ उर क् ॥ जासु कथा कुभञ्ज रिषि गाई। भगति जासु मैं मुनिहि
    सुनाई ॥ सौ मम इष्टदेव रघुबीरा। सेवत जाहि सदा मुनि धीरा ॥ छं मुनि धीर जोगी सिद्ध सन्तत बिमल मन जेहि
    ध्यावहीं। कहि नेति निगम पुरान आगम जासु कीरति गावहीम् ॥ सोइ रामु ब्यापक ब्रह्म भुवन निकाय पति माया
    धनी। अवतरेउ अपने भगत हित निजतन्त्र नित रघुकुलमनि ॥ सो लाग न उर उपदेसु जदपि कहेउ सिवँ बार बहु। बोले
    बिहसि महेसु हरिमाया बलु जानि जियँ ॥ ॥ जौं तुम्हरें मन अति सन्देहू। तौ किन जाइ परीछा लेहू ॥ तब लगि
    बैठ अहुँ बटछाहिं। जब लगि तुम्ह ऐहहु मोहि पाही ॥ जैसें जाइ मोह भ्रम भारी। करेहु सो जतनु बिबेक बिचारी
    ॥ चलीं सती सिव आयसु पाई। करहिं बिचारु करौं का भाई ॥ इहाँ सम्भु अस मन अनुमाना। दच्छसुता कहुँ नहिं कल्याना
    ॥ मोरेहु कहें न संसय जाहीं। बिधी बिपरीत भलाई नाहीम् ॥ होइहि सोइ जो राम रचि राखा। को करि तर्क बढ़आवै
    साखा ॥ अस कहि लगे जपन हरिनामा। गी सती जहँ प्रभु सुखधामा ॥ दो पुनि पुनि हृदयँ विचारु करि धरि सीता कर
    रुप। आगें होइ चलि पन्थ तेहि जेहिं आवत नरभूप ॥ ॥ लछिमन दीख उमाकृत बेषा चकित भे भ्रम हृदयँ बिसेषा ॥
    कहि न सकत कछु अति गम्भीरा। प्रभु प्रभाउ जानत मतिधीरा ॥ सती कपटु जानेउ सुरस्वामी। सबदरसी सब अन्तरजामी
    ॥ सुमिरत जाहि मिटि अग्याना। सोइ सरबग्य रामु भगवाना ॥ सती कीन्ह चह तहँहुँ दुर् । देखहु नारि सुभाव प्रभ्
    ॥ निज माया बलु हृदयँ बखानी। बोले बिहसि रामु मृदु बानी ॥ जोरि पानि प्रभु कीन्ह प्रनामू। पिता समेत लीन्ह
    निज नामू ॥ कहेउ बहोरि कहाँ बृषकेतू। बिपिन अकेलि फिरहु केहि हेतू ॥ दो राम बचन मृदु गूढ़ सुनि उपजा अति
    सङ्कोचु। सती सभीत महेस पहिं चलीं हृदयँ बड़ सोचु ॥ ॥ मैं सङ्कर कर कहा न माना। निज अग्यानु राम पर आना
    ॥ जाइ उतरु अब देहुँ काहा। उर उपजा अति दारुन दाहा ॥ जाना राम सतीं दुखु पावा। निज प्रभाउ कछु प्रगटि
    जनावा ॥ सतीं दीख कौतुकु मग जाता। आगें रामु सहित श्री भ्राता ॥ फिरि चितवा पाछें प्रभु देखा। सहित बन्धु
    सिय सुन्दर वेषा ॥ जहँ चितवहिं तहँ प्रभु आसीना। सेवहिं सिद्ध मुनीस प्रबीना ॥ देखे सिव बिधि बिष्नु अनेका।
    अमित प्रभाउ एक तें एका ॥ बन्दत चरन करत प्रभु सेवा। बिबिध बेष देखे सब देवा ॥ दो सती बिधात्री इन्दिरा
    देखीं अमित अनूप। जेहिं जेहिं बेष अजादि सुर तेहि तेहि तन अनुरूप ॥ ॥ देखे जहँ तहँ रघुपति जेते। सक्तिन्ह
    सहित सकल सुर तेते ॥ जीव चराचर जो संसारा। देखे सकल अनेक प्रकारा ॥ पूजहिं प्रभुहि देव बहु बेषा। राम
    रूप दूसर नहिं देखा ॥ अवलोके रघुपति बहुतेरे। सीता सहित न बेष घनेरे ॥ सोइ रघुबर सोइ लछिमनु सीता। देखि
    सती अति भी सभीता ॥ हृदय कम्प तन सुधि कछु नाहीं। नयन मूदि बैठीं मग माहीम् ॥ बहुरि बिलोकेउ नयन उघारी।
    कछु न दीख तहँ दच्छकुमारी ॥ पुनि पुनि नाइ राम पद सीसा। चलीं तहाँ जहँ रहे गिरीसा ॥ दो गी समीप महेस तब
    हँसि पूछी कुसलात। लीन्ही परीछा कवन बिधि कहहु सत्य सब बात ॥ दूसरा विश्राम सतीं समुझि रघुबीर प्रभ् ।
    भय बस सिव सन कीन्ह दुर् ॥ कछु न परीछा लीन्हि गोसाई। कीन्ह प्रनामु तुम्हारिहि नाई ॥ जो तुम्ह कहा सो
    मृषा न होई। मोरें मन प्रतीति अति सोई ॥ तब सङ्कर देखेउ धरि ध्याना। सतीं जो कीन्ह चरित सब जाना ॥ बहुरि
    राममायहि सिरु नावा। प्रेरि सतिहि जेहिं झूँठ कहावा ॥ हरि इच्छा भावी बलवाना। हृदयँ बिचारत सम्भु सुजाना
    ॥ सतीं कीन्ह सीता कर बेषा। सिव उर भयु बिषाद बिसेषा ॥ जौं अब करुँ सती सन प्रीती। मिटि भगति पथु होइ
    अनीती ॥ दो परम पुनीत न जाइ तजि किएँ प्रेम बड़ पापु। प्रगटि न कहत महेसु कछु हृदयँ अधिक सन्तापु ॥ ॥
    तब सङ्कर प्रभु पद सिरु नावा। सुमिरत रामु हृदयँ अस आवा ॥ एहिं तन सतिहि भेट मोहि नाहीं। सिव सङ्कल्पु
    कीन्ह मन माहीम् ॥ अस बिचारि सङ्करु मतिधीरा। चले भवन सुमिरत रघुबीरा ॥ चलत गगन भै गिरा सुहाई। जय महेस
    भलि भगति दृढ़आई ॥ अस पन तुम्ह बिनु करि को आना। रामभगत समरथ भगवाना ॥ सुनि नभगिरा सती उर सोचा। पूछा
    सिवहि समेत सकोचा ॥ कीन्ह कवन पन कहहु कृपाला। सत्यधाम प्रभु दीनदयाला ॥ जदपि सतीं पूछा बहु भाँती। तदपि
    न कहेउ त्रिपुर आराती ॥ दो सतीं हृदय अनुमान किय सबु जानेउ सर्बग्य। कीन्ह कपटु मैं सम्भु सन नारि सहज
    जड़ अग्य ॥ क ॥ हृदयँ सोचु समुझत निज करनी। चिन्ता अमित जाइ नहि बरनी ॥ कृपासिन्धु सिव परम अगाधा। प्रगट
    न कहेउ मोर अपराधा ॥ सङ्कर रुख अवलोकि भवानी। प्रभु मोहि तजेउ हृदयँ अकुलानी ॥ निज अघ समुझि न कछु कहि
    जाई। तपि अवाँ इव उर अधिकाई ॥ सतिहि ससोच जानि बृषकेतू। कहीं कथा सुन्दर सुख हेतू ॥ बरनत पन्थ बिबिध इतिहासा।
    बिस्वनाथ पहुँचे कैलासा ॥ तहँ पुनि सम्भु समुझि पन आपन। बैठे बट तर करि कमलासन ॥ सङ्कर सहज सरुप संहारा।
    लागि समाधि अखण्ड अपारा ॥ दो सती बसहि कैलास तब अधिक सोचु मन माहिं। मरमु न कोऊ जान कछु जुग सम दिवस सिराहिम्
    ॥ ॥ नित नव सोचु सतीं उर भारा। कब जैहुँ दुख सागर पारा ॥ मैं जो कीन्ह रघुपति अपमाना। पुनिपति बचनु मृषा
