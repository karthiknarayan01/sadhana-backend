id: hanumatkavacaananda
category: kavacha
name:
  english: hanumatkavacaananda
  devanagari: हनुमत्कवचआनन्द
content:
  english: hanuman purvatah patu dakshine pavanatmajah | patu praticyam rakshoghnah patu sagaraparagah
    || 1|| udicyamurdhvatah patu kesaripriyanandanah | adhastu vishnubhaktastu patu madhyam ca pavanih
    || 2|| lankavidahakah patu sarvapadbhyo nirantaram | sugrivasacivah patu mastakam vayunandanah ||
    3|| bhalam patu mahaviro bhruvormadhye nirantaram | netre chayapahari ca patu nah plavageshvarah ||
    4|| kapole karnamule ca patu shriramakinkarah | nasagramanjanasunuh patu vaktram harishvarah || vacam
    rudrapriyah patu jihvam pingalalocanah || 5|| patu devah phalguneshtah cibukam daityadarpaha | patu
    kantham ca daityarih skandhau patu surarcitah || 6|| bhujau patu mahatejah karau ca caranayudhah |
    nakhan nakhayudhah patu kukshau patu kapishvarah || 7|| vaksho mudrapahari ca patu parshve bhujayudhah
    | lankavibhanjanah patu prishthadeshe nirantaram || 8|| nabhim ca ramadutastu katim patvanilatmajah
    guhyam patu mahaprajno lingam patu shivapriyah || 9|| uru ca januni patu lankaprasadabhanjanah | janghe
    patu kapishreshtho gulphau patu mahabalah | acaloddharakah patu padau bhaskarasannibhah || 10|| anganyamitasattvadhyah
    patu padangulimstatha | sarvangani mahashurah patu romani catmavit || 11|| hanumatkavacam yastu pathedvidvan
    vicakshanah | sa eva purushashreshtho bhuktim muktim ca vindati || 12|| trikalamekakalam va pathenmasatrayam
    narah | sarvan ripun kshanajjitva sa puman shriyamapnuyat || 13|| madhyaratrau jale sthitva saptavaram
    pathedyadi | kshayapasmarakushthadi tapatrayanivaranam || 14|| ashvatthamule'rkavare sthitva pathati
    yah puman | acalam shriyamapnoti sangrame vijayam tatha || 15|| buddhirbalam yasho dhairyam nirbhayatvamarogatam
    | sudardhyam vaksphuratvam ca hanumatsmaranadbhavet || 16|| maranam vairinam sadyah sharanam sarvasampadam
    | shokasya harane daksham vande tam ranadarunam || 17|| likhitva pujayedyastu sarvatra vijayi bhavet
    | yah kare dharayennityam sa puman shriyamapnuyat || 18|| sthitva tu bandhane yastu japam karayati
    dvijaih | tatkshananmuktimapnoti nigadattu tathaiva ca || 19|| ishvara uvaca
  devanagari: हनुमान् पूर्वतः पातु दक्षिणे पवनात्मजः । पातु प्रतीच्यां रक्षोघ्नः पातु सागरपारगः ॥ १॥ उदीच्यामूर्ध्वतः
    पातु केसरीप्रियनन्दनः । अधस्तु विष्णुभक्तस्तु पातु मध्यं च पावनिः ॥ २॥ लङ्काविदाहकः पातु सर्वापद्भ्यो
    निरन्तरम् । सुग्रीवसचिवः पातु मस्तकं वायुनन्दनः ॥ ३॥ भालं पातु महावीरो भ्रुवोर्मध्ये निरन्तरम् । नेत्रे
    छायापहारी च पातु नः प्लवगेश्वरः ॥ ४॥ कपोले कर्णमूले च पातु श्रीरामकिङ्करः । नासाग्रमञ्जनासूनुः पातु
    वक्त्रं हरीश्वरः ॥ वाचं रुद्रप्रियः पातु जिह्वां पिङ्गललोचनः ॥ ५॥ पातु देवः फाल्गुनेष्टः चिबुकं दैत्यदर्पहा
    । पातु कण्ठं च दैत्यारिः स्कन्धौ पातु सुरार्चितः ॥ ६॥ भुजौ पातु महातेजाः करौ च चरणायुधः । नखान् नखायुधः
    पातु कुक्षौ पातु कपीश्वरः ॥ ७॥ वक्षो मुद्रापहारी च पातु पार्श्वे भुजायुधः । लङ्काविभञ्जनः पातु पृष्ठदेशे
    निरन्तरम् ॥ ८॥ नाभिं च रामदूतस्तु कटिं पात्वनिलात्मजः गुह्यं पातु महाप्राज्ञो लिङ्गं पातु शिवप्रियः
    ॥ ९॥ ऊरू च जानुनी पातु लङ्काप्रासादभञ्जनः । जङ्घे पातु कपिश्रेष्ठो गुल्फौ पातु महाबलः । अचलोद्धारकः
    पातु पादौ भास्करसन्निभः ॥ १०॥ अङ्गान्यमितसत्त्वाढ्यः पातु पादाङ्गुलींस्तथा । सर्वाङ्गानि महाशूरः पातु
    रोमाणि चात्मवित् ॥ ११॥ हनुमत्कवचं यस्तु पठेद्विद्वान् विचक्षणः । स एव पुरुषश्रेष्ठो भुक्तिं मुक्तिं
    च विन्दति ॥ १२॥ त्रिकालमेककालं वा पठेन्मासत्रयं नरः । सर्वान् रिपून् क्षणाज्जित्वा स पुमान् श्रियमाप्नुयात्
    ॥ १३॥ मध्यरात्रौ जले स्थित्वा सप्तवारं पठेद्यदि । क्षयापस्मारकुष्ठादि तापत्रयनिवारणम् ॥ १४॥ अश्वत्थमूलेऽर्कवारे
    स्थित्वा पठति यः पुमान् । अचलां श्रियमाप्नोति सङ्ग्रामे विजयं तथा ॥ १५॥ बुद्धिर्बलं यशो धैर्यं निर्भयत्वमरोगताम्
    । सुदार्ढ्यं वाक्स्फुरत्वं च हनुमत्स्मरणाद्भवेत् ॥ १६॥ मारणं वैरिणां सद्यः शरणं सर्वसम्पदाम् । शोकस्य
    हरणे दक्षं वन्दे तं रणदारुणम् ॥ १७॥ लिखित्वा पूजयेद्यस्तु सर्वत्र विजयी भवेत् । यः करे धारयेन्नित्यं
    स पुमान् श्रियमाप्नुयात् ॥ १८॥ स्थित्वा तु बन्धने यस्तु जपं कारयति द्विजैः । तत्क्षणान्मुक्तिमाप्नोति
    निगडात्तु तथैव च ॥ १९॥ ईश्वर उवाच
