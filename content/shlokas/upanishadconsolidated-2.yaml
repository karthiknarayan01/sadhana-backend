id: upanishadconsolidated-2
category: upanishad
name:
  english: upanishadconsolidated
  devanagari: उपनिशद्चोन्सोलिदतेद्
content:
  english: madanmaya mallaya mahacakravarana mahavakyavivarana yajniki yoga yogakundali yoni ramanaparavidyopanishat
    rasa ramakrishna paramahamsopanishat rudrakshajvala laghu avadhuta laghu jabala laghu samnyasa vairagya
    shakata shankha shaktayana shuka shrilalitamahatripurasundari samhara samhita sarasvati
  devanagari: मदन्माया मल्लाय महाचक्रावरण महावाक्यविवरण याज्ञिकी योग योगकुण्डलि योनि रमणपरविद्योपनिषत्
    रस रामकृष्ण परमहंसोपनिषत् रुद्राक्षज्वाला लघु अवधूत लघु जाबाल लघु संन्यास वैराग्य शकट शङ्ख शाक्तायन
    शुक श्रीललितामहात्रिपुरसुन्दरी संहार संहिता सरस्वती
meaning: {}
