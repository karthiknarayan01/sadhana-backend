id: annamayya-keerthanas-kulukuga-nadavaro
category: stotram
name:
  english: Annamayya Keerthanas Kulukuga Nadavaro
content:
  english: adi pallavi kulukaka nadavaro kòmmalala | jalajala ralini jajulu mayammaku || òyyane menu gadali
    nòppuga nadavaro gayyali shripadataku kantulala | payyèda cèṟagu jari bharapu gubbala mida ayyo cèmarincè
    ma yammaku nènnuduru || kulukaka nadavaro kòmmalala callèdi gandavòdiyai jari niluvaro pallaki vattina
    muddu banatulala | mòllamaina kundanapu mutyala kucculadara gallanucu gankanalu gadalimayammaku ||
    kulukaka nadavaro kòmmalala jamali mutyala todi cammaliga lidaro ramaniki manula naratu lèttaro |
    amarinci kaugita nalamelu manganidè samakudè venkateshvarudu ma yammaku || kulukaka nadavaro kòmmalala
    | jalajala ralini jajulu mayammaku ||
  devanagari: आदि पल्लवि कुलुकक नडवरो कॊम्मलाला । जलजल रालीनि जाजुलु मायम्मकु ॥ ऒय्यने मेनु गदली नॊप्पुगा
    नडवरो गय्यालि श्रीपादताकु कान्तुलाला । पय्यॆद चॆऱगु जारी भारपु गुब्बल मिद अय्यो चॆमरिञ्चॆ मा यम्मकु
    नॆन्नुदुरु ॥ कुलुकक नडवरो कॊम्मलाला चल्लॆडि गन्दवॊडियै जारी निलुवरो पल्लकि वट्टिन मुद्दु बणतुलाल ।
    मॊल्लमैन कुन्दनपु मुत्याल कुच्चुलदर गल्लनुचु गङ्कणालु गदलीमायम्मकु ॥ कुलुकक नडवरो कॊम्मलाला जमलि मुत्याल
    तोडि चम्मालिग लिडरो रमणिकि मणुल नारतु लॆत्तरो । अमरिञ्चि कौगिट नलमेलु मङ्गनिदॆ समकूडॆ वेङ्कटेश्वरुडु
    मा यम्मकु ॥ कुलुकक नडवरो कॊम्मलाला । जलजल रालीनि जाजुलु मायम्मकु ॥
