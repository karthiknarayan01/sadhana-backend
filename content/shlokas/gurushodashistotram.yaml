id: gurushodashistotram
category: stotram
name:
  english: gurushodashistotram
  devanagari: गुरुषोडशीस्तोत्रम्
content:
  english: shriji maharaja ka samashraya lete haim || 5|| sarveshvararcanacaryatatparam nitaram muda |
    shrimadbhagavatakhyanavarnane nipunam bhaje || 6|| maharshivarya shrisanakadi samsevya shrisarveshvara
    prabhu ki seva paricarya karane mem sarvada tatpara aura shrimadbhagavata mem parivarnita vividha
    akhyanom ke nirupana karane mem ati kushala aise acaryashri ka bhajana karate haim || 6|| tulasimalayajape
    sthitanca tilakankitam | padmasanasamasinam bhavaye divyadarshanam || 7|| tulasi mala jinake kara
    kamalom mem sada sthita rahati hai aura usake dvara sarvada mahamantra ka japa karane vale evam gopicandana
    ke tilaka se parama sushobhita aura padmasana se virajita jinake divya darshana ho rahe haim | una
    paramacaryashri ka apane hridaya se bhavana karate haim || 7|| vrindavananikunjastham rasalilarasavaham
    | gitashastravisheshajnam namami siddhisagaram || 8|| shrivrindavanadhamastha shri shriji bar̤ai kunja
    mem bahu samaya taka jinhonne nivasa kiya evam rasavihari ki rasalila mem sada avagahana karane vale
    aura shrimadbhagavadgita ka pratidina patha karane mem tatpara aura jo apani vacanasiddhi se paripurna
    haim aise paramacaryavarya ka hama abhinamana karate haim || 8|| radhakrishnapadambhoje sadanurakta
    bhavanam | parabhaktisudhasiktam bhajami bhaktidayam || 9|| nityanikunjavihari shriradhakrishna bhagavan
    ke yugalacaranaravindom mem sada anurakta rahane vale aura parabhakti sudha se abhisincita tatha bhagavadbhakti
    pradana karane vale acaryashri ka bhajana karate haim || 9|| rasabrahmamukundanghrisharanam shastrasattamam
    | varddhakye'pi nityacarya palakam satatam bhaje || 10|| rasa parabrahma shrimukundavihari ke yugalacaranaravindom
    mem sada sharana parayana evam shastrom ke jnata aura apani vriddhavastha mem bhi apani nitya dainikacarya
    ke paripalana karane mem satata tatpara aise acaryavarya ka bhajana karate haim || 10|| saralya
  devanagari: श्रीजी महाराज का समाश्रय लेते हैं ॥ ५॥ सर्वेश्वरार्चनाचर्यातत्परं नितरां मुदा । श्रीमद्भागवताख्यानवर्णने
    निपुणं भजे ॥ ६॥ महर्षिवर्य श्रीसनकादि संसेव्य श्रीसर्वेश्वर प्रभु की सेवा परिचर्या करने में सर्वदा
    तत्पर और श्रीमद्भागवत में परिवर्णित विविध आख्यानों के निरूपण करने में अति कुशल ऐसे आचार्यश्री का भजन
    करते हैं ॥ ६॥ तुलसीमालयाजापे स्थितञ्च तिलकाङ्कितम् । पद्मासनसमासीनं भावये दिव्यदर्शनम् ॥ ७॥ तुलसी
    माला जिनके कर कमलों में सदा स्थित रहती है और उसके द्वारा सर्वदा महामन्त्र का जप करने वाले एवं गोपीचन्दन
    के तिलक से परम सुशोभित और पद्मासन से विराजित जिनके दिव्य दर्शन हो रहे हैं । उन परमाचार्यश्री का अपने
    हृदय से भावना करते हैं ॥ ७॥ वृन्दावननिकुञ्जस्थं रासलीलारसावहम् । गीताशास्त्रविशेषज्ञं नमामि सिद्धिसागरम्
    ॥ ८॥ श्रीवृन्दावनधामस्थ श्री श्रीजी बड़ई कुञ्ज में बहु समय तक जिन्होन्ने निवास किया एवं रासविहारी
    की रासलीला में सदा अवगाहन करने वाले और श्रीमद्भगवद्गीता का प्रतिदिन पाठ करने में तत्पर और जो अपनी
    वचनसिद्धि से परिपूर्ण हैं ऐसे परमाचार्यवर्य का हम अभिनमन करते हैं ॥ ८॥ राधाकृष्णपदाम्भोजे सदानुरक्त
    भावनम् । पराभक्तिसुधासिक्तं भजामि भक्तिदायम् ॥ ९॥ नित्यनिकुञ्जविहारी श्रीराधाकृष्ण भगवान् के युगलचरणारविन्दों
    में सदा अनुरक्त रहने वाले और पराभक्ति सुधा से अभिसिञ्चित तथा भगवद्भक्ति प्रदान करने वाले आचार्यश्री
    का भजन करते हैं ॥ ९॥ रसब्रह्ममुकुन्दाङ्घ्रिशरणं शास्त्रसत्तमम् । वार्द्धक्येऽपि नित्यचर्या पालकं सततं
    भजे ॥ १०॥ रस परब्रह्म श्रीमुकुन्दविहारी के युगलचरणारविन्दों में सदा शरण परायण एवं शास्त्रों के ज्ञाता
    और अपनी वृद्धावस्था में भी अपनी नित्य दैनिकचर्या के परिपालन करने में सतत तत्पर ऐसे आचार्यवर्य का भजन
    करते हैं ॥ १०॥ सारल्य
