id: andhakakritam6shivastotram
category: stotram
name:
  english: andhakakritam6shivastotram
  devanagari: अन्धककृतं६शिवस्तोत्रम्
content:
  english: andhakakritam 6 shivastotram andhaka uvaca | jayasva devadevesha umardhardhashariradhrik |
    namaste devadevesha sarvaya trigunatmane || 78|| vrishabhasanamarudha shashankakritashekhara | jaya
    khatvangahastaya gangadhara namo'stu te || 79|| namo damaruhastaya namah kapalamaline | smaradehavinashaya
    maheshaya namo'stu te || 80|| pushno dantanipataya gananathaya te namah | jaya svarupadehaya arupabahurupine
    || 81|| uttamangavinashaya virincerapi shankara | shmashanavasine nityam nityam bhairavarupine ||
    82|| tvam sarvago'si tvam karta tvam harta nanya eva ca | tvam bhumistvam dishashcaiva tvam gururbhargavastatha
    || 83|| sauristvam devadevesha bhumiputrastathaiva ca | rikshagrahadikam sarvam yaddrishyam tattvameva
    ca || 84|| iti shriskandapurane avantyakhande revakhande ashtacatvarimsha
  devanagari: अन्धककृतं ६ शिवस्तोत्रम् अन्धक उवाच । जयस्व देवदेवेश उमार्धार्धशरीरधृक् । नमस्ते देवदेवेश
    सर्वाय त्रिगुणात्मने ॥ ७८॥ वृषभासनमारूढ शशाङ्ककृतशेखर । जय खट्वाङ्गहस्ताय गङ्गाधर नमोऽस्तु ते ॥ ७९॥
    नमो डमरुहस्ताय नमः कपालमालिने । स्मरदेहविनाशाय महेशाय नमोऽस्तु ते ॥ ८०॥ पूष्णो दन्तनिपाताय गणनाथाय
    ते नमः । जय स्वरूपदेहाय अरूपबहुरूपिणे ॥ ८१॥ उत्तमाङ्गविनाशाय विरिञ्चेरपि शङ्कर । श्मशानवासिने नित्यं
    नित्यं भैरवरूपिणे ॥ ८२॥ त्वं सर्वगोऽसि त्वं कर्ता त्वं हर्ता नान्य एव च । त्वं भूमिस्त्वं दिशश्चैव
    त्वं गुरुर्भार्गवस्तथा ॥ ८३॥ सौरिस्त्वं देवदेवेश भूमिपुत्रस्तथैव च । ऋक्षग्रहादिकं सर्वं यद्दृश्यं
    तत्त्वमेव च ॥ ८४॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे अष्टचत्वारिंशा
