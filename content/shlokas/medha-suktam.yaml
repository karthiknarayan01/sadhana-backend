id: medha-suktam
category: stotram
name:
  english: Medha Suktam
content:
  english: ya~shchandasamrishabho vishvarupah | chandobhyo thsambabhuva | sa mendro medhaya sprinotu |
    amritasya devadharano bhuyasam | sharira shanam | jihva me madhumattama | karna bhyam bhurivishruvam
    | brahmanah kosho 'si medhaya pihitah | shruta mme gopaya || om shanti mmedhadevi jushamana na aga
    dvishvaci bhadra sumanasya mana | tvaya jushta nudamana durukta nbrihadvadema vidathe suvirah | tvaya
    jushta rishirbhavati devi tvaya brahma ''gatashriruta tvaya | tvaya jushtashcitram vi~ndate vasu sa
    no jushasva dravino na medhe || medha mma indro dadatu medha ndevi sarasvati | medha mme ashvinavubha
    mpushkarasraja | apsarasu ca ya medha gandharveshu ca yanmanah | daivi mmedha sarasvati sa ma rvishvarupa
    hiranyavarna jagati jagamya | urjasvati payasa pinvamana sa ma mmedha supratika jushantam || mayi
    medha mmayindra indriya mmayi suryo bhrajo dadhatu || om hamsa hamsaya vidmahe paramahamsaya dhimahi
    | tanno hamsah pracodaya
  devanagari: यँश्छन्द॑सामृष॒भो वि॒श्वरू॑पः । छन्दो॒भ्यो थ्सम्ब॒भूव॑ । स मेन्द्रो॑ मे॒धया स्पृणोतु । अ॒मृत॑स्य
    देव॒धार॑णो भूयासम् । शरी॑र षणम् । जि॒ह्वा मे॒ मधु॑मत्तमा । कर्णा भ्यां॒ भूरि॒विश्रु॑वम् । ब्रह्म॑णः
    को॒शो॑ ऽसि मे॒धया पि॑हितः । श्रु॒त म्मे॑ गोपाय ॥ ॐ शान्ति॒ म्मे॒धादे॒वी जु॒षमा॑णा न॒ आगा द्वि॒श्वाची॑
    भ॒द्रा सु॑मन॒स्य मा॑ना । त्वया॒ जुष्टा॑ नु॒दमा॑ना दु॒रुक्ता न्बृ॒हद्व॑देम वि॒दथे॑ सु॒वीराः । त्वया॒
    जुष्ट॑ ऋ॒षिर्भ॑वति देवि॒ त्वया॒ ब्रह्मा॑ ऽऽग॒तश्री॑रु॒त त्वया । त्वया॒ जुष्ट॑श्चि॒त्रं विँ॑न्दते वसु॒
    सा नो॑ जुषस्व॒ द्रवि॑णो न मेधे ॥ मे॒धा म्म॒ इन्द्रो॑ ददातु मे॒धा न्दे॒वी सर॑स्वती । मे॒धा म्मे॑ अ॒श्विना॑वु॒भा
    म्पुष्क॑रस्रजा । अ॒प्स॒रासु॑ च॒ या मे॒धा ग॑न्ध॒र्वेषु॑ च॒ यन्मनः॑ । दैवी म्मे॒धा सर॑स्वती॒ सा मा र्वि॒श्वरू॑पा॒
    हिर॑ण्यवर्णा॒ जग॑ती जग॒म्या । ऊर्ज॑स्वती॒ पय॑सा॒ पिन्व॑माना॒ सा मा म्मे॒धा सु॒प्रती॑का जुषन्ताम् ॥
    मयि॑ मे॒धा म्मयीन्द्र॑ इन्द्रि॒य म्मयि॒ सूर्यो॒ भ्राजो॑ दधातु ॥ ॐ हं॒स॒ हं॒साय॑ वि॒द्महे॑ परमहं॒साय॑
    धीमहि । तन्नो॑ हंसः प्रचो॒दया
