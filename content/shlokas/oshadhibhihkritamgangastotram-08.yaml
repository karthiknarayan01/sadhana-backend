id: oshadhibhihkritamgangastotram-08
category: stotram
name:
  english: oshadhibhihkritamgangastotram 08
  devanagari: ओषधिभिःकृतंगन्गास्तोत्रम् ०८
content:
  english: oshadhya ucuh | kim va'karishyanbhavavartino jana nanaghasanghabhibhavacca duhkhitah | na ca''gamishyadbhavati
    bhuvam cetpunyodake gautami shambhukante || 9|| ko vetti bhagyam naradehabhajam mahigatanam saritamadhishe
    | esham mahapatakasanghahantri tvamamba gange sulabha sadaiva || 10|| na te vibhutim nanu vetti ko'pi
    trailokyavandye jagadamba gange | gaurisamalingitavigraho'pi dhatte smararih shirasa'pi yattvam ||
    11|| namo'stu te matarabhishtadayini namo'stu te brahmamaye'ghanashini | namo'stu te vishnupadabjanihsrite
    namo'stu te shambhujatavinihsrite || 12|| iti brahmapurane ekonavimshadhikashatatamadhyayantargatam
    oshadhibhih kritam gautami
  devanagari: ओषध्य ऊचुः । किं वाऽकरिष्यन्भववर्तिनो जना नानाघसङ्घाभिभवाच्च दुःखिताः । न चाऽऽगमिष्यद्भवती
    भुवं चेत्पुण्योदके गौतमि शम्भुकान्ते ॥ ९॥ को वेत्ति भाग्यं नरदेहभाजां महीगतानां सरितामधीशे । एषां
    महापातकसङ्घहन्त्री त्वमम्ब गङ्गे सुलभा सदैव ॥ १०॥ न ते विभूतिं ननु वेत्ति कोऽपि त्रैलोक्यवन्द्ये जगदम्ब
    गङ्गे । गौरीसमालिङ्गितविग्रहोऽपि धत्ते स्मरारिः शिरसाऽपि यत्त्वाम् ॥ ११॥ नमोऽस्तु ते मातरभीष्टदायिनि
    नमोऽस्तु ते ब्रह्ममयेऽघनाशिनि । नमोऽस्तु ते विष्णुपदाब्जनिःसृते नमोऽस्तु ते शम्भुजटाविनिःसृते ॥ १२॥
    इति ब्रह्मपुराणे एकोनविंशाधिकशततमाध्यायान्तर्गतं ओषधिभिः कृतं गौतमी
meaning: {}
