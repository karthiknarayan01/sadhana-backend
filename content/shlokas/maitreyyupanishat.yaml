id: maitreyyupanishat
category: upanishad
name:
  english: maitreyyupanishat
  devanagari: मैत्रेय्युपनिषत्
content:
  english: maitreyyupanishat upanishad shrutyacaryopadeshena munayo yatpadam yayuh | tatsvanubhutisamsiddham
    svamatram brahma bhavaye || om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca
    sarvani sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    me'stu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih
    || om brihadratho vai nama raja rajye jyeshtham putram nidhapayitvedamashashvatam manyamanah shariram
    vairagyamupeto'ranyam nirjagama | sa tatra paramam tapa asthayadityamikshamana urdhvabahuh tishthatyante
    sahasrasya munerantikamajagamagnirivadhumakastejasa nirdahannivatmavidbhagavanchakayanya uttishthottishtha
    varam vrinishveti rajanamabravitsa tasmai namaskrityovaca bhagavannahamatmavittvam tattvavicchrinumo
    vayam sa tvam no bruhityetadvrittam purastadashakyam ma priccha prashnamaikshvakanyankamanvrinishveti
    shakayanyasya caranavabhimrishyamano rajemam gatham jagada || 1|| atha kimetairvanyanam shoshanam
    maharnavanam shikharinam prapatanam dhruvasya pracalanam sthanam va tarunam nimajjanam prithivyah
    sthanadapasaranam suranam so'hamityetadvidhe'sminsamsare kim kamopabhogairyairevashritasyasakridupavartanam
    drishyata ityuddhartumarhasityandhodapanastho bheka ivahamasminsamsare bhagavamstvam no gatiriti ||
    2|| bhagavanchariramidam maithunadevodbhutam samvidapetam niraya eva mutradvarena nishkrantamasthibhishcitam
    mamsenanuliptam carmanavabaddham vinmutravatapittakaphamajjamedovasabhiranyaishca malairbahubhih paripurnametadrishe
    sharire vartamanasya bhagavamstvam no gatiriti || 3|| atha bhagavanchakayanyah suprito'bravidrajanam
    maharaja brihadrathekshvakurvamshadhvajashirshatmajnah kritakrityastvam marunnamno vishruto'sityayam
    khalvatma te katamo bhagavanvarnya iti tam hovaca ||4|| shabdasparshadayo ye'rtha anartha iva te sthitah
    | yesham saktastu bhutatma na smarecca param padam || 5 || tapasa prapyate sattvam sattvatsamprapyate
    manah | manasa prapyate hyatma hyatmapattya nivartate || 6 || yatha nirindhano vahnih svayonavupashamyati
    | tatha vrittikshayaccittam svayonavupashamyati || 7 || svayonavupashantasya manasah satyagaminah
    | indriyarthavimudhasyanritah karmavashanugah || 8 || cittameva hi samsarastatprayatnena shodhayet
    | yaccittastanmayo bhavati guhyametatsanatanam || 9 || cittasya hi prasadena hanti karma shubhashubham
    | prasannatmatmani sthitva sukhamakshayamashnute || 10 || samasaktam yada cittam jantorvishayagocaram
    | yadyevam brahmani syattatko na mucyeta bandhanat || 11 || hritpundarikamadhye tu bhavayetparameshvaram
    | sakshinam buddhivrittasya paramapremagocaram || 12 || agocaram manovacamavadhutadhisamplavam | sattamatraprakashaikaprakasham
    bhavanatigam || 13 || aheyamanupadeyamasamanyavisheshanam | dhruvam stimitagambhiram na tejo na tamastatam
    | nirvikalpam nirabhasam nirvanamayasamvidam || 14 || nityah shuddho buddhamuktasvabhavah satyah sukshmah
    samvibhushcadvitiyah | anandabdhiryah parah so'hamasmi pratyagdhaturnatra samshitirasti || 15 || anandamantarnijamashrayam
    tamashapishacimavamanayantam | alokayantam jagadindrajalamapatkatham mam pravishedasangam || 16 ||
    varnashramacarayuta vimudhah karmanusarena phalam labhante | varnadidharmam hi parityajantah svanandatriptah
    purusha bhavanti || 17 || varnashramam savayavam svarupamadyantayuktam hyatikricchrmatram | putradideheshvabhimanashunyam
    bhutva vasetsaukhyatame hyananta iti || 18 || || iti prathamo'dhyayah || atha bhagavanmaitreyah kailasam
    jagama tam gatvovaca bho bhagavanparamatattvarahasyamanubruhiti || sa hovaca mahadevah || deho devalayah
    proktah sa jivah kevalah shivah | tyajedajnananirmalyam so'hambhavena pujayet || 1 || abhedadarshanam
    jnanam dhyanam nirvishayam manah| snanam manomalatyagah shaucamindriyanigrahah || 2 || brahmamritam
    pibedbhaikshamacareddeharakshane | vasedekantiko bhutva caikante dvaitavarjite | ityevamacareddhimansa
    evam muktimapnuyat || 3 || jatam mritamidam deham matapitrimalatmakam | sukhaduhkhalayamedhyam sprishtva
    snanam vidhiyate || 4 || dhatubaddham maharogam papamandiramadhruvam | vikarakaravistirnam sprishtva
    snanam vidhiyate || 5 || navadvaramalasravam sada kale svabhavajam | durgandham durmalopetam sprishtva
    snanam vidhiyate || 6 || matrisutakasambandham sutake saha jayate | mritasutakajam deham sprishtva
    snanam vidhiyate || 7 || ahammameti vinmutralepagandhadimocanam | shuddhashaucamiti proktam mrijjalabhyam
    tu laukikam || 8 || cittashuddhikaram shaucam vasanatrayanashanam | jnanavairagyamrittoyaih kshalanacchaucamucyate
    || 9 || advaitabhavana bhaikshamabhakshyam dvaitabhavanam | gurushastroktabhavena bhikshorbhaiksham
    vidhiyate || 10 || vidvansvadeshamutsrijya samnyasanantaram svatah | karagaravinirmuktacoravaddurato
    vaset || 11 || ahankarasutam vittabhrataram mohamandiram | ashapatnim tyajedyavattavanmukto na samshayah
    || 12 || mrita mohamayi mata jato bodhamayah sutah | sutakadvayasampraptau katham sandhyamupasmahe
    || 13 || hridakashe cidadityah sada bhasati bhasati | nastameti na codeti katham sandhyamupasmahe
    || 14 || ekamevadvitiyam yadgurorvakyena nishcitam | etadekantamityuktam na matho na vanantaram ||
    15 || asamshayavatam muktih samshayavishtacetasam | na muktirjanmajanmante tasmadvishvasamapnuyat
    || 16 || karmatyaganna samnyaso na praishoccaranena tu | sandhau jivatmanoraikyam samnyasah parikirtitah
    || 17 || vamanaharavadyasya bhati sarveshanadishu | tasyadhikarah samnyase tyaktadehabhimaninah ||
    18 || yada manasi vairagyam jatam sarveshu vastushu | tadaiva samnyasedvidvananyatha patito bhavet
    || 19 || dravyarthamannavastrartham yah pratishtharthameva va | samnyasedubhayabhrashtah sa muktim
    naptumarhati || 20 || uttama tattvacintaiva madhyamam shastracintanam | adhama mantracinta ca tirthabhrantyadhamadhama
    || 21 || anubhutim vina mudho vritha brahmani modate | pratibimbitashakhagraphalasvadanamodavat ||
    22 || na tyajeccedyatirmukto yo madhukaramantaram | vairagyajanakam shraddhakalatram jnananandanam
    || 23 || dhanavriddha vayovriddha vidyavriddhastathaiva ca | te sarve jnanavriddhasya kinkarah shishyakinkarah
    || 24 || yanmayaya mohitacetaso mamatmanamapurnamalabdhavantah | param vidagdhodarapuranaya bhramanti
    kaka iva surayo'pi || 25 || pashanalohamanimrinmayavigraheshu puja punarjananabhogakari mumukshoh
    | tasmadyatih svahridayarcanameva kuryadbahyarcanam pariharedapunarbhavaya || 26 || antahpurno bahihpurnah
    purnakumbha ivarnave | antahshunyo bahihshunyah shunyakumbha ivambare || 27 || ma bhava grahyabhavatma
    grahakatma ca ma bhava | bhavanamakhilam tyaktva yacchishtam tanmayo bhava || 28 || drashtridarshanadrishyani
    tyaktva vasanaya saha | darshanaprathamabhasamatmanam kevalam bhaja || 29 || samshantasarvasankalpa
    ya shilavadavasthitih | jagrannidravinirmukta sa svarupasthitih para || 30 || || iti dvitiyo'dhyayah
    || ahamasmi parashcasmi brahmasmi prabhavo'smyaham | sarvalokagurushcasmi sarvaloke'smi so'smyaham
    || 1 || ahamevasmi siddho'smi shuddho'smi paramo'smyaham | ahamasmi sadasò'smi nityo'smi vimalo'smyaham
    || 2 || vijnano'smi vishesho'smi somo'smi sakalo'smyaham | shubho'smi shokahino'smi caitanyo'smi samo'smyaham
    || 3 || manavamanahino'smi nirguno'smi shivo'smyaham | dvaitadvaitavihino'smi dvandvahino'smi so'smyaham
    || 4 || bhavabhavavihino'smi bhasahino'smi bhasmyaham | shunyashunyaprabhavo'smi shobhanashobhano'smyaham
    || 5 || tulyatulyavihino'smi nityah shuddhah sadashivah | sarvasarvavihino'smi sattviko'smi sadasmyaham
    || 6 || ekasankhyavihino'smi dvisankhyavanaham na ca | sadasadbhedahino'smi sankalparahitosmyaham
    || 7 || nanatmabhedahino'smi hyakhandanandavigrahah | nahamasmi na canyo'smi dehadirahito'smyaham
    || 8 || ashrayashrayahino'smi adhararahito'smyaham | bandhamokshadihino'smi shuddhabrahmasmi so'smyaham
    || 9 || cittadisarvahino'smi paramo'smi paratparah | sada vicararupo'smi nirvicaro'smi so'smyaham
    || 10 || akarokararupo'smi makaro'smi sanatanah | dhyatridhyanavihino'smi dhyeyahino'smi so'smyaham
    || 11 || sarvatrapurnasvarupo'smi saccidanandalakshanah | sarvatirthasvarupo'smi paramatmasmyaham
    shivah || 12 || lakshyalakshyavihino'smi layahinaraso'smyaham | matrimanavihino'smi meyahinah shivo'smyaham
    || 13 || na jagatsarvadrashtasmi netradirahitosmyaham | pravriddho'smi prabuddho'smi prasanno'smi
    haro'smyaham || 14 || sarvendriyavihino'smi sarvakarmakridapyaham | sarvavedantatripto'smi sarvada
    sulabho'smyaham || 15 || muditamuditakhyo'smi sarvamaunaphalo'smyaham | nityacinmatrarupo'smi sada
    saccinmayo'smyaham || 16 || yatkincidapi hino'smi svalpamapyati nasmyaham | hridayagranthihino'smi
    hridayambujamadhyagah || 17 || shadvikaravihino'smi shatkosharahito'smyaham | arishadvargamukto'smi
    antaradantaro'smyaham || 18 || deshakalavimukto'smi digambarasukho'smyaham | nasti nasti vimukto'smi
    nakarahito'smyaham || 19 || akhandakasharupo'smi hyakhandakaramasmyaham | prapancamuktacitto'smi prapancarahito'smyaham
    || 20 || sarvaprakasharupo'smi cinmatrajyotirasmyaham | kalatrayavimukto'smi kamadirahito'smyaham
    || 21 || kayikadivimukto'smi nirgunah kevalo'smyaham | muktihino'smi mukto'smi mokshahino'smyaham
    sada || 22 || satyasatyadihino'smi sanmatrannasmyaham sada | gantavyadeshahino'smi gamanadivivarjitah
    || 23 || sarvada samarupo'smi shanto'smi purushottamah | evam svanubhavo yasya so'hamasmi na samshayah
    || 24 || yah shrinoti sakridvapi brahmaiva bhavati svayamityupanishat || || iti tritiyo'dhyayah ||
    om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam me'stu tadatmani nirate
    ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || || iti maitreyyupanishatsamapta
    || adhikadhyayanaya
  devanagari: मैत्रेय्युपनिषत् उपनिषद् श्रुत्याचार्योपदेशेन मुनयो यत्पदं ययुः । तत्स्वानुभूतिसंसिद्धं
    स्वमात्रं ब्रह्म भावये ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि
    सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेऽस्तु तदात्मनि
    निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ बृहद्रथो वै नाम
    राजा राज्ये ज्येष्ठं पुत्रं निधापयित्वेदमशाश्वतं मन्यमानः शरीरं वैराग्यमुपेतोऽरण्यं निर्जगाम । स तत्र
    परमं तप आस्थायादित्यमीक्षमाण ऊर्ध्वबाहुः तिष्ठत्यन्ते सहस्रस्य मुनेरन्तिकमाजगामाग्निरिवाधूमकस्तेजसा
    निर्दहन्निवात्मविद्भगवाञ्छाकायन्य उत्तिष्ठोत्तिष्ठ वरं वृणीष्वेति राजानमब्रवीत्स तस्मै नमस्कृत्योवाच
    भगवन्नाहमात्मवित्त्वं तत्त्वविच्छृणुमो वयं स त्वं नो ब्रूहीत्येतद्वृत्तं पुरस्तादशक्यं मा पृच्छ प्रश्नमैक्ष्वाकान्यान्कामान्वृणीष्वेति
    शाकायन्यस्य चरणावभिमृश्यमानो राजेमां गाथां जगाद ॥ १॥ अथ किमेतैर्वान्यानां शोषणं महार्णवानां शिखरिणां
    प्रपतनं ध्रुवस्य प्रचलनं स्थानं वा तरूणां निमज्जनं पृथिव्याः स्थानादपसरणं सुराणां सोऽहमित्येतद्विधेऽस्मिन्संसारे
    किं कामोपभोगैर्यैरेवाश्रितस्यासकृदुपावर्तनं दृश्यत इत्युद्धर्तुमर्हसीत्यन्धोदपानस्थो भेक इवाहमस्मिन्संसारे
    भगवंस्त्वं नो गतिरिति ॥ २॥ भगवञ्छरीरमिदं मैथुनादेवोद्भूतं संविदपेतं निरय एव मूत्रद्वारेण निष्क्रान्तमस्थिभिश्चितं
    मांसेनानुलिप्तं चर्मणावबद्धं विण्मूत्रवातपित्तकफमज्जामेदोवसाभिरन्यैश्च मलैर्बहुभिः परिपूर्णमेतादृशे
    शरीरे वर्तमानस्य भगवंस्त्वं नो गतिरिति ॥ ३॥ अथ भगवाञ्छाकायन्यः सुप्रीतोऽब्रवीद्राजानं महाराज बृहद्रथेक्ष्वाकुर्वंशध्वजशीर्षात्मज्ञः
    कृतकृत्यस्त्वं मरुन्नाम्नो विश्रुतोऽसीत्ययं खल्वात्मा ते कतमो भगवान्वर्ण्य इति तं होवाच ॥४॥ शब्दस्पर्शादयो
    येऽर्था अनर्था इव ते स्थिताः । येषां सक्तस्तु भूतात्मा न स्मरेच्च परं पदम् ॥ ५ ॥ तपसा प्राप्यते सत्त्वं
    सत्त्वात्संप्राप्यते मनः । मनसा प्राप्यते ह्यात्मा ह्यात्मापत्त्या निवर्तते ॥ ६ ॥ यथा निरिन्धनो वह्निः
    स्वयोनावुपशाम्यति । तथा वृत्तिक्षयाच्चित्तं स्वयोनावुपशाम्यति ॥ ७ ॥ स्वयोनावुपशान्तस्य मनसः सत्यगामिनः
    । इन्द्रियार्थविमूढस्यानृताः कर्मवशानुगाः ॥ ८ ॥ चित्तमेव हि संसारस्तत्प्रयत्नेन शोधयेत् । यच्चित्तस्तन्मयो
    भवति गुह्यमेतत्सनातनम् ॥ ९ ॥ चित्तस्य हि प्रसादेन हन्ति कर्म शुभाशुभम् । प्रसन्नात्मात्मनि स्थित्वा
    सुखमक्षयमश्नुते ॥ १० ॥ समासक्तं यदा चित्तं जन्तोर्विषयगोचरम् । यद्येवं ब्रह्मणि स्यात्तत्को न मुच्येत
    बन्धनात् ॥ ११ ॥ हृत्पुण्डरीकमध्ये तु भावयेत्परमेश्वरम् । साक्षिणं बुद्धिवृत्तस्य परमप्रेमगोचरम् ॥
    १२ ॥ अगोचरं मनोवाचामवधूताधिसंप्लवम् । सत्तामात्रप्रकाशैकप्रकाशं भावनातिगम् ॥ १३ ॥ अहेयमनुपादेयमसामान्यविशेषणम्
    । ध्रुवं स्तिमितगम्भीरं न तेजो न तमस्ततम् । निर्विकल्पं निराभासं निर्वाणमयसंविदम् ॥ १४ ॥ नित्यः शुद्धो
    बुद्धमुक्तस्वभावः सत्यः सूक्ष्मः संविभुश्चाद्वितीयः । आनन्दाब्धिर्यः परः सोऽहमस्मि प्रत्यग्धातुर्नात्र
    संशीतिरस्ति ॥ १५ ॥ आनन्दमन्तर्निजमाश्रयं तमाशापिशाचीमवमानयन्तम् । आलोकयन्तं जगदिन्द्रजालमापत्कथं मां
    प्रविशेदसङ्गम् ॥ १६ ॥ वर्णाश्रमाचारयुता विमूढाः कर्मानुसारेण फलं लभन्ते । वर्णादिधर्मं हि परित्यजन्तः
    स्वानन्दतृप्ताः पुरुषा भवन्ति ॥ १७ ॥ वर्णाश्रमं सावयवं स्वरूपमाद्यन्तयुक्तं ह्यतिकृच्छ्र्मात्रम् ।
    पुत्रादिदेहेष्वभिमानशून्यं भूत्वा वसेत्सौख्यतमे ह्यनन्त इति ॥ १८ ॥ ॥ इति प्रथमोऽध्यायः ॥ अथ भगवान्मैत्रेयः
    कैलासं जगाम तं गत्वोवाच भो भगवन्परमतत्त्वरहस्यमनुब्रूहीति ॥ स होवाच महादेवः ॥ देहो देवालयः प्रोक्तः
    स जीवः केवलः शिवः । त्यजेदज्ञाननिर्माल्यं सोऽहंभावेन पूजयेत् ॥ १ ॥ अभेददर्शनं ज्ञानं ध्यानं निर्विषयं
    मनः। स्नानं मनोमलत्यागः शौचमिन्द्रियनिग्रहः ॥ २ ॥ ब्रह्मामृतं पिबेद्भैक्षमाचरेद्देहरक्षणे । वसेदेकान्तिको
    भूत्वा चैकान्ते द्वैतवर्जिते । इत्येवमाचरेद्धीमान्स एवं मुक्तिमाप्नुयात् ॥ ३ ॥ जातं मृतमिदं देहं मातापितृमलात्मकम्
    । सुखदुःखालयामेध्यं स्पृष्ट्वा स्नानं विधीयते ॥ ४ ॥ धातुबद्धं महारोगं पापमन्दिरमध्रुवम् । विकाराकारविस्तीर्णं
    स्पृष्ट्वा स्नानं विधीयते ॥ ५ ॥ नवद्वारमलस्रावं सदा काले स्वभावजम् । दुर्गन्धं दुर्मलोपेतं स्पृष्ट्वा
    स्नानं विधीयते ॥ ६ ॥ मातृसूतकसम्बन्धं सूतके सह जायते । मृतसूतकजं देहं स्पृष्ट्वा स्नानं विधीयते ॥
    ७ ॥ अहंममेति विण्मूत्रलेपगन्धादिमोचनम् । शुद्धशौचमिति प्रोक्तं मृज्जलाभ्यां तु लौकिकम् ॥ ८ ॥ चित्तशुद्धिकरं
    शौचं वासनात्रयनाशनम् । ज्ञानवैराग्यमृत्तोयैः क्षालनाच्छौचमुच्यते ॥ ९ ॥ अद्वैतभावना भैक्षमभक्ष्यं द्वैतभावनम्
    । गुरुशास्त्रोक्तभावेन भिक्षोर्भैक्षं विधीयते ॥ १० ॥ विद्वान्स्वदेशमुत्सृज्य संन्यासानन्तरं स्वतः
    । कारागारविनिर्मुक्तचोरवद्दूरतो वसेत् ॥ ११ ॥ अहङ्कारसुतं वित्तभ्रातरं मोहमन्दिरम् । आशापत्नीं त्यजेद्यावत्तावन्मुक्तो
    न संशयः ॥ १२ ॥ मृता मोहमयी माता जातो बोधमयः सुतः । सूतकद्वयसम्प्राप्तौ कथं सन्ध्यामुपास्महे ॥ १३ ॥
    हृदाकाशे चिदादित्यः सदा भासति भासति । नास्तमेति न चोदेति कथं सन्ध्यामुपास्महे ॥ १४ ॥ एकमेवाद्वितीयं
    यद्गुरोर्वाक्येन निश्चितम् । एतदेकान्तमित्युक्तं न मठो न वनान्तरम् ॥ १५ ॥ असंशयवतां मुक्तिः संशयाविष्टचेतसाम्
    । न मुक्तिर्जन्मजन्मान्ते तस्माद्विश्वासमाप्नुयात् ॥ १६ ॥ कर्मत्यागान्न संन्यासो न प्रैषोच्चारणेन
    तु । सन्धौ जीवात्मनोरैक्यं संन्यासः परिकीर्तितः ॥ १७ ॥ वमनाहारवद्यस्य भाति सर्वेषणादिषु । तस्याधिकारः
    संन्यासे त्यक्तदेहाभिमानिनः ॥ १८ ॥ यदा मनसि वैराग्यं जातं सर्वेषु वस्तुषु । तदैव संन्यसेद्विद्वानन्यथा
    पतितो भवेत् ॥ १९ ॥ द्रव्यार्थमन्नवस्त्रार्थं यः प्रतिष्ठार्थमेव वा । संन्यसेदुभयभ्रष्टः स मुक्तिं
    नाप्तुमर्हति ॥ २० ॥ उत्तमा तत्त्वचिन्तैव मध्यमं शास्त्रचिन्तनम् । अधमा मन्त्रचिन्ता च तीर्थभ्रान्त्यधमाधमा
    ॥ २१ ॥ अनुभुतिं विना मूढो वृथा ब्रह्मणि मोदते । प्रतिबिम्बितशाखाग्रफलास्वादनमोदवत् ॥ २२ ॥ न त्यजेच्चेद्यतिर्मुक्तो
    यो माधुकरमान्तरम् । वैराग्यजनकं श्रद्धाकलत्रं ज्ञाननन्दनम् ॥ २३ ॥ धनवृद्धा वयोवृद्धा विद्यावृद्धास्तथैव
    च । ते सर्वे ज्ञानवृद्धस्य किङ्कराः शिष्यकिङ्कराः ॥ २४ ॥ यन्मायया मोहितचेतसो मामात्मानमापूर्णमलब्धवन्तः
    । परं विदग्धोदरपूरणाय भ्रमन्ति काका इव सूरयोऽपि ॥ २५ ॥ पाषाणलोहमणिमृण्मयविग्रहेषु पूजा पुनर्जननभोगकरी
    मुमुक्षोः । तस्माद्यतिः स्वहृदयार्चनमेव कुर्याद्बाह्यार्चनं परिहरेदपुनर्भवाय ॥ २६ ॥ अन्तःपूर्णो बहिःपूर्णः
    पूर्णकुम्भ इवार्णवे । अन्तःशून्यो बहिःशून्यः शून्यकुम्भ इवाम्बरे ॥ २७ ॥ मा भव ग्राह्यभावात्मा ग्राहकात्मा
    च मा भव । भावनामखिलां त्यक्त्वा यच्छिष्टं तन्मयो भव ॥ २८ ॥ द्रष्टृदर्शनदृश्यानि त्यक्त्वा वासनया सह
    । दर्शनप्रथमाभासमात्मानं केवलं भज ॥ २९ ॥ संशान्तसर्वसङ्कल्पा या शिलावदवस्थितिः । जाग्रन्निद्राविनिर्मुक्ता
    सा स्वरूपस्थितिः परा ॥ ३० ॥ ॥ इति द्वितीयोऽध्यायः ॥ अहमस्मि परश्चास्मि ब्रह्मास्मि प्रभवोऽस्म्यहम्
    । सर्वलोकगुरुश्चास्मि सर्वलोकेऽस्मि सोऽस्म्यहम् ॥ १ ॥ अहमेवास्मि सिद्धोऽस्मि शुद्धोऽस्मि परमोऽस्म्यहम्
    । अहमस्मि सदासॊऽस्मि नित्योऽस्मि विमलोऽस्म्यहम् ॥ २ ॥ विज्ञानोऽस्मि विशेषोऽस्मि सोमोऽस्मि सकलोऽस्म्यहम्
    । शुभोऽस्मि शोकहीनोऽस्मि चैतन्योऽस्मि समोऽस्म्यहम् ॥ ३ ॥ मानावमानहीनोऽस्मि निर्गुणोऽस्मि शिवोऽस्म्यहम्
    । द्वैताद्वैतविहीनोऽस्मि द्वन्द्वहीनोऽस्मि सोऽस्म्यहम् ॥ ४ ॥ भावाभावविहीनोऽस्मि भासाहीनोऽस्मि भास्म्यहम्
    । शून्याशून्यप्रभावोऽस्मि शोभनाशोभनोऽस्म्यहम् ॥ ५ ॥ तुल्यातुल्यविहीनोऽस्मि नित्यः शुद्धः सदाशिवः ।
    सर्वासर्वविहीनोऽस्मि सात्त्विकोऽस्मि सदास्म्यहम् ॥ ६ ॥ एकसङ्ख्याविहीनोऽस्मि द्विसङ्ख्यावानहं न च ।
    सदसद्भेदहीनोऽस्मि सङ्कल्परहितोस्म्यहम् ॥ ७ ॥ नानात्मभेदहीनोऽस्मि ह्यखण्डानन्दविग्रहः । नाहमस्मि न
    चान्योऽस्मि देहादिरहितोऽस्म्यहम् ॥ ८ ॥ आश्रयाश्रयहीनोऽस्मि आधाररहितोऽस्म्यहम् । बन्धमोक्षादिहीनोऽस्मि
    शुद्धब्रह्मास्मि सोऽस्म्यहम् ॥ ९ ॥ चित्तादिसर्वहीनोऽस्मि परमोऽस्मि परात्परः । सदा विचाररूपोऽस्मि निर्विचारोऽस्मि
    सोऽस्म्यहम् ॥ १० ॥ अकारोकाररूपोऽस्मि मकरोऽस्मि सनातनः । ध्यातृध्यानविहीनोऽस्मि ध्येयहीनोऽस्मि सोऽस्म्यहम्
    ॥ ११ ॥ सर्वत्रपूर्णस्वरूपोऽस्मि सच्चिदानन्दलक्षणः । सर्वतीर्थस्वरूपोऽस्मि परमात्मास्म्यहं शिवः ॥ १२
    ॥ लक्ष्यालक्ष्यविहीनोऽस्मि लयहीनरसोऽस्म्यहम् । मातृमानविहीनोऽस्मि मेयहीनः शिवोऽस्म्यहम् ॥ १३ ॥ न जगत्सर्वद्रष्टास्मि
    नेत्रादिरहितोस्म्यहम् । प्रवृद्धोऽस्मि प्रबुद्धोऽस्मि प्रसन्नोऽस्मि हरोऽस्म्यहम् ॥ १४ ॥ सर्वेन्द्रियविहीनोऽस्मि
    सर्वकर्मकृदप्यहम् । सर्ववेदान्ततृप्तोऽस्मि सर्वदा सुलभोऽस्म्यहम् ॥ १५ ॥ मुदितामुदिताख्योऽस्मि सर्वमौनफलोऽस्म्यहम्
    । नित्यचिन्मात्ररूपोऽस्मि सदा सच्चिन्मयोऽस्म्यहम् ॥ १६ ॥ यत्किञ्चिदपि हीनोऽस्मि स्वल्पमप्यति नास्म्यहम्
    । हृदयग्रन्थिहीनोऽस्मि हृदयाम्बुजमध्यगः ॥ १७ ॥ षड्विकारविहीनोऽस्मि षट्कोषरहितोऽस्म्यहम् । अरिषड्वर्गमुक्तोऽस्मि
    अन्तरादन्तरोऽस्म्यहम् ॥ १८ ॥ देशकालविमुक्तोऽस्मि दिगम्बरसुखोऽस्म्यहम् । नास्ति नास्ति विमुक्तोऽस्मि
    नकारहितोऽस्म्यहम् ॥ १९ ॥ अखण्डाकाशरूपोऽस्मि ह्यखण्डाकारमस्म्यहम् । प्रपञ्चमुक्तचित्तोऽस्मि प्रपञ्चरहितोऽस्म्यहम्
    ॥ २० ॥ सर्वप्रकाशरूपोऽस्मि चिन्मात्रज्योतिरस्म्यहम् । कालत्रयविमुक्तोऽस्मि कामादिरहितोऽस्म्यहम् ॥
    २१ ॥ कायिकादिविमुक्तोऽस्मि निर्गुणः केवलोऽस्म्यहम् । मुक्तिहीनोऽस्मि मुक्तोऽस्मि मोक्षहीनोऽस्म्यहं
    सदा ॥ २२ ॥ सत्यासत्यादिहीनोऽस्मि सन्मात्रान्नास्म्यहं सदा । गन्तव्यदेशहीनोऽस्मि गमनादिविवर्जितः ॥
    २३ ॥ सर्वदा समरूपोऽस्मि शान्तोऽस्मि पुरुषोत्तमः । एवं स्वानुभवो यस्य सोऽहमस्मि न संशयः ॥ २४ ॥ यः शृणोति
    सकृद्वापि ब्रह्मैव भवति स्वयमित्युपनिषत् ॥ ॥ इति तृतीयोऽध्यायः ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः
    श्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं
    मेऽस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
    ॥ इति मैत्रेय्युपनिषत्समाप्ता ॥ अधिकाध्ययनाय
