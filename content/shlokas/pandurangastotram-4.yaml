id: pandurangastotram-4
category: stotram
name:
  english: pandurangastotram 4
  devanagari: पाण्डुरन्गस्तोत्रम् ४
content:
  english: saubhagyamasya gamitamatinutim svardhunibhagyato'pi | pathahsparshadapankamalamiyamavanimeva
    no candrabhaga kartum kirtya trilokimapi ca vijayate tirthapadapriya te || 19|| devastirthani santah
    khalu satatamapi snatumayanti harsha
  devanagari: सौभाग्यमस्या गमितमतिनुतिं स्वर्धुनीभाग्यतोऽपि । पाथःस्पर्शादपङ्कामलमियमवनीमेव नो चन्द्रभागा
    कर्तुं कीर्त्या त्रिलोकीमपि च विजयते तीर्थपादप्रिया ते ॥ १९॥ देवास्तीर्थानि सन्तः खलु सततमपि स्नातुमायान्ति
    हर्षा
meaning: {}
