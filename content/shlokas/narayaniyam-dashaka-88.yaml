id: narayaniyam-dashaka-88
category: stotram
name:
  english: Narayaniyam Dashaka 88
content:
  english: pragevacaryaputrahritinishamanaya sviyashatsunuviksham kankshantya maturuktya sutalabhuvi balim
    prapya tenarcitastvam | dhatuh shapaddhiranyanvitakashipubhavan shaurijan kamsabhagna naniyainan pradarshya
    svapadamanayathah purvaputran mariceh || || shrutadeva iti shrutam dvijendram bahulashvam nripatim
    ca bhaktipurnam | yugapattvamanugrahitukamo mithilam prapitham tapasaih sametah || || gacchan dvimurtirubhayoryugapanniketa
    mekena bhurivibhavairvihitopacarah | anyena taddinabhritaishca phalaudanadyai stulyam praseditha dadatha
    ca muktimabhyam || || bhuyo'tha dvaravatyam dvijatanayamritim tatpralapanapi tvam ko va daivam nirundhyaditi
    kila kathayan vishvavodhapyasodhah | jishnorgarvam vinetum tvayi manujadhiya kunthitam casya buddhim
    tattvarudham vidhatum paramatamapadaprekshaneneti manye || || nashta ashtasya putrah punarapi tava
    tupekshaya kashtavadah spashto jato jananamatha tadavasare dvarakamapa parthah | maitrya tatroshito'sau
    navamasutamritau vipravaryaprarodam shrutva cakre pratijnamanupahritasutah sannivekshye krishanum
    || || mani sa tvamaprishtva dvijanilayagato banajalairmahastrai rundhanah sutigeham punarapi sahasa
    drishtanashte kumare | yamyamaindrim tatha'nyah suravaranagarirvidyaya''sadya sadyo moghodyogah patishyan
    hutabhuji bhavata sasmitam varito'bhut || || sardham tena praticim dishamatijavina syandanenabhiyato
    lokalokam vyatitastimirabharamatho cakradhamna nirundhan | cakramshuklishtadrishtim sthitamatha vijayam
    pashya pashyeti varam pare tvam pradadarshah kimapi hi tamasam duraduram padam te || || tatrasinam
    bhujangadhipashayanatale divyabhushayudhadyai ravitam pitacelam pratinavajaladashyamalam shrimadangam
    | murtinamishitaram paramiha tisrinamekamartham shrutinam tvameva tvam paratman priyasakhasahito nemitha
    kshemarupam || || yuvam mameva dvavadhikavivritantarhitataya vibhinnau sandrashtum svayamahamaharsham
    dvijasutan | nayetam dragetaniti khalu vitirnan punaramun dvijayadayadah pranutamahima pandujanusha
    || || evam nanaviharairjagadabhiramayan vrishnivamsham prapushna nnijano yajnabhedairatulavihritibhih
    prinayannenanetrah | bhubharakshepadambhat padakamalajusham mokshanayavatirnah purnam brahmaiva sakshadyadushu
    manujatarushitastvam vyalasih || || prayena dvaravatyamavritadayi tada naradastvadrasardra stasmallebhe
    kadacitkhalu sukritanidhistvatpita tattvabodham | bhaktanamagrayayi sa ca khalu matimanuddhavastvatta
    eva prapto vijnanasaram sa kila janahitayadhuna''ste badaryam || || so'yam krishnavataro jayati tava
    vibho yatra sauhardabhiti snehadveshanuragaprabhritibhiratulairashramairyogabhedaih | artim tirtva
    samastamamritapadamagussarvatah sarvalokah sa tvam vishvartishantyai pavanapurapate bhaktipurtyai
    ca bhuyah ||
  devanagari: प्रागेवाचार्यपुत्राहृतिनिशमनया स्वीयषट्सूनुवीक्षां काङ्क्षन्त्या मातुरुक्त्या सुतलभुवि बलिं
    प्राप्य तेनार्चितस्त्वम् । धातुः शापाद्धिरण्यान्वितकशिपुभवान् शौरिजान् कंसभग्ना नानीयैनान् प्रदर्श्य
    स्वपदमनयथाः पूर्वपुत्रान् मरीचेः ॥ ॥ श्रुतदेव इति श्रुतं द्विजेन्द्रं बहुलाश्वं नृपतिं च भक्तिपूर्णम्
    । युगपत्त्वमनुग्रहीतुकामो मिथिलां प्रापिथं तापसैः समेतः ॥ ॥ गच्छन् द्विमूर्तिरुभयोर्युगपन्निकेत मेकेन
    भूरिविभवैर्विहितोपचारः । अन्येन तद्दिनभृतैश्च फलौदनाद्यै स्तुल्यं प्रसेदिथ ददथ च मुक्तिमाभ्याम् ॥
    ॥ भूयोऽथ द्वारवत्यां द्विजतनयमृतिं तत्प्रलापानपि त्वम् को वा दैवं निरुन्ध्यादिति किल कथयन् विश्ववोढाप्यसोढाः
    । जिष्णोर्गर्वं विनेतुं त्वयि मनुजधिया कुण्ठितां चास्य बुद्धिं तत्त्वारूढां विधातुं परमतमपदप्रेक्षणेनेति
    मन्ये ॥ ॥ नष्टा अष्टास्य पुत्राः पुनरपि तव तूपेक्षया कष्टवादः स्पष्टो जातो जनानामथ तदवसरे द्वारकामाप
    पार्थः । मैत्र्या तत्रोषितोऽसौ नवमसुतमृतौ विप्रवर्यप्ररोदं श्रुत्वा चक्रे प्रतिज्ञामनुपहृतसुतः सन्निवेक्ष्ये
    कृशानुम् ॥ ॥ मानी स त्वामपृष्ट्वा द्विजनिलयगतो बाणजालैर्महास्त्रै रुन्धानः सूतिगेहं पुनरपि सहसा दृष्टनष्टे
    कुमारे । याम्यामैन्द्रीं तथाऽन्याः सुरवरनगरीर्विद्ययाऽऽसाद्य सद्यो मोघोद्योगः पतिष्यन् हुतभुजि भवता
    सस्मितं वारितोऽभूत् ॥ ॥ सार्धं तेन प्रतीचीं दिशमतिजविना स्यन्दनेनाभियातो लोकालोकं व्यतीतस्तिमिरभरमथो
    चक्रधाम्ना निरुन्धन् । चक्रांशुक्लिष्टदृष्टिं स्थितमथ विजयं पश्य पश्येति वारां पारे त्वं प्राददर्शः
    किमपि हि तमसां दूरदूरं पदं ते ॥ ॥ तत्रासीनं भुजङ्गाधिपशयनतले दिव्यभूषायुधाद्यै रावीतं पीतचेलं प्रतिनवजलदश्यामलं
    श्रीमदङ्गम् । मूर्तीनामीशितारं परमिह तिसृणामेकमर्थं श्रुतीनां त्वामेव त्वं परात्मन् प्रियसखसहितो नेमिथ
    क्षेमरूपम् ॥ ॥ युवां मामेव द्वावधिकविवृतान्तर्हिततया विभिन्नौ सन्द्रष्टुं स्वयमहमहार्षं द्विजसुतान्
    । नयेतं द्रागेतानिति खलु वितीर्णान् पुनरमून् द्विजायादायादाः प्रणुतमहिमा पाण्डुजनुषा ॥ ॥ एवं नानाविहारैर्जगदभिरमयन्
    वृष्णिवंशं प्रपुष्ण न्नीजानो यज्ञभेदैरतुलविहृतिभिः प्रीणयन्नेणनेत्राः । भूभारक्षेपदम्भात् पदकमलजुषां
    मोक्षणायावतीर्णः पूर्णं ब्रह्मैव साक्षाद्यदुषु मनुजतारूषितस्त्वं व्यलासीः ॥ ॥ प्रायेण द्वारवत्यामवृतदयि
    तदा नारदस्त्वद्रसार्द्र स्तस्माल्लेभे कदाचित्खलु सुकृतनिधिस्त्वत्पिता तत्त्वबोधम् । भक्तानामग्रयायी
    स च खलु मतिमानुद्धवस्त्वत्त एव प्राप्तो विज्ञानसारं स किल जनहितायाधुनाऽऽस्ते बदर्याम् ॥ ॥ सोऽयं कृष्णावतारो
    जयति तव विभो यत्र सौहार्दभीति स्नेहद्वेषानुरागप्रभृतिभिरतुलैरश्रमैर्योगभेदैः । आर्तिं तीर्त्वा समस्ताममृतपदमगुस्सर्वतः
    सर्वलोकाः स त्वं विश्वार्तिशान्त्यै पवनपुरपते भक्तिपूर्त्यै च भूयाः ॥
