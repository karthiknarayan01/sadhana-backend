id: kashi-panchakam
category: stotram
name:
  english: Kashi Panchakam
content:
  english: mano nivrittih paramopashantih sa tirthavarya manikarnika ca jnanapravaha vimaladiganga sa
    kashikaham nijabodharupa || || yasyamidam kalpitamindrajalam caracaram bhati manovilasam saccitsukhaika
    paramatmarupa sa kashikaham nijabodharupa || || kosheshu pancasvadhirajamana buddhirbhavani pratidehageham
    sakshi shivah sarvagato'ntaratma sa kashikaham nijabodharupa || || kashya hi kashata kashi kashi sarvaprakashika
    sa kashi vidita yena tena prapta hi kashika || || kashikshetram shariram tribhuvanajanani vyapini
    jnanaganga bhakti shraddha gayeyam nijagurucaranadhyanayogah prayagah vishvesho'yam turiyah sakalajanamanah
    sakshibhuto'ntaratma dehe sarvam madiye yadi vasati punastirthamanyatkimasti || || || iti shrimacchankaracaryaviracita
    kashi pancakam prayatashtakam ||
  devanagari: मनो निवृत्तिः परमोपशान्तिः सा तीर्थवर्या मणिकर्णिका च ज्ञानप्रवाहा विमलादिगङ्गा सा काशिकाहं
    निजबोधरूपा ॥ ॥ यस्यामिदं कल्पितमिन्द्रजालं चराचरं भाति मनोविलासं सच्चित्सुखैका परमात्मरूपा सा काशिकाहं
    निजबोधरूपा ॥ ॥ कोशेषु पञ्चस्वधिराजमाना बुद्धिर्भवानी प्रतिदेहगेहं साक्षी शिवः सर्वगतोऽन्तरात्मा सा
    काशिकाहं निजबोधरूपा ॥ ॥ काश्या हि काशत काशी काशी सर्वप्रकाशिका सा काशी विदिता येन तेन प्राप्ता हि
    काशिका ॥ ॥ काशीक्षेत्रं शरीरं त्रिभुवनजननी व्यापिनी ज्ञानगङ्गा भक्ति श्रद्धा गयेयं निजगुरुचरणध्यानयोगः
    प्रयागः विश्वेशोऽयं तुरीयः सकलजनमनः साक्षिभूतोऽन्तरात्मा देहे सर्वं मदीये यदि वसति पुनस्तीर्थमन्यत्किमस्ति
    ॥ ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता काशी पञ्चकं प्रयाताष्टकम् ॥
