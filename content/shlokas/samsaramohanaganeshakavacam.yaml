id: samsaramohanaganeshakavacam
category: kavacha
name:
  english: samsaramohanaganeshakavacam
  devanagari: संसारमोहनगणेशकवचम्
content:
  english: samsaramohanam ganeshakavacam shrivishnuruvaca | samsaramohanasyasya kavacasya prajapatih |
    rishishchandashca brihati devo lambodarah svayam || 1|| dharmarthakamamoksheshu viniyogah prakirtitah
    | sarvesham kavacanan'ca sarabhutamidam mune || 2|| om gam hum shrim ganeshaya svaha me patu mastakam
    | dvatrimshadaksharo mantro lalatam me sada'vatu || 3|| om hrim klim shrim gamiti ca santatam patu
    locanam | talukam patu vighneshah santatam dharanitale || 4|| om hrim shrim klimiti santatam patu
    nasikam | om gaum gam shurpakarnaya svaha patvadharam mama || 5|| dantani talukam jihvam patu me shodashaksharah
    || 6|| om lam shrim lambodarayeti svaha gandam sada'vatu | om klim hrim vighnanashaya svaha karnam
    sada'vatu || 7|| om shrim gam gajananayeti svaha skandham sada'vatu | om hrim vinayakayeti svaha prishtham
    sada'vatu || 8|| om klim hrimiti kankalam patu vakshahsthalan'ca gam | panau padau sada patu sarvangam
    vighnanighnakrit || 9||
  devanagari: संसारमोहनं गणेशकवचम् श्रीविष्णुरुवाच । संसारमोहनस्यास्य कवचस्य प्रजापतिः । ऋषिश्छन्दश्च
    बृहती देवो लम्बोदरः स्वयम् ॥ १॥ धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः । सर्वेषां कवचानान्ऽच सारभूतमिदं
    मुने ॥ २॥ ॐ गं हुं श्रीं गणेशाय स्वाहा मे पातु मस्तकम् । द्वात्रिंशदक्षरो मन्त्रो ललाटं मे सदाऽवतु
    ॥ ३॥ ॐ ह्रीं क्लीं श्रीं गमिति च सन्ततं पातु लोचनम् । तालुकं पातु विघ्नेशः सन्ततं धरणीतले ॥ ४॥ ॐ ह्रीं
    श्रीं क्लीमिति सन्ततं पातु नासिकाम् । ॐ गौं गं शूर्पकर्णाय स्वाहा पात्वधरं मम ॥ ५॥ दन्ताणि तालुकां
    जिह्वां पातु मे षोडशाक्षरः ॥ ६॥ ॐ लं श्रीं लम्बोदरायेति स्वाहा गण्डं सदाऽवतु । ॐ क्लीं ह्रीं विघ्ननाशाय
    स्वहा कर्णं सदाऽवतु ॥ ७॥ ॐ श्रीं गं गजाननायेति स्वाहा स्कन्धं सदाऽवतु । ॐ ह्रीं विनायकायेति स्वाहा
    पृष्ठं सदाऽवतु ॥ ८॥ ॐ क्लीं ह्रीमिति कङ्कालं पातु वक्षःस्थलन्ऽच गम् । पाणौ पादौ सदा पातु सर्वाङ्गं
    विघ्ननिघ्नकृत् ॥ ९॥
