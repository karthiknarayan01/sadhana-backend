id: kalikakavacam-3-athava-jaganmangalakavacam-athava-shyamakavacam-bhairavatantrargatam
category: kavacha
name:
  english: kalikakavacam 3 athava jaganmangalakavacam athava shyamakavacam (bhairavatantrargatam)
  devanagari: कालिकाकवचम् ३ अथवा जगन्मङ्गलकवचम् अथवा श्यामाकवचम् (भैरवतन्त्रार्गतम्)
content:
  english: rinu vakshyami bhairavi pranavallabhe | shrijaganmangalannama kavacam mantravigraham || 3||
    pathitva dharayitva ca trailokyam mohayetkshanat | narayano'pi yaddhritva nari bhutva maheshvaram
    || 4|| yoginankshobhamanayadyaddhritva ca raghuttamah | varatripto jaghanaiva ravanadinishacaran ||
    5|| yasya prasadadisho'ham trailokyavijayi vibhuh | dhanadhipah kubero'pi suresho'bhucchacipatih ||
    6|| evam hi sakala devassarvasiddhishvarah priye | shrijaganmangalasyasya kavacasya rishih shivah
    || 7|| chando'nushtupdevata ca kalika dakshinerita | jagatam mohane dushtavijaye bhuktimuktishu ||
    8|| yoshidakarshane caiva viniyogah prakirtitah | shiro me kalika patu krinkaraikakshari para || 9||
    krinkrinkrim me lalatanca kalika khadgadharini | hum hum patu netrayugam hrim hrim patu shruti mama
    || 10|| dakshine kalika patu ghranayugmam maheshvari | krinkrinkrim rasanampatu hum hum patu kapolakam
    || 11|| vadanam sakalampatu hri~ hri~ svahasvarupini | dvavimshatyakshari skandhau mahavidya sukhaprada
    || 12|| khadgamundadhara kali sarvangamabhito'vatu | krimhru~hri~ tryakshari patu camunda hridayam
    mama || 13|| aimhu~omaim stanadvandvam hrimphatsvaha kakutsthalam | ashtakshari mahavidya bhujau patu
    sakartrika || 14|| krinkrimhumhumhrimhrinkari patu shadakshari mama | krim nabhim madhyadeshanca dakshine
    kalika'vatu || 15|| krimsvaha patu prishthanca kalika sa dashakshari | krim me guhyam sada patu kalikayai
    namastatah || 16|| saptakshari mahavidya sarvatantreshu gopita | hrimhrim dakshine kalike humhum patu
    katidvayam || 17|| kali dashakshari vidya svaha mamuruyugmakam | om krinkrim me svaha patu kalika
    januni sada || 18|| kalihrinnamavidyeyancaturvargaphalaprada | krimhrimhrim patu sa gulphandakshine
    kalika'vatu || 19|| krimhrumhrim svaha padampatu caturddashakshari mama | khadgamundadhara kali varadabhayadharini
    || 20|| vidyabhissakalabhih sa sarvangamabhito'vatu | kali kapalini kulla kurukulla virodhini || 21||
    vipracitta tathogrograprabha dipta ghanatvisha | nila ghana valaka ca matra mudra mita ca mam || 22||
    etassarvah khadgadhara mundamalavibhushanah | rakshantu digvidikshu mam brahmi narayani tatha || 23||
    maheshvari ca camunda kaumari caparajita | varahi narasimhi ca sarvashcamitabhushanah || 24|| rakshantu
    svayudhairdikshu vidikshu mam yatha tatha | iti te kathitam divyam kavacam paramadbhutam || 25|| shrijaganmangalannama
    mahavidyaughavigraham | trailokyakarshanam brahmankavacam manmukhoditam || 26|| gurupuja~ vidhayatha
    vidhivatprapathettatah | kavacantrissakridvapi yavajjivanca va punah || 27|| etacchatarddhamavritya
    trailokyavijayi bhavet | trailokyankshobhayatyeva kavacasya prasadatah || 28|| mahakavirbhavenmasam
    sarvasiddhishvaro bhavet | pushpanjalinkalikayai mulenaivarpayet sakrit || 29|| shatavarshasahasranam
    pujayah phalamapnuyat | bhurje vilikhitancaitat svarnasthandharayedyadi || 30|| vishakhayam dakshabahau
    kanthe va dharayedyadi | trailokyam mohayet krodhattrailokyancurnayetkshanat || 31|| putravandhanavanshrimannanavidyanidhirbhavet
    | brahmastradini shastrani tadgatrasparshanattatah || 32|| nashamayati ya nari vandhya va mritaputrini
    | bahvapatya jivatoka bhavatyeva na samshayah || 33|| na deyamparashishyebhyo hyabhaktebhyo visheshatah
    | shishyebhyo bhaktiyuktebhyo hyanyatha mrityumapnuyat || 34|| sparddhamuddhuya kamala vagdevi mandire
    sukhe | pautrantam sthairyamasthaya nivasatyeva nishcitam || 35|| idam kavacamajnatva yo bhajed
  devanagari: ृणु वक्ष्यामि भैरवि प्राणवल्लभे । श्रीजगन्मङ्गलन्नाम कवचं मन्त्रविग्रहम् ॥ ३॥ पठित्वा धारयित्वा
    च त्रैलोक्यं मोहयेत्क्षणात् । नारायणोऽपि यद्धृत्वा नारी भूत्वा महेश्वरम् ॥ ४॥ योगिनङ्क्षोभमनयद्यद्धृत्वा
    च रघूत्तमः । वरतृप्तो जघानैव रावणादिनिशाचरान् ॥ ५॥ यस्य प्रसादादीशोऽहं त्रैलोक्यविजयी विभुः । धनाधिपः
    कुबेरोऽपि सुरेशोऽभूच्छचीपतिः ॥ ६॥ एवं हि सकला देवास्सर्वसिद्धीश्वराः प्रिये । श्रीजगन्मङ्गलस्यास्य
    कवचस्य ऋषिः शिवः ॥ ७॥ छन्दोऽनुष्टुप्देवता च कालिका दक्षिणेरिता । जगतां मोहने दुष्टविजये भुक्तिमुक्तिषु
    ॥ ८॥ योषिदाकर्षणे चैव विनियोगः प्रकीर्तितः । शिरो मे कालिका पातु क्रीङ्कारैकाक्षरी परा ॥ ९॥ क्रीङ्क्रीङ्क्रीं
    मे ललाटञ्च कालिका खड्गधारिणी । हूं हूं पातु नेत्रयुगं ह्रीं ह्रीं पातु श्रुती मम ॥ १०॥ दक्षिणे कालिका
    पातु घ्राणयुग्मं महेश्वरी । क्रीङ्क्रीङ्क्रीं रसनाम्पातु हूं हूं पातु कपोलकम् ॥ ११॥ वदनं सकलम्पातु
    ह्रीँ ह्रीँ स्वाहास्वरूपिणी । द्वाविंशत्यक्षरी स्कन्धौ महाविद्या सुखप्रदा ॥ १२॥ खड्गमुण्डधरा काली
    सर्वाङ्गमभितोऽवतु । क्रींह्रूँह्रीँ त्र्यक्षरी पातु चामुण्डा हृदयं मम ॥ १३॥ ऐंहूँओंऐं स्तनद्वन्द्वं
    ह्रीम्फट्स्वाहा ककुत्स्थलम् । अष्टाक्षरी महाविद्या भुजौ पातु सकर्तृका ॥ १४॥ क्रीङ्क्रींहूंहूंह्रींह्रीङ्कारी
    पातु षडक्षरी मम । क्रीं नाभिं मध्यदेशञ्च दक्षिणे कालिकाऽवतु ॥ १५॥ क्रींस्वाहा पातु पृष्ठञ्च कालिका
    सा दशाक्षरी । क्रीं मे गुह्यं सदा पातु कालिकायै नमस्ततः ॥ १६॥ सप्ताक्षरी महाविद्या सर्वतन्त्रेषु गोपिता
    । ह्रींह्रीं दक्षिणे कालिके हूंहूं पातु कटिद्वयम् ॥ १७॥ काली दशाक्षरी विद्या स्वाहा मामूरुयुग्मकम्
    । ॐ क्रीङ्क्रीं मे स्वाहा पातु कालिका जानुनी सदा ॥ १८॥ कालीहृन्नामविद्येयञ्चतुर्वर्गफलप्रदा । क्रींह्रींह्रीं
    पातु सा गुल्फन्दक्षिणे कालिकाऽवतु ॥ १९॥ क्रींह्रूंह्रीं स्वाहा पदम्पातु चतुर्द्दशाक्षरी मम । खड्गमुण्डधरा
    काली वरदाभयधारिणी ॥ २०॥ विद्याभिस्सकलाभिः सा सर्वाङ्गमभितोऽवतु । काली कपालिनी कुल्ला कुरुकुल्ला विरोधिनी
    ॥ २१॥ विप्रचित्ता तथोग्रोग्रप्रभा दीप्ता घनत्विषा । नीला घना वलाका च मात्रा मुद्रा मिता च माम् ॥ २२॥
    एतास्सर्वाः खड्गधरा मुण्डमालाविभूषणाः । रक्षन्तु दिग्विदिक्षु मां ब्राह्मी नारायणी तथा ॥ २३॥ माहेश्वरी
    च चामुण्डा कौमारी चापराजिता । वाराही नारसिम्ही च सर्वाश्चामितभूषणाः ॥ २४॥ रक्षन्तु स्वायुधैर्दिक्षु
    विदिक्षु मां यथा तथा । इति ते कथितं दिव्यं कवचं परमाद्भुतम् ॥ २५॥ श्रीजगन्मङ्गलन्नाम महाविद्यौघविग्रहम्
    । त्रैलोक्याकर्षणं ब्रह्मन्कवचं मन्मुखोदितम् ॥ २६॥ गुरुपूजाँ विधायाथ विधिवत्प्रपठेत्ततः । कवचन्त्रिस्सकृद्वापि
    यावज्जीवञ्च वा पुनः ॥ २७॥ एतच्छतार्द्धमावृत्य त्रैलोक्यविजयी भवेत् । त्रैलोक्यङ्क्षोभयत्येव कवचस्य
    प्रसादतः ॥ २८॥ महाकविर्भवेन्मासं सर्वसिद्धीश्वरो भवेत् । पुष्पाञ्जलीन्कालिकायै मूलेनैवार्पयेत् सकृत्
    ॥ २९॥ शतवर्षसहस्राणां पूजायाः फलमाप्नुयात् । भूर्जे विलिखितञ्चैतत् स्वर्णस्थन्धारयेद्यदि ॥ ३०॥ विशाखायां
    दक्षबाहौ कण्ठे वा धारयेद्यदि । त्रैलोक्यं मोहयेत् क्रोधात्त्रैलोक्यञ्चूर्णयेत्क्षणात् ॥ ३१॥ पुत्रवान्धनवाञ्श्रीमान्नानाविद्यानिधिर्भवेत्
    । ब्रह्मास्त्रादीनि शस्त्राणि तद्गात्रस्पर्शनात्ततः ॥ ३२॥ नाशमायाति या नारी वन्ध्या वा मृतपुत्रिनी
    । बह्वपत्या जीवतोका भवत्येव न संशयः ॥ ३३॥ न देयम्परशिष्येभ्यो ह्यभक्तेभ्यो विशेषतः । शिष्येभ्यो भक्तियुक्तेभ्यो
    ह्यन्यथा मृत्युमाप्नुयात् ॥ ३४॥ स्पर्द्धामुद्धूय कमला वाग्देवी मन्दिरे सुखे । पौत्रान्तं स्थैर्यमास्थाय
    निवसत्येव निश्चितम् ॥ ३५॥ इदं कवचमज्ञात्वा यो भजेद्
