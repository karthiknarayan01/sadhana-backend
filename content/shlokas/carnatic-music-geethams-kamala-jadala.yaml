id: carnatic-music-geethams-kamala-jadala
category: stotram
name:
  english: Carnatic Music Geethams - Kamala Jadala
content:
  english: tisra jati triputa talam angah samskritam sahityam kamalajadala vimala sunayana karivarada
    karunambudhe hare karunajaladhe kamalakanta kesi narakasura vibhedana varada vela surapurottama karuna
    sharade kamalakanta svarah sa || ni da pa | da pa | ma pa || ka ma la | ja | da la || vi ma la | su
    na | ya na || ga ma pa | pa da | da ni || da pa ma | pa ga | ri sa || ka ri va | ra da | ka ru ||
    nam | ma ga | ri sa || ka ru na | sha ra | de || ga ma pa | ma pa | da pa || kam || ni da pa | da
    pa | ma pa || ga ma pa | pa da | da ni || su ra vi | bhe la || da pa ma | pa ga | ri sa || da | tta
    ma || ka ru na | sha ra | de || ni da pa | da pa | ma pa || ka ma la | ja | da la || vi ma la | su
    na | ya na ||
  devanagari: तिस्र जाति त्रिपुट तालम् अङ्गाः संस्कृतम् साहित्यम् कमलजादल विमल सुनयन करिवरद करुणाम्बुधे
    हरे करुणाजलधे कमलाकान्ता केसि नरकासुर विभेदन वरद वेल सुरपुरोत्तम करुणा शारदे कमलाकान्ता स्वराः स ॥
    नि द प । द प । म प ॥ क म ल । जा । द ल ॥ वि म ल । सु न । य न ॥ ग म प । प द । द नि ॥ द प म । प ग । रि
    स ॥ क रि व । र द । क रु ॥ नां । म ग । रि स ॥ क रु णा । शा र । दे ॥ ग म प । म प । द प ॥ कां ॥ नि द
    प । द प । म प ॥ ग म प । प द । द नि ॥ सु र वि । भे ल ॥ द प म । प ग । रि स ॥ द । त्त म ॥ क रु णा । शा
    र । दे ॥ नि द प । द प । म प ॥ क म ल । जा । द ल ॥ वि म ल । सु न । य न ॥
