id: aghamarshana-suktam
category: stotram
name:
  english: Aghamarshana Suktam
  devanagari: अघमर्षणसूक्तम्
content:
  english: hiranyashringam varunam prapadye tirtham me dehi yacitah| yanmaya bhuktamasadhunam papebhyashca
    pratigrahah| yanme manasa vaca karmana va dushkritam kritam| tanna indro varuno brihaspatih savita
    ca punantu punah punah| namo'gnaye 'phsumate nama indraya namo varunaya namo varunyai namo'dbhyah||1||
    yadapam kruram yadamedhyam yadashantam tadapagacchatat| atyashanadati panadyacca ugrat pratigraha
    t| tanno varuno raja panina shatu| so'hamapapo virajo nirmukto muktakilbishah| nakasya prishthamaruhya
    gacchedbrahmasalokatam| yashcaphsu varunah sa punatvaghamar shanah| imam me gange yamune sarasvati
    shutudri stoma sacata parushniya| asikniya marud vridhe vitastaya''rjikiye shrinuhya sushomaya| ritam
    ca satyam cabhi ddhattapaso'dhyajayata| tato ratrirajayata tatah samudro arnavah||2|| samudradarnavadadhi
    samvathsaro ajayata| ahoratrani vidadhadvishvasya mishato vashi| suryacandramasau dhata yathapurvamakalpayat|
    divam ca prithivim cantarikshamatho suvah| yatprithivya rajah svamantarikshe virodasi| ima stadapo
    varunah punatvaghamar shanah| punantu vasavah punatu varunah punatvaghamar shanah| esha bhutasya madhye
    bhuvanasya gopta| esha punyakritam lokanesha mrityor | dyavaprithivyor suvah||3|| sa nah suvah sa
    shishadhi| ardram jvalati jyotirahamasmi| jyotirjvalati brahmahamasmi| yo'hamasmi brahmahamasmi| ahamasmi
    brahahamasmi| ahamevaham mam juhomi svaha | akaryakaryavakirni steno bhrunaha gurutalpagah| varuno'pamagha
    tpapat pramucyate| rajo bhumistvama rodayasva pravadanti dhirah nthsamudrah prathame vidharmam janayanpraja
    bhuvanasya raja | vrisha pavitre adhi sano avye brihathsomo vavridhe suvana induh||4||
  devanagari: हिर॑ण्यशृङ्गं॒ वरु॑णं॒ प्रप॑द्ये ती॒र्थं मे॑ देहि॒ याचि॑तः। य॒न्मया॑ भु॒क्तम॒साधू॑नां पा॒पेभ्य॑श्च
    प्र॒तिग्र॑हः। यन्मे॒ मन॑सा वा॒चा॒ क॒र्म॒णा वा दु॑ष्कृतं॒ कृतम्। तन्न॒ इन्द्रो॒ वरु॑णो॒ बृह॒स्पतिः॑
    सवि॒ता च॑ पुनन्तु॒ पुनः॑ पुनः। नमो॒ऽग्नये ऽफ्सु॒मते॒ नम॒ इन्द्रा॑य॒ नमो॒ वरु॑णाय॒ नमो वारुण्यै॑ नमो॒ऽद्भ्यः॥१॥
    यद॒पां क्रू॒रं यद॑मे॒ध्यं यद॑शा॒न्तं तदप॑गच्छतात्। अ॒त्या॒श॒नाद॑ती पा॒ना॒द्य॒च्च उ॒ग्रात् प्र॑ति॒ग्रहा
    त्। तन्नो॒ वरु॑णो रा॒जा॒ पा॒णिना श॑तु। सो॑ऽहम॑पा॒पो वि॒रजो॒ निर्मु॒क्तो मु॑क्तकि॒ल्बिषः। नाक॑स्य पृ॒ष्ठमारु॑ह्य॒
    गच्छे॒द्ब्रह्म॑सलो॒कताम्। यश्चा॒फ्सु वरु॑णः॒ स पु॒नात्व॑घमर् ष॒णः। इ॒मं मे॑ गङ्गे यमुने सरस्वति॒ शुतु॑द्रि॒
    स्तोम ॑ सचता॒ परु॒ष्णिया। अ॒सि॒क्नि॒या म॑रुद् वृधे वि॒तस्त॒याऽऽर्जी॑कीये शृणु॒ह्या सु॒षोम॑या। ऋ॒तं
    च॑ स॒त्यं चा॒भी द्धा॒त्तप॒सोऽध्य॑जायत। ततो॒ रात्रि॑रजायत॒ ततः॑ समु॒द्रो अ॑र्ण॒वः॥२॥ स॒मु॒द्राद॑र्ण॒वादधि॑
    संवथ्स॒रो अ॑जायत। अ॒हो॒रा॒त्राणि॑ वि॒दध॒द्विश्व॑स्य मिष॒तो व॒शी। सू॒र्या॒च॒न्द्र॒मसौ॑ धा॒ता य॑थापू॒र्वम॑कल्पयत्।
    दिवं॑ च पृथि॒वीं चा॒न्तरि॑क्ष॒मथो॒ सुवः॑। यत्पृ॑थि॒व्या रजः॑ स्व॒मान्तरि॑क्षे वि॒रोद॑सी। इ॒मा स्तदा॒पो
    व॑रुणः पु॒नात्व॑घमर् ष॒णः। पु॒नन्तु॒ वस॑वः पु॒नातु॒ वरु॑णः पु॒नात्व॑घमर् ष॒णः। ए॒ष भू॒तस्य॑ म॒ध्ये
    भुव॑नस्य गो॒प्ता। ए॒ष पु॒ण्यकृ॑तां लो॒का॒ने॒ष मृ॒त्योर् । द्यावा॑पृथि॒व्योर् ॒ सुवः॑॥३॥ स नः॒ सुवः॒
    स शि॑शाधि। आर्द्रं॒ ज्वल॑ति॒ ज्योति॑र॒हम॑स्मि। ज्योति॒र्ज्वल॑ति॒ ब्रह्मा॒हम॑स्मि। यो॑ऽहम॑स्मि॒ ब्रह्मा॒हम॑स्मि।
    अ॒हम॑स्मि॒ ब्रहा॒हम॑स्मि। अ॒हमे॒वाहं मां जु॑होमि॒ स्वाहा । अ॒का॒र्य॒का॒र्य॑वकी॒र्णी स्ते॒नो भ्रू॑ण॒हा
    गु॑रुत॒ल्पगः। वरु॑णो॒ऽपाम॑घ त्पा॒पात् प्रमु॑च्यते। र॒जो भूमि॑स्त्व॒मा रोद॑यस्व॒ प्रव॑दन्ति॒ धीराः
    न्थ्समु॒द्रः प्र॑थ॒मे विध॑र्मं ज॒नय॑न्प्र॒जा भुव॑नस्य॒ राजा । वृषा॑ प॒वित्रे॒ अधि॒ सानो॒ अव्ये॑ बृ॒हथ्सोमो॑
    वावृधे सुवा॒न इन्दुः॑॥४॥
