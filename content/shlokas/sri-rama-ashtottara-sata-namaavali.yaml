id: sri-rama-ashtottara-sata-namaavali
category: stotram
name:
  english: Sri Rama Ashtottara Sata Namaavali
content:
  english: om shriramaya namah om ramabhadraya namah om ramacandraya namah om shashvataya namah om rajivalocanaya
    namah om shrimate namah om rajendraya namah om raghupungavaya namah om janakivallabhaya namah om jaitraya
    namah || || om jitamitraya namah om janardanaya namah om vishvamitrapriyaya namah om dantaya namah
    om sharanatranatatparaya namah om valipramathanaya namah om vanmine namah om satyavace namah om satyavikramaya
    namah om satyavrataya namah || || om vratadharaya namah om sada hanumadashritaya namah om kosaleyaya
    namah om kharadhvamsine namah om viradhavadhapanditaya namah om vibhishanaparitratre namah om harakodanda
    khandanaya namah om saptasala prabhettre namah om dashagrivashiroharaya namah om jamadagnyamahadarpadalanaya
    namah || || om tatakantakaya namah om vedanta saraya namah om vedatmane namah om bhavarogasya bheshajaya
    namah om dushanatrishirohantre namah om trimurtaye namah om trigunatmakaya namah om trivikramaya namah
    om trilokatmane namah om punyacaritrakirtanaya namah || || om trilokarakshakaya namah om dhanvine
    namah om dandakaranyakartanaya namah om ahalyashapashamanaya namah om pitribhaktaya namah om varapradaya
    namah om jitakrodhaya namah om jitamitraya namah om jagadgurave namah om rikshavanarasanghatine namah
    || || om citrakutasamashrayaya namah om jayantatrana varadaya namah om sumitraputra sevitaya namah
    om sarvadevadidevaya namah om mritavanarajivanaya namah om mayamaricahantre namah om mahadevaya namah
    om mahabhujaya namah om sarvadevastutaya namah om saumyaya namah || || om brahmanyaya namah om munisamstutaya
    namah om mahayogine namah om mahodaraya namah om sugrivepsita rajyadaya namah om sarvapunyadhika phalaya
    namah om smritasarvaghanashanaya namah om adipurushaya namah om paramapurushaya namah om mahapurushaya
    namah || || om punyodayaya namah om dayasaraya namah om puranaya namah om purushottamaya namah om
    smitavaktraya namah om mitabhashine namah om purvabhashine namah om raghavaya namah om anantagunagambhiraya
    namah om dhirodatta gunottamaya namah || || om mayamanushacaritraya namah om mahadevadi pujitaya namah
    om setukrite namah om jitavarashaye namah om sarvatirthamayaya namah om haraye namah om shyamangaya
    namah om sundaraya namah om shuraya namah om pitavasase namah || || om dhanurdharaya namah om sarvayajnadhipaya
    namah om yajvine namah om jaramaranavarjitaya namah om shivalingapratishthatre namah om sarvavagunavarjitaya
    namah om paramatmane namah om parasmai brahmane namah om saccidananda vigrahaya namah om parasmaijyotishe
    namah || || om parasmai dhamne namah om parakashaya namah om paratparaya namah om pareshaya namah
    om paragaya namah om paraya namah om sarvadevatmakaya namah om paraya namah || || iti shri ramashtottara
    shatanamavalissamapta ||
