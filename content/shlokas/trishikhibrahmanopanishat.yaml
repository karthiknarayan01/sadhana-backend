id: trishikhibrahmanopanishat
category: upanishad
name:
  english: trishikhibrahmanopanishat
  devanagari: त्रिशिखिब्राह्मणोपनिषत्
content:
  english: 2|| atraite shloka bhavanti | prithagbhute shodasha kalah svarthabhaganparankramat | antahkaranavyanakshirasapayunabhah
    kramat || 1|| mukhyatpurvottarairbhagairbhutebhute catushcatuh | purvamakashamashritya prithivyadishu
    samsthitah || 2|| mukhyadurdhve para jneya na paranuttaranviduh | evamamsho hyabhuttasmattebhyashcamsho
    hyabhuttatha || 3|| tasmadanyonyamashritya hyotam protamanukramat | pancabhutamayi bhumih sa cetanasamanvita
    || 4|| tata oshadhayo'nnam ca tatah pindashcaturvidhah | rasasrinmamsamedo'sthimajjashukrani dhatavah
    || 5|| kecittadyogatah pinda bhutebhyah sambhavah kvacit | tasminnannamayah pindo nabhimandalasamsthitah
    || 6|| asya madhye'sti hridayam sanalam padmakoshavat | sattvantarvartino devah kartrahankaracetanah
    || 7|| asya bijam tamahpindam moharupam jadam ghanam | vartate kanthamashritya mishribhutamidam jagat
    || 8|| pratyaganandarupatma murdhni sthane pare pade | anantashaktisamyukto jagadrupena bhasate ||
    9|| sarvatra vartate jagratsvapnam jagrati vartate | sushuptam ca turiyam ca nanyavasthasu kutracit
    || 2
  devanagari: २॥ अत्रैते श्लोका भवन्ति । पृथग्भूते षोडश कलाः स्वार्थभागान्परान्क्रमात् । अन्तःकरणव्यानाक्शिरसपायुनभः
    क्रमात् ॥ १॥ मुख्यात्पूर्वोत्तरैर्भागैर्भूतेभूते चतुश्चतुः । पूर्वमाकाशमाश्रित्य पृथिव्यादिषु संस्थिताः
    ॥ २॥ मुख्यादूर्ध्वे परा ज्ञेया न परानुत्तरान्विदुः । एवमंशो ह्यभूत्तस्मात्तेभ्यश्चांशो ह्यभूत्तथा
    ॥ ३॥ तस्मादन्योन्यमाश्रित्य ह्योतं प्रोतमनुक्रमात् । पञ्चभूतमयी भूमिः सा चेतनसमन्विता ॥ ४॥ तत ओषधयोऽन्नं
    च ततः पिण्डाश्चतुर्विधाः । रसासृङ्मांसमेदोऽस्थिमज्जाशुक्राणि धातवः ॥ ५॥ केचित्तद्योगतः पिण्डा भूतेभ्यः
    संभवाः क्वचित् । तस्मिन्नन्नमयः पिण्डो नाभिमण्डलसंस्थिताः ॥ ६॥ अस्य मध्येऽस्ति हृदयं सनालं पद्मकोशवत्
    । सत्त्वान्तर्वर्तिनो देवाः कर्त्रहङ्कारचेतनाः ॥ ७॥ अस्य बीजं तमःपिण्डं मोहरूपं जडं घनम् । वर्तते
    कण्ठमाश्रित्य मिश्रीभूतमिदं जगत् ॥ ८॥ प्रत्यगानन्दरूपात्मा मूर्ध्नि स्थाने परे पदे । अनन्तशक्तिसंयुक्तो
    जगद्रूपेण भासते ॥ ९॥ सर्वत्र वर्तते जाग्रत्स्वप्नं जाग्रति वर्तते । सुषुप्तं च तुरीयं च नान्यावस्थासु
    कुत्रचित् ॥ २
