id: subrahmanyaprasannamalamantram
category: mantra
name:
  english: subrahmanyaprasannamalamantram
  devanagari: सुब्रह्मण्यप्रसन्नमालामन्त्रम्
content:
  english: sauh sharavanabhava hum phat svaha || iti shrimat kumaratantre hayagrivagastyasamvade shatamiti
    patalam nama om shri subrahmanya prasanna malamantram sampurnam |
  devanagari: सौः शरवणभव हुं फट् स्वाहा ॥ इति श्रीमत् कुमारतन्त्रे हयग्रीवागस्त्यसंवादे शतमिति पटलं नाम
    ॐ श्री सुब्रह्मण्य प्रसन्न मालामन्त्रं सम्पूर्णम् ।
meaning: {}
