id: muktika-2
category: upanishad
name:
  english: muktika
  devanagari: मुक्तिक
content:
  english: rinu tattvatah | vedante supratishtho'ham vedantam samupashraya || 7|| vedantah ke raghushreshtha
    vartante kutra te vada | hanumanchrinu vakshyami vedantasthitimanjasa || 8|| nishvasabhuta me vishnorveda
    jatah suvistarah | tileshu tailavadvede vedantah supratishthitah || 9|| rama vedah katividhastesham
    shakhashca raghava | tasupanishadah kah syuh kripaya vada tattvatah || 10|| shrirama uvaca | rigvedadivibhagena
    vedashcatvara iritah | tesham shakha hyanekah syustasupanishadastatha || 11|| rigvedasya tu shakhah
    syurekavimshatisankhyakah | navadhikashatam shakha yajusho marutatmaja || 12|| sahasrasankhyaya jatah
    shakhah samnah parantapa | atharvanasya shakhah syuh pancashadbhedato hare || 13|| ekaikasyastu shakhaya
    ekaikopanishanmata | tasamekamricam yashca pathate bhaktito mayi || 14|| sa matsayujyapadavim prapnoti
    munidurlabham | rama kecinmunishreshtha muktireketi cakshire || 15|| kecittvannamabhajanatkashyam
    taropadeshatah | anyetu sankhyayogena bhaktiyogena capare || 16|| anye vedantavakyarthavicaratparamarshayah
    | salokyadivibhagena caturdha muktiririta || 17|| sahovaca shriramah | kaivalyamuktirekaiva paramarthikarupini
    | duracararato vapi mannamabhajanatkape || 18|| salokyamuktimapnoti na tu lokantaradikam | kashyam
    tu brahmanale'sminmrito mattaramapnuyat || 19|| punaravrittirahitam muktim prapnoti manavah | yatra
    kutrapi va kashyam marane sa maheshvarah || 20|| jantordakshinakarne tu mattaram samupadishet | nirdhutasheshapapaugho
    matsarupyam bhajatyayam || 21|| saiva salokyasarupyamuktiratyabhidhiyate | sadacararato bhutva dvijo
    nityamananyadhih || 22|| mayi sarvatmako bhavo matsamipyam bhajatyayam | saiva salokyasarupyasamipya
    muktirishyate || 23|| gurupadishtamargena dhyayanmadgunamavyayam | matsayujyam dvijah samyagbhajedbhramarakitavat
    || 24|| saiva sayujyamuktih syadbrahmanandakari shiva | caturvidha tu ya muktirmadupasanaya bhavet
    || 25|| iyam kaivalyamuktistu kenopayena siddhyati | mandukyamekamevalam mumukshunam vimuktaye ||
    26|| tathapyasiddham cejjnanam dashopanishadam patha | jnanam labdhva ciradeva mamakam dhama yasyasi
    || 27|| tathapi dridhata na cedvidjnanasyanjanasuta | dvatrimshakhyopanishadam samabhyasya nivartaya
    || 28|| videhamuktaviccha cedashtottarashatam patha | tasam krama sashantim ca shrunu vakshyami tattvatah
    || 29|| ishakenakathaprashnamundamandukyatittirih | aitareyam ca chandogyam brihadaranyakam tatha
    || 30|| brahmakaivalyajabalashvetashvo hamsa arunih | garbho narayano hamso bindurnadashirah shikha
    || 31|| maitrayani kaushitaki brihajjabalatapani | kalagnirudramaitreyi subalakshurimantrika || 32||
    sarvasaram niralambam rahasyam vajrasucikam | tejonadadhyanavidyayogatattvatmabodhakam || 33|| parivrat
    trishikhi sita cuda nirvanamandalam | dakshina sharabham skandam mahanarayanahvayam || 34|| rahasyam
    ramatapanam vasudevam ca mudgalam | shandilyam paingalam bhikshumahaccharirakam shikha || 35|| turiyatitasamnyasaparivrajakshamalika
    | avyaktaikaksharam purna suryakshyadhyatmakundika || 36|| savitryatma pashupatam param brahmavadhutakam
    | tripuratapanam devitripura kathabhavana | hridayam kundali bhasma rudrakshaganadarshanam || 37||
    tarasaramahavakya pancabrahmagnihotrakam | gopalatapanam krishnam yajnavalkyam varahakam || 38|| shatyayani
    hayagrivam dattatreyam ca garudam | kalijabalisaubhagyarahasyaricamuktika || 39|| evamashtottarashatam
    bhavanatrayanashanam | jnanavairagyadam pumsam vasanatrayanashanam || 40|| purvottareshu vihitatattacchantipurahsaram
    | vedavidyavratasnatadeshikasya mukhatsvayam || 41|| grihitvashtottarashatam ye pathanti dvijottamah
    | prarabdhakshayaparyantam jivanmukta bhavanti te || 42|| tatah kalavashadeva prarabdhe tu kshayam
    gate | vaidehim mamakim muktim yanti nastyatrasamshayah || 43|| sarvopanishadam madhye saramashtottarashatam
    | sakricchravanamatrena sarvaghaughanikrintanam || 44|| mayopadishtam shishyaya tubhyam pavananandana
    | idam shastram mayadishtam guhyamashtottaram shatam || 45|| jnanato'jnanato vapi pathatam bandhamocakam
    | rajyam deyam dhanam deyam yacatah kamapuranam || 45|| idamashtottarashatam na deyam yasya kasyacit
    | nastikaya kritaghnaya duracararataya vai || 47|| madbhaktivimukhayapi shastragarteshu muhyate |
    gurubhaktivihinaya datavyam na kadacana || 48|| sevaparaya shishyaya hitaputraya marute | madbhaktaya
    sushilaya kulinaya sumedhase || 49|| samyak parikshya datavyamevamashtottaram shatam | yah pathecchrinuyadvapi
    sa mameti na samshayah | tadetadricabhyuktam | vidya ha vai brahmanamajagama gopaya ma shevadhishti'hamasmi
    | asuyakayanrijave shathaya ma ma bruya viryavati tatha syam | yameva vidyashrutamapramattam medhavinam
    brahmacaryopapannam | tasma imamupasannaya samyak parikshya dadyadvaishnavimatmanishtham || 1|| iti
    || atha hainam shriramacandram marutih papraccha rigvedadivibhagena prithak shantimanubruhiti | sa
    hovaca shriramah | aitareyakaushitakinadabindvatmaprabodhanirvana
  devanagari: ृणु तत्त्वतः । वेदान्ते सुप्रतिष्ठोऽहं वेदान्तं समुपाश्रय ॥ ७॥ वेदान्ताः के रघुश्रेष्ठ वर्तन्ते
    कुत्र ते वद । हनूमञ्छृणु वक्ष्यामि वेदान्तस्थितिमञ्जसा ॥ ८॥ निश्वासभूता मे विष्णोर्वेदा जाताः सुविस्तराः
    । तिलेषु तैलवद्वेदे वेदान्तः सुप्रतिष्ठितः ॥ ९॥ राम वेदाः कतिविधास्तेषां शाखाश्च राघव । तासूपनिषदाः
    काः स्युः कृपया वद तत्त्वतः ॥ १०॥ श्रीराम उवाच । ऋग्वेदादिविभागेन वेदाश्चत्वार ईरिताः । तेषां शाखा
    ह्यनेकाः स्युस्तासूपनिषदस्तथा ॥ ११॥ ऋग्वेदस्य तु शाखाः स्युरेकविंशतिसङ्ख्यकाः । नवाधिकशतं शाखा यजुषो
    मारुतात्मज ॥ १२॥ सहस्रसङ्ख्यया जाताः शाखाः साम्नः परन्तप । अथर्वणस्य शाखाः स्युः पञ्चाशद्भेदतो हरे
    ॥ १३॥ एकैकस्यास्तु शाखाया एकैकोपनिषन्मता । तासामेकामृचं यश्च पठते भक्तितो मयि ॥ १४॥ स मत्सायुज्यपदवीं
    प्राप्नोति मुनिदुर्लभाम् । राम केचिन्मुनिश्रेष्ठा मुक्तिरेकेति चक्षिरे ॥ १५॥ केचित्त्वन्नामभजनात्काश्यां
    तारोपदेशतः । अन्येतु साङ्ख्ययोगेन भक्तियोगेन चापरे ॥ १६॥ अन्ये वेदान्तवाक्यार्थविचारात्परमर्षयः ।
    सालोक्यादिविभागेन चतुर्धा मुक्तिरीरिता ॥ १७॥ सहोवाच श्रीरामः । कैवल्यमुक्तिरेकैव परमार्थिकरूपिणी ।
    दुराचाररतो वापि मन्नामभजनात्कपे ॥ १८॥ सालोक्यमुक्तिमाप्नोति न तु लोकान्तरादिकम् । काश्यां तु ब्रह्मनालेऽस्मिन्मृतो
    मत्तारमाप्नुयात् ॥ १९॥ पुनरावृत्तिरहितां मुक्तिं प्राप्नोति मानवः । यत्र कुत्रापि वा काश्यां मरणे
    स महेश्वरः ॥ २०॥ जन्तोर्दक्षिणकर्णे तु मत्तारं समुपादिशेत् । निर्धूताशेषपापौघो मत्सारूप्यं भजत्ययम्
    ॥ २१॥ सैव सालोक्यसारूप्यमुक्तिरत्यभिधीयते । सदाचाररतो भूत्वा द्विजो नित्यमनन्यधीः ॥ २२॥ मयि सर्वात्मको
    भावो मत्सामीप्यं भजत्ययम् । सैव सालोक्यसारूप्यसामीप्या मुक्तिरिष्यते ॥ २३॥ गुरूपदिष्टमार्गेण ध्यायन्मद्गुणमव्ययम्
    । मत्सायुज्यं द्विजः सम्यग्भजेद्भ्रमरकीटवत् ॥ २४॥ सैव सायुज्यमुक्तिः स्याद्ब्रह्मानन्दकरी शिवा । चतुर्विधा
    तु या मुक्तिर्मदुपासनया भवेत् ॥ २५॥ इयं कैवल्यमुक्तिस्तु केनोपायेन सिद्ध्यति । माण्डूक्यमेकमेवालं
    मुमुक्षूणां विमुक्तये ॥ २६॥ तथाप्यसिद्धं चेज्ज्ञानं दशोपनिषदं पठ । ज्ञानं लब्ध्वा चिरादेव मामकं धाम
    यास्यसि ॥ २७॥ तथापि दृढता न चेद्विद्ज्ञानस्याञ्जनासुत । द्वात्रिंशाख्योपनिषदं समभ्यस्य निवर्तय ॥ २८॥
    विदेहमुक्ताविच्छा चेदष्टोत्तरशतं पठ । तासां क्रम सशान्तिं च श्रुणु वक्ष्यामि तत्त्वतः ॥ २९॥ ईशकेनकठप्रश्नमुण्डमाण्डूक्यतित्तिरिः
    । ऐतरेयं च छान्दोग्यं बृहदारण्यकं तथा ॥ ३०॥ ब्रह्मकैवल्यजाबालश्वेताश्वो हंस आरुणिः । गर्भो नारायणो
    हंसो बिन्दुर्नादशिरः शिखा ॥ ३१॥ मैत्रायणी कौषीतकी बृहज्जाबालतापनी । कालाग्निरुद्रमैत्रेयी सुबालक्षुरिमन्त्रिका
    ॥ ३२॥ सर्वसारं निरालम्बं रहस्यं वज्रसूचिकम् । तेजोनादध्यानविद्यायोगतत्त्वात्मबोधकम् ॥ ३३॥ परिव्राट्
    त्रिशिखी सीता चूडा निर्वाणमण्डलम् । दक्षिणा शरभं स्कन्दं महानारायणाह्वयम् ॥ ३४॥ रहस्यं रामतपनं वासुदेवं
    च मुद्गलम् । शाण्डिल्यं पैङ्गलं भिक्षुमहच्छारीरकं शिखा ॥ ३५॥ तुरीयातीतसंन्यासपरिव्राजाक्षमालिका ।
    अव्यक्तैकाक्षरं पूर्णा सूर्याक्ष्यध्यात्मकुण्डिका ॥ ३६॥ सावित्र्यात्मा पाशुपतं परं ब्रह्मावधूतकम्
    । त्रिपुरातपनं देवीत्रिपुरा कठभावना । हृदयं कुण्डली भस्म रुद्राक्षगणदर्शनम् ॥ ३७॥ तारसारमहावाक्य पञ्चब्रह्माग्निहोत्रकम्
    । गोपालतपनं कृष्णं याज्ञवल्क्यं वराहकम् ॥ ३८॥ शाट्यायनी हयग्रीवं दत्तात्रेयं च गारुडम् । कलिजाबालिसौभाग्यरहस्यऋचमुक्तिका
    ॥ ३९॥ एवमष्टोत्तरशतं भावनात्रयनाशनम् । ज्ञानवैराग्यदं पुंसां वासनात्रयनाशनम् ॥ ४०॥ पूर्वोत्तरेषु विहिततत्तच्छान्तिपुरःसरम्
    । वेदविद्याव्रतस्नातदेशिकस्य मुखात्स्वयम् ॥ ४१॥ गृहीत्वाष्टोत्तरशतं ये पठन्ति द्विजोत्तमाः । प्रारब्धक्षयपर्यन्तं
    जीवन्मुक्ता भवन्ति ते ॥ ४२॥ ततः कालवशादेव प्रारब्धे तु क्षयं गते । वैदेहीं मामकीं मुक्तिं यान्ति नास्त्यत्रसंशयः
    ॥ ४३॥ सर्वोपनिषदां मध्ये सारमष्टोत्तरशतम् । सकृच्छ्रवणमात्रेण सर्वाघौघनिकृन्तनम् ॥ ४४॥ मयोपदिष्टं
    शिष्याय तुभ्यं पवननन्दन । इदं शास्त्रं मयादिष्टं गुह्यमष्टोत्तरं शतम् ॥ ४५॥ ज्ञानतोऽज्ञानतो वापि पठतां
    बन्धमोचकम् । राज्यं देयं धनं देयं याचतः कामपूरणम् ॥ ४५॥ इदमष्टोत्तरशतं न देयं यस्य कस्यचित् । नास्तिकाय
    कृतघ्नाय दुराचाररताय वै ॥ ४७॥ मद्भक्तिविमुखायापि शास्त्रगर्तेषु मुह्यते । गुरुभक्तिविहीनाय दातव्यं
    न कदाचन ॥ ४८॥ सेवापराय शिष्याय हितपुत्राय मारुते । मद्भक्ताय सुशीलाय कुलीनाय सुमेधसे ॥ ४९॥ सम्यक्
    परीक्ष्य दातव्यमेवमष्टोत्तरं शतम् । यः पठेच्छृणुयाद्वापि स मामेति न संशयः । तदेतदृचाभ्युक्तम् । विद्या
    ह वै ब्राह्मणमाजगाम गोपाय मा शेवधिष्टीऽहमस्मि । असूयकायानृजवे शठाय मा मा ब्रूया वीर्यवती तथा स्याम्
    । यमेव विद्याश्रुतमप्रमत्तं मेधाविनं ब्रह्मचर्योपपन्नम् । तस्मा इमामुपसन्नाय सम्यक् परीक्ष्य दद्याद्वैष्णवीमात्मनिष्ठाम्
    ॥ १॥ इति ॥ अथ हैनं श्रीरामचन्द्रं मारुतिः पप्रच्छ ऋग्वेदादिविभागेन पृथक् शान्तिमनुब्रूहीति । स होवाच
    श्रीरामः । ऐतरेयकौषीतकीनादबिन्द्वात्मप्रबोधनिर्वाण
