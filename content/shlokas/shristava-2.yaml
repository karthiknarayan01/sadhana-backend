id: shristava-2
category: stotram
name:
  english: shristava
  devanagari: श्रीस्तव
content:
  english: devika ramya sarvarupavati tatha | sarvajnanamanishcaiva shrishridevi namo'stu te || 5|| brahmadistambaparyantam
    jagat sthavarajangamam | shivangamiti tatsarvam mam rakshatu namo'stu te | shridevi satatam murdhna
    tvam namami ca shaktitah || 6|| || om tatsat||
  devanagari: देविका रम्या सर्वरूपवती तथा । सर्वज्ञानमणिश्चैव श्रीश्रीदेवी नमोऽस्तु ते ॥ ५॥ ब्रह्मादिस्तम्बपर्यन्तं
    जगत् स्थावरजङ्गमम् । शिवाङ्गमिति तत्सर्वं मां रक्षतु नमोऽस्तु ते । श्रीदेवी सततं मूर्ध्ना त्वां नमामि
    च शक्तितः ॥ ६॥ ॥ ॐ तत्सत्॥
meaning: {}
