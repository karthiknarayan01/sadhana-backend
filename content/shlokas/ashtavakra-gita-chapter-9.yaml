id: ashtavakra-gita-chapter-9
category: stotram
name:
  english: Ashtavakra Gita Chapter 9
content:
  english: ashtavakra uvaca || kritakrite ca dvandvani kada shantani kasya va | evam jnatveha nirvedad
    bhava tyagaparo'vrati || || kasyapi tata dhanyasya lokaceshtavalokanat | jiviteccha bubhuksha ca bubhutsopashamam
    gatah || || anityam sarvamevedam tapatritayadushitam | asaram ninditam heyamiti nishcitya shamyati
    || || ko'sau kalo vayah kim va yatra dvandvani no nrinam | tanyupekshya yathapraptavarti siddhimavapnuyat
    || || nana matam maharshinam sadhunam yoginam tatha | drishtva nirvedamapannah ko na shamyati manavah
    || || kritva murtiparijnanam caitanyasya na kim guruh | nirvedasamatayuktya yastarayati samsriteh
    || || pashya bhutavikaramstvam bhutamatran yatharthatah | tatkshanad bandhanirmuktah svarupastho bhavishyasi
    || || vasana eva samsara iti sarva vimunca tah | tattyago vasanatyagatsthitiradya yatha tatha ||
  devanagari: अष्टावक्र उवाच ॥ कृताकृते च द्वन्द्वानि कदा शान्तानि कस्य वा । एवं ज्ञात्वेह निर्वेदाद्
    भव त्यागपरोऽव्रती ॥ ॥ कस्यापि तात धन्यस्य लोकचेष्टावलोकनात् । जीवितेच्छा बुभुक्षा च बुभुत्सोपशमं गताः
    ॥ ॥ अनित्यं सर्वमेवेदं तापत्रितयदूषितम् । असारं निन्दितं हेयमिति निश्चित्य शाम्यति ॥ ॥ कोऽसौ कालो
    वयः किं वा यत्र द्वन्द्वानि नो नृणाम् । तान्युपेक्ष्य यथाप्राप्तवर्ती सिद्धिमवाप्नुयात् ॥ ॥ नाना मतं
    महर्षीणां साधूनां योगिनां तथा । दृष्ट्वा निर्वेदमापन्नः को न शाम्यति मानवः ॥ ॥ कृत्वा मूर्तिपरिज्ञानं
    चैतन्यस्य न किं गुरुः । निर्वेदसमतायुक्त्या यस्तारयति संसृतेः ॥ ॥ पश्य भूतविकारांस्त्वं भूतमात्रान्
    यथार्थतः । तत्क्षणाद् बन्धनिर्मुक्तः स्वरूपस्थो भविष्यसि ॥ ॥ वासना एव संसार इति सर्वा विमुञ्च ताः
    । तत्त्यागो वासनात्यागात्स्थितिरद्य यथा तथा ॥
