id: gitasaragurvashtottarashatanamastotram
category: stotram
name:
  english: gitasaragurvashtottarashatanamastotram
  devanagari: गीतासारगुर्वष्टोत्तरशतनामस्तोत्रम्
content:
  english: gitasaragurvashtottarashatanamastotram prashantatma vigatabhiryogi vigatakalmashah | yogayukto
    vishuddhatma yatacittendriyakriyah || 1|| svakarmaniratah shanto dharmatma'mitavikramah | muktasango'nahamvadi
    dhrityutsahasamanvitah || 2|| sthirabuddhirasammudho jitatma vigatasprihah | sarvasankalpasamnyasi
    bhakah sangavivarjitah || 3|| viviktasevi laghvashi yatavakkayamanasah | ekaki yogasamsiddho yogarudho'parigrahah
    || 4|| dhyanayogaparo mauni svasthah samshuddhakilbishah | vitaragabhayakrodhah sthitadhirvigatajvarah
    || 5|| sarvarambhaparityagi kritsnavit kritsnakarmakrit | yatendriyamanobuddhirmunirmokshaparayanah
    || 6|| yadricchalabhasantushto dvandvatito vimatsarah | aniketah sthiramatirmahatma dridanishcayah
    || 7|| nirdvandvo nityasattvastho niryogakshama atmavan | nirmamo nirahankarah samaduhkhasukhah kshami
    || 8|| nirashiryatacittatma tyaktasarvaparigrahah | anapekshah shucirdaksha udasino gatavyathah ||
    9|| jnanavijnanatriptatma kutastho vijitandriyah | nistraigunyo vashi jnani samaloshtashmakancanah
    || 10|| tulyapriyapriyo dhirastulyanindatmasamstutih | tyagi sattvasamavishto medhavi chinnasamshayah
    || 11|| vidvanatmaratirmukto nityatripto nirashrayah | antahsukho'ntararamah santushtah sarvavitpuman
    || 12|| sarvabhutatmabhutatma tattvavitsamadarshanah | gatirbharta prabhuhsakshi nivasah sharanam
    suhrit || 13|| atmatripto guruh pujyo gariyan purushottamah | brahmabhutah prasannatma kritakrityo
    virajate || 14|| sthitaprajno gunatito lokanugrahakamyaya | sharadayashcara murtih sha
  devanagari: गीतासारगुर्वष्टोत्तरशतनामस्तोत्रम् प्रशान्तात्मा विगतभीर्योगी विगतकल्मषः । योगयुक्तो विशुद्धात्मा
    यतचित्तेन्द्रियक्रियः ॥ १॥ स्वकर्मनिरतः शान्तो धर्मात्माऽमितविक्रमः । मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः
    ॥ २॥ स्थिरबुद्धिरसम्मूढो जितात्मा विगतस्पृहः । सर्वसङ्कल्पसंन्यासी भकः सङ्गविवर्जितः ॥ ३॥ विविक्तसेवी
    लघ्वाशी यतवाक्कायमानसः । एकाकी योगसंसिद्धो योगारूढोऽपरिग्रहः ॥ ४॥ ध्यानयोगपरो मौनी स्वस्थः संशुद्धकिल्बिषः
    । वीतरागभयक्रोधः स्थितधीर्विगतज्वरः ॥ ५॥ सर्वारम्भपरित्यागी कृत्स्नवित् कृत्स्नकर्मकृत् । यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः
    ॥ ६॥ यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः । अनिकेतः स्थिरमतिर्महात्मा दृडनिश्चयः ॥ ७॥ निर्द्वन्द्वो
    नित्यसत्त्वस्थो निर्योगक्षम आत्मवान् । निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥ ८॥ निराशीर्यतचित्तात्मा
    त्यक्तसर्वपरिग्रहः । अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः ॥ ९॥ ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितन्द्रियः
    । निस्त्रैगुण्यो वशी ज्ञानी समलोष्टाश्मकाञ्चनः ॥ १०॥ तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः
    । त्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः ॥ ११॥ विद्वानात्मरतिर्मुक्तो नित्यतृप्तो निराश्रयः । अन्तःसुखोऽन्तरारामः
    सन्तुष्टः सर्ववित्पुमान् ॥ १२॥ सर्वभूतात्मभूतात्मा तत्त्ववित्समदर्शनः । गतिर्भर्ता प्रभुःसाक्षी निवासः
    शरणं सुहृत् ॥ १३॥ आत्मतृप्तो गुरुः पूज्यो गरीयान् पुरुषोत्तमः । ब्रह्मभूतः प्रसन्नात्मा कृतकृत्यो
    विराजते ॥ १४॥ स्थितप्रज्ञो गुणातीतो लोकानुग्रहकाम्यया । शारदायाश्चरा मूर्तिः श
