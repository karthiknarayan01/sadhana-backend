id: shridharopanishat
category: upanishad
name:
  english: shridharopanishat
  devanagari: श्रीधरोपनिषत्
content:
  english: mrityurdhavati pancamah | tvatsattaya sarvam kriyavan bhavati | tvattah sarvani bhutani jayante
    | jatani tvattah jivanti | tvayi prayantyabhisamvishanti | tvam gunatrayatitah | tvamavasthatrayatitah
    | tvam dehatrayatitah | tvam kalatrayatitah | tvam sahasradaḻapadmasthito'si nityam | tvameva manobuddhyahankarah
    prerako'si | tvameva shamadamadi shatsampatpradayaka'si | tvam mokshashriyam dharako'si | tvamajnanatimirabhaskaro'si
    | tvam mayamohavidurako'si | tvam bhavabandhavimocako'si | tvam sarvasadgunakarta'si | tvam sarvadurgunaharta'si
    | tvam shantidantiprado'si | tvam bhaktijnanaprado'si | tvam mokshananda pradayako'si | tvam sarvavighnavinashako'si
    | tvamabhayavaradavaro'si | tvam bhaktajanatarako'si | tvam nijasukhapadapradayako'si | ritetvat ko'si
    netarassamarthah | ritetvat ko'pi netaro dayaluh | ritetvat ko'pi netaro kshamashilah | ritetvat ko'pi
    netaro bhaktavatsalah | ritetvat ko'pi netaro dharmarakshakah | ritetvat ko'pi netarah sadgururjnanadayakah
    | tvattah sakala sadhana sampatsamriddhatvam | tvattah bhaktijnanavairagyasadhanashaktimatvam | tvayi
    samupasthitam jagadutpattisthitilayakarana bijam | tvayi supratishthitam samsritinashanadvaitabhavanamulam
    | kanakakaminimohakatvat trahi trahi mam | kamakrodhadishadvairinatvat raksha raksha mam | janmajaramaranarugdoshat
    trahi trahi mam | samsarahavanaladahyamanam pahi pahi mam | vishayakardamanimajjamanam trahi trahi
    mam | tvatpadapankajasharanagatim dehi dehi me | shamadisampadam dehi dehi me | tvayavina nasti ko'nyagharah
    | vina tvaya ko'pyasti apto bandhustatha sakha | tava kripahastam dehi me shirasi | tava dhyana dehi
    me manasi | sada te smaranam me astu | bho guro
  devanagari: मृत्युर्धावति पञ्चमः । त्वत्सत्तया सर्वं क्रियावान् भवति । त्वत्तः सर्वाणि भूतानि जायन्ते
    । जातानि त्वत्तः जीवन्ति । त्वयि प्रयन्त्यभिसंविशन्ति । त्वं गुणत्रयातीतः । त्वमवस्थात्रयातीतः । त्वं
    देहत्रयातीतः । त्वं कालत्रयातीतः । त्वं सहस्रदळपद्मस्थितोऽसि नित्यम् । त्वमेव मनोबुद्ध्यहङ्कारः प्रेरकोऽसि
    । त्वमेव शमदमादि षट्सम्पत्प्रदायकाऽसि । त्वं मोक्षश्रियं धारकोऽसि । त्वमज्ञानतिमिरभास्करोऽसि । त्वं
    मायामोहविदूरकोऽसि । त्वं भवबन्धविमोचकोऽसि । त्वं सर्वसद्गुणकर्ताऽसि । त्वं सर्वदुर्गुणहर्ताऽसि । त्वं
    शान्तिदान्तिप्रदोऽसि । त्वं भक्तिज्ञानप्रदोऽसि । त्वं मोक्षानन्द प्रदायकोऽसि । त्वं सर्वविघ्नविनाशकोऽसि
    । त्वमभयवरदवरोऽसि । त्वं भक्तजनतारकोऽसि । त्वं निजसुखपदप्रदायकोऽसि । ऋतेत्वत् कोऽसि नेतरस्समर्थः ।
    ऋतेत्वत् कोऽपि नेतरो दयालुः । ऋतेत्वत् कोऽपि नेतरो क्षमाशीलः । ऋतेत्वत् कोऽपि नेतरो भक्तवत्सलः । ऋतेत्वत्
    कोऽपि नेतरो धर्मरक्षकः । ऋतेत्वत् कोऽपि नेतरः सद्गुरुर्ज्ञानदायकः । त्वत्तः सकल साधन सम्पत्समृद्धत्वम्
    । त्वत्तः भक्तिज्ञानवैराग्यसाधनशक्तिमत्वम् । त्वयि समुपस्थितं जगदुत्पत्तिस्थितिलयकारण बीजम् । त्वयि
    सुप्रतिष्ठितं संसृतिनाशनाद्वैतभावनामूलम् । कनककामिनीमोहकत्वात् त्राहि त्राहि माम् । कामक्रोधादिषड्वैरिणत्वात्
    रक्ष रक्ष माम् । जन्मजरामरणरुग्दोषात् त्राहि त्राहि माम् । संसारहावानलदह्यमानं पाहि पाहि माम् । विषयकर्दमनिमज्जमानं
    त्राहि त्राहि माम् । त्वत्पादपङ्कजशरणागतिं देहि देहि मे । शमादिसम्पदं देहि देहि मे । त्वयाविना नास्ति
    कोऽन्याघारः । विना त्वया कोऽप्यस्ति आप्तो बन्धुस्तथा सखा । तव कृपाहस्तं देहि मे शिरसि । तव ध्यान देहि
    मे मनसि । सदा ते स्मरणं मे अस्तु । भो गुरो
