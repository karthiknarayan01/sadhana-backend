id: shivtand
category: stotram
name:
  english: shivtand
  devanagari: शिव्ताण्ड्
content:
  english: nigumphanirbharaksharanmadhushnikamanoharah | tanotu no manomudam vinodinimaharnisham parashriyah
    param padam tadangajatvisham cayah || 14|| pracandavadavanalaprabhashubhapracarani mahashtasiddhikaminijana'vahutajalpana
    | vimuktavamalocanavivahakalikadhvanih shiveti mantrabhushana jagajjayaya jayatam || 15|| imam hi
    nityamevamuktamuttamottamam stavam pathansmaranbruvannaro vishuddhimetisantatam | hare gurau subhaktimashu
    yati na'nyatha gatim vimohanam hi dehinam sushankarasya cintanam || 16|| pujavasanasamaye dashavaktragitam
    yah shambhupujanaparam pathati pradoshe | tasya sthiram rathagajendraturangayuktam lakshmim sadaiva
    sumukhim pradadati shambhuh || 17||
  devanagari: निगुम्फनिर्भरक्षरन्मधूष्णिकामनोहरः । तनोतु नो मनोमुदं विनोदिनीमहर्निशं परश्रियः परं पदं
    तदङ्गजत्विषां चयः ॥ १४॥ प्रचण्डवाडवानलप्रभाशुभप्रचारणी महाष्टसिद्धिकामिनीजनाऽवहूतजल्पना । विमुक्तवामलोचनाविवाहकालिकध्वनिः
    शिवेति मन्त्रभूषणा जगज्जयाय जायताम् ॥ १५॥ इमं हि नित्यमेवमुक्तमुत्तमोत्तमं स्तवं पठन्स्मरन्ब्रुवन्नरो
    विशुद्धिमेतिसन्ततम् । हरे गुरौ सुभक्तिमाशु याति नाऽन्यथा गतिं विमोहनं हि देहिनां सुशङ्करस्य चिन्तनम्
    ॥ १६॥ पूजावसानसमये दशवक्त्रगीतं यः शम्भुपूजनपरं पठति प्रदोषे । तस्य स्थिरां रथगजेन्द्रतुरङ्गयुक्तां
    लक्ष्मीं सदैव सुमुखीं प्रददाति शम्भुः ॥ १७॥
