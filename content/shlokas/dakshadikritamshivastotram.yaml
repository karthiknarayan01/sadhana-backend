id: dakshadikritamshivastotram
category: stotram
name:
  english: dakshadikritamshivastotram
  devanagari: दक्षादिकृतंशिवस्तोत्रम्
content:
  english: mananyavrittyanugrihana vatsala || 38|| jagadudbhavasthitilayeshu daivato bahubhidyamana gunaya''tmamayaya
    | racitatmabhedamataye svasamsthaya vinivartitabhramagunatmane namah || 39|| brahmovaca | namaste
    shritasattvaya dharmadinam ca sutaye | nirgunaya ca yatkashtham naham vedapare'pi ca || 40|| agniruvaca
    | yattejasaham susamiddhateja havyam vahe svadhvara ajyasiktam | tam yajniyam pancavidham ca pancabhih
    svishtam yajurbhih pranato'smi yajnam || 41|| deva ucuh | pura kalpapaye svakritamudarikritya vikritam
    tvamevadyastasmin salila uragendradhishayane | puman sheshe siddhairhridi vimrishitadhyatmapadavih
    sa evadyakshnoryah pathi carasi bhrityanavasi nah || 42|| gandharva ucuh | amshamshaste deva maricyadaya
    ete brahmendradya devagana rudrapurogah | kridabhandam vishvamidam yasya vibhuman tasmai nityam natha
    namaste karavama || 43|| vidyadhara ucuh | tvanmayayarthamabhipadya kalevare'smin kritva mamahamiti
    durmatirutpathaih svaih | kshipto'pyasadvishayalalasa atmamoham yushmatkathamritanishevaka udvyudasyet
    || 44|| brahmana ucuh | tvam kratustvam havistvam hutashah svayam tvam hi mantrah samiddarbha patrani
    ca | tvam sadasyartvijo dampati devata agnihotram svadha soma ajyam pashuh || 45|| tvam pura gam rasaya
    mahasukaro damshtraya padminim varanendro yatha | stuyamano nada~llilaya yogibhi
  devanagari: मनन्यवृत्त्यानुगृहाण वत्सल ॥ ३८॥ जगदुद्भवस्थितिलयेषु दैवतो बहुभिद्यमान गुणयाऽऽत्ममायया ।
    रचितात्मभेदमतये स्वसंस्थया विनिवर्तितभ्रमगुणात्मने नमः ॥ ३९॥ ब्रह्मोवाच । नमस्ते श्रितसत्त्वाय धर्मादीनां
    च सूतये । निर्गुणाय च यत्काष्ठां नाहं वेदापरेऽपि च ॥ ४०॥ अग्निरुवाच । यत्तेजसाहं सुसमिद्धतेजा हव्यं
    वहे स्वध्वर आज्यसिक्तम् । तं यज्ञियं पञ्चविधं च पञ्चभिः स्विष्टं यजुर्भिः प्रणतोऽस्मि यज्ञम् ॥ ४१॥
    देवा ऊचुः । पुरा कल्पापाये स्वकृतमुदरीकृत्य विकृतं त्वमेवाद्यस्तस्मिन् सलिल उरगेन्द्राधिशयने । पुमान्
    शेषे सिद्धैर्हृदि विमृशिताध्यात्मपदविः स एवाद्याक्ष्णोर्यः पथि चरसि भृत्यानवसि नः ॥ ४२॥ गन्धर्वा ऊचुः
    । अंशांशास्ते देव मरीच्यादय एते ब्रह्मेन्द्राद्या देवगणा रुद्रपुरोगाः । क्रीडाभाण्डं विश्वमिदं यस्य
    विभूमन् तस्मै नित्यं नाथ नमस्ते करवाम ॥ ४३॥ विद्याधरा ऊचुः । त्वन्माययार्थमभिपद्य कलेवरेऽस्मिन् कृत्वा
    ममाहमिति दुर्मतिरुत्पथैः स्वैः । क्षिप्तोऽप्यसद्विषयलालस आत्ममोहं युष्मत्कथामृतनिषेवक उद्व्युदस्येत्
    ॥ ४४॥ ब्राह्मणा ऊचुः । त्वं क्रतुस्त्वं हविस्त्वं हुताशः स्वयं त्वं हि मन्त्रः समिद्दर्भ पात्राणि
    च । त्वं सदस्यर्त्विजो दम्पती देवता अग्निहोत्रं स्वधा सोम आज्यं पशुः ॥ ४५॥ त्वं पुरा गां रसाया महासूकरो
    दंष्ट्रया पद्मिनीं वारणेन्द्रो यथा । स्तूयमानो नदँल्लीलया योगिभि
