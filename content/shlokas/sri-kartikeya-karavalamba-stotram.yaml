id: sri-kartikeya-karavalamba-stotram
category: stotram
name:
  english: Sri Kartikeya Karavalamba Stotram
content:
  english: singara vela sakaleshvara dinabandho | santapanashana sanatana shaktihasta shrikartikeya mama
    dehi karavalambam || pancadrivasa sahaja surasainyanatha pancamritapriya guha sakaladhivasa | gangendu
    mauli tanaya mayilvahanastha shrikartikeya mama dehi karavalambam || apadvinashaka kumaraka carumurte
    tapatrayantaka dayapara tarakare | arta'bhayaprada gunatraya bhavyarashe shrikartikeya mama dehi karavalambam
    || vallipate sukritadayaka punyamurte svarlokanatha parisevita shambhu suno | trailokyanayaka shadanana
    bhutapada shrikartikeya mama dehi karavalambam || jnanasvarupa sakalatmaka vedavedya jnanapriya'khiladuranta
    mahavanaghne | dinavanapriya niramaya danasindho shrikartikeya mama dehi karavalambam || iti shri
    kartikeya karavalamba stotram |
  devanagari: सिङ्गार वेल सकलेश्वर दीनबन्धो । सन्तापनाशन सनातन शक्तिहस्त श्रीकार्तिकेय मम देहि करावलम्बम्
    ॥ पञ्चाद्रिवास सहजा सुरसैन्यनाथ पञ्चामृतप्रिय गुह सकलाधिवास । गङ्गेन्दु मौलि तनय मयिल्वाहनस्थ श्रीकार्तिकेय
    मम देहि करावलम्बम् ॥ आपद्विनाशक कुमारक चारुमूर्ते तापत्रयान्तक दायापर तारकारे । आर्ताऽभयप्रद गुणत्रय
    भव्यराशे श्रीकार्तिकेय मम देहि करावलम्बम् ॥ वल्लीपते सुकृतदायक पुण्यमूर्ते स्वर्लोकनाथ परिसेवित शम्भु
    सूनो । त्रैलोक्यनायक षडानन भूतपाद श्रीकार्तिकेय मम देहि करावलम्बम् ॥ ज्ञानस्वरूप सकलात्मक वेदवेद्य
    ज्ञानप्रियाऽखिलदुरन्त महावनघ्ने । दीनवनप्रिय निरमय दानसिन्धो श्रीकार्तिकेय मम देहि करावलम्बम् ॥ इति
    श्री कार्तिकेय करावलम्ब स्तोत्रम् ।
