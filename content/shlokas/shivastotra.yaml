id: shivastotra
category: stotram
name:
  english: shivastotra
  devanagari: शिवस्तोत्र
content:
  english: svami vivekanandaviracitam om namah shivaya | nikhilabhuvanajanmasthamabhangaprarohah akalitamahimanah
    kalpita yatra tasmin | suvimalagaganabhe ishasamsthe'pyanishe mama bhavatu bhave'smin bhasuro bhavabandhah
    || nihatanikhilamohe'dhishata yatra rudha prakatitaparapremna yo mahadeva samjnah | ashithilaparirambhah
    premarupasya yasya pranayati hridi vishvam vyajamatram vibhutvam || vahati vipulavatah purva samskararupah
    pramathati balavrimdam ghurnitevormimala | pracalati khalu yugmam yushmadasmatpratitam ativikalitarupam
    naumi cittam shivastham || janakajanitabhavo vrittayah samskritashca agananabahurupa yatra eko yatharthah
    | shamitavikritavate yatra namtarbahishca tamahaha haramaude cittavritternirodham || galitatimiramalah
    shubhratejahprakashah dhavalakamalashobhah jnanapunjattahasah | yamijanahridigamyah nishkalam dhyayamanah
    pranatamavatu mam sah manaso rajahamsah || duritadalanadaksham dakshajadattadosham kalitakalikalankam
    kamrakalharakamtam | parahitakaranaya pranavicchedasutkam natanayananiyuktam nilakamtham namamah ||
  devanagari: स्वामी विवेकानन्दविरचितम् ॐ नमः शिवाय । निखिलभुवनजन्मस्थमभङ्गप्ररोहाः अकलितमहिमानः कल्पिता
    यत्र तस्मिन् । सुविमलगगनाभे ईशसंस्थेऽप्यनीशे मम भवतु भवेऽस्मिन् भासुरो भावबन्धः ॥ निहतनिखिलमोहेऽधीशता
    यत्र रूढा प्रकटितपरप्रेम्ना यो महादेव संज्ञः । अशिथिलपरिरम्भः प्रेमरूपस्य यस्य प्रणयति हृदि विश्वं
    व्याजमात्रं विभुत्वम् ॥ वहति विपुलवातः पूर्व संस्काररूपः प्रमथति बलवृंदं घूर्णितेवोर्मिमाला । प्रचलति
    खलु युग्मं युष्मदस्मत्प्रतीतम् अतिविकलितरूपं नौमि चित्तं शिवस्थम् ॥ जनकजनितभावो वृत्तयः संस्कृताश्च
    अगणनबहुरूपा यत्र एको यथार्थः । शमितविकृतवाते यत्र नांतर्बहिश्च तमहह हरमौडे चित्तवृत्तेर्निरोधम् ॥
    गलिततिमिरमालः शुभ्रतेजःप्रकाशः धवलकमलशोभः ज्ञानपुञ्जाट्टहासः । यमिजनहृदिगम्यः निष्कलं ध्यायमानः प्रणतमवतु
    मं सः मानसो राजहंसः ॥ दुरितदलनदक्षं दक्षजादत्तदोषम् कलितकलिकलङ्कं कम्रकल्हारकांतम् । परहितकरणाय प्राणविच्छेदसूत्कम्
    नतनयननियुक्तं नीलकंठं नमामः ॥
