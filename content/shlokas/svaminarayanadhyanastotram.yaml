id: svaminarayanadhyanastotram
category: stotram
name:
  english: svaminarayanadhyanastotram
  devanagari: स्वामिनारायणध्यानस्तोत्रम्
content:
  english: stam dhyayami harim sada vrishabhuvam shrisvaminarayanam || 12|| yah pancakhyapiturgrihe vrishapure
    devyam dayashevadhih sarvesho bhagavan svayam sudayaya pradurbabhuva prabhuh | bhumavatra samanayacca
    paramam yo'nadimuktasthitim tam bapashubhanamadheyamanisham preshtham muda cintaye || 13|| sankalpena
    nanu svayam bhagavato bhumau cacaratra yo yasmai sviyabharam ca dharmirakhilam pritya svayam dattavan
    | jnata yashca hareh sadaiva nikhilabhiprayakasya svayam vande yogivaram hi tam guruvaram gopalabapabhidham
    || 14|| yam gopalamunishvarah svakapade pritya samasthapayad yenopasanamatra bodhitamatishreshtham
    tvapurvam hareh | bapa shrimahimapi yena paramah kau bodhitah sharmado vande nirgunanamadheyamanisham
    shrisadgurum tam muda || 15|| yo gopalamunindratulyamahima reje jagatyamiha pashrih svamukhena yam
    ca nikhilacaryo'yamityaha vai | bapa shrivacasam hi yah karunaya samlekhanam cakarod vande shrishvarasadgurum
    guruvaram hyanandadam tam sada || 16|| shrimadbrahmapureshvaraksharaparashrisvaminarayana
  devanagari: स्तं ध्यायामि हरिं सदा वृषभुवं श्रीस्वामिनारायणम् ॥ १२॥ यः पाञ्चाख्यपितुर्गृहे वृषपुरे देव्यां
    दयाशेवधिः सर्वेशो भगवान् स्वयं सुदयया प्रादुर्बभूव प्रभुः । भूमावत्र समानयच्च परमां योऽनादिमुक्तस्थितिं
    तं बापाशुभनामधेयमनिशं प्रेष्ठं मुदा चिन्तये ॥ १३॥ सङ्कल्पेन ननु स्वयं भगवतो भूमौ चचारात्र यो यस्मै
    स्वीयभरं च धार्मिरखिलं प्रीत्या स्वयं दत्तवान् । ज्ञाता यश्च हरेः सदैव निखिलाभिप्रायकस्य स्वयं वन्दे
    योगिवरं हि तं गुरुवरं गोपालबापाभिधम् ॥ १४॥ यं गोपालमुनीश्वरः स्वकपदे प्रीत्या समस्थापयद् येनोपासनमत्र
    बोधितमतिश्रेष्ठं त्वपूर्वं हरेः । बापा श्रीमहिमापि येन परमः कौ बोधितः शर्मदो वन्दे निर्गुणनामधेयमनिशं
    श्रीसद्गुरुं तं मुदा ॥ १५॥ यो गोपालमुनीन्द्रतुल्यमहिमा रेजे जगत्यामिह पाश्रीः स्वमुखेन यं च निखिलाचार्योऽयमित्याह
    वै । बापा श्रीवचसां हि यः करुणया संलेखनं चाकरोद् वन्दे श्रीश्वरसद्गुरुं गुरुवरं ह्यानन्ददं तं सदा
    ॥ १६॥ श्रीमद्ब्रह्मपुरेश्वराक्षरपरश्रीस्वामिनारायण
