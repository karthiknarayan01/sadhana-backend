id: mahatripurasundarisahasranamastotra-2
category: sahasranama
name:
  english: mahatripurasundarisahasranamastotra
  devanagari: महात्रिपुरसुन्दरीसहस्रनामस्तोत्र
content:
  english: ringaraveshadhya pashankushakarodyata | suryakotisahasrabha candrakotinibhanana || ganeshakotilavanya
    vishnukotyarimardini | davagnikotinalini rudrakotyugrarupini || samudrakotigambhira vayukotimahabala
    | akashakotivistara yamakotibhayankari || merukotisamucchraya ganakotisamriddhida | nishkastoka niradhara
    nirguna gunavarjita || ashoka shokarahita tapatrayavivarjita | vasishtha vishvajanani vishvakhya vishvavarddhini
    | citra vicitracitrangi hetugarbha kuleshvari | icchashaktirjnanashaktih kriyashaktih shucismita ||
    shucih smritimayi satya shrutirupa shrutipriya | mahasattvamayi sattva pancatattvoparisthita || parvati
    himavatputri parastha pararupini | jayanti bhadrakali ca ahalya kulanayika || bhutadhatri ca bhuteshi
    bhutastha bhutabhavana | mahakundalini shaktirmahavibhavavarddhini || hamsakshi hamsarupa ca hamsastha
    hamsarupini | somasuryagnimadhyastha manimandalavasini || dvadasharasarojastha suryamandalavasini
    | akalanka shashankabha shodasharanivasini || dakini rakini caiva lakini kakini tatha | shakini hakini
    caiva shatcakreshu nivasini || srishtisthitivinashaya srishtisthityantakarini | shrikanthapriyahritkantha
    nandakhya bindumalini || catushshashtikaladhara dehadandasamashrita | maya kali dhritirmedha kshudha
    tushtirmahadyutih || hingula mangala sita sushumnamadhyagamini | paraghora karalakshi vijaya jayadayini
    || hritpadmanilaya bhimamahabhairavanadini | akashalingasambhuta bhuvanodyanavasini || mahatsukshma
    ca kankali bhimarupa mahabala | menakagarbhasambhuta taptakancanasannibha || antarastha kutabija trikutacalavasini
    | varnakhya varnarahita pancashadvarnabhedini || vidyadhari lokadhatri apsara apsarah priya | diksha
    dakshayani daksha dakshayajnavinashini || yashah purna yashoda ca yashodagarbhasambhava | devaki devamata
    ca radhika krishnavallabha || arundhati shacindrani gandhari gandhamalini | dhyanatita dhyanagamya
    dhyanajna dhyanadharini || lambodari ca lamboshthi jambavanti jalodari | mahodari muktakeshi muktakamarthasiddhida
    || tapasvini taponishtha suparna dharmavasini | vanacapadhara dhira pancali pancamapriya || guhyangi
    ca subhima ca guhyatattva niranjana | asharira sharirastha samsararnavatarini || amrita nishkala bhadra
    sakala krishnapingala | cakrapriya ca cakrahva pancacakradidarini || padmaragapratikasha nirmalakashasannibha
    | adhahstha urddhvarupa ca urddhvapadmanivasini || karyakarana kartritve shashvadrupeshu samsthita
    | rasajna rasamadhyastha gandhastha gandharupini || prabrahmasvarupa ca parabrahmanivasini | shabdabrahmasvarupa
    ca shabdastha shabdavarjita || siddhirbuddhih parabuddhih sandiptirmadhyasamsthita | svaguhya shambhavishaktistattvastha
    tattvarupini || shashvati bhutamata ca mahabhutadhipapriya | shucipreta dharmasiddhirdharmavriddhih
    parajita || kamasandipini kama sada kautuhalapriya | jatajutadhara mukta sukshma shaktivibhushana
    || dvipicarmaparidhana ciravalkaladharini | trishuladamarudhara naramalavibhushana || atyugrarupini
    cogra kalpantadahanopama | trailokyasadhini sadhya siddhisadhakavatsala || sarvavidyamayi sara casuranavinashini
    | damani damani danta daya dogdhri durapaha || agnijihvopama ghora ghoraghorataranana | narayani narasimhi
    nrisimhahridayesthita || yogeshvari yogarupa yogamata ca yogini | khecari khacari khela nirvanapadasamshraya
    || nagini nagakanya ca suvesha naganayika | vishajvalavati dipta kalashatavibhushana || tivravaktra
    mahavaktra nagakotitvadharini | mahasattva ca dharmajna dharmatisukhadayini || krishnamurddha mahamurddha
    ghoramurddha varanana | sarvendriyamanonmatta sarvendriyamanomayi || sarvasangramajayada sarvapraharanodyata
    | sarvapidopashamani sarvarishtanivarini || sarvaishvaryasamutpanna sarvagrahavinashini | matangi
    mattamatangi matangipriyamandala || amritodadhimadhyastha katisutrairalankrita | amritodadhimadhyastha
    pravalavasanambuja || manimandalamadhyastha ishatprahasitanana | kumuda lalita lola laksha lohitalocana
    || digvasa devaduti ca devadevadhidevata | simhoparisamarudha himacalanivasini || attattahasini ghora
    ghoradaityavinashini | atyugraraktavastrabha nagakeyuramandita || muktaharalatopeta tungapinapayodhara
    | raktotpaladalakara madaghurnitalocana || samastadevatamurtih surarikshayakarini | khadgini shulahasta
    ca cakrini cakramalini || shankhini capini vani vajrini vajradandini | anandodadhimadhyastha katisutrairalankrita
    || nanabharanadiptanga nanamanivibhushita | jagadanandasambhuta cintamanigunanvita || trailokyanamita
    turya cinmayanandarupini | trailokyanandini devi duhkhasussvapnanashini || ghoragnidahashamani rajyadevarthasadhini
    | mahaparadharashighni mahacaurabhayapaha || ragadidosharahita jaramaranavarjita | candramandalamadhyastha
    piyusharnavasambhava || sarvadevaih stuta devi sarvasiddhairnnamaskrita | acintyashaktirupa ca manimantramahaushadhi
    || astisvastimayi bala malayacalavasini | dhatri vidhatri samhari ratijna ratidayini || rudrani rudrarupa
    ca rudraraudrarttinashini | sarvajna caiva dharmajna rasajna dinavatsala || anahata trinayana nirbhara
    nirvritih para | paraghora karalakshi sumati shreshthadayini || mantralika mantragamya mantramala
    sumantrini | shraddhananda mahabhadra nirdvandva nirgunatmika || dharini dharini prithvi dhara dhatri
    vasundhara | merumandaramadhyasthasthitih shankaravallabha || shrimati shrimayi shreshtha shrikari
    bhavabhavini | shrida shrima shrinivasa shrimati shrimatangatih || uma sarangini krishna kutila kutilalaka
    | trilocana trilokatma punyapunya prakirtita || amrita satyasankalpa sasatya granthibhedini | pareshi
    parama sadhya paravidya paratpara || sundarangi suvarnabha surasuranamaskrita | praja prajavati dhanya
    dhanadhanyasamriddhida || ishani bhuvaneshani bhavani bhuvaneshvari | anantanatamahita jagatsara jagadbhava
    || acintyatma cintyashaktishcintyacintyasvarupini | jnanagamya jnanamurtirjnanini jnanashalini ||
    asita ghorarupa ca sudhadhara sudhavaha | bhaskari bhasvati bhitirbhasvadakshanushayini || anasuya
    kshama lajja durlabha bharanatmika | vishvaghni vishvavira ca vishvaghni vishvasamsthita || shilastha
    shilarupa ca shila shilapradayini | bodhani bodhakushala rodhani bodhani tatha || vidyotini vicitratma
    vidyutpatalasannibha | vishvayonirmahayonih karmayonih priyatmika || rohini rogashamani maharogajvarapaha
    | rasada pushtida pushtirmanada manavapriya || krishnangavahini krishna krishnakrishnasahodari | shambhavi
    shambhurupa ca shambhustha shambhusambhava || vishvodari yogamata yogamudradhnayogini | vagishvari
    yoganidra yoginikotisevita || kaulika mandakanya ca sha
  devanagari: ृङ्गारवेषाढ्या पाशाङ्कुशकरोद्यता । सूर्यकोटिसहस्राभा चन्द्रकोटिनिभानना ॥ गणेशकोटिलावण्या
    विष्णुकोट्यरिमर्दिनी । दावाग्निकोटिनलिनी रुद्रकोट्युग्ररूपिणी ॥ समुद्रकोटिगम्भीरा वायुकोटिमहाबला ।
    आकाशकोटिविस्तारा यमकोटिभयङ्करी ॥ मेरुकोटिसमुच्छ्राया गणकोटिसमृद्धिदा । निष्कस्तोका निराधारा निर्गुणा
    गुणवर्जिता ॥ अशोका शोकरहिता तापत्रयविवर्जिता । वसिष्ठा विश्वजननी विश्वाख्या विश्ववर्द्धिनी । चित्रा
    विचित्रचित्राङ्गी हेतुगर्भा कुलेश्वरी । इच्छाशक्तिर्ज्ञानशक्तिः क्रियाशक्तिः शुचिस्मिता ॥ शुचिः स्मृतिमयी
    सत्या श्रुतिरूपा श्रुतिप्रिया । महासत्त्वमयी सत्त्वा पञ्चतत्त्वोपरिस्थिता ॥ पार्वती हिमवत्पुत्री पारस्था
    पाररूपिणी । जयन्ती भद्रकाली च अहल्या कुलनायिका ॥ भूतधात्री च भूतेशी भूतस्था भूतभावना । महाकुण्डलिनी
    शक्तिर्महाविभववर्द्धिनी ॥ हंसाक्षी हंसरूपा च हंसस्था हंसरूपिणी । सोमसूर्याग्निमध्यस्था मणिमण्डलवासिनी
    ॥ द्वादशारसरोजस्था सूर्यमण्डलवासिनी । अकलङ्का शशाङ्काभा षोडशारनिवासिनी ॥ डाकिनी राकिनी चैव लाकिनी
    काकिनी तथा । शाकिनी हाकिनी चैव षट्चक्रेषु निवासिनी ॥ सृष्टिस्थितिविनाशाय सृष्टिस्थित्यन्तकारिणी ।
    श्रीकण्ठप्रियहृत्कण्ठा नन्दाख्या बिन्दुमालिनी ॥ चतुष्षष्टिकलाधारा देहदण्डसमाश्रिता । माया काली धृतिर्मेधा
    क्षुधा तुष्टिर्महाद्युतिः ॥ हिङ्गुला मङ्गला सीता सुषुम्नामध्यगामिनी । परघोरा करालाक्षी विजया जयदायिनी
    ॥ हृत्पद्मनिलया भीममहाभैरवनादिनी । आकाशलिङ्गसम्भूता भुवनोद्यानवासिनी ॥ महत्सूक्ष्मा च कङ्काली भीमरूपा
    महाबला । मेनकागर्भसम्भूता तप्तकाञ्चनसन्निभा ॥ अन्तरस्था कूटबीजा त्रिकूटाचलवासिनी । वर्णाख्या वर्णरहिता
    पञ्चाशद्वर्णभेदिनी ॥ विद्याधरी लोकधात्री अप्सरा अप्सरः प्रिया । दीक्षा दाक्षायणी दक्षा दक्षयज्ञविनाशिनी
    ॥ यशः पूर्णा यशोदा च यशोदागर्भसम्भवा । देवकी देवमाता च राधिका कृष्णवल्लभा ॥ अरुन्धती शचीन्द्राणी गान्धारी
    गन्धमालिनी । ध्यानातीता ध्यानगम्या ध्यानज्ञा ध्यानधारिणी ॥ लम्बोदरी च लम्बोष्ठी जाम्बवन्ती जलोदरी
    । महोदरी मुक्तकेशी मुक्तकामार्थसिद्धिदा ॥ तपस्विनी तपोनिष्ठा सुपर्णा धर्मवासिनी । वाणचापधरा धीरा पाञ्चाली
    पञ्चमप्रिया ॥ गुह्याङ्गी च सुभीमा च गुह्यतत्त्वा निरञ्जना । अशरीरा शरीरस्था संसारार्णवतारिणी ॥ अमृता
    निष्कला भद्रा सकला कृष्णपिङ्गला । चक्रप्रिया च चक्राह्वा पञ्चचक्रादिदारिणी ॥ पद्मरागप्रतीकाशा निर्मलाकाशसन्निभा
    । अधःस्था ऊर्द्ध्वरूपा च ऊर्द्ध्वपद्मनिवासिनी ॥ कार्यकारण कर्तृत्वे शश्वद्रूपेषु संस्थिता । रसज्ञा
    रसमध्यस्था गन्धस्था गन्धरूपिणी ॥ प्रब्रह्मस्वरूपा च परब्रह्मनिवासिनी । शब्दब्रह्मस्वरूपा च शब्दस्था
    शब्दवर्जिता ॥ सिद्धिर्बुद्धिः पराबुद्धिः सन्दीप्तिर्मध्यसंस्थिता । स्वगुह्या शाम्भवीशक्तिस्तत्त्वस्था
    तत्त्वरूपिणी ॥ शाश्वती भूतमाता च महाभूताधिपप्रिया । शुचिप्रेता धर्मसिद्धिर्धर्मवृद्धिः पराजिता ॥ कामसन्दीपिणी
    कामा सदा कौतूहलप्रिया । जटाजूटधरा मुक्ता सूक्ष्मा शक्तिविभूषणा ॥ द्वीपिचर्मपरीधाना चीरवल्कलधारिणी
    । त्रिशूलडमरुधरा नरमालाविभूषणा ॥ अत्युग्ररूपिणी चोग्रा कल्पान्तदहनोपमा । त्रैलोक्यसाधिनी साध्या सिद्धिसाधकवत्सला
    ॥ सर्वविद्यामयी सारा चासुराणाविनाशिनी । दमनी दामनी दान्ता दया दोग्ध्री दुरापहा ॥ अग्निजिह्वोपमा घोरा
    घोरघोरतरानना । नारायणी नारसिंही नृसिंहहृदयेस्थिता ॥ योगेश्वरी योगरूपा योगमाता च योगिनी । खेचरी खचरी
    खेला निर्वाणपदसंश्रया ॥ नागिनी नागकन्या च सुवेशा नागनायिका । विषज्वालावती दीप्ता कलाशतविभूषणा ॥ तीव्रवक्त्रा
    महावक्त्रा नागकोटित्वधारिणी । महासत्त्वा च धर्मज्ञा धर्मातिसुखदायिनी ॥ कृष्णमूर्द्धा महामूर्द्धा घोरमूर्द्धा
    वरानना । सर्वेन्द्रियमनोन्मत्ता सर्वेन्द्रियमनोमयी ॥ सर्वसङ्ग्रामजयदा सर्वप्रहरणोद्यता । सर्वपीडोपशमनी
    सर्वारिष्टनिवारिणी ॥ सर्वैश्वर्यसमुत्पन्ना सर्वग्रहविनाशिनी । मातङ्गी मत्तमातङ्गी मातङ्गीप्रियमण्डला
    ॥ अमृतोदधिमध्यस्था कटिसूत्रैरलङ्कृता । अमृतोदधिमध्यस्था प्रवालवसनाम्बुजा ॥ मणिमण्डलमध्यस्था ईषत्प्रहसितानना
    । कुमुदा ललिता लोला लाक्षा लोहितलोचना ॥ दिग्वासा देवदूती च देवदेवाधिदेवता । सिंहोपरिसमारूढा हिमाचलनिवासिनी
    ॥ अट्टाट्टहासिनी घोरा घोरदैत्यविनाशिनी । अत्युग्ररक्तवस्त्राभा नागकेयूरमण्डिता ॥ मुक्ताहारलतोपेता
    तुङ्गपीनपयोधरा । रक्तोत्पलदलाकारा मदाघूर्णितलोचना ॥ समस्तदेवतामूर्तिः सुरारिक्षयकारिणी । खड्गिनी शूलहस्ता
    च चक्रिणी चक्रमालिनी ॥ शङ्खिनी चापिनी वाणी वज्रिणी वज्रदण्डिनी । आनन्दोदधिमध्यस्था कटिसूत्रैरलङ्कृता
    ॥ नानाभरणदीप्ताङ्गा नानामणिविभूषिता । जगदानन्दसम्भूता चिन्तामणिगुणान्विता ॥ त्रैलोक्यनमिता तुर्या
    चिन्मयानन्दरूपिणी । त्रैलोक्यनन्दिनी देवी दुःखसुस्स्वप्ननाशिनी ॥ घोराग्निदाहशमनी राज्यदेवार्थसाधिनी
    । महापराधराशिघ्नी महाचौरभयापहा ॥ रागादिदोषरहिता जरामरणवर्जिता । चन्द्रमण्डलमध्यस्था पीयूषार्णवसम्भवा
    ॥ सर्वदेवैः स्तुता देवी सर्वसिद्धैर्न्नमस्कृता । अचिन्त्यशक्तिरूपा च मणिमन्त्रमहौषधी ॥ अस्तिस्वस्तिमयी
    बाला मलयाचलवासिनी । धात्री विधात्री संहारी रतिज्ञा रतिदायिनी ॥ रुद्राणी रुद्ररूपा च रुद्ररौद्रार्त्तिनाशिनी
    । सर्वज्ञा चैव धर्मज्ञा रसज्ञा दीनवत्सला ॥ अनाहता त्रिनयना निर्भारा निर्वृतिः परा । पराघोरा करालाक्षी
    सुमती श्रेष्ठदायिनी ॥ मन्त्रालिका मन्त्रगम्या मन्त्रमाला सुमन्त्रिणी । श्रद्धानन्दा महाभद्रा निर्द्वन्द्वा
    निर्गुणात्मिका ॥ धरिणी धारिणी पृथ्वी धरा धात्री वसुन्धरा । मेरुमन्दरमध्यस्थास्थितिः शङ्करवल्लभा ॥
    श्रीमती श्रीमयी श्रेष्ठा श्रीकरी भावभाविनी । श्रीदा श्रीमा श्रीनिवासा श्रीमती श्रीमताङ्गतिः ॥ उमा
    सारङ्गिणी कृष्णा कुटिला कुटिलालका । त्रिलोचना त्रिलोकात्मा पुण्यपुण्या प्रकीर्तिता ॥ अमृता सत्यसङ्कल्पा
    सासत्या ग्रन्थिभेदिनी । परेशी परमा साध्या पराविद्या परात्परा ॥ सुन्दराङ्गी सुवर्णाभा सुरासुरनमस्कृता
    । प्रजा प्रजावती धन्या धनधान्यसमृद्धिदा ॥ ईशानी भुवनेशानी भवानी भुवनेश्वरी । अनन्तानतमहिता जगत्सारा
    जगद्भवा ॥ अचिन्त्यात्मा चिन्त्यशक्तिश्चिन्त्याचिन्त्यस्वरूपिणी । ज्ञानगम्या ज्ञानमूर्तिर्ज्ञानिनी
    ज्ञानशालिनी ॥ असिता घोररूपा च सुधाधारा सुधावहा । भास्करी भास्वती भीतिर्भास्वदक्षानुशायिनी ॥ अनसूया
    क्षमा लज्जा दुर्लभा भरणात्मिका । विश्वघ्नी विश्ववीरा च विश्वघ्नी विश्वसंस्थिता ॥ शीलस्था शीलरूपा च
    शीला शीलप्रदायिनी । बोधनी बोधकुशला रोधनी बोधनी तथा ॥ विद्योतिनी विचित्रात्मा विद्युत्पटलसन्निभा ।
    विश्वयोनिर्महायोनिः कर्मयोनिः प्रियात्मिका ॥ रोहिणी रोगशमनी महारोगज्वरापहा । रसदा पुष्टिदा पुष्टिर्मानदा
    मानवप्रिया ॥ कृष्णाङ्गवाहिनी कृष्णा कृष्णाकृष्णसहोदरी । शाम्भवी शम्भुरूपा च शम्भुस्था शम्भुसम्भवा
    ॥ विश्वोदरी योगमाता योगमुद्राध्नयोगिनी । वागीश्वरी योगनिद्रा योगिनीकोटिसेविता ॥ कौलिका मन्दकन्या च
    श
