id: radhauddhavashtr
category: stotram
name:
  english: radhauddhavashtr
  devanagari: राधाउद्धवष्त्र्
content:
  english: ringanivasinyai candravatyai namo namah || 65|| tulasivanavasinya vrindaranyai namo namah |
    rasamandalavasinyai raseshvaryai namo namah || 66|| virajatiravasinyai vrindayai ca namo namah | vrindavanavilasinyai
    krishnayai ca namo namah || 67|| namah krishnapriyayai ca shantayai ca namo namah | krishnavakshahsthitayai
    ca tatpriyayai namo namah || 68|| namo vaikunthavasinyai mahalakshmyai namo namah | vidyadhishthatridevyai
    ca sarasvatyai namo namah || 69|| sarvaishvaryadhidevyai ca kamalayai namo namah | padmanabhapriyayai
    ca padmayai ca namo namah || 70|| mahavishnoshca matre ca paradyayai namo namah | namah sindhusutayai
    ca martyalakshmayai namo namah || 71|| narayanapriyayai ca narayanyai namo namah | namo'stu vishnumayayai
    vaishnavyai ca namo namah || 72|| mahamayasvarupayai sampadayai namo namah | namah kalyanarupinyai
    shubhayai ca namo namah || 73|| matre caturnam vedanam savitryai ca namo namah | namo'stu buddhirupayai
    jnanadayai namo namah || 74|| namo durgavinashinyai durgadevyai namo namah | tejahsu sarvadevanam
    pura kritayuge muda || 75|| adhishtanakritayai ca prakrityai ca namo namah | namastripuraharinyai
    tripurayai namo namah || 76|| sundarishu ca ramyayai nirgunayai namo namah | namo nidrasvarupayai
    nirgunayai namo namah || 77|| namo dakshasutayai ca namah satyai namo namah | namah shailasutayai
    ca parvatyai ca namo namah || 78|| namo namastapasvinyai hyumayai ca namo namah | niraharasvarupayai
    hyaparnayai namo namah || 79|| gaurilaukavilasinyai namo gauryai namo namah | namah kailasavasinyai
    maheshvaryaih namo namah || 80|| nidrayai ca dayayai ca shraddhayai ca namo namah | namo dhrityai
    kshamaryai ca lajjayai ca namo namah || 81|| trishnayai kshutsvarupayai sthitikartryai namo namah
    | namah samhararupinyai mahamaryai namo namah || 82|| bhayayai cabhayayai ca muktidayai namo namah
    | namah svadhayai svahayai shantyai kantyai namo namah || 83|| namastushtyai ca pushtyai ca dayayai
    ca namo namah | namo nidrasvarupayai shraddhayai ca namo namah || 84|| kshutpipasasvarupayai lajjayai
    ca namo namah | namo dhrityai kshamayai ca cetanayai namo namah || 85|| sarvashaktisvarupinyai sarvamatre
    namo namah | agnau dahasvarupayai bhadrayai ca namo namah || 86|| shobhayai purnacandre ca sharatpadme
    namo namah | nasti bhedo yatha devi dugdhadhavalyayohsada || 87|| yathaiva gandhabhumyoshca yathaiva
    jalashaityayauh | yathaiva shabdanabhasorjyotih suryakayoryatha || 88|| loke vede purane ca radhamadhavayostatha
    | cetanam kuru kalyani dehi mamuttaram sati || 89|| ityuktva coddhavastatra prananama punah punah
    | ityuddhavakritam stotram yah pathedbhaktipurvakam || 90|| iha loke sukham bhuktva yatyante harimandiram
    | na bhavedbandhuvicchedo rogah shokah sudarunah || 91|| proshita stri labhetkantam bharyabhedi labhetpriyam
    | aputro labhate putrannirdhano labhate dhanam || 92|| nirbhumirlabhate bhumim prajahino labhetprajam
    | rogadvimucyate rogi baddho mucyeta bandhanat || 93|| bhayanmucyeta bhitastu mucyeta''panna apadah
    | aspashtakirtih suyasha murkho bhavati panditah || 94|| iti shribrahmavaivartapurane shrikrishnajanmakhande
    uttare dvinavatitamadhyayantargatam uddhavakritam radhastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ृङ्गनिवासिन्यै चन्द्रावत्यै नमो नमः ॥ ६५॥ तुलसीवनवासिन्य वृन्दारण्यै नमो नमः । रासमण्डलवासिन्यै
    रासेश्वर्यै नमो नमः ॥ ६६॥ विरजातीरवासिन्यै वृन्दायै च नमो नमः । वृन्दावनविलासिन्यै कृष्णायै च नमो
    नमः ॥ ६७॥ नमः कृष्णप्रियायै च शान्तायै च नमो नमः । कृष्णवक्षःस्थितायै च तत्प्रियायै नमो नमः ॥ ६८॥
    नमो वैकुण्ठवासिन्यै महालक्ष्म्यै नमो नमः । विद्याधिष्ठातृदेव्यै च सरस्वत्यै नमो नमः ॥ ६९॥ सर्वैश्वर्याधिदेव्यै
    च कमलायै नमो नमः । पद्मनाभप्रियायै च पद्मायै च नमो नमः ॥ ७०॥ महाविष्णोश्च मात्रे च पराद्यायै नमो नमः
    । नमः सिन्धुसुतायै च मर्त्यलक्ष्मयै नमो नमः ॥ ७१॥ नारायणप्रियायै च नारायण्यै नमो नमः । नमोऽस्तु विष्णुमायायै
    वैष्णव्यै च नमो नमः ॥ ७२॥ महामायास्वरूपायै सम्पदायै नमो नमः । नमः कल्याणरूपिण्यै शुभायै च नमो नमः
    ॥ ७३॥ मात्रे चतुर्णां वेदानां सावित्र्यै च नमो नमः । नमोऽस्तु बुद्धिरूपायै ज्ञानदायै नमो नमः ॥ ७४॥
    नमो दुर्गविनाशिन्यै दुर्गादेव्यै नमो नमः । तेजःसु सर्वदेवानां पुरा कृतयुगे मुदा ॥ ७५॥ अधिष्टानकृतायै
    च प्रकृत्यै च नमो नमः । नमस्त्रिपुरहारिण्यै त्रिपुरायै नमो नमः ॥ ७६॥ सुन्दरीषु च रम्यायै निर्गुणायै
    नमो नमः । नमो निद्रास्वरूपायै निर्गुणायै नमो नमः ॥ ७७॥ नमो दक्षसुतायै च नमः सत्यै नमो नमः । नमः शैलसुतायै
    च पार्वत्यै च नमो नमः ॥ ७८॥ नमो नमस्तपस्विन्यै ह्युमायै च नमो नमः । निराहारस्वरूपायै ह्यपर्णायै नमो
    नमः ॥ ७९॥ गौरीलौकविलासिन्यै नमो गौर्यै नमो नमः । नमः कैलासवासिन्यै माहेश्वर्यैः नमो नमः ॥ ८०॥ निद्रायै
    च दयायै च श्रद्धायै च नमो नमः । नमो धृत्यै क्षमार्यै च लज्जायै च नमो नमः ॥ ८१॥ तृष्णायै क्षुत्स्वरूपायै
    स्थितिकर्त्र्यै नमो नमः । नमः संहाररूपिण्यै महामार्यै नमो नमः ॥ ८२॥ भयायै चाभयायै च मुक्तिदायै नमो
    नमः । नमः स्वधायै स्वाहायै शान्त्यै कान्त्यै नमो नमः ॥ ८३॥ नमस्तुष्ट्यै च पुष्ट्यै च दयायै च नमो नमः
    । नमो निद्रास्वरूपायै श्रद्धायै च नमो नमः ॥ ८४॥ क्षुत्पिपासास्वरूपायै लज्जायै च नमो नमः । नमो धृत्यै
    क्षमायै च चेतनायै नमो नमः ॥ ८५॥ सर्वशक्तिस्वरूपिण्यै सर्वमात्रे नमो नमः । अग्नौ दाहस्वरूपायै भद्रायै
    च नमो नमः ॥ ८६॥ शोभायै पूर्णचन्द्रे च शरत्पद्मे नमो नमः । नास्ति भेदो यथा देवि दुग्धधावल्ययोःसदा ॥
    ८७॥ यथैव गन्धभूम्योश्च यथैव जलशैत्ययौः । यथैव शब्दनभसोर्ज्योतिः सूर्यकयोर्यथा ॥ ८८॥ लोके वेदे पुराणे
    च राधामाधवयोस्तथा । चेतनं कुरु कल्याणि देहि मामुत्तरं सति ॥ ८९॥ इत्युक्त्वा चोद्धवस्तत्र प्रणनाम पुनः
    पुनः । इत्युद्धवकृतं स्तोत्रं यः पठेद्भक्तिपूर्वकम् ॥ ९०॥ इह लोके सुखं भुक्त्वा यात्यन्ते हरिमन्दिरम्
    । न भवेद्बन्धुविच्छेदो रोगः शोकः सुदारुणः ॥ ९१॥ प्रोषिता स्त्री लभेत्कान्तं भार्याभेदी लभेत्प्रियाम्
    । अपुत्रो लभते पुत्रान्निर्धनो लभते धनम् ॥ ९२॥ निर्भूमिर्लभते भूमिं प्रजाहीनो लभेत्प्रजाम् । रोगाद्विमुच्यते
    रोगी बद्धो मुच्येत बन्धनात् ॥ ९३॥ भयान्मुच्येत भीतस्तु मुच्येताऽऽपन्न आपदः । अस्पष्टकीर्तिः सुयशा
    मूर्खो भवति पण्डितः ॥ ९४॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरे द्विनवतितमाध्यायान्तर्गतं
    उद्धवकृतं राधास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
