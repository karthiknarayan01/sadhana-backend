id: ranganayikastotram
category: stotram
name:
  english: ranganayikastotram
  devanagari: रन्गनायिकास्तोत्रम्
content:
  english: rbhuvaneshvari rangapaterdayite | api mam bharitam paripalaya te dayaya sharanagatikam padayoh
    || 11|| matah prasida kamale jagatam sushile tapatrayijanitaduhkhasahasrasanghaih | papairananyagatikam
    bharitam ca dinam mam raksha divyakripaya sharanagatam tvam || 12|| yushmatpadambujayugam sharanam
    gatasya matah prayaccha varade jagatam priyam me | shriranganayaki manoharadivyarupe pahi prasida
    kamale subhage sushile || 13|| bhavasindhumagnamaravindalocane pranataprasannamukhacandramandale |
    paripalayadya dayaniyadurdasham kripaya ca mam ca kamale dayanidhe || 14|| tava ranginashca caranambuje
    vina gatirasti no ca mama ranganayaki | iha mam kurushva tava kinkaram sada janani samasta jagatam
    dayanidhe || 15|| vidhishankarendramukhanirjaraih sada vanitayutashca kamale samarcite | akhileshtade
    sakalalokavallabhe satatam kurushva tava kinkaram tu mam || 16|| janani mama tvamasi sindhukanyake
    sharanam tvameva kamale dayanidhe | iha nistareyamahamabjalocane kripaya tavaiva bhavaghorasagaram
    || 17|| matah shrih sindhukanye kuvalayashapharipadmasaugandhikadi
  devanagari: र्भुवनेश्वरि रङ्गपतेर्दयिते । अपि मां भरितं परिपालय ते दयया शरणागतिकं पदयोः ॥ ११॥ मातः प्रसीद
    कमले जगतां सुशीले तापत्रयीजनितदुःखसहस्रसङ्घैः । पापैरनन्यगतिकं भरितं च दीनं मां रक्ष दिव्यकृपया शरणागतं
    त्वाम् ॥ १२॥ युष्मत्पदाम्बुजयुगं शरणं गतस्य मातः प्रयच्छ वरदे जगतां प्रियं मे । श्रीरङ्गनायकि मनोहरदिव्यरूपे
    पाहि प्रसीद कमले सुभगे सुशीले ॥ १३॥ भवसिन्धुमग्नमरविन्दलोचने प्रणतप्रसन्नमुखचन्द्रमण्डले । परिपालयाद्य
    दयनीयदुर्दशं कृपया च मां च कमले दयानिधे ॥ १४॥ तव रङ्गिणश्च चरणाम्बुजे विना गतिरस्ति नो च मम रङ्गनायकि
    । इह मां कुरुष्व तव किङ्करं सदा जननी समस्त जगतां दयानिधे ॥ १५॥ विधिशङ्करेन्द्रमुखनिर्जरैः सदा वनितायुतश्च
    कमले समर्चिते । अखिलेष्टदे सकललोकवल्लभे सततं कुरुष्व तव किङ्करं तु माम् ॥ १६॥ जननी मम त्वमसि सिन्धुकन्यके
    शरणं त्वमेव कमले दयानिधे । इह निस्तरेयमहमब्जलोचने कृपया तवैव भवघोरसागरम् ॥ १७॥ मातः श्रीः सिन्धुकन्ये
    कुवलयशफरीपद्मसौगन्धिकादि
