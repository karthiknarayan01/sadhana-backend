id: sri-surya-upanishad
category: stotram
name:
  english: Sri Surya Upanishad
content:
  english: shshrinuyama devah | bhadra mpashyemakshabhiryajatrah | sthirairangai stushtuvagm sastanubhih
    | vyashema devahitam ya~dayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti
    nastarkshyo arishtanemih | svasti no brihaspatirdadhatu | om shanti shshantih || om atha suryatharvangirasam
    khyasyamah | brahma rishih | gayatri chandah | adityo devata | hamsah so 'hamagninarayana yukta mbijam
    | hrillekha shaktih | viyadadisargasam nkilakam | caturvidhapurushartha siddhyarthe viniyogah | shat
    svararudhena bijena shadangam raktambujasamsthitam saptashvarathinam hiranyavarna nkalacakrapranetaram
    shrisuryanarayanam ssuvah | tatsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya t | surya
    atma jagatastasthushashca | suryadvai khalvimani bhutani jayante | surya 'nnamatma | namaste aditya
    | tvameva pratyaksha nkarma kartasi | tvameva pratyaksha 'si | tvameva pratyaksham vi~shnurasi | tvameva
    pratyaksham rudro 'si | tvameva pratyakshamrigasi | tvameva pratyaksham ya~jurasi | tvameva pratyaksham
    samasi | tvameva pratyakshamatharvasi | tvameva sarva 'si | adityadvayurjayate | adityadbhumirjayate
    | adityadapo jayante | adityajjyotirjayate | adityadvyoma disho jayante | adityaddeva jayante | adityadveda
    jayante | adityo va esha etanmandala ntapati | asavadityo brahma | adityo 'ntahkarana manobuddhi cittahankarah
    | adityo vai vyana 'panah pranah | adityo vai shrotra tvakcakshurasanaghranah | adityo vai vakpanipadapayupasthah
    | adityo vai shabdaspar sharuparasagandhah | adityo vai vacanadanagamana visarganandah | anandamayo
    vijnanamayo vijnanaghana adityah | namo mitraya bhanave mrityo rma pahi | bhrajishnave vishvahetave
    namah | suryadbhavanti bhutani suryena palitani tu | surye laya 'hameva ca | cakshurno deva ssavita
    cakshurna uta parvatah | cakshurdhata dadhatu nah | adityaya vidmahe sahasrakiranaya dhimahi | tannah
    suryah pracodaya t | savita pashcatta thsavita nah suvatu sarvata ndirghamayuh | omityekakshara mbrahma
    | ghriniriti dve akshare | surya ityaksharadvayam | aditya iti trinyaksharani | etasyaiva suryasyashtaksharo
    manuh | ya ssadaharaharjapati sa vai brahmano bhavati sa vai brahmano bhavati | suryabhimukho japtva
    mahavyadhi bhaya tpramucyate | alakshmirnashyati | abhakshya bhakshana tputo bhavati | agamyagamana
    tputo bhavati | patita sambhashana thsambhashanatputo bhavati | madhyahne suryabhimukhah pathet |
    sadyotpannapancamahapataka tpramucyate | saisha savitrim nna kincidapi na kasmaici tprashamsayet |
    ya eta mmahabhagah pratah pathati sa bhagyavan jayate pashunvindati | veda la~bhate | trikalametajjaptva
    kratushataphalamavapnoti | hastaditye japati sa mahamrityu ntarati sa mahamrityu ve~da | ityupanishat
    | o shshrinuyama devah | bhadra mpashyemakshabhiryajatrah | sthirairangai stushtuvagm sastanubhih
    | vyashema devahitam ya~dayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti
    nastarkshyo arishtanemih | svasti no brihaspatirdadhatu | om shanti
  devanagari: श्शृणु॒याम॑ देवाः । भ॒द्र म्प॑श्येमा॒क्षभि॒र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑
    । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः
    । स्व॒स्ति न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु । ॐ शान्ति॒ श्शान्तिः॑ ॥
    ॐ अथ सूर्याथर्वाङ्गिरसं ख्यास्या॒मः । ब्रह्मा ऋ॒षिः । गाय॑त्री छ॒न्दः । आदि॑त्यो दे॒वता । हंसः॑ सो॒
    ऽहमग्निनारायण यु॑क्त म्बी॒जम् । हृल्ले॑खा श॒क्तिः । वियदादिसर्गसं ङ्की॒लकम् । चतुर्विधपुरुषार्थ सिद्ध्यर्थे
    वि॑नियो॒गः । षट् स्वरारूढे॑न बीजे॒न षड॑ङ्गं र॒क्ताम्बु॑जसंस्थि॒तं सप्ताश्व॑रथि॒नं हिर॑ण्यव॒र्ण ङ्कालचक्र॑प्रणेता॒रं
    श्रीसूर्यनाराय॒णं स्सुवः॑ । तत्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचो॒दया त् ।
    सूर्य॑ आ॒त्मा जग॑तस्त॒स्थुष॑श्च । सूर्या॒द्वै खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । सूर्या ऽन्नमा॒त्मा ।
    नम॑स्ते आदित्य । त्वमे॒व प्र॒त्यक्ष॒ ङ्कर्म॑ कर्तासि । त्वमे॒व प्र॒त्यक्ष॒ ऽसि । त्वमे॒व प्र॒त्यक्षं॒
    विँष्णु॑रसि । त्वमे॒व प्र॒त्यक्षं॒ रुद्रो॑ ऽसि । त्वमे॒व प्र॒त्यक्ष॒मृग॑सि । त्वमे॒व प्र॒त्यक्षं॒
    यँजु॑रसि । त्वमे॒व प्र॒त्यक्षं॒ सामा॑सि । त्वमे॒व प्र॒त्यक्ष॒मथ॑र्वासि । त्वमे॒व सर्व॑ ऽसि । आ॒दि॒त्याद्वा॑युर्जा॒यते
    । आ॒दि॒त्याद्भू॑मिर्जा॒यते । आ॒दि॒त्यादापो॑ जाय॒न्ते । आ॒दि॒त्याज्ज्योति॑र्जाय॒ते । आ॒दि॒त्याद्व्योम
    दिशो॑ जाय॒न्ते । आ॒दि॒त्याद्दे॑वा जाय॒न्ते । आ॒दि॒त्याद्वे॑दा जाय॒न्ते । आ॒दि॒त्यो वा ए॒ष ए॒तन्म॒ण्डल॒
    न्तप॑ति । अ॒सावा॑दि॒त्यो ब्र॒ह्मा । आ॒दि॒त्यो ऽन्तःकरण मनोबुद्धि चित्ता॑हङ्का॒राः । आ॒दि॒त्यो वै व्यान
    ऽपा॑नः प्रा॒णः । आ॒दि॒त्यो वै श्रोत्र त्वक्चक्षूरस॑नघ्रा॒णाः । आ॒दि॒त्यो वै वाक्पाणिपादपा॑यूप॒स्थाः
    । आ॒दि॒त्यो वै शब्दस्पर् शरूपर॑सग॒न्धाः । आ॒दि॒त्यो वै वचनादानागमन विस॑र्गान॒न्दाः । आनन्दमयो विज्ञानमयो
    विज्ञानघन॑ आदि॒त्यः । नमो मित्राय भानवे मृत्यो र्मा पा॒हि । भ्राजिष्णवे विश्वहेत॑वे न॒मः । सूर्याद्भवन्ति॑
    भूता॒नि सूर्येण पालि॑तानि॒ तु । सूर्ये लय ऽह॑मेव॒ च । चक्षु॑र्नो दे॒व स्स॑वि॒ता चक्षु॑र्न उ॒त प॒र्वतः॑
    । चक्षु॑र्धा॒ता द॑धातु नः । आ॒दि॒त्याय॑ वि॒द्महे॑ सहस्रकिर॒णाय॑ धीमहि । तन्नः॑ सूर्यः प्रचो॒दया त्
    । स॒वि॒ता प॒श्चात्ता थ्सवि॒ता नः॑ सुवतु स॒र्वता न्दीर्घ॒मायुः॑ । ओमित्येकाक्ष॑र म्ब्र॒ह्म । घृणि॒रिति॒
    द्वे अ॒क्षरे । सूर्य॒ इत्यक्ष॑रद्व॒यम् । आ॒दि॒त्य इति॒ त्रीण्यक्ष॑राणि । एतस्यैव सूर्यस्याष्टाक्ष॑रो
    म॒नुः । य स्सदाहरह॑र्जप॒ति स वै ब्राह्म॑णो भ॒वति स वै ब्राह्म॑णो भ॒वति । सूर्याभिमु॑खो ज॒प्त्वा महाव्याधि
    भया त्प्रमु॒च्यते । अल॑क्ष्मीर्न॒श्यति । अभक्ष्य भक्षणा त्पू॑तो भ॒वति । अगम्यागमना त्पू॑तो भ॒वति ।
    पतित सम्भाषणा थ्सम्भाषणात्पू॑तो भ॒वति । मध्याह्ने सूर्याभि॑मुखः प॒ठेत् । सद्योत्पन्नपञ्चमहापातका त्प्रमु॒च्यते
    । सैषा सावि॑त्रीं न्न किञ्चिदपि न कस्मैचि॑ त्प्रशं॒सयेत् । य ए॒ता म्महाभागः प्रा॑तः प॒ठति स भाग्य॑वान्
    जा॒यते प॑शून्वि॒न्दति । वेदा लँ॒भते । त्रिकालमे॑तज्ज॒प्त्वा क्रतुशतफलम॑वाप्नो॒ति । हस्तादि॑त्ये ज॒पति
    स महामृ॑त्यु न्त॒रति स महामृ॑त्यु वेँ॒द । इत्यु॑प॒निष॑त् । ओ श्शृणु॒याम॑ देवाः । भ॒द्र म्प॑श्येमा॒क्षभि॒र्यज॑त्राः
    । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः
    । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु
    । ॐ शान्ति॒
