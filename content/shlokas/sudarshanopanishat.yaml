id: sudarshanopanishat
category: upanishad
name:
  english: sudarshanopanishat
  devanagari: सुदर्शनोपनिषत्
content:
  english: '|| shankhacakrordhvapundradidharanam smaranam hareh | tadiyaradhanam caiva bhaktirbahuvidha
    smrita || pashuputradikam sarvam grihopakaranani ca | ankayecchankhacakrabhyam nama kuryacca vaishnavam
    || pashurmanupyah pakshi va ye ca vaishnavasamshrayah | tenaiva te prayasyanti tadvishnoh paramam
    padam || dakshine tu bhuje vipro bibhriyadvai sudarshanam | savye tu shankham bibhriyaditi brahmavido
    viduh || brahmanaih kshatriyairvaishyaih shudraishca kritalakshanaih | arcaniyashca sevyashca nityayuktaih
    svakarmasu || ye kanthalayatulasinalinakshamala ye bahumulaparicihnitashankhacakra | ye va lalataphalake
    lasadurdhvapundrah shrivaishnava bhuvanamashu pavitrayanti || pancardratattvavidusham pancasamskarasamskritam
    | pancavasthasvarupam te vijneyam satatam vibho || pancasamskarayuktanam vaishnavanam visheshatah
    | griharcanavidhane na shankham ghantaravam tyajet | iti | etadatharvashiro yo''dhite ya urdhvapundram
    vidhivadviditva dharayati sa vaidiko bhavati | sa karmarho bhavati | anena tejasvi yashasvi brahmavarcasvi
    bhavati | aneka kayikavacikamanasapatakebhyah puto bhavati | shrivishnusayujyamavapnoti | shrivishnusayujyamavapnoti
    | ya evam veda | ityupanishat ||'
  devanagari: ॥ शङ्खचक्रोर्ध्वपुण्ड्रादिधारणं स्मरणं हरेः । तदीयाराधनं चैव भक्तिर्बहुविधा स्मृता ॥ पशुपुत्रादिकं
    सर्वं गृहोपकरणानि च । अङ्कयेच्छङ्खचक्राभ्यां नाम कुर्याच्च वैष्णवम् ॥ पशुर्मनुप्यः पक्षी वा ये च वैष्णवसंश्रयाः
    । तेनैव ते प्रयास्यन्ति तद्विष्णोः परमं पदम् ॥ दक्षिणे तु भुजे विप्रो बिभृयाद्वै सुदर्शनम् । सव्ये
    तु शङ्खं बिभृयादिति ब्रह्मविदो विदुः ॥ ब्राह्मणैः क्षत्रियैर्वैश्यैः शूद्रैश्च कृतलक्षणैः । अर्चनीयश्च
    सेव्यश्च नित्ययुक्तैः स्वकर्मसु ॥ ये कण्ठलयतुलसीनलिनाक्षमाला ये बाहुमूलपरिचिह्नितशङ्खचक्रा । ये वा
    ललाटफलके लसदूर्ध्वपुण्ड्राः श्रीवैष्णवा भुवनमाशु पवित्रयन्ति ॥ पञ्चार्द्रतत्त्वविदुषां पञ्चसंस्कारसंस्कृतम्
    । पञ्चावस्थास्वरूपं ते विज्ञेयं सततं विभो ॥ पञ्चसंस्कारयुक्तानां वैष्णवानां विशेषतः । गृहार्चनविधाने
    न शङ्खं घण्टारवं त्यजेत् । इति । एतदथर्वशिरो योऽधीते य ऊर्ध्वपुण्ड्रं विधिवद्विदित्वा धारयति स वैदिको
    भवति । स कर्मार्हो भवति । अनेन तेजस्वी यशस्वी ब्रह्मवर्चस्वी भवति । अनेक कायिकवाचिकमानसपातकेभ्यः पूतो
    भवति । श्रीविष्णुसायुज्यमवाप्नोति । श्रीविष्णुसायुज्यमवाप्नोति । य एवं वेद । इत्युपनिषत् ॥
