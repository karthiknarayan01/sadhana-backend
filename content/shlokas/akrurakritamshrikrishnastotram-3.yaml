id: akrurakritamshrikrishnastotram-3
category: stotram
name:
  english: akrurakritamshrikrishnastotram 3
  devanagari: अक्रूरकृतंश्रीकृष्णस्तोत्रम् ३
content:
  english: akrurakritam 3 shrikrishnastotram akrura uvaca | namah karanarupaya paramatmasvarupine sarveshamapi
    vishvanamishvaraya namo namah | paraya prakriterisha paratparataraya ca || 57|| nirgunaya nirihaya
    nirupaya svarupine | sarvadevasvarupaya sarvadeveshvaraya ca || 58|| sarvadevadhidevaya vishvadibhutarupine
    | asamshyeshu ca vishveshu brahmavishnushivatmaka || 59|| svarupaya''dibijaya tadishavishvarupine
    | namo gopanganeshaya ganesheshvararupine || 60|| namah suraganeshaya radheshaya namo namah | radharamanarupaya
    radharupadharaya ca || 61|| radharadhyaya radhayah pranadhikataraya ca | radhasadhyaya radhadhidevapriyatamaya
    ca || 62|| radhapranadhidevaya vishvarupaya te namah | vedastutatmavedajnarupine sarvavedine || 63||
    vaidadhishthatridevaya vedabijaya te namah | yasya lomasu vishvani casankhyani ca nityashah || 64||
    mahadvishnorishvaraya vishveshaya namo namah | svayam prakritirupaya prakritaya namu || 65|| prakritishvararupaya
    pradhanapurushaya ca | iti shribrahmavaivartapurane shrikrishnajanmakhande uttare saptatitamadhyayantargatam
    akrurakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: अक्रूरकृतं ३ श्रीकृष्णस्तोत्रम् अक्रूर उवाच । नमः कारणरूपाय परमात्मस्वरूपिणे सर्वेषामपि
    विश्वानामीश्वराय नमो नमः । पराय प्रकृतेरीश परात्परतराय च ॥ ५७॥ निर्गुणाय निरीहाय नीरूपाय स्वरूपिणे
    । सर्वदेवस्वरूपाय सर्वदेवेश्वराय च ॥ ५८॥ सर्वदेवाधिदेवाय विश्वादिभूतरूपिणे । असंश्येषु च विश्वेषु
    ब्रह्मविष्णुशिवात्मक ॥ ५९॥ स्वरूपायाऽऽदिबीजाय तदीशविश्वरूपिणे । नमो गोपाङ्गनेशाय गणेशेश्वररूपिणे ॥
    ६०॥ नमः सुरगणेशाय राधेशाय नमो नमः । राधारमणरूपाय राधारूपधराय च ॥ ६१॥ राधाराध्याय राधायाः प्राणाधिकतराय
    च । राधासाध्याय राधाधिदेवप्रियतमाय च ॥ ६२॥ राधाप्राणाधिदेवाय विश्वरूपाय ते नमः । वेदस्तुतात्मवेदज्ञरूपिणे
    सर्ववेदिने ॥ ६३॥ वैदाधिष्ठातृदेवाय वेदबीजाय ते नमः । यस्य लोमसु विश्वानि चासङ्ख्यानि च नित्यशः ॥ ६४॥
    महद्विष्णोरीश्वराय विश्वेशाय नमो नमः । स्वयं प्रकृतिरूपाय प्राकृताय नमू ॥ ६५॥ प्रकृतीश्वररूपाय प्रधानपुरूषाय
    च । इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरे सप्ततितमाध्यायान्तर्गतं अक्रूरकृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
