id: dayashatakam-2-2
category: shataka
name:
  english: dayashatakam 2
  devanagari: दयाशतकम् २
content:
  english: grahacanamanukampe nanvadah shankarakhye | pradishasi mama kim na tvanniveshe pravesham pradadati
    bhuvane kim pranashunyaya kanyam || 44|| sagaraḻamadhikantham sanalam bhaladeshe sadanamahiparitam
    sarvataste'nukampe | tadidamupagata ye tanimamstanvati tvam viharasi jitamrityun vikshitanapyamibhih
    || 45|| na vitara padamaindram na shriyam vaidhasim va shritabhujagakule'pi kshveḻakheladgaḻe'pi |
    mama ghataya daye tvanmandire sampravesham vigalitavividhavyasangametanmamalam || 46|| tava samudayarodham
    tatparo'sau vidhatte svakacaritamahimna svatmaghati tamenam | bhagavati nanu bhartum bhramyasishanukampe
    tava parahitanishtha tadrishi stautu kastvam || 47|| kiyadiva vimukhatvam citsukhatmanyumeshe ratirapi
    kiyati me'nyatra dhinmam mamasya | asadapi na daye tvam hasyasi tranamaddha tava ka iha niroddha dasayantyastamisham
    || 48|| ashrudgamagadgadavagaviralapulakadhyaya bhave bhaktya | kati na ramante mam shivakarune kuru
    tadanugam mamaitadalam || 49|| karune tarunendudharastvadvashavartiti tava nishamya yashah | tasyavalambamihe
    tadghatane pratibhuva tvaya bhavyam || 50|| janimritidahanarcishshantidivyamritaughe janani shashivibhushe
    tvadgrihe sampravesham | vighatayadanukampe vighnavrindam vibhindan mayi patatu kada tvannirjharah
    shrantihari || 51|| tvamabhijnashikhamanau maheshe bhajadatyankushamantusantatinam | yadapahnutipandita
    daye tanniravadyam tava vedmi sahasikyam || 52|| karune kathaye kimajnaya te hyanudhavatyahaha smaranti
    ye tan | makutavyatishangicandrarekham madanadhvamsi madiyabhagadheyam || 53|| harinarbhakamanane
    tarakshoriva kantadimukhe bhayanake mam | vinipatya shivo vilokamanah karune kinna kadarthyate bhavatya
    || 54|| karune tarunendudharino madbharane shamsa tavamba ko viḻambah | ganito'yamaham kilakhilangishvayi
    kim teshu na mamalekhayastvam || 55|| aghavaniti mayyasangrihite sakalaghapahajatunamavadah | api
    dinajanaviteti kirtyoh avasadam karune'bhidhehi shambhoh || 56|| mama shambhudaye tvadarhatayam ahamanyanna
    vilokayamyupayam | mama coditayartibhistvayaiva shrayaniya tadupayata bruve kim || 57|| purabhitkarune
    purandaradyaih tvamupasya sulabha na nastathapi | pracakasti paratidurlabhatvatpadadarshi nanu dinata''shrayo
    nah || 58|| bhavatishadaye payodamala bhavativranalashantidashriteshu | tamasamavasadikah shivekshatatitashcitramacancalah
    prasute || 59|| karune shivacandracandrika'sau bhavati sanmanisaudhasamsadiva | prasrita'pi mayiha
    tucchakudye timiram lumpatu tavata kshatih ka || 60|| kutukaparavashairumakatakshaih kuvalayabhaji
    navodupavatamse | janani tava jhare nimagnamastajvarabharamaracayerdaye kada mam || 61|| bata sahaviharaddarasmitanam
    paricaranadhikritaravindabhasam | bhagavati karune tvayeritanam pathi kimasanyahamishavikshitanam
    || 62|| sarvajnatvadigunah svatmatranaikalampata bahavah | sharvasya shankarakhyanirvahanam taddaye
    tvadayattam || 63|| shrikanthaya kshveḻam rocitavatya daye nanu bhavatya | mamakamantukadambe kevalamambeha
    vada vilambah kah || 64|| shiva iti tadbhaktiriti smritirasya ca seti sartihantriti | iyadavagamayya
    sheshe viratiriyam shivadaye na te sadrishi || 65|| abjjayitumacyutayitumapi shivayitumalamumeshakarune
    tvam | alamasi shivarasikanamakshipathe kinna mam pravartayitum || 66|| vijayasva siddhyatattava vidhushekharavipralambhanaipunyam
    | manmantubhirunmishatu ca matah karune picandilatvam te || 67|| karune yadi manmantun kabaḻayasi
    na vipralabdhagirisha tvam | ka mama gatistavapi ca ka gatiragobhireva jivantyah || 68|| karune tvadadhvaganam
    kamadya ye dvishastadunmathane | girisham tvayerayantya krito'sya bhimogranamasamsargah || 69|| sharvam
    prati manmantushu sarvajnataya nivedyamaneshu | adhuyatamamum dridhamalingya daye nayashu paravashatam
    || 70|| ahaha girishaikatanamabhilashitasthitimanaptavati mayi tam | artishu majjati vartitumarhasi
    na stabdhamevamishadaye || 71|| nagamsi yanmahantyapi ganyante gunakano bahu kriyate | girishena tadanugairapi
    tad girishe tvanniveshatah karune || 72|| mativagapade'nante maheshvare manananamanapujabhih | agobhirabhavi
    gunairanukampe tasya tava parishvangat || 73|| avarundhatya karune haram tvaya tasya mamakasvantam
    | geham kriyatamayi me sahankriyatajvaram jihirshasi cet || 74|| kamarina nivishtaih kamadibhirasharanastvaham
    karune | tadye kila kinna tvam tat jnapayasi tacca kinna varayasi || 75|| antakaharam padam tava hanta
    daye ghratumapyanarham mam | akaroddurvidhirastu tadapanayane tava vilambanam narham || 76|| drishte
    maya tvadokasi drisha'naya sarvamangaḻashlishte | karune ka tava hanih kati kati taddarshinastvaya
    na kritah || 77|| dugdharthino munishishordugdhambunidhirvasham nitah | jaladhiraparasya haste jalakanatam
    shivadaye na te'sti bharah || 78|| avatamsitendukandaḻamajnavashavartipavanatapanadim | kalaye daye
    tava jharam karmaparabrahmagandhinishvasam || 79|| karune'ngikurya mam kada'mba tamumasakham cidakaram
    | galahastitavishayantaramasinam manmatau kada kuryah || 80|| bhayavirahamantakattvam pradisha parasyeva
    na mama kintu bhayam | yena shive'bhiratassyam shivanukampe prasida tadalam me || 81|| gaurisakhamudugauram
    kandarpasahasrasundarakaram | nilagrivamudaram nidhehi manmanasi tava daye puram || 82|| krandeyam
    bata kam pratiha balina kamena kamantakah kamam pashyati pidyamanamapi mam kalena kalantakah | tvam
    cettasya vibhorbhavatkritaparishvangairapangairdaye mamamodayase kshatistava tu ka kim syacca me'sau
    dasha || 83|| nidralasyabharo vapushyatijaradussanga irshya matih yatra kvapi hi kaishciditthamashubhairvighnaih
    paritasya me | ishane'bhiratishca nirvritikatha kveshanukampe kada dinanveshini mam tvadabhyupagamo
    dinagraganyam sprishet || 84|| tarane bhavasya sharanaishina maya duritani hanta caritanyalam daye
    | ucitani naiva rucitani manase lapitani caiva kupitakritini me | shamanavalepadamanavaha'mba kinvapushat
    na khinnavapusham mrikandujam | bhavati madiyabhavativratapahrit tarunenducuda karune na kim bhavet
    || 86|| ucitam tavoparacitam daye na kim prabalaparadhakabaḻarpanam maya | ayi sharvamamba mayi sharmadam
    na kim vitanoshi shamsa bata no yasho'styatah || 87|| garaḻe harasya taraḻetaram rucim bhavati daye'rpitavati
    na me'mhasi | uditadara'tra vidita karaḻata mahita na sa kimahitavaha tava || 88|| kalina'muna'tibalina
    kadarthitah svahite kshamo na vihite'smi madrisham | avane shramastu tava neshiturdaye jagati tvayaiva
    sagatistadasmyaham || 89|| valabhedanadisulabhetaram haram smarato daḻambu kirato'pi nirvasoh | nayase
    vasham kalayase'dbhutam daye
  devanagari: ग्रहचणमनुकम्पे नन्वदाः शङ्कराख्ये । प्रदिशसि मम किं न त्वन्निवेशे प्रवेशं प्रददति भुवने
    किं प्राणशून्याय कन्याम् ॥ ४४॥ सगरळमधिकण्ठं सानलं भालदेशे सदनमहिपरीतं सर्वतस्तेऽनुकम्पे । तदिदमुपगता
    ये तानिमांस्तन्वती त्वं विहरसि जितमृत्यून् वीक्षितानप्यमीभिः ॥ ४५॥ न वितर पदमैन्द्रं न श्रियं वैधसीं
    वा श्रितभुजगकुलेऽपि क्ष्वेळखेलद्गळेऽपि । मम घटय दये त्वन्मन्दिरे सम्प्रवेशं विगलितविविधव्यासङ्गमेतन्ममालम्
    ॥ ४६॥ तव समुदयरोधं तत्परोऽसौ विधत्ते स्वकचरितमहिम्ना स्वात्मघाती तमेनम् । भगवति ननु भर्तुं भ्राम्यसीशानुकम्पे
    तव परहितनिष्ठा तादृशी स्तौतु कस्त्वाम् ॥ ४७॥ कियदिव विमुखत्वं चित्सुखात्मन्युमेशे रतिरपि कियती मेऽन्यत्र
    धिङ्मां ममास्य । असदपि न दये त्वं हास्यसि त्राणमद्धा तव क इह निरोद्धा दासयन्त्यास्तमीशम् ॥ ४८॥ अश्रूद्गमगद्गदवागविरलपुलकाढ्यया
    भवे भक्त्या । कति न रमन्ते मां शिवकरुणे कुरु तदनुगं ममैतदलम् ॥ ४९॥ करुणे तरुणेन्दुधरस्त्वद्वशवर्तीति
    तव निशम्य यशः । तस्यावलम्बमीहे तद्घटने प्रतिभुवा त्वया भाव्यम् ॥ ५०॥ जनिमृतिदहनार्चिश्शान्तिदिव्यामृतौघे
    जननि शशिविभूषे त्वद्गृहे सम्प्रवेशम् । विघटयदनुकम्पे विघ्नवृन्दं विभिन्दन् मयि पततु कदा त्वन्निर्झरः
    श्रान्तिहारी ॥ ५१॥ त्वमभिज्ञशिखामणौ महेशे भजदत्यङ्कुशमन्तुसन्ततीनाम् । यदपह्नुतिपण्डिता दये तन्निरवद्यं
    तव वेद्मि साहसिक्यम् ॥ ५२॥ करुणे कथये किमाज्ञया ते ह्यनुधावत्यहह स्मरन्ति ये तान् । मकुटव्यतिषङ्गिचन्द्ररेखं
    मदनध्वंसि मदीयभागधेयम् ॥ ५३॥ हरिणार्भकमानने तरक्षोरिव कान्तादिमुखे भयानके माम् । विनिपात्य शिवो विलोकमानः
    करुणे किन्न कदर्थ्यते भवत्या ॥ ५४॥ करुणे तरुणेन्दुधारिणो मद्भरणे शंस तवाम्ब को विळम्बः । गणितोऽयमहं
    किलाखिलाङ्गिष्वयि किं तेषु न मामलेखयस्त्वम् ॥ ५५॥ अघवानिति मय्यसङ्गृहीते सकलाघापहजातुनामवादः । अपि
    दीनजनावितेति कीर्त्योः अवसादं करुणेऽभिधेहि शम्भोः ॥ ५६॥ मम शम्भुदये त्वदर्हतायां अहमन्यन्न विलोकयाम्युपायम्
    । मम चोदितयार्तिभिस्त्वयैव श्रयणीया तदुपायता ब्रुवे किम् ॥ ५७॥ पुरभित्करुणे पुरन्दराद्यैः त्वमुपास्या
    सुलभा न नस्तथापि । प्रचकास्ति परातिदुर्लभत्वत्पददर्शी ननु दीनताऽऽश्रयो नः ॥ ५८॥ भवतीशदये पयोदमाला
    भवतीव्रानलशान्तिदाश्रितेषु । तमसामवसादिकाः शिवेक्षातटितश्चित्रमचञ्चलाः प्रसूते ॥ ५९॥ करुणे शिवचन्द्रचन्द्रिकाऽसौ
    भवती सन्मणिसौधसंसदीव । प्रसृताऽपि मयीह तुच्छकुड्ये तिमिरं लुम्पतु तावता क्षतिः का ॥ ६०॥ कुतुकपरवशैरुमाकटाक्षैः
    कुवलयभाजि नवोडुपावतंसे । जननि तव झरे निमग्नमस्तज्वरभरमारचयेर्दये कदा माम् ॥ ६१॥ बत सहविहरद्दरस्मितानां
    परिचरणाधिकृतारविन्दभासाम् । भगवति करुणे त्वयेरितानां पथि किमसान्यहमीशवीक्षितानाम् ॥ ६२॥ सर्वज्ञत्वादिगुणाः
    स्वात्मत्राणैकलम्पटा बहवः । शर्वस्य शङ्कराख्यानिर्वहणं तद्दये त्वदायत्तम् ॥ ६३॥ श्रीकण्ठाय क्ष्वेळं
    रोचितवत्या दये ननु भवत्या । मामकमन्तुकदम्बे केवलमम्बेह वद विलम्बः कः ॥ ६४॥ शिव इति तद्भक्तिरिति स्मृतिरस्य
    च सेति सार्तिहन्त्रीति । इयदवगमय्य शेषे विरतिरियं शिवदये न ते सदृशी ॥ ६५॥ अब्ज्जयितुमच्युतयितुमपि
    शिवयितुमलमुमेशकरुणे त्वम् । अलमसि शिवरसिकानामक्षिपथे किन्न मां प्रवर्तयितुम् ॥ ६६॥ विजयस्व सिद्ध्यतात्तव
    विधुशेखरविप्रलम्भनैपुण्यम् । मन्मन्तुभिरुन्मिषतु च मातः करुणे पिचण्डिलत्वं ते ॥ ६७॥ करुणे यदि मन्मन्तून्
    कबळयसि न विप्रलब्धगिरिशा त्वम् । का मम गतिस्तवापि च का गतिरागोभिरेव जीवन्त्याः ॥ ६८॥ करुणे त्वदध्वगानां
    कामाद्या ये द्विषस्तदुन्मथने । गिरिशं त्वयेरयन्त्या कृतोऽस्य भीमोग्रनामसंसर्गः ॥ ६९॥ शर्वं प्रति मन्मन्तुषु
    सर्वज्ञतया निवेद्यमानेषु । आधूयताममुं दृढमालिङ्ग्य दये नयाशु परवशताम् ॥ ७०॥ अहह गिरिशैकतानामभिलषितस्थितिमनाप्तवति
    मयि ताम् । आर्तिषु मज्जति वर्तितुमर्हसि न स्तब्धमेवमीशदये ॥ ७१॥ नागांसि यन्महान्त्यपि गण्यन्ते गुणकणो
    बहु क्रियते । गिरिशेन तदनुगैरपि तद् गिरिशे त्वन्निवेशतः करुणे ॥ ७२॥ मतिवागपदेऽनन्ते महेश्वरे मनननमनपूजाभिः
    । आगोभिरभावि गुणैरनुकम्पे तस्य तव परिष्वङ्गात् ॥ ७३॥ अवरुन्धत्या करुणे हरं त्वया तस्य मामकस्वान्तम्
    । गेहं क्रियतामयि मे साहङ्क्रियताज्वरं जिहीर्षसि चेत् ॥ ७४॥ कामारिणा निविष्टैः कामादिभिरशरणस्त्वहं
    करुणे । ताड्ये किल किन्न त्वं तत् ज्ञपयसि तच्च किन्न वारयसि ॥ ७५॥ अन्तकहरं पदं तव हन्त दये घ्रातुमप्यनर्हं
    माम् । अकरोद्दुर्विधिरस्तु तदपनयने तव विलम्बनं नार्हम् ॥ ७६॥ दृष्टे मया त्वदोकसि दृशाऽनया सर्वमङ्गळाश्लिष्टे
    । करुणे का तव हानिः कति कति तद्दर्शिनस्त्वया न कृताः ॥ ७७॥ दुग्धार्थिनो मुनिशिशोर्दुग्धाम्बुनिधिर्वशं
    नीतः । जलधिरपरस्य हस्ते जलकणतां शिवदये न तेऽस्ति भरः ॥ ७८॥ अवतंसितेन्दुकन्दळमाज्ञावशवर्तिपवनतपनादिम्
    । कलये दये तव झरं कर्मपरब्रह्मगन्धिनिश्वासम् ॥ ७९॥ करुणेऽङ्गीकुर्या मां कदाऽम्ब तमुमासखं चिदाकारम्
    । गलहस्तितविषयान्तरमासीनं मन्मतौ कदा कुर्याः ॥ ८०॥ भयविरहमन्तकात्त्वं प्रदिश परस्येव न मम किन्तु भयम्
    । येन शिवेऽभिरतस्स्यां शिवानुकम्पे प्रसीद तदलं मे ॥ ८१॥ गौरीसखमुडुगौरं कन्दर्पसहस्रसुन्दराकारम् ।
    नीलग्रीवमुदारं निधेहि मन्मनसि तव दये पूरम् ॥ ८२॥ क्रन्देयं बत कं प्रतीह बलिना कामेन कामान्तकः कामं
    पश्यति पीड्यमानमपि मां कालेन कालान्तकः । त्वं चेत्तस्य विभोर्भवत्कृतपरिष्वङ्गैरपाङ्गैर्दये मामामोदयसे
    क्षतिस्तव तु का किं स्याच्च मेऽसौ दशा ॥ ८३॥ निद्रालस्यभरो वपुष्यतिजरादुस्सङ्ग ईर्ष्या मतिः यत्र क्वापि
    हि कैश्चिदित्थमशुभैर्विघ्नैः परीतस्य मे । ईशानेऽभिरतिश्च निर्वृतिकथा क्वेशानुकम्पे कदा दीनान्वेषिणि
    मां त्वदभ्युपगमो दीनाग्रगण्यं स्पृशेत् ॥ ८४॥ तरणे भवस्य शरणैषिणा मया दुरितानि हन्त चरितान्यलं दये
    । उचितानि नैव रुचितानि मानसे लपितानि चैव कुपिताकृतीनि मे । शमनावलेपदमनावहाऽम्ब किन्वपुषत् न खिन्नवपुषं
    मृकण्डुजम् । भवती मदीयभवतीव्रतापहृत् तरुणेन्दुचूड करुणे न किं भवेत् ॥ ८६॥ उचितं तवोपरचितं दये न किं
    प्रबलापराधकबळार्पणं मया । अयि शर्वमम्ब मयि शर्मदं न किं वितनोषि शंस बत नो यशोऽस्त्यतः ॥ ८७॥ गरळे हरस्य
    तरळेतरां रुचिं भवती दयेऽर्पितवती न मेऽम्हसि । उदितादराऽत्र विदिता कराळता महिता न सा किमहितावहा तव
    ॥ ८८॥ कलिनाऽमुनाऽतिबलिना कदर्थितः स्वहिते क्षमो न विहितेऽस्मि मादृशाम् । अवने श्रमस्तु तव नेशितुर्दये
    जगति त्वयैव सगतिस्तदस्म्यहम् ॥ ८९॥ वलभेदनादिसुलभेतरं हरं स्मरतो दळाम्बु किरतोऽपि निर्वसोः । नयसे वशं
    कलयसेऽद्भुतं दये
