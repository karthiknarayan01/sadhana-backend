id: hamsa-guhya-stotram-bhagavata-purana
category: stotram
name:
  english: Hamsa Guhya Stotram (Bhagavata Purana)
content:
  english: bhagavatapuranantargatam namah parayavitathanubhutaye gunatrayabhasanimittabandhave | adrishtadhamne
    gunatattvabuddhibhih nivrittamanaya dadhe svayambhuve || || na yasya sakhyam purusho'vaiti sakhyuh
    sakha vasansamvasatah pure'smin | guno yatha gunino vyaktadrishteh tasmai maheshaya namaskaromi ||
    || deho'savo'ksha manavo bhutamatra natmanamanyam ca viduh param yat | sarvam puman veda gunamshca
    tajjno na veda sarvajnamanantamide || || yadoparamo manaso namarupa rupasya drishtasmritisapramoshat
    | ya iyate kevalaya svasamsthaya hamsaya tasmai shucisadmane namah || || manishino'ntarhadi sanniveshitam
    svashaktibhirnavabhishca trivridbhih | vahnim yatha daruni pancadashyam manishaya nishkarshanti gudham
    || || sa vai mamasheshavisheshamaya nishedhanivanasukhanubhutih | sa sarvanama sa ca vishvarupah prasidatamaniruktatmashaktih
    || || yadyanniruktam vacasa nirupitam dhiya'kshabhirva manasa vota yasya | ma bhutsvarupam gunarupam
    hi tattat sa vai gunapayavisargalakshanah || || yasmin yato yena ca yasya yasmai yadyo yatha kurute
    karyate ca | paravaresham paramam prak prasiddham tadbrahma taddheturananyadekam || || yacchaktayo
    vadatam vaditam vai vivadasamvadabhuvo bhavanti | kurvanti caisham muhuratmamoham tasmai namo'nantagunaya
    bhumne || || astiti nastiti ca vastunishthayoh ekasthayorbhinnaviruddhadharmayoh | avekshitam kim
    ca na yogasankhyayoh samam param hyanukulam brihattat || || yo'nugahartham bhajatam padamulamanamarupo
    bhagavananantah | namani rupani ca janmakarmabhirbheje sa mahyam paramah prasidatu || || yah prakritairjnanapathairjananam
    yathashayam dehagato vibhati | yathanilah parthivamashrito gunam sa ishvaro me kurutanmanoratham ||
    || || iti hamsaguhyastotram sampurnam ||
  devanagari: भागवतपुराणान्तर्गतम् नमः परायावितथानुभूतये गुणत्रयाभासनिमित्तबन्धवे । अदृष्टधाम्ने गुणतत्त्वबुद्धिभिः
    निवृत्तमानाय दधे स्वयम्भुवे ॥ ॥ न यस्य सख्यं पुरुषोऽवैति सख्युः सखा वसन्संवसतः पुरेऽस्मिन् । गुणो
    यथा गुणिनो व्यक्तदृष्टेः तस्मै महेशाय नमस्करोमि ॥ ॥ देहोऽसवोऽक्षा मनवो भूतमात्रा नात्मानमन्यं च विदुः
    परं यत् । सर्वं पुमान् वेद गुणांश्च तज्ज्ञो न वेद सर्वज्ञमनन्तमीडे ॥ ॥ यदोपरामो मनसो नामरूप रूपस्य
    दृष्टस्मृतिसप्रमोषात् । य ईयते केवलया स्वसंस्थया हंसाय तस्मै शुचिसद्मने नमः ॥ ॥ मनीषिणोऽन्तर्हदि सन्निवेशितं
    स्वशक्तिभिर्नवभिश्च त्रिवृद्भिः । वह्निं यथा दारुणि पाञ्चदश्यं मनीषया निष्कर्षन्ति गूढम् ॥ ॥ स वै
    ममाशेषविशेषमाया निषेधनिवाणसुखानुभूतिः । स सर्वनामा स च विश्वरूपः प्रसीदतामनिरुक्तात्मशक्तिः ॥ ॥ यद्यन्निरुक्तं
    वचसा निरूपितं धियाऽक्षभिर्वा मनसा वोत यस्य । मा भूत्स्वरूपं गुणरूपं हि तत्तत् स वै गुणापायविसर्गलक्षणः
    ॥ ॥ यस्मिन् यतो येन च यस्य यस्मै यद्यो यथा कुरूते कार्यते च । परावरेषां परमं प्राक् प्रसिद्धं तद्ब्रह्म
    तद्धेतुरनन्यदेकम् ॥ ॥ यच्छक्तयो वदतां वादितां वै विवादसंवादभुवो भवन्ति । कुर्वन्ति चैषां मुहुरात्ममोहं
    तस्मै नमोऽनन्तगुणाय भूम्ने ॥ ॥ अस्तीति नास्तीति च वस्तुनिष्ठयोः एकस्थयोर्भिन्नविरुद्धधर्मयोः । अवेक्षितं
    किं च न योगसाङ्ख्ययोः समं परं ह्यनुकूलं बृहत्तत् ॥ ॥ योऽनुगहार्थं भजतां पादमूलमनामरूपो भगवाननन्तः
    । नामानि रूपाणि च जन्मकर्मभिर्भेजे स मह्यं परमः प्रसीदतु ॥ ॥ यः प्राकृतैर्ज्ञानपथैर्जनानां यथाशयं
    देहगतो विभाति । यथानिलः पार्थिवमाश्रितो गुणं स ईश्वरो मे कुरुतान्मनोरथम् ॥ ॥ ॥ इति हंसगुह्यस्तोत्रं
    सम्पूर्णम् ॥
