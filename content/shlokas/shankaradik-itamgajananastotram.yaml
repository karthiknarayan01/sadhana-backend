id: shankaradik-itamgajananastotram
category: stotram
name:
  english: shankaradikṟitamgajananastotram
  devanagari: शन्करादिक्ऱितंगजाननस्तोत्रम्
content:
  english: gajananastotram shamkaradikritam shri ganeshaya namah | deva ucuh | gajananaya purnaya samkhyarupamayaya
    te | videhena ca sarvatra samsthitaya namo namah || 1|| ameyaya ca heramba parashudharakaya te | mushakavahanayaiva
    vishveshaya namo namah || 2|| anantavibhavayaiva paresham pararupine | shivaputraya devaya guhagrajaya
    te namah || 3|| parvatinandanayaiva devanam palakaya te | sarvesham pujyadehaya ganeshaya namo namah
    || 4|| svanandavasine tubhyam shivasya kuladaivata | vishnvadinam visheshena kuladevaya te namah ||
    5|| yogakaraya sarvesham yogashantipradaya ca | brahmeshaya namastubhyam brahmabhutapradaya te ||
    6|| siddhi
  devanagari: गजाननस्तोत्रं शंकरादिकृतम् श्री गणेशाय नमः । देवा ऊचुः । गजाननाय पूर्णाय सांख्यरूपमयाय ते
    । विदेहेन च सर्वत्र संस्थिताय नमो नमः ॥ १॥ अमेयाय च हेरम्ब परशुधारकाय ते । मूषकवाहनायैव विश्वेशाय
    नमो नमः ॥ २॥ अनन्तविभवायैव परेशां पररूपिणे । शिवपुत्राय देवाय गुहाग्रजाय ते नमः ॥ ३॥ पार्वतीनन्दनायैव
    देवानां पालकाय ते । सर्वेषां पूज्यदेहाय गणेशाय नमो नमः ॥ ४॥ स्वानन्दवासिने तुभ्यं शिवस्य कुलदैवत ।
    विष्ण्वादीनां विशेषेण कुलदेवाय ते नमः ॥ ५॥ योगाकाराय सर्वेषां योगशान्तिप्रदाय च । ब्रह्मेशाय नमस्तुभ्यं
    ब्रह्मभूतप्रदाय ते ॥ ६॥ सिद्धि
