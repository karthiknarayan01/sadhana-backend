id: mahatripurasundaryashtottarashatanamastotram
category: stotram
name:
  english: mahatripurasundaryashtottarashatanamastotram
  devanagari: महात्रिपुरसुन्दर्यष्टोत्तरशतनामस्तोत्रम्
content:
  english: moksheshu viniyogah || om mahamaya mahadevi menaka meghagarjini | mohini harinakshi ca harini
    haravallabha || 3|| haripujya hararadhya hera hemavati hara | hemarupa ca hema ca hemabharanabhushita
    || 4|| ranginirangarupa ca radha vrindavaneshvari | valavalavati bala balika veshadharini || 5|| vayastha
    veshadha caiva vidya shrivishnupujita | viyadganga vyomaganga vishala vishvamohini || 6|| rangini
    ranganiya ca ranabhumikatalaya | puta pavitra parama para punyavibhushana || 7|| punyanamni papahantri
    paparih papanashini | punyada punyakirttishca punyashloka ca pavani || 8|| rupamala rupavati rasaveshaparicchada
    | rakshani rakshaniya ca rukmamala vibhushana || 9|| rasarupa rasollasa rasanaghaparicchada
  devanagari: मोक्षेषु विनियोगः ॥ ॐ महामाया महादेवी मेनका मेघगर्जिनी । मोहिनी हरिणाक्षी च हारिणी हरवल्लभा
    ॥ ३॥ हरिपूज्या हराराध्या हेरा हेमवती हरा । हेमरूपा च हेमा च हेमाभरणभूषिता ॥ ४॥ रङ्गिणीरङ्गरूपा च राधा
    वृन्दावनेश्वरी । वलावलवती बाला बालिका वेशधारिणी ॥ ५॥ वयस्था वेशधा चैव विद्या श्रीविष्णुपूजिता । वियद्गङ्गा
    व्योमगङ्गा विशाला विश्वमोहिनी ॥ ६॥ रङ्गिणी रङ्गणीया च रणभूमिकतालया । पूता पवित्रा परमा परा पुण्याविभूषण
    ॥ ७॥ पुण्यनाम्नी पापहन्त्री पापारिः पापनाशिनी । पुण्यदा पुण्यकीर्त्तिश्च पुण्यश्लोका च पावनी ॥ ८॥
    रूपमाला रूपवती रसावेशपरिच्छदा । रक्षणी रक्षणीया च रुक्ममाला विभूषणा ॥ ९॥ रसरूपा रसोल्लासा रसानघपरिच्छदा
