    namah | om krishangyai namah | om kinnaryai namah | om kartryai namah | om kalakanthyai namah | om
    kartikyai namah | om kambukanthyai namah | om kaulinyai namah | om kumudayai namah | om kamajivinyai
    namah | | om kulastriyai namah | om kirtikayai namah | om krityayai namah | om kirtyai namah | om
    kulapalikayai namah | om kamadevakalayai namah | om kalpalatayai namah | om kamangavardhinyai namah
    | om kuntayai namah | om kumudapritayai namah | | om kadambakusumotsukayai namah | om kadambinyai
    namah | om kamalinyai namah | om krishnanandapradayinyai namah | om kumaripujanaratayai namah | om
    kumariganashobhitayai namah | om kumariranjanaratayai namah | om kumarivratadharinyai namah | om kankalyai
    namah | om kamaniyayai namah | | om kamashastravisharadayai namah | om kapalakhatvangadharayai namah
