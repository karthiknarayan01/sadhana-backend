id: durgashtottarashatanamastotram-2
category: stotram
name:
  english: durgashtottarashatanamastotram 2
  devanagari: दुर्गाष्टोत्तरशतनामस्तोत्रम् २
content:
  english: shridurgashtottarashatanamastotram || om || || shri durgayai namah || atha shridurgashtottarashatanamastotram
    | om durga shiva mahalakshmirmahagauri ca candika | sarvajna sarvalokesha sarvakarmaphalaprada ||
    1 || sarvatirthamaya punya devayonirayonija | bhumija nirguna caivadharashaktiranishvara || 2 || nirguna
    nirahankara sarvagarvavimardini | sarvalokapriya vani sarvavidyadhidevata || 3 || parvati devamata
    ca vanisha vindhyavasini | tejovati mahamata kotisuryasamaprabha || 4 || devata vahnirupa ca sadauja
    varnarupini | gunashraya gunamayi gunatrayavivarjita || 5 || karmajnanaprada kanta sarvasamharakarini
    | dharmajnana dharmanishtha sarvakarmavivarjita || 6 || kamaksha kamasamhantri kamakrodhavivarjita
    | shankari shambhavi shanta candrasuryagnilocana || 7 || sujaya jayabhumishtha jahnavi janapujita
    | shastra shastramaya nitya shubha candrardhamastaka || 8 || bharati bhramari kalpa karali krishnapingala
    | brahmi narayani raudra candramritaparishruta || 9 || jyeshthendira mahamaya jagatsrishtyadikarini
    | brahmandakotisamsthana kamini kamalalaya || 10 || katyayani kalatita kalasamharakarini | yoginishtha
    yogigamya yogidhyeya tapasvini || 11 || jnanarupa nirakara bhaktabhishtaphalaprada | bhutatmika bhutamata
    bhutesha bhutadharini || 12 || svadhanarimadhyagata shadadharadivartini | mohhita shubhada shubhra
    sukshma matra niralasa || 13 || nimnaga nilasankasha nityananda hara para | sarvajnanaprada'nanta
    satya durlabharupini | sarasvati sarvagata sarvabhishtapradayini || 14|| || iti durgashtottarashatanamastotram
    sampurnam || muladurgashtottarashatanamastotram
  devanagari: श्रीदुर्गाष्टोत्तरशतनामस्तोत्रम् ॥ ॐ ॥ ॥ श्री दुर्गायै नमः ॥ अथ श्रीदुर्गाष्टोत्तरशतनामस्तोत्रम्
    । ॐ दुर्गा शिवा महालक्ष्मीर्महागौरी च चण्डिका । सर्वज्ञा सर्वलोकेशा सर्वकर्मफलप्रदा ॥ १ ॥ सर्वतीर्थमया
    पुण्या देवयोनिरयोनिजा । भूमिजा निर्गुणा चैवाधारशक्तिरनीश्वरा ॥ २ ॥ निर्गुणा निरहङ्कारा सर्वगर्वविमर्दिनी
    । सर्वलोकप्रिया वाणी सर्वविद्याधिदेवता ॥ ३ ॥ पार्वती देवमाता च वनीशा विन्ध्यवासिनी । तेजोवती महामाता
    कोटिसूर्यसमप्रभा ॥ ४ ॥ देवता वह्निरूपा च सदौजा वर्णरूपिणी । गुणाश्रया गुणमयी गुणत्रयविवर्जिता ॥ ५
    ॥ कर्मज्ञानप्रदा कान्ता सर्वसंहारकारिणी । धर्मज्ञाना धर्मनिष्ठा सर्वकर्मविवर्जिता ॥ ६ ॥ कामाक्षा कामसंहन्त्री
    कामक्रोधविवर्जिता । शाङ्करी शाम्भवी शान्ता चन्द्रसूर्याग्निलोचना ॥ ७ ॥ सुजया जयभूमिष्ठा जाह्नवी जनपूजिता
    । शास्त्रा शास्त्रमया नित्या शुभा चन्द्रार्धमस्तका ॥ ८ ॥ भारती भ्रामरी कल्पा कराली कृष्णपिङ्गला ।
    ब्राह्मी नारायणी रौद्रा चन्द्रामृतपरिश्रुता ॥ ९ ॥ ज्येष्ठेन्दिरा महामाया जगत्सृष्ट्यादिकारिणी । ब्रह्माण्डकोटिसंस्थाना
    कामिनी कमलालया ॥ १० ॥ कात्यायनी कलातीता कालसंहारकारिणी । योगिनिष्ठा योगिगम्या योगिध्येया तपस्विनी
    ॥ ११ ॥ ज्ञानरूपा निराकारा भक्ताभीष्टफलप्रदा । भूतात्मिका भूतमाता भूतेशा भूतधारिणी ॥ १२ ॥ स्वधानारीमध्यगता
    षडाधारादिवर्तिनी । मोह्हिता शुभदा शुभ्रा सूक्ष्मा मात्रा निरालसा ॥ १३ ॥ निम्नगा नीलसङ्काशा नित्यानन्दा
    हरा परा । सर्वज्ञानप्रदाऽनन्ता सत्या दुर्लभरूपिणी । सरस्वती सर्वगता सर्वाभीष्टप्रदायिनी ॥ १४॥ ॥ इति
    दुर्गाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥ मूलदुर्गाष्टोत्तरशतनामस्तोत्रं
