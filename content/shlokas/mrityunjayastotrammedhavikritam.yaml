id: mrityunjayastotrammedhavikritam
category: stotram
name:
  english: mrityunjayastotrammedhavikritam
  devanagari: मृत्युन्जयस्तोत्रम्मेधावीकृतं
content:
  english: pranato'smi mahadeva prapanno'smi sadashiva | nivaraya mahamrityum mrityunjaya namo'stu te
    || 190|| kalakutadhara shrimankalakala kripanidhe | nivaraya mahamrityum mrityunjaya namo'stu te ||
    191|| candrashekhara vishvatmankarunakara shankara | nivaraya mahamrityum mrityunjaya namo'stu te
    || 192|| rigyajuhsamarupesha trilocana surottama | nivaraya mahamrityum mrityunjaya namo'stu te ||
    193|| anantameyakalyana kalyanagunasamshraya | nivaraya mahamrityum mrityunjaya namo'stu te || 194||
    sureshvara suraradhya nirdagdhatripurasura | nivaraya mahamrityum mrityunjaya namo'stu te || 195||
    pashankushadhara shrimannamo damarubhushana | nivaraya mahamrityum mrityunjaya namo'stu te || 196||
    bhasmoddhulitasarvanga hara nirdhutakalmasha | nivaraya mahamrityum mrityunjaya namo'stu te || 197||
    pradarshaya mahashulam kalpakshayakaram hara | nivaraya mahamrityum mrityunjaya namo'stu te || 198||
    bhujangabhushana shrimanvrishabhadhvaja vishvaga | nivaraya mahamrityum mrityunjaya namo'stu te ||
    199|| || iti shivarahasyantargate medhavikritam mrityunjayastotram sampurnam ||
  devanagari: प्रणतोऽस्मि महादेव प्रपन्नोऽस्मि सदाशिव । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९०॥
    कालकूटधर श्रीमन्कालकाल कृपानिधे । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९१॥ चन्द्रशेखर विश्वात्मन्करुणाकर
    शङ्कर । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९२॥ ऋग्यजुःसामरूपेश त्रिलोचन सुरोत्तम । निवारय
    महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९३॥ अनन्तामेयकल्याण कल्याणगुणसंश्रय । निवारय महामृत्युं मृत्युञ्जय
    नमोऽस्तु ते ॥ १९४॥ सुरेश्वर सुराराध्य निर्दग्धत्रिपुरासुर । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु
    ते ॥ १९५॥ पाशाङ्कुशधर श्रीमन्नमो डमरुभूषण । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९६॥ भस्मोद्धूलितसर्वाङ्ग
    हर निर्धूतकल्मष । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९७॥ प्रदर्शय महाशूलं कल्पक्षयकरं हर
    । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ १९८॥ भुजङ्गभूषण श्रीमन्वृषभध्वज विश्वग । निवारय महामृत्युं
    मृत्युञ्जय नमोऽस्तु ते ॥ १९९॥ ॥ इति शिवरहस्यान्तर्गते मेधावीकृतं मृत्युञ्जयस्तोत्रं सम्पूर्णम् ॥
