id: vajrasucyupanishat
category: upanishad
name:
  english: vajrasucyupanishat
  devanagari: वज्रसूच्युपनिषत्
content:
  english: upanishad || vajrasucika upanishad || om apyayantu mamangani vakpranashcakshuh shrotramatho
    balamindriyani ca sarvani sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    me'stu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih
    || om vajrasucim pravakshyami shastramajnanabhedanam | dushanam jnanahinanam bhushanam jnanacakshusham
    || 1 || brahmakshatriyavaishyashudra iti catvaro varnastesham varnanam brahmana eva pradhana iti vedavacananurupam
    smritibhirapyuktam | tatra codyamasti ko va brahmano nama kim jivah kim dehah kim jatih kim jnanam
    kim karma kim dharmika iti || 2 || tatra prathamo jivo brahmana iti cet tanna | atitanagatanekadehanam
    jivasyaikarupatvat ekasyapi karmavashadanekadehasambhavat sarvashariranam jivasyaikarupatvacca | tasmat
    na jivo brahmana iti || 3 || tarhi deho brahmana iti cet tanna | acandaladiparyantanam manushyanam
    pancabhautikatvena dehasyaikarupatvat jaramaranadharmadharmadisamyadarshanat brahmanah shvetavarnah
    kshatriyo raktavarno vaishyah pitavarnah shudrah krishnavarnah iti niyamabhavat | pitradishariradahane
    putradinam brahmahatyadidoshasambhavacca | tasmat na deho brahmana iti || 4 || tarhi jati brahmana
    iti cet tanna | tatra jatyantarajantushvanekajatisambhavat maharshayo bahavah santi | rishyashringo
    mrigyah
  devanagari: उपनिषद् ॥ वज्रसूचिका उपनिषद् ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि
    च सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेऽस्तु
    तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ वज्रसूचीं
    प्रवक्ष्यामि शास्त्रमज्ञानभेदनम् । दूषणं ज्ञानहीनानां भूषणं ज्ञानचक्षुषाम् ॥ १ ॥ ब्राह्मक्षत्रियवैष्यशूद्रा
    इति चत्वारो वर्णास्तेषां वर्णानां ब्राह्मण एव प्रधान इति वेदवचनानुरूपं स्मृतिभिरप्युक्तम् । तत्र चोद्यमस्ति
    को वा ब्राह्मणो नाम किं जीवः किं देहः किं जातिः किं ज्ञानं किं कर्म किं धार्मिक इति ॥ २ ॥ तत्र प्रथमो
    जीवो ब्राह्मण इति चेत् तन्न । अतीतानागतानेकदेहानां जीवस्यैकरूपत्वात् एकस्यापि कर्मवशादनेकदेहसंभवात्
    सर्वशरीराणां जीवस्यैकरूपत्वाच्च । तस्मात् न जीवो ब्राह्मण इति ॥ ३ ॥ तर्हि देहो ब्राह्मण इति चेत् तन्न
    । आचाण्डालादिपर्यन्तानां मनुष्याणां पञ्चभौतिकत्वेन देहस्यैकरूपत्वात् जरामरणधर्माधर्मादिसाम्यदर्शनत्
    ब्राह्मणः श्वेतवर्णः क्षत्रियो रक्तवर्णो वैश्यः पीतवर्णः शूद्रः कृष्णवर्णः इति नियमाभावात् । पित्रादिशरीरदहने
    पुत्रादीनां ब्रह्महत्यादिदोषसंभवाच्च । तस्मात् न देहो ब्राह्मण इति ॥ ४ ॥ तर्हि जाति ब्राह्मण इति चेत्
    तन्न । तत्र जात्यन्तरजन्तुष्वनेकजातिसंभवात् महर्षयो बहवः सन्ति । ऋष्यशृङ्गो मृग्याः
