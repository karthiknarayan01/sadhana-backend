id: nagapatnibhihkritam3shrikrishnastotram
category: stotram
name:
  english: nagapatnibhihkritam3shrikrishnastotram
  devanagari: नागपत्नीभिःकृतं३श्रीकृष्णस्तोत्रम्
content:
  english: stamojanihkrodhavasho'pyahishah | samsaracakre bhramatah sharirino yadicchatah syadvibhavah
    samakshah || 38|| namastubhyam bhagavate purushaya mahatmane | bhutavasaya bhutaya paraya paramatmane
    || 39|| jnanavijnananidhaye brahmane'nantashaktaye | agunayavikaraya namaste prakritaya ca || 40||
    kalaya kalanabhaya kalavayavasakshine | vishvaya tadupadrashtre tatkartre vishvahetave || 41|| bhutamatrendriyapranamanobuddhyashayatmane
    | trigunenabhimanena gudhasvatmanubhutaye || 42|| namo'nantaya sukshmaya kutasthaya vipashcite | nanavadanurodhaya
    vacyavacakashaktaye || 43|| namah pramanamulaya kavaye shastrayonaye | pravrittaya nivrittaya nigamaya
    namo namah || 44|| namah krishnaya ramaya vasudevasutaya ca | pradyumnayaniruddhaya satvatam pataye
    namah || 45|| namo gunapradipaya gunatmacchadanaya ca | gunavrittyupalakshyaya gunadrashtre svasamvide
    || 46|| avyakritaviharaya sarvavyakritasiddhaye | hrishikesha namaste'stu munaye maunashiline || 47||
    paravaragatijnaya sarvadhyakshaya te namah | avishvaya ca vishvaya taddrashtre'sya ca hetave || 48||
    tvam hyasya janmasthitisamyaman prabho gunairaniho'kritakalashaktidhrik | tattatsvabhavan pratibodhayan
    satah samikshayamoghavihara ihase || 49|| tasyaiva te'mustanavastrilokyam shanta ashanta uta mudhayonayah
    | shantah priyaste hyadhunavitum satam sthatushca te dharmaparipsayehatah || 50|| aparadhah sakridbhartra
    sodhavyah svaprajakritah | kshantumarhasi shantatman mudhasya tvamajanatah || 51|| anugrihnishva bhagavan
    pranamstyajati pannagah | strinam nah sadhushocyanam patih pranah pradiyatam || 52|| vidhehi te kinkarinamanushtheyam
    tavajnaya | yacchraddhayanutishthan vai mucyate sarvatobhayat || 53|| iti shrimadbhagavatamahapurane
    dashamaskandhe purvardhe shodashadhyayantargatam nagapatnibhih kritam shrikrishnastotram samaptam
    | bhagavatapurana | adhyaya 10
  devanagari: स्तमोजनिःक्रोधवशोऽप्यहीशः । संसारचक्रे भ्रमतः शरीरिणो यदिच्छतः स्याद्विभवः समक्षः ॥ ३८॥
    नमस्तुभ्यं भगवते पुरुषाय महात्मने । भूतावासाय भूताय पराय परमात्मने ॥ ३९॥ ज्ञानविज्ञाननिधये ब्रह्मणेऽनन्तशक्तये
    । अगुणायाविकाराय नमस्ते प्राकृताय च ॥ ४०॥ कालाय कालनाभाय कालावयवसाक्षिणे । विश्वाय तदुपद्रष्ट्रे तत्कर्त्रे
    विश्वहेतवे ॥ ४१॥ भूतमात्रेन्द्रियप्राणमनोबुद्ध्याशयात्मने । त्रिगुणेनाभिमानेन गूढस्वात्मानुभूतये ॥
    ४२॥ नमोऽनन्ताय सूक्ष्माय कूटस्थाय विपश्चिते । नानावादानुरोधाय वाच्यवाचकशक्तये ॥ ४३॥ नमः प्रमाणमूलाय
    कवये शास्त्रयोनये । प्रवृत्ताय निवृत्ताय निगमाय नमो नमः ॥ ४४॥ नमः कृष्णाय रामाय वसुदेवसुताय च । प्रद्युम्नायानिरुद्धाय
    सात्वतां पतये नमः ॥ ४५॥ नमो गुणप्रदीपाय गुणात्मच्छादनाय च । गुणवृत्त्युपलक्ष्याय गुणद्रष्ट्रे स्वसंविदे
    ॥ ४६॥ अव्याकृतविहाराय सर्वव्याकृतसिद्धये । हृषीकेश नमस्तेऽस्तु मुनये मौनशीलिने ॥ ४७॥ परावरगतिज्ञाय
    सर्वाध्यक्षाय ते नमः । अविश्वाय च विश्वाय तद्द्रष्ट्रेऽस्य च हेतवे ॥ ४८॥ त्वं ह्यस्य जन्मस्थितिसंयमान्
    प्रभो गुणैरनीहोऽकृतकालशक्तिधृक् । तत्तत्स्वभावान् प्रतिबोधयन् सतः समीक्षयामोघविहार ईहसे ॥ ४९॥ तस्यैव
    तेऽमूस्तनवस्त्रिलोक्यां शान्ता अशान्ता उत मूढयोनयः । शान्ताः प्रियास्ते ह्यधुनावितुं सतां स्थातुश्च
    ते धर्मपरीप्सयेहतः ॥ ५०॥ अपराधः सकृद्भर्त्रा सोढव्यः स्वप्रजाकृतः । क्षन्तुमर्हसि शान्तात्मन् मूढस्य
    त्वामजानतः ॥ ५१॥ अनुगृह्णीष्व भगवन् प्राणांस्त्यजति पन्नगः । स्त्रीणां नः साधुशोच्यानां पतिः प्राणः
    प्रदीयताम् ॥ ५२॥ विधेहि ते किङ्करीणामनुष्ठेयं तवाज्ञया । यच्छ्रद्धयानुतिष्ठन् वै मुच्यते सर्वतोभयात्
    ॥ ५३॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे पूर्वार्धे षोडशाध्यायान्तर्गतं नागपत्नीभिः कृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय १०
