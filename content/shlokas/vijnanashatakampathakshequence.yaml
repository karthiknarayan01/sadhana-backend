id: vijnanashatakampathakshequence
category: shataka
name:
  english: vijnanashatakamPathakshequence
  devanagari: विज्नानशतकम्Pअथक्षेक़ुएन्चे
content:
  english: mavinayamanumantam notsahe durjananam || 29|| ashimahi vayam bhikshamashavaso vasimahi | shayimahi
    mahiprishthe kurvimahi kimishvaraih || 30|| ahau va hare va balavati ripau va suhridi va manau va
    loshthe va kusumashayane va drishadi va | trine va straine va mama samadrisho yantu divasah kvacitpunyaranye
    shiva shiva shiveti pralapatah || 31|| anavarti kalo vrajati sa vritha tanna ganitam dashastasta sodha
    vyasanashatasampatavidhurah | kiyadva vakshyamah kimiva bata natmanyapakritam tvaya yavattavatpunarapi
    tadeva vyavasitam || 32|| dadatu dadatu galirgalimanto bhavanto vayamapi tadabhavadgalidane'samarthah
    | jagati viditametaddiyate vidyamanam nahi shashakavishanam ko'pi kasmai dadati || 33|| bhavyam bhuktam
    tatah kim kadashanamathava vasarante tatah kim kaupinam va tatah kim kimatha sitamahaccambaram va
    tatah kim | eka bharya tatah kim shatagunagunita kotireka tatah kim tveko bhrantastatah kim karituragashatairveshtito
    va tatah kim || 34|| bhuh paryanko nijabhujalata kandukam kham vitanam dipashcandro virativanitalabdhasangapramodah
    | dikkantabhih pavanacamarairvijyamanah samanta
  devanagari: मविनयमनुमन्तं नोत्सहे दुर्जनानाम् ॥ २९॥ अशीमहि वयं भिक्षामाशावासो वसीमहि । शयीमहि महीपृष्ठे
    कुर्वीमहि किमीश्वरैः ॥ ३०॥ अहौ वा हारे वा बलवति रिपौ वा सुहृदि वा मणौ वा लोष्ठे वा कुसुमशयने वा दृशदि
    वा । तृणे वा स्त्रैणे वा मम समदृशो यान्तु दिवसाः क्वचित्पुण्यारण्ये शिव शिव शिवेति प्रलपतः ॥ ३१॥ अनावर्ती
    कालो व्रजति स वृथा तन्न गणितं दशास्तास्ता सोढा व्यसनशतसम्पातविधुराः । कियद्वा वक्ष्यामः किमिव बत नात्मन्यपकृतं
    त्वया यावत्तावत्पुनरपि तदेव व्यवसितम् ॥ ३२॥ ददतु ददतु गालीर्गालीमन्तो भवन्तो वयमपि तदभावाद्गालिदानेऽसमर्थाः
    । जगति विदितमेतद्दीयते विद्यमानं नहि शशकविषाणं कोऽपि कस्मै ददाति ॥ ३३॥ भव्यं भुक्तं ततः किं कदशनमथवा
    वासरान्ते ततः किं कौपीनं वा ततः किं किमथ सितमहच्चाम्बरं वा ततः किम् । एका भार्या ततः किं शतगुणगुणिता
    कोटिरेका ततः किं त्वेको भ्रान्तस्ततः किं करितुरगशतैर्वेष्टितो वा ततः किम् ॥ ३४॥ भूः पर्यङ्को निजभुजलता
    कन्दुकं खं वितानं दीपश्चान्द्रो विरतिवनितालब्धसङ्गप्रमोदः । दिक्कान्ताभिः पवनचमरैर्वीज्यमानः समन्ता
