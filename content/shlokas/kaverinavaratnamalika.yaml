id: kaverinavaratnamalika
category: stotram
name:
  english: kaverinavaratnamalika
  devanagari: कावेरीनवरत्नमालिका
content:
  english: purodare'smin snayam snayam dhutapapo'statapah | asam jirnah purnakamastadittham vijnapyaste
    vallabhah sindhurajah || 3|| rajnah seva dushkara sarvanrinam kranto bhimairbhimarupassa yasmat |
    prapta ye tadvallabhayah prasadam siddham sarvabhishtamesham hyayatnat || 4|| maharavaravaraughaih
    bhishanaih shrotrabhitidaih | kathannu madrisham shakyo raja'pamupasevitum || 5|| ambhonidheranugunam
    bhavati kalatram lokan vilokanata eva yuvam punithah | panavagahana
  devanagari: पूरोदरेऽस्मिन् स्नायं स्नायं धूतपापोऽस्ततापः । आसं जीर्णः पूर्णकामस्तदित्थं विज्ञाप्यस्ते
    वल्लभः सिन्धुराजः ॥ ३॥ राज्ञः सेवा दुष्करा सर्वनॄणां क्रान्तो भीमैर्भीमरूपस्स यस्मात् । प्राप्ता ये
    तद्वल्लभायाः प्रसादं सिद्धं सर्वाभीष्टमेषां ह्ययत्नात् ॥ ४॥ महारावारवारौघैः भीषणैः श्रोत्रभीतिदैः
    । कथन्नु मादृशां शक्यो राजाऽपामुपसेवितुम् ॥ ५॥ अम्भोनिधेरनुगुणं भवती कलत्रं लोकान् विलोकनत एव युवां
    पुनीथः । पानावगाहन
meaning: {}
