id: venu-gopala-ashtakam
category: stotram
name:
  english: Venu Gopala Ashtakam
content:
  english: kalitakanakacelam khanditapatkucelam galadhritavanamalam garvitaratikalam | kalimalaharashilam
    kantidhutendranilam vinamadavanashilam venugopalamide || || vrajayuvativilolam vandananandalolam karadhritagurushailam
    kanjagarbhadipalam | abhimataphaladanam shrijitamartyasalam vinamadavanashilam venugopalamide || ||
    ghanatarakarunashrikalpavallyalavalam kalashajaladhikanyamodakashrikapolam | plushitavinatalokanantadushkarmatulam
    vinamadavanashilam venugopalamide || || shubhadasugunajalam surilokanukulam ditijatatikaralam divyadarayitelam
    | mridumadhuravacahshri duritashrirasalam vinamadavanashilam venugopalamide || || mrigamadatilakashrimedurasviyaphalam
    jagadudayalayasthityatmakatmiyakhelam | sakalamunijanalimanasantarmaralam vinamadavanashilam venugopalamide
    || || asuraharanakhelanam nandakotkshepalilam vilasitasharakalam vishvapurnantaralam | shucirucirayashashshridhikkrita
    shrimrinalam vinamadavanashilam venugopalamide || || svaparicaranalabdha shridharashadhipalam svamahimalavalilajatavidhyandagolam
    | gurutarabhavaduhkhanika vahpurakulam vinamadavanashilam venugopalamide || || caranakamalashobhapalita
    shripravalam sakalasukritirakshadakshakarunya helam | rucivijitatamalam rukminipunyamulam vinamadavanashilam
    venugopalamide || || shrivenugopala kripalavalam shrirukminilolasuvarnacelam | kritim mama tvam kripaya
    grihitva srajam yatha mam kuru duhkhaduram || || iti shri venugopalashtakam |
  devanagari: कलितकनकचेलं खण्डितापत्कुचेलं गलधृतवनमालं गर्वितारातिकालम् । कलिमलहरशीलं कान्तिधूतेन्द्रनीलं
    विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ व्रजयुवतिविलोलं वन्दनानन्दलोलं करधृतगुरुशैलं कञ्जगर्भादिपालम् । अभिमतफलदानं
    श्रीजितामर्त्यसालं विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ घनतरकरुणाश्रीकल्पवल्ल्यालवालं कलशजलधिकन्यामोदकश्रीकपोलम्
    । प्लुषितविनतलोकानन्तदुष्कर्मतूलं विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ शुभदसुगुणजालं सूरिलोकानुकूलं दितिजततिकरालं
    दिव्यदारायितेलम् । मृदुमधुरवचःश्री दूरितश्रीरसालं विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ मृगमदतिलकश्रीमेदुरस्वीयफालं
    जगदुदयलयस्थित्यात्मकात्मीयखेलम् । सकलमुनिजनालीमानसान्तर्मरालं विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ असुरहरणखेलनं
    नन्दकोत्क्षेपलीलं विलसितशरकालं विश्वपूर्णान्तरालम् । शुचिरुचिरयशश्श्रीधिक्कृत श्रीमृणालं विनमदवनशीलं
    वेणुगोपालमीडे ॥ ॥ स्वपरिचरणलब्ध श्रीधराशाधिपालं स्वमहिमलवलीलाजातविध्यण्डगोलम् । गुरुतरभवदुःखानीक वाःपूरकूलं
    विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ चरणकमलशोभापालित श्रीप्रवालं सकलसुकृतिरक्षादक्षकारुण्य हेलम् । रुचिविजिततमालं
    रुक्मिणीपुण्यमूलं विनमदवनशीलं वेणुगोपालमीडे ॥ ॥ श्रीवेणुगोपाल कृपालवालां श्रीरुक्मिणीलोलसुवर्णचेलाम्
    । कृतिं मम त्वं कृपया गृहीत्वा स्रजं यथा मां कुरु दुःखदूरम् ॥ ॥ इति श्री वेणुगोपालाष्टकम् ।
