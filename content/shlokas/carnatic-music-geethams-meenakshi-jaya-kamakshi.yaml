id: carnatic-music-geethams-meenakshi-jaya-kamakshi
category: stotram
name:
  english: Carnatic Music Geethams - Meenakshi Jaya Kamakshi
content:
  english: catusra jati dhruva talam angah paidala gurumurti shastri bhasha samskritam sahityam minakshi
    jayakamakshi kankatika vamakshi apratibha prabha unnati madhura madhura salankara onkara kali talapa
    yudha mata madhukaitabha candamunda danava khandana mada danta valayana kartikeya janani re re katyayani
    kali rudrani vina nikvani karana karana shikharanjaya madhuralapa priya re ayiyati yiya ayiyam vaya
    ayati yiya ahyiyam vaya còkkanatha ami jayare svarah ma ma pa | ni pa | ma pa ni ni | sa ni | pa ma
    pa ni | pa pa ma || ma dhu ra ma | dhu ra | sa | ni pa | ni pa pa ma | ri ga ri sa || kan sa | ri
    ma ma pa | ni pa pa ma || ma da ya pa pa | ma ri | ri ga ri sa | sa sa ri ga | ri sa | sa ri ma pa
    | ni pa ma pa || ka ra na | ka ra | na ka shi ka | ram | ri ga ri sa || mu di ra | pri ya yi ya ||
    ri pa ma ri | pa ma | ri ma ma pa | ni pa pa ma || a yi ya tu | yi ya | a yi yam yi ya || ri ma pa
    ni | sa || a yi ya ti | yi ya | a yi yam yi ya || ri ma pa ni | pa ma | pa pa ma | ni pa | ni pa pa
    ma | ri ga ri sa || cò
  devanagari: चतुस्र जाति ध्रुव तालम् अङ्गाः पैडल गुरुमूर्ति शास्त्रि भाषा संस्कृतम् साहित्यम् मीनाक्षी
    जयकामाक्षी कङ्कटिक वामाक्षी अप्रतिभ प्रभा उन्नति मधुर मधुर सलङ्कार ओङ्कार कलि तलप युध मत मधुकैटभ चण्डमुण्ड
    दानव खण्डन मद दन्त वलयन कार्तिकेय जननि रे रे कात्यायनि कालि रुद्राणि वीणा निक्वाणि करण करण शिखरञ्जय
    मधुरालाप प्रिय रे आयियाति यिया आयियां वया अयति यिया अह्यियां वया चॊक्कनाथ आमि जयरे स्वराः म म प ।
    नि प । म प नि नि । स नि । प म प नि । प प म ॥ म धु र म । धु र । स । नि प । नि प प म । रि ग रि स ॥ कण्
    स । रि म म प । नि प प म ॥ म द या प प । म रि । रि ग रि स । स स रि ग । रि स । स रि म प । नि प म प ॥
    क र ण । क र । ण क शि क । रं । रि ग रि स ॥ मु दि रा । प्रि य यि य ॥ रि प म रि । प म । रि म म प । नि
    प प म ॥ आ यि य तु । यि य । अ यि यं यि य ॥ रि म प नि । स ॥ आ यि य ति । यि य । अ यि यं यि य ॥ रि म प
    नि । प म । प प म । नि प । नि प प म । रि ग रि स ॥ चॊ
