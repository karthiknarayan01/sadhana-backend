id: jvara-kruta-krishna-stotram
category: stotram
name:
  english: Jvara Kruta Krishna Stotram
content:
  english: jvara uvaca | namah krishnaya haraye vishnave prabhavishnave | adidevaya devaya puranaya gadabhrite
    || || namah sahasrashirase sahasracaranaya ca | sahasraksha namo nityam lokanamabhayankara || || udgithaya
    namo deva yajnadhipataye namah | namaste cakrine nityamasihastaya te namah || || anantaya virupaya
    namaste madhusudana | namaste devadevesha tubhyam deva kapardine || || namaste rakshasaghnaya namo
    raghavarupine | jnanajneyaya devaya nama adyaya vishnave || || namaste narasimhaya daityarajaviharine
    | namastubhyam varahaya damshtroddhritavasundhara || || trivikrama namastubhyam baliyajnavinashana
    | vasudevaya devaya namah kamsavinashana || || namah sarvatmane deva sarvakartre namo namah | prasida
    devadevesha bhitanamabhayankara || || namami devadevesham varenyamabhayapradam | vishno tvam sakaleshesha
    tvam gadadharamavyayam || || namaste devadevesha bhito'ham bhavanashana | iti stutva jagannatham nrityanniva
    tada jvarah || || papata padayorvishnornihshvasan bhitabhitavat | prasida vishno devesha pidito'smi
    janardana || || iti harivamshantargatam jvarakritam shrikrishnastotram sampurnam | harivamsha
  devanagari: ज्वर उवाच । नमः कृष्णाय हरये विष्णवे प्रभविष्णवे । आदिदेवाय देवाय पुराणाय गदाभृते ॥ ॥ नमः
    सहस्रशिरसे सहस्रचरणाय च । सहस्राक्ष नमो नित्यं लोकानामभयङ्कर ॥ ॥ उद्गीथाय नमो देव यज्ञाधिपतये नमः
    । नमस्ते चक्रिणे नित्यमसिहस्ताय ते नमः ॥ ॥ अनन्ताय विरूपाय नमस्ते मधुसूदन । नमस्ते देवदेवेश तुभ्यं
    देव कपर्दिने ॥ ॥ नमस्ते राक्षसघ्नाय नमो राघवरूपिणे । ज्ञानज्ञेयाय देवाय नम आद्याय विष्णवे ॥ ॥ नमस्ते
    नरसिंहाय दैत्यराजविहारिणे । नमस्तुभ्यं वराहाय दंष्ट्रोद्धृतवसुन्धर ॥ ॥ त्रिविक्रम नमस्तुभ्यं बलियज्ञविनाशन
    । वासुदेवाय देवाय नमः कंसविनाशन ॥ ॥ नमः सर्वात्मने देव सर्वकर्त्रे नमो नमः । प्रासीद देवदेवेश भीतानामभयङ्कर
    ॥ ॥ नमामि देवदेवेशं वरेण्यमभयप्रदम् । विष्णो त्वां सकलेशेश त्वां गदाधरमव्ययम् ॥ ॥ नमस्ते देवदेवेश
    भीतोऽहं भवनाशन । इति स्तुत्वा जगन्नाथं नृत्यन्निव तदा ज्वरः ॥ ॥ पपात पादयोर्विष्णोर्निःश्वसन् भीतभीतवत्
    । प्रासीद विष्णो देवेश पीडितोऽस्मि जनार्दन ॥ ॥ इति हरिवंशान्तर्गतं ज्वरकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम्
    । हरिवंश
