id: shloka-2
category: shloka
name:
  english: shloka 2
  devanagari: श्लोक २
content:
  english: akashat patitam toyam yatha gacchati sagaram | sarvadevanamaskaran keshavam pratigacchati ||
    dipajyotih parabrahma dipajyotirjanardanah | dipo haratu me papam dipajyotirnamo'stute || gananathasarasvatiravishukrabrihaspatin
    | pamcaitan samsmarennityam vedavanipravrittaye | sumukhashca ekadamtashca kapilo gajakarnakah | lambodarashca
    vikato vighnanasho ganadhipah || dhumraketurganadhyaksho bhalacandro gajananah | dvadashaitani namani
    yah pathecchrinuyadapi || vidyarambhe vivahe ca praveshe nirgame tatha | samgrame samkate caiva vighnastasya
    na jayate || shuklambaradharam devam shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye
    || sarvada sarvakaryeshu nasti teshamamangalam | yesham hridistho bhagavan mangalayatanam harih ||
    tadeva lagnam sudinam tadeva tarabalam camdrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate
    tem'ghriyugam smarami || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi
    yadyad sakalam parasmai narayanayeti samarpayami || harirdata harirbhokta harirannam prajapatih |
    harih sarvah sharirastho bhunkte bhojayate harih || karpuragauram karunavataram samsarasaram bhujagendraharam
    | sada vasantam hridayaravinde bhavam bhavanisahitam namami || || shriramayanasutra || adau ramatapovanadigamanam
    hatva mrigam kancanam vaidehiharanam jatayumaranam sugrivasambhashanam || valinirdalanam samudrataranam
    lankapuridahanam pashcadravanakumbhakarnahananam etaddhiramayanam || || shribhagavatasutra || adau
    devakidevigarbhajananam gopigrihe vardhanam mayaputanajivitapaharanam govardhanoddharanam || kamsacchedanakauravadihananam
    kumtisutam palanam etadbhagavatam puranakathitam shrikrishnalilamritam || || gitastava || parthaya
    pratibodhitam bhagavata narayanena svayam vyasenagrathitam puranamunina madhye mahabharate advaitamritavarshinim
    bhagavatimashtadashadhyayinim amba tvamanusandadhami bhagavadgite bhavedveshinim || sarvopanishado
    gavo dogdha gopalanandanah | partho vatsah sudhirbhokta dugdham gitamritam mahat || || vyasastuti
    || namo'stu te vyasa vishalabuddhe phullaravindayatapatranetra | yena tvaya bharatatailapurnah prajvalito
    jnanamayapradipah || vyasaya vishnurupaya vyasarupaya vishnave | namovai brahmanidhaye vasishthaya
    namonamah || || shridattagurudhyanam || brahmanamdam paramasukhadam kevalam jnanamurtim dvamdvatitam
    gaganasadrisham tattvamasyadilakshyam | ekam nityam vimalamacalam sarvadhisakshibhutam bhavatitam
    trigunarahitam sadgurum tam namami || yam brahmavarunendrarudramarutah stuvanti divyaih stavaih vedaih
    sangapadakramopanishadaih gayanti yam samagah | dhyanavasthitatadgatena manasa pashyanti yam yogino
    yasyantam na viduh surasuragana devaya tasmai namah || mukam karoti vacalam pangum langhayate girim
    | yatkripa tamaham vande paramanandamadhavam || shrikeshavaya namah | narayanaya namah | madhavaya
    namah | govimdaya namah | vishnave namah | madhusudanaya namah | trivikramaya namah | vamanaya namah
    | shridharaya namah | hrishikeshaya namah | padmanabhaya namah | damodaraya namah | samkarshanaya
    namah | vasudevaya namah | pradyumnaya namah | aniruddhaya namah | purushottamaya namah | adhokshajaya
    namah | narasimhaya namah | acyutaya namah | janardanaya namah | upendraya namah | haraye namah |
    shrikrishnaya namah | || devatavamdanam || shrimanmahaganadhipataye namah | shri sarasvatyai namah
    | shrigurave namah | shrimatapitribhyam namah | shrilakshminarayanabhyam namah | shriumamaheshvarabhyam
    namah | ishtadevatabhyo namah | kuladevatabhyo namah | sthanadevatabhyo namah | vastudevatabhyam namah
    | sarevebhyo devebhyo namo namah || avighnamastu || || om tatsat iti ||
  devanagari: आकाशात् पतितं तोयं यथा गच्छति सागरम् । सर्वदेवनमस्कारान् केशवं प्रतिगच्छति ॥ दीपज्योतिः
    परब्रह्म दीपज्योतिर्जनार्दनः । दीपो हरतु मे पापं दीपज्योतिर्नमोऽस्तुते ॥ गणनाथसरस्वतीरविशुक्रबृहस्पतीन्
    । पंचैतान् संस्मरेन्नित्यं वेदवाणीप्रवृत्तये । सुमुखश्च एकदंतश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो
    विघ्ननाशो गणाधिपः ॥ धूम्रकेतुर्गणाध्यक्षो भालचन्द्रो गजाननः । द्वादशैतानि नामानि यः पठेच्छृणुयादपि
    ॥ विद्यारम्भे विवाहे च प्रवेशे निर्गमे तथा । संग्रामे संकटे चैव विघ्नस्तस्य न जायते ॥ शुक्लाम्बरधरं
    देवं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ सर्वदा सर्वकार्येषु नास्ति तेषाममङ्गलम्
    । येषं हृदिस्थो भगवान् मङ्गलायतनं हरिः ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चंद्रबलं तदेव । विद्याबलं
    दैवबलं तदेव लक्ष्मीपते तेंऽघ्रियुगं स्मरामि ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः
    स्वभावात् । करोमि यद्यद् सकलं परस्मै नारायणायेति समर्पयामि ॥ हरिर्दाता हरिर्भोक्ता हरिरन्नं प्रजापतिः
    । हरिः सर्वः शरीरस्थो भुङ्क्ते भोजयते हरिः ॥ कर्पूरगौरं करुणावतारं संसारसारं भुजगेन्द्रहारम् । सदा
    वसन्तं हृदयारविन्दे भवं भवानीसहितं नमामि ॥ ॥ श्रीरामायणसूत्र ॥ आदौ रामतपोवनादिगमनं हत्वा मृगं काञ्चनम्
    वैदेहीहरणं जटायुमरणम् सुग्रीवसम्भाषणम् ॥ वालीनिर्दलनं समुद्रतरणं लङ्कापुरीदाहनम् पश्चाद्रावणकुम्भकर्णहननं
    एतद्धिरामायणम् ॥ ॥ श्रीभागवतसूत्र ॥ आदौ देवकिदेविगर्भजननं गोपीगृहे वर्धनम् मायापूतनजीवितापहरणं गोवर्धनोद्धारणम्
    ॥ कंसच्छेदनकौरवादिहननं कुंतीसुतां पालनम् एतद्भागवतं पुराणकथितं श्रीकृष्णलीलामृतम् ॥ ॥ गीतास्तव ॥ पार्थाय
    प्रतिबोधितां भगवता नारायणेन स्वयम् व्यासेनग्रथितां पुराणमुनिना मध्ये महाभारते अद्वैतामृतवर्षिणीं भगवतीमष्टादशाध्यायिनीम्
    अम्ब त्वामनुसन्दधामि भगवद्गीते भवेद्वेषिणीम् ॥ सर्वोपनिषदो गावो दोग्धा गोपालनन्दनः । पार्थो वत्सः
    सुधीर्भोक्ता दुग्धं गीतामृतं महत् ॥ ॥ व्यासस्तुती ॥ नमोऽस्तु ते व्यास विशालबुद्धे फुल्लारविन्दायतपत्रनेत्र
    । येन त्वया भारततैलपूर्णः प्रज्वालितो ज्ञानमयप्रदीपः ॥ व्यासाय विष्णुरूपाय व्यासरूपाय विष्णवे । नमोवै
    ब्रह्मनिधये वासिष्ठाय नमोनमः ॥ ॥ श्रीदत्तगुरुध्यानम् ॥ ब्रह्मानंदं परमसुखदं केवलं ज्ञानमूर्तिं द्वंद्वातीतं
    गगनसदृशं तत्त्वमस्यादिलक्ष्यम् । एकं नित्यं विमलमचलं सर्वधीसाक्षिभूतं भावातीतं त्रिगुणरहितं सद्गुरुं
    तं नमामि ॥ यं ब्रह्मावरुणेन्द्ररुद्रमरुतः स्तुवन्ति दिव्यैः स्तवैः वेदैः साङ्गपदक्रमोपनिषदैः गायन्ति
    यं सामगाः । ध्यानावस्थिततद्गतेन मनसा पश्यन्ति यं योगिनो यस्यान्तं न विदुः सुरासुरगणा देवाय तस्मै नमः
    ॥ मूकं करोति वाचालं पङ्गुं लङ्घयते गिरिम् । यत्कृपा तमहं वन्दे परमानन्दमाधवम् ॥ श्रीकेशवाय नमः । नारायणाय
    नमः । माधवाय नमः । गोविंदाय नमः । विष्णवे नमः । मधुसूदनाय नमः । त्रिविक्रमाय नमः । वामनाय नमः । श्रीधराय
    नमः । हृषीकेशाय नमः । पद्मनाभाय नमः । दामोदराय नमः । संकर्षणाय नमः । वासुदेवाय नमः । प्रद्युम्नाय
    नमः । अनिरुद्धाय नमः । पुरुषोत्तमाय नमः । अधोक्षजाय नमः । नारसिंहाय नमः । अच्युताय नमः । जनार्दनाय
    नमः । उपेन्द्राय नमः । हरये नमः । श्रीकृष्णाय नमः । ॥ देवतावंदनम् ॥ श्रीमन्महागणाधिपतये नमः । श्री
    सरस्वत्यै नमः । श्रीगुरवे नमः । श्रीमातापितृभ्यां नमः । श्रीलक्ष्मीनारायणाभ्यां नमः । श्रीउमामहेश्वराभ्यां
    नमः । इष्टदेवताभ्यो नमः । कुलदेवताभ्यो नमः । स्थानदेवताभ्यो नमः । वास्तुदेवताभ्यां नमः । सरेवेभ्यो
    देवेभ्यो नमो नमः ॥ अविघ्नमस्तु ॥ ॥ ॐ तत्सत् इति ॥
