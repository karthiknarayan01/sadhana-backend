id: bhagavatkritamrudrastotram
category: stotram
name:
  english: bhagavatkritamrudrastotram
  devanagari: भगवत्कृतंरुद्रस्तोत्रम्
content:
  english: bhagavatkritam rudrastotram shribhagavanuvaca | maheshvaraya devaya namaste paramatmane ||
    96|| narayanaya sharvaya brahmane brahmarupine | shashvataya hyanantaya avyaktaya ca te namah || 97||
    suta uvaca | evam stutva mahadevam dandavatpranipatya ca | jajapa rudram bhagavankotivaram jale sthitah
    || 98|| iti shrilingamahapurane purvabhage ekasaptatitamadhyayantargatam bhagavatkritam rudrastotram
    samaptam | lingapurana | purvabhaga | adhyaya 71
  devanagari: भगवत्कृतं रुद्रस्तोत्रम् श्रीभगवानुवाच । महेश्वराय देवाय नमस्ते परमात्मने ॥ ९६॥ नारायणाय
    शर्वाय ब्रह्मणे ब्रह्मरूपिणे । शाश्वताय ह्यनन्ताय अव्यक्ताय च ते नमः ॥ ९७॥ सूत उवाच । एवं स्तुत्वा
    महादेवं दण्डवत्प्रणिपत्य च । जजाप रुद्रं भगवान्कोटिवारं जले स्थितः ॥ ९८॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे
    एकसप्ततितमाध्यायान्तर्गतं भगवत्कृतं रुद्रस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ७१
meaning: {}
