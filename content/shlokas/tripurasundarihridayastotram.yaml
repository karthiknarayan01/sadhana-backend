id: tripurasundarihridayastotram
category: hridaya
name:
  english: tripurasundarihridayastotram
  devanagari: त्रिपुरसुन्दरीहृदयस्तोत्रम्
content:
  english: ringarakodandakutilabhruvam || 26|| carucandrakalopetam candanagururushitam | mandasmitamadhukalikinjalkitamukhambujam
    || 27|| patiratilakodbhasiphalasthalamanoharam | anekakotikandarpalavanyamarunadharam || 28|| tapaniyamshukadharam
    tarunyashrinishevitam | kameshvaramaham vande kamitarthapradam nrinam || 29|| tasyankamadhyamasinam
    taptahatakasannibham | manikyamukutacchayamandalarunadinmukham || 30|| kalavenikanatphullakahlarakusumojjvalam
    | udurajakritottamsamutpalashyamalalakam || 31|| caturthicandrasacchatraphalarekhaparishkritam | kasturitilakarudhakamaniyalalantikam
    || 32|| bhrulatashriparabhutapushpayudhasharasanam | nalikadaladayadanayanatrayashobhitam || 33||
    karunarasampurnakatakshahasitojjvalam | bhavyamuktamanicarunasamauktikaveshtitam || 34|| kapolayugalinrityakarnatatankashobhitam
    | manikyavaliyugalimayukharunadinmukham || 35|| paripakvasubimbabhapataladharapallavam | manjuladharaparvasthamandasmitamanoharam
    || 36|| dvikhandadvijarajabhagandadvitayamanditam | daraphullalasadgandadhavalapuritananam || 37||
    pacelimendusushamapataccaramukhaprabham | kandharakantihasitakambubimbokadambaram || 38|| kasturikardamashyamakandharamulakandaram
    | vamamsashikharopantavyalambighanavenikam || 39|| mrinalakandadayadamridubahucatushtayam | manikeyurayugalimayukharunavigraham
    || 40|| karamulalasadratnakankanakvanapeshalam | karakantisamadhutakalpanokahapallavam || 41|| padmaragormikashrenibhasurangulipalikam
    | pundrakodandapushpastrapashankushalasatkaram || 42|| taptakancanakumbhabhastanamandalamanditam |
    ghanastanatatiklriptakashmirakshodapatalam || 43|| kulankashakucaspharataraharavirajitam | carukausumbhakurpasacchannavakshojamandalam
    || 44|| navanilaghanashyamaromarajivirajitam | lavanyasagaravartanibhanabhivibhushitam || 45|| dimbhamushtitalagrahyamadhyayashtimanoharam
    | nitambamandalabhoganikvananmanimekhalam || 46|| sandhyarunakshaumapatisanchannajaghanasthalam |
    ghanorukantihasitakadalikandavibhramam || 47|| janusamputakadvandvajitamanikyadarpanam | janghayugalasaundaryavijitanangakahalam
    || 48|| prapadacchayasantanajitapracinakacchapam | nirajasanakotiranighrishtacaranambujam || 49||
    padashobhaparabhutapakaritarupallavam | caranambhojashinjanamanimanjiramanjulam || 50|| vibudhendravadhutsangavinyastapadapallavam
    | parshvasthabharatilakshmipanicamaravijitam || 51|| purato nakanarinam pashyantim nrittamadbhutam
    | bhrulatancalasambhutapushpayudhaparamparam || 52|| pratyagrayauvanonmattapariphullavilocanam | tamroshthim
    taralapangim sunasam sundarasmitam || 53|| caturarthadhruvodaram campeyodgandhikuntalam | madhusnapitamridvikamadhuralapapeshalam
    || 54|| shivam shodashavarshikam shivankatalavasinim | cinmayim hridayambhoje cintayejjapakottamah
    || 55|| phalashrutih | iti tripurasundarya hridayam sarvakamadam | sarvadaridryashamanam sarvasampatpradam
    nrinam || 56|| tapajvarartishamanam tarunijanamohanam | mahavishaharam punyam mangalyakaramadbhutam
    || 57|| apamrityuharam divyamayushyashrikaram param | apavargaikanilayamavanipalavashyadam || 58||
    pathati dhyanaratnam yah pratassayamatandritah | na vishadaissa ca puman prapnoti bhuvanatrayam ||
    59|| iti shrimahatripurasundarihridayam sampurnam | shriparamba suprasanna varada'stu ||
  devanagari: ृङ्गारकोदण्डकुटिलभ्रुवम् ॥ २६॥ चारुचन्द्रकलोपेतं चन्दनागुरुरूषितम् । मन्दस्मितमधूकालिकिञ्जल्कितमुखाम्बुजम्
    ॥ २७॥ पाटीरतिलकोद्भासिफालस्थलमनोहरम् । अनेककोटिकन्दर्पलावण्यमरुणाधरम् ॥ २८॥ तपनीयांशुकधरं तारुण्यश्रीनिषेवितम्
    । कामेश्वरमहं वन्दे कामितार्थप्रदं नृणाम् ॥ २९॥ तस्याङ्कमध्यमासीनां तप्तहाटकसन्निभाम् । माणिक्यमुकुटच्छायामण्डलारुणदिङ्मुखाम्
    ॥ ३०॥ कलवेणीकनत्फुल्लकह्लारकुसुमोज्ज्वलाम् । उडुराजकृतोत्तंसामुत्पलश्यामलालकाम् ॥ ३१॥ चतुर्थीचन्द्रसच्छात्रफालरेखापरिष्कृताम्
    । कस्तूरीतिलकारूढकमनीयललन्तिकाम् ॥ ३२॥ भ्रुलताश्रीपराभूतपुष्पायुधशरासनाम् । नालीकदलदायादनयनत्रयशोभिताम्
    ॥ ३३॥ करुणारसम्पूर्णकटाक्षहसितोज्ज्वलाम् । भव्यमुक्तामणिचारुनासामौक्तिकवेष्टिताम् ॥ ३४॥ कपोलयुगलीनृत्यकर्णताटङ्कशोभिताम्
    । माणिक्यवालीयुगलीमयूखारुणदिङ्मुखाम् ॥ ३५॥ परिपक्वसुबिम्बाभापाटलाधरपल्लवाम् । मञ्जुलाधरपर्वस्थमन्दस्मितमनोहराम्
    ॥ ३६॥ द्विखण्डद्विजराजाभगण्डद्वितयमण्डिताम् । दरफुल्ललसद्गण्डधवलापूरिताननाम् ॥ ३७॥ पचेलिमेन्दुसुषमापाटच्चरमुखप्रभाम्
    । कन्धराकान्तिहसितकम्बुबिम्बोकडम्बराम् ॥ ३८॥ कस्तूरीकर्दमाश्यामकन्धरामूलकन्दराम् । वामांसशिखरोपान्तव्यालम्बिघनवेणिकाम्
    ॥ ३९॥ मृणालकाण्डदायादमृदुबाहुचतुष्टयाम् । मणिकेयूरयुगलीमयूखारुणविग्रहाम् ॥ ४०॥ करमूललसद्रत्नकङ्कणक्वाणपेशलाम्
    । करकान्तिसमाधूतकल्पानोकहपल्लवाम् ॥ ४१॥ पद्मरागोर्मिकाश्रेणिभासुराङ्गुलिपालिकाम् । पुण्ड्रकोदण्डपुष्पास्त्रपाशाङ्कुशलसत्कराम्
    ॥ ४२॥ तप्तकाञ्चनकुम्भाभस्तनमण्डलमण्डिताम् । घनस्तनतटीक्लृप्तकाश्मीरक्षोदपाटलाम् ॥ ४३॥ कूलङ्कषकुचस्फारतारहारविराजिताम्
    । चारुकौसुम्भकूर्पासच्छन्नवक्षोजमण्डलाम् ॥ ४४॥ नवनीलघनश्यामरोमराजिविराजिताम् । लावण्यसागरावर्तनिभनाभिविभूषिताम्
    ॥ ४५॥ डिम्भमुष्टितलग्राह्यमध्ययष्टिमनोहराम् । नितम्बमण्डलाभोगनिक्वणन्मणिमेखलाम् ॥ ४६॥ सन्ध्यारुणक्षौमपटीसञ्छन्नजघनस्थलाम्
    । घनोरुकान्तिहसितकदलीकाण्डविभ्रमाम् ॥ ४७॥ जानुसम्पुटकद्वन्द्वजितमाणिक्यदर्पणाम् । जङ्घायुगलसौन्दर्यविजितानङ्गकाहलाम्
    ॥ ४८॥ प्रपदच्छायसन्तानजितप्राचीनकच्छपाम् । नीरजासनकोटीरनिघृष्टचरणाम्बुजाम् ॥ ४९॥ पादशोभापराभूतपाकारितरुपल्लवाम्
    । चरणाम्भोजशिञ्जनमणिमञ्जीरमञ्जुलाम् ॥ ५०॥ विबुधेन्द्रवधूत्सङ्गविन्यस्तपदपल्लवाम् । पार्श्वस्थभारतीलक्ष्मीपाणिचामरवीजिताम्
    ॥ ५१॥ पुरतो नाकनारीणां पश्यन्तीं नृत्तमद्भुतम् । भ्रूलताञ्चलसम्भूतपुष्पायुधपरम्पराम् ॥ ५२॥ प्रत्यग्रयौवनोन्मत्तपरिफुल्लविलोचनाम्
    । ताम्रोष्ठीं तरलापाङ्गीं सुनासां सुन्दरस्मिताम् ॥ ५३॥ चतुरर्थध्रुवोदारां चाम्पेयोद्गन्धिकुन्तलाम्
    । मधुस्नपितमृद्वीकमधुरालापपेशलाम् ॥ ५४॥ शिवां षोडशवार्षीकां शिवाङ्कतलवासिनीम् । चिन्मयीं हृदयम्भोजे
    चिन्तयेज्जापकोत्तमः ॥ ५५॥ फलश्रुतिः । इति त्रिपुरसुन्दर्या हृदयं सर्वकामदम् । सर्वदारिद्र्यशमनं सर्वसम्पत्प्रदं
    नृणाम् ॥ ५६॥ तापज्वरार्तिशमनं तरुणीजनमोहनम् । महाविषहरं पुण्यं माङ्गल्यकरमद्भुतम् ॥ ५७॥ अपमृत्युहरं
    दिव्यमायुष्यश्रीकरं परम् । अपवर्गैकनिलयमवनीपालवश्यदम् ॥ ५८॥ पठति ध्यानरत्नं यः प्रातस्सायमतन्द्रितः
    । न विषादैस्स च पुमान् प्राप्नोति भुवनत्रयम् ॥ ५९॥ इति श्रीमहात्रिपुरसुन्दरीहृदयं सम्पूर्णम् । श्रीपराम्बा
    सुप्रसन्ना वरदाऽस्तु ॥
