id: pratyangirasahasranamastotra
category: sahasranama
name:
  english: pratyangirasahasranamastotra
  devanagari: प्रत्यन्गिरासहस्रनामस्तोत्र
content:
  english: takarastha thakura thikritishcaiva thinthiravasanavrita | thantha nilamayi thantha thanatkarakara
    thasa || 35|| dakini damara caiva dindimadhvaninadini | dhakkapriyasvana dhakkatapini tapini tatha
    || 36|| taruni tundila tunda tamasi ca tapahpriya | tamra tamrambara tali talidalavibhushana || 37||
    turanga tvarita tota totala tadini tula | tapatrayahara tara talakeshi tamalini || 38|| tamaladalavacchaya
    talasvanavati tami | tamasi ca tamisra ca tivra tivraparakrama || 39|| tatasthatilatailakta tarini
    tapanadyutih | tilottama tilakakrittarakadhishashekhara || 40|| tilapushpapriya tara tarakeshakutumbini
    | sthanupatni sthitikari sthalastha sthalavardhini || 41|| sthitisthairya sthavishtha ca sthavatih
    sthulavigraha | dantini dandini dina daridra dinavatsala || 42|| devi devavadhurdaityadamini dantabhushana
    | dayavati damavati damada dadimastani || 43|| dandashukanibha daityadarini devata''nana | dolakrida
    dayalushca dampati devatamayi || 44|| dasha dipasthita dosha doshaha doshakarini | durga durgartishamani
    durgama durgavasini || 45|| durgandhanashini duhstha duhsvapnashamakarini | durvara dundubhidhvana
    duraga duravasini || 46|| darada daraha datri dayada duhita dasha | dhurandhara dhurina ca dhaureyi
    dhanadayini || 47|| dhira dhiradharitri ca dharmada dhiramanasa | dhanurdhara ca dhamini dhurta dhurtaparigraha
    || 48|| dhumavarna dhumapana dhumala dhumamodini | nalini nandani nanda nandini nandabalika || 49||
    navina narmada narmi nemirniyamanishcaya | nirmala nigamacara nimnaga nagnika nimih || 50|| nala nirantara
    nighni nirlepa nirguna natih | nilagriva niriha ca niranjanajani navi || 51|| navanitapriya nari narakarnavatarini
    | narayani nirakara nipuna nipunapriya || 52|| nisha nidra narendrastha namita namitapi ca | nirgundika
    ca nirgunda nirmamsa nasikabhidha || 53|| patakini pataka ca palapritiryashashvini | pina pinastana
    patni pavanashanashayini || 54|| para parakala paka pakakrityaratipriya | pavanastha supavana tapasi
    pritivardhini || 55|| pashuvriddhikari pushtih poshani pushpavardhini | pushpini pustakakara punnagatalavasini
    || 56|| purandarapriya pritih puramarganivasini | pesha pashakara pashabandhaha pamshulapashuh ||
    57|| patah patasha parashudharini pashini tatha | papaghni patipatni ca patita'patitapi ca || 58||
    pishaci ca pishacaghni pishitashanatoshita | panada panapatra ca panadanakarodyata || 59|| pesha prasiddhih
    piyusha purna purnamanoratha | patadgarbha patadgatra paunahpunyapivapura || 60|| pankila pankamagna
    ca pamipa panjarasthita | pancama pancayama ca pancata pancamapriya || 61|| pancamudra pundarika pingala
    pingalocana | priyangumanjari pindi pandita panduraprabha || 62|| pretasana priyalustha pandughni
    pitasapaha | phalini phaladatri ca phalashri phanibhushana || 63|| phutkarakarini sphara phulla phullambujasana
    | phirangaha sphitamatih sphitih sphitikari tatha || 64|| vanamaya balaratirbalini balavardhini |
    venuvadya vanacari vira bijamayi api || 65|| vidya vidyaprada vidyabodhini vedadayini | budhamata
    ca buddha ca vanamalavati vara || 66|| varada varuni vina vinavadanatatpara | vinodini vinodastha
    vaishnavi vishnuvallabha || 67|| vidya vaidyacikitsa ca vivasha vishvavishruta | vitandra vihvala
    vela virava viratirvara || 68|| vividharkakara vira bimboshthi bimbavatsala | vindhyastha viravandya
    ca variyanaparacavit || 69|| vedantavedya vaidya ca vedasya vijayaprada | virodhavardhini vandhya
    vandhyabandhanivarini || 70|| bhagini bhagamala ca bhavani bhayabhavini | bhima bhimanana bhaimi bhangura
    bhimadarshana || 71|| bhilli bhalladhara bhirurbherundi bhirbhayapaha | bhagasarpinyapi bhaga bhagarupa
    bhagalaya || 72|| bhagasana bhagamoda bheri bhankararanjita | bhishana bhishanarava bhagavatyapi bhushana
    || 73|| bharadvaji bhogadatri bhavaghni bhutibhushana | bhutida bhumidatri ca bhupatitvapradayini
    || 74|| bhramari bhramari nila bhupalamukutasthita | matta manoharamana manini mohani mahi || 75||
  devanagari: टकारस्था ठकुरा ठीकृतिश्चैव ठिण्ठीरवसनावृता । ठण्ठा नीलमयी ठण्ठा ठणत्कारकरा ठसा ॥ ३५॥ डाकिनी
    डामरा चैव डिण्डिमध्वनिनादिनी । ढक्काप्रियस्वना ढक्कातपिनी तापिनी तथा ॥ ३६॥ तरुणी तुन्दिला तुन्दा तामसी
    च तपःप्रिया । ताम्रा ताम्राम्बरा ताली तालीदलविभूषणा ॥ ३७॥ तुरङ्गा त्वरिता तोता तोतला तादिनी तुला ।
    तापत्रयहरा तारा तालकेशी तमालिनी ॥ ३८॥ तमालदलवच्छाया तालस्वनवती तमी । तामसी च तमिस्रा च तीव्रा तीव्रपराक्रमा
    ॥ ३९॥ तटस्थातिलतैलाक्ता तारिणी तपनद्युतिः । तिलोत्तमा तिलककृत्तारकाधीशशेखरा ॥ ४०॥ तिलपुष्पप्रिया तारा
    तारकेशकुटुम्बिनी । स्थाणुपत्नी स्थितिकरी स्थलस्था स्थलवर्धिनी ॥ ४१॥ स्थितिस्थैर्या स्थविष्ठा च स्थावतिः
    स्थूलविग्रहा । दन्तिनी दण्डिनी दीना दरिद्रा दीनवत्सला ॥ ४२॥ देवी देववधूर्दैत्यदमिनी दन्तभूषणा । दयावती
    दमवती दमदा दाडिमस्तनी ॥ ४३॥ दन्दशूकनिभा दैत्यदारिणी देवताऽऽनना । दोलाक्रीडा दयालुश्च दम्पती देवतामयी
    ॥ ४४॥ दशा दीपस्थिता दोषा दोषहा दोषकारिणी । दुर्गा दुर्गार्तिशमनी दुर्गमा दुर्गवासिनी ॥ ४५॥ दुर्गन्धनाशिनी
    दुःस्था दुःस्वप्नशमकारिणी । दुर्वारा दुन्दुभिध्वाना दूरगा दूरवासिनी ॥ ४६॥ दरदा दरहा दात्री दयादा दुहिता
    दशा । धुरन्धरा धुरीणा च धौरेयी धनदायिनी ॥ ४७॥ धीरा धीराधरित्री च धर्मदा धीरमानसा । धनुर्धरा च धमिनी
    धूर्ता धूर्तपरिग्रहा ॥ ४८॥ धूमवर्णा धूमपाना धूमला धूममोदिनी । नलिनी नन्दनी नन्दा नन्दिनी नन्दबालिका
    ॥ ४९॥ नवीना नर्मदा नर्मी नेमिर्नियमनिश्चया । निर्मला निगमाचरा निम्नगा नग्निका निमिः ॥ ५०॥ नाला निरन्तरा
    निघ्नी निर्लेपा निर्गुणा नतिः । नीलग्रीवा निरीहा च निरञ्जनजनी नवी ॥ ५१॥ नवनीतप्रिया नारी नरकार्णवतारिणी
    । नारायणी निराकारा निपुणा निपुणप्रिया ॥ ५२॥ निशा निद्रा नरेन्द्रस्था नमिता नमितापि च । निर्गुण्डिका
    च निर्गुण्डा निर्मांसा नासिकाभिधा ॥ ५३॥ पताकिनी पताका च पलप्रीतिर्यशश्विनी । पीना पीनस्तना पत्नी पवनाशनशायिनी
    ॥ ५४॥ परा पराकला पाका पाककृत्यरतिप्रिया । पवनस्था सुपवना तापसी प्रीतिवर्धिनी ॥ ५५॥ पशुवृद्धिकरी पुष्टिः
    पोषणी पुष्पवर्धिनी । पुष्पिणी पुस्तककरा पुन्नागतलवासिनी ॥ ५६॥ पुरन्दरप्रिया प्रीतिः पुरमार्गनिवासिनी
    । पेशा पाशकरा पाशबन्धहा पांशुलापशुः ॥ ५७॥ पटः पटाशा परशुधारिणी पाशिनी तथा । पापघ्नी पतिपत्नी च पतिताऽपतितापि
    च ॥ ५८॥ पिशाची च पिशाचघ्नी पिशिताशनतोषिता । पानदा पानपात्रा च पानदानकरोद्यता ॥ ५९॥ पेषा प्रसिद्धिः
    पीयूषा पूर्णा पूर्णमनोरथा । पतद्गर्भा पतद्गात्रा पौनःपुण्यपिवापुरा ॥ ६०॥ पङ्किला पङ्कमग्ना च पामीपा
    पञ्जरस्थिता । पञ्चमा पञ्चयामा च पञ्चता पञ्चमप्रिया ॥ ६१॥ पञ्चमुद्रा पुण्डरीका पिङ्गला पिङ्गलोचना ।
    प्रियङ्गुमञ्जरी पिण्डी पण्डिता पाण्डुरप्रभा ॥ ६२॥ प्रेतासना प्रियालुस्था पाण्डुघ्नी पीतसापहा । फलिनी
    फलदात्री च फलश्री फणिभूषणा ॥ ६३॥ फूत्कारकारिणी स्फारा फुल्ला फुल्लाम्बुजासना । फिरङ्गहा स्फीतमतिः
    स्फितिः स्फीतिकरी तथा ॥ ६४॥ वनमाया बलारातिर्बलिनी बलवर्धिनी । वेणुवाद्या वनचरी वीरा बीजमयी अपि ॥ ६५॥
    विद्या विद्याप्रदा विद्याबोधिनी वेददायिनी । बुधमाता च बुद्धा च वनमालावती वरा ॥ ६६॥ वरदा वारुणी वीणा
    वीणावादनतत्परा । विनोदिनी विनोदस्था वैष्णवी विष्णुवल्लभा ॥ ६७॥ विद्या वैद्यचिकित्सा च विवशा विश्वविश्रुता
    । वितन्द्रा विह्वला वेला विरावा विरतिर्वरा ॥ ६८॥ विविधार्ककरा वीरा बिम्बोष्ठी बिम्बवत्सला । विन्ध्यस्था
    वीरवन्द्या च वरीयानपराचवित् ॥ ६९॥ वेदान्तवेद्या वैद्या च वेदस्य विजयप्रदा । विरोधवर्धिनी वन्ध्या वन्ध्याबन्धनिवारिणी
    ॥ ७०॥ भगिनी भगमाला च भवानी भयभाविनी । भीमा भीमानना भैमी भङ्गुरा भीमदर्शना ॥ ७१॥ भिल्ली भल्लधरा भीरुर्भेरुण्डी
    भीर्भयापहा । भगसर्पिण्यपि भगा भगरूपा भगालया ॥ ७२॥ भगासना भगामोदा भेरी भङ्काररञ्जिता । भीषणा भीषणारावा
    भगवत्यपि भूषणा ॥ ७३॥ भारद्वाजी भोगदात्री भवघ्नी भूतिभूषणा । भूतिदा भूमिदात्री च भूपतित्वप्रदायिनी
    ॥ ७४॥ भ्रमरी भ्रामरी नीला भूपालमुकुटस्थिता । मत्ता मनोहरमना मानिनी मोहनी मही ॥ ७५॥
