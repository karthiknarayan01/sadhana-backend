id: shrisadashivendrastavah
category: stotram
name:
  english: shrisadashivendrastavah
  devanagari: श्रीसदाशिवेन्द्रस्तवः
content:
  english: pyahvoccarena jatu naijasya | kurvanaya viraktan pranatim kurmah sadashivendraya || 23 || kamaniyakamanakartre
    shamaniyabhayapaharacaturaya | tapaniyasadrishavapushe pranatim kurmah sadashivendraya || 24 || tarakavidyadatre
    tarapatigarvavarakasyaya | tarajapapravanaya pranatim kurmah sadashivendraya || 25 || muko'pi yatkripa
    cellokottarakirtirashu jayeta | adbhutacaritayasmai pranatim kurmah sadashivendraya || 26 || durjanadurayataram
    sajjanasulabhaya patrahastaya | tarutalaniketanaya pranatim kurmah sadashivendraya || 27 || bhavasindhutarayitre
    bhavabhaktaya pranamravashyaya | bhavabandhavirahitaya pranatim kurmah sadashivendraya || 28 || trividhasyapi
    tyagam vapushah kartum sthalatraye ya iva | akarotsamadhimasmai pranatim kurmah sadashivendraya ||
    29 || kaminapi jitahridayam kruram shantam jadam sudhiyam | kurute yatkarunasmai pranatim kurmah sadashivendraya
    || 30 || vedasmritisthavidva
  devanagari: प्याह्वोच्चारेण जातु नैजस्य । कुर्वाणाय विरक्तान् प्रणतिं कुर्मः सदाशिवेन्द्राय ॥ २३ ॥ कमनीयकामानाकर्त्रे
    शमनीयभयापहारचतुराय । तपनीयसदृशवपुषे प्रणतिं कुर्मः सदाशिवेन्द्राय ॥ २४ ॥ तारकविद्यादात्रे तारापतिगर्ववारकास्याय
    । तारजपप्रवणाय प्रणतिं कुर्मः सदाशिवेन्द्राय ॥ २५ ॥ मूकोऽपि यत्कृपा चेल्लोकोत्तरकीर्तिराशु जायेत ।
    अद्भुतचरितायास्मै प्रणतिं कुर्मः सदाशिवेन्द्राय ॥ २६ ॥ दुर्जनदूरायतरां सज्जनसुलभाय पात्रहस्ताय । तरुतलनिकेतनाय
    प्रणतिं कुर्मः सदाशिवेन्द्राय ॥ २७ ॥ भवसिन्धुतारयित्रे भवभक्ताय प्रणम्रवश्याय । भवबन्धविरहिताय प्रणतिं
    कुर्मः सदाशिवेन्द्राय ॥ २८ ॥ त्रिविधस्यापि त्यागं वपुषः कर्तुं स्थलत्रये य इव । अकरोत्समाधिमस्मै प्रणतिं
    कुर्मः सदाशिवेन्द्राय ॥ २९ ॥ कामिनपि जितहृदयं क्रूरं शान्तं जडं सुधियम् । कुरुते यत्करुणास्मै प्रणतिं
    कुर्मः सदाशिवेन्द्राय ॥ ३० ॥ वेदस्मृतिस्थविद्व
