id: aghoramurtikavacam
category: kavacha
name:
  english: aghoramurtikavacam
  devanagari: अघोरमूर्तिकवचम्
content:
  english: aghorakavacam vakshye mahamantramayam param | rahasyam paramam tattvam na cakhyeyam duratmane
    || 4|| asya shri aghorakavacasya mahakalabhairava rishih anushtup chandah shrikalagnirudro devata
    | kshmim bijam kshmam shaktih kshmah kilakam shri aghora vidyasiddhyartham kavacapathe viniyogah ||
    atha mantrah aghorebhyo'tha ghorebhyo ghoraghoratarebhyah | sarvatah sarvasarvebhyo namastebhyo rudrarupebhyah
    || om aghoro me shivah patu shri me'ghoro lalatakam | hrim ghoro me'vatam netre klim ghoro me'vatacchati
    || 5|| sauhtarebhyo'vatangadaukshi nasam patu sarvatah ksham | mukham patu me sharvo'ghorah sarvo'vatangalam
    || 6|| ghorashca me'vatatskandhau hastau jvalannamo'vatu | jvalanah patu me vakshah kukshim prajvalarudrakah
    || 7|| parshvau prajvalarupebhyo nabhim me'ghorarupabhrit | shishnam me shulapanishca guhyam rudrah
    sadavatu || 8|| katim me'mritamurtishca medhre'vyannilakanthakah | uru candrajatah patu patu me tripurantakah
    || 6|| janghe trilocanah patu gulphau yajniyarupavan | aghoro'nghri ca me patu padau me'ghorabhairavah
    || 10|| padadimurdhaparyantamaghoratma shivo'vatu | shirasah padaparyantam payanme'ghorabhairavah
    || 11|| prabhate bhairavah patu madhyahe vatuko'vatu | sandhyayam ca mahakalo nishayam kalabhairavah
    || 12|| arddharatre svayam ghoro nishante'mritarupadhrit | purve mam patu rigvedo yajurvedastu dakshine
    || 13|| pashcime samavedo'vyaduttare'tharvavedakah | agneyyamagniravyanmam nairrityam nityacetanah
    || 14|| vayavyam raudrarupo'vyadaishanyam kalashasanah | urdhvo'vyadurdhvaretashca patale parameshvarah
    || 15|| dashadikshu sada payaddevah kalagnirudrakah | agnermam patu kalagnirvayormam vayubhakshakah
    || 16|| jaladaurvamukhah patu pathi mam shankaro'vatu | nishannam yogadhyeyo'vyadgacchantam vayurupabhrit
    || 17|| grihe sharvah sada patu bahih payadvrishadhvajah | sarvatra sarvada patu mamaghoro'tha ghorakah
    || 18|| rane rajakule durge durbhikshe shatrusamsadi | dyute maribhaye rashtre pralaye vadina kule
    || 16|| aghorebhyo'tha ghorebhyo'vatanmam ghorabhairavah | ghoraghoratarebhyo mam payanmanmathasangare
    || 20|| sarvatah sarvasarvebhyo bhojanavasare'vatu | namaste rudrarupebhyo'vatu mam ghorabhairavah
    || 21|| sarvatra sarvadakalam sarvangam sarvabhitishu | ham yam ram lam vam sham sham sam ham lam
    kshah aghorakah || 22|| aghorastraya phat patu aghoro mam sabhairavah | vismaritam ca yatsthanam sthalam
    yannamavarjitam || 23|| tatsarvam mamaghoro'vyanmamathaghorah sabhairavah | bharyanputransuhridvargankanyam
    yadvastu mamakam || 24|| tatsarvam patu me nityam aghoro matha ghorakah | snane stave jape pathe home'vyatkshah
    aghorakah || 25|| aghorebhyo'tha ghorebhyo ghoraghoratarebhyah | sarvatah sarvasarvebhyo namastebhyo
    rudrarupebhyah || 26|| om shrim hrim klim sauh kshmam patu nityam mam shri aghorakah | itidam kavacam
    guhyam trishu lokeshu durlabham || 27|| mulamantramayam divyam trailokye saramuttamam | adatavyamavacyam
    ca kavacam guhyamishvari || 28|| aprashtavyamastotavyam dikshahinena mantrina | adikshitaya shishyaya
    putraya sharajanmane || 26|| na datavyam na shrotavyamityajnam mamakam sha
  devanagari: अघोरकवचं वक्ष्ये महामन्त्रमयं परम् । रहस्यं परमं तत्त्वं न चाख्येयं दुरात्मने ॥ ४॥ अस्य
    श्री अघोरकवचस्य महाकालभैरव ऋषिः अनुष्टुप् छन्दः श्रीकालाग्निरुद्रो देवता । क्ष्मीं बीजं क्ष्मां शक्तिः
    क्ष्मः कीलकं श्री अघोर विद्यासिद्ध्यर्थं कवचपाठे विनियोगः ॥ अथ मन्त्रः अघोरेभ्योऽथ घोरेभ्यो घोरघोरतरेभ्यः
    । सर्वतः सर्वसर्वेभ्यो नमस्तेभ्यो रुद्ररूपेभ्यः ॥ ॐ अघोरो मे शिवः पातु श्री मेऽघोरो ललाटकम् । ह्रीं
    घोरो मेऽवतां नेत्रे क्लीं घोरो मेऽवताच्छती ॥ ५॥ सौःतरेभ्योऽवताङ्गडौक्षी नासां पातु सर्वतः क्षं । मुखं
    पातु मे शर्वोऽघोरः सर्वोऽवताङ्गलम् ॥ ६॥ घोरश्च मेऽवतात्स्कन्धौ हस्तौ ज्वलन्नमोऽवतु । ज्वलनः पातु मे
    वक्षः कुक्षिं प्रज्वलरुद्रकः ॥ ७॥ पार्श्वौ प्रज्वलरूपेभ्यो नाभिं मेऽघोररूपभृत् । शिश्नं मे शूलपाणिश्च
    गुह्यं रुद्रः सदावतु ॥ ८॥ कटिं मेऽमृतमूर्तिश्च मेढ्रेऽव्यान्नीलकण्ठकः । ऊरू चन्द्रजटः पातु पातु मे
    त्रिपुरान्तकः ॥ ६॥ जङ्घे त्रिलोचनः पातु गुल्फौ याज्ञियरूपवान् । अघोरोऽङ्घ्री च मे पातु पादौ मेऽघोरभैरवः
    ॥ १०॥ पादादिमूर्धपर्यन्तमघोरात्मा शिवोऽवतु । शिरसः पादपर्यन्तं पायान्मेऽघोरभैरवः ॥ ११॥ प्रभाते भैरवः
    पातु मध्याहे वटुकोऽवतु । सन्ध्यायां च महाकालो निशायां कालभैरवः ॥ १२॥ अर्द्धरात्रे स्वयं घोरो निशान्तेऽमृतरूपधृत्
    । पूर्वे मां पातु ऋग्वेदो यजुर्वेदस्तु दक्षिणे ॥ १३॥ पश्चिमे सामवेदोऽव्यादुत्तरेऽथर्ववेदकः । आग्नेय्यामग्निरव्यान्मां
    नैरृत्यां नित्यचेतनः ॥ १४॥ वायव्यां रौद्ररूपोऽव्यादैशान्यां कालशासनः । ऊर्ध्वोऽव्यादूर्ध्वरेताश्च
    पाताले परमेश्वरः ॥ १५॥ दशदिक्षु सदा पायाद्देवः कालाग्निरुद्रकः । अग्नेर्मां पातु कालाग्निर्वायोर्मां
    वायुभक्षकः ॥ १६॥ जलादौर्वामुखः पातु पथि मां शङ्करोऽवतु । निषण्णं योगध्येयोऽव्याद्गच्छन्तं वायुरूपभृत्
    ॥ १७॥ गृहे शर्वः सदा पातु बहिः पायाद्वृषध्वजः । सर्वत्र सर्वदा पातु मामघोरोऽथ घोरकः ॥ १८॥ रणे राजकुले
    दुर्गे दुर्भिक्षे शत्रुसंसदि । द्यूते मारीभये राष्ट्रे प्रलये वादिना कुले ॥ १६॥ अघोरेभ्योऽथ घोरेभ्योऽवतान्मां
    घोरभैरवः । घोरघोरतरेभ्यो मां पायान्मन्मथसङ्गरे ॥ २०॥ सर्वतः सर्वसर्वेभ्यो भोजनावसरेऽवतु । नमस्ते रुद्ररूपेभ्योऽवतु
    मां घोरभैरवः ॥ २१॥ सर्वत्र सर्वदाकालं सर्वाङ्गं सर्वभीतिषु । हं यं रं लं वं शं षं सं हं लं क्षः अघोरकः
    ॥ २२॥ अघोरास्त्राय फट् पातु अघोरो मां सभैरवः । विस्मारितं च यत्स्थानं स्थलं यन्नामवर्जितम् ॥ २३॥ तत्सर्वं
    मामघोरोऽव्यान्मामथाघोरः सभैरवः । भार्यान्पुत्रान्सुहृद्वर्गान्कन्यां यद्वस्तु मामकम् ॥ २४॥ तत्सर्वं
    पातु मे नित्यं अघोरो माथ घोरकः । स्नाने स्तवे जपे पाठे होमेऽव्यात्क्षः अघोरकः ॥ २५॥ अघोरेभ्योऽथ घोरेभ्यो
    घोरघोरतरेभ्यः । सर्वतः सर्वसर्वेभ्यो नमस्तेभ्यो रुद्ररूपेभ्यः ॥ २६॥ ॐ श्रीं ह्रीं क्लीं सौः क्ष्मं
    पातु नित्यं मां श्री अघोरकः । इतीदं कवचं गुह्यं त्रिषु लोकेषु दुर्लभम् ॥ २७॥ मूलमन्त्रमयं दिव्यं त्रैलोक्ये
    सारमुत्तमम् । अदातव्यमवाच्यं च कवचं गुह्यमीश्वरि ॥ २८॥ अप्रष्टव्यमस्तोतव्यं दीक्षाहीनेन मन्त्रिणा
    । अदीक्षिताय शिष्याय पुत्राय शरजन्मने ॥ २६॥ न दातव्यं न श्रोतव्यमित्याज्ञां मामकां श
