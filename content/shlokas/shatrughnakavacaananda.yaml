id: shatrughnakavacaananda
category: kavacha
name:
  english: shatrughnakavacaananda
  devanagari: शत्रुघ्नकवचआनन्द
content:
  english: ramasya samsthitam vame parshve vinayapurvakam | kaikeyinandanam saumyam mukutenatiranjitam
    || 1|| ratnakankanakeyuravanamalavirajitam | rashanakundaladharam ratnaharasunupuram || 2|| vyajanena
    vijayantam janakikantamadarat | ramanyastekshanam viram kaikeyitoshavardhanam || 3|| dvibhujam kanjanayanam
    divyapitambaranvitam | subhujam sundaram meghashyamaḻam sundarananam || 4|| ramavakye dattakarnam
    rakshoghnam khadgadharinam | dhanurbanadharam shreshtham dhritatuniramuttamam || 5|| sabhayam samsthitam
    ramyam kasturitilakankitam | makutasthavatamsena shobhitam ca smitananam || 6|| ravivamshodbhavam
    divyarupam dasharathatmajam | madhuravasinam devam lavanasuramardanam || 7|| evam dhyatva tu shatrughnam
    ramapadekshanam hridi | pathaniyam varam cedam kavacam tasya pavanam || 8|| atha kavacaprarambhah
    | purve tvavatu shatrughnah patu yamye sudarshanah | kaikeyinandanah patu praticyam sarvada mama ||
    1|| patudicyam ramabandhuh patvadho bharatanujah | ravivamshodbhavashcordhvam madhye dasharathatmajah
    || 2|| sarvatah patu mamatra kaikeyitoshavardhanah | shyamalangah shirah patu bhalam shrilakshmananujah
    || 3|| bhruvormadhye sada patu sumukho'travanitale | shrutakirtipatirnetre kapole patu raghavah ||
    4|| karnau kundalakarno'vyat nasagram nripavamshajah | mukham mama yuva patu vanim patu sphutaksharah
    || 5|| jihvam subahutato'vyadyupaketupita dvijan | cibukam ramyacibukah kantham patu subhashanah ||
    6|| skandhau patu mahatejah bhujau raghavavakyakrit | karau me kankanadharah patu khadgi nakhan mama
    || 7|| kukshim ramapriyah patu patu vaksho raghuttamah | parshve surarcitah patu patu prishtham varananah
    || 8|| jatharam patu rakshoghnah patu nabhim sulocanah | katim bharatamantri me guhyam shriramasevakah
    || 9|| ramarpitamanah patu lingamuru smitananah | kodandapanih patvatra januni mama sarvada || 10||
    ramamitrah patu jhanghe gulphau patu sunupurah | padau nripatipujyo'vyacchriman padangulirmama ||
    11|| patvangani samastani hyudarangah sada mama | romani ramaniyo'vyadratrau patu sudharmikah || 12||
    divase satyasandho'vyadbhojane sharasatkarah | gamane kalakanthovyatsarvada lavanantakah || 13|| evam
    shatrughnakavacam maya te samudiritam | ye pathanti narastvetatte narah saukhyabhaginah || 14|| shatrughnasya
    varam cedam kavacam mangaḻapradam | pathaniyam narairbhaktya putrapautrapravardhanam || 15|| asya
    stotrasya pathena yam yam kamam naro'rthayet | tam tam labhennishcayena satyametadvaco mama || 16||
    putrarthi prapnuyat putram dhanarthi dhanamapnuyat | icchakamam tu kamarthi prapnuyatpathanadina ||
    17|| kavacasyasya bhumyam hi shatrughnasya vinishcayat | tasmadetatsada bhaktya pathaniyam naraih
    shubham ||| 18|| adau narairmaruteshca pathitva kavacam shubham | tatah shatrughnakavacam pathaniyamidam
    shubham || 19|| pathaniyam bharatasya kavacam paramam tatah | tatah saumitrikavacam pathaniyam sada
    naraih || 20|| pathaniyam tatah
  devanagari: रामस्य संस्थितं वामे पार्श्वे विनयपूर्वकम् । कैकेयीनन्दनं सौम्यं मुकुटेनातिरञ्जितम् ॥ १॥
    रत्नकङ्कणकेयूरवनमालाविराजितम् । रशनाकुण्डलधरं रत्नहारसुनूपुरम् ॥ २॥ व्यजनेन वीजयन्तं जानकीकान्तमादरात्
    । रामन्यस्तेक्षणं वीरं कैकेयीतोषवर्धनम् ॥ ३॥ द्विभुजं कञ्जनयनं दिव्यपीताम्बरान्वितम् । सुभुजं सुन्दरं
    मेघश्यामळं सुन्दराननम् ॥ ४॥ रामवाक्ये दत्तकर्णं रक्षोघ्नं खड्गधारिणम् । धनुर्बाणधरं श्रेष्ठं धृततूणीरमुत्तमम्
    ॥ ५॥ सभायां संस्थितं रम्यं कस्तूरीतिलकाङ्कितम् । मकुटस्थावतंसेन शोभितं च स्मिताननम् ॥ ६॥ रविवंशोद्भवं
    दिव्यरूपं दशरथात्मजम् । मधुरावासिनं देवं लवणासुरमर्दनम् ॥ ७॥ एवं ध्यात्वा तु शत्रुघ्नं रामपादेक्षणं
    हृदि । पठनीयं वरं चेदं कवचं तस्य पावनम् ॥ ८॥ अथ कवचप्रारम्भः । पूर्वे त्ववतु शत्रुघ्नः पातु याम्ये
    सुदर्शनः । कैकेयीनन्दनः पातु प्रतीच्यां सर्वदा मम ॥ १॥ पातूदीच्यां रामबन्धुः पात्वधो भरतानुजः । रविवंशोद्भवश्चोर्ध्वं
    मध्ये दशरथात्मजः ॥ २॥ सर्वतः पातु मामत्र कैकेयीतोषवर्धनः । श्यामलाङ्गः शिरः पातु भालं श्रीलक्ष्मणानुजः
    ॥ ३॥ भ्रुवोर्मध्ये सदा पातु सुमुखोऽत्रावनीतले । श्रुतकीर्तिपतिर्नेत्रे कपोले पातु राघवः ॥ ४॥ कर्णौ
    कुण्डलकर्णोऽव्यात् नासाग्रं नृपवंशजः । मुखं मम युवा पातु वाणीं पातु स्फुटाक्षरः ॥ ५॥ जिह्वां सुबाहुतातोऽव्याद्यूपकेतुपिता
    द्विजान् । चिबुकं रम्यचिबुकः कण्ठं पातु सुभाषणः ॥ ६॥ स्कन्धौ पातु महातेजाः भुजौ राघववाक्यकृत् । करौ
    मे कङ्कणधरः पातु खड्गी नखान् मम ॥ ७॥ कुक्षिं रामप्रियः पातु पातु वक्षो रघूत्तमः । पार्श्वे सुरार्चितः
    पातु पातु पृष्ठं वराननः ॥ ८॥ जठरं पातु रक्षोघ्नः पातु नाभिं सुलोचनः । कटिं भरतमन्त्री मे गुह्यं श्रीरामसेवकः
    ॥ ९॥ रामार्पितमनाः पातु लिङ्गमूरू स्मिताननः । कोदण्डपाणिः पात्वत्र जानुनी मम सर्वदा ॥ १०॥ राममित्रः
    पातु झङ्घे गुल्फौ पातु सुनूपुरः । पादौ नृपतिपूज्योऽव्याच्छ्रीमान् पादाङ्गुलीर्मम ॥ ११॥ पात्वङ्गानि
    समस्तानि ह्युदाराङ्गः सदा मम । रोमाणि रमणीयोऽव्याद्रात्रौ पातु सुधार्मिकः ॥ १२॥ दिवसे सत्यसन्धोऽव्याद्भोजने
    शरसत्करः । गमने कलकण्ठोव्यात्सर्वदा लवणान्तकः ॥ १३॥ एवं शत्रुघ्नकवचं मया ते समुदीरितम् । ये पठन्ति
    नरास्त्वेतत्ते नराः सौख्यभागिनः ॥ १४॥ शत्रुघ्नस्य वरं चेदं कवचं मङ्गळप्रदम् । पठनीयं नरैर्भक्त्या
    पुत्रपौत्रप्रवर्धनम् ॥ १५॥ अस्य स्तोत्रस्य पाठेन यं यं कामं नरोऽर्थयेत् । तं तं लभेन्निश्चयेन सत्यमेतद्वचो
    मम ॥ १६॥ पुत्रार्थी प्राप्नुयात् पुत्रं धनार्थी धनमाप्नुयात् । इच्छाकामं तु कामार्थी प्राप्नुयात्पठनादिना
    ॥ १७॥ कवचस्यास्य भूम्यां हि शत्रुघ्नस्य विनिश्चयात् । तस्मादेतत्सदा भक्त्या पठनीयं नरैः शुभम् ॥। १८॥
    आदौ नरैर्मारुतेश्च पठित्वा कवचं शुभम् । ततः शत्रुघ्नकवचं पठनीयमिदं शुभम् ॥ १९॥ पठनीयं भरतस्य कवचं
    परमं ततः । ततः सौमित्रिकवचं पठनीयं सदा नरैः ॥ २०॥ पठनीयं ततः
