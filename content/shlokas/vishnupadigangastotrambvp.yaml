id: vishnupadigangastotrambvp
category: stotram
name:
  english: vishnupadigangastotramBVP
  devanagari: विष्णुपदीगन्गास्तोत्रम्BVP
content:
  english: shrivishnupadi athava gangastotram brahmavaivartapuranantargatam om namo gangayai | shribrahmovaca
    | shrotumicchami devesha lakshmikanta namah prabho | vishno vishnupadistotram papaghnam punyakaranam
    || 113|| shri narayana uvaca | shivasangitasammugdhashrikrishnangadravodbhavam | radhangadravasambhutam
    tam gangam pranamamyaham || 114|| ya janmasrishteradau ca goloke rasamandale | samnidhane shamkarasya
    tam gangam pranamamyaham || 115|| gopairgopibhirakirne shubhe radhamahotsave | kartikipurnimajatam
    tam gangam pranamamyaham || 116|| kotiyojanavistirna dairghye lakshaguna tatah | samavrita ya golokam
    tam gangam pranamamyaham || 117|| shashtilakshairyojanairya tato dairghye caturguna | samavrita ya
    vaikuntham tam gangam pranamamyaham || 118|| vimshallakshairyojanairya tato dairghye caturguna | samavrita
    brahmalokam ya tam gangam pranamamyaham || 119|| trimshallakshairyojanairya dairghye pancaguna tatah
    | avrita shivalokam ya tam gangam pranamamyaham || 120|| shadyojanasuvistirna dairghye vashaguna tatah
    | mandakini yendraloke tam gangam pranamamyaham || 121|| lakshayojanavistirna dairghye saptaguna tatah
    | avrita dhruvalokam ya tam gangam pranamamyaham || 122|| lakshayojanavistirna dairghye shadgunita
    tatah | avrita candralokam ya tam gangam pranamamyaham || 123|| yojanaih shashtisahasrairdairghye
    dashaguna tatah | avrita suryalokam ya tam gangam pranamamyaham || 124|| lakshayojanavistirna dairghye
    shadgunita tatah | avrita satyalokam ya tam gangam pranamamyaham || 125|| dashalakshairyojanairya
    dairghye pancaguna tatah | avrita ya tapolokam tam gangam pranamamyaham || 126|| sahasrayojana ya
    ca dairghye saptaguna tatah | avrita janalokam ya tam gangam pranamamyaham || 127|| sahasrayojanayama
    dairghye saptaguna tatah | avrita ya ca kailasam tam gangam pranamamyaham || 128|| patale ya bhogavati
    vistirna dashayojana | tato dashaguna dairghye tam gangam pranamamyaham || 129|| kroshaikamatravistirna
    tatah kshina na kutracit | kshitau calakananda ya tam gangam pranamamyaham || 130|| satye ya kshiravarna
    ca tretayamindusamnibha | dvapare candanabha ca tam gangam pranamamyaham || 131|| jalaprabha kalau
    ya ca nanyatra prithivitale | svarge ca nityam kshirabha tam gangam pranamamyaham || 132|| yasyah
    prabhava atulah purane ca shrutau shrutah | ya punyada papahartri tam gangam pranamamyaham || 133||
    yattoyakanikasparshah papinam ca pitamaha | brahmahatyadikam papam kotijanmarjitam dahet || 134||
    ityevam kathitam brahmangangapadyaikavimshatim | stotrarupam ca paramam papaghnam punyabijakam ||
    135|| nityam yo hi pathedbhaktya sampujya ca sureshvarim | ashvamedhaphalam nityam labhate natra samshayah
    || 136|| aputro labhate putram bharyahino labhetpriyam | roganmucyeta rogi ca baddho mucyeta bandhanat
    || 137|| aspashtakirtih suyasha murkho bhavati panditah | yah pathetpratarutthaya gangastotramidam
    shubham || 138|| shubham bhavettu dussvapnam gangasnanaphalam bhavet || 139|| iti shribrahmavaivarte
    mahapurane prakritikhande naradanarayanasamvade gangopakhyane dashamo'dhyayantargatam gangastotram
    sampurnam ||
  devanagari: श्रीविष्णुपदी अथवा गङ्गास्तोत्रम् ब्रह्मवैवर्तपुराणान्तर्गतम् ॐ नमो गङ्गायै । श्रीब्रह्मोवाच
    । श्रोतुमिच्छामि देवेश लक्ष्मीकान्त नमः प्रभो । विष्णो विष्णुपदीस्तोत्रं पापघ्नं पुण्यकारणम् ॥ ११३॥
    श्री नारायण उवाच । शिवसङ्गीतसंमुग्धश्रीकृष्णाङ्गद्रवोद्भवाम् । राधाङ्गद्रवसम्भूतां तां गङ्गां प्रणमाम्यहम्
    ॥ ११४॥ या जन्मसृष्टेरादौ च गोलोके रासमण्डले । संनिधाने शंकरस्य तां गङ्गां प्रणमाम्यहम् ॥ ११५॥ गोपैर्गोपीभिराकीर्णे
    शुभे राधामहोत्सवे । कार्तिकीपूर्णिमाजातां तां गङ्गां प्रणमाम्यहम् ॥ ११६॥ कोटियोजनविस्तीर्णा दैर्घ्ये
    लक्षगुणा ततः । समावृता या गोलोकं तां गङ्गां प्रणमाम्यहम् ॥ ११७॥ षष्टिलक्षैर्योजनैर्या ततो दैर्घ्ये
    चतुर्गुणा । समावृता या वैकुण्ठं तां गङ्गां प्रणमाम्यहम् ॥ ११८॥ विंशल्लक्षैर्योजनैर्या ततो दैर्घ्ये
    चतुर्गुणा । समावृता ब्रह्मलोकं या तां गङ्गां प्रणमाम्यहम् ॥ ११९॥ त्रिंशल्लक्षैर्योजनैर्या दैर्घ्ये
    पञ्चगुणा ततः । आवृता शिवलोकं या तां गङ्गां प्रणमाम्यहम् ॥ १२०॥ षड्योजनसुविस्तीर्णा दैर्घ्ये वशगुणा
    ततः । मन्दाकिनी येन्द्रलोके तां गङ्गां प्रणमाम्यहम् ॥ १२१॥ लक्षयोजनविस्तीर्णा दैर्घ्ये सप्तगुणा ततः
    । आवृता ध्रुवलोकं या तां गङ्गां प्रणमाम्यहम् ॥ १२२॥ लक्षयोजनविस्तीर्णा दैर्घ्ये षड्गुणिता ततः । आवृता
    चन्द्रलोकं या तां गङ्गां प्रणमाम्यहम् ॥ १२३॥ योजनैः षष्टिसाहस्रैर्दैर्घ्ये दशगुणा ततः । आवृता सूर्यलोकं
    या तां गङ्गां प्रणमाम्यहम् ॥ १२४॥ लक्षयोजनविस्तीर्णा दैर्घ्ये षड्गुणिता ततः । आवृता सत्यलोकं या तां
    गङ्गां प्रणमाम्यहम् ॥ १२५॥ दशलक्षैर्योजनैर्या दैर्घ्ये पञ्चगुणा ततः । आवृता या तपोलोकं तां गङ्गां
    प्रणमाम्यहम् ॥ १२६॥ सहस्रयोजना या च दैर्घ्ये सप्तगुणा ततः । आवृता जनलोकं या तां गङ्गां प्रणमाम्यहम्
    ॥ १२७॥ सहस्रयोजनयामा दैर्घ्ये सप्तगुणा ततः । आवृता या च कैलासं तां गङ्गां प्रणमाम्यहम् ॥ १२८॥ पाताले
    या भोगवती विस्तीर्णा दशयोजना । ततो दशगुणा दैर्घ्ये तां गङ्गां प्रणमाम्यहम् ॥ १२९॥ क्रोशैकमात्रविस्तीर्णा
    ततः क्षीणा न कुत्रचित् । क्षितौ चालकनन्दा या तां गङ्गां प्रणमाम्यहम् ॥ १३०॥ सत्ये य क्षीरवर्णा च त्रेतायामिन्दुसंनिभा
    । द्वापरे चन्दनाभा च तां गङ्गां प्रणमाम्यहम् ॥ १३१॥ जलप्रभा कलौ या च नान्यत्र पृथिवीतले । स्वर्गे
    च नित्यं क्षीराभा तां गङ्गां प्रणमाम्यहम् ॥ १३२॥ यस्याः प्रभाव अतुलः पुराणे च श्रुतौ श्रुतः । या पुण्यदा
    पापहर्त्री तां गङ्गां प्रणमाम्यहम् ॥ १३३॥ यत्तोयकणिकास्पर्शः पापिनां च पितामह । ब्रह्महत्यादिकं पापं
    कोटिजन्मार्जितं दहेत् ॥ १३४॥ इत्येवं कथितं ब्रह्मन्गङ्गापद्यैकविंशतिम् । स्तोत्ररूपं च परमं पापघ्नं
    पुण्यबीजकम् ॥ १३५॥ नित्यं यो हि पठेद्भक्त्या सम्पूज्य च सुरेश्वरीम् । अश्वमेधफलं नित्यं लभते नात्र
    संशयः ॥ १३६॥ अपुत्रो लभते पुत्रं भार्याहीनो लभेत्प्रियाम् । रोगान्मुच्येत रोगी च बद्धो मुच्येत बन्धनात्
    ॥ १३७॥ अस्पष्टकीर्तिः सुयशा मूर्खो भवति पण्डितः । यः पठेत्प्रातरुत्थाय गङ्गास्तोत्रमिदं शुभम् ॥ १३८॥
    शुभं भवेत्तु दुस्स्वप्नं गङ्गास्नानफलं भवेत् ॥ १३९॥ इति श्रीब्रह्मवैवर्ते महापुराणे प्रकृतिखण्डे नारदनारायणसंवादे
    गङ्गोपाख्याने दशमोऽध्यायान्तर्गतं गङ्गास्तोत्रं सम्पूर्णम् ॥
