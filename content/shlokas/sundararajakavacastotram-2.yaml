id: sundararajakavacastotram-2
category: kavacha
name:
  english: sundararajakavacastotram
  devanagari: सुन्दरराजकवचस्तोत्रम्
content:
  english: majanulambibhujamayata karnapasham | shrimanmahavanagirindranivasadiksham lakshmidharam kimapi
    vastu mama'virastu || 4|| sundaram sundarabhujam paramasvaminam harim | shribhuminiḻaramanam vrishadrishannamamyaham
    || 5|| || atha rakshavidhih || pracyam me sundarah patu agneyyam garudadhvajah | dakshine patu devesho
    nairityam patu vishvadrik || 1|| varunyam varadah patu vayavyam patu vamanah | trivikramottaram patu
    caishanyam patu keshavah || 2|| urdhvam me patu govindah hrishikeshastathahyadhah | paritah patu me
    sharnga cantarnarayano mama || 3|| sheshashayi shirah patu phalam bhaktajanapriyah | nasam rasadhipah
    patu shrotrau ratricarantakah || 4|| drishau me pundarikakshashcibukam karunanidhih | dashananpatu
    daityarih jihvam vacam shikhastatha || 5|| parameshthica patvoshthau kapolau karirakshakah | kantham
    vaikunthavasi me vakshau vrishagirishvarah || 6|| bhujau me sundarabhujah pani me parthasarathih |
    nakhanpatu mahavirah ameyatma'ngulirmama || 7|| pakshindravahanah kakshau kukshim trailokyarakshakah
    | kshirabdhishayi parshvau me prishtam me kamathivapuh || 8|| nabhim me padmanabhashca katim kaitabhanashanah
    | vanadrinilayo madhyamuru damodaro mama || 9|| januni janmaha patu janghe shankhasipadmadhrit | padau
    me paramasvami shubhangah patu me'nguḻih || 10|| parshni shatamakhastotri nakharanme hiranmayah |
    madhavah patu me'ngani sarvadevashikhamanih || 11|| carmanyasthini romani mamsani rudhirani ca | anantah
    patu me bahyam parito'bhyantarani ca || 12|| shuddhatma divase buddhim mangalango mano mama | vacam
    vanipatistutyo pranansundaravallabhah || 13|| indriyani ca sarvani sharirani harirmama | suryatma
    divase patu somatma nishi sarvada || 14|| ubhayo sandhyayoh patu cograsihyo'surasuhrit | varahah patu
    bhumau mam jale jalacaraprabhuh || 15|| vipine patu gopalah shaile dasharathishughrit | asthane kamajanakah
    yatradau me janardanah || 16|| dikshu sarvasu karyeshu sarvabhutahiteratah | mitram patu shriyam patu
    saumitreragrajo mama || 17|| bhutarakshasayakshebhyah kshudrebhyah patu mausali | kshayashulatisarebhyah
    kushthebhyo bhutamaranah || 18|| apasmarajvaradibhyah patu mam bhaktavatsalah | sharngi gadadharah
    patu cakri patu mahabalah || 19|| baladhvamsi ca me patu jagare shayane sada | ityaha bhagavanbrahma
    naradaya mahatmane || 20|| idam shrutva mahaprajnah narado munisattamah | svashishyebhyashca sarvebhyohyupadesham
    karoti sah || 21|| bahavo rishayashcedam japtva khayaphalangatah | ityashcaryakarandivyam kavacam
    yo japansada || 22|| || phalashrutih || sarvankamanavapnoti vishnusayujyamapnuyat | sundarakhyasya
    kavacam yo va bhritakaḻevare || 23|| na rogo na bhayam kvapi na bhutapretabadhakah | na shakyo badhitum
    lokaissarvatra vijayi bhavet || 24|| maharane sabhamadhye coravyaghrasamuhake | yassmaransundarabhujam
    takshanajjayamash
  devanagari: माजानुलम्बिभुजमायत कर्णपाशम् । श्रीमन्महावनगिरीन्द्रनिवासदीक्षं लक्ष्मीधरं किमपि वस्तु ममाऽविरस्तु
    ॥ ४॥ सुन्दरं सुन्दरभुजं परमस्वामिनं हरिम् । श्रीभूमिनीळारमणं वृषाद्रीशन्नमाम्यहम् ॥ ५॥ ॥ अथ रक्षाविधिः
    ॥ प्राच्यां मे सुन्दरः पातु आग्नेय्यां गरुडध्वजः । दक्षिणे पातु देवेशो नैऋत्यां पातु विश्वदृक् ॥ १॥
    वारुण्यां वरदः पातु वायव्यां पातु वामनः । त्रिविक्रमोत्तरं पातु चैशान्यां पातु केशवः ॥ २॥ ऊर्ध्वं
    मे पातु गोविन्दः हृषीकेशस्तथाह्यधः । परितः पातु मे शार्ङ्ग चान्तर्नारायणो मम ॥ ३॥ शेषशायी शिरः पातु
    फालं भक्तजनप्रियः । नासां रसाधिपः पातु श्रोत्रौ रात्रिचरान्तकः ॥ ४॥ दृशौ मे पुण्डरीकाक्षश्चिबुकं करुणानिधिः
    । दशनान्पातु दैत्यारिः जिह्वां वाचं शिखास्तथा ॥ ५॥ परमेष्ठीच पात्वोष्ठौ कपोलौ करिरक्षकः । कण्ठं वैकुण्ठवासी
    मे वक्षौ वृषगिरीश्वरः ॥ ६॥ भुजौ मे सुन्दरभुजः पाणी मे पार्थसारथिः । नखान्पातु महावीरः अमेयात्माऽङ्गुलीर्मम
    ॥ ७॥ पक्षीन्द्रवाहनः कक्षौ कुक्षिं त्रैलोक्यरक्षकः । क्षीराब्धिशायी पार्श्वौ मे पृष्टं मे कमठीवपुः
    ॥ ८॥ नाभिं मे पद्मनाभश्च कटिं कैटभनाशनः । वनाद्रिनिलयो मध्यमूरू दामोदरो मम ॥ ९॥ जानुनी जन्महा पातु
    जङ्घे शङ्खासिपद्मधृत् । पादौ मे परमस्वामी शुभाङ्गः पातु मेऽङ्गुळीः ॥ १०॥ पार्ष्णी शतमखस्तोत्री नखरान्मे
    हिरण्मयः । माधवः पातु मेऽङ्गानि सर्वदेवशिखामणिः ॥ ११॥ चर्मण्यस्थीनि रोमाणि मांसानि रुधिराणि च । अनन्तः
    पातु मे बाह्यं परितोऽभ्यन्तराणि च ॥ १२॥ शुद्धात्मा दिवसे बुद्धिं मङ्गलाङ्गो मनो मम । वाचं वाणीपतिस्तुत्यो
    प्राणान्सुन्दरवल्लभः ॥ १३॥ इन्द्रियाणि च सर्वाणि शरीराणि हरिर्मम । सूर्यात्मा दिवसे पातु सोमात्मा
    निशि सर्वदा ॥ १४॥ उभयो सन्ध्ययोः पातु चोग्रसिह्योऽसुरासुहृत् । वराहः पातु भूमौ मां जले जलचरप्रभुः
    ॥ १५॥ विपिने पातु गोपालः शैले दाशरथीषुघृत् । आस्थाने कामजनकः यात्रादौ मे जनार्दनः ॥ १६॥ दिक्षु सर्वासु
    कार्येषु सर्वभूतहितेरतः । मित्रं पातु श्रियं पातु सौमित्रेरग्रजो मम ॥ १७॥ भूतराक्षसयक्षेभ्यः क्षुद्रेभ्यः
    पातु मौसली । क्षयशूलातिसारेभ्यः कुष्ठेभ्यो भूतमारणः ॥ १८॥ अपस्मारज्वरादिभ्यः पातु मां भक्तवत्सलः ।
    शार्ङ्गी गदाधरः पातु चक्री पातु महाबलः ॥ १९॥ बलध्वंसी च मे पातु जागरे शयने सदा । इत्याह भगवान्ब्रह्म
    नारदाय महात्मने ॥ २०॥ इदं श्रुत्वा महाप्राज्ञः नारदो मुनिसत्तमः । स्वशिष्येभ्यश्च सर्वेभ्योह्युपदेशं
    करोति सः ॥ २१॥ बहवो ऋषयश्चेदं जप्त्वा खयफलङ्गताः । इत्याश्चर्यकरन्दिव्यं कवचं यो जपन्सदा ॥ २२॥ ॥ फलश्रुतिः
    ॥ सर्वान्कामानवाप्नोति विष्णुसायुज्यमाप्नुयात् । सुन्दराख्यस्य कवचं यो वा भृतकळेवरे ॥ २३॥ न रोगो न
    भयं क्वापि न भूतप्रेतबाधकः । न शक्यो बाधितुं लोकैस्सर्वत्र विजयी भवेत् ॥ २४॥ महारणे सभामध्ये चोरव्याघ्रसमूहके
    । यस्स्मरन्सुन्दरभुजं तक्षणाज्जयमश्
