id: nrisimhabhujangaprayatastotram-2
category: stotram
name:
  english: nrisimhabhujangaprayatastotram 2
  devanagari: नृसिंहभुजन्गप्रयातस्तोत्रम् २
content:
  english: shrinrisimhabhujangaprayatastotram 2 om namah sarvagirvanakotirakotisphuradrananiryalanirajitam
    | sharaccandrakotiprabhabhasurangam namaskurmahe viralakshminrisimham || 1|| sabhastambhanirbhedanavirbhavantam
    dhvanistambhitasheshadam bholikelim | pracandasphuratkandacandattahasam namaskurmahe viralakshminrisimham
    || 2|| hiranyakshavakshoganadhyakshavaksho shila kshodadakshograjayam nakhagram | pratispardhidaityendramattebhasimham
    namaskurmahe viralakshminrisimham || 3|| kiratantasadratnadaidipyamanam jvalattaraharavalim carukantham
    | kvanatkankanodarakeyuraharam namaskurmahe viralakshminrisimham || 4|| calaccancalakaracecitkaragram
    jvalatkilakalanalabhimanetram | mahodagradamshtrakaralogravaktram namaskurmahe viralakshminrisimha
    || 5|| ramavaktrapurnedusandarshanaikam prashantodbhatatopakopavaleyam | samastagamastomasamstuyamanam
    namaskurmahe viralakshminrisimham || 6|| trayimastakanyastasimantaratnam mahayogihritpundarikantanetram
    | paritranalokatrayam devaranam namaskurmahe viralakshminrisimham || 7|| namaste namaste sadabhaktabandho
    namaste namaste kripasarasindho | namaste namaste sadaviralakshminrisimhamaradhisha deva prasida om
    || 8|| bhujangaprayadashtakam tvishtakamam pathan shrinrisimhankitastotrametat | satitvarthavadvararashisamagram
    samagrayurarogyamaishvaryameti || 9|| iti shrimacchankaracaryaviracitam nrisimhabhujangaprayatastotram
    sampurnam |
  devanagari: श्रीनृसिंहभुजङ्गप्रयातस्तोत्रम् २ ॐ नमः सर्वगीर्वाणकोटीरकोटिस्फुरद्रननिर्यलनीराजिताम् ।
    शरच्चन्द्रकोटिप्रभाभासुराङ्गं नमस्कुर्महे वीरलक्ष्मीनृसिंहम् ॥ १॥ सभास्तम्भनिर्भेदनाविर्भवन्तं ध्वनिस्तम्भिताशेषदं
    भोलिकेलिम् । प्रचण्डस्फुरत्काण्डचण्डाट्टहासं नमस्कुर्महे वीरलक्ष्मीनृसिंहम् ॥ २॥ हिरण्याक्षवक्षोगणाध्यक्षवक्षो
    शिला क्षोददक्षोग्रजायं नखाग्रम् । प्रतिस्पर्धिदैत्येन्द्रमत्तेभसिंहं नमस्कुर्महे वीरलक्ष्मीनृसिंहम्
    ॥ ३॥ किराटान्तसद्रत्नदैदीप्यमानं ज्वलत्तारहारावलिं चारुकण्ठम् । क्वणत्कङ्कणोदारकेयूरहारं नमस्कुर्महे
    वीरलक्ष्मीनृसिंहम् ॥ ४॥ चलच्चञ्चलाकारचेचित्कराग्रं ज्वलत्कीलकालानलाभीमनेत्रम् । महोदग्रदंष्ट्राकरालोग्रवक्त्रं
    नमस्कुर्महे वीरलक्ष्मीनृसिंह ॥ ५॥ रमावक्त्रपूर्णेदुसन्दर्शनैकं प्रशान्तोद्भटाटोपकोपावलेयम् । समस्तागमस्तोमसंस्तूयमानं
    नमस्कुर्महे वीरलक्ष्मीनृसिंहम् ॥ ६॥ त्रयीमस्तकन्यस्तसीमन्तरत्नं महायोगिहृत्पुण्डरीकान्तनेत्रम् । परित्राणलोकत्रयं
    देवरनं नमस्कुर्महे वीरलक्ष्मीनृसिंहम् ॥ ७॥ नमस्ते नमस्ते सदाभक्तबन्धो नमस्ते नमस्ते कृपासारसिन्धो
    । नमस्ते नमस्ते सदावीरलक्ष्मीनृसिंहामराधीश देव प्रसीद ॐ ॥ ८॥ भुजङ्गप्रयादष्टकं त्विष्टकामं पठन् श्रीनृसिंहाङ्कितस्तोत्रमेतत्
    । सतीत्वार्थवद्वारराशीसमग्रं समग्रायुरारोग्यमैश्वर्यमेति ॥ ९॥ इति श्रीमच्छङ्कराचार्यविरचितं नृसिंहभुजङ्गप्रयातस्तोत्रं
    सम्पूर्णम् ।
