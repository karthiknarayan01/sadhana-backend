id: gangasahasra
category: stotram
name:
  english: gangasahasra
  devanagari: गन्गासहस्र
content:
  english: shailendradavatarini nijajale majjadjanottarini paravaraviharini bhavabhayashreni samutsarini
    | sheshaheranukarini harashirovallidalakarini kashiprantaviharini vijayate ganga manoharini || om
    namo gangadevyai || omkararupinyajara'tula'nanta'mritasrava | atyudara'bhaya'shoka'lakananda'mrita'mala
    || 17|| anathavatsala'mogha'pamyoniramritaprada | avyaktalakshana'kshobhya'navacchinna'para'jita ||
    18|| anathanatha'bhishtarthasiddhida'nangavardhini | animadiguna'dhara'graganya'likaharini || 19||
    acintyashaktiranagha'dbhutarupa'ghaharini | adrirajasuta'shtangayogasiddhiprada'cyuta || 20|| akshunnashaktirasuda'nantatirtha'mritodaka
    | anantamahima'para'nantasaukhyaprada'nnada || 21|| asheshadevatamurtiraghora'mritarupini | avidyajalashamani
    hyapratarkyagatiprada || 22|| asheshavighnasamhartri tvasheshagunagumphita | ajnanatimirajyotiranugrahaparayana
    || 23|| abhirama'navadyangyanantasara'kalankini | arogyada''nandavalli tvapannartivinashini || 24||
    ashcaryamurtirayushya hyadhya''dya''pra''ryasevita | apyayinyaptavidyakhya tvananda''shvasadayini
    || 25|| alasyaghnyapadam hantri hyanandamritavarshini | iravatishtadatrishta tvishtapurtaphalaprada
    || 26|| itihasashrutidyartha tvihamutrashubhaprada | ijyashilasamijyeshtha tvindradiparivandita ||
    27|| ilalankaramaleddha tvindiraramyamandira | idindiradisamsevya tvishvarishvaravallabha || 28||
    itibhitiharedya ca tvidaniyacaritrabhrit | utkrishtashaktirutkrishtodupamandalacarini || 29|| uditambaramargosroragalokaviharini
    | ukshorvarotpalotkumbha upendracaranadrava || 30|| udanvatpurtihetushcodarotsahapravardhini | udvegaghnyushnashamani
    hyushnarashmisutapriya || 31|| utpattisthitisamharakarinyuparicarini | urjam vahantyurjadharorjavati
    cormimalini || 32|| urdhvaretahpriyordhvadhva hyurmilordhvagatiprada | rishivrindastutarddhishca rinatrayavinashini
    || 33|| ritambhararddhidatri ca riksvarupa rijupriya | rikshamargavaharksharcirrijumargapradarshini
    || 34|| edhitakhiladharmartha tvekaikamritadayini | edhaniyasvabhavaijya tvejitasheshapataka || 35||
    aishvaryadaishvaryarupa hyaitihyam hyaindavidyutih | ojasvinyoshadhikshetramojodaudanadayini || 36||
    oshthamritaunnatyadatri tvaushadham bhavaroginam | audaryacancuraupendri tvaugri hyaumeyarupini ||
    37|| ambaradhvavahambashthambaramalambujekshana | ambikambumahayonirandhodandhakaharini || 38|| amshumala
    hyamshumati tvangikritashadanana | andhatamisrahantryandhuranjana hyanjanavati || 39|| kalyanakarini
    kamya kamalotpalagandhini | kumudvati kamalini kantih kalpitadayini || 40|| kancanakshi kamadhenuh
    kirtikrit kleshanashini | kratushreshtha kratuphala karmabandhavibhedini || 41|| kamalakshi klamahara
    krishanutapanadyutih | karunardra ca kalyani kalikalmashanashini || 42|| kamarupa kriyashaktih kamalotpalamalini
    | kutastha karuna kanta kurmayana kalavati || 43|| kamala kalpalatika kali kalushavairini | kamaniyajala
    kamra kapardisukapardaga || 44|| kalakutaprashamani kadambakusumapriya | kalindi kelilalita kalakallolamalika
    || 45|| krantalokatraya kanduh kandutanayavatsala | khadgini khadgadharabha khaga khandendudharini
    || 46|| khekhelagamini khastha khandendutilakapriya | khecari khecarivandya khyatih khyatipradayini
    || 47|| khanditapranataghaugha khalabuddhivinashini | khatainah kandasandoha khadgakhatvanga khetini
    || 48|| kharasantapashamani khanih piyushapathasam | ganga gandhavati gauri gandharvanagarapriya ||
    49|| gambhirangi gunamayi gatatanka gatipriya | gananathambika gita gadyapadyaparishtuta || 50|| gandhari
    garbhashamani gatibhrashtagatiprada | gomati guhyavidya gaurgoptri gaganagamini || 51|| gotrapravardhini
    gunya gunatita gunagranih | guhambika girisuta govindanghrisamudbhava || 52|| gunaniyacaritra ca gayatri
    girishapriya | gudharupa gunavati gurvi gauravavardhini || 53|| grahapidahara gundra garaghni ganavatsala
    | gharmahantri ghritavati ghritatushtipradayini || 54|| ghantaravapriya ghoraghaughavidhvamsakarini
    | ghranatushtikari ghosha ghanananda ghanapriya || 55|| ghatuka ghurnitajala ghrishtapatakasantatih
    | ghatakotiprapitapa ghatitasheshamangala || 56|| ghrinavati ghrininidhirghasmara ghukanadini | ghusrinapinjaratanurgharghara
    ghargharasvana || 57|| candrika candrakantambushcancadapa caladyutih | cinmayi citirupa ca candrayutashatanana
    || 58|| campeyalocana carushcarvangi carugamini | carya caritranilaya citrakriccitrarupini || 59||
    campushcandanashucyambushcarcaniya cirasthira | carucampakamaladhya camitasheshadushkrita || 60||
    cidakashavaha cintya cancaccamaravijita | coritasheshavrijina caritasheshamandala || 61|| cheditakhilapapaugha
    chadmaghni chalaharini | channatrivishtapatala chotitasheshabandhana || 62|| churitamritadharaugha
    chinnainashchandagamini | chatrikritamaralaugha chatikritanijamrita || 63|| jahnavi jya jaganmata
    japya janghalavicika | jaya janardanaprita jushaniya jagaddhita || 64|| jivanam jivanaprana jagajjyeshtha
    jaganmayi | jivajivatulatika janmijanmanibarhini || 65|| jadyavidhvamsanakari jagadyonirjalavila |
    jagadanandajanani jalaja jalajekshana || 66|| janalocanapiyusha jatatataviharini | jayanti janjapukaghni
    janitajnanavigraha || 67|| jhallarivadyakushala jhalajjhalajalavrita | jhintishavandya jhankarakarini
    jharjharavati || 68|| tikitasheshapatala tankikaino'dripatane | tankaranrityatkallola tikaniyamahatata
    || 69|| dambarapravaha dinarajahamsakulakula | damaddamaruhasta ca damaroktamahandaka || 70|| dhaukitasheshanirvana
    dhakkanadacalajjala | dhundhivighneshajanani dhanaddhunitapataka || 71|| tarpani tirthatirtha ca tripatha
    tridasheshvari | trilokagoptri toyeshi trailokyaparivandita || 72|| tapatritayasamhartri tejobalavivardhini
    | trilakshya tarani tara tarapatikararcita || 73|| trailokyapavani punya tushtida tushtirupini | trishnacchetri
    tirthamata trivikramapadodbhava || 74|| tapomayi taporupa tapahstomaphalaprada |
  devanagari: शैलेन्द्रादवतारिणी निजजले मज्जद्जनोत्तारिणी पारावारविहारिणी भवभयश्रेणी समुत्सारिणी । शेषाहेरनुकारिणी
    हरशिरोवल्लीदलाकारिणी काशीप्रान्तविहारिणी विजयते गङ्गा मनोहारिणी ॥ ॐ नमो गङ्गादेव्यै ॥ ओंकाररूपिण्यजराऽतुलाऽनन्ताऽमृतस्रवा
    । अत्युदाराऽभयाऽशोकाऽलकनन्दाऽमृताऽमला ॥ १७॥ अनाथवत्सलाऽमोघाऽपांयोनिरमृतप्रदा । अव्यक्तलक्षणाऽक्षोभ्याऽनवच्छिन्नाऽपराऽजिता
    ॥ १८॥ अनाथनाथाऽभीष्टार्थसिद्धिदाऽनङ्गवर्धिनी । अणिमादिगुणाऽधाराऽग्रगण्याऽलीकहारिणी ॥ १९॥ अचिन्त्यशक्तिरनघाऽद्भुतरूपाऽघहारिणी
    । अद्रिराजसुताऽष्टाङ्गयोगसिद्धिप्रदाऽच्युता ॥ २०॥ अक्षुण्णशक्तिरसुदाऽनन्ततीर्थाऽमृतोदका । अनन्तमहिमाऽपाराऽनन्तसौख्यप्रदाऽन्नदा
    ॥ २१॥ अशेषदेवतामूर्तिरघोराऽमृतरूपिणी । अविद्याजालशमनी ह्यप्रतर्क्यगतिप्रदा ॥ २२॥ अशेषविघ्नसंहर्त्री
    त्वशेषगुणगुम्फिता । अज्ञानतिमिरज्योतिरनुग्रहपरायणा ॥ २३॥ अभिरामाऽनवद्याङ्ग्यनन्तसाराऽकलङ्किनी । आरोग्यदाऽऽनन्दवल्ली
    त्वापन्नार्तिविनाशिनी ॥ २४॥ आश्चर्यमूर्तिरायुष्या ह्याढ्याऽऽद्याऽऽप्राऽऽर्यसेविता । आप्यायिन्याप्तविद्याख्या
    त्वानन्दाऽऽश्वासदायिनी ॥ २५॥ आलस्यघ्न्यापदां हन्त्री ह्यानन्दामृतवर्षिणी । इरावतीष्टदात्रीष्टा त्विष्टापूर्तफलप्रदा
    ॥ २६॥ इतिहासश्रुतीड्यार्था त्विहामुत्रशुभप्रदा । इज्याशीलसमिज्येष्ठा त्विन्द्रादिपरिवन्दिता ॥ २७॥
    इलालङ्कारमालेद्धा त्विन्दिरारम्यमन्दिरा । इदिन्दिरादिसंसेव्या त्वीश्वरीश्वरवल्लभा ॥ २८॥ ईतिभीतिहरेड्या
    च त्वीडनीयचरित्रभृत् । उत्कृष्टशक्तिरुत्कृष्टोडुपमण्डलचारिणी ॥ २९॥ उदिताम्बरमार्गोस्रोरगलोकविहारिणी
    । उक्षोर्वरोत्पलोत्कुम्भा उपेन्द्रचरणद्रवा ॥ ३०॥ उदन्वत्पूर्तिहेतुश्चोदारोत्साहप्रवर्धिनी । उद्वेगघ्न्युष्णशमनी
    ह्युष्णरश्मिसुताप्रिया ॥ ३१॥ उत्पत्तिस्थितिसंहारकारिण्युपरिचारिणी । ऊर्जं वहन्त्यूर्जधरोर्जावती चोर्मिमालिनी
    ॥ ३२॥ ऊर्ध्वरेतःप्रियोर्ध्वाध्वा ह्यूर्मिलोर्ध्वगतिप्रदा । ऋषिवृन्दस्तुतर्द्धिश्च ऋणत्रयविनाशिनी ॥
    ३३॥ ऋतम्भरर्द्धिदात्री च ऋक्स्वरूपा ऋजुप्रिया । ऋक्षमार्गवहर्क्षार्चिरृजुमार्गप्रदर्शिनी ॥ ३४॥ एधिताखिलधर्मार्था
    त्वेकैकामृतदायिनी । एधनीयस्वभावैज्या त्वेजिताशेषपातका ॥ ३५॥ ऐश्वर्यदैश्वर्यरूपा ह्यैतिह्यं ह्यैन्दवीद्युतिः
    । ओजस्विन्योषधीक्षेत्रमोजोदौदनदायिनी ॥ ३६॥ ओष्ठामृतौन्नत्यदात्री त्वौषधं भवरोगिणाम् । औदार्यचञ्चुरौपेन्द्री
    त्वौग्री ह्यौमेयरूपिणी ॥ ३७॥ अम्बराध्ववहाम्बष्ठाम्बरमालाम्बुजेक्षणा । अम्बिकाम्बुमहायोनिरन्धोदान्धकहारिणी
    ॥ ३८॥ अंशुमाला ह्यंशुमती त्वङ्गीकृतषडानना । अन्धतामिस्रहन्त्र्यन्धुरञ्जना ह्यञ्जनावती ॥ ३९॥ कल्याणकारिणी
    काम्या कमलोत्पलगन्धिनी । कुमुद्वती कमलिनी कान्तिः कल्पितदायिनी ॥ ४०॥ काञ्चनाक्षी कामधेनुः कीर्तिकृत्
    क्लेशनाशिनी । क्रतुश्रेष्ठा क्रतुफला कर्मबन्धविभेदिनी ॥ ४१॥ कमलाक्षी क्लमहरा कृशानुतपनद्युतिः । करुणार्द्रा
    च कल्याणी कलिकल्मषनाशिनी ॥ ४२॥ कामरूपा क्रियाशक्तिः कमलोत्पलमालिनी । कूटस्था करुणा कान्ता कूर्मयाना
    कलावती ॥ ४३॥ कमला कल्पलतिका काली कलुषवैरिणी । कमनीयजला कम्रा कपर्दिसुकपर्दगा ॥ ४४॥ कालकूटप्रशमनी कदम्बकुसुमप्रिया
    । कालिन्दी केलिललिता कलकल्लोलमालिका ॥ ४५॥ क्रान्तलोकत्रया कण्डूः कण्डूतनयवत्सला । खड्गिनी खड्गधाराभा
    खगा खण्डेन्दुधारिणी ॥ ४६॥ खेखेलगामिनी खस्था खण्डेन्दुतिलकप्रिया । खेचरी खेचरीवन्द्या ख्यातिः ख्यातिप्रदायिनी
    ॥ ४७॥ खण्डितप्रणताघौघा खलबुद्धिविनाशिनी । खातैनः कन्दसन्दोहा खड्गखट्वाङ्ग खेटिनी ॥ ४८॥ खरसन्तापशमनी
    खनिः पीयूषपाथसाम् । गङ्गा गन्धवती गौरी गन्धर्वनगरप्रिया ॥ ४९॥ गम्भीराङ्गी गुणमयी गतातङ्का गतिप्रिया
    । गणनाथाम्बिका गीता गद्यपद्यपरिष्टुता ॥ ५०॥ गान्धारी गर्भशमनी गतिभ्रष्टगतिप्रदा । गोमती गुह्यविद्या
    गौर्गोप्त्री गगनगामिनी ॥ ५१॥ गोत्रप्रवर्धिनी गुण्या गुणातीता गुणाग्रणीः । गुहाम्बिका गिरिसुता गोविन्दाङ्घ्रिसमुद्भवा
    ॥ ५२॥ गुणनीयचरित्रा च गायत्री गिरिशप्रिया । गूढरूपा गुणवती गुर्वी गौरववर्धिनी ॥ ५३॥ ग्रहपीडाहरा गुन्द्रा
    गरघ्नी गानवत्सला । घर्महन्त्री घृतवती घृततुष्टिप्रदायिनी ॥ ५४॥ घण्टारवप्रिया घोराघौघविध्वंसकारिणी
    । घ्राणतुष्टिकरी घोषा घनानन्दा घनप्रिया ॥ ५५॥ घातुका घूर्णितजला घृष्टपातकसन्ततिः । घटकोटिप्रपीतापा
    घटिताशेषमङ्गला ॥ ५६॥ घृणावती घृणिनिधिर्घस्मरा घूकनादिनी । घुसृणापिञ्जरतनुर्घर्घरा घर्घरस्वना ॥ ५७॥
    चन्द्रिका चन्द्रकान्ताम्बुश्चञ्चदापा चलद्युतिः । चिन्मयी चितिरूपा च चन्द्रायुतशतानना ॥ ५८॥ चाम्पेयलोचना
    चारुश्चार्वङ्गी चारुगामिनी । चार्या चारित्रनिलया चित्रकृच्चित्ररूपिणी ॥ ५९॥ चम्पूश्चन्दनशुच्यम्बुश्चर्चनीया
    चिरस्थिरा । चारुचम्पकमालाढ्या चमिताशेषदुष्कृता ॥ ६०॥ चिदाकाशवहा चिन्त्या चञ्चच्चामरवीजिता । चोरिताशेषवृजिना
    चरिताशेषमण्डला ॥ ६१॥ छेदिताखिलपापौघा छद्मघ्नी छलहारिणी । छन्नत्रिविष्टपतला छोटिताशेषबन्धना ॥ ६२॥ छुरितामृतधारौघा
    छिन्नैनाश्छन्दगामिनी । छत्रीकृतमरालौघा छटीकृतनिजामृता ॥ ६३॥ जाह्नवी ज्या जगन्माता जप्या जङ्घालवीचिका
    । जया जनार्दनप्रीता जुषणीया जगद्धिता ॥ ६४॥ जीवनं जीवनप्राणा जगज्ज्येष्ठा जगन्मयी । जीवजीवातुलतिका
    जन्मिजन्मनिबर्हिणी ॥ ६५॥ जाड्यविध्वंसनकरी जगद्योनिर्जलाविला । जगदानन्दजननी जलजा जलजेक्षणा ॥ ६६॥ जनलोचनपीयूषा
    जटातटविहारिणी । जयन्ती जञ्जपूकघ्नी जनितज्ञानविग्रहा ॥ ६७॥ झल्लरीवाद्यकुशला झलज्झालजलावृता । झिण्टीशवन्द्या
    झङ्कारकारिणी झर्झरावती ॥ ६८॥ टीकिताशेषपाताला टङ्किकैनोऽद्रिपाटने । टङ्कारनृत्यत्कल्लोला टीकनीयमहातटा
    ॥ ६९॥ डम्बरप्रवहा डीनराजहंसकुलाकुला । डमड्डमरुहस्ता च डामरोक्तमहाण्डका ॥ ७०॥ ढौकिताशेषनिर्वाणा ढक्कानादचलज्जला
    । ढुण्ढिविघ्नेशजननी ढणड्ढुणितपातका ॥ ७१॥ तर्पणी तीर्थतीर्था च त्रिपथा त्रिदशेश्वरी । त्रिलोकगोप्त्री
    तोयेशी त्रैलोक्यपरिवन्दिता ॥ ७२॥ तापत्रितयसंहर्त्री तेजोबलविवर्धिनी । त्रिलक्ष्या तारणी तारा तारापतिकरार्चिता
    ॥ ७३॥ त्रैलोक्यपावनी पुण्या तुष्टिदा तुष्टिरूपिणी । तृष्णाच्छेत्री तीर्थमाता त्रिविक्रमपदोद्भवा ॥
    ७४॥ तपोमयी तपोरूपा तपःस्तोमफलप्रदा ।
