id: mahanyasam-7-7-panchanga-japa
category: stotram
name:
  english: Mahanyasam - 7.7. Panchanga Japa
content:
  english: atha pancangajapah || sadyojata mprapadyami sadyojataya vai namo namah | bhave bhave natibhave
    bhavasva mam | bhavodbhavaya namah || jyeshthaya namah shreshthaya namo rudraya namah kalaya namah
    kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya namo
    manonmanaya namah || bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudrarupebhyah || tatpurushaya
    vidmahe mahadevaya dhimahi | tanno rudrah pracodaya ssarvavidyanamishvara ssarvabhutanam brahmadhipatirbrahmano
    'dhipatirbrahma shivo me astu sadashivom ||
  devanagari: अथ पञ्चाङ्गजपः ॥ स॒द्योजा॒त म्प्र॑पद्या॒मि॒ स॒द्योजा॒ताय॒ वै नमो॒ नमः॑ । भ॒वे भ॑वे॒ नाति॑भवे
    भवस्व॒ माम् । भ॒वोद्भ॑वाय॒ नमः॑ ॥ ज्ये॒ष्ठाय॒ नमः॑ श्रे॒ष्ठाय॒ नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒ नमः॒ कल॑विकरणाय॒
    नमो॒ बल॑विकरणाय॒ नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒ नम॒ स्सर्व॑भूतदमनाय॒ नमो॑ म॒नोन्म॑नाय॒ नमः॑ ॥ भ्यो॒
    घोर॒घोर॑तरेभ्यः । सर्वे भ्यो॒ नम॑स्ते अस्तु रु॒द्ररू॑पेभ्यः ॥ तत्पुरु॑षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि
    । तन्नो॑ रुद्रः प्रचो॒दया स्सर्व॑विद्या॒ना॒मीश्वर स्सर्व॑भूता॒नां॒ ब्रह्माधि॑पति॒र्ब्रह्म॒णो ऽधि॑पति॒र्ब्रह्मा॑
    शि॒वो मे॑ अस्तु सदाशि॒वोम् ॥
