id: radhasayujyadayinikavacam
category: kavacha
name:
  english: radhasayujyadayinikavacam
  devanagari: राधासायुज्यदायिनीकवचम्
content:
  english: kupeshu yogini || 9|| adhastat patu me radha urdhvam patu paratpara | dikshu patu mahavidya
    vidinkshu ca mahapriya || 10|| purve patu mahalakshmih dakshine ca sulocana | pashcime patu raseshi
    uttare ca varaprada || 11|| agnyayam patu sananda nairrityam ca sumedhasa | vayavyam patu gopika ishanyam
    sarvada sthira || 12|| ratrau patu ca sa devi divase patu sa punah | svapne patu ca sa nityam jagare
    patu satvara || 13|| gacchan patu sthitam patu shayanam ca visheshatah | aranye patu me radha sankate
    patu sundari || 14|| sagare patu me radha parvate patu sarvada | shunye patu mahamaya sangrame patu
    ishvari || 15|| brahmaprapti
  devanagari: कूपेषु योगिनी ॥ ९॥ अधस्तात् पातु मे राधा ऊर्ध्वं पातु परात्परा । दिक्षु पातु महाविद्या विदिङ्क्षु
    च महाप्रिया ॥ १०॥ पूर्वे पातु महालक्ष्मीः दक्षिणे च सुलोचना । पश्चिमे पातु रासेशी उत्तरे च वरप्रदा
    ॥ ११॥ अग्न्यायां पातु सानन्दा नैरृत्यां च सुमेधसा । वायव्यां पातु गोपीका ईशान्यां सर्वदा स्थिरा ॥
    १२॥ रात्रौ पातु च सा देवी दिवसे पातु सा पुनः । स्वप्ने पातु च सा नित्यं जागरे पातु सत्वरा ॥ १३॥ गच्छन्
    पातु स्थितां पातु शयानां च विशेषतः । अरण्ये पातु मे राधा सङ्कटे पातु सुन्दरी ॥ १४॥ सागरे पातु मे राधा
    पर्वते पातु सर्वदा । शून्ये पातु महामाया सङ्ग्रामे पातु ईश्वरी ॥ १५॥ ब्रह्मप्राप्ति
