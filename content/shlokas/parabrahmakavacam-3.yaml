id: parabrahmakavacam-3
category: kavacha
name:
  english: parabrahmakavacam 3
  devanagari: परब्रह्मकवचम् ३
content:
  english: rinu narada vakshyami rahasyam paramadbhutam | na prakashyam kadacit tadayogyaya karhicit ||
    3|| niranjanabrahmarishih prokto'nushtupchanda udahritah | devata citshaktirupam parabrahma paratmanah
    || 4|| brahma bijam para maya shaktirityabhidhiyate | bhagavatyeva kilam syat sarvaguhyaprabodhini
    || 5|| etadantahsamalabhya mantramaunaparayanah | japet smaredva dhyayedva kavacam siddhidam param
    || 6|| prakshalya panipadau ca prashamyendriyapaddhatim | nirvikalpadhiya dhiman samasito jitendriyah
    || 7|| karanyasam tatah kuryanmaunabaddhendriyakramah | anganyasam tatah pashcaccidvahnim hridi bhavayet
    || 8|| hridi brahma shirasyadyam shikhayam paramam nyaset | kavace citparam shaktim netrayorbhagavatim
    nyaset || 9|| astratvena mahashantim sarvadikshu visarjayet | mudraya brahmamudrakhyam baddhva deham
    samacaret || 10|| dhyayedavyaktamatyantam nirvarnam vishvatomukham | anirdeshyam nirabhasam cidghanam
    paramam mahah || 11|| tatah kavacamarabhya rakshartham viniyojayet | yathoktakramayogena nanyatha
    siddhidam bhavet || 12|| om parabrahma shirah patu param dhama niranjanam | nirlepam nishkalam nityam
    nirbhedam brahma kevalam || 13|| lalate lokasakshitvam lasadavyaktavaibhavam | aprameyaprakashakhyam
    parabrahmavatad mama || 14|| bhruvormadhye param jyotiranirvacyam sanatanam | nihspandamritanirjharam
    me patu paramam padam || 15|| netre nirvyuhamavyagram vishvacakshuh sanirmalam | svayamsiddham param
    brahma sarvadarshi sadavatu || 16|| karnau shrutishiroguhyapranavottaranihsvanam | anahatantaralastham
    parabrahmavatad mama || 17|| nasikam nityanirmuktasarvagandhaikakaranam | sukshmatisukshmamavyaktam
    parabrahmavatad vibhuh || 18|| mukham me maunanirdesham vanmulaprabhavalayam | yadvaco'pi nivartante
    tatparam mamavatvajam || 19|| jihvam cinmayavaggarbham nigamagamagocaram | svayamudbhasitam dhama
    parabrahmavatad dhruvam || 20|| dantan kalakshayacchedi nirbhinnagranthibandhanam | anadinidhanam
    shantam parabrahmavatad mama || 21|| cibukam cidgabhirarthagudhamaunaikamandiram | akhandaikamahasaram
    parabrahmavatad vibhuh || 22|| kantham kalantaracchettri shabdabijavivarjitam | mahagambhiranihshvasam
    parabrahmavatad mama || 23|| amsau me vishvavishrantinirdhutabhuvanadvayau | sarvadharamacintyam tatparabrahmavatad
    dridham || 24|| bhujau me bhuribhavaughabhanjanau bhavyavikramau | nirvairam nirvikalpam tatparabrahmavatad
    vibhuh || 25|| karau karmakshayadvaravimalajnanadipakau | asangasparsharahitam parabrahmavatad mama
    || 26|| angulirnigamambhodhilaharisukshmavrittayah | acintyaspandarahitam parabrahmavatad vibhuh ||
    27|| hridaye shrimati lalitadevi paramakarunyavigraha | cidanandaikanilaya sarvamangaladayini || 28||
    nabhim me nityamavyaktanabhinabhipravartinim | parabrahma param dhama patu vishvaikakaranam || 29||
    katim kalakshayatitam kalpakalpantarashrayam | nirmaryadam nirabhasam parabrahmavatad mama || 30||
    prishtham me prishthatah patu sarvabharavivarjitam | anantadhama nirvyuham parabrahma sanatanam ||
    31|| parshvayoh paramam tattvam paracchedavivarjitam | nirupadhikamadvaitam parabrahmavatad vibhuh
    || 32|| guhyam guhyatamam patu guhyaguhyaprakashakam | nigudhagudhanirlinam parabrahma paratparam
    || 33|| uru me urjitanantavishvasamstambhakarinau | svayamsiddham mahashantam parabrahmavatad dhruvam
    || 34|| januni janmanirmuktam janghe jadyavidaranam | nihsheshasamshayacchettri parabrahmavatad mama
    || 35|| gulphau gudhagatim patu gahanagamagocaram | adrishyagamanam divyam parabrahma sanatanam ||
    36|| padau me paramavyomaparyantapadavistritau | sarvatirthamayam shantam parabrahmavatad vibhuh ||
    37|| padangulih padatitapadapraptipradipikah | niralambapadam divyam parabrahmavatad mama || 38||
    romani me rahasyaugharashmijalaprakashakah | anirvacaniyasaundaryam parabrahmavatad vibhuh || 39||
    tvacam me tattvasamvitam cinmaricimayim sada | asamsprishtamalacchayam parabrahmavatad dhruvam ||
    40|| raktam majjasthimamsadin dhatun dhamaikajivitan | antarbahiravicchinnam parabrahmavatad mama
    || 41|| prananapanasamanodanavyanavayavah | svasamvidvegasamyuktah pantu brahma paratparam || 42||
    mano buddhirahankarashcittam cidghanasamshrayam | svaprabhasaramavyagram parabrahmavatad vibhuh ||
    43|| jnanendriyani sarvani karmendriyaganam tatha | svabhavashuddhisampurnam parabrahmavatad mama
    || 44|| sukshmam karanamavyaktam mahadapyakhilam vapuh | yadasti yanna va kincit tatsarvam patu me
    param || 45|| sarvasvavasthasu sada sarvakalapravartishu | parabrahma param dhama mamavyadavyayatmakam
    || 46|| pracim mam patu sarvajnam pratyacim parameshvaram | udicim cinmayam dhama praticim brahma
    kevalam || 47|| aishanyam nirvikalpam mam agneyyam jnanavigraham | nairrityam nirbhayam brahma vayavyam
    vyomanirmalam || 48|| urdhve vyomatigam patvadhastadadharottaram | madhye mamavyayam brahma sarvato'vyahatam
    vibhum || 49|| jagrati svapnasamsare sushuptau turiyake | turiyatitanirlinam parabrahmavatanmama ||
    50|| gacchato me sthitasyapi dhavatah shayanasya ca | bhunjanasya japasyapi parabrahmavatad vibhuh
    || 51|| rane rajagrihe ghore giridurgamahavane | sindhumadhye mahavarte parabrahmavatanmama || 52||
    davagnau jalamadhye ca ghoravataprapidite | durbhikshe vyadhisanghate parabrahmavatad vibhuh || 53||
    bhutapretapishacaughairyaksharakshoganairapi | adrishtadurgrahebhyashca parabrahmavatanmama || 54||
    mohajalamahaghore samshayavartasankate | avidyativratimire parabrahmavatad vibhuh || 55|| kamakrodhabhayadveshalobhamatsaryasankule
    | madamanamaharaudre parabrahmavatanmama || 56|| vidyavadavivadeshu maunagarbheshu cintishu | shrutismritipuranarthe
    parabrahmavatad vibhuh || 57|| yogadhyanasamadhinam sukshmamargapravartishu | nadabindulayatite parabrahmavatanmama
    || 58|| kalpakshaye mahaghore sargarambhe punah punah | avikaram sadanityam parabrahmavatad vibhuh
    || 59|| idam kavacamatyugram rahasyam rahasamapi | dharayedyo hridi prajnah sa brahmamayatam vrajet
    || 60|| ya idam shraddhaya nityam shucirbhutva samahitah | japeddharayate vapi sa mukto natra samshayah
    || 61|| na tasya vighnasanghata na graha na ca darunah | na daivam na kritam karma badhitum prabhavanti
    hi || 62|| na tam mrityurbhayam ghoram na kalasya vikampanam | na dushtadrishtirna shapaughah sprashtumarhati
    karhicit || 63|| yatrayam likhito divyah sthapyate bhaktibhavatah | taddeshah sarvatirthanam sarabhuta
    iva smritah || 64|| yatrayam pujyate nityam shraddhabhaktisamanvitah | tatra devaganah sarve tishthanti
    svayameva hi || 65|| pathanatsmaranadasya dharanadarcanadapi | asheshapatakadhvamsah kshanadeva prajayate
    || 66|| agamyagamanam ghoramabhakshyasyapi bhakshanam | mahapatakasanghato vilayam yatyasamshayam
    || 67|| avidyagahanacchedi vijnanamritavarshakah | hridambuje sphureddiptah svayambodhadivakarah ||
    68|| yam yam cintayate kamam dharmayuktam samahitah | tam tam prapnoti nihshesham prasadatparabrahmanah
    || 69|| ashtasiddhirnava nidhayah siddhavidyashca kotishah | anugacchanti tam nityam dasibhuta iva
    svayam || 70|| na tasya durlabham kincinna trishu lokeshu vidyate | yasyedam hridaye nityam kavacam
    brahmarakshitam || 71|| brahma vishnurmaheshashca lokapalashca sarvashah | tam drishtva pujayantyeva
    brahmabhavasamanvitam || 72|| shrutayah smritayo veda agamah sakalastatha | svayameva prakashante
    tasya buddhau nirantaram || 73|| na tasya punaravrittirna janma na punarbhavah | yavaddehasthitistavadjivanmuktah
    sa ucyate || 74|| dehante parame dhamni na pravesho na nirgamah | svarupaikyam param shantam prapnotyeva
    niramayam || 75|| ekalakshapurashcarya vidhirasya smrito budhaih | dashamshahomasamyuktastarpanabhishekapurvakah
    || 76|| taddashamshena viprebhyo bhojyam dadyatsamahitah | gurave dakshinam dadyadbhaktya bhavasamanvitah
    || 77|| siddhe'smin kavace divye na mantrantaramishyate | na yantram na ca homadyam svayamsiddhipradam
    hi tat || 78|| yasya prasadamatrena mukah syadvagvisharadah | jado bhavedbrihaspatisamo dhirah prabuddhadhih
    || 79|| daridryadavadagdhanam cintashailanipiditam | amritambhodhivarshena shamayatyesha nishcitam
    || 80|| antakale'pi yah samyagekavaram smaredidam | na tasya bhramanam ghoram kintu brahmani liyate
    || 81|| gopaniyam prayatnena na deyam yasya kasyacit | bhaktaya shantacittaya gurubhaktiparaya ca
    || 82|| iti te kathitam divyam kavacam brahmadurlabham | devairapi sada gopyam yogisiddhanishevitam
    || 83|| iti shrikunjikadamaratantre bhagavannaradasamvade shriparabrahmakavacam sampurnam ||
  devanagari: ृणु नारद वक्ष्यामि रहस्यं परमाद्भुतम् । न प्रकाश्यं कदाचित् तदयोग्याय कर्हिचित् ॥ ३॥ निरञ्जनब्रह्मऋषिः
    प्रोक्तोऽनुष्टुप्छन्द उदाहृतः । देवता चित्शक्तिरूपं परब्रह्म परात्मनः ॥ ४॥ ब्रह्म बीजं परा माया शक्तिरित्यभिधीयते
    । भगवत्येव कीलं स्यात् सर्वगुह्यप्रबोधिनी ॥ ५॥ एतदन्तःसमालभ्य मन्त्रमौनपरायणः । जपेत् स्मरेद्वा ध्यायेद्वा
    कवचं सिद्धिदं परम् ॥ ६॥ प्रक्षाल्य पाणिपादौ च प्रशम्येन्द्रियपद्धतिम् । निर्विकल्पधिया धीमान् समासीतो
    जितेन्द्रियः ॥ ७॥ करन्यासं ततः कुर्यान्मौनबद्धेन्द्रियक्रमः । अङ्गन्यासं ततः पश्चाच्चिद्वह्निं हृदि
    भावयेत् ॥ ८॥ हृदि ब्रह्म शिरस्याद्यं शिखायां परमं न्यसेत् । कवचे चित्परां शक्तिं नेत्रयोर्भगवतीं न्यसेत्
    ॥ ९॥ अस्त्रत्वेन महाशान्तिं सर्वदिक्षु विसर्जयेत् । मुद्रया ब्रह्ममुद्राख्यां बद्ध्वा देहं समाचरेत्
    ॥ १०॥ ध्यायेदव्यक्तमत्यन्तं निर्वर्णं विश्वतोमुखम् । अनिर्देश्यं निराभासं चिद्घनं परमं महः ॥ ११॥ ततः
    कवचमारभ्य रक्षार्थं विनियोजयेत् । यथोक्तक्रमयोगेन नान्यथा सिद्धिदं भवेत् ॥ १२॥ ॐ परब्रह्म शिरः पातु
    परं धाम निरञ्जनम् । निर्लेपं निष्कलं नित्यं निर्भेदं ब्रह्म केवलम् ॥ १३॥ ललाटे लोकसाक्षित्वं लसदव्यक्तवैभवम्
    । अप्रमेयप्रकाशाख्यं परब्रह्मावताद् मम ॥ १४॥ भ्रुवोर्मध्ये परं ज्योतिरनिर्वाच्यं सनातनम् । निःस्पन्दामृतनिर्झरं
    मे पातु परमं पदम् ॥ १५॥ नेत्रे निर्व्यूहमव्यग्रं विश्वचक्षुः सनिर्मलम् । स्वयंसिद्धं परं ब्रह्म सर्वदर्शी
    सदावतु ॥ १६॥ कर्णौ श्रुतिशिरोगुह्यप्रणवोत्तरनिःस्वनम् । अनाहतान्तरालस्थं परब्रह्मावताद् मम ॥ १७॥ नासिकां
    नित्यनिर्मुक्तसर्वगन्धैककारणम् । सूक्ष्मातिसूक्ष्ममव्यक्तं परब्रह्मावताद् विभुः ॥ १८॥ मुखं मे मौननिर्देशं
    वाङ्मूलप्रभवालयम् । यद्वाचोऽपि निवर्तन्ते तत्परं मामवत्वजम् ॥ १९॥ जिह्वां चिन्मयवाग्गर्भं निगमागमगोचरम्
    । स्वयमुद्भासितं धाम परब्रह्मावताद् ध्रुवम् ॥ २०॥ दन्तान् कालक्षयच्छेदि निर्भिन्नग्रन्थिबन्धनम् ।
    अनादिनिधनं शान्तं परब्रह्मावताद् मम ॥ २१॥ चिबुकं चिद्गभीरार्थगूढमौनैकमन्दिरम् । अखण्डैकमहासारं परब्रह्मावताद्
    विभुः ॥ २२॥ कण्ठं कालान्तरच्छेत्तृ शब्दबीजविवर्जितम् । महागम्भीरनिःश्वासं परब्रह्मावताद् मम ॥ २३॥
    अंसौ मे विश्वविश्रान्तिनिर्धूतभुवनद्वयौ । सर्वाधारमचिन्त्यं तत्परब्रह्मावताद् दृढम् ॥ २४॥ भुजौ मे
    भूरिभावौघभञ्जनौ भव्यविक्रमौ । निर्वैरं निर्विकल्पं तत्परब्रह्मावताद् विभुः ॥ २५॥ करौ कर्मक्षयद्वारविमलज्ञानदीपकौ
    । असङ्गस्पर्शरहितं परब्रह्मावताद् मम ॥ २६॥ अङ्गुलीर्निगमाम्भोधिलहरीसूक्ष्मवृत्तयः । अचिन्त्यस्पन्दरहितं
    परब्रह्मावताद् विभुः ॥ २७॥ हृदये श्रीमती ललितादेवी परमकारुण्यविग्रहा । चिदानन्दैकनिलया सर्वमङ्गलदायिनी
    ॥ २८॥ नाभिं मे नित्यमव्यक्तनाभिनाभिप्रवर्तिनीम् । परब्रह्म परं धाम पातु विश्वैककारणम् ॥ २९॥ कटिं कालक्षयातीतं
    कल्पकल्पान्तराश्रयम् । निर्मर्यादं निराभासं परब्रह्मावताद् मम ॥ ३०॥ पृष्ठं मे पृष्ठतः पातु सर्वभारविवर्जितम्
    । अनन्तधाम निर्व्यूहं परब्रह्म सनातनम् ॥ ३१॥ पार्श्वयोः परमं तत्त्वं परच्छेदविवर्जितम् । निरुपाधिकमद्वैतं
    परब्रह्मावताद् विभुः ॥ ३२॥ गुह्यं गुह्यतमं पातु गुह्यागुह्यप्रकाशकम् । निगूढगूढनिर्लीनं परब्रह्म परात्परम्
    ॥ ३३॥ ऊरू मे ऊर्जितानन्तविश्वसंस्तम्भकारिणौ । स्वयंसिद्धं महाशान्तं परब्रह्मावताद् ध्रुवम् ॥ ३४॥ जानुनी
    जन्मनिर्मुक्तं जङ्घे जाड्यविदारणम् । निःशेषसंशयच्छेत्तृ परब्रह्मावताद् मम ॥ ३५॥ गुल्फौ गूढगतिं पातु
    गहनागमगोचरम् । अदृश्यगमनं दिव्यं परब्रह्म सनातनम् ॥ ३६॥ पादौ मे परमव्योमपर्यन्तपदविस्तृतौ । सर्वतीर्थमयं
    शान्तं परब्रह्मावताद् विभुः ॥ ३७॥ पादाङ्गुलीः पदातीतपदप्राप्तिप्रदीपिकाः । निरालम्बपदं दिव्यं परब्रह्मावताद्
    मम ॥ ३८॥ रोमाणि मे रहस्यौघरश्मिजालप्रकाशकः । अनिर्वचनीयसौन्दर्यं परब्रह्मावताद् विभुः ॥ ३९॥ त्वचं
    मे तत्त्वसंवीतां चिन्मरीचिमयीं सदा । असंस्पृष्टमलच्छायं परब्रह्मावताद् ध्रुवम् ॥ ४०॥ रक्तं मज्जास्थिमांसादीन्
    धातून् धामैकजीवितान् । अन्तर्बहिरविच्छिन्नं परब्रह्मावताद् मम ॥ ४१॥ प्राणानपानसमानोदानव्यानवायवः ।
    स्वसंविद्वेगसंयुक्ताः पान्तु ब्रह्म परात्परम् ॥ ४२॥ मनो बुद्धिरहङ्कारश्चित्तं चिद्घनसंश्रयम् । स्वप्रभासारमव्यग्रं
    परब्रह्मावताद् विभुः ॥ ४३॥ ज्ञानेन्द्रियाणि सर्वाणि कर्मेन्द्रियगणं तथा । स्वभावशुद्धिसम्पूर्णं परब्रह्मावताद्
    मम ॥ ४४॥ सूक्ष्मं कारणमव्यक्तं महदप्यखिलं वपुः । यदस्ति यन्न वा किञ्चित् तत्सर्वं पातु मे परम् ॥ ४५॥
    सर्वास्ववस्थासु सदा सर्वकालप्रवर्तिषु । परब्रह्म परं धाम मामव्यादव्ययात्मकम् ॥ ४६॥ प्राचीं मां पातु
    सर्वज्ञं प्रत्यचीं परमेश्वरम् । उदीचीं चिन्मयं धाम प्रतीचीं ब्रह्म केवलम् ॥ ४७॥ ऐशान्यां निर्विकल्पं
    मां आग्नेय्यां ज्ञानविग्रहम् । नैरृत्यां निर्भयं ब्रह्म वायव्यां व्योमनिर्मलम् ॥ ४८॥ ऊर्ध्वे व्योमातिगं
    पात्वधस्तादधरोत्तरम् । मध्ये मामव्ययं ब्रह्म सर्वतोऽव्याहतं विभुम् ॥ ४९॥ जाग्रति स्वप्नसंसारे सुषुप्तौ
    तुरीयके । तुरीयातीतनिर्लीनं परब्रह्मावतान्मम ॥ ५०॥ गच्छतो मे स्थितस्यापि धावतः शयनस्य च । भुञ्जानस्य
    जपस्यापि परब्रह्मावताद् विभुः ॥ ५१॥ रणे राजगृहे घोरे गिरिदुर्गमहावने । सिन्धुमध्ये महावर्ते परब्रह्मावतान्मम
    ॥ ५२॥ दावाग्नौ जलमध्ये च घोरवातप्रपीडिते । दुर्भिक्षे व्याधिसङ्घाते परब्रह्मावताद् विभुः ॥ ५३॥ भूतप्रेतपिशाचौघैर्यक्षरक्षोगणैरपि
    । अदृष्टदुर्ग्रहेभ्यश्च परब्रह्मावतान्मम ॥ ५४॥ मोहजालमहाघोरे संशयावर्तसङ्कटे । अविद्यातीव्रतिमिरे
    परब्रह्मावताद् विभुः ॥ ५५॥ कामक्रोधभयद्वेषलोभमात्सर्यसङ्कुले । मदमानमहारौद्रे परब्रह्मावतान्मम ॥ ५६॥
    विद्यावादविवादेषु मौनगर्भेषु चिन्तिषु । श्रुतिस्मृतिपुराणार्थे परब्रह्मावताद् विभुः ॥ ५७॥ योगध्यानसमाधीनां
    सूक्ष्ममार्गप्रवर्तिषु । नादबिन्दुलयातीते परब्रह्मावतान्मम ॥ ५८॥ कल्पक्षये महाघोरे सर्गारम्भे पुनः
    पुनः । अविकारं सदानित्यं परब्रह्मावताद् विभुः ॥ ५९॥ इदं कवचमत्युग्रं रहस्यं रहसामपि । धारयेद्यो हृदि
    प्राज्ञः स ब्रह्ममयतां व्रजेत् ॥ ६०॥ य इदं श्रद्धया नित्यं शुचिर्भूत्वा समाहितः । जपेद्धारयते वापि
    स मुक्तो नात्र संशयः ॥ ६१॥ न तस्य विघ्नसङ्घाता न ग्रहा न च दारुणाः । न दैवं न कृतं कर्म बाधितुं प्रभवन्ति
    हि ॥ ६२॥ न तं मृत्युर्भयं घोरं न कालस्य विकम्पनम् । न दुष्टदृष्टिर्न शापौघः स्प्रष्टुमर्हति कर्हिचित्
    ॥ ६३॥ यत्रायं लिखितो दिव्यः स्थाप्यते भक्तिभावतः । तद्देशः सर्वतीर्थानां सारभूत इव स्मृतः ॥ ६४॥ यत्रायं
    पूज्यते नित्यं श्रद्धाभक्तिसमन्वितः । तत्र देवगणाः सर्वे तिष्ठन्ति स्वयमेव हि ॥ ६५॥ पठनात्स्मरणादस्य
    धारणादर्चनादपि । अशेषपातकध्वंसः क्षणादेव प्रजायते ॥ ६६॥ अगम्यागमनं घोरमभक्ष्यस्यापि भक्षणम् । महापातकसङ्घातो
    विलयं यात्यसंशयम् ॥ ६७॥ अविद्यागहनच्छेदी विज्ञानामृतवर्षकः । हृदम्बुजे स्फुरेद्दीप्तः स्वयम्बोधदिवाकरः
    ॥ ६८॥ यं यं चिन्तयते कामं धर्मयुक्तं समाहितः । तं तं प्राप्नोति निःशेषं प्रसादात्परब्रह्मणः ॥ ६९॥
    अष्टसिद्धिर्नव निधयः सिद्धविद्याश्च कोटिशः । अनुगच्छन्ति तं नित्यं दासीभूता इव स्वयम् ॥ ७०॥ न तस्य
    दुर्लभं किञ्चिन्न त्रिषु लोकेषु विद्यते । यस्येदं हृदये नित्यं कवचं ब्रह्मरक्षितम् ॥ ७१॥ ब्रह्मा विष्णुर्महेशश्च
    लोकपालाश्च सर्वशः । तं दृष्ट्वा पूजयन्त्येव ब्रह्मभावसमन्वितम् ॥ ७२॥ श्रुतयः स्मृतयो वेदा आगमाः सकलास्तथा
    । स्वयमेव प्रकाशन्ते तस्य बुद्धौ निरन्तरम् ॥ ७३॥ न तस्य पुनरावृत्तिर्न जन्म न पुनर्भवः । यावद्देहस्थितिस्तावद्जीवन्मुक्तः
    स उच्यते ॥ ७४॥ देहान्ते परमे धाम्नि न प्रवेशो न निर्गमः । स्वरूपैक्यं परं शान्तं प्राप्नोत्येव निरामयम्
    ॥ ७५॥ एकलक्षपुरश्चर्या विधिरस्य स्मृतो बुधैः । दशांशहोमसंयुक्तस्तर्पणाभिषेकपूर्वकः ॥ ७६॥ तद्दशांशेन
    विप्रेभ्यो भोज्यं दद्यात्समाहितः । गुरवे दक्षिणां दद्याद्भक्त्या भावसमन्वितः ॥ ७७॥ सिद्धेऽस्मिन् कवचे
    दिव्ये न मन्त्रान्तरमिष्यते । न यन्त्रं न च होमाद्यं स्वयंसिद्धिप्रदं हि तत् ॥ ७८॥ यस्य प्रसादमात्रेण
    मूकः स्याद्वाग्विशारदः । जडो भवेद्बृहस्पतिसमो धीरः प्रबुद्धधीः ॥ ७९॥ दारिद्र्यदावदग्धानां चिन्ताशैलनिपीडिताम्
    । अमृताम्भोधिवर्षेण शमयत्येष निश्चितम् ॥ ८०॥ अन्तकालेऽपि यः सम्यगेकवारं स्मरेदिदम् । न तस्य भ्रमणं
    घोरं किन्तु ब्रह्मणि लीयते ॥ ८१॥ गोपनीयं प्रयत्नेन न देयं यस्य कस्यचित् । भक्ताय शान्तचित्ताय गुरुभक्तिपराय
    च ॥ ८२॥ इति ते कथितं दिव्यं कवचं ब्रह्मदुर्लभम् । देवैरपि सदा गोप्यं योगिसिद्धनिषेवितम् ॥ ८३॥ इति
    श्रीकुञ्जिकाडामरतन्त्रे भगवान्नारदसंवादे श्रीपरब्रह्मकवचं सम्पूर्णम् ॥
