id: go-suktam
category: stotram
name:
  english: Go Suktam
content:
  english: a gavo agmannuta bhadramakrantsidantu goshthe ranayantvasme | prajavatih pururupa iha syurindraya
    purvirushaso duhanah || indro yajvane prinate ca shikshatyupeddadati na sva mmashuyati | bhuyobhuyo
    rayimidasya vardhayannabhinne khilye ni dadhati devayum || na ta nashanti na dabhati taskaro nasamamitro
    vyathira dadhar shati | devamshca yabhiryajate dadati ca jyogittabhih sacate gopati na ta arva renukakato
    ashnute na samskritatramupa yanti ta abhi | urugayamabhaya ntasya ta anu gavo martasya vi caranti
    yajvanah || gavo bhago gava indro ma accha ssomasya prathamasya bhakshah | ima ya gava ssa janasa
    indra icchamiddhrida manasa cidindram || ncitkrinutha supratikam | bhadra nkrinutha bhadravaco brihadvo
    vaya ucyate sabhasu || ssuyavasam rishantih shuddha apa ssuprapane pibantih | ma vah stena ishata
    maghashamsah pari vo heti rudrasya vrijyah || upedamupaparcanamasu goshupa pricyatam | upa rishabhasya
    retasyupendra tava virye ||
  devanagari: आ गावो॑ अग्मन्नु॒त भ॒द्रम॑क्र॒न्त्सीद॑न्तु गो॒ष्ठे र॒णय॑न्त्व॒स्मे । प्र॒जाव॑तीः पुरु॒रुपा॑
    इ॒ह स्यु॒रिन्द्रा॑य पू॒र्वीरु॒षसो॒ दुहा॑नाः ॥ इन्द्रो॒ यज्व॑ने पृण॒ते च॑ शिक्ष॒त्युपेद्द॑दाति॒ न स्व
    म्मा॑षुयति । भूयो॑भूयो र॒यिमिद॑स्य व॒र्धय॒न्नभि॑न्ने खि॒ल्ये नि द॑धाति देव॒युम् ॥ न ता न॑शन्ति॒ न
    द॑भाति॒ तस्क॑रो॒ नासा॑मामि॒त्रो व्यथि॒रा द॑धर् षति । दे॒वांश्च॒ याभि॒र्यज॑ते॒ ददा॑ति च॒ ज्योगित्ताभिः॑
    सचते॒ गोप॑ति न ता अर्वा॑ रे॒णुक॑काटो अश्नुते॒ न सं॑स्कृत॒त्रमुप॑ यन्ति॒ ता अ॒भि । उ॒रु॒गा॒यमभ॑य॒ न्तस्य॒
    ता अनु॒ गावो॒ मर्त॑स्य॒ वि च॑रन्ति॒ यज्व॑नः ॥ गावो॒ भगो॒ गाव॒ इन्द्रो॑ म अच्छा॒ स्सोम॑स्य प्रथ॒मस्य॑
    भ॒क्षः । इ॒मा या गाव॒ स्स ज॑नास॒ इन्द्र॑ इ॒च्छामीद्धृ॒दा मन॑सा चि॒दिन्द्र॑म् ॥ ञ्चि॑त्कृणुथा सु॒प्रती॑कम्
    । भ॒द्र ङ्कृ॑णुथ भद्रवाचो बृ॒हद्वो॒ वय॑ उच्यते स॒भासु॑ ॥ स्सू॒यव॑सं रि॒शन्तीः॑ शु॒द्धा अ॒प स्सु॑प्रपा॒णे
    पिब॑न्तीः । मा वः॑ स्ते॒न ई॑शत॒ माघशं॑सः॒ परि॑ वो हे॒ति रु॒द्रस्य॑ वृज्याः ॥ उपे॒दमु॑प॒पर्च॑नमा॒सु
    गोषूप॑ पृच्यताम् । उप॑ ऋष॒भस्य॒ रेत॒स्युपे॑न्द्र॒ तव॑ वी॒र्ये॑ ॥
