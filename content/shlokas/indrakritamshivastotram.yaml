id: indrakritamshivastotram
category: stotram
name:
  english: indrakritamshivastotram
  devanagari: इन्द्रकृतंशिवस्तोत्रम्
content:
  english: indrakritam shivastotram indra uvaca | svamayaya yo hyakhilam caracaram srijatyavatyatti na
    sajjate'smin | ekah svatantro'dvayacitsukhatmakah sa nah prasanno'stu pinakapanih || 68|| na yasya
    tattvam sanakadayo'pi jananti vedantarahasyavijnah | sa parvatishah sakalabhilashadata prasanno'stu
    mamandhakarih || 69|| srishtva svayambhurbhagavanvirincih bhayankaram casya shiro'nvapashyat | chittva
    nakhagrairnakhasaktametaccikshepa tasmadabhavattrivargah || 70|| papam daridram tvatha lobhayacne
    moho vipaccheti tato'pyanantam | jataprabhavam bhavaduhkharupam babhuva tairvyaptamidam samastam ||
    71|| avekshya sarvam cakitah suresho devimavocajjagadastameti | tvam pahi lokeshvari lokamatarume
    sharanye subhage subhadre || 72|| jagatpratishthe varade jaya tvam bhuktih samadhih parama ca muktih
    | svaha svadha svastiranadisiddhirgirbuddhirasirajaramare tvam || 73|| vidyadirupena jagattraye tvam
    raksham karoshyeva madajnaya ca | tvayaiva srishtam bhuvanatrayam syadyatah prakrityaiva tathaiva
    citram || 74|| ityevamukta dayita harena samshleshasamlapapara babhuva | shranta bhavasyardhatanau
    sulagna cikshepa ca svedajalam karagraih || 75|| tasmadbabhuva prathamam sa dharmo lakshmiratho danamatho
    suvrishtih | sattvam susampannadharam saramsi dhanyani pushpani phalani caiva || 76|| saubhagyavastuni
    vapuh suveshah sha
  devanagari: इन्द्रकृतं शिवस्तोत्रम् इन्द्र उवाच । स्वमायया यो ह्यखिलं चराचरं सृजत्यवत्यत्ति न सज्जतेऽस्मिन्
    । एकः स्वतन्त्रोऽद्वयचित्सुखात्मकः स नः प्रसन्नोऽस्तु पिनाकपाणिः ॥ ६८॥ न यस्य तत्त्वं सनकादयोऽपि जानन्ति
    वेदान्तरहस्यविज्ञाः । स पार्वतीशः सकलाभिलाषदाता प्रसन्नोऽस्तु ममान्धकारिः ॥ ६९॥ सृष्ट्वा स्वयम्भूर्भगवान्विरिञ्चिः
    भयङ्करं चास्य शिरोऽन्वपश्यत् । छित्त्वा नखाग्रैर्नखसक्तमेतच्चिक्षेप तस्मादभवत्त्रिवर्गः ॥ ७०॥ पापं
    दरिद्रं त्वथ लोभयाच्ञे मोहो विपच्छेति ततोऽप्यनन्तम् । जातप्रभावं भवदुःखरूपं बभूव तैर्व्याप्तमिदं समस्तम्
    ॥ ७१॥ अवेक्ष्य सर्वं चकितः सुरेशो देवीमवोचज्जगदस्तमेति । त्वं पाहि लोकेश्वरि लोकमातरुमे शरण्ये सुभगे
    सुभद्रे ॥ ७२॥ जगत्प्रतिष्ठे वरदे जय त्वं भुक्तिः समाधिः परमा च मुक्तिः । स्वाहा स्वधा स्वस्तिरनादिसिद्धिर्गीर्बुद्धिरासीरजरामरे
    त्वम् ॥ ७३॥ विद्यादिरूपेण जगत्त्रये त्वं रक्षां करोष्येव मदाज्ञया च । त्वयैव सृष्टं भुवनत्रयं स्याद्यतः
    प्रकृत्यैव तथैव चित्रम् ॥ ७४॥ इत्येवमुक्ता दयिता हरेण संश्लेषसंलापपरा बभूव । श्रान्ता भवस्यार्धतनौ
    सुलग्ना चिक्षेप च स्वेदजलं कराग्रैः ॥ ७५॥ तस्माद्बभूव प्रथमं स धर्मो लक्ष्मीरथो दानमथो सुवृष्टिः ।
    सत्त्वं सुसम्पन्नधरं सरांसि धान्यानि पुष्पाणि फलानि चैव ॥ ७६॥ सौभाग्यवस्तूनि वपुः सुवेषः श
