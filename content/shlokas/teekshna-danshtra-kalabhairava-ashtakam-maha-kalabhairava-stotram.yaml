id: teekshna-danshtra-kalabhairava-ashtakam-maha-kalabhairava-stotram
category: stotram
name:
  english: Teekshna Danshtra Kalabhairava Ashtakam (Maha Kalabhairava Stotram)
content:
  english: yam yam yam yaksharupam dashadishividitam bhumikampayamanam sam sam samharamurtim shiramukutajata
    shekharam candrabimbam | dam dam dam dirghakayam vikritanakhamukham cordhvaromam karalam pam pam pam
    papanasham pranamata satatam bhairavam kshetrapalam || || ram ram ram raktavarnam katikatitatanum
    tikshnadamshtrakaralam gham gham gham ghosha ghosham ghaghaghagha ghatitam gharjaram ghoranadam |
    kam kam kam kalapasham dhrika dhrika dhrikitam jvalitam kamadaham tam tam tam divyadeham pranamata
    satatam bhairavam kshetrapalam || || lam lam lam lam vadantam lalalala lalitam dirghajihva karalam
    dhum dhum dhum dhumravarnam sphutavikatamukham bhaskaram bhimarupam | rum rum rum rundamalam ravitamaniyatam
    tamranetram karalam nam nam nam nagnabhusham pranamata satatam bhairavam kshetrapalam || || vam vam
    vam vayuvegam natajanasadayam brahmasaram parantam kham kham kham khadgahastam tribhuvanavilayam bhaskaram
    bhimarupam | cam cam cam calitva'cala cala calitaccalitam bhumicakram mam mam mam mayirupam pranamata
    satatam bhairavam kshetrapalam || || sham sham sham shankhahastam shashikaradhavalam moksha sampurna
    tejam mam mam mam mam mahantam kulamakulakulam mantraguptam sunityam | yam yam yam bhutanatham kilikilikilitam
    balakelipradhanam am am am antariksham pranamata satatam bhairavam kshetrapalam || || kham kham kham
    khadgabhedam vishamamritamayam kalakalam karalam ksham ksham ksham kshipravegam dahadahadahanam taptasandipyamanam
    | haum haum haunkaranadam prakatitagahanam garjitairbhumikampam vam vam vam balalilam pranamata satatam
    bhairavam kshetrapalam || || sam sam sam siddhiyogam sakalagunamakham devadevam prasannam pam pam
    pam padmanabham hariharamayanam candrasuryagninetram | aim aim aim aishvaryanatham satatabhayaharam
    purvadevasvarupam raum raum raum raudrarupam pranamata satatam bhairavam kshetrapalam || || ham ham
    ham hamsayanam hasitakalahakam muktayogattahasam nam nam nam netrarupam shiramukutajatabandhabandhagrahastam
    | tam tam tam tankaranadam tridashalatalatam kamagarvapaharam bhum bhum bhum bhutanatham pranamata
    satatam bhairavam kshetrapalam || || ityevam kamayuktam prapathati niyatam bhairavasyashtakam yo nirvighnam
    duhkhanasham surabhayaharanam dakinishakininam | nashyeddhi vyaghrasarpau hutavaha salile rajyashamsasya
    shunyam sarva nashyanti duram vipada iti bhrisham cintanatsarvasiddhim || || bhairavasyashtakamidam
    shanmasam yah pathennarah sa yati paramam sthanam yatra devo maheshvarah || || sindurarunagatram ca
    sarvajanmavinirmitam | mukutagryadharam devam bhairavam pranamamyaham || || namo bhutanatham namo
    pretanatham namah kalakalam namah rudramalam | namah kalikapremalolam karalam namo bhairavam kashikakshetrapalam
    || iti tikshnadamshtra kalabhairavashtakam ||
  devanagari: यं यं यं यक्षरूपं दशदिशिविदितं भूमिकम्पायमानं सं सं संहारमूर्तिं शिरमुकुटजटा शेखरं चन्द्रबिम्बम्
    । दं दं दं दीर्घकायं विकृतनखमुखं चोर्ध्वरोमं करालं पं पं पं पापनाशं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ रं रं रं रक्तवर्णं कटिकटिततनुं तीक्ष्णदंष्ट्राकरालं घं घं घं घोष घोषं घघघघ घटितं घर्जरं घोरनादम्
    । कं कं कं कालपाशं धृक धृक धृकितं ज्वालितं कामदाहं तं तं तं दिव्यदेहं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ लं लं लं लं वदन्तं लललल ललितं दीर्घजिह्वा करालं धूं धूं धूं धूम्रवर्णं स्फुटविकटमुखं भास्करं भीमरूपम्
    । रुं रुं रुं रुण्डमालं रवितमनियतं ताम्रनेत्रं करालं नं नं नं नग्नभूषं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ वं वं वं वायुवेगं नतजनसदयं ब्रह्मसारं परन्तं खं खं खं खड्गहस्तं त्रिभुवनविलयं भास्करं भीमरूपम्
    । चं चं चं चलित्वाऽचल चल चलिताच्चालितं भूमिचक्रं मं मं मं मायिरूपं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ शं शं शं शङ्खहस्तं शशिकरधवलं मोक्ष सम्पूर्ण तेजं मं मं मं मं महान्तं कुलमकुलकुलं मन्त्रगुप्तं
    सुनित्यम् । यं यं यं भूतनाथं किलिकिलिकिलितं बालकेलिप्रधानं अं अं अं अन्तरिक्षं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ खं खं खं खड्गभेदं विषममृतमयं कालकालं करालं क्षं क्षं क्षं क्षिप्रवेगं दहदहदहनं तप्तसन्दीप्यमानम्
    । हौं हौं हौङ्कारनादं प्रकटितगहनं गर्जितैर्भूमिकम्पं वं वं वं बाललीलं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ सं सं सं सिद्धियोगं सकलगुणमखं देवदेवं प्रसन्नं पं पं पं पद्मनाभं हरिहरमयनं चन्द्रसूर्याग्निनेत्रम्
    । ऐं ऐं ऐं ऐश्वर्यनाथं सततभयहरं पूर्वदेवस्वरूपं रौं रौं रौं रौद्ररूपं प्रणमत सततं भैरवं क्षेत्रपालम्
    ॥ ॥ हं हं हं हंसयानं हसितकलहकं मुक्तयोगाट्टहासं नं नं नं नेत्ररूपं शिरमुकुटजटाबन्धबन्धाग्रहस्तम् ।
    टं टं टं टङ्कारनादं त्रिदशलटलटं कामगर्वापहारं भुं भुं भुं भूतनाथं प्रणमत सततं भैरवं क्षेत्रपालम् ॥
    ॥ इत्येवं कामयुक्तं प्रपठति नियतं भैरवस्याष्टकं यो निर्विघ्नं दुःखनाशं सुरभयहरणं डाकिनीशाकिनीनाम्
    । नश्येद्धि व्याघ्रसर्पौ हुतवह सलिले राज्यशंसस्य शून्यं सर्वा नश्यन्ति दूरं विपद इति भृशं चिन्तनात्सर्वसिद्धिम्
    ॥ ॥ भैरवस्याष्टकमिदं षाण्मासं यः पठेन्नरः स याति परमं स्थानं यत्र देवो महेश्वरः ॥ ॥ सिन्दूरारुणगात्रं
    च सर्वजन्मविनिर्मितम् । मुकुटाग्र्यधरं देवं भैरवं प्रणमाम्यहम् ॥ ॥ नमो भूतनाथं नमो प्रेतनाथं नमः कालकालं
    नमः रुद्रमालम् । नमः कालिकाप्रेमलोलं करालं नमो भैरवं काशिकाक्षेत्रपालम् ॥ इति तीक्ष्णदंष्ट्र कालभैरवाष्टकम्
    ॥
