    namah om tripurasudanaya namah | | om ambudaranilaya namah om sdhanave namah om anandakandaya namah
    om sarveshvaraya namah om govindaya namah om bhuteshaya namah om gopalaya namah om gangadharaya namah
    om canuramardanaya namah om candikeshaya namah | | om kamsapranashanaya namah om karpuragauraya namah
    om gopipataye namah om shankaraya namah om pitavasanaya namah om girishaya namah om govardhanoddharanaya
    namah om balamriganka varnaya namah om mathavaya namah om bhavaya namah | | om vasudevaya namah om
    vishamekshanaya namah om muraraye namah om vrishabhadhvajaya namah om hrishikapataye namah om bhutapataye
    namah om shauraye namah om phalanetraya namah om krishnaya namah om haraya namah | | om garudadhvajaya
    namah om kritivasanaya namah om kalmasharaye namah om gauripataye namah om kamaraya namah om shuline
    namah om haraye namah om rajanishakalavantasaya namah om rameshvaraya namah om pinakapanaye namah
    | | om shriramaya namah om bhargaya namah om aniruddhaya namah om shulapanaye namah om nrisimhaya
    namah om tripathagardrajatakalapaya namah om muraharaya namah om ishaya namah om raghavaya namah om
    uragabharanaya namah | | om padmanabhaya namah om ugraya namah om madhusudanaya namah om pinakapataye
    namah om yadave namah om pramadhadinathaya namah om narayanaya namah om mrityunjayaya namah om purushottamaya
    namah om tridashaikanathaya namah | | om acyutaya namah om kamashatrave namah om abjapanaye namah
    om digvasanaya namah om cakrapanaye namah om bhuteshaya namah om brahmanyadevaya namah om sharvaya
    namah om mukundaya namah om vishveshvaraya namah | | om sanatanaya namah om trinetraya namah om ravanaraye
    namah om shrikanthaya namah om dharmadhurinaya namah om shambhave namah om kamaladhishaya namah om
    ishanaya namah om yadupataye namah om mridaya namah | | om dharanidharaya namah om andhakaharaya namah
    om sharjgapanaye namah om puraraye namah om vishnave namah om nilakanthaya namah om vaikunthaya namah
    om devadevaya namah om madhuripave namah om trilocanaya namah | | om kaitabharipave namah om candra
    cudaya namah om keshinashaya namah om girishaya namah om lakshmi pataye namah om tripuraraye namah
    om vasudeva sunave namah om tryakshaya namah | | iti shri shivakeshava ashtottara shatanamavali
