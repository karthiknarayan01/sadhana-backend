id: manobodhah
category: stotram
name:
  english: manobodhah
  devanagari: मनोबोधः
content:
  english: ncha dhanadau || 65|| asaro'sti samsara esho'tighoro manah sajjananveshaya tvam hi satyam |
    visham bhakshitam cet sukham te kutah syad ato ramacandram sada cintaya tvam || 66|| ghanashyamavarno'tilavanyayukto
    gabhiro'tidhirah pratapena purnah | svabhaktasya yah samkate pakshapati sa ramah prabhate hrida cintaniyah
    || 67|| balenadhiko raghavascapapanih karalastu kalo'pi tasmad bibheti | katha kaiva martyasya rankasya
    tatra prabhate hrida raghavashcintaniyah || 68|| sukhanandakrid varako yo bhayasya sa hi pritiyogena
    sevyo jagatyam | vivekadanacarabuddhim visrijya prabhate hrida raghavashcintaniyah || 69|| manah kirtaya
    tvam harim kamapuram na vai badhyase duhkhajalaih kadapi | madalasyamashu tvaya sampraheyam prabhate
    hrida raghavashcintaniyah || 70|| mahadoshanasho'sti yatkirtanena narah sadgatim yati yatkirtanena
    | bhavet punyavriddhishca yatkirtanena sa ramah prabhate hrida cintaniyah || 71|| bhavenna vyayah
    sviyavittasya kimcit tatoccarane ramanamno na kashtam | kshayo jayate yena samsarashatroh sa ramah
    prabhate hrida cintaniyah || 72|| mahad duhkhamutpadyate dehadandat param namasamkirtane naiva duhkham
    | shivashcintayatyeva yam devadevam sa ramah prabhate hrida cintaniyah || 73|| tapahpurvake sadhane
    dehakashtam dhanenaiva danam vratodyapanam ca | kripaluh sada dinajiveshu yo'sau prabhate hrida raghavashcintaniyah
    || 74|| manah sadhaneshvetadeva prashastam na cenmanyase sadhubhirnishcinu tvam | vritha samshayastyajya
    evantakari prabhate hrida raghavashcintaniyah || 75|| bhavennaiva yogo na dharmo na karma na bhogo
    na ca tyaga eko'pi sangah | mano namasamkirtane shraddadhasva prabhate hrida raghavashcintaniyah ||
    76|| harernama samkirtane shraddadhano bhaved dvandvashunyojapan ramanama | hareh karma kurvan bhavishyatyakamo
    svarupam ca sarvatra pashyet tadanim || 77|| aho yasya rame na vishvastabuddhih bhavet pamarah sarvada
    duhkhabhak sah | sthite kintu kaivalyade ramacandre vritha dehasamsaracinta'lpabuddheh || 78|| manah
    pavanam bhavanam raghavasya nidhehyantare ma'stu samsaracinta | bhavo bhramayatyeva jivam sadaiva
    asadvastusamdharanam vyarthameva || 79|| manah samshraya shrishamishasya hritstham taradyaiva dushparasamsaravardhim
    | praheyastvaya durbharah kama eshah kharo matsarah sarvatha dandya eva || 80|| mano matsarat ma tyaja
    shrishanama nididhyasa esho'stvativadarat te | mano ramanamottamam sadhanam re na caitasya tulyam
    kimapyasti loke || 81|| bahunyanyanamani tulyani nasyeti abhagyanna janatyayam pamaro'nẏah | idam
    parvatishena buddham vishaghnam katha manavasyatra ka kimkarasya || 82|| smararih sada dhyayatisham
    hi ramam umasamyuto gayati premabaddhah | dridhanẏanavairagyasamarthyayuktah sada''ste sukham ramavishvasapurnah
    || 83|| shirahsamsthito yah prabhurviththalasya shivah so'pi taddhyanamagno na kim tvam | yato nilakantho'pi
    shantim prapede sa ramah kritantannaram mocayed vai || 84|| bhajed raghavam yogivishrantihetum japatyasya
    namani gaurya maheshah | tapasvi svayam shamkarah shanta asid bhavenmuktido'nte hyasau rama ekah ||
    85|| mukhe yasya ramah sukham tasya nityam sadanandarupe nimagnah sa aste | vina ramamanyatra samdehakhedau
    nijam dhama namaiva shokapahari || 86|| mukhe yasya ramo na kamo'sti citte na taddhairyalopo bhavet
    samkateshu | harerbhaktiyogena kamam vijitya sa dhanyo'bhavad marutibrahmacari || 87|| ativottamam
    sundaram svalpavarnam amulyam sulabhyam hitam ramanama | janaih kirtyamanam bhavadhvamsakam yat tadeveha
    kaivalyarupam naranam || 88|| sada bhojanadau vaded ramanama tato bhojane sadaram ghoshaniyam | pratigrasamevam
    vadennama punyam tada prapyate shriharih sa svabhavat || 89|| sada namahinasya ghora'sti hanih na
    yasyadaro namni tajjanma tuccham | harernama vedeshu shastreshu shreya skaramvai param khyapitam vyasavanya
    || 90|| mano ramacandre na karya upeksha harernama samkirtayedadarena | na kimcidvyayah kirtane ramanamnah
    tato ghoshayejjanakishasya nama || 91|| sasatkaramudghoshite ramaname suduram svahritsthashca doshah
    prayanti | haristishthati prita akarnya kirtim atah shrishivo ramanamaikatandrah || 92|| prabhuryo'nnadah
    svairamakitakebhyah sada hridgata yasya cinta jananam | sulabhye'pi tannamasamkirtane te mano hiyate
    kim nu tanme vadashu || 93|| trilokividahe kshamo yo'sti rushtah sa ishah shamam prapa yatkirtanena
    | japatyadaradyat shiva vishvamata tadeveha sarvairjanai
  devanagari: ण्छा धनादौ ॥ ६५॥ असारोऽस्ति संसार एषोऽतिघोरो मनः सज्जनान्वेषय त्वं हि सत्यम् । विषं भक्षितं
    चेत् सुखं ते कुतः स्याद् अतो रामचन्द्रं सदा चिन्तय त्वम् ॥ ६६॥ घनश्यामवर्णोऽतिलावण्ययुक्तो गभीरोऽतिधीरः
    प्रतापेन पूर्णः । स्वभक्तस्य यः संकटे पक्षपाती स रामः प्रभाते हृदा चिन्तनीयः ॥ ६७॥ बलेनाधिको राघवस्चापपाणिः
    करालस्तु कालोऽपि तस्माद् बिभेति । कथा कैव मर्त्यस्य रङ्कस्य तत्र प्रभाते हृदा राघवश्चिन्तनीयः ॥ ६८॥
    सुखानन्दकृद् वारको यो भयस्य स हि प्रीतियोगेन सेव्यो जगत्याम् । विवेकादनाचारबुद्धिं विसृज्य प्रभाते
    हृदा राघवश्चिन्तनीयः ॥ ६९॥ मनः कीर्तय त्वं हरिं कामपूरं न वै बाध्यसे दुःखजालैः कदापि । मदालस्यमाशु
    त्वया संप्रहेयं प्रभाते हृदा राघवश्चिन्तनीयः ॥ ७०॥ महादोषनाशोऽस्ति यत्कीर्तनेन नरः सद्गतिं याति यत्कीर्तनेन
    । भवेत् पुण्यवृद्धिश्च यत्कीर्तनेन स रामः प्रभाते हृदा चिन्तनीयः ॥ ७१॥ भवेन्न व्ययः स्वीयवित्तस्य
    किंचित् ततोच्चारणे रामनाम्नो न कष्टम् । क्षयो जायते येन संसारशत्रोः स रामः प्रभाते हृदा चिन्तनीयः
    ॥ ७२॥ महद् दुःखमुत्पद्यते देहदण्डात् परं नामसंकीर्तने नैव दुःखम् । शिवश्चिन्तयत्येव यं देवदेवं स रामः
    प्रभाते हृदा चिन्तनीयः ॥ ७३॥ तपःपूर्वके साधने देहकष्टं धनेनैव दानं व्रतोद्यापनं च । कृपालुः सदा दीनजीवेषु
    योऽसौ प्रभाते हृदा राघवश्चिन्तनीयः ॥ ७४॥ मनः साधनेष्वेतदेव प्रशस्तं न चेन्मन्यसे साधुभिर्निश्चिनु
    त्वम् । वृथा संशयस्त्याज्य एवान्तकारी प्रभाते हृदा राघवश्चिन्तनीयः ॥ ७५॥ भवेन्नैव योगो न धर्मो न कर्म
    न भोगो न च त्याग एकोऽपि साङ्गः । मनो नामसंकीर्तने श्रद्दधस्व प्रभाते हृदा राघवश्चिन्तनीयः ॥ ७६॥ हरेर्नाम
    संकीर्तने श्रद्दधानो भवेद् द्वन्द्वशून्योजपन् रामनाम । हरेः कर्म कुर्वन् भविष्यत्यकामो स्वरूपं च सर्वत्र
    पश्येत् तदानीम् ॥ ७७॥ अहो यस्य रामे न विश्वस्तबुद्धिः भवेत् पामरः सर्वदा दुःखभाक् सः । स्थिते किन्तु
    कैवल्यदे रामचन्द्रे वृथा देहसंसारचिन्ताऽल्पबुद्धेः ॥ ७८॥ मनः पावनां भावनां राघवस्य निधेह्यन्तरे माऽस्तु
    संसारचिन्ता । भवो भ्रामयत्येव जीवं सदैव असद्वस्तुसंधारणं व्यर्थमेव ॥ ७९॥ मनः संश्रय श्रीशमीशस्य हृत्स्थं
    तराद्यैव दुष्पारसंसारवार्धिम् । प्रहेयस्त्वया दुर्भरः काम एषः खरो मत्सरः सर्वथा दण्ड्य एव ॥ ८०॥ मनो
    मत्सरात् मा त्यज श्रीशनाम निदिध्यास एषोऽस्त्वतीवादरात् ते । मनो रामनामोत्तमं साधनं रे न चैतस्य तुल्यं
    किमप्यस्ति लोके ॥ ८१॥ बहून्यन्यनामानि तुल्यानि नास्येति अभाग्यान्न जानात्ययं पामरोऽङ्य़ः । इदं पार्वतीशेन
    बुद्धं विषघ्नं कथा मानवस्यात्र का किंकरस्य ॥ ८२॥ स्मरारीः सदा ध्यायतीशं हि रामं उमासंयुतो गायति प्रेमबद्धः
    । दृढङ्य़ानवैराग्यसामर्थ्ययुक्तः सदाऽऽस्ते सुखं रामविश्वासपूर्णः ॥ ८३॥ शिरःसंस्थितो यः प्रभुर्विठ्ठलस्य
    शिवः सोऽपि तद्ध्यानमग्नो न किं त्वम् । यतो नीलकण्ठोऽपि शान्तिं प्रपेदे स रामः कृतान्तान्नरं मोचयेद्
    वै ॥ ८४॥ भजेद् राघवं योगिविश्रान्तिहेतुं जपत्यस्य नामानि गौर्या महेशः । तपस्वी स्वयं शंकरः शान्त आसीद्
    भवेन्मुक्तिदोऽन्ते ह्यसौ राम एकः ॥ ८५॥ मुखे यस्य रामः सुखं तस्य नित्यं सदानन्दरूपे निमग्नः स आस्ते
    । विना राममन्यत्र संदेहखेदौ निजं धाम नामैव शोकापहारि ॥ ८६॥ मुखे यस्य रामो न कामोऽस्ति चित्ते न तद्धैर्यलोपो
    भवेत् संकटेषु । हरेर्भक्तियोगेन कामं विजित्य स धन्योऽभवद् मारुतिब्रह्मचारी ॥ ८७॥ अतीवोत्तमं सुन्दरं
    स्वल्पवर्णं अमूल्यं सुलभ्यं हितं रामनाम । जनैः कीर्त्यमानं भवध्वंसकं यत् तदेवेह कैवल्यरूपं नराणाम्
    ॥ ८८॥ सदा भोजनादौ वदेद् रामनाम ततो भोजने सादरं घोषणीयम् । प्रतिग्रासमेवं वदेन्नाम पुण्यं तदा प्राप्यते
    श्रीहरिः स स्वभावात् ॥ ८९॥ सदा नामहीनस्य घोराऽस्ति हानिः न यस्यादरो नाम्नि तज्जन्म तुच्छम् । हरेर्नाम
    वेदेषु शास्त्रेषु श्रेय स्करंवै परं ख्यापितं व्यासवाण्या ॥ ९०॥ मनो रामचन्द्रे न कार्या उपेक्षा हरेर्नाम
    संकीर्तयेदादरेण । न किंचिद्व्ययः कीर्तने रामनाम्नः ततो घोषयेज्जानकीशस्य नाम ॥ ९१॥ ससत्कारमुद्घोषिते
    रामनामे सुदूरं स्वहृत्स्थाश्च दोषाः प्रयान्ति । हरिस्तिष्ठति प्रीत आकर्ण्य कीर्तिं अतः श्रीशिवो रामनामैकतन्द्रः
    ॥ ९२॥ प्रभुर्योऽन्नदः स्वैरमाकीटकेभ्यः सदा हृद्गता यस्य चिन्ता जनानाम् । सुलभ्येऽपि तन्नामसंकीर्तने
    ते मनो हीयते किं नु तन्मे वदाशु ॥ ९३॥ त्रिलोकीविदाहे क्षमो योऽस्ति रुष्टः स ईशः शमं प्राप यत्कीर्तनेन
    । जपत्यादराद्यत् शिवा विश्वमाता तदेवेह सर्वैर्जनै
