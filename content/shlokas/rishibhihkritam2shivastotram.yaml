id: rishibhihkritam2shivastotram
category: stotram
name:
  english: rishibhihkritam2shivastotram
  devanagari: ऋषिभिःकृतं२शिवस्तोत्रम्
content:
  english: rishibhih kritam 2 shivastotram rishaya ucuh | namah shivaya rudraya kadrudraya pracetase |
    midhushtamaya sarvaya shipivishtaya ramhase || 27|| prabhute vimale sare hyadhare parame sukhe | navashaktya''vritam
    devam padmastham bhaskaram prabhum || 28|| adityam bhaskaram bhanum ravim devam divakaram | umam prabham
    tatha prajnam sandhyam savitrikamapi || 29|| vistaramuttaram devim bodhanim pranamamyaham | apyayanim
    ca varadam brahmanam keshavam haram || 30|| somadivrindam ca yathakramena sampujya mantrairvihitakramena
    | smarami devam ravimandalastham sadashivam shankaramadidevam || 31|| indradidevamshca tatheshvaramshca
    narayanam padmajamadidevam | pragadyadhordhvam ca yathakramena vajradipadmam ca tatha smarami || 32||
    sinduravarnaya samandalaya suvarnavajrabharanaya tubhyam | padmabhanetraya sapankajaya brahmendranarayanakaranaya
    || 33|| ratham ca saptashvamanuruviram ganam tatha saptavidham kramena | ritupravahena ca valakhilyansmarami
    mandehaganakshayam ca || 34|| hutva tiladyairvividhaistathagnau punah samapyaiva tathaiva sarvam |
    udvasya hritpankajamadhyasamstham smarami bimbam tava devadeva || 35|| smarami bimbani yathakramena
    raktani padmamalalocanani | padmam ca savye varadam ca vame kare tatha bhushitabhushanani || 36||
    damshtrakaralam tava divyavaktram vidyutprabham daityabhayankaram ca | smarami rakshabhiratam dvijanam
    mandeharakshoganabhartsanam ca || 37|| somam sitam bhumijamagnivarnam camikarabham budhamindusunum
    | brihaspatim kancanasannikasham shukram sitam krishnataram ca mandam || 38|| smarami savyamabhayam
    vamamurugatam varam | sarvesham mandaparyantam mahadevam ca bhaskaram || 39|| purnenduvarnena ca pushpagandhaprasthena
    toyane shubhena purnam | patram dridham tamramayam prakalpya dasye tavardhyam bhagavanprasida || 40||
    namah shivaya devaya ishvaraya kapardine | rudraya vishnave tubhyam brahmane suryamurtaye || 41||
    suta uvaca | yah shivam mandalam devam sampujyaivam samahitah | pratarmadhyahnasayahne pathetstavamanuttamam
    || 42|| ittham shivena sayujyam labhate natra samshayah || 43|| iti shrilingamahapurane uttarabhage
    ekonavimshadhyayantargatam rishibhih kritam shivastotram samaptam | lingapurana | uttarabhaga | adhyaya
    19
  devanagari: ऋषिभिः कृतं २ शिवस्तोत्रम् ऋषय ऊचुः । नमः शिवाय रुद्राय कद्रुद्राय प्रचेतसे । मीढुष्टमाय
    सर्वाय शिपिविष्टाय रंहसे ॥ २७॥ प्रभूते विमले सारे ह्याधारे परमे सुखे । नवशक्त्याऽऽवृतं देवं पद्मस्थं
    भास्करं प्रभुम् ॥ २८॥ आदित्यं भास्करं भानुं रविं देवं दिवाकरम् । उमां प्रभां तथा प्रज्ञां सन्ध्यां
    सावित्रिकामपि ॥ २९॥ विस्तारामुत्तरां देवीं बोधनीं प्रणमाम्यहम् । आप्यायनीं च वरदां ब्रह्माणं केशवं
    हरम् ॥ ३०॥ सोमादिवृन्दं च यथाक्रमेण सम्पूज्य मन्त्रैर्विहितक्रमेण । स्मरामि देवं रविमण्डलस्थं सदाशिवं
    शङ्करमादिदेवम् ॥ ३१॥ इन्द्रादिदेवांश्च तथेश्वरांश्च नारायणं पद्मजमादिदेवम् । प्रागाद्यधोर्ध्वं च यथाक्रमेण
    वज्रादिपद्मं च तथा स्मरामि ॥ ३२॥ सिन्दूरवर्णाय समण्डलाय सुवर्णवज्राभरणाय तुभ्यम् । पद्माभनेत्राय सपङ्कजाय
    ब्रह्मेन्द्रनारायणकारणाय ॥ ३३॥ रथं च सप्ताश्वमनूरुवीरं गणं तथा सप्तविधं क्रमेण । ऋतुप्रवाहेण च वालखिल्यान्स्मरामि
    मन्देहगणक्षयं च ॥ ३४॥ हुत्वा तिलाद्यैर्विविधैस्तथाग्नौ पुनः समाप्यैव तथैव सर्वम् । उद्वास्य हृत्पङ्कजमध्यसंस्थं
    स्मरामि बिम्बं तव देवदेव ॥ ३५॥ स्मरामि बिम्बानि यथाक्रमेण रक्तानि पद्मामललोचनानि । पद्मं च सव्ये वरदं
    च वामे करे तथा भूषितभूषणानि ॥ ३६॥ दंष्ट्राकरालं तव दिव्यवक्त्रं विद्युत्प्रभं दैत्यभयङ्करं च । स्मरामि
    रक्षाभिरतं द्विजानां मन्देहरक्षोगणभर्त्सनं च ॥ ३७॥ सोमं सितं भूमिजमग्निवर्णं चामीकराभं बुधमिन्दुसूनुम्
    । बृहस्पतिं काञ्चनसन्निकाशं शुक्रं सितं कृष्णतरं च मन्दम् ॥ ३८॥ स्मरामि सव्यमभयं वाममूरुगतं वरम् ।
    सर्वेषां मन्दपर्यन्तं महादेवं च भास्करम् ॥ ३९॥ पूर्णेन्दुवर्णेन च पुष्पगन्धप्रस्थेन तोयने शुभेन पूर्णम्
    । पात्रं दृढं ताम्रमयं प्रकल्प्य दास्ये तवार्ध्यं भगवन्प्रसीद ॥ ४०॥ नमः शिवाय देवाय ईश्वराय कपर्दिने
    । रुद्राय विष्णवे तुभ्यं ब्रह्मणे सूर्यमूर्तये ॥ ४१॥ सूत उवाच । यः शिवं मण्डलं देवं सम्पूज्यैवं समाहितः
    । प्रातर्मध्याह्नसायाह्ने पठेत्स्तवमनुत्तमम् ॥ ४२॥ इत्थं शिवेन सायुज्यं लभते नात्र संशयः ॥ ४३॥ इति
    श्रीलिङ्गमहापुराणे उत्तरभागे एकोनविंशाध्यायान्तर्गतं ऋषिभिः कृतं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण
    । उत्तरभाग । अध्याय १९
