id: sarvadeva-kruta-sri-lakshmi-stotram
category: stotram
name:
  english: Sarvadeva Kruta Sri Lakshmi Stotram
content:
  english: kshamasva bhagavatyamba kshama shile paratpare| shuddha satva svarupeca kopadi pari varjite||
    upame sarva sadhvinam devinam deva pujite| tvaya vina jagatsarvam mrita tulyanca nishphalam| sarva
    sampatsvarupatvam sarvesham sarva rupini| raseshvaryadhi devitvam tvatkalah sarvayoshitah|| kailase
    parvati tvanca kshirodhe sindhu kanyaka| svargeca svarga lakshmi stvam martya lakshmishca bhutale||
    vaikuntheca mahalakshmih devadevi sarasvati| gangaca tulasitvanca savitri brahma lokatah|| krishna
    pranadhi devitvam goloke radhika svayam| rase raseshvari tvanca brinda brindavane vane|| krishna priya
    tvam bhandire candra candana kanane| viraja campaka vane shata shringeca sundari| padmavati padma
    vane malati malati vane| kunda danti kundavane sushila ketaki vane|| kadamba mala tvam devi kadamba
    kanane pica| rajalakshmih raja gehe grihalakshmi rgrihe grihe|| ityuktva devatassarvah munayo manavastatha|
    rurudurna mravadanah shushka kanthoshtha talukah|| iti lakshmi stavam punyam sarvadevaih kritam shubham|
    yah pathetpratarutthaya savaisarvam labheddhruvam|| abharyo labhate bharyam vinitam susutam satim|
    sushilam sundarim ramyamati supriyavadinim|| putra pautra vatim shuddham kulajam komalam varam| aputro
    labhate putram vaishnavam cirajivinam|| paramaishvarya yuktanca vidyavantam yashasvinam| bhrashtarajyo
    labhedrajyam bhrashta shrirlabhete shriyam|| hata bandhurlabhedbandhum dhana bhrashto dhanam labhet||
    kirti hino labhetkirtim pratishthanca labheddhruvam|| sarva mangaladam stotram shoka santapa nashanam|
    harshanandakaram shashvaddharma moksha suhritpadam|| || iti sarva deva krita lakshmi stotram sampurnam
    ||
  devanagari: क्षमस्व भगवत्यम्ब क्षमा शीले परात्परे। शुद्ध सत्व स्वरूपेच कोपादि परि वर्जिते॥ उपमे सर्व
    साध्वीनां देवीनां देव पूजिते। त्वया विना जगत्सर्वं मृत तुल्यञ्च निष्फलम्। सर्व सम्पत्स्वरूपात्वं सर्वेषां
    सर्व रूपिणी। रासेश्वर्यधि देवीत्वं त्वत्कलाः सर्वयोषितः॥ कैलासे पार्वती त्वञ्च क्षीरोधे सिन्धु कन्यका।
    स्वर्गेच स्वर्ग लक्ष्मी स्त्वं मर्त्य लक्ष्मीश्च भूतले॥ वैकुण्ठेच महालक्ष्मीः देवदेवी सरस्वती। गङ्गाच
    तुलसीत्वञ्च सावित्री ब्रह्म लोकतः॥ कृष्ण प्राणाधि देवीत्वं गोलोके राधिका स्वयम्। रासे रासेश्वरी त्वञ्च
    बृन्दा बृन्दावने वने॥ कृष्ण प्रिया त्वं भाण्डीरे चन्द्रा चन्दन कानने। विरजा चम्पक वने शत शृङ्गेच सुन्दरी।
    पद्मावती पद्म वने मालती मालती वने। कुन्द दन्ती कुन्दवने सुशीला केतकी वने॥ कदम्ब माला त्वं देवी कदम्ब
    कानने पिच। राजलक्ष्मीः राज गेहे गृहलक्ष्मी र्गृहे गृहे॥ इत्युक्त्वा देवतास्सर्वाः मुनयो मनवस्तथा।
    रूरूदुर्न म्रवदनाः शुष्क कण्ठोष्ठ तालुकाः॥ इति लक्ष्मी स्तवं पुण्यं सर्वदेवैः कृतं शुभम्। यः पठेत्प्रातरुत्थाय
    सवैसर्वं लभेद्ध्रुवम्॥ अभार्यो लभते भार्यां विनीतां सुसुतां सतीम्। सुशीलां सुन्दरीं रम्यामति सुप्रियवादिनीम्॥
    पुत्र पौत्र वतीं शुद्धां कुलजां कोमलां वराम्। अपुत्रो लभते पुत्रं वैष्णवं चिरजीविनम्॥ परमैश्वर्य युक्तञ्च
    विद्यावन्तं यशस्विनम्। भ्रष्टराज्यो लभेद्राज्यं भ्रष्ट श्रीर्लभेते श्रियम्॥ हत बन्धुर्लभेद्बन्धुं
    धन भ्रष्टो धनं लभेत्॥ कीर्ति हीनो लभेत्कीर्तिं प्रतिष्ठाञ्च लभेद्ध्रुवम्॥ सर्व मङ्गलदं स्तोत्रं शोक
    सन्ताप नाशनम्। हर्षानन्दकरं शाश्वद्धर्म मोक्ष सुहृत्पदम्॥ ॥ इति सर्व देव कृत लक्ष्मी स्तोत्रं सम्पूर्णम्
    ॥
