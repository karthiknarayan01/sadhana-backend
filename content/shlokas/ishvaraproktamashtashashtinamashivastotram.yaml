id: ishvaraproktamashtashashtinamashivastotram
category: stotram
name:
  english: ishvaraproktamashtashashtinamashivastotram
  devanagari: ईश्वरप्रोक्तंअष्टषष्टिनामशिवस्तोत्रम्
content:
  english: rinvatam vapi sarvapatakanashini || 22|| tasmatsarvaprayatnena kirtaniya vicakshanaih | kalatraye'pi
    shucibhirvisheshacchivadikshitaih || 23|| likhitapi vararohe yasyaisha tishthate grihe | na tatra
    jayate dosho bhutapretasamudbhavah || 24|| na vyadherna ca sarpanam na cauranam varanane | nanyesham
    bhubhujadinam kadacidapi kutracit || 25|| iti shriskandapurane nagarakhande navadhikashatatamadhyayantargatam
    ishvaraproktam ashtashashtinamashivastotram samaptam | skandapurana | nagarakhanda | adhyaya 109
  devanagari: ृण्वतां वापि सर्वपातकनाशिनी ॥ २२॥ तस्मात्सर्वप्रयत्नेन कीर्तनीया विचक्षणैः । कालत्रयेऽपि
    शुचिभिर्विशेषाच्छिवदीक्षितैः ॥ २३॥ लिखितापि वरारोहे यस्यैषा तिष्ठते गृहे । न तत्र जायते दोषो भूतप्रेतसमुद्भवः
    ॥ २४॥ न व्याधेर्न च सर्पाणां न चौराणां वरानने । नान्येषां भूभुजादीनां कदाचिदपि कुत्रचित् ॥ २५॥ इति
    श्रीस्कन्दपुराणे नागरखण्डे नवाधिकशततमाध्यायान्तर्गतं ईश्वरप्रोक्तं अष्टषष्टिनामशिवस्तोत्रं समाप्तम्
    । स्कन्दपुराण । नागरखण्ड । अध्याय १०९
meaning: {}
