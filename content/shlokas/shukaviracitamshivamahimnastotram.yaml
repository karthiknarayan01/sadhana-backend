id: shukaviracitamshivamahimnastotram
category: stotram
name:
  english: shukaviracitamshivamahimnastotram
  devanagari: शुकविरचितंशिवमहिम्नस्तोत्रं
content:
  english: rbhidyatyeva vibhedabhavajanakam tvajnanametatsphutam || 20|| ishavasyamidam jagacshrutishataih
    proktam ca tadbhedadhih no kashcidvinivartate ca yatate mokshashrame shrantiyuk | tvadbhaktya vimukhah
    sadaiva hi vritha bodhadbhave bhrashyate buddhya vriddhadhiyo bhavanti ca vritha kincayusho'nte narah
    || 21|| vidya sudyotate'ntarhridi jatilatamo bhidyate khidyate'ntah khadyotadyutivatsavidyuta ima
    no bhanti candranalah | yukashukasamo mayukhasamahamali ca lila hi te ghukastarkavitarkajalajatila
    vidhvamsitastvaddrisha || 22|| simabhuma tvamisho dridhataramahima tvatpadabje kilaiko yastvam dhyayati
    dhyanahinavapusha sa tvam tvamatma parah | no tatra triputikutirakutila cittam nitalekshana lakshyatma
    tvapalakshyalakshitahrida tvam vetsi tam tvamanu || 23|| shamito mrigatrishnikeva bhumau mrigadrishtyaiva
    sa eva bandhahetuh | subhavodbhavapadasevinam sugama vai nigamagamorushirshah || 24|| padajataprakataprabhavabodhairahameva
    tvamasi kva bhedahetuh || 25|| tantrayantrakritamantravibhaktairmantriko'hamiti dhirna vimuktyai |
    bhedabhanakalanavicaratah tvam na janata ime pashavah syuh || 26|| yuktiyuktamapi bhuktamakhedam bhaktameva
    vigunam na tu bhuktyai | muktimargaphalane shrutisukta vakti tattvamasi vakyato'rthavat || 27|| bahutve'pyekatve
    bhramabhavanatantah kila narah na caikam dvitvam va shrutishirasi vakyarthakalane | na bandho moksho
    va na paramavaro napi hi narah cakasti brahmedam paramashiva eko dhruvasukhah || 28|| vittapittamapaniya
    cittato hrittamo rasadrisha paridhuya | kartritamapi nijatmavidyaya bhoktritamapi sadatmadarshanat
    || 29|| darshanam ca hridi tatra vilapya praptakamakalano dalitashah | mulakulajanitamatha vidyam
    hridyamena paridhuya avidyam || 30|| umajane jane tava bhava yadartam jagadidam na jane tadbhinnam
    shiva bhajanabodhairgurujanaih | ramajanerjanim janimritinidanadivimukham mahijaneh saukhyam lavashatasuranam
    mama kiyat || 31|| tarkaistarkitumapyashaktakaranairmimamsyametanna vai shabdaishcapi jadaishca tantranivahaih
    drishyah kimatma bhavan | manahklriptastarka gunagunajabuddhipratibhuvo vicaram ceto yattadapi shiva
    mimamsakamatam || 32|| yatah shabdo vagbhurmanavacanadare tvamasi drik na vai jatam kincinna ca bhavati
    sampratyati bhavat | na vai karyam tasya prabhuranurapi sthulamapi na na rupam tvaggandho na rasarasana
    vapi bhagavan || 33|| tvamatma sve dhamni sthita iva vibhasidamakhilam na copadhirbhutanyakhilatanavah
    kalpitadhiya | mahavidyamohadvividhatagshastrasya vishayam avidyavatsarvam bhavati tvayi drishte paratare
    || 34|| tadetattvam capi tvamahamiti drishyam ca na hi drigakhande pindandaprabhavavihite buddhikarane
    | tato jatam shastram tava shivada bodhe kathamidam jadam cetovagmih pratipadavimrishyam bhavashataih
    || 35|| kumarkairnaneva prabhavasi ca bhaktyaiva sukarah || 36|| shraddham te shrutiraha saumyapurushetyetatpare
    nirgune sambe rupagunaikavagvishayake namnyarcane va tvayi | prarabdhantimasambhavena hi patha yo'yam
    cakaste yatha yavaccapyadhikarasadhanapadam tasya tvamatma sada || 37|| kutilajatilashabdatarkajalaih
    shrutiharinim bhashanti vakshramaste | gunaganavihitah shunam ganaste tava bhaktya rahita'pyabuddhabodhah
    || 38|| mithya jagadyugabhavah pratikalpamevam mudha gunaprabhavato munayo'pi candhah | shastrani
    tanvata jagatparivancakaste purvaparoruvacanaih svadhiyaiva mugdhah || 39|| tasmattanparivancase'dya
    bhagavannanarthashastrabhramaih mithyavarnanibandhanashramaganashrantanvitarke ratan | tamstamstadbhavabhavabodhasahitansvargabhrame
    duhkhitan yatayatashateshu duhkhabhavane yamye ca duhkhotkatan || 40|| svamatimatakritam vitatya shastram
    parinindatyanisham vihaya vedan | tava mayamayapashabaddhakishah phalajaleshu vrithaiva vardhitashah
    || 41|| ashanavasanamatrasabhilashah bhramato'nyonyamupasakashca bhandah | gunakhandahrida vadanti
    yuddhe madhumadyanmadhupa yathaiva bhandah || 42|| kecinmundah kutilajatilashcakrataptastathanye nagna
    bauddhah shramananicayastungalingam vahantah | vipra varnashramavarabhara himsava svargakamah kamaratau
    vimukhahridaya jnanahina bhramanti || 43|| kuranga mohandha marujaladhibuddhyatapatapah yatha dhavantisha
    prashithiladhiya tarshitajalah | tatheme mohandhah hridayadahare tvamadhivaptam bhavantam hitvaiva
    prabhavamaranairbhrantivashagah || 44|| abhedyam bhedyeshu prakatarahritpadmasadanam avijnatam jnatam
    niravadhikasaccitsukhavapuh | bhavanmayamohadbhramati paramanandavimukham jagallokalokam susasvaratiryaggatadhiyam
    || 45|| naham na tvam na ceme bhava bhavabhavam vai gatabhayam
  devanagari: र्भिद्यत्येव विभेदभावजनकं त्वज्ञानमेतत्स्फुटम् ॥ २०॥ ईशावास्यमिदं जगच्श्रुतिशतैः प्रोक्तं
    च तद्भेदधीः नो कश्चिद्विनिवर्तते च यतते मोक्षाश्रमे श्रान्तियुक् । त्वद्भक्त्या विमुखः सदैव हि वृथा
    बोधाद्भवे भ्रश्यते बुद्ध्या वृद्धधियो भवन्ति च वृथा किञ्चायुषोऽन्ते नराः ॥ २१॥ विद्या सुद्योततेऽन्तर्हृदि
    जटिलतमो भिद्यते खिद्यतेऽन्तः खद्योतद्युतिवत्सविद्युत इमा नो भान्ति चन्द्रानलाः । यूकाशूकसमो मयूखसमहामाली
    च लीला हि ते घूकास्तर्कवितर्कजालजटिला विध्वंसितास्त्वद्दृशा ॥ २२॥ सीमाभूमा त्वमीशो दृढतरमहिमा त्वत्पदाब्जे
    किलैको यस्त्वां ध्यायति ध्यानहीनवपुषा स त्वं त्वमात्मा परः । नो तत्र त्रिपुटीकुटीरकुटिल चित्तं निटालेक्षण
    लक्ष्यात्मा त्वपलक्ष्यलक्षितहृदा त्वं वेत्सि तं त्वामनु ॥ २३॥ शमितो मृगतृष्णिकेव भूमौ मृगदृष्ट्यैव
    स एव बन्धहेतुः । सुभवोद्भवपादसेविनां सुगमा वै निगमागमोरुशीर्षाः ॥ २४॥ पदजातप्रकटप्रभावबोधैरहमेव त्वमसि
    क्व भेदहेतुः ॥ २५॥ तन्त्रयन्त्रकृतमन्त्रविभक्तैर्मान्त्रिकोऽहमिति धीर्न विमुक्त्यै । भेदभानकलनाविचारतः
    त्वां न जानत इमे पशवः स्युः ॥ २६॥ युक्तियुक्तमपि भुक्तमखेदं भक्तमेव विगुणं न तु भुक्त्यै । मुक्तिमार्गफलने
    श्रुतिसूक्ता वक्ति तत्त्वमसि वाक्यतोऽर्थवत् ॥ २७॥ बहुत्वेऽप्येकत्वे भ्रमभवनतान्ताः किल नराः न चैकं
    द्वित्वं वा श्रुतिशिरसि वाक्यार्थकलने । न बन्धो मोक्षो वा न परमवरो नापि हि नरः चकास्ति ब्रह्मेदं परमशिव
    एको ध्रुवसुखः ॥ २८॥ वित्तपित्तमपनीय चित्ततो हृत्तमो रसदृशा परिधूय । कर्तृतामपि निजात्मविद्यया भोक्तृतामपि
    सदात्मदर्शनात् ॥ २९॥ दर्शनं च हृदि तत्र विलाप्य प्राप्तकामकलनो दलिताशः । मूलकूलजनितामथ विद्यां हृद्यमेन
    परिधूय अविद्याम् ॥ ३०॥ उमाजाने जाने तव भव यदार्तं जगदिदं न जाने तद्भिन्नं शिव भजनबोधैर्गुरुजनैः ।
    रमाजानेर्जानिं जनिमृतिनिदानादिविमुखं महीजानेः सौख्यं लवशतसुराणां मम कियत् ॥ ३१॥ तर्कैस्तर्कितुमप्यशक्तकरणैर्मीमांस्यमेतन्न
    वै शब्दैश्चापि जडैश्च तन्त्रनिवहैः दृश्यः किमात्मा भवान् । मनःक्लृप्तास्तर्का गुणगुणजबुद्धिप्रतिभुवो
    विचारं चेतो यत्तदपि शिव मीमांसकमतम् ॥ ३२॥ यतः शब्दो वाग्भूर्मनवचनदरे त्वमसि दृक् न वै जातं किञ्चिन्न
    च भवति सम्प्रत्यति भवत् । न वै कार्यं तस्य प्रभुरणुरपि स्थूलमपि न न रूपं त्वग्गन्धो न रसरसना वापि
    भगवन् ॥ ३३॥ त्वमात्मा स्वे धाम्नि स्थित इव विभासीदमखिलं न चोपाधिर्भूतान्यखिलतनवः कल्पितधिया । महाविद्यामोहाद्विविधतग्शास्त्रस्य
    विषयं अविद्यावत्सर्वं भवति त्वयि दृष्टे परतरे ॥ ३४॥ तदेतत्त्वं चापि त्वमहमिति दृश्यं च न हि दृगखण्डे
    पिण्डाण्डप्रभवविहिते बुद्धिकरणे । ततो जातं शास्त्रं तव शिवद बोधे कथमिदं जडं चेतोवाग्मिः प्रतिपदविमृश्यं
    भवशतैः ॥ ३५॥ कुमर्कैर्नानेव प्रभवसि च भक्त्यैव सुकरः ॥ ३६॥ श्रद्धां ते श्रुतिराह सौम्यपुरुषेत्येतत्परे
    निर्गुणे साम्बे रूपगुणैकवाग्विषयके नाम्न्यर्चने वा त्वयि । प्रारब्धान्तिमसम्भवेन हि पथा योऽयं चकास्ते
    यथा यावच्चाप्यधिकारसाधनपदं तस्य त्वमात्मा सदा ॥ ३७॥ कुटिलजटिलशब्दतर्कजालैः श्रुतिहरिणीं भषन्ति वाक्श्रमास्ते
    । गुणगणविहिताः शुनां गणास्ते तव भक्त्या रहिताऽप्याबुद्धबोधाः ॥ ३८॥ मिथ्या जगद्युगभवाः प्रतिकल्पमेवं
    मूढा गुणप्रभवतो मुनयोऽपि चान्धाः । शास्त्राणि तन्वत जगत्परिवञ्चकास्ते पूर्वापरोरुवचनैः स्वधियैव मुग्धाः
    ॥ ३९॥ तस्मात्तान्परिवञ्चसेऽद्य भगवन्नानार्थशास्त्रभ्रमैः मिथ्यावर्णनिबन्धनाश्रमगणश्रान्तान्वितर्के
    रतान् । तांस्तांस्तद्भवभावबोधसहितान्स्वर्गभ्रमे दुःखितान् यातायातशतेषु दुःखभवने याम्ये च दुःखोत्कटान्
    ॥ ४०॥ स्वमतिमतकृतं वितत्य शास्त्रं परिनिन्दत्यनिशं विहाय वेदान् । तव मायामयपाशबद्धकीशाः फलजालेषु वृथैव
    वर्धिताशाः ॥ ४१॥ अशनवसनमात्रसाभिलाषाः भ्रमतोऽन्योन्यमुपासकाश्च भण्डाः । गुणखण्डहृदा वदन्ति युद्धे
    मधुमाद्यन्मधुपा यथैव भण्डाः ॥ ४२॥ केचिन्मुण्डाः कुटीलजटिलाश्चक्रतप्तास्तथान्ये नग्ना बौद्धाः श्रमणनिचयास्तुङ्गलिङ्गं
    वहन्तः । विप्रा वर्णाश्रमवरभरा हिंसवा स्वर्गकामाः कामारातौ विमुखहृदया ज्ञानहीना भ्रमन्ति ॥ ४३॥ कुरङ्गा
    मोहान्धा मरुजलधिबुद्ध्यातपतपाः यथा धावन्तीश प्रशिथिलधिया तर्षितजलाः । तथेमे मोहान्धाः हृदयदहरे त्वामधिवप्तं
    भवन्तं हित्वैव प्रभवमरणैर्भ्रान्तिवशगाः ॥ ४४॥ अभेद्यं भेद्येषु प्रकटरहृत्पद्मसदनं अविज्ञातं ज्ञातं
    निरवधिकसच्चित्सुखवपुः । भवन्मायामोहाद्भ्रमति परमानन्दविमुखं जगल्लोकालोकं सुसस्वरतिर्यग्गतधियम् ॥ ४५॥
    नाहं न त्वं न चेमे भव भवभवं वै गतभयं
