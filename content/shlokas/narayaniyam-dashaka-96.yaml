id: narayaniyam-dashaka-96
category: stotram
name:
  english: Narayaniyam Dashaka 96
content:
  english: tvam hi brahmaiva sakshat paramurumahimannaksharanamakara staro mantreshu rajnam manurasi munishu
    tvam bhrigurnarado'pi | prahlado danavanam pashushu ca surabhih pakshinam vainateyo naganamasyanantassurasaridapi
    ca srotasam vishvamurte || || brahmanyanam balistvam kratushu ca japayajno'si vireshu partho bhaktanamuddhavastvam
    balamasi balinam dhama tejasvinam tvam | nastyantastvadvibhutervikasadatishayam vastu sarvam tvameva
    tvam jivastvam pradhanam yadiha bhavadrite tanna kincit prapance || || dharmam varnashramanam shrutipathavihitam
    tvatparatvena bhaktya kurvanto'ntarvirage vikasati shanakaih santyajanto labhante | sattasphurtipriyatvatmakamakhilapadartheshu
    bhinneshvabhinnam nirmulam vishvamulam paramamahamiti tvadvibodham vishuddham || || jnanam karmapi
    bhaktistritayamiha bhavatprapakam tatra tava nnirvinnanamasheshe vishaya iha bhavet jnanayoge'dhikarah
    | saktanam karmayogastvayi hi vinihito ye tu natyantasaktah napyatyantam viraktastvayi ca dhritarasa
    bhaktiyogo hyamisham || || jnanam tvadbhaktatam va laghu sukritavashanmartyaloke labhante tasmattatraiva
    janma sprihayati bhagavan nakago narako va | avishtam mam tu daivadbhavajalanidhipotayite martyadehe
    tvam kritva karnadharam gurumanugunavatayitastarayethah || || avyaktam margayantah shrutibhirapi nayaih
    kevalajnanalubdhah klishyante'tiva siddhim bahutarajanushamanta evapnuvanti | durasthah karmayogo'pi
    ca paramaphale nanvayam bhaktiyoga stvamuladeva hridyastvaritamayi bhavatprapako vardhatam me || ||
    jnanayaivatiyatnam munirapavadate brahmatattvam tu shrinvan gadham tvatpadabhaktim sharanamayati yastasya
    muktih karagre | tvaddhyane'piha tulya punarasukarata cittacancalyaheto rabhyasadashu shakyam tadapi
    vashayitum tvatkripacarutabhyam || || nirvinnah karmamarge khalu vishamatame tvatkathadau ca gadham
    jatashraddho'pi kamanayi bhuvanapate naiva shaknomi hatum | tadbhuyo nishcayena tvayi nihitamana doshabuddhya
    bhajamstan pushniyam bhaktimeva tvayi hridayagate mankshu nankshyanti sangah || || kashcit klesharjitarthakshayavimalamatirnudyamano
    janaughaih pragevam praha vipro na khalu mama janah kalakarmagraha va| ceto me duhkhahetustadiha gunaganam
    bhavayatsarvakari tyuktva shanto gatastvam mama ca kuru vibho tadrishi cittashantim || || ailah pragurvashim
    pratyativivashamanah sevamanashciram tam gadham nirvidya bhuyo yuvatisukhamidam kshudrameveti gayan
    | tvadbhaktim prapya purnah sukhataramacarattadvaduddhutasangam bhaktottamsam kriya mam pavanapurapate
    hanta me rundhi rogan ||
  devanagari: त्वं हि ब्रह्मैव साक्षात् परमुरुमहिमन्नक्षराणामकार स्तारो मन्त्रेषु राज्ञां मनुरसि मुनिषु
    त्वं भृगुर्नारदोऽपि । प्रह्लादो दानवानां पशुषु च सुरभिः पक्षिणां वैनतेयो नागानामस्यनन्तस्सुरसरिदपि
    च स्रोतसां विश्वमूर्ते ॥ ॥ ब्रह्मण्यानां बलिस्त्वं क्रतुषु च जपयज्ञोऽसि वीरेषु पार्थो भक्तानामुद्धवस्त्वं
    बलमसि बलिनां धाम तेजस्विनां त्वम् । नास्त्यन्तस्त्वद्विभूतेर्विकसदतिशयं वस्तु सर्वं त्वमेव त्वं जीवस्त्वं
    प्रधानं यदिह भवदृते तन्न किञ्चित् प्रपञ्चे ॥ ॥ धर्मं वर्णाश्रमाणां श्रुतिपथविहितं त्वत्परत्वेन भक्त्या
    कुर्वन्तोऽन्तर्विरागे विकसति शनकैः सन्त्यजन्तो लभन्ते । सत्तास्फूर्तिप्रियत्वात्मकमखिलपदार्थेषु भिन्नेष्वभिन्नं
    निर्मूलं विश्वमूलं परममहमिति त्वद्विबोधं विशुद्धम् ॥ ॥ ज्ञानं कर्मापि भक्तिस्त्रितयमिह भवत्प्रापकं
    तत्र ताव न्निर्विण्णानामशेषे विषय इह भवेत् ज्ञानयोगेऽधिकारः । सक्तानां कर्मयोगस्त्वयि हि विनिहितो
    ये तु नात्यन्तसक्ताः नाप्यत्यन्तं विरक्तास्त्वयि च धृतरसा भक्तियोगो ह्यमीषाम् ॥ ॥ ज्ञानं त्वद्भक्ततां
    वा लघु सुकृतवशान्मर्त्यलोके लभन्ते तस्मात्तत्रैव जन्म स्पृहयति भगवन् नाकगो नारको वा । आविष्टं मां
    तु दैवाद्भवजलनिधिपोतायिते मर्त्यदेहे त्वं कृत्वा कर्णधारं गुरुमनुगुणवातायितस्तारयेथाः ॥ ॥ अव्यक्तं
    मार्गयन्तः श्रुतिभिरपि नयैः केवलज्ञानलुब्धाः क्लिश्यन्तेऽतीव सिद्धिं बहुतरजनुषामन्त एवाप्नुवन्ति ।
    दूरस्थः कर्मयोगोऽपि च परमफले नन्वयं भक्तियोग स्त्वामूलादेव हृद्यस्त्वरितमयि भवत्प्रापको वर्धतां मे
    ॥ ॥ ज्ञानायैवातियत्नं मुनिरपवदते ब्रह्मतत्त्वं तु शृण्वन् गाढं त्वत्पादभक्तिं शरणमयति यस्तस्य मुक्तिः
    कराग्रे । त्वद्ध्यानेऽपीह तुल्या पुनरसुकरता चित्तचाञ्चल्यहेतो रभ्यासादाशु शक्यं तदपि वशयितुं त्वत्कृपाचारुताभ्याम्
    ॥ ॥ निर्विण्णः कर्ममार्गे खलु विषमतमे त्वत्कथादौ च गाढं जातश्रद्धोऽपि कामानयि भुवनपते नैव शक्नोमि
    हातुम् । तद्भूयो निश्चयेन त्वयि निहितमना दोषबुद्ध्या भजंस्तान् पुष्णीयां भक्तिमेव त्वयि हृदयगते मङ्क्षु
    नङ्क्ष्यन्ति सङ्गाः ॥ ॥ कश्चित् क्लेशार्जितार्थक्षयविमलमतिर्नुद्यमानो जनौघैः प्रागेवं प्राह विप्रो
    न खलु मम जनः कालकर्मग्रहा वा। चेतो मे दुःखहेतुस्तदिह गुणगणं भावयत्सर्वकारी त्युक्त्वा शान्तो गतस्त्वां
    मम च कुरु विभो तादृशी चित्तशान्तिम् ॥ ॥ ऐलः प्रागुर्वशीं प्रत्यतिविवशमनाः सेवमानश्चिरं तां गाढं निर्विद्य
    भूयो युवतिसुखमिदं क्षुद्रमेवेति गायन् । त्वद्भक्तिं प्राप्य पूर्णः सुखतरमचरत्तद्वदुद्धूतसङ्गं भक्तोत्तंसं
    क्रिया मां पवनपुरपते हन्त मे रुन्धि रोगान् ॥
