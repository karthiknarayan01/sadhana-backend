id: rahu-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Rahu Ashtottara Sata Nama Stotram
  devanagari: राहु अष्टोत्तरशतनामस्तोत्रम्
content:
  english: rahu bija mantra - om bhra~ bhrim bhraum sah rahave namah || shrinu namani rahoshca saimhikeyo
    vidhuntudah | surashatrustamashcaiva phani gargyayanastatha || 1|| phanirgargyayanastatha suragurnilajimutasankashashca
    caturbhujah | surarirnila khadgakhetakadhari ca varadayakahastakah || 2|| shulayudho meghavarnah krishnadhvajapatakavan
    | varno patakavan dakshinashamukharatah tikshnadamshtradharaya ca || 3|| damshtrakaralakah shurpakarasanasthashca
    gomedabharanapriyah | mashapriyah kashyaparshinandano bhujageshvarah || 4|| kashyapa ulkapatayitashuli
    nidhipah krishnasarparat | ulkapatajanih shuli vishajvalavritasyo'rdhashariro jadyasampradah || 5||
    shatravapradah ravindubhikarashchayasvarupi kathinangakah | dvishaccakracchedako'tha karalasyo bhayankarah
    || 6|| krurakarma tamorupah shyamatma nilalohitah | kiriti nilavasanah shanisamantavartmagah || 7||
    candalavarno'thashvyarkshabhavo meshabhavastatha | shanivatphaladah shuro'pasavyagatireva ca || 8||
    uparagakarassuryahimamshucchaviharakah | var uparagakarassoma suryacchavi vimardakah nilapushpaviharashca
    grahashreshtho'shtamagrahah || 9|| kabandhamatradehashca yatudhanakulodbhavah | govindavarapatram
    ca devajatipravishtakah || 10|| kruro ghorah shanermitram shukramitramagocarah | manegangasnanadata
    svagrihe prabaladhyakah || 11|| sadgrihe'nyabaladhriccaturthe matrinashakah | candrayukte tu candalajanmasucaka
    eva tu || 12|| janmasimhe rajyadata mahakayastathaiva ca | janmakarta vidhuripu mattakojnanadashca
    sah || 13|| janmakanyarajyadata janmahanida eva ca | navame pitrihanta ca pancame shokadayakah ||
    14|| dyune kaḻatrahanta ca saptame kalahapradah | shashthe tu vittadata ca caturthe vairadayakah ||
    15|| navame papadata ca dashame shokadayakah | adau yashahpradata ca ante vairapradayakah || 16||
    kalatma gocaracaro dhane casya kakutpradah | pancame dhishanashringadah svarbhanurbali tatha || 17||
    mahasaukhyapradayi ca candravairi ca shashvatah | surashatruh papagrahah shambhavah pujyakastatha
    || 18|| patirapuranashcatha paithinasakulodbhavah | dirghakrishnotanurvishnunetrarirdevadanavau ||
    19|| bhaktaraksho rahumurtih sarvabhishtaphalapradah | etadrahugrahasyoktam namnamashtottaram shatam
    || 20|| shraddhaya yo japennityam mucyate sarva sankatat | sarvasampatkarastasya rahurishtapradayakah
    || 21|| || iti rahu ashtottarashatanamastotram sampurnam || Provided by manda khrishna shrikanth mandaksk
    at gmailॅom
  devanagari: राहु बीज मन्त्र - ॐ भ्राँ भ्रीं भ्रौं सः राहवे नमः ॥ शृणु नामानि राहोश्च सैंहिकेयो विधुन्तुदः
    । सुरशत्रुस्तमश्चैव फणी गार्ग्यायणस्तथा ॥ १॥ फणिर्गार्ग्यायनस्तथा सुरागुर्नीलजीमूतसङ्काशश्च चतुर्भुजः
    । सुरारिर्नील खड्गखेटकधारी च वरदायकहस्तकः ॥ २॥ शूलायुधो मेघवर्णः कृष्णध्वजपताकावान् । वर्णो पताकवान्
    दक्षिणाशामुखरतः तीक्ष्णदंष्ट्रधराय च ॥ ३॥ दंष्ट्राकरालकः शूर्पाकारासनस्थश्च गोमेदाभरणप्रियः । माषप्रियः
    कश्यपर्षिनन्दनो भुजगेश्वरः ॥ ४॥ काश्यप उल्कापातयिताशुली निधिपः कृष्णसर्पराट् । उल्कापातजनिः शूली विषज्वलावृतास्योऽर्धशरीरो
    जाद्यसम्प्रदः ॥ ५॥ शात्रवप्रदः रवीन्दुभीकरश्छायास्वरूपी कठिनाङ्गकः । द्विषच्चक्रच्छेदकोऽथ करालास्यो
    भयङ्करः ॥ ६॥ क्रूरकर्मा तमोरूपः श्यामात्मा नीललोहितः । किरीटी नीलवसनः शनिसामन्तवर्त्मगः ॥ ७॥ चाण्डालवर्णोऽथाश्व्यर्क्षभवो
    मेषभवस्तथा । शनिवत्फलदः शूरोऽपसव्यगतिरेव च ॥ ८॥ उपरागकरस्सूर्यहिमांषुच्छविहारकः । वर् उपरागकरस्सोम
    सूर्यच्छवि विमर्दकः नीलपुष्पविहारश्च ग्रहश्रेष्ठोऽष्टमग्रहः ॥ ९॥ कबन्धमात्रदेहश्च यातुधानकुलोद्भवः
    । गोविन्दवरपात्रं च देवजातिप्रविष्टकः ॥ १०॥ क्रूरो घोरः शनेर्मित्रं शुक्रमित्रमगोचरः । मानेगङ्गास्नानदाता
    स्वगृहे प्रबलाढ्यकः ॥ ११॥ सद्गृहेऽन्यबलधृच्चतुर्थे मातृनाशकः । चन्द्रयुक्ते तु चण्डालजन्मसूचक एव तु
    ॥ १२॥ जन्मसिंहे राज्यदाता महाकायस्तथैव च । जन्मकर्ता विधुरिपु मत्तकोज्ञानदश्च सः ॥ १३॥ जन्मकन्याराज्यदाता
    जन्महानिद एव च । नवमे पितृहन्ता च पञ्चमे शोकदायकः ॥ १४॥ द्यूने कळत्रहन्ता च सप्तमे कलहप्रदः । षष्ठे
    तु वित्तदाता च चतुर्थे वैरदायकः ॥ १५॥ नवमे पापदाता च दशमे शोकदायकः । आदौ यशःप्रदाता च अन्ते वैरप्रदायकः
    ॥ १६॥ कालात्मा गोचराचारो धने चास्य ककुत्प्रदः । पञ्चमे धिषणाशृङ्गदः स्वर्भानुर्बली तथा ॥ १७॥ महासौख्यप्रदायी
    च चन्द्रवैरी च शाश्वतः । सुरशत्रुः पापग्रहः शाम्भवः पूज्यकस्तथा ॥ १८॥ पाटीरपूरणश्चाथ पैठीनसकुलोद्भवः
    । दीर्घकृष्णोतनुर्विष्णुनेत्रारिर्देवदानवौ ॥ १९॥ भक्तरक्षो राहुमूर्तिः सर्वाभीष्टफलप्रदः । एतद्राहुग्रहस्योक्तं
    नाम्नामष्टोत्तरं शतम् ॥ २०॥ श्रद्धया यो जपेन्नित्यं मुच्यते सर्व सङ्कटात् । सर्वसम्पत्करस्तस्य राहुरिष्टप्रदायकः
    ॥ २१॥ ॥ इति राहु अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥ Pरोविदेद् ब्य् ंअन्द ख़्रिश्न श्रिकन्थ् मन्दक्स्क्
    अत् ग्मैल्ॅओम्
