id: lekhinihridayam
category: hridaya
name:
  english: lekhinihridayam
  devanagari: लेखिनीहृदयम्
content:
  english: rinu devi pravakshyami rahasyanam param rahah | nigudham nigameshvetadyo gidurlabhadarshanam
    || 2|| na vedairnagamairetat prapyate kathamapyaho | nirhetukakripadrishtya svayameva prakashate ||
    3|| hridayam brahmalekhinyah sudhasarapravahakam | yatraksharasamutpattih param brahma pratiyate ||
    4|| asya hridayamantrasya rishirasmyahamavyayah | anushtupchanda ucyeta devata lekhini para || 5||
    parabrahma param bijam param jyotih prakirtitam | mahamaya para shaktih kilakam cinmayam smritam ||
    6|| dharmarthakamamokshanam siddhaye viniyojitam | kaivalyamritalabhaya svasamvittiprasiddhaye ||
    7|| kshanamatram tato dhyayet cinmayukhaikavigraham | cidagnikundasambhutam padmamadhye vyavasthitam
    || 8|| vidhatrim vishvajananim vanmayim vishvadharinim | nirvikalpaprabham devim smitacandranibhananam
    || 9|| amritabdhermantrena karapadmam vishodhayet | shadangeshu tatah pashcat savitrim viniveshayet
    || 10|| mayabijam samuccarya bhasvantam bhanuvatprabham | tato hridyamidam divyam japenmaunaparayanah
    || 11|| yatra varna layam yanti yatra nadah prashamyati | yatra vak vilayam yati sa lekhinyah para
    gatih || 12|| gopaniyam prayatnena pranebhyo'pi gariyasam | nabhaktaya pradatavyam na nindakajanaya
    ca || 13|| atha stotram | niralamba nirabhasa nihspanda nishprapancika | svasamvittarala devi svayamevadisakshini
    || 1|| yato nihshabdanirghosho yato nihsheshavistarah | yato nishkaranollasastasmai lekhinyai namo
    namah || 2|| avyaktabijakoshastha vyaktivallivilasini | aksharodyanamadhyastha varnavithiviharini
    || 3|| akaradikshakarantavarnajalaikajivita | uccaranuccaradbhavagudhanihshvasarupini || 4|| yatra
    dhaturna dhataram vetti vedo na vedanam | tatra cinmatravishrantirlekhini parikirtita || 5|| caturmukhasya
    cintaya yoniraprakatatmika | jaganniyanturudbhuta nabhirnabherapi sthita || 6|| vishvakshepalasacchayavyapinah
    shayanashraya | pancavaktraprabodhasya maunamudra sanatani || 7|| sadyojataprabhodbhutirvamadevasya
    vallari | aghorahridayadhvantakshalanamritadidhitih || 8|| tatpurushapranavyoma ishanasya para shrutih
    | sadashivasya nihshvasacinmayukhaprasutika || 9|| srishtau sankalparekheva sthitau sattvaikanihsritih
    | samhare kalakallola tirodhane'pyagocara || 10|| anugrahe sudhasara kaivalyaikapradipika | pancakrityaikanilaya
    pancabrahmasvarupini || 11|| tvam vagbhavasya nirlina tvam shribijasya jivika | tvam kamabijakallola
    tvam hrillekha paratpara || 12|| tvameva pranasancaro'panasya nivartanam | samanasya samullasa udanasyordhvadidhitih
    || 13|| vyanasya vishvasamvyaptirnadicakramahadhuni | hamsocchvasaprabodhaikasutrini pranadharini
    || 14|| tvam vani vagatitapi tvam rama shriranuttama | tvam nila nikhilacchaya dhritirmedha sarasvati
    || 15|| smritih prajna matih kantirbuddhirlajja daya kshama | shraddha tushtirvibhutishca pushtih
    shantirvirajase || 16|| tvamaditirdvadasharkeshu vasunamashtadidhitih | rudranam raudranirlepa vishvadeveshu
    cetana || 17|| sadhyanamaprameyartha marutam spandadharini | ashvinorbheshajacchaya pitrinamamritashrutih
    || 18|| indrasyojjrimbhanaprajna vahnerhomamritormika | varuni gambhirirekha vayorjivanacancala ||
    19|| dhaneshasya nidhernidra dharmarajasya nirnayah | nirriternirbhayapranta ishanasya para dhritih
    || 20|| matsye vedarnavoddhara kurme dhairyamahibhritih | krode bhugarbhanirmoksho nakharamshau mahojjvalam
    || 21|| vamane vishvasankoco bhargave brahmadidhitih | raghave satyanihshvaso halino bhudhritih sthira
    || 22|| gopale premanirjharo buddhe shunyarthadarshita | kalkinah kalavelayam nishkalankaprabodhini
    || 23|| kali kalagninihshesha kapalinyavyayanana | tara tarakanirghosha shodashi purnacandrika ||
    24|| bhuvaneshi bhuvo rekha bhairavi bhairavadhvanih | vajravairocani diptirdhumra dhumratigamini
    || 25|| bagalamukhi vakstambha matangi nadamalika | kamalakshi para lakshmih sarvavidyamayi shiva
    || 26|| kailase parvati devi brahmaloke sarasvati | vaikunthe kamala nitya kshirodambhonivasini ||
    27|| goloke krishnajivatma radhika rasarajnika | rasamandalamadhyastha raseshi rasamanjari || 28||
    vrinda vrindavane nityam nikunjacchayashayini | svarge shrih surasadmastha'lakayam nidhirupini ||
    29|| yatra dvaitam tada lila yatradvaitam tada tvameva | yatrobhayam viliyeta tatra te hridayam mahat
    || 30|| drashta drishyam ca darshanam jnata jneyam ca ya svayam | pramata pramanamekam prameyasyapi
    karanam || 31|| nado binduh kala rekha shaktih shunyam param padam | etatsarvam tvameveti nishcayo
    hridayodayah || 32|| tanmatrapancakacchaya mahabhutapradipika | indriyagramagahana cittavicivilasini
    || 33|| naham na tvam na so'nyo'sti naikyam naiva prithaktvata | yatrobhayavilaso'pi tatra te paramam
    vapuh || 34|| yatra prashno na nishpattiryatrottaramagocaram | tatra svayamsphurallekha cinmudra parikirtita
    || 35|| avyaktasyapyavyaktatvam vyaktasyapyaprakashata | tvayi sphurati deveshi dipashcitrapate yatha
    || 36|| chayaiva bhati bhasvatyam bhasaiva chayaya vina | tvayi vishvavilaso'yam svapnarekheva drishyate
    || 37|| nimeshonmeshayormadhye ya vishrantiranuttama | saiva te hridaye devi nishkampa parameshvari
    || 38|| nado jato na nirjato bindurnodiyate kvacit | yatraksharamapaksharam tatra te paramam padam
    || 39|| kalo lilakano yasyah kalpa lomavilasinah | yugasrotamsi nihshvasa divasah smitadidhitih ||
    40|| nakshatranikarah kesha grahacakram kiritakam | gangapravahaharashrirdigantah kundaladyutih ||
    41|| vyoma te nayanacchaya vayuh pranapravahakah | vahniste jnananirjharah salilam karunarasah ||
    42|| dhara dhairyaprabha devi parvata maunamudrikah | vanani romarajinam latah sankalparekhikah ||
    43|| ahoratre nimeshau te ritavah shvasavibhramah | samvatsarah padaspando yugantah keshakampanam
    || 44|| rico nihshvasavistarah samani smitavicayah | yajumshi hridayollasa atharvangirasah shrutih
    || 45|| vyakaranam padacchedo niruktam te katakshanam | chandamsi carananyasa jyotisham nayanarcishah
    || 46|| mimamsa te manorekha nyayo buddhernirupanam | vedanto hridayavasah shunyata te para gatih
    || 47|| agama angulirekhastantrani karapallavah | mantraste hridayaspanda yantranyasthivinirmitih
    || 48|| akaro dakshinah pada ukaro vamapadakah | makaro hridayambhojam bindurmaulivibhushanam || 49||
    varnah kusumavistara padani madhupavalih | vakyani makarandaugha arthah saurabhasancayah || 50|| jnatuh
    purvam tvamevasijjneyasyapi purah sthita | jnanasyapyantaralastha svasamvitparipurini || 51|| yada
    vetti svamatmanam jnata jnanavivarjitah | tada tvadiyamalokam kevalam kevalam bhavet || 52|| yatra
    shabdo layam yati yatrartho'pi viliyate | yatra cinta svayam supta tatra tvam bodharupini || 53||
    svapne jagarti ya nityam jagratyapi sushuptivat | turiyamapyatitayai tasyai lekhinyai namo namah ||
    54|| dvaitam te kridanollaso'dvaitam te hridayam mahat | dvaitadadvaitasancarah karunaiva pade pade
    || 55|| ato na veda vedastvam na dhyata dhyanagocarah | svayameva svasamvedya svayameva svayambhuva
    || 56|| yasyam linam jagajjalam yasmadudbhati punah punah | tamanadimanantam tvam cinmayukham namamyaham
    || 57|| na tattvam tattvato grahyam natattvam tyajyate kvacit | yadubhabhyamatitam tat svayameva tvadatmakam
    || 58|| yatrodeti na codeti yatrastam naiva gacchati | anudeyam param jyotistava sphurtih sanatani
    || 59|| yena pashyanti pashyanto yena jnatam prajayate | tadeva te padambhojam na drishyam drishyakaranam
    || 60|| nihsimashunyavipine nirvanamritanirjhare | avyahatacidudyane viharantim namamyaham || 61||
    avyaktavarnavinyasairaksharairaksharatigaih | svayam likhasi vishvam tvam svayameva vilumpasi || 62||
    yadvilaso jagadbhati yannidra pralayo matah | yatprabodho mahabodhastadeva hridayam tava || 63|| svapno
    jagaranam maunam nado binduh kala layah | ete te kevalacchayah svarupam no nigadyate || 64|| prane
    nasi mano nasi buddhirnasi na ca smritih | eteshamantaralastha sphurasi svaprakashini || 65|| antarnanto
    bahirnanto madhyo nasti nirupitah | yatra sarvam samapnoti tatte dhama niramayam || 66|| arcirnasi
    tamo nasi chaya nasi na bhaskarah | yadetadubhayatitam tadeva paramam vapuh || 67|| ashrutam shrutimapnoti
    adrishtam drishyate svayam | avijnatam vijanati tvatprasadapradipitam || 68|| varne varne guham tejah
    pade pade para gatih | shvase shvase sudhasindhurhridi hridyanagha sthitih || 69|| tatpadam cinmayam
    shantam saviturdhama kevalam | varenyam nikhiladharam bhargo mohandhabhedanah || 70|| devasyaiva para
    shaktirdhimahityantarashraya | dhiyo yo nah pracodayadityesha te para gatih || 71|| noccaryante padanyatra
    rahasyena vyavasthitah | mantrarajasya bijani hridaye te vilasini || 72|| yah pashyatyatmanatmanam
    tvadbhasaiva prakashitam | tasya bandho na moksho va kevalam cinmahambudhih || 73|| yah sha
  devanagari: ृणु देवि प्रवक्ष्यामि रहस्यानां परं रहः । निगूढं निगमेष्वेतद्यो गिदुर्लभदर्शनम् ॥ २॥ न वेदैर्नागमैरेतत्
    प्राप्यते कथमप्यहो । निर्हेतुककृपादृष्ट्या स्वयमेव प्रकाशते ॥ ३॥ हृदयं ब्रह्मलेखिन्याः सुधासारप्रवाहकम्
    । यत्राक्षरसमुत्पत्तिः परं ब्रह्म प्रतीयते ॥ ४॥ अस्य हृदयमन्त्रस्य ऋषिरस्म्यहमव्ययः । अनुष्टुप्छन्द
    उच्येत देवता लेखिनी परा ॥ ५॥ परब्रह्म परं बीजं परं ज्योतिः प्रकीर्तितम् । महामाया परा शक्तिः कीलकं
    चिन्मयं स्मृतम् ॥ ६॥ धर्मार्थकाममोक्षाणां सिद्धये विनियोजितम् । कैवल्यामृतलाभाय स्वसंवित्तिप्रसिद्धये
    ॥ ७॥ क्षणमात्रं ततो ध्यायेत् चिन्मयूखैकविग्रहम् । चिदग्निकुण्डसम्भूतां पद्ममध्ये व्यवस्थिताम् ॥ ८॥
    विधात्रीं विश्वजननीं वाङ्मयीं विश्वधारिणीम् । निर्विकल्पप्रभां देवीं स्मितचन्द्रनिभाननाम् ॥ ९॥ अमृताब्धेर्मन्त्रेण
    करपद्मं विशोधयेत् । षडङ्गेषु ततः पश्चात् सावित्रीं विनिवेशयेत् ॥ १०॥ मायाबीजं समुच्चार्य भास्वन्तं
    भानुवत्प्रभम् । ततो हृद्यमिदं दिव्यं जपेन्मौनपरायणः ॥ ११॥ यत्र वर्णा लयं यान्ति यत्र नादः प्रशाम्यति
    । यत्र वाक् विलयं याति सा लेखिन्याः परा गतिः ॥ १२॥ गोपनीयं प्रयत्नेन प्राणेभ्योऽपि गरीयसम् । नाभक्ताय
    प्रदातव्यं न निन्दकजनाय च ॥ १३॥ अथ स्तोत्रम् । निरालम्बा निराभासा निःस्पन्दा निष्प्रपञ्चिका । स्वसंवित्तरला
    देवी स्वयमेवादिसाक्षिणी ॥ १॥ यतो निःशब्दनिर्घोषो यतो निःशेषविस्तरः । यतो निष्कारणोल्लासस्तस्मै लेखिन्यै
    नमो नमः ॥ २॥ अव्यक्तबीजकोशस्था व्यक्तिवल्लीविलासिनी । अक्षरोद्यानमध्यस्था वर्णवीथीविहारिणी ॥ ३॥ अकारादिक्षकारान्तवर्णजालैकजीविता
    । उच्चारानुच्चरद्भावगूढनिःश्वासरूपिणी ॥ ४॥ यत्र धातुर्न धातारं वेत्ति वेदो न वेदनम् । तत्र चिन्मात्रविश्रान्तिर्लेखिनी
    परिकीर्तिता ॥ ५॥ चतुर्मुखस्य चिन्ताया योनिरप्रकटात्मिका । जगन्नियन्तुरुद्भूता नाभिर्नाभेरपि स्थिता
    ॥ ६॥ विश्वक्षेपालसच्छायाव्यापिनः शयनाश्रया । पञ्चवक्त्रप्रबोधस्य मौनमुद्रा सनातनी ॥ ७॥ सद्योजातप्रभोद्भूतिर्वामदेवस्य
    वल्लरी । अघोरहृदयध्वान्तक्षालनामृतदीधितिः ॥ ८॥ तत्पुरुषप्रणव्योमा ईशानस्य परा श्रुतिः । सदाशिवस्य
    निःश्वासचिन्मयूखप्रसूतिका ॥ ९॥ सृष्टौ सङ्कल्परेखेव स्थितौ सत्त्वैकनिःसृतिः । संहारे कालकल्लोला तिरोधानेऽप्यगोचरा
    ॥ १०॥ अनुग्रहे सुधासारा कैवल्यैकप्रदीपिका । पञ्चकृत्यैकनिलया पञ्चब्रह्मस्वरूपिणी ॥ ११॥ त्वं वाग्भवस्य
    निर्लीना त्वं श्रीबीजस्य जीविका । त्वं कामबीजकल्लोला त्वं ह्रील्लेखा परात्परा ॥ १२॥ त्वमेव प्राणसञ्चारोऽपानस्य
    निवर्तनम् । समानस्य समुल्लास उदानस्योर्ध्वदीधितिः ॥ १३॥ व्यानस्य विश्वसंव्याप्तिर्नाडीचक्रमहाधुनी
    । हंसोच्छ्वासप्रबोधैकसूत्रिणी प्राणधारिणी ॥ १४॥ त्वं वाणी वागतीतापि त्वं रमा श्रीरनुत्तमा । त्वं नीला
    निखिलच्छाया धृतिर्मेधा सरस्वती ॥ १५॥ स्मृतिः प्रज्ञा मतिः कान्तिर्बुद्धिर्लज्जा दया क्षमा । श्रद्धा
    तुष्टिर्विभूतिश्च पुष्टिः शान्तिर्विराजसे ॥ १६॥ त्वमदितिर्द्वादशार्केषु वसूनामष्टदीधितिः । रुद्राणां
    रौद्रनिर्लेपा विश्वदेवेषु चेतना ॥ १७॥ साध्यानामप्रमेयार्था मरुतां स्पन्दधारिणी । अश्विनोर्भेषजच्छाया
    पितॄणाममृताश्रुतिः ॥ १८॥ इन्द्रस्योज्जृम्भणप्रज्ञा वह्नेर्होमामृतोर्मिका । वारुणी गाम्भिरीरेखा वायोर्जीवनचञ्चला
    ॥ १९॥ धनेशस्य निधेर्निद्रा धर्मराजस्य निर्णयः । निरृतेर्निर्भयप्रान्त ईशानस्य परा धृतिः ॥ २०॥ मत्स्ये
    वेदार्णवोद्धारा कूर्मे धैर्यमहीभृतिः । क्रोडे भूगर्भनिर्मोक्षो नखरांशौ महोज्ज्वलम् ॥ २१॥ वामने विश्वसङ्कोचो
    भार्गवे ब्रह्मदीधितिः । राघवे सत्यनिःश्वासो हलिनो भूधृतिः स्थिरा ॥ २२॥ गोपाले प्रेमनिर्झारो बुद्धे
    शून्यार्थदर्शिता । कल्किनः कालवेलायां निष्कलङ्कप्रबोधिनी ॥ २३॥ काली कालाग्निनिःशेषा कपालिन्यव्ययानना
    । तारा तारकनिर्घोषा षोडशी पूर्णचन्द्रिका ॥ २४॥ भुवनेशी भुवो रेखा भैरवी भैरवध्वनिः । वज्रवैरोचनी दीप्तिर्धूम्रा
    धूम्रातिगामिनी ॥ २५॥ बगलामुखि वाक्स्तम्भा मातङ्गी नादमालिका । कमलाक्षी परा लक्ष्मीः सर्वविद्यामयी
    शिवा ॥ २६॥ कैलासे पर्वती देवि ब्रह्मलोके सरस्वती । वैकुण्ठे कमला नित्या क्षीरोदाम्भोनिवासिनी ॥ २७॥
    गोलोके कृष्णजीवात्मा राधिका रसराज्ञिका । रासमण्डलमध्यस्था रासेशी रसमञ्जरी ॥ २८॥ वृन्दा वृन्दावने नित्यं
    निकुञ्जच्छायशायिनी । स्वर्गे श्रीः सुरसद्मस्थाऽलकायां निधिरूपिणी ॥ २९॥ यत्र द्वैतं तदा लीला यत्राद्वैतं
    तदा त्वमेव । यत्रोभयं विलीयेत तत्र ते हृदयं महत् ॥ ३०॥ द्रष्टा दृश्यं च दर्शनं ज्ञाता ज्ञेयं च या
    स्वयम् । प्रमाता प्रमाणमेकं प्रमेयस्यापि कारणम् ॥ ३१॥ नादो बिन्दुः कला रेखा शक्तिः शून्यं परं पदम्
    । एतत्सर्वं त्वमेवेति निश्चयो हृदयोदयः ॥ ३२॥ तन्मात्रपञ्चकच्छाया महाभूतप्रदीपिका । इन्द्रियग्रामगहना
    चित्तवीचीविलासिनी ॥ ३३॥ नाहं न त्वं न सोऽन्योऽस्ति नैक्यं नैव पृथक्त्वता । यत्रोभयविलासोऽपि तत्र ते
    परमं वपुः ॥ ३४॥ यत्र प्रश्नो न निष्पत्तिर्यत्रोत्तरमगोचरम् । तत्र स्वयंस्फुरल्लेखा चिन्मुद्रा परिकीर्तिता
    ॥ ३५॥ अव्यक्तस्याप्यव्यक्तत्वं व्यक्तस्याप्यप्रकाशता । त्वयि स्फुरति देवेशि दीपश्चित्रपटे यथा ॥ ३६॥
    छायैव भाति भास्वत्यां भासैव छायया विना । त्वयि विश्वविलासोऽयं स्वप्नरेखेव दृश्यते ॥ ३७॥ निमेषोन्मेषयोर्मध्ये
    या विश्रान्तिरनुत्तमा । सैव ते हृदये देवि निष्कम्पा परमेश्वरी ॥ ३८॥ नादो जातो न निर्जातो बिन्दुर्नोदीयते
    क्वचित् । यत्राक्षरमपाक्षरं तत्र ते परमं पदम् ॥ ३९॥ कालो लीलाकणो यस्याः कल्पा लोमविलासिनः । युगस्रोतांसि
    निःश्वासा दिवसाः स्मितदीधितिः ॥ ४०॥ नक्षत्रनिकराः केशा ग्रहचक्रं किरीटकम् । गङ्गाप्रवाहहारश्रीर्दिगन्ताः
    कुण्डलद्युतिः ॥ ४१॥ व्योम ते नयनच्छाया वायुः प्राणप्रवाहकः । वह्निस्ते ज्ञाननिर्झारः सलिलं करुणारसः
    ॥ ४२॥ धरा धैर्यप्रभा देवि पर्वता मौनमुद्रिकाः । वनानि रोमराजीनां लताः सङ्कल्परेखिकाः ॥ ४३॥ अहोरात्रे
    निमेषौ ते ऋतवः श्वासविभ्रमाः । संवत्सरः पदस्पन्दो युगान्तः केशकम्पनम् ॥ ४४॥ ऋचो निःश्वासविस्ताराः
    सामानि स्मितवीचयः । यजूंषि हृदयोल्लासा अथर्वाङ्गिरसः श्रुतिः ॥ ४५॥ व्याकरणं पदच्छेदो निरुक्तं ते कटाक्षणम्
    । छन्दांसि चरणन्यासा ज्योतिषं नयनार्चिषः ॥ ४६॥ मीमांसा ते मनोरेखा न्यायो बुद्धेर्निरूपणम् । वेदान्तो
    हृदयावासः शून्यता ते परा गतिः ॥ ४७॥ आगमा अङ्गुलीरेखास्तन्त्राणि करपल्लवाः । मन्त्रास्ते हृदयस्पन्दा
    यन्त्राण्यस्थिविनिर्मितिः ॥ ४८॥ अकारो दक्षिणः पाद उकारो वामपादकः । मकारो हृदयाम्भोजं बिन्दुर्मौलिविभूषणम्
    ॥ ४९॥ वर्णाः कुसुमविस्तारा पदानि मधुपावलिः । वाक्यानि मकरन्दौघा अर्थाः सौरभसञ्चयाः ॥ ५०॥ ज्ञातुः पूर्वं
    त्वमेवासीज्ज्ञेयस्यापि पुरः स्थिता । ज्ञानस्याप्यन्तरालस्था स्वसंवित्परिपूरिणी ॥ ५१॥ यदा वेत्ति स्वमात्मानं
    ज्ञाता ज्ञानविवर्जितः । तदा त्वदीयमालोकं केवलं केवलं भवेत् ॥ ५२॥ यत्र शब्दो लयं याति यत्रार्थोऽपि
    विलीयते । यत्र चिन्ता स्वयं सुप्ता तत्र त्वं बोधरूपिणी ॥ ५३॥ स्वप्ने जागर्ति या नित्यं जाग्रत्यपि
    सुषुप्तिवत् । तुरीयमप्यतीतायै तस्यै लेखिन्यै नमो नमः ॥ ५४॥ द्वैतं ते क्रीडनोल्लासोऽद्वैतं ते हृदयं
    महत् । द्वैतादद्वैतसञ्चारः करुणैव पदे पदे ॥ ५५॥ अतो न वेद वेदस्त्वां न ध्याता ध्यानगोचरः । स्वयमेव
    स्वसंवेद्या स्वयमेव स्वयम्भुवा ॥ ५६॥ यस्यां लीनं जगज्जालं यस्मादुद्भाति पुनः पुनः । तामनादिमनन्तां
    त्वां चिन्मयूखां नमाम्यहम् ॥ ५७॥ न तत्त्वं तत्त्वतो ग्राह्यं नातत्त्वं त्यज्यते क्वचित् । यदुभाभ्यामतीतं
    तत् स्वयमेव त्वदात्मकम् ॥ ५८॥ यत्रोदेति न चोदेति यत्रास्तं नैव गच्छति । अनुदेयं परं ज्योतिस्तव स्फूर्तिः
    सनातनी ॥ ५९॥ येन पश्यन्ति पश्यन्तो येन ज्ञातं प्रजायते । तदेव ते पदाम्भोजं न दृश्यं दृश्यकारणम् ॥
    ६०॥ निःसीमशून्यविपिने निर्वाणामृतनिर्झरे । अव्याहतचिदुद्याने विहरन्तीं नमाम्यहम् ॥ ६१॥ अव्यक्तवर्णविन्यासैरक्षरैरक्षरातिगैः
    । स्वयं लिखसि विश्वं त्वं स्वयमेव विलुम्पसि ॥ ६२॥ यद्विलासो जगद्भाति यन्निद्रा प्रलयो मतः । यत्प्रबोधो
    महाबोधस्तदेव हृदयं तव ॥ ६३॥ स्वप्नो जागरणं मौनं नादो बिन्दुः कला लयः । एते ते केवलच्छायाः स्वरूपं
    नो निगद्यते ॥ ६४॥ प्राणे नासि मनो नासि बुद्धिर्नासि न च स्मृतिः । एतेषामन्तरालस्था स्फुरसि स्वप्रकाशिनी
    ॥ ६५॥ अन्तर्नान्तो बहिर्नान्तो मध्यो नास्ति निरूपितः । यत्र सर्वं समाप्नोति तत्ते धाम निरामयम् ॥ ६६॥
    अर्चिर्नासि तमो नासि छाया नासि न भास्करः । यदेतदुभयातीतं तदेव परमं वपुः ॥ ६७॥ अश्रुतं श्रुतिमाप्नोति
    अदृष्टं दृश्यते स्वयम् । अविज्ञातं विजानाति त्वत्प्रसादप्रदीपितम् ॥ ६८॥ वर्णे वर्णे गुहं तेजः पदे
    पदे परा गतिः । श्वासे श्वासे सुधासिन्धुर्हृदि हृद्यनघा स्थितिः ॥ ६९॥ तत्पदं चिन्मयं शान्तं सवितुर्धाम
    केवलम् । वरेण्यं निखिलाधारं भर्गो मोहान्धभेदनः ॥ ७०॥ देवस्यैव परा शक्तिर्धीमहीत्यन्तराश्रया । धियो
    यो नः प्रचोदयादित्येषा ते परा गतिः ॥ ७१॥ नोच्चार्यन्ते पदान्यत्र रहस्येन व्यवस्थिताः । मन्त्रराजस्य
    बीजानि हृदये ते विलासिनि ॥ ७२॥ यः पश्यत्यात्मनात्मानं त्वद्भासैव प्रकाशितम् । तस्य बन्धो न मोक्षो
    वा केवलं चिन्महाम्बुधिः ॥ ७३॥ यः श
