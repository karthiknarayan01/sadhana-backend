    रन्ति॒राशौष॑धीनाग्ं सं वँथ्स॒रेण॑ सवि॒ता नो॒ अह्ना थ्सामाति॑च्छन्दा उ॒ छन्दो स्स्यो॒ना नो॑ अस्तु ॥
    स्तोम॑त्रयस्त्रिग्ंशे॒ भुव॑नस्य पत्नि॒ विव॑स्वद्वाते अ॒भि नो॑ गृणाहि । घृ॒तव॑ती सवित॒राधि॑पत्यैः॒
    पय॑स्वती॒ रन्ति॒राशा॑ नो अस्तु ॥ ध्रु॒वा दि॒शां विँष्णु॑प॒त्न्यघो॑रा॒ ऽस्येशा॑ना॒ सह॑सो॒ या म॒नोता
