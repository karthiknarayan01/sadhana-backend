id: nrisimhamantrah-2
category: mantra
name:
  english: nrisimhamantrah
  devanagari: नृसिम्हमन्त्रः
content:
  english: vajradamshtra karmashayan randhaya randhaya tamo grasa grasa om svaha | abhayam mamatmani bhuyishtha
    om kshraum || iti | devibhagavatapurane ashtamaskandhe navamodhyayah
  devanagari: वज्रदंष्ट्र कर्माशयान् रन्धय रन्धय तमो ग्रस ग्रस ॐ स्वाहा । अभयं ममात्मनि भूयिष्ठा ॐ क्ष्रौम्
    ॥ इति । देवीभागवतपुराणे अष्टमस्कन्धे नवमोध्यायः
meaning: {}
source_attribution:
  text_source: sanskritdocuments.org — https://sanskritdocuments.org/doc_vishhnu/nRRisimhamantraH.html
