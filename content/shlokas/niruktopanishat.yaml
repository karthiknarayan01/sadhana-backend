id: niruktopanishat
category: upanishad
name:
  english: niruktopanishat
  devanagari: निरुक्तोपनिषत्
content:
  english: matrat kathino bhavati | dvimasabhyantare shirah sampadyate | masatrayena grivavyadeshah |
    masacatushkena tvagvyadeshah | pancame mase nakharomavyadeshah | shashthe mukhanasikakshishrotram
    ca sambhavati | saptame calanasamartho bhavati | ashtame buddhyadhyavasyate | navame sarvangasampurno
    bhavati || mritashcaham punarjato jatashcaham punarmritah | nanayonisahasrani maya yanyushitani vai
    || ahara vividha bhuktah pita nanavidhah stanah | mataro vividha drishtah pitarah suhridastatha ||
    avanmukhah pidyamano jantushcaiva samanvitah | samkhyam yogam samabhyasye purusham pancavimshakam
    || iti || tatashca dashame mase prajayate | jatashca vayuna sprishto na smarati janma maranam | ante
    ca shubhashubham karmaitaccharirasya pramanyam | | iti niruktopanishadi vimshatitamodhyayah| ashtottaram
    sandhishatamashtakapalam shirah sampadyate | shodasha vapapalani | nava snayushatani | saptashatam
    purushasya marmani | ardhacatasro romani kotayah | hridayam hyashtakapalani | dvadashakapalani jihva
    | vrishano hrishtasupanau | tata upastha
  devanagari: मात्रात् कठिनो भवति । द्विमासाभ्यन्तरे शिरः संपद्यते । मासत्रयेण ग्रीवाव्यादेशः । मासचतुष्केण
    त्वग्व्यादेशः । पञ्चमे मासे नखरोमव्यादेशः । षष्ठे मुखनासिकाक्षिश्रोत्रं च संभवति । सप्तमे चलनसमर्थो
    भवति । अष्टमे बुद्ध्याध्यवस्यते । नवमे सर्वाङ्गसंपूर्णो भवति ।। मृतश्चाहं पुनर्जातो जातश्चाहं पुनर्मृतः
    । नानायोनिसहस्राणि मया यान्युषितानि वै ।। आहारा विविधा भुक्ताः पीता नानाविधाः स्तनाः । मातरो विविधा
    दृष्टाः पितरः सुहृदस्तथा ।। अवाङ्मुखः पीड्यमानो जन्तुश्चैव समन्वितः । सांख्यं योगं समभ्यस्ये पुरुषं
    पञ्चविंशकम् ।। इति ।। ततश्च दशमे मासे प्रजायते । जातश्च वायुना स्पृष्टो न स्मरति जन्म मरणम् । अन्ते
    च शुभाशुभं कर्मैतच्छरीरस्य प्रामाण्यम् । । इति निरुक्तोपनिषदि विंशतितमोध्यायः। अष्टोत्तरं सन्धिशतमष्टाकपालं
    शिरः संपद्यते । षोडश वपापलानि । नव स्नायुशतानि । सप्तशतं पुरुषस्य मर्माणि । अर्धचतस्रो रोमाणि कोटयः
    । हृदयं ह्यष्टकपलानि । द्वादशकपलानि जिह्वा । वृषणो हृष्टसुपणौ । तत उपस्थ
