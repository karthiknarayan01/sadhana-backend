id: shiva108shtr
category: stotram
name:
  english: shiva108shtr
  devanagari: शिव१०८ष्त्र्
content:
  english: shantakaram shikharishayanam nilakantham suresham vishvadharam sphatikasadrisham shubhravarnam
    shubhangam | gaurikantam tritayanayanam yogibhirdhyanagamyam vande shambhum bhavabhayaharam sarvalokaikanatham
    || dhavalavapushamindormandale samnivishtam bhujagavalayaharam bhasmadigdhangamisham | harinaparashupanim
    carucandrardhamaulim hridayakamalamadhye santatam cinmayami || shrivishnuruvaca | om shivo maheshvarashshambhuh
    pinaki shashishekharah | vamadevo virupakshah kapardi nilalohitah || 1|| shankarashshulapanishca khatvangi
    vishnuvallabhah | shipivishto'mbikanathah shrikantho bhaktavatsalah || 2|| bhavashsharvastrilokeshashshitikanthashshivapriyah
    | ugrah kapali kamarirandhakasurasudanah || 3|| gangadharo lalatakshah kalakalah kripanidhih | bhimah
    parashuhastashca mrigapanirjatadharah || 4|| kailasavasi kavaci kathorastripurantakah | vrishanko
    vrishabharudho bhasmoddhulitavigrahah || 5|| samapriyassvaramayastrayimurtiranishvarah | sarvajnah
    paramatma ca somasuryagnilocanah || 6|| haviryajnamayassomah pancavaktrassadashivah | vishveshvaro
    virabhadro gananathah prajapatih || 7|| hiranyareta durdharshah girisho girisho'naghah | bhujangabhushano
    bhargo giridhanva giripriyah || 8|| krittivasa puraratirbhagavan pramathadhipah | mrityunjayassukshmatanurjagadvyapi
    jagadguruh || 9|| vyomakesho mahasenajanakashcaruvikramah | rudro bhutapatih sthanurahirbudhnyo digambarah
    || 10|| ashtamurtiranekatma sattvikashshuddhavigrahah | shashvatah khandaparashurajah pashavimocakah
    || 11|| mridah pashupatirdevo mahadevo'vyayo harih |
  devanagari: शान्ताकारं शिखरिशयनं नीलकण्ठं सुरेशं विश्वधारं स्फटिकसदृशं शुभ्रवर्णं शुभाङ्गम् । गौरीकान्तं
    त्रितयनयनं योगिभिर्ध्यानगम्यं वन्दे शम्भुं भवभयहरं सर्वलोकैकनाथम् ॥ धवलवपुषमिन्दोर्मण्डले संनिविष्टं
    भुजगवलयहारं भस्मदिग्धाङ्गमीशम् । हरिणपरशुपाणिं चारुचन्द्रार्धमौलिं हृदयकमलमध्ये सन्ततं चिन्मयामि ॥
    श्रीविष्णुरुवाच । ॐ शिवो महेश्वरश्शम्भुः पिनाकी शशिशेखरः । वामदेवो विरूपाक्षः कपर्दी नीललोहितः ॥ १॥
    शङ्करश्शूलपाणिश्च खट्वाङ्गी विष्णुवल्लभः । शिपिविष्टोऽम्बिकानाथः श्रीकण्ठो भक्तवत्सलः ॥ २॥ भवश्शर्वस्त्रिलोकेशश्शितिकण्ठश्शिवाप्रियः
    । उग्रः कपाली कामारिरन्धकासुरसूदनः ॥ ३॥ गङ्गाधरो ललाटाक्षः कालकालः कृपानिधिः । भीमः परशुहस्तश्च मृगपाणिर्जटाधरः
    ॥ ४॥ कैलासवासी कवची कठोरस्त्रिपुरान्तकः । वृषाङ्को वृषभारूढो भस्मोद्धूलितविग्रहः ॥ ५॥ सामप्रियस्स्वरमयस्त्रयीमूर्तिरनीश्वरः
    । सर्वज्ञः परमात्मा च सोमसूर्याग्निलोचनः ॥ ६॥ हविर्यज्ञमयस्सोमः पञ्चवक्त्रस्सदाशिवः । विश्वेश्वरो
    वीरभद्रो गणनाथः प्रजापतिः ॥ ७॥ हिरण्यरेता दुर्धर्षः गिरीशो गिरिशोऽनघः । भुजङ्गभूषणो भर्गो गिरिधन्वा
    गिरिप्रियः ॥ ८॥ कृत्तिवासा पुरारातिर्भगवान् प्रमथाधिपः । मृत्युञ्जयस्सूक्ष्मतनुर्जगद्व्यापी जगद्गुरुः
    ॥ ९॥ व्योमकेशो महासेनजनकश्चारुविक्रमः । रुद्रो भूतपतिः स्थाणुरहिर्बुध्न्यो दिगम्बरः ॥ १०॥ अष्टमूर्तिरनेकात्मा
    सात्त्विकश्शुद्धविग्रहः । शाश्वतः खण्डपरशुरजः पाशविमोचकः ॥ ११॥ मृडः पशुपतिर्देवो महादेवोऽव्ययो हरिः
    ।
