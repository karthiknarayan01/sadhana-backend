id: gayatri-manjari
category: stotram
name:
  english: gayatri manjari
  devanagari: गायत्री मन्जरी
content:
  english: pradayika | turiyavasthitirloke sadhakam tvadhigacchati || 27|| nada bindu kalanam tu purna
    sadhanaya khalu | nanvanandamayah koshah sadhake hi prabuddhyate || 28|| bhulokasyasya gayatri kamadhenurmata
    budhaih | loka ashrayanenamum sarvamevadhigacchati || 29|| pancasya yastu gayatryah vidyam yastvavagacchati
    | pancatattva prapancattu sa nunam hi pramucyate || 30|| dashabhujastu gayatryah prasiddha bhuvaneshu
    yah | panca shula mahashulanyetah sanketayanti hi || 31|| dashabhujannametasam yo rahasyam tu vetti
    yam sah | trasam shulamahashulanam na naivavagacchati || 32|| drishtistu doshasamyukta pareshamavalambanam
    | bhayam ca kshudrata'savadhanata svarthayuktata || 33|| avivekastathaveshastrishnalasyam tathaiva
    ca etani dasha shulani shuladani bhavanti hi || 34|| nijairdashabhujairnunam shulanyetani tu dasha
    | samharate hi gayatri lokakalyanakarini || 35|| kalau yuge manushyanam shariraniti parvati | prithvi
    tattva pradhanani janasyeva bhavanti hi || 36|| sukshmatattva pradhananyayugodbhuta nrinamatah | siddhinam
    tapasamete na bhavantyadhikarinah || 37|| pancanga yoga samsiddhya gayatryastu tathapi te | tadyuganam
    sarvashreshtham siddhim samprapnuvanti hi || 38|| gayatrya vamamargiyam jneyamatyuccasadhakaih | ugram
    pracandamatyantam vartate tantra sadhanam || 39|| ata eva tu tadguptam rakshitam hi vicakshanaih |
    syadyato durupayogo na kupatraih kathamcana || 40|| gurunaiva priye vidya tattvam hridi prakashyate
    | gurum vina tu sa vidya sarvatha nishphala bhavet || 41|| gayatri tu paravidya tatphalavaptaye guruh
    | sadhakena vidhatavyo gayatri
  devanagari: प्रदायिका । तुरीयावस्थितिर्लोके साधकं त्वधिगच्छति ॥ २७॥ नाद बिन्दु कलानां तु पूर्ण साधनया
    खलु । नन्वानन्दमयः कोशः साधके हि प्रबुद्ध्यते ॥ २८॥ भूलोकस्यास्य गायत्री कामधेनुर्मता बुधैः । लोक
    आश्रयणेनामूं सर्वमेवाधिगच्छति ॥ २९॥ पञ्चास्या यास्तु गायत्र्याः विद्यां यस्त्ववगच्छति । पञ्चतत्त्व
    प्रपञ्चात्तु स नूनं हि प्रमुच्यते ॥ ३०॥ दशभुजास्तु गायत्र्याः प्रसिद्धा भुवनेषु याः । पञ्च शूल महाशूलान्येताः
    सङ्केतयन्ति हि ॥ ३१॥ दशभुजान्नामेतासां यो रहस्यं तु वेत्ति यं सः । त्रासं शूलमहाशूलानां ना नैवावगच्छति
    ॥ ३२॥ दृष्टिस्तु दोषसंयुक्ता परेषामवलम्बनम् । भयं च क्षुद्रताऽसावधानता स्वार्थयुक्तता ॥ ३३॥ अविवेकस्तथावेशस्तृष्णालस्यं
    तथैव च एतानि दश शूलानि शूलदानि भवन्ति हि ॥ ३४॥ निजैर्दशभुजैर्नूनं शूलान्येतानि तु दश । संहरते हि गायत्री
    लोककल्याणकारिणी ॥ ३५॥ कलौ युगे मनुष्याणां शरीराणीति पार्वति । पृथ्वी तत्त्व प्रधानानि जानास्येव भवन्ति
    हि ॥ ३६॥ सूक्ष्मतत्त्व प्रधानान्ययुगोद्भूत नृणामतः । सिद्धीनां तपसामेते न भवन्त्यधिकारिणः ॥ ३७॥ पञ्चाङ्ग
    योग संसिद्ध्या गायत्र्यास्तु तथापि ते । तद्युगानां सर्वश्रेष्ठां सिद्धिं सम्प्राप्नुवन्ति हि ॥ ३८॥
    गायत्र्या वाममार्गीयं ज्ञेयमत्युच्चसाधकैः । उग्रं प्रचण्डमत्यन्तं वर्तते तन्त्र साधनम् ॥ ३९॥ अत एव
    तु तद्गुप्तं रक्षितं हि विचक्षणैः । स्याद्यतो दुरुपयोगो न कुपात्रैः कथंचन ॥ ४०॥ गुरुणैव प्रिये विद्या
    तत्त्वं हृदि प्रकाश्यते । गुरुं विना तु सा विद्या सर्वथा निष्फला भवेत् ॥ ४१॥ गायत्री तु पराविद्या
    तत्फलावाप्तये गुरुः । साधकेन विधातव्यो गायत्री
