id: sree-kaala-hastiswara-satakam-telugu
category: stotram
name:
  english: Sree Kaala Hastiswara Satakam (Telugu)
content:
  english: shrividyutkalita'javanjavamaha ravegambuna manmanobjasamudi sevam damaratamparai maniyèdan
    || vanivallabhadurlabhambagu bhavaddvarambuna nnilci ni rvanashri jucina vicaradrohamo nitya ka lyanakridala
    basi durdashalapa lai rajalokadhama shrenidvaramu duṟa jesi tipudo shri kalahastishvara || anta midhya
    talanci cucina narum datlau tèṟingin sada kanta lputrulu nardhamun tanuvu ni kkambancu moharnava cibhrantim
    jèndi jarincu gani paramardhambaina niyandu jintakantayu jinta nilpa dugada shri kalahastishvara batumata
    vinuma niceta jitambu ne ganim battaka santatambu madi vedkam gòltu nantassapa tnanikambuna kòppagimpakumu
    nannapatiye calu de jinòllam gari nòlla nòlla sirulan shri kalahastishvara || bhavakelimadiramadambuna
    maha papatmu dai vidu na nnu vivekimpa datancu nenu narakarnorashipalaina balundòkacota natatamitoda
    nnuta dam dri vicarimpaka yunduna katakata shri kalahastishvara jesi yenòkani gòlvambotino kaka ne
    nimata nvinanòllakunditinò ninne dikkuga judano yemi ittivridhaparadhinagu nanni duhkhavarashivi ci
    madhyambuna munci yumpadaguna shri kalahastishvara || divijakshma ruha dhenu ratna ghanabhuti prasphuradratnasa
    nuvu ni villu nidhishvarundu sakhu darnorashikanyavibhum duvishesharcaku dinka nikèna ghanundum galgune
    nivu cu ci vicarimpavu lemi nèvva dudupun shri kalahastishvara || nito yudhdhamu ceya no gavita nirmanashakti
    nninum britunjeyagalenu nikòṟaku dandrinjampaga jala na cetan rokata ninnumòttavèṟatunjikaku nabhakti
    ye ritinnaki ka ninnu judagalugan shri kalahastishvara || alumbiddalu dallidandrulu dhanambancu nmahabandhanam
    bela namèda gattinadavika ninnevela jintintu ni rmulambaina manambulo nègadu durmohabdhilo grunki
    yi shilamalapu jinta nètludipèdo shri kalahastishvara || nippai patakatulashaila madacun ninamamun
    manavul tappan davvula vinna nantaka bhujadarpoddhatakleshamul tappundarunu muktu laudu ravi shastrambulmahapanditul
    cèppanga damakinka shanka valèna shri kalahastishvara || vidèmbabbina yappudum dama nutul vinnappudumbòttalo
    gudunnappudu shrivilasamulu paikònnappudum gayakul padanga vinunappudun jèla gu dambhaprayavishranana
    kridasaktula nemi cèppavalèno shri kalahastishvara || ninu sevimpaga napadal vòdamani nityotsavam
    babbani janamatrundanani mahatmu danani samsaramohambu pai kònani jnanamu galgani grahaganul gundimpani
    meluva ccina rani yavi naku bhushanamulo shri kalahastishvara || e vedambu bathincè luta bhujangam
    beshastramulsucè da ne vidyabhyasanambònarcè gari cèncemantra muhincè bo dhavirbhavanidanamul caduvulayya
    mipadasam sevasaktiyè kaka jantutatikin shri kalahastishvara || kayal gacè vadhunakhagramulace gayambu
    vakshojamul rayan rapadè ṟòmmu manmadha viharakleshavibhrantice brayam bayènu battagattè dalacèppan
    rota samsarame gadave shri kalahastishvara || ninnerupamuga bhajintu madilo nirupu mokalò stri canno
    kuncamu mekapèntikayò yi sandehamulmanpi na kannara nbhavadiyamurti saguna karambuga jupave cinnirejaviharamattamadhupa
    shri kalahastishvara kili gavumantinò marunnilakabhranti gum tèna pòmmantinò yèngilicci tinu tinte
    gani kadantino ninu nèmmindaga vishvasincusujananikambu rakshimpa je sina navinnapamela gaikònavaya
    shri kalahastishvara jalan jampanga netramu ndiviyangashaktundane ganu na shilam bemani cèppanunnadi
    ka ni cittambu na bhagyamo shrilakshmipatisevitanghriyugala || rajul mattulu variseva narakaprayambu
    variccunam bhojakshicaturantayanaturagi bhushadu latmavyadha bijambul tadapeksha calu maritriptim
    bònditin jnanala kshmijagratparinama mimmu dayato shri kalahastishvara dudamòdal negana nivainaco
    rara rammani yancu jèppavu pridharambhambu linketikin nira nmumpumu pala mumpu mi dam jumi shriramarcita
    padapadmayugala shri kalahastishvara || niku nmamsamu vanchayeni kaṟava niceta ledunda jokainatti
    kutharamunda nanala jyotunda nirunda ga bakam bòppa ghatinci cetipunukan bhakshimpakaboyace jekòm
    tèngilimamsamitlu daguna shri kalahastishvara jandurundu rarajai kuberundu dri grajivambuna gancè
    duhkhamu kurukshmapalu damatane yajim gulè samastabandhuvulato na rajashabdhambu ci chi janmantaramandu
    nòllanujumi shri kalahastishvara dainaco nècata dharmambundu neriti na najatikriya lerpadun sukhamu
    manyashreni kètlabbu ru pajivaliki nedi dikku dhritini bhaktul bhavatpadani rejambul bhajiyintu retèṟa
    gunan shri kalahastishvara gal pippalapatramul mèṟa gu taddambul maruddipamul karikarnantamu lèndamavula
    tatul khadyotkitaprabhal suravidhilikhitaksharambu lasuvul jyotsnapahpindamul sirulandela madandhulauduru
    janul shri kalahastishvara || ninnunnammina riti namma nòrulan nikanna nakènnale rannalammulu tallidandrulu
    gurundapatsahayundu na yanna yènnadu nannu samskritivishadambhodhi datinci ya chcinnanandasukhabdhi
    delcèdò kade shri kalahastishvara || ni pancam badiyundaga galiginan bhikshanname calu n kshepam babbina
    rajakitamula nesevimp jutti trippakumu samsarardhamai bantuga jepattam daya galgeneni madilo shri
    kalahastishvara || ni perun bhavadanghritirdhamu bhavannishthyuta tambulamun ni pallèmbu prasadamum
    gònikada ne biddanaina da na nnipatim garunimpu mo ka ninèvvarikim biddaga dagado shri kalahastishvara
    || amma yayya yatancu nèvvarini nenannanshiva dallidandrulanatancu njuda du nive kaka samsarapum jimmanjikanti
    gappina ngadavu nan shri kalahastishvara || kòdukul putta ratancu nedtu ravivekul jivanabhrantulai
    kòdukul puttarè kauravendruna kanekul varice negatul vadasèm butrulu leni ya shukunakun batillène
    durgatul cèdune mokshapadam maputrakunakun shri kalahastishvara || grahadoshambulu durnimittamulu
    nikalyananamambu pra tyahamum berkònuttamottamula badhambèttaganopune dahanum gappanganjalune shalabhasantanambu
    ni seva je si hataklesulu garugaka manujul shri kalahastishvara || adugammonika nanyamargaratulambranavanotsahinai
    yadugamboyina modu nidu padapadmaradhakashreniyu nnèdaku nninnu bhajimpanga ganiyu nakela parapeksha
    ko rèdi dinkemi bhavatprasadamè tagun shri kalahastishvara || madamatangamu landalambula harul manikyamu
    lpallakul mudital citradukulamu lparimalambu lmokshami madilo vini napekshasesi nripadhamadvaradeshambu
    ga ci dinambul vridhaputturajnulakata shri kalahastishvara || rosi royadu kaminijanula tarunyorusaukhyambulan
    pasi payaru putramitrajana sampadbhranti vanchalatal kosi koyadu namanam bakata nikum britiga sat
    kriyal cesi ceyadu dini trullanapave shri kalahastishvara || ènnellundu nemi gandu ni kanenèvvari
    rakshincèdan ninne nishtha bhajincèda nnirupamonnidrapramodambu na kènnandabbèdu nntakalami ka nenitlunna
    nemayyèdim jinnambuccaka nannu nelukòlave shri kalahastishvara || cavam galamu ceruvau tèṟi ga leka
    na nnèvaidyundu cikitsa do yemandu rakshincuno e velpul kripa juturo yanucu ninnintaina jesikònna
    yatiyun shri kalahastishvara || dinamum jittamulo suvarnamukhari tirapradeshamraka nanamadhyopala
    vedikagramuna nanandambunam bankaja nananishtha nnunu gannanadivo saukhyambu lakshmivila sinimayanatanal
    sukhambu lagune shri kalahastishvara gatti daniki navatyashreni galpinci ta dbhalavratamu niccipuccutanu
    sambandhambu gavinci ya malarmambuna bandhavam banèdi premam gòndaṟam drippa silansila yamarcina tlòsa
    gito shri kalahastishvara || tanuve nityamuga nònarcu madileda cacci janmimpakum da nupayambu ghatimpu
    magatula rènta nnerpu lekunna le dani nakippuda cèppu ceya gala karyambunna samseva gaka kalamunano
    shri kalahastishvara || padunalgelè mahayugambu lòka bhupalundu cèllincè na yyudayastacalasandhi najna
    nòka dayushmantundai viriya bhyudayam bèvvaru cèppa ga vinarò yalpulmattulai yela ca ccèdaro rajula
    mancu nakkatakata || rajannantanè povuna kripayu dharmambabhijatyambu vi dyajatakshama satyabhashanamu
    vidvanmitrasamrakshayun sauganyambu kritambèṟungatayu vishvasambu gakunna du rbijashreshthulu ga gatambu
    galade shri kalahastishvara || munu nice napavargarajyapadavi murdhabhishekambu gam cina punyatmulu
    nenu nòkkasarivo cintinci cudanga nè tlaninam gitaphanindrapotamadave dandograhimsavica rini ganga
    gaka madilo shri kalahastishvara || pavamanashanabhushanaprakaramun bhadrebhacarmambu na priyambulai
    bhugahashundalatavicarulan bhavaduhkhambula dimbatinci kaivalyami cci vinodincuta kemi karanamaya
    shri kalahastishvara || amarastrila ramincinam jèdadu moham bintayun brahmapa ttamu sidhdhincina nasa
    diṟadu nirudhakrodhamun sarvalo kamula nmringina mana dindu gadatun shri kalahastishvara || canuvarim
    gani yedcuvaru jamu da satyambuga vattu me manumanambi ka ledu nammamani taravela narevunan munu gambovucu
    basa seyuta sumi mummatikim judaga jènatu lganaru dinibhavamidivo shri kalahastishvara || bhavaduhkhambulu
    rajakitamula nebrardhincinam bayune bhavadanghristuticeta gaka vilasadbalakshudhakleshadu shtavidhulmanunè
    cuda me kamèdacantandalli karunyadba shthivisheshambuna nicci canta balè no shri kalahastishvara ||
    pavi pushpambagu nagni mancagu nakuparambu bhumisthalam bavu shatrum datimitru dau vishamu divyaharamau
    nènna ga navanimandalilopalan shiva shive tyabhashanollasikin shiva ni namamu sarvavashyakaramau shri
    kalahastishvara gandhamulaphalamul levo guhal toyamul levo yeṟula ballavastaranamul levo sada yatmalo
    levo nivu viraktula nmanupa jalim bòndi bhupaluran seval seya bodu relòkò janul shri kalahastishvara
    buttina puttu lènni galavo mohambuce nandu je sina karmambula provu lènni galavo cintincinan gana
    ni jananambe yani yunna vada nidiye calimpave ninnu gò lcina punyambunakum griparatu davai shri kalahastishvara
    || tanu vèndaka dharitri nundu nanu nandakan maharogadi panaduhkhadula bòndakunda nanukampadrishti
    vikshinci ya vènukan nipadapadmamul dala cucun vishvaprapancambu ba sina cittambuna nunda jeyangadave
    shri kalahastishvara || malabhuyishta manojadhamamu sushumnadvaramo yaru kum daliyo padakarakshiyugmambulu
    shatkanjambulo momu da jalajambo nitalambu candrakalayo sangambu yogambò ga sili sevinturu kantalan
    bhuvi janul shri kalahastishvara || jalakambul rasamul prasunamulu vacabandhamul vadyamu lkalashabdhadhvanu
    lancitambara malankarambu diptu lmèṟum gulu naivedyamu madhuri mahimaga gòltunninun bhaktiram jila
    divyarcana gurci nercina kriyan shri kalahastishvara || elila nnutiyimpavaccu nupamotprekshadhvanivyangyasha
    bdhalankaravisheshabhashala kalabhyambaina nirupamum jalu gavitvamulnilucune satyambu varnincuco ci
    lajjimparugaka madrishakavul shri kalahastishvara bèttèdam guduvara papanna ra yanna le lelèmmanna
    narantipandlu gòni telekunna nenòllanam te lalimpare tallidandrulapu datle tècci vatsalya la kshmililavacanambulam
    gudupara shri kalahastishvara || kalalancun shakunambulancu grahayogam bancu samudrikam bu latancum
    dèvulancu dishtmanucun bhutambulancu nvisha dulatancu nnimishardha jivanamulancum briti buttinci yi
    silugul pranulakènni cesitivaya shri kalahastishvara dam gusumaprasada malikasthanambupai bhutiyun
    galasimambuna danda nasikatudan gandhaprasarambu lo pala naivedyamu dabhaktundu nikèppudum jèlikadai
    viharincu raupyagiripai shri kalahastishvara || alum biddalu mitrulun hitulu nishtardhambu linerture
    vela nvari bhajimpa jalipada kavirbhuta modambunam galambèlla sukhambu niku ni ka bhaktashreni rakshimpake
    shrilèvvariki gudambèttèdavaya shri kalahastishvara || sulabhulmurkhu lanuttamottamula rajulgalgiyevela
    na nnalantalabèttina ni padabdhamula bayanjala nemiccinam galadhautacala melu tambunidhilo gapundu
    tabjambu pai jèluvòppun sukhiyimpa gancuta sumi shri kalahastishvara || kaladhautadriyu nasthimalikayu
    gogandharvamun bunkayum bulitolu nbhasitambu butlakai tòli nevaralatoda buttaka kaladulgalgè melayyèna
    siluvuluramucesikòm tèṟingiye shri kalahastishvara || shrutulabhyasamucesi shastragarimal shodhinci
    tattvambulan mati nuhinci sharira masthiramu brahmambènna satyambu gam citi mancun sabhalan vridhavacanamu
    lcèppangane kani ni rjitacittasthira saukhyamul dèliyaro shri kalahastishvara || gati nivancu bhajincuvara
    lapavargam bòndaganela sam tatamum gutikinai carimpa vinaleda yayu rannam praya cchati yancunmòṟavèttaga
    shrutulu samsarandhakarabhi du shitadurmargul gana ganambadavo shri kalahastishvara || ratira juddhati
    miṟa nòkkapari gorajashvuni nnòtta dadarpaku vega nòtta gavayam bambotunum da boradanganunna yunnadimi
    le galvolè shokanala sthitipalai mòṟapèttunan manupave shri kalahastishvara || anta samshayame shariraghatanambanta
    vicarambè lo nanta duhkhaparamparanivitamè menanta bhayabhrantame yantanantasharirashoshanamè durvyaparame
    dehikin jintan ninnu dalanci pòndaru narul shri kalahastishvara jalunjalu ratirajadvarasaukhyambulan
    shantin bònditi jalu bahurajadvarasaukhyambulan shantim bòndèda jupu brahmapadarajadvarasaukhyambu
    ni shcintan shantu da naudu ni karunace shri kalahastishvara jeyanòllani vratasthulvolè vesambuto
    butri putra kalatra rakshana kalabudhdhin nripala dhaman batram bancu bhajimpa bodu ritiyun bhashyambè
    yivvarica ritram bènna du mècca nènca madilo shri kalahastishvara || akalankasthiti nilpi nada manu
    ghanta ravamun bindudi pakalashreni vivekasadhanamulòppan buni yanandata rakadurgatavilo manomrigamugarvasphurti
    varincuva riki ga vidu bhavograbandhalatikal shri kalahastishvara || òkayardhambu ninnu ne naduga
    bò mmu kavitvambulu naku jèndanivi yemo yantiva naduji hvaku naisargika kritya mintiya sumi prardhincute
    kadu ko rikala nninnunugana naku vashama shri kalahastishvara || shukamul kimshukapushpamul gani phalastomam
    batancunsamu tsukatam dera bovu naccata maha duhkhambu siddhincu brapulagu shastrambu lvilokincuva
    riki nityatvamanisha duramagu ju shri kalahastishvara || òkarim jampi padasthulai bratuka damòkkòkka
    ruhinture lòkò tamènna bovo sampadal putrami trakalatradulatoda nitya sukhamandam ganduro yunnava
    riki ledo mriti yènna dum gatakata shri kalahastishvara denicalayambula jòram dekarpanyapu matalada
    narugam dèvvarito veshamul gaikode matamul bhajimpa dilanekashtaprakarambulan jikakai cèdipo du jivanadashan
    shri kalahastishvara || jnatul drohambu vandru seyukapateryadi kriyadoshamul matandrana sahimparadu
    pratikarmambincuke jeyaga bote dosamu gana mani yatinai po gorinan sarvada cetahkrodhamu mana dètlu
    nadutun shri kalahastishvara || caduvul nercina panditadhamulu svecchabhashanakridalan vadaran samshayabhikaratavulam
    drovalappi vartimpa ga madanakrodhakiratulandu kinam jèdarum jittamu cittagimpa gadave shri kalahastishvara
    ta dentidi manò rogasthundai dehi ta putambu li dehamul musindentidi mu talentivi sadamudhatvame kani
    ta jesindentidi centale tivi vridha shri kalahastishvara || shri shaileshu bhajintuno yabhavunganci
    nadhu sevintuno kashivallabhu gòlvambodunò maha kaleshu bujintuno nashilam banuvaina meru vanucun
    rakshimpave ni kripa shri shringaravilasahasamulace shri kalahastishvara || ayavarai cariyimpavaccu
    bhojatirdhambulan dayato gòmmanavaccu sevakuni yardhapranadehadula nniyu na sòmmanavaccu gani sirulannindinci
    ninnatmani shkriyatam gana garadu panditulakun shri kalahastishvara bòdigamardhinciro vikrama jampiro
    kapatalakshmi mohamum basiro yayurdayabhujangamrityuvu nanayasambunan gèlciro shreyodayak laudu rèttu
    litarul shri kalahastishvara danusangharshanasvadamòm da vinirmincèda vela jantuvula netatkridale
    pataka vyavaharambalu seyunemitiki mayavidyace bròddupu cci vinodimpa ga dina nemi phalamo shri kalahastishvara
    || vènukam jesina ghoradurdashalu bhavimpanga ro tayyèdun vènukan mundata vaccu durmaranamul vikshimpa
    bhitayyèdun nanu ne judaga navidhulalanciyun nake bhayam bayyèdum jènakunji galamunakun shri kalahastishvara
    || parishilinciti mantratantramulu cèppa nvinti sankhyadiyo ga rahasyambulu veda shastramulu vakkanincitin
    shankavo darayam gummadikayaloni yavaginjantaina nammicnci su sthiravijnanamu trova gadave shri kalahastishvara
    || mòdalam jesinavari dharmamulu nirmulambuga jesi du rmadulai yippudu varè dharmamu lònarpam dammu
    daivambu na vvadè ranunna duratmulèlla damatrovam bovare ela ce sèdaro mi du dalancicuda kadhamul
    shri kalahastishvara || kasantaina sukham bònarcunò manahkamambu lidercuno visambainanu vèntavaccunò
    jagadvikhyati gavincuno dosambu lbèda bòpuno valasinandodto mimum jupuno chi samsaradurasha yeludupavo
    shri kalahastishvara tincuka kuda takkuvagune norvangale dèndako paka nidanvèdakum jalim jadici kumpatlèttuko
    jucu va naku nindindlunu duṟu nitanuvu dinanvaccu saukhyambu ro si kadasimparugaka martvulakata shri
    kalahastishvara || kedaradisamastatirdhamulu korminjuda tikin gada mungili varanasi kadupe kailasashailambu
    mi padadhyanamu sambhavincunapude bhavimpa najnanala kshmidaridryulu garè loku lakata baranganajanapara
    dravyambulan mruccilam ga mahodyogamu seyanèmmanamudòngam batti vairagyapa shamulam jutti bigimanci
    niducarana stambhanjunam gattivai ci mudam bèppudu jeya gadave shri kalahastishvara || vedham dittagaradugani
    bhuvilo vidvamsulanjeya ne la dhicaturi jesina gulamapatane poka kshu dbadhadul galigimpanela yadi
    krityambaina durmargulam ji || pudami nninnòka bilvapatramunane bujinci punyambunum badayanneraka
    pèkkudaivamulakum bappul prasadambulam gudumul dosèlu sarèsattuladukul guggillunum bettucum jèdi yèndum
    gòṟagakapodu rakata || vittajnanamu padu cittamu bhavaveshambu rakshambuvul mattatvambu tadankuram
    ainritamul maṟaku latyantadu dvrittul puvvulu bandlu manmadhamukha virbhutadoshambulum jittadhyunnatanimbabhujamunakun
    shri kalahastishvara gapyamu cèppucunna yata dunnipadyamul vrasiyi mma pathammònarintunanna yata dun
    manjuprabandhambu ni shtapurtim bathiyincucunna yata dun sadbandhavul gaka ci ci prishthagatabandhavambu
    nijama droli ripulan jankinci yakankshalan dampulvètti kalankamu lnaṟaki bandhakleshadoshambulam jimpulsesi
    vayovilasamulu sankshepinci bhutambulam jèmpalveyaka ninnu gananaguna shri kalahastishvara || rajashreniki
    dasulai sirula goram jeranga saukhyamo yi janmambu tarimpa jeyagala mimme pròddu sevincu ni rvyajacaramu
    saukhyamo tèliyalerau manavu lpapara jijatatimadandhabuddhu lagucun shri kalahastishvara || ninnam
    judarò mònna judaro janul nityambu javanga na pannu lgannanidhana mayyèdi dhanabhrantin visarjimpale
    kunna rènna du ninnu gandu rika martvul gòlvaremo ninun vinnam bovaka yanyadaivaratulan shri kalahastishvara
    gutoluduppatamu buvvakalakutambu ce ginne brahmakapala mugramagu bhoge kanthaharambu mel ninnilaguna
    nuntayum dèlisiyun nipadapadmambu ce rcèn narayanu da shri kalahastishvara jancukijanavratambu dandammulan
    dorantsthali bagganam bòducucun durbhashalada nmaṟin varim brardhanacesi rajulaku sevalseya borula
    kshmirajyambunu gori nimarijanul shri kalahastishvara || ururam janulèlla biksha midaroyundam guhalgalgavo
    ciranikamu vidhulam dòrukaro shitamritasvacchavah puram berula baṟado tapasulambrovanga nivopavo ceram
