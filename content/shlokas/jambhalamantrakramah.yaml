id: jambhalamantrakramah
category: mantra
name:
  english: jambhalamantrakramah
  devanagari: जम्भलमन्त्रक्रमः
content:
  english: om asya shrikrishnajambhalamantrasya bhagavan akshobhya rishih | brihati chandah | shrikrishnajambhaladevata
    | jam bijam | hum shaktih | phat kilakam | mama sarvavighnavinashaya rinamocanartham ca jape viniyogah
    || mantrah
  devanagari: ॐ अस्य श्रीकृष्णजम्भलमन्त्रस्य भगवान् अक्षोभ्य ऋषिः । बृहती छन्दः । श्रीकृष्णजम्भलदेवता
    । जं बीजम् । हूं शक्तिः । फट् कीलकम् । मम सर्वविघ्नविनाशाय ऋणमोचनार्थं च जपे विनियोगः ॥ मन्त्रः
meaning: {}
