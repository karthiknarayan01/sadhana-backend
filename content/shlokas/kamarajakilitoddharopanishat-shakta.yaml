id: kamarajakilitoddharopanishat-shakta
category: upanishad
name:
  english: kamarajakilitoddharopanishat (shakta)
  devanagari: कामराजकीलितोद्धारोपनिषत् (शाक्त)
content:
  english: kamarajakilitoddharopanishat athovaca kamarajam | tadupasanat kushalam labhet | shriyam labhet
    | gurvim vanim labhet | sarvayuvatinam priyo bhavet | prathamam kamastatah shaktistadanu turiyam dvavetau
    paraitani pancaksharani bhavanti | tatah shunyam ca dvau divakaraharau | tadanu gotrabhrinmaya | etani
    shadaksharani bhavanti | tatashcandrah prajapatishakrau | tato maya | etani caturaksharani bhavanti
    | adyam vagbhavam dvitiyam kamarajam tritiyam shaktibijam shuklam tarugadivakarabham shashikantam
    kramena smaret | kapharaditvatkilita | kotijapat siddhirna jayate | yada manmathakaladirbhavati tada
    nishkilita bhavet | siddhida bhavet | sa viryavati bhavet | trailokyam vashamanayet | pujanaddaurbhagyanasho
    bhavet | japat siddhishvaro bhavet | iti shivam || 1|| athadyam shambhavam dvitayam shaktam ceti gurumukhat
    jnatavyam | anyatha shapamapnuyat | upasana dvividha | shambhavam shaktam ceti | evam lopanallopa
    | prathamam shambhucandrau | tadanu divakarendrau | tatah parabijam vagbhavam | tatah kamarajam shivacandrakamashambhuharayah
    | parabijam shaktih | kamaparamadhye devarajametacchaktikutam | etena pancadashaksharani bhavanti
    | shambhupradhanatvacchambhavam | purno'ham shivo'hamadvaitarupo'ham nityanandarupo'ham iti smaret
    | napi pujayam vrataniyamah | sarvada japam caret | vinodatah kaminimadhye kami nirdrishtva ca sadanandarupo
    bhavet | divyangaragaurdeham bhrishayet sugandhamalyambaralankaradyaih | mamsadyaih shuddhaih sumadhurairbhojayet
    | bhapancakena puja karya | sada kauliko bhavet | kulacagat sarvasiddhishvaro bhavet | ekaki shaktiyukto
    bhavet | madanam bhuktva shaktibhugbhavet | shakticakram pujayet | bhogena shivam mokshamapnuyat |
    shaktiharshotpadanacchaktih prita bhavati | iti shivam || 2|| atha vakulairarcayet | raktapushpairarcayet
    | tadabhave jalaistadabhabe manasim bhaktimacaret | iti shivam || 3||
  devanagari: कामराजकीलितोद्धारोपनिषत् अथोवाच कामराजम् । तदुपासनात् कुशलं लभेत् । श्रियं लभेत् । गुर्वीं
    वाणीं लभेत् । सर्वयुवतीनां प्रियो भवेत् । प्रथमं कामस्ततः शक्तिस्तदनु तुरीयं द्वावेतौ परैतानि पञ्चाक्षराणि
    भवन्ति । ततः शून्यं च द्वौ दिवाकरहरौ । तदनु गोत्रभृन्माया । एतानि षडक्षराणि भवन्ति । ततश्चन्द्रः प्रजापतिशक्रौ
    । ततो माया । एतानि चतुरक्षराणि भवन्ति । आद्यं वाग्भवं द्वितीयं कामराजं तृतीयं शक्तिबीजं शुक्लं तरुगदिवाकराभं
    शशिकान्तं क्रमेण स्मरेत् । कफारादित्वात्कीलिता । कोटिजपात् सिद्धिर्न जायते । यदा मन्मथकलादिर्भवति
    तदा निष्कीलिता भवेत् । सिद्धिदा भवेत् । सा वीर्यवती भवेत् । त्रैलोक्यं वशमानयेत् । पूजनाद्दौर्भाग्यनाशो
    भवेत् । जपात् सिद्धीश्वरो भवेत् । इति शिवम् ॥ १॥ अथाद्यं शाम्भवं द्वितायं शाक्तं चेति गुरुमुखात् ज्ञातव्यम्
    । अन्यथा शापमाप्नुयात् । उपासना द्विविधा । शाम्भवं शाक्तं चेति । एवं लोपनाल्लोपा । प्रथमं शम्भुचन्द्रौ
    । तदनु दिवाकरेन्द्रौ । ततः पराबीजं वाग्भवम् । ततः कामराजं शिवचन्द्रकामशम्भुहरयः । पराबीजं शक्तिः ।
    कामपरामध्ये देवराजमेतच्छक्तिकूटम् । एतेन पञ्चादशाक्षराणि भवन्ति । शम्भुप्रधानत्वाच्छाम्भवम् । पूर्णोऽहं
    शिवोऽहमद्वैतरूपोऽहं नित्यानन्दरूपोऽहं इति स्मरेत् । नापि पूजायां व्रतनियमः । सर्वदा जपं चरेत् । विनोदतः
    कामिनीमध्ये कामि नीर्दृष्ट्वा च सदानन्दरूपो भवेत् । दिव्याङ्गरागौर्देहं भृषयेत् सुगन्धमाल्याम्बरालङ्काराद्यैः
    । मांसाद्यैः शुद्धैः सुमधुरैर्भोजयेत् । भपञ्चकेन पूजा कार्या । सदा कौलिको भवेत् । कुलाचागत् सर्वसिद्धीश्वरो
    भवेत् । एकाकी शक्तियुक्तो भवेत् । मादनं भुक्त्वा शक्तिभुग्भवेत् । शक्तिचक्रं पूजयेत् । भोगेन शिवं
    मोक्षमाप्नुयात् । शक्तिहर्षोत्पादनाच्छक्तिः प्रीता भवति । इति शिवम् ॥ २॥ अथ वकुलैरर्चयेत् । रक्तपुष्पैरर्चयेत्
    । तदभावे जलैस्तदभाबे मानसीं भक्तिमाचरेत् । इति शिवम् ॥ ३॥
