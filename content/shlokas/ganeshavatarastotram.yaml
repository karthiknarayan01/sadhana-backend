id: ganeshavatarastotram
category: stotram
name:
  english: ganeshavatarastotram
  devanagari: गणेशावतारस्तोत्रम्
content:
  english: shriganeshavatarastotram shri ganeshaya namah | angirasa uvaca | ananta avatarashca ganeshasya
    mahatmanah | na shakyate katham vaktum maya varshashatairapi || 1|| samkshepena pravakshyami mukhyanam
    mukhyatam gatan | avataramshca tasyashtau vikhyatan brahmadharakan || 2|| vakratundavatarashca dehinam
    brahmadharakah | matsarasurahanta sa simhavahanagah smritah || 3|| ekadantavataro vai dehinam brahmadharakah
    | madasurasya hanta sa akhuvahanagah smritah || 4|| mahodara iti khyato jnanabrahmaprakashakah | mohasurasya
    shatrurvai akhuvahanagah smritah || 5|| gajananah sa vijneyah samkhyebhyah siddhidayakah | lobhasurapraharta
    ca mushakagah prakirtitah || 6|| lambodaravataro vai krodhasuranibarhanah | akhugah shaktibrahma san
    tasya dharaka ucyate || 7|| vikato nama vikhyatah kamasurapradahakah | mayuravahanashcayam sauramatmadharah
    smritah || 8|| vighnarajavatarashca sheshavahana ucyate | mamasuraprahanta sa vishnubrahmeti vacakah
    || 9|| dhumravarnavatarashcabhimanasuranashakah | akhuvahanatam praptah shivatmakah sa ucyate || 10||
    ete'shtau te maya prokta ganeshamsha vinayakah | esham bhajanamatrena svasvabrahmapradharakah || 11||
    svanandavasakari sa ganeshanah prakathyate | svanande yogibhirdrishto brahmani natra samshayah ||
    12|| tasyavatararupashcashtau vighnaharanah smritah | svanandabhajanenaiva lilastatra bhavanti hi
    || 13|| maya tatra svayam lina bhavishyati suputraka | samyoge maunabhavashca samadhih prapyate janaih
    || 14|| ayoge ganarajasya bhajane naiva siddhyati | mayabhedamayam brahma nivrittih prapyate para
    || 15|| yogatmakaganeshano brahmanaspativacakah | tatra shantih samakhyata yogarupa janaih krita ||
    16|| nanashantiprabhedashca sthane sthane prakathyate | shantinam shantirupa sa yogashantih prakirtita
    || 17|| yogasya yogata drishta sarvabrahma suputraka | na yogatparamam brahma brahmabhutena labhyate
    || 18|| etadeva param guhyam kathitam vatsa te'likham | bhaja tvam sarvabhavena ganesham brahmanayakam
    || 19|| putrapautradipradam stotramidam shokavinashanam | dhanadhanyasamriddhyadipradam bhavi na samshayah
    || 20|| dharmarthakamamokshanam sadhanam brahmadayakam | bhaktidridhakaram caiva bhavishyati na samshayah
    || 21|| iti mudgalapuranantargatam ganeshavatarastotram sampurnam ||
  devanagari: श्रीगणेशावतारस्तोत्रम् श्री गणेशाय नमः । आङ्गिरस उवाच । अनन्ता अवताराश्च गणेशस्य महात्मनः
    । न शक्यते कथां वक्तुं मया वर्षशतैरपि ॥ १॥ संक्षेपेण प्रवक्ष्यामि मुख्यानां मुख्यतां गतान् । अवतारांश्च
    तस्याष्टौ विख्यातान् ब्रह्मधारकान् ॥ २॥ वक्रतुण्डावतारश्च देहिनां ब्रह्मधारकः । मत्सरासुरहन्ता स सिंहवाहनगः
    स्मृतः ॥ ३॥ एकदन्तावतारो वै देहिनां ब्रह्मधारकः । मदासुरस्य हन्ता स आखुवाहनगः स्मृतः ॥ ४॥ महोदर इति
    ख्यातो ज्ञानब्रह्मप्रकाशकः । मोहासुरस्य शत्रुर्वै आखुवाहनगः स्मृतः ॥ ५॥ गजाननः स विज्ञेयः सांख्येभ्यः
    सिद्धिदायकः । लोभासुरप्रहर्ता च मूषकगः प्रकीर्तितः ॥ ६॥ लम्बोदरावतारो वै क्रोधसुरनिबर्हणः । आखुगः
    शक्तिब्रह्मा सन् तस्य धारक उच्यते ॥ ७॥ विकटो नाम विख्यातः कामासुरप्रदाहकः । मयूरवाहनश्चायं सौरमात्मधरः
    स्मृतः ॥ ८॥ विघ्नराजावतारश्च शेषवाहन उच्यते । ममासुरप्रहन्ता स विष्णुब्रह्मेति वाचकः ॥ ९॥ धूम्रवर्णावतारश्चाभिमानासुरनाशकः
    । आखुवाहनतां प्राप्तः शिवात्मकः स उच्यते ॥ १०॥ एतेऽष्टौ ते मया प्रोक्ता गणेशांशा विनायकाः । एषां भजनमात्रेण
    स्वस्वब्रह्मप्रधारकाः ॥ ११॥ स्वानन्दवासकारी स गणेशानः प्रकथ्यते । स्वानन्दे योगिभिर्दृष्टो ब्रह्मणि
    नात्र संशयः ॥ १२॥ तस्यावताररूपाश्चाष्टौ विघ्नहरणाः स्मृताः । स्वानन्दभजनेनैव लीलास्तत्र भवन्ति हि
    ॥ १३॥ माया तत्र स्वयं लीना भविष्यति सुपुत्रक । संयोगे मौनभावश्च समाधिः प्राप्यते जनैः ॥ १४॥ अयोगे
    गणराजस्य भजने नैव सिद्ध्यति । मायाभेदमयं ब्रह्म निवृत्तिः प्राप्यते परा ॥ १५॥ योगात्मकगणेशानो ब्रह्मणस्पतिवाचकः
    । तत्र शान्तिः समाख्याता योगरूपा जनैः कृता ॥ १६॥ नानाशान्तिप्रभेदश्च स्थाने स्थाने प्रकथ्यते । शान्तीनां
    शान्तिरूपा सा योगशान्तिः प्रकीर्तिता ॥ १७॥ योगस्य योगता दृष्टा सर्वब्रह्म सुपुत्रक । न योगात्परमं
    ब्रह्म ब्रह्मभूतेन लभ्यते ॥ १८॥ एतदेव परं गुह्यं कथितं वत्स तेऽलिखम् । भज त्वं सर्वभावेन गणेशं ब्रह्मनायकम्
    ॥ १९॥ पुत्रपौत्रादिप्रदं स्तोत्रमिदं शोकविनाशनम् । धनधान्यसमृद्ध्यादिप्रदं भावि न संशयः ॥ २०॥ धर्मार्थकाममोक्षाणां
    साधनं ब्रह्मदायकम् । भक्तिदृढकरं चैव भविष्यति न संशयः ॥ २१॥ इति मुद्गलपुराणान्तर्गतं गणेशावतारस्तोत्रं
    सम्पूर्णम् ॥
