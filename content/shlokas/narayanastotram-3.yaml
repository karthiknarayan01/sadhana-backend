id: narayanastotram-3
category: stotram
name:
  english: narayanastotram 3
  devanagari: नारायणस्तोत्रम् ३
content:
  english: narayanastotram narayano yo narabhujalayo narayano'jnananivartanena | narayano'ntaryamanena
    pumsam tamadinarayanadevamide || 1|| puranavarnah purushottamasya puranamantrah purushah puranah |
    dadhara yo'sau paripurnarupastamadinarayanadevamide || 2|| mantratmako mantragunaissuto yo yassarvamantranpradadau
    munibhyah | mantradhidevo'khilamantragamyatasmadinarayanadevamide || 3|| nishvasabhuta nigamalirasya
    prashvasarupagamapanktiriddha | samastashastrani ca yasya vacastamadinarayanadevamide || 4|| yasyashtavarnam
    manurajamekam samashritassamsritiparameti | vidhervidhanam na hyatra kincit tamadinarayanadevamide
    || 5|| yo vasudevah khalu vamadevo yo devadevah prathamam tato'bhut | parshvadvayadasya ca vakshasashca
    tamadinarayanadevamide || 6|| sheshaya devaya visheshabhartre asheshamantranpradadau sasheshan | nihsheshatah
    kleshanivrittaye'sau tamadinarayanadevamide || 7|| gururgurunamrishabho rishinam yom devadevah khalu
    devatanam | yashceshvaranam parameshvaro'sau tamadinarayanadevamide || 8|| iti narayanastotram bhanitam
    tripurarina | pathanacchravanatsadyo hridyam shuddhim prayacchati || 9||
  devanagari: नारायणस्तोत्रम् नारायणो यो नरभूजलायो नारायणोऽज्ञाननिवर्तनेन । नारायणोऽन्तर्यमनेन पुंसां
    तमादिनारायणदेवमीडे ॥ १॥ पुराणवर्णाः पुरुषोत्तमस्य पुराणमन्त्रः पुरुषः पुराणः । दधार योऽसौ परिपूर्णरूपस्तमादिनारायणदेवमीडे
    ॥ २॥ मन्त्रात्मको मन्त्रगुणैस्सुतो यो यस्सर्वमन्त्रान्प्रददौ मुनिभ्यः । मन्त्राधिदेवोऽखिलमन्त्रगम्यतस्मादिनारायणदेवमीडे
    ॥ ३॥ निश्वासभूता निगमालिरस्य प्रश्वासरूपागमपङ्क्तिरिद्धा । समस्तशास्त्राणि च यस्य वाचस्तमादिनारायणदेवमीडे
    ॥ ४॥ यस्याष्टवर्णं मनुराजमेकं समाश्रितस्संसृतिपारमेति । विधेर्विधानं न ह्यत्र किञ्चित् तमादिनारायणदेवमीडे
    ॥ ५॥ यो वासुदेवः खलु वामदेवो यो देवदेवः प्रथमं ततोऽभूत् । पार्श्वद्वयादस्य च वक्षसश्च तमादिनारायणदेवमीडे
    ॥ ६॥ शेषाय देवाय विशेषभर्त्रे अशेषमन्त्रान्प्रददौ सशेषान् । निःशेषतः क्लेशनिवृत्तयेऽसौ तमादिनारायणदेवमीडे
    ॥ ७॥ गुरुर्गुरूणामृषभो ऋषीणां यों देवदेवः खलु देवतानाम् । यश्चेश्वराणां परमेश्वरोऽसौ तमादिनारायणदेवमीडे
    ॥ ८॥ इति नारायणस्तोत्रं भणितं त्रिपुरारिणा । पठनाच्छ्रवणात्सद्यो हृद्यां शुद्धिं प्रयच्छति ॥ ९॥
