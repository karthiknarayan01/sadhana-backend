id: shivadhyanamantrapujavashishthaprokta
category: mantra
name:
  english: shivadhyanamantrapujavashishthaprokta
  devanagari: शिवध्यानमन्त्रपूजावशिष्ठप्रोक्ता
content:
  english: rinutam samyagvetalabhairavau | pancavaktram mahakayam jatajutavibhushitam || 137|| carucandrakalayuktam
    murdhni balaughabhushitam | bahubhirdashabhiryuktam vyaghracarmambarambaram || 138|| kalakutadharam
    kanthe nagaharopashobhitam | kiritabandhanam bahubhushanam ca bhujangaman || 139|| bibhratam sarvagatreshu
    jyotsnarpitasurocisham | bhutisamliptasarvangamekaikatra tribhistribhih || 140|| netraistu pancadashabhirjyotishmadbhirvirajitam
    | vrishabhopari samstham tu gajakrittiparicchadam || 141|| sadyojatam vamadevamaghoram ca tatah param
    | tatpurusham tatheshanam pancavaktram prakirtitam || 142|| sadyojatam bhavecchuklam shuddhasphatikasannibham
    | pitavarnam tatha saumyam vamadevam manoharam || 143|| nilavarnamaghoram tu damshtra bhitivivardhanam
    | raktam tatpurusham devam divyamurtim manoharam || 144|| shyamalam ca tatheshanam sarvadaiva shivatmakam
    | cintayet pashcime tvadyam dvitiyam tu tathottare || 145|| aghoram dakshine devam purve tatpurusham
    tatha | ishanam madhyato jneyam cintayedbhaktitatparah || 146|| shaktitrishulakhatvangavaradabhayadam
    shivam | dakshineshvatha hasteshu vameshvapi tatah shubham || 147|| akshasutram bijapuram bhujagam
    damarutpalam | ashtaishvaryasamayuktam dhyayettu hridgatam shivam || 148|| evam vicintayeddhyane mahadevam
    jagatpatim | cintayitva dvarapalan ganeshadin prapujayet || 149|| vishuddhim pancabhutanam cintayitva
    tato muhuh | ashtamurtistatah pashcat pujayedashtanamabhih || 150|| asanani ca tasyatha pujayet sakalani
    tu | bhavadinyashtapushpani hridaiva viniyojayet || 151|| naracamudraya tasya tadanam parikirtitam
    | visarjanam dhenumudram darshayitva vidhanatah || 152|| nirmalyadharanam kuryat sada candeshvaram
    dhiya | pratyekam pancabhirmantrairangadini pramarjayet || 153|| sammadadibhiretasya purvoktairnarasattamau
    | balam jyeshtham tatha raudrim kalim ca tadanantaram || 154|| kalavikarinim devim balapramathinim
    tatha | damanim sarvabhutanam manonmathinim tathaiva ca || 155|| ashtau tah pujayeddevih kramacchambhoshca
    pritaye | evam shivam pujayitva dhyanatatparamanasah || 156|| japenmalam samadaya mantram dhyatva
    tatha gurum | ekam pancaksharam mantramekam prasadameva va || 157|| tatsaktamanasau japtva shighram
    siddhimavapsyathah | iti kalikapurane ekapancashattamadhyayantargata vasishthaprokta shivadhyanamantrapuja
    samapta |
  devanagari: ृणुतं सम्यग्वेतालभैरवौ । पञ्चवक्त्रं महाकायं जटाजूटविभूषितम् ॥ १३७॥ चारुचन्द्रकलायुक्तं
    मूर्ध्नि बालौघभूषितम् । बाहुभिर्दशभिर्युक्तं व्याघ्रचर्माम्बराम्बरम् ॥ १३८॥ कालकूटधरं कण्ठे नागहारोपशोभितम्
    । किरीटबन्धनं बाहुभूषणं च भुजङ्गमान् ॥ १३९॥ बिभ्रतं सर्वगात्रेषु ज्योत्स्नार्पितसुरोचिषम् । भूतिसंलिप्तसर्वाङ्गमेकैकत्र
    त्रिभिस्त्रिभिः ॥ १४०॥ नेत्रैस्तु पञ्चदशभिर्ज्योतिष्मद्भिर्विराजितम् । वृषभोपरि संस्थं तु गजकृत्तिपरिच्छदम्
    ॥ १४१॥ सद्योजातं वामदेवमघोरं च ततः परम् । तत्पुरुषं तथेशानं पञ्चवक्त्रं प्रकीर्तितम् ॥ १४२॥ सद्योजातं
    भवेच्छुक्लं शुद्धस्फटिकसन्निभम् । पीतवर्णं तथा सौम्यं वामदेवं मनोहरम् ॥ १४३॥ नीलवर्णमघोरं तु दंष्ट्रा
    भीतिविवर्धनम् । रक्तं तत्पुरुषं देवं दिव्यमूर्तिं मनोहरम् ॥ १४४॥ श्यामलं च तथेशानं सर्वदैव शिवात्मकम्
    । चिन्तयेत् पश्चिमे त्वाद्यं द्वितीयं तु तथोत्तरे ॥ १४५॥ अघोरं दक्षिणे देवं पूर्वे तत्पुरुषं तथा ।
    ईशानं मध्यतो ज्ञेयं चिन्तयेद्भक्तितत्परः ॥ १४६॥ शक्तित्रिशूलखट्वाङ्गवरदाभयदं शिवम् । दक्षिणेष्वथ हस्तेषु
    वामेष्वपि ततः शुभम् ॥ १४७॥ अक्षसूत्रं बीजपूरं भुजगं डमरूत्पलम् । अष्टैश्वर्यसमायुक्तं ध्यायेत्तु हृद्गतं
    शिवम् ॥ १४८॥ एवं विचिन्तयेद्ध्याने महादेवं जगत्पतिम् । चिन्तयित्वा द्वारपालान् गणेशादीन् प्रपूजयेत्
    ॥ १४९॥ विशुद्धिं पञ्चभूतानां चिन्तयित्वा ततो मुहुः । अष्टमूर्तीस्ततः पश्चात् पूजयेदष्टनामभिः ॥ १५०॥
    आसनानि च तस्याथ पूजयेत् सकलानि तु । भावादीन्यष्टपुष्पाणि हृदैव विनियोजयेत् ॥ १५१॥ नाराचमुद्रया तस्य
    ताडनं परिकीर्तितम् । विसर्जनं धेनुमुद्रां दर्शयित्वा विधानतः ॥ १५२॥ निर्माल्यधारणं कुर्यात् सदा चण्डेश्वरं
    धिया । प्रत्येकं पञ्चभिर्मन्त्रैरङ्गादीनि प्रमार्जयेत् ॥ १५३॥ सम्मदादिभिरेतस्य पूर्वोक्तैर्नरसत्तमौ
    । बालां ज्येष्ठां तथा रौद्रीं कालीं च तदनन्तरम् ॥ १५४॥ कलविकरिणीं देवीं बलप्रमथिनीं तथा । दमनीं सर्वभूतानां
    मनोन्मथिनीं तथैव च ॥ १५५॥ अष्टौ ताः पूजयेद्देवीः क्रमाच्छम्भोश्च प्रीतये । एवं शिवं पूजयित्वा ध्यानतत्परमानसः
    ॥ १५६॥ जपेन्मालां समादाय मन्त्रं ध्यात्वा तथा गुरुम् । एकं पञ्चाक्षरं मन्त्रमेकं प्रासादमेव वा ॥ १५७॥
    तत्सक्तमनसौ जप्त्वा शीघ्रं सिद्धिमवाप्स्यथः । इति कालिकापुराणे एकपञ्चाशत्तमाध्यायान्तर्गता वसिष्ठप्रोक्ता
    शिवध्यानमन्त्रपूजा समाप्ता ।
