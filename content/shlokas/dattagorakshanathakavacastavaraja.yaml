id: dattagorakshanathakavacastavaraja
category: kavacha
name:
  english: dattagorakshanathakavacastavaraja
  devanagari: दत्तगोरक्षनाथकवचस्तवराज
content:
  english: tava bhaktaya shantaya pathanaccintitam labhet | surasurajanagre ca na maya kathitam priye
    || 9|| om asya shridattagorakshakavacamantrasya sadashiva rishih | anushtupchandah | shridattatreyagorakshaparamatma
    devata | om bijam | anubhava shaktih | shridattagorakshaprasadasiddharthe jape viniyogah || 10|| atha
    karanyasah | om dram ghram angushthabhyam namah || om tam ram tarjanibhyam namah || om tram ksham
    madhyamabhyam namah || om am nam anamikabhyam namah || om bam tham kanishthikabhyam namah || om dram
    hrim karatalakaraprishthabhyam namah || 11|| atha hridayadinyasah | om dram ghram hridayaya namah
    | om tam ram shirase svaha | om tram ksham shikhayai vashat | om am nam kavacaya hum | om bam tham
    netratrayaya vaushat | om dram hrim asraya phat || iti digbandhah || sarvarakshanarthe sarvasiddhyarthe
    jape viniyogah || 12|| || atha gayatri || om adirupaya vidmahe om anadirupaya dhimahi | tanno dattagorakshapracodayat
    || 13|| || atha mantrah || om om dam vam tam om om om dattagorakshasiddhaya namah || iti japtva shatatrayam
    || 14|| || atha dhyanam || digambaram trigunatmakam narayanam niranjanam yogeshvaram || om anadinatham
    sarvavyapiyogim sakaleshvaram || cinmayam jyotirupam niradharam so'ham brahmasanatanam || ghorarupam
    mahaghoram ashtangayogasiddhisiddheshvaram || 15|| om namo bhagavate dattatreyaya vishnave | guruparamatmane
    vasudevaya namo'stute | om namo gorakshanathaya rudraya trailokyadhipataye | jitendriyaya sanatanaya
    namo'stute || 16|| shikhayam patu goraksham brahmarandhreca dattakam | bhale gorakshanathashca dattatreyo
    bhuvasthale || 17|| cakshubhyam ghorayogindra garbhayogindra karnakau | pahi mam dattagoraksha vamadakshinanasikam
    || 18|| mukhe gorakshanatham ca dattam caivadharoshthake | jihvaya patu goraksham dantanpatu cibutrakam
    || 19|| anasuyasutam kanthe goraksham kanthaprishthake | vamadakshinahastau ca dattagoraksha pahi
    mam || 20|| satsena hridaye patu dattagorakshadaivatam | katya nabhim ca mam patu dattagoraksha yoginam
    || 21|| urau janghadilingatam patu gorakshadattakam | padau padatalantam ca dattagoraksha pahimam
    || 22|| mastakapadaparyantam apadatalamastakam | dattatreyam ca goraksham patu mam sarvatastanuh ||
    23|| dishashtau ca tatha''kasham patale vidishashtake | divaratrau trivelayam dattagoraksha pahi mam
    || 24|| jalagnighorayuddhe ca shastraghate vishattake | raksha raksha sada deva dattagorakshadaivatam
    || 25|| mantradi yantratantranam kalpakotinyakrittimam | raksha raksha sada deva dattagorakshadaivatam
    || 26|| agniparthe caurasarpe vyaghradushtabhaye vane | raksha raksha sada deva dattagorakshadaivatam
    || 27|| bhutapretapishacograkushmanda bhairavadayah | dakinishakinikritya padagorakshadattakam ||
    28|| svargapatalabhuloke yatra yatra bhavetshivam | tatra rakshatu goraksham dattatreyashca patu mam
    || 29|| om namo devadevesha namo devadhinayaka | namo gorakshanathaya dattatreya namo namah || 30||
    namo rigvedarupaya namo yajusvarupine | namo gorakshanathaya dattatreya namo namah || 31|| namo samasvarupaya
    namo'tharvanarupine | namo'stu navanathaya namo shodashasiddhaye || 32|| namo anadidevaya namo adisvarupine
    | namo vedasvarupaya namo siddhantarupine || 33|| namo nirmalarupaya namo cinmayavyapine | namo vidyutsvarupaya
    namo jyotisvarupine || 34|| namo aghorarupaya namo nishkarmarupine | namo vishvasvarupaya namo sarvasvarupine
    || 35|| namo anantarupaya namo bodhasvarupine | namo sakalasvarupaya namo vajrasvarupine || 36|| namo
    kalmashanashaya namo papapranashine | namo carusvarupaya namo divyasvarupine || 37|| namo dushtapranashaya
    namo daityantakaya ca | namo adharmanashaya namo dharmasvarupine || 38|| namo nishkarmarupaya namo
    karmantakaya ca | namo bhasmangaragaya namo digambaraya ca || 39|| namo susmitavaktraya namo susmitalocana
    | namo dveshavinashaya namo krodhantakaya ca || 40|| namo nihshankarupaya namo vairagyarupine | namo
    mangalarupaya namo kalyanarupine || 41|| riddhisiddhiphalam data bhuktimuktipradayakam | namo'stu
    dattagoraksham samsararnavataranam || 42|| iti dattastavam divyam dattagorakshakam shubham | pathanallabhate
    shaivam vaksiddhirdehasiddhidam || 43|| yogasiddhih sarvasiddhih ishtasiddhirlabhanti ca | dushtadanavasamharta
    nirbhayo jayate narah || 44|| na mrityurna jara rogam nirbhayo jayate narah | tatraiva vijayo labho
    yatra tishthati sadhakah || 45|| svashaktisahitadeva navanatheshu bodhana | saganashaktisahita deva
    prasannasankramat || 46|| om namo dattatreyaya namo namo'stu om vishnusvarupaya namo namo'stu | om
    namo gorakshanathaya namo namaste om shivasvarupaya namo namaste || 47|| iti shrirudrayamale shriishvaraparvatisamvade
    dattagorakshanathakavacastavarajam sampurnam | shridattatreyarpanamastu | shubhamastu | shrirastu
    || om shantih shantih shantih ||
  devanagari: तव भक्ताय शान्ताय पठनाच्चिन्तितं लभेत् । सुरासुरजनाग्रे च न मया कथितं प्रिये ॥ ९॥ ॐ अस्य
    श्रीदत्तगोरक्षकवचमन्त्रस्य सदाशिव ऋषिः । अनुष्टुप्छन्दः । श्रीदत्तात्रेयगोरक्षपरमात्मा देवता । ॐ बीजम्
    । अनुभव शक्तिः । श्रीदत्तगोरक्षप्रसादसिद्धर्थे जपे विनियोगः ॥ १०॥ अथ करन्यासः । ॐ द्रां घ्रां अङ्गुष्ठाभ्यां
    नमः ॥ ॐ तं रं तर्जनीभ्यां नमः ॥ ॐ त्रं क्षं मध्यमाभ्यां नमः ॥ ॐ अं नं अनामिकाभ्यां नमः ॥ ॐ बं थं कनिष्ठिकाभ्यां
    नमः ॥ ॐ द्रां ह्रीं करतलकरपृष्ठाभ्यां नमः ॥ ११॥ अथ हृदयादिन्यासः । ॐ द्रां घ्रां हृदयाय नमः । ॐ तं
    रं शिरसे स्वाहा । ॐ त्रं क्षं शिखायै वषट् । ॐ अं नं कवचाय हुम् । ॐ बं थं नेत्रत्रयाय वौषट् । ॐ द्रां
    ह्रीं अस्राय फट् ॥ इति दिग्बन्धः ॥ सर्वरक्षणार्थे सर्वसिद्ध्यर्थे जपे विनियोगः ॥ १२॥ ॥ अथ गायत्री
    ॥ ॐ आदिरूपाय विद्महे ॐ अनादिरूपाय धीमहि । तन्नो दत्तगोरक्षप्रचोदयात् ॥ १३॥ ॥ अथ मन्त्रः ॥ ॐ ॐ दं वं
    तं ॐ ॐ ॐ दत्तगोरक्षसिद्धाय नमः ॥ इति जप्त्वा शतत्रयम् ॥ १४॥ ॥ अथ ध्यानम् ॥ दिगम्बरं त्रिगुणात्मकं
    नारायणं निरञ्जनं योगेश्वरम् ॥ ॐ अनादिनाथं सर्वव्यापियोगिं सकलेश्वरम् ॥ चिन्मयं ज्योतिरूपं निराधारं
    सोऽहं ब्रह्मसनातनम् ॥ घोररूपं महाघोरं अष्टाङ्गयोगसिद्धिसिद्धेश्वरम् ॥ १५॥ ॐ नमो भगवते दत्तात्रेयाय
    विष्णवे । गुरुपरमात्मने वासुदेवाय नमोऽस्तुते । ॐ नमो गोरक्षनाथाय रुद्राय त्रैलोक्याधिपतये । जितेन्द्रियाय
    सनातनाय नमोऽस्तुते ॥ १६॥ शिखायां पातु गोरक्षं ब्रह्मरन्ध्रेच दत्तकम् । भाले गोरक्षनाथश्च दत्तात्रेयो
    भुवस्थले ॥ १७॥ चक्षुभ्यां घोरयोगीन्द्र गर्भयोगीन्द्र कर्णकौ । पाहि मां दत्तगोरक्ष वामदक्षिणनासिकाम्
    ॥ १८॥ मुखे गोरक्षनाथं च दत्तं चैवाधरोष्ठके । जिह्वाया पातु गोरक्षं दन्तान्पातु चिबुत्रकम् ॥ १९॥ अनसूयासुतं
    कण्ठे गोरक्षं कण्ठपृष्ठके । वामदक्षिणहस्तौ च दत्तगोरक्ष पाहि माम् ॥ २०॥ सत्सेना हृदये पातु दत्तगोरक्षदैवतम्
    । कट्या नाभिं च मां पातु दत्तगोरक्ष योगिनाम् ॥ २१॥ ऊरौ जङ्घादिलिङ्गातं पातु गोरक्षदत्तकम् । पादौ पादतलान्तं
    च दत्तगोरक्ष पाहिमाम् ॥ २२॥ मस्तकापादपर्यन्तं आपादतलमस्तकम् । दत्तात्रेयं च गोरक्षं पातु मां सर्वतस्तनुः
    ॥ २३॥ दिशाष्टौ च तथाऽऽकाशं पाताले विदिशाष्टके । दिवारात्रौ त्रिवेलायां दत्तगोरक्ष पाहि माम् ॥ २४॥
    जलाग्निघोरयुद्धे च शस्त्रघाते विषत्तके । रक्ष रक्ष सदा देव दत्तगोरक्षदैवतम् ॥ २५॥ मन्त्रादि यन्त्रतन्त्राणां
    कल्पकोटिन्यकृत्तिमम् । रक्ष रक्ष सदा देव दत्तगोरक्षदैवतम् ॥ २६॥ अग्निपार्थे चौरसर्पे व्याघ्रदुष्टभये
    वने । रक्ष रक्ष सदा देव दत्तगोरक्षदैवतम् ॥ २७॥ भूतप्रेतपिशाचोग्रकूष्माण्डा भैरवादयः । डाकिनीशाकिनीकृत्या
    पादगोरक्षदत्तकम् ॥ २८॥ स्वर्गपातालभूलोके यत्र यत्र भवेत्शिवम् । तत्र रक्षतु गोरक्षं दत्तात्रेयश्च
    पातु माम् ॥ २९॥ ॐ नमो देवदेवेश नमो देवाधिनायक । नमो गोरक्षनाथाय दत्तात्रेय नमो नमः ॥ ३०॥ नमो ऋग्वेदरूपाय
    नमो यजुस्वरूपिणे । नमो गोरक्षनाथाय दत्तात्रेय नमो नमः ॥ ३१॥ नमो सामस्वरूपाय नमोऽथर्वणरूपिणे । नमोऽस्तु
    नवनाथाय नमो षोडशसिद्धये ॥ ३२॥ नमो अनादिदेवाय नमो आदिस्वरूपिणे । नमो वेदस्वरूपाय नमो सिद्धान्तरूपिणे
    ॥ ३३॥ नमो निर्मलरूपाय नमो चिन्मयव्यापिने । नमो विद्युत्स्वरूपाय नमो ज्योतिस्वरूपिणे ॥ ३४॥ नमो अघोररूपाय
    नमो निष्कर्मरूपिणे । नमो विश्वस्वरूपाय नमो सर्वस्वरूपिणे ॥ ३५॥ नमो अनन्तरूपाय नमो बोधस्वरूपिणे । नमो
    सकलस्वरूपाय नमो वज्रस्वरूपिणे ॥ ३६॥ नमो कल्मषनाशाय नमो पापप्रणाशिने । नमो चारुस्वरूपाय नमो दिव्यस्वरूपिणे
    ॥ ३७॥ नमो दुष्टप्रणाशाय नमो दैत्यान्तकाय च । नमो अधर्मनाशाय नमो धर्मस्वरूपिणे ॥ ३८॥ नमो निष्कर्मरूपाय
    नमो कर्मान्तकाय च । नमो भस्माङ्गरागाय नमो दिगम्बराय च ॥ ३९॥ नमो सुस्मितवक्त्राय नमो सुस्मितलोचन ।
    नमो द्वेषविनाशाय नमो क्रोधान्तकाय च ॥ ४०॥ नमो निःशङ्करूपाय नमो वैराग्यरूपिणे । नमो मङ्गलरूपाय नमो
    कल्याणरूपिणे ॥ ४१॥ ऋद्धिसिद्धिफलं दाता भुक्तिमुक्तिप्रदायकम् । नमोऽस्तु दत्तगोरक्षं संसारार्णवतारणम्
    ॥ ४२॥ इति दत्तस्तवं दिव्यं दत्तगोरक्षकं शुभम् । पठनाल्लभते शैवं वाक्सिद्धिर्देहसिद्धिदम् ॥ ४३॥ योगसिद्धिः
    सर्वसिद्धिः इष्टसिद्धिर्लभन्ति च । दुष्टदानवसंहर्ता निर्भयो जायते नरः ॥ ४४॥ न मृत्युर्न जरा रोगं निर्भयो
    जायते नरः । तत्रैव विजयो लाभो यत्र तिष्ठति साधकः ॥ ४५॥ स्वशक्तिसहितादेव नवनाथेषु बोधना । सगणशक्तिसहिता
    देव प्रसन्नसङ्क्रमात् ॥ ४६॥ ॐ नमो दत्तात्रेयाय नमो नमोऽस्तु ॐ विष्णुस्वरूपाय नमो नमोऽस्तु । ॐ नमो
    गोरक्षनाथाय नमो नमस्ते ॐ शिवस्वरूपाय नमो नमस्ते ॥ ४७॥ इति श्रीरुद्रयामले श्रीईश्वरपार्वतीसंवादे दत्तगोरक्षनाथकवचस्तवराजं
    सम्पूर्णम् । श्रीदत्तात्रेयार्पणमस्तु । शुभमस्तु । श्रीरस्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
