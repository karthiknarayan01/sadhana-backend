    करहि उपद्रव मुनि दुख पावहिम् ॥ गाधितनय मन चिन्ता ब्यापी। हरि बिनु मरहि न निसिचर पापी ॥ तब मुनिवर मन
    कीन्ह बिचारा। प्रभु अवतरेउ हरन महि भारा ॥ एहुँ मिस देखौं पद जाई। करि बिनती आनौ दौ भाई ॥ ग्यान बिराग
    सकल गुन अयना। सो प्रभु मै देखब भरि नयना ॥ दो बहुबिधि करत मनोरथ जात लागि नहिं बार। करि मज्जन सरू जल
    गे भूप दरबार ॥ ॥ मुनि आगमन सुना जब राजा। मिलन गयू लै बिप्र समाजा ॥ करि दण्डवत मुनिहि सनमानी। निज आसन
