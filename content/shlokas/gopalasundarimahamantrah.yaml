id: gopalasundarimahamantrah
category: mantra
name:
  english: gopalasundarimahamantrah
  devanagari: गोपालसुन्दरीमहामन्त्रः
content:
  english: shrigopalasundarimahamantrah || viniyogah || om asya shrigopalasundarimahamantrasya shrikrishna
    rishih | anushtupchandah | shrigopalasundari devata | hrim bijam | shrim shaktih | klim kilakam |
    mama ishtakamapraptyarthe jape viniyogah || || digbandhah || om purve indraya namah | om agneye agnaye
    namah | om dakshine yamaya namah | om nairitye nairitaye namah | om pashcime varunaya namah | om vayavye
    vayave namah | om uttare kuberaya namah | om ishane ishanaya namah | om urdhve brahmane namah | om
    adhastadanantaya namah || || rishyadinyasah || shrikrishnarishaye namah shirasi | anushtupchandase
    namah mukhe | shrigopalasundaridevatayai namah hridi | hrim bijaya namah guhye | shrim shaktaye namah
    nabhau | klim kilakaya namah padayoh | viniyogaya namah sarvange || || karanyasah || hrim shrim angushthabhyam
    namah | klim krishnaya tarjanibhyam svaha | gopijana madhyamabhyam vashat | vallabhaya anamikabhyam
    hum | svaha kanishthikabhyam vaushat | hrim shrim klim krishnaya gopijanavallabhaya svaha karatalakaraprishthabhyam
    phat || || shadanganyasah || hrim shrim hridayaya namah | klim krishnaya shirase svaha | gopijana
    shikhayai vashat | vallabhaya kavacaya hum | svaha netratrayaya vaushat | hrim shrim klim krishnaya
    gopijanavallabhaya svaha astraya phat || || dhyanam || vrindavane ramyanikunjamadhye ratnasanastham
    paramanuragam | radham samalingya manojnadeham venum vahantam smitacaruvaktram || hrimshrimbijaprabhaya
    prakasham nilambudashyamatanum mukundam | gopijanaih sevitapadapadmam vande sada gopalasundarisham
    || pitambaram kaustubharatnadiptam barhavatamsam vanamalyayuktam | radhasametam rasikendranatham dhyayetparanandamayam
    janardanam || || mantrah || hrim shrim klim krishnaya gopijanavallabhaya svaha || iti shrigopalasundarimahamantrah
    sampurnah |
  devanagari: श्रीगोपालसुन्दरीमहामन्त्रः ॥ विनियोगः ॥ ॐ अस्य श्रीगोपालसुन्दरीमहामन्त्रस्य श्रीकृष्ण ऋषिः
    । अनुष्टुप्छन्दः । श्रीगोपालसुन्दरी देवता । ह्रीं बीजम् । श्रीं शक्तिः । क्लीं कीलकम् । मम इष्टकामप्राप्त्यर्थे
    जपे विनियोगः ॥ ॥ दिग्बन्धः ॥ ॐ पूर्वे इन्द्राय नमः । ॐ आग्नेये अग्नये नमः । ॐ दक्षिणे यमाय नमः । ॐ
    नैऋत्ये नैऋतये नमः । ॐ पश्चिमे वरुणाय नमः । ॐ वायव्ये वायवे नमः । ॐ उत्तरे कुबेराय नमः । ॐ ईशाने ईशानाय
    नमः । ॐ ऊर्ध्वे ब्रह्मणे नमः । ॐ अधस्तादनन्ताय नमः ॥ ॥ ऋष्यादिन्यासः ॥ श्रीकृष्णऋषये नमः शिरसि । अनुष्टुप्छन्दसे
    नमः मुखे । श्रीगोपालसुन्दरीदेवतायै नमः हृदि । ह्रीं बीजाय नमः गुह्ये । श्रीं शक्तये नमः नाभौ । क्लीं
    कीलकाय नमः पादयोः । विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ ह्रीं श्रीं अङ्गुष्ठाभ्यां नमः । क्लीं
    कृष्णाय तर्जनीभ्यां स्वाहा । गोपीजन मध्यमाभ्यां वषट् । वल्लभाय अनामिकाभ्यां हुं । स्वाहा कनिष्ठिकाभ्यां
    वौषट् । ह्रीं श्रीं क्लीं कृष्णाय गोपीजनवल्लभाय स्वाहा करतलकरपृष्ठाभ्यां फट् ॥ ॥ षडङ्गन्यासः ॥ ह्रीं
    श्रीं हृदयाय नमः । क्लीं कृष्णाय शिरसे स्वाहा । गोपीजन शिखायै वषट् । वल्लभाय कवचाय हुं । स्वाहा नेत्रत्रयाय
    वौषट् । ह्रीं श्रीं क्लीं कृष्णाय गोपीजनवल्लभाय स्वाहा अस्त्राय फट् ॥ ॥ ध्यानम् ॥ वृन्दावने रम्यनिकुञ्जमध्ये
    रत्नासनस्थां परमानुरागाम् । राधां समालिङ्ग्य मनोज्ञदेहं वेणुं वहन्तं स्मितचारुवक्त्रम् ॥ ह्रींश्रींबीजप्रभया
    प्रकाशं नीलाम्बुदश्यामतनुं मुकुन्दम् । गोपीजनैः सेवितपादपद्मं वन्दे सदा गोपालसुन्दरीशम् ॥ पीताम्बरं
    कौस्तुभरत्नदीप्तं बर्हावतंसं वनमाल्ययुक्तम् । राधासमेतं रसिकेन्द्रनाथं ध्यायेत्परानन्दमयं जनार्दनम्
    ॥ ॥ मन्त्रः ॥ ह्रीं श्रीं क्लीं कृष्णाय गोपीजनवल्लभाय स्वाहा ॥ इति श्रीगोपालसुन्दरीमहामन्त्रः सम्पूर्णः
    ।
