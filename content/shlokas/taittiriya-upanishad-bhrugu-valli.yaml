id: taittiriya-upanishad-bhrugu-valli
category: stotram
name:
  english: Taittiriya Upanishad - Bhrugu Valli
content:
  english: om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai
    shshantih || bhrigurvai varunih | varuna mpitaramupasasara | adhihi bhagavo brahmeti | tasma etatprovaca
    | anna mmano vacamiti | tagm hovaca | yato va imani bhutani jayante | yena jatani jivanti | yatprayantyabhisam
    vi~shanti | tadvijijnasasva | tadbrahmeti | sa tapo 'tapyata | sa tapastaptva || mbrahmeti vyajanat
    | annaddhyeva khalvimani bhutani jayante | annena jatani jivanti | anna vi~shantiti | tadvijnaya |
    punareva varuna mpitaramupasasara | adhihi bhagavo brahmeti | tagm hovaca | tapasa brahma vijijnasasva
    | tapo brahmeti | sa tapo 'tapyata | sa tapastaptva || 'nuvakah || prano brahmeti vyajanat | pranaddhyeva
    khalvimani bhutani jayante | pranena jatani jivanti | prana vi~shantiti | tadvijnaya | punareva varuna
    mpitaramupasasara | adhihi bhagavo brahmeti | tagm hovaca | tapasa brahma vijijnasasva | tapo brahmeti
    | sa tapo 'tapyata | sa tapastaptva || 'nuvakah || mano brahmeti vyajanat | manaso hyeva khalvimani
    bhutani jayante | manasa jatani jivanti | manah prayantyabhisam vi~shantiti | tadvijnaya | punareva
    varuna mpitaramupasasara | adhihi bhagavo brahmeti | tagm hovaca | tapasa brahma vijijnasasva | tapo
    brahmeti | sa tapo 'tapyata | sa tapastaptva || mbrahmeti vyajanat | vijnanaddhyeva khalvimani bhutani
    jayante | vijnanena jatani jivanti | vijnana vi~shantiti | tadvijnaya | punareva varuna mpitaramupasasara
    | adhihi bhagavo brahmeti | tagm hovaca | tapasa brahma vijijnasasva | tapo brahmeti | sa tapo 'tapyata
    | sa tapastaptva || 'nuvakah || anando brahmeti vyajanat | anandaddhyeva khalvimani bhutani jayante
    | anandena jatani jivanti | ananda vi~shantiti | saisha bha rgavi varuni vidya | parame vyomanpratishthita
    | sa ya evam ve~da pratitishthati | annavanannado bhavati | mahanbhavati prajaya pashubhirbrahmavarcasena
    | mahankirtya || nna nindyat | tadvratam | prano va annam | shariramannadam | prane sharira mpratishthitam
    | sharire pranah pratishthitah | tadetadannamanne pratishthitam | sa ya etadannamanne pratishthitam
    ve~da pratitishthati | annavanannado bhavati | mahanbhavati prajaya pashubhirbrahmavarcasena | mahankirtya
    || nna paricakshita | tadvratam | apo va annam | jyotirannadam | apsu jyotih pratishthitam | jyotishyapah
    pratishthitah | tadetadannamanne pratishthitam | sa ya etadannamanne pratishthitam ve~da pratitishthati
    | annavanannado bhavati | mahanbhavati prajaya pashubhirbrahmavarcasena | mahankirtya || mbahu kurvita
    | tadvratam | prithivi va annam 'nnadah | prithivyamakashah pratishthitah | akashe prithivi pratishthita
    | tadetadannamanne pratishthitam | sa ya etadannamanne pratishthitam ve~da pratitishthati | annavanannado
    bhavati | mahanbhavati prajaya pashubhirbrahmavarcasena | mahankirtya || 'nuvakah || na kancana vasatau
    pratyacakshita | tadvratam | tasmadyaya kaya ca vidhaya bahvanna mprapnuyat | aradhyasma annamityacakshate
    | etadvai mukhato 'nnagm raddham | mukhato 'sma annagm radhyate | etadvai madhyato 'nnagm raddham
    | madhyato 'sma annagm radhyate | etadva antato 'nnagm raddham | antato 'sma annagm radhyate || ve~da
    | kshema iti vaci | yogakshema iti pranapanayoh | karmeti hastayoh | gatiriti padayoh | vimuktiriti
    payau | iti manushi ssamajnah | atha daivih | triptiriti vrishtau | balamiti vidyuti || || yasha iti
    pashushu | jyotiriti nakshatreshu | prajatiramritamananda ityupasthe | sarvamityakashe | tatpratishthetyupasita
    | pratishthavanbhavati | tanmaha ityupasita | mahanbhavati | tanmana ityupasita | manavanbhavati ||
    || tannama ityupasita | namyante 'smai kamah | tadbrahmetyupasita | brahmavanbhavati | tadbrahmanah
    parimara ityupasita | paryena mmriyante dvishantassapatnah | pari ye bhratrivyah | sa yashcaya mpurushe
    | yashcasavaditye | sa ekah || llo~katpretya | etamannamaya matmanamupasankramya | eta matmanamupasankramya
    | eta matmanamupasankramya | etam matmanamupasankramya | etamanandamaya matmanamupasankramya | imam
    sancarann | etathsama gayannaste | ha mahamannam | ahamannado 'hamannadah | ahagg shlokakridahagg
    shlokakridahagg shlokakrit | ahamasmi prathamaja rita ndevebhyo amritasya na bhayi | yo ma dadati
    sa ideva ma mabhyabhavam | suvarna jyotih ve~da | ityupanishat || 'nuvakah || om saha navavatu | saha
    nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai shshantih || || harih
    om || || shri krishnarpanamastu ||
  devanagari: ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    श्शान्तिः॑ ॥ भृगु॒र्वै वा॑रु॒णिः । वरु॑ण॒ म्पित॑र॒मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ । तस्मा॑ ए॒तत्प्रो॑वाच
    । अन्न॑ म्मनो॒ वाच॒मिति॑ । तग्ं हो॑वाच । यतो॒ वा इ॒मानि॒ भूता॑नि॒ जाय॑न्ते । येन॒ जाता॑नि॒ जीव॑न्ति
    । यत्प्रय॑न्त्य॒भिसं विँ॑शन्ति । तद्विजि॑ज्ञासस्व । तद्ब्रह्मेति॑ । स तपो॑ ऽतप्यत । स तप॑स्त॒प्त्वा
    ॥ म्ब्रह्मेति॒ व्य॑जानात् । अ॒न्नाद्ध्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । अन्ने॑न॒ जाता॑नि॒ जीव॑न्ति
    । अन्न॒ विँ॑श॒न्तीति॑ । तद्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ म्पित॑र॒मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑
    । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑ ऽतप्यत । स तप॑स्त॒प्त्वा ॥
    ऽनुवाकः ॥ प्रा॒णो ब्र॒ह्मेति॒ व्य॑जानात् । प्रा॒णाद्ध्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । प्रा॒णेन॒
    जाता॑नि॒ जीव॑न्ति । प्रा॒ण विँ॑श॒न्तीति॑ । तद्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ म्पित॑र॒मुप॑ससार । अधी॑हि
    भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑ ऽतप्यत ।
    स तप॑स्त॒प्त्वा ॥ ऽनुवाकः ॥ मनो॒ ब्रह्मेति॒ व्य॑जानात् । मन॑सो॒ ह्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते
    । मन॑सा॒ जाता॑नि॒ जीव॑न्ति । मनः॒ प्रय॑न्त्य॒भिसं विँ॑श॒न्तीति॑ । तद्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ म्पित॑र॒मुप॑ससार
    । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑
    ऽतप्यत । स तप॑स्त॒प्त्वा ॥ म्ब्रह्मेति॒ व्य॑जानात् । वि॒ज्ञाना॒द्ध्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते
    । वि॒ज्ञाने॑न॒ जाता॑नि॒ जीव॑न्ति । वि॒ज्ञान॒ विँ॑श॒न्तीति॑ । तद्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ म्पित॑र॒मुप॑ससार
    । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑
    ऽतप्यत । स तप॑स्त॒प्त्वा ॥ ऽनुवाकः ॥ आ॒न॒न्दो ब्र॒ह्मेति॒ व्य॑जानात् । आ॒नन्दा॒द्ध्ये॑व खल्वि॒मानि॒
    भूता॑नि॒ जाय॑न्ते । आ॒न॒न्देन॒ जाता॑नि॒ जीव॑न्ति । आ॒न॒न्द विँ॑श॒न्तीति॑ । सैषा भा र्ग॒वी वा॑रु॒णी
    वि॒द्या । प॒र॒मे व्यो॑म॒न्प्रति॑ष्ठिता । स य ए॒वं वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति । म॒हान्भ॑वति
    प्र॒जया॑ प॒शुभि॑र्ब्रह्मवर्च॒सेन॑ । म॒हान्की॒र्त्या ॥ न्न नि॑न्द्यात् । तद्व्र॒तम् । प्रा॒णो वा अन्नम्
    । शरी॑रमन्ना॒दम् । प्रा॒णे शरी॑र॒ म्प्रति॑ष्ठितम् । शरी॑रे प्रा॒णः प्रति॑ष्ठितः । तदे॒तदन्न॒मन्ने॒
    प्रति॑ष्ठितम् । स य ए॒तदन्न॒मन्ने॒ प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति । म॒हान्भ॑वति
    प्र॒जया॑ प॒शुभि॑र्ब्रह्मवर्च॒सेन॑ । म॒हान्की॒र्त्या ॥ न्न परि॑चक्षीत । तद्व्र॒तम् । आपो॒ वा अन्नम्
    । ज्योति॑रन्ना॒दम् । अ॒प्सु ज्योतिः॒ प्रति॑ष्ठितम् । ज्योति॒ष्यापः॒ प्रति॑ष्ठिताः । तदे॒तदन्न॒मन्ने॒
    प्रति॑ष्ठितम् । स य ए॒तदन्न॒मन्ने॒ प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति । महा॒न्भ॑वति
    प्र॒जया॑ प॒शुभि॑र्ब्रह्मवर्च॒सेन॑ । म॒हान्की॒र्त्या ॥ म्ब॒हु कु॑र्वीत । तद्व्र॒तम् । पृ॒थि॒वी वा अन्नम्
    ऽन्ना॒दः । पृ॒थि॒व्यामा॑का॒शः प्रति॑ष्ठितः । आ॒का॒शे पृ॑थि॒वी प्रति॑ष्ठिता । तदे॒तदन्न॒मन्ने॒ प्रति॑ष्ठितम्
    । स य ए॒तदन्न॒मन्ने॒ प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति । म॒हान्भ॑वति प्र॒जया॑
    प॒शुभि॑र्ब्रह्मवर्च॒सेन॑ । म॒हान्की॒र्त्या ॥ ऽनुवाकः ॥ न कञ्चन वसतौ प्रत्या॑चक्षी॒त । तद्व्र॒तम् ।
    तस्माद्यया कया च विधया बह्व॑न्न म्प्रा॒प्नुयात् । अराध्यस्मा अन्नमि॑त्याच॒क्षते । एतद्वै मुखतो ऽन्नग्ं
    रा॒द्धम् । मुखतो ऽस्मा अ॑न्नग्ं रा॒ध्यते । एतद्वै मध्यतो ऽन्नग्ं रा॒द्धम् । मध्यतो ऽस्मा अ॑न्नग्ं
    रा॒ध्यते । एतद्वा अन्ततो ऽन्नग्ं रा॒द्धम् । अन्ततो ऽस्मा अ॑न्नग्ं रा॒ध्यते ॥ वेँ॒द । क्षेम इ॑ति वा॒चि
    । योगक्षेम इति प्रा॑णापा॒नयोः । कर्मे॑ति ह॒स्तयोः । गतिरि॑ति पा॒दयोः । विमुक्तिरि॑ति पा॒यौ । इति मानुषी
    स्समा॒ज्ञाः । अथ दै॒वीः । तृप्तिरि॑ति वृ॒ष्टौ । बलमि॑ति वि॒द्युति ॥ ॥ यश इ॑ति प॒शुषु । ज्योतिरिति
    न॑क्षत्रे॒षु । प्रजातिरमृतमानन्द इ॑त्युप॒स्थे । सर्वमि॑त्याका॒शे । तत्प्रतिष्ठेत्यु॑पासी॒त । प्रतिष्ठा॑वान्भ॒वति
    । तन्मह इत्यु॑पासी॒त । म॑हान्भ॒वति । तन्मन इत्यु॑पासी॒त । मान॑वान्भ॒वति ॥ ॥ तन्नम इत्यु॑पासी॒त । नम्यन्ते
    ऽस्मै का॒माः । तद्ब्रह्मेत्यु॑पासी॒त । ब्रह्म॑वान्भ॒वति । तद्ब्रह्मणः परिमर इत्यु॑पासी॒त । पर्येण
    म्म्रियन्ते द्विषन्त॑स्सप॒त्नाः । परि ये भ्रातृ॒व्याः । स यश्चा॑य म्पु॒रुषे । यश्चासा॑वादि॒त्ये ।
    स एकः॑ ॥ ल्लोँ॑कात्प्रे॒त्य । एतमन्नमय मात्मानमुप॑सङ्क्र॒म्य । एत मात्मानमुप॑सङ्क्र॒म्य । एत मात्मानमुप॑सङ्क्र॒म्य
    । एतं मात्मानमुप॑सङ्क्र॒म्य । एतमानन्दमय मात्मानमुप॑सङ्क्र॒म्य । इमां स॒ञ्चरन्न् । एतथ्साम गा॑यन्ना॒स्ते
    । हा म॒हमन्नम् । अ॒हमन्ना॒दो ऽ॒हमन्ना॒दः । अ॒हग्ग् श्लोक॒कृद॒हग्ग् श्लोक॒कृद॒हग्ग् श्लोक॒कृत् । अ॒हमस्मि
    प्रथमजा ऋता न्देवेभ्यो अमृतस्य ना भा॒यि॒ । यो मा ददाति स इदेव मा मभ्य॑भ॒वाम् । सुव॒र्न ज्योतीः वेँद॑
    । इत्यु॑प॒निष॑त् ॥ ऽनुवाकः ॥ ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒
    मा वि॑द्विषा॒वहै श्शान्तिः॑ ॥ ॥ हरिः॑ ओम् ॥ ॥ श्री कृष्णार्पणमस्तु ॥
