id: sudarshana-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sudarshana Ashtottara Sata Nama Stotram
  devanagari: सुदर्शनाष्टोत्तरशतनामस्तोत्रम्
content:
  english: '||shrih|| sudarshanashcakrarajah tejovyuho mahadyutih | sahasrabahu-rdiptangah arunakshah
    pratapavan || 1|| anekadityasankashah prodyajjvalabhiranjitah | saudamini-sahasrabhah manikundala-shobhitah
    || 2|| pancabhutamanorupo shatkonantara-samsthitah | harantah karanodbhuta-roshabhishana-vigrahah
    || 3|| haripanilasatpadmavihararamanoharah | shrakararupassarvajnah sarvalokarcitaprabhuh || 4|| caturdashasahasrarah
    caturvedamayo-''nalah | bhaktacandramasajyotih bhavaroga-vinashakah || 5|| rephatmako makarashca rakshosrigrushitangakah
    | sarvadaityagrivanala-vibhedana-mahagajah || 6|| bhimadamshtrojjvalakaro bhimakarma vilocanah | nilavartma
    nityasukho nirmalashri-rniranjanah || 7|| raktamalyambaradharo raktacandanarushitah | rajogunakritishshuro
    rakshahkula-yamopamah || 8|| nityakshemakarah prajnah pashandajanakhandanah | narayanajnanuvarti naigamantahprakashakah
    || 9|| balinandanadordanda-khandano vijayakritih | mitrabhavi sarvamayo tamovidhvamsakastatha || 10||
    rajassattvatamodvarti trigunatma trilokadhrit | harimayagunopeto-''vyayo-''kshasvarupabhak || 11||
    paramatma paramjyotih pancakritya-parayanah | jnanashakti-balaishvarya-virya-tejah-prabhamayah ||
    12|| sadasatparamah purno vanmayo varado''cyutah | jivo gururhamsarupah pancashatpitharupakah || 13||
    matrikamandaladhyaksho madhudhvamsi manomayah | buddhirupashcittasakshi saro hamsaksharadvayah ||
    14|| mantra-yantra-prabhavajno mantra-yantra-mayo vibhuh | srashta kriyaspada-shshuddhah adharashcakra-rupakah
    || 15|| nirayudho hyasamrambhah sarvayudha-samanvitah | omkararupi purnatma amkarassadhya-bandhanah
    || 16|| aimkaro vakprado vagmi shrimkaraishvaryavardhanah | klimkaramohanakaro humphatkshobhanakritih
    || 17|| indrarcita-manovego dharanibhara-nashakah | viraradhyo vishvarupah vaishnavo vishnurupakah
    || 18|| satyavratah satyadharah satyadharmanushangakah'' narayanakripavyuha-tejashcakra-ssudarshanah
    || 19|| || shri sudarshanashtottarashatanama stotram sampurnam||'
  devanagari: ॥श्रीः॥ सुदर्शनश्चक्रराजः तेजोव्यूहो महाद्युतिः । सहस्रबाहु-र्दीप्ताङ्गः अरुणाक्षः प्रतापवान्
    ॥ १॥ अनेकादित्यसङ्काशः प्रोद्यज्ज्वालाभिरञ्जितः । सौदामिनी-सहस्राभः मणिकुण्डल-शोभितः ॥ २॥ पञ्चभूतमनोरूपो
    षट्कोणान्तर-संस्थितः । हरान्तः करणोद्भूत-रोषभीषण-विग्रहः ॥ ३॥ हरिपाणिलसत्पद्मविहारारमनोहरः । श्राकाररूपस्सर्वज्ञः
    सर्वलोकार्चितप्रभुः ॥ ४॥ चतुर्दशसहस्रारः चतुर्वेदमयो-ऽनलः । भक्तचान्द्रमसज्योतिः भवरोग-विनाशकः ॥ ५॥
    रेफात्मको मकारश्च रक्षोसृग्रूषिताङ्गकः । सर्वदैत्यग्रीवनाल-विभेदन-महागजः ॥ ६॥ भीमदंष्ट्रोज्ज्वलाकारो
    भीमकर्मा विलोचनः । नीलवर्त्मा नित्यसुखो निर्मलश्री-र्निरञ्जनः ॥ ७॥ रक्तमाल्यांबरधरो रक्तचन्दनरूषितः
    । रजोगुणाकृतिश्शूरो रक्षःकुल-यमोपमः ॥ ८॥ नित्यक्षेमकरः प्राज्ञः पाषण्डजनखण्डनः । नारायणाज्ञानुवर्ती
    नैगमान्तःप्रकाशकः ॥ ९॥ बलिनन्दनदोर्दण्ड-खण्डनो विजयाकृतिः । मित्रभावी सर्वमयो तमोविध्वंसकस्तथा ॥ १०॥
    रजस्सत्त्वतमोद्वर्ती त्रिगुणात्मा त्रिलोकधृत् । हरिमायागुणोपेतो-ऽव्ययो-ऽक्षस्वरूपभाक् ॥ ११॥ परमात्मा
    परंज्योतिः पञ्चकृत्य-परायणः । ज्ञानशक्ति-बलैश्वर्य-वीर्य-तेजः-प्रभामयः ॥ १२॥ सदसत्परमः पूर्णो वाङ्मयो
    वरदोऽच्युतः । जीवो गुरुर्हंसरूपः पञ्चाशत्पीठरूपकः ॥ १३॥ मातृकामण्डलाध्यक्षो मधुध्वंसी मनोमयः । बुद्धिरूपश्चित्तसाक्षी
    सारो हंसाक्षरद्वयः ॥ १४॥ मन्त्र-यन्त्र-प्रभावज्ञो मन्त्र-यन्त्र-मयो विभुः । स्रष्टा क्रियास्पद-श्शुद्धः
    आधारश्चक्र-रूपकः ॥ १५॥ निरायुधो ह्यसंरम्भः सर्वायुध-समन्वितः । ओम्काररूपी पूर्णात्मा आंकारस्साध्य-बन्धनः
    ॥ १६॥ ऐंकारो वाक्प्रदो वग्मी श्रींकारैश्वर्यवर्धनः । क्लींकारमोहनाकारो हुंफट्क्षोभणाकृतिः ॥ १७॥ इन्द्रार्चित-मनोवेगो
    धरणीभार-नाशकः । वीराराध्यो विश्वरूपः वैष्णवो विष्णुरूपकः ॥ १८॥ सत्यव्रतः सत्यधरः सत्यधर्मानुषङ्गकः'
    नारायणकृपाव्यूह-तेजश्चक्र-स्सुदर्शनः ॥ १९॥ ॥ श्री सुदर्शनाष्टोत्तरशतनाम स्तोत्रं संपूर्णम्॥
