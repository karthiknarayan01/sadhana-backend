id: mahagayatrikhadgamalastotram
category: stotram
name:
  english: mahagayatrikhadgamalastotram
  devanagari: महागायत्रीखड्गमालास्तोत्रम्
content:
  english: om tatsaviturvarenyam hridayaya namah | bhargo devasya shirase svaha | dhimahi shikhayai vashat
    | dhiyo yo nah kavacaya hum | pracodayat netratrayaya vaushat | om tatsaviturvarenyam bhargo devasya
    dhimahi dhiyo yo nah pracodayat astraya phat || atha stotram | om aim hrim shrim lim | shrilekhini
    hridayadevi | shirodevi | shikhadevi | kavacadevi | netradevi | astradevi | guhyadevi | padadevi |
    sarvangadevi | mahalekhe | paralekhe | cidalekhe | brahmalekhe | vishvalekhe | kalalekhe | karmalekhe
