id: vishnuproktamshivamantramahimavarnanam
category: mantra
name:
  english: vishnuproktamshivamantramahimavarnanam
  devanagari: विष्णुप्रोक्तंशिवमन्त्रमहिमावर्णनम्
content:
  english: nunam shankaranugraham vina | shivanamasmritiphalam vaktumeva na shakyate || 507|| madrishairasthirasvantaih
    shankarena vina dhruvam | atah pancaksharah shaivo japaniyastvaya sada || 508|| shaivah pancaksharo
    bhavyo muktido japyate maya | shaivah pancaksharo mantrah shivarupah shivapradah || 509|| kashyamantargrihe
    sthitva japaniyah prayatnatah | na kashisadrisham kshetram tatrapyantargriham varam || 510|| tatrapi
    cottamam jneyam jnanavapitatam shubham | tatra japto mahamantrah shaivo'yam mokshadayakah || 511||
    tasmanmantravarah shaivah tatra japyo manuh sada | pancavaktrodashabhujah sarvadevottamah prabhuh
    || 512|| vedopagitah sarvajnah somasuryagnilocanah | gauribhushitavamangah kalyanagunasagarah || 513||
    sarvalokapatih shriman sarvadevanvito vibhuh | nishkalo nirguno nityo nirlipto nirupadhikah || 514||
    niranjano nirakaro niravadyo niramayah | jyotihsvarupo vimalashcidghanah sakalatmanah
  devanagari: नूनं शङ्करानुग्रहं विना । शिवनामस्मृतिफलं वक्तुमेव न शक्यते ॥ ५०७॥ मादृशैरस्थिरस्वान्तैः
    शङ्करेण विना ध्रुवम् । अतः पञ्चाक्षरः शैवो जपनीयस्त्वया सदा ॥ ५०८॥ शैवः पञ्चाक्षरो भव्यो मुक्तिदो
    जप्यते मया । शैवः पञ्चाक्षरो मन्त्रः शिवरूपः शिवप्रदः ॥ ५०९॥ काश्यामन्तर्गृहे स्थित्वा जपनीयः प्रयत्नतः
    । न काशीसदृशं क्षेत्रं तत्राप्यन्तर्गृहं वरम् ॥ ५१०॥ तत्रापि चोत्तमं ज्ञेयं ज्ञानवापीतटं शुभम् । तत्र
    जप्तो महामन्त्रः शैवोऽयं मोक्षदायकः ॥ ५११॥ तस्मान्मन्त्रवरः शैवः तत्र जप्यो मनुः सदा । पञ्चवक्त्रोदशभुजः
    सर्वदेवोत्तमः प्रभुः ॥ ५१२॥ वेदोपगीतः सर्वज्ञः सोमसूर्याग्निलोचनः । गौरीभूषितवामाङ्गः कल्याणगुणसागरः
    ॥ ५१३॥ सर्वलोकपतिः श्रीमान् सर्वदेवान्वितो विभुः । निष्कलो निर्गुणो नित्यो निर्लिप्तो निरुपाधिकः ॥
    ५१४॥ निरञ्जनो निराकारो निरवद्यो निरामयः । ज्योतिःस्वरूपो विमलश्चिद्घनः सकलात्मनः
meaning: {}
