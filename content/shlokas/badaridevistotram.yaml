id: badaridevistotram
category: stotram
name:
  english: badaridevistotram
  devanagari: बदरीदेवीस्तोत्रम्
content:
  english: badaridevistotram badridevyai dhvajam dadyannarayanyai namo'stu te | shrimanikyai namastubhyam
    ramayai te namo namah || 69|| namah shripurushottamyai padmavatyai namo namah | namaste balayoginyai
    karshnyai devyai namo namah || 70|| shulam'kushadharayai te himajayai namo'stu te | tvam lakshmistvam
    sati shrishca tvam rama radhika prabhau || 71|| tvam parvati mahalakshmistasyai brahmyai ca te namah
    | namaste badarishvaryai harinyai te namo namah || 72|| tapasanam phaladatryai sudhadhartryai ca te
    namah | trailokyavanditayai te matarbadri ca te namah || 73|| tava chaya'nadimayachayanashakari mata
    | tava mulam brahmamulam mulaprakritivarakam || 74|| tava shakha dhamashakha ullanghya'ksharadhamadah
    | tava patranicchatrani brahmasamrajyadani vai || 75|| tava phalani bhuktani yoginam phaladani ca
    | sarvayogaphaladani parabrahmapradani ca || 76|| tava bijani lokanam vasanakshayakani vai | tava
    vamshya badaryashca papinam papanashikah || 77|| tvatphalanam bhakshanam ca mokshaphaladanapradam
    | tvatpatranam sparshanam ca brahmanandagrihapradam || 78|| tvanmuleshu namanam ca sarva'suravinashanam
    | tvanmurterdarshanam badri parabrahma'valokanam || 79|| tvatphaladhyajalaih snanam brahmahradavagahanam
    | tvadadhahshayanam badri sarvatirthadhivasanam || 5
  devanagari: बदरीदेवीस्तोत्रम् बद्रीदेव्यै ध्वजं दद्यान्नारायण्यै नमोऽस्तु ते । श्रीमाणिक्यै नमस्तुभ्यं
    रमायै ते नमो नमः ॥ ६९॥ नमः श्रीपुरुषोत्तम्यै पद्मावत्यै नमो नमः । नमस्ते बालयोगिन्यै कार्ष्ण्यै देव्यै
    नमो नमः ॥ ७०॥ शूलांऽकुशधरायै ते हिमजायै नमोऽस्तु ते । त्वं लक्ष्मीस्त्वं सती श्रीश्च त्वं रमा राधिका
    प्रभौ ॥ ७१॥ त्वं पार्वती महालक्ष्मीस्तस्यै ब्राह्म्यै च ते नमः । नमस्ते बदरीश्वर्यै हरिण्यै ते नमो
    नमः ॥ ७२॥ तापसानां फलदात्र्यै सुधाधार्त्र्यै च ते नमः । त्रैलोक्यवन्दितायै ते मातर्बद्रि च ते नमः
    ॥ ७३॥ तव छायाऽनादिमायाछायानाशकरी मता । तव मूलं ब्रह्ममूलं मूलप्रकृतिवारकम् ॥ ७४॥ तव शाखा धामशाखा उल्लङ्घ्याऽक्षरधामदाः
    । तव पत्राणिच्छत्राणि ब्रह्मसाम्राज्यदानि वै ॥ ७५॥ तव फलानि भुक्तानि योगिनां फलदानि च । सर्वयोगफलदानि
    परब्रह्मप्रदानि च ॥ ७६॥ तव बीजानि लोकानां वासनाक्षयकाणि वै । तव वंश्या बदर्यश्च पापिनां पापनाशिकाः
    ॥ ७७॥ त्वत्फलानां भक्षणं च मोक्षफलादनप्रदम् । त्वत्पत्राणां स्पर्शनं च ब्रह्मानन्दगृहप्रदम् ॥ ७८॥
    त्वन्मूलेषु नमनं च सर्वाऽसुरविनाशनम् । त्वन्मूर्तेर्दर्शनं बद्रि परब्रह्माऽवलोकनम् ॥ ७९॥ त्वत्फलाढ्यजलैः
    स्नानं ब्रह्मह्रदावगाहनम् । त्वदधःशयनं बद्रि सर्वतीर्थाधिवासनम् ॥ ५
