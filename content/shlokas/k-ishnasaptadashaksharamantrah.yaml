id: k-ishnasaptadashaksharamantrah
category: stotram
name:
  english: kṟishnasaptadashaksharamantrah
  devanagari: क्ऱिष्णसप्तदशाक्षरमन्त्रः
content:
  english: shrikrishnasya saptadashaksharo mantrah shrikrishnamantrakavacam shriganeshaya namah | mahadeva
    uvacah | om shrim namah shrikrishnaya paripurnatamaya ca | mantreshu mantrarajo'yam mahan saptadashaksharah
    || 1|| siddho'yam pancalakshena japena munipungava | taddashamsham ca havanam taddashamshabhishecanam
    || 2|| tarpanam taddashamsham ca taddashamsham ca marjanam | suvarnanam ca shatakam purashcaranadakshina
    || 3|| mantrasiddhasya pumsashca vishvam karatalam mune | shaktah patum samudramshca vishvam samharttumishvarah
    | pancabhautikadehena vaikuntham gantumishvarah || 4|| tasya samsparshamatrena padapankajarenuna |
    putani sarvatirthani sadyah puta vasundhara || 5|| || shrikrishnasya saptadashaksharo mantrah samaptam
    ||
  devanagari: श्रीकृष्णस्य सप्तदशाक्षरो मन्त्रः श्रीकृष्णमन्त्रकवचम् श्रीगणेशाय नमः । महादेव उवाचः । ॐ
    श्रीं नमः श्रीकृष्णाय परिपूर्णतमाय च । मन्त्रेषु मन्त्रराजोऽयं महान् सप्तदशाक्षरः ॥ १॥ सिद्धोऽयं पञ्चलक्षेण
    जपेन मुनिपुङ्गव । तद्दशांशं च हवनं तद्दशांशाभिषेचनम् ॥ २॥ तर्पणं तद्दशांशं च तद्दशांशं च मार्जनम्
    । सुवर्णानां च शतकं पुरश्चरणदक्षिणा ॥ ३॥ मन्त्रसिद्धस्य पुंसश्च विश्वं करतलं मुने । शक्तः पातुं समुद्रांश्च
    विश्वं संहर्त्तुमीश्वरः । पाञ्चभौतिकदेहेन वैकुण्ठं गन्तुमीश्वरः ॥ ४॥ तस्य संस्पर्शमात्रेण पादपङ्कजरेणुना
    । पूतानि सर्वतीर्थानि सद्यः पूता वसुन्धरा ॥ ५॥ ॥ श्रीकृष्णस्य सप्तदशाक्षरो मन्त्रः समाप्तम् ॥
