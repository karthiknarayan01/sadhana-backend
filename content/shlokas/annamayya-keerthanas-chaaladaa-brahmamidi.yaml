id: annamayya-keerthanas-chaaladaa-brahmamidi
category: stotram
name:
  english: Annamayya Keerthanas Chaaladaa Brahmamidi
content:
  english: khandacapu pallavi calada brahmamidi sankirtanam miku | jalèlla nadagincu sankirtanam || santosha
    karamaina sankirtanam | santapa managincu sankirtanam | jantuvula rakshincu sankirtanam | santatamu
    dalacudi sankirtanam || calada brahmamidi sankirtanam miku samajamu gancinadi sankirtanam | samamuna
    kèkkudi sankirtanam | samipya mindariki sankirtanam | samanyama vishnu sankirtanam || calada brahmamidi
    sankirtanam miku jamubari vidipincu sankirtanam | sama buddhi vòdamincu sankirtanam | jamali saukhyamuliccu
    sankirtanam | shamadamadula jeyu sankirtanam || caranam jalajasanuni nori sankirtanam | caligònda
    sutadalacu sankirtanam | caluva gadu nalukaku sankirtanam | calapatti talacudi sankirtanam || caranam
    saravi sampadaliccu sankirtanam | sarileni didiyapo sankirtanam | sarusa venkata vibhuni sankirtanam
    | sarugananu dalacudi sankirtanam || calada brahmamidi sankirtanam miku jalèlla nadagincu sankirtanam
    ||
  devanagari: खण्डचापु पल्लवि चालदा ब्रह्ममिदि सङ्कीर्तनं मीकु । जालॆल्ल नडगिञ्चु सङ्कीर्तनं ॥ सन्तोष
    करमैन सङ्कीर्तनं । सन्ताप मणगिञ्चु सङ्कीर्तनं । जन्तुवुल रक्षिञ्चु सङ्कीर्तनं । सन्ततमु दलचुडी सङ्कीर्तनं
    ॥ चालदा ब्रह्ममिदि सङ्कीर्तनं मीकु सामजमु गाञ्चिनदि सङ्कीर्तनं । साममुन कॆक्कुडी सङ्कीर्तनं । सामीप्य
    मिन्दरिकि सङ्कीर्तनं । सामान्यमा विष्णु सङ्कीर्तनं ॥ चालदा ब्रह्ममिदि सङ्कीर्तनं मीकु जमुबारि विडिपिञ्चु
    सङ्कीर्तनं । सम बुद्धि वॊडमिञ्चु सङ्कीर्तनं । जमलि सौख्यमुलिच्चु सङ्कीर्तनं । शमदमादुल जेयु सङ्कीर्तनं
    ॥ चरणं जलजासनुनि नोरि सङ्कीर्तनं । चलिगॊण्ड सुतदलचु सङ्कीर्तनं । चलुव गडु नालुककु सङ्कीर्तनं । चलपट्टि
    तलचुडी सङ्कीर्तनं ॥ चरणं सरवि सम्पदलिच्चु सङ्कीर्तनं । सरिलेनि दिदियपो सङ्कीर्तनं । सरुस वेङ्कट विभुनि
    सङ्कीर्तनं । सरुगननु दलचुडी सङ्कीर्तनं ॥ चालदा ब्रह्ममिदि सङ्कीर्तनं मीकु जालॆल्ल नडगिञ्चु सङ्कीर्तनं
    ॥
