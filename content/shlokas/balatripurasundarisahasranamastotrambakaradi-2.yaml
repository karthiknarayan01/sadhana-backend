id: balatripurasundarisahasranamastotrambakaradi-2
category: sahasranama
name:
  english: balatripurasundarisahasranamastotrambakaradi
  devanagari: बालात्रिपुरसुन्दरीसहस्रनामस्तोत्रम्बकारादि
content:
  english: karaprishthabhyam namah | || anganyasah || om aim hrim shrim aim viratpurushatmikayai shrim
    hrim aim aim hridayaya namah | om aim hrim shrim im shriparabrahmeshvarye shrim hrim im aim im shirase
    svaha | om aim hrim shrim lam shrim angushthamatrapurushatmikayai shrim hrim aim lam shikhayai vashat
    | om aim hrim shrim lam shrim pancadashitrikutamayayai shrim hrim aim lam kavacaya hum | om aim hrim
    shrim im prasadavijaya shrim hrim aim im netratrayaya vaushat | om aim hrim shrim shrim mahashaktijnanatmikayai
    shrim hrim aim ai astraya phat | || dhyanam || ainkara
  devanagari: करपृष्ठाभ्यां नमः । ॥ अङ्गन्यासः ॥ ॐ ऐं ह्रीं श्रीं ऐं विराट्पुरुषात्मिकायै श्रीं ह्रीं
    ऐं ऐं हृदयाय नमः । ॐ ऐं ह्रीं श्रीं ईं श्रीपरब्रह्मेश्वर्ये श्रीं ह्रीं इं ऐं ईं शिरसे स्वाहा । ॐ
    ऐं ह्रीं श्रीं लां श्रीं अङ्गुष्ठमात्रपुरुषात्मिकायै श्रीं ह्रीं ऐं लां शिखायै वषट् । ॐ ऐं ह्रीं श्रीं
    लां श्रीं पञ्चदशीत्रिकूटमायायै श्रीं ह्रीं ऐं लां कवचाय हुम् । ॐ ऐं ह्रीं श्रीं इं प्रासादवीजाय श्रीं
    ह्रीं ऐं ईं नेत्रत्रयाय वौषट् । ॐ ऐं ह्रीं श्रीं श्रीं महाशक्तिज्ञानात्मिकायै श्रीं ह्रीं ऐं ऐ अस्त्राय
    फट् । ॥ ध्यानम् ॥ ऐङ्कार
meaning: {}
