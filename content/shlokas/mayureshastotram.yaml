id: mayureshastotram
category: stotram
name:
  english: mayureshastotram
  devanagari: मयूरेशस्तोत्रम्
content:
  english: mayureshastotram brahmovaca | puranapurusham devam nanakridakaram muda | mayavinam durvibhagyam
    mayuresham namamyaham || 1|| paratparam cidanandam nirvikaram hridisthitam | gunatitam gunamayam mayuresham
    namamyaham || 2|| srijantam palayantam ca samharantam nijecchaya | sarvavighnaharam devam mayuresham
    namamyaham || 3|| nanadaityanihantaram nanarupani bibhratam | nanayudhadharam bhaktya mayuresham namamyaham
    || 4|| indradidevatavrindairabhishtatamaharnisham | sadasadvaktamavyaktam mayuresham namamyaham ||
    5|| sarvashaktimayam devam sarvarupadharam vibhum | sarvavidyapravaktaram mayuresham namamyaham ||
    6|| parvatinandanam shambhoranandaparivardhanam | bhaktanandakaram nityam mayuresham namamyaham ||
    7|| munidhyeyam muninutam munikamaprapurakam | samashtivyashtirupam tvam mayuresham namamyaham ||
    8|| sarvajnananihantaram sarvajnanakaram shucim | satyajnanamayam satyam mayuresham namamyaham ||
    9|| anekakotibrahmandanayakam jagadishvaram | anantavibhavam vishnum mayuresham namamyaham || 10||
    mayuresha uvaca | idam brahmakaram stotram sarvapapapranashanam | karagrihagatanam ca mocanam dinasaptakat
    || 11|| adhivyadhiharam caiva bhuktimuktipradam shubham || 12|| iti mayureshastotram sampurnam |
  devanagari: मयूरेशस्तोत्रम् ब्रह्मोवाच । पुराणपुरुषं देवं नानाक्रीडाकरं मुदा । मायाविनं दुर्विभाग्यं
    मयूरेशं नमाम्यहम् ॥ १॥ परात्परं चिदानन्दं निर्विकारं हृदिस्थितम् । गुणातीतं गुणमयं मयूरेशं नमाम्यहम्
    ॥ २॥ सृजन्तं पालयन्तं च संहरन्तं निजेच्छया । सर्वविघ्नहरं देवं मयूरेशं नमाम्यहम् ॥ ३॥ नानादैत्यनिहन्तारं
    नानारूपाणि बिभ्रतम् । नानायुधधरं भक्त्या मयूरेशं नमाम्यहम् ॥ ४॥ इन्द्रादिदेवतावृन्दैरभिष्टतमहर्निशम्
    । सदसद्वक्तमव्यक्तं मयूरेशं नमाम्यहम् ॥ ५॥ सर्वशक्तिमयं देवं सर्वरूपधरं विभुम् । सर्वविद्याप्रवक्तारं
    मयूरेशं नमाम्यहम् ॥ ६॥ पार्वतीनन्दनं शम्भोरानन्दपरिवर्धनम् । भक्तानन्दकरं नित्यं मयूरेशं नमाम्यहम्
    ॥ ७॥ मुनिध्येयं मुनिनुतं मुनिकामप्रपूरकम् । समष्टिव्यष्टिरूपं त्वां मयूरेशं नमाम्यहम् ॥ ८॥ सर्वज्ञाननिहन्तारं
    सर्वज्ञानकरं शुचिम् । सत्यज्ञानमयं सत्यं मयूरेशं नमाम्यहम् ॥ ९॥ अनेककोटिब्रह्माण्डनायकं जगदीश्वरम्
    । अनन्तविभवं विष्णुं मयूरेशं नमाम्यहम् ॥ १०॥ मयूरेश उवाच । इदं ब्रह्मकरं स्तोत्रं सर्वपापप्रनाशनम्
    । कारागृहगतानां च मोचनं दिनसप्तकात् ॥ ११॥ आधिव्याधिहरं चैव भुक्तिमुक्तिप्रदं शुभम् ॥ १२॥ इति मयूरेशस्तोत्रं
    सम्पूर्णम् ।
