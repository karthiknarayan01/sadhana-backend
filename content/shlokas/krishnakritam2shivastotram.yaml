id: krishnakritam2shivastotram
category: stotram
name:
  english: krishnakritam2shivastotram
  devanagari: कृष्णकृतं२शिवस्तोत्रम्
content:
  english: shrikrishnakritam 2 shivastotram shrikrishna uvaca | devadeva mahadeva parabrahma satam gate
    | kshamasva caparadham me prasida parameshvara || 22|| tvattah sharva ca sarvam ca tvayi sarvam maheshvara
    | sarvam tvam nikhiladhisha prasida parameshvara || 23|| tvam jyotih paramam sakshatsarvavyapi sanatanah
    | tvaya nathena gaurisha sanathassakala vayam || 24|| sarvopari nijam matva viharanmohamashritah |
    tatphalam praptavanasmi shapam praptassavamakah || 25|| parshadapravaro yo me sudama nama gopakah
    | sa radhashapatah svamindanavim yonimashritah || 26|| asmanuddhara durggesha prasida parameshvara
    | shapoddharam kurushvadya pahi nashsharanagatan || 27|| ityuktva viraramaiva shrikrishno radhaya
    saha | prasanno'bhucchivastatra sharanagatavatsalah || 28|| iti shivapurane rudrasamhitayam yuddhakhande
    ekatrimshadhyayantargatam shrikrishnakritam shivastotram samaptam | shivapurana | rudrasamhita | yuddhakhanda
    | adhyaya 31
  devanagari: श्रीकृष्णकृतं २ शिवस्तोत्रम् श्रीकृष्ण उवाच । देवदेव महादेव परब्रह्म सतां गते । क्षमस्व
    चापराधं मे प्रसीद परमेश्वर ॥ २२॥ त्वत्तः शर्व च सर्वं च त्वयि सर्वं महेश्वर । सर्वं त्वं निखिलाधीश
    प्रसीद परमेश्वर ॥ २३॥ त्वं ज्योतिः परमं साक्षात्सर्वव्यापी सनातनः । त्वया नाथेन गौरीश सनाथास्सकला
    वयम् ॥ २४॥ सर्वोपरि निजं मत्वा विहरन्मोहमाश्रितः । तत्फलं प्राप्तवानस्मि शापं प्राप्तस्सवामकः ॥ २५॥
    पार्षदप्रवरो यो मे सुदामा नाम गोपकः । स राधाशापतः स्वामिन्दानवीं योनिमाश्रितः ॥ २६॥ अस्मानुद्धर दुर्ग्गेश
    प्रसीद परमेश्वर । शापोद्धारं कुरुष्वाद्य पाहि नश्शरणागतान् ॥ २७॥ इत्युक्त्वा विररामैव श्रीकृष्णो राधया
    सह । प्रसन्नोऽभूच्छिवस्तत्र शरणागतवत्सलः ॥ २८॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे एकत्रिंशाध्यायान्तर्गतं
    श्रीकृष्णकृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । रुद्रसंहिता । युद्धखण्ड । अध्याय ३१
meaning: {}
