id: sri-gayatri-hrudayam
category: stotram
name:
  english: Sri Gayatri Hrudayam
content:
  english: narada uvaca bhagavan devadevesha bhutabhavyajagatprabho | kavacam ca shrutam divyam gayatrimantravigraham
    || || adhuna shrotumicchami gayatrihridayam param | yaddharanadbhavetpunyam gayatrijapato'khilam ||
    || shrinarayana uvaca devyashca hridayam proktam naradatharvane sphutam | tadevaham pravakshyami rahasyatirahasyakam
    || || viradrupam mahadevim gayatrim vedamataram | dhyatva tasyastvathangeshu dhyayedetashca devatah
    || || pindabrahmandayoraikyadbhavayetsvatanau tatha | devirupe nije dehe tanmayatvaya sadhakah ||
    || nadevo'bhyarcayeddevamiti vedavido viduh | tato'bhedaya kaye sve bhavayeddevata imah || || atha
    tatsampravakshyami tanmayatvamatho bhavet | gayatrihridayasya'sya'pyahameva rishih smritah || || gayatrichanda
    uddishtam devata parameshvari | purvoktena prakarena kuryadangani shatkramat | asane vijane deshe
    dhyayedekagramanasah || || atharthanyasah | dyaumurdhni daivatam | dantapanktavashvinau | ubhe sandhye
    caushthau | mukhamagnih | jihva sarasvati | grivayam tu brihaspatih | stanayorvasavo'shtau | bahvormarutah
    | hridaye parjanyah | akashamudaram | nabhavantariksham | katyorindragni | jaghane vijnanaghanah prajapatih
    | kailasamalaye uru | vishvedeva janvoh | janghayam kaushikah | guhyamayane | uru pitarah | padau
    prithivi | vanaspatayo'ngulishu | rishayo romani | nakhani muhurtani | asthishu grahah | asrinmamsamritavah
    || samvatsara vai nimisham | ahoratravadityashcandramah | pravaram divyam gayatrim sahasranetram sharanamaham
    prapadye || om tatsaviturvarenyaya namah | om tatpurvajayaya namah | tatprataradityaya namah | tatprataradityapratishthayai
    namah || prataradhiyano ratrikritam papam nashayati | sayamadhiyano divasakritam papam nashayati |
    sayam prataradhiyano apapo bhavati | sarvatirtheshu snato bhavati | sarvairdevairjnato bhavati | avacyavacanatputo
    bhavati | abhakshyabhakshanatputo bhavati | abhojyabhojanatputo bhavati | acoshyacoshanatputo bhavati
    | asadhyasadhanatputo bhavati | dushpratigrahashatasahasratputo bhavati | sarvapratigrahatputo bhavati
    | panktidushanatputo bhavati | anritavacanatputo bhavati | atha'brahmacari brahmacari bhavati | anena
    hridayenadhitena kratusahasreneshtam bhavati | shashtishatasahasragayatrya japyani phalani bhavanti
    | ashtau brahmanan samyaggrahayet | tasya siddhirbhavati | ya idam nityamadhiyano brahmanah pratah
    shucih sarvapapaih pramucyata iti | brahmaloke mahiyate || ityaha bhagavan shrinarayanah || iti shridevibhagavate
    mahapurane dvadashaskandhe shri gayatri hridayam nama caturtho'dhyayah ||
  devanagari: नारद उवाच भगवन् देवदेवेश भूतभव्यजगत्प्रभो । कवचं च श्रुतं दिव्यं गायत्रीमन्त्रविग्रहम् ॥
    ॥ अधुना श्रोतुमिच्छामि गायत्रीहृदयं परम् । यद्धारणाद्भवेत्पुण्यं गायत्रीजपतोऽखिलम् ॥ ॥ श्रीनारायण
    उवाच देव्याश्च हृदयं प्रोक्तं नारदाथर्वणे स्फुटम् । तदेवाहं प्रवक्ष्यामि रहस्यातिरहस्यकम् ॥ ॥ विराड्रूपां
    महादेवीं गायत्रीं वेदमातरम् । ध्यात्वा तस्यास्त्वथाङ्गेषु ध्यायेदेताश्च देवताः ॥ ॥ पिण्डब्रह्मण्डयोरैक्याद्भावयेत्स्वतनौ
    तथा । देवीरूपे निजे देहे तन्मयत्वाय साधकः ॥ ॥ नादेवोऽभ्यर्चयेद्देवमिति वेदविदो विदुः । ततोऽभेदाय काये
    स्वे भावयेद्देवता इमाः ॥ ॥ अथ तत्सम्प्रवक्ष्यामि तन्मयत्वमथो भवेत् । गायत्रीहृदयस्याऽस्याऽप्यहमेव
    ऋषिः स्मृतः ॥ ॥ गायत्रीछन्द उद्दिष्टं देवता परमेश्वरी । पूर्वोक्तेन प्रकारेण कुर्यादङ्गानि षट्क्रमात्
    । आसने विजने देशे ध्यायेदेकाग्रमानसः ॥ ॥ अथार्थन्यासः । द्यौमूर्ध्नि दैवतम् । दन्तपङ्क्तावश्विनौ ।
    उभे सन्ध्ये चौष्ठौ । मुखमग्निः । जिह्वा सरस्वती । ग्रीवायां तु बृहस्पतिः । स्तनयोर्वसवोऽष्टौ । बाह्वोर्मरुतः
    । हृदये पर्जन्यः । आकाशमुदरम् । नाभावन्तरिक्षम् । कट्योरिन्द्राग्नी । जघने विज्ञानघनः प्रजापतिः ।
    कैलासमलये ऊरू । विश्वेदेवा जान्वोः । जङ्घायां कौशिकः । गुह्यमयने । ऊरू पितरः । पादौ पृथिवी । वनस्पतयोऽङ्गुलीषु
    । ऋषयो रोमाणि । नखानि मुहूर्तानि । अस्थिषु ग्रहाः । असृङ्मांसमृतवः ॥ संवत्सरा वै निमिषम् । अहोरात्रावादित्यश्चन्द्रमाः
    । प्रवरां दिव्यां गायत्रीं सहस्रनेत्रां शरणमहं प्रपद्ये ॥ ॐ तत्सवितुर्वरेण्याय नमः । ॐ तत्पूर्वाजयाय
    नमः । तत्प्रातरादित्याय नमः । तत्प्रातरादित्यप्रतिष्ठायै नमः ॥ प्रातरधीयानो रात्रिकृतं पापं नाशयति
    । सायमधीयानो दिवसकृतं पापं नाशयति । सायं प्रातरधीयानो अपापो भवति । सर्वतीर्थेषु स्नातो भवति । सर्वैर्देवैर्ज्ञातो
    भवति । अवाच्यवचनात्पूतो भवति । अभक्ष्यभक्षणात्पूतो भवति । अभोज्यभोजनात्पूतो भवति । अचोष्यचोषणात्पूतो
    भवति । असाध्यसाधनात्पूतो भवति । दुष्प्रतिग्रहशतसहस्रात्पूतो भवति । सर्वप्रतिग्रहात्पूतो भवति । पङ्क्तिदूषणात्पूतो
    भवति । अनृतवचनात्पूतो भवति । अथाऽब्रह्मचारी ब्रह्मचारी भवती । अनेन हृदयेनाधीतेन क्रतुसहस्रेणेष्टं
    भवति । षष्टिशतसहस्रगायत्र्या जप्यानि फलानि भवन्ति । अष्टौ ब्राह्मणान् सम्यग्ग्राहयेत् । तस्य सिद्धिर्भवति
    । य इदं नित्यमधीयानो ब्राह्मणः प्रातः शुचिः सर्वपापैः प्रमुच्यत इति । ब्रह्मलोके महीयते ॥ इत्याह भगवान्
    श्रीनारायणः ॥ इति श्रीदेवीभागवते महापुराणे द्वादशस्कन्धे श्री गायत्री हृदयं नाम चतुर्थोऽध्यायः ॥
