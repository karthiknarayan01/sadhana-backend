id: markandeyakritam3vishnustotram
category: stotram
name:
  english: markandeyakritam3vishnustotram
  devanagari: मार्कण्डेयकृतं३विष्णुस्तोत्रम्
content:
  english: markandeyakritam 3 vishnustotram markandeya uvaca | ashashvate ca samsare sare te caranambuje
    | samuddharah katham nrinam trahi mam parameshvara || 54|| tapatrayaparishrantamanekajnanajrimbhitam
    | samsarakuhare bhrantam trahi mam kripaya'cyuta || 55|| anekayoniyantreshu nihsritestanuvedanam |
    garbhavasakritam praptam trahi mam karunambudhe || 56|| krimibhakshitasarvangam kshutpipasakulam ca
    hi | antramalakule garbhe trahi mam madhusudana || 57|| amedhyadibhiraliptam nishceshtashramamakulam
    | smarantam nijakarmottham trahi mam madhusudana || 58|| vacanadananihshvasashaktam bhayamupagatam
    | garbhavasamahaduhkham trahi mam madhusudana || 59|| jaramaranabalyadiduhkhasamsarapiditam | duhkhabdhau
    sukhabuddhim mam kripasindho prapalaya || 3
  devanagari: मार्कण्डेयकृतं ३ विष्णुस्तोत्रम् मार्कण्डेय उवाच । अशाश्वते च संसारे सारे ते चरणाम्बुजे
    । समुद्धारः कथं नॄणां त्राहि मां परमेश्वर ॥ ५४॥ तापत्रयपरिश्रान्तमनेकाज्ञानजृम्भितम् । संसारकुहरे
    भ्रान्तं त्राहि मां कृपयाऽच्युत ॥ ५५॥ अनेकयोनियन्त्रेषु निःसृतेस्तनुवेदनाम् । गर्भवासकृतां प्राप्तं
    त्राहि मां करुणाम्बुधे ॥ ५६॥ कृमिभक्षितसर्वाङ्गं क्षुत्पिपासाकुलं च हि । आन्त्रमालाकुले गर्भे त्राहि
    मां मधुसूदन ॥ ५७॥ अमेध्यादिभिरालिप्तं निश्चेष्टश्रममाकुलम् । स्मरन्तं निजकर्मोत्थं त्राहि मां मधुसूदन
    ॥ ५८॥ वचनादाननिःश्वासाशक्तं भयमुपागतम् । गर्भवासमहादुःखं त्राहि मां मधुसूदन ॥ ५९॥ जरामरणबाल्यादिदुःखसंसारपीडितम्
    । दुःखाब्धौ सुखबुद्धिं मां कृपासिन्धो प्रपालय ॥ ३
