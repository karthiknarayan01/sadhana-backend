id: siddhantasaropanishat
category: upanishad
name:
  english: siddhantasaropanishat
  devanagari: सिद्धान्तसारोपनिषत्
content:
  english: nijamandakatakshacidanandamayanekaprasadavisheshaih pariveshtitam brahmavidyamayairanantaprakaranandamriratadivyamangalavimanaih
    sushobhitam cidrupavilasanibhacinmayasanam virajate | adhitishthanti tijorashim tadantargatadivyatejovishepamakhilapavitranam
    paramam pavitram cidrupaparanantanityamuktaibhivyaptam saccidanandarupah shivatmaikyopasakah || iti
    caturthavaranam | pancamavaranam | anantanandaparvataih paramakautukamabhati | tadupari jvalati niratishayanandadivyatejorashimandalam
    | cidanandamayanantaprakaravisheshaih pariveshtitam | tacca paramakalyanavilasavishesham | tadakhandadivyatejomandalakaram
    paramanandasaudaminicayojjvalam | taccamitaparamatejahparamaviharasamsthanavishesham paramatejomandalavishesham
    paramanandamritabrahmavidyamayanantasamudram cidanandatarangakaram | tanmadhye anantadivyatejahparvatasamashtyakaramaparicchinnanantashuddhabodhanandamandalam
    vacamagocaranandabrahmatejorashyakaramanantashikharojjvalamakhanda
  devanagari: निजमन्दकटाक्षचिदानन्दमयानेकप्रासादविशेषैः परिवेष्टितं ब्रह्मविद्यामयैरनन्तप्रकारानन्दामृरतदिव्यमङ्गलविमानैः
    सुशोभितं चिद्रूपविलासनिभचिन्मयासनं विराजते । अधितिष्ठन्ति तिजोराशिं तदन्तर्गतदिव्यतेजोविशेपमखिलपवित्राणां
    परमं पवित्रं चिद्रूपपरानन्तनित्यमुक्तैभिव्याप्तं सच्चिदानन्दरूपाः शिवात्मैक्योपासकाः ॥ इति चतुर्थावरणम्
    । पञ्चमावरणम् । अनन्तानन्दपर्वतैः परमकौतुकमाभाति । तदुपरि ज्वलति निरतिशयानन्ददिव्यतेजोराशिमण्डलम्
    । चिदानन्दमयानन्तप्राकारविशेषैः परिवेष्टितम् । तच्च परमकल्याणविलासविशेषम् । तदखण्डदिव्यतेजोमण्डलाकारं
    परमानन्दसौदामिनीचयोज्ज्वलम् । तच्चामितपरमतेजःपरमविहारसंस्थानविशेषं परमतेजोमण्डलविशेषं परमानन्दामृतब्रह्मविद्यामयानन्तसमुद्रं
    चिदानन्दतरङ्गाकारम् । तन्मध्ये अनन्तदिव्यतेजःपर्वतसमष्ट्याकारमपरिच्छिन्नानन्तशुद्धबोधानन्दमण्डलं वाचामगोचरानन्दब्रह्मतेजोराश्याकारमनन्तशिखरोज्ज्वलमखण्ड
meaning: {}
