id: devaihkritam01devistotram
category: stotram
name:
  english: devaihkritam01devistotram
  devanagari: देवैःकृतं०१देवीस्तोत्रम्
content:
  english: devaih kritam 1 devistotram deva ucuh | namo'stu te bhagavati papanashini namo'stu te suraripudarpashatani
    | namo'stu te harihararajyadayini namo'stu te makhabhujakaryakarini || 56|| namo'stu te tridasharipukshayankari
    namo'stu te shatamakhapadapujite | namo'stu te mahishavinashakarini namo'stu te hariharabhaskarastute
    || 57|| namo'stu te'shtadashabahushalini namo'stu te shumbhanishumbhaghatini | namo'stu lokarttihare
    trishulini namo'stu narayani cakradharini || 58|| namo'stu varahi sada dharadhare tvam narasimhi pranata
    namo'stu te | namo'stu te vajradhare gajadhvaje namo'stu kaumari mayuravahini || 59|| namo'stu paitamahahamsavahane
    namo'stu malavikate sukeshini | namo'stu te rasabhaprishthavahini namo'stu sarvarttihare jaganmaye
    || 61|| namo'stu vishveshvari pahi vishvam nishudayarin dvijadevatanam | namo'stu te sarvamayi trinetre
    namo namaste varade prasida || 61|| brahmani tvam mridani varashikhigamana shaktihasta kumari varahi
    tvam suvaktra khagapatigamana vaishnavi tvam sasharngi | durdrishya narasimhi ghuraghuritarava tvam
    tathaindri savajra tvam mari carmamundashavagamanarata yogini yogasiddha || 62|| namaste trinetre
    bhagavati tava carananushita ye aharaharvinatashiraso'vanatah | na hi na hi paribhavamastyashubham
    ca stutibalikusumakarah satatam ye || 63|| evam stuta suravaraih surashatrunashini praha prahasya
    surasiddhamaharshivaryan | prapto maya'dbhutatamo bhavatam prasadat sangramamurdhni surashatrujayah
    pramardat || 64|| imam stutim bhaktipara narottama bhavadbhiruktamanukirttayanti | duhsvapnanasho
    bhavita na samshayo varastathanyo vriyatamabhipsitah || 65|| iti vamanapurane shatpancashattamadhyayantargatam
    devaih kritam devistotram samaptam | vamanapurana | adhyaya 56
  devanagari: देवैः कृतं १ देवीस्तोत्रम् देवा ऊचुः । नमोऽस्तु ते भगवति पापनाशिनि नमोऽस्तु ते सुररिपुदर्पशातनि
    । नमोऽस्तु ते हरिहरराज्यदायिनि नमोऽस्तु ते मखभुजकार्यकारिणि ॥ ५६॥ नमोऽस्तु ते त्रिदशरिपुक्षयङ्करि
    नमोऽस्तु ते शतमखपादपूजिते । नमोऽस्तु ते महिषविनाशकारिणि नमोऽस्तु ते हरिहरभास्करस्तुते ॥ ५७॥ नमोऽस्तु
    तेऽष्टादशबाहुशालिनि नमोऽस्तु ते शुम्भनिशुम्भघातिनि । नमोऽस्तु लोकार्त्तिहरे त्रिशूलिनि नमोऽस्तु नारायणि
    चक्रधारिणि ॥ ५८॥ नमोऽस्तु वाराहि सदा धराधरे त्वां नारसिंहि प्रणता नमोऽस्तु ते । नमोऽस्तु ते वज्रधरे
    गजध्वजे नमोऽस्तु कौमारि मयूरवाहिनि ॥ ५९॥ नमोऽस्तु पैतामहहंसवाहने नमोऽस्तु मालाविकटे सुकेशिनि । नमोऽस्तु
    ते रासभपृष्ठवाहिनि नमोऽस्तु सर्वार्त्तिहरे जगन्मये ॥ ६१॥ नमोऽस्तु विश्वेश्वरि पाहि विश्वं निषूदयारीन्
    द्विजदेवतानाम् । नमोऽस्तु ते सर्वमयि त्रिनेत्रे नमो नमस्ते वरदे प्रसीद ॥ ६१॥ ब्रह्माणी त्वं मृडानी
    वरशिखिगमना शक्तिहस्ता कुमारी वाराही त्वं सुवक्त्रा खगपतिगमना वैष्णवी त्वं सशार्ङ्गी । दुर्दृश्या नारसिंही
    घुरघुरितरवा त्वं तथैन्द्री सवज्रा त्वं मारी चर्ममुण्डाशवगमनरता योगिनी योगसिद्धा ॥ ६२॥ नमस्ते त्रिनेत्रे
    भगवति तव चरणानुषिता ये अहरहर्विनतशिरसोऽवनताः । न हि न हि परिभवमस्त्यशुभं च स्तुतिबलिकुसुमकराः सततं
    ये ॥ ६३॥ एवं स्तुता सुरवरैः सुरशत्रुनाशिनी प्राह प्रहस्य सुरसिद्धमहर्षिवर्यान् । प्राप्तो मयाऽद्भुततमो
    भवतां प्रसादात् सङ्ग्राममूर्ध्नि सुरशत्रुजयः प्रमर्दात् ॥ ६४॥ इमां स्तुतिं भक्तिपरा नरोत्तमा भवद्भिरुक्तामनुकीर्त्तयन्ति
    । दुःस्वप्ननाशो भविता न संशयो वरस्तथान्यो व्रियतामभीप्सितः ॥ ६५॥ इति वामनपुराणे षट्पञ्चाशत्तमाध्यायान्तर्गतं
    देवैः कृतं देवीस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ५६
