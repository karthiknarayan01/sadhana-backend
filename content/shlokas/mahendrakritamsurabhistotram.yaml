id: mahendrakritamsurabhistotram
category: stotram
name:
  english: mahendrakritamsurabhistotram
  devanagari: महेन्द्रकृतंसुरभीस्तोत्रम्
content:
  english: mahendrakritam surabhistotram narayana uvaca | om surabhyai nama iti mantro'yam tu shadaksharah
    | siddho lakshajapenaiva bhaktanam kalpapadapah || 16|| sthitam dhyanam yajurvede pujanam sarvasammatam
    | riddhidam vriddhidam caiva muktido sarvakamadam || 17|| lakshmisvarupam paramam radhasahacarim param
    | gavamadhishthatridevim gavamadyam gavam prasum || 18|| pavitrarupam pujyam ca bhaktanam sarvakamadam
    | yaya putam sarvavishvam tam devim surabhim bhaje || 19|| ghate va dhenushirasi baddhastambhe gavam
    ca va | shalagrame jale'gnau va surabhi pujayeddvijah || 20|| dipanvita paradine purvahne bhaktisamyutah
    | yah pujayecca surabhim sa ca pujyo bhavedbhuvi || 21|| mahendra uvaca | namo devyai mahadevyai surabhyai
    ca namo namah | gavam bijasvarupayai namaste jagadambike || 24|| namo radhapriyayai ca padmamshayai
    namo namah | namah krishnapriyayai ca gavam matre namo namah | kalpavrikshasvarupayai pradatryai sarvasampadam
    || 25|| shridayai dhanadayai ca buddhidayai namo namah | shubhadayai prasannayai gopradayai namo namah
    || 26|| yashodayai saukhyadayai dharmajnayai namo namah | stotrashravanamatrena tushta hrishta jagatprasuh
    || 27|| iti shribrahmavaivartte mahapurane dvitiye prakritikhande saptacatvarimshadhyayantargatam
    mahendrakritam surabhistotram samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 47
  devanagari: महेन्द्रकृतं सुरभीस्तोत्रम् नारायण उवाच । ॐ सुरभ्यै नम इति मन्त्रोऽयं तु षडक्षरः । सिद्धो
    लक्षजपेनैव भक्तानां कल्पपादपः ॥ १६॥ स्थितं ध्यानं यजुर्वेदे पूजनं सर्वसम्मतम् । ऋद्धिदां वृद्धिदां
    चैव मुक्तिदो सर्वकामदाम् ॥ १७॥ लक्ष्मीस्वरूपां परमां राधासहचरीं पराम् । गवामधिष्ठातृदेवीं गवामाद्यां
    गवां प्रसूम् ॥ १८॥ पवित्ररूपां पूज्यां च भक्तानां सर्वकामदाम् । यया पूतं सर्वविश्वं तां देवीं सुरभीं
    भजे ॥ १९॥ घटे वा धेनुशिरसि बद्धस्तम्भे गवां च वा । शालग्रामे जलेऽग्नौ वा सुरभी पूजयेद्द्विजः ॥ २०॥
    दीपान्विता परदिने पूर्वाह्णे भक्तिसंयुतः । यः पूजयेच्च सुरभीं स च पूज्यो भवेद्भुवि ॥ २१॥ महेन्द्र
    उवाच । नमो देव्यै महादेव्यै सुरभ्यै च नमो नमः । गवां बीजस्वरूपायै नमस्ते जगदम्बिके ॥ २४॥ नमो राधाप्रियायै
    च पद्मांशायै नमो नमः । नमः कृष्णप्रियायै च गवां मात्रे नमो नमः । कल्पवृक्षस्वरूपायै प्रदात्र्यै सर्वसम्पदाम्
    ॥ २५॥ श्रीदायै धनदायै च बुद्धिदायै नमो नमः । शुभदायै प्रसन्नायै गोप्रदायै नमो नमः ॥ २६॥ यशोदायै सौख्यदायै
    धर्मज्ञायै नमो नमः । स्तोत्रश्रवणमात्रेण तुष्टा हृष्टा जगत्प्रसूः ॥ २७॥ इति श्रीब्रह्मवैवर्त्ते महापुराणे
    द्वितीये प्रकृतिखण्डे सप्तचत्वारिंशाध्यायान्तर्गतं महेन्द्रकृतं सुरभीस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण
    । प्रकृतिखण्ड । अध्याय ४७
