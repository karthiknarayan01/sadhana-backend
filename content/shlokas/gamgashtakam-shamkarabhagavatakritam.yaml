id: gamgashtakam-shamkarabhagavatakritam
category: stotram
name:
  english: gamgashtakam (shamkarabhagavatakritam)
  devanagari: गंगाष्टकम् (शंकरभगवतकृतम्)
content:
  english: iti shrimatparamahamsaparivrajakacarya shrigovindabhagavatpujyapadasyashishya shrimacchankarabhagavatah
    kritau gangashtakastotram sampurnam |
  devanagari: इति श्रीमत्परमहंसपरिव्राजकाचार्य श्रीगोविन्दभगवत्पूज्यपादस्यशिष्या श्रीमच्छङ्करभगवतः कृतौ
    गङ्गाष्टकस्तोत्रं सम्पूर्णम् ।
meaning: {}
source_attribution:
  text_source: Sanskrit Wikisource — https://sa.wikisource.org/wiki/गंगाष्टकम्_(शंकरभगवतकृतम्)
  license: public_domain
