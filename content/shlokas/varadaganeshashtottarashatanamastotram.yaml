id: varadaganeshashtottarashatanamastotram
category: stotram
name:
  english: varadaganeshashtottarashatanamastotram
  devanagari: वरदगणेशाष्टोत्तरशतनामस्तोत्रम्
content:
  english: shrivaradaganeshashtottarashatanamastotram ganesho vighnarajashca vighnaharta ganadhipah |
    lambodaro vakratundo vikato gananayakah || 1|| gajasyah siddhidata ca kharvo mushakavahanah | mushako
    ganarajashca shailajanandadayakah || 2|| guhagrajo mahatejah kubjo bhaktapriyah prabhuh | sindurabho
    ganadhyakshastrinetro dhanadayakah || 3|| vamanah shurpakarnashca dhumrah shankaranandanah | sarvartinashako
    vijnah kapilo modakapriyah || 4|| sankashtanashano devah surasuranamaskritah | umasutah kripalushca
    sarvajnah priyadarshanah || 5|| herambo raktanetrashca sthulamurtih pratapavan | sukhadah karyakartta
    ca buddhido vyadhinashakah || 6|| ikshudandapriyah shurah kshamayukto'ghanashakah | ekadanto mahodarah
    sarvado gajakarshakah || 7|| vinayako jagatpujyah phalado dinavatsalah | vidyaprado mahotsaho duhkhadaurbhagyanashakah
    || 8|| mishtapriyo bhalacandro nityasaubhagyavardhanah | danapurardragandashca amshako vibudhapriyah
    || 9|| raktambaradharah shreshthah subhago nagabhushanah | shatrudhvamsi caturbahuh saumyo daridryanashakah
    || 10|| adipujyo dayashilo raktamundo mahodayah | sarvagah saukhyakricchuddhah krityapujyo budhapriyah
    || 11|| sarvadevamayah shanto bhuktimuktipradayakah | vidyavandanashilashca vedavinmantravitsudhih
    || 12|| avijnatagatirjnani jnanigamyo munistutah | yogajno yogapujyashca bhalanetrah shivatmajah ||
    13|| sarvamantramayah shriman avasho vashakarakah | vighnadhvamsi sada hrishto bhaktanam phaladayakah
    || 14|| idam stotram ganeshasya pathecca sadaram narah | tasya vanchitakamasya siddhirbhavati nishcitam
    || 15|| iti shrivaradaganeshashtottarashatanamastotram sampurnam |
  devanagari: श्रीवरदगणेशाष्टोत्तरशतनामस्तोत्रम् गणेशो विघ्नराजश्च विघ्नहर्ता गणाधिपः । लम्बोदरो वक्रतुण्डो
    विकटो गणनायकः ॥ १॥ गजास्यः सिद्धिदाता च खर्वो मूषकवाहनः । मूषको गणराजश्च शैलजानन्ददायकः ॥ २॥ गुहाग्रजो
    महातेजाः कुब्जो भक्तप्रियः प्रभुः । सिन्दूराभो गणाध्यक्षस्त्रिनेत्रो धनदायकः ॥ ३॥ वामनः शूर्पकर्णश्च
    धूम्रः शङ्करनन्दनः । सर्वार्तिनाशको विज्ञः कपिलो मोदकप्रियः ॥ ४॥ सङ्कष्टनाशनो देवः सुरासुरनमस्कृतः
    । उमासुतः कृपालुश्च सर्वज्ञः प्रियदर्शनः ॥ ५॥ हेरम्बो रक्तनेत्रश्च स्थूलमूर्तिः प्रतापवान् । सुखदः
    कार्यकर्त्ता च बुद्धिदो व्याधिनाशकः ॥ ६॥ इक्षुदण्डप्रियः शूरः क्षमायुक्तोऽघनाशकः । एकदन्तो महोदारः
    सर्वदो गजकर्षकः ॥ ७॥ विनायको जगत्पूज्यः फलदो दीनवत्सलः । विद्याप्रदो महोत्साहो दुःखदौर्भाग्यनाशकः
    ॥ ८॥ मिष्टप्रियो भालचन्द्रो नित्यसौभाग्यवर्धनः । दानपूरार्द्रगण्डश्च अंशको विबुधप्रियः ॥ ९॥ रक्ताम्बरधरः
    श्रेष्ठः सुभगो नागभूषणः । शत्रुध्वंसी चतुर्बाहुः सौम्यो दारिद्र्यनाशकः ॥ १०॥ आदिपूज्यो दयाशीलो रक्तमुण्डो
    महोदयः । सर्वगः सौख्यकृच्छुद्धः कृत्यपूज्यो बुधप्रियः ॥ ११॥ सर्वदेवमयः शान्तो भुक्तिमुक्तिप्रदायकः
    । विद्यावान्दानशीलश्च वेदविन्मन्त्रवित्सुधीः ॥ १२॥ अविज्ञातगतिर्ज्ञानी ज्ञानिगम्यो मुनिस्तुतः । योगज्ञो
    योगपूज्यश्च भालनेत्रः शिवात्मजः ॥ १३॥ सर्वमन्त्रमयः श्रीमान् अवशो वशकारकः । विघ्नध्वंसी सदा हृष्टो
    भक्तानां फलदायकः ॥ १४॥ इदं स्तोत्रं गणेशस्य पठेच्च सादरं नरः । तस्य वाञ्छितकामस्य सिद्धिर्भवति निश्चितम्
    ॥ १५॥ इति श्रीवरदगणेशाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ।
