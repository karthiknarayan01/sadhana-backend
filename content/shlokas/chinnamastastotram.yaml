id: chinnamastastotram
category: stotram
name:
  english: chinnamastastotram
  devanagari: छिन्नमस्तास्तोत्रम्
content:
  english: pithanugam sarasijasanasannivishtam | suptam prabodhya bhavatim manuja guruktahu~karavayuvashibhirmanasa
    bhajanti || 10||| shubhrasi shantikakathasu tathaiva pita stambhe riporatha ca shubhratarasi matah
    | uccatane'pyasitakarmasukarmani tvam samsevyase sphatikakantiranantacare || 11|| tvamutpalairmadhuyutairmadhunopanitairgavyaih
    payovilulitaih shatameva kunde | sajyaishca toshayati yah purushastrisandhyam shanmasato bhavati shakrasamo
    hi bhumau || 12|| jagratsvapannapi shive tava mantrarajamevam vicintayati yo manasa vidhijnah | samsarasagarasamriddharane
    vahitram citram na bhutajanane'pi jagatsu pumsah || 13|| iyam vidya vandya hariharavirinciprabhritibhih
    puraraterantah puramidamagamyam pashujanaih | sudhamandanandaih pashupatisamanavyasanibhih sudhasevyaih
    sadbhirgurucaranasamsaracaturaih || 14|| kunde va mandale va shuciratha manuna bhavayatyeva mantri
    samsthapyoccairjuhoti prasavasuphaladaih padmapalashakanam | haimam kshiraistilairvam samadhukakusumairmalatibandhujatishvetairabdham
    sakanamapi varasamidha sampade sarvasiddhyai || 15|| andhah sajyam samamsam dadhiyutamathava yo'nvaham
    yamininam madhye devyai dadati prabhavati grihaga shriramushyavakhanda | ajyam mamsam saraktam tilayutamathava
    tandulam payasam va hutva mamsam trisandhyam sa bhavati manujo bhutibhirbhutanathah || 16|| idam devyah
    stotram pathati manujo yastrisamayam shucirbhutva vishve bhavati dhanado vasavasamah | vasha bhupah
    kanta nikhilaripuhantuh suragana bhavantyuccairvaco yadiha nanu masaistribhirapi || 17|| iti shrishankaracaryaviracitah
    pracandacandikastavarajah samaptah ||
  devanagari: पीठानुगां सरसिजासनसन्निविष्टाम् । सुप्तां प्रबोध्य भवतीं मनुजा गुरूक्तहूँकारवायुवशिभिर्मनसा
    भजन्ति ॥ १०॥। शुभ्रासि शान्तिककथासु तथैव पीता स्तम्भे रिपोरथ च शुभ्रतरासि मातः । उच्चाटनेऽप्यसितकर्मसुकर्मणि
    त्वं संसेव्यसे स्फटिककान्तिरनन्तचारे ॥ ११॥ त्वामुत्पलैर्मधुयुतैर्मधुनोपनीतैर्गव्यैः पयोविलुलितैः शतमेव
    कुण्डे । साज्यैश्च तोषयति यः पुरुषस्त्रिसन्ध्यं षण्मासतो भवति शक्रसमो हि भूमौ ॥ १२॥ जाग्रत्स्वपन्नपि
    शिवे तव मन्त्रराजमेवं विचिन्तयति यो मनसा विधिज्ञः । संसारसागरसमृद्धरणे वहित्रं चित्रं न भूतजननेऽपि
    जगत्सु पुंसः ॥ १३॥ इयं विद्या वन्द्या हरिहरविरिञ्चिप्रभृतिभिः पुरारातेरन्तः पुरमिदमगम्यं पशुजनैः ।
    सुधामन्दानन्दैः पशुपतिसमानव्यसनिभिः सुधासेव्यैः सद्भिर्गुरुचरणसंसारचतुरैः ॥ १४॥ कुण्डे वा मण्डले वा
    शुचिरथ मनुना भावयत्येव मन्त्री संस्थाप्योच्चैर्जुहोति प्रसवसुफलदैः पद्मपालाशकानाम् । हैमं क्षीरैस्तिलैर्वां
    समधुककुसुमैर्मालतीबन्धुजातीश्वेतैरब्धं सकानामपि वरसमिधा सम्पदे सर्वसिद्ध्यै ॥ १५॥ अन्धः साज्यं समांसं
    दधियुतमथवा योऽन्वहं यामिनीनां मध्ये देव्यै ददाति प्रभवति गृहगा श्रीरमुष्यावखण्डा । आज्यं मांसं सरक्तं
    तिलयुतमथवा तण्डुलं पायसं वा हुत्वा मांसं त्रिसन्ध्यं स भवति मनुजो भूतिभिर्भूतनाथः ॥ १६॥ इदं देव्याः
    स्तोत्रं पठति मनुजो यस्त्रिसमयं शुचिर्भूत्वा विश्वे भवति धनदो वासवसमः । वशा भूपाः कान्ता निखिलरिपुहन्तुः
    सुरगणा भवन्त्युच्चैर्वाचो यदिह ननु मासैस्त्रिभिरपि ॥ १७॥ इति श्रीशङ्कराचार्यविरचितः प्रचण्डचण्डिकास्तवराजः
    समाप्तः ॥
