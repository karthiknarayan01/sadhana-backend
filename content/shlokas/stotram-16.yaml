id: stotram-16
category: sahasranama
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: bijatoshitah sada | varunijayasantushto varunipanasundarah || 72|| varunicumbananando varunimandale
    sthitah | varunigatagamyashca varunipremacandrikah || 73|| varunimukhamadhyastho varuniganamanditah
    | varunimandalananto varunikundarupinah || 74|| varunimanasaradhyo varunitattvatah priyah | varunimodarasiko
    varunimodavasinah || 75|| varunibhogarasiko varunikucamandanah | varuniyogamargastho varuniyogarupinah
    || 76|| varunipujakah prano varuninindakantakah | varunipranasanmanyo varunidrishtigocarah || 77||
    varunikeshasammarjo varuninabhimadhyagah | varunimodasamprito varunimodarupakah || 78|| varunidasyasamprito
    varunidhyanatatparah | varunivakyarasiko varunikundapujakah || 79|| varunipananando bhu varuniratitatparah
    | varunitandavanandanayako varunarnavah || 80|| varunikundamadhyastho varunikundasundarah | varunishastrasamprito
    varunimadhyasundarah || 81|| varunibhogarasiko varunimritadirghikah | varunisaukhyadah prito varunicandrasundarah
    || 82|| bilvo bilvakaro bilvo bilvapatraprapujakah | bilvavrikshasamagamyo bilvapatrasthabilvabhuh
    || 83|| bilvapushpapriyah prano bilvapushpapramodakah | bilvapushpaprapujyotha bilvapushpasvarupakah
    || 84|| bilvapatramahodashca bilvaphalaprabhojanah | bilvapriyobilvamayo bilvavrikshanivasinah ||
    85|| bilvavriddhikaro bilvapriyo bilvanishevinah | bilvapatrasthasarvango bilvavrikshaprapalakah ||
    86|| vibhavasusamam tejo vibhavasusamagamah | vibhavasurmandagatirvibhavasurivamatih || 87|| vibhavasuprapujyashca
    vibhavasuprapujakah | bimbadharo bimbarupo vishvavidyavinodanah || 88|| vigamya vedakartta ca vidhikartta
    vidhiprabhah | vidhividhyata vinado vidhigamyo vidhivarah || 89|| vidhisapatramurtishca vidhishapavimocakah
    | vidhishastro vidhiprajno vidusho gurudevata || 90|| vikradhikramasancaro vidhishastravicaranah |
    vividhikramasancaro vividrika vividhikramah || 91|| vidhuputrapriyasakho vidhiputrabhayavahah | vidhiputraparitrata
    vidhiputravarapradah || 92|| vidhuvijnanavibhavo vidhushirsheshu shobhanah | vishvamitrasusampanno
    vishvamitravarapradah || 93|| vishvamitramurtidhari vishvamitrasvarupakah | vishvamitragurushreshtho
    vishvamitraprabhanjakah || 94|| vishvamitrayogapriyo vishvamitranutipriyah | vishvamitraparijnato
    vishvamitrayogakshamah || 95|| vishvamitratirshamano vishvamitrartinashanah | vishado vishadacaro
    vishapane sada ratah || 96|| vimalo vimalangashca vimalacaratatparah | vishveshvaro vishvaraja vighnasanghavinashanah
    || 97|| vinayako vighnarajo vighnavicchedanashanah | bimbadharo bimbarucirvishvavidyavinodanah ||
    98|| vinadharo vinanatha vinavadyaparayanah | viramukhyo virapriyo virasthayoganah sada || 99|| viramantro
    virashreshtho virastrigamanoparah | buddhibuddhyakritidharo buddhishayi budhapriyah || 100|| buddhipurno
    buddhidharo buddhibha buddhiduragah | buddhirbuddhavapurvriddhih shariro buddhimanditah || 101|| buddhiprabhushca
    buddhirbuddhikritacaracarah | buddhipranavasantushto buddhihinaparanmukhah || 102|| buddhibhridbuddhihritkarta
    buddhishreshtho buddhiprabhuh | budhesho budhasantushto budhaikasadanam sada || 103|| buddhimamshcaiva
    buddhishca buddhivanbuddhibhajanah | buddhipranitapadagro buddhigitabudhaujasah || 104|| buddhivanbuddhisampanno
    buddhayananditamanasah | buddhimargapraneta ca buddhisancaracaturah || 105|| buddhigauno buddhyadharo
    buddhisambuddhicetanah | buddhirudbuddhihrinnityam buddhyagro buddhiparadah || 106|| buddhivriddhipracarodbhudbuddhya
    buddhi viveka vit | buddhyakaro buddhikaro buddhipranavivardhanah || 107|| buddhigudhadharo buddhirbuddhisancaraceshtitah
    | buddhidakshinatahardo buddhilakshanatattvavit || 108|| buddhyacari buddhihari buddhisukhapradayakah
    | buddhisamskritasancari buddhitattvavivekavit || 109|| buddhigarvadharo buddhirbuddhigarvaparabhavah
    | buddhyadhino buddhitamo buddhilakshanalalasah || 110|| buddhigauravadata ca buddhi data buddhipradah
    | budhyoktabuddhiharta ca buddhibhurbuddhivardhanah || 111|| buddhirudyogakarta ca buddhidata buddhyuktakarah
    | buddhyacaro bauddharupo bauddhavataradhrik sada || 112|| bum bum bah bijasvarupo bum kshum hum mukuteshvarah
    | bum klim hum candakartacalah bum klim hum phat svaha || 113|| vedajno vedakarta ca vedapathavisharadah
    | vedapriyo vedamayo vedavidyavidharakah || 114|| vedapathakaro vedavyakhyanakaranakshamah | vedango
    vedarupashca vedamantrasvarupavan || 115|| vedavandyo vedaprano vedapatho vidashrayah | vedantagitacarito
    vedagitapravahakah || 116|| vedadharmasampannotha vedadharmanikrintanah | vaidyo vaidyapatirvaidyo
    vaidyanayakasundarah || 117|| vaidyarajotha vaidyesho vaidyarajanamaskritah | vaidyapriyo vaidyapritirvaidyatranagamodhyatah
    || 118|| vaidyanitirguno vaidyo vaidyanam pratipalakah | vaidyaharta vaidyakaro vaidyo vaidyapatipriyah
    || 119|| vaidyarajashirasijo vaidyarajashishapra | vaidyarajarcitapado vaidyarajanamaskritah || 120||
    vaidyarajo vaidyavesho vaidyarajabhayavahah | bom bom bah bijarupashca baum baum baum bijarupakah
    || 121|| vaidehivainako vedyo vaidyacarapradharakah | vaishyacaro vaishyashreshtho vaishyanam kuladevata
    || 122|| virabhadrotha viresho virendro vanditapadah | viravandyo viraprano virabahurvirashrayah ||
    123|| viradaityapranahari viradaityapaharakah | virarnavaharo viro viranam pranavallabhah || 124||
    viradharmasadaradhyo viradharmaniketanah | viradaityapranatrata viradaityabalapradah || 125|| viragarjitasampurno
    virabrahmandagarjitah | viraputraparitrata viraputravarapradah || 126|| viraputrapriyasakho viraputrabhayapahah
    | viraputrabhishamano viraputrahinashakah || 127|| viraputrapranatrata virabhaktiparayanah | viravijnanavibhavo
    virabahuvarapradah || 128|| virabahustuto virabahushah shapaharakah | virabahupriyo virabahugauravavardhanah
    || 129|| virabahuparitrata virabahusukhapradah | vishvabhugvishvashreshthotha vishvakshetrakarastatha
    || 130|| balarkavarno balotha balarkatejasah parah | balo balapriyo balo balakridaparayanah || 131||
    vamano vagbhavakaro vacalo vakpatipriyah | vacamagocaro vanto vinavenudharoparah || 132|| vagbhavo
    vakpatih shreshtho vagdevipriyanandanah | vagdevihridayanando vagdevigarbhasambhavah || 133|| vaksiddho
    vakpatiprano vagghrado vaksvarupakah | banapracaro banesho banasaravivekavit || 134|| banabhurbanasampanno
    banananditamanasah | banasandhanacaturo banasamshayasundarah || 135|| banayeshta banadharo banasancisacetasah
    | banarudyanabhrinnityam banajno banapadakah || 136|| banakaro banakaro banapriyavivardhanah | banagudhadharo
    banabadhasandhanaceshtitah || 137|| banado banasauhardo banalanchanatattvavit | vanisamskritasancaro
    vanitattvavivecakah || 138|| varado varadah svastho varadobhayadayakah | varadadranayah pahurvasishthashramasevinah
    || 139|| vasishtho vasishtharaddhyo vasishthanandadayakah | vasishthabhishtavarado vasishthabhayadayakah
    || 140|| vasishthapranavashako vasishthaganadharakah | vamano vallabho vandyo vanamalavibhushanah
    || 141|| vanastho vanajo vaidyo vanarajo vanashrayah | vanecaro vanadhisho vanarivanasevitah || 142||
    vanaro vanaradhisho vanarashatrunashanah | vanaprasthashramakrito vanaprasthayogapradah || 143|| brahmayonirbrihadyoni
    vishvayonirvivekavan | brahmavidbrahmabhavashca brahmarshirbrahmanapriyah || 144|| brahmado brahmanatma
    ca brahmavidyaprakashakah | brahmacari brahmavetta brahmano brahmanottamah || 145|| brahmaputravidheyatma
    brahmasutrarthanirnayah | brahmagauravadata ca brahmando brahmandeshvarah || 146|| vyomagamyo vyomeshanam
    vyomeshabhavasundarah | vyomagamyo vyomadharo brahmagitapracarakah || 147|| vyomabrahmopagatishca
    vyomajno vyomaparadah | vyomacaro vyomarupo vyomakeshotishobhanah || 148|| vyaladhipo vyaleshano vyalastho
    vyalagah sada | vyalamukho vyalakarno vyalayatanashobhanah || 149|| vyalashayi vyalashreshtho vyaghrajinapradharakah
    | vrishakapi
  devanagari: बीजतोषितः सदा । वारुणीजयसन्तुष्टो वारुणीपानसुन्दरः ॥ ७२॥ वारुणीचुम्बनानन्दो वारुणीमण्डले
    स्थितः । वारुणीगतगम्यश्च वारुणीप्रेमचन्द्रिकः ॥ ७३॥ वारुणीमुखमध्यस्थो वारुणीगणमण्डितः । वारुणीमण्डलानन्तो
    वारुणीकुण्डरूपिणः ॥ ७४॥ वारुणीमनसाराध्यो वारुणीतत्त्वतः प्रियः । वारुणीमोदरसिको वारुणीमोदवासिनः ॥
    ७५॥ वारुणीभोगरसिको वारुणीकुचमण्डनः । वारुणीयोगमार्गस्थो वारुणीयोगरूपिणः ॥ ७६॥ वारुणीपूजकः प्राणो वारुणीनिन्दकान्तकः
    । वारुणीप्राणसन्मान्यो वारुणीदृष्टिगोचरः ॥ ७७॥ वारुणीकेशसम्मार्जो वारुणीनाभिमध्यगः । वारुणीमोदसम्प्रीतो
    वारुणीमोदरूपकः ॥ ७८॥ वारुणीदास्यसम्प्रीतो वारुणीध्यानतत्परः । वारुणीवाक्यरसिको वारुणीकुण्डपूजकः ॥
    ७९॥ वारुणीपाननन्दो भू वारुणीरतितत्परः । वारुणीताण्डवानन्दनायको वारुणार्णवः ॥ ८०॥ वारुणीकुण्डमध्यस्थो
    वारुणीकुण्डसुन्दरः । वारुणीशास्त्रसम्प्रीतो वारुणीमध्यसुन्दरः ॥ ८१॥ वारुणीभोगरसिको वारुणीमृतदीर्घिकः
    । वारुणीसौख्यदः प्रीतो वारुणीचन्द्रसुन्दरः ॥ ८२॥ बिल्वो बिल्वकरो बिल्वो बिल्वपत्रप्रपूजकः । बिल्ववृक्षसमागम्यो
    बिल्वपत्रस्थबिल्वभूः ॥ ८३॥ बिल्वपुष्पप्रियः प्राणो बिल्वपुष्पप्रमोदकः । बिल्वपुष्पप्रपूज्योथ बिल्वपुष्पस्वरूपकः
    ॥ ८४॥ बिल्वपत्रमहोदश्च बिल्वफलप्रभोजनः । बिल्वप्रियोबिल्वमयो बिल्ववृक्षनिवासिनः ॥ ८५॥ बिल्ववृद्धिकरो
    बिल्वप्रियो बिल्वनिषेविनः । बिल्वपत्रस्थसर्वाङ्गो बिल्ववृक्षप्रपालकः ॥ ८६॥ विभावसुसमं तेजो विभावसुसमागमः
    । विभावसुर्मन्दगतिर्विभावसुरिवामतिः ॥ ८७॥ विभावसुप्रपूज्यश्च विभावसुप्रपूजकः । बिम्बाधरो बिम्बरूपो
    विश्वविद्याविनोदनः ॥ ८८॥ विगम्य वेदकर्त्ता च विधिकर्त्ता विधिप्रभः । विधिविध्याता विनदो विधिगम्यो
    विधिवरः ॥ ८९॥ विधिसपत्रमूर्तिश्च विधिशापविमोचकः । विधिशास्त्रो विधिप्राज्ञो विदुषो गुरुदेवता ॥ ९०॥
    विक्रधिक्रमसञ्चारो विधिशास्त्रविचारणः । विविधिक्रमसञ्चारो विविदृक विविधिक्रमः ॥ ९१॥ विधुपुत्रप्रियसखो
    विधिपुत्रभयावहः । विधिपुत्रपरित्राता विधिपुत्रवरप्रदः ॥ ९२॥ विधुविज्ञानविभवो विधुशीर्षेषु शोभनः ।
    विश्वामित्रसुसम्पन्नो विश्वामित्रवरप्रदः ॥ ९३॥ विश्वामित्रमूर्तिधारी विश्वामित्रस्वरूपकः । विश्वामित्रगुरुश्रेष्ठो
    विश्वामित्रप्रभञ्जकः ॥ ९४॥ विश्वामित्रयोगप्रियो विश्वामित्रनुतिप्रियः । विश्वामित्रपरिज्ञातो विश्वामित्रयोगक्षमः
    ॥ ९५॥ विश्वमित्रातिर्शमनो विश्वामित्रार्तिनाशनः । विषदो विषदाचारो विषपाने सदा रतः ॥ ९६॥ विमलो विमलाङ्गश्च
    विमलाचारतत्परः । विश्वेश्वरो विश्वराजा विघ्नसङ्घविनाशनः ॥ ९७॥ विनायको विघ्नराजो विघ्नविच्छेदनाशनः
    । बिम्बाधरो बिम्बरुचिर्विश्वविद्याविनोदनः ॥ ९८॥ वीणाधरो वीणानाथ वीणावाद्यपरायणः । वीरमुख्यो वीरप्रियो
    वीरस्थायोगणः सदा ॥ ९९॥ वीरमन्त्रो वीरश्रेष्ठो वीरस्त्रीगमनोपरः । बुद्धिबुद्ध्याकृतिधरो बुद्धिशायी
    बुधप्रियः ॥ १००॥ बुद्धिपूर्णो बुद्धिधरो बुद्धिभा बुद्धिदूरगः । बुद्धिर्बुद्धवपुर्वृद्धिः शरीरो बुद्धिमण्डितः
    ॥ १०१॥ बुद्धिप्रभुश्च बुद्धिर्बुद्धिकृतचराचरः । बुद्धिप्रणवसन्तुष्टो बुद्धिहीनपराङ्मुखः ॥ १०२॥ बुद्धिभृद्बुद्धिहृत्कर्ता
    बुद्धिश्रेष्ठो बुद्धिप्रभुः । बुधेशो बुधसन्तुष्टो बुधैकसदनं सदा ॥ १०३॥ बुद्धिमांश्चैव बुद्धिश्च बुद्धिवान्बुद्धिभाजनः
    । बुद्धिप्रणीतपादाग्रो बुद्धिगीतबुधौजसः ॥ १०४॥ बुद्धिवान्बुद्धिसम्पन्नो बुद्धयानन्दितमानसः । बुद्धिमार्गप्रणेता
    च बुद्धिसञ्चारचातुरः ॥ १०५॥ बुद्धिगौणो बुद्ध्याधारो बुद्धिसम्बुद्धिचेतनः । बुद्धिरुद्बुद्धिहृन्नित्यं
    बुद्ध्याग्रो बुद्धिपारदः ॥ १०६॥ बुद्धिवृद्धिप्रचारोद्भूद्बुद्ध्या बुद्धि विवेक वित् । बुद्ध्याकरो
    बुद्धिकरो बुद्धिप्राणविवर्धनः ॥ १०७॥ बुद्धिगूढधरो बुद्धिर्बुद्धिसञ्चारचेष्टितः । बुद्धिदक्षिणताहार्दो
    बुद्धिलक्षणतत्त्ववित् ॥ १०८॥ बुद्ध्याचारी बुद्धिहारी बुद्धिसुखप्रदायकः । बुद्धिसंस्कृतसञ्चारी बुद्धितत्त्वविवेकवित्
    ॥ १०९॥ बुद्धिगर्वधरो बुद्धिर्बुद्धिगर्वपराभवः । बुद्ध्यधीनो बुद्धितमो बुद्धिलक्षणलालसः ॥ ११०॥ बुद्धिगौरवदाता
    च बुद्धि दाता बुद्धिप्रदः । बुध्योक्तबुद्धिहर्ता च बुद्धिभूर्बुद्धिवर्धनः ॥ १११॥ बुद्धिरुद्योगकर्ता
    च बुद्धिदाता बुद्ध्युक्तकरः । बुद्ध्याचारो बौद्धरूपो बौद्धावतारधृक् सदा ॥ ११२॥ बूं बूं बः बीजस्वरूपो
    बूं क्षूं हूं मुकुटेश्वरः । बूं क्लीं हूं चण्डकर्ताचलः बूं क्लीं हुं फट् स्वाहा ॥ ११३॥ वेदज्ञो वेदकर्ता
    च वेदपाठविशारदः । वेदप्रियो वेदमयो वेदविद्याविधारकः ॥ ११४॥ वेदपाठकरो वेदव्याख्यानकरणक्षमः । वेदाङ्गो
    वेदरूपश्च वेदमन्त्रस्वरूपवान् ॥ ११५॥ वेदवन्द्यो वेदप्राणो वेदपाठो विदाश्रयः । वेदान्तगीतचरितो वेदगीतप्रवाहकः
    ॥ ११६॥ वेदधर्मसम्पन्नोथ वेदधर्मनिकृन्तनः । वैद्यो वैद्यपतिर्वैद्यो वैद्यनायकसुन्दरः ॥ ११७॥ वैद्यराजोथ
    वैद्येशो वैद्यराजनमस्कृतः । वैद्यप्रियो वैद्यप्रीतिर्वैद्यत्राणगमोध्यतः ॥ ११८॥ वैद्यनीतिर्गुणो वैद्यो
    वैद्यानां प्रतिपालकः । वैद्यहर्ता वैद्यकरो वैद्यो वैद्यपतिप्रियः ॥ ११९॥ वैद्यराजशिरसिजो वैद्यराजशिषप्र
    । वैद्यराजार्चितपदो वैद्यराजनमस्कृतः ॥ १२०॥ वैद्यराजो वैद्यवेशो वैद्यराजभयावहः । बों बों बः बीजरूपश्च
    बौं बौं बौं बीजरूपकः ॥ १२१॥ वैदेहीवैनको वेद्यो वैद्याचारप्रधारकः । वैश्याचारो वैश्यश्रेष्ठो वैश्यानां
    कुलदेवता ॥ १२२॥ वीरभद्रोथ वीरेशो वीरेन्द्रो वन्दितपदः । वीरवन्द्यो वीरप्राणो वीरबाहुर्वीराश्रयः ॥
    १२३॥ वीरदैत्यप्राणहारी वीरदैत्यापहारकः । वीरार्णवहरो वीरो वीराणां प्राणवल्लभः ॥ १२४॥ वीरधर्मसदाराध्यो
    वीरधर्मनिकेतनः । वीरदैत्यप्राणत्राता वीरदैत्यबलप्रदः ॥ १२५॥ वीरगर्जितसम्पूर्णो वीरब्रह्माण्डगर्जितः
    । वीरपुत्रपरित्राता वीरपुत्रवरप्रदः ॥ १२६॥ वीरपुत्रप्रियसखो वीरपुत्रभयापहः । वीरपुत्राभिशमनो वीरपुत्राहिनाशकः
    ॥ १२७॥ वीरपुत्रप्राणत्राता वीरभक्तिपरायणः । वीरविज्ञानविभवो वीरबाहुवरप्रदः ॥ १२८॥ वीरबाहुस्तुतो वीरबहुशः
    शापहारकः । वीरबाहुप्रियो वीरबहुगौरववर्धनः ॥ १२९॥ वीरबाहुपरित्राता वीरबाहुसुखप्रदः । विश्वभुग्विश्वश्रेष्ठोथ
    विश्वक्षेत्रकरस्तथा ॥ १३०॥ बालार्कवर्णो बालोथ बालार्कतेजसः परः । बालो बालप्रियो बालो बालक्रीडापरायणः
    ॥ १३१॥ वामनो वाग्भवाकारो वाचालो वाक्पतिप्रियः । वाचामगोचरो वान्तो वीणावेणुधरोपरः ॥ १३२॥ वाग्भवो वाक्पतिः
    श्रेष्ठो वाग्देवीप्रियनन्दनः । वाग्देवीहृदयानन्दो वाग्देवीगर्भसम्भवः ॥ १३३॥ वाक्सिद्धो वाक्पतिप्राणो
    वाग्घ्रदो वाक्स्वरूपकः । बाणप्रचारो बाणेशो बाणसारविवेकवित् ॥ १३४॥ बाणभूर्बाणसम्पन्नो बाणनन्दितमानसः
    । बाणसन्धानचतुरो बाणसंशयसुन्दरः ॥ १३५॥ बाणयेष्टा बाणधरो बाणसञ्चिसचेतसः । बाणरुद्यानभृन्नित्यं बाणज्ञो
    बाणपादकः ॥ १३६॥ बाणाकारो बाणकरो बाणप्रियविवर्धनः । बाणगूढधरो बाणबाधसन्धानचेष्टितः ॥ १३७॥ बाणदो बाणसौहार्दो
    बाणलाञ्छनतत्त्ववित् । वाणीसंस्कृतसञ्चारो वाणीतत्त्वविवेचकः ॥ १३८॥ वरदो वरदः स्वस्थो वरदोभयदायकः ।
    वरदद्रणयः पाहुर्वसिष्ठाश्रमसेविनः ॥ १३९॥ वसिष्ठो वसिष्ठाराद्ध्यो वसिष्ठानन्ददायकः । वसिष्ठाभीष्टवरदो
    वसिष्ठाभयदायकः ॥ १४०॥ वसिष्ठप्राणवशको वसिष्ठगणधारकः । वामनो वल्लभो वन्द्यो वनमालाविभूषणः ॥ १४१॥ वनस्थो
    वनजो वैद्यो वनराजो वनाश्रयः । वनेचरो वनाधीशो वानरीवनसेवितः ॥ १४२॥ वानरो वानराधीशो वानरशत्रुनाशनः ।
    वानप्रस्थाश्रमकृतो वानप्रस्थयोगप्रदः ॥ १४३॥ ब्रह्मयोनिर्बृहद्योनि विश्वयोनिर्विवेकवान् । ब्रह्मविद्ब्रह्मभावश्च
    ब्रह्मर्षिर्ब्राह्मणप्रियः ॥ १४४॥ ब्रह्मदो ब्राह्मणात्मा च ब्रह्मविद्याप्रकाशकः । ब्रह्मचारी ब्रह्मवेत्ता
    ब्राह्मणो ब्राह्मणोत्तमः ॥ १४५॥ ब्रह्मपुत्रविधेयात्मा ब्रह्मसूत्रार्थनिर्णयः । ब्रह्मगौरवदाता च ब्रह्माण्डो
    ब्रह्माण्डेश्वरः ॥ १४६॥ व्योमगम्यो व्योमेशानां व्योमेशभवसुन्दरः । व्योमगम्यो व्योमधारो ब्रह्मगीतप्रचारकः
    ॥ १४७॥ व्योमब्रह्मोपगतिश्च व्योमज्ञो व्योमपारदः । व्योमचरो व्योमरूपो व्योमकेशोतिशोभनः ॥ १४८॥ व्यालाधिपो
    व्यालेशानो व्यालस्थो व्यालगः सदा । व्यालमुखो व्यालकर्णो व्यालायतनशोभनः ॥ १४९॥ व्यालशायी व्यालश्रेष्ठो
    व्याघ्राजिनप्रधारकः । वृषाकपी
