id: narayanahridayam
category: hridaya
name:
  english: narayanahridayam
  devanagari: नरयनह्रिदयम्
content:
  english: narayanaprityarthe jape viniyogah || om narayanah param jyotiratma narayanah parah | narayanah
    param brahma narayana namo'stu te || 3|| narayanah paro devo dhata narayanah parah | narayanah paro
    dhata narayana namo'stu te || 4|| narayanah param dhama dhyanam narayanah parah | narayana paro dharmo
    narayana namo'stu te || 5|| narayanah paro devo vidya narayanah parah | vishvam narayanah sakshan
    narayana namo'stu te || 6|| narayanad vidhirjato jato narayanadbhavah | jato narayanadindro narayana
    namo'stu te || 7|| ravirnarayanastejah candro narayano mahah | vahnirnarayanah sakshat narayana namo'stu
    te || 8|| narayana upasyah syad gururnarayanah parah | narayanah paro bodho narayana namo'stu te ||
    9|| narayanah phalam mukhyam siddhirnarayanah sukham | harirnarayanah shuddhirnarayana namo'stu te
    || 10|| nigamaveditanantakalyanagunavaridhe | narayana namaste'stu narakarnavataraka || 11|| janmamrityujaravyadhiparatantryadibhih
    sada | doshairasprishtarupaya narayana namo'stu te || 12|| vedashastrarthavijnanasadhyabhaktyekagocara
    | narayana namaste'stu mamuddhara bhavarnavat || 13|| nityananda mahodara paratpara jagatpate | narayana
    namaste'stu mokshasamrajyadayine || 14|| abrahmasthambaparyantamakhilatmamahashraya | sarvabhutatmabhutatman
    narayana namo'stu te || 15|| palitasheshalokaya punyashravanakirtana | narayana namaste'stu pralayodakashayine
    || 16|| nirastasarvadoshaya bhaktyadigunadayine | narayana namaste'stu tvam vina na hi me gatih ||
    17|| dharmarthakamamokshakhyapurusharthapradayine | narayana namaste'stu punaste'stu namo namah ||
    18|| atha prarthana | narayana tvamevasi daharakhye hridi sthitah | prerita preryamananam tvaya preritamanasah
    || 19|| tvadajnam shirasa kritva bhajami janapavanam | nanopasanamarganam bhavakrid bhavabodhakah
    || 20|| bhavarthakrid bhavatito bhava saukhyaprado mama | tvanmayamohitam vishvam tvayaiva parikalpitam
    || 21|| tvadadhishthanamatrena sa vai sarvarthakarini | tvameva tam puraskritya mama kaman samarthaya
    || 22|| na me tvadanyastratasti tvadanyanna hi daivatam | tvadanyam na hi janami palakam punyavardhanam
    || 23|| yavatsamsariko bhavo manasstho bhavanatmakah | tavatsiddhirbhavet sadhya sarvada sarvada vibho
    || 24|| papinamahamekagro dayalunam tvamagranih | dayaniyo madanyo'sti tava ko'tra jagattraye || 25||
    tvayaham naiva srishtashcet na syattava dayaluta | amayo va na srishtashcedaushadhasya vrithodayah
    || 26|| papasangaparishrantah papatma paparupadhrik | tvadanyah ko'tra papebhyah tratasti jagatitale
    || 27|| tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva | tvameva vidya dravinam tvameva
    tvameva sarvam mama deva deva || 28|| prarthanadashakam caiva mulashtakamatahparam | yah pathecchrinuyannityam
    tasya lakshmih sthira bhavet || 29|| narayanasya hridayam sarvabhishtaphalapradam | lakshmihridayakam
    stotram yadi caitadvinakritam || 30|| tatsarvam nishphalam proktam lakshmih krudhyati sarvada | etatsankalitam
    stotram sarvabhishtaphalapradam || 31|| japet sankalitam kritva sarvabhishtamavapnuyat | narayanasya
    hridayam adau japtva tatahparam || 32|| lakshmihridayakam stotram japennarayanam punah | punarnarayanam
    japtva punarlakshminutim japet || 33|| tadvaddhomadikam kuryadetatsankalitam shubham | evam madhye
    dvivarena japet sankalitam shubham || 34|| lakshmihridayake stotre sarvamanyat prakashitam | sarvan
    kamanavapnoti adhivyadhibhayam haret || 35|| gopyametat sada kuryat na sarvatra prakashayet | iti
    guhyatamam shastram proktam brahmadibhih pura || 36|| lakshmihridayaproktena vidhina sadhayet sudhih
    | tasmat sarvaprayatnena sadhayed gopayet sudhih || 37|| yatraitatpustakam tishthet lakshminarayanatmakam
    | bhutapaishacavetaḻabhayam naiva tu sarvada || 38|| bhriguvare tatha ratrau pujayet pustakadvayam
    | sarvada sarvada stutyam gopayet sadhayet sudhih | gopanat sadhanalloke dhanyo bhavati tattvatah
    || 39|| || ityatharvanarahasye uttarabhage narayanahridayastotram ||
  devanagari: नारायणप्रीत्यर्थे जपे विनियोगः ॥ ॐ नारायणः परं ज्योतिरात्मा नारायणः परः । नारायणः परं ब्रह्म
    नारायण नमोऽस्तु ते ॥ ३॥ नारायणः परो देवो धाता नारायणः परः । नारायणः परो धाता नारायण नमोऽस्तु ते ॥
    ४॥ नारायणः परं धाम ध्यानं नारायणः परः । नारायण परो धर्मो नारायण नमोऽस्तु ते ॥ ५॥ नारायणः परो देवो
    विद्या नारायणः परः । विश्वं नारायणः साक्षान् नारायण नमोऽस्तु ते ॥ ६॥ नारायणाद् विधिर्जातो जातो नारायणाद्भवः
    । जातो नारायणादिन्द्रो नारायण नमोऽस्तु ते ॥ ७॥ रविर्नारायणस्तेजः चन्द्रो नारायणो महः । वह्निर्नारायणः
    साक्षात् नारायण नमोऽस्तु ते ॥ ८॥ नारायण उपास्यः स्याद् गुरुर्नारायणः परः । नारायणः परो बोधो नारायण
    नमोऽस्तु ते ॥ ९॥ नारायणः फलं मुख्यं सिद्धिर्नारायणः सुखम् । हरिर्नारायणः शुद्धिर्नारायण नमोऽस्तु ते
    ॥ १०॥ निगमावेदितानन्तकल्याणगुणवारिधे । नारायण नमस्तेऽस्तु नरकार्णवतारक ॥ ११॥ जन्ममृत्युजराव्याधिपारतन्त्र्यादिभिः
    सदा । दोषैरस्पृष्टरूपाय नारायण नमोऽस्तु ते ॥ १२॥ वेदशास्त्रार्थविज्ञानसाध्यभक्त्येकगोचर । नारायण नमस्तेऽस्तु
    मामुद्धर भवार्णवात् ॥ १३॥ नित्यानन्द महोदार परात्पर जगत्पते । नारायण नमस्तेऽस्तु मोक्षसाम्राज्यदायिने
    ॥ १४॥ आब्रह्मस्थम्बपर्यन्तमखिलात्ममहाश्रय । सर्वभूतात्मभूतात्मन् नारायण नमोऽस्तु ते ॥ १५॥ पालिताशेषलोकाय
    पुण्यश्रवणकीर्तन । नारायण नमस्तेऽस्तु प्रलयोदकशायिने ॥ १६॥ निरस्तसर्वदोषाय भक्त्यादिगुणदायिने । नारायण
    नमस्तेऽस्तु त्वां विना न हि मे गतिः ॥ १७॥ धर्मार्थकाममोक्षाख्यपुरुषार्थप्रदायिने । नारायण नमस्तेऽस्तु
    पुनस्तेऽस्तु नमो नमः ॥ १८॥ अथ प्रार्थना । नारायण त्वमेवासि दहराख्ये हृदि स्थितः । प्रेरिता प्रेर्यमाणानां
    त्वया प्रेरितमानसः ॥ १९॥ त्वदाज्ञां शिरसा कृत्वा भजामि जनपावनम् । नानोपासनमार्गाणां भवकृद् भावबोधकः
    ॥ २०॥ भावार्थकृद् भवातीतो भव सौख्यप्रदो मम । त्वन्मायामोहितं विश्वं त्वयैव परिकल्पितम् ॥ २१॥ त्वदधिष्ठानमात्रेण
    सा वै सर्वार्थकारिणी । त्वमेव तां पुरस्कृत्य मम कामान् समर्थय ॥ २२॥ न मे त्वदन्यस्त्रातास्ति त्वदन्यन्न
    हि दैवतम् । त्वदन्यं न हि जानामि पालकं पुण्यवर्धनम् ॥ २३॥ यावत्सांसारिको भावो मनस्स्थो भावनात्मकः
    । तावत्सिद्धिर्भवेत् साध्या सर्वदा सर्वदा विभो ॥ २४॥ पापिनामहमेकाग्रो दयालूनां त्वमग्रणीः । दयनीयो
    मदन्योऽस्ति तव कोऽत्र जगत्त्रये ॥ २५॥ त्वयाहं नैव सृष्टश्चेत् न स्यात्तव दयालुता । आमयो वा न सृष्टश्चेदौषधस्य
    वृथोदयः ॥ २६॥ पापसङ्गपरिश्रान्तः पापात्मा पापरूपधृक् । त्वदन्यः कोऽत्र पापेभ्यः त्रातास्ति जगतीतले
    ॥ २७॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं
    मम देव देव ॥ २८॥ प्रार्थनादशकं चैव मूलाष्टकमतःपरम् । यः पठेच्छृणुयान्नित्यं तस्य लक्ष्मीः स्थिरा भवेत्
    ॥ २९॥ नारायणस्य हृदयं सर्वाभीष्टफलप्रदम् । लक्ष्मीहृदयकं स्तोत्रं यदि चैतद्विनाकृतम् ॥ ३०॥ तत्सर्वं
    निष्फलं प्रोक्तं लक्ष्मीः क्रुध्यति सर्वदा । एतत्सङ्कलितं स्तोत्रं सर्वाभीष्टफलप्रदम् ॥ ३१॥ जपेत्
    सङ्कलितं कृत्वा सर्वाभीष्टमवाप्नुयात् । नारायणस्य हृदयं आदौ जप्त्वा ततःपरम् ॥ ३२॥ लक्ष्मीहृदयकं स्तोत्रं
    जपेन्नारायणं पुनः । पुनर्नारायणं जप्त्वा पुनर्लक्ष्मीनुतिं जपेत् ॥ ३३॥ तद्वद्धोमादिकं कुर्यादेतत्सङ्कलितं
    शुभम् । एवं मध्ये द्विवारेण जपेत् सङ्कलितं शुभम् ॥ ३४॥ लक्ष्मीहृदयके स्तोत्रे सर्वमन्यत् प्रकाशितम्
    । सर्वान् कामानवाप्नोति आधिव्याधिभयं हरेत् ॥ ३५॥ गोप्यमेतत् सदा कुर्यात् न सर्वत्र प्रकाशयेत् । इति
    गुह्यतमं शास्त्रं प्रोक्तं ब्रह्मादिभिः पुरा ॥ ३६॥ लक्ष्मीहृदयप्रोक्तेन विधिना साधयेत् सुधीः । तस्मात्
    सर्वप्रयत्नेन साधयेद् गोपयेत् सुधीः ॥ ३७॥ यत्रैतत्पुस्तकं तिष्ठेत् लक्ष्मीनारायणात्मकम् । भूतपैशाचवेताळभयं
    नैव तु सर्वदा ॥ ३८॥ भृगुवारे तथा रात्रौ पूजयेत् पुस्तकद्वयम् । सर्वदा सर्वदा स्तुत्यं गोपयेत् साधयेत्
    सुधीः । गोपनात् साधनाल्लोके धन्यो भवति तत्त्वतः ॥ ३९॥ ॥ इत्यथर्वणरहस्ये उत्तरभागे नारायणहृदयस्तोत्रम्
    ॥
