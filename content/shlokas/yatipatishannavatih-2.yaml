id: yatipatishannavatih-2
category: shataka
name:
  english: yatipatishannavatih
  devanagari: यतिपतिषण्णवतिः
content:
  english: shrimallakshmanayogirajavacasam mahatmyamatyadbhutam ko'ham vaktumidam vadanti sudhiyah shrivatsagurvadayah
    | kanadapramukheshu mastu dhishana shastreshu kavyeshu va sarvatra'pi jayam yatishvaragiram seva pradadyaditi
    || 86|| shayya padmavilocanasya mahatah pumso bhujangadhipah sanjato dharanau kilayamabhavat purvam
    mahabhashyakrit | sanjato'tha ca pingalahvayamunih chandashcayam nirmame sanjato'tha ca lakshmanaryamunirat
    shribhashyakaro'bhavat || 87|| jato bhashyakridesha bhashyakridabhut shripingalah pingale varshe'bhut
    madhurodito'tha ca madhau mase bhavattarakah | sanjato bhavatarake sakalamapyetat param sampratam
    tasmat sampratamenamasmi sharanam yato yatinam patim || 88|| shastre shabdamaye tatana vihritim janmanyasavadime
    madhyasthe'tha ca janmaniha vihritim chandahkule'thodite | janmanyatra vidhaya bhashyamubhayam gadyatrayam
    saravat vedarthasya ca sangraham yatipatih nityam sthito dipavat || 89|| sancarena pavitritakshititalam
    sadbhissada sevitam kancipurnakritindravagvilasitaih vidyotamanantaram | vedarthaughasamriddhashobhananavagranthodayaikasthalam
    shriramanujamagryavarnamadhuram sevasva he citta
  devanagari: श्रीमल्लक्ष्मणयोगिराजवचसां माहात्म्यमत्यद्भुतं कोऽहं वक्तुमिदं वदन्ति सुधियः श्रीवत्सगुर्वादयः
    । काणादप्रमुखेषु मास्तु धिषणा शास्त्रेषु काव्येषु वा सर्वत्राऽपि जयं यतीश्वरगिरां सेवा प्रदद्यादिति
    ॥ ८६॥ शय्या पद्मविलोचनस्य महतः पुंसो भुजङ्गाधिपः सञ्जातो धरणौ किलायमभवत् पूर्वं महाभाष्यकृत् । सञ्जातोऽथ
    च पिङ्गलाह्वयमुनिः छन्दश्चयं निर्ममे सञ्जातोऽथ च लक्ष्मणार्यमुनिराट् श्रीभाष्यकारोऽभवत् ॥ ८७॥ जातो
    भाष्यकृदेष भाष्यकृदभूत् श्रीपिङ्गलः पिङ्गले वर्षेऽभूत् मधुरोदितोऽथ च मधौ मासे भवात्तारकः । सञ्जातो
    भवतारके सकलमप्येतत् परं साम्प्रतं तस्मात् साम्प्रतमेनमस्मि शरणं यातो यतीनां पतिम् ॥ ८८॥ शास्त्रे शब्दमये
    ततान विहृतिं जन्मन्यसावादिमे मध्यस्थेऽथ च जन्मनीह विहृतिं छन्दःकुलेऽथोदिते । जन्मन्यत्र विधाय भाष्यमुभयं
    गद्यत्रयं सारवत् वेदार्थस्य च सङ्ग्रहं यतिपतिः नित्यं स्थितो दीपवत् ॥ ८९॥ सञ्चारेण पवित्रितक्षितितलं
    सद्भिस्सदा सेवितं काञ्चीपूर्णकृतीन्द्रवाग्विलसितैः विद्योतमानान्तरम् । वेदार्थौघसमृद्धशोभननवग्रन्थोदयैकस्थलं
    श्रीरामानुजमग्र्यवर्णमधुरं सेवस्व हे चित्त
