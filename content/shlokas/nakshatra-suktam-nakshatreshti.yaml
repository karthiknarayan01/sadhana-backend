id: nakshatra-suktam-nakshatreshti
category: stotram
name:
  english: Nakshatra Suktam (Nakshatreshti)
  devanagari: नक्षत्रसूक्तम्
content:
  english: taittiriya brahmanam | ashtakam - 3 prashnah 1 taittiriya samhita | kanda 3 prapathakah - 5
    anuvaka -1 om || agnirnah patu krittikah| nakshatram devamindriyam| idamasam vicakshanam| havirasam
    juhotana| yasya bhanti rashmayo yasya ketavah| yasyema vishva bhuvanani sarva| sa krittikabhirabhisamvasanah|
    agnirno devassuvite dadhatu || 1|| prajapate rohinivetu patni| vishvarupa brihati citrabhanuh| sa
    no yajnasya suvite dadhatu| yatha jivema sharadassavirah| rohini devyudagatpurastat| vishva rupani
    pratimodamana| prajapati havisha vardhayanti| priya devanamupayatu yajnam || 2|| somo raja mrigashirshena
    agann| shivam nakshatram priyamasya dhama| apyayamano bahudha janeshu| retah prajam yajamane dadhatu|
    yatte nakshatram mrigashirshamasti| priya rajan priyatamam priyanam| tasmai te soma havisha vidhema|
    shanna edhi dvipade sham catushpade || 3|| ardraya rudrah prathama na eti| shreshtho devanam patiraghniyanam|
    nakshatramasya havisha vidhema| ma nah praja ririshanmota viran| heti rudrasya parino vrinaktu| ardra
    nakshatram jushata havirnah| pramuncamanau duritani vishva| apaghashasannudatamaratim| || 4|| punarno
    devyaditisprinotu| punarvasunah punaretam yajnam| punarno deva abhiyantu sarve| punah punarvo havisha
    yajamah| eva na devyaditiranarva| vishvasya bhartri jagatah pratishtha| punarvasu havisha vardhayanti|
    priyam devanamapyetu pathah || 5|| brihaspatih prathamam jayamanah| tishyam nakshatramabhi sambabhuva|
    shreshtho devanam pritanasujishnuh| disho'nu sarva abhayanno astu| tishyah purastaduta madhyato nah|
    brihaspatirnah paripatu pashcat| badhetandvesho abhayam krinutam| suviryasya patayasyama || 6 || ida
    sarpebhyo havirastu jushtam| ashresha yeshamanuyanti cetah| ye antariksham prithivim kshiyanti| te
    nassarpaso havamagamishthah| ye rocane suryasyapi sarpah| ye divam devimanusancaranti| yeshamashresha
    anuyanti kamam| tebhyassarpebhyo madhumajjuhomi || 7 || upahutah pitaro ye maghasu| manojavasassukritassukrityah|
    te no nakshatre havamagamishthah| svadhabhiryajnam prayatam jushantam| ye agnidagdha ye'nagnidagdhah|
    ye'mullokam pitarah kshiyanti| yashca vidmaya u ca na pravidma| maghasu yajna sukritam jushantam ||
    8|| gavam patih phalguninamasi tvam| tadaryaman varunamitra caru| tam tva vaya sanitara saninam| jiva
    jivantamupa samvishema| yenema vishva bhuvanani sanjita| yasya deva anusamyanti cetah| aryama raja'jarastu
    vishman| phalguninamrishabho roraviti || 9 || shreshtho devanam bhagavo bhagasi| tattva viduh phalgunistasya
    vittat| asmabhyam kshatramajara suviryam| gomadashvavadupasannudeha| bhagoha data bhaga itpradata|
    bhago devih phalguniravivesha| bhagasyettam prasavam gamema| yatra devaissadhamadam madema| || 10
    || ayatu devassavitopayatu| hiranyayena suvrita rathena| vahan hasta subhagam vidmanapasam| prayacchantam
    papurim punyamaccha| hastah prayaccha tvamritam vasiyah| dakshinena pratigribhnima enat| dataramadya
    savita videya| yo no hastaya prasuvati yajnam ||11 || tvashta nakshatramabhyeti citram| subha sasamyuvati
    rocamanam| niveshayannamritanmartyashca| rupani pishan bhuvanani vishva| tannastvashta tadu citra
    vicashtam| tannakshatram bhurida astu mahyam| tannah prajam viravati sanotu| gobhirno ashvaissamanaktu
    yajnam || 12 || vayurnakshatramabhyeti nishtyam| tigmashrimgo vrishabho roruvanah| samirayan bhuvana
    matarishva| apa dveshasi nudatamaratih| tanno vayastadu nishtya shrinotu| tannakshatram bhurida astu
    mahyam| tanno devaso anujanantu kamam| yatha tarema duritani vishva || 13 || duramasmacchatravo yantu
    bhitah| tadindragni krinutam tadvishakhe| tanno deva anumadantu yajnam| pashcat purastadabhayanno
    astu| nakshatranamadhipatni vishakhe| shreshthavindragni bhuvanasya gopau| vishucashshatrunapabadhamanau|
    apakshudhannudatamaratim| || 14 || purna pashcaduta purna purastat| unmadhyatah paurnamasi jigaya|
    tasyam deva adhisamvasantah| uttame naka iha madayantam| prithvi suvarca yuvatih sajoshah|paurnamasyudagacchobhamana|
    apyayayanti duritani vishva| urum duham yajamanaya yajnam| riddhyasma havyairnamasopasadya| mitram
    devam mitradheyam no astu| anuradhan havisha vardhayantah| shatam jivema sharadah savirah| citram
    nakshatramudagatpurastat| anuradha sa iti yadvadanti| tanmitra eti pathibhirdevayanaih| hiranyayairvitatairantarikshe
    || 16 || indro jyeshthamanu nakshatrameti| yasmin vritram vritra turyo tatara| tasminvayamamritam
    duhanah| kshudhantarema duritim durishtim| purandaraya vrishabhaya dhrishnave| ashadhaya sahamanaya
    midhushe| indraya jyeshtha madhumadduhana|urum krinotu yajamanaya lokam| || 17 || mulam prajam viravatim
    videya| paracyetu nirritih paraca| gobhirnakshatram pashubhissamaktam| aharbhuyadyajamanaya mahyam|
    aharno adya suvite dadatu| mulam nakshatramiti yadvadanti| paracim vaca nirritim nudami| shivam prajayai
    shivamastu mahyam || 18 || ya divya apah payasa sambabhuvuh| ya antariksha uta parthiviryah| yasamashadha
    anuyanti kamam| ta na apah sha syona bhavantu| yashca kupya yashca nadyassamudriyah| yashca vaishantiruta
    prasaciryah| yasamashadha madhu bhakshayanti| ta na apah sha syona bhavantu ||19 || tanno vishve upa
    shrinvantu devah| tadashadha abhisamyantu yajnam| tannakshatram prathatam pashubhyah| krishirvrishtiryajamanaya
    kalpatam| shubhrah kanya yuvatayassupeshasah| karmakritassukrito viryavatih| vishvan devan havisha
    vardhayantih| ashadhah kamamupayantu yajnam || 20 || yasmin brahmabhyajayatsarvametat| amunca lokamidamuca
    sarvam| tanno nakshatramabhijidvijitya| shriyam dadhatvahriniyamanam| ubhau lokau brahmana sanjitemau|
    tanno nakshatramabhijidvicashtam| tasminvayam pritanassanjayema| tanno devaso anujanantu kamam ||
    21 || shrinvanti shronamamritasya gopam| punyamasya upashrinomi vacam| mahim devim vishnupatnimajuryam|
    pratici mena havisha yajamah| tredha vishnururugayo vicakrame| mahim divam prithivimantariksham| tacchronaitishrava
    icchamana| punya shlokam yajamanaya krinvati || 22 || ashtau deva vasavassomyasah| catasro devirajarah
    shravishthah| te yajnam pantu rajasah purastat| samvatsarinamamrita svasti| yajnam nah pantu vasavah
    purastat| dakshinato'bhiyantu shravishthah| punyannakshatramabhi samvishama| ma no aratiraghashasa'gann
    || 23 || kshatrasya raja varuno'dhirajah| nakshatrana shatabhishagvasishthah| tau devebhyah krinuti
    dirghamayuh| shata sahasra bheshajani dhattah| yajnanno raja varuna upayatu| tanno vishve abhi samyantu
    devah| tanno nakshatra shatabhishagjushanam| dirghamayuh pratiradbheshajani || 24 || aja ekapadudagatpurastat|
    vishva bhutani prati modamanah| tasya devah prasavam yanti sarve| proshthapadaso amritasya gopah|
    vibhrajamanassamidha na ugrah| a'ntarikshamaruhadagandyam| ta suryam devamajamekapadam| proshthapadaso
    anuyanti sarve || 25 || ahirbudhniyah prathama na eti| shreshtho devanamuta manushanam| tam brahmanassomapassomyasah|
    proshthapadaso abhirakshanti sarve| catvara ekamabhi karma devah| proshthapada sa iti yan vadanti|
    te budhniyam parishadya stuvantah| ahi rakshanti namasopasadya || 26 || pusha revatyanveti pantham|
    pushtipati pashupa vajabastyau| imani havya prayata jushana| sugairno yanairupayatam yajnam| kshudran
    pashun rakshatu revati nah| gavo no ashva anvetu pusha| anna rakshantau bahuda virupam| vaja sanutam
    yajamanaya yajnam || 27 || tadashvinavashvayujopayatam| shubhangamishthau suyamebhirashvaih| svam
    nakshatra havisha yajantau| madhvasampriktau yajusha samaktau| yau devanam bhishajau havyavahau| vishvasya
    dutavamritasya gopau| tau nakshatram jujushanopayatam| namo'shvibhyam krinumo'shvayugbhyam || 28 ||
    apa papmanam bharanirbharantu| tadyamo raja bhagavan vicashtam| lokasya raja mahato mahan hi| sugam
    nah panthamabhayam krinotu| yasminnakshatre yama eti raja| yasminnenamabhyashimcanta devah| tadasya
    citra havisha yajama| apa papmanam bharanirbharantu || 29 || niveshani sangamani vasunam vishva rupani
    vasunyaveshayanti| sahasraposha subhaga rarana sa na aganvarcasa samvidana|| yatte deva adadhurbhagadheyamamavasye
    samvasanto mahitva| sa no yajnam piprihi vishvavare rayinno dhehi subhage suviram| om shantih shantih
    shantih | Encoded vith accents by ṟajagopal iyer
  devanagari: तैत्तिरीय ब्राह्मणम् । अष्टकम् - ३ प्रश्नः १ तैत्तिरीय संहिता । काण्ड ३ प्रपाठकः - ५ अनुवाक
    -१ ॐ ॥ अग्निर्नः पातु कृत्तिकाः। नक्षत्रं देवमिन्द्रियम्। इदमासां विचक्षणम्। हविरासं जुहोतन। यस्य
    भान्ति रश्मयो यस्य केतवः। यस्येमा विश्वा भुवनानि सर्वा। स कृत्तिकाभिरभिसंवसानः। अग्निर्नो देवस्सुविते
    दधातु ॥ १॥ प्रजापते रोहिणीवेतु पत्नी। विश्वरूपा बृहती चित्रभानुः। सा नो यज्ञस्य सुविते दधातु। यथा
    जीवेम शरदस्सवीराः। रोहिणी देव्युदगात्पुरस्तात्। विश्वा रूपणि प्रतिमोदमाना। प्रजापति हविषा वर्धयन्ती।
    प्रिया देवानामुपयातु यज्ञम् ॥ २॥ सोमो राजा मृगशीर्षेण आगन्न्। शिवं नक्षत्रं प्रियमस्य धाम। आप्यायमानो
    बहुधा जनेषु। रेतः प्रजां यजमाने दधातु। यत्ते नक्षत्रं मृगशीर्षमस्ति। प्रिय राजन् प्रियतमं प्रियाणाम्।
    तस्मै ते सोम हविषा विधेम। शन्न एधि द्विपदे शं चतुष्पदे ॥ ३॥ आर्द्रया रुद्रः प्रथमा न एति। श्रेष्ठो
    देवानां पतिरघ्नियानाम्। नक्षत्रमस्य हविषा विधेम। मा नः प्रजा रीरिषन्मोत वीरान्। हेति रुद्रस्य परिणो
    वृणक्तु। आर्द्रा नक्षत्रं जुषता हविर्नः। प्रमुञ्चमानौ दुरितानि विश्वा। अपाघशसन्नुदतामरातिम्। ॥ ४॥
    पुनर्नो देव्यदितिस्पृणोतु। पुनर्वसूनः पुनरेतां यज्ञम्। पुनर्नो देवा अभियन्तु सर्वे। पुनः पुनर्वो हविषा
    यजामः। एवा न देव्यदितिरनर्वा। विश्वस्य भर्त्री जगतः प्रतिष्ठा। पुनर्वसू हविषा वर्धयन्ती। प्रियम् देवानामप्येतु
    पाथः ॥ ५॥ बृहस्पतिः प्रथमं जायमानः। तिष्यं नक्षत्रमभि संबभूव। श्रेष्ठो देवानां पृतनासुजिष्णुः। दिशोऽनु
    सर्वा अभयन्नो अस्तु। तिष्यः पुरस्तादुत मध्यतो नः। बृहस्पतिर्नः परिपातु पश्चात्। बाधेतान्द्वेषो अभयं
    कृणुताम्। सुवीर्यस्य पतयस्याम ॥ ६ ॥ इद सर्पेभ्यो हविरस्तु जुष्टम्। आश्रेषा येषामनुयन्ति चेतः। ये अन्तरिक्षं
    पृथिवीं क्षियन्ति। ते नस्सर्पासो हवमागमिष्ठाः। ये रोचने सूर्यस्यापि सर्पाः। ये दिवं देवीमनुसञ्चरन्ति।
    येषमश्रेषा अनुयन्ति कामम्। तेभ्यस्सर्पेभ्यो मधुमज्जुहोमि ॥ ७ ॥ उपहूताः पितरो ये मघासु। मनोजवसस्सुकृतस्सुकृत्याः।
    ते नो नक्षत्रे हवमागमिष्ठाः। स्वधाभिर्यज्ञं प्रयतं जुषन्ताम्। ये अग्निदग्धा येऽनग्निदग्धाः। येऽमुल्लोकं
    पितरः क्षियन्ति। याश्च विद्मया उ च न प्रविद्म। मघासु यज्ञ सुकृतम् जुषन्ताम् ॥ ८॥ गवां पतिः फल्गुनीनामसि
    त्वम्। तदर्यमन् वरुणमित्र चारु। तं त्वा वय सनितार सनीनाम्। जीवा जीवन्तमुप संविशेम। येनेमा विश्वा भुवनानि
    सञ्जिता। यस्य देवा अनुसंयन्ति चेतः। अर्यमा राजाऽजरस्तु विष्मान्। फल्गुनीनामृषभो रोरवीति ॥ ९ ॥ श्रेष्ठो
    देवानां भगवो भगासि। तत्त्वा विदुः फल्गुनीस्तस्य वित्तात्। अस्मभ्यं क्षत्रमजर सुवीर्यम्। गोमदश्ववदुपसन्नुदेह।
    भगोह दाता भग इत्प्रदाता। भगो देवीः फल्गुनीराविवेश। भगस्येत्तं प्रसवं गमेम। यत्र देवैस्सधमादं मदेम।
    ॥ १० ॥ आयातु देवस्सवितोपयातु। हिरण्ययेन सुवृता रथेन। वहन् हस्त सुभगं विद्मनापसम्। प्रयच्छन्तं पपुरिं
    पुण्यमच्छ। हस्तः प्रयच्छ त्वमृतं वसीयः। दक्षिणेन प्रतिगृभ्णीम एनत्। दातारमद्य सविता विदेय। यो नो हस्ताय
    प्रसुवाति यज्ञम् ॥११ ॥ त्वष्टा नक्षत्रमभ्येति चित्राम्। सुभ ससंयुवति रोचमानाम्। निवेशयन्नमृतान्मर्त्याश्च।
    रूपाणि पिशन् भुवनानि विश्वा। तन्नस्त्वष्टा तदु चित्रा विचष्टाम्। तन्नक्षत्रं भूरिदा अस्तु मह्यम्।
    तन्नः प्रजां वीरवती सनोतु। गोभिर्नो अश्वैस्समनक्तु यज्ञम् ॥ १२ ॥ वायुर्नक्षत्रमभ्येति निष्ट्याम्।
    तिग्मशृंगो वृषभो रोरुवाणः। समीरयन् भुवना मातरिश्वा। अप द्वेषासि नुदतामरातीः। तन्नो वायस्तदु निष्ट्या
    शृणोतु। तन्नक्षत्रं भूरिदा अस्तु मह्यम्। तन्नो देवासो अनुजानन्तु कामम्। यथा तरेम दुरितानि विश्वा ॥
    १३ ॥ दूरमस्मच्छत्रवो यन्तु भीताः। तदिन्द्राग्नी कृणुतां तद्विशाखे। तन्नो देवा अनुमदन्तु यज्ञम्। पश्चात्
    पुरस्तादभयन्नो अस्तु। नक्षत्राणामधिपत्नी विशाखे। श्रेष्ठाविन्द्राग्नी भुवनस्य गोपौ। विषूचश्शत्रूनपबाधमानौ।
    अपक्षुधन्नुदतामरातिम्। ॥ १४ ॥ पूर्णा पश्चादुत पूर्णा पुरस्तात्। उन्मध्यतः पौर्णमासी जिगाय। तस्यां
    देवा अधिसंवसन्तः। उत्तमे नाक इह मादयन्ताम्। पृथ्वी सुवर्चा युवतिः सजोषाः।पौर्णमास्युदगाच्छोभमाना।
    आप्याययन्ती दुरितानि विश्वा। उरुं दुहां यजमानाय यज्ञम्। ऋद्ध्यास्म हव्यैर्नमसोपसद्य। मित्रं देवं मित्रधेयं
    नो अस्तु। अनूराधान् हविषा वर्धयन्तः। शतं जीवेम शरदः सवीराः। चित्रं नक्षत्रमुदगात्पुरस्तात्। अनूराधा
    स इति यद्वदन्ति। तन्मित्र एति पथिभिर्देवयानैः। हिरण्ययैर्विततैरन्तरिक्षे ॥ १६ ॥ इन्द्रो ज्येष्ठामनु
    नक्षत्रमेति। यस्मिन् वृत्रं वृत्र तूर्यो ततार। तस्मिन्वयममृतं दुहानाः। क्षुधन्तरेम दुरितिं दुरिष्टिम्।
    पुरन्दराय वृषभाय धृष्णवे। अषाढाय सहमानाय मीढुषे। इन्द्राय ज्येष्ठा मधुमद्दुहाना।उरुं कृणोतु यजमानाय
    लोकम्। ॥ १७ ॥ मूलं प्रजां वीरवतीं विदेय। पराच्येतु निरृतिः पराचा। गोभिर्नक्षत्रं पशुभिस्समक्तम्। अहर्भूयाद्यजमानाय
    मह्यम्। अहर्नो अद्य सुविते ददातु। मूलं नक्षत्रमिति यद्वदन्ति। पराचीं वाचा निरृतिं नुदामि। शिवं प्रजयै
    शिवमस्तु मह्यम् ॥ १८ ॥ या दिव्या आपः पयसा सम्बभूवुः। या अन्तरिक्ष उत पार्थिवीर्याः। यासामषाढा अनुयन्ति
    कामम्। ता न आपः श स्योना भवन्तु। याश्च कूप्या याश्च नाद्यास्समुद्रियाः। याश्च वैशन्तीरुत प्रासचीर्याः।
    यासामषाढा मधु भक्षयन्ति। ता न आपः श स्योना भवन्तु ॥१९ ॥ तन्नो विश्वे उप शृण्वन्तु देवाः। तदषाढा अभिसंयन्तु
    यज्ञम्। तन्नक्षत्रं प्रथतां पशुभ्यः। कृषिर्वृष्टिर्यजमानाय कल्पताम्। शुभ्राः कन्या युवतयस्सुपेशसः।
    कर्मकृतस्सुकृतो वीर्यावतीः। विश्वान् देवान् हविषा वर्धयन्तीः। अषाढाः काममुपायन्तु यज्ञम् ॥ २० ॥ यस्मिन्
    ब्रह्माभ्यजयत्सर्वमेतत्। अमुञ्च लोकमिदमूच सर्वम्। तन्नो नक्षत्रमभिजिद्विजित्य। श्रियं दधात्वहृणीयमानम्।
    उभौ लोकौ ब्रह्मणा सञ्जितेमौ। तन्नो नक्षत्रमभिजिद्विचष्टाम्। तस्मिन्वयं पृतनास्सञ्जयेम। तन्नो देवासो
    अनुजानन्तु कामम् ॥ २१ ॥ शृण्वन्ति श्रोणाममृतस्य गोपाम्। पुण्यामस्या उपशृणोमि वाचम्। महीं देवीं विष्णुपत्नीमजूर्याम्।
    प्रतीची मेना हविषा यजामः। त्रेधा विष्णुरुरुगायो विचक्रमे। महीं दिवं पृथिवीमन्तरिक्षम्। तच्छ्रोणैतिश्रव
    इच्छमाना। पुण्य श्लोकं यजमानाय कृण्वती ॥ २२ ॥ अष्टौ देवा वसवस्सोम्यासः। चतस्रो देवीरजराः श्रविष्ठाः।
    ते यज्ञं पान्तु रजसः पुरस्तात्। संवत्सरीणममृत स्वस्ति। यज्ञं नः पान्तु वसवः पुरस्तात्। दक्षिणतोऽभियन्तु
    श्रविष्ठाः। पुण्यन्नक्षत्रमभि संविशाम। मा नो अरातिरघशसाऽगन्न् ॥ २३ ॥ क्षत्रस्य राजा वरुणोऽधिराजः।
    नक्षत्राणा शतभिषग्वसिष्ठः। तौ देवेभ्यः कृणुति दीर्घमायुः। शत सहस्रा भेषजानि धत्तः। यज्ञन्नो राजा वरुण
    उपयातु। तन्नो विश्वे अभि संयन्तु देवाः। तन्नो नक्षत्र शतभिषग्जुषाणम्। दीर्घमायुः प्रतिरद्भेषजानि ॥
    २४ ॥ अज एकपादुदगात्पुरस्तात्। विश्वा भूतानि प्रति मोदमानः। तस्य देवाः प्रसवं यन्ति सर्वे। प्रोष्ठपदासो
    अमृतस्य गोपाः। विभ्राजमानस्समिधा न उग्रः। आऽन्तरिक्षमरुहदगन्द्याम्। त सूर्यं देवमजमेकपादम्। प्रोष्ठपदासो
    अनुयन्ति सर्वे ॥ २५ ॥ अहिर्बुध्नियः प्रथमा न एति। श्रेष्ठो देवानामुत मानुषाणाम्। तं ब्राह्मणास्सोमपास्सोम्यासः।
    प्रोष्ठपदासो अभिरक्षन्ति सर्वे। चत्वार एकमभि कर्म देवाः। प्रोष्ठपदा स इति यान् वदन्ति। ते बुध्नियं
    परिषद्य स्तुवन्तः। अहि रक्षन्ति नमसोपसद्य ॥ २६ ॥ पूषा रेवत्यन्वेति पन्थाम्। पुष्टिपती पशुपा वाजबस्त्यौ।
    इमानि हव्या प्रयता जुषाणा। सुगैर्नो यानैरुपयातां यज्ञम्। क्षुद्रान् पशून् रक्षतु रेवती नः। गावो नो
    अश्वा अन्वेतु पूषा। अन्न रक्षन्तौ बहुदा विरूपम्। वाज सनुतां यजमानाय यज्ञम् ॥ २७ ॥ तदश्विनावश्वयुजोपयाताम्।
    शुभङ्गमिष्ठौ सुयमेभिरश्वैः। स्वं नक्षत्र हविषा यजन्तौ। मध्वासम्पृक्तौ यजुषा समक्तौ। यौ देवानां भिषजौ
    हव्यवाहौ। विश्वस्य दूतवमृतस्य गोपौ। तौ नक्षत्रं जुजुषाणोपयाताम्। नमोऽश्विभ्यां कृणुमोऽश्वयुग्भ्याम्
    ॥ २८ ॥ अप पाप्मानं भरणीर्भरन्तु। तद्यमो राजा भगवान् विचष्टाम्। लोकस्य राजा महतो महान् हि। सुगं नः
    पन्थामभयं कृणोतु। यस्मिन्नक्षत्रे यम एति राजा। यस्मिन्नेनमभ्यषिंचन्त देवाः। तदस्य चित्र हविषा यजाम।
    अप पाप्मानं भरणीर्भरन्तु ॥ २९ ॥ निवेशनी सङ्गमनी वसूनां विश्वा रूपाणि वसून्यावेशयन्ती। सहस्रपोष सुभगा
    रराणा सा न आगन्वर्चसा संविदाना॥ यत्ते देवा अदधुर्भागधेयममावास्ये संवसन्तो महित्वा। सा नो यज्ञं पिपृहि
    विश्ववारे रयिन्नो धेहि सुभगे सुवीरम्। ॐ शान्तिः शान्तिः शान्तिः । Eन्चोदेद् विथ् आच्चेन्त्स् ब्य्
    ऱजगोपल् ईयेर्
