id: dhumavatyuccatanamantrah
category: mantra
name:
  english: dhumavatyuccatanamantrah
  devanagari: धूमावत्युच्चाटनमन्त्रः
content:
  english: kakarudhatikrishnabha bhinnadanta viragini | muktakeshi sudhumrakshi kshuttrisharta bhayatura
    || cancala cati kamarta klishta pushtalasangika | malina shramani rakta vyaktagarbhavirodhini | dhritasarpagrahasta
    ca dhyeya dhumavatipara || manuh
  devanagari: काकारूढातिकृष्णाभा भिन्नदन्ता विरागिणी । मुक्तकेशी सुधूम्राक्षी क्षुत्तृषार्ता भयातुरा ॥
    चञ्चला चाति कामार्ता क्लिष्टा पुष्टालसाङ्गिका । मलिना श्रमनी रक्ता व्यक्तगर्भाविरोधिनी । धृतसर्पाग्रहस्ता
    च ध्येया धूमावतीपरा ॥ मनुः
meaning: {}
