id: stotram-8
category: stotram
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: rinu yatnena narada | savadhanamana bhutva kshanam shuddho munishvarah || 14|| atha sahasranamastotram
    | om vagvani varada vandya vararoha varaprada | vrittirvagishvari varta vara vagishavallabha || 1||
    vishveshvari vishvavandya vishveshapriyakarini | vagvadini ca vagdevi vriddhida vriddhikarini || 2||
    vriddhirvriddha vishaghni ca vrishtirvrishtipradayini | vishvaradhya vishvamata vishvadhatri vinayaka
    || 3|| vishvashaktirvishvasara vishva vishvavibhavari | vedantavedini vedya vitta vedatrayatmika ||
    4|| vedajna vedajanani vishva vishvavibhavari | varenya vanmayi vriddha vishishtapriyakarini || 5||
    vishvatovadana vyapta vyapini vyapakatmika | vyaḻaghni vyaḻabhushamgi viraja vedanayika || 6|| vedavedantasamvedya
    vedantajnanarupini | vibhavari ca vikranta vishvamitra vidhipriya || 7|| varishtha viprakrishta ca
    vipravaryaprapujita | vedarupa vedamayi vedamurtishca vallabha || 8|| gauri gunavati gopya gandharvanagarapriya
    | gunamata guhantastha gururupa gurupriya || 9|| girividya ganatushta gayakapriyakarini | gayatri
    girisharadhya girgirishapriyamkari || 10|| girijna jnanavidya ca girirupa girishvari | girmata ganasamstutya
    gananiyagunanvita || 11|| gudharupa guha gopya gorupa gaurgunatmika | gurvi gurvambika guhya geyaja
    grihanashini || 12|| grihini grihadoshaghni gavaghni guruvatsala | grihatmika griharadhya grihabadhavinashini
    || 13|| ganga girisuta gamya gajayana guhastuta | garudasanasamsevya gomati gunashalini || 14|| sharada
    shashvati shaivi shamkari shamkaratmika | shrih sharvani shataghni ca sharaccandranibhanana || 15||
    sharmishtha shamanaghni ca shatasahasrarupini | shiva shambhupriya shraddha shrutirupa shrutipriya
    || 16|| shucishmati sharmakari shuddhida shuddhirupini | shiva shivamkari shuddha shivaradhya shivatmika
    || 17|| shrimati shrimayi shravya shrutih shravanagocara | shantih shantikari shanta shantacarapriyamkari
    || 18|| shilalabhya shilavati shrimata shubhakarini | shubhavani shuddhavidya shuddhacittaprapujita
    || 19|| shrikari shrutapapaghni shubhakshi shucivallabha | shivetaraghni shabari shravaniyagunanvita
    || 20|| shari shirishapushpabha shamanishtha shamatmika | shamanvita shamaradhya shitikanthaprapujita
    || 21|| shuddhih shuddhikari shreshtha shrutananta shubhavaha | sarasvati ca sarvajna sarvasiddhipradayini
    || 22|| sarasvati ca savitri samdhya sarvepsitaprada | sarvartighni sarvamayi sarvavidyapradayini
    || 23|| sarveshvari sarvapunya sargasthityantakarini | sarvaradhya sarvamata sarvadevanishevita ||
    24|| sarvaishvaryaprada satya sati satvagunashraya | svarakramapadakara sarvadoshanishudini || 25||
    sahasrakshi sahasrasya sahasrapadasamyuta | sahasrahasta sahasragunalamkritavigraha || 26|| sahasrashirsha
    sadrupa svadha svaha sudhamayi | shadgranthibhedini sevya sarvalokaikapujita || 27|| stutya stutimayi
    sadhya savitripriyakarini | samshayacchedini samkhyavedya samkhya sadishvari || 28|| siddhida siddhasampujya
    sarvasiddhipradayini | sarvajna sarvashaktishca sarvasampatpradayini || 29|| sarvashubhaghni sukhada
    sukha samvitsvarupini | sarvasambhishani sarvajagatsammohini tatha || 30|| sarvapriyamkari sarvashubhada
    sarvamangaḻa | sarvamantramayi sarvatirthapunyaphalaprada || 31|| sarvapunyamayi sarvavyadhighni sarvakamada
    | sarvavighnahari sarvavandita sarvamangaḻa || 32|| sarvamantrakari sarvalakshmih sarvagunanvita |
    sarvanandamayi sarvajnanada satyanayika || 33|| sarvajnanamayi sarvarajyada sarvamuktida | suprabha
    sarvada sarva sarvalokavashamkari || 34|| subhaga sundari siddha siddhamba siddhamatrika | siddhamata
    siddhavidya siddheshi siddharupini || 35|| surupini sukhamayi sevakapriyakarini | svamini sarvada
    sevya sthulasukshmaparambika || 36|| sararupa sarorupa satyabhuta samashraya | sitasita sarojakshi
    sarojasanavallabha || 37|| saroruhabha sarvangi surendradiprapujita | mahadevi maheshani mahasarasvataprada
    || 38|| mahasarasvati mukta muktida malanashini | maheshvari mahananda mahamantramayi mahi || 39||
    mahalakshmirmahavidya mata mandaravasini | mantragamya mantramata mahamantraphalaprada || 40|| mahamuktirmahanitya
    mahasiddhipradayini | mahasiddha mahamata mahadakarasamyuta || 41|| maha maheshvari murtirmokshada
    manibhushana | menaka manini manya mrityughni merurupini || 42|| madirakshi madavasa makharupa makheshvari
    | mahamoha mahamaya matrinam murdhnisamsthita || 43|| mahapunya mudavasa mahasampatpradayini | manipuraikanilaya
    madhurupa mahotkata || 44|| mahasukshma mahashanta mahashantipradayini | munistuta mohahantri madhavi
    madhavapriya || 45|| ma mahadevasamstutya mahishiganapujita | mrishtannada ca mahendri mahendrapadadayini
    || 46|| matirmatiprada medha martyalokanivasini | mukhya mahanivasa ca mahabhagyajanashrita || 47||
    mahiḻa mahima mrityuhari medhapradayini | medhya mahavegavati mahamokshaphalaprada || 48|| mahaprabhabha
    mahati mahadevapriyamkari | mahaposha maharddhishca muktaharavibhushana || 49|| manikyabhushana mantra
    mukhyacandrardhashekhara | manorupa manahshuddhih manahshuddhipradayini || 50|| mahakarunyasampurna
    manonamanavandita | mahapatakajalaghni muktida muktabhushana || 51|| manonmani mahasthula mahakratuphalaprada
    | mahapunyaphalaprapya mayatripuranashini || 52|| mahanasa mahamedha mahamoda maheshvari | maladhari
    mahopaya mahatirthaphalaprada || 53|| mahamangaḻasampurna mahadaridryanashini | mahamakha mahamegha
    mahakaḻi mahapriya || 54|| mahabhusha mahadeha maharajni mudalaya | bhurida bhagyada bhogya bhogyada
    bhogadayini || 55|| bhavani bhutida bhutih bhumirbhumisunayika | bhutadhatri bhayahari bhaktasarasvataprada
    || 56|| bhuktirbhuktiprada bheki bhaktirbhaktipradayini | bhaktasayujyada bhaktasvargada bhaktarajyada
    || 57|| bhagirathi bhavaradhya bhagyasajjanapujita | bhavastutya bhanumati bhavasagaratarani || 58||
    bhutirbhusha ca bhuteshi bhalalocanapujita | bhuta bhavya bhavishya ca bhavavidya bhavatmika || 59||
    badhapaharini bandhurupa bhuvanapujita | bhavaghni bhaktilabhya ca bhaktarakshanatatpara || 60|| bhaktartishamani
    bhagya bhogadanakritodyama | bhujangabhushana bhima bhimakshi bhimarupini || 61|| bhavini bhratrirupa
    ca bharati bhavanayika | bhasha bhashavati bhishma bhairavi bhairavapriya || 62|| bhutirbhasitasarvangi
    bhutida bhutinayika | bhasvati bhagamala ca bhikshadanakritodyama || 63|| bhikshurupa bhaktikari bhaktalakshmipradayini
    | bhrantighna bhrantirupa ca bhutida bhutikarini || 64|| bhikshaniya bhikshumata bhagyavaddrishtigocara
    | bhogavati bhogarupa bhogamokshaphalaprada || 65|| bhogashranta bhagyavati bhaktaghaughavinashini
    | brahmi brahmasvarupa ca brihati brahmavallabha || 66|| brahmada brahmamata ca brahmani brahmadayini
    | brahmeshi brahmasamstutya brahmavedya budhapriya || 67|| balendushekhara bala balipujakarapriya
    | balada bindurupa ca balasuryasamaprabha || 68|| brahmarupa brahmamayi bradhnamandalamadhyaga | brahmani
    buddhida buddhirbuddhirupa budheshvari || 69|| bandhakshayakari badhanashani bandhurupini | bindvalaya
    bindubhusha bindunadasamanvita || 70|| bijarupa bijamata brahmanya brahmakarini | bahurupa balavati
    brahmaja brahmacarini || 71|| brahmastutya brahmavidya brahmandadhipavallabha | brahmeshavishnurupa
    ca brahmavishnvishasamsthita || 72|| buddhirupa budheshani bandhi bandhavimocani | akshamalaksharakaraksharaksharaphalaprada
    || 73|| anantanandasukhadanantacandranibhanana | anantamahimaghoranantagambhirasammita || 74|| adrishtadrishtadanantadrishtabhagyaphalaprada
    | arundhatyavyayinathanekasadgunasamyuta || 75|| anekabhushanadrishyanekalekhanishevita | anantanantasukhadaghoraghorasvarupini
    || 76|| asheshadevatarupamritarupamriteshvari | anavadyanekahastanekamanikyabhushana || 77|| anekavighnasamhartri
    hyanekabharananvita | avidyajnanasamhartri hyavidyajalanashini || 78|| abhirupanavadyangi hyapratarkyagatiprada
    | akaḻamkarupini ca hyanugrahaparayana || 79|| ambarasthambaramayambaramalambujekshana | ambikabjakarabjasthamshumatyamshushatanvita
    || 80|| ambujanavarakhandambujasanamahapriya | ajaramarasamsevyajarasevitapadyuga || 81|| atularthapradarthaikyatyudaratvabhayanvita
    | anathavatsalanantapriyanantepsitaprada || 82|| ambujakshyamburupambujatodbhavamahapriya | akhandatvamarastutyamaranayakapujita
    || 83|| ajeyatvajasamkashajnananashinyabhishtada | aktaghanena castreshi hyalakshminashini tatha ||
    84|| anantasaranantashriranantavidhipujita | abhishtamartyasampujya hyastodayavivarjita || 85|| astikasvantanilayastrarupastravati
    tatha | askhalatyaskhaladrupaskhaladvidyapradayini || 86|| askhalatsiddhidanandambujatamaranayika
    | ameyasheshapapaghnyakshayasarasvataprada || 87|| jaya jayanti jayada janmakarmavivarjita | jagatpriya
    jaganmata jagadishvaravallabha || 88|| jatirjaya jitamitra japya japanakarini | jivani jivanilaya
    jivakhya jivadharini || 89|| jahnavi jya japavati jatirupa jayaprada | janardanapriyakari joshaniya
    jagatsthita || 90|| jagajjyeshtha jaganmaya jivanatranakarini | jivatulatika jivajanmi janmanibarhani
    || 91|| jadyavidhvamsanakari jagadyonirjayatmika | jagadanandajanani jambushca jalajekshana || 92||
    jayanti jangapugaghni janitajnanavigraha | jata jatavati japya japakartripriyamkari || 93|| japakritpapasamhartri
    japakritphaladayini | japapushpasamaprakhya japakusumadharini || 94|| janani janmarahita jyotirvrityabhidayini
    | jatajutanacandrardha jagatsrishtikari tatha || 95|| jagattranakari jadyadhvamsakartri jayeshvari
    | jagadbija jayavasa janmabhurjanmanashini || 96|| janmantyarahita jaitri jagadyonirjapatmika | jayalakshanasampurna
    jayadanakritodyama || 97|| jambharadyadisamstutya jambhariphaladayini | jagattrayahita jyeshtha jagattrayavashamkari
    || 98|| jagattrayamba jagati jvala jvalitalocana | jvalini jvalanabhasa jvalanti jvalanatmika || 99||
    jitaratisurastutya jitakrodha jitendriya | jaramaranashunya ca janitri janmanashini || 100|| jalajabha
    jalamayi jalajasanavallabha | jalajastha japaradhya janamangaḻakarini || 101|| kamini kamarupa ca
    kamya kamapradayini | kamauḻi kamada kartri kratukarmaphalaprada || 102|| kritaghnaghni kriyarupa
    karyakaranarupini | kanjakshi karunarupa kevalamarasevita || 103|| kalyanakarini kanta kantida kantirupini
    | kamala kamalavasa kamalotpalamalini || 104|| kumudvati ca kalyani kantih kameshavallabha | kameshvari
    kamalini kamada kamabandhini || 105|| kamadhenuh kancanakshi kancanabha kaḻanidhih | kriya kirtikari
    kirtih kratushreshtha kriteshvari || 106|| kratusarvakriyastutya kratukritpriyakarini | kleshanashakari
    kartri karmada karmabandhini || 107|| karmabandhahari krishta klamaghni kanjalocana | kandarpajanani
    kanta karuna karunavati || 108|| klimkarini kripakara kripasindhuh kripavati | karunardra kirtikari
    kalmashaghni kriyakari || 109|| kriyashaktih kamarupa kamalotpalagandhini | kaḻa kaḻavati kurmi kutastha
    kanjasamsthita || 110|| kaḻika kalmashaghni ca kamaniyajatanvita | karapadma karabhishtaprada kratuphalaprada
    || 111|| kaushiki koshada kavya kartri kosheshvari krisha | kurmayana kalpalata kalakutavinashini
    || 112|| kalpodyanavati kalpavanastha kalpakarini | kadambakusumabhasa kadambakusumapriya || 113||
    kadambodyanamadhyastha kirtida kirtibhushana | kulamata kulavasa kulacarapriyamkari || 114|| kulanatha
    kamakaḻa kaḻanatha kaḻeshvari | kundamandarapushpabha kapardasthitacandrika || 115|| kavitvada kavyamata
    kavimata kaḻaprada | taruni tarunitata taradhipasamanana || 116|| triptistriptiprada tarkya tapani
    tapini tatha | tarpani tirtharupa ca tridasha tridasheshvari || 117|| tridiveshi trijanani trimata
    tryambakeshvari | tripura tripureshani tryambaka tripurambika || 118|| tripurashristrayirupa trayivedya
    trayishvari | trayyantavedini tamra tapatritayaharini || 119|| tamalasadrishi trata tarunadityasannibha
    | trailokyavyapini tripta triptikrittatvarupini || 120|| turya trailokyasamstutya triguna triguneshvari
    | tripuraghni trimata ca tryambaka trigunanvita || 121|| trishnacchedakari tripta tikshna tikshnasvarupini
    | tula tuladirahita tattadbrahmasvarupini || 122|| tranakartri tripapaghni tripada tridashanvita |
    tathya trishaktistripada turya trailokyasundari || 123|| tejaskari trimurtyadya tejorupa tridhamata
    | tricakrakartri tribhaga turyatitaphalaprada || 124|| tejasvini tapahari tapopaplavanashini | tejogarbha
    tapahsara tripuraripriyamkari || 125|| tanvi tapasasamtushta tapanangajabhitinut | trilocana trimarga
    ca tritiya tridashastuta || 126|| trisundari tripathaga turiyapadadayini | shubha shubhavati shanta
    shantida shubhadayini || 127|| shitaḻa shulini shita shrimati ca shubhanvita | yogasiddhiprada yogya
    yajnenaparipurita || 128|| yajya yajnamayi yakshi yakshini yakshivallabha | yajnapriya yajnapujya
    yajnatushta yamastuta || 129|| yaminiyaprabha yamya yajaniya yashaskari | yajnakartri yajnarupa yashoda
    yajnasamstuta || 130|| yajneshi yajnaphalada yogayoniryajustuta | yamisevya yamaradhya yamipujya yamishvari
    || 131|| yogini yogarupa ca yogakartripriyamkari | yogayukta yogamayi yogayogishvarambika || 132||
    yogajnanamayi yoniryamadyashtangayogata | yantritaghaughasamhara yamalokanivarini || 133|| yashtivyashtishasamstutya
    yamadyashtangayogayuk | yogishvari yogamata yogasiddha ca yogada || 134|| yogarudha yogamayi yogarupa
    yaviyasi | yantrarupa ca yantrastha yantrapujya ca yantrita || 135|| yugakartri yugamayi yugadharmavivarjita
    | yamuna yamini yamya yamunajalamadhyaga || 136|| yatayataprashamani yatananannikrintani | yogavasa
    yogivandya yattacchabdasvarupini || 137|| yogakshemamayi yantra yavadaksharamatrika | yavatpadamayi
    yavacchabdarupa yatheshvari || 138|| yattadiya yakshavandya yadvidya yatisamstuta | yavadvidyamayi
    yavadvidyavrindasuvandita || 139|| yogihritpadmanilaya yogivaryapriyamkari | yogivandya yogimata yogishaphaladayini
    || 140|| yakshavandya yakshapujya yaksharajasupujita | yajnarupa yajnatushta yayajukasvarupini ||
    141|| yantraradhya yantramadhya yantrakartripriyamkari | yantrarudha yantrapujya yogidhyanaparayana
    || 142|| yajaniya yamastutya yogayukta yashaskari | yogabaddha yatistutya yogajna yoganayaki || 143||
    yogijnanaprada yakshi yamabadhavinashini | yogikamyapradatri ca yogimokshapradayini || 144|| iti namnam
    sarasvatyah sahasram samudiritam | mantratmakam mahagopyam mahasarasvatapradam || 1|| yah pathecchrinuyadbhaktya
    trikalam sadhakah puman | sarvavidyanidhih sakshat sa eva bhavati dhruvam || 2|| labhate sampadah
    sarvah putrapautradisamyutah | muko'pi sarvavidyasu caturmukha ivaparah || 3|| bhutva prapnoti sannidhyam
    ante dhaturmunishvara | sarvamantramayam sarvavidyamanaphalapradam || 4|| mahakavitvadam pumsam mahasiddhipradayakam
    | kasmaicinna pradatavyam pranaih kanthagatairapi || 5|| maharahasyam satatam vaninamasahasrakam |
    susiddhamasmadadinam stotram te samudiritam || 6|| || iti shriskandapuranantargata sanatkumara samhitayam
    narada sanatkumara samvade sarasvatisahasranamastotram sampurnam ||
  devanagari: ृणु यत्नेन नारद । सावधानमना भूत्वा क्षणं शुद्धो मुनीश्वरः ॥ १४॥ अथ सहस्रनामस्तोत्रम् । ॐ
    वाग्वाणी वरदा वन्द्या वरारोहा वरप्रदा । वृत्तिर्वागीश्वरी वार्ता वरा वागीशवल्लभा ॥ १॥ विश्वेश्वरी
    विश्ववन्द्या विश्वेशप्रियकारिणी । वाग्वादिनी च वाग्देवी वृद्धिदा वृद्धिकारिणी ॥ २॥ वृद्धिर्वृद्धा
    विषघ्नी च वृष्टिर्वृष्टिप्रदायिनी । विश्वाराध्या विश्वमाता विश्वधात्री विनायका ॥ ३॥ विश्वशक्तिर्विश्वसारा
    विश्वा विश्वविभावरी । वेदान्तवेदिनी वेद्या वित्ता वेदत्रयात्मिका ॥ ४॥ वेदज्ञा वेदजननी विश्वा विश्वविभावरी
    । वरेण्या वाङ्मयी वृद्धा विशिष्टप्रियकारिणी ॥ ५॥ विश्वतोवदना व्याप्ता व्यापिनी व्यापकात्मिका । व्याळघ्नी
    व्याळभूषांगी विरजा वेदनायिका ॥ ६॥ वेदवेदान्तसंवेद्या वेदान्तज्ञानरूपिणी । विभावरी च विक्रान्ता विश्वामित्रा
    विधिप्रिया ॥ ७॥ वरिष्ठा विप्रकृष्टा च विप्रवर्यप्रपूजिता । वेदरूपा वेदमयी वेदमूर्तिश्च वल्लभा ॥ ८॥
    गौरी गुणवती गोप्या गन्धर्वनगरप्रिया । गुणमाता गुहान्तस्था गुरुरूपा गुरुप्रिया ॥ ९॥ गिरिविद्या गानतुष्टा
    गायकप्रियकारिणी । गायत्री गिरिशाराध्या गीर्गिरीशप्रियंकरी ॥ १०॥ गिरिज्ञा ज्ञानविद्या च गिरिरूपा गिरीश्वरी
    । गीर्माता गणसंस्तुत्या गणनीयगुणान्विता ॥ ११॥ गूढरूपा गुहा गोप्या गोरूपा गौर्गुणात्मिका । गुर्वी गुर्वम्बिका
    गुह्या गेयजा गृहनाशिनी ॥ १२॥ गृहिणी गृहदोषघ्नी गवघ्नी गुरुवत्सला । गृहात्मिका गृहाराध्या गृहबाधाविनाशिनी
    ॥ १३॥ गङ्गा गिरिसुता गम्या गजयाना गुहस्तुता । गरुडासनसंसेव्या गोमती गुणशालिनी ॥ १४॥ शारदा शाश्वती
    शैवी शांकरी शंकरात्मिका । श्रीः शर्वाणी शतघ्नी च शरच्चन्द्रनिभानना ॥ १५॥ शर्मिष्ठा शमनघ्नी च शतसाहस्ररूपिणी
    । शिवा शम्भुप्रिया श्रद्धा श्रुतिरूपा श्रुतिप्रिया ॥ १६॥ शुचिष्मती शर्मकरी शुद्धिदा शुद्धिरूपिणी ।
    शिवा शिवंकरी शुद्धा शिवाराध्या शिवात्मिका ॥ १७॥ श्रीमती श्रीमयी श्राव्या श्रुतिः श्रवणगोचरा । शान्तिः
    शान्तिकरी शान्ता शान्ताचारप्रियंकरी ॥ १८॥ शीललभ्या शीलवती श्रीमाता शुभकारिणी । शुभवाणी शुद्धविद्या
    शुद्धचित्तप्रपूजिता ॥ १९॥ श्रीकरी श्रुतपापघ्नी शुभाक्षी शुचिवल्लभा । शिवेतरघ्नी शबरी श्रवणीयगुणान्विता
    ॥ २०॥ शारी शिरीषपुष्पाभा शमनिष्ठा शमात्मिका । शमान्विता शमाराध्या शितिकण्ठप्रपूजिता ॥ २१॥ शुद्धिः
    शुद्धिकरी श्रेष्ठा श्रुतानन्ता शुभावहा । सरस्वती च सर्वज्ञा सर्वसिद्धिप्रदायिनी ॥ २२॥ सरस्वती च सावित्री
    संध्या सर्वेप्सितप्रदा । सर्वार्तिघ्नी सर्वमयी सर्वविद्याप्रदायिनी ॥ २३॥ सर्वेश्वरी सर्वपुण्या सर्गस्थित्यन्तकारिणी
    । सर्वाराध्या सर्वमाता सर्वदेवनिषेविता ॥ २४॥ सर्वैश्वर्यप्रदा सत्या सती सत्वगुणाश्रया । स्वरक्रमपदाकारा
    सर्वदोषनिषूदिनी ॥ २५॥ सहस्राक्षी सहस्रास्या सहस्रपदसंयुता । सहस्रहस्ता साहस्रगुणालंकृतविग्रहा ॥ २६॥
    सहस्रशीर्षा सद्रूपा स्वधा स्वाहा सुधामयी । षड्ग्रन्थिभेदिनी सेव्या सर्वलोकैकपूजिता ॥ २७॥ स्तुत्या
    स्तुतिमयी साध्या सवितृप्रियकारिणी । संशयच्छेदिनी सांख्यवेद्या संख्या सदीश्वरी ॥ २८॥ सिद्धिदा सिद्धसम्पूज्या
    सर्वसिद्धिप्रदायिनी । सर्वज्ञा सर्वशक्तिश्च सर्वसम्पत्प्रदायिनी ॥ २९॥ सर्वाशुभघ्नी सुखदा सुखा संवित्स्वरूपिणी
    । सर्वसम्भीषणी सर्वजगत्सम्मोहिनी तथा ॥ ३०॥ सर्वप्रियंकरी सर्वशुभदा सर्वमङ्गळा । सर्वमन्त्रमयी सर्वतीर्थपुण्यफलप्रदा
    ॥ ३१॥ सर्वपुण्यमयी सर्वव्याधिघ्नी सर्वकामदा । सर्वविघ्नहरी सर्ववन्दिता सर्वमङ्गळा ॥ ३२॥ सर्वमन्त्रकरी
    सर्वलक्ष्मीः सर्वगुणान्विता । सर्वानन्दमयी सर्वज्ञानदा सत्यनायिका ॥ ३३॥ सर्वज्ञानमयी सर्वराज्यदा सर्वमुक्तिदा
    । सुप्रभा सर्वदा सर्वा सर्वलोकवशंकरी ॥ ३४॥ सुभगा सुन्दरी सिद्धा सिद्धाम्बा सिद्धमातृका । सिद्धमाता
    सिद्धविद्या सिद्धेशी सिद्धरूपिणी ॥ ३५॥ सुरूपिणी सुखमयी सेवकप्रियकारिणी । स्वामिनी सर्वदा सेव्या स्थूलसूक्ष्मापराम्बिका
    ॥ ३६॥ साररूपा सरोरूपा सत्यभूता समाश्रया । सितासिता सरोजाक्षी सरोजासनवल्लभा ॥ ३७॥ सरोरुहाभा सर्वाङ्गी
    सुरेन्द्रादिप्रपूजिता । महादेवी महेशानी महासारस्वतप्रदा ॥ ३८॥ महासरस्वती मुक्ता मुक्तिदा मलनाशिनी
    । महेश्वरी महानन्दा महामन्त्रमयी मही ॥ ३९॥ महालक्ष्मीर्महाविद्या माता मन्दरवासिनी । मन्त्रगम्या मन्त्रमाता
    महामन्त्रफलप्रदा ॥ ४०॥ महामुक्तिर्महानित्या महासिद्धिप्रदायिनी । महासिद्धा महामाता महदाकारसंयुता ॥
    ४१॥ महा महेश्वरी मूर्तिर्मोक्षदा मणिभूषणा । मेनका मानिनी मान्या मृत्युघ्नी मेरुरूपिणी ॥ ४२॥ मदिराक्षी
    मदावासा मखरूपा मखेश्वरी । महामोहा महामाया मातॄणां मूर्ध्निसंस्थिता ॥ ४३॥ महापुण्या मुदावासा महासम्पत्प्रदायिनी
    । मणिपूरैकनिलया मधुरूपा महोत्कटा ॥ ४४॥ महासूक्ष्मा महाशान्ता महाशान्तिप्रदायिनी । मुनिस्तुता मोहहन्त्री
    माधवी माधवप्रिया ॥ ४५॥ मा महादेवसंस्तुत्या महिषीगणपूजिता । मृष्टान्नदा च माहेन्द्री महेन्द्रपददायिनी
    ॥ ४६॥ मतिर्मतिप्रदा मेधा मर्त्यलोकनिवासिनी । मुख्या महानिवासा च महाभाग्यजनाश्रिता ॥ ४७॥ महिळा महिमा
    मृत्युहारी मेधाप्रदायिनी । मेध्या महावेगवती महामोक्षफलप्रदा ॥ ४८॥ महाप्रभाभा महती महादेवप्रियंकरी
    । महापोषा महर्द्धिश्च मुक्ताहारविभूषणा ॥ ४९॥ माणिक्यभूषणा मन्त्रा मुख्यचन्द्रार्धशेखरा । मनोरूपा मनःशुद्धिः
    मनःशुद्धिप्रदायिनी ॥ ५०॥ महाकारुण्यसम्पूर्णा मनोनमनवन्दिता । महापातकजालघ्नी मुक्तिदा मुक्तभूषणा ॥
    ५१॥ मनोन्मनी महास्थूला महाक्रतुफलप्रदा । महापुण्यफलप्राप्या मायात्रिपुरनाशिनी ॥ ५२॥ महानसा महामेधा
    महामोदा महेश्वरी । मालाधरी महोपाया महातीर्थफलप्रदा ॥ ५३॥ महामङ्गळसम्पूर्णा महादारिद्र्यनाशिनी । महामखा
    महामेघा महाकाळी महाप्रिया ॥ ५४॥ महाभूषा महादेहा महाराज्ञी मुदालया । भूरिदा भाग्यदा भोग्या भोग्यदा
    भोगदायिनी ॥ ५५॥ भवानी भूतिदा भूतिः भूमिर्भूमिसुनायिका । भूतधात्री भयहरी भक्तसारस्वतप्रदा ॥ ५६॥ भुक्तिर्भुक्तिप्रदा
    भेकी भक्तिर्भक्तिप्रदायिनी । भक्तसायुज्यदा भक्तस्वर्गदा भक्तराज्यदा ॥ ५७॥ भागीरथी भवाराध्या भाग्यासज्जनपूजिता
    । भवस्तुत्या भानुमती भवसागरतारणी ॥ ५८॥ भूतिर्भूषा च भूतेशी भाललोचनपूजिता । भूता भव्या भविष्या च भवविद्या
    भवात्मिका ॥ ५९॥ बाधापहारिणी बन्धुरूपा भुवनपूजिता । भवघ्नी भक्तिलभ्या च भक्तरक्षणतत्परा ॥ ६०॥ भक्तार्तिशमनी
    भाग्या भोगदानकृतोद्यमा । भुजङ्गभूषणा भीमा भीमाक्षी भीमरूपिणी ॥ ६१॥ भाविनी भ्रातृरूपा च भारती भवनायिका
    । भाषा भाषावती भीष्मा भैरवी भैरवप्रिया ॥ ६२॥ भूतिर्भासितसर्वाङ्गी भूतिदा भूतिनायिका । भास्वती भगमाला
    च भिक्षादानकृतोद्यमा ॥ ६३॥ भिक्षुरूपा भक्तिकरी भक्तलक्ष्मीप्रदायिनी । भ्रान्तिघ्ना भ्रान्तिरूपा च
    भूतिदा भूतिकारिणी ॥ ६४॥ भिक्षणीया भिक्षुमाता भाग्यवद्दृष्टिगोचरा । भोगवती भोगरूपा भोगमोक्षफलप्रदा
    ॥ ६५॥ भोगश्रान्ता भाग्यवती भक्ताघौघविनाशिनी । ब्राह्मी ब्रह्मस्वरूपा च बृहती ब्रह्मवल्लभा ॥ ६६॥ ब्रह्मदा
    ब्रह्ममाता च ब्रह्माणी ब्रह्मदायिनी । ब्रह्मेशी ब्रह्मसंस्तुत्या ब्रह्मवेद्या बुधप्रिया ॥ ६७॥ बालेन्दुशेखरा
    बाला बलिपूजाकरप्रिया । बलदा बिन्दुरूपा च बालसूर्यसमप्रभा ॥ ६८॥ ब्रह्मरूपा ब्रह्ममयी ब्रध्नमण्डलमध्यगा
    । ब्रह्माणी बुद्धिदा बुद्धिर्बुद्धिरूपा बुधेश्वरी ॥ ६९॥ बन्धक्षयकरी बाधनाशनी बन्धुरूपिणी । बिन्द्वालया
    बिन्दुभूषा बिन्दुनादसमन्विता ॥ ७०॥ बीजरूपा बीजमाता ब्रह्मण्या ब्रह्मकारिणी । बहुरूपा बलवती ब्रह्मजा
    ब्रह्मचारिणी ॥ ७१॥ ब्रह्मस्तुत्या ब्रह्मविद्या ब्रह्माण्डाधिपवल्लभा । ब्रह्मेशविष्णुरूपा च ब्रह्मविष्ण्वीशसंस्थिता
    ॥ ७२॥ बुद्धिरूपा बुधेशानी बन्धी बन्धविमोचनी । अक्षमालाक्षराकाराक्षराक्षरफलप्रदा ॥ ७३॥ अनन्तानन्दसुखदानन्तचन्द्रनिभानना
    । अनन्तमहिमाघोरानन्तगम्भीरसम्मिता ॥ ७४॥ अदृष्टादृष्टदानन्तादृष्टभाग्यफलप्रदा । अरुन्धत्यव्ययीनाथानेकसद्गुणसंयुता
    ॥ ७५॥ अनेकभूषणादृश्यानेकलेखनिषेविता । अनन्तानन्तसुखदाघोराघोरस्वरूपिणी ॥ ७६॥ अशेषदेवतारूपामृतरूपामृतेश्वरी
    । अनवद्यानेकहस्तानेकमाणिक्यभूषणा ॥ ७७॥ अनेकविघ्नसंहर्त्री ह्यनेकाभरणान्विता । अविद्याज्ञानसंहर्त्री
    ह्यविद्याजालनाशिनी ॥ ७८॥ अभिरूपानवद्याङ्गी ह्यप्रतर्क्यगतिप्रदा । अकळंकारूपिणी च ह्यनुग्रहपरायणा ॥
    ७९॥ अम्बरस्थाम्बरमयाम्बरमालाम्बुजेक्षणा । अम्बिकाब्जकराब्जस्थांशुमत्यंशुशतान्विता ॥ ८०॥ अम्बुजानवराखण्डाम्बुजासनमहाप्रिया
    । अजरामरसंसेव्याजरसेवितपद्युगा ॥ ८१॥ अतुलार्थप्रदार्थैक्यात्युदारात्वभयान्विता । अनाथवत्सलानन्तप्रियानन्तेप्सितप्रदा
    ॥ ८२॥ अम्बुजाक्ष्यम्बुरूपाम्बुजातोद्भवमहाप्रिया । अखण्डात्वमरस्तुत्यामरनायकपूजिता ॥ ८३॥ अजेयात्वजसंकाशाज्ञाननाशिन्यभीष्टदा
    । अक्ताघनेना चास्त्रेशी ह्यलक्ष्मीनाशिनी तथा ॥ ८४॥ अनन्तसारानन्तश्रीरनन्तविधिपूजिता । अभीष्टामर्त्यसम्पूज्या
    ह्यस्तोदयविवर्जिता ॥ ८५॥ आस्तिकस्वान्तनिलयास्त्ररूपास्त्रवती तथा । अस्खलत्यस्खलद्रूपास्खलद्विद्याप्रदायिनी
    ॥ ८६॥ अस्खलत्सिद्धिदानन्दाम्बुजातामरनायिका । अमेयाशेषपापघ्न्यक्षयसारस्वतप्रदा ॥ ८७॥ जया जयन्ती जयदा
    जन्मकर्मविवर्जिता । जगत्प्रिया जगन्माता जगदीश्वरवल्लभा ॥ ८८॥ जातिर्जया जितामित्रा जप्या जपनकारिणी
    । जीवनी जीवनिलया जीवाख्या जीवधारिणी ॥ ८९॥ जाह्नवी ज्या जपवती जातिरूपा जयप्रदा । जनार्दनप्रियकरी जोषनीया
    जगत्स्थिता ॥ ९०॥ जगज्ज्येष्ठा जगन्माया जीवनत्राणकारिणी । जीवातुलतिका जीवजन्मी जन्मनिबर्हणी ॥ ९१॥ जाड्यविध्वंसनकरी
    जगद्योनिर्जयात्मिका । जगदानन्दजननी जम्बूश्च जलजेक्षणा ॥ ९२॥ जयन्ती जङ्गपूगघ्नी जनितज्ञानविग्रहा ।
    जटा जटावती जप्या जपकर्तृप्रियंकरी ॥ ९३॥ जपकृत्पापसंहर्त्री जपकृत्फलदायिनी । जपापुष्पसमप्रख्या जपाकुसुमधारिणी
    ॥ ९४॥ जननी जन्मरहिता ज्योतिर्वृत्यभिदायिनी । जटाजूटनचन्द्रार्धा जगत्सृष्टिकरी तथा ॥ ९५॥ जगत्त्राणकरी
    जाड्यध्वंसकर्त्री जयेश्वरी । जगद्बीजा जयावासा जन्मभूर्जन्मनाशिनी ॥ ९६॥ जन्मान्त्यरहिता जैत्री जगद्योनिर्जपात्मिका
    । जयलक्षणसम्पूर्णा जयदानकृतोद्यमा ॥ ९७॥ जम्भराद्यादिसंस्तुत्या जम्भारिफलदायिनी । जगत्त्रयहिता ज्येष्ठा
    जगत्त्रयवशंकरी ॥ ९८॥ जगत्त्रयाम्बा जगती ज्वाला ज्वालितलोचना । ज्वालिनी ज्वलनाभासा ज्वलन्ती ज्वलनात्मिका
    ॥ ९९॥ जितारातिसुरस्तुत्या जितक्रोधा जितेन्द्रिया । जरामरणशून्या च जनित्री जन्मनाशिनी ॥ १००॥ जलजाभा
    जलमयी जलजासनवल्लभा । जलजस्था जपाराध्या जनमङ्गळकारिणी ॥ १०१॥ कामिनी कामरूपा च काम्या कामप्रदायिनी ।
    कमौळी कामदा कर्त्री क्रतुकर्मफलप्रदा ॥ १०२॥ कृतघ्नघ्नी क्रियारूपा कार्यकारणरूपिणी । कञ्जाक्षी करुणारूपा
    केवलामरसेविता ॥ १०३॥ कल्याणकारिणी कान्ता कान्तिदा कान्तिरूपिणी । कमला कमलावासा कमलोत्पलमालिनी ॥ १०४॥
    कुमुद्वती च कल्याणी कान्तिः कामेशवल्लभा । कामेश्वरी कमलिनी कामदा कामबन्धिनी ॥ १०५॥ कामधेनुः काञ्चनाक्षी
    काञ्चनाभा कळानिधिः । क्रिया कीर्तिकरी कीर्तिः क्रतुश्रेष्ठा कृतेश्वरी ॥ १०६॥ क्रतुसर्वक्रियास्तुत्या
    क्रतुकृत्प्रियकारिणी । क्लेशनाशकरी कर्त्री कर्मदा कर्मबन्धिनी ॥ १०७॥ कर्मबन्धहरी कृष्टा क्लमघ्नी कञ्जलोचना
    । कन्दर्पजननी कान्ता करुणा करुणावती ॥ १०८॥ क्लींकारिणी कृपाकारा कृपासिन्धुः कृपावती । करुणार्द्रा
    कीर्तिकरी कल्मषघ्नी क्रियाकरी ॥ १०९॥ क्रियाशक्तिः कामरूपा कमलोत्पलगन्धिनी । कळा कळावती कूर्मी कूटस्था
    कञ्जसंस्थिता ॥ ११०॥ काळिका कल्मषघ्नी च कमनीयजटान्विता । करपद्मा कराभीष्टप्रदा क्रतुफलप्रदा ॥ १११॥
    कौशिकी कोशदा काव्या कर्त्री कोशेश्वरी कृशा । कूर्मयाना कल्पलता कालकूटविनाशिनी ॥ ११२॥ कल्पोद्यानवती
    कल्पवनस्था कल्पकारिणी । कदम्बकुसुमाभासा कदम्बकुसुमप्रिया ॥ ११३॥ कदम्बोद्यानमध्यस्था कीर्तिदा कीर्तिभूषणा
    । कुलमाता कुलावासा कुलाचारप्रियंकरी ॥ ११४॥ कुलानाथा कामकळा कळानाथा कळेश्वरी । कुन्दमन्दारपुष्पाभा
    कपर्दस्थितचन्द्रिका ॥ ११५॥ कवित्वदा काव्यमाता कविमाता कळाप्रदा । तरुणी तरुणीताता ताराधिपसमानना ॥ ११६॥
    तृप्तिस्तृप्तिप्रदा तर्क्या तपनी तापिनी तथा । तर्पणी तीर्थरूपा च त्रिदशा त्रिदशेश्वरी ॥ ११७॥ त्रिदिवेशी
    त्रिजननी त्रिमाता त्र्यम्बकेश्वरी । त्रिपुरा त्रिपुरेशानी त्र्यम्बका त्रिपुराम्बिका ॥ ११८॥ त्रिपुरश्रीस्त्रयीरूपा
    त्रयीवेद्या त्रयीश्वरी । त्रय्यन्तवेदिनी ताम्रा तापत्रितयहारिणी ॥ ११९॥ तमालसदृशी त्राता तरुणादित्यसन्निभा
    । त्रैलोक्यव्यापिनी तृप्ता तृप्तिकृत्तत्वरूपिणी ॥ १२०॥ तुर्या त्रैलोक्यसंस्तुत्या त्रिगुणा त्रिगुणेश्वरी
    । त्रिपुरघ्नी त्रिमाता च त्र्यम्बका त्रिगुणान्विता ॥ १२१॥ तृष्णाच्छेदकरी तृप्ता तीक्ष्णा तीक्ष्णस्वरूपिणी
    । तुला तुलादिरहिता तत्तद्ब्रह्मस्वरूपिणी ॥ १२२॥ त्राणकर्त्री त्रिपापघ्नी त्रिपदा त्रिदशान्विता । तथ्या
    त्रिशक्तिस्त्रिपदा तुर्या त्रैलोक्यसुन्दरी ॥ १२३॥ तेजस्करी त्रिमूर्त्याद्या तेजोरूपा त्रिधामता । त्रिचक्रकर्त्री
    त्रिभगा तुर्यातीतफलप्रदा ॥ १२४॥ तेजस्विनी तापहारी तापोपप्लवनाशिनी । तेजोगर्भा तपःसारा त्रिपुरारिप्रियंकरी
    ॥ १२५॥ तन्वी तापससंतुष्टा तपनाङ्गजभीतिनुत् । त्रिलोचना त्रिमार्गा च तृतीया त्रिदशस्तुता ॥ १२६॥ त्रिसुन्दरी
    त्रिपथगा तुरीयपददायिनी । शुभा शुभावती शान्ता शान्तिदा शुभदायिनी ॥ १२७॥ शीतळा शूलिनी शीता श्रीमती च
    शुभान्विता । योगसिद्धिप्रदा योग्या यज्ञेनपरिपूरिता ॥ १२८॥ यज्या यज्ञमयी यक्षी यक्षिणी यक्षिवल्लभा
    । यज्ञप्रिया यज्ञपूज्या यज्ञतुष्टा यमस्तुता ॥ १२९॥ यामिनीयप्रभा याम्या यजनीया यशस्करी । यज्ञकर्त्री
    यज्ञरूपा यशोदा यज्ञसंस्तुता ॥ १३०॥ यज्ञेशी यज्ञफलदा योगयोनिर्यजुस्तुता । यमिसेव्या यमाराध्या यमिपूज्या
    यमीश्वरी ॥ १३१॥ योगिनी योगरूपा च योगकर्तृप्रियंकरी । योगयुक्ता योगमयी योगयोगीश्वराम्बिका ॥ १३२॥ योगज्ञानमयी
    योनिर्यमाद्यष्टाङ्गयोगता । यन्त्रिताघौघसंहारा यमलोकनिवारिणी ॥ १३३॥ यष्टिव्यष्टीशसंस्तुत्या यमाद्यष्टाङ्गयोगयुक्
    । योगीश्वरी योगमाता योगसिद्धा च योगदा ॥ १३४॥ योगारूढा योगमयी योगरूपा यवीयसी । यन्त्ररूपा च यन्त्रस्था
    यन्त्रपूज्या च यन्त्रिता ॥ १३५॥ युगकर्त्री युगमयी युगधर्मविवर्जिता । यमुना यमिनी याम्या यमुनाजलमध्यगा
    ॥ १३६॥ यातायातप्रशमनी यातनानान्निकृन्तनी । योगावासा योगिवन्द्या यत्तच्छब्दस्वरूपिणी ॥ १३७॥ योगक्षेममयी
    यन्त्रा यावदक्षरमातृका । यावत्पदमयी यावच्छब्दरूपा यथेश्वरी ॥ १३८॥ यत्तदीया यक्षवन्द्या यद्विद्या यतिसंस्तुता
    । यावद्विद्यामयी यावद्विद्यावृन्दसुवन्दिता ॥ १३९॥ योगिहृत्पद्मनिलया योगिवर्यप्रियंकरी । योगिवन्द्या
    योगिमाता योगीशफलदायिनी ॥ १४०॥ यक्षवन्द्या यक्षपूज्या यक्षराजसुपूजिता । यज्ञरूपा यज्ञतुष्टा यायजूकस्वरूपिणी
    ॥ १४१॥ यन्त्राराध्या यन्त्रमध्या यन्त्रकर्तृप्रियंकरी । यन्त्रारूढा यन्त्रपूज्या योगिध्यानपरायणा ॥
    १४२॥ यजनीया यमस्तुत्या योगयुक्ता यशस्करी । योगबद्धा यतिस्तुत्या योगज्ञा योगनायकी ॥ १४३॥ योगिज्ञानप्रदा
    यक्षी यमबाधाविनाशिनी । योगिकाम्यप्रदात्री च योगिमोक्षप्रदायिनी ॥ १४४॥ इति नाम्नां सरस्वत्याः सहस्रं
    समुदीरितम् । मन्त्रात्मकं महागोप्यं महासारस्वतप्रदम् ॥ १॥ यः पठेच्छृणुयाद्भक्त्या त्रिकालं साधकः पुमान्
    । सर्वविद्यानिधिः साक्षात् स एव भवति ध्रुवम् ॥ २॥ लभते संपदः सर्वाः पुत्रपौत्रादिसंयुताः । मूकोऽपि
    सर्वविद्यासु चतुर्मुख इवापरः ॥ ३॥ भूत्वा प्राप्नोति सान्निध्यं अन्ते धातुर्मुनीश्वर । सर्वमन्त्रमयं
    सर्वविद्यामानफलप्रदम् ॥ ४॥ महाकवित्वदं पुंसां महासिद्धिप्रदायकम् । कस्मैचिन्न प्रदातव्यं प्राणैः कण्ठगतैरपि
    ॥ ५॥ महारहस्यं सततं वाणीनामसहस्रकम् । सुसिद्धमस्मदादीनां स्तोत्रं ते समुदीरितम् ॥ ६॥ ॥ इति श्रीस्कान्दपुराणान्तर्गत
    सनत्कुमार संहितायां नारद सनत्कुमार संवादे सरस्वतीसहस्रनामस्तोत्रं सम्पूर्णम् ॥
