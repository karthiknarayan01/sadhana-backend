id: kytb-3-6-pashu-hautram-krishna-yajurveda-taittiriya-brahmana-patha-anjanti-tvamadhvare
category: stotram
name:
  english: KYTB 3.6 Pashu Hautram - Krishna Yajurveda Taittiriya Brahmana Patha - Anjanti Tvamadhvare
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake shashthah prapathakah shri gurubhyo namah
    | harih om || anuvakam yupasamskarah anjanti tvamaddhvare devayantah | vanaspate madhuna daivyena
    | yadurdhvastishtha ddravineha dhattat | yadva kshayo maturasya upasthe || ucchrayasva vanaspate |
    var nprithivya adhi | sumiti miyamanah | varcodha yajnavahase || samiddhasya shrayamanah purasta t
    | brahma vanvano ajaragm suvira mbadhamanah | ucchrayasva mahate saubhagaya || urdhva ushuna utaye
    | tishtha devo na savita | urdhvo vajasya sanita yadanjibhih | vaghadbhi rvihvayamahe || urdhvo nah
    pahyagmhaso ni ketuna | vishvagm samatrina ndaha | kridhi na urdhvanca rathaya jivase | vida deveshu
    no duvah || || jato jayate sudinatve ahna m | samarya a vidathe vardhamanah | punanti dhira apaso
    manisha | devaya vipra udiyarti vaca m || yuva suvasah parivita aga nbhavati jayamanah | ta ndhirasah
    kavaya unnayanti | svadhiyo manasa devayantah || prithupaja amartyah | ghritanirnikh ryajnasya havyavat
    || tagm sabadho yatasrucah | ittha dhiya yajnavantah | acakruragni va~runa uta mitro agne | tvam rvasishthah
    | tve vasu sushananani santu | yuya prayajavishaya maitravarunapraishah hota yakshadagnigm samidha
    sushamidha samiddha ssaganthe vamasya | var shmandiva idaspade vetvajyasya hotaryaja || hota yakshat
    mbhuvanasya gopam | maddhva 'dya devo devebhyo devayana npatho anaktu vetvajyasya hotaryaja || hota
    yaksha nnrigmh pranetram | gobhi prathamayava hiranyaishcandri vetvajyasya hotaryaja || hota yakshadagnimida
    idito devo devagm avaksha dduto havyavadamurah | upemam ndevo devahutimavatu vetvajyasya hotaryaja
    || hota yaksha ssushtarimornamrada asmin yajne vi ca pra ca prathatag ndevebhyah | emenadadya vasavo
    rudra aditya ssadantu priyamindrasyastu vetvajyasya hotaryaja || ddura rishvah kavashyo shshrayantam
    | suprayana asmin mritavridho viyantvajyasya hotaryaja || hota yakshadushasanakta brihati supeshasa
    nrigmh patibhyo yoni nkrinvane | saggsmayamane indrena devaireda vi~tamajyasya hotaryaja || hota yaksha
    ddaivya hotara mandra potara kavi pracetasa | svishtamadyanyah karadisha svabhigurtamanya urja satavasemam
    ndivi deveshu dhattam vi~tamajyasya hotaryaja || hota yakshat tisro devirapasamapastama acchidra stanvatam
    | devebhyo devi rdevamapo viyantvajyasya hotaryaja || hota yakshat macishtumapakagm retodham ya~shodham
    | pururupamakamakar shanagm suposhah poshai rvetvajyasya hotaryaja || hota yaksha mupavasrakshaddhiyo
    joshtaragm shashamannarah | svada 'dya devo devebhyo havya vetvajyasya hotaryaja || hota yakshadagnigg
    ''jyasya svaha medasa stokanag svaha svaha kritinag svaha havyasu ktinam | svaha devagm a 'gnigm hotrajjushana
    agna ajyasya viyantu hotaryaja || priyamindrasyastu vetvajysya hotaryaja rvetvajyasya hotaryaja catvari
    ca nnarashagmsamagnimida idito barhirdura ushasanakta daivya tisrastvashtaram panca vetveko viyantu
    dvirvitameko viyantu dvirvetveko viyantu hotaryaja ya~jyah samiddho adya manusho durone | devo devan
    yajasi jatavedah | a ca vaha mitramaha ndutah kavirasi pracetah || tanunapatpatha ritasya yanan |
    maddhva samanjan thsvadaya sujihva | manmani dhibhiruta yajnamrindhann | devatra ca krinuhyaddhvara
    nnah || narashagmsasya mahimanamesham | upastoshama yajatasya yajnaih || shshucayo dhiyadhamh | svadantu
    deva ubhayani havya || ajuhvana idyo vandyashca | aya ndevanamasi yahva hota yakshishito yajiyan ||
    pracina mbarhih pradisha prithivyah | vastorasya vrijyate agre ahna m | vyu prathate vitaram va~riyah
    | devebhyo aditaye syonam || || vyacasvatirurviya vishrayantam | patibhyo najanaya shshumbhamanah
    | devi rvishvaminvah | devebhyo bhavatha suprayanah || a sushvayanti yajate upake | ushasanakta sadata
    | divye yoshane brihati surukme | adhi shriyagm shukrapisha ndadhane || daivya hotara prathama suvaca
    mmanusho yajaddhyai || || pracodayanta vidatheshu karu | pracina njyotih pradisha dishanta mbharati
    tuyametu | ida manushvadiha cetayanti | tisro devi syonam | sarasvati svapasa ssadantu || ya ime dyavaprithivi
    janitri | rupairapigmsha | tamadya hotarishito yajiyan | deva ntvashtaramiha yakshi vidvan || tmanya
    samanjann | devana mpatha ritutha havigmshi | vanaspatih shamita devo agnih | svadantu havya mmadhuna
    ghritena || sadyo jato vyamimita yajnam | agni purogah | asya hotuh pradishyritasya vaci | svahakritagm
    haviradantu devah || paryagnikaraniya ricah agnir hota no addhvare | vaji san pariniyate | devo deveshu
    yajniyah || pari trivishtyaddhvaram | yatyagni rathiriva | a deveshu prayo dadhat || pari vajapatih
    kavih | agnir havya nyakramit | dadha maitravarunapraishah ajaidagnih | asanadvaja nni | devo devebhyo
    havya hinvanah | dhenabhih kalpamanah | yajnasyayuh pratirann | upa preshya hotah | havya devebhyah
    || hoturadhrigupraishah daivya shshamitara uta manushya arabhaddhvam | upa nayata meddhya durah |
    ashasana medhapatibhya m | prasma agni mbharata | strinita barhih | anvena mmata manyatam | anu pita
    | anu bhrata sagarbhyah | anu sakha sayu thyah || udicinagm asya pado nidhattat || ncakshurgamayatat
    | vata m | antarikshamasu m | prithivigm shariram | ekadha 'sya tvacamacchyatat | pura nabhya apishaso
    vapamutkhidatat | antarevoshmanam va~rayatat | shyenamasya vakshah krinutat | prashasa bahu || | acchidre
    shroni | kavashoru srekaparna | shadvigmshatirasya vankrayah | ta anushthyoccyavayatat | gatra nkrinutat
    | uvaddhyagoha nkhanatat | asna raksha ssagmsrijatat | vanishthumasya ma ravishta || mmanyamanah ||
    nedvastoke tanaye | ravita ravacchamitarah | addhrigo shamiddhvam | sushami shamiddhvam | shamiddhva
    maddhrigo || addhrigushcapapashca | ubhau devanagm shamitarau mmaitravarunanuvacanam jushasva saprathastamam
    | vaco devaphsarastamam | havya juhvana asani || ima nno yajnamamriteshu dhehi | ima havya jatavedo
    jushasva | stokanamagne medaso ghritasya | hotah prashana prathamo nishadya || ghritavantah pavaka
    te | stokasshcotanti medasah | svadharma m || tubhyagg stoka ghritashcutah | agne vipraya santya |
    rishi ssamiddhyase | yajnasya pravita bhava || tubhyagg shcotantyaddhrigo shacivah | stokaso agne
    medaso ghritasya | kavishasto brihata bhanuna | havya jushasva medhira || ojishtha nte maddhyato meda
    udbhritam | prate vaya ndadamahe | shcotanti te vaso stoka adhi tvaci | prati tandevasho vihi || vapa
    purodashasvishtakrita mpuronuvakyah praishashca a vritrahana vritrahabhi nnamobhiragne arvak | yuvagm
    radhobhirakavebhirindra | agne asme bhavatamuttamebhih || hota yakshadindragni | chagasya vapaya medasah
    | jushetagm havih | hotaryaja || vi hyakhya nmanasa vasya icchann | indra gni jnasa uta va sajatan
    || || nanya yuvatpramatirasti mahya va~jayantimataksham || hota yakshadindragni | purodashasya jushetagm
    havih | hotaryaja || tvamidate ajira ndutyaya | havishmanta nmanushasah | yasya devairasado barhiragne
    | aha nyasmai sudina bhavantu || hota yakshadagnim | purodashasya jushatagm havih | hotaryaja || teshameva
    yajyah girbhirviprah pramatimicchamanah | i rayim gni vritrahana suvajra | prano navyebhistirata dma
    rashmigmriti nadhamanah | pitrinagm shaktiranu yacchamanah | indragnibhya vri~shano madanti | ta hyadri
    dhishanaya upasthe || agnigm suditigm sudrisha ngrinantah | namasyamastvedya ndutamaratigm havyavaha
    manotasuktam tvagg hyagne prathamo manota | asya dhiyo abhavo dasma hota rdushtaritu | saho vishvasmai
    sahase sahaddhyai || adha hota nyasido yajiyan | idaspada ishayannidya ndevayantah | maho raye citayanto
    anu gmann || vriteva yanta njagrivagmso anu gmann || vi~shvaha didivagmsa ndevasya namasa viyantah
    | shravasyava shshrava apannamriktam | namani ci ddadhire yajniyani | bhadraya nte ranayanta sandrishtau
    || tvam va~rdhanti kshitayah prithivyam | tvagm raya ubhayaso jananam | tva ntrata tarane cetyo bhuh
    | pita mata sadami ssa priyo vikshvagnih | hota mandro nishasada yajiyan | ta ndama a didivagmsa m
    | upajnubadho namasa sadema || ta ntva vayagm sudhiyo navyamagne | sumnayava imahe devayantah | tvam
    vi~sho anayo didyanah | divo agne brihata rocanena || visha vi~shpatigm shashvatinam | nitoshanam
    || pretishanimishayanta mpavakam | rajantamagnim ya~jatagm rayinam || so agna ije shashame ca martah
    | yasta anat thsamidha havyadatim | ya ahuti mpari veda namobhih | vishvethsa vama dadhate tvotah
    || asma u te mahi mahe vidhema | namobhiragne samidhota havyaih | vedi suno sahaso girbhirukthaih
    | a te bhadrayagm sumatau yatema || || a yastatantha rodasi vi bhasa | shravobhishca shravasyastarutrah
    | brihadbhi ssthavirebhirasme | revadbhiragne vitaram vi~bhahi || nrivadvaso sadamiddhe hyasme | bhuri
    tokaya tanayaya pashvah | purvirisho brihatirare aghah | asme bhadra sau shravasani santu || purunyagne
    purudha tvaya | vasuni rajan vasutate ashyam | puruni hi tve puruvara santi | agne vasu vidhate rajani
    tve || jagrivagmso anu gman havirvanaspatisvishtakrita mpuronuvakyah praishashca a bharatagm shikshatam
    va~jrabahu | asmagm indragni avatagm shacibhih | ime nu te rashmaya ssuryasya | yebhih sapitva mpitaro
    na ayann || hota yakshadindragni | chagasya havisha attamadya | maddhyato meda udbhritam | pura dvesho
    bhyah | pura paurusheyya gribhah | ghasta ya~vasaprathamanam | sumatksharanagm shatarudriyanam | agnishvattana
    mpivopavasananam | par shshitamata uthsadatah | angadangadavattanam | karata evendragni | jushetagm
    havih | hotaryaja || devebhyo vanaspate havigmshi | hiranyaparna pradivaste artha drashanaya niyuya
    | ritasya vakshi pathibhi rajishthaih || hota yaksha dvanaspatimabhi hi | pishtatamaya rabhishthaya
    rashanaya shchagasya havishah priya dhamani | yatra vanaspateh priya pathagmsi | yatra devanamajyapana
    mpriya dhamani | yatragner hotuh priya dhamani | tatraita pastutyevopavasrakshat | rabhiyagm samiva
    kritvi || ndevo vanaspatih | jushatagm havih | hotaryaja || piprihi devagm ushato yavishtha | vidvagm
    ritugmr ritupate yajeha | ye daivya ritvijastebhiragne | tvagm hotrinamasyayajishthah || hota yakshadagnigg
    shchagasya havishah priya dhamani | ayadvanaspateh priya pathagmsi | aya mpriya dhamani | yakshadagner
    hotuh priya dhamani | yaksha m | ayajatamejya ishah | krinotu so addhvara jatavedah | jushatagm havih
    | hotaryaja || teshameva yajyah upoha yadvidatham va~jino guh | girbhi micchamanah | arvanto na kashtha
    nnakshamanah | indragni johuvato naraste || vanaspate rashanaya 'bhidhaya | pishtatamaya vayunani
    vidvan | vaha devatra didhisho havigmshi | pra ca dataramamriteshu vocah || agnigg shchagasya havishah
    priya dhamani || priya pathagmsi | aya mpriya dhamani | yakshadagner hotuh priya dhamani | yaksha
    m | ayajatamejya ishah | krinotu so addhvara jatavedah | jushatagm havih | agne yadadya visho addhvarasya
    hotah | pavaka shoce veshtvagm hi yajva | rita yajasi mahina vi ya dbhuh | havya vaha yavishtha ya
    te adya || rvrijyetaktoh prabhri raya barhishmato madema vasuvane vasudheyasya vetu yaja || devi rdvarah
    sanghate vidviryamanchithira dhruva devahutau vathsa imenastaruna amimiyat kumaro va navajato maina
    arva renukakatah prinagvasuvane vasudheyasya viyantu yaja || devi ushasa nakta yajne prayatyahvetamapi
    nuna ndaivirvishah prayasishtagm suprite sudhite vasuvane vasudheyasya vitam ya~ja || devi joshtri
    vasudhiti yayoranya 'gha dveshagmsi yuyavada dvasu varyani yajamanaya vasuvane vasudheyasya vitam
    ya~ja || devi urjahuti ishamurjamanya vakshathsagdhigm sapitimanya navena purva ssyama puranena nava
    ntamurjamurjahuti urjayamane adhatam va~suvane vasudheyasya vitam ya~ja || deva daivya hotara neshtara
    potara hataghashagmsa vabharadvasu vasuvane vasudheyasya vitam ya~ja || devistisrastisro devirida
    sarasvati bharati dya thsarasvatimagm rudrai dihaivedaya vasumatya sadhamada mmadema vasuvane vasudheyasya
    viyantu yaja || devo narashagmsa strishirsha shadaksha shshatamidenagm shitiprishtha adadhati sahasrami
    mpravahanti mitravarunedasya hotramar hato brihaspatih stotramashvina ''ddhvaryavam va~suvane vasudheyasya
    vetu yaja || devo vanaspati rvarshaprava ghritanirnig mmaddhyenaprah prithivi dvasuvane vasudheyasya
    vetu yaja || deva mbarhirvaritina nnidhe dhasi pracyutinama ya~shasvadena barhisha shyabhishyama vasuvane
    vasudheyasya vetu yaja || devo agni thsudravina mandrah kavi ''yaji hota hotur hoturayajiyanagne yan
    devanayadyagm apiprerye te hotre amathsata tagm sasanushigm hotra ndivi deveshu yajnamerayemagg svishtakriccagne
    hota rvasuvane vasudheyasya namovake vihi yaja || mbarhih | vasuvane vasudheyasya vetu | devirdvarah
    | vasuvane vasudheyasya viyantu | devi ushasa nakta | vasuvane vasudheyasya vitam | devi joshtri |
    vasuvane vasudheyasya vitam | devi urjahuti | vasuvane vasudheyasya vitam || || deva daivya hotara
    | vasuvane vasudheyasya vitam | devistisra stisro devih | vasuvane vasudheyasya viyantu | devo narashagmsah
    | vasuvane vasudheyasya vetu | devo vanaspatih | vasuvane vasudheyasya vetu | deva mbarhirvaritinam
    | vasuvane vasudheyasya vetu || ssvishtakrit | sudravina mandrah kavih | satyamanma hoturayajiyan
    | agne yandevanaya t | yagm apipreh | ye te hotre amathsata | tagm sasanushigm hotra ngamam | divi
    deveshu yajnamerayemam | svishtakriccagne hota | vasuvane vasudheyasya namovake vihi || suktavakapraishah
    agnimadya hotaramavrinitayam npurodasham baddhna nnindragnibhya nchagagm supastha adya devo vanaspati
    mmedastah prati pacata 'grabhishtamavivridheta mpurodashena tvamadyar ya~jamano bahubhya a sangatebhya
    esha me deveshu vasu varya yakshyata iti ta ya deva deva dananyadustanyasma a ca shasva ca gurasveshitashca
    hotarasi bhadravacyaya preshito manusha ssuktavakaya sukta bruhi || karadeva mashtatrigmshat || harih
    om || || krishna yajurvediya taittiriya brahmane tritiyashtake shashthah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके षष्ठः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं यूपसंस्काराः अ॒ञ्जन्ति॒ त्वाम॑द्ध्व॒रे दे॑व॒यन्तः॑ । वन॑स्पते॒ मधु॑ना॒ दैव्ये॑न । यदू॒र्ध्वस्ति॑ष्ठा॒
    द्द्रवि॑णे॒ह ध॑त्तात् । यद्वा॒ क्षयो॑ मा॒तुर॒स्या उ॒पस्थे ॥ उच्छ्र॑यस्व वनस्पते । वर् न्पृथि॒व्या
    अधि॑ । सुमि॑ती मी॒यमा॑नः । वर्चो॑धा य॒ज्ञवा॑हसे ॥ समि॑द्धस्य॒ श्रय॑माणः पु॒रस्ता त् । ब्रह्म॑ वन्वा॒नो
    अ॒जरग्ं॑ सु॒वीर म्बाध॑मानः । उच्छ्र॑यस्व मह॒ते सौभ॑गाय ॥ ऊ॒र्ध्व ऊ॒षुण॑ ऊ॒तये । तिष्ठा॑ दे॒वो न स॑वि॒ता
    । ऊ॒र्ध्वो वाज॑स्य॒ सनि॑ता॒ यद॒ञ्जिभिः॑ । वा॒घद्भि॑ र्वि॒ह्वया॑महे ॥ ऊ॒र्ध्वो नः॑ पा॒ह्यग्ंह॑सो॒ नि
    के॒तुना । विश्व॒ग्ं॒ सम॒त्रिण॑ न्दह । कृ॒धी न॑ ऊ॒र्ध्वाञ्च॒ रथा॑य जी॒वसे । वि॒दा दे॒वेषु॑ नो॒ दुवः॑
    ॥ ॥ जा॒तो जा॑यते सुदिन॒त्वे अह्ना म् । सम॒र्य आ वि॒दथे॒ वर्ध॑मानः । पु॒नन्ति॒ धीरा॑ अ॒पसो॑ मनी॒षा
    । दे॒व॒या विप्र॒ उदि॑यर्ति॒ वाच म् ॥ युवा॑ सु॒वासाः॒ परि॑वीत॒ आगा न्भवति॒ जाय॑मानः । त न्धीरा॑सः क॒वय॒
    उन्न॑यन्ति । स्वा॒धियो॒ मन॑सा देव॒यन्तः॑ ॥ पृ॒थु॒पाजा॒ अम॑र्त्यः । घृ॒तनि॑र्णि॒ख् र्य॒ज्ञस्य॑ हव्य॒वाट्
    ॥ तग्ं स॒बाधो॑ य॒तस्रु॑चः । इ॒त्था धि॒या य॒ज्ञव॑न्तः । आच॑क्रुर॒ग्नि वँरु॑ण उ॒त मि॒त्रो अ॑ग्ने । त्वां
    र्वसि॑ष्ठाः । त्वे वसु॑ सुषण॒नानि॑ सन्तु । यू॒य प्रयाजविषया मैत्रावरुणप्रैषाः होता॑ यक्षद॒ग्निग्ं
    स॒मिधा॑ सुष॒मिधा॒ समि॑द्ध॒ स्स॑ग॒न्थे वा॒मस्य॑ । वर् ष्म॑न्दि॒व इ॒डस्प॒दे वेत्वाज्य॑स्य॒ होत॒र्यज॑
    ॥ होता॑ यक्ष॒त् म्भुव॑नस्य गो॒पाम् । मद्ध्वा॒ ऽद्य दे॒वो दे॒वेभ्यो॑ देव॒याना न्प॒थो अ॑नक्तु॒ वेत्वाज्य॑स्य॒
    होत॒र्यज॑ ॥ होता॑ यक्ष॒ न्नॄग्ंः प्र॑णेत्रम् । गोभि॑ प्रथम॒यावा॒ हिर॑ण्यैश्च॒न्द्री वेत्वाज्य॑स्य॒
    होत॒र्यज॑ ॥ होता॑ यक्षद॒ग्निमि॒ड ई॑डि॒तो दे॒वो दे॒वाग्ं आव॑क्ष द्दू॒तो ह॑व्य॒वाडमू॑रः । उपे॒मं न्दे॒वो
    दे॒वहू॑तिमवतु॒ वेत्वाज्य॑स्य॒ होत॒र्यज॑ ॥ होता॑ यक्ष स्सु॒ष्टरी॒मोर्ण॑म्रदा अ॒स्मिन् य॒ज्ञे वि च॒
    प्र च॑ प्रथताग् न्दे॒वेभ्यः॑ । एमे॑नद॒द्य वस॑वो रु॒द्रा आ॑दि॒त्या स्स॑दन्तु प्रि॒यमिन्द्र॑स्यास्तु॒
