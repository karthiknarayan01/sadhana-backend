id: gakaradigorakshasahasranamastotra
category: sahasranama
name:
  english: gakaradigorakshasahasranamastotra
  devanagari: गकारादिगोरक्षसहस्रनामस्तोत्र
content:
  english: ringininadabhritah | guptagupto granthabalo grantharthapratipaditah || 79|| ganakapritikrid
    gargadevo gargadisatkritah | gorakshaganakagranyo gorakshavalikrittamah || 80|| granthaparayanaprapyo
    guhyagrantharthadipakah | gaurayogarthatattvajno guruvedanirupitah || 81|| ganaradarcito nityam govindaryasamritipadah
    | govindeshtapriyadata gauraparaparakramah || 82|| govindatma ca gambhiro gihpriyankara eva ca | gudhajatrurgrastashoko
    gunaganyo gunalakah || 83|| granthaprayojako gauramaryado granthaketanah | grantharthadyotako godo
    granthasiddhantabhaskarah || 84|| gayakapravarapreshtho gayakeshtarthadayakah | gayakavadakanartakaryakanandamuktidah
    || 85|| gonkarabijasamshlishto guhyaso'hamshivatmakah | gurushishyarthitarthajno gaurahamso gunavritah
    ||| 86|| gandharvadevasevyanghrirgandharvaparameshvarah | gaurasiddho gunavashyo gauradharmajna eva
    ca || 87|| gudakahrid goparesho giratma gihpriyamvadah | galavarshipriyapadyo goshthamayavidhasmarah
    || 88|| gayatrimantravidvedyo gocarapriyavardhanah | gamako gautamo gata gatiyatharthyayogakrita ||
    89|| gokarnaranyasamranta gokarnashramavanditah | gandharanirbhayaramo gandharakshonipalakah || 90||
    guptarthado gunagamyo granthaprakatapaurushah | gatibhrid gamyamurtishca gunadishivasamshrutah ||
    91|| giragamyo gavamisho girarthartho giramvarah | grihitagunavallilo ganavijnanaparadah|| 92|| gavyapalo
    ganashrisho gosvayambhurganeshtabhuh | gananatho grihanishtho gano gano gamatmakah || 93|| gunagunaganatito
    gunatrayavibhavanah || gotracarapriyo gotro gotranatho gunakarah || 94|| gayamanapriyo glaubhrid gitango
    gitapeshalah | ganasamasamageyo ganadushkritanashanah || 95|| girvanabhashasambhashyo grivagaralasheshabhrit
    | ganarajadhirajashca gatiman ganavan gani || 96|| gunasrig gatidhrig geyo garvavadduhkhakrittamah
    | gunabhrajo ganashreshtho gunakrid gunahrid grihah || 97|| gurujnano gunabhbhodhirguhadhama ganaprabhuh
    | gopyamurtirguhitartho grihitagunavajjagat || 98|| gotrapalakapaleshto gananadajnamanmathah | gopastomapriyanando
    gaurasvadhyayaveditah || 99||| gotrahladakamurtishca gunatattvavivekakrit | govedyo go'rthavid gadyo
    gadyabhashaprabhashanah || 100|| gatormishatkavarshishtho gunashatkapradhanajit | gatakaranakaryashca
    gatasamyatishayakah || 101|| gatasarvavataratvavataribhedakalpanah | guhyapranavacinnado guhasthanasthirasanah
    || 102|| gayatrijapasamsadhyo gayatrimatprapujitah | gayatrimadgunakaro gayatrimatparatmakah || 103||
    gayatrimatsadatushto gayatrimatsadashivah | gayatrimadadhishthata gayatrimatphalatmakah || 104|| gayatrimatsadasevyo
    gayatrimadyashovahah | gayatrimadgahantahstho gayatrimatsukhalayah || 105|| gayantrividushamvarco
    gayatrimadvivardhanah | gavatmavan gavamvagmi ganashatrunivarhanah || 106|| gayatrimanmahaloko gayatrimatprinkarah
    | gayatrimatkulanandi gayatrimaddhurandharah || 107|| gaurisaronijanando gaurishasara ashramah | gaurisarastapahsthayi
    gaurishasara asanah || 108|| gostaniphalabhug gadho gauragatro gavayanah | gogramanirgunagramo gadhanugrahakarakah
    || 109|| guru mohanirakarta gathamnayadivakarah | garagarasamaranta gostaniphalabhojanah || 110||
    guruyogaphalastrashta ca gadhanandamritatmakah | gadhayogantaratma ca gadhayogapuratanah || 111||
    gunatishayavan ganyo gunyo gunaparayanah | gosiddhasadhananatho gudhasatparamarthadah || 112|| gurusadgurunama
    ca gurushaivashivarthadah | guptavadhutashailibhrid guruyogishivatmakah || 113|| gudhasiddhantasamsiddho
    gatakleshatarangakah | gatakhiladhisannatho guhyasvasmarabhutiman || 114|| guhyonkarapratishthano
    guhakanjasthirasanah | gudhadharodayo godha gatakhilakalankakah || 115|| gurvankabhutibhushadhyo gurusho
    gurukhatmakah | guhyatmaparadhama ca guhyashankhamsukharthakrit || 116|| gopyashankhamshirodhayi gadhanissomasauhridah
    | gauramrigajinadharta gurushailipararthavit || 117|| gunashadvaikritatito gaurapaddhatipadukah |
    guhyacidullasanmudro go'japajapashantikrit || 118|| gurudhairyaparashaktirguhadipanavigrahah | gauracinmekhaladhari
    grihyayogasuvastrabhrit || 119|| gatadvaitetarabhaso gadhatanmayakarakah | gatopadhinijanandadigdeshasudridhasanah
    ||| 120|| guhapradeshanilayo guhasakshatprakashakah | gatamrityumahamoho gadhajajavaninatah || 121||
    gadhavasanavallibhug guhatmajnanasarvagah | gadhavartajagadvetta gatotthanamayatmakah || 122|| gatotthadharadharmajno
    gatavishranticinmayah | grihitacinmayakaro grihitapadamuktidah || 123|| gurvajno gaurasiddhendro guhadesada'mritah
    | ganashuddho ganabhijno gatrodvarakaraprabhuh || 124|| gatrasatyo gavesheshto gadhabhokta guhacalah
    | gatavyamohamatsaryo gurujnanaprabodhakah || 125|| gataparamahamohatarangabdhivishoshanah | gatabhirgatadainyashca
