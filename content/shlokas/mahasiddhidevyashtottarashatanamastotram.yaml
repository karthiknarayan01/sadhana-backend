id: mahasiddhidevyashtottarashatanamastotram
category: stotram
name:
  english: mahasiddhidevyashtottarashatanamastotram
  devanagari: महासिद्धिदेव्यष्टोत्तरशतनामस्तोत्रम्
content:
  english: ringaramadhyama madhurasvana | divyabhushanasandoharanjita rinamocini || 9|| parijatagunadhikyapadabja
    paramatmika | supadmaragasankashacarana cintitarthada || 10|| brahmabhavamahasiddhipithastha pankajasana
    | herambanetrakumudacandrika candrabhushana || 11|| sacamarashivavanisavyadakshinavijita | bhaktarakshanadakshinyakataksha
    kamalasana || 12|| ganeshalinganodbhutapulakangi paratpara | lilakalpitabrahmandakotikotisamanvita
    || 13|| vanikotisamayuktakotibrahmanishevita | lakshmikotisamayuktavishnukotiprapujita || 14|| gaurikotisamayuktashambhukotisusevita
    | prabhakotisamayuktakotibhaskaravandita || 15|| bhanukotipratikasha candrakotisushitala | catushshashtikotisiddhinishevitapadambuja
    || 16|| muladharasamutpanna mulabandhavimocini | muladharaikanilaya yogakundalibhedini || 17|| muladhara
    mulabhuta mulaprakritirupini | muladharaganeshanavamabhaganivasini || 18|| mulavidya mularupa mulagranthivibhedini
    | svadhishthanaikanilaya brahmagranthivibhedini || 19|| manipurantarudita vishnugranthivibhedini |
    anahataikanilaya rudragranthivibhedini || 20|| vishuddhisthananilaya jivabhavapranashini | ajnacakrantaralastha
    jnanasiddhipradayini || 21|| brahmarandhraikanilaya brahmabhavapradayini | shatkonashtadalayutashrisiddhiyantramadhyaga
    || 22|| antarmukhajananantaphalada shokanashini | avyajakarunapurapurita vasudharini || 23|| daridryanashini
    lakshmissarvapapapranashini | bhuktisiddhirmuktisiddhissudhamandalamadhyaga || 24|| cintamanissarvasiddhih
    kamalavallabha shiva | siddhalakshmirmokshalakshmirjayalakshmirvaraprada || 25|| ramananda mahalakshmirvibhutirbhaktivardhini
    | ashtottarashatam namnam mahasiddheridam varam || 26|| ajnaya gananathasya ganakena prakirtitam |
    yah pathed ganapo bhaktya pujayedva sunamabhih | dharmamartham ca kamam ca labdhva mokshamavapnuyat
    || 27|| iti mahasiddhidevyashtottarashatanamastotram sampurnam |
  devanagari: ृङ्गारमध्यमा मधुरस्वना । दिव्यभूषणसन्दोहरञ्जिता ऋणमोचिनी ॥ ९॥ पारिजातगुणाधिक्यपदाब्जा परमात्मिका
    । सुपद्मरागसङ्काशचरणा चिन्तितार्थदा ॥ १०॥ ब्रह्मभावमहासिद्धिपीठस्था पङ्कजासना । हेरम्बनेत्रकुमुदचन्द्रिका
    चन्द्रभूषणा ॥ ११॥ सचामरशिवावाणीसव्यदक्षिणवीजिता । भक्तरक्षणदाक्षिण्यकटाक्षा कमलासना ॥ १२॥ गणेशालिङ्गनोद्भूतपुलकाङ्गी
    परात्परा । लीलाकल्पितब्रह्माण्डकोटिकोटिसमन्विता ॥ १३॥ वाणीकोटिसमायुक्तकोटिब्रह्मनिषेविता । लक्ष्मीकोटिसमायुक्तविष्णुकोटिप्रपूजिता
    ॥ १४॥ गौरीकोटिसमायुक्तशम्भुकोटिसुसेविता । प्रभाकोटिसमायुक्तकोटिभास्करवन्दिता ॥ १५॥ भानुकोटिप्रतीकाशा
    चन्द्रकोटिसुशीतला । चतुष्षष्टिकोटिसिद्धिनिषेवितपदाम्बुजा ॥ १६॥ मूलाधारसमुत्पन्ना मूलबन्धविमोचिनी ।
    मूलाधारैकनिलया योगकुण्डलिभेदिनी ॥ १७॥ मूलाधारा मूलभूता मूलप्रकृतिरूपिणी । मूलाधारगणेशानवामभागनिवासिनी
    ॥ १८॥ मूलविद्या मूलरूपा मूलग्रन्थिविभेदिनी । स्वाधिष्ठानैकनिलया ब्रह्मग्रन्थिविभेदिनी ॥ १९॥ मणिपूरान्तरुदिता
    विष्णुग्रन्थिविभेदिनी । अनाहतैकनिलया रुद्रग्रन्थिविभेदिनी ॥ २०॥ विशुद्धिस्थाननिलया जीवभावप्रणाशिनी
    । आज्ञाचक्रान्तरालस्था ज्ञानसिद्धिप्रदायिनी ॥ २१॥ ब्रह्मरन्ध्रैकनिलया ब्रह्मभावप्रदायिनी । षट्कोणाष्टदलयुतश्रीसिद्धियन्त्रमध्यगा
    ॥ २२॥ अन्तर्मुखजनानन्तफलदा शोकनाशिनी । अव्याजकरुणापूरपूरिता वसुधारिणी ॥ २३॥ दारिद्र्यनाशिनी लक्ष्मीस्सर्वपापप्रणाशिनी
    । भुक्तिसिद्धिर्मुक्तिसिद्धिस्सुधामण्डलमध्यगा ॥ २४॥ चिन्तामणिस्सर्वसिद्धिः कमलावल्लभा शिवा । सिद्धलक्ष्मीर्मोक्षलक्ष्मीर्जयलक्ष्मीर्वरप्रदा
    ॥ २५॥ रमानन्दा महालक्ष्मीर्विभूतिर्भक्तिवर्धिनी । अष्टोत्तरशतं नाम्नां महासिद्धेरिदं वरम् ॥ २६॥ आज्ञया
    गणनाथस्य गणकेन प्रकीर्तितम् । यः पठेद् गाणपो भक्त्या पूजयेद्वा सुनामभिः । धर्ममर्थं च कामं च लब्ध्वा
    मोक्षमवाप्नुयात् ॥ २७॥ इति महासिद्धिदेव्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ।
