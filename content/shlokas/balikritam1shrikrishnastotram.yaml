id: balikritam1shrikrishnastotram
category: stotram
name:
  english: balikritam1shrikrishnastotram
  devanagari: बलिकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: balikritam 1 shrikrishnastotram baliruvaca | adityah prarthanenaiva maturdevya vratena ca |
    pura vamanarupena tvaya'ham vancitah prabho || 23|| sampadrupa mahalakshmirdatta bhaktaya bhaktitah
    | shakraya matto bhaktaya bhratre punyavate dhruvam || 24|| adhuna mama putro'yam banah shankarakinkarah
    | aracca rakshitah so'pi tenaiva bhaktabandhuna || 25|| paripushtashca parvatya yatha matra sutastatha
    | grihitavamshca tatkanyam balena yuvatim satim || 26|| samudyatashca tam hantum kartikenapi varitah
    | agato'si punarhantum pautrasya damane kshamah || 27|| sarvatmanashca sarvatra samabhavah shrutau
    shrutah | karoshi jagatam natha kathamevam vyatikramah || 28|| tvaya ca nihato yo hi tasya ko rakshita
    bhuvi | sudarshanasya tejo hi suryakotinibham param || 29|| kesham suranamastrena tadeva ca nivaritam
    | yatha sudarshanam caivamastranam pravaram varam || 30|| tatha bhavamshca devanam sarveshamishvarah
    parah | yatha bhavamstatha krishno vidhata vedhasamapi || 31|| vishnuh sattvagunadharah shivah sattvashrayastatha
    | svayam vidhata rajasah srishtikarta pitamahah || 32|| kalagnirudro bhagavanvishvasamharakarakah
    | tamasashcashrayah so'pi rudranam pravaro mahan || 33|| sa eva shankaramshashcapyanye rudrashca tatkalah
    | bhavamshca nirgunastesham prakriteshca parastatha || 34|| sarvesham paramatma vai prana vishnusvarupinah
    | manasam ca svayam brahma svayam jnanatmakah shivah || 35|| pravara sarvashaktinam buddhih prakritirishvari
    | svatmanah pratibimbaste jivah sarveshu dehishu || 36|| jivah svakarmanam bhogi svayam sakshi bhavamstatha
    | sarve yanti tvayi gate naradeve yatha'nugah || 37|| sadyah patati dehashca shavo'sprishyastvaya
    vina | buddhah santo na jananti vancitastava mayaya || 38|| tvam bhajantyeva ye santo mayametam taranti
    te | triguna prakritirdurga vaishnavi ca sanatani || 39|| para narayanishani tava maya duratyaya |
    tvadamshah prativishveshu brahmavishnushivatmakah || 40|| sarveshamapi vishveshamashrayo yo mahanvirat
    | sa shete ca jale yogadvishvesho gokule yatha || 41|| sa eva vasurbhagavamstasya devo bhavanparah
    | vasudeva iti khyatah puravidbhih prakirtitah || 42|| tvameva kalaya suryastvameva kalaya shashi
    | kalaya ca hutashashca kalaya pavanah svayam || 43|| kalaya varunashcaiva kuberashca yamastatha |
    kalaya tvam mahendrashca kalaya dharma eva ca || 44|| tvameva kalaya shesha ishano nairitistatha |
    munayo manavashcaiva grahashca phaladayakah || 45|| kalakalayashcamshena sarve jivashcaracarah | tvam
    brahma paramam jyotirdhyayante yoginah sada || 46|| tam tvadriyante bhaktaste dhyayante ya tadantare
    | navinaniradashyamam pitakausheyavasasam || 47|| ishaddhasyaprasannasyam bhaktesham bhaktavatsalam
    | candanokshitasarvangam dvibhujam muralidharam || 48|| mayurapicchacudam ca malatimalyabhushitam
    | amulyaratnanirmanakeyuravalayavintam || 49|| manikundalayugmena gandasthalavirajitam | ratnasarangaliyam
    ca kvananmanjiraranjitam || 50|| kotikandarpalilabham sharatkamalalocanam | sharatpurnaindunindasyam
    candrakotisamaprabham || 51|| vikshitam sasmitabhishca gopinam kotikotibhih | vayasyaih parshadairgopaih
    sevitam shvetacamaraih || 52|| gopabalakavesham ca radhavakshahsthalasthitam | dhyanasadhyam duraradhyam
    brahmeshasheshavanditam || 53|| siddhendraishca munindraishca yogindraih pranatam stutam | vedanirvacaniyam
    ca param svecchamayam vibhum || 54|| sthulasthulatamam rupam sukshmatsukshmatamam param | satyam nityam
    prashastam ca prakriteh paramishvaram || 55|| nirliptam ca niriham ca bhagavantam sanatanam | iti
    shribrahmavaivartapurane shrikrishnajanmakhande uttare ekonavimshadhikashatatamadhyayantargatam balikritam
    shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: बलिकृतं १ श्रीकृष्णस्तोत्रम् बलिरुवाच । अदित्याः प्रार्थनेनैव मातुर्देव्या व्रतेन च । पुरा
    वामनरूपेण त्वयाऽहं वञ्चितः प्रभो ॥ २३॥ सम्पद्रूपा महालक्ष्मीर्दत्ता भक्ताय भक्तितः । शक्राय मत्तो
    भक्ताय भ्रात्रे पुण्यवते ध्रुवम् ॥ २४॥ अधुना मम पुत्रोऽयं बाणः शङ्करकिङ्करः । आराच्च रक्षितः सोऽपि
    तेनैव भक्तबन्धुना ॥ २५॥ परिपुष्टश्च पार्वत्या यथा मात्रा सुतस्तथा । गृहीतवांश्च तत्कन्यां बलेन युवतीं
    सतीम् ॥ २६॥ समुद्यतश्च तं हन्तुं कार्तिकेनापि वारितः । आगतोऽसि पुनर्हन्तुं पौत्रस्य दमने क्षमः ॥ २७॥
    सर्वात्मनश्च सर्वत्र समभावः श्रुतौ श्रुतः । करोषि जगतां नाथ कथमेवं व्यतिक्रमः ॥ २८॥ त्वया च निहतो
    यो हि तस्य को रक्षिता भुवि । सुदर्शनस्य तेजो हि सूर्यकोटिनिभं परम् ॥ २९॥ केषां सुराणामस्त्रेण तदेव
    च निवारितम् । यथा सुदर्शनं चैवमस्त्राणां प्रवरं वरम् ॥ ३०॥ तथा भवांश्च देवानां सर्वेषामीश्वरः परः
    । यथा भवांस्तथा कृष्णो विधाता वेधसामपि ॥ ३१॥ विष्णुः सत्त्वगुणाधारः शिवः सत्त्वाश्रयस्तथा । स्वयं
    विधाता रजसः सृष्टिकर्ता पितामहः ॥ ३२॥ कालाग्निरुद्रो भगवान्विश्वसंहारकारकः । तमसश्चाश्रयः सोऽपि रुद्राणां
    प्रवरो महान् ॥ ३३॥ स एव शङ्करांशश्चाप्यन्ये रुद्राश्च तत्कलाः । भवांश्च निर्गुणस्तेषां प्रकृतेश्च
    परस्तथा ॥ ३४॥ सर्वेषां परमात्मा वै प्राणा विष्णुस्वरूपिणः । मानसं च स्वयं ब्रह्मा स्वयं ज्ञानात्मकः
    शिवः ॥ ३५॥ प्रवरा सर्वशक्तीनां बुद्धिः प्रकृतिरीश्वरी । स्वात्मनः प्रतिबिम्बस्ते जीवः सर्वेषु देहिषु
    ॥ ३६॥ जीवः स्वकर्मणां भोगी स्वयं साक्षी भवांस्तथा । सर्वे यान्ति त्वयि गते नरदेवे यथाऽनुगाः ॥ ३७॥
    सद्यः पतति देहश्च शवोऽस्पृश्यस्त्वया विना । बुद्धाः सन्तो न जानन्ति वञ्चितास्तव मायया ॥ ३८॥ त्वां
    भजन्त्येव ये सन्तो मायामेतां तरन्ति ते । त्रिगुणा प्रकृतिर्दुर्गा वैष्णवी च सनातनी ॥ ३९॥ परा नारायणीशानी
    तव माया दुरत्यया । त्वदंशाः प्रतिविश्वेषु ब्रह्मविष्णुशिवात्मकाः ॥ ४०॥ सर्वेषामपि विश्वेषामाश्रयो
    यो महान्विराट् । स शेते च जले योगाद्विश्वेशो गोकुले यथा ॥ ४१॥ स एव वासुर्भगवांस्तस्य देवो भवान्परः
    । वासुदेव इति ख्यातः पुराविद्भिः प्रकीर्तितः ॥ ४२॥ त्वमेव कलया सूर्यस्त्वमेव कलया शशी । कलया च हुताशश्च
    कलया पवनः स्वयम् ॥ ४३॥ कलया वरुणश्चैव कुबेरश्च यमस्तथा । कलया त्वं महेन्द्रश्च कलया धर्म एव च ॥ ४४॥
    त्वमेव कलया शेष ईशानो नैऋतिस्तथा । मुनयो मनवश्चैव ग्रहाश्च फलदायकः ॥ ४५॥ कलाकलायाश्चांशेन सर्वे जीवाश्चराचराः
    । त्वं ब्रह्म परमं ज्योतिर्ध्यायन्ते योगिनः सदा ॥ ४६॥ तं त्वाद्रियन्ते भक्तास्ते ध्यायन्ते य तदन्तरे
    । नवीननीरदश्यामं पीतकौशेयवाससम् ॥ ४७॥ ईषद्धास्यप्रसन्नास्यं भक्तेशं भक्तवत्सलम् । चन्दनोक्षितसर्वाङ्गं
    द्विभुजं मुरलीधरम् ॥ ४८॥ मयूरपिच्छचूडं च मालतीमाल्यभूषितम् । अमूल्यरत्ननिर्माणकेयूरवलयाविन्तम् ॥ ४९॥
    मणिकुण्डलयुग्मेन गण्डस्थलविराजितम् । रत्नसाराङ्गलीयं च क्वणन्मञ्जीररञ्जितम् ॥ ५०॥ कोटिकन्दर्पलीलाभं
    शरत्कमललोचनम् । शरत्पूर्णैन्दुनिन्दास्यं चन्द्रकोटिसमप्रभम् ॥ ५१॥ वीक्षितं सस्मिताभिश्च गोपीनां कोटिकोटिभिः
    । वयस्यैः पार्षदैर्गोपैः सेवितं श्वेतचामरैः ॥ ५२॥ गोपबालकवेषं च राधावक्षःस्थलस्थितम् । ध्यानासाध्यं
    दुराराध्यं ब्रह्मेशशेषवन्दितम् ॥ ५३॥ सिद्धेन्द्रैश्च मुनीन्द्रैश्च योगीन्द्रैः प्रणतं स्तुतम् । वेदानिर्वचनीयं
    च परं स्वेच्छामयं विभुम् ॥ ५४॥ स्थूलस्थूलतमं रूपं सूक्ष्मात्सूक्ष्मतमं परम् । सत्यं नित्यं प्रशस्तं
    च प्रकृतेः परमीश्वरम् ॥ ५५॥ निर्लिप्तं च निरीहं च भगवन्तं सनातनम् । इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    उत्तरे एकोनविंशाधिकशाततमाध्यायान्तर्गतं बलिकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
