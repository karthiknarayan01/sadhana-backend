id: shivastotramdevaihkritam
category: stotram
name:
  english: shivastotramdevaihkritam
  devanagari: शिवस्तोत्रम्देवैःकृतं
content:
  english: ya esha bhagavanrudro brahma vishnurmaheshvarah || 21|| skandashcagnistatha candro bhuvanani
    caturdasha | bhutani ca tatha suryah somadyashtau grahastatha || 22|| pranah kalo yamo mrityuramritam
    parameshvarah | bhutam bhavyam bhavishyam ca vartamanam maheshvarah || 23|| vishvam kritsnam jagatsarva
    satyam tasmai namo namah | omadau ca tatha madhye bhurbhuvah svastathaiva ca || 24|| ante tvam vishvarupo'si
    shirsham ca jagatah sada | brahmaikastvam dvitridhordhvamadhastattvam sureshvarah || 25|| shantishca
    tvam tatha pushtistushtishcapyahutam hutam | vishvam caiva tatha'vishvam dattam cadattamishvarah ||
    26|| ritam va'pyathava deva paramapyaparam dhruvam | parayanam satam caiva asatamapi shankara || 27||
    apama sogamabhrita abhumaganma jyotiravidama devan | kim nunamasmankrinavadaratih kimu dhurtiramrita
    martyasya || etajjagadveditavyamaksharam sukshmamavyayam | prajapatyam pavitram va saumyamagrahyamagriyam
    || 29|| agneyenapi ca''gneyam vayavyena samiranam | saumyena saumyam grasate tejasa svena lilaya ||
    30|| tasmai namo'pasamhartre mahagrasaya shuline | hridistha devatah sarva hridi pranah pratishthitah
    || 31|| hridi tvamasi yonistvam tisro matrah parastu sah | shirashcottaratastasya pado dakshinatastatha
    || 32|| sa yo jivottarah sakshatsa akarah sanatanah | onkaro yah sa vai devah pranavo vyapya tishthati
    || 33|| anantatarah sukshmashca shuklam vaidyutameva ca | parabrahma sa ishana eko rudrah sa eva ca
    || 34|| bhavanmaheshvarah sakshanmahadevo na samshayah | urdhvamunnamayatyevam sa onkarah prakirtitah
    || 35|| pranannayati yattasmatpranavah paribhashitah | sarvam vyapnoti yattasmatsarvavyapi sanatanah
    || 36|| brahma harishca bhagavanadyantam nopalabdhavan | yatha'nye ca tato'nanto rudrah paramakaranam
    || 37|| yattarayati samsarattara ityabhidhiyate | sukshmo bhutva sharirani sarvada hyadhitishthati
    || 38|| tasmatsukshmah sada khyato bhagavannilalohitah | nilashca lohitashcaiva pradhanapurushanvayat
    || 39|| skandate'sya yatah shukram tatah shukramayiti ca | vidyotayati yattasmadvaidyutam parigiyate
    || 40|| brihattvadbrimhanadbrahma brimhate ca paraparas | tasmadbrihati yattasmatparam brahmeti kirtitam
    || 41|| advitiyo'tha bhagavamsturiyah shiva ishate
  devanagari: य एष भगवान्रुद्रो ब्रह्मा विष्णुर्महेश्वरः ॥ २१॥ स्कन्दश्चाग्निस्तथा चन्द्रो भुवनानि चतुर्दश
    । भूतानि च तथा सूर्यः सोमाद्यष्टौ ग्रहास्तथा ॥ २२॥ प्राणः कालो यमो मृत्युरमृतं परमेश्वरः । भूतं भव्यं
    भविष्यं च वर्तमानं महेश्वरः ॥ २३॥ विश्वं कृत्स्नं जगत्सर्व सत्यं तस्मै नमो नमः । ओमादौ च तथा मध्ये
    भूर्भुवः स्वस्तथैव च ॥ २४॥ अन्ते त्वं विश्वरूपोऽसि शीर्षं च जगतः सदा । ब्रह्मैकस्त्वं द्वित्रिधोर्ध्वमधस्तत्त्वं
    सुरेश्वरः ॥ २५॥ शान्तिश्च त्वं तथा पुष्टिस्तुष्टिश्चाप्यहुतं हुतम् । विश्वं चैव तथाऽविश्वं दत्तं चादत्तमीश्वरः
    ॥ २६॥ ऋतं वाऽप्यथवा देव परमप्यपरं ध्रुवम् । परायणं सतां चैव असतामपि शङ्कर ॥ २७॥ अपाम सोगमभृता अभूमागन्म
    ज्योतिरविदाम देवान् । किं नूनमस्मान्कृणवदरातिः किमु धूर्तिरमृत मर्त्यस्य ॥ एतज्जगद्वेदितव्यमक्षरं
    सूक्ष्ममव्ययम् । प्राजापत्यं पवित्रं वा सौम्यमग्राह्यमग्रियम् ॥ २९॥ आग्नेयेनापि चाऽऽग्नेयं वायव्येन
    समीरणम् । सौम्येन सौम्यं ग्रसते तेजसा स्वेन लीलया ॥ ३०॥ तस्मै नमोऽपसंहर्त्रे महाग्रासाय शूलिने । हृदिस्था
    देवताः सर्वा हृदि प्राणाः प्रतिष्ठिताः ॥ ३१॥ हृदि त्वमसि योनिस्त्वं तिस्रो मात्राः परस्तु सः । शिरश्चोत्तरतस्तस्य
    पादो दक्षिणतस्तथा ॥ ३२॥ स यो जीवोत्तरः साक्षात्स आकारः सनातनः । ओङ्कारो यः स वै देवः प्रणवो व्याप्य
    तिष्ठति ॥ ३३॥ अनन्ततारः सूक्ष्मश्च शुक्लं वैद्युतमेव च । परब्रह्म स इशान एको रुद्रः स एव च ॥ ३४॥ भवान्महेश्वरः
    साक्षान्महादेवो न संशयः । ऊर्ध्वमुन्नामयत्येवं स ओङ्कारः प्रकीर्तितः ॥ ३५॥ प्राणान्नयति यत्तस्मात्प्रणवः
    परिभाषितः । सर्वं व्याप्नोति यत्तस्मात्सर्वव्यापी सनातनः ॥ ३६॥ ब्रह्मा हरिश्च भगवानाद्यन्तं नोपलब्धवान्
    । यथाऽन्ये च ततोऽनन्तो रुद्रः परमकारणम् ॥ ३७॥ यत्तारयति संसारात्तार इत्यभिधीयते । सूक्ष्मो भूत्वा
    शरीराणि सर्वदा ह्यधितिष्ठति ॥ ३८॥ तस्मात्सूक्ष्मः सदा ख्यातो भगवान्नीललोहितः । नीलश्च लोहितश्चैव प्रधानपुरुषान्वयात्
    ॥ ३९॥ स्कन्दतेऽस्य यतः शुक्रं ततः शुक्रमयीति च । विद्योतयति यत्तस्माद्वैद्युतं परिगीयते ॥ ४०॥ बृहत्त्वाद्बृंहणाद्ब्रह्म
    बृंहते च परापरस् । तस्माद्बृहति यत्तस्मात्परं ब्रह्मेति कीर्तितम् ॥ ४१॥ अद्वितीयोऽथ भगवांस्तुरीयः
    शिव ईशते
