id: bhasma
category: upanishad
name:
  english: bhasma
  devanagari: भस्म
content:
  english: rinavameti vaktre prabravameti hridaye atmana iti nabhau nabhiriti mantrena dakshinabhujamule
    bhavayeti tanmadhye rudrayeti tanmanibandhe sharvayeti tatkaraprishthe pashupataya iti vamabahumule
    ugrayeti tanmadhye agrevadhayeti tanmanibandhe durevadhayeti tatkaraprishthe namo hantra iti amse
    shankarayeti yathakramam bhasma dhritva somayeti shivam natva tatah prakshalya tadbhasmapah punantviti
    pibet | nadho tyajyam nadho tyajyam | etanmadhyahnasayahneshu trikaleshu vidhivadbhasmadharanamapramadena
    karyam | pramadatpatito bhavati | brahmananamayameva dharmo'yameva dharmah | evam bhasmadharanamakritva
    nashniyadapo'nnamanyadva | pramadattyaktva bhasmadharanam na gayatrim japet | na juhuyadagnau tarpayeddevanrishinpitradin
    | ayameva dharmah sanatanah sarvapapanashako mokshahetuh | nityo'yam dharmo brahmananam brahmacarigrihivanaprasthayatinam
    | etadakarane pratyavaiti brahmanah | akritva pramadenaitadashtottarashatam jalamadhye sthitva gayatrim
    japtvoposhanenaikena shuddho bhavati | yatirbhasmadharanam tyaktvaikadoposhya dvadashasahasrapranavam
    japtva shuddho bhavati | anyathendro yatinsalavrikebhyah patayati | bhasmano yadyabhavastada naryabhasmadahanajanyamanyadvavashyam
    mantraputam dharyam | etatpratah prayunjano ratrikritatpapatputo bhavati | svarnasteyatpramucyate
    | madhyandine madhyandinam kritvopasthanantam dhyayamana adityabhimukho'dhiyanah surapanatputo bhavati
    | svarnasteyatputo bhavati | brahmanavadhatputo bhavati | govadhatputo bhavati | ashvavadhatputo bhavati
    | guruvadhatputo bhavati | matrivadhatputo bhavati | pitrivadhatputo bhavati | trikalametatprayunjanah
    sarvavedaparayanaphalamavapnoti | sarvatirthaphalamashnute | anapabruvah sarvamayureti | vindate prajapatyam
    rayasposham gaupatyam | evamavartayedupanishadamityaha bhagavansadashivah sambah sadashivah sambah
    || iti prathamo'dhyayah || 1|| atha bhusundo jabalo mahadevam sambam pranamya punah papraccha kim
    nityam brahmananam kartavyam yadakarane pratyavaiti brahmanah | kah pujaniyah | ko va dhyeyah | kah
    smartavyah | katham dhyeyah | kva sthatavyametadbruhiti | samasena tam hovaca | pragudayannirvartya
    shaucadikam tatah snayat | marjanam rudrasuktaih | tatashcahatam vasah paridhatte papmanopahrityai
    | udyantamadityamabhidhyayannuddhulitangam kritva yathasthanam bhasmana tripundram shvetenaiva rudrakshanchvetanbibhriyat
    | naitatsammarshah | tathanye | murdhni catvarimshat | shikhayamekam trayam va | shrotrayordvadasha
    | kanthe dvatrimshat | bahvoh shodashashodasha | dvadashadvadasha manibandhayoh | shatshadangushthayoh
    | tatah sandhyam sakusho'haraharupasita | agnirjyotirityadibhiragnau juhuyat | shivalingam trisandhyamabhyarcya
    kusheshvasino dhyatva sambam mameva vrishabharudham hiranyabahum hiranyavarnam hiranyarupam pashupashavimocakam
    purusham krishnapingalamurdhvaretam virupaksham vishvarupam sahasraksham sahasrashirsham sahasracaranam
    vishvatobahum vishvatmanamekamadvaitam nishkalam nishkriyam shantam shivamaksharamavyayam hariharahiranyagarbhasrashtaramaprameyamanadyantam
    rudrasuktairabhishicya sitena bhasmana shriphaladalaishca trishakhairardrairanardrairva | naitatra
    samsparshah | tatpujasadhanam kalpayecca naivedyam | tatashcaikadashagunarudro japaniyah | ekaguno'nantah
    | shadaksharo'shtaksharo va shaivo mantro japaniyah | omityagre vyaharet | nama iti pashcat | tatah
    shivayetyaksharatrayam | omityagre vyaharet | nama iti pashcat | tato mahadevayeti pancaksharani |
    natastarakah paramo mantrah | tarako'yam pancaksharah | ko'yam shaivo manuh | shaivastarako'yamupadishyate
    manuravimukte shaivebhyo jivebhyah | shaivo'yameva mantrastarayati | sa eva brahmopadeshah | brahma
    somo'ham pavanah somo'ham pavate somo'ham janita matinam somo'ham janita prithivyah somo'ham janita'gneh
    somo'ham janita suryasya somo'ham janitendrasya somo'ham janitota vishnoh somo'hameva janita sa yashcandramaso
    devanam bhurbhuvasvaradinam sarvesham lokanam ca | vishvam bhutam bhuvanam citram bahudha jatam jayamanam
    ca yatsarvasya somo'hameva janita vishvadhiko rudro maharshih | hiranyagarbhadinaham jayamananpashyami
    | yo rudro agnau yo apsu ya oshadhishu yo rudro vishva bhuvana viveshaivameva | ayamevatmantaratma
    brahmajyotiryasmanna matto'nyah parah | ahameva paro vishvadhikah | mameva viditvamritatvameti | tarati
    shokam | mameva viditva samsritikim rujam dravayati | tasmadaham rudro yah sarvesham parama gatih
    | so'ham sarvakarah | yato va imani bhutani jayante | yena jatani jivanti | yatprayantyabhisamvishanti
    | tam mameva viditvopasita | bhutebhirdevebhirabhishtuto'hameva | bhishasmadvatah pavate | bhishodeti
    suryah | bhishasmadagnishcendrashca | somo'ta eva yo'ham sarveshamadhishthata sarvesham ca bhutanam
    palakah | so'ham prithivi | so'hamapah | so'ham tejah | so'ham vayuh | so'ham kalah | so'ham dishah
    | so'hamatma | mayi sarvam pratishthitam | brahmavidapnoti param | brahma shivo me astu sadashivom
    | acakshurvishvatashcakshurakarno vishvatah karno'pado vishvatahpado'panirvishvatahpanirahamashira
    vishvatahshira vidyamantraikasamshrayo vidyarupo vidyamayo vishveshvaro'hamajaro'ham | mamevam viditva
    samsritipashatpramucyate | tasmadaham pashupashavimocakah | pashavashcamanavantam madhyavartinashca
    yuktatmano yatante mameva praptum | prapyante mam na punaravartante | trishulagam kashimadhishritya
    tyaktasavo'pi mayyeva samvishanti | prajvalavahnigam haviryatha na yajamanamasadayati tathasau tyaktva
    kunapam na tattadrisham pura prapnuvanti | esha evadeshah | esha upadeshah | esha eva paramo dharmah
    | satyattatra kadacinna pramaditavyam tatroddhulanatripundrabhyam | tatha rudradyakshadharanattatha
    madarcanacca | pramadenapi nantardevasadane purisham kuryat | vratanna pramaditavyam | taddhi tapastaddhi
    tapah kashyameva muktikamanam | na tattyajyam na tattyajyam mocako'hamavimukte nivasatam | navimuktatparamam
    sthanam | navimuktatparamam sthanam | kashyam sthanani catvari | teshamabhyarhitamantargriham | tatrapyavimuktamabhyarhitam
    | tatra sthanani panca | tanmadhye shivagaramabhyarhitam | tatra pracyamaishvaryasthanam | dakshinayam
    vicalanasthanam | pashcimayam vairagyasthanam | uttarayam jnanasthanam | tasminyadantarnirliptamavyayamanadyanta
  devanagari: ृणवामेति वक्त्रे प्रब्रवामेति हृदये आत्मन इति नाभौ नाभिरिति मन्त्रेण दक्षिणभुजमूले भवायेति
    तन्मध्ये रुद्रायेति तन्मणिबन्धे शर्वायेति तत्करपृष्ठे पशुपतय इति वामबाहुमूले उग्रायेति तन्मध्ये अग्रेवधायेति
    तन्मणिबन्धे दूरेवधायेति तत्करपृष्ठे नमो हन्त्र इति अंसे शङ्करायेति यथाक्रमं भस्म धृत्वा सोमायेति शिवं
    नत्वा ततः प्रक्षाल्य तद्भस्मापः पुनन्त्विति पिबेत् । नाधो त्याज्यं नाधो त्याज्यम् । एतन्मध्याह्नसायाह्नेषु
    त्रिकालेषु विधिवद्भस्मधारणमप्रमादेन कार्यम् । प्रमादात्पतितो भवति । ब्राह्मणानामयमेव धर्मोऽयमेव धर्मः
    । एवं भस्मधारणमकृत्वा नाश्नीयादापोऽन्नमन्यद्वा । प्रमादात्त्यक्त्वा भस्मधारणं न गायत्रीं जपेत् । न
    जुहुयादग्नौ तर्पयेद्देवानृषीन्पित्रादीन् । अयमेव धर्मः सनातनः सर्वपापनाशको मोक्षहेतुः । नित्योऽयं
    धर्मो ब्राह्मणानां ब्रह्मचारिगृहिवानप्रस्थयतीनाम् । एतदकरणे प्रत्यवैति ब्राह्मणः । अकृत्वा प्रमादेनैतदष्टोत्तरशतं
    जलमध्ये स्थित्वा गायत्रीं जप्त्वोपोषणेनैकेन शुद्धो भवति । यतिर्भस्मधारणं त्यक्त्वैकदोपोष्य द्वादशसहस्रप्रणवं
    जप्त्वा शुद्धो भवति । अन्यथेन्द्रो यतीन्सालावृकेभ्यः पातयति । भस्मनो यद्यभावस्तदा नर्यभस्मदाहनजन्यमन्यद्वावश्यं
    मन्त्रपूतं धार्यम् । एतत्प्रातः प्रयुञ्जानो रत्रिकृतात्पापात्पूतो भवति । स्वर्णस्तेयात्प्रमुच्यते
    । मध्यन्दिने माध्यन्दिनं कृत्वोपस्थानान्तं ध्यायमान आदित्याभिमुखोऽधीयानः सुरापानात्पूतो भवति । स्वर्णस्तेयात्पूतो
    भवति । ब्राह्मणवधात्पूतो भवति । गोवधात्पूतो भवति । अश्ववधात्पूतो भवति । गुरुवधात्पूतो भवति । मातृवधात्पूतो
    भवति । पितृवधात्पूतो भवति । त्रिकालमेतत्प्रयुञ्जानः सर्ववेदपारायणफलमवाप्नोति । सर्वतीर्थफलमश्नुते
    । अनपब्रुवः सर्वमायुरेति । विन्दते प्राजापत्यं रायस्पोषं गौपत्यम् । एवमावर्तयेदुपनिषदमित्याह भगवान्सदाशिवः
    साम्बः सदाशिवः साम्बः ॥ इति प्रथमोऽध्यायः ॥ १॥ अथ भुसुण्डो जाबालो महादेवं साम्बं प्रणम्य पुनः पप्रच्छ
    किं नित्यं ब्राह्मणानां कर्तव्यं यदकरणे प्रत्यवैति ब्राह्मणः । कः पूजनीयः । को वा ध्येयः । कः स्मर्तव्यः
    । कथं ध्येयः । क्व स्थातव्यमेतद्ब्रूहीति । समासेन तं होवाच । प्रागुदयान्निर्वर्त्य शौचादिकं ततः स्नायात्
    । मार्जनं रुद्रसूक्तैः । ततश्चाहतं वासः परिधत्ते पाप्मनोपहृत्यै । उद्यन्तमादित्यमभिध्यायन्नुद्धूलिताङ्गं
    कृत्वा यथास्थानं भस्मना त्रिपुण्ड्रं श्वेतेनैव रुद्राक्षाञ्छ्वेतान्बिभृयात् । नैतत्संमर्शः । तथान्ये
    । मूर्ध्नि चत्वारिंशत् । शिखायामेकं त्रयं वा । श्रोत्रयोर्द्वादश । कण्ठे द्वात्रिंशत् । बाह्वोः षोडशषोडश
    । द्वादशद्वादश मणिबन्धयोः । षट्षडङ्गुष्ठयोः । ततः सन्ध्यां सकुशोऽहरहरुपासीत । अग्निर्ज्योतिरित्यादिभिरग्नौ
    जुहुयात् । शिवलिङ्गं त्रिसन्ध्यमभ्यर्च्य कुशेष्वासीनो ध्यात्वा साम्बं मामेव वृषभारूढं हिरण्यबाहुं
    हिरण्यवर्णं हिरण्यरूपं पशुपाशविमोचकं पुरुषं कृष्णपिङ्गलमूर्ध्वरेतं विरूपाक्षं विश्वरूपं सहस्राक्षं
    सहस्रशीर्षं सहस्रचरणं विश्वतोबाहुं विश्वात्मानमेकमद्वैतं निष्कलं निष्क्रियं शान्तं शिवमक्षरमव्ययं
    हरिहरहिरण्यगर्भस्रष्टारमप्रमेयमनाद्यन्तं रुद्रसूक्तैरभिषिच्य सितेन भस्मना श्रीफलदलैश्च त्रिशाखैरार्द्रैरनार्द्रैर्वा
    । नैतत्र संस्पर्शः । तत्पूजासाधनं कल्पयेच्च नैवेद्यम् । ततश्चैकादशगुणरुद्रो जपनीयः । एकगुणोऽनन्तः
    । षडक्षरोऽष्टाक्षरो वा शैवो मन्त्रो जपनीयः । ओमित्यग्रे व्याहरेत् । नम इति पश्चात् । ततः शिवायेत्यक्षरत्रयम्
    । ओमित्यग्रे व्याहरेत् । नम इति पश्चात् । ततो महादेवयेति पञ्चाक्षराणि । नातस्तारकः परमो मन्त्रः ।
    तारकोऽयं पञ्चाक्षरः । कोऽयं शैवो मनुः । शैवस्तारकोऽयमुपदिश्यते मनुरविमुक्ते शैवेभ्यो जीवेभ्यः । शैवोऽयमेव
    मन्त्रस्तारयति । स एव ब्रह्मोपदेशः । ब्रह्म सोमोऽहं पवनः सोमोऽहं पवते सोमोऽहं जनिता मतीनां सोमोऽहं
    जनिता पृथिव्याः सोमोऽहं जनिताऽग्नेः सोमोऽहं जनिता सूर्यस्य सोमोऽहं जनितेन्द्रस्य सोमोऽहं जनितोत विष्णोः
    सोमोऽहमेव जनिता स यश्चन्द्रमसो देवानां भूर्भुवस्वरादीनां सर्वेषां लोकानां च । विश्वं भूतं भुवनं चित्रं
    बहुधा जातं जायमानं च यत्सर्वस्य सोमोऽहमेव जनिता विश्वाधिको रुद्रो महर्षिः । हिरण्यगर्भादीनहं जायमानान्पश्यामि
    । यो रुद्रो अग्नौ यो अप्सु य ओषधीषु यो रुद्रो विश्वा भुवना विवेशैवमेव । अयमेवात्मान्तरात्मा ब्रह्मज्योतिर्यस्मान्न
    मत्तोऽन्यः परः । अहमेव परो विश्वाधिकः । मामेव विदित्वामृतत्वमेति । तरति शोकम् । मामेव विदित्वा सांसृतिकीं
    रुजं द्रावयति । तस्मादहं रुद्रो यः सर्वेषां परमा गतिः । सोऽहं सर्वाकारः । यतो वा इमानि भूतानि जायन्ते
    । येन जातानि जीवन्ति । यत्प्रयन्त्यभिसंविशन्ति । तं मामेव विदित्वोपासीत । भूतेभिर्देवेभिरभिष्टुतोऽहमेव
    । भीषास्माद्वातः पवते । भीषोदेति सूर्यः । भीषास्मादग्निश्चेन्द्रश्च । सोमोऽत एव योऽहं सर्वेषामधिष्ठाता
    सर्वेषां च भूतानां पालकः । सोऽहं पृथिवी । सोऽहमापः । सोऽहं तेजः । सोऽहं वायुः । सोऽहं कालः । सोऽहं
    दिशः । सोऽहमात्मा । मयि सर्वं प्रतिष्ठितम् । ब्रह्मविदाप्नोति परम् । ब्रह्मा शिवो मे अस्तु सदाशिवोम्
    । अचक्षुर्विश्वतश्चक्षुरकर्णो विश्वतः कर्णोऽपादो विश्वतःपादोऽपाणिर्विश्वतःपाणिराहमशिरा विश्वतःशिरा
    विद्यामन्त्रैकसंश्रयो विद्यारूपो विद्यामयो विश्वेश्वरोऽहमजरोऽहम् । मामेवं विदित्वा संसृतिपाशात्प्रमुच्यते
    । तस्मादहं पशुपाशविमोचकः । पशवश्चामानवान्तं मध्यवर्तिनश्च युक्तात्मानो यतन्ते मामेव प्राप्तुम् । प्राप्यन्ते
    मां न पुनरावर्तन्ते । त्रिशूलगां काशीमधिश्रित्य त्यक्तासवोऽपि मय्येव संविशन्ति । प्रज्वलवह्निगं हविर्यथा
    न यजमानमासादयति तथासौ त्यक्त्वा कुणपं न तत्तादृशं पुरा प्राप्नुवन्ति । एष एवादेशः । एष उपदेशः । एष
    एव परमो धर्मः । सत्यात्तत्र कदाचिन्न प्रमदितव्यं तत्रोद्धूलनत्रिपुण्ड्राभ्याम् । तथा रुद्राद्याक्षधारणात्तथा
    मदर्चनाच्च । प्रमादेनापि नान्तर्देवसदने पुरीषं कुर्यात् । व्रतान्न प्रमदितव्यम् । तद्धि तपस्तद्धि
    तपः काश्यामेव मुक्तिकामानाम् । न तत्त्याज्यं न तत्त्याज्यं मोचकोऽहमविमुक्ते निवसताम् । नाविमुक्तात्परमं
    स्थानम् । नाविमुक्तात्परमं स्थानम् । काश्यां स्थानानि चत्वारि । तेषामभ्यर्हितमन्तर्गृहम् । तत्राप्यविमुक्तमभ्यर्हितम्
    । तत्र स्थानानि पञ्च । तन्मध्ये शिवागारमभ्यर्हितम् । तत्र प्राच्यामैश्वर्यस्थानम् । दक्षिणायां विचालनस्थानम्
    । पश्चिमायां वैराग्यस्थानम् । उत्तरायां ज्ञानस्थानम् । तस्मिन्यदन्तर्निर्लिप्तमव्ययमनाद्यन्त
