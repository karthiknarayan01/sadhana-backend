id: viththalasahasranaamstotra
category: sahasranama
name:
  english: viththalasahasranaamstotra
  devanagari: विठ्ठलसहस्रनाअम्स्तोत्र
content:
  english: ishtikayam samapadam tishthantam purushottamam | janghajasthakaradvandvam kshullakadamabhushanam
    || 15|| savyasavyakarodbhasipadmashankhavibhushitam | darahasasmeramukham shikyaskandham digambaram
    || 16|| sarvalankarasamyuktam brahmadiganasevitam | jnananandamayam devam dhyayami hridi viththalam
    || 17|| atha stotram | klim viththalah pandurangesha ishah shrisho visheshajit | sheshashayi shambhuvandyah
    sharanyah shankarapriyah || 1|| candrabhagasarovasah koticandraprabhasmitah | vidhadhrisucitah sarvapramanatita
    avyayah || 2|| pundarikastuto vandyo bhaktacittaprasadakah | svadharmaniratah prito gogopiparivaritah
    || 3|| gopikashatanirajyah pulinakrida atmabhuh | atma''tmarama atmasthah atmaramanishevitah || 4||
    saccitsukham mahamayi mahadavyaktamadbhutah | sthularupah sukshmarupah karanam paramanjanam || 5||
    mahakaranamadharah adhishthanam prakashakah | kanjapado raktanakho raktapadatalah prabhuh || 6|| samrajyacihnitapado
    nilagulphah sujanghakah | sajjanuh kadalistambhanibhorururuvikramah || 7|| pitambaravritakatih kshullakadamabhushanah
    | kativinyastahastabjah shankhi padmavibhushitah || 8|| gambhiranabhirbrahmadhishthitanabhisaroruhah
    | trivalimanditodarodaromavalimalinah || 9|| kapatavakshah shrivatsabhushitorah kripakarah | vanamali
    kambukanthah susvarah samalalasah || 10|| kanjavaktrah shmashruhinacubuko vedajihvakah | dadimibijasadrisharado
    raktadharo vibhuh || 11|| nasamuktapatalitadharacchavirarindamah | shukanasah kanjanetrah kundalakramitamsakah
    || 12|| mahabahurghanabhujah keyurangadamanditah | ratnabhushitabhushadhyamanibandhah subhushanah
    || 13|| raktapanitalah svangah sanmudramanditangulih | nakhaprabharanjitabjah sarvasaundaryamanditah
    || 14|| subhrurardhashashiprakhyalalatah kamarupadhrik | kunkumankitasadbhalah sukesho barhabhushanah
    || 15|| kiritabhavyaptanabho vikalikritabhaskarah | vanamali pativasah sharngacapo'surantakah || 16||
    darpapahah kamsahanta canuramuramardanah | venuvadanasantushto dadhyannasvadalolupah || 17|| jitarih
    kamajanakah kamaha kamapurakah | vikrodho daritamitro bhurbhuvahsuvaradirat || 18|| anadirajanirjanyajanako
    jahnavipadah | bahujanma jamadagnyah sahasrabhujakhandanah || 99|| kodandadhari janakapujitah kamalapriyah
    | pundarikabhavadveshi pundarikabhavapriyah || 20|| pundarikastutirasah sadbhaktaparipalakah | sushumalasangamastho
    gogopicittaranjanah || 21|| ishtikastho bhaktavashyastrimurtirbhaktavatsalah | lilakritajagaddhama
    jagatpalo haro virat || 22|| ashvatthapadmatirthastho naradastutavaibhavah | pramanatitatattvajnastattvampadanirupitah
    || 23|| ajajanirajajanirajayo nirajo'malah | lakshminivasah svarbhusho vishvavandyo mahotsavah ||
    24|| jagadyonirakarta''dyo bhokta bhogyo bhavatigah | shadgunaishvaryasampanno bhagavanmuktidayakah
    || 25|| adhahprano mano buddhih sushuptih sarvago harih | matsyah kurmo varaho'trirvamano hirarupadhrit
    || 26|| narasimho rishirvyaso ramo nilamshuko hali | buddho'rhan sugatah kalki naro narayanah parah
    || 27|| paratparah karidyesho nakrashapavimocanah | naradoktipratishthata muktakeshi varapradah ||
    28|| candrabhagapsu susnatah kamitarthaprado'naghah | tulasidamabhushadhyastulasikananapriyah || 29||
    pandurangah kshetramurtih sarvamurtiranamayah | pundarikavyajakritajadoddharah sadagatih || 30|| agatih
    sadgatih sabhyo bhavo bhavyo vidhiditah | pralambaghno drupadajacintahari bhayapahah || 31|| vahnivaktrah
    suryanuto vishnustrailokyarakshakah | jagadbhakshyo jagadgeho janaradhyo janardanah || 32|| jeta vishnurvararoho
    bhishmapujyapadambujah | bharta bhishnakasampujyah shishupalavadhodyatah || 33|| shataparadhasahanah
    kshamavanadipujanah | shishupalashiracchetta dantavaktrabalapahah || 34|| shishupalakritadrohah sudarshanavimocanah
    || 35|| sashrih samayo damendrah sudamakridanotsukah | vasudamakritakridah kinkinidamasevitah || 36||
    pancangapujanaratah shuddhacittavashamvadah | rukminivallabhah satyabhamabhushitavigrahah || 37||
    nagnajitya kritotsahah sunandacittamohanah | mitravrinda''lingitango brahmacari vatupriyah || 38||
    sulakshanadhautapado jambavatya kritadarah | sushilashilasantushto jalakelikritadarah || 39|| vasudevo
    devakidyo nandanandakaranghriyuk | yashodamanasollaso balavarajanihsvabhuh || 40|| subhadra''nandado
    gopavashyo gopipriyo'jayah | mandaramulavedisthah santanatarusevitah || 41|| parijatapaharanah kalpadrumapurahsarah
    | haricandanaliptanga indravandyo'gnipujitah || 42|| yamaneta nairriteyo varuneshah khagapriyah |
    kuberavandya ishesho vidhidyo'nantavanditah || 43|| vajri shaktirdandadharah khadgi pashyankushi gadi
    | trishuli kamali cakri satyavratamayo navah || 44|| mahamantrah pranavabhurbhaktacintapaharakah |
    svakshetravasi sukhadah kami bhaktavimocanah || 45|| svanamakirtanapritah kshetreshah kshetrapalakah
    | kamashcakradharardhashca trivikramamayatmakah || 46|| prajnanakarajitkantirupavarnah svarupavan
    | sparshendriyam shaurimayo vaikunthah saniruddhakah || 47|| shadaksharamayo balah shrikrishno brahmabhavitah
    | naradadhishthitakshemo venuvadanatatparah || 48|| naradeshapratishthata govindo garudadhvajah |
    sadharanah samah saumyah kalavan kamalalayah || 49|| kshetrapah kshanadadhishavaktrah kshemakarakshanah
    | lavo lavanimadhama lilavan laghuvigrahah || 50|| hayagrivo hali hamso hatakamso halipriyah | sundarah
    sugatirmuktah satsakho sulabhah svabhuh || 51|| samrajyadah samarajah satta satyah sulakshanah | shadgunaishvaryanilayah
    shadrituparisevitah || 52|| shadangashodhitah shodha shaddarshananirupitah | sheshatalpah shatamakhah
    sharanagatavatsalah || 53|| sashambhuh samitih shankhavahah sharngasucapadhrit | vahniteja varijasyah
    kavirvamshidharo vigah || 54|| vinito vipriyo validalano vajrabhushanah | rukminisho ramajani raja
    rajanyabhushanah || 55|| ratipranapriyapita ravananto raghudvahah | yajnabhokta yamo yajnabhushano
    yajnadushanah || 56|| yajva yashovan yamunakulakunjapriyo yami | merurmanishi mahito muditah shyamavigrahah
    || 57|| mandagami mugdhamukho mahesho minavigrahah | bhimo bhimangajatiravasi bhimartibhanjanah ||
    58|| bhubharaharano bhutabhavano bharatagrajah | balam balapriyo balo balakridanatatparah || 59||
    bakasurantako banasuradarpakavadavah | brihaspatibalaratisunurbalivarapradah || 60|| boddha bandhuvadhodyukto
    bandhamokshaprado budhah | phalgunanishtaha phalgukritaratih phalapradah || 69|| phenajatairakavajrakritayadavasankshayah
    | phalgunotsavasamsaktah phanitalpah phananatah || 62|| punyah pavitrah papatmaduragah panditagranih
    | poshanah pulinavasah pundarikamanorvashah || 63|| nirantaro nirakanksho niratanko niranjanah | nirvinnamanasollaso
    nayananandanah satam || 64|| niyamo niyami namyo nandabandhanamocanah | nipuno nitimanneta naranarayanavapuh
    || 65|| dhenukasuravidveshi dhama dhata dhani dhanam | dhanyo dhanyapriyo dharta dhiman dharmaviduttamah
    || 66|| dharanidharasandharta dharabhushitadamshtrakah | daiteyahanta digvasa devo devashikhamanih
    || 67|| dama data diptibhanuh danavadamita damah | sthirakaryah sthitaprajnah sthavirasthapakah sthitih
    | sthitalokatrayavapuh sthitipralayakaranam || 68|| sthapakastirthacaranastarpakastarunirasah | tarunyakelinipunastaranastaraniprabhuh
    || 69|| toyamurtistamo'titah stambhodbhutastapahparah | tadidvasastoyadabhastarastarasvarapriyah ||
    70|| nakaro dhaukitajagattrituryapritabhusurah | damarupriyahridvasi dindimadhvanigocarah || 71||
    thayugasthamanorgamyah thankari dhanurayudhah | tanatkaritakodandahatarirganasaukhyadah || 72|| jhankaricancarikanki
    shrutikalharabhushanah | jarasandharditajagatsukhabhurjangamatmakah || 73|| jagajjanirjagadbhusho
    janakivirahakulah | jishnushokapaharano janmahino jagatpatih || 74|| chatritahindrasubhagah chadmi
    chatritabhudharah | chayasthalokatritayachalena balinigrahi || 75|| cetashcamatkarakarah citri citrasvabhavavan
    | carubhushcandracudashca candrakotisamaprabhah || 76|| cudaratnadyotibhalashcalanmakarakupadalah
    | carubhuk cayanapritashcampakatavimadhyagah || 77|| canurahanta candrankanashanashcandradidhitih
    | candanaliptasarvangashcarucamaramanditah || 78|| ghanashyamo ghanaravo ghatotkacapitripriyah | ghanastaniparivaro
    ghanavahanagarvaha || 79|| gangapado gataklesho gatakleshanishevitah | gananatho gajoddharta gayako
    gayanapriyah || 80|| gopatirgopikavashyo gopabalanugah patih | ganakotiparivaro gamyo gagananirmalah
    || 81|| gayatrijapasamprito gandakistho guhashayah | guharanyapratishthata guhasuranishudanah || 82||
    gitakirtirgunaramo gopalo gunavarjitah | gopriyo gocaraprito gananatyapravartakah || 83|| khatvayudhah
    kharadveshi khatitah khagamocanah | khagapucchakritottamsah kheladbalakritapriyah || 84|| khatvangapothitaratih
    khanjanakshah khashirshakah | kalavamsharavakrantagopivismaritarbhakah || 85|| kalipramathi kanjasyah
    kamalayatalocanah | kalanemipraharanah kunthitartikishorakah || 86|| keshavah kevalah kanthiravasyah
    komalanghriyuk | kambali kirtiman kantah karunamritasagarah || 87|| kubjasaubhagyadah kubjacandanaliptagatrakah
    | kalah kuvalayapidahanta krodhasamakulah || 88|| kalindipulinakridah kunjakelikutuhali | kancanam
    kamalajanih kalajnah kamitarthadah || 89|| karanam karanatitah kripapurnah kalanidhih | kriyarupah
    kriyatitah kalarupah kratuprabhuh || 90|| katakshastambhitaratih kutilalakabhushitah | kurmakarah
    kalarupi kariravanamadhyagah || 91|| kalakanthi kalaravah kalakantharutanukrit | karadvarapurah kutah
    sarvesham kavalapriyah || 92|| kalikalmashaha krantagokulah kulabhushanah | kutarih kutupah kishaparivarah
    kavipriyah || 93|| kuruvandyah kathinadordandakhanditabhubharah | kinkarapriyakritkarmaratabhaktapriyankarah
    || 94|| ambujasyo'nganakelirambushayyambudhistutah | ambhojamalyambuvahalasadango'ntramalakah || 95||
    audumbaraphalaprakhyabrahmandavalicalakah | oshthasphuranmuralikaravakarshitagokulah || 96|| airavatasamarudha
    aindrishokapaharakah | aishvaryavadhiraishvaryamaishvaryashtadalasthitah || 97|| enashavasamanaksha
    edhastoshitapavakah | eno'ntakrinnamadheyasmritisamsritidarpaha || 98|| lunapancakleshapado lutatanturjagatkritih
    | luptadrishyo luptajagajjayo luptasupavakah || 99|| rupatito rupanamarupamayadikaranam | rinahino
    riddhikari rinatito ritamvadah || 100|| ushanimittabanaghna ushaharyurjitashayah | urdhyarupordhvadharaga
    ushmadagdhajagattrayah || 101|| uddhavatrananirata uddhavajnanadayakah | uddhartoddhava unnidra udbodha
    uparisthitah || 102|| udadhikrida udadhitanayapriya utsavah | ucchinnadevataratirudadhyavritimekhalah
    || 103|| itighna ishita ijya idya ihavivarjitah | ishadhyeyapadambhoja ina inavilocanah || 104|| indra
    indranujanata indirapranavallabhah | indradistuta indrashriridamitthamabhitakrit || 105|| anandabhasa
    ananda anandanidhiratmadrik | ayurartighna ayushya adiramayavarjitah || 106|| adikaranamadhara adharadikritashrayah
    | acyutaishvaryamamita arinasha aghantakrit || 107|| annaprado'nnamakhiladhara acyuta abjabhrit |
    candrabhagajalakridasakto gopaviceshtitah || 108|| hridayakarahridbhusho yashtiman gokulanugah | gavam
    hunkritisamprito gavalidhapadambujah || 109|| gogopatranasushranta ashrami gopavijitah | patheyashanasampritah
    skandhashikyo mukhambupah || 110|| kshetraparopitakshetro raksho'dhikritabhairavah | karyakaranasanghatastatakantastu
    rakshaha || 111|| hanta tarapatistutyo yakshah kshetram trayivapuh | pranjalirlolanayano navanitashanapriyah
    || 112|| yashodatarjitah kshirataskaro bhandabhedanah | mukhashano matrivashyo matridrishyamukhantarah
    || 113|| vyattavaktro gatabhayo mukhalakshyajagattrayah | yashodastutisamprito nandavijnatavaibhavah
    || 114|| samsaranaukadharmajno jnananishtho dhanarjakah | kuberah kshatranidhanam brahmarshirbrahmanapriyah
    || 115|| brahmashapapratishthata yadurajakulantakah | yudhishthirasakho yuddhadakshah kurukulantakrit
    || 196|| ajamiloddharakari ganikamocano guruh | jambavadyuddharasikah syamantamanibhushanah || 117||
    subhadrabandhurakruravandito gadapurvajah | balanujo bahuyuddharasiko mayamocanah || 118|| dagdhakhandavasampritahutasho
    havanapriyah | udyadadityasankashavasano hanumadrucih || 119|| bhishmabanavranakirnah sarathyanipuno
    guni | bhishmapratibhatashcakradharah samprinitarjunah || 120|| svapratijnahanihrishto manatito viduragah
    | viragi vishayasakto vaikuntho'kunthavaibhavah || 129|| sankalpah kalpanatitah samadhirnirvikalpakah
    | savikalpo vrittishunyo vrittirbijamatigatah || 122|| mahadevo'khiloddhari vedanteshu pratishthitah
    | tanurbrihattanuranvarajapujyo'jaro'marah || 123|| bhimahatajarasandhah prarthitayudhasangarah |
    svasanketaprakliptartho nirarthyo'rthi nirakritih || 124|| gunakshobhah samagunah sadgunadhyah pramaprajah
    | svangajah satyakibhrata sanmargo bhaktabhushanah || 125|| akaryakaryanirvedo vedo gopankanidritah
    | anatho davapo davo dahako durdharo'hatah || 126|| ritavagyacako viprah kharva indrapadapradah |
    balimurdhasthitapado baliyajnavighatakrit || 127|| yajnapurtiryajnamurtiryajnavighnamavighnakrit |
    balidvahstho danashilo danashilapriyo vrati || 128|| avrato jatukagarasthitapandavajivanam | margadarshi
    mridurheladurikritajagadbhayah || 129|| saptapatalapado'sthiparvato drumaromakah | udumali grahabhusho
    dik shrutistatinishirah || 130|| vedashvaso jitashvasashcittasthashcittashuddhikrit | dhih smritih
    pushtirajayah tushtih kantirdhritistrapa || 131|| halah krishih kalam vrishtirgrishtirgauravanam vanam
    | kshiram havyam havyavaho homo vedi samitsruvah || 132|| karma karmaphalam svargo bhushyo bhusha
    mahaprabhuh | bhurbhuvahsvarmaharloko janolokastapojanah || 133|| satyo vidhirdaivamadholokah patalamandanah
    | jarayujah svedajanirudbijah kulaparvatah || 134|| kulastambhah sarvakulah kulabhuh kauladuragah
    | dharmatatvam nirvishayo vishayo bhogalalasah || 135|| vedantasaro nirmokta jivo baddho bahirmukhah
    | pradhanam prakritirvishvadrashta vishvanishedhanah || 136|| antashcaturdvaramayo bahirdvaracatushtayah
    | bhuvanesho kshetradevo'nantakayo vinayakah || 137|| pita mata suhridvandhurbhrata shraddham yamo'ryama
    | vishvedevah shraddhadevo manurnandimukho dhanuh || 138|| hetih khadgo ratho yuddham yuddhakarta
    sharo gunah | yasho yashoripuh shatrurashatrurvijitendriyah || 139|| patram data dapayita deshah kalo
    dhanagamah | kancanam prema sanmitram putrah kosho vikoshakah || 140|| anitih sharabho himsro dvipo
    dvipi dvipankushah | yanta nigada alanam sanmano gajasha
  devanagari: इष्टिकायां समपदं तिष्ठन्तं पुरुषोत्तमम् । जङ्घजस्थकरद्वन्द्वं क्षुल्लकादामभूषणम् ॥ १५॥ सव्यासव्यकरोद्भासिपद्मशङ्खविभूषितम्
    । दरहासस्मेरमुखं शिक्यस्कन्धं दिगम्बरम् ॥ १६॥ सर्वालङ्कारसंयुक्तं ब्रह्मादिगणसेवितम् । ज्ञानानन्दमयं
    देवं ध्यायामि हृदि विठ्ठलम् ॥ १७॥ अथ स्तोत्रम् । क्लीं विठ्ठलः पाण्डुरङ्गेश ईशः श्रीशो विशेषजित् ।
    शेषशायी शम्भुवन्द्यः शरण्यः शङ्करप्रियः ॥ १॥ चन्द्रभागासरोवासः कोटिचन्द्रप्रभास्मितः । विधाधृसूचितः
    सर्वप्रमाणातीत अव्ययः ॥ २॥ पुण्डरीकस्तुतो वन्द्यो भक्तचित्तप्रसादकः । स्वधर्मनिरतः प्रीतो गोगोपीपरिवारितः
    ॥ ३॥ गोपिकाशतनीराज्यः पुलिनाक्रीड आत्मभूः । आत्माऽऽत्माराम आत्मस्थः आत्मारामनिषेवितः ॥ ४॥ सच्चित्सुखं
    महामायी महदव्यक्तमद्भुतः । स्थूलरूपः सूक्ष्मरूपः कारणं परमञ्जनम् ॥ ५॥ महाकारणमाधारः अधिष्ठानं प्रकाशकः
    । कञ्जपादो रक्तनखो रक्तपादतलः प्रभुः ॥ ६॥ साम्राज्यचिह्नितपदो नीलगुल्फः सुजङ्घकः । सज्जानुः कदलीस्तम्भनिभोरुरुरुविक्रमः
    ॥ ७॥ पीताम्बरावृतकटिः क्षुल्लकादामभूषणः । कटिविन्यस्तहस्ताब्जः शङ्खी पद्मविभूषितः ॥ ८॥ गम्भीरनाभिर्ब्रह्माधिष्ठितनाभिसरोरुहः
    । त्रिवलीमण्डितोदारोदरोमावलिमालिनः ॥ ९॥ कपाटवक्षाः श्रीवत्सभूषितोराः कृपाकरः । वनमाली कम्बुकण्ठः सुस्वरः
    सामलालसः ॥ १०॥ कञ्जवक्त्रः श्मश्रुहीनचुबुको वेदजिह्वकः । दाडिमीबीजसदृशरदो रक्ताधरो विभुः ॥ ११॥ नासामुक्तापाटलिताधरच्छविररिन्दमः
    । शुकनासः कञ्जनेत्रः कुण्डलाक्रमितांसकः ॥ १२॥ महाबाहुर्घनभुजः केयूराङ्गदमण्डितः । रत्नभूषितभूषाढ्यमणिबन्धः
    सुभूषणः ॥ १३॥ रक्तपाणितलः स्वङ्गः सन्मुद्रामण्डिताङ्गुलिः । नखप्रभारञ्जिताब्जः सर्वसौन्दर्यमण्डितः
    ॥ १४॥ सुभ्रूरर्धशशिप्रख्यललाटः कामरूपधृक् । कुङ्कुमाङ्कितसद्भालः सुकेशो बर्हभूषणः ॥ १५॥ किरीटभाव्याप्तनभो
    विकलीकृतभास्करः । वनमाली पतिवासाः शार्ङ्गचापोऽसुरान्तकः ॥ १६॥ दर्पापहः कंसहन्ता चाणूरमुरमर्दनः । वेणुवादनसन्तुष्टो
    दध्यन्नास्वादलोलुपः ॥ १७॥ जितारिः कामजनकः कामहा कामपूरकः । विक्रोधो दारितामित्रो भूर्भुवःसुवरादिराट्
    ॥ १८॥ अनादिरजनिर्जन्यजनको जाह्नवीपदः । बहुजन्मा जामदग्न्यः सहस्रभुजखण्डनः ॥ ९९॥ कोदण्डधारी जनकपूजितः
    कमलाप्रियः । पुण्डरीकभवद्वेषी पुण्डरीकभवप्रियः ॥ २०॥ पुण्डरीकस्तुतिरसः सद्भक्तपरिपालकः । सुषुमालासङ्गमस्थो
    गोगोपीचित्तरञ्जनः ॥ २१॥ इष्टिकास्थो भक्तवश्यस्त्रिमूर्तिर्भक्तवत्सलः । लीलाकृतजगद्धामा जगत्पालो हरो
    विराट् ॥ २२॥ अश्वत्थपद्मतीर्थस्थो नारदस्तुतवैभवः । प्रमाणातीततत्त्वज्ञस्तत्त्वम्पदनिरूपितः ॥ २३॥ अजाजनिरजाजानिरजायो
    नीरजोऽमलः । लक्ष्मीनिवासः स्वर्भूषो विश्ववन्द्यो महोत्सवः ॥ २४॥ जगद्योनिरकर्ताऽऽद्यो भोक्ता भोग्यो
    भवातिगः । षड्गुणैश्वर्यसम्पन्नो भगवान्मुक्तिदायकः ॥ २५॥ अधःप्राणो मनो बुद्धिः सुषुप्तिः सर्वगो हरिः
    । मत्स्यः कूर्मो वराहोऽत्रिर्वामनो हीररूपधृत् ॥ २६॥ नारसिंहो ऋषिर्व्यासो रामो नीलांशुको हली । बुद्धोऽर्हन्
    सुगतः कल्की नरो नारायणः परः ॥ २७॥ परात्परः करीड्येशो नक्रशापविमोचनः । नारदोक्तिप्रतिष्ठाता मुक्तकेशी
    वरप्रदः ॥ २८॥ चन्द्रभागाप्सु सुस्नातः कामितार्थप्रदोऽनघः । तुलसीदामभूषाढ्यस्तुलसीकाननप्रियः ॥ २९॥
    पाण्डुरङ्गः क्षेत्रमूर्तिः सर्वमूर्तिरनामयः । पुण्डरीकव्याजकृतजडोद्धारः सदागतिः ॥ ३०॥ अगतिः सद्गतिः
    सभ्यो भवो भव्यो विधीडितः । प्रलम्बघ्नो द्रुपदजाचिन्ताहारी भयापहः ॥ ३१॥ वह्निवक्त्रः सूर्यनुतो विष्णुस्त्रैलोक्यरक्षकः
    । जगद्भक्ष्यो जगद्गेहो जनाराध्यो जनार्दनः ॥ ३२॥ जेता विष्णुर्वरारोहो भीष्मपूज्यपदाम्बुजः । भर्ता भीष्णकसम्पूज्यः
    शिशुपालवधोद्यतः ॥ ३३॥ शतापराधसहनः क्षमावानादिपूजनः । शिशुपालशिरच्छेत्ता दन्तवक्त्रबलापहः ॥ ३४॥ शिशुपालकृतद्रोहः
    सुदर्शनविमोचनः ॥ ३५॥ सश्रीः समायो दामेन्द्रः सुदामक्रीडनोत्सुकः । वसुदामकृतक्रीडः किङ्किणीदामसेवितः
    ॥ ३६॥ पञ्चाङ्गपूजनरतः शुद्धचित्तवशंवदः । रुक्मिणीवल्लभः सत्यभामाभूषितविग्रहः ॥ ३७॥ नाग्नजित्या कृतोत्साहः
    सुनन्दाचित्तमोहनः । मित्रवृन्दाऽऽलिङ्गिताङ्गो ब्रह्मचारी वटुप्रियः ॥ ३८॥ सुलक्षणाधौतपदो जाम्बवत्या
    कृतादरः । सुशीलाशीलसन्तुष्टो जलकेलिकृतादरः ॥ ३९॥ वासुदेवो देवकीड्यो नन्दानन्दकराङ्घ्रियुक् । यशोदामानसोल्लासो
    बलावरजनिःस्वभूः ॥ ४०॥ सुभद्राऽऽनन्ददो गोपवश्यो गोपीप्रियोऽजयः । मन्दारमूलवेदिस्थः सन्तानतरुसेवितः
    ॥ ४१॥ पारिजातापहरणः कल्पद्रुमपुरःसरः । हरिचन्दनलिप्ताङ्ग इन्द्रवन्द्योऽग्निपूजितः ॥ ४२॥ यमनेता नैरृतेयो
    वरुणेशः खगप्रियः । कुबेरवन्द्य ईशेशो विधीड्योऽनन्तवन्दितः ॥ ४३॥ वज्री शक्तिर्दण्डधरः खड्गी पाश्यङ्कुशी
    गदी । त्रिशूली कमली चक्री सत्यव्रतमयो नवः ॥ ४४॥ महामन्त्रः प्रणवभूर्भक्तचिन्तापहारकः । स्वक्षेत्रवासी
    सुखदः कामी भक्तविमोचनः ॥ ४५॥ स्वनामकीर्तनप्रीतः क्षेत्रेशः क्षेत्रपालकः । कामश्चक्रधरार्धश्च त्रिविक्रममयात्मकः
    ॥ ४६॥ प्रज्ञानकरजित्कान्तिरूपवर्णः स्वरूपवान् । स्पर्शेन्द्रियं शौरिमयो वैकुण्ठः सानिरुद्धकः ॥ ४७॥
    षडक्षरमयो बालः श्रीकृष्णो ब्रह्मभावितः । नारदाधिष्ठितक्षेमो वेणुवादनतत्परः ॥ ४८॥ नारदेशप्रतिष्ठाता
    गोविन्दो गरुडध्वजः । साधारणः समः सौम्यः कलावान् कमलालयः ॥ ४९॥ क्षेत्रपः क्षणदाधीशवक्त्रः क्षेमकरक्षणः
    । लवो लवणिमाधाम लीलावान् लघुविग्रहः ॥ ५०॥ हयग्रीवो हली हंसो हतकंसो हलिप्रियः । सुन्दरः सुगतिर्मुक्तः
    सत्सखो सुलभः स्वभूः ॥ ५१॥ साम्राज्यदः सामराजः सत्ता सत्यः सुलक्षणः । षड्गुणैश्वर्यनिलयः षडृतुपरिसेवितः
    ॥ ५२॥ षडङ्गशोधितः षोढा षड्दर्शननिरूपितः । शेषतल्पः शतमखः शरणागतवत्सलः ॥ ५३॥ सशम्भुः समितिः शङ्खवहः
    शार्ङ्गसुचापधृत् । वह्नितेजा वारिजास्यः कविर्वंशीधरो विगः ॥ ५४॥ विनीतो विप्रियो वालिदलनो वज्रभूषणः
    । रुक्मिणीशो रमाजानी राजा राजन्यभूषणः ॥ ५५॥ रतिप्राणप्रियपिता रावणान्तो रघूद्वहः । यज्ञभोक्ता यमो
    यज्ञभूषणो यज्ञदूषणः ॥ ५६॥ यज्वा यशोवान् यमुनाकूलकुञ्जप्रियो यमी । मेरुर्मनीषी महितो मुदितः श्यामविग्रहः
    ॥ ५७॥ मन्दगामी मुग्धमुखो महेशो मीनविग्रहः । भीमो भीमाङ्गजातीरवासी भीमार्तिभञ्जनः ॥ ५८॥ भूभारहरणो भूतभावनो
    भरताग्रजः । बलं बलप्रियो बालो बालक्रीडनतत्परः ॥ ५९॥ बकासुरान्तको बाणासुरदर्पकवाडवः । बृहस्पतिबलारातिसूनुर्बलिवरप्रदः
    ॥ ६०॥ बोद्धा बन्धुवधोद्युक्तो बन्धमोक्षप्रदो बुधः । फाल्गुनानिष्टहा फल्गुकृतारातिः फलप्रदः ॥ ६९॥ फेनजातैरकावज्रकृतयादवसङ्क्षयः
    । फाल्गुनोत्सवसंसक्तः फणितल्पः फणानटः ॥ ६२॥ पुण्यः पवित्रः पापात्मदूरगः पण्डिताग्रणीः । पोषणः पुलिनावासः
    पुण्डरीकमनोर्वशः ॥ ६३॥ निरन्तरो निराकाङ्क्षो निरातङ्को निरञ्जनः । निर्विण्णमानसोल्लासो नयनानन्दनः
    सताम् ॥ ६४॥ नियमो नियमी नम्यो नन्दबन्धनमोचनः । निपुणो नीतिमान्नेता नरनारायणवपुः ॥ ६५॥ धेनुकासुरविद्वेषी
    धाम धाता धनी धनम् । धन्यो धन्यप्रियो धर्ता धीमान् धर्मविदुत्तमः ॥ ६६॥ धरणीधरसन्धर्ता धराभूषितदंष्ट्रकः
    । दैतेयहन्ता दिग्वासा देवो देवशिखामणिः ॥ ६७॥ दाम दाता दीप्तिभानुः दानवादमिता दमः । स्थिरकार्यः स्थितप्रज्ञः
    स्थविरस्थापकः स्थितिः । स्थितलोकत्रयवपुः स्थितिप्रलयकारणम् ॥ ६८॥ स्थापकस्तीर्थचरणस्तर्पकस्तरुणीरसः
    । तारुण्यकेलिनिपुणस्तरणस्तरणिप्रभुः ॥ ६९॥ तोयमूर्तिस्तमोऽतीतः स्तम्भोद्भूतस्तपःपरः । तडिद्वासास्तोयदाभस्तारस्तारस्वरप्रियः
    ॥ ७०॥ णकारो ढौकितजगत्त्रितूर्यप्रीतभूसुरः । डमरूप्रियहृद्वासी डिण्डिमध्वनिगोचरः ॥ ७१॥ ठयुगस्थमनोर्गम्यः
    ठङ्कारि धनुरायुधः । टणत्कारितकोदण्डहतारिर्गणसौख्यदः ॥ ७२॥ झाङ्कारिचाञ्चरीकाङ्की श्रुतिकल्हारभूषणः
    । जरासन्धार्दितजगत्सुखभूर्जङ्गमात्मकः ॥ ७३॥ जगज्जनिर्जगद्भूषो जानकीविरहाकुलः । जिष्णुशोकापहरणो जन्महीनो
    जगत्पतिः ॥ ७४॥ छत्रिताहीन्द्रसुभगः छद्मी छत्रितभूधरः । छायास्थलोकत्रितयछलेन बलिनिग्रही ॥ ७५॥ चेतश्चमत्कारकरः
    चित्री चित्रस्वभाववान् । चारुभूश्चन्द्रचूडश्च चन्द्रकोटिसमप्रभः ॥ ७६॥ चूडारत्नद्योतिभालश्चलन्मकरकुपडलः
    । चरुभुक् चयनप्रीतश्चम्पकाटविमध्यगः ॥ ७७॥ चाणूरहन्ता चन्द्राङ्कनाशनश्चन्द्रदीधितिः । चन्दनालिप्तसर्वाङ्गश्चारुचामरमण्डितः
    ॥ ७८॥ घनश्यामो घनरवो घटोत्कचपितृप्रियः । घनस्तनीपरीवारो घनवाहनगर्वहा ॥ ७९॥ गङ्गापदो गतक्लेशो गतक्लेशनिषेवितः
    । गणनाथो गजोद्धर्ता गायको गायनप्रियः ॥ ८०॥ गोपतिर्गोपिकावश्यो गोपबालानुगः पतिः । गणकोटिपरीवारो गम्यो
    गगननिर्मलः ॥ ८१॥ गायत्रीजपसम्प्रीतो गण्डकीस्थो गुहाशयः । गुहारण्यप्रतिष्ठाता गुहासुरनिषूदनः ॥ ८२॥
    गीतकीर्तिर्गुणारामो गोपालो गुणवर्जितः । गोप्रियो गोचरप्रीतो गाननाट्यप्रवर्तकः ॥ ८३॥ खट्वायुधः खरद्वेषी
    खातीतः खगमोचनः । खगपुच्छकृतोत्तंसः खेलद्बालकृतप्रियः ॥ ८४॥ खट्वाङ्गपोथितारातिः खञ्जनाक्षः खशीर्षकः
    । कलवंशरवाक्रान्तगोपीविस्मारितार्भकः ॥ ८५॥ कलिप्रमाथी कञ्जास्यः कमलायतलोचनः । कालनेमिप्रहरणः कुण्ठितार्तिकिशोरकः
    ॥ ८६॥ केशवः केवलः कण्ठीरवास्यः कोमलाङ्घ्रियुक् । कम्बली कीर्तिमान् कान्तः करुणामृतसागरः ॥ ८७॥ कुब्जासौभाग्यदः
    कुब्जाचन्दनालिप्तगात्रकः । कालः कुवलयापीडहन्ता क्रोधसमाकुलः ॥ ८८॥ कालिन्दीपुलिनाक्रीडः कुञ्जकेलिकुतूहली
    । काञ्चनं कमलाजानिः कलाज्ञः कामितार्थदः ॥ ८९॥ कारणं करणातीतः कृपापूर्णः कलानिधिः । क्रियारूपः क्रियातीतः
    कालरूपः क्रतुप्रभुः ॥ ९०॥ कटाक्षस्तम्भितारातिः कुटिलालकभूषितः । कूर्माकारः कालरूपी करीरवनमध्यगः ॥
    ९१॥ कलकण्ठी कलरवः कलकण्ठरुतानुकृत् । करद्वारपुरः कूटः सर्वेषां कवलप्रियः ॥ ९२॥ कलिकल्मषहा क्रान्तगोकुलः
    कुलभूषणः । कूटारिः कुतुपः कीशपरिवारः कविप्रियः ॥ ९३॥ कुरुवन्द्यः कठिनदोर्दण्डखण्डितभूभरः । किङ्करप्रियकृत्कर्मरतभक्तप्रियङ्करः
    ॥ ९४॥ अम्बुजास्योऽङ्गनाकेलिरम्बुशाय्यम्बुधिस्तुतः । अम्भोजमाल्यम्बुवाहलसदङ्गोऽन्त्रमालकः ॥ ९५॥ औदुम्बरफलप्रख्यब्रह्माण्डावलिचालकः
    । ओष्ठस्फुरन्मुरलिकारवाकर्षितगोकुलः ॥ ९६॥ ऐरावतसमारूढ ऐन्द्रीशोकापहारकः । ऐश्वर्यावधिरैश्वर्यमैश्वर्याष्टदलस्थितः
    ॥ ९७॥ एणशावसमानाक्ष एधस्तोषितपावकः । एनोऽन्तकृन्नामधेयस्मृतिसंसृतिदर्पहा ॥ ९८॥ लूनपञ्चक्लेशपदो लूतातन्तुर्जगत्कृतिः
    । लुप्तदृश्यो लुप्तजगज्जयो लुप्तसुपावकः ॥ ९९॥ रूपातीतो रूपनामरूपमायादिकारणम् । ऋणहीनो ऋद्धिकारी ऋणातीतो
    ऋतंवदः ॥ १००॥ उषानिमित्तबाणघ्न उषाहार्यूर्जिताशयः । ऊर्ध्यरूपोर्ध्वाधरग ऊष्मदग्धजगत्त्रयः ॥ १०१॥ उद्धवत्राणनिरत
    उद्धवज्ञानदायकः । उद्धर्तोद्धव उन्निद्र उद्बोध उपरिस्थितः ॥ १०२॥ उदधिक्रीड उदधितनयाप्रिय उत्सवः ।
    उच्छिन्नदेवतारातिरुदध्यावृतिमेखलः ॥ १०३॥ ईतिघ्न ईशिता ईज्य ईड्य ईहाविवर्जितः । ईशध्येयपदाम्भोज इन
    ईनविलोचनः ॥ १०४॥ इन्द्र इन्द्रानुजनट इन्दिराप्राणवल्लभः । इन्द्रादिस्तुत इन्द्रश्रीरिदमित्थमभीतकृत्
    ॥ १०५॥ आनन्दाभास आनन्द आनन्दनिधिरात्मदृक् । आयुरार्तिघ्न आयुष्य आदिरामयवर्जितः ॥ १०६॥ आदिकारणमाधार
    आधारादिकृताश्रयः । अच्युतैश्वर्यममित अरिनाश अघान्तकृत् ॥ १०७॥ अन्नप्रदोऽन्नमखिलाधार अच्युत अब्जभृत्
    । चन्द्रभागाजलक्रीडासक्तो गोपविचेष्टितः ॥ १०८॥ हृदयाकारहृद्भूषो यष्टिमान् गोकुलानुगः । गवां हुङ्कृतिसम्प्रीतो
    गवालीढपदाम्बुजः ॥ १०९॥ गोगोपत्राणसुश्रान्त अश्रमी गोपवीजितः । पाथेयाशनसम्प्रीतः स्कन्धशिक्यो मुखाम्बुपः
    ॥ ११०॥ क्षेत्रपारोपितक्षेत्रो रक्षोऽधिकृतभैरवः । कार्यकारणसङ्घातस्ताटकान्तस्तु रक्षहा ॥ १११॥ हन्ता
    तारापतिस्तुत्यो यक्षः क्षेत्रं त्रयीवपुः । प्राञ्जलिर्लोलनयनो नवनीताशनप्रियः ॥ ११२॥ यशोदातर्जितः क्षीरतस्करो
    भाण्डभेदनः । मुखाशनो मातृवश्यो मातृदृश्यमुखान्तरः ॥ ११३॥ व्यात्तवक्त्रो गतभयो मुखलक्ष्यजगत्त्रयः ।
    यशोदास्तुतिसम्प्रीतो नन्दविज्ञातवैभवः ॥ ११४॥ संसारनौकाधर्मज्ञो ज्ञाननिष्ठो धनार्जकः । कुबेरः क्षत्रनिधनं
    ब्रह्मर्षिर्ब्राह्मणप्रियः ॥ ११५॥ ब्रह्मशापप्रतिष्ठाता यदुराजकुलान्तकः । युधिष्ठिरसखो युद्धदक्षः कुरुकुलान्तकृत्
    ॥ १९६॥ अजामिलोद्धारकारी गणिकामोचनो गुरुः । जाम्बवद्युद्धरसिकः स्यमन्तमणिभूषणः ॥ ११७॥ सुभद्राबन्धुरक्रूरवन्दितो
    गदपूर्वजः । बलानुजो बाहुयुद्धरसिको मयमोचनः ॥ ११८॥ दग्धखाण्डवसम्प्रीतहुताशो हवनप्रियः । उद्यदादित्यसङ्काशवसनो
    हनुमद्रुचिः ॥ ११९॥ भीष्मबाणव्रणाकीर्णः सारथ्यनिपुणो गुणी । भीष्मप्रतिभटश्चक्रधरः सम्प्रीणितार्जुनः
    ॥ १२०॥ स्वप्रतिज्ञाहानिहृष्टो मानातीतो विदूरगः । विरागी विषयासक्तो वैकुण्ठोऽकुण्ठवैभवः ॥ १२९॥ सङ्कल्पः
    कल्पनातीतः समाधिर्निर्विकल्पकः । सविकल्पो वृत्तिशून्यो वृत्तिर्बीजमतीगतः ॥ १२२॥ महादेवोऽखिलोद्धारी
    वेदान्तेषु प्रतिष्ठितः । तनुर्बृहत्तनूरण्वराजपूज्योऽजरोऽमरः ॥ १२३॥ भीमाहतजरासन्धः प्रार्थितायुधसङ्गरः
    । स्वसङ्केतप्रकॢप्तार्थो निरर्थ्योऽर्थी निराकृतिः ॥ १२४॥ गुणक्षोभः समगुणः सद्गुणाढ्यः प्रमाप्रजः ।
    स्वाङ्गजः सात्यकिभ्राता सन्मार्गो भक्तभूषणः ॥ १२५॥ अकार्यकार्यनिर्वेदो वेदो गोपाङ्कनिद्रितः । अनाथो
    दावपो दावो दाहको दुर्धरोऽहतः ॥ १२६॥ ऋतवाग्याचको विप्रः खर्व इन्द्रपदप्रदः । बलिमूर्धस्थितपदो बलियज्ञविघातकृत्
    ॥ १२७॥ यज्ञपूर्तिर्यज्ञमूर्तिर्यज्ञविघ्नमविघ्नकृत् । बलिद्वाःस्थो दानशीलो दानशीलप्रियो व्रती ॥ १२८॥
    अव्रतो जतुकागारस्थितपाण्डवजीवनम् । मार्गदर्शी मृदुर्हेलादूरीकृतजगद्भयः ॥ १२९॥ सप्तपातालपादोऽस्थिपर्वतो
    द्रुमरोमकः । उडुमाली ग्रहाभूषो दिक् श्रुतिस्तटिनीशिरः ॥ १३०॥ वेदश्वासो जितश्वासश्चित्तस्थश्चित्तशुद्धिकृत्
    । धीः स्मृतिः पुष्टिरजयः तुष्टिः कान्तिर्धृतिस्त्रपा ॥ १३१॥ हलः कृषिः कलं वृष्टिर्गृष्टिर्गौरवनं वनम्
    । क्षीरं हव्यं हव्यवाहो होमो वेदी समित्स्रुवः ॥ १३२॥ कर्म कर्मफलं स्वर्गो भूष्यो भूषा महाप्रभुः ।
    भूर्भुवःस्वर्महर्लोको जनोलोकस्तपोजनः ॥ १३३॥ सत्यो विधिर्दैवमधोलोकः पातालमण्डनः । जरायुजः स्वेदजनिरुद्बीजः
    कुलपर्वतः ॥ १३४॥ कुलस्तम्भः सर्वकुलः कुलभूः कौलदूरगः । धर्मतत्वं निर्विषयो विषयो भोगलालसः ॥ १३५॥ वेदान्तसारो
    निर्मोक्ता जीवो बद्धो बहिर्मुखः । प्रधानं प्रकृतिर्विश्वद्रष्टा विश्वनिषेधनः ॥ १३६॥ अन्तश्चतुर्द्वारमयो
    बहिर्द्वारचतुष्टयः । भुवनेशो क्षेत्रदेवोऽनन्तकायो विनायकः ॥ १३७॥ पिता माता सुहृद्वन्धुर्भ्राता श्राद्धं
    यमोऽर्यमा । विश्वेदेवाः श्राद्धदेवो मनुर्नान्दीमुखो धनुः ॥ १३८॥ हेतिः खड्गो रथो युद्धं युद्धकर्ता
    शरो गुणः । यशो यशोरिपुः शत्रुरशत्रुर्विजितेन्द्रियः ॥ १३९॥ पात्रं दाता दापयिता देशः कालो धनागमः ।
    काञ्चनं प्रेम सन्मित्रं पुत्रः कोशो विकोशकः ॥ १४०॥ अनीतिः शरभो हिंस्रो द्विपो द्वीपी द्विपाङ्कुशः
    । यन्ता निगड आलानं सन्मनो गजश
