id: raghavendrakshamapanastotram-2
category: raksha
name:
  english: raghavendrakshamapanastotram
  devanagari: राघवेन्द्रक्षमापणस्तोत्रम्
content:
  english: yyenam nityam manase me vasantam | smaram smaram stharatapavilo'pi svaccho'ham shriraghavendraprasadat
    || 3|| yasmadasmin raghavendraryatantre purne jate svapna evam vidho'bhut | tasmadasya shravanat pathato'pi
    pranadvarenaparokshyam hareh syat || 4|| lakshmikante svaparokshikrite'smin kim dussadhyam duhkhabandham
    katham syat | grantham camum raghavendraryatatah svicakre yattena casam kritarthah || 5|| tvam me
    mata tvam pita tvam sakha ca tva me bandhuh tvam ca data dayaluh | tvam me raja palakastvam gurushca
    putro'ham te pahi mam raghavendra || 6|| sarvajna tvam mamakam sarvavrittam janasyeva pratyaham kim
    vadami | ye ye papah santi lokeshu tesham agre ganye nasti me tadguno'nuh || 7|| etadriksham coddharermam
    vidheyam satyam khyatam te dayalutvametat | sarvam tvayyevarpitam madgurutvat karyakaryam karma tattatphalam
    ca || 8|| tatra svikurvatmano yadyadishtam putratvanme'thetaratvam sahasva | atra proktam me ritam
    va'nritam va tata kshantva modamuccairupagah || 9|| tata shrigururaghavendrayatirat shriraghavendraprabho
    lokaganyagunaughalalita tava stotraya na'lam vacah | na'lam buddhirabhuttava stavavidhiprotsahamanasya
    me kintu shrutripathajjanalasataya te cajnaya puryate || 10|| yasya yasyasti durdaivamulanirnashanarhata
    | tasya tasyaiva tantre'smin asthastityabravidguruh || 11|| aham shrigururajena pitra pratyakshacoditah
    | rahasyam saphalam cashta na dushye vidusham dhuri || 12|| iti krishnavadhutena vashyavani vilasina
    | shrigurupremaputrena gururajaprasadatah || 13|| kritam shriraghavendraryatatram sadyah phalapradam
    | priyatam tena gururat hridgatau madhvamadhavau || 14|| gururaja pita'si me kripavaniti nishcitya
    mayoddhatam vyabhani | tvadananyagatermamanritoktih sutavatsalyataya kurushva satyah || 15|| anrinamayacanamashramamabhayam
    nyayyam yatheshtamaprayatnam | ashanam vasanam sadanam datum bhoktum dadasi cet tadalam || 16|| iti
    shrimatkrishnavadhutapanditakritau shriraghavendratantre caturdashapatale kshamapanastotram sampurnam
    |
  devanagari: य्येनं नित्यं मानसे मे वसन्तम् । स्मारं स्मारं स्थारतापाविलोऽपि स्वच्छोऽहं श्रीराघवेन्द्रप्रसादात्
    ॥ ३॥ यस्मादस्मिन् राघवेन्द्रार्यतन्त्रे पूर्णे जाते स्वप्न एवं विधोऽभूत् । तस्मादस्य श्रावणात् पाठतोऽपि
    प्राणद्वारेणापरोक्ष्यं हरेः स्यात् ॥ ४॥ लक्ष्मीकान्ते स्वापरोक्षीकृतेऽस्मिन् किं दुस्साध्यं दुःखबन्धं
    कथं स्यात् । ग्रन्थं चामुं राघवेन्द्रार्यतातः स्वीचक्रे यत्तेन चासं कृतार्थः ॥ ५॥ त्वं मे माता त्वं
    पिता त्वं सखा च त्व मे बन्धुः त्वं च दाता दयालुः । त्वं मे राजा पालकस्त्वं गुरुश्च पुत्रोऽहं ते पाहि
    मां राघवेन्द्र ॥ ६॥ सर्वज्ञ त्वं मामकं सर्ववृत्तं जानस्येव प्रत्यहं किं वदामि । ये ये पापाः सन्ति
    लोकेषु तेषां अग्रे गण्ये नास्ति मे तद्गुणोऽणुः ॥ ७॥ एतादृक्षं चोद्धरेर्मां विधेयं सत्यं ख्यातं ते
    दयालुत्वमेतत् । सर्वं त्वय्येवार्पितं मद्गुरुत्वात् कार्याकार्यं कर्म तत्तत्फलं च ॥ ८॥ तत्र स्वीकुर्वात्मनो
    यद्यदिष्टं पुत्रत्वान्मेऽथेतरत्वं सहस्व । अत्र प्रोक्तं मे ऋतं वाऽनृतं वा तात क्षान्त्वा मोदमुच्चैरुपागाः
    ॥ ९॥ तात श्रीगुरुराघवेन्द्रयतिराट् श्रीराघवेन्द्रप्रभो लोकागण्यगुणौघलालित तव स्तोत्राय नाऽलं वचः ।
    नाऽलं बुद्धिरभूत्तव स्तवविधिप्रोत्साहमानस्य मे किन्तु श्रुतृपठज्जनालसतया ते चाज्ञया पूर्यते ॥ १०॥
    यस्य यस्यास्ति दुर्दैवमूलनिर्नाशनार्हता । तस्य तस्यैव तन्त्रेऽस्मिन् आस्थास्तीत्यब्रवीद्गुरुः ॥ ११॥
    अहं श्रीगुरुराजेन पित्रा प्रत्यक्षचोदितः । रहस्यं सफलं चष्टा न दूष्ये विदुषां धुरि ॥ १२॥ इति कृष्णावधूतेन
    वश्यवाणी विलासिना । श्रीगुरुप्रेमपुत्रेण गुरुराजप्रसादतः ॥ १३॥ कृतं श्रीराघवेन्द्रार्यतत्रं सद्यः
    फलप्रदम् । प्रीयतां तेन गुरुराट् हृद्गतौ मध्वमाधवौ ॥ १४॥ गुरुराज पिताऽसि मे कृपावानिति निश्चित्य मयोद्धतं
    व्यभाणि । त्वदनन्यगतेर्ममानृतोक्तिः सुतवात्सल्यतया कुरुष्व सत्याः ॥ १५॥ अनृणमयाचनमश्रममभयं न्याय्यं
    यथेष्टमप्रयत्नम् । अशनं वसनं सदनं दातुं भोक्तुं ददासि चेत् तदलम् ॥ १६॥ इति श्रीमत्कृष्णावधूतपण्डितकृतौ
    श्रीराघवेन्द्रतन्त्रे चतुर्दशपटले क्षमापणस्तोत्रं सम्पूर्णम् ।
