id: parameshvarastotram-4
category: stotram
name:
  english: parameshvarastotram 4
  devanagari: परमेश्वरस्तोत्रम् ४
content:
  english: parameshvarastotram 4 shrishvetayanavyasa uvaca | om namo yugarupaya namastishyadimokshine
    | balayogininathaya namaste balayogine || 1|| namo'sankhyacaritraya namashcanandavardhaye | namaste
    balakrishnaya balantaratmane namah || 2|| cidacidvapushe'nadishrikrishnaya namo namah | badrikapataye
    naranarayanatmane namah || 3|| sarvasaukhyavidhatre te sarvadharmadhikarine | yavalliladivasyaya namaste
    sadhurupine || 4|| sadhvishaktisumishraya svarnarekhajatadhrige | ekarasasvarupaya sarojanijushe namah
    || 5|| ekadha dashadha sahasradha kotyarbudabjadha | kantakanto'nvitashcaste prithak capi ca te namah
    || 6|| yo dadhara tu radhayah krite krishnam nijam vapuh | yashca shriyah krite narayano narayaneshvarah
    || 7|| yashca ramyam vasudevam vyuham dadhara srishtaye | yashca hiranmayam rupam vishnurupam dadhara
    ca || 8|| tatha tishya'rditanam tuddharaya tapasam vapuh | dharmaddadhara bhagavan naranarayanatmakam
    || 9|| sarvatha karunapurnam sadhushilasamanvitam | muktarshisevitam shantam tam namami pareshvaram
    || 1
  devanagari: परमेश्वरस्तोत्रम् ४ श्रीश्वेतायनव्यास उवाच । ॐ नमो युगरूपाय नमस्तिष्यादिमोक्षिणे । बालयोगिनीनाथाय
    नमस्ते बालयोगिने ॥ १॥ नमोऽसङ्ख्यचरित्राय नमश्चानन्दवार्धये । नमस्ते बालकृष्णाय बालान्तरात्मने नमः
    ॥ २॥ चिदचिद्वपुषेऽनादिश्रीकृष्णाय नमो नमः । बद्रिकापतये नरनारायणात्मने नमः ॥ ३॥ सर्वसौख्यविधात्रे
    ते सर्वधर्माधिकारिणे । यावल्लीलादिवास्याय नमस्ते साधुरूपिणे ॥ ४॥ साध्वीशक्तिसुमिश्राय स्वर्णरेखाजटाधृगे
    । एकरसस्वरूपाय सरोजनीजुषे नमः ॥ ५॥ एकधा दशधा सहस्रधा कोट्यर्बुदाब्जधा । कान्ताकान्तोऽन्वितश्चास्ते
    पृथक् चापि च ते नमः ॥ ६॥ यो दधार तु राधायाः कृते कृष्णं निजं वपुः । यश्च श्रियः कृते नारायणो नारायणेश्वरः
    ॥ ७॥ यश्च रम्यं वासुदेवं व्यूहं दधार सृष्टये । यश्च हिरण्मयं रूपं विष्णुरूपं दधार च ॥ ८॥ तथा तिष्याऽर्दितानां
    तूद्धाराय तापसां वपुः । धर्माद्दधार भगवान् नरनारायणात्मकम् ॥ ९॥ सर्वथा करुणापूर्णं साधुशीलसमन्वितम्
    । मुक्तर्षिसेवितं शान्तं तं नमामि परेश्वरम् ॥ १
