id: ashtakavacani-shivaproktani-kalikapuranantargatam
category: kavacha
name:
  english: ashtakavacani shivaproktani (kalikapuranantargatam)
  devanagari: अष्टकवचानि शिवप्रोक्तानि (कालिकापुराणान्तर्गतम्)
content:
  english: rishih anushtupchandah || 10|| katyayani devata | sarvakamarthasadhane viniyogah | ah patu
    purvakashthayamagneyyam patu kah sada || 11|| patu co yamakashthayam to nairrityam ca sarvada | mam
    patu to'sau pashcatye shaktirvayavyadiggata || 12|| yah patu mam cottarasyamaishanyam sastathavatu
    | murdhni rakshatu mam so'sau bahau mam dakshine tu kah || 13|| mam vamabahau cah patu hridi to mam
    sadavatu | tah patu kanthadeshe mam katyoh shaktistathavatu || 14|| yah patu dakshine pade sho mam
    vamapade tatha | yoginikavacam shailaputri tu purvasyamagneyyam patu candika || 15|| candraghanta
    patu yamyam yamabhitivivardhini | nairritye tvatha kushmandi patu mam jagatam prasuh || 16|| skandamata
    pashcimayam mam rakshatu sadaiva hi | katyayani mam vayavye patu lokeshvari sada || 17|| kalaratri
    tu kauberyam sada rakshatu mam svayam | mahagauri tathaishanyam satatam patu pavani || 18|| devaugha
    kavacam netrayorvasudevo mam patu nityam sanatanah | brahma mam patu vadane padmayonirayonijah ||
    19|| nasabhage rakshatu mam sarvada candrashekharah | gajavaktrah stanayugme patu nityam haratmajah
    || 20|| vamadakshinapanyormam nityam patu divakarah | mahamaya svayam nabhau mam patu parameshvari
    || 21|| mahalakshmih patu guhye janunoshca sarasvati | devidikkavacam mahamaya purvabhage nityam rakshatu
    mam shubha || 22|| agnijvala tathagneyyam payannityam varasini | rudrani patu mam yamyam nairrityam
    candanayika || 23|| ugracanda pashcimayam patu nityam maheshvari | pracanda patu vayavye kauberyam
    ghorarupini || 24|| ishvari ca tathaishanyam patu nityam sanatani | urdhvam patu mahamaya patvadhah
    parameshvari || 25|| parshvakavacam agratah patu mamugra prishthato vaishnavi tatha | brahmani dakshine
    parshve nityam rakshatu shobhana || 26|| maheshvari vamaparshve nityam payadvrishadhvaja | avyayakavacam
    kaumari parvate patu varahi salile ca mam || 27|| narasimhi damshtribhaye patu mam vipineshu ca |
    aindri mam patu cakashe tatha sarvajale sthale || 28|| setuh sarvangulih patu devadih patu karnayoh
    | devantashcibuke patu parshvayoh shaktipancamah || 29|| shadvarnakavacam ha patu mam tathaivorvormaya
    rakshatu janghayoh | sarvendriyani yah patu romakupeshu sarvada || 30|| tvaci mam vai sada patu mam
    shambhuh patu sarvada | nakhadantakaroshthadau ram mam patu sadaiva hi || 31|| devadih patu mam vastau
    devantah stanakakshayoh | etadadau tu yah seturbahye mam patu dehatah || 32|| abhedyakavacam ajnacakre
    sushumnayam shatcakre hridi sandhishu | adishodashacakre ca lalatakasha eva ca || 33|| vaishnavitantramantro
    mam nityam rakshamshca tishthatu | arnanadishu sarvasu parshvakakshashikhasu ca || 34|| 34 || rudhirasnayumajjasu
    mastishkeshu ca parvasu | dvitiyashtaksharo mantrah kavacam patu sarvatah || 35|| reto vayau nabhirandhre
    prishthasandhishu sarvatah | shadaksharastritiyo'yam mantro mam patu sarvada || 36|| nasarandhre mahamaya
    kantharandhre tu vaishnavi | sarvasandhishu mam patu durga durgartiharini || 37|| shrotrayorhum phadityevam
    nityam rakshatu kalika | netrabijatrayam netre sada tishthatu rakshitum || 38|| om aim hrim hraum
    nasikayam rakshanti castu candika | om hrim hrum mam sada tara jihvamule tu tishthatu || 39|| hridi
    tishthatu me seturjnanam rakshitumuttamam | om kshaum phat ca mahamaya patu mam sarvatah sada || 40||
    om yum sah pranan kaushiki mam pranan rakshatu rakshika | om hrim hrum saum bhargadayita dehashunyeshu
    patu mam || 41|| om namah sada shailaputri sarvan rogan pramrijyatam | om hrim sah sphem kshah phadastraya
    simhavyaghrabhayadranat || 42|| shivaduti patu nityam hrim sarvastreshu tishthatu | om hram hrim sashcandaghanta
    karnacchidreshu patu mam || 43|| om krim sah kameshvari kamanabhitishthatu rakshatu | om am hrum phadugracanda
    ripun vighnan vimardatam || 44|| om pam patu narasimhi mam kravyadebhyastathastratah | om shrim hrim
    hram hram kalaratrih khadgadrakshatu mam sada || 45|| om am shulat patu nityam vaishnavi jagadishvari
    | om kam brahmani patu cakrat om cam rudrani tu shaktitah || 45 46|| om tam kaumari patu vajrat om
    tam varahi tu kandatah | om pam patu narasimhi mam kravyadebhyastathastratah || 47|| shastrastrebhyah
    samastebhyo yantrebhyo'nishtamantratah | candika mam sada patu yam sam devyai namo namah | vishvasaghatakebhyo
    mamaindri rakshatu manmanah || 48|| om namo mahamayayai om vaishnavyai namo namah | raksha mam sarvabhutebhyah
    sarvatra parameshvari || 49|| adhare vayumarge hridi kamaladale candravat smerasurye vastau vahnau
    samiddhe vishatu varadaya mantramashtaksharantat | yadbrahma murdhni dhatte hariravati gale candracudo
    hridistham tam mam patu pradhanam nikhilamatishayam padmagarbhabhabijam || 50|| adyah sheshah svaraughairnamayavalavarairasvarenapi
    yuktaih sanusvaravisargairhariharaviditam yatsahasram ca sashtam | antranam setubandham nivasati satatam
    vaishnavitantramantre tanmam payatpavitram paramaparamajam bhutalavyomabhage || 51|| anganyashtau
    tathashtau vasava iha tathaivashtamurtirdalani proktanyashtau tathashtau madhumatiracitah siddhayo'shtau
    tathaiva | ashtavashtashtasankhya jagati ratikalah kshiprakashtangayoga mayyashtavaksharani ksharatu
    na hi gano yaddhrido yastvamusham || 52|| phalashrutih iti tatkavacam proktam dharmakamarthasadhanam
    | idam rahasyam paramamidam sarvarthasadhakam || 53|| yah sakricchrinuyadetat kavacam mayakoditam
    | sa sarvamllabhate kaman paratra shivarupatam || 54|| sakridyastu pathedetat kavacam mayakoditam
    | sa sarvayajnasya phalam labhate natra samshayah || 55|| sangrameshu jayecchatrum matanganiva keshari
    | dahettrinam yathavahnistatha shatrum dahetsada || 56|| nastrani tasya shastrani sharire pravishanti
    vai | na tasya jayate vyadhirna ca duhkham kadacana || 57|| gutikanjanapatalapadaleparasanjanam |
    uccatanadyastah sarvah prasidanti ca siddhayah || 58|| vayoriva gatistasya bhavedanyairavarita | dirghayuh
    kamabhogi ca dhanavanabhijayate || 59|| ashtamyam samyato bhutva navamyam vidhivacchivam | pujayitva
    vidhanena vicintya manama shivam || 60|| yo nyaset kavacam dehe tasya punyaphalam sha
  devanagari: ऋषिः अनुष्टुप्छन्दः ॥ १०॥ कात्यायनी देवता । सर्वकामार्थसाधने विनियोगः । अः पातु पूर्वकाष्ठायामाग्नेय्यां
    पातु कः सदा ॥ ११॥ पातु चो यमकाष्ठायां टो नैरृत्यां च सर्वदा । मां पातु तोऽसौ पाश्चात्ये शक्तिर्वायव्यदिग्गता
    ॥ १२॥ यः पातु मां चोत्तरस्यामैशान्यां सस्तथावतु । मूर्ध्नि रक्षतु मां सोऽसौ बाहौ मां दक्षिणे तु कः
    ॥ १३॥ मां वामबाहौ चः पातु हृदि टो मां सदावतु । तः पातु कण्ठदेशे मां कट्योः शक्तिस्तथावतु ॥ १४॥ यः
    पातु दक्षिणे पादे षो मां वामपादे तथा । योगिनीकवचं शैलपुत्री तु पूर्वस्यामाग्नेय्यां पातु चण्डिका ॥
    १५॥ चन्द्रघण्टा पातु याम्यां यमभीतिविवर्धिनी । नैरृत्ये त्वथ कूष्माण्डी पातु मां जगतां प्रसूः ॥ १६॥
    स्कन्दमाता पश्चिमायां मां रक्षतु सदैव हि । कात्यायनी मां वायव्ये पातु लोकेश्वरी सदा ॥ १७॥ कालरात्री
    तु कौबेर्यां सदा रक्षतु मां स्वयम् । महागौरी तथैशान्यां सततं पातु पावनी ॥ १८॥ देवौघ कवचं नेत्रयोर्वासुदेवो
    मां पातु नित्यं सनातनः । ब्रह्मा मां पातु वदने पद्मयोनिरयोनिजः ॥ १९॥ नासाभागे रक्षतु मां सर्वदा चन्द्रशेखरः
    । गजवक्त्रः स्तनयुग्मे पातु नित्यं हरात्मजः ॥ २०॥ वामदक्षिणपाण्योर्मां नित्यं पातु दिवाकरः । महामाया
    स्वयं नाभौ मां पातु परमेश्वरी ॥ २१॥ महालक्ष्मीः पातु गुह्ये जानुनोश्च सरस्वती । देवीदिक्कवचं महामाया
    पूर्वभागे नित्यं रक्षतु मां शुभा ॥ २२॥ अग्निज्वाला तथाग्नेय्यां पायान्नित्यं वरासिनी । रुद्राणी पातु
    मां याम्यां नैरृत्यां चण्डनायिका ॥ २३॥ उग्रचण्डा पश्चिमायां पातु नित्यं महेश्वरी । प्रचण्डा पातु वायव्ये
    कौबेर्यां घोररूपिणी ॥ २४॥ ईश्वरी च तथैशान्यां पातु नित्यं सनातनी । ऊर्ध्वं पातु महामाया पात्वधः परमेश्वरी
    ॥ २५॥ पार्श्वकवचं अग्रतः पातु मामुग्रा पृष्ठतो वैष्णवी तथा । ब्रह्माणी दक्षिणे पार्श्वे नित्यं रक्षतु
    शोभना ॥ २६॥ माहेश्वरी वामपार्श्वे नित्यं पायाद्वृषध्वजा । अव्ययकवचं कौमारी पर्वते पातु वाराही सलिले
    च माम् ॥ २७॥ नारसिंही दंष्ट्रिभये पातु मां विपिनेषु च । ऐन्द्री मां पातु चाकाशे तथा सर्वजले स्थले
    ॥ २८॥ सेतुः सर्वाङ्गुलीः पातु देवादिः पातु कर्णयोः । देवान्तश्चिबुके पातु पार्श्वयोः शक्तिपञ्चमः ॥
    २९॥ षड्वर्णकवचं हा पातु मां तथैवोर्वोर्माया रक्षतु जङ्घयोः । सर्वेन्द्रियाणि यः पातु रोमकूपेषु सर्वदा
    ॥ ३०॥ त्वचि मां वै सदा पातु मां शम्भुः पातु सर्वदा । नखदन्तकरोष्ठादौ रां मां पातु सदैव हि ॥ ३१॥ देवादिः
    पातु मां वस्तौ देवान्तः स्तनकक्षयोः । एतदादौ तु यः सेतुर्बाह्ये मां पातु देहतः ॥ ३२॥ अभेद्यकवचं आज्ञाचक्रे
    सुषुम्नायां षट्चक्रे हृदि सन्धिषु । आदिषोडशचक्रे च ललाटाकाश एव च ॥ ३३॥ वैष्णवीतन्त्रमन्त्रो मां नित्यं
    रक्षंश्च तिष्ठतु । अर्णनाडीषु सर्वासु पार्श्वकक्षशिखासु च ॥ ३४॥ ३४ ॥ रुधिरस्नायुमज्जासु मस्तिष्केषु
    च पर्वसु । द्वितीयाष्टाक्षरो मन्त्रः कवचं पातु सर्वतः ॥ ३५॥ रेतो वायौ नाभिरन्ध्रे पृष्ठसन्धिषु सर्वतः
    । षडक्षरस्तृतीयोऽयं मन्त्रो मां पातु सर्वदा ॥ ३६॥ नासारन्ध्रे महामाया कण्ठरन्ध्रे तु वैष्णवी । सर्वसन्धिषु
    मां पातु दुर्गा दुर्गार्तिहारिणी ॥ ३७॥ श्रोत्रयोर्हुं फडित्येवं नित्यं रक्षतु कालिका । नेत्रबीजत्रयं
    नेत्रे सदा तिष्ठतु रक्षितुम् ॥ ३८॥ ॐ ऐं ह्रीं ह्रौं नासिकायां रक्षन्ती चास्तु चण्डिका । ॐ ह्रीं ह्रूं
    मां सदा तारा जिह्वामूले तु तिष्ठतु ॥ ३९॥ हृदि तिष्ठतु मे सेतुर्ज्ञानं रक्षितुमुत्तमम् । ॐ क्षौं फट्
    च महामाया पातु मां सर्वतः सदा ॥ ४०॥ ॐ युं सः प्राणान् कौशिकी मां प्राणान् रक्षतु रक्षिका । ॐ ह्रीं
    ह्रूं सौं भर्गदयिता देहशून्येषु पातु माम् ॥ ४१॥ ॐ नमः सदा शैलपुत्री सर्वान् रोगान् प्रमृज्यताम् ।
    ॐ ह्रीं सः स्फें क्षः फडस्त्राय सिंहव्याघ्रभयाद्रणात् ॥ ४२॥ शिवदूती पातु नित्यं ह्रीं सर्वास्त्रेषु
    तिष्ठतु । ॐ ह्रां ह्रीं सश्चण्डघण्टा कर्णच्छिद्रेषु पातु माम् ॥ ४३॥ ॐ क्रीं सः कामेश्वरी कामानभितिष्ठतु
    रक्षतु । ॐ आं ह्रूं फडुग्रचण्डा रिपून् विघ्नान् विमर्दताम् ॥ ४४॥ ॐ पं पातु नारसिंही मां क्रव्यादेभ्यस्तथास्त्रतः
    । ॐ श्रीं ह्रीं ह्रां ह्रं कालरात्रिः खड्गाद्रक्षतु मां सदा ॥ ४५॥ ॐ अं शूलात् पातु नित्यं वैष्णवी
    जगदीश्वरी । ॐ कं ब्रह्माणी पातु चक्रात् ॐ चं रुद्राणी तु शक्तितः ॥ ४५ ४६॥ ॐ टं कौमारी पातु वज्रात्
    ॐ तं वाराही तु काण्डतः । ॐ पं पातु नारसिंही मां क्रव्यादेभ्यस्तथास्त्रतः ॥ ४७॥ शस्त्रास्त्रेभ्यः समस्तेभ्यो
    यन्त्रेभ्योऽनिष्टमन्त्रतः । चण्डिका मां सदा पातु यं सं देव्यै नमो नमः । विश्वासघातकेभ्यो मामैन्द्री
    रक्षतु मन्मनः ॥ ४८॥ ॐ नमो महामायायै ॐ वैष्णव्यै नमो नमः । रक्ष मां सर्वभूतेभ्यः सर्वत्र परमेश्वरि
    ॥ ४९॥ आधारे वायुमार्गे हृदि कमलदले चन्द्रवत् स्मेरसूर्ये वस्तौ वह्नौ समिद्धे विशतु वरदया मन्त्रमष्टाक्षरन्तत्
    । यद्ब्रह्मा मूर्ध्नि धत्ते हरिरवति गले चन्द्रचूडो हृदिस्थं तं मां पातु प्रधानं निखिलमतिशयं पद्मगर्भाभबीजम्
    ॥ ५०॥ आद्याः शेषाः स्वरौघैर्नमयवलवरैरस्वरेणापि युक्तैः सानुस्वाराविसर्गैर्हरिहरविदितं यत्सहस्रं च
    साष्टम् । अन्त्राणां सेतुबन्धं निवसति सततं वैष्णवीतन्त्रमन्त्रे तन्मां पायात्पवित्रं परमपरमजं भूतलव्योमभागे
    ॥ ५१॥ अङ्गान्यष्टौ तथाष्टौ वसव इह तथैवाष्टमूर्तिर्दलानि प्रोक्तान्यष्टौ तथाष्टौ मधुमतिरचिताः सिद्धयोऽष्टौ
    तथैव । अष्टावष्टाष्टसङ्ख्या जगति रतिकलाः क्षिप्रकाष्टाङ्गयोगा मय्यष्टावक्षराणि क्षरतु न हि गणो यद्धृदो
    यस्त्वमूषाम् ॥ ५२॥ फलश्रुतिः इति तत्कवचं प्रोक्तं धर्मकामार्थसाधनम् । इदं रहस्यं परममिदं सर्वार्थसाधकम्
    ॥ ५३॥ यः सकृच्छृणुयादेतत् कवचं मयकोदितम् । स सर्वांल्लभते कामान् परत्र शिवरूपताम् ॥ ५४॥ सकृद्यस्तु
    पठेदेतत् कवचं मयकोदितम् । स सर्वयज्ञस्य फलं लभते नात्र संशयः ॥ ५५॥ सङ्ग्रामेषु जयेच्छत्रुं मातङ्गानिव
    केशरी । दहेत्तृणं यथावह्निस्तथा शत्रुं दहेत्सदा ॥ ५६॥ नास्त्राणि तस्य शस्त्राणि शरीरे प्रविशन्ति वै
    । न तस्य जायते व्याधिर्न च दुःखं कदाचन ॥ ५७॥ गुटिकाञ्जनपातालपादलेपरसाञ्जनम् । उच्चाटनाद्यास्ताः सर्वाः
    प्रसीदन्ति च सिद्धयः ॥ ५८॥ वायोरिव गतिस्तस्य भवेदन्यैरवारिता । दीर्घायुः कामभोगी च धनवानभिजायते ॥
    ५९॥ अष्टम्यां संयतो भूत्वा नवम्यां विधिवच्छिवाम् । पूजयित्वा विधानेन विचिन्त्य मनमा शिवाम् ॥ ६०॥ यो
    न्यसेत् कवचं देहे तस्य पुण्यफलं श
