id: maha16ratna
category: stotram
name:
  english: maha16ratna
  devanagari: महा१६रत्न
content:
  english: mambamadimavakstutamahamalam dhyayamyabhishtaptaye || 17|| labdhajnanasudhakarena manasa lakshyikritam
    te vapuh sadbhih samtatamambujakshi lalite lagnam bhavatvantare | lavanyojjvaladivyagatri vimale laksharasalamkritam
    shrimatpadapayojayugmamadhuna manmurdhni nikshipyatam || 18|| hrimkarabdhisudhe hriya virahite hrimkaramantrarthade
    hrimkarapriyasharike mayi kripam hrimkaranadodaye | hrimkaramaladarpanapratikrite hrimkaravedye shive
    dine mayyadhuna kurushva dayaya hrimkaradipaprabhe || 19|| sampatkarmani dikshitani sakalapadbhanjananyamba
    te mamevakalayantu pankajadalakshemamkaranyadarat | brahmadin padapadmalagnamakutan hitva kathamcicchive
    netranyadya kripasudharasajharisiktani he sundari || 20|| kalpante hritsarvalokajatharasyanandanatyam
    muda karturyanmanikundaliyugalika dipayate samtatam | brahmopendramukhamare viramati brahmandabhande
    param sa pashankushapushpasayakadhanurvidyotatanme hridi || 21|| lakshyam kimca bhavenmahatripurasundaryagamantairnute
    mam lakshyikuru vikshanashugatatestvameva sarvatmana | dhyatva cetasi samsthitam jagadidam tvadrupamarye
    sada jnatvananyahrida vihaya bhajanam nashyatsu deveshviha || 22|| hrimkarasmaranena devi tarasa hriman
    sudhiman bhavet te muko'pi jado'pi padmajanusha sapatniko'bhud bhrisham | ashlishyambudhikanyakam
    vilasati shrimantrarajaksharam tanmayyadisha devadevi kripaya dhanyo'smyaham tena ca || 23|| sauvarnojjvalamandape
    maratakaprakarabhittau briha
  devanagari: मम्बामादिमवाक्स्तुतामहमलं ध्यायाम्यभीष्टाप्तये ॥ १७॥ लब्धज्ञानसुधाकरेण मनसा लक्ष्यीकृतं
    ते वपुः सद्भिः संततमम्बुजाक्षि ललिते लग्नं भवत्वान्तरे । लावण्योज्ज्वलदिव्यगात्रि विमले लाक्षारसालंकृतं
    श्रीमत्पादपयोजयुग्ममधुना मन्मूर्ध्नि निक्षिप्यताम् ॥ १८॥ ह्रींकाराब्धिसुधे ह्रिया विरहिते ह्रींकारमन्त्रार्थदे
    ह्रींकारप्रियशारिके मयि कृपां ह्रींकारनादोदये । ह्रींकारमलदर्पणप्रतिकृते ह्रींकारवेद्ये शिवे दीने
    मय्यधुना कुरुष्व दयया ह्रींकारदीपप्रभे ॥ १९॥ संपत्कर्मणि दीक्षितानि सकलापद्भञ्जनान्यम्ब ते मामेवाकलयन्तु
    पङ्कजदलाक्षेमंकराण्यादरात् । ब्रह्मादीन् पदपद्मलग्नमकुटान् हित्वा कथंचिच्छिवे नेत्राण्यद्य कृपासुधारसझरीसिक्तानि
    हे सुन्दरि ॥ २०॥ कल्पान्ते हृत्सर्वलोकजठरस्यानन्दनाट्यं मुदा कर्तुर्यन्मणिकुण्डलीयुगलिका दीपायते संततम्
    । ब्रह्मोपेन्द्रमुखामरे विरमति ब्रह्माण्डभाण्डे परं सा पाशाङ्कुशपुष्पसायकधनुर्विद्योततान्मे हृदि ॥
    २१॥ लक्ष्यं किंच भवेन्महात्रिपुरसुन्दर्यागमान्तैर्नुते मां लक्ष्यीकुरु वीक्षणाशुगततेस्त्वामेव सर्वात्मना
    । ध्यात्वा चेतसि संस्थितं जगदिदं त्वद्रूपमार्ये सदा ज्ञात्वानन्यहृदा विहाय भजनं नश्यत्सु देवेष्विह
    ॥ २२॥ ह्रींकारस्मरणेन देवि तरसा ह्रीमान् सुधीमान् भवेत् ते मूकोऽपि जडोऽपि पद्मजनुषा सापत्निकोऽभूद्
    भृशम् । आश्लिष्याम्बुधिकन्यकां विलसति श्रीमन्त्रराजाक्षरं तन्मय्यादिश देवदेवि कृपया धन्योऽस्म्यहं
    तेन च ॥ २३॥ सौवर्णोज्ज्वलमण्डपे मरतकप्राकारभित्तौ बृह
