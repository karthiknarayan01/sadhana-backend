id: ashtavakra-gita-chapter-17
category: stotram
name:
  english: Ashtavakra Gita Chapter 17
content:
  english: ashtavakra uvaca || tena jnanaphalam praptam yogabhyasaphalam tatha | triptah svacchendriyo
    nityamekaki ramate tu yah || || na kadacijjagatyasmin tattvajno hanta khidyati | yata ekena tenedam
    purnam brahmandamandalam || || na jatu vishayah ke'pi svaramam harshayantyami | sallakipallavapritamivebham
    nimbapallavah || || yastu bhogeshu bhukteshu na bhavatyadhivasitah | abhukteshu nirakankshi tadrisho
    bhavadurlabhah || || bubhukshuriha samsare mumukshurapi drishyate | bhogamokshanirakankshi viralo
    hi mahashayah || || dharmarthakamamoksheshu jivite marane tatha | kasyapyudaracittasya heyopadeyata
    na hi || || vancha na vishvavilaye na dveshastasya ca sthitau | yatha jivikaya tasmad dhanya aste
    yatha sukham || || kritartho'nena jnanenetyevam galitadhih kriti | pashyan shrinvan sprishan jighrann
    ashnannaste yatha sukham || || shunya drishtirvritha ceshta vikalanindriyani ca | na spriha na viraktirva
    kshinasamsarasagare || || na jagarti na nidrati nonmilati na milati | aho paradasha kvapi vartate
    muktacetasah || || sarvatra drishyate svasthah sarvatra vimalashayah | samastavasana mukto muktah
    sarvatra rajate || || pashyan shrinvan sprishan jighrann ashnan grihnan vadan vrajan | ihitanihitairmukto
    mukta eva mahashayah || || na nindati na ca stauti na hrishyati na kupyati | na dadati na grihnati
    muktah sarvatra nirasah || || sanuragam striyam drishtva mrityum va samupasthitam | avihvalamanah
    svastho mukta eva mahashayah || || sukhe duhkhe nare naryam sampatsu ca vipatsu ca | vishesho naiva
    dhirasya sarvatra samadarshinah || || na himsa naiva karunyam nauddhatyam na ca dinata | nashcaryam
    naiva ca kshobhah kshinasamsarane nare || || na mukto vishayadveshta na va vishayalolupah | asamsaktamana
    nityam praptapraptamupashnute || || samadhanasamadhanahitahitavikalpanah | shunyacitto na janati kaivalyamiva
    samsthitah || || nirmamo nirahankaro na kinciditi nishcitah | antargalitasarvashah kurvannapi karoti
    na || || manahprakashasammohasvapnajadyavivarjitah | dasham kamapi samprapto bhaved galitamanasah
    ||
  devanagari: अष्टावक्र उवाच ॥ तेन ज्ञानफलं प्राप्तं योगाभ्यासफलं तथा । तृप्तः स्वच्छेन्द्रियो नित्यमेकाकी
    रमते तु यः ॥ ॥ न कदाचिज्जगत्यस्मिन् तत्त्वज्ञो हन्त खिद्यति । यत एकेन तेनेदं पूर्णं ब्रह्माण्डमण्डलम्
    ॥ ॥ न जातु विषयाः केऽपि स्वारामं हर्षयन्त्यमी । सल्लकीपल्लवप्रीतमिवेभं निम्बपल्लवाः ॥ ॥ यस्तु भोगेषु
    भुक्तेषु न भवत्यधिवासितः । अभुक्तेषु निराकाङ्क्षी तादृशो भवदुर्लभः ॥ ॥ बुभुक्षुरिह संसारे मुमुक्षुरपि
    दृश्यते । भोगमोक्षनिराकाङ्क्षी विरलो हि महाशयः ॥ ॥ धर्मार्थकाममोक्षेषु जीविते मरणे तथा । कस्याप्युदारचित्तस्य
    हेयोपादेयता न हि ॥ ॥ वाञ्छा न विश्वविलये न द्वेषस्तस्य च स्थितौ । यथा जीविकया तस्माद् धन्य आस्ते यथा
    सुखम् ॥ ॥ कृतार्थोऽनेन ज्ञानेनेत्येवं गलितधीः कृती । पश्यन् शृण्वन् स्पृशन् जिघ्रन्न् अश्नन्नास्ते
    यथा सुखम् ॥ ॥ शून्या दृष्टिर्वृथा चेष्टा विकलानीन्द्रियाणि च । न स्पृहा न विरक्तिर्वा क्षीणसंसारसागरे
    ॥ ॥ न जागर्ति न निद्राति नोन्मीलति न मीलति । अहो परदशा क्वापि वर्तते मुक्तचेतसः ॥ ॥ सर्वत्र दृश्यते
    स्वस्थः सर्वत्र विमलाशयः । समस्तवासना मुक्तो मुक्तः सर्वत्र राजते ॥ ॥ पश्यन् शृण्वन् स्पृशन् जिघ्रन्न्
    अश्नन् गृह्णन् वदन् व्रजन् । ईहितानीहितैर्मुक्तो मुक्त एव महाशयः ॥ ॥ न निन्दति न च स्तौति न हृष्यति
    न कुप्यति । न ददाति न गृह्णाति मुक्तः सर्वत्र नीरसः ॥ ॥ सानुरागां स्त्रियं दृष्ट्वा मृत्युं वा समुपस्थितम्
    । अविह्वलमनाः स्वस्थो मुक्त एव महाशयः ॥ ॥ सुखे दुःखे नरे नार्यां सम्पत्सु च विपत्सु च । विशेषो नैव
    धीरस्य सर्वत्र समदर्शिनः ॥ ॥ न हिंसा नैव कारुण्यं नौद्धत्यं न च दीनता । नाश्चर्यं नैव च क्षोभः क्षीणसंसरणे
    नरे ॥ ॥ न मुक्तो विषयद्वेष्टा न वा विषयलोलुपः । असंसक्तमना नित्यं प्राप्ताप्राप्तमुपाश्नुते ॥ ॥ समाधानासमाधानहिताहितविकल्पनाः
    । शून्यचित्तो न जानाति कैवल्यमिव संस्थितः ॥ ॥ निर्ममो निरहङ्कारो न किञ्चिदिति निश्चितः । अन्तर्गलितसर्वाशः
    कुर्वन्नपि करोति न ॥ ॥ मनःप्रकाशसम्मोहस्वप्नजाड्यविवर्जितः । दशां कामपि सम्प्राप्तो भवेद् गलितमानसः
    ॥
