id: sarva-devata-gayatri-mantras
category: stotram
name:
  english: Sarva Devata Gayatri Mantras
content:
  english: shiva gayatri mantrah o ntatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodaya t
    || ganapati gayatri mantrah o ntatpurushaya vidmahe vakratundaya dhimahi | tanno dantih pracodaya
    t || nandi gayatri mantrah o ntatpurushaya vidmahe cakratundaya dhimahi | tanno nandih pracodaya t
    || subrahmanya gayatri mantrah o ntatpurushaya vidmahe mahasenaya dhimahi | tanna t || garuda gayatri
    mantrah o ntatpurushaya vidmahe suvarnapakshaya dhimahi | tanno garudah pracodaya t || brahma gayatri
    mantrah om ve~datmanaya vidmahe hiranyagarbhaya dhimahi | tanno brahmah pracodaya t || vishnu gayatri
    mantrah o nnarayanaya vidmahe vasudevaya dhimahi | tanno vishnuh pracodaya t || shri lakshmi gayatri
    mantrah o mmahadevyai ca vidmahe vishnupatni ca dhimahi | tanno lakshmi pracodaya t || narasimha gayatri
    mantrah om va~jranakhaya vidmahe tikshnadagg shtraya dhimahi | tanno narasigmhah pracodaya t || surya
    gayatri mantrah o mbhaskaraya vidmahe mahaddyutikaraya dhimahi | tanno adityah pracodaya t || agni
    gayatri mantrah om vai~shvanaraya vidmahe lalilaya dhimahi | tanno agnih pracodaya t || durga gayatri
    mantrah o nkatyayanaya vidmahe kanyakumari dhimahi | tanno durgih pracodaya
  devanagari: शिव गायत्री मन्त्रः ओ न्तत्पुरु॑षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि । तन्नो॑ रुद्रः प्रचो॒दया
    त् ॥ गणपति गायत्री मन्त्रः ओ न्तत्पुरु॑षाय वि॒द्महे॑ वक्रतु॒ण्डाय॑ धीमहि । तन्नो॑ दन्तिः प्रचो॒दया
    त् ॥ नन्दि गायत्री मन्त्रः ओ न्तत्पुरु॑षाय वि॒द्महे॑ चक्रतु॒ण्डाय॑ धीमहि । तन्नो॑ नन्दिः प्रचो॒दया
    त् ॥ सुब्रह्मण्य गायत्री मन्त्रः ओ न्तत्पुरु॑षाय वि॒द्महे॑ महासे॒नाय॑ धीमहि । तन्न त् ॥ गरुड गायत्री
    मन्त्रः ओ न्तत्पुरु॑षाय वि॒द्महे॑ सुवर्णप॒क्षाय॑ धीमहि । तन्नो॑ गरुडः प्रचो॒दया त् ॥ ब्रह्म गायत्री
    मन्त्रः ॐ वेँ॒दा॒त्म॒नाय॑ वि॒द्महे॑ हिरण्यग॒र्भाय॑ धीमहि । तन्नो॑ ब्रह्मः प्रचो॒दया त् ॥ विष्णु गायत्री
    मन्त्रः ओ न्ना॒रा॒य॒णाय॑ वि॒द्महे॑ वासुदे॒वाय॑ धीमहि । तन्नो॑ विष्णुः प्रचो॒दया त् ॥ श्री लक्ष्मि
    गायत्री मन्त्रः ओ म्म॒हा॒दे॒व्यै च वि॒द्महे॑ विष्णुप॒त्नी च॑ धीमहि । तन्नो॑ लक्ष्मी प्रचो॒दया त् ॥
    नरसिंह गायत्री मन्त्रः ॐ वँ॒ज्र॒न॒खाय वि॒द्महे॑ तीक्ष्णद॒ग्ग् ष्ट्राय॑ धीमहि । तन्नो॑ नारसिग्ंहः प्रचो॒दया
    त् ॥ सूर्य गायत्री मन्त्रः ओ म्भा॒स्क॒राय॑ वि॒द्महे॑ महद्द्युतिक॒राय॑ धीमहि । तन्नो॑ आदित्यः प्रचो॒दया
    त् ॥ अग्नि गायत्री मन्त्रः ॐ वैँ॒श्वा॒न॒राय॑ वि॒द्महे॑ लाली॒लाय धीमहि । तन्नो॑ अग्निः प्रचो॒दया त्
    ॥ दुर्गा गायत्री मन्त्रः ओ ङ्का॒त्या॒य॒नाय॑ वि॒द्महे॑ कन्यकु॒मारि॑ धीमहि । तन्नो॑ दुर्गिः प्रचो॒दया
