id: nrisinha
category: upanishad
name:
  english: nrisinha
  devanagari: न्रिसिन्ह
content:
  english: '|| yashca vishnuh || 2|| yashca maheshvarah || 3|| yashca purushah || 4|| yashceshvarah ||
    5|| ya sarasvati || 6|| ya shrih || 7|| ya gauri || 8|| ya prakritih || 9|| ya vidya || 10|| yashconkarah
    || 11|| yashcatasro''rdhamatrah || 12|| ye vedah sangah sashakhah setihasah || 13|| ye ca pancagnayah
    || 14|| yah sapta mahavyahritayah || 15|| ye cashtau lokapalah || 16|| ye cashtau vasavah || 17||
    ye caikadasha rudrah || 18|| ye ca dvadashadityah || 19|| ye cashtau grahah || 20|| yani ca pancamahabhutani
    || 21|| yashca kalah || 22|| yashca manuh || 23|| yashca mrityuh || 24|| yashca yamah || 25|| yashcantakah
    || 26|| yashca pranah || 27|| yashca suryah || 28|| yashca somah || 29|| yashca virat purushah ||
    30|| yashca jivah || 31|| yacca sarvam || 32|| iti dvatrimshat iti tanprajapatirabravidetairmantrairnityam
    devam stuvadhvam | tato devah prito bhavati svatmanam darshayati tasmadya etairmantrairnityam devam
    stauti sa devam pashyati so''mritatvam ca gacchati ya evam vedeti mahopanishat || iti caturthyupanishat
    || 4|| deva ha vai prajapatimabruvannanushtubhasya mantrarajasya narasimhasya mahacakram nama cakram
    no bruhi bhagava iti sarvakamikam mokshadvaram yadyogina upadishanti sa hovaca prajapatih shadaksharam
    va etatsudarshanam mahacakram tasmatshadaram bhavati shatpatram cakram bhavati shadva ritava ritubhih
    sammitam bhavati madhye nabhirbhavati nabhyam va ete arah pratishthita mayaya etatsarvam veshtitam
    bhavati natmanam maya sprishati tasmanmayaya bahirveshtitam bhavati | athashtaramashtapatram cakram
    bhavatyashtakshara vai gayatri gayatrya sammitam bhavati bahirmayaya veshtitam bhavati kshetram kshetram
    vai mayaisha sampadyate | atha dvadasharam dvadashapatram cakram bhavati dvadashakshara vai jagati
    jagatya sammitam bhavati bahirmayaya veshtitam bhavati | atha shodasharam shodashapatram cakram bhavati
    shodashakalo vai purushah purusha evedam sarvam purushena sammitam bhavati mayaya bahirveshtitam bhavati
    | atha dvatrimshadaram dvatrimshatpatram cakram bhavati dvatrimshadakshara va anushtubbhavatyanushtubha
    sarvamidam bhavati bahirmayaya veshtitam bhavatyarairva etatsubaddham bhavati veda va ete arah patrairva
    etatsarvatah parikramati chandamsi vai patrani || 1|| etatsudarshanam mahacakram tasya madhye nabhyam
    tarakam yadaksharam narasimhamekaksharam tadbhavati shatsu patreshu shadaksharam sudarshanam bhavatyashtasu
    patreshvashtaksharam narayanam bhavati dvadashasu patreshu dvadashaksharam vasudevam bhavati shodashasu
    patreshu matrikadyah sabindukah shodasha svara bhavanti dvatrimshatsu patreshu dvatrimshadaksharam
    mantrarajam narasimhamanushtubham bhavati tadva etatsudarshanam nama cakram sarvakamikam mokshadvaramrinmayam
    yajurmayam samamayam brahmamayamamritamayam bhavati tasya purastadvasava asate rudra dakshinata adityah
    pashcadvishvedeva uttarato brahmavishnumaheshvara nabhyam suryacandramasau parshvayostadetadricabhyuktam
    | rico akshare parame vyomanyasmindeva adhivishve nisheduh | yastanna veda kimrica karishyati ya ittadvidusta
    ime samasata iti tadetatsudarshanam mahacakram balo va yuva va veda sa mahanbhavati sa guruh sarvesham
    mantranamupadeshta bhavatyanushtubha homam kuryadanushtubharcanam kuryattadetadrakshoghnam mrityutarakam
    guruna labdham kanthe bahau shikhayam va badhnita saptadvipavati bhumirdakshinartham navakalpate tasmacchraddhaya
    yam kancidgam dadyatsa dakshina bhavati || 2|| deva ha vai prajapatimabruvannanushtubhasya mantrarajasya
    narasimhasya phalam no bruhi bhagava iti sa hovaca prajapatirya etam mantrarajam narasimhamanushtubham
    nityamadhite so''gniputo bhavati sa vayuputo bhavati sa adityaputo bhavati sa somaputo bhavati sa
    satyaputo bhavati sa brahmaputo bhavati sa vishnuputo bhavati sa rudraputo bhavati sa sarvaputo bhavati
    sa sarvaputo bhavati || 3|| ya etam mantrarajam narasimhamanushtubham nityamadhite sa mrityum tarati
    sa papmanam tarati sa bhrunahatyam tarati sa virahatyam tarati sa sarvahatyam tarati sa samsaram tarati
    sa sarvam tarati sa sarvam tarati || 4|| ya etam mantrarajam narasimhamanushtubham nityamadhite so''gnim
    stambhayati sa vayum stambhayati sa adityam stambhayati sa stomam stambhayati sa udakam stambhayati
    sa sarvandevanstambhayati sa sarvangrahanstambhayati sa visham stambhayati sa visham stambhayati ||
    5|| ya etam mantrarajam narasimhamanushtubham nityamadhite sa devanakarshayati sa yakshanakarshayati
    sa naganakarshayati sa grahanakarshayati sa manushyanakarshayati sa sarvanakarshayati sa sarvanakarshayati
    || 6|| ya etam mantrarajam narasimhamanushtubham nityamadhite sa bhurlokam jayati sa bhuvarlokam jayati
    sa svarlokam jayati sa maharlokam jayati sa janolokam jayati sa tapolokam jayati sa satyalokam jayati
    sa sarvamllokanjayati sa sarvamllokanjayati || 7|| ya etam mantrarajamanushtubham nityamadhite so''gnishtomena
    yajate sa ukthyena yajate sa shodashina yajate sa vajapeyena yajate so''tiratrena yajate so''ptoryamena
    yajate so''shvamedhena yajate sa sarvaih kratubhiryajate sa sarvaih kratubhiryajate || 8|| ya etam
    mantrarajam narasimhamanushtubham nityamadhite sa rico''dhite sa yajumshyadhite sa samanyadhite so''tharvanamadhite
    so''ngirasamadhite sa shakha adhite sa purananyadhite sa kalpanadhite sa gathamadhite sa narashamsiradhite
    sa pranavamadhite yah pranavamadhite sa sarvamadhite sa sarvamadhite || 9|| anupanitashatamekamekenopanitena
    tatsamamupanitashatamekamekena grihasthena tatsamam grihasthashatamekamekena vanaprasthena tatsamam
    vanaprasthashatamekamekena yatina tatsamam yatinam tu shatam purnamekamekena rudrajapakena tatsamam
    rudrajapakashatamekamekena'
  devanagari: ॥ यश्च विष्णुः ॥ २॥ यश्च महेश्वरः ॥ ३॥ यश्च पुरुषः ॥ ४॥ यश्चेश्वरः ॥ ५॥ या सरस्वती ॥ ६॥
    या श्रीः ॥ ७॥ या गौरी ॥ ८॥ या प्रकृतिः ॥ ९॥ या विद्या ॥ १०॥ यश्चोङ्कारः ॥ ११॥ याश्चतस्रोऽर्धमात्राः
    ॥ १२॥ ये वेदाः साङ्गाः सशाखाः सेतिहासाः ॥ १३॥ ये च पञ्चाग्नयः ॥ १४॥ याः सप्त महाव्याहृतयः ॥ १५॥ ये
    चाष्टौ लोकपालाः ॥ १६॥ ये चाष्टौ वसवः ॥ १७॥ ये चैकादश रुद्राः ॥ १८॥ ये च द्वादशादित्याः ॥ १९॥ ये चाष्टौ
    ग्रहाः ॥ २०॥ यानि च पञ्चमहाभूतानि ॥ २१॥ यश्च कालः ॥ २२॥ यश्च मनुः ॥ २३॥ यश्च मृत्युः ॥ २४॥ यश्च यमः
    ॥ २५॥ यश्चान्तकः ॥ २६॥ यश्च प्राणः ॥ २७॥ यश्च सूर्यः ॥ २८॥ यश्च सोमः ॥ २९॥ यश्च विराट् पुरुषः ॥ ३०॥
    यश्च जीवः ॥ ३१॥ यच्च सर्वम् ॥ ३२॥ इति द्वात्रिंशत् इति तान्प्रजापतिरब्रवीदेतैर्मन्त्रैर्नित्यं देवं
    स्तुवध्वम् । ततो देवः प्रीतो भवति स्वात्मानं दर्शयति तस्माद्य एतैर्मन्त्रैर्नित्यं देवं स्तौति स देवं
    पश्यति सोऽमृतत्वं च गच्छति य एवं वेदेति महोपनिषत् ॥ इति चतुर्थ्युपनिषत् ॥ ४॥ देवा ह वै प्रजापतिमब्रुवन्नानुष्टुभस्य
    मन्त्रराजस्य नारसिंहस्य महाचक्रं नाम चक्रं नो ब्रूहि भगव इति सार्वकामिकं मोक्षद्वारं यद्योगिन उपदिशन्ति
    स होवाच प्रजापतिः षडक्षरं वा एतत्सुदर्शनं महाचक्रं तस्मात्षडरं भवति षट्पत्रं चक्रं भवति षड्वा ऋतव
    ऋतुभिः सम्मितं भवति मध्ये नाभिर्भवति नाभ्यां वा एते अराः प्रतिष्ठिता मायया एतत्सर्वं वेष्टितं भवति
    नात्मानं माया स्पृशति तस्मान्मायया बहिर्वेष्टितं भवति । अथाष्टारमष्टपत्रं चक्रं भवत्यष्टाक्षरा वै
    गायत्री गायत्र्या सम्मितं भवति बहिर्मायया वेष्टितं भवति क्षेत्रं क्षेत्रं वै मायैषा सम्पद्यते । अथ
    द्वादशारं द्वादशपत्रं चक्रं भवति द्वादशाक्षरा वै जगती जगत्या सम्मितं भवति बहिर्मायया वेष्टितं भवति
    । अथ षोडशारं षोडशपत्रं चक्रं भवति षोडशकलो वै पुरुषः पुरुष एवेदं सर्वं पुरुषेण सम्मितं भवति मायया बहिर्वेष्टितं
    भवति । अथ द्वात्रिंशदरं द्वात्रिंशत्पत्रं चक्रं भवति द्वात्रिंशदक्षरा वा अनुष्टुब्भवत्यनुष्टुभा सर्वमिदं
    भवति बहिर्मायया वेष्टितं भवत्यरैर्वा एतत्सुबद्धं भवति वेदा वा एते अराः पत्रैर्वा एतत्सर्वतः परिक्रामति
    छन्दांसि वै पत्राणि ॥ १॥ एतत्सुदर्शनं महाचक्रं तस्य मध्ये नाभ्यां तारकं यदक्षरं नारसिंहमेकाक्षरं तद्भवति
    षट्सु पत्रेषु षडक्षरं सुदर्शनं भवत्यष्टसु पत्रेष्वष्टाक्षरं नारायणं भवति द्वादशसु पत्रेषु द्वादशाक्षरं
    वासुदेवं भवति षोडशसु पत्रेषु मातृकाद्याः सबिन्दुकाः षोडश स्वरा भवन्ति द्वात्रिंशत्सु पत्रेषु द्वात्रिंशदक्षरं
    मन्त्रराजं नारसिंहमानुष्टुभं भवति तद्वा एतत्सुदर्शनं नाम चक्रं सार्वकामिकं मोक्षद्वारमृङ्मयं यजुर्मयं
    साममयं ब्रह्ममयममृतमयं भवति तस्य पुरस्ताद्वसव आसते रुद्रा दक्षिणत आदित्याः पश्चाद्विश्वेदेवा उत्तरतो
    ब्रह्मविष्णुमहेश्वरा नाभ्यां सूर्याचन्द्रमसौ पार्श्वयोस्तदेतदृचाभ्युक्तम् । ऋचो अक्षरे परमे व्योमन्यस्मिन्देवा
    अधिविश्वे निषेदुः । यस्तन्न वेद किमृचा करिष्यति य इत्तद्विदुस्त इमे समासत इति तदेतत्सुदर्शनं महाचक्रं
    बालो वा युवा वा वेद स महान्भवति स गुरुः सर्वेषां मन्त्राणामुपदेष्टा भवत्यनुष्टुभा होमं कुर्यादनुष्टुभार्चनं
    कुर्यात्तदेतद्रक्षोघ्नं मृत्युतारकं गुरुणा लब्धं कण्ठे बाहौ शिखायां वा बध्नीत सप्तद्वीपवती भूमिर्दक्षिणार्थं
    नावकल्पते तस्माच्छ्रद्धया यां काञ्चिद्गां दद्यात्स दक्षिणा भवति ॥ २॥ देवा ह वै प्रजापतिमब्रुवन्नानुष्टुभस्य
    मन्त्रराजस्य नारसिंहस्य फलं नो ब्रूहि भगव इति स होवाच प्रजापतिर्य एतं मन्त्रराजं नारसिंहमानुष्टुभं
    नित्यमधीते सोऽग्निपूतो भवति स वायुपूतो भवति स आदित्यपूतो भवति स सोमपूतो भवति स सत्यपूतो भवति स ब्रह्मपूतो
    भवति स विष्णुपूतो भवति स रुद्रपूतो भवति स सर्वपूतो भवति स सर्वपूतो भवति ॥ ३॥ य एतं मन्त्रराजं नारसिंहमानुष्टुभं
    नित्यमधीते स मृत्युं तरति स पाप्मानं तरति स भ्रूणहत्यां तरति स वीरहत्यां तरति स सर्वहत्यां तरति स
    संसारं तरति स सर्वं तरति स सर्वं तरति ॥ ४॥ य एतं मन्त्रराजं नारसिंहमानुष्टुभं नित्यमधीते सोऽग्निं
    स्तम्भयति स वायुं स्तम्भयति स आदित्यं स्तम्भयति स स्तोमं स्तम्भयति स उदकं स्तम्भयति स सर्वान्देवान्स्तम्भयति
    स सर्वान्ग्रहान्स्तम्भयति स विषं स्तम्भयति स विषं स्तम्भयति ॥ ५॥ य एतं मन्त्रराजं नारसिंहमानुष्टुभं
    नित्यमधीते स देवानाकर्षयति स यक्षानाकर्षयति स नागानाकर्षयति स ग्रहानाकर्षयति स मनुष्यानाकर्षयति स
    सर्वानाकर्षयति स सर्वानाकर्षयति ॥ ६॥ य एतं मन्त्रराजं नारसिंहमानुष्टुभं नित्यमधीते स भूर्लोकं जयति
    स भुवर्लोकं जयति स स्वर्लोकं जयति स महर्लोकं जयति स जनोलोकं जयति स तपोलोकं जयति स सत्यलोकं जयति स
    सर्वांल्लोकाञ्जयति स सर्वांल्लोकाञ्जयति ॥ ७॥ य एतं मन्त्रराजमानुष्टुभं नित्यमधीते सोऽग्निष्टोमेन यजते
    स उक्थ्येन यजते स षोडशिना यजते स वाजपेयेन यजते सोऽतिरात्रेण यजते सोऽप्तोर्यामेण यजते सोऽश्वमेधेन यजते
    स सर्वैः क्रतुभिर्यजते स सर्वैः क्रतुभिर्यजते ॥ ८॥ य एतं मन्त्रराजं नारसिंहमानुष्टुभं नित्यमधीते स
    ऋचोऽधीते स यजूंष्यधीते स सामान्यधीते सोऽथर्वणमधीते सोऽङ्गिरसमधीते स शाखा अधीते स पुराणान्यधीते स कल्पानधीते
    स गाथामधीते स नाराशंसीरधीते स प्रणवमधीते यः प्रणवमधीते स सर्वमधीते स सर्वमधीते ॥ ९॥ अनुपनीतशतमेकमेकेनोपनीतेन
    तत्सममुपनीतशतमेकमेकेन गृहस्थेन तत्समं गृहस्थशतमेकमेकेन वानप्रस्थेन तत्समं वानप्रस्थशतमेकमेकेन यतिना
    तत्समं यतीनां तु शतं पूर्णमेकमेकेन रुद्रजापकेन तत्समं रुद्रजापकशतमेकमेकेन
