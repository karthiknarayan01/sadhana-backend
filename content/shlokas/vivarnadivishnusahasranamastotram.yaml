id: vivarnadivishnusahasranamastotram
category: sahasranama
name:
  english: vivarnadivishnusahasranamastotram
  devanagari: विवर्णादिविष्णुसहस्रनामस्तोत्रम्
content:
  english: ringamakuto vishadopalakundalah || 70|| vishvaketudhanuhprayabhrulato vistritananah | vishvamatrashayaharo
    vilolamadhupalakah || 71|| vimugdhanasikadando vishalahanusundarah | vishvamatradharmagando vinilashmashrumandalah
    || 72|| vishalakshyaraktarekho vistirnashrikritishravah | vishvamatrikaragrahyacibuko vishadasmitah
    || 73|| vishalaphalo vishajagrivo vishajaratnadhrit | vilambihararukpuravishadorasthalantarah || 74||
    vishadhrendrayatabhujo vishaniripumadhyamah | vinimnanabhirvipulashronirvividhalepanah || 75|| vinadatsvarnavalayo
    vidyudrvatatimekhalah | vishanikaramugdhoruryajatunirajanghikah || 76|| vigudhajatrurvishvaughasharanyanghripayoruhah
    | visaravajracakrabjahalaketvankadhritpadah || 77|| vidrumaraktanakharo vividhamnayanupurah | vimugdhasnigdharaktanghritalo
    visadrishakritih || 78|| vidyarajo vidyamano vidyakamaliniravih | vidyamanagamibhutaprabhurvidyaduranvayah
    || 79|| vidyavallimulakando vidyanandabdhikhelanah | vidyalatopaghnabhujo vidyambhoruhabambharah ||
    80|| vidyapadmamarandatma vidyapushkaracandramah | vidyavinayasampannabrahmahastyadi tulyadhih ||
    81|| vidyanandamayo vidyanandabimbo vividyakah | vidyapradayi vidyatma vidyaphalamayakritih || 82||
    vidyalakshmitrapakirtitushtipushtisativritah | vikranto vihvalatrata viyato vinayanvitah || 83|| virodhahino
    visneho viguno vimado vimah | viklamo vigatadharmo vivriddhirviparikshayah || 84|| visvedo vimalo
    visrahino vikshurvitridvibhih | viprakrito vibhapindo vipramano vibandhanah || 85|| viprakrishto vikurvano
    vihari viralodayah | vishampatirvishrutatma vividhamnayamrigyakrit || 86|| viviktasevinediyan vinayakavivarjitah
    | vidaivo viplavaharta vidheyakhiladaivatah || 87|| vikunthalokanirmata vikunthesho vikunthabhah |
    vikunthakutatanayo vikunthanagaripriyah || 88|| vikunthapadmamartando vikunthavibhavashrayah | vikunthalolo
    vikunthanarinayanacandrama || 89|| vinatasutasadbhahubhasako durvibhasakah | vilolatulasimalo vikacabjavidhunanah
    || 90|| vishadopalamuktaughachatradvayasamancitah | vivasvadayutacchadmapradipo vicalatpatah || 91||
    vidhubimbamayaprajya ratrikodupradipitah | vimardotthaparagandhamurchitashaprabodhanah || 92|| vishvambharakarambhojacamaranilasevitah
    | vidyudbhushanabhushangashrimukhenduprabharcitah || 93|| vidhyamsavinyastabhujo vishvaksenadisamvritah
    | vidhyandarenusancarakshamaromandhujalakah || 94|| vishvambhararajahpunjaganakaganyaviryavan | vishtapatrayapurvordhvalokavishkambhakasyadah
    || 95|| virincikalpantasakshi virincipritivardhanah | virincyayutasahasrajanako vidhipavakah || 96||
    virincidattapravararakshahkhandanapanditah | virincikaryanirvaho virinciparadaivatam || 97|| virinciputropadishtatattvo
    vidhihridalayah | vipancishilpadevarshisangito vidhisauhridah || 98|| vidhisattvonmeshakari vidhivakrataviharih
    | vidhilokatinediyan vidhimuktipradayakah || 99|| vidhibambharanabhyabjo vidhivaktrabjabhaskarah |
    vidhilokakritashreya vidhibandhurvidhishtadah || 100|| vishtapeshikritavidhirvidhidattakhilagamah
    | vidhisaubhagyasandhata vidhicetovishodhanah || 101|| vishvopajivyo vishvanyo vishvananyo vidardanah
    | vishvashambhurvirupakshajihvarangasthalinatah || 102|| virupakshajatakashagangavarshabalahakah |
    virupakshasharanyanghrirvirupakshatrishuladah || 103|| virupakshadvishadbhasmasurapranavinashanah
    | virupakshaparittrata virupakshashubhapradah || 104|| virupakshabaladhata virupakshajayapradah |
    virupakshasmayaharta virupaksheshubhutabhah || 105|| virupakshajayi vibhradvirupakshavipakshahrit
    | virupakshapritipatram virupakshamanogatah || 106|| virupakshamayo viddhavirupakshatamo'shubhah |
    virupakshanantakotikshayasakshi virodhajit || 107|| virupanetrahridayam virupakshapitamahah | virupanetrasadbandhurvirupakshamukhokshidah
    || 108|| virupakshasamanatma virupakshashtasiddhidah | virupakshamahadevo virupakshamahaguruh || 109||
    virupanetrantaratma virupakshasamiranah | virupakshaparijneyatattvo vividhamargakrit || 110|| virupakshabrahmahatyaharabhikshapradapanah
    | virupakshabhayakaro virupakshavimohanah || 111|| virupanetropabhuktavishavaviryavinashanah | virupakshakritattraso
    vishvabhavyamahatapah || 112|| virupakshaprajaraksho virupakshavimokshadah | virupakshamatavishtapashandajanatapanah
