id: maha-sarasvati-stavam
category: stotram
name:
  english: Maha Sarasvati Stavam
  devanagari: महासरस्वतीस्तवम् (मार्कण्डेयपुराणान्तर्गतम्)
content:
  english: ashvatara uvaca - jagaddhatrimaham devimariradhayishuh shubham | stoshye pranamya shirasa brahmayonim
    sarasvatim || 1|| sadasaddevi ! satkincinmokshavaccarthavatpadam | tatsarvam tvayyasamyogam yogavaddevi
    ! samsthitam || 2|| tvamaksharam param devi ! yatra sarvam pratishthitam | aksharam paramam devi !
    samsthitam paramanuvat || 3|| aksharam paramam brahma vishvancaitatksharatmakam | darunyavasthito
    vahnirbhaumashca paramanavah || 4|| tatha tvayi sthitam brahma jagaccedamasheshatah | onkaraksharasamsthanam
    yattu devi ! sthirasthiram || 5|| tatra matratrayam sarvamasti yaddevi nasti ca | trayo lokastrayo
    vedastraividyam pavakatrayam || 6|| trini jyotimshi varnashca trayo dharmagamastatha | trayo gunastrayah
    shabdastrayo vedastathashramah || 7|| trayah kalastathavasthah pitaro'harnishadayah | etanmatratrayam
    devi ! tava rupam sarasvati || 8|| vibhinnadarshinamadya brahmano hi sanatanah | somasamstha havih
    samsthah pakasamsthashca sapta yah || 9|| tastvaduccaranaddevi ! kriyante brahmavadibhih | anirdeshyam
    tatha canyadardhamatranvitam param || 10|| avikaryakshayam divyam parinamavivarjitam | tavaitatparamam
    rupam yanna shakyam mayoditum || 11|| na casye na ca tajjihva tamroshthadibhirucyate | indro'pi vasavo
    brahma candrarkau jyotireva ca || 12|| vishvavasam vishvarupam vishvesham parameshvaram | sankhyavedantavadoktam
    bahushakhasthirikritam || 13|| anadimadhyanidhanam sadasanna sadeva yat | ekantvanekam napyekam bhavabhedasamashraitam
    || 14|| anakhyam shadgunakhyanca vargakhyam trigunashrayam | nanashaktimatamekam shaktivaibhavikam
    param || 15|| sukhasukham mahasaukhyarupam tvayi vibhavyate | evam devi ! tvaya vyaptam sakalam nishkalanca
    yat | advaitavasthitam brahma yacca dvaite vyavasthitam || 16|| ye'rtha nitya ye vinashyanti canye
    ye va sthula ye ca sukshmatisukshmah | ye va bhumau ye'ntarikshe'nyato va tesham tesham tvatta evopalabdhih
    || 17|| yaccamurtam yacca murtam samastam yadva bhuteshvekamekanca kincit | yaddivyasti kshmatale
    khe'nyato va tvatsambaddham tvatsvarairvyanjanaishca || 18|| iti shrimarkandeyapurane trayovimsho'dhyayantaragatam
    mahasarasvatistavam sampurnam | shrimarkandeyapurane madalasopakhyane kuvalayashvapatalagamanamnama
    markandeya Purana adhyaya 23, verses 30-47
  devanagari: अश्वतर उवाच - जगद्धात्रीमहं देवीमारिराधयिषुः शुभाम् । स्तोष्ये प्रणम्य शिरसा ब्रह्मयोनिं
    सरस्वतीम् ॥ १॥ सदसद्देवि ! सत्किञ्चिन्मोक्षवच्चार्थवत्पदम् । तत्सर्वं त्वय्यसंयोगं योगवद्देवि ! संस्थितम्
    ॥ २॥ त्वमक्षरं परं देवि ! यत्र सर्वं प्रतिष्ठितम् । अक्षरं परमं देवि ! संस्थितं परमाणुवत् ॥ ३॥ अक्षरं
    परमं ब्रह्म विश्वञ्चैतत्क्षरात्मकम् । दारुण्यवस्थितो वह्निर्भौमाश्च परमाणवः ॥ ४॥ तथा त्वयि स्थितं
    ब्रह्म जगच्चेदमशेषतः । ओङ्काराक्षरसंस्थानं यत्तु देवि ! स्थिरास्थिरम् ॥ ५॥ तत्र मात्रात्रयं सर्वमस्ति
    यद्देवि नास्ति च । त्रयो लोकास्त्रयो वेदास्त्रैविद्यं पावकत्रयम् ॥ ६॥ त्रीणि ज्योतींषि वर्णाश्च त्रयो
    धर्मागमास्तथा । त्रयो गुणास्त्रयः शब्दस्त्रयो वेदास्तथाश्रमाः ॥ ७॥ त्रयः कालास्तथावस्थाः पितरोऽहर्निशादयः
    । एतन्मात्रात्रयं देवि ! तव रूपं सरस्वति ॥ ८॥ विभिन्नदर्शिनामाद्या ब्रह्मणो हि सनातनाः । सोमसंस्था
    हविः संस्थाः पाकसंस्थाश्च सप्त याः ॥ ९॥ तास्त्वदुच्चारणाद्देवि ! क्रियन्ते ब्रह्मवादिभिः । अनिर्देश्यं
    तथा चान्यदर्धमात्रान्वितं परम् ॥ १०॥ अविकार्यक्षयं दिव्यं परिणामविवर्जितम् । तवैतत्परमं रूपं यन्न
    शक्यं मयोदितुम् ॥ ११॥ न चास्ये न च तज्जिह्वा ताम्रोष्ठादिभिरुच्यते । इन्द्रोऽपि वसवो ब्रह्मा चन्द्रार्कौ
    ज्योतिरेव च ॥ १२॥ विश्वावासं विश्वरूपं विश्वेशं परमेश्वरम् । साङ्ख्यवेदान्तवादोक्तं बहुशाखास्थिरीकृतम्
    ॥ १३॥ अनादिमध्यनिधनं सदसन्न सदेव यत् । एकन्त्वनेकं नाप्येकं भवभेदसमाश्रैतम् ॥ १४॥ अनाख्यं षड्गुणाख्यञ्च
    वर्गाख्यं त्रिगुणाश्रयम् । नानाशक्तिमतामेकं शक्तिवैभविकं परम् ॥ १५॥ सुखासुखं महासौख्यरूपं त्वयि विभाव्यते
    । एवं देवि ! त्वया व्याप्तं सकलं निष्कलञ्च यत् । अद्वैतावस्थितं ब्रह्म यच्च द्वैते व्यवस्थितम् ॥ १६॥
    येऽर्था नित्या ये विनश्यन्ति चान्ये ये वा स्थूला ये च सूक्ष्मातिसूक्ष्माः । ये वा भूमौ येऽन्तरीक्षेऽन्यतो
    वा तेषां तेषां त्वत्त एवोपलब्धिः ॥ १७॥ यच्चामूर्तं यच्च मूर्तं समस्तं यद्वा भूतेष्वेकमेकञ्च किञ्चित्
    । यद्दिव्यस्ति क्ष्मातले खेऽन्यतो वा त्वत्सम्बद्धं त्वत्स्वरैर्व्यञ्जनैश्च ॥ १८॥ इति श्रीमार्कण्डेयपुराणे
    त्रयोविंशोऽध्यायान्तरगतं महासरस्वतीस्तवं सम्पूर्णम् । श्रीमार्कण्डेयपुराणे मदालसोपाख्याने कुवलयाश्वपातालगमनंनाम
    ंअर्कन्देय Pउरन अध्याय २३, वेर्सेस् ३०-४७
