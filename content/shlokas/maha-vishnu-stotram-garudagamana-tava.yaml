id: maha-vishnu-stotram-garudagamana-tava
category: stotram
name:
  english: Maha Vishnu Stotram - Garudagamana Tava
content:
  english: garudagamana tava caranakamalamiha manasi lasatu mama nityam manasi lasatu mama nityam | mama
    tapamapakuru deva mama papamapakuru deva || dhru || jalajanayana vidhinamuciharanamukha vibudhavinuta
    padapadma mama tapamapakuru deva || bhujagashayana bhava madanajanaka mama jananamarana bhayaharin
    mama tapamapakuru deva || shankhacakradhara dushtadaityahara sarvaloka sharana mama tapamapakuru deva
    gunagana asharanasharanada vidalita suraripujala mama tapamapakuru deva || bhaktavaryamiha bhurikarunaya
    pahi bharatitirtham mama tapamapakuru deva || iti jagadguru shringeri pithadhipati bharatitirthasvamina
    viracitam mahavishnustotram sampurnam |
  devanagari: गरुडगमन तव चरणकमलमिह मनसि लसतु मम नित्यम् मनसि लसतु मम नित्यम् । मम तापमपाकुरु देव मम पापमपाकुरु
    देव ॥ ध्रु ॥ जलजनयन विधिनमुचिहरणमुख विबुधविनुत पदपद्म मम तापमपाकुरु देव ॥ भुजगशयन भव मदनजनक मम जननमरण
    भयहारिन् मम तापमपाकुरु देव ॥ शङ्खचक्रधर दुष्टदैत्यहर सर्वलोक शरण मम तापमपाकुरु देव गुणगण अशरणशरणद
    विदलित सुररिपुजाल मम तापमपाकुरु देव ॥ भक्तवर्यमिह भूरिकरुणया पाहि भारतीतीर्थम् मम तापमपाकुरु देव ॥
    इति जगद्गुरु शृङ्गेरी पीठाधिपति भारतीतीर्थस्वामिना विरचितं महाविष्णुस्तोत्रं सम्पूर्णम् ।
