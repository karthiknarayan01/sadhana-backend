id: ramadasu-keerthanas-e-teeruga-nanu-daya-choochedavo
category: stotram
name:
  english: Ramadasu Keerthanas E Teeruga Nanu Daya Choochedavo
content:
  english: mayamalava gòvla janya a adi pallavi e tiruga nanu daya cucèdavo inavamshottama rama na tarama
    bhava sagaramidanu nalina dalekshana rama || e tiruga || caranam shri raghu nandana sita ramana shritajana
    poshaka rama karunyalaya bhakta varada ninu kannadi kanupu rama || e tiruga || caranam krurakarmamulu
    neraka cesiti neramulèncaku rama daridryamu pariharamu seyave daiva shikhamani rama || e tiruga ||
    caranam vasavanuta ramadasa poshaka vandana mayodhya rama dasarcita makabhaya mòsangave dasharathi
    raghurama || e tiruga || caranam gurudavu na madi daivamu nivani gurushastrambulu rama gurudaivambani
    yèrugaka tirigèdu krurudanaitini rama || e tiruga || caranam ninditi vi vakhilanda koti brahmandamulanduna
    rama ninduga madi ni namamu dalacina nityanandamu rama || e tiruga || caranam vasava kamala bhavasuravandita
    varadhi bandhana rama bhasura vara sadgunamulu kalgina bhadradrishvara rama || e tiruga || caranam
    muripèmuto na svamivi nevani munduga tèlpiti rama maruvaka ika nabhimanamuncu ne marugujòchitini rama
    || e tiruga || e tiruga nanu daya cucèdavo inavamshottama rama na tarama bhava sagaramidanu
  devanagari: मायमालव गॊव्ल जन्य आ आदि पल्लवि ए तीरुग ननु दय चूचॆदवो इनवंशोत्तम रामा ना तरमा भव सागरमीदनु
    नलिन दलेक्षण रामा ॥ ए तीरुग ॥ चरणं श्री रघु नन्दन सीता रमणा श्रितजन पोषक रामा कारुण्यालय भक्त वरद
    निनु कन्नदि कानुपु रामा ॥ ए तीरुग ॥ चरणं क्रूरकर्ममुलु नेरक चेसिति नेरमुलॆञ्चकु रामा दारिद्र्यमु परिहारमु
    सेयवे दैव शिखामणि रामा ॥ ए तीरुग ॥ चरणं वासवनुत रामदास पोषक वन्दन मयोध्य रामा दासार्चित माकभय मॊसङ्गवे
    दाशरथी रघुरामा ॥ ए तीरुग ॥ चरणं गुरुडवु ना मदि दैवमु नीवनि गुरुशास्त्रम्बुलु रामा गुरुदैवम्बनि यॆरुगक
    तिरिगॆडु क्रूरुडनैतिनि रामा ॥ ए तीरुग ॥ चरणं निण्डिति वी वखिलाण्ड कोटि ब्रह्माण्डमुलन्दुन रामा निण्डुग
    मदि नी नाममु दलचिन नित्यानन्दमु रामा ॥ ए तीरुग ॥ चरणं वासव कमल भवासुरवन्दित वारधि बन्धन रामा भासुर
    वर सद्गुणमुलु कल्गिन भद्राद्रीश्वर रामा ॥ ए तीरुग ॥ चरणं मुरिपॆमुतो ना स्वामिवि नेवनि मुन्दुग तॆल्पिति
    रामा मरुवक इक नभिमानमुन्चु ने मरुगुजॊछितिनि रामा ॥ ए तीरुग ॥ ए तीरुग ननु दय चूचॆदवो इनवंशोत्तम रामा
    ना तरमा भव सागरमीदनु
