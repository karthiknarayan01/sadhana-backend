id: vaidyanatha-ashtakam
category: stotram
name:
  english: Vaidyanatha Ashtakam
  devanagari: वैद्यनाथाष्टकम्
content:
  english: shriramasaumitrijatayuveda shadananadityakujarcitaya | (kujarcanaya) shrinilakanthaya dayamayaya
    shrivaidyanathaya namahshivaya || 1|| shambho mahadeva shambho mahadeva shambho mahadeva shambho mahadeva
    | shambho mahadeva shambho mahadeva shambho mahadeva shambho mahadeva || gangapravahendujatadharaya
    trilocanaya smarakalahantre | samastadevairabhipujitaya shrivaidyanathaya namah shivaya || 2|| shambho
    mahadeva |||| bhaktapriyaya tripurantakaya pinakine dushtaharaya nityam | pratyakshalilaya manushyaloke
    shrivaidyanathaya namah shivaya || 3|| shambho mahadeva |||| prabhutavatadisamastarogapranashakartre
    munivanditaya | prabhakarendvagnivilocanaya shrivaidyanathaya namah shivaya || 4|| (trilocanaya) shambho
    mahadeva |||| vakshrotranetranghrivihinajantoh vakshrotranetramghrisukhapradaya | kushthadisarvonnatarogahantre
    shrivaidyanathaya namah shivaya || 5|| shambho mahadeva |||| vedantavedyaya jaganmayaya yogishvaradhyeya
    padambujaya | trimurtirupaya sahasranamne shrivaidyanathaya namah shivaya || 6|| shambho mahadeva
    |||| svatirthamridbhasmabhritangabhajam pishacaduhkhartibhayapahaya | atmasvarupaya sharirabhajam
    shrivaidyanathaya namah shivaya || 7|| shambho mahadeva |||| shrinilakanthaya vrishadhvajaya sraggandhabhasmadyabhishobhitaya
    | suputradaradi subhagyadaya shrivaidyanathaya namah shivaya || 8|| shambho mahadeva |||| balambikesha
    vaidyesha bhavarogahareti ca | japennamatrayam nityam maharoganivaranam || 9|| shambho mahadeva ||||
    || iti shri vaidyanathashtakam || in some recordings, shambho mahadeva is modified or replaced by
    mahadeva mahadeva |
  devanagari: श्रीरामसौमित्रिजटायुवेद षडाननादित्यकुजार्चिताय । (कुजार्चनाय) श्रीनीलकण्ठाय दयामयाय श्रीवैद्यनाथाय
    नमःशिवाय ॥ १॥ शम्भो महादेव शम्भो महादेव शम्भो महादेव शम्भो महादेव । शम्भो महादेव शम्भो महादेव शम्भो
    महादेव शम्भो महादेव ॥ गङ्गाप्रवाहेन्दुजटाधराय त्रिलोचनाय स्मरकालहन्त्रे । समस्तदेवैरभिपूजिताय श्रीवैद्यनाथाय
    नमः शिवाय ॥ २॥ शम्भो महादेव ॥॥ भक्तप्रियाय त्रिपुरान्तकाय पिनाकिने दुष्टहराय नित्यम् । प्रत्यक्षलीलाय
    मनुष्यलोके श्रीवैद्यनाथाय नमः शिवाय ॥ ३॥ शम्भो महादेव ॥॥ प्रभूतवातादिसमस्तरोगप्रणाशकर्त्रे मुनिवन्दिताय
    । प्रभाकरेन्द्वग्निविलोचनाय श्रीवैद्यनाथाय नमः शिवाय ॥ ४॥ (त्रिलोचनाय) शम्भो महादेव ॥॥ वाक्श्रोत्रनेत्राङ्घ्रिविहीनजन्तोः
    वाक्श्रोत्रनेत्रांघ्रिसुखप्रदाय । कुष्ठादिसर्वोन्नतरोगहन्त्रे श्रीवैद्यनाथाय नमः शिवाय ॥ ५॥ शम्भो
    महादेव ॥॥ वेदान्तवेद्याय जगन्मयाय योगीश्वरध्येय पदाम्बुजाय । त्रिमूर्तिरूपाय सहस्रनाम्ने श्रीवैद्यनाथाय
    नमः शिवाय ॥ ६॥ शम्भो महादेव ॥॥ स्वतीर्थमृद्भस्मभृताङ्गभाजां पिशाचदुःखार्तिभयापहाय । आत्मस्वरूपाय शरीरभाजां
    श्रीवैद्यनाथाय नमः शिवाय ॥ ७॥ शम्भो महादेव ॥॥ श्रीनीलकण्ठाय वृषध्वजाय स्रग्गन्धभस्माद्यभिशोभिताय ।
    सुपुत्रदारादि सुभाग्यदाय श्रीवैद्यनाथाय नमः शिवाय ॥ ८॥ शम्भो महादेव ॥॥ बालाम्बिकेश वैद्येश भवरोगहरेति
    च । जपेन्नामत्रयं नित्यं महारोगनिवारणम् ॥ ९॥ शम्भो महादेव ॥॥ ॥ इति श्री वैद्यनाथाष्टकम् ॥ ईन् सोमे
    रेचोर्दिन्ग्स्, शम्भो महादेव इस् मोदिफ़िएद् ओर् रेप्लचेद् ब्य् महादेव महादेव ।
