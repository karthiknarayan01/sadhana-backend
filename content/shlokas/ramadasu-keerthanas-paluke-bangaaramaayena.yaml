id: ramadasu-keerthanas-paluke-bangaaramaayena
category: stotram
name:
  english: Ramadasu Keerthanas Paluke Bangaaramaayena
content:
  english: adi pallavi paluke bangaramayèna kodandapani paluke bangaramayèna caranam paluke bangaramayè
    pilacina palukavemi kalalo ni namasmarana maruva cakkani tandri || paluke bangaramayèna || caranam
    ènta vedinagani suntaina dayaradu pantamu seya nenèntativadanu tandri || paluke bangaramayèna || caranam
    sharanagatatrana birudankitudavukada karunincu bhadracala vararamadasa posha || paluke bangaramayèna
    || caranam iravuga isukalona pòralina uduta bhaktiki karuninci brocitivani nèra nammitini tandri ||
    paluke bangaramayèna || caranam rati natiga cesi bhutalamuna prakhyati cènditivani pritito nammiti
    tandri || paluke bangaramayèna || paluke bangaramayè pilacina palukavemi kalalo ni namasmarana maruva
    cakkani tandri paluke bangaramayèna paluke bangaramayèna kodandapani paluke bangaramayèna
  devanagari: आदि पल्लवि पलुके बङ्गारमायॆना कोदण्डपाणि पलुके बङ्गारमायॆना चरणं पलुके बङ्गारमायॆ पिलचिना
    पलुकवेमि कललो नी नामस्मरण मरुव चक्कनि तण्ड्री ॥ पलुके बङ्गारमायॆना ॥ चरणं ऎन्त वेडिनगानि सुन्तैन दयरादु
    पन्तमु सेय नेनॆन्तटिवाडनु तण्ड्री ॥ पलुके बङ्गारमायॆना ॥ चरणं शरणागतत्राण बिरुदाङ्कितुडवुकादा करुणिञ्चु
    भद्राचल वररामदास पोष ॥ पलुके बङ्गारमायॆना ॥ चरणं इरवुग इसुकलोन पॊरलिन उडुत भक्तिकि करुणिञ्चि ब्रोचितिवनि
    नॆर नम्मितिनि तण्ड्री ॥ पलुके बङ्गारमायॆना ॥ चरणं राति नातिग चेसि भूतलमुन प्रख्याति चॆन्दितिवनि प्रीतितो
    नम्मिति तण्ड्री ॥ पलुके बङ्गारमायॆना ॥ पलुके बङ्गारमायॆ पिलचिना पलुकवेमि कललो नी नामस्मरण मरुव चक्कनि
    तण्ड्री पलुके बङ्गारमायॆना पलुके बङ्गारमायॆना कोदण्डपाणि पलुके बङ्गारमायॆना
