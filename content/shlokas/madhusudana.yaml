id: madhusudana
category: stotram
name:
  english: madhusudana
  devanagari: मधुसुदन
content:
  english: shrimadhusudanastotram shriganeshaya namah || omiti jnanamatrena rogajirnena nirjita | kalanidram
    prapanno'smi trahi mam madhusudana || 1|| na gatirvidyate canya tvameva sharanam mama | papapanke
    nimagno'smi trahi mam madhusudana || 2|| mohito mohajalena putradaragrihadishu | trishnaya pidyamano'smi
    trahi mam madhusudana || 3|| bhaktihinam ca dinam ca duhkhashokaturam prabho | anashrayamanatham ca
    trahi mam madhusudana || 4|| gatagatena shranto'smi dirghasamsaravartmasu | yena bhuyo na gacchami
    trahi mam madhusudana || 5|| bahavo hi maya drishtah kleshashcaiva prithak prithak | garbhavase mahadduhkham
    trahi mam madhusudana || 6|| tena deva prapanno'smi tranartham tvatparayanah | duhkharnavaparitranat
    trahi mam madhusudana || 7|| vaca yacca pratijnatam karmana nopapaditam | tatpaparjitamagno'smi trahi
    mam madhusudana || 8|| sukritam na kritam kinciddushkritam ca kritam maya | samsaraghore magno'smi
    trahi mam madhusudana || 9|| dehantarasahasreshu canyonyabhramito maya | tiryaktvam manushatvam ca
    trahi mam madhusudana || 10|| vacayami yathonmattah pralapami tavagratah | jaramaranabhito'smi trahi
    mam madhusudana || 11|| yatra yatra ca yato'smi strishu va purusheshu ca | tatra tatracala bhaktistrahi
    mam madhusudana || 12|| gatva gatva nivartante candrasuryadayo grahah | adyapi na nivartante dvadashaksharacintakah
    || 13|| urdhvapatalamartyeshu vyaptam lokam jagattrayam | dvadashaksharatparam nasti vasudevena bhashitam
    || 14|| dvadashaksharam mahamantram sarvakamaphalapradam | garbhavasanivasena shukena paribhashitam
    || 15|| dvadashaksharam niraharo yah yah patheddharivasare | sa gacchedvaishnavam sthanam yatra yogeshvaro
    harih || 16|| iti shrishukadevaviracitam madhusudanastotram sampurnam ||
  devanagari: श्रीमधुसूदनस्तोत्रम् श्रीगणेशाय नमः ॥ ओमिति ज्ञानमात्रेण रोगाजीर्णेन निर्जिता । कालनिद्रां
    प्रपन्नोऽस्मि त्राहि मां मधुसूदन ॥ १॥ न गतिर्विद्यते चान्या त्वमेव शरणं मम । पापपङ्के निमग्नोऽस्मि
    त्राहि मां मधुसूदन ॥ २॥ मोहितो मोहजालेन पुत्रदारगृहादिषु । तृष्णया पीड्यमानोऽस्मि त्राहि मां मधुसूदन
    ॥ ३॥ भक्तिहीनं च दीनं च दुःखशोकातुरं प्रभो । अनाश्रयमनाथं च त्राहि मां मधुसूदन ॥ ४॥ गतागतेन श्रान्तोऽस्मि
    दीर्घसंसारवर्त्मसु । येन भूयो न गच्छामि त्राहि मां मधुसूदन ॥ ५॥ बहवो हि मया दृष्टाः क्लेशाश्चैव पृथक्
    पृथक् । गर्भवासे महद्दुःखं त्राहि मां मधुसूदन ॥ ६॥ तेन देव प्रपन्नोऽस्मि त्राणार्थं त्वत्परायणः ।
    दुःखार्णवपरित्राणात् त्राहि मां मधुसूदन ॥ ७॥ वाचा यच्च प्रतिज्ञातं कर्मणा नोपपादितम् । तत्पापार्जितमग्नोऽस्मि
    त्राहि मां मधुसूदन ॥ ८॥ सुकृतं न कृतं किञ्चिद्दुष्कृतं च कृतं मया । संसारघोरे मग्नोऽस्मि त्राहि मां
    मधुसूदन ॥ ९॥ देहान्तरसहस्रेषु चान्योन्यभ्रामितो मया । तिर्यक्त्वं मानुषत्वं च त्राहि मां मधुसूदन ॥
    १०॥ वाचयामि यथोन्मत्तः प्रलपामि तवाग्रतः । जरामरणभीतोऽस्मि त्राहि मां मधुसूदन ॥ ११॥ यत्र यत्र च यातोऽस्मि
    स्त्रीषु वा पुरुषेषु च । तत्र तत्राचला भक्तिस्त्राहि मां मधुसूदन ॥ १२॥ गत्वा गत्वा निवर्तन्ते चन्द्रसूर्यादयो
    ग्रहाः । अद्यापि न निवर्तन्ते द्वादशाक्षरचिन्तकाः ॥ १३॥ ऊर्ध्वपातालमर्त्येषु व्याप्तं लोकं जगत्त्रयम्
    । द्वादशाक्षरात्परं नास्ति वासुदेवेन भाषितम् ॥ १४॥ द्वादशाक्षरं महामन्त्रं सर्वकामफलप्रदम् । गर्भवासनिवासेन
    शुकेन परिभाषितम् ॥ १५॥ द्वादशाक्षरं निराहारो यः यः पठेद्धरिवासरे । स गच्छेद्वैष्णवं स्थानं यत्र योगेश्वरो
    हरिः ॥ १६॥ इति श्रीशुकदेवविरचितं मधुसूदनस्तोत्रं सम्पूर्णम् ॥
