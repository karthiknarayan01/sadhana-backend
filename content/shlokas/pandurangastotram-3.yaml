id: pandurangastotram-3
category: stotram
name:
  english: pandurangastotram 3
  devanagari: पाण्डुरन्गस्तोत्रम् ३
content:
  english: '|| 33|| iti shriramanandanamayureshvarakritam pandurangastotram sampurnam | tippani 1| surah
    sidanti asyamiti surasat tasyah | devasabhaya ityarthah | 2| dhanabad geya va rucih kantiryasya tatsambuddhau
    | tvamaghanage papaparvate ashanirvajram tadvat papani nashayasiti bhavah | he abhava aja | ma mam
    ava raksheti yojana | 3| samalam sapapam | 4| pundarikamuneh | sitasaroruham pundarikam sa aha nama
    yasya tasya muneh | 5| vivaram mukhabilam tasmadujjhita nirgata shuddha vag yasya sah | 6| varma kavacam
    | 7|'
  devanagari: ॥ ३३॥ इति श्रीरामनन्दनमयूरेश्वरकृतं पाण्डुरङ्गस्तोत्रं सम्पूर्णम् । टिप्पणि १। सुराः सीदन्ति
    अस्यामिति सुरसत् तस्याः । देवसभाया इत्यर्थः । २। धनबद् गेया वा रुचिः कान्तिर्यस्य तत्सम्बुद्धौ । त्वमघनगे
    पापपर्वते अशनिर्वज्रं तद्वत् पापानि नाशयसीति भावः । हे अभव अज । मा मां अव रक्षेति योजना । ३। समलं
    सपापम् । ४। पुण्डरीकमुनेः । सितसरोरुहं पुण्डरीकं सा आहा नाम यस्य तस्य मुनेः । ५। विवरं मुखबिलं तस्मादुज्झिता
    निर्गता शुद्धा वाग् यस्य सः । ६। वर्म कवचम् । ७।
