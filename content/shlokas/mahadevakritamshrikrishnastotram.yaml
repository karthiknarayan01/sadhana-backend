id: mahadevakritamshrikrishnastotram
category: stotram
name:
  english: mahadevakritamshrikrishnastotram
  devanagari: महादेवकृतंश्रीकृष्णस्तोत्रम्
content:
  english: mahadevakritam shrikrishnastotram mahadeva uvaca | brahmana prarthitastvam ca samagatya vasundharam
    | bhubharaharanam kritva prayasi svapadam vibho || 19|| trailokye prithivi dhanya sadyah puta padankita
    | vayam ca munayo dhanyah sakshaddrishtva padambujam || 20|| dhyanasadhyo duraradhyo muninamurdhvaretasam
    | asmakamapi yashceshah so'dhuna cakshusho bhuvi || 21|| vasuh sarvanivasashca vishvani yasya lomasu
    | devastasya mahavishnurvasudevo mahitale || 22|| suciram tapasa labdham siddhendranam sudurlabham
    | yatpadapadmamatulam cakshusham sarvajivinam || 23|| iti brahmavaivartapurane shrikrishnajanmakhande
    purvabhage ekonatrimshadhikashatatamadhyayantargatam mahadevakritam shrikrishnastotram samaptam |
    brahmavaivartapurana | shrikrishnajanma
  devanagari: महादेवकृतं श्रीकृष्णस्तोत्रम् महादेव उवाच । ब्रह्मणा प्रार्थितस्त्वं च समागत्य वसुन्धराम्
    । भूभारहरणं कृत्वा प्रयासि स्वपदं विभो ॥ १९॥ त्रैलोक्ये पृथिवी धन्या सद्यः पूता पदाङ्किता । वयं च
    मुनयो धन्याः साक्षाद्दृष्ट्वा पदाम्बुजम् ॥ २०॥ ध्यानासाध्यो दुराराध्यो मुनीनामूर्ध्वरेतसाम् । अस्माकमपि
    यश्चेशः सोऽधुना चाक्षुषो भुवि ॥ २१॥ वासुः सर्वनिवासश्च विश्वानि यस्य लोमसु । देवस्तस्य महाविष्णुर्वासुदेवो
    महीतले ॥ २२॥ सुचिरं तपसा लब्धं सिद्धेन्द्राणां सुदुर्लभम् । यत्पादपद्ममतुलं चाक्षुषं सर्वजीविनाम्
    ॥ २३॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वभागे एकोनत्रिंशाधिकशततमाध्यायान्तर्गतं महादेवकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
