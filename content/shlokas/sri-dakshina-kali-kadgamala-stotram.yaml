id: sri-dakshina-kali-kadgamala-stotram
category: stotram
name:
  english: Sri Dakshina Kali Kadgamala Stotram
content:
  english: asya shridakshinakalika khadgamalamantrasya shri bhagavan mahakalabhairava rishih ushnik chandah
    shuddhah kakara tripancabhattarakapithasthita mahakaleshvarankanilaya mahakaleshvari trigunatmika
    shrimaddakshina kalika mahabhayaharika devata krim bijam hrim shaktih hum kilakam mama sarvabhishtasiddhyarthe
    khadgamalamantra jape viniyogah || rishyadi nyasah om mahakalabhairava rishaye namah shirasi | ushnik
    chandase namah mukhe | dakshinakalika devatayai namah hridi | krim bijaya namah guhye | hrim shaktaye
    namah padayoh | hum kilakaya namah nabhau | viniyogaya namah sarvange | karanyasah om kram angushthabhyam
    namah | om krim tarjanibhyam namah | om krum madhyamabhyam namah | om kraim anamikabhyam namah | om
    kraum kanishthikabhyam namah | om krah karatalakaraprishthabhyam namah | hridayadinyasah om kram hridayaya
    namah | om krim shirase svaha | om krum shikhayai vashat | om kraim kavacaya hum | om kraum netratrayaya
    vaushat | om krah astraya phat | dhyanam sadyashchinnashirah kripanamabhayam hastairvaram bibhratim
    ghorasyam shirasi sraja suruciranunmukta keshavalim | srikkasrikpravaham shmashananilayam shrutyoh
    shavalankritim shyamangim kritamekhalam shavakarairdevim bhaje kalikam || || shavarudham mahabhimam
    ghoradamshtram hasanmukhim caturbhujam khadgamundavarabhayakaram shivam | mundamaladharam devim lalajjihvam
    digambaram evam sancintayetkalim shmashanalayavasinim || || lamityadi pancapujah lam prithivyatmikayai
    gandham samarpayami | ham akashatmikayai pushpam samarpayami | yam vayvatmikayai dhupamaghrapayami
    | ram agnyatmikayai dipam darshayami | vam amritatmikayai amritopaharam nivedayami | sam sarvatmikayai
    sarvopacaran samarpayami | atha khadgamala om aim hrim shrim krim hum hrim shrimaddakshinakalike hridayadevi
    siddhikalikamayi shirodevi mahakalikamayi shikhadevi guhyakalikamayi kavacadevi shmashanakalikamayi
    netradevi bhadrakalikamayi astradevi shrimaddakshinakalikamayi sarvasampatpradayaka cakrasvamini |
    jaya siddhimayi sarvamangalamayacakrasvamini | shrigurumayi sarvasampatpradayakacakrasvamini | mahadevyambamayi
    tripurabhairavanandanathamayi smaradviryanandanathamayi prajapatyanandanathamayi granthidevanandanathamayi
    vighneshvaranandanathamayi sarvasampatpradayakacakrasvamini | kali sarvepsitaphalapradayakacakrasvamini
    | brahmi trailokyamohanacakrasvamini | asitangabhairavamayi sarvasankshobhana cakrasvamini | hetuvatukanandanathamayi
    tripurantakavatukanandanathamayi vetalavatukanandanathamayi vahnijihvavatukanandanathamayi ekapadavatukanandanathamayi
    sarvasaubhagyadayakacakrasvamini | om aim hrim klim hum phat svaha simhavyaghramukhi yoginidevimayi
    sarpasumukhi yoginidevimayi mrigameshamukhi yoginidevimayi gajavajimukhi yoginidevimayi bidalamukhi
    yoginidevimayi kroshtasumukhi yoginidevimayi lambodari yoginidevimayi hrasvajangha yoginidevimayi
    talajangha yoginidevimayi pralamboshthi yoginidevimayi sarvarthadayakacakrasvamini | om aim hrim shrim
    krim hum hrim indramayi sarvarakshakaracakrasvamini | khadgamayi sarvashaparipurakacakrasvamini |
    vatukanandanathamayi kshetrapalanandanathamayi sarvasankshobhanacakrasvamini | namaste namaste phat
    svaha || caturastradbahih samyak samsthitashca samantatah | te ca sampujitah santu devah devi grihe
    sthitah || siddhah sadhyah bhairavashca gandharva vasavo'shvinau | munayo grahastushyantu vishvedevashca
    ushmayah || rudradityashca pitarah pannagah yakshacaranah | yogeshvaropasaka ye tushyanti narakinnarah
    || naga va danavendrashca bhutapretapishacakah | astrani sarvashastrani mantra yantrarcana kriyah
    || shantim kuru mahamaye sarvasiddhipradayike | sarvasiddhimayacakrasvamini namaste namaste svaha
    || sarvajne sarvashakte sarvarthaprade shive sarvamangalamaye sarvavyadhivinashini sarvadharasvarupe
    sarvapapahare sarvarakshasvarupini sarvepsitaphalaprade sarvamangaladayaka cakrasvamini namaste namaste
    svaha || krim hrim hum kshmyum mahakalaya haum mahadeva mahakala sarvasiddhipradayaka devi bhagavati
    candacandika candacitatma prinatu dakshinakalikayai sarvajne sarvashakte shrimahakalasahite shridakshinakalikayai
    namaste namaste phat svaha | hrim hum krim shrim hrim aim om || iti shrirudrayamale dakshinakalika
    khadgamala stotram |
  devanagari: अस्य श्रीदक्षिणकालिका खड्गमालामन्त्रस्य श्री भगवान् महाकालभैरव ऋषिः उष्णिक् छन्दः शुद्धः
    ककार त्रिपञ्चभट्टारकपीठस्थित महाकालेश्वराङ्कनिलया महाकालेश्वरी त्रिगुणात्मिका श्रीमद्दक्षिणा कालिका
    महाभयहारिका देवता क्रीं बीजं ह्रीं शक्तिः हूं कीलकं मम सर्वाभीष्टसिद्ध्यर्थे खड्गमालामन्त्र जपे विनियोगः
    ॥ ऋष्यादि न्यासः ॐ महाकालभैरव ऋषये नमः शिरसि । उष्णिक् छन्दसे नमः मुखे । दक्षिणकालिका देवतायै नमः
    हृदि । क्रीं बीजाय नमः गुह्ये । ह्रीं शक्तये नमः पादयोः । हूं कीलकाय नमः नाभौ । विनियोगाय नमः सर्वाङ्गे
    । करन्यासः ॐ क्रां अङ्गुष्ठाभ्यां नमः । ॐ क्रीं तर्जनीभ्यां नमः । ॐ क्रूं मध्यमाभ्यां नमः । ॐ क्रैं
    अनामिकाभ्यां नमः । ॐ क्रौं कनिष्ठिकाभ्यां नमः । ॐ क्रः करतलकरपृष्ठाभ्यां नमः । हृदयादिन्यासः ॐ क्रां
    हृदयाय नमः । ॐ क्रीं शिरसे स्वाहा । ॐ क्रूं शिखायै वषट् । ॐ क्रैं कवचाय हुम् । ॐ क्रौं नेत्रत्रयाय
    वौषट् । ॐ क्रः अस्त्राय फट् । ध्यानम् सद्यश्छिन्नशिरः कृपाणमभयं हस्तैर्वरं बिभ्रतीं घोरास्यां शिरसि
    स्रजा सुरुचिरानुन्मुक्त केशावलिम् । सृक्कासृक्प्रवहां श्मशाननिलयां श्रुत्योः शवालङ्कृतिं श्यामाङ्गीं
    कृतमेखलां शवकरैर्देवीं भजे कालिकाम् ॥ ॥ शवारूढां महाभीमां घोरदंष्ट्रां हसन्मुखीं चतुर्भुजां खड्गमुण्डवराभयकरां
    शिवाम् । मुण्डमालाधरां देवीं ललज्जिह्वां दिगम्बरां एवं सञ्चिन्तयेत्कालीं श्मशानालयवासिनीम् ॥ ॥ लमित्यादि
    पञ्चपूजाः लं पृथिव्यात्मिकायै गन्धं समर्पयामि । हं आकाशात्मिकायै पुष्पं समर्पयामि । यं वाय्वात्मिकायै
    धूपमाघ्रापयामि । रं अग्न्यात्मिकायै दीपं दर्शयामि । वं अमृतात्मिकायै अमृतोपहारं निवेदयामि । सं सर्वात्मिकायै
    सर्वोपचारान् समर्पयामि । अथ खड्गमाला ॐ ऐं ह्रीं श्रीं क्रीं हूं ह्रीं श्रीमद्दक्षिणकालिके हृदयदेवि
    सिद्धिकालिकामयि शिरोदेवि महाकालिकामयि शिखादेवि गुह्यकालिकामयि कवचदेवि श्मशानकालिकामयि नेत्रदेवि भद्रकालिकामयि
    अस्त्रदेवि श्रीमद्दक्षिणकालिकामयि सर्वसम्पत्प्रदायक चक्रस्वामिनि । जया सिद्धिमयि सर्वमङ्गलमयचक्रस्वामिनि
    । श्रीगुरुमयि सर्वसम्पत्प्रदायकचक्रस्वामिनि । महादेव्यम्बामयि त्रिपुरभैरवानन्दनाथमयि स्मराद्वीर्यानन्दनाथमयि
    प्रजापत्यानन्दनाथमयि ग्रन्थिदेवानन्दनाथमयि विघ्नेश्वरानन्दनाथमयि सर्वसम्पत्प्रदायकचक्रस्वामिनि । कालि
    सर्वेप्सितफलप्रदायकचक्रस्वामिनि । ब्राह्मि त्रैलोक्यमोहनचक्रस्वामिनि । असिताङ्गभैरवमयि सर्वसङ्क्षोभण
    चक्रस्वामिनि । हेतुवटुकानन्दनाथमयि त्रिपुरान्तकवटुकानन्दनाथमयि वेतालवटुकानन्दनाथमयि वह्निजिह्ववटुकानन्दनाथमयि
    एकपादवटुकानन्दनाथमयि सर्वसौभाग्यदायकचक्रस्वामिनि । ॐ ऐं ह्रीं क्लीं हूं फट् स्वाहा सिंहव्याघ्रमुखी
    योगिनिदेवीमयि सर्पासुमुखी योगिनिदेवीमयि मृगमेषमुखी योगिनिदेवीमयि गजवाजिमुखी योगिनिदेवीमयि बिडालमुखी
    योगिनिदेवीमयि क्रोष्टासुमुखी योगिनिदेवीमयि लम्बोदरी योगिनिदेवीमयि ह्रस्वजङ्घा योगिनिदेवीमयि तालजङ्घा
    योगिनिदेवीमयि प्रलम्बोष्ठी योगिनिदेवीमयि सर्वार्थदायकचक्रस्वामिनि । ॐ ऐं ह्रीं श्रीं क्रीं हूं ह्रीं
    इन्द्रमयि सर्वरक्षाकरचक्रस्वामिनि । खड्गमयि सर्वाशापरिपूरकचक्रस्वामिनि । वटुकानन्दनाथमयि क्षेत्रपालानन्दनाथमयि
    सर्वसङ्क्षोभणचक्रस्वामिनि । नमस्ते नमस्ते फट् स्वाहा ॥ चतुरस्त्राद्बहिः सम्यक् संस्थिताश्च समन्ततः
    । ते च सम्पूजिताः सन्तु देवाः देवि गृहे स्थिताः ॥ सिद्धाः साध्याः भैरवाश्च गन्धर्वा वसवोऽश्विनौ ।
    मुनयो ग्रहास्तुष्यन्तु विश्वेदेवाश्च उष्मयाः ॥ रुद्रादित्याश्च पितरः पन्नगाः यक्षचारणाः । योगेश्वरोपासका
    ये तुष्यन्ति नरकिन्नराः ॥ नागा वा दानवेन्द्राश्च भूतप्रेतपिशाचकाः । अस्त्राणि सर्वशस्त्राणि मन्त्र
    यन्त्रार्चन क्रियाः ॥ शान्तिं कुरु महामाये सर्वसिद्धिप्रदायिके । सर्वसिद्धिमयचक्रस्वामिनि नमस्ते नमस्ते
    स्वाहा ॥ सर्वज्ञे सर्वशक्ते सर्वार्थप्रदे शिवे सर्वमङ्गलमये सर्वव्याधिविनाशिनि सर्वाधारस्वरूपे सर्वपापहरे
    सर्वरक्षास्वरूपिणि सर्वेप्सितफलप्रदे सर्वमङ्गलदायक चक्रस्वामिनि नमस्ते नमस्ते स्वाहा ॥ क्रीं ह्रीं
    हूं क्ष्म्यूं महाकालाय हौं महादेव महाकाल सर्वसिद्धिप्रदायक देवी भगवती चण्डचण्डिका चण्डचितात्मा प्रीणातु
    दक्षिणकालिकायै सर्वज्ञे सर्वशक्ते श्रीमहाकालसहिते श्रीदक्षिणकालिकायै नमस्ते नमस्ते फट् स्वाहा । ह्रीं
    हूं क्रीं श्रीं ह्रीं ऐं ओम् ॥ इति श्रीरुद्रयामले दक्षिणकालिका खड्गमाला स्तोत्रम् ।
