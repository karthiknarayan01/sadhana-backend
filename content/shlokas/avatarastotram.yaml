id: avatarastotram
category: stotram
name:
  english: avatarastotram
  devanagari: अवतारस्तोत्रम्
content:
  english: avatarastotram sarvam jagat harimayam jagatiti vakyam svayam vidhatumatha citratanum vidhaya
    | stambhadajayata sada yatatam durapah so'stu triyuktadashamah shamado nrisimhah ||
  devanagari: अवतारस्तोत्रम् सर्वं जगत् हरिमयं जगतीति वाक्यं स्वयं विधातुमथ चित्रतनुं विधाय । स्तम्भादजायत
    सदा यततां दुरापः सोऽस्तु त्रियुक्तदशमः शमदो नृसिंहः ॥
meaning: {}
