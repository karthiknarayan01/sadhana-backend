id: mahishamardinikavacam-2
category: kavacha
name:
  english: mahishamardinikavacam 2
  devanagari: महिषमर्दिनीकवचम् २
content:
  english: bhupradeshe same shuddhe pushpaprakarasankule | kalpayedasanam dhiman komalam kambalasanam
    || 3|| vame gurum punarnatva dakshine ca ganadhipam | madhye tu mardinim natva sarve rakshantu mam
    sada || 4|| agneyyam nairrite patu caishanyam vayave tatha | uttare patu lalita jihvalalanabhishana
    || 5|| kaumari pashcime patu dhanada ca disho dashah | shakini dakini patu mardini patu sarvada ||
    6|| kalpavrikshah sada patu vighna ca raktadantika | etastu varayoginyo rakshantu sadhakagratah ||
    7|| pathitva pathayitva ca kavacam siddhidayakam | pathenmasatrayam mantro varamekam tatha nishi ||
    8|| ratrau varatrayam japtva nashayedvighnameva ca | japanmasatrayam vidyam rajanam vashamanayet ||
    9|| bhito bhayat pramucyeta devi
  devanagari: भूप्रदेशे समे शुद्धे पुष्पप्रकरसङ्कुले । कल्पयेदासनं धीमान् कोमलं कम्बलासनम् ॥ ३॥ वामे गुरुं
    पुनर्नत्वा दक्षिणे च गणाधिपम् । मध्ये तु मर्दिनीं नत्वा सर्वे रक्षन्तु मां सदा ॥ ४॥ आग्नेय्यां नैरॄते
    पातु चैशान्यां वायवे तथा । उत्तरे पातु ललिता जिह्वाललनभीषण ॥ ५॥ कौमारी पश्चिमे पातु धनदा च दिशो दशः
    । शाकिनी डाकिनी पातु मर्दिनी पातु सर्वदा ॥ ६॥ कल्पवृक्षः सदा पातु विघ्न च रक्तदन्तिका । एतास्तु वरयोगिन्यो
    रक्षन्तु साधकाग्रतः ॥ ७॥ पठित्वा पाठयित्वा च कवचं सिद्धिदायकम् । पठेन्मासत्रयं मन्त्रो वारमेकं तथा
    निशि ॥ ८॥ रात्रौ वारत्रयं जप्त्वा नाशयेद्विघ्नमेव च । जपन्मासत्रयं विद्यां राजानं वशमानयेत् ॥ ९॥ भीतो
    भयात् प्रमुच्येत देवि
