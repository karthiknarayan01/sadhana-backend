id: ghatikacalahanumatstotram-1
category: stotram
name:
  english: ghatikacalahanumatstotram 1
  devanagari: घटिकाचलहनुमत्स्तोत्रम् १
content:
  english: rinu | ekamasadvaradah sakshat dvimasadranganayakah || 1|| masardhena pravakshyami tatha vai
    venkateshvarah | ardhamasena dasyami kritam tu paramam shivam || 2|| ghatikacalasamsthanaddhatikacalavallabhah
    | hanumananjanasunu ramabhakto jitendriyah || 3|| ghatikadeva kamyanam kamadata bhavamyaham | shankhacakraprado
    yena pradasyami hareh padam || 4|| ghatikacalasamsthane ghatikam vasate yadi | sa muktah sarvalokeshu
    vayuputraprasadatah || 5|| brahmatirthasya nikate raghavendrasya sannidhau | vayuputram samalokya
    na bhayam vidyate nare || 6|| tasmadvayusutasthanam pavitramatidularbham | purvabdheh pashcime bhage
    dakshinabdhestathottare || 7|| venkataddakshine bhage parvate ghatikacale | tatraiva rishayah sarve
    tapastapyanti sadaram || 8|| pancaksharamahamantram dvishatkam ca dvijatinam | namamantram tatah shriman
    strishudranamudahritam || 9|| tatra snatva brahmatirthe natva tam vayumandire | vayuputram bhajennityam
    sarvarishtavivarjitah || 10|| sevate mandalam nityam tatha vai hyardhamandalam | vanchitam vindate
    nityam vayuputraprasadatah || 11|| tasmattvamapi bhoh putra nivasam ghatikacale || 11|| narada uvaca
    katham vasah prakartavyo ghatikacalamastake | kena mantrena balavananjaneyah prasidati || 12|| vidhanam
    tasya mantrasya homam caiva visheshatah | kiyatkalam tatra vasam kartavyam tanmamavada || 13|| brahmovaca
    brahmatirthe tatah snatva hanumatsammukhe sthitah | dvadashaksharamantram tu nityamashtasahasrakam
    || 14|| japenniyamatah shuddhastadbhaktastu parayanah | niraharah phalaharo brahmacaryavrate sthitah
    || 15|| mandalam tatra vastavyam bhaktiyuktena cetasa | dhyanashlokam pravakshyami sha
  devanagari: ृणु । एकमासाद्वरदः साक्षात् द्विमासाद्रङ्गनायकः ॥ १॥ मासार्धेन प्रवक्ष्यमि तथा वै वेङ्कटेश्वरः
    । अर्धमासेन दास्यामि कृतं तु परमं शिवम् ॥ २॥ घटिकाचलसंस्थानाद्धटिकाचलवल्लभः । हनुमानञ्जनासूनू रामभक्तो
    जितेन्द्रियः ॥ ३॥ घटिकादेव काम्यानां कामदाता भवाम्यहम् । शङ्खचक्रप्रदो येन प्रदास्यामि हरेः पदम् ॥
    ४॥ घटिकाचलसंस्थाने घटिकां वसते यदि । स मुक्तः सर्वलोकेषु वायुपुत्रप्रसादतः ॥ ५॥ ब्रह्मतीर्थस्य निकटे
    राघवेन्द्रस्य सन्निधौ । वायुपुत्रं समालोक्य न भयं विद्यते नरे ॥ ६॥ तस्माद्वायुसुतस्थानं पवित्रमतिदुलर्भम्
    । पूर्वाब्धेः पश्चिमे भागे दक्षिणाब्धेस्तथोत्तरे ॥ ७॥ वेङ्कटाद्दक्षिणे भागे पर्वते घटिकाचले । तत्रैव
    ऋषयः सर्वे तपस्तप्यन्ति सादरम् ॥ ८॥ पञ्चाक्षरमहामन्त्रं द्विषट्कं च द्विजातिनाम् । नाममन्त्रं ततः
    श्रीमन् स्त्रीशूद्राणामुदाहृतम् ॥ ९॥ तत्र स्नात्वा ब्रह्मतीर्थे नत्वा तं वायुमन्दिरे । वायुपुत्रं
    भजेन्नित्यं सर्वारिष्टविवर्जितः ॥ १०॥ सेवते मण्डलं नित्यं तथा वै ह्यर्धमण्डलम् । वाञ्छितं विन्दते
    नित्यं वायुपुत्रप्रसादतः ॥ ११॥ तस्मात्त्वमपि भोः पुत्र निवासं घटिकाचले ॥ ११॥ नारद उवाच कथं वासः प्रकर्तव्यो
    घटिकाचलमस्तके । केन मन्त्रेण बलवानाञ्जनेयः प्रसीदति ॥ १२॥ विधानं तस्य मन्त्रस्य होमं चैव विशेषतः ।
    कियत्कालं तत्र वासं कर्तव्यं तन्ममावद ॥ १३॥ ब्रह्मोवाच ब्रह्मतीर्थे ततः स्नत्वा हनुमत्संमुखे स्थितः
    । द्वादशाक्षरमन्त्रं तु नित्यमष्टसहस्रकम् ॥ १४॥ जपेन्नियमतः शुद्धस्तद्भक्तस्तु परायणः । निराहारः फलाहारो
    ब्रह्मचर्यव्रते स्थितः ॥ १५॥ मण्डलं तत्र वस्तव्यं भक्तियुक्तेन चेतसा । ध्यानश्लोकं प्रवक्ष्यामि श
