id: brahmanandastotram
category: stotram
name:
  english: brahmanandastotram
  devanagari: ब्रह्मानन्दस्तोत्रम्
content:
  english: namami shantam shishubhava sundaram || 1|| muhurmuhuh shriharinamavihvalam sunirmalam yogasudhabdhi
    majjanat | dayaghanam nathamanathapavanam namami dantam yativrindashekharam || 2|| na ramakrishnasya
    sharirasambhavah sa manasajjata itiha kirtitah | yathaiva tatah surasanghapujitastathaiva putro narapala
    sevitah || 3|| anantabhavalayadivyasagaram bahih sushantapihitatmabhavam | gatakhiladhyatmya surajyasampadam
    bhajami devadya manojanandanam || 4|| praphullapankeruhamadhyacarina balanujenanga samuhagamina |
    karairdhrita nrityasugitaramyakam namo maharajamatindriyapriyam || 5|| na sadhaneneha gato'si bhavinim
    vadanti siddhim tvamasau gadadharah | ya to bhavadrik kritanityasiddhigo vashi kshama mangalakrityavigrahah
    || 6|| manushyadeham bhajatapi daivatad variyasa shuddha viragina tvaya | prabhorniyogena salilamatani
    kriyatapojnanasamadhisadhanam || 7|| grihana deva
  devanagari: नमामि शान्तं शिशुभाव सुन्दरम् ॥ १॥ मुहुर्मुहुः श्रीहरिनामविह्वलं सुनिर्मलं योगसुधाब्धि मज्जनात्
    । दयाघनं नाथमनाथपावनं नमामि दान्तं यतिवृन्दशेखरम् ॥ २॥ न रामकृष्णस्य शरीरसम्भवः स मानसाज्जात इतीह
    कीर्तितः । यथैव तातः सुरसङ्घपूजितस्तथैव पुत्रो नरपाल सेवितः ॥ ३॥ अनन्तभावालयदिव्यसागरं बहिः सुशान्तापिहितात्मभावम्
    । गताखिलाध्यात्म्य सुराज्यसम्पदं भजामि देवाद्य मनोजनन्दनम् ॥ ४॥ प्रफुल्लपङ्केरुहमध्यचारिणा बलानुजेनाङ्ग
    समूहगामिना । करैर्धृत नृत्यसुगीतरम्यकं नमो महाराजमतीन्द्रियप्रियम् ॥ ५॥ न साधनेनेह गतोऽसि भाविनीं
    वदन्ति सिद्धिं त्वमसौ गदाधराः । य तो भवादृक् कृतनित्यसिद्धिगो वशी क्षमा मङ्गलकृत्यविग्रहः ॥ ६॥ मनुष्यदेहं
    भजतापि दैवताद् वरीयसा शुद्ध विरागिणा त्वया । प्रभोर्नियोगेन सलीलमातनि क्रियातपोज्ञानसमाधिसाधनम् ॥
    ७॥ गृहाण देव
