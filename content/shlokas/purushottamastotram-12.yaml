id: purushottamastotram-12
category: stotram
name:
  english: purushottamastotram 12
  devanagari: पुरुषोत्तमस्तोत्रम् १२
content:
  english: sarvavatari satatam prarakshatat || 202|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya
    purushottamastotram sampurnam | lakshminarayaniyasamhita | khanda 3| adhyaya 237
  devanagari: सर्वावतारी सततं प्ररक्षतात् ॥ २०२॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य
    पुरुषोत्तमस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता । खण्ड ३। अध्याय २३७
