id: shivasahasranamastotramahabhagavata
category: sahasranama
name:
  english: shivasahasranamastotramahabhagavata
  devanagari: शिवसहस्रनामस्तोत्रमहाभागवत
content:
  english: om namaste parvatinatha devadeva paratpara | acyutanagha pancasya bhimasya ruciranana || 1||
    vyaghrajinadharananta paravaravivarjita | pancanana mahasattva mahajnanamaya prabho || 2|| ajitamitadurdharsha
    vishvesha parameshvara | vishvatmanvishvabhutesha vishvashraya jagatpate || 3|| vishvopakarinvishvaikadhama
    vishvashrayashraya | vishvadhara sadananda vishvananda namo'stu te || 4|| sharva sarvavidajnanavivarjita
    surottama | suravandya surastutya suraraja surottama || 5|| surapujya suradhyeya sureshvara surantaka
    | surarimardaka surashreshtha te'stu namo namah || 6|| tvam shuddhah shuddhabodhashca shuddhatma jagatam
    patih | shambhuh svayambhuratyugra ugrakarmogralocanah || 7|| ugraprabhavashcatyugramardako'tyugrarupavan
    | ugrakanthah shivah shantah sarvashantividhayakah || 8|| sarvarthadah shivadharah shivayaniramitrajit
    | shivadah shivakarta ca shivahanta shiveshvarah || 9|| shishuh shaishavayuktasca pingakesho jatadharah
    | gangadharakapardi ca jatajutavirajitah || 10|| jatilo jatilaradhyah sarvadonmattamanasah | unmattakesha
    unmatta unmattanamadhishvarah || 11|| unmattalocano bhimastrinetro bhimalocanah | bahunetro dvinetri
    ca raktanetrah sunetrakah || 12|| dirghanetrasca pingakshah suprabhakhyah sulocanah | somanetro'gninetrakhyah
    suryanetrah suviryavan || 13|| padmakshah kamalakshashca nilotpaladalekshanah | sulakshanah shulapanih
    kapali kapilekshanah || 14|| vyaghurnanayano dhurto vyaghracarmambaravritah | shrikantho nilakanthakhyah
    shitikanthah sukanthakah || 15|| candracudashcandradharashcandramaulih shashankabhrit | shashikantah
    shashankabhah shashankankitamurdhajah || 16|| shashankavadano viro varado varalocanah | sharaccandrasamabhasah
    sharadindusamaprabhah || 17|| kotisuryapratikashashcandrasyashcandrashekharah | ashtamurtirmahamutirbhimamurtirbhayanakah
    || 18|| bhayadata bhayatrata bhayaharta bhayojjhitah | nirbhuto bhutavandyashca bhutatma bhutabhavanah
    || 19|| kaupinavasa durvasa vivasah kaminipatih | karalah kirtido vaidyah kishorah kamanashanah ||
    20|| kirtirupah kuntadhari kalakutakritashanah | kalakutah surupi ca kulamantrapradipakah || 21||
    kalakashthatmakah kashivihari kutilananah | mahakananasamvasi kaliprativivardhanah || 22|| kalidharah
    kamacari kulakirtivivardhanah | kamadrih kamukavarah karmuki kamamohitah || 23 katakshah kanakabhasah
    kanakojjvalagatrakah | kamaturah kvanatpadah kutilabhrukutidharah || 24|| kartikeyapita kokanadabhushanabhushitah
    | khatvangayoddha khadgi ca girisho gaganeshvarah || 25 ganadhyakshah khetakadhrik kharvah kharvatarah
    khagah | khagarudhah khagaradhyah khecarah khecareshvarah || 26|| khecaratvapradah kshonipatih khecaramardakah
    | ganeshvaro ganapita garishtho ganabhupatih || 27|| gururgurutaro jneyo gangapatiramarshanah | gitapriyo
    gitaratah sugopyo gopavrindapah || 28|| gavarudho jagadbharta gosvami gosvarupakah | goprado godharo
    gridhro garutman gokritasanah || 29|| gopisho gurutatashca guhavasi sugopitah | gajarudho gajasyashca
    gajajinadharo'grajah || 30|| grahadhyaksho grahagano dushtagrahavimardakah | manarupi ganaratah pracando
    ganavihvalah || 31|| ganamatto guni guhyo gunagramashayo gunah | gudhabuddhirgudhamurtirgudhapadavibhushitah
    || 32|| gopta golokavasi ca gunavanguninam varah | haro haritavarnaksho mrityurmrityunjayo harih ||
    33|| havyabhugharisampujyo havirhavirbhujam varah | anadiradih sarvadya aditeyavarapradah || 34||
    anantavikramo loko lokanam papaharakah | gishpatih sadgunopetah saguno nirguno guni || 35|| gunaprito
    gunavaro girijanayako girih | gauribharta gunadhayashca goshreshthasanasamsthitah || 36|| padmasanah
    padmanetrah padmatushtah supadmakah | padmavaktrah padmakarah padmarudhapadambujah || 37|| padmapriyatamah
    padmalayah padmaprakashakah | padmakananasamvasah padmakananabhanjakah || 38|| padmakananasamvasi
    padmaranyakritalayah | praphullavadanah phullakamalakshah praphullakrit || 39|| phullendivarasantushtah
    praphullakamalasanah | phullambhojakarah phullamanasah papaharakah || 40|| papapahari punyatma punyakirtih
    supunyavan | punyah punyatamo dhanyah suputatma paratmakah || 41|| punyeshah punyadah punyaniratah
    punyabhajanah | paropakari papishthanashakah papaharakah || 42|| puratanah purvahinah paradrohavivarjitah
    | pivarah pivaramukhah pinakayah purantakah || 43|| pashi pashupatih pashahastah pashanavitpatih |
    palatmakah paro vetta pashabaddhavimocakah || 44|| pashunamadhipah pashacchetta pashavibhedakah |
    pashanadhari pashanashayanah pashipujitah || 45|| pashvarudhah pushpadhanuh pushpavrindasupujitah
    | pundarikah pitavasa pundarikakshavallabhah || 46|| panapatrakarah panamattah panatibhutakah | poshta
    poshttvarah putah paritrata'khileshvarah || 47|| pundarikakshakarta ca pundarikakshasevitah | pallavasthah
    prapithasthah pithabhuminivasakah || 48|| pita pitamahah parthaprasanno'bhishtadayakah | pitrinam
    pritikarta ca pritidah pritibhajanah || 49|| prityatmakah pritivashi supritah pritikarakah | pritihritpritirupatman
    pritiyuktastvameva hi || 50|| pranatartiharah pranavallabhah pranadayakah | prani pranasvarupashca
    pranagrahi munirdayah || 51|| prananathah pritamanah sarvesham prapitamahah | vriddhah pravriddharupashca
    pretah pranayinam varah || 52|| paradhishah param jyotih paranetrah paratmakah | parushyarahitah putri
    putradah putrarakshakah || 53|| putrapriyah putravashyah putravatparipalakah | paritrata paravasah
    paracetah pareshvarah || 54|| patih sarvasya sampalyah pavamanah paro'ntakah | puraha puruhutashca
    tripurarih purantakah || 55|| purandaro'tisampujyah pradharsho dushpradharshanah | patuh patutarah
    praudhah prapujyah parvatalayah || 56|| pulinasthah pulastyakhyah pingacakshuh prapannagah | abhirurasitangashca
    candarupah sitangakah || 57|| sarvavidyavinodashca sarvasaukhyayutah sada | sukhaharta sarvasukhi
    sarvalokaikapavanah || 58|| sadavanah saradashca susiddhah shuddharupakah | sarah saratarah suryah
    somah sarvaprakashakah || 59|| somamandaladhari ca samudra sindhurupavan | surajyeshthah surashreshthah
    surasuranishevitah || 60|| sarvadharmavinirmuktah sarvalokanamaskritah | sarvacarayutah saurah shaktah
    paramavaishnavah || 61|| sarvadharmavidhanajnah sarvacaraparayanah | sarvarogaprashamanah sarvarogapaharakah
    || 62|| prakrishtatma mahatma ca sarvadharmapradarshakah | sarvasampadyutah sarvasampaddanasamekshanah
    || 63|| sahasyavadano hasyayuktah prahasitananah | sakshi samakshavakta ca sarvadarshi samastavit
    || 64|| sakalajnah samarthajnah sumanah shaivapujitah | shokaprashamanah shokahanta'shocyah shubhanvitah
    || 65|| shailajnah shailajanathah shailanathah shanaishcarah | shashankasadrishajyotih shashankardhavirajitah
    || 66|| sadhupriyah sadhutamah sadhvipatiralaukikah | shunyarupah shunyadehah shunyasthah shunyabhavanah
    || 67|| shunyagami shmashanasthah shmashanadhipatih suvak | shatasuryaprabhah suryah suryadiptah surariha
    | shubhanvitah shubhatanuh shubhabuddhih shubhatmakah || 68|| shubhanvitatanuh shuklatanuh shuklaprabhanvitah
    | sushauklah shukladashanah shuklabhah shuklamalyadhrit || 69|| shuklapushpapriyah shuklavasanah shuklaketanah
    | sheshalankaranah shesharahitah sheshaveshtitah || 70|| shesharudhah sheshashayi sheshangadavirajitah
    | satipriyah sashankashca samadarshi samadhiman || 71|| satsangi satpriyah sangi nihsangi sangavarjitah
    | sahishnuh shashvataishvaryah samaganaratah sada || 72|| samavetta samyatarah shyamapatirasheshabhuk
    | tarinipatiratamranayanastvaritapriyah || 73|| taratmakastvagvasanastaruniramano ratah | triptirupastriptikarta
    tarakarinishevitah || 74|| vayukesho bhairavesho bhavanisho bhavantakah | bhavabandhurbhavaharo bhavabandhanamocakah
    || 75|| abhibhuto'bhibhutatma sarvabhutapramohakah | bhuvanesho bhutapujyo bhogamokshaphalapradah
    || 76|| dayalurdinanathashca duhsaho daityamardakah | dakshakanyapatirduhkhanashako dhanadhanyadah
    || 77|| dayavan daivatashreshtho devagandharvasevitah | nanayudhadharo nanapushpagucchavirajitah ||
    78|| nanasukhaprado nanamurtidhari ca nartakah | nityavijnanasamyukto nityarupo'nilo'nalah || 79||
    labdhavarno laghutaro laghutvaparivarjitah | lolaksho lokasampujyo lavanya parisamyutah || 80|| napurinyasasamsthashca
    nagesho nagapujitah | narayano naradashca nanabharanabhushitah || 81|| nagabhuto nagnadesho nagnah
    sanandamanasah | namasyo natanabhishca namramurdhabhivanditah || 82|| nandikesho nandipujyo nananirajamadhyagah
    | navinabilvapatraughatushto navaghanadyutih || 83|| nandah sananda anandamayashcanandavihvalah |
    nalasamsthah shobhanasthah susthah susthamatistatha || 84|| svalpasano bhimarucirbhuvanantakarambudah
    | asannah sikatalino vrishasino vrishasanah || 85|| vairasyarahito varyo vrati vrataparayanah | brahmyo
    vidyamayo vidyabhyasi vidyapatistatha || 86|| ghantakaro ghotakastho ghoraravo ghanasvanah | ghurnacakshuraghurnatma
    ghorahaso gabhiradhih || 87|| candipatishcandamurtishcando mundi pracandavak | citasamsthashcitavasashcitirdandakarah
    sada || 88|| citabhasmabhisamliptashcitanrityaparayanah | citapramodi citsakshi cintamaniracintakah
    || 89|| caturvedamayashcakshushcaturananapujitah | ciravasashcakorakshashcalanmurtishcalekshanah ||
    90|| calatkundalabhushadhayashcaladbhushanabhushitah | calannetrashcalatpadashcalannupurarajitah ||
    91|| sthavarah sthiramurtishca sthavareshah sthirasanah | sthapakah sthairyaniratah sthularupi sthalalayah
    || 92|| sthairyatigah sthitiparah sthanurupi sthaladhipah | aihiko madanartashca mahimandalapujitah
    || 93|| mahipriyo mattaravo minaketuvimardakah | minarupo manisamstho mrigahasto mrigasanah || 94||
    margastho mekhalayukto maithilishvarapujitah | mithyahino mangalado mangalyo makarasanah || 95|| matsyapriyo
    mathuragirmadhupanaparayanah | mriduvakyaparah saurapriyo modanvitastatha || 96|| mundalirbhushano
    dandi uddando jvalalocanah | asadhyasadhakah shurasevyah shokapanodanah || 97|| shripatih shrisusevyashca
    shridharah shriniketanah | shrimatam shrisvarupashca shrimanshrinilayastatha || 98|| shramadiklesharahitah
    shrinivasah shriyanvitah | shraddhaluh shraddhadevashca shraddho madhuravak tatha || 99|| pralayagnyarkasankashah
    pramattanayanojjvalah | asadhyasadhakah shurasevyah shokapanodanah || 100|| vishvabhutamayo vaishvanaranetro'dhimohakrit
    | lokatranaparo'paragunah paravivarjitah || 101|| agnijihvo dvijasyashca vishvasyah sarvabhutadhrik
    | khecarah khecaradhishah sarvagah sarvalaukikah || 102|| senanijanakah kshubdhabdhirvarikshobhavinashakah
    | kapalavilasaddhastah kamandalubhridarcitah || 103|| kevalatmasvarupashca kevalajnanarupakah | vyomalayanivasi
    ca brihadvyomasvarupakah || 104|| ambhojanayano'mbhodhishayanah purushatigah | niralambo'valambashca
    sambhoganandarupakah || 105|| yoganidramayo lokapramohapaharatmakah | brihadvaktro brihannetro brihadvahurbrihadvalah
    || 106|| brihatsarpangado dushtabrihadvalavimardakah | brihadbhujabalonmatto brihattundo brihadvapuh
    || 107|| brihadaishvaryayuktasca brihadaishvaryadah svayam| brihatsambhogasanushto brihadanandadayakah
    || 108|| brihajjatajutadharo brihanmali brihaddhanuh | indriyadhishthitah sarvalokendriyavimohakrit
    || 109|| sarvendriyapravrittikrit sarvendriyanivrittikrit| pravrittinayakah sarvavipattiparinashakah
    || 110|| pravrittimarganeta tvam svatantrecchamayah svayam | satpravrittirato nityam dayanandashivadharah
    || 111|| kshitirupastoyarupi vishvatriptikarastatha | tarpastarpanasampritastarpakastarpanatmakah
    || 112|| triptikaranabhutashca sarvatriptiprasadhakah | abhedo bhedako'cchidyacchedako'cchedya eva
    hi || 113|| acchinnadhanva'cchinneshuracchinnadhvajavahanah | adrishtah samadhrishtastrah samadhrishto
    balonnatah || 114|| citrayodhi citrakarma vishvasankarshakah svayam | bhaktanamipsitakarah sarvepsitaphalapradah
    || 115|| vanchitabhishtaphalado'bhinnajnanapravartakah | bodhanatma bodhanarthatigah sarvaprabodhakrit
    || 116|| trijatashcaikajatilashcalajjuto bhayanakah | jatatino jatajutasprishtavaravacah svayam ||
    117|| shanmaturasya janakah shaktih praharatam varah | anarghastraprahari canarghadhanva maharghyapat
    || 118|| yonimandalamadhyastho mukhayonirajrimbhanah | mahadrisadrishah shvetah shvetapushpasraganvitah
    || 119|| makarandapriyo nityam masartuhayanatmakah | nanapushpaprasurnanapushpairarcitagatrakah ||
    120|| shadangayoganiratah sadayogardramanasah | surasuranishevyanghrirvilasatpadapankajah || 121||
    suprakashitavaktrabjah sitetaragalojjvalah | vainateyasamarudhah sharadindusahasravat || 122|| jajvalyamanastejobhirjvalapunjo
    yamah svayam | prajvaladvidyudabhashca sattahasabhayankarah || 123|| pralayanalarupi ca pralayagnirucih
    svayam | jagatamekapurusho jagatam pralayatmakah || 124|| prasida tvam jagannatha jagadyone namo'stu
    te || 125|| shrimahadeva uvaca
  devanagari: ॐ नमस्ते पार्वतीनाथ देवदेव परात्पर । अच्युतानघ पञ्चास्य भीमास्य रुचिरानन ॥ १॥ व्याघ्राजिनधरानन्त
    पारावारविवर्जित । पञ्चानन महासत्त्व महाज्ञानमय प्रभो ॥ २॥ अजितामितदुर्धर्ष विश्वेश परमेश्वर । विश्वात्मन्विश्वभूतेश
    विश्वाश्रय जगत्पते ॥ ३॥ विश्वोपकारिन्विश्वैकधाम विश्वाश्रयाश्रय । विश्वाधार सदानन्द विश्वानन्द नमोऽस्तु
    ते ॥ ४॥ शर्व सर्वविदज्ञानविवर्जित सुरोत्तम । सुरवन्द्य सुरस्तुत्य सुरराज सुरोत्तम ॥ ५॥ सुरपूज्य सुरध्येय
    सुरेश्वर सुरान्तक । सुरारिमर्दक सुरश्रेष्ठ तेऽस्तु नमो नमः ॥ ६॥ त्वं शुद्धः शुद्धबोधश्च शुद्धात्मा
    जगतां पतिः । शम्भुः स्वयम्भूरत्युग्र उग्रकर्मोग्रलोचनः ॥ ७॥ उग्रप्रभावश्चात्युग्रमर्दकोऽत्युग्ररूपवान्
    । उग्रकण्ठः शिवः शान्तः सर्वशान्तिविधायकः ॥ ८॥ सर्वार्थदः शिवाधारः शिवायनिरमित्रजित् । शिवदः शिवकर्ता
    च शिवहन्ता शिवेश्वरः ॥ ९॥ शिशुः शैशवयुक्तस्च पिङ्गकेशो जटाधरः । गङ्गाधरकपर्दी च जटाजूटविराजितः ॥ १०॥
    जटिलो जटिलाराध्यः सर्वदोन्मत्तमानसः । उन्मत्तकेश उन्मत्त उन्मत्तानामधीश्वरः ॥ ११॥ उन्मत्तलोचनो भीमस्त्रिनेत्रो
    भीमलोचनः । बहुनेत्रो द्विनेत्री च रक्तनेत्रः सुनेत्रकः ॥ १२॥ दीर्घनेत्रस्च पिङ्गाक्षः सुप्रभाख्यः
    सुलोचनः । सोमनेत्रोऽग्निनेत्राख्यः सूर्यनेत्रः सुवीर्यवान् ॥ १३॥ पद्माक्षः कमलाक्षश्च नीलोत्पलदलेक्षणः
    । सुलक्षणः शूलपाणिः कपाली कपिलेक्षणः ॥ १४॥ व्याघूर्णनयनो धूर्तो व्याघ्रचर्माम्बरावृतः । श्रीकण्ठो
    नीलकण्ठाख्यः शितिकण्ठः सुकण्ठकः ॥ १५॥ चन्द्रचूडश्चन्द्रधरश्चन्द्रमौलिः शशाङ्कभृत् । शशिकान्तः शशाङ्काभः
    शशाङ्काङ्कितमूर्धजः ॥ १६॥ शशाङ्कवदनो वीरो वरदो वरलोचनः । शरच्चन्द्रसमाभासः शरदिन्दुसमप्रभः ॥ १७॥ कोटिसूर्यप्रतीकाशश्चन्द्रास्यश्चन्द्रशेखरः
    । अष्टमूर्तिर्महामूतिर्भीममूर्तिर्भयानकः ॥ १८॥ भयदाता भयत्राता भयहर्ता भयोज्झितः । निर्भूतो भूतवन्द्यश्च
    भूतात्मा भूतभावनः ॥ १९॥ कौपीनवासा दुर्वासा विवासाः कामिनीपतिः । करालः कीर्तिदो वैद्यः किशोरः कामनाशनः
    ॥ २०॥ कीर्तिरूपः कुन्तधारी कालकूटकृताशनः । कालकूटः सुरूपी च कुलमन्त्रप्रदीपकः ॥ २१॥ कलाकाष्ठात्मकः
    काशीविहारी कुटिलाननः । महाकाननसंवासी कालीप्रतिविवर्धनः ॥ २२॥ कालीधरः कामचारि कुलकीर्तिविवर्धनः । कामाद्रिः
    कामुकवरः कार्मुकी काममोहितः ॥ २३ कटाक्षः कनकाभासः कनकोज्ज्वलगात्रकः । कामातुरः क्वणत्पादः कुटिलभ्रुकुटीधरः
    ॥ २४॥ कार्तिकेयपिता कोकनदभूषणभूषितः । खट्वाङ्गयोद्धा खड्गी च गिरीशो गगनेश्वरः ॥ २५ गणाध्यक्षः खेटकधृक्
    खर्वः खर्वतरः खगः । खगारूढः खगाराध्यः खेचरः खेचरेश्वरः ॥ २६॥ खेचरत्वप्रदः क्षोणीपतिः खेचरमर्दकः ।
    गणेश्वरो गणपिता गरिष्ठो गणभूपतिः ॥ २७॥ गुरुर्गुरुतरो ज्ञेयो गङ्गापतिरमर्षणः । गीतप्रियो गीतरतः सुगोप्यो
    गोपवृन्दपः ॥ २८॥ गवारूढो जगद्भर्ता गोस्वामी गोस्वरूपकः । गोप्रदो गोधरो गृध्रो गरुत्मान् गोकृतासनः
    ॥ २९॥ गोपीशो गुरुतातश्च गुहावासी सुगोपितः । गजारूढो गजास्यश्च गजाजिनधरोऽग्रजः ॥ ३०॥ ग्रहाध्यक्षो ग्रहगणो
    दुष्टग्रहविमर्दकः । मानरूपी गानरतः प्रचण्डो गानविह्वलः ॥ ३१॥ गानमत्तो गुणी गुह्यो गुणग्रमाशयो गुणः
    । गूढबुद्धिर्गूढमूर्तिर्गूढपादविभूषितः ॥ ३२॥ गोप्ता गोलोकवासी च गुणवान्गुणिनां वरः । हरो हरितवर्णाक्षो
    मृत्युर्मृत्युञ्जयो हरिः ॥ ३३॥ हव्यभुघरिसम्पूज्यो हविर्हविर्भुजां वरः । अनादिरादिः सर्वाद्य आदितेयवरप्रदः
    ॥ ३४॥ अनन्तविक्रमो लोको लोकानां पापहारकः । गीष्पतिः सद्गुणोपेतः सगुणो निर्गुणो गुणी ॥ ३५॥ गुणप्रीतो
    गुणवरो गिरिजानायको गिरिः । गौरीभर्ता गुणाढयश्च गोश्रेष्ठासनसंस्थितः ॥ ३६॥ पद्मासनः पद्मनेत्रः पद्मतुष्टः
    सुपद्मकः । पद्मवक्त्रः पद्मकरः पद्मारूढपदाम्बुजः ॥ ३७॥ पद्मप्रियतमः पद्मालयः पद्मप्रकाशकः । पद्मकाननसंवासः
    पद्मकाननभञ्जकः ॥ ३८॥ पद्मकाननसंवासी पद्मारण्यकृतालयः । प्रफुल्लवदनः फुल्लकमलाक्षः प्रफुल्लकृत् ॥ ३९॥
    फुल्लेन्दीवरसन्तुष्टः प्रफुल्लकमलासनः । फुल्लाम्भोजकरः फुल्लमानसः पापहारकः ॥ ४०॥ पापापहारी पुण्यात्मा
    पुण्यकीर्तिः सुपुण्यवान् । पुण्यः पुण्यतमो धन्यः सुपूतात्मा परात्मकः ॥ ४१॥ पुण्येशः पुण्यदः पुण्यनिरतः
    पुण्यभाजनः । परोपकारी पापिष्ठनाशकः पापहारकः ॥ ४२॥ पुरातनः पूर्वहीनः परद्रोहविवर्जितः । पीवरः पीवरमुखः
    पीनकायः पुरान्तकः ॥ ४३॥ पाशी पशुपतिः पाशहस्तः पाषाणवित्पतिः । पलात्मकः परो वेत्ता पाशबद्धविमोचकः ॥
    ४४॥ पशूनामधिपः पाशच्छेत्ता पाशविभेदकः । पाषाणधारी पाषाणशयानः पाशिपूजितः ॥ ४५॥ पश्वारूढः पुष्पधनुः
    पुष्पवृन्दसुपूजितः । पुण्डरीकः पीतवासा पुण्डरीकाक्षवल्लभः ॥ ४६॥ पानपात्रकरः पानमत्तः पानातिभूतकः ।
    पोष्टा पोष्ट्ट्वरः पूतः परित्राताऽखिलेश्वरः ॥ ४७॥ पुण्डरीकाक्षकर्ता च पुण्डरीकाक्षसेवितः । पल्लवस्थः
    प्रपीठस्थः पीठभूमिनिवासकः ॥ ४८॥ पिता पितामहः पार्थप्रसन्नोऽभीष्टदायकः । पितॄणां प्रीतिकर्ता च प्रीतिदः
    प्रीतिभाजनः ॥ ४९॥ प्रीत्यात्मकः प्रीतिवशी सुप्रीतः प्रीतिकारकः । प्रीतिहृत्प्रीतिरूपात्मन् प्रीतियुक्तस्त्वमेव
    हि ॥ ५०॥ प्रणतार्तिहरः प्राणवल्लभः प्राणदायकः । प्राणी प्राणस्वरूपश्च प्राणग्राही मुनिर्दयः ॥ ५१॥
    प्राणनाथः प्रीतमनाः सर्वेषां प्रपितामहः । वृद्धः प्रवृद्धरूपश्च प्रेतः प्रणयिनां वरः ॥ ५२॥ पराधीशः
    परं ज्योतिः परनेत्रः परात्मकः । पारुष्यरहितः पुत्री पुत्रदः पुत्ररक्षकः ॥ ५३॥ पुत्रप्रियः पुत्रवश्यः
    पुत्रवत्परिपालकः । परित्राता परावासः परचेताः परेश्वरः ॥ ५४॥ पतिः सर्वस्य सम्पाल्यः पवमानः परोऽन्तकः
    । पुरहा पुरुहूतश्च त्रिपुरारिः पुरान्तकः ॥ ५५॥ पुरन्दरोऽतिसम्पूज्यः प्रधर्षो दुष्प्रधर्षणः । पटुः
    पटुतरः प्रौढः प्रपूज्यः पर्वतालयः ॥ ५६॥ पुलिनस्थः पुलस्त्याख्यः पिङ्गचक्षुः प्रपन्नगः । अभीरुरसिताङ्गश्च
    चण्डरूपः सिताङ्गकः ॥ ५७॥ सर्वविद्याविनोदश्च सर्वसौख्ययुतः सदा । सुखहर्ता सर्वसुखी सर्वलोकैकपावनः ॥
    ५८॥ सदावनः सारदश्च सुसिद्धः शुद्धरूपकः । सारः सारतरः सूर्यः सोमः सर्वप्रकाशकः ॥ ५९॥ सोममण्डलधारी च
    समुद्र सिन्धुरूपवान् । सुरज्येष्ठः सुरश्रेष्ठः सुरासुरनिषेवितः ॥ ६०॥ सर्वधर्मविनिर्मुक्तः सर्वलोकनमस्कृतः
    । सर्वाचारयुतः सौरः शाक्तः परमवैष्णवः ॥ ६१॥ सर्वधर्मविधानज्ञः सर्वाचारपरायणः । सर्वरोगप्रशमनः सर्वरोगापहारकः
    ॥ ६२॥ प्रकृष्टात्मा महात्मा च सर्वधर्मप्रदर्शकः । सर्वसम्पद्युतः सर्वसम्पद्दानसमेक्षणः ॥ ६३॥ सहास्यवदनो
    हास्ययुक्तः प्रहसिताननः । साक्षी समक्षवक्ता च सर्वदर्शी समस्तवित् ॥ ६४॥ सकलज्ञः समर्थज्ञः सुमनाः शैवपूजितः
    । शोकप्रशमनः शोकहन्ताऽशोच्यः शुभान्वितः ॥ ६५॥ शैलज्ञः शैलजानाथः शैलनाथः शनैश्चरः । शशाङ्कसदृशज्योतिः
    शशाङ्कार्धविराजितः ॥ ६६॥ साधुप्रियः साधुतमः साध्वीपतिरलौकिकः । शून्यरूपः शून्यदेहः शून्यस्थः शून्यभावनः
    ॥ ६७॥ शून्यगामी श्मशानस्थः श्मशानाधिपतिः सुवाक् । शतसूर्यप्रभः सूर्यः सूर्यदीप्तः सुरारिहा । शुभान्वितः
    शुभतनुः शुभबुद्धिः शुभात्मकः ॥ ६८॥ शुभान्विततनुः शुक्लतनुः शुक्लप्रभान्वितः । सुशौक्लः शुक्लदशनः शुक्लाभः
    शुक्लमाल्यधृत् ॥ ६९॥ शुक्लपुष्पप्रियः शुक्लवसनः शुक्लकेतनः । शेषालङ्करणः शेषरहितः शेषवेष्टितः ॥ ७०॥
    शेषारूढः शेषशायी शेषाङ्गदविराजितः । सतीप्रियः साशङ्कश्च समदर्शी समाधिमान् ॥ ७१॥ सत्सङ्गी सत्प्रियः
    सङ्गी निःसङ्गी सङ्गवर्जितः । सहिष्णुः शाश्वतैश्वर्यः सामगानरतः सदा ॥ ७२॥ सामवेत्ता साम्यतरः श्यामापतिरशेषभुक्
    । तारिणीपतिराताम्रनयनस्त्वरिताप्रियः ॥ ७३॥ तारात्मकस्त्वग्वसनस्तरुणीरमणो रतः । तृप्तिरूपस्तृप्तिकर्ता
    तारकारिनिषेवितः ॥ ७४॥ वायुकेशो भैरवेशो भवानीशो भवान्तकः । भवबन्धुर्भवहरो भवबन्धनमोचकः ॥ ७५॥ अभिभूतोऽभिभूतात्मा
    सर्वभूतप्रमोहकः । भुवनेशो भूतपूज्यो भोगमोक्षफलप्रदः ॥ ७६॥ दयालुर्दीननाथश्च दुःसहो दैत्यमर्दकः । दक्षकन्यापतिर्दुःखनाशको
    धनधान्यदः ॥ ७७॥ दयावान् दैवतश्रेष्ठो देवगन्धर्वसेवितः । नानायुधधरो नानापुष्पगुच्छविराजितः ॥ ७८॥ नानासुखप्रदो
    नानामूर्तिधारी च नर्तकः । नित्यविज्ञानसंयुक्तो नित्यरूपोऽनिलोऽनलः ॥ ७९॥ लब्धवर्णो लघुतरो लघुत्वपरिवर्जितः
    । लोलाक्षो लोकसम्पूज्यो लावण्य परिसंयुतः ॥ ८०॥ नपुरीन्याससंस्थश्च नागेशो नगपूजितः । नारायणो नारदश्च
    नानाभरणभूषितः ॥ ८१॥ नगभूतो नग्नदेशो नग्नः सानन्दमानसः । नमस्यो नतनाभिश्च नम्रमूर्धाभिवन्दितः ॥ ८२॥
    नन्दिकेशो नन्दिपूज्यो नानानीरजमध्यगः । नवीनबिल्वपत्रौघतुष्टो नवघनद्युतिः ॥ ८३॥ नन्दः सानन्द आनन्दमयश्चानन्दविह्वलः
    । नालसंस्थः शोभनस्थः सुस्थः सुस्थमतिस्तथा ॥ ८४॥ स्वल्पासनो भीमरुचिर्भुवनान्तकराम्बुदः । आसन्नः सिकतालीनो
    वृषासीनो वृषासनः ॥ ८५॥ वैरस्यरहितो वार्यो व्रती व्रतपरायणः । ब्राह्म्यो विद्यामयो विद्याभ्यासी विद्यापतिस्तथा
    ॥ ८६॥ घण्टाकारो घोटकस्थो घोररावो घनस्वनः । घूर्णचक्षुरघूर्णात्मा घोरहासो गभीरधीः ॥ ८७॥ चण्डीपतिश्चण्डमूर्तिश्चण्डो
    मुण्डी प्रचण्डवाक् । चितासंस्थश्चितावासश्चितिर्दण्डकरः सदा ॥ ८८॥ चिताभस्माभिसंलिप्तश्चितानृत्यपरायणः
    । चिताप्रमोदी चित्साक्षी चिन्तामणिरचिन्तकः ॥ ८९॥ चतुर्वेदमयश्चक्षुश्चतुराननपूजितः । चीरवासाश्चकोराक्षश्चलन्मूर्तिश्चलेक्षणः
    ॥ ९०॥ चलत्कुण्डलभूषाढयश्चलद्भूषणभूषितः । चलन्नेत्रश्चलत्पादश्चलन्नूपुरराजितः ॥ ९१॥ स्थावरः स्थिरमूर्तिश्च
    स्थावरेशः स्थिरासनः । स्थापकः स्थैर्यनिरतः स्थूलरूपी स्थलालयः ॥ ९२॥ स्थैर्यातिगः स्थितिपरः स्थाणुरूपी
    स्थलाधिपः । ऐहिको मदनार्तश्च महीमण्डलपूजितः ॥ ९३॥ महीप्रियो मत्तरवो मीनकेतुविमर्दकः । मीनरूपो मनिसंस्थो
    मृगहस्तो मृगासनः ॥ ९४॥ मार्गस्थो मेखलायुक्तो मैथिलीश्वरपूजितः । मिथ्याहीनो मङ्गलदो माङ्गल्यो मकरासनः
    ॥ ९५॥ मत्स्यप्रियो मथुरगीर्मधुपानपरायणः । मृदुवाक्यपरः सौरप्रियो मोदान्वितस्तथा ॥ ९६॥ मुण्डालिर्भूषणो
    दण्डी उद्दण्डो ज्वललोचनः । असाध्यसाधकः शूरसेव्यः शोकापनोदनः ॥ ९७॥ श्रीपतिः श्रीसुसेव्यश्च श्रीधरः
    श्रीनिकेतनः । श्रीमतां श्रीस्वरूपश्च श्रीमान्श्रीनिलयस्तथा ॥ ९८॥ श्रमादिक्लेशरहितः श्रीनिवासः श्रियान्वितः
    । श्रद्धालुः श्राद्धदेवश्च श्राद्धो मधुरवाक् तथा ॥ ९९॥ प्रलयाग्न्यर्कसङ्काशः प्रमत्तनयनोज्ज्वलः ।
    असाध्यसाधकः शूरसेव्यः शोकापनोदनः ॥ १००॥ विश्वभूतमयो वैश्वानरनेत्रोऽधिमोहकृत् । लोकत्राणपरोऽपारगुणः
    पारविवर्जितः ॥ १०१॥ अग्निजिह्वो द्विजास्यश्च विश्वास्यः सर्वभूतधृक् । खेचरः खेचराधीशः सर्वगः सार्वलौकिकः
    ॥ १०२॥ सेनानीजनकः क्षुब्धाब्धिर्वारिक्षोभविनाशकः । कपालविलसद्धस्तः कमण्डलुभृदर्चितः ॥ १०३॥ केवलात्मस्वरूपश्च
    केवलज्ञानरूपकः । व्योमालयनिवासी च बृहद्व्योमस्वरूपकः ॥ १०४॥ अम्भोजनयनोऽम्भोधिशयानः पुरुषातिगः । निरालम्बोऽवलम्बश्च
    सम्भोगानन्दरूपकः ॥ १०५॥ योगनिद्रामयो लोकप्रमोहापहरात्मकः । बृहद्वक्त्रो बृहन्नेत्रो बृहद्वाहुर्बृहद्वलः
    ॥ १०६॥ बृहत्सर्पाङ्गदो दुष्टबृहद्वालविमर्दकः । बृहद्भुजबलोन्मत्तो बृहत्तुण्डो बृहद्वपुः ॥ १०७॥ बृहदैश्वर्ययुक्तस्च
    बृहदैश्वर्यदः स्वयम्। बृहत्सम्भोगसनुष्टो बृहदानन्ददायकः ॥ १०८॥ बृहज्जटाजूटधरो बृहन्माली बृहद्धनुः
    । इन्द्रियाधिष्ठितः सर्वलोकेन्द्रियविमोहकृत् ॥ १०९॥ सर्वेन्द्रियप्रवृत्तिकृत् सर्वेन्द्रियनिवृत्तिकृत्।
    प्रवृत्तिनायकः सर्वविपत्तिपरिनाशकः ॥ ११०॥ प्रवृत्तिमार्गनेता त्वं स्वतन्त्रेच्छामयः स्वयम् । सत्प्रवृत्तिरतो
    नित्यं दयानन्दशिवाधरः ॥ १११॥ क्षितिरूपस्तोयरूपी विश्वतृप्तिकरस्तथा । तर्पस्तर्पणसम्प्रीतस्तर्पकस्तर्पणात्मकः
    ॥ ११२॥ तृप्तिकारणभूतश्च सर्वतृप्तिप्रसाधकः । अभेदो भेदकोऽच्छिद्यच्छेदकोऽच्छेद्य एव हि ॥ ११३॥ अच्छिन्नधन्वाऽच्छिन्नेषुरच्छिन्नध्वजवाहनः
    । अदृष्टः समधृष्टास्त्रः समधृष्टो बलोन्नतः ॥ ११४॥ चित्रयोधी चित्रकर्मा विश्वसङ्कर्षकः स्वयम् । भक्तानामीप्सितकरः
    सर्वेप्सितफलप्रदः ॥ ११५॥ वाञ्छिताभीष्टफलदोऽभिन्नज्ञानप्रवर्तकः । बोधनात्मा बोधनार्थातिगः सर्वप्रबोधकृत्
    ॥ ११६॥ त्रिजटश्चैकजटिलश्चलज्जूटो भयानकः । जटाटीनो जटाजूटस्पृष्टावरवचः स्वयम् ॥ ११७॥ षाण्मातुरस्य जनकः
    शक्तिः प्रहरतां वरः । अनर्घास्त्रप्रहारी चानर्घधन्वा महार्घ्यपात् ॥ ११८॥ योनिमण्डलमध्यस्थो मुखयोनिरजृम्भणः
    । महाद्रिसदृशः श्वेतः श्वेतपुष्पस्रगन्वितः ॥ ११९॥ मकरन्दप्रियो नित्यं मासर्तुहायनात्मकः । नानापुष्पप्रसूर्नानापुष्पैरर्चितगात्रकः
    ॥ १२०॥ षडङ्गयोगनिरतः सदायोगार्द्रमानसः । सुरासुरनिषेव्याङ्घ्रिर्विलसत्पादपङ्कजः ॥ १२१॥ सुप्रकाशितवक्त्राब्जः
    सितेतरगलोज्ज्वलः । वैनतेयसमारूढः शरदिन्दुसहस्रवत् ॥ १२२॥ जाज्वल्यमानस्तेजोभिर्ज्वालपुञ्जो यमः स्वयम्
    । प्रज्वलद्विद्युदाभश्च साट्टहासभयङ्करः ॥ १२३॥ प्रलयानलरूपी च प्रलयाग्निरुचिः स्वयम् । जगतामेकपुरुषो
    जगतां प्रलयात्मकः ॥ १२४॥ प्रसीद त्वं जगन्नाथ जगद्योने नमोऽस्तु ते ॥ १२५॥ श्रीमहादेव उवाच
