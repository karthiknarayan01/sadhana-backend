id: narayaniyam-dashaka-57
category: stotram
name:
  english: Narayaniyam Dashaka 57
content:
  english: ramasakhah kvapi dine kamada bhagavan gato bhavan vipinam | sunubhirapi gopanam dhenubhirabhisamvrito
    lasadveshah || || sandarshayan balaya svairam vrindavanashriyam vimalam | kandiraih saha balairbhandirakamagamo
    vatam kridan || || tavattavakanidhanasprihayalurgopamurtiradayaluh | daityah pralambanama pralambabahum
    bhavantamapede || || janannapyavijananniva tena samam nibaddhasauhardah | vatanikate patupashupavyabaddham
    dvandvayuddhamarabdhah || || gopan vibhajya tanvan sangham balabhadrakam bhavatkamapi | tvadbalabhirum
    daityam tvadbalagatamanvamanyatha bhagavan || || kalpitavijetrivahane samare parayuthagam svadayitataram
    | shridamanamadhatthah parajito bhaktadasatam prathayan || || evam bahushu vibhuman baleshu vahatsu
    vahyamaneshu | ramavijitah pralambo jahara tam durato bhavadbhitya || || tvadduram gamayantam tam
    drishtva halini vihitagarimabhare | daityah svarupamagadyadrupat sa hi balo'pi cakito'bhut || || uccataya
    daityatanostvanmukhamalokya durato ramah | vigatabhayo dridhamushtya bhrishadushtam sapadi pishtavanenam
    || || hatva danavaviram praptam balamalilingitha premna | tavanmilatoryuvayoh shirasi krita pushpavrishtiramaraganaih
    || || alambo bhuvananam pralambam nidhanamevamaracayan | kalam vihaya sadyo lolambaruce hare hareh
    kleshan ||
  devanagari: रामसखः क्वापि दिने कामद भगवन् गतो भवान् विपिनम् । सूनुभिरपि गोपानां धेनुभिरभिसंवृतो लसद्वेषः
    ॥ ॥ सन्दर्शयन् बलाय स्वैरं वृन्दावनश्रियं विमलाम् । काण्डीरैः सह बालैर्भाण्डीरकमागमो वटं क्रीडन् ॥
    ॥ तावत्तावकनिधनस्पृहयालुर्गोपमूर्तिरदयालुः । दैत्यः प्रलम्बनामा प्रलम्बबाहुं भवन्तमापेदे ॥ ॥ जानन्नप्यविजानन्निव
    तेन समं निबद्धसौहार्दः । वटनिकटे पटुपशुपव्याबद्धं द्वन्द्वयुद्धमारब्धाः ॥ ॥ गोपान् विभज्य तन्वन् सङ्घं
    बलभद्रकं भवत्कमपि । त्वद्बलभीरुं दैत्यं त्वद्बलगतमन्वमन्यथा भगवन् ॥ ॥ कल्पितविजेतृवहने समरे परयूथगं
    स्वदयिततरम् । श्रीदामानमधत्थाः पराजितो भक्तदासतां प्रथयन् ॥ ॥ एवं बहुषु विभूमन् बालेषु वहत्सु वाह्यमानेषु
    । रामविजितः प्रलम्बो जहार तं दूरतो भवद्भीत्या ॥ ॥ त्वद्दूरं गमयन्तं तं दृष्ट्वा हलिनि विहितगरिमभरे
    । दैत्यः स्वरूपमागाद्यद्रूपात् स हि बलोऽपि चकितोऽभूत् ॥ ॥ उच्चतया दैत्यतनोस्त्वन्मुखमालोक्य दूरतो
    रामः । विगतभयो दृढमुष्ट्या भृशदुष्टं सपदि पिष्टवानेनम् ॥ ॥ हत्वा दानववीरं प्राप्तं बलमालिलिङ्गिथ प्रेम्णा
    । तावन्मिलतोर्युवयोः शिरसि कृता पुष्पवृष्टिरमरगणैः ॥ ॥ आलम्बो भुवनानां प्रालम्बं निधनमेवमारचयन् ।
    कालं विहाय सद्यो लोलम्बरुचे हरे हरेः क्लेशान् ॥
