id: parashurama-28
category: stotram
name:
  english: parashurama 28
  devanagari: परशुराम २८
content:
  english: parashuramashtavimshatinamastotram shri ganeshaya namah | rishiruvaca | yamahurvasudevamsham
    haihayanam kulantakam | trihsaptakritvo ya imam cakre nihkshatriyam mahim || 1|| dushtam kshatram
    bhuvo bharamabrahmanyamaninashat | tasya namani punyani vacmi te purusharshabha || 2|| bhubharaharanarthaya
    mayamanushavigrahah | janardanamshasambhutah sthityutpattyapyayeshvarah || 3|| bhargavo jamadagnyashca
    pitrajnaparipalakah | matripranaprado dhiman kshatriyantakarah prabhuh || 4|| ramah parashuhastashca
    kartaviryamadapahah | renukaduhkhashokaghno vishokah shokanashanah || 5|| navinaniradashyamo raktotpalavilocanah
    | ghoro dandadharo dhiro brahmanyo brahmanapriyah || 6|| tapodhano mahendradau nyastadandah prashantadhih
    | upagiyamanacaritah siddhagandharvacaranaih || 7|| janmamrityujaravyadhiduhkhashokabhayatigah | ityashtavimshatirnamnamukta
    stotratmika shubha || 8|| anaya priyatam devo jamadagnyo maheshvarah | nedam stotramashantaya nadantayatapasvine
    || 9|| navedavidushe vacyamashishyaya khalaya ca | nasuyakayanrijave na canirdishtakarine || 10||
    idam priyaya putraya shishyayanugataya ca | rahasyadharmo vaktavyo nanyasmai tu kadacana || 11|| ||
    iti parashuramashtavimshatinamastotram sampurnam ||
  devanagari: परशुरामाष्टाविंशतिनामस्तोत्रम् श्री गणेशाय नमः । ऋषिरुवाच । यमाहुर्वासुदेवांशं हैहयानां
    कुलान्तकम् । त्रिःसप्तकृत्वो य इमां चक्रे निःक्षत्रियां महीम् ॥ १॥ दुष्टं क्षत्रं भुवो भारमब्रह्मण्यमनीनशत्
    । तस्य नामानि पुण्यानि वच्मि ते पुरुषर्षभ ॥ २॥ भूभारहरणार्थाय मायामानुषविग्रहः । जनार्दनांशसम्भूतः
    स्थित्युत्पत्त्यप्ययेश्वरः ॥ ३॥ भार्गवो जामदग्न्यश्च पित्राज्ञापरिपालकः । मातृप्राणप्रदो धीमान् क्षत्रियान्तकरः
    प्रभुः ॥ ४॥ रामः परशुहस्तश्च कार्तवीर्यमदापहः । रेणुकादुःखशोकघ्नो विशोकः शोकनाशनः ॥ ५॥ नवीननीरदश्यामो
    रक्तोत्पलविलोचनः । घोरो दण्डधरो धीरो ब्रह्मण्यो ब्राह्मणप्रियः ॥ ६॥ तपोधनो महेन्द्रादौ न्यस्तदण्डः
    प्रशान्तधीः । उपगीयमानचरितः सिद्धगन्धर्वचारणैः ॥ ७॥ जन्ममृत्युजराव्याधिदुःखशोकभयातिगः । इत्यष्टाविंशतिर्नाम्नामुक्ता
    स्तोत्रात्मिका शुभा ॥ ८॥ अनया प्रीयतां देवो जामदग्न्यो महेश्वरः । नेदं स्तोत्रमशान्ताय नादान्तायातपस्विने
    ॥ ९॥ नावेदविदुषे वाच्यमशिष्याय खलाय च । नासूयकायानृजवे न चानिर्दिष्टकारिणे ॥ १०॥ इदं प्रियाय पुत्राय
    शिष्यायानुगताय च । रहस्यधर्मो वक्तव्यो नान्यस्मै तु कदाचन ॥ ११॥ ॥ इति परशुरामाष्टाविंशतिनामस्तोत्रं
    सम्पूर्णम् ॥
