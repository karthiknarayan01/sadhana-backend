id: bhikshuk
category: upanishad
name:
  english: bhikshuk
  devanagari: भिक्शुक्
content:
  english: dattatreyashukavamadevaharitakaprabhritayo'shtau grasamshvaranto yogamarge mokshameva prarthayante
    | vrikshamule shunyagrihe shmashanavasino va sambara va digambara va | na tesham dharmadharmau labhalabhau
    shuddhashuddhau dvaitavarjita samaloshtashmakancanah sarvavarneshu bhaikshacaranam kritva sarvatratmaiveti
    pashyanti | atha jatarupadhara nirdvandva nishparigrahah shukladhyanaparayana atmanishtah pranasamdharanarthe
    yathoktakale bhaikshamacarantah shunyagaradevagriha
  devanagari: दत्तात्रेयशुकवामदेवहारीतकप्रभृतयोऽष्टौ ग्रासांश्वरन्तो योगमार्गे मोक्षमेव प्रार्थयन्ते ।
    वृक्षमूले शून्यगृहे श्मशानवासिनो वा साम्बरा वा दिगम्बरा वा । न तेषां धर्माधर्मौ लाभालाभौ शुद्धाशुद्धौ
    द्वैतवर्जिता समलोष्टाश्मकाञ्चनाः सर्ववर्णेषु भैक्षाचरणं कृत्वा सर्वत्रात्मैवेति पश्यन्ति । अथ जातरूपधरा
    निर्द्वन्द्वा निष्परिग्रहाः शुक्लध्यानपरायणा आत्मनिष्टाः प्राणसंधारणार्थे यथोक्तकाले भैक्षमाचरन्तः
    शून्यागारदेवगृह
meaning: {}
