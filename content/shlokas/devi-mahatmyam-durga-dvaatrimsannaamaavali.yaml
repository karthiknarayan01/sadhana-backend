id: devi-mahatmyam-durga-dvaatrimsannaamaavali
category: stotram
name:
  english: Devi Mahatmyam Durga Dvaatrimsannaamaavali
content:
  english: durga''padvinivarini | durgamacchedini durgamapaha | durgamajnanada durga daityalokadavanala
    || durgamatmasvarupini | durgamargaprada || durgamajnanasamsthana durgamadhyanabhasini | durgamoha
    durgamarthasvarupini || || durgamasurasamhantri durgamayudhadharini | durgamangi durgadharini | namavalimimam
    yastu durgaya su dhi manavah | pathetsarvabhayanmukto bhavishyati na samshayah || shatrubhih pidyamano
    va durgabandhagato'pi va | dvatrimshannamapathena mucyate natra samshayah || iti shri durga dvatrimshannamavali
    stotram ||
  devanagari: दुर्गाऽऽपद्विनिवारिणी । दुर्गमच्छेदिनी दुर्गमापहा । दुर्गमज्ञानदा दुर्ग दैत्यलोकदवानला ॥
    दुर्गमात्मस्वरूपिणी । दुर्गमार्गप्रदा ॥ दुर्गमज्ञानसंस्थाना दुर्गमध्यानभासिनी । दुर्गमोहा दुर्गमार्थस्वरूपिणी
    ॥ ॥ दुर्गमासुरसंहन्त्री दुर्गमायुधधारिणी । दुर्गमाङ्गी दुर्गधारिणी । नामावलिमिमां यस्तु दुर्गाया सु
    धी मानवः । पठेत्सर्वभयान्मुक्तो भविष्यति न संशयः ॥ शत्रुभिः पीड्यमनो वा दुर्गबन्धगतोऽपि वा । द्वात्रिंशन्नामपाठेन
    मुच्यते नात्र संशयः ॥ इति श्री दुर्गा द्वात्रिंशन्नामावलि स्तोत्रम् ॥
