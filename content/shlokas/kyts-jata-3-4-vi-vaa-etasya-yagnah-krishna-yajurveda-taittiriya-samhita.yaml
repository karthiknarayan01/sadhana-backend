id: kyts-jata-3-4-vi-vaa-etasya-yagnah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 3.4 Vi Vaa Etasya Yagnah - Krishna Yajurveda Taittiriya Samhita
content:
  english: va eta syaitasya vai va etasya | etasya yajno yajna eta syaitasya yajnah | yajna riddhyata
    riddhyate yajno yajna riddhyate | riddhyate yasya yasya rdhyata riddhyate yasya | ryasya yasya havih
    | havi ratiricyate 'tiricyate havir havi ratiricyate | atiricyate surya ssuryo 'tiricyate 'tiricyate
    suryah | atiricyata ityati devo divishadbhyo divishadbhyo devo devo divishadbhyah | divishadbhya ititi
    divishadbhyo divishadbhya iti | divishadbhya iti divishat itya hahe tityaha | aha brihaspatina brihaspatina
    ''haha brihaspatina | brihaspatina ca ca brihaspatina brihaspatina ca | asya prajapatina prajapatina
    'syasya prajapatina | prajapatina ca ca prajapatina prajapatina ca | prajapatineti praja ca yajnasya
    yajnasya ca ca yajnasya | yajnasya vyriddham ya~jnasya yajnasya vyriddham | vyriddha mapyapi vyriddham
    api vapati vapa tyapyapi vapati | vapati rakshagmsi rakshagmsi vapati vapati rakshagmsi | rakshagmsi
    vai vai rakshagmsi rakshagmsi vai | pashugm sacante sacante pashu thsacante sacante yat | yadekadevatya
    ekadevatyo ya ekadevatya alabdha alabdha ekadevatya ekadevatya alabdhah | ekadevatya ityeka nalabdha
    alabdho bhuyan | nbhavati bhavati bhuya bhavati yasya yasya bhavati bhavati yasyah ste te yasya yasya
    te harito harita ste te haritah | harito garbho garbho harito harito garbhah | garbha ititi garbho
    garbha iti | itya hahe tityaha | aha devatra devatra ''haha devatra | devatraivaiva devatra devatraiva
    | evaina mena mevai vaina ngamayati gamaya tyena mena gamayati rakshasagm rakshasa ngamayati gamayati
    rakshasam | rakshasa mapahatya apahatyai rakshasagm rakshasa mapahatyai | apahatya a 'pahatya apahatya
    a | a vartana vartana vartana | vartana vartaya vartaya vartana vartana vartaya | vartayetiti vartaya
    vartayeti | itya hahe tityaha | aha brahmana brahmana ''haha brahmana | || brahmanaivaiva brahmana
    brahmanaiva | a vartayati vartaya tyavartayati | vartayati vi vi vartayati vartayati vi | te bhinadmi
    bhinadmi te te bhinadmi | mbhinadmi bhinadmi takarim | takari mititi takari itya hahe tityaha | ryathayaju
    rahaha yathayajuh | yathayaju revaiva yathayaju evaita deta devaivaitat | eta durudraphsa urudraphsa
    eta deta durudraphsah | urudraphso vishvarupo vishvarupa urudraphsa urudraphso vishvarupah | urudraphsa
    ityuru vishvarupa indu rindu rvishvarupo vishvarupa induh | vishvarupa iti vishva indu rititindu rindu
    riti | itya hahe tityaha | aha praja praja ''haha praja | praja vai vai praja praja vai | vai pashavah
    pashavo vai vai pashavah | pashava indu rinduh pashavah pashava induh | ndurinduh prajaya prajayai
    vaiva prajaya mpashubhih pashubhi rena mena sa mardhaya tyardhayati sagm sa mardhayati | ndiva mardhaya
    tyardhayati diva vai yajnasya yajnasya vai vai yajnasya | yajnasya vyriddham ya~jnasya yajnasya vyriddham
    | ngacchati gacchati vyriddham ngacchati gacchati prithivim | prithivi matirikta matirikta mprithivi
    matiriktam | ttadatirikta matirikta shamayedarti martigm shamaye arti ma ''rti marti ma | arcche dricche
    darcche dyajamano yajamana ricche dricche yajamano mahi mahi yajamano yajamano mahi | dyauh prithivi
    prithivi dyau prithivi ca ca prithivi prithivi ca | ca no na shca ca nah | na ititi no na iti | itya
    hahe tityaha | || aha dyavaprithivibhya ndyavaprithivibhya mahaha dyavaprithivibhya dyavaprithivibhya
    mevaiva dyavaprithivibhya ndyavaprithivibhya meva | dyavaprithivibhyamiti dyava eva yajnasya yajnasyaivaiva
    yajnasya | yajnasya vyriddham ya~jnasya yajnasya vyriddham | catirikta matirikta nca catirikta matirikta
    ca shamayati shamayati ca ca shamayati | shamayati na na shamayati shamayati na | arti ma ''rti marti
    ma | arccha tyriccha tyarcchati | ricchati yajamano yajamana riccha tyricchati yajamanah | yajamano
    bhasmana bhasmana yajamano yajamano bhasmana | bhasmana 'bhyabhi bhasmana bhasmana 'bhi | abhi sagm
    sa mabhyabhi sam | sa muha tyuhati sagm samuhati | uhati svagakrityai svagakritya uha tyuhati svagakrityai
    | svagakritya atho atho svagakrityai svagakritya atho svagakritya iti svaga atho anayo ranayo ratho
    atho anayoh rvai va anayo ranayo va esha esha vai va eshah | esha garbho garbha esha esha garbhah
    | rgarbho garbho 'nayoh anayo revaivanayo ranayo reva | ndadhati dadhat yena mena ddadhati dadhati
    yat | avadye datya tyavadye davadye dati | tpashoh pasho ravadye davadye pasho ralabdhasya labdhasya
    pashoh pasho ralabdhasya | alabdhasya na nalabdhasya labdhasya na | ddyeda vava dyet | nnabhya nabhya
    anyat | anya davadye davadye danya danya davadyet | avadye duparishta duparishta davadye davadye duparishtat
    | uparishta danya danya duparishta duparishta danyat | tpurasta danya danya vai nabhyai nabhyai vai
    vai nabhyai pranah prano nabhyai nabhyai prana uparishta duparishta tpranah prana uparishtat | uparishta
    dapano 'pana uparishta duparishta dapanah | napano 'pano yavan | yavanevaiva yavan eva pashuh pashu
    revaiva pashuh | pashu stasya tasya pashuh pashu stasya | tasya vava tasya tasyava | ava dyati dyatyavava
    dyati | dyati vishnave vishnave dyati dyati vishnave | vishnave shipivishtaya shipivishtaya vishnave
    vishnave shipivishtaya | shipivishtaya juhoti juhoti shipivishtaya shipivishtaya juhoti | shipivishtayeti
    shipi dyaj juhoti juhoti yat | vai yajnasya yajnasya vai vai yajnasya | yajnasya tiricyate 'tiricyate
    yajnasya yajnasya tiricyate | atiricyate yo yo 'tiricyate 'tiricyate yah | atiricyata ityati rbhuma
    bhuma pashoh pasho bhuma ya ya bhuma bhuma ya | tpushtih pushti stat | shshipivishto vishnu rvishnuh
    shipivishtah | shipivishto 'tirikte 'tirikte shipivishta shshipivishto 'tirikte | shipivishta iti
    shipi atirikta evaivatirikte 'tirikta eva | eva tirikta matirikta mevaiva tiriktam | ndadhati dadha
    tyatirikta matirikta dadha tyatiriktasya tiriktasya dadhati dadha tyatiriktasya | atiriktasya shantyai
    shantya atiriktasya tiriktasya shantyai atiriktasyetyati shantya ashtapru dashtaprut chantyai shantya
    ashtapru ashtapru ddhiranyagm hiranya mashtapru dashtapru ddhiranyam | ashtaprudityashta ndakshina
    dakshina hiranyagm hiranya dakshina 'shtapadya shtapadi dakshina dakshina 'shtapadi | ashtapadi hi
    hyashtapa dyashtapadi hi | hyeshaisha hi hyesha | esha ''tma ''tmaishaisha ''tma | atma navamo navama
    atma ''tma navamah | rnavamo navamah pashoh | pasho raptya aptyai pashoh pasho raptyai 'ntarakosha
    aptya aptya antarakoshe | antarakosha ushnishe noshnishena ntarakoshe 'ntarakosha ushnishena | antarakosha
    ityantara ushnishena vishtita mavishtita mushnishe noshnishena vishtitam | mbhavati bhava tyavishtita
    mavishtita mbhavati bhava tyevam | eva mivevaiva meva miva | iva hi hiveva hi | ulba mive volba mulba
    miva | iva carma carmeveva carma | carmeveva carma carmeva | mmagmsa miveva magmsam | magmsa miveva
    magmsa ivasthyasthi vevasthi | asthi vevasthya sthiva | eva pashuh pashu revaiva pashuh | mpashuh
    pashu stam | ta maptva ''ptva ta aptva 'vavaptva ''ptva 'va | ava rundhe rundhe 'vava rundhe | rundhe
    yasya yasya rundhe rundhe yasya | yasyaishaisha yasya yasyaisha | esha yajne yajna eshaisha yajne
    | yajne prayashcittih prayashcitti ryajne yajne prayashcittih | prayashcittih kriyate kriyate prayashcittih
    prayashcittih kriyate kriyata ishtve shtva kriyate nishtve shtva vasiyan | nbhavati bhavati vasiyan
    a vayo vayo a vayo | vayo bhusha bhusha vayo vayo bhusha | shshucipa bhusha bhusha shucipah | shucipa
    upopa shucipa upa no na upopa nah | ssahasragm sahasra nte te sahasragm sahasra te niyuto niyuta ste
    te niyutah | niyuto vishvavara vishvavara niyuto niyuto vishvavara | vishvavareti vishva upo te ta
    upo upo te | te andho 'ndha ste te andhah | mmadya mandho 'ndho madya madya maya myayami madya ayami
    yasya yasyaya myayami yasya | yasya deva deva yasya yasya deva | deva dadhishe dadhishe deva deva
    dadhishe | purvapeyamiti purva tyai tva tva ''ku tva kamaya kamaya tva tva kamaya | kamaya tva tva
    kamaya kamaya tva | tva samridhe samridhe tva tva samridhe samridhe tva kikkita kikkita tva kikkita
    te te kikkita kikkita te te mano mana ste te manah | manah prajapataye prajapataye mano manah prajapataye
    | prajapataye svaha svaha prajapataye prajapataye svaha prajapataya iti praja svaha kikkita kikkita
    svaha svaha kikkita | kikkita te te kikkita kikkita te vayave svaha svaha vayave vayave svaha svaha
    kikkita kikkita svaha svaha kikkita | kikkita te te kikkita kikkita te te cakshu shcakshu ste te cakshuh
    | ssuryaya suryaya cakshu shcakshu suryaya svaha svaha suryaya suryaya svaha svaha kikkita kikkita
    svaha svaha kikkita | kikkita te te kikkita kikkita te te shrotragg shrotra ndyavaprithivibhya ndyavaprithivibhyag
    shrotragg shrotra ndyavaprithivibhya dyavaprithivibhyag svaha svaha dyavaprithivibhya ndyavaprithivibhyag
    svaha dyavaprithivibhyamiti dyava svaha kikkita kikkita svaha svaha kikkita | kikkita te te kikkita
    kikkita te vacagm sarasvatyai sarasvatyai vacam va~cagm sarasvatyai | sarasvatyai svaha svaha sarasvatyai
    sarasvatyai svaha svaha svaha tvam | || nturiya turiya tva turiya vashini vashini turiya turiya vashini
    vashini vasha vasha vashini vashini vasha | vasha 'syasi vasha vasha 'si | thsakri dasyasi sakrit
    | tva manasa manasa tva tva manasa | manasa garbho garbho manasa manasa garbhah | garbha a garbho
    garbha a | a 'shaya dashayada 'shayat | va~shini vashini tva vashini gaccha gaccha vashini vashini
    gaccha | ngaccha gaccha devan | ssantu santu satya santu yajamanasya yajamanasya santu santu yajamanasya
    | yajamanasya kamah kama yajamanasya yajamanasya kamah aja 'sya syaja 'ja 'si | asi rayishtha rayishtha
    'syasi rayishtha | rayishtha prithivya mprithivyagm rayishtha rayishtha prithivyam | prithivyagm sida
    sida prithivya mprithivyagm sida | sidordhvo rdhva sida sidordhva | urdhva 'ntariksha mantariksha
    murdhvordhva 'ntariksham | antariksha mupopa ntariksha mantariksha mupa | upa tishthasva tishthasvo
    popa tishthasva | tishthasva divi divi tishthasva tishthasva divi | divi te te divi divi te nrajaso
    rajasa stanva mbhanugm rajaso rajaso bhanum | anvi hihya nvanvihi | ihi jyotishmato jyotishmata ihihi
    jyotishmatah | jyotishmatah pathah patho jyotishmato jyotishmatah pathah | patho raksha raksha pathah
    patho raksha | raksha dhiya dhiya raksha raksha dhiya | ndhiya dhiya kritan | kritaniti kritan | va~yata
    vayata nulbana manulbanam va~yata vayata joguvam | joguva mapo 'po joguva rmanu rapo 'po manuh | bhava
    janaya janaya bhava bhava janaya | njanaya janaya daivya rmanaso manaso havih | asi prajapateh prajapate
    rasyasi prajapateh | rvarno varnah prajapateh prajapate prajapateriti praja va~rno varno gatranam
    | te gatrabhajo gatrabhaja ste te gatrabhajah | gatrabhajo bhuyasma bhuyasma gatrabhajo gatrabhajo
    bhuyasma | gatrabhaja iti gatra bhuyasmeti bhuyasma | || ime vai va ime ime vai | vai saha saha vai
    vai saha | sahasta mastagm saha sahasta rvayu ste te vayuh | garbha madadhata madadhata ragni rajanaya
    dajanaya dagnih | agni ragrasata grasata gni ragni ragrasata | sa eta metagm sa sa etam | mprajapatih
    prajapati reta meta prajapati ragneya ma mprajapatih prajapati ragneyam | prajapatiriti praja agneya
    mashtakapala mashtakapala magneya ma gneya mashtakapalam | ashtakapala mapashya dapashya dashtakapala
    mashtakapala mapashyat | ashtakapalamityashta ttena tena vapa davapa tenaivaiva tena tenaiva | evaina
    mena mevaivaina ena magne ragne rena mena magneh | agne radhyadhya gne ragne radhi | ni rakrina dakrina
    ttasma dakrina dakrina tasma dapyapi tasma apya nyadevatya manyadevatya mapyapya nyadevatya anyadevatya
    malabhamana alabhamano 'nyadevatya manyadevatya malabhamanah | anyadevatyamityanya gneya malabhamana
    alabhamana agneyam | agneya mashtakapala mashtakapala magneya ma gneya mashtakapalam | tpurasta dashtakapala
    mashtakapala ashtakapalamityashta agnerevai vagne ragnereva | evaina mena mevaivaina ena madhyadhye
    na mena madhi | adhi nishkriya nishkriya dhyadhi nishkriya | nishkriya nishkriya nishkriya | a labhate
    labhata a labhate | dyallabhate labhate yat | dvayavya vayavya tasma dvayavya vayavya yat | ngarbha
    mime ime garbha garbha madadhata madadhata ttasma dadadhata madadhata dyavaprithivya tasma dyavaprithivya
    ya dyavaprithivya yat | dyavaprithivyeti dyava ajanaya dagni ragni rajanaya dajanaya dagnih | agni
    ragrasata grasatagni ragni ragrasata | ttasma dagrasata grasata tasma 'gnishomiya tasma ttasma dagnishomiya
    agnishomiyetyagni rviyatyo ranayo ranayo rvag vag viyatyo ttasma davada davada thsarasvati sarasvati
    tasma thsarasvati sarasvati yat | tprajapatih prajapati prajapati ragne ragneh prajapatih prajapati
    ragneh | prajapatiriti praja agne radhyadhya gne ragne radhi | nnirakrina dadhyadhi nirakrinat | nirakrinaditi
    nih tprajapatya prajapatya tasma prajapatya sa sa prajapatya prajapatya sa | prajapatyeti praja va
    eshaisha vai va esha | esha sarvadevatya sarvadeva tyaishaisha sarvadevatya thsarvadevatya sarvadevatya
    yat | sarvadevatyeti sarva aja vasha vasha 'ja 'ja vasha | va~sha vasha vayavya vayavya ma vayavyam
    a labheta labheta labheta | labheta bhutikamo bhutikamo labheta labheta bhutikamah | rbhutikamo bhutikamo
    vayuh | bhutikama iti bhuti vai kshepishtha kshepishtha vai vai kshepishtha | kshepishtha devata devata
    kshepishtha kshepishtha devata ndevata devata vayum | eva svena svenaivaiva svena | svena bhagadheyena
    bhagadheyena svena svena bhagadheyena | || bhagadheyeno popa bhagadheyena bhagadheye nopa | upa dhavati
    dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | ngamayati gamayati bhuti gamayati dyavaprithivya
    ngamayati gamayati dyavaprithivya dyavaprithivya ma dyavaprithivya ndyavaprithivya ma | dyavaprithivyamiti
    dyava a labheta labheta labheta | labheta krishamanah krishamano labheta labheta krishamanah | krishamanah
    pratishthakamah pratishthakamah krishamanah krishamanah pratishthakamah | pratishthakamo divo divah
    pratishthakamah pratishthakamo divah | pratishthakama iti pratishtha diva evaiva divo diva eva | evasma
    asma evaivasmai asmai parjanyah parjanyo 'sma asmai parjanyah | shati parjanyah parjanyo var varshati
    vi vi var asya moshadhaya oshadhayo 'sya masya moshadhayah | oshadhayo rohanti roha ntyoshadhaya oshadhayo
    rohanti | rohanti samardhukagm samardhukagm rohanti rohanti samardhukam | samardhuka masyasya samardhukagm
    samardhuka masya | asya sasyagm sasya masyasya sasyam | mbhavati bhavati sasyagm sasya bhava tyagnishomiya
    magnishomiya mbhavati bhava tyagnishomiya agnishomiyama 'gnishomiya magnishomiyama | agnishomiyamityagni
    a labheta labheta labheta | labheta yo yo labheta labheta yah | yah kamayeta kamayeta yo yah kamayeta
    | nannavan kamayeta kamayeta nnavan | ssyag sya mannado sya mititi syag ityagnina 'gnineti tyagnina
    agninai vaivagnina 'gninaiva | evanna manna mevaivanna anna mavavanna manna mava | ava rundhe rundhe
    'vava rundhe | rundhe somena somena rundhe rundhe somena | somena nnadya mannadyagm somena somena
    nnadya nannadya mannadya mannavan | 'nnada evaivannadah | annado bhavati bhava tyannado bhavati sarasvatigm
    sarasvati mbhavati bhavati sarasvatim | sarasvati ma sarasvatigm sarasvati ma | a labheta labheta
    labheta | labheta yo yo labheta labheta yah | ishvaro vaco vaca i rvaco vaco vaditoh | vag vai vai
    vag vag vai | vai sarasvati sarasvati vai vai sarasvati | sarasvati sarasvatigm sarasvatigm sarasvati
    sarasvati sarasvatim | sarasvati mevaiva sarasvatigm sarasvati meva | eva svena svenaivaiva svena
    | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyeno popa bhagadheyena bhagadheye
    nopa | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sa | nnevaivasminn | ndadhati
    dadhati vacam dadhati prajapatya ndadhati dadhati prajapatyam | prajapatya ma prajapatya mprajapatya
    ma | prajapatyamiti praja a labheta labheta labheta | labheta yo yo labheta labheta yah | yah kamayeta
    kamayeta yo yah kamayeta | kamayeta nabhijita manabhijita nkamayeta kamayeta nabhijitam | anabhijita
    mabhyabhya nabhijita manabhijita mabhi | njayeya mabhyabhi jayeyam | jayeya mititi jayeya iti prajapatih
    prajapati rititi prajapatih | prajapatih prajapati prajapatiriti praja sarva devata devata rdevata
    devata devatabhih | devatabhi revaiva devatabhi eva nabhijita manabhijita mevaiva nabhijitam | anabhijita
    mabhyabhya nabhijita manabhijita mabhi | abhi jayati jaya tyabhyabhi jayati | jayati vayavyaya vayavyaya
    jayati jayati vayavyaya | vayavyayo pakarotyu pakaroti vayavyaya vayavyayo pakaroti | rvayoru pakaro
    tyupakaroti vayoh | evaina mena mevaivaina ena mavaruddhya varuddhyai na mena mavaruddhya | avaruddhya
    'varuddhya varuddhya | a labhate labhata a labhate | tyai tva tva ''ku tva kamaya kamaya tva tva kamaya
    | kamaya tva tva kamaya kamaya tva | tvetiti tva tveti | || itya hahe tityaha | ryathayaju rahaha
    yathayajuh | yathayaju revaiva yathayaju evaita deta devaivaitat | nkikkitakara meta deta njuhoti
    juhoti kikkitakara kikkitakaramiti kikkita juhoti kikkitakarena kikkitakarena juhoti juhoti kikkitakarena
    | kikkitakarena vai vai kikkitakarena kikkitakarena vai | kikkitakareneti kikkita vai gramya gramya
    vai vai gramyah | gramyah pashavah pashavo gramya gramyah pashavah | pashavo ramante ramante pashavah
    pashavo ramante | ramante pra pra ramante ramante pra | praranya aranyah pra praranyah | aranyah patanti
    pata ntyaranya aranyah patanti | tpatanti patanti yat | njuhoti juhoti kikkitakara kikkitakaramiti
    kikkita juhoti gramyana njuhoti juhoti gramyana ndhrityai dhrityai pashuna dhrityai paryagnau paryagnau
    dhrityai dhrityai paryagnau | paryagnau kriyamane kriyamane paryagnau paryagnau kriyamane | paryagnaviti
    pari kriyamane juhoti juhoti kriyamane kriyamane juhoti | njuhoti juhoti jivantim | jivanti mevaiva
    jivanti evaina mena mevaivaina enagm suvargagm suvarga mena menagm suvargam | suvargam ~lokam ~lokagm
    suvargagm suvargam ~lokam | ngamayati gamayati lokam ~loka ngamayati gamayati tvam | nturiya turiya
    tva turiya vashini vashini turiya turiya vashini vashini vasha vasha vashini vashini vasha | vasha
    'syasi vasha vasha 'si | asi titya syasi ti | itya hahe titya ha | aha devatra devatra ''haha devatra
    | devatrai vaiva devatra devatraiva | evaina mena mevaivaina ngamayati gamaya tyena mena ssatya gamayati
    gamayati satyah | ssantu santu satya santu yajamanasya yajamanasya santu santu yajamanasya | yajamanasya
    kamah kama yajamanasya yajamanasya kamah kama ititi kamah kama iti | itya hahe tityaha | ahaisha esha
    aha haishah | esha vai va esha esha vai | vai kamah kamo vai vai kamah | kamo yajamanasya yajamanasya
    kamah kamo yajamanasya | || dyajamanasya yajamanasya yat | rta udrica mudrica manarto 'na ngacchati
    gaccha tyudrica mudrica dgacchati gacchati tasma eva mahahaiva meva maha | ahaja 'ja ''hahaja | aja
    'sya syaja 'ja 'si | asi rayishtha rayishtha 'syasi rayishtha | rayishthetiti rayishtha rayishtheti
    | itya hahe tityaha | evaina mena mevaivaina enam ~lokeshu loke shvena menam ~lokeshu | lokeshu prati
