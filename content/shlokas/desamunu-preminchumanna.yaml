id: desamunu-preminchumanna
category: stotram
name:
  english: Desamunu Preminchumanna
content:
  english: deshamunu premincumanna manci annadi pèncumanna vatti matalu kattipèttoy gatti mel talapèttavoy
    padipantalupòngi pòrle darilo nuvu patu padavoy tindi kaligitè kanda kaladoy kanda kalavadenu manishoy
    isuromani manushulunte desha megati bagupadunoy jaldukòni kalalèlla nercuku deshi sarukulu nincavoy
    anni deshal krammavalè noy deshi sarukulu nammavèlè noy dabbu telenatti narulaku kirti sampada labbavoy
    vènuka cusina karyamemoy mancigatamuna kòncamenoy mandagincaka mundu adugey vènuka padite vènukenoy
    punu spardanu vidyalande vairamulu vanijya mande vyardha kalaham pèncabokoy katti vairam kalcavoy
    deshabhimanamu naku kaddani vatti gòppalu cèppakokoy puni yedainanu vòka mel kurci janulaku cupavoy
    orvalemi pishaci desham mulugulu pilcesè noy òrula meluku santasistu aikamatyam nercavoy parula kalimiki
    pòrli yedce papi kèkkada sukham kaddoy òkari mel tana melanènce nerpariki mel kòlla loyi sònta labham
    kònta manuku pòruguvadiki todu padavoy deshamante mattikadoyi deshamante manushuloy cètta pattal pattukuni
    deshastu lanta nadavavalè noy annadammula valènu jatulu matamulanni mèlagavalè noyi matam veraitenu
    yemoyi manasu vòkatai manushulunte jatiyannadi leci pèrigi lokamuna ranincu noyi desha maniyèdi dòdda
    vriksham premalanu pulèttavalè noy narula cèmatanu tadisi mulam dhanam pantalu pandavalè noyi akulanduna
    anagi managi kavita palakavalè noy palukulanu vini deshamandabhi manamulu mòlakètta valènoyi
  devanagari: देशमुनु प्रेमिञ्चुमन्ना मञ्चि अन्नदि पॆञ्चुमन्ना वट्टि माटलु कट्टिपॆट्टोय् गट्टि मेल् तलपॆट्टवोय्
    पाडिपण्टलुपॊङ्गि पॊर्ले दारिलो नुवु पाटु पडवोय् तिण्डि कलिगितॆ कण्ड कलदोय् कण्ड कलवाडेनु मनिषोय् ईसुरोमनि
    मनुषुलुण्टे देश मेगति बागुपडुनोय् जल्डुकॊनि कललॆल्ल नेर्चुकु देशि सरुकुलु निञ्चवोय् अन्नि देशाल् क्रम्मवलॆ
    नोय् देशि सरुकुलु नम्मवॆलॆ नोय् डब्बु तेलेनट्टि नरुलकु कीर्ति सम्पद लब्बवोय् वॆनुक चूसिन कार्यमेमोय्
    मञ्चिगतमुन कॊञ्चमेनोय् मन्दगिञ्चक मुन्दु अडुगेय् वॆनुक पडिते वॆनुकेनोय् पूनु स्पर्दनु विद्यलन्दे वैरमुलु
    वाणिज्य मन्दे व्यर्ध कलहं पॆञ्चबोकोय् कत्ति वैरं काल्चवोय् देशाभिमानमु नाकु कद्दनि वट्टि गॊप्पलु चॆप्पकोकोय्
    पूनि येदैनानु वॊक मेल् कूर्चि जनुलकु चूपवोय् ओर्वलेमि पिशाचि देशं मूलुगुलु पील्चेसॆ नोय् ऒरुल मेलुकु
    सन्तसिस्तू ऐकमत्यं नेर्चवोय् परुल कलिमिकि पॊर्लि येड्चे पापि कॆक्कड सुखं कद्दोय् ऒकरि मेल् तन मेलनॆञ्चे
    नेर्परिकि मेल् कॊल्ल लोयि सॊन्त लाभं कॊन्त मानुकु पॊरुगुवाडिकि तोडु पडवोय् देशमण्टे मट्टिकादोयि देशमण्टे
    मनुषुलोय् चॆट्ट पट्टाल् पट्टुकुनि देशस्तु लन्ता नडववलॆ नोय् अन्नदम्मुल वलॆनु जातुलु मतमुलन्नी मॆलगवलॆ
    नोयि मतं वेरैतेनु येमोयि मनसु वॊकटै मनुषुलुण्टे जातियन्नदि लेचि पॆरिगी लोकमुन राणिञ्चु नोयि देश मनियॆडि
    दॊड्ड वृक्षं प्रेमलनु पूलॆत्तवलॆ नोय् नरुल चॆमटनु तडिसि मूलं धनं पण्टलु पण्डवलॆ नोयि आकुलन्दुन अणगि
    मणगी कवित पलकवलॆ नोय् पलुकुलनु विनि देशमन्दभि मानमुलु मॊलकॆत्त वलॆनोयि
