id: sudarshana-sahasra-nama-stotram
category: stotram
name:
  english: Sudarshana Sahasra Nama Stotram
content:
  english: shri ganeshaya namah || shrisudarshana parabrahmane namah || atha shrisudarshana sahasranama
    stotram || kailasashikhare ramye muktamanikya mandape | raktasimhasanasinam pramathaih parivaritam
    || || baddhanjaliputa bhutva papraccha vinayanvita | bhartaram sarvadharmajnam parvati parameshvaram
    || yat tvayoktam jagannatha subhrusham kshemamicchatam | saudarshanam rute shastram nasticanyaditi
    prabho || || tatra kacit vivakshasthi tamartham prati me prabho | evamuktastvahirbuddhnyah parvatim
    pratyuvaca tam || samshayo yadi te tatra tam bruhi tvam varanane | ityevamukta girija girishena mahatmana
    || || punah provaca sarvajnam jnanamudradharam patim || parvatyuvaca loke saudarshanam mantram yantrantattat
    prayogavat || || sarvam vijnatumabhyatra yathavat samanushthitum | ativelamashaktanam tam margam bhrishamichtam
    || || ko margah ka kathistesham karyasiddhih katham bhavet | etanme bruhi lokesha tvadanyah ko vadetamum
    || aham te kathayishyami sarva siddhikaram shubham | anayasena yajjaptva narassiddhimavapnuyat ||
    || tashca saudarshanam divyam guhyam namasahasrakam | niyamat pathatam nrinam cintitartha pradayakam
    || || tasya namasahasrasya so'hameva rishih smritah | chandonushtup devata tu paramatma sudarshanah
    || || shrim bijam hrim tu shaktissa klim kilakamudahritam | samastabhishta sidhyarthe viniyoga udahritah
    || || shankham cakram ca capadi dhyanamasya samiritam || dhyanam shankham cakram ca capam parashumasimishum
    shula pashankushabjam bibhranam vajrakhetau hala musala gada kundamatyugra damshtram | jvala kesham
    trinetram jvala dalananibham hara keyura bhusham dhyayet shatkona samstham sakala ripujana prana samhari
    cakram || || harih om || shricakrah shrikarah shrishah shrivishnuh shrivibhavanah | shrimadantya harah
    shriman shrivatsakrita lakshanah || || shrinidhih shrivarah sragvi shrilakshmi karapujitah | shriratah
    shrivibhuh sindhukanyapatih adhokshajah || || acyutashcambujagrivah sahasrarah sanatanah | samarcito
    vedamurtih samatita suragrajah || || shatkona madhyago virah sarvago'shtabhujah prabhuh | candavego
    bhimaravah shipivishtarcito harih || || shashvatah sakalah shyamah shyamalah shakatarthanah | daityarih
    sharadaskandhah sakatakshah shirishagah || || sharaparirbhaktavashyah shashanko vamanovyayah | varuthivarijah
    kanjalocano vasudhadipah || || varenyo vahano'nantah cakrapanirgadagrajah | gabhiro golakadhisho gadapanissulocanah
    || || sahasrakshah caturbahuh shankhacakra gadadharah | bhishano bhitido bhadro bhimabhishta phalapradah
    || || bhimarcito bhimaseno bhanuvamsha prakashakah | prahladavaradah balalocano lokapujitah || ||
    uttaramanado mani manavabhishta siddhidah | bhaktapalah papahari balado dahanadhvajah || || karishah
    kanako data kamapala puratanah | akrurah krurajanakah kruradamshtrah kuladipah || || krurakarma krurarupi
    krurahari kusheshayah | mandaro maninikanto madhuha madhavapriyah || || supratapta svarnarupi banasura
    bhujantakrit | dharadharo danavarirdanujendrari pujitah || || bhagyaprado mahasattvo vishvatma vigatajvarah
    | suracaryarcito vashyo vasudevo vasupradah || || pranatartiharah shreshtah sharanyah papanashanah
    | pavako varanadrisho vaikuntho vigatakalmashah || || vajradamshtro vajranakho vayurupi nirashrayah
    | niriho nispriho nityo nitijno nitipavanah || || nirupo naradanuto nakulacala vasakrit | nityanando
    brihadbhanuh brihadishah puratanah || || nidhinamadhipo'nando narakarnava tarakah | agadho'viralo
    martyo jvalakeshah kakarccitah || || tarunastanukrit bhaktah paramah cittasambhavah | cintyassatvanidhih
    sagrascidanandah shivapriyah || || shinshumarashshatamakhah shatakumbha nibhaprabhah | bhoktarunesho
    balavan balagraha nivarakah || || sarvarishta prashamano mahabhaya nivarakah | bandhuh subandhuh supritassantushtassurasannutah
    || || bijakeshyo bako bhanuh amitarcirpampatih | suyajno jyotishashshanto virupakshah sureshvarah
    || || vahniprakara samvito raktagarbhah prabhakarah | sushilah subhagah svakshah sumukhah sukhadah
    sukhi || || mahasurah shiraccheta pakashasana vanditah | shatamurti sahasraro hiranya jyotiravyayah
    || || mandali mandalakarah candrasuryagni locanah | prabhanjanah tikshnadharah prashantah sharadapriyah
    || || bhaktapriyo baliharo lavanyolakshanapriyah | vimalo durlabhassomyassulabho bhimavikramah ||
    || jitamanyuh jitaratih mahaksho bhrigupujitah | tattvarupah tattvavedih sarvatatva pratishthitah
    || || bhavajno bandhujanako dinabandhuh puranavit | shastresho nirmato neta naro nanasurapriyah ||
    || nabhicakro natamitro nadhisha karapujitah | damanah kalikah karmi kantah kalarthanah kavih || ||
    vasundharo vayuvego varaho varunalayah | kamaniyakritih kalah kamalasana sevitah | kripaluh kapilah
    kami kamitartha pradayakah || || dharmaseturdharmapalo dharmi dharmamayah parah | jvalajimhah shikhamaulih
    surakarya pravartakah || || kaladharah surarighnah kopaha kalarupadrik | data''nandamayo divyo brahmarupi
    prakashakrit || | sarvayajnamayo yajno yajnabhuk yajnabhavanah | vahnidhvajo vahnisakho vanjuladruma
    mulakah || || dakshaha danakari ca naro narayanapriyah | daityadandadharo dantah shubhrangah shubhadayakah
    || || lohitaksho maharaudrau mayarupadharah khagah | unnato bhanujah sango mahacakrah parakrami ||
    || agnisho'gnimayah dvagnilocanogni samaprabhah | agnimanagnirasano yuddhasevi ravipriyah || || ashrita
    ghaugha vidhvamsi nityananda pradayakah | asuraghno mahabahurbhimakarma shubhapradah || || shashanka
    pranavadharah samasthashi vishapahah | tarko vitarko vimalo bilako badarayanah || || badiragnascakravalah
    shatkonantargatasshikhih | dritadhanva shodashaksho dirghabahurdarimukhah || || prasanno vamajanako
    nimno nitikarah shucih | narabhedi simharupi puradhishah purandarah || || ravistuto yutapalo yutaparissatangatih
    | hrishikesho dvitramurtih dvirashtayudabhrit varah || || divakaro nishanatho diliparcita vigrahah
    | dhanvantarisshyamalarirbhaktashoka vinashakah || || ripuprana haro jeta shurascaturya vigrahah |
    vidhata saccidanandassarvadushta nivarakah || || ulko maholko raktolkassahasrolkasshatarcishah | buddho
    bauddhaharo bauddha janamoho budhashrayah || || purnabodhah purnarupah purnakamo mahadyutih | purnamantrah
    purnagatrah purnashadgunya vigrahah || || purnanemih purnanabhih purnashi purnamanasah | purnasarah
    purnashaktih rangasevi ranapriyah || || puritasho'rishtadati purnarthah purnabhushanah | padmagarbhah
    parijatah paramitrassharakritih || || bhubritvapuh punyamurti bhubhritam patirashukah | bhagyodayo
    bhaktavashyo girijavallabhapriyah || || gavishto gajamanisho gamanagamana priyah | brahmacari bandhumani
    supratikassuvikramah || || shankarabhishtado bhavyah sacivyassavyalakshanah | mahahamsassukhakaro
    nabhaga tanayarcitah || || kotisuryaprabho dipto vidyutkoti samaprabhah | vajrakalpo vajrasakho vajranirghata
    nisvanah || || girisho manado manyo narayana karalayah | aniruddhah paramarshi upendrah purnavigrahah
    || || ayudheshasshatarighnah shamanah shatasainikah | sarvasura vadhodyuktah surya durmana bhedakah
    || || rahuviploshakari ca kashinagara dahakah | piyushamshu paranjyotih sampurna kratubhuk prabhuh
    || || mandhatri varadasshuddho harasevyasshacishtadah | sahishnurbalabhuk viro lokabhrillokanayakah
    || || durvasomuni darpaghno jayato vijayapriyah | puradhisho'suraratih govinda karabhushanah || ||
    ratharupi rathadhishah kalacakra kripanidhih | cakrarupadharo vishnuh sthulasukshmashshikhiprabhah
    || || sharanagata santrata vetalarirmahabalah | jnanado vakpatirmani mahavego mahamanih || || vidyut
    kesho vihareshah padmayonih caturbhujah | kamatma kamadah kami kalanemi shiroharah || || shubhrasshucisshunasirah
    shukramitrah shubhananah | vrishakayo vrisharatih vrishabhendra supujitah || || vishvambharo vitihotro
    viryo vishvajanapriyah | vishvakrit vishvabho vishvaharta sahasakarmakrit || || banabahuharo jyotih
    paratma shokanashanah | vimaladipatih punyo jnata jneyah prakashakah || || mleccha prahari dushtaghnah
    suryamandalamadhyagah | digambaro vrishadrisho vividhayudha rupakah || || satvavan satyavagishah satyadharma
    parayanah | rudrapritikaro rudra varado rugvibhedakah || || narayano nakrabhedi gajendra parimokshakah
    | dharmapriyah shadadharo vedatma gunasagarah || || gadamitrah prithubhujo rasatala vibhedakah | tamovairi
    mahatejah maharajo mahatapah || || samastariharah shanta kruro yogeshvareshvarah | sthavirassvarna
    varnangah shatrusainya vinashakrit || || prajno vishvatanutrata sha ritismritimayah kriti | vyaktavyakta
    svarupamsah kalacakrah kalanidhih || || mahadhyutirameyatma vajranemih prabhanidhih | mahasphulinga
    dhararcih mahayuddha kritacyutah || || kritajnassahano vagmi jvalamala vibhushanah | caturmukhanutah
    shriman bhrajishnurbhaktavatsalah || || caturyagamanashcakri caturvarga pradayakah | vicitramalyabharanah
    tikshnadharah surarcitah || || yugakrit yugapalashca yugasandhiryugantakrit | sutikshnaragano gamyo
    balidhvamsi trilokapah || || trinetrastrijagadvandhyah trinikrita mahasurah | trikalajnastrilokajnah
    trinabhih trijagatpriyah || || sarvayantramayo mantrassarvashatru nibarhanah | sarvagassarvavit saumyassarvalokahitankarah
    || || adimulah sadgunadhyo varenyastrigunatmakah | dhyanagamyah kalmashaghnah kaligarva prabhedakah
    || || kamaniya tanutranah kundali manditananah | sukunthikrita candeshah susantrastha shadananah ||
    || vishadhikrita vighnesho vigatananda nandikah | mathita pramathavyuhah pranata pramadadhipah ||
    || pranabhiksha prado'nanto lokasakshi mahasvanah | medhavi shashvatho'krurah krurakarma'parajitah
    || || ari drishto'prameyatma sundarashshatrutapanah | yoga yogishvaradhisho bhaktabhishta prapurakah
    || || sarvakamaprado'cintyah shubhangah kulavardhanah | nirvikaro'ntarupo naranarayanapriyah || ||
    mantra yantra svarupatma paramantra prabhedakah | bhutavetala vidhvamsi canda kushmanda khandanah
    || || yaksha rakshogana dhvamsi mahakritya pradahakah | sakalikrita maricah bhairava graha bhedakah
    || || curnikrita mahabhutah kabalikrita durgrahah | sudurgraho jambhabhedi sucimukha nishudanah ||
    || vrikodarabaloddhartta purandara balanugah | aprameya balah svami bhaktapriti vivardhanah || ||
    mahabhuteshvarashshuro nityassharadavigrahah | dharmadhyaksho vidharmaghnah sudharmasthapakashshivah
    || || vidhumajvalano bhanurbhanuman bhasvatam patih | jaganmohana patirassarvopadrava shodhakah ||
    || kulishabharano jvalavritassaubhagya vardhanah | grahapradhvamsakah svatmarakshako dharanatmakah
    || || santapano vajrasarassumedha'mrita sagarah | santana panjaro banatatanko vajramalikah || || mekhalagnishikho
    vajra panjarassasurankushah | sarvaroga prashamano gandharva vishikhakritih || || pramoha mandalo
    bhuta graha sha rinkhala karmakrit | kalavrito mahashankhu dharanasshalya candrikah || || chedano
    dharakasshalya kshutronmulana tatparah | bandhanavaranasshalya krintano vajrakilakah || || pratikabandhano
    jvala mandalasshastradharanah | indrakshimalikah kritya dandascittaprabhedakah || || graha vagurikassarva
    bandhano vajrabhedakah | laghusantana sankalpo baddhagraha vimocanah || || maulikancana sandhata vipaksha
    matabhedakah | digbandhana karassuci mukhagniscittapatakah || || coragni mandalakarah parakankala
    mardanah | tantrikasshatruvamshaghno nananigala mocanah || || samasthaloka sarangah sumaha vishadushanah
    | sumaha merukodandah sarva vashyakareshvarah || || nikhilakarshanapatuh sarva sammoha karmakrit |
    samsthambana karah sarva bhutoccatana tatparah || || ahitamaya kari ca dvishanmarana karakah | ekayana
    gadamitra vidveshana parayanah || || sarvartha siddhido data vidhata vishvapalakah | virupaksho mahavakshah
    varishto madhavapriyah || || amitrakarshana shantah prashantah pranatartiha | ramaniyo ranotsaho raktaksho
    ranapanditah || || ranantakrit ratakarah ratango ravipujitah | viraha vividhakarah varunaradhito vashih
    | sarva shatru vadhakankshi shaktiman bhaktamanadah || || sarvalokadharah punyah purushah purushottamah
    | puranah pundarikakshah paramarma prabhedakah || || virasanagato varmi sarvadharo nirankushah | jagatraksho
    jaganmurtih jagadananda vardhanah || || sharadah shakataratih shankarasshakatakritih | virakto raktavarnadhyo
    ramasayaka rupadrit || || mahavarah damshtratma nrisimha nagaratmakah | samadrinmokshado vandhyo vihari
    vitakalmashah || || gambhiro garbhago gopta gabhastirguhyagoguruh | shridharah shriratasshrantah shatrughnassha
    || purano vitato virah pavitrascaranahvayah | mahadhiro mahaviryo mahabala parakramah || || suvigraho
    vigrahaghnah sumani manadayakah | mayi mayapaho mantri manyo manavivardhanah || || shatrusamharakasshurah
    shukrarishshankararcitah | sarvadharah paranjyotih pranah pranabhritacyutah || || candradhama'pratidvandah
    paramatma sudurgamah | vishuddhatma mahatejah punyashlokah puranavit || || samastha jagadadharo vijeta
    vikramah kramah | adidevo dhruvo drishyah sattvikah pritivardhanah || || sarvalokashrayassevyah sarvatma
    vamshavardhanah | duradharshah prakashatma sarvadrik sarvavitsamah || || sadgatissatvasampannah nityasankalpa
    kalpakah | varni vacaspatirvagmi mahashaktih kalanidhih || || antarikshagatih kalyah kalikalushya
    mocanah | satyadharmah prasannatma prakrishto vyomavahanah || || shitadharasshikhi raudro bhadro rudrasupujitah
    | darimukhagnijambhaghno viraha vasavapriyah || || dustarassuduraroho durjneyo dushtanigrahah | bhutavaso
    bhutahanta bhutesho bhutabhavanah || || bhavajno bhavarogaghno manovegi mahabhujah | sarvadevamayah
    kantah smritiman sarvapavanah || || nitiman sarvajit saumyo maharshiraparajitah | rudrambarisha varado
    jitamayah puratanah || || adhyatma nilayo bhokta sampurnassarvakamadah | satyo'ksharo gabhiratma vishvabharta
    mariciman || || niranjano jitabhramshuh agnigarbho'gni gocarah | sarvajit sambhavo vishnuh pujyo mantravitakriyah
    || || shatavarttah kalanathah kalah kalamayo harih | arupo rupasampanno vishvarupo virupakrit || ||
    svamyatma samarashlaghi suvrato vijayamvitah | candghnascandakiranah caturascaranapriyah || || punyakirtih
    paramarshi nrisimho nabhimadhyagah | yajnatma yajnasankalpo yajnaketurmaheshvarah || || jitariryajnanilayashsharanyashshakatakritih
    | uttmo'nuttmonangassangassarvanga shobhanah || || kalagnih kalanemighnah kami karunyasagarah | ramanandakaro
    ramo rajanishantarasthitah || || samvardhana samaramveshi dvishatprana parigrahah | mahabhimani sandhata
    sarvadhisho mahaguruh || siddhah sarvajagadyonih siddharthassarvasiddhidah | caturvedamayashshastha
    sarvashastra visharadah || || tiraskritarka tejasko bhaskararadhitashshubhah | vyapi vishvambharo
    vyagrah svayanjyotiranantakrit || || jayashilo jayakankshi jatavedo jayapradah | kavih kalyanadah
    kamyo mokshado mohanakritih || || kunkumaruna sarvanga kamalakshah kavishvarah | suvikramo nishkalanko
    vishvakseno viharakrit || || kadambasura vidhvamsi ketanagraha dahakah | jugupsagnastikshnadharo vaikuntha
    bhujavasakrit || || sarajnah karunamurtih vaishnavo vishnubhaktidah | sukrutajno mahodaro dushkritaghnassuvigrahah
    || || sarvabhishta prado'nto nityanando gunakarah | cakri kundadharah khadgi parashvata dharo'gnibhrit
    || || dritankusho dandadharah shaktihasthassushankhabhrut | dhanvi dritamahapasho hali musalabhushanah
    || || gadayudhadharo vajri mahashula lasatbhujah | samastayudha sampurnassudarshana mahaprabhuh ||
    ritih || iti saudarshanam divyam guhyam namasahasrakam | sarvasiddhikaram sarva yantra mantratmakam
    param || || etannama sahasram tu nityam yah pathet sudhih | sha rinoti va shravayati tasya siddhih
    karastita || || daityanam devashatrunam durjayanam mahaujasam | vinasharthamidam devi haro rasadhitam
    maya || || shatrusamharakamidam sarvada jayavardhanam | jala shaila maharanya durgameshu mahapati
    || || bhayankareshu shapatsu samprapteshu mahatsuca | yassakrit pathanam kuryat tasya naiva bhavet
    bhayam || || brahmaghnashca pashughnashca matapitri vinindakah | devanam dushakashcapi gurutalpagato'pi
    va || || japtva sakritidam stotram mucyate sarvakilbishaih | tishthan gacchan svapan bhunjan jagrannapi
    hasannapi || || sudarshana nrisimheti yo vadettu sakrinnarah | sa vai na lipyate papaih bhuktim muktim
    ca vindati || || adayo vyadayassarve roga rogadidevatah | shighram nashyanti te sarve pathanattasya
    vai nrinam || || bahunatra kimuktena japtvedam mantra pushkalam | yatra martyashcaret tatra rakshati
    shrisudarshanah || || iti shri vihageshvara uttarakhande umamaheshvarasamvade mantravidhane shri sudarshana
    sahasranama stotram nama shodasha prakashah ||
  devanagari: श्री गणेशाय नमः ॥ श्रीसुदर्शन परब्रह्मणे नमः ॥ अथ श्रीसुदर्शन सहस्रनाम स्तोत्रम् ॥ कैलासशिखरे
    रम्ये मुक्तामाणिक्य मण्डपे । रक्तसिंहासनासीनं प्रमथैः परिवारितम् ॥ ॥ बद्धाञ्जलिपुटा भूत्वा पप्रच्छ
    विनयान्विता । भर्तारं सर्वधर्मज्ञं पार्वती परमेश्वरम् ॥ यत् त्वयोक्तं जगन्नाथ सुभ्रुशं क्षेममिच्छताम्
    । सौदर्शनं रुते शास्त्रं नास्तिचान्यदिति प्रभो ॥ ॥ तत्र काचित् विवक्षास्थि तमर्थं प्रति मे प्रभो ।
    एवमुक्तस्त्वहिर्बुद्ध्न्यः पार्वतीं प्रत्युवाच ताम् ॥ संशयो यदि ते तत्र तं ब्रूहि त्वं वरानने । इत्येवमुक्ता
    गिरिजा गिरिशेन महात्मना ॥ ॥ पुनः प्रोवाच सर्वज्ञं ज्ञानमुद्राधरं पतिम् ॥ पार्वत्युवाच लोके सौदर्शनं
    मन्त्रं यन्त्रन्तत्तत् प्रयोगवत् ॥ ॥ सर्वं विज्ञातुमभ्यत्र यथावत् समनुष्ठितुम् । अतिवेलमशक्तानां तं
    मार्गं भृशमीछ्ताम् ॥ ॥ को मार्गः का कथिस्तेषां कार्यसिद्धिः कथं भवेत् । एतन्मे ब्रूहि लोकेश त्वदन्यः
    को वदेतमुम् ॥ अहं ते कथयिश्यामि सर्व सिद्धिकरं शुभम् । अनायासेन यज्जप्त्वा नरस्सिद्धिमवाप्नुयात् ॥
    ॥ तश्च सौदर्शनं दिव्यं गुह्यं नामसहस्रकम् । नियमात् पठतां नॄणां चिन्तितार्थ प्रदायकम् ॥ ॥ तस्य नामसहस्रस्य
    सोऽहमेव ऋषिः स्मृतः । छन्दोनुष्टुप् देवता तु परमात्मा सुदर्शनः ॥ ॥ श्रीं बीजं ह्रीं तु शक्तिस्सा क्लीं
    कीलकमुदाहृतम् । समस्ताभीष्ट सिध्यर्थे विनियोग उदाहृतः ॥ ॥ शङ्खं चक्रं च चापादि ध्यानमस्य समीरितम्
    ॥ ध्यानं शङ्खं चक्रं च चापं परशुमसिमिशुं शूल पाशाङ्कुशाब्जम् बिभ्राणं वज्रखेटौ हल मुसल गदा कुन्दमत्युग्र
    दंष्ट्रम् । ज्वाला केशं त्रिनेत्रं ज्वल दलननिभं हार केयूर भूषम् ध्यायेत् षट्कोण संस्थं सकल रिपुजन
    प्राण संहारि चक्रम् ॥ ॥ हरिः ओम् ॥ श्रीचक्रः श्रीकरः श्रीशः श्रीविष्णुः श्रीविभावनः । श्रीमदान्त्य
    हरः श्रीमान् श्रीवत्सकृत लक्षणः ॥ ॥ श्रीनिधिः श्रीवरः स्रग्वी श्रीलक्ष्मी करपूजितः । श्रीरतः श्रीविभुः
    सिन्धुकन्यापतिः अधोक्षजः ॥ ॥ अच्युतश्चाम्बुजग्रीवः सहस्रारः सनातनः । समर्चितो वेदमूर्तिः समतीत सुराग्रजः
    ॥ ॥ षट्कोण मध्यगो वीरः सर्वगोऽष्टभुजः प्रभुः । चण्डवेगो भीमरवः शिपिविष्टार्चितो हरिः ॥ ॥ शाश्वतः सकलः
    श्यामः श्यामलः शकटार्थनः । दैत्यारिः शारदस्कन्धः सकटाक्षः शिरीषगः ॥ ॥ शरपारिर्भक्तवश्यः शशाङ्को वामनोव्ययः
    । वरूथीवारिजः कञ्जलोचनो वसुधादिपः ॥ ॥ वरेण्यो वाहनोऽनन्तः चक्रपाणिर्गदाग्रजः । गभीरो गोलकाधीशो गदापणिस्सुलोचनः
    ॥ ॥ सहस्राक्षः चतुर्बाहुः शङ्खचक्र गदाधरः । भीषणो भीतिदो भद्रो भीमाभीष्ट फलप्रदः ॥ ॥ भीमार्चितो भीमसेनो
    भानुवंश प्रकाशकः । प्रह्लादवरदः बाललोचनो लोकपूजितः ॥ ॥ उत्तरामानदो मानी मानवाभीष्ट सिद्धिदः । भक्तपालः
    पापहारी बलदो दहनध्वजः ॥ ॥ करीशः कनको दाता कामपाल पुरातनः । अक्रूरः क्रूरजनकः क्रूरदंष्ट्रः कुलादिपः
    ॥ ॥ क्रूरकर्मा क्रूररूपि क्रूरहारी कुशेशयः । मन्दरो मानिनीकान्तो मधुहा माधवप्रियः ॥ ॥ सुप्रतप्त स्वर्णरूपी
    बाणासुर भुजान्तकृत् । धराधरो दानवारिर्दनुजेन्द्रारि पूजितः ॥ ॥ भाग्यप्रदो महासत्त्वो विश्वात्मा विगतज्वरः
    । सुराचार्यार्चितो वश्यो वासुदेवो वसुप्रदः ॥ ॥ प्रणतार्तिहरः श्रेष्टः शरण्यः पापनाशनः । पावको वारणाद्रीशो
    वैकुण्ठो विगतकल्मषः ॥ ॥ वज्रदंष्ट्रो वज्रनखो वायुरूपी निराश्रयः । निरीहो निस्पृहो नित्यो नीतिज्ञो
    नीतिपावनः ॥ ॥ नीरूपो नारदनुतो नकुलाचल वासकृत् । नित्यानन्दो बृहद्भानुः बृहदीशः पुरातनः ॥ ॥ निधिनामधिपोऽनन्दो
    नरकार्णव तारकः । अगाधोऽविरलो मर्त्यो ज्वालाकेशः ककार्च्चितः ॥ ॥ तरुणस्तनुकृत् भक्तः परमः चित्तसम्भवः
    । चिन्त्यस्सत्वनिधिः साग्रस्चिदानन्दः शिवप्रियः ॥ ॥ शिन्शुमारश्शतमखः शातकुम्भ निभप्रभः । भोक्तारुणेशो
    बलवान् बालग्रह निवारकः ॥ ॥ सर्वारिष्ट प्रशमनो महाभय निवारकः । बन्धुः सुबन्धुः सुप्रीतस्सन्तुष्टस्सुरसन्नुतः
    ॥ ॥ बीजकेश्यो बको भानुः अमितार्चिर्पाम्पतिः । सुयज्ञो ज्योतिषश्शान्तो विरूपाक्षः सुरेश्वरः ॥ ॥ वह्निप्राकार
    संवीतो रक्तगर्भः प्रभाकरः । सुशीलः सुभगः स्वक्षः सुमुखः सुखदः सुखी ॥ ॥ महासुरः शिरच्छेता पाकशासन वन्दितः
    । शतमूर्ति सहस्रारो हिरण्य ज्योतिरव्ययः ॥ ॥ मण्डली मण्डलाकारः चन्द्रसूर्याग्नि लोचनः । प्रभञ्जनः तीक्ष्णधारः
    प्रशान्तः शारदप्रियः ॥ ॥ भक्तप्रियो बलिहरो लावण्योलक्षणप्रियः । विमलो दुर्लभस्सोम्यस्सुलभो भीमविक्रमः
    ॥ ॥ जितमन्युः जितारातिः महाक्षो भृगुपूजितः । तत्त्वरूपः तत्त्ववेदिः सर्वतत्व प्रतिष्ठितः ॥ ॥ भावज्ञो
    बन्धुजनको दीनबन्धुः पुराणवित् । शस्त्रेशो निर्मतो नेता नरो नानासुरप्रियः ॥ ॥ नाभिचक्रो नतामित्रो नधीश
    करपूजितः । दमनः कालिकः कर्मी कान्तः कालार्थनः कविः ॥ ॥ वसुन्धरो वायुवेगो वराहो वरुणालयः । कमनीयकृतिः
    कालः कमलासन सेवितः । कृपालुः कपिलः कामी कामितार्थ प्रदायकः ॥ ॥ धर्मसेतुर्धर्मपालो धर्मी धर्ममयः परः
    । ज्वालाजिम्हः शिखामौलीः सुरकार्य प्रवर्तकः ॥ ॥ कलाधरः सुरारिघ्नः कोपहा कालरूपदृक् । दाताऽऽनन्दमयो
    दिव्यो ब्रह्मरूपी प्रकाशकृत् ॥ । सर्वयज्ञमयो यज्ञो यज्ञभुक् यज्ञभावनः । वह्निध्वजो वह्निसखो वञ्जुलद्रुम
    मूलकः ॥ ॥ दक्षहा दानकारी च नरो नारायणप्रियः । दैत्यदण्डधरो दान्तः शुभ्राङ्गः शुभदायकः ॥ ॥ लोहिताक्षो
    महारौद्रौ मायारूपधरः खगः । उन्नतो भानुजः साङ्गो महाचक्रः पराक्रमी ॥ ॥ अग्नीशोऽग्निमयः द्वग्निलोचनोग्नि
    समप्रभः । अग्निमानग्निरसनो युद्धसेवी रविप्रियः ॥ ॥ आश्रित घौघ विध्वंसी नित्यानन्द प्रदायकः । असुरघ्नो
    महाबाहूर्भीमकर्मा शुभप्रदः ॥ ॥ शशाङ्क प्रणवाधारः समस्थाशी विषापहः । तर्को वितर्को विमलो बिलको बादरायणः
    ॥ ॥ बदिरग्नस्चक्रवालः षट्कोणान्तर्गतस्शिखीः । दृतधन्वा शोडषाक्षो दीर्घबाहूर्दरीमुखः ॥ ॥ प्रसन्नो वामजनको
    निम्नो नीतिकरः शुचिः । नरभेदि सिंहरूपी पुराधीशः पुरन्दरः ॥ ॥ रविस्तुतो यूतपालो युतपारिस्सताङ्गतिः
    । हृषिकेशो द्वित्रमूर्तिः द्विरष्टायुदभृत् वरः ॥ ॥ दिवाकरो निशानाथो दिलीपार्चित विग्रहः । धन्वन्तरिस्श्यामलारिर्भक्तशोक
    विनाशकः ॥ ॥ रिपुप्राण हरो जेता शूरस्चातुर्य विग्रहः । विधाता सच्चिदानन्दस्सर्वदुष्ट निवारकः ॥ ॥ उल्को
    महोल्को रक्तोल्कस्सहस्रोल्कस्शतार्चिषः । बुद्धो बौद्धहरो बौद्ध जनमोहो बुधाश्रयः ॥ ॥ पूर्णबोधः पूर्णरूपः
    पूर्णकामो महाद्युतिः । पूर्णमन्त्रः पूर्णगात्रः पूर्णषाड्गुण्य विग्रहः ॥ ॥ पूर्णनेमिः पूर्ननाभिः पूर्णाशी
    पूर्णमानसः । पूर्णसारः पूर्णशक्तिः रङ्गसेवि रणप्रियः ॥ ॥ पूरिताशोऽरिष्टदाति पूर्णार्थः पूर्णभूषणः
    । पद्मगर्भः पारिजातः परमित्रस्शराकृतिः ॥ ॥ भूबृत्वपुः पुण्यमूर्ति भूभृतां पतिराशुकः । भाग्योदयो भक्तवश्यो
    गिरिजावल्लभप्रियः ॥ ॥ गविष्टो गजमानीशो गमनागमन प्रियः । ब्रह्मचारि बन्धुमानी सुप्रतीकस्सुविक्रमः ॥
    ॥ शङ्कराभीष्टदो भव्यः साचिव्यस्सव्यलक्षणः । महाहंसस्सुखकरो नाभाग तनयार्चितः ॥ ॥ कोटिसूर्यप्रभो दीप्तो
    विद्युत्कोटि समप्रभः । वज्रकल्पो वज्रसखो वज्रनिर्घात निस्वनः ॥ ॥ गिरीशो मानदो मान्यो नारायण करालयः
    । अनिरुद्धः परामर्षी उपेन्द्रः पूर्णविग्रहः ॥ ॥ आयुधेशस्शतारिघ्नः शमनः शतसैनिकः । सर्वासुर वधोद्युक्तः
    सूर्य दुर्मान भेदकः ॥ ॥ राहुविप्लोषकारी च काशीनगर दाहकः । पीयुषांशु परञ्ज्योतिः सम्पूर्ण क्रतुभुक्
    प्रभुः ॥ ॥ मान्धातृ वरदस्शुद्धो हरसेव्यस्शचीष्टदः । सहिष्णुर्बलभुक् वीरो लोकभृल्लोकनायकः ॥ ॥ दुर्वासोमुनि
    दर्पघ्नो जयतो विजयप्रियः । पुराधीशोऽसुरारातिः गोविन्द करभूषणः ॥ ॥ रथरूपी रथाधीशः कालचक्र कृपानिधिः
    । चक्ररूपधरो विष्णुः स्थूलसूक्ष्मश्शिखिप्रभः ॥ ॥ शरणागत सन्त्राता वेतालारिर्महाबलः । ज्ञानदो वाक्पतिर्मानी
    महावेगो महामणिः ॥ ॥ विद्युत् केशो विहारेशः पद्मयोनिः चतुर्भुजः । कामात्मा कामदः कामी कालनेमि शिरोहरः
    ॥ ॥ शुभ्रस्शुचीस्शुनासीरः शुक्रमित्रः शुभाननः । वृषकायो वृषारातिः वृषभेन्द्र सुपूजितः ॥ ॥ विश्वम्भरो
    वीतिहोत्रो वीर्यो विश्वजनप्रियः । विश्वकृत् विश्वभो विश्वहर्ता साहसकर्मकृत् ॥ ॥ बाणबाहूहरो ज्योतिः
    परात्मा शोकनाशनः । विमलादिपतिः पुण्यो ज्ञाता ज्ञेयः प्रकाशकः ॥ ॥ म्लेच्छ प्रहारी दुष्टघ्नः सूर्यमण्डलमध्यगः
    । दिगम्बरो वृशाद्रीशो विविधायुध रूपकः ॥ ॥ सत्ववान् सत्यवागीशः सत्यधर्म परायणः । रुद्रप्रीतिकरो रुद्र
    वरदो रुग्विभेदकः ॥ ॥ नारायणो नक्रभेदी गजेन्द्र परिमोक्षकः । धर्मप्रियः षडाधारो वेदात्मा गुणसागरः ॥
    ॥ गदामित्रः पृथुभुजो रसातल विभेदकः । तमोवैरी महातेजाः महाराजो महातपाः ॥ ॥ समस्तारिहरः शान्त क्रूरो
    योगेश्वरेश्वरः । स्थविरस्स्वर्ण वर्णाङ्गः शत्रुसैन्य विनाशकृत् ॥ ॥ प्राज्ञो विश्वतनुत्राता श ऋतिस्मृतिमयः
    कृति । व्यक्ताव्यक्त स्वरूपांसः कालचक्रः कलानिधिः ॥ ॥ महाध्युतिरमेयात्मा वज्रनेमिः प्रभानिधिः । महास्फुलिङ्ग
    धारार्चिः महायुद्ध कृतच्युतः ॥ ॥ कृतज्ञस्सहनो वाग्मी ज्वालामाला विभूषणः । चतुर्मुखनुतः श्रीमान् भ्राजिष्णुर्भक्तवत्सलः
    ॥ ॥ चातुर्यगमनश्चक्री चातुर्वर्ग प्रदायकः । विचित्रमाल्याभरणः तीक्ष्णधारः सुरार्चितः ॥ ॥ युगकृत् युगपालश्च
    युगसन्धिर्युगान्तकृत् । सुतीक्ष्णारगणो गम्यो बलिध्वंसी त्रिलोकपः ॥ ॥ त्रिनेत्रस्त्रिजगद्वन्ध्यः तृणीकृत
    महासुरः । त्रिकालज्ञस्त्रिलोकज्ञः त्रिनाभिः त्रिजगत्प्रियः ॥ ॥ सर्वयन्त्रमयो मन्त्रस्सर्वशत्रु निबर्हणः
    । सर्वगस्सर्ववित् सौम्यस्सर्वलोकहितङ्करः ॥ ॥ आदिमूलः सद्गुणाढ्यो वरेण्यस्त्रिगुणात्मकः । ध्यानगम्यः
    कल्मषघ्नः कलिगर्व प्रभेदकः ॥ ॥ कमनीय तनुत्राणः कुण्डली मण्डिताननः । सुकुण्ठीकृत चण्डेशः सुसन्त्रस्थ
    षडाननः ॥ ॥ विषाधीकृत विघ्नेशो विगतानन्द नन्दिकः । मथित प्रमथव्यूहः प्रणत प्रमदाधिपः ॥ ॥ प्राणभिक्षा
    प्रदोऽनन्तो लोकसाक्षी महास्वनः । मेधावी शाश्वथोऽक्रूरः क्रूरकर्माऽपराजितः ॥ ॥ अरी दृष्टोऽप्रमेयात्मा
    सुन्दरश्शत्रुतापनः । योग योगीश्वराधीशो भक्ताभीष्ट प्रपूरकः ॥ ॥ सर्वकामप्रदोऽचिन्त्यः शुभाङ्गः कुलवर्धनः
    । निर्विकारोऽन्तरूपो नरनारायणप्रियः ॥ ॥ मन्त्र यन्त्र स्वरूपात्मा परमन्त्र प्रभेदकः । भूतवेताल विध्वंसी
    चण्ड कूष्माण्ड खण्डनः ॥ ॥ यक्ष रक्षोगण ध्वंसी महाकृत्या प्रदाहकः । सकलीकृत मारीचः भैरव ग्रह भेदकः
    ॥ ॥ चूर्णिकृत महाभूतः कबलीकृत दुर्ग्रहः । सुदुर्ग्रहो जम्भभेदी सूचीमुख निषूदनः ॥ ॥ वृकोदरबलोद्धर्त्ता
    पुरन्दर बलानुगः । अप्रमेय बलः स्वामी भक्तप्रीति विवर्धनः ॥ ॥ महाभूतेश्वरश्शूरो नित्यस्शारदविग्रहः
    । धर्माध्यक्षो विधर्मघ्नः सुधर्मस्थापकश्शिवः ॥ ॥ विधूमज्वलनो भानुर्भानुमान् भास्वतां पतिः । जगन्मोहन
    पाटीरस्सर्वोपद्रव शोधकः ॥ ॥ कुलिशाभरणो ज्वालावृतस्सौभाग्य वर्धनः । ग्रहप्रध्वंसकः स्वात्मरक्षको धारणात्मकः
    ॥ ॥ सन्तापनो वज्रसारस्सुमेधाऽमृत सागरः । सन्तान पञ्जरो बाणताटङ्को वज्रमालिकः ॥ ॥ मेखालग्निशिखो वज्र
    पञ्जरस्ससुराङ्कुशः । सर्वरोग प्रशमनो गान्धर्व विशिखाकृतिः ॥ ॥ प्रमोह मण्डलो भूत ग्रह श ऋङ्खल कर्मकृत्
    । कलावृतो महाशङ्खु धारणस्शल्य चन्द्रिकः ॥ ॥ छेदनो धारकस्शल्य क्षूत्रोन्मूलन तत्परः । बन्धनावरणस्शल्य
    कृन्तनो वज्रकीलकः ॥ ॥ प्रतीकबन्धनो ज्वाला मण्डलस्शस्त्रधारणः । इन्द्राक्षीमालिकः कृत्या दण्डस्चित्तप्रभेदकः
    ॥ ॥ ग्रह वागुरिकस्सर्व बन्धनो वज्रभेदकः । लघुसन्तान सङ्कल्पो बद्धग्रह विमोचनः ॥ ॥ मौलिकाञ्चन सन्धाता
    विपक्ष मतभेदकः । दिग्बन्धन करस्सूची मुखाग्निस्चित्तपातकः ॥ ॥ चोराग्नि मण्डलाकारः परकङ्काल मर्दनः ।
    तान्त्रीकस्शत्रुवंशघ्नो नानानिगल मोचनः ॥ ॥ समस्थलोक सारङ्गः सुमहा विषदूषणः । सुमहा मेरुकोदण्डः सर्व
    वश्यकरेश्वरः ॥ ॥ निखिलाकर्षणपटुः सर्व सम्मोह कर्मकृत् । संस्थम्बन करः सर्व भूतोच्चाटन तत्परः ॥ ॥ अहितामय
    कारी च द्विषन्मारण कारकः । एकायन गदामित्र विद्वेषण परायणः ॥ ॥ सर्वार्थ सिद्धिदो दाता विधाता विश्वपालकः
    । विरूपाक्षो महावक्षाः वरिष्टो माधवप्रियः ॥ ॥ अमित्रकर्शन शान्तः प्रशान्तः प्रणतार्तिहा । रमणीयो रणोत्साहो
    रक्ताक्षो रणपण्डितः ॥ ॥ रणान्तकृत् रताकारः रताङ्गो रविपूजितः । वीरहा विविधाकारः वरुणाराधितो वशीः ।
    सर्व शत्रु वधाकाङ्क्षी शक्तिमान् भक्तमानदः ॥ ॥ सर्वलोकधरः पुण्यः पुरुषः पुरुषोत्तमः । पुराणः पुण्डरीकाक्षः
    परमर्म प्रभेदकः ॥ ॥ वीरासनगतो वर्मी सर्वाधारो निरङ्कुशः । जगत्रक्षो जगन्मूर्तिः जगदानन्द वर्धनः ॥
    ॥ शारदः शकटारातिः शङ्करस्शकटाकृतिः । विरक्तो रक्तवर्णाढ्यो रामसायक रूपदृत् ॥ ॥ महावराह् दंष्ट्रात्मा
    नृसिंह नगरात्मकः । समदृङ्मोक्षदो वन्ध्यो विहारी वीतकल्मषः ॥ ॥ गम्भीरो गर्भगो गोप्ता गभस्तिर्गुह्यगोगुरुः
    । श्रीधरः श्रीरतस्श्रान्तः शत्रुघ्नस्श ॥ पुराणो विततो वीरः पवित्रस्चरणाह्वयः । महाधीरो महावीर्यो महाबल
    पराक्रमः ॥ ॥ सुविग्रहो विग्रहघ्नः सुमानी मानदायकः । मायी मायापहो मन्त्री मान्यो मानविवर्धनः ॥ ॥ शत्रुसंहारकस्शूरः
    शुक्रारिश्शङ्करार्चितः । सर्वाधारः परञ्ज्योतिः प्राणः प्राणभृतच्युतः ॥ ॥ चन्द्रधामाऽप्रतिद्वन्दः परमात्मा
    सुदुर्गमः । विशुद्धात्मा महातेजाः पुण्यश्लोकः पुराणवित् ॥ ॥ समस्थ जगदाधारो विजेता विक्रमः क्रमः ।
    आदिदेवो ध्रुवो दृश्यः सात्त्विकः प्रीतिवर्धनः ॥ ॥ सर्वलोकाश्रयस्सेव्यः सर्वात्मा वंशवर्धनः । दुराधर्षः
    प्रकाशात्मा सर्वदृक् सर्ववित्समः ॥ ॥ सद्गतिस्सत्वसम्पन्नः नित्यसङ्कल्प कल्पकः । वर्णी वाचस्पतिर्वाग्मी
    महाशक्तिः कलानिधिः ॥ ॥ अन्तरिक्षगतिः कल्यः कलिकालुष्य मोचनः । सत्यधर्मः प्रसन्नात्मा प्रकृष्टो व्योमवाहनः
    ॥ ॥ शितधारस्शिखि रौद्रो भद्रो रुद्रसुपूजितः । दरिमुखाग्निजम्भघ्नो वीरहा वासवप्रियः ॥ ॥ दुस्तरस्सुदुरारोहो
    दुर्ज्ञेयो दुष्टनिग्रहः । भूतावासो भूतहन्ता भूतेशो भूतभावनः ॥ ॥ भावज्ञो भवरोगघ्नो मनोवेगी महाभुजः
    । सर्वदेवमयः कान्तः स्मृतिमान् सर्वपावनः ॥ ॥ नीतिमन् सर्वजित् सौम्यो महर्षीरपराजितः । रुद्राम्बरीष
    वरदो जितमायः पुरातनः ॥ ॥ अध्यात्म निलयो भोक्ता सम्पूर्णस्सर्वकामदः । सत्योऽक्षरो गभीरात्मा विश्वभर्ता
    मरीचिमान् ॥ ॥ निरञ्जनो जितभ्रांशुः अग्निगर्भोऽग्नि गोचरः । सर्वजित् सम्भवो विष्णुः पूज्यो मन्त्रवितक्रियः
    ॥ ॥ शतावर्त्तः कलानाथः कालः कालमयो हरिः । अरूपो रूपसम्पन्नो विश्वरूपो विरूपकृत् ॥ ॥ स्वाम्यात्मा समरश्लाघी
    सुव्रतो विजयांवितः । चण्ड्घ्नस्चण्डकिरणः चतुरस्चारणप्रियः ॥ ॥ पुण्यकीर्तिः परामर्षी नृसिंहो नाभिमध्यगः
    । यज्ञात्म यज्ञसङ्कल्पो यज्ञकेतुर्महेश्वरः ॥ ॥ जितारिर्यज्ञनिलयश्शरण्यश्शकटाकृतिः । उत्त्मोऽनुत्त्मोनङ्गस्साङ्गस्सर्वाङ्ग
    शोभनः ॥ ॥ कालाग्निः कालनेमिघ्नः कामि कारुण्यसागरः । रमानन्दकरो रामो रजनीशान्तरस्थितः ॥ ॥ संवर्धन समरांवेषी
    द्विषत्प्राण परिग्रहः । महाभिमानी सन्धाता सर्वाधीशो महागुरुः ॥ सिद्धः सर्वजगद्योनिः सिद्धार्थस्सर्वसिद्धिदः
    । चतुर्वेदमयश्शास्था सर्वशास्त्र विशारदः ॥ ॥ तिरस्कृतार्क तेजस्को भास्कराराधितश्शुभः । व्यापी विश्वम्भरो
    व्यग्रः स्वयञ्ज्योतिरनन्तकृत् ॥ ॥ जयशीलो जयाकाङ्क्षी जातवेदो जयप्रदः । कविः कल्याणदः काम्यो मोक्षदो
    मोहनाकृतिः ॥ ॥ कुङ्कुमारुण सर्वाङ्ग कमलाक्षः कवीश्वरः । सुविक्रमो निष्कलङ्को विश्वक्सेनो विहारकृत्
    ॥ ॥ कदम्बासुर विध्वंसी केतनग्रह दाहकः । जुगुप्साग्नस्तीक्ष्णधारो वैकुण्ठ भुजवासकृत् ॥ ॥ सारज्ञः करुणामूर्तिः
    वैष्णवो विष्णुभक्तिदः । सुक्रुतज्ञो महोदारो दुष्कृतघ्नस्सुविग्रहः ॥ ॥ सर्वाभीष्ट प्रदोऽन्तो नित्यानन्दो
    गुणाकरः । चक्री कुन्दधरः खड्गी परश्वत धरोऽग्निभृत् ॥ ॥ दृताङ्कुशो दण्डधरः शक्तिहस्थस्सुशङ्खभ्रुत्
    । धन्वी दृतमहापाशो हलि मुसलभूषणः ॥ ॥ गदायुधधरो वज्री महाशूल लसत्भुजः । समस्तायुध सम्पूर्णस्सुदर्शन
    महाप्रभुः ॥ ऋतिः ॥ इति सौदर्शनं दिव्यं गुह्यं नामसहस्रकम् । सर्वसिद्धिकरं सर्व यन्त्र मन्त्रात्मकं
    परम् ॥ ॥ एतन्नाम सहस्रं तु नित्यं यः पठेत् सुधीः । श ऋणोति वा श्रावयति तस्य सिद्धिः करस्तिता ॥ ॥ दैत्यानां
    देवशत्रूणां दुर्जयानां महौजसाम् । विनाशार्थमिदं देवि हरो रासाधितं मया ॥ ॥ शत्रुसंहारकमिदं सर्वदा जयवर्धनम्
    । जल शैल महारण्य दुर्गमेषु महापति ॥ ॥ भयङ्करेषु शापत्सु सम्प्राप्तेषु महत्सुच । यस्सकृत् पठनं कुर्यात्
    तस्य नैव भवेत् भयम् ॥ ॥ ब्रह्मघ्नश्च पशुघ्नश्च मातापितॄ विनिन्दकः । देवानां दूषकश्चापि गुरुतल्पगतोऽपि
    वा ॥ ॥ जप्त्वा सकृतिदं स्तोत्रं मुच्यते सर्वकिल्बिषैः । तिष्ठन् गच्छन् स्वपन् भुञ्जन् जाग्रन्नपि हसन्नपि
    ॥ ॥ सुदर्शन नृसिंहेति यो वदेत्तु सकृन्नरः । स वै न लिप्यते पापैः भुक्तिं मुक्तिं च विन्दति ॥ ॥ आदयो
    व्यादयस्सर्वे रोगा रोगादिदेवताः । शीघ्रं नश्यन्ति ते सर्वे पठनात्तस्य वै नृणाम् ॥ ॥ बहूनात्र किमुक्तेन
    जप्त्वेदं मन्त्र पुष्कलम् । यत्र मर्त्यश्चरेत् तत्र रक्षति श्रीसुदर्शनः ॥ ॥ इति श्री विहगेश्वर उत्तरखण्डे
    उमामहेश्वरसंवादे मन्त्रविधाने श्री सुदर्शन सहस्रनाम स्तोत्रं नाम षोडश प्रकाशः ॥
