id: kamadhenu-stotram
category: stotram
name:
  english: Kamadhenu Stotram
content:
  english: namo devyai maha devyai surabhayaica namo namah gavambija svarupaya namaste jagadambike ||
    namo radha priyayaica padmamshayai namo namah namah krishna priyayai ca gavam matre namo namah ||
    kalpavriksha svarupayai padmakshe sarva sampadam shri dayè dhana dhayai ca budddhi dayai namo namah
    || shubha dayai prasannayai gopradayai namo namah yashodayai saukyadayai darmajnayai namo namah ||
    idha stotram maha punyambhakta yuktasca yah patet sagoman dhanavamshcaiva kirtiman punya van bhavet
    || nusnatah sarva tirdhe shu sarva yagnetu dikshitah iha loke sukham cuk tva yam thyantekrishna mandiram
    || suciram savase ttatra kurute krishna sevanam napunarca vanantasya brahmaputra bhave bhavet ||
  devanagari: नमो देव्यै महा देव्यै सुराभयैच नमो नमः गवाम्बीज स्वरूपाय नमस्ते जगदम्बिके ॥ नमो राध प्रिययैच
    पद्मांशायै नमो नमः नमः कृष्ण प्रियायै च गवां मात्रे नमो नमः ॥ कल्पवृक्ष स्वरूपायै पाद्माक्षे सर्व
    सम्पदाम् श्री दायॆ धन धायै च बुद्द्धि दायै नमो नमः ॥ शुभ दायै प्रसन्नयै गोप्रदयै नमो नमः यशोदायै सौक्यदायै
    दर्मज्ञायै नमो नमः ॥ इध स्तोत्रं महा पुण्यम्भक्त युक्तस्च यः पटेत् सागोमान् धनवांश्चैव कीर्तिमान्
    पुण्य वान् भवेत् ॥ नुस्नातः सर्व तीर्धे षु सर्व यग्नेतु दीक्षितः इह लोके सुखं चुक् त्वा यां थ्यन्तेकृष्ण
    मन्दिरम् ॥ सुचिरं सवसे त्तत्र कुरुते कृष्ण सेवनं नपुनर्च वनन्तस्य ब्रह्मपुत्र भवे भवेत् ॥
