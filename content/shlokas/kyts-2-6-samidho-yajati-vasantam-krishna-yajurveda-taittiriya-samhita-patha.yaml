    रज॒स्या निष॑त्ता॒ ये वा॑ नू॒नग्ं सु॑वृ॒जना॑सु वि॒क्षु ॥ अधा॒ यथा॑ नः पि॒तरः॒ परा॑सः प्र॒त्नासो॑ अग्न
    ऋ॒तमा॑शुषा॒णाः । शुचीद॑य॒ न्दीधि॑ति मुक्थ॒शासः॒ क्षामा॑ भि॒न्दन्तो॑ अरु॒णीरप॑ व्रन्न् ॥ यद॑ग्ने क॒व्य॒वा॒ह॒न॒
    पि॒तॄन् यक्ष्यृ॑ता॒वृधः॑ । प्र च॑ ह॒व्यानि॑ वक्ष्यसि दे॒वेभ्य॑श्च पि॒तृभ्य॒ आ ॥ त्वम॑ग्न ईडि॒तो जा॑तवे॒दो
    ड्ढ॒व्यानि॑ सुर॒भीणि॑ कृ॒त्वा । प्रादाः पि॒तृभ्यः॑ स्व॒धया॒ ते अ॑क्षन्न॒द्धि त्व न्दे॑व॒ प्रय॑ता ह॒वीग्ंषि॑
    ॥ मात॑ली क॒व्यैर्य॒मो अङ्गि॑रोभि॒ र्बृह॒स्पति॒र्॒ ऋक्व॑भि र्वावृधा॒नः । याग् श्च॑ दे॒वा वा॑वृ॒धुर्ये
    च॑ दे॒वान् यँ॑म प्रस्त॒रमाहि सीदाङ्गि॑रोभिः पि॒तृभिः॑ सं विँदा॒नः । आत्वा॒ मन्त्राः कविश॒स्ता व॑हन्त्वे॒ना
    रा॑जन् ह॒विषा॑ मादयस्व ॥ अङ्गि॑रोभि॒रा ग॑हि य॒ज्ञिये॑भि॒र्यम॑ वैरू॒पैरि॒ह मा॑दयस्व । विव॑स्वन्तग्ं
    हुवे॒ यः पि॒ता ते॒ य॒ज्ञे ब॒र्॒हिष्या नि॒षद्य॑ ॥ अङ्गि॑रसो नः पि॒तरो॒ नव॑ग्वा॒ अथ॑र्वाणो॒ भृग॑व स्सो॒म्यासः॑
    । तेषां वँ॒यग्ं सु॑म॒तौ य॒ज्ञिया॑ना॒मपि॑ भ॒द्रे सौ॑मन॒से स्या॑म ॥ ब्र॑ह्मवा॒दिनो॒ ऽद्भि ॥ हरिः॑ ओम्
    ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे षष्टः प्रश्न
