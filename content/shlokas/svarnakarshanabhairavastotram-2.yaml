id: svarnakarshanabhairavastotram-2
category: stotram
name:
  english: svarnakarshanabhairavastotram 2
  devanagari: स्वर्णाकर्षणभैरवस्तोत्रम् २
content:
  english: svarnakarshanabhairavastotram kalpante shamitatrivikramamahakankalabaddhasphurat sheshasyutanrisimhapaninakhara
    protadi kolamishah | vishvaikarnavataviharamuditau yau matsyakurmavubhau karshandhivaratam gato'syatu
    sa no moham mahabhairavah || 1|| nilaruci vedakaravahni nayanam sat shulakakapaladamarum ca sahapasham
    | nagnashunavahanasakinkinivibhusham proccagati keshadharasarpavaraharam || 2|| pashcimabhimukham
    raudram kshetrapalam samarcayet | bhairavam bhairaviyuktam anyaishca nijakinkaraih || 3|| kalpavrikshasya
    mule tu ratnamantapamadhyame | manisimhasanasinam nanabharanabhushitam || 4|| tarunadityasankasham
    raktamalyambarojjvalam | udyatpingajatabaddha carucandrakaladharam || 5|| kamalam svarnapatram ca
    varam cabhayameva ca | shankham piyushakumbham ca bibhranam karapankajaih || 6|| devya campakavarnangya
    samalingitavigraham | svapadapadmabhaktanam varshantam svarnadharaya || 7|| karunasagaram devam svarnakarshanabhairavam
    | siddhavidyadharairnityam stuyamanam samashraye || 8|| svarnapradah svarnavarshi svarnakarshanabhairavah
    | bhaktapriyo bhaktavashyo bhaktabhishtaphalapradah || 9|| siddhidah karunamurtih pranatabhishtapurakah
    | nidhisiddhipradah svarnasiddhido rasasiddhidah || 10|| etaih padaih shubhairdivyairyo'rcayetsvarnabhairavam
    | svarnasiddhimavaproti bhairavasya prasadatah || 11|| gangeyapatram damarum trishulam pasham karaih
    sandadhatam trinetram | devya yutam shvanavarashritam tam svarnabhidham bhairavamashraye'ham || 12||
    brahma yasya manormunih nigaditastrishthup ca chandah svayam svarnakarshanabhairavo harihara brahmatmako
    devata | am bijam saha shaktirityabhihitastasyaiva sutratmanah stotradhyanapurassaram manuvaram vakshyami
    sampratyaham || 13|| mandaradrumamulabhaji mahite manikyasimhasane divye ratnamaye sucampakaruca devya
    samalingitah | bhaktebhyo vararatnapatrabharitam svarnam dadhano'nisham svarnakarshana bhairavo vijayate
    svargapavargaikabhuh || 14|| om aim klam klim klum iti vyaharadbhyo bhiksham haimim yah svayam samprayacchan
    | karunyabdhih kalpamuladhivasah svarnakarsho bhairavo no'stu bhutyai || 15|| om hram hrim hum ityanvaham
    japakanam varshantam drak svarnavrishtim samagram | nityam svaccham suryakotiprakasham svarnakarsham
    bhairavam bhavayami || 16|| marakatamanipatre sambhritam svarnapuram svamanumananakridbhyah sadaram
    sampradatre | kuru hridaya saparya sevyamanaya nityam suravarabhujagendrairapaduddharanaya || 17||
    namo'jamalabaddhaya kalpamulanivasine | svarnakarshanashilaya sadhakanam hitatmane || 18|| lokeshvarayamburuhasanadyaih
    barhirmukhairarcitapadukaya | daridryanirmulanakarmathaya karunyavaram nidhaye namaste || 19|| dinanathavipannarakshanaratairajnapratikshakaraih
    siddhaih sadhyanrikinnaroragasuraih nityam paritatmane | sanandaya samullasadvaramanipradyotatejojushe
    svarnakarshanabhairavaya satatam kurmo namasyam vayam || 20|| svarnakarshinya svadevya''shritaya svairaravodarasimhasanaya
    | kurmo nityam sharmadatre namasyam maddaridrya dveshine bhairavaya || 21|| svarnapradanadhvaradikshitaya
    svatejasakrantadigantaraya | saubhagyasampatsadanaya nityam shrim hrim mahabhairava te namo'stu ||
    22|| cintamani svajanakalpitaparijata
  devanagari: स्वर्णाकर्षणभैरवस्तोत्रम् कल्पान्ते शमितत्रिविक्रममहाकङ्कालबद्धस्फुरत् शेषस्यूतनृसिंहपाणिनखर
    प्रोतादि कोलामिषः । विश्वैकार्णवताविहारमुदितौ यौ मत्स्यकूर्मावुभौ कर्षन्धीवरतां गतोऽस्यतु स नो मोहं
    महाभैरवः ॥ १॥ नीलरुचि वेदकरवह्नि नयनं सत् शूलककपालडमरुं च सहपाशम् । नग्नशुनवाहनसकिङ्किणिविभूषं प्रोच्चगति
    केशधरसर्पवरहारम् ॥ २॥ पश्चिमाभिमुखं रौद्रं क्षेत्रपालं समर्चयेत् । भैरवं भैरवीयुक्तं अन्यैश्च निजकिङ्करैः
    ॥ ३॥ कल्पवृक्षस्य मूले तु रत्नमण्टपमध्यमे । मणिसिंहासनासीनं नानाभरणभूषितम् ॥ ४॥ तरुणादित्यसङ्काशं
    रक्तमाल्याम्बरोज्ज्वलम् । उद्यत्पिङ्गजटाबद्ध चारुचन्द्रकलाधरम् ॥ ५॥ कमलं स्वर्णपात्रं च वरं चाभयमेव
    च । शङ्खं पीयूषकुम्भं च बिभ्राणं करपङ्कजैः ॥ ६॥ देव्या चम्पकवर्णाङ्ग्या समालिङ्गितविग्रहम् । स्वपादपद्मभक्तानां
    वर्षन्तं स्वर्णधारया ॥ ७॥ करुणासागरं देवं स्वर्णाकर्षणभैरवम् । सिद्धविद्याधरैर्नित्यं स्तूयमानं समाश्रये
    ॥ ८॥ स्वर्णप्रदः स्वर्णवर्षी स्वर्णाकर्षणभैरवः । भक्तप्रियो भक्तवश्यो भक्ताभीष्टफलप्रदः ॥ ९॥ सिद्धिदः
    करुणामूर्तिः प्रणताभीष्टपूरकः । निधिसिद्धिप्रदः स्वर्णसिद्धिदो रससिद्धिदः ॥ १०॥ एतैः पदैः शुभैर्दिव्यैर्योऽर्चयेत्स्वर्णभैरवम्
    । स्वर्णसिद्धिमवाप्रोति भैरवस्य प्रसादतः ॥ ११॥ गाङ्गेयपात्रं डमरुं त्रिशूलं पाशं करैः सन्दधतं त्रिणेत्रम्
    । देव्या युतं श्वानवराश्रितं तं स्वर्णाभिधं भैरवमाश्रयेऽहम् ॥ १२॥ ब्रह्मा यस्य मनोर्मुनिः निगदितस्त्रिष्ठुप्
    च छन्दः स्वयं स्वर्णाकर्षणभैरवो हरिहर ब्रह्मात्मको देवता । आं बीजं सह शक्तिरित्यभिहितस्तस्यैव सूत्रात्मनः
    स्तोत्रध्यानपुरस्सरं मनुवरं वक्ष्यामि सम्प्रत्यहम् ॥ १३॥ मन्दारद्रुममूलभाजि महिते माणिक्यसिंहासने
    दिव्ये रत्नमये सुचम्पकरुचा देव्या समालिङ्गितः । भक्तेभ्यो वररत्नपात्रभरितं स्वर्णं दधानोऽनिशं स्वर्णाकर्षण
    भैरवो विजयते स्वर्गापवर्गैकभूः ॥ १४॥ ॐ ऐं क्लां क्लीं क्लूं इति व्याहरद्भ्यो भिक्षां हैमीं यः स्वयं
    सम्प्रयच्छन् । कारुण्याब्धिः कल्पमूलाधिवासः स्वर्णाकर्षो भैरवो नोऽस्तु भूत्यै ॥ १५॥ ॐ ह्रां ह्रीं
    हूं इत्यन्वहं जापकानां वर्षन्तं द्राक् स्वर्णवृष्टिं समग्राम् । नित्यं स्वच्छं सूर्यकोटिप्रकाशं स्वर्णाकर्षं
    भैरवं भावयामि ॥ १६॥ मरकतमणिपात्रे सम्भृतं स्वर्णपूरं स्वमनुमननकृद्भ्यः सादरं सम्प्रदात्रे । कुरु हृदय
    सपर्या सेव्यमानाय नित्यं सुरवरभुजगेन्द्रैरापदुद्धारणाय ॥ १७॥ नमोऽजामलबद्धाय कल्पमूलनिवासिने । स्वर्णाकर्षणशीलाय
    साधकानां हितात्मने ॥ १८॥ लोकेश्वरायाम्बुरुहासनाद्यैः बर्हिर्मुखैरर्चितपादुकाय । दारिद्र्यनिर्मूलनकर्मठाय
    कारुण्यवारां निधये नमस्ते ॥ १९॥ दीनानाथविपन्नरक्षणरतैराज्ञाप्रतीक्षाकरैः सिद्धैः साध्यनृकिन्नरोरगसुरैः
    नित्यं परीतात्मने । सानन्दाय समुल्लसद्वरमणिप्रद्योततेजोजुषे स्वर्णाकर्षणभैरवाय सततं कुर्मो नमस्यां
    वयम् ॥ २०॥ स्वर्णाकर्षिण्या स्वदेव्याऽऽश्रिताय स्वैरारावोदारसिंहासनाय । कुर्मो नित्यं शर्मदात्रे नमस्यां
    मद्दारिद्र्य द्वेषिणे भैरवाय ॥ २१॥ स्वर्णप्रदानाध्वरदीक्षिताय स्वतेजसाक्रान्तदिगन्तराय । सौभाग्यसम्पत्सदनाय
    नित्यं श्रीं ह्रीं महाभैरव ते नमोऽस्तु ॥ २२॥ चिन्तामणि स्वजनकल्पितपारिजात
