id: annamayya-keerthanas-chakkani-talliki
category: stotram
name:
  english: Annamayya Keerthanas Chakkani Talliki
content:
  english: adi pallavi cakkani talliki cangubhala tana cakkèra moviki cangubhala || kulikèdi muripèpu
    kummarimpu tana salupu jupulaku cangubhala | palukula sòmpula batito gasarèdi calamula yalukaku cangubhala
    || cakkani talliki cangubhala kinnèrato pati kèlana nilucu tana cannu mèṟugulaku cangubhala | unnati
    batipai nòragi nilucu tana sannapu nadimiki cangubhala || cakkani talliki cangubhala jandèpu mutyapu
    sarulaharamula candana gandhiki cangubhala | vindayi vènkata vibhubèna cinatana sandi dandalaku cangubhala
    || ksh cakkani talliki cangubhala
  devanagari: आदि पल्लवि चक्कनि तल्लिकि चाङ्गुभला तन चक्कॆर मोविकि चाङ्गुभला ॥ कुलिकॆडि मुरिपॆपु कुम्मरिम्पु
    तन सलुपु जूपुलकु चाङ्गुभला । पलुकुल सॊम्पुल बतितो गसरॆडि चलमुल यलुककु चाङ्गुभला ॥ चक्कनि तल्लिकि चाङ्गुभला
    किन्नॆरतो पति कॆलन निलुचु तन चन्नु मॆऱुगुलकु चाङ्गुभला । उन्नति बतिपै नॊरगि निलुचु तन सन्नपु नडिमिकि
    चाङ्गुभला ॥ चक्कनि तल्लिकि चाङ्गुभला जन्दॆपु मुत्यपु सरुलहारमुल चन्दन गन्धिकि चाङ्गुभला । विन्दयि
    वॆङ्कट विभुबॆन चिनतन सन्दि दण्डलकु चाङ्गुभला ॥ क्ष् चक्कनि तल्लिकि चाङ्गुभला
