id: shiva-kavacham
category: stotram
name:
  english: Shiva Kavacham
content:
  english: atha shivakacam asya shri shivakavaca stotra mahamantrasya | rishabha yogishvara rishih | anushtup
    chandah | shri sambasadashivo devata | om bijam | namah shaktih | shivayeti kilakam | sambasadashivaprityarthe
    jape viniyogah || karanyasah om sadashivaya angushthabhyam namah | nam gangadharaya tarjanibhyam namah
    | mam mrityunjayaya madhyamabhyam namah | shim shulapanaye anamikabhyam namah | vam pinakapanaye kanishthikabhyam
    namah | yam umapataye karatalakaraprishthabhyam namah | hridayadi anganyasah om sadashivaya hridayaya
    namah | nam gangadharaya shirase svaha | mam mrityunjayaya shikhayai vashat | shim shulapanaye kavacaya
    hum | vam pinakapanaye netratrayaya vaushat | yam umapataye astraya phat | bhurbhuvassuvaromiti digbandhah
    || dhyanam vajradamshtram trinayanam kalakantha marindamam | sahasrakara matyugram vande shambhum
    umapatim || rudraksha dandayugmah palantara tripundrah | pancaksharam paripathan varamantrarajam dhyayan
    sada pashupatim sharanam vrajethah || atah param sarvapurana papaughaharam pavitram | jayapradam sarva
    vipatpramocanam vakshyami shaivam kavacam hitaya te || pancapuja lam prithivyatmane gandham samarpayami
    | ham akashatmane pushpaih pujayami | yam vayvatmane dhupam aghrapayami | ram agnyatmane dipam darshayami
    | vam amritatmane amritam maha naivedyam nivedayami | sam sarvatmane sarvopacara pujam samarpayami
    || mantrah rishabha uvaca | namaskritya mahadevam vishva mishvaram | vakshye shivamayam varma sarvarakshakaram
    nrinam || || shucau deshe samasino yathavatkalpitasanah | jitendriyo jitaprana shcintayecchivamavyayam
    || || hritpundarikantarasannivishtam svatejasa vyapta nabho'vakasham | atindriyam sukshmamanantamadyam
    dhyayetparanandamayam mahesham || || dhyanavadhutakhilakarmabandha shciram cidanandanimagnacetah |
    shadaksharanyasasamahitatma shaivena kuryatkavacena raksham || || mam patu devo'khiladevatatma samsarakupe
    patitam gabhire | tannama divyam varamantramulam dhunotu me sarvamagham hridistham || || sarvatra
    mam rakshatu vishvamurti rmayanandaghanashcidatma | anoraniyanurushaktirekah sa ishvarah patu bhayadasheshat
    || || yo bhusvarupena bibharti vishvam payatsa bhumergirisho'shtamurtih | yo'pam svarupena nrinam
    karoti sanjivanam so'vatu mam jalebhyah || || kalpavasane bhuvanani dagdhva sarvani yo nrityati bhurililah
    | sa kalarudro'vatu mam davagne vidyutkanakavabhaso vidyavarabhiti kutharapanih | caturmukhastatpurushastrinetrah
    pracyam sthito rakshatu mamajasram || || kuthara khetankushapashashula kapalapashaksha gunandadhanah
    | caturmukho nila rucistrinetrah payadaghoro dishi dakshinasyam || sphatikavabhaso vedakshamala varadabhayankah
    | tryakshashcaturvaktra uruprabhavah sadyo'dhijato'vatu mam praticyam || kinjalkasamanavarnah | trilocana
    shcarucaturmukho mam payadudicyam dishi vamadevah || || vedabhayeshtankushatankapasha shulapanih |
    sitadyutih pancamukho'vatanma mishana urdhvam paramaprakashah || || murdhanamavyanmama candramaulih
    phalam mamavyadatha phalanetrah | netre mamavyadbhaganetrahari nasam sada rakshatu vishvanathah ||
    || payacchruti me shrutigitakirtih kapolamavyatsatatam kapali | vaktram sada rakshatu pancavaktro
    jihvam sada rakshatu vedajihvah || || kantham girisho'vatu nilakanthah panidvayam patu pinakapanih
    | dormulamavyanmama dharmabahuh vakshahsthalam dakshamakhantako'vyat || || mamodaram patu girindradhanva
    madhyam mamavyanmadanantakari | herambatato mama patu nabhim payatkatim dhurjatirishvaro me || ravyanmama
    guhyadesham prishtam sada rakshatu parvatishah | urudvayam patu kuberamitro janudvayam me jagadishvaro'vyat
    | janghayugam pungavaketuravya tpadau mamavyatsuravandyapadah || || maheshvarah patu dinadiyame mam
    madhyayame'vatu vamadevah | trilocanah patu tritiyayame vrishadhvajah patu dinantyayame || || payannishadau
    shashishekharo mam gangadharo rakshatu mam nishithe | gauripatih patu nishavasane mrityunjayo rakshatu
    sarvakalam || || antahsthitam rakshatu shankaro mam sthanuh sada patu bahihsthitam mam | tadantare
    patu patih pashunam sadashivo rakshatu mam samantat || mavyadbhuvanaikanathah payadvrajantam pramathadhinathah
    | vedantavedyo'vatu mam nishannam mamavyayah patu shivah shayanam || || margeshu mam rakshatu nilakanthah
    shailadi durgeshu puratrayarih | aranyavasadi mahapravase payanmrigavyadha udarashaktih || mahabhayadrakshatu
    virabhadrah || kotibhishanam | akshauhininam shatamatatayinam chindyanmrido ghorakutharadharaya ||
    || nihantu dasyunpralayanalarci rjvalattrishulam tripurantakasya | shardula himsran santrasayatvisha
    || dussvapna dushshakuna durgati daurmanasya durbhiksha durvyasana dussaha duryashamsi | utpata masadgrahartim
    vyadhimshca nashayatu me jagatamadhishah || || om namo bhagavate sadashivaya sakala yantradhishthitaya
    sarva raudravataraya dakshadhvara nilayaya tatvatitaya gangadharaya sarva devaya shadashrayaya vedanta
    kulabhushanaya pranavasvarupaya cidakashaya akasha nijavasaya nirakaraya nirabhasaya niramayaya nirmalaya
    nirlobhaya nirmadaya nishcintaya nirahankaraya nirankushaya nishkalankaya nirgunaya nishkamaya nirupaplavaya
    niravadhyaya nirantaraya nirupadravaya niravadyaya nirantaraya nishkaranaya niratankaya nishprapancaya
    nissangaya nirdvandvaya niradharaya niragaya nishkrodhaya nirlobhaya nishpapaya nirvikalpaya nirbhedaya
    nishkriyaya nistulaya nishshamshayaya niranjanaya nirupama saccidanandadvayaya parama prakashaya tejorupaya
    tejomayaya tejo'dhipataye jaya jaya rudra maharudra maha vadana vikatattahasa visphatita nagendrakundala
    nagendrahara nagendravalaya nagendracarmadhara nagendraniketana mrityunjaya tryambaka tripurantaka
    vishvarupa virupaksha vishveshvara vrishabhavahana vishavibhushana vishvatomukha sarvatomukha mam
    raksha raksha jvala jvala prajvala prajvala mahamrityubhayam shamaya shamaya apamrityubhayam nashaya
    nashaya rogabhayam utsadaya utsadaya vishasarpabhayam shamaya shamaya coran maraya maraya mama shatrun
    uccataya uccataya trishulena vidaraya vidaraya kutharena bhindhi bhindhi khadgena chinddi chinddi
    khatvangena vipodhaya vipodhaya mama papam shodhaya shodhaya musalena nishpeshaya nishpeshaya banaih
    santadaya santadaya yaksha rakshamsi bhishaya bhishaya ashesha bhutan vidravaya vidravaya kushmanda
    ganan santrasaya santrasaya mama abhayam kuru kuru mahabhayan mam uddhara uddhara vitrastam mam ashvasaya
    ashvasaya amrita vikshanena mam alokaya alokaya sanjivaya sanjivaya kshuttrishnartam mam apyayaya
    apyayaya duhkhaturam mam anandaya anandaya shivakavacena mam acchadaya acchadaya hara hara hara hara
    mrityunjaya tryambaka sadashiva paramashiva namaste namaste namaste namah || purvavat hridayadi nyasah
    | pancapuja || bhurbhuvassuvaromiti digvimokah || phalashrutih rishabha uvaca | ityetatkavacam shaivam
    varadam vyahritam maya | sarva prashamanam rahasyam sarvadehinam || || yah sada dharayenmartyah shaivam
    kavacamuttamam | na tasya jayate kvapi bhayam shambhoranugrahat || rmrityumapanno maharogahato'pi
    va | sadyah sukhamavapnoti dirghamayushca vindati || || sarvadaridryashamanam saumangalya vivardhanam
    | yo dhatte kavacam shaivam sa devairapi pujyate || sanghatairmucyate copapatakaih | dehante shivamapnoti
    shiva || tvamapi shraddhaya vatsa shaivam kavacamuttamam | dharayasva maya dattam sadyah shreyo hyavapsyasi
    || || suta uvaca | ityuktva rishabho yogi tasmai parthiva sunave | dadau shankham maharavam khadgam
    carinishudanam || || punashca bhasma sammantrya tadangam sarvato'sprishat | gajanam shatsahasrasya
    dvigunam ca balam dadau || || bhasmaprabhavatsamprapya balaishvaryadhritismritih | sa rajaputrah shushubhe
    sharadarka iva shriya || || tamaha pranjalim bhuyah sa yogi rajanandanam | esha khadgo maya dattastapomantranubhavatah
    || || shitadharamimam khadgam yasmai darshayasi sphutam | sa sadyo mriyate shatruh sakshanmrityurapi
    svayam || || asya shankhasya nihradam ye shrinvanti tavahitah | te murchitah patishyanti nyastashastra
    vicetanah || || khadgashankhavimau divyau parasainyavinashinau | atmasainyasvapakshanam shauryatejovivardhanau
    || || etayoshca prabhavena shaivena kavacena ca | dvishatsahasranaganam balena mahatapi ca || || bhasmadharanasamarthyacchatrusainyam
    vijeshyasi | prapya simhasanam paitryam goptasi prithivimimam || || iti bhadrayusham samyaganushasya
    samatrikam | tabhyam sampujitah so'tha yogi svairagatiryayau || || iti shriskandamahapurane brahmottarakhande
    shivakavaca prabhava varnanam nama dvadasho'dhyayah sampurnah ||
  devanagari: अथ शिवकचम् अस्य श्री शिवकवच स्तोत्र महामन्त्रस्य । ऋषभ योगीश्वर ऋषिः । अनुष्टुप् छन्दः ।
    श्री साम्बसदाशिवो देवता । ॐ बीजम् । नमः शक्तिः । शिवायेति कीलकम् । साम्बसदाशिवप्रीत्यर्थे जपे विनियोगः
    ॥ करन्यासः ॐ सदाशिवाय अङ्गुष्ठाभ्यां नमः । नं गङ्गाधराय तर्जनीभ्यां नमः । मं मृत्युञ्जयाय मध्यमाभ्यां
    नमः । शिं शूलपाणये अनामिकाभ्यां नमः । वां पिनाकपाणये कनिष्ठिकाभ्यां नमः । यं उमापतये करतलकरपृष्ठाभ्यां
    नमः । हृदयादि अङ्गन्यासः ॐ सदाशिवाय हृदयाय नमः । नं गङ्गाधराय शिरसे स्वाहा । मं मृत्युञ्जयाय शिखायै
    वषट् । शिं शूलपाणये कवचाय हुम् । वां पिनाकपाणये नेत्रत्रयाय वौषट् । यं उमापतये अस्त्राय फट् । भूर्भुवस्सुवरोमिति
    दिग्बन्धः ॥ ध्यानम् वज्रदंष्ट्रं त्रिनयनं कालकण्ठ मरिन्दमम् । सहस्रकर मत्युग्रं वन्दे शम्भुं उमापतिम्
    ॥ रुद्राक्ष दण्डयुग्मः पालान्तरा त्रिपुण्ड्रः । पञ्चाक्षरं परिपठन् वरमन्त्रराजं ध्यायन् सदा पशुपतिं
    शरणं व्रजेथाः ॥ अतः परं सर्वपुराण पापौघहरं पवित्रम् । जयप्रदं सर्व विपत्प्रमोचनं वक्ष्यामि शैवं कवचं
    हिताय ते ॥ पञ्चपूजा लं पृथिव्यात्मने गन्धं समर्पयामि । हं आकाशात्मने पुष्पैः पूजयामि । यं वाय्वात्मने
    धूपं आघ्रापयामि । रं अग्न्यात्मने दीपं दर्शयामि । वं अमृतात्मने अमृतं महा नैवेद्यं निवेदयामि । सं
    सर्वात्मने सर्वोपचार पूजां समर्पयामि ॥ मन्त्रः ऋषभ उवाच । नमस्कृत्य महादेवं विश्व मीश्वरम् । वक्ष्ये
    शिवमयं वर्म सर्वरक्षाकरं नृणाम् ॥ ॥ शुचौ देशे समासीनो यथावत्कल्पितासनः । जितेन्द्रियो जितप्राण श्चिन्तयेच्छिवमव्ययम्
    ॥ ॥ हृत्पुण्डरीकान्तरसन्निविष्टं स्वतेजसा व्याप्त नभोऽवकाशम् । अतीन्द्रियं सूक्ष्ममनन्तमाद्यं ध्यायेत्परानन्दमयं
    महेशम् ॥ ॥ ध्यानावधूताखिलकर्मबन्ध श्चिरं चिदानन्दनिमग्नचेताः । षडक्षरन्याससमाहितात्मा शैवेन कुर्यात्कवचेन
    रक्षाम् ॥ ॥ मां पातु देवोऽखिलदेवतात्मा संसारकूपे पतितं गभीरे । तन्नाम दिव्यं वरमन्त्रमूलं धुनोतु मे
    सर्वमघं हृदिस्थम् ॥ ॥ सर्वत्र मां रक्षतु विश्वमूर्ति र्मयानन्दघनश्चिदात्मा । अणोरणीयानुरुशक्तिरेकः
    स ईश्वरः पातु भयादशेषात् ॥ ॥ यो भूस्वरूपेण बिभर्ति विश्वं पायात्स भूमेर्गिरिशोऽष्टमूर्तिः । योऽपां
    स्वरूपेण नृणां करोति सञ्जीवनं सोऽवतु मां जलेभ्यः ॥ ॥ कल्पावसाने भुवनानि दग्ध्वा सर्वाणि यो नृत्यति
    भूरिलीलः । स कालरुद्रोऽवतु मां दवाग्ने विद्युत्कनकावभासो विद्यावराभीति कुठारपाणिः । चतुर्मुखस्तत्पुरुषस्त्रिनेत्रः
    प्राच्यां स्थितो रक्षतु मामजस्रम् ॥ ॥ कुठार खेटाङ्कुशपाशशूल कपालपाशाक्ष गुणान्दधानः । चतुर्मुखो नील
    रुचिस्त्रिनेत्रः पायादघोरो दिशि दक्षिणस्याम् ॥ स्फटिकावभासो वेदाक्षमाला वरदाभयाङ्कः । त्र्यक्षश्चतुर्वक्त्र
    उरुप्रभावः सद्योऽधिजातोऽवतु मां प्रतीच्याम् ॥ किञ्जल्कसमानवर्णः । त्रिलोचन श्चारुचतुर्मुखो मां पायादुदीच्यां
    दिशि वामदेवः ॥ ॥ वेदाभयेष्टाङ्कुशटङ्कपाश शूलपाणिः । सितद्युतिः पञ्चमुखोऽवतान्मा मीशान ऊर्ध्वं परमप्रकाशः
    ॥ ॥ मूर्धानमव्यान्मम चन्द्रमौलिः फालं ममाव्यादथ फालनेत्रः । नेत्रे ममाव्याद्भगनेत्रहारी नासां सदा
    रक्षतु विश्वनाथः ॥ ॥ पायाच्छ्रुती मे श्रुतिगीतकीर्तिः कपोलमव्यात्सततं कपाली । वक्त्रं सदा रक्षतु पञ्चवक्त्रो
    जिह्वां सदा रक्षतु वेदजिह्वः ॥ ॥ कण्ठं गिरीशोऽवतु नीलकण्ठः पाणिद्वयं पातु पिनाकपाणिः । दोर्मूलमव्यान्मम
    धर्मबाहुः वक्षःस्थलं दक्षमखान्तकोऽव्यात् ॥ ॥ ममोदरं पातु गिरीन्द्रधन्वा मध्यं ममाव्यान्मदनान्तकारी
    । हेरम्बतातो मम पातु नाभिं पायात्कटिं धूर्जटिरीश्वरो मे ॥ रव्यान्मम गुह्यदेशम् पृष्टं सदा रक्षतु पार्वतीशः
    । ऊरुद्वयं पातु कुबेरमित्रो जानुद्वयं मे जगदीश्वरोऽव्यात् । जङ्घायुगं पुङ्गवकेतुरव्या त्पादौ ममाव्यात्सुरवन्द्यपादः
    ॥ ॥ महेश्वरः पातु दिनादियामे मां मध्ययामेऽवतु वामदेवः । त्रिलोचनः पातु तृतीययामे वृषध्वजः पातु दिनान्त्ययामे
    ॥ ॥ पायान्निशादौ शशिशेखरो मां गङ्गाधरो रक्षतु मां निशीथे । गौरीपतिः पातु निशावसाने मृत्युञ्जयो रक्षतु
    सर्वकालम् ॥ ॥ अन्तःस्थितं रक्षतु शङ्करो मां स्थाणुः सदा पातु बहिःस्थितं माम् । तदन्तरे पातु पतिः पशूनां
    सदाशिवो रक्षतु मां समन्तात् ॥ मव्याद्भुवनैकनाथः पायाद्व्रजन्तं प्रमथाधिनाथः । वेदान्तवेद्योऽवतु मां
    निषण्णं मामव्ययः पातु शिवः शयानम् ॥ ॥ मार्गेषु मां रक्षतु नीलकण्ठः शैलादि दुर्गेषु पुरत्रयारिः । अरण्यवासादि
    महाप्रवासे पायान्मृगव्याध उदारशक्तिः ॥ महाभयाद्रक्षतु वीरभद्रः ॥ कोटिभीषणम् । अक्षौहिणीनां शतमाततायिनां
    छिन्द्यान्मृडो घोरकुठारधारया ॥ ॥ निहन्तु दस्यून्प्रलयानलार्चि र्ज्वलत्त्रिशूलं त्रिपुरान्तकस्य । शार्दूल
    हिंस्रान् सन्त्रासयत्वीश ॥ दुस्स्वप्न दुश्शकुन दुर्गति दौर्मनस्य दुर्भिक्ष दुर्व्यसन दुस्सह दुर्यशांसि
    । उत्पात मसद्ग्रहार्तिं व्याधींश्च नाशयतु मे जगतामधीशः ॥ ॥ ॐ नमो भगवते सदाशिवाय सकल यन्त्राधिष्ठिताय
    सर्व रौद्रावताराय दक्षाध्वर निलयाय तत्वातीताय गङ्गाधराय सर्व देवाय षडाश्रयाय वेदान्त कुलभूषणाय प्रणवस्वरूपाय
    चिदाकाशाय आकाश निजावासाय निराकाराय निराभासाय निरामयाय निर्मलाय निर्लोभाय निर्मदाय निश्चिन्ताय निरहङ्काराय
    निरङ्कुशाय निष्कलङ्काय निर्गुणाय निष्कामाय निरूपप्लवाय निरवध्याय निरन्तराय निरुपद्रवाय निरवद्याय निरन्तराय
    निष्कारणाय निरातङ्काय निष्प्रपञ्चाय निस्सङ्गाय निर्द्वन्द्वाय निराधाराय नीरागाय निश्क्रोधाय निर्लोभाय
    निष्पापाय निर्विकल्पाय निर्भेदाय निष्क्रियाय निस्तुलाय निश्शंशयाय निरञ्जनाय निरुपम सच्चिदानन्दाद्वयाय
    परम प्रकाशाय तेजोरूपाय तेजोमयाय तेजोऽधिपतये जय जय रुद्र महारुद्र महा वदन विकटाट्टहास विस्फातित नागेन्द्रकुण्डल
    नागेन्द्रहार नागेन्द्रवलय नागेन्द्रचर्मधर नागेन्द्रनिकेतन मृत्युञ्जय त्र्यम्बक त्रिपुरान्तक विश्वरूप
    विरूपाक्ष विश्वेश्वर वृषभवाहन विषविभूषण विश्वतोमुख सर्वतोमुख मां रक्ष रक्ष ज्वल ज्वल प्रज्वल प्रज्वल
    महामृत्युभयं शमय शमय अपमृत्युभयं नाशय नाशय रोगभयं उत्सादय उत्सादय विषसर्पभयं शमय शमय चोरान् मारय मारय
    मम शत्रून् उच्चाटय उच्चाटय त्रिशूलेन विदारय विदारय कुठारेण भिन्धि भिन्धि खड्गेन छिन्द्दि छिन्द्दि
    खट्वाङ्गेन विपोधय विपोधय मम पापं शोधय शोधय मुसलेन निष्पेषय निष्पेषय बाणैः सन्ताडय सन्ताडय यक्ष रक्षांसि
    भीषय भीषय अशेष भूतान् विद्रावय विद्रावय कूष्माण्ड गणान् सन्त्रासय सन्त्रासय मम अभयं कुरु कुरु महाभयान्
    मां उद्धर उद्धर वित्रस्तं मां आश्वासय आश्वासय अमृत वीक्षणेन मां आलोकय आलोकय सञ्जीवय सञ्जीवय क्षुत्तृष्णार्तं
    मां आप्यायय आप्यायय दुःखातुरं मां आनन्दय आनन्दय शिवकवचेन मां आच्छादय आच्छादय हर हर हर हर मृत्युञ्जय
    त्र्यम्बक सदाशिव परमशिव नमस्ते नमस्ते नमस्ते नमः ॥ पूर्ववत् हृदयादि न्यासः । पञ्चपूजा ॥ भूर्भुवस्सुवरोमिति
    दिग्विमोकः ॥ फलश्रुतिः ऋषभ उवाच । इत्येतत्कवचं शैवं वरदं व्याहृतं मया । सर्व प्रशमनं रहस्यं सर्वदेहिनाम्
    ॥ ॥ यः सदा धारयेन्मर्त्यः शैवं कवचमुत्तमम् । न तस्य जायते क्वापि भयं शम्भोरनुग्रहात् ॥ र्मृत्युमापन्नो
    महारोगहतोऽपि वा । सद्यः सुखमवाप्नोति दीर्घमायुश्च विन्दति ॥ ॥ सर्वदारिद्र्यशमनं सौमाङ्गल्य विवर्धनम्
    । यो धत्ते कवचं शैवं स देवैरपि पूज्यते ॥ सङ्घातैर्मुच्यते चोपपातकैः । देहान्ते शिवमाप्नोति शिव ॥ त्वमपि
    श्रद्धया वत्स शैवं कवचमुत्तमम् । धारयस्व मया दत्तं सद्यः श्रेयो ह्यवाप्स्यसि ॥ ॥ सूत उवाच । इत्युक्त्वा
    ऋषभो योगी तस्मै पार्थिव सूनवे । ददौ शङ्खं महारावं खड्गं चारिनिषूदनम् ॥ ॥ पुनश्च भस्म सम्मन्त्र्य तदङ्गं
    सर्वतोऽस्पृशत् । गजानां षट्सहस्रस्य द्विगुणं च बलं ददौ ॥ ॥ भस्मप्रभावात्सम्प्राप्य बलैश्वर्यधृतिस्मृतिः
    । स राजपुत्रः शुशुभे शरदर्क इव श्रिया ॥ ॥ तमाह प्राञ्जलिं भूयः स योगी राजनन्दनम् । एष खड्गो मया दत्तस्तपोमन्त्रानुभावतः
    ॥ ॥ शितधारमिमं खड्गं यस्मै दर्शयसि स्फुटम् । स सद्यो म्रियते शत्रुः साक्षान्मृत्युरपि स्वयम् ॥ ॥ अस्य
    शङ्खस्य निह्रादं ये शृण्वन्ति तवाहिताः । ते मूर्छिताः पतिष्यन्ति न्यस्तशस्त्रा विचेतनाः ॥ ॥ खड्गशङ्खाविमौ
    दिव्यौ परसैन्यविनाशिनौ । आत्मसैन्यस्वपक्षाणां शौर्यतेजोविवर्धनौ ॥ ॥ एतयोश्च प्रभावेन शैवेन कवचेन च
    । द्विषट्सहस्रनागानां बलेन महतापि च ॥ ॥ भस्मधारणसामर्थ्याच्छत्रुसैन्यं विजेष्यसि । प्राप्य सिंहासनं
    पैत्र्यं गोप्तासि पृथिवीमिमाम् ॥ ॥ इति भद्रायुषं सम्यगनुशास्य समातृकम् । ताभ्यां सम्पूजितः सोऽथ योगी
    स्वैरगतिर्ययौ ॥ ॥ इति श्रीस्कान्दमहापुराणे ब्रह्मोत्तरखण्डे शिवकवच प्रभाव वर्णनं नाम द्वादशोऽध्यायः
    सम्पूर्णः ॥
