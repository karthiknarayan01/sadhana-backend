id: vagmatisahasranamastotram-2
category: sahasranama
name:
  english: vagmatisahasranamastotram
  devanagari: वाग्मतिसहस्रनामस्तोत्रम्
content:
  english: svarupini || 34|| vagrupini ca caitanya vagvagishvaravallabha | vacormimalini vaha arvakpaporminashini
    || 35|| vagdeveshvarakanthastha vagdevi vagmatishvara | vagbhutarnapravaha ca vagaishvarya sarasvati
    || 36|| animarundhatti arddha agaishvaryavatarini | asharirarddhamatra ca annarupaghaharini || 37||
    atisaumyacyutashoka arcitacalavahini | atyugracalasambhinna acchinnacchinnavahini || 38|| anandini
    svabhaktanamatmantastha ca jivinam | ananda'mritavarnabha adyananasamudbhava || 39|| anandormipravaha
    ca apodevi payomayi | akashavahini arya akara sharmanominam || 40|| icchashaktishca indrani indira
    harivallabha | ipsitarthaprada induringitajna shivapriya || 41|| ishvari lokaishani ishvaramodakarini
    | ishani shankari shanta ishanamukhasambhava || 42|| ugrasya ugrarupa ca ugravaraprada uma | ugrarddhanganishanna
    ca ugrashirshavatarini || 43|| urdhveshvari sadordhvastha unakilbishakarini | ushiragandhasuprita
    uhca varapradagrani || 44|| urupa sarvasamhare urdhvagatipradarshini | urdhvaga ugrabharya ca urdhvasthanapradayini
    || 45|| rigyajuratha samatma rivarna riddhirupini | rikara ditirupa ca rinahantri ritutsava || 46||
    rikaramukhasambhuta rivarnatmamaraprasuh | lrikarasamstuta'neka lrivarnasevitariha || 47|| eka caikararupa
    ca ekara madanotsava | ekarastha samaikasya ekadhara bahushrita || 48|| aikaravallabha aindri aikara
    vamalocana | aikaratma anekadhva aindriganaprasevita || 49|| onkarastha tathonkara onkarashruvibhushana
    | onkaravaktrasambhuta onkarapurvajapriya || 50|| aurdhvareto'rccita aurvi aurdhvadehaphalaprada |
    auttanapadasamprita aurvasamorvashipriya || 51|| ambikambalikananta arnavadhvarashirshaga | ankushadharini
    amba annapurnannakarini || 52|| ah rudravaktrasanjata arupa shivavallabha | aprokta cainasam shasta
    anangarivinodini || 53|| kaladhara kalarupa kaumudi kalabhairavi | kamala kamini kali kulluka kusumapriya
    || 54|| kalavati karalasya kailasastha kalanidhih | kamakhya kulakanta ca kamada kamacarini || 55||
    kamadhenuh krishangi ca kalindi kunjareshvari | kantikaya ca kancistha alaka kutavahini || 56|| kulavati
    kutilangi kotarakshi kapalini | kameshvari ca kankali kirtida kamasundari || 57|| kamartta kamarupa
    ca karuna kuladevata | kulishangi kala kashtha kumari kamalekshana || 58|| kalyani karcita kanti kalaratri
    ca kaushiki | kamya alakananda ca kuladharmaprakashini || 59|| kalushaghni kripasvaccha krishna krishnasamarccita
    | kantakallolaloladhya kripakallolashalini || 60|| khageshvari kharupa ca khaga khagendravahini |
    khavarna khadgahasta ca khecari khetakayudha || 61|| khakhodari khagendrabha khamanidyutishobhana
    | kharadamshtra khagasya ca khandaparashuvallabha || 62|| gajasyamba ca guhyeshi gajendradashanacchavih
    | gajacarmavritajaya gajananaprasutika || 63|| gauri godavari ganga gandharvaganasevita | gananiya
    ganadhyaksha gambhiraniravahini || 64|| ganamata ca gandhari gaganamanibhushana | gomati gaganeshani
    girija girishapriya || 65|| gangarcita ca gayatri giristha girisambhava | gandaki garudastha ca gokarnarca
    ca gautami || 66|| ghanabhaktipriya ghora ghanamaraprasevita | ghritacisevita ghora ghoragnya ghoravallabha
    || 67|| ghanaghanaughaghorasya ghanapapavinashini | ghanasvana ghana ghora ghoratara ghanacchavih
    || 68|| neshvari ghoraghosha ca ghorakilbishaghatini | cancala caruvaha ca candeshvari ca cittavit
    || 69|| pracanda candarupa ca camunda caturanana | capala candika candi shatcakrantarnnivasini ||
    70|| carucara ca carvangi catura caruhasini | catuhshashtikala citra citrangi carulocana || 71|| carudeha
    caturbahushcitrabhanutanuprabha | candrama candrabhaga ca caitanya cakradharini || 72|| chandorupa
    chavarnabha procchayacchannavigraha | chayasanchanditaloka chakara chinnavigraha || 73|| chatrasanchadita
    svaccha lanchanormipayashchavih | chandomayi shruticchanda icchatma chinnasamshaya || 74|| jagadanandini
    jvala jambavatyarcitajita | jagatpriya jitakrodha jagaddhira jitendriya || 75|| jahnavi janaki japya
    janani jananandini | jagaddhatri jaganmanya jantujanmantarashrita || 76|| jagadvapurjjagajjiva jatavedaparajita
    | jayamurtirjjaganmata janasvantanivasini || 77|| jambunadapravaha ca jaya ca vijayajaya | jagajjivamayi
    mata jayanti jagaducchrita || 78|| jiveshvari janaishvarya jiveshajanakarini | jhankeshvari jhakaratma
    jhankarasvanavahini || 79|| jharjharanipatanti ca jhankesharddhangaharini | jhashavatarasuprita jhashavargaprasevita
    || 80|| jharjhararavasamkshipta jhakararupatoshita | attattahasini krodhatkotikotitarangini || 81||
    tatini karahatadhya atavikshitigamini | himakutatatodbhuta kutakatakavahini || 82|| shankhatatankaramyasya
    nidhanodyatatankini | pitheshvari ca pitharya pivarambupravahini || 83|| dakini damaruhasta dakaresha
    danadini | dambhahantri ca bherunda damara dandatarjjani || 84|| dharupa dhasvara dhatma bhangadhya
    dhandhakarini | dhakkavadyasvanavicidridhadhara dridharava || 85|| pranaveshi pranamyarya namya pranavasambhava
    | tarangini tarangadhya tantritaralagamini || 86|| tamasi ca tamorupa tamoguna tamahpara | tiravati
    trirupa ca tushtistivradrihaktraya || 87|| tivraga tivrabhangi ca tivratoya tapomayi | dustara dustaratrata
    tareshi tararupini || 88|| tarini tararupa ca taralataratarini | taponishtha trimatra ca tapasvini
    trilocana || 89|| tridivastha tridhara ca tareshvari trivikrama | trivargagamini tristha tattva tripuravasini
    || 90|| trilokatma trilokastha trailokyatirthanandini | tatankini ca tarastha tara trishuladharini
    || 91|| trimurtistarani tapa tryakshara trividhangini | tirthavandyalasattirtha tirtharajni ca tirthada
    || 92|| tirthadya tirthajyeshtha ca tirtharya tirthavahini | tarkshyastha tarkshyavandya ca tarkshyarya
    tarkshyavahini || 93|| sthanastha sthandila sthira sthanvishvari sthalashrita | mathura mathurasthata
    sthaniyastha sthala sthira || 94|| jyeshtha ca sthavira mantha maithili pramathadhipa | dushkritaghni
    sprihadogdhri devamata dadhiprabha || 95|| devata devamurtishca devadevapriyottama | devaduti ca diptasya
    devaki daityanashini || 96|| dvipicarmavrita dakshya dakshayajnapramathini | daridryanashini danta
    dakshayani ca durgaha || 97|| davagnidalana daksha digvastra dvadashanana | dashabhuja ca dakshinya
    dandini dandavatpriya || 98|| duritaghni daya durga duradharsha digambari | dahaprashamani dipta duraradhya
    ca daruna || 99|| ashtadashabhuja canda dvipatravasini daya | dakshakanya drava divya divyarupa daristava
    || 100|| divyarcita ca divyangi devasainya sudiptika | dayini dravyarupa ca danavaghni dayakara ||
    101|| durgarupa duraradhya durjjaya duratikrama | deveshvari dayashila divyamokshapradayini || 102||
    dhira dhirapravaha ca dharapravahini sudha | dharitri dharini dhatri dharanidharapravahini || 103||
    dhanya dhanyadhara dhira dharana dharani dhara | dharadharanana dhairya dharmatma dharmarupini ||
    104|| dhirupa dhishana dhatri dhumraksha dharmavigraha | dhyanagamya nishi dhyeya dhyananana dharashrita
    || 105|| dhyanarupa budhadhyata dhyanastha dhyanarupini | dhyanatitamaradhyata dhyatavya dhyanatatpara
    || 106|| dhyanekshana dhiya dhyeya dhyanasya dhyanasamshrita | dhiradhyata dharadhana dharadhyeya
    vidhayini || 107|| nandini ca niradhara nishkala nirguna nadi | nilaghanasvana nagna nanajatinivasini
    || 108|| nagopavitini natyananda nrimundadharini | nilaghanabhadeha ca nirdvandva naganayika || 109||
    nagendradantasankasha naya narakanashini | nirbhaya nirbhara nishtha narayani niranjana || 110|| nishthura
    ca nirakara narasimhi ca nopama | nishithini nishahantri nanaduhkhanivarini || 111|| nirmada karatoya
    ca nishkalanka'ghanashini | shatadrusindhusamvaha nityanandavidhayini || 112|| trinayana nrisimharya
    nanakarapravahini | papaghni pavani padma pavitra padmapujita || 113|| prajnarupa pracanda ca padmastha
    padmasambhava | padmakshi padmini prita prakatavasini para || 114|| pritibhakta ca pashyanti parambrahmavatarini
    | prabhavati paratma ca padmaja parameshvari || 115|| patakaghni parashaktih pancami pancamaruta |
    pancatma pancatattva ca pancatvastha parapara || 116|| pancapitheshvari purna puraka pancamipriya
    | purnima purnarupa ca purneshvari paratpara || 117|| phanindrabhushana pheruh sphatikabha pravahini
    | sphita sphotapravaha ca snatakasphotanashini || 118|| phanihara phaladhyarya sphatikarna phalaprada
    | pherustha pherurava ca phetkarini tatha prabha || 119|| vaishnavi vamarupa ca vameshvari varaprada
    | vamastha vahini vama vamesha vamalocana || 120|| varenya varada bala vararya varadayini | vimala
    ca vishalakshi vishvakshi vinduvasini || 121|| vishvatma ca virupakshi vibhava vindhyavasini | bodhini
    viraja vira vishvayonishca vatsala || 122|| vishva sarvasudha vija vishalamritavahini | vidyadhari
    ca vidyatma vaikhari vamakeshvari || 123|| vedarupa ca vedanta vedanga vedavallabha | varahi vasavi
    vani varanasinivasini || 124|| bhavani bhavavandya ca bhumistha bhumibhushana | bhagirathi bhavaradhya
    bhavamata bhaveshvari || 125|| bhayapaha bhavananda bhayankari bhayanashini | prabhadevi bhageshi
    ca bhavini bhavanashini || 126|| bhaktigamya ca bhitighni bhaskari bhuvaneshvari | bhaktivaraprada
    bhavya bhramari bhagamalini || 127|| bhaktitushta ca bherunda bhuktida bhavatoshini | bhavana bhuvaneshi
    ca bhaktisha bhavalocana || 128|| bhasvaddeha ca bhavyasya bhavati bhavaranjani | bhubhushana ca bhutastha
    bhumibhushanavahini || 129|| bhagavati bhavatma ca bhavaduhkhaprabhanjani | bhimarupa bhavabhranti
    bhavya bhavyarccitanana || 130|| bhimadevi shubha bhadra bhima bhimaninadini | bhuteshi bhutadhatri
    ca bhutastha bhutabhavini || 131|| maheshvari mahamaya munjavadadrisangama | mashekhari mahamari manya
    maheshanandini || 132|| mahajyotirmahamedha mayapurinivasini | matangini manorupa mahabhuta ca madhyama
    || 133|| manipurakamadhyastha mohini vishvamohini | mahadhritirmahakali madira manditanana || 134||
    mahamatirmahasukshma madhumati mahodari | menakagarbhaja mastha mangala ca sumangala || 135|| mandahasa
    mahadamshtra malika ca mahomakha | madalasa manojna ca manasvini manohara || 136|| mandakini mahabhadra
    mokshadatri ca madhavi | matara mantrarupa ca manvamata maniprabha || 137|| mudrapriya ca merustha
    mantratmika manorama | mrigendradipravaha ca maheshamukhasambhava || 138|| manimatirmahavega manimukutasambhava
    | yajneya yamuna jyeshtha yajnamata yashasvini || 139|| yajnangi yamarupa ca yaksharupa yashomayi
    | yajnapriya ca yajnesha yajnabhoktri yashahpriya || 140|| yashodagarbhasanjata yashahpurna yashobala
    | yadahprasevita yamya yatudhanaprapujita || 141|| yogasara yugadya ca yogeshvari ayonija | yogisha
    yogarupa ca yogindrahridayashrita || 142|| yoginisevita yogya yogishvara yugasthita | yogishvarasyasambhuta
    yogasiddha yashomayi || 143|| yogodbhava suyogarya yogena jalavahini | rasottamapravaha ca rudrahridramana
    rasa || 144|| ravanabhutida rambha rajarajeshvari vara | rasavaha ca rambhoru rasabhoktri rasapriya
    || 145|| ragapriya rasajna ca rama raghavatarini | ramani radhika''radhya rajyada rajyarajita || 146||
    rakini rajyabhoktri ca raudrinamavaraprada | rohini raktapadmastha ratijna riddhirupini || 147|| rudrapriya
    ca rudri ca rathastha rathagamini | ratnangi raktavasa ca raktakshi raktadantika || 148|| ratnagriha
    ca ratnastha ratnapadmashrita rasa | lambodaraprasuta ca mrigalanchanashekhara || 149|| lambika nalinollasa
    lakini lalitalaka | lalana lalajjihva ca lalita lohitangini || 150|| lambodari sulilanga lolakallolamalini
    | lakshmirllakshmiprada lakshma lakshalakshatarangini || 151|| lakshmirupa ca lakshmistha lakshmilakshmavadhishrita
    | venurvashapriya brahmi vallakivasasah priya || 152|| balisha balika bala brahmasvacchormimalini
    | brahmastha brahmarupa ca brahmeshi brahmapujita || 153|| brahmatita param brahmi brahmeshacyutavandita
    | shiveshvari shivavaho shambhakari shivapriya || 154|| sharveshvari ca sharvani shanta shantapravahini
    | shamana shaktirupa ca sharngini sarvamangala || 155|| shatarudra shaci shita shila shilaprada shubha
    | shilarupa sushilastha shrirupa shrikari shiva || 156|| shrimayi shrinivasa ca shrimati shridhararcita
    | shraddhapriya sadashraddha shraddhatma ca shrutipriya || 157|| shrutiprajna shashankabha shrutirupa
    shucismita | shrutini shrutinetra ca shrutijna shrutipujita || 158|| shatpatrapadmamadhyastha shatcakradharasamshrita
    | catuhshashtikalopeta shashthasvari shadangini || 159|| shadasyajanani shashthi shadanana sharupini
    | shodashi shodashadhara shodasharanishangini || 160|| sakshatsaratara sara sattvastha sarvavandini
    | sattviki sattvarupa ca sarvasattvanivasini || 161|| samsarasaraha svaha subhanga sararupini | samvarttanta
    nimeshadisamvatsaravatarini || 162|| sahasrasya sahasraksha savitri saradeshvari | sarveshvari ca
    satyatma sarvavidya ca sakini || 163|| smritimayi ca suryatma sarvavarnantasarini | sarvendriyashrita
    sukshma sarvendriyadhishi vara || 164|| siddhatma sukshmarupamsha sukshmastha somabhushana | sangramajayada
    sadhvi srishtisthitivinashini || 165|| sarvesha sarvarogaghni sarvagrahavinashini | sadasadrupini
    satta svastirupa sarasvati || 166|| hradini haravagjata harahasasyanihsrita | hritpadmavasini hrishta
    graharakshasanigraha || 167|| hamsastha hamsarupa ca hamsamurtirharapriya | hingula hamsadevi ca hakini
    haravallabha || 168|| hamseshvari hakaratma hamsigatishca hasini | haravaktrodbhava hamsi harivandya
    haripriya || 169|| hemabha himavatputri himakotitapasvini | himadritungasanorhi patanti himashikara
    || 170|| kshonishvari kshamarupa kshanadeshvarashekhara | kshinakshemankari sakshatkshobhini kshitivahini
    || 171|| kshamodari kshama kshina yaksheshvari sudakshina | kshemankari kshanabhangi kshaumamambari
    kshanaprabha || 172|| kshetrajna kshemada kshina akshayaksheyabhringini | kshetrastha kshetradeha
    ca mokshada kshipravahini || 173|| ityetatkathitam namnam sahastram suradurllabham | punyatpunyatarannama
    vagmatya naradanjasa || 174|| varnitam tridashaih purvam brahmavishnumaheshvaraih | sudhamayani namani
    vagmatya mahimani ca || 175|| savadhanaparo vipra pathakanam visheshatah | durasthanamashaktanam vakshyami
    tajjalaplavam || 176|| ekadha pathakastasyam snanodbhavaphalam labhet | dvidha ca pathanatsnata manovanchaphalam
    labhet || 177|| tridha prapathanatsnatva bhogyarthi bhogyamapnuyat | caturtha pathanatsaukhyam pancadha
    dhanamapnuyat || 178|| shaddha pathaddhi kirtih syatprabhutvam saptadha tatha | ashtadha pathanatsadya
    aishvaryatvam phalam labhet || 179|| navadha caiva vak
  devanagari: स्वरूपिणी ॥ ३४॥ वाग्रूपिणी च चैतन्या वाग्वागीश्वरवल्लभा । वाचोर्मिमालिनी वाहा अर्वाक्पापोर्मिनाशिनी
    ॥ ३५॥ वाग्देवेश्वरकण्ठस्था वाग्देवी वाग्मतीश्वरा । वाग्भूतार्णप्रवाहा च वागैश्वर्या सरस्वती ॥ ३६॥
    अणिमारुन्धत्ती अर्द्धा अगैश्वर्यावतारिणी । अशरीरार्द्धमात्रा च अन्नरूपाघहारिणी ॥ ३७॥ अतिसौम्याच्युताशोका
    अर्चिताचलवाहिनी । अत्युग्राचलसम्भिन्ना अच्छिन्नाच्छिन्नवाहिनी ॥ ३८॥ आनन्दिनी स्वभक्तानामात्मान्तस्था
    च जीविनाम् । आनन्दाऽमृतवर्णाभा आद्याननसमुद्भवा ॥ ३९॥ आनन्दोर्मिप्रवाहा च आपोदेवी पयोमयी । आकाशवाहिनी
    आर्या आकरा शर्मणोमिणाम् ॥ ४०॥ इच्छाशक्तिश्च इन्द्राणी इन्दिरा हरिवल्लभा । ईप्सितार्थप्रदा इन्दुरिङ्गितज्ञा
    शिवप्रिया ॥ ४१॥ ईश्वरी लोकईशानी ईश्वरामोदकारिणी । ईशानी शाङ्करी शान्ता ईशानमुखसम्भवा ॥ ४२॥ उग्रास्या
    उग्ररूपा च उग्रवरप्रदा उमा । उग्रार्द्धाङ्गनिषण्णा च उग्रशीर्षावतारिणी ॥ ४३॥ ऊर्ध्वेश्वरी सदोर्ध्वस्था
    ऊनकिल्बिषकारिणी । ऊशीरगन्धसुप्रीता ऊःच वरप्रदाग्रणी ॥ ४४॥ ऊरूपा सर्वसंहारे ऊर्ध्वगतिप्रदर्शिनी । ऊर्ध्वगा
    ऊग्रभार्या च ऊर्ध्वस्थानप्रदायिनी ॥ ४५॥ ऋग्यजुरथ सामात्मा ऋवर्णा ऋद्धिरूपिणी । ऋकारा दितिरूपा च ऋणहन्त्री
    ऋतूत्सवा ॥ ४६॥ ऋकारमुखसम्भूता ऋवर्णात्मामरप्रसूः । लृकारसंस्तुताऽनेका लृवर्णसेवितारिहा ॥ ४७॥ एका चैकाररूपा
    च एकारा मदनोत्सवा । एकारस्था समैकास्या एकाधारा बहुश्रिता ॥ ४८॥ ऐकारवल्लभा ऐन्द्री ऐकारा वामलोचना ।
    ऐकारात्मा अनेकाध्वा ऐन्द्रीगणप्रसेविता ॥ ४९॥ ओङ्कारस्था तथोङ्कारा ओङ्काराश्रुविभूषणा । ओङ्कारवक्त्रसम्भूता
    ओङ्कारपूर्वजप्रिया ॥ ५०॥ और्ध्वरेतोऽर्च्चिता और्वी और्ध्वदेहफलप्रदा । औत्तानपादसंप्रीता और्वासमोर्वशीप्रिया
    ॥ ५१॥ अम्बिकाम्बालिकानन्ता अर्णवाध्वरशीर्षगा । अङ्कुशधारिणी अम्बा अन्नपूर्णान्नकारिणी ॥ ५२॥ अः रुद्रवक्त्रसञ्जाता
    अरूपा शिववल्लभा । अप्रोक्ता चैनसां शास्ता अनङ्गारिविनोदिनी ॥ ५३॥ कलाधारा कलारूपा कौमुदी कालभैरवी ।
    कमला कामिनी काली कुल्लुका कुसुमप्रिया ॥ ५४॥ कलावती करालास्या कैलासस्था कलानिधिः । कामाख्या कुलकान्ता
    च कामदा कामचारिणी ॥ ५५॥ कामधेनुः कृशाङ्गी च कालिन्दी कुञ्जरेश्वरी । कान्तिकाया च काञ्चीस्था अलका कूटवाहिनी
    ॥ ५६॥ कुलवती कुटिलाङ्गी कोटराक्षी कपालिनी । कामेश्वरी च कङ्काली कीर्तिदा कामसुन्दरी ॥ ५७॥ कामार्त्ता
    कामरूपा च करुणा कुलदेवता । कुलिशाङ्गी कला काष्ठा कुमारी कमलेक्षणा ॥ ५८॥ कल्याणी कार्चिता कान्ती कालरात्री
    च कौशिकी । काम्या अलकनन्दा च कुलधर्मप्रकाशिनी ॥ ५९॥ कलुषघ्नी कृपास्वच्छा कृष्णा कृष्णसमर्च्चिता ।
    कान्तकल्लोललोलाढ्या कृपाकल्लोलशालिनी ॥ ६०॥ खगेश्वरी खरूपा च खगा खगेन्द्रवाहिनी । खवर्णा खड्गहस्ता
    च खेचरी खेटकायुधा ॥ ६१॥ खाखोदरी खगेन्द्राभा खमणिद्युतिशोभना । खरदंष्ट्रा खगास्या च खण्डपरशुवल्लभा
    ॥ ६२॥ गजास्याम्बा च गुह्येशी गजेन्द्रदशनच्छविः । गजचर्मावृताजाया गजाननप्रसूतिका ॥ ६३॥ गौरी गोदावरी
    गङ्गा गन्धर्वगणसेविता । गणनीया गणाध्यक्षा गम्भीरनीरवाहिनी ॥ ६४॥ गणमाता च गान्धारी गगनमणिभूषणा । गोमती
    गगनेशानी गिरिजा गिरिशप्रिया ॥ ६५॥ गङ्गार्चिता च गायत्री गिरिस्था गिरिसम्भवा । गण्डकी गरुडस्था च गोकर्णार्चा
    च गौतमी ॥ ६६॥ घनभक्तिप्रिया घोरा घनामरप्रसेविता । घृताचीसेविता घोरा घोराग्न्या घोरवल्लभा ॥ ६७॥ घनघनौघघोरास्या
    घनपापविनाशिनी । घनस्वना घना घोरा घोरतरा घनच्छविः ॥ ६८॥ ङेश्वरी घोरघोषा च घोरकिल्बिषघातिनी । चञ्चला
    चारुवाहा च चण्डेश्वरी च चित्तवित् ॥ ६९॥ प्रचण्डा चण्डरूपा च चामुण्डा चतुरानना । चपला चण्डिका चण्डी
    षट्चक्रान्तर्न्निवासिनी ॥ ७०॥ चारुचारा च चार्वङ्गी चतुरा चारुहासिनी । चतुःषष्टिकला चित्रा चित्राङ्गी
    चारुलोचना ॥ ७१॥ चारुदेहा चतुर्बाहुश्चित्रभानुतनुप्रभा । चन्द्रमा चन्द्रभागा च चैतन्या चक्रधारिणी ॥
    ७२॥ छन्दोरूपा छवर्णाभा प्रोच्छायाच्छन्नविग्रहा । छायासञ्छन्दितालोका छकारा छिन्नविग्रहा ॥ ७३॥ छत्रसञ्छादिता
    स्वच्छा लाञ्छनोर्मिपयश्छविः । छन्दोमयी श्रुतिच्छन्दा इच्छात्मा छिन्नसंशया ॥ ७४॥ जगदानन्दिनी ज्वाला
    जाम्बवत्यर्चिताजिता । जगत्प्रिया जितक्रोधा जगद्धीरा जितेन्द्रिया ॥ ७५॥ जाह्नवी जानकी जाप्या जननी जननन्दिनी
    । जगद्धात्री जगन्मान्या जन्तुजन्मान्तराश्रिता ॥ ७६॥ जगद्वपुर्ज्जगज्जीवा जातवेदापराजिता । जयमूर्तिर्ज्जगन्माता
    जनस्वान्तनिवासिनी ॥ ७७॥ जाम्बूनदप्रवाहा च जया च विजयाजया । जगज्जीवमयी माता जयन्ती जगदुच्छ्रिता ॥ ७८॥
    जीवेश्वरी जनैश्वर्या जीवेशजनकारीणी । झङ्केश्वरी झकारात्मा झङ्कारस्वनवाहिनी ॥ ७९॥ झर्झरानिपतन्ती च
    झङ्केशार्द्धाङ्गहारिणी । झषावतारसुप्रीता झषवर्गप्रसेविता ॥ ८०॥ झर्झररवसंक्षिप्ता झकाररूपतोषिता । अट्टाट्टहासिनी
    क्रोधात्कोटिकोटितरङ्गिणी ॥ ८१॥ तटिनी करहाटाढ्या अटवीक्षितिगामिनी । हिमकूटतटोद्भूता कूटकटकवाहिनी ॥
    ८२॥ शङ्खताटङ्करम्यास्या निधनोद्यतटङ्किनी । पीठेश्वरी च पीठार्या पीवराम्बुप्रवाहिनी ॥ ८३॥ डाकिनी डमरुहस्ता
    डकारेशा डनादिनी । डम्भहन्त्री च भेरुण्डा डामरा डण्डतर्ज्जनी ॥ ८४॥ ढरूपा ढस्वरा ढात्मा भङ्गाढ्या ढण्ढकारिणी
    । ढक्कावाद्यस्वनावीचीदृढधारा दृढारवा ॥ ८५॥ प्रणवेशी प्रणम्यार्या नम्या प्रणवसम्भवा । तरङ्गिणी तरङ्गाढ्या
    तन्त्रीतरलगामिनी ॥ ८६॥ तामसी च तमोरूपा तमोगुणा तमःपरा । तीरवती त्रिरूपा च तुष्टिस्तीव्राद्रिहाक्त्रया
    ॥ ८७॥ तीव्रगा तीव्रभङ्गी च तीव्रतोया तपोमयी । दुस्तारा दुस्तरत्राता तारेशी ताररूपिणी ॥ ८८॥ तारिणी
    ताररूपा च तरलतरतारिणी । तपोनिष्ठा त्रिमात्रा च तपस्विनी त्रिलोचना ॥ ८९॥ त्रिदिवस्था त्रिधारा च तारेश्वरी
    त्रिविक्रमा । त्रिवर्गागामिनी त्रिस्था तत्त्वा त्रिपुरवासिनी ॥ ९०॥ त्रिलोकात्मा त्रिलोकस्था त्रैलोक्यतीर्थनन्दिनी
    । ताटङ्किनी च तारस्था तारा त्रिशूलधारिणी ॥ ९१॥ त्रिमूर्तिस्तरणी तापा त्र्यक्षरा त्रिविधाङ्गिनी । तीर्थवन्द्यालसत्तीर्था
    तीर्थराज्ञी च तीर्थदा ॥ ९२॥ तिर्थाद्या तीर्थज्येष्ठा च तीर्थार्या तीर्थवाहिनी । तार्क्ष्यस्था तार्क्ष्यवन्द्या
    च तार्क्ष्यार्या तार्क्ष्यवाहिनी ॥ ९३॥ स्थानस्था स्थण्डिला स्थीरा स्थाण्वीश्वरी स्थलाश्रिता । मथुरा
    मथुरास्थाता स्थानीयस्था स्थला स्थिरा ॥ ९४॥ ज्येष्ठा च स्थविरा मन्था मैथिली प्रमथाधिपा । दुष्कृतघ्नी
    स्पृहादोग्ध्री देवमाता दधिप्रभा ॥ ९५॥ देवता देवमूर्तिश्च देवदेवप्रियोत्तमा । देवदूती च दीप्तास्या
    देवकी दैत्यनाशिनी ॥ ९६॥ द्वीपिचर्मावृता दाक्ष्या दक्षयज्ञप्रमाथिनी । दारिद्र्यनाशिनी दान्ता दाक्षायणी
    च दुर्गहा ॥ ९७॥ दावाग्निदलना दक्षा दिग्वस्त्रा द्वादशानना । दशभुजा च दक्षिण्या दण्डिनी दण्डवत्प्रिया
    ॥ ९८॥ दुरितघ्नी दया दुर्गा दुराधर्षा दिगम्बरी । दाहप्रशमनी दीप्ता दुराराध्या च दारुणा ॥ ९९॥ अष्टादशभुजा
    चण्डा द्विपत्रवासिनी दया । दक्षकन्या द्रवा दिव्या दिव्यरूपा दरीस्तवा ॥ १००॥ दिव्यार्चिता च दिव्याङ्गी
    देवसैन्या सुदीप्तिका । दायिनी द्रव्यरूपा च दानवघ्नी दयाकरा ॥ १०१॥ दुर्गरूपा दुराराध्या दुर्ज्जया दुरतिक्रमा
    । देवेश्वरी दयाशीला दिव्यमोक्षप्रदायिनी ॥ १०२॥ धीरा धीरप्रवाहा च धाराप्रवाहिणी सुधा । धरित्री धारिणी
    धात्री धरणीधरप्रवाहिणी ॥ १०३॥ धन्या धान्यधरा धीरा धारणा धरणी धरा । धाराधरानना धैर्या धर्मात्मा धर्मरूपिणी
    ॥ १०४॥ धीरूपा धिषणा धात्री धूम्राक्षा धर्मविग्रहा । ध्यानगम्या निशि ध्येया ध्यानानना धराश्रिता ॥ १०५॥
    ध्यानरूपा बुधध्याता ध्यानस्था ध्यानरूपिणी । ध्यानातीतामरध्याता ध्यातव्या ध्यानतत्परा ॥ १०६॥ ध्यानेक्षणा
    धिया ध्येया ध्यानास्या ध्यानसंश्रिता । धीरध्याता धराधाना धाराध्येया विधायिनी ॥ १०७॥ नन्दिनी च निराधारा
    निष्कला निर्गुणा नदी । नीलघनस्वना नग्ना नानाजातिनिवासिनी ॥ १०८॥ नागोपवीतिनी नाट्यानन्दा नृमुण्डधारिणी
    । नीलघनाभदेहा च निर्द्वन्द्वा नागनायिका ॥ १०९॥ नागेन्द्रदन्तसङ्काशा नया नरकनाशिनी । निर्भया निर्भरा
    निष्ठा नारायणी निरञ्जना ॥ ११०॥ निष्ठुरा च निराकारा नारसिंही च नोपमा । निशीथिनी निशाहन्त्री नानादुःखनिवारिणी
    ॥ १११॥ निर्मदा करतोया च निष्कलङ्काऽघनाशिनी । शतद्रुसिन्धुसंवाहा नित्यानन्दविधायिनी ॥ ११२॥ त्रिनयना
    नृसिंहार्या नानाकारप्रवाहिणी । पापघ्नी पावनी पद्मा पवित्रा पद्मपूजिता ॥ ११३॥ प्रज्ञारूपा प्रचण्डा
    च पद्मस्था पद्मसम्भवा । पद्माक्षी पद्मिनी प्रीता प्रकटवासिनी परा ॥ ११४॥ प्रीतिभक्ता च पश्यन्ती परम्ब्रह्मावतारिणी
    । प्रभावती परात्मा च पद्मजा परमेश्वरी ॥ ११५॥ पातकघ्नी पराशक्तिः पञ्चमी पञ्चमारुता । पञ्चात्मा पञ्चतत्त्वा
    च पञ्चत्वस्था परापरा ॥ ११६॥ पञ्चपीठेश्वरी पूर्णा पूरका पञ्चमीप्रिया । पूर्णिमा पूर्णरूपा च पूर्णेश्वरी
    परात्परा ॥ ११७॥ फणीन्द्रभूषणा फेरुः स्फटिकाभा प्रवाहिणी । स्फीता स्फोटप्रवाहा च स्नातकस्फोटनाशिनी
    ॥ ११८॥ फणिहारा फलाढ्यार्या स्फटिकार्णा फलप्रदा । फेरुस्था फेरुरावा च फेत्कारिणी तथा प्रभा ॥ ११९॥ वैष्णवी
    वामरूपा च वामेश्वरी वरप्रदा । वामस्था वाहिनी वामा वामेशा वामलोचना ॥ १२०॥ वरेण्या वरदा बाला वरार्या
    वरदायिनी । विमला च विशालाक्षी विश्वाक्षी विन्दुवासिनी ॥ १२१॥ विश्वात्मा च विरूपाक्षी विभवा विन्ध्यवासिनी
    । बोधिनी वीरजा वीरा विश्वयोनिश्च वत्सला ॥ १२२॥ विश्वा सर्वसुधा वीजा विशालामृतवाहिनी । विद्याधरी च
    विद्यात्मा वैखरी वामकेश्वरी ॥ १२३॥ वेदरूपा च वेदान्ता वेदाङ्गा वेदवल्लभा । वाराही वासवी वाणी वाराणसीनिवासिनी
    ॥ १२४॥ भवानी भववन्द्या च भूमिस्था भूमिभूषणा । भागीरथी भवाराध्या भवमाता भवेश्वरी ॥ १२५॥ भयापहा भवानन्दा
    भयङ्करी भयनाशिनी । प्रभादेवी भगेशी च भाविनी भवनाशिनी ॥ १२६॥ भक्तिगम्या च भीतिघ्नी भास्करी भुवनेश्वरी
    । भक्तिवरप्रदा भव्या भ्रामरी भगमालिनी ॥ १२७॥ भक्तितुष्टा च भेरुण्डा भुक्तिदा भवतोषिणी । भावना भुवनेशी
    च भक्तीशा भवलोचना ॥ १२८॥ भास्वद्देहा च भव्यास्या भावती भवरञ्जनी । भूभूषणा च भूतस्था भूमिभूषणवाहिनी
    ॥ १२९॥ भगवती भवात्मा च भवदुःखप्रभञ्जनी । भीमरूपा भवभ्रान्ती भव्या भव्यार्च्चितानना ॥ १३०॥ भीमादेवी
    शुभा भद्रा भीमा भीमनिनादिनी । भूतेशी भूतधात्री च भूतस्था भूतभाविनी ॥ १३१॥ माहेश्वरी महामाया मुञ्जवदद्रिसङ्गमा
    । मशेखरी महामारी मान्या महेशनन्दिनी ॥ १३२॥ महाज्योतिर्महामेधा मायापुरीनिवासिनी । मातङ्गिनी मनोरूपा
    महाभूता च मध्यमा ॥ १३३॥ मणिपूरकमध्यस्था मोहिनी विश्वमोहिनी । महाधृतिर्महाकाली मदिरा मन्दितानना ॥ १३४॥
    महामतिर्महासूक्ष्मा मधुमती महोदरी । मेनकागर्भजा मास्था मङ्गला च सुमङ्गला ॥ १३५॥ मन्दहासा महादंष्ट्रा
    मालिका च महोमखा । मदालसा मनोज्ञा च मनस्विनी मनोहरा ॥ १३६॥ मन्दाकिनी महाभद्रा मोक्षदात्री च माधवी ।
    मातरा मन्त्ररूपा च मन्वमाता मणिप्रभा ॥ १३७॥ मुद्राप्रिया च मेरुस्था मन्त्रात्मिका मनोरमा । मृगेन्द्रादिप्रवाहा
    च महेशमुखसम्भवा ॥ १३८॥ मणिमतिर्महावेगा मणिमुकुटसम्भवा । याज्ञेया यमुना ज्येष्ठा यज्ञमाता यशस्विनी
    ॥ १३९॥ यज्ञाङ्गी यामरूपा च यक्षरूपा यशोमयी । यज्ञप्रिया च यज्ञेशा यज्ञभोक्त्री यशःप्रिया ॥ १४०॥ यशोदागर्भसञ्जाता
    यशःपूर्णा यशोबला । यादःप्रसेविता याम्या यातुधानप्रपूजिता ॥ १४१॥ योगसारा युगाद्या च योगेश्वरी अयोनिजा
    । योगीशा योगरूपा च योगीन्द्रहृदयाश्रिता ॥ १४२॥ योगिनीसेविता योग्या योगीश्वरा युगस्थिता । योगीश्वरास्यसम्भूता
    योगसिद्धा यशोमयी ॥ १४३॥ योगोद्भवा सुयोगार्या योगेन जलवाहिनी । रसोत्तमप्रवाहा च रुद्रहृद्रमणा रसा ॥
    १४४॥ रावणभूतिदा रम्भा राजराजेश्वरी वरा । रसवाहा च रम्भोरू रसभोक्त्री रसप्रिया ॥ १४५॥ रागप्रिया रसज्ञा
    च रामा राघावतारिणी । रमणी राधिकाऽऽराध्या राज्यदा राज्यराजिता ॥ १४६॥ राकिणी राज्यभोक्त्री च रौद्रीनामवरप्रदा
    । रोहिणी रक्तपद्मस्था रतिज्ञा ऋद्धिरूपिणी ॥ १४७॥ रुद्रप्रिया च रुद्री च रथस्था रथगामिनी । रत्नाङ्गी
    रक्तवासा च रक्ताक्षी रक्तदन्तिका ॥ १४८॥ रत्नगृहा च रत्नस्था रत्नपद्माश्रिता रसा । लम्बोदरप्रसूता च
    मृगलाञ्छनशेखरा ॥ १४९॥ लम्बिका नलिनोल्लासा लाकिनी ललितालका । ललना ललज्जिह्वा च ललिता लोहिताङ्गिनी ॥
    १५०॥ लम्बोदरी सुलीलाङ्गा लोलकल्लोलमालिनी । लक्ष्मीर्ल्लक्ष्मीप्रदा लक्ष्मा लक्षालक्षतरङ्गिणी ॥ १५१॥
    लक्ष्मीरूपा च लक्ष्मीस्था लक्ष्मीलक्ष्मावधिश्रिता । वेणुर्वशप्रिया ब्राह्मी वल्लकीवाससः प्रिया ॥ १५२॥
    बालीशा बालिका बाला ब्रह्मस्वच्छोर्मिमालिनी । ब्रह्मस्था ब्रह्मरूपा च ब्रह्मेशी ब्रह्मपूजिता ॥ १५३॥
    ब्रह्मातीता परं ब्राह्मी ब्रह्मेशाच्युतवन्दिता । शिवेश्वरी शिवावाहो शाम्भकरी शिवप्रिया ॥ १५४॥ शर्वेश्वरी
    च शर्वाणी शान्ता शान्तप्रवाहिणी । शमना शक्तिरूपा च शार्ङ्गिणी सर्वमङ्गला ॥ १५५॥ शतरुद्रा शची शीता
    शीला शीलप्रदा शुभा । शीलरूपा सुशीलस्था श्रीरूपा श्रीकरी शिवा ॥ १५६॥ श्रीमयी श्रीनिवासा च श्रीमती श्रीधरार्चिता
    । श्रद्धाप्रिया सदाश्रद्धा श्रद्धात्मा च श्रुतिप्रिया ॥ १५७॥ श्रुतिप्रज्ञा शशाङ्काभा श्रुतिरूपा शुचिस्मिता
    । श्रुतिनी श्रुतिनेत्रा च श्रुतिज्ञा श्रुतिपूजिता ॥ १५८॥ षट्पत्रपद्ममध्यस्था षट्चक्राधारसंश्रिता ।
    चतुःषष्टिकलोपेता षष्ठस्वरी षडङ्गिनी ॥ १५९॥ षडास्यजननी षष्ठी षडानना षरुपिणी । षोडशी षोडशाधारा षोडशारनिषङ्गिणी
    ॥ १६०॥ साक्षात्सारतरा सारा सत्त्वस्था सर्ववन्दिनी । सात्त्विकी सत्त्वरूपा च सर्वसत्त्वनिवासिनी ॥ १६१॥
    संसारसारहा स्वाहा सुभङ्गा साररूपिणी । संवर्त्तान्ता निमेषादिसंवत्सरावतारिणी ॥ १६२॥ सहस्रास्या सहस्राक्षा
    सावित्री सारदेश्वरी । सर्वेश्वरी च सत्यात्मा सर्वविद्या च साकिनी ॥ १६३॥ स्मृतिमयी च सूर्यात्मा सर्ववर्णान्तसारिणी
    । सर्वेन्द्रियाश्रिता सूक्ष्मा सर्वेन्द्रियाधिशी वरा ॥ १६४॥ सिद्धात्मा सूक्ष्मरूपांशा सूक्ष्मस्था
    सोमभूषणा । सङ्ग्रामजयदा साध्वी सृष्टिस्थितिविनाशिनी ॥ १६५॥ सर्वेशा सर्वरोगघ्नी सर्वग्रहविनाशिनी ।
    सदसद्रूपिणी सत्ता स्वस्तिरूपा सरस्वती ॥ १६६॥ ह्रदिनी हरवाग्जाता हरहासास्यनिःसृता । हृत्पद्मवासिनी
    हृष्टा ग्रहराक्षसनिग्रहा ॥ १६७॥ हंसस्था हंसरूपा च हंसमूर्तिर्हरप्रिया । हिङ्गुला हंसदेवी च हाकिनी
    हरवल्लभा ॥ १६८॥ हंसेश्वरी हकारात्मा हंसीगतिश्च हासिनी । हरवक्त्रोद्भवा हंसी हरिवन्द्या हरिप्रिया ॥
    १६९॥ हेमाभा हिमवत्पुत्री हिमकोटीतपस्विनी । हिमाद्रितुङ्गसानोर्हि पतन्ती हिमशीकरा ॥ १७०॥ क्षोणीश्वरी
    क्षमारूपा क्षणदेश्वरशेखरा । क्षीणक्षेमङ्करी साक्षात्क्षोभिणी क्षितिवाहिनी ॥ १७१॥ क्षामोदरी क्षमा क्षीणा
    यक्षेश्वरी सुदक्षिणा । क्षेमङ्करी क्षणाभाङ्गी क्षौममाम्बरी क्षणप्रभा ॥ १७२॥ क्षेत्रज्ञा क्षेमदा क्षीणा
    अक्षयाक्षेयभृङ्गिणी । क्षेत्रस्था क्षेत्रदेहा च मोक्षदा क्षीप्रवाहिणी ॥ १७३॥ इत्येतत्कथितं नाम्नां
    सहस्त्रं सुरदुर्ल्लभम् । पुण्यात्पुण्यतरन्नाम वाग्मत्या नारदाञ्जसा ॥ १७४॥ वर्णितं त्रिदशैः पूर्वं
    ब्रह्मविष्णुमहेश्वरैः । सुधामयानि नामानि वाग्मत्या महिमानि च ॥ १७५॥ सावधानपरो विप्र पाठकानां विशेषतः
    । दूरस्थानामशक्तानां वक्ष्यामि तज्जलाप्लवम् ॥ १७६॥ एकधा पाठकस्तस्यां स्नानोद्भवफलं लभेत् । द्विधा
    च पठनात्स्नाता मनोवाञ्छाफलं लभेत् ॥ १७७॥ त्रिधा प्रपठनात्स्नात्वा भोग्यार्थी भोग्यमाप्नुयात् । चतुर्था
    पठनात्सौख्यं पञ्चधा धनमाप्नुयात् ॥ १७८॥ षड्धा पाठाद्धि कीर्तिः स्यात्प्रभुत्वं सप्तधा तथा । अष्टधा
    पठनात्सद्य ऐश्वर्यत्वं फलं लभेत् ॥ १७९॥ नवधा चैव वाक्
