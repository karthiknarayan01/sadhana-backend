id: devaihkritamkartikeyastotram
category: stotram
name:
  english: devaihkritamkartikeyastotram
  devanagari: देवैःकृतंकार्तिकेयस्तोत्रम्
content:
  english: devaih kritam kartikeyastotram 3 deva ucuh | namah kalyanarupaya namaste vishvamangala | vishvabandho
    namaste'stu namaste vishvabhavana || 2|| namo'stu te danavavaryahantre banasurapranaharaya deva |
    pralambanashaya pavitrarupine namonamashshankaratata tubhyam || 3|| tvameva kartta jagatam ca bhartta
    tvameva hartta shucija prasida | prapancabhutastava lokabimbah prasida shambhvatmaja dinabandho ||
    4|| devarakshakara svaminraksha nassarvada prabho | devapranavana kara prasida karunakara || 5|| hatva
    te tarakam daityam parivarayutam vibho | mocitassakala deva vipadbhyah parameshvara || 6|| iti shivapurane
    rudrasamhitayam kumarakhande shashthadhyayantargatam devaih kritam kartikeyastotram samaptam | shivapurana
    | rudrasamhita | kumarakhanda | adhyaya 12
  devanagari: देवैः कृतं कार्तिकेयस्तोत्रम् ३ देवा ऊचुः । नमः कल्याणरूपाय नमस्ते विश्वमङ्गल । विश्वबन्धो
    नमस्तेऽस्तु नमस्ते विश्वभावन ॥ २॥ नमोऽस्तु ते दानववर्यहन्त्रे बाणासुरप्राणहराय देव । प्रलम्बनाशाय
    पवित्ररूपिणे नमोनमश्शङ्करतात तुभ्यम् ॥ ३॥ त्वमेव कर्त्ता जगतां च भर्त्ता त्वमेव हर्त्ता शुचिज प्रसीद
    । प्रपञ्चभूतस्तव लोकबिम्बः प्रसीद शम्भ्वात्मज दीनबन्धो ॥ ४॥ देवरक्षाकर स्वामिन्रक्ष नस्सर्वदा प्रभो
    । देवप्राणावन कर प्रसीद करुणाकर ॥ ५॥ हत्वा ते तारकं दैत्यं परिवारयुतं विभो । मोचितास्सकला देवा विपद्भ्यः
    परमेश्वर ॥ ६॥ इति शिवपुराणे रुद्रसंहितायां कुमारखण्डे षष्ठाध्यायान्तर्गतं देवैः कृतं कार्तिकेयस्तोत्रं
    समाप्तम् । शिवपुराण । रुद्रसंहिता । कुमारखण्ड । अध्याय १२
