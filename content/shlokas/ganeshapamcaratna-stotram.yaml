id: ganeshapamcaratna-stotram
category: stotram
name:
  english: ganeshapamcaratna stotram
  devanagari: गणेशपंचरत्न स्तोत्रम्
content:
  english: mudakaratta modakam sada vimuktisadhakam | kaladharavatamsakam vilasi lokarakshakam | anayakaika
    nayakam vinashitebhadaityakam | natashubhashunashakam namami tam vinayakam ||1|| natetaratibhikaram
    navoditarkabhasvaram | namatsurari nirjaram natadhikapaduddharam | sureshvaram nidhishvaram gajeshvaram
    ganeshvaram | maheshvaram tamashraye paratparam nirantaram ||2|| samasta lokasamkaram nirastadaityakumjaram|
    daretarodaram varam varebhavaktramaksharam| kripakaram kshamakaram mudakaram yashaskaram | manaskaram
    namaskritam namaskaromi bhasvaram||3|| akimcanartimarjanam cirantanokti bhajanam | puraripurva nandanam
    surari garvacarvanam| prapamca nashabhishanam dhanamjayadi bhushanam| kapoladanavaranam bhaje puranavaranam
    ||4|| nitantakantadantakanti
  devanagari: मुदाकरात्त मोदकं सदा विमुक्तिसाधकम् । कलाधरावतंसकं विलासि लोकरक्षकम् । अनायकैक नायकं विनाशितेभदैत्यकम्
    । नताशुभाशुनाशकं नमामि तं विनायकम् ।।१।। नतेतरातिभीकरं नवोदितार्कभास्वरम् । नमत्सुरारि निर्जरं नताधिकापदुद्धरम्
    । सुरेश्वरं निधीश्वरं गजेश्वरं गणेश्वरं । महेश्वरं तमाश्रये परात्परं निरन्तरम् ।।२।। समस्त लोकसंकरं
    निरस्तदैत्यकुंजरम्। दरेतरोदरं वरं वरेभवक्त्रमक्षरम्। कृपाकरं क्षमाकरं मुदाकरं यशस्करम् । मनस्करं नमस्कृतां
    नमस्करोमि भास्वरम्।।३।। अकिंचनार्तिमार्जनं चिरन्तनोक्ति भाजनम् । पुरारिपूर्व नन्दनं सुरारि गर्वचर्वणम्।
    प्रपंच नाशभीषणं धनंजयादि भूषणम्। कपोलदानवारणं भजे पुराणवारणम् ।।४।। नितान्तकान्तदन्तकान्ति
