id: ramadevikritamkamadevastotram
category: stotram
name:
  english: ramadevikritamkamadevastotram
  devanagari: रमादेवीकृतंकामदेवस्तोत्रम्
content:
  english: ramadevikritam kamadevastotram om hram hrim hrum om namo bhagavate hrishikeshaya sarvagunavisheshairvilakshitatmane
    akutinam cittinam cetasam visheshanam cadhipataye shodashakalaya cchandomayayannamayayamritamayaya
    sarvamayaya sahase ojase balaya kantaya kamaya namaste ubhayatra bhuyat || 18|| striyo vrataistva
    hrishikeshvaram svato hyaradhya loke patimashasate'nyam | tasam na te vai paripantyapatyam priyam
    dhanayumshi yato'svatantrah || 19|| sa vai patih syadakutobhayah svayam samantatah pati bhayaturam
    janam | sa eka evetaratha mitho bhayam naivatmalabhadadhi manyate param || 20|| ya tasya te padasaroruharhanam
    nikamayetsakhilakamalampata | tadeva rasipsitamipsito'rcito yadbhagnayacna bhagavan pratapyate ||
    21|| matpraptaye'jeshasurasuradaya
  devanagari: रमादेवीकृतं कामदेवस्तोत्रम् ॐ ह्रां ह्रीं ह्रूं ॐ नमो भगवते हृषीकेशाय सर्वगुणविशेषैर्विलक्षितात्मने
    आकूतीनां चित्तीनां चेतसां विशेषाणां चाधिपतये षोडशकलाय च्छन्दोमयायान्नमयायामृतमयाय सर्वमयाय सहसे ओजसे
    बलाय कान्ताय कामाय नमस्ते उभयत्र भूयात् ॥ १८॥ स्त्रियो व्रतैस्त्वा हृषीकेश्वरं स्वतो ह्याराध्य लोके
    पतिमाशासतेऽन्यम् । तासां न ते वै परिपान्त्यपत्यं प्रियं धनायूंषि यतोऽस्वतन्त्राः ॥ १९॥ स वै पतिः स्यादकुतोभयः
    स्वयं समन्ततः पाति भयातुरं जनम् । स एक एवेतरथा मिथो भयं नैवात्मलाभादधि मन्यते परम् ॥ २०॥ या तस्य ते
    पादसरोरुहार्हणं निकामयेत्साखिलकामलम्पटा । तदेव रासीप्सितमीप्सितोऽर्चितो यद्भग्नयाच्ञा भगवन् प्रतप्यते
    ॥ २१॥ मत्प्राप्तयेऽजेशसुरासुरादय
