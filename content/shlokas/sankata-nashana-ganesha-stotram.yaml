id: sankata-nashana-ganesha-stotram
category: stotram
name:
  english: Sankata Nashana Ganesha Stotram
content:
  english: narada uvaca | pranamya shirasa devam gauriputram vinayakam | bhaktavasam smarennityamayushkamarthasiddhaye
    || || prathamam vakratundam ca ekadantam dvitiyakam | tritiyam krishnapingaksham gajavaktram caturthakam
    || shashtham vikatameva ca | saptamam vighnarajam ca dhumravarnam tathashtamam || dashamam tu vinayakam
    | ekadasham ganapatim dvadasham tu gajananam || || dvadashaitani namani trisandhyam yah pathennarah
    | na ca vighnabhayam tasya sarvasiddhikaram param || || vidyarthi labhate vidyam dhanarthi labhate
    dhanam | putrarthi labhate putranmoksharthi labhate gatim || || japedganapatistotram shadbhirmasaih
    phalam labhet | samvatsarena siddhim ca labhate natra samshayah || || ashtabhyo brahmanebhyashca likhitva
    yah samarpayet | tasya vidya bhavetsarva ganeshasya prasadatah || || iti shrinaradapurane sankashtanashanam
    nama ganesha stotram |
  devanagari: नारद उवाच । प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् । भक्तावासं स्मरेन्नित्यमायुष्कामार्थसिद्धये
    ॥ ॥ प्रथमं वक्रतुण्डं च एकदन्तं द्वितीयकम् । तृतीयं कृष्णपिङ्गाक्षं गजवक्त्रं चतुर्थकम् ॥ षष्ठं विकटमेव
    च । सप्तमं विघ्नराजं च धूम्रवर्णं तथाष्टमम् ॥ दशमं तु विनायकम् । एकादशं गणपतिं द्वादशं तु गजाननम्
    ॥ ॥ द्वादशैतानि नामानि त्रिसन्ध्यं यः पठेन्नरः । न च विघ्नभयं तस्य सर्वसिद्धिकरं परम् ॥ ॥ विद्यार्थी
    लभते विद्यां धनार्थी लभते धनम् । पुत्रार्थी लभते पुत्रान्मोक्षार्थी लभते गतिम् ॥ ॥ जपेद्गणपतिस्तोत्रं
    षड्भिर्मासैः फलं लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥ ॥ अष्टभ्यो ब्राह्मणेभ्यश्च लिखित्वा
    यः समर्पयेत् । तस्य विद्या भवेत्सर्वा गणेशस्य प्रसादतः ॥ ॥ इति श्रीनारदपुराणे सङ्कष्टनाशनं नाम गणेश
    स्तोत्रम् ।
