id: cakrarajastotra
category: stotram
name:
  english: cakrarajastotra
  devanagari: चक्रराजस्तोत्र
content:
  english: loke khyata maharajni namna dakshinakalika | agameshu mahashaktih khyata shribhuvaneshvari
    || 2|| mahagupta guhyakali namna shastreshu kirtita | mahogratara nirdishta mahajnapteti bhutale ||
    3|| mahananda kubjika syat loke'tra jagadambika | trishaktyadya'tra camunda mahaspanda prakirtita
    || 4|| mahamahashaya prokta bala tripurasundari | shricakrarajah samproktastribhagena maheshvari ||
    5|| brahmibhuta pujya shrisvami vidyaranya ki kripa se prapta hindi anuvada pancadashi vidya mahatripurasundari
    aura shrimahashodashi vidya sadaiva mahamaheshvari kahi gai haim | shridakshina kali ko maharajni
    nama se kaha gaya hai aura shri bhuvaneshvari agamom mem mahashakti nama se prasiddha haim | shastrom
    mem guhyakali nama se mahagupta ka varnana hai aura prithvi para mahogratara mahajnapta batai gai
    haim | jagadamba kubjika isa loka mem mahananda haim aura trishaktyatmika adya camunda mahaspanda
    kahi gai haim | bala tripurasundari mahamahashaya kahi gai haim | he maheshvara
  devanagari: लोके ख्याता महाराज्ञी नाम्ना दक्षिणकालिका । आगमेषु महाशक्तिः ख्याता श्रीभुवनेश्वरी ॥ २॥
    महागुप्ता गुह्यकाली नाम्ना शास्त्रेषु कीर्तिता । महोग्रतारा निर्दिष्टा महाज्ञप्तेति भूतले ॥ ३॥ महानन्दा
    कुब्जिका स्यात् लोकेऽत्र जगदम्बिका । त्रिशक्त्याद्याऽत्र चामुण्डा महास्पन्दा प्रकीर्तिता ॥ ४॥ महामहाशया
    प्रोक्ता बाला त्रिपुरसुन्दरी । श्रीचक्रराजः सम्प्रोक्तस्त्रिभागेन महेश्वरि ॥ ५॥ ब्रह्मीभूत पूज्य श्रीस्वामी
    विद्यारण्य की कृपा से प्राप्त हिन्दी अनुवाद पञ्चदशी विद्या महात्रिपुरसुन्दरी और श्रीमहाषोडशी विद्या
    सदैव महामाहेश्वरी कही गई हैं । श्रीदक्षिणा काली को महाराज्ञी नाम से कहा गया है और श्री भुवनेश्वरी
    आगमों में महाशक्ति नाम से प्रसिद्ध हैं । शास्त्रों में गुह्यकाली नाम से महागुप्ता का वर्णन है और पृथ्वी
    पर महोग्रतारा महाज्ञप्ता बताई गई हैं । जगदम्बा कुब्जिका इस लोक में महानन्दा हैं और त्रिशक्त्यात्मिका
    आद्या चामुण्डा महास्पन्दा कही गई हैं । बाला त्रिपुरसुन्दरी महामहाशया कही गई हैं । हे महेश्वर
