id: lakshminrisimhadvadashanamastotram
category: stotram
name:
  english: lakshminrisimhadvadashanamastotram
  devanagari: लक्ष्मीनृसिंहद्वादशनामस्तोत्रम्
content:
  english: prasannavadanam bhushasahasrojvalam | tryaksham cakrapinakasabhayabarabibhranamarkachavim chatribhutaphanindra
    bindudhavalam lakshminrisimham bhaje || 1|| manasopacaraih sampujyam | prathamastu mahajvalodvitiyamugrakesari
    | vajranakhastritiyastu caturthashca vidaranah || simhasya pancamam caiva shashtham ca arimardanam
    | saptamam ripuhantaca ashtamam devavallabhah || prahladavarado navamam dashamam nriharistatha | ekadasham
    maharaudrah dvadasham karunanidhih || etani dvadashanamani nrisimhasya mahatmanah | mantrarajeti vikhyatah
    sarvapapaharam param || kshayapasmarakushthyadi tapa jvaranivaranam | rajadvare pathe ghore sangrame
    shatrusankate || girikananasanghate vyaghracorabhayam haret | iti shribrahmapurane uttarakhande shri
    lakshminrisimha dvadashanamastotram sampurnamastu ||
  devanagari: प्रसन्नवदनं भूषासहस्रोज्वलम् । त्र्यक्षं चक्रपिनाकसाभयबराबिभ्राणमर्कछविम् छत्रीभूतफणीन्द्र
    बिन्दुधवलं लक्ष्मीनृसिंहं भजे ॥ १॥ मानसोपचारैः सम्पूज्यम् । प्रथमस्तु महाज्वालोद्वितीयमुग्रकेसरी ।
    वज्रनखस्तृतीयस्तु चतुर्थश्च विदारणः ॥ सिंहस्य पञ्चमं चैव षष्ठं च अरिमर्दनम् । सप्तमं रिपुहन्ताच अष्टमं
    देववल्लभः ॥ प्रह्लादवरदो नवमं दशमं नृहरिस्तथा । एकादशं महारौद्रः द्वादशं करुणानिधिः ॥ एतानि द्वादशनामानि
    नृसिंहस्य महात्मनः । मन्त्रराजेति विख्यातः सर्वपापहरं परम् ॥ क्षयापस्मारकुष्ठ्यादि ताप ज्वरनिवारणम्
    । राजद्वारे पथे घोरे सङ्ग्रामे शत्रुसङ्कटे ॥ गिरिकाननसङ्घाते व्याघ्रचोरभयं हरेत् । इति श्रीब्रह्मपुराणे
    उत्तरखण्डे श्री लक्ष्मीनृसिंह द्वादशनामस्तोत्रं सम्पूर्णमस्तु ॥
