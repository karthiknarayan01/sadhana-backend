id: taratakaradisahasranamastotra-2
category: sahasranama
name:
  english: taratakaradisahasranamastotra
  devanagari: तारातकारादिसहस्रनामस्तोत्र
content:
  english: rinu vatsa pravakshyami rahasyam sarvasiddhidam | yasyopadeshamatrena tava siddhirbhavishyati
    || 2|| mahapralayakaladau nashte sthavarajangame | mahakaram samakarnya kripaya samhritantanau ||
    3|| namna tena mahatara khyata sa brahmarupini | mahashulatrayankritva tatra caikakini sthita || 4||
    punah srishteshcikirshabhuddivyasamrajyasanjnakam | namnam sahasramasyastu takaradyam maya smritam
    || 5|| tatprabhavena brahmandannirmitam sudridham mahat | avirbhuta vayantatra yantraistasyah pura
    dvija || 6|| svasya karyarthinastatra bhranta bhumyayatha vayam | tayopadishtah kripaya bhavamassrishtikarakah
    || 7|| tasyah prasadadviprendra trayo brahmandanayakah | anye suraganassarve tasyah padaprasevakah
    || 8|| pathanaddharanatsrishteh kartahampalako harih | tattvaksharopadeshena samharta shankarassvayam
    || 9|| rishicchandadikadhyanam mulavatparikirtitam | niyogomatrasiddhau ca purusharthacatushtaye ||
