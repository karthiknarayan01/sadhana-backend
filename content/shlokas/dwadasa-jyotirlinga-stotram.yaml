id: dwadasa-jyotirlinga-stotram
category: stotram
name:
  english: Dwadasa Jyotirlinga Stotram
content:
  english: laghu stotram saurashtre somanadhanca shrishaile mallikarjunam | ujjayinyam mahakalam onkaretvamamaleshvaram
    || parlyam vaidyanadhanca dhakinyam bhima shankaram | setubandhetu ramesham nagesham darukavane ||
    varanashyantu vishvesham trayambakam gautamitate | himalayetu kedaram ghrishneshantu vishalake ||
    etani jyotirlingani sayam pratah pathennarah | sapta janma kritam papam smaranena vinashyati || sampurna
    stotram saurashtradeshe vishade'tiramye jyotirmayam candrakalavatamsam | bhaktapradanaya kripavatirnam
    tam somanatham sharanam prapadye || || shrishailashringe vividhaprasange sheshadrishringe'pi sada
    vasantam | tamarjunam mallikapurvamenam namami samsarasamudrasetum || || avantikayam vihitavataram
    muktipradanaya ca sajjananam | akalamrityoh parirakshanartham vande mahakalamahasuresham || || kaverikanarmadayoh
    pavitre samagame sajjanataranaya | sadaiva mandhatripure vasantam onkaramisham shivamekamide || ||
    purvottare prajvalikanidhane sada vasam tam girijasametam | surasuraradhitapadapadmam shrivaidyanatham
    tamaham namami || || yam dakinishakinikasamaje nishevyamanam pishitashanaishca | sadaiva bhimadipadaprasiddham
    tam shankaram bhaktahitam namami || || shritamraparnijalarashiyoge nibadhya setum vishikhairasankhyaih
    | shriramacandrena samarpitam tam rameshvarakhyam niyatam namami || || yamye sadange nagare'tiramye
    vibhushitangam vividhaishca bhogaih | sadbhaktimuktipradamishamekam shrinaganatham sharanam prapadye
    || || sanandamanandavane vasantam anandakandam hatapapabrindam | varanasinathamanathanatham shrivishvanatham
    sharanam prapadye || || sahyadrishirshe vimale vasantam godavaritirapavitradeshe | yaddarshanat patakam
    pashu nasham prayati tam tryambakamishamide || || mahadriparshve ca tate ramantam sampujyamanam satatam
    munindraih | surasurairyaksha mahoragadhyaih kedaramisham shivamekamide || || ilapure ramyavishalake'smin
    samullasantam ca jagadvarenyam | vande mahodaratarasvabhavam ghrishneshvarakhyam sharanam prapadye
    || || jyotirmayadvadashalingakanam shivatmanam proktamidam kramena | stotram pathitva manujo'tibhaktya
    phalam tadalokya nijam bhajecca ||
  devanagari: लघु स्तोत्रम् सौराष्ट्रे सोमनाधञ्च श्रीशैले मल्लिकार्जुनम् । उज्जयिन्यां महाकालं ओङ्कारेत्वमामलेश्वरम्
    ॥ पर्ल्यां वैद्यनाधञ्च ढाकिन्यां भीम शङ्करम् । सेतुबन्धेतु रामेशं नागेशं दारुकावने ॥ वारणाश्यान्तु
    विश्वेशं त्रयम्बकं गौतमीतटे । हिमालयेतु केदारं घृष्णेशन्तु विशालके ॥ एतानि ज्योतिर्लिङ्गानि सायं प्रातः
    पठेन्नरः । सप्त जन्म कृतं पापं स्मरणेन विनश्यति ॥ सम्पूर्ण स्तोत्रम् सौराष्ट्रदेशे विशदेऽतिरम्ये ज्योतिर्मयं
    चन्द्रकलावतंसम् । भक्तप्रदानाय कृपावतीर्णं तं सोमनाथं शरणं प्रपद्ये ॥ ॥ श्रीशैलशृङ्गे विविधप्रसङ्गे
    शेषाद्रिशृङ्गेऽपि सदा वसन्तम् । तमर्जुनं मल्लिकपूर्वमेनं नमामि संसारसमुद्रसेतुम् ॥ ॥ अवन्तिकायां विहितावतारं
    मुक्तिप्रदानाय च सज्जनानाम् । अकालमृत्योः परिरक्षणार्थं वन्दे महाकालमहासुरेशम् ॥ ॥ कावेरिकानर्मदयोः
    पवित्रे समागमे सज्जनतारणाय । सदैव मान्धातृपुरे वसन्तं ओङ्कारमीशं शिवमेकमीडे ॥ ॥ पूर्वोत्तरे प्रज्वलिकानिधाने
    सदा वसं तं गिरिजासमेतम् । सुरासुराराधितपादपद्मं श्रीवैद्यनाथं तमहं नमामि ॥ ॥ यं डाकिनिशाकिनिकासमाजे
    निषेव्यमाणं पिशिताशनैश्च । सदैव भीमादिपदप्रसिद्धं तं शङ्करं भक्तहितं नमामि ॥ ॥ श्रीताम्रपर्णीजलराशियोगे
    निबध्य सेतुं विशिखैरसङ्ख्यैः । श्रीरामचन्द्रेण समर्पितं तं रामेश्वराख्यं नियतं नमामि ॥ ॥ याम्ये सदङ्गे
    नगरेऽतिरम्ये विभूषिताङ्गं विविधैश्च भोगैः । सद्भक्तिमुक्तिप्रदमीशमेकं श्रीनागनाथं शरणं प्रपद्ये ॥
    ॥ सानन्दमानन्दवने वसन्तं आनन्दकन्दं हतपापबृन्दम् । वाराणसीनाथमनाथनाथं श्रीविश्वनाथं शरणं प्रपद्ये
    ॥ ॥ सह्याद्रिशीर्षे विमले वसन्तं गोदावरितीरपवित्रदेशे । यद्दर्शनात् पातकं पाशु नाशं प्रयाति तं त्र्यम्बकमीशमीडे
    ॥ ॥ महाद्रिपार्श्वे च तटे रमन्तं सम्पूज्यमानं सततं मुनीन्द्रैः । सुरासुरैर्यक्ष महोरगाढ्यैः केदारमीशं
    शिवमेकमीडे ॥ ॥ इलापुरे रम्यविशालकेऽस्मिन् समुल्लसन्तं च जगद्वरेण्यम् । वन्दे महोदारतरस्वभावं घृष्णेश्वराख्यं
    शरणं प्रपद्ये ॥ ॥ ज्योतिर्मयद्वादशलिङ्गकानां शिवात्मनां प्रोक्तमिदं क्रमेण । स्तोत्रं पठित्वा मनुजोऽतिभक्त्या
    फलं तदालोक्य निजं भजेच्च ॥
