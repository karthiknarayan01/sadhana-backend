id: devaihkritam03vishnustotram
category: stotram
name:
  english: devaihkritam03vishnustotram
  devanagari: देवैःकृतं०३विष्णुस्तोत्रम्
content:
  english: devaih kritam 3 vishnustotram deva ucuh | narayanaksharananta sharanagatapalaka | mrikandutapasa
    trastan pahi nah sharanagatan || 55|| jaya devadhidevesha jaya shankhagadadhara | jayo lokasvarupaya
    jayo brahmandahetave || 56|| namaste devadevesha namaste lokapavana | namaste lokanathaya namaste
    lokasakshine || 57|| namaste dhyanagamyaya namaste dhyanahetave | namaste dhyanarupaya namaste dhyanasakshine
    || 58|| keshihantre namastubhyam madhuhantre paratmane | namo bhumyadirupaya namashcaitanyarupine
    || 59|| namo jyeshthaya shuddhaya nirgunaya gunatmane | arupaya svarupaya bahurupaya te namah || 60||
    namo brahmanyadevaya gobrahmanahitaya ca | jagaddhitaya krishnaya govindaya namo namah || 61|| namo
    hiranyagarbhaya namo brahmadirupine | namah suryadirupaya havyakavyabhuje namah || 62|| namo nityaya
    vandyaya sadanandaikarupine | namah smritartinashaya bhuyo bhuyo namo namah || 63|| evam devastutim
    shrutva bhagavan kamalapatih | pratyakshatamagattesham shankhacakragadadharah || 64|| iti naradapurane
    purvabhage caturthadhyayantargatam devaih kritam vishnustotram samaptam | brihannaradiyapurana | purvabhaga
    | adhyaya 4
  devanagari: देवैः कृतं ३ विष्णुस्तोत्रम् देवा ऊचुः । नारायणाक्षरानन्त शरणागतपालक । मृकण्डुतपसा त्रस्तान्
    पाहि नः शरणागतान् ॥ ५५॥ जय देवाधिदेवेश जय शङ्खगदाधर । जयो लोकस्वरूपाय जयो ब्रह्माण्डहेतवे ॥ ५६॥ नमस्ते
    देवदेवेश नमस्ते लोकपावन । नमस्ते लोकनाथाय नमस्ते लोकसाक्षिणे ॥ ५७॥ नमस्ते ध्यानगम्याय नमस्ते ध्यानहेतवे
    । नमस्ते ध्यानरूपाय नमस्ते ध्यानसाक्षिणे ॥ ५८॥ केशिहन्त्रे नमस्तुभ्यं मधुहन्त्रे परात्मने । नमो भूम्यादिरूपाय
    नमश्चैतन्यरूपिणे ॥ ५९॥ नमो ज्येष्ठाय शुद्धाय निर्गुणाय गुणात्मने । अरूपाय स्वरूपाय बहुरूपाय ते नमः
    ॥ ६०॥ नमो ब्रह्मण्यदेवाय गोब्राह्मणहिताय च । जगद्धिताय कृष्णाय गोविन्दाय नमो नमः ॥ ६१॥ नमो हिरण्यगर्भाय
    नमो ब्रह्मादिरूपिणे । नमः सूर्यादिरूपाय हव्यकव्यभुजे नमः ॥ ६२॥ नमो नित्याय वन्द्याय सदानन्दैकरूपिणे
    । नमः स्मृतार्तिनाशाय भूयो भूयो नमो नमः ॥ ६३॥ एवं देवस्तुतिं श्रुत्वा भगवान् कमलापतिः । प्रत्यक्षतामगात्तेषां
    शङ्खचक्रगदाधरः ॥ ६४॥ इति नारदपुराणे पूर्वभागे चतुर्थाध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं समाप्तम्
    । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ४
