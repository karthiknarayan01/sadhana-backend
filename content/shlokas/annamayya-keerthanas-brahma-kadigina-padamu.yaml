id: annamayya-keerthanas-brahma-kadigina-padamu
category: stotram
name:
  english: Annamayya Keerthanas Brahma Kadigina Padamu
content:
  english: adi pallavi brahma kadigina padamu brahmamu danè ni padamu || caranam cèlagi vasudha gòlicina
    ni padamu bali tala mopina padamu | talakaga gaganamu tannina padamu balaripu gacina padamu || brahma
    kadigina padamu kamini papamu kadigina padamu pamutala nidina padamu | premapu shrisati pisikèdi padamu
    pamidi turagapu padamu || brahma kadigina padamu parama yogulaku pari pari vidhamula paramòsagèdi
    ni padamu | tiruvenkatagiri tiramani cupina parama padamu ni padamu || brahma kadigina padamu brahmamu
    danè ni padamu ||
  devanagari: आदि पल्लवि ब्रह्म कडिगिन पादमु ब्रह्ममु दानॆ नी पादमु ॥ चरणं चॆलगि वसुध गॊलिचिन नी पादमु
    बलि तल मोपिन पादमु । तलकग गगनमु तन्निन पादमु बलरिपु गाचिन पादमु ॥ ब्रह्म कडिगिन पादमु कामिनि पापमु
    कडिगिन पादमु पामुतल निडिन पादमु । प्रेमपु श्रीसति पिसिकॆडि पादमु पामिडि तुरगपु पादमु ॥ ब्रह्म कडिगिन
    पादमु परम योगुलकु परि परि विधमुल परमॊसगॆडि नी पादमु । तिरुवेङ्कटगिरि तिरमनि चूपिन परम पदमु नी पादमु
    ॥ ब्रह्म कडिगिन पादमु ब्रह्ममु दानॆ नी पादमु ॥
