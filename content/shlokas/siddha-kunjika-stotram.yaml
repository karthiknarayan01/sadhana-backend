id: siddha-kunjika-stotram
category: stotram
name:
  english: Siddha Kunjika Stotram
content:
  english: om asya shrikunjikastotramantrasya sadashiva rishih shritrigunatmika devata mama sarvabhishtasiddhyarthe
    jape viniyogah | shiva uvaca shrinu devi pravakshyami kunjikastotramuttamam | yena mantraprabhavena
    candijapah shubho bhavet || || na kavacam nargalastotram kilakam na rahasyakam | na suktam napi dhyanam
    ca na nyaso na ca varcanam || || kunjikapathamatrena durgapathaphalam labhet | ati guhyataram devi
    devanamapi durlabham || || gopaniyam prayatnena svayoniriva parvati | maranam mohanam vashyam stambhanoccatanadikam
    | pathamatrena samsiddhyet kunjikastotramuttamam || || atha mantrah | om aim hrim klim camundayai
    vicce | om glaum hum klim jum sah jvalaya jvalaya jvala jvala prajvala prajvala aim hrim klim camundayai
    vicce jvala ham sam lam ksham phat svaha || || iti mantrah | namaste rudrarupinyai namaste madhumardini
    | namah kaitabhaharinyai namaste mahishardini || || namaste shumbhahantryai ca nishumbhasuraghatini
    | jagratam hi mahadevi japam siddham kurushva me || || ainkari srishtirupayai hrinkari pratipalika
    | klinkari kamarupinyai bijarupe namo'stu te || || camunda candaghati ca yaikari varadayini | vicce
    cabhayada nityam namaste mantrarupini || || dham dhim dhum dhurjateh patni vam vim vum vagadhishvari
    | kram krim krum kalika devi sham shim shum me shubham kuru || || hum hum hunkararupinyai jam jam
    jam jambhanadini | bhram bhrim bhrum bhairavi bhadre bhavanyai te namo namah || || am kam cam tam
    tam pam yam sham vim dum aim vim ham ksham | dhijagram dhijagram trotaya trotaya diptam kuru kuru
    svaha || || pam pim pum parvati purna kham khim khum khecari tatha | sam sim sum saptashati devya
    mantrasiddhim kurushva me || || kunjikayai namo namah | idam tu kunjikastotram mantrajagartihetave
    | abhakte naiva datavyam gopitam raksha parvati || || yastu kunjikaya devi hinam saptashatim pathet
    | na tasya jayate siddhiraranye rodanam yatha || || iti shrirudrayamale gauritantre shivaparvatisamvade
    kunjikastotram sampurnam |
  devanagari: ॐ अस्य श्रीकुञ्जिकास्तोत्रमन्त्रस्य सदाशिव ऋषिः श्रीत्रिगुणात्मिका देवता मम सर्वाभीष्टसिद्ध्यर्थे
    जपे विनियोगः । शिव उवाच शृणु देवि प्रवक्ष्यामि कुञ्जिकास्तोत्रमुत्तमम् । येन मन्त्रप्रभावेण चण्डीजापः
    शुभो भवेत् ॥ ॥ न कवचं नार्गलास्तोत्रं कीलकं न रहस्यकम् । न सूक्तं नापि ध्यानं च न न्यासो न च वार्चनम्
    ॥ ॥ कुञ्जिकापाठमात्रेण दुर्गापाठफलं लभेत् । अति गुह्यतरं देवि देवानामपि दुर्लभम् ॥ ॥ गोपनीयं प्रयत्नेन
    स्वयोनिरिव पार्वति । मारणं मोहनं वश्यं स्तम्भनोच्चाटनादिकम् । पाठमात्रेण संसिद्ध्येत् कुञ्जिकास्तोत्रमुत्तमम्
    ॥ ॥ अथ मन्त्रः । ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे । ॐ ग्लौं हुं क्लीं जूं सः ज्वालय ज्वालय ज्वल
    ज्वल प्रज्वल प्रज्वल ऐं ह्रीं क्लीं चामुण्डायै विच्चे ज्वल हं सं लं क्षं फट् स्वाहा ॥ ॥ इति मन्त्रः
    । नमस्ते रुद्ररूपिण्यै नमस्ते मधुमर्दिनि । नमः कैटभहारिण्यै नमस्ते महिषार्दिनि ॥ ॥ नमस्ते शुम्भहन्त्र्यै
    च निशुम्भासुरघातिनि । जाग्रतं हि महादेवि जपं सिद्धं कुरुष्व मे ॥ ॥ ऐङ्कारी सृष्टिरूपायै ह्रीङ्कारी
    प्रतिपालिका । क्लीङ्कारी कामरूपिण्यै बीजरूपे नमोऽस्तु ते ॥ ॥ चामुण्डा चण्डघाती च यैकारी वरदायिनी ।
    विच्चे चाभयदा नित्यं नमस्ते मन्त्ररूपिणि ॥ ॥ धां धीं धूं धूर्जटेः पत्नी वां वीं वूं वागधीश्वरी । क्रां
    क्रीं क्रूं कालिका देवि शां शीं शूं मे शुभं कुरु ॥ ॥ हुं हुं हुङ्काररूपिण्यै जं जं जं जम्भनादिनी ।
    भ्रां भ्रीं भ्रूं भैरवी भद्रे भवान्यै ते नमो नमः ॥ ॥ अं कं चं टं तं पं यं शं वीं दुं ऐं वीं हं क्षम्
    । धिजाग्रं धिजाग्रं त्रोटय त्रोटय दीप्तं कुरु कुरु स्वाहा ॥ ॥ पां पीं पूं पार्वती पूर्णा खां खीं खूं
    खेचरी तथा । सां सीं सूं सप्तशती देव्या मन्त्रसिद्धिं कुरुष्व मे ॥ ॥ कुञ्जिकायै नमो नमः । इदं तु कुञ्जिकास्तोत्रं
    मन्त्रजागर्तिहेतवे । अभक्ते नैव दातव्यं गोपितं रक्ष पार्वति ॥ ॥ यस्तु कुञ्जिकया देवि हीनां सप्तशतीं
    पठेत् । न तस्य जायते सिद्धिररण्ये रोदनं यथा ॥ ॥ इति श्रीरुद्रयामले गौरीतन्त्रे शिवपार्वतीसंवादे कुञ्जिकास्तोत्रं
    सम्पूर्णम् ।
