name:
  english: bhagirathakritam2shivastotram
  devanagari: भगीरथकृतं२शिवस्तोत्रम्
content:
  english: 97|| iti naradapurane purvabhage shodashadhyayantargatam bhagirathakritam shivastotram samaptam
    | brihannaradiyapurana | purvabhaga | adhyaya 16
  devanagari: ९७॥ इति नारदपुराणे पूर्वभागे षोडशाध्यायान्तर्गतं भगीरथकृतं शिवस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण
    । पूर्वभाग । अध्याय १६
