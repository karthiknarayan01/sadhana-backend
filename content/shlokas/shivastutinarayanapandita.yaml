id: shivastutinarayanapandita
category: stotram
name:
  english: shivastutinarayanapandita
  devanagari: शिवस्तुतिनारायणपण्डित
content:
  english: brihaspatirutappatih sasurasiddhavidyadharah | bhavatpadaparayanah shriyamimam yayuh prarthitam
    bhavan suratarurbhrisham shiva shivam shivavallabha || 8|| tava priyatamadatipriyatamam sadaivantaram
    payasyupahitam bhritam svayamiva shriyo vallabham | vibudhya laghubuddhayah svaparapakshalakshyayitam
    pathanti hi luthanti te shathahridah shuca shunthitah || 9|| nivasanilayacita tava shirastatirmalika
    kapalamapi te kare tvamashivosyanantardhiyam | tathapi bhavatah padam shivashivetyado jalpatam akincana
    na kincana vrijinamasti bhasmibhavet || 10|| tvameva kila kamadhuk sakalakamamapurayan sada trinayano
    bhavanvahati carcinetrodbhavam | visham vishadharandadhatpibasi tena canandavan viruddhacaritocita
    jagadadhisha te bhikshuta || 11|| namah shivashivashivashivashivartham krintashivam namo haraharaharaharaharantarim
    me drisham | namo bhavabhavabhavaprabhavabhutaye me bhavan namo mrida namo namo nama umesha tubhyam
    namah || 12|| satam shravanapaddhatim saratu sannatoktetyasau shivasya karunankuratpratikritatsada
    socita | iti prathitamanaso vyadhita nama narayanah shivastutimimam shivam likucisurisunuh sudhih
    || 13|| iti shrimallikucisurisununarayanapanditacaryaviracita shivastutih sampurna ||
  devanagari: बृहस्पतिरुताप्पतिः ससुरसिद्धविद्याधराः । भवत्पदपरायणाः श्रियमिमां ययुः प्रार्थितां भवान्
    सुरतरुर्भृशं शिव शिवां शिवावल्लभ ॥ ८॥ तव प्रियतमादतिप्रियतमं सदैवान्तरं पयस्युपहितं भृतं स्वयमिव श्रियो
    वल्लभम् । विबुध्य लघुबुद्धयः स्वपरपक्षलक्ष्यायितं पठन्ति हि लुठन्ति ते शठहृदः शुचा शुण्ठिताः ॥ ९॥
    निवासनिलयाचिता तव शिरस्ततिर्मालिका कपालमपि ते करे त्वमशिवोस्यनन्तर्धियाम् । तथापि भवतः पदं शिवशिवेत्यदो
    जल्पतां अकिञ्चन न किञ्चन वृजिनमस्ति भस्मीभवेत् ॥ १०॥ त्वमेव किल कामधुक् सकलकाममापूरयन् सदा त्रिनयनो
    भवान्वहति चार्चिनेत्रोद्भवम् । विषं विषधरान्दधत्पिबसि तेन चानन्दवान् विरुद्धचरितोचिता जगदधीश ते भिक्षुता
    ॥ ११॥ नमः शिवशिवाशिवाशिवशिवार्थं कृन्ताशिवं नमो हरहराहराहरहरान्तरीं मे दृशम् । नमो भवभवाभवप्रभवभूतये
    मे भवान् नमो मृड नमो नमो नम उमेश तुभ्यं नमः ॥ १२॥ सतां श्रवणपद्धतिं सरतु सन्नतोक्तेत्यसौ शिवस्य करुणाङ्कुरात्प्रतिकृतात्सदा
    सोचिता । इति प्रथितमानसो व्यधित नाम नारायणः शिवस्तुतिमिमां शिवं लिकुचिसूरिसूनुः सुधीः ॥ १३॥ इति श्रीमल्लिकुचिसूरिसूनुनारायणपण्डिताचार्यविरचिता
    शिवस्तुतिः सम्पूर्णा ॥
