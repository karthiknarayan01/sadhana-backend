id: aratrikamatharvavedaparishishta
category: veda
name:
  english: aratrikamatharvavedaparishishta
  devanagari: आरात्रिकमथर्ववेदपरिशिष्ट
content:
  english: 1|| pranipatya brihaspatimatharvanam purandarah | danavaih paribhuto'ham trahimamityuvaca ha
    || 2|| tato'savevamuktastu prabhutabalavardhanam | arogyadam bhutikaram kshudropadravanashanam ||
    3|| aratrikam hi kartavyam tasya tratumidam tada | kritva pishtamayam dipam suvartisnehasamyutam ||
    4|| atinihah pranyaniti dvabhyamenam pradipayet | patre sapushpe samsthapya sarshapamshca sahakshataih
    || 5|| priyangu shatapushpam ca durva caiva shatavarim | sapapaharinim bhutim tatraiva ca balim nyaset
    || 6|| apsarobhih parivrito gururgatva purandaram | praptasattvam sumanasamasane pramukham sthitam
    || 7|| preto yantvekashatam ca dipam samabhimantrayet | trih paribhramayedrajno mantrinatha sumangalam
    || 8|| shamyantyasya tato roga graha vighnavinayakah | svastyastu nriparashtraya svastigobrahmanaya
    ca || 9|| tatastu shankhadhvanina dipam grihitva sa toyadharamprayato'pi nirharet | purohito jyotishiko'pi
    va svayam hitaishini dhatryathavopakarita || 7
  devanagari: १॥ प्रणिपत्य बृहस्पतिमथर्वाणं पुरन्दरः । दानवैः परिभूतोऽहं त्राहिमामित्युवाच ह ॥ २॥ ततोऽसावेवमुक्तस्तु
    प्रभूतबलवर्धनम् । आरोग्यदं भूतिकरं क्षुद्रोपद्रवनाशनम् ॥ ३॥ आरात्रिकं हि कर्तव्यं तस्य त्रातुमिदं
    तदा । कृत्वा पिष्टमयं दीपं सुवर्तिस्नेहसंयुतम् ॥ ४॥ अतिनिहः प्रान्यानिति द्वाभ्यामेनं प्रदीपयेत् ।
    पात्रे सपुष्पे संस्थाप्य सर्षपांश्च सहाक्षतैः ॥ ५॥ प्रियङ्गु शतपुष्पां च दूर्वा चैव शतावरीम् । सपापहारिणीं
    भूतिं तत्रैव च बलिं न्यसेत् ॥ ६॥ अप्सरोभीः परिवृतो गुरुर्गत्वा पुरन्दरम् । प्राप्तासत्त्वं सुमनसमासने
    प्रमुखं स्थितम् ॥ ७॥ प्रेतो यन्त्वेकशतं च दीपं समभिमन्त्रयेत् । त्रिः परिभ्रामयेद्राज्ञो मन्त्रिणाथ
    सुमङ्गलम् ॥ ८॥ शाम्यन्त्यस्य ततो रोगा ग्रहा विघ्नविनायकाः । स्वस्त्यस्तु नृपराष्ट्राय स्वस्तिगोब्रह्मणाय
    च ॥ ९॥ ततस्तु शङ्खध्वनिना दीपं गृहीत्वा स तोयधाराम्प्रयतोऽपि निर्हरेत् । पुरोहितो ज्योतिषिकोऽपि वा
    स्वयं हितैषिणी धात्र्यथवोपकारिता ॥ ७
