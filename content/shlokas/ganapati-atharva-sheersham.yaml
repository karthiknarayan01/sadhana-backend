id: ganapati-atharva-sheersham
category: stotram
name:
  english: Ganapati Atharva Sheersham
content:
  english: shshrinuyama devah | bhadra mpashyemakshabhiryajatrah | sthirairangai stushthuvagm sastanubhih
    | vyashema devahitam ya~dayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti
    nastarkshyo arishtanemih | svasti no brihaspatirdadhatu || om shanti nnamaste ganapataye | tvameva
    pratyaksha ntattvamasi | tvameva kevala 'si | tvameva kevalam harta 'si | tvameva kevala mbrahmasi
    | tvam sakshadatma mmam | ava vaktaram | avanucanamava shishyam | ava pashcatta t | ava dakshinatta
    t | ava cordhvatta mpahi pahi samantat || ncinmayah | tvamanandamayastva mbrahmamayah | tvam saccidananda
    njnanamayo vijnanamayo ntvatto jayate | sarva ntvattastishthati | sarva ntvayi layameshyati | sarva
    ntvayi pratyeti | tva ngunatrayatitah | tvam avasthatrayatitah | tva ndehatrayatitah | tva nkalatrayatitah
    | tva 'si nityam | tvam shaktitrayatmakah | tvam yo~gino dhyayanti nityam | tva vi~shnustvam rudrastvamindrastvamagnistvam
    va~yustvam suryastva purvamuccarya varnadim stadanantaram | anusvarah paratarah | ardhe ndulasitam
    | tarena riddham | etattava manusvarupam | gakarah pu rvarupam | akaro madhyamarupam | anusvarashca
    ntyarupam | binduruttararupam | nadah sandhanam | sagmhita sandhih | saisha ganeshavidya | ganaka
    rishih | nicridgayatricchandah | shri mahaganapatirdevata | o || ekadantaya vidmahe vakratundaya dhimahi
    | tanno dantih pracodaya mpashamankushadharinam | rada nca varadam hastairbibhrana mmushakadhvajam
    | raktam la~mbodaram shurpakarnakam raktavasasam | raktagandhanuliptangam raktapushpai ssupujitam
    | bhaktanukampina njagatkaranamacyutam | avirbhuta nca srishtyadau prakriteh purushatparam | eva ndhyayati
    yo nityam sa yogi yoginam || namo vratapataye namo ganapataye namah pramathapataye namaste 'stu lambodarayaikadantaya
    vighnavinashine shivasutaya shrivaradamurtaye namah || 'dhite | sa brahmabhuyaya kalpate | sa sarvavighnai
    rna badhyate | sa sarvata ssukhamedhate | sa pancamahapapa tpramucyate | sayamadhiyano divasakrita
    nnashayati | prataradhiyano ratrikrita mpratah prayunjano papo 'papo bhavati | sarvatradhiyano 'pavighno
    bhavati | dharmarthakamamoksha nca vindati | idamatharvashir shamashishyaya na deyam | yo yadi mohad
    dasyati sa papiya nbhavati | sahasravartanadyam || anena ganapatimabhishincati | sa va gmi bhavati
    | caturthyamanashnan japati sa vidyava nbhavati | ityatharvanavakyam | brahmadyacaranam vi~dyanna
    bibheti kadacaneti || || yo durvankurairyajati sa vaishravanopamo bhavati | yo lajairyajati sa yashova
    nbhavati | yo modakasahasrena yajati sa vanchitaphalamavapnoti | ya ssajya samidbhiryajati sa sarvam
    || ashtau brahmanan samyag grahayitva suryavarcasvi bhavati | suryagrahe mahanadya mpratimasannidhau
    va japtva siddhamantro bhavati | mahavighna tpramucyate | mahadosha tpramucyate | mahapapa sa sarvavidbhavati
    sa sarvavidbhavati | ya evam ve~da | ityupanishat || shshrinuyama devah | bhadra mpashyemakshabhiryajatrah
    | sthirairangai stushthuvagm sastanubhih | vyashema devahitam ya~dayuh | svasti na indro vriddhashravah
    | svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu ||
    om shanti
  devanagari: श्शृणु॒याम॑ देवाः । भ॒द्र म्प॑श्येमा॒क्षभि॒र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्ठु॒वाग्ं स॑स्त॒नूभिः॑
    । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः
    । स्व॒स्ति न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु ॥ ॐ शान्ति॒ न्नम॑स्ते ग॒णप॑तये
    । त्वमे॒व प्र॒त्यक्ष॒ न्तत्त्व॑मसि । त्वमे॒व के॒वल॒ ऽसि । त्वमे॒व के॒वलं॒ हर्ता॑ ऽसि । त्वमे॒व के॒वल॒
    म्ब्रह्मा॒सि । त्वं साक्षादात्मा॑ म्माम् । अव॑ व॒क्तारम् । अवानूचानम॑व शि॒ष्यम् । अव॑ प॒श्चात्ता त्
    । अव॑ द॒क्षिणात्ता त् । अव॑ चो॒र्ध्वात्ता म्पाहि पाहि॑ सम॒न्तात् ॥ ञ्चिन्म॒यः । त्वमानन्दमय॑स्त्व
    म्ब्रह्म॒मयः । त्वं सच्चिदानन्दा ञ्ज्ञानमयो विज्ञान॑मयो॒ न्त्व॑त्तो जा॒यते । सर्व न्त्व॑त्तस्ति॒ष्ठति
    । सर्व न्त्वयि लय॑मेष्य॒ति । सर्व न्त्वयि॑ प्रत्ये॒ति । त्व ङ्गु॒णत्र॑याती॒तः । त्वं अवस्थात्र॑याती॒तः
    । त्व न्दे॒हत्र॑याती॒तः । त्व ङ्का॒लत्र॑याती॒तः । त्व ऽसि नि॒त्यम् । त्वं शक्तित्र॑यात्म॒कः । त्वां
    योँगिनो ध्याय॑न्ति नि॒त्यम् । त्व विँष्णुस्त्वं रुद्रस्त्वमिन्द्रस्त्वमग्निस्त्वं वाँयुस्त्वं सूर्यस्त्व
    पूर्व॑मुच्चा॒र्य॒ व॒र्णादीं स्तदन॒न्तरम् । अनुस्वारः प॑रत॒रः । अर्धे न्दुल॒सितम् । तारे॑ण ऋ॒द्धम्
    । एतत्तव मनु॑स्वरू॒पम् । गकारः पू र्वरू॒पम् । अकारो मध्य॑मरू॒पम् । अनुस्वारश्चा न्त्यरू॒पम् । बिन्दुरुत्त॑ररू॒पम्
    । नादः॑ सन्धा॒नम् । सग्ंहि॑ता स॒न्धिः । सैषा गणे॑शवि॒द्या । गण॑क ऋ॒षिः । निचृद्गाय॑त्रीच्छ॒न्दः ।
    श्री महागणपति॑र्देवता । ओ ॥ एकद॒न्ताय॑ वि॒द्महे॑ वक्रतु॒ण्डाय॑ धीमहि । तन्नो॑ दन्तिः प्रचो॒दया म्पा॒शम॑ङ्कुश॒धारि॑णम्
    । रद॑ ञ्च॒ वर॑दं ह॒स्तै॒र्बि॒भ्राण॑ म्मूष॒कध्व॑जम् । रक्तं॑ लँ॒म्बोद॑रं शू॒र्प॒कर्णकं॑ रक्त॒वास॑सम्
    । रक्त॑ग॒न्धानु॑लिप्ता॒ङ्गं॒ र॒क्तपु॑ष्पै स्सु॒पूजि॑तम् । भक्ता॑नु॒कम्पि॑न ञ्ज॒गत्का॑रण॒मच्यु॑तम्
    । आवि॑र्भू॒त ञ्च॑ सृ॒ष्ट्या॒दौ॒ प्र॒कृतेः पुरु॒षात्प॑रम् । एव॑ न्ध्या॒यति॑ यो नि॒त्यं॒ स॒ योगी॑ योगि॒नां
    ॥ नमो व्रातपतये नमो गणपतये नमः प्रमथपतये नमस्ते ऽस्तु लम्बोदरायैकदन्ताय विघ्नविनाशिने शिवसुताय श्रीवरदमूर्तये॒
    नमः ॥ ऽधी॒ते । स ब्रह्मभूया॑य क॒ल्पते । स सर्वविघ्नै र्न बा॒ध्यते । स सर्वत स्सुख॑मेध॒ते । स पञ्चमहापापा
    त्प्रमु॒च्यते । सा॒यम॑धीया॒नो॒ दिवसकृत न्नाश॒यति । प्रा॒तर॑धीया॒नो॒ रात्रिकृत म्प्रातः प्र॑युञ्जा॒नो॒
    पापो ऽपा॑पो भ॒वति । सर्वत्राधीयानो ऽपवि॑घ्नो भवति । धर्मार्थकाममोक्ष॑ ञ्च वि॒न्दति । इदमथर्वशीर् षमशिष्याय॑
    न दे॒यम् । यो यदि मो॑हाद् दा॒स्यति स पापी॑या न्भ॒वति । सहस्रावर्तनाद्यं ॥ अनेन गणपतिम॑भिषि॒ञ्चति ।
    स वा ग्मी भ॒वति । चतुर्थ्यामन॑श्नन् ज॒पति स विद्या॑वा न्भ॒वति । इत्यथर्व॑णवा॒क्यम् । ब्रह्माद्या॒चर॑णं
    विँ॒द्यान्न बिभेति कदा॑चने॒ति ॥ ॥ यो दूर्वाङ्कु॑रैर्य॒जति स वैश्रवणोप॑मो भ॒वति । यो ला॑जैर्य॒जति स
    यशो॑वा न्भ॒वति । यो मोदकसहस्रे॑ण य॒जति स वाञ्छितफलम॑वाप्नो॒ति । य स्साज्य समि॑द्भिर्य॒जति स सर्वं
    ॥ अष्टौ ब्राह्मणान् सम्यग् ग्रा॑हयि॒त्वा सूर्यवर्च॑स्वी भ॒वति । सूर्यग्रहे म॑हान॒द्या म्प्रतिमासन्निधौ
    वा ज॒प्त्वा सिद्धम॑न्त्रो भ॒वति । महाविघ्ना त्प्रमु॒च्यते । महादोषा त्प्रमु॒च्यते । महापापा स सर्व॑विद्भवति
    स सर्व॑विद्भ॒वति । य ए॑वं वेँ॒द । इत्यु॑प॒निष॑त् ॥ श्शृणु॒याम॑ देवाः । भ॒द्र म्प॑श्येमा॒क्षभि॒र्यज॑त्राः
    । स्थि॒रैरङ्गै स्तुष्ठु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः
    । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु
    ॥ ॐ शान्ति॒
