id: advaitanandastotram-brahmacarimedhacaitanyaviracitam
category: stotram
name:
  english: advaitanandastotram (brahmacarimedhacaitanyaviracitam)
  devanagari: अद्वैतानन्दस्तोत्रम् (ब्रह्मचारिमेधाचैतन्यविरचितम्)
content:
  english: iti prathadhrite tirthatane labdha supunya varmane || 1|| yuvanamevapi gurum priyam ciram vineya
    vriddha vrinate tapasvinah | tatha tvamadvaitaparabhinishthitah kshamo'bhiyane svaguroramayaya ||
    2|| tapah samadhau niratah sa sarvadaprijurbalishthah paramaptitarshukah | samapya karmani phaleshvanashrayo
    yatirniyamyendriyakayamanasah || 3|| yatashanah samyatabhashano vrati guroh kriyasadhanajagritiryami
    | ahanyanyakshayasiddhihetave cakara sarvam bhagavanniyantritah || 4|| pareyameva kritibhih samadrita'para
    ca vidya na tatha sushobhana | vivicya sadhuh sa param samadade na caparasyam ramate sma samyami ||
    5|| prasunasaragrahane samarato madhuvratatriptataya'sphutasvarah | paratmanityaptarasalayagraho munirna
    vacam vadati priyankarah || 6|| sasharadashribhagavadgadadhare manovacobhih sahadehameva sah | samarpayamasa
    virajya sarvatah sasampado bandhujanatmamitratah || 7|| svaparshadatvena vritastvamasyaho svayam
  devanagari: इति प्रथाधृते तीर्थाटने लब्ध सुपुण्य वर्मणे ॥ १॥ युवानमेवापि गुरुं प्रियं चिरं विनेय वृद्धा
    वृणते तपस्विनः । तथा त्वमद्वैतपराभिनिष्ठितः क्षमोऽभियाने स्वगुरोरमायया ॥ २॥ तपः समाधौ निरतः स सर्वदाप्रिजुर्बलिष्ठः
    परमाप्तितर्षुकः । समाप्य कर्माणि फलेष्वनाश्रयो यतिर्नियम्येन्द्रियकायमानसः ॥ ३॥ यताशनः संयतभाषणो व्रती
    गुरोः क्रियासाधनजागृतिर्यमी । अहन्यन्यक्षयसिद्धिहेतवे चकार सर्वं भगवन्नियन्त्रितः ॥ ४॥ परेयमेव कृतिभिः
    समादृताऽपरा च विद्या न तथा सुशोभना । विविच्य साधुः स परां समाददे न चापरस्यां रमते स्म संयमी ॥ ५॥ प्रसूनसारग्रहणे
    समारतो मधुव्रततृप्ततयाऽस्फुटस्वरः । परात्मनित्याप्तरसालयग्रहो मुनिर्न वाचं वदति प्रियङ्करः ॥ ६॥ सशारदश्रीभगवद्गदाधरे
    मनोवचोभिः सहदेहमेव सः । समर्पयामास विरज्य सर्वतः ससम्पदो बन्धुजनात्ममित्रतः ॥ ७॥ स्वपार्षदत्वेन वृतस्त्वमस्यहो
    स्वयं
