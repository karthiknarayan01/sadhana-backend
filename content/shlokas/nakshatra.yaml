id: nakshatra
category: sukta
name:
  english: nakshatra
  devanagari: नक्शत्र
content:
  english: '| puna̭h punarvo ha̱visha̭ yajamah| e̱va na de̱vyadi̭tirana̱rva| vishva̭sya bha̱rtri jaga̭tah
    prati̱shtha| puna̭rvasu ha̱visha̭ va̱rdhaya̭nti| pri̱yam de̱vana̱mapyḙtu̱ patha̭h || 5|| briha̱spati̭h
    pratha̱mam jaya̭manah| ti̱shya̭m naksha̭trama̱bhi samba̭bhuva| shreshtho̭ de̱vana̱m prita̭nasuji̱shnuh|
    di̱sho''nu̱ sarva̱ abha̭yanno astu| ti̱shya̭h pu̱rasta̭du̱ta ma̭dhya̱to na̭h| briha̱spati̭rna̱h pari̭patu
    pa̱shcat| badhḙta̱ndvesho̱ abha̭yam krinutam| su̱virya̭sya̱ pata̭yasyama || 6 || i̱da'
  devanagari: । पुनः॑ पुनर्वो ह॒विषा॑ यजामः। ए॒वा न दे॒व्यदि॑तिरन॒र्वा। विश्व॑स्य भ॒र्त्री जग॑तः प्रति॒ष्ठा।
    पुन॑र्वसू ह॒विषा॑ व॒र्धय॑न्ती। प्रि॒यम् दे॒वाना॒मप्ये॑तु॒ पाथः॑ ॥ ५॥ बृह॒स्पतिः॑ प्रथ॒मं जाय॑मानः।
    ति॒ष्यं॑ नक्ष॑त्रम॒भि संब॑भूव। श्रेष्ठो॑ दे॒वानां॒ पृत॑नासुजि॒ष्णुः। दि॒शोऽनु॒ सर्वा॒ अभ॑यन्नो अस्तु।
    ति॒ष्यः॑ पु॒रस्ता॑दु॒त म॑ध्य॒तो नः॑। बृह॒स्पति॑र्नः॒ परि॑पातु प॒श्चात्। बाधे॑ता॒न्द्वेषो॒ अभ॑यं कृणुताम्।
    सु॒वीर्य॑स्य॒ पत॑यस्याम ॥ ६ ॥ इ॒द
meaning: {}
