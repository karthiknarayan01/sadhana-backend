id: sri-swarna-akarshana-bhairava-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Swarna Akarshana Bhairava Ashtottara Sata Namavali
content:
  english: om brahmavishnushivatmane namah om trailokyavandhaya namah om varadaya namah om varatmane namah
    om ratnasimhasanasthaya namah om divyabharanashobhine namah om divyamalyavibhushaya namah om divyamurtaye
    namah om anekahastaya namah || || om anekashirase namah om anekanetraya namah om anekavibhave namah
    om anekakanthaya namah om anekamsaya namah om anekaparshvaya namah om divyatejase namah om anekayudhayuktaya
    namah om anekasurasevine namah om anekagunayuktaya namah || || om mahadevaya namah om daridryakalaya
    namah om mahasampadpradayine namah om shribhairavisamyuktaya namah om trilokeshaya namah om digambaraya
    namah om divyangaya namah om daityakalaya namah om papakalaya namah om sarvajnaya namah || || om divyacakshushe
    namah om ajitaya namah om jitamitraya namah om rudrarupaya namah om mahaviraya namah om anantaviryaya
    namah om mahaghoraya namah om ghoraghoraya namah om vishvaghoraya namah om ugraya namah || || om shantaya
    namah om bhaktanam shantidayine namah om sarvalokanam gurave namah om pranavarupine namah om vagbhavakhyaya
    namah om dirghakamaya namah om kamarajaya namah om yoshitakamaya namah om dirghamayasvarupaya namah
    om mahamayaya namah || || om srishtimayasvarupaya namah om nisargasamayaya namah om suralokasupujyaya
    namah om apaduddharanabhairavaya namah om mahadaridryanashine namah om unmulane karmathaya namah om
    alakshmyah sarvada namah om ajamalavaddhaya namah om svarnakarshanashilaya namah om daridrya vidveshanaya
    namah || || om lakshyaya namah om lokatrayeshaya namah om svanandam nihitaya namah om shribijarupaya
    namah om sarvakamapradayine namah om mahabhairavaya namah om dhanadhyakshaya namah om sharanyaya namah
    om prasannaya namah om adidevaya namah || || om mantrarupaya namah om mantrarupine namah om svarnarupaya
    namah om suvarnaya namah om suvarnavarnaya namah om mahapunyaya namah om shuddhaya namah om buddhaya
    namah om samsaratarine namah om pracalaya namah || || om balarupaya namah om paresham balanashine
    namah om svarnasamsthaya namah om bhutalavasine namah om patalavasaya namah om anadharaya namah om
    anantaya namah om svarnahastaya namah om purnacandrapratikashaya namah om vadanambhojashobhine namah
    || || om svarupaya namah om svarnalankarashobhine namah om svarnakarshanaya namah om svarnabhaya namah
    om svarnakanthaya namah om svarnabhambaradharine namah om svarnasimhanasthaya namah om svarnapadaya
    namah om svarnabhapadaya namah om svarnakancisushobhine namah || || om svarnajanghaya namah om bhaktakamadudhatmane
    namah om svarnabhaktaya namah om kalpavrikshasvarupine namah om cintamanisvarupaya namah om bahusvarnapradayine
    namah om hemakarshanaya namah om bhairavaya namah || || || iti shri svarnakarshana bhairava ashtottara
    shatanamavalih sampurnam ||
