id: hanumansukta
category: sukta
name:
  english: hanumansukta
  devanagari: हनुमान्सूक्त
content:
  english: shrihanumatsuktam shrimanto sarvalakshanasampanno jayapradah sarvabharanabhushita udaro mahonnatoshtrarudhah
    kesaripriyananndano vayutanujo yatheccham pampatiravihari gandhamadanasancari hemaprakarancitakanakakadalivanantaranivasi
    paramatma vanecarashapavimocano hemakanakavarno nanaratnakhacitamamulyam mekhalam ca svarnopavitam
    kausheyavastram ca bibhranah sanatano paramapurasho mahabalo aprameyapratapashali rajitavarnah shuddhaspatikasankashah
    pancavadanah pancadashanetrassakaladivyastradhari shrisuvarcalaramano mahendradyashtadikpalaka
  devanagari: श्रीहनुमत्सूक्तम् श्रीमन्तो सर्वलक्षणसम्पन्नो जयप्रदः सर्वाभरणभूषित उदारो महोन्नतोष्ट्रारूढः
    केसरीप्रियनन्न्दनो वायुतनूजो यथेच्छं पम्पातीरविहारी गन्धमादनसञ्चारी हेमप्राकाराञ्चितकनककदलीवनान्तरनिवासी
    परमात्मा वनेचरशापविमोचनो हेमकनकवर्णो नानारत्नखचिताममूल्यां मेखलां च स्वर्णोपवीतं कौशेयवस्त्रं च बिभ्राणः
    सनातनो परमपुरषो महाबलो अप्रमेयप्रतापशाली रजितवर्णः शुद्धस्पटिकसङ्काशः पञ्चवदनः पञ्चदशनेत्रस्सकलदिव्यास्त्रधारी
    श्रीसुवर्चलारमणो महेन्द्राद्यष्टदिक्पालक
meaning: {}
