    sukhada saba kala| taha~ basu lai dinha bhuala || kari puja saba bidhi sevakai| gayu rau griha bida
    karai || do rishaya sanga raghubamsa mani kari bhojanu bishramu| baithe prabhu bhrata sahita divasu
    raha bhari jamu || || lakhana hridaya~ lalasa biseshi| jai janakapura aia dekhi || prabhu bhaya bahuri
    munihi sakucahim| pragata na kahahim manahim musukahim || rama anuja mana ki gati jani| bhagata bachalata
    himya~ hulasani || parama binita sakuci musukai| bole gura anusasana pai || natha lakhanu puru dekhana
    cahahim| prabhu sakoca dara pragata na kahahim || jaum raura ayasu maim pavaum| nagara dekhai turata
    lai avau || suni munisu kaha bacana sapriti| kasa na rama tumha rakhahu niti || dharama setu palaka
    tumha tata| prema bibasa sevaka sukhadata || do jai dekhi avahu nagaru sukha nidhana dau bhai| karahu
    suphala saba ke nayana sundara badana dekhai || athava~ vishrama navanhaparayana dusara vishrama muni
    pada kamala bandi dau bhrata| cale loka locana sukha data || balaka brindi dekhi ati sobha| lage sanga
    locana manu lobha || pita basana parikara kati bhatha| caru capa sara sohata hatha || tana anuharata
    sucandana khori| syamala gaura manohara jori || kehari kandhara bahu bisala| ura ati rucira nagamani
    mala || subhaga sona sarasiruha locana| badana mayanka tapatraya mocana || kananhi kanaka phula chabi
    dehim| citavata citahi cori janu lehim || citavani caru bhrikuti bara ba~ki| tilaka rekha sobha janu
    ca~ki || do rucira cautanim subhaga sira mecaka kuncita kesa| nakha sikha sundara bandhu dau sobha
    sakala sudesa || || dekhana nagaru bhupasuta ae| samacara purabasimha pae || dhae dhama kama saba
    tyagi| manahu ranka nidhi lutana lagi || nirakhi sahaja sundara dau bhai| hohim sukhi locana phala
    pai || jubatim bhavana jharokhanhi lagim| nirakhahim rama rupa anuragim || kahahim parasapara bacana
    sapriti| sakhi inha koti kama chabi jiti || sura nara asura naga muni mahim| sobha asi kahu~ suniati
    nahim || bishnu cari bhuja bighi mukha cari| bikata besha mukha panca purari || apara deu asa kau
    na ahi| yaha chabi sakhi patataria jahi || do baya kisora sushama sadana syama gaura sukha dhama |
    anga anga para variahim koti koti sata kama || || kahahu sakhi asa ko tanudhari| jo na moha yaha rupa
    nihari || kau saprema boli mridu bani| jo maim suna so sunahu sayani || e dou dasaratha ke dhota|
    bala maralanhi ke kala jota || muni kausika makha ke rakhavare| jinha rana ajira nisacara mare ||
    syama gata kala kanja bilocana| jo marica subhuja madu mocana || kausalya suta so sukha khani| namu
    ramu dhanu sayaka pani || gaura kisora beshu bara kachem| kara sara capa rama ke pachem || lachimanu
    namu rama laghu bhrata| sunu sakhi tasu sumitra mata || do biprakaju kari bandhu dau maga munibadhu
    udhari| ae dekhana capamakha suni harashim saba nari || || dekhi rama chabi kau eka kahi| jogu janakihi
    yaha baru ahi || jau sakhi inhahi dekha naranahu| pana parihari hathi kari bibahu || kau kaha e bhupati
    pahicane| muni sameta sadara sanamane || sakhi parantu panu rau na taji| bidhi basa hathi abibekahi
    bhaji || kau kaha jaum bhala ahi bidhata| saba kaha~ sunia ucita phaladata || tau janakihi milihi
    baru ehu| nahina ali iha~ sandehu || jau bidhi basa asa banai sa~jogu| tau kritakritya hoi saba logu
    || sakhi hamarem arati ati tatem| kabahu~ka e avahim ehi natem || do nahim ta hama kahu~ sunahu sakhi
    inha kara darasanu duri| yaha sanghatu taba hoi jaba punya purakrita bhuri || || boli apara kahehu
    sakhi nika| ehim biaha ati hita sabahim ka || kau kaha sankara capa kathora| e syamala mridugata kisora
    || sabu asamanjasa ahi sayani| yaha suni apara kahi mridu bani || sakhi inha kaha~ kau kau asa kahahim|
    bara prabhau dekhata laghu ahahim || parasi jasu pada pankaja dhuri| tari ahalya krita agha bhuri
    || so ki rahihi binu sivadhanu torem| yaha pratiti pariharia na bhorem || jehim biranci raci siya
    sa~vari| tehim syamala baru raceu bicari || tasu bacana suni saba harashanim| aisei hau kahahim mudu
    bani || do hiya~ harashahim barashahim sumana sumukhi sulocani brinda| jahim jaha~ jaha~ bandhu dau
    taha~ taha~ paramananda || || pura puraba disi ge dau bhai| jaha~ dhanumakha hita bhumi banai || ati
    bistara caru gaca dhari| bimala bedika rucira sa~vari || cahu~ disi kancana manca bisala| race jaha~
    bethahim mahipala || tehi pachem samipa cahu~ pasa| apara manca mandali bilasa || kachuka u~ci saba
    bha~ti suhai| baithahim nagara loga jaha~ jai || tinha ke nikata bisala suhae| dhavala dhama bahubarana
    banae || jaha~ bainthaim dekhahim saba nari| jatha jogu nija kula anuhari || pura balaka kahi kahi
    mridu bacana| sadara prabhuhi dekhavahim racana || do saba sisu ehi misa premabasa parasi manohara
    gata| tana pulakahim ati harashu hiya~ dekhi dekhi dau bhrata || || sisu saba rama premabasa jane|
    priti sameta niketa bakhane || nija nija ruci saba lemhim bolai| sahita saneha jahim dau bhai || rama
    dekhavahim anujahi racana| kahi mridu madhura manohara bacana || lava nimesha maha~ bhuvana nikaya|
    raci jasu anusasana maya || bhagati hetu soi dinadayala| citavata cakita dhanusha makhasala || kautuka
    dekhi cale guru pahim| jani bilambu trasa mana mahim || jasu trasa dara kahu~ dara hoi| bhajana prabhau
    dekhavata soi || kahi batem mridu madhura suhaim| kie bida balaka bariai || do sabhaya saprema binita
    ati sakuca sahita dau bhai| gura pada pankaja nai sira baithe ayasu pai || || nisi prabesa muni ayasu
    dinha| sabahim sandhyabandanu kinha || kahata katha itihasa purani| rucira rajani juga jama sirani
    || munibara sayana kinhi taba jai| lage carana capana dau bhai || jinha ke carana saroruha lagi| karata
    bibidha japa joga biragi || tei dau bandhu prema janu jite| gura pada kamala palotata prite || barabara
    muni agya dinhi| raghubara jai sayana taba kinhi || capata carana lakhanu ura lae~| sabhaya saprema
    parama sacu pae~ || puni puni prabhu kaha sovahu tata| paurhae dhari ura pada jalajata || do uthe
    lakhana nisi bigata suni arunasikha dhuni kana || gura tem pahilehim jagatapati jage ramu sujana ||
    || sakala sauca kari jai nahae| nitya nibahi munihi sira nae || samaya jani gura ayasu pai| lena prasuna
    cale dau bhai || bhupa bagu bara dekheu jai| jaha~ basanta ritu rahi lobhai || lage bitapa manohara
    nana| barana barana bara beli bitana || nava pallava phala sumana suhae| nija sampati sura rukha lajae
    || cataka kokila kira cakora| kujata bihaga natata kala mora || madhya baga saru soha suhava| mani
    sopana bicitra banava || bimala salilu sarasija bahuranga| jalakhaga kujata gunjata bhringa || do
    bagu taraagu biloki prabhu harashe bandhu sameta| parama ramya aramu yahu jo ramahi sukha deta ||
    || cahu~ disi citi pu~chi maligana| lage lena dala phula mudita mana || tehi avasara sita taha~ ai|
    girija pujana janani pathai || sanga sakhim saba subhaga sayani| gavahim gita manohara bani || sara
    samipa girija griha soha| barani na jai dekhi manu moha || majjanu kari sara sakhinha sameta| gi mudita
    mana gauri niketa || puja kinhi adhika anuraga| nija anurupa subhaga baru maga || eka sakhi siya sangu
    bihai| gi rahi dekhana phulavai || tehi dau bandhu biloke jai| prema bibasa sita pahim ai || do tasu
    dasa dekhi sakhinha pulaka gata jalu naina| kahu karanu nija harasha kara puchahi saba mridu baina
    || || dekhana bagu kua~ra dui ae| baya kisora saba bha~ti suhae || syama gaura kimi kahaum bakhani|
    gira anayana nayana binu bani || suni harashi~ saba sakhim sayani| siya hiya~ ati utakantha jani ||
    eka kahi nripasuta tei ali| sune je muni sa~ga ae kali || jinha nija rupa mohani dari| kinha svabasa
    nagara nara nari || baranata chabi jaha~ taha~ saba logu| avasi dekhiahim dekhana jogu || tasu vacana
    ati siyahi suhane| darasa lagi locana akulane || cali agra kari priya sakhi soi| priti puratana lakhi
    na koi || do sumiri siya narada bacana upaji priti punita || cakita bilokati sakala disi janu sisu
    mrigi sabhita || || kankana kinkini nupura dhuni suni| kahata lakhana sana ramu hridaya~ guni || manahu~
    madana dundubhi dinhi || manasa bisva bijaya kaha~ kinhi || asa kahi phiri cite tehi ora| siya mukha
    sasi bhe nayana cakora || bhe bilocana caru acancala| manahu~ sakuci nimi taje digancala || dekhi
    siya sobha sukhu pava| hridaya~ sarahata bacanu na ava || janu biranci saba nija nipunai| biraci bisva
    kaha~ pragati dekhai || sundarata kahu~ sundara kari| chabigriha~ dipasikha janu bari || saba upama
    kabi rahe juthari| kehim patataraum bidehakumari || do siya sobha hiya~ barani prabhu apani dasa bicari|
    bole suci mana anuja sana bacana samaya anuhari || || tata janakatanaya yaha soi| dhanushajagya jehi
    karana hoi || pujana gauri sakhim lai ai| karata prakasu phiri phulavai || jasu biloki alokika sobha|
    sahaja punita mora manu chobha || so sabu karana jana bidhata| pharakahim subhada anga sunu bhrata
    || raghubamsimha kara sahaja subh | manu kupantha pagu dhari na k || mohi atisaya pratiti mana keri|
    jehim sapanehu~ paranari na heri || jinha kai lahahim na ripu rana pithi| nahim pavahim paratiya manu
    dithi || mangana lahahi na jinha kai nahim| te narabara thore jaga mahim || do karata batakahi anuja
    sana mana siya rupa lobhana| mukha saroja makaranda chabi kari madhupa iva pana || || citavahi cakita
    cahu~ disi sita| kaha~ ge nripakisora manu cinta || jaha~ biloka mriga savaka naini| janu taha~ barisa
    kamala sita shreni || lata ota taba sakhinha lakhae| syamala gaura kisora suhae || dekhi rupa locana
    lalacane| harashe janu nija nidhi pahicane || thake nayana raghupati chabi dekhem| palakanhihu~ pariharim
    nimeshem || adhika saneha~ deha bhai bhori| sarada sasihi janu citava cakori || locana maga ramahi
    ura ani| dinhe palaka kapata sayani || jaba siya sakhinha premabasa jani| kahi na sakahim kachu mana
    sakucani || do latabhavana tem pragata bhe tehi avasara dau bhai| nikase janu juga bimala bidhu jalada
    patala bilagai || || sobha siva~ subhaga dau bira| nila pita jalajabha sarira || morapankha sira sohata
    nike| guccha bica bica kusuma kali ke || bhala tilaka shramabindu suhae| shravana subhaga bhushana
    chabi chae || bikata bhrikuti kaca ghugharavare| nava saroja locana ratanare || caru cibuka nasika
    kapola| hasa bilasa leta manu mola || mukhachabi kahi na jai mohi pahim| jo biloki bahu kama lajahim
    || ura mani mala kambu kala giva| kama kalabha kara bhuja balasimva || sumana sameta bama kara dona|
    sava~ra kua~ra sakhi suthi lona || do kehari kati pata pita dhara sushama sila nidhana| dekhi bhanukulabhushanahi
    bisara sakhinha apana || || dhari dhiraju eka ali sayani| sita sana boli gahi pani || bahuri gauri
    kara dhyana karehu| bhupakisora dekhi kina lehu || sakuci siya~ taba nayana ughare| sanamukha dau
    raghusingha nihare || nakha sikha dekhi rama kai sobha| sumiri pita panu manu ati chobha || parabasa
    sakhinha lakhi jaba sita| bhayu gaharu saba kahahi sabhita || puni auba ehi beria~ kali| asa kahi
    mana bihasi eka ali || gurha gira suni siya sakucani| bhayu bilambu matu bhaya mani || dhari barai
    dhira ramu ura ane| phiri apanapu pitubasa jane || do dekhana misa mriga bihaga taru phiri bahori
    bahori| nirakhi nirakhi raghubira chabi barhai priti na thori || || jani kathina sivacapa bisurati|
    cali rakhi ura syamala murati || prabhu jaba jata janaki jani| sukha saneha sobha guna khani || parama
    premamaya mridu masi kinhi| caru cita bhitim likha linhi || gi bhavani bhavana bahori| bandi carana
    boli kara jori || jaya jaya giribararaja kisori| jaya mahesa mukha canda cakori || jaya gaja badana
    sharaanana mata| jagata janani damini duti gata || nahim tava adi madhya avasana| amita prabhau bedu
    nahim jana || bhava bhava bibhava parabhava karini| bisva bimohani svabasa biharini || do patidevata
    sutiya mahu~ matu prathama tava rekha| mahima amita na sakahim kahi sahasa sarada sesha || || sevata
    tohi sulabha phala cari| baradayani purari piari || debi puji pada kamala tumhare| sura nara muni
    saba hohim sukhare || mora manorathu janahu nikem| basahu sada ura pura sabahi kem || kinheu~ pragata
    na karana tehim| asa kahi carana gahe baidehim || binaya prema basa bhi bhavani| khasi mala murati
    musukani || sadara siya~ prasadu sira dhareu| boli gauri harashu hiya~ bhareu || sunu siya satya asisa
    hamari| pujihi mana kamana tumhari || narada bacana sada suci saca| so baru milihi jahim manu raca
    || cham manu jahim raceu milihi so baru sahaja sundara sa~varo| karuna nidhana sujana silu sanehu
    janata ravaro || ehi bha~ti gauri asisa suni siya sahita hiya~ harashim ali| tulasi bhavanihi puji
    puni puni mudita mana mandira cali || so jani gauri anukula siya hiya harashu na jai kahi| manjula
    mangala mula bama anga pharakana lage || || hridaya~ sarahata siya lonai| gura samipa gavane dau bhai
    || rama kaha sabu kausika pahim| sarala subhau chuata chala nahim || sumana pai muni puja kinhi| puni
    asisa duhu bhainha dinhi || suphala manoratha hohu~ tumhare| ramu lakhanu suni bhe sukhare || kari
    bhojanu munibara bigyani| lage kahana kachu katha purani || bigata divasu guru ayasu pai| sandhya
    karana cale dau bhai || praci disi sasi uyu suhava| siya mukha sarisa dekhi sukhu pava || bahuri bicaru
    kinha mana mahim| siya badana sama himakara nahim || do janamu sindhu puni bandhu bishu dina malina
    sakalanka| siya mukha samata pava kimi candu bapuro ranka || || ghati barhai birahani dukhadai| grasi
    rahu nija sandhihim pai || koka sikaprada pankaja drohi| avaguna bahuta candrama tohi || baidehi mukha
    patatara dinhe| hoi dosha bara anucita kinhe || siya mukha chabi bidhu byaja bakhani| guru pahim cale
    nisa barai jani || kari muni carana saroja pranama| ayasu pai kinha bishrama || bigata nisa raghunayaka
    jage| bandhu biloki kahana asa lage || udu aruna avalokahu tata| pankaja koka loka sukhadata || bole
    lakhanu jori juga pani| prabhu prabhau sucaka mridu bani || do arunodaya~ sakuce kumuda udagana joti
    malina| jimi tumhara agamana suni bhe nripati balahina || || nripa saba nakhata karahim ujiari| tari
    na sakahim capa tama bhari || kamala koka madhukara khaga nana| harashe sakala nisa avasana || aisehim
    prabhu saba bhagata tumhare| hoihahim tutem dhanusha sukhare || uyu bhanu binu shrama tama nasa| dure
    nakhata jaga teju prakasa || rabi nija udaya byaja raghuraya| prabhu pratapu saba nripanha dikhaya
    || tava bhuja bala mahima udaghati| pragati dhanu bighatana paripati || bandhu bacana suni prabhu
    musukane| hoi suci sahaja punita nahane || nityakriya kari guru pahim ae| carana saroja subhaga sira
    nae || satanandu taba janaka bolae| kausika muni pahim turata pathae || janaka binaya tinha ai sunai|
    harashe boli lie dau bhai || do a bandi prabhu baithe gura pahim jai| calahu tata muni kaheu taba
    pathava janaka bolai || || siya svayambaru dekhia jai| isu kahi dhaum dei baraai || lakhana kaha jasa
    bhajanu soi| natha kripa tava japara hoi || harashe muni saba suni bara bani| dinhi asisa sabahim
    sukhu mani || puni munibrinda sameta kripala| dekhana cale dhanushamakha sala || rangabhumi ae dau
    bhai| asi sudhi saba purabasimha pai || cale sakala griha kaja bisari| bala jubana jaratha nara nari
    || dekhi janaka bhira bhai bhari| suci sevaka saba lie ha~kari || turata sakala loganha pahim jahu|
    asana ucita dehu saba kahu || do kahi mridu bacana binita tinha baithare nara nari| uttama madhyama
    nica laghu nija nija thala anuhari || || rajakua~ra tehi avasara ae| manahu~ manoharata tana chae
    || guna sagara nagara bara bira| sundara syamala gaura sarira || raja samaja birajata rure| udagana
    mahu~ janu juga bidhu pure || jinha kem rahi bhavana jaisi| prabhu murati tinha dekhi taisi || dekhahim
    rupa maha ranadhira| manahu~ bira rasu dharem sarira || dare kutila nripa prabhuhi nihari| manahu~
    bhayanaka murati bhari || rahe asura chala chonipa besha| tinha prabhu pragata kalasama dekha || purabasimha
    dekhe dau bhai| narabhushana locana sukhadai || do nari bilokahim harashi hiya~ nija nija ruci anurupa|
    janu sohata singara dhari murati parama anupa || || bidushanha prabhu biratamaya disa| bahu mukha
    kara paga locana sisa || janaka jati avalokahim kaisaim| sajana sage priya lagahim jaisem || sahita
    bideha bilokahim rani| sisu sama priti na jati bakhani || joginha parama tattvamaya bhasa| santa suddha
    sama sahaja prakasa || haribhagatanha dekhe dau bhrata| ishtadeva iva saba sukha data || ramahi citava
    bhaya~ jehi siya| so sanehu sukhu nahim kathaniya || ura anubhavati na kahi saka sou| kavana prakara
    kahai kabi kou || ehi bidhi raha jahi jasa bh | tehim tasa dekheu kosalar rajata raja samaja mahu~
    kosalaraja kisora| sundara syamala gaura tana bisva bilocana cora || || sahaja manohara murati dou|
    koti kama upama laghu sou || sarada canda nindaka mukha nike| niraja nayana bhavate ji ke || citavata
    caru mara manu harani| bhavati hridaya jati nahim barani || kala kapola shruti kundala lola| cibuka
    adhara sundara mridu bola || kumudabandhu kara nindaka ha~sa| bhrikuti bikata manohara nasa || bhala
    bisala tilaka jhalakahim| kaca biloki ali avali lajahim || pita cautanim siranhi suhai| kusuma kalim
    bica bica banaim || rekhem rucira kambu kala giva~| janu tribhuvana sushama ki siva~ || do kunjara
    mani kantha kalita uranhi tulasika mala| brishabha kandha kehari thavani bala nidhi bahu bisala ||
    || kati tunira pita pata ba~dhe| kara sara dhanusha bama bara ka~dhe || pita jagya upabita suhae|
    nakha sikha manju mahachabi chae || dekhi loga saba bhe sukhare| ekataka locana calata na tare ||
    harashe janaku dekhi dau bhai| muni pada kamala gahe taba jai || kari binati nija katha sunai| ranga
    avani saba munihi dekhai || jaha~ jaha~ jahi kua~ra bara dou| taha~ taha~ cakita citava sabu kou ||
    nija nija rukha ramahi sabu dekha| kau na jana kachu maramu bisesha || bhali racana muni nripa sana
    kaheu| raja~ mudita mahasukha laheu || do saba mancanha te mancu eka sundara bisada bisala| muni sameta
    dau bandhu taha~ baithare mahipala || || prabhuhi dekhi saba nripa hi~ya~ hare| janu rakesa udaya
    bhe~ tare || asi pratiti saba ke mana mahim| rama capa toraba saka nahim || binu bhanjehu~ bhava dhanushu
    bisala| melihi siya rama ura mala || asa bicari gavanahu ghara bhai| jasu pratapu balu teju gava~i
    || bihase apara bhupa suni bani| je abibeka andha abhimani || torehu~ dhanushu byahu avagaha| binu
    torem ko kua~ri biaha || eka bara kalu kina hou| siya hita samara jitaba hama sou || yaha suni avara
    mahipa musakane| dharamasila haribhagata sayane || so siya biahabi rama garaba duri kari nripanha
    ke || jiti ko saka sangrama dasaratha ke rana ba~kure || || byartha marahu jani gala bajai| mana modakanhi
    ki bhukha butai || sikha hamari suni parama punita| jagadamba janahu jiya~ sita || jagata pita raghupatihi
    bicari| bhari locana chabi lehu nihari || sundara sukhada sakala guna rasi| e dau bandhu sambhu ura
    basi || sudha samudra samipa bihai| mrigajalu nirakhi marahu kata dhai || karahu jai ja kahu~ joi
    bhava| hama tau aju janama phalu pava || asa kahi bhale bhupa anurage| rupa anupa bilokana lage ||
    dekhahim sura nabha carhae bimana| barashahim sumana karahim kala gana || do jani suavasaru siya taba
    pathi janaka bolai| catura sakhim sundara sakala sadara calim lavaim || || siya sobha nahim jai bakhani|
    jagadambika rupa guna khani || upama sakala mohi laghu lagim| prakrita nari anga anuragim || siya
    barania tei upama dei| kukabi kahai ajasu ko lei || jau patataria tiya sama siya| jaga asi jubati
    kaha~ kamaniya || gira mukhara tana aradha bhavani| rati ati dukhita atanu pati jani || bisha baruni
    bandhu priya jehi| kahia ramasama kimi baidehi || jau chabi sudha payonidhi hoi| parama rupamaya kacchapa
    soi || sobha raju mandaru singaru| mathai pani pankaja nija maru || do ehi bidhi upajai lacchi jaba
    sundarata sukha mula| tadapi sakoca sameta kabi kahahim siya samatula || || calim sanga lai sakhim
    sayani| gavata gita manohara bani || soha navala tanu sundara sari| jagata janani atulita chabi bhari
    || bhushana sakala sudesa suhae| anga anga raci sakhinha banae || rangabhumi jaba siya pagu dhari|
    dekhi rupa mohe nara nari || harashi suranha dundubhim bajai| barashi prasuna apachara gai || pani
    saroja soha jayamala| avacata cite sakala bhuala || siya cakita cita ramahi caha| bhe mohabasa saba
    naranaha || muni samipa dekhe dau bhai| lage lalaki locana nidhi pai || do gurajana laja samaju bara
    dekhi siya sakucani || lagi bilokana sakhinha tana raghubirahi ura ani || || rama rupu aru siya chabi
    dekhem| nara narinha pariharim nimeshem || socahim sakala kahata sakucahim| bidhi sana binaya karahim
    mana mahim || haru bidhi begi janaka jaratai| mati hamari asi dehi suhai || binu bicara panu taji
    naranahu| siya rama kara karai bibahu || jaga bhala kahahi bhava saba kahu| hatha kinhe antahu~ ura
    dahu || ehim lalasa~ magana saba logu| baru sa~varo janaki jogu || taba bandijana janaka baulae| biridavali
    kahata cali ae || kaha nripa jai kahahu pana mora| cale bhata hiya~ harashu na thora || do bole bandi
    bacana bara sunahu sakala mahipala| pana bideha kara kahahim hama bhuja uthai bisala || || nripa bhujabala
    bidhu sivadhanu rahu| garua kathora bidita saba kahu || ravanu banu mahabhata bhare| dekhi sarasana
    gava~him sidhare || soi purari kodandu kathora| raja samaja aju joi tora || tribhuvana jaya sameta
    baidehi || binahim bicara bari hathi tehi || suni pana sakala bhupa abhilashe| bhatamani atisaya mana
    makhe || parikara ba~dhi uthe akulai| cale ishtadevanha sira nai || tamaki taki taki sivadhanu dharahim|
    uthi na koti bha~ti balu karahim || jinha ke kachu bicaru mana mahim| capa samipa mahipa na jahim
    || do tamaki dharahim dhanu murha nripa uthi na calahim lajai| manahu~ pai bhata bahubalu adhiku adhiku
    garuai || || bhupa sahasa dasa ekahi bara| lage uthavana tari na tara || dagi na sambhu sarasana kaisem|
    kami bacana sati manu jaisem || saba nripa bhe jogu upahasi| jaisem binu biraga sannyasi || kirati
    bijaya birata bhari| cale capa kara barabasa hari || shrihata bhe hari hiya~ raja| baithe nija nija
    jai samaja || nripanha biloki janaku akulane| bole bacana rosha janu sane || dipa dipa ke bhupati
    nana| ae suni hama jo panu thana || deva danuja dhari manuja sarira| bipula bira ae ranadhira || do
    kua~ri manohara bijaya barai kirati ati kamaniya| pavanihara biranci janu raceu na dhanu damaniya
    || || kahahu kahi yahu labhu na bhava| kahu~ na sankara capa carhaava || rahu carhaauba toraba bhai|
    tilu bhari bhumi na sake charaai || aba jani kau makhai bhata mani| bira bihina mahi maim jani ||
    tajahu asa nija nija griha jahu| likha na bidhi baidehi bibahu || sukrita jai jaum panu pariharu~|
    kua~ri kuari rahu ka karu~ || jo janateu~ binu bhata bhubi bhai| tau panu kari hoteu~ na ha~sai ||
    janaka bacana suni saba nara nari| dekhi janakihi bhe dukhari || makhe lakhanu kutila bhi~ bhaumhem|
    radapata pharakata nayana risaumhem || do kahi na sakata raghubira dara lage bacana janu bana| nai
    rama pada kamala siru bole gira pramana || || raghubamsimha mahu~ jaha~ kau hoi| tehim samaja asa
    kahi na koi || kahi janaka jasi anucita bani| bidyamana raghukula mani jani || sunahu bhanukula pankaja
    bhanu| kahu~ subhau na kachu abhimanu || jau tumhari anusasana pavaum| kanduka iva brahmanda uthavaum
    || kace ghata jimi daraum phori| saku~ meru mulaka jimi tori || tava pratapa mahima bhagavana| ko
    bapuro pinaka purana || natha jani asa ayasu hou| kautuku karaum bilokia sou || kamala nala jimi capha
    carhaavaum| jojana sata pramana lai dhavaum || do toraum chatraka danda jimi tava pratapa bala natha|
    jaum na karaum prabhu pada sapatha kara na dharaum dhanu bhatha || || lakhana sakopa bacana je bole|
    dagamagani mahi diggaja dole || sakala loka saba bhupa derane| siya hiya~ harashu janaku sakucane
    || gura raghupati saba muni mana mahim| mudita bhe puni puni pulakahim || sayanahim raghupati lakhanu
    nevare| prema sameta nikata baithare || bisvamitra samaya subha jani| bole ati sanehamaya bani ||
    uthahu rama bhanjahu bhavacapa| metahu tata janaka paritapa || suni guru bacana carana siru nava|
    harashu bishadu na kachu ura ava || tharhae bhe uthi sahaja subhae~| thavani juba mrigaraju lajae~
    || do udita udayagiri manca para raghubara balapatanga| bikase santa saroja saba harashe locana bhringa
    || || nripanha keri asa nisi nasi| bacana nakhata avali na prakasi || mani mahipa kumuda sakucane|
    kapati bhupa uluka lukane || bhe bisoka koka muni deva| barisahim sumana janavahim seva || gura pada
    bandi sahita anuraga| rama muninha sana ayasu maga || sahajahim cale sakala jaga svami| matta manju
    bara kunjara gami || calata rama saba pura nara nari| pulaka puri tana bhe sukhari || bandi pitara
    sura sukrita sa~bhare| jaum kachu punya prabhau hamare || tau sivadhanu mrinala ki naim| torahu~ rama
    ganesa gosaim || do ramahi prema sameta lakhi sakhinha samipa bolai| sita matu saneha basa bacana
    kahi bilakhai || || sakhi saba kautuka dekhanihare| jetha kahavata hitu hamare || kau na bujhai kahi
    gura pahim| e balaka asi hatha bhali nahim || ravana bana chua nahim capa| hare sakala bhupa kari
    dapa || so dhanu rajakua~ra kara dehim| bala marala ki mandara lehim || bhupa sayanapa sakala sirani|
    sakhi bidhi gati kachu jati na jani || boli catura sakhi mridu bani| tejavanta laghu gania na rani
    || kaha~ kumbhaja kaha~ sindhu apara| sosheu sujasu sakala samsara || rabi mandala dekhata laghu laga|
    udaya~ tasu tibhuvana tama bhaga || do mantra parama laghu jasu basa bidhi hari hara sura sarba| mahamatta
    gajaraja kahu~ basa kara ankusa kharba || || kama kusuma dhanu sayaka linhe| sakala bhuvana apane
    basa kinhe || debi tajia samsu asa jani| bhanjaba dhanusha ramu sunu rani || sakhi bacana suni bhai
    paratiti| mita bishadu barhai ati priti || taba ramahi biloki baidehi| sabhaya hridaya~ binavati jehi
    tehi || manahim mana manava akulani| hohu prasanna mahesa bhavani || karahu saphala apani sevakai|
    kari hitu harahu capa garuai || gananayaka baradayaka deva| aju lagem kinhiu~ tua seva || bara bara
    binati suni mori| karahu capa guruta ati thori || do dekhi dekhi raghubira tana sura manava dhari
    dhira || bhare bilocana prema jala pulakavali sarira || || nikem nirakhi nayana bhari sobha| pitu
    panu sumiri bahuri manu chobha || ahaha tata daruni hatha thani| samujhata nahim kachu labhu na hani
    || saciva sabhaya sikha dei na koi| budha samaja bara anucita hoi || kaha~ dhanu kulisahu cahi kathora|
    kaha~ syamala mridugata kisora || bidhi kehi bha~ti dharaum ura dhira| sirasa sumana kana bedhia hira
    || sakala sabha kai mati bhai bhori| aba mohi sambhucapa gati tori || nija jarata loganha para dari|
    hohi harua raghupatihi nihari || ati paritapa siya mana mahi| lava nimesha juga saba saya jahim ||
    do prabhuhi citi puni citava mahi rajata locana lola| khelata manasija mina juga janu bidhu mandala
    dola || || gira alini mukha pankaja roki| pragata na laja nisa avaloki || locana jalu raha locana
    kona| jaise parama kripana kara sona || sakuci byakulata barai jani| dhari dhiraju pratiti ura ani
    || tana mana bacana mora panu saca| raghupati pada saroja citu raca || tau bhagavanu sakala ura basi|
    karihim mohi raghubara kai dasi || jehi kem jehi para satya sanehu| so tehi mili na kachu samhehu
    || prabhu tana citi prema tana thana| kripanidhana rama sabu jana || siyahi biloki takeu dhanu kaise|
    citava garuru laghu byalahi jaise || do lakhana lakheu raghubamsamani takeu hara kodandu| pulaki gata
    bole bacana carana capi brahmandu || || disakunjarahu kamatha ahi kola| dharahu dharani dhari dhira
    na dola || ramu cahahim sankara dhanu tora| hohu sajaga suni ayasu mora || capa sapipa ramu jaba ae|
    nara narinha sura sukrita manae || saba kara samsu aru agyanu| manda mahipanha kara abhimanu || bhrigupati
    keri garaba garuai| sura munibaranha keri kadarai || siya kara socu janaka pachitava| raninha kara
    daruna dukha dava || sambhucapa bada bohitu pai| cadhe jai saba sangu banai || rama bahubala sindhu
    aparu| cahata paru nahi kau karaharu || do rama biloke loga saba citra likhe se dekhi| citi siya kripayatana
    jani bikala biseshi || || dekhi bipula bikala baidehi| nimisha bihata kalapa sama tehi || trishita
    bari binu jo tanu tyaga| mue~ kari ka sudha taraaga || ka barasha saba krishi sukhanem| samaya cukem
    puni ka pachitanem || asa jiya~ jani janaki dekhi| prabhu pulake lakhi priti biseshi || gurahi pranamu
    manahi mana kinha| ati laghava~ uthai dhanu linha || damakeu damini jimi jaba layu| puni nabha dhanu
    mandala sama bhayu || leta carhaavata khaincata garhaem| kahu~ na lakha dekha sabu tharhaem || tehi
    chana rama madhya dhanu tora| bhare bhuvana dhuni ghora kathora || cham bhare bhuvana ghora kathora
    rava rabi baji taji maragu cale| cikkarahim diggaja dola mahi ahi kola kuruma kalamale || sura asura
    muni kara kana dinhem sakala bikala bicarahim| kodanda khandeu rama tulasi jayati bacana ucarahi ||
    so sankara capu jahaju sagaru raghubara bahubalu| bura so sakala samaju carhaa jo prathamahim moha
    basa || || prabhu dau capakhanda mahi dare| dekhi loga saba bhe sukhare || kosikarupa payonidhi pavana|
    prema bari avagahu suhavana || ramarupa rakesu nihari| barhata bici pulakavali bhari || baje nabha
    gahagahe nisana| devabadhu nacahim kari gana || brahmadika sura siddha munisa| prabhuhi prasamsahi
    dehim asisa || barisahim sumana ranga bahu mala| gavahim kinnara gita rasala || rahi bhuvana bhari
    jaya jaya bani| dhanushabhanga dhuni jata na jani || mudita kahahim jaha~ taha~ nara nari| bhanjeu
    rama sambhudhanu bhari || do bandi magadha sutagana biruda badahim matidhira| karahim nichavari loga
    saba haya gaya dhana mani cira || || jha~jhi mridanga sankha sahanai| bheri dhola dundubhi suhai ||
    bajahim bahu bajane suhae| jaha~ taha~ jubatinha mangala gae || sakhinha sahita harashi ati rani|
    sukhata dhana para janu pani || janaka laheu sukhu socu bihai| pairata thakem thaha janu pai || shrihata
    bhe bhupa dhanu tute| jaisem divasa dipa chabi chute || siya sukhahi barania kehi bha~ti| janu cataki
    pai jalu svati || ramahi lakhanu bilokata kaisem| sasihi cakora kisoraku jaisem || satananda taba
    ayasu dinha| sita~ gamanu rama pahim kinha || do sanga sakhim sudamra catura gavahim mangalacara|
    gavani bala marala gati sushama anga apara || || sakhinha madhya siya sohati kaise| chabigana madhya
    mahachabi jaisem || kara saroja jayamala suhai| bisva bijaya sobha jehim chai || tana sakocu mana
    parama uchahu| gurha premu lakhi pari na kahu || jai samipa rama chabi dekhi| rahi janu ku~ari citra
    avarekhi || catura sakhim lakhi kaha bujhai| pahiravahu jayamala suhai || sunata jugala kara mala
    uthai| prema bibasa pahirai na jai || sohata janu juga jalaja sanala| sasihi sabhita deta jayamala
    || gavahim chabi avaloki saheli| siya~ jayamala rama ura meli || so raghubara ura jayamala dekhi deva
    barisahim sumana| sakuce sakala bhuala janu biloki rabi kumudagana || || pura aru byoma bajane baje|
    khala bhe malina sadhu saba raje || sura kinnara nara naga munisa| jaya jaya jaya kahi dehim asisa
    || nacahim gavahim bibudha badhutim| bara bara kusumanjali chutim || jaha~ taha~ bipra bedadhuni karahim|
    bandi biradavali uccarahim || mahi patala naka jasu byapa| rama bari siya bhanjeu capa || karahim
    arati pura nara nari| dehim nichavari bitta bisari || sohati siya rama kai jauri| chabi singaru manahu~
    eka thori || sakhim kahahim prabhupada gahu sita| karati na carana parasa ati bhita || do gautama
    tiya gati surati kari nahim parasati paga pani| mana bihase raghubamsamani priti alaukika jani ||
    || taba siya dekhi bhupa abhilashe| kura kaputa murha mana makhe || uthi uthi pahiri sanaha abhage|
    jaha~ taha~ gala bajavana lage || lehu charaai siya kaha kou| dhari ba~dhahu nripa balaka dou || torem
    dhanushu cara nahim sari| jivata hamahi kua~ri ko bari || jaum bidehu kachu karai sahai| jitahu samara
    sahita dau bhai || sadhu bhupa bole suni bani| rajasamajahi laja lajani || balu pratapu birata baraai|
    naka pinakahi sanga sidhai || soi surata ki aba kahu~ pai| asi budhi tau bidhi muha~ masi lai || do
    dekhahu ramahi nayana bhari taji irisha madu kohu| lakhana roshu pavaku prabala jani salabha jani
    hohu || || bainateya bali jimi caha kagu| jimi sasu cahai naga ari bhagu || jimi caha kusala akarana
    kohi| saba sampada cahai sivadrohi || lobhi lolupa kala kirati cahi| akalankata ki kami lahi || hari
    pada bimukha parama gati caha| tasa tumhara lalacu naranaha || kolahalu suni siya sakani| sakhim lavai
    gim jaha~ rani || ramu subhaya~ cale guru pahim| siya sanehu baranata mana mahim || raninha sahita
    socabasa siya| aba dhaum bidhihi kaha karaniya || bhupa bacana suni ita uta takahim| lakhanu rama
    dara boli na sakahim || do aruna nayana bhrikuti kutila citavata nripanha sakopa| manahu~ matta gajagana
    nirakhi singhakisorahi copa || || kharabharu dekhi bikala pura narim| saba mili dehim mahipanha garim
    || tehim avasara suni siva dhanu bhanga| ayasu bhrigukula kamala patanga || dekhi mahipa sakala sakucane|
    baja jhapata janu lava lukane || gauri sarira bhuti bhala bhraja| bhala bisala tripunda biraja ||
    sisa jata sasibadanu suhava| risabasa kachuka aruna hoi ava || bhrikuti kutila nayana risa rate| sahajahu~
    citavata manahu~ risate || brishabha kandha ura bahu bisala| caru janeu mala mrigachala || kati muni
    basana tuna dui ba~dhem| dhanu sara kara kutharu kala ka~dhem || do santa beshu karani kathina barani
    na jai sarupa| dhari munitanu janu bira rasu ayu jaha~ saba bhupa || || dekhata bhrigupati beshu karala|
    uthe sakala bhaya bikala bhuala || pitu sameta kahi kahi nija nama| lage karana saba danda pranama
    || jehi subhaya~ citavahim hitu jani| so jani janu ai khutani || janaka bahori ai siru nava| siya
    bolai pranamu karava || asisha dinhi sakhim harashanim| nija samaja lai gi sayanim || bisvamitru mile
    puni ai| pada saroja mele dau bhai || ramu lakhanu dasaratha ke dhota| dinhi asisa dekhi bhala jota
    || ramahi citi rahe thaki locana| rupa apara mara mada mocana || do bahuri biloki bideha sana kahahu
    kaha ati bhira || puchata jani ajana jimi byapeu kopu sarira || || samacara kahi janaka sunae| jehi
    karana mahipa saba ae || sunata bacana phiri anata nihare| dekhe capakhanda mahi dare || ati risa
    bole bacana kathora| kahu jara janaka dhanusha kai tora || begi dekhau murha na ta aju| ulatu~ mahi
    jaha~ lahi tava raju || ati daru utaru deta nripu nahim| kutila bhupa harashe mana mahim || sura muni
    naga nagara nara nari || socahim sakala trasa ura bhari || mana pachitati siya mahatari| bidhi aba
    sa~vari bata bigari || bhrigupati kara subhau suni sita| aradha nimesha kalapa sama bita || do sabhaya
    biloke loga saba jani janaki bhiru| hridaya~ na harashu bishadu kachu bole shriraghubiru || nava~
    vishrama natha sambhudhanu bhanjanihara| hoihi keu eka dasa tumhara || ayasu kaha kahia kina mohi|
    suni risai bole muni kohi || sevaku so jo karai sevakai| ari karani kari karia larai || sunahu rama
    jehim sivadhanu tora| sahasabahu sama so ripu mora || so bilagau bihai samaja| na ta mare jaihahim
    saba raja || suni muni bacana lakhana musukane| bole parasudharahi apamane || bahu dhanuhim torim
    larikaim| kabahu~ na asi risa kinhi gosaim || ehi dhanu para mamata kehi hetu| suni risai kaha bhrigukulaketu
    || do re nripa balaka kalabasa bolata tohi na sa~mara || dhanuhi sama tipurari dhanu bidita sakala
    samsara || || lakhana kaha ha~si hamarem jana| sunahu deva saba dhanusha samana || ka chati labhu
    juna dhanu taurem| dekha rama nayana ke bhorem || chuata tuta raghupatihu na dosu| muni binu kaja
    karia kata rosu | bole citi parasu ki ora| re satha sunehi subhau na mora || balaku boli badhu~ nahim
    tohi| kevala muni jara janahi mohi || bala brahmacari ati kohi| bisva bidita chatriyakula drohi ||
    bhujabala bhumi bhupa binu kinhi| bipula bara mahidevanha dinhi || sahasabahu bhuja chedanihara| parasu
    biloku mahipakumara || do matu pitahi jani socabasa karasi mahisakisora| garbhanha ke arbhaka dalana
    parasu mora ati ghora || || bihasi lakhanu bole mridu bani| aho munisu maha bhatamani || puni puni
    mohi dekhava kutharu| cahata uraavana phu~ki paharu || iha~ kumharabatiya kau nahim| je tarajani dekhi
    mari jahim || dekhi kutharu sarasana bana| maim kachu kaha sahita abhimana || bhrigusuta samujhi janeu
    biloki| jo kachu kahahu sahu~ risa roki || sura mahisura harijana aru gai| hamarem kula inha para
    na surai || badhem papu apakirati harem| maratahu~ pa paria tumharem || koti kulisa sama bacanu tumhara|
    byartha dharahu dhanu bana kuthara || do jo biloki anucita kaheu~ chamahu mahamuni dhira| suni sarosha
    bhrigubamsamani bole gira gabhira || || kausika sunahu manda yahu balaku| kutila kalabasa nija kula
    ghalaku || bhanu bamsa rakesa kalanku| nipata nirankusa abudha asanku || kala kavalu hoihi chana mahim|
    kahu~ pukari khori mohi nahim || tumha hataku jaum cahahu ubara| kahi pratapu balu roshu hamara ||
    lakhana kaheu muni sujasa tumhara| tumhahi achata ko baranai para || apane mu~ha tumha apani karani|
    bara aneka bha~ti bahu barani || nahim santoshu ta puni kachu kahahu| jani risa roki dusaha dukha
    sahahu || birabrati tumha dhira achobha| gari deta na pavahu sobha || do sura samara karani karahim
    kahi na janavahim apu| bidyamana rana pai ripu kayara kathahim pratapu || || tumha tau kalu ha~ka
    janu lava| bara bara mohi lagi bolava || sunata lakhana ke bacana kathora| parasu sudhari dhareu kara
    ghora || aba jani dei dosu mohi logu| katubadi balaku badhajogu || bala biloki bahuta maim ba~ca|
    aba yahu maranihara bha sa~ca || kausika kaha chamia aparadhu| bala dosha guna ganahim na sadhu ||
    khara kuthara maim akaruna kohi| agem aparadhi gurudrohi || utara deta chorau~ binu marem| kevala
    kausika sila tumharem || na ta ehi kati kuthara kathorem| gurahi urina hoteu~ shrama thorem || do
    gadhisunu kaha hridaya~ ha~si munihi hariari sujha| ayamaya kha~da na ukhamaya ajahu~ na bujha abujha
    || || kaheu lakhana muni silu tumhara| ko nahi jana bidita samsara || mata pitahi urina bhe nikem|
    gura rinu raha socu bara jikem || so janu hamarehi mathe karhaa| dina cali ge byaja bara barhaa ||
    aba ania byavaharia boli| turata deu~ maim thaili kholi || suni katu bacana kuthara sudhara| haya
    haya saba sabha pukara || bhrigubara parasu dekhavahu mohi| bipra bicari bacu~ nripadrohi || mile
    na kabahu~ subhata rana garhae| dvija devata gharahi ke barhae || anucita kahi saba loga pukare| raghupati
