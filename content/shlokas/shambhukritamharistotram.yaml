id: shambhukritamharistotram
category: stotram
name:
  english: shambhukritamharistotram
  devanagari: शम्भुकृतंहरिस्तोत्रम्
content:
  english: shambhukritam haristotram om namo'ksharavasaya paradhamni virajate | pareshaya kishoraya mukteshaya
    namo'stu te || 2|| shuddhaya mularupaya'nantaya te namo namah | sarvarupasvarupaya sahasrabahave namah
    || 3|| sahasrarashmiyuktaya vedhase shuddhakarmane | vishaladehavasaya vishvarttiharine namah || 4||
    sahasrarkasvarupaya shambhave tai namo namah | samastavidyavasaya cakrine te namo namah || 5|| sada
    samastagirvanairnute krishnaya te namah | anadine bhupataye'cyutaya sheshavasine || 6|| marutam pataye
    sarvapataye te sada namah | jaleshaya kshitishaya vishvanetraya te namah || 7|| shashankaya ca suryaya
    vishveshvaraya te namah | apratarkyasvarupaya'mritarupaya te namah || 8|| digantaraprakashaya hridambaraya
    te namah | narayana'yanayeti vishvatomukhine namah || 9|| devartiharine'sankhyavaktraya vishnave namah
    | puranaya maheshaya jagatprasuyate namah || 10|| kotidehishu kaishcit tvam sanmargibhirupasyase |
    eko bhavan prakriteshca paradaksharatah parah || 11|| vidamagresarah sarvavijno vishalamurtikah |
    sukshmarupo guna yatra prakrita na vasanti him || 12|| vaca na vishayo yashca bhaktavagvishayo'sti
    sah | na ca karma'bhibhuto yah karoti satatam srijim || 13|| anindriyo'pi cendradyairupasyashcendriyadiman
    | asare'pi ca samsare sararupo'sti vai bhavan || 14|| yajadbhiravasiyeta'tadrisho'pi caturbhujah |
    param rupam na janimo janimo drishtigocaram || 15|| avataratanum vidmastaddvara''shrayamapnumah |
    abjayonistava varshma naiva veda na capyaham || 16|| vedmi vishuddhatapasa puranam kavimishvaram |
    aham padmasanadyashca prasutashcasakridvibhoh || 17|| balenaiva maya canyaih sambuddhyase na kidrishah
    | natya tushtim pragacchamah stutya triptashca vaidikah || 18|| janmantaravivekotthatvatprasadanmatiryadi
    | labdhalabha bhavettena shivam syadbrahmaparagam || 19|| sukshmah sthulo bhava~shca'dya mama netrasya
    bhurabhuh | drishto'si kritakrityo'ham sulabho me'dya bhagyatah || 20|| nato'smi dandavadvishno'rpito'smi
    padayostava | stutim jushasva bhaktasya janardana
  devanagari: शम्भुकृतं हरिस्तोत्रम् ॐ नमोऽक्षरवासाय परधाम्नि विराजते । परेशाय किशोराय मुक्तेशाय नमोऽस्तु
    ते ॥ २॥ शुद्धाय मूलरूपायाऽनन्ताय ते नमो नमः । सर्वरूपस्वरूपाय सहस्रबाहवे नमः ॥ ३॥ सहस्ररश्मियुक्ताय
    वेधसे शुद्धकर्मणे । विशालदेहवासाय विश्वार्त्तिहारिणे नमः ॥ ४॥ सहस्रार्कस्वरूपाय शम्भवे तै नमो नमः
    । समस्तविद्यावासाय चक्रिणे ते नमो नमः ॥ ५॥ सदा समस्तगीर्वाणैर्नुते कृष्णाय ते नमः । अनादिने भूपतयेऽच्युताय
    शेषवासिने ॥ ६॥ मरुतां पतये सर्वपतये ते सदा नमः । जलेशाय क्षितीशाय विश्वनेत्राय ते नमः ॥ ७॥ शशाङ्काय
    च सूर्याय विश्वेश्वराय ते नमः । अप्रतर्क्यस्वरूपायाऽमृतरूपाय ते नमः ॥ ८॥ दिगन्तरप्रकाशाय हृदम्बराय
    ते नमः । नारायणाऽयनायेति विश्वतोमुखिने नमः ॥ ९॥ देवार्तिहारिणेऽसङ्ख्यवक्त्राय विष्णवे नमः । पुराणाय
    महेशाय जगत्प्रसूयते नमः ॥ १०॥ कोटिदेहिषु कैश्चित् त्वं सन्मार्गिभिरुपास्यसे । एको भवान् प्रकृतेश्च
    परादक्षरतः परः ॥ ११॥ विदामग्रेसरः सर्वविज्ञो विशालमूर्तिकः । सूक्ष्मरूपो गुणा यत्र प्राकृता न वसन्ति
    हिम् ॥ १२॥ वाचा न विषयो यश्च भक्तवाग्विषयोऽस्ति सः । न च कर्माऽभिभूतो यः करोति सततं सृजिम् ॥ १३॥ अनिन्द्रियोऽपि
    चेन्द्राद्यैरुपास्यश्चेन्द्रियादिमान् । असारेऽपि च संसारे साररूपोऽस्ति वै भवान् ॥ १४॥ यजद्भिरवसीयेताऽतादृशोऽपि
    चतुर्भुजः । परं रूपं न जानीमो जानीमो दृष्टिगोचरम् ॥ १५॥ अवतारतनुं विद्मस्तद्द्वाराऽऽश्रयमाप्नुमः ।
    अब्जयोनिस्तव वर्ष्म नैव वेद न चाप्यहम् ॥ १६॥ वेद्मि विशुद्धतपसा पुराणं कविमीश्वरम् । अहं पद्मासनाद्याश्च
    प्रसूताश्चासकृद्विभोः ॥ १७॥ बालेनैव मया चान्यैः सम्बुद्ध्यसे न कीदृशः । नत्या तुष्टिं प्रगच्छामः स्तुत्या
    तृप्ताश्च वैदिकाः ॥ १८॥ जन्मान्तरविवेकोत्थत्वत्प्रसादान्मतिर्यदि । लब्धलाभा भवेत्तेन शिवं स्याद्ब्रह्मपारगम्
    ॥ १९॥ सूक्ष्मः स्थूलो भवँश्चाऽद्य मम नेत्रस्य भूरभूः । दृष्टोऽसि कृतकृत्योऽहं सुलभो मेऽद्य भाग्यतः
    ॥ २०॥ नतोऽस्मि दण्डवद्विष्णोऽर्पितोऽस्मि पादयोस्तव । स्तुतिं जुषस्व भक्तस्य जनार्दन
