id: devadibhihkritamskandastotram
category: stotram
name:
  english: devadibhihkritamskandastotram
  devanagari: देवादिभिःकृतंस्कन्दस्तोत्रम्
content:
  english: kalpanakhanikaravirajitacaranakamala skanda jaya bala saptavasara bhuvanavalishokasandahana
    || 47|| namo namaste'stu manoramaya namo'stu te sadhubhayapahaya | namo'stu te balakritacalaya namo
    namo nashaya devashatrun || 48|| iti shriskandapurane maheshvarakhande kaumarikakhande ekatrimshadhyayantargatam
    devavibhihkritam skandastotram samaptam | skandapurana | maheshvarakhanda | kaumarikakhanda | adhyaya
    31
  devanagari: कल्पनखनिकरविराजितचरणकमल स्कन्द जय बाल सप्तवासर भुवनावलिशोकसन्दहन ॥ ४७॥ नमो नमस्तेऽस्तु मनोरमाय
    नमोऽस्तु ते साधुभयापहाय । नमोऽस्तु ते बालकृताचलाय नमो नमो नाशय देवशत्रून् ॥ ४८॥ इति श्रीस्कन्दपुराणे
    माहेश्वरखण्डे कौमारिकाखण्डे एकत्रिंशाध्यायान्तर्गतं देवाविभिःकृतं स्कन्दस्तोत्रं समाप्तम् । स्कन्दपुराण
    । माहेश्वरखण्ड । कौमारिकाखण्ड । अध्याय ३१
meaning: {}
