id: niralambopanishat
category: upanishad
name:
  english: niralambopanishat
  devanagari: निरालम्बोपनिषत्
content:
  english: niralambopanishat yatralambalambibhavo vidyate na kadacana | jnavijnasamyagjnalambam niralambam
    harim bhaje || om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || om namah shivaya gurave saccidanandamurtaye | nishprapancaya shantaya
    niralambaya tejase || niralambam samashritya salambam vijahati yah | sa samnyasi ca yogi ca kaivalyam
    padamashnute ||1|| eshamajnanajantunam samastarishtashantaye | yadyadboddhavyamakhilam tadashankya
    bravimyam ||2|| kim brahma | ka ishvarah | ko jivah | ka prakritih | kah paramatma | ko brahma | ko
    vishnuh | ko rudrah | ka indrah | kah shamanah | sah shamanah | kah surya | kashcandra | ke surah
    | ke asurah | ke pishacah | ke manushyah | kah striyah | ke pashvadayah | kim sthavaram | ke brahmanadayah
    | ka jatih | kim karma | kimakarma | kim jnanam | kimajnanam | kim sukham | kim dukham | kah svargah
    | ko narakah | ko bandhah | ko mokshah | ka upasyah | kah shishyah | ko vidvan | ko mudhah | kimasuram
    | kim tapah | kim padamam padam | kim grahyam | kimagrahyam | kah samnyasityashankyaha brahmeti |
    ||3|| sa hovaca mahadahankaraprithivyaptèjovayvakashatvena brihadrupenandakoshena karmajnanartharupataya
    bhasamanamadvitiyamakhilopadvinirmuktam tatsakalashaktyupabrimhitamanadyanantam shuddham shivam shantam
    nirgunamityadivacyamanirvacyam caitanyam brahma ishvara iti ca | brahmaiva svashaktim prakrityabhidheyamashritya
    lokansrishtva pravishyantaryamitvena brahmadinam buddhindriyaniyantritvadishvarah || 4 || jiva iti
    ca brahmavishnavishanendradinam namarupadvara sthulo'hamiti mithyadhyasavashajjivah | so'hameko'pi
    deharambhakabhedavashadbahujivah || 5 || prakritiriti ca brahmanah sakashannanavicitrajagannirmanasamarthyabuddhirupa
    brahmashaktireva prakritih || 6 || paramatmeti ca dehadeh parataratvadbrahmaiva paramatma || 7 ||
    sa brahma sa vishnuh sa indrah sa shamanah sa suryah sa candraste asuraste pishacaste manushyastah
    striyate pashvadayastatsthavaram te brahmanadayah || 8 || sarvam khalvidam brahma neha nanasti kincana
    || 9 || jatiriti ca | na carmano na raktasya na mamsasya na casthinah | na jatiratmano jatirvyavaharaprakalpita
    || 10 || karmeti ca kriyamanendriyaih karmanyaham karomityadhyatmanishthataya kritam karmaiva karma
    | akarmeti ca kartuvyabhoktritvadyahankarataya bandharupam janmadikaranam nityanaimittikayagavratatapodanadishu
    phalabhisandhanam yattadakarma|| 11
  devanagari: निरालम्बोपनिषत् यत्रालम्बालम्बिभावो विद्यते न कदाचन । ज्ञविज्ञसम्यग्ज्ञालम्बं निरालम्बं
    हरिं भजे ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ
    शान्तिः शान्तिः शान्तिः ॥ ॐ नमः शिवाय गुरवे सच्चिदानन्दमूर्तये । निष्प्रपञ्चाय शान्ताय निरालम्बाय
    तेजसे ॥ निरालम्बं समाश्रित्य सालम्बं विजहाति यः । स संन्यासी च योगी च कैवल्यं पदमश्नुते ॥१॥ एषमज्ञानजन्तूनां
    समस्तारिष्टशान्तये । यद्यद्बोद्धव्यमखिलं तदाशङ्क्य ब्रवीम्यम् ॥२॥ किं ब्रह्म । क ईश्वरः । को जीवः
    । का प्रकृतिः । कः परमात्मा । को ब्रह्मा । को विष्णुः । को रुद्रः । क इन्द्रः । कः शमनः । सः शमनः
    । कः सूर्य । कश्चन्द्र । के सुराः । के असुराः । के पिशाचाः । के मनुष्याः । काः स्त्रियः । के पश्वादयः
    । किं स्थावरम् । के ब्राह्मणादयः । का जातिः । किं कर्म । किमकर्म । किं ज्ञानम् । किमज्ञानम् । किं
    सुखम् । किं दुखम् । कः स्वर्गः । को नरकः । को बन्धः । को मोक्षः । क उपास्यः । कः शिष्यः । को विद्वान्
    । को मूढः । किमासुरम् । किं तपः । किं पदमं पदम् । किं ग्राह्यम् । किमग्राह्यम् । कः संन्यासीत्याशङ्क्याह
    ब्रह्मेति । ॥३॥ स होवाच महदहङ्कारपृथिव्यप्तॆजोवाय्वाकाशत्वेन बृहद्रूपेणाण्डकोशेन कर्मज्ञानार्थरूपतया
    भासमानमद्वितीयमखिलोपाद्विनिर्मुक्तं तत्सकलशक्त्युपबृंहितमनाद्यनन्तं शुद्धं शिवं शान्तं निर्गुणमित्यादिवाच्यमनिर्वाच्यं
    चैतन्यं ब्रह्म ईश्वर इति च । ब्रह्मैव स्वशक्तिं प्रकृत्यभिधेयामाश्रित्य लोकान्सृष्ट्वा प्रविश्यान्तर्यामित्वेन
    ब्रह्मादीनां बुद्धीन्द्रियनियन्तृत्वादीश्वरः ॥ ४ ॥ जीव इति च ब्रह्मविष्णवीशानेन्द्रादीनां नामरूपद्वारा
    स्थूलोऽहमिति मिथ्याध्यासवशाज्जीवः । सोऽहमेकोऽपि देहारम्भकभेदवशाद्बहुजीवः ॥ ५ ॥ प्रकृतिरिति च ब्रह्मणः
    सकाशान्नानाविचित्रजगन्निर्माणसामार्थ्यबुद्धिरूपा ब्रह्मशक्तिरेव प्रकृतिः ॥ ६ ॥ परमात्मेति च देहादेः
    परतरत्वाद्ब्रह्मैव परमात्मा ॥ ७ ॥ स ब्रह्मा स विष्णुः स इन्द्रः स शमनः स सूर्यः स चन्द्रस्ते असुरास्ते
    पिशाचास्ते मनुष्यास्ताः स्त्रियते पश्वादयस्तत्स्थावरं ते ब्राह्मणादयः ॥ ८ ॥ सर्वं खल्विदं ब्रह्म नेह
    नानास्ति किञ्चन ॥ ९ ॥ जातिरिति च । न चर्मणो न रक्तस्य न मांसस्य न चास्थिनः । न जातिरात्मनो जातिर्व्यवहारप्रकल्पिता
    ॥ १० ॥ कर्मेति च क्रियमाणेन्द्रियैः कर्माण्यहं करोमीत्यध्यात्मनिष्ठतया कृतं कर्मैव कर्म । अकर्मेति
    च कर्तुव्यभोक्तृत्वाद्यहङ्कारतया बन्धरूपं जन्मादिकारणं नित्यनैमित्तिकयागव्रततपोदानादिषु फलाभिसन्धानं
    यत्तदकर्म॥ ११
