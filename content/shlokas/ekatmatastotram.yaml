id: ekatmatastotram
category: stotram
name:
  english: ekatmatastotram
  devanagari: एकात्मतास्तोत्रम्
content:
  english: shrikrishnadevarayashca lalitaditya udbalah ||24|| musunurinayakau tau pratapah shiva bhupatih
    ranajitasimha ityete vira vikhyata vikramah ||25|| vaijnanikashca kapilah kanadah shushrutastatha
    carako bhaskaracaryo varahamihira sudhih ||26|| nagarjuna bharadvaja aryabhatto vasurbudhah dhyeyo
    vemkata ramashca vijna ramanujayah ||27|| ramakrishno dayanando ravindro ramamohanah ramatirtho'ravindashca
    vivekananda udyashah ||28|| dadabhai gopabamdhustilako gamdhiradritah ramano malaviyashca shrisubrahmanyabharati
    ||29|| subhashah pranavanandah krantiviro vinayakah thakkaro bhimaravashca phule narayano guruh ||30||
    sanghashaktipranetarau keshavo madhavastatha smaraniyah sadaivaite navacaitanyadayakah ||31|| anukta
    ye bhaktah prabhucaranasamsaktahridayah anirdishtah vira adhisamaramuddhvastaripavah samajoddhartarah
    suhitakaravijnananipunah namastebhyo bhuyatsakalasujanebhyah pratidinam
  devanagari: श्रीकृष्णदेवरायश्च ललितादित्य उद्बलः ॥२४॥ मुसुनूरिनायकौ तौ प्रतापः शिव भूपतिः रणजितसिंह
    इत्येते वीरा विख्यात विक्रमाः ॥२५॥ वैज्ञानिकाश्च कपिलः कणादः शुश्रुतस्तथा चरको भास्कराचार्यो वराहमिहिर
    सुधीः ॥२६॥ नागार्जुन भरद्वाज आर्यभट्टो वसुर्बुधः ध्येयो वेंकट रामश्च विज्ञा रामानुजायः ॥२७॥ रामकृष्णो
    दयानन्दो रवीन्द्रो राममोहनः रामतीर्थोऽरविन्दाश्च विवेकानन्द उद्यशः ॥२८॥ दादाभाई गोपबंधुस्तिलको गांधिरादृताः
    रमणो मालवीयश्च श्रीसुब्रह्मण्यभारती ॥२९॥ सुभाषः प्रणवानन्दः क्रान्तिवीरो विनायकः ठक्करो भीमरावश्च
    फुले नारायणो गुरुः ॥३०॥ सङ्घशक्तिप्रणेतारौ केशवो माधवस्तथा स्मरणीयाः सदैवैते नवचैतन्यदायकाः ॥३१॥ अनुक्ता
    ये भक्ताः प्रभुचरणसंसक्तहृदयाः अनिर्दिष्टाः वीरा अधिसमरमुद्ध्वस्तरिपवः समाजोद्धर्तारः सुहितकरविज्ञाननिपुणाः
    नमस्तेभ्यो भूयात्सकलसुजनेभ्यः प्रतिदिनम्
meaning: {}
