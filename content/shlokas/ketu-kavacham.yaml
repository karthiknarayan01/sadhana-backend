id: ketu-kavacham
category: stotram
name:
  english: Ketu Kavacham
content:
  english: dhyanam ketum karalavadanam citravarnam kiritinam | pranamami sada ketum dhvajakaram graheshvaram
    || || | atha ketu kavacam | citravarnah shirah patu bhalam dhumrasamadyutih | patu netre pingalakshah
    shruti me raktalocanah || || ghranam patu suvarnabhashcibukam simhikasutah | patu kantham ca me ketuh
    skandhau patu grahadhipah || || hastau patu surashreshthah kukshim patu mahagrahah | simhasanah katim
    patu madhyam patu mahasurah || || uru patu mahashirsho januni me'tikopanah | patu padau ca me krurah
    sarvangam narapingalah || || phalashrutih ya idam kavacam divyam sarvarogavinashanam | sarvashatruvinasham
    ca dharanadvijayi bhavet || || || iti shribrahmandapurane ketukavacam sampurnam ||
  devanagari: ध्यानं केतुं करालवदनं चित्रवर्णं किरीटिनम् । प्रणमामि सदा केतुं ध्वजाकारं ग्रहेश्वरम् ॥
    ॥ । अथ केतु कवचम् । चित्रवर्णः शिरः पातु भालं धूम्रसमद्युतिः । पातु नेत्रे पिङ्गलाक्षः श्रुती मे रक्तलोचनः
    ॥ ॥ घ्राणं पातु सुवर्णाभश्चिबुकं सिंहिकासुतः । पातु कण्ठं च मे केतुः स्कन्धौ पातु ग्रहाधिपः ॥ ॥ हस्तौ
    पातु सुरश्रेष्ठः कुक्षिं पातु महाग्रहः । सिंहासनः कटिं पातु मध्यं पातु महासुरः ॥ ॥ ऊरू पातु महाशीर्षो
    जानुनी मेऽतिकोपनः । पातु पादौ च मे क्रूरः सर्वाङ्गं नरपिङ्गलः ॥ ॥ फलश्रुतिः य इदं कवचं दिव्यं सर्वरोगविनाशनम्
    । सर्वशत्रुविनाशं च धारणाद्विजयी भवेत् ॥ ॥ ॥ इति श्रीब्रह्माण्डपुराणे केतुकवचं सम्पूर्णम् ॥
