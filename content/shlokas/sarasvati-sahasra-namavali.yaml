id: sarasvati-sahasra-namavali
category: stotram
name:
  english: Sarasvati Sahasra Namavali
  devanagari: सरस्वतीसहस्रनामावलिः
content:
  english: sarasvatisahasranamavalih vishveshapriyakarinyai vishishtapriyakarinyai vedavedantasamvedyayai
    vedantajnanarupinyai vipravaryaprapujitayai shantacarapriyankaryai shuddhacittaprapujitayai sarvasiddhipradayinyai
    sarvavidyapradayinyai sargasthityantakarinyai sahasragunalankritavigrahayai sarvasiddhipradayinyai
    sarvasampatpradayinyai sarvatirthapunyaphalapradayai sthulasukshmaparambikayai surendradiprapujitayai
    mahasiddhipradayinyai matrinam murdhnisamsthitayai mahasampatpradayinyai mahashantipradayinyai mukhyacandrardhashekharayai
    manahshuddhipradayinyai mahakarunyasampurnayai mahapunyaphalaprapyayai mahadaridryanashinyai bhikshadanakritodyamayai
    bhaktalakshmipradayinyai bhagyavaddrishtigocarayai brahmandadhipavallabhayai brahmeshavishnurupayai
    brahmavishnvishasamsthitayai anantacandranibhananayai anantagambhirasammitayai adrishtabhagyaphalapradayai
    anekavighnasamhartryai apratarkyagatipradayai ambujasanamahapriyayai ambujatodbhavamahapriyayai astikasvantanilayayai
    askhaladvidyapradayinyai japakritpapasamhartryai jyotirvrityabhidayinyai jatajutanacandrardhayai jambharadyadisamstutyayai
    jitaratisurastutyayai kratusarvakriyastutyayai kratukritpriyakarinyai kadambodyanamadhyasthayai kundamandarapushpabhayai
    kapardasthitacandrikayai trailokyasamstutyayai tattadbrahmasvarupinyai tripuraripriyankaryai yogakartripriyankaryai
    yogayogishvarambikayai yamadyashtangayogatayai yantritaghaughasamharayai yashtivyashtishasamstutyayai
    yamadyashtangayogayuje yatananannikrintanyai yattacchabdasvarupinyai yavadvidyabrindasuvanditayai
    yogivaryapriyankaryai yantrakartripriyankaryai yogikamyapradatryai yogimokshapradayinyai ||iti shriskandapuranantargata
    samvade sarasvatisahasranamastotrasya namavali rupantaram sampurnam||
  devanagari: सरस्वतीसहस्रनामावलिः विश्वेशप्रियकारिण्यै विशिष्टप्रियकारिण्यै वेदवेदान्तसंवेद्यायै वेदान्तज्ञानरूपिण्यै
    विप्रवर्यप्रपूजितायै शान्ताचारप्रियङ्कर्यै शुद्धचित्तप्रपूजितायै सर्वसिद्धिप्रदायिन्यै सर्वविद्याप्रदायिन्यै
    सर्गस्थित्यन्तकारिण्यै साहस्रगुणालङ्कृतविग्रहायै सर्वसिद्धिप्रदायिन्यै सर्वसम्पत्प्रदायिन्यै सर्वतीर्थपुण्यफलप्रदायै
    स्थूलसूक्ष्मापराम्बिकायै सुरेन्द्रादिप्रपूजितायै महासिद्धिप्रदायिन्यै मातॄणां मूर्ध्निसंस्थितायै महासम्पत्प्रदायिन्यै
    महाशान्तिप्रदायिन्यै मुख्यचन्द्रार्धशेखरायै मनःशुद्धिप्रदायिन्यै महाकारुण्यसम्पूर्णायै महापुण्यफलप्राप्यायै
    महादारिद्र्यनाशिन्यै भिक्षादानकृतोद्यमायै भक्तलक्ष्मीप्रदायिन्यै भाग्यवद्दृष्टिगोचरायै ब्रह्माण्डाधिपवल्लभायै
    ब्रह्मेशविष्णुरूपायै ब्रह्मविष्ण्वीशसंस्थितायै अनन्तचन्द्रनिभाननायै अनन्तगम्भीरसम्मितायै अदृष्टभाग्यफलप्रदायै
    अनेकविघ्नसंहर्त्र्यै अप्रतर्क्यगतिप्रदायै अम्बुजासनमहाप्रियायै अम्बुजातोद्भवमहाप्रियायै आस्तिकस्वान्तनिलयायै
    अस्खलद्विद्याप्रदायिन्यै जपकृत्पापसंहर्त्र्यै ज्योतिर्वृत्यभिदायिन्यै जटाजूटनचन्द्रार्धायै जम्भराद्यादिसंस्तुत्यायै
    जितारातिसुरस्तुत्यायै क्रतुसर्वक्रियास्तुत्यायै क्रतुकृत्प्रियकारिण्यै कदम्बोद्यानमध्यस्थायै कुन्दमन्दारपुष्पाभायै
    कपर्दस्थितचन्द्रिकायै त्रैलोक्यसंस्तुत्यायै तत्तद्ब्रह्मस्वरूपिण्यै त्रिपुरारिप्रियङ्कर्यै योगकर्तृप्रियङ्कर्यै
    योगयोगीश्वराम्बिकायै यमाद्यष्टाङ्गयोगतायै यन्त्रिताघौघसंहारायै यष्टिव्यष्टीशसंस्तुत्यायै यमाद्यष्टाङ्गयोगयुजे
    यातनानान्निकृन्तन्यै यत्तच्छब्दस्वरूपिण्यै यावद्विद्याबृन्दसुवन्दितायै योगिवर्यप्रियङ्कर्यै यन्त्रकर्तृप्रियङ्कर्यै
    योगिकाम्यप्रदात्र्यै योगिमोक्षप्रदायिन्यै ॥इति श्रीस्कान्दपुराणान्तर्गत संवादे सरस्वतीसहस्रनामस्तोत्रस्य
    नामावली रूपान्तरं सम्पूर्णम्॥
