id: mahalakshmikritamharistotram
category: stotram
name:
  english: mahalakshmikritamharistotram
  devanagari: महालक्ष्मिकृतंहरिस्तोत्रम्
content:
  english: mahalakshmikritam haristotram mahalakshmi uvaca | satyasvarupam satyesham satyabijam sanatanam
    | satyadharam ca satyajnam satyamulam namamyaham || 68|| ityuktva shriharim natva sa covasa sukhasane
    | taptakancanavarnabha bhasayanti dishastvisha || 69|| iti brahmavaivartapaharane brahmakhande tritiyadhyayantargatam
    mahalakshmikritam haristotram samaptam | brahmavaivartapurana | brahmakhanda | adhyaya 3
  devanagari: महालक्ष्मिकृतं हरिस्तोत्रम् महालक्ष्मी उवाच । सत्यस्वरूपं सत्येशं सत्यबीजं सनातनम् । सत्याधारं
    च सत्यज्ञं सत्यमूलं नमाम्यहम् ॥ ६८॥ इत्युक्त्वा श्रीहरिं नत्वा सा चोवास सुखासने । तप्तकाञ्चनवर्णाभा
    भासयन्ती दिशस्त्विषा ॥ ६९॥ इति ब्रह्मवैवर्तपहराणे ब्रह्मखण्डे तृतीयाध्यायान्तर्गतं महालक्ष्मिकृतं
    हरिस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । ब्रह्मखण्ड । अध्याय ३
meaning: {}
