id: parashuramasahasranamastotra-2
category: sahasranama
name:
  english: parashuramasahasranamastotra
  devanagari: परशुरामसहस्रनामस्तोत्र
content:
  english: sarvajicchatrudarpaha kavirbrahmarshi varadah kamandaludharah kriti || 12|| mahodaro'tulo bhavyo
    jitashadvargamandalah | kantah punyah sukirtishca dvibhujashcadi purushah || 13|| akalmasho duraradhyah
    sarvavasah kritagamah | viryavansmitabhashi ca nivrittatma punarvasuh || 14|| adhyatmayogakushalah
    sarvayudhavisharadah | yajnasvarupi yajnesho yajnapalah sanatanah || 15|| ghanashyamah smritih shuro
    jaramaranavarjitah | dhiro dantah surupashca sarvatirthamayo vidhih || 16|| dhirodattah svarupashca
    varni varnashramaguruh sarvajitpurusho'vyayah | shivashikshaparo yuktah paramatma parayanah || 17||
    pramana rupo durjneyah purnah krurah kraturvibhuh | anando'tha gunashreshtho'nantadrishtirgunakarah
    || 18|| dhanurdharo dhanurvedah saccidanandavigrahah | janeshvaro vinitatma mahakayastapasvirat ||
    19|| akhiladyo vishvakarma vinitatma visharadah | aksharah keshavah sakshi maricih sarvakamadah ||
    20|| kalyanah prakriti kalpah sarveshah purushottamah | lokadhyaksho gabhiro'tha sarvabhaktavarapradah
    || 21|| jyotiranandarupashca vahnirakshaya ashrami | bhurbhuvahsvastapomurti ravih parashudhrik svarat
    || 22|| bahushrutah satyavadi bhrajishnuh sahano balah | sukhadah karanam bhokta bhavabandha vimokshakrit
    || 23|| samsaratarako neta sarvaduhkhavimokshakrit | devacudamanih kundah sutapa brahmavardhanah ||
    24|| nityo niyatakalyanah shuddhatmatha puratanah | duhsvapnanashano nitih kiriti skandadarpahrit
    || 25|| arjunah pranaha virah sahasrabhujajiddharih | kshatriyantakarah shurah kshitibharakarantakrit
    || 26|| parashvadhadharo dhanvi renukavakyatatparah | viraha vishamo virah pitrivakyaparayanah ||
    27|| matripranada ishashca dharmatattvavisharadah | pitrikrodhaharah krodhah saptajihvasamaprabhah
    || 28|| svabhavabhadrah shatrughnah sthanuh shambhushca keshavah | sthavishthah sthaviro balah sukshmo
    lakshyadyutirmahan || 29|| brahmacari vinitatma rudrakshavalayah sudhih | akshakarnah sahasramshurdiptah
    kaivalyatatparah || 30|| adityah kalarudrashca kalacakrapravartakah | kavaci kundali khadgi cakri
    bhimaparakramah || 31|| mrityunjayo vira simho jagadatma jagadguruh | amrityurjanmarahitah kalajnani
    mahapatuh || 32|| nishkalanko gunagramo'nirvinnah smararupadhrik | anirvedyah shatavarto dando damayita
    damah || 33|| pradhanastarako dhimamstapasvi bhutasarathih | ahah samvatsaro yogi samvatsarakaro dvijah
    || 34|| shashvato lokanathashca shakhi dandi bali jati | kalayogi mahanandah tigmamanyuh suvarcasah
    || 35|| amarshano marshanatma prashantatma hutashanah | sarvavasah sarvacari sarvadharo virocanah
    || 36|| haimo hemakaro dharmo durvasa vasavo yamah | ugrateja mahateja jayo vijayah kalajit || 37||
    sahasrahasto vijayo durdharo yajnabhagabhuk | agnirjvali mahajvalastvatidhumo huto havih || 38|| svastidah
    svastibhagashca mahanbhargah paro yuva | mahanbhargaparoyuva mahatpado mahahasto brihatkayo mahayashah
    || 39|| mahakatirmahagrivo mahabahurmahakarah | mahanaso mahakamburmahamayah payonidhih || 40|| mahavaksha
    mahaujashca mahakesho mahajanah | mahamurdha mahamatro mahakarno mahahanuh || 41|| vrikshakaro mahaketurmahadamshtro
    mahamukhah | ekaviro mahaviro vasudah kalapujitah || 42|| mahameghaninadi ca mahaghosho mahadyutih
    | shaivah shaivagamacari haihayanam kulantakah || 43|| sarvaguhyamayo vajri bahulah karmasadhanah
    | kami kapih kamapalah kamadevah kritagamah || 44|| pancavimshatitattvajnah sarvajnah sarvagocarah
    | lokaneta mahanadah kalayogi mahabalah || 45|| asankhyeyo'prameyatma viryakridviryakovidah | vedavedyo
    viyadgopta sarvamaramunishvarah || 46|| sureshah sharanam sharma shabdabrahma satam gatih | nirlepo
    nishprapancatma nirvyagro vyagranashanah || 47|| shuddhah putah shivarambhah sahasrabhujajiddharih
    | niravadyapadopayah siddhidah siddhisadhanah || 48|| caturbhujo mahadevo vyudhorasko janeshvarah
    | dyumanistaranirdhanyah kartavirya balapaha || 49|| lakshmanagrajavandyashca naro narayanah priyah
    | ekajyotirniratanko matsyarupi janapriyah || 50|| supritah sumukhah sukshmah kurmo varahakastatha
    | vyapako narasimhashca balijinmadhusudanah || 51|| aparajitah sarvasaho bhushano bhutavahanah | nivrittah
    samvrittah shilpi kshudraha nitya sundarah || 52|| stavyah stavapriyah stota vyasamurtiranakulah |
    prashantabuddhirakshudrah sarvasattvavalambanah || 53|| paramarthagururdevo mali samsarasarathih |
    raso rasajnah sarajnah kankanikritavasukih || 54|| krishnah krishnastuto dhiro mayatito vimatsarah
    | maheshvaro mahibharta shakalyah sharvaripatih || 55|| tatasthah karnadikshadah suradhyakshah surariha
    | dhyeyo'gradhuryo dhatrisho rucistribhuvaneshvarah || 56|| karmadhyaksho niralambah sarvakamyah phalapradah
    | avyaktalakshano vyakto vyaktavyakto vishampatih || 57|| trilokatma trilokesho jagannatho janeshvarah
    | brahma hamsashca rudrashca srashta harta caturmukhah || 58|| nirmado nirahankaro bhriguvamshodvahah
    shubhah | vedha vidhata druhino devajno devacintanah || 59|| kailasashikharavasi brahmano brahmanapriyah
    | artho'nartho mahakosho jyeshthah shreshthah shubhakritih || 60|| banarirdamano yajva snigdhaprakritiragniyah
    | varashilo varagunah satyakirtih kripakarah || 61|| sattvavan sattviko dharmi buddhah kalki sadashrayah
    | darpano darpaha darpatito driptah pravartakah || 62|| amritamsho'mritavapurvanmayah sadasanmayah
    | nidhanagarbho bhushayi kapilo vishvabhojanah || 63|| prabhavishnurgrasishnushca caturvargaphalapradah
    | narasimho mahabhimah sharabhah kalipavanah || 64|| ugrah pashupatirbhargo vaidyah keshinishudanah
    | govindo gopatirgopta gopalo gopavallabhah || 65|| bhutavaso guhavasah satyavasah shrutagamah | nishkantakah
    sahasrarcih snigdhah prakritidakshinah || 66|| lakshanah akampito gunagrahi supritah pritivardhanah
    | padmagarbho mahagarbho vajragarbho jalodbhavah || 67|| gabhastirbrahmakridbrahma rajarajah svayambhavah
    | svayambhuvah senaniragrani sadhurbalastalikaro mahan || 68|| prithivi vayurapashca tejah kham bahulocanah
    | sahasramurdha devendrah sarvaguhyamayo guruh || 69|| avinashi sukharamastriloki pranadharakah |
    nidrarupam kshama tandra dhritirmedha svadha havih || 70|| hota neta shivastrata saptajihvo vishuddhapat
    | svaha havyashca kavyashca shataghni shatapashadhrik || 71|| arohashca nirohashca tirthah tirthakaro
    harah | caracaratma sukshmastu vivasvan savitamritam || 72|| tushtih pushtih kala kashtha masah pakshastu
    vasarah | rituryugadikalastu lingamatmatha shashvatah || 73|| ciranjivi prasannatma nakulah pranadharanah
    | svargadvaram prajadvaram mokshadvaram trivishtapam || 74|| muktirlakshmistatha bhuktirviraja virajambarah
    | vishvakshetram sadabijam punyashravanakirtanah || 75|| bhikshurbhaikshyam griham dara yajamanashca
    yacakah | pakshi ca pakshavahashca manovego nishacarah || 76|| gajaha daityaha nakah puruhutah purushtutah
    | purubhutah bandhavo bandhuvargashca pita mata sakha sutah || 77|| gayatrivallabhah pramshurmandhata
    bhutabhavanah | siddharthakari sarvarthashchando vyakarana shrutih || 78|| smritirgathopashantashca
    puranah pranacancurah | shantishca vamanashca jagatkalah sukritashca yugadhipah || 79|| udgithah pranavo
    bhanuh skando vaishravanastatha | antaratma hrishikeshah padmanabhah stutipriyah || 80||skando vaishravanastatha
    parashvadhayudhah shakhi simhagah simhavahanah | simhanadah simhadamshtro nago mandaradhriksarah ||
    81|| sharah sahyacalanivasi ca mahendrakritasamshrayah | manobuddhirahankarah kamalanandavardhanah
    || 82|| sanatanatamah sragvi gadi shankhi rathangabhrit | niriho nirvikalpashca samartho'narthanashanah
    || 83|| akayo bhaktakayashca madhavo'tha surarcitah | yoddha jeta mahaviryah shankarah santatah stutah
    || 84|| vishveshvaro vishvamurtirvishvaramo'tha vishvakrit | ajanubahuh sulabhah param jyotih sanatanah
    || 85|| vaikunthah pundarikakshah sarvabhutashayasthitah | sahasrashirsha purushah sahasrakshah sahasrapat
    || 86|| urdhvaretah urdhvalingah pravaro varado varah | unmattaveshah pracchannah saptadvipamahipradah
    || 87|| dvijadharmapratishthata vedatma vedakricchrayah | nityah sampurnakamashca sarvajnah kushalagamah
    || 88|| kripapiyushajaladhirdhata karta paratparah | acalo nirmalastriptah sve mahimni pratishthitah
    || 89|| asahayah sahayashca jagaddheturakaranah | mokshadah kirtidashcaiva prerakah kirtinayakah ||
    90|| adharmashatrurakshobhyo vamadevo mahabalah | vishvaviryo mahaviryo shrinivasah satam gatih ||
    91|| svarnavarno varangashca sadyogi ca dvijottamah | nakshatramali surabhirvimalo vishvapavanah ||
    92|| vasanto madhavo grishmo nabhasyo bijavahanah | nidaghastapano megho nabho yonih parasharah ||
    93|| sukhanilah sunishpannah shishiro naravahanah | shrigarbhah karanam japyo durgah satyaparakramah
    || 94|| atmabhuraniruddhashca dattatreyastrivikramah | jamadagnirbalanidhih pulastyah pulaho'ngirah
    || 95|| varni varnagurushcandah kalpavrikshah kaladharah | mahendro durbharah siddho yogacaryo brihaspatih
    || 96|| nirakaro vishuddhashca vyadhiharta niramayah | amogho'nishtamathano mukundo vigatajvarah ||
    97|| svayamjyotirgurutamah suprasado'calastatha | candrah suryah shanih keturbhumijah somanandanah
    || 98|| bhrigurmahatapa dirghatapah siddho mahaguruh | mantri mantrayita mantro vagmi vasumanah sthirah
    || 99|| adriradrishayo shambhurmangalyo mangalovritah | jayastambho jagatstambho bahurupo gunottamah
    || 100|| sarvadevamayo'cintyo devatatma virupadhrik | caturvedashcaturbhavashcaturashcaturapriyah
    || 101|| adyantashunyo vaikunthah karmasakshi phalapradah | dridhayudhah skandaguruh parameshthi parayanah
    || 102|| kuberabandhuh shrikantho deveshah suryatapanah | alubdhah sarvashastrajnah shastrarthah paramahpuman
    || 103|| agnyasyah prithivipado dyumurdha dikshrutih parah | dvimurdha somantah karano brahmamukhah
    kshatrabhujastatha || 104|| vaishyoruh shudrapadastu nadisarvangasandhikah | jimutakesho'bdhikukshistu
    vaikuntho vishtarashravah || 105|| kshetrajnah tamasah pari bhriguvamshodbhavo'vanih | atmayoni rainukeyo
    mahadevo guruh surah || 106|| eko naiko'ksharah shrishah shripatirduhkhabheshajam | hrishikesho'tha
    bhagavan sarvatma vishvapavanah || 107|| vishvakarmapavargo'tha lambodarashariradhrik | akrodho'droha
    mohashca sarvato'nantadriktatha || 108|| kaivalyadipah kaivalyah sakshi cetah vibhavasuh | ekaviratmajo
    bhadro'bhadraha kaitabhardanah || 109|| vibudho'gravarah shreshthah sarvadevottamottamah | shivadhyanarato
    divyo nityayogi jitendriyah || 110|| karmasatyam vratancaiva bhaktanugrahakriddharih | sargasthityantakridramo
    vidyarashirguruttamah || 111|| renukapranalingam ca bhriguvamshyah shatakratuh | shrutimanekabandhushca
    shantabhadrah samanjasah || 112|| adhyatmavidyasarashca kalabhaksho visha
  devanagari: सर्वजिच्छत्रुदर्पहा कविर्ब्रह्मर्षि वरदः कमण्डलुधरः कृती ॥ १२॥ महोदारोऽतुलो भाव्यो जितषड्वर्गमण्डलः
    । कान्तः पुण्यः सुकीर्तिश्च द्विभुजश्चादि पूरुषः ॥ १३॥ अकल्मषो दुराराध्यः सर्वावासः कृतागमः । वीर्यवान्स्मितभाषी
    च निवृत्तात्मा पुनर्वसुः ॥ १४॥ अध्यात्मयोगकुशलः सर्वायुधविशारदः । यज्ञस्वरूपी यज्ञेशो यज्ञपालः सनातनः
    ॥ १५॥ घनश्यामः स्मृतिः शूरो जरामरणवर्जितः । धीरो दान्तः सुरूपश्च सर्वतीर्थमयो विधिः ॥ १६॥ धीरोदात्तः
    स्वरूपश्च वर्णी वर्णाश्रमगुरुः सर्वजित्पुरुषोऽव्ययः । शिवशिक्षापरो युक्तः परमात्मा परायणः ॥ १७॥ प्रमाण
    रूपो दुर्ज्ञेयः पूर्णः क्रूरः क्रतुर्विभुः । आनन्दोऽथ गुणश्रेष्ठोऽनन्तदृष्टिर्गुणाकरः ॥ १८॥ धनुर्धरो
    धनुर्वेदः सच्चिदानन्दविग्रहः । जनेश्वरो विनीतात्मा महाकायस्तपस्विराट् ॥ १९॥ अखिलाद्यो विश्वकर्मा विनीतात्मा
    विशारदः । अक्षरः केशवः साक्षी मरीचिः सर्वकामदः ॥ २०॥ कल्याणः प्रकृति कल्पः सर्वेशः पुरुषोत्तमः । लोकाध्यक्षो
    गभीरोऽथ सर्वभक्तवरप्रदः ॥ २१॥ ज्योतिरानन्दरूपश्च वह्नीरक्षय आश्रमी । भूर्भुवःस्वस्तपोमूर्ती रविः परशुधृक्
    स्वराट् ॥ २२॥ बहुश्रुतः सत्यवादी भ्राजिष्णुः सहनो बलः । सुखदः कारणं भोक्ता भवबन्ध विमोक्षकृत् ॥ २३॥
    संसारतारको नेता सर्वदुःखविमोक्षकृत् । देवचूडामणिः कुन्दः सुतपा ब्रह्मवर्धनः ॥ २४॥ नित्यो नियतकल्याणः
    शुद्धात्माथ पुरातनः । दुःस्वप्ननाशनो नीतिः किरीटी स्कन्ददर्पहृत् ॥ २५॥ अर्जुनः प्राणहा वीरः सहस्रभुजजिद्धरीः
    । क्षत्रियान्तकरः शूरः क्षितिभारकरान्तकृत् ॥ २६॥ परश्वधधरो धन्वी रेणुकावाक्यतत्परः । वीरहा विषमो वीरः
    पितृवाक्यपरायणः ॥ २७॥ मातृप्राणद ईशश्च धर्मतत्त्वविशारदः । पितृक्रोधहरः क्रोधः सप्तजिह्वसमप्रभः ॥
    २८॥ स्वभावभद्रः शत्रुघ्नः स्थाणुः शम्भुश्च केशवः । स्थविष्ठः स्थविरो बालः सूक्ष्मो लक्ष्यद्युतिर्महान्
    ॥ २९॥ ब्रह्मचारी विनीतात्मा रुद्राक्षवलयः सुधीः । अक्षकर्णः सहस्रांशुर्दीप्तः कैवल्यतत्परः ॥ ३०॥ आदित्यः
    कालरुद्रश्च कालचक्रप्रवर्तकः । कवची कुण्डली खड्गी चक्री भीमपराक्रमः ॥ ३१॥ मृत्युञ्जयो वीर सिंहो जगदात्मा
    जगद्गुरुः । अमृत्युर्जन्मरहितः कालज्ञानी महापटुः ॥ ३२॥ निष्कलङ्को गुणग्रामोऽनिर्विण्णः स्मररूपधृक्
    । अनिर्वेद्यः शतावर्तो दण्डो दमयिता दमः ॥ ३३॥ प्रधानस्तारको धीमांस्तपस्वी भूतसारथिः । अहः संवत्सरो
    योगी संवत्सरकरो द्विजः ॥ ३४॥ शाश्वतो लोकनाथश्च शाखी दण्डी बली जटी । कालयोगी महानन्दः तिग्ममन्युः सुवर्चसः
    ॥ ३५॥ अमर्षणो मर्षणात्मा प्रशान्तात्मा हुताशनः । सर्ववासाः सर्वचारी सर्वाधारो विरोचनः ॥ ३६॥ हैमो हेमकरो
    धर्मो दुर्वासा वासवो यमः । उग्रतेजा महातेजा जयो विजयः कालजित् ॥ ३७॥ सहस्रहस्तो विजयो दुर्धरो यज्ञभागभुक्
    । अग्निर्ज्वाली महाज्वालस्त्वतिधूमो हुतो हविः ॥ ३८॥ स्वस्तिदः स्वस्तिभागश्च महान्भर्गः परो युवा ।
    महान्भर्गपरोयुवा महत्पादो महाहस्तो बृहत्कायो महायशाः ॥ ३९॥ महाकटिर्महाग्रीवो महाबाहुर्महाकरः । महानासो
    महाकम्बुर्महामायः पयोनिधिः ॥ ४०॥ महावक्षा महौजाश्च महाकेशो महाजनः । महामूर्धा महामात्रो महाकर्णो महाहनुः
    ॥ ४१॥ वृक्षाकारो महाकेतुर्महादंष्ट्रो महामुखः । एकवीरो महावीरो वसुदः कालपूजितः ॥ ४२॥ महामेघनिनादी
    च महाघोषो महाद्युतिः । शैवः शैवागमाचारी हैहयानां कुलान्तकः ॥ ४३॥ सर्वगुह्यमयो वज्री बहुलः कर्मसाधनः
    । कामी कपिः कामपालः कामदेवः कृतागमः ॥ ४४॥ पञ्चविंशतितत्त्वज्ञः सर्वज्ञः सर्वगोचरः । लोकनेता महानादः
    कालयोगी महाबलः ॥ ४५॥ असङ्ख्येयोऽप्रमेयात्मा वीर्यकृद्वीर्यकोविदः । वेदवेद्यो वियद्गोप्ता सर्वामरमुनीश्वरः
    ॥ ४६॥ सुरेशः शरणं शर्म शब्दब्रह्म सतां गतिः । निर्लेपो निष्प्रपञ्चात्मा निर्व्यग्रो व्यग्रनाशनः ॥
    ४७॥ शुद्धः पूतः शिवारम्भः सहस्रभुजजिद्धरिः । निरवद्यपदोपायः सिद्धिदः सिद्धिसाधनः ॥ ४८॥ चतुर्भुजो महादेवो
    व्यूढोरस्को जनेश्वरः । द्युमणिस्तरणिर्धन्यः कार्तवीर्य बलापहा ॥ ४९॥ लक्ष्मणाग्रजवन्द्यश्च नरो नारायणः
    प्रियः । एकज्योतिर्निरातङ्को मत्स्यरूपी जनप्रियः ॥ ५०॥ सुप्रीतः सुमुखः सूक्ष्मः कूर्मो वाराहकस्तथा
    । व्यापको नारसिंहश्च बलिजिन्मधुसूदनः ॥ ५१॥ अपराजितः सर्वसहो भूषणो भूतवाहनः । निवृत्तः संवृत्तः शिल्पी
    क्षुद्रहा नित्य सुन्दरः ॥ ५२॥ स्तव्यः स्तवप्रियः स्तोता व्यासमूर्तिरनाकुलः । प्रशान्तबुद्धिरक्षुद्रः
    सर्वसत्त्वावलम्बनः ॥ ५३॥ परमार्थगुरुर्देवो माली संसारसारथिः । रसो रसज्ञः सारज्ञः कङ्कणीकृतवासुकिः
    ॥ ५४॥ कृष्णः कृष्णस्तुतो धीरो मायातीतो विमत्सरः । महेश्वरो महीभर्ता शाकल्यः शर्वरीपतिः ॥ ५५॥ तटस्थः
    कर्णदीक्षादः सुराध्यक्षः सुरारिहा । ध्येयोऽग्रधुर्यो धात्रीशो रुचिस्त्रिभुवनेश्वरः ॥ ५६॥ कर्माध्यक्षो
    निरालम्बः सर्वकाम्यः फलप्रदः । अव्यक्तलक्षणो व्यक्तो व्यक्ताव्यक्तो विशाम्पतिः ॥ ५७॥ त्रिलोकात्मा
    त्रिलोकेशो जगन्नाथो जनेश्वरः । ब्रह्मा हंसश्च रुद्रश्च स्रष्टा हर्ता चतुर्मुखः ॥ ५८॥ निर्मदो निरहङ्कारो
    भृगुवंशोद्वहः शुभः । वेधा विधाता द्रुहिणो देवज्ञो देवचिन्तनः ॥ ५९॥ कैलासशिखरावासी ब्राह्मणो ब्राह्मणप्रियः
    । अर्थोऽनर्थो महाकोशो ज्येष्ठः श्रेष्ठः शुभाकृतिः ॥ ६०॥ बाणारिर्दमनो यज्वा स्निग्धप्रकृतिरग्नियः ।
    वरशीलो वरगुणः सत्यकीर्तिः कृपाकरः ॥ ६१॥ सत्त्ववान् सात्त्विको धर्मी बुद्धः कल्की सदाश्रयः । दर्पणो
    दर्पहा दर्पातीतो दृप्तः प्रवर्तकः ॥ ६२॥ अमृतांशोऽमृतवपुर्वाङ्मयः सदसन्मयः । निधानगर्भो भूशायी कपिलो
    विश्वभोजनः ॥ ६३॥ प्रभविष्णुर्ग्रसिष्णुश्च चतुर्वर्गफलप्रदः । नारसिंहो महाभीमः शरभः कलिपावनः ॥ ६४॥
    उग्रः पशुपतिर्भर्गो वैद्यः केशिनिषूदनः । गोविन्दो गोपतिर्गोप्ता गोपालो गोपवल्लभः ॥ ६५॥ भूतावासो गुहावासः
    सत्यवासः श्रुतागमः । निष्कण्टकः सहस्रार्चिः स्निग्धः प्रकृतिदक्षिणः ॥ ६६॥ लक्षणः अकम्पितो गुणग्राही
    सुप्रीतः प्रीतिवर्धनः । पद्मगर्भो महागर्भो वज्रगर्भो जलोद्भवः ॥ ६७॥ गभस्तिर्ब्रह्मकृद्ब्रह्म राजराजः
    स्वयम्भवः । स्वयम्भुवः सेनानीरग्रणी साधुर्बलस्तालीकरो महान् ॥ ६८॥ पृथिवी वायुरापश्च तेजः खं बहुलोचनः
    । सहस्रमूर्धा देवेन्द्रः सर्वगुह्यमयो गुरुः ॥ ६९॥ अविनाशी सुखारामस्त्रिलोकी प्राणधारकः । निद्रारूपं
    क्षमा तन्द्रा धृतिर्मेधा स्वधा हविः ॥ ७०॥ होता नेता शिवस्त्राता सप्तजिह्वो विशुद्धपात् । स्वाहा हव्यश्च
    कव्यश्च शतघ्नी शतपाशधृक् ॥ ७१॥ आरोहश्च निरोहश्च तीर्थः तीर्थकरो हरः । चराचरात्मा सूक्ष्मस्तु विवस्वान्
    सवितामृतम् ॥ ७२॥ तुष्टिः पुष्टिः कला काष्ठा मासः पक्षस्तु वासरः । ऋतुर्युगादिकालस्तु लिङ्गमात्माथ
    शाश्वतः ॥ ७३॥ चिरञ्जीवी प्रसन्नात्मा नकुलः प्राणधारणः । स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम्
    ॥ ७४॥ मुक्तिर्लक्ष्मीस्तथा भुक्तिर्विरजा विरजाम्बरः । विश्वक्षेत्रं सदाबीजं पुण्यश्रवणकीर्तनः ॥ ७५॥
    भिक्षुर्भैक्ष्यं गृहं दारा यजमानश्च याचकः । पक्षी च पक्षवाहश्च मनोवेगो निशाचरः ॥ ७६॥ गजहा दैत्यहा
    नाकः पुरुहूतः पुरुष्टुतः । पुरुभूतः बान्धवो बन्धुवर्गश्च पिता माता सखा सुतः ॥ ७७॥ गायत्रीवल्लभः प्रांशुर्मान्धाता
    भूतभावनः । सिद्धार्थकारी सर्वार्थश्छन्दो व्याकरण श्रुतिः ॥ ७८॥ स्मृतिर्गाथोपशान्तश्च पुराणः प्राणचञ्चुरः
    । शान्तिश्च वामनश्च जगत्कालः सुकृतश्च युगाधिपः ॥ ७९॥ उद्गीथः प्रणवो भानुः स्कन्दो वैश्रवणस्तथा । अन्तरात्मा
    हृषीकेशः पद्मनाभः स्तुतिप्रियः ॥ ८०॥स्कन्दो वैश्रवणस्तथा परश्वधायुधः शाखी सिंहगः सिंहवाहनः । सिंहनादः
    सिंहदंष्ट्रो नगो मन्दरधृक्सरः ॥ ८१॥ शरः सह्याचलनिवासी च महेन्द्रकृतसंश्रयः । मनोबुद्धिरहङ्कारः कमलानन्दवर्धनः
    ॥ ८२॥ सनातनतमः स्रग्वी गदी शङ्खी रथाङ्गभृत् । निरीहो निर्विकल्पश्च समर्थोऽनर्थनाशनः ॥ ८३॥ अकायो भक्तकायश्च
    माधवोऽथ सुरार्चितः । योद्धा जेता महावीर्यः शङ्करः सन्ततः स्तुतः ॥ ८४॥ विश्वेश्वरो विश्वमूर्तिर्विश्वारामोऽथ
    विश्वकृत् । आजानुबाहुः सुलभः परं ज्योतिः सनातनः ॥ ८५॥ वैकुण्ठः पुण्डरीकाक्षः सर्वभूताशयस्थितः । सहस्रशीर्षा
    पुरुषः सहस्राक्षः सहस्रपात् ॥ ८६॥ ऊर्ध्वरेताः ऊर्ध्वलिङ्गः प्रवरो वरदो वरः । उन्मत्तवेशः प्रच्छन्नः
    सप्तद्वीपमहीप्रदः ॥ ८७॥ द्विजधर्मप्रतिष्ठाता वेदात्मा वेदकृच्छ्रयः । नित्यः सम्पूर्णकामश्च सर्वज्ञः
    कुशलागमः ॥ ८८॥ कृपापीयूषजलधिर्धाता कर्ता परात्परः । अचलो निर्मलस्तृप्तः स्वे महिम्नि प्रतिष्ठितः ॥
    ८९॥ असहायः सहायश्च जगद्धेतुरकारणः । मोक्षदः कीर्तिदश्चैव प्रेरकः कीर्तिनायकः ॥ ९०॥ अधर्मशत्रुरक्षोभ्यो
    वामदेवो महाबलः । विश्ववीर्यो महावीर्यो श्रीनिवासः सतां गतिः ॥ ९१॥ स्वर्णवर्णो वराङ्गश्च सद्योगी च
    द्विजोत्तमः । नक्षत्रमाली सुरभिर्विमलो विश्वपावनः ॥ ९२॥ वसन्तो माधवो ग्रीष्मो नभस्यो बीजवाहनः । निदाघस्तपनो
    मेघो नभो योनिः पराशरः ॥ ९३॥ सुखानिलः सुनिष्पन्नः शिशिरो नरवाहनः । श्रीगर्भः कारणं जप्यो दुर्गः सत्यपराक्रमः
    ॥ ९४॥ आत्मभूरनिरुद्धश्च दत्तात्रेयस्त्रिविक्रमः । जमदग्निर्बलनिधिः पुलस्त्यः पुलहोऽङ्गिराः ॥ ९५॥ वर्णी
    वर्णगुरुश्चण्डः कल्पवृक्षः कलाधरः । महेन्द्रो दुर्भरः सिद्धो योगाचार्यो बृहस्पतिः ॥ ९६॥ निराकारो विशुद्धश्च
    व्याधिहर्ता निरामयः । अमोघोऽनिष्टमथनो मुकुन्दो विगतज्वरः ॥ ९७॥ स्वयंज्योतिर्गुरुतमः सुप्रसादोऽचलस्तथा
    । चन्द्रः सूर्यः शनिः केतुर्भूमिजः सोमनन्दनः ॥ ९८॥ भृगुर्महातपा दीर्घतपाः सिद्धो महागुरुः । मन्त्री
    मन्त्रयिता मन्त्रो वाग्मी वसुमनाः स्थिरः ॥ ९९॥ अद्रिरद्रिशयो शम्भुर्माङ्गल्यो मङ्गलोवृतः । जयस्तम्भो
    जगत्स्तम्भो बहुरूपो गुणोत्तमः ॥ १००॥ सर्वदेवमयोऽचिन्त्यो देवतात्मा विरूपधृक् । चतुर्वेदश्चतुर्भावश्चतुरश्चतुरप्रियः
    ॥ १०१॥ आद्यन्तशून्यो वैकुण्ठः कर्मसाक्षी फलप्रदः । दृढायुधः स्कन्दगुरुः परमेष्ठी परायणः ॥ १०२॥ कुबेरबन्धुः
    श्रीकण्ठो देवेशः सूर्यतापनः । अलुब्धः सर्वशास्त्रज्ञः शास्त्रार्थः परमःपुमान् ॥ १०३॥ अग्न्यास्यः पृथिवीपादो
    द्युमूर्धा दिक्ष्रुतिः परः । द्विमूर्धा सोमान्तः करणो ब्रह्ममुखः क्षत्रभुजस्तथा ॥ १०४॥ वैश्योरुः शूद्रपादस्तु
    नदीसर्वाङ्गसन्धिकः । जीमूतकेशोऽब्धिकुक्षिस्तु वैकुण्ठो विष्टरश्रवाः ॥ १०५॥ क्षेत्रज्ञः तमसः पारी भृगुवंशोद्भवोऽवनिः
    । आत्मयोनी रैणुकेयो महादेवो गुरुः सुरः ॥ १०६॥ एको नैकोऽक्षरः श्रीशः श्रीपतिर्दुःखभेषजम् । हृषीकेशोऽथ
    भगवान् सर्वात्मा विश्वपावनः ॥ १०७॥ विश्वकर्मापवर्गोऽथ लम्बोदरशरीरधृक् । अक्रोधोऽद्रोह मोहश्च सर्वतोऽनन्तदृक्तथा
    ॥ १०८॥ कैवल्यदीपः कैवल्यः साक्षी चेताः विभावसुः । एकवीरात्मजो भद्रोऽभद्रहा कैटभार्दनः ॥ १०९॥ विबुधोऽग्रवरः
    श्रेष्ठः सर्वदेवोत्तमोत्तमः । शिवध्यानरतो दिव्यो नित्ययोगी जितेन्द्रियः ॥ ११०॥ कर्मसत्यं व्रतञ्चैव
    भक्तानुग्रहकृद्धरिः । सर्गस्थित्यन्तकृद्रामो विद्याराशिर्गुरूत्तमः ॥ १११॥ रेणुकाप्राणलिङ्गं च भृगुवंश्यः
    शतक्रतुः । श्रुतिमानेकबन्धुश्च शान्तभद्रः समञ्जसः ॥ ११२॥ आध्यात्मविद्यासारश्च कालभक्षो विश
