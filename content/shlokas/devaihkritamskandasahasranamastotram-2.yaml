id: devaihkritamskandasahasranamastotram-2
category: sahasranama
name:
  english: devaihkritamskandasahasranamastotram
  devanagari: देवैःकृतंस्कन्दसहस्रनामस्तोत्रम्
content:
  english: tma rasikatma ca rasakridaparo ratih | kotisuryaprakashabhah somasuryagnilocanah || 48|| kalabhijnah
    kalarupah kalavan sakalaprabhuh | bindunadakalamurtih kalatitah ksharaksharah || 49|| matrasvarakritishcaika
    ekamatro dvimatrakah | trimatrakashcaturmatro matratito'timatrakah || 50|| vyanjanatma viyuktatma
    yuktomuktiprado guruh | visarjaniyo'nusvarah sarvavarnatanurmahan || 51|| akaratma ukaratma makaratma
    trivarnakah | onkarashca vashatkarah svahakarah svadhakritih || 52|| akritirbhavano havyam hota'dhvaryurmahahavih
    | brahmodgata sadasyashca barhiridhmah samiccaruh || 53|| gavyah pashuh purodashashcamiksha vajivahanah
    | pavanah pavanah putah pavamanah parakritih || 54|| pavitrah paridhih purnapatrah purnamanorathah
    | vishodhanah pashupatih pashupashavimokah || 55|| pakayajno mahayajno yajno yajnapatiryajuh | yajnango
    yajna ijyashca yajva yajnaphalapradah || 56|| yajnangabhuryajnabhumiryajnashriryajnavahanah | yajniko
    yajnavidhvamsi yajnesho yajnarakshakah || 57|| sahasrabahurvishvatma sahasrakshah sahasrapat | sahasravadano
    nityah sahasratma virat svarat || 58|| sahasrashirsha vishvashca tejah prajno hyathatmavan | anurbrihatkrishah
    sthulo dirgho hrasvo laghurguruh || 59|| sukshmah sukshmataro'nanto vishvarupo niranjanah | amritesho'mritaharo'mritadata'mritangavan
    || 60|| ahorupastriyama ca sandhyarupo dinatmakah | muhurto ghatikarupo yamarupo yamatmakah || 61||
    purvahnarupo madhyahnarupah sayahnarupakah | aparahno'tinipunah savanatma prajakarah || 62|| vedyo
    vedayita vaidyo vedadrashta vidamvarah | vinayah satyasandhashca vidvan vidvajjanapriyah || 63|| vishvagopta
    vishvabhokta vishvakridvishvabheshajam | vishvambharo vishvapatirvishvesho vishvatomukhah || 64||
    vishvasakshi vishvahanta viro vishvambharadhipah | virabahurvirahanta viragryo virasainikah || 65||
    viravadapriyah shurah shurasenah suradhipah | shurapadmasuradveshi tarakasurabhanjanah || 66|| taradhipastaraharah
    shurahanta surarcitah | sharavan sharasambhutah shaktah sharavanodbhavah || 67|| shambhavah shankarah
    shambhuh sadhuh sadhujanapriyah | sarangah sagarah sarvah sharvah sharvapriyah svarat || 68|| gangadharo'tigambhiro
    gabhirahridayo'naghah | amoghaghosho vikramyah shambhuh shakraprapujitah || 69|| cakrapanishcakrapatirdikcakrantamahipatih
    | sarvabhaumah surapatih sarvalokabhirakshakah || 70|| cidrupah satyasankalpah satyah satyavatamvarah
    | satyapriyah satyapatih satyalokajanapriyah || 71|| bhuto bhavya bhutanatha bhavabhavavivarjitah
    | bhutadirbhutamadhyastho bhutaviplavakarakah || 72|| bhutibhushitasarvango bhutadhishthanako'vyayah
    | bijarupo gunanidhistejorashirakalmashah || 73|| kalmashaghnah kalyahinah karunyamritavaridhih |
    kalyanamurtih kalyanacalakarmukasambhavah || 74|| kamatma kamadah kantah kamakrodhavivarjitah | gopta
    gopayita guptirgunatito gunashrayah || 75|| satvamurti rajomurtistamomurtishcidatmakah | devasenapatirdivyamahima
    mahimakarah || 76|| prakashakritapapaghnah pavanah pavano'nalah | kailasanilayah kantah kanakacalasannibhah
    || 77|| vidrumo vedamurtishca vyakritih kritirakshakah | indropendradivandyanghrirurujangha urukramah
    || 78|| vikranto vijayakranto vijayi vinayapriyah | avinitajanadhvamsi sarvapagunavarjitah || 79||
    sheshacalaikanilayo vallivanchitavibhramah | shambhavah shambhutanayah shankarangavibhushanah || 80||
    svayambhuh svavashah svasthah pushkarah purabhidbhavah | manurmanavagopta ca sthavishthah sthaviro
    yuva || 81|| balah shishurnityayuva nityakaumaravan mahan | agrahyarupo grahyashca sugrahyah sundarakritih
    || 82|| pramardanah prabhutashrirlohitaksho'rimardanah | tridhama trikakubbhavyastrilokanilayo layah
    || 83|| sharmadah sharmavan sharmi sharanyah sharanalayah | sthanuh sthiratarah stheyan
  devanagari: त्मा रसिकात्मा च रासक्रीडापरो रतिः । कोटिसूर्यप्रकाशाभः सोमसूर्याग्निलोचनः ॥ ४८॥ कालाभिज्ञः
    कलारूपः कलावान् सकलप्रभुः । बिन्दुनादकलामूर्तिः कालातीतः क्षराक्षरः ॥ ४९॥ मात्रास्वराकृतिश्चैक एकमात्रो
    द्विमात्रकः । त्रिमात्रकश्चतुर्मात्रो मात्रतीतोऽतिमात्रकः ॥ ५०॥ व्यञ्जनात्मा वियुक्तात्मा युक्तोमुक्तिप्रदो
    गुरुः । विसर्जनीयोऽनुस्वारः सर्ववर्णतनुर्महान् ॥ ५१॥ अकारात्मा उकारात्मा मकारात्मा त्रिवर्णकः । ओङ्कारश्च
    वषट्कारः स्वाहाकारः स्वधाकृतिः ॥ ५२॥ अकृतिर्भवनो हव्यं होताऽध्वर्युर्महाहविः । ब्रह्मोद्गाता सदस्यश्च
    बर्हिरिध्मः समिच्चरुः ॥ ५३॥ गव्यः पशुः पुरोडाशश्चामिक्षा वाजिवाहनः । पवनः पावनः पूतः पवमानः पराकृतिः
    ॥ ५४॥ पवित्रः परिधिः पूर्णपात्रः पूर्णमनोरथः । विशोधनः पशुपतिः पशुपाशविमोकः ॥ ५५॥ पाकयज्ञो महायज्ञो
    यज्ञो यज्ञपतिर्यजुः । यज्ञाङ्गो यज्ञ इज्यश्च यज्वा यज्ञफलप्रदः ॥ ५६॥ यज्ञाङ्गभूर्यज्ञभूमिर्यज्ञश्रीर्यज्ञवाहनः
    । याज्ञिको यज्ञविध्वंसी यज्ञेशो यज्ञरक्षकः ॥ ५७॥ सहस्रबाहुर्विश्वात्मा सहस्राक्षः सहस्रपात् । सहस्रवदनो
    नित्यः सहस्रात्मा विराट् स्वराट् ॥ ५८॥ सहस्रशीर्षा विश्वश्च तेजः प्राज्ञो ह्यथात्मवान् । अणुर्बृहत्कृशः
    स्थूलो दीर्घो ह्रस्वो लघुर्गुरुः ॥ ५९॥ सूक्ष्मः सूक्ष्मतरोऽनन्तो विश्वरूपो निरञ्जनः । अमृतेशोऽमृताहारोऽमृतदाताऽमृताङ्गवान्
    ॥ ६०॥ अहोरूपस्त्रियामा च सन्ध्यारूपो दिनात्मकः । मुहूर्तो घटिकारूपो यमरूपो यमात्मकः ॥ ६१॥ पूर्वाह्णरूपो
    मध्याह्नरूपः सायाह्नरूपकः । अपराह्णोऽतिनिपुणः सवनात्मा प्रजाकरः ॥ ६२॥ वेद्यो वेदयिता वैद्यो वेदद्रष्टा
    विदांवरः । विनयः सत्यसन्धश्च विद्वान् विद्वज्जनप्रियः ॥ ६३॥ विश्वगोप्ता विश्वभोक्ता विश्वकृद्विश्वभेषजम्
    । विश्वम्भरो विश्वपतिर्विश्वेशो विश्वतोमुखः ॥ ६४॥ विश्वसाक्षी विश्वहन्ता वीरो विश्वम्भराधिपः । वीरबाहुर्वीरहन्ता
    वीराग्र्यो वीरसैनिकः ॥ ६५॥ वीरवादप्रियः शूरः शूरसेनः सुराधिपः । शूरपद्मासुरद्वेषी तारकासुरभञ्जनः ॥
    ६६॥ ताराधिपस्तारहारः शूरहन्ता सुरार्चितः । शरवान् शरसम्भूतः शक्तः शरवणोद्भवः ॥ ६७॥ शाम्भवः शङ्करः
    शम्भुः साधुः साधुजनप्रियः । सारङ्गः सागरः सर्वः शर्वः शर्वप्रियः स्वराट् ॥ ६८॥ गङ्गाधरोऽतिगम्भीरो
    गभीरहृदयोऽनघः । अमोघघोषो विक्रम्यः शम्भुः शक्रप्रपूजितः ॥ ६९॥ चक्रपाणिश्चक्रपतिर्दिक्चक्रान्तमहीपतिः
    । सार्वभौमः सुरपतिः सर्वलोकाभिरक्षकः ॥ ७०॥ चिद्रूपः सत्यसङ्कल्पः सत्यः सत्यवतांवरः । सत्यप्रियः सत्यपतिः
    सत्यलोकजनप्रियः ॥ ७१॥ भूतो भव्य भूतनाथ भावाभावविवर्जितः । भूतादिर्भूतमध्यस्थो भूतविप्लवकारकः ॥ ७२॥
    भूतिभूषितसर्वाङ्गो भूताधिष्ठानकोऽव्ययः । बीजरूपो गुणानिधिस्तेजोराशिरकल्मषः ॥ ७३॥ कल्मषघ्नः कल्यहीनः
    कारुण्यामृतवारिधिः । कल्याणमूर्तिः कल्याणाचलकार्मुकसम्भवः ॥ ७४॥ कामात्मा कामदः कान्तः कामक्रोधविवर्जितः
    । गोप्ता गोपायिता गुप्तिर्गुणातीतो गुणाश्रयः ॥ ७५॥ सत्वमूर्ती रजोमूर्तिस्तमोमूर्तिश्चिदात्मकः । देवसेनापतिर्दिव्यमहिमा
    महिमाकरः ॥ ७६॥ प्रकाशकृतपापघ्नः पवनः पावनोऽनलः । कैलासनिलयः कान्तः कनकाचलसन्निभः ॥ ७७॥ विद्रुमो वेदमूर्तिश्च
    व्याकृतिः कृतिरक्षकः । इन्द्रोपेन्द्रादिवन्द्याङ्घ्रिरुरुजङ्घ उरुक्रमः ॥ ७८॥ विक्रान्तो विजयाक्रान्तो
    विजयी विनयप्रियः । अविनीतजनध्वंसी सर्वापगुणवर्जितः ॥ ७९॥ शेषाचलैकनिलयो वल्लीवाञ्छितविभ्रमः । शाम्भवः
    शम्भुतनयः शङ्कराङ्गविभूषणः ॥ ८०॥ स्वयम्भूः स्ववशः स्वस्थः पुष्करः पुरभिद्भवः । मनुर्मानवगोप्ता च स्थविष्ठः
    स्थविरो युवा ॥ ८१॥ बालः शिशुर्नित्ययुवा नित्यकौमारवान् महान् । अग्राह्यरूपो ग्राह्यश्च सुग्राह्यः
    सुन्दराकृतिः ॥ ८२॥ प्रमर्दनः प्रभूतश्रीर्लोहिताक्षोऽरिमर्दनः । त्रिधामा त्रिककुब्भव्यस्त्रिलोकनिलयो
    लयः ॥ ८३॥ शर्मदः शर्मवान् शर्मी शरण्यः शरणालयः । स्थाणुः स्थिरतरः स्थेयान्
