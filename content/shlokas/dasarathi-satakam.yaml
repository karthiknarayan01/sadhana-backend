    पीडलॆग जिम्मुटकुन् हनुमन्तुडार्तिसो दरुडु सुमित्रसूति दुरितम्बुलुमानुप राम नाममुं गरुणदलिर्प मानवुलगावग
    बन्निन वज्रपञ्जरो त्करमुगदा भवन्महिम दाशरथी करुणापयोनिधी ॥ हलिकुलिशाङ्कुशध्वज शरासन शङ्खरथाङ्ग कल्पको
