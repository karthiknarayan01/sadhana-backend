id: kundalinistava
category: stotram
name:
  english: kundalinistava
  devanagari: कुण्डलिनीस्तव
content:
  english: kundalinistavah rudrayamalottaratantrantargatam kundalinistutistotrah janmoddharanirikshanihataruni
    vedadibijadima nityam cetasi bhavyate bhuvi kada sadvakyasancarini | mam patu priyadasabhavakapadam
    samnghataye shridhara dhatri tvam svayamadidevavanita dinatidinam pashum || 6
  devanagari: कुण्डलिनीस्तवः रुद्रयामलोत्तरतन्त्रान्तर्गतम् कुण्डलिनीस्तुतिस्तोत्रः जन्मोद्धारनिरीक्षणीहतरुणी
    वेदादिबीजादिमा नित्यं चेतसि भाव्यते भुवि कदा सद्वाक्यसञ्चारिणी । मां पातु प्रियदासभावकपदं संन्घातये
    श्रीधरा धात्रि त्वं स्वयमादिदेववनिता दीनातिदीनं पशुम् ॥ ६
meaning: {}
