id: devakikritamshrikrishnabalaramastotram
category: stotram
name:
  english: devakikritamshrikrishnabalaramastotram
  devanagari: देवकिकृतंश्रीकृष्णबलरामस्तोत्रम्
content:
  english: devakikritam shrikrishnabalaramastotram devakyuvaca | rama ramaprameyatman krishna yogeshvareshvara
    | vedaham vam vishvasrijamishvaravadipurushau || 29|| kalavidhvastasattvanam rajnamucchastravartinam
    | bhumerbharayamananamavatirnau kiladya me || 30|| yasyamshamshamshabhagena vishvotpattilayodayah
    | bhavanti kila vishvatmamstam tvadyaham gatim gata || 31|| ciranmritasutadane guruna kila coditau
    | aninyathuh pitristhanadgurave gurudakshinam || 32|| tatha me kurutam kamam yuvam yogeshvareshvarau
    | bhojarajahatan putran kamaye drashtumahritan || 33|| iti shrimadbhagavatamahapurane dashamaskandhe
    uttarardhe pancashititamadhyayantargatam devakikritam balaramakrishnayoh stotram samaptam | bhagavatapurana
    | adhyaya 10
  devanagari: देवकिकृतं श्रीकृष्णबलरामस्तोत्रम् देवक्युवाच । राम रामाप्रमेयात्मन् कृष्ण योगेश्वरेश्वर
    । वेदाहं वां विश्वसृजामीश्वरावादिपूरुषौ ॥ २९॥ कालविध्वस्तसत्त्वानां राज्ञामुच्छास्त्रवर्तिनाम् । भूमेर्भारायमाणानामवतीर्णौ
    किलाद्य मे ॥ ३०॥ यस्यांशांशांशभागेन विश्वोत्पत्तिलयोदयाः । भवन्ति किल विश्वात्मंस्तं त्वाद्याहं गतिं
    गता ॥ ३१॥ चिरान्मृतसुतादाने गुरुणा किल चोदितौ । आनिन्यथुः पितृस्थानाद्गुरवे गुरुदक्षिणाम् ॥ ३२॥ तथा
    मे कुरुतं कामं युवां योगेश्वरेश्वरौ । भोजराजहतान् पुत्रान् कामये द्रष्टुमाहृतान् ॥ ३३॥ इति श्रीमद्भागवतमहापुराणे
    दशमस्कन्धे उत्तरार्धे पञ्चाशीतितमाध्यायान्तर्गतं देवकीकृतं बलरामकृष्णयोः स्तोत्रं समाप्तम् । भागवतपुराण
    । अध्याय १०
