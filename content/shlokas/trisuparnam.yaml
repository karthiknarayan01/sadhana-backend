id: trisuparnam
category: stotram
name:
  english: Trisuparnam
content:
  english: mbrahmametu mam | madhumetu mam | brahmameva madhumetu mam | yaste soma praja vathso 'bhi so
    aham | dushshvapnahandurushvaha | yaste soma pranagmstanjuhomi | trisuparnamayacita mbrahmanaya dadyat
    | brahmahatyam va~ ete ghnanti | ye bra hmanastrisuparna mprapnuvanti | asahasratpankti | brahmameva
    madhu medhaya | adya no deva savitah prajavatsavissaubhagam | para dushvapniyagm suva | vishvani deva
    savitarduritani parasuva | yadbhadra ntanma asuva | madhu vata ritayate madhu ksharanti sindhavah
    | madhvi rnassantvoshadhih | madhu naktamutoshasi madhumatparthivagm rajah | madhu dyaurastu nah pita
    | madhu manno vanaspatirmadhumagm astu suryah | madhvirgavo bhavantu nah | ya ima ntrisuparnamayacita
    mbrahmanaya dadyat | bhrunahatyam va~ ete ghnanti | ye bra hmanastrisuparna mprapnuvanti | asahasratpankti
    | brahmameva madhu medhava mpadavih kavinamrishirviprana m | shyeno griddhranagm svadhitirvananagm
    somah pavitramatyeti rebhann | hagmsashshucishadvasurantarikshasaddhota vedishadatithirduronasat |
    nrishadvarasadritasadvyomasadabja goja ritaja adrija rita mbrihat | rice tva ruce tva samitsravanti
    sarito na dhenah hrida manasa puyamanah | ghritasya dhara abhicakashimi | hiranyayo vetaso maddhya
    asam | tasmi tkulayi bhajannaste madhu devata bhyah | tasyasate harayassapta tire nduhana amritasya
    dhara ntrisuparnamayacita mbrahmanaya dadyat | virahatyam va~ ete ghnanti | ye bra hmanastrisuparna
    mprapnuvanti | asahasratpankti
  devanagari: म्ब्रह्म॑मेतु॒ माम् । मधु॑मेतु॒ माम् । ब्रह्म॑मे॒व मधु॑मेतु॒ माम् । यास्ते॑ सोम प्र॒जा व॒थ्सो
    ऽभि॒ सो अ॒हम् । दुष्ष्व॑प्न॒हन्दु॑रुष्व॒ह । यास्ते॑ सोम प्रा॒णाग्ंस्ताञ्जु॑होमि । त्रिसु॑पर्ण॒मया॑चित
    म्ब्राह्म॒णाय॑ दद्यात् । ब्र॒ह्म॒ह॒त्यां वाँ ए॒ते घ्न॑न्ति । ये ब्रा ह्म॒णास्त्रिसु॑पर्ण॒ म्प्राप्नु॑वन्ति
    । आ॒स॒ह॒स्रात्प॒ङ्क्ति । ब्रह्म॑मे॒व मधु॑ मे॒धया । अ॒द्या नो॑ देव सवितः प्र॒जाव॑त्सावी॒स्सौभ॑गम् ।
    परा॑ दु॒ष्वप्नि॑यग्ं सुव । विश्वा॑नि देव सवितर्दुरि॒तानि॒ परा॑सुव । यद्भ॒द्र न्तन्म॒ आसु॑व । मधु॒
    वाता॑ ऋताय॒ते मधु॑ क्षरन्ति॒ सिन्ध॑वः । माध्वी र्नस्स॒न्त्वोष॑धीः । मधु॒ नक्त॑मु॒तोषसि॒ मधु॑म॒त्पार्थि॑व॒ग्ं॒
    रजः॑ । मधु॒ द्यौर॑स्तु नः पि॒ता । मधु॑ मान्नो॒ वन॒स्पति॒र्मधु॑माग्ं अस्तु॒ सूर्यः॑ । माध्वी॒र्गावो॑
    भवन्तु नः । य इ॒म न्त्रिसु॑पर्ण॒मया॑चित म्ब्राह्म॒णाय॑ दद्यात् । भ्रू॒ण॒ह॒त्यां वाँ ए॒ते घ्न॑न्ति
    । ये ब्रा ह्म॒णास्त्रिसु॑पर्ण॒ म्प्राप्नु॑वन्ति । आ॒स॒ह॒स्रात्प॒ङ्क्ति । ब्रह्म॑मे॒व मधु॑ मे॒धवा म्पद॒वीः
    क॑वी॒नामृषि॒र्विप्रा॑णा म् । श्ये॒नो गृद्ध्रा॑णा॒ग्ं॒ स्वधि॑ति॒र्वना॑ना॒ग्ं॒ सोमः॑ प॒वित्र॒मत्ये॑ति॒
    रेभन्न्॑ । ह॒ग्ं॒सश्शु॑चि॒षद्वसु॑रन्तरिक्ष॒सद्धोता॑ वेदि॒षदति॑थिर्दुरोण॒सत् । नृ॒षद्व॑र॒सदृ॑त॒सद्व्यो॑म॒सद॒ब्जा
    गो॒जा ऋ॑त॒जा अ॑द्रि॒जा ऋ॒त म्बृ॒हत् । ऋ॒चे त्वा॑ रु॒चे त्वा॒ समित्स्र॑वन्ति स॒रितो॒ न धेनाः हृ॒दा
    मन॑सा पू॒यमा॑नाः । घृ॒तस्य॒ धारा॑ अ॒भिचा॑कशीमि । हि॒र॒ण्ययो॑ वेत॒सो मद्ध्य॑ आसाम् । तस्मि त्कु॑ला॒यी
    भज॑न्नास्ते॒ मधु॑ दे॒वता भ्यः । तस्या॑सते॒ हर॑यस्स॒प्त तीरे न्दुहा॑ना अ॒मृत॑स्य॒ धारा न्त्रिसु॑पर्ण॒मया॑चित
    म्ब्राह्म॒णाय॑ दद्यात् । वी॒र॒ह॒त्यां वाँ ए॒ते घ्नन्ति । ये ब्रा ह्म॒णास्त्रिसु॑पर्ण॒ म्प्राप्नु॑वन्ति
    । आ॒स॒ह॒स्रात्प॒ङ्क्ति
