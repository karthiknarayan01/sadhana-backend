id: kalabhairavasahasra-2
category: sahasranama
name:
  english: kalabhairavasahasra
  devanagari: कालभैरवसहस्र
content:
  english: ringo'mritomantro mangalyo mangalapriyah || 117|| amoghadando madhyasthomahendro'moghavikramah
    | ameyo'rishtamathano mukundastvamayacalah || 118|| matamaho matarishva manipuro mahashayah | mahashrayo
    mahagarbho mahakalpo mahadhanuh || 119|| mano manojavo mani merumedyo mridomanuh | mahakosho mahajnani
    mahakalah kalipriyah || 120|| mahabaturmahatyagi mahakoshomahagatih | shikhandi kavaci shuli jati
    mundi ca kundali || 121|| mekhali kancuki khadgi mali mayi mahamanih | maheshvaso mahibharta mahaviro
    mahibhujah || 122|| makhakarta makhadhvamsi madhuro madhurapriyah | brahmasrishtirbrahmaviryo banahasto
    mahabali || 123|| kalarupo balonmadi brahmanyo brahmavarcasi | bahurupo bahumayo brahmavishnushivatmakah
    || 124|| brahmagarbho brihadgarbho brihajjyotirbrihattarah | bijadhyaksho bijakarta bijango bijavahanah
    || 125|| brahmabrahmavido brahmabrahmajyotirbrihaspatih | bijabuddhi brahmacari brahmanyo brahmanapriyah
    || 126|| yugadikridyugavarto yugadhyaksho yugapaha | yajno yajnapatiryajva yajnango yajnavahanah ||
    127|| yogacaryo yogagamyo yogi yogashcayogavit | yogango yogasarango yakshoyuktiryamoyami || 128||
    raudro rudra rishi rahu rucirtvam ranapriyah | arogo rogahari ca rudhiro rucirangadi || 129|| lohitaksho
    lalataksho lokado lokakarakah | lokabandhurlokanatho lakshana jnothalakshanah || 130|| lokamayo lokakarta
    laulyo lalita eva ca | variyan varado vandyo vidvan vishvamareshvarah || 131|| vedantasarasandeho
    vitarago visharadah | vishvamurtirvishvavedyo vamadevo vimocakah || 132|| vishvarupo vishvapaksho
    vagisho vrishavahanah | vrishankotha vishalaksho vishvadiptirvilocanah || 133|| viloko vishvadrigvishvovijitatmalayah
    puman | vyaghracarmadharovangi vanmayaikavidhirvibhuh || 134|| varnashrama guruvarni varado vayuvahanah
    | vishvakarma vinitatma vedashastrartha tattvavit || 135|| vasurvasumana vyalo viramo vimadah kavih
    | vimocakashcavijayo vishishto vrishavahanah || 136|| vidyesho vibudho vadi vedango vedavinmutih |
    vishveshvaro virabhadro virasana vidhirvirata || 137|| vyavasayo vyavasthanah viracudamanirvarah |
    valakhilyo vishvadeho viramo vasudovasuh || 138|| virocano vararucirvedyo vacaspatirgatih | vidvattamovitabhayo
    vishrutirvimalodayah || 139|| vaivasvato vasishthashca vibhutirvigatajvarah | vishvaharta vishvagopta
    vishvamitro dvijeshvarah || 140|| vishvotpattirvishvasaho vishvavaso vasushravah | vishvarupo vajrahasto
    vipako vishvakarakah || 141|| vrishadarshvo vyasakalpo vishalpo lokashalyahrit | virupo vikrito vegi
    virincirvishtarashravah || 142|| avyaktalakshano vyakto vyaktavyakto vishampatih | vibuddho'grakaro
    vedo vishvagarbho vicakshanah || 143|| vishamaksho vilomaksho vrishabho vrishavarddhanah | vittaprado
    vasantashca vivasvan vikramottamah || 144|| vedyo vaidyo vishvarupo vivikto vishvabhajanam | vishayascho
    viviktascho vidyarashirviyatpriyah || 145|| shivah sarvah sadacarah shambhurishana ishvarah | shrutidharmanasamvadi
    sahasrakshah sahasrapat || 146|| sarvajnah sarvadevashca shankarah shuladharakah | susharirah skandaguruh
    shrikanthah suryatapanah || 147|| ishano nilayah svasti samavedastvatharvavit | nitih sunitih shraddhatma
    somah somatarah sukhi || 148|| somapamritapah saumyah sutrakarah sanatanah | shakho vishakho sambhavyah
    sarvadah sarvagocarah || 149|| sadashivah samavrittih sukirtih schinnasamshayah | sarvavasah sadavasah
    sarvayudhavisharadah || 150|| sulabhah suvratah shurah shubhangah shubhavigrahah | suvarnangah svatmashatruh
    shatrujichatrutapanah || 151|| shanih suryah sarvakarma sarvalokaprajapatih | siddhah sarveshvarah
    svasti svastikritsvasti bhusvadha || 152|| vasurvasumanasatyah sarvapapaharoharah | sarvadih siddhidah
    siddhih satvavasahshcatushpathah || 153|| samvatsarakarah shriman shantah samvatsarah shishuh | spashtaksharah
    sarvahari sangramah samaradhikah || 154|| ishtovishishtah shishteshtah shubhadah sulabhayanah | subrahmanyah
    suragano susharanyah sudhapatih || 155|| sharanyah shashvatah skandah shipivishtah shivashrayah |
    samsaracakrabhritsarah shankarah sarvasadhakah || 156|| shastram shastram shantaragah savitasakalagamah
    | suvirah satpathacarah shadvimshah saptalokadhrik || 157|| samrat suveshah shatrughno'surashatruh
    shubhodayah | samarthah sugatah shakrah sadyogi sadasanmayah || 158|| shastranetram mukham shmashru
    svadhishthanam shadashrayah | abhuh satyapatirvriddhah shamanah shikhisarathih || 159|| supratikah
    suvriddhatma vamanah sukhavaridhih | sukhanidah sunishpannah surabhih srishtiratmakah || 160|| sarvadevamayah
    shailah sarvashastraprabhanjanah | shivalayah sarvarupah sahasramukhanasika || 161|| sahasrabahuh
    sarvesham sharanyah sarvalokadhrik | indreshah surasavyasah sarvadevottamottamah || 162|| shivadhyanaratah
    shriman shikhishri candikapriyah | shmashananilayah setuh sarvabhutamaheshvarah || 163|| suvishishtah
    suradhyakshah sukumarah sulocanah | sakalah svargatah svargah sargah svaramayah svanah || 164|| samagah
    sakaladharah samaganapriyah shicih | sadgatih satkritih shantasadbhutih satparayanah || 165|| shucismitah
    prasannatma sarvashastramritamvarah | sarvavasah stutastvashta satyavrataparayanah || 166|| shrivallabhah
    shivarambhah shantabhadrah sumanasah | satyavan satvikah satyah sarvajichrutisagarah || 167|| sahasrarcih
    saptajihvah saptavara munishvarah | samsarasarathih shuddhah shatrughnah shatrutapanah || 168|| sureshah
    sharanam sharma sarvadevah satangatih | saddhrittovratasiddhishca siddhidah siddhisadhanah || 169||
    shantabuddhih shuddhabuddhih srashtasto'tastavapriyah | rasajnah sarvasarajnah sarvasatvavalambanah
    || 170|| sthulah sukshmah susukshmashca sahasrakshah prakashakah | sarameyanugah subhruh praudhabahuh
    sahasradrik || 171|| grihatmako rudrarupi vashat svaramayah shashi || adityah sarvakartta ca sarvayuh
    sarvabuddhidah | 172|| samhrishtastusadapushto ghurghuro raktalocanah | padukasiddhidah pata parushya
    vinishudanah || 173|| ashtasiddhirmahasiddhih parah sarvabhicarakah | bhutavetalaghati ca vetalanucaroravih
    || 174|| kalagnih kalarudrashca kaladityah kalamayah | kalamali kalakanthastrymbakastripurantakah
    || 175|| sarvabhicarihanta ca tatha krityanishudanah | antramali ghantamali svarnakarshanabhairavah
    || 176|| phalashrutih | namnam sahasram divyanam bhairavasya mahatmanah | maya te kathitam devi rahasyam
    sarvakamadam || 177|| bhairavasya vararohe varam namasahasrakam | pathate pathayedyastu shrunuyatsu
    samahitah || 178|| na tasya duritam kincinnamari bhayamevaca | na ca bhutabhayam kincinna roganam
    bhayam tatha || 179|| na patakadbhayam caiva shatruto na bhayam bhavet | maribhayam corabhayam nagnivyaghradijam
    bhayam || 180|| autpatikam mahaghoram pathate yo viliyate | duhsvapnaje rajabhaye vipattau ghoradarshane
    || 181|| stotrametatpathedvidvansarvaduhkhaughanashanam | sarvaprashamamayati sahasraparikirtanat
    || 182|| ekakalam dvikalam va trikalamathavanishi | pathedyo niyataharah sarvasiddhi ca vindati ||
    183|| bhumikamo bhutikamah shanmasam ca japetsudhih | pratikritya vinashartham japetrishatamuttamam
    || 184|| masatrayena sarvesham ripunamantako bhavet | masatrayam japeddevi nishinishcalamanasah ||
    185|| dhanam putran tathadaran prapnuyannatra samshayah | mahakaragrihe baddhapishacaih parivaritah
    || 186|| nigadaih sha
  devanagari: ृङ्गोऽमृतोमन्त्रो माङ्गल्यो मङ्गलप्रियः ॥ ११७॥ अमोघदण्डो मध्यस्थोमहेन्द्रोऽमोघविक्रमः ।
    अमेयोऽरिष्टमथनो मुकुन्दस्त्वमयाचलः ॥ ११८॥ मातामहो मातरिश्वा मणिपूरो महाशयः । महाश्रयो महागर्भो महाकल्पो
    महाधनुः ॥ ११९॥ मनो मनोजवो मानी मेरुमेद्यो मृदोमनुः । महाकोशो महाज्ञानी महाकालः कलिप्रियः ॥ १२०॥ महाबटुर्महात्यागी
    महाकोशोमहागतिः । शिखण्डी कवची शूली जटी मुण्डी च कुण्डली ॥ १२१॥ मेखली कञ्चुकी खड्गी माली मायी महामणिः
    । महेष्वासो महीभर्ता महावीरो महीभूजः ॥ १२२॥ मखकर्ता मखध्वंसी मधुरो मधुरप्रियः । ब्रह्मसृष्टिर्ब्रह्मवीर्यो
    बाणहस्तो महाबली ॥ १२३॥ कालरूपो बलोन्मादी ब्रह्मण्यो ब्रह्मवर्चसी । बहुरूपो बहुमायो ब्रह्माविष्णुशिवात्मकः
    ॥ १२४॥ ब्रह्मगर्भो बृहद्गर्भो बृहज्ज्योतिर्बृहत्तरः । बीजाध्यक्षो बीजकर्ता बीजाङ्गो बीजवाहनः ॥ १२५॥
    ब्रह्मब्रह्मविदो ब्रह्मब्रह्मज्योतिर्बृहस्पतिः । बीजबुद्धि ब्रह्मचारी ब्रह्मण्यो ब्राह्मणप्रियः ॥
    १२६॥ युगादिकृद्युगावर्तो युगाध्यक्षो युगापहा । यज्ञो यज्ञपतिर्यज्वा यज्ञाङ्गो यज्ञवाहनः ॥ १२७॥ योगाचार्यो
    योगगम्यो योगी योगश्चयोगवित् । योगाङ्गो योगसारङ्गो यक्षोयुक्तिर्यमोयमी ॥ १२८॥ रौद्रो रुद्र ऋषी राहू
    रुचिर्त्वं रणप्रियः । अरोगो रोगहारी च रुधिरो रुचिराङ्गदी ॥ १२९॥ लोहिताक्षो ललाटाक्षो लोकदो लोककारकः
    । लोकबन्धुर्लोकनाथो लक्षण ज्ञोथलक्षणः ॥ १३०॥ लोकमायो लोककर्ता लौल्यो ललित एव च । वरीयान् वरदो वन्द्यो
    विद्वान् विश्वामरेश्वरः ॥ १३१॥ वेदान्तसारसन्देहो वीतरागो विशारदः । विश्वमूर्तिर्विश्ववेद्यो वामदेवो
    विमोचकः ॥ १३२॥ विश्वरूपो विश्वपक्षो वागीशो वृषवाहनः । वृषाङ्कोथ विशालाक्षो विश्वदीप्तिर्विलोचनः ॥
    १३३॥ विलोको विश्वदृग्विश्वोविजितात्मालयः पुमान् । व्याघ्रचर्मधरोवाङ्गी वाङ्मयैकविधिर्विभुः ॥ १३४॥
    वर्णाश्रम गुरुवर्णी वरदो वायुवाहनः । विश्वकर्मा विनीतात्मा वेदशास्त्रार्थ तत्त्ववित् ॥ १३५॥ वसुर्वसुमना
    व्यालो विरामो विमदः कविः । विमोचकश्चविजयो विशिष्टो वृषवाहनः ॥ १३६॥ विद्येशो विबुधो वादी वेदाङ्गो वेदविन्मुतिः
    । विश्वेश्वरो वीरभद्रो वीरासन विधिर्विराट ॥ १३७॥ व्यवसायो व्यवस्थानः वीरचुडामणिर्वरः । वालखिल्यो विश्वदेहो
    विरामो वसुदोवसुः ॥ १३८॥ विरोचनो वररुचिर्वेद्यो वाचस्पतिर्गतिः । विद्वत्तमोवीतभयो विश्रुतिर्विमलोदयः
    ॥ १३९॥ वैवस्वतो वसिष्ठश्च विभूतिर्विगतज्वरः । विश्वहर्ता विश्वागोप्ता विश्वामित्रो द्विजेश्वरः ॥ १४०॥
    विश्वोत्पत्तिर्विश्वसहो विश्वावासो वसुश्रवाः । विश्वरूपो वज्रहस्तो विपाको विश्वकारकः ॥ १४१॥ वृषदर्श्वो
    व्यासकल्पो विशल्पो लोकशल्यहृत् । विरूपो विकृतो वेगी विरिञ्चिर्विष्टरश्रवाः ॥ १४२॥ अव्यक्तलक्षणो व्यक्तो
    व्यक्ताव्यक्तो विशाम्पतिः । विबुद्धोऽग्रकरो वेदो विश्वगर्भो विचक्षणः ॥ १४३॥ विषमाक्षो विलोमाक्षो वृषभो
    वृषवर्द्धनः । वित्तप्रदो वसन्तश्च विवस्वान् विक्रमोत्तमः ॥ १४४॥ वेद्यो वैद्यो विश्वरूपो विविक्तो विश्वभाजनम्
    । विषयस्छो विविक्तस्छो विद्याराशिर्वियत्प्रियः ॥ १४५॥ शिवः सर्वः सदाचारः शम्भुरीशान ईश्वरः । श्रुतिधर्मानसंवादी
    सहस्राक्षः सहस्रपात् ॥ १४६॥ सर्वज्ञः सर्वदेवश्च शङ्करः शूलधारकः । सुशरीरः स्कन्दगुरुः श्रीकण्ठः सूर्यतापनः
    ॥ १४७॥ ईशानो निलयः स्वस्ति सामवेदस्त्वथर्ववित् । नीतिः सुनीतिः श्रद्धात्मा सोमः सोमतरः सुखी ॥ १४८॥
    सोमपामृतपः सौम्यः सूत्रकारः सनातनः । शाखो विशाखो सम्भाव्यः सर्वदः सर्वगोचरः ॥ १४९॥ सदाशिवः समावृत्तिः
    सुकीर्तिः स्छिन्नसंशयः । सर्वावासः सदावासः सर्वायुधविशारदः ॥ १५०॥ सुलभः सुव्रतः शूरः शुभाङ्गः शुभविग्रहः
    । सुवर्णाङ्गः स्वात्मशत्रुः शत्रुजिछत्रुतापनः ॥ १५१॥ शनिः सूर्यः सर्वकर्मा सर्वलोकप्रजापतिः । सिद्धः
    सर्वेश्वरः स्वस्ति स्वस्तिकृत्स्वस्ति भूस्वधा ॥ १५२॥ वसुर्वसुमनासत्यः सर्वपापहरोहरः । सर्वादिः सिद्धिदः
    सिद्धिः सत्वावासःश्चतुष्पथः ॥ १५३॥ संवत्सरकरः श्रीमान् शान्तः संवत्सरः शिशुः । स्पष्टाक्षरः सर्वहारी
    सङ्ग्रामः समराधिकः ॥ १५४॥ इष्टोविशिष्टः शिष्टेष्टः शुभदः सुलभायनः । सुब्रह्मण्यः सुरगणो सुशरण्यः सुधापतिः
    ॥ १५५॥ शरण्यः शाश्वतः स्कन्दः शिपिविष्टः शिवाश्रयः । संसारचक्रभृत्सारः शङ्करः सर्वसाधकः ॥ १५६॥ शस्त्रं
    शास्त्रं शान्तरागः सवितासकलागमः । सुवीरः सत्पथाचारः षड्विंशः सप्तलोकधृक् ॥ १५७॥ सम्राट् सुवेषः शत्रुघ्नोऽसुरशत्रुः
    शुभोदयः । समर्थः सुगतः शक्रः सद्योगी सदसन्मयः ॥ १५८॥ शास्त्रनेत्रं मुखं श्मश्रु स्वाधिष्ठानं षडाश्रयः
    । अभूः सत्यपतिर्वृद्धः शमनः शिखिसारथिः ॥ १५९॥ सुप्रतीकः सुवृद्धात्मा वामनः सुखवारिधिः । सुखानीडः सुनिष्पन्नः
    सुरभिः सृष्टिरात्मकः ॥ १६०॥ सर्वदेवमयः शैलः सर्वशस्त्रप्रभञ्जनः । शिवालयः सर्वरूपः सहस्रमुखनासिका
    ॥ १६१॥ सहस्रबाहुः सर्वेषां शरण्यः सर्वलोकधृक् । इन्द्रेशः सुरसव्यासः सर्वदेवोत्तमोत्तमः ॥ १६२॥ शिवध्यानरतः
    श्रीमान् शिखिश्री चण्डिकाप्रियः । श्मशाननिलयः सेतुः सर्वभूतमहेश्वरः ॥ १६३॥ सुविशिष्टः सुराध्यक्षः
    सुकुमारः सुलोचनः । सकलः स्वर्गतः स्वर्गः सर्गः स्वरमयः स्वनः ॥ १६४॥ सामगः सकलाधारः सामगानप्रियः शिचिः
    । सद्गतिः सत्कृतिः शान्तसद्भूतिः सत्परायणः ॥ १६५॥ शुचिस्मितः प्रसन्नात्मा सर्वशस्त्रमृतांवरः । सर्वावासः
    स्तुतस्त्वष्टा सत्यव्रतपरायणः ॥ १६६॥ श्रीवल्लभः शिवारम्भः शान्तभद्रः सुमानसः । सत्यवान् सात्विकः सत्यः
    सर्वजिछ्रुतिसागरः ॥ १६७॥ सहस्रार्चिः सप्तजिह्वः सप्तावर मुनीश्वरः । संसारसारथिः शुद्धः शत्रुघ्नः शत्रुतापनः
    ॥ १६८॥ सुरेशः शरणं शर्म सर्वदेवः सताङ्गतिः । सद्धृत्तोव्रतसिद्धिश्च सिद्धिदः सिद्धिसाधनः ॥ १६९॥ शान्तबुद्धिः
    शुद्धबुद्धिः स्रष्टास्तोऽतास्तवप्रियः । रसज्ञः सर्वसारज्ञः सर्वसत्वावलम्बनः ॥ १७०॥ स्थूलः सूक्ष्मः
    सुसूक्ष्मश्च सहस्राक्षः प्रकाशकः । सारमेयानुगः सुभ्रूः प्रौढबाहुः सहस्रदृक् ॥ १७१॥ गृहात्मको रुद्ररूपी
    वषट् स्वरमयः शशी ॥ आदित्यः सर्वकर्त्ता च सर्वायुः सर्वबुद्धिदः । १७२॥ संहृष्टस्तुसदापुष्टो घुर्घुरो
    रक्तलोचनः । पादुकासिद्धिदः पाता पारुष्य विनिषूदनः ॥ १७३॥ अष्टसिद्धिर्महासिद्धिः परः सर्वाभिचारकः ।
    भूतवेतालघाती च वेतालानुचरोरविः ॥ १७४॥ कालाग्निः कालरुद्रश्च कालादित्यः कलामयः । कालमाली कालकण्ठस्त्र्य्म्बकस्त्रिपुरान्तकः
    ॥ १७५॥ सर्वाभिचारीहन्ता च तथा कृत्यानिषूदनः । आन्त्रमाली घण्टमाली स्वर्णाकर्षणभैरवः ॥ १७६॥ फलश्रुतिः
    । नाम्नां सहस्रं दिव्यानां भैरवस्य महात्मनः । मया ते कथितं देवि रहस्यं सर्वकामदम् ॥ १७७॥ भैरवस्य वरारोहे
    वरं नामसहस्रकम् । पठते पाठयेद्यस्तु श्रुणुयात्सु समाहितः ॥ १७८॥ न तस्य दुरितं किञ्चिन्नमारी भयमेवच
    । न च भूतभयं किञ्चिन्न रोगाणां भयं तथा ॥ १७९॥ न पातकाद्भयं चैव शत्रुतो न भयं भवेत् । मारीभयं चोरभयं
    नाग्निव्याघ्रादिजं भयम् ॥ १८०॥ औत्पातिकं महाघोरं पठते यो विलीयते । दुःस्वप्नजे राजभये विपत्तौ घोरदर्शने
    ॥ १८१॥ स्तोत्रमेतत्पठेद्विद्वान्सर्वदुःखौघनाशनम् । सर्वप्रशममायाति सहस्रपरिकीर्तनात् ॥ १८२॥ एककालं
    द्विकालं वा त्रिकालमथवानिशी । पठेद्यो नियताहारः सर्वसिद्धि च विन्दति ॥ १८३॥ भूमिकामो भूतिकामः षण्मासं
    च जपेत्सुधीः । प्रतिकृत्या विनाशार्थं जपेत्रिशतमुत्तमम् ॥ १८४॥ मासत्रयेण सर्वेषां रिपूणामन्तको भवेत्
    । मासत्रयं जपेद्देवि निशिनिश्चलमानसः ॥ १८५॥ धनं पुत्रान् तथादारान् प्राप्नुयान्नात्र संशयः । महाकारागृहे
    बद्धपिशाचैः परिवारितः ॥ १८६॥ निगडैः श
