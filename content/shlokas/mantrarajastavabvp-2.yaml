id: mantrarajastavabvp-2
category: mantra
name:
  english: mantrarajastavaBVP
  devanagari: मन्त्रराजस्तवBVP
content:
  english: rinu shaunaka | mantrarajah kalpatarurvasishtho dattavan pura || 55|| om namah shivaya | banasura
    uvaca | vande suranam saram ca suresham nilalohitam | yogishvaram yogabijam yoginam ca gurorgurum
    || 56|| jnananandam jnanarupam jnanabijam sanatanam | tapasam phaladataram dataram sarvasampadam ||
    57|| taporupam tapobijam tapodhanadhanam varam | varam varenyam varadamidyam siddhaganairvaraih ||
    58|| karanam bhuktimuktinam narakarnavataranam | ashutosham prasannasyam karunamayasagaram || 59||
    himacandanakundendukumudambhojasannibham | brahmajyotisvarupam ca bhaktanugrahavigraham || 60|| vishayanam
    vibhedena bibhrantam bahurupakam | jalarupamagnirupamakasharupamishvaram || 61|| vayurupam candrarupam
    suryarupam mahatprabhum | atmanah svapadam datum samarthamavalilaya || 62|| bhaktajivanamisham ca
    bhaktanugrahakarakam | veda na shakta yam stotum kimaham staumi tam prabhum || 63|| aparicchinnamishanamaho
    vanmanasoh param | vyaghracarmambaradharam vrishabhastham digambaram || 64|| trishulapattishadharam
    sammitam candrashekharam | ityuktva stavarajena nityam banah susamyatah || 65|| pranamat shankaram
    bhaktya durvasashca munishvarah | idam dattam vasishthena gandharvaya pura mune || 66|| kathitam ca
    mahastotram shulinah paramadbhutam | idam stotram mahapunyam pathedbhaktya ca yo narah || 67|| snanasya
    sarvatirthanam phalamapnoti nishcitam | aputro labhate putram varshamekam sha
  devanagari: ृणु शौनक । मन्त्रराजः कल्पतरुर्वसिष्ठो दत्तवान् पुरा ॥ ५५॥ ॐ नमः शिवाय । बाणासुर उवाच ।
    वन्दे सुरणां सारं च सुरेशं नीललोहितम् । योगीश्वरं योगबीजं योगिनां च गुरोर्गुरुम् ॥ ५६॥ ज्ञानानन्दं
    ज्ञानरूपं ज्ञानबीजं सनातनम् । तपसां फलदातारं दातारं सर्वसम्पदाम् ॥ ५७॥ तपोरूपं तपोबीजं तपोधनधनं वरम्
    । वरं वरेण्यं वरदमीड्यं सिद्धगणैर्वरैः ॥ ५८॥ कारणं भुक्तिमुक्तीनां नरकार्णवतारणम् । आशुतोषं प्रसन्नास्यं
    करुणामयसागरम् ॥ ५९॥ हिमचन्दनकुन्देन्दुकुमुदाम्भोजसन्निभम् । ब्रह्मज्योतिस्वरूपं च भक्तानुग्रहविग्रहम्
    ॥ ६०॥ विषयाणां विभेदेन बिभ्रन्तं बहुरूपकम् । जलरूपमग्निरूपमाकाशरूपमीश्वरम् ॥ ६१॥ वायुरूपं चन्द्ररूपं
    सूर्यरूपं महत्प्रभुम् । आत्मनः स्वपदं दातुं समर्थमवलीलया ॥ ६२॥ भक्तजीवनमीशं च भक्तानुग्रहकारकम् ।
    वेदा न शक्ता यं स्तोतुं किमहं स्तौमि तं प्रभुम् ॥ ६३॥ अपरिच्छिन्नमीशानमहो वाङ्मनसोः परम् । व्याघ्रचर्माम्बरधरं
    वृषभस्थं दिगम्बरम् ॥ ६४॥ त्रिशूलपट्टिशधरं सम्मितं चन्द्रशेखरम् । इत्युक्त्वा स्तवराजेन नित्यं बाणः
    सुसंयतः ॥ ६५॥ प्रणमत् शङ्करं भक्त्या दुर्वासाश्च मुनीश्वरः । इदं दत्तं वसिष्ठेन गन्धर्वाय पुरा मुने
    ॥ ६६॥ कथितं च महास्तोत्रं शूलिनः परमाद्भुतम् । इदं स्तोत्रं महापुण्यं पठेद्भक्त्या च यो नरः ॥ ६७॥
    स्नानस्य सर्वतीर्थानां फलमाप्नोति निश्चितम् । अपुत्रो लभते पुत्रं वर्षमेकं श
