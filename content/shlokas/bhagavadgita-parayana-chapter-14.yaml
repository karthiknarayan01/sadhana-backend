id: bhagavadgita-parayana-chapter-14
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 14
content:
  english: om shri paramatmane namah atha caturdasho'dhyayah gunatrayavibhagayogah shri bhagavanuvaca
    param bhuyah pravakshyami jnananam jnanamuttamam | yajjnatva munayah sarve param siddhimito gatah
    || || idam jnanamupashritya mama sadharmyamagatah | sarge'pi nopajayante pralaye na vyathanti ca ||
    || mama yonirmahadbrahma tasmingarbham dadhamyaham | sambhavah sarvabhutanam tato bhavati bharata
    || || sarvayonishu kaunteya murtayah sambhavanti yah | tasam brahma mahadyonih aham bijapradah pita
    || || sattvam rajastama iti gunah prakritisambhavah | nibadhnanti mahabaho dehe dehinamavyayam ||
    || tatra sattvam nirmalatvat prakashakamanamayam | sukhasangena badhnati jnanasangena canagha || ||
    rajo ragatmakam viddhi trishnasangasamudbhavam | tannibadhnati kaunteya karmasangena dehinam || ||
    tamastvajnanajam viddhi mohanam sarvadehinam | pramadalasyanidrabhih tannibadhnati bharata || || sattvam
    sukhe sanjayati rajah karmani bharata | jnanamavritya tu tamah pramade sanjayatyuta || || rajastamashcabhibhuya
    sattvam bhavati bharata | rajah sattvam tamashcaiva tamah sattvam rajastatha || || sarvadvareshu dehe'smin
    prakasha upajayate | jnanam yada tada vidyat vivriddham sattvamityuta || || lobhah pravrittirarambhah
    karmanamashamah spriha | rajasyetani jayante vivriddhe bharatarshabha || || aprakasho'pravrittishca
    pramado moha eva ca | tamasyetani jayante vivriddhe kurunandana || || yada sattve pravriddhe tu pralayam
    yati dehabhrit | tadottamavidam lokan amalanpratipadyate || || rajasi pralayam gatva karmasangishu
    jayate | tatha pralinastamasi mudhayonishu jayate || || karmanah sukritasyahuh sattvikam nirmalam
    phalam | rajasastu phalam duhkham ajnanam tamasah phalam || || sattvatsanjayate jnanam rajaso lobha
    eva ca | pramadamohau tamasah bhavato'jnanameva ca || || urdhvam gacchanti sattvasthah madhye tishthanti
    rajasah | jaghanyagunavrittisthah adho gacchanti tamasah || || nanyam gunebhyah kartaram yada drashta'nupashyati
    | gunebhyashca param vetti madbhavam so'dhigacchati || || gunanetanatitya trin dehi dehasamudbhavan
    | janmamrityujaraduhkhaih vimukto'mritamashnute || || arjuna uvaca kairlingaistringunanetan atito
    bhavati prabho | kimacarah katham caitan tringunanativartate || || shri bhagavanuvaca prakasham ca
    pravrittim ca mohameva ca pandava | na dveshti sampravrittani na nivrittani kankshati || || udasinavadasinah
    gunairyo na vicalyate | guna vartanta ityeva yo'vatishthati nengate || || samaduhkhasukhah svasthah
    samaloshtashmakancanah | tulyapriyapriyo dhirah tulyanindatmasamstutih || || manapamanayostulyah tulyo
    mitraripakshayoh | sarvarambhaparityagi gunatitah sa ucyate || || mam ca yo'vyabhicarena bhaktiyogena
    sevate | sa gunansamatityaitan brahmabhuyaya kalpate || || brahmano hi pratishtha'ham amritasyavyayasya
    ca | shashvatasya ca dharmasya sukhasyaikantikasya ca || || || om tatsaditi shrimadbhagavadgitasu
    upanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade gunatrayavibhagayogo caturdasho'dhyayah
    ||
  devanagari: ॐ श्री परमात्मने नमः अथ चतुर्दशोऽध्यायः गुणत्रयविभागयोगः श्री भगवानुवाच परं भूयः प्रवक्ष्यामि
    ज्ञानानां ज्ञानमुत्तमम् । यज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ॥ ॥ इदं ज्ञानमुपाश्रित्य मम
    साधर्म्यमागताः । सर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च ॥ ॥ मम योनिर्महद्ब्रह्म तस्मिन्गर्भं दधाम्यहम्
    । सम्भवः सर्वभूतानां ततो भवति भारत ॥ ॥ सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः । तासां ब्रह्म महद्योनिः
    अहं बीजप्रदः पिता ॥ ॥ सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः । निबध्नन्ति महाबाहो देहे देहिनमव्ययम्
    ॥ ॥ तत्र सत्त्वं निर्मलत्वात् प्रकाशकमनामयम् । सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ॥ ॥ रजो रागात्मकं
    विद्धि तृष्णासङ्गसमुद्भवम् । तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ॥ ॥ तमस्त्वज्ञानजं विद्धि मोहनं
    सर्वदेहिनाम् । प्रमादालस्यनिद्राभिः तन्निबध्नाति भारत ॥ ॥ सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत । ज्ञानमावृत्य
    तु तमः प्रमादे सञ्जयत्युत ॥ ॥ रजस्तमश्चाभिभूय सत्त्वं भवति भारत । रजः सत्त्वं तमश्चैव तमः सत्त्वं
    रजस्तथा ॥ ॥ सर्वद्वारेषु देहेऽस्मिन् प्रकाश उपजायते । ज्ञानं यदा तदा विद्यात् विवृद्धं सत्त्वमित्युत
    ॥ ॥ लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा । रजस्येतानि जायन्ते विवृद्धे भरतर्षभ ॥ ॥ अप्रकाशोऽप्रवृत्तिश्च
    प्रमादो मोह एव च । तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ॥ ॥ यदा सत्त्वे प्रवृद्धे तु प्रलयं याति
    देहभृत् । तदोत्तमविदां लोकान् अमलान्प्रतिपद्यते ॥ ॥ रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते । तथा प्रलीनस्तमसि
    मूढयोनिषु जायते ॥ ॥ कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् । रजसस्तु फलं दुःखम् अज्ञानं तमसः
    फलम् ॥ ॥ सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च । प्रमादमोहौ तमसः भवतोऽज्ञानमेव च ॥ ॥ ऊर्ध्वं गच्छन्ति
    सत्त्वस्थाः मध्ये तिष्ठन्ति राजसाः । जघन्यगुणवृत्तिस्थाः अधो गच्छन्ति तामसाः ॥ ॥ नान्यं गुणेभ्यः कर्तारं
    यदा द्रष्टाऽनुपश्यति । गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ॥ ॥ गुणानेतानतीत्य त्रीन् देही देहसमुद्भवान्
    । जन्ममृत्युजरादुःखैः विमुक्तोऽमृतमश्नुते ॥ ॥ अर्जुन उवाच कैर्लिङ्गैस्त्रीन्गुणानेतान् अतीतो भवति
    प्रभो । किमाचारः कथं चैतान् त्रीन्गुणानतिवर्तते ॥ ॥ श्री भगवानुवाच प्रकाशं च प्रवृत्तिं च मोहमेव च
    पाण्डव । न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ॥ ॥ उदासीनवदासीनः गुणैर्यो न विचाल्यते ।
    गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते ॥ ॥ समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः । तुल्यप्रियाप्रियो
    धीरः तुल्यनिन्दात्मसंस्तुतिः ॥ ॥ मानापमानयोस्तुल्यः तुल्यो मित्रारिपक्षयोः । सर्वारम्भपरित्यागी गुणातीतः
    स उच्यते ॥ ॥ मां च योऽव्यभिचारेण भक्तियोगेन सेवते । स गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते ॥ ॥ ब्रह्मणो
    हि प्रतिष्ठाऽहम् अमृतस्याव्ययस्य च । शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु
    उपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे गुणत्रयविभागयोगो चतुर्दशोऽध्यायः ॥
