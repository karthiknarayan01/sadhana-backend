id: bhishmakritamvishnustotram
category: stotram
name:
  english: bhishmakritamvishnustotram
  devanagari: भीष्मकृतंविष्णुस्तोत्रम्
content:
  english: bhishmakritam vishnustotram bhishma uvaca | vasudevo mahadbhutam sambhutam saha daivataih |
    na param pundarikakshaddrishyate bharatarshabha | markandeyashca govindam kathayatyadbhutam mahat
    || 2|| sarvabhutani bhutatma mahatma purushottamah | apo vayushca tejashca trayametadakalpayat ||
    3|| sa srishtva prithivim devah sarvalokeshvarah prabhuh | apsu vai shayanam cakre mahatma purushottamah
    | sarvatoyamayo devo yogatsushvapa tatra ha || 4|| mukhatah so'gnimasrijatpranadvayumathapi ca | sarasvatim
    ca vedamshca manasah sasrije'cyutah || 5|| esha lokansasarjadau devamshcarshiganaih saha | nidhanam
    caiva mrityum ca prajanam prabhavo'vyayah || 6|| esha dharmashca dharmajno varadah sarvakamadah |
    esha karta ca karyam ca purvadevah svayamprabhuh || 7|| bhutam bhavyam bhavishyacca purvametadakalpayat
    | ubhe sandhye dishah kham ca niyamam ca janardanah || 8|| rishimshcaiva hi govindastapashcaivanukalpayat
    | srashtaram jagatashcapi mahatma prabhuravyayah || 9|| agrajam sarvabhutanam sankarshanamakalpayat
    | shesham cakalpayaddevamanantamiti yam viduh || 10|| yo dharayati bhutani dharam cemam saparvatam
    | dhyanayogena viprashca tam vadanti mahaujasam || 11|| karnasrotodbhavam capi madhum nama mahasuram
    | tamugramugrakarmanamugram buddhim samasthitam | brahmano'pacitim kurvanjaghana purushottamah ||
    12|| tasya tata vadhadeva devadanavamanavah | madhusudanamityahurrishayashca janardanam | varahashcaiva
    simhashca trivikramagatih prabhuh || 13|| esha mata pita caiva sarvesham praninam harih | param hi
    pundarikakshanna bhutam na bhavishyati || 14|| mukhato'srijadbrahmananbahubhyam kshatriyamstatha |
    vaishyamshcapyuruto rajanshudranpadbhyam tathaiva ca | tapasa niyato devo nidhanam sarvadehinam ||
    15|| brahmabhutamamavasyam paurnamasyam tathaiva ca | yogabhutam paricarankeshavam mahadapnuyat ||
    16|| keshavah paramam tejah sarvalokapitamahah | evamahurhrishikesham munayo vai naradhipa || 17||
    evamenam vijanihi acaryam pitaram gurum | krishno yasya prasideta lokastenakshaya jitah || 18|| yashcaivainam
    bhayasthane keshavam sharanam vrajet | sada narah pathamshcedam svastimansa sukhi bhavet || 19|| ye
    ca krishnam prapadyante te na muhyanti manavah | bhaye mahati ye magnah pati nityam janardanah ||
    20|| iti mahabharate bhishmaparvani 63 adhyayantargatam bhishmakritam vishnustotram sampurnam | mahabharata
    | bhishmaparva | adhyaya 63
  devanagari: भीष्मकृतं विष्णुस्तोत्रम् भीष्म उवाच । वासुदेवो महद्भूतं सम्भूतं सह दैवतैः । न परं पुण्डरीकाक्षाद्दृश्यते
    भरतर्षभ । मार्कण्डेयश्च गोविन्दं कथयत्यद्भुतं महत् ॥ २॥ सर्वभूतानि भूतात्मा महात्मा पुरुषोत्तमः ।
    आपो वायुश्च तेजश्च त्रयमेतदकल्पयत् ॥ ३॥ स सृष्ट्वा पृथिवीं देवः सर्वलोकेश्वरः प्रभुः । अप्सु वै शयनं
    चक्रे महात्मा पुरुषोत्तमः । सर्वतोयमयो देवो योगात्सुष्वाप तत्र ह ॥ ४॥ मुखतः सोऽग्निमसृजत्प्राणाद्वायुमथापि
    च । सरस्वतीं च वेदांश्च मनसः ससृजेऽच्युतः ॥ ५॥ एष लोकान्ससर्जादौ देवांश्चर्षिगणैः सह । निधनं चैव मृत्युं
    च प्रजानां प्रभवोऽव्ययः ॥ ६॥ एष धर्मश्च धर्मज्ञो वरदः सर्वकामदः । एष कर्ता च कार्यं च पूर्वदेवः स्वयम्प्रभुः
    ॥ ७॥ भूतं भव्यं भविष्यच्च पूर्वमेतदकल्पयत् । उभे सन्ध्ये दिशः खं च नियमं च जनार्दनः ॥ ८॥ ऋषींश्चैव
    हि गोविन्दस्तपश्चैवानुकल्पयत् । स्रष्टारं जगतश्चापि महात्मा प्रभुरव्ययः ॥ ९॥ अग्रजं सर्वभूतानां सङ्कर्षणमकल्पयत्
    । शेषं चाकल्पयद्देवमनन्तमिति यं विदुः ॥ १०॥ यो धारयति भूतानि धरां चेमां सपर्वताम् । ध्यानयोगेन विप्राश्च
    तं वदन्ति महौजसम् ॥ ११॥ कर्णस्रोतोद्भवं चापि मधुं नाम महासुरम् । तमुग्रमुग्रकर्माणमुग्रां बुद्धिं
    समास्थितम् । ब्रह्मणोऽपचितिं कुर्वञ्जघान पुरुषोत्तमः ॥ १२॥ तस्य तात वधादेव देवदानवमानवाः । मधुसूदनमित्याहुरृषयश्च
    जनार्दनम् । वराहश्चैव सिंहश्च त्रिविक्रमगतिः प्रभुः ॥ १३॥ एष माता पिता चैव सर्वेषां प्राणिनां हरिः
    । परं हि पुण्डरीकाक्षान्न भूतं न भविष्यति ॥ १४॥ मुखतोऽसृजद्ब्राह्मणान्बाहुभ्यां क्षत्रियांस्तथा ।
    वैश्यांश्चाप्यूरुतो राजञ्शूद्रान्पद्भ्यां तथैव च । तपसा नियतो देवो निधानं सर्वदेहिनाम् ॥ १५॥ ब्रह्मभूतममावास्यां
    पौर्णमास्यां तथैव च । योगभूतं परिचरन्केशवं महदाप्नुयात् ॥ १६॥ केशवः परमं तेजः सर्वलोकपितामहः । एवमाहुर्हृषीकेशं
    मुनयो वै नराधिप ॥ १७॥ एवमेनं विजानीहि आचार्यं पितरं गुरुम् । कृष्णो यस्य प्रसीदेत लोकास्तेनाक्षया
    जिताः ॥ १८॥ यश्चैवैनं भयस्थाने केशवं शरणं व्रजेत् । सदा नरः पठंश्चेदं स्वस्तिमान्स सुखी भवेत् ॥ १९॥
    ये च कृष्णं प्रपद्यन्ते ते न मुह्यन्ति मानवाः । भये महति ये मग्नाः पाति नित्यं जनार्दनः ॥ २०॥ इति
    महाभारते भीष्मपर्वणि ६३ अध्यायान्तर्गतं भीष्मकृतं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । भीष्मपर्व
    । अध्याय ६३
