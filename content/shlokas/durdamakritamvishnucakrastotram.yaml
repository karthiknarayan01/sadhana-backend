id: durdamakritamvishnucakrastotram
category: stotram
name:
  english: durdamakritamvishnucakrastotram
  devanagari: दुर्दमकृतंविष्णुचक्रस्तोत्रम्
content:
  english: durdamakritam vishnucakrastotram durdama uvaca | sudarshana namaste'stu vishnuhastaikabhushana
    | namaste'surasamhartre sahasradityatejase || 37|| kripaleshena bhavatastyaktvaham rakshasim tanum
    | svarupamabhajam vishnoshcakrayudha namo'stu te || 38|| anujanihi mam gantum tridivam vishnuvallabha
    | bharya me parishocanti virahaturacetasa || 39|| tvanmanasko bhavishyami yavajjivam yatha hyaham
    | tatha kripam kurushva tvam mayi cakra namo'stu te || 1
  devanagari: दुर्दमकृतं विष्णुचक्रस्तोत्रम् दुर्दम उवाच । सुदर्शन नमस्तेऽस्तु विष्णुहस्तैकभूषण । नमस्तेऽसुरसंहर्त्रे
    सहस्रादित्यतेजसे ॥ ३७॥ कृपालेशेन भवतस्त्यक्त्वाहं राक्षसीं तनुम् । स्वरूपमभजं विष्णोश्चक्रायुध नमोऽस्तु
    ते ॥ ३८॥ अनुजानीहि मां गन्तुं त्रिदिवं विष्णुवल्लभ । भार्या मे परिशोचन्ती विरहातुरचेतसा ॥ ३९॥ त्वन्मनस्को
    भविष्यामि यावज्जीवं यथा ह्यहम् । तथा कृपां कुरुष्व त्वं मयि चक्र नमोऽस्तु ते ॥ १
meaning: {}
