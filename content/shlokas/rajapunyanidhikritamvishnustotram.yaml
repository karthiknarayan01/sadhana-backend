id: rajapunyanidhikritamvishnustotram
category: stotram
name:
  english: rajapunyanidhikritamvishnustotram
  devanagari: राजापुण्यनिधिकृतंविष्णुस्तोत्रम्
content:
  english: prasida kamalapate || 46|| viprarupa namastubhyamaparadham kshamasva me | namaste pundarikaksha
    cakrapane shriyahpate || 47|| namah shrivatsacihnaya namah kaustubhadharine | parvatipataye tubhyam
    lakshmishaya namonamah || 48|| manikipataye prabhanathaya vishnave namah | shrinivasaya shrikrishnanarayanaya
    te namah || 49|| padmeshaya padmavatisvamine haraye namah | padminishaya krishnaya bhargavishaya te
    namah || 50|| narayanaya ramaya sitayah pataye namah | sarasvatipataye te gangayah svamine namah ||
    51|| virajayah pataye te shridurgapataye namah | matsutapataye hamsamanjulapataye namah || 52|| krishnavipratmane
    tubhyam hridantaratmane namah | dayamurte namastubhyam kambharapataye namah || 53|| namo dhvajadhanurmatsyashulahastaya
    te namah | svastivaradahastaya kantarupaya te namah || 54|| maya nigadapashabhyam baddhastvam parameshvara
    | ajanataste bhaktasya tvaparadhan kshamasva me || 55|| evam stutva krishnanarayanam shripurushottamam
    | padayoh patitah pashcallakshmim tushtava vaishnavim || 56|| namah kripasvarupayai svalabdhayai namo
    namah | namah sutasvarupayai divyadevyai namo namah || 57|| gudhatanvyai krishnanarayanapatnyai ca
    te namah | vishnuvakshonivasayai kamalayai namo namah || 58|| radhayai ca sarasvatyai padminyai te
    namo namah | durgayai ca mahalakshmyai sharadayai ca te namah || 59|| gangayai ca tulasyai ca vrindayai
    te namo namah | padmavatyai ca bhargavyai kambharayai ca te namah || 60|| siddhyai pushtyai svadhayai
    ca svahayai satatam namah | dakshinayai mangalayai parvatyai ca shriyai namah || 61|| manikyayai prabhayai
    ca lalitayai ca te namah | jayayai janakidevyai dropadyai te namo namah || 62|| narayanyai ca sandhyayai
    shashthyai devyai namo namah | matrikayai ca krishnayai manjulayai namo namah || 63|| shraddhamedhabhutidhatrihamsakhyayai
    ca te namah | dharanyai sarvavidyayai buddhyai gopyai namo namah || 64|| prakrityai te jaganmatah
    putryai bhuyo namo namah | putribhave maya cadhikshiptam va shasanam kritam || 65|| tvankarakaranam
    lakshmi
  devanagari: प्रसीद कमलापते ॥ ४६॥ विप्ररूप नमस्तुभ्यमपराधं क्षमस्व मे । नमस्ते पुण्डरीकाक्ष चक्रपाणे
    श्रियःपते ॥ ४७॥ नमः श्रीवत्सचिह्नाय नमः कौस्तुभधारिणे । पार्वतीपतये तुभ्यं लक्ष्मीशाय नमोनमः ॥ ४८॥
    माणिकीपतये प्रभानाथाय विष्णवे नमः । श्रीनिवासाय श्रीकृष्णनारायणाय ते नमः ॥ ४९॥ पद्मेशाय पद्मावतीस्वामिने
    हरये नमः । पद्मिनीशाय कृष्णाय भार्गवीशाय ते नमः ॥ ५०॥ नारायणाय रामाय सीतायाः पतये नमः । सरस्वतीपतये
    ते गङ्गायाः स्वामिने नमः ॥ ५१॥ विरजायाः पतये ते श्रीदुर्गापतये नमः । मत्सुतापतये हंसामञ्जुलापतये नमः
    ॥ ५२॥ कृष्णविप्रात्मने तुभ्यं हृदन्तरात्मने नमः । दयामूर्ते नमस्तुभ्यं कम्भरापतये नमः ॥ ५३॥ नमो ध्वजधनुर्मत्स्यशूलहस्ताय
    ते नमः । स्वस्तिवरदहस्ताय कान्तरूपाय ते नमः ॥ ५४॥ मया निगडपाशाभ्यां बद्धस्त्वं परमेश्वर । अजानतस्ते
    भक्तस्य त्वपराधान् क्षमस्व मे ॥ ५५॥ एवं स्तुत्वा कृष्णनारायणं श्रीपुरुषोत्तमम् । पादयोः पतितः पश्चाल्लक्ष्मीं
    तुष्टाव वैष्णवीम् ॥ ५६॥ नमः कृपास्वरूपायै स्वलब्धायै नमो नमः । नमः सुतास्वरूपायै दिव्यदेव्यै नमो नमः
    ॥ ५७॥ गूढतन्व्यै कृष्णनारायणपत्न्यै च ते नमः । विष्णुवक्षोनिवासायै कमलायै नमो नमः ॥ ५८॥ राधायै च सरस्वत्यै
    पद्मिन्यै ते नमो नमः । दुर्गायै च महालक्ष्म्यै शारदायै च ते नमः ॥ ५९॥ गङ्गायै च तुलस्यै च वृन्दायै
    ते नमो नमः । पद्मावत्यै च भार्गव्यै कम्भरायै च ते नमः ॥ ६०॥ सिद्ध्यै पुष्ट्यै स्वधायै च स्वाहायै सततं
    नमः । दक्षिणायै मङ्गलायै पार्वत्यै च श्रियै नमः ॥ ६१॥ माणिक्यायै प्रभायै च ललितायै च ते नमः । जयायै
    जानकीदेव्यै द्रोपद्यै ते नमो नमः ॥ ६२॥ नारायण्यै च सन्ध्यायै षष्ठ्यै देव्यै नमो नमः । मातृकायै च कृष्णायै
    मञ्जुलायै नमो नमः ॥ ६३॥ श्रद्धामेधाभूतिधात्रीहंसाख्यायै च ते नमः । धरण्यै सर्वविद्यायै बुद्ध्यै गोप्यै
    नमो नमः ॥ ६४॥ प्रकृत्यै ते जगन्मातः पुत्र्यै भूयो नमो नमः । पुत्रीभावे मया चाधिक्षिप्तं वा शासनं कृतम्
    ॥ ६५॥ त्वङ्कारकरणं लक्ष्मि
