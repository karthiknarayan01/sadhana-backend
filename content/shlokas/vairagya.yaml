id: vairagya
category: shataka
name:
  english: vairagya
  devanagari: वैरग्य
content:
  english: kridakananakelikautukajushamayuh param kshiyate || 14|| bhikshashanam tadapi nirasamekavaram
    shayya ca bhuh parijano nijadehamatram | vastram vishirnashatakhandamayi ca kantha ha ha tathapi vishaya
    na parityajanti || 15|| stanau mamsagranthi kanakakalashavityupamitau mukham shleshmagaram tadapi
    ca shashankena tulitam | sravanmutraklinnam karivarashiraspardhi jaghanam muhurnindyam rupam kavijanavisheshairguru
    kritam || 16|| eko ragishu rajate priyatamadehardhahari haro nirageshu jano vimuktalalanasango na
    yasmatparah | durvarasmarabanapannagavishavyaviddhamugdho janah sheshah kamavidambitanna vishayanbhoktum
    na moktum kshamah || 17|| ajanandahatmyam patatu shalabhastivradahane sa mino'pyajnanadvadishayutamashnatu
    pishitam | vijananto'pyete vayamiha vipajjalajatilan na muncamah kamanahaha gahano mohamahima || 18||
    trisha shushyatyasye pibati salilam shitamadhuram kshudhartah shalyannam kavalayati mamsadikalitam
    | pradipte kamagnau sudridhataramalingati vadhum pratikaram vyadheh sukhamiti viparyasyati janah ||
    19|| tungam veshma sutah satamabhimatah samkhyatigah sampadah kalyani dayita vayashca navamityajnanamudho
    janah | matva vishvamanashvaram nivishate samsarakaragrihe samdrishya kshanabhamguram tadakhilam dhanyastu
    samnyasyati || 20|| yancadainyadushanam | dina dinamukhaih sadaiva shishukairakrishtajirnambara kroshadbhih
    kshudhitairnirannavidhura drishya na cedgehini | yancabhangabhayena gadgadagalattrutyadvilinaksharam
    ko dehiti vadetsvadagdhajatharasyarthe manasvi puman || 21|| abhimatamahamanagranthiprabhedapatiyasi
    gurutaragunagramambhojasphutojjvalacandrika | vipulavilasallajjavallivitanakutharika jatharapithari
    dushpureyam karoti vidambanam || 22|| punye grame vane va mahati sitapatacchannapalim kapalim hyadaya
    nyayagarbhadvijahutahutabhugdhumadhumropakanthe | dvaram dvaram pravishto varamudaradaripuranaya kshudharto
    mani pranaih sanatho na punaranudinam tulyakulyeshu dinah || 23|| gangatarangakanashikarashitalani
    vidyadharadhyushitacarushilatalani | sthanani kim himavatah pralayam gatani yatsavamanaparapindarata
    manushyah || 24|| kim kandah kandarebhyah pralayamupagata nirjhara va giribhyah pradhvasta va tarubhyah
    sarasaphalabhrito valkalinyashca shakhah | vikshyante yanmukhani prasabhamapagataprashrayanam khalanam
    duhkhaptasvalpavittasmayapavanavashannartitabhrulatani || 25|| punyairmulaphalaistatha pranayinim
    vrittim kurushvadhuna bhushayyam navapallavairakripanairuttishtha yavo vanam | kshudranamavivekamudhamanasam
    yatreshvaranam sada vittavyadhivikaravihvalagiram namapi na shruyate || 26|| phalam svecchalabhyam
    prativanamakhedam kshitiruham payah sthane sthane shishiramadhuram punyasaritam | mridusparsha shayya
    sulalitalatapallavamayi sahante santapam tadapi dhaninam dvari kripanah || 27|| ye vartante dhanapatipurah
    prarthanaduhkhabhajo ye calpatvam dadhati vishayakshepaparyaptabuddheh | teshamantahsphuritahasitam
    vasarani smareyam dhyanacchede shikharikuharagravashayyanishannah || 28|| ye santoshanirantarapramuditastesham
    na bhinna mudo ye tvanye dhanalubdhasamkuladhiyastesham na trishna hata | ittham kasya krite kritah
    sa vidhina kidrikpadam sampadam svatmanyeva samaptahemamahima merurna me rocate || 29|| bhikshaharamadainyamapratisukham
    bhiticchidam sarvato durmatsaryamadabhimanamathanam duhkhaughavidhvamsanam | sarvatranvahamaprayatnasulabham
    sadhupriyam pavanam shambhoh satramavaryamakshayanidhim shamsanti yogishvarah || 30|| bhogasthairyavarnanam
    | bhoge rogabhayam kule cyutibhayam vitte nripaladbhayam mane dainyabhayam bale ripubhayam rupe jaraya
    bhayam | shastre vadibhayam gune khalabhayam kaye kritantadbhayam sarvam vastu bhayanvitam bhuvi nrinam
    vairagyamevabhayam || 31|| akrantam maranena janma jarasa catyujjvalam yauvanam santosho dhanalipsaya
    shamasukham praudhanganavibhramaih | lokairmatsaribhirguna vanabhuvo vyalairnripa durjanaih asthairyena
    vibhutayo'pyupahata grastam na kim kena va || 32|| adhivyadhishatairjanasya vividhairarogyamunmulyate
    lakshmiryatra patanti tatra vivritadvara iva vyapadah | jatam jatamavashyamashu vivasham mrityuh karotyatmasat
    tatkim tena nirankushena vidhina yannirmitam susthiram || 33|| bhogastungatarangabhangataralah pranah
    kshanadhvamsinah stokanyeva dinani yauvanasukhasphurtih priyasu sthita | tatsamsaramasarameva nikhilam
    buddhva budha bodhakah lokanugrahapeshalena manasa yatnah samadhiyatam || 34|| bhoga meghavitanamadhyavilasatsaudaminicancala
    ayurvayuvighattitabjapatalilinambuvadbhanguram | lola yauvanalalasastanubhritamityakalayya drutam
    yoge dhairyasamadhisiddhasulabhe buddhim vidhadhvam budhah || 35|| ayuh kallolalolam katipayadivasasthayini
    yauvanashrih arthah samkalpakalpa ghanasamayatadidvibhrama bhogapugah | kanthashleshopagudham tadapi
    ca na ciram yatpriyabhih pranitam brahmanyasaktacitta bhavata bhavabhayambodhiparam taritum || 36||
    kricchrenamedhyamadhye niyamitatanubhih sthiyate garbhavase kantavishleshaduhkhavyatikaravishamo yauvane
    copabhogah | vamakshinamavajnavihasitavasatirvriddhabhavo'pyasadhuh samsare re manushya vadata yadi
    sukham svalpamapyasti kimcit || 37|| vyaghriva tishthati jara paritarjayanti rogashca shatrava iva
    praharanti deham | ayuh parisravati bhinnaghatadivambho lokastathapyahitamacaratiti citram || 38||
    bhoga bhanguravrittayo bahuvidhastaireva cayam bhavah tatkasyeha krite paribhramata re lokah kritam
    ceshtitaih | ashapashashatopashantivishadam cetah samadhiyatam kamotpattivashatsvadhamani yadi shraddheyamasmadvacah
    || 39|| brahmendradimarudganamstrinakananyatra sthito manyate yatsvadadvirasa bhavanti vibhavastrailokyarajyadayah
    | bhogah ko'pi sa eka eva paramo nityodito jrimbhate bho sadho kshanabhamgure taditare bhoge ratim
    ma krithah || 40|| kalamahimanuvarnanam | sa ramya nagari mahansa nripatih samantacakram ca tat parshve
    tasya ca sa vidagdhaparishattashcandrabimbananah | udvrittah sa ca rajaputranivahaste bandinastah
    kathah sarvam yasya vashadagatsmritipatham kalaya tasmai namah || 41|| yatranekah kvacidapi grihe
    tatra tishthatyathaiko yatrapyekastadanu bahavastatra naiko'pi cante | ittham neyau rajanidivasau
    lolayandvavivakshau kalah kalyo bhuvanaphalake kridati pranisharaih || 42|| adityasya gatagatairaharahah
    samkshiyate jivitam vyaparairbahukaryabharagurubhih kalo'pi na jnayate | drishtva janmajaravipattimaranam
    trasashca notpadyate pitva mohamayim pramadamadiramunmattabhutam jagat || 43|| ratrih saiva punah
    sa eva divaso matva mudha jantavo dhavantyudyaminastathaiva nibhritaprarabdhatattatkriyah | vyaparaih
    punaruktabhuta vishayairitthamvidhenamuna samsarena kadarthita vayamaho mohanna lajjamahe || 44||
    na dhyatam padamishvarasya vidhivatsamsaravicchittaye svargadvarakavatapatanapaturdharmo'pi noparjitah
    | nari pinapayodharoruyugalam svapne'pi nalingitam matuh kevalameva yauvanavanacchede kuthara vayam
    || 45|| nabhyasta prativadivrindadamani vidya vinitocita khadgagraih karikumbhapithadalanairnakam
    na nitam yashah | kantakomalapallavadhararasah pito na candrodaye tarunyam gatameva nishphalamaho
    shunyalaye dipavat || 46|| vidya nadhigata kalankarahita vittam ca noparjitam shushrushapi samahitena
    manasa pitrorna sampadita | alolayatalocanah priyatamah svapne'pi nalingitah kalo'yam parapindalolupataya
    kakairiva preryate || 47|| vayam yebhyo jatashciraparicita eva khalu te samam yaih samvriddhah smritivishayatam
    te'pi gamitah | idanimete smah pratidivasamasannapatana gatastulyavastham sikatilanaditiratarubhih
    || 48|| ayurvarshashatam nrinam parimitam ratrau tadardham gatam tasyardhasya parasya cardhamaparam
    balatvavriddhatvayoh | shesham vyadhiviyogaduhkhasahitam sevadibhirniyate jive varitarangacancalatare
    saukhyam kutah praninam || 49|| kshanam balo bhutva kshanamapi yuva kamarasikah kshanam vittairhinah
    kshanamapi ca sampurnavibhavah | jarajirnairangairnata iva valimanditatanuh narah samsarante vishati
    yamadhaniyavanikam || 50||
  devanagari: क्रीडाकाननकेलिकौतुकजुषामायुः परं क्षीयते ॥ १४॥ भिक्षाशनं तदपि नीरसमेकवारं शय्या च भूः परिजनो
    निजदेहमात्रम् । वस्त्रं विशीर्णशतखण्डमयी च कन्था हा हा तथापि विषया न परित्यजन्ति ॥ १५॥ स्तनौ मांसग्रन्थी
    कनककलशावित्युपमितौ मुखं श्लेष्मागारं तदपि च शशाङ्केन तुलितम् । स्रवन्मूत्रक्लीन्नं करिवरशिरस्पर्धि
    जघनं मुहुर्निन्द्यं रूपं कविजनविशेषैर्गुरु कृतम् ॥ १६॥ एको रागिषु राजते प्रियतमादेहार्धहारी हरो नीरागेषु
    जनो विमुक्तललनासङ्गो न यस्मात्परः । दुर्वारस्मरबाणपन्नगविषव्याविद्धमुग्धो जनः शेषः कामविडम्बितान्न
    विषयान्भोक्तुं न मोक्तुं क्षमः ॥ १७॥ अजानन्दाहात्म्यं पततु शलभस्तीव्रदहने स मीनोऽप्यज्ञानाद्वडिशयुतमश्नातु
    पिशितम् । विजानन्तोऽप्येते वयमिह विपज्जालजटिलान् न मुञ्चामः कामानहह गहनो मोहमहिमा ॥ १८॥ तृषा शुष्यत्यास्ये
    पिबति सलिलं शीतमधुरं क्षुधार्तः शाल्यान्नं कवलयति मांसादिकलितम् । प्रदीप्ते कामाग्नौ सुदृढतरमालिङ्गति
    वधूं प्रतीकारं व्याधेः सुखमिति विपर्यस्यति जनः ॥ १९॥ तुङ्गं वेश्म सुताः सतामभिमताः संख्यातिगाः सम्पदः
    कल्याणी दयिता वयश्च नवमित्यज्ञानमूढो जनः । मत्वा विश्वमनश्वरं निविशते संसारकारागृहे संदृश्य क्षणभंगुरं
    तदखिलं धन्यस्तु संन्यस्यति ॥ २०॥ याञ्चादैन्यदूषणम् । दीना दीनमुखैः सदैव शिशुकैराकृष्टजीर्णाम्बरा क्रोशद्भिः
    क्षुधितैर्निरन्नविधुरा दृश्या न चेद्गेहिनी । याञ्चाभङ्गभयेन गद्गदगलत्त्रुट्यद्विलीनाक्षरं को देहीति
    वदेत्स्वदग्धजठरस्यार्थे मनस्वी पुमान् ॥ २१॥ अभिमतमहामानग्रन्थिप्रभेदपटीयसी गुरुतरगुणग्रामाम्भोजस्फुटोज्ज्वलचन्द्रिका
    । विपुलविलसल्लज्जावल्लीवितानकुठारिका जठरपिठरी दुष्पूरेयं करोति विडम्बनम् ॥ २२॥ पुण्ये ग्रामे वने वा
    महति सितपटच्छन्नपालिं कपालिं ह्यादाय न्यायगर्भद्विजहुतहुतभुग्धूमधूम्रोपकण्ठे । द्वारं द्वारं प्रविष्टो
    वरमुदरदरीपूरणाय क्षुधार्तो मानी प्राणैः सनाथो न पुनरनुदिनं तुल्यकुल्येषु दीनः ॥ २३॥ गङ्गातरङ्गकणशीकरशीतलानि
    विद्याधराध्युषितचारुशिलातलानि । स्थानानि किं हिमवतः प्रलयं गतानि यत्सावमानपरपिण्डरता मनुष्याः ॥ २४॥
    किं कन्दाः कन्दरेभ्यः प्रलयमुपगता निर्झरा वा गिरिभ्यः प्रध्वस्ता वा तरुभ्यः सरसफलभृतो वल्कलिन्यश्च
    शाखाः । वीक्ष्यन्ते यन्मुखानि प्रसभमपगतप्रश्रयाणां खलानां दुःखाप्तस्वल्पवित्तस्मयपवनवशान्नर्तितभ्रूलतानि
    ॥ २५॥ पुण्यैर्मूलफलैस्तथा प्रणयिनीं वृत्तिं कुरुष्वाधुना भूशय्यां नवपल्लवैरकृपणैरुत्तिष्ठ यावो वनम्
    । क्षुद्राणामविवेकमूढमनसां यत्रेश्वराणां सदा वित्तव्याधिविकारविह्वलगिरां नामापि न श्रूयते ॥ २६॥ फलं
    स्वेच्छालभ्यं प्रतिवनमखेदं क्षितिरुहां पयः स्थाने स्थाने शिशिरमधुरं पुण्यसरिताम् । मृदुस्पर्शा शय्या
    सुललितलतापल्लवमयी सहन्ते सन्तापं तदपि धनिनां द्वारि कृपणाः ॥ २७॥ ये वर्तन्ते धनपतिपुरः प्रार्थनादुःखभाजो
    ये चाल्पत्वं दधति विषयाक्षेपपर्याप्तबुद्धेः । तेषामन्तःस्फुरितहसितं वासराणि स्मरेयं ध्यानच्छेदे शिखरिकुहरग्रावशय्यानिषण्णः
    ॥ २८॥ ये सन्तोषनिरन्तरप्रमुदितास्तेषां न भिन्ना मुदो ये त्वन्ये धनलुब्धसंकुलधियस्तेषां न तृष्णा हता
    । इत्थं कस्य कृते कृतः स विधिना कीदृक्पदं सम्पदां स्वात्मन्येव समाप्तहेममहिमा मेरुर्न मे रोचते ॥ २९॥
    भिक्षाहारमदैन्यमप्रतिसुखं भीतिच्छिदं सर्वतो दुर्मात्सर्यमदाभिमानमथनं दुःखौघविध्वंसनम् । सर्वत्रान्वहमप्रयत्नसुलभं
    साधुप्रियं पावनं शम्भोः सत्रमवार्यमक्षयनिधिं शंसन्ति योगीश्वराः ॥ ३०॥ भोगास्थैर्यवर्णनम् । भोगे रोगभयं
    कुले च्युतिभयं वित्ते नृपालाद्भयं माने दैन्यभयं बले रिपुभयं रूपे जराया भयम् । शास्त्रे वादिभयं गुणे
    खलभयं काये कृतान्ताद्भयं सर्वं वस्तु भयान्वितं भुवि नृणां वैराग्यमेवाभयम् ॥ ३१॥ आक्रान्तं मरणेन जन्म
    जरसा चात्युज्ज्वलं यौवनं सन्तोषो धनलिप्सया शमसुखं प्रौढाङ्गनाविभ्रमैः । लोकैर्मत्सरिभिर्गुणा वनभुवो
    व्यालैर्नृपा दुर्जनैः अस्थैर्येण विभूतयोऽप्युपहता ग्रस्तं न किं केन वा ॥ ३२॥ आधिव्याधिशतैर्जनस्य विविधैरारोग्यमुन्मूल्यते
    लक्ष्मीर्यत्र पतन्ति तत्र विवृतद्वारा इव व्यापदः । जातं जातमवश्यमाशु विवशं मृत्युः करोत्यात्मसात्
    तत्किं तेन निरङ्कुशेन विधिना यन्निर्मितं सुस्थिरम् ॥ ३३॥ भोगास्तुङ्गतरङ्गभङ्गतरलाः प्राणाः क्षणध्वंसिनः
    स्तोकान्येव दिनानि यौवनसुखस्फूर्तिः प्रियासु स्थिता । तत्संसारमसारमेव निखिलं बुद्ध्वा बुधा बोधकाः
    लोकानुग्रहपेशलेन मनसा यत्नः समाधीयताम् ॥ ३४॥ भोगा मेघवितानमध्यविलसत्सौदामिनीचञ्चला आयुर्वायुविघट्टिताब्जपटलीलीनाम्बुवद्भङ्गुरम्
    । लोला यौवनलालसास्तनुभृतामित्याकलय्य द्रुतं योगे धैर्यसमाधिसिद्धसुलभे बुद्धिं विधध्वं बुधाः ॥ ३५॥
    आयुः कल्लोललोलं कतिपयदिवसस्थायिनी यौवनश्रीः अर्थाः संकल्पकल्पा घनसमयतडिद्विभ्रमा भोगपूगाः । कण्ठाश्लेषोपगूढं
    तदपि च न चिरं यत्प्रियाभिः प्रणीतं ब्रह्मण्यासक्तचित्ता भवत भवभयाम्बोधिपारं तरीतुम् ॥ ३६॥ कृच्छ्रेणामेध्यमध्ये
    नियमिततनुभिः स्थीयते गर्भवासे कान्ताविश्लेषदुःखव्यतिकरविषमो यौवने चोपभोगः । वामाक्षीणामवज्ञाविहसितवसतिर्वृद्धभावोऽप्यसाधुः
    संसारे रे मनुष्या वदत यदि सुखं स्वल्पमप्यस्ति किंचित् ॥ ३७॥ व्याघ्रीव तिष्ठति जरा परितर्जयन्ती रोगाश्च
    शत्रव इव प्रहरन्ति देहम् । आयुः परिस्रवति भिन्नघटादिवाम्भो लोकस्तथाप्यहितमाचरतीति चित्रम् ॥ ३८॥ भोगा
    भङ्गुरवृत्तयो बहुविधास्तैरेव चायं भवः तत्कस्येह कृते परिभ्रमत रे लोकाः कृतं चेष्टितैः । आशापाशशतोपशान्तिविशदं
    चेतः समाधीयतां कामोत्पत्तिवशात्स्वधामनि यदि श्रद्धेयमस्मद्वचः ॥ ३९॥ ब्रह्मेन्द्रादिमरुद्गणांस्तृणकणान्यत्र
    स्थितो मन्यते यत्स्वादाद्विरसा भवन्ति विभवास्त्रैलोक्यराज्यादयः । भोगः कोऽपि स एक एव परमो नित्योदितो
    जृम्भते भो साधो क्षणभंगुरे तदितरे भोगे रतिं मा कृथाः ॥ ४०॥ कालमहिमानुवर्णनम् । सा रम्या नगरी महान्स
    नृपतिः सामन्तचक्रं च तत् पार्श्वे तस्य च सा विदग्धपरिषत्ताश्चन्द्रबिम्बाननाः । उद्वृत्तः स च राजपुत्रनिवहस्ते
    बन्दिनस्ताः कथाः सर्वं यस्य वशादगात्स्मृतिपथं कालाय तस्मै नमः ॥ ४१॥ यत्रानेकः क्वचिदपि गृहे तत्र तिष्ठत्यथैको
    यत्राप्येकस्तदनु बहवस्तत्र नैकोऽपि चान्ते । इत्थं नेयौ रजनिदिवसौ लोलयन्द्वाविवाक्षौ कालः कल्यो भुवनफलके
    क्रीडति प्राणिशारैः ॥ ४२॥ आदित्यस्य गतागतैरहरहः संक्षीयते जीवितं व्यापारैर्बहुकार्यभारगुरुभिः कालोऽपि
    न ज्ञायते । दृष्ट्वा जन्मजराविपत्तिमरणं त्रासश्च नोत्पद्यते पीत्वा मोहमयीं प्रमादमदिरामुन्मत्तभूतं
    जगत् ॥ ४३॥ रात्रिः सैव पुनः स एव दिवसो मत्वा मुधा जन्तवो धावन्त्युद्यमिनस्तथैव निभृतप्रारब्धतत्तत्क्रियाः
    । व्यापारैः पुनरुक्तभूत विषयैरित्थंविधेनामुना संसारेण कदर्थिता वयमहो मोहान्न लज्जामहे ॥ ४४॥ न ध्यातं
    पदमीश्वरस्य विधिवत्संसारविच्छित्तये स्वर्गद्वारकवाटपाटनपटुर्धर्मोऽपि नोपार्जितः । नारी पीनपयोधरोरुयुगलं
    स्वप्नेऽपि नालिङ्गितं मातुः केवलमेव यौवनवनच्छेदे कुठारा वयम् ॥ ४५॥ नाभ्यस्ता प्रतिवादिवृन्ददमनी विद्या
    विनीतोचिता खड्गाग्रैः करिकुम्भपीठदलनैर्नाकं न नीतं यशः । कान्ताकोमलपल्लवाधररसः पीतो न चन्द्रोदये तारुण्यं
    गतमेव निष्फलमहो शून्यालये दीपवत् ॥ ४६॥ विद्या नाधिगता कलङ्करहिता वित्तं च नोपार्जितं शुश्रूषापि समाहितेन
    मनसा पित्रोर्न सम्पादिता । आलोलायतलोचनाः प्रियतमाः स्वप्नेऽपि नालिङ्गिताः कालोऽयं परपिण्डलोलुपतया
    काकैरिव प्रेर्यते ॥ ४७॥ वयं येभ्यो जाताश्चिरपरिचिता एव खलु ते समं यैः संवृद्धाः स्मृतिविषयतां तेऽपि
    गमिताः । इदानीमेते स्मः प्रतिदिवसमासन्नपतना गतास्तुल्यावस्थां सिकतिलनदीतीरतरुभिः ॥ ४८॥ आयुर्वर्षशतं
    नृणां परिमितं रात्रौ तदर्धं गतं तस्यार्धस्य परस्य चार्धमपरं बालत्ववृद्धत्वयोः । शेषं व्याधिवियोगदुःखसहितं
    सेवादिभिर्नीयते जीवे वारितरङ्गचञ्चलतरे सौख्यं कुतः प्राणिनाम् ॥ ४९॥ क्षणं बालो भूत्वा क्षणमपि युवा
    कामरसिकः क्षणं वित्तैर्हीनः क्षणमपि च सम्पूर्णविभवः । जराजीर्णैरङ्गैर्नट इव वलीमण्डिततनुः नरः संसारान्ते
    विशति यमधानीयवनिकाम् ॥ ५०॥
