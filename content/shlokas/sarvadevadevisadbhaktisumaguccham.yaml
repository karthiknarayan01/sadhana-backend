id: sarvadevadevisadbhaktisumaguccham
category: shataka
name:
  english: sarvadevadevisadbhaktisumaguccham
  devanagari: सर्वदेवदेवीसद्भक्तिसुमगुच्छम्
content:
  english: vagvirajini antaryamini adhyatmika adhibhautika adhidaivikarupini samasta vidyaloke sancarini
    || 4|| sujnanaishvarya sampradayini divya bhavoddipana mudakarini sadbhaktodyana kalpatarurupini gitasudhaharshini
    vinapani || 5|| 13 lakshmidevi gitam pancabana janakapriye vijaye prasida mama bhaktashraye || pallavi||
    madhava padaseva tatpare vedavetta modapramodadhare shamadamadi shatsampadakarini vaikunthalokeshvara
    bhamini || 1|| sadacara sampanna samrakshini vyasanalola jana parivartini sadhusevanirata kripasagari
    yajnashesha priya shritabhayakari || 2|| saddharmapalaka sujana shreyaskari satkarma lina dinajana
    sampatkari nityanandakari tribhuvanasundari shrinkara bijakshari gitasudhakari || 3|| 14 lakshmi gitam
    shri vishnuvallabhe shubhe palaya mam bhaktasulabhe divyaprabhe poshaya mam || pallavi|| vaikunthadhishvari
    arunambari saundaryaratnakari bhuvananandakari saubhagyadayini gitasudhasvadini kripavarshini ashtalakshmirupini
    || 1|| saroruhagandhini saroruha locani sarvakleshadurini karunya pushkarini shokamohanashini nakasrishtikarini
    daridryadhvamsini punyaphaladayini || 2|| 15 sarasvati gitam shlokam shri sarasvatim mayuravahinim
    shvetavastranvitam shvetapadmasanam japamala pustakahastam gitasudhanutam abhayam akshayam aharnisham
    upasmahe vidyadayini sharade cirasukhakarini varade || pallavi|| kamarupini pataka nashini kamala
    locani kamalaja rani kacchapi vinapani kalyani sangita sahitya sudhavarshini || 1|| jnanavijnana tripti
    dayini avidya varidhi tarini sakalashastra vicara ratnakari sakalakala rasike jnaneshvari || 2|| 16
    sarasvati gitam manikya vina pani madhurya rasavahini || pallavi|| sakala kalasvadini kalyani sakala
    vidyasvamini girvani sakala shastra sancarini ranjani sakalantaryamini niranjani || 1|| sakala samvedanajnanarupini
    vikalatma pavani gitasudha toshini malina mano vritti nirodhini nalinidalamambuvat samrakshini ||
    2|| sarigama padani saptasvararagini svara vyanjana ratnamala shobhini pranavanada valayantarvyapini
    sarvakshara diptiprasarini || 3|| 17 vasavi gitam shri vasavidevi tvameva srishtishaktih shri devadevi
    tvameva palanashaktih shri paradevi tvameva samhara shaktih namaste namaste namaste || pallavi|| penugonda
    pratishthita divya vanitamani parashaktyavatarini vasavi kripavikshani virupaksha priyasodari bhavatarini
    kusumamba kusumakhyanandini ranjani || 1|| dharmarahasya pradipini janani dharmadhvajarohana prollasini
    suguna navaratna malasamyojani sarasa carana sushobhini pavani || 2|| ahimsodyama sancalini tyagavrata
    palini atmabalidana rata vaishyakula pathadarshini | viradrupa pradarshini gitasudha vahini ardrahridaya
    pushkarini kavipungava varadayini || 3|| 18 lalita gitam shricakra simhasanadhishvari shrividyopasaka
    shubhankari || pallavi|| sumerumadhya prasadasthite surataru suradhenu suraganashrite dhishakti manoshakti
    tanushakti vriddhastute dharadhisha yogisha nute shrilalite || 1|| mantra tantra yantra balavyapini
    | deva daitya krita tapahsamadarshini bhakta parirakshini gitasudha modini caracara svamini sadyomuktidayini
    || 2|| 19 vani gitam he lalitakala svarajya sthapini he lekhana vacana nandana viharini || pallavi||
    satya pratipadana pushkarini vani samasta jivakula bhashantaryamini sarva jivakula bhavantarvahini
    nada gagana sancarini shraddham bhaktim dehi me || 1|| satyalokavasini shvetahamsavahini sarva vidha
    shastra viradrupini sarva cittavritti nirodhakarini shubhra vastradharini shraddha bhaktim dehi me
    || 2|| rajasa tamasa bhava kalushanivarini raga tana pallavi shikhararohini paramanasa shastra vibhedini
    gitasudha toshini shraddha bhaktim dehi me || 3|| 20 vagdevi gitam madhura vagvilasa ranjanim madhura
    bhavameghayana toshinim smarami satatam dhyayami anavaratam || pallavi|| sangita samrajya palanakarim
    sahitya svarajya spapanakarim anyatha grahanaharam shvetambaram agrahanapaharana caturam smarami satatam
    dhyayami anavaratam || 1|| sarasijodbhava satim sarasvatim sarasavatim rasavatim ratim vidyashrayam
    satyalayam vikshipta citta shubhodayam smarami satatam dhyayami anavaratam || 2|| 21 parvati gitam
    caturveda samrajni raksha mam caturdasha bhuvana janani samraksha mam || pallavi|| saccidanandarupini
    niranjani nitya shuddha buddha muktarupini deva vyuha rakshini daityagana dhvamsini dhairyasthairya
    dayini gitasudharanjani || 1|| himagiri nandini harapriyaramani pandita pamara puja pramodini kesarivahani
    kalimalavidurini satkarma sadbhava saushilyatoshini || 2|| bhaktibhava madhurya prollasini shodasharcanakainkarya
    varadayini kailasavasini kumatiharini shivagana nartana gayanahladini || 3|| 22 dakshinamurti gitam
    rajayoga cakravarti kripaya mamava dakshinamurti gurumurti mamava || pallavi|| matanga carmambara
    he shankara bhasmangaragadhara trishuladhara kailaseshvara gaurimanohara jatajutadhara papadahanakara
    || 1|| adbhutagatra he paramapavitra madanantaka he lalata netra shanmukha gajamukha lilavihara pannagahara
    shishyoddhara || 2|| brahmatatva pratipadako'si advaitanubhava prasarako'si sarvatra mam kuru yogayuktam
    prasannatma kuru mam nijabhaktam || 3|| 23 lakshmi gitam vaikuntha nilaye vatsalyahridaye pahi mam
    dugdhasagara tanaye || pallavi|| vishnu manohari candrasahodari satyanandakari sadabhayakari kamalakusumahaste
    raktambari kamalasanasthite vishvambhari || 1|| mahimatishaya rupa lavanyavati kantivati shantimati
    rati sumati lokamate gitasudhacandrike abhishtadate anumahaddipike || 2|| jadalakshmi rupena dravyarashivyapini
    cetanalakshmi tvam jivakotijanani ashtalakshmirupini sarvashaktiprade rishindra munindra pujye muktiprade
    || 3|| 24 shivagitam samadhi valmike shiva paramananda mam yogastham kuru nijananda || pallavi|| navabhava
    nayanashru sangame tvam hridayakashe katham pashyami bahujanma kritayoga phalaprada kuru mam tapopriyam
    acaryendra || 1|| karunya sagara tyagi yogi viragi hara jnanagangadhara pranava gitasudhakara om namashshivaya
    iti pancaksharah tava divyamantrah tava yaugika tantrah || 2|| 25 madhava gitam dedipyamana jyotisvarupa
    dhyanadarshita sagunasvarupa || pallavi|| veda srishtikarana shri madhava vedamantra shaktiprada shri
    keshava samyagjivana prada shridhara samyagdarshana karana shrikara || 1|| dharmakshetra parirakshanartham
    karmakshetra samvidhanartham yugayuge tvam martyaloke divya manushim tanumashritah || 2|| gitacarya
    he jivahitakara gitamrita lola venuganacatura he vishvaguru sharanagatoddhara prasida prasida kripasagara
    || 3|| 26 muralidhara gitam bhuvanaika sammohanakaram shirasa namami muralidharam || pallavi|| devaki
    vasudeva priya kishoram yashodananda cittapaharam kalushyaduram vishvadharam karunyapuram vishvakaram
    || 1|| tulasimaladharam jiveshvaram sakhavrinda nayakam navanitacoram rasalilalolam jnaneshvaram gitasudhalolam
    yogeshvaram || 2|| 27 gopala gitam govardhana giridhara gopala trahi mam ashtadikpalaka palaka ||
    pallavi|| nilameghashyama vaikunthadhama shri vishnumurti purushottama variruha shankha cakra gadhadhara
    sheshatalpa shayana pitambaradhara || 1|| vishva srijana palana laya karana vainateya gamana shridevi
    ramana tattvadarshi nirguna sukshmadarshi cidghana gunadarshi gunatita gitasudha ranjana || 2|| 28
    shrirama gitam shri ramacandra vatsalyasandra raghukula piyushasagara candra || pallavi|| dharasuta
    vallbha raviprabha sugunaishvarya bhiksham dehi gambhirasvabhava sarvatmabhava dasharatha pranapriya
    inakulodbhava || 1|| nityasamipavarti marutisevya sarvam ramamayamityanubhavavedya navavidha bhaktopasya
    kodandadhara ayodhya sarvabhauma lankadhishahara || 2|| janakavacana paripalakarama janakanandini
    saumitri sameta vipinavase sukhaduhkha samadarshi gitasudhashraya he satyadarshi || 3|| 29 shridhara
    gitam kshirabdhi sukumari manohara kshirambonidhi mathanadhara || pallavi|| sarvakarana sundara shantakara
    sarvajiveshvara lokoddhara samasta caracara svarupadhara trimurti rupa sadguru damodara || 1|| dharmakshetra
    sancara sujanamandara vedajnanasara shridhara mudakara asurasamhara gunagambhira pranamamyaham tvam
    gitasudhakara || 2|| 30 vasudeva gitam damodaram rukmini manoharam bhavayami vasudeva sukumaram ||
    pallavi|| sahasraradri yogisaddarshitam cidguhantarnivasitam smitam sahasra koti bhanuprakasham sadhusanta
    sadbhakta hridayesham || 1|| yadavakulesham shubhadayakam vaikunthadhamesham dinoddharakam daivashikhamanim
    prajnacintamanim dharmakarma marmajnasudhimanim || 2|| shyamala shariram matula kamsaharam vyakula
    citta pandavoddharam gitasudhakaram venuganacaturam gitamrita dogdham mohapaharam || 3|| 31 varalakshmi
    gitam mallika campaka sevantika malikalankrita haripadasevika || pallavi|| bhaktadhenuka kripacandrika
    samrakshayatu mam bhavataraka samriddhivatika samposhini sarvasiddhikarini gitasudhavani || 1|| sugandhamaya
    saroruhadharini sukomalaruna hastashobhini shrivaralakshmi vaikunthasvamini kshirabdhimathane janmadharini
    || 2|| shuka shaunaka tumburu naradadi muni yogi gana sankirtita siddha sadhya yaksha kinnara kimparusha
    gandharva devasura vrindasevita || 3|| 32 gauri gitam caturdasha bhuvana janani namaste kailasavasini
    gauri namaste || pallavi|| tandava priya parashivasahite lasyapriye jivapatramudite prakritipurusha
    sangamabalena tvam vishvapalini vishvarakshini || 1|| gajavadana shadvadana dhibala praharshini trishuladharini
    trinetrabhamini bhringi nandyadi shivaganavinute stotrasamprite gitasudhashrite || 2|| 33 keshava
    gitam sanatana dharmasarathim smara kshirasagara rajasutapatim smara || pallavi|| karanavyuham samyamya
    pratidinam kayarathe smara atmanam rathinam sudushkara manogatim niyamya keshava caranabje mana adhatsva
    || 2|| shishtajana parirakshakam dushtajana shikshakam vishishta yogarthi parivartakam jivaniyamakam
    jaganniyantrakam jagadoddharakam smara gitasudharakshakam || 2|| 34 vishnu gitam vande'ham shri mahavishnum
    jishnum prabhavishnum grasishnum || pallavi|| vande saroruhanabham antarmukha sulabham shyamalaprabham
    shri satyanarayanam nalinalocanam hridayakarshanam vande nagakuladhisha shayanam || 1|| mahimanvita
    sudarshana cakradharam atishaya balapurna gadhadharam gitasudhapavanam saccarita bhayaharanam dhyana
    gana yoga yatra toshanam || 2|| 35 sarasvati gitam sharade varade mam jyotirgamaya shvetahamsagamini
    supathe gamaya || pallavi|| nirakshira vivekam prayaccha kaladevi atmasukham prayaccha japamala pustakadharini
    vani vidyasampadbalam me yaccha || 1|| nadasurange prajnam sthapayasi svara tarange rasaloke viharasi
    aksharantarange bhavalasyam karoshi | akshaya gitasudhasarita priyo'si || 2|| 36 dakshinamurti gitam
    he dakshina murti bodhaya mam he jnanavijnana murti preraya mam || pallavi|| rajayoga vidya rahasyam
    vishvadigurumurti tvaya jnatam he jnanavriddha bhavarogavaidya sarvaguruvandya rishimunivedya || 1||
    he jivadhara jivanadhara vedavedanta sara nigamagocara janana marana taranacatura sarvada dhyanastha
    yogabhaskara || 2|| 37 shrikrishna gitam anyatha sharanam nasti shrinidhi payonidhivasa kripanidhi
    || pallavi|| akshayambaraprada yaduvamshatilaka pandava ramani manasamrakshaka shodasha sahasra gopikavimocaka
    shodasha kalapurna kubja vanitoddharaka || 1|| devaki vasudeva tyagayogashraya radha rukmini premayogamodashraya
    venuganapriya akshayavyaya gitabodhaka gitasudhapriya 38 sarasvati gitam shubhankari abhayankari vinapani
    srishtikarma samlagna brahmaramani || pallavi|| ajnata vasa sthita samskaran sujnata vidhanena niyantrasi
    vidhavidha spandana vijnana candrike tvameva jnanaprade prajnadipike || 1|| vagdosha varini lokamaitri
    rakshini sarvakshara malini abhivyaktikarini sangharshasamaye supathadarshini samprapti samaye yashokirti
    dayini || 2|| sarva spandana madhurya praharshini nritya gana sahitya kshetraposhini citra shilpa
    vaibhava saundaryamayi japamaladharini gitasudhamayi || 3|| 39 rajarajeshvari gitam tribhuvanollasini
    mam pahi trideha sancalini jnanam dehi || pallavi|| shriraja rajeshvari bhaktide shrimatsimhasanasine
    muktide shrimate jadacetanatmike shriyute saguna nirgunatmike || 1|| parapara vidyaprakashini gitasudhavani
    simhavahanayute shrihari caturasya gajasyapita nute raktabijasurmardanamudite daityamardini || 2||
    40 shrihari gitam lilamanusha vigraha shrihari lakshmiramana prasida murari || pallavi|| vishvasvamyam
    tavaiva sarvada jivasamyam tvayyaiva govinda tava samakshamatanubhave mama prajnam pratishtapaya sukhadhama
    || 1|| sanaka sanandanadi rishisevita dhriva prahlada vibhishanadyarcita saphala japayogadhyeya gitasudhakara
    shankhacakradhara dharanipriyakara || 2|| 41 parvati gitam bhagavatim balavatim parvatim smaramyaham
    dhimatim shrimatim shashvatim bhajamyaham || pallavi|| dharmavatim dayavatim haimavatim hamsavatim
    sumukha skandha sampujita shivasatim smaramyaham || 1|| nitimatim kantimatim manavatim bhanumatim
    anupama lavanyavatim hrimatim smaramyaham || 2|| rasavatim sarasavatim madhumatim shantivatim gitasudhashritam
    ratim gunavatim smaramyaham || 3|| 42 vighnaraja gitam vighnarajam sumatipradayakam pranamami sada
    matangamukham || pallavi|| navaratna kirita virajitam bhujaga bhujakirti shobhitam mushakagamanam
    modakaram pranamami duritarashiharam || 1|| prathamaradhitam girijashivasutam lalate pranavatilaka
    rajitam siddhi buddhipradam gitasudhanutam pranamami kumarakridasahitam || 2|| 43 sarasvati gitam
    nadasagare saptasvara tarangini bhashantargamini sarvaksharakarini || pallavi|| vidyaprade sharade
    varade sarvapadartha jnanavijnanade srishtikarta bhamini jnanam dehi satyaloka svamini mam paripahi
    || 1|| jivantarange shashvatavasini jivanatarange taratamavivecani mudhatvadurini bhavabhiti harini
    gitasudhavani satyaprakashini || 2|| 44 parvati gitam anupama lavanyapurne girisute aparimita shaktiyute
    skandamate || pallavi|| siddhishaktirupini sarvasiddhikarini tapasvini tejasvini gitasudhavani adbhuta
    dikshavrate dakshanandini ardhanarishvara paramapriyaramani || 1|| svahastarupita gajamukha janani
    svadharmanishtha shighroddharini daivasura sangrame shishtarakshini ganganubandhe sneharagaharshini
    || 2|| 45 lakshmi gitam sadbhakti madhusvadapriye sahridaye sindhura tilaka shobhite haripriye ||
    pallavi|| sarvabhoga satyayoga pradayini sarvakala hasini sarojalocani sampatpradayini hrasadurini
    mahalakshmi sadaye gitasudhamodini || 1|| sarvabharana sundari modakari pavanakari saundarya ratnakari
    bhuvaneshvari sancita karmarashi dahanakari samraksha mam sada nityabhayakari || 2|| 46 rajarajeshvari
    gitam shrimate rajarajeshvari shri lalite bhuvanaikadhishvari || pallavi|| satya shiva sundararupini
    palaya satya jnananantarupini taraya iha para saukhyarthamaham varam varam ikshucapadhari tvam pranamamyaham
    || 1|| janma mrityu vritte bhramati mama jivah tanmayakara vishayajale bandhito'smi avidya guhe katham
    pashyami prakasham aradhaka pavani gitasudha tarini || 2|| 47 shri lalita gitam shri vidyaradhye divyashaktishvari
    shri cakranilaye bhavya jagadishvari || pallavi|| paraprakritirupe jnanaprasadini apara prakritirupe
    jivabhavadayini shadvikaramaya dehabhavaharini savyapatha calini mokshasukhadayini || 1|| divija karya
    samudbhute shri lalite dipti lavanya samanvite pahi mam rajiva locani gitasudhavahini pancavishaya
    sakshini prajnaprabodini || 2|| 48 maruti gitam vande sudhivaram dhiravaram anjanadevi priyakumaram
    || pallavi|| janakirama seva nishtha dutam gaganayana samartham pranitam yogasiddhishvaram mahasantam
    vanaresham aparimita balavantam || 1|| lankesha garvaharam bhaktipurnam divijavrinda ganadatta divyashaktipurnam
    setunirmane gitasudhashritam sarvada ramanama smarananiratam || 2|| 49 narayana gitam madhusudana
    jagadollasa karana punarapi punarapyashrayami || pallavi|| shrimannarayana mokshasadana shri lakshmiramana
    jivapradana kamalapatra nayana nalinacarana shrirangadhameshvara shashivadana || 1|| matsya kurma
    varaha narasimha vamana parashurama rama krishna buddha kalki ityashcaryamaya dashavatareshu dharmaprabhakara
    he gitasudhashrita || 2|| 50 anjaneya gitam surucira bhaktigana vidyadhara vayudevanandana bhaktim
    dehi || pallavi|| sankatamocana bhitiharana ramanamajape vilina prana devendradi divijagana sannuta
    anima mahima siddhishakti samyuta || 1|| shivamsha sambhuta bhaktagresara gitasudhanuta asurabhayankara
    trimurti varadana patra gunavanta vanaravira divyagatra dhimanta || 2|| 51 anjaneya gitam bhagavata
    shiromani mam pahi shri anjaneya sadbhaktim dehi || pallavi|| shriramabhakta sarvabhauma shrimata
    sitanveshana catura sanjivini parvatadhara shubhakara samyagseva parayana dhivara || 1|| balyavasthe
    bahulilavinoda praudhavasthe atimanusha pratapa divijadaityatita shaktisamyukta gitasudhanirata ciranjivi
    mukta || 2|| 52 gashesha gitam ekadantam prathamaradhitam bhavayamyaham shrigananatham || pallavi||
    muladharasthitam vighnesham modakahastam sudhisham gunesham sahasra bhanuprakasham vishesham pashankushadharam
    patakanasham || 1|| para pashyanti madhyama vaikhari catvari vagatmakam gajamukham gitasudhakaram
    vidyadhishvaram shivakumaram kartikeya sodaram || 2|| 53 kartikeya gitam kartikeya vighnarajapriya
    devasainyadhipa gangatanaya| || pallavi|| uma maheshasuta divyaprabha valli devasena priyavallabha
    tarakasura samharaka satsantana vara pradayaka || 1|| gurumurti svarupa sundaramukha shanmukha palani
    kshetresha krittikaradhaka mayuravahana gitasudhavana prajnapurna dehi sujnanam || 2|| bala subrahmanya
    vidvatpurna velayudhadhara tejo purna mama suprasanno bhava jnanapurna vyadhihara bhavavyadhihara
    paripurna || 3|| 54 shrirama gitam niratishaya gunasagaracandra vande'ham shriramacanda || pallavi||
    vishnumurti vishvadideva dharmamurti karunyabhava maryada purushottama rama sanatana santapriya raghurama
    || 1|| ayodhyanagara prajasukha karana sumitrasutanukshana sevanakarana bharata shatrighnadi sodarasampujya
    sitamanohara gitasudharadhya || 2|| 55 gauri gitam shvetashailapati priyanandini shuklambaradhara
    ganesha janani || pallavi|| krittika poshita skanda ranjini kailasavasini gauri avatu mam shadvairi
    damani shadcakravasini shadaishvarya shalini avatu mam || 1|| suvasini sampujya kundalini samprita
    bhavatu gitasudhavani dharmaglani karaka daityamardini satkarmarata samrakshini avatu mam || 2|| 56
    ganesha gitam manasa smarami pashupatitanayam gananatham sadayam mahimatishayam || pallavi|| kotidinakara
    prakasham pavanacaranam bhalacandram mahodaram gajananam prathamarcana muditam bhavabhiti haranam
    | bhaktya karomi modakanivedanam || 1|| vakratundam lambodaram dhishaktipradam mangalakaram gajakarnakam
    shanmukhagrajam gitasudhakaram vighnarajam || 2|| 57 vasavi gitam shodashi vasavi atiloka kantivati
    hridayaguhantare dhyayami bhagavati || pallavi|| balyakrida lila vilasini kavya natya sangita sammodini
    rasa bhava vicara samyogadhyeye pratikshanam bhavayami nirmaye || 1|| prasanna manodiptim prasaraya
    mam sarvada sumedha jyotirgamaya dhairya sthairyadi sampadan prasadaya kritva mama sarathyam amritam
    gamaya || 2|| sarva shaktidharini brahmavishnu shivajanani sarvajiva dehayatra vidhayini sarvabhava
    kriya nishcaya pravartini gitasudhavani vishvarupa pradarshini || 3|| 58 candramauleshvara gitam candramauleshvara
    ardhanarishvara jivarahasyam prabodhaya smarahara || pallavi|| samasta brahmanda prabhava sthiti laya
  devanagari: वाग्विराजिनि अन्तर्यामिनि आध्यात्मिक आधिभौतिक आधिदैविकरूपिणि समस्त विद्यालोके सञ्चारिणि
    ॥ ४॥ सुज्ञानैश्वर्य सम्प्रदायिनि दिव्य भावोद्दीपन मुदकारिणि सद्भक्तोद्यान कल्पतरुरूपिणि गीतसुधाहर्षिणि
    वीणापाणि ॥ ५॥ १३ लक्ष्मीदेवी गीतम् पञ्चबाण जनकप्रिये विजये प्रसीद मम भक्ताश्रये ॥ पल्लवि॥ माधव पादसेवा
    तत्परे वेदवेत्त मोदप्रमोदाधारे शमदमादि षट्सम्पदकारिणि वैकुण्ठलोकेश्वर भामिनि ॥ १॥ सदाचार सम्पन्न संरक्षिणि
    व्यसनलोल जन परिवर्तिनि साधुसेवानिरत कृपासागरि यज्ञशेष प्रिय श्रिताभयकरि ॥ २॥ सद्धर्मपालक सुजन श्रेयस्करि
    सत्कर्म लीन दीनजन सम्पत्करि नित्यानन्दकरि त्रिभुवनसुन्दरि श्रीङ्कार बीजाक्षरि गीतसुधाकरि ॥ ३॥ १४ लक्ष्मी
    गीतम् श्री विष्णुवल्लभे शुभे पालय मां भक्तसुलभे दिव्यप्रभे पोषय माम् ॥ पल्लवि॥ वैकुण्ठाधीश्वरि अरुणाम्बरि
    सौन्दर्यरत्नाकरि भुवनानन्दकरि सौभाग्यदायिनि गीतसुधास्वादिनि कृपावर्षिणि अष्टलक्ष्मिरूपिणि ॥ १॥ सरोरुहगन्धिनि
    सरोरुह लोचनि सर्वक्लेशदूरिणि कारुण्य पुष्करिणि शोकमोहनाशिनि नाकसृष्टिकारिणि दारिद्र्यध्वंसिनि पुण्यफलदायिनि
    ॥ २॥ १५ सरस्वती गीतम् श्लोकम् श्री सरस्वतीं मयूरवाहिनीं श्वेतवस्त्रान्वितां श्वेतपद्मासनां जपमाला
    पुस्तकहस्तां गीतसुधानुतां अभयां अक्षयां अहर्निशं उपास्महे विद्यादायिनि शारदे चिरसुखकारिणि वरदे ॥ पल्लवि॥
    कामरूपिणि पातक नाशिनि कमल लोचनि कमलज राणि कच्छपि वीणापाणि कल्याणि सङ्गीत साहित्य सुधावर्षिणि ॥ १॥
    ज्ञानविज्ञान तृप्ति दायिनि अविद्या वारिधि तारिणि सकलशास्त्र विचार रत्नाकरि सकलकला रसिके ज्ञानेश्वरि
    ॥ २॥ १६ सरस्वती गीतम् माणिक्य वीणा पाणि माधुर्य रसवाहिनी ॥ पल्लवि॥ सकल कलास्वादिनि कल्याणि सकल विद्यास्वामिनि
    गीर्वाणि सकल शास्त्र सञ्चारिणि रञ्जनि सकलान्तर्यामिनि निरञ्जनि ॥ १॥ सकल संवेदनाज्ञानरूपिणि विकलात्म
    पावनि गीतसुधा तोषिणि मलिन मनो वृत्ति निरोधिनि नलिनीदलमम्बुवत् संरक्षिणि ॥ २॥ सरिगम पदनि सप्तस्वररागिणि
    स्वर व्यञ्जन रत्नमाला शोभिनि प्रणवनाद वलयान्तर्व्यापिनि सर्वाक्षर दीप्तिप्रसारिणि ॥ ३॥ १७ वासवी गीतम्
    श्री वासवीदेवि त्वमेव सृष्टिशक्तिः श्री देवदेवि त्वमेव पालनशक्तिः श्री परदेवि त्वमेव संहार शक्तिः
    नमस्ते नमस्ते नमस्ते ॥ पल्लवि॥ पेनुगोण्ड प्रतिष्ठित दिव्य वनितामणि पराशक्त्यवतारिणि वासवि कृपावीक्षणि
    विरूपाक्ष प्रियसोदरि भवतारिणि कुसुमाम्ब कुसुमाख्यनन्दिनि रञ्जनि ॥ १॥ धर्मरहस्य प्रदीपिनि जननि धर्मध्वजारोहण
    प्रोल्लासिनि सुगुण नवरत्न मालासंयोजनि सारस चरण सुशोभिनि पावनि ॥ २॥ अहिंसोद्यम सञ्चालिनि त्यागव्रत
    पालिनि आत्मबलिदान रत वैश्यकुल पथदर्शिनि । विराड्रूप प्रदर्शिनि गीतसुधा वाहिनि आर्द्रहृदय पुष्करिणि
    कविपुङ्गव वरदायिनि ॥ ३॥ १८ ललिता गीतम् श्रीचक्र सिंहासनाधीश्वरि श्रीविद्योपासक शुभङ्करि ॥ पल्लवि॥
    सुमेरूमध्य प्रासादस्थिते सुरतरु सुरधेनु सुरगणाश्रिते धीशक्ति मनोशक्ति तनुशक्ति वृद्धस्तुते धराधीश
    योगीश नुते श्रीललिते ॥ १॥ मन्त्र तन्त्र यन्त्र बलव्यापिनि । देव दैत्य कृत तपःसमदर्शिनि भक्त परिरक्षिणि
    गीतसुधा मोदिनि चराचर स्वामिनि सद्योमुक्तिदयिनि ॥ २॥ १९ वाणी गीतम् हे ललितकला स्वाराज्य स्थापिनि हे
    लेखन वाचन नन्दन विहारिणि ॥ पल्लवि॥ सत्य प्रतिपादना पुष्करिणि वाणि समस्त जीवकुल भाषान्तर्यामिनि सर्व
    जीवकुल भावान्तर्वाहिनि नाद गगन सञ्चारिणि श्रद्धां भक्तिं देहि मे ॥ १॥ सत्यलोकवासिनि श्वेतहंसवाहिनि
    सर्व विध शास्त्र विराड्रूपिणि सर्व चित्तवृत्ति निरोधकारिणि शुभ्र वस्त्रधारिणि श्रद्धा भक्तिं देहि
    मे ॥ २॥ राजस तामस भाव कलुषनिवारिणि राग तान पल्लवि शिखरारोहिणि परामानस शास्त्र विभेदिनि गीतसुधा तोषिणि
    श्रद्धा भक्तिं देहि मे ॥ ३॥ २० वाग्देवी गीतम् मधुर वाग्विलास रञ्जनीं मधुर भावमेघयान तोषिणीं स्मरामि
    सततं ध्यायामि अनवरतम् ॥ पल्लवि॥ सङ्गीत साम्राज्य पालनकरीं साहित्य स्वाराज्य स्पापनकरीं अन्यथा ग्रहणहरां
    श्वेताम्बरां अग्रहणापहरण चतुरां स्मरामि सततं ध्यायामि अनवरतम् ॥ १॥ सरसिजोद्भव सतीं सरस्वतीं सरसवतीं
    रसवतीं रतीं विद्याश्रयां सत्यालयां विक्षिप्त चित्त शुभोदयां स्मरामि सततं ध्यायामि अनवरतम् ॥ २॥ २१
    पर्वती गीतम् चतुर्वेद साम्राज्ञि रक्ष मां चतुर्दश भुवन जननि संरक्ष माम् ॥ पल्लवि॥ सच्चिदानन्दरूपिणि
    निरञ्जनि नित्य शुद्ध बुद्ध मुक्तरूपिणि देव व्यूह रक्षिणि दैत्यगण ध्वंसिनि धैर्यस्थैर्य दायिनि गीतसुधारञ्जनि
    ॥ १॥ हिमगिरि नन्दिनि हरप्रियरमणि पण्डित पामर पूजा प्रमोदिनि केसरिवाहनि कलिमलविदूरिणी सत्कर्म सद्भाव
    सौशील्यतोषिणि ॥ २॥ भक्तिभाव माधुर्य प्रोल्लासिनि षोडशार्चनाकैङ्कर्य वरदायिनि कैलासवासिनि कुमतिहारिणि
    शिवगण नर्तन गायनाह्लादिनि ॥ ३॥ २२ दक्षिणामूर्ति गीतम् राजयोग चक्रवर्ति कृपया मामव दक्षिणामूर्ति गुरुमूर्ति
    मामव ॥ पल्लवि॥ मातङ्ग चर्माम्बर हे शङ्कर भस्माङ्गरागधर त्रिशूलधर कैलासेश्वर गौरीमनोहर जटाजूटधर पापदहनकर
    ॥ १॥ अद्भुतगात्र हे परमपवित्र मदनान्तक हे ललाट नेत्र षण्मुख गजमुख लीलाविहार पन्नगहार शिष्योद्धार ॥
    २॥ ब्रह्मतत्व प्रतिपादकोऽसि अद्वैतानुभव प्रसारकोऽसि सर्वत्र मां कुरु योगयुक्तं प्रसन्नात्मा कुरु मां
    निजभक्तम् ॥ ३॥ २३ लक्ष्मी गीतम् वैकुण्ठ निलये वात्सल्यहृदये पाहि मां दुग्धसागर तनये ॥ पल्लवि॥ विष्णु
    मनोहरि चन्द्रसहोदरि सत्यानन्दकरि सदाभयकरि कमलकुसुमहस्ते रक्ताम्बरि कमलासनस्थिते विश्वम्भरि ॥ १॥ महिमातिशय
    रूप लावण्यवति कान्तिवति शान्तिमति रति सुमति लोकमाते गीतसुधाचन्द्रिके अभीष्टदाते अणुमहद्दीपिके ॥ २॥
    जडलक्ष्मि रूपेण द्रव्यराशिव्यापिनि चेतनलक्ष्मि त्वं जीवकोटिजननि अष्टलक्ष्मिरूपिणि सर्वशक्तिप्रदे ऋषीन्द्र
    मुनीन्द्र पूज्ये मुक्तिप्रदे ॥ ३॥ २४ शिवगीतम् समाधि वल्मीके शिव परमानन्द मां योगस्थं कुरु निजानन्द
    ॥ पल्लवि॥ नवभाव नयनाश्रु सङ्गमे त्वां हृदयाकाशे कथं पश्यामि बहुजन्म कृतयोग फलप्रद कुरु मां तपोप्रियं
    आचार्येन्द्र ॥ १॥ कारुण्य सागर त्यागि योगि विरागि हर ज्ञानगङ्गाधर प्रणव गीतसुधाकर ॐ नमश्शिवाय इति
    पञ्चाक्षराः तव दिव्यमन्त्राः तव यौगिक तन्त्राः ॥ २॥ २५ माधव गीतम् देदीप्यमान ज्योतिस्वरूप ध्यानदर्शित
    सगुणस्वरूप ॥ पल्लवि॥ वेद सृष्टिकारण श्री माधव वेदमन्त्र शक्तिप्रद श्री केशव सम्यग्जीवन प्रद श्रीधर
    सम्यग्दर्शन कारण श्रीकर ॥ १॥ धर्मक्षेत्र परिरक्षणार्थं कर्मक्षेत्र संविधानार्थं युगयुगे त्वं मर्त्यलोके
    दिव्य मानुषीम् तनुमाश्रितः ॥ २॥ गीताचार्य हे जीवहितकर गीतामृत लोल वेणुगानचतुर हे विश्वगुरु शरणागतोद्धार
    प्रसीद प्रसीद कृपासागर ॥ ३॥ २६ मुरलीधर गीतम् भुवनैक सम्मोहनाकारं शिरसा नमामि मुरलीधरम् ॥ पल्लवि॥ देवकी
    वसुदेव प्रिय किशोरं यशोदानन्द चित्तापहरं कालुष्यदूरम् विश्वाधारं कारुण्यपूरं विश्वाकारम् ॥ १॥ तुलसीमालाधरं
    जीवेश्वरं सखवृन्द नायकम् नवनीतचोरं रासलीलालोलं ज्ञानेश्वरं गीतसुधालोलं योगेश्वरम् ॥ २॥ २७ गोपाल गीतम्
    गोवर्धन गिरिधर गोपाल त्राहि मां अष्टदिक्पालक पालक ॥ पल्लवि॥ नीलमेघश्याम वैकुण्ठधाम श्री विष्णुमूर्ति
    पुरुषोत्तम वारिरुह शङ्ख चक्र गधाधर शेषतल्प शयन पीताम्बरधर ॥ १॥ विश्व सृजन पालन लय कारण वैनतेय गमन
    श्रीदेवी रमण तत्त्वदर्शि निर्गुण सूक्ष्मदर्शि चिद्घन गुणदर्शि गुणातीत गीतसुधा रञ्जन ॥ २॥ २८ श्रीराम
    गीतम् श्री रामचन्द्र वात्सल्यसान्द्र रघुकुल पीयूषसागर चन्द्र ॥ पल्लवि॥ धरासुता वल्ल्भ रविप्रभ सुगुणैश्वर्य
    भिक्षां देहि गम्भीरस्वभाव सर्वात्मभाव दशरथ प्राणप्रिय इनकुलोद्भव ॥ १॥ नित्यसमीपवर्ति मारुतीसेव्य सर्वं
    राममयमित्यनुभववेद्य नवविध भक्तोपास्य कोदण्डधर अयोध्या सार्वभौम लङ्काधीशहर ॥ २॥ जनकवचन परिपालकराम जनकनन्दिनी
    सौमित्री समेत विपिनवासे सुखदुःख समदर्शि गीतसुधाश्रय हे सत्यदर्शि ॥ ३॥ २९ श्रीधर गीतम् क्षीराब्धि सुकुमारि
    मनोहर क्षीराम्बोनिधि मथनाधार ॥ पल्लवि॥ सर्वकरण सुन्दर शान्ताकार सर्वजीवेश्वर लोकोद्धार समस्त चराचर
    स्वरूपधर त्रिमूर्ति रूप सद्गुरु दामोदर ॥ १॥ धर्मक्षेत्र सञ्चार सुजनमन्दार वेदज्ञानसार श्रीधर मुदकर
    असुरसंहार गुणगम्भीर प्रणमाम्यहम् त्वां गीतसुधाकर ॥ २॥ ३० वासुदेव गीतम् दामोदरं रुक्मिणी मनोहरं भावयामि
    वसुदेव सुकुमारम् ॥ पल्लवि॥ सहस्राराद्रि योगिसद्दर्शितं चिद्गुहान्तर्निवासितम् स्मितं सहस्र कोटि भानुप्रकाशं
    साधुसन्त सद्भक्त हृदयेशम् ॥ १॥ यादवकुलेशं शुभदायकं वैकुण्ठधामेशं दीनोद्धारकं दैवशिखामणिं प्राज्ञचिन्तामणिं
    धर्मकर्म मर्मज्ञसुधीमणिम् ॥ २॥ श्यामल शरीरं मातुल कंसहरं व्याकुल चित्त पाण्डवोद्धारं गीतसुधाकरं वेणुगानचतुरं
    गीतामृत दोग्धां मोहापहरम् ॥ ३॥ ३१ वरलक्ष्मी गीतम् मल्लिका चम्पका सेवन्तिका मालिकालङ्कृता हरिपदसेविका
    ॥ पल्लवि॥ भक्तधेनुका कृपाचन्द्रिका संरक्षयतु मां भवतारका समृद्धिवाटिका सम्पोषिणी सर्वसिद्धिकारिणी
    गीतसुधावनी ॥ १॥ सुगन्धमय सरोरुहधारिणी सुकोमलारुण हस्तशोभिनी श्रीवरलक्ष्मी वैकुण्ठस्वामिनी क्षीराब्धिमथने
    जन्मधारिणी ॥ २॥ शुक शौनक तुम्बुरु नारदादि मुनि योगि गण सङ्कीर्तिता सिद्ध साध्य यक्ष किन्नर किंपरुष
    गन्धर्व देवासुर वृन्दसेविता ॥ ३॥ ३२ गौरी गीतम् चतुर्दश भुवन जननि नमस्ते कैलासवासिनि गौरि नमस्ते ॥
    पल्लवि॥ ताण्डव प्रिय परशिवसहिते लास्यप्रिये जीवपात्रमुदिते प्रकृतिपुरुष सङ्गमबलेन त्वं विश्वपालिनि
    विश्वरक्षिणि ॥ १॥ गजवदन षड्वदन धीबल प्रहर्षिणि त्रिशूलधारिणि त्रिनेत्रभामिनि भृङ्गि नन्द्यादि शिवगणविनुते
    स्तोत्रसंप्रीते गीतसुधाश्रिते ॥ २॥ ३३ केशव गीतम् सनातन धर्मसारथिं स्मर क्षीरसागर राजसुतापतिं स्मर
    ॥ पल्लवि॥ करणव्यूहं संयम्य प्रतिदिनं कायरथे स्मर आत्मानं रथिनं सुदुष्कर मनोगतिं नियम्य केशव चरणाब्जे
    मन आधत्स्व ॥ २॥ शिष्टजन परिरक्षकं दुष्टजन शिक्षकं विशिष्ट योगार्थि परिवर्तकं जीवनियामकम् जगन्नियन्त्रकं
    जगदोद्धारकं स्मर गीतसुधारक्षकम् ॥ २॥ ३४ विष्णु गीतम् वन्देऽहं श्री महाविष्णुं जिष्णुं प्रभविष्णुं
    ग्रसिष्णुम् ॥ पल्लवि॥ वन्दे सरोरुहनाभं अन्तर्मुख सुलभं श्यामलप्रभं श्री सत्यनारायणं नलिनलोचनं हृदयाकर्षणं
    वन्दे नागकुलाधीश शयनम् ॥ १॥ महिमान्वित सुदर्शन चक्रधरं अतिशय बलपूर्ण गधाधरं गीतसुधापावनं सच्चरित भयहरणं
    ध्यान गान योग यात्रा तोषणम् ॥ २॥ ३५ सरस्वती गीतम् शारदे वरदे मां ज्योतिर्गमय श्वेतहंसगामिनी सुपथे
    गमय ॥ पल्लवि॥ नीरक्षीर विवेकं प्रयच्छ कलादेवि आत्मसुखं प्रयच्छ जपमाला पुस्तकधारिणि वाणि विद्यासम्पद्बलं
    मे यच्छ ॥ १॥ नादसुरङ्गे प्रज्ञां स्थापयसि स्वर तरङ्गे रसलोके विहरसि अक्षरान्तरङ्गे भावलास्यं करोषि
    । अक्षय गीतसुधासरिता प्रियोऽसि ॥ २॥ ३६ दक्षिणामूर्ति गीतम् हे दक्षिणा मूर्ति बोधय मां हे ज्ञानविज्ञान
    मूर्ति प्रेरय माम् ॥ पल्लवि॥ राजयोग विद्या रहस्यं विश्वादिगुरुमूर्ति त्वया ज्ञातं हे ज्ञानवृद्ध भवरोगवैद्य
    सर्वगुरुवन्द्य ऋषिमुनिवेद्य ॥ १॥ हे जीवाधार जीवनाधार वेदवेदान्त सार निगमगोचर जनन मरण तारणचतुर सर्वदा
    ध्यानस्थ योगभास्कर ॥ २॥ ३७ श्रीकृष्ण गीतम् अन्यथा शरणं नास्ति श्रीनिधि पयोनिधिवास कृपानिधि ॥ पल्लवि॥
    अक्षयाम्बरप्रद यदुवंशतिलक पाण्डव रमणी मानसंरक्षक षोडश सहस्र गोपिकाविमोचक षोडश कलापूर्ण कुब्ज वनितोद्धारक
    ॥ १॥ देवकी वसुदेव त्यागयोगाश्रय राधा रुक्मिणी प्रेमयोगमोदाश्रय वेणुगानप्रिय अक्षयाव्यय गीताबोधक गीतसुधाप्रिय
    ३८ सरस्वती गीतम् शुभङ्करि अभयङ्करि वीणापाणि सृष्टिकर्म संलग्न ब्रह्मरमणि ॥ पल्लवि॥ अज्ञात वास स्थित
    संस्कारान् सुज्ञात विधानेन नियन्त्रसि विधविध स्पन्दन विज्ञान चन्द्रिके त्वमेव ज्ञानप्रदे प्रज्ञादीपिके
    ॥ १॥ वाग्दोष वारिणि लोकमैत्रि रक्षिणि सर्वाक्षर मालिनि अभिव्यक्तिकारिणि सङ्घर्षसमये सुपथदर्शिनि संप्राप्ति
    समये यशोकीर्ति दायिनि ॥ २॥ सर्व स्पन्दन माधुर्य प्रहर्षिणि नृत्य गान साहित्य क्षेत्रपोषिणि चित्र शिल्प
    वैभव सौन्दर्यमयि जपमालाधारिणि गीतसुधामयि ॥ ३॥ ३९ राजराजेश्वरी गीतम् त्रिभुवनोल्लासिनि मां पाहि त्रिदेह
    सञ्चालिनि ज्ञानं देहि ॥ पल्लवि॥ श्रीराज राजेश्वरि भक्तिदे श्रीमत्सिंहासनासीने मुक्तिदे श्रीमाते जडचेतनात्मिके
    श्रीयुते सगुण निर्गुणात्मिके ॥ १॥ परापरा विद्याप्रकाशिनि गीतसुधावनि सिंहवाहनयुते श्रीहरि चतुरास्य
    गजास्यपित नुते रक्तबीजासुर्मर्दनमुदिते दैत्यमर्दिनि ॥ २॥ ४० श्रीहरि गीतम् लीलामानुष विग्रह श्रीहरि
    लक्ष्मीरमण प्रसीद मुरारि ॥ पल्लवि॥ विश्वस्वाम्यं तवैव सर्वदा जीवसाम्यं त्वय्यैव गोविन्द तव समक्षमतानुभवे
    मम प्रज्ञां प्रतिष्टापय सुखधाम ॥ १॥ सनक सनन्दनादि ऋषिसेवित धृव प्रह्लाद विभीषणाद्यर्चित सफल जपयोगध्येय
    गीतसुधाकर शङ्खचक्रधर धरणीप्रियकर ॥ २॥ ४१ पार्वती गीतम् भगवतीं बलवतीं पार्वतीं स्मराम्यहं धीमतीं श्रीमतीं
    शाश्वतीं भजाम्यहम् ॥ पल्लवि॥ धर्मवतीं दयावतीं हैमवतीं हंसवतीं सुमुख स्कन्ध सम्पूजित शिवसतीं स्मराम्यहम्
    ॥ १॥ नीतिमतीं कान्तिमतीं मानवतीं भानुमतीं अनुपम लावण्यवतीं ह्रीमतीं स्मराम्यहम् ॥ २॥ रसवतीं सरसवतीं
    मधुमतीं शान्तिवतीं गीतसुधाश्रितां रतीं गुणवतीं स्मराम्यहम् ॥ ३॥ ४२ विघ्नराज गीतम् विघ्नराजं सुमतिप्रदायकं
    प्रणमामि सदा मातङ्गमुखम् ॥ पल्लवि॥ नवरत्न किरीट विराजितं भुजग भुजकीर्ति शोभितं मूषकगमनं मोदकरं प्रणमामि
    दुरितराशिहरम् ॥ १॥ प्रथमाराधितं गिरिजाशिवसुतं ललाटे प्रणवतिलक राजितं सिद्धि बुद्धिप्रदं गीतसुधानुतं
    प्रणमामि कुमारक्रीडासहितम् ॥ २॥ ४३ सरस्वती गीतम् नादसागरे सप्तस्वर तरङ्गिणि भाषान्तर्गामिनी सर्वाक्षराकारिणि
    ॥ पल्लवि॥ विद्याप्रदे शारदे वरदे सर्वपदार्थ ज्ञानविज्ञानदे सृष्टिकर्त भामिनि ज्ञानं देहि सत्यलोक स्वामिनि
    मां परिपाहि ॥ १॥ जीवान्तरङ्गे शाश्वतवासिनि जीवनतरङ्गे तरतमविवेचनि मूढत्वदूरिणि भवभीति हारिणि गीतसुधावनि
    सत्यप्रकाशिनि ॥ २॥ ४४ पार्वती गीतम् अनुपम लावण्यपूर्णे गिरिसुते अपरिमित शक्तियुते स्कन्दमाते ॥ पल्लवि॥
    सिद्धिशक्तिरूपिणि सर्वसिद्धिकारिणि तपस्विनि तेजस्विनि गीतसुधावनि अद्भुत दीक्षाव्रते दक्षनन्दिनि अर्धनारीश्वर
    परमप्रियरमणि ॥ १॥ स्वहस्तरूपित गजमुख जननि स्वधर्मनिष्ठ शीघ्रोद्धारिणि दैवासुर सङ्ग्रामे शिष्टरक्षिणि
    गङ्गानुबन्धे स्नेहरागहर्षिणि ॥ २॥ ४५ लक्ष्मी गीतम् सद्भक्ति मधुस्वादप्रिये सहृदये सिन्धूर तिलक शोभिते
    हरिप्रिये ॥ पल्लवि॥ सर्वभोग सत्ययोग प्रदायिनि सर्वकाल हासिनि सरोजलोचनि सम्पत्प्रदायिनि ह्रासदूरिणि
    महालक्ष्मि सदये गीतसुधामोदिनि ॥ १॥ सर्वाभरण सुन्दरि मोदकरि पावनकरि सौन्दर्य रत्नाकरि भुवनेश्वरि सञ्चित
    कर्मराशि दहनकरि संरक्ष मां सदा नित्याभयकरि ॥ २॥ ४६ राजराजेश्वरी गीतम् श्रीमाते राजराजेश्वरि श्री ललिते
    भुवनैकाधीश्वरि ॥ पल्लवि॥ सत्य शिव सुन्दररूपिणि पालय सत्य ज्ञानानन्तरूपिणि तारय इह पर सौख्यार्थमहं
    वारं वारं इक्षुचापधरि त्वां प्रणमाम्यहम् ॥ १॥ जन्म मृत्यु वृत्ते भ्रमति मम जीवः तन्मयकर विषयजाले बन्धितोऽस्मि
    अविद्या गुहे कथं पश्यामि प्रकाशं आराधक पावनि गीतसुधा तारिणि ॥ २॥ ४७ श्री ललिता गीतम् श्री विद्याराध्ये
    दिव्यशक्तीश्वरि श्री चक्रनिलये भव्य जगदीश्वरि ॥ पल्लवि॥ पराप्रकृतिरूपे ज्ञानप्रसादिनि अपरा प्रकृतिरूपे
    जीवभावदायिनि षड्विकारमय देहभावहारिणि सव्यपथ चालिनि मोक्षसुखदायिनि ॥ १॥ दिविज कार्य समुद्भूते श्री
    ललिते दीप्ति लावण्य समन्विते पाहि मां राजीव लोचनि गीतसुधावाहिनि पञ्चविषय साक्षिणि प्रज्ञाप्रबोदिनि
    ॥ २॥ ४८ मारुती गीतम् वन्दे सुधीवरं धीरवरं अञ्जनादेवी प्रियकुमारम् ॥ पल्लवि॥ जानकीराम सेवा निष्ठ दूतं
    गगनयान समर्थम् प्रणीतं योगसिद्धीश्वरं महासन्तं वानरेशं अपरिमित बलवन्तम् ॥ १॥ लङ्केश गर्वहरं भक्तिपूर्णं
    दिविजवृन्द गणदत्त दिव्यशक्तिपूर्णं सेतुनिर्माणे गीतसुधाश्रितं सर्वदा रामनाम स्मरणनिरतम् ॥ २॥ ४९ नारायण
    गीतम् मधुसूदन जगदोल्लास कारण पुनरपि पुनरप्याश्रयामि ॥ पल्लवि॥ श्रीमन्नारायण मोक्षसदन श्री लक्ष्मीरमण
    जीवप्रदान कमलपत्र नयन नलिनचरण श्रीरङ्गधामेश्वर शशिवदन ॥ १॥ मत्स्य कूर्म वराह नरसिंह वामन परशुराम राम
    कृष्ण बुद्ध कल्कि इत्याश्चर्यमय दशावतारेषु धर्मप्रभाकर हे गीतसुधाश्रित ॥ २॥ ५० आञ्जनेय गीतम् सुरुचिर
    भक्तिगान विद्याधर वायुदेवनन्दन भक्तिं देहि ॥ पल्लवि॥ सङ्कटमोचन भीतिहरण रामनामजपे विलीन प्राण देवेन्द्रादि
    दिविजगण सन्नुत अणिमा महिमा सिद्धिशक्ति संयुत ॥ १॥ शिवांश सम्भूत भक्ताग्रेसर गीतसुधानुत असुरभयङ्कर
    त्रिमूर्ति वरदान पात्र गुणवन्त वानरवीर दिव्यगात्र धीमन्त ॥ २॥ ५१ आञ्जनेय गीतम् भागवत शिरोमणि मां पाहि
    श्री आञ्जनेय सद्भक्तिं देहि ॥ पल्लवि॥ श्रीरामभक्त सार्वभौम श्रीमाता सीतान्वेषण चतुर सञ्जीविनी पर्वतधर
    शुभकर सम्यग्सेवा परायण धीवर ॥ १॥ बाल्यावस्थे बहुलीलाविनोद प्रौढावस्थे अतिमानुष प्रताप दिविजदैत्यातीत
    शक्तिसंयुक्त गीतसुधानिरत चिरञ्जीवि मुक्त ॥ २॥ ५२ गशेश गीतम् एकदन्तं प्रथमाराधितं भावयाम्यहं श्रीगणनाथम्
    ॥ पल्लवि॥ मूलाधारस्थितं विघ्नेशं मोदकहस्तं सुधीशं गुणेशं सहस्र भानुप्रकाशं विशेषं पाशाङ्कुशधरम् पातकनाशम्
    ॥ १॥ परा पश्यन्ती मध्यमा वैखरी चत्वारि वागात्मकं गजमुखं गीतसुधाकरं विद्याधीश्वरं शिवकुमारं कार्तिकेय
    सोदरम् ॥ २॥ ५३ कार्तिकेय गीतम् कार्तिकेय विघ्नराजप्रिय देवसैन्याधिप गङ्गातनय। ॥ पल्लवि॥ उमा महेशसुत
    दिव्यप्रभ वल्ली देवसेना प्रियवल्लभ तारकासुर संहारक सत्सन्तान वर प्रदायक ॥ १॥ गुरुमूर्ति स्वरूप सुन्दरमुख
    षण्मुख पलनी क्षेत्रेश कृत्तिकाराधक मयूरवाहन गीतसुधावन प्रज्ञापूर्ण देहि सुज्ञानम् ॥ २॥ बाल सुब्रह्मण्य
    विद्वत्पूर्ण वेलायुधधर तेजो पूर्ण मम सुप्रसन्नो भव ज्ञानपूर्ण व्याधिहर भवव्याधिहर परिपूर्ण ॥ ३॥ ५४
    श्रीराम गीतम् निरतिशय गुणसागरचन्द्र वन्देऽहं श्रीरामचन्द ॥ पल्लवि॥ विष्णुमूर्ति विश्वादिदेव धर्ममूर्ति
    कारुण्यभाव मर्यादा पुरुषोत्तम राम सनातन सन्तप्रिय रघुराम ॥ १॥ अयोध्यानगर प्रजासुख कारण सुमित्रासुतानुक्षण
    सेवनकारण भरत शतृघ्नादि सोदरसम्पूज्य सीतामनोहर गीतसुधाराध्य ॥ २॥ ५५ गौरी गीतम् श्वेतशैलपति प्रियनन्दिनी
    शुक्लाम्बरधर गणेश जननी ॥ पल्लवि॥ कृत्तिका पोषित स्कन्द रञ्जिनी कैलासवासिनी गौरी अवतु मां षड्वैरि दमनी
    षड्चक्रवासिनी षडैश्वर्य शालिनी अवतु माम् ॥ १॥ सुवासिनि सम्पूज्य कुण्डलिनी सम्प्रीता भवतु गीतसुधावनी
    धर्मग्लानि कारक दैत्यमर्दिनि सत्कर्मरत संरक्षिणी अवतु माम् ॥ २॥ ५६ गणेश गीतम् मनसा स्मरामि पशुपतितनयं
    गणनाथं सदयं महिमातिशयम् ॥ पल्लवि॥ कोटिदिनकर प्रकाशं पावनचरणं भालचन्द्रं महोदरं गजाननं प्रथमार्चन मुदितं
    भवभीति हरणम् । भक्त्या करोमि मोदकनिवेदनम् ॥ १॥ वक्रतुण्डं लम्बोदरं धीशक्तिप्रदम् मङ्गलाकारं गजकर्णकं
    षण्मुखाग्रजं गीतसुधाकरं विघ्नराजम् ॥ २॥ ५७ वासवि गीतम् षोडशि वासवि अतिलोक कान्तिवति हृदयगुहान्तरे
    ध्यायामि भगवति ॥ पल्लवि॥ बाल्यक्रीडा लीला विलासिनि काव्य नाट्य सङ्गीत सम्मोदिनि रस भाव विचार संयोगध्येये
    प्रतिक्षणं भावयामि निर्माये ॥ १॥ प्रसन्न मनोदीप्तिम् प्रसारय मां सर्वदा सुमेधा ज्योतिर्गमय धैर्य स्थैर्यादि
    सम्पदान् प्रसादय कृत्वा मम सारथ्यम् अमृतं गमय ॥ २॥ सर्व शक्तिधारिणि ब्रह्मविष्णु शिवजननि सर्वजीव देहयात्रा
    विधायिनि सर्वभाव क्रिया निश्चय प्रवर्तिनि गीतसुधावनि विश्वरूप प्रदर्शिनि ॥ ३॥ ५८ चन्द्रमौलेश्वर गीतम्
    चन्द्रमौलेश्वर अर्धनारीश्वर जीवरहस्यम् प्रबोधय स्मरहर ॥ पल्लवि॥ समस्त ब्रह्माण्ड प्रभव स्थिति लय
