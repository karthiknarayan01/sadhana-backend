id: sri-raghavendra-stotram
category: stotram
name:
  english: Sri Raghavendra Stotram
content:
  english: shripurnabodhagurutirthapayobdhipara kamarimakshavishamakshashirah sprishanti | purvottaramitatarangacaratsuhamsa
    devalisevitaparanghripayojalagna || || jiveshabhedagunapurtijagatsusattva nicoccabhavamukhanakraganaih
    sameta | durvadyajapatigilairgururaghavendra vagdevatasaridamum vimali karotu || || shriraghavendrah
    sakalapradata svapadakanjadvayabhaktimadbhyah | aghadrisambhedanadrishtivajrah kshamasurendro'vatu
    mam sada'yam || || shriraghavendro haripadakanja nishevanallabdhasamastasampat | devasvabhavo divijadrumo'ya
    mishtaprado me satatam sa bhuyat || || bhavyasvarupo bhavaduhkhatula sanghagnicaryah sukhadhairyashali
    | samastadushtagrahanigrahesho duratyayopaplavasindhusetuh || || nirastadosho niravadyaveshah pratyarthimukattvanidanabhashah
    | vidvatparijneyamahavishesho vagvaikharinirjitabhavyasheshah || || santanasampatparishuddhabhakti
    vijnanavagdehasupatavadin | datva sharirotthasamastadoshan hattva sa no'vyadgururaghavendrah || ||
    yatpadodakasancayah suranadimukhyapagasadita sankhyanuttamapunyasanghavilasatprakhyatapunyavahah |
    dustapatrayanashano bhuvi mahavandhyasuputraprado vyangasvangasamriddhido grahamahapapapahastam shraye
    || || yatpadakanjarajasa paribhushitanga yatpadapadmamadhupayitamanasa ye | yatpadapadmaparikirtanajirnavaca
    staddarshanam duritakananadavabhutam || || sarvatantrasvatantro'sau shrimadhvamatavardhanah vijayindrakarabjotthasudhindravaraputrakah
    || || shriraghavendro yatirat gururme syadbhayapahah jnanabhaktisuputrayuryashah shripunyavardhanah
    || || prativadijayasvantabhedacihnadaro guruh | sarvavidyapravino'nyo raghavendranna vidyate || ||
    aparokshikritashrishah samupekshitabhavajah | apekshitapradata'nyo raghavendranna vidyate || || dayadakshinyavairagyavakpatavamukhankitah
    | shapanugrahashakto'nyo raghavendranna vidyate || || ajnanavismritibhrantisamshaya'pasmritikshayah
    | tandrakampavacahkaunthyamukha ye cendriyodbhavah | doshaste nashamayanti raghavendraprasadatah ||
    || om shriraghavendraya namah itya'shtaksharamantratah | japitadbhavitannityam ishtarthah syurna samshayah
    || || hantu nah kayajan doshan atmatmiyasamudbhavan | sarvanapi pumarthamshca dadatu gururatmavit
    || || iti kalatraye nityam prarthanam yah karoti sah | ihamutraptasarveshto modate natra samshayah
    || || agamyamahima loke raghavendro mahayashah | shrimadhvamatadugdhabdhicandro'vatu sada'naghah ||
    || sarvayatraphalavaptyai yathashaktipradakshinam | karomi tava siddhasya brindavanagatam jalam ||
    || shirasa dharayamyadya sarvatirthaphalaptaye | sarvabhishtarthasiddhyartham namaskaram karomyaham
    | tava sankirtanam vedashastrarthajnanasiddhaye || || samsare'kshayasagare prakritito'gadhe sada dustare
    sarvavadyajalagrahairanupamaih kamadibhangakule | nanavibhramadurbhrame'mitabhayastomadiphenotkate
    duhkhotkrishtavishe samuddhara guro ma magnarupam sada || || raghavendragurustotram yah pathedbhaktipurvakam
    | tasya kushthadiroganam nivrittistvaraya bhavet || || andho'pi divyadrishtih syadedamuko'pi vakpatih
    | purnayuh purnasampattih stotrasya'sya japadbhavet || || yah pibejjalametena stotrenaivabhimantritam
    | tasya kukshigata doshah sarve nashyanti tat kshanat || || yadvrindavanamasadya panguh khanjo'pi
    va janah | stotrenanena yah kuryat pradakshinanamaskriti || || sa janghalo bhavedeva gururajaprasadatah
    | somasuryoparage ca pushyarkadisamagame || || yo'nuttamamidam stotramashtottarashatam japet | bhutapretapishacadi
    pida tasya na jayate || || etat stotram samuccarya gurorvrindavanantike | dipasamyojanajjnanam putralabho
    bhaveddhruvam || || paravadijayo divyajnanabhaktyadivardhanam | sarvabhishtapravriddhih syannatra
    karya vicarana || || rajacoramahavyaghrasarpanakradipidanam | na jayate'sya stotrasya prabhavannatra
    samshayah || || yo bhaktya gururaghavendracaranadvandvam smaran yah pathet stotram divyamidam sada
    na hi bhavettasyasukham kincana | kim tvishtarthasamriddhireva kamalanathaprasadodayat kirtirdigvidita
    vibhutiratula sakshi hayasyo'tra hi || || phalashritih iti shri raghavendrarya gururajaprasadatah
    | kritam stotramidam punyam shrimadbhirhyappanabhidaih || pujyaya raghavendraya satyadharmarataya
    ca | bhajatam kalpavrikshaya namatam kamadhenave || apadamauliparyantam gurunamakritim smaret | tena
    vighnah pranashyanti siddhyanti ca manorathah || durvadidhvantaravaye vaishnavendivarendave | shriraghavendra
    gurave namo'tyantadayalave || muko'pi yatprasadena mukundashayanaya te | rajarajayate rikto raghavendram
    tamashraye | iti shri appannacaryaviracitam shriraghavendra stotram sampurnam ||
  devanagari: श्रीपूर्णबोधगुरुतीर्थपयोब्धिपारा कामारिमाक्षविषमाक्षशिरः स्पृशन्ती । पूर्वोत्तरामिततरङ्गचरत्सुहंसा
    देवालिसेवितपराङ्घ्रिपयोजलग्ना ॥ ॥ जीवेशभेदगुणपूर्तिजगत्सुसत्त्व नीचोच्चभावमुखनक्रगणैः समेता । दुर्वाद्यजापतिगिलैर्गुरुराघवेन्द्र
    वाग्देवतासरिदमुं विमली करोतु ॥ ॥ श्रीराघवेन्द्रः सकलप्रदाता स्वपादकञ्जद्वयभक्तिमद्भ्यः । अघाद्रिसम्भेदनदृष्टिवज्रः
    क्षमासुरेन्द्रोऽवतु मां सदाऽयम् ॥ ॥ श्रीराघवेन्द्रो हरिपादकञ्ज निषेवणाल्लब्धसमस्तसम्पत् । देवस्वभावो
    दिविजद्रुमोऽय मिष्टप्रदो मे सततं स भूयात् ॥ ॥ भव्यस्वरूपो भवदुःखतूल सङ्घाग्निचर्यः सुखधैर्यशाली ।
    समस्तदुष्टग्रहनिग्रहेशो दुरत्ययोपप्लवसिन्धुसेतुः ॥ ॥ निरस्तदोषो निरवद्यवेषः प्रत्यर्थिमूकत्त्वनिदानभाषः
    । विद्वत्परिज्ञेयमहाविशेषो वाग्वैखरीनिर्जितभव्यशेषः ॥ ॥ सन्तानसम्पत्परिशुद्धभक्ति विज्ञानवाग्देहसुपाटवादीन्
    । दत्वा शरीरोत्थसमस्तदोषान् हत्त्वा स नोऽव्याद्गुरुराघवेन्द्रः ॥ ॥ यत्पादोदकसञ्चयः सुरनदीमुख्यापगासादिता
    सङ्ख्यानुत्तमपुण्यसङ्घविलसत्प्रख्यातपुण्यावहः । दुस्तापत्रयनाशनो भुवि महावन्ध्यासुपुत्रप्रदो व्यङ्गस्वङ्गसमृद्धिदो
    ग्रहमहापापापहस्तं श्रये ॥ ॥ यत्पादकञ्जरजसा परिभूषिताङ्गा यत्पादपद्ममधुपायितमानसा ये । यत्पादपद्मपरिकीर्तनजीर्णवाच
    स्तद्दर्शनं दुरितकाननदावभूतम् ॥ ॥ सर्वतन्त्रस्वतन्त्रोऽसौ श्रीमध्वमतवर्धनः विजयीन्द्रकराब्जोत्थसुधीन्द्रवरपुत्रकः
    ॥ ॥ श्रीराघवेन्द्रो यतिराट् गुरुर्मे स्याद्भयापहः ज्ञानभक्तिसुपुत्रायुर्यशः श्रीपुण्यवर्धनः ॥ ॥ प्रतिवादिजयस्वान्तभेदचिह्नादरो
    गुरुः । सर्वविद्याप्रवीणोऽन्यो राघवेन्द्रान्न विद्यते ॥ ॥ अपरोक्षीकृतश्रीशः समुपेक्षितभावजः । अपेक्षितप्रदाताऽन्यो
    राघवेन्द्रान्न विद्यते ॥ ॥ दयादाक्षिण्यवैराग्यवाक्पाटवमुखाङ्कितः । शापानुग्रहशक्तोऽन्यो राघवेन्द्रान्न
    विद्यते ॥ ॥ अज्ञानविस्मृतिभ्रान्तिसंशयाऽपस्मृतिक्षयाः । तन्द्राकम्पवचःकौण्ठ्यमुखा ये चेन्द्रियोद्भवाः
    । दोषास्ते नाशमायान्ति राघवेन्द्रप्रसादतः ॥ ॥ ॐ श्रीराघवेन्द्राय नमः इत्यऽष्टाक्षरमन्त्रतः । जपिताद्भावितान्नित्यं
    इष्टार्थाः स्युर्न संशयः ॥ ॥ हन्तु नः कायजान् दोषान् आत्मात्मीयसमुद्भवान् । सर्वानपि पुमर्थांश्च ददातु
    गुरुरात्मवित् ॥ ॥ इति कालत्रये नित्यं प्रार्थनां यः करोति सः । इहामुत्राप्तसर्वेष्टो मोदते नात्र संशयः
    ॥ ॥ अगम्यमहिमा लोके राघवेन्द्रो महायशाः । श्रीमध्वमतदुग्धाब्धिचन्द्रोऽवतु सदाऽनघः ॥ ॥ सर्वयात्राफलावाप्त्यै
    यथाशक्तिप्रदक्षिणम् । करोमि तव सिद्धस्य बृन्दावनगतं जलम् ॥ ॥ शिरसा धारयाम्यद्य सर्वतीर्थफलाप्तये ।
    सर्वाभीष्टार्थसिद्ध्यर्थं नमस्कारं करोम्यहम् । तव सङ्कीर्तनं वेदशास्त्रार्थज्ञानसिद्धये ॥ ॥ संसारेऽक्षयसागरे
    प्रकृतितोऽगाधे सदा दुस्तरे सर्वावद्यजलग्रहैरनुपमैः कामादिभङ्गाकुले । नानाविभ्रमदुर्भ्रमेऽमितभयस्तोमादिफेनोत्कटे
    दुःखोत्कृष्टविषे समुद्धर गुरो मा मग्नरूपं सदा ॥ ॥ राघवेन्द्रगुरुस्तोत्रं यः पठेद्भक्तिपूर्वकम् । तस्य
    कुष्ठादिरोगाणां निवृत्तिस्त्वरया भवेत् ॥ ॥ अन्धोऽपि दिव्यदृष्टिः स्यादेडमूकोऽपि वाक्पतिः । पूर्णायुः
    पूर्णसम्पत्तिः स्तोत्रस्याऽस्य जपाद्भवेत् ॥ ॥ यः पिबेज्जलमेतेन स्तोत्रेणैवाभिमन्त्रितम् । तस्य कुक्षिगता
    दोषाः सर्वे नश्यन्ति तत् क्षणात् ॥ ॥ यद्वृन्दावनमासाद्य पङ्गुः खञ्जोऽपि वा जनः । स्तोत्रेणानेन यः
    कुर्यात् प्रदक्षिणनमस्कृती ॥ ॥ स जङ्घालो भवेदेव गुरुराजप्रसादतः । सोमसूर्योपरागे च पुष्यार्कादिसमागमे
    ॥ ॥ योऽनुत्तममिदं स्तोत्रमष्टोत्तरशतं जपेत् । भूतप्रेतपिशाचादि पीडा तस्य न जायते ॥ ॥ एतत् स्तोत्रं
    समुच्चार्य गुरोर्वृन्दावनान्तिके । दीपसंयोजनाज्ज्ञानं पुत्रलाभो भवेद्ध्रुवम् ॥ ॥ परवादिजयो दिव्यज्ञानभक्त्यादिवर्धनम्
    । सर्वाभीष्टप्रवृद्धिः स्यान्नात्र कार्या विचारणा ॥ ॥ राजचोरमहाव्याघ्रसर्पनक्रादिपीडनम् । न जायतेऽस्य
    स्तोत्रस्य प्रभावान्नात्र संशयः ॥ ॥ यो भक्त्या गुरुराघवेन्द्रचरणद्वन्द्वं स्मरन् यः पठेत् स्तोत्रं
    दिव्यमिदं सदा न हि भवेत्तस्यासुखं किञ्चन । किं त्विष्टार्थसमृद्धिरेव कमलानाथप्रसादोदयात् कीर्तिर्दिग्विदिता
    विभूतिरतुला साक्षी हयास्योऽत्र हि ॥ ॥ फलशृतिः इति श्री राघवेन्द्रार्य गुरुराजप्रसादतः । कृतं स्तोत्रमिदं
    पुण्यं श्रीमद्भिर्ह्यप्पणाभिदैः ॥ पूज्याय राघवेन्द्राय सत्यधर्मरताय च । भजतां कल्पवृक्षाय नमतां कामधेनवे
    ॥ आपादमौलिपर्यन्तं गुरूणामाकृतिं स्मरेत् । तेन विघ्नः प्रणश्यन्ति सिद्ध्यन्ति च मनोरथाः ॥ दुर्वादिध्वान्तरवये
    वैष्णवेन्दीवरेन्दवे । श्रीराघवेन्द्र गुरवे नमोऽत्यन्तदयालवे ॥ मूकोऽपि यत्प्रसादेन मुकुन्दशयनाय ते
    । राजराजायते रिक्तो राघवेन्द्रं तमाश्रये । इति श्री अप्पण्णाचार्यविरचितं श्रीराघवेन्द्र स्तोत्रं सम्पूर्णम्
    ॥
