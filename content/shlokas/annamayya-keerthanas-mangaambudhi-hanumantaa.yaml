id: annamayya-keerthanas-mangaambudhi-hanumantaa
category: stotram
name:
  english: Annamayya Keerthanas Mangaambudhi Hanumantaa
content:
  english: sa pallavi mangambudhi hanumanta ni sharana | mangavincitimi hanumanta || balarka bimbamu phalamani
    pa ttina alari cetala hanumanta | tulani brahmadulace varamulu oli cekònina hanumanta || mangambudhi
    hanumanta ni sharana jaladhi data ni satvamu kapulaku alari tèlipitivi hanumanta | ilayu nakasamu
    nekamuga natu balimi pèrigitivi bhali hanumanta || caranam patalamu lopali mairavanu atala jampina
    hanumanta | cetulu modcuka shri venkatapati ni tala golice hita hanumanta || mangambudhi hanumanta
    ni sharana | mangavincitimi hanumanta ||
  devanagari: स पल्लवि मङ्गाम्बुधि हनुमन्ता नी शरण । मङ्गविञ्चितिमि हनुमन्ता ॥ बालार्क बिम्बमु फलमनि प
    ट्टिन आलरि चेतल हनुमन्ता । तूलनि ब्रह्मादुलचे वरमुलु ओलि चेकॊनिना हनुमन्ता ॥ मङ्गाम्बुधि हनुमन्ता
    नी शरण जलधि दाट नी सत्वमु कपुलकु अलरि तॆलिपितिवि हनुमन्ता । इलयु नाकसमु नेकमुगा नटु बलिमि पॆरिगितिवि
    भलि हनुमन्ता ॥ चरणं पातालमु लोपलि मैरावणु आतल जम्पिन हनुमन्ता । चेतुलु मोड्चुक श्री वेङ्कटपति नी तल
    गोलिचे हित हनुमन्ता ॥ मङ्गाम्बुधि हनुमन्ता नी शरण । मङ्गविञ्चितिमि हनुमन्ता ॥
