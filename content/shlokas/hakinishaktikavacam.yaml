id: hakinishaktikavacam
category: kavacha
name:
  english: hakinishaktikavacam
  devanagari: हाकिनीशक्तिकवचम्
content:
  english: 6|| om asyah shrihakinidevyah sanandasaramangalasya mahakavacasya sadashiva rishirgayatricchandah
    shrihakiniparadevata klim bijam svaha shaktih siddhalakshmimulakilakam dehantargata mahakamasiddhyarthe
    jape viniyogah | om patu shirshacakram me klim patu bhalamandalam | svamulam patu me nityam locanatritayam
    mama || 84
  devanagari: ६॥ ॐ अस्याः श्रीहाकिनीदेव्याः सानन्दसारमङ्गलस्य महाकवचस्य सदाशिव ऋषिर्गायत्रीच्छन्दः श्रीहाकिनीपरदेवता
    क्लीं बीजं स्वाहा शक्तिः सिद्धलक्ष्मीमूलकीलकं देहान्तर्गत महाकामसिद्ध्यर्थे जपे विनियोगः । ॐ पातु
    शीर्षचक्रं मे क्लीं पातु भालमण्डलम् । स्वमूलं पातु मे नित्यं लोचनत्रितयं मम ॥ ८४
meaning: {}
