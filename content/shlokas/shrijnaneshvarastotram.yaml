id: shrijnaneshvarastotram
category: stotram
name:
  english: shrijnaneshvarastotram
  devanagari: श्रीज्ञानेश्वरस्तोत्रम्
content:
  english: shrijnaneshvarastotram anamtarava athavale shrijnaneshvarastotram anamtarava athavale sadgurum
    saccidanandam kevalam karunakaram
  devanagari: श्रीज्ञानेश्वरस्तोत्रम् अनंतराव आठवले श्रीज्ञानेश्वरस्तोत्रम् अनंतराव आठवले सद्गुरुं सच्चिदानन्दं
    केवलं करुणाकरम्
meaning: {}
