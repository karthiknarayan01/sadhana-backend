id: sri-kashi-viswanatha-suprabhatam
category: stotram
name:
  english: Sri Kashi Viswanatha Suprabhatam
  devanagari: श्रीकाशीविश्वनाथसुप्रभातम्
content:
  english: '|| shrikashivishvanathasuprabhatam || vishvesham madhavam dhundim dandapanim ca bhairavama|
    vande kashim guham gangam bhavanim manikarnikama||1|| uttishtha kashi bhagavana prabhuvishvanatho
    gangormisangatishubhaih paribhushito''bjaih| shridhundibhairavamukhaih sahitannapurna mata ca vanchati
    muda tava suprabhatam||2|| brahma muraristripurantakarih bhanuh shashi bhumisuto budhashca| gurushca
    shukrah shanirahuketavah kurvantu sarve bhuvi suprabhatam||3|| varanasisthitagajananadhundiraja tapatrayapaharane
    prathitaprabhava| anandakandalakulaprasavaikabhume nityam samastajagatah kuru suprabhatam||4|| brahmadravopamitagangapayah
    pravahaih punyaih sadaiva paricumbitapadapadme| madhye''khilamaraganaih parisevyamane shrikashike
    kuru sada bhuvi suprabhatam||5|| pratnairasamkhyamathamandiratirthakunda prasadaghattanivahaih vidusham
    varaishca| avarjayasyakhilavishvamanamsi nityam shrikashike kuru sada bhuvi suprabhatam||6|| ke va
    nara nu sudhiyah kudhiyo''dhiyo va vanchanti nantasamaye sharanam bhavatyah| he kotikotijanamuktividhanadakshe
    shrikashike kuru sada bhuvi suprabhatam||7|| ya devairasurairmunindratanayairgandharvayakshoragaih
    nagairbhutalavasibhirdvijavaraissamsevita siddhaye| ya gangottaravahiniparisare tirthairasamkhyairvrita
    sa kashi tripurarirajanagari deyata sada mangalama||8|| tirthanam pravara manorathakari samsaraparapara
    nandanandiganeshvarairupahita devairasheshaihstuta| ya shambhormanikundalaikakanika vishnostapodirghika
    seyam shrimanikarnika bhagavati deyata sada mangalama||9|| abhinavabisavalli padapadmasya vilnoh madanamathanamaulermalati
    pushpamala| jayati jayapataka kapyasau mokshalakshmyah kshapitakalikalanka jahnavi nah punatu||10||
    gangam vari manohari muraricaranacyutama| tripurarishirashcari papahari punatu mama||11|| vighnavasanivasakaranamahagandasthalalambitah
    sindurarunapunjacandrakiranapracchadinagacchavih| shrivishveshvaravallabho girijaya sanandamananditah
    smerasyastava dhundirajamudito deyata sada mangalama||12|| kanthe yasya lasatkaralagaralam gangajalam
    mastake vamange girirajarajatanaya jaya bhavani sati| nandiskandaganadhirajasahitah shrivishvanathaprabhuh
    kashimandirasamsthito''khilaguruh deyata sada mangalama||13|| shrivishvanatha karunamritapurnasindho
    shitamshukhandasamalankritabhavyacuda| uttishtha vishvajanamangalasadhanaya nityam sarvajagatah kuru
    suprabhatam||14|| shrivishvanatha vrishabhadhvaja vishvavandya srishtisthitipralayakaraka devadeva|
    vacamagocara maharshinutanghripadma varanasipurapate kuru suprabhatam||15|| shrivishvanatha bhavabhanjana
    divyabhava gangadhara pramathavandita sundaranga| nagendrahara natabhaktabhayapahara varanasipurapate
    kuru suprabhatam||16|| shrivishvanatha tava padayugam namami nityam tavaiva shiva nama hrida smarami|
    vacam tavaiva yashasa''nagha bhushayami varanasipurapate kuru suprabhatam||17|| kashinivasamunisevitapadapadma
    gangajalaughaparishiktajatakalapa| asyakhilasya jagatah sacaracarasya varanasipurapate kuru suprabhatam||18||
    gangadharadritanaya priya shantamurte vedantavedya sakaleshvara vishvamurte| kutastha nitya nikhilagamagita
    kirte varanasipurapate kuru suprabhatam||19|| vishvam samastamidamadya ghanandhakare mohatmake nipatitam
    jadatamupetama| bhasa vibhasya paraya tadamogha shakte varanasipurapate kuru suprabhatam||20|| sunuh
    samastajanavighnavinasadaksho bharya''nnadananirataviratam janebhyah| khyatah svayam ca shivakrita
    sakalarthibhajam varanasipurapate kuru suprabhatam||21|| ye no namanti na japanti na camananti no
    va lapanti vilapanti nivedayanti| teshamabodhashishutulyadhiyam naranam varanasipurapate kuru suprabhatam||22||
    shrikantha kanthadhritapannaga nilakantha sotkanthabhaktanivahopahitopakantha| bhasmangaragaparishobhitasarvadeha
    varanasipurapate kuru suprabhatam||23|| shriparvatihridayavallabha pancavaktra shrinilakantha nrikapalakalapamala|
    shrivishvanatha mridupankajamanjupada varanasipurapate kuru suprabhatam||24|| dugdhapravahakamaniyatarangabhange
    punyapravahaparipavitabhaktasange| nityam tapasvijanasevitapadapadme gange sharanyashivade kuru suprabhatam||25||
    sanandamanandavane vasantam anandakandam hatapapavrindama| varanasinathamanathanatham shrivishvanatham
    sharanam prapadye||26|| ||iti kashivishvanathasuprabhatam|| sambaddhanubandhah shrivenkateshasuprabhatam
    shrivenkateshastotram shrivenkateshaprapattih shrivenkateshamangalashasanam shrikamakshisuprabhatam
    shrivishnusahasranamastotram'
  devanagari: ॥ श्रीकाशीविश्वनाथसुप्रभातम् ॥ विश्वेशं माधवं धुण्डिं दण्डपाणिं च भैरवम। वन्दे काशीं गुहां
    गङ्गां भवानीं मणिकर्णिकाम॥१॥ उत्तिष्ठ काशि भगवान प्रभुविश्वनाथो गङ्गोर्मिसङ्गतिशुभैः परिभूषितोऽब्जैः।
    श्रीधुण्डिभैरवमुखैः सहितान्नपूर्णा माता च वाञ्छति मुदा तव सुप्रभातम्॥२॥ ब्रह्मा मुरारिस्त्रिपुरान्तकारिः
    भानुः शशी भूमिसुतो बुधश्च। गुरुश्च शुक्रः शनिराहुकेतवः कुर्वन्तु सर्वे भुवि सुप्रभातम्॥३॥ वाराणसीस्थितगजाननधुण्डिराज
    तापत्रयापहरणे प्रथितप्रभाव। आनन्दकन्दलकुलप्रसवैकभूमे नित्यं समस्तजगतः कुरु सुप्रभातम्॥४॥ ब्रह्मद्रवोपमितगाङ्गपयः
    प्रवाहैः पुण्यैः सदैव परिचुम्बितपादपद्मे। मध्येऽखिलामरगणैः परिसेव्यमाने श्रीकाशिके कुरु सदा भुवि सुप्रभातम्॥५॥
    प्रत्नैरसंख्यमठमन्दिरतीर्थकुण्ड प्रासादघट्टनिवहैः विदुषां वरैश्च। आवर्जयस्यखिलविश्वमनांसि नित्यं श्रीकाशिके
    कुरु सदा भुवि सुप्रभातम्॥६॥ के वा नरा नु सुधियः कुधियोऽधियो वा वाञ्छन्ति नान्तसमये शरणं भवत्याः। हे
    कोटिकोटिजनमुक्तिविधानदक्षे श्रीकाशिके कुरु सदा भुवि सुप्रभातम्॥७॥ या देवैरसुरैर्मुनीन्द्रतनयैर्गन्धर्वयक्षोरगैः
    नागैर्भूतलवासिभिर्द्विजवरैस्संसेविता सिद्धये। या गङ्गोत्तरवाहिनीपरिसरे तीर्थैरसंख्यैर्वृता सा काशी
    त्रिपुरारिराजनगरी देयात सदा मङ्गलम॥८॥ तीर्थानां प्रवरा मनोरथकरी संसारपारापरा नन्दानन्दिगणेश्वरैरुपहिता
    देवैरशेषैःस्तुता। या शंभोर्मणिकुण्डलैककणिका विष्णोस्तपोदीर्घिका सेयं श्रीमणिकर्णिका भगवती देयात सदा
    मङ्गलम॥९॥ अभिनवबिसवल्ली पादपद्मस्य विल्णोः मदनमथनमौलेर्मालती पुष्पमाला। जयति जयपताका काप्यसौ मोक्षलक्ष्म्याः
    क्षपितकलिकलङ्का जाह्नवी नः पुनातु॥१०॥ गाङ्गं वारि मनोहारि मुरारिचरणच्युतम। त्रिपुरारिशिरश्चारि पापहारि
    पुनातु माम॥११॥ विघ्नावासनिवासकारणमहागण्डस्थलालंबितः सिन्दूरारुणपुञ्जचन्द्रकिरणप्रच्छादिनागच्छविः।
    श्रीविश्वेश्वरवल्लभो गिरिजया सानन्दमानन्दितः स्मेरास्यस्तव धुण्डिराजमुदितो देयात सदा मङ्गलम॥१२॥ कण्ठे
    यस्य लसत्करालगरलं गङ्गाजलं मस्तके वामाङ्गे गिरिराजराजतनया जाया भवानी सती। नन्दिस्कन्दगणाधिराजसहितः
    श्रीविश्वनाथप्रभुः काशीमन्दिरसंस्थितोऽखिलगुरुः देयात सदा मङ्गलम॥१३॥ श्रीविश्वनाथ करुणामृतपूर्णसिन्धो
    शीतांशुखण्डसमलङ्कृतभव्यचूड। उत्तिष्ठ विश्वजनमङ्गलसाधनाय नित्यं सर्वजगतः कुरु सुप्रभातम्॥१४॥ श्रीविश्वनाथ
    वृषभध्वज विश्ववन्द्य सृष्टिस्थितिप्रलयकारक देवदेव। वाचामगोचर महर्षिनुताङ्घ्रिपद्म वाराणसीपुरपते कुरु
    सुप्रभातम्॥१५॥ श्रीविश्वनाथ भवभञ्जन दिव्यभाव गङ्गाधर प्रमथवन्दित सुन्दराङ्ग। नागेन्द्रहार नतभक्तभयापहार
    वाराणसीपुरपते कुरु सुप्रभातम्॥१६॥ श्रीविश्वनाथ तव पादयुगं नमामि नित्यं तवैव शिव नाम हृदा स्मरामि।
    वाचं तवैव यशसाऽनघ भूषयामि वाराणसीपुरपते कुरु सुप्रभातम्॥१७॥ काशीनिवासमुनिसेवितपादपद्म गङ्गाजलौघपरिषिक्तजटाकलाप।
    अस्याखिलस्य जगतः सचराचरस्य वाराणसीपुरपते कुरु सुप्रभातम्॥१८॥ गङ्गाधराद्रितनया प्रिय शान्तमूर्ते वेदान्तवेद्य
    सकलेश्वर विश्वमूर्ते। कूटस्थ नित्य निखिलागमगीत कीर्ते वाराणसीपुरपते कुरु सुप्रभातम्॥१९॥ विश्वं समस्तमिदमद्य
    घनान्धकारे मोहात्मके निपतितं जडतामुपेतम। भासा विभास्य परया तदमोघ शक्ते वाराणसीपुरपते कुरु सुप्रभातम्॥२०॥
    सूनुः समस्तजनविघ्नविनासदक्षो भार्याऽन्नदाननिरताविरतं जनेभ्यः। ख्यातः स्वयं च शिवकृत सकलार्थिभाजां
    वाराणसीपुरपते कुरु सुप्रभातम्॥२१॥ ये नो नमन्ति न जपन्ति न चामनन्ति नो वा लपन्ति विलपन्ति निवेदयन्ति।
    तेषामबोधशिशुतुल्यधियां नराणां वाराणसीपुरपते कुरु सुप्रभातम्॥२२॥ श्रीकण्ठ कण्ठधृतपन्नग नीलकण्ठ सोत्कण्ठभक्तनिवहोपहितोपकण्ठ।
    भस्माङ्गरागपरिशोभितसर्वदेह वाराणसीपुरपते कुरु सुप्रभातम्॥२३॥ श्रीपार्वतीहृदयवल्लभ पञ्चवक्त्र श्रीनीलकण्ठ
    नृकपालकलापमाल। श्रीविश्वनाथ मृदुपङ्कजमञ्जुपाद वाराणसीपुरपते कुरु सुप्रभातम्॥२४॥ दुग्धप्रवाहकमनीयतरङ्गभङ्गे
    पुण्यप्रवाहपरिपावितभक्तसङ्गे। नित्यं तपस्विजनसेवितपादपद्मे गङ्गे शरण्यशिवदे कुरु सुप्रभातम्॥२५॥ सानन्दमानन्दवने
    वसन्तं आनन्दकन्दं हतपापवृन्दम। वाराणसीनाथमनाथनाथं श्रीविश्वनाथं शरणं प्रपद्ये॥२६॥ ॥इति काशीविश्वनाथसुप्रभातम्॥
    सम्बद्धानुबन्धाः श्रीवेङ्कटेशसुप्रभातम् श्रीवेङ्कटेशस्तोत्रम् श्रीवेङ्कटेशप्रपत्तिः श्रीवेङ्कटेशमङ्गलाशासनम्
    श्रीकामाक्षीसुप्रभातम् श्रीविष्णुसहस्रनामस्तोत्रम्
