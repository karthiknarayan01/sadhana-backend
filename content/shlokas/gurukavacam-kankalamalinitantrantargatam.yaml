id: gurukavacam-kankalamalinitantrantargatam
category: kavacha
name:
  english: gurukavacam (kankalamalinitantrantargatam)
  devanagari: गुरुकवचम् (कङ्कालमालिनीतन्त्रान्तर्गतम्)
content:
  english: '|| 6|| paraparakhyo nasam me parameshthi mukham sada | kantham mama sada patu prahladanandanathakah
    || 7|| bahu dvau sanakanandah kumarananda eva ca | vashishthanandanathashca hridayam patu sarvada
    || 8|| krodhanandah katim patu sukhanandah padam mama | dhyananandashca sarvangam bodhanandashca kanane
    || 9|| sarvatra guravah pantu sarve ishvararupinah | iti te kathitam bhadre'
  devanagari: ॥ ६॥ परापराख्यो नासां मे परमेष्ठी मुखं सदा । कण्ठं मम सदा पातु प्रह्लादानन्दनाथकः ॥ ७॥ बाहू
    द्वौ सनकानन्दः कुमारानन्द एव च । वशिष्ठानन्दनाथश्च हृदयं पातु सर्वदा ॥ ८॥ क्रोधानन्दः कटिं पातु सुखानन्दः
    पदं मम । ध्यानानन्दश्च सर्वाङ्गं बोधानन्दश्च कानने ॥ ९॥ सर्वत्र गुरवः पान्तु सर्वे ईश्वररूपिणः । इति
    ते कथितं भद्रे
meaning: {}
