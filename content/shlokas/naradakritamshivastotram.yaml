id: naradakritamshivastotram
category: stotram
name:
  english: naradakritamshivastotram
  devanagari: नारदकृतंशिवस्तोत्रम्
content:
  english: naradakritam shivastotram kritanjaliputo bhutva narado bhagavanmunih | stotrena mahata sharvah
    stuto bhaktya mahamanah || 45|| narada uvaca | jaya shambho virupaksha jaya deva trilocana | jaya
    shankara ishana rudreshvara namo'stu te || 46|| tvam patistvam jagatkarta tvameva layakridvibho |
    tvameva jagatam natho dushtandhakanishudanah || 47|| tvam nah pahi sureshana trayimurte sanatana |
    bhavamurte bhavare tvam bhajatamabhayo bhava || 48|| bhavabhavavinashartham bhava tvam sharanam bhaje
    | kimartham cintito deva ajna me diyatam prabho || 49|| kasya sankshobhaye cittam ko vadya patatu
    kshitau | kamadya kalahenaham yojaye jayatamvara || 50|| iti shriskandapurane avantyakhande revakhande
    shadvimsha
  devanagari: नारदकृतं शिवस्तोत्रम् कृताञ्जलिपुटो भूत्वा नारदो भगवान्मुनिः । स्तोत्रेण महता शर्वः स्तुतो
    भक्त्या महामनाः ॥ ४५॥ नारद उवाच । जय शम्भो विरूपाक्ष जय देव त्रिलोचन । जय शङ्कर ईशान रुद्रेश्वर नमोऽस्तु
    ते ॥ ४६॥ त्वं पतिस्त्वं जगत्कर्ता त्वमेव लयकृद्विभो । त्वमेव जगतां नाथो दुष्टान्धकनिषूदनः ॥ ४७॥ त्वं
    नः पाहि सुरेशान त्रयीमूर्ते सनातन । भवमूर्ते भवारे त्वं भजतामभयो भव ॥ ४८॥ भवभावविनाशार्थं भव त्वां
    शरणं भजे । किमर्थं चिन्तितो देव आज्ञा मे दीयतां प्रभो ॥ ४९॥ कस्य सङ्क्षोभये चित्तं को वाद्य पततु क्षितौ
    । कमद्य कलहेनाहं योजये जयतांवर ॥ ५०॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे षड्विंशा
meaning: {}
