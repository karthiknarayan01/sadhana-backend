id: karanashatkagitam
category: stotram
name:
  english: karanashatkagitam
  devanagari: कारणषट्कगीतम्
content:
  english: jnanam sarvadharam he krishna he madhava he deva tvam sarva karanasya karanam || 3|| mama sharirasya
    adharam tvameka nitya niradharam tvameva dharmam tvameva karmam sarvasutrasya sutradharam he krishna
    he madhava he deva tvam sarva karanasya karanam || 4|| mama sarva sukhadayakam nityasudha venu gayakam
    tvameva karta tvameva dharta mata pita atmanayakam he krishna he madhava he deva tvam sarva karanasya
    karanam || 5|| mama divya nandanandanam anandakanda sucandanam tvameva svami he antaryami sarva hridayasya
    spandanam he krishna he madhava he deva tvam sarva karanasya karanam || 6|| racayita
  devanagari: ज्ञानं सर्वाधारं हे कृष्ण हे माधव हे देव त्वं सर्व कारणस्य कारणम् ॥ ३॥ मम शरीरस्य आधारं
    त्वमेक नित्य निराधारं त्वमेव धर्मं त्वमेव कर्मं सर्वसूत्रस्य सूत्रधारं हे कृष्ण हे माधव हे देव त्वं
    सर्व कारणस्य कारणम् ॥ ४॥ मम सर्व सुखदायकं नित्यसुधा वेणु गायकं त्वमेव कर्ता त्वमेव धर्ता माता पिता
    आत्मनायकं हे कृष्ण हे माधव हे देव त्वं सर्व कारणस्य कारणम् ॥ ५॥ मम दिव्य नन्दनन्दनं आनन्दकन्द सुचन्दनं
    त्वमेव स्वामी हे अन्तर्यामी सर्व हॄदयस्य स्पन्दनं हे कृष्ण हे माधव हे देव त्वं सर्व कारणस्य कारणम्
    ॥ ६॥ रचयिता
