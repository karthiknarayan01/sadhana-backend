id: nandagopakritambalakrishnarakshakavacam-2
category: raksha
name:
  english: nandagopakritambalakrishnarakshakavacam
  devanagari: नन्दगोपकृतंबालकृष्णरक्षाकवचम्
content:
  english: nandagopakritam balakrishnarakshakavacam nandagopa uvaca | rakshatu tvamashshanam bhutanam
    prabhavo harih | yasya nabhisamudbhutapankajadabhavajjagat || 14|| yena damshtragravidhrita dharayatyavanirjagat
    | varaharupadhrigdevassa tvam rakshatu keshavah || 15|| nakhankuravinirbhinnavairivakshasthalo vibhuh
    | nrisimharupi sarvatra rakshatu tvam janardanah || 16|| vamano rakshatu sada bhavantam yah kshanadabhut
    | trivikramah kramakrantatrailokyah sphuradayudhah || 17|| shiraste patu govindah kantham rakshatu
    keshavah | guhyam ca jatharam vishnurjanghe padau janardanah || 18|| mukham bahu prabahu ca manah
    sarvendriyani ca | rakshatvavyahataishvaryastava narayano'vyayah || 19|| sharngacakragadapaneshshankhanadahatah
    kshayam | gacchantu pretakushmandarakshasa ye tavahitah || 20|| tvam patu dikshu vaikuntho vidikshu
    madhusudanah | hrishikesho'mbare bhumau rakshatu tvam mahidharah || 21|| iti vishnupurane pancamabhage
    pancamadhyayantargatam nandagopakritam balakrishnarakshakavacam samaptamm | vishnupurana | adhyaya
    5
  devanagari: नन्दगोपकृतं बालकृष्णरक्षाकवचम् नन्दगोप उवाच । रक्षतु त्वामश्षाणां भूतानां प्रभवो हरिः ।
    यस्य नाभिसमुद्भूतपङ्कजादभवज्जगत् ॥ १४॥ येन दंष्ट्राग्रविधृता धारयत्यवनिर्जगत् । वराहरूपधृग्देवस्स
    त्वां रक्षतु केशवः ॥ १५॥ नखाङ्कुरविनिर्भिन्नवैरिवक्षस्थलो विभुः । नृसिंहरूपी सर्वत्र रक्षतु त्वां
    जनार्दनः ॥ १६॥ वामनो रक्षतु सदा भवन्तं यः क्षणादभूत् । त्रिविक्रमः क्रमाक्रान्तत्रैलोक्यः स्फुरदायुधः
    ॥ १७॥ शिरस्ते पातु गोविन्दः कण्ठं रक्षतु केशवः । गुह्यं च जठरं विष्णुर्जङ्घे पादौ जनार्दनः ॥ १८॥ मुखं
    बाहू प्रबाहू च मनः सर्वेन्द्रियाणि च । रक्षत्वव्याहतैश्वर्यस्तव नारायणोऽव्ययः ॥ १९॥ शार्ङ्गचक्रगदापाणेश्शङ्खनादहताः
    क्षयम् । गच्छन्तु प्रेतकूष्माण्डराक्षसा ये तवाहिताः ॥ २०॥ त्वां पातु दिक्षु वैकुण्ठो विदिक्षु मधुसूदनः
    । हृषीकेशोऽम्बरे भूमौ रक्षतु त्वां महीधरः ॥ २१॥ इति विष्णुपुराणे पञ्चमभागे पञ्चामाध्यायान्तर्गतं नन्दगोपकृतं
    बालकृष्णरक्षाकवचं समाप्तम्म् । विष्णुपुराण । अध्याय ५
