    बचन सब कहँ प्रिय लागे। राम सनेह सुधाँ जनु पागे ॥ लोग बियोग बिषम बिष दागे। मन्त्र सबीज सुनत जनु जागे
    ॥ मातु सचिव गुर पुर नर नारी। सकल सनेहँ बिकल भे भारी ॥ भरतहि कहहि सराहि सराही। राम प्रेम मूरति तनु
    आही ॥ तात भरत अस काहे न कहहू। प्रान समान राम प्रिय अहहू ॥ जो पावँरु अपनी जड़ताई। तुम्हहि सुगाइ मातु
