id: isha-bhashya-shankar
category: upanishad
name:
  english: isha bhashya shankar
  devanagari: ईशा भाष्य षन्कर्
content:
  english: gitanam mokshadharmanam caivamparatvat | tasmadatmano'nekatvakartritvabhoktritvadi ca ashuddhatvapapaviddhatvadi
    copadaya lokabuddhisiddham karmani vihitani | yo hi karmaphalenarthi drishtena brahmavarcasadina adrishtena
    svargadina ca dvijatiraham na kanatvakunitvadyanadhikaraprayojakadharmavanityatmanam manyate so'dhikriyate
    karmasviti hyadhikaravido vadanti | tasmadete mantra atmano yathatmyaprakashanena atmavishayam svabhavikakarmvijnanam
    nivartayantah shokamohadisamsaradharmavicchittisadhanamatmaikatvadivijnanamutpadayantiti | evamuktadhikaryabhidheyasambandhaprayojananmantransankshepato
    vyakhyasyamah
  devanagari: गीतानां मोक्षधर्माणां चैवंपरत्वात् । तस्मादात्मनोऽनेकत्वकर्तृत्वभोक्तृत्वादि च अशुद्धत्वपापविद्धत्वादि
    चोपादाय लोकबुद्धिसिद्धं कर्माणि विहितानि । यो हि कर्मफलेनार्थी दृष्टेन ब्रह्मवर्चसादिना अदृष्टेन स्वर्गादिना
    च द्विजातिरहं न काणत्वकुणित्वाद्यनधिकारप्रयोजकधर्मवानित्यात्मानं मन्यते सोऽधिक्रियते कर्मस्विति ह्यधिकारविदो
    वदन्ति । तस्मादेते मन्त्रा आत्मनो याथात्म्यप्रकाशनेन आत्मविषयं स्वाभाविककर्म्विज्ञानं निवर्तयन्तः
    शोकमोहादिसंसारधर्मविच्छित्तिसाधनमात्मैकत्वादिविज्ञानमुत्पादयन्तीति । एवमुक्ताधिकार्यभिधेयसम्बन्धप्रयोजनान्मन्त्रान्सङ्क्षेपतो
    व्याख्यास्यामः
meaning: {}
