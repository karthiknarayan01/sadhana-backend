id: kyts-7-1-prajananam-jyothiragnih-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 7.1 Prajananam Jyothiragnih - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam saptamakande prathamah prashnah ashvamedhagatamantranamabhidhanam
    o shri gurubhyo namah | harih om || prajanana njyotirvirat chandasa ntishthate virajamabhi sampadyate
    tasma ttajjyotirucyate dvau stomau 'panashca dvau maddhyadinnagm savanam ya~tha cakshushca shrotra
    nca dvau tritiyasavanam ya~tha vakca pratishtha ca purushasammito va esha yajno nkamayate tametenabhyashnute
    sarvagg hyasthurina 'gnishtomena vai prajapatih praja asrijata ta agnishtomenaiva paryagrihna 'tyapravata
    tasyanuhayareta a dgardabhe nyamar dgardabho dvireta atho ahurvadabaya nnyamarditi tasma dvadaba dvireta
    atho ahu nyamarditi tasmadoshadhayo 'nabhyakta rebhantyatho ahuh prajasu nyamarditi tasma dyamau jayete
    tasmadashvataro na pra jayata attareta hi tasma dbarhishyanavaklipta ssarvavedase va sahasre va 'ti
    hyapravata ya evam vi~dvanagnishtomena yajate prajatah praja janayati pari prajata grihnati tasmadahurjyeshthayajna
    iti prajapatirvava jyeshtha 'yajata prajapatirakamayata pra jayeyeti sa mukhatastrivrita nniramimita
    tamagnirdevata 'nvasrijyata gayatri chando rathantaragm sama brahmano manushyanamajah pashuna tte
    mukhya mukhato hyasrijyantoraso bahubhya nniramimita tamindro devata 'nvasrijyata trishtu thsama rajanyo
    manushyanamavih pashuna tte viryavanto virya ddhyasrijyanta maddhyata vi~shve deva devata anvasrijyanta
    jagati chando vai rupagm sama vaishyo manushyana tta adya annadhanaddhya srijyanta tasma dbhuyagmso
    'nyebhyo bhuyishtha hi devata anvasrijyanta patta ekavigm sha nniramimita tamanushtu 'nvasrijyata
    vairajagm sama shudro manushyana nkraminavashvashca shudrashca tasma 'navaklipto na hi devata anvasrijyata
    tasma tpadavupa jivatah patto hyasrijyeta mprana vai trivridardhamasah pancadashah prajapati ssaptadashastraya
    ime loka asavaditya ekavigmsha etasmin va ete shrita etasmi npratishthita ya evam ve~daitasminneva
    shrayata etasmi pratassavane vai gayatrena chandasa trivrite stomaya jyotirdadhadeti trivrita brahmavarcasena
    pancadashaya jyotirdadhadeti pancadashenaujasa viryena saptadashaya jyotirdadhadeti saptadashena prajapatyena
    prajananenaikavigmshaya jyotirdadhadeti stoma eva ta thstomaya jyotirdadhadetyatho stoma eva stomamabhi
    pra nayati yavanto vai stomastavantah kamastavanto loka stavanti jyotigshyetavata eva stomanetavatah
    kamanetavato lokanetavanti jyotigshyava rundhe || brahmavadino vadanti sa tvai yajeta yo 'gnishtomena
    yajamano 'tha sarvastomena yajeteti yasya trivritamantaryanti pranag stasyantaryanti praneshu me 'pyasaditi
    khalu vai yajnena yajamano yajate yasya pancadashamantaryanti virya ntasyantaryanti virye me 'pyasaditi
    khalu vai yajnena yajamano yajate yasya saptadasha ntasyantaryanti prajaya 'pyasaditi khalu vai yajnena
    yajamano yajate yasyaikavigmshamantaryanti pratishtha ntasyantaryanti pratishthaya 'pyasaditi khalu
    vai yajnena yajamano yajate yasya trinavamantaryantyritug shca tasya nakshatriya nca virajamantaryantyritushu
    me 'pyasannakshatriyaya khalu vai yajnena yajamano yajate yasya trayastrigmshamantaryanti devatastasyantaryanti
    devatasu me 'pyasaditi khalu vai yajnena yajamano yajate yo vai stomanamavama ve~da paramatameva gacchati
    trivridvai stomanamavamastrivri ve~da paramatameva gacchati || saptadashamantaryanti catushcatvarigmshacca
    angiraso vai satramasata te suvargam nteshagm havishmagshca havishkricca ntavakamayetagm suvargam
    lo~kamiyaveti taveta ndviratramapashyata ntato vai tau suvargam ndviratrena yajate suvargameva lokameti
    tavaita mpurvenahna 'gacchata maharbhavati gatiruttara 'gnishtomah purvamaharbhavati tejastenava rundhe
    sarvastomo 'tiratra uttaragm sarvasya thsama bhavati tejo vai gayatri gayatri brahmavarcasa nteja
    eva brahmavarcasamatma ndhatte traishtubhamuttara ojo vai virya ntrishtugoja eva viryamatma vai~ rathantaramasyameva
    prati tishthati brihaduttare 'sau vai brihadamushyameva prati tishthati tadahuh kva jagati ca thsama
    bhavati tena jagatyai naiti shodashyuttare tenanushtubho manyatarasyahno viryamanu padyetetya nnanaiva
    'rdhamasayo rbhavato nanavirye bhavato havishmannidhana mpurvamaharbhavati havishkrinnidhana apo va
    idamagre salilamasi rvayurbhutva 'cara vi~shvakarma bhutva vyamatr 'prathata sa prithivyabhava tprithivyai
    prithivitva ssa devanasrijata vasu nte devah prajapatimabruva nprajayamaha iti so stapasa 'srikshyeva
    micchaddhvamiti tebhyo ''yatanena shramyateti te va~subhyo rudrebhya adityebhyah pra 'yacchannetagm
    rakshaddhvamiti tam va~savo rudra aditya arakshanta sa vasubhyo rudrebhya adityebhyah prajayatatrini
    ca shatani trayastrigmshata ncatha saiva sahasratamyabhava tte devah prajapatimabruvan thsahasrena
    no yajayeti so 'gnishtomena vasunayajaya ssa ukthyena rudranayajaya drudra ghatuka anayatana hi tasmadahu
    mahastriratrasya vi hi tadavairyateti traishtubha mmaddhyamasyahna ajya ya~nani suktani shagmsati
    shodashinagm shagmsatyahno dhritya ashithilambhavaya tasma gnishtoma eva prathamamahah syadathokthyo
    'tha vi~dhrityai trinitrini shata mavyavacchinnani dada manu santatyai dashata nnedvicchinadanityatha
    ya sahasratamyasi ttasyamindrashca vishnushca vyayacchetagm sa indro 'manyatanaya va idam va~rkshyata
    iti tasyamakalpeta ndvibhaga indrastritiye vishnustadva esha cyata ubha jigyathuriti tam eva shagmsatyatha
    ya sahasratami sa hotre deyeti hotaram va~ abhyatiricyate yadatiricyate hota 'na 'hurunnetre deyetyatirikta
    va esha sahasrasyatirikta unnetartvijamatha ''huruda kritya sa vasha ''hurbrahmane cagnidhe ca deyeti
    mbrahmane tritiyamagnidha aindro vai brahma vai 'gnidyathaiva tavakalpetamityatha ''hurya kalyani
    bahurupa sa deyetyatha ''hurya dvirupobhayataeni sa deyeti sahasrasya parigrihityai tadva eta 'yanagm
    sahasragg stotriya ssuvargasya lokasyabhijityai || saptacatvarigmshacca somo vai sahasramavinda ttamindro
    'nvavinda ttau yamo nyagaccha ttavabravidastu me ityabrutagm sa yama ekasyam va~ asya sahasrasya virya
    mbibhartiti tavabravidiya dyuvayoriti tavabrutagm sarve va etadetasyam 'gmshama haramaha iti tasyamagmshama
    'haranta tamaphsu pra thsomayodehiti sa rohini pingalaikahayani rupa nkritva trayastrigmshata ca tribhishca
    shatai drohinya pingalayaikahayanya soma nrohinya pingalayaikahayanya soma nkrinati trayastrigmshata
    caivasya tribhishca ssomah krito bhavati sukritena yajate tamaphsu praveshaya nnindrayodehiti sa rohini
    lakshmana pashthauhi vartraghni rupa nkritva trayastrigmshata ca tribhishca shatai ndadati trayastrigmshaccaivasya
    trini ca shatani sa datta bhavati tamaphsu praveshayan yamayodehiti sa jarati murkha tajjaghanya rupa
    nkritva trayastrigmshata ca tribhishca shatai nkurute trayastrigmshaccaivasya trini ca shatani sa
    'mushmi~lloke bhavati vageva sahasratami tasma ssa hi varah sahasramasya sa datta bhavati tasma dvaro
    na pratigrihya ssa hi varah sahasramasya pratigrihita va~ra iti bruyadathanya mbhavatyubhayataeni
    sya ttadahuranyata eni sya mparastadetamiti yaiva varah kalyani rupasamriddha sa kalyani rupasamriddha
    sa sya ssamriddhyai tamuttarena dronakalashamava ghrapayeda jighra kalasha mmahyurudhara payasvatya
    tva vishantvindava ssamudramiva sindhava ssa ma sahasra a bhaja prajaya pashubhih saha punarma ''vishata
    drayiriti prajayaivaina ardhayati prajava njuhuyadubha jigyathurna para jayethe na para jigye katarashcanainoh
    | indrashca vishno yadapaspridhetha vai~ triratre sahasragm sahasrimevaina nkaroti sahasrasyaivaina
    karoti rupani juhoti nkaroti rupani juhoti rupairevainagm samardhayati tasya upotthaya karnama japedide
    rante 'dite sarasvati priye preyasi mahi vishrutyetani te aghniye namani sukrita mma deveshu brutaditi
    devebhya evainama vedayatyanvena ndeva buddhyante || mekannacatvarigmshacca sahasratamya vai yajamana
    lo~kameti sainagm suvargam ngamayati sa ma suvargam ngamayetyaha suvargamevainam ngamayati sa ma jyotishmantam
    ngamayetyaha jyotishmantamevainam ngamayati sa ma sarva ngamayetyaha sarvanevaina ngamaya prajaya
    pashubhih saha punarma drayiriti prajayaivaina mprati shthapayati prajava ve~da tamagnidhe va brahmane
    va hotre vodgatre va 'ddhvaryave va dadya thsahasramasya sa datta bhavati sahasramasya pratigrihita
    mbhavati yastamavidva npratigrihnati ta mpratigrihniyadeka mprati grihnami na sahasrameka ma bhuta
    '' visha ma sahasramityekamevaina mpratigrihnati na sahasram 'si sushada susheva syona ma ''visha
    sushada ma ''visha susheva ma ''vishe tyaha syonaivainagm sushada susheva bhuta '' vishati nainagm
    hinasti brahmavadino vadanti sahasragm sahasratamyanveti sahasratamigm sahasra thsahasragm sahasratamyanviya
    thsahasramaprajnatragm suvargam muthsrijati tagm sahasramanu paryavartate sa prajanati suvargam thsrijati
    kshipre sahasra mpra jayata uttama niyate atriradadadaurvaya praja mputrakamaya sa riricano shshithilo
    yatayama sa eta ttenayajata tato vai tasya catvaro vira a 'jayanta suhota su dgata svaddhvaryu shcaturatrena
    yajata a 'sya catvaro vira jayante suhota su dgata svaddhvaryu ssusabheyo ye caturvigmshah pavamana
    brahmavarcasa ssa 'trigg shraddhadevam ncatvari viryani nopa mannadyagm sa etag shcaturashcatushtoman
    ttairayajata teja eva prathamena 'varundhendriya ndvitiyena brahmavarcasa ntritiyenannadya shcaturashcatushtoman
    thsomanaharati tairyajate teja eva prathamenava rundha indriya ndvitiyena brahmavarcasa ncaturthena
    yamevatrir riddhimardhno ttameva yajamana riddhnoti || jamadagnih pushtikama tpalitau jamadagniyau
    na sa njanate etaneva posha shcaturatrena yajate purodashinya upasado bhavanti pashavo vai purodashah
    pashunevava rundhe 'nnam 'nnamevava rundhe 'nnadah pashuma shcaturatrena yajate || rashtacatvarigmshat
    va~thsaro va idameka asi mpancaratramapashya ttenayajata tato vai sa ritunasrijata ya evam npancaratrena
    yajate praiva jayate ta ritavah srishta na vyavartanta ta eta mpancaratramapashya ntenayajanta tato
    vai te vyavartanta npancaratrena yajate vi papmana bhratrivyena '' vartate sarvaseni 'yajata tato
    vai sa sahasra npancaratrena yajate pra sahasra pnoti babarah pravahani rakamayata vacah pravadita
    syamiti sa eta yajata tato vai sa vacah pravadita npancaratrena yajate pravaditaiva vaco bhavatyatho
    enam 'tha va esha sapranti yajno ya tpancaratro ya evam npancaratrena yajate sampratyeva yajnena yajate
    pancaratro bhavati panca va ritavah sam va~thsare prati tishthatyatho panca kshara panktih pankto
    yajno yajnamevava rundhe trivridagnishtomo bhavati teja evava rundhe pancadasho bhavatindriyamevava
    rundhe saptadasho bhavatyannadyasya varuddhya atho praiva tena jayate pancavigmsho 'gnishtomo bhavati
    prajapateraptyai mahavratava 'tiratro bhavati sarvasyabhijityai || pravadita syamiti sa eta devasyatva
    savituh prasave bhyama dada imamagribhna nrashanamritasya purva ayushi vidatheshu kavya | taya deva
    thsaramarapanti || abhidha asi bhuvanamasi yanta ngaccha svahakritah prithivyam 'si dharunah krishyai
    tva kshemaya tva rayyai tva poshaya tva prithivyai tva 'ntarikshaya tva dive tva sate tva 'sate tvadbhyastvau
    shadhibhyastva vishve bhyastva bhutebhyah || vibhurmatra prabhuh pitrashvo 'si saptirasi vajyasi vrisha
    'si nrimana asi yayurnama mpatvanvihyagnaye svaha svahe ndragnibhyag svaha prajapataye svaha vishve
    ssvaha bhurasi bhuve tva bhavyaya tva bhavishyate tva vishve bhyastva bhutebhyo deva ashapala eta
    mmedhaya prokshita ayanaya svaha prayanaya svaho ddravaya svahoddrutaya svaha shukaraya svaha shukritaya
    svaha palayitaya svaha ''palayitaya svaha ''valgate svaha paravalgate svaha ''yate svaha prayate svaha
    sarvasmai svaha ayanayottaramapalayitaya shadvigmshatih agnaye svaha somaya svaha vayave svaha 'pa
    mmodaya svaha savitre svaha sarasvatyai svahe ndraya svaha brihaspataye svaha mitraya svaha varunaya
    svaha sarvasmai svaha mmodayendraya trayovigmshatih prithivyai svaha 'ntarikshaya svaha dive svaha
    suryaya svaha candramase svaha nakshatrebhya ssvaha pracyai dishe svaha dakshinayai dishe svaha praticyai
    dishe svaho cyai dishe svahordhvayai dishe svaha digbhya ssvaha 'vantaradishabhya ssvaha 'horatrebhya
    va~thsaraya svaha sarvasmai svaha prithivyai suryaya nakshatrebhyah pracyai saptacatvarigmshat agnaye
    svaha somaya svaha savitre svaha sarasvatyai svaha pushne svaha brihaspataye svaha 'pa mmodaya svaha
    vayave svaha mitraya svaha varunaya svaha sarvasmai svaha agnaye savitre pushne mmodaya vayave trayovigmshatih
    prithivyai svaha 'ntarikshaya svaha dive svaha 'gnaye svaha somaya svaha suryaya svaha candramase
    svaha 'hne svaha ratriyai svaharjave svaha sadhave svaha sukshityai svaha kshudhe svaha ''shitimne
    svaha rogaya svaha himaya svaha shitaya svaha ''tapaya svaha 'ranyaya svaha suvargaya svaha lokaya
    svaha sarvasmai svaha 'hne ratriyai catushcatvarigmshat rdevataya gayatrena tva chandasa yunajmi vasantena
    tvartuna havisha dikshayami rudrebhi rdevataya traishtubhena tva chandasa yunajmi grishmena tvartuna
    havisha dikshaya rdevataya jagatena tva chandasa yunajmi varshabhistvartuna havisha dikshayami vishvebhi
    rdevataya ''nushtubhena tva chandasa yunajmi tvartuna havisha dikshayamyangirobhi rdevataya panktena
    tva chandasa yunajmi hemantashishirabhya ntvartuna havisha dikshayamya ndikshamaruhamritasya patni
    ngayatrena chandasa brahmana cartagm satye anushtubhena tva chandasa yunajmye nkritaya svaha krandate
    svaha 'vakrandate svaha prothate svaha praprothate svaha gandhaya svaha vyanaya svaha 'panaya svaha
    sandiyamanaya svaha sanditaya svaha vicrityamanaya svaha vicrittaya svaha palayishyamanaya svaha palayitaya
    svahoparagg syate svahoparataya svaha nivekshyate svaha nivishamanaya svaha nivishtaya svaha nishathsyate
    svaha nishidate svaha nishannaya svaha ''sishyate svaha ''sinaya svaha ''sitaya svaha nipathsyate
    svaha nipadyamanaya svaha nipannaya svaha shayishyate svaha shayanaya svaha shayitaya svaha sammilishyate
    svaha samim la~te svaha sammilitaya svaha svapate svaha suptaya svaha prabhothsyate svaha prabuddhyamanaya
    svaha prabuddhaya svaha jagarishyate svaha jagrate svaha jagaritaya svaha shushrushamanaya svaha shrinvate
    svaha shrutaya svaha vikshishyate svaha vikshamanaya svaha vikshamanaya svaha vikshitaya svaha sagmhasyate
    svaha sajimhanaya svaho jjihanaya svaha vivarthsyate svaha vivartamanaya svaha vivrittaya svaho tthasyate
    svahottishthate svahotthitaya svaha vidhavishyate svaha vidhunvanaya svaha vidhutaya svaho syate svahotkramate
    svahotkra ntaya svaha cankramishyate svaha cankramyamanaya svaha cankramitaya svaha kanduyishyate
    svaha kanduyamanaya svaha kanduyitaya svaha nikashishyate svaha nikashamanaya svaha nikashitaya svaha
    yadatti tasmai svaha ya tpibati tasmai svaha yanmehati tasmai svaha yacchakri tkaroti tasmai svaha
    retase svaha prajananaya svaha sarvasmai svaha vikshishyate svaha nikashamanaya svaha agnaye svaha
    vayave svaha suryaya svaharta masyritasyartamasi satyamasi satyasya satya masyritasya pantha asi devana
    mprajapatirasyadhi yadasmin vajiniva shubha 'po vrinanah pavate kavya nna gopa iryah parijma || agnaye
    vayave suryaya gnaye vayave suryaya || harih om || || krishna yajurvediya taittiriya samhitayam saptamakande
    prathamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां सप्तमकाण्डे प्रथमः प्रश्नः अश्वमेधगतमन्त्राणामभिधानं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ प्र॒जन॑न॒ ञ्ज्योति॑र्वि॒राट् छन्द॑सा॒ न्ति॑ष्ठते वि॒राज॑म॒भि सम्प॑द्यते॒
    तस्मा॒ त्तज्ज्योति॑रुच्यते॒ द्वौ स्तोमौ ऽपा॒नश्च॒ द्वौ माद्ध्य॑दिन्न॒ग्ं॒ सव॑नं॒ यँथा॒ चक्षु॑श्च॒
    श्रोत्र॑ ञ्च॒ द्वौ तृ॑तीयसव॒नं यँथा॒ वाक्च॑ प्रति॒ष्ठा च॒ पुरु॑षसम्मितो॒ वा ए॒ष य॒ज्ञो ङ्का॒मय॑ते॒
    तमे॒तेना॒भ्य॑श्ञुते॒ सर्व॒ग्ग्॒ ह्यस्थू॑रिणा ऽग्निष्टो॒मेन॒ वै प्र॒जाप॑तिः प्र॒जा अ॑सृजत॒ ता अ॑ग्निष्टो॒मेनै॒व
    पर्य॑गृह्णा॒ ऽत्य॑प्रवत॒ तस्या॑नु॒हाय॒रेत॒ आ द्ग॑र्द॒भे न्य॑मा॒र् द्गर्द॒भो द्वि॒रेता॒ अथो॑ आहु॒र्वड॑बाया॒
    न्न्य॑मा॒र्डिति॒ तस्मा॒ द्वड॑बा द्वि॒रेता॒ अथो॑ आहु॒ न्य॑मा॒र्डिति॒ तस्मा॒दोष॑ध॒यो ऽन॑भ्यक्ता रेभ॒न्त्यथो॑
    आहुः प्र॒जासु॒ न्य॑मा॒र्डिति॒ तस्मा द्य॒मौ जा॑येते॒ तस्मा॑दश्वत॒रो न प्र जा॑यत॒ आत्त॑रेता॒ हि तस्मा
    द्ब॒र्॒हिष्यन॑वकॢप्त स्सर्ववेद॒से वा॑ स॒हस्रे॒ वा ऽति॒ ह्यप्र॑वत॒ य ए॒वं विँ॒द्वान॑ग्निष्टो॒मेन॒ यज॑ते॒
    प्राजा॑ताः प्र॒जा ज॒नय॑ति॒ परि॒ प्रजा॑ता गृह्णाति॒ तस्मा॑दाहुर्ज्येष्ठय॒ज्ञ इति॑ प्र॒जाप॑ति॒र्वाव
    ज्येष्ठ॒ ऽय॑जत प्र॒जाप॑तिरकामयत॒ प्र जा॑ये॒येति॒ स मु॑ख॒तस्त्रि॒वृत॒ न्निर॑मिमीत॒ तम॒ग्निर्दे॒वता
    ऽन्व॑सृज्यत गाय॒त्री छन्दो॑ रथन्त॒रग्ं साम॑ ब्राह्म॒णो म॑नु॒ष्या॑णाम॒जः प॑शू॒ना त्ते मुख्या॑ मुख॒तो
    ह्यसृ॑ज्य॒न्तोर॑सो बा॒हुभ्या न्निर॑मिमीत॒ तमिन्द्रो॑ दे॒वता ऽन्व॑सृज्यत त्रि॒ष्टु थ्साम॑ राज॒न्यो॑
    मनु॒ष्या॑णा॒मविः॑ पशू॒ना त्ते वी॒र्या॑वन्तो वी॒र्या द्ध्यसृ॑ज्यन्त मद्ध्य॒त विँश्वे॑ दे॒वा दे॒वता॒
