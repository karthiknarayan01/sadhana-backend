id: kushapamarjanastotram
category: stotram
name:
  english: kushapamarjanastotram
  devanagari: कुशापमार्जनस्तोत्रम्
content:
  english: jvalatpavakalocana | vajradhikanakhasparsha divyasimha namo'stu te || 13|| kashyapayatihrasvaya
    rigyajuhsamabhushita | tubhyam vamanarupaya'kramate gam namo namah || 14|| varahasheshadushtani sarvapapaphalani
    vai | mardda mardda mahadamshtra marda marda ca yatphalam || 15|| narasimha karalasya dantaprantanalojjvala
    | bhanja bhanca ninadena dushtanpashyartinashana || 16|| rigyajuhsamagarbhabhirvagbhirvamanarupadhrik
    | prashamam sarvaduhkhani nayatvasya janarddanah || 17|| aikahikam dvyahikanca tatha tridivasam jvaram
    | caturthakam tathatyugram tathaiva satatajvaram || 18|| doshottham sannipatottham tathaivagantukam
    jvaram | shamam nayashu govinda chindhi chindhyasya vedanam || 19|| netraduhkham shiroduhkham duhkhancodarasambhavam
    | antah shvasamatishvasam paritapam savepathum || 20|| gudaghrananghrirogamshca kushtharogamstatha
    kshayam | kamaladimstatha rogan pramehamshcatidarunan || 21|| bhagandaratisaramshca mukharoga~shca
    valgulim | ashmarim mutrakricchramshca rogananyamshca darunan || 22|| ye vataprabhava roga ye ca pittasamudbhavah
    | kaphodbhavashca ye kecit ye canye sannipatikah || 23|| agantukashca ye roga luta visphotakadayah
    | te sarve prashamam yantu vasudevapamarjitah || 24|| vilayam yantu te sarve vishnoruccaranena ca
    | kshayam gacchantu casheshaste catrabhihata hareh || 25|| acyutanantagovindanamoccaranabheshijat
    | nashyantu sakala rogah satyam styam vadamyaham || 26|| sthavaram jangamam vapi kritrimancapi yadvisham
    | dantodbhavam nakhabhavamakashaprabhavam visham || 27|| lutadiprabhavam yacca vishamanyattu duhkhadam
    | shamam nayatu tatsarvam kirttito'sya janarddanah || 28|| grahan pretagrahamshcapi tatha vai dakinigrahan
    | vetalamshca pishacamshca gandharvan yaksharakshasan || 29|| shakuniputanadyamshca tatha vainayakan
    grahan | mukhamandim tatha kruram revatim vriddharevatim || 30|| vriddhakakhyan grahamshcogramstatha
    matrigrahanapi | balasya vishnoshcaritam hantu balagrahaniman || 31|| vriddhashca ye grahah kecidye
    ca balagrahah kvacit | narasimhasya te drishtya dagdha ye capi yauvane || 32|| sada karalavadano narasimho
    mahabalah | grahanasheshannihsheshan karotu jagato hitah || 33|| narasimha mahasimha jvalamalojjvalanana
    | grahanasheshan sarvesha khada khadagnilocana || 34|| ye roga ye mahotpata yadvisham ye mahagrahah
    | yani ca krurabhutani grahapidashca darunah || 35|| shastrakshateshu ye dosha jvalagardabhakadayah
    | tani sarvani sarvatma paramatma janarddanah || 36|| kincidrupam samasthaya vasudevasya nashaya |
    kshiptva sudarshanancakram jvalamalatibhishanam || 37|| sarvadushtopashamanam kuru devavaracyuta |
    sudarshana mahajvala chindhi chindhi maharava || 38|| sarvadushtani rakshamsi kshayam yantu vibhishana
    | pracyam praticyam ca dishi dakshinottaratastatha || 39|| rakshankarotu sarvatma narasimhah sugarjjitah
    | divi bhuvyantarikshe ca prishthatah parshvato'gratah || 40|| rakshankarot bhagavan bahurupi janarddanah
    | yatha vishnurjjagatsarvam sadevasuramanusham || 41|| tena satyena dushtani samamasya vrajantu vai
    | yatha vishnau smrite sadyah sankshayam yanti patakah || 42|| satyena tena sakalam dushtamasya prashamyatu
    | yatha yajneshvaro vishnurddeveshvapi hi giyate || 43|| tena satyena sakalam dushtamasya prashamyatu
    | shantirastu shivancastu dushtamasya prashamyatu || 44|| vasudevasharirotthaih kushairnnirmmathitam
    maya | apamarjati govindo naro narayanastatha || 45|| tathastu sarvadukhanam prashamo vacanaddhareh
    | apamarjanakam shastram sarvarogadivaranam || 46|| aham harih kusha vishnurhata roga maya tava ||
    47|| ityadimahapurane agneye kushapamarjanam nama ekatrimsho'dhyayah | agnipurana | adhyaya 31
  devanagari: ज्वलत्पावकलोचन । वज्राधिकनखस्पर्श दिव्यसिंह नमोऽस्तु ते ॥ १३॥ काश्यपायातिह्रस्वाय ऋग्यजुःसामभूषित
    । तुभ्यं वामनरूपायाऽक्रमते गां नमो नमः ॥ १४॥ वराहाशेषदुष्टानि सर्वपापफलानि वै । मर्द्द मर्द्द महादंष्ट्र
    मर्द मर्द च यत्फलम् ॥ १५॥ नरसिंह करालास्य दन्तप्रान्तानलोज्ज्वल । भञ्ज भञ्च निनादेन दुष्टान्पश्यार्तिनाशन
    ॥ १६॥ ऋग्यजुःसामगर्भाभिर्वाग्भिर्वामनरूपधृक् । प्रशमं सर्वदुःखानि नयत्वस्य जनार्द्दनः ॥ १७॥ ऐकाहिकं
    द्व्याहिकञ्च तथा त्रिदिवसं ज्वरम् । चातुर्थकं तथात्युग्रं तथैव सततज्वरम् ॥ १८॥ दोषोत्थं सन्निपातोत्थं
    तथैवागन्तुकं ज्वरम् । शमं नयाशु गोविन्द छिन्धि छिन्ध्यस्य वेदनाम् ॥ १९॥ नेत्रदुःखं शिरोदुःखं दुःखञ्चोदरसम्भवम्
    । अन्तः श्वासमतिश्वासं परितापं सवेपथुम् ॥ २०॥ गुदघ्राणाङ्घ्रिरोगांश्च कुष्ठरोगांस्तथा क्षयम् । कामलादींस्तथा
    रोगान् प्रमेहांश्चातिदारुणान् ॥ २१॥ भगन्दरातिसारांश्च मुखरोगाँश्च वल्गुलीम् । अश्मरीं मूत्रकृच्छ्रांश्च
    रोगानन्यांश्च दारुणान् ॥ २२॥ ये वातप्रभवा रोगा ये च पित्तसमुद्भवाः । कफोद्भवाश्च ये केचित् ये चान्ये
    सान्निपातिकाः ॥ २३॥ आगन्तुकाश्च ये रोगा लूता विस्फोटकादयः । ते सर्वे प्रशमं यान्तु वासुदेवापमार्जिताः
    ॥ २४॥ विलयं यान्तु ते सर्वे विष्णोरुच्चारणेन च । क्षयं गच्छन्तु चाशेषास्ते चात्राभिहता हरेः ॥ २५॥
    अच्युतानन्तगोविन्दनामोच्चारणभेषिजात् । नश्यन्तु सकला रोगाः सत्यं स्त्यं वदाम्यहम् ॥ २६॥ स्थावरं जङ्गमं
    वापि कृत्रिमञ्चापि यद्विषम् । दन्तोद्भवं नखभवमाकाशप्रभवं विषम् ॥ २७॥ लूतादिप्रभवं यच्च विषमन्यत्तु
    दुःखदम् । शमं नयतु तत्सर्वं कीर्त्तितोऽस्य जनार्द्दनः ॥ २८॥ ग्रहान् प्रेतग्रहांश्चापि तथा वै डाकिनीग्रहान्
    । वेतालांश्च पिशाचांश्च गन्धर्वान् यक्षराक्षसान् ॥ २९॥ शकुनीपूतनाद्यांश्च तथा वैनायकान् ग्रहान् ।
    मुखमण्डीं तथा क्रूरां रेवतीं वृद्धरेवतीम् ॥ ३०॥ वृद्धकाख्यान् ग्रहांश्चोग्रांस्तथा मातृग्रहानपि ।
    बालस्य विष्णोश्चरितं हन्तु बालग्रहानिमान् ॥ ३१॥ वृद्धाश्च ये ग्रहाः केचिद्ये च बालग्रहाः क्वचित् ।
    नरसिंहस्य ते दृष्ट्या दग्धा ये चापि यौवने ॥ ३२॥ सदा करालवदनो नरसिंहो महाबलः । ग्रहानशेषान्निःशेषान्
    करोतु जगतो हितः ॥ ३३॥ नरसिंह महासिंह ज्वालामालोज्ज्वलानन । ग्रहानशेषान् सर्वेश खाद खादाग्निलोचन ॥
    ३४॥ ये रोगा ये महोत्पाता यद्विषं ये महाग्रहाः । यानि च क्रूरभूतानि ग्रहपीडाश्च दारुणाः ॥ ३५॥ शस्त्रक्षतेषु
    ये दोषा ज्वालागर्दभकादयः । तानि सर्वाणि सर्वात्मा परमात्मा जनार्द्दनः ॥ ३६॥ किञ्चिद्रूपं समास्थाय
    वासुदेवास्य नाशय । क्षिप्त्वा सूदर्शनञ्चक्रं ज्वालामालातिभीषणम् ॥ ३७॥ सर्वदुष्टोपशमनं कुरु देववराच्युत
    । सुदर्शन महाज्वाल छिन्धि छिन्धि महारव ॥ ३८॥ सर्वदुष्टानि रक्षांसि क्षयं यान्तु विभीषण । प्राच्यां
    प्रतीच्यां च दिशि दक्षिणोत्तरतस्तथा ॥ ३९॥ रक्षाङ्करोतु सर्वात्मा नरसिंहः सुगर्ज्जितः । दिवि भुव्यन्तरीक्षे
    च पृष्ठतः पार्श्वतोऽग्रतः ॥ ४०॥ रक्षाङ्करोत् भगवान् बहुरूपी जनार्द्दनः । यथा विष्णुर्ज्जगत्सर्वं सदेवासुरमानुषम्
    ॥ ४१॥ तेन सत्येन दुष्टानि सममस्य व्रजन्तु वै । यथा विष्णौ स्मृते सद्यः सङ्क्षयं यान्ति पातकाः ॥ ४२॥
    सत्येन तेन सकलं दुष्टमस्य प्रशाम्यतु । यथा यज्ञेश्वरो विष्णुर्द्देवेष्वपि हि गीयते ॥ ४३॥ तेन सत्येन
    सकलं दुष्टमस्य प्रशाम्यतु । शान्तिरस्तु शिवञ्चास्तु दुष्टमस्य प्रशाम्यतु ॥ ४४॥ वासुदेवशरीरोत्थैः कुशैर्न्निर्म्मथितं
    मया । अपमार्जति गोविन्दो नरो नारायणस्तथा ॥ ४५॥ तथास्तु सर्वदुखानां प्रशमो वचनाद्धरेः । अपमार्जनकं
    शस्त्रं सर्वरोगादिवारणम् ॥ ४६॥ अहं हरिः कुशा विष्णुर्हता रोगा मया तव ॥ ४७॥ इत्यादिमहापुराणे आग्नेये
    कुशापमार्जनं नाम एकत्रिंशोऽध्यायः । अग्निपुराण । अध्याय ३१
