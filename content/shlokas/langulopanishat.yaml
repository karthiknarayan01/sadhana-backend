id: langulopanishat
category: upanishad
name:
  english: langulopanishat
  devanagari: लान्गूलोपनिषत्
content:
  english: tattvampadashodhanartham jape viniyogah | om bhuh namo bhagavate davanalakalagnihanumate angushthabhyam
    namah | om bhuvah namo bhagavate candapratapahanumate tarjanibhyam namah | om svah namo bhagavate
    cintamanihanumate madhyamabhyam namah | om mahah namo bhagavate patalagarudahanumate anamikabhyam
    namah | om janah namo bhagavate kalagnirudrahanumate kanishthikabhyam namah | om tapah satyam namo
    bhagavate bhadrajativikatarudravirahanumate karatalakaraprishthabhyam namah | om bhuh namo bhagavate
    davanalakalagnihanumate hridayaya namah | om bhuvah namo bhagavate candapratapahanumate shirase svaha
    | om svah namo bhagavate cintamanihanumate shikhayai vashat | om mahah namo bhagavate patalagarudahanumate
    kavacaya hum | om janah namo bhagavate kalagnirudrahanumate netratrayaya vaushat | om tapah satyam
    namo bhagavate bhadrajativikatarudravirahanumate astraya phat | atha dhyanam | vajrangam pinganetram
    kanakamayalasatkundalakrantagandam dambholistambhasarapraharanavivashibhutaraksho'dhinatham | udyallangulagharshapracalajalanidhim
    bhimarupam kapindram dhyayantam ramacandram plavagaparivridham satvasaram prasannam || iti manasopacaraih
    sampujya | om namo bhagavate davanalakalagnihanumate jayashriyo jayajivitaya dhavalikritajagattraya
    vajradeha vajrapuccha vajrakaya vajratunda vajramukha vajranakha vajrabaho vajraroma vajranetra vajradanta
    vajrasharira sakalatmakaya bhimakara pingalaksha ugra pralayakalaraudra virabhadravatara sharabhasaluvabhairavadordanda
    lankapuridahana udadhilanghana dashagrivakritanta sitavishvasa ishvaraputra anjanagarbhasambhuta udayabhaskarabimbanalagrasaka
    devadanavarishimunivandya pashupatastrabrahmastrabailavastranarayanastrakalashaktikastradandakastra
  devanagari: तत्त्वम्पदशोधनार्थं जपे विनियोगः । ॐ भूः नमो भगवते दावानलकालाग्निहनुमते अङ्गुष्ठाभ्यां नमः
    । ॐ भुवः नमो भगवते चण्डप्रतापहनुमते तर्जनीभ्यां नमः । ॐ स्वः नमो भगवते चिन्तामणिहनुमते मध्यमाभ्यां
    नमः । ॐ महः नमो भगवते पातालगरुडहनुमते अनामिकाभ्यां नमः । ॐ जनः नमो भगवते कालाग्निरुद्रहनुमते कनिष्ठिकाभ्यां
    नमः । ॐ तपः सत्यं नमो भगवते भद्रजातिविकटरुद्रवीरहनुमते करतलकरपृष्ठाभ्यां नमः । ॐ भूः नमो भगवते दावानलकालाग्निहनुमते
    हृदयाय नमः । ॐ भुवः नमो भगवते चण्डप्रतापहनुमते शिरसे स्वाहा । ॐ स्वः नमो भगवते चिन्तामणिहनुमते शिखायै
    वषट् । ॐ महः नमो भगवते पातालगरुडहनुमते कवचाय हुम् । ॐ जनः नमो भगवते कालाग्निरुद्रहनुमते नेत्रत्रयाय
    वौषट् । ॐ तपः सत्यं नमो भगवते भद्रजातिविकटरुद्रवीरहनुमते अस्त्राय फट् । अथ ध्यानम् । वज्राङ्गं पिङ्गनेत्रं
    कनकमयलसत्कुण्डलाक्रान्तगण्डं दम्भोलिस्तम्भसारप्रहरणविवशीभूतरक्षोऽधिनाथम् । उद्यल्लाङ्गूलघर्षप्रचलजलनिधिं
    भीमरूपं कपीन्द्रं ध्यायन्तं रामचन्द्रं प्लवगपरिवृढं सत्वसारं प्रसन्नम् ॥ इति मानसोपचारैः सम्पूज्य
    । ॐ नमो भगवते दावानलकालाग्निहनुमते जयश्रियो जयजीविताय धवलीकृतजगत्त्रय वज्रदेह वज्रपुच्छ वज्रकाय वज्रतुण्ड
    वज्रमुख वज्रनख वज्रबाहो वज्ररोम वज्रनेत्र वज्रदन्त वज्रशरीर सकलात्मकाय भीमकर पिङ्गलाक्ष उग्र प्रलयकालरौद्र
    वीरभद्रावतार शरभसालुवभैरवदोर्दण्ड लङ्कापुरीदाहन उदधिलङ्घन दशग्रीवकृतान्त सीताविश्वास ईश्वरपुत्र अञ्जनागर्भसम्भूत
    उदयभास्करबिम्बानलग्रासक देवदानवऋषिमुनिवन्द्य पाशुपतास्त्रब्रह्मास्त्रबैलवास्त्रनारायणास्त्रकालशक्तिकास्त्रदण्डकास्त्र
