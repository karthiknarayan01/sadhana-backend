id: krishna-22
category: stotram
name:
  english: krishna 22
  devanagari: क्रिश्न २२
content:
  english: shrikrishnasya dvavimshatyaksharatmko mantrah shri ganeshaya namah | shaunaka uvaca | kam mantram
    balakah prapa kumarena ca dhimata | dattam param shrihareshca tadbhavan vaktumarhati || 1|| sautiruvaca
    | krishnena datto goloke kripaya brahmane pura | dvavimshatyaksharo mantro vedeshu ca sudurlabhah
    || 2|| tam ca brahma dadau bhaktya kumaraya ca dhimate | kumarena sa dattashca mantrashca shishave
    dvija || 3|| om shrim namo bhagavate rasamandaleshvaraya | shrikrishnaya svaheti ca mantro'yam kalpapadayah
    || 4|| mahapurushastotram ca purvoktam kavacam ca yat | asyaupayogikam dhyanam samavedoktameva ca
    || 5|| tejomandalarupe ca suryakotisamaprabhe | yogibhirvanchitam dhyane yogaih siddhaganaih suraih
    || 6|| dhyayante vaishnava rupam tadabhyantarasannidhau | ativakamaniyanirvacaniyam manoharam || 7||
    navinajaladashyamam sharatpankajalocanam | sharatparvanacandrasyam pakvavimbadhikadharam || 8|| muktapanktivinindyekadantapanktimanoharam
    | sasmitam muralinyastahastavalambanena ca || 9|| kotikandarpalavanyaliladhama manoharam | candralakshaprabhajushtam
    pushta shriyuktavigraham || 10|| tribhangabhangimayuktam dvibhujam pitavasasam | ratnakeyuravalayaratna
    nupurabhushitam || 11|| ratnakundalayugmena gandasthalavirajitam | mayurapicchacudam ca ratnamalavibhushitam
    || 12|| shobhitam januparyantam malativanamalaya | candanokshitasarvangam bhaktanugrahakarakam ||
    13|| maninakaustubhendrenavakshah sthalasamujjvalam | vikshitam gopikabhishca shashvadvankimalocanaih
    || 14|| sthirayauvanayuktabhirveshtitabhishca santatam | bhushanairbhushitabhishca radhavakshah sthalasthitam
    || 15|| brahmavishnushivadyaishca pujitam vanditam stutam | kishoram radhikakantam shantarupam paratparam
    || 16|| nirliptam sakshirupam ca nirgunam prakriteh param | dhyayet sarveshvaram tam ca paramatmanamishvaram
    || 17|| idam te kathitam dhyanam stotram ca kavacam mune | mantraupayogikam satyam mantrashca kalpapadapah
    || 18|| || shrikrishnasya dvavimshatyaksharo mantro dhyanam ca sampurnam ||
  devanagari: श्रीकृष्णस्य द्वाविंशत्यक्षरात्म्को मन्त्रः श्री गणेशाय नमः । शौनक उवाच । कं मन्त्रं बालकः
    प्राप कुमारेण च धीमता । दत्तं परं श्रीहरेश्च तद्भवान् वक्तुमर्हति ॥ १॥ सौतिरुवाच । कृष्णेन दत्तो गोलोके
    कृपया ब्रह्मणे पुरा । द्वाविंशत्यक्षरो मन्त्रो वेदेषु च सुदुर्लभः ॥ २॥ तं च ब्रह्मा ददौ भक्त्या कुमाराय
    च धीमते । कुमारेण स दत्तश्च मन्त्रश्च शिशवे द्विज ॥ ३॥ ॐ श्रीं नमो भगवते रासमण्डलेश्वराय । श्रीकृष्णाय
    स्वाहेति च मन्त्रोऽयं कल्पपादयः ॥ ४॥ महापुरुषस्तोत्रं च पूर्वोक्तं कवचं च यत् । अस्यौपयोगिकं ध्यानं
    सामवेदोक्तमेव च ॥ ५॥ तेजोमण्डलरूपे च सूर्यकोटिसमप्रभे । योगिभिर्वाञ्छितं ध्याने योगैः सिद्धगणैः सुरैः
    ॥ ६॥ ध्यायन्ते वैष्णवा रूपं तदभ्यन्तरसन्निधौ । अतीवकमनीयानिर्वचनीयं मनोहरम् ॥ ७॥ नवीनजलदश्यामं शरत्पङ्कजलोचनम्
    । शरत्पार्वणचन्द्रास्यं पक्वविम्बाधिकाधरम् ॥ ८॥ मुक्तापङ्क्तिविनिन्द्येकदन्तपङ्क्तिमनोहरम् । सस्मितं
    मुरलीन्यस्तहस्तावलम्बनेन च ॥ ९॥ कोटिकन्दर्पलावण्यलीलाधाम मनोहरम् । चन्द्रलक्षप्रभाजुष्टं पुष्ट श्रीयुक्तविग्रहम्
    ॥ १०॥ त्रिभङ्गभङ्गिमायुक्तं द्विभुजं पीतवाससम् । रत्नकेयूरवलयरत्न नूपुरभूषितम् ॥ ११॥ रत्नकुण्डलयुग्मेन
    गण्डस्थलविराजितम् । मयूरपिच्छचूडं च रत्नमालाविभूषितम् ॥ १२॥ शोभितं जानुपर्यन्तं मालतीवनमालया । चन्दनोक्षितसर्वाङ्गं
    भक्तानुग्रहकारकम् ॥ १३॥ मणिनाकौस्तुभेन्द्रेणवक्षः स्थलसमुज्ज्वलम् । वीक्षितं गोपिकाभिश्च शश्वद्वङ्किमलोचनैः
    ॥ १४॥ स्थिरयौवनयुक्तभिर्वेष्टिताभिश्च सन्ततम् । भूषणैर्भूषिताभिश्च राधावक्षः स्थलस्थितम् ॥ १५॥ ब्रह्मविष्णुशिवाद्यैश्च
    पूजितं वन्दितं स्तुतम् । किशोरं राधिकाकान्तं शान्तरूपं परात्परम् ॥ १६॥ निर्लिप्तं साक्षिरूपं च निर्गुणं
    प्रकृतेः परम् । ध्यायेत् सर्वेश्वरं तं च परमात्मानमीश्वरम् ॥ १७॥ इदं ते कथितं ध्यानं स्तोत्रं च कवचं
    मुने । मन्त्रौपयोगिकं सत्यं मन्त्रश्च कल्पपादपः ॥ १८॥ ॥ श्रीकृष्णस्य द्वाविंशत्यक्षरो मन्त्रो ध्यानं
    च सम्पूर्णम् ॥
