id: bagalamukhikavacam-2
category: kavacha
name:
  english: bagalamukhikavacam 2
  devanagari: बगलामुखीकवचम् २
content:
  english: hrimsvaha || shiro me patu om hrim aim shrim klim patu lalatakam | sambodhanapadampatu netre
    shribagalanane || 1|| shrutau mama ripumpatu nasikannashaya dvayam | patu gandau sada mamaishvaryanyantantu
    mastakam || 2|| dehi dvandvam sada jihvampatu shighra~ vaco mama | kanthadesham sa nah patu vanchitambahumulakam
    || 3|| karyam sadhaya dvandvantu karau patu sada mama | mayayukta tatha svaha hridayampatu sarvada
    || 4|| ashtadhikacatvarimshadandadhya bagalamukhi | rakshankarotu sarvatra grihe'ranye sada mama ||
    5|| brahmastrakhyo manuh patu sarvange sarvasandhishu | mantrarajah sada rakshankarotu mama sarvada
    || 6|| om hrim patu nabhideshame katime bagalavatu | mukhi varnadvayampatu lingame mushkayugmakam
    || 7|| januni sarvadushtanampatu me varnapancakam | vacamukhantatha padam shadvarna parameshvari ||
    8|| janghayugme sada patu bagala ripumohini | stambhayeti padamprishthampatuvarnatrayamama || 9||
    jihva~ varnadvayampatu gulphau me kilayeti ca | padodrdhvam sarvada patu buddhim padatale mama ||
    10|| vinashayapadam patu padangulyornnakhani me | hrim bijam sarvada patu buddhindriyavacamsi me ||
    11|| sarvangampranavah patu svaha romani me'vatu | brahmi purvadale patu cagneyam vishnuvallabha ||
    12|| maheshi dakshine patu camunda rakshase'vatu | kaumari pashcime patu vayavye caparajita || 13||
    varahi cottare patu narasimhi shive'vatu | urddhvampatu mahalakshmih patale sharada'vatu || 14|| ityashtau
    shaktayah pantu sayudhashca savahanah | rajadvare mahadurge patu mangananayakah || 15|| shmashane
    jalamadhye ca bhairavashca sada'vatu | dvibhuja raktavasanah sarvabharanabhushitah || 16|| yoginyah
    sarvada patu maharanye sada mama | iti te kathitandevi kavacamparamadbhutam || 17|| shrivishvavijayannama
    kirtishrivijayapradam | aputro labhate putrandhiram shuram shatayusham || 18|| nirddhano dhanamapnoti
    kavacasyasya pathatah | japitva mantrarajantu dhyatva shribagalamukhim || 19|| pathedidam hi kavacannishayanniyamattu
    yah | yadyatkamayate kamam sadhyasadhye mahitale || 20|| tattatkamamavapnoti saptaratrena shankari
    | gurundhyatva surampitva ratrau shaktisamanvitah || 21|| kavacan yah patheddevi tasya'sadhyanna kincana
    | yandhyatva prajapenmantrasahasrankavacampathet || 22|| triratrena vashayati mrityuntannatra samshayah
    | likhitva pratimam shatrossatalena haridraya || 23|| likhitva hridi tannama tandhyatva prajapenmanum
    | ekavimshadinam yavatpratyahanca sahasrakam || 24|| japtva pathettu kavacancaturvimshativarakam |
    samstambhanjayate shatrornnatra karya vicarana || 25|| vivade vijayantasya sangrame jayamapnuyat |
    shmashane ca bhayannasti kavacasya prabhavatah || 26|| navanitancabhimantrya strinandadyanmaheshvari
    | vandhyayanjayate putro vidyabalasamanvitah || 27|| shmashanangaramadaya bhaume ratrau shanavatha
    | padodakena sprishtva ca likhelauhashalakaya || 28|| bhumau shatroh svarupanca hridi nama samalikhet
    | hastantaddhridaye datva kavacantithivarakam || 29|| dhyatva japenmantrarajannavaratramprayatnatah
    | mriyate jvaradahena dashame'hni na samshayah || 30|| bhurjapatreshvidam stotramashtagandhena sa~likhet
    | dharayeddakshine bahau nari vamabhuje tatha || 31|| sangrame jayamapnoti nari putravati bhavet |
    brahmastradini shastrani naiva krintanti tanjanam || 32|| sampujya kavacannityampujayah phalamalabhet
    | brihaspatisamo vapi vibhave dhanadopamah || 33|| kamatulyashca narinam shatrunanca yamopamah | kavitalahari
    tasya bhavedgangapravahavat || 34|| gadyapadyamayi vani bhaveddeviprasadatah | ekadashashatam yavatpurashcaranamucyate
    || 35|| purashcaryavihinantu na cedamphaladayakam | na deyamparashishyebhyo dushtebhyashca visheshatah
    || 36|| deyam shishyaya bhaktaya pancatvanca'nyathapnuyat | idankavacamajnatva bhajedyo bagalamukhim
    || shatakoti japitva tu tasya siddhirnna jayate || 37|| daradhyo manujosya lakshajapatah prapnoti
    siddhimparam vidyam shrivijayantatha suniyatandharanca viram varam || brahmastrakhyamanum vilikhya
    nitarambhurjeshtagandhena vai dhritva rajapuram vrajanti khalu ye daso'sti teshannripah || 38|| iti
    vishvasaroddharatantre parvatishvarasamvade bagalamukhikavacam sampurnam ||
  devanagari: ह्रींस्वाहा ॥ शिरो मे पातु ॐ ह्रीं ऐं श्रीं क्लीं पातु ललाटकम् । सम्बोधनपदम्पातु नेत्रे
    श्रीबगलानने ॥ १॥ श्रुतौ मम रिपुम्पातु नासिकान्नाशय द्वयम् । पातु गण्डौ सदा मामैश्वर्याण्यन्तन्तु मस्तकम्
    ॥ २॥ देहि द्वन्द्वं सदा जिह्वाम्पातु शीघ्रँ वचो मम । कण्ठदेशं स नः पातु वाञ्छितम्बाहुमूलकम् ॥ ३॥ कार्यं
    साधय द्वन्द्वन्तु करौ पातु सदा मम । मायायुक्ता तथा स्वाहा हृदयम्पातु सर्वदा ॥ ४॥ अष्टाधिकचत्वारिंशदण्डाढ्या
    बगलामुखी । रक्षाङ्करोतु सर्वत्र गृहेऽरण्ये सदा मम ॥ ५॥ ब्रह्मास्त्राख्यो मनुः पातु सर्वाङ्गे सर्वसन्धिषु
    । मन्त्रराजः सदा रक्षाङ्करोतु मम सर्वदा ॥ ६॥ ॐ ह्रीं पातु नाभिदेशमे कटिमे बगलावतु । मुखी वर्णद्वयम्पातु
    लिङ्गमे मुष्कयुग्मकम् ॥ ७॥ जानुनी सर्वदुष्टानाम्पातु मे वर्णपञ्चकम् । वाचमुखन्तथा पादं षड्वर्णा परमेश्वरी
    ॥ ८॥ जङ्घायुग्मे सदा पातु बगला रिपुमोहिनी । स्तम्भयेति पदम्पृष्ठम्पातुवर्णत्रयमम ॥ ९॥ जिह्वाँ वर्णद्वयम्पातु
    गुल्फौ मे कीलयेति च । पादोद्र्ध्वं सर्वदा पातु बुद्धिं पादतले मम ॥ १०॥ विनाशयपदं पातु पादाङ्गुल्योर्न्नखानि
    मे । ह्रीं बीजं सर्वदा पातु बुद्धीन्द्रियवचांसि मे ॥ ११॥ सर्वाङ्गम्प्रणवः पातु स्वाहा रोमाणि मेऽवतु
    । ब्राह्मी पूर्वदले पातु चाग्नेयां विष्णुवल्लभा ॥ १२॥ माहेशी दक्षिणे पातु चामुण्डा राक्षसेऽवतु । कौमारी
    पश्चिमे पातु वायव्ये चापराजिता ॥ १३॥ वाराही चोत्तरे पातु नारसिंही शिवेऽवतु । ऊर्द्ध्वम्पातु महालक्ष्मीः
    पाताले शारदाऽवतु ॥ १४॥ इत्यष्टौ शक्तयः पान्तु सायुधाश्च सवाहनाः । राजद्वारे महादुर्गे पातु माङ्गणनायकः
    ॥ १५॥ श्मशाने जलमध्ये च भैरवश्च सदाऽवतु । द्विभुजा रक्तवसनाः सर्वाभरणभूषिताः ॥ १६॥ योगिन्यः सर्वदा
    पातु महारण्ये सदा मम । इति ते कथितन्देवि कवचम्परमाद्भुतम् ॥ १७॥ श्रीविश्वविजयन्नाम कीर्तिश्रीविजयप्रदम्
    । अपुत्रो लभते पुत्रन्धीरं शूरं शतायुषम् ॥ १८॥ निर्द्धनो धनमाप्नोति कवचस्यास्य पाठतः । जपित्वा मन्त्रराजन्तु
    ध्यात्वा श्रीबगलामुखीम् ॥ १९॥ पठेदिदं हि कवचन्निशायान्नियमात्तु यः । यद्यत्कामयते कामं साध्यासाध्ये
    महीतले ॥ २०॥ तत्तत्काममवाप्नोति सप्तरात्रेण शङ्करी । गुरुन्ध्यात्वा सुराम्पीत्वा रात्रौ शक्तिसमन्वितः
    ॥ २१॥ कवचण् यः पठेद्देवि तस्याऽसाध्यन्न किञ्चन । यन्ध्यात्वा प्रजपेन्मन्त्रसहस्रङ्कवचम्पठेत् ॥ २२॥
    त्रिरात्रेण वशयाति मृत्युन्तन्नात्र संशयः । लिखित्वा प्रतिमां शत्रोस्सतालेन हरिद्रया ॥ २३॥ लिखित्वा
    हृदि तन्नाम तन्ध्यात्वा प्रजपेन्मनुम् । एकविंशदिनं यावत्प्रत्यहञ्च सहस्रकम् ॥ २४॥ जप्त्वा पठेत्तु
    कवचञ्चतुर्विंशतिवारकम् । संस्तम्भञ्जायते शत्रोर्न्नात्र कार्या विचारणा ॥ २५॥ विवादे विजयन्तस्य सङ्ग्रामे
    जयमाप्नुयात् । श्मशाने च भयन्नास्ति कवचस्य प्रभावतः ॥ २६॥ नवनीतञ्चाभिमन्त्र्य स्त्रीणान्दद्यान्महेश्वरि
    । वन्ध्यायाञ्जायते पुत्रो विद्याबलसमन्वितः ॥ २७॥ श्मशानाङ्गारमादाय भौमे रात्रौ शनावथ । पादोदकेन स्पृष्ट्वा
    च लिखेलौहशलाकया ॥ २८॥ भूमौ शत्रोः स्वरूपञ्च हृदि नाम समालिखेत् । हस्तन्तद्धृदये दत्वा कवचन्तिथिवारकम्
    ॥ २९॥ ध्यात्वा जपेन्मन्त्रराजन्नवरात्रम्प्रयत्नतः । म्रियते ज्वरदाहेन दशमेऽह्नि न संशयः ॥ ३०॥ भूर्जपत्रेष्विदं
    स्तोत्रमष्टगन्धेन सँलिखेत् । धारयेद्दक्षिणे बाहौ नारी वामभुजे तथा ॥ ३१॥ सङ्ग्रामे जयमाप्नोति नारी
    पुत्रवती भवेत् । ब्रह्मास्त्रादीनि शस्त्राणि नैव कृन्तन्ति तञ्जनम् ॥ ३२॥ सम्पूज्य कवचन्नित्यम्पूजायाः
    फलमालभेत् । बृहस्पतिसमो वापि विभवे धनदोपमः ॥ ३३॥ कामतुल्यश्च नारीणां शत्रूणाञ्च यमोपमः । कवितालहरी
    तस्य भवेद्गङ्गाप्रवाहवत् ॥ ३४॥ गद्यपद्यमयी वाणी भवेद्देवीप्रसादतः । एकादशशतं यावत्पुरश्चरणमुच्यते
    ॥ ३५॥ पुरश्चर्याविहीनन्तु न चेदम्फलदायकम् । न देयम्परशिष्येभ्यो दुष्टेभ्यश्च विशेषतः ॥ ३६॥ देयं शिष्याय
    भक्ताय पञ्चत्वञ्चाऽन्यथाप्नुयात् । इदङ्कवचमज्ञात्वा भजेद्यो बगलामुखीम् ॥ शतकोटि जपित्वा तु तस्य सिद्धिर्न्न
    जायते ॥ ३७॥ दाराढ्यो मनुजोस्य लक्षजपतः प्राप्नोति सिद्धिम्परां विद्यां श्रीविजयन्तथा सुनियतन्धारञ्च
    वीरं वरम् ॥ ब्रह्मास्त्राख्यमनुं विलिख्य नितराम्भूर्जेष्टगन्धेन वै धृत्वा राजपुरं व्रजन्ति खलु ये
    दासोऽस्ति तेषान्नृपः ॥ ३८॥ इति विश्वसारोद्धारतन्त्रे पार्वतीश्वरसंवादे बगलामुखीकवचं सम्पूर्णम् ॥
