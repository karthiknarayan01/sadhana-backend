id: sankshipta-puja-vidhanam-smarta-paddhati
category: stotram
name:
  english: Sankshipta Puja Vidhanam (Smarta Paddhati)
content:
  english: ishta devata pratima va citrapatah va sucana sankshipta purvanga puja shrimahaganadhipataye
    namah | shri gurubhyo namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah
    smaret pundarikaksham sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah
    || prarthana shuklambaradharam vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye
    || gururbrahma gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah
    || acamanam om keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om
    vishnave namah | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya
    namah | om hrishikeshaya namah | om padmanabhaya namah | om damodaraya namah | diparadhanam dipastvam
    brahmarupo'si jyotisham prabhuravyayah | saubhagyam dehi putramshca sarvankamamshca dehi me || sankalpah
    mama upatta samasta duritakshaya dvara shriparameshvara prityartham yavacchakti sankshipta dhyana
    pujam karishye || shri mahaganapati smaranam o ntva ganapatigm havamahe kavi nkavinamupamashravastamam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || sumukhashcaikadantashca kapilo
    gajakarnakah | lambodarashca vikato vighnarajo ganadhipah || om shrimahaganapataye namah | dhyayami
    | avahayami | samasta upacaran samarpayami || sankshipta shodashopacara puja ishta devata dhyanam
    om shri ishta devatayai namah | dhyayami | dhyanam samarpayami || avahanam om shri ishta devatayai
    namah | avahayami | sthapayami | pujayami || asanam om shri ishta devatayai namah | asanam samarpayami
    || padyam om shri ishta devatayai namah | padayoh padyam samarpayami || arghyam om shri ishta devatayai
    namah | hastayoh arghyam samarpayami || acamaniyam om shri ishta devatayai namah | mukhe acamaniyam
    samarpayami || snanam om shri ishta devatayai namah | shuddhodaka snanam samarpayami | snananantaram
    acamaniyam samarpayami || vastram om shri ishta devatayai namah | vastram samarpayami || yajnopavitam
    om shri ishta devatayai namah | yajnopavitam samarpayami || gandham om shri ishta devatayai namah
    | gandham samarpayami || arcana ganesha ashtottara shata namavali shiva ashtottara shata namavali
    durga ashtottara shata namavali shri vishnu ashtottara shata namavali subrahmanya ashtottara shata
    namavali sarasvati ashtottara shata namavali athava ishta devata namavali pathanam || om shri ishta
    devatayai namah | ashtottara shata namavali pujam samarpayami | akshatan pushpani ca samarpayami ||
    dhupam om shri ishta devatayai namah | dhupamaghrapayami || dipam om shri ishta devatayai namah |
    dipam darshayami || naivedyam o mbhurbhuvassuvah | tatsaviturvare mbhargo devasya dhimahi | dhiyo
    yo nah pracodaya t || om pranaya svaha | om apanaya svaha | om vyanaya svaha | om udanaya svaha |
    om samanaya svaha | om shri ishta devatayai namah | naivedyam samarpayami | madhye madhye paniyam
    samarpayami | shuddhacamaniyam samarpayami || tambulam om shri ishta devatayai namah | tambulam samarpayami
    || nirajanam om shri ishta devatayai namah | nirajanam samarpayami || mantrapushpam om shri ishta
    devatayai namah | mantrapushpam samarpayami || pradakshinam yani kani ca papani janmantara kritani
    ca | tani tani pranashyanti pradakshina pade pade || om shri ishta devatayai namah | pradakshina namaskaran
    samarpayami || namaskarah om shri ishta devatayai namah | namaskaran samarpayami || kshamaprarthana
    mantrahinam kriyahinam bhaktihinam sureshvara | yatpujitam maya deva paripurnam tadastu te || kayena
    vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam parasmai narayanayeti
    samarpayami || anaya sankshipta dhyana shodashopacara pujaya shri ishta devata suprita suprasanna
    varada bhavatu || udvasanam om shri ishta devatayai namah | yathasthanam udvasayami | shobhanarthe
    kshemaya punaragamanaya ca || prasada grahanam shri ishta devata prasadam shirasa grihnami || om shantih
    shantih shantih || om tatsat brahmarpanamastu ||
  devanagari: इष्ट देवता प्रतिमा वा चित्रपटः वा सूचना सङ्क्षिप्त पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः ।
    श्री गुरुभ्यो नमः । हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं
    स बाह्याभ्यन्तरः शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं
    शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो
    महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥ आचमनं ॐ केशवाय स्वाहा । ॐ नारायणाय स्वाहा
    । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय नमः । ॐ वामनाय
    नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि
    ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च देहि मे ॥ सङ्कल्पः मम उपात्त समस्त
    दुरितक्षय द्वारा श्रीपरमेश्वर प्रीत्यर्थं यावच्छक्ति सङ्क्षिप्त ध्यान पूजां करिष्ये ॥ श्री महागणपति
    स्मरणम् ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नामु॑प॒मश्र॑वस्तमम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒
    आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो
    गणाधिपः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । आवाहयामि । समस्त उपचारान् समर्पयामि ॥ सङ्क्षिप्त षोडशोपचार
    पूजा इष्ट देवता ध्यानम् ॐ श्री इष्ट देवतायै नमः । ध्यायामि । ध्यानं समर्पयामि ॥ आवाहनम् ॐ श्री इष्ट
    देवतायै नमः । आवाहयामि । स्थापयामि । पूजयामि ॥ आसनम् ॐ श्री इष्ट देवतायै नमः । आसनं समर्पयामि ॥ पाद्यम्
    ॐ श्री इष्ट देवतायै नमः । पादयोः पाद्यं समर्पयामि ॥ अर्घ्यम् ॐ श्री इष्ट देवतायै नमः । हस्तयोः अर्घ्यं
    समर्पयामि ॥ आचमनीयम् ॐ श्री इष्ट देवतायै नमः । मुखे आचमनीयं समर्पयामि ॥ स्नानम् ॐ श्री इष्ट देवतायै
    नमः । शुद्धोदक स्नानं समर्पयामि । स्नानानन्तरं आचमनीयं समर्पयामि ॥ वस्त्रम् ॐ श्री इष्ट देवतायै नमः
    । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम् ॐ श्री इष्ट देवतायै नमः । यज्ञोपवीतं समर्पयामि ॥ गन्धम् ॐ श्री इष्ट
    देवतायै नमः । गन्धं समर्पयामि ॥ अर्चन गणेश अष्टोत्तर शत नामावली शिव अष्टोत्तर शत नामावली दुर्गा अष्टोत्तर
    शत नामावली श्री विष्णु अष्टोत्तर शत नामावली सुब्रह्मण्य अष्टोत्तर शत नामावली सरस्वती अष्टोत्तर शत
    नामावली अथवा इष्ट देवता नामावली पठनम् ॥ ॐ श्री इष्ट देवतायै नमः । अष्टोत्तर शत नामावली पूजां समर्पयामि
    । अक्षतान् पुष्पाणि च समर्पयामि ॥ धूपम् ॐ श्री इष्ट देवतायै नमः । धूपमाघ्रापयामि ॥ दीपम् ॐ श्री इष्ट
    देवतायै नमः । दीपं दर्शयामि ॥ नैवेद्यम् ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि
    । धि॒यो यो नः॑ प्रचो॒दया त् ॥ ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा
    । ॐ समानाय स्वाहा । ॐ श्री इष्ट देवतायै नमः । नैवेद्यं समर्पयामि । मध्ये मध्ये पानीयं समर्पयामि ।
    शुद्धाचमनीयं समर्पयामि ॥ ताम्बूलम् ॐ श्री इष्ट देवतायै नमः । ताम्बूलं समर्पयामि ॥ नीराजनम् ॐ श्री
    इष्ट देवतायै नमः । नीराजनं समर्पयामि ॥ मन्त्रपुष्पम् ॐ श्री इष्ट देवतायै नमः । मन्त्रपुष्पं समर्पयामि
    ॥ प्रदक्षिणम् यानि कानि च पापानि जन्मान्तर कृतानि च । तानि तानि प्रणश्यन्ति प्रदक्षिण पदे पदे ॥ ॐ
    श्री इष्ट देवतायै नमः । प्रदक्षिण नमस्कारान् समर्पयामि ॥ नमस्कारः ॐ श्री इष्ट देवतायै नमः । नमस्कारान्
    समर्पयामि ॥ क्षमाप्रार्थना मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वर । यत्पूजितं मया देव परिपूर्णं
    तदस्तु ते ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै
    नारायणायेति समर्पयामि ॥ अनया सङ्क्षिप्त ध्यान षोडशोपचार पूजया श्री इष्ट देवता सुप्रीता सुप्रसन्ना
    वरदा भवतु ॥ उद्वासनम् ॐ श्री इष्ट देवतायै नमः । यथास्थानं उद्वासयामि । शोभनार्थे क्षेमाय पुनरागमनाय
    च ॥ प्रसाद ग्रहणम् श्री इष्ट देवता प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ब्रह्मार्पणमस्तु
    ॥
