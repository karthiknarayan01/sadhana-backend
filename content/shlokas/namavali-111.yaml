id: namavali-111
category: sahasranama
name:
  english: namavali
  devanagari: नामावली
content:
  english: lam prithivyatmikayai gandham kalpayami | ham akashatmikayai pushpani kalpayami | yam vayvyatmikayai
    dhupam kalpayami | ram agnyatmikayai dipam kalpayami | vam amritatmikayai amritam mahanaivedyam kalpayami
    | sam sarvatmikayai tambuladi samastopacaran kalpayami || atha shribhuvaneshvarisahasranamavalih |
    om bhuvaneshyai namah | om bhuvaradhyayai namah | om bhavanyai namah | om bhayanashinyai namah | om
    bhavarupayai namah | om bhavanandayai namah | om bhavasagaratarinyai namah | om bhavodbhavayai namah
    | om bhavaratayai namah | om bhavabharanivarinyai namah |
  devanagari: लं पृथिव्यात्मिकायै गन्धं कल्पयामि । हं आकाशात्मिकायै पुष्पाणि कल्पयामि । यं वाय्व्यात्मिकायै
    धूपं कल्पयामि । रं अग्न्यात्मिकायै दीपं कल्पयामि । वं अमृतात्मिकायै अमृतं महानैवेद्यं कल्पयामि । सं
    सर्वात्मिकायै ताम्बूलादि समस्तोपचारान् कल्पयामि ॥ अथ श्रीभुवनेश्वरीसहस्रनामावलिः । ॐ भुवनेश्यै नमः
    । ॐ भुवाराध्यायै नमः । ॐ भवान्यै नमः । ॐ भयनाशिन्यै नमः । ॐ भवरूपायै नमः । ॐ भवानन्दायै नमः । ॐ भवसागरतारिण्यै
    नमः । ॐ भवोद्भवायै नमः । ॐ भवरतायै नमः । ॐ भवभारनिवारिण्यै नमः ।
meaning: {}
