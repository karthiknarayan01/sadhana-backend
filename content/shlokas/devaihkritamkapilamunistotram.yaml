id: devaihkritamkapilamunistotram
category: stotram
name:
  english: devaihkritamkapilamunistotram
  devanagari: देवैःकृतंकपिलमुनिस्तोत्रम्
content:
  english: devaih kritam kapilamunistotram deva ucuh | namaste yogine tubhyam sankhyayogarataya ca | nararupapraticchannajishnave
    vishnave namah || 82|| namah pareshabhaktaya lokanugrahahetave | samsararanyadavagne dharmapalanasetave
    || 83|| mahate vitaragaya tubhyam bhuyo namo namah | sagaraih piditanasmamstrayasva sharanagatan ||
    84|| iti shribrihannaradiyapurane purvabhage ashtadhyayantargatam devaih kritam kapilamunistotram
    samaptam | brihannaradiyapurana | purvabhaga | adhyaya 8
  devanagari: देवैः कृतं कपिलमुनिस्तोत्रम् देवा ऊचुः । नमस्ते योगिने तुभ्यं साङ्ख्ययोगरताय च । नररूपप्रतिच्छन्नजिष्णवे
    विष्णवे नमः ॥ ८२॥ नमः परेशभक्ताय लोकानुग्रहहेतवे । संसारारण्यदावाग्ने धर्मपालनसेतवे ॥ ८३॥ महते वीतरागाय
    तुभ्यं भूयो नमो नमः । सागरैः पीडितानस्मांस्त्रायस्व शरणागतान् ॥ ८४॥ इति श्रीबृहन्नारदीयपुराणे पूर्वभागे
    अष्टाध्यायान्तर्गतं देवैः कृतं कपिलमुनिस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ८
meaning: {}
