id: gangastuti
category: stotram
name:
  english: gangastuti
  devanagari: गन्गास्तुति
content:
  english: rinuyacchraddhaya yuktah kayavakcittasambhavaih || 19|| dashadhasamsthitairdoshaih sarvaireva
    pramucyate | sarvankamanavapnoti pretya brahmani liyate || 20|| imam stavam grihe yastu lekhayitva
    vinikshipet | nagnicorabhayam tatra papebhy'pi bhayam na hi || 21|| jyeshthe masi site pakshe dashami
    hastasamyuta | samharettrividham papam budhavarena samyuta || 22|| tasyam dashamyametacca stotram
    gangajale sthitah | yah patheddashakritvastu daridro vapi cakshamah || 23|| so'pi tatphalamapnoti
    gangam sampujya yatnatah | purvoktena vidhanena yatphalam samprakirtitam || 24|| yatha gauri tatha
    ganga tasmadgauryastu pujane | vidhiryo vihitah samyak so'pi gangaprapujane ||25|| yatha shivastatha
    vishnuryatha vishnuruma tatha | uma yatha tatha ganga caturupanna bhidyate ||26|| vishnurudrantaram
    yacca shrigauryorantaram yatha | gangagauryantaram capi yo brute mudhadhistu sah ||27|| rauravadishu
    ghoreshu narakeshu patatyadhah | adattanamupadanam himsa caivavidhanatah || 28|| paradaropaseva ca
    kayikam trividham smritam | parushyamanritam caiva paishunyam capi sarvashah || 29|| asambaddhapralapashca
    vanmayam syaccaturvidham | paradravyeshvabhidhyanam manasanishtacintanam || 30|| vitathabhiniveshashca
    manasam trividham smritam | etani dasha papani hara tvam mama jahnavi || 31|| dashapapahara yasmattasmaddashahara
    smrita | etaidarshavidhaih papaih kotijanmasamudbhavaih || 32|| mumcyate natra sandeho brahmano vacanam
    yatha | dashatrimshacchrtansarvan pitrinatha pitamahan || 33|| uddharatyeva samsaranmantrenanena pujita
    | om namo bhagavatyai dashapapaharayai gangayai narayanyai revatyai | shivayai dakshayai amritayai
    vishvarupinyai
  devanagari: ृणुयाच्छ्रद्धया युक्तः कायवाक्चित्तसम्भवैः ॥ १९॥ दशधासंस्थितैर्दोषैः सर्वैरेव प्रमुच्यते
    । सर्वान्कामानवाप्नोति प्रेत्य ब्रह्मणि लियते ॥ २०॥ इमं स्तवं गृहे यस्तु लेखयित्वा विनिक्षिपेत् ।
    नाग्निचोरभयं तत्र पापेभ्य्ऽपि भयं न हि ॥ २१॥ ज्येष्ठे मासि सिते पक्षे दशमी हस्तसंयुता । संहरेत्त्रिविधं
    पापं बुधवारेण संयुता ॥ २२॥ तस्यां दशम्यामेतच्च स्तोत्रं गङ्गाजले स्थितः । यः पठेद्दशकृत्वस्तु दरिद्रो
    वापि चाक्षमः ॥ २३॥ सोऽपि तत्फलमाप्नोति गङ्गां सम्पूज्य यत्नतः । पूर्वोक्तेन विधानेन यत्फलं संप्रकीर्तितम्
    ॥ २४॥ यथा गौरी तथा गङ्गा तस्माद्गौर्यास्तु पूजने । विधिर्यो विहितः सम्यक् सोऽपि गङ्गाप्रपूजने ॥२५॥
    यथा शिवस्तथा विष्णुर्यथा विष्णुरुमा तथा । उमा यथा तथा गङ्गा चतूरूपन्न भिद्यते ॥२६॥ विष्णुरुद्रान्तरं
    यच्च श्रीगौर्योरन्तरं यथा । गङ्गागौर्यन्तरं चापि यो ब्रूते मूढधीस्तु सः ॥२७॥ रौरवादिषु घोरेषु नरकेषु
    पतत्यधः । अदत्तानामुपादानं हिंसा चैवाविधानतः ॥ २८॥ परदारोपसेवा च कायिकं त्रिविधं स्मृतम् । पारुष्यमनृतं
    चैव पैशुन्यं चापि सर्वशः ॥ २९॥ असम्बद्धप्रलापश्च वाङ्मयं स्याच्चतुर्विधम् । परद्रव्येष्वभिध्यानं मनसानिष्टचिन्तनम्
    ॥ ३०॥ वितथाभिनिवेशश्च मानसं त्रिविधं स्मृतम् । एतानि दश पापानि हर त्वं मम जाह्नवि ॥ ३१॥ दशपापहरा यस्मात्तस्माद्दशहरा
    स्मृता । एतैदर्शविधैः पापैः कोटिजन्मसमुद्भवैः ॥ ३२॥ मुंच्यते नात्र सन्देहो ब्रह्मणो वचनं यथा । दशत्रिंशच्छ्र्तान्सर्वान्
    पितॄनथ पितामहान् ॥ ३३॥ उद्धरत्येव संसारान्मन्त्रेणानेन पूजिता । ॐ नमो भगवत्यै दशपापहरायै गङ्गायै नारायण्यै
    रेवत्यै । शिवायै दक्षायै अमृतायै विश्वरूपिण्यै
