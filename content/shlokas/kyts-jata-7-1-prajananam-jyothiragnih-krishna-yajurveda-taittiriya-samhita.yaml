id: kyts-jata-7-1-prajananam-jyothiragnih-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 7.1 Prajananam Jyothiragnih - Krishna Yajurveda Taittiriya Samhita
content:
  english: jyoti ragni ragni ndevatana magni ragni dvirat chandasam | rjyoti shchandasa 'gna vagnau vaco
    vaco agnau sagm sa magna vagnau sam | ntishthate tishthate sagm sa ntishthate tishthate viraja viraja
    mabhyabhi virajam abhi sagm sa mabhyabhi sam | mpadyate padyate sagm sa tpadyate padyate tasma jyoti
    rucyata ucyate jyoti ucyate dvau dva vucyata ucyate dvau | dvau stomau stomau dvau dvau stomau va~hato
    vahatah pratassavana pratassavanamiti pratah vahato yatha yatha vahato vahato yatha pranah prano yatha
    yatha prana shca ca pranah prana shca | capano 'pana shca capanah | apana shca ca pano 'pana shca
    | ca dvau dvau ca ca dvau | ndvau dvau maddhyandinam | maddhyandinagm savanagm savana mmaddhyandinagm
    savanam | ya~tha yatha savanagm savanam yatha cakshu shcakshu ryatha yatha cakshuh | cakshu shca ca
    cakshu shcakshu shca | ca shrotragg shrotra nca ca shrotragg shrotra ca dvau dvau ca ca dvau | ndvau
    dvau tritiyasavanam | ya~tha yatha tritiyasavana tritiyasavanamiti tritiya yatha vag vag yatha yatha
    vak | vakca ca vag vakca | ca pratishtha pratishtha ca ca pratishtha | pratishtha ca ca pratishtha
    pratishtha ca | pratishtheti prati ca purushasammitah purushasammitashca ca purushasammitah | purushasammito
    vai vai purushasammitah purushasammito vai | purushasammita iti purusha va esha esha vai va eshah
    | esha yajno yajna esha esha yajnah | yajno 'sthuri rasthuri ryajno yajno 'sthurih | ya~ masthuri
    rasthuri nkamayate kamayate kama nkamayate kamayate tam | bhyete naitenabhi | abhyashnute 'shnute
    'bhya ashnute sarvagm sarva mashnute 'shnute sarva sarvagm hi hi sarvagm sarvagm hi | hyasthurina
    'sthurina hi hyasthurina | asthurina 'bhyashnute 'bhyashnute 'sthurina 'sthurina 'bhyashnute | abhyashnuta
    ityabhi agnishtomena vai va agnishtomena agnishtomenetyagni vai prajapatih prajapati rvai vai prajapatih
    | prajapatih prajah prajah prajapatih prajapatih prajah | prajapatiriti praja praja asrijata srijata
    prajah praja asrijata | asrijata ta sta asrijata srijata tah | gnishtomena ta sta agnishtomena | agnishtome
    naivai vagnishtomena agnishtomenetyagni eva pari parye vaiva pari | parya grihna dagrihna tpari parya
    grihnat | ntasa magrihna dagrihna parigrihitana mashvataro 'shvatarah parigrihitana mparigrihitana
    mashvatarah | parigrihitanamiti pari ashvataro 'tya tyashvataro atyapravata pravata tya tyapravata
    | apravata tasya tasya pravata pravata tasya | tasya nuhaya nuhaya tasya tasya nuhaya | anuhaya reto
    reto 'nuhaya nuhaya retah | reta a reto reta a | a 'datta datta 'datta | ttadadatta datta tat | dgardabhe
    gardabhe ta gardabhe ni ni gardabhe gardabhe ni | rdamarn ni nyamart | dgardabho gardabha stasma dvireta
    gardabho gardabho dviretah dvireta iti dvi atho ahu rahu ratho atho ahuh | rdamarn ni nyamart | ttasma
    dititi tasma dvadaba vadaba tasma dvireta vadaba vadaba dviretah dvireta iti dvi atho ahu rahu ratho
    atho ahuh | ahu roshadhi shvoshadhi shvahu rahu roshadhishu | oshadhishu ni nyoshadhi shvoshadhishu
    ni | || rdamarn ni nyamart | ttasma dititi tasma tasma doshadhaya oshadhaya stasma oshadhayo 'nabhyakta
    anabhyakta oshadhaya oshadhayo 'nabhyaktah | anabhyakta rebhanti rebha ntyanabhyakta anabhyakta rebhanti
    | anabhyakta ityanabhi rebha ntyatho atho rebhanti rebha ntyatho atho ahu rahu ratho atho ahuh | ahuh
    prajasu praja svahu rahuh prajasu | prajasu ni ni prajasu prajasu ni | rdamarn ni nyamart | ttasma
    dititi tasma yamau jayete jayete yamau yamau jayete | j jayete jayete tasma jayete iti jayete | ashvataro
    na nashvataro pra jayate jayate pra pra jayate | jayata attareta attareta jayate jayata attaretah
    | attareta hi hyattareta attareta hi | attareta ityatta ttasmaddhi hi tasma dbarhishi barhishi tasma
    barhi shyanavaklripto 'navaklripto barhishi barhi shyanavaklriptah | ssarvavedase sarvavedase 'navaklripto
    'navaklripta anavaklripta ityanava sarvavedase va va sarvavedase sarvavedase va sarvavedasa iti sarva
    va sahasre sahasre va va sahasre sahasre va va sahasre sahasre va | va 'vaklripto 'vaklripto va va
    'vaklriptah | avaklripto 'tya tyavaklripto 'vaklripto 'ti | ati hi hyatyati hi | hyapravata pravata
    hi hyapravata | apravata yo yo 'pravata pravata yah | vidva nagnishtomena gnishtomena vidvan vidva
    nagnishtomena | agnishtomena yajate yajate 'gnishtomena gnishtomena yajate | agnishtomenetyagni yajate
    pra pra yajate yajate pra | prajata ajatah pra prajatah | ajatah prajah praja ajata ajatah prajah
    | praja janayati janayati prajah praja janayati | janayati pari pari janayati janayati pari | pari
    prajatah prajatah pari pari prajatah | prajata grihnati grihnati prajatah prajata grihnati | dgrihnati
    grihnati tasma tasma dahu rahu stasma rjyeshthayajno jye jyeshthayajna ititi jyeshthayajno jye jyeshthayajna
    iti jyeshtha iti prajapatih prajapati rititi prajapatih | || rvava vava prajapatih prajapati prajapatiriti
    praja vava jyeshtho jyeshtho vava vava jyeshthah | ssa sa jyeshtho jyeshtha hyete naitena hi hyetena
    | etenagre 'gra ete naitenagre agre 'yajata yaja tagre 'gre 'yajata | ayajata prajapatih prajapati
    rayajata yajata prajapatih | prajapati rakamayata kamayata prajapatih prajapati rakamayata | prajapatiriti
    praja akamayata pra prakamayata kamayata pra | pra jayeya jayeya pra pra jayeya | jayeyetiti jayeya
    jayeyeti | iti sa sa ititi sah | mmukhato mukhata strivrita niramimita mimita ni nta mamimita mimita
    tam | rdevata devata 'gni ragni devata 'nvanu devata devata 'nu | anvasrijyata srijyata nvan vasrijyata
    | asrijyata gayatri gaya tryasrijyata srijyata gayatri | gayatri chanda shchando gayatri gayatri chandah
    | chando rathantaragm rathantara nchanda shchando rathantaram | rathantaragm sama sama rathantaragm
    rathantaragm sama | sama brahmano bra ssama sama brahmanah | brahmano manushyana hmano manushyanam
    | manushyana majo 'jo manushyana mmanushyana majah | mpashuna majo 'jah pashunam | te mukhya mukhya
    ste te mukhyah mukhya mukhato mukhato mukhya mukhya mukhatah | mukhato hi hi mukhato mukhato hi |
    hyasrijyanta srijyanta hi hyasrijyanta | asrijya ntorasa uraso 'srijyanta srijya ntorasah | mbahubhya
    murasa uraso bahubhya bahubhyamiti bahu niramimita mimita ni nta mamimita mimita tam | ta mindra indra
    sta indro devata devatendra indro devata devata 'nvanu devata devata 'nu | anva srijyata srijyatan
    van vasrijyata | asrijyata trishtu ptrishtuba srijyata srijyata trishtup | pchanda shchanda strishtu
    dbrihac chanda shchando brihat | sama rajanyo rajanyah sama sama rajanyah | rajanyo manushyana mmanushyanagm
    rajanyo rajanyo manushyanam | manushyana mavi ravi mmanushyana mavih | mpashuna mavi ravih pashunam
    | te viryavanto viryavanta ste te viryavantah | viryavanto virya dviryavanto viryavanto virya viryavanta
    iti virya hyasrijyanta srijyanta hi hyasrijyanta | asrijyanta maddhyato maddhyato 'srijyanta srijyanta
    maddhyatah | ssaptadashagm saptadasha mmaddhyato maddhyata ssaptadashagm saptadasha niramimita mimita
    ni nta mamimita mimita tam | vishve deva deva vishve vishve devah | deva devata devata deva deva devatah
    devata anvanu devata devata anu | anva srijyanta srijyantan van vasrijyanta | asrijyanta jagati jaga
    tyasrijyanta srijyanta jagati | jagati chanda shchando jagati jagati chandah | nchanda shchando vairupam
    | vairupagm sama sama vairupam ssama sama vaishyah | vai~shyo vaishyo manushyanam | ngavo gavo manushyana
    ngavo gavah pashunam | adya annadhana dannadhana dadya adya annadhana annadha naddhi hyannadhana dannadha
    naddhi | annadhanadityanna hyasrijyanta srijyanta hi hyasrijyanta | ttasma dasrijyanta srijyanta tasma
    dbhuyagmso bhuyagmsa stasma bhuyagmso 'nyebhyo 'nyebhyo bhuyagmso bhuyagmso 'nyebhyah | anyebhyo bhuyishtha
    bhuyishtha anyebhyo 'nyebhyo bhuyishthah | bhuyishtha hi hi bhuyishtha bhuyishtha hi | hi devata devata
    hi hi devatah devata anvanu devata devata anu | anva srijyanta srijyantan van vasrijyanta | asrijyanta
    pattah patto 'srijyanta srijyanta pattah | patta ekavigmsha mekavigmsha mpattah patta ekavigmsham
    | rnirekavigmsha mekavigmsha ekavigmshamityeka niramimita mimita ni nta mamimita mimita tam | ta manushtu
    banushtu pchanda shchando 'nushtu banushtu chando 'nvanu cchanda shchando 'nu | || anva srijyata srijyatan
    van vasrijyata | asrijyata vairajam vai~raja masrijyata srijyata vairajam | vairajagm sama sama vairajam
    ssama sama shudrah | shudro manushyana mmanushyanagm shudra shshudro manushyanam | manushyana mashvo
    'shvo manushyana mmanushyana mashvah | mpashuna mashvo 'shvah pashunam | tau bhutasankraminau bhutasankraminau
    tau tau bhutasankraminau bhutasankramina vashvo 'shvo bhutasankraminau bhutasankramina vashvah | bhutasankraminaviti
    bhuta ashva shca cashvo 'shva shca | shshudra shca ca shudrah | shudra shca ca shudra shudro yajne
    yajne shudra yajne 'navaklripto 'navaklripto yajne yajne 'navaklriptah | anavaklripto na nanavaklripto
    'navaklripto na | anavaklripta ityanava hi devata devata hi hi devatah devata anvanu devata devata
    anu | anva srijyata srijyatan van vasrijyata | ttasma dasrijyata srijyata tasma tpadau padau tasma
    pada vupopa padau pada vupa | upa jivato jivata upopa jivatah | jivatah pattah patto jivato jivatah
    pattah | patto hi hi pattah patto hi | hyasrijyeta masrijyetagm hi hyasrijyetam | mpranah prana asrijyeta
    masrijyeta prana vai vai pranah prana vai | trivri dardhamasa ardhamasa strivri ttrivri dardhamasah
    | ardhamasah pancadashah pancadasho 'rdhamasa ardhamasah pancadashah | ardhamasa ityardha pancadashah
    prajapatih prajapatih pancadashah pancadashah prajapatih | ssaptadashah prajapatih prajapati prajapatiriti
    praja saptadasha straya strayah saptadasha ssaptadasha strayah | traya ima ime traya straya ime |
    ime loka loka ima ime lokah | loka asa vasau loka loka asau | asa vaditya adityo 'sa vasa vadityah
    | aditya ekavigmsha ekavigmsha aditya aditya ekavigmshah | ekavigmsha etasmi nnekavigmsha ekavigmsha
    etasminn | ekavigmsha ityeka va eta ete vai va ete | shshrita eta ete shritah | shshrita etasminn
    | npratishthitah pratishthita etasmi pratishthita yo yah pratishthitah pratishthita yah | pratishthita
    iti prati veda vedai tasminn | eva shrayate shrayata evaiva shrayate | nchrayate shrayata etasminn
    | nprati pratyetasmi prati tishthati tishthati prati prati tishthati | tishthatiti tishthati | ||
    pratassavane vai vai pratassavane pratassavane vai | pratassavana iti pratah vai gayatrena gayatrena
    vai vai gayatrena | gayatrena chandasa chandasa gayatrena gayatrena chandasa | trivrite chandasa chandasa
    trivrite trivrite stomaya stomaya trivrite trivrite stomaya | sstomaya stomaya jyotih | brahmavarcasena
    brahmavarcasena trivrita brahmavarcasena pancadashaya pancadashaya brahmavarcasena brahmavarcasena
    pancadashaya | brahmavarcaseneti brahma pancadashaya jyoti rjyotih pancadashaya pancadashaya jyotih
    | pancadashayeti panca eti pancadashena pancadashenai pancadashe nauja saujasa pancadashena pancadashe
    naujasa | pancadasheneti panca ojasa viryena virye nauja saujasa viryena | viryena saptadashaya saptadashaya
    viryena viryena saptadashaya | saptadashaya jyoti rjyotih saptadashaya saptadashaya jyotih | saptadashayeti
    sapta eti saptadashena saptadashe nai saptadashena prajapatyena prajapatyena saptadashena saptadashena
    prajapatyena | saptadasheneti sapta prajapatyena prajananena prajananena prajapatyena prajapatyena
    prajananena | prajapatyeneti praja prajanane naikavigmsha yaikavigmshaya prajananena prajanane naikavigmshaya
    | ekavigmshaya jyoti rjyotirekavigmsha yaikavigmshaya jyotih | ekavigmshayetyeka sstoma etyeti stomah
    | thstomaya stomaya ta sstomaya stomaya jyotih | etyatho atho etye tyatho atho stome stome 'tho atho
    stome stoma evaiva stome stoma eva | eva stomagg stoma mevaiva stoma stoma mabhyabhi stomagg stoma
    mabhi | abhi pra prabhyabhi pra | pra nayati nayati pra pra nayati | nayati yavanto yavanto nayati
    nayati yavantah | yavanto vai vai yavanto yavanto vai | sstoma vai vai stomah stoma stavanta stavanta
    sstoma stavantah | tavantah kamah kama stavanta stavantah kamah kama stavanta stavantah kamah kama
    stavantah | tavanto loka loka stavanta stavanto lokah | loka stavanti tavanti loka loka stavanti |
    tavanti jyotigmshi jyotigmshi tavanti tavanti jyotigmshi | jyotig shyetavata etavato jyotigmshi jyotig
    shyetavatah | etavata evai vaitavata etavata eva | nthstoma nevaiva stoman | stoma netavata etavata
    nthstoma netavatah | etavatah kaman kama netavata etavatah kaman | kama netavata etavatah kaman kama
    netavatah | etavato lokan ~loka netavata etavato lokan | loka netava ntyetavanti lokan ~loka netavanti
    | etavanti jyotigmshi jyotig shyetava ntyetavanti jyotigmshi | jyotig shyavava jyotigmshi jyotigshyava
    | ava rundhe rundhe 'vava rundhe | rundha iti rundhe | || brahmavadino vadanti vadanti brahmavadino
    brahmavadino vadanti | brahmavadina iti brahma vadanti sa sa vadanti vadanti sah | vai yajeta yajeta
    vai vai yajeta | yajeta yo yo yajeta yajeta yah | agnishtomena yajamano yajamano 'gnishtomena gnishtomena
    yajamanah | agnishtomenetyagni yajamano 'thatha yajamano yajamano 'tha | atha sarvastomena sarvastomena
    thatha sarvastomena | sarvastomena yajeta yajeta sarvastomena sarvastomena yajeta | sarvastomeneti
    sarva yajetetiti yajeta yajeteti | iti yasya yasyetiti yasya | ya~sya yasya trivrita trivrita mantarya
    ntyantaryanti trivrita ntrivrita mantaryanti | antaryanti prana nprana nantarya ntyantaryanti pranan
    | antaryantityantah stasya tasya prana tasyanta ranta stasya tasyantah | ryanti yantyanta ranta yanti
    praneshu praneshu yanti yanti praneshu | praneshu me me praneshu praneshu me | me 'pyapi me me 'pi
    | apyasa dasa dapya pyasat | asa diti tyasa dasa diti | iti khalu khalvititi khalu | khalu vai vai
    khalu khalu vai | vai yajnena yajnena vai vai yajnena | yajnena yajamano yajamano yajnena yajnena
    yajamanah | yajamano yajate yajate yajamano yajamano yajate | yajate yasya yasya yajate yajate yasya
    | ya~sya yasya pancadasham | pancadasha mantarya ntyantaryanti pancadasha mpancadasha mantaryanti
    | antaryanti viryam vi~rya mantarya ntyantaryanti virya antaryantityantah ntasya tasya viryam tasyanta
    ranta stasya tasyantah | ryanti yantyanta ranta yanti virye virye yanti yanti virye virye me me virye
    virye me | me 'pyapi me me 'pi | apyasa dasa dapya pyasat | asa diti tyasa dasa diti | iti khalu khalvititi
    khalu | khalu vai vai khalu khalu vai | vai yajnena yajnena vai vai yajnena | yajnena yajamano yajamano
    yajnena yajnena yajamanah | yajamano yajate yajate yajamano yajamano yajate | yajate yasya yasya yajate
    yajate yasya | yasya saptadashagm saptadasham ya~sya yasya saptadasham | saptadasha mantarya ntyantaryanti
    saptadashagm saptadasha mantaryanti | antaryanti praja mpraja mantarya ntyantaryanti prajam | antaryantityantah
    ntasya tasya praja tasyanta ranta stasya tasyantah | ryanti yantyanta ranta ya~nti yanti prajaya me
    'pyapi me me 'pi | apyasa dasa dapya pyasat | asa diti tyasa dasa diti | iti khalu khalvititi khalu
    | khalu vai vai khalu khalu vai | vai yajnena yajnena vai vai yajnena | yajnena yajamano yajamano
    yajnena yajnena yajamanah | yajamano yajate yajate yajamano yajamano yajate | yajate yasya yasya yajate
    yajate yasya | yasyaikavigmsha mekavigmsham ya~sya yasyaikavigmsham | ekavigmsha mantarya ntyantarya
    ntyekavigmsha mekavigmsha mantaryanti | ekavigmshamityeka antaryanti pratishtha mpratishtha mantarya
    ntyantaryanti pratishtham | antaryantityantah ntasya tasya pratishtha pratishthamiti prati tasyanta
    ranta stasya tasyantah | ryanti yantyanta ranta yanti pratishthaya ya~nti yanti pratishthaya mme me
    pratishthaya pratishthayamiti prati me 'pyapi me me 'pi | apyasa dasa dapya pyasat | asa diti tyasa
    dasa diti | iti khalu khalvititi khalu | khalu vai vai khalu khalu vai | vai yajnena yajnena vai vai
    yajnena | yajnena yajamano yajamano yajnena yajnena yajamanah | yajamano yajate yajate yajamano yajamano
    yajate | yajate yasya yasya yajate yajate yasya | ya~sya yasya trinavam | trinava mantarya ntyantaryanti
    trinava ntrinava mantaryanti | antarya ntyritu nritu nantarya ntyantarya ntyritun | antaryantityantah
    ca tasya tasya ca ca tasya | ntasya tasya nakshatriya ryanti yantyanta ranta yantyritush vritushu
    yanti yantyritushu | ritushu me ma ritush vritushu me | me 'pyapi me me 'pi | apyasa dasa dapya pyasat
    | nnakshatriyaya masadasa nnakshatriyayam | nca ca nakshatriyaya ca viraji viraji ca ca viraji | virajititi
    viraji virajiti | iti khalu khalvititi khalu | || khalu vai vai khalu khalu vai | vai yajnena yajnena
    vai vai yajnena | yajnena yajamano yajamano yajnena yajnena yajamanah | yajamano yajate yajate yajamano
    yajamano yajate | yajate yasya yasya yajate yajate yasya | yasya trayastrigmsha ntrayastrigmsham ya~sya
    yasya trayastrigmsham | trayastrigmsha mantarya ntyantaryanti trayastrigmsha ntrayastrigmsha mantaryanti
    | trayastrigmshamiti trayah antaryanti devata devata antarya ntyantaryanti devatah antaryantityantah
    devata stasya tasya devata devata stasya | tasyanta ranta stasya tasyantah | ryanti yantyanta ranta
    yanti devatasu devatasu yanti yanti devatasu | devatasu me me devatasu devatasu me | me 'pyapi me
    me 'pi | apyasa dasa dapya pyasat | asa diti tyasa dasa diti | iti khalu khalvititi khalu | khalu
    vai vai khalu khalu vai | vai yajnena yajnena vai vai yajnena | yajnena yajamano yajamano yajnena
    yajnena yajamanah | yajamano yajate yajate yajamano yajamano yajate | yajate yo yo yajate yajate yah
    | vai stomanag stomanam vai~ vai stomanam | stomana mavama mavamagg stomanag stomana mavamam | mparamata
    mavama mavama ve~da veda gacchanta paramata mevaiva paramata eva gacchati gaccha tyevaiva gacchati
    | dgacchati gacchati trivrit | vai stomanag stomanam vai~ vai stomanam | stomana mavamo 'vama sstomanag
    stomana mavamah | ttrivri davamo 'vama strivrit | tparamah parama strivri paramo yo yah paramah paramo
    yah | paramata mevaiva paramata eva gacchati gaccha tyevaiva gacchati | gacchatiti gacchati | || angiraso
    vai va angiraso 'ngiraso vai | satra masata sata satragm satra masata | asata te ta asata sata te
    | te suvargagm suvarga nte te suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | nnayan
    ~lokam ~loka mayann | teshagm havishman nteshagm havishman | havishmagshca ca havishman ca havishkri
    ddhavishkric ca ca havishkrit | havishkric ca ca havishkri ddhavishkric ca | cahiyeta mahiyeta nca
    cahiyetam | ntau ta vahiyeta mahiyeta ta vakamayeta makamayeta ntau ta vakamayetam | akamayetagm suvargagm
    suvarga makamayeta makamayetagm suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | loka
    miya veyava lokam ~loka miyava | iyave titiya veyaveti | iti tau ta vititi tau | ndviratra meta meta
    dviratra mapashyata mapashyata ndviratra mapashyatam | dviratramiti dvi nta mapashyata mapashyata
    a 'harata maharata ma 'haratam | ntena tena harata maharata ntena tena yajetam | ntata stato 'yajeta
    mayajeta tato vai vai tata stato vai | tau suvargagm suvarga ntau tau suvargam | suvargam ~lokam ~lokagm
    suvargagm suvargam ~lokam | loka maita maitam ~lokam ~loka maitam | ndviratrena dviratrena vidvan
    dviratrena yajate yajate dviratrena dviratrena yajate | dviratreneti dvi yajate suvargagm suvargam
