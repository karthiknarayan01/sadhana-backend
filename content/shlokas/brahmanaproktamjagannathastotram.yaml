id: brahmanaproktamjagannathastotram
category: stotram
name:
  english: brahmanaproktamjagannathastotram
  devanagari: ब्रह्मणाप्रोक्तंजगन्नाथस्तोत्रम्
content:
  english: brahmana proktam jagannathastotram tasmattenaiva mantrena bhaktya krishnam jagadgurum | sampujya
    gandhapushpadyaih pranipatya prasadayet || 32|| brahmovaca | jaya krishna jagannatha jaya sarvaghanashana
    | jaya canurakeshighna jaya kamsanishudana || 33|| jaya padmapalashaksha jaya cakragadadhara | jaya
    nilambudashyama jaya sarvasukhaprada || 34|| jaya deva jagatpujya jaya samsaranashana | jaya lokapate
    natha jaya vanchaphalaprada || 35|| samsarasagare ghore nihsare duhkhaphenile | nimagno | aham surashreshtha
    trahi mam purashottama || 36|| nanarogormikalile mohavartasudustare | nimagno'ham surashreshtha trahi
    mam purushottama || 37|| iti brahmapurane saptapancashattamadhyayantargatam brahmana proktam jagannathastotram
    samaptam | brahmapurana | adhyaya 57
  devanagari: ब्रह्मणा प्रोक्तं जगन्नाथस्तोत्रम् तस्मात्तेनैव मन्त्रेण भक्त्या कृष्णं जगद्गुरुम् । सम्पूज्य
    गन्धपूष्पाद्यैः प्रणिपत्य प्रसादयेत् ॥ ३२॥ ब्रह्मोवाच । जय कृष्ण जगन्नाथ जय सर्वाघनाशन । जय चाणूरकेशिघ्न
    जय कंसनिषूदन ॥ ३३॥ जय पद्मपलाशाक्ष जय चक्रगदाधर । जय नीलाम्बुदश्याम जय सर्वसुखप्रद ॥ ३४॥ जय देव जगत्पूज्य
    जय संसारनाशन । जय लोकपते नाथ जय वाञ्छाफलप्रद ॥ ३५॥ संसारसागरे घोरे निःसारे दुःखफेनिले । निमग्नो ।
    अहं सुरश्रेष्ठ त्राहि मां पुरषोत्तम ॥ ३६॥ नानारोगोर्मिकलिले मोहावर्तसुदुस्तरे । निमग्नोऽहं सुरश्रेष्ठ
    त्राहि मां पुरुषोत्तम ॥ ३७॥ इति ब्रह्मपुराणे सप्तपञ्चाशत्तमाध्यायान्तर्गतं ब्रह्मणा प्रोक्तं जगन्नाथस्तोत्रं
    समाप्तम् । ब्रह्मपुराण । अध्याय ५७
