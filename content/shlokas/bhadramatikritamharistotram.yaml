id: bhadramatikritamharistotram
category: stotram
name:
  english: bhadramatikritamharistotram
  devanagari: भद्रमतिकृतंहरिस्तोत्रम्
content:
  english: bhadramatikritam haristotram tato yayau param tirtham papanashananamakam | snatva dadau shrotriyaya
    bhudanam vaishnavaya sah || 60|| tatkalam bhagava~statra sakshadavirbabhuva ha | bhadramatih stavam
    cakre namo narayanaya te || 61|| karanaya prapalaya'ntakaya nayakaya ca | pavakaya prasannaya smriddhidaya
    ca te namah || 62|| shrishaya shrikrishnanarayanaya bhudharaya ca | lakshmishaya prabheshaya manikishaya
    te namah || 63|| parvatishaya gopalabalakaya ca te namah | kambharankaprajataya sarvajnaya ca te namah
    || 64|| cakrapadmadicihnaya pumuttamaya te namah | kshirasagaravasaya shrilakshmisevitaya ca || 65||
    abhishtasukhadatre te yajnavaraharupine | namaste kamalakanta padmakantaya te namah || 66|| padminipataye
    bhaktadaridryanashakaya te | sadhurupaya te krishna
  devanagari: भद्रमतिकृतं हरिस्तोत्रम् ततो ययौ परं तीर्थं पापनाशननामकम् । स्नात्वा ददौ श्रोत्रियाय भूदानं
    वैष्णवाय सः ॥ ६०॥ तत्कालं भगवाँस्तत्र साक्षादाविर्बभूव ह । भद्रमतिः स्तवं चक्रे नमो नारायणाय ते ॥
    ६१॥ कारणाय प्रपालायाऽन्तकाय नायकाय च । पावकाय प्रसन्नाय स्मृद्धिदाय च ते नमः ॥ ६२॥ श्रीशाय श्रीकृष्णनारायणाय
    भूधराय च । लक्ष्मीशाय प्रभेशाय माणिकीशाय ते नमः ॥ ६३॥ पार्वतीशाय गोपालबालकाय च ते नमः । कम्भराङ्कप्रजाताय
    सर्वज्ञाय च ते नमः ॥ ६४॥ चक्रपद्मादिचिह्नाय पुमुत्तमाय ते नमः । क्षीरसागरवासाय श्रीलक्ष्मीसेविताय
    च ॥ ६५॥ अभीष्टसुखदात्रे ते यज्ञवाराहरूपिणे । नमस्ते कमलाकान्त पद्माकान्ताय ते नमः ॥ ६६॥ पद्मिनीपतये
    भक्तदारिद्र्यनाशकाय ते । साधुरूपाय ते कृष्ण
