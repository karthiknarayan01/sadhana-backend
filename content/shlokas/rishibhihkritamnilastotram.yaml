id: rishibhihkritamnilastotram
category: stotram
name:
  english: rishibhihkritamnilastotram
  devanagari: ऋषिभिःकृतंनीलस्तोत्रम्
content:
  english: ringagre dhritakailasah parvatisahitastvaya || 56|| vedastutyo vedamayo vedatma vedavittamah
    | vedavedyo vedayano vedarupo gunakarah || 57|| gunatrayebhyo'pi paro yathatmyam veda kastava | vrishastvam
    bhagavandeva yastubhyam kurute tvagham || 58|| vrishalah sa tu vijneyo rauravadishu pacyate | yada
    sprishtah sa tu naro narakadishu yatanah || 59|| sevate papanicayairnigadhaprayabandhanaih | kshutkshamam
    ca trishakrantam mahabharasamanvitam || 60|| nirdaya ye prashoshyanti matistesham na shashvati | caturbhih
    sahitam martya vivahavidhina tu ye || 61|| vivaham nilarupasya ye karishyanti manavah | pitrinuddishya
    tesham vai kule naivasti naraki || 62|| tvam gatih sarvalokanam tvatpita parameshvarah | tvaya vina
    jagatsarvam tatkshanadeva nashyati || 63|| para caiva tu pashyanti madhyama vaikhari tatha | caturvidhanam
    vacasamishvaram tvam vidurbudhah || 64|| catuhsha
  devanagari: ृङ्गाग्रे धृतकैलासः पार्वतीसहितस्त्वया ॥ ५६॥ वेदस्तुत्यो वेदमयो वेदात्मा वेदवित्तमः । वेदवेद्यो
    वेदयानो वेदरूपो गुणाकरः ॥ ५७॥ गुणत्रयेभ्योऽपि परो याथात्म्यं वेद कस्तव । वृषस्त्वं भगवान्देव यस्तुभ्यं
    कुरुते त्वघम् ॥ ५८॥ वृषलः स तु विज्ञेयो रौरवादिषु पच्यते । यदा स्पृष्टः स तु नरो नरकादिषु यातनाः ॥
    ५९॥ सेवते पापनिचयैर्निगाढप्रायबन्धनैः । क्षुत्क्षामं च तृषाक्रान्तं महाभारसमन्वितम् ॥ ६०॥ निर्दया
    ये प्रशोष्यन्ति मतिस्तेषां न शाश्वती । चतुर्भिः सहितं मर्त्या विवाहविधिना तु ये ॥ ६१॥ विवाहं नीलरूपस्य
    ये करिष्यन्ति मानवाः । पितॄनुद्दिश्य तेषां वै कुले नैवास्ति नारकी ॥ ६२॥ त्वं गतिः सर्वलोकानां त्वत्पिता
    परमेश्वरः । त्वया विना जगत्सर्वं तत्क्षणादेव नश्यति ॥ ६३॥ परा चैव तु पश्यन्ती मध्यमा वैखरी तथा । चतुर्विधानां
    वचसामीश्वरं त्वां विदुर्बुधाः ॥ ६४॥ चतुःश
