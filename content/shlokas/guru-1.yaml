id: guru-1
category: stotram
name:
  english: guru 1
  devanagari: गुरु १
content:
  english: gurustotra sartha akhandamandalakaram vyaptam yena caracaram | tatpadam darshitam yena tasmai
    shrigurave namah || 1|| ajnanatimirandhasya jnananjanashalakaya | cakshurunmilitam yena tasmai shrigurave
    namah || 2|| gururbrahma gururvishnuh gururdevo maheshvarah | gurureva param brahma tasmai shrigurave
    namah || 3|| sthavaram jangamam vyaptam yatkincitsacaracaram | tatpadam darshitam yena tasmai shrigurave
    namah || 4|| cinmayam vyapi yatsarvam trailokyam sacaracaram | tatpadam darshitam yena tasmai shrigurave
    namah || 5|| sarvashrutishiroratnavirajitapadambujah | vedantambujasuryo yah tasmai shrigurave namah
    || 6|| caitanyashshashvatashshantah vyomatito niranjanah | bindunadakalatitah tasmai shrigurave namah
    || 7|| jnanashaktisamarudhah tattvamalavibhushitah | bhuktimuktipradata ca tasmai shrigurave namah
    || 8|| anekajanmasampraptakarmabandhavidahine | atmajnanapradanena tasmai shrigurave namah || 9||
    shoshanam bhavasindhoshca jnapanam sarasampadah | guroh padodakam samyak tasmai shrigurave namah ||
    10|| na guroradhikam tattvam na guroradhikam tapah | tattvajnanat param nasti tasmai shrigurave namah
    || 11|| mannathah shrijagannathah madguruh shrijagadguruh | madatma sarvabhutatma tasmai shrigurave
    namah || 12|| gururadiranadishca guruh paramadaivatam | guroh parataram nasti tasmai shrigurave namah
    || 13|| tvameva mata ca pita tvameva | tvameva bandhushca sakha tvameva | tvameva vidya dravinam tvameva
    | tvameva sarvam mama devadeva || 14|| || iti shrigurustotram ||
  devanagari: गुरुस्तोत्र सार्थ अखण्डमण्डलाकारं व्याप्तं येन चराचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे
    नमः ॥ १॥ अज्ञानतिमिरान्धस्य ज्ञानाञ्जनशलाकया । चक्षुरुन्मीलितं येन तस्मै श्रीगुरवे नमः ॥ २॥ गुरुर्ब्रह्मा
    गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुरेव परं ब्रह्म तस्मै श्रीगुरवे नमः ॥ ३॥ स्थावरं जङ्गमं व्याप्तं
    यत्किञ्चित्सचराचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ४॥ चिन्मयं व्यापि यत्सर्वं त्रैलोक्यं
    सचराचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ५॥ सर्वश्रुतिशिरोरत्नविराजितपदाम्बुजः । वेदान्ताम्बुजसूर्यो
    यः तस्मै श्रीगुरवे नमः ॥ ६॥ चैतन्यश्शाश्वतश्शान्तः व्योमातीतो निरञ्जनः । बिन्दुनादकलातीतः तस्मै श्रीगुरवे
    नमः ॥ ७॥ ज्ञानशक्तिसमारूढः तत्त्वमालाविभूषितः । भुक्तिमुक्तिप्रदाता च तस्मै श्रीगुरवे नमः ॥ ८॥ अनेकजन्मसम्प्राप्तकर्मबन्धविदाहिने
    । आत्मज्ञानप्रदानेन तस्मै श्रीगुरवे नमः ॥ ९॥ शोषणं भवसिन्धोश्च ज्ञापनं सारसम्पदः । गुरोः पादोदकं सम्यक्
    तस्मै श्रीगुरवे नमः ॥ १०॥ न गुरोरधिकं तत्त्वं न गुरोरधिकं तपः । तत्त्वज्ञानात् परं नास्ति तस्मै श्रीगुरवे
    नमः ॥ ११॥ मन्नाथः श्रीजगन्नाथः मद्गुरुः श्रीजगद्गुरुः । मदात्मा सर्वभूतात्मा तस्मै श्रीगुरवे नमः ॥
    १२॥ गुरुरादिरनादिश्च गुरुः परमदैवतम् । गुरोः परतरं नास्ति तस्मै श्रीगुरवे नमः ॥ १३॥ त्वमेव माता च
    पिता त्वमेव । त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव । त्वमेव सर्वं मम देवदेव ॥
    १४॥ ॥ इति श्रीगुरुस्तोत्रम् ॥
