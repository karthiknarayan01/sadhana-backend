id: sharadashatashlokistavah
category: shataka
name:
  english: sharadashatashlokistavah
  devanagari: शारदाशतश्लोकीस्तवः
content:
  english: ringashailavaravasavilole || 35|| tushtimehi vacasam janani tvam matkritena vidhina'vidhina
    va | ainjapena paripuraya vancham mamakim ca mahatimapi shighram || 36|| tavaurasam sunumaho tvadiyabhaktagraganya
    mama deshikendrah | prahuryato'to mayi sharadamba papyagraganye'pi daya vidheya || 37|| tavaurasam
    mam sutamahuraryastvatpadabhaktagrasara yato'tah | sodhva madiyansakalaparadhanpuro bhavambashu giram
    savitri || 38|| bhakteshtapathonidhipurnacandrah kavitvamakandavasantakalah | jadyandhakaravrajapadmabandhuramba
    pranamastava padapadme || 39|| mukhambujam bhatu jagajjananya hridambuje me jitacandrabimbam | radambaradhahkritapakvabimbam
    mahaghavidhvamsanacancvajasram || 40|| yanena hamsam vadanena candram shronibharacchailapatim ca kamam
    | kanciddhasantim kalaye hridabje candrardharajadvarakeshapasham || 41|| vismritya dehadikamamba samyaksamuccaramstavakamantrarajam
    | tunganadipunyatate kadaham susaikate svairagatirbhavami || 42|| shrishadisamsevitapadapadme shribodhadanavratabaddhadikshe
    | shrikanthasodaryamitanukampe shrisharadambashu kripam kurushva || 43|| hridyani padyani vinihsaranti
    tvadanghrisampujakavaktrapadmat | vina prayatnam tarasa na citram tvamamba yasmadvacasam savitri ||
    44|| gamagamavivarjitairasubhirantarange'nisham gajasyaguhanandibhih suravarairmuda cintite | gajajinadharanuje
    galitatrishnalokekshite gatim mama shubham matim sapadi dehi vagishvari || 45|| jalodbhavajabhamini
    pranatasaukhyabhumaprade jadatvavinivaranavratanishaktaceto'mbuje | jagattrayanivasibhih satatasevyapadambuje
    jagajjanani sharade janaya saukhyamatyadbhutam || 46|| madebhagamane'vane natatateranekaih sukhai
  devanagari: ृङ्गशैलवरवासविलोले ॥ ३५॥ तुष्टिमेहि वचसां जननि त्वं मत्कृतेन विधिनाऽविधिना वा । ऐञ्जपेन
    परिपूरय वाञ्छां मामकीं च महतीमपि शीघ्रम् ॥ ३६॥ तवौरसं सूनुमहो त्वदीयभक्ताग्रगण्या मम देशिकेन्द्राः
    । प्राहुर्यतोऽतो मयि शारदाम्ब पाप्यग्रगण्येऽपि दया विधेया ॥ ३७॥ तवौरसं मां सुतमाहुरार्यास्त्वत्पादभक्ताग्रसरा
    यतोऽतः । सोढ्वा मदीयान्सकलापराधान्पुरो भवाम्बाशु गिरां सवित्रि ॥ ३८॥ भक्तेष्टपाथोनिधिपूर्णचन्द्रः
    कवित्वमाकन्दवसन्तकालः । जाड्यान्धकारव्रजपद्मबन्धुरम्ब प्रणामस्तव पादपद्मे ॥ ३९॥ मुखाम्बुजं भातु जगज्जनन्या
    हृदम्बुजे मे जितचन्द्रबिम्बम् । रदाम्बराधःकृतपक्वबिम्बं महाघविध्वंसनचञ्च्वजस्रम् ॥ ४०॥ यानेन हंसं
    वदनेन चन्द्रं श्रोणीभराच्छैलपतिं च कामम् । काञ्चिद्धसन्तीं कलये हृदब्जे चन्द्रार्धराजद्वरकेशपाशाम्
    ॥ ४१॥ विस्मृत्य देहादिकमम्ब सम्यक्समुच्चरंस्तावकमन्त्रराजम् । तुङ्गानदीपुण्यतटे कदाहं सुसैकते स्वैरगतिर्भवामि
    ॥ ४२॥ श्रीशादिसंसेवितपादपद्मे श्रीबोधदानव्रतबद्धदीक्षे । श्रीकण्ठसोदर्यमितानुकम्पे श्रीशारदाम्बाशु
    कृपां कुरुष्व ॥ ४३॥ हृद्यानि पद्यानि विनिःसरन्ति त्वदङ्घ्रिसम्पूजकवक्त्रपद्मात् । विना प्रयत्नं तरसा
    न चित्रं त्वमम्ब यस्माद्वचसां सवित्री ॥ ४४॥ गमागमविवर्जितैरसुभिरन्तरङ्गेऽनिशं गजास्यगुहनन्दिभिः सुरवरैर्मुदा
    चिन्तिते । गजाजिनधरानुजे गलिततृष्णलोकेक्षिते गतिं मम शुभां मतिं सपदि देहि वागीश्वरि ॥ ४५॥ जलोद्भवजभामिनि
    प्रणतसौख्यभूमप्रदे जडत्वविनिवारणव्रतनिषक्तचेतोऽम्बुजे । जगत्त्रयनिवासिभिः सततसेव्यपादाम्बुजे जगज्जननि
    शारदे जनय सौख्यमत्यद्भुतम् ॥ ४६॥ मदेभगमनेऽवने नतततेरनेकैः सुखै
