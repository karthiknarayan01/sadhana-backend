id: ishopanishat-shuklayajurvedokta
category: upanishad
name:
  english: ishopanishat (shuklayajurvedokta)
  devanagari: ईशोपनिषत् (शुक्लयजुर्वेदोक्त)
content:
  english: ste pretyabhigacchanti ye ke catmahano janah || 3|| anejadekam manaso javiyo nainaddeva apnuvanpurvamarshat
    | taddhavato'nyanatyeti tishthattasminnapo matarishva dadhati || 4|| tadejati tannaijati taddure tadvantike
    | tadantarasya sarvasya tadu sarvasyasya bahyatah || 5|| yastu sarvani bhutanyatmanyevanupashyati
    | sarvabhuteshu catmanam tato na vijugupsate || 6|| yasminsarvani bhutanyatmaivabhudvijanatah | tatra
    ko mohah kah shoka ekatvamanupashyatah || 7|| sa paryagacchukramakayamavrana
  devanagari: स्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः ॥ ३॥ अनेजदेकं मनसो जवीयो नैनद्देवा आप्नुवन्पूर्वमर्षत्
    । तद्धावतोऽन्यानत्येति तिष्ठत्तस्मिन्नपो मातरिश्वा दधाति ॥ ४॥ तदेजति तन्नैजति तद्दूरे तद्वन्तिके ।
    तदन्तरस्य सर्वस्य तदु सर्वस्यास्य बाह्यतः ॥ ५॥ यस्तु सर्वाणि भूतान्यात्मन्येवानुपश्यति । सर्वभूतेषु
    चात्मानं ततो न विजुगुप्सते ॥ ६॥ यस्मिन्सर्वाणि भूतान्यात्मैवाभूद्विजानतः । तत्र को मोहः कः शोक एकत्वमनुपश्यतः
    ॥ ७॥ स पर्यगाच्छुक्रमकायमव्रण
meaning: {}
