id: daridryadahan
category: stotram
name:
  english: daridryadahan
  devanagari: दारिद्र्यदहन्
content:
  english: daridryadahanashivastotram vishveshvaraya narakarnavataranaya karnamritaya shashishekharadharanaya
    | karpurakantidhavalaya jatadharaya daridryaduhkhadahanaya namah shivaya || 1|| gauripriyaya rajanishakaladharaya
    kalantakaya bhujagadhipakankanaya | gangadharaya gajarajavimardanaya daridryaduhkhadahanaya namah
    shivaya || 2|| bhaktipriyaya bhavarogabhayapahaya ugraya durgabhavasagarataranaya | jyotirmayaya gunanamasunrityakaya
    daridryaduhkhadahanaya namah shivaya || 3|| carmambaraya shavabhasmavilepanaya bhalekshanaya manikundalamanditaya
    | manjirapadayugalaya jatadharaya daridryaduhkhadahanaya namah shivaya || 4|| pancananaya phanirajavibhushanaya
    hemamshukaya bhuvanatrayamanditaya | anandabhumivaradaya tamomayaya daridryaduhkhadahanaya namah shivaya
    || 5|| bhanupriyaya bhavasagarataranaya kalantakaya kamalasanapujitaya | netratrayaya shubhalakshanalakshitaya
    daridryaduhkhadahanaya namah shivaya || 6|| ramapriyaya raghunathavarapradaya nagapriyaya narakarnavataranaya
    | punyeshu punyabharitaya surarcitaya daridryaduhkhadahanaya namah shivaya || 7|| mukteshvaraya phaladaya
    ganeshvaraya gitapriyaya vrishabheshvaravahanaya | matangacarmavasanaya maheshvaraya daridryaduhkhadahanaya
    namah shivaya || 8|| vasishthena kritam stotram sarvaroganivaranam | sarvasampatkaram shighram putrapautradivardhanam
    | trisandhyam yah pathennityam sa hi svargamavapnuyat || 9|| || iti shrivasishthaviracitam daridryadahanashivastotram
    sampurnam || shivaprarthana stotram
  devanagari: दारिद्र्यदहनशिवस्तोत्रम् विश्वेश्वराय नरकार्णवतारणाय कर्णामृताय शशिशेखरधारणाय । कर्पूरकान्तिधवलाय
    जटाधराय दारिद्र्यदुःखदहनाय नमः शिवाय ॥ १॥ गौरीप्रियाय रजनीशकलाधराय कालान्तकाय भुजगाधिपकङ्कणाय । गङ्गाधराय
    गजराजविमर्दनाय दारिद्र्यदुःखदहनाय नमः शिवाय ॥ २॥ भक्तिप्रियाय भवरोगभयापहाय उग्राय दुर्गभवसागरतारणाय
    । ज्योतिर्मयाय गुणनामसुनृत्यकाय दारिद्र्यदुःखदहनाय नमः शिवाय ॥ ३॥ चर्मम्बराय शवभस्मविलेपनाय भालेक्षणाय
    मणिकुण्डलमण्डिताय । मञ्जीरपादयुगलाय जटाधराय दारिद्र्यदुःखदहनाय नमः शिवाय ॥ ४॥ पञ्चाननाय फणिराजविभूषणाय
    हेमांशुकाय भुवनत्रयमण्डिताय । आनन्दभूमिवरदाय तमोमयाय दारिद्र्यदुःखदहनाय नमः शिवाय ॥ ५॥ भानुप्रियाय
    भवसागरतारणाय कालान्तकाय कमलासनपूजिताय । नेत्रत्रयाय शुभलक्षणलक्षिताय दारिद्र्यदुःखदहनाय नमः शिवाय
    ॥ ६॥ रामप्रियाय रघुनाथवरप्रदाय नागप्रियाय नरकार्णवतारणाय । पुण्येषु पुण्यभरिताय सुरार्चिताय दारिद्र्यदुःखदहनाय
    नमः शिवाय ॥ ७॥ मुक्तेश्वराय फलदाय गणेश्वराय गीतप्रियाय वृषभेश्वरवाहनाय । मातङ्गचर्मवसनाय महेश्वराय
    दारिद्र्यदुःखदहनाय नमः शिवाय ॥ ८॥ वसिष्ठेन कृतं स्तोत्रं सर्वरोगनिवारणम् । सर्वसम्पत्करं शीघ्रं पुत्रपौत्रादिवर्धनम्
    । त्रिसन्ध्यं यः पठेन्नित्यं स हि स्वर्गमवाप्नुयात् ॥ ९॥ ॥ इति श्रीवसिष्ठविरचितं दारिद्र्यदहनशिवस्तोत्रं
    सम्पूर्णम् ॥ शिवप्रार्थना स्तोत्रम्
