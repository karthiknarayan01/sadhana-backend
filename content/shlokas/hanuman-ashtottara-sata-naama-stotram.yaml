id: hanuman-ashtottara-sata-naama-stotram
category: stotram
name:
  english: Hanuman Ashtottara Sata Naama Stotram
content:
  english: anjaneyo mahaviro hanumanmarutatmajah | tatvajnanapradah sitadevimudrapradayakah || || ashokavanikacchetta
    sarvamayavibhanjanah | sarvabandhavimokta ca rakshovidhvamsakarakah || || paravidyapariharah parashauryavinashanah
    | paramantranirakarta parayantraprabhedakah || || sarvagrahavinashi ca bhimasenasahayakrit | sarvaduhkhaharah
    sarvalokacari manojavah || || parijatadrumulasthah sarvamantrasvarupavan | sarvatantrasvarupi ca sarvayantratmakastatha
    || || kapishvaro mahakayah sarvarogaharah prabhuh | balasiddhikarah sarvavidyasampatpradayakah ||
    || kapisenanayakashca bhavishyaccaturananah | kumarabrahmacari ca ratnakundaladiptiman || || sancaladvalasannaddhalambamanashikhojjvalah
    | gandharvavidyatattvajno mahabalaparakramah || || karagrihavimokta ca shrinkhalabandhamocakah | sagarottarakah
    prajno ramadutah pratapavan || || vanarah kesarisutah sitashokanivarakah | anjanagarbhasambhuto balarkasadrishananah
    || || vibhishanapriyakaro dashagrivakulantakah | lakshmanapranadata ca vajrakayo mahadyutih || ||
    ciranjivi ramabhakto daityakaryavighatakah | akshahanta kancanabhah pancavaktro mahatapah || || lankinibhanjanah
    shriman simhikapranabhanjanah | gandhamadanashailastho lankapuravidahakah || || sugrivasacivo dhirah
    shuro daityakulantakah | surarcito mahateja ramacudamanipradah || || kamarupi pingalaksho vardhimainakapujitah
    | kabalikritamartandamandalo vijitendiryah || || ramasugrivasandhata mahiravanamardanah | sphatikabho
    vagadhisho navavyakritipanditah || || caturbahurdinabandhurmahatma bhaktavatsalah | sanjivananagaharta
    shucirvagmi dridhavratah || || kalanemipramathano harimarkatamarkatah | dantah shantah prasannatma
    shatakanthamadapahrit || || yogi ramakathalolah sitanveshanapanditah | vajradamshtro vajranakho rudraviryasamudbhavah
    || || indrajitprahitamoghabrahmastravinivarakah | parthadhvajagrasamvasi sharapanjarabhedakah || ||
    dashabahurlorkapujyo jambavatpritivardhanah | sitasametashriramapadasevadhurandharah || || ityevam
    shrihanumato namnamashtottaram shatam | yah pathecchrinuyannityam sarvankamanavapnuyat ||
  devanagari: आञ्जनेयो महावीरो हनुमान्मारुतात्मजः । तत्वज्ञानप्रदः सीतादेवीमुद्राप्रदायकः ॥ ॥ अशोकवनिकाच्छेत्ता
    सर्वमायाविभञ्जनः । सर्वबन्धविमोक्ता च रक्षोविध्वंसकारकः ॥ ॥ परविद्यापरीहारः परशौर्यविनाशनः । परमन्त्रनिराकर्ता
    परयन्त्रप्रभेदकः ॥ ॥ सर्वग्रहविनाशी च भीमसेनसहायकृत् । सर्वदुःखहरः सर्वलोकचारी मनोजवः ॥ ॥ पारिजातद्रुमूलस्थः
    सर्वमन्त्रस्वरूपवान् । सर्वतन्त्रस्वरूपी च सर्वयन्त्रात्मकस्तथा ॥ ॥ कपीश्वरो महाकायः सर्वरोगहरः प्रभुः
    । बलसिद्धिकरः सर्वविद्यासम्पत्प्रदायकः ॥ ॥ कपिसेनानायकश्च भविष्यच्चतुराननः । कुमारब्रह्मचारी च रत्नकुण्डलदीप्तिमान्
    ॥ ॥ सञ्चलद्वालसन्नद्धलम्बमानशिखोज्ज्वलः । गन्धर्वविद्यातत्त्वज्ञो महाबलपराक्रमः ॥ ॥ कारागृहविमोक्ता
    च शृङ्खलाबन्धमोचकः । सागरोत्तारकः प्राज्ञो रामदूतः प्रतापवान् ॥ ॥ वानरः केसरिसुतः सीताशोकनिवारकः ।
    अञ्जनागर्भसम्भूतो बालार्कसदृशाननः ॥ ॥ विभीषणप्रियकरो दशग्रीवकुलान्तकः । लक्ष्मणप्राणदाता च वज्रकायो
    महाद्युतिः ॥ ॥ चिरञ्जीवी रामभक्तो दैत्यकार्यविघातकः । अक्षहन्ता काञ्चनाभः पञ्चवक्त्रो महातपाः ॥ ॥
    लङ्किणीभञ्जनः श्रीमान् सिंहिकाप्राणभञ्जनः । गन्धमादनशैलस्थो लङ्कापुरविदाहकः ॥ ॥ सुग्रीवसचिवो धीरः
    शूरो दैत्यकुलान्तकः । सुरार्चितो महातेजा रामचूडामणिप्रदः ॥ ॥ कामरूपी पिङ्गलाक्षो वार्धिमैनाकपूजितः
    । कबलीकृतमार्ताण्डमण्डलो विजितेन्दिर्यः ॥ ॥ रामसुग्रीवसन्धाता महिरावणमर्दनः । स्फटिकाभो वागधीशो नवव्याकृतिपण्डितः
    ॥ ॥ चतुर्बाहुर्दीनबन्धुर्महात्मा भक्तवत्सलः । सञ्जीवननगाहर्ता शुचिर्वाग्मी दृढव्रतः ॥ ॥ कालनेमिप्रमथनो
    हरिमर्कटमर्कटः । दान्तः शान्तः प्रसन्नात्मा शतकण्ठमदापहृत् ॥ ॥ योगी रामकथालोलः सीतान्वेषणपण्डितः ।
    वज्रदंष्ट्रो वज्रनखो रुद्रवीर्यसमुद्भवः ॥ ॥ इन्द्रजित्प्रहितामोघब्रह्मास्त्रविनिवारकः । पार्थध्वजाग्रसंवासी
    शरपञ्जरभेदकः ॥ ॥ दशबाहुर्लोर्कपूज्यो जाम्बवत्प्रीतिवर्धनः । सीतासमेतश्रीरामपादसेवाधुरन्धरः ॥ ॥ इत्येवं
    श्रीहनुमतो नाम्नामष्टोत्तरं शतम् । यः पठेच्छृणुयान्नित्यं सर्वान्कामानवाप्नुयात् ॥
