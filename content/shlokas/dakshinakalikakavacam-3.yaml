id: dakshinakalikakavacam-3
category: kavacha
name:
  english: dakshinakalikakavacam 3
  devanagari: दक्षिणकालिकाकवचम् ३
content:
  english: kalika jagatam mata shokaduhkhavinashini | visheshatah kaliyuge mahapatakaharini || 2|| kalau
    me puratah patu prishthatashca kapalini | kulla me dakshine patu kurukulla tathottare || 3|| virodhini
    shirah patu vipracitta ca cakshushi | ugra me namikam patu karnau cograprabha tatha || 4|| vadanam
    patu me dipta nila ca cibukam tatha | ghana grivam sada patu valaka bahuyugmakam || 5|| matra patu
    karaddandvam vakshyo mudra sadavatu | mita patu stanadvandvam yonimandaladevatah || 6|| brahmi me
    jatharam patu nabhim narayani tatha | uru maheshvari patu camunda patu lingakam || 7|| kaumari ca
    katim patu janghayugmam tathaiva ca | aparajita ca padau me varahi patu canguli || 8|| sandhisthanam
    narasimhi patrastha devata'vatu | rakshahinanca yatsthanam varjitam kavacena tu || 9|| tatsarvam raksha
    mem devi
  devanagari: कालिका जगतां माता शोकदुःखविनाशिनी । विशेषतः कलियुगे महापातकहारिणी ॥ २॥ कालौ मे पुरतः पातु
    पृष्ठतश्च कपालिनी । कुल्ला मे दक्षिणे पातु कुरुकुल्ला तथोत्तरे ॥ ३॥ विरोधिनी शिरः पातु विप्रचित्ता
    च चक्षुषी । उग्रा मे नामिकां पातु कर्णौ चोग्रप्रभा तथा ॥ ४॥ वदनं पातु मे दीप्ता नीला च चिबुकं तथा
    । घना ग्रीवां सदा पातु वलाका बाहुयुग्मकम् ॥ ५॥ मात्रा पातु करद्दन्द्वं वक्ष्यो मुद्रा सदावतु । मिता
    पातु स्तनद्वन्द्वं योनिमण्डलदेवताः ॥ ६॥ ब्राह्मी मे जठरं पातु नाभिं नारायणी तथा । ऊरू माहेश्वरी पातु
    चामुण्डा पातु लिङ्गकम् ॥ ७॥ कौमारी च कटिं पातु जङ्घायुग्मं तथैव च । अपराजिता च पादौ मे वाराही पातु
    चाङ्गुली ॥ ८॥ सन्धिस्थानं नारसिंही पत्रस्था देवताऽवतु । रक्षाहीनञ्च यत्स्थानं वर्जितं कवचेन तु ॥ ९॥
    तत्सर्वं रक्ष में देवि
