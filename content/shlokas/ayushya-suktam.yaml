id: ayushya-suktam
category: stotram
name:
  english: Ayushya Suktam
content:
  english: yo brahma brahmana ujjahara pranai ssa na ayurdadhatu tasmai juhomi havisha ghritena || drocamano
    gharmarucirya agat | sa mrityupashanapanudya ghoranihayusheno ghritamattu devah || njayantam | suvarnarambhagraha
    ntamayushe vardhayamo ghritena || mbrahmayonigm sarupamihayushe tarpayamo ghritena || ssarvayonyah
    sa yonya ssahasrasho vishvarupa virupah | sasunava ssapatayah sayuthya ayusheno ghritamida || divya
    gana bahurupah purana ayushchido nah pramathnantu viran | tebhyo juhomi bahudha ghritena ma nah prajagm
    ririsho mota viran || || ekah purastat ya ida mbabhuva yato babhuva bhuvanasya gopah | yamapyeti bhuvanagm
    sa mparaye sa no havirghrita 'tha sadhyan ribhun yaksha shca vishvan | bhrigun sarpag nghritagm hutva
    svayushya mahayama shashvat || nno antamashsharmayaccha sahantya | pratedhara madhushcuta uthsa nduhrate
    akshitam || || om shanti
  devanagari: यो ब्रह्मा ब्रह्मण उ॑ज्जहा॒र प्रा॒णै स्स न आयु॑र्दधा॒तु॒ तस्मै जुहोमि हविषा॑ घृते॒न ॥ द्रो॒च॒मा॒नो
    घर्मरुचि॑र्य आ॒गात् । स मृत्युपाशानपनु॑द्य घो॒रा॒नि॒हा॒यु॒षे॒णो घृतम॑त्तु दे॒वः ॥ ञ्जय॒न्तम् । सुवर्णरम्भग्रह
    न्त॒मा॒यु॒षे वर्धयामो॑ घृते॒न ॥ म्ब्रह्मयोनिग्ं॑ सरू॒पा॒मि॒हा॒यु॒षे तर्पयामो॑ घृते॒न ॥ स्सर्वयोन्यः॑
    स यो॒न्य॒ स्स॒ह॒स्र॒शो विश्वरूपा॑ विरू॒पाः । ससूनव स्सपतयः॑ सयू॒थ्या॒ आ॒यु॒षे॒णो घृतमिद॑ ॥ दिव्या
    गणा बहुरूपाः पुरा॒णा॒ आयुश्छिदो नः प्रमथ्न॑न्तु वी॒रान् । तेभ्यो जुहोमि बहुधा॑ घृते॒न॒ मा॒ नः॒ प्र॒जाग्ं
    रीरिषो मो॑त वी॒रान् ॥ ॥ ए॒कः॒ पु॒र॒स्तात् य इद॑ म्बभू॒व॒ यतो बभूव भुवन॑स्य गो॒पाः । यमप्येति भुवनग्ं
    सा म्परा॒ये॒ स नो हविर्घृत ऽथ सा॒ध्या॒न् ऋ॑भून् य॒क्षा॒ श्च वि॒श्वान् । भृगून् सर्पाग् न्घृ॒त॒ग्ं
    हु॒त्वा स्वायुष्या महया॑म श॒श्वत् ॥ न्नो॒ अन्त॑म॒श्शर्म॑यच्छ सहन्त्य । प्रते॒धारा॑ मधु॒श्चुत॒ उथ्स॑
    न्दुह्रते॒ अक्षि॑तम् ॥ ॥ ॐ शान्ति॒
