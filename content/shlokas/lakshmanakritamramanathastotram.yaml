id: lakshmanakritamramanathastotram
category: stotram
name:
  english: lakshmanakritamramanathastotram
  devanagari: लक्ष्मणकृतंरामनाथस्तोत्रम्
content:
  english: lakshmanakritam ramanathastotram lakshmana uvaca | namaste ramanathaya tripuraghnaya shambhave
    | parvatijiviteshaya ganeshaskandasunave || 13|| namaste suryacadragnilocanaya kapardine | namah shivaya
    somaya markandeyabhayacchide || 14|| namah sarvaprapancasya srishtisthityantahetave | nama ugraya
    bhimaya mahadevaya sakshine || 15|| sarvajnaya varenyaya varadaya varaya te | shrikanthaya namastubhyam
    pancapatakabhedine || 16|| namaste'stu paranandasatyavijnanarupine | namaste bhavarogaghna snayunam
    pataye namah || 17|| pataye taskaranam te vananam pataye namah | gananam pataye tubhyam vishvarupaya
    sakshine || 18|| karmana preritah shambho janishye yatra yatra tu | tatra tatra padadvandve bhavato
    bhaktirastu me || 19|| asanmarge ratirma bhudbhavatah kripaya mama | vaidikacaramarge ca ratih syadbhavate
    namah || 1
  devanagari: लक्ष्मणकृतं रामनाथस्तोत्रम् लक्ष्मण उवाच । नमस्ते रामनाथाय त्रिपुरघ्नाय शम्भवे । पार्वतीजीवितेशाय
    गणेशस्कन्दसूनवे ॥ १३॥ नमस्ते सूर्यचद्राग्निलोचनाय कपर्दिने । नमः शिवाय सोमाय मार्कण्डेयभयच्छिदे ॥
    १४॥ नमः सर्वप्रपञ्चस्य सृष्टिस्थित्यन्तहेतवे । नम उग्राय भीमाय महादेवाय साक्षिणे ॥ १५॥ सर्वज्ञाय वरेण्याय
    वरदाय वराय ते । श्रीकण्ठाय नमस्तुभ्यं पञ्चपातकभेदिने ॥ १६॥ नमस्तेऽस्तु परानन्दसत्यविज्ञानरूपिणे ।
    नमस्ते भवरोगघ्न स्नायूनां पतये नमः ॥ १७॥ पतये तस्कराणां ते वनानां पतये नमः । गणानां पतये तुभ्यं विश्वरूपाय
    साक्षिणे ॥ १८॥ कर्मणा प्रेरितः शम्भो जनिष्ये यत्र यत्र तु । तत्र तत्र पदद्वन्द्वे भवतो भक्तिरस्तु
    मे ॥ १९॥ असन्मार्गे रतिर्मा भूद्भवतः कृपया मम । वैदिकाचारमार्गे च रतिः स्याद्भवते नमः ॥ १
