id: sanatkumaraproktamvishnurakshastotram
category: stotram
name:
  english: sanatkumaraproktamvishnurakshastotram
  devanagari: सनत्कुमारप्रोक्तंविष्णुरक्षास्तोत्रम्
content:
  english: sanatkumaraproktam vishnurakshastotram athava keshavadyaistu raksham kuryatprayatnatah | keshavah
    patu padau me janghe narayano'vatu || 114|| madhavo me katim patu govindo guhyameva ca | nabhim vishnushca
    me patu jatharam madhusudanah || 115|| uru trivikramah patu hridayam patu me narah | shridharah patu
    kantham ca hrishikesho mukham mama || 116|| padmanabhah stanau patu shirsham damodaro'vatu | evam
    vinyasya cangeshu japakale tu sadhakah || 117|| nirbhayo jayate bhutavetalagraharakshasat | punarnyasetprayatnena
    dhyanam kurvansamahitah || 118|| purastatkeshavah patu cakri jambunadaprabhah | pashcannarayanah shankhi
    nilajimutasannibhah || 119|| urddhvamindivarashyamo madhavastu gadadharah | govindo dakshine parshve
    dhanvi candraprabho mahan || 120|| uttare haladhrigvishnuh padmakinjalkamasannibhah | agneyyamaravindaksho
    musali madhusudanah || 121|| trivikramah khadgapanirnairrityam jvalanaprabhah | vayavyam madhavo vajri
    tarunadityasannibhah || 122|| aishanyam pundarikakshah shridharah pattishayudhah | vidyutprabho hrishikesha
    urddhve patu samudgarah || 123|| adhashca padmanabho me sahasramshusamaprabhah | sarvayudhah sarvashaktih
    sarvadyahsarvatomukhah || 124|| indragopaprabhah payatpashahasto'parajitah | sa bahyabhyantare dehamavyaddamodaro
    harih || 125|| evam sarvatra nishchidram namadvadashapanjaram | pravishto'ham na me kincidbhayamasti
    kadacana || 126|| evam raksham vidhayatha durddharsho jayate narah | sarveshu nriharermantravargeshvevam
    vidhirmatah || 127|| iti naradapurane purvabhage ekasaptatitamadhyayantargatam sanatkumaraproktam
    vishnurakshastotramsamaptam | brihannaradiyapurana | purvabhaga | adhyaya 71
  devanagari: सनत्कुमारप्रोक्तं विष्णुरक्षास्तोत्रम् अथवा केशवाद्यैस्तु रक्षां कुर्यात्प्रयत्नतः । केशवः
    पातु पादौ मे जङ्घे नारायणोऽवतु ॥ ११४॥ माधवो मे कटिं पातु गोविन्दो गुह्यमेव च । नाभिं विष्णुश्च मे
    पातु जठरं मधुसूदनः ॥ ११५॥ ऊरू त्रिविक्रमः पातु हृदयं पातु मे नरः । श्रीधरः पातु कण्ठं च हृषीकेशो मुखं
    मम ॥ ११६॥ पद्मनाभः स्तनौ पातु शीर्षं दामोदरोऽवतु । एवं विन्यस्य चाङ्गेषु जपकाले तु साधकः ॥ ११७॥ निर्भयो
    जायते भूतवेतालग्रहराक्षसात् । पुनर्न्यसेत्प्रयत्नेन ध्यानं कुर्वन्समाहितः ॥ ११८॥ पुरस्तात्केशवः पातु
    चक्री जाम्बूनदप्रभः । पश्चान्नारायणः शङ्खी नीलजीमूतसन्निभः ॥ ११९॥ ऊर्द्ध्वमिन्दीवरश्यामो माधवस्तु
    गदाधरः । गोविन्दो दक्षिणे पार्श्वे धन्वी चन्द्रप्रभो महान् ॥ १२०॥ उत्तरे हलधृग्विष्णुः पद्मकिञ्जल्कमसन्निभः
    । आग्नेय्यामरविन्दाक्षो मुसली मधुसूदनः ॥ १२१॥ त्रिविक्रमः खड्गपाणिर्नैरृत्यां ज्वलनप्रभः । वायव्यां
    माधवो वज्री तरुणादित्यसन्निभः ॥ १२२॥ ऐशान्यां पुण्डरीकाक्षः श्रीधरः पट्टिशायुधः । विद्युत्प्रभो हृषीकेश
    ऊर्द्ध्वे पातु समुद्गरः ॥ १२३॥ अधश्च पद्मनाभो मे सहस्रांशुसमप्रभः । सर्वायुधः सर्वशक्तिः सर्वाद्यःसर्वतोमुखः
    ॥ १२४॥ इन्द्रगोपप्रभः पायात्पाशहस्तोऽपराजितः । स बाह्याभ्यन्तरे देहमव्याद्दामोदरो हरिः ॥ १२५॥ एवं
    सर्वत्र निश्छिद्रं नामद्वादशपञ्जरम् । प्रविष्टोऽहं न मे किञ्चिद्भयमस्ति कदाचन ॥ १२६॥ एवं रक्षां विधायाथ
    दुर्द्धर्षो जायते नरः । सर्वेषु नृहरेर्मन्त्रवर्गेष्वेवं विधिर्मतः ॥ १२७॥ इति नारदपुराणे पूर्वभागे
    एकसप्ततितमाध्यायान्तर्गतं सनत्कुमारप्रोक्तं विष्णुरक्षास्तोत्रंसमाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग
    । अध्याय ७१
