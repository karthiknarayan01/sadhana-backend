id: shrigurupadukastrotram
category: stotram
name:
  english: shrigurupadukastrotram
  devanagari: श्रीगुरुपादुकास्त्रोत्रम्
content:
  english: ananta samsara samudratara | naukayitabhyam sthira bhaktidabhyam | jakyabdhi samshoshana bar̤ayabhyam
    | namo namah shri guru padukabhyam u~kara hrimkara rahasyayukta shrimkara gur̤hartha mahavibhutya
    | u~kara marmam pratipadinibhyam namo namah shri guru padukabhyam hotragni
  devanagari: अनन्त संसार समुद्रतार । नौकायिताभ्यां स्थिर भक्तिदाभ्याम् । जाक्याब्धि संशोषण बाड़याभ्याम्
    । नमो नमः श्री गुरु पादुकाभ्याम् ऊँकार ह्रींकार रहस्ययुक्त श्रींकार गुढ़ार्थ महाविभुत्या । ऊँकार मर्मं
    प्रतिपादिनीभ्यां नमो नमः श्री गुरु पादुकाभ्याम् होत्राग्नि
meaning: {}
