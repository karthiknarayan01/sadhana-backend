id: parashuramakritam2shivastotram
category: stotram
name:
  english: parashuramakritam2shivastotram
  devanagari: परशुरामकृतं२शिवस्तोत्रम्
content:
  english: 32|| iti brahmandapurane madhyabhage dvatrimshadhyayantargatam parashuramakritam shivastotram
    samaptam | brahmandapurana | madhyabhaga | upoddhata | adhyaya 32
  devanagari: ३२॥ इति ब्रह्माण्डपुराणे मध्यभागे द्वात्रिंशाध्यायान्तर्गतं परशुरामकृतं शिवस्तोत्रं समाप्तम्
    । ब्रह्माण्डपुराण । मध्यभाग । उपोद्धात । अध्याय ३२
