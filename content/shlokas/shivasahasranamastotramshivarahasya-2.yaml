id: shivasahasranamastotramshivarahasya-2
category: sahasranama
name:
  english: shivasahasranamastotramshivarahasya
  devanagari: शिवसहस्रनामस्तोत्रम्शिवरहस्य
content:
  english: om omkaranilayatmasthah omkararthaikavacakah | omkareshakritiromitishabdakritastutih || 14||
    omkarakundanilayalingapujanapapahrit | namitasheshadevadirnadipulitasamsthitah || 15|| nandivadyapriyo
    nityo namaparayanapriyah | mahendranilayo mani manasantarapapabhit || 16|| mayaskaro mahayogi mayacakrapravartakah
    | shivah shivatarah shitah shitamshukritabhushanah || 17|| dhanuhsharakaro dhyata dharmadharmaparayanah
    | atma atarya aladya anangasharakhandanah || 18|| ishana idya idhrayashca ibhamastakasamstutah | umasamshlishtavamanga
    ushinaranriparcitah || 19|| udumbaraphalaprita umadisurapujitah | rijishikritabhucakro ripupramathanorjitah
    || 20|| lingarcakajanaprito lingi lingasamapriyah | lipipriyo binduhino lilakritajagattrayah || 21||
    aindridikpatisamyukta aishvaryadiphalapradah | auttanapadapujyanghriraumadisurapujitah || 22|| kalyanacalakodandah
    kamitarthaphalapradah | kasturitilakapritah karpurabhakalevarah || 23|| karandhamasutapritah kalpadiparivarjitah
    | kalpitanekabhutadih kalikalmashanashanah || 24|| kamalabhalasannetrah kamalapatipujitah | khagolkadityavaradah
    khanjaritavarapradah || 25|| kharjuravanamadhyasthah khanditakhandalikarah | khagah khangaharah khandah
    khagagah khakritih khasah || 26|| khandaparshuh khandaghanah khanditaratimandalah | gandharvaganasuprito
    gandhadhriggarvanashakah || 27|| gangadharo goganesho ganeshavaraputrakah | gatido gadaha gandhi gandhamalyavararcitah
    || 28|| gaganastho ganapatirgaganabhogabhushanah | ghantakarnapriyo ghanti ghatajastutisupriyah ||
    29|| ghotakapriyaputrashca gharmakalo ghanakritih | ghanavaho ghritadhyaksho ghanaghosho ghateshvarah
    || 30|| ghatanadakaraprito ghatibhutamahagirih | candracudashcandrakarashcandanardrashcatushpathah
    || 31|| camasodbhedamadhyasthashcandakopashcaturmukhah | cakshuhshrotamahaharashcandikeshavarapradah
    || 32|| cetojanmaharashcandashcaturhotrapriyashcarah | caturmukhamukhastutyashcaturvedashcaracarah
    || 33|| candabhanukarantahsthashcaturmurtivapuhsthitah | chaditanekalokadih chandasam ganamadhyagah
    || 34|| chatracamarashobhadhyah chandogagatidayakah | jangamajangamakaro jagannatho jagadgatah ||
    35|| jahnukanyajato japyo jeta jatrurjanartiha | jambharatirjanaprito janako janikovidah || 36|| janardanardano
    jamijatyadiparivarjitah | jhanajjhananghrijaravo jhankarojjhitadushkriyah || 37|| tankapriyashtankritikashtankabhedi
    takarakah | tadivarnapriyashthanto dhakkanadapriyorasah || 38|| damaritantramadhyastho damarudhvanishobhitah
    | dhakkadhvanikritanalpabadhirikritadinmukha || 39|| nakaro nanukotthadirnantakrinnatimocakah | taskarastamrakastarkshyastamasadigunojjhitah
    || 40|| tarumulapriyastatastamasannashakastatah | thanasuraharah sthata sthanuh sthanapriyah sthirah
    || 41|| data danapatirdanto dandashukavibhushitah | darshaniyo dinadayo danditaratimandalah || 42||
    dakshayajnaharo devo danavarirdamodayah | dattatreyapriyo dandi dadimikusumapriyah || 43|| dhata dhanadhipasakho
    dhanadhanyaprado dhanam | dhamapriyo'
  devanagari: ॐ ॐकारनिलयात्मस्थः ॐकारार्थैकवाचकः । ॐकारेशाकृतिरोमितिशब्दकृतस्तुतिः ॥ १४॥ ॐकारकुण्डनिलयलिङ्गपूजनपापहृत्
    । नमिताशेषदेवादिर्नदीपुलितसंस्थितः ॥ १५॥ नन्दिवाद्यप्रियो नित्यो नामपारायणप्रियः । महेन्द्रनिलयो मानी
    मानसान्तरपापभित् ॥ १६॥ मयस्करो महायोगी मायाचक्रप्रवर्तकः । शिवः शिवतरः शीतः शीतांशुकृतभूषणः ॥ १७॥
    धनुःशरकरो ध्याता धर्माधर्मपरायणः । आत्मा आतार्य आलाद्य अनङ्गशरखण्डनः ॥ १८॥ ईशान ईड्य ईध्रयश्च इभमस्तकसंस्तुतः
    । उमासंश्लिष्टवामाङ्ग उशीनरनृपार्चितः ॥ १९॥ उदुम्बरफलप्रीत उमादिसुरपूजितः । ऋजीषीकृतभूचक्रो रिपुप्रमथनोर्जितः
    ॥ २०॥ लिङ्गार्चकजनप्रीतो लिङ्गी लिङ्गसमप्रियः । लिपिप्रियो बिन्दुहीनो लीलाकृतजगत्त्रयः ॥ २१॥ ऐन्द्रीदिक्पतिसंयुक्त
    ऐश्वर्यादिफलप्रदः । औत्तानपादपूज्याङ्घ्रिरौमादिसुरपूजितः ॥ २२॥ कल्याणाचलकोदण्डः कामितार्थफलप्रदः ।
    कस्तूरीतिलकप्रीतः कर्पूराभकलेवरः ॥ २३॥ करन्धमसुतप्रीतः कल्पादिपरिवर्जितः । कल्पितानेकभूतादिः कलिकल्मषनाशनः
    ॥ २४॥ कमलाभलसन्नेत्रः कमलापतिपूजितः । खगोल्कादित्यवरदः खञ्जरीटवरप्रदः ॥ २५॥ खर्जूरवनमध्यस्थः खण्डिताखण्डलीकरः
    । खगः खङ्गहरः खण्डः खगगः खाकृतिः खसः ॥ २६॥ खण्डपर्शुः खण्डघनः खण्डितारातिमण्डलः । गन्धर्वगणसुप्रीतो
    गन्धधृग्गर्वनाशकः ॥ २७॥ गङ्गाधरो गोगणेशो गणेशवरपुत्रकः । गतिदो गदहा गन्धी गन्धमाल्यवरार्चितः ॥ २८॥
    गगनस्थो गणपतिर्गगनाभोगभूषणः । घण्टाकर्णप्रियो घण्टी घटजस्तुतिसुप्रियः ॥ २९॥ घोटकप्रियपुत्रश्च घर्मकालो
    घनाकृतिः । घनवाहो घृताध्यक्षो घनघोषो घटेश्वरः ॥ ३०॥ घटानादकरप्रीतो घटीभूतमहागिरिः । चन्द्रचूडश्चन्द्रकरश्चन्दनार्द्रश्चतुष्पथः
    ॥ ३१॥ चमसोद्भेदमध्यस्थश्चण्डकोपश्चतुर्मुखः । चक्षुःश्रोतमहाहारश्चण्डिकेशवरप्रदः ॥ ३२॥ चेतोजन्महरश्चण्डश्चातुर्होत्रप्रियश्चरः
    । चतुर्मुखमुखस्तुत्यश्चतुर्वेदश्चराचरः ॥ ३३॥ चण्डभानुकरान्तःस्थश्चतुर्मूर्तिवपुःस्थितः । छादितानेकलोकादिः
    छन्दसां गणमध्यगः ॥ ३४॥ छत्रचामरशोभाढ्यः छन्दोगगतिदायकः । जङ्गमाजङ्गमाकारो जगन्नाथो जगद्गतः ॥ ३५॥ जह्नुकन्याजटो
    जप्यो जेता जत्रुर्जनार्तिहा । जम्भारातिर्जनप्रीतो जनको जनिकोविदः ॥ ३६॥ जनार्दनार्दनो जामिजात्यादिपरिवर्जितः
    । झणज्झणाङ्घ्रिजारावो झङ्कारोज्झितदुष्क्रियः ॥ ३७॥ टङ्कप्रियष्टङ्कृतिकष्टङ्कभेदी टकारकः । टादिवर्णप्रियष्ठान्तो
    ढक्कानादप्रियोरसः ॥ ३८॥ डामरीतन्त्रमध्यस्थो डमरुध्वनिशोभितः । ढक्काध्वनिकृतानल्पबधिरीकृतदिङ्मुख ॥
    ३९॥ णकारो णणुकोत्थादिर्णान्तकृण्णतिमोचकः । तस्करस्ताम्रकस्तार्क्ष्यस्तामसादिगुणोज्झितः ॥ ४०॥ तरुमूलप्रियस्तातस्तमसान्नाशकस्तटः
    । थानासुरहरः स्थाता स्थाणुः स्थानप्रियः स्थिरः ॥ ४१॥ दाता दानपतिर्दान्तो दन्दशूकविभूषितः । दर्शनीयो
    दीनदयो दण्डितारातिमण्डलः ॥ ४२॥ दक्षयज्ञहरो देवो दानवारिर्दमोदयः । दत्तात्रेयप्रियो दण्डी दाडिमीकुसुमप्रियः
    ॥ ४३॥ धाता धनाधिपसखो धनधान्यप्रदो धनम् । धामप्रियोऽ
