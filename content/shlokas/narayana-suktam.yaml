id: narayana-suktam
category: stotram
name:
  english: Narayana Suktam
content:
  english: om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai
    dhata purastadyamudajahara | shakrah pravidvan pradishashcatasrah | tamevam vi~dvanamrita iha bhavati
    | nanyah pantha ayanaya vidyate || ndevam vishvaksham vi~shvashambhuvam | vishva mpadam | vishvatah
    paramannityam nnarayanagm harim | vishvameveda vi~shvasyatmeshvaragm shashvatagm shiva macyutam |
    narayana mparayanam | narayanaparo jyotiratma narayanah parah | narayanapara nnarayanah parah | narayanaparo
    dhyata dhyana nnarayanah parah | yacca kincijjagatsarva 'pi va || antarbahishca tatsarvam ssthitah
    | anantamavyaya nkavigm samudrem vi~shvashambhuvam | padmakosha pratikashagm hridaya ncapyadhomukham
    | adho nishtya vitasyante nabhyamupari tishthati | jvalamalakula mbhati vishvasyayatana mmahat | santatagm
    shilabhistu lambatyakoshasannibham | tasyante sushiragm sukshma mpratishthitam | tasya madhye mahanagni
    rvishvatomukhah | so 'grabhugvibhajantishtha nnaharamajarah kavih | tiryagurdhvamadhashshayi rashmayastasya
    santata | santapayati sva ndehamapadatalamastakah | tasya madhye vahnishikha aniyo rdhva vyavasthitah
    | nilato dvidyullekheva bhasvara | nivarashukavattanvi pita bha svatyanupama | tasya shshikhaya madhye
    parama tma vyavasthitah | sa brahma sa shiva ssvarat || ritagm satya nkrishnapingalam | urdhvaretam
    vi~shvarupaya vai namo namah || o nnarayanaya vidmahe vasudevaya dhimahi | tanno vishnuh pracodaya
  devanagari: ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    धा॒ता पु॒रस्ता॒द्यमु॑दाज॒हार॑ । श॒क्रः प्रवि॒द्वान् प्र॒दिश॒श्चत॑स्रः । तमे॒वं विँ॒द्वान॒मृत॑ इ॒ह
    भ॑वति । नान्यः पन्था॒ अय॑नाय विद्यते ॥ न्दे॒वं॒ वि॒श्वाक्षं॑ विँ॒श्वश॑म्भुवम् । विश्व॑ म्प॒दम् । वि॒श्वतः॒
    पर॑मान्नि॒त्यं॒ न्ना॑राय॒णग्ं ह॑रिम् । विश्व॑मे॒वेद विँश्व॑स्या॒त्मेश्व॑र॒ग्ं॒ शाश्व॑तग्ं शि॒व म॑च्युतम्
    । ना॒राय॒ण म्प॒राय॑णम् । ना॒राय॒णप॑रो ज्यो॒ति॒रा॒त्मा ना॑राय॒णः प॑रः । ना॒राय॒णपर॑ न्ना॑राय॒णः प॑रः
    । ना॒राय॒णप॑रो ध्या॒ता॒ ध्या॒न न्ना॑राय॒णः प॑रः । यच्च॑ कि॒ञ्चिज्ज॑गत्स॒र्व॒ ऽपि॑ वा ॥ अन्त॑र्ब॒हिश्च॑
    तत्स॒र्वं॒ स्स्थि॑तः । अनन्त॒मव्यय॑ ङ्क॒विग्ं स॑मु॒द्रें विँ॒श्वश॑म्भुवम् । प॒द्म॒को॒श प्र॑तीका॒श॒ग्ं॒
    हृ॒दय॑ ञ्चाप्य॒धोमु॑खम् । अधो॑ नि॒ष्ट्या वि॑तस्या॒न्ते॒ ना॒भ्यामु॑परि॒ तिष्ठ॑ति । ज्वा॒ल॒मा॒लाकु॑ल
    म्भा॒ती॒ वि॒श्वस्या॑यत॒न म्म॑हत् । सन्त॑तग्ं शि॒लाभि॑स्तु॒ लम्ब॑त्याकोश॒सन्नि॑भम् । तस्यान्ते॑ सुषि॒रग्ं
    सू॒क्ष्म म्प्रति॑ष्ठितम् । तस्य॒ मध्ये॑ म॒हान॑ग्नि र्वि॒श्वतो॑मुखः । सो ऽग्र॑भु॒ग्विभ॑जन्ति॒ष्ठ॒ न्नाहा॑रमज॒रः
    क॒विः । ति॒र्य॒गू॒र्ध्वम॑धश्शा॒यी॒ र॒श्मय॑स्तस्य॒ सन्त॑ता । स॒न्ता॒पय॑ति स्व न्दे॒हमापा॑दतल॒मस्त॑कः
    । तस्य॒ मध्ये॒ वह्नि॑शिखा अ॒णीयो र्ध्वा व्य॒वस्थि॑तः । नी॒लतो॑ द्वि॒द्युल्ले॑खेव॒ भास्व॑रा । नी॒वार॒शूक॑वत्त॒न्वी॒
    पी॒ता भा स्वत्य॒णूप॑मा । तस्या श्शिखा॒या म॑ध्ये प॒रमा त्मा व्य॒वस्थि॑तः । स ब्रह्म॒ स शिव॒ स्स्व॒राट्
    ॥ ऋतग्ं स॒त्य ङ्कृष्ण॒पिङ्ग॑लम् । ऊ॒र्ध्वरे॑तं विँ॒श्वरू॑पाय॒ वै नमो॒ नमः॑ ॥ ओ न्ना॒रा॒य॒णाय॑ वि॒द्महे॑
    वासुदे॒वाय॑ धीमहि । तन्नो॑ विष्णुः प्रचो॒दया
