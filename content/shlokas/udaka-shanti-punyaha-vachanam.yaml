    | karmakrita ssukrito viryavatih | vishva havisha vardhayantih | ashadhah kama mupayantu yajnam ||
    thsarvametat | amunca loka midamuca sarvam dvijitya | shriya ndadhatvahriniyamanam | ubhau lokau brahmana
    sanjitemau | tanno nakshatra d vicashtam | tasmin vaya mpritana ssanjayema | tanno devaso anujanantu
    kama vishnuh shrinvanti shrona mamritasya gopam | punyamasya upashrinomi vaca vi~shnupatni majuryam
    | pratici menagm havisha yajamah | tredha vishnu rurugayo vicakrame | mahi mantariksham | tacchronaiti
    shrava icchamana | punyagg shlokam ~yajamanaya krinvati || vasavah ashtau deva vasavassomyasah | catasro
    devi rajara shshravishthah | te yajna mamritagg svasti || nnah pantu vasavah purasta 'bhiyantu shravishthah
    | punyannakshatramabhi sam vi~shama | ma no arati raghashagm sagann || varunah kshatrasya raja varuno
    'dhirajah | nakshatranagm shatabhishag vasishthah | tau devebhyah krinuto dirghamayuh | shatagm sahasra
    bheshajani dhattah | yajnanno raja varuna upayatu | tanno vishve abhisam || tanno nakshatragm shatabhishag
    jushanam | dirghamayuh pratira purvaproshthapada devata ajayekapadah aja ekapa t | vishva bhutani
    prati modamanah | tasya devah prasavam | proshthapadaso amritasya gopah | vibhrajamana ssamidhana
    ugrah | a gandyam | tagm surya majamekapadam | proshthapadaso anuyanti sarve uttaraproshthapada devata
    rbudhniyah prathamana eti | shreshtho devanamuta manushanam | ta ssomyasah | proshthapadaso abhirakshanti
    sarve | catvara ekamabhi karma devah | proshthapadasa iti yan vadanti | te budhniyam parishadyagg
    stuvantah | ahigm rakshanti namasopasadya || pusha pusha revatyanveti pantha m | pushtipati pashupa
    vajabastyau || || imani havya prayata jushana | sugairno yanairupayatam ya~jnam | kshudra nrakshatu
    revati nah | gavo no ashvagm anvetu pusha | annagm rakshantau bahudha virupam | vajagm sanutam ~yajamanaya
    yajnam || ashvini deva tadashvina vashvayujopayatam | shubhangamishthau suyamebhirashvaih | svannakshatragm
    havisha yajantau | madhva sampriktau yajusha samaktau || mbhishajau havyavahau | vishvasya duta vamritasya
    gopau | tau nakshatram yamah apa papmanam bharani dyamo raja bhagavan vicashtam | lokasya raja mahato
    mahan hi | sugannah panthamabhaya nnakshatre yama eti raja mabhyashimcanta devah | tadasya citragm
    havisha yajama | apa papmanam bharani amavasi niveshani yatte deva adadhuh | niveshani sangamani vasunam
    ~vishva rupani vasu veshayanti | sahasraposhagm subhaga rarana sa na agan varcasa sam vi~dana | yatte
    deva adadhu va~santo mahitva | sa no yajna mpiprihi vishvavare rayinno dhehi subhage suviram candrama
    navo navo bhavati jayamano yamaditya agmshuma pyayayanti | navo navo bhavati jayamano ndevebhyo vidadhatyaya
    stirati dirghamayuh | yamaditya agmshuma pyayayanti yamakshita makshitayah pibanti | tena no raja
    varuno brihaspati rapyayayantu bhuvanasya gopah | aho ratri ye virupe samanasa sam | vibhu prabhu
    anubhu vishvato huve | te no nakshatre havamagametam | vaya ndevi brahmana sam vi~danah | suratnaso
    devavitim dadhanah || || ahoratre havisha vardhayantah | ati papmana usha pratyuva drishyayati | vyucchanti
    duhita divah | apo mahi vrinute cakshusha | tamo jyotish ssacate suryah | sa ca udyannakshatra marcimat
    | tave dusho vyushi suryasya ca | sambhaktena gamemahi || nakshatrah tanno nakshatra marcimat | bhanumatteja
    uccharat | upa yajnamihagamat | pranakshatraya devaya | indrayendugm havamahe | sa na ssavita suva
    thsanim | pushtidam ncitram || udutya va~hanti ketavah | drishe vishvaya surya ndevana mudagadanikam
    cakshu rmitrasya varunasyagneh || 'pra dyavaprithivi antariksha surya atma jagatastasthushashca ||
    aditih aditirna urushyatu mahimushu matara m || aditirna urushya shsharma yacchatu | aditih patvagm
    hasah || mahimushu mataragm suvratana mritasya patni mavase huvema | tuvikshatra majaranti murucigm
    susharmana maditigm supranitim | vi~shnu pratadvishnuh || idam rvicakrame tredha nidadhe padam | samudhamasya
    pagm sure || pratadvishnu stavate viryaya | mrigo na bhimah kucaro girishthah | yasyorushu trishu
    vikramaneshu | adhikshiyanti bhuvanani vishva rmurdha bhuvah || agni rmurdha divah kakutpatih prithivya
    ayam | apagm retagmsi jinvati || bhuvo yajnasya rajasashca neta yatra niyudbhi ssacase shivabhih |
    divi murdhanam dadhishe suvarsha njihvamagne cakrishe havyavaha ranvidanumate tvam || anuno ndeveshu
    manyatam | agnishca havyavahano bhavata ndashushe mayah | anvidanumate tva mmanyasai shanca nah kridhi
    | kratve dakshaya no hinu prana ayugmshi tarishah | havyavahagg svishtam || havyavahamabhi m | rakshohanam
    pritanasu jishnum | jyotishmantam didyatam purandhim | agnigg svishta kritama huvema | svishta magne
    abhita tprinahi | vishva deva pritana abhishya | urunnah pantha mpradishan vibhahi | jyotishmaddhehya
    jaranna ayuh || nakshatra upahoma mantrah krittika agnaye svaha krittikabhya ssvaha | ambayai svaha
    dulayai svaha | nitatnyai svaha 'bhrayantyai svaha | meghayantyai svaha varshayantyai svaha | cupunikayai
    svaha rohini prajapataye svaha rohinyai svaha | rocamanayai svaha shah somaya svaha mrigashirshaya
    svaha | invakabhya ssvahaushadhibhya ssvaha ardra rudraya svaha | pinvamanayai svaha pashubhya ssvaha
    punarvasu adityai svaha punarvasubhyam | svaha brihaspataye svaha tishyaya svaha | brahmavarcasaya
    svaha ashresha sarpebhya ssvaha ''shreshabhya ssvaha magha pitribhya ssvaha maghabhyah | svaha 'naghabhya
    ssvaha 'gadabhyah | svaharundhatibhya ssvaha purva phalguni aryamne svaha phalgunibhyag svaha uttara
    phalguni bhagaya svaha phalgunibhyag svaha | shraishthyaya svaha hastah savitre svaha hastaya | svaha
    dadate svaha prinate | svaha pratigribhnate svaha citra tvashtre svaha citrayai svaha svati vayave
    svaha nishtyayai svaha | kamacaraya svaha 'bhijityai svaha vishakha indragnibhyag svaha vishakhabhyag
    svaha | shraishthyaya svaha 'bhijityai svaha paurnamasi paurnamasyai svaha kamaya svaha anuradha mitraya
    svaha 'nuradhebhya ssvaha | mitradheyaya svaha jyeshtha indraya svaha | jyaishthyaya svaha mulam prajapataye
    svaha mulaya svaha purvashadha adbhya ssvaha 'shadhabhya ssvaha | samudraya svaha kamaya svaha | abhijityai
    svaha bhyo devebhya ssvaha 'shadhabhya ssvaha | anapajayyaya svaha jityai svaha abhijit brahmane svaha
    'bhijite svaha | brahmalokaya svaha 'bhijityai svaha shravanam vishnave svaha shravishtha vasubhya
    ssvaha shravishthabhya ssvaha | agraya svaha pari shatabhishak varunaya svaha shatabhishaje svaha
    | bheshajebhya ssvaha purva proshthapada ajayaikapade svaha proshthapadebhya ssvaha brahmavarcasaya
    svaha uttara proshthapada ahaye budhniyaya svaha proshthapadebhya ssvaha | pratishthayai svaha revati
    pushne svaha revatyai svaha ashvini ashvibhyag svaha 'shvayugbhyag svaha | shrotraya svaha shrutyai
    svaha apabharani yamaya svaha 'pabharanibhya ssvaha | rajyaya svaha 'bhijityai svaha amavasi amavasyayai
    svaha kamaya svaha ''gatyai svaha candrama candramase svaha pratidrishyayai svaha | ahoratrebhya ssvaha
    'rdhamasebhya ssvaha bhya ssvahartubhya ssvaha aho ratri ahne svaha ratriyai svaha | atimuktyai svaha
    usha ushase svaha vyushtyai svaha | vyushushyai svaha vyucchantyai svaha | vyushtayai svaha nakshatrah
    nakshatraya svahodeshyate svaha | harase svaha bharase svaha | bhrajase svaha tejase svaha brahmavarcasaya
    svaha suryah suryaya svaha nakshatrebhya ssvaha | pratishthayai svaha aditih adityai svaha pratishthayai
    svaha vishnuh vishnave svaha yajnaya svaha | pratishthayai svaha || dadhikravnno akarisham dadhikravnno
    akarisham | jishno rashvasya vajinah | surabhi no mukha karat | prana ayugmshi tarishat | apohishtha
    mayobhuvasta na urje dadhatana | mahe ranaya cakshase | yo vashshivatamo rasastasya bhajaya teha nah
    | ushatiriva matarah | tasma arangamama vo yasya kshayaya jinvatha | apo janayatha ca nah || shrathaya
    | atha vayamaditya vrate tavanagaso aditaye syama || mrishabho antariksha 'sidadvishva bhuvanani samra
    dvishvettani varunasya vratani || va~runa daivye jane shcaramasi | acitti manastasma denaso deva ririshah
    || kitavaso yadriripurna divi yadva gha satya mutayanna vidma | sarvatavishya shithireva devathate
    syama varuna priyasah || avatehedo varuna namobhirava yajne bhirimahe havirbhih | kshayanna smabhya
    masura praceto rajannenagmsi shishrathah kritani || tatvayami brahmana vandamana stadasha ste yajamano
    havirbhih | ahedamano varuneha boddhyurushagm sa ma na ayuh pramoshih || pavamana suktam hiranyavarna
    shshucayah pavaka yasujatah kashyapo yasvindrah | agnim ya~ garbhamdadhire virupasta na apashshagg
    syona bhavantu || yasagm raja varuno yati madhye satyanrite avapashyan jananam | madhushcuta shshucayoyah
    pavakasta na apashshagg syona bhavantu || yasam devadivi krinvanti bhaksham ya~ antarikshe bahudha
    bhavanti | yah prithivi mpayasondanti shukrasta na apashshagg syona bhavantu || shivena ma cakshusha
    pashyatapa shshivaya tanuvo mme | sarvagm agnigm raphsushado huve vo mayi varco balamojo nidhatta
    || ssuvarjanah | pavitrena vicar shanih | yah pota sa punatu ma | punantu ma devajanah | punantu mana
    vodhiya | punantu vishva ayavah | jatavedah pavitravat | pavitrena punahi ma | shukrena deva didyat
    | agne kratva marcishi | agne vitata mantara | brahma tena punimahe | ubhabhyam deva savitah | pavitrena
    savena ca | ida mbrahma punimahe | vaishvadevi punati devyaga stanuvo vitaprishthah | taya madanta
    ssadhamadyeshu | vayagg syama patayorayinam || || vaishvanaro rashmibhirma punatu | vatah pranene
    shiro mayo bhuh | dyavaprithivi payasa payobhih | ritavari yajniye ma punitam | brihadbhih savitastribhih
    | var rdeva manmabhih | agne dakshaih punahi ma | yena deva apunata | ye nkashah | tena divyena brahmana
    || mbrahma punimahe | yah pavamani raddhyeti | rishibhi m | sarvagm sa putamashnati | svadita mmatarishvana
    | pavamaniryo addhyeti | rishibhi m | tasmai sarasvati duhe | kshiragm sarpi rmadhudakam | pavamani
    || sudughahi payasvatih | rishibhi ssambhrito rasah | brahmaneshva mritagm hitam | pavamani rdishantu
    nah | imam lo~kamatho amum | kaman thsamardhayantu nah | devirdevai ssamabhritah | pavamani ssvastyayanih
    | sudughahi ghritashcutah | rishibhi mritagm hitam | yena devah pavitrena | atmanam punate sada |
    tena sahasra dharena | pavamanyah punantu ma | prajapatya m | shatodyamagm hiranmaya m | tena brahma
    vido vayam | puta mbrahma punimahe | indra ssuniti saha ma punatu | soma pramrinabhih punatuma | jataveda
    morjayantya punatu | o taccham~yora vrinimahe | gatum rmanushebhyah | urdhva njigatu bheshajam | shanno
    astu dvipade ayushya suktam yo brahmabrahmana ujjabhara praneshvarah yo brahma brahmana ujjahara pranai
    krittivasah pinaki | ishano devassana ayurdadhatu tasmai juhomi havisha ghritena || ssarirasya madhyad
    rocamano gharmarucirya agat | sa mrityupasha nihayusheno ghritamattu devah || || brahmajyotir brahmapatnishu
    garbham njayantam | suvarnarambha ntamayushe vardhayamo ghritena || ngam shashtinca yamindrasenetyudahuh
    | tam mbrahmayonigm sarupa mihayushe tarpayamo ghritena || ssarvayonya ssuyonya ssahasrasho vishva
    rupa virupah | sasunava ssayuthya ayusheno ghritamida || divya gana bahurupah purana ayushchido nah
    pramathnantu viran | tebhyo juhomi bahudha ghritena ma nah prajagm ririsho mota viran || || ekah purastat
    ya ida mbabhuva yato babhuva bhuvanasya gopah | yamapyeti bhuvanagm samparaye sa no havir ghrita tha
    saddhyan ribhun yaksha ngandharvagmshca pitrigmshca vishvan | bhrigun nghritagm hutva svayushya mahayama
    shashvat || || vishno tvanno antama shsharmayaccha sahantya | prate dhara madhushcuta uthsanduhrate
    akshitam || || namo brahmane namo astvagnaye namah prithivyai nama oshadhibhyah | namo vace namo vacaspataye
    namo vishnave brihate karomi || ntu yadbhavet | tatsarva stute || visarga bindu matrani padapadaksharani
    ca | nyunatiriktam ya~tkincidabhigirbhirudiryate || abhir girbhir yadatona unamapyayaya harivo vardhamanah
    | yada stotribhyo mahi gotra rujasi bhuyishthabhajo adhate shyama | brahma pravadishma tanno mahasit
    | om shanti harih om | shrikrishnarpanamastu || o ntatsat brahmarpanamastu || ityudakashantimantrah
    ||
  devanagari: कलश प्रतिष्ठापन प्रयोग मन्त्राः ब्रह्म॑जज्ञा॒न स्सु॒रुचो॑ वे॒न आ॑वः । स बु॒ध्निया॑ उप॒मा
    अ॑स्य वि॒ष्ठा मस॑तश्च॒ विवः॑ । नाके॑ सुप॒र्ण मुप॒य त्पत॑न्तग्ं हृ॒दा वेन॑न्तो अ॒भ्यच॑क्ष तत्वा । हिर॑ण्यपक्षं॒
    यँ॒मस्य॒ योनौ॑ शकु॒न म्भु॑र॒ण्युम् । आप्या॑यस्व॒ समे॑तु ते वि॒श्वतः॑ सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य
    सङ्ग॒थे । यो रु॒द्रो अ॒ग्नौ यो अ॒फ्सु य ओष॑धीषु॒ यो रु॒द्रो विश्वा॒ भुव॑ना ऽऽवि॒वेश॒ तस्मै॑ रु॒द्राय॒
    नमो॑ अस्तु । विँष्णु॒ र्विच॑क्रमे त्रे॒धा निद॑धे प॒दम् । समू॑ढमस्य पाग्ं सु॒रे । इन्द्रं॒ ङ्गिरः॑
    । र॒थीत॑मग्ं रथी॒नां वाँजा॑ना॒ग्ं॒ सत्प॑ति॒ म् । आपो॒ वा इ॒दंग्ं सर्वं॒ विँश्वा॑ भू॒तान्यापः॑ प्रा॒णा
