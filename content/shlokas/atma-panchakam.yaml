id: atma-panchakam
category: stotram
name:
  english: Atma Panchakam
content:
  english: na'ham deho nendriyanyantarangam na'hankarah pranavargo na ca'ham | darapatyakshetravittadidura
    ssakshi nityah pratyagatma shivo'ham || || rajjvajnanadbhati rajjuryatha hi ssvatmajnanadatmano jivabhavah
    | aptoktya hi bhrantinashe sa rajju rjivo na'ham deshikoktya shivo'ham || || abhatidam vishvamatmanyasatyam
    satyajnananandarupe vimohat | nidramoha tsvapnavattanna sattyam shuddhah purno nitya ekashshivo'ham
    || || matto nanyatkincidatrapti vishvam satyam bahyam vastumayopakluptam | adarshantarbhasamanasya
    tulyam mayyadvaite bhati tasmacchivo'ham || || na'ham jato na pravriddho na nashto dehasyoktah prakritassarvadharmah
    | kartritvadi shcinmayasyasti na'ham karasyaiva hyatmano me shivo'ham || || na'ham jato janmamrityuh
    kuto me na'ham pranah kshutpipase kuto me | na'ham cittam shokamohau kuto me na'ham karta bandhamokshau
    kuto me || || iti shrimacchankarabhavatpadacarya svami viracitatmapancakam ||
  devanagari: नाऽहं देहो नेन्द्रियाण्यन्तरङ्गं नाऽहङ्कारः प्राणवर्गो न चाऽहम् । दारापत्यक्षेत्रवित्तादिदूर
    स्साक्षी नित्यः प्रत्यगात्मा शिवोऽहम् ॥ ॥ रज्ज्वज्ञानाद्भाति रज्जुर्यथा हि स्स्वात्माज्ञानादात्मनो
    जीवभावः । आप्तोक्त्या हि भ्रान्तिनाशे स रज्जु र्जीवो नाऽहं देशिकोक्त्या शिवोऽहम् ॥ ॥ अभातीदं विश्वमात्मन्यसत्यं
    सत्यज्ञानानन्दरूपे विमोहात् । निद्रामोहा त्स्वप्नवत्तन्न सत्त्यं शुद्धः पूर्णो नित्य एकश्शिवोऽहम्
    ॥ ॥ मत्तो नान्यत्किञ्चिदत्राप्ति विश्वं सत्यं बाह्यं वस्तुमायोपक्लुप्तम् । आदर्शान्तर्भासमानस्य तुल्यं
    मय्यद्वैते भाति तस्माच्छिवोऽहम् ॥ ॥ नाऽहं जातो न प्रवृद्धो न नष्टो देहस्योक्ताः प्राकृतास्सर्वधर्माः
    । कर्तृत्वादि श्चिन्मयस्यास्ति नाऽहं कारस्यैव ह्यात्मनो मे शिवोऽहम् ॥ ॥ नाऽहं जातो जन्ममृत्युः कुतो
    मे नाऽहं प्राणः क्षुत्पिपासे कुतो मे । नाऽहं चित्तं शोकमोहौ कुतो मे नाऽहं कर्ता बन्धमोक्षौ कुतो मे
    ॥ ॥ इति श्रीमच्छङ्करभवत्पादाचार्य स्वामि विरचितात्मपञ्चकम् ॥
