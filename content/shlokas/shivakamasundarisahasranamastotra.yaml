id: shivakamasundarisahasranamastotra
category: stotram
name:
  english: shivakamasundarisahasranamastotra
  devanagari: शिवकामसुन्दरीसहस्रनामस्तोत्र
content:
  english: '|| 19|| tvayaiva cintaniyam tat tvatto nanyasti hi priya | etannamasahasrasya jape traivarnikah
    priye || 20|| mayadhikriyate''nyesham ca bhavedadhikarata | anye tu pathayedvipraih labherandaveshtakamanam
    || 21|| yo viprashshantahridayah namasahasramuttamam | japati shraddhaya yuktah sarvankamanavapnuyat
    || 22|| shukravare saumavare bhaumavare gurordine | darshe parvani pancamyam navamyam kulasundari
    || 23|| krishnangaracaturdashyam sankrantavayane vishau | vrishe shuklanavamyam ca shravanyam mulabhe
    shubhe || 24|| ashadhe ca tulayam ca nakshatre purvaphalgune | jyeshthe ca phalgune masi uttare phalgune
    shubhe || 25|| nakshatre ca shubham devim gaurinamabhirambikam | arcayetsatatam prita sundari bhavati
    priye || 26|| pratipanmukharakantadinaratrishu cambikam | arcayetkusumairbilvaih haridraih kukumaih
    shubhaih || 27|| haridracurnasampriktairakshatairtulasidalaih | kesaraih ketakaishcaiva mandaraishcampakairapi
    || 28|| prathamam gandhatailenabhishicya tatah param | payasa madhuna daghna ghritena likucena ca
    || 29|| narikelamrapanasakadalinam phalatrayam | sharkaramadhusampriktam pancjamritamathambikam ||
    30|| abhishicya tatah pashcatsagandhishcandanaih shubhaih | annaishca kunkumaishcaiva phalanam ca
    rasaistatha || 31|| gangambubhistatah kuryatvasitaih salilaishshubhaih | samyagunmarjya vastraishca
    pitambaramukhaih shivaih || 32|| acchadya kancukaishcaivalankrityabharanaissumaih | shuddhannaih payasannaishca
    rasakhandannaishca bhakshyakaih || 33|| gudanneh payasapupairmashapupaishca lehyakaih | khadyaishca
    vividhairannaih citrannaishca visheshatah || 34|| laddukairmodakaishcapi karambhaishca sharavakaih
    | phalaishca vividhaishcapi kuryannaivedyamadarat || 35|| shodashairupacaraishca pujayecchivasundarim
    | suvasinih kanyakashca vastrannaishca prapujayet || 36|| ebhirnamabhirevaitam murte yantre ghate''pi
    va | avahyabhyarcyayeddevim japedva sannidhau stutim || 37|| yam yam kamayate shighram tam tam prapnotyasamshayah
    | vidyarthi labhate vidyam putrarthi putramapnuyat || 38|| kanyarthi labhate kanyam apsarassadrishim
    shive | dhanarthi labhate shighram dhanam bhuri maheshvari || 39|| shrividyopastishilanamatmaraksharthamadarat
    | shatrunirghatanarthanca svadasanugrahaya ca || 40|| japtavyam satatam bhadre shrutivadvagyatashshucih
    | sarvamantradhikaratvat shrividyopasakasya tu || 41|| gurum svayam japyam vina sundaryevasya deshika
    | teshameva vidhih prokto nanyesham menakatmante || 42|| upadeshadeva ca guroh japtavyam shivabhashitam
    | shricakrapurasamajastripuratushtikaranam || 43|| tattvamasyadivakyarthaparabrahmapadapradam | shivajnanapradam
    devi shighrasiddhikaram param || 44|| shrautasmartadikarmadau bhaktyedam yo japetpriye | avighnena
    ca tatkarma saphalyam caiti nishcayah || 45|| yuddhe prayane durddharshe svapne vate jale bhaye |
    japtavyam satatam bhadre tattacchantyai maheshvari || 46|| tattanmatrikaya pustam tritarena samanvitam
    | stotrametajjapeddevimarcayecca visheshatah || 47|| sada tasya hridambhoje sundari vasati dhuvam
    | animadimahasiddhih labhate natra samshayah || 48|| ashvamedhadibhiryajnaih yatphalam tat sudurlabham
    | animadimamahasiddhih labhate natra samshayah || 49|| ebhirnamabhirevam yah kalim durganca candikam
    | arcayetsatatam bhaktya ye sarvankamamllabhennarah || 50|| sundarimurtibhedashca kali durga ca candika
    || 51|| ekaiva shaktih parameshvarasya bhinna caturdha viniyogakale | bhoge bhavani purusheshu vishnuh
    kopeshu kali samareshu durga || 52|| eka shaktishca shambhorvinimayanavidhau sa caturdha vibhinna
    krodhe kali vijataca samarasamaye sa ca candi ca durga | bhoge srishtau niyoge ca sakalajagatam sa
    bhavani ca jata sarvesham rakshananugrahakaranavidhau tasya vishnurbhavetsa || 52|| samprayacchati
    tasyeshtamaciradeva sundari | stotraratnamidam bhadre sada nishkamanayutah || 53|| yo japenmamakam
    dhama brahmavishnvadidurlabham | satyajnanamanantakhyam brahmam kaivalyasanjnakam || 54|| bhavabdhitarakam
    so''pi prapnoti madanugrahat | citsabhayam nrityamananatarajasya sakshini || 55|| tasyaiva mahishi
    namra shivakama ca sundari | sa parabrahmamahishi sadananda shubhaprada || 56|| shivakamasundarinamnam
    sahasram proktamambike | etasya sadrisham stotram nasti nasti jagattraye || 57|| satyam satyam punassatyam
    tvam shape''ham vadami te | nastikaya kritaghnaya vipradveshaparaya ca || 58|| na deyam vedaviprarshibhaktiyuktaya
    shambhavi | deyam tripuravidyeshityatharvashruti coditam || 59|| vistritena kimanyacca shrotukamasi
    sundari | iti nigaditavantam rajate parvate''smin navamaniganapithe samsthitam devamisham | muhurapi
    kritanamra bhaktinamra bhavani karayugasarasijenalilingatigadham || 60|| iti shribhringiritisamhitayam
    shaktyutkarshaprakarane shivagaurisamvade shrishivakamasundarisahasranamastotrottarapithika sampurna
    || || shivamastu ||'
  devanagari: ॥ १९॥ त्वयैव चिन्तनीयं तत् त्वत्तो नान्यास्ति हि प्रिया । एतन्नामसहस्रस्य जपे त्रैवर्णिकः
    प्रिये ॥ २०॥ मयाधिक्रियतेऽन्येषां च भवेदधिकारता । अन्ये तु पाठयेद्विप्रैः लभेरन्दवेष्टकामनाम् ॥ २१॥
    यो विप्रश्शान्तहृदयः नामसाहस्रमुत्तमम् । जपति श्रद्धया युक्तः सर्वान्कामानवाप्नुयात् ॥ २२॥ शुक्रवारे
    सौमवारे भौमवारे गुरोर्दिने । दर्शे पर्वणि पञ्चम्यां नवम्यां कुलसुन्दरि ॥ २३॥ कृष्णाङ्गारचतुर्दश्यां
    सङ्क्रान्तावयने विषौ । वृषे शुक्लनवम्यां च श्रावण्यां मूलभे शुभे ॥ २४॥ आषाढे च तुलायां च नक्षत्रे
    पूर्वफल्गुने । ज्येष्ठे च फाल्गुने मासि उत्तरे फल्गुने शुभे ॥ २५॥ नक्षत्रे च शुभां देवीं गौरीनामभिरम्बिकाम्
    । अर्चयेत्सततं प्रीता सुन्दरी भवति प्रिये ॥ २६॥ प्रतिपन्मुखराकान्तदिनरात्रिषु चाम्बिकाम् । अर्चयेत्कुसुमैर्बिल्वैः
    हारिद्रैः कुकुमैः शुभैः ॥ २७॥ हरिद्राचूर्णसम्पृक्तैरक्षतैर्तुलसीदलैः । केसरैः केतकैश्चैव मन्दारैश्चम्पकैरपि
    ॥ २८॥ प्रथमं गन्धतैलेनाभिषिच्य ततः परम् । पयसा मधुना दघ्ना घृतेन लिकुचेन च ॥ २९॥ नारिकेलाम्रपनसकदलीनां
    फलत्रयम् । शर्करामधुसम्पृक्तं पञ्च्जामृतमथाम्बिकाम् ॥ ३०॥ अभिषिच्य ततः पश्चात्सगन्धीश्चन्दनैः शुभैः
    । अन्नैश्च कुङ्कुमैश्चैव फलानां च रसैस्तथा ॥ ३१॥ गङ्गाम्बुभिस्ततः कुर्यात्वासितैः सलिलैश्शुभैः । सम्यगुन्मार्ज्य
    वस्त्रैश्च पीताम्बरमुखैः शिवैः ॥ ३२॥ आच्छाद्य कञ्चुकैश्चैवालङ्कृत्याभरणैस्सुमैः । शुद्धान्नैः पायसान्नैश्च
    रसखण्डान्नैश्च भक्ष्यकैः ॥ ३३॥ गुडान्नेः पायसापूपैर्माषापूपैश्च लेह्यकैः । खाद्यैश्च विविधैरन्नैः
    चित्रान्नैश्च विशेषतः ॥ ३४॥ लड्डुकैर्मोदकैश्चापि करम्भैश्च शरावकैः । फलैश्च विविधैश्चापि कुर्यान्नैवेद्यमादरात्
    ॥ ३५॥ षोडशैरुपचारैश्च पूजयेच्छिवसुन्दरीम् । सुवासिनीः कन्यकाश्च वस्त्रान्नैश्च प्रपूजयेत् ॥ ३६॥ एभिर्नामभिरेवैतां
    मूर्ते यन्त्रे घटेऽपि वा । आवाह्याभ्यर्च्ययेद्देवीं जपेद्वा सन्निधौ स्तुतिम् ॥ ३७॥ यं यं कामयते शीघ्रं
    तं तं प्राप्नोत्यसंशयः । विद्यार्थी लभते विद्यां पुत्रार्थी पुत्रमाप्नुयात् ॥ ३८॥ कन्यार्थी लभते कन्यां
    अप्सरस्सदृशीं शिवे । धनार्थी लभते शीघ्रं धनं भूरि महेश्वरि ॥ ३९॥ श्रीविद्योपास्तिशीलानामात्मरक्षार्थमादरात्
    । शत्रुनिर्घातनार्थञ्च स्वदासानुग्रहाय च ॥ ४०॥ जप्तव्यं सततं भद्रे श्रुतिवद्वाग्यतश्शुचिः । सर्वमन्त्राधिकारत्वात्
    श्रीविद्योपासकस्य तु ॥ ४१॥ गुरुं स्वयं जप्यं विना सुन्दर्येवास्य देशिका । तेषामेव विधिः प्रोक्तो नान्येषां
    मेनकात्मन्ते ॥ ४२॥ उपदेशादेव च गुरोः जप्तव्यं शिवभाषितम् । श्रीचक्रपुरसमाजस्त्रिपुरातुष्टिकारणम् ॥
    ४३॥ तत्त्वमस्यादिवाक्यार्थपरब्रह्मपदप्रदम् । शिवज्ञानप्रदं देवि शीघ्रसिद्धिकरं परम् ॥ ४४॥ श्रौतस्मार्तादिकर्मादौ
    भक्त्येदं यो जपेत्प्रिये । अविघ्नेन च तत्कर्म साफल्यं चैति निश्चयः ॥ ४५॥ युद्धे प्रयाणे दुर्द्धर्षे
    स्वप्ने वाते जले भये । जप्तव्यं सततं भद्रे तत्तच्छान्त्यै महेश्वरि ॥ ४६॥ तत्तन्मातृकया पुस्तं त्रितारेण
    समन्वितम् । स्तोत्रमेतज्जपेद्देवीमर्चयेच्च विशेषतः ॥ ४७॥ सदा तस्य हृदम्भोजे सुन्दरी वसति धुवम् । अणिमादिमहासिद्धीः
    लभते नात्र संशयः ॥ ४८॥ अश्वमेधादिभिर्यज्ञैः यत्फलं तत् सुदुर्लभम् । अणिमादिममहासिद्धीः लभते नात्र
    संशयः ॥ ४९॥ एभिर्नामभिरेवं यः कालीं दुर्गाञ्च चण्डिकाम् । अर्चयेत्सततं भक्त्या ये सर्वान्कामांल्लभेन्नरः
    ॥ ५०॥ सुन्दरीमूर्तिभेदाश्च काली दुर्गा च चण्डिका ॥ ५१॥ एकैव शक्तिः परमेश्वरस्य भिन्ना चतुर्धा विनियोगकाले
    । भोगे भवानी पुरुषेषु विष्णुः कोपेषु काली समरेषु दुर्गा ॥ ५२॥ एका शक्तिश्च शम्भोर्विनिमयनविधौ सा चतुर्धा
    विभिन्ना क्रोधे काली विजाताच समरसमये सा च चण्डी च दुर्गा । भोगे सृष्टौ नियोगे च सकलजगतां सा भवानी
    च जाता सर्वेषां रक्षणानुग्रहकरणविधौ तस्य विष्णुर्भवेत्सा ॥ ५२॥ सम्प्रयच्छति तस्येष्टमचिरादेव सुन्दरी
    । स्तोत्ररत्नमिदं भद्रे सदा निष्कामनायुतः ॥ ५३॥ यो जपेन्मामकं धाम ब्रह्मविष्ण्वादिदुर्लभम् । सत्यज्ञानमनन्ताख्यं
    ब्राह्मं कैवल्यसञ्ज्ञकम् ॥ ५४॥ भवाब्धितारकं सोऽपि प्राप्नोति मदनुग्रहात् । चित्सभायां नृत्यमाननटराजस्य
    साक्षिणी ॥ ५५॥ तस्यैव महिषी नाम्रा शिवकामा च सुन्दरी । सा परब्रह्ममहिषी सदानन्दा शुभप्रदा ॥ ५६॥ शिवकामसुन्दरीनाम्नां
    सहस्रं प्रोक्तमम्बिके । एतस्य सदृशं स्तोत्रं नास्ति नास्ति जगत्त्रये ॥ ५७॥ सत्यं सत्यं पुनस्सत्यं
    त्वां शपेऽहं वदामि ते । नास्तिकाय कृतघ्नाय विप्रद्वेषपराय च ॥ ५८॥ न देयं वेदविप्रर्षिभक्तियुक्ताय
    शाम्भवि । देयं त्रिपुरविद्येशीत्यथर्वश्रुति चोदितम् ॥ ५९॥ विस्तृतेन किमन्यच्च श्रोतुकामासि सुन्दरि
    । इति निगदितवन्तं राजते पर्वतेऽस्मिन् नवमणिगणपीठे संस्थितं देवमीशम् । मुहुरपि कृतनम्रा भक्तिनम्रा
    भवानी करयुगसरसिजेनालिलिङ्गातिगाढम् ॥ ६०॥ इति श्रीभृङ्गिरिटिसंहितायां शक्त्युत्कर्षप्रकरणे शिवगौरीसंवादे
    श्रीशिवकामसुन्दरीसहस्रनामस्तोत्रोत्तरपीठिका सम्पूर्णा ॥ ॥ शिवमस्तु ॥
