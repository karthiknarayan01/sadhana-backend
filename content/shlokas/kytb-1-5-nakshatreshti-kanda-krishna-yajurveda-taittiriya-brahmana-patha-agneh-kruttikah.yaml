id: kytb-1-5-nakshatreshti-kanda-krishna-yajurveda-taittiriya-brahmana-patha-agneh-kruttikah
category: stotram
name:
  english: KYTB 1.5 Nakshatreshti Kanda - Krishna Yajurveda Taittiriya Brahmana Patha - Agneh Kruttikah
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake pancamah prapathakah nakshatreshtikandam
    o shri gurubhyo namah | harih om || anuvakam nakshatreshtakamantrah vikritirupacayanagatah agneh krittikah
    | shukra t || prajapate rohini | apah parastadoshadhayo 'vasta t || somasyenvaka vitatani | parastadvayanto
    'vasta t || rudrasya bahu | mrigayavah parasta t || adityai punarvasu | vatah parastadardra stishyah
    | juhvatah parasta mashreshah | abhyagacchantah parastadabhyanrityanto mmaghah | rudantah parastadapabhragmsho
    t || aryamnah purve phalguni | jaya parastadrishabho t || bhagasyottare | vahatavah parastadvahamana
    avasta hastah | prasavah parasta t || indrasya citra | rita vratatih | parasta t || indragniyo rvishakhe
    | yugani parasta nuradhah | abhyarohat || indrasya rohini | shrinat hani | pratibhanjantah parasta
    mpurva ashadhah | varcah parasta muttarah | abhijayat shshrona pricchamanah | parastat || vasunag
    shravishthah | bhuta shatabhishak | vishvavyacah parasta t || ajasyaikapadah purve proshthapadah |
    vaishvanara syottare | abhishincantah parasta t || ashvinorashvayujau | gramah parastathsena 'vasta
    t || yamasyapabharanih | apakar t || purna pashcaduta purna purastadunmadhyatah pau rnamasi jigaya
    | tasya va~santa uttame naka iha madayantam || yatte deva adadhu rbhagadheyamamavasye sam va~santo
    mahitva | sano yajna mpiprihi vishvavare rayi nno dhehi subhage suvira dabhyarudhamavastat hah nakshatrarupah
    punyakalah ya tkurvitopavyusham | yada vai surya udeti | atha nakshatra nnaiti | yavati tatra suryo
    gacche t | tavati kurvita ya tkari syat | punyaha eva kurute | evagm ha vai yajneshu nca mathsyo niravasayaya
    || yo vai nakshatriya rviduh | hasta evasya hastah | citra shirah | nishtya hridayam | uru vishakhe
    | pratishtha 'nuradhah | esha vai nakshatriyah prajapatih | ya evam mpriya syaditi | ta ndadyat |
    priyaiva bhavati | neva tu punaragacchati || abhijinnama nakshatram | uparishta ya~tta asann | te
    devastasmi || yadabhyajayann | tadabhijito njayediti | tametasmi nnakshatre yatayet | anapajayyameva
    jayati | papaparajitamiva tu || prajapatih pashunasrijata | te nakshatra mupatishthanta | te samavanta
    evabhavann | te revati mprabhavann | tasma t | praiva bhavanti || salilam ntarakatvam | yo va iha
    yajate | amugm saloka nnakshate | tannakshatrana || devagriha vai nakshatrani | ya evam ve~da | grihyeva
    bhavati || yani va imani prithivyashcitrani | tani nakshatrani | tasma shcitre | navasyenna yajeta
    | yatha papahe kurute | tadrigeva tat || devanakshatrani va anyani || || yamanakshatranyanyani | krittikah
    prathamam | vishakhe uttamam | tani devanakshatrani | anuradhah prathamam | apabharani ruttamam |
    tani yamanakshatrani | yani devanakshatrani | tani dakshinena pariyanti | yani yamanakshatrani ||
    || tanyuttarena || anveshamarathsmeti | tadanuradhah | jyeshthamesha mavadhishmeti | tajjye shthaghni
    | mulameshamavrikshameti | ta hani | yannasahanta | tadashadhah | yadashlonat || || tacchrona | yadashrinot
    | tacchravishthah | yacchata mabhishajyann | tacchatabhishak | proshthapadeshudayacchanta | revatyamaravanta
    | ashvayujorayunjata | apabharanishva pavahann | tani va etani yamanakshatrani || yanyeva devanakshatrani
    | teshu kurvita yatkari syat | punyaha eva kurute || revatimupatishthanta dyamanakshatrani trini ca
    hah divasabhagarupah heyopadeyakala vibhagah devasya savituh pratah prasavah pranah | varunasya sayamasavo
    t | pracinagm sangavat | tato deva agnishtoma nnirmargah || mitrasya sangavah | tat ntejasvyahah |
    tasmattar hi pashavah samayanti || ya tpraticinagm sangavat || mmaddhyandinat | tato deva ukthya nnirmargah
    || brihaspate rmaddhyandinah | tat ntejasvyahah | tasmattar mmaddhyandinat | pracina maparahnat |
    tato deva nniramimata | tattadattavirya || bhagasyaparahnah | tat ntejasvyahah | tasmadaparahne kumaryo
    bhagamicchamana praticinamaparahnat | pracinagm sayat | tato deva atiratra nniramimata | tattadattavirya
    nnirmargah || varunasya sayam | tat ntejasvyahah | tasmattar || brahmano va ashtavigmsho nakshatranam
    | samanasyahnah panca punyani nakshatrani | catvaryashlilani | tani nava | yacca parastannakshatranam
    t | tanyekadasha | brahmano dvadashah | ya evam va~thsarenaivasya vrata mbhavati || samanasyahnah
    panca punyani nakshatrani | catvaryashlilani | tani nava | agneyi ratrih | aindramahah | tanyekadasha
    | adityo dvadashah | ya evam va~thsarenaivasya vrata nniramimata tattadattavirya bhavati samanasyahnah
    panca punyani nakshatranyashtau ca somasheshabhuta patrastutih brahmavadino vadanti | kati patrani
    yajnam va~hantiti | trayodasheti bruyat | sa yadbruyat | kastani niramimiteti | prajapatiriti bruyat
    | sa yadbruyat | kutastani niramimiteti | atmana iti | pranapanabhya shvantaryamau niramimita || ||
    vyanadupagmshu savanam | vaca ai ndravayavam | dakshakratubhya mmaitravarunam | shrotradashvinam |
    cakshusha | atmana agrayanam | ange m | ayusho dhruvam | pratishthaya ritupatre || yajnam rniramimita
    | sa nirmito naddhriyata samavliyata | sa eta pashyat | tanniravapat | tairvai sa yajnamapyavapat
    | yadapivapa bhavanti | yajnasya dhritya asam upagshvantaryamau niramimita caturmasyashesha vapanamantrah
    ritameva parameshthi | rita ncana | rite samudra ahitah | rite bhumiriyagg shrita | agnistigmena shocisha
    | shirastapasyahitam | vaishvanarasya tejasa | ritena sya nivartaye | satyena parivartaye || 'syanuvartaye
    | shivenasyopavartaye | shagmena ntacchakeyam | tena shakeya ntena raddhyasam || ya dgharmah paryavartayat
    | anta nprithivya divah | agnirishana ojasa | varuno dhitibhih saha || || indro marudbhi ssaha ||
    agnistigmena shocisha | shirastapasyahitam | vaishvanarasya tejasa | ritena sya nivartaye | satyena
    parivartaye | tapasa 'syanuvartaye | shivenasyopavartaye | shagmena ntacchakeyam | tena shakeya ntena
    raddhyasam || yo asyah prithivyastvaci | nivartayatyoshadhih | agnirishana ojasa | varuno dhitibhih
    saha | indro marudbhi ssaha || agnistigmena shocisha || shirastapasyahitam | vaishvanarasya tejasa
    | ritena sya nivartaye | satyena parivartaye | tapasa 'syanuvartaye | shivenasyopavartaye | shagmena
    ntacchakeyam | tena shakeya ntena raddhyasam || mudasrijat | parameshthi prajabhyah | tena bhyo maha
    avahat | amrita bhyah | prajamanu prajayase | tadu te martyamrita m | yena masa ardhamasah | ritavah
    parivathsarah | yena te te prajapate | ijanasya nyavartayann || || tenahamasya brahmana | nivartayami
    jivase || agnistigmena shocisha | shirastapasyahitam | vaishvanarasya tejasa | ritena sya nivartaye
    | satyena parivartaye | tapasa 'syanuvartaye | shivenasyopavartaye | shagmena syabhivartaye | tadrita
    ntacchakeyam | tena shakeya ntena raddhyasam || nupavartaye catvari ca caturmasyashesha vapanavidhih
    dyajne 'kurvata | tadasura akurvata | te mprishthebhyo napashyann | te keshanagre 'vapanta | atha
    shmashruni | athopapakshau | tataste va~panti | avameti || || atho paraiva bhavati | atha deva urdhva
    'pashyann | ta upapakshavagre 'vapanta | atha shmashruni | atha keshan | tataste lo~kamayann | yasyaivam
    va~panti | bhavatyatmana mapashyat | sa shmashrunyagre 'vapata | athopapakshau | atha keshan | tato
    vai sa prajayata prajaya pashubhih | yasyaivam va~panti | pra prajaya pashubhi rjayate || devasura
    ya~tta asann | te sam va~thsare vyayacchanta | ta rmasyairevabhi prayunjata || || vaishvadevena caturo
    maso 'vrinjatendrarajanah | tanchirshanni cavartayanta pari ca | varuna praghasai 'vrinjata varunarajanah
    | tanchirshanni cavartayanta pari ca | sakamedhaishcaturo maso 'vrinjata somarajanah | tanchira shanni
    cavartayanta pari ca | ya sam va~thsara upajiva ''si mavrinjata | tato deva abhavann | para ryajate
    | bhratrivyasyaiva maso vriktva | shirshanni ca vartayate pari ca | yaisha sam va~thsara upajiva |
    vrinkte ta mbhratrivyasya | kshudha 'sya bhratrivyah para bhavati || lohitayasena nivartayate | yadva
    imamagnir ritavagate nivartayati | etadevainagm rupa nkritva nivartayati | sa tata shshvo bhuyasi
    bhavantyeti || || prajayate | ya evam vi~dva~llohitayasena nivartayate | etadeva rupa nkritva nivartayate
    | sa tata bhavanneti | praiva jayate || trenya shalalya nivartayeta | trini trini vai devanamriddhani
    | trini chandagmsi | trini savanani | traya ime lokah || dvirya eshu lokeshu prati tishthati || yaccaturmasyaya
    tmano navadyet | devebhya avrishcyeta | catrishu catrishu maseshu nivartayeta | parokshameva ta vraskaya
    || devanam va~ esha anitah | yashcaturmasyayaji | ya evam vi~dvanni ca vartayate pari ca | devata
    evapyeti | nasya rudrah praja agnicayanashesha ishtakopadhanamantrah tatra santatyakhyeshtakamantrah
    ayushah pranagm santanu | pranadapanagm santanu | apana dvyanagm santanu | vyanaccakshu ssantanu |
    cakshusha shshrotragm santanu | shrotra ssantanu | manaso vacagm santanu | vaca atmanagm santanu |
    atmanah prithivigm santanu | prithivya antarikshagm santanu | antariksha ddivagm santanu |diva antarikshagm
    santanu dve ca agnicayanashesha tharvashiro mmantrah indro dadhico asthabhih | vritranya pratishkutah
    | jaghana nava tirnava || icchannashvasya yacchirah | parvateshvapa shritam | ta dvidaccharyanavati
    || atra ha goramanvata | nama tvashturapicya m | ittha candramaso grihe || indramidgathino brihat
    || || indramarkebhirarkinah | indram va~niranushata || indra iddharyo | sammishla avaco yuja | indro
    vajri hiranyayah || indro dirghaya cakshase | a suryagm rohaya ddivi | vi gobhiradrimairayat || indra
    vajeshu no ava | sahasra pradhaneshu ca || || ugra ugrabhirutibhih || tamindram va~jayamasi | mahe
    vritraya hantave | sa vrisha vrishabho bhuvat || indra ssadamane kritah | ojishtha ssa bale hitah
    | dyumni shloki sa saumyah || gira vajro na sambhritah | sabalo anapacyutah | vavakshu ya~tta asann
    | sa prajapatirindra mputramapa nyadhatta | nedenamasura baliyagm so 'hananniti | prahrado ha vai
    kayadhavah | virocanagg sva mputramapa nyadhatta | nedena ndeva ahananniti | te devah prajapati mupasametyocuh
    | narajakasya yuddhamasti | indramanvicchameti | tam ya~jnakratubhirnanvavindann | tamishtibhi cchann
    | tamishtibhi ranvavindann | tadishtina mishtitvam | eshtayo ha vai nama | ta ishtaya ityacakshate
    parokshena | parokshapriya iva hi devah || tasma etama nniravapann | tadapadrutyatanvata | tanpatni
    sam ya~janta upanayann || ntameva kritvodadravann || te prayaniyamabhi samarohann | tadapadrutyatanvata
    | tancham yva~nta upanayann | te tadatammeva kritvodadravann || ta atithyamabhi samarohann | tadapadrutyatanvata
    | tanida nta upanayann | te tadatammeva kritvodadravann | tasma deta etadanta ishtaya || evagm hi
    deva akurvata | iti deva akurvata | ityu vai manushyah kurvate || te deva ucuh | yadva idamuccai ryajnena
    carama | tanno 'nuvindanti | upagmshupasada carama | tatha no 'surah papma nanuvethsyantiti | ta upagmshupasada
    matanvata | tisra eva samidheniranucya || magharya | tisrah paraci hutva | sruvenopasada njuhavancakruh
    | ugram va~co apavadhig svaheti | ashanayapipase ha va ugram va~cah | enashca vairahatya va~cah |
    etagm ha vava taccaturdhavihita ndeva apajaghnire || tatho evaitadevam vi~dyajamanah | tisra eva samidheniranucya
    | sruvenaghara || tisrah paracirahutir hutva | sruvenopasada va~co apavadhig svaheti | ashanayapipase
    ha va ugram va~cah | enashca vairahatya va~cah | etameva taccaturdha 'bhiniyaivahah pashuma 'labhanta
    | ahna eva ta mmrityumapajaghnire | tenabhiniyeva ratreh pracarann | ratriya eva ta mmrityumapajaghnire
    || || tasmadabhiniyaivahah pashumalabheta | ahna eva ta mbhratrivyanapanudate | tenabhiniyeva ratreh
    pracaret | ratriya eva ta mbhratrivyanapanudate || sa esha upavasathiye 'han dvidevatyah pashuralabhyate
    | dvayam va~ asmin ~loke yajamanah | asthi ca magmsa nca | asthi caiva tena magmsa skurute || ta va
    etah panca devatah || pancapanci vai yajamanah | tvammagm sagg snavasthi majja | etameva tatpancadha
    vihitamatmanam nmuncati | bheshajatayai nirvarunatvaya || tagm saptabhi shchandobhih pratarahvayann
    | tasma thsapta caturuttarani chandagmsi prataranuvake smai gayata nara iti | tasma detaya bahishpavamana
    upasadyah || nucya sruvenagharamagharya mpapmanam mrityumapajaghnire deva yajamano deva deva yajamano
    yajamano 'labhanta pracara~llabheta pracaredalabhantalabheta mrityumapajaghnire bhratrivyan trivridadistomarupani
    somangani sa samudra uttaratah prajvala dbhumyantena | esha vava sa samudrah | yaccatvalah | esha
    u veva sa bhu ntripurusham | tasmat nkhananti || sa suvarnarajatabhya mparigrihita asit | tam ya~dasya
    addhyajanayann | tasmadadityah || ntrivrita ''dadata | ta ntrivrita ''harann | yavati trivrito matra
    mpancadashenabhi prastuvata | ta mpancadashenadadata | ta mpancadashenaharann | yavati pancadashasya
    matra || tagm saptadashenabhi prastuvata | tagm saptadashenadadata | tagm saptadashenaharann | yavati
    saptadashasya matra | tasya saptadashena hriyamanasya tejo haro 'patat | tamekavigm shenabhi prastuvata
    | tamekavigmshenadadata | tamekavigmshenaharann | yavatyekavigmshasya matra dyajamanamadadate | ta
    ntrivritaiva haranti | yavati trivrito matra | agnirvai trivrit | yavadva agnerdahato dhuma udetyanuvyeti
    | tavati trivrito matra ntat | matragm sayujyagm salokata ngamayanti || atha yatpancadashena stuvate
    mpancadashenaiva haranti | yavati pancadashasya matra | candrama vai pancadashah | esha hi pancadashyamapakshiyate
    ntat | matragm sayujyagm salokata ngamayanti | atha yathsaptadashena stuvate dyajamanamadadate | tagm
    saptadashenaiva haranti || || yavati saptadashasya matra | prajapatirvai saptadashah | prajapaterevaina
    ntat | matragm sayujyagm salokata ngamayanti | atha yadekavigmshena stuvate | ekavigmshenaiva ta madadate
    | tamekavigmshenaiva haranti | yavatyekavigmshasya matra | asau va aditya ekavigmshah | adityasyaivaina
    || matragm sayujyagm salokata ngamayanti || te kushyau | vyaghnann | te ahoratre abhavatam | ahareva
    suvarna 'bhavat | rajata ratrih | sa yadaditya udeti | etameva tathsuvarna nkushimanu sameti | atha
    yadastameti | etameva ta vi~shati || prahrado ha vai kayadhavah | virocanagg sva tyadityasyaivainanta
    d vishati catvari ca ntat | atha ye panca | kali ssah | tasmaccatushtomah | taccatushtomasya catushtomatvam
    || tadahuh | katamani tani jyotigmshi | ya etasya stoma iti | trivrit ssaptadasha ekavigmshah || ||
    etani vava tani jyotigmshi | ya etasya stomah 'bravit | saptadashena hriyamano vyaleshishi | bhishajyata
    meti | tamashvinau dhanabhi rabhishajyatam | pusha karambhena | bharati parivapena | mitravarunau
    payasyaya || tadahuh || ndhanah | pushnah karambhah | bharatyai parivapah | mitravarunayoh payasya
    'tha | kasmadeteshagm havishamindrameva yajantiti | eta hyena ndevata iti bruyat | etair 'shtakapalena
    pratassavane 'bhishajyann | rudra ekadashakapalena maddhyandine savane | vishve deva dvadashakapalena
    tritiyasavane || npratassavane kuryat | ekadashakapala nmaddhyandine savane | dvadashakapalag stritiya
    savane | viloma ta dyajnasya kriyeta | ekadashakapalaneva pratassavane kuryat | ekadashakapala nmaddhyandine
    savane | ekadashakapalag stritiya savane | yajnasya salomatvaya || tadahuh | ya mpratassavanam | rudrana
    mmaddhyandinagm savanam | vishvesha ntritiyasavanam | atha kasmadeteshagm havishamindrameva yajantiti
    | eta hyena ndevata iti bruyat | etair havirbhirabhishajyagg stasmaditi || saptachandamsi prapancyante
    'vapadadabibhayuh | tameteshu saptasu chandah svashrayann | yadashrayann | tacchrayantiyasya shrayantiyatvam
    | yadavarayann | ta dvaravantiyasya varavantiyatvam || tasyavaca evavapadadabibhayuh | tasma etani
    sapta caturuttarani chandagsyupadadhuh | teshamati trinyaricyanta | na trinyudabhavann || sprishat
    | dvabhyamakshara bhyam | ahoratrabhyameva || tadahuh | katama sa devakshara brihati | yasya tpratyatishthat
    | dvadasha paurnamasyah | dvadashashtakah | dvadashamavasyah | esha vava sa devakshara brihati ||
    tpratyatishthaditi || yani ca chandag syatyaricyanta | yani ca nodabhavann | tani nirvi ryani hinanyamanyanta
    | sa 'bravi dbrihati | mameva bhutva | mamupa sagg shrayateti | caturbhiraksharai nnodabhavat | caturbhiraksharaih
    matyaricyata | tasyametani catvaryakshara || te brihati eva bhutva | brihatimupa samashrayatam ||
    ashtabhi nnodabhavat | ashtabhiraksharai matyaricyata | tasyameta pacchidyadadhat | te brihati eva
    bhutva | brihatimupa samashrayatam | dvadashabhi nnodabhavat | dvadashabhi matyaricyata | tasyametani
    dvadashakshara || te brihati eva bhutva | brihatimupa samashrayatam || so prajapatih | chandagmsi
    ratho me bhavata | yushmabhi maddhvanamanu sancaraniti | tasya gayatri ca jagati ca pakshavabhavatam
    | ushnikca trishtupca prashtyau | anushtupca panktishca dhuryau | brihatyevoddhirabhavat | sa eta
    nchandorathamasthaya | etamaddhvanamanu samacarat | etagm ha vai chandorathamasthaya | etamaddhvanamanu
    sancarati | yenaisha eta thsomena yajate | ya ucainamevam vava sa devakshara briha r brahmavadinah
    ka stasyavaco dvadasha te brihati eva dvishashtih || harih om || || krishna yajurvediya taittiriya
    brahmane prathamashtake pancamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके पञ्चमः प्रपाठकः नक्षत्रेष्टिकाण्डम् ओ श्री
    गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं नक्षत्रेष्टकामन्त्राः विकृतिरूपचयनगताः अ॒ग्नेः कृत्ति॑काः । शु॒क्र
    त् ॥ प्र॒जाप॑ते रोहि॒णी । आपः॑ प॒रस्ता॒दोष॑धयो॒ ऽवस्ता त् ॥ सोम॑स्येन्व॒का वित॑तानि । प॒रस्ता॒द्वय॑न्तो॒
    ऽवस्ता त् ॥ रु॒द्रस्य॑ बा॒हू । मृ॒ग॒यवः॑ प॒रस्ता त् ॥ अदि॑त्यै॒ पुन॑र्वसू । वातः॑ प॒रस्ता॑दा॒र्द्र
    स्ति॒ष्यः॑ । जुह्व॑तः प॒रस्ता॒ माश्रे॒षाः । अ॒भ्या॒गच्छ॑न्तः प॒रस्ता॑दभ्या॒नृत्य॑न्तो॒ म्म॒घाः । रु॒दन्तः॑
