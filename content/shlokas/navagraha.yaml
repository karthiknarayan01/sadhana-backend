id: navagraha
category: sukta
name:
  english: navagraha
  devanagari: नवग्रह
content:
  english: duritakshayadvara shriparameshvara prityartham adityadi navagraha devata prasada siddhyartam
    adityadi navagraha namaskaran karishye|| || mantrani || om asatyena rajasa vartamano niveshayannamritam
    martyam ca | hiranyayena savita rathena''devo yati bhuvana vipashyan| agnim dutam vrinimahe hotaram
    vishvavedasam | asya yajnasya sukratum || yeshamishe pashupatih pashunam catushpadamuta ca dvipadam
    | nishkrito'yam yajniyam bhagametu rayasposha yajamanasya santu || om adhidevata pratyadhidevata sahitaya
    adityaya namah || 1|| om apyayasva sametu te vishvatassoma vrishniyam | bhava vajasya sangathe|| apsume
    somo abravidantarvishvani bheshaja | agninca vishvashambhuvamapashca vishvabheshajih | gauri mimaya
    salilani takshatyekapadi dvipadi sa catushpadi | ashtapadi navapadi babhuvushi sahasrakshara parame
    vyoman | om adhidevata pratyadhidevata sahitaya somaya namah || 2|| om agnirmurddha divah kakutpatih
    prithivya ayam | apa
  devanagari: दुरितक्षयद्वारा श्रीपरमेश्वर प्रीत्यर्थं आदित्यादि नवग्रह देवता प्रसाद सिद्ध्यर्तं आदित्यादि
    नवग्रह नमस्कारान् करिष्ये॥ ॥ मन्त्राणि ॥ ॐ आसत्येन रजसा वर्तमानो निवेशयन्नमृतं मर्त्यं च । हिरण्ययेन
    सविता रथेनाऽऽदेवो याति भुवना विपश्यन्। अग्निं दूतं वृणीमहे होतारं विश्ववेदसम् । अस्य यज्ञस्य सुक्रतुम्
    ॥ येषामीशे पशुपतिः पशूनां चतुष्पदामुत च द्विपदाम् । निष्क्रीतोऽयं यज्ञियं भागमेतु रायस्पोषा यजमानस्य
    सन्तु ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय आदित्याय नमः ॥ १॥ ॐ आप्यायस्व समेतु ते विश्वतस्सोम वृष्णियम्
    । भवा वाजस्य सङ्गथे॥ अप्सुमे सोमो अब्रवीदन्तर्विश्वानि भेषजा । अग्निञ्च विश्वशम्भुवमापश्च विश्वभेषजीः
    । गौरी मिमाय सलिलानि तक्षत्येकपदी द्विपदी सा चतुष्पदी । अष्टापदी नवपदी बभूवुषी सहस्राक्षरा परमे व्योमन्
    । ॐ अधिदेवता प्रत्यधिदेवता सहिताय सोमाय नमः ॥ २॥ ॐ अग्निर्मूर्द्धा दिवः ककुत्पतिः पृथिव्या अयम् ।
    अपा
