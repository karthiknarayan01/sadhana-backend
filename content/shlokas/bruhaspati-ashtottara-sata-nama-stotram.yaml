id: bruhaspati-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Bruhaspati Ashtottara Sata Nama Stotram
content:
  english: gururgunavaro gopta gocaro gopatipriyah | guni gunavatam shreshtho gurunam gururavyayah ||
    || jeta jayanto jayado jivo'nanto jayavahah | angiraso'dhvarasakto vivikto'dhvarakritparah || || vacaspatirvashi
    vashyo varishtho vagvicakshanah | cittashuddhikarah shriman caitrah citrashikhandijah || || brihadratho
    brihadbhanurbrihaspatirabhishtadah | suracaryah suraradhyah surakaryahitankarah || || girvanaposhako
    dhanyo gishpatirgirisho'naghah | dhivaro dhishano divyabhushano devapujitah || || dhanurdharo daityahanta
    dayasaro dayakarah | daridryanashako dhanyo dakshinayanasambhavah || || dhanurminadhipo devo dhanurbanadharo
    harih | angirasabjasanjatah angirasakulodbhavah || || sindhudeshadhipo dhiman svarnavarnashcaturbhujah
    | hemangado hemavapurhemabhushanabhushitah || || pushyanathah pushyaragamanimandalamanditah | kashapushpasamanabhah
    kalidoshanivarakah || || indradidevodevesho devatabhishtadayakah | asamanabalah sattvagunasampadvibhasurah
    || || bhusurabhishtado bhuriyashah punyavivardhanah | dharmarupo dhanadhyaksho dhanado dharmapalanah
    || || sarvavedarthatattvajnah sarvapadvinivarakah | sarvapapaprashamanah svamatanugatamarah || ||
    rigvedaparago riksharashimargapracarakah | sadanandah satyasandhah satyasankalpamanasah || || sarvagamajnah
    sarvajnah sarvavedantavidvarah | brahmaputro brahmanesho brahmavidyavisharadah || || samanadhikanirmuktah
    sarvalokavashamvadah | sasurasuragandharvavanditah satyabhashanah || || namah surendravandyaya devacaryaya
    te namah | namaste'nantasamarthya vedasiddhantaparagah || || sadananda namaste'stu namah pidaharaya
    ca | namo vacaspate tubhyam namaste pitavasase || || namo'dvitiyarupaya lambakurcaya te namah | namah
    prahrishtanetraya vipranam pataye namah || || namo bhargavashishyaya vipannahitakarine | namaste surasainyanam
    vipattitranahetave || || brihaspatih suracaryo dayavan shubhalakshanah | lokatrayaguruh shriman sarvagah
    sarvatovibhuh || || sarveshah sarvadatushtah sarvadah sarvapujitah | akrodhano munishreshtho nitikarta
    jagatpita || || vishvatma vishvakarta ca vishvayonirayonijah | bhurbhuvodhanadata ca bhartajivo mahabalah
    || || brihaspatih kashyapeyo dayavan shubhalakshanah | abhishtaphaladah shriman shubhagraha namo'stu
    te || || brihaspatih suracaryo devasurasupujitah | acaryodanavarishca suramantri purohitah || || kalajnah
    kalrigvetta cittagashca prajapatih | vishnuh krishnah sadasukshmah pratidevojjvalagrahah || || iti
    shri brihaspati ashtottarashatanama stotram |
  devanagari: गुरुर्गुणवरो गोप्ता गोचरो गोपतिप्रियः । गुणी गुणवतां श्रेष्ठो गुरूणां गुरुरव्ययः ॥ ॥ जेता
    जयन्तो जयदो जीवोऽनन्तो जयावहः । आङ्गीरसोऽध्वरासक्तो विविक्तोऽध्वरकृत्परः ॥ ॥ वाचस्पतिर्वशी वश्यो वरिष्ठो
    वाग्विचक्षणः । चित्तशुद्धिकरः श्रीमान् चैत्रः चित्रशिखण्डिजः ॥ ॥ बृहद्रथो बृहद्भानुर्बृहस्पतिरभीष्टदः
    । सुराचार्यः सुराराध्यः सुरकार्यहितङ्करः ॥ ॥ गीर्वाणपोषको धन्यो गीष्पतिर्गिरिशोऽनघः । धीवरो धिषणो
    दिव्यभूषणो देवपूजितः ॥ ॥ धनुर्धरो दैत्यहन्ता दयासारो दयाकरः । दारिद्र्यनाशको धन्यो दक्षिणायनसम्भवः
    ॥ ॥ धनुर्मीनाधिपो देवो धनुर्बाणधरो हरिः । आङ्गीरसाब्जसञ्जातः आङ्गीरसकुलोद्भवः ॥ ॥ सिन्धुदेशाधिपो धीमान्
    स्वर्णवर्णश्चतुर्भुजः । हेमाङ्गदो हेमवपुर्हेमभूषणभूषितः ॥ ॥ पुष्यनाथः पुष्यरागमणिमण्डलमण्डितः । काशपुष्पसमानाभः
    कलिदोषनिवारकः ॥ ॥ इन्द्रादिदेवोदेवेशो देवताभीष्टदायकः । असमानबलः सत्त्वगुणसम्पद्विभासुरः ॥ ॥ भूसुराभीष्टदो
    भूरियशः पुण्यविवर्धनः । धर्मरूपो धनाध्यक्षो धनदो धर्मपालनः ॥ ॥ सर्ववेदार्थतत्त्वज्ञः सर्वापद्विनिवारकः
    । सर्वपापप्रशमनः स्वमतानुगतामरः ॥ ॥ ऋग्वेदपारगो ऋक्षराशिमार्गप्रचारकः । सदानन्दः सत्यसन्धः सत्यसङ्कल्पमानसः
    ॥ ॥ सर्वागमज्ञः सर्वज्ञः सर्ववेदान्तविद्वरः । ब्रह्मपुत्रो ब्राह्मणेशो ब्रह्मविद्याविशारदः ॥ ॥ समानाधिकनिर्मुक्तः
    सर्वलोकवशंवदः । ससुरासुरगन्धर्ववन्दितः सत्यभाषणः ॥ ॥ नमः सुरेन्द्रवन्द्याय देवाचार्याय ते नमः । नमस्तेऽनन्तसामर्थ्य
    वेदसिद्धान्तपारगः ॥ ॥ सदानन्द नमस्तेऽस्तु नमः पीडाहराय च । नमो वाचस्पते तुभ्यं नमस्ते पीतवाससे ॥ ॥
    नमोऽद्वितीयरूपाय लम्बकूर्चाय ते नमः । नमः प्रहृष्टनेत्राय विप्राणां पतये नमः ॥ ॥ नमो भार्गवशिष्याय
    विपन्नहितकारिणे । नमस्ते सुरसैन्यानां विपत्तित्राणहेतवे ॥ ॥ बृहस्पतिः सुराचार्यो दयावान् शुभलक्षणः
    । लोकत्रयगुरुः श्रीमान् सर्वगः सर्वतोविभुः ॥ ॥ सर्वेशः सर्वदातुष्टः सर्वदः सर्वपूजितः । अक्रोधनो मुनिश्रेष्ठो
    नीतिकर्ता जगत्पिता ॥ ॥ विश्वात्मा विश्वकर्ता च विश्वयोनिरयोनिजः । भूर्भुवोधनदाता च भर्ताजीवो महाबलः
    ॥ ॥ बृहस्पतिः काश्यपेयो दयावान् शुभलक्षणः । अभीष्टफलदः श्रीमान् शुभग्रह नमोऽस्तु ते ॥ ॥ बृहस्पतिः
    सुराचार्यो देवासुरसुपूजितः । आचार्योदानवारिश्च सुरमन्त्री पुरोहितः ॥ ॥ कालज्ञः कालृग्वेत्ता चित्तगश्च
    प्रजापतिः । विष्णुः कृष्णः सदासूक्ष्मः प्रतिदेवोज्ज्वलग्रहः ॥ ॥ इति श्री बृहस्पति अष्टोत्तरशतनाम स्तोत्रम्
    ।
