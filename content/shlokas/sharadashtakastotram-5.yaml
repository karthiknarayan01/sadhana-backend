id: sharadashtakastotram-5
category: stotram
name:
  english: sharadashtakastotram 5
  devanagari: शारदाष्टकस्तोत्रम् ५
content:
  english: sandharinim kanakapustakadharinim ca | ratnaih shubhaih suruciram kritahastapadmam shrisharadam
    bhagavatim satatam namami || 4|| pujya sadaiva janani parivandaniya devya gana manasi samparimodaniyah
    | jivarthinah phalabhrito gunavarnana ca shrisharadam bhagavatim satatam namami || 5|| natva bhajejjagati
    yo jananim prasiddham kuryatsada bhagavati kilapancasaukhyam | saundaryarupagunavittasubhogabhajam
    shri sharadam bhagavatim satatam namami || 6|| pujopaharavalibhih paripujaniya devya ganadikamanojnasuvaktrapadmah
    | yaih pujita bhagavati kila jadyahantri shrisharadam bhagavatim satatam namami || 7|| yasyah prasadamavagamya
    sukhapradaya
  devanagari: सन्धारिणीं कनकपुस्तकधारिणीं च । रत्नैः शुभैः सुरुचिरां कृतहस्तपद्मां श्रीशारदां भगवतीं सततं
    नमामि ॥ ४॥ पूज्या सदैव जननी परिवन्दनीया देव्या गणा मनसि सम्परिमोदनीयाः । जीवार्थिनः फलभृतो गुणवर्णना
    च श्रीशारदां भगवतीं सततं नमामि ॥ ५॥ नत्वा भजेज्जगति यो जननीं प्रसिद्धां कुर्यात्सदा भगवती किलपञ्चसौख्यम्
    । सौन्दर्यरूपगुणवित्तसुभोगभाजं श्री शारदां भगवतीं सततं नमामि ॥ ६॥ पूजोपहारवलिभिः परिपूजनीया देव्या
    गणादिकमनोज्ञसुवक्त्रपद्माः । यैः पूजिता भगवती किल जाड्यहन्त्री श्रीशारदां भगवतीं सततं नमामि ॥ ७॥ यस्याः
    प्रसादमवगम्य सुखप्रदाया
meaning: {}
