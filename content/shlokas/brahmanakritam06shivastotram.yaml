id: brahmanakritam06shivastotram
category: stotram
name:
  english: brahmanakritam06shivastotram
  devanagari: ब्रह्मणाकृतं०६शिवस्तोत्रम्
content:
  english: brahmana kritam 6 shivastotram brahmovaca | sammantrya devairarsuraishca sarvairyada''hritam
    sammathitum samudram | yatkalakutam samabhunmahesha tattvam vina ko grasitum samarthah || 4|| pushpapraharena
    jagattrayam yah svadhinamapadiyitum samarthah | maro hare'pyanyasuradivandyo vitayamano vilayam prayatah
    || 5|| vimathya varishamanangashatro yaduttamam tattu divaukasebhyah | dattva visham samharannilakantha
    ko va dhartum tvamrite vai samarthah || 6|| tatashca tushto bhagavanadikarta trilocanah || 7|| iti
    brahmapurane dvadashadhikashatatamadhyayantargatam brahmana kritam shivastotram samaptam | brahmapurana
    | adhyaya 112
  devanagari: ब्रह्मणा कृतं ६ शिवस्तोत्रम् ब्रह्मोवाच । सम्मन्त्र्य देवैरर्सुरैश्च सर्वैर्यदाऽऽहृतं सम्मथितुं
    समुद्रम् । यत्कालकूटं समभून्महेश तत्त्वां विना को ग्रसितुं समर्थः ॥ ४॥ पुष्पप्रहारेण जगत्त्रयं यः
    स्वाधीनमापादियितुं समर्थः । मारो हरेऽप्यन्यसुरादिवन्द्यो वितायमानो विलयं प्रयातः ॥ ५॥ विमथ्य वारीशमनङ्गशत्रो
    यदुत्तमं तत्तु दिवौकसेभ्यः । दत्त्वा विषं संहरन्नीलकण्ठ को वा धर्तुं त्वामृते वै समर्थः ॥ ६॥ ततश्च
    तुष्टो भगवानादिकर्ता त्रिलोचनः ॥ ७॥ इति ब्रह्मपुराणे द्वादशाधिकशततमाध्यायान्तर्गतं ब्रह्मणा कृतं शिवस्तोत्रं
    समप्तम् । ब्रह्मपुराण । अध्याय ११२
