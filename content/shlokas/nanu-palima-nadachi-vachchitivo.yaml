id: nanu-palima-nadachi-vachchitivo
category: stotram
name:
  english: Nanu Palima Nadachi Vachchitivo
content:
  english: adi pallavi nanu palimpa nadaci vaccitivo na prana natha anupallavi vanaja nayana momunu jucuta
    jivanamani nènaruna manasu marmamu tèlisi caranam surapati nila mani nibha tanuvuto uramuna mutyapu
    sarula cayamuto karamuna shara kodanda kantito dharani tanayato tyagarajarcita
  devanagari: आदि पल्लवि ननु पालिम्प नडचि वच्चितिवो ना प्राण नाथ अनुपल्लवि वनज नयन मोमुनु जूचुट जीवनमनि
    नॆनरुन मनसु मर्ममु तॆलिसि चरणम् सुरपति नील मणि निभ तनुवुतो उरमुन मुत्यपु सरुल चयमुतो करमुन शर कोदण्ड
    कान्तितो धरणि तनयतो त्यागराजार्चित
meaning: {}
