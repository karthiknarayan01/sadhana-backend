    hrim shrim sada pancadashatmaikya svarupayai namonamah om aim hrim shrim vajramanikya kataka kiritayai
    namonamah om aim hrim shrim kasturi tilakollasita nitalayai namonamah om aim hrim shrim bhasmarekhankita
    lasanmastakayai namonamah om aim hrim shrim vikacambhoruhadala locanayai namonamah om aim hrim shrim
    sharaccampeya pushpabha nasikayai namonamah om aim hrim shrim lasatkancana tatanka yugalayai namonamah
    om aim hrim shrim manidarpana sankasha kapolayai namonamah om aim hrim shrim tambulapuritasmera vadanayai
    namonamah om aim hrim shrim supakvadadimibija vadanayai namonamah om aim hrim shrim kambupuga samacchaya
    kandharayai namonamah om aim hrim shrim sthulamuktaphalodara suharayai namonamah om aim hrim shrim
    girishabaddamangalya mangalayai namonamah om aim hrim shrim padmapashankusha lasatkarabjayai namonamah
    om aim hrim shrim padmakairava mandara sumalinyai namonamah om aim hrim shrim suvarna kumbhayugmabha
    sukucayai namonamah om aim hrim shrim ramaniyacaturbahu samyuktayai namonamah om aim hrim shrim kanakangada
    keyura bhushitayai namonamah om aim hrim shrim brihatsauvarna saundarya vasanayai namonamah om aim
    hrim shrim brihannitamba vilasajjaghanayai namonamah om aim hrim shrim saubhagyajata shringara madhyamayai
    namonamah om aim hrim shrim divyabhushana sandoha ranjitayai namonamah om aim hrim shrim parijata
    gunadhikya padabjayai namonamah om aim hrim shrim supadmaraga sankasha caranayai namonamah om aim
    hrim shrim kamakoti mahapadma pithasthayai namonamah om aim hrim shrim shrikanthanetra kumuda candrikayai
    namonamah om aim hrim shrim sacamara ramavani vijitayai namonamah om aim hrim shrim bhakta rakshana
    dakshinya katakshayai namonamah om aim hrim shrim bhuteshalinganodbhuta pulakangyai namonamah om aim
    hrim shrim ananga janakapanga vikshanayai namonamah om aim hrim shrim brahmopendra shiroratna ranjitayai
    namonamah om aim hrim shrim shacimukhyamaravadhu sevitayai namonamah om aim hrim shrim lilakalpita
    brahmandamandalayai namonamah om aim hrim shrim amritadi mahashakti samvritayai namonamah om aim hrim
    shrim ekatapatra samrajyadayikayai namonamah om aim hrim shrim sanakadi samaradhya padukayai namonamah
    om aim hrim shrim devarshibhih stuyamana vaibhavayai namonamah om aim hrim shrim kalashodbhava durvasa
    pujitayai namonamah om aim hrim shrim mattebhavaktra shadvaktra vatsalayai namonamah om aim hrim shrim
    cakraraja mahayantra madhyavartyai namonamah om aim hrim shrim cidagnikundasambhuta sudehayai namonamah
    om aim hrim shrim shashankakhandasamyukta makutayai namonamah om aim hrim shrim mattahamsavadhu mandagamanayai
    namonamah om aim hrim shrim vandaru janasandoha vanditayai namonamah om aim hrim shrim antarmukha
    janananda phaladayai namonamah om aim hrim shrim pativratanganabhishta phaladayai namonamah om aim
    hrim shrim avyajakarunapurapuritayai namonamah om aim hrim shrim nitanta saccidananda samyuktayai
    namonamah om aim hrim shrim sahasrasurya samyukta prakashayai namonamah om aim hrim shrim ratnacintamani
    grihamadhyasthayai namonamah om aim hrim shrim hanivriddhi gunadhikya rahitayai namonamah om aim hrim
    shrim mahapadmatavimadhya nivasayai namonamah om aim hrim shrim jagrat svapna sushuptinam sakshibhutyai
    namonamah om aim hrim shrim mahapapaughapapanam vinashinyai namonamah om aim hrim shrim dushtabhiti
    mahabhiti bhanjanayai namonamah om aim hrim shrim samasta devadanuja prerakayai namonamah om aim hrim
    shrim samasta hridayambhoja nilayayai namonamah om aim hrim shrim anahata mahapadma mandirayai namonamah
    om aim hrim shrim sahasrara sarojata vasitayai namonamah om aim hrim shrim punaravrittirahita purasthayai
    namonamah om aim hrim shrim vani gayatri savitri sannutayai namonamah om aim hrim shrim ramabhumisutaradhya
    padabjayai namonamah om aim hrim shrim lopamudrarcita shrimaccaranayai namonamah om aim hrim shrim
    sahasrarati saundarya sharirayai namonamah om aim hrim shrim bhavanamatra santushta hridayayai namonamah
    om aim hrim shrim satyasampurna vijnana siddhidayai namonamah om aim hrim shrim shrilocana kritollasa
    phaladayai namonamah om aim hrim shrim shrisudhabdhi manidvipa madhyagayai namonamah om aim hrim shrim
    dakshadhvara vinirbheda sadhanayai namonamah om aim hrim shrim shrinatha sodaribhuta shobhitayai namonamah
    om aim hrim shrim candrashekhara bhaktarti bhanjanayai namonamah om aim hrim shrim sarvopadhi vinirmukta
    caitanyayai namonamah om aim hrim shrim namaparayanabhishta phaladayai namonamah om aim hrim shrim
    srishti sthiti tirodhana sankalpayai namonamah om aim hrim shrim shrishodashakshari mantra madhyagayai
    namonamah om aim hrim shrim anadyanta svayambhuta divyamurtyai namonamah om aim hrim shrim bhaktahamsa
    parimukhya viyogayai namonamah om aim hrim shrim matri mandala samyukta lalitayai namonamah om aim
    hrim shrim bhandadaitya mahasattva nashanayai namonamah om aim hrim shrim krurabhanda shirashcheda
    nipunayai namonamah om aim hrim shrim dhatryacyuta suradhisha sukhadayai namonamah om aim hrim shrim
    candamunda nishumbhadi khandanayai namonamah om aim hrim shrim raktaksha raktajihvadi shikshanayai
    namonamah om aim hrim shrim mahishasuradorvirya nigrahayai namonamah om aim hrim shrim abhrakesha
    mahotsaha karanayai namonamah om aim hrim shrim maheshayukta natana tatparayai namonamah om aim hrim
    shrim nijabhartri mukhambhoja cintanayai namonamah om aim hrim shrim vrishabhadhvaja vijnana bhavanayai
    namonamah om aim hrim shrim janmamrityu jararoga bhanjanayai namonamah om aim hrim shrim videha mukta
    vijnana siddhidayai namonamah om aim hrim shrim kamakrodhadi shadvarga nashanayai namonamah om aim
    hrim shrim rajarajarcita padasarojayai namonamah om aim hrim shrim sarvavedanta samsidda sutattvayai
    namonamah om aim hrim shrim shrivirabhakta vijnana nidhanayai namonamah om aim hrim shrim ashesha
    dushtadanuja sudanayai namonamah om aim hrim shrim sakshacchridakshinamurti manojnayai namonamah om
    aim hrim shrim hayamedhagra sampujya mahimayai namonamah om aim hrim shrim dakshaprajapatisuta veshadhyayai
    namonamah om aim hrim shrim sumabanekshu kodanda manditayai namonamah om aim hrim shrim nityayauvana
    mangalya mangalayai namonamah om aim hrim shrim mahadeva samayukta sharirayai namonamah om aim hrim
    shrim mahadeva ratotsuka mahadevyai namonamah iti shri lalitashtottara shatanamavali sampurnam
  devanagari: ध्यानश्लोकः सिन्धूरारुणविग्रहां त्रिनयनां माणिक्यमौलिस्फुर त्तारानायकशेखरां स्मितमुखी मापीनवक्षोरुहाम्
    । पाणिभ्यामलिपूर्णरत्नचषकं रक्तोत्पलं बिभ्रतीं सौम्यां रत्नघटस्थरक्तचरणां ध्यायेत्परामम्बिकाम् ॥ ॐ
    ऐं ह्रीं श्रीं रजताचल शृङ्गाग्र मध्यस्थायै नमोनमः ॐ ऐं ह्रीं श्रीं हिमाचल महावंश पावनायै नमोनमः ॐ
    ऐं ह्रीं श्रीं शङ्करार्धाङ्ग सौन्दर्य शरीरायै नमोनमः ॐ ऐं ह्रीं श्रीं लसन्मरकत स्वच्छविग्रहायै नमोनमः
    ॐ ऐं ह्रीं श्रीं महातिशय सौन्दर्य लावण्यायै नमोनमः ॐ ऐं ह्रीं श्रीं शशाङ्कशेखर प्राणवल्लभायै नमोनमः
    ॐ ऐं ह्रीं श्रीं सदा पञ्चदशात्मैक्य स्वरूपायै नमोनमः ॐ ऐं ह्रीं श्रीं वज्रमाणिक्य कटक किरीटायै नमोनमः
    ॐ ऐं ह्रीं श्रीं कस्तूरी तिलकोल्लासित निटलायै नमोनमः ॐ ऐं ह्रीं श्रीं भस्मरेखाङ्कित लसन्मस्तकायै नमोनमः
    ॐ ऐं ह्रीं श्रीं विकचाम्भोरुहदल लोचनायै नमोनमः ॐ ऐं ह्रीं श्रीं शरच्चाम्पेय पुष्पाभ नासिकायै नमोनमः
    ॐ ऐं ह्रीं श्रीं लसत्काञ्चन ताटङ्क युगलायै नमोनमः ॐ ऐं ह्रीं श्रीं मणिदर्पण सङ्काश कपोलायै नमोनमः
    ॐ ऐं ह्रीं श्रीं ताम्बूलपूरितस्मेर वदनायै नमोनमः ॐ ऐं ह्रीं श्रीं सुपक्वदाडिमीबीज वदनायै नमोनमः ॐ
    ऐं ह्रीं श्रीं कम्बुपूग समच्छाय कन्धरायै नमोनमः ॐ ऐं ह्रीं श्रीं स्थूलमुक्ताफलोदार सुहारायै नमोनमः
    ॐ ऐं ह्रीं श्रीं गिरीशबद्दमाङ्गल्य मङ्गलायै नमोनमः ॐ ऐं ह्रीं श्रीं पद्मपाशाङ्कुश लसत्कराब्जायै नमोनमः
    ॐ ऐं ह्रीं श्रीं पद्मकैरव मन्दार सुमालिन्यै नमोनमः ॐ ऐं ह्रीं श्रीं सुवर्ण कुम्भयुग्माभ सुकुचायै नमोनमः
    ॐ ऐं ह्रीं श्रीं रमणीयचतुर्बाहु संयुक्तायै नमोनमः ॐ ऐं ह्रीं श्रीं कनकाङ्गद केयूर भूषितायै नमोनमः
    ॐ ऐं ह्रीं श्रीं बृहत्सौवर्ण सौन्दर्य वसनायै नमोनमः ॐ ऐं ह्रीं श्रीं बृहन्नितम्ब विलसज्जघनायै नमोनमः
    ॐ ऐं ह्रीं श्रीं सौभाग्यजात शृङ्गार मध्यमायै नमोनमः ॐ ऐं ह्रीं श्रीं दिव्यभूषण सन्दोह रञ्जितायै नमोनमः
    ॐ ऐं ह्रीं श्रीं पारिजात गुणाधिक्य पदाब्जायै नमोनमः ॐ ऐं ह्रीं श्रीं सुपद्मराग सङ्काश चरणायै नमोनमः
    ॐ ऐं ह्रीं श्रीं कामकोटि महापद्म पीठस्थायै नमोनमः ॐ ऐं ह्रीं श्रीं श्रीकण्ठनेत्र कुमुद चन्द्रिकायै
    नमोनमः ॐ ऐं ह्रीं श्रीं सचामर रमावाणी वीजितायै नमोनमः ॐ ऐं ह्रीं श्रीं भक्त रक्षण दाक्षिण्य कटाक्षायै
    नमोनमः ॐ ऐं ह्रीं श्रीं भूतेशालिङ्गनोद्भूत पुलकाङ्ग्यै नमोनमः ॐ ऐं ह्रीं श्रीं अनङ्ग जनकापाङ्ग वीक्षणायै
    नमोनमः ॐ ऐं ह्रीं श्रीं ब्रह्मोपेन्द्र शिरोरत्न रञ्जितायै नमोनमः ॐ ऐं ह्रीं श्रीं शचीमुख्यामरवधू सेवितायै
    नमोनमः ॐ ऐं ह्रीं श्रीं लीलाकल्पित ब्रह्माण्डमण्डलायै नमोनमः ॐ ऐं ह्रीं श्रीं अमृतादि महाशक्ति संवृतायै
    नमोनमः ॐ ऐं ह्रीं श्रीं एकातपत्र साम्राज्यदायिकायै नमोनमः ॐ ऐं ह्रीं श्रीं सनकादि समाराध्य पादुकायै
    नमोनमः ॐ ऐं ह्रीं श्रीं देवर्षिभिः स्तूयमान वैभवायै नमोनमः ॐ ऐं ह्रीं श्रीं कलशोद्भव दुर्वास पूजितायै
    नमोनमः ॐ ऐं ह्रीं श्रीं मत्तेभवक्त्र षड्वक्त्र वत्सलायै नमोनमः ॐ ऐं ह्रीं श्रीं चक्रराज महायन्त्र
    मध्यवर्त्यै नमोनमः ॐ ऐं ह्रीं श्रीं चिदग्निकुण्डसम्भूत सुदेहायै नमोनमः ॐ ऐं ह्रीं श्रीं शशाङ्कखण्डसंयुक्त
    मकुटायै नमोनमः ॐ ऐं ह्रीं श्रीं मत्तहंसवधू मन्दगमनायै नमोनमः ॐ ऐं ह्रीं श्रीं वन्दारु जनसन्दोह वन्दितायै
    नमोनमः ॐ ऐं ह्रीं श्रीं अन्तर्मुख जनानन्द फलदायै नमोनमः ॐ ऐं ह्रीं श्रीं पतिव्रताङ्गनाभीष्ट फलदायै
    नमोनमः ॐ ऐं ह्रीं श्रीं अव्याजकरुणापूरपूरितायै नमोनमः ॐ ऐं ह्रीं श्रीं नितान्त सच्चिदानन्द संयुक्तायै
    नमोनमः ॐ ऐं ह्रीं श्रीं सहस्रसूर्य संयुक्त प्रकाशायै नमोनमः ॐ ऐं ह्रीं श्रीं रत्नचिन्तामणि गृहमध्यस्थायै
    नमोनमः ॐ ऐं ह्रीं श्रीं हानिवृद्धि गुणाधिक्य रहितायै नमोनमः ॐ ऐं ह्रीं श्रीं महापद्माटवीमध्य निवासायै
    नमोनमः ॐ ऐं ह्रीं श्रीं जाग्रत् स्वप्न सुषुप्तीनां साक्षिभूत्यै नमोनमः ॐ ऐं ह्रीं श्रीं महापापौघपापानां
    विनाशिन्यै नमोनमः ॐ ऐं ह्रीं श्रीं दुष्टभीति महाभीति भञ्जनायै नमोनमः ॐ ऐं ह्रीं श्रीं समस्त देवदनुज
    प्रेरकायै नमोनमः ॐ ऐं ह्रीं श्रीं समस्त हृदयाम्भोज निलयायै नमोनमः ॐ ऐं ह्रीं श्रीं अनाहत महापद्म मन्दिरायै
    नमोनमः ॐ ऐं ह्रीं श्रीं सहस्रार सरोजात वासितायै नमोनमः ॐ ऐं ह्रीं श्रीं पुनरावृत्तिरहित पुरस्थायै
    नमोनमः ॐ ऐं ह्रीं श्रीं वाणी गायत्री सावित्री सन्नुतायै नमोनमः ॐ ऐं ह्रीं श्रीं रमाभूमिसुताराध्य पदाब्जायै
    नमोनमः ॐ ऐं ह्रीं श्रीं लोपामुद्रार्चित श्रीमच्चरणायै नमोनमः ॐ ऐं ह्रीं श्रीं सहस्ररति सौन्दर्य शरीरायै
    नमोनमः ॐ ऐं ह्रीं श्रीं भावनामात्र सन्तुष्ट हृदयायै नमोनमः ॐ ऐं ह्रीं श्रीं सत्यसम्पूर्ण विज्ञान सिद्धिदायै
    नमोनमः ॐ ऐं ह्रीं श्रीं श्रीलोचन कृतोल्लास फलदायै नमोनमः ॐ ऐं ह्रीं श्रीं श्रीसुधाब्धि मणिद्वीप मध्यगायै
    नमोनमः ॐ ऐं ह्रीं श्रीं दक्षाध्वर विनिर्भेद साधनायै नमोनमः ॐ ऐं ह्रीं श्रीं श्रीनाथ सोदरीभूत शोभितायै
    नमोनमः ॐ ऐं ह्रीं श्रीं चन्द्रशेखर भक्तार्ति भञ्जनायै नमोनमः ॐ ऐं ह्रीं श्रीं सर्वोपाधि विनिर्मुक्त
    चैतन्यायै नमोनमः ॐ ऐं ह्रीं श्रीं नामपारायणाभीष्ट फलदायै नमोनमः ॐ ऐं ह्रीं श्रीं सृष्टि स्थिति तिरोधान
    सङ्कल्पायै नमोनमः ॐ ऐं ह्रीं श्रीं श्रीषोडशाक्षरी मन्त्र मध्यगायै नमोनमः ॐ ऐं ह्रीं श्रीं अनाद्यन्त
    स्वयम्भूत दिव्यमूर्त्यै नमोनमः ॐ ऐं ह्रीं श्रीं भक्तहंस परीमुख्य वियोगायै नमोनमः ॐ ऐं ह्रीं श्रीं
    मातृ मण्डल संयुक्त ललितायै नमोनमः ॐ ऐं ह्रीं श्रीं भण्डदैत्य महासत्त्व नाशनायै नमोनमः ॐ ऐं ह्रीं श्रीं
    क्रूरभण्ड शिरश्छेद निपुणायै नमोनमः ॐ ऐं ह्रीं श्रीं धात्र्यच्युत सुराधीश सुखदायै नमोनमः ॐ ऐं ह्रीं
    श्रीं चण्डमुण्ड निशुम्भादि खण्डनायै नमोनमः ॐ ऐं ह्रीं श्रीं रक्ताक्ष रक्तजिह्वादि शिक्षणायै नमोनमः
    ॐ ऐं ह्रीं श्रीं महिषासुरदोर्वीर्य निग्रहायै नमोनमः ॐ ऐं ह्रीं श्रीं अभ्रकेश महोत्साह कारणायै नमोनमः
    ॐ ऐं ह्रीं श्रीं महेशयुक्त नटन तत्परायै नमोनमः ॐ ऐं ह्रीं श्रीं निजभर्तृ मुखाम्भोज चिन्तनायै नमोनमः
    ॐ ऐं ह्रीं श्रीं वृषभध्वज विज्ञान भावनायै नमोनमः ॐ ऐं ह्रीं श्रीं जन्ममृत्यु जरारोग भञ्जनायै नमोनमः
    ॐ ऐं ह्रीं श्रीं विदेह मुक्त विज्ञान सिद्धिदायै नमोनमः ॐ ऐं ह्रीं श्रीं कामक्रोधादि षड्वर्ग नाशनायै
    नमोनमः ॐ ऐं ह्रीं श्रीं राजराजार्चित पदसरोजायै नमोनमः ॐ ऐं ह्रीं श्रीं सर्ववेदान्त संसिद्द सुतत्त्वायै
    नमोनमः ॐ ऐं ह्रीं श्रीं श्रीवीरभक्त विज्ञान निधानायै नमोनमः ॐ ऐं ह्रीं श्रीं अशेष दुष्टदनुज सूदनायै
    नमोनमः ॐ ऐं ह्रीं श्रीं साक्षाच्छ्रीदक्षिणामूर्ति मनोज्ञायै नमोनमः ॐ ऐं ह्रीं श्रीं हयमेधाग्र सम्पूज्य
    महिमायै नमोनमः ॐ ऐं ह्रीं श्रीं दक्षप्रजापतिसुत वेषाढ्यायै नमोनमः ॐ ऐं ह्रीं श्रीं सुमबाणेक्षु कोदण्ड
    मण्डितायै नमोनमः ॐ ऐं ह्रीं श्रीं नित्ययौवन माङ्गल्य मङ्गलायै नमोनमः ॐ ऐं ह्रीं श्रीं महादेव समायुक्त
    शरीरायै नमोनमः ॐ ऐं ह्रीं श्रीं महादेव रतोत्सुक महादेव्यै नमोनमः इति श्री ललिताष्टोत्तर शतनामावलि
    सम्पूर्णं
