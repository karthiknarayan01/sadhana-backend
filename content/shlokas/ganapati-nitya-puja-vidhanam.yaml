id: ganapati-nitya-puja-vidhanam
category: stotram
name:
  english: Ganapati Nitya Puja Vidhanam
content:
  english: ganapati pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri gurubhyo
    namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham
    sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam
    candrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala
    mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam
    namah | umamaheshvarabhyam namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam
    namah | shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om
    keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah
    | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya
    namah | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah
    | om pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah |
    om narasimhaya namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah
    | om shrikrishnaya namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam
    dehi putramshca sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam
    karishyami tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu
    bhutapishacah ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta
    ye bhuta bhumisamsthitah | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo
    jyoti raso mbrahma bhurbhuvassuvarom || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara
    prityartham asmakam sahakutumbasya kshema pujam karishye || tadanga kalasharadhanam karishye || kalasharadhanam
    kalashe gandha pushpakshatairabhyarcya | kalashe udakam purayitva | kalashasyopari hastam nidhaya
    | kalashasya mukhe vishnuh kanthe rudrah samashritah | mule tvasya sthito brahma madhye matriganah
    smritah || kukshau tu sagarah sarve saptadvipa vasundhara | rigvedo'tha yajurvedo samavedo hyatharvanah
    || angaishca sahitah sarve kalashambu samashritah || gange ca yamune caiva godavari sarasvati | narmade
    sindhu kaveri jale'smin sannidhim kuru || kaveri tungabhadra ca krishnaveni ca gautami | bhagirathiti
    vikhyatah pancagangah prakirtitah || ayantu devapujartham mama duritakshayakarakah | kalashodakena
    puja dravyani samprokshya atmanam ca samprokshya || shankhapuja shankham candrarka daivatam madhye
    varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim || trailokye yani tirthani vasudevasya
    ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet || om shankhaya namah | om dhavalaya
    namah | om pancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe akshatan samarpayami ||
    ghantanadah agamartham tu devanam gamanartham tu rakshasam | ghantaravam karomyadau devatahvana lanchanam
    || om ghantadevatabhyo namah | sakalopacara pujarthe akshatan samarpayami || shri mahaganapati puja
    o ntva ganapatigm havamahe kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida
    sadanam || sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca vikato vighnarajo ganadhipah
    || dhumaketurganadhyakshah phalacandro gajananah | vakratundah shurpakarno herambah skandapurvajah
    || om shrimahaganapataye namah | dhyayami | avahayami | asanam samarpayami | padyam samarpayami |
    arghyam samarpayami | acamaniyam samarpayami | snanam samarpayami | vastram samarpayami | yajnopavitam
    samarpayami | gandham samarpayami | pushpani samarpayami | dhupamaghrapayami | dipam darshayami |
    naivedyam samarpayami | tambulam samarpayami | nirajanam samarpayami | mantrapushpam samarpayami |
    pradakshina namaskaran samarpayami || shodashopacara puja ganapati dhyanam o ntva ganapatigm havamahe
    kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam ||
    ekadantaya vidmahe vakratundaya dhimahi | tanno dantih pracodaya t || ekadantam caturhastam pashamankushadharinam
    | radam ca varadam hastairbibhranam mushakadhvajam || raktam lambodaram shurpakarnakam raktavasasam
    | raktagandhanuliptangam raktapushpaih supujitam || bhaktanukampinam devam jagatkaranamacyutam | avirbhutam
    ca srishtyadau prakriteh purushatparam || evam dhyayati yo nityam sa yogi yoginam varah || caturbahum
    trinetram ca gajasyam raktavarnakam | pashankushadi samyuktam mayayuktam pracintayet || om shrimahaganapataye
    namah | dhyayami | dhyanam samarpayami || avahanam agaccha brahmanam natha surasuravararcita | siddhibuddhyadi
    samyukta bhaktigrahana lalasa || om shrimahaganapataye namah | avahayami | sthapayami | pujayami ||
    asanam ratnasimhasanam svamin grihana gananayaka | tatropavishya vighnesha raksha bhaktanvisheshatah
    || om shrimahaganapataye namah | asanam samarpayami || padyam suvasitabhiradbhishca padaprakshalanam
    prabho | shitoshnambhah karomi te grihana padyamuttamam || om shrimahaganapataye namah | padayoh padyam
    samarpayami || arghyam ratnapravalamuktadyairanarghyaih samskritam prabho | arghyam grihana heramba
    dviradanana toshakam || om shrimahaganapataye namah | hastayoh arghyam samarpayami || acamaniyam sarvatirthahritam
    toyam suvasitam suvastubhih | acamanam ca tenaiva kurushva gananayaka || om shrimahaganapataye namah
    | mukhe acamaniyam samarpayami || snanam apo hishtha mayobhuvasta na urje dadhatana | mahe ranaya
    cakshase || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva matarah || tasma ara ngamama
    vo yasya kshayaya jinvatha | apo janayatha ca nah || om shrimahaganapataye namah | shuddhodaka snanam
    samarpayami || snananantaram acamaniyam samarpayami || vastram vastrayugmam grihana tvamanargham raktavarnakam
    | lokalajjaharam caiva vighnanatha namo'stu te || om shrimahaganapataye namah | vastram samarpayami
    || yajnopavitam yajnopavitam paramam pavitram prajapateryatsahajam purastat | ayushyamagryam pratimunca
    shubhram yajnopavitam balamastu tejah || om shrimahaganapataye namah | yajnopavitam samarpayami ||
    gandham rakta candana samyuktam gandham ganesa grihyatam | bhaktya samarpitam tubhyam sarvasampattipradayakam
    || om shrimahaganapataye namah | gandham samarpayami || arcana akshatan dhavalan divyan pushpani ca
    sugandhini | bhaktya dattani grihyantam sarvadevah prasidata || anga puja om sumukhaya namah padau
    pujayami | om ekadantaya namah gulphau pujayami | om kapilaya namah januni pujayami | om gajakarnakaya
    namah uru pujayami | om lambodaraya namah udaram pujayami | om vikataya namah hridayam pujayami |
    om vighnarajaya namah kantham pujayami | om ganadhipaya namah skandhau pujayami | om dhumaketave namah
    mukham pujayami | om ganadhyakshaya namah netre pujayami | om phalacandraya namah lalatam pujayami
    | om gajananaya namah shirah pujayami | om vakratundaya namah sarvanyangani pujayami || ganesha ashtottara
    shata namavali athava ganapati namavali pathanam || om shrimahaganapataye namah | ashtottara shata
    namavali pujam samarpayami | akshatan pushpani ca samarpayami || dhupam dashangam guggulupetam sugandham
    sumanoharam | umasuta namastubhyam dhupo'yam pratigrihyatam || om shrimahaganapataye namah | dhupamaghrapayami
    || dipam sajyam trivarti samyuktam vahnina yojitam priyam | grihana mangalam dipam vighnaraja namo'stu
    te || om shrimahaganapataye namah | dipam darshayami || naivedyam naivedyam grihyatam deva bhaktya
    sampaditam maya | idam phalam ca paniyam sarvopacara samyutam || o mbhurbhuvassuvah | tatsaviturvare
    mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva ritena parishincami | amritamastu
    | amritopastaranamasi | om pranaya svaha | om apanaya svaha | om vyanaya svaha | om udanaya svaha
    | om samanaya svaha | madhye madhye paniyam samarpayami | amritapidhanamasi | uttaraposhanam samarpayami
    | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam samarpayami || om shrimahaganapataye
    namah | naivedyam samarpayami || tambulam ashtangam deva tambulam grihana mukhavasanam | asakridvighnaraja
    tvam maya dattam visheshatah || om shrimahaganapataye namah | tambulam samarpayami || nirajanam nanadipasamayuktam
    nirajanam gajanana | grihana bhava samyuktam sarvajnanavinashana || om shrimahaganapataye namah |
    nirajanam samarpayami || mantrapushpam o ntva ganapatigm havamahe kavi nkavinam upamashravastavam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || caturvedabhavairmantrairganapatyairgajanana
    | mantritani grihana tvam pushpapatrani vighnapa || om shrimahaganapataye namah | mantrapushpam samarpayami
    || pradakshinam ekavimshatisankhyam va trisankhyam va gajanana | pradakshinyam grihana tvam brahman
    brahmeshabhavana || om shrimahaganapataye namah | pradakshina namaskaran samarpayami || namaskarah
    urasa shirasa drishtya manasa vacasa tatha | padbhyam karabhyam karnabhyam pranamo'shtanga ucyate
    || om shrimahaganapataye namah | namaskaran samarpayami || sarvopacarah om shrimahaganapataye namah
    | chatram samarpayami | camaram samarpayami | gitam shravayami | nrityam darshayami | samasta rajopacaran
    devopacaran samarpayami || stotra sukta pathanam ganapati atharva shirsham shri mahaganesha pancaratnam
    kshamaprarthana aparadhanasankhyatan kshamasva gananayaka | bhaktam kuru ca mam dhundhe tava padapriyam
    sada || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam parasmai
    narayanayeti samarpayami || anaya dhyana shodashopacara pujaya shrimahaganapatih supritah suprasannah
    varado bhavatu || udvasanam om shrimahaganapataye namah | yathasthanam udvasayami | shobhanarthe kshemaya
    punaragamanaya ca || prasada grahanam akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram
    devata padodakam shubham || shrimahaganapati prasadam shirasa grihnami || om shantih shantih shantih
    || om tatsat brahmarpanamastu ||
  devanagari: गणपति प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो नमः । हरिः
    ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम पूजां करिष्ये ॥ तदङ्ग कलशाराधनं करिष्ये
    ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि हस्तं निधाय । कलशस्य
    मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः स्मृताः ॥ कुक्षौ तु
    सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च सहिताः सर्वे कलशाम्बु
    समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन् सन्निधिं कुरु ॥ कावेरी
    तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः ॥ आयान्तु देवपूजार्थं
    मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य ॥ शङ्खपूजा शङ्खं
    चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम् ॥ त्रैलोक्ये
    यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत् ॥ ॐ शङ्खाय
    नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि ॥ घण्टानादः
    आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ घण्टादेवताभ्यो
    नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां
    उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ सुमुखश्चैकदन्तश्च
    कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः फालचन्द्रो गजाननः । वक्रतुण्डः
    शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । आवाहयामि । आसनं समर्पयामि । पाद्यं
    समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि । वस्त्रं समर्पयामि । यज्ञोपवीतं
    समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि । दीपं दर्शयामि । नैवेद्यं समर्पयामि
    । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ षोडशोपचार पूजा गणपति ध्यानम् ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒
    म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ एकद॒न्ताय॑ वि॒द्महे॑ वक्रतु॒ण्डाय॑ धीमहि । तन्नो॑
    दन्तिः प्रचो॒दया त् ॥ एकदन्तं चतुर्हस्तं पाशमङ्कुशधारिणम् । रदं च वरदं हस्तैर्बिभ्राणं मूषकध्वजम्
    ॥ रक्तं लम्बोदरं शूर्पकर्णकं रक्तवाससम् । रक्तगन्धानुलिप्ताङ्गं रक्तपुष्पैः सुपूजितम् ॥ भक्तानुकम्पिनं
    देवं जगत्कारणमच्युतम् । आविर्भूतं च सृष्ट्यादौ प्रकृतेः पुरुषात्परम् ॥ एवं ध्यायति यो नित्यं स योगी
    योगिनां वरः ॥ चतुर्बाहुं त्रिनेत्रं च गजास्यं रक्तवर्णकम् । पाशाङ्कुशादि संयुक्तं मायायुक्तं प्रचिन्तयेत्
    ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । ध्यानं समर्पयामि ॥ आवाहनम् आगच्छ ब्रह्मणां नाथ सुरासुरवरार्चित
    । सिद्धिबुद्ध्यादि संयुक्त भक्तिग्रहण लालस ॥ ॐ श्रीमहागणपतये नमः । आवाहयामि । स्थापयामि । पूजयामि
    ॥ आसनम् रत्नसिंहासनं स्वामिन् गृहाण गणनायक । तत्रोपविश्य विघ्नेश रक्ष भक्तान्विशेषतः ॥ ॐ श्रीमहागणपतये
    नमः । आसनं समर्पयामि ॥ पाद्यम् सुवासिताभिरद्भिश्च पादप्रक्षालनं प्रभो । शीतोष्णाम्भः करोमि ते गृहाण
    पाद्यमुत्तमम् ॥ ॐ श्रीमहागणपतये नमः । पादयोः पाद्यं समर्पयामि ॥ अर्घ्यम् रत्नप्रवालमुक्ताद्यैरनर्घ्यैः
    संस्कृतं प्रभो । अर्घ्यं गृहाण हेरम्ब द्विरदानन तोषकम् ॥ ॐ श्रीमहागणपतये नमः । हस्तयोः अर्घ्यं समर्पयामि
    ॥ आचमनीयम् सर्वतीर्थाहृतं तोयं सुवासितं सुवस्तुभिः । आचमनं च तेनैव कुरुष्व गणनायक ॥ ॐ श्रीमहागणपतये
    नमः । मुखे आचमनीयं समर्पयामि ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से
    ॥ यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒
    जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥ ॐ श्रीमहागणपतये नमः । शुद्धोदक स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं
    समर्पयामि ॥ वस्त्रम् वस्त्रयुग्मं गृहाण त्वमनर्घं रक्तवर्णकम् । लोकलज्जाहरं चैव विघ्ननाथ नमोऽस्तु
    ते ॥ ॐ श्रीमहागणपतये नमः । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम् यज्ञोपवीतं परमं पवित्रं प्रजापतेर्यत्सहजं
    पुरस्तात् । आयुष्यमग्र्यं प्रतिमुञ्च शुभ्रं यज्ञोपवीतं बलमस्तु तेजः ॥ ॐ श्रीमहागणपतये नमः । यज्ञोपवीतं
    समर्पयामि ॥ गन्धम् रक्त चन्दन संयुक्तं गन्धं गणेस गृह्यताम् । भक्त्या समर्पितं तुभ्यं सर्वसम्पत्तिप्रदायकम्
    ॥ ॐ श्रीमहागणपतये नमः । गन्धं समर्पयामि ॥ अर्चन अक्षतान् धवलान् दिव्यान् पुष्पाणि च सुगन्धीनि । भक्त्या
    दत्तानि गृह्यन्तां सर्वदेवाः प्रसीदत ॥ अङ्ग पूजा ॐ सुमुखाय नमः पादौ पूजयामि । ॐ एकदन्ताय नमः गुल्फौ
    पूजयामि । ॐ कपिलाय नमः जानुनी पूजयामि । ॐ गजकर्णकाय नमः ऊरू पूजयामि । ॐ लम्बोदराय नमः उदरं पूजयामि
    । ॐ विकटाय नमः हृदयं पूजयामि । ॐ विघ्नराजाय नमः कण्ठं पूजयामि । ॐ गणाधिपाय नमः स्कन्धौ पूजयामि । ॐ
    धूमकेतवे नमः मुखं पूजयामि । ॐ गणाध्यक्षाय नमः नेत्रे पूजयामि । ॐ फालचन्द्राय नमः ललाटं पूजयामि । ॐ
    गजाननाय नमः शिरः पूजयामि । ॐ वक्रतुण्डाय नमः सर्वाण्यङ्गानि पूजयामि ॥ गणेश अष्टोत्तर शत नामावली अथवा
    गणपति नामावली पठनम् ॥ ॐ श्रीमहागणपतये नमः । अष्टोत्तर शत नामावली पूजां समर्पयामि । अक्षतान् पुष्पाणि
    च समर्पयामि ॥ धूपम् दशाङ्गं गुग्गुलूपेतं सुगन्धं सुमनोहरम् । उमासुत नमस्तुभ्यं धूपोऽयं प्रतिगृह्यताम्
    ॥ ॐ श्रीमहागणपतये नमः । धूपमाघ्रापयामि ॥ दीपम् साज्यं त्रिवर्ति संयुक्तं वह्निना योजितं प्रियम् ।
    गृहाण मङ्गलं दीपं विघ्नराज नमोऽस्तु ते ॥ ॐ श्रीमहागणपतये नमः । दीपं दर्शयामि ॥ नैवेद्यम् नैवेद्यं
    गृह्यतां देव भक्त्या सम्पादितं मया । इदं फलं च पानीयं सर्वोपचार संयुतम् ॥ ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे
    म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो नः॑ प्रचो॒दया त् ॥ सत्यं त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि
    । ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये
    मध्ये पानीयं समर्पयामि । अमृतापिधानमसि । उत्तरापोशनं समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि
    । शुद्धाचमनीयं समर्पयामि ॥ ॐ श्रीमहागणपतये नमः । नैवेद्यं समर्पयामि ॥ ताम्बूलम् अष्टाङ्गं देव ताम्बूलं
    गृहाण मुखवासनम् । असकृद्विघ्नराज त्वं मया दत्तं विशेषतः ॥ ॐ श्रीमहागणपतये नमः । ताम्बूलं समर्पयामि
    ॥ नीराजनम् नानादीपसमायुक्तं नीराजनं गजानन । गृहाण भाव संयुक्तं सर्वाज्ञानविनाशन ॥ ॐ श्रीमहागणपतये
    नमः । नीराजनं समर्पयामि ॥ मन्त्रपुष्पम् ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां उप॒मश्र॑वस्तवम्
    । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ चतुर्वेदभवैर्मन्त्रैर्गाणपत्यैर्गजानन
    । मन्त्रितानि गृहाण त्वं पुष्पपत्राणि विघ्नप ॥ ॐ श्रीमहागणपतये नमः । मन्त्रपुष्पं समर्पयामि ॥ प्रदक्षिणम्
    एकविंशतिसङ्ख्यं वा त्रिसङ्ख्यं वा गजानन । प्रादक्षिण्यं गृहाण त्वं ब्रह्मन् ब्रह्मेशभावन ॥ ॐ श्रीमहागणपतये
    नमः । प्रदक्षिण नमस्कारान् समर्पयामि ॥ नमस्कारः उरसा शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्यां कराभ्यां
    कर्णाभ्यां प्रणामोऽष्टाङ्ग उच्यते ॥ ॐ श्रीमहागणपतये नमः । नमस्कारान् समर्पयामि ॥ सर्वोपचाराः ॐ श्रीमहागणपतये
    नमः । छत्रं समर्पयामि । चामरं समर्पयामि । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त राजोपचारान् देवोपचारान्
    समर्पयामि ॥ स्तोत्र सूक्त पठनम् गणपति अथर्व शीर्षम् श्री महागणेश पञ्चरत्नम् क्षमाप्रार्थना अपराधानसङ्ख्यातान्
    क्षमस्व गणनायक । भक्तं कुरु च मां ढुण्ढे तव पादप्रियं सदा ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना
    वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ अनया ध्यान षोडशोपचार पूजया
    श्रीमहागणपतिः सुप्रीतः सुप्रसन्नः वरदो भवतु ॥ उद्वासनम् ॐ श्रीमहागणपतये नमः । यथास्थानं उद्वासयामि
    । शोभनार्थे क्षेमाय पुनरागमनाय च ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं
    देवता पादोदकं शुभम् ॥ श्रीमहागणपति प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ब्रह्मार्पणमस्तु
    ॥
