id: dvadashazyotistotra
category: stotram
name:
  english: dvadashazyotistotra
  devanagari: द्वादशज़्योतिस्तोत्र
content:
  english: avantikayam vihitavataram muktipradanaya ca sajjananam | akalamrityoh parirakshanartham vande
    mahakalamahasuresham || 3|| kaverikanarmadayoh pavitre samagame sajjanataranaya | sadaiva mandhatripure
    vasantam onkaramisham shivamekamide || 4|| purvottare prajvalikanidhane sadashivam tam girijasametam
    |
  devanagari: अवन्तिकायां विहितावतारं मुक्तिप्रदानाय च सज्जनानाम् । अकालमृत्योः परिरक्षणार्थं वन्दे महाकालमहासुरेशम्
    ॥ ३॥ कावेरिकानर्मदयोः पवित्रे समागमे सज्जनतारणाय । सदैव मान्धातृपुरे वसन्तं ओङ्कारमीशं शिवमेकमीडे
    ॥ ४॥ पूर्वोत्तरे प्रज्वलिकानिधाने सदाशिवं तं गिरिजासमेतम् ।
meaning: {}
