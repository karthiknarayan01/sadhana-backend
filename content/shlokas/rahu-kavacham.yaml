id: rahu-kavacham
category: stotram
name:
  english: Rahu Kavacham
content:
  english: dhyanam pranamami sada rahum shurpakaram kiritinam | saimhikeyam karalasyam lokanamabhayapradam
    || || | atha rahu kavacam | nilambarah shirah patu lalatam lokavanditah | cakshushi patu me rahuh
    shrotre tvardhashariravan || || nasikam me dhumravarnah shulapanirmukham mama | jihvam me simhikasunuh
    kantham me kathinanghrikah || || bhujangesho bhujau patu nilamalyambarah karau | patu vakshahsthalam
    mantri patu kukshim vidhuntudah || || katim me vikatah patu uru me surapujitah | svarbhanurjanuni
    patu janghe me patu jadyaha || || gulphau grahapatih patu padau me bhishanakritih | sarvanyangani
    me patu nilacandanabhushanah || || phalashrutih rahoridam kavacamriddhidavastudam yo bhaktya pathatyanudinam
    niyatah shucih san | prapnoti kirtimatulam shriyamriddhi mayurarogyamatmavijayam ca hi tatprasadat
    || || || iti shrimahabharate dhritarashtrasanjayasamvade dronaparvani rahukavacam sampurnam ||
  devanagari: ध्यानम् प्रणमामि सदा राहुं शूर्पाकारं किरीटिनम् । सैंहिकेयं करालास्यं लोकानामभयप्रदम् ॥
    ॥ । अथ राहु कवचम् । नीलाम्बरः शिरः पातु ललाटं लोकवन्दितः । चक्षुषी पातु मे राहुः श्रोत्रे त्वर्धशरिरवान्
    ॥ ॥ नासिकां मे धूम्रवर्णः शूलपाणिर्मुखं मम । जिह्वां मे सिंहिकासूनुः कण्ठं मे कठिनाङ्घ्रिकः ॥ ॥ भुजङ्गेशो
    भुजौ पातु नीलमाल्याम्बरः करौ । पातु वक्षःस्थलं मन्त्री पातु कुक्षिं विधुन्तुदः ॥ ॥ कटिं मे विकटः पातु
    ऊरू मे सुरपूजितः । स्वर्भानुर्जानुनी पातु जङ्घे मे पातु जाड्यहा ॥ ॥ गुल्फौ ग्रहपतिः पातु पादौ मे भीषणाकृतिः
    । सर्वाण्यङ्गानि मे पातु नीलचन्दनभूषणः ॥ ॥ फलश्रुतिः राहोरिदं कवचमृद्धिदवस्तुदं यो भक्त्या पठत्यनुदिनं
    नियतः शुचिः सन् । प्राप्नोति कीर्तिमतुलां श्रियमृद्धि मायुरारोग्यमात्मविजयं च हि तत्प्रसादात् ॥ ॥
    ॥ इति श्रीमहाभारते धृतराष्ट्रसञ्जयसंवादे द्रोणपर्वणि राहुकवचं सम्पूर्णम् ॥
