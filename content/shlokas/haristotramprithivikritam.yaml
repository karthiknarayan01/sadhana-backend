id: haristotramprithivikritam
category: stotram
name:
  english: haristotramprithivikritam
  devanagari: हरिस्तोत्रम्पृथिवीकृतं
content:
  english: namaste jagadavyaktarupa karanakarana | pradhana purushatita sthityutpattilayatmaka || 15||
    jaganniyojanapara svahabhogadharottama | jagadanandanandatman bhagavan jagadishvara || 16|| niyojako
    niyojyashca vibhrajan vishnuravyayah | namastubhyam jagaddhatastrilokalaya vishvakrit || 17|| yah
    palayati nityani sthapayatyeva tatparah | tam tvam niyamarupena namami jagadishvara || 18|| tvam madhavah
    pravekashca kamah kamalayo layah | prasuticyutihetvarthatranakaranamishvarah || 19|| na yasya te kledaya
    syurapo noshma tathoshmane | na shitaya bhavecchitam tasmai tubhyam namo namah || 20|| na samudrah
    plavakaro na shoshaya dahatmakah | na mrityave yasya yamastasmai tubhyam namo namah || 21|| yacciddharyam
    yogibhih shantadehai
  devanagari: नमस्ते जगदव्यक्तरूप कारणकारण । प्रधान पुरुषातीत स्थित्युत्पत्तिलयात्मक ॥ १५॥ जगन्नियोजनपर
    स्वाहाभोगधरोत्तम । जगदानन्दनन्दात्मन् भगवन् जगदीश्वर ॥ १६॥ नियोजको नियोज्यश्च विभ्राजन् विष्णुरव्ययः
    । नमस्तुभ्यं जगद्धातस्त्रिलोकालय विश्वकृत् ॥ १७॥ यः पालयति नित्यानि स्थापयत्येव तत्परः । तं त्वां
    नियमरूपेण नमामि जगदीश्वर ॥ १८॥ त्वं माधवः प्रवेकश्च कामः कामालयो लयः । प्रसूतिच्युतिहेत्वर्थत्राणकारणमीश्वरः
    ॥ १९॥ न यस्य ते क्लेदाय स्युरापो नोष्मा तथोष्मणे । न शीताय भवेच्छीतं तस्मै तुभ्यं नमो नमः ॥ २०॥ न
    समुद्रः प्लवकरो न शोषाय दहात्मकः । न मृत्यवे यस्य यमस्तस्मै तुभ्यं नमो नमः ॥ २१॥ यच्चिद्धार्यं योगिभिः
    शान्तदेहै
