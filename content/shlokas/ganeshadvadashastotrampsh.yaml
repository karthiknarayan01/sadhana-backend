id: ganeshadvadashastotrampsh
category: stotram
name:
  english: ganeshadvadashastotramPsh
  devanagari: गणेशद्वादशस्तोत्रम्Pष्
content:
  english: mahaganapatim pujyam mangalyavakpravahinam | mahadbrahmandakukshim tam gananatham bhajamyaham
    || 5|| pancananapramodam tam panisthajnanamodakam | pashupashavimoktaram gananatham bhajamyaham ||
    6|| dhanajnanapradataram dharakedarasusthalam | dhanyaikadantadaivatyam gananatham bhajamyaham ||
    7|| nishthapujitanityam tam nityapujanasaubhagam | nityomkarasvatundam nam gananatham bhajamyaham
    || 8|| saptasvarashubhanrityam sarvasiddhivinayakam | sarvamangaladhataram gananatham bhajamyaham
    || 9|| tyagarajagurusvamisatkirtanasusevitam | shishyapushpastutistotrabhavapurnam sumangalam || 10||
    mangalam gananathaya herambaya sumangalam | mangalam vighnavaraya shubhottungaya mangalam || 11||
    ganeshasphuritastotram vighnaghnam jnanadam shubham | gananathakripapurnam pathitavyam dine dine ||
    12|| om shubhamastu iti sadgurushrityagarajasvamishishyaya bhaktaya pushpaya gurusvamisannidhau samarpitam
    shriganeshadvadashastotram sampurnam | om
  devanagari: महागणपतिं पूज्यं मङ्गल्यवाक्प्रवाहिणम् । महद्ब्रह्माण्डकुक्षिं तं गणनाथं भजाम्यहम् ॥ ५॥
    पञ्चाननप्रमोदं तं पाणिस्थज्ञानमोदकम् । पशुपाशविमोक्तारं गणनाथं भजाम्यहम् ॥ ६॥ धनज्ञानप्रदातारं धरकेदारसुस्थलम्
    । धन्यैकदन्तदैवत्यं गणनाथं भजाम्यहम् ॥ ७॥ निष्ठापूजितनित्यं तं नित्यपूजनसौभगम् । नित्योंकारस्वतुण्डं
    नं गणनाथं भजाम्यहम् ॥ ८॥ सप्तस्वरशुभानृत्यं सर्वसिद्धिविनायकम् । सर्वमङ्गलधातारं गणनाथं भजाम्यहम्
    ॥ ९॥ त्यागराजगुरुस्वामिसत्कीर्तनसुसेवितम् । शिष्यापुष्पास्तुतिस्तोत्रभावपूर्णं सुमङ्गलम् ॥ १०॥ मङ्गलं
    गणनाथाय हेरंबाय सुमङ्गलम् । मङ्गलं विघ्नवाराय शुभोत्तुङ्गाय मङ्गलम् ॥ ११॥ गणेशस्फुरितस्तोत्रं विघ्नघ्नं
    ज्ञानदं शुभम् । गणनाथकृपापूर्णं पठितव्यं दिने दिने ॥ १२॥ ॐ शुभमस्तु इति सद्गुरुश्रीत्यागराजस्वामिशिष्यया
    भक्तया पुष्पया गुरुस्वामिसन्निधौ समर्पितं श्रीगणेशद्वादशस्तोत्रं सम्पूर्णम् । ॐ
