id: stavacintamanih
category: stotram
name:
  english: stavacintamanih
  devanagari: स्तवचिन्तामणिः
content:
  english: nishcalajnanasampadam | jneyo'si kila ke'pyete ye tvam jananti dhurjate | | 27 | | nirguno'pi
    gunajnanam jneya eko jayatyajah | nishkamo'pi prakritya yah kamananam param phalam | | 28 | | shriratnamritalabhaya
    klishtam yatra na kaih suraih | tatkshirodadam aishvaryam tavaiva sahajam vibho | | 29 | | namo bhaktya
    nrinam muktyai bhavate bhava te'vate | smritya nutya ca dadate shambhave sham bhave'bhave | | 30 |
    | sarvajnah sarvakritsarvam asiti jnanashalinam | vedyam kim karma va natha nanantyaya tvayarpyate
    | | 31 | | icchaya eva yasyeyatphalam lokatrayatmakam | tasya te natha karyanam ko vetti kiyati gatih
    | | 32 | | brahmadayo'pi tadyasya karmasopanamalaya | uparyupari dhavanti labdhum dhama namami tam
    | | 33 | | ayam brahma mahendro'yam suryacandramasavimau | iti shaktilata yasya pushpita patvasau
    bhavah | | 34 | | bhramo na labhyate yasya bhrantantahkaranairapi | duragairapi yasyanto durgam astam
    stumo mridam | | 35 | | namah stutau smritau dhyane darshane sparshane tatha | praptau canandavrindaya
    dayitaya kapardine | | 36 | | kim smayeneti matvapi manasa parameshvara | smayena tvanmayo'smiti mami
    natmani kim muda | | 37 | | cintayitvapi kartavya
  devanagari: निश्चलज्ञानसम्पदां । ज्ञेयोऽसि किल केऽप्येते ये त्वां जानन्ति धूर्जटे । । २७ । । निर्गुणोऽपि
    गुणज्ञानां ज्ञेय एको जयत्यजः । निष्कामोऽपि प्रकृत्या यः कामनानां परं फलं । । २८ । । श्रीरत्नामृतलाभाय
    क्लिष्टं यत्र न कैः सुरैः । तत्क्षीरोददं ऐश्वर्यं तवैव सहजं विभो । । २९ । । नमो भक्त्या नृणां मुक्त्यै
    भवते भव तेऽवते । स्मृत्या नुत्या च ददते शम्भवे शं भवेऽभवे । । ३० । । सर्वज्ञः सर्वकृत्सर्वं असीति
    ज्ञानशालिनां । वेद्यं किं कर्म वा नाथ नानन्त्याय त्वयार्प्यते । । ३१ । । इच्छाया एव यस्येयत्फलं लोकत्रयात्मकं
    । तस्य ते नाथ कार्याणां को वेत्ति कियती गतिः । । ३२ । । ब्रह्मादयोऽपि तद्यस्य कर्मसोपानमालया । उपर्युपरि
    धावन्ति लब्धुं धाम नमामि तं । । ३३ । । अयं ब्रह्मा महेन्द्रोऽयं सूर्याचन्द्रमसाविमौ । इति शक्तिलता
    यस्य पुष्पिता पात्वसौ भवः । । ३४ । । भ्रमो न लभ्यते यस्य भ्रान्तान्तःकरणैरपि । दूरगैरपि यस्यान्तो
    दुर्गं अस्तं स्तुमो मृडं । । ३५ । । नमः स्तुतौ स्मृतौ ध्याने दर्शने स्पर्शने तथा । प्राप्तौ चानन्दवृन्दाय
    दयिताय कपर्दिने । । ३६ । । किं स्मयेनेति मत्वापि मनसा परमेश्वर । स्मयेन त्वन्मयोऽस्मीति मामि नात्मनि
    किं मुदा । । ३७ । । चिन्तयित्वापि कर्तव्य
