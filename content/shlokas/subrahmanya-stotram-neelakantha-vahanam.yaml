id: subrahmanya-stotram-neelakantha-vahanam
category: stotram
name:
  english: Subrahmanya Stotram (Neelakantha Vahanam)
content:
  english: nilakantha vahanam dvishadbujam kiritinam lola ratna kundala prababhirama shanmukham shula
    shakti danda kukku takshamalika dharam balamishvaram kumarashaila vasinam bhaje || valli devayanika
    samullasanta mishvaram mallikadi divyapushpa malika virajitam jallali ninada shankha vadanapriyam
    sada pallavarunam kumarashaila vasinam bhaje || shadananam kunkuma raktavarnam mahamatim divya mayura
    vahanam rudrasya sunum sura sainya natham guham sada sharanamaham bhaje || mayuradhirudham mahavakyagudham
    manoharideham mahaccittageham mahidevadevam mahavedabhavam mahadevabalam bhaje lokapalam ||
  devanagari: नीलकण्ठ वाहनं द्विषड्बुजं किरीटिनं लोल रत्न कुण्डल प्रबाभिराम षण्मुखं शूल शक्ति दण्ड कुक्कु
    ताक्षमालिका धरम् बालमीश्वरं कुमारशैल वासिनं भजे ॥ वल्लि देवयानिका समुल्लसन्त मीश्वरं मल्लिकादि दिव्यपुष्प
    मालिका विराजितं जल्ललि निनाद शङ्ख वादनप्रियं सदा पल्लवारुणं कुमारशैल वासिनं भजे ॥ षडाननं कुङ्कुम रक्तवर्णं
    महामतिं दिव्य मयूर वाहनं रुद्रस्य सूनुं सुर सैन्य नाथं गुहं सदा शरणमहं भजे ॥ मयूराधिरूढं महावाक्यगूढं
    मनोहारिदेहं महच्चित्तगेहम् महीदेवदेवं महावेदभावं महादेवबालं भजे लोकपालम् ॥
