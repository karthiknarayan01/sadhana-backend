id: subrahmanyasahasranamastotra
category: stotram
name:
  english: subrahmanyasahasranamastotra
  devanagari: सुब्रह्मण्यसहस्रनामस्तोत्र
content:
  english: dhyayamipsita siddhidam shivasutam skandam suraradhitam || dvishadbhujam shanmukhamambikasutam
    kumaramaditya sahasratejasam | vande mayurasanamagnisambhavam senanyamadhyahamabhishtasiddhaye ||
    atha lamityadi pancapuja | lam prithivyatmane gandham kalpayami | ham akashatmane pushpani kalpayami
    | yam vayvatmane dhupam kalpayami | ram agnyatmane dipam kalpayami | vam amritatmane amritam mahanaivedyam
    kalpayami | sam sarvatmane tambuladi sarvopacarapujan kalpayami || atha stotram | om subrahmanyah
    sureshanah surarikulanashanah | brahmanyo brahmavid brahma brahmavidyagururguruh || 1|| ishanagururavyakto
    vyaktarupah sanatanah | pradhanapurushah karta karma karyam ca karanam || 2|| adhishthanam ca vijnanam
    bhokta bhogashca kevalah | anadinidhanah sakshi niyanta niyamo yamah || 3|| vakpatirvakprado vagmi
    vacyo vagvacakastatha | pitamahagururlokagurustatvarthabodhakah || 4|| pranavarthopadeshta capyajo
    brahma sanatanah | vedantavedyo vedatma vedadirvedabodhakah || 5|| vedanto vedaguhyashca vedashastrarthabodhakah
    | sarvavidyatmakah shantashcatushshashtikalaguruh || 6|| mantrartho mantramurtishca mantratantrapravartakah
    | mantri mantro mantrabijam mahamantropadeshakah || 7|| mahotsaho mahashaktirmahashaktidharah prabhuh
    | jagatsrashta jagadbharta jaganmurtirjaganmayah || 8|| jagadadiranadishca jagadbijam jagadguruh |
    jyotirmayah prashantatma saccidanandavigrahah || 9|| sukhamurtih sukhakarah sukhi sukhakarakritih
    | jnata jneyo jnanarupo jnaptirjnanabalam budhah || 10|| vishnurjishnurgrasishnushca prabhavishnuh
    sahishnukah | vardhishnurbhushnurajarastitikshnuh kshantirarjavam || 11|| rijuh sugamyahsulabho durlabho
    labha ipsitah | vijno vijnanabhokta ca shivajnanapradayakah || 12|| mahadadirahankaro bhutadirbhutabhavanah
    | bhutabhavya bhavishyacca bhuta bhavyabhavatprabhuh || 13|| devasenapatirneta kumaro devanayakah
    | tarakarirmahaviryah simhavaktrashiroharah || 14|| anekakotibrahmanda paripurnasurantakah | suranandakarah
    shrimanasuradibhayankarah || 15|| asurantah purakrandakarabherininadanah | suravandyo jananandakarashinjanmanidhvanih
    || 16|| sphutattahasasankshubhyattarakasuramanasah | mahakrodho mahotsaho mahabalaparakramah || 17||
    mahabuddhirmahabahurmahamayo mahadhritih | ranabhimah shatruharo dhirodattagunottarah || 18|| mahadhanurmahabano
    mahadevapriyatmajah | mahakhadgo mahakheto mahasatvo mahadyutih || 19|| mahardhishca mahamayi mayuravaravahanah
    | mayurabarhatapatro mayuranatanapriyah || 20|| mahanubhavo'meyatma'meyashrishca mahaprabhuh | suguno
    durgunadveshi nirguno nirmalo'malah || 21|| subalo vimalah kantah kamalasana pujitah | kalah kamalapatrakshah
    kalikalmashanashanah || 22|| maharano mahayoddha mahayuddhapriyo'bhayah | maharatho mahabhago bhaktabhishtaphalapradah
    || 23|| bhaktapriyah priyah prema preyan pritidharah sakha | gaurikarasarojagra lalaniya mukhambujah
    || 24|| krittikastanyapanaikavyagrashadvadanambujah | candracudangabhubhaga viharanavisharadah ||
    25|| ishananayananandakandalavanyanasikah | candracudakarambhoja parimrishtabhujavalih || 26|| lambodara
    sahakrida lampatah sharasambhavah | amaranananalika cakoripurna candramah || 27|| sarvanga sundarah
    shrishah shrikarah shripradah shivah | vallisakho vanacaro vakta vacaspatirvarah || 28|| candracudo
    barhipincha shekharo makutojjvalah | gudakeshah suvrittorushira mandarashekharah || 29|| bimbadharah
    kundadanto japashonagralocanah | shaddarshaninatirangarasano madhurasvanah || 30|| meghagambhiranirghoshah
    priyavak prasphutaksharah | smitavaktrashcotpalakshashcarugambhiravikshanah || 31|| karnantadirghanayanah
    karnabhushana bhushitah | sukundalashcarugandah kambugrivo mahahanuh || 32|| pinamso gudhajatrushca
    pinavrittabhujavalih | raktango ratnakeyuro ratnakankanabhushitah|| 33|| jyakinanka lasadvamaprakoshthavalayojjvalah
    | rekhankushadhvajacchatrapanipadmo mahayudhah || 34|| suraloka bhayadhvanta balarunakarodayah | anguliyakaratnamshu
    dvigunodyannakhankurah || 35|| pinavaksha mahaharo navaratnavibhushanah | hiranyagarbho hemango hiranyakavaco
    harah || 36|| hiranmaya shirastrano hiranyaksho hiranyadah | hiranyanabhistrivali lalitodarasundarah
    || 37|| suvarnasutravilasadvishankatakatitatah | pitambaradharo ratnamekhalavrita madhyakah || 38||
    pivaralomavrittodyatsujanurguptagulphakah | shankhacakrabjakulishadhvajarekhanghripankajah || 39||
    navaratnojjvalatpadakatakah paramayudhah | surendramakutaprodyanmani ranjitapadukah || 40|| pujyanghrishcarunakharo
    devasevyasvapadukah | parvatipani kamalaparimrishtapadambujah || 41|| mattamatanga gamano manyo manyagunakarah
    | kraunca daranadakshaujah kshanah kshanavibhagakrit || 42|| sugamo durgamo durgo duraroho'riduh sahah
    | subhagah sumukhah suryah suryamandalamadhyagah || 43|| svakinkaropasamsrishtasrishtisamrakshitakhilah
    | jagatsrashta jagadbharta jagatsamharakarakah || 44|| sthavaro jangamo jeta vijayo vijayapradah |
    jayashilo jitaratirjitamayo jitasurah || 45|| jitakamo jitakrodho jitamohassumohanah | kamadah kamabhritkami
    kamarupah kritagamah || 46|| kantah kalyah kalidhvamsi kalharakusumapriyah | ramo ramayita ramyo ramanijanavallabhah
    || 47|| rasajno rasamurtishca raso navarasatmakah | rasatma rasikatma ca rasakridaparo ratih || 48||
    suryakotipratikashah somasuryagnilocanah | kalabhijnah kalarupi kalapi sakalaprabhuh || 49|| bindurnadah
    kalamurtih kalatito'ksharatmakah | matrakarah svarakarah ekamatro dvimatrakah || 50|| trimatrakashcaturmatro
    vyaktah sandhyaksharatmakah | vyanjanatma viyuktatma samyuktatma svaratmakah || 51|| visarjaniyo'nusvarah
    sarvavarnatanurmahan | akaratma'pyukaratma makaratma trivarnakah || 52|| onkaro'tha vashatkarah svahakarah
    svadhakritih | ahutirhavanam havyam hota'dhvaryurmahahavih || 53|| brahmodgata sadasyashca barhiridhmam
    samiccaruh | kavyam pashuh purodashah amiksha vajavajinam || 54|| pavanah pavanah putah pavamanah
    parakritih | pavitram paridhih purnapatramudbhutirindhanam || 55|| vishodhanam pashupatih pashupashavimocakah
    | pakayajno mahayajno yajno yajnapatiryajuh || 56|| yajnango yajnagamyashca yajva yajnaphalapradah
    | yajnangabhuryajnapatiryajnashriryajnavahanah || 57|| yajnarad yajnavidhvamsi yajnesho yajnarakshakah
    | sahasrabahuh sarvatma sahasrakshah sahasrapat || 58|| sahasravadano nityah sahasratma virat svarat
    | sahasrashirsho vishvashca taijasah prajna atmavan || 59|| anurbrihatkrishah sthulo dirgho hrasvashca
    vamanah | sukshmah sukshmataro'nanto vishvarupo niranjanah || 60|| amritesho'mritaharo'mritadata'mritangavan
    | ahorupastriyama ca sandhyarupo dinatmakah || 61|| animesho nimeshatma kala kashtha kshanatmakah
    | muhurto ghatikarupo yamo yamatmakastatha || 62|| purvahnarupo madhyahnarupah sayahnarupakah | aparahno'tinipunah
    savanatma prajagarah || 63|| vedyo vedayita vedo vedadrishto vidam varah | vinayo nayaneta ca vidvajjanabahupriyah
    || 64|| vishvagopta vishvabhokta vishvakridvishvabheshajam | vishvambharo vishvapatirvishvaradvishvamohanah
    || 65|| vishvasakshi vishvahanta viro vishvambharadhipah | virabahurvirahanta viragryo virasainikah
    || 66|| viravadapriyah shura ekavirah suradhipah | shurapadmasuradveshi tarakasurabhanjanah || 67||
    taradhipastaraharah shurahanta'shvavahanah | sharabhah sharasambhutah shaktah sharavaneshayah || 68||
    shankarih shambhavah shambhuh sadhuh sadhujanapriyah | sarangah sarakah sarvah sharvah sharvajanapriyah
    || 69|| gangasuto'tigambhiro gambhirahridayo'naghah | amoghavikramashcakrashcakrabhuh shakrapujitah
    || 70|| cakrapanishcakrapatishcakravalantabhupatih | sarvabhaumassurapatih sarvalokadhirakshakah ||
    71|| sadhupah satyasankalpah satyassatyavatam varah | satyapriyah satyagatih satyalokajanapriyah ||
    72|| bhutabhavya bhavadrupo bhutabhavyabhavatprabhuh | bhutadirbhutamadhyastho bhutavidhvamsakarakah
    || 73|| bhutapratishthasankarta bhutadhishthanamavyayah | ojonidhirgunanidhistejorashirakalmashah
    || 74|| kalmashaghnah kalidhvamsi kalau varadavigrahah | kalyanamurtih kamatma kamakrodhavivarjitah
    || 75|| gopta gopayita guptirgunatito gunashrayah | satvamurti rajomurtistamomurtishcidatmakah ||
    76|| devasenapatirbhuma mahima mahimakarah | prakasharupah papaghnah pavanah pavano'nalah || 77||
    kailasanilayah kantah kanakacala karmukah | nirdhuto devabhutishca vyakritih kraturakshakah || 78||
    upendra indravandyanghrirurujangha urukramah | vikranto vijayakranto vivekavinayapradah || 79|| avinitajanadhvamsi
    sarvavagunavarjitah | kulashailaikanilayo vallivanchitavibhramah || 80|| shambhavah shambhutanayah
    shankarangavibhushanah | svayambhuh svavashah svasthah pushkarakshah purudbhavah || 81|| manurmanavagopta
    ca sthavishthah sthaviro yuva | balah shishurnityayuva nityakaumaravan mahan || 82|| agrahyarupo grahyashca
    sugrahah sundarakritih | pramardanah prabhutashrirlohitaksho'rimardanah || 83|| tridhama trikakuttrishrih
    trilokanilayo'layah | sharmadah sharmavan sharma sharanyah sharanalayah || 84|| sthanuh sthiratarah
    stheyan sthirashrih sthiravikramah | sthirapratijnah sthiradhirvishvaretah prajabhavah || 85|| atyayah
    pratyayah shreshthah sarvayogavinihsritah | sarvayogeshvarah siddhah sarvajnah sarvadarshanah || 86||
    vasurvasumana devo vasureta vasupradah | samatma samadarshi ca samadah sarvadarshanah || 87|| vrishakritirvrisharudho
    vrishakarma vrishapriyah | shucih shucimanah shuddhah shuddhakirtih shucishravah || 88|| raudrakarma
    maharaudro rudratma rudrasambhavah | anekamurtirvishvatma'nekabahurarindamah || 89|| virabahurvishvaseno
    vineyo vinayapradah |
  devanagari: ध्यायामीप्सित सिद्धिदं शिवसुतं स्कन्दं सुराराधितम् ॥ द्विषड्भुजं षण्मुखमम्बिकासुतं कुमारमादित्य
    सहस्रतेजसम् । वन्दे मयूरासनमग्निसम्भवं सेनान्यमध्याहमभीष्टसिद्धये ॥ अथ लमित्यादि पञ्चपूजा । लं पृथिव्यात्मने
    गन्धं कल्पयामि । हं आकाशात्मने पुष्पाणि कल्पयामि । यं वाय्वात्मने धूपं कल्पयामि । रं अग्न्यात्मने
    दीपं कल्पयामि । वं अमृतात्मने अमृतं महानैवेद्यं कल्पयामि । सं सर्वात्मने ताम्बूलादि सर्वोपचारपूजान्
    कल्पयामि ॥ अथ स्तोत्रम् । ॐ सुब्रह्मण्यः सुरेशानः सुरारिकुलनाशनः । ब्रह्मण्यो ब्रह्मविद् ब्रह्मा ब्रह्मविद्यागुरूर्गुरुः
    ॥ १॥ ईशानगुरुरव्यक्तो व्यक्तरूपः सनातनः । प्रधानपुरुषः कर्ता कर्म कार्यं च कारणम् ॥ २॥ अधिष्ठानं च
    विज्ञानं भोक्ता भोगश्च केवलः । अनादिनिधनः साक्षी नियन्ता नियमो यमः ॥ ३॥ वाक्पतिर्वाक्प्रदो वाग्मी
    वाच्यो वाग्वाचकस्तथा । पितामहगुरुर्लोकगुरुस्तत्वार्थबोधकः ॥ ४॥ प्रणवार्थोपदेष्टा चाप्यजो ब्रह्म सनातनः
    । वेदान्तवेद्यो वेदात्मा वेदादिर्वेदबोधकः ॥ ५॥ वेदान्तो वेदगुह्यश्च वेदशास्त्रार्थबोधकः । सर्वविद्यात्मकः
    शान्तश्चतुष्षष्टिकलागुरुः ॥ ६॥ मन्त्रार्थो मन्त्रमूर्तिश्च मन्त्रतन्त्रप्रवर्तकः । मन्त्री मन्त्रो
    मन्त्रबीजं महामन्त्रोपदेशकः ॥ ७॥ महोत्साहो महाशक्तिर्महाशक्तिधरः प्रभुः । जगत्स्रष्टा जगद्भर्ता जगन्मूर्तिर्जगन्मयः
    ॥ ८॥ जगदादिरनादिश्च जगद्बीजं जगद्गुरूः । ज्योतिर्मयः प्रशान्तात्मा सच्चिदानन्दविग्रहः ॥ ९॥ सुखमूर्तिः
    सुखकरः सुखी सुखकराकृतिः । ज्ञाता ज्ञेयो ज्ञानरूपो ज्ञप्तिर्ज्ञानबलं बुधः ॥ १०॥ विष्णुर्जिष्णुर्ग्रसिष्णुश्च
    प्रभविष्णुः सहिष्णुकः । वर्धिष्णुर्भूष्णुरजरस्तितिक्ष्णुः क्षान्तिरार्जवम् ॥ ११॥ ऋजुः सुगम्यःसुलभो
    दुर्लभो लाभ ईप्सितः । विज्ञो विज्ञानभोक्ता च शिवज्ञानप्रदायकः ॥ १२॥ महदादिरहङ्कारो भूतादिर्भूतभावनः
    । भूतभव्य भविष्यच्च भूत भव्यभवत्प्रभुः ॥ १३॥ देवसेनापतिर्नेता कुमारो देवनायकः । तारकारिर्महावीर्यः
    सिंहवक्त्रशिरोहरः ॥ १४॥ अनेककोटिब्रह्माण्ड परिपूर्णासुरान्तकः । सुरानन्दकरः श्रीमानसुरादिभयङ्करः ॥
    १५॥ असुरान्तः पुराक्रन्दकरभेरीनिनादनः । सुरवन्द्यो जनानन्दकरशिञ्जन्मणिध्वनिः ॥ १६॥ स्फुटाट्टहाससङ्क्षुभ्यत्तारकासुरमानसः
    । महाक्रोधो महोत्साहो महाबलपराक्रमः ॥ १७॥ महाबुद्धिर्महाबाहुर्महामायो महाधृतिः । रणभीमः शत्रुहरो धीरोदात्तगुणोत्तरः
    ॥ १८॥ महाधनुर्महाबाणो महादेवप्रियात्मजः । महाखड्गो महाखेटो महासत्वो महाद्युतिः ॥ १९॥ महर्धिश्च महामायी
    मयूरवरवाहनः । मयूरबर्हातपत्रो मयूरनटनप्रियः ॥ २०॥ महानुभावोऽमेयात्माऽमेयश्रीश्च महाप्रभुः । सुगुणो
    दुर्गुणद्वेषी निर्गुणो निर्मलोऽमलः ॥ २१॥ सुबलो विमलः कान्तः कमलासन पूजितः । कालः कमलपत्राक्षः कलिकल्मषनाशनः
    ॥ २२॥ महारणो महायोद्धा महायुद्धप्रियोऽभयः । महारथो महाभागो भक्ताभीष्टफलप्रदः ॥ २३॥ भक्तप्रियः प्रियः
    प्रेम प्रेयान् प्रीतिधरः सखा । गौरीकरसरोजाग्र लालनीय मुखाम्बुजः ॥ २४॥ कृत्तिकास्तन्यपानैकव्यग्रषड्वदनाम्बुजः
    । चन्द्रचूडाङ्गभूभाग विहारणविशारदः ॥ २५॥ ईशाननयनानन्दकन्दलावण्यनासिकः । चन्द्रचूडकराम्भोज परिमृष्टभुजावलिः
    ॥ २६॥ लम्बोदर सहक्रीडा लम्पटः शरसम्भवः । अमरानननालीक चकोरीपूर्ण चन्द्रमाः ॥ २७॥ सर्वाङ्ग सुन्दरः श्रीशः
    श्रीकरः श्रीप्रदः शिवः । वल्लीसखो वनचरो वक्ता वाचस्पतिर्वरः ॥ २८॥ चन्द्रचूडो बर्हिपिञ्छ शेखरो मकुटोज्ज्वलः
    । गुडाकेशः सुवृत्तोरुशिरा मन्दारशेखरः ॥ २९॥ बिम्बाधरः कुन्ददन्तो जपाशोणाग्रलोचनः । षड्दर्शनीनटीरङ्गरसनो
    मधुरस्वनः ॥ ३०॥ मेघगम्भीरनिर्घोषः प्रियवाक् प्रस्फुटाक्षरः । स्मितवक्त्रश्चोत्पलाक्षश्चारुगम्भीरवीक्षणः
    ॥ ३१॥ कर्णान्तदीर्घनयनः कर्णभूषण भूषितः । सुकुण्डलश्चारुगण्डः कम्बुग्रीवो महाहनुः ॥ ३२॥ पीनांसो गूढजत्रुश्च
    पीनवृत्तभुजावलिः । रक्ताङ्गो रत्नकेयूरो रत्नकङ्कणभूषितः॥ ३३॥ ज्याकिणाङ्क लसद्वामप्रकोष्ठवलयोज्ज्वलः
    । रेखाङ्कुशध्वजच्छत्रपाणिपद्मो महायुधः ॥ ३४॥ सुरलोक भयध्वान्त बालारुणकरोदयः । अङ्गुलीयकरत्नांशु द्विगुणोद्यन्नखाङ्कुरः
    ॥ ३५॥ पीनवक्षा महाहारो नवरत्नविभूषणः । हिरण्यगर्भो हेमाङ्गो हिरण्यकवचो हरः ॥ ३६॥ हिरण्मय शिरस्त्राणो
    हिरण्याक्षो हिरण्यदः । हिरण्यनाभिस्त्रिवली ललितोदरसुन्दरः ॥ ३७॥ सुवर्णसूत्रविलसद्विशङ्कटकटीतटः । पीताम्बरधरो
    रत्नमेखलावृत मध्यकः ॥ ३८॥ पीवरालोमवृत्तोद्यत्सुजानुर्गुप्तगुल्फकः । शङ्खचक्राब्जकुलिशध्वजरेखाङ्घ्रिपङ्कजः
    ॥ ३९॥ नवरत्नोज्ज्वलत्पादकटकः परमायुधः । सुरेन्द्रमकुटप्रोद्यन्मणि रञ्जितपादुकः ॥ ४०॥ पूज्याङ्घ्रिश्चारुनखरो
    देवसेव्यस्वपादुकः । पार्वतीपाणि कमलपरिमृष्टपदाम्बुजः ॥ ४१॥ मत्तमातङ्ग गमनो मान्यो मान्यगुणाकरः । क्रौञ्च
    दारणदक्षौजाः क्षणः क्षणविभागकृत् ॥ ४२॥ सुगमो दुर्गमो दुर्गो दुरारोहोऽरिदुः सहः । सुभगः सुमुखः सूर्यः
    सूर्यमण्डलमध्यगः ॥ ४३॥ स्वकिङ्करोपसंसृष्टसृष्टिसंरक्षिताखिलः । जगत्स्रष्टा जगद्भर्ता जगत्संहारकारकः
    ॥ ४४॥ स्थावरो जङ्गमो जेता विजयो विजयप्रदः । जयशीलो जितारातिर्जितमायो जितासुरः ॥ ४५॥ जितकामो जितक्रोधो
    जितमोहस्सुमोहनः । कामदः कामभृत्कामी कामरूपः कृतागमः ॥ ४६॥ कान्तः कल्यः कलिध्वंसी कल्हारकुसुमप्रियः
    । रामो रमयिता रम्यो रमणीजनवल्लभः ॥ ४७॥ रसज्ञो रसमूर्तिश्च रसो नवरसात्मकः । रसात्मा रसिकात्मा च रासक्रीडापरो
    रतिः ॥ ४८॥ सूर्यकोटिप्रतीकाशः सोमसूर्याग्निलोचनः । कलाभिज्ञः कलारूपी कलापी सकलप्रभुः ॥ ४९॥ बिन्दुर्नादः
    कलामूर्तिः कलातीतोऽक्षरात्मकः । मात्राकारः स्वराकारः एकमात्रो द्विमात्रकः ॥ ५०॥ त्रिमात्रकश्चतुर्मात्रो
    व्यक्तः सन्ध्यक्षरात्मकः । व्यञ्जनात्मा वियुक्तात्मा संयुक्तात्मा स्वरात्मकः ॥ ५१॥ विसर्जनीयोऽनुस्वारः
    सर्ववर्णतनुर्महान् । अकारात्माऽप्युकारात्मा मकारात्मा त्रिवर्णकः ॥ ५२॥ ओङ्कारोऽथ वषट्कारः स्वाहाकारः
    स्वधाकृतिः । आहुतिर्हवनं हव्यं होताऽध्वर्युर्महाहविः ॥ ५३॥ ब्रह्मोद्गाता सदस्यश्च बर्हिरिध्मं समिच्चरुः
    । कव्यं पशुः पुरोडाशः आमिक्षा वाजवाजिनम् ॥ ५४॥ पवनः पावनः पूतः पवमानः पराकृतिः । पवित्रं परिधिः पूर्णपात्रमुद्भूतिरिन्धनम्
    ॥ ५५॥ विशोधनं पशुपतिः पशुपाशविमोचकः । पाकयज्ञो महायज्ञो यज्ञो यज्ञपतिर्यजुः ॥ ५६॥ यज्ञाङ्गो यज्ञगम्यश्च
    यज्वा यज्ञफलप्रदः । यज्ञाङ्गभूर्यज्ञपतिर्यज्ञश्रीर्यज्ञवाहनः ॥ ५७॥ यज्ञराड् यज्ञविध्वंसी यज्ञेशो यज्ञरक्षकः
    । सहस्रबाहुः सर्वात्मा सहस्राक्षः सहस्रपात् ॥ ५८॥ सहस्रवदनो नित्यः सहस्रात्मा विराट् स्वराट् । सहस्रशीर्षो
    विश्वश्च तैजसः प्राज्ञ आत्मवान् ॥ ५९॥ अणुर्बृहत्कृशः स्थूलो दीर्घो ह्रस्वश्च वामनः । सूक्ष्मः सूक्ष्मतरोऽनन्तो
    विश्वरूपो निरञ्जनः ॥ ६०॥ अमृतेशोऽमृताहारोऽमृतदाताऽमृताङ्गवान् । अहोरूपस्त्रियामा च सन्ध्यारूपो दिनात्मकः
    ॥ ६१॥ अनिमेषो निमेषात्मा कला काष्ठा क्षणात्मकः । मुहूर्तो घटिकारूपो यामो यामात्मकस्तथा ॥ ६२॥ पूर्वाह्णरूपो
    मध्याह्नरूपः सायाह्नरूपकः । अपराह्णोऽतिनिपुणः सवनात्मा प्रजागरः ॥ ६३॥ वेद्यो वेदयिता वेदो वेददृष्टो
    विदां वरः । विनयो नयनेता च विद्वज्जनबहुप्रियः ॥ ६४॥ विश्वगोप्ता विश्वभोक्ता विश्वकृद्विश्वभेषजम् ।
    विश्वम्भरो विश्वपतिर्विश्वराड्विश्वमोहनः ॥ ६५॥ विश्वसाक्षी विश्वहन्ता वीरो विश्वम्भराधिपः । वीरबाहुर्वीरहन्ता
    वीराग्र्यो वीरसैनिकः ॥ ६६॥ वीरवादप्रियः शूर एकवीरः सुराधिपः । शूरपद्मासुरद्वेषी तारकासुरभञ्जनः ॥ ६७॥
    ताराधिपस्तारहारः शूरहन्ताऽश्ववाहनः । शरभः शरसम्भूतः शक्तः शरवणेशयः ॥ ६८॥ शाङ्करिः शाम्भवः शम्भुः साधुः
    साधुजनप्रियः । साराङ्गः सारकः सर्वः शार्वः शार्वजनप्रियः ॥ ६९॥ गङ्गासुतोऽतिगम्भीरो गम्भीरहृदयोऽनघः
    । अमोघविक्रमश्चक्रश्चक्रभूः शक्रपूजितः ॥ ७०॥ चक्रपाणिश्चक्रपतिश्चक्रवालान्तभूपतिः । सार्वभौमस्सुरपतिः
    सर्वलोकाधिरक्षकः ॥ ७१॥ साधुपः सत्यसङ्कल्पः सत्यस्सत्यवतां वरः । सत्यप्रियः सत्यगतिः सत्यलोकजनप्रियः
    ॥ ७२॥ भूतभव्य भवद्रूपो भूतभव्यभवत्प्रभुः । भूतादिर्भूतमध्यस्थो भूतविध्वंसकारकः ॥ ७३॥ भूतप्रतिष्ठासङ्कर्ता
    भूताधिष्ठानमव्ययः । ओजोनिधिर्गुणनिधिस्तेजोराशिरकल्मषः ॥ ७४॥ कल्मषघ्नः कलिध्वंसी कलौ वरदविग्रहः । कल्याणमूर्तिः
    कामात्मा कामक्रोधविवर्जितः ॥ ७५॥ गोप्ता गोपायिता गुप्तिर्गुणातीतो गुणाश्रयः । सत्वमूर्ती रजोमूर्तिस्तमोमूर्तिश्चिदात्मकः
    ॥ ७६॥ देवसेनापतिर्भूमा महिमा महिमाकरः । प्रकाशरूपः पापघ्नः पवनः पावनोऽनलः ॥ ७७॥ कैलासनिलयः कान्तः
    कनकाचल कार्मुकः । निर्धूतो देवभूतिश्च व्याकृतिः क्रतुरक्षकः ॥ ७८॥ उपेन्द्र इन्द्रवन्द्याङ्घ्रिरुरुजङ्घ
    उरुक्रमः । विक्रान्तो विजयक्रान्तो विवेकविनयप्रदः ॥ ७९॥ अविनीतजनध्वंसी सर्वावगुणवर्जितः । कुलशैलैकनिलयो
    वल्लीवाञ्छितविभ्रमः ॥ ८०॥ शाम्भवः शम्भुतनयः शङ्कराङ्गविभूषणः । स्वयम्भूः स्ववशः स्वस्थः पुष्कराक्षः
    पुरूद्भवः ॥ ८१॥ मनुर्मानवगोप्ता च स्थविष्ठः स्थविरो युवा । बालः शिशुर्नित्ययुवा नित्यकौमारवान् महान्
    ॥ ८२॥ अग्राह्यरूपो ग्राह्यश्च सुग्रहः सुन्दराकृतिः । प्रमर्दनः प्रभूतश्रीर्लोहिताक्षोऽरिमर्दनः ॥ ८३॥
    त्रिधामा त्रिककुत्त्रिश्रीः त्रिलोकनिलयोऽलयः । शर्मदः शर्मवान् शर्म शरण्यः शरणालयः ॥ ८४॥ स्थाणुः स्थिरतरः
    स्थेयान् स्थिरश्रीः स्थिरविक्रमः । स्थिरप्रतिज्ञः स्थिरधीर्विश्वरेताः प्रजाभवः ॥ ८५॥ अत्ययः प्रत्ययः
    श्रेष्ठः सर्वयोगविनिःसृतः । सर्वयोगेश्वरः सिद्धः सर्वज्ञः सर्वदर्शनः ॥ ८६॥ वसुर्वसुमना देवो वसुरेता
    वसुप्रदः । समात्मा समदर्शी च समदः सर्वदर्शनः ॥ ८७॥ वृषाकृतिर्वृषारूढो वृषकर्मा वृषप्रियः । शुचिः शुचिमनाः
    शुद्धः शुद्धकीर्तिः शुचिश्रवाः ॥ ८८॥ रौद्रकर्मा महारौद्रो रुद्रात्मा रुद्रसम्भवः । अनेकमूर्तिर्विश्वात्माऽनेकबाहुररिन्दमः
    ॥ ८९॥ वीरबाहुर्विश्वसेनो विनेयो विनयप्रदः ।
