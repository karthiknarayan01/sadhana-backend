id: vishnukritam2shivastotram
category: stotram
name:
  english: vishnukritam2shivastotram
  devanagari: विष्णुकृतं२शिवस्तोत्रम्
content:
  english: vishnukritam 2 shivastotram vishnuruvaca | devadhisha maheshana dinabandho kripakara | prasida
    parameshana kripam kuru natapriya || 27|| nirgunaya namastubhyam punashca sagunaya ca | punah prakritirupaya
    punashca purushaya ca || 28|| pashcadgunasvarupaya namo vishvatmane namah | bhaktipriyaya shantaya
    shivaya paramatmane || 29|| sadashivaya rudraya jagatam pataye namah | tvayi bhaktirdridha me'dya
    varddhamana bhavatviti || 5
  devanagari: विष्णुकृतं २ शिवस्तोत्रम् विष्णुरुवाच । देवाधीश महेशान दीनबन्धो कृपाकर । प्रसीद परमेशान
    कृपां कुरु नतप्रिय ॥ २७॥ निर्गुणाय नमस्तुभ्यं पुनश्च सगुणाय च । पुनः प्रकृतिरूपाय पुनश्च पुरुषाय च
    ॥ २८॥ पश्चाद्गुणस्वरूपाय नमो विश्वात्मने नमः । भक्तिप्रियाय शान्ताय शिवाय परमात्मने ॥ २९॥ सदाशिवाय
    रुद्राय जगतां पतये नमः । त्वयि भक्तिर्दृढा मेऽद्य वर्द्धमाना भवत्विति ॥ ५
meaning: {}
