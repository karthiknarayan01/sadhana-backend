id: balatripurasundarisahasranamastotra-2
category: sahasranama
name:
  english: balatripurasundarisahasranamastotra 2
  devanagari: बालात्रिपुरसुन्दरीसहस्रनामस्तोत्र २
content:
  english: '| ityetatkathitam divyam paramanandakaranam || 164|| lavanyasindhulaharibalayastoshamandiram
    | sahasranama tantranam saramakrishya parvati || 165|| anena stuvato nityamardharatre nishamukhe |
    pratah kale ca pujayam sarvakalamatah priye || 166|| sarvasamrajyasukhada bala ca paritushyati | ratnani
    vividhanyasya vittani pracurani ca || 167|| manorathapathasthani dadati parameshvari | putrah pautrashca
    vardhante santatih sarvakaliki || 168|| shatravastasya nashyanti vardhante''sya balani ca | vyadhayastasya
    durasthah sakalanyaushadhani ca || 169|| mandirani vicitrani rajante tasya sarvada | krishih phalavati
    tasya bhumih kamadugha''vyaya || 170|| sphito janapadastasya rajyam tasya niritikam | matangah pakshinastungah
    sincanto madavaribhih || 171|| dvare tasya virajante hrishta nagaturangamah | prajastasya virajante
    nirvivadashca mantrinah || 172|| jnatayastasya tushyanti shilam tasyatisundaram | lakshmistasya vashe
    nityam svasana ca manorama || 173|| gadyapadyamayi vani tasya gangatarangavat | nanapadapadarthanam
    vadacaturyasambhrita || 174|| samagrarasasampattishalini lasyamalini | adrishtanyapi shastrani prakashyante
    nirantaram || 175|| nigrahah paravakyanam sabhayam tasya jayate | stuvanti vandinastam vai rajano
    dasavattatha || 176|| shastranyastrani tadange janayanti rujam na hi | mahilastasya vashagah sarvavastha
    bhavanti vai || 177|| visham nirvishatam yati paniyamamritam bhavet | parapakshastambhanam ca pratipakshasya
    jrimbhanam || 178|| navaratrena jayeta sa tadabhyasayogavit | ahoratram pathedyastu nistandrah shantamanasah
    || 179|| vashe tasya praja yati sarve lokah sunishcitam | shanmasabhyasayogena yogamayati nishcitam
    || 180|| nityam kamakalam dhyayan yah pathet stotramuttamam | madanonmadakalitah puranghryastadvashanugah
    || 181|| lavanyamadanah sakshadvaidagdhyamuditekshanah | premapurnamapi vashe hyurvashim sa hi vindati
    || 182|| bhurjapatre rocanaya kunkumena shubhe dine | laksharasadravenapi yavakairva visheshatah ||
    183|| dhaturagena va devi likhitam yantramancitam | suvarnaraupyagarbhastham susamputam susadhitam
    || 184|| balabud'
  devanagari: । इत्येतत्कथितं दिव्यं परमानन्दकारणम् ॥ १६४॥ लावण्यसिन्धुलहरीबालायास्तोषमन्दिरम् । सहस्रनाम
    तन्त्राणां सारमाकृष्य पार्वति ॥ १६५॥ अनेन स्तुवतो नित्यमर्धरात्रे निशामुखे । प्रातः काले च पूजायां
    सर्वकालमतः प्रिये ॥ १६६॥ सर्वसाम्राज्यसुखदा बाला च परितुष्यति । रत्नानि विविधान्यस्य वित्तानि प्रचुराणि
    च ॥ १६७॥ मनोरथपथस्थानि ददाति परमेश्वरी । पुत्राः पौत्राश्च वर्धन्ते सन्ततिः सार्वकालिकी ॥ १६८॥ शत्रवस्तस्य
    नश्यन्ति वर्धन्तेऽस्य बलानि च । व्याधयस्तस्य दूरस्थाः सकलान्यौषधानि च ॥ १६९॥ मन्दिराणि विचित्राणि
    राजन्ते तस्य सर्वदा । कृषिः फलवती तस्य भूमिः कामदुघाऽव्यया ॥ १७०॥ स्फीतो जनपदस्तस्य राज्यं तस्य निरीतिकम्
    । मातङ्गाः पक्षिणस्तुङ्गाः सिञ्चन्तो मदवारिभिः ॥ १७१॥ द्वारे तस्य विराजन्ते हृष्टा नागतुरङ्गमाः ।
    प्रजास्तस्य विराजन्ते निर्विवादाश्च मन्त्रिणः ॥ १७२॥ ज्ञातयस्तस्य तुष्यन्ति शीलं तस्यातिसुन्दरम् ।
    लक्ष्मीस्तस्य वशे नित्यं स्वासना च मनोरमा ॥ १७३॥ गद्यपद्यमयी वाणी तस्य गङ्गातरङ्गवत् । नानापदपदार्थानां
    वादचातुर्यसम्भृता ॥ १७४॥ समग्ररससम्पत्तिशालिनी लास्यमालिनी । अदृष्टान्यपि शास्त्राणी प्रकाश्यन्ते
    निरन्तरम् ॥ १७५॥ निग्रहः परवाक्यानां सभायां तस्य जायते । स्तुवन्ति वन्दिनस्तं वै राजानो दासवत्तथा
    ॥ १७६॥ शस्त्राण्यस्त्राणि तदङ्गे जनयन्ति रुजां न हि । महिलास्तस्य वशगाः सर्वावस्था भवन्ति वै ॥ १७७॥
    विषं निर्विषतां याति पानीयममृतं भवेत् । परपक्षस्तम्भनं च प्रतिपक्षस्य जृम्भणम् ॥ १७८॥ नवरात्रेण जायेत
    स तदभ्यासयोगवित् । अहोरात्रं पठेद्यस्तु निस्तन्द्रः शान्तमानसः ॥ १७९॥ वशे तस्य प्रजा याति सर्वे लोकाः
    सुनिश्चितम् । षण्मासाभ्यासयोगेन योगमायाति निश्चितम् ॥ १८०॥ नित्यं कामकलां ध्यायन् यः पठेत् स्तोत्रमुत्तमम्
    । मदनोन्मादकलिताः पुरन्घ्र्यास्तद्वशानुगाः ॥ १८१॥ लावण्यमदनाः साक्षाद्वैदग्ध्यमुदितेक्षणाः । प्रेमपूर्णामपि
    वशे ह्युर्वशीं स हि विन्दति ॥ १८२॥ भूर्जपत्रे रोचनया कुङ्कुमेन शुभे दिने । लाक्षारसद्रवेणापि यावकैर्वा
    विशेषतः ॥ १८३॥ धातुरागेण वा देवि लिखितं यन्त्रमञ्चितम् । सुवर्णरौप्यगर्भस्थं सुसम्पूतं सुसाधितम् ॥
    १८४॥ बालाबुद्
