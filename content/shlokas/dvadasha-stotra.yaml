id: dvadasha-stotra
category: stotram
name:
  english: dvadasha stotra
  devanagari: द्वादश स्तोत्र
content:
  english: kenapi na kvapi hi pratyayo yadguneshuttamanam parah | satyasankalpa eko varenyo vashi matyanunaih
    sada vedavadoditah | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam || 5|| pashyatam
    duhkhasantananirmulanam drishyatam drishyatamityajesharcitam | nashyatam duragam sarvadapya'tmagam
    vashyatam svecchaya sajjaneshvagatam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || 6|| agrajam yah sasarjajamagryakritim vigraho yasya sarve guna eva hi | ugra adyo'pi yasyatmajagryatmajah
    sadgrihitah sada yah param daivatam | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || 7|| acyuto yo gunairnityamevakhilaih pracyuto'sheshadoshaih sada purtitah | ucyate sarvavedoruvadairajah
    svarcito brahmarudrendrapurvaih sada | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || 8|| dharyate yena vishvam sadajadikam varyate'sheshaduhkham nijadhyayinam | paryate sarvamanyairnayatparyate
    karyate cakhilam sarvabhutaih sada | prinayamo vasudevam devatamandalakhandamandanam prinayamo vasudevam
    || 9|| sarvapapaniyatsamsmriteh sankshayam sarvada yanti bhaktya vishuddhatmanam | sharvagurvadigirvana
    samsthanadah kurvate karma yatpritaye sajjanah | prinayamo vasudevam devatamandalakhandamandanam prinayamo
    vasudevam || 10|| akshayam karma yasmin pare svarpitam prakshayam yanti duhkhani yannamatah | aksharo
    yo'jarah sarvadaivamritah kukshigam yasya vishvam sada'jadikam | prinayamo vasudevam devatamandalakhandamandanam
    prinayamo vasudevam || 11|| nanditirthorusannamino nandinah sandadhanah sadanandadeve matim | mandahasaruna
    pangadattonnatim vanditasheshadevadivrindam sada | prinayamo vasudevam devatamandalakhandamandanam
    prinayamo vasudevam || 12|| iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu ashtamastotram
    sampurnam atha navamastotram atimatatamogirisamitivibhedana pitamahabhutida gunagananilaya | shubhatama
    kathashaya paramasadodita jagadekakarana ramaramaramana || 1|| vidhibhavamukhasurasatatasuvanditaramamanovallabha
    bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || 2|| aganitagunaganamayasharira
    he vigatagunetara bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana
    || 3|| aparimitasukhanidhivimalasudeha he vigata sukhetara bhava mama sharanam | shubhatama kathashaya
    paramasadodita jagadekakarana ramaramaramana || 4|| pracalitalayajalaviharana shashvatasukhamayamina
    he bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || 5||
    suraditijasubalaviluḻitamandaradhara para kurma he bhava mama sharanam | shubhatama kathashaya paramasadodita
    jagadekakarana ramaramaramana || 6|| sagirivaradharataḻavaha susukaraparamavibodha he bhava mama sharanam
    | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || 7|| atibaladitisuta hridaya
    vibhedana jayanrihare'mala bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana
    ramaramaramana || 8|| balimukhaditisutavijayavinashana jagadavanajita bhava mama sharanam | shubhatama
    kathashaya paramasadodita jagadekakarana ramaramaramana || 9|| avijitakunripatisamitivikhandana ramavara
    virapa bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana ||
    10|| kharataranishicaradahana paramrita raghuvara manada bhava mama sharanam | shubhatama kathashaya
    paramasadodita jagadekakarana ramaramaramana || 11|| sulalitatanuvara varada mahabala yaduvara parthapa
    bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || 12|| ditisutavimohana
    vimalavibodhana paragunabuddha he bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana
    ramaramaramana || 13|| kalimalahutavaha subhaga mahotsava sharanada kalkisha bhava mama sharanam |
    shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana || 14|| akhilajanivilaya parasukhakarana
    parapurushottama bhava mama sharanam | shubhatama kathashaya paramasadodita jagadekakarana ramaramaramana
    || 15|| iti tava nutivarasatataraterbhava susharanamurusukhatirthamuneh bhagavan | shubhatama kathashaya
    paramasadodita jagadekakarana ramaramaramana || 16|| iti shrimadanandatirthabhagavatpadacarya viracitam
    dvadashastotreshu navamastotram sampurnam atha dashamastotram ava nah shripatirapratiradhikeshadibhavade
    | karunapurnavarapradacaritam jnapaya me te || 1|| suravandyadhipa sadvarabharitasheshagunalam | karunapurnavarapradacaritam
    jnapaya me te || 2|| sakaladhvantavinashana
  devanagari: केनापि न क्वापि हि प्रत्ययो यद्गुणेषूत्तमानां परः । सत्यसङ्कल्प एको वरेण्यो वशी मत्यनूनैः
    सदा वेदवादोदितः । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ५॥ पश्यतां दुःखसन्ताननिर्मूलनं
    दृश्यतां दृश्यतामित्यजेशार्चितम् । नश्यतां दूरगं सर्वदाप्याऽत्मगं वश्यतां स्वेच्छया सज्जनेष्वागतम्
    । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ६॥ अग्रजं यः ससर्जाजमग्र्याकृतिं
    विग्रहो यस्य सर्वे गुणा एव हि । उग्र आद्योऽपि यस्यात्मजाग्र्यात्मजः सद्गृहीतः सदा यः परं दैवतम् ।
    प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ७॥ अच्युतो यो गुणैर्नित्यमेवाखिलैः
    प्रच्युतोऽशेषदोषैः सदा पूर्तितः । उच्यते सर्ववेदोरुवादैरजः स्वर्चितो ब्रह्मरुद्रेन्द्रपूर्वैः सदा
    । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ ८॥ धार्यते येन विश्वं सदाजादिकं वार्यतेऽशेषदुःखं
    निजध्यायिनाम् । पार्यते सर्वमन्यैर्नयत्पार्यते कार्यते चाखिलं सर्वभूतैः सदा । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं
    प्रीणयामो वासुदेवम् ॥ ९॥ सर्वपापानियत्संस्मृतेः सङ्क्षयं सर्वदा यान्ति भक्त्या विशुद्धात्मनाम् । शर्वगुर्वादिगीर्वाण
    संस्थानदः कुर्वते कर्म यत्प्रीतये सज्जनाः । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम्
    ॥ १०॥ अक्षयं कर्म यस्मिन् परे स्वर्पितं प्रक्षयं यान्ति दुःखानि यन्नामतः । अक्षरो योऽजरः सर्वदैवामृतः
    कुक्षिगं यस्य विश्वं सदाऽजादिकम् । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥
    ११॥ नन्दितीर्थोरुसन्नामिनो नन्दिनः सन्दधानाः सदानन्ददेवे मतिम् । मन्दहासारुणा पाङ्गदत्तोन्नतिं वन्दिताशेषदेवादिवृन्दं
    सदा । प्रीणयामो वासुदेवं देवतामण्डलाखण्डमण्डनं प्रीणयामो वासुदेवम् ॥ १२॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य
    विरचितं द्वादशस्तोत्रेषु अष्टमस्तोत्रं सम्पूर्णम् अथ नवमस्तोत्रम् अतिमततमोगिरिसमितिविभेदन पितामहभूतिद
    गुणगणनिलय । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ १॥ विधिभवमुखसुरसततसुवन्दितरमामनोवल्लभ भव मम
    शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ २॥ अगणितगुणगणमयशरीर हे विगतगुणेतर भव मम शरणम्
    । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ३॥ अपरिमितसुखनिधिविमलसुदेह हे विगत सुखेतर भव मम शरणम्
    । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ४॥ प्रचलितलयजलविहरण शाश्वतसुखमयमीन हे भव मम शरणम् ।
    शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ५॥ सुरदितिजसुबलविलुळितमन्दरधर पर कूर्म हे भव मम शरणम्
    । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ६॥ सगिरिवरधरातळवह सुसूकरपरमविबोध हे भव मम शरणम् । शुभतम
    कथाशय परमसदोदित जगदेककारण रामरमारमण ॥ ७॥ अतिबलदितिसुत हृदय विभेदन जयनृहरेऽमल भव मम शरणम् । शुभतम कथाशय
    परमसदोदित जगदेककारण रामरमारमण ॥ ८॥ बलिमुखदितिसुतविजयविनाशन जगदवनाजित भव मम शरणम् । शुभतम कथाशय परमसदोदित
    जगदेककारण रामरमारमण ॥ ९॥ अविजितकुनृपतिसमितिविखण्डन रमावर वीरप भव मम शरणम् । शुभतम कथाशय परमसदोदित
    जगदेककारण रामरमारमण ॥ १०॥ खरतरनिशिचरदहन परामृत रघुवर मानद भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण
    रामरमारमण ॥ ११॥ सुललिततनुवर वरद महाबल यदुवर पार्थप भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण
    ॥ १२॥ दितिसुतविमोहन विमलविबोधन परगुणबुद्ध हे भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण
    ॥ १३॥ कलिमलहुतवह सुभग महोत्सव शरणद कल्कीश भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण
    ॥ १४॥ अखिलजनिविलय परसुखकारण परपुरुषोत्तम भव मम शरणम् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण ॥
    १५॥ इति तव नुतिवरसततरतेर्भव सुशरणमुरुसुखतीर्थमुनेः भगवन् । शुभतम कथाशय परमसदोदित जगदेककारण रामरमारमण
    ॥ १६॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु नवमस्तोत्रं सम्पूर्णम् अथ दशमस्तोत्रम्
    अव नः श्रीपतिरप्रतिरधिकेशादिभवादे । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ १॥ सुरवन्द्याधिप सद्वरभरिताशेषगुणालम्
    । करुणापूर्णवरप्रदचरितं ज्ञापय मे ते ॥ २॥ सकलध्वान्तविनाशन
