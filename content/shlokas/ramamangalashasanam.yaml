id: ramamangalashasanam
category: stotram
name:
  english: ramamangalashasanam
  devanagari: राममन्गलाशासनम्
content:
  english: gridhrarajaya bhaktaya muktidayastu mangalam || 7|| sadaram shabaridattaphalamulabhilashine
    | saulabhyaparipurnaya sattvodriktaya mangalam || 8|| hanumatsamavetaya harishabhishtadayine | valipramathanayastu
    mahadhiraya mangalam || 9|| shrimate raghuviraya setullanghitasindhave | jitarakshasarajaya ranadhiraya
    mangalam || 10|| vibhishanakrite pritya lankabhishtapradayine | sarvalokasharanyaya shriraghavaya
    mangalam || 11|| asadya nagarim divyamabhishiktaya sitaya | rajadhirajarajaya ramabhadraya mangalam
    || 12|| brahmadidevasevyaya brahmanyaya mahatmane | janakiprananathaya raghunathaya mangalam || 13||
    shrisaumyajamatrimuneh kripayasmanupeyushe | mahate mama nathaya raghunathaya mangalam || 14|| mangalashasanaparairmadacaryapurogamaih
    | sarvaishca purvairacaryah satkritayastu mangalam || 15|| ramyajamatrimunina mangalashasanam kritam
    | trailokyadhipatih shriman karotu mangalam sada || 16|| || iti shrivaravaramunisvamikritashriramamangalashasanam
    sampurnam ||
  devanagari: गृध्रराजाय भक्ताय मुक्तिदायास्तु मङ्गलम् ॥ ७॥ सादरं शबरीदत्तफलमूलाभिलाषिणे । सौलभ्यपरिपूर्णाय
    सत्त्वोद्रिक्ताय मङ्गलम् ॥ ८॥ हनुमत्समवेताय हरीशाभीष्टदायिने । वालिप्रमथानायास्तु महाधीराय मङ्गलम्
    ॥ ९॥ श्रीमते रघुवीराय सेतूल्लङ्घितसिन्धवे । जितराक्षसराजाय रणधीराय मङ्गलम् ॥ १०॥ विभीषणकृते प्रीत्या
    लङ्काभीष्टप्रदायिने । सर्वलोकशरण्याय श्रीराघवाय मङ्गलम् ॥ ११॥ आसाद्य नगरीं दिव्यामभिषिक्ताय सीतया
    । राजाधिराजराजाय रामभद्राय मङ्गलम् ॥ १२॥ ब्रह्मादिदेवसेव्याय ब्रह्मण्याय महात्मने । जानकीप्राणनाथाय
    रघुनाथाय मङ्गलम् ॥ १३॥ श्रीसौम्यजामातृमुनेः कृपयास्मानुपेयुषे । महते मम नाथाय रघुनाथाय मङ्गलम् ॥ १४॥
    मङ्गलाशासनपरैर्मदाचार्यपुरोगमैः । सर्वैश्च पूर्वैराचार्यः सत्कृतायास्तु मङ्गलम् ॥ १५॥ रम्यजामातृमुनिना
    मङ्गलाशासनं कृतम् । त्रैलोक्याधिपतिः श्रीमान् करोतु मङ्गलं सदा ॥ १६॥ ॥ इति श्रीवरवरमुनिस्वामिकृतश्रीराममङ्गलाशासनं
    सम्पूर्णम् ॥
