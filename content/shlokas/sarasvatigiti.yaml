id: sarasvatigiti
category: stotram
name:
  english: sarasvatigiti
  devanagari: सरस्वतिगिति
content:
  english: shrisarasvatigitih shri ganeshaya namah | ehi lasatsitashatadalavasini bharati mamakamasyam
    | dehi ca me tvadamaranikararcitapadatale nijadasyam || dhruvam || || 1|| jagadaghaharini madhuripujaye
    himagirijitvarasitatamakaye | shrutitatisamskritapadakamaladritamiha bhuvi nanyadupasyam | bharati
    mamakamasyam || 2|| jadatarajivanamahaha madiyam shrutivirahanna hi nrishu gananiyam | niravadhi kripam
    kurushva dayamayi vyapagacchenmama dasyam | bharati mamakamasyam || 3|| vikasitanilajalajakulavase
    vihitabrihaspatisamanijadase | janani krishodari mama rasanopari viracaya shashvatahasyam | bharati
    mamakamasyam || 4|| bhavamukhabhavitabhavadavadanam racayatu manasamavirataganam | nipatatu te mayi
    drigayi dayamayi kimaparamatmajabhashyam | bharati mamakamasyam || 5|| || iti shrisarasvatigitih sampurnam
    ||
  devanagari: श्रीसरस्वतीगीतिः श्री गणेशाय नमः । एहि लसत्सितशतदलवासिनि भारति मामकमास्यम् । देहि च मे त्वदमरनिकरार्चितपादतले
    निजदास्यम् ॥ ध्रुवम् ॥ ॥ १॥ जगदघहारिणि मधुरिपुजाये हिमगिरिजित्वरसिततमकाये । श्रुतिततिसंस्कृतपदकमलादृतमिह
    भुवि नान्यदुपास्यम् । भारति मामकमास्यम् ॥ २॥ जडतरजीवनमहह मदीयं श्रुतिविरहान्न हि नृषु गणनीयम् । निरवधि
    कृपां कुरुष्व दयामयि व्यपगच्छेन्मम दास्यम् । भारति मामकमास्यम् ॥ ३॥ विकसितनीलजलजकुलवासे विहितबृहस्पतिसमनिजदासे
    । जननि कृशोदरि मम रसनोपरि विरचय शाश्वतहास्यम् । भारति मामकमास्यम् ॥ ४॥ भवमुखभावितभवदवदानं रचयतु मानसमविरतगानम्
    । निपततु ते मयि दृगयि दयामयि किमपरमात्मजभाष्यम् । भारति मामकमास्यम् ॥ ५॥ ॥ इति श्रीसरस्वतीगीतिः सम्पूर्णम्
    ॥
