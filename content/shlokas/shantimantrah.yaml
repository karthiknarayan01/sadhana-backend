id: shantimantrah
category: stotram
name:
  english: shantimantrah
  devanagari: शान्तिमन्त्रः
content:
  english: shantimantrah om saha navavatu| saha nau bhunaktu| sahaviryam karavavahai| tejasvinavadhitamastu|
    ma vidvishavahai || om shanti
  devanagari: शान्तिमन्त्रः ॐ सह नाववतु। सह नौ भुनक्तु। सहवीर्यं करवावहै। तेजस्विनावधीतमस्तु। मा विद्विषावहै
    ॥ ॐ शान्ति
meaning: {}
