id: padmavatisahasranamastotra
category: sahasranama
name:
  english: padmavatisahasranamastotra
  devanagari: पद्मावतीसहस्रनामस्तोत्र
content:
  english: ringarini satyavakta siddhartha shilabhushana || 9|| satyarthini ca sadhyabha shaci samkrantisiddhida
    | samharakarini simhi saptarcih saphalarthada || 10|| satya sinduravarnabha sinduratilakapriya | saranga
    sutara tubhyam te namo'stu suyogini || 11|| iti sarasvatishatam || 6|| atha bhavaneshvarishatam |
    bhuvaneshvari bhushana ca bhuvana bhumipapriya | bhumigarbha bhupavadya bhujangeshapriya bhaga ||
    1|| bhujangabhushanabhogah bhujangakarashayini | bhavabhitihara bhima bhumirbhimattahasini || 2||
    bharati bhavati bhoga bhagani bhogamandira | bhadrika bhadrarupa ca bhutatma bhutabhanjini || 3||
    bhavani bhairavi bhima bhamini bhramanashini | bhujangini bhrusundi ca medini bhumibhushana || 4||
    bhinna bhagyavati bhasa bhogini bhogavallabha | bhuktida bhaktigraha ca bhavasagaratarini || 5|| bhasvati
    bhasvara bhurtirbhutida bhutivarddhini | bhagyada bhogyada bhogya bhavini bhavanashini || 6|| bhikshna
    bhattaraka bhirurbhramari bhramari bhava | bhattini bhandada bhanda bhallaki bhuribhanjini || 7||
    bhumiga bhumida bhasha bhakshini bhrigubhanjini | bharakrantabhinanda ca bhajini bhumipalini || 8||
    bhadra bhagavati bharga vatsala bhagashalini | khecari khadgahasta ca khandini khalamarddini || 9||
    khatvangadharini khadva khadanga khagavahini | shatcakrabhedavikhyata khagapujya khageshvari || 10||
    langali lalana lekha lekhini lalana lata | lakshmirlakshmavati lakshmya labhada lobhavarjita || 11||
    iti bhuvaneshvarishatam || 7|| atha lilavatishatam | lilavati lalamabha lohamudra lipipriya | lokeshvari
    ca lokanga labdhirlokantapalini || 1|| lila lilangada lola lavanya lalitarthini | lobhaha lambanirlanka
    lakshana lakshyavarjita || 2|| urmovasi udici ca udyotodyotakarini | uddharanya dharodakyo divyodakanivasini
    || 3|| udaharottamatamsa aushadhyudadhitarani | uttarottaravadibhyo dharadharanivasini || 4|| utkilantyutkilini
    ca utkirnaumkararupini | omkarakararupa ca ambika'mbaracarini || 5|| amogha sa puri canta'nimadigunasamyuta
    | anadinidhana'nanta catulata'ttahasini || 6|| aparnarddhabindudhara lokalalyalivangana | anandanandada
    loka rashtrasiddhipradanaka || 7|| avyaktastramayi murtirajirna jinaharini | ahikritya rajajara humkararatirantida
    || 8|| anurupatha murttighni krida kairavapalini | anokahashuga bhedya chedya cakashagamini || 9||
    anantara sadhikara tvanga anantaranashini | alaka yavana langhya sita shikharadharini || 10|| ahinathapriyaprana
    namastubhyam maheshvari | akarshanyadhara raga manda modavadharini || 11|| iti lilavatishatam || 8||
    atha trinetrashatam | trinetra tryambika tantri tripura tripurabhairavi | tripushta triphana tara
    totala tvarita tula || 1|| tapapriya tapasi ca taponishtha tapasvini | trailokyadipaka tredha trisandhya
    tripadashraya || 2|| trirupa tripada trana tara tripurasundari | trilocana tripathaga tara manavimardini
    || 3|| dharmapriya dharmada ca dharmini dharmapalini | dharadharadharadhara dhatri dharmangapalini
    || 4|| dhauta dhritidhura dhira dhununi ca dhanurddhara | brahmani brahmagotra ca brahmani brahmapalini
    || 5|| ganga godavari gauga gayatri ganapalini | gocari gomati gurva'gadha gandharini guha || 6||
    brahmi vidyutprabha vira vinavasavapujita | gitapriya garbhadhara ga gayini gajagamini || 7|| gariyasi
    gunopeta garishtha garamardini | gambhira gururupa ca gita garvapaharini || 8|| grahini grahini gauri
    gandhari gandhavasana | garudi gasini gudha gauhani gunahayini || 9|| cakramadhya cakradhara citrani
    citrarupini | carcari catura citra citramaya caturbhuja || 10|| candrabha candravarna ca cakrini cakradharini
    | cakrayudha karadhara candi candaparakrama || 11|| iti trinetrashatam || 9|| atha cakreshvarishatam
    | cakreshvari camushcinta capini cancalatmika | candralekha candrabhaga candrika candramandala ||
    1|| candrakantishcandramashrishcandramandalavartini | catu samudraparanta caturashramavasini || 2||
    caturmukhi candramukhi caturvarnaphalaprada | citsvarupa cidananda cirashcintamanih pita || 3|| candrahasa
    ca camunda cintana cauravarjini | caityapriya catyalila cintanarthaphalaprada || 4|| hrimrupa hamsagamani
    hakini hingulahita | halahaladhara hara hamsavarna ca harshada || 5|| himani harita hira harshini
    harimardini | gopini gauragita ca durga durlalita dhara || 6|| damini dirghika dugdha durgama durlabhodaya
    | dvarika dakshina diksha daksha dakshatipujita || 7|| damayanti danavati dyutidipta divagatih | daridraha
    vairidura dara durgatinashini || 8|| darpaha daityadasa ca darshini darshanapriya | vrishapriya ca
    vrishabha vrisharudha prabodhini || 9|| sukshma sukshmagatih shlakshna dhanamala dhanadyuti | chaya
    chatracchavicchirakshirada kshetrarakshini || 10|| amari ratiratrishca rangini ratida rusha | sthula
    sthulatara sthula sthandilashayavasini || 11|| sthira sthanavati devi ghanaghoraninadini | kshemankari
    kshemavati kshemada kshemavarddhini || 12|| shelusharupini shishta samsararnavatarini | sada sahayini
    tubhyam namastubhyam maheshvari || 13|| iti cakreshvarishatam || 10|| phalashrutih nityam puman pathati
    yo nitaram trishuddhya shaucam vidhaya vimalam phanishekharayah | stotram dyunatha udite susahasranama
    cashtottaram bhavati so bhavanadhirajah || 1|| tatkalajatavaragomayaliptabhumau kuryad dridhasanamatindriyapadmakakhyam
    | dhupam vidhaya varaguggulumajyayuktam raktambaram vapushi bhupya manah prashastah || 2|| na tasya
    ratrau bhayamasti kincinna shokarogodbhavaduhkhajalam | na rajapida na ca durjanasya padmavatistotra
    nishamyatam ve || 3|| na bandhanam tasya na vahnijatam bhayam na carernripato'pi kincit | na mattanagasya
    na kesharibhayam yo nityapathi stavanasva padme
  devanagari: ृङ्गारिणी सत्यवक्ता सिद्धार्था शीलभूषणा ॥ ९॥ सत्यार्थिनी च सध्याभा शची संक्रान्तिसिद्धिदा
    । संहारकारिणी सिंही सप्तर्चिः सफलार्थदा ॥ १०॥ सत्या सिन्दूरवर्णाभा सिन्दूरतिलकप्रिया । सारङ्गा सुतरा
    तुभ्यं ते नमोऽस्तु सुयोगिनी ॥ ११॥ इति सरस्वतीशतम् ॥ ६॥ अथ भवनेश्वरीशतम् । भुवनेश्वरी भूषणा च भुवना
    भूमिपप्रिया । भूमिगर्भा भूपवद्या भुजङ्गेशप्रिया भगा ॥ १॥ भुजङ्गभूषणाभोगाः भुजङ्गाकारशायिनी । भवभितिहरा
    भीमा भूमिर्भीमाट्टहासिनी ॥ २॥ भारती भवती भोगा भगनी भोगमन्दिरा । भद्रिका भद्ररूपा च भूतात्मा भूतभञ्जिनी
    ॥ ३॥ भवानी भैरवी भीमा भामिनी भ्रमनाशिनी । भुजङ्गिनी भ्रुसुण्डी च मेदिनी भूमिभूषणा ॥ ४॥ भिन्ना भाग्यवती
    भासा भोगिनी भोगवल्लभा । भुक्तिदा भक्तिग्राहा च भवसागरतारिणी ॥ ५॥ भास्वती भास्वरा भूर्तिर्भूतिदा भूतिवर्द्धिनी
    । भाग्यदा भोग्यदा भोग्या भाविनी भवनाशिनी ॥ ६॥ भीक्ष्णा भट्टारका भीरूर्भ्रामरी भ्रमरी भवा । भट्टिनी
    भाण्डदा भाण्डा भल्लाकी भूरिभञ्जिनी ॥ ७॥ भूमिगा भूमिदा भाषा भक्षिणी भृगुभञ्जिनी । भाराक्रान्ताभिनन्दा
    च भजिनी भूमिपालिनी ॥ ८॥ भद्रा भगवती भर्गा वत्सला भगशालिनी । खेचरी खड्गहस्ता च खण्डिनी खलमर्द्दिनी
    ॥ ९॥ खट्वाङ्गधारिणी खड्वा खडङ्गा खगवाहिनी । षट्चक्रभेदविख्याता खगपूज्या खगेश्वरी ॥ १०॥ लाङ्गली ललना
    लेखा लेखिनी ललना लता । लक्ष्मीर्लक्ष्मवति लक्ष्म्या लाभदा लोभवर्जिता ॥ ११॥ इति भुवनेश्वरीशतम् ॥ ७॥
    अथ लीलावतीशतम् । लीलावती ललामाभा लोहमुद्रा लिपिप्रिया । लोकेश्वरी च लोकाङ्गा लब्धिर्लोकान्तपालिनी
    ॥ १॥ लीला लीलाङ्गदा लोला लावण्या ललितार्थिनी । लोभहा लम्बनिर्लङ्का लक्षणा लक्ष्यवर्जिता ॥ २॥ उर्मोवसी
    उदीची च उद्योतोद्योतकारिणी । उद्धारण्या धरोदक्यो दिव्योदकनिवासिनी ॥ ३॥ उदाहारोत्तमातंसा औषध्युदधितारणी
    । उत्तरोत्तरवादिभ्यो धराधरनिवासिनी ॥ ४॥ उत्कीलन्त्युत्कीलिनी च उत्कीर्णौंकाररूपिणि । ॐकाराकाररूपा
    च अम्बिकाऽम्बरचारिणी ॥ ५॥ आमोघा सा पुरी चान्ताऽणिमादिगुणसंयुता । अनादिनिधनाऽनन्ता चातुलाटाऽट्टहासिनी
    ॥ ६॥ अपर्णार्द्धबिन्दुधरा लोकालल्यालिवाङ्गना । आनन्दानन्ददा लोका राष्ट्रसिद्धिप्रदानका ॥ ७॥ अव्यक्तास्त्रमयी
    मूर्तिरजीर्णा जीणहारिणी । अहिकृत्य रजाजारा हुंकाररातिरन्तिदा ॥ ८॥ अनुरूपाथ मूर्त्तिघ्नी क्रीडा कैरवपालिनी
    । अनोकहाशुगा भेद्या छेद्या चाकाशगामिनी ॥ ९॥ अनन्तरा साधिकारा त्वाङ्गा अनन्तरनाशिनी । अलका यवना लङ्घ्या
    सीता शिखरधारिणी ॥ १०॥ अहिनाथप्रियप्राणा नमस्तुभ्यं महेश्वरी । आकर्षण्याधरा रागा मन्दा मोदावधारिणी
    ॥ ११॥ इति लीलावतीशतम् ॥ ८॥ अथ त्रिनेत्राशतम् । त्रिनेत्रा त्र्यम्बिका तन्त्री त्रिपुरा त्रिपुरभैरवी
    । त्रिपुष्टा त्रिफणा तारा तोतला त्वरिता तुला ॥ १॥ तपप्रिया तापसी च तपोनिष्ठा तपस्विनी । त्रैलोक्यदीपका
    त्रेधा त्रिसन्ध्या त्रिपदाश्रया ॥ २॥ त्रिरूपा त्रिपदा त्राणा तारा त्रिपुरसुन्दरी । त्रिलोचना त्रिपथगा
    तारा मानविमर्दिनी ॥ ३॥ धर्मप्रिया धर्मदा च धर्मिणी धर्मपालिनी । धाराधरधराधारा धात्री धर्माङ्गपालिनी
    ॥ ४॥ धौता धृतिधुरा धीरा धुनुनी च धनुर्द्धरा । ब्रह्माणी ब्रह्मगोत्रा च ब्राह्मणी ब्रह्मपालिनी ॥ ५॥
    गङ्गा गोदावरी गौगा गायत्री गणपालिनी । गोचरी गोमती गुर्वाऽगाधा गान्धारिणी गुहा ॥ ६॥ ब्राह्मी विद्युत्प्रभा
    वीरा वीणावासवपूजिता । गीताप्रिया गर्भधारा गा गायिनी गजगामिनी ॥ ७॥ गरीयसी गुणोपेता गरिष्ठा गरमर्दिनी
    । गम्भीरा गुरुरूपा च गीता गर्वापहारिणी ॥ ८॥ ग्रहिणी ग्राहिणी गौरी गन्धारी गन्धवासना । गारुडी गासिनी
    गूढा गौहनी गुणहायिनी ॥ ९॥ चक्रमध्या चक्रधरा चित्रणी चित्ररूपिणी । चर्चरी चतुरा चित्रा चित्रमाया चतुर्भुजा
    ॥ १०॥ चन्द्राभा चन्द्रवर्णा च चक्रिणी चक्रधारिणी । चक्रायुधा करधरा चण्डी चण्डपराक्रमा ॥ ११॥ इति त्रिनेत्राशतम्
    ॥ ९॥ अथ चक्रेश्वरीशतम् । चक्रेश्वरी चमूश्चिन्ता चापिनी चञ्चलात्मिका । चन्द्रलेखा चन्द्रभागा चन्द्रिका
    चन्द्रमण्डला ॥ १॥ चन्द्रकान्तिश्चन्द्रमश्रीश्चन्द्रमण्डलवर्तिनी । चतु समुद्रपारान्ता चतुराश्रमवासिनी
    ॥ २॥ चतुर्मुखी चन्द्रमुखी चतुर्वर्णफलप्रदा । चित्स्वरूपा चिदानन्दा चिराश्चिन्तामणिः पिता ॥ ३॥ चन्द्रहासा
    च चामुण्डा चिन्तना चौरवर्जिनी । चैत्यप्रिया चत्यलीला चिन्तनार्थफलप्रदा ॥ ४॥ ह्रींरूपा हंसगमनी हाकिनी
    हिङ्गुलाहीता । हालाहलधरा हारा हंसवर्णा च हर्षदा ॥ ५॥ हिमानी हरिता हीरा हर्षिणी हरिमर्दिनी । गोपिनी
    गौरगीता च दुर्गा दुर्ललिता धरा ॥ ६॥ दामिनी दीर्घिका दुग्धा दुर्गमा दुर्लभोदया । द्वारिका दक्षिणा दीक्षा
    दक्षा दक्षातिपूजिता ॥ ७॥ दमयन्ती दानवती द्युतिदीप्ता दिवागतिः । दरिद्रहा वैरिदूरा दारा दुर्गातिनाशिनी
    ॥ ८॥ दर्पहा दैत्यदासा च दर्शिनी दर्शनप्रिया । वृषप्रिया च वृषभा वृषारूढा प्रबोधिनी ॥ ९॥ सूक्ष्मा सूक्ष्मगतिः
    श्लक्ष्णा धनमाला धनद्यूति । छाया छात्रच्छविच्छिरक्षीरादा क्षेत्ररक्षिणी ॥ १०॥ अमरी रतिरात्रीश्च रङ्गिनी
    रतिदा रुषा । स्थूला स्थूलतरा स्थूला स्थण्डिलाशयवासिनी ॥ ११॥ स्थिरा स्थानवती देवी घनघोरनिनादिनी । क्षेमङ्करी
    क्षेमवती क्षेमदा क्षेमवर्द्धिनी ॥ १२॥ शेलूषरूपिणी शिष्टा संसारार्णवतारिणी । सदा सहायिनी तुभ्यं नमस्तुभ्यं
    महेश्वरी ॥ १३॥ इती चक्रेश्वरीशतम् ॥ १०॥ फलश्रुतिः नित्यं पुमान् पठति यो नितरां त्रिशुद्ध्या शौचं विधाय
    विमलं फणिशेखरायाः । स्तोत्रं द्युनाथ उदिते सुसहस्रनाम चाष्टोत्तरं भवति सो भवनाधिराजः ॥ १॥ तत्कालजातवरगोमयलिप्तभूमौ
    कुर्याद् दृढासनमतीन्द्रियपद्मकाख्यम् । धूपं विधाय वरगुग्गुलुमाज्ययुक्तं रक्ताम्बरं वपुषि भूप्य मनः
    प्रशस्तः ॥ २॥ न तस्य रात्रौ भयमस्ति किञ्चिन्न शोकरोगोद्भवदुःखजालम् । न राजपीडा न च दुर्जनस्य पद्मावतीस्तोत्र
    निशम्यतां वे ॥ ३॥ न बन्धनं तस्य न वह्निजातं भयं न चारेर्नृपतोऽपि किञ्चित् । न मत्तनागस्य न केशरीभयं
    यो नित्यपाठी स्तवनस्व पद्मे
