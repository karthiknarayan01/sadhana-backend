id: m-ityunjayasahasra-2
category: sahasranama
name:
  english: mṟityunjayasahasra
  devanagari: म्ऱित्युन्जयसहस्र
content:
  english: ritirdaksho dakshayajnavinashanah | daksho daurbhagyaha daityamardano bhogavardhanah || 35||
    bhogi rogaharo heyo hari harivibhushanah | bahurupo bahumatirbahuvitto vicakshanah || 36|| nrittakriccittasantosho
    nrittagitavisharadah | sharadvarnavibhushadhyo galadagdho'ghanashanah || 37|| nagi nagamayo'nanto'nantarupah
    pinakabhrit | natano hatakeshano variyamshca vivarnabhrit || 38|| jhankari tankahastashca pashi sharngi
    shashiprabhah | sahasrarupo samaguh sadhunamabhayapradah || 39|| sadhusevyah sadhugatih sevaphalaprado
    vibhuh | sumaha madyapo matto mattamurtih sumantakah || 40|| kili lilakaro lantah bhavabandhaikamocanah
    | rocishnurvishnuracyuta amurto nutano navah || 41|| nyagrodharupo bhayado bhayaha'bhitidharanah |
    dharanidharasevyashca dharadharasutapatih || 42|| dharadharo'ndhakaripurvijnani mohavarjitah | sthanukesho
    jati gramyo gramaramo ramapriyah || 43|| priyakrit priyarupashca viprayogi pratapanah | prabhakarah
    prabhadipto manyumanavanishvarah || 44|| tikshnabahustikshnakarastikshnamshustikshnalocanah | tikshnacittastrayirupastrayimurtistrayitanuh
    || 45|| havirbhughavisham jyotirhalahalo halipatih | havishmallocano halamayo haritarupabhrit || 46||
    mradima''mramayo vriksho hutasho hutabhugguni | gunajno garudo ganatatparo vikrami krami || 47|| krameshvarah
    kramakarah kramikrit klantamanasah | mahateja mahamaro mohito mohavallabhah || 48|| manasvi tridasho
    balo balapatiraghapahah | balyo ripuharo haryo gavirgavimato'gunah || 49|| saguno vittaradviryo virocano
    vibhavasuh | malamayo madhavashca vikartano'vikatthanah || 50|| manakrinmuktido'tulyo mukhyah shatrubhayankarah
    | hiranyaretah subhagah satinathah sirapatih || 51|| medhri mainakabhaginipatiruttamarupabhrit | adityo
    ditijeshano ditiputrakshayankarah || 52|| vasudevo mahabhagyo vishvavasurvasupriyah | samudro'mitatejashca
    khagendro vishikhi shikhi || 53|| garutman vajrahastashca paulominatha ishvarah | yajnapeyo vajapeyah
    shatakratuh shatananah || 54|| pratishthastivravisrambhi gambhiro bhavavardhanah | gayishtho madhuralapo
    madhumattashca madhavah || 55|| mayatma bhoginam trata nakinamishtadayakah | nakendro janako janyah
    stambhano rambhanashanah || 56|| shankara ishvara ishah sharvaripatishekharah | lingadhyakshah suradhyaksho
    vedadhyaksho vicarakah || 57|| bhargo'narghyo nareshano naravahanasevitah | caturo bhavita bhavi bhavado
    bhavabhitiha || 58|| bhutesho mahito ramo viramo ratrivallabhah | mangalo dharaniputro dhanyo buddhivivardhanah
    || 59|| jayi jiveshvaro jaro jatharo jahnutapanah | jahnukanyadharah kalpo vatsaro masarupadhrit ||
    60|| riturribhusutadhyaksho vihari vihagadhipah | shuklambaro nilakanthah shuklo bhrigusuto bhagah
    || 61|| shantah shivaprado'bhedyo'bhedakricchantakrit patih | natho danto bhikshurupi datrishreshtho
    vishampatih || 62|| kumarah krodhanah krodhi virodhi vigrahi rasah | nirasah sarasah siddho vrishani
    vrishaghatanah || 63|| pancasyah shanmukhashcaiva vimukhah sumukhipriyah | durmukho durjayo duhkhi
    sukhi sukhavilasadah || 64|| patri pautri pavitrashca bhutatma putanantakah | aksharam paramam tattvam
    balavan balaghatanah || 65|| bhalli bhaulirbhavabhavo bhavabhavavimocanah | narayano muktakesho digdevo
    dharmanayakah || 66|| karamokshaprado'jeyo mahangah samagayanah | tatsangamo namakari cari smaranishudanah
    || 67|| krishnah krishnambarah stutyastaravarnastrapakulah | trapavan durgatitrata durgamo durgaghatanah
    || 68|| mahapado vipadashca vipadam nashako narah | mahabahurmahorasko mahanandapradayakah || 69||
    mahanetro mahadata nanashastravicakshanah | mahamurdha mahadanto mahakarno mahoragah || 70|| mahacakshurmahanaso
    mahagrivo digalayah | digvasa ditijeshano mundi mundakshasutradhrit || 71|| shmashananilayo'ragi mahakatiranutanah
    | puranapurusho'parah paramatma mahakarah || 72|| mahalasyo mahakesho mahoshtho mohano virat | mahamukho
    mahajangho mandali kundali natah || 73|| asapatnah patrakarah patrahastashca patavah | lalasah salasah
    salah kalpavrikshashca kampitah || 74|| kampaha kalpanahari mahaketuh kathorakah | analah pavanah
    pathah pithasthah pitharupakah || 75|| patinah kulishi pino merudhama mahaguni | mahatunirasamyukto
    devadanavadarpaha || 76|| atharvashirshah somyasyah riksahasramitekshanah | yajuhsamamukho guhyo yajurvedavicakshanah
    || 77|| yajniko yajnarupashca yajnajno dharanipatih |
  devanagari: ृतिर्दक्षो दक्षयज्ञविनाशनः । दाक्षो दौर्भाग्यहा दैत्यमर्दनो भोगवर्धनः ॥ ३५॥ भोगी रोगहरो
    हेयो हारी हरिविभूषणः । बहुरूपो बहुमतिर्बहुवित्तो विचक्षणः ॥ ३६॥ नृत्तकृच्चित्तसन्तोषो नृत्तगीतविशारदः
    । शरद्वर्णविभूषाढ्यो गलदग्धोऽघनाशनः ॥ ३७॥ नागी नागमयोऽनन्तोऽनन्तरूपः पिनाकभृत् । नटनो हाटकेशानो वरीयांश्च
    विवर्णभृत् ॥ ३८॥ झाङ्कारी टङ्कहस्तश्च पाशी शार्ङ्गी शशिप्रभः । सहस्ररूपो समगुः साधूनामभयप्रदः ॥ ३९॥
    साधुसेव्यः साधुगतिः सेवाफलप्रदो विभुः । सुमहा मद्यपो मत्तो मत्तमूर्तिः सुमन्तकः ॥ ४०॥ कीली लीलाकरो
    लान्तः भवबन्धैकमोचनः । रोचिष्णुर्विष्णुरच्युत अमूर्तो नूतनो नवः ॥ ४१॥ न्यग्रोधरूपो भयदो भयहाऽभीतिधारणः
    । धरणीधरसेव्यश्च धराधरसुतापतिः ॥ ४२॥ धराधरोऽन्धकरिपुर्विज्ञानी मोहवर्जितः । स्थाणुकेशो जटी ग्राम्यो
    ग्रामारामो रमाप्रियः ॥ ४३॥ प्रियकृत् प्रियरूपश्च विप्रयोगी प्रतापनः । प्रभाकरः प्रभादीप्तो मन्युमानवनीश्वरः
    ॥ ४४॥ तीक्ष्णबाहुस्तीक्ष्णकरस्तीक्ष्णांशुस्तीक्ष्णलोचनः । तीक्ष्णचित्तस्त्रयीरूपस्त्रयीमूर्तिस्त्रयीतनुः
    ॥ ४५॥ हविर्भुघविषां ज्योतिर्हालाहलो हलीपतिः । हविष्मल्लोचनो हालामयो हरितरूपभृत् ॥ ४६॥ म्रदिमाऽऽम्रमयो
    वृक्षो हुताशो हुतभुग्गुणी । गुणज्ञो गरुडो गानतत्परो विक्रमी क्रमी ॥ ४७॥ क्रमेश्वरः क्रमकरः क्रमिकृत्
    क्लान्तमानसः । महातेजा महामारो मोहितो मोहवल्लभः ॥ ४८॥ मनस्वी त्रिदशो बालो बालापतिरघापहः । बाल्यो रिपुहरो
    हार्यो गविर्गविमतोऽगुणः ॥ ४९॥ सगुणो वित्तराड्वीर्यो विरोचनो विभावसुः । मालामयो माधवश्च विकर्तनोऽविकत्थनः
    ॥ ५०॥ मानकृन्मुक्तिदोऽतुल्यो मुख्यः शत्रुभयङ्करः । हिरण्यरेताः सुभगः सतीनाथः सिरापतिः ॥ ५१॥ मेढ्री
    मैनाकभगिनीपतिरुत्तमरूपभृत् । आदित्यो दितिजेशानो दितिपुत्रक्षयङ्करः ॥ ५२॥ वसुदेवो महाभाग्यो विश्वावसुर्वसुप्रियः
    । समुद्रोऽमिततेजाश्च खगेन्द्रो विशिखी शिखी ॥ ५३॥ गरुत्मान् वज्रहस्तश्च पौलोमीनाथ ईश्वरः । यज्ञपेयो
    वाजपेयः शतक्रतुः शताननः ॥ ५४॥ प्रतिष्ठस्तीव्रविस्रम्भी गम्भीरो भाववर्धनः । गायिष्ठो मधुरालापो मधुमत्तश्च
    माधवः ॥ ५५॥ मायात्मा भोगिनां त्राता नाकिनामिष्टदायकः । नाकेन्द्रो जनको जन्यः स्तम्भनो रम्भनाशनः ॥
    ५६॥ शङ्कर ईश्वर ईशः शर्वरीपतिशेखरः । लिङ्गाध्यक्षः सुराध्यक्षो वेदाध्यक्षो विचारकः ॥ ५७॥ भर्गोऽनर्घ्यो
    नरेशानो नरवाहनसेवितः । चतुरो भविता भावी भावदो भवभीतिहा ॥ ५८॥ भूतेशो महितो रामो विरामो रात्रिवल्लभः
    । मङ्गलो धरणीपुत्रो धन्यो बुद्धिविवर्धनः ॥ ५९॥ जयी जीवेश्वरो जारो जाठरो जह्नुतापनः । जह्नुकन्याधरः
    कल्पो वत्सरो मासरूपधृत् ॥ ६०॥ ऋतुरृभुसुताध्यक्षो विहारी विहगाधिपः । शुक्लाम्बरो नीलकण्ठः शुक्लो भृगुसुतो
    भगः ॥ ६१॥ शान्तः शिवप्रदोऽभेद्योऽभेदकृच्छान्तकृत् पतिः । नाथो दान्तो भिक्षुरूपी दातृश्रेष्ठो विशाम्पतिः
    ॥ ६२॥ कुमारः क्रोधनः क्रोधी विरोधी विग्रही रसः । नीरसः सरसः सिद्धो वृषणी वृषघातनः ॥ ६३॥ पञ्चास्यः
    षण्मुखश्चैव विमुखः सुमुखीप्रियः । दुर्मुखो दुर्जयो दुःखी सुखी सुखविलासदः ॥ ६४॥ पात्री पौत्री पवित्रश्च
    भूतात्मा पूतनान्तकः । अक्षरं परमं तत्त्वं बलवान् बलघातनः ॥ ६५॥ भल्ली भौलिर्भवाभावो भावाभावविमोचनः
    । नारायणो मुक्तकेशो दिग्देवो धर्मनायकः ॥ ६६॥ कारामोक्षप्रदोऽजेयो महाङ्गः सामगायनः । तत्सङ्गमो नामकारी
    चारी स्मरनिषूदनः ॥ ६७॥ कृष्णः कृष्णाम्बरः स्तुत्यस्तारावर्णस्त्रपाकुलः । त्रपावान् दुर्गतित्राता दुर्गमो
    दुर्गघातनः ॥ ६८॥ महापादो विपादश्च विपदां नाशको नरः । महाबाहुर्महोरस्को महानन्दप्रदायकः ॥ ६९॥ महानेत्रो
    महादाता नानाशास्त्रविचक्षणः । महामूर्धा महादन्तो महाकर्णो महोरगः ॥ ७०॥ महाचक्षुर्महानासो महाग्रीवो
    दिगालयः । दिग्वासा दितिजेशानो मुण्डी मुण्डाक्षसूत्रधृत् ॥ ७१॥ श्मशाननिलयोऽरागी महाकटिरनूतनः । पुराणपुरुषोऽपारः
    परमात्मा महाकरः ॥ ७२॥ महालस्यो महाकेशो महोष्ठो मोहनो विराट् । महामुखो महाजङ्घो मण्डली कुण्डली नटः
    ॥ ७३॥ असपत्नः पत्रकरः पात्रहस्तश्च पाटवः । लालसः सालसः सालः कल्पवृक्षश्च कम्पितः ॥ ७४॥ कम्पहा कल्पनाहारी
    महाकेतुः कठोरकः । अनलः पवनः पाठः पीठस्थः पीठरूपकः ॥ ७५॥ पाटीनः कुलिशी पीनो मेरुधामा महागुणी । महातूणीरसंयुक्तो
    देवदानवदर्पहा ॥ ७६॥ अथर्वशीर्षः सोम्यास्यः ऋक्सहस्रामितेक्षणः । यजुःसाममुखो गुह्यो यजुर्वेदविचक्षणः
    ॥ ७७॥ याज्ञिको यज्ञरूपश्च यज्ञज्ञो धरणीपतिः ।
