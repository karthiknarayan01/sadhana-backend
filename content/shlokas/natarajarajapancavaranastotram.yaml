id: natarajarajapancavaranastotram
category: stotram
name:
  english: natarajarajapancavaranastotram
  devanagari: नटराजराजपन्चावरणस्तोत्रं
content:
  english: nandajnanamayam nateshashivayoh sammelanam bodhayat | shrijambunadabilvapatraracitairmalaganairlakshitam
    kasturimasrinam cidambaramidam sthanam rahasyam numah || 2|| || nava cakrani || shricakram shivacakram
    ca dhvanicakram ca tandavam | sammelanam shrilalitacakram cintamanestatha | ganeshaskandayoshcaiva
    cakram jneyam navatmakam || 3|| || shrinatarajarajamurtidhyanam || saptarnavaparikshepam dvipaissaptabhiravritam
    | pancashatkotivistirnam dhyayetsarvam sabham mahim || 4|| tasyashca hridayambhoje matrikaksharakesaram
    | dhyayedashtadalam dhiman mahihridayapankajam || 5|| tasya madhye trikone tu tarunendu shikhamanim
    | carudirghajatapasham caladbhogindrakundalam || 6|| tripundravilasatbhalam candrarkanalalocanam |
    vamabhage sthitam devi lakshayantamapangatah || 7|| adharollanghanakarasandihanasmitankuram | kasturikasitoddamakalakutalasadgalam
    || 8|| mahadamarukaptordhvadakshapanisaroruham | tadanyakarapadmantarjvaladucchikhapavakam || 9||
    dakshadhah karapadmena harantam praninam bhayam | vikshiptanyakaram tiryak kuncitenanghrina svayam
    || 10|| vametaraprakoshthantanrityatphanadhareshvaram | kalpabrahmakapalanam malaya lambamanaya ||
    11|| svatantryamatmano rupam acakshanam svabhavatah | vyaghra carmambaradharam katisutrita pannagam
    || 12|| dakshapadabjavinyasat adhah kritatamogunam | bhasmoddhulitasarvangam paramanandatandavam |
    evam dhyayet pareshanam pundarikapureshvaram || 13|| || shrishivakamasundaridhyanam || tatassvarnanibham
    devim vidyullekheva bhasvaram | nivarashukavattanvim pitam bhasvattanupamam || 14|| svecchapankajamadhyastham
    svecchakalpitavigraham | sadvinetram caturhastam madhye sukshmam stanonnatam || 15|| nitambatatavistirnam
    shyamam nilalakanvitam | harakeyurarashanamekhaladyupashobhitam || 16|| sphuranmakutamanikyakinkiniravashobhitam
    | dukulavasanopetam kincitprahasitananam || 17|| anaupamyagunam saumyam mahasatvikarupinim | dakshinordhvakarabjena
    cakshamaladharam shivam || 18|| vamenordhvakarabjena shukavatsadharam param | dakshadhahkarapadmena
    phullakalharadharinim || 19|| lambitanyakarabjena katideshe samanvitam | brahmavishnvindramakutaih
    sandharshitapadambujam | evam dhyayet pareshanim pundarika pureshvarim || 20|| || shrinateshaprathamavaranadevatastotram
    || panca brahmadevatah
  devanagari: नन्दज्ञानमयं नटेशशिवयोः सम्मेलनं बोधयत् । श्रीजाम्बूनदबिल्वपत्ररचितैर्मालागणैर्लक्षितं कस्तूरीमसृणं
    चिदम्बरमिदं स्थानं रहस्यं नुमः ॥ २॥ ॥ नव चक्राणि ॥ श्रीचक्रं शिवचक्रं च ध्वनिचक्रं च ताण्डवम् । सम्मेलनं
    श्रीललिताचक्रं चिन्तामणेस्तथा । गणेशस्कन्दयोश्चैव चक्रं ज्ञेयं नवात्मकम् ॥ ३॥ ॥ श्रीनटराजराजमूर्तिध्यानम्
    ॥ सप्तार्णवपरिक्षेपां द्वीपैस्सप्तभिरावृताम् । पञ्चाशत्कोटिविस्तीर्णां ध्यायेत्सर्वां सभां महीम् ॥
    ४॥ तस्याश्च हृदयाम्भोजे मातृकाक्षरकेसरम् । ध्यायेदष्टदलं धीमान् महीहृदयपङ्कजम् ॥ ५॥ तस्य मध्ये त्रिकोणे
    तु तरुणेन्दु शिखामणिम् । चारुदीर्घजटापाशं चलद्भोगीन्द्रकुण्डलम् ॥ ६॥ त्रिपुण्ड्रविलसत्भालं चन्द्रार्कानललोचनम्
    । वामभागे स्थितां देवी लक्षयन्तमपाङ्गतः ॥ ७॥ अधरोल्लङ्घनाकारसन्दिहानस्मिताङ्कुरम् । कस्तूरिकासितोद्दामकालकूटलसद्गलम्
    ॥ ८॥ महाडमरुकाप्तोर्ध्वदक्षपाणिसरोरुहम् । तदन्यकरपद्मान्तर्ज्वलदुच्छिखपावकम् ॥ ९॥ दक्षाधः करपद्मेन
    हरन्तं प्राणिनां भयम् । विक्षिप्तान्यकरं तिर्यक् कुञ्चितेनाङ्घ्रिणा स्वयम् ॥ १०॥ वामेतरप्रकोष्ठान्तनृत्यत्फणधरेश्वरम्
    । कल्पब्रह्मकपालानां मालया लम्बमानया ॥ ११॥ स्वातन्त्र्यमात्मनो रूपं आचक्षाणं स्वभावतः । व्याघ्र चर्माम्बरधरं
    कटिसूत्रित पन्नगम् ॥ १२॥ दक्षपादाब्जविन्यासात् अधः कृततमोगुणम् । भस्मोद्धूलितसर्वाङ्गं परमानन्दताण्डवम्
    । एवं ध्यायेत् परेशानं पुण्डरीकपुरेश्वरम् ॥ १३॥ ॥ श्रीशिवकामसुन्दरीध्यानम् ॥ ततस्स्वर्णनिभां देवीं
    विद्युल्लेखेव भास्वराम् । नीवारशूकवत्तन्वीं पीतां भास्वत्तनूपमाम् ॥ १४॥ स्वेच्छापङ्कजमध्यस्थां स्वेच्छाकल्पितविग्रहाम्
    । सद्विनेत्रां चतुर्हस्तां मध्ये सूक्ष्मां स्तनोन्नताम् ॥ १५॥ नितम्बतटविस्तीर्णां श्यामां नीलालकान्विताम्
    । हारकेयूररशनामेखलाद्युपशोभिताम् ॥ १६॥ स्फुरन्मकुटमाणिक्यकिङ्किणीरवशोभिताम् । दुकूलवसनोपेतां किञ्चित्प्रहसिताननाम्
    ॥ १७॥ अनौपम्यगुणां सौम्यां महासात्विकरूपिणीम् । दक्षिणोर्ध्वकराब्जेन चाक्षमालाधरां शिवाम् ॥ १८॥ वामेनोर्ध्वकराब्जेन
    शुकवत्सधरां पराम् । दक्षाधःकरपद्मेन फुल्लकल्हारधारिणीम् ॥ १९॥ लम्बितान्यकराब्जेन कटिदेशे समन्विताम्
    । ब्रह्मविष्ण्विन्द्रमकुटैः सन्धर्षितपदाम्बुजाम् । एवं ध्यायेत् परेशानीं पुण्डरीक पुरेश्वरीम् ॥ २०॥
    ॥ श्रीनटेशप्रथमावरणदेवतास्तोत्रम् ॥ पञ्च ब्रह्मदेवताः
