id: ganeshahridayastotram
category: hridaya
name:
  english: ganeshahridayastotram
  devanagari: गणेशहृदयस्तोत्रम्
content:
  english: viracya khelakah | sada svayam yogamayena bhati tam namamyato'ham tvatha brahmanaspatim ||
    37|| amangalam vishvamidam sahatmabhih ayogasamyogayutam pranashvaram | tatah param mangalarupadhadharakam
    namami mangalyapatim sushantidam || 38|| sarvatramanyam sakalavabhasakam sujnaih shubhadavashubhadipujitam
    | pujyam na tasmannigamadisammatam tam sarvapujyam pranato'smi nityam || 39|| bhuktim ca muktim pradadati
    tushto bhaktipriyo nijavighnaha ca | bhaktya vihinaya dadati vighnan tam vighnarajam pranamami nityam
    || 40|| namarthayuktam kathitam priye te vighneshvarasyaiva param rahasyam | saptatrinamnam hridayam
    naro yo jnatva param brahmamayo bhavediha || 41|| gangovaca | namnam yathridayam proktam tvaya brahmapadam
    param | na tatranubhavo me tu tadartham vada shankara || 42|| shiva uvaca | mantram grihya ganeshasya
    purashcaranamargatah | bhaja tvam tena tam jnanam bhavishyati na samshayah || 43|| hridayam mantrarajasya
    kathayami samasatah | mantra eva ganeshano na bhinnastatra vartate || 44|| gakaro brahmadevashca'karo
    vishnuh prakirtitah | binduh shivastatha bhanuh sanunasika samjnitah || 45|| tesham sandhirmahashaktirebhih
    sa mantra ucyate | devata gananathastu tesham samyogakarakah || 46|| tebhyastaramayam vishvam samutpannam
    priye pura | atastarayuto mantro ganeshaikaksharakritih || 47|| tarah sa shad vidhah proktastannibodha
    saridvare | akarokarakauh proktauh makaro nadabinduke || 48|| shunyam viddhi mahamaye tatra bhedam
    vadamyaham | shunyam dehisvarupam tu bindurdeha iti smritah || 49|| tabhyam caturvidham vishvam sthuladibhedadharakam
    | etadrisham bijanihi mantrarajam gajananam || 50|| agamoktavidhanena kritva nyasadikam pura | tato
    ganeshvaram pujya japam kuryadvicakshanah || 51|| taddashamshena homam vai kuryadagamamargatah | taddashamshamitam
    proktam tarpanam ganapasya ca || 52|| taddashamshamitam devi marjanam taddashamshatah | vipranam bhojanam
    proktamevam pancangamuccate || 53|| yathavidhikritam caitatsadyo hi phaladam bhavet | atastvam mantrarajasya
    pancakam tatsamacara || 54|| evamuktvadade tasyai mantram vidhisamanvitam | ganeshasya pranamyaiva
    mam yayau sa tapo'rthatah || 55|| mayuresham samasadya cakara tapa uttamam | ganga tatraiva vipresha
    mantradhyanaparayana || 56|| purashcaranamekam sa cakara saritam vara | tatah prasannata yato ganesho
    bhaktavatsalah || 57|| tasyaiva kripaya tasya hridi jnanam babhuva ha | tenaikavimshaternamnamarthajna
    tatkshanadabhut || 58|| tato harshayuta devi tatra vasam cakara sa | nityam bhaktisamayukta'bhajattam
    gananayakam || 59|| sanakadya ucuh | brahmabhuta saritshreshtha mayuresham katham prabho | abhajattasya
    margam no bruhi natha namo'stu te || 60|| shiva uvaca | brahmabhuto naro yogi ganeshamabhajatsada
    | navadha bhaktibhavena tatparashca maharshayah || 61|| putrah kalatram janakau suhridagano dravyam
    sakhavrittijavidyaya yutam | svargastu moksho vividham tvameva me svami gururvighnapatih paratparah
    || 62|| samsargikam kayikavacikam param karmacaranmanasajam tridehatah | jnanam hridistham ca maya
    paratparam vidhneshvarayeti samarpitam kila || 63|| yogakarena vighnesha ekanekadisamshritah | bhunkte
    sa vividhanbhogan shubha'shubhasamashritan || 64|| naham narah svayam sakshat kridati gananayakah
    | svamisevakabhavena brahmani shobhate ratah || 65|| anena vidhina vipra bhajante gananayakam | yoginah
    shukamukhyashca mudgaladya maharshayah || 66|| etatsarvam samakhyatam guhyam ganapatermaya | hridayam
    tena vighnesham toshayadhvam maharshayah || 67|| yatha dehendriyadyeshu mukhyam svahridayam smritam
    | yatra jivasvarupena tishthati gananayakah || 68|| tatha ganapateretad hridayam parikirtitam | atra
    yogapatih sakshattishthati brahmanayakah || 69|| anena gananatham tu yastoshyati narottamah | sa bhuktva
    sakalanbhoganante yogamayo bhavet || 70|| evam madiyavakyam te shrutva brahmasutah param | pranamya
    mam yayuh sarve sanakadyastapovanam || 71|| ekaksharamantrasya pancakam sevya yoginah | ganeshahridayam
    jnatva ganapatya babhuvire || 72|| tato nityam ganeshasya hridayam te maharshayah | japanti bhaktisamyukta
    bhramanti svecchayeritah || 73|| atastvamapi bhavena ganeshahridayam param | sevasva ganapatyeshu
    mukhyastatha bhavishyasi || 74|| mudgala uvaca | evamuktva mahanagam sheshaya pradadau shivah | mantramekakshara
    sangam sa yayau tam pranamya ca || 75|| sadhayitva yathanyayam hridayajno babhuva ha | nityam hridayakenaiva
    tushtava dviradananam || 76|| ganeshahridayam punyam sha
  devanagari: विरच्य खेलकः । सदा स्वयं योगमयेन भाति तं नमाम्यतोऽहं त्वथ ब्रह्मणस्पतिम् ॥ ३७॥ अमङ्गलं विश्वमिदं
    सहात्मभिः अयोगसंयोगयुतं प्रणश्वरम् । ततः परं मङ्गलरूपधधारकं नमामि माङ्गल्यपतिं सुशान्तिदम् ॥ ३८॥ सर्वत्रमान्यं
    सकलावभासकं सुज्ञैः शुभादावशुभादिपूजितम् । पूज्यं न तस्मान्निगमादिसम्मतं तं सर्वपूज्यं प्रणतोऽस्मि
    नित्यम् ॥ ३९॥ भुक्तिं च मुक्तिं प्रददाति तुष्टो भक्तिप्रियो निजविघ्नहा च । भक्त्या विहीनाय ददाति विघ्नान्
    तं विघ्नराजं प्रणमामि नित्यम् ॥ ४०॥ नामार्थयुक्तं कथितं प्रिये ते विघ्नेश्वरस्यैव परं रहस्यम् । सप्तत्रिनाम्नां
    हृदयं नरो यो ज्ञात्वा परं ब्रह्ममयो भवेदिह ॥ ४१॥ गङ्गोवाच । नाम्नां यथृदयं प्रोक्तं त्वया ब्रह्मपदं
    परम् । न तत्रानुभवो मे तु तदर्थं वद शङ्कर ॥ ४२॥ शिव उवाच । मन्त्रं गृह्य गणेशस्य पुरश्चरणमार्गतः ।
    भज त्वं तेन तं ज्ञानं भविष्यति न संशयः ॥ ४३॥ हृदयं मन्त्रराजस्य कथयामि समासतः । मन्त्र एव गणेशानो
    न भिन्नस्तत्र वर्तते ॥ ४४॥ गकारो ब्रह्मदेवश्चाऽकारो विष्णुः प्रकीर्तितः । बिन्दुः शिवस्तथा भानुः सानुनासिक
    संज्ञितः ॥ ४५॥ तेषां सन्धिर्महाशक्तिरेभिः स मन्त्र उच्यते । देवता गणनाथस्तु तेषां संयोगकारकः ॥ ४६॥
    तेभ्यस्तारमयं विश्वं समुत्पन्नं प्रिये पुरा । अतस्तारयुतो मन्त्रो गणेशैकाक्षराकृतिः ॥ ४७॥ तारः स षड्
    विधः प्रोक्तस्तन्निबोध सरिद्वरे । अकारोकारकौः प्रोक्तौः मकारो नादबिन्दुके ॥ ४८॥ शून्यं विद्धि महामाये
    तत्र भेदं वदाम्यहम् । शून्यं देहीस्वरूपं तु बिन्दुर्देह इति स्मृतः ॥ ४९॥ ताभ्यां चतुर्विधं विश्वं
    स्थूलादिभेदधारकम् । एतादृशं बिजानीहि मन्त्रराजं गजाननम् ॥ ५०॥ आगमोक्तविधानेन कृत्वा न्यासादिकं पुरा
    । ततो गणेश्वरं पूज्य जपं कुर्याद्विचक्षणः ॥ ५१॥ तद्दशांशेन होमं वै कुर्यादागममार्गतः । तद्दशांशमितं
    प्रोक्तं तर्पणं गणपस्य च ॥ ५२॥ तद्दशांशमितं देवि मार्जनं तद्दशांशतः । विप्राणां भोजनं प्रोक्तमेवं
    पञ्चाङ्गमुच्चते ॥ ५३॥ यथाविधिकृतं चैतत्सद्यो हि फलदं भवेत् । अतस्त्वं मन्त्रराजस्य पञ्चकं तत्समाचर
    ॥ ५४॥ एवमुक्त्वाददे तस्यै मन्त्रं विधिसमन्वितम् । गणेशस्य प्रणम्यैव मां ययौ सा तपोऽर्थतः ॥ ५५॥ मयूरेशं
    समासाद्य चकार तप उत्तमम् । गङ्गा तत्रैव विप्रेशा मन्त्रध्यानपरायणा ॥ ५६॥ पुरश्चरणमेकं सा चकार सरितां
    वरा । ततः प्रसन्नता यातो गणेशो भक्तवत्सलः ॥ ५७॥ तस्यैव कृपया तस्या हृदि ज्ञानं बभूव ह । तेनैकविंशतेर्नाम्नामर्थज्ञा
    तत्क्षणादभूत् ॥ ५८॥ ततो हर्षयुता देवी तत्र वासं चकार सा । नित्यं भक्तिसमायुक्ताऽभजत्तं गणनायकम् ॥
    ५९॥ सनकाद्या ऊचुः । ब्रह्मभूता सरित्श्रेष्ठा मयूरेशं कथं प्रभो । अभजत्तस्य मार्गं नो ब्रूहि नाथ नमोऽस्तु
    ते ॥ ६०॥ शिव उवाच । ब्रह्मभूतो नरो योगी गणेशमभजत्सदा । नवधा भक्तिभावेन तत्परश्च महर्षयः ॥ ६१॥ पुत्रः
    कलत्रं जनकौ सुहृदगणो द्रव्यं सखावृत्तिजविद्यया युतम् । स्वर्गस्तु मोक्षो विविधं त्वमेव मे स्वामी गुरुर्विघ्नपतिः
    परात्परः ॥ ६२॥ सांसर्गिकं कायिकवाचिकं परं कर्माचरन्मानसजं त्रिदेहतः । ज्ञानं हृदिस्थं च मया परात्परं
    विध्नेश्वरायेति समर्पितं किल ॥ ६३॥ योगाकारेण विघ्नेश एकानेकादिसंश्रितः । भुङ्क्ते स विविधान्भोगान्
    शुभाऽशुभसमाश्रितान् ॥ ६४॥ नाहं नरः स्वयं साक्षात् क्रीडति गणनायकः । स्वामिसेवकभावेन ब्रह्मणि शोभते
    रतः ॥ ६५॥ अनेन विधिना विप्रा भजन्ते गणनायकम् । योगिनः शुकमुख्याश्च मुद्गलाद्या महर्षयः ॥ ६६॥ एतत्सर्वं
    समाख्यातं गुह्यं गणपतेर्मया । हृदयं तेन विघ्नेशं तोषयध्वं महर्षयः ॥ ६७॥ यथा देहेन्द्रियाद्येषु मुख्यं
    स्वहृदयं स्मृतम् । यत्र जीवस्वरूपेण तिष्ठति गणनायकः ॥ ६८॥ तथा गणपतेरेतद् हृदयं परिकीर्तितम् । अत्र
    योगपतिः साक्षात्तिष्ठति ब्रह्मनायकः ॥ ६९॥ अनेन गणनाथं तु यस्तोष्यति नरोत्तमः । स भुक्त्वा सकलान्भोगानन्ते
    योगमयो भवेत् ॥ ७०॥ एवं मदीयवाक्यं ते श्रुत्वा ब्रह्मसुताः परम् । प्रणम्य मां ययुः सर्वे सनकाद्यास्तपोवनम्
    ॥ ७१॥ एकाक्षरमन्त्रस्य पञ्चकं सेव्य योगिनः । गणेशहृदयं ज्ञात्वा गाणपत्या बभूविरे ॥ ७२॥ ततो नित्यं
    गणेशस्य हृदयं ते महर्षयः । जपन्ति भक्तिसंयुक्ता भ्रमन्ति स्वेच्छयेरिताः ॥ ७३॥ अतस्त्वमपि भावेन गणेशहृदयं
    परम् । सेवस्व गाणपत्येषु मुख्यस्तथा भविष्यसि ॥ ७४॥ मुद्गल उवाच । एवमुक्त्वा महानागं शेषाय प्रददौ शिवः
    । मन्त्रमेकाक्षर साङ्गं स ययौ तं प्रणम्य च ॥ ७५॥ साधयित्वा यथान्यायं हृदयज्ञो बभूव ह । नित्यं हृदयकेनैव
    तुष्टाव द्विरदाननम् ॥ ७६॥ गणेशहृदयं पुण्यं श
