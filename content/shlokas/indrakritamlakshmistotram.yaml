id: indrakritamlakshmistotram
category: stotram
name:
  english: indrakritamlakshmistotram
  devanagari: इन्द्रकृतंलक्ष्मीस्तोत्रम्
content:
  english: sampujya brahmavakyena copaharani shodasha | dadau bhaktya vidhanena pratyekam mantrapurvakam
    || 14|| indra uvaca | om namah kamalavasinyai narayanyai namo namah | krishnapriyayai sarayai padmayai
    ca namo namah || 52|| padmapatrekshanayai ca padmasyayai namo namah | padmasanayai padminyai vaishnavyai
    ca namo namah || 53|| sarvasampatsvarupayai sarvadatryai namo namah | sukhadayai mokshadayai siddhidayai
    namo namah || 54|| haribhaktipradatryai ca harshadatryai namo namah | krishnavakshasthitayai ca krishneshayai
    namo namah || 55|| krishnashobhasvarupayai ratnadhyayai namo namah | sampattyadhishthatridevyai mahadevyai
    namo namah || 56|| sasyadhishthatridevyai ca sasyalakshmyai namo namah | namo buddhisvarupayai buddhidayai
    namo namah || 57|| vaikunthe ca mahalakshmirlakshmih kshirodasagare | svargalakshmirindragehe rajalakshmirnripalaye
    || 58|| grihalakshmishca grihinam gehe ca grihadevata | surabhissa gavam mata dakshina yajnakamini
    || 59|| aditirdevamata tvam kamala kamalalaye | svaha tvam ca havirdane kavyadane svadha smrita ||
    60|| tvam hi vishnusvarupa ca sarvadhara vasundhara | shuddhasattvasvarupa tvam narayanaparayana ||
    61|| krodhahimsavarjita ca varada ca shubhanana | paramarthaprada tvam ca haridasyaprada para || 62||
    yaya vina jagatsarvam bhasmibhutamasarakam | jivanmritam ca vishvam ca shavatulyam yaya vina || 63||
    sarvesham ca para tvam hi sarvabandhavarupini | yaya vina na sambhashyo bandhavairbandhavah sada ||
    64|| tvaya hino bandhuhinastvaya yuktah sabandhavah | dharmarthakamamokshanam tvam ca karanarupini
    || 65|| stanandhayanam tvam mata shishunam shaishave yatha | tatha tvam sarvada mata sarvesham sarvavishvatah
    || 66|| tyaktastano matrihinah sa cejjivati daivatah | tvaya hino janah ko'pi na jivatyeva nishcitam
    || 67|| suprasannasvarupa tvam me prasanna bhavambike | vairigrahastadvishayam dehi mahyam sanatani
    || 68|| vayam yavattvaya hina bandhuhinashca bhikshukah | sarvasampadvihinashca tavadeva haripriye
    || 69|| rajyam dehi shriyam dehi balam dehi sureshvari | kirtim dehi dhanam dehi putranmahyam ca dehi
    vai || 70|| kamam dehi matim dehi bhogandehi haripriye | jnanam dehi ca dharmam ca sarvasaubhagyamipsitam
    || 71|| sarvadhikaramevam vai prabhavam ca pratapakam | jayam parakramam yuddhe paramaishvaryyameva
    ca || 72|| ityuktva tu mahendrashca sarvaih suraganaih saha | nanama sashrunetro'yam murdhna caiva
    punah punah || 73|| iti brahmavaivartapurane prakritikhande ekonacatvarimshadhyayantargatam indrakritam
    lakshmistotram samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 39
  devanagari: सम्पूज्य ब्रह्मवाक्येन चोपहाराणि षोडश । ददौ भक्त्या विधानेन प्रत्येकं मन्त्रपूर्वकम् ॥ १४॥
    इन्द्र उवाच । ॐ नमः कमलवासिन्यै नारायण्यै नमो नमः । कृष्णप्रियायै सारायै पद्मायै च नमो नमः ॥ ५२॥ पद्मपत्रेक्षणायै
    च पद्मास्यायै नमो नमः । पद्मासनायै पद्मिन्यै वैष्णव्यै च नमो नमः ॥ ५३॥ सर्वसम्पत्स्वरूपायै सर्वदात्र्यै
    नमो नमः । सुखदायै मोक्षदायै सिद्धिदायै नमो नमः ॥ ५४॥ हरिभक्तिप्रदात्र्यै च हर्षदात्र्यै नमो नमः ।
    कृष्णवक्षस्थितायै च कृष्णेशायै नमो नमः ॥ ५५॥ कृष्णशोभास्वरूपायै रत्नाढ्यायै नमो नमः । सम्पत्त्यधिष्ठातृदेव्यै
    महादेव्यै नमो नमः ॥ ५६॥ सस्याधिष्ठातृदेव्यै च सस्यलक्ष्म्यै नमो नमः । नमो बुद्धिस्वरूपायै बुद्धिदायै
    नमो नमः ॥ ५७॥ वैकुण्ठे च महालक्ष्मीर्लक्ष्मीः क्षीरोदसागरे । स्वर्गलक्ष्मीरिन्द्रगेहे राजलक्ष्मीर्नृपालये
    ॥ ५८॥ गृहलक्ष्मीश्च गृहिणां गेहे च गृहदेवता । सुरभिस्सा गवां माता दक्षिणा यज्ञकामिनी ॥ ५९॥ अदितिर्देवमाता
    त्वं कमला कमलालये । स्वाहा त्वं च हविर्दाने कव्यदाने स्वधा स्मृता ॥ ६०॥ त्वं हि विष्णुस्वरूपा च सर्वाधारा
    वसुन्धरा । शुद्धसत्त्वस्वरूपा त्वं नारायणपरायणा ॥ ६१॥ क्रोधहिंसावर्जिता च वरदा च शुभानना । परमार्थप्रदा
    त्वं च हरिदास्यप्रदा परा ॥ ६२॥ यया विना जगत्सर्वं भस्मीभूतमसारकम् । जीवन्मृतं च विश्वं च शवतुल्यं
    यया विना ॥ ६३॥ सर्वेषां च परा त्वं हि सर्वबान्धवरूपिणी । यया विना न सम्भाष्यो बान्धवैर्बान्धवः सदा
    ॥ ६४॥ त्वया हीनो बन्धुहीनस्त्वया युक्तः सबान्धवः । धर्मार्थकाममोक्षाणां त्वं च कारणरूपिणी ॥ ६५॥ स्तनन्धयानां
    त्वं माता शिशूनां शैशवे यथा । तथा त्वं सर्वदा माता सर्वेषां सर्वविश्वतः ॥ ६६॥ त्यक्तस्तनो मातृहीनः
    स चेज्जीवति दैवतः । त्वया हीनो जनः कोऽपि न जीवत्येव निश्चितम् ॥ ६७॥ सुप्रसन्नस्वरूपा त्वं मे प्रसन्ना
    भवाम्बिके । वैरिग्रहस्तद्विषयं देहि मह्यं सनातनि ॥ ६८॥ वयं यावत्त्वया हीना बन्धुहीनाश्च भिक्षुकाः
    । सर्वसम्पद्विहीनाश्च तावदेव हरिप्रिये ॥ ६९॥ राज्यं देहि श्रियं देहि बलं देहि सुरेश्वरि । कीर्तिं
    देहि धनं देहि पुत्रान्मह्यं च देहि वै ॥ ७०॥ कामं देहि मतिं देहि भोगान्देहि हरिप्रिये । ज्ञानं देहि
    च धर्मं च सर्वसौभाग्यमीप्सितम् ॥ ७१॥ सर्वाधिकारमेवं वै प्रभावं च प्रतापकम् । जयं पराक्रमं युद्धे परमैश्वर्य्यमेव
    च ॥ ७२॥ इत्युक्त्वा तु महेन्द्रश्च सर्वैः सुरगणैः सह । ननाम साश्रुनेत्रोऽयं मूर्ध्ना चैव पुनः पुनः
    ॥ ७३॥ इति ब्रह्मवैवर्तपुराणे प्रकृतिखण्डे एकोनचत्वारिंशाध्यायान्तर्गतं इन्द्रकृतं लक्ष्मीस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय ३९
