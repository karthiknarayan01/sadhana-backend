id: sahana-vavatu
category: shanti_mantra
name:
  english: Sahana Vavatu
  devanagari: सह नाववतु
content:
  english: >-
    om saha navavatu, saha nau bhunaktu, saha viryam karavavahai,
    tejasvi navadhitam astu ma vidvishavahai
  devanagari: >-
    ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥
meaning:
  english: >-
    May we be protected together, nourished together, may we work
    with vigor together; may our study be brilliant, and may there
    be no ill will between us.
source_attribution:
  text_source: Taittiriya Upanishad shanti mantra (also cited in the Katha Upanishad tradition)
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
