id: mahalekhinistavarajastotram
category: kavacha
name:
  english: mahalekhinistavarajastotram
  devanagari: महालेखिनीस्तवराजस्तोत्रम्
content:
  english: '|| viniyogah || om asya shrimahalekhinistavarajastotramalamahakavacasya | antaryami rishih
    | anushtupchandah | shrimattripurasundari devata | vashinyadhidevatabijam | madhyadevata shaktih |
    ratnadvipam kilakam | shrilekhinidarshanasiddhyarthe jape viniyogah || || mulamantrah || om hrim shrim
    ratnadvipadarshite darshaya darshaya mama | anekajanmasancitasarvapapajalam chindhi chindhi | cetaya
    cetaya atmatattvam | mantrayantrabrahmandavijnanam darshaya darshaya | hum phat svaha || || rishyadinyasah
    || antaryamirishaye namah shirasi | anushtupchandase namah mukhe | shrimattripurasundaridevatayai
    namah hridi | vashinyadhidevatabijaya namah guhye | madhyadevatashaktaye namah padayoh | ratnadvipakilakaya
    namah sarvange || || karanyasah || om hrim shrim angushthabhyam namah | ratnadvipadarshite tarjanibhyam
    namah | darshaya darshaya madhyamabhyam namah | mama anekajanmasancitasarvapapajalam chindhi chindhi
    anamikabhyam namah | cetaya cetaya atmatattvam kanishthikabhyam namah | mantrayantrabrahmandavijnanam
    darshaya darshaya | hum phat svaha karatalakaraprishthabhyam namah || || shadanganyasah || om hrim
    shrim ratnadvipadarshite darshaya darshaya mama hridayaya namah | anekajanmasancitasarvapapajalam
    chindhi chindhi shirase svaha | cetaya cetaya atmatattvam shikhayai vashat | mantrayantrabrahmandavijnanam
    darshaya darshaya | kavacaya hum | hum phat netratrayaya vaushat | svaha astraya phat | bhurbhuvahsvaromiti
    digbandhah || || dhyanam || ratnadvipe sudhasindhormadhye cintamanigrihe | lekhinim cinmayim vande
    shrimatim tripureshvarim || dakshine lekhinim dharyam vame cintamanim shubham | mandasmitamukhim devim
    dhyayet shrilekhinishvarim || atha stotram | lekhinistavarajasya kavacasyantaryami rishih | chando''nushtup
    samakhyatam devata tripureshvari || 1|| vashini bijarupa ca madhyadevata shaktika | ratnadvipam mahakilam
    lekhinidarshanaya ca || 2|| dhyayennirastakalam tadratnadvipam manoramam | yatranandasudhasindhurlolavicivilasavan
    || 3|| yatra cintamanibhittirmuktajalavirajita | yatra kalpalatah sarva nityavasantashobhitah || 4||
    yatra vashinimukhyashca vagdevyo mridubhashinah | yatra yoginya udyukta rakshanotsukamanasah || 5||
    yatra simhasane divye sahasradityadidhitau | virajate jaganmata shrimati mandahasini || 6|| mrinalakomalangi
    sa bimbadharavirajita | sharaccandranibhapangi navakunkumapatala || 7|| tasya ajnam samadaya devyo
    divyavapurdharah | ayanti bhaktarakshartham premanirbharamanasah || 8|| tada candrashilasara shashibimbavilasini
    | mama murdhanamavyagram shrijika parirakshatu || 9|| brahmarandhrasarojastham divyatejovikasakam
    | sudhamekhalini devi shikhadeshe''vatad mama || 10|| lalataphalakam patu sindurarunabhasura | kadambakusumamoda
    malati mridulasmita || 11|| bhrulatakunjamadhyastha madhupali manohara | manorajyasya simantam madhavi
    parirakshatu || 12|| netrayorindukallolaprasannadyutidharini | kamalakshi sudhadrishtirmama drishtim
    vivardhayet || 13|| drigantasimni gopali venunadavimohini | karunarasasandoham nirantaramudancayet
    || 14|| pakshmamalavilaseshu nilabhringaniketana | shyamarekha sada patu saundaryamritavarshini ||
    15|| karnadvare katharatnapravahaprerika shubha | gitagopanavidushi gopini parirakshatu || 16|| shrutisarasamuddhartri
    shrutimargavisharada | nadamanjarika devi karnamulam sadavatu || 17|| nasavamshe sugandhadhya parijatasugandhini
    | pranalakshmih sada patu pranamargaprabodhini || 18|| kapolayorarunima patalambhojavasini | lajjaratnaprada
    devi mriduvrittim prayacchatu || 19|| oshthayoradharamoda bimbaphalaprabhojjvala | smitacandrikaya
    nityam vadanam parirakshatu || 20|| rasanagre sarojasya vagamritapravahini | shabdabrahmamayi devi
    jihvam me paripalayet || 21|| dantapanktau sudhashuktimuktamalavibhushita | hasajyotsnamayi devi dantarajimavatviti
    || 22|| hanudeshe hemarekha cibuke carucandrika | vaksaundaryaprada devi saumyabhavam prayacchatu
    || 23|| grivayam gitamadhuryadharini ragavallari | kanthanalam sada patu kokilasvaramanjari || 24||
    skandhayorambaradhara manikancanabhushita | dhairyasampatprada devi bhujaviryam vivardhayet || 25||
    bahudandadvaye patu jayamalavibhushana | karmasiddhiprada nityam vijayashrirmanorama || 26|| kurparadvandvamatyugrakarmavighnavinashini
    | manibandhe manijyotirmekhala parirakshatu || 27|| karapadmadvaye patu padmahastika shubha | ratnanguliyakadhara
    saubhagyambhodhivardhini || 28|| anguliparvasu shrida nakharajishu candrika | sparshatattvasya rakshartham
    snehamanjarika shubha || 29|| urasi shrinikunjastha premapiyushavarshini | hridambuje lalita patu
    rahasyanandadayini || 30|| hritpadmakarnikamadhye cinmayukhaprakashini | shrishridevi sadapatu bhaktibhavapravardhini
    || 31|| stanayoramritapurapuritasvarnakumbhayoh | kshirasindhusuta devi matribhavam prayacchatu ||
    32|| stanagrayorarunima bandhukakusumaprabha | lajjamanjarika patu komalatvam dadatu me || 33|| parshvayoh
    padmarenuna mandamarutacalini | saumyacchaya sadapatu shantisancarakarini || 34|| nabhikupe jagadbijaprarohaparameshvari
    | nabhipadmam sada patu vishvayonivilasini || 35|| manipure mahashrishca suvarnambudhivasini | dhairyaratnaprada
    nityam vahnitattvam vivardhayet || 36|| katideshe kalakancijhankararavasundari | ratnamekhalini patu
    lasyalilavilasini || 37|| shronipithe shashankabha manikyambaradharini | rajarajeshvari patu saundaryarnavamadhyaga
    || 38|| sphicau sindurashonangi komalangulicalitam | ramyacamarasevitya ramaniya sadavatu || 39||
    guhyadeshe mahaguhya kulakunjaniketana | rahasyakusumamoda yogamudra sadavatu || 40|| yonimandalamadhyastha
    vishvabijaprasurmahi | kamakalyanika patu srishtirahasyarupini || 41|| yonidvaram sadapatu trailokyajanani
    shubha | ratnagarbha jagaddhatri sarvasiddhiprasurmama || 42|| garbhashayam sudhapurnam hemapadmavibhushitam
    | bhuvanambhojanilaya matribhavena rakshatu || 43|| bijakshetram param divyam mayamuktipradayakam
    | adyashaktih sada patu nityasrishtividhayini || 44|| urudvandve maralinam gatigarvavinashini | mrinalarekhika
    patu lavanyamritavarshini || 45|| januni janakishrishca bhaktisaurabhavarshini | tarini duhkhasindhunam
    paramavahadastu me || 46|| janghadvaye jaganmoha nilotpalavilocana | saukumaryaprada devi gamanashrim
    prayacchatu || 47|| gulphayorindulekha ca manjunupuranihsvana | ratnaghantarava patu shubhamargapradarshini
    || 48|| padapadmadvayam patu padmahasta saroruha | lakshmirlolalakashreni premasindhupravahini ||
    49|| padangulishu kalyani muktarashmivibhushita | bhumisparshe''pi me nityam punyavriddhim prayacchatu
    || 50|| prishthavamshe prabhamala merumadhyanivasini | kundalibhutacidvahnim jagarukam karotu me ||
    51|| merudande mahavidya yoginiyogavallabha | sukshmanadisahasranam sancaram parirakshatu || 52||
    asthisanghatamakhilam vajrashuktiprabhojjvala | sthairyasampatprada devi sadavatvacalam tanum || 53||
    mamsapeshishu mandara raktarenuprakashini | balapushtiprada patu jivanotsahavardhini || 54|| raktadharasu
    ragashrirjivanamritavahini | majjadhatau mahamedha jnanagarbha sadavatu || 55|| tvaci campakagaurangi
    saukumaryaikamandira | sparshamatrena saubhagyam vitanotu nirantaram || 56|| romarajishu romancaprerini
    premarupini | bhaktisanjataharshanam karanam parirakshatu || 57|| prane praneshvari patu pranavegaprabodhini
    | apane''panagamana doshajalavinashini || 58|| vyane vyapakasancara sarvadehapracarini | udane vimalotkarsha
    cittamargaprakashini || 59|| samane samatarupa tattvasantulanaprada | pancapranamayi devi sarvatha
    parirakshatu || 60|| nage nagapriya patu kurme kurmagatiprada | krikare kirtida devi devadatte shubhaprada
    || 61|| dhananjaye ca me nityam deharakshavidhayini | upapranaganam sarvam matribhavena rakshatu ||
    62|| muladhare mahalakshmih kancanacalavasini | sthairyaratnaprada patu bhushaktim paripalayet ||
    63|| svadhishthane sudhadhara kamakelivilasini | srishtisaundaryasaram me nityayuktam karotu ca ||
    64|| manipure mahashobha vahnikotisamaprabha | tejorashim sadapatu viryasampatpradayini || 65|| anahate
    lalitamba premapiyushavarshini | hridayambhodhimadhye mam karunabhih plavayet || 66|| vishuddhau shuddhavagdevi
    gitagangapravahini | mantrasaraprada nityam kanthamandalamavishet || 67|| ajnacakre mahajyotirbhanukotiprakashini
    | sarvasandehasamhartri buddhidipam vivardhayet || 68|| sahasrare sadananda candrasuryagnilocana |
    amritadharaya nityam snapayatvantaram mama || 69|| tatah simhasanotthaya smitacandravibhushita | shrimati
    bhaktarakshartham shaktisanghanacodayat || 70|| ajnamatrena tasyashca divyah shaktyah sahasrashah
    | ratnadipashikhakarah samayanti disho dasha || 71|| purvadvare padmarekha patu padmadalakshana |
    dakshine kanakaprakhya hemamanjiranihsvana || 72|| pashcime premamanjarya karunarasavarshini | uttare
    candramalabha shantidharam prasarayet || 73|| agneyyam vahnijihvabha tejahpunjavikasini | nairityam
    bhishanacchaya dushtavyuhavinashini || 74|| vayavye venunadastha gopalilavilasini | aishanye cinmayukhabha
    brahmavidyaprakashini || 75|| urdhvadeshe sudhasara divyamritanishevita | adhastad bhuvanadhara dhritishaktih
    sadavatu || 76|| griheshu grihalakshmirme prakaram parirakshatu | dvare dvare jayadvarya shubhalakshmirniveshita
    || 77|| shayyayam shayanamoda svapnavighnavinashini | nidrayam yoganidra me cittashuddhim prayacchatu
    || 78|| prabhate bhanulekhabha jagaranaprabodhini | madhyahne madhavi patu karmasiddhivivardhini ||
    79|| sayahne sandhyaramani raktameghavilasini | ardharatre rahasyeshi yogamargaprakashini || 80||
    margamadhye maralakshi durayatrasu rakshatu | vanamadhye vanamala simhavyaghrabhayapaha || 81|| salile
    salilakara naukayatrasu rakshatu | parvate parvatastha sa durgamargapradarshini || 82|| rajasabhyamritavani
    vaksiddhim parirakshatu | vidvatsabhasu vagishi shastradipam vivardhayet || 83|| yuddhabhumau jayajyotirdhairyagarjitadayini
    | shatrumadhye kshamarupa krodhavahnim nirodhayet || 84|| senamadhye sharaccandra sankalpam paripalayet
    | ashvayanaratharudhe vijayashrih sadavatu || 85|| vanijye vasudhadhisha nidhivrishtim prayacchatu
    | krishikshetre dhanyalakshmih purnashasyam vivardhayet || 86|| goshthamadhye gopasundari snehadharam
    pravarshatu | balakeshu jaganmata saumyabhavam prayacchatu || 87|| vidyayam vidyulallekha granthagarbhaprakashini
    | kavyeshu kavitamata rasadharam prasarayet || 88|| gitavidyam gitamala nritye nartanasundari | citrakarmani
    citreshi rupakalpanadayini || 89|| tantramarge rahasyajna mantrabijaprabodhini | yogamarge yogamaya
    cittavrittinirodhini || 90|| dharme dharmaprabha patu arthe sampatpradayini | kame kamakalarupa mokshe
    mokshapradayini || 91|| mitramadhye priyalapa sauhardasya vivardhini | bandhaveshu dayasara premabandhaprarakshini
    || 92|| dampatye madhurilakshmih saukhyavrishtim prayacchatu | santane jananidevi vamshadipam vivardhayet
    || 93|| kirtau kirtikalapurna yashodhara sadavatu | bhagye bhagyasarojakshi punyasancayakarini ||
    94|| rogakale sudhasindhurdhatusamyapradayini | shokakale smitajyotih hridayanandakarini || 95|| durbhikshe
    dhanyavarshinyannapurna sadavatu | apadam parvate ghore durga durgatinashini || 96|| drishtidoshe
    drigamboja bhutadoshe bhayapaha | grahapidasu kaleshi grahajalavibhedini || 97|| vishavege sudhasara
    dahavege himaprabha | aranye nirjane marge matribhavena rakshatu || 98|| vipattishu vishalakshi sampattau
    vinayaprada | siddhau saumyasvabhava ca nashayedabhimanakam || 99|| evam shaktiganairyukta ratnadipasamujjvala
    | shrimati bhaktamalokya smitapurvamuvaca ha || 100|| tatah smeramukhi devi sudhabindunibhekshana
    | karunakulahridaya bhaktamenamabhashata || 101|| ma bhaishirvatsa sarvatra mama premavasho''si me
    | ityuktva shakticakrani samantadvyadadhatsa || 102|| tatastaraganakarah shaktayah kotishah shubhah
    | muktaharalasadbhaso dehamenam samavishan || 103|| cittakashe cidabhasa cintamanivilasini | sankalpamanjari
    patu manorajyam nirantaram || 104|| buddhau bodhasariddevi tattvadipaprakashini | nirnayeshu nirabadham
    prajnam me samprayacchatu || 105|| smritau smeramukhi patu vedarthaparibodhini | vismritau capi me
    devi margadarshanadayini || 106|| ahankaraguham patu nirmaladarshalocana | madadarpavinirmuktim saumyabhavam
    prayacchatu || 107|| manasah kamalantastham mandakinyah sudharasam | manomanjulika patu bhavasaundaryavardhini
    || 108|| bhaveshu bhavagamya sa premasaraikajivika | harshe hemaprabha patu duhkhe dhairyapradayini
    || 109|| lajjayam lajjitambhoja kirtau kirtivilasini | shraddhayam shraddhikashrishca bhaktau bhaktipravardhini
    || 110|| icchashaktim sadapatu kamabijaprakashini | jnanashaktim ca me patu cinmayukhapravahini ||
    111|| kriyashaktim kriyamata karmamargaprabodhini | trishaktirupini devi sarvatah parirakshatu ||
    112|| nadicakreshu sarveshu sudhasrotahpravahini | idayam candralekheva pingalayam raviprabha || 113||
    sushumnayam para jyotih kundalikusumapriya | brahmanadim sadapatu muktidvaraprakashini || 114|| bije
    bijartharupa sa shabde shabdasvarupini | varneshu matrikadevi mantreshu mantrarupini || 115|| akshareshvaksharakara
    vedeshu vedavallabha | tantreshu tantrahridaya yantreshu yantrarakshini || 116|| kale kalavilasadhya
    kshane kshanavikasini | muhurte mangalaprajna divasam parirakshatu || 117|| pakshe purnakalashrishca
    mase masavivardhini | ritushu ritumati patu samvatsaravidhayini || 118|| janmasthane janmamata balye
    balarkasundari | kaumare kusumapida yauvane yauvaneshvari || 119|| garhasthye grihasaubhagya vanavase
    tapasvini | vardhake jnanaganga ca ante nirvanadayini || 120|| pitrinam punyarekha ca matrinam matrimandala
    | vamshavrikshasya mulastha kuladipa sadavatu || 121|| bhratrinam snehamaladhya suhridam hridayeshvari
    | gurunam jnanagambhira shishyanugrahakarini || 122|| ratnakoshe ratnamala dhanyakoshe dhaneshvari
    | gajavajidhanadinam vriddhim me samprayacchatu || 123|| kshetre kshetrapriya patu grame gramavilasini
    | nagare nagaradhisha rashtre rajyapradayini || 124|| bhugarbhe nidhidatri ca toyagarbhe sudhamayi
    | vyomni vyomavilasadhya dishah sarvah sadavatu || 125|| yakshinyah kinnarivrinda gandharvyah siddhayoshitah
    | tasyah parshvagatah sarvah raksham kurvantu me sada || 126|| vashinyadyah samastashca yoginyo mantrakovidah
    | matrikacakrasamyukta dehamenam samavishan || 127|| kadambakanane ramye ratnadvipe manorame | cintamanigrihe
    divye simhasanavirajita || 128|| shrijika shrimati devi shridevi shriniketana | gopali gopini ramya
    madhavi madhumanjari || 129|| malati mridulapangi candrarekhavilasini | kamalahasta padmakshi hemakancanabhushana
    || 130|| bhaktamalokya sasneham karunardrakatakshini | rakshavyuham samutsrijya hridaye samatishthata
    || 131|| hridambuje tatah shanta cinmayukhavibhasura | anantakotibrahmandasaundaryaikasvarupini ||
    132|| lalita paramapremna parabrahmasvarupini | ante maheshvari divya mahasundaryavatsala || 133||
    mahasundari mam patu bahirantarnirantaram | jagratsvapnasushuptishu sarvavasthasu sarvada || 134||
    evam rakshamayim devim hridayambhojasamsthitam | dhyayan sadhakavaryo''sau premanirbharamanasah ||
    135|| tada ratnamaye dvipe sudhasindhostarangini | utthaya mandahasadhya devi vikshya kripamayi ||
    136|| vitatana caturdikshu cidvilasamayim prabham | yaya vyaptamidam sarvam drishyadrishyam caracaram
    || 137|| tasya dehe tada divyam kavacam bhavarupakam | na dipyate kevalam bahye hridayantargate''pi
    ca || 138|| yatra yatra padam dhatte kavacenavrito narah | tatra tatra svayam devi purvameva pratiyate
    || 139|| akavaco na gantavyam sadhakena kadacana | ya icchedbrahmabhavam ca raksham ca nirupadravam
    || 140|| ekamapyatha padam yo rakshahino niveshayet | sa mudho margamutsrijya chayamevabhidhavati
    || 141|| kavacenavrito nityam brahmabhavaparayanah | calannapi sthito vapi dhyanastha iva drishyate
    || 142|| tam drishtva bhutasanghashca pretavetalarakshasah | pishaca brahmarakshamsi yakshinyo guhyacarinah
    || 143|| duradeva palayante vahnidagdha iva drumah | namashravanamatrena bhitacitta disho yayuh ||
    144|| antarikshacarah krura adrishyashca vighatakah | grahabandhakara dushta mayajalapravartakah ||
    145|| na sprashtum shaktimapnoti kavacastham mahashayam | yatah shrimaticakrena parivito bhavedasau
    || 146|| trailokyavijayam nama tasya haste pratishthitam | na shastrairna ca mantraishca na yuktya
    na parakramaih || 147|| yadi shakrah svayam kruddho yadi vishnurvirodhakrit | yadi lokapatih kashcidviparitamanah
    bhavet || 148|| tathapi rakshati kshipram tam shaktih parameshvari | yato yesham prasuta sa te tasyah
    kim karishyati || 149|| yasya dveshti mahabhagam kavacastham nirantaram | tasya bhagyalatam kruddha
    lekhinishvari likhet || 150|| nashyanti tasya saubhagyam mitravargo dhanagamah | yah karanam vina
    nityam sadhakam pidayed dhruvam || 151|| kavacasyasya pathena japtena manasa saha | bahavo mantratantradya
    svayameva phalapradah || 152|| nanyadashrayaniyam syat sadhakasya visheshatah | yada matrikripa jata
    kavacenaiva kevalam || 153|| vighnartham gajavaktram ca jana yanti punah punah | vairagyajnanalabhaya
    rudram yanti tapasvinah || 154|| mokshartham vishnumashritya suryam cakshuhpravriddhaye | bhogamokshapradam
    devim dhanartham kamalalayam || 155|| kintu yasyam padambhoje sarva ete kritanjalih | tam lekhinishvarim
    nityam kecit jananti durlabham || 156|| sa svayampurnasamarthya sarvadanaikatatpara | yatphalam devatabhedairlabhyate
    bahusevaya || 157|| tatsarvam labhate sadyah kavacasyasya dharakah | anugrahena matraikya shrimatiparameshvarya
    || 158|| iti shrisiddhashramatantre siddhayogisamvade jagadvyapiniparabrahmani'
  devanagari: ॥ विनियोगः ॥ ॐ अस्य श्रीमहालेखिनीस्तवराजस्तोत्रमालामहाकवचस्य । अन्तर्यामी ऋषिः । अनुष्टुप्छन्दः
    । श्रीमत्त्रिपुरसुन्दरी देवता । वाशिन्याधिदेवताबीजम् । मध्यदेवता शक्तिः । रत्नद्वीपं कीलकम् । श्रीलेखिनीदर्शनसिद्ध्यर्थे
    जपे विनियोगः ॥ ॥ मूलमन्त्रः ॥ ॐ ह्रीं श्रीं रत्नद्वीपदर्शिते दर्शय दर्शय मम । अनेकजन्मसञ्चितसर्वपापजालं
    छिन्धि छिन्धि । चेतय चेतय आत्मतत्त्वम् । मन्त्रयन्त्रब्रह्माण्डविज्ञानं दर्शय दर्शय । हुं फट् स्वाहा
    ॥ ॥ ऋष्यादिन्यासः ॥ अन्तर्यामिऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । श्रीमत्त्रिपुरसुन्दरीदेवतायै
    नमः हृदि । वाशिन्याधिदेवताबीजाय नमः गुह्ये । मध्यदेवताशक्तये नमः पादयोः । रत्नद्वीपकीलकाय नमः सर्वाङ्गे
    ॥ ॥ करन्यासः ॥ ॐ ह्रीं श्रीं अङ्गुष्ठाभ्यां नमः । रत्नद्वीपदर्शिते तर्जनीभ्यां नमः । दर्शय दर्शय मध्यमाभ्यां
    नमः । मम अनेकजन्मसञ्चितसर्वपापजालं छिन्धि छिन्धि अनामिकाभ्यां नमः । चेतय चेतय आत्मतत्त्वं कनिष्ठिकाभ्यां
    नमः । मन्त्रयन्त्रब्रह्माण्डविज्ञानं दर्शय दर्शय । हुं फट् स्वाहा करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः
    ॥ ॐ ह्रीं श्रीं रत्नद्वीपदर्शिते दर्शय दर्शय मम हृदयाय नमः । अनेकजन्मसञ्चितसर्वपापजालं छिन्धि छिन्धि
    शिरसे स्वाहा । चेतय चेतय आत्मतत्त्वं शिखायै वषट् । मन्त्रयन्त्रब्रह्माण्डविज्ञानं दर्शय दर्शय । कवचाय
    हुम् । हुं फट् नेत्रत्रयाय वौषट् । स्वाहा अस्त्राय फट् । भूर्भुवःस्वरोमिति दिग्बन्धः ॥ ॥ ध्यानम् ॥
    रत्नद्वीपे सुधासिन्धोर्मध्ये चिन्तामणिगृहे । लेखिनीं चिन्मयीं वन्दे श्रीमतीं त्रिपुरेश्वरीम् ॥ दक्षिणे
    लेखिनीं धार्यां वामे चिन्तामणिं शुभाम् । मन्दस्मितमुखीं देवीं ध्यायेत् श्रीलेखिनीश्वरिम् ॥ अथ स्तोत्रम्
    । लेखिनीस्तवराजस्य कवचस्यान्तर्यामी ऋषिः । छन्दोऽनुष्टुप् समाख्यातं देवता त्रिपुरेश्वरी ॥ १॥ वाशिनी
    बीजरूपा च मध्यदेवता शक्तिका । रत्नद्वीपं महाकीलं लेखिनीदर्शनाय च ॥ २॥ ध्यायेन्निरस्तकालं तद्रत्नद्वीपं
    मनोरमम् । यत्रानन्दसुधासिन्धुर्लोलवीचिविलासवान् ॥ ३॥ यत्र चिन्तामणीभित्तिर्मुक्ताजालविराजिता । यत्र
    कल्पलताः सर्वा नित्यवसन्तशोभिताः ॥ ४॥ यत्र वाशिनिमुख्याश्च वाग्देव्यो मृदुभाषिणः । यत्र योगिन्य उद्युक्ता
    रक्षणोत्सुकमानसाः ॥ ५॥ यत्र सिंहासने दिव्ये सहस्रादित्यदीधितौ । विराजते जगन्माता श्रीमती मन्दहासिनी
    ॥ ६॥ मृणालकोमलाङ्गी सा बिम्बाधरविराजिता । शरच्चन्द्रनिभापाङ्गी नवकुङ्कुमपाटला ॥ ७॥ तस्या आज्ञां समादाय
    देव्यो दिव्यवपुर्धराः । आयान्ति भक्तरक्षार्थं प्रेमनिर्भरमानसाः ॥ ८॥ तदा चन्द्रशिलासारा शशिबिम्बविलासिनी
    । मम मूर्धानमव्यग्रं श्रीजिका परिरक्षतु ॥ ९॥ ब्रह्मरन्ध्रसरोजस्थं दिव्यतेजोविकासकम् । सुधामेखलिनी
    देवी शिखादेशेऽवताद् मम ॥ १०॥ ललाटफलकं पातु सिन्दूरारुणभासुरा । कदम्बकुसुमामोदा मालती मृदुलस्मिता ॥
    ११॥ भ्रूलताकुञ्जमध्यस्था मधुपाली मनोहरा । मनोराज्यस्य सीमन्तं माधवी परिरक्षतु ॥ १२॥ नेत्रयोरिन्दुकल्लोलप्रसन्नद्युतिधारिणी
    । कमलाक्षी सुधादृष्टिर्मम दृष्टिं विवर्धयेत् ॥ १३॥ दृगन्तसीम्नि गोपाली वेणुनादविमोहिनी । करुणारससन्दोहं
    निरन्तरमुदञ्चयेत् ॥ १४॥ पक्ष्ममालाविलासेषु नीलभृङ्गनिकेतना । श्यामरेखा सदा पातु सौन्दर्यामृतवर्षिणी
    ॥ १५॥ कर्णद्वारे कथारत्नप्रवाहप्रेरिका शुभा । गीतगोपनविदुषी गोपिनी परिरक्षतु ॥ १६॥ श्रुतिसारसमुद्धर्त्री
    श्रुतिमार्गविशारदा । नादमञ्जरिका देवी कर्णमूलं सदावतु ॥ १७॥ नासावंशे सुगन्धाढ्या पारिजातसुगन्धिनी
    । प्राणलक्ष्मीः सदा पातु प्राणमार्गप्रबोधिनी ॥ १८॥ कपोलयोररुणिमा पाटलाम्भोजवासिनी । लज्जारत्नप्रदा
    देवी मृदुवृत्तिं प्रयच्छतु ॥ १९॥ ओष्ठयोरधरामोदा बिम्बफलप्रभोज्ज्वला । स्मितचन्द्रिकया नित्यं वदनं
    परिरक्षतु ॥ २०॥ रसनाग्रे सरोजास्या वागमृतप्रवाहिनी । शब्दब्रह्ममयी देवी जिह्वां मे परिपालयेत् ॥ २१॥
    दन्तपङ्क्तौ सुधाशुक्तिमुक्तामालाविभूषिता । हासज्योत्स्नामयी देवी दन्तराजिमवत्विति ॥ २२॥ हनुदेशे हेमरेखा
    चिबुके चारुचन्द्रिका । वाक्सौन्दर्यप्रदा देवी सौम्यभावं प्रयच्छतु ॥ २३॥ ग्रीवायां गीतमाधुर्यधारिणी
    रागवल्लरी । कण्ठनालं सदा पातु कोकिलस्वरमञ्जरी ॥ २४॥ स्कन्धयोरम्बरधरा मणिकाञ्चनभूषिता । धैर्यसम्पत्प्रदा
    देवी भुजवीर्यं विवर्धयेत् ॥ २५॥ बाहुदण्डद्वये पातु जयमालाविभूषणा । कर्मसिद्धिप्रदा नित्यं विजयश्रीर्मनोरमा
    ॥ २६॥ कूर्परद्वन्द्वमत्युग्रकर्मविघ्नविनाशिनी । मणिबन्धे मणिज्योतिर्मेखला परिरक्षतु ॥ २७॥ करपद्मद्वये
    पातु पद्महस्तिका शुभा । रत्नाङ्गुलीयकधरा सौभाग्याम्भोधिवर्धिनी ॥ २८॥ अङ्गुलीपर्वसु श्रीदा नखराजिषु
    चन्द्रिका । स्पर्शतत्त्वस्य रक्षार्थं स्नेहमञ्जरिका शुभा ॥ २९॥ उरसि श्रीनिकुञ्जस्था प्रेमपीयूषवर्षिणी
    । हृदम्बुजे ललिता पातु रहस्यानन्ददायिनी ॥ ३०॥ हृत्पद्मकर्णिकामध्ये चिन्मयूखप्रकाशिनी । श्रीश्रीदेवी
    सदापातु भक्तिभावप्रवर्धिनी ॥ ३१॥ स्तनयोरमृतापूरपूरितस्वर्णकुम्भयोः । क्षीरसिन्धुसुता देवी मातृभावं
    प्रयच्छतु ॥ ३२॥ स्तनाग्रयोररुणिमा बन्धूककुसुमप्रभा । लज्जामञ्जरिका पातु कोमलत्वं ददातु मे ॥ ३३॥ पार्श्वयोः
    पद्मरेणूना मन्दमारुतचालिनी । सौम्यच्छाया सदापातु शान्तिसञ्चारकारिणी ॥ ३४॥ नाभिकूपे जगद्बीजप्ररोहपरमेश्वरी
    । नाभिपद्मं सदा पातु विश्वयोनिविलासिनी ॥ ३५॥ मणिपूरे महाश्रीश्च सुवर्णाम्बुधिवासिनी । धैर्यरत्नप्रदा
    नित्यं वह्नितत्त्वं विवर्धयेत् ॥ ३६॥ कटिदेशे कलाकाञ्चीझङ्काररवसुन्दरी । रत्नमेखलिनी पातु लास्यलीलाविलासिनी
    ॥ ३७॥ श्रोणीपीठे शशाङ्काभा माणिक्याम्बरधारिणी । राजराजेश्वरी पातु सौन्दर्यार्णवमध्यगा ॥ ३८॥ स्फिचौ
    सिन्दूरशोणाङ्गी कोमलाङ्गुलिचालिताम् । रम्यचामरसेवित्या रमणीया सदावतु ॥ ३९॥ गुह्यदेशे महागुह्या कुलकुञ्जनिकेतना
    । रहस्यकुसुमामोदा योगमुद्रा सदावतु ॥ ४०॥ योनिमण्डलमध्यस्था विश्वबीजप्रसूर्मही । कामकल्याणिका पातु
    सृष्टिरहस्यरूपिणी ॥ ४१॥ योनिद्वारं सदापातु त्रैलोक्यजननी शुभा । रत्नगर्भा जगद्धात्री सर्वसिद्धिप्रसूर्मम
    ॥ ४२॥ गर्भाशयं सुधापूर्णं हेमपद्मविभूषितम् । भुवनाम्भोजनिलया मातृभावेन रक्षतु ॥ ४३॥ बीजक्षेत्रं परं
    दिव्यं मायामुक्तिप्रदायकम् । आद्यशक्तिः सदा पातु नित्यसृष्टिविधायिनी ॥ ४४॥ ऊरुद्वन्द्वे मरालीनां गतिगर्वविनाशिनी
    । मृणालरेखिका पातु लावण्यामृतवर्षिणी ॥ ४५॥ जानुनी जानकीश्रीश्च भक्तिसौरभवर्षिणी । तारिणी दुःखसिन्धूनां
    पारमावहदस्तु मे ॥ ४६॥ जङ्घाद्वये जगन्मोहा नीलोत्पलविलोचना । सौकुमार्यप्रदा देवी गमनश्रीं प्रयच्छतु
    ॥ ४७॥ गुल्फयोरिन्दुलेखा च मञ्जुनूपुरनिःस्वना । रत्नघण्टारवा पातु शुभमार्गप्रदर्शिनी ॥ ४८॥ पादपद्मद्वयं
    पातु पद्महस्ता सरोरुहा । लक्ष्मीर्लोलालकश्रेणी प्रेमसिन्धुप्रवाहिनी ॥ ४९॥ पादाङ्गुलीषु कल्याणी मुक्तारश्मिविभूषिता
    । भूमिस्पर्शेऽपि मे नित्यं पुण्यवृद्धिं प्रयच्छतु ॥ ५०॥ पृष्ठवंशे प्रभामाला मेरुमध्यनिवासिनी । कुण्डलीभूतचिद्वह्निं
    जागरूकं करोतु मे ॥ ५१॥ मेरुदण्डे महाविद्या योगिनीयोगवल्लभा । सूक्ष्मनाडीसहस्राणां सञ्चारं परिरक्षतु
    ॥ ५२॥ अस्थिसङ्घातमखिलं वज्रशुक्तिप्रभोज्ज्वला । स्थैर्यसम्पत्प्रदा देवी सदावत्वचलां तनुम् ॥ ५३॥ मांसपेशीषु
    मन्दारा रक्तरेणुप्रकाशिनी । बलपुष्टिप्रदा पातु जीवनोत्साहवर्धिनी ॥ ५४॥ रक्तधारासु रागश्रीर्जीवनामृतवाहिनी
    । मज्जधातौ महामेधा ज्ञानगर्भा सदावतु ॥ ५५॥ त्वचि चम्पकगौराङ्गी सौकुमार्यैकमन्दिरा । स्पर्शमात्रेण
    सौभाग्यं वितनोतु निरन्तरम् ॥ ५६॥ रोमराजिषु रोमाञ्चप्रेरिणी प्रेमरूपिणी । भक्तिसञ्जातहर्षाणां कारणं
    परिरक्षतु ॥ ५७॥ प्राणे प्राणेश्वरी पातु प्राणवेगप्रबोधिनी । अपानेऽपानगमना दोषजालविनाशिनी ॥ ५८॥ व्याने
    व्यापकसञ्चारा सर्वदेहप्रचारिणी । उदाने विमलोत्कर्षा चित्तमार्गप्रकाशिनी ॥ ५९॥ समाने समतारूपा तत्त्वसन्तुलनप्रदा
    । पञ्चप्राणमयी देवी सर्वथा परिरक्षतु ॥ ६०॥ नागे नागप्रिया पातु कूर्मे कूर्मगतिप्रदा । कृकरे कीर्तिदा
    देवी देवदत्ते शुभप्रदा ॥ ६१॥ धनञ्जये च मे नित्यं देहरक्षाविधायिनी । उपप्राणगणं सर्वं मातृभावेन रक्षतु
    ॥ ६२॥ मूलाधारे महालक्ष्मीः काञ्चनाचलवासिनी । स्थैर्यरत्नप्रदा पातु भूशक्तिं परिपालयेत् ॥ ६३॥ स्वाधिष्ठाने
    सुधाधारा कामकेलिविलासिनी । सृष्टिसौन्दर्यसारं मे नित्ययुक्तं करोतु च ॥ ६४॥ मणिपूरे महाशोभा वह्निकोटिसमप्रभा
    । तेजोराशिं सदापातु वीर्यसम्पत्प्रदायिनी ॥ ६५॥ अनाहते ललिताम्बा प्रेमपीयूषवर्षिणी । हृदयाम्भोधिमध्ये
    मां करुणाभिः प्लावयेत् ॥ ६६॥ विशुद्धौ शुद्धवाग्देवी गीतगङ्गाप्रवाहिनी । मन्त्रसारप्रदा नित्यं कण्ठमण्डलमाविशेत्
    ॥ ६७॥ आज्ञाचक्रे महाज्योतिर्भानुकोटिप्रकाशिनी । सर्वसन्देहसंहर्त्री बुद्धिदीपं विवर्धयेत् ॥ ६८॥ सहस्रारे
    सदानन्दा चन्द्रसूर्याग्निलोचना । अमृतधारया नित्यं स्नापयत्वन्तरं मम ॥ ६९॥ ततः सिंहासनोत्थाय स्मितचन्द्रविभूषिता
    । श्रीमती भक्तरक्षार्थं शक्तिसङ्घानचोदयत् ॥ ७०॥ आज्ञामात्रेण तस्याश्च दिव्याः शक्त्यः सहस्रशः । रत्नदीपशिखाकाराः
    समायान्ति दिशो दश ॥ ७१॥ पूर्वद्वारे पद्मरेखा पातु पद्मदलक्षणा । दक्षिणे कनकप्रख्या हेममञ्जीरनिःस्वना
    ॥ ७२॥ पश्चिमे प्रेममञ्जर्या करुणारसवर्षिणी । उत्तरे चन्द्रमालाभा शान्तिधारां प्रसारयेत् ॥ ७३॥ आग्नेय्यां
    वह्निजिह्वाभा तेजःपुञ्जविकासिनी । नैऋत्यां भीषणच्छाया दुष्टव्यूहविनाशिनी ॥ ७४॥ वायव्ये वेणुनादस्था
    गोपलीलाविलासिनी । ऐशान्ये चिन्मयूखाभा ब्रह्मविद्याप्रकाशिनी ॥ ७५॥ ऊर्ध्वदेशे सुधासारा दिव्यामृतनिषेविता
    । अधस्ताद् भुवनाधारा धृतिशक्तिः सदावतु ॥ ७६॥ गृहेषु गृहलक्ष्मीर्मे प्राकारं परिरक्षतु । द्वारे द्वारे
    जयद्वार्या शुभलक्ष्मीर्निवेशिता ॥ ७७॥ शय्यायां शयनामोदा स्वप्नविघ्नविनाशिनी । निद्रायां योगनिद्रा
    मे चित्तशुद्धिं प्रयच्छतु ॥ ७८॥ प्रभाते भानुलेखाभा जागरणप्रबोधिनी । मध्याह्ने माधवी पातु कर्मसिद्धिविवर्धिनी
    ॥ ७९॥ सायाह्ने सन्ध्यरमणी रक्तमेघविलासिनी । अर्धरात्रे रहस्येशी योगमार्गप्रकाशिनी ॥ ८०॥ मार्गमध्ये
    मरालाक्षी दूरयात्रासु रक्षतु । वनमध्ये वनमाला सिंहव्याघ्रभयापहा ॥ ८१॥ सलिले सलिलाकारा नौकायात्रासु
    रक्षतु । पर्वते पर्वतस्था सा दुर्गमार्गप्रदर्शिनी ॥ ८२॥ राजसभ्यामृतवाणी वाक्सिद्धिं परिरक्षतु । विद्वत्सभासु
    वागीशी शास्त्रदीपं विवर्धयेत् ॥ ८३॥ युद्धभूमौ जयज्योतिर्धैर्यगर्जितदायिनी । शत्रुमध्ये क्षमारूपा क्रोधवह्निं
    निरोधयेत् ॥ ८४॥ सेनामध्ये शरच्चन्द्रा सङ्कल्पं परिपालयेत् । अश्वयानरथारूढे विजयश्रीः सदावतु ॥ ८५॥
    वाणिज्ये वसुधाधीशा निधिवृष्टिं प्रयच्छतु । कृषिक्षेत्रे धान्यलक्ष्मीः पूर्णशस्यं विवर्धयेत् ॥ ८६॥
    गोष्ठमध्ये गोपसुन्दरी स्नेहधारां प्रवर्षतु । बालकेषु जगन्माता सौम्यभावं प्रयच्छतु ॥ ८७॥ विद्यायां
    विद्युलल्लेखा ग्रन्थगर्भप्रकाशिनी । काव्येषु कवितामाता रसधारां प्रसारयेत् ॥ ८८॥ गीतविद्यां गीतमाला
    नृत्ये नर्तनसुन्दरी । चित्रकर्मणि चित्रेशी रूपकल्पनदायिनी ॥ ८९॥ तन्त्रमार्गे रहस्यज्ञा मन्त्रबीजप्रबोधिनी
    । योगमार्गे योगमाया चित्तवृत्तिनिरोधिनी ॥ ९०॥ धर्मे धर्मप्रभा पातु अर्थे सम्पत्प्रदायिनी । कामे कामकलारूपा
    मोक्षे मोक्षप्रदायिनी ॥ ९१॥ मित्रमध्ये प्रियालापा सौहार्दस्य विवर्धिनी । बान्धवेषु दयासारा प्रेमबन्धप्ररक्षिणी
    ॥ ९२॥ दाम्पत्ये माधुरीलक्ष्मीः सौख्यवृष्टिं प्रयच्छतु । सन्ताने जननीदेवी वंशदीपं विवर्धयेत् ॥ ९३॥
    कीर्तौ कीर्तिकलापूर्णा यशोधारा सदावतु । भाग्ये भाग्यसरोजाक्षी पुण्यसञ्चयकारिणी ॥ ९४॥ रोगकाले सुधासिन्धुर्धातुसाम्यप्रदायिनी
    । शोककाले स्मितज्योतिः हृदयानन्दकारिणी ॥ ९५॥ दुर्भिक्षे धान्यवर्षिण्यन्नपूर्णा सदावतु । आपदां पर्वते
    घोरे दुर्गा दुर्गतिनाशिनी ॥ ९६॥ दृष्टिदोषे दृगम्बोजा भूतदोषे भयापहा । ग्रहपीडासु कालेशी ग्रहजालविभेदिनी
    ॥ ९७॥ विषवेगे सुधासारा दाहवेगे हिमप्रभा । अरण्ये निर्जने मार्गे मातृभावेन रक्षतु ॥ ९८॥ विपत्तिषु विशालाक्षी
    सम्पत्तौ विनयप्रदा । सिद्धौ सौम्यस्वभावा च नाशयेदभिमानकम् ॥ ९९॥ एवं शक्तिगणैर्युक्ता रत्नदीपसमुज्ज्वला
    । श्रीमती भक्तमालोक्य स्मितपूर्वमुवाच ह ॥ १००॥ ततः स्मेरमुखी देवी सुधाबिन्दुनिभेक्षणा । करुणाकुलहृदया
    भक्तमेनमभाषत ॥ १०१॥ मा भैषीर्वत्स सर्वत्र मम प्रेमवशोऽसि मे । इत्युक्त्वा शक्तिचक्राणि समन्ताद्व्यदधात्सा
    ॥ १०२॥ ततस्तारागणाकाराः शक्तयः कोटिशः शुभाः । मुक्ताहारलसद्भासो देहमेनं समाविशन् ॥ १०३॥ चित्ताकाशे
    चिदाभासा चिन्तामणिविलासिनी । सङ्कल्पमञ्जरी पातु मनोराज्यं निरन्तरम् ॥ १०४॥ बुद्धौ बोधसरिद्देवी तत्त्वदीपप्रकाशिनी
    । निर्णयेषु निराबाधां प्रज्ञां मे सम्प्रयच्छतु ॥ १०५॥ स्मृतौ स्मेरमुखी पातु वेदार्थपरिबोधिनी । विस्मृतौ
    चापि मे देवि मार्गदर्शनदायिनी ॥ १०६॥ अहङ्कारगुहां पातु निर्मलादर्शलोचना । मददर्पविनिर्मुक्तिं सौम्यभावं
    प्रयच्छतु ॥ १०७॥ मनसः कमलान्तस्थां मन्दाकिन्याः सुधारसाम् । मनोमञ्जुलिका पातु भावसौन्दर्यवर्धिनी ॥
    १०८॥ भावेषु भावगम्या सा प्रेमसारैकजीविका । हर्षे हेमप्रभा पातु दुःखे धैर्यप्रदायिनी ॥ १०९॥ लज्जायां
    लज्जिताम्भोजा कीर्तौ कीर्तिविलासिनी । श्रद्धायां श्रद्धिकाश्रीश्च भक्तौ भक्तिप्रवर्धिनी ॥ ११०॥ इच्छाशक्तिं
    सदापातु कामबीजप्रकाशिनी । ज्ञानशक्तिं च मे पातु चिन्मयूखप्रवाहिनी ॥ १११॥ क्रियाशक्तिं क्रियामाता कर्ममार्गप्रबोधिनी
    । त्रिशक्तिरूपिणी देवी सर्वतः परिरक्षतु ॥ ११२॥ नाडीचक्रेषु सर्वेषु सुधास्रोतःप्रवाहिनी । इडायां चन्द्रलेखेव
    पिङ्गलायां रविप्रभा ॥ ११३॥ सुषुम्णायां परा ज्योतिः कुण्डलीकुसुमप्रिया । ब्रह्मनाडीं सदापातु मुक्तिद्वारप्रकाशिनी
    ॥ ११४॥ बीजे बीजार्थरूपा सा शब्दे शब्दस्वरूपिणी । वर्णेषु मातृकादेवी मन्त्रेषु मन्त्ररूपिणी ॥ ११५॥
    अक्षरेष्वक्षराकारा वेदेषु वेदवल्लभा । तन्त्रेषु तन्त्रहृदया यन्त्रेषु यन्त्ररक्षिणी ॥ ११६॥ काले कालविलासाढ्या
    क्षणे क्षणविकासिनी । मुहूर्ते मङ्गलप्रज्ञा दिवसं परिरक्षतु ॥ ११७॥ पक्षे पूर्णकलाश्रीश्च मासे मासविवर्धिनी
    । ऋतुषु ऋतुमती पातु संवत्सरविधायिनी ॥ ११८॥ जन्मस्थाने जन्ममाता बाल्ये बालार्कसुन्दरी । कौमारे कुसुमापीडा
    यौवने यौवनेश्वरी ॥ ११९॥ गार्हस्थ्ये गृहसौभाग्या वनवासे तपस्विनी । वार्धके ज्ञानगङ्गा च अन्ते निर्वाणदायिनी
    ॥ १२०॥ पितॄणां पुण्यरेखा च मातॄणां मातृमण्डला । वंशवृक्षस्य मूलस्था कुलदीपा सदावतु ॥ १२१॥ भ्रातॄणां
    स्नेहमालाढ्या सुहृदां हृदयेश्वरी । गुरूणां ज्ञानगम्भीरा शिष्यानुग्रहकारिणी ॥ १२२॥ रत्नकोषे रत्नमाला
    धान्यकोषे धनेश्वरी । गजवाजिधनादीनां वृद्धिं मे सम्प्रयच्छतु ॥ १२३॥ क्षेत्रे क्षेत्रप्रिया पातु ग्रामे
    ग्रामविलासिनी । नगरे नगराधीशा राष्ट्रे राज्यप्रदायिनी ॥ १२४॥ भूगर्भे निधिदात्री च तोयगर्भे सुधामयी
    । व्योम्नि व्योमविलासाढ्या दिशः सर्वाः सदावतु ॥ १२५॥ यक्षिण्यः किन्नरीवृन्दा गन्धर्व्यः सिद्धयोषितः
    । तस्याः पार्श्वगताः सर्वाः रक्षां कुर्वन्तु मे सदा ॥ १२६॥ वाशिन्याद्याः समस्ताश्च योगिन्यो मन्त्रकोविदाः
    । मातृकाचक्रसंयुक्ता देहमेनं समाविशन् ॥ १२७॥ कदम्बकानने रम्ये रत्नद्वीपे मनोरमे । चिन्तामणिगृहे दिव्ये
    सिंहासनविराजिता ॥ १२८॥ श्रीजिका श्रीमती देवी श्रीदेवी श्रीनिकेतना । गोपाली गोपिनी रम्या माधवी मधुमञ्जरी
    ॥ १२९॥ मालती मृदुलापाङ्गी चन्द्ररेखाविलासिनी । कमलहस्ता पद्माक्षी हेमकाञ्चनभूषणा ॥ १३०॥ भक्तमालोक्य
    सस्नेहं करुणार्द्रकटाक्षिणी । रक्षाव्यूहं समुत्सृज्य हृदये समतिष्ठत ॥ १३१॥ हृदम्बुजे ततः शान्ता चिन्मयूखविभासुरा
    । अनन्तकोटिब्रह्माण्डसौन्दर्यैकस्वरूपिणी ॥ १३२॥ ललिता परमप्रेम्णा पारब्रह्मस्वरूपिणी । अन्ते महेश्वरी
    दिव्या महासुन्दर्यवत्सला ॥ १३३॥ महासुन्दरी मां पातु बहिरन्तर्निरन्तरम् । जाग्रत्स्वप्नसुषुप्तिषु सर्वावस्थासु
    सर्वदा ॥ १३४॥ एवं रक्षामयीं देवीं हृदयाम्भोजसंस्थिताम् । ध्यायन् साधकवर्योऽसौ प्रेमनिर्भरमानसः ॥ १३५॥
    तदा रत्नमये द्वीपे सुधासिन्धोस्तरङ्गिणी । उत्थाय मन्दहासाढ्या देवी वीक्ष्य कृपामयी ॥ १३६॥ विततान चतुर्दिक्षु
    चिद्विलासमयीं प्रभाम् । यया व्याप्तमिदं सर्वं दृश्यादृश्यं चराचरम् ॥ १३७॥ तस्य देहे तदा दिव्यं कवचं
    भावरूपकम् । न दीप्यते केवलं बाह्ये हृदयान्तर्गतेऽपि च ॥ १३८॥ यत्र यत्र पदं धत्ते कवचेनावृतो नरः ।
    तत्र तत्र स्वयं देवी पूर्वमेव प्रतीयते ॥ १३९॥ अकवचो न गन्तव्यं साधकेन कदाचन । य इच्छेद्ब्रह्मभावं
    च रक्षां च निरुपद्रवाम् ॥ १४०॥ एकमप्यथ पादं यो रक्षाहीनो निवेशयेत् । स मूढो मार्गमुत्सृज्य छायामेवाभिधावति
    ॥ १४१॥ कवचेनावृतो नित्यं ब्रह्मभावपरायणः । चलन्नपि स्थितो वापि ध्यानस्थ इव दृश्यते ॥ १४२॥ तं दृष्ट्वा
    भूतसङ्घाश्च प्रेतवेतालराक्षसाः । पिशाचा ब्रह्मरक्षांसि यक्षिण्यो गुह्यचारिणः ॥ १४३॥ दूरादेव पलायन्ते
    वह्निदग्धा इव द्रुमाः । नामश्रवणमात्रेण भीतचित्ता दिशो ययुः ॥ १४४॥ अन्तरिक्षचराः क्रूरा अदृश्याश्च
    विघातकाः । ग्रहबन्धकरा दुष्टा मायाजालप्रवर्तकाः ॥ १४५॥ न स्प्रष्टुं शक्तिमाप्नोति कवचस्थं महाशयम्
    । यतः श्रीमतीचक्रेण परिवीतो भवेदसौ ॥ १४६॥ त्रैलोक्यविजयं नाम तस्य हस्ते प्रतिष्ठितम् । न शस्त्रैर्न
    च मन्त्रैश्च न युक्त्या न पराक्रमैः ॥ १४७॥ यदि शक्रः स्वयं क्रुद्धो यदि विष्णुर्विरोधकृत् । यदि लोकपतिः
    कश्चिद्विपरीतमनाः भवेत् ॥ १४८॥ तथापि रक्षति क्षिप्रं तं शक्तिः परमेश्वरी । यतो येषां प्रसूता सा ते
    तस्याः किं करिष्यति ॥ १४९॥ यस्य द्वेष्टि महाभागं कवचस्थं निरन्तरम् । तस्य भाग्यलतां क्रुद्धा लेखिनीश्वरी
    लिखेत् ॥ १५०॥ नश्यन्ति तस्य सौभाग्यं मित्रवर्गो धनागमः । यः कारणं विना नित्यं साधकं पीडयेद् ध्रुवम्
    ॥ १५१॥ कवचस्यास्य पाठेन जप्तेन मनसा सह । बहवो मन्त्रतन्त्राद्या स्वयमेव फलप्रदाः ॥ १५२॥ नान्यदाश्रयणीयं
    स्यात् साधकस्य विशेषतः । यदा मातृकृपा जाता कवचेनैव केवलम् ॥ १५३॥ विघ्नार्थं गजवक्त्रं च जना यान्ति
    पुनः पुनः । वैराग्यज्ञानलाभाय रुद्रं यान्ति तपस्विनः ॥ १५४॥ मोक्षार्थं विष्णुमाश्रित्य सूर्यं चक्षुःप्रवृद्धये
    । भोगमोक्षप्रदां देवीं धनार्थं कमलालयाम् ॥ १५५॥ किन्तु यस्यां पदाम्भोजे सर्व एते कृताञ्जलिः । तां
    लेखिनीश्वरिं नित्यं केचित् जानन्ति दुर्लभाम् ॥ १५६॥ सा स्वयम्पूर्णसामर्थ्या सर्वदानैकतत्परा । यत्फलं
    देवताभेदैर्लभ्यते बहुसेवया ॥ १५७॥ तत्सर्वं लभते सद्यः कवचस्यास्य धारकः । अनुग्रहेण मात्रैक्या श्रीमतीपरमेश्वर्या
    ॥ १५८॥ इति श्रीसिद्धाश्रमतन्त्रे सिद्धयोगिसंवादे जगद्व्यापिनीपरब्रह्मणी
