id: bhishmakakritamshrikrishnastotram-2
category: stotram
name:
  english: bhishmakakritamshrikrishnastotram 2
  devanagari: भीष्मककृतंश्रीकृष्णस्तोत्रम् २
content:
  english: shca sukshmabuddhayah || 90|| jyotirabhyantare nityam deharupam sanatanam | kasmattejah prabhavati
    sakaramishvaram vina || 91|| evam stutva sa ca''cantah smaranvishnum ca narada | padyam padmarcite
    padapadme cayam dadau muda || 92|| iti shribrahmavaivartapurane shrikrishnajanmakhande uttare saptadhikashatatamadhyayantargatam
    bhishmakakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: श्च सूक्ष्मबुद्धयः ॥ ९०॥ ज्योतिरभ्यन्तरे नित्यं देहरूपं सनातनम् । कस्मात्तेजः प्रभवति साकारमीश्वरं
    विना ॥ ९१॥ एवं स्तुत्वा स चाऽऽचान्तः स्मरन्विष्णुं च नारद । पाद्यं पद्मार्चिते पादपद्मे चायं ददौ मुदा
    ॥ ९२॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरे सप्ताधिकशाततमाध्यायान्तर्गतं भीष्मककृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
meaning: {}
