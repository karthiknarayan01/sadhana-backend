id: devi-mahatmyam-mangala-neerajanam
category: stotram
name:
  english: Devi Mahatmyam Mangala Neerajanam
content:
  english: shri cakra puramandu sthiramaina shri lalita pasidi padalaku nirajanam parameshvaruni punyabhagyala
    rashi a simhamadhyaku ratna nirajanam || || shri cakra puramandu || bangaru harala shingaramòlakincu
    ambika hridayana nirajanam shri gauri shri mata shri maharajni shri simhasaneshvariki nirajanam ||
    kalpataruvuga nannu kapade karamulaku kanakamburashulato nirajanam pashankusha pushpa bana capadhariki
    paramapavanamaina nirajanam || || shri cakra puramandu || kanti kiranalato kaliki mèdalo mèrise kalyana
    sutramuku nirajanam kantalandari pasupukunkumalu kapade katyayaniki nitya nirajanam || sirunavvulòlikincu
    shridevi adharana shatakoti nakshatra nirajanam kaluvarekulavanti kannula talli shri rajarajeshvariki
    nirajanam || || shri cakra puramandu || mudamara momuna muccataga dhariyincu kasturi kunkumaku nirajanam
    candravankanu shiramakutambulo dalcu saundaryalahariki nirajanam || shukravaramu nadu shubhamulòsage
    talli shri mahalakshmiki nirajanam shringeri pithamuna sundarakarini sharada mataku nirajanam || ||
    shri cakra puramandu || èllalokalanu callaga palincu brahmandarupiniki nirajanam muggurammalaku mulamagu
    pèddammaku mutyalato nitya nirajanam || radha jivana raga nama sankirtanaga ranjillu karpura nirajanam
    janma janmala talli jagadishvari niku bhakta janulicceti nirajanam || shri cakra puramandu sthiramaina
    shri lalita pasidi padalaku nirajanam parameshvaruni punyabhagyala rashi a simhamadhyaku ratna nirajanam
    simhamadhyaku ratna nirajanam simhamadhyaku ratna nirajanam
  devanagari: श्री चक्र पुरमन्दु स्थिरमैन श्री ललित पसिडि पादालकु नीराजनं परमेश्वरुनि पुण्यभाग्याल राशी
    आ सिंहमध्यकु रत्न नीराजनम् ॥ ॥ श्री चक्र पुरमन्दु ॥ बङ्गारु हाराल शिङ्गारमॊलकिञ्चु अम्बिका हृदयान
    नीराजनं श्री गौरी श्री मात श्री महाराज्ञि श्री सिंहासनेश्वरिकि नीराजनम् ॥ कल्पतरुवुग नन्नु कापाडे
    करमुलकु कनकम्बुराशुलतो नीराजनं पाशाङ्कुश पुष्प बाण चापधरिकि परमपावनमैन नीराजनम् ॥ ॥ श्री चक्र पुरमन्दु
    ॥ कान्ति किरणालतो कलिकि मॆडलो मॆरिसे कल्याण सूत्रमुकु नीराजनं कान्तलन्दरि पसुपुकुङ्कुमलु कापाडे कात्यायनिकि
    नित्य नीराजनम् ॥ सिरुनव्वुलॊलिकिञ्चु श्रीदेवि अधरान शतकोटि नक्षत्र नीराजनं कलुवरेकुलवण्टि कन्नुल तल्लि
    श्री राजराजेश्वरिकि नीराजनम् ॥ ॥ श्री चक्र पुरमन्दु ॥ मुदमार मोमुन मुच्चटगा धरियिञ्चु कस्तूरि कुङ्कुमकु
    नीराजनं चन्द्रवङ्कनु शिरमकुटम्बुलो दाल्चु सौन्दर्यलहरिकि नीराजनम् ॥ शुक्रवारमु नाडु शुभमुलॊसगे तल्लि
    श्री महालक्ष्मिकि नीराजनं शृङ्गेरि पीठमुन सुन्दराकारिणि शारदा मातकु नीराजनम् ॥ ॥ श्री चक्र पुरमन्दु
    ॥ ऎल्ललोकालनु चल्लगा पालिञ्चु ब्रह्माण्डरूपिणिकि नीराजनं मुग्गुरम्मलकु मूलमगु पॆद्दम्मकु मुत्यालतो
    नित्य नीराजनम् ॥ राधा जीवन राग नाम सङ्कीर्तनगा रञ्जिल्लु कर्पूर नीराजनं जन्म जन्मल तल्लि जगदीश्वरी
    नीकु भक्त जनुलिच्चेटि नीराजनम् ॥ श्री चक्र पुरमन्दु स्थिरमैन श्री ललित पसिडि पादालकु नीराजनं परमेश्वरुनि
    पुण्यभाग्याल राशी आ सिंहमध्यकु रत्न नीराजनं सिंहमध्यकु रत्न नीराजनं सिंहमध्यकु रत्न नीराजनं
