id: kalagnirudropanishat
category: upanishad
name:
  english: kalagnirudropanishat
  devanagari: कालाग्निरुद्रोपनिषत्
content:
  english: upanishad || kalagnirudropanishat || om saha navavatu | saha nau bhunaktu | sahaviryam karavavahai
    | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih || om atha kalagnirudropanishadah
    samvartako'gnirrishiranushtupchndah | shrikalagnirudro devata | shrikalagnirudraprityarthe bhasmatripundradharane
    viniyogah || 1 || atha kalagnirudram bhagavantam sanatkumarah papraccha adhihi bhagavamstripundravidhim
    satattvam kim dravyam kiyatsthanam kati pramanam ka rekha ke mantrah ka shaktih kim daivatam kah karta
    kim phalamiti ca || 2 || tam hovaca bhagavankalagnirudrah yaddravyam tadagneyam bhasma sadyojatadipancabrahmamantraih
    parigrihyagniriti bhasma vayuriti bhasma jalamiti bhasma sthalamiti bhasma vyometi bhasmetyanenabhimantrya
    manastoka iti samuddhritya ma no mahantamiti jalena samsrijya triyayushamiti shirolalatavakshahskandheshu
    triyayushaistryambakaistrishaktibhistiryaktisro rekhah prakurvita vratametacchambhavam sarveshu deveshu
    vedavadibhiruktam bhavati tasmattatsamacarenmumukshurna punarbhavaya || 3 || atha sanatkumarah papraccha
    pramanamasya tripundradharanasya || 4 || tridha rekha bhavatyalalatadacakshushoramurdhnorabhruvormadhyatashca
    || 5 || yasya prathama rekha sa garhapatyashcakaro rajo bhurlokah svatma kriyashaktirrigvedah pratahsavanam
    maheshvaro devateti || 6 || yasya dvitiya rekha sa dakshinagnirukarah satvamantarikshamantaratma cecchashaktiryajurvedo
    madhyamdinam savanam sadashivo devateti || 7 || yasya tritiya rekha sahavaniyo makarastamo dyaurlokah
    paramatma jnanashaktih samavedastritiyasavanam mahadevo devateti || 8 || evam tripundravidhim bhasmana
    karoti yo vidvanbrahmacari grihi vanaprastho yatirva sa mahapatakopapatakebhyah puto bhavati sa sarveshu
    tirtheshu snato bhavati sa sarvanvedanadhito bhavati sa sarvandevanjnato bhavati sa satatam sakalarudramantrajapi
    bhavati sa sakalabhoganbhunkte deham tyaktva shivasayujyameti na sa punaravartate na sa punaravartata
    ityaha bhagavankalagnirudrah || 9 || yastvetadvadhite so'pyevameva bhavatityom satyamityupanishat
    || 10 || om saha navavatu | saha nau bhunaktu | sahaviryam karavavahai | tejasvinavadhitamastu ma
    vidvishavahai || om shantih shantih shantih || || iti kalagnirudropanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् ॥ कालाग्निरुद्रोपनिषत् ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सहवीर्यं करवावहै । तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ अथ कालाग्निरुद्रोपनिषदः संवर्तकोऽग्निर्ॠषिरनुष्टुप्छ्न्दः
    । श्रीकालाग्निरुद्रो देवता । श्रीकालाग्निरुद्रप्रीत्यर्थे भस्मत्रिपुण्ड्रधारणे विनियोगः ॥ १ ॥ अथ कालाग्निरुद्रं
    भगवन्तं सनत्कुमारः पप्रच्छ अधीहि भगवंस्त्रिपुण्ड्रविधिं सतत्त्वं किं द्रव्यं कियत्स्थानं कति प्रमाणं
    का रेखा के मन्त्राः का शक्तिः किं दैवतं कः कर्ता किं फलमिति च ॥ २ ॥ तं होवाच भगवान्कालाग्निरुद्रः
    यद्द्रव्यं तदाग्नेयं भस्म सद्योजातादिपञ्चब्रह्ममन्त्रैः परिगृह्याग्निरिति भस्म वायुरिति भस्म जलमिति
    भस्म स्थलमिति भस्म व्योमेति भस्मेत्यनेनाभिमन्त्र्य मानस्तोक इति समुद्धृत्य मा नो महान्तमिति जलेन संसृज्य
    त्रियायुषमिति शिरोललाटवक्शःस्कन्धेषु त्रियायुषैस्त्र्यम्बकैस्त्रिशक्तिभिस्तिर्यक्तिस्रो रेखाः प्रकुर्वीत
    व्रतमेतच्छाम्भवं सर्वेषु देवेषु वेदवादिभिरुक्तं भवति तस्मात्तत्समाचरेन्मुमुक्षुर्न पुनर्भवाय ॥ ३ ॥
    अथ सनत्कुमारः पप्रच्छ प्रमाणमस्य त्रिपुण्ड्रधारणस्य ॥ ४ ॥ त्रिधा रेखा भवत्याललाटादाचक्षुषोरामूर्ध्नोराभ्रुवोर्मध्यतश्च
    ॥ ५ ॥ यास्य प्रथमा रेखा सा गार्हपत्यश्चाकारो रजो भूर्लोकः स्वात्मा क्रियाशक्तिर्ऋग्वेदः प्रातःसवनं
    महेश्वरो देवतेति ॥ ६ ॥ यास्य द्वितीया रेखा सा दक्शिणाग्निरुकारः सत्वमन्तरिक्षमन्तरात्मा चेच्छाशक्तिर्यजुर्वेदो
    माध्यंदिनं सवनं सदाशिवो देवतेति ॥ ७ ॥ यास्य तृतीया रेखा साहवनीयो मकारस्तमो द्यौर्लोकः परमात्मा ज्ञानशक्तिः
    सामवेदस्तृतीयसवनं महादेवो देवतेति ॥ ८ ॥ एवं त्रिपुण्ड्रविधिं भस्मना करोति यो विद्वान्ब्रह्मचारी गृही
    वानप्रस्थो यतिर्वा स महापातकोपपातकेभ्यः पूतो भवति स सर्वेषु तीर्थेषु स्नातो भवति स सर्वान्वेदानधीतो
    भवति स सर्वान्देवाञ्ज्ञातो भवति स सततं सकलरुद्रमन्त्रजापी भवति स सकलभोगान्भुङ्क्ते देहं त्यक्त्वा
    शिवसायुज्यमेति न स पुनरावर्तते न स पुनरावर्तत इत्याह भगवान्कालाग्निरुद्रः ॥ ९ ॥ यस्त्वेतद्वाधीते सोऽप्येवमेव
    भवतीत्यों सत्यमित्युपनिषत् ॥ १० ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सहवीर्यं करवावहै । तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति कालाग्निरुद्रोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
