id: shiva-panchayatana-shodasa-upachara-puja
category: stotram
name:
  english: Shiva Panchayatana Shodasa Upachara Puja
content:
  english: purvanga puja shucih apavitrah pavitro va sarvavastha tpundarikaksham sa bahyabhyantara shshucih
    || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam ncaturbhujam |
    prasannavadana thsarvavighnopashantaye || agajanana padmarka ngajananamaharnisham | anekada mbhaktanam
    ekadantamupasmahe || devim va~camajanayanta devastam vi~shvarupah pashavo vadanti | sa no mandreshamurja
    nduhana dhenurvagasmanupa sushtutaitu || ya shshivo nama rupabhyam ya~ devi sarvamangala | tayo ssamsmaranannityam
    sarvada jaya mangalam || tadeva lagnam sudina ntadeva lakshmipate te 'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guru tparabrahma tasmai shrigurave namah || labhastesha mparabhavah
    | eshamindivarashyamo hridayastho janardanah || sarvamangala mangalye shive sarvarthasadhike | sharanye
    tryambake gauri narayani namo 'stu te || shrilakshminarayanabhya nnamah | umamaheshvarabhya nnamah
    | vanihiranyagarbhabhya nnamah | shacipurandarabhya nnamah | arundhativasishthabhya nnamah | shrisitaramabhya
    nnamah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | karpura gaura nkarunavataram samsarasara
    mbhujagendra haram | sada ramantam hridayaravinde bhava nnamami || vagarthaviva sampriktau vagartha
    pratipattaye | jagatah pitarau vande parvati parameshvarau || vande mahesham surasiddhasevitam devangana
    gita sunritya tushtam | paryankagam shailasutasametam kalpadrumaranyagata mprasannam || apatala vantamritaih
    | astokapluta ccivam || brahmanda vyaptadeha bhasita himaruca bhasamana bhujangaih kanthe kalah kapardah
    kalita shcanda kodanda hastah | tryaksha rudrakshamalah prakatitavibhava shshambhava murtibhedah rudra
    prakatitavibhava nah prayaccantu saukhyam || diparadhanam dipastva mprabhuravyayah | saubhagya ndehi
    putramshca sarvankamamshca dehi me || bho dipa devi rupastva nkarmasakshi hyavighnakrit | yavatpuja
    nkarishyami tavattvam susthiro bhava || diparadhana muhurta 'stu || pujarthe haridra kunkuma vilepana
    nnarayanaya svaha | o ntrivikramaya namah | om va~manaya namah | om shridharaya namah | om hrishikeshaya
    namah | o ndamodaraya namah | om sankar mpradyumnaya namah | om aniruddhaya namah | o mpurushottamaya
    namah | om adhokshajaya namah | o nnarasimhaya namah | om acyutaya namah | o njanardanaya namah |
    om upendraya namah | om haraye namah | om shrikrishnaya namah | bhutoccatanam uttishthantu bhutapishacah
    ya ete bhumi bharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta ye bhuta bhumisamsthitah
    | ye bhuta vighnakartaraste gacchantu shiva 'jnaya || pranayamam o mbhargo devasya dhimahi | dhiyo
    yo nah pracodaya t || omapo jyoti raso mbrahma bhurbhuvassuvarom || sankalpam mamopatta samasta duritakshayadvara
    shri parameshvara prityartham shubhe shobhane muhurte adyabrahmanah dvitiya parardhe shvetavaraha
    kalpe vaivasvata manvantare ashtavimshati tame kaliyuge prathame pade jambudvipe bharatavar she bharatakhande
    meroh dakshine par shve shakabde asmin vartamane vyavaharike prabhavadi shashthya nguna sakala visheshana
    vishishtayam asyam shubhatithau mamopatta samasta duritakshayadvara shri parameshvara prityartham
    jatayah mama dharmapatnyashca avayo aishvaryanam abhivriddhyartham caturvidha phalapurushartha siddhyartham
    sarvarishta shantyartham sarvabhishta siddhyartham saparivara somaskanda parameshvara caranaravindayoh
    acancala yavacchakti parivara sahita rudravidhanena dhyana arccanadi sahita sambashiva puja nirvighna
    puja parisamaptyartham adau shrimahaganapati puja shri mahaganapati puja || tadanga kalasharadhana
    nkarishye | kalasharadhanam kalashe gandha pushpakshatairabhyarcya | kalashe udaka mpurayitva | kalashasyopari
    hasta nnidhaya | kalashasya mukhe vishnuh kanthe rudra ssamashritah | mule tvasya sthito brahma madhye
    matrigana ssmrita || kukshau tu sagara ssarve saptadvipa vasundhara | rigvedo 'tha yajurvedo samavedo
    hyatharvanah || angaishca sahita ssarve kalashambu samashritah | om akalashe shu dhavati pavitre parishicyate
    | ukthairyajneshu vardhate | apo va idag vi~shva bhutanyapah prana va apah pashava apo 'mritamapah
    samradapo viradapah svaradapashchandag shyapah satyamapah sarva devata apo bhurbhuva ssuvarapa om
    || gange ca yamune caiva godavari sarasvati | narmade sindhu kaveri jale nkuru || kaveri tungabhadra
    ca krishnaveni ca gautami | bhagirathiti vikhyatah pancagangah prakirtitah || ayantu shri shivapujartha
    mmama duritakshayakarakah | o mbhurbhuvassuvo bhurbhuvassuvo bhurbhuvassuvah || om om o nkalashodakena
    puja dravyani samprokshya nca samprokshya || pancakalasha sthapanam pashcimam sadyo jata mprapadyami
    sadyo jataya vai namo namah | bhave bhave natibhave bhavasva mam | bhavodbhavaya namah || o mbhurbhuvassuvarom
    | asmi npashcimakalashe sadyojata ndhyayami | avahayami | uttaram vamadevaya namo jyeshthaya namah
    shreshthaya namo rudraya namah kalaya namah kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya
    nama ssarvabhutadamanaya namo manonmanaya namah | o mbhurbhuvassuvarom | asmin uttarakalashe vamadeva
    ndhyayami | avahayami | dakshinam aghore bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudrarupebhyah
    || o mbhurbhuvassuvarom | asmi ndhyayami | avahayami | purvam o ntatpurushaya vidmahe mahadevaya dhimahi
    | tanno rudrah pracodaya mbhurbhuvassuvarom | asmi npurvakalashe tatpurusha ndhyayami | avahayami
    | maddhyamam ishana mbrahmadhipati rbrahmano 'dhipati rbrahma shivo me astu sadashivom || o mbhurbhuvassuvarom
    | asmi ndhyayami | avahayami | pranapratishtha om asunite punarasmasu cakshuh punah pranamiha no m
    | jyokpashyema suryamuccara ssvasti || amritam vai~ prana amritamapah prananeva yathasthanamupahvayate
    || svamin sarvajagannatha yava mpritibhavena linge mpushti vardhanam | urvarukamiva bandhananmrityormukshiya
    ma t || avahito bhava | sthapito bhava | sannihito bhava | sanniruddho bhava | avakunthito bhava |
    suprito bhava | suprasanno bhava | varado bhava | svagatam astu | prasida prasida | laghunyasam mahanyasam
    || dhyanam kailase kamaniya ratna khacite kalpadrumule sthitam karpura sphatikendu sundara tanu nkatyayani
    sevitam | gangottunga taranga ranjita jata bhara nkripasagaram kanthalankrita sheshabhushanamaha mbhavaye
    || om shri umamaheshvara svamine namah dhyayami | avahanam onkaraya namastubhyam onkarapriya shankara
    | avahana mparvatipriya vallabha || om shri umamaheshvara svamine namah avahayami | asanam om sadyojatayavai
    namo namah namaste girijanatha kailasagiri mandira | simhasana mmaya dattam svikurushva umapate ||
    shri umamaheshvara svamine namah navaratna khacita hema simhasanam samarpayami | padyam mahadeva jagannatha
    bhaktanamabhayaprada | padya ngrihana devesha mama saukhyam vi~vardhaya || shri umamaheshvara svamine
    namah padayoh padyam samarpayami | arghyam om ati bhave bhavasvamam shivapriya namastestu pavana njalapuritam
    | arghya ngangeya kalashasthitam || shri umamaheshvara svamine namah hastayoh arghyam samarpayami
    | acamanam vamadeva suradhisha vanditanghri saroruha | grihanacamana ndeva karuna varunalaya || shri
    umamaheshvara svamine namah mukhe acamaniyam samarpayami | madhuparkam yamantakaya ugraya bhimaya
    ca namo namah | madhuparka mpradasyami grihana tvamumapate || shri umamaheshvara svamine namah madhuparkam
    samarpayami | pancamrita snanam om apyayasva sametu te vishvatassoma vrishniyam | bhava vajasya sangathe
    || shri bhavanishankarasvamine namah kshirena snapayami | apo hishtha mayobhuvasta na urje dadhatana
    | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva matarah | tasma
    arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine namah |
    kshirasnananantaram shuddhodaka snanam samarpayami | ndadhikravno akarisha njishnorashvasya vajinah
    | surabhi no mukha karatprana ayugmshi tarishat || shri bhavanishankarasvamine namah | dadhna snapayami
    | apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate
    ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah |
    shri bhavanishankarasvamine namah | dadhisnananantaram shuddhodaka snanam samarpayami | om shukramasi
    jyotirasi tejosi devovassavitotpunatu acchidrena pavitrena vasossuryasya rashmibhih | shri bhavanishankarasvamine
    namah | ajyena snapayami | apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah
    shivatamo rasastasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha
    | apo janayatha ca nah | shri bhavanishankarasvamine namah | ajya snananantaram shuddhodaka snanam
    samarpayami | madhuvata ritayate iti madhu mmadhuvata ritayate madhuksharanti sindhavah | madhvi ssantvaushadhih
    | madhunaktamutoshasi madhumatparthivagm rajah | madhudyaurastu nah pita | madhumanno vanaspatirmadhumag
    m astu suryah | madhvirgavo bhavantu nah | shri bhavanishankarasvamine namah | madhuna snapayami |
    apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate
    ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah |
    shri bhavanishankarasvamine namah | madhusnananantaram shuddhodaka snanam samarpayami | svaduh pavasyeti
    sharkara om svaduh pavasva divyaya janmane | svadurindra | svadurmitraya varunaya vayave | brihaspataye
    madhumam ada bhyah | shri bhavanishankarasvamine namah | sharkaraya snapayami | apo hishtha mayobhuvasta
    na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva
    matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine
    namah | sharkara snananantaram shuddhodaka snanam samarpayami | shankhodakam apo hishtha mayobhuvasta
    na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva
    matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine
    namah | shankhodakena snapayami || phalodakam yah phalinirya aphala apushpayashca pushpinih | brihaspati
    prasutastano muncantvag m hasah || shri bhavanishankarasvamine namah | phalodakena snapayami | gandhodakam
    gandhadvara m | ishvarigm sarvabhutana ntamihopahvaye shriyam || shri bhavanishankarasvamine namah
    | gandhodakena snapayami | pushpodakam yo nbhavati | candrama va apa nbhavati | shri bhavanishankarasvamine
    namah | pushpodakena snapayami | akshatodakam ayane te parayane durva rohantu pushpinih | hradashca
    pundarikani samudrasya griha ime | shri bhavanishankarasvamine namah | akshatodakena snapayami | suvarnodakam
    tathsuvarnagm hiranyamabhavat | tathsuvarnasya hiranyasya janma | ya evagm suvarnasya hiranyasya janmaveda
    | suvarna atmana bhavati | shri bhavanishankarasvamine namah | suvarnodakena snapayami | rudrakshodakam
    tryambakam mpushti vardhanam | urvarukamiva bandhananmrityormukshiya ma t || shri bhavanishankarasvamine
    namah | rudrakshodakena snapayami | bhasmodakam ma no mahantamuta ma no arbhakam ma na ukshantamuta
    ma na ukshitam | ma no mmota mataram priya ma nastanuvo rudra ririshah | shri bhavanishankarasvamine
    namah | bhasmodakena snapayami | bilvodakam ma nastoke tanaye ma na ayushi ma no goshu ma no ashveshu
    ririshah | viranma no rudra bhamito havishmanto namasa vidhema te | shri bhavanishankarasvamine namah
    | bilvodakena snapayami | durvodakam kanda tkandatprarohanti parushah parushah pari | evano durve
    pratanu sahasrena shatena ca || shri bhavanishankarasvamine namah | durvodakena snapayami | atha malapakar
    shana snanam hiranyavarnashshucayah pavaka yasu jatah kashyapo yasvindrah | agnim ndadhire virupasta
    na apashshagg syona bhavantu || yasagm raja varuno yati madhye satyanrite avapashyanjananam | madhushcutashshucayo
    yah pavakasta na apashshagg syona bhavantu || yasa ndeva divi krinvanti bhaksham ya antarikshe bahudha
    bhavanti | yah prithivi mpayasondanti shukrasta na apashshagg syona bhavantu || shivena ma cakshusha
    pashyatapashshivaya tanuvopa sprishata tvaca mme | sarvagm agnigm raphsushado huve vo mayi varco balamojo
    nidhatta || vanadata hate | tasmada nadyo nama stha ta vo namani sindhavah || yatpreshita varunenatashshibhagm
    samavalgata | tadapnodindro vo yatistasmadapo anusthana || apakamaggm syandamana avivarata vo hi kam
    | indro vashshaktibhirdevistasmadvarnama vo hitam || eko vo devo apyatishthathsyandamana yathavasham
    | udanishurmahiriti tasmadudakamucyate || apo bhadra ghritamidapa anuragnishomau bibhratyapa ittah
    | tivro raso madhupricam arangama a ma pranena saha varcasagann || aditpashyamyuta va shrinomya ma
    ghosho gacchati vanma asam | manye bhejano amritasya tar hi hiranyavarna atripam apo hishtha mayobhuvasta
    na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva
    matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine
    namah | shuddhodakena snapayami | apo va idagm sarvam vi~shva bhutanyapah prana va apah pashava apo
    'mritamapah samradapo viradapah svaradapashchandagmsyapo jyotigmshyapo yajugmshyapassatyamapassarva
    devata apo bhurbhuvassuvarapa om || apah pranayati | shraddhava apah | shraddhamevarabhya praniya
    pracarati | apah pranayati | yajno va apah | yajnamevarabhya praniya pracarati apah pranayati | vajro
    va apah | vajrameva bhratrivyebhyah prahritya praniya pracarati | apah pranayati | apo vai rakshoghnih
    | rakshasamapahatyai | apah pranayati | apo vai devana mpriyandhama | devanameva priyandhama praniya
    pracarati | apah pranayati | apo vai sarva devatah | devata evarabhya praniya pracarati | apo vai
    shantah | shantabhirevasya shucagm shamayati || shri bhavanishankarasvamine namah | malapakar shanasnanam
    samarpayami | shrirudraprashnah namakam || shrirudraprashnah camakam || purusha suktam || shri suktam
    || om shri umamaheshvara svamine nama shshuddhodaka snanam samarpayami | snananantaram acamaniyam
    samarpayami | vastram namo nagavibhushaya naradadi stutaya ca | vastrayugma mpradasyami parthiveshvara
    svikuru || om shri umamaheshvara svamine namah vastrayugmam samarpayami | vastrartham akshatan samarpayami
    yajnesha yajnavidhvamsa sarvadeva namaskrita | yajnasutra ncottariyakam || om shri umamaheshvara svamine
    namah yajnopavitam samarpayami | upavitartham akshatan samarpayami nagabharana vishvesha candrardhakritamastaka
    | parthiveshvara maddatta vi~bho || om shri umamaheshvara svamine namah abharanam samarpayami | gandham
    nte prayacchami grihana parameshvara | kasturi kunkumopetam shivashlishta bhujadvaya || om shri umamaheshvara
    svamine nama shshrigandhadi parimala dravyam samarpayami | akshatan ndivyan shali tundula mishritan
    | akshatosi svabhavena svikurushva maheshvara || om shri umamaheshvara svamine namah dhavalakshatan
    samarpayami | pushpam sugandhini supushpani jajibilvarka campakaih | nirmita mpushpamalanca nilakantha
    grihana bho || om shri umamaheshvara svamine namah pushpa bilvadalani samarpayami | athanga puja o
    padau pujayami | om ishvaraya namah januni pujayami | om haraya namah ntripurantakaya namah vya~ghracarmambaradharaya
    namah nkukshistha brahandaya namah ngauri manah priyaya namah nnagavritabhujadandaya namah bhujau
    pujayami | om shrikanthaya namah netrani pujayami | om rudraya namah mpujayami | om sharvaya namah
    mpujayami | om ardhanarishvaraya namah mpujayami | om shri umamaheshvaraya namah sarvanyangani pujayami
    | ashtottarashatanama puja om shivaya namah o mmaheshvaraya namah om shambhave namah o mpinakine namah
    om shashishekharaya namah om nnilalohitaya namah om shankaraya namah vi~shnuvallabhaya namah om shipivishtaya
    namah om ambikanathaya namah om shrikanthaya namah o mbhavaya namah om sharvaya namah o om shitikanthaya
    namah om shivapriyaya namah om ugraya namah o nkamaraye namah om andhakasura sudanaya namah o ntripurantakaya
    namah om mbhasmoddhulita vigrahaya namah om samapriyaya namah om svaramayaya namah o ntrayimurtaye
    namah om anishvaraya namah om sarvajnaya namah o mparamatmane namah om somasuryagni locanaya namah
    om havishe namah om mpancavaktraya namah om sadashivaya namah om mprajapataye namah om hiranyaretase
    namah o ngirishaya namah om anaghaya namah o mbhujanga bhushanaya namah o mmrityunjayaya namah om
    sukshmatanave namah o njagadvyapine namah o mmahasena janakaya namah o ncaruvikramaya namah om rudraya
    namah o mbhutapataye namah om sthanave namah om ahirbudhnyaya namah o ndigambaraya namah om ashtamurtaye
    namah om anekatmane namah om sattvikaya namah om shuddhavigrahaya namah om shashvataya namah o nkhandaparashave
    namah om ajaya namah o mmahadevaya namah om avyayaya namah om haraye namah o mpushadantabhide namah
    om avyagraya namah o ndakshadhvaraharaya namah om haraya namah mbhaganetrabhide namah om avyaktaya
    namah om sahasrakshaya namah om sahasrapade namah om apavargapradaya namah om anantaya namah o nnidhanapataye
    namah | o nnidhanapatantikaya namah | om urdhvaya namah | om urdhvalingaya namah | om hiranyaya namah
    | om hiranyalingaya namah | om suvarnaya namah | om suvarnalingaya namah | o ndivyalingaya namah |
    o mbhavalingaya namah | om sharvaya namah | om sharvalingaya namah | om shivaya namah | om shivalingaya
    namah | o njvalalingaya namah | om atmaya namah | om atmalingaya namah | o mparamalingaya namah |
    o mbhavaya devaya namah mbhavasya devasya patnyai namah | om sharvaya devaya namah om sharvasya devasya
    patnyai namah | om ishanaya devaya namah om ishanasya devasya patnyai namah | o mpashupataye devaya
    namah rdevasya patnyai namah | om rudraya devaya namah om rudrasya devasya patnyai namah | om ugraya
    devaya namah om ugrasya devasya patnyai namah | o mbhimaya devaya namah mbhimasya devasya patnyai
    namah | o mmahato devasya patnyai namah | om shri umamaheshvara svamine namah nana vidha parimala
    patra pushpakshatan samarpayami | dhupam dhurasi dhurva dhurvanta va~yam dhurvamastva ndevanamasi
    sasnitama va~hnitamam devahutama mahrutamasi havirdhana ndrigm hasva mahva rmitrasya tva cakshusha
    prekshe ma bherma sam vi~kta ma tva higmsisham | avahitabhya ssarvabhyo devatabhyo namah | dhupamaghrapayami
    | dipam shca mahyamavaha jivana nca disho disha | mano higmsi njagat | abibhradagna agahi shriya ma
    paripataya | avahitabhya ssarvabhyo devatabhyo namah | dhupamaghrapayami | dhupa dipanantaram shuddhacamaniyam
    samarpayami | naivedyam om sarva bhuta damanaya namah mbhurbhuvassuvah | tatsaviturvare mbhargo devasya
    dhimahi | dhiyo yo nah pracodaya t | deva savitah prasuvah | satya ntvartena parishincami | ntva satyena
    parishincami amritam astu | amritopastaranamasi | o mpranaya svahah | om apanaya svahah | om vya~naya
    svahah | om udanaya svahah | om samanaya svahah | o mbrahmane svahah | madhuvata ritayate madhuksharanti
    sindhavah | maddhvi ssantvoshadhih | madhunakta mutoshasi madhuma tparthivagm rajah | madhudyaurastu
    nah pita | madhumanno vanaspati rmadhumagm astu suryah | madhvirgavo bhavantu nah || madhu madhu madhu
    || avahitabhya ssarvabhyo devatabhyo namah | om shri umamaheshvara svamine namah | mahanaivedya nnivedayami
    | madhye madhye paniyam samarpayami | amritapidhanamasi | uttaraposhanam samarpayami | hastau prakshalayami
    | padau prakshalayami | shuddhacamaniyam samarpayami | tambulam nnagavallidalairyutam | karpuracurna
    sam mpratigrihyatam | avahitabhya ssarvabhyo devatabhyo namah | tambula nnivedayami | tambula carvananantaram
    shuddha acamaniyam samarpayami | nirajanam somo va etasya rajyamadatte | yo rajasa nrajyo va somena
    yajate | deva suvametani havigmshi bhavanti | etavanto vai devanagm savah | ta evasmai sava nprayacchanti
    | ta ena ssuvante rajyaya | devasu raja bhavati | rajadhirajaya prasahya sahine shravanaya kurmahe
    | sa me kaman kamakamaya mahya m | kameshvaro vai shravano dadatu | kuberaya vaishravanaya | maharajaya
