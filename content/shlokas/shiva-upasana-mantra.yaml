id: shiva-upasana-mantra
category: stotram
name:
  english: Shiva Upasana Mantra
content:
  english: nnidhanapataye namah | nidhanapatantikaya namah | urdhvaya namah | urdhvalingaya namah | hiranyaya
    namah | hiranyalingaya namah | suvarnaya namah | suvarnalingaya namah | divyaya namah | divyalingaya
    namah | bhavayah namah | bhavalingaya namah | sharvaya namah | sharvalingaya namah | shivaya namah
    | shivalingaya namah | jvalaya namah | jvalalingaya namah | atmaya namah | atmalingaya namah | paramaya
    namah | paramalingaya namah | etatsomasya suryasya sarvalingagg sthapayati panimantra mpavitram ||
    sadyo jata mprapadyami sadyo jataya vai namo namah | bhave bhave natibhave bhavasva mam | bhavo dbhavaya
    namah || vamadevaya namo jyeshthaya namah shreshthaya namo rudraya namah kalaya namah kalavikaranaya
    namo balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya namo manonmanaya namah
    | aghore bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudrarupebhyah || tatpurushaya vidmahe
    mahadevaya dhimahi | tanno rudrah pracodaya mishvarasarva bhutanam brahmadhipati rbrahma shivo me
    astu sadashivom || namo hiranyabahave hiranyavarnaya hiranyarupaya hiranyapataye 'mbikapataya umapataye
    pashupataye namo namah || ritagm satya nkrishnapingalam | urdhvaretam vi~shvarupaya vai namo namah
    || sarvo hyesha rudrastasmai rudraya namo astu | purusho vai rudrassanmaho namo namah | vishva nca
    yat | sarvo hyesha rudrastasmai rudraya namo astu | ka drudraya pracetase midhushtamaya tavyase |
    vocema shantamagm hride | sarvo hyesha rudrastasmai rudraya namo astu | ma no mahantamuta ma no arbhaka
    mma na ukshantamuta ma na ukshitam | ma no vadhih pitara mpriya ma nastanuvo rudra ririshah | ma nastoke
    tanaye ma na ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamito havishmamto namasa
    vidhema te | tryambakam mpushtivardhanam | urvarukamiva bandhananmrityormukshiya ma t | ye te sahasramayuta
    mpasha mrityo martyaya hantave | tan yajnasya mayaya sarvanava yajamahe | mrityave svaha mrityave
    svaha ngranthirasi rudro ma vishantakah | tenannena pyayasva || namo rudraya vishnave mrityurme pahi
    || tvamagne dyubhistva mashmanaspari | tvam nnripate jayase shucih || shivena me santishthasva syonena
    me santishthasva subhutena me santishthasva yajnasyadbhirmanu santishthasvopa te yajna nama upa te
    nama upa te namah || om shanti
  devanagari: न्निध॑नपतये॒ नमः । निधनपतान्तिकाय॒ नमः । ऊर्ध्वाय॒ नमः । ऊर्ध्वलिङ्गाय॒ नमः । हिरण्याय॒
    नमः । हिरण्यलिङ्गाय॒ नमः । सुवर्णाय॒ नमः । सुवर्णलिङ्गाय॒ नमः । दिव्याय॒ नमः । दिव्यलिङ्गाय॒ नमः ।
    भवायः॒ नमः । भवलिङ्गाय॒ नमः । शर्वाय॒ नमः । शर्वलिङ्गाय॒ नमः । शिवाय॒ नमः । शिवलिङ्गाय॒ नमः । ज्वलाय॒
    नमः । ज्वललिङ्गाय॒ नमः । आत्माय॒ नमः । आत्मलिङ्गाय॒ नमः । परमाय॒ नमः । परमलिङ्गाय॒ नमः । एतत्सोमस्य॑
    सूर्य॒स्य सर्वलिङ्गग्ग्॑ स्थाप॒य॒ति॒ पाणिमन्त्र म्पवि॒त्रम् ॥ स॒द्यो जा॒त म्प्र॑पद्या॒मि॒ स॒द्यो जा॒ताय॒
    वै नमो॒ नमः॑ । भ॒वे भ॑वे॒ नाति॑भवे भवस्व॒ माम् । भ॒वो द्भ॑वाय॒ नमः॑ ॥ वा॒म॒दे॒वाय॒ नमो ज्ये॒ष्ठाय॒
    नमः॑ श्रे॒ष्ठाय॒ नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒ नमः॒ कल॑विकरणाय॒ नमो॒ बल॑विकरणाय॒ नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒
    नम॒ स्सर्व॑भूतदमनाय॒ नमो॑ म॒नोन्म॑नाय॒ नमः॑ । अ॒घोरे भ्यो॒ घोर॒घोर॑तरेभ्यः । सर्वे भ्यो॒ नम॑स्ते अस्तु
    रु॒द्ररू॑पेभ्यः ॥ तत्पुरु॑षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि । तन्नो॑ रुद्रः प्रचो॒दया मीश्वरसर्व॑ भूता॒नां॒
    ब्रह्माधि॑पति॒ र्ब्रह्मा॑ शि॒वो मे॑ अस्तु सदाशि॒वोम् ॥ नमो हिरण्यबाहवे हिरण्यवर्णाय हिरण्यरूपाय हिरण्यपतये
    ऽम्बिकापतय उमापतये पशुपतये॑ नमो॒ नमः ॥ ऋ॒तग्ं स॒त्य ङ्कृष्ण॒पिङ्ग॑लम् । ऊ॒र्ध्वरे॑तं विँ॒श्वरू॑पाय॒
    वै नमो॒ नमः॑ ॥ सर्वो॒ ह्ये॑ष रु॒द्रस्तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु॒ । पुरु॑षो॒ वै रु॒द्रस्सन्म॒हो नमो॒
    नमः॑ । विश्व॑ ञ्च॒ यत् । सर्वो॒ ह्ये॑ष रु॒द्रस्तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु॒ । क द्रु॒द्राय॒ प्रचे॑तसे
    मी॒ढुष्ट॑माय॒ तव्य॑से । वो॒चेम॒ शन्त॑मग्ं हृ॒दे । सर्वो॒ ह्ये॑ष रु॒द्रस्तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु॒
    । मा नो॑ म॒हान्त॑मु॒त मा नो॑ अर्भ॒क म्मा न॒ उक्ष॑न्तमु॒त मा न॑ उक्षि॒तम् । मा नो॑ वधीः पि॒तर॒ म्प्रि॒या
    मा न॑स्त॒नुवो॑ रुद्र रीरिषः । मा न॑स्तो॒के तन॑ये॒ मा न॒ आयु॑षि॒ मा नो॒ गोषु॒ मा नो॒ अश्वे॑षु रीरिषः
    । वी॒रान्मा नो॑ रुद्र भामि॒तो ह॒विष्मं॑तो॒ नम॑सा विधेम ते । त्र्य॑म्बकं म्पु॑ष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒
    बन्ध॑नान्मृ॒त्योर्मु॑क्षीय॒ मा त् । ये ते॑ स॒हस्र॑म॒युत॒ म्पाशा॒ मृत्यो॒ मर्त्या॑य॒ हन्त॑वे । तान्
    य॒ज्ञस्य॑ मा॒यया॒ सर्वा॒नव॑ यजामहे । मृ॒त्यवे॒ स्वाहा॑ मृ॒त्यवे॒ स्वाहा ङ्ग्रन्थिरसि रुद्रो मा॑ विशा॒न्तकः
    । तेनान्नेना प्याय॒स्व ॥ नमो रुद्राय विष्णवे मृत्यु॑र्मे पा॒हि ॥ त्वम॑ग्ने द्युभि॒स्त्व मश्म॑न॒स्परि॑
    । त्वं न्नृ॑पते जायसे॒ शुचिः॒ ॥ शि॒वेन॑ मे॒ सन्ति॑ष्ठस्व स्यो॒नेन॑ मे॒ सन्ति॑ष्ठस्व सुभू॒तेन॑ मे॒
