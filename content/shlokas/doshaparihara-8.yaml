id: doshaparihara-8
category: stotram
name:
  english: doshaparihara 8
  devanagari: दोषपरिहार ८
content:
  english: doshapariharashtakam anyasya doshagananakutukam mamaitadavishkaroti niyatam mayi doshavattvam
    | doshah punarmayi na cedakhile satishe doshagrahah kathamudetu mamesha tasmin || 1|| esha vyathetarakriteti
    mamesha tasmin kopo yadi svaparakamamukhaprasuta | seyam vyatheti mayi me na kathannu kopah svasya
    vyatha svaduritaprabhava hi sarva || 2|| kamaprabhrityakhiladoshanidhermamaisha mayyaha doshamiti
    ko nu duragraho'smin | heyatvamalapati yo'yamalam na kena varyo'tha sattvavati so'yamasatkimaha ||
    3|| yah samshritah svahitadhirvyasanaturastaddoshasya tam prati vaco'stu tadanyadosham | yadvacmi
    tanmama na kim kshataye svadoshacintaiva me tadapanodaphalocita'tah || 4|| dosham parasya nanu grihnati
    mayyanena svatmaisha eva paragatrasamahritena | durvastuneva malinikriyate tadanyadoshagrahadahaha
    kim na nivartitavyam || 5|| nirdoshabhavamitarasya sadoshabhavam svasyapi samvidadhati paradoshadhirme
    | astamiyam taditara tu parartimatraheturvyanaktu na katham mama tucchabhavam|| 6|| padmadisaurabha
    iva bhramarasya harsham hitva'nyadiyasugune punaranyadoshe | harsho durartha iva gehakiteh kimaste
    ha me kadesha kripaya vigaletsa eshah || 7|| doshe svabhaji matikaushalamanyabhaji maudhyam gune'nyajushi
    harshabharah svabhaji | astaprasaktirakhileshu dayatyudaravrittyorjito mama kada'stu haranuragah ||
    8|| || iti shrishridhara ayyavalakrita doshapariharashtakam sampurnam ||
  devanagari: दोषपरिहाराष्टकम् अन्यस्य दोषगणनाकुतुकं ममैतदाविष्करोति नियतं मयि दोषवत्त्वम् । दोषः पुनर्मयि
    न चेदखिले सतीशे दोषग्रहः कथमुदेतु ममेश तस्मिन् ॥ १॥ एषा व्यथेतरकृतेति ममेश तस्मिन् कोपो यदि स्वपरकाममुखप्रसूता
    । सेयं व्यथेति मयि मे न कथन्नु कोपः स्वस्य व्यथा स्वदुरितप्रभवा हि सर्वा ॥ २॥ कामप्रभृत्यखिलदोषनिधेर्ममैष
    मय्याह दोषमिति को नु दुराग्रहोऽस्मिन् । हेयत्वमालपति योऽयमलं न केन वार्योऽथ सत्त्ववति सोऽयमसत्किमाह
    ॥ ३॥ यः संश्रितः स्वहितधीर्व्यसनातुरस्तद्दोषस्य तं प्रति वचोऽस्तु तदन्यदोषम् । यद्वच्मि तन्मम न किं
    क्षतये स्वदोषचिन्तैव मे तदपनोदफलोचिताऽतः ॥ ४॥ दोषं परस्य ननु गृह्णति मय्यनेन स्वात्मैष एव परगात्रसमाहृतेन
    । दुर्वस्तुनेव मलिनीक्रियते तदन्यदोषग्रहादहह किं न निवर्तितव्यम् ॥ ५॥ निर्दोषभावमितरस्य सदोषभावं स्वस्यापि
    संविदधती परदोषधीर्मे । आस्तामियं तदितरा तु परार्तिमात्रहेतुर्व्यनक्तु न कथं मम तुच्छभावम्॥ ६॥ पद्मादिसौरभ
    इव भ्रमरस्य हर्षं हित्वाऽन्यदीयसुगुणे पुनरन्यदोषे । हर्षो दुरर्थ इव गेहकिटेः किमास्ते हा मे कदेश कृपया
    विगलेत्स एषः ॥ ७॥ दोषे स्वभाजि मतिकौशलमन्यभाजि मौढ्यं गुणेऽन्यजुषि हर्षभरः स्वभाजि । अस्तप्रसक्तिरखिलेषु
    दयात्युदारवृत्त्योर्जितो मम कदाऽस्तु हरानुरागः ॥ ८॥ ॥ इति श्रीश्रीधर अय्यावालकृत दोषपरिहाराष्टकं सम्पूर्णम्
    ॥
