id: rudra-2
category: stotram
name:
  english: rudra
  devanagari: रुद्र
content:
  english: rudra om athatmanam shivatmanam shri rudrarupam dhyayet | shuddhasphatikasamkasham trinetram
    pancavaktrakam | gamgadharam dashabhujam sarvabharanabhushitam || nilagrivam shashadkamdkam nagayajnopavitinam
    | vyagracarmottariyam ca varenyamabhayapradam || kamandalvakshasutranam dharinam shulapaninam | jvalantam
    pidgalajatashikhamudyotadharinam || vrishaskandhasamarudham umadehardhadharinam | amritenaplutam shantam
    divyabhogasamanvitam || digdevatasamayuktam surasuranamaskritam | nityam ca shashvatam shuddham dhruvamaksharamavyayam
    || sarvavyapinamishanam rudram vai vishvarupinam | evam dhyatva dvijah smyaka tato yajanamarabhet
    || athato rudrasnanarcanabhishekavidhim vyakhyasyama
  devanagari: रुद्र ॐ अथात्मानं शिवात्मानं श्री रुद्ररुपं ध्यायेत् । शुद्धस्फटिकसंकाशं त्रिनेत्रं पञ्चवक्त्रकम्
    । गंगाधरं दशभुजं सर्वाभरणभूषितम् ।। नीलग्रीवं शशाड्कांड्कं नागयज्ञोपवीतिनम् । व्याग्रचर्मोत्तरीयं
    च वरेण्यमभयप्रदम् ।। कमण्डल्वक्षसूत्राणां धारिणं शूलपाणिनम् । ज्वलन्तं पिड्गलजटाशिखामुद्योतधारिणम्
    ।। वृषस्कन्धसमारूढं उमादेहार्धधारिणम् । अमृतेनाप्लुतं शान्तं दिव्यभोगसमन्वितम् ।। दिग्देवतासमायुक्तं
    सुरासुरनमस्कृतम् । नित्यं च शाश्वतं शुद्धं ध्रुवमक्षरमव्ययम् ।। सर्वव्यापिनमीशानं रुद्रं वै विश्वरूपिणम्
    । एवं ध्यात्वा द्विजः स्म्यक ततो यजनमारभेत् ।। अथातो रुद्रस्नानार्चनाभिषेकविधिं व्याख्यास्याम
