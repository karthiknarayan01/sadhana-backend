id: devaihkritamparvatistotram
category: stotram
name:
  english: devaihkritamparvatistotram
  devanagari: देवैःकृतंपार्वतीस्तोत्रम्
content:
  english: stutim cakrurdeva dhyatva maheshvarim | gangatate ca samhatya shruyatam kathayami te || 1||
    namo matre mahamatre jananyai te muhurnamah | namo mayai mahamaye mayayai te namo namah || 2|| brahmanyai
    ca'ksharanyai te muktanyai te namo namah | vasudevyai ca prakrityai pradhanayai namo namah || 3||
    bhumnai kalyai mahakalyai mahalakshmyai namo namah | hiranyayai sugarbhayai vairajyai te namo namah
    || 4|| varenyai vararupayai golokyai te namo namah | narayanyai ca krishnayai vaikunthayai namo namah
    || 5|| shvetayai ca badaryai ca martandayai namo namah | pavanyai pavamanayai ca'vyakrityai namo namah
    || 6|| savitryai capi gayatryai raudrayai te namo namah | dhatryai gauryai ca vaishnavyai jyotsnayai
    te namo namah || 7|| brahmacaripravaryayai viryayai te namo namah | mahatyai cabhimanayai cakutyai
    tai namo namah || 8|| cittyai vrittyai pravrittyai ca pralayayai namo namah | svargayai satyalokayai
    lokapayai namo namah || 9|| ramayai ca jayayai ca vijayayai namo namah | radhayai sarvakarinyai lakshmyai
    te'stu namo namah || 10|| nairrityai sukhasampattyai saumyayai te namo namah | varkshyai bijasvarupayai
    ratyai devyai namo namah || 11|| ya devi sarvasattveshu vishnumaya vyavasthita | nyasastasyai natistasyai
    namastasyai namo namah || 12|| cetana buddhirupa ya nidrarupa ca ya sthita | chayarupa kshudharupa
    shaktirupa ca ya sthita || 13|| trishna kshantirdaya prokta tasyai tasyai namo namah | lajja shantistatha
    shraddha kantirvrittih smritistatha || 14|| tushtih pushtishca ya prokta tasyai tubhyam namo namah
    | dhatryai caiva vidhatryai te matre devyai namo namah || 15|| asuranam mahanadya vartate samupadravah
    | antah sthitva pradrashtryai te varam varam namo namah || 16|| ityevam stuyamana sa parvati parameshvari
    | snanasritya''gata tatra yatra deva stuvanti te || 17|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 166
  devanagari: स्तुतिं चक्रुर्देवा ध्यात्वा महेश्वरीम् । गङ्गातटे च संहत्य श्रूयतां कथयामि ते ॥ १॥ नमो
    मात्रे महामात्रे जनन्यै ते मुहुर्नमः । नमो मायै महामाये मायायै ते नमो नमः ॥ २॥ ब्रह्माण्यै चाऽक्षराण्यै
    ते मुक्तान्यै ते नमो नमः । वासुदेव्यै च प्रकृत्यै प्रधानायै नमो नमः ॥ ३॥ भूम्नै काल्यै महाकाल्यै महालक्ष्म्यै
    नमो नमः । हिरण्यायै सुगर्भायै वैराज्यै ते नमो नमः ॥ ४॥ वरेण्यै वररूपायै गोलोक्यै ते नमो नमः । नारायण्यै
    च कृष्णायै वैकुण्ठायै नमो नमः ॥ ५॥ श्वेतायै च बदर्यै च मार्तण्डायै नमो नमः । पावन्यै पवमानायै चाऽव्याकृत्यै
    नमो नमः ॥ ६॥ सावित्र्यै चापि गायत्र्यै रौद्रायै ते नमो नमः । धात्र्यै गौर्यै च वैष्णव्यै ज्योत्स्नायै
    ते नमो नमः ॥ ७॥ ब्रह्मचारिप्रवर्यायै वीर्यायै ते नमो नमः । महत्यै चाभिमानायै चाकूत्यै तै नमो नमः ॥
    ८॥ चित्त्यै वृत्त्यै प्रवृत्त्यै च प्रलयायै नमो नमः । स्वर्गायै सत्यलोकायै लोकपायै नमो नमः ॥ ९॥ रमायै
    च जयायै च विजयायै नमो नमः । राधायै सर्वकारिण्यै लक्ष्म्यै तेऽस्तु नमो नमः ॥ १०॥ नैरृत्यै सुखसम्पत्त्यै
    सौम्यायै ते नमो नमः । वार्क्ष्यै बीजस्वरूपायै रत्यै देव्यै नमो नमः ॥ ११॥ या देवी सर्वसत्त्वेषु विष्णुमाया
    व्यवस्थिता । न्यासस्तस्यै नतिस्तस्यै नमस्तस्यै नमो नमः ॥ १२॥ चेतना बुद्धिरूपा या निद्रारूपा च या स्थिता
    । छायारूपा क्षुधारूपा शक्तिरूपा च या स्थिता ॥ १३॥ तृष्णा क्षान्तिर्दया प्रोक्ता तस्यै तस्यै नमो नमः
    । लज्जा शान्तिस्तथा श्रद्धा कान्तिर्वृत्तिः स्मृतिस्तथा ॥ १४॥ तुष्टिः पुष्टिश्च या प्रोक्ता तस्यै
    तुभ्यं नमो नमः । धात्र्यै चैव विधात्र्यै ते मात्रे देव्यै नमो नमः ॥ १५॥ असुराणां महानद्य वर्तते समुपद्रवः
    । अन्तः स्थित्वा प्रद्रष्ट्र्यै ते वारं वारं नमो नमः ॥ १६॥ इत्येवं स्तूयमाना सा पार्वती परमेश्वरी
    । स्नानसृत्याऽऽगता तत्र यत्र देवा स्तुवन्ति ते ॥ १७॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    १६६
