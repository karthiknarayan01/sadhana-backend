id: sri-panchayudha-stotram
category: stotram
name:
  english: Sri Panchayudha Stotram
content:
  english: sphuratsahasrarashikhatitivram sudarshanam bhaskarakotitulyam | suradvisham pranavinashi vishnoh
    cakram sada'ham sharanam prapadye || || vishnormukhotthanilapuritasya yasya dhvanirdanavadarpahanta
    | tam pancajanyam shashikotishubhram shankham sada'ham sharanam prapadye || || hiranmayim merusamanasaram
    kaumodakim daityakulaikahantrim | vaikunthavamagrakaragramrishtam gadam sada'ham sharanam prapadye
    || || yajjyaninadashravanatsuranam cetamsi nirmuktabhayani sadyah | bhavanti daityashanibanavarshaih
    sharngam sada'ham sharanam prapadye || || raksho'suranam kathinograkantha kshonita digdhasaram | tam
    nandakam nama hareh pradiptam khadgam sada'ham sharanam prapadye || || imam hareh pancamahayudhanam
    stavam pathedyo'nudinam prabhate | samasta duhkhani bhayani sadyah papani nashyanti sukhani santi
    || || vane rane shatru jalagnimadhye yadricchayapatsu mahabhayeshu | pathetvidam stotramanakulatma
    sukhibhavettatkrita sarvarakshah || || sacakrashankham sagadasisharngam yaccakrashankham gadakhadgasharnginam
    shriya sametojjvala shobhitangam vishnum sada'ham sharanam prapadye || jale rakshatu varahah sthale
    rakshatu vamanah | atavyam narasimhashca sarvatah patu keshavah || iti pancayudha stotram ||
  devanagari: स्फुरत्सहस्रारशिखातितीव्रं सुदर्शनं भास्करकोटितुल्यम् । सुरद्विषां प्राणविनाशि विष्णोः चक्रं
    सदाऽहं शरणं प्रपद्ये ॥ ॥ विष्णोर्मुखोत्थानिलपूरितस्य यस्य ध्वनिर्दानवदर्पहन्ता । तं पाञ्चजन्यं शशिकोटिशुभ्रं
    शङ्खं सदाऽहं शरणं प्रपद्ये ॥ ॥ हिरण्मयीं मेरुसमानसारां कौमोदकीं दैत्यकुलैकहन्त्रीम् । वैकुण्ठवामाग्रकराग्रमृष्टां
    गदां सदाऽहं शरणं प्रपद्ये ॥ ॥ यज्ज्यानिनादश्रवणात्सुराणां चेतांसि निर्मुक्तभयानि सद्यः । भवन्ति दैत्याशनिबाणवर्षैः
    शार्ङ्गं सदाऽहं शरणं प्रपद्ये ॥ ॥ रक्षोऽसुराणां कठिनोग्रकण्ठ क्षोणित दिग्धसारम् । तं नन्दकं नाम हरेः
    प्रदीप्तं खड्गं सदाऽहं शरणं प्रपद्ये ॥ ॥ इमं हरेः पञ्चमहायुधानां स्तवं पठेद्योऽनुदिनं प्रभाते । समस्त
    दुःखानि भयानि सद्यः पापानि नश्यन्ति सुखानि सन्ति ॥ ॥ वने रणे शत्रु जलाग्निमध्ये यदृच्छयापत्सु महाभयेषु
    । पठेत्विदं स्तोत्रमनाकुलात्मा सुखीभवेत्तत्कृत सर्वरक्षः ॥ ॥ सचक्रशङ्खं सगदासिशार्ङ्गं यच्चक्रशङ्खं
    गदखड्गशार्ङ्गिणं श्रिया समेतोज्ज्वल शोभिताङ्गं विष्णुं सदाऽहं शरणं प्रपद्ये ॥ जले रक्षतु वाराहः स्थले
    रक्षतु वामनः । अटव्यां नारसिंहश्च सर्वतः पातु केशवः ॥ इति पञ्चायुध स्तोत्रम् ॥
