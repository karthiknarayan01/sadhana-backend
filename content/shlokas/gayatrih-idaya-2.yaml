id: gayatrih-idaya-2
category: hridaya
name:
  english: gayatrihṟidaya 2
  devanagari: गायत्रीह्ऱिदय २
content:
  english: sayujyam viniyogam | ayatu varada devi akshara brahma sammitam | gayatri chandasam mata idam
    brahma juhasva me || yadannatkurute papam tadannatpratimucyate | yadratryatkurute papam tadratryatpratimucyate
    || sarva varne mahadevi sandhya vidye sarasvati | ajare amare devi sarva devi namo'stute || ojo'si
    saho'si balamasi bhrajo'si devanam dhama namasi vishvamasi | vishvayuh sarvamasi sarvayurabhi bhurom
    || gayatrim avahayami savitrim avahayami sarasvatim avahayami | chandarshina avahayami shriyam avahayami
    balam avahayami || gayatrya gayatri chando vishvamitra rishih savita devata | agnirmukham brahma shiro
    vishnurhridayam rudrahshikha | prithivi yonih pranapana vyanodana samana saprana shvetavarna samkhyayanyasa
    gotra gayatri caturvimshatyakshara tripada shat kukshih pancashirshopanayane viniyogah || | iti gayatri
    hridayam |
  devanagari: सायुज्यं विनियोगम् । आयातु वरदा देवी अक्षर ब्रह्म सम्मितम् । गायत्री छन्दसां माता इदं ब्रह्म
    जुहस्व मे ॥ यदन्नात्कुरुते पापं तदन्नत्प्रतिमुच्यते । यद्रात्र्यात्कुरुते पापं तद्रात्र्यात्प्रतिमुच्यते
    ॥ सर्व वर्णे महादेवि सन्ध्या विद्ये सरस्वति । अजरे अमरे देवि सर्व देवि नमोऽस्तुते ॥ ओजोऽसि सहोऽसि
    बलमसि भ्राजोऽसि देवानां धाम नामासि विश्वमसि । विश्वायुः सर्वमसि सर्वायुरभि भूरोम् ॥ गायत्रीं आवाहयामि
    सावित्रीं आवाहयामि सरस्वतीं आवाहयामि । छन्दर्शिन आवाहयामि श्रियं आवाहयामि बलं आवाहयामि ॥ गायत्र्या
    गायत्री छन्दो विश्वामित्र ऋषिः सविता देवता । अग्निर्मुखं ब्रह्मा शिरो विष्णुर्हृदयं रुद्रःशिखा । पृथिवी
    योनिः प्राणापान व्यानोदान समान सप्राण श्वेतवर्ण सांख्यायन्यास गोत्र गायत्री चतुर्विंशत्यक्षरा त्रिपाद
    षट् कुक्षिः पञ्चशीर्षोपनयने विनियोगः ॥ । इति गायत्री हृदयम् ।
