id: aghoramurtistotram
category: stotram
name:
  english: aghoramurtistotram
  devanagari: अघोरमूर्तिस्तोत्रम्
content:
  english: rinushvavahita priye | om namah paramakashashayine paramatmane || 16|| shivaya paramam shantam
    giranandapadaya te | avacyaya prameyaya pramatre vishvahetave || 17|| mahasamanyarupaya sattamatraikarupine
    | ghoshadidashadha shabdabijabhutaya shambhave || 18|| namah shantograghoradi mantrasamrambhagarbhine
    | revatisraja vishrambha samashleshavilasine || 16|| namah samarasasvadaparanandopabhogine | bhogapanaye
    namastubhyam yogisha pujitatmane || 20|| dvayanirmulanodyogasamullasitamurtaye | haraprasaravikshobhavispashtaksharamurttaye
    || 21|| namo mayasvarupaya sthanave parameshthine | ghorasamsarasambhogadayine sthitikarine || 22||
    kaladi kshitiparyantam paline vibhave namah | rohanaya mahamohadhvantavidhvamsahetave || 23|| hridayambujasankocabhedine
    shiva manave | bhogamokshaphalapraptihetuyogavidhayine || 24|| namah paramanirvanadayine candramaulaye
    | ghoshyaya sarvamantranam sarvavanmayamurtaye || 25|| namah sharvaya sarvaya sarvapapapaharine |
    ravanaya ravantaya namo'taravaravine || 26|| nityaya suprabuddhaya sarvantaratamaya te | ghoshaya
    paranadantacaraya khacaraya te || 27|| namo vakpataye tubhyam bhagaya pararupine | ravanaya ratisharngadehine
    citrakarmane || 28|| namah shailasutamatre vishvakartre mahatmane | namo marapratishthaya sarvantipadagaya
    te || 26|| namah samastatattvaya vyapine citsvarupine | khedvaraya bhadraya namaste ruparupine ||
    30|| paraparaparispandamandiraya namo'stu te | bharitakhilavishvaya yogagamyaya yogine || 31|| namah
    sarveshvareshaya mahahamsaya shambhave | carvyaya carvaniyaya carvakaya caraya ca || 32|| ravindusandhisamsthaya
    mahacakresha te namah | sarvanusyutarupaya sarvacchadakashaktaye || 33|| sarvabhakshaya sharvaya namaste
    sarvarupine | ramyaya vallabhakrantadehardhaya vinodine || 34|| namah prasannadushprapasaubhagyaphaladayine
    | tanmaheshaya tattvaya vedine bhavabhedine || 35|| mahabhairavanathaya bhaktigamyaya te namah | shaktigarbhaprabodhaya
    sharanyaya sharirine || 36|| shantipushtyadisadhyaya sadhakaya namo namah | ravatkundalinigarbhaprabodhapraptashaktaye
    || 37|| tatsphotanapatupraudhaparamakshararupine | samastavyastasangrastarashmijalodayatmane || 38||
    namastubhyam mahasenarupine vishvagarbhine | revaravasamudbhutavahnijvalavabhasine || 36|| ghanibhutavikalpandhyavishvabandhavilapine
    | bhoginispandanarudhapraudhamalabdhagarvine || 40|| namaste sarvabhakshaya paramamritalobhine | nabhakotisamaveshabharitakhilasrishtaye
    || 41|| namah shaktishariraya kotidvitayasangine | mahamohasamakrantajivavargavibodhine || 42|| maheshvaraya
    jagatam namah karanabandhave | stenonmulanadakshaikatritaye vishvamurttaye || 43|| namaste'stu mahadevanamne
    parasudhatmane | rugdravine mahavirya ruruvamshavinashine || 44|| rudraya dravitasheshabandhanaya
    namo namah | dravatyararasasvadacarvanodyuktaye namah || 45|| namastridashapujyaya sarvakaranahetave
    | rupatita namastubhyam namaste bahurupine || 46|| tryambakaya tridha matashcarine ca tricakshushe
    | peshalopayalabhyaya bhaktibhajam mahatmanam || 47|| durlabhaya mahakrantacetasam tu namo namah |
    bhayapradaya dushtanam bhavaya bhayabhedine || 48|| bhavyaya tvanmayanam tu sarvadaya namo namah |
    anunam muktaye ghoraghorasamsaradayine || 46|| ghoratighoramudhanam tiraskartre namo'stu te | ityevam
    stotrarajendram mahabhairavabhashitam || 50|| yogininam param saram na dadyadyasya kasyacit | adikshite
    shathe krure nissatye shucivarjite || 51|| nastike ca khale murkhe pramatte vilupte'lase | gurushastrasadacaradushake
    kalahapriye || 52|| nirdaye cumbake kshudre samayaghne'tha dambhike | dakshinyarahite pape dharmahine'tha
    garvite || 53|| pashunam sannidhau devi noccaryam sarvatha kvacit | asya samsmritamatrasya vighna
    nashyanti sarvashah || 54|| guhyaka yatudhanashca vetala rakshasadayah | damarashca pishacashca krurasattvashca
    putanah || 55|| byadhidurbhikshadaurbhagyamarimohavishadayah | gajavyaghradayo dushtah palayante ca
    sarvashah | sarve dushtah pranashyanti ityajna parameshvari || 56|| || iti aghorastotram samaptam
    || || shubhamastu ||
  devanagari: ृणुष्वावहिता प्रिये । ॐ नमः परमाकाशशायिने परमात्मने ॥ १६॥ शिवाय परमं शान्तं गिरानन्दपदाय
    ते । अवाच्याय प्रमेयाय प्रमात्रे विश्वहेतवे ॥ १७॥ महासामान्यरूपाय सत्तामात्रैकरूपिणे । घोषादिदशधा
    शब्दबीजभूताय शम्भवे ॥ १८॥ नमः शान्तोग्रघोरादि मन्त्रसंरम्भगर्भिणे । रेवतीस्रज विश्रम्भ समाश्लेषविलासिने
    ॥ १६॥ नमः समरसास्वादपरानन्दोपभोगिने । भोगपाणये नमस्तुभ्यं योगीश पूजितात्मने ॥ २०॥ द्वयनिर्मूलनोद्योगसमुल्लासितमूर्तये
    । हरप्रसरविक्षोभविस्पष्टाक्षरमूर्त्तये ॥ २१॥ नमो मायास्वरूपाय स्थाणवे परमेष्ठिने । घोरसंसारसम्भोगदायिने
    स्थितिकारिणे ॥ २२॥ कालादि क्षितिपर्यन्तं पालिने विभवे नमः । रोहणाय महामोहध्वान्तविध्वंसहेतवे ॥ २३॥
    हृदयाम्बुजसङ्कोचभेदिने शिव मानवे । भोगमोक्षफलप्राप्तिहेतुयोगविधायिने ॥ २४॥ नमः परमनिर्वाणदायिने चन्द्रमौलये
    । घोष्याय सर्वमन्त्राणां सर्ववाङ्मयमूर्तये ॥ २५॥ नमः शर्वाय सर्वाय सर्वपापापहारिणे । रवणाय रवान्ताय
    नमोऽतरावराविणे ॥ २६॥ नित्याय सुप्रबुद्धाय सर्वान्तरतमाय ते । घोषाय परनादान्तचराय खचराय ते ॥ २७॥ नमो
    वाक्पतये तुभ्यं भगाय पररूपिणे । रवणाय रतीशार्ङ्गदेहिने चित्रकर्मणे ॥ २८॥ नमः शैलसुतामात्रे विश्वकर्त्रे
    महात्मने । नमो मारप्रतिष्ठाय सर्वन्तिपदगाय ते ॥ २६॥ नमः समस्ततत्त्वाय व्यापिने चित्स्वरूपिणे । खेद्वाराय
    भद्राय नमस्ते रूपरूपिणे ॥ ३०॥ परापरपरिस्पन्दमन्दिराय नमोऽस्तु ते । भरिताखिलविश्वाय योगगम्याय योगिने
    ॥ ३१॥ नमः सर्वेश्वरेशाय महाहंसाय शम्भवे । चर्व्याय चर्वणीयाय चर्वकाय चराय च ॥ ३२॥ रवीन्दुसन्धिसंस्थाय
    महाचक्रेश ते नमः । सर्वानुस्यूतरूपाय सर्वाच्छादकशक्तये ॥ ३३॥ सर्वभक्षाय शर्वाय नमस्ते सर्वरूपिणे ।
    रम्याय वल्लभाक्रान्तदेहार्धाय विनोदिने ॥ ३४॥ नमः प्रसन्नदुष्प्रापसौभाग्यफलदायिने । तन्महेशाय तत्त्वाय
    वेदिने भवभेदिने ॥ ३५॥ महाभैरवनाथाय भक्तिगम्याय ते नमः । शक्तिगर्भप्रबोधाय शरण्याय शरीरिणे ॥ ३६॥ शान्तिपुष्ट्यादिसाध्याय
    साधकाय नमो नमः । रवत्कुण्डलिनीगर्भप्रबोधप्राप्तशक्तये ॥ ३७॥ तत्स्फोटनपटुप्रौढपरमाक्षररूपिणे । समस्तव्यस्तसङ्ग्रस्तरश्मिजालोदयात्मने
    ॥ ३८॥ नमस्तुभ्यं महासेनरूपिणे विश्वगर्भिणे । रेवारवसमुद्भूतवह्निज्वालावभासिने ॥ ३६॥ घनीभूतविकल्पान्ध्यविश्वबन्धविलापिने
    । भोगिनीस्पन्दनारूढप्रौढमालब्धगर्विणे ॥ ४०॥ नमस्ते सर्वभक्षाय परमामृतलोभिने । नभकोटिसमावेशभरिताखिलसृष्टये
    ॥ ४१॥ नमः शक्तिशरीराय कोटिद्वितयसङ्गिने । महामोहसमाक्रान्तजीववर्गविबोधिने ॥ ४२॥ महेश्वराय जगतां नमः
    कारणबन्धवे । स्तेनोन्मूलनदक्षैकत्रितये विश्वमूर्त्तये ॥ ४३॥ नमस्तेऽस्तु महादेवनाम्ने परसुधात्मने ।
    रुग्द्राविणे महावीर्य रुरुवंशविनाशिने ॥ ४४॥ रुद्राय द्राविताशेषबन्धनाय नमो नमः । द्रवत्यररसास्वादचर्वणोद्युक्तये
    नमः ॥ ४५॥ नमस्त्रिदशपूज्याय सर्वकारणहेतवे । रूपातीत नमस्तुभ्यं नमस्ते बहुरूपिणे ॥ ४६॥ त्र्यम्बकाय
    त्रिधा मातश्चारिणे च त्रिचक्षुषे । पेशलोपायलभ्याय भक्तिभाजां महात्मनाम् ॥ ४७॥ दुर्लभाय महाक्रान्तचेतसां
    तु नमो नमः । भयप्रदाय दुष्टानां भवाय भयभेदिने ॥ ४८॥ भव्याय त्वन्मयानां तु सर्वदाय नमो नमः । अणूनां
    मुक्तये घोरघोरसंसारदायिने ॥ ४६॥ घोरातिघोरमूढानां तिरस्कर्त्रे नमोऽस्तु ते । इत्येवं स्तोत्रराजेन्द्रं
    महाभैरवभाषितम् ॥ ५०॥ योगिनीनां परं सारं न दद्याद्यस्य कस्याचित् । अदीक्षिते शठे क्रूरे निस्सत्ये शुचिवर्जिते
    ॥ ५१॥ नास्तिके च खले मूर्खे प्रमत्ते विलुप्तेऽलसे । गुरुशास्त्रसदाचारदूषके कलहप्रिये ॥ ५२॥ निर्दये
    चुम्बके क्षुद्रे समयघ्नेऽथ दाम्भिके । दाक्षिण्यरहिते पापे धर्महीनेऽथ गर्विते ॥ ५३॥ पशूनां सन्निधौ
    देवि नोच्चार्यं सर्वथा क्वचित् । अस्य संस्मृतमात्रस्य विघ्ना नश्यन्ति सर्वशः ॥ ५४॥ गुह्यका यातुधानाश्च
    वेताला राक्षसादयः । डामराश्च पिशाचाश्च क्रूरसत्त्वाश्च पूतनाः ॥ ५५॥ ब्याधिदुर्भिक्षदौर्भाग्यमारिमोहविषादयः
    । गजव्याघ्रादयो दुष्टाः पलायन्ते च सर्वशः । सर्वे दुष्टाः प्रणश्यन्ति इत्याज्ञा पारमेश्वरी ॥ ५६॥ ॥
    इति अघोरस्तोत्रं समाप्तम् ॥ ॥ शुभमस्तु ॥
