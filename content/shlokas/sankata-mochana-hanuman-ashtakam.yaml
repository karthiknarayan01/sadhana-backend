id: sankata-mochana-hanuman-ashtakam
category: stotram
name:
  english: Sankata Mochana Hanuman Ashtakam
content:
  english: bala samaya ravi bhakshi liyo taba tinahum loka bhayo andhiyarom | tahi som trasa bhayo jaga
    ko yaha sankata kahu som jata na taro | devana ani kari binati taba chadavoyi diyo ravi kashta nivaro
    | ko nahim janata hai jaga mem kapi sankatamocana nama tiharo | ko bali ki trasa kapisa basaim giri
    jata mahaprabhu pantha niharo | caunki mahamuni sapa diyo taba cahie kauna bicara bicaro | kaidvija
    rupa livaya mahaprabhu so tuma dasa ke soka nivaro | ko angada ke sanga lena ge siya khoja kapisa
    yaha baina ucaro | jivata na bacihau hama so ju bina sudhi laye ihavo pagu dharo | heri thake tata
    sindhu sabe taba sudhi prana ubaro | ko ravana trasa di siya ko saba rakshasi som kahi soka nivaro
    | tahi samaya hanumana mahaprabhu jae maha rajanicara maro | cahata siya asoka som agi su dai prabhumudrika
    soka nivaro | ko bana lagyo ura lachimana ke taba prana taje suta ravana maro | lai griha baidya sushena
    sameta tabai giri drona su bira uparo | ani sajivana hatha die taba lachimana ke tuma prana ubaro
    | ko ravana judha ajana kiyo taba naga ki phamsa sabai sira daro | shriraghunatha sameta sabai dala
    moha bhayo yaha sankata bharo | ani khagesa tabai hanumana ju bandhana kati sutrasa nivaro | ko bandhu
    sameta jabai ahiravana lai raghunatha patala sidharo | debinhim puji bhali vidhi som bali deu sabai
    mili mantra vicaro | jaye sahae bhayo taba hi ahiravana sainya sameta samharo | ko kaja kiye badavo
    devana ke tuma bira mahaprabhu dekhi bicaro | kauna so sankata mora gariba ko jo tumase nahim jata
    hai taro | begi haro hanumana mahaprabhu jo kachu sankata hoe hamaro | ko doha lala deha lali lase
    aru dhari lala langura | vajra deha danava dalana
  devanagari: बाल समय रवि भक्षी लियो तब तीनहुं लोक भयो अन्धियारोम् । ताहि सों त्रास भयो जग को यह सङ्कट
    काहु सों जात न टारो । देवन आनि करी बिनती तब छाडवोयी दियो रवि कष्ट निवारो । को नहीं जानत है जग में
    कपि सङ्कटमोचन नाम तिहारो । को बालि की त्रास कपीस बसैं गिरि जात महाप्रभु पन्थ निहारो । चौङ्कि महामुनि
    साप दियो तब चाहिए कौन बिचार बिचारो । कैद्विज रूप लिवाय महाप्रभु सो तुम दास के सोक निवारो । को अङ्गद
    के सङ्ग लेन गे सिय खोज कपीस यह बैन उचारो । जीवत ना बचिहौ हम सो जु बिना सुधि लाये इहावो पगु धारो ।
    हेरी थके तट सिन्धु सबे तब सुधि प्राण उबारो । को रावण त्रास दी सिय को सब राक्षसी सों कही सोक निवारो
    । ताहि समय हनुमान महाप्रभु जाए महा रजनीचर मरो । चाहत सीय असोक सों आगि सु दै प्रभुमुद्रिका सोक निवारो
    । को बान लग्यो उर लछिमन के तब प्राण तजे सूत रावन मारो । लै गृह बैद्य सुषेन समेत तबै गिरि द्रोण सु
    बीर उपारो । आनि सजीवन हाथ दिए तब लछिमन के तुम प्राण उबारो । को रावण जुध अजान कियो तब नाग कि फांस सबै
    सिर डारो । श्रीरघुनाथ समेत सबै दल मोह भयो यह सङ्कट भारो । आनि खगेस तबै हनुमान जु बन्धन काटि सुत्रास
    निवारो । को बन्धू समेत जबै अहिरावन लै रघुनाथ पताल सिधारो । देबिन्हीं पूजि भलि विधि सों बलि देउ सबै
    मिलि मन्त्र विचारो । जाये सहाए भयो तब ही अहिरावन सैन्य समेत संहारो । को काज किये बडवो देवन के तुम
    बीर महाप्रभु देखि बिचारो । कौन सो सङ्कट मोर गरीब को जो तुमसे नहिं जात है टारो । बेगि हरो हनुमान महाप्रभु
    जो कछु सङ्कट होए हमारो । को दोहा लाल देह लाली लसे अरु धरि लाल लङ्गूर । वज्र देह दानव दलन
