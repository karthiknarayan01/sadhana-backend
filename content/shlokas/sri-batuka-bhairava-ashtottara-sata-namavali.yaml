    viraje namah | om shmashanavasine namah | | om mamsashine namah | om kharparashine namah | om makhantakrite
    namah | om raktapaya namah | om pranapaya namah | om siddhaya namah | om siddhidaya namah | om siddhasevitaya
    namah | om karalaya namah | om kalashamanaya namah | | om kalakashthatanave namah | om kavaye namah
    | om trinetraya namah | om bahunetraya namah | om pingalalocanaya namah | om shulapanaye namah | om
    khadgapanaye namah | om kankaline namah | om dhumralocanaya namah | om abhirave namah | | om bhairavaya
    namah | om bhairavipataye namah | om bhutapaya namah | om yoginipataye namah | om dhanadaya namah
    | om dhanaharine namah | om dhanapaya namah | om pratibhavavate namah | om nagaharaya namah | om nagakeshaya
    namah | | om vyomakeshaya namah | om kapalabhrite namah | om kalaya namah | om kapalamaline namah
    | om kamaniyaya namah | om kalanidhaye namah | om trilocanaya namah | om jvalannetraya namah | om
    trishikhine namah | om trilokabhrite namah | | om trivrittanayanaya namah | om dimbhaya namah om shantaya
    namah | om shantajanapriyaya namah | om vatukaya namah | om vatukeshaya namah | om khatvangavaradharakaya
    namah | om bhutadhyakshaya namah | om pashupataye namah | om bhikshukaya namah | | om paricarakaya
    namah | om dhurtaya namah | om digambaraya namah | om saurine namah | om harine namah | om pandulocanaya
    namah | om prashantaya namah | om shantidaya namah | om shuddhaya namah | om shankarapriyabandhavaya
    namah | | om ashtamurtaye namah | om nidhishaya namah | om jnanacakshushe namah | om tamomayaya namah
    | om ashtadharaya namah | om kaladharaya namah | om sarpayuktaya namah | om shashishikhaya namah |
    om bhudharaya namah | om bhudharadhishaya namah | | om bhupataye namah | om bhudharatmakaya namah
    | om kankaladharine namah | om mundine namah | om vyalayajnopavitavate namah | om jrimbhanaya namah
    | om mohanaya namah | om stambhine namah | om maranaya namah | om kshobhanaya namah | | om shuddhanilanjanaprakhyadehaya
    namah | om mundavibhushitaya namah | om balibhuje namah | om balibhutatmane namah | om kamine namah
    | om kamaparakramaya namah | om sarvapattarakaya namah | om durgaya namah | om dushtabhutanishevitaya
    namah | om kamine namah | | om kalanidhaye namah | om kantaya namah | om kaminivashakrite namah |
    om vashine namah | om sarvasiddhipradaya namah | om vaidyaya namah | om prabhavishnave namah | om
    prabhavavate namah | | iti shri batukabhairavashtottarashatanamavali |
