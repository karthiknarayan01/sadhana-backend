id: yogeshvarisahasranamastotram
category: sahasranama
name:
  english: yogeshvarisahasranamastotram
  devanagari: योगेश्वरीसहस्रनामस्तोत्रम्
content:
  english: katyayani shankharava ghurghura simhavahini || 49|| narayanishvari candi ghantali devasundari
    | virupa vamani kubja karnakubja ghanastani || 50|| nila shakambhari durga sarvadurgartiharini | damshtrankitamukha
    bhima nilapatrashirodhara || 51|| mahishaghni mahadevi kumari simhavahini | danavamstarjayanti ca
    sarvakamadugha shiva || 52|| kanya kumarika caiva deveshi tripura tatha | kalyani rohini caiva kalika
    candika para || 53|| shambhavi caiva durga ca subhadra ca yashasvini | kalatmika kalatita karunyahridaya
    shiva || 54|| karunyajanani nitya kalyani karunakara | kamadhara kamarupa kalacandasvarupini || 55||
    kaladandasvarupini kamada karunadhara kalika kamada shubha | candavira candamaya candamundavinashini
    || 56|| candika shaktiratyugra candika candavigraha | gajanana simhamukhi gridhrasya ca maheshvari
    || 57|| ushtragriva hayagriva kalaratrirnishacari | kankari raudracitkari phetkari bhutadamari ||
    58|| raudrachitkari varahi sharabhasya ca shatakshi mamsabhojani | kankali dakini kali shuklangi kalahapriya
    || 59|| ulukika shivarava dhumrakshi citranadini | urdhvakeshi bhadrakeshi shavahasta ca malini ||
    60|| kapalahasta raktakshi shyeni rudhirapayini | khadgini dirghalamboshthi pashahasta balakini ||
    61|| kakatunda patrahasta dhurjati vishabhakshini | pashughni papahantri ca mayuri vikatanana || 62||
    bhayavidhvamsini caiva pretasya pretavahini | kotarakshi lasajjihva ashtavaktra surapriya || 63||
    vyattasya dhumanihshvasa tripura bhuvaneshvari | brihattunda candahasta pracanda candavikrama || 64||
    dandahasta sthulakeshi brihatkukshiryamaduti karalini | dashavaktra dashapada dashahasta vilasini
    || 65|| anadyantasvarupa ca krodharupa manogatih | adirantasvarupa adihantasvarupa manushrutismritirghranacakshustvagrasanatmika
    || 66|| tvagrasanarasah || yogimanasasamstha ca yogasiddhipradayika | ugrani ugrarupa ca ugratarasvarupini
    || 67|| ugrarupadhara caiva ugreshi ugravasini | bhima ca bhimakeshi ca bhimamurtishca bhamini ||
    68|| bhimatibhimarupa ca bhimarupa jaganmayi | khadginyabhayahasta ca ghantadamarudharini || 69||
    pashini nagahasta ca yoginyankushadharini | yajna ca yajnamurtishca dakshayajnavinashini || 70|| yajnadikshadhara
    devi yajnasiddhipradayini | hiranyabahucarana sharanagatapalini || 71|| anamnyanekanamni ca nirguna
    ca gunatmika | mano jagatpratishtha ca sarvakalyanamurtini || 72|| brahmadisuravandya ca gangadharajatasthita
    | mahamoha mahadiptih siddhavidya ca yogini || 73|| yogini candika siddha siddhasaddhya shivapriya
    | sarayurgomati bhima gautami narmada mahi || 74|| bhagirathi ca kaveri triveni gandaki sarah | sara
    sushuptirjagritirnidra svapna turya ca cakrini || 75|| ahalyarundhati caiva tara mandodari tatha |
    devi padmavati caiva tripureshasvarupini || 76|| ekavira mahadevi kanakadhya ca devata | ekavira tamodevi
    shulini parighastra ca khadginyabahyadevata || 77|| kauberi dhanada yamya''gneyi vayutanurnisha |
    ishani nairritih saumya mahendri varunisama || 78|| varuni tatha sarvarshipujaniyanghrih sarvayantradhidevata
    | saptadhatumayimurtih saptadhatvantarashraya || 79|| dehapushtirmanastushtirannapushtirbaloddhata
    | taponishtha tapoyukta tapasahsiddhidayini || 80|| tapasvini tapahsiddhih tapasi ca tapahpriya |
    aushadhi vaidyamata ca dravyashaktihprabhavini || 81|| vedavidya ca vaidya ca sukula kulapujita |
    jalandharashiracchetri maharshihitakarini || 82|| yoganitirmahayoga kalaratrirmaharava | amoha ca
    pragalbha ca gayatri haravallabha || 83|| viprakhya vyomakara ca muniviprapriya sati | jagatkartri
    jagatkari jagacchaya jagannidhih || 84|| jagashvasa jagannidhih jagatprana jagaddamshtra jagajjihva
    jagadrasa | jagaccakshurjagadghrana jagacchotra jaganmukha || 85|| jagacchatra jagadvaktra jagadbhartri
    jagatpita | jagatpatni jaganmata jagadbhrata jagatsuhrit || 86|| jagaddhatri jagatsuhrit jagaddhatri
    jagatprana jagadyonirjaganmayi | sarvastambhi mahamaya jagaddiksha jaya tatha || 87|| bhaktaikalabhya
    dvividha trividha ca caturvidha | bhaktaikalakshya indrakshi pancabhuta ca sahasrarupadharini || 88||
    pancarupa muladivasini caiva ambapuranivasini | navakumbha navarucih kamajvala navanana || 89|| garbhajvala
    tatha bala cakshurjvala navambara | navarupa navakala navanadi navanana || 90|| navakrida navavidha
    navayoginika tatha | vedavidya mahavidya vidyadatri visharada || 91|| kumari yuvati bala kumarivratacarini
    | kumaribhaktasukhini kumarirupadharini || 92|| bhavani vishnujanani brahmadijanani para | ganeshajanani
    shaktih kumarajanani shubha || 93|| bhagyashraya bhagavati bhaktabhishtapradayini | bhagatmika bhagadhara
    rupini bhagamalini || 94|| bhagarogahara bhavya sushruh paramamangala | sharvani capalapangi carucandrakaladhara
    || 95|| vishalakshi vishvamata vishvavandya vilasini | vishvavidya vilasini shubhaprada shubhavarta
    vrittapinapayodhara || 96|| amba samsaramathini mridani sarvamangala | vishnusamsevita shuddha brahmadisurasevita
    || 97|| paramanandashaktishca paramanandarupini | ramanandasvarupini paramanandajanani paramanandadayini
    || 98|| paropakaranirata parama bhaktavatsala | anandabhairavi balabhairavi batubhairavi || 99|| shmashanabhairavi
    kalibhairavi purabhairavi || 100|| purnacandrabhavadana purnacandranibhamshuka | shubhalakshanasampanna
    shubhanantagunarnava || 101|| shubhasaubhagyanilaya shubhacararata priya | sukhasambhogabhavana sarvasaukhyanirupini
    || 102|| avalamba tatha vagmi pravara vagvivadini | vadyavadini ghrinadhipavrita kopaduttirnakutilanana
    || 103|| papadapapanasha ca brahmagnishapamocani | sarvatita ca ucchishtacandali parighayudha || 104||
    onkari vedakari ca hrinkari sakalagama | yankari carcita carcicarcita cakrarupini || 105|| mahavyadhavanaroha
    dhanurbanadhara dhara | vara lambini ca pipasa ca kshudha sandeshika tatha || 106|| bhuktida muktida
    devi siddhida shubhadayini | siddhida buddhida mata varmini phaladayini || 107|| candika candamathani
    candadarpanivarini | candamartandanayana candragninayana sati || 108|| sarvangasundari rakta raktavastrottariyaka
    | japapavakasindura raktacandanadharini || 109|| japastabakasindura raktasinduradharini karpuragarukasturikunkumadravalepini
    | vicitraratnaprithivikalmashaghni talasthita || 110|| bhagatmika bhagadhara rupini bhagamalini |
    lingabhidhayini lingapriya linganivasini || 111|| bhagalingasvarupa ca bhagalingasukhavaha | svayambhukusumaprita
    svayambhukusumarcita || 112|| svayambhukusumasnata svayambhupushpatarpita | svayambhupushpatilaka
    svayambhupushpadharini || 113|| pundikakara punya punyada punyarupini | punyajneya punyavandya punyavedya
    puratani || 114|| punyamurtih puratana anavadya vedavidya vedavedantarupini | mayatita srishtamaya
    maya dharmatmavandita || 115|| asrishta sangarahita srishtihetuh kapardini | vrisharudha shulahasta
    sthitisamharakarini || 116|| mandasthitih shuddharupa shuddhacitta munistuta | mahabhagyavati daksha
    dakshadhvaravinashini || 117|| aparnananyasharana bhaktabhishtaphalaprada | nitya sundarasarvangi
    saccidanandalakshana || 118|| kamala keshija keshi karsha karpurakalija | girija garvaja gotra akula
    kulaja tatha || 119|| dinaja dinamana ca vedaja vedasambhrita | vedasammata krodhaja kutaja dhara
    parama balagarvita || 120|| sarvalokottarabhava sarvakalodbhavatmika | kundagolodbhavaprita kundagolodbhavatmika
    || 121|| kundapushpasadapritih pushpagolasadaratih | shukramurtih shukradeha shukrapujitamurtini ||
    122|| shukrapujakamurtini videha vimala krura cola karnataki tatha | caunda karnataki trimatra utkala
    maundi virekha viravandita || 123|| shyamala gauravipina magadheshvaravandita | parvati karmanasha
    ca kailasavasika tatha || 124|| shalagramashila mali shardula pingakeshini | narada sharada caiva
    renuka gaganeshvari || 125|| dhenurupa rukmini ca gopika yamunashraya | sukantha kokila mena cirananda
    shivatmika || 126|| kandarpakotilavanya sundara sundarastani | vishvapaksha vishvaraksha vishvanathapriya
    sati || 127|| yogini yogayukta ca yogangadhyanashalini | yogapattadhara mukta muktanam paramagatih
    || 128|| kurukshetravanih kashi mathura kancyavantika | ayodhya dvaraka maya tirtha tirthakari priya
    || 129|| tripushkara'prameya ca koshastha koshavasini | kushavarta kaushiki ca koshamba koshavardhini
    || 130|| padmakosha koshadakshi kusumbhakusumapriya | tulakoti ca kakutstha sthavara ca varashraya
    || 131|| om hrim yam yam rudradaivatyayai yogeshvariryesvaha | om hrim yam yam
  devanagari: कात्यायनी शङ्खरवा घुर्घुरा सिंहवाहिनी ॥ ४९॥ नारायणीश्वरी चण्डी घण्टाली देवसुन्दरी । विरूपा
    वामनी कुब्जा कर्णकुब्जा घनस्तनी ॥ ५०॥ नीला शाकम्भरी दुर्गा सर्वदुर्गार्तिहारिणी । दंष्ट्राङ्कितमुखा
    भीमा नीलपत्रशिरोधरा ॥ ५१॥ महिषघ्नी महादेवी कुमारी सिंहवाहिनी । दानवांस्तर्जयन्ती च सर्वकामदुघा शिवा
    ॥ ५२॥ कन्या कुमारिका चैव देवेशी त्रिपुरा तथा । कल्याणी रोहिणी चैव कालिका चण्डिका परा ॥ ५३॥ शाम्भवी
    चैव दुर्गा च सुभद्रा च यशस्विनी । कालात्मिका कलातीता कारुण्यहृदया शिवा ॥ ५४॥ कारुण्यजननी नित्या कल्याणी
    करुणाकरा । कामाधारा कामरूपा कालचण्डस्वरूपिणी ॥ ५५॥ कालदण्डस्वरूपिणी कामदा करुणाधारा कालिका कामदा शुभा
    । चण्डवीरा चण्डमाया चण्डमुण्डविनाशिनी ॥ ५६॥ चण्डिका शक्तिरत्युग्रा चण्डिका चण्डविग्रहा । गजानना सिंहमुखी
    गृध्रास्या च महेश्वरी ॥ ५७॥ उष्ट्रग्रीवा हयग्रीवा कालरात्रिर्निशाचरी । कङ्कारी रौद्रचित्कारी फेत्कारी
    भूतडामरी ॥ ५८॥ रौद्रछित्कारी वाराही शरभास्या च शताक्षी मांसभोजनी । कङ्काली डाकिनी काली शुक्लाङ्गी
    कलहप्रिया ॥ ५९॥ उलूकिका शिवारावा धूम्राक्षी चित्रनादिनी । ऊर्ध्वकेशी भद्रकेशी शवहस्ता च मालिनी ॥ ६०॥
    कपालहस्ता रक्ताक्षी श्येनी रुधिरपायिनी । खड्गिनी दीर्घलम्बोष्ठी पाशहस्ता बलाकिनी ॥ ६१॥ काकतुण्डा पात्रहस्ता
    धूर्जटी विषभक्षिणी । पशुघ्नी पापहन्त्री च मयूरी विकटानना ॥ ६२॥ भयविध्वंसिनी चैव प्रेतास्या प्रेतवाहिनी
    । कोटराक्षी लसज्जिह्वा अष्टवक्त्रा सुरप्रिया ॥ ६३॥ व्यात्तास्या धूमनिःश्वासा त्रिपुरा भुवनेश्वरी ।
    बृहत्तुण्डा चण्डहस्ता प्रचण्डा चण्डविक्रमा ॥ ६४॥ दण्डहस्ता स्थूलकेशी बृहत्कुक्षिर्यमदूती करालिनी ।
    दशवक्त्रा दशपदा दशहस्ता विलासिनी ॥ ६५॥ अनाद्यन्तस्वरूपा च क्रोधरूपा मनोगतिः । आदिरन्तस्वरूपा आदिहान्तस्वरूपा
    मनुश्रुतिस्मृतिर्घ्राणचक्षुस्त्वग्रसनात्मिका ॥ ६६॥ त्वग्रसनारसः ॥ योगिमानससंस्था च योगसिद्धिप्रदायिका
    । उग्राणी उग्ररूपा च उग्रतारास्वरूपिणी ॥ ६७॥ उग्ररूपधरा चैव उग्रेशी उग्रवासिनी । भीमा च भीमकेशी च
    भीममूर्तिश्च भामिनी ॥ ६८॥ भीमातिभीमरूपा च भीमरूपा जगन्मयी । खड्गिन्यभयहस्ता च घण्टाडमरुधारिणी ॥ ६९॥
    पाशिनी नागहस्ता च योगिन्यङ्कुशधारिणी । यज्ञा च यज्ञमूर्तिश्च दक्षयज्ञविनाशिनी ॥ ७०॥ यज्ञदीक्षाधरा
    देवी यज्ञसिद्धिप्रदायिनी । हिरण्यबाहुचरणा शरणागतपालिनी ॥ ७१॥ अनाम्न्यनेकनाम्नी च निर्गुणा च गुणात्मिका
    । मनो जगत्प्रतिष्ठा च सर्वकल्याणमूर्तिनी ॥ ७२॥ ब्रह्मादिसुरवन्द्या च गङ्गाधरजटास्थिता । महामोहा महादीप्तिः
    सिद्धविद्या च योगिनी ॥ ७३॥ योगिनी चण्डिका सिद्धा सिद्धसाद्ध्या शिवप्रिया । सरयूर्गोमती भीमा गौतमी
    नर्मदा मही ॥ ७४॥ भागीरथी च कावेरी त्रिवेणी गण्डकी सरः । सरा सुषुप्तिर्जागृतिर्निद्रा स्वप्ना तुर्या
    च चक्रिणी ॥ ७५॥ अहल्यारुन्धती चैव तारा मन्दोदरी तथा । देवी पद्मावती चैव त्रिपुरेशस्वरूपिणी ॥ ७६॥ एकवीरा
    महादेवी कनकाढ्या च देवता । एकवीरा तमोदेवी शूलिनी परिघास्त्रा च खड्गिन्याबाह्यदेवता ॥ ७७॥ कौबेरी धनदा
    याम्याऽऽग्नेयी वायुतनुर्निशा । ईशानी नैरृतिः सौम्या माहेन्द्री वारुणीसमा ॥ ७८॥ वारुणी तथा सर्वर्षिपूजनीयाङ्घ्रिः
    सर्वयन्त्राधिदेवता । सप्तधातुमयीमूर्तिः सप्तधात्वन्तराश्रया ॥ ७९॥ देहपुष्टिर्मनस्तुष्टिरन्नपुष्टिर्बलोद्धता
    । तपोनिष्ठा तपोयुक्ता तापसःसिद्धिदायिनी ॥ ८०॥ तपस्विनी तपःसिद्धिः तापसी च तपःप्रिया । औषधी वैद्यमाता
    च द्रव्यशक्तिःप्रभाविनी ॥ ८१॥ वेदविद्या च वैद्या च सुकुला कुलपूजिता । जालन्धरशिरच्छेत्री महर्षिहितकारिणी
    ॥ ८२॥ योगनीतिर्महायोगा कालरात्रिर्महारवा । अमोहा च प्रगल्भा च गायत्री हरवल्लभा ॥ ८३॥ विप्राख्या व्योमकारा
    च मुनिविप्रप्रिया सती । जगत्कर्त्री जगत्कारी जगच्छाया जगन्निधिः ॥ ८४॥ जगश्वासा जगन्निधिः जगत्प्राणा
    जगद्दंष्ट्रा जगज्जिह्वा जगद्रसा । जगच्चक्षुर्जगद्घ्राणा जगच्छोत्रा जगन्मुखा ॥ ८५॥ जगच्छत्रा जगद्वक्त्रा
    जगद्भर्त्री जगत्पिता । जगत्पत्नी जगन्माता जगद्भ्राता जगत्सुहृत् ॥ ८६॥ जगद्धात्री जगत्सुहृत् जगद्धात्री
    जगत्प्राणा जगद्योनिर्जगन्मयी । सर्वस्तम्भी महामाया जगद्दीक्षा जया तथा ॥ ८७॥ भक्तैकलभ्या द्विविधा त्रिविधा
    च चतुर्विधा । भक्तैकलक्ष्या इन्द्राक्षी पञ्चभूता च सहस्ररूपधारिणी ॥ ८८॥ पञ्चरूपा मूलादिवासिनी चैव
    अम्बापुरनिवासिनी । नवकुम्भा नवरुचिः कामज्वाला नवानना ॥ ८९॥ गर्भज्वाला तथा बाला चक्षुर्ज्वाला नवाम्बरा
    । नवरूपा नवकला नवनाडी नवानना ॥ ९०॥ नवक्रीडा नवविधा नवयोगिनिका तथा । वेदविद्या महाविद्या विद्यादात्री
    विशारदा ॥ ९१॥ कुमारी युवती बाला कुमारीव्रतचारिणी । कुमारीभक्तसुखिनी कुमारीरूपधारिणी ॥ ९२॥ भवानी विष्णुजननी
    ब्रह्मादिजननी परा । गणेशजननी शक्तिः कुमारजननी शुभा ॥ ९३॥ भाग्याश्रया भगवती भक्ताभीष्टप्रदायिनी । भगात्मिका
    भगाधारा रूपिणी भगमालिनी ॥ ९४॥ भगरोगहरा भव्या सुश्रूः परममङ्गला । शर्वाणी चपलापाङ्गी चारुचन्द्रकलाधरा
    ॥ ९५॥ विशालाक्षी विश्वमाता विश्ववन्द्या विलासिनी । विश्वविद्या विलासिनी शुभप्रदा शुभावर्ता वृत्तपीनपयोधरा
    ॥ ९६॥ अम्बा संसारमथिनी मृडानी सर्वमङ्गला । विष्णुसंसेविता शुद्धा ब्रह्मादिसुरसेविता ॥ ९७॥ परमानन्दशक्तिश्च
    परमानन्दरूपिणी । रमानन्दस्वरूपिणी परमानन्दजननी परमानन्ददायिनी ॥ ९८॥ परोपकारनिरता परमा भक्तवत्सला ।
    आनन्दभैरवी बालाभैरवी बटुभैरवी ॥ ९९॥ श्मशानभैरवी कालीभैरवी पुरभैरवी ॥ १००॥ पूर्णचन्द्राभवदना पूर्णचन्द्रनिभांशुका
    । शुभलक्षणसम्पन्ना शुभानन्तगुणार्णवा ॥ १०१॥ शुभसौभाग्यनिलया शुभाचाररता प्रिया । सुखसम्भोगभवना सर्वसौख्यानिरूपिणी
    ॥ १०२॥ अवलम्बा तथा वाग्मी प्रवरा वाग्विवादिनी । वाद्यवादिनी घृणाधिपावृता कोपादुत्तीर्णकुटिलानना ॥
    १०३॥ पापदापापनाशा च ब्रह्माग्नीशापमोचनी । सर्वातीता च उच्छिष्टचाण्डाली परिघायुधा ॥ १०४॥ ओङ्कारी वेदकारी
    च ह्रीङ्कारी सकलागमा । यङ्कारी चर्चिता चर्चिचर्चिता चक्ररूपिणी ॥ १०५॥ महाव्याधवनारोहा धनुर्बाणधरा
    धरा । वरा लम्बिनी च पिपासा च क्षुधा सन्देशिका तथा ॥ १०६॥ भुक्तिदा मुक्तिदा देवी सिद्धिदा शुभदायिनी
    । सिद्धिदा बुद्धिदा माता वर्मिणी फलदायिनी ॥ १०७॥ चण्डिका चण्डमथनी चण्डदर्पनिवारिणी । चण्डमार्तण्डनयना
    चन्द्राग्निनयना सती ॥ १०८॥ सर्वाङ्गसुन्दरी रक्ता रक्तवस्त्रोत्तरीयका । जपापावकसिन्दुरा रक्तचन्दनधारिणी
    ॥ १०९॥ जपास्तबकसिन्दूर रक्तसिन्दूरधारिणी कर्पूरागरुकस्तूरीकुङ्कुमद्रवलेपिनी । विचित्ररत्नपृथिवीकल्मषघ्नी
    तलस्थिता ॥ ११०॥ भगात्मिका भगाधारा रूपिणी भगमालिनी । लिङ्गाभिधायिनी लिङ्गप्रिया लिङ्गनिवासिनी ॥ १११॥
    भगलिङ्गस्वरूपा च भगलिङ्गसुखावहा । स्वयम्भूकुसुमप्रीता स्वयम्भूकुसुमार्चिता ॥ ११२॥ स्वयम्भूकुसुमस्नाता
    स्वयम्भूपुष्पतर्पिता । स्वयम्भूपुष्पतिलका स्वयम्भूपुष्पधारिणी ॥ ११३॥ पुण्डीककरा पुण्या पुण्यदा पुण्यरूपिणी
    । पुण्यज्ञेया पुण्यवन्द्या पुण्यवेद्या पुरातनी ॥ ११४॥ पुण्यमूर्तिः पुरातना अनवद्या वेदविद्या वेदवेदान्तरूपिणी
    । मायातीता सृष्टमाया माया धर्मात्मवन्दिता ॥ ११५॥ असृष्टा सङ्गरहिता सृष्टिहेतुः कपर्दिनी । वृषारूढा
    शूलहस्ता स्थितिसंहारकारिणी ॥ ११६॥ मन्दस्थितिः शुद्धरूपा शुद्धचित्ता मुनिस्तुता । महाभाग्यवती दक्षा
    दक्षाध्वरविनाशिनी ॥ ११७॥ अपर्णानन्यशरणा भक्ताभीष्टफलप्रदा । नित्या सुन्दरसर्वाङ्गी सच्चिदानन्दलक्षणा
    ॥ ११८॥ कमला केशिजा केशी कर्षा कर्पूरकालिजा । गिरिजा गर्वजा गोत्रा अकुला कुलजा तथा ॥ ११९॥ दिनजा दिनमाना
    च वेदजा वेदसम्भृता । वेदसंमता क्रोधजा कुटजा धारा परमा बलगर्विता ॥ १२०॥ सर्वलोकोत्तराभावा सर्वकालोद्भवात्मिका
    । कुण्डगोलोद्भवप्रीता कुण्डगोलोद्भवात्मिका ॥ १२१॥ कुण्डपुष्पसदाप्रीतिः पुष्पगोलसदारतिः । शुक्रमूर्तिः
    शुक्रदेहा शुक्रपुजितमूर्तिनी ॥ १२२॥ शुक्रपूजकमूर्तिनी विदेहा विमला क्रूरा चोला कर्नाटकी तथा । चौण्डा
    कर्नाटकी त्रिमात्रा उत्कला मौण्डी विरेखा वीरवन्दिता ॥ १२३॥ श्यामला गौरविपीना मागधेश्वरवन्दिता । पार्वती
    कर्मनाशा च कैलासवासिका तथा ॥ १२४॥ शालग्रामशिला माली शार्दूला पिङ्गकेशिनी । नारदा शारदा चैव रेणुका
    गगनेश्वरी ॥ १२५॥ धेनुरूपा रुक्मिणी च गोपिका यमुनाश्रया । सुकण्ठा कोकिला मेना चिरानन्दा शिवात्मिका
    ॥ १२६॥ कन्दर्पकोटिलावण्या सुन्दरा सुन्दरस्तनी । विश्वपक्षा विश्वरक्षा विश्वनाथप्रिया सती ॥ १२७॥ योगिनी
    योगयुक्ता च योगाङ्गध्यानशालिनी । योगपट्टधरा मुक्ता मुक्तानां परमागतिः ॥ १२८॥ कुरुक्षेत्रावनीः काशी
    मथुरा काञ्च्यवन्तिका । अयोध्या द्वारका माया तीर्था तीर्थकरी प्रिया ॥ १२९॥ त्रिपुष्कराऽप्रमेया च कोशस्था
    कोशवासिनी । कुशावर्ता कौशिकी च कोशाम्बा कोशवर्धिनी ॥ १३०॥ पद्मकोशा कोशदाक्षी कुसुम्भकुसुमप्रिया ।
    तुलाकोटी च काकुत्स्था स्थावरा च वराश्रया ॥ १३१॥ ॐ ह्रीं यं यां रुद्रदैवत्यायै योगेश्वरीर्येस्वाहा
    । ॐ ह्रीं यं यां
