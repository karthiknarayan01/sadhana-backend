id: tyagaraja-keerthanas-marugelara-o-raghava
category: stotram
name:
  english: Tyagaraja Keerthanas Marugelara O Raghava
content:
  english: deshadi pallavi marugelara o raghava cara cara rupa paratpara surya sudhakara locana caranam
    anni ni vanucu antarangamuna tinnaga vèdaki tèlusukònti nayya nènnè gani madini ènnajala nòrula nannu
    brovavayya tyaga rajanuta marugelara o raghava
  devanagari: देशादि पल्लवि मरुगेलरा ओ राघवा चरा चर रूप परात्पर सूर्य सुधाकर लोचन चरणं अन्नि नी वनुचु
    अन्तरङ्गमुन तिन्नगा वॆदकि तॆलुसुकॊण्टि नय्य नॆन्नॆ गानि मदिनि ऎन्नजाल नॊरुल नन्नु ब्रोववय्य त्याग
    राजनुत मरुगेलरा ओ राघवा
meaning: {}
