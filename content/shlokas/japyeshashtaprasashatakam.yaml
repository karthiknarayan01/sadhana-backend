id: japyeshashtaprasashatakam
category: shataka
name:
  english: japyeshashtaprasashatakam
  devanagari: जप्येशाष्टप्रासशतकम्
content:
  english: davagnim yamudaharanti karunasvavasabhumim budhah | devadhishanutaya shashvadasitagra vaya
    sarvatmane jivanamabhayankaraya mahate devaya tasmai namah || 91|| nirvanaikaniketanam trijagati sarvarti
    vidhvamsakam gurvadyairnikhilairyadugracaritam svarvasibhirgiyate | durvaro garalanalo bhagavata nirvapito
    yena bhoh sharvashu tvamumasahaya nitaram kurvadaranme mudam || 92|| gurvishanamahidharam bhujabaladurvita
    unmulayan garvi yena nipidito dashamukho nirviryamakrandayan | kharvibhutabhavadhiretya janatadavakaralankritim
    kurvisha tvamumapate mayi kripam gurvimananyashraye || 93|| avyadishtaphalapradah pashupatih pavyayudhadyarcito
    rakhyabho bhagavan jatantaralasaddivyapagah shankarah | avyajam satatam kripajalanidhirbhavyam karotyadarat
    avyatmaprabhavacitapravilasatsavyagatrah sa mam || 94|| divyannakishiromanidyutilasatsevyam yadanprayambujam
    bhavyam yogivaraishca yena tarasalavyantakasya smayah | shravyam yasya vicitrapunyacaritam so'vyantavasi
    shivo devyangardhalasattanurbhavatu me bhavyangavicchittaye || 95|| ashapuranatatparasya namatamashadhipatyam
    kripa
  devanagari: दावाग्निं यमुदाहरन्ति करुणास्वावासभूमिं बुधाः । देवाधीशनुताय शश्वदसितग्र वाय सर्वात्मने
    जीवानामभयङ्कराय महते देवाय तस्मै नमः ॥ ९१॥ निर्वाणैकनिकेतनं त्रिजगती सर्वार्ति विध्वंसकं गुर्वाद्यैर्निखिलैर्यदुग्रचरितं
    स्वर्वासिभिर्गीयते । दुर्वारो गरलानलो भगवता निर्वापितो येन भोः शर्वाशु त्वमुमासहाय नितरां कुर्वादरान्मे
    मुदम् ॥ ९२॥ गुर्वीशानमहीधरं भुजबलादुर्वीत उन्मूलयन् गर्वी येन निपीडितो दशमुखो निर्वीर्यमाक्रन्दयन्
    । खर्वीभूतभवाधिरेत्य जनतादवकरालङ्कृतिं कुर्वीश त्वमुमापते मयि कृपां गुर्वीमनन्याश्रये ॥ ९३॥ अव्यादिष्टफलप्रदः
    पशुपतिः पव्यायुधाद्यर्चितो रख्याभो भगवान् जटान्तरलसद्दिव्यापगः शङ्करः । अव्याजं सततं कृपाजलनिधिर्भव्यं
    करोत्यादरात् अव्यात्मप्रभवाचितप्रविलसत्सव्यागात्रः स माम् ॥ ९४॥ दीव्यन्नाकिशिरोमणिद्युतिलसत्सेव्यं
    यदङ्प्रयम्बुजं भाव्यं योगिवरैश्च येन तरसालाव्यन्तकस्य स्मयः । श्राव्यं यस्य विचित्रपुण्यचरितं सोऽव्यन्तवासी
    शिवो देव्यङ्गार्धलसत्तनुर्भवतु मे भाव्यङ्गविच्छित्तये ॥ ९५॥ आशापूरणतत्परस्य नमतामाशाधिपत्यं कृपा
