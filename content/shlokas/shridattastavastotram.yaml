id: shridattastavastotram
category: stotram
name:
  english: shridattastavastotram
  devanagari: श्रीदत्तस्तवस्तोत्रम्
content:
  english: pi rogashca dattatreyam namami tam||3|| samgaja deshakalottha api samkramika gadah|| shamyanti
    yatsmaranato dattatreyam namami tam||4|| sarpavrishcikadashtanam vishartanam sharirinam|| yannama
    shamtidam shighram dattatreyam namami tam||5|| trividhotpatashamanam vividharishtanashanam|| yannama
    krurabhitighnam dattatreyam namami tam||6|| vairyadikritamamtradiprayoga yasya kirtanat|| nashyanti
    devabadhashca dattatreyam namami tam||7|| yacchishyasmaranatsadyo gatanashtadi labhyate|| ya ishah
    sarvatastrata dattatreyam namami tam||8|| jayalabhayashahkamadaturdattasya yah stavam|| bhogamokshapradasyemam
    patheddattapriyo bhavet||9|| || iti shri pa
  devanagari: पि रोगाश्च दत्तात्रेयं नमामि तम्।।३।। संगजा देशकालोत्था अपि सांक्रमिका गदाः।। शाम्यन्ति
    यत्स्मरणतो दत्तात्रेयं नमामि तम्।।४।। सर्पवृश्चिकदष्टानां विषार्तानां शरीरिणाम्।। यन्नाम शांतिदं शीघ्रं
    दत्तात्रेयं नमामि तम्।।५।। त्रिविधोत्पातशमनं विविधारिष्टनाशनम्।। यन्नाम क्रूरभीतिघ्नं दत्तात्रेयं
    नमामि तम्।।६।। वैर्यादिकृतमंत्रादिप्रयोगा यस्य कीर्तनात्।। नश्यन्ति देवबाधाश्च दत्तात्रेयं नमामि तम्।।७।।
    यच्छिष्यस्मरणात्सद्यो गतनष्टादि लभ्यते।। य ईशः सर्वतस्त्राता दत्तात्रेयं नमामि तम्।।८।। जयलाभयशःकामदातुर्दत्तस्य
    यः स्तवम्।। भोगमोक्षप्रदस्येमं पठेद्दत्तप्रियो भवेत्।।९।। ।। इति श्री प
