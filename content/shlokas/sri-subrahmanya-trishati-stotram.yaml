id: sri-subrahmanya-trishati-stotram
category: stotram
name:
  english: Sri Subrahmanya Trishati Stotram
content:
  english: shrim saum sharavanabhavah sharaccandrayutaprabhah | shashankashekharasutah shacimangalyarakshakah
    || || shatayushyapradata ca shatakotiraviprabhah | shacivallabhasupritah shacinayakapujitah || ||
    shacinathacaturvaktradevadaityabhivanditah | shacishartiharashcaiva shambhuh shambhupadeshakah ||
    || shankarah shankarapritah shamyakakusumapriyah | shankukarnamahakarnapramukhadyabhivanditah || ||
    shacinathasutaprananayakah shaktipaniman | shankhapanipriyah shankhopamashadgalasuprabhah || || shankhaghoshapriyah
    shankhacakrashuladikayudhah | shankhadharabhishekadipriyah shankaravallabhah || || shabdabrahmamayashcaiva
    shabdamulantaratmakah | shabdapriyah shabdarupah shabdanandah shacistutah || || shatakotipravistarayojanayatamandirah
    | shatakotiraviprakhyaratnasimhasananvitah || || shatakotimaharshindrasevitobhayaparshvabhuh | shatakotisurastrinam
    nrittasangitakautukah || || shatakotindradikpalahastacamarasevitah | shatakotyakhilandadimahabrahmandanayakah
    || || shankhapanividhibhyam ca parshvayorupasevitah | shankhapadmanidhinam ca kotibhih parisevitah
    || || shashankadityakotibhih savyadakshinasevitah | shankhapaladyashtanagakotibhih parisevitah ||
    || shashankarapatangadigrahanakshatrasevitah | shashibhaskarabhaumadigrahadoshartibhanjanah || ||
    shatapatradvayakarah shatapatrarcanapriyah | shatapatrasamasinah shatapatrasanastutah || || sharirabrahmamuladishadadharanivasakah
    | shatapatrasamutpannabrahmagarvavibhedanah || || shashankardhajatajutah sharanagatavatsalah | rakararupo
    ramano rajivaksho rahogatah || || ratishakotisaundaryo ravikotyudayaprabhah | ragasvarupo ragaghno
    raktabjapriya eva ca || || rajarajeshvariputro rajendravibhavapradah | ratnaprabhakiritagro ravicandragnilocanah
    || || ratnangadamahabahu ratnatatankabhushanah | ratnakeyurabhushadhyo ratnaharavirajitah || || ratnakinkinikancyadibaddhasatkatishobhitah
    | ravasamyuktaratnabhanupuranghrisaroruhah || || ratnakankanaculyadisarvabharanabhushitah | ratnasimhasanasino
    ratnashobhitamandirah || || rakendumukhashatkashca ramavanyadipujitah | rakshasamaragandharvakotikotyabhivanditah
    || || ranarange mahadaityasangramajayakautukah | rakshasanikasamharakopavishtayudhanvitah || || rakshasangasamutpannaraktapanapriyayudhah
    | ravayuktadhanurhasto ratnakukkutadharanah || || ranarangajayo ramastotrashravanakautukah | rambhaghritacivishvacimenakadyabhivanditah
    || || raktapitambaradharo raktagandhanulepanah | raktadvadashapadmaksho raktamalyavibhushitah || ||
    ravipriyo ravaneshastotrasamamanoharah | rajyaprado randhraguhyo rativallabhasupriyah || || rananubandhanirmukto
    rakshasanikanashakah | rajivasambhavadveshi rajivasanapujitah || || ramaniyamahacitramayurarudhasundarah
    | ramanathastuto ramo rakarakarshanakriyah || || vakararupo varado vajrashaktyabhayanvitah | vamadevadisampujyo
    vajrapanimanoharah || || vanistuto vasavesho vallikalyanasundarah | vallivadanapadmarko vallinetrotpalodupah
    || || vallidvinayananando vallicittatatamritam | vallikalpalatavriksho vallipriyamanoharah || || vallikumudahasyenduh
    vallibhashitasupriyah | vallimanohritsaundaryo vallividyullataghanah || || vallimangalaveshadhyo vallimukhavashankarah
    | vallikucagiridvandvakunkumankitavakshakah || || vallisho vallabho vayusarathirvarunastutah | vakratundanujo
    vatso vatsalo vatsarakshakah || || vatsapriyo vatsanatho vatsaviraganavritah | varanananadaityaghno
    vatapighnopadeshakah || || varnagatramayurastho varnarupo varaprabhuh | varnastho varanarudho vajrashaktyayudhapriyah
    || || vamango vamanayano vacadbhurvamanapriyah | varaveshadharo vamo vacaspatisamarcitah || || vasishthadimunishreshthavandito
    vandanapriyah | vakaranripadevastricorabhutarimohanah || || nakararupo nadanto naradadimunistutah
    | nakarapithamadhyastho nagabhedi nageshvarah || || nakaranadasantushto nagashanarathasthitah | nakarajapasuprito
    nanavesho nagapriyah || || nakarabindunilayo navagrahasurupakah | nakarapathananando nandikeshvaravanditah
    || || nakaraghantaninado narayanamanoharah | nakaranadashravano nalinodbhavashikshakah || || nakarapankajadityo
    navaviradhinayakah | nakarapushpabhramaro navaratnavibhushanah || || nakaranarghashayano navashaktisamavritah
    | nakaravrikshakusumo natyasangitasupriyah || || nakarabindunadajno nayajno nayanodbhavah | nakaraparvatendragrasamutpannasudharanih
    || || nakarapetakamanirnagaparvatamandirah | nakarakarunanando nadatma nagabhushanah || || nakarakinkinibhusho
    nayanadrishyadarshanah | nakaravrishabhavaso namaparayanapriyah || || nakarakamalarudho namanantasamanvitah
    | nakaraturagarudho navaratnadidayakah || || nakaramakutajvalamanirnavanidhipradah | nakaramulamantrartho
    navasiddhadipujitah || || nakaramulanadanto nakarastambhanakriyah | bhakararupo bhaktartho bhavo bhargo
    bhayapahah || || bhaktapriyo bhaktavandyo bhagavanbhaktavatsalah | bhaktartibhanjano bhadro bhaktasaubhagyadayakah
    || || bhaktamangaladata ca bhaktakalyanadarshanah | bhaktadarshanasantushto bhaktasanghasupujitah
    || || bhaktastotrapriyanando bhaktabhishtapradayakah | bhaktasampurnaphalado bhaktasamrajyabhogadah
    || || bhaktasalokyasamipyarupamokshavarapradah | bhavaushadhirbhavaghnashca bhavaranyadavanalah ||
    || bhavandhakaramartando bhavavaidyo bhavayudham | bhavashailamahavajro bhavasagaranavikah || || bhavamrityubhayadhvamsi
    bhavanatitavigrahah | bhavabhutapishacaghno bhasvaro bharatipriyah || bhashitadhvanimulanto bhavabhavavivarjitah
    | bhanukopapitridhvamsi bharatishopadeshakah || || bhargavinayakashrimadbhagineyo bhavodbhavah | bharakrauncasuradvesho
    bhargavinathavallabhah || || bhataviranamaskrityo bhatavirasamavritah | bhatataraganodvisho bhataviraganastutah
    || || bhagiratheyo bhashartho bhavanashabaripriyah | bhakare kalicoraribhutadyuccatanodyatah || ||
    vakarasukalasamstho varishtho vasudayakah | vakarakumudendushca vakarabdhisudhamayah || || vakaramritamadhuryo
    vakaramritadayakah | dakshe vajrabhitiyuto vame shaktivaranvitah || || vakarodadhipurnenduh vakarodadhimauktikam
    | vakarameghasalilo vasavatmajarakshakah || || vakaraphalasarajno vakarakalashamritam | vakarapankajaraso
    vasurvamshavivardhanah || || vakaradivyakamalabhramaro vayuvanditah | vakarashashisankasho vajrapanisutapriyah
    || || vakarapushpasadgandho vakaratatapankajam | vakarabhramaradhvano vayastejobalapradah || || vakaravanitanatho
    vashyadyashtapriyapradah | vakaraphalasatkaro vakarajyahutashanah || || varcasvi vanmano'tito vatapyarikritapriyah
    | vakaravatamulastho vakarajaladhestatah || || vakaragangavegabdhih vajramanikyabhushanah | vatarogaharo
    vanigitashravanakautukah || || vakaramakararudho vakarajaladheh patih | vakaramalamantrartho vakaragrihamangalam
    || || vakarasvargamahendro vakararanyavaranah | vakarapanjarashuko valaritanayastutah || || vakaramantramalayasanumanmandamarutah
    | vadyantabhanta shatkramya japante shatrubhanjanah || || vajrahastasutavallivamadakshinasevitah |
    vakulotpalakadambapushpadamasvalankritah || || vajrashaktyadisampannadvishatpanisaroruhah | vasanagandhaliptango
    vashatkaro vashikarah || || vasanayuktatambulapuritananasundarah | vallabhanathasuprito varapurnamritodadhih
    || || iti shri subrahmanya trishati stotram |
  devanagari: श्रीं सौं शरवणभवः शरच्चन्द्रायुतप्रभः । शशाङ्कशेखरसुतः शचीमाङ्गल्यरक्षकः ॥ ॥ शतायुष्यप्रदाता
    च शतकोटिरविप्रभः । शचीवल्लभसुप्रीतः शचीनायकपूजितः ॥ ॥ शचीनाथचतुर्वक्त्रदेवदैत्याभिवन्दितः । शचीशार्तिहरश्चैव
    शम्भुः शम्भूपदेशकः ॥ ॥ शङ्करः शङ्करप्रीतः शम्याककुसुमप्रियः । शङ्कुकर्णमहाकर्णप्रमुखाद्यभिवन्दितः
    ॥ ॥ शचीनाथसुताप्राणनायकः शक्तिपाणिमान् । शङ्खपाणिप्रियः शङ्खोपमषड्गलसुप्रभः ॥ ॥ शङ्खघोषप्रियः शङ्खचक्रशूलादिकायुधः
    । शङ्खधाराभिषेकादिप्रियः शङ्करवल्लभः ॥ ॥ शब्दब्रह्ममयश्चैव शब्दमूलान्तरात्मकः । शब्दप्रियः शब्दरूपः
    शब्दानन्दः शचीस्तुतः ॥ ॥ शतकोटिप्रविस्तारयोजनायतमन्दिरः । शतकोटिरविप्रख्यरत्नसिंहासनान्वितः ॥ ॥ शतकोटिमहर्षीन्द्रसेवितोभयपार्श्वभूः
    । शतकोटिसुरस्त्रीणां नृत्तसङ्गीतकौतुकः ॥ ॥ शतकोटीन्द्रदिक्पालहस्तचामरसेवितः । शतकोट्यखिलाण्डादिमहाब्रह्माण्डनायकः
    ॥ ॥ शङ्खपाणिविधिभ्यां च पार्श्वयोरुपसेवितः । शङ्खपद्मनिधीनां च कोटिभिः परिसेवितः ॥ ॥ शशाङ्कादित्यकोटीभिः
    सव्यदक्षिणसेवितः । शङ्खपालाद्यष्टनागकोटीभिः परिसेवितः ॥ ॥ शशाङ्कारपतङ्गादिग्रहनक्षत्रसेवितः । शशिभास्करभौमादिग्रहदोषार्तिभञ्जनः
    ॥ ॥ शतपत्रद्वयकरः शतपत्रार्चनप्रियः । शतपत्रसमासीनः शतपत्रासनस्तुतः ॥ ॥ शारीरब्रह्ममूलादिषडाधारनिवासकः
    । शतपत्रसमुत्पन्नब्रह्मगर्वविभेदनः ॥ ॥ शशाङ्कार्धजटाजूटः शरणागतवत्सलः । रकाररूपो रमणो राजीवाक्षो रहोगतः
    ॥ ॥ रतीशकोटिसौन्दर्यो रविकोट्युदयप्रभः । रागस्वरूपो रागघ्नो रक्ताब्जप्रिय एव च ॥ ॥ राजराजेश्वरीपुत्रो
    राजेन्द्रविभवप्रदः । रत्नप्रभाकिरीटाग्रो रविचन्द्राग्निलोचनः ॥ ॥ रत्नाङ्गदमहाबाहू रत्नताटङ्कभूषणः
    । रत्नकेयूरभूषाढ्यो रत्नहारविराजितः ॥ ॥ रत्नकिङ्किणिकाञ्च्यादिबद्धसत्कटिशोभितः । रवसंयुक्तरत्नाभनूपुराङ्घ्रिसरोरुहः
    ॥ ॥ रत्नकङ्कणचूल्यादिसर्वाभरणभूषितः । रत्नसिंहासनासीनो रत्नशोभितमन्दिरः ॥ ॥ राकेन्दुमुखषट्कश्च रमावाण्यादिपूजितः
    । राक्षसामरगन्धर्वकोटिकोट्यभिवन्दितः ॥ ॥ रणरङ्गे महादैत्यसङ्ग्रामजयकौतुकः । राक्षसानीकसंहारकोपाविष्टायुधान्वितः
    ॥ ॥ राक्षसाङ्गसमुत्पन्नरक्तपानप्रियायुधः । रवयुक्तधनुर्हस्तो रत्नकुक्कुटधारणः ॥ ॥ रणरङ्गजयो रामास्तोत्रश्रवणकौतुकः
    । रम्भाघृताचीविश्वाचीमेनकाद्यभिवन्दितः ॥ ॥ रक्तपीताम्बरधरो रक्तगन्धानुलेपनः । रक्तद्वादशपद्माक्षो
    रक्तमाल्यविभूषितः ॥ ॥ रविप्रियो रावणेशस्तोत्रसाममनोहरः । राज्यप्रदो रन्ध्रगुह्यो रतिवल्लभसुप्रियः
    ॥ ॥ रणानुबन्धनिर्मुक्तो राक्षसानीकनाशकः । राजीवसम्भवद्वेषी राजीवासनपूजितः ॥ ॥ रमणीयमहाचित्रमयूरारूढसुन्दरः
    । रमानाथस्तुतो रामो रकाराकर्षणक्रियः ॥ ॥ वकाररूपो वरदो वज्रशक्त्यभयान्वितः । वामदेवादिसम्पूज्यो वज्रपाणिमनोहरः
    ॥ ॥ वाणीस्तुतो वासवेशो वल्लीकल्याणसुन्दरः । वल्लीवदनपद्मार्को वल्लीनेत्रोत्पलोडुपः ॥ ॥ वल्लीद्विनयनानन्दो
    वल्लीचित्ततटामृतम् । वल्लीकल्पलतावृक्षो वल्लीप्रियमनोहरः ॥ ॥ वल्लीकुमुदहास्येन्दुः वल्लीभाषितसुप्रियः
    । वल्लीमनोहृत्सौन्दर्यो वल्लीविद्युल्लताघनः ॥ ॥ वल्लीमङ्गलवेषाढ्यो वल्लीमुखवशङ्करः । वल्लीकुचगिरिद्वन्द्वकुङ्कुमाङ्कितवक्षकः
    ॥ ॥ वल्लीशो वल्लभो वायुसारथिर्वरुणस्तुतः । वक्रतुण्डानुजो वत्सो वत्सलो वत्सरक्षकः ॥ ॥ वत्सप्रियो वत्सनाथो
    वत्सवीरगणावृतः । वारणाननदैत्यघ्नो वातापिघ्नोपदेशकः ॥ ॥ वर्णगात्रमयूरस्थो वर्णरूपो वरप्रभुः । वर्णस्थो
    वारणारूढो वज्रशक्त्यायुधप्रियः ॥ ॥ वामाङ्गो वामनयनो वचद्भूर्वामनप्रियः । वरवेषधरो वामो वाचस्पतिसमर्चितः
    ॥ ॥ वसिष्ठादिमुनिश्रेष्ठवन्दितो वन्दनप्रियः । वकारनृपदेवस्त्रीचोरभूतारिमोहनः ॥ ॥ णकाररूपो नादान्तो
    नारदादिमुनिस्तुतः । णकारपीठमध्यस्थो नगभेदी नगेश्वरः ॥ ॥ णकारनादसन्तुष्टो नागाशनरथस्थितः । णकारजपसुप्रीतो
    नानावेषो नगप्रियः ॥ ॥ णकारबिन्दुनिलयो नवग्रहसुरूपकः । णकारपठनानन्दो नन्दिकेश्वरवन्दितः ॥ ॥ णकारघण्टानिनदो
    नारायणमनोहरः । णकारनादश्रवणो नलिनोद्भवशिक्षकः ॥ ॥ णकारपङ्कजादित्यो नववीराधिनायकः । णकारपुष्पभ्रमरो
    नवरत्नविभूषणः ॥ ॥ णकारानर्घशयनो नवशक्तिसमावृतः । णकारवृक्षकुसुमो नाट्यसङ्गीतसुप्रियः ॥ ॥ णकारबिन्दुनादज्ञो
    नयज्ञो नयनोद्भवः । णकारपर्वतेन्द्राग्रसमुत्पन्नसुधारणिः ॥ ॥ णकारपेटकमणिर्नागपर्वतमन्दिरः । णकारकरुणानन्दो
    नादात्मा नागभूषणः ॥ ॥ णकारकिङ्किणीभूषो नयनादृश्यदर्शनः । णकारवृषभावासो नामपारायणप्रियः ॥ ॥ णकारकमलारूढो
    नामानन्तसमन्वितः । णकारतुरगारूढो नवरत्नादिदायकः ॥ ॥ णकारमकुटज्वालामणिर्नवनिधिप्रदः । णकारमूलमन्त्रार्थो
    नवसिद्धादिपूजितः ॥ ॥ णकारमूलनादान्तो णकारस्तम्भनक्रियः । भकाररूपो भक्तार्थो भवो भर्गो भयापहः ॥ ॥ भक्तप्रियो
    भक्तवन्द्यो भगवान्भक्तवत्सलः । भक्तार्तिभञ्जनो भद्रो भक्तसौभाग्यदायकः ॥ ॥ भक्तमङ्गलदाता च भक्तकल्याणदर्शनः
    । भक्तदर्शनसन्तुष्टो भक्तसङ्घसुपूजितः ॥ ॥ भक्तस्तोत्रप्रियानन्दो भक्ताभीष्टप्रदायकः । भक्तसम्पूर्णफलदो
    भक्तसाम्राज्यभोगदः ॥ ॥ भक्तसालोक्यसामीप्यरूपमोक्षवरप्रदः । भवौषधिर्भवघ्नश्च भवारण्यदवानलः ॥ ॥ भवान्धकारमार्ताण्डो
    भववैद्यो भवायुधम् । भवशैलमहावज्रो भवसागरनाविकः ॥ ॥ भवमृत्युभयध्वंसी भावनातीतविग्रहः । भवभूतपिशाचघ्नो
    भास्वरो भारतीप्रियः ॥ भाषितध्वनिमूलान्तो भावाभावविवर्जितः । भानुकोपपितृध्वंसी भारतीशोपदेशकः ॥ ॥ भार्गवीनायकश्रीमद्भागिनेयो
    भवोद्भवः । भारक्रौञ्चासुरद्वेषो भार्गवीनाथवल्लभः ॥ ॥ भटवीरनमस्कृत्यो भटवीरसमावृतः । भटतारागणोड्वीशो
    भटवीरगणस्तुतः ॥ ॥ भागीरथेयो भाषार्थो भावनाशबरीप्रियः । भकारे कलिचोरारिभूताद्युच्चाटनोद्यतः ॥ ॥ वकारसुकलासंस्थो
    वरिष्ठो वसुदायकः । वकारकुमुदेन्दुश्च वकाराब्धिसुधामयः ॥ ॥ वकारामृतमाधुर्यो वकारामृतदायकः । दक्षे वज्राभीतियुतो
    वामे शक्तिवरान्वितः ॥ ॥ वकारोदधिपूर्णेन्दुः वकारोदधिमौक्तिकम् । वकारमेघसलिलो वासवात्मजरक्षकः ॥ ॥ वकारफलसारज्ञो
    वकारकलशामृतम् । वकारपङ्कजरसो वसुर्वंशविवर्धनः ॥ ॥ वकारदिव्यकमलभ्रमरो वायुवन्दितः । वकारशशिसङ्काशो
    वज्रपाणिसुताप्रियः ॥ ॥ वकारपुष्पसद्गन्धो वकारतटपङ्कजम् । वकारभ्रमरध्वानो वयस्तेजोबलप्रदः ॥ ॥ वकारवनितानाथो
    वश्याद्यष्टप्रियाप्रदः । वकारफलसत्कारो वकाराज्यहुताशनः ॥ ॥ वर्चस्वी वाङ्मनोऽतीतो वाताप्यरिकृतप्रियः
    । वकारवटमूलस्थो वकारजलधेस्तटः ॥ ॥ वकारगङ्गावेगाब्धिः वज्रमाणिक्यभूषणः । वातरोगहरो वाणीगीतश्रवणकौतुकः
    ॥ ॥ वकारमकरारूढो वकारजलधेः पतिः । वकारामलमन्त्रार्थो वकारगृहमङ्गलम् ॥ ॥ वकारस्वर्गमाहेन्द्रो वकारारण्यवारणः
    । वकारपञ्जरशुको वलारितनयास्तुतः ॥ ॥ वकारमन्त्रमलयसानुमन्मन्दमारुतः । वाद्यन्तभान्त षट्क्रम्य जपान्ते
    शत्रुभञ्जनः ॥ ॥ वज्रहस्तसुतावल्लीवामदक्षिणसेवितः । वकुलोत्पलकादम्बपुष्पदामस्वलङ्कृतः ॥ ॥ वज्रशक्त्यादिसम्पन्नद्विषट्पाणिसरोरुहः
    । वासनागन्धलिप्ताङ्गो वषट्कारो वशीकरः ॥ ॥ वासनायुक्तताम्बूलपूरिताननसुन्दरः । वल्लभानाथसुप्रीतो वरपूर्णामृतोदधिः
    ॥ ॥ इति श्री सुब्रह्मण्य त्रिशती स्तोत्रम् ।
