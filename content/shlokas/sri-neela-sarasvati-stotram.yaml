id: sri-neela-sarasvati-stotram
category: stotram
name:
  english: Sri Neela Sarasvati Stotram
content:
  english: ghorarupe maharave sarvashatrubhayankari | bhaktebhyo varade devi trahi mam sharanagatam ||
    || sura'surarcite devi siddhagandharvasevite | jadyapapahare devi trahi mam sharanagatam || || jatajutasamayukte
    lolajihvantakarini | drutabuddhikare devi trahi mam sharanagatam || || saumyakrodhadhare rupe candarupe
    namo'stu te | srishtirupe namastubhyam trahi mam sharanagatam || || jadanam jadatam hanti bhaktanam
    bhaktavatsala | mudhatam hara me devi trahi mam sharanagatam || || hrum hrunkaramaye devi balihomapriye
    namah | ugratare namo nityam trahi mam sharanagatam || || buddhim dehi yasho dehi kavitvam dehi devi
    me | mudhatvam ca harerdevi trahi mam sharanagatam || || indradivilasadvandvavandite karunamayi |
    tare taradhinathasye trahi mam sharanagatam || || ashtamyam ca caturdashyam navamyam yah pathennarah
    | shanmasaih siddhimapnoti na'tra karya vicarana || || moksharthi labhate moksham dhanarthi labhate
    dhanam | vidyarthi labhate vidyam tarkavyakaranadikam || || idam stotram pathedyastu satatam shraddhayanvitah
    | tasya shatruh kshayam yati mahaprajna prajayate || || pidayam vapi sangrame jadye dane tatha bhaye
    | ya idam pathati stotram shubham tasya na samshayah || || iti pranamya stutva ca yonimudram pradarshayet
    || iti shri nilasarasvati stotram ||
  devanagari: घोररूपे महारावे सर्वशत्रुभयङ्करि । भक्तेभ्यो वरदे देवि त्राहि मां शरणागतम् ॥ ॥ सुराऽसुरार्चिते
    देवि सिद्धगन्धर्वसेविते । जाड्यपापहरे देवि त्राहि मां शरणागतम् ॥ ॥ जटाजूटसमायुक्ते लोलजिह्वान्तकारिणी
    । द्रुतबुद्धिकरे देवि त्राहि मां शरणागतम् ॥ ॥ सौम्यक्रोधधरे रूपे चण्डरूपे नमोऽस्तु ते । सृष्टिरूपे
    नमस्तुभ्यं त्राहि मां शरणागतम् ॥ ॥ जडानां जडतां हन्ति भक्तानां भक्तवत्सला । मूढतां हर मे देवि त्राहि
    मां शरणागतम् ॥ ॥ ह्रूं ह्रूङ्करमये देवि बलिहोमप्रिये नमः । उग्रतारे नमो नित्यं त्राहि मां शरणागतम्
    ॥ ॥ बुद्धिं देहि यशो देहि कवित्वं देहि देवि मे । मूढत्वं च हरेर्देवि त्राहि मां शरणागतम् ॥ ॥ इन्द्रादिविलसद्वन्द्ववन्दिते
    करुणामयि । तारे तारधिनाथास्ये त्राहि मां शरणागतम् ॥ ॥ अष्टम्यां च चतुर्दश्यां नवम्यां यः पठेन्नरः
    । षण्मासैः सिद्धिमाप्नोति नाऽत्र कार्या विचारणा ॥ ॥ मोक्षार्थी लभते मोक्षं धनार्थी लभते धनम् । विद्यार्थी
    लभते विद्यां तर्कव्याकरणादिकम् ॥ ॥ इदं स्तोत्रं पठेद्यस्तु सततं श्रद्धयान्वितः । तस्य शत्रुः क्षयं
    याति महाप्रज्ञा प्रजायते ॥ ॥ पीडायां वापि सङ्ग्रामे जाड्ये दाने तथा भये । य इदं पठति स्तोत्रं शुभं
    तस्य न संशयः ॥ ॥ इति प्रणम्य स्तुत्वा च योनिमुद्रां प्रदर्शयेत् ॥ इति श्री नीलसरस्वती स्तोत्रम् ॥
