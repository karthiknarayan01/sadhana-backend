id: shadgatistotram
category: stotram
name:
  english: shadgatistotram
  devanagari: षड्गतिस्तोत्रम्
content:
  english: shadgatistotram pankeruhasthaya padambujaya bandhukapushparunasundaraya | sarojahastaya jatadharaya
    namo'stu tasmai karunamayaya || 1|| kaputradeshodbhavamangalaya jinendrarupaya tathagataya | samsaraduhkharnavaparagaya
    namo'stu tasmai karunamayaya || 2|| samantabhadraya surarcitaya suvarnagraiveyakabhushitaya | cudamanishirshadharaya
    tubhyam namo'stu tasmai karunamayaya || 3|| saundaryasandraya vrishasanaya bhaktartihantre ca tathagataya
    | maharharatnaih parimanditaya namo'stu tasmai karunamayaya || 4|| satkanthakanthaya manoharaya trailokyasampujitasampadaya
    | karunyasampurnahridambujaya namo'stu tasmai karunamayaya || 5|| stotram pracakre bhuvi shankhakarma
    punyarthato yacchatarajadhiman | ye ye pathishyanti narah prayatnat te te gatah shrisuraharmyaramyam
    || 6|| iti shri aryavalokiteshvarasya shadgatistotram sampurnam ||
  devanagari: षड्गतिस्तोत्रम् पङ्केरुहस्थाय पदाम्बुजाय बन्धूकपुष्पारुणसुन्दराय । सरोजहस्ताय जटाधराय नमोऽस्तु
    तस्मै करूणामयाय ॥ १॥ कापुत्रदेशोद्भवमङ्गलाय जिनेन्द्ररूपाय तथागताय । संसारदुःखार्णवपारगाय नमोऽस्तु
    तस्मै करूणामयाय ॥ २॥ समन्तभद्राय सुरार्चिताय सुवर्णग्रैवेयकभूषिताय । चूडामणिशीर्षधराय तुभ्यं नमोऽस्तु
    तस्मै करूणामयाय ॥ ३॥ सौन्दर्यसान्द्राय वृषासनाय भक्तार्तिहन्त्रे च तथागताय । महार्हरत्नैः परिमण्डिताय
    नमोऽस्तु तस्मै करूणामयाय ॥ ४॥ सत्कण्ठकण्ठाय मनोहराय त्रैलोक्यसम्पूजितसम्पदाय । कारुण्यसम्पूर्णहृदम्बुजाय
    नमोऽस्तु तस्मै करूणामयाय ॥ ५॥ स्तोत्रं प्रचक्रे भुवि शङ्खकर्म पुण्यार्थतो यच्छतराजधीमान् । ये ये पठिष्यन्ति
    नराः प्रयत्नात् ते ते गताः श्रीसुरहर्म्यरम्यम् ॥ ६॥ इति श्री आर्यावलोकितेश्वरस्य षड्गतिस्तोत्रं सम्पूर्णम्
    ॥
