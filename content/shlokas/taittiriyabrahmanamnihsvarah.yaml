id: taittiriyabrahmanamnihsvarah
category: veda
name:
  english: taittiriyabrahmanamnihsvarah
  devanagari: तैत्तिरीयब्राह्मणम्निःस्वरः
content:
  english: suvamaha iti | tam chandobhirasuvanta | tacchandasam chandastvam | samna samanayan | tathsamnah
    samatvam | ukthairudasthapayan | tadukthanamukthatvam | ya evam veda | pratyeva tishthati || 2| 2|
    8| 7|| 49 sarvamayureti | somo vai yashah | ya evam vidvanthsomamagacchati | yasha evainamricchati
    | tasmadahuh | yashcaivam veda yashca na | tavubhau somamagacchatah | somo hi yashah | tam tvava yasha
    ricchatityahuh | yah some somam praheti | tasmathsome somah procyah | yasha evainamricchati || 2|
    2| 8| 8|| abhishunvanti saptahota tarpayati shaddhotra nivittvamabhuttishthati praheti dve ca || 8||
    50 idam va agre naiva kimcanasit | na dyaurasit | na prithivi | nantariksham | tadasadeva sanmano'kuruta
    syamiti | tadatapyata | tasmattepanaddhumo'jayata | tadbhuyo'tapyata | tasmattepanadagnirajayata |
    tadbhuyo'tapyata || 2| 2| 9| 1|| 51 tasmattepanajjyotirajayata | tadbhuyo'tapyata | tasmattepanadarcirajayata
    | tadbhuyo'tapyata | tasmattepananmaricayo'jayanta | tadbhuyo'tapyata | tasmattepanadudara ajayanta
    | tadbhuyo'tapyata | tadabhramiva samahanyata | tadvastimabhinat || 2| 2| 9| 2|| 52 sa samudro'bhavat
    | tasmathsamudrasya na pibanti | prajananamiva hi manyante | tasmatpashorjayamanadapah purastadyanti
    | taddashahota'nvasrijyata | prajapatirvai dashahota | ya evam tapaso viryam vidvagstapyate | bhavatyeva
    | tadva idamapah salilamasit | so'roditprajapatih || 2| 2| 9| 3|| 53 sa kasma ajni | yadyasya apratishthaya
    iti | yadapsvavapadyata | sa prithivyabhavat | yadvyamrishta | tadantarikshamabhavat | yadurdhvamudamrishta
    | sa dyaurabhavat | yadarodit | tadanayo rodastvam || 2| 2| 9| 4|| 54 ya evam veda | nasya grihe rudanti
    | etadva esham lokanam janma | ya evamesham lokanam janma veda | naishu lokeshvartimarcchati | sa
    imam pratishthamavindata | sa imam pratishtham vittva'kamayata prajayeyeti | sa tapo'tapyata | so'ntarvanabhavat
    | sa jaghanadasuranasrijata || 2| 2| 9| 5|| 55 tebhyo mrinmaye patre'nnamaduhat | ya'sya sa tanurasit
    | tamapahata | sa tamisra'bhavat | so'kamayata prajayeyeti | sa tapo'tapyata | so'ntarvanabhavat |
    sa prajananadeva praja asrijata | tasmadima bhuyishthah | prajananaddhyena asrijata || 2| 2| 9| 6||
    56 tabhyo darumaye patre payo'duhat | ya'sya sa tanurasit | tamapahata | sa jyothsna'bhavat | so'kamayata
    prajayeyeti | sa tapo'tapyata | so'ntarvanabhavat | sa upapakshabhyamevartunasrijata | tebhyo rajate
    patre ghritamaduhat | ya'sya sa tanurasit | 57 tamapahata | so'horatrayoh sandhirabhavat | so'kamayata
    prajayeyeti | sa tapo'tapyata | so'ntarvanabhavat | sa mukhaddevanasrijata | tebhyo harite patre somamaduhat
    | ya'sya sa tanurasit | tamapahata | tadaharabhavat || 2| 2| 9| 8|| 58 ete vai prajapaterdohah | ya
    evam veda | duha eva prajah | diva vai no'bhuditi | taddevanam devatvam | ya evam devanam devatvam
    veda | devavaneva bhavati | etadva ahoratranam janma | ya evamahoratranam janma veda | nahoratreshvartimarcchati
    || 2| 2| 9| 9|| 59 asato'dhi mano'srijyata | manah prajapatimasrijata | prajapatih praja asrijata
    | tadva idam manasyeva paramam pratishthitam | yadidam kimca | tadetacchovasyasam nama brahma | vyucchanti
    vyucchantyasmai vasyasi vasyasi vyucchati | prajayate prajaya pashubhih | pra parameshthino matramapnoti
    | ya evam veda || 2| 2| 9| 10|| agnirajayata tadbhuyo'tapyatabhinadaroditprajapati rodastvamasrijatasrijata
    ghritamaduhadya'sya sa tanurasidaharabhavadricchati veda || 9|| idam dhumo'gnirjyotirarcirmaricaya
    udarastadabhra
  devanagari: सुवामहा इति । तं छन्दोभिरसुवन्त । तच्छन्दसां छन्दस्त्वम् । साम्ना समानयन् । तथ्साम्नः सामत्वम्
    । उक्थैरुदस्थापयन् । तदुक्थानामुक्थत्वम् । य एवं वेद । प्रत्येव तिष्ठति ॥ २। २। ८। ७॥ ४९ सर्वमायुरेति
    । सोमो वै यशः । य एवं विद्वान्थ्सोममागच्छति । यश एवैनमृच्छति । तस्मादाहुः । यश्चैवं वेद यश्च न । तावुभौ
    सोममागच्छतः । सोमो हि यशः । तं त्वाव यश ऋच्छतीत्याहुः । यः सोमे सोमं प्राहेति । तस्माथ्सोमे सोमः प्रोच्यः
    । यश एवैनमृच्छति ॥ २। २। ८। ८॥ अभिषुण्वन्ति सप्तहोता तर्पयति षड्ढोत्रा निवित्त्वमभूत्तिष्ठति प्राहेति
    द्वे च ॥ ८॥ ५० इदं वा अग्रे नैव किंचनासीत् । न द्यौरासीत् । न पृथिवी । नान्तरिक्षम् । तदसदेव सन्मनोऽकुरुत
    स्यामिति । तदतप्यत । तस्मात्तेपानाद्धूमोऽजायत । तद्भूयोऽतप्यत । तस्मात्तेपानादग्निरजायत । तद्भूयोऽतप्यत
    ॥ २। २। ९। १॥ ५१ तस्मात्तेपानाज्ज्योतिरजायत । तद्भूयोऽतप्यत । तस्मात्तेपानादर्चिरजायत । तद्भूयोऽतप्यत
    । तस्मात्तेपानान्मरीचयोऽजायन्त । तद्भूयोऽतप्यत । तस्मात्तेपानादुदारा अजायन्त । तद्भूयोऽतप्यत । तदभ्रमिव
    समहन्यत । तद्वस्तिमभिनत् ॥ २। २। ९। २॥ ५२ स समुद्रोऽभवत् । तस्माथ्समुद्रस्य न पिबन्ति । प्रजननमिव
    हि मन्यन्ते । तस्मात्पशोर्जायमानादापः पुरस्ताद्यन्ति । तद्दशहोताऽन्वसृज्यत । प्रजापतिर्वै दशहोता ।
    य एवं तपसो वीर्यं विद्वाग्स्तप्यते । भवत्येव । तद्वा इदमापः सलिलमासीत् । सोऽरोदीत्प्रजापतिः ॥ २। २।
    ९। ३॥ ५३ स कस्मा अज्ञि । यद्यस्या अप्रतिष्ठाया इति । यदप्स्ववापद्यत । सा पृथिव्यभवत् । यद्व्यमृष्ट
    । तदन्तरिक्षमभवत् । यदूर्ध्वमुदमृष्ट । सा द्यौरभवत् । यदरोदीत् । तदनयो रोदस्त्वम् ॥ २। २। ९। ४॥ ५४
    य एवं वेद । नास्य गृहे रुदन्ति । एतद्वा एषां लोकानां जन्म । य एवमेषां लोकानां जन्म वेद । नैषु लोकेष्वार्तिमार्च्छति
    । स इमां प्रतिष्ठामविन्दत । स इमां प्रतिष्ठां वित्त्वाऽकामयत प्रजायेयेति । स तपोऽतप्यत । सोऽन्तर्वानभवत्
    । स जघनादसुरानसृजत ॥ २। २। ९। ५॥ ५५ तेभ्यो मृन्मये पात्रेऽन्नमदुहत् । याऽस्य सा तनूरासीत् । तामपाहत
    । सा तमिस्राऽभवत् । सोऽकामयत प्रजायेयेति । स तपोऽतप्यत । सोऽन्तर्वानभवत् । स प्रजननादेव प्रजा असृजत
    । तस्मादिमा भूयिष्ठाः । प्रजननाद्ध्येना असृजत ॥ २। २। ९। ६॥ ५६ ताभ्यो दारुमये पात्रे पयोऽदुहत् । याऽस्य
    सा तनूरासीत् । तामपाहत । सा ज्योथ्स्नाऽभवत् । सोऽकामयत प्रजायेयेति । स तपोऽतप्यत । सोऽन्तर्वानभवत्
    । स उपपक्षाभ्यामेवर्तूनसृजत । तेभ्यो रजते पात्रे घृतमदुहत् । याऽस्य सा तनूरासीत् । ५७ तामपाहत । सोऽहोरात्रयोः
    सन्धिरभवत् । सोऽकामयत प्रजायेयेति । स तपोऽतप्यत । सोऽन्तर्वानभवत् । स मुखाद्देवानसृजत । तेभ्यो हरिते
    पात्रे सोममदुहत् । याऽस्य सा तनूरासीत् । तामपाहत । तदहरभवत् ॥ २। २। ९। ८॥ ५८ एते वै प्रजापतेर्दोहाः
    । य एवं वेद । दुह एव प्रजाः । दिवा वै नोऽभूदिति । तद्देवानां देवत्वम् । य एवं देवानां देवत्वं वेद
    । देववानेव भवति । एतद्वा अहोरात्राणां जन्म । य एवमहोरात्राणां जन्म वेद । नाहोरात्रेष्वार्तिमार्च्छति
    ॥ २। २। ९। ९॥ ५९ असतोऽधि मनोऽसृज्यत । मनः प्रजापतिमसृजत । प्रजापतिः प्रजा असृजत । तद्वा इदं मनस्येव
    परमं प्रतिष्ठितम् । यदिदं किंच । तदेतच्छोवस्यसं नाम ब्रह्म । व्युच्छन्ती व्युच्छन्त्यस्मै वस्यसी वस्यसी
    व्युच्छति । प्रजायते प्रजया पशुभिः । प्र परमेष्ठिनो मात्रामाप्नोति । य एवं वेद ॥ २। २। ९। १०॥ अग्निरजायत
    तद्भूयोऽतप्यताभिनदरोदीत्प्रजापती रोदस्त्वमसृजतासृजत घृतमदुहद्याऽस्य सा तनूरासीदहरभवदृच्छति वेद ॥ ९॥
    इदं धूमोऽग्निर्ज्योतिरर्चिर्मरीचय उदारास्तदभ्र
