id: narayaniyam-dashaka-30
category: stotram
name:
  english: Narayaniyam Dashaka 30
content:
  english: shakrena samyati hato'pi balirmahatma shukrena jivitatanuh kratuvardhitoshma | vikrantiman
    bhayanilinasuram trilokim cakre vashe sa tava cakramukhadabhitah || || putrartidarshanavashadaditirvishanna
    tam kashyapam nijapatim sharanam prapanna | tvatpujanam taduditam hi payovratakhyam sa dvadashahamacarattvayi
    bhaktipurna || || tasyavadhau tvayi nilinamateramushyah shyamashcaturbhujavapuh svayamavirasih | namram
    ca tamiha bhavattanayo bhaveyam gopyam madikshanamiti pralapannayasih || || tvam kashyape tapasi sannidadhattadanim
    prapto'si garbhamaditeh pranuto vidhatra | prasuta ca prakatavaishnavadivyarupam sa dvadashishravanapunyadine
    bhavantam || || punyashramam tamabhivarshati pushpavarshai rharshakule suragane kritaturyaghoshe |
    badhva'njalim jaya jayeti nutah pitribhyam tvam tatkshane patutamam vaturupamadhah || || tavatprajapatimukhairupaniya
    maunji dandajinakshavalayadibhirarcyamanah | dedipyamanavapurisha kritagnikarya stvam prasthitha baligriham
    prakritashvamedham || || gatrena bhavimahimocitagauravam pra gvyavrinvateva dharanim calayannayasih
    | chatram paroshmatiranarthamivadadhano dandam ca danavajaneshviva sannidhatum || || tam narmadottaratate
    hayamedhashala masedushi tvayi ruca tava ruddhanetraih | bhasvan kimesha dahano nu sanatkumaro yogi
    nu ko'yamiti shukramukhaishshashanke || || anitamashu bhrigubhirmahasa'bhibhutai stvam ramyarupamasurah
    pulakavritangah | bhaktya sametya sukriti parinijya padau tattoyamanvadhrita murdhani tirthatirtham
    || || prahladavamshajataya kratubhirdvijeshu vishvasato nu tadidam ditijo'pi lebhe | yatte padambu
    girishasya shirobhilalyam sa tvam vibho gurupuralaya palayethah ||
  devanagari: शक्रेण संयति हतोऽपि बलिर्महात्मा शुक्रेण जीविततनुः क्रतुवर्धितोष्मा । विक्रान्तिमान् भयनिलीनसुरां
    त्रिलोकीं चक्रे वशे स तव चक्रमुखादभीतः ॥ ॥ पुत्रार्तिदर्शनवशाददितिर्विषण्णा तं काश्यपं निजपतिं शरणं
    प्रपन्ना । त्वत्पूजनं तदुदितं हि पयोव्रताख्यं सा द्वादशाहमचरत्त्वयि भक्तिपूर्णा ॥ ॥ तस्यावधौ त्वयि
    निलीनमतेरमुष्याः श्यामश्चतुर्भुजवपुः स्वयमाविरासीः । नम्रां च तामिह भवत्तनयो भवेयं गोप्यं मदीक्षणमिति
    प्रलपन्नयासीः ॥ ॥ त्वं काश्यपे तपसि सन्निदधत्तदानीं प्राप्तोऽसि गर्भमदितेः प्रणुतो विधात्रा । प्रासूत
    च प्रकटवैष्णवदिव्यरूपं सा द्वादशीश्रवणपुण्यदिने भवन्तम् ॥ ॥ पुण्याश्रमं तमभिवर्षति पुष्पवर्षै र्हर्षाकुले
    सुरगणे कृततूर्यघोषे । बध्वाऽञ्जलिं जय जयेति नुतः पितृभ्यां त्वं तत्क्षणे पटुतमं वटुरूपमाधाः ॥ ॥ तावत्प्रजापतिमुखैरुपनीय
    मौञ्जी दण्डाजिनाक्षवलयादिभिरर्च्यमानः । देदीप्यमानवपुरीश कृताग्निकार्य स्त्वं प्रास्थिथा बलिगृहं प्रकृताश्वमेधम्
    ॥ ॥ गात्रेण भाविमहिमोचितगौरवं प्रा ग्व्यावृण्वतेव धरणीं चलयन्नायासीः । छत्रं परोष्मतिरणार्थमिवादधानो
    दण्डं च दानवजनेष्विव सन्निधातुम् ॥ ॥ तां नर्मदोत्तरतटे हयमेधशाला मासेदुषि त्वयि रुचा तव रुद्धनेत्रैः
    । भास्वान् किमेष दहनो नु सनत्कुमारो योगी नु कोऽयमिति शुक्रमुखैश्शशङ्के ॥ ॥ आनीतमाशु भृगुभिर्महसाऽभिभूतै
    स्त्वां रम्यरूपमसुरः पुलकावृताङ्गः । भक्त्या समेत्य सुकृती परिणिज्य पादौ तत्तोयमन्वधृत मूर्धनि तीर्थतीर्थम्
    ॥ ॥ प्रह्लादवंशजतया क्रतुभिर्द्विजेषु विश्वासतो नु तदिदं दितिजोऽपि लेभे । यत्ते पदाम्बु गिरिशस्य शिरोभिलाल्यं
    स त्वं विभो गुरुपुरालय पालयेथाः ॥
