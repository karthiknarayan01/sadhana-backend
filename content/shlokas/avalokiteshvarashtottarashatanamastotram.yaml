id: avalokiteshvarashtottarashatanamastotram
category: stotram
name:
  english: avalokiteshvarashtottarashatanamastotram
  devanagari: अवलोकितेश्वराष्टोत्तरशतनामस्तोत्रम्
content:
  english: avalokiteshvarashtottarashatanamastotram om namo'valokiteshvaraya | padmasattva mahapadma lokeshvara
    maheshvara | avalokitesha dhiragrya vajradharma namo'stu te || 1|| dharmaraja mahashuddha sattvaraja
    mahamate | padmatmaka mahapadma padmanatha namo'stu te || 2|| padmodbhava supadmabha padmashuddha
    sushodhaka | vajrapadma supadmanka padmapadma namo'stu te || 3|| mahavishva mahaloka mahakaya mahopama
    | mahadhira mahavira mahashaure namo'stu te || 4|| sattvashaya mahayana mahayoga pitamaha | shambhu
    shankara shuddhartha buddhapadma namo'stu te || 5|| dharmatattvartha saddharma shuddhaddharmam sudharmakrit
    | mahadharma sudharmagrya dharmacakra namo'stu te || 6|| buddhasattva susattvagrya dharmasattva susattvadhrik
    | sattvottama susattvajna sattvasattva namo'stu te || 7|| avalokitesha nathagrya mahanatha vilokita
    | alokaloka lokartha lokanatha namo'stu te || 8|| lokaksharakshara maha aksharagryaksharopama | aksharakshara
    sarvaksha cakrakshara namo'stu te || 9|| padmahasta mahahasta samashvasaka dayaka | buddhadharma mahabuddha
    buddhatmaka namo'stu te || 10|| buddharupa maharupa vajrarupa surupavit | dharmaloka sutejagrya lokaloka
    namo'stu te || 11|| padmashrinatha nathagrya dharmashrinatha nathavan | brahyanatha mahabrahma brahmaputra
    namo'stu te || 12|| dipa dipagrya dipogra dipaloka sudipaka | dipanatha mahadipa buddhadipa namo'stu
    te || 13|| buddhabhishikta buddhagrya buddhaputra mahabudha | buddhabhishekamurddhagrya buddhabuddha
    namo'stu te || 14|| buddhacaksho mahacaksho dharmacaksho mahekshana | samadhijnanasarvasva vajranetra
    namo'stu te || 15|| evam sarvatmana gaunam namnamashtashatam tava | bhavayet stunuyadvapi lokaishvaryamavapnuyat
    || 16|| iti aryavalokiteshvaranamashtottarashatadhyeshanastotram sampurnam ||
  devanagari: अवलोकितेश्वराष्टोत्तरशतनामस्तोत्रम् ॐ नमोऽवलोकितेश्वराय । पद्मसत्त्व महापद्म लोकेश्वर महेश्वर
    । अवलोकितेश धीराग्र्य वज्रधर्म नमोऽस्तु ते ॥ १॥ धर्मराज महाशुद्ध सत्त्वराज महामते । पद्मात्मक महापद्म
    पद्मनाथ नमोऽस्तु ते ॥ २॥ पद्मोद्भव सुपद्माभ पद्मशुद्ध सुशोधक । वज्रपद्म सुपद्माङ्क पद्मपद्म नमोऽस्तु
    ते ॥ ३॥ महाविश्व महालोक महाकाय महोपम । महाधीर महावीर महाशौरे नमोऽस्तु ते ॥ ४॥ सत्त्वाशय महायान महायोग
    पितामह । शम्भु शङ्कर शुद्धार्थ बुद्धपद्म नमोऽस्तु ते ॥ ५॥ धर्मतत्त्वार्थ सद्धर्म शुद्धद्धर्मं सुधर्मकृत्
    । महाधर्म सुधर्माग्र्य धर्मचक्र नमोऽस्तु ते ॥ ६॥ बुद्धसत्त्व सुसत्त्वाग्र्य धर्मसत्त्व सुसत्त्वधृक्
    । सत्त्वोत्तम सुसत्त्वज्ञ सत्त्वसत्त्व नमोऽस्तु ते ॥ ७॥ अवलोकितेश नाथाग्र्य महानाथ विलोकित । आलोकलोक
    लोकार्थ लोकनाथ नमोऽस्तु ते ॥ ८॥ लोकाक्षराक्षर महा अक्षराग्र्याक्षरोपम । अक्षराक्षर सर्वाक्ष चक्राक्षर
    नमोऽस्तु ते ॥ ९॥ पद्महस्त महाहस्त समाश्वासक दायक । बुद्धधर्म महाबुद्ध बुद्धात्मक नमोऽस्तु ते ॥ १०॥
    बुद्धरूप महारूप वज्ररूप सुरूपवित् । धर्मालोक सुतेजाग्र्य लोकालोक नमोऽस्तु ते ॥ ११॥ पद्मश्रीनाथ नाथाग्र्य
    धर्मश्रीनाथ नाथवान् । ब्रह्यनाथ महाब्रह्म ब्रह्मपुत्र नमोऽस्तु ते ॥ १२॥ दीप दीपाग्र्य दीपोग्र दीपालोक
    सुदीपक । दीपनाथ महादिप बुद्धदीप नमोऽस्तु ते ॥ १३॥ बुद्धाभिषिक्त बुद्धाग्र्य बुद्धपुत्र महाबुध । बुद्धाभिषेकमुर्द्धाग्र्य
    बुद्धबुद्ध नमोऽस्तु ते ॥ १४॥ बुद्धचक्षो महाचक्षो धर्मचक्षो महेक्षण । समाधिज्ञानसर्वस्व वज्रनेत्र नमोऽस्तु
    ते ॥ १५॥ एवं सर्वात्मना गौणं नाम्नामष्टशतं तव । भावयेत् स्तुनुयाद्वापि लोकैश्वर्यमवाप्नुयात् ॥ १६॥
    इति आर्यावलोकितेश्वरनामाष्टोत्तरशताध्येषणास्तोत्रं सम्पूर्णम् ॥
