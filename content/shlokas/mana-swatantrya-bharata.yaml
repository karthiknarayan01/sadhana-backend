id: mana-swatantrya-bharata
category: stotram
name:
  english: Mana Swatantrya Bharata
content:
  english: mana svatantrya bharata ketanamunètti naduvara kati biginci ripudhatini kala raci niluvara
    || ardhika samata ghantika alladigo mrogènura andaramòka kutumbamai anandamu kanavalèra || matasamaikyata
    ninadame manaku balamura gatacaritra talaci jagad hitamu nedu kanumura || udayojvala bhaskara kiranodancitamura
    nabham bhuvana manavabhyudaya vijayamade manaku shubham ||
  devanagari: मन स्वतन्त्र्य भारत केतनमुनॆत्ति नडुवरा कटि बिगिञ्चि रिपुधाटिनि काल राचि निलुवरा ॥ आर्धिक
    समता घण्टिक अल्लदिगो म्रोगॆनुरा अन्दरमॊक कुटुम्बमै आनन्दमु कनवलॆरा ॥ मतसमैक्यता निनादमे मनकु बलमुरा
    गतचरित्र तलचि जगद् हितमु नेडु कनुमुरा ॥ उदयोज्वल भास्कर किरणोदञ्चितमुरा नभं भुवन मानवाभ्युदय विजयमदे
    मनकु शुभम् ॥
