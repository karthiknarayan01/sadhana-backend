id: nateshauttarapithika
category: sahasranama
name:
  english: nateshauttarapithika
  devanagari: नटेशौत्तरपीठिका
content:
  english: rinu shailasute'dhuna | pajcamyamathava'shtamyam dashamyam va visheshatah || 7|| snatva shubhasane
    sthitva dhyayan shrinatanayakam | prajapetdvadashavritya sarvan kaman labhennara| || 8|| ardrayam
    pratararabhya natarajasya sannidhau | asayam prajapedetat evam samvatsaratrayam || 9|| tasya bhaktasya
    devesho natanam darshayetprabhuh | bilvavrikshasya nikate trivaram prajapedidam || 10|| shadbhirmasairmahaishvaryam
    labhate na cirannarah | anena stotrarajena mantritam bhasmadharayet || 11|| bhasmavalokananmrityurvashyo
    bhavati tatkshanat | salilam prashayeddhiman mantrenanena mantritam || 12|| sarvavidyamayo bhutva
    vyakarotyashrutadikam | natakadi mahagrantham kurute natra samshayah || 13|| caturthyantam samuccaryanamaikaikam
    tato japet | pancaksharam tatha namnam sahasram prajapetkramat || 14|| evam trivaram masanamashtavimshatike
    gate | nigrahanugrahau kartum shaktirasyopajayate || 15|| namnamadau tathante ca pancaksharamahamanum
    | japtva madhyasthitam nama nirmamontam sada sakrit || 16|| caturthyantam japedvidvan trivarsham ca
    trimasakaih | animadi mahasiddhi racirat prapnuyaddhruvam || 17|| sarveshvapi ca lokeshu siddhah sanvicarennarah
    | lakshmibija dvayakshiptamadyam tannama yah shive || 18|| vanchitam shriyamapnoti satyamuktam varanane
    | hallekhamantra samyuktam purvavat samyutam japet || 19|| yogasiddhirbhavettasya tricatuh pancavatsaraih
    | kimatra bahunoktena yaya siddhirabhipsita || 20|| tam tam siddhim labhenmartyah satyameva mayoditam
    | kanthadaghnajalesthitva trivaram prajapedidam || 21|| ripunucvatayecchighramekenaiva dinena sah
    | dakshinabhimukhobhutva dhritva''rdravasanam shucih || 22|| shatrunamasamucvarya marayetipadankitam
    | pathedidam stavam krodhat saptakritvastribhirdinaih || 23|| sa ripurmrityugehasya dhruvamatithyabhagbhavet
    | haridraya natadhisham kritva pranan pratishthipet || 24|| pitapushpaih samabhyarcya stotrametajjapennarah
    | stambhayetsakalanlokan kimihakshudramanushan || 25|| akarshanaya sarveshamuttarabhimukhojapet |
    vanchitayoshitassarvastatha lokantarasthitah || 26|| yakshashca kinnarashcapi rajanovashamapnuyuh
    | kumbhasthitam jalamsprishtva trivaram prajapedidam || 27|| mahagrahaganagrastan abhishekancakarayet
    | jalasparshanamatrenamucyate ca grahadibhih || 28|| kimatra bahunoktena siddhayantyakhilasiddhayah
    | sakshannateshvaro devo vashyo bhavati tatkshanat || 29||
  devanagari: ृणु शैलसुतेऽधुना । पज्चम्यामथवाऽष्टम्यां दशम्यां वा विशेषतः ॥ ७॥ स्नात्वा शुभासने स्थित्वा
    ध्यायन् श्रीनटनायकम् । प्रजपेत्द्वादशावृत्या सर्वान् कामान् लभेन्नर। ॥ ८॥ आर्द्रायां प्रातरारभ्य नटराजस्य
    सन्निधौ । आसायं प्रजपेदेतत् एवं संवत्सरत्रयम् ॥ ९॥ तस्य भक्तस्य देवेशो नटनं दर्शयेत्प्रभुः । बिल्ववृक्षस्य
    निकटे त्रिवारं प्रजपेदिदम् ॥ १०॥ षड्भिर्मासैर्महैश्वर्यं लभते न चिरान्नरः । अनेन स्तोत्रराजेन मन्त्रितं
    भस्मधारयेत् ॥ ११॥ भस्मावलोकनान्मृत्युर्वश्यो भवति तत्क्षणात् । सलिलं प्राशयेद्धीमान् मन्त्रेणानेन
    मन्त्रितम् ॥ १२॥ सर्वविद्यामयो भूत्वा व्याकरोत्यश्रुतादिकम् । नाटकादि महाग्रन्थं कुरुते नात्र संशयः
    ॥ १३॥ चतुर्थ्यन्तं समुच्चार्यनामैकैकं ततो जपेत् । पञ्चाक्षरं तथा नाम्नां सहस्रं प्रजपेत्क्रमात् ॥
    १४॥ एवं त्रिवारं मासानामष्टाविंशतिके गते । निग्रहानुग्रहौ कर्तुं शक्तिरस्योपजायते ॥ १५॥ नाम्नामादौ
    तथान्ते च पञ्चाक्षरमहामनुम् । जप्त्वा मध्यस्थितं नाम निर्ममोन्तं सदा सकृत् ॥ १६॥ चतुर्थ्यन्तं जपेद्विद्वान्
    त्रिवर्षं च त्रिमासकैः । अणिमादि महासिद्धि रचिरात् प्राप्नुयाद्ध्रुवम् ॥ १७॥ सर्वेष्वपि च लोकेषु सिद्धः
    सन्विचरेन्नरः । लक्ष्मीबीज द्वयक्षिप्तमाद्यं तन्नाम यः शिवे ॥ १८॥ वाञ्छितां श्रियमाप्नोति सत्यमुक्तं
    वरानने । हल्लेखामन्त्र संयुक्तं पूर्ववत् संयुतं जपेत् ॥ १९॥ योगसिद्धिर्भवेत्तस्य त्रिचतुः पञ्चवत्सरैः
    । किमत्र बहुनोक्तेन याया सिद्धिरभीप्सिता ॥ २०॥ तां तां सिद्धिं लभेन्मर्त्यः सत्यमेव मयोदितम् । कण्ठदघ्नजलेस्थित्वा
    त्रिवारं प्रजपेदिदम् ॥ २१॥ रिपूनुच्वाटयेच्छीघ्रमेकेनैव दिनेन सः । दक्षिणाभिमुखोभूत्वा धृत्वाऽऽर्द्रवसनं
    शुचिः ॥ २२॥ शत्रुनामसमुच्वार्य मारयेतिपदाङ्कितम् । पठेदिदं स्तवं क्रोधात् सप्तकृत्वस्त्रिभिर्दिनैः
    ॥ २३॥ स रिपुर्मृत्युगेहस्य ध्रुवमातिथ्यभाग्भवेत् । हरिद्रया नटाधीशं कृत्वा प्राणान् प्रतिष्ठिपेत्
    ॥ २४॥ पीतपुष्पैः समभ्यर्च्य स्तोत्रमेतज्जपेन्नरः । स्तम्भयेत्सकलान्लोकान् किमिहक्षुद्रमानुषान् ॥ २५॥
    आकर्षणाय सर्वेषामुत्तराभिमुखोजपेत् । वाञ्छितायोषितस्सर्वास्तथा लोकान्तरस्थिताः ॥ २६॥ यक्षाश्च किन्नराश्चापि
    राजानोवशमाप्नुयुः । कुम्भस्थितं जलंस्पृष्ट्वा त्रिवारं प्रजपेदिदम् ॥ २७॥ महाग्रहगणग्रस्तान् अभिषेकञ्चकारयेत्
    । जलस्पर्शनमात्रेणमुच्यते च ग्रहादिभिः ॥ २८॥ किमत्र बहुनोक्तेन सिद्धयन्त्यखिलसिद्धयः । साक्षान्नटेश्वरो
    देवो वश्यो भवति तत्क्षणात् ॥ २९॥
