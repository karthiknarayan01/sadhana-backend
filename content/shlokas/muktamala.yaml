id: muktamala
category: shataka
name:
  english: muktamala
  devanagari: मुक्तामाला
content:
  english: yatha ravana utajanmam hritavamstatha tvamapi patyuh karatah katham hritavaniti prashnah |
    sa shriramah samudre nauvat nau avam tratum kasmannagatah iti yojana | 64| adhisamudre manovyathasamudre
    mud anandah apsu likhitaya rekhaya tulyah ityanvayah | 65| nakhinam laksham tatra guruh shreshtho
    haririva simha iva | makhino vishvamitrallabdhanyastrani yena sah | 66| suto'runah | astrishu puruhutah
    indrah shreshtha ityarthah | 67| shrantasvantah khinnacetah | 68| patripatirvainateyastasyeva javo
    yasya sah sharah arnavastham bhekamiva kshudramarim katham na jayedityarthah | 69| ashugo harirbanarupadhari
    vishnurajo yo bhavah shivastena prahitah pura mayasuranirmitam puramadahat | tathaivayam harirvanaro
    hanuman ajabhavenajakulotpannena ramena prahito lankapuramadahat | evamayamapi pitambarasya vishnoh
    shriya yuktah | 70| santah anuga kapayo yasya tena ramena| pinakivarah eva sura tayonmattah | 71|
    kapirashokavanikabhangam nakarodyatah so'nuktah anadishtah | ramenetyarthat | napyagnih shatrupurimadahat
    | so'pyasvatantro bhagavadicchavrititvadasyeti bhavah | kintvetad dvayamapi kshubdhah satyah sitaya
    nishvasa eva cakruriti yojaniyam | 72| ekasati pativratashreshtha sita aratsamantat kutilayabhirdurmatibhih
    ashivabhiramaganlabhih pakhanda dushta uktiryasam tabhirasurastribhirvane ruddha parivritatishthat
    | atraupamyam kalavupanishadiva | sapi paramapavitra kutilashayabhirasurapriyabhirdushtamatibhih pakhandanam
    73| kapaya iti sambuddhih | sa sakha hanuman kapisainyasya dainyaharam tejo yasya tadrisho bahubhyam
    na kevalamabdheh payastirnah | api tu rakshasasainyamapityanvayah | 74| kantakarikavritavityadhikantakarikavriti
    | gharme nidaghe utkhataropitam jatilatamiva nitantam tanta glanimupagata tanuryasyastam sitamapashyamiti
    yojana | 75| abala asamartha dahanashikha yatha anardrani shushkani balatrinani dagdhumicchantyapi
    sakhayam vayum pratikshate tathaiva sita ravanadin bhasmasatkartumicchantyapi tvameva pratikshamana
    tishthatityarthah | 76| bandhurapi sagaraputrairyajniyamashvam mrigayamanaih khatatvat yo jaladhih
    dalayorabhedajjadathih | dasyave ravanaya samshrayam lankarupamadat | atah sa riporishtah shatrupakshyah
    | atah so'tivelam bhrisham kimiti prarthyate | prarthyamano'pi nayam margam ta dadyaditi bhavah |
    77| namate pranamam kurvate bibhishanaya jivetyashirdatumucita | abhayadanamava kevalam yuktam | kintu
    raghavenavicarya shrirapi datta | sarvasya svasya sampado danamashrayam | ravanasya sampada eva bibhishanaya
    pratishrutam danamiti virodhapariharah | 78| sakha mitram vibhishanah | samasadi labdhah | 79| avilanghita
    maryada vela gurujanadarashca yena tadrisham bandhum sagaram babandha | gurum ca sagaramanulanghaniya
    lalangha | shambhorbhaktamapi muneh pulastyasya sutam ravanam ca ko'pi rama ityarthat | darakrite
    sitaya adhigamartha jaghana | sarvatra virodhabhasah | 80| uncchah kanashah kshetrasthasya dhanyasyadanam
    sa eva vrittiryesham te ucchavrittayo munayah | astranyeva bhoginah sarpasteshamaguruvat krishnacandanavadashrayo
    ramah | 81| patangah suryah | khecara rakshasastesham bhubhritam ravanam | 82| vahinyo nadyah senashca
    | nirjivanikritah nirudakah kritah hatashca | virodhabhasa ashcaryahetuh | 83| tanunapadagnih| trinakananam
    na dadaha kintu kilalanadih shonitanadih sasarja pravartayamasa | virodhabhasah | 84| nakaukasam devanam
    | kulishakaro mahendrah | kalakutashah shivah |
  devanagari: यथा रावण उटजान्मां हृतवांस्तथा त्वामपि पत्युः करतः कथं हृतवानिति प्रश्नः । स श्रीरामः समुद्रे
    नौवत् नौ आवां त्रातुं कस्मान्नागतः इति योजना । ६४। आधिसमुद्रे मनोव्यथासमुद्रे मुद् आनन्दः अप्सु लिखितया
    रेखया तुल्यः इत्यन्वयः । ६५। नखिनां लक्षं तत्र गुरुः श्रेष्ठो हरिरिव सिंह इव । मखिनो विश्वामित्राल्लब्धान्यस्त्राणि
    येन सः । ६६। सूतोऽरुणः । अस्त्रिषु पुरुहूतः इन्द्रः श्रेष्ठ इत्यर्थः । ६७। श्रान्तस्वान्तः खिन्नचेताः
    । ६८। पत्रिपतिर्वैनतेयस्तस्येव जवो यस्य सः शरः अर्णवस्थं भेकमिव क्षुद्रमरिं कथं न जयेदित्यर्थः । ६९।
    आशुगो हरिर्बाणरूपधारी विष्णुरजो यो भवः शिवस्तेन प्रहितः पुरा मयासुरनिर्मितं पुरमदहत् । तथैवायं हरिर्वानरो
    हनूमान् अजभवेनाजकुलोत्पन्नेन रामेण प्रहितो लङ्कापुरमदहत् । एवमयमपि पीताम्बरस्य विष्णोः श्रिया युक्तः
    । ७०। सन्तः अनुगा कपयो यस्य तेन रामेण। पिनाकिवरः एव सुरा तयोन्मत्तः । ७१। कपिरशोकवनिकाभङ्गं नाकरोद्यतः
    सोऽनुक्तः अनादिष्टः । रामेणेत्यर्थात् । नाप्यग्निः शत्रुपुरीमदहत् । सोऽप्यस्वतन्त्रो भगवदिच्छावृतित्वादस्येति
    भावः । किन्त्वेतद् द्वयमपि क्षुब्धाः सत्याः सीताया निश्वासा एव चक्रुरिति योजनीयम् । ७२। एकसती पतिव्रताश्रेष्ठा
    सीता आरात्समन्तात् कुटिलायाभिर्दुर्मतिभिः अशिवाभिरमगङ्लाभिः पाखण्डा दुष्टा उक्तिर्यासां ताभिरसुरस्त्रीभिर्वने
    रुद्धा परिवृतातिष्ठत् । अत्रौपम्यं कलावुपनिषदिव । सापि परमपवित्रा कुटिलाशयाभिरसुरप्रियाभिर्दुष्टमतिभिः
    पाखण्डानां ७३। कपय इति सम्बुद्धिः । स सखा हनूमान् कपिसैन्यस्य दैन्यहरं तेजो यस्य तादृशो बाहुभ्यां
    न केवलमब्धेः पयस्तीर्णः । अपि तु राक्षससैन्यमपीत्यन्वयः । ७४। कण्टकारिकावृतावित्यधिकण्टकारिकावृति
    । घर्मे निदाघे उत्खातरोपितां जातीलतामिव नितान्तं तान्ता ग्लानिमुपगता तनुर्यस्यास्तां सीतामपश्यमिति
    योजना । ७५। अबला असमर्था दहनशिखा यथा अनार्द्राणि शुष्काणि बालतृणानि दग्धुमिच्छन्त्यपि सखायं वायुं
    प्रतीक्षते तथैव सीता रावणादीन् भस्मसात्कर्तुमिच्छन्त्यपि त्वामेव प्रतीक्षमाणा तिष्ठतीत्यर्थः । ७६।
    बन्धुरपि सगरपुत्रैर्यज्ञियमश्वं मृगयमाणैः खातत्वात् यो जलधिः डलयोरभेदाज्जडथीः । दस्यवे रावणाय संश्रयं
    लङ्कारूपमदात् । अतः स रिपोरिष्टः शत्रुपक्ष्यः । अतः सोऽतिवेलं भृशं किमिति प्रार्थ्यते । प्रार्थ्यमानोऽपि
    नायं मार्गं त दद्यादिति भावः । ७७। नमते प्रणामं कुर्वते बिभीषणाय जीवेत्याशीर्दातुमुचिता । अभयदानमव
    केवलं युक्तम् । किन्तु राघवेणाविचार्य श्रीरपि दत्ता । सर्वस्य स्वस्य सम्पदो दानमाश्रयम् । रावणस्य
    सम्पद एव बिभीषणाय प्रतिश्रुतं दानमिति विरोधपरिहारः । ७८। सखा मित्रं विभीषणः । समासादि लब्धः । ७९।
    अविलङ्घिता मर्यादा वेला गुरुजनादरश्च येन तादृशं बन्धुं सागरं बबन्ध । गुरुं च सागरमनुलङ्घनीय ललङ्घ
    । शम्भोर्भक्तमपि मुनेः पुलस्त्यस्य सुतं रावणं च कोऽपि राम इत्यर्थात् । दारकृते सीताया अधिगमार्थ जघान
    । सर्वत्र विरोधाभासः । ८०। उञ्च्छः कणशः क्षेत्रस्थस्य धान्यस्यादानं स एव वृत्तिर्येषां ते उच्छवृत्तयो
    मुनयः । अस्त्राण्येव भोगिनः सर्पास्तेषामगुरुवत् कृष्णचन्दनवदाश्रयो रामः । ८१। पतङ्गः सूर्यः । खेचरा
    राक्षसास्तेषां भूभृतं रावणम् । ८२। वाहिन्यो नद्यः सेनाश्च । निर्जीवनीकृताः निरुदकाः कृताः हताश्च ।
    विरोधाभास आश्चर्यहेतुः । ८३। तनूनपादग्निः। तृणकाननं न ददाह किन्तु कीलालनदीः शोणितनदीः ससर्ज प्रवर्तयामास
    । विरोधाभासः । ८४। नाकौकसां देवानाम् । कुलिशकरो महेन्द्रः । कालकूटाशः शिवः ।
