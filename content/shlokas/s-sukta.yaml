id: s-sukta
category: sukta
name:
  english: s-sukta
  devanagari: स्-सुक्त
content:
  english: sarvabhutanam tamihopahvaye shriyam || 9|| manasah kamamakutim vacah satyamashimahi | pashunam
    rupamannasya mayi shrih shrayatam yashah || 10|| kardamena prajabhuta mayi sambhava kardama | shriyam
    vasaya me kule mataram padmamalinim || 11|| apah srijantu snigdhani ciklita vasa me grihe | ni ca
    devim mataram shriyam vasaya me kule || 12|| ardram pushkarinim pushtim pingalam padmamalinim | candram
    hiranmayim lakshmim jatavedo ma avaha || 13|| ardram yah karinim yashtim suvarnam hemamalinim | suryam
    hiranmayim lakshmim jatavedo ma avaha || 14|| tam ma avaha jatavedo lakshmimanapagaminim | yasyam
    hiranyam prabhutam gavo dasyo'shvanvindeyam purushanaham || 15|| yah shucih prayato bhutva juhuyadajya
    manvaham | shriyah pancadasharcam ca shrikamah satatam japet || 16|| phalashruti padmanane padma uru
    padmakshi padmasambhave | tvam mam bhajasva padmakshi yena saukhyam labhamyaham || ashvadayi godayi
    dhanadayi mahadhane | dhanam me jushatam devi sarvakamamshca dehi me || putrapautra dhanam dhanyam
    hastyashvadigave ratham | prajanam bhavasi mata ayushmantam karotu mam || dhanamagnirdhanam vayurdhanam
    suryo dhanam vasuh | dhanamindro brihaspatirvarunam dhanamashnu te || vainateya somam piba somam pibatu
    vritraha | somam dhanasya somino mahyam dadatu sominah || na krodho na ca matsaryam na lobho nashubha
    matih || bhavanti kritapunyanam bhaktanam shrisuktam japetsada || varshantu te vibhavari divo abhrasya
    vidyutah | rohantu sarvabijanyava brahma dvisho jahi || padmapriye padmini padmahaste padmalaye padmadalayatakshi
    | vishvapriye vishnu mano'nukule tvatpadapadmam mayi sannidhatsva || ya sa padmasanastha vipulakatitati
    padmapatrayatakshi | gambhira vartanabhih stanabhara namita shubhra vastrottariya | lakshmirdivyairgajendrairmanigana
    khacitaissnapita hemakumbhaih | nityam sa padmahasta mama vasatu grihe sarvamangalyayukta || lakshmim
    kshirasamudra rajatanayam shriramgadhameshvarim | dasibhutasamasta deva vanitam lokaika dipamkuram
    | shrimanmandakatakshalabdha vibhava brahmendragangadharam | tvam trailokya kutumbinim sarasijam vande
    mukundapriyam || siddhalakshmirmokshalakshmirjayalakshmissarasvati | shrilakshmirvaralakshmishca prasanna
    mama sarvada || varamkushau pashamabhitimudram karairvahantim kamalasanastham | balarka koti pratibham
    trinetram bhajehamadyam jagadishvarim tam || sarvamangalamangalye shive sarvartha sadhike | sharanye
    tryambake devi narayani namo'stu te || sarasijanilaye sarojahaste dhavalataramshuka gandhamalyashobhe
    | bhagavati harivallabhe manojne tribhuvanabhutikariprasida mahyam || vishnupatnim kshamam devim madhavim
    madhavapriyam | vishnoh priyasakhimm devim namamyacyutavallabham || mahalakshmi ca vidmahe vishnupatni
    ca dhimahi | tanno lakshmih pracodayat ||
  devanagari: सर्वभूतानां तामिहोपह्वये श्रियम् ॥ ९॥ मनसः काममाकूतिं वाचः सत्यमशीमहि । पशूनां रूपमन्नस्य
    मयि श्रीः श्रयतां यशः ॥ १०॥ कर्दमेन प्रजाभूता मयि सम्भव कर्दम । श्रियं वासय मे कुले मातरं पद्ममालिनीम्
    ॥ ११॥ आपः सृजन्तु स्निग्धानि चिक्लीत वस मे गृहे । नि च देवीं मातरं श्रियं वासय मे कुले ॥ १२॥ आर्द्रां
    पुष्करिणीं पुष्टिं पिङ्गलां पद्ममालिनीम् । चन्द्रां हिरण्मयीं लक्ष्मीं जातवेदो म आवह ॥ १३॥ आर्द्रां
    यः करिणीं यष्टिं सुवर्णां हेममालिनीम् । सूर्यां हिरण्मयीं लक्ष्मीं जातवेदो म आवह ॥ १४॥ तां म आवह जातवेदो
    लक्ष्मीमनपगामिनीम् । यस्यां हिरण्यं प्रभूतं गावो दास्योऽश्वान्विन्देयं पुरुषानहम् ॥ १५॥ यः शुचिः प्रयतो
    भूत्वा जुहुयादाज्य मन्वहम् । श्रियः पञ्चदशर्चं च श्रीकामः सततं जपेत् ॥ १६॥ फलश्रुति पद्मानने पद्म
    ऊरू पद्माक्षी पद्मसम्भवे । त्वं मां भजस्व पद्माक्षी येन सौख्यं लभाम्यहम् ॥ अश्वदायी गोदायी धनदायी
    महाधने । धनं मे जुषतां देवि सर्वकामांश्च देहि मे ॥ पुत्रपौत्र धनं धान्यं हस्त्यश्वादिगवे रथम् । प्रजानां
    भवसि माता आयुष्मन्तं करोतु माम् ॥ धनमग्निर्धनं वायुर्धनं सूर्यो धनं वसुः । धनमिन्द्रो बृहस्पतिर्वरुणं
    धनमश्नु ते ॥ वैनतेय सोमं पिब सोमं पिबतु वृत्रहा । सोमं धनस्य सोमिनो मह्यं ददातु सोमिनः ॥ न क्रोधो
    न च मात्सर्यं न लोभो नाशुभा मतिः ॥ भवन्ति कृतपुण्यानां भक्तानां श्रीसूक्तं जपेत्सदा ॥ वर्षन्तु ते
    विभावरि दिवो अभ्रस्य विद्युतः । रोहन्तु सर्वबीजान्यव ब्रह्म द्विषो जहि ॥ पद्मप्रिये पद्मिनि पद्महस्ते
    पद्मालये पद्मदलायताक्षि । विश्वप्रिये विष्णु मनोऽनुकूले त्वत्पादपद्मं मयि सन्निधत्स्व ॥ या सा पद्मासनस्था
    विपुलकटितटी पद्मपत्रायताक्षी । गम्भीरा वर्तनाभिः स्तनभर नमिता शुभ्र वस्त्रोत्तरीया । लक्ष्मीर्दिव्यैर्गजेन्द्रैर्मणिगण
    खचितैस्स्नापिता हेमकुम्भैः । नित्यं सा पद्महस्ता मम वसतु गृहे सर्वमाङ्गल्ययुक्ता ॥ लक्ष्मीं क्षीरसमुद्र
    राजतनयां श्रीरंगधामेश्वरीम् । दासीभूतसमस्त देव वनितां लोकैक दीपांकुराम् । श्रीमन्मन्दकटाक्षलब्ध विभव
    ब्रह्मेन्द्रगङ्गाधराम् । त्वां त्रैलोक्य कुटुम्बिनीं सरसिजां वन्दे मुकुन्दप्रियाम् ॥ सिद्धलक्ष्मीर्मोक्षलक्ष्मीर्जयलक्ष्मीस्सरस्वती
    । श्रीलक्ष्मीर्वरलक्ष्मीश्च प्रसन्ना मम सर्वदा ॥ वरांकुशौ पाशमभीतिमुद्रां करैर्वहन्तीं कमलासनस्थाम्
    । बालार्क कोटि प्रतिभां त्रिणेत्रां भजेहमाद्यां जगदीश्वरीं ताम् ॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थ
    साधिके । शरण्ये त्र्यम्बके देवि नारायणि नमोऽस्तु ते ॥ सरसिजनिलये सरोजहस्ते धवलतरांशुक गन्धमाल्यशोभे
    । भगवति हरिवल्लभे मनोज्ञे त्रिभुवनभूतिकरिप्रसीद मह्यम् ॥ विष्णुपत्नीं क्षमां देवीं माधवीं माधवप्रियाम्
    । विष्णोः प्रियसखींम् देवीं नमाम्यच्युतवल्लभाम् ॥ महालक्ष्मी च विद्महे विष्णुपत्नी च धीमही । तन्नो
    लक्ष्मीः प्रचोदयात् ॥
