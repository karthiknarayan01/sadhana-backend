  devanagari: भव्याकारो भावितेष्ठार्थदाता वामे चासौ वामहस्तं दधानः ॥ ५॥ ज्ञानाभीती ज्ञानवान् दक्षहस्तेरन्ता
    चित्ते राघवेन्द्रो मम स्यात् ॥ ६॥ अथ श्रीराघवेन्द्रसहस्रनामावलिः । ॐ अज्ञानभञ्जनाय नमः । अणिमाद्यष्टसिद्धिदाय
    । अनणुज्ञानसम्पदे । अमोघशक्तये । अनघाय । अपरोक्षीकृताच्युताय । अखिलाभीष्टदाय । आत्मविदे । आयुःप्रवर्धनाय
    । आनन्दतीर्थसच्छास्त्रटीकाभावप्रकाशकाय । आनन्दसान्द्राय । आरब्धकार्यान्तगमनक्षमाय । आकुलीकृतदुर्वादिवृन्दाय
    । आकारबन्धुराय । आशुप्रसन्नाय । आसन्नभक्तकामसुरद्रुमाय । आध्यात्मरताय । आचार्याय । आसमुद्रैकसद्गुरवे
    । आत्मारामार्चनासक्ताय नमः । २० ॐ आर्याय नमः । आप्ततमाय । इन्द्रियोत्पन्नदोषघ्नाय । इन्द्रवत्त्यागभोगिने
    । इष्टदात्रे । ईषणात्रयवर्जिताय । उग्ररक्षःपिशाचघ्नाय । उन्मादहराय । उत्तमाय । उदारचित्ताय । उद्धारकाय
    । उत्पातहारकाय । उपेक्षितकुवादीन्द्राय । उपकारपरायणाय । ऊरुदघ्नीकृतापारभवसागराय । ऊर्जिताय । ऊष्महर्त्रे
    । ऋक्षाधिपतिशीतलदर्शनाय । ऋजुस्वभावाय । ऋद्धोरुमाहात्म्याय नमः । ४० ॐ ऋजुमाससाय नमः । एडमूकसुवाग्दात्रे
    । एकभाषिणे । एकान्तभक्ताय । ऐश्वर्यदात्रे । एक्यमतच्छिदे । ओतत्वेत्याद्यनुव्याख्यासुधाभावार्थदर्शिने
    । ओङ्कारजपशीलाय । सदा ओमात्मेत्युपासिने । औषधोक्त्यापि भक्तानामामयाधिकहारिणे । अंसात्ततुलसीमालाय ।
    अंहोनाशकदर्शनाय । अस्तङ्गतारिषड्वर्गाय । अर्थिमन्दारकाय । कलिदोषविनाशाय । कलौ सद्यः फलप्रदाय । कमलापतिभक्ताय
