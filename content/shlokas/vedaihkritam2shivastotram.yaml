id: vedaihkritam2shivastotram
category: stotram
name:
  english: vedaihkritam2shivastotram
  devanagari: वेदैःकृतं२शिवस्तोत्रम्
content:
  english: vedaih kritam 2 shivastotram rigveda uvaca | yadantassthani bhutani yatassarvam pravarttate
    | yadahuh paramam tattvam sa rudrastveka eva hi || 25|| yajurveda uvaca | yo yajnairakhilairisho yogena
    ca samijyate | yena pramanam khalu nassa ekah sarvadrikchivah || 26|| samaveda uvaca | yenedam bhramyate
    vishvam yogibhiryo vicintyate | yadbhasa bhasate vishvam sa ekastryambakah parah || 27|| atharvaveda
    uvaca | yam prapashyanti devesham bhaktyanugrahino janah | tamahurekam kaivalyam shankaram duhkhatah
    param || 28|| iti shivapurane shatarudrasamhitayam ashtamadhyayantargatam vedaih kritam shivastotram
    samaptam | shivapurana | shatarudrasamhita | adhyaya 8
  devanagari: वेदैः कृतं २ शिवस्तोत्रम् ऋग्वेद उवाच । यदन्तस्स्थानि भूतानि यतस्सर्वं प्रवर्त्तते । यदाहुः
    परमं तत्त्वं स रुद्रस्त्वेक एव हि ॥ २५॥ यजुर्वेद उवाच । यो यज्ञैरखिलैरीशो योगेन च समिज्यते । येन प्रमाणं
    खलु नस्स एकः सर्वदृक्छिवः ॥ २६॥ सामवेद उवाच । येनेदं भ्राम्यते विश्वं योगिभिर्यो विचिन्त्यते । यद्भासा
    भासते विश्वं स एकस्त्र्यम्बकः परः ॥ २७॥ अथर्ववेद उवाच । यं प्रपश्यन्ति देवेशं भक्त्यनुग्रहिणो जनाः
    । तमाहुरेकं कैवल्यं शङ्करं दुःखतः परम् ॥ २८॥ इति शिवपुराणे शतरुद्रसंहितायां अष्टमाध्ययान्तर्गतं वेदैः
    कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । शतरुद्रसंहिता । अध्याय ८
meaning: {}
