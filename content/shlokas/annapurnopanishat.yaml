id: annapurnopanishat
category: upanishad
name:
  english: annapurnopanishat
  devanagari: अन्नपूर्णोपनिषत्
content:
  english: '|| bimbapratibimbadarshanena bhedabhramo nivrittah | sphatikalohitadarshanena paramarthikakartritvabhramo
    nivrittah | ghatamathakashadarshanena sangitibhramo nivrittah | rajjusarpadarshanena karanadbhinnajagatah
    satyatvabhramo nivrittah | kanakarucakadarshanena vikaritvabhramo nivrittah | tadaprabhriti maccittam
    brahmakaramabhutsvayam | nidagha tvamapittham hi tattvajnanamavapnuhi ||'
  devanagari: ॥ बिम्बप्रतिबिम्बदर्शनेन भेदभ्रमो निवृत्तः । स्फटिकलोहितदर्शनेन पारमार्थिककर्तृत्वभ्रमो
    निवृत्तः । घटमठाकाशदर्शनेन सङ्गीतिभ्रमो निवृत्तः । रज्जुसर्पदर्शनेन कारणाद्भिन्नजगतः सत्यत्वभ्रमो
    निवृत्तः । कनकरुचकदर्शनेन विकारित्वभ्रमो निवृत्तः । तदाप्रभृति मच्चित्तं ब्रह्माकारमभूत्स्वयम् । निदाघ
    त्वमपीत्थं हि तत्त्वज्ञानमवाप्नुहि ॥
meaning: {}
