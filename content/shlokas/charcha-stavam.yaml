id: charcha-stavam
category: stotram
name:
  english: Charcha Stavam
content:
  english: saundaryavibhramabhuvo bhuvanadhipatya sankalpakalpataravastripure jayanti | ete kavitvakumadaprakaravabodha
    purnendavastvayi jagajjanani pranamah || || devi stutivyatikare kritabuddhayaste vacaspati prabhritayo'pi
    jadi bhavanti | tasmannisargajadima katamo'hamatra stotram tava tripuratapanapatni kartum || || matastathapi
    bhavatim bhavativratapa vicchittaye stutimaharnava karnadharah | stotum bhavani sa bhavaccaranaravinda
    bhaktigrahah kimapi mam mukhari karoti || || sute jaganti bhavati bhavati bibharti jagarti tatkshayakrite
    bhavati bhavani | moham bhinatti bhavati bhavati runaddhi lilayitam jayati citramidam bhavatyah ||
    || yasminmanagapi navambujapatragaurim gaurim prasadamadhuram drishamadadhasi | tasminnirantaramanangasharavakirna
    simantininayanasantatayah patanti || || prithvibhujo'pyudayanaprabhavasya tasya vidyadhara pranati
    cumbita padapithah | taccakravartipadavipranayah sa eshah tvatpadapankajarajah kanajah prasadah ||
    || tvatpadapankajaraja pranipatapurvaih punyairanalpamatibhih kritibhih kavindraih | kshirakshapakaradukulahimavadata
    kairapyavapi bhuvanatritaye'pi kirtih || || kalpadrumaprasavakalpitacitrapujam uddipita priyatamamadaraktagitim
    | nityam bhavani bhavatimupavinayanti vidyadharah kanakashailaguhagriheshu || || lakshmivashikaranakarmani
    kamininam akarshanavyatikareshu ca siddhamantrah | nirandhramohatimiracchidurapradipo devi tvadanghrijanito
    jayati prasadah || || devi tvadanghrinakharatnabhuvo mayukhah pratyagramauktikaruco mudamudvahanti
    | sevanativyatikare surasundarinam simantasimni kusumastabakayitam yaih || || murdhni sphurattuhinadidhitidiptidiptam
    madhye lalatamamarayudharashmicitram | hriccakracumbi hutabhukkanikanukari jyotiryadetadidamamba tava
    svarupam || || rupam tava sphuritacandramaricigauram alokate shirasi vagadhidaivatam yah | nihsimasuktiracanamritanirjharasya
    tasya prasadamadhurah prasaranti vacah || || sindurapamsupatalacchuritamiva dyam tvattejasa jaturasasnapitamivorvim
    | yah pashyati kshanamapi tripure vihaya vridam mridani sudrishastamanudravanti || || matarmuhurtamapi
    yah smarati svarupam laksharasaprasaratantunibham bhavatyah | dhyayantyananyamanasastamanangataptah
    pradyumnasimni subhagatvagunam tarunyah || || yo'yam cakasti gaganarnavaratnaminduh yo'yam surasuraguruh
    purushah puranah | yadvamamardhamidamandhakasudanasya devi tvameva taditi pratipadayanti || || icchanurupamanurupagunaprakarsha
    sankarshini tvamabhimrishya yada bibharshi | jayeta sa tribhuvanaika gurustadanim devah shivo'pi bhuvanatrayasutradharah
    || || dhyatasi haimavati yena himamshurashmi malamaladyutirakalmashamanasena | tasyavilambamanavadyamanantakalpam
    alpairdinaih srijasi sundari vagvilasam || || adharamarutanirodhavashena yesham sinduraranjitasarojagunanukari
    | diptam hridi sphurati devi vapustvadiyam dhyayanti taniha samihitasiddhisarthah || || ye cintayantyarunamandalamadhyavarti
    rupam tavamba navayavakapankapingam | tesham sadaiva kusumayudhabanabhinna vakshahsthala mrigadrisho
    vashaga bhavanti || || tvamaindavimiva kalamanuphaladesham udbhasitambaratalamavalokayantah | sadyo
    bhavani sudhiyah kavayo bhavanti tvam bhavanahitadhiyam kulakamadhenuh || || sharvani sarvajanavanditapadapadme
    padmacchadadyutividambitanetralakshmi | nishpapamurtijanamanasarajahamsi hamsi tvamapadamanekavidham
    janasya || || uttaptahemarucire tripure punihi cetashcirantanamaghaughavanam lunihi | karagrihe nigalabandhanayantritasya
    tvatsamsmritau jhatiti me nigalastrutanti || || tvam vyapiniti sumana iti kundaliti tvam kaminiti
    kamaleti kalavatiti | tvam maliniti lalitetyaparajiteti devi stuvanti vijayeti jayetyumeti || || uddamakamaparamarthasarojakhanda
    candadyutidyutimapasitashadvikaram | mohadvipendrakadanodyatabodhasimha lilaguham bhagavatim tripuram
    namami || || ganeshavatukastuta ratisahayakamanvita smararivaravishtara kusumabanabanairyuta | anangakusumadibhih
    parivrita ca siddhaistribhih kadambavanamadhyaga tripurasundari patu nah || || rudrani vidrumamayim
    pratimamiva tvam ye cintayantyarunakantimananyarupam | tanetya pakshmaladrishah prasabham bhajante
    kanthavasaktamridubahulatastarunyah || || tvadrupaikanirupanapranayitabandho drishostvadguna gramakarnanaragita
    shravanayostvatsamsmritishcetasi | tvatpadarcanacaturi karayuge tvatkirtitam vaci me kutrapi tvadupasanavyasanita
    me devi ma shamyatu || || tvadrupamullasitadadimapushparaktam udbhavayenmadanadaivatamaksharam yah
    | tam rupahinamapi manmathanirvishesham alokayantyurunitambatatastarunyah || || brahmendrarudraharicandrasahasrarashmi
    skandadvipananahutashanavanditayai | vagishvari tribhuvaneshvari vishvamatah antarbahishca kritasamsthitaye
    namaste || || kastotrametadanuvasaramishvarayah shreyaskaram pathati va yadi va shrinoti | tasyepsitam
    phalati rajabhiridyate'sau jayeta sa priyatamo madirekshananam || || iti shrikalidasa viracita pancastavyam
    dvitiyah carcastavah |
  devanagari: सौन्दर्यविभ्रमभुवो भुवनाधिपत्य सङ्कल्पकल्पतरवस्त्रिपुरे जयन्ति । एते कवित्वकुमदप्रकरावबोध
    पूर्णेन्दवस्त्वयि जगज्जननि प्रणामाः ॥ ॥ देवि स्तुतिव्यतिकरे कृतबुद्धयस्ते वाचस्पति प्रभृतयोऽपि जडी
    भवन्ति । तस्मान्निसर्गजडिमा कतमोऽहमत्र स्तोत्रं तव त्रिपुरतापनपत्नि कर्तुम् ॥ ॥ मातस्तथापि भवतीं भवतीव्रताप
    विच्छित्तये स्तुतिमहार्णव कर्णधारः । स्तोतुं भवानि स भवच्चरणारविन्द भक्तिग्रहः किमपि मां मुखरी करोति
    ॥ ॥ सूते जगन्ति भवती भवती बिभर्ति जागर्ति तत्क्षयकृते भवती भवानि । मोहं भिनत्ति भवती भवती रुणद्धि
    लीलायितं जयति चित्रमिदं भवत्याः ॥ ॥ यस्मिन्मनागपि नवाम्बुजपत्रगौरीं गौरीं प्रसादमधुरां दृशमादधासि
    । तस्मिन्निरन्तरमनङ्गशरावकीर्ण सीमन्तिनीनयनसन्ततयः पतन्ति ॥ ॥ पृथ्वीभुजोऽप्युदयनप्रभवस्य तस्य विद्याधर
    प्रणति चुम्बित पादपीठः । तच्चक्रवर्तिपदवीप्रणयः स एषः त्वत्पादपङ्कजरजः कणजः प्रसादः ॥ ॥ त्वत्पादपङ्कजरज
    प्रणिपातपूर्वैः पुण्यैरनल्पमतिभिः कृतिभिः कवीन्द्रैः । क्षीरक्षपाकरदुकूलहिमावदाता कैरप्यवापि भुवनत्रितयेऽपि
    कीर्तिः ॥ ॥ कल्पद्रुमप्रसवकल्पितचित्रपूजां उद्दीपित प्रियतमामदरक्तगीतिम् । नित्यं भवानि भवतीमुपवीणयन्ति
    विद्याधराः कनकशैलगुहागृहेषु ॥ ॥ लक्ष्मीवशीकरणकर्मणि कामिनीनां आकर्षणव्यतिकरेषु च सिद्धमन्त्रः । नीरन्ध्रमोहतिमिरच्छिदुरप्रदीपो
    देवि त्वदङ्घ्रिजनितो जयति प्रसादः ॥ ॥ देवि त्वदङ्घ्रिनखरत्नभुवो मयूखाः प्रत्यग्रमौक्तिकरुचो मुदमुद्वहन्ति
    । सेवानतिव्यतिकरे सुरसुन्दरीणां सीमन्तसीम्नि कुसुमस्तबकायितं यैः ॥ ॥ मूर्ध्नि स्फुरत्तुहिनदीधितिदीप्तिदीप्तं
    मध्ये ललाटममरायुधरश्मिचित्रम् । हृच्चक्रचुम्बि हुतभुक्कणिकानुकारि ज्योतिर्यदेतदिदमम्ब तव स्वरूपम्
    ॥ ॥ रूपं तव स्फुरितचन्द्रमरीचिगौरं आलोकते शिरसि वागधिदैवतं यः । निःसीमसूक्तिरचनामृतनिर्झरस्य तस्य
    प्रसादमधुराः प्रसरन्ति वाचः ॥ ॥ सिन्दूरपांसुपटलच्छुरितामिव द्यां त्वत्तेजसा जतुरसस्नपितामिवोर्वीम्
    । यः पश्यति क्षणमपि त्रिपुरे विहाय व्रीडां मृडानि सुदृशस्तमनुद्रवन्ति ॥ ॥ मातर्मुहूर्तमपि यः स्मरति
    स्वरूपं लाक्षारसप्रसरतन्तुनिभं भवत्याः । ध्यायन्त्यनन्यमनसस्तमनङ्गतप्ताः प्रद्युम्नसीम्नि सुभगत्वगुणं
    तरुण्यः ॥ ॥ योऽयं चकास्ति गगनार्णवरत्नमिन्दुः योऽयं सुरासुरगुरुः पुरुषः पुराणः । यद्वाममर्धमिदमन्धकसूदनस्य
    देवि त्वमेव तदिति प्रतिपादयन्ति ॥ ॥ इच्छानुरूपमनुरूपगुणप्रकर्ष सङ्कर्षिणि त्वमभिमृश्य यदा बिभर्षि
    । जायेत स त्रिभुवनैक गुरुस्तदानीं देवः शिवोऽपि भुवनत्रयसूत्रधारः ॥ ॥ ध्यातासि हैमवति येन हिमांशुरश्मि
    मालामलद्युतिरकल्मषमानसेन । तस्याविलम्बमनवद्यमनन्तकल्पं अल्पैर्दिनैः सृजसि सुन्दरि वाग्विलासम् ॥ ॥
    आधारमारुतनिरोधवशेन येषां सिन्दूररञ्जितसरोजगुणानुकारि । दीप्तं हृदि स्फुरति देवि वपुस्त्वदीयं ध्यायन्ति
    तानिह समीहितसिद्धिसार्थाः ॥ ॥ ये चिन्तयन्त्यरुणमण्डलमध्यवर्ति रूपं तवाम्ब नवयावकपङ्कपिङ्गम् । तेषां
    सदैव कुसुमायुधबाणभिन्न वक्षःस्थला मृगदृशो वशगा भवन्ति ॥ ॥ त्वामैन्दवीमिव कलामनुफालदेशं उद्भासिताम्बरतलामवलोकयन्तः
    । सद्यो भवानि सुधियः कवयो भवन्ति त्वं भावनाहितधियां कुलकामधेनुः ॥ ॥ शर्वाणि सर्वजनवन्दितपादपद्मे पद्मच्छदद्युतिविडम्बितनेत्रलक्ष्मि
    । निष्पापमूर्तिजनमानसराजहंसि हंसि त्वमापदमनेकविधां जनस्य ॥ ॥ उत्तप्तहेमरुचिरे त्रिपुरे पुनीहि चेतश्चिरन्तनमघौघवनं
    लुनीहि । कारागृहे निगलबन्धनयन्त्रितस्य त्वत्संस्मृतौ झटिति मे निगलास्त्रुटन्ति ॥ ॥ त्वां व्यापिनीति
    सुमना इति कुण्डलीति त्वां कामिनीति कमलेति कलावतीति । त्वां मालिनीति ललितेत्यपराजितेति देवि स्तुवन्ति
    विजयेति जयेत्युमेति ॥ ॥ उद्दामकामपरमार्थसरोजखण्ड चण्डद्युतिद्युतिमपासितषड्विकाराम् । मोहद्विपेन्द्रकदनोद्यतबोधसिंह
    लीलागुहां भगवतीं त्रिपुरां नमामि ॥ ॥ गणेशवटुकस्तुता रतिसहायकामान्विता स्मरारिवरविष्टरा कुसुमबाणबाणैर्युता
    । अनङ्गकुसुमादिभिः परिवृता च सिद्धैस्त्रिभिः कदम्बवनमध्यगा त्रिपुरसुन्दरी पातु नः ॥ ॥ रुद्राणि विद्रुममयीं
    प्रतिमामिव त्वां ये चिन्तयन्त्यरुणकान्तिमनन्यरूपाम् । तानेत्य पक्ष्मलदृशः प्रसभं भजन्ते कण्ठावसक्तमृदुबाहुलतास्तरुण्यः
    ॥ ॥ त्वद्रूपैकनिरूपणप्रणयिताबन्धो दृशोस्त्वद्गुण ग्रामाकर्णनरागिता श्रवणयोस्त्वत्संस्मृतिश्चेतसि ।
    त्वत्पादार्चनचातुरी करयुगे त्वत्कीर्तितं वाचि मे कुत्रापि त्वदुपासनव्यसनिता मे देवि मा शाम्यतु ॥ ॥
    त्वद्रूपमुल्लसितदाडिमपुष्परक्तं उद्भावयेन्मदनदैवतमक्षरं यः । तं रूपहीनमपि मन्मथनिर्विशेषं आलोकयन्त्युरुनितम्बतटास्तरुण्यः
    ॥ ॥ ब्रह्मेन्द्ररुद्रहरिचन्द्रसहस्ररश्मि स्कन्दद्विपाननहुताशनवन्दितायै । वागीश्वरि त्रिभुवनेश्वरि
    विश्वमातः अन्तर्बहिश्च कृतसंस्थितये नमस्ते ॥ ॥ कस्तोत्रमेतदनुवासरमीश्वरायाः श्रेयस्करं पठति वा यदि
    वा शृणोति । तस्येप्सितं फलति राजभिरीड्यतेऽसौ जायेत स प्रियतमो मदिरेक्षणानाम् ॥ ॥ इति श्रीकालिदास विरचित
    पञ्चस्तव्यां द्वितीयः चर्चास्तवः ।
