id: kasi-vishwanathashtakam
category: stotram
name:
  english: Kasi Vishwanathashtakam
content:
  english: ganga taranga ramaniya jata kalapam gauri nirantara vibhushita vama bhagam narayana priyamananga
    madapaharam varanashi purapatim bhaja vishvanatham || || vacamagocaramaneka guna svarupam vagisha
    vishnu sura sevita pada padmam vamena vigraha varena kalatravantam varanashi purapatim bhaja vishvanatham
    || || bhutadipam bhujaga bhushana bhushitangam vyaghranjinam baradharam trinetram pashankushabhaya
    varaprada shulapanim varanashi purapatim bhaja vishvanatham || || sitamshu shobhita kirita virajamanam
    balekshanatala vishoshita pancabanam nagadhipa racita basura karna puram varanashi purapatim bhaja
    vishvanatham || || pancananam durita matta matangajanam nagantakam dhanuja pungava pannaganam davanalam
    marana shoka jaratavinam varanashi purapatim bhaja vishvanatham || || tejomayam saguna nirgunamadvitiyam
    ananda kandamaparajita maprameyam nagatmakam sakala nishkalamatma rupam varanashi purapatim bhaja
    vishvanatham || || asham vihaya parihritya parashya nindam pape rathim ca sunivarya manassamadhau
    adhaya hrit kamala madhya gatam paresham varanashi purapatim bhaja vishvanatham || || ragadhi dosha
    rahitam svajananuragam vairagya shanti nilayam girija sahayam madhurya dhairya subhagam garalabhiramam
    varanashi purapatim bhaja vishvanatham || || varanashi pura pate sthavanam shivasya vyakhyatam ashtakamidam
    pathate manushya vidyam shriyam vipula saukhyamananta kirtim samprapya deva nilaye labhate ca moksham
    || vishvanathashtakamidam punyam yah patheh shiva sannidhau shivalokamavapnoti shivenasaha modate
    ||
  devanagari: गङ्गा तरङ्ग रमणीय जटा कलापं गौरी निरन्तर विभूषित वाम भागं नारायण प्रियमनङ्ग मदापहारं वाराणशी
    पुरपतिं भज विश्वनाथम् ॥ ॥ वाचामगोचरमनेक गुण स्वरूपं वागीश विष्णु सुर सेवित पाद पद्मं वामेण विग्रह
    वरेन कलत्रवन्तं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ भूतादिपं भुजग भूषण भूषिताङ्गं व्याघ्राञ्जिनां बरधरं
    त्रिनेत्रं पाशाङ्कुशाभय वरप्रद शूलपाणिं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ सीतांशु शोभित किरीट विराजमानं
    बालेक्षणातल विशोषित पञ्चबाणं नागाधिपा रचित बासुर कर्ण पूरं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ पञ्चाननं
    दुरित मत्त मतङ्गजानां नागान्तकं धनुज पुङ्गव पन्नागानां दावानलं मरण शोक जराटवीनां वाराणशी पुरपतिं भज
    विश्वनाथम् ॥ ॥ तेजोमयं सगुण निर्गुणमद्वितीयं आनन्द कन्दमपराजित मप्रमेयं नागात्मकं सकल निष्कलमात्म
    रूपं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ आशां विहाय परिहृत्य परश्य निन्दां पापे रथिं च सुनिवार्य मनस्समाधौ
    आधाय हृत् कमल मध्य गतं परेशं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ रागाधि दोष रहितं स्वजनानुरागं वैराग्य
    शान्ति निलयं गिरिजा सहायं माधुर्य धैर्य सुभगं गरलाभिरामं वाराणशी पुरपतिं भज विश्वनाथम् ॥ ॥ वाराणशी
    पुर पते स्थवनं शिवस्य व्याख्यातं अष्टकमिदं पठते मनुष्य विद्यां श्रियं विपुल सौख्यमनन्त कीर्तिं सम्प्राप्य
    देव निलये लभते च मोक्षम् ॥ विश्वनाथाष्टकमिदं पुण्यं यः पठेः शिव सन्निधौ शिवलोकमवाप्नोति शिवेनसह मोदते
    ॥
