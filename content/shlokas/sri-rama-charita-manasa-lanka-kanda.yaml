id: sri-rama-charita-manasa-lanka-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Lanka Kanda
content:
  english: shri ganeshaya namah shri janakivallabho vijayate shri ramacaritamanasa shashtha sopana ramam
    kamarisevyam bhavabhayaharanam kalamattebhasimham yogindram jnanagamyam gunanidhimajitam nirgunam
    nirvikaram| mayatitam suresham khalavadhaniratam brahmavrindaikadevam vande kandavadatam sarasijanayanam
    devamurvisharupam || || shankhendvabhamativasundaratanum shardulacarmambaram kalavyalakaralabhushanadharam
    gangashashankapriyam| kashisham kalikalmashaughashamanam kalyanakalpadrumam naumidyam girijapatim
    gunanidhim kandarpaham shankaram || || yo dadati satam shambhuh kaivalyamapi durlabham| khalanam dandakridyo'sau
    shankarah sham tanotu me || lava nimesha paramanu juga barasha kalapa sara canda| bhajasi na mana
    tehi rama ko kalu jasu kodanda || so sindhu bacana suni rama saciva boli prabhu asa kaheu| aba bilambu
    kehi kama karahu setu utarai kataku || sunahu bhanukula ketu jamavanta kara jori kaha| natha nama
    tava setu nara carhai bhava sagara tarihim || yaha laghu jaladhi tarata kati bara| asa suni puni kaha
    pavanakumara || prabhu pratapa baravanala bhari| sosheu prathama payonidhi bari || taba ripu nari
    rudana jala dhara| bhareu bahori bhayu tehim khara || suni ati ukuti pavanasuta keri| harashe kapi
    raghupati tana heri || jamavanta bole dau bhai| nala nilahi saba katha sunai || rama pratapa sumiri
    mana mahim| karahu setu prayasa kachu nahim || boli lie kapi nikara bahori| sakala sunahu binati kachu
    mori || rama carana pankaja ura dharahu| kautuka eka bhalu kapi karahu || dhavahu markata bikata barutha|
    anahu bitapa girinha ke jutha || suni kapi bhalu cale kari huha| jaya raghubira pratapa samuha ||
    do ati utanga giri padapa lilahim lehim uthai| ani dehim nala nilahi racahim te setu banai || || saila
    bisala ani kapi dehim| kanduka iva nala nila te lehim || dekhi setu ati sundara racana| bihasi kripanidhi
    bole bacana || parama ramya uttama yaha dharani| mahima amita jai nahim barani || karihu~ iha~ sambhu
    thapana| more hridaya~ parama kalapana || suni kapisa bahu duta pathae| munibara sakala boli lai ae
    || linga thapi bidhivata kari puja| siva samana priya mohi na duja || siva drohi mama bhagata kahava|
    so nara sapanehu~ mohi na pava || sankara bimukha bhagati caha mori| so naraki murha mati thori ||
    do sankara priya mama drohi siva drohi mama dasa| te nara karahi kalapa bhari dhora naraka mahu~ basa
    || || je ramesvara darasanu karihahim| te tanu taji mama loka sidharihahim || jo gangajalu ani carhaaihi|
    so sajujya mukti nara paihi || hoi akama jo chala taji seihi| bhagati mori tehi sankara deihi || mama
    krita setu jo darasanu karihi| so binu shrama bhavasagara tarihi || rama bacana saba ke jiya bhae|
    munibara nija nija ashrama ae || girija raghupati kai yaha riti| santata karahim pranata para priti
    || ba~dha setu nila nala nagara| rama kripa~ jasu bhayu ujagara || burahim anahi borahim jei| bhe
    upala bohita sama tei || mahima yaha na jaladhi ki barani| pahana guna na kapinha ki karani || do
    shri raghubira pratapa te sindhu tare pashana| te matimanda je rama taji bhajahim jai prabhu ana ||
    || ba~dhi setu ati sudrirha banava| dekhi kripanidhi ke mana bhava || cali sena kachu barani na jai|
    garjahim markata bhata samudai || setubandha dhiga carhai raghurai| citava kripala sindhu bahutai
    || dekhana kahu~ prabhu karuna kanda| pragata bhe saba jalacara brinda || makara nakra nana jhasha
    byala| sata jojana tana parama bisala || aiseu eka tinhahi je khahim| ekanha kem dara tepi derahim
    || prabhuhi bilokahim tarahim na tare| mana harashita saba bhe sukhare || tinha ki ota na dekhia bari|
    magana bhe hari rupa nihari || cala kataku prabhu ayasu pai| ko kahi saka kapi dala bipulai || do
    setubandha bhi bhira ati kapi nabha pantha uraahim| apara jalacaranhi upara carhai carhai parahi jahim
    || || asa kautuka biloki dvau bhai| biha~si cale kripala raghurai || sena sahita utare raghubira|
    kahi na jai kapi juthapa bhira || sindhu para prabhu dera kinha| sakala kapinha kahu~ ayasu dinha
    || khahu jai phala mula suhae| sunata bhalu kapi jaha~ taha~ dhae || saba taru phare rama hita lagi|
    ritu aru kuritu kala gati tyagi || khahim madhura phala batapa halavahim| lanka sanmukha sikhara calavahim
    || jaha~ kahu~ phirata nisacara pavahim| gheri sakala bahu naca nacavahim || dasananhi kati nasika
    kana| kahi prabhu sujasu dehim taba jana || jinha kara nasa kana nipata| tinha ravanahi kahi saba
    bata || sunata shravana baridhi bandhana| dasa mukha boli utha akulana || do bandhyo bananidhi niranidhi
    jaladhi sindhu barisa| satya toyanidhi kampati udadhi payodhi nadisa || || nija bikalata bicari bahori|
    biha~si gayu graha kari bhaya bhori || mandodarim sunyo prabhu ayo| kautukahim pathodhi ba~dhayo ||
    kara gahi patihi bhavana nija ani| boli parama manohara bani || carana nai siru ancalu ropa| sunahu
    bacana piya parihari kopa || natha bayaru kije tahi som| budhi bala sakia jiti jahi som || tumhahi
    raghupatihi antara kaisa| khalu khadyota dinakarahi jaisa || atibala madhu kaitabha jehim mare| mahabira
    ditisuta sanghare || jehim bali ba~dhi sahajabhuja mara| soi avatareu harana mahi bhara || tasu birodha
    na kijia natha| kala karama jiva jakem hatha || do ramahi saupi janaki nai kamala pada matha| suta
    kahu~ raja samarpi bana jai bhajia raghunatha || || natha dinadayala raghurai| baghu sanamukha ge~
    na khai || cahia karana so saba kari bite| tumha sura asura caracara jite || santa kahahim asi niti
    dasanana| cauthempana jaihi nripa kanana || tasu bhajana kijia taha~ bharta| jo karta palaka samharta
    || soi raghuvira pranata anuragi| bhajahu natha mamata saba tyagi || munibara jatanu karahim jehi
    lagi| bhupa raju taji hohim biragi || soi kosaladhisa raghuraya| ayu karana tohi para daya || jaum
    piya manahu mora sikhavana| sujasu hoi tihu~ pura ati pavana || do asa kahi nayana nira bhari gahi
    pada kampita gata| natha bhajahu raghunathahi acala hoi ahivata || || taba ravana mayasuta uthai|
    kahai laga khala nija prabhutai || sunu tai priya britha bhaya mana| jaga jodha ko mohi samana ||
    baruna kubera pavana jama kala| bhuja bala jiteu~ sakala digapala || deva danuja nara saba basa morem|
    kavana hetu upaja bhaya torem || nana bidhi tehi kahesi bujhai| sabha~ bahori baitha so jai || mandodarim
    hridaya~ asa jana| kala basya upaja abhimana || sabha~ ai mantrinha temhi bujha| karaba kavana bidhi
    ripu saim jujha || kahahim saciva sunu nisicara naha| bara bara prabhu puchahu kaha || kahahu kavana
    bhaya karia bicara| nara kapi bhalu ahara hamara || do saba ke bacana shravana suni kaha prahasta
    kara jori| niti birodha na karia prabhu matrinnha mati ati thori || || kahahim saciva satha thakurasohati|
    natha na pura ava ehi bha~ti || baridhi naghi eka kapi ava| tasu carita mana mahu~ sabu gava || chudha
    na rahi tumhahi taba kahu| jarata nagaru kasa na dhari khahu || sunata nika agem dukha pava| sacivana
    asa mata prabhuhi sunava || jehim barisa ba~dhayu hela| utareu sena sameta subela || so bhanu manuja
    khaba hama bhai| bacana kahahim saba gala phulai || tata bacana mama sunu ati adara| jani mana gunahu
    mohi kari kadara || priya bani je sunahim je kahahim| aise nara nikaya jaga ahahim || bacana parama
    hita sunata kathore| sunahim je kahahim te nara prabhu thore || prathama basitha pathu sunu niti|
    sita dei karahu puni priti || do nari pai phiri jahim jaum tau na barhaaia rari| nahim ta sanmukha
    samara mahi tata karia hathi mari || || yaha mata jaum manahu prabhu mora| ubhaya prakara sujasu jaga
    tora || suta sana kaha dasakantha risai| asi mati satha kehim tohi sikhai || abahim te ura samsaya
    hoi| benumula suta bhayahu ghamoi || suni pitu gira parusha ati ghora| cala bhavana kahi bacana kathora
    || hita mata tohi na lagata kaisem| kala bibasa kahu~ bheshaja jaisem || sandhya samaya jani dasasisa|
    bhavana caleu nirakhata bhuja bisa || lanka sikhara upara agara| ati bicitra taha~ hoi akhara || baitha
    jai tehi mandira ravana| lage kinnara guna gana gavana || bajahim tala pakhauja bina| nritya karahim
    apachara prabina || do sunasira sata sarisa so santata kari bilasa| parama prabala ripu sisa para
    tadyapi soca na trasa || || iha~ subela saila raghubira| utare sena sahita ati bhira || sikhara eka
    utanga ati dekhi| parama ramya sama subhra biseshi || taha~ taru kisalaya sumana suhae| lachimana
    raci nija hatha dasae || ta para rucira mridula mrigachala| tehim asana asina kripala || prabhu krita
    sisa kapisa uchanga| bama dahina disi capa nishanga || duhu~ kara kamala sudharata bana| kaha lankesa
    mantra lagi kana || barabhagi angada hanumana| carana kamala capata bidhi nana || prabhu pachem lachimana
    birasana| kati nishanga kara bana sarasana || do ehi bidhi kripa rupa guna dhama ramu asina| dhanya
    te nara ehim dhyana je rahata sada layalina || || puraba disa biloki prabhu dekha udita mamyaka| kahata
    sabahi dekhahu sasihi mrigapati sarisa asanka || || puraba disi giriguha nivasi| parama pratapa teja
    bala rasi || matta naga tama kumbha bidari| sasi kesari gagana bana cari || bithure nabha mukutahala
    tara| nisi sundari kera singara || kaha prabhu sasi mahu~ mecakatai| kahahu kaha nija nija mati bhai
    || kaha suġaiva sunahu raghurai| sasi mahu~ pragata bhumi kai jha~i || mareu rahu sasihi kaha koi|
    ura maha~ pari syamata soi || kau kaha jaba bidhi rati mukha kinha| sara bhaga sasi kara hari linha
    || chidra so pragata indu ura mahim| tehi maga dekhia nabha parichahim || prabhu kaha garala bandhu
    sasi kera| ati priya nija ura dinha basera || bisha sanjuta kara nikara pasari| jarata birahavanta
    nara nari || do kaha hanumanta sunahu prabhu sasi tumhara priya dasa| tava murati bidhu ura basati
    soi syamata abhasa || || navanhaparayana || satava~ vishrama pavana tanaya ke bacana suni biha~se
    ramu sujana| dacchina disi avaloki prabhu bole kripa nidhana || || dekhu bibhishana dacchina asa|
    ghana ghammada damini bilasa || madhura madhura garaji ghana ghora| hoi brishti jani upala kathora
    || kahata bibhishana sunahu kripala| hoi na taraita na barida mala || lanka sikhara upara agara| taha~
    dasakanghara dekha akhara || chatra meghadambara sira dhari| soi janu jalada ghata ati kari || mandodari
    shravana tatanka| soi prabhu janu damini damanka || bajahim tala mridanga anupa| soi rava madhura
    sunahu surabhupa || prabhu musukana samujhi abhimana| capa carhaai bana sandhana || do chatra mukuta
    tatanka taba hate ekahim bana| sabakem dekhata mahi pare maramu na kou jana || || asa kautuka kari
    rama sara prabiseu ai nishanga| ravana sabha sasanka saba dekhi maha rasabhanga || || kampa na bhumi
    na maruta bisesha| astra sastra kachu nayana na dekha || socahim saba nija hridaya majhari| asaguna
    bhayu bhayankara bhari || dasamukha dekhi sabha bhaya pai| bihasi bacana kaha juguti banai || siru
    gire santata subha jahi| mukuta pare kasa asaguna tahi || sayana karahu nija nija griha jai| gavane
    bhavana sakala sira nai || mandodari soca ura baseu| jaba te shravanapura mahi khaseu || sajala nayana
    kaha juga kara jori| sunahu pranapati binati mori || kanta rama birodha pariharahu| jani manuja jani
    hatha mana dharahu || do bisvarupa raghubamsa mani karahu bacana bisvasu| loka kalpana beda kara anga
    anga prati jasu || || pada patala sisa aja dhama| apara loka a~ga a~ga bishrama || bhrikuti bilasa
    bhayankara kala| nayana divakara kaca ghana mala || jasu ghrana asvinikumara| nisi aru divasa nimesha
    apara || shravana disa dasa beda bakhani| maruta svasa nigama nija bani || adhara lobha jama dasana
    karala| maya hasa bahu digapala || anana anala ambupati jiha| utapati palana pralaya samiha || roma
    raji ashtadasa bhara| asthi saila sarita nasa jara || udara udadhi adhago jatana| jagamaya prabhu
    ka bahu kalapana || do ahankara siva buddhi aja mana sasi citta mahana| manuja basa sacaracara rupa
    rama bhagavana || ka || asa bicari sunu pranapati prabhu sana bayaru bihai| priti karahu raghubira
    pada mama ahivata na jai || kha || biha~sa nari bacana suni kana| aho moha mahima balavana || nari
    subhau satya saba kahahim| avaguna atha sada ura rahahim || sahasa anrita capalata maya| bhaya abibeka
    asauca adaya || ripu kara rupa sakala taim gava| ati bisala bhaya mohi sunava || so saba priya sahaja
    basa morem| samujhi para prasada aba torem || janiu~ priya tori caturai| ehi bidhi kahahu mori prabhutai
    || tava batakahi gurha mrigalocani| samujhata sukhada sunata bhaya mocani || mandodari mana mahu~
    asa thayu| piyahi kala basa matibhrama bhayu || do ehi bidhi karata binoda bahu prata pragata dasakandha|
    sahaja asanka lankapati sabha~ gayu mada andha || phulaha phari na beta jadapi sudha barashahim jalada|
    murukha hridaya~ na ceta jaum gura milahim biranci sama || || iha~ prata jage raghurai| pucha mata
    saba saciva bolai || kahahu begi ka karia upai| jamavanta kaha pada siru nai || sunu sarbagya sakala
    ura basi| budhi bala teja dharma guna rasi || mantra kahu~ nija mati anusara| duta pathaia balikumara
    || nika mantra saba ke mana mana| angada sana kaha kripanidhana || balitanaya budhi bala guna dhama|
    lanka jahu tata mama kama || bahuta bujhai tumhahi ka kahu~| parama catura maim janata ahu~ || kaju
    hamara tasu hita hoi| ripu sana karehu batakahi soi || so prabhu agya dhari sisa carana bandi angada
    utheu| soi guna sagara isa rama kripa ja para karahu || || svayam siddha saba kaja natha mohi adaru
    diyu| asa bicari jubaraja tana pulakita harashita hiyu || || bandi carana ura dhari prabhutai| angada
    caleu sabahi siru nai || prabhu pratapa ura sahaja asanka| rana ba~kura balisuta banka || pura paithata
    ravana kara beta| khelata raha so hoi gai bhainta || batahim bata karasha barhai ai| jugala atula
    bala puni tarunai || tehi angada kahu~ lata uthai| gahi pada patakeu bhumi bhava~i || nisicara nikara
    dekhi bhata bhari| jaha~ taha~ cale na sakahim pukari || eka eka sana maramu na kahahim| samujhi tasu
    badha cupa kari rahahim || bhayu kolahala nagara majhari| ava kapi lanka jehim jari || aba dhaum kaha
    karihi karatara| ati sabhita saba karahim bicara || binu puchem magu dehim dikhai| jehi biloka soi
    jai sukhai || do gayu sabha darabara taba sumiri rama pada kanja| simha thavani ita uta citava dhira
    bira bala punja || || turata nisacara eka pathava| samacara ravanahi janava || sunata biha~si bola
    dasasisa| anahu boli kaha~ kara kisa || ayasu pai duta bahu dhae| kapikunjarahi boli lai ae || angada
    dikha dasanana baimsem| sahita prana kajjalagiri jaisem || bhuja bitapa sira sringa samana| romavali
    lata janu nana || mukha nasika nayana aru kana| giri kandara khoha anumana || gayu sabha~ mana neku
    na mura| balitanaya atibala ba~kura || uthe sabhasada kapi kahu~ dekhi| ravana ura bha kraudha biseshi
    || do jatha matta gaja jutha mahu~ pancanana cali jai| rama pratapa sumiri mana baitha sabha~ siru
    nai || || kaha dasakantha kavana taim bandara| maim raghubira duta dasakandhara || mama janakahi tohi
    rahi mitai| tava hita karana ayu~ bhai || uttama kula pulasti kara nati| siva biranci pujehu bahu
    bha~ti || bara payahu kinhehu saba kaja| jitehu lokapala saba raja || nripa abhimana moha basa kimba|
    hari anihu sita jagadamba || aba subha kaha sunahu tumha mora| saba aparadha chamihi prabhu tora ||
    dasana gahahu trina kantha kuthari| parijana sahita sanga nija nari || sadara janakasuta kari agem|
    ehi bidhi calahu sakala bhaya tyagem || do pranatapala raghubamsamani trahi trahi aba mohi| arata
    gira sunata prabhu abhaya karaigo tohi || || re kapipota bolu sambhari| murha na janehi mohi surari
    || kahu nija nama janaka kara bhai| kehi natem maniai mitai || angada nama bali kara beta| tasom kabahu~
    bhi hi bheta || angada bacana sunata sakucana| raha bali banara maim jana || angada tahim bali kara
    balaka| upajehu bamsa anala kula ghalaka || garbha na gayahu byartha tumha jayahu| nija mukha tapasa
    duta kahayahu || aba kahu kusala bali kaha~ ahi| biha~si bacana taba angada kahi || dina dasa ge~
    bali pahim jai| bujhehu kusala sakha ura lai || rama birodha kusala jasi hoi| so saba tohi sunaihi
    soi || sunu satha bheda hoi mana takem| shriraghubira hridaya nahim jakem || do hama kula ghalaka
    satya tumha kula palaka dasasisa| andhu badhira na asa kahahim nayana kana tava bisa || | siva biranci
    sura muni samudai| cahata jasu carana sevakai || tasu duta hoi hama kula bora| aisihu~ mati ura bihara
    na tora || suni kathora bani kapi keri| kahata dasanana nayana tareri || khala tava kathina bacana
    saba sahu~| niti dharma maim janata ahu~ || kaha kapi dharmasilata tori| hamahu~ suni krita para triya
    cori || dekhi nayana duta rakhavari| burai na marahu dharma bratadhari || kana naka binu bhagini nihari|
    chama kinhi tumha dharma bicari || dharmasilata tava jaga jagi| pava darasu hamahu~ barabhagi || do
    jani jalpasi jara jantu kapi satha biloku mama bahu| lokapala bala bipula sasi grasana hetu saba rahu
    || || puni nabha sara mama kara nikara kamalanhi para kari basa| sobhata bhayu marala iva sambhu sahita
    kailasa || || tumhare kataka majha sunu angada| mo sana bhirihi kavana jodha bada || tava prabhu nari
    biraha~ balahina| anuja tasu dukha dukhi malina || tumha sugriva kuladruma dou| anuja hamara bhiru
    ati sou || jamavanta mantri ati burhaa| so ki hoi aba samararurhaa || silpi karma janahim nala nila|
    hai kapi eka maha balasila || ava prathama nagaru jemhim jara| sunata bacana kaha balikumara || satya
    bacana kahu nisicara naha| sa~cehu~ kisa kinha pura daha || ravana nagara alpa kapi dahi| suni asa
    bacana satya ko kahi || jo ati subhata sarahehu ravana| so sugriva kera laghu dhavana || cali bahuta
    so bira na hoi| pathava khabari lena hama soi || do satya nagaru kapi jareu binu prabhu ayasu pai|
    phiri na gayu sugriva pahim tehim bhaya raha lukai || || satya kahahi dasakantha saba mohi na suni
    kachu koha| kau na hamarem kataka asa to sana larata jo soha || || priti birodha samana sana karia
    niti asi ahi| jaum mrigapati badha meraukanhi bhala ki kahi kau tahi || || jadyapi laghuta rama kahu~
    tohi badhem bara dosha| tadapi kathina dasakantha sunu chatra jati kara rosha || || bakra ukti dhanu
    bacana sara hridaya daheu ripu kisa| pratiuttara sarasinha manahu~ karhata bhata dasasisa || || ha~si
    boleu dasamauli taba kapi kara bara guna eka| jo pratipali tasu hita kari upaya aneka || || dhanya
    kisa jo nija prabhu kaja| jaha~ taha~ naci parihari laja || naci kudi kari loga rijhai| pati hita
    kari dharma nipunai || angada svamibhakta tava jati| prabhu guna kasa na kahasi ehi bha~ti || maim
    guna gahaka parama sujana| tava katu ratani karu~ nahim kana || kaha kapi tava guna gahakatai| satya
    pavanasuta mohi sunai || bana bidhamsi suta badhi pura jara| tadapi na tehim kachu krita apakara ||
    soi bicari tava prakriti suhai| dasakandhara maim kinhi dhithai || dekheu~ ai jo kachu kapi bhasha|
    tumharem laja na rosha na makha || jaum asi mati pitu khae kisa| kahi asa bacana ha~sa dasasisa ||
    pitahi khai khateu~ puni tohi| abahim samujhi para kachu mohi || bali bimala jasa bhajana jani| hatu~
    na tohi adhama abhimani || kahu ravana ravana jaga kete| maim nija shravana sune sunu jete || balihi
    jitana eka gayu patala| rakheu ba~dhi sisunha hayasala || khelahim balaka marahim jai| daya lagi bali
    dinha choraai || eka bahori sahasabhuja dekha| dhai dhara jimi jantu bisesha || kautuka lagi bhavana
    lai ava| so pulasti muni jai choraava || do eka kahata mohi sakuca ati raha bali ki ka~kha| inha mahu~
    ravana taim kavana satya badahi taji makha || || sunu satha soi ravana balasila| haragiri jana jasu
    bhuja lila || jana umapati jasu surai| pujeu~ jehi sira sumana carhaai || sira saroja nija karanhi
    utari| pujeu~ amita bara tripurari || bhuja bikrama janahim digapala| satha ajahu~ jinha kem ura sala
    || janahim diggaja ura kathinai| jaba jaba bhiru~ jai bariai || jinha ke dasana karala na phute| ura
    lagata mulaka iva tute || jasu calata dolati imi dharani| carhata matta gaja jimi laghu tarani ||
    soi ravana jaga bidita pratapi| sunehi na shravana alika pralapi || do tehi ravana kaha~ laghu kahasi
    nara kara karasi bakhana| re kapi barbara kharba khala aba jana tava gyana || || suni angada sakopa
    kaha bani| bolu sa~bhari adhama abhimani || sahasabahu bhuja gahana apara| dahana anala sama jasu
    kuthara || jasu parasu sagara khara dhara| burae nripa aganita bahu bara || tasu garba jehi dekhata
    bhaga| so nara kyom dasasisa abhaga || rama manuja kasa re satha banga| dhanvi kamu nadi puni ganga
    || pasu suradhenu kalpataru rukha| anna dana aru rasa piyusha || bainateya khaga ahi sahasanana| cintamani
    puni upala dasanana || sunu matimanda loka baikuntha| labha ki raghupati bhagati akuntha || do sena
    sahita taba mana mathi bana ujari pura jari || kasa re satha hanumana kapi gayu jo tava suta mari
    || || sunu ravana parihari caturai| bhajasi na kripasindhu raghurai || jau khala bhesi rama kara drohi|
    brahma rudra saka rakhi na tohi || murha britha jani marasi gala| rama bayara asa hoihi hala || tava
    sira nikara kapinha ke agem| parihahim dharani rama sara lagem || te tava sira kanduka sama nana|
    khelahahim bhalu kisa caugana || jabahim samara kopahi raghunayaka| chutihahim ati karala bahu sayaka
    || taba ki calihi asa gala tumhara| asa bicari bhaju rama udara || sunata bacana ravana parajara|
    jarata mahanala janu ghrita para || do kumbhakarana asa bandhu mama suta prasiddha sakrari| mora parakrama
    nahim sunehi jiteu~ caracara jhari || || satha sakhamriga jori sahai| ba~dha sindhu ihi prabhutai
    || naghahim khaga aneka barisa| sura na hohim te sunu saba kisa || mama bhuja sagara bala jala pura|
    jaha~ burae bahu sura nara sura || bisa payodhi agadha apara| ko asa bira jo paihi para || digapalanha
    maim nira bharava| bhupa sujasa khala mohi sunava || jaum pai samara subhata tava natha| puni puni
    kahasi jasu guna gatha || tau basitha pathavata kehi kaja| ripu sana priti karata nahim laja || haragiri
    mathana nirakhu mama bahu| puni satha kapi nija prabhuhi sarahu || do sura kavana ravana sarisa svakara
    kati jehim sisa| hune anala ati harasha bahu bara sakhi gaurisa || || jarata bilokeu~ jabahim kapala|
    bidhi ke likhe anka nija bhala || nara kem kara apana badha ba~ci| haseu~ jani bidhi gira asa~ci ||
    sau mana samujhi trasa nahim morem| likha biranci jaratha mati bhorem || ana bira bala satha mama
    agem| puni puni kahasi laja pati tyage || kaha angada salajja jaga mahim| ravana tohi samana kau nahim
    || lajavanta tava sahaja subh | nija mukha nija guna kahasi na k || sira aru saila katha cita rahi|
    tate bara bisa taim kahi || so bhujabala rakheu ura ghali| jitehu sahasabahu bali bali || sunu matimanda
    dehi aba pura| katem sisa ki hoia sura || indrajali kahu kahia na bira| kati nija kara sakala sarira
    || do jarahim patanga moha basa bhara bahahim khara brinda| te nahim sura kahavahim samujhi dekhu
    matimanda || || aba jani batabarhaava khala karahi| sunu mama bacana mana pariharahi || dasamukha
    maim na basithim ayu~| asa bicari raghubisha pathayu~ || bara bara asa kahi kripala| nahim gajari
    jasu badhem srikala || mana mahu~ samujhi bacana prabhu kere| saheu~ kathora bacana satha tere ||
    nahim ta kari mukha bhanjana tora| lai jateu~ sitahi barajora || janeu~ tava bala adhama surari| sunem
    hari anihi paranari || taim nisicara pati garba bahuta| maim raghupati sevaka kara duta || jaum na
    rama apamanahi daru~| tohi dekhata asa kautuka karu~ || do tohi pataki mahi sena hati caupata kari
    tava gau~| tava jubatinha sameta satha janakasutahi lai jau~ || || jau asa karaum tadapi na baraai|
    muehi badhem nahim kachu manusai || kaula kamabasa kripina bimurhaa| ati daridra ajasi ati burhaa
    || sada rogabasa santata krodhi| bishnu bimukha shruti santa birodhi || tanu poshaka nindaka agha
    khani| jivana sava sama caudaha prani || asa bicari khala badhu~ na tohi| aba jani risa upajavasi
    mohi || suni sakopa kaha nisicara natha| adhara dasana dasi mijata hatha || re kapi adhama marana
    aba cahasi| chote badana bata barai kahasi || katu jalpasi jara kapi bala jakem| bala pratapa budhi
    teja na takem || do aguna amana jani tehi dinha pita banabasa| so dukha aru jubati biraha puni nisi
    dina mama trasa || || jinha ke bala kara garba tohi aise manuja aneka| khahim nisacara divasa nisi
    murha samujhu taji teka || || jaba tehim kinha rama kai ninda| krodhavanta ati bhayu kapinda || hari
    hara ninda suni jo kana| hoi papa goghata samana || katakatana kapikunjara bhari| duhu bhujadanda
    tamaki mahi mari || dolata dharani sabhasada khase| cale bhaji bhaya maruta grase || girata sa~bhari
    utha dasakandhara| bhutala pare mukuta ati sundara || kachu tehim lai nija siranhi sa~vare| kachu
    angada prabhu pasa pabare || avata mukuta dekhi kapi bhage| dinahim luka parana bidhi lage || ki ravana
    kari kopa calae| kulisa cari avata ati dhae || kaha prabhu ha~si jani hridaya~ derahu| luka na asani
    ketu nahim rahu || e kirita dasakandhara kere| avata balitanaya ke prere || do taraki pavanasuta kara
    gahe ani dhare prabhu pasa| kautuka dekhahim bhalu kapi dinakara sarisa prakasa || || uha~ sako'pi
    dasanana saba sana kahata risai| dharahu kapihi dhari marahu suni angada musukai || || ehi bidhi begi
    subhata saba dhavahu| khahu bhalu kapi jaha~ jaha~ pavahu || markatahina karahu mahi jai| jiata dharahu
    tapasa dvau bhai || puni sakopa boleu jubaraja| gala bajavata tohi na laja || maru gara kati nilaja
    kulaghati| bala biloki biharati nahim chati || re triya cora kumaraga gami| khala mala rasi mandamati
    kami || sanyapata jalpasi durbada| bhesi kalabasa khala manujada || yako phalu pavahigo agem| banara
    bhalu capetanhi lagem || ramu manuja bolata asi bani| girahim na tava rasana abhimani || girihahim
    rasana samsaya nahim| siranhi sameta samara mahi mahim || so so nara kyom dasakandha bali badhyo jehim
    eka sara| bisahu~ locana andha dhiga tava janma kujati jara || || taba sonita ki pyasa trishita rama
    sayaka nikara| taju~ tohi tehi trasa katu jalpaka nisicara adhama || || mai tava dasana toribe layaka|
    ayasu mohi na dinha raghunayaka || asi risa hoti dasu mukha toraum| lanka gahi samudra maha~ boraum
    || gulari phala samana tava lanka| basahu madhya tumha jantu asanka || maim banara phala khata na
    bara| ayasu dinha na rama udara || jugati sunata ravana musukai| murha sikhihi kaha~ bahuta jhuthai
    || bali na kabahu~ gala asa mara| mili tapasinha taim bhesi labara || sa~cehu~ maim labara bhuja biha|
    jaum na upariu~ tava dasa jiha || samujhi rama pratapa kapi kopa| sabha majha pana kari pada ropa
    || jaum mama carana sakasi satha tari| phirahim ramu sita maim hari || sunahu subhata saba kaha dasasisa|
    pada gahi dharani pacharahu kisa || indrajita adika balavana| harashi uthe jaha~ taha~ bhata nana
    || jhapatahim kari bala bipula upai| pada na tari baithahim siru nai || puni uthi jhapatahim sura
    arati| tari na kisa carana ehi bha~ti || purusha kujogi jimi uragari| moha bitapa nahim sakahim upari
    || do kotinha meghanada sama subhata uthe harashai| jhapatahim tarai na kapi carana puni baithahim
    sira nai || || bhumi na cha~data kapi carana dekhata ripu mada bhaga || koti bighna te santa kara
    mana jimi niti na tyaga || || kapi bala dekhi sakala hiya~ hare| utha apu kapi kem paracare || gahata
    carana kaha balikumara| mama pada gahem na tora ubara || gahasi na rama carana satha jai| sunata phira
    mana ati sakucai || bhayu tejahata shri saba gi| madhya divasa jimi sasi sohi || singhasana baitheu
    sira nai| manahu~ sampati sakala ga~vai || jagadatama pranapati rama| tasu bimukha kimi laha bishrama
    || uma rama ki bhrikuti bilasa| hoi bisva puni pavi nasa || trina te kulisa kulisa trina kari| tasu
    duta pana kahu kimi tari || puni kapi kahi niti bidhi nana| mana na tahi kalu niarana || ripu mada
    mathi prabhu sujasu sunayo| yaha kahi calyo bali nripa jayo || hataum na kheta khelai khelai| tohi
    abahim ka karaum baraai || prathamahim tasu tanaya kapi mara| so suni ravana bhayu dukhara || jatudhana
    angada pana dekhi| bhaya byakula saba bhe biseshi || do ripu bala dharashi harashi kapi balitanaya
    bala punja| pulaka sarira nayana jala gahe rama pada kanja || || sa~jha jani dasakandhara bhavana
    gayu bilakhai| mandodari ravanahi bahuri kaha samujhai || || kanta samujhi mana tajahu kumatihi| soha
    na samara tumhahi raghupatihi || ramanuja laghu rekha khacai| sau nahim naghehu asi manusai || piya
    tumha tahi jitaba sangrama| jake duta kera yaha kama || kautuka sindhu naghi tava lanka| ayu kapi
    kehari asanka || rakhavare hati bipina ujara| dekhata tohi accha tehim mara || jari sakala pura kinhesi
    chara| kaha~ raha bala garba tumhara || aba pati mrisha gala jani marahu| mora kaha kachu hridaya~
    bicarahu || pati raghupatihi nripati jani manahu| aga jaga natha atula bala janahu || bana pratapa
    jana marica| tasu kaha nahim manehi nica || janaka sabha~ aganita bhupala| rahe tumhu bala atula bisala
    || bhanji dhanusha janaki biahi| taba sangrama jitehu kina tahi || surapati suta jani bala thora|
    rakha jiata a~khi gahi phora || supanakha kai gati tumha dekhi| tadapi hridaya~ nahim laja bisheshi
    || do badhi biradha khara dushanahi li~la~ hatyo kabandha| bali eka sara marayo tehi janahu dasakandha
    || || jehim jalanatha ba~dhayu hela| utare prabhu dala sahita subela || karunika dinakara kula ketu|
    duta pathayu tava hita hetu || sabha majha jehim tava bala matha| kari barutha mahu~ mrigapati jatha
    || angada hanumata anucara jake| rana ba~kure bira ati ba~ke || tehi kaha~ piya puni puni nara kahahu|
    mudha mana mamata mada bahahu || ahaha kanta krita rama birodha| kala bibasa mana upaja na bodha ||
    kala danda gahi kahu na mara| hari dharma bala buddhi bicara || nikata kala jehi avata saim| tehi
    bhrama hoi tumharihi naim || do dui suta mare daheu pura ajahu~ pura piya dehu| kripasindhu raghunatha
    bhaji natha bimala jasu lehu || || nari bacana suni bisikha samana| sabha~ gayu uthi hota bihana ||
    baitha jai singhasana phuli| ati abhimana trasa saba bhuli || iha~ rama angadahi bolava| ai carana
    pankaja siru nava || ati adara sapipa baithari| bole biha~si kripala kharari || balitanaya kautuka
    ati mohi| tata satya kahu puchu~ tohi || | ravanu jatudhana kula tika| bhuja bala atula jasu jaga
    lika || tasu mukuta tumha cari calae| kahahu tata kavani bidhi pae || sunu sarbagya pranata sukhakari|
    mukuta na hohim bhupa guna cari || sama dana aru danda bibheda| nripa ura basahim natha kaha beda
    || niti dharma ke carana suhae| asa jiya~ jani natha pahim ae || do dharmahina prabhu pada bimukha
    kala bibasa dasasisa| tehi parihari guna ae sunahu kosaladhisa || || parama caturata shravana suni
    biha~se ramu udara| samacara puni saba kahe garha ke balikumara || || ripu ke samacara jaba pae| rama
    saciva saba nikata bolae || lanka ba~ke cari duara| kehi bidhi lagia karahu bicara || taba kapisa
    ricchesa bibhishana| sumiri hridaya~ dinakara kula bhushana || kari bicara tinha mantra drirhaava|
    cari ani kapi kataku banava || jathajoga senapati kinhe| juthapa sakala boli taba linhe || prabhu
    pratapa kahi saba samujhae| suni kapi singhanada kari dhae || harashita rama carana sira navahim|
    gahi giri sikhara bira saba dhavahim || garjahim tarjahim bhalu kapisa| jaya raghubira kosaladhisa
    || janata parama durga ati lanka| prabhu pratapa kapi cale asanka || ghatatopa kari cahu~ disi gheri|
    mukhahim nisana bajavahim bheri || do jayati rama jaya lachimana jaya kapisa sugriva| garjahim singhanada
    kapi bhalu maha bala simva || || lanka~ bhayu kolahala bhari| suna dasanana ati aha~kari || dekhahu
    banaranha keri dhithai| biha~si nisacara sena bolai || ae kisa kala ke prere| chudhavanta saba nisicara
    mere || asa kahi attahasa satha kinha| griha baithe ahara bidhi dinha || subhata sakala carihu~ disi
    jahu| dhari dhari bhalu kisa saba khahu || uma ravanahi asa abhimana| jimi tittibha khaga suta utana
    || cale nisacara ayasu magi| gahi kara bhindipala bara sa~gi || tomara mugdara parasu pracanda| sula
    kripana parigha girikhanda || jimi arunopala nikara nihari| dhavahim satha khaga mamsa ahari || conca
    bhanga dukha tinhahi na sujha| timi dhae manujada abujha || do nanayudha sara capa dhara jatudhana
    bala bira| kota ka~guranhi carhai ge koti koti ranadhira || || kota ka~guranhi sohahim kaise| meru
    ke sringani janu ghana baise || bajahim dhola nisana jujh | suni dhuni hoi bhatanhi mana c || bajahim
    bheri naphiri apara| suni kadara ura jahim darara || dekhinha jai kapinha ke thatta| ati bisala tanu
    bhalu subhatta || dhavahim ganahim na avaghata ghata| parbata phori karahim gahi bata || katakatahim
    kotinha bhata garjahim| dasana otha katahim ati tarjahim || uta ravana ita rama dohai| jayati jayati
    jaya pari larai || nisicara sikhara samuha dhahavahim| kudi dharahim kapi pheri calavahim || do dhari
    kudhara khanda pracanda karkata bhalu garha para darahim| jhapatahim carana gahi pataki mahi bhaji
    calata bahuri pacarahim || ati tarala taruna pratapa tarapahim tamaki garha carhai carhai ge| kapi
    bhalu carhai mandiranha jaha~ taha~ rama jasu gavata bhe || do eku eku nisicara gahi puni kapi cale
    parai| upara apu hetha bhata girahim dharani para ai || || rama pratapa prabala kapijutha| mardahim
    nisicara subhata barutha || carhae durga puni jaha~ taha~ banara| jaya raghubira pratapa divakara
    || cale nisacara nikara parai| prabala pavana jimi ghana samudai || hahakara bhayu pura bhari| rovahim
    balaka atura nari || saba mili dehim ravanahi gari| raja karata ehim mrityu ha~kari || nija dala bicala
    suni tehim kana| pheri subhata lankesa risana || jo rana bimukha suna maim kana| so maim hataba karala
    kripana || sarbasu khai bhoga kari nana| samara bhumi bhe ballabha prana || ugra bacana suni sakala
    derane| cale krodha kari subhata lajane || sanmukha marana bira kai sobha| taba tinha taja prana kara
    lobha || do bahu ayudha dhara subhata saba bhirahim pacari pacari| byakula kie bhalu kapi parigha
    trisulanhi mari || || bhaya atura kapi bhagana lage| jadyapi uma jitihahim age || kau kaha kaha~ angada
    hanumanta| kaha~ nala nila dubida balavanta || nija dala bikala suna hanumana| pacchima dvara raha
    balavana || meghanada taha~ kari larai| tuta na dvara parama kathinai || pavanatanaya mana bha ati
    krodha| garjeu prabala kala sama jodha || kudi lanka garha upara ava| gahi giri meghanada kahu~ dhava
    || bhanjeu ratha sarathi nipata| tahi hridaya mahu~ maresi lata || dusarem suta bikala tehi jana|
    syandana ghali turata griha ana || do angada suna pavanasuta garha para gayu akela| rana ba~kura balisuta
    taraki carhaeu kapi khela || || juddha biruddha kruddha dvau bandara| rama pratapa sumiri ura antara
    || ravana bhavana carhae dvau dhai| karahi kosaladhisa dohai || kalasa sahita gahi bhavanu dhahava|
    dekhi nisacarapati bhaya pava || nari brinda kara pitahim chati| aba dui kapi ae utapati || kapilila
    kari tinhahi deravahim| ramacandra kara sujasu sunavahim || puni kara gahi kancana ke khambha| kahenhi
    karia utapata arambha || garji pare ripu kataka majhari| lage mardai bhuja bala bhari || kahuhi lata
    capetanhi kehu| bhajahu na ramahi so phala lehu || do eka eka som mardahim tori calavahim munda| ravana
    agem parahim te janu phutahim dadhi kunda || || maha maha mukhia je pavahim| te pada gahi prabhu pasa
    calavahim || kahi bibhishanu tinha ke nama| dehim rama tinhahu nija dhama || khala manujada dvijamisha
    bhogi| pavahim gati jo jacata jogi || uma rama mriducita karunakara| bayara bhava sumirata mohi nisicara
    || dehim parama gati so jiya~ jani| asa kripala ko kahahu bhavani || asa prabhu suni na bhajahim bhrama
