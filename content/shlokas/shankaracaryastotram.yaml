id: shankaracaryastotram
category: stotram
name:
  english: shankaracaryastotram
  devanagari: शन्कराचार्यस्तोत्रम्
content:
  english: nasannasadasattathanacabhavedasadyatatat nasatvamapinorajonacatamonamayatatha | shrutauvitatavastuyatparamaho'dvayam
    kirtitam namami tamahangurupranatavatsalam shankaram || 1|| nayatsphurativa bhavetsphuranamapyaho
    yatratat shivoshamathajivakoshamitiva'pisoshantatha | cidekarasamadvayam vitatanirvikalpam shubham
    namami tamahangurupranatavatsalam shankaram || 2|| acintyabhavanashikapranatabhaktahrittapaha sadaivakarunalayabhavatiyasyabhaktihshiva
    | svatahprabhapanamayam sakalabhasakancadvayam namami tamahangurupranatavatsalam shankaram || 3||
    nayatrakaranancanokimapikaryamishattatha nayatrakathamapyahovikritimaccaduhkhaspadam | sadaivasusamahitam
    vigatakalmashancitsukham namami tamahangurupranatavatsalam shankaram || 4|| divanarajanitathakimapiyatrasuryadikam
    nayasyajananantathamritarapisvato nirmalam | svapurnanijarupakam sakalamangalanamparam namami tamahangurupranatavatsalam
    shankaram || 5|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavata shridharasvamina viracitam
    shrimadshankaracaryastotram sampurnam || racanasthalamah kaॅhi udyanavana cikkamangaḻura racanakalah
    kartika paurnima shake 1865
  devanagari: नसन्नसदसत्तथानचभवेदसद्यततत् नसत्वमपिनोरजोनचतमोनमायातथा । श्रुतौविततवस्तुयत्परमहोऽद्वयं कीर्तितम्
    नमामि तमहङ्गुरुप्रणतवत्सलं शङ्करम् ॥ १॥ नयत्स्फुरतिवा भवेत्स्फुरणमप्यहो यत्रतत् शिवोषमथजीवकोषमितिवाऽपिसोषन्तथा
    । चिदेकरसमद्वयं विततनिर्विकल्पं शुभम् नमामि तमहङ्गुरुप्रणतवत्सलं शङ्करम् ॥ २॥ अचिन्त्यभवनाशिकाप्रणतभक्तहृत्तापहा
    सदैवकरुणालयाभवतियस्यभक्तिःशिवा । स्वतःप्रभपनामयं सकलभासकञ्चाद्वयम् नमामि तमहङ्गुरुप्रणतवत्सलं शङ्करम्
    ॥ ३॥ नयत्रकरणञ्चनोकिमपिकर्यमिषत्तथा नयत्रकथमप्यहोविकृतिमच्चदुःखास्पदम् । सदैवसुसमाहितं विगतकल्मषञ्चित्सुखम्
    नमामि तमहङ्गुरुप्रणतवत्सलं शङ्करम् ॥ ४॥ दिवानरजनीतथाकिमपियत्रसुर्यादिकम् नयस्यजननन्तथामृतरपिस्वतो
    निर्मलम् । स्वपूर्णनिजरूपकं सकलमङ्गलानाम्परम् नमामि तमहङ्गुरुप्रणतवत्सलं शङ्करम् ॥ ५॥ ॥ इति श्रीमत्
    परमहंसपरिव्राजकाचार्य सद्गुरु भगवता श्रीधरस्वामिना विरचितं श्रीमद्शङ्कराचार्यस्तोत्रं सम्पूर्णम् ॥
    रचनास्थलमः काॅही उद्यानवन चिक्कमङ्गळूर रचनाकालः कार्तिक पौर्णिमा शके १८६५
