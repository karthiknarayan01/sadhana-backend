id: sri-rudram-laghunyasam
category: stotram
name:
  english: Sri Rudram Laghunyasam
content:
  english: om athatmanagm shivatmanam shri rudrarupa ndhyayet || shuddhasphatika sankasha mpanca vaktrakam
    | gangadhara ndashabhujam sarvabharana bhushitam || nilagrivam shashankanka nnaga yajnopa vitinam
    | vyaghra carmottariya nca varenyamabhaya pradam || kamandal ndharinam shulapaninam | jvalanta mudyota
    dharinam || vrisha skandha samarudham uma dehardha dharinam | amritenaplutam shanta ndivyabhoga samanvitam
    || digdevata samayuktam surasura namaskritam | nitya mavyayam | sarva vyapina vai~ vishvarupinam |
    eva ktato yajanamarabhet || athato rudra snanarcanabhisheka vidhim khyasyamah | adita eva tirthe snatva
    udetya shucih prayato brahmacari shuklavasa devabhimukha ssthapayet || prajanane brahma tishthatu
    | padayorvishnustishthatu | hastayor harastishthatu | bahvorindrastishthatu | jathare 'agnistishthatu
    | hridaye shivastishthatu | kanthe vasavastishthantu | vaktre sarasvati tishthatu | nasikayo rvayustishthatu
    | nayanayo shcandradityau tishthetam | karnayorashvinau tishthetam | lalate rudrastishthantu | murdhnyadityastishthantu
    | shirasi mahadevastishthatu | shikhayam va~madevastishthatu | prishthe pinaki tishthatu | purata
    shshuli tishthatu | par shshivashankarau tishthetam | sarvato vayustishthatu | tato bahi parivritastishthatu
    | sarveshvangeshu sarva devata yathasthana ntishthantu | magm rakshantu | agnirme vaci shritah | vaghridaye
    | hridaya mbrahmani | vayurme prane shritah | prano hridaye | hridaya mbrahmani | suryo me cakshushi
    shritah | cakshur mbrahmani | candrama me manasi shritah | mano hridaye | hridaya mbrahmani | disho
    me shrotre shritah | shrotragm hridaye | hridaya mbrahmani | apome retasi shritah | reto hridaye |
    hridaya mbrahmani | prithivi me sharire shrita | shariragm hridaye | hridaya mbrahmani | oshadhi vanaspatayo
    me lomasu shritah | lomani hridaye | hridaya mbrahmani | indro me bale shritah | balagm hridaye |
    hridaya mbrahmani | parjanyo me murdni shritah | murdha hridaye | hridaya mbrahmani | ishano me manyau
    shritah | manyur mbrahmani | atma ma atmani shritah | atma hridaye | hridaya mbrahmani | punarma atma
    punarayu raga t | punah pranah punarakutamaga t | vaishvanaro rashmibhirvavridhanah | antastishthatvamritasya
    gopah || asya shri rudradhyaya prashna mahamantrasya shana murti svarupo yo 'savadityah paramapurusha
    ssa esha rudro devata | nama shshivayeti bijam | shivatarayeti shaktih | mahadevayeti kilakam | shri
    samba sadashiva prasada siddhyarthe jape viniyogah || om agnihotratmane angushthabhya shapurna masatmane
    tarjanibhya nnamah | caturmasyatmane madhyamabhya nnamah | nirudha pashubandhatmane anamikabhya nnamah
    | jyotishtomatmane kanishthikabhya nnamah | sarvakratvatmane karatala karaprishthabhya nnamah || agnihotratmane
    hridayaya namah | dar shapurna masatmane shirase svaha | caturmasyatmane shikhayai vashat | nirudha
    pashubandhatmane kavacaya hum | jyotishtomatmane netratrayaya vaushat | sarvakratvatmane astrayaphat
    | bhurbhuvassuvaromiti digbandhah || dhyanam apatala vantamritaih | astokapluta ccivam || brahmanda
    vyaptadeha bhasita himaruca bhasamana bhujangaih kanthe kalah kapardah kalita shcanda kodanda hastah
    | tryaksha rudrakshamalah prakatitavibhava shshambhava murtibhedah rudra prakatitavibhava nah prayaccantu
    saukhyam || o ntva ganapatigm havamahe kavi nkavinamupamashravastamam | jyeshtharaja mbrahmanaspata
    a nah shrinvannutibhissida sadanam || mahaganapataye namah || sha nca me mayashca me priya 'nukamashca
    me kamashca me saumanasashca me bhadra nca me shreyashca me vasyashca me yashashca me bhagashca me
    dravina nca me yanta ca me dharta ca me kshemashca me dhritishca me vishva nca me mahashca me sam
    vi~cca me jnatra nca me sushca me prasushca me sira nca me layashca ma rita 'namayacca me jivatushca
    me dirghayutva nca me susha ca me sudina
  devanagari: ॐ अथात्मानग्ं शिवात्मानं श्री रुद्ररूप न्ध्यायेत् ॥ शुद्धस्फटिक सङ्काश म्पञ्च वक्त्रकम्
    । गङ्गाधर न्दशभुजं सर्वाभरण भूषितम् ॥ नीलग्रीवं शशाङ्काङ्क न्नाग यज्ञोप वीतिनम् । व्याघ्र चर्मोत्तरीय
    ञ्च वरेण्यमभय प्रदम् ॥ कमण्डल् न्धारिणं शूलपाणिनम् । ज्वलन्त मुद्योत धारिणम् ॥ वृष स्कन्ध समारूढं
    उमा देहार्ध धारिणम् । अमृतेनाप्लुतं शान्त न्दिव्यभोग समन्वितम् ॥ दिग्देवता समायुक्तं सुरासुर नमस्कृतम्
    । नित्य मव्ययम् । सर्व व्यापिन वैँ विश्वरूपिणम् । एव क्ततो यजनमारभेत् ॥ अथातो रुद्र स्नानार्चनाभिषेक
    विधिं ख्यास्यामः । आदित एव तीर्थे स्नात्वा उदेत्य शुचिः प्रयतो ब्रह्मचारी शुक्लवासा देवाभिमुख स्स्थापयेत्
    ॥ प्रजनने ब्रह्मा तिष्ठतु । पादयोर्विष्णुस्तिष्ठतु । हस्तयोर् हरस्तिष्ठतु । बाह्वोरिन्द्रस्तिष्ठतु
    । जठरे ऽअग्निस्तिष्ठतु । हृद॑ये शिवस्तिष्ठतु । कण्ठे वसवस्तिष्ठन्तु । वक्त्रे सरस्वती तिष्ठतु । नासिकयो
    र्वायुस्तिष्ठतु । नयनयो श्चन्द्रादित्यौ तिष्ठेताम् । कर्णयोरश्विनौ तिष्ठेताम् । ललाटे रुद्रास्तिष्ठन्तु
    । मूर्ध्न्यादित्यास्तिष्ठन्तु । शिरसि महादेवस्तिष्ठतु । शिखायां वाँमदेवास्तिष्ठतु । पृष्ठे पिनाकी
    तिष्ठतु । पुरत श्शूली तिष्ठतु । पार् श्शिवाशङ्करौ तिष्ठेताम् । सर्वतो वायुस्तिष्ठतु । ततो बहि परिवृतस्तिष्ठतु
    । सर्वेष्वङ्गेषु सर्वा देवता यथास्थान न्तिष्ठन्तु । माग्ं रक्षन्तु । अ॒ग्निर्मे॑ वा॒चि श्रि॒तः । वाघृद॑ये
    । हृद॑य॒ म्ब्रह्म॑णि । वा॒युर्मे प्रा॒णे श्रि॒तः । प्रा॒णो हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । सूर्यो॑ मे॒
    चक्षुषि श्रि॒तः । चक्षु॒र् म्ब्रह्म॑णि । च॒न्द्रमा॑ मे॒ मन॑सि श्रि॒तः । मनो॒ हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि
    । दिशो॑ मे॒ श्रोत्रे श्रि॒ताः । श्रोत्र॒ग्ं॒ हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । आपोमे॒ रेतसि श्रि॒ताः ।
    रेतो हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । पृ॒थि॒वी मे॒ शरी॑रे श्रि॒ता । शरी॑र॒ग्ं॒ हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि
    । ओ॒ष॒धि॒ व॒न॒स्पतयो॑ मे॒ लोम॑सु श्रि॒ताः । लोमा॑नि॒ हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । इन्द्रो॑ मे॒ बले
    श्रि॒तः । बल॒ग्ं॒ हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । प॒र्जन्यो॑ मे॒ मू॒र्द्नि श्रि॒तः । मू॒र्धा हृद॑ये
    । हृद॑य॒ म्ब्रह्म॑णि । ईशा॑नो मे॒ म॒न्यौ श्रि॒तः । म॒न्युर् म्ब्रह्म॑णि । आ॒त्मा म॑ आ॒त्मनि॑ श्रि॒तः
    । आ॒त्मा हृद॑ये । हृद॑य॒ म्ब्रह्म॑णि । पुन॑र्म आ॒त्मा पुन॒रायु॒ रागा त् । पुनः॑ प्रा॒णः पुन॒राकू॑त॒मागा
    त् । वै॒श्वा॒न॒रो र॒श्मिभि॑र्वावृधा॒नः । अ॒न्तस्ति॑ष्ठ॒त्वमृत॑स्य गो॒पाः ॥ अस्य श्री रुद्राध्याय प्रश्न
    महामन्त्रस्य षण मूर्ति स्वरूपो यो ऽसावादित्यः परमपुरुष स्स एष रुद्रो देवता । नम श्शिवायेति बीजम् ।
    शिवतरायेति शक्तिः । महादेवायेति कीलकम् । श्री साम्ब सदाशिव प्रसाद सिद्ध्यर्थे जपे विनियोगः ॥ ॐ अग्निहोत्रात्मने
    अङ्गुष्ठाभ्या शपूर्ण मासात्मने तर्जनीभ्या न्नमः । चातुर्मास्यात्मने मध्यमाभ्या न्नमः । निरूढ पशुबन्धात्मने
    अनामिकाभ्या न्नमः । ज्योतिष्टोमात्मने कनिष्ठिकाभ्या न्नमः । सर्वक्रत्वात्मने करतल करपृष्ठाभ्या न्नमः
    ॥ अग्निहोत्रात्मने हृदयाय नमः । दर् शपूर्ण मासात्मने शिरसे स्वाहा । चातुर्मास्यात्मने शिखायै वषट्
    । निरूढ पशुबन्धात्मने कवचाय हुम् । ज्योतिष्टोमात्मने नेत्रत्रयाय वौषट् । सर्वक्रत्वात्मने अस्त्रायफट्
    । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानं आपाताल वान्तामृतैः । अस्तोकाप्लुत च्चिवम् ॥ ब्रह्माण्ड व्याप्तदेहा
    भसित हिमरुचा भासमाना भुजङ्गैः कण्ठे कालाः कपर्दाः कलित श्चण्ड कोदण्ड हस्ताः । त्र्यक्षा रुद्राक्षमालाः
    प्रकटितविभवा श्शाम्भवा मूर्तिभेदाः रुद्रा प्रकटितविभवा नः प्रयच्चन्तु सौख्यम् ॥ ओ न्त्वा ग॒णप॑तिग्ं
    हवामहे क॒वि ङ्क॑वी॒नामु॑प॒मश्र॑वस्तमम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒
    साद॑नम् ॥ महागणपतये॒ नमः ॥ श ञ्च॑ मे॒ मय॑श्च मे प्रि॒य ऽनुका॒मश्च॑ मे॒ काम॑श्च मे सौमनस॒श्च॑ मे भ॒द्र
    ञ्च॑ मे॒ श्रेय॑श्च मे॒ वस्य॑श्च मे॒ यश॑श्च मे॒ भग॑श्च मे॒ द्रवि॑ण ञ्च मे य॒न्ता च॑ मे ध॒र्ता च॑ मे॒
    क्षेम॑श्च मे॒ धृति॑श्च मे॒ विश्व॑ ञ्च मे॒ मह॑श्च मे सं॒ विँच्च॑ मे॒ ज्ञात्र॑ ञ्च मे॒ सूश्च॑ मे प्र॒सूश्च॑
    मे॒ सीर॑ ञ्च मे ल॒यश्च॑ म ऋ॒त ऽना॑मयच्च मे जी॒वातु॑श्च मे दीर्घायु॒त्व ञ्च मे सू॒षा च॑ मे॒ सु॒दिन॑
