id: bhaktamara
category: stotram
name:
  english: bhaktamara
  devanagari: भक्तामर
content:
  english: nakracakram ko va taritumalamambunidhim bhujabhyam || 4|| so'ham tathapi tava bhakti vashanmunisha
    kartum stavam vigatashaktirapi pravrittah | pritya''tmaviryamavicarya mrigo mrigendram nabhyeti kim
    nijashishoh paripalanartham || 5|| alpashrutam shrutavatam parihasadham tvadbhaktireva mukharikurute
    balanmam | yatkokilah kila madhau madhuram virauti taccamracaru
  devanagari: नक्रचक्रं को वा तरीतुमलमम्बुनिधिं भुजाभ्याम् ॥ ४॥ सोऽहं तथापि तव भक्ति वशान्मुनीश कर्तुं
    स्तवं विगतशक्तिरपि प्रवृत्तः । प्रीत्यऽऽत्मवीर्यमविचार्य मृगो मृगेन्द्रं नाभ्येति किं निजशिशोः परिपालनार्थम्
    ॥ ५॥ अल्पश्रुतं श्रुतवतां परिहासधाम् त्वद्भक्तिरेव मुखरीकुरुते बलान्माम् । यत्कोकिलः किल मधौ मधुरं
    विरौति तच्चाम्रचारु
meaning: {}
