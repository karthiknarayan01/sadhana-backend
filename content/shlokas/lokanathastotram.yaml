id: lokanathastotram
category: stotram
name:
  english: lokanathastotram
  devanagari: लोकनाथस्तोत्रम्
content:
  english: lokanathastotram kalpadike bhavasi ko hi mamagabhava sarvasvasara karunamaya vishvamurte |
    karyadike pranamatiti samantakam tvam shrilokanatha tava padayugam name'ham || 1|| akrishnakena rajasa
    vinivartamanashcayasi saumya sakalah prativasare ca | hemasvaruparathakena samujjvalena shrilokanatha
    tava padayugam name'ham || 2|| brahma tvameva hi sa viprakulaprasiddho vishnushca vaishnavamate varadharmaketuh
    | sarvajnako'si vimate prabhavo'vyayashca shrilokanatha tava padayugam name'ham || 3|| bauddhanvaye
    bhavasi vajrakasuryarupo yogeshvaro hi shubhayogakamargakeshu | gangadharo bhavabhayasya vinashakari
    shrilokanatha tava padayugam name'ham || 4|| karunyabhavahridayah sahajah sarocirvicchinnakalmashacayo
    gunasagarashca | cintamanistvamasi lokaguruh kripesha shrilokanatha tava padayugam name'ham || 5||
    bandhukavarna bahurupa vishalanetra sarvaprasutikritanishkritikah sudanta | tvam padmapani vimalottama
    mitrarupah shrilokanatha tava padayugam name'ham || 6|| tava bahulacaritram kah samartho'sti vaktum
    tadapi mukharabhavaih stuyase tvam mayatra | yadapi padamashuddham sarvametat kshamasva stutiriti
    kusumasrak bhaktimatrarcanam syat || 7|| iti shrimadaryavalokiteshvarabhattarakasya stotram sampurnam
    ||
  devanagari: लोकनाथस्तोत्रम् कल्पादिके भवसि को हि ममागभाव सर्वस्वसार करुणामय विश्वमूर्ते । कार्यादिके
    प्रणमतीति समन्तकं त्वां श्रीलोकनाथ तव पादयुगं नमेऽहम् ॥ १॥ आकृष्णकेन रजसा विनिवर्तमानश्चायासि सौम्य
    सकलः प्रतिवासरे च । हेमस्वरूपरथकेन समुज्ज्वलेन श्रीलोकनाथ तव पादयुगं नमेऽहम् ॥ २॥ ब्रह्मा त्वमेव हि
    स विप्रकुलप्रसिद्धो विष्णुश्च वैष्णवमते वरधर्मकेतुः । सर्वज्ञकोऽसि विमते प्रभवोऽव्ययश्च श्रीलोकनाथ
    तव पादयुगं नमेऽहम् ॥ ३॥ बौद्धान्वये भवसि वज्रकसूर्यरूपो योगेश्वरो हि शुभयोगकमार्गकेषु । गङ्गाधरो भवभयस्य
    विनाशकारि श्रीलोकनाथ तव पादयुगं नमेऽहम् ॥ ४॥ कारुण्यभावहृदयः सहजः सरोचिर्विच्छिन्नकल्मषचयो गुणसागरश्च
    । चिन्तामणिस्त्वमसि लोकगुरुः कृपेश श्रीलोकनाथ तव पादयुगं नमेऽहम् ॥ ५॥ बन्धूकवर्ण बहुरूप विशालनेत्र
    सर्वप्रसूतिकृतनिष्कृतिकः सुदन्त । त्वं पद्मपाणि विमलोत्तम मित्ररूपः श्रीलोकनाथ तव पादयुगं नमेऽहम्
    ॥ ६॥ तव बहुलचरित्रं कः समर्थोऽस्ति वक्तुं तदपि मुखरभावैः स्तूयसे त्वं मयात्र । यदपि पदमशुद्धं सर्वमेतत्
    क्षमस्व स्तुतिरिति कुसुमस्रक् भक्तिमात्रार्चनं स्यात् ॥ ७॥ इति श्रीमदार्यावलोकितेश्वरभट्टारकस्य स्तोत्रं
    सम्पूर्णम् ॥
