id: sukra-ashtottara-sata-namavali
category: stotram
name:
  english: Sukra Ashtottara Sata Namavali
  devanagari: शुक्राष्टोत्तरशतनामावलिः
content:
  english: 'shukra bija mantra - om dra~ drim draum sah shukraya namah | om shukraya namah | om shucaye
    namah | om shubhagunaya namah | om shubhadaya namah | om shubhalakshanaya namah | om shobhanakshaya
    namah | om shubhravahaya namah | om shuddhasphatikabhasvaraya namah | om dinartiharakaya namah | om
    daityagurave namah | 10 om devabhivanditaya namah | om kavyasaktaya namah | om kamapalaya namah |
    om kavaye namah | om kalyanadayakaya namah | om bhadramurtaye namah | om bhadragunaya namah | om bhargavaya
    namah | om bhaktapalanaya namah | om bhogadaya namah | 20 om bhuvanadhyakshaya namah | om bhuktimuktiphalapradaya
    namah | om carushilaya namah | om carurupaya namah | om carucandranibhananaya namah | om nidhaye namah
    | om nikhilashastrajnaya namah | om nitividyadhuramdharaya namah | om sarvalakshanasampannaya namah
    | om sarvapadgunavarjitaya namah | 30 om samanadhikanirmuktaya namah | om sakalagamaparagaya namah
    | om bhrigave namah | om bhogakaraya namah | om bhumisurapalanatatparaya namah | om manasvine namah
    | om manadaya namah | om manyaya namah | om mayatitaya namah | om mahayashase namah | 40 om baliprasannaya
    namah | om abhayadaya namah | om baline namah | om satyaparakramaya namah | om bhavapashaparityagaya
    namah | om balibandhavimocakaya namah | om ghanashayaya namah | om ghanadhyakshaya namah | om kambugrivaya
    namah | om kaladharaya namah | 50 om karunyarasasampurnaya namah | om kalyanagunavardhanaya namah
    | om shvetambaraya namah | om shvetavapushe namah | om caturbhujasamanvitaya namah | om akshamaladharaya
    namah | om acintyaya namah | om akshinagunabhasuraya namah | om nakshatraganasamcaraya namah | om
    nayadaya namah | 60 om nitimargadaya namah | om varshapradaya namah | om hrishikeshaya namah | om
    kleshanashakaraya namah | om kavaye namah | om cintitarthapradaya namah | om shantamataye namah |
    om cittasamadhikrite namah | om adhivyadhiharaya namah | om bhurivikramaya namah | 70 om punyadayakaya
    namah | om puranapurushaya namah | om pujyaya namah | om puruhutadisannutaya namah | om ajeyaya namah
    | om vijitarataye namah | om vividhabharanojjvalaya namah | om kundapushpapratikashaya namah | om
    mandahasaya namah | om mahamataye namah | 80 om muktaphalasamanabhaya namah | om muktidaya namah |
    om munisannutaya namah | om ratnasimhasanarudhaya namah | om rathasthaya namah | om rajataprabhaya
    namah | om suryapragdeshasamcaraya namah | om surashatrusuhride namah | om kavaye namah | om tulavrishabharashishaya
    namah | 90 om durdharaya namah | om dharmapalakaya namah | om bhagyadaya namah | om bhavyacaritraya
    namah | om bhavapashavimocakaya namah | om gaudadesheshvaraya namah | om goptre namah | om gunine
    namah | om gunavibhushanaya namah | om jyeshthanakshatrasambhutaya namah | 100 om jyeshthaya namah
    | om shreshthaya namah | om shucismitaya namah | om apavargapradaya namah | om anantaya namah | om
    santanaphaladayakaya namah | om sarvaishvaryapradaya namah | om sarvagirvanaganasannutaya namah |
    || iti shukra ashtottarashatanamavalih sampurnam || Propitiation of Venus (Friday) chhaṟitẏ: donate
    silk clothes, dairy cream, yogurt, scented oils, sugar, cov dung, or camphor to a pur young voman
    on Friday evening| Fashtinġ: On Friday, especially during Venus transits and major or minor Venus
    periods| especially during major or minor Venus periods: ṟEshuḻt: the planetary diety shukra is propitiated
    increasing rices and conjugal bliss| transliteration and information by dr| sh| khalyanaraman kalyan97@yahuॅom'
  devanagari: 'शुक्र बीज मन्त्र - ॐ द्राँ द्रीं द्रौं सः शुक्राय नमः । ॐ शुक्राय नमः । ॐ शुचये नमः । ॐ
    शुभगुणाय नमः । ॐ शुभदाय नमः । ॐ शुभलक्षणाय नमः । ॐ शोभनाक्षाय नमः । ॐ शुभ्रवाहाय नमः । ॐ शुद्धस्फटिकभास्वराय
    नमः । ॐ दीनार्तिहरकाय नमः । ॐ दैत्यगुरवे नमः । १० ॐ देवाभिवन्दिताय नमः । ॐ काव्यासक्ताय नमः । ॐ कामपालाय
    नमः । ॐ कवये नमः । ॐ कल्याणदायकाय नमः । ॐ भद्रमूर्तये नमः । ॐ भद्रगुणाय नमः । ॐ भार्गवाय नमः । ॐ भक्तपालनाय
    नमः । ॐ भोगदाय नमः । २० ॐ भुवनाध्यक्षाय नमः । ॐ भुक्तिमुक्तिफलप्रदाय नमः । ॐ चारुशीलाय नमः । ॐ चारुरूपाय
    नमः । ॐ चारुचन्द्रनिभाननाय नमः । ॐ निधये नमः । ॐ निखिलशास्त्रज्ञाय नमः । ॐ नीतिविद्याधुरंधराय नमः
    । ॐ सर्वलक्षणसम्पन्नाय नमः । ॐ सर्वापद्गुणवर्जिताय नमः । ३० ॐ समानाधिकनिर्मुक्ताय नमः । ॐ सकलागमपारगाय
    नमः । ॐ भृगवे नमः । ॐ भोगकराय नमः । ॐ भूमिसुरपालनतत्पराय नमः । ॐ मनस्विने नमः । ॐ मानदाय नमः । ॐ मान्याय
    नमः । ॐ मायातीताय नमः । ॐ महायशसे नमः । ४० ॐ बलिप्रसन्नाय नमः । ॐ अभयदाय नमः । ॐ बलिने नमः । ॐ सत्यपराक्रमाय
    नमः । ॐ भवपाशपरित्यागाय नमः । ॐ बलिबन्धविमोचकाय नमः । ॐ घनाशयाय नमः । ॐ घनाध्यक्षाय नमः । ॐ कम्बुग्रीवाय
    नमः । ॐ कलाधराय नमः । ५० ॐ कारुण्यरससम्पूर्णाय नमः । ॐ कल्याणगुणवर्धनाय नमः । ॐ श्वेताम्बराय नमः ।
    ॐ श्वेतवपुषे नमः । ॐ चतुर्भुजसमन्विताय नमः । ॐ अक्षमालाधराय नमः । ॐ अचिन्त्याय नमः । ॐ अक्षीणगुणभासुराय
    नमः । ॐ नक्षत्रगणसंचाराय नमः । ॐ नयदाय नमः । ६० ॐ नीतिमार्गदाय नमः । ॐ वर्षप्रदाय नमः । ॐ हृषीकेशाय
    नमः । ॐ क्लेशनाशकराय नमः । ॐ कवये नमः । ॐ चिन्तितार्थप्रदाय नमः । ॐ शान्तमतये नमः । ॐ चित्तसमाधिकृते
    नमः । ॐ आधिव्याधिहराय नमः । ॐ भूरिविक्रमाय नमः । ७० ॐ पुण्यदायकाय नमः । ॐ पुराणपुरुषाय नमः । ॐ पूज्याय
    नमः । ॐ पुरुहूतादिसन्नुताय नमः । ॐ अजेयाय नमः । ॐ विजितारातये नमः । ॐ विविधाभरणोज्ज्वलाय नमः । ॐ कुन्दपुष्पप्रतीकाशाय
    नमः । ॐ मन्दहासाय नमः । ॐ महामतये नमः । ८० ॐ मुक्ताफलसमानाभाय नमः । ॐ मुक्तिदाय नमः । ॐ मुनिसन्नुताय
    नमः । ॐ रत्नसिंहासनारूढाय नमः । ॐ रथस्थाय नमः । ॐ रजतप्रभाय नमः । ॐ सूर्यप्राग्देशसंचाराय नमः । ॐ
    सुरशत्रुसुहृदे नमः । ॐ कवये नमः । ॐ तुलावृषभराशीशाय नमः । ९० ॐ दुर्धराय नमः । ॐ धर्मपालकाय नमः । ॐ
    भाग्यदाय नमः । ॐ भव्यचारित्राय नमः । ॐ भवपाशविमोचकाय नमः । ॐ गौडदेशेश्वराय नमः । ॐ गोप्त्रे नमः ।
    ॐ गुणिने नमः । ॐ गुणविभूषणाय नमः । ॐ ज्येष्ठानक्षत्रसंभूताय नमः । १०० ॐ ज्येष्ठाय नमः । ॐ श्रेष्ठाय
    नमः । ॐ शुचिस्मिताय नमः । ॐ अपवर्गप्रदाय नमः । ॐ अनन्ताय नमः । ॐ सन्तानफलदायकाय नमः । ॐ सर्वैश्वर्यप्रदाय
    नमः । ॐ सर्वगीर्वाणगणसन्नुताय नमः । ॥ इति शुक्र अष्टोत्तरशतनामावलिः सम्पूर्णम् ॥ Pरोपितिअतिओन् ओफ़्
    Vएनुस् (Fरिदय्) छ्ःआऱीट्य़्: डोनते सिल्क् च्लोथेस्, दैर्य् च्रेअम्, योगुर्त्, स्चेन्तेद् ओइल्स्, सुगर्,
    चोव् दुन्ग्, ओर् चम्फोर् तो अ पूर् योउन्ग् वोमन् ओन् Fरिदय् एवेनिन्ग्। Fआष्टीण्ग़्: Oन् Fरिदय्, एस्पेचिअल्ल्य्
    दुरिन्ग् Vएनुस् त्रन्सित्स् अन्द् मजोर् ओर् मिनोर् Vएनुस् पेरिओद्स्। एस्पेचिअल्ल्य् दुरिन्ग् मजोर्
    ओर् मिनोर् Vएनुस् पेरिओद्स्: ऱ्Eषूळ्ट्: ठे प्लनेतर्य् दिएत्य् षुक्र इस् प्रोपितिअतेद् इन्च्रेअसिन्ग्
    रिचेस् अन्द् चोन्जुगल् ब्लिस्स्। ट्रन्स्लितेरतिओन् अन्द् इन्फ़ोर्मतिओन् ब्य् ड्र्। ष्। ख़ल्यनरमन् कल्यन्९७@यहूॅओम्'
