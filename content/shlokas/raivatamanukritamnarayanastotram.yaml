id: raivatamanukritamnarayanastotram
category: stotram
name:
  english: raivatamanukritamnarayanastotram
  devanagari: रैवतमनुकृतंनारायणस्तोत्रम्
content:
  english: raivatakhyo manurvaikunthamaptavan | tushtava ca mahapremna dayalum mam tvaya'nvitam || 1||
    namah saccitsvarupayanandasandohavardhaye | namo'stvekasvarupayobhayarupaya te namah || 2|| namo hiranyakeshaya
    shmashruvashmashrumate namah | namah stanya'stanyavate bija'bijadhrite namah || 3|| namo bahih pracihnayabahishcihnaya
    te namah | namo vishvakpravalaya kvacidbalaya te namah || 4|| namo dakshinasattvaya | vamasattvaya
    te namah | nama urdhvasvarupayanurdhvarupaya te namah || 5|| nama adheyarupayadhararupaya te namah
    | namo dvidalarupayankuraprasutaye namah || 6|| namo vaikunthavasaya kunthavasaya te namah | namo
    manasarupaya bhaktarupaya te namah || 7|| namaste karunasindho namah saurashtravardhine | namo raivatavasaya
    damodaraya te namah || 8|| namah patnivratakhyaya namah krishnaya vishnave | namo'nantasvarupaya mamantaryamine
    namah || 9|| svatantrastvam mahavishno na jane tvam kimicchasi | bhakto yadarthamahutastadvai vidhatumarhasi
    || 10|| daso'yam kripaya vishno neyah param bhavadhvanah | yatra te caranau stastaddesho me hyaranam
    bhavet || 11|| na vai tyajyah kripanatha daso'yam sharanagatah | karunaya grihito'yam na vai tam tyaktumarhasi
    || 12|| yadishtam kshemakrilloke tadishtam samvidhiyatam | iti stutva virarama raivato bhaktasattamah
    || 13|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 55
  devanagari: रैवताख्यो मनुर्वैकुण्ठमाप्तवान् । तुष्टाव च महाप्रेम्णा दयालुं मां त्वयाऽन्वितम् ॥ १॥ नमः
    सच्चित्स्वरूपायानन्दसन्दोहवार्धये । नमोऽस्त्वेकस्वरूपायोभयरूपाय ते नमः ॥ २॥ नमो हिरण्यकेशाय श्मश्रुवश्मश्रुमते
    नमः । नमः स्तन्याऽस्तन्यवते बीजाऽबीजधृते नमः ॥ ३॥ नमो बहिः प्रचिह्नायाबहिश्चिह्नाय ते नमः । नमो विश्वक्प्रवालाय
    क्वचिद्बालाय ते नमः ॥ ४॥ नमो दक्षिणसत्त्वाय । वामसत्त्वाय ते नमः । नम ऊर्ध्वस्वरूपायानूर्ध्वरूपाय
    ते नमः ॥ ५॥ नम आधेयरूपायाधाररूपाय ते नमः । नमो द्विदलरूपायाङ्कुरप्रसूतये नमः ॥ ६॥ नमो वैकुण्ठवासाय
    कुण्ठवासाय ते नमः । नमो मानसरूपाय भक्तरूपाय ते नमः ॥ ७॥ नमस्ते करुणासिन्धो नमः सौराष्ट्रवर्धिने ।
    नमो रैवतवासाय दामोदराय ते नमः ॥ ८॥ नमः पत्नीव्रताख्याय नमः कृष्णाय विष्णवे । नमोऽनन्तस्वरूपाय ममान्तर्यामिणे
    नमः ॥ ९॥ स्वतन्त्रस्त्वं महाविष्णो न जाने त्वं किमिच्छसि । भक्तो यदर्थमाहूतस्तद्वै विधातुमर्हसि ॥
    १०॥ दासोऽयं कृपया विष्णो नेयः पारं भवाध्वनः । यत्र ते चरणौ स्तस्तद्देशो मे ह्यरणं भवेत् ॥ ११॥ न वै
    त्याज्यः कृपानाथ दासोऽयं शरणागतः । करुणया गृहीतोऽयं न वै तं त्यक्तुमर्हसि ॥ १२॥ यदिष्टं क्षेमकृल्लोके
    तदिष्टं संविधीयताम् । इति स्तुत्वा विरराम रैवतो भक्तसत्तमः ॥ १३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ५५
