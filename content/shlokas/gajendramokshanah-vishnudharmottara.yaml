id: gajendramokshanah-vishnudharmottara
category: stotram
name:
  english: gajendramokshanah vishnudharmottara
  devanagari: गजेन्द्रमोक्षणः विष्णुधर्मोत्तर
content:
  english: ringanam tanmahocchrayam || 16|| yatratishitalam toyam laghu svadu sudhanibham | anyacchrangam
    manohari bhringanada ninaditam || 17|| tasminsarasi dushtatma virupo'ntarjaleshayah | huhurjagama
    grahatvam shapadvai devalasya tu || 18|| tasminneva tatha shaile haha gandharvasattamah | babhuva
    yuthapo hasti calatparvatasannibhah || 19|| atha dantojjvalavapuh kadacidgajayuthapah | ajagama mahipala
    cotphulla kamalam sarah || 20|| vamshadandaih sa kalabhairvritashcaiva kararenubhih | vasayanmadagandhena
    tam trikutam mahidharam || 21|| sa gajo'njanasankasho madakuncitalocanah | salilam pankajavane yuthamadhyagato
    vrajam| 22|| grihitastena raudrena grahenavyaktamurtina | pashyatah sarvayuthasya kroshatashcati darunam
    || 23|| sa cakara mahayatnamatmanah parimokshane | graho'pi yatnamatishthatkunjarakarshane mahan ||
    24|| graho'pi balinam nagam na shashaka mahambhasi | akrashtum na ca nago'pi tathatmanam vimokshitum
    || 25|| visphurjya ca yathashakti vikrushya ca maharavan | vyathitah sa nirudyogah pashcimamagato
    dasham || 26|| sa tu nagavarah shrimannarayanaparayanah | jagama sharanam vishnum tushtava ca parantapah
    || 27|| grihitva sa karagrena sarasah kamalottamam | nivedya bhaktya krishnaya gajah stotramudirayat
    || 28|| gaja uvaca | namonamah karanavamanaya narayanayasuradaranaya | shrisharngacakrasigadadharaya
    namo'stu tasmai purushottamaya || 29|| adyaya vedanilayaya mahoragaya simhaya daityanilayaya caturbhujaya
    | brahmendrarudramunicaranasamstutaya devottamaya varadaya namo'cyutaya || 30|| nagendrabhogashayanasanasupriyaya
    gokshirahemashukanilaghanopamaya | pitambaraya madhukaitabhanashanaya bhaktapriyaya varadiptasudarshanaya
    || 31|| nabhiprajatakamalasthacaturmukhaya kshirodakarnavaniketayashodharaya | nanavicitra mukutangadabhushanaya
    sarveshvaraya vijayaya namo varaya || 32|| vishvatmane paramakaranakaranaya phullaravindavipulayatalocanaya
    | devendrabhavana parikshitapaurushaya yogishvaraya vijayaya namo varaya || 33|| lokayanaya tridashayanaya
    brahmayanayatmagunayanaya | dharmayanayaikajanayanaya mahavarahaya sada nato'smi || 34|| acintyamavyaktamanantarupam
    narayanam karanamadidevam | yugantashesham purusham puranam tam vasudevam sharanam prapadye || 35||
    adrishyamacchedyamanadimadhyam maharshayo brahmanidhim suresham | vadanti yam vai purusham sanatanam
    tam vasudevam sharanam prapadye || 36|| yamaksharam brahma vadanti sarvagam nishamya yam mrityumukhatpramucyate
    | tamishvaram driptamanuttamairgunaih parayanam vishnumupaiti shashvatam || 37|| karyakriyakaranamaprameyam
    hira nyanabham kanakaravindam | mahabalam vedanidhim surottamam vrajami vishnum sharanam janardanam
    || 38|| vicitrakeyuramaharhanishkam ratnottamalankritasarva gatram | pitambaram kancanabhakticitram
    maladharam keshavamabhyupaimi || 39|| bhavodbhavam vedavidam varishtham yogatmanam sankhyavidam varishtham
    | adityacandrashvivasuprabhavam prabhum prapadye'cyutamatmabhutam || 40|| shrivatsankam mahadevam
    vedaguhyamanuttamam | prapadye sukshmamacalam bhaktanamabhayapradam || 41|| prabhavam sarvalokanam
    nirgunam ca gunatmanam | prapadye muktasanganam yatinam paramam gatim || 42|| bhagavantam suradhyakshamaksharam
    pushkarekshanam | sharanyam sharanam bhaktya prapadye brahmanapriyam || 43|| brahmadesham trilokeshamadyamekamanamayam
    | bhutatmanam mahatmanam prapadye madhusudanam || 44|| kshetrajnam purusham vishnum trigunatitamavyayam
    | narayanamaniyamsam prapadye sharanam harim || 45|| ekaya lokatantraya paratah paramatmane | namah
    sahasrashirase anantaya mahatmane || 46|| varenyamanagham devamrishayo vedaparagah | kirtayantyabhavam
    sarve tam prapadye sanatanam || 47|| namaste pundarikaksha bhaktanamabhayaprada | subrahmanya namaste'stu
    trahi mam sharana'gatam || 48|| markandeya uvaca | bhaktim tasya tu sancintya nagasya'moghasamstavah
    | pritimanabhavadrajansadyashcakragadadharah || 49|| sannidhyam kalpayamasa graham cakrena madhavah
    | mokshayamasa ca gajam pashebhyah sharanagatam || 50|| sa hi devalashapena haha gandharvasattamah
    | gajatvamabhavattyaktva moksham prapya divam gatah || 51|| grahadvimuktah sadyastu gajo gandharvatam
    gatah | graho gandharvatam prapto yah krishnena nipatitah || 52|| tasyapi devalakritah shapadosho'bhavatpura
    | pritimamstrayate vishnuh sadyah samsarasagarat || 53|| kuddho'pi nighnandevatvamaratinam prayacchati
    | tau ca svam svam vapuh prapya pranipatya janardanam || 54|| gandharvadhipati shighram param nirvritimagatau
    | idam caiva mahabaho pura devo'bhyabhashata || 55|| drishtva muktau gajagrahau bhagavanmadhusudanah
    | yo'grahinnagarajam ca mam caiva pranidhanavan || 56|| smarishyati sarashcedam yuvayormokshanam tatha
    | gulmam kicakavenunamimam shailavaram tatha || 57|| ashvattham bhaskaram gangam naimisharanyameva
    ca | prayagam brahmatirtham ca dandakaranyameva ca || 58|| samsmarishyanti ye martya samyakchroshyanti
    capi ye | na te duhsvapnapapasya bhoktaro matparigrahat || 59|| sarvapapairvimokshyanti kalyananam
    ca bhaginah | bhavishyanti tatha punyam gatim yasyanti manavah || 60|| duhsvapnam ca nrinam tesham
    susvapnatvam prayasyati | kaurmyam matsyam ca varaham vamanam tarkshyameva ca || 61|| narasimham tatha
    rupam srishtipralayakarakam | etani pratarutthaya samsmarishyanti ye narah || 62|| sarvapapairvishuddhaste
    yasyanti paramam gatim | markandeya uvaca | evamuktva tu rajendra devadevo janardanah || 63|| asprishadgajagandharvam
    grahagandharvameva ca | tena sprishtau tu tau sadyo divyamalyambaranvitau || 64|| vimane'bhimate prapte
    jagmatustridashalayam | tatra devapatih krishno mokshayitva gajottamam || 65|| rishibhistuyamanastu
    guhyairvedapadaksharaih | gatah sa bhagavanvishnurdurvijneyagatirvibhuh || 66|| gajendramokshanam
    drishtva sarve sendrapurogamah | brahmananagratah kritva sarve pranjalayo'bhavan || 67|| gajendramokshanam
    punyam sarvapapavimocanam | shravayanpratarutthaya sarvapapaih pramucyate || 68|| shraddhaya hi yadushreshtha
    smritena kathitena ca | gajendramokshanenaiva dirghamayuravapnuyat || 69|| maya te kathitam divyam
    pavitram papanashanam | kirtayasva mahabaho mahaduhsvapnanashanam || 70|| kirtyamanam ca viprebhyah
    sha
  devanagari: ृङ्गाणां तन्महोच्छ्रयम् ॥ १६॥ यत्रातिशीतलं तोयं लघु स्वादु सुधानिभम् । अन्यच्छ्रङ्गं मनोहारि
    भृङ्गनाद निनादितम् ॥ १७॥ तस्मिन्सरसि दुष्टात्मा विरूपोऽन्तर्जलेशयः । हूहूर्जगाम ग्राहत्वं शापाद्वै
    देवलस्य तु ॥ १८॥ तस्मिन्नेव तथा शैले हाहा गन्धर्वसत्तमः । बभूव यूथपो हस्ती चलत्पर्वतसन्निभः ॥ १९॥
    अथ दन्तोज्ज्वलवपुः कदाचिद्गजयूथपः । आजगाम महीपाल चोत्फुल्ल कमलं सरः ॥ २०॥ वंशदण्डैः स कलभैर्वृतश्चैव
    कररेणुभिः । वासयन्मदगन्धेन तं त्रिकूटं महीधरम् ॥ २१॥ स गजोऽञ्जनसङ्काशो मदाकुञ्चितलोचनः । सलीलं पङ्कजवने
    यूथमध्यगतो व्रजम्। २२॥ गृहीतस्तेन रौद्रेण ग्राहेणाव्यक्तमूर्तिना । पश्यतः सर्वयूथस्य क्रोशतश्चाति
    दारुणम् ॥ २३॥ स चकार महायत्नमात्मनः परिमोक्षणे । ग्राहोऽपि यत्नमातिष्ठत्कुञ्जराकर्षणे महान् ॥ २४॥
    ग्राहोऽपि बलिनं नागं न शशाक महाम्भसि । आक्रष्टुं न च नागोऽपि तथात्मानं विमोक्षितुम् ॥ २५॥ विस्फूर्ज्य
    च यथाशक्ति विक्रुष्य च महारवान् । व्यथितः स निरुद्योगः पश्चिमामागतो दशाम् ॥ २६॥ स तु नागवरः श्रीमान्नारायणपरायणः
    । जगाम शरणं विष्णुं तुष्टाव च परन्तपः ॥ २७॥ गृहीत्वा स कराग्रेण सरसः कमलोत्तमम् । निवेद्य भक्त्या
    कृष्णाय गजः स्तोत्रमुदीरयत् ॥ २८॥ गज उवाच । नमोनमः कारणवामनाय नारायणायासुरदारणाय । श्रीशार्ङ्गचक्रासिगदाधराय
    नमोऽस्तु तस्मै पुरुषोत्तमाय ॥ २९॥ आद्याय वेदनिलयाय महोरगाय सिंहाय दैत्यनिलयाय चतुर्भुजाय । ब्रह्मेन्द्ररुद्रमुनिचारणसंस्तुताय
    देवोत्तमाय वरदाय नमोऽच्युताय ॥ ३०॥ नागेन्द्रभोगशयनासनसुप्रियाय गोक्षीरहेमशुकनीलघनोपमाय । पीताम्बराय
    मधुकैटभनाशनाय भक्तप्रियाय वरदीप्तसुदर्शनाय ॥ ३१॥ नाभिप्रजातकमलस्थचतुर्मुखाय क्षीरोदकार्णवनिकेतयशोधराय
    । नानाविचित्र मुकुटाङ्गदभूषणाय सर्वेश्वराय विजयाय नमो वराय ॥ ३२॥ विश्वात्मने परमकारणकारणाय फुल्लारविन्दविपुलायतलोचनाय
    । देवेन्द्रभावन परीक्षितपौरुषाय योगीश्वराय विजयाय नमो वराय ॥ ३३॥ लोकायनाय त्रिदशायनाय ब्रह्मायणायात्मगुणायनाय
    । धर्मायणायैकजनायनाय महावराहाय सदा नतोऽस्मि ॥ ३४॥ अचिन्त्यमव्यक्तमनन्तरूपं नारायणं कारणमादिदेवम् ।
    युगान्तशेषं पुरुषं पुराणं तं वासुदेवं शरणं प्रपद्ये ॥ ३५॥ अदृश्यमच्छेद्यमनादिमध्यं महर्षयो ब्रह्मनिधिं
    सुरेशम् । वदन्ति यं वै पुरुषं सनातनं तं वासुदेवं शरणं प्रपद्ये ॥ ३६॥ यमक्षरं ब्रह्म वदन्ति सर्वगं
    निशम्य यं मृत्युमुखात्प्रमुच्यते । तमीश्वरं दृप्तमनुत्तमैर्गुणैः परायणं विष्णुमुपैति शाश्वतम् ॥ ३७॥
    कार्यक्रियाकारणमप्रमेयं हिर ण्यनाभं कनकारविन्दम् । महाबलं वेदनिधिं सुरोत्तमं व्रजामि विष्णुं शरणं
    जनार्दनम् ॥ ३८॥ विचित्रकेयूरमहार्हनिष्कं रत्नोत्तमालङ्कृतसर्व गात्रम् । पीताम्बरं काञ्चनभक्तिचित्रं
    मालाधरं केशवमभ्युपैमि ॥ ३९॥ भवोद्भवं वेदविदां वरिष्ठं योगात्मनां साङ्ख्यविदां वरिष्ठम् । आदित्यचन्द्राश्विवसुप्रभावं
    प्रभुं प्रपद्येऽच्युतमात्मभूतम् ॥ ४०॥ श्रीवत्साङ्कं महादेवं वेदगुह्यमनुत्तमम् । प्रपद्ये सूक्ष्ममचलं
    भक्तानामभयप्रदम् ॥ ४१॥ प्रभवं सर्वलोकानां निर्गुणं च गुणात्मनाम् । प्रपद्ये मुक्तसङ्गानां यतीनां परमां
    गतिम् ॥ ४२॥ भगवन्तं सुराध्यक्षमक्षरं पुष्करेक्षणम् । शरण्यं शरणं भक्त्या प्रपद्ये ब्राह्मणप्रियम्
    ॥ ४३॥ ब्रह्मादेशं त्रिलोकेशमाद्यमेकमनामयम् । भूतात्मानं महात्मानं प्रपद्ये मधुसूदनम् ॥ ४४॥ क्षेत्रज्ञं
    पुरुषं विष्णुं त्रिगुणातीतमव्ययम् । नारायणमणीयांसं प्रपद्ये शरणं हरिम् ॥ ४५॥ एकाय लोकतन्त्राय परतः
    परमात्मने । नमः सहस्रशिरसे अनन्ताय महात्मने ॥ ४६॥ वरेण्यमनघं देवमृषयो वेदपारगाः । कीर्तयन्त्यभवं सर्वे
    तं प्रपद्ये सनातनम् ॥ ४७॥ नमस्ते पुण्डरीकाक्ष भक्तानामभयप्रद । सुब्रह्मण्य नमस्तेऽस्तु त्राहि मां
    शरणाऽगतम् ॥ ४८॥ मार्कण्डेय उवाच । भक्तिं तस्य तु सञ्चिन्त्य नागस्याऽमोघसंस्तवः । प्रीतिमानभवद्राजन्सद्यश्चक्रगदाधरः
    ॥ ४९॥ सान्निध्यं कल्पयामास ग्राहं चक्रेण माधवः । मोक्षयामास च गजं पाशेभ्यः शरणागतम् ॥ ५०॥ स हि देवलशापेन
    हाहा गन्धर्वसत्तमः । गजत्वमभवत्त्यक्त्वा मोक्षं प्राप्य दिवं गतः ॥ ५१॥ ग्राहाद्विमुक्तः सद्यस्तु गजो
    गन्धर्वतां गतः । ग्राहो गन्धर्वतां प्राप्तो यः कृष्णेन निपातितः ॥ ५२॥ तस्यापि देवलकृतः शापदोषोऽभवत्पुरा
    । प्रीतिमांस्त्रायते विष्णुः सद्यः संसारसागरात् ॥ ५३॥ कुद्धोऽपि निघ्नन्देवत्वमरातीनां प्रयच्छति ।
    तौ च स्वं स्वं वपुः प्राप्य प्रणिपत्य जनार्दनम् ॥ ५४॥ गन्धर्वाधिपती शीघ्रं परां निर्वृतिमागतौ । इदं
    चैव महाबाहो पुरा देवोऽभ्यभाषत ॥ ५५॥ दृष्ट्वा मुक्तौ गजग्राहौ भगवान्मधुसूदनः । योऽग्रहीन्नागराजं च
    मां चैव प्रणिधानवान् ॥ ५६॥ स्मरिष्यति सरश्चेदं युवयोर्मोक्षणं तथा । गुल्मं कीचकवेणूनामिमं शैलवरं तथा
    ॥ ५७॥ अश्वत्थं भास्करं गङ्गां नैमिषारण्यमेव च । प्रयागं ब्रह्मतीर्थं च दण्डकारण्यमेव च ॥ ५८॥ संस्मरिष्यन्ति
    ये मर्त्या सम्यक्छ्रोष्यन्ति चापि ये । न ते दुःस्वप्नपापस्य भोक्तारो मत्परिग्रहात् ॥ ५९॥ सर्वपापैर्विमोक्ष्यन्ति
    कल्याणानां च भागिनः । भविष्यन्ति तथा पुण्यां गतिं यास्यन्ति मानवाः ॥ ६०॥ दुःस्वप्नं च नृणां तेषां
    सुस्वप्नत्वं प्रयास्यति । कौर्म्यं मात्स्यं च वाराहं वामनं तार्क्ष्यमेव च ॥ ६१॥ नारसिंहं तथा रूपं
    सृष्टिप्रलयकारकम् । एतानि प्रातरुत्थाय संस्मरिष्यन्ति ये नराः ॥ ६२॥ सर्वपापैर्विशुद्धास्ते यास्यन्ति
    परमां गतिम् । मार्कण्डेय उवाच । एवमुक्त्वा तु राजेन्द्र देवदेवो जनार्दनः ॥ ६३॥ अस्पृशद्गजगन्धर्वं
    ग्राहगन्धर्वमेव च । तेन स्पृष्टौ तु तौ सद्यो दिव्यमाल्याम्बरान्वितौ ॥ ६४॥ विमानेऽभिमते प्राप्ते जग्मतुस्त्रिदशालयम्
    । तत्र देवपतिः कृष्णो मोक्षयित्वा गजोत्तमम् ॥ ६५॥ ऋषिभिस्तूयमानस्तु गुह्यैर्वेदपदाक्षरैः । गतः स भगवान्विष्णुर्दुर्विज्ञेयगतिर्विभुः
    ॥ ६६॥ गजेन्द्रमोक्षणं दृष्ट्वा सर्वे सेन्द्रपुरोगमाः । ब्राह्मणानग्रतः कृत्वा सर्वे प्राञ्जलयोऽभवन्
    ॥ ६७॥ गजेन्द्रमोक्षणं पुण्यं सर्वपापविमोचनम् । श्रावयन्प्रातरुत्थाय सर्वपापैः प्रमुच्यते ॥ ६८॥ श्रद्धया
    हि यदुश्रेष्ठ स्मृतेन कथितेन च । गजेन्द्रमोक्षणेनैव दीर्घमायुरवाप्नुयात् ॥ ६९॥ मया ते कथितं दिव्यं
    पवित्रं पापनाशनम् । कीर्तयस्व महाबाहो महादुःस्वप्ननाशनम् ॥ ७०॥ कीर्त्यमानं च विप्रेभ्यः श
