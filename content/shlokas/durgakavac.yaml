id: durgakavac
category: kavacha
name:
  english: durgakavac
  devanagari: दुर्गाकवच्
content:
  english: rinu devi pravakshyami kavacam sarvasiddhidam | pathitva pathayitva ca naro mucyeta sankatat
    || 1|| pathitva dharayitva ajnatva kavacam devi durgamantram ca yo japet | sa napnoti phalam tasya
    param ca narakam vrajet || 2|| idam guhyatamam devi kavacam tava kathyate | gopaniyam prayatnena savadhanavadharaya
    || 3|| om umadevi shirah patu lalate shuladharini | cakshushi khecari patu karnau catvaravasini ||
    4|| ca dvaravasini sugandha nasike patu vadanam sarvadharini | sarvasadhini jihvam ca candikadevi
    grivam saubhadrika tatha || 5|| ashokavasini ceto dvau bahu vajradharini | kantham patu mahavani jaganmata
    stanadvayam || 6|| hridayam lalitadevi udaram simhavahini | katim bhagavati devi dvavuru vindhyavasini
    || 7|| mahabala ca janghe dve padau bhutalavasini | evam sthita'si devi tvam trailokye rakshanatmika
    | trailokyarakshanatmike raksha mam sarvagatreshu durge devi namo'stute || 8|| ityetatkavacam devi
    mahavidya phalaprada | yah pathetpratarutthaya sa hi tirthaphalam labhet || 9|| yo nyaset kavacam
    dehe tasya vighnam na kvacit | bhutapretapishacebhyo bhayam tasya na vidyate || 10|| || iti shrikubjikatantre
    durgakavacam sampurnam ||
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं सर्वसिद्धिदम् । पठित्वा पाठयित्वा च नरो मुच्येत सङ्कटात् ॥ १॥
    पठित्वा धारयित्वा अज्ञात्वा कवचं देवि दुर्गामन्त्रं च यो जपेत् । स नाप्नोति फलं तस्य परं च नरकं व्रजेत्
    ॥ २॥ इदं गुह्यतमं देवि कवचं तव कथ्यते । गोपनीयं प्रयत्नेन सावधानवधारय ॥ ३॥ ॐ उमादेवी शिरः पातु ललाटे
    शूलधारिणी । चक्षुषी खेचरी पातु कर्णौ चत्वरवासिनी ॥ ४॥ च द्वारवासिनी सुगन्धा नासिके पातु वदनं सर्वधारिणी
    । सर्वसाधिनी जिह्वां च चण्डिकादेवी ग्रीवां सौभद्रिका तथा ॥ ५॥ अशोकवासिनी चेतो द्वौ बाहू वज्रधारिणी
    । कण्ठं पातु महावाणी जगन्माता स्तनद्वयम् ॥ ६॥ हृदयं ललितादेवी उदरं सिंहवाहिनी । कटिं भगवती देवी द्वावूरू
    विन्ध्यवासिनी ॥ ७॥ महाबला च जङ्घे द्वे पादौ भूतलवासिनी । एवं स्थिताऽसि देवि त्वं त्रैलोक्ये रक्षणात्मिका
    । त्रैलोक्यरक्षणात्मिके रक्ष मां सर्वगात्रेषु दुर्गे देवि नमोऽस्तुते ॥ ८॥ इत्येतत्कवचं देवि महाविद्या
    फलप्रद । यः पठेत्प्रातरुत्थाय स हि तीर्थफलं लभेत् ॥ ९॥ यो न्यसेत् कवचं देहे तस्य विघ्नं न क्वचित्
    । भूतप्रेतपिशाचेभ्यो भयं तस्य न विद्यते ॥ १०॥ ॥ इति श्रीकुब्जिकातन्त्रे दुर्गाकवचं सम्पूर्णम् ॥
