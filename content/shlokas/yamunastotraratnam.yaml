id: yamunastotraratnam
category: stotram
name:
  english: yamunastotraratnam
  devanagari: यमुनास्तोत्ररत्नम्
content:
  english: tvaccaranambujadvayam madiyamurdhanam alankarishyati || 31 || virajamanojjvalapitavasasam smitatasisunasamamalacchavim
    | nimagnanabhim tanumadhyamunnatam vishalavakshassthalashobhilakshanam || 32 || cakasatam jyakinakarkashaih
    shubhaishcaturbhirajanuvilambhirbhuhaih | priyavatamsotpalakarnabhushanashlathalakabandhavimardashamsibhih
    || 33 || udagrapinamsavilambikundalalakavalibandhurakanbukandharam | mukhashriya nyakkritapurnanirmalamritamshubimbamburuhojjvalashriyam
    || 34 || prabuddhamugdhambujacarulocanam savibhramabhrulatam ujjvaladharam | shucismitam komalagandam
    unnasam lalataparyantavilambitalakam || 35 || sphuratkiritangadaharakandhikamanindrakancigunanupuradibhih
    | rathangashankhasigadadhanurvarairlasattulasya vanamalayojjvalam || 36 || cakartha yasya bhavanam
    bhujantaram tava priyam dhama yadiyajanmabhuh | jagatsamastam yadapangasamshrayam yadartham ambhodhiramanthyabandhi
    ca || 37 || svavaishvarupyena sadanubhutayapyapurvavadvismayamadadhanaya | gunena rupena vilasaceshtitaissada
    tavaivocitaya tava shriya || 38 || taya sahasinam anantabhogini prakrishtavijnanabalaikadhamani |
    phanamanivratamayukhamandalaprakashamanodaradivyadhamani || 39 || nivasashayyasanapadukamshukopadhanavarshatapavaranadibhih
    | sharirabhedaistava sheshatam gatairyathocitam shsha itirite janaih || 40 || dasassakha vahanam asanam
    dhvajo yaste vitanam vyajanam trayimayah | upasthitam tena puro garutmata tvadanghrisammardakinankashobhana
    || 41 || tvadiyabhuktojjihitasheshabhojina tvaya nisrishtatmabharena yadyatha | priyena senapatina
    nyavedi tattathanujanantam udaravikshanaih || 42 || hatakhilakleshamalaih svabhavatastvadanukulyaikarasaistavocitaih
    | grihitatattatparicarasadhanairnishevyamanam sacivairyathocitam || 43 || apurvananarasabhavanirbhadraprabaddhaya
    mugdhavidaghalilaya | kshananuvatkshiptaparadikalaya praharshayantam mahishim mahabhujanam || 44 ||
    acintyadivyadbhutanityayauvanasvabhavalavanyamayamritodadhim | shriyah shriyam bhaktajanaikajivitam
    samartham apatsakham arthikalpakam || 45 || bhagavantam evanucarannirantaram prashantanishsheshamanorathantarah
    | kadaham aikantikanityakinkarah praharshayishyami sanathajivitah || 46 || dhigashucim avinitam nirbhayam
    mam alajjam paramapurusha yo'ham yogivaryagraganyaih | vidhshivasanakadyairdhyatum atyantaduram tava
    parijanabhavam kamaye kamavrittah || 47 || aparadhasahasrabhajanam patitam bhimabhavarnavodare | atagim
    sharanagatam hare kripaya kevalam atmasatkuru || 48 || avivekaghanandhadinmukhe bahudha santataduhkhavarshini
    | bhagavanbhavadurdine pathah skhalitam mam avalokayaciyuta || 49 || na mrisha paramartham eva me
    shrinu vijnapanam ekam agratah | yadi me na dayishyase tato dayaniyastava natha durlabhah || 50 ||
    tadaham tvadrite na nathavanmadrite tvam dayaniyavanna ca | vidhinirmitam etam anvayam bhagavanpalaya
    ma sma jihapah || 51 || vapuradishu yo'pi ko'pi va gunato'sani yathatathavidhah | tadayam tava padapadmayoraham
    adyaiva maya samarpitah || 52 || mama natha yadasti yo'smyaham sakalam taddhi tavaiva madhava | niyatasvam
    iti prabuddhadhiratha va kim nu samarpayami te || 53 || avabodhitavanimam yatha mayi nityam bhavadiyatam
    svayam | kripayaivam ananyabhogyatam bhagavanbhaktim api prayaccha me || 54 || tava dasyasukhaikasanghinam
    bhavaneshu astvapi kitajanma me | itaravasatheshu ma sma bhudapi me janma caturmukhatmana || 55 ||
    sakrittvadakaravilokanashaya trinikritanuttamabhuktimuktibhih | mahatmabhirmam avalokyatam naya kshane'pi
    te yadviraho'tidussahah || 56 || na deham na prananna ca sukham asheshabhilashitam na catmanam nanyatki
    api tava sheshatvavibhavath | bahirbhutam natha kshanam api sahe yatu shatadha vinasham tatsatyam
    madhumathana vijnapanam idam || 57 || durantasyanaderapariharaniyasya mahato nihinacaro'ham nripashurashubhasyaspadam
    api | dayasindho bandho niravadhikavatsalyajaladhe tava smaram smaram gunaganam iticchami gatabhih
    || 58 || anicchannapyevam yadi punariticchanniva rajastamashchannacchadmastutivacanabhangim aracayam
    | tathapitthamrupam vacanam avalambyapi kripaya tvam evaivambhutam dharanidhara me shikshaya manah
    || 59 || pita tvam mata tvam dayitatanayastvam priyasuhrittvam eva tvam mitram gururasi gatishcasi
    jagatam | tvadiyastvadhbrityastava parijanastvadgatiraham prapannashcaivam satyaham api tavaivasmi
    hi bharah || 60 || janitvaham vamshe mahati jagati khyatayashasam shucinam yuktanam gunapurushatattvasthitividam
    | nisargadeva tvaccaranakamalaikantamanasam adho'dhah papatma sharanada nimajjami tamasi || 61 ||
    amaryadah kshudrashcalamatirasuyaprasavabhuh kritaghno durmani smaraparavasho vancanaparah | nrishamsah
    papishthah katham aham ito duhkhajaladheraparaduttirnastava paricareyam caranayoh || 62 || raghuvara
    yadabhustvam tadrisho vayasasya pranata iti dayaluryacca caidyasya krishna | pratibhavam aparaddhurmugdha
    sayujyado'bhurvada kim apadam agastasya te'si kshamayah || 63 || nanu prapannassakrideva natha tavaham
    asmiti ca yacamanah | tavanukampyassmartah pratijnanam madekavarjam kim idam vratam te || 64 ||
  devanagari: त्वच्चरणाम्बुजद्वयं मदीयमूर्धानं अलङ्करिष्यति ।। ३१ ।। विराजमानोज्ज्वलपीतवाससं स्मितातसीसूनसमामलच्छविं
    । निमग्ननाभिं तनुमध्यमुन्नतं विशालवक्षस्स्थलशोभिलक्षणं ।। ३२ ।। चकासतं ज्याकिणकर्कशैः शुभैश्चतुर्भिराजानुविलम्भिर्भुहैः
    । प्रियावतंसोत्पलकर्णभूषणश्लथालकाबन्धविमर्दशंसिभिः ।। ३३ ।। उदग्रपीनांसविलम्बिकुण्डलालकावलीबन्धुरकन्बुकन्धरं
    । मुखश्रिया न्यक्कृतपूर्णनिर्मलामृतांशुबिम्बाम्बुरुहोज्ज्वलश्रियं ।। ३४ ।। प्रबुद्धमुग्धाम्बुजचारुलोचनं
    सविभ्रमभ्रूलतं उज्ज्वलाधरं । शुचिस्मितं कोमलगण्डं उन्नसं ललाटपर्यन्तविलम्बितालकं ।। ३५ ।। स्फुरत्किरीटाङ्गदहारकण्ढिकामणीन्द्रकाञ्चीगुणनूपुरादिभिः
    । रथाङ्गशङ्खासिगदाधनुर्वरैर्लसत्तुलस्या वनमालयोज्ज्वलं ।। ३६ ।। चकर्थ यस्या भवनं भुजान्तरं तव प्रियं
    धाम यदीयजन्मभूः । जगत्समस्तं यदपाङ्गसंश्रयं यदर्थं अम्भोधिरमन्थ्यबन्धि च ।। ३७ ।। स्ववैश्वरूप्येण
    सदानुभूतयाप्यपूर्ववद्विस्मयमादधानया । गुणेन रूपेण विलासचेष्टितैस्सदा तवैवोचितया तव श्रिया ।। ३८ ।।
    तया सहासीनं अनन्तभोगिनि प्रकृष्टविज्ञानबलैकधामनि । फणामणिव्रातमयूखमण्डलप्रकाशमानोदरदिव्यधामनि ।। ३९
    ।। निवासशय्यासनपादुकांशुकोपधानवर्षातपवारणादिभिः । शरीरभेदैस्तव शेषतां गतैर्यथोचितं श्ष इतीरिते जनैः
    ।। ४० ।। दासस्सखा वाहनं आसनं ध्वजो यस्ते वितानं व्यजनं त्रयीमयः । उपस्थितं तेन पुरो गरुत्मता त्वदङ्घ्रिसम्मर्दकिणाङ्कशोभना
    ।। ४१ ।। त्वदीयभुक्तोज्जिहितशेषभोजिना त्वया निसृष्टात्मभरेण यद्यथा । प्रियेण सेनापतिना न्यवेदि तत्तथानुजानन्तं
    उदारवीक्षनैः ।। ४२ ।। हताखिलक्लेशमलैः स्वभावतस्त्वदानुकूल्यैकरसैस्तवोचितैः । गृहीततत्तत्परिचारसाधनैर्निषेव्यमाणं
    सचिवैर्यथोचितं ।। ४३ ।। अपूर्वनानारसभावनिर्भद्रप्रबद्धया मुग्धविदघलीलया । क्षणाणुवत्क्षिप्तपरादिकालया
    प्रहर्षयन्तं महिषीं महाभुजनं ।। ४४ ।। अचिन्त्यदिव्याद्भुतनित्ययौवनस्वभावलावण्यमयामृतोदधिं । श्रियः
    श्रियं भक्तजनैकजीवितं समर्थं आपत्सखं अर्थिकल्पकं ।। ४५ ।। भगवन्तं एवानुचरन्निरन्तरं प्रशान्तनिश्शेषमनोरथान्तरः
    । कदाहं ऐकान्तिकनित्यकिङ्करः प्रहर्षयिष्यामि सनाथजीवितः ।। ४६ ।। धिगशुचिं अविनीतं निर्भयं मां अलज्जं
    परमपुरुष योऽहं योगिवर्याग्रगण्यैः । विध्शिवसनकाद्यैर्ध्यातुं अत्यन्तदूरं तव परिजनभावं कामये कामवृत्तः
    ।। ४७ ।। अपराधसहस्रभाजनं पतितं भीमभवार्णवोदरे । अतगिं शरणागतं हरे कृपया केवलं आत्मसात्कुरु ।। ४८ ।।
    अविवेकघनान्धदिङ्मुखे बहुधा सन्ततदुःखवर्षिणि । भगवन्भवदुर्दिने पथः स्खलितं मां अवलोकयाचियुत ।। ४९ ।।
    न मृषा परमार्थं एव मे शृनु विज्ञापनं एकं अग्रतः । यदि मे न दयिष्यसे ततो दयनीयस्तव नाथ दुर्लभः ।। ५०
    ।। तदहं त्वदृते न नाथवान्मदृते त्वं दयनीयवान्न च । विधिनिर्मितं एतं अन्वयं भगवान्पलय मा स्म जीहपः
    ।। ५१ ।। वपुरादिषु योऽपि कोऽपि वा गुणतोऽसानि यथातथाविधः । तदयं तव पादपद्मयोरहं अद्यैव मया समर्पितः
    ।। ५२ ।। मम नाथ यदस्ति योऽस्म्यहं सकलं तद्धि तवैव माधव । नियतस्वं इति प्रबुद्धधीरथ वा किं नु समर्पयामि
    ते ।। ५३ ।। अवबोधितवानिमां यथा मयि नित्यां भवदीयतां स्वयं । कृपयैवं अनन्यभोग्यतां भगवन्भक्तिं अपि
    प्रयच्छ मे ।। ५४ ।। तव दास्यसुखैकसङ्घिनां भवनेषु अस्त्वपि कीटजन्म मे । इतरावसथेषु मा स्म भूदपि मे
    जन्म चतुर्मुखात्मना ।। ५५ ।। सकृत्त्वदाकारविलोकनाशया तृणीकृतानुत्तमभुक्तिमुक्तिभिः । महात्मभिर्मां
    अवलोक्यतां नय क्षणेऽपि ते यद्विरहोऽतिदुस्सहः ।। ५६ ।। न देहं न प्राणान्न च सुखं अशेषाभिलषितं न चात्मानं
    नान्यत्कि अपि तव शेषत्वविभवाथ् । बहिर्भूतं नाथ क्षणं अपि सहे यातु शतधा विनाशं तत्सत्यं मधुमथन विज्ञापनं
    इदं ।। ५७ ।। दुरन्तस्यानादेरपरिहरणीयस्य महतो निहीनाचारोऽहं नृपशुरशुभस्यास्पदं अपि । दयासिन्धो बन्धो
    निरवधिकवात्सल्यजलधे तव स्मारं स्मारं गुणगणं इतीच्छामि गतभीः ।। ५८ ।। अनिच्छन्नप्येवं यदि पुनरितीच्छन्निव
    रजस्तमश्छन्नच्छद्मस्तुतिवचनभङ्गीं अरचयं । तथापीत्थंरूपं वचनं अवलम्ब्यापि कृपया त्वं एवैवम्भूतं धरणिधर
    मे शिक्षय मनः ।। ५९ ।। पिता त्वं माता त्वं दयिततनयस्त्वं प्रियसुहृत्त्वं एव त्वं मित्रं गुरुरसि गतिश्चासि
    जगतां । त्वदीयस्त्वध्बृत्यस्तव परिजनस्त्वद्गतिरहं प्रपन्नश्चैवं सत्यहं अपि तवैवास्मि हि भरः ।। ६०
    ।। जनित्वाहं वंशे महति जगति ख्यातयशसां शुचीनां युक्तानां गुणपुरुषतत्त्वस्थितिविदां । निसर्गादेव त्वच्चरणकमलाइकान्तमनसां
    अधोऽधः पापात्मा शरणद निमज्जामि तमसि ।। ६१ ।। अमर्यादः क्षुद्रश्चलमतिरसूयप्रसवभूः कृतघ्नो दुर्मानी
    स्मरपरवशो वञ्चनपरः । नृशंसः पापिष्ठः कथं अहं इतो दुःखजलधेरपारादुत्तीर्णस्तव परिचरेयं चरणयोः ।। ६२
    ।। रघुवर यदभूस्त्वं तादृशो वायसस्य प्रणत इति दयालुर्यच्च चैद्यस्य कृष्ण । प्रतिभवं अपराद्धुर्मुग्ध
    सायुज्यदोऽभूर्वद किं अपदं आगस्तस्य तेऽसि क्षमायाः ।। ६३ ।। ननु प्रपन्नस्सकृदेव नाथ तवाहं अस्मीति च
    याचमानः । तवानुकम्प्यस्स्मर्तः प्रतिज्ञानां मदेकवर्जं किं इदं व्रतं ते ।। ६४ ।।
