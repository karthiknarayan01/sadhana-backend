id: annamayya-keerthanas-puttu-bhogulamu-memu
category: stotram
name:
  english: Annamayya Keerthanas Puttu Bhogulamu Memu
content:
  english: sa pallavi puttubhogulamu memu bhuvi haridasulamu | nattanadimi dòralu nakiyyavalèna || pallakilu
    nandanalu padivagè tejilu vèllaviri mahalakshmi vilasamulu | talliyakè maganine daivamani kòlicemu
    vòllage make sirulu vòruliyyavalèna || puttubhogulamu memu bhuvi haridasulamu gramamulu vastramulu
    gajamukhya vastuvulu amani bhukantaku nangabhedalu || bhamini yakè magani pranadhari lènka lamu voli
    makatade yicci vòruliyyavalèna || puttubhogulamu memu bhuvi haridasulamu pasagala padavulu brahma
    nirmitamulu vèsa brahmatandri shri venkateshudu | yèsagi yatade mammuneli yinniyu niccè vòsagina masòmmulu
    vòruliyyavalèna || puttubhogulamu memu bhuvi haridasulamu nattanadimi dòralu nakiyyavalèna ||
  devanagari: स पल्लवि पुट्टुभोगुलमु मेमु भुवि हरिदासुलमु । नट्टनडिमि दॊरलु नाकिय्यवलॆना ॥ पल्लकीलु नन्दनालु
    पडिवागॆ तेजीलु वॆल्लविरि महालक्ष्मी विलासमुलु । तल्लियाकॆ मगनिने दैवमनि कॊलिचेमु वॊल्लगे माके सिरुलु
    वॊरुलिय्यवलॆना ॥ पुट्टुभोगुलमु मेमु भुवि हरिदासुलमु ग्राममुलु वस्त्रमुलु गजमुख्य वस्तुवुलु आमनि भूकान्तकु
    नङ्गभेदालु ॥ भामिनि याकॆ मगनि प्राणधारि लॆङ्क लमु वोलि माकातडे यिच्ची वॊरुलिय्यवलॆना ॥ पुट्टुभोगुलमु
    मेमु भुवि हरिदासुलमु पसगल पदवुलु ब्रह्म निर्मितमुलु वॆस ब्रह्मतण्ड्रि श्री वेङ्कटेशुडु । यॆसगि यातडे
    मम्मुनेलि यिन्नियु निच्चॆ वॊसगिन मासॊम्मुलु वॊरुलिय्यवलॆना ॥ पुट्टुभोगुलमु मेमु भुवि हरिदासुलमु नट्टनडिमि
    दॊरलु नाकिय्यवलॆना ॥
