id: haridraganeshakavac
category: kavacha
name:
  english: haridraganeshakavac
  devanagari: हरिद्रागणेशकवच्
content:
  english: rinu vakshyami kavacam sarvasiddhikaram priye | pathitva pathayitva ca mucyate sarvasankatat
    || 1|| ajnatva kavacam devi ganeshasya manum japet | siddhirnajayate tasya kalpakotishatairapi ||
    2|| om amodashca shirah patu pramodashca shikhopari | sammodo bhruyuge patu bhrumadhye ca ganadhipah
    || 3|| ganakrido netrayugmam nasayam gananayakah | ganakridanvitah patu vadane sarvasiddhaye || 4||
    jihvayam sumukhah patu grivayam durmukhah sada | vighnesho hridaye patu vighnanathashca vakshasi ||
    5|| gananam nayakah patu bahuyugmam sada mama | vighnakarta ca hyudare vighnaharta ca lingake || 6||
    gajavaktrah katideshe ekadanto nitambake | lambodarah sada patu guhyadeshe mamarunah || 7|| vyalayajnopaviti
    mam patu padayuge sada | japakah sarvada patu janujanghe ganadhipah || 8|| haridrah sarvada patu sarvange
    gananayakah | ya idam prapathennityam ganeshasya maheshvari || 9|| kavacam sarvasiddhakhyam sarvavighnavinashanam
    | sarvasiddhikaram sakshatsarvapapavimocanam || 10|| sarvasampatpradam sakshatsarvaduhkhavimokshanam
    | sarvapattiprashamanam sarvashatrukshayankaram || 11|| grahapida jvara roga ye canye guhyakadayah
    | pathanaddharanadeva nashamayanti tatkshanat || 12|| dhanadhanyakaram devi kavacam surapujitam |
    samam nasti maheshani trailokye kavacasya ca || 13|| haridrasya mahadevi vighnarajasya bhutale | kimanyairasadalapairyatrayurvyayatamiyat
    || 14|| || iti vishvasaratantre haridraganeshakavacam sampurnam ||
  devanagari: ृणु वक्ष्यामि कवचं सर्वसिद्धिकरं प्रिये । पठित्वा पाठयित्वा च मुच्यते सर्वसङ्कटात् ॥ १॥
    अज्ञात्वा कवचं देवि गणेशस्य मनुं जपेत् । सिद्धिर्नजायते तस्य कल्पकोटिशतैरपि ॥ २॥ ॐ आमोदश्च शिरः पातु
    प्रमोदश्च शिखोपरि । सम्मोदो भ्रूयुगे पातु भ्रूमध्ये च गणाधिपः ॥ ३॥ गणाक्रीडो नेत्रयुग्मं नासायां गणनायकः
    । गणक्रीडान्वितः पातु वदने सर्वसिद्धये ॥ ४॥ जिह्वायां सुमुखः पातु ग्रीवायां दुर्मुखः सदा । विघ्नेशो
    हृदये पातु विघ्ननाथश्च वक्षसि ॥ ५॥ गणानां नायकः पातु बाहुयुग्मं सदा मम । विघ्नकर्ता च ह्युदरे विघ्नहर्ता
    च लिङ्गके ॥ ६॥ गजवक्त्रः कटीदेशे एकदन्तो नितम्बके । लम्बोदरः सदा पातु गुह्यदेशे ममारुणः ॥ ७॥ व्यालयज्ञोपवीती
    मां पातु पादयुगे सदा । जापकः सर्वदा पातु जानुजङ्घे गणाधिपः ॥ ८॥ हारिद्रः सर्वदा पातु सर्वाङ्गे गणनायकः
    । य इदं प्रपठेन्नित्यं गणेशस्य महेश्वरि ॥ ९॥ कवचं सर्वसिद्धाख्यं सर्वविघ्नविनाशनम् । सर्वसिद्धिकरं
    साक्षात्सर्वपापविमोचनम् ॥ १०॥ सर्वसम्पत्प्रदं साक्षात्सर्वदुःखविमोक्षणम् । सर्वापत्तिप्रशमनं सर्वशत्रुक्षयङ्करम्
    ॥ ११॥ ग्रहपीडा ज्वरा रोगा ये चान्ये गुह्यकादयः । पठनाद्धारणादेव नाशमायन्ति तत्क्षणात् ॥ १२॥ धनधान्यकरं
    देवि कवचं सुरपूजितम् । समं नास्ति महेशानि त्रैलोक्ये कवचस्य च ॥ १३॥ हारिद्रस्य महादेवि विघ्नराजस्य
    भूतले । किमन्यैरसदालापैर्यत्रायुर्व्ययतामियात् ॥ १४॥ ॥ इति विश्वसारतन्त्रे हरिद्रागणेशकवचं सम्पूर्णम्
    ॥
