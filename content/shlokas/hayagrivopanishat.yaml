id: hayagrivopanishat
category: upanishad
name:
  english: hayagrivopanishat
  devanagari: हयग्रीवोपनिषत्
content:
  english: prayaccha svaheti pancaksharani | hayagrivasya turiyo bhavati || 4 || om shrimiti dve akshare
    | lhaumityekaksharam | aimaimaimiti trinyaksharani | klim klimiti dve akshare | sauh sauriti dve akshare
    | hrimityekaksharam | om namo bhagavata iti saptaksharani | mahyam medham prajnamiti shadaksharani
    | prayaccha svaheti pancaksharani | pancamo manurbhavati || 5 || hayagrivaikaksharena brahmavidyam
    pravakshyami | brahma maheshvaraya maheshvarah samkarshanaya samkarshano naradaya narado vyasaya vyaso
    lokebhyah prayacchaditi hakaromsakaromakarom trayamekasvarupam bhavati | lhau bijaksharam bhavati
    | bijaksharena lhaum rupena tajjapakanam sampatsarasvatau bhavatah | tatsvarupajnanam vaidehi muktishca
    bhavati | dikpalanam rajnam naganam kinnaranamadhipatirbhavati | hayagrivaikaksharajapashilajnaya
    suryadayah svatah svasvakarmani pravartante | sarvesham bijanam hayagrivaikaksharabijamanuttamam mantrarajatmakam
    bhavati | lhaum hayagrivasvarupo bhavati | amritam kurukuru svaha | tajjapakanam vaksiddhih shrisiddhirashtangayogasiddhishca
    bhavati | agamyagamanatputo bhavati | patitasambhashanatputo bhavati | brahmahatyadipatakairmukto
    bhavati | griham grihapatiriva dehi dehante paramatmanam pravishati | prajnanamanandam brahma tattvamasi
    ayamatma brahma aham brahmasmiti mahavakyaih pratipaditamartham ta ete mantrah pratipadayanti | svaravyanjanabhedena
    dvidha ete | athanumantranjapati | yadvagvadantyavicetanani rashtri devanam nishasada mandra | catasra
    urjam duduhe payamsi kva svidasyah paramam jagama || 1 || gaurirmimaya salilani takshatyekapadi dvipadi
    sa catushpadi | ashtapadi navapadi babhuvushi sahasrakshara parame vyoman || 2 || oshthapidhana nakuli
    dantaih parivrita pavih | sarvasyai vaca ishana caru mamiha vadayeti ca vagrasah || 3 || sasarpariramatim
    badhamana brihanmimaya jamadagnidatta | asuryasya durita tanana shravo deveshvamritamajuryam || 4
    || ya imam brahmavidyamekadashyam patheddhayagrivaprabhavena mahapurusho bhavati | sa jivanmukto bhavati
    | om namo brahmane dharanam me astvanirakaranam dharayita bhuyasam karnayoh shrutam macyodhvam mamamushya
    omityupanishat || om bhadram karnebhih shrunuyama devah | bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema
    devahitam yadayuh || om svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti nastarkshyo
    arishtanemih | svasti no brihaspatirdadhatu || om shantih shantih shantih || harih om tatsat || atha
    hayagrivopanishatsamapta ||
  devanagari: प्रयच्छ स्वाहेति पञ्चाक्षराणि । हयग्रीवस्य तुरीयो भवति ॥ ४ ॥ ॐ श्रीमिति द्वे अक्षरे । ल्हौमित्येकाक्षरम्
    । ऐमैमैमिति त्रीण्यक्षराणि । क्लीं क्लीमिति द्वे अक्षरे । सौः सौरिति द्वे अक्षरे । ह्रीमित्येकाक्षरम्
    । ॐ नमो भगवत इति सप्ताक्षराणि । मह्यं मेधां प्रज्ञामिति षडक्षराणि । प्रयच्छ स्वाहेति पञ्चाक्षराणि
    । पञ्चमो मनुर्भवति ॥ ५ ॥ हयग्रीवैकाक्षरेण ब्रह्मविद्यां प्रवक्ष्यामि । ब्रह्मा महेश्वराय महेश्वरः
    संकर्षणाय संकर्षणो नारदाय नारदो व्यासाय व्यासो लोकेभ्यः प्रायच्छदिति हकारोंसकारोमकारों त्रयमेकस्वरूपं
    भवति । ल्हौ बीजाक्षरं भवति । बीजाक्षरेण ल्हौं रूपेण तज्जापकानां संपत्सारस्वतौ भवतः । तत्स्वरूपज्ञानां
    वैदेही मुक्तिश्च भवति । दिक्पालानां राज्ञां नागानां किन्नराणामधिपतिर्भवति । हयग्रीवैकाक्षरजपशीलाज्ञया
    सूर्यादयः स्वतः स्वस्वकर्मणि प्रवर्तन्ते । सर्वेषां बीजानां हयग्रीवैकाक्षरबीजमनुत्तमं मन्त्रराजात्मकं
    भवति । ल्हौं हयग्रीवस्वरूपो भवति । अमृतं कुरुकुरु स्वाहा । तज्जापकानां वाक्सिद्धिः श्रीसिद्धिरष्टाङ्गयोगसिद्धिश्च
    भवति । अगम्यागमनात्पूतो भवति । पतितसंभाषणात्पूतो भवति । ब्रह्महत्यादिपातकैर्मुक्तो भवति । गृहं गृहपतिरिव
    देही देहान्ते परमात्मानं प्रविशति । प्रज्ञानमानन्दं ब्रह्म तत्त्वमसि अयमात्मा ब्रह्म अहं ब्रह्मास्मीति
    महावाक्यैः प्रतिपादितमर्थं त एते मन्त्राः प्रतिपादयन्ति । स्वरव्यञ्जनभेदेन द्विधा एते । अथानुमन्त्राञ्जपति
    । यद्वाग्वदन्त्यविचेतनानि राष्ट्री देवानां निषसाद मन्द्रा । चतस्र ऊर्जं दुदुहे पयांसि क्व स्विदस्याः
    परमं जगाम ॥ १ ॥ गौरीर्मिमाय सलिलानि तक्षत्येकपदी द्विपदी सा चतुष्पदी । अष्टापदी नवपदी बभूवुषी सहस्राक्षरा
    परमे व्योमन् ॥ २ ॥ ओष्ठापिधाना नकुली दन्तैः परिवृता पविः । सर्वस्यै वाच ईशाना चारु मामिह वादयेति च
    वाग्रसः ॥ ३ ॥ ससर्परीरमतिं बाधमान बृहन्मिमाय जमदग्निदत्त । आसूर्यस्य दुरिता तनान श्रवो देवेष्वमृतमजुर्यम्
    ॥ ४ ॥ य इमां ब्रह्मविद्यामेकादश्यां पठेद्धयग्रीवप्रभावेन महापुरुषो भवति । स जीवन्मुक्तो भवति । ॐ नमो
    ब्रह्मणे धारणं मे अस्त्वनिराकरणं धारयिता भूयासं कर्णयोः श्रुतं माच्योढ्वं ममामुष्य ओमित्युपनिषत् ॥
    ॐ भद्रं कर्णेभिः श्रुणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम
    देवहितं यदायुः ॥ ॐ स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो
    अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत् ॥ अथ हयग्रीवोपनिषत्समाप्ता
    ॥
