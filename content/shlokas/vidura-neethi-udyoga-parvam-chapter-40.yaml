id: vidura-neethi-udyoga-parvam-chapter-40
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 40
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani viduravakye catvarimsho''dhyayah ||
    vidura uvaca | yo''bhyarthitah sadbhirasajjamanah karotyartham shaktimahapayitva | kshipram yashastam
    samupaiti santamalam prasanna hi sukhaya santah || || mahantamapyarthamadharmayuktam yah santyajatyanupakrushta
    eva | sukham sa duhkhanyavamucya shete jirnam tvacam sarpa ivavamucya || || anritam ca samutkarshe
    rajagami ca paishunam | guroshcalika nirbandhah samani brahmahatyaya || || asuyaika padam mrityurativadah
    shriyo vadhah | ashushrusha tvara shlagha vidyayah shatravastrayah || || sukharthinah kuto vidya nasti
    vidyarthinah sukham | sukharthi va tyajedvidyam vidyarthi va sukham tyajet || || nagnistripyati kashthanam
    napaganam mahodadhih | nantakah sarvabhutanam na pumsam vamalocana || || asha dhritim hanti samriddhimantakah
    krodhah shriyam hanti yashah kadaryata | apalanam hanti pashumshca rajann ekah kruddho brahmano hanti
    rashtram || || ajashca kamsyam ca rathashca nityam madhvakarshah shakunih shrotriyash ca | vriddho
    jnatiravasanno vayasya etani te santu grihe sadaiva || || ajoksha candanam vina adarsho madhusarpishi
    | vishamaudumbaram shankhah svarnam nabhishca rocana || || grihe sthapayitavyani dhanyani manurabravit
    | deva brahmana pujarthamatithinam ca bharata || || idam ca tvam sarvaparam bravimi punyam padam tata
    mahavishishtam | na jatu kamanna bhayanna lobhad dharmam tyajejjivitasyapi hetoh || || nityo dharmah
    sukhaduhkhe tvanitye nityo jivo dhaturasya tvanityah | tyaktvanityam pratitishthasva nitye santushya
    tvam tosha paro hi labhah || || mahabalanpashya mananubhavan prashasya bhumim dhanadhanya purnam |
    rajyani hitva vipulamshca bhogan gatannarendranvashamantakasya || || mritam putram duhkhapushtam manushya
    utkshipya rajansvagrihannirharanti | tam muktakeshah karunam rudantash citamadhye kashthamiva kshipanti
    || || anyo dhanam pretagatasya bhunkte vayamsi cagnishca shariradhatun | dvabhyamayam saha gacchatyamutra
    punyena papena ca veshtyamanah || || utsrijya vinivartante jnatayah suhridah sutah | agnau prastam
    tu purusham karmanveti svayam kritam || || asmallokadurdhvamamushya cadho mahattamastishthati hyandhakaram
    | tadvai mahamohanamindriyanam budhyasva ma tvam pralabheta rajan || || idam vacah shakshyasi cedyathavan
    nishamya sarvam pratipattumevam | yashah param prapsyasi jivaloke bhayam na camutra na ceha te''sti
    || || atma nadi bharata punyatirtha satyodaka dhritikula damormih | tasyam snatah puyate punyakarma
    punyo hyatma nityamambho''mbha eva || || kamakrodhagrahavatim pancendriya jalam nadim | kritva dhritimayim
    navam janma durgani santara || || prajna vriddham dharmavriddham svabandhum vidya vriddham vayasa
    capi vriddham | karyakarye pujayitva prasadya yah sampricchenna sa muhyetkada cit || || dhritya shishnodaram
    rakshetpanipadam ca cakshusha | cakshuh shrotre ca manasa mano vacam ca karmana || || nityodaki nityayajnopaviti
    nityasvadhyayi patitanna varji | ritam bruvangurave karma kurvan na brahmanashcyavate brahmalokat
    || || adhitya vedanparisamstirya cagnin ishtva yajnaih palayitva prajash ca | gobrahmanarthe shastraputantaratma
    hatah sangrame kshatriyah svargameti || || vaishyo''dhitya brahmanankshatriyamsh ca dhanaih kale samvibhajyashritamsh
    ca | treta putam dhumamaghraya punyam pretya svarge deva sukhani bhunkte || || brahmakshatram vaishya
    varnam ca shudrah kramenaitannyayatah pujayanah | tushteshveteshvavyatho dagdhapapas tyaktva deham
    svargasukhani bhunkte || || caturvarnyasyaisha dharmastavokto hetum catra bruvato me nibodha | kshatraddharmaddhiyate
    panduputras tam tvam rajanrajadharme niyunkshva || || dhritarashtra uvaca | evametadyatha mam tvamanushasati
    nityada | mamapi ca matih saumya bhavatyevam yathattha mam || || sa tu buddih kritapyevam pandavanrapti
    me sada | duryodhanam samasadya punarviparivartate || || na dishtamabhyatikrantum shakyam martyena
    kena cit | dishtameva kritam manye paurusham tu nirarthakam || || || iti shrimahabharate udyogaparvani
    prajagaraparvani viduravakye catvarimsho''dhyayah || || iti vidura niti samapta ||'
  devanagari: ॥ इति श्रीमाहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये चत्वारिंशोऽध्यायः ॥ विदुर उवाच
    । योऽभ्यर्थितः सद्भिरसज्जमानः करोत्यर्थं शक्तिमहापयित्वा । क्षिप्रं यशस्तं समुपैति सन्तमलं प्रसन्ना
    हि सुखाय सन्तः ॥ ॥ महान्तमप्यर्थमधर्मयुक्तं यः सन्त्यजत्यनुपाक्रुष्ट एव । सुखं स दुःखान्यवमुच्य शेते
    जीर्णां त्वचं सर्प इवावमुच्य ॥ ॥ अनृतं च समुत्कर्षे राजगामि च पैशुनम् । गुरोश्चालीक निर्बन्धः समानि
    ब्रह्महत्यया ॥ ॥ असूयैक पदं मृत्युरतिवादः श्रियो वधः । अशुश्रूषा त्वरा श्लाघा विद्यायाः शत्रवस्त्रयः
    ॥ ॥ सुखार्थिनः कुतो विद्या नास्ति विद्यार्थिनः सुखम् । सुखार्थी वा त्यजेद्विद्यां विद्यार्थी वा सुखं
    त्यजेत् ॥ ॥ नाग्निस्तृप्यति काष्ठानां नापगानां महोदधिः । नान्तकः सर्वभूतानां न पुंसां वामलोचना ॥ ॥
    आशा धृतिं हन्ति समृद्धिमन्तकः क्रोधः श्रियं हन्ति यशः कदर्यता । अपालनं हन्ति पशूंश्च राजन्न् एकः क्रुद्धो
    ब्राह्मणो हन्ति राष्ट्रम् ॥ ॥ अजश्च कांस्यं च रथश्च नित्यं मध्वाकर्षः शकुनिः श्रोत्रियश् च । वृद्धो
    ज्ञातिरवसन्नो वयस्य एतानि ते सन्तु गृहे सदैव ॥ ॥ अजोक्षा चन्दनं वीणा आदर्शो मधुसर्पिषी । विषमौदुम्बरं
    शङ्खः स्वर्णं नाभिश्च रोचना ॥ ॥ गृहे स्थापयितव्यानि धन्यानि मनुरब्रवीत् । देव ब्राह्मण पूजार्थमतिथीनां
    च भारत ॥ ॥ इदं च त्वां सर्वपरं ब्रवीमि पुण्यं पदं तात महाविशिष्टम् । न जातु कामान्न भयान्न लोभाद्
    धर्मं त्यजेज्जीवितस्यापि हेतोः ॥ ॥ नित्यो धर्मः सुखदुःखे त्वनित्ये नित्यो जीवो धातुरस्य त्वनित्यः
    । त्यक्त्वानित्यं प्रतितिष्ठस्व नित्ये सन्तुष्य त्वं तोष परो हि लाभः ॥ ॥ महाबलान्पश्य मनानुभावान्
    प्रशास्य भूमिं धनधान्य पूर्णाम् । राज्यानि हित्वा विपुलांश्च भोगान् गतान्नरेन्द्रान्वशमन्तकस्य ॥ ॥
    मृतं पुत्रं दुःखपुष्टं मनुष्या उत्क्षिप्य राजन्स्वगृहान्निर्हरन्ति । तं मुक्तकेशाः करुणं रुदन्तश्
    चितामध्ये काष्ठमिव क्षिपन्ति ॥ ॥ अन्यो धनं प्रेतगतस्य भुङ्क्ते वयांसि चाग्निश्च शरीरधातून् । द्वाभ्यामयं
    सह गच्छत्यमुत्र पुण्येन पापेन च वेष्ट्यमानः ॥ ॥ उत्सृज्य विनिवर्तन्ते ज्ञातयः सुहृदः सुताः । अग्नौ
    प्रास्तं तु पुरुषं कर्मान्वेति स्वयं कृतम् ॥ ॥ अस्माल्लोकादूर्ध्वममुष्य चाधो महत्तमस्तिष्ठति ह्यन्धकारम्
    । तद्वै महामोहनमिन्द्रियाणां बुध्यस्व मा त्वां प्रलभेत राजन् ॥ ॥ इदं वचः शक्ष्यसि चेद्यथावन् निशम्य
    सर्वं प्रतिपत्तुमेवम् । यशः परं प्राप्स्यसि जीवलोके भयं न चामुत्र न चेह तेऽस्ति ॥ ॥ आत्मा नदी भारत
    पुण्यतीर्था सत्योदका धृतिकूला दमोर्मिः । तस्यां स्नातः पूयते पुण्यकर्मा पुण्यो ह्यात्मा नित्यमम्भोऽम्भ
    एव ॥ ॥ कामक्रोधग्राहवतीं पञ्चेन्द्रिय जलां नदीम् । कृत्वा धृतिमयीं नावं जन्म दुर्गाणि सन्तर ॥ ॥ प्रज्ञा
    वृद्धं धर्मवृद्धं स्वबन्धुं विद्या वृद्धं वयसा चापि वृद्धम् । कार्याकार्ये पूजयित्वा प्रसाद्य यः सम्पृच्छेन्न
    स मुह्येत्कदा चित् ॥ ॥ धृत्या शिश्नोदरं रक्षेत्पाणिपादं च चक्षुषा । चक्षुः श्रोत्रे च मनसा मनो वाचं
    च कर्मणा ॥ ॥ नित्योदकी नित्ययज्ञोपवीती नित्यस्वाध्यायी पतितान्न वर्जी । ऋतं ब्रुवन्गुरवे कर्म कुर्वन्
    न ब्राह्मणश्च्यवते ब्रह्मलोकात् ॥ ॥ अधीत्य वेदान्परिसंस्तीर्य चाग्नीन् इष्ट्वा यज्ञैः पालयित्वा प्रजाश्
    च । गोब्राह्मणार्थे शस्त्रपूतान्तरात्मा हतः सङ्ग्रामे क्षत्रियः स्वर्गमेति ॥ ॥ वैश्योऽधीत्य ब्राह्मणान्क्षत्रियांश्
    च धनैः काले संविभज्याश्रितांश् च । त्रेता पूतं धूममाघ्राय पुण्यं प्रेत्य स्वर्गे देव सुखानि भुङ्क्ते
    ॥ ॥ ब्रह्मक्षत्रं वैश्य वर्णं च शूद्रः क्रमेणैतान्न्यायतः पूजयानः । तुष्टेष्वेतेष्वव्यथो दग्धपापस्
    त्यक्त्वा देहं स्वर्गसुखानि भुङ्क्ते ॥ ॥ चातुर्वर्ण्यस्यैष धर्मस्तवोक्तो हेतुं चात्र ब्रुवतो मे निबोध
    । क्षात्राद्धर्माद्धीयते पाण्डुपुत्रस् तं त्वं राजन्राजधर्मे नियुङ्क्ष्व ॥ ॥ धृतराष्ट्र उवाच । एवमेतद्यथा
    मां त्वमनुशासति नित्यदा । ममापि च मतिः सौम्य भवत्येवं यथात्थ माम् ॥ ॥ सा तु बुद्दिः कृताप्येवं पाण्डवान्रप्ति
    मे सदा । दुर्योधनं समासाद्य पुनर्विपरिवर्तते ॥ ॥ न दिष्टमभ्यतिक्रान्तुं शक्यं मर्त्येन केन चित् ।
    दिष्टमेव कृतं मन्ये पौरुषं तु निरर्थकम् ॥ ॥ ॥ इति श्रीमाहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये
    चत्वारिंशोऽध्यायः ॥ ॥ इति विदुर नीति समाप्ता ॥
