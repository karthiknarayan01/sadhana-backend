id: brahmakritam14vishnustotram
category: stotram
name:
  english: brahmakritam14vishnustotram
  devanagari: ब्रह्मकृतं१४विष्णुस्तोत्रम्
content:
  english: 40|| nanashcaryanivasaya nanarupadharaya ca | bhinnatmadarshine purvam pashcadekatmadarshine
    || 41|| anvitananvitarthaya namah sadasadatmane | paramanusvarupaya vyapakaya ca te namah || 42||
    tridhacchedavihinaya sripumrupatmane namah | namo jnanaya divyaya jneyaya jnatrirupine || 43|| namo
    manasvarupaya manaya mitaye namah | pramatre ca namaste'stu satkaryaya ca te namah || 44|| phalavyaptisvarupaya
    shrutivadaya te namah | vagvishrantisvarupaya namo jnaptilayatmane || 45|| prakashakashatanave divyadivyagunatmane
    | sarvam yasmadyatra sarvam yashca sarvatmakah prabhuh || 46|| svapnasvapnobhayarthaya shastre te'stu
    namo namah | tvaya kripaluna deva hritkapatam pravodhitam || 47|| yadartham tatkarishye'ham tatra
    ma vismara prabho | tvatpradattaprabodhena karishye sargaghattanam || 48|| tatra me bandhanam ma syatsahayyam
    prarthaye tava | sarvakaryasamutpade klriptidarshakaro bhava || 49|| iti stutva svayam brahma tushnimasa
    kshanantare | iti shrilakshminarayaniyasamhitayam prathame kritasantanakhande ashtamadhyayantargatam
    brahmakritam vishnustotram sampurnam | lakshminarayaniyasamhita | khanda 1| adhyaya 8
  devanagari: ४०॥ नानाश्चर्यनिवासाय नानारूपधराय च । भिन्नात्मदर्शिने पूर्वं पश्चादेकात्मदर्शिने ॥ ४१॥
    अन्वितानन्वितार्थाय नमः सदसदात्मने । परमाणुस्वरूपाय व्यापकाय च ते नमः ॥ ४२॥ त्रिधाच्छेदविहीनाय स्रीपुंरूपात्मने
    नमः । नमो ज्ञानाय दिव्याय ज्ञेयाय ज्ञातृरूपिणे ॥ ४३॥ नमो मानस्वरूपाय मानाय मितये नमः । प्रमात्रे च
    नमस्तेऽस्तु सत्कार्याय च ते नमः ॥ ४४॥ फलव्याप्तिस्वरूपाय श्रुतिवादाय ते नमः । वाग्विश्रान्तिस्वरूपाय
    नमो ज्ञप्तिलयात्मने ॥ ४५॥ प्रकाशाकाशतनवे दिव्यादिव्यगुणात्मने । सर्वं यस्माद्यत्र सर्वं यश्च सर्वात्मकः
    प्रभुः ॥ ४६॥ स्वप्नास्वप्नोभयार्थाय शास्त्रे तेऽस्तु नमो नमः । त्वया कृपालुना देव हृत्कपाटं प्रवोधितम्
    ॥ ४७॥ यदर्थं तत्करिष्येऽहं तत्र मा विस्मर प्रभो । त्वत्प्रदत्तप्रबोधेन करिष्ये सर्गघट्टनाम् ॥ ४८॥
    तत्र मे बन्धनं मा स्यात्साहाय्यं प्रार्थये तव । सर्वकार्यसमुत्पादे क्लृप्तिदर्शकरो भव ॥ ४९॥ इति स्तुत्वा
    स्वयं ब्रह्मा तूष्णीमास क्षणान्तरे । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतसन्तानखण्डे अष्टमाध्यायान्तर्गतं
    ब्रह्मकृतं विष्णुस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता । खण्ड १। अध्याय ८
