id: annamayya-keerthanas-phaala-netraanala
category: stotram
name:
  english: Annamayya Keerthanas Phaala Netraanala
content:
  english: phalanetranala prabala vidyullata keli vihara lakshminarasimha || pralayamaruta ghora bhastrikaputkara
    lalita nishvasadola racanaya | kulashailakumbhini kumudahita ravigagana calana vidhinipuna nishcala
    narasimha || vivaraghanavadana durvidhahasana nishthyuta lavadivya parusha lalaghatanaya | vividha
    jantu vratabhuvana magnaukarana navanavapriya gunarnava narasimha || darunojjvala dhagaddhagita damshtranala
    vi kara sphulinga sangakridaya | vairidanava ghoravamsha bhasmikarana karana prakata venkata narasimha
    ||
  devanagari: फालनेत्रानल प्रबल विद्युल्लता केली विहार लक्ष्मीनारसिंहा ॥ प्रलयमारुत घोर भस्त्रीकापूत्कार
    ललित निश्वासडोला रचनया । कूलशैलकुम्भिनी कुमुदहित रविगगन चलन विधिनिपुण निश्चल नारसिंहा ॥ विवरघनवदन
    दुर्विधहसन निष्ठ्यूत लवदिव्य परुष लालाघटनया । विविध जन्तु व्रातभुवन मग्नौकरण नवनवप्रिय गुणार्णव नारसिंहा
    ॥ दारुणोज्ज्वल धगद्धगित दंष्ट्रानल वि कार स्फुलिङ्ग सङ्गक्रीडया । वैरिदानव घोरवंश भस्मीकरण कारण प्रकट
    वेङ्कट नारसिंहा ॥
