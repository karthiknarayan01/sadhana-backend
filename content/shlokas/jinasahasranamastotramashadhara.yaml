id: jinasahasranamastotramashadhara
category: sahasranama
name:
  english: jinasahasranamastotramashadhara
  devanagari: जिनसहस्रनामस्तोत्रमाशाधर
content:
  english: buddhantakritam cashtottaraih shataih || 5|| 1 atha jinashatam | jino jinendro jinarat jinaprishtho
    jinottamah | jinadhipo jinadhisho jinasvami jineshvarah || 6|| jinanatho jinapatirjinarajo jinadhirat
    | jinaprabhurjinavibhurjinabhartta jinadhibhuh || 7|| jinaneta jineshano jineno jinanayakah | jinet
    jinaparivridho jinadevo jineshita || 8|| jinadhirajo jinapo jineshi jinashasita | jinadhinatho'pi
    jinadhipatirjinapalakah || 9|| jinacandro jinadityo jinarko jinakunjarah | jinendurjinadhaureyo jinadhuryo
    jinottarah || 10|| jinavaryo jinavaro jinasimho jinodvahah | jinarshabho jinavripo jinaratram jinorasam
    || 11|| jinesho jinashardulo jinagryam jinapungavah | jinahamso jinottamso jinanago jinagranih ||
    12|| jinapravekashca jinagramanirjinasattamah | jinapravarhah paramajino jinapurogamah || 13|| jinashreshtho
    jinajyeshtho jinamukhyo jinagrimah | shrijinashvottamajino jinavrindarako'rijit || 14|| nirvighno
    virajah shuddho nistamasko niranjanah | ghatikarmantakah karmamarmavitkarmahanaghah || 15|| vitarago'kshudadvesho
    nirmoho nirmado'gadah | vitrishno nirmamo'sango nirbhayo vitavismayah || 16|| asvapno nihshramo'janma
    nihsvedo nirjaro'marah | aratyatito nishcinto nirvishadastrishashthijit || 17|| 2 atha sarvajnatam
    | sarvajnah sarvavitsarvadarshi sarvavalokanah | anantavikramo'nantaviryo'nantasukhatmakah || 18||
    anantasaukhyo vishvajno vishvadrishva'khilarthadrik | nyakshadrigvishvatashcakshurvishvacakshurasheshavit
    || 19|| ananda paramanandah sadanandah sadodayah | nityanando mahanandah paranandah parodayah || 20||
    paramojah paramtejah paramdhama parammahah | pratyagjyotih paramjyotih parambrahma paramrahah || 21||
    pratyagatma prabuddhatma mahatmatmamahodayah | paramatma prashantatma paratmatmaniketanah || 22||
    parameshthi mahishtatma shreshthatma svatmanishthitah | brahmanishtho mahanishtho nirudhatma dridhatmadrik
    || 23|| ekavidyo mahavidyo mahabrahmapadeshvarah | pancabrahmamayah sarvah sarvavidyeshvarah svabhuh
    || 24|| anantadhiranantatma'nantashaktiranantadrik | anantanantadhishaktiranantacidanantamut || 25||
    sadaprakashah sarvarthasakshatkari samagradhih | karmasakshi jagaccakshuralakshyatma'calasthitih ||
    26|| nirabadho'pratarkyatma dharmacakri vidamvarah | bhutatma sahajajyotirvishvajyotiratindriyah ||
    27|| kevali kevalaloko lokalokavilokanah | viviktah kevalo'vyaktah sharanyo'cintyavaibhavah || 28||
    vishvabhridvishvarupatma vishvatma vishvatomukhah | vishvavyapi svayanjyotiracintyatma'mitaprabhah
    || 29|| mahaudaryo mahabodhirmahalabho mahodayah | mahopabhogah sugatirmahabhogo mahabalah || 30||
    3 atha yajnarhashatam | yajnarho bhagavanarhanmaharho maghavarcitah | bhutarthayajnapurusho bhutarthakratupaurushah
    || 31|| pujyo bhattarakastatrabhavanatrabhavanmahan | mahamaharhastatrayustato dirghayurarghyavak
    || 32|| aradhyah paramaradhyah pancakalyanapujitah | drigvishuddhiganodagro vasudhararcitaspadah ||
    33|| susvapnadarshi divyaujah shacisevitamatrikah | syadvatnagarbhah shriputagarbho garbhotsavocchratah
    || 34|| divyopacaropacitah padmabhurnishkalah svajah | sarviyajanma punyango bhasvanudbhutadaivatah
    || 35|| vishvavijnatasambhutirvishvadevagamadbhutah | shacisrishtapraticchandah sahasrakshadrigutsavah
    || 36|| nrityadaivatasinah sarvashakranamaskritah | harshakulamarakhagashcaranarshimatotsavah || 37||
    vyoma vishnupadaraksha snanapithayitadrirat | tirtheshammanyadugdhabdhih snanambusnatavasavah || 38||
    gandhambuputatrailokyo vajrasucishucishrava | kritarthitashacihastah shakroddhushteshtanamakah ||
    39|| shakrarabdhanandanrityah shacivismapitambikah | indranrityantapitriko raidapurnamanorathah ||
    40|| ajnarthindrakritasevo devarshishtashivodyamah | dikshakshanakshubdhajagadbhurbhuvahsvahpatiditah
    || 41|| kuberanirmitasthanah shriyugyogishvararcitah | brahmedyo brahmavidvedyo yajyo yajnapatih kratuh
    || 42|| yajnangamamritam yajno havih stutyah stutishvarah | bhavo mahamahapatirmahayajno'grayajakah
    || 43|| dayayago jagatpujyah pujarho jagadarcitah | devadhidevah shakrarcyo devadevo jagadguruh ||
    44|| samhutadevasangharcyah padmayano jayadhvaji | bhamandali catuhshashticamaro devadundubhih ||
    45|| vagasprishtasanah chatratrayarat pushpavrishtibhak | divyashoko manamardi sangitarho'shtamangalah
    || 46|| 4 atha tirthakricchatam | tirthakuttirthasrit tirthankarastirthankarah sudrik | tirthakartta
    tirthabharta tirtheshastirthanayakah || 47|| dharmatirthankarastirthapraneta tirthakarakah | tirthapravartakastirthavedhastirthavidhayakah
    || 48|| satyatirthankarastirthasevyastairthikatarakah | satyavakyadhipah satyashasano'pratishasanah
    || 49|| syadvadi divyagirdivyadhvaniravyahatarthavak | punyavagarthyavagardhavagadhiyoktiriddhavak
    || 50|| anekanta digekantadhvantabhid durnayantakrit | sarthavagaprayatnoktih pratitirthamadaghnavak
    || 51|| syatkaradhvajavagihapetavagacalaushthavak | apaurusheyavakchasta ruddhavak saptabhangivak
    || 52|| avarnagih sarvabhashamayagirvyaktavarnagih | amoghavagakramavagavacyantavagavak || 53|| advaitagih
    sunritagih satyanubhayagih sugih | yojanavyapigi kshiragauragistirthakritvagih || 54|| bhavyaishravyaguh
    sadgushcitraguh paramarthaguh | prashantaguh prashnikaguh sugurniyatakalaguh || 55|| sushrutih sushruto
    yajyashrutih sushrunmahashrutih | dharmashrutih shrutipatih shrutyuddhartta dhruvashrutih || 56||
    nirvanamargadigmargadeshakah sarvamargadik | sarasvatapathastirthaparamottamatirthakrit || 57|| deshta
    vagmishvaro dharmashasako dharmadeshakah | vagishvarastrayinathastribhangisho giram patih || 58||
    siddhajnah siddhavagajnasiddhah siddhaikashasanah | jagatprasiddhaksh siddhantah siddhamantrah susiddhavak
    || 59|| shucishrava nirukoktistantrakrinyayashastrakrit | mahishthavagmahanadah kavindro dundubhisvanah
    || 60|| 5 atha nathashatam | nathah patih parivridhah svami bhartta vibhuh prabhuh | ishvaro'dhishvaro'dhisho'dhishano'dhoshiteshita
    || 61|| isho'dhipatirishana ina indro'dhipo'dhibhuh | maheshvaro maheshano maheshah parameshita ||
    62|| adhidevo mahadevo devastribhuvaneshvarah | vishvesho vishvabhutesho vishvet vishveshvaro'dhirat
    || 63|| lokeshvaro lokapati lokanatho jagatpatih | trailokyanatho lokesho jagannatho jagatprabhuh
    || 64|| pitah parah parataro jeta jishnuranishvarah | kartta prabhushnurbhrajishnuh prabhavishnuh
    svayamprabhuh || 65|| lokajidvishvajidvishvavijeta vishvajitvarah | jagajjeta jagajjaitro jagajjishnurjagajjayi
    || 66|| agranirgramanirneta bhurbhuvahsvaradhishvarah | dharmanayaka riddhisho bhutanathashca bhutabhrit
    || 67|| gatih pata vrisho varyo mantrakricchubhalakshanah | lokadhyaksho duradharsho bhavyabandhurnirutsukah
    || 68|| dhiro jagaddhito'jayyastrijagatparameshvarah | vishvasi sarvalokesho vibhavo bhuvaneshvarah
    || 69|| trijagadvallabhastungastrijaganmangalodayah | dharmacakrayudhah sadyojatastrailokya mangalah
    || 70|| varado'pratigho'cchedyo dridhiyanabhayankarah | mahabhago niraupamyo dharmasamrajyanayakah
    || 71|| 6 atha yogishatam | yogi pravyaktanirvedah samyarohanatatparah | samayiki samayiko nihpramado'pratikramah
    || 72|| yamah pradhananiyamah svabhyastaparamasanah | pranayamacanah siddhapratyaharo jitendriyah
    || 73|| dharanadhishvaro dharmadhyananishthah samadhirat | sphuratsamarasibhava eki karananayakah
    || 74|| nirgranthanatho yogindrah rishih sadhuryatirmunih | maharshih sadhudhaureyo yatinatho munishvarah
    || 75|| mahamunirmahamauni mahadhyani mahavrati | mahakshamo mahashilo mahashanto mahadamah || 76||
    nirlepo nirbhamasvanto dharmadhyaksho dayadhvajah | brahmayonih svayambuddho brahmajno brahmatattvavit
    || 77|| putatma snatako danto bhadanto vitamatsarah | dharmavrikshayudho'kshobhyah praputatma'mritodbhavah
    || 78|| mantramurttih svasaumyatma svatantro brahmasambhavah | suprasanno gunambhodhih punyapunyanirodhakah
    || 79|| susamvritah suguptatma siddhatma nirupaplavah | mahodarko mahopayo jagadekapitamahah || 80||
    mahakaruniko gunyo mahakleshankushah shucih | arijamyah sadayogah sadabhogah sadadhritih || 81|| paramaudasita'nashvan
    satyashih shantanayakah | apurvavaidyo yogajno dharmamurtiradharmadhak || 82|| brahmet mahabrahmapatih
    kritakrityah kritakrituh | gunakaro gunocchedi nirnimesho nirashrayah || 83|| surih sunayatattvajno
    mahamaitrimayah sami
  devanagari: बुद्धान्तकृतां चाष्टोत्तरैः शतैः ॥ ५॥ १ अथ जिनशतम् । जिनो जिनेन्द्रो जिनराट् जिनपृष्ठो जिनोत्तमः
    । जिनाधिपो जिनाधीशो जिनस्वामी जिनेश्वरः ॥ ६॥ जिननाथो जिनपतिर्जिनराजो जिनाधिराट् । जिनप्रभुर्जिनविभुर्जिनभर्त्ता
    जिनाधिभूः ॥ ७॥ जिननेता जिनेशानो जिनेनो जिननायकः । जिनेट् जिनपरिवृढो जिनदेवो जिनेशिता ॥ ८॥ जिनाधिराजो
    जिनपो जिनेशी जिनशासिता । जिनाधिनाथोऽपि जिनाधिपतिर्जिनपालकः ॥ ९॥ जिनचन्द्रो जिनादित्यो जिनार्को जिनकुञ्जरः
    । जिनेन्दुर्जिनधौरेयो जिनधुर्यो जिनोत्तरः ॥ १०॥ जिनवर्यो जिनवरो जिनसिंहो जिनोद्वहः । जिनर्षभो जिनवृपो
    जिनरत्रं जिनोरसम् ॥ ११॥ जिनेशो जिनशार्दूलो जिनाग्र्यं जिनपुङ्गवः । जिनहंसो जिनोत्तंसो जिननागो जिनाग्रणीः
    ॥ १२॥ जिनप्रवेकश्च जिनग्रामणीर्जिनसत्तमः । जिनप्रवर्हः परमजिनो जिनपुरोगमः ॥ १३॥ जिनश्रेष्ठो जिनज्येष्ठो
    जिनमुख्यो जिनाग्रिमः । श्रीजिनश्वोत्तमजिनो जिनवृन्दारकोऽरिजित् ॥ १४॥ निर्विघ्नो विरजाः शुद्धो निस्तमस्को
    निरञ्जनः । घातिकर्मान्तकः कर्ममर्मावित्कर्महानघः ॥ १५॥ वीतरागोऽक्षुदद्वेषो निर्मोहो निर्मदोऽगदः ।
    वितृष्णो निर्ममोऽसङ्गो निर्भयो वीतविस्मयः ॥ १६॥ अस्वप्नो निःश्रमोऽजन्मा निःस्वेदो निर्जरोऽमरः । अरत्यतीतो
    निश्चिन्तो निर्विषादस्त्रिषष्ठिजित् ॥ १७॥ २ अथ सर्वज्ञतम् । सर्वज्ञः सर्ववित्सर्वदर्शी सर्वावलोकनः
    । अनन्तविक्रमोऽनन्तवीर्योऽनन्तसुखात्मकः ॥ १८॥ अनन्तसौख्यो विश्वज्ञो विश्वदृश्वाऽखिलार्थदृक् । न्यक्षदृग्विश्वतश्चक्षुर्विश्वचक्षुरशेषवित्
    ॥ १९॥ आनन्द परमानन्दः सदानन्दः सदोदयः । नित्यानन्दो महानन्दः परानन्दः परोदयः ॥ २०॥ परमोजः परंतेजः
    परंधाम परंमहः । प्रत्यग्ज्योतिः परंज्योतिः परंब्रह्म परंरहः ॥ २१॥ प्रत्यगात्मा प्रबुद्धात्मा महात्मात्ममहोदयः
    । परमात्मा प्रशान्तात्मा परात्मात्मनिकेतनः ॥ २२॥ परमेष्ठी महिष्टात्मा श्रेष्ठात्मा स्वात्मनिष्ठितः
    । ब्रह्मनिष्ठो महानिष्ठो निरूढात्मा दृढात्मदृक् ॥ २३॥ एकविद्यो महाविद्यो महाब्रह्मपदेश्वरः । पञ्चब्रह्ममयः
    सार्वः सर्वविद्येश्वरः स्वभूः ॥ २४॥ अनन्तधीरनन्तात्माऽनन्तशक्तिरनन्तदृक् । अनन्तानन्तधीशक्तिरनन्तचिदनन्तमुत्
    ॥ २५॥ सदाप्रकाशः सर्वार्थसाक्षात्कारी समग्रधीः । कर्मसाक्षी जगच्चक्षुरलक्ष्यात्माऽचलस्थितिः ॥ २६॥
    निराबाधोऽप्रतर्क्यात्मा धर्मचक्री विदांवरः । भूतात्मा सहजज्योतिर्विश्वज्योतिरतीन्द्रियः ॥ २७॥ केवली
    केवलालोको लोकालोकविलोकनः । विविक्तः केवलोऽव्यक्तः शरण्योऽचिन्त्यवैभवः ॥ २८॥ विश्वभृद्विश्वरूपात्मा
    विश्वात्मा विश्वतोमुखः । विश्वव्यापी स्वयञ्ज्योतिरचिन्त्यात्माऽमितप्रभः ॥ २९॥ महौदार्यो महाबोधिर्महालाभो
    महोदयः । महोपभोगः सुगतिर्महाभोगो महाबलः ॥ ३०॥ ३ अथ यज्ञार्हशतम् । यज्ञार्हो भगवानर्हन्महार्हो मघवार्चितः
    । भूतार्थयज्ञपुरुषो भूतार्थक्रतुपौरुषः ॥ ३१॥ पूज्यो भट्टारकस्तत्रभवानत्रभवान्महान् । महामहार्हस्तत्रायुस्ततो
    दीर्घायुरर्घ्यवाक् ॥ ३२॥ आराध्यः परमाराध्यः पञ्चकल्याणपूजितः । दृग्विशुद्धिगणोदग्रो वसुधारार्चितास्पदः
    ॥ ३३॥ सुस्वप्नदर्शी दिव्यौजाः शचीसेवितमातृकः । स्याद्वत्नगर्भः श्रीपूतगर्भो गर्भोत्सवोच्छ्रतः ॥ ३४॥
    दिव्योपचारोपचितः पद्मभूर्निष्कलः स्वजः । सर्वीयजन्मा पुण्याङ्गो भास्वानुद्भूतदैवतः ॥ ३५॥ विश्वविज्ञातसम्भूतिर्विश्वदेवागमाद्भुतः
    । शचीसृष्टप्रतिच्छन्दः सहस्राक्षदृगुत्सवः ॥ ३६॥ नृत्यदैवतासीनः सर्वशक्रनमस्कृतः । हर्षाकुलामरखगश्चारणर्षिमतोत्सवः
    ॥ ३७॥ व्योम विष्णुपदारक्षा स्नानपीठायिताद्रिराट् । तीर्थेशंमन्यदुग्धाब्धिः स्नानाम्बुस्नातवासवः ॥
    ३८॥ गन्धाम्बुपूतत्रैलोक्यो वज्रसूचीशुचिश्रवा । कृतार्थितशचीहस्तः शक्रोद्धुष्टेष्टनामकः ॥ ३९॥ शक्रारब्धानन्दनृत्यः
    शचीविस्मापिताम्बिकः । इन्द्रनृत्यन्तपितृको रैदपूर्णमनोरथः ॥ ४०॥ आज्ञार्थीन्द्रकृतासेवो देवर्षीष्टशिवोद्यमः
    । दीक्षाक्षणक्षुब्धजगद्भूर्भुवःस्वःपतीडितः ॥ ४१॥ कुबेरनिर्मितास्थानः श्रीयुग्योगीश्वरार्चितः । ब्रह्मेड्यो
    ब्रह्मविद्वेद्यो याज्यो यज्ञपतिः क्रतुः ॥ ४२॥ यज्ञाङ्गममृतं यज्ञो हविः स्तुत्यः स्तुतीश्वरः । भावो
    महामहपतिर्महायज्ञोऽग्रयाजकः ॥ ४३॥ दयायागो जगत्पूज्यः पूजार्हो जगदर्चितः । देवाधिदेवः शक्रार्च्यो देवदेवो
    जगद्गुरुः ॥ ४४॥ संहूतदेवसङ्घार्च्यः पद्मयानो जयध्वजी । भामण्डली चतुःषष्टिचामरो देवदुन्दुभिः ॥ ४५॥
    वागस्पृष्टासनः छत्रत्रयराट् पुष्पवृष्टिभाक् । दिव्याशोको मानमर्दी सङ्गीतार्होऽष्टमङ्गलः ॥ ४६॥ ४ अथ
    तीर्थकृच्छतम् । तीर्थकुत्तीर्थसृट् तीर्थङ्करस्तीर्थङ्करः सुदृक् । तीर्थकर्त्ता तीर्थभर्ता तीर्थेशस्तीर्थनायकः
    ॥ ४७॥ धर्मतीर्थङ्करस्तीर्थप्रणेता तीर्थकारकः । तीर्थप्रवर्तकस्तीर्थवेधास्तीर्थविधायकः ॥ ४८॥ सत्यतीर्थङ्करस्तीर्थसेव्यस्तैर्थिकतारकः
    । सत्यवाक्याधिपः सत्यशासनोऽप्रतिशासनः ॥ ४९॥ स्याद्वादी दिव्यगीर्दिव्यध्वनिरव्याहतार्थवाक् । पुण्यवागर्थ्यवागर्धवागधीयोक्तिरिद्धवाक्
    ॥ ५०॥ अनेकान्त दिगेकान्तध्वान्तभिद् दुर्णयान्तकृत् । सार्थवागप्रयत्नोक्तिः प्रतितीर्थमदघ्नवाक् ॥ ५१॥
    स्यात्कारध्वजवागीहापेतवागचलौष्ठवाक् । अपौरुषेयवाक्छास्ता रुद्धवाक् सप्तभङ्गिवाक् ॥ ५२॥ अवर्णगीः सर्वभाषामयगीर्व्यक्तवर्णगीः
    । अमोघवागक्रमवागवाच्यान्तवागवाक् ॥ ५३॥ अद्वैतगीः सूनृतगीः सत्यानुभयगीः सुगीः । योजनव्यापिगी क्षीरगौरगीस्तीर्थकृत्वगीः
    ॥ ५४॥ भव्यैश्रव्यगुः सद्गुश्चित्रगुः परमार्थगुः । प्रशान्तगुः प्राश्निकगुः सुगुर्नियतकालगुः ॥ ५५॥
    सुश्रुतिः सुश्रुतो याज्यश्रुतिः सुश्रुन्महाश्रुतिः । धर्मश्रुतिः श्रुतिपतिः श्रुत्युद्धर्त्ता ध्रुवश्रुतिः
    ॥ ५६॥ निर्वाणमार्गदिग्मार्गदेशकः सर्वमार्गदिक् । सारस्वतपथस्तीर्थपरमोत्तमतीर्थकृत् ॥ ५७॥ देष्टा वाग्मीश्वरो
    धर्मशासको धर्मदेशकः । वागीश्वरस्त्रयीनाथस्त्रिभङ्गीशो गिरां पतिः ॥ ५८॥ सिद्धाज्ञः सिद्धवागाज्ञासिद्धः
    सिद्धैकशासनः । जगत्प्रसिद्धक्ष् सिद्धान्तः सिद्धमन्त्रः सुसिद्धवाक् ॥ ५९॥ शुचिश्रवा निरुकोक्तिस्तन्त्रकृन्यायशास्त्रकृत्
    । महिष्ठवाग्महानादः कवीन्द्रो दुन्दुभिस्वनः ॥ ६०॥ ५ अथ नाथशतम् । नाथः पतिः परिवृढः स्वामी भर्त्ता
    विभुः प्रभुः । ईश्वरोऽधीश्वरोऽधीशोऽधीशानोऽधोशितेशिता ॥ ६१॥ ईशोऽधिपतिरीशान इन इन्द्रोऽधिपोऽधिभूः ।
    महेश्वरो महेशानो महेशः परमेशिता ॥ ६२॥ अधिदेवो महादेवो देवस्त्रिभुवनेश्वरः । विश्वेशो विश्वभूतेशो विश्वेट्
    विश्वेश्वरोऽधिराट् ॥ ६३॥ लोकेश्वरो लोकपति लोकनाथो जगत्पतिः । त्रैलोक्यनाथो लोकेशो जगन्नाथो जगत्प्रभुः
    ॥ ६४॥ पिताः परः परतरो जेता जिष्णुरनीश्वरः । कर्त्ता प्रभूष्णुर्भ्राजिष्णुः प्रभविष्णुः स्वयम्प्रभुः
    ॥ ६५॥ लोकजिद्विश्वजिद्विश्वविजेता विश्वजित्वरः । जगज्जेता जगज्जैत्रो जगज्जिष्णुर्जगज्जयी ॥ ६६॥ अग्रणीर्ग्रामणीर्नेता
    भूर्भुवःस्वरधीश्वरः । धर्मनायक ऋद्धीशो भूतनाथश्च भूतभृत् ॥ ६७॥ गतिः पाता वृषो वर्यो मन्त्रकृच्छुभलक्षणः
    । लोकाध्यक्षो दुराधर्षो भव्यबन्धुर्निरुत्सुकः ॥ ६८॥ धीरो जगद्धितोऽजय्यस्त्रिजगत्परमेश्वरः । विश्वासी
    सर्वलोकेशो विभवो भुवनेश्वरः ॥ ६९॥ त्रिजगद्वल्लभस्तुङ्गस्त्रिजगन्मङ्गलोदयः । धर्मचक्रायुधः सद्योजातस्त्रैलोक्य
    मङ्गलः ॥ ७०॥ वरदोऽप्रतिघोऽच्छेद्यो दृढीयानभयङ्करः । महाभागो निरौपम्यो धर्मसाम्राज्यनायकः ॥ ७१॥ ६ अथ
    योगिशतम् । योगी प्रव्यक्तनिर्वेदः साम्यारोहणतत्परः । सामयिकी सामयिको निःप्रमादोऽप्रतिक्रमः ॥ ७२॥ यमः
    प्रधाननियमः स्वभ्यस्तपरमासनः । प्राणायामचणः सिद्धप्रत्याहारो जितेन्द्रियः ॥ ७३॥ धारणाधीश्वरो धर्मध्याननिष्ठः
    समाधिराट् । स्फुरत्समरसीभाव एकी करणनायकः ॥ ७४॥ निर्ग्रन्थनाथो योगीन्द्रः ऋषिः साधुर्यतिर्मुनिः । महर्षिः
    साधुधौरेयो यतिनाथो मुनीश्वरः ॥ ७५॥ महामुनिर्महामौनी महाध्यानी महाव्रती । महाक्षमो महाशीलो महाशान्तो
    महादमः ॥ ७६॥ निर्लेपो निर्भमस्वान्तो धर्माध्यक्षो दयाध्वजः । ब्रह्मयोनिः स्वयम्बुद्धो ब्रह्मज्ञो ब्रह्मतत्त्ववित्
    ॥ ७७॥ पूतात्मा स्नातको दान्तो भदन्तो वीतमत्सरः । धर्मवृक्षायुधोऽक्षोभ्यः प्रपूतात्माऽमृतोद्भवः ॥ ७८॥
    मन्त्रमूर्त्तिः स्वसौम्यात्मा स्वतन्त्रो ब्रह्मसम्भवः । सुप्रसन्नो गुणाम्भोधिः पुण्यापुण्यनिरोधकः
    ॥ ७९॥ सुसंवृतः सुगुप्तात्मा सिद्धात्मा निरुपप्लवः । महोदर्को महोपायो जगदेकपितामहः ॥ ८०॥ महाकारुणिको
    गुण्यो महाक्लेशाङ्कुशः शुचिः । अरिजंयः सदायोगः सदाभोगः सदाधृतिः ॥ ८१॥ परमौदासिताऽनाश्वान् सत्याशीः
    शान्तनायकः । अपूर्ववैद्यो योगज्ञो धर्ममूर्तिरधर्मधक् ॥ ८२॥ ब्रह्मेट् महाब्रह्मपतिः कृतकृत्यः कृतकृतुः
    । गुणाकरो गुणोच्छेदी निर्निमेषो निराश्रयः ॥ ८३॥ सूरिः सुनयतत्त्वज्ञो महामैत्रीमयः समी
