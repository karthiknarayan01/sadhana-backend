id: lalitambashatakam
category: shataka
name:
  english: lalitambashatakam
  devanagari: ललिताम्बाशतकम्
content:
  english: daॅ krishna candra shastri gurusmarana parama pujya sadgurudeva acarya shri jayarama ji maharaja
    ka sankshipta jivana paricaya pujya acarya shri jayarama ji maharaja sanatana samskriti ke rakshaka
    karmayogi santom mem apana pramukha sthana rakhate hai | manava matra kya jagata ke hara jiva ke kalyana
    ki bhavana apa mem prabhu pradatta hai | bhagavana dha rma samskriti ki raksha hetu kisi na kisi ko
    nimitta banakara svayam karya kara lete hai | madhya pradesha ke satana mandalantargata siddha sarada
    pitha maihara ke samipastha ramapurava dhama mem kulina brahmana parivara mem 18 mai 1958 ko madhyahna
    janme acarya shri ke pujya pita shri ramasajivana dube evam pujya mata shrimati ramabai ne rishi parampara
    ka jivana jite hue vaidika parampara ki raksha ki | apake vamsha parampara mem pancavi pir̤hai se
    grihastha dha rma ka palana kara santa parampara mem pravesha karane ki pranali ka nirmana acarya
    shri kara rahe hai | vaishnava kula parampara ke gaurava maharaja shri ne prarambhika shiksha janma
    bhumi mem prapta ki | maihara
  devanagari: डाॅ कृष्ण चन्द्र शास्त्री गुरुस्मरण परम पूज्य सद्गुरुदेव आचार्य श्री जयराम जी महाराज का
    सङ्क्षिप्त जीवन परिचय पूज्य आचार्य श्री जयराम जी महाराज सनातन संस्कृति के रक्षक कर्मयोगी सन्तों में
    अपना प्रमुख स्थान रखते है । मानव मात्र क्या जगत के हर जीव के कल्याण की भावना आप में प्रभु प्रदत्त
    है । भगवान ध र्म संस्कृति की रक्षा हेतु किसी न किसी को निमित्त बनाकर स्वयं कार्य करा लेते है । मध्य
    प्रदेश के सतना मण्डलान्तर्गत सिद्ध सारदा पीठ मैहर के समीपस्थ रमपुरवा धाम में कुलीन ब्राह्मण परिवार
    में १८ मई १९५८ को मध्याह्न जन्मे आचार्य श्री के पूज्य पिता श्री रामसजीवन दुबे एवं पूज्या माता श्रीमति
    रामबाई ने ऋषि परम्परा का जीवन जीते हुए वैदिक परम्परा की रक्षा की । आपके वंश परम्परा में पाञ्चवी पीढ़ई
    से गृहस्थ ध र्म का पालन कर सन्त परम्परा में प्रवेश करने की प्रणाली का निर्माण आचार्य श्री कर रहे है
    । वैष्णव कुल परम्परा के गौरव महाराज श्री ने प्रारम्भिक शिक्षा जन्म भूमि में प्राप्त की । मैहर
