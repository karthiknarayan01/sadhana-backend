id: sri-kashi-viswanatha-suprabhatam
category: stotram
name:
  english: Sri Kashi Viswanatha Suprabhatam
content:
  english: vishvesham madhavam dhundhim dandapanim ca bhairavam | vande kashim guham gangam bhavanim manikarnikam
    || || uttishtha kashi bhagavan prabhuvishvanatho gangormi shubhaih paribhushito'bjaih | shridhundhi
    mukhaih sahita''nnapurna mata ca vanchati muda tava suprabhatam || || brahma muraristripurantakarih
    bhanuh shashi bhumisuto budhashca | gurushca shukrah shani ketavah kurvantu sarve bhuvi suprabhatam
    || dhundhiraja tapatrayapaharane prathita prasavaikabhume nityam samasta jagatah kuru suprabhatam
    || pravahaih punyaih sadaiva paricumbita 'khilamaraganaih parisevyamane shrikashike kuru sada bhuvi
    suprabhatam || nivahaih vidusham varaishca avarjayasyakhila manamsi nityam shrikashike kuru sada bhuvi
    suprabhatam || || ke va nara nu sudhiyah kudhiyo'dhiyo va vanchanti nantasamaye sharanam bhavatyah
    | he koti dakshe shrikashike kuru sada bhuvi suprabhatam || || ya devairasurairmunindratanayairgandharva
    yakshoragaih nagairbhutalavasibhirdvijavaraissamsevita siddhaye | ya gangottaravahini parisare tirthairasankhyairvrita
    sa kashi tripurariraja nagari deyat sada mangalam || || tirthanam pravara manorathakari samsara ganeshvarairupahita
    devairasheshaih stuta | ya shambhormani dirghika seyam shrimanikarnika bhagavati deyat sada mangalam
    || maulermalati pushpamala | jayati jaya pataka kapyasau mokshalakshmyah kshapita kalanka jahnavi
    nah punatu || || gangam vari manohari murari caranacyutam | tripurari shirashcari papahari punatu
    mam || mahagandasthalalambitah sinduraruna nagacchavih | shrivighneshvara vallabho girijaya sanandamananditah
    smerasyastava dhundhiraja mudito deyat sada mangalam || || kanthe yasya lasatkarala garalam gangajalam
    mastake vamange girirajaraja tanaya jaya bhavani sati | nandi sahitah shrivishvanathaprabhuh kashi
    samsthito'khilaguruh deyat sada mangalam || || shrivishvanatha karunamrita bhavyacuda | uttishtha
    vishvajana sadhanaya nityam sarvajagatah kuru suprabhatam || dhvaja vishvavandya srishti karaka devadeva
    | vacamagocara maharshi padma varanasipurapate kuru suprabhatam || || shrivishvanatha bhavabhanjana
    divyabhava gangadhara pramatha vandita sundaranga | nagendra bhayapahara varanasipurapate kuru suprabhatam
    || || shrivishvanatha tava padayugam namami nityam tavaiva shiva nama hrida smarami | vacam tavaiva
    yashasa'nagha bhushayami varanasipurapate kuru suprabhatam || jatakalapa | asyakhilasya jagatah sacaracarasya
    varanasipurapate kuru suprabhatam || priya shantamurte vedanta vedya sakaleshvara vishvamurte | kutastha
    nitya nikhilagama kirte varanasipurapate kuru suprabhatam || || vishvam samastamidamadya ghanandhakare
    mohatmake nipatitam jadatamupetam | bhasa vibhasya paraya tadamogha shakte varanasipurapate kuru suprabhatam
    || 'viratam janebhyah | khyatah svayam ca shivakrit sakalarthi bhajam varanasipurapate kuru suprabhatam
    || || ye no namanti na japanti na camananti no va lapanti vilapanti nivedayanti | teshamabodha dhiyam
    naranam varanasipurapate kuru suprabhatam || pannaga nilakantha sotkantha sarvadeha varanasipurapate
    kuru suprabhatam || mala | shrivishvanatha mridu pada varanasipurapate kuru suprabhatam || sange |
    nityam tapasvi shivade kuru suprabhatam || natham shrivishvanatham sharanam prapadye || || iti shrikashivishvanathasuprabhatam
    sampurnam |
  devanagari: विश्वेशं माधवं ढुण्ढिं दण्डपाणिं च भैरवम् । वन्दे काशीं गुहां गङ्गां भवानीं मणिकर्णिकाम्
    ॥ ॥ उत्तिष्ठ काशि भगवान् प्रभुविश्वनाथो गङ्गोर्मि शुभैः परिभूषितोऽब्जैः । श्रीढुण्ढि मुखैः सहिताऽऽन्नपूर्णा
    माता च वाञ्छति मुदा तव सुप्रभातम् ॥ ॥ ब्रह्मा मुरारिस्त्रिपुरान्तकारिः भानुः शशी भूमिसुतो बुधश्च ।
    गुरुश्च शुक्रः शनि केतवः कुर्वन्तु सर्वे भुवि सुप्रभातम् ॥ ढुण्ढिराज तापत्रयापहरणे प्रथित प्रसवैकभूमे
    नित्यं समस्त जगतः कुरु सुप्रभातम् ॥ प्रवाहैः पुण्यैः सदैव परिचुम्बित ऽखिलामरगणैः परिसेव्यमाने श्रीकाशिके
    कुरु सदा भुवि सुप्रभातम् ॥ निवहैः विदुषां वरैश्च आवर्जयस्यखिल मनांसि नित्यं श्रीकाशिके कुरु सदा भुवि
    सुप्रभातम् ॥ ॥ के वा नरा नु सुधियः कुधियोऽधियो वा वाञ्छन्ति नान्तसमये शरणं भवत्याः । हे कोटि दक्षे
    श्रीकाशिके कुरु सदा भुवि सुप्रभातम् ॥ ॥ या देवैरसुरैर्मुनीन्द्रतनयैर्गन्धर्व यक्षोरगैः नागैर्भूतलवासिभिर्द्विजवरैस्संसेविता
    सिद्धये । या गङ्गोत्तरवाहिनी परिसरे तीर्थैरसङ्ख्यैर्वृता सा काशी त्रिपुरारिराज नगरी देयात् सदा मङ्गलम्
    ॥ ॥ तीर्थानां प्रवरा मनोरथकरी संसार गणेश्वरैरुपहिता देवैरशेषैः स्तुता । या शम्भोर्मणि दीर्घिका सेयं
    श्रीमणिकर्णिका भगवती देयात् सदा मङ्गलम् ॥ मौलेर्मालती पुष्पमाला । जयति जय पताका काप्यसौ मोक्षलक्ष्म्याः
    क्षपित कलङ्का जाह्नवी नः पुनातु ॥ ॥ गाङ्गं वारि मनोहारि मुरारि चरणच्युतम् । त्रिपुरारि शिरश्चारि पापहारि
    पुनातु माम् ॥ महागण्डस्थलालम्बितः सिन्दूरारुण नागच्छविः । श्रीविघ्नेश्वर वल्लभो गिरिजया सानन्दमानन्दितः
    स्मेरास्यस्तव ढुण्ढिराज मुदितो देयात् सदा मङ्गलम् ॥ ॥ कण्ठे यस्य लसत्कराल गरलं गङ्गाजलं मस्तके वामाङ्गे
    गिरिराजराज तनया जाया भवानी सती । नन्दि सहितः श्रीविश्वनाथप्रभुः काशी संस्थितोऽखिलगुरुः देयात् सदा
    मङ्गलम् ॥ ॥ श्रीविश्वनाथ करुणामृत भव्यचूड । उत्तिष्ठ विश्वजन साधनाय नित्यं सर्वजगतः कुरु सुप्रभातम्
    ॥ ध्वज विश्ववन्द्य सृष्टि कारक देवदेव । वाचामगोचर महर्षि पद्म वाराणसीपुरपते कुरु सुप्रभातम् ॥ ॥ श्रीविश्वनाथ
    भवभञ्जन दिव्यभाव गङ्गाधर प्रमथ वन्दित सुन्दराङ्ग । नागेन्द्र भयापहार वाराणसीपुरपते कुरु सुप्रभातम्
    ॥ ॥ श्रीविश्वनाथ तव पादयुगं नमामि नित्यं तवैव शिव नाम हृदा स्मरामि । वाचं तवैव यशसाऽनघ भूषयामि वाराणसीपुरपते
    कुरु सुप्रभातम् ॥ जटाकलाप । अस्याखिलस्य जगतः सचराचरस्य वाराणसीपुरपते कुरु सुप्रभातम् ॥ प्रिय शान्तमूर्ते
    वेदान्त वेद्य सकलेश्वर विश्वमूर्ते । कूटस्थ नित्य निखिलागम कीर्ते वाराणसीपुरपते कुरु सुप्रभातम् ॥
    ॥ विश्वं समस्तमिदमद्य घनान्धकारे मोहात्मके निपतितं जडतामुपेतम् । भासा विभास्य परया तदमोघ शक्ते वाराणसीपुरपते
    कुरु सुप्रभातम् ॥ ऽविरतं जनेभ्यः । ख्यातः स्वयं च शिवकृत् सकलार्थि भाजां वाराणसीपुरपते कुरु सुप्रभातम्
    ॥ ॥ ये नो नमन्ति न जपन्ति न चामनन्ति नो वा लपन्ति विलपन्ति निवेदयन्ति । तेषामबोध धियां नराणां वाराणसीपुरपते
    कुरु सुप्रभातम् ॥ पन्नग नीलकण्ठ सोत्कण्ठ सर्वदेह वाराणसीपुरपते कुरु सुप्रभातम् ॥ माल । श्रीविश्वनाथ
    मृदु पाद वाराणसीपुरपते कुरु सुप्रभातम् ॥ सङ्गे । नित्यं तपस्वि शिवदे कुरु सुप्रभातम् ॥ नाथं श्रीविश्वनाथं
    शरणं प्रपद्ये ॥ ॥ इति श्रीकाशीविश्वनाथसुप्रभातं सम्पूर्णम् ।
