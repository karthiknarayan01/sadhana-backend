id: madhurashtakam
category: stotram
name:
  english: Madhurashtakam
content:
  english: adharam madhuram vadanam madhuram nayanam madhuram hasitam madhuram | hridayam madhuram gamanam
    madhuram madhuradhipaterakhilam madhuram || || vacanam madhuram caritam madhuram vasanam madhuram
    valitam madhuram | calitam madhuram bhramitam madhuram madhuradhipaterakhilam madhuram || rmadhurah
    padau madhurau | nrityam madhuram sakhyam madhuram madhuradhipaterakhilam madhuram || || gitam madhuram
    pitam madhuram bhuktam madhuram suptam madhuram | rupam madhuram tilakam madhuram madhuradhipaterakhilam
    madhuram || || karanam madhuram taranam madhuram haranam madhuram smaranam madhuram | vamitam madhuram
    shamitam madhuram madhuradhipaterakhilam madhuram || || gunja madhura mala madhura yamuna madhura
    vici madhura | salilam madhuram kamalam madhuram madhuradhipaterakhilam madhuram || || gopi madhura
    lila madhura yuktam madhuram muktam madhuram | drishtam madhuram shishtam madhuram madhuradhipaterakhilam
    madhuram || || gopa madhura gavo madhura yashti rmadhura srishti rmadhura | dalitam madhuram phalitam
    madhuram madhuradhipaterakhilam madhuram || || || iti shrimadvallabhacaryaviracitam madhurashtakam
    sampurnam ||
  devanagari: अधरं मधुरं वदनं मधुरं नयनं मधुरं हसितं मधुरम् । हृदयं मधुरं गमनं मधुरं मधुराधिपतेरखिलं मधुरम्
    ॥ ॥ वचनं मधुरं चरितं मधुरं वसनं मधुरं वलितं मधुरम् । चलितं मधुरं भ्रमितं मधुरं मधुराधिपतेरखिलं मधुरम्
    ॥ र्मधुरः पादौ मधुरौ । नृत्यं मधुरं सख्यं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ गीतं मधुरं पीतं मधुरं भुक्तं
    मधुरं सुप्तं मधुरम् । रूपं मधुरं तिलकं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ करणं मधुरं तरणं मधुरं हरणं
    मधुरं स्मरणं मधुरम् । वमितं मधुरं शमितं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ गुञ्जा मधुरा माला मधुरा यमुना
    मधुरा वीची मधुरा । सलिलं मधुरं कमलं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ गोपी मधुरा लीला मधुरा युक्तं
    मधुरं मुक्तं मधुरम् । दृष्टं मधुरं शिष्टं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ गोपा मधुरा गावो मधुरा यष्टि
    र्मधुरा सृष्टि र्मधुरा । दलितं मधुरं फलितं मधुरं मधुराधिपतेरखिलं मधुरम् ॥ ॥ ॥ इति श्रीमद्वल्लभाचार्यविरचितं
    मधुराष्टकं सम्पूर्णम् ॥
