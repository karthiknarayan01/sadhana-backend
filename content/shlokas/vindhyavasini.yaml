id: vindhyavasini
category: stotram
name:
  english: vindhyavasini
  devanagari: विन्ध्यवासिनि
content:
  english: pujam | matarnamami satatam manasa ca vaca dehena padakamalam sharanagato'ham || 13|| dehishtamashu
    vipulam nijasevakebhyo daridryamamba hara carivadham kurushva | shantim ca sarvajagatam vishadam ca
    buddhim tvam palayatikripaya caranabjagam mam || 14|| devyah stavam pathati yah shivadam manushyah
    putah sha
  devanagari: पूजाम् । मातर्नमामि सततं मनसा च वाचा देहेन पादकमलं शरणागतोऽहम् ॥ १३॥ देहीष्टमाशु विपुलं
    निजसेवकेभ्यो दारिद्र्यमम्ब हर चारिवधं कुरुष्व । शान्तिं च सर्वजगतां विशदां च बुद्धिं त्वं पालयातिकृपया
    चरणाब्जगं माम् ॥ १४॥ देव्याः स्तवं पठति यः शिवदं मनुष्यः पूतः श
meaning: {}
