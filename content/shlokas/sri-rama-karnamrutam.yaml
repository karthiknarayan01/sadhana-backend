    | kimaushatham pricchasi mudha durmate niramayam ramakathamritam piba || he ramabhadrashraya he kripalo
    he bhaktalokaikasharanyamurte | punihi mam tvaccaranaravindam jagatpavitram sharanam mama'stu || nilabhradeha
    nikhilesha jagannivasa rajivanetra ramaniyagunabhirama | shridama daityakulamardana ramacandra tvatpadapadmamanisham
