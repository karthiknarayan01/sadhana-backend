id: bhashyakarastutishlokah
category: stotram
name:
  english: bhashyakarastutishlokah
  devanagari: भाष्यकारस्तुतिश्लोकाः
content:
  english: shribhashyakarastutishlokah shrisudarshanasuribhiranugrihitah || shrih || || shrimate ramanujaya
    namah || || shrimate sudarshanasuraye namah || yatindrakritabhashyartha yadvyakhyanena darshitah |
    vyasam sudarshanaryam tam vande kurakuladhipam || tasmai ramanujaryaya namah paramayogine | yah shrutismritisutranam
    antarjvaramashishamat || 1|| prapadye pranavakaram bhashyam rangamivaparam | parasya brahmano yatra
    sheshitvam sphutamikshyate || 2|| avistritassugambhirah ramanujamunergirah | darshayantu prasadena
    svam bhavamakhilam dridham || 3|| bhashyam cet vyavrinot svayam yatipatih vyakhyanavacam tatha gambhiryadanavasthitih
    mitamatirdure janastadgiram | prashtavyah kathamishvarah sa hi na nah pratyaksharupo drisham tadbhashyam
    sa ca bhashyakrit sa ca harih samyak prasidantu nah || 4||
  devanagari: श्रीभाष्यकारस्तुतिश्लोकाः श्रीसुदर्शनसूरिभिरनुगृहीताः ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय नमः
    ॥ ॥ श्रीमते सुदर्शनसूरये नमः ॥ यतीन्द्रकृतभाष्यार्था यद्व्याख्यानेन दर्शिताः । व्यासं सुदर्शनार्यं
    तं वन्दे कूरकुलाधिपम् ॥ तस्मै रामानुजार्याय नमः परमयोगिने । यः श्रुतिस्मृतिसूत्राणां अन्तर्ज्वरमशीशमत्
    ॥ १॥ प्रपद्ये प्रणवाकारं भाष्यं रङ्गमिवापरम् । परस्य ब्रह्मणो यत्र शेषित्वं स्फुटमीक्ष्यते ॥ २॥ अविस्तृतास्सुगम्भीराः
    रामानुजमुनेर्गिरः । दर्शयन्तु प्रसादेन स्वं भावमखिलं दृढम् ॥ ३॥ भाष्यं चेत् व्यवृणोत् स्वयं यतिपतिः
    व्याख्यानवाचां तथा गाम्भीर्यादनवस्थितिः मितमतिर्दूरे जनस्तद्गिराम् । प्रष्टव्यः कथमीश्वरः स हि न नः
    प्रत्यक्षरूपो दृशां तद्भाष्यं स च भाष्यकृत् स च हरिः सम्यक् प्रसीदन्तु नः ॥ ४॥
