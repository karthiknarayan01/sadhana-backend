    थ्षडु॑द्यामग्ं शि॒क्य॑ म्भवति षोढा विहि॒तो वै पुरु॑ष आ॒त्मा च॒ शिर॑श्च च॒त्वार्यङ्गा म्बिभर्ति प्र॒जाप॑ति॒र्वा
