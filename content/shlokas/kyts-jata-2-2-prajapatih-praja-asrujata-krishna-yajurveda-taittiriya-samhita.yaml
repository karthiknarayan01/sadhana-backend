id: kyts-jata-2-2-prajapatih-praja-asrujata-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 2.2 Prajapatih Praja Asrujata - Krishna Yajurveda Taittiriya Samhita
content:
  english: prajapatih prajah prajah prajapatih prajapatih prajah | prajapatiriti praja praja asrijata
    srijata prajah praja asrijata | asrijata tasta asrijata srijata tah | srishta indragni indragni srishta
    ssrishta indragni | ndragni indragni apa | apaguhata maguhata mapapaguhatam | aguhatagm sa so 'guhata
    maguhatagm sah | tprajapatih prajapati racaya dacaya prajapati rindragni indragni prajapatih prajapati
    rindragni | prajapatiriti praja indragni vai va indragni indragni vai | me prajah praja me me prajah
    | praja apapa prajah praja apa | apaghukshata maghukshata mapapa ghukshatam | aghukshata miti tyaghukshata
    maghukshata miti | iti sa sa ititi sah | sa eta metagm sa sa etam | ndragna meta meta mai aindragna
    mekadashakapala mekadashakapala maindragna mai ndragna mekadashakapalam | ekadashakapala mapashya
    dapashya dekadashakapala mekadashakapala mapashyat | ekadashakapalamityekadasha ta vasma asmai tau
    ta vasmai | asmai prajah praja asma asmai prajah | prajah pra pra prajah prajah pra | prasadhayata
    masadhayata mpra prasadhayatam | asadhayata mindragni indragni asadhayata masadhayata mindragni |
    indragni vai va indragni indragni vai | va etasyaitasya vai va etasya | mpraja metasyaitasya prajam
    | apa guhato guhato 'papa guhatah | guhato yo yo guhato guhato yah | na vindate vindate na na vindate
    vindata aindragna mai vi~ndate vindata aindragnam | aindragna mekadashakapala mekadashakapala maindragna
    mai ndragna mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha tprajakamah
    prajakamo vape prajakama indragni indragni prajakamah prajakama indragni | prajakama iti praja indragni
    evaive ndragni indragni eva | eva svena svenaivaiva svena | svena bhagadheyena bhagadheyena svena
    svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati
    | dhavati tau tau dhavati dhavati tau | ta vevaiva tau ta veva | evasma asma evaivasmai mpraja masma
    asmai prajam | ssadhayatah pra pra sadhayatah | sadhayato vindate vindate sadhayata aindragna mekadashakapala
    mekadashakapala maindragna mai ndragna mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha
    kshetre kshetre spardhamana kshetre va va kshetre kshetre va | va sajateshu sajateshu va va sajateshu
    | sajateshu va va sajateshu sajateshu va | vendragni indragni va vendragni | indragni evaive ndragni
    indragni eva | eva svena svenaivaiva svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena
    | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | ndhavati dhavati
    tabhya tabhya mevaiva tabhya eve ndriya mindriya mevaive ndriyam | vi~rya mindriya mindriyam mbhratrivyasya
    bhratrivyasya viryam bhratrivyasya vrinkte vrinkte bhratrivyasya bhratrivyasya vrinkte | vrinkte vi
    vi vrinkte vrinkte vi | vi papmana papmana vi vi papmana papmana bhratrivyena bhratrivyena papmana
    papmana bhratrivyena | bhratrivyena jayate jayate bhratrivyena bhratrivyena jayate | jayate 'papa
    jayate jayate 'pa | apa vai va apapa vai | va etasma detasma etasma dindriya mindriya metasma detasma
    dindriyam | vi~rya mindriya mindriyam nkramati kramati viryam kramati yo yah kramati kramati yah |
    ssangramagm sangramam sangrama mupapraya tyupaprayati sangramagm sangrama mupaprayati | ndragna mupapraya
    tyupapraya tyai aindragna mekadashakapala mekadashakapala maindragna mai ndragna mekadashakapalam
    | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha thsangramagm sangramam sangrama mupaprayasya
    nthsangramagm sangrama mupaprayasyann | nnindragni indragni upaprayasya upaprayasyannityupa indragni
    evaive ndragni indragni eva | eva svena sve naivaiva svena | svena bhagadheyena bhagadheyena svena
    svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati
    | dhavati tau tau dhavati dhavati tau | ta ve vaiva tau ta veva | nnevaivasminn | nnindriya mindriya
    masmi vi~rya mindriya mindriyam ndhatto dhatto viryam ssaha saha dhatto dhatta ndriyena saha sahe
    ndriyena | indriyena viryena viryene ndriyene ndriyena viryena | virye nopopa viryena virye nopa |
    upa pra propopa pra | pra yati yati pra pra yati | yati jayati jayati yati yati jayati | njayati jayati
    tam | tagm sangramagm sangrama ntagm sangramam | vi~ vi sangramagm sangramam va esha esha vai va eshah
    | ndriyenaisha esha indriyena | indriyena viryena viryene ndriyene ndriyena viryena | viryena rdhyata
    riddhyate viryena viryena rdhyate | riddhyate yo ya riddhyata riddhyate yah | ssangramagm sangramam
    njayati jayati sangramagm sangrama jaya tyaindragna mai njayati jaya tyaindragnam | aindragna mekadashakapala
    mekadashakapala maindragna mai ndragna mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha
    thsangramagm sangramam njitva jitva sangramagm sangrama jitvendragni indragni jitva jitvendragni |
    indragni evaive ndragni indragni eva | eva svena sve naivaiva svena | svena bhagadheyena bhagadheyena
    svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa
    dhavati | dhavati tau tau dhavati dhavati tau | ta vevaiva tau ta veva | nnevaivasminn | nnindriya
    mindriya masmi vi~rya mindriya mindriyam ndhatto dhatto viryam dhatto na na dhatto dhatto na | ndriyena
    na ne ndriyena | indriyena viryena viryene ndriyene ndriyena viryena | viryena vi vi viryena viryena
    vi | vyriddhyata riddhyate vi vyriddhyate | riddhyate 'papa rdhyata riddhyate 'pa | apa vai va apapa
    vai | va etasma detasma etasma dindriya mindriya metasma detasma dindriyam | vi~rya mindriya mindriyam
    nkramati kramati viryam kramati yo yah kramati kramati yah | ya etyeti yo ya eti | njanata metyeti
    janata janata maindragna mai njanata maindragnam | aindragna mekadashakapala mekadashakapala maindragna
    mai ndragna mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha njanata
    meshyann | nnindragni indragni eshya indragni evaive ndragni indragni eva | eva svena sve naivaiva
    svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati tau tau dhavati dhavati tau | ta ve vaiva tau ta veva
    | nnevaivasminn | nnindriya mindriya masmi vi~rya mindriya mindriyam ndhatto dhatto viryam ssaha saha
    dhatto dhatta ndriyena saha sahe ndriyena | indriyena viryena viryene ndriyene ndriyena viryena |
    vi~ryena viryena janata janata metyeti janata pusha vai vai pusha pusha vai | ndriyasya vai va indriyasya
    | indriyasya viryasya viryasye ndriyasye ndriyasya viryasya | viryasya nupradata 'nupradata viryasya
    viryasya nupradata | anupradata pushana mpushana manupradata 'nupradata pushana anupradatetyanu pushana
    mevaiva pushana eva svena sve naivaiva svena | || svena bhagadheyena bhagadheyena svena svena bhagadheyena
    | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati sa sa
    dhavati dhavati sah | evasma asma evaivasmai asma indriya mindriya masma asma indriyam | vi~rya mindriya
    mindriyam virya manvanu viryam anu pra pranvanu pra | pra yacchati yacchati pra pra yacchati | yacchati
    kshaitrapatya ya~cchati yacchati kshaitrapatyam | kshaitrapatyamiti kshaitra janata maga tyagatya
    janata agatye ya miya maga tyagatye yam | vai kshetrasya kshetrasya vai vai kshetrasya | kshetrasya
    patish patih kshetrasya kshetrasya patih | mpatish pati rasyam | asya mevaivasya masya meva | eva
    prati pra tyevaiva prati | prati tishthati tishthati prati prati tishthati | tishtha tyaindragna mai
    ntishthati tishtha tyaindragnam | aindragna mekadashakapala mekadashakapala maindragna mai ndragna
    mekadashakapalam | ekadashakapala muparishta duparishta dekadashakapala mekadashakapala muparishtat
    | ekadashakapalamityekadasha rni ruparishta duparishta vape dasya masyam asya mevaivasya masya meva
    | eva pratishthaya pratishtha yaivaiva pratishthaya | ndriya mindriya mpratishthaya pratishthaye pratishthayeti
    prati vi~rya mindriya mindriyam virya muparishta duparishta vi~rya muparishtat | nnuparishta duparishta
    datmann | dhatta iti dhatte | || agnaye pathikrite pathikrite 'gnaye 'gnaye pathikrite pathikrite
    purodasha mpathikrite pathikrite purodasha purodasha mashtakapala mashtakapala mpurodasha mashtakapalam
    | rnirashtakapala mashtakapala ashtakapalamityashta shapurnamasayaji yo yo dar darshapurnamasayaji
    sa shapurnamasayaji sann | darshapurnamasayajiti dar nnamavasya mamavasyagm sa va~ va 'mavasya mamavasyam
    amavasyamityama va~ va paurnamasim | paurnamasimiti paurna va 'tipadaye datipadaye tpathah patho 'tipadaye
    datipadaye atipadayedityati patho vai vai pathah patho vai | va esha esha vai va eshah | ' dhya dhyesha
    esho 'dhi | adhyapathena pathena dhyadhyapathena | apathenai tye tyapathena pathenaiti | shapurnamasayaji
    yo yo dar darshapurnamasayaji sa shapurnamasayaji sann | darshapurnamasayajiti dar nnamavasya mamavasyagm
    sa va~ va 'mavasya mamavasyam amavasyamityama va~ va paurnamasim | paurnamasimiti paurna va 'tipadaya
    tyatipadayati va va 'tipadayati | atipadaya tyagni magni matipadaya tyatipadaya tyagnim | agni mevaivagni
    magni meva | mpathikrita mevaiva pathikrita pathikritagg svena svena pathikrita mpathikritagg svena
    | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | ena mapatha dapathadena
    mena mapathat | mpantha mapatha dapatha pantha mapyapi pantha api nayati naya tyapyapi nayati | naya
    tyanadva nanadva nnayati naya tyanadvan | ndakshina dakshina 'nadva nanadva dakshina vahi vahi dakshina
    dakshina vahi | vahi hi hi vahi vahi hi | hyesha esha hi hyeshah | esha samriddhyai samriddhya esha
    esha samriddhyai | samriddhya agnaye 'gnaye samriddhyai samriddhya agnaye vratapataye vratapataye
    'gnaye 'gnaye vratapataye purodasha vra~tapataye vratapataye purodasha vratapataya iti vrata purodasha
    mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta
    ya ahitagni rahitagni ryo ya ahitagnih | nnahitagni rahitagni ahitagnirityahita nnavratya mavratyagm
    sa avratya mive vavratya mavratya miva | iva carec care dive va care ncarec care dagnim | agni mevaivagni
    magni meva | vra~tapati mevaiva vratapatim | vratapatigg svena svena vratapatim vra~tapatigg svena
    | vratapatimiti vrata svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa
    bhagadheyena bhagadheyenopa | upa dhavati dhavatyupopa dhavati | dhavati sa sa dhavati dhavati sah
    | a lambhayati lambhayatya lambhayati | lambhayati vratyo vratyo lambhayati lambhayati vratyah | vratyo
    bhavati bhavati vratyo vratyo bhavati | bhava tyagnaye 'gnaye bhavati bhava tyagnaye agnaye rakshoghne
    rakshoghne 'gnaye 'gnaye rakshoghne | rakshoghne purodasha mpurodashagm rakshoghne rakshoghne purodasha
    rakshoghna iti rakshah purodasha mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala
    mashtakapala ashtakapalamityashta yagm rakshagmsi rakshagmsi yam nrakshagmsi rakshagmsi sacerann |
    nnagni magnigm sacera agni mevaivagni magni meva | eva rakshohanagm rakshohana mevaiva rakshohana
    rakshohanagg svena svena rakshohanagm rakshohanagg svena | rakshohanamiti rakshah svena bhagadheyena
    bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati
    dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | evasma dasma devaivasma drakshagmsi rakshag
    syasma dasma rakshag syapapa rakshagmsi rakshag syapa | apa hanti ha ntyapapa hanti | nnishitayagm
    hanti hanti nishitayam | nishitayagm hi hi nishitaya nnishitayagm hi | hi rakshagmsi rakshagmsi hi
    hi rakshagmsi | rakshagmsi prerate prerate rakshagmsi rakshagmsi prerate prerate samprernani samprernani
    prerate prerate samprernani | nyevaiva samprernani samprerna samprernaniti sam nyena nye vaivainani
    | enani hanti ha ntyena nyenani hanti | hanti parishrite parishrite hanti hanti parishrite | tparishrite
    parishrite yajayet | parishrita iti pari drakshasagm rakshasam rakshasa mananvavacaraya nanvavacaraya
    rakshasagm rakshasa mananvavacaraya | ananvavacaraya rakshoghni rakshoghni ananvavacaraya nanvavacaraya
    rakshoghni | ananvavacarayetyananu jyanuvakye yajyanuvakye rakshoghni rakshoghni ya rakshoghni iti
    rakshah yajyanuvakye bhavato bhavato yajyanuvakye yajyanuvakye bhavatah | yajyanuvakye iti yajya bhavato
    rakshasagm rakshasa mbhavato bhavato rakshasam | rakshasag strityai strityai rakshasagm rakshasag
    strityai stritya agnaye 'gnaye strityai stritya agnaye agnaye rudravate rudravate 'gnaye 'gnaye rudravate
    | rudravate purodasha mpurodashagm rudravate rudravate purodasha rudravata iti rudra purodasha mashtakapala
    mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta esha vai
    va eshaisha vai | va asyasya vai va asya | asya ghora ghora 'sya rghora ghora tanuh | rudra stasmai
    tasmai rudro rudra stasmai tasma evaiva tasmai tasma eva | a vrishcati vrishcatya vrishcati | ktajag
    vrishcati vrishcati tajak | arti ma ''rti marti ma | arccha tyriccha tyarcchati | riccha tyagnaye
    'gnaya riccha tyriccha tyagnaye agnaye surabhimate surabhimate 'gnaye 'gnaye surabhimate surabhimate
    purodasha mpurodashagm surabhimate surabhimate purodasha surabhimata iti surabhi purodasha mashtakapala
    mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta yasya gavo
    gavo yasya yasya gavah | gavo va va gavo gavo va | va purushah purusha va va purushah | purusha va
    va purushah purusha va | || va va pramiyerann | pramiyeranniti pra dva va bibhiyat | bibhiya deshaisha
    bibhiya esha vai va eshaisha vai | va asyasya vai va asya | asya bheshajya bheshajya bheshajya tanu
    stanu rbheshajya bheshajya tanuh | thsurabhimati surabhimati ya surabhimati taya taya surabhimati
    surabhimati taya surabhimatiti surabhi tayaivaiva taya tayaiva | evasma asma evaivasmai mbheshaja
    masma asmai bheshajam | nkaroti karoti bheshaja karoti surabhimate surabhimate karoti karoti surabhimate
    surabhimate bhavati bhavati surabhimate surabhimate bhavati | surabhimata iti surabhi bhavati putigandhasya
    putigandhasya bhavati bhavati putigandhasya | putigandhasya pahatya apahatyai putigandhasya putigandhasya
    pahatyai | putigandhasyeti puti apahatya agnaye 'gnaye 'pahatya apahatya agnaye agnaye kshamavate
    kshamavate 'gnaye 'gnaye kshamavate | nkshamavate kshamavate purodasha kshamavata iti kshama purodasha
    mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta
    thsangrame sangrame vape ya~tte sangrame sangrame sam ya~tte bhagadheyena bhagadheyena sam ya~tte
    bhagadheyena | bhagadheyenaivaiva bhagadheyena bhagadheyenaiva | enagm shamayitva shamayitvaina menagm
    shamayitva | nchamayitva shamayitva paran | ndishati dishati yam | ya mavaresha mavaresham vi~ddhyanti
    viddhya ntyavaresha mavaresham viddhyanti jivati jivati viddhyanti viddhyanti jivati | jivati sa sa
    jivati jivati sah | pra sa sa pra pra sah | sa miyate miyate sa sa miyate | miyate jayati jayati miyate
    miyate jayati | njayati jayati tam | tagm sangramagm sangrama ntagm sangramam | sangrama mabhyabhi
    sangramagm sangrama mabhi | abhi vai va abhyabhi vai | va esha esha vai va eshah | esha eta neta nesha
    esha etan | eta nucya tyucya tyeta neta nucyati | ye~sha mucya tyucyati yesha purvapara anvanco 'nvancah
    purvaparah pu rvapara anvancah | purvapara iti purva anvancah pramiyante pramiyante 'nvanco 'nvancah
    pramiyante | pramiyante purushahutih purushahutih pramiyante pramiyante purushahutih | pramiyanta
    iti pra hi hi purushahutih purushahutir purushahutiriti purusha hyasyasya hi hyasya | asya priyatama
    priyatama 'syasya priyatama | priyatama 'gnaye 'gnaye priyatama priyatama 'gnaye priyatameti priya
    agnaye kshamavate kshamavate 'gnaye 'gnaye kshamavate | nkshamavate kshamavate purodasha kshamavata
    iti kshama purodasha mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala
    ashtakapalamityashta dbhagadheyena bhagadheyena vape bhagadheyenaivaiva bhagadheyena bhagadheyenaiva
    | enagm shamayati shamayatyena menagm shamayati | shamayati na na shamayati shamayati na | mpura puraisha
    mesha pura ''yusha ayushah pura pura ''yushah | ayusho 'paro 'para ayusha ayusho 'parah | aparah pra
    pra paro 'parah pra | pra miyate miyate pra pra miyate | miyate 'bhyabhi miyate miyate 'bhi | abhi
    vai va abhyabhi vai | va esha esha vai va eshah | esha eta syaita syaisha esha etasya | ngriha neta
    syaitasya grihan | griha nucya tyucyati griha ucyati yasya yasyo cyatyucyati yasya | yasya yasya grihan
    | ndahati dahati griha daha tyagnaye 'gnaye dahati daha tyagnaye agnaye kshamavate kshamavate 'gnaye
    'gnaye kshamavate | nkshamavate kshamavate purodasha kshamavata iti kshama purodasha mashtakapala
    mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta dbhagadheyena
    bhagadheyena vape bhagadheyenaivaiva bhagadheyena bhagadheyenaiva | enagm shamayati shamayatyena menagm
    shamayati | shamayati na na shamayati shamayati na | asyapara mapara masyasyaparam | agnaye kamaya
    kamayagnaye 'gnaye kamaya | nkamaya kamaya purodasha purodasha mashtakapala mashtakapala mpurodasha
    mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta kamo na na kamah kamo na | upanamedagni
    magni mupaname dupaname dagnim | agni mevaivagni magni meva | kamagg svena svena kama nkamagg svena
    | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | nkamena kamenaina mena nkamena
    kamena sam | sa mardhaya tyardhayati sagm sa mardhayati | rdhaya tyardhaya tyupa | upaina mena mupopainam
    | nkamah kama ena mena kamo namati namati kamah kamo namati | nama tyagnaye 'gnaye namati nama tyagnaye
    agnaye yavishthaya yavishthaya gnaye 'gnaye yavishthaya | ya~vishthaya yavishthaya purodasha purodasha
    mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta
    kshetre kshetre spardhamana kshetre va va kshetre kshetre va | va sajateshu sajateshu va va sajateshu
    | sajateshu va va sajateshu sajateshu va | agni mevaivagni magni meva | ya~vishtha mevaiva yavishtham
    | yavishthagg svena svena yavishtham ya~vishthagg svena | svena bhagadheyena bhagadheyena svena svena
    bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati |
    dhavati tena tena dhavati dhavati tena | tenaivaiva tena tenaiva | eve ndriya mindriya mevaive ndriyam
    | vi~rya mindriya mindriyam mbhratrivyasya bhratrivyasya viryam bhratrivyasya yuvate yuvate bhratrivyasya
    bhratrivyasya yuvate | || yuvate vi vi yuvate yuvate vi | vi papmana papmana vi vi papmana papmana
