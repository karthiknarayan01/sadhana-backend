id: sanyasa
category: upanishad
name:
  english: sanyasa
  devanagari: सन्यस
content:
  english: tkarmacara vidyadurah | na parivrannamasankirtanaparo yadyatkarma karoti tattatphalamanubhavati
    | erandatailaphenavatsarvam parityajet | na devataprasadagrahanam | na bahyadevabhyarcanam kuryat
    | svavyatiriktam sarvam tyaktva madhukaravrittyaharamaharankrishibhutva medovriddhimakurvanviharet
    | madhukarena karapatrenasyapatrena va kalam nayet | atmasammitamaharamaharedatmavanyatih | aharasya
    ca bhagau dvau tritiyamudakasya ca | vayoh sancaranarthaya caturthamavasheshayet ||59|| bhaikshena
    vartayennityam naikannashi bhavetkvacit | nirikshante tvanudvignastadgriham yatnato vrajet || 60||
    pancasaptagrihanam tu bhikshamicchetkriyavatam | godohamatramakankshennishkranto na punarvrajet ||
    61|| naktadvarashcopavasa upavasadayacitah | ayacitadvaram bhaikshyam tasmatbhaikshena vardhayet ||
    62|| naiva savyapasavyena bhikshakale vishedgrihan | natikramedgriham mohadyatra dosho na vidyate
    || 63|| shrotriyannam na bhiksheta shraddhabhaktibahishkritam | vratyasyapi grihe bhikshecchraddhabhaktipuraskrite
    || 64|| madhukaramasanklriptam prakpranitamayacitam | tatkalikam copapannam bhaiksham pancavidham
    smritam || 65|| manahsankalparahitamstringrihanpanca sapta va | madhumakshikavatkritva madhukaramiti
    smritam || 66|| pratahkale ca purvedyuryadbhaktaih prathitam muhuh | tadbhaiksham prakpranitam syatsthitim
    kuryattathapi va || 67|| bhikshatanasamudyogadyena kena nimantritam | ayacitam tu tadbhaiksham bhoktavyam
    ca mumukshubhih || 68|| upasthanena yatproktam bhikshartham brahmanena tat | tatkalikamiti khyatam
    bhoktavyam yatibhistada || 69|| siddhamannam yadanitam brahmanena matham prati | upapannamiti prahurmunayo
    mokshakankshinah || 70|| carenmadhukaram bhaiksham yatirmlecchakuladapi | ekannam natu bhunjita brihaspatisamadapi
    | yacitayacitabhyam ca bhikshabhyam kalpayetsthitam || 71|| na vayuh sparshadoshena nagnirdahanakarmana
    | napo mutrapurishabhyam nannadoshena maskari || 72|| vidhume sannamusale vyangare bhuktavajjane |
    kale'parahne bhuyishthe bhikshacaranamacaret || 73|| abhishatam ca patitam papandam devapujakam |
    varjayitva caredbhaiksham sarvavarneshu capadi || 74|| ghritam svamutrasadrisham madhu syatsuraya
    samam | tailam sukaramutram syatsupam lashunasammitam || 75|| mashapushadi gomamsam kshiram mutrasamam
    bhavet | tasmatsarvaprayatnena ghritadinvarjayedyatih | ghritasupadisamyuktamannam nadyatkadacana
    || 76|| patramasya bhavetpanistena nityam sthitim nayet | panipatrashcaranyogi nasakridbhaikshamacaret
    || 77|| asyena tu yadaharam govanmrigayate munih | tada samah syatsarveshu so'mritatvaya kalpate ||
    78|| ajyam rudhiramiva tyajedekatrannam palalamiva gandhalepanamashuddhalepanamiva ksharamantyajamiva
    vastramucchishtapatramivabhyangam strisangamiva mitrahladakam mutramiva spriham gomamsamiva jnatacaradesham
    candalavatikadiva striyamahimiva suvarnam kalakutamiva sabhasthalam shmashanasthalamiva rajadhanim
    kumbhipakamiva shavapindavadekatrannam na devatarcanam | prapancavrittim parityaya jivanmukto bhavet
    || asanam patralopashca sancayah shishyasancayah | divasvapo vrithalapo yaterbandhakarani shat ||
    79|| varshabhyo'nyatra yatsthanamasanam tadudahritam | utkalabvadipatranamekasyapiha sangrahah ||
    80|| yateh samvyavaharaya patralopah sa ucyate | grihitasya tu dandaderdvitiyasya parigrahah || 81||
    kalantaropabhogartham sancayah parikirtitah | shushrushalabhapujartham yashortham va parigrahah ||
    82|| shishyanam natu karunyacchishyasangraha iritah | vidya diva prakashatvadavidya ratrirucyate ||
    83|| vidyabhyase pramado yah sa divasvapa ucyate | adhyatmikim katham muktva bhikshavartam vina tatha
    || 84|| anugraham pariprashnam vrithajalpo'nya ucyate | ekannam madamatsaryam gandhapushpavibhushanam
    || 85|| tambulabhyanjane krida bhogakanksha rasayanam | katthanam kutsanam svasti jyotishca krayavikrayam
    || 86|| kriyakarmavivadashca guruvakyavilanghanam | sandhishca vigraho yanam mancakam shuklavastrakam
    || 87|| shuklotsargo divasvapo bhikshadharastu taijasam | visham caivayudham bijam himsam taikshnyam
    ca maithunam || 88|| tyaktam samnyasayogena grihadharmadikam vratam | gotradicaranam sarvam pitrimatrikulam
    dhanam | pratishiddhani caitani sevamano vrajedadhah || 89|| sujirno'pi sujirnasu vidvamstrishu na
    vishvaset | sujirnasvapi kanthasu sajjate jirnamambaram || 90|| sthavaram jangamam bijam taijasam
    vishamayudham | shadetani na grihniyadyatirmutrapurishavat || 91|| naivadadita patheyam yatih kincidanapadi
    | pakvamapatsu grinhiyadyavadannam na labhyate || 92|| nirujashca yuva caiva bhikshurnavasathe vaset
    | parartham na pratigrahyam na dadyacca kathancana || 93|| dainyabhavattu bhutanam saubhagaya yatishcaret
    | pakvam va yadi va'pakvam yacamano vrajedadhah || 94|| annapanaparo bhikshurvastradinam pratigrahi
    | avikam vanavikam va tatha pattapatanapi || 95|| pratigrihya yatishcaitanpatatyeva na samshayah |
    advaitam navamashritya jivanmuktatvamapnuyat || 96|| vagdande maunamatishtetkayadande tvabhojanam
    | manase tu krite dande pranayamo vidhiyate || 97|| karmana badhyate janturvidyaya ca vimucyate |
    tasmatkarma na kurvanti yatayah paradarshinah || 98|| rathyayam bahuvastrani bhiksha sarvatra labhyate
    | bhumih shayyasti vistirna yatayah kena duhkhitah || 99|| prapancamakhilam yastu jnanagnau juhuyadyatih
    | atmanyagninsamaropya so'gnihotri mahayatih || 100|| pravrittirdvividha prokta marjari caiva vanari
    | jnanabhyasavatamoturvanaribhaktvameva ca || 101|| naprishtah kasyacidbruyanna canyayena pricchatah
    | janannapi hi medhavi jadavallokamacaret || 102|| sarveshameva papanam sanghate samupasthite | taram
    dvadashasahasramabhyasecchedanam hi tat || 103|| yastu dvadashasahasram pranavam japate'nvaham | tasya
    dvadashabhirmasaih param brahma prakashate|| 104|| ityupanishat harih om tatsat || iti dvitiyo'dhyayah
    || 2|| om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca || sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakarana
  devanagari: त्कर्माचर विद्यादूरः । न परिव्राण्नामसङ्कीर्तनपरो यद्यत्कर्म करोति तत्तत्फलमनुभवति । एरण्डतैलफेनवत्सर्वं
    परित्यजेत् । न देवताप्रसादग्रहणम् । न बाह्यदेवाभ्यर्चनं कुर्यात् । स्वव्यतिरिक्तं सर्वं त्यक्त्वा
    मधुकरवृत्त्याहारमाहरन्कृशीभूत्वा मेदोवृद्धिमकुर्वन्विहरेत् । माधूकरेण करपात्रेणास्यपात्रेण वा कालं
    नयेत् । आत्मसंमितमाहारमाहरेदात्मवान्यतिः । आहारस्य च भागौ द्वौ तृतीयमुदकस्य च । वायोः सञ्चरणार्थाय
    चतुर्थमवशेषयेत् ॥५९॥ भैक्षेण वर्तयेन्नित्यं नैकान्नाशी भवेत्क्वचित् । निरीक्षन्ते त्वनुद्विग्नास्तद्गृहं
    यत्नतो व्रजेत् ॥ ६०॥ पञ्चसप्तगृहाणां तु भिक्षामिच्छेत्क्रियावताम् । गोदोहमात्रमाकाङ्क्षेन्निष्क्रान्तो
    न पुनर्व्रजेत् ॥ ६१॥ नक्ताद्वरश्चोपवास उपवासादयाचितः । अयाचिताद्वरं भैक्ष्यं तस्मात्भैक्षेण वर्धयेत्
    ॥ ६२॥ नैव सव्यापसव्येन भिक्षाकाले विशेद्गृहान् । नातिक्रामेद्गृहं मोहाद्यत्र दोषो न विद्यते ॥ ६३॥
    श्रोत्रियान्नं न भिक्षेत श्रद्धाभक्तिबहिष्कृतम् । व्रात्यस्यापि गृहे भिक्षेच्छ्रद्धाभक्तिपुरस्कृते
    ॥ ६४॥ माधूकरमसङ्क्लृप्तं प्राक्प्रणीतमयाचितम् । तात्कालिकं चोपपन्नं भैक्षं पञ्चविधं स्मृतम् ॥ ६५॥
    मनःसङ्कल्परहितांस्त्रीन्गृहान्पञ्च सप्त वा । मधुमक्षिकवत्कृत्वा माधूकरमिति स्मृतम् ॥ ६६॥ प्रातःकाले
    च पूर्वेद्युर्यद्भक्तैः प्राथितं मुहुः । तद्भैक्षं प्राक्प्रणीतं स्यात्स्थितिं कुर्यात्तथापि वा ॥
    ६७॥ भिक्षाटनसमुद्योगाद्येन केन निमन्त्रितम् । अयाचितं तु तद्भैक्षं भोक्तव्यं च मुमुक्षुभिः ॥ ६८॥ उपस्थानेन
    यत्प्रोक्तं भिक्षार्थं ब्राह्मणेन तत् । तात्कालिकमिति ख्यातं भोक्तव्यं यतिभिस्तदा ॥ ६९॥ सिद्धमन्नं
    यदानीतं ब्राह्मणेन मठं प्रति । उपपन्नमिति प्राहुर्मुनयो मोक्षकाङ्क्षिणः ॥ ७०॥ चरेन्माधूकरं भैक्षं
    यतिर्म्लेच्छकुलादपि । एकान्नं नतु भुञ्जीत बृहस्पतिसमादपि । याचितायाचिताभ्यां च भिक्षाभ्यां कल्पयेत्स्थितम्
    ॥ ७१॥ न वायुः स्पर्शदोषेण नाग्निर्दहनकर्मणा । नापो मूत्रपुरीषाभ्यां नान्नदोषेण मस्करी ॥ ७२॥ विधूमे
    सन्नमुसले व्यङ्गारे भुक्तवज्जने । कालेऽपराह्णे भूयिष्ठे भिक्षाचरणमाचरेत् ॥ ७३॥ अभिशतं च पतितं पापण्डं
    देवपूजकम् । वर्जयित्वा चरेद्भैक्षं सर्ववर्णेषु चापदि ॥ ७४॥ घृतं स्वमूत्रसदृशं मधु स्यात्सुरया समम्
    । तैलं सूकरमूत्रं स्यात्सूपं लशुनसंमितम् ॥ ७५॥ माषापूषादि गोमांसं क्षीरं मूत्रसमं भवेत् । तस्मात्सर्वप्रयत्नेन
    घृतादीन्वर्जयेद्यतिः । घृतसूपादिसंयुक्तमन्नं नाद्यात्कदाचन ॥ ७६॥ पात्रमस्य भवेत्पाणिस्तेन नित्यं स्थितिं
    नयेत् । पाणिपात्रश्चरन्योगी नासकृद्भैक्षमाचरेत् ॥ ७७॥ आस्येन तु यदाहारं गोवन्मृगयते मुनिः । तदा समः
    स्यात्सर्वेषु सोऽमृतत्वाय कल्पते ॥ ७८॥ आज्यं रुधिरमिव त्यजेदेकत्रान्नं पललमिव गन्धलेपनमशुद्धलेपनमिव
    क्षारमन्त्यजमिव वस्त्रमुच्छिष्टपात्रमिवाभ्यङ्गं स्त्रीसङ्गमिव मित्राह्लादकं मूत्रमिव स्पृहां गोमांसमिव
    ज्ञातचरदेशं चण्डालवाटिकादिव स्त्रियमहिमिव सुवर्णं कालकूटमिव सभास्थलं श्मशानस्थलमिव राजधानीं कुंभीपाकमिव
    शवपिण्डवदेकत्रान्नं न देवतार्चनम् । प्रपञ्चवृत्तिं परित्यय जीवन्मुक्तो भवेत् ॥ आसनं पात्रलोपश्च सञ्चयः
    शिष्यसञ्चयः । दिवास्वापो वृथालापो यतेर्बन्धकराणि षट् ॥ ७९॥ वर्षाभ्योऽन्यत्र यत्स्थानमासनं तदुदाहृतम्
    । उत्कालाब्वादिपात्राणामेकस्यापीह सङ्ग्रहः ॥ ८०॥ यतेः संव्यवहराय पात्रलोपः स उच्यते । गृहीतस्य तु
    दण्डादेर्द्वितीयस्य परिग्रहः ॥ ८१॥ कालान्तरोपभोगार्थं सञ्चयः परिकीर्तितः । शुश्रूषालाभपूजार्थं यशोर्थं
    वा परिग्रहः ॥ ८२॥ शिष्याणां नतु कारुण्याच्छिष्यसङ्ग्रह ईरितः । विद्या दिवा प्रकाशत्वादविद्या रात्रिरुच्यते
    ॥ ८३॥ विद्याभ्यासे प्रमादो यः स दिवास्वाप उच्यते । आध्यात्मिकीं कथां मुक्त्वा भिक्षावार्तां विना तथा
    ॥ ८४॥ अनुग्रहं परिप्रश्नं वृथाजल्पोऽन्य उच्यते । एकान्नं मदमात्सर्यं गन्धपुष्पविभूषणम् ॥ ८५॥ ताम्बूलाभ्यञ्जने
    क्रीडा भोगाकाङ्क्षा रसायनम् । कत्थनं कुत्सनं स्वस्ति ज्योतिश्च क्रयविक्रयम् ॥ ८६॥ क्रियाकर्मविवादश्च
    गुरुवाक्यविलङ्घनम् । सन्धिश्च विग्रहो यानं मञ्चकं शुक्लवस्त्रकम् ॥ ८७॥ शुक्लोत्सर्गो दिवास्वापो भिक्षाधारस्तु
    तैजसम् । विषं चैवायुधं बीजं हिंसां तैक्ष्ण्यं च मैथुनम् ॥ ८८॥ त्यक्तं संन्यासयोगेन गृहधर्मादिकं व्रतम्
    । गोत्रादिचरणं सर्वं पितृमातृकुलं धनम् । प्रतिषिद्धानि चैतानि सेवमानो व्रजेदधः ॥ ८९॥ सुजीर्णोऽपि सुजीर्णासु
    विद्वांस्त्रीषु न विश्वसेत् । सुजीर्णास्वपि कन्थासु सज्जते जीर्णमम्बरम् ॥ ९०॥ स्थावरं जङ्गमं बीजं
    तैजसं विषमायुधम् । षडेतानि न गृह्णीयाद्यतिर्मूत्रपुरीषवत् ॥ ९१॥ नैवाददीत पाथेयं यतिः किञ्चिदनापदि
    । पक्वमापत्सु गृण्हीयाद्यावदन्नं न लभ्यते ॥ ९२॥ नीरुजश्च युवा चैव भिक्षुर्नावसथे वसेत् । परार्थं न
    प्रतिग्राह्यं न दद्याच्च कथञ्चन ॥ ९३॥ दैन्यभावात्तु भूतानां सौभगाय यतिश्चरेत् । पक्वं वा यदि वाऽपक्वं
    याचमानो व्रजेदधः ॥ ९४॥ अन्नपानपरो भिक्षुर्वस्त्रादीनां प्रतिग्रही । आविकं वानाविकं वा तथा पट्टपटानपि
    ॥ ९५॥ प्रतिगृह्य यतिश्चैतान्पतत्येव न संशयः । अद्वैतं नावमाश्रित्य जीवन्मुक्तत्वमाप्नुयात् ॥ ९६॥ वाग्दण्डे
    मौनमातिष्टेत्कायदण्डे त्वभोजनम् । मानसे तु कृते दण्डे प्राणायामो विधीयते ॥ ९७॥ कर्मणा बध्यते जन्तुर्विद्यया
    च विमुच्यते । तस्मात्कर्म न कुर्वन्ति यतयः पारदर्शिनः ॥ ९८॥ रथ्यायां बहुवस्त्राणि भिक्षा सर्वत्र लभ्यते
    । भूमिः शय्यास्ति विस्तीर्णा यतयः केन दुःखितः ॥ ९९॥ प्रपञ्चमखिलं यस्तु ज्ञानाग्नौ जुहुयाद्यतिः । आत्मन्यग्नीन्समारोप्य
    सोऽग्निहोत्री महायतिः ॥ १००॥ प्रवृत्तिर्द्विविधा प्रोक्ता मार्जारी चैव वानरी । ज्ञानाभ्यासवतामोतुर्वानरीभाक्त्वमेव
    च ॥ १०१॥ नापृष्टः कस्यचिद्ब्रूयान्न चान्यायेन पृच्छतः । जानन्नपि हि मेधावी जडवल्लोकमाचरेत् ॥ १०२॥
    सर्वेषामेव पापानां सङ्घाते समुपस्थिते । तारं द्वादशसाहस्रमभ्यसेच्छेदनं हि तत् ॥ १०३॥ यस्तु द्वादशसाहस्रं
    प्रणवं जपतेऽन्वहम् । तस्य द्वादशभिर्मासैः परं ब्रह्म प्रकाशते॥ १०४॥ इत्युपनिषत् हरिः ॐ तत्सत् ॥ इति
    द्वितीयोऽध्यायः ॥ २॥ ॐ आप्यायन्तु मामाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च ॥ सर्वाणि
    सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरण
