id: hamsashtakastotram
category: stotram
name:
  english: hamsashtakastotram
  devanagari: हंसाष्टकस्तोत्रम्
content:
  english: karunarnava aura parabrahma shrikrishnasvarupa unako samagra vidha namana karate haim || 1||
    divyam rupadharam krishnam sarvadeva prapujitam | shrihamsa paramadharam pranamami prabhakaram ||
    2|| jo samasta devavrindom ke dvara paripujita haim aura parama adhara hai evam shrikrishna prabhu
    ne hi divya shrihamsa svarupa ko dharana kiya hai tatha jinaki asima anupama prabha hai aise shrihamsa
    bhagavan ko nitya pranama karate haim || 2|| nimbarkasampradayasya purvacaryamshca sarvada | svasampradayasarvasvam
    shrimaddhamsam hrida bhaje || 3|| shrinimbarka sampradaya ke parama kripa parayana samasta paramacaryom
    ko evam svakiya sampradaya ke sarvasva shrihamsa bhagavan ka apane antahkarana se sada bhajana karate
    haim || 3|| shrimadbhagavate yasya varnitam caritam priyam | tam shrihamsam sada vande sanakadyaih
    susevitam || 4|| shrimadbhagavata ke ekadasha skandha mem jinake divya carita ka subhaga varnana hai
    aura jagatsrashta brahmadeva ke carom manasa putra shrisanaka
  devanagari: करुणार्णव और परब्रह्म श्रीकृष्णस्वरूप उनको समग्र विधा नमन करते हैं ॥ १॥ दिव्यं रूपधरं कृष्णं
    सर्वदेव प्रपूजितम् । श्रीहंस परमाधारं प्रणमामि प्रभाकरम् ॥ २॥ जो समस्त देववृन्दों के द्वारा परिपूजित
    हैं और परम आधार है एवं श्रीकृष्ण प्रभु ने ही दिव्य श्रीहंस स्वरूप को धारण किया है तथा जिनकी असीम अनुपम
    प्रभा है ऐसे श्रीहंस भगवान् को नित्य प्रणाम करते हैं ॥ २॥ निम्बार्कसम्प्रदायस्य पूर्वाचार्यांश्च सर्वदा
    । स्वसम्प्रदायसर्वस्वं श्रीमद्धंसं हृदा भजे ॥ ३॥ श्रीनिम्बार्क सम्प्रदाय के परम कृपा परायण समस्त परमाचार्यों
    को एवं स्वकीय सम्प्रदाय के सर्वस्व श्रीहंस भगवान् का अपने अन्तःकरण से सदा भजन करते हैं ॥ ३॥ श्रीमद्भागवते
    यस्य वर्णितं चरितं प्रियम् । तं श्रीहंसं सदा वन्दे सनकाद्यैः सुसेवितम् ॥ ४॥ श्रीमद्भागवत के एकादश
    स्कन्ध में जिनके दिव्य चरित का सुभग वर्णन है और जगत्स्रष्टा ब्रह्मदेव के चारों मानस पुत्र श्रीसनक
