id: ghantasala-bhagavad-gita
category: stotram
name:
  english: Ghantasala Bhagavad Gita
content:
  english: '|| parthaya pratibodhitam bhagavata narayanena svayam | vyasena grathitam puranamunina madhye
    mahabharatam || advyaitamrita varshinim bhagavatim ashtadashadhyayinim | amba tvamanusandadhami bhagavadgite
    bhavadveshinim || bhagavadgita mahabharatamu yòkka samagra saramshamu bhaktudaina arjununaku ònarcina
    upadeshame gita saramshamu bharata yuddhamu jarugaradani sarva vidhamula bhagavanudu prayatnincènu
    kani a mahanubhavuni prayatnamulu vyarthamulayènu atu pimmata shrikrishnudu parthunaku sarathiyai
    nilicènu yuddha rangamuna arjununi korika meraku rathamunu nilipènu arjunudu ubhaya sainyamulalo gala
    tandrulanu || na kankshe vijayam krishna na ca rajyam sukhani ca | kim no rajyena govinda kim bhogairjivitena
    va || svajanamunu camputaku ishtapadaka ani dhanurbanamulanu krinda vaici duhkhitudaina arjununi cuci
    shrikrishna paramatma || ashocyananvashocastvam prajnavadamshca bhashase | gatasunagatasumshca nanushocanti
    panditah || duhkhimpa tagani varini gurci duhkhincuta anucitamu atmanatma vivekulu anityamulaina shariramulanu
    gurci gani shashvatamulu ayina atmalanu gurci gani duhkhimparu || dehinosminyatha dehe kaumaram yauvanam
    jara | tatha dehantarapraptih dhirastatra na muhyati || jivunaku dehamunandu balyamu maròka dehamunu
    pònduta kuda atle kanuku i vishayamuna dhirulu mohamu nòndaru || vasamsi jirnani yatha vihaya navani
    grihnati naroparani | tatha sharirani vihaya jirnani anyani samyati navani dehi || ètlu cinigina vastramunu
    vadali nutana vastramunu dharincuno jirnamaina shariramunu vadali kròtta shariramunu dharincucunnadi
    || nainam chindanti shastrani nainam dahati pavakah | na cainam kledayantyapo na shoshayati marutah
    || atmanu shastramulu chedimpajalavu vayuvu arpiveyanu samarthamu kadu || jatasya hi dhruvo mrityuh
    dhruvam janma mritasya ca | tasmadapariharyerthe na tvam shocitumarhasi || puttina vaniki maranamu
    tappadu maranincina vaniki janmamu tappadu anivaryamagu i vishayamunu gurci shokimpa tagadu || hato
    va prapsyasi svargam jitva va bhokshyase mahim | tasmaduttishtha kaunteya yuddhaya kritanishcayah
    || yuddhamuna maranincinaco vira svargamunu pòndèdavu jayincinaco rajyamunu bhogintuvu yuddhamunu
    ceya kritanishcyudavai lèmmu || karmanyevadhikaraste ma phaleshu kadacana | ma karmaphalaheturbhuh
    ma te sangostvakarmani || karmalanu acarincutayande niku adhikaramu kaladu kani vani phalitamu paina
    ledu nivu karma phalamunaku karanamu karadu karmalanu ceyuta manaradu || duhkheshvanudvignamanah sukheshu
    vigatasprihah | vitaragabhayakrodhah sthitadhirmunirucyate || duhkhamulu kaliginapudu digulu cèndani
    vadunu sukhamulu kaliginapudu spriha kolponi vadunu krodhamu poyinavadunu sthita prajnudani cèppabadunu
    || dhyayato vishayan pumsah sangasteshupajayate | sangat sanjayate kamah kamat bhavati sammohah sammohat
    smritivibhramah | smritibhramshad buddhinasho buddhinashat vishaya vanchalanu gurci sada mananamu
    ceyuvaniki vaniyandanuraga madhikamai krodhamu valana avivekamu kalugunu dinivalana jnapakashakti
    nashinci dani phalitamuga manujudu buddhini kolpoyi civaraku adhogati cèndunu || esha brahmi sthitih
    partha nainam prapya vimuhyati | sthitvasyamantakalepi brahmanirvanamricchati || atmajnana purvaka
    karmanushthanamu brahma prapti sadhanamu kaligina jivudu samsaramuna badaka sukhaika svarupamaina
    atma praptini cèndagaladu || lokesmin dvividha nishtha pura prokta mayanagha | jnanayogena sankhyanam
    karmayogena yoginam || i lokamulo atmanatma vivekamugala sanyasulaku jnanayogamu cetanu cittashuddhigala
    yogishvarulaku karmayogamu cetanu mukti kalugu cunnadani srishti adiyandu nace cèppabadiyunnadi ||
    annadbhavanti bhutani parjanyadannasambhavah | yajnadbhavati parjanyo yajnah karmasamudbhavah || annamuvalana
    jantujalamu puttunu varshamu valana annamu samakudunu yajnamu valana varshamu kalugunu a yajnamu karma
    valanane sambhavamu || evam pravartitam cakram nanuvartayatiha yah | aghayurindriyaramo mogham partha
    sa jivati || nace nadupabadu i lokamu anu cakramunubatti èvadu anusarimpado vadu indriyaloludai papa
    jivanudagucunnadu jnani kanivadu sada karmalanacarincucune yundavalènu || yadyadacarati shreshthastattadevetaro
    janah | sa yatpramanam kurute lokastadanuvartate || uttamulu ayinavaru deni nacarinturo danine itarulunu
    acarinturu uttamulu denini pramanamuga angikarinturo lokamantayu danine anusarintunu || mayi sarvani
    karmani sannyasyadhyatmacetasa | nirashirnirmamo bhutva yudhyasva vigatajvarah || nivònarcu samasta
    karmalanu nayandu samarpinci jnanamuce nishkamudavai santapamunu vadali yuddhamunu ceyumu || shreyan
    svadharmo vigunah paradharmatsvanushthitat | svadharme nidhanam shreyah paradharmo bhayavahah || cakkaga
    anushthimpabadina paradharmamukanna gunamu lenidainanu svadharmame melu atti dharmacaranamuna maranamu
    sambhavincinanu mele paradharmamu bhayankaramainadi || dhumenavriyate vahniryathadarsho malena ca
    | yatholbenavrito garbhastatha tenedamavritam || maviceta shishuvu yètlu kappabaduno atle kamamuceta
    jnanamu kappabadiyunnadi || yada yada hi dharmasya glanirbhavati bharata | abhyutthanamadharmasya
    tadatmanam srijamyaham || paritranaya sadhunam vinashaya ca dushkritam | dharmasamsthapanarthaya sambhavami
    yuge yuge || e kalamuna dharamamunaku hani kaluguno adharamamu vriddhi nònduno aya samayamulayandu
    shishtarakshana dharmasamrakshanamula kòraku prati yugamuna avataramunu dalcucunnanu || vitaragabhayakrodha
    manmaya mamupashritah | bahavo jnanatapasa puta madbhavamagatah || krodhamu vadili nayandu manassu
    lagnamu cesi ashrayincina satpurushulu jnanayogamuceta parishuddhulai na sannidhyamunu pòndiri ||
    ye yatha mam prapadyante tamstathaiva bhajamyaham | mama vartmanuvartante manushyah partha sarvashah
    || èvarèvaru yeye vidhamuga nannu tèliyagorucunnaro varini aya vidhamuluga nenu anugrahincucunnanu
    e òkkaniyandunu anuragamu kani || yasya sarve samarambhah kamasankalpavarjitah | jnanagnidagdhakarmanam
    tamahuh panditam budhah || èvari karmacaranamulu kama sankalpamulu kavo èvani karmalu jnanamanu nippuce
    kalpabadinavo attivanini panditudani vidvamsulu palkuduru || brahmarpanam brahma havih brahmagnau
    brahmana hutam | brahmaiva tena gantavyam brahma karma samadhina || yajnapatramu brahmamu homadravyamu
    brahmamu homamu ceyuvadu brahmamu brahma karma samadhiceta pòndanagu phalamu kuda brahmamaniye talancavalayunu
    || shraddhavanllabhate jnanam tatparah samyatendriyah | jnanam labdhva param shantimacirenadhigacchati
    || indriyanigrahamu galavadu jnanamunu pòndutaku samarthudagunu atti jnani utkrishtamaina mokshamunu
    pòndunu idi bhagavadgita yandu brahmavidyayanu yogashastramuna shrikrishnudu arjununakupa deshincina
    vishada jnana yogamulu samaptamu || sannyasah karmayogashca nihshreyasakaravubhau | tayostu karmasannyasatkarmayogo
    vishishyate || karma sanyasamulu rèndunu mokshasopanamulu andu karma parityagamu kanna karmanushthaname
    shreshtamainadi || brahmanyadhaya karmani sangam tyaktva karoti yah | lipyate na sa papena padmapatramivambhasa
    || èvadu phalapeksha kankshimpaka brahmarpanamuga karmalanacarincuno atadu tamarakuna nitibinduvulu
    antani ritiga papamuna cikkubadadu || jnanena tu tadajnanam yesham nashitamatmanah | teshamadityavajjnanam
    prakashayati tatparam || èvani ajnanamu jnanamuceta nashimpabaduno ataniki jnanamu suryuni valè prakashinci
    paramartha tatvamunu cupunu || vidyavinayasampanne brahmane gavi hastini | shuni caiva shvapake ca
    panditah samadarshinah || vidya vinaya sampannudagu brahmanuniyandunu shunakamamsamu vandukòni tinuvaniyandunu
    panditulu samadrishti kaligiyunduru || shaknotihaiva yah sodhum prakshariravimokshanat | kamakrodhodbhavam
    vegam sa yuktah sa sukhi narah || dehatyagamunaku mundu yèvadu kamakrodhadi arishdvargamula jayincuno
    attivadu yogi anabadunu || yatendriyamanobuddhirmunirmokshaparayanah | vigatecchabhayakrodho yah sada
    mukta eva sah || èvadu indriyamulanu jayinci drishtini bhrumadhyamuna nilipi pranapana vayuvulanu
    stambhimpajesi buddhini svadhinamònarcukòni mokshasaktudai unduno attivade muktudanabadunu || bhoktaram
    yajnatapasam sarvalokamaheshvaram | suhridam sarvabhutanam jnatva mam shantimricchati || sakala yajna
    tapah phalamulanu pònduvaniganu sakala prapanca niyamakuniganu nannu grahincina mahaniyudu mokshamunu
    pònducunnadu || yam sannyasamiti prahuryogam tam viddhi pandava | na hyasannyastasankalpo yogi bhavati
    kashcana || danine karmayogamaniyu anduru atti yèda sankalpatyaga mònarpanivadu yogi kajaladu || yuktaharaviharasya
    yuktaceshtasya karmasu | yuktasvapnavabodhasya yogo bhavati duhkhaha || yuktahara viharadulu karmacaranamu
    galavaniki atmasamyamana yogamu labhyamu || yatha dipo nivatastho nengate sopama smrita | yogino yatacittasya
    yunjato yogamatmanah || galilenicota pèttina dipamu nishcalamuga prakashinculagunane atmayoga mabhyasincinavani
    cittamu nishcalamuga nundunu || sarvabhutasthamatmanam sarvabhutani catmani | ikshate yogayuktatma
    sarvatra samadarshanah || sakala bhutamulayandu samadrishti kaliginavadu anni bhutamulu tana yandunu
    tananu anni bhutamulayandunu cucucundunu || asamshayam mahabaho mano durnigraham calam | abhyasena
    tu kaunteya vairagyena ca grihyate || èttivanikainanu manassunu nishcalamuga nilputa dussadhyame vairagyamulaceta
    nirodhimpavaccunu || yoginamapi sarvesham madgatenantaratmana | shraddhavanbhajate yo mam sa me yuktatamo
    matah || paripurna vishvasamuto nannashrayinci vinayamuto èvaru sevinci bhajinturo varu samasta yogulalo
    uttamulu || manushyanam sahasreshu kashcidyatati siddhaye | yatatamapi siddhanam kashcinmam vetti
    tattvatah || velakòladi janulalo e òkkado jnanasiddhi kòraku prayatnincunu atlu prayatnincina varilo
    òkanòkadu matrame nannu yadarthamuga tèlusu kònagalugucunnadu || bhumiraponalo vayuh kham mano buddhireva
    ca | ahankara itiyam me bhinna prakritirashtadha || ahankaramu ani na mayashakti ènimidi vidhamulaina
    bedhamulato òppi yunnadani grahimpumu || mattah parataram nanyatkincidasti dhananjaya | mayi sarvamidam
    protam sutre manigana iva || na kanna gòppavadugani gòppavastuvugani marediyu prapancamuna ledu sutramuna
    manulu gruccabadinatlu yi jagamantayu nayandu nikshiptamai unnadi || punyo gandhah prithivyam ca tejashcasmi
    vibhavasau | jivanam sarvabhuteshu tapashcasmi tapasvishu || yèlla bhutamulayandu ayuvu tapasvulayandu
    tapassu nenuga nèrugumu || daivi hyesha gunamayi mama maya duratyaya | mameva ye prapadyante mayametam
    taranti te || daiva sambandhamu agu na maya atikramimpa ranidi nannu sharanujòccina variki i maya
    sulabhasadhyamu || caturvidha bhajante mam janah sukritinorjuna | arto jijnasurartharthi jnani ca
    bharatarshabha || jnanulu anu nalugu vidhamulaina punyatmulu nannashrayincucunnaru || bahunam janmanamante
    jnanavanmam prapadyate | vasudevah sarvamiti sa mahatma sudurlabhah || jnana sampannudaina manavudu
    aneka janmamulèttina pimmata vijnaniyai nannu sharanamu nònducunnadu || antakale ca mameva smaranmuktva
    kalevaram | yah prayati sa madbhavam yati nastyatra samshayah || èvadu antyakalamuna nannu smarincucu
    shariramunu vadalucunnado vadu nanne cènducunnadu || abhyasayogayuktena cetasa nanyagamina | paramam
    purusham divyam yati parthanucintayan || kavim puranamanushasitaram anoraniyamsamanusmaredyah | sarvasya
    dhataramacintyarupam adityavarnam tamasah parastat || ekagra cittamuna divyarupudaina mahapurushuni
    smarincuno attivadu a paramapurushune cènducunnadu a mahapurushude sarvajnudu prapancamunaku shikshakudu
    anuhyamaina rupamu kalavadu surya kanti tejomayudu ajnanandhakaramunakanna itarudu || avyaktokshara
    ityuktastamahuh paramam gatim | yam prapya na nivartante taddhama paramam mama || indriya gocaramu
    kani parabrahmapadamu shashvatamainadi punarjanma rahitamaina a uttamapadame paramapadamu || shuklakrishne
    gati hyete jagatah shashvate mate | ekaya yatyanavrittimanyayavartate punah || jagattunandu shukla
    krishnamu lanèdi rèndu margamulu nityamuluga unnavi andu mòdati margamu valana janmarahityamu rèndava
    danivalana punarjanmamu kalugu cunnavi || vedeshu yajneshu tapahsu caiva daneshu yatpunyaphalam pradishtam
    | atyeti tatsarvamidam viditva yogi param sthanamupaiti cadyam || yogiyainavadu vedadhyayanamu valana
    yajnatapodanadula valana kalugu punyaphalamunu ashimpaka uttama padamaina brahmapadamunu pòndagaladu
    || sarvabhutani kaunteya prakritim yanti mamikam | kalpakshaye punastani kalpadau visrijamyaham ||
    pralayakalamuna sakala pranulunu na yandu linamagucunnavi marala kalpadi yandu sakala pranulanu nene
    srishtincu cunnanu || ananyashcintayanto mam ye janah paryupasate | tesham nityabhiyuktanam yogakshemam
    vahamyaham || e manavudu sarvakala sarvavasthalayandu nanne dhyanincu cunduno attivani yogakshemamulu
    nene vahincu cunnanu || patram pushpam phalam toyam yo me bhaktya prayacchati | tadaham bhaktyupahritamashnami
    prayatatmanah || èvadu bhaktito naku patramainanu udaka mainanu phalapeksha rahitamuga samarpincucunnado
    attivanini nenu pritito svikarincucunnanu || manmana bhava madbhakto madyaji mam namaskuru | mamevaishyasi
    yuktvaivamatmanam matparayanah || na yandu manassu lagnamu cesi yèlla kalamulayandu bhakti shraddhalato
    sthiracittudavai pujincitiveni nanne pòndagalavu idi upanishattula saramshamaina yogashastramuna shrikrishnudu
    arjununakupa deshincina karmasanyasa raja vidya rajaguhya yogamulu samaptamu || maharshayah sapta
    purve catvaro manavastatha | madbhava manasa jata yesham loka imah prajah || kashyapadi maharshi saptakamu
    svayambhuvadi manuvulu na valanane janminciri pimmata vari valana èlla lokamulandali samasta bhutamulunu
    janmincènu || maccitta madgataprana bodhayantah parasparam | kathayantashca mam nityam tushyanti ca
    ramanti ca || panditulu nayandu cittamugalavarai na yande tama pranamulunci na mahimanubhava mèringi
    òkarikòkaru upadeshamulu gavincukòncu brahma nandamunu anubhavincucunnaru || ahamatma gudakesha sarvabhutashayasthitah
    | ahamadishca madhyam ca bhutanamanta eva ca || samasta bhutamula manassulandunna paramatma svarupudanu
    nene nashamulaku nene karakudanu || vedanam samavedosmi devanamasmi vasavah | indriyanam manashcasmi
    bhutanamasmi cetana || devatalalo devendrudu indriyamulalo manassu pranulandari buddhi nene || prahladashcasmi
    daityanam kalah kalayatamaham | mriganam ca mrigendroham vainateyashca pakshinam || rakshasulalo prahladudu
    pakshulalo garutmantudu nene || yadyadvibhutimatsattvam shrimadurjitameva va | tattadevavagaccha tvam
    mama tejomshasambhavam || lokamunandu aishvarya yuktamai kanti yuktamaina samasta vastuvulu na tejo
    bhagamu valanane sampraptamagunu || pashya me partha rupani shatashotha sahasrashah | nanavidhani
    divyani nanavarnakritini ca || aneka varnamulai aneka visheshamulagu na sasvarupamunu kannulara darshimpumu
    || pashyami devamstava deva dehe sarvamstatha bhutavisheshasanghan | brahmanamisham kamalasanastham
    rishimshca sarvanuragamshca divyan || anekabahudaravaktranetram pashyami tvam sarvatonantarupam |
    nantam na madhyam na punastavadim pashyami vishveshvara vishvarupa || damshtrakaralani ca te mukhani
    drishtvaiva kalanalasannibhani | disho na jane na labhe ca sharma prasida devesha jagannivasa || vasuki
    mòdalaguga gala sarpamulu niyandu naku gocaramagucunnavi ni vishvarupamu aneka bahuvulato mukhamulato
    òppiyunnadi atlaiyu ni akaramuna adyanta madhyamulanu gurtimpa jala kunnanu koralace bhayankaramai
    pralayagni samanamulaina ni mukhamulanu cucutavalana naku dikkulu tèliyakunnavi nayandu daya yunci
    naku prasannudavu gammu || kalosmi lokakshayakritpravriddho lokamsamahartumiha pravrittah | ritepi
    tvam na bhavishyanti sarve yevasthitah pratyanikeshu yodhah || i prapancamunèlla nashimpajeyu balishthamaina
    kala svarupudanu nene i yuddhamunaku siddhapadina varini nivu campakunnanu bratuka galavarindèvvarunu
    leru || dronam ca bhishmam ca jayadratham ca karnam tathanyanapi yodhaviran | maya hatamstvam jahi
    mavyathishtha yudhyasva jetasi rane sapatnan || jayadradha karnadhi yodha virulu nace samharimpabadiri
    ika migilina shatri virulanu nivu samharimpumu || kiritinam gadinam cakrahastam | icchami tvam drashtumaham
    tathaiva | tenaiva rupena caturbhujena | sahasrabaho bhava vishvamurte || aneka bhujamulugala ni vishvarupamunu
    upasamharinci kiritamu cakramu dharincina ni sahaja sundaramaina svarupamunu darshimpagoru cunnanu
    krishna || sudurdarshamidam rupam drishtvanasi yanmama | deva apyasya rupasya nityam darshanakankshinah
    || nivu darshincina i na svarupamunu èvvarunu cudajalaru i vishvarupamunu darshimpa devatalandarunu
    sada korucunduru || mayyaveshya mano ye mam nityayukta upasate | shraddhaya parayopetah te me yuktatama
    matah èvaru nayande manassu lagnamu cesi shrddhabhaktulato nannu dhyanincu cunnaro attivaru atyantamu
    naku pritipatrulu || shreyo hi jnanamabhyasajjnanad dhyanam vishishyate | dhyanatkarmaphalatyagastyagacchantiranantaram
    || abhyasayogamukanna jnanamu jnanamu kanna dhyanamu danikanna karma phalatyagamu shreshthamu atti
    tyagamuvalla samsara bandhanamu tòlagi mokshaprapti sanbhavincucunnadi || anapekshah shucirdaksha
    udasino gatavyathah | sarvarambhaparityagi yo madbhaktah sa me priyah || èvadu korikalu lenivadai
    pakshapata rahitudai bhayamunu vidi karmaphla tyagiyai naku bhaktudaguno attivadu naku mikkili pritipatrudu
    || samah shatrau ca mitre ca tatha manapamanayoh | shitoshnasukhaduhkheshu samah sangavivarjitah ||
    tulyanindastutirmauni santushto yena kenacit | aniketah sthiramatirbhaktimanme priyo narah || shitoshna
    sukha duhkhadulayandunu samabuddhi kaligi calincani manassu kalavadai nayandu bhakti prapattulu cupu
    manavudu naku pritipatrudu || idam shariram kaunteya kshetramityabhidhiyate | etadyo vetti tam prahuh
    kshetrajna iti tadvidah || dehamunèriginavadu kshetrajnudaniyu pèddalu cèppuduru || adhyatmajnananityatvam
    tattvajnanarthadarshanam | etajjnanamiti proktamajnanam yadatonyatha || atma jnanamunandu manassu
    lagnamu ceyuta maukshaprapti yandu drishti kaligiyunduta jnana margamulanaiyu vaniki itaramulainavi
    ajnanamulaniyu cèppabadunu || karyakaranakartritve hetuh prakritirucyate | purushah sukhaduhkhanam
    bhoktritve heturucyate || adi sharira sukhaduhkhadulanu tèliyajeyunu kshetrajnudu a sukha duhkhamulanu
    anubhavincucundunu || samam sarveshu bhuteshu tishthantam parameshvaram | vinashyatsvavinashyantam
    yah pashyati sa pashyati || shariramu nashincinanu tanu sashimpaka yèvadu samasta bhutamulandunna
    parameshvaruni cucuno vade yèriginavadu || anaditvannirgunatvatparamatmayamavyayah | sharirasthopi
    kaunteya na karoti na lipyate || guna nashana rahitudainavadu paramatma atti paramatma dehanta rgatudayyunu
    karmala nacarincuvadu kadu || yatha prakashayatyekah kritsnam lokamimam ravih | kshetram kshetri tatha
    kritsnam prakashayati bharata || suryudòkkade yèlla jagattulanu e vidhamuga prakashimpajeyucunnado
    a vidhamugane kshetrajnudu yèlla dehamulanu prakashimpajeyucunnadu idi upanishattula saramshamaina
    gitashastramandu shrikrishnudu arjununakupa deshincina vibhuti yogamu vishvarupa sandarshana yogamu
    kshetra kshetrajna vibhaga yogamulu samaptamu || param bhuyah pravakshyami jnananam jnanamuttamam
    | yajjnatva munayah sarve param siddhimito gatah || jnanarjanamuna mahaniyulaina rishishvarulu mokshmunu
    pòndiri atti mahattaramaina jnanamunu niku upadeshincucunnanu || sarvayonishu kaunteya murtayah sambhavanti
    yah | tasam brahma mahadyoniraham bijapradah pita || prapancamuna janmincu èlla caracara samuhamulaku
    prakriti talli vantidi nenu tandri vantivadanu || tatra sattvam nirmalatvatprakashakamanamayam | sukhasangena
    badhnati jnanasangena canagha || trigunamulalo sattvagunamu nirmalamagutanjesi sukha jnanabhi lashalaceta
    atmanu dehamunandu bandhincucunnadi || rajo ragatmakam viddhi trishnasangasamudbhavam | tannibadhnati
    kaunteya karmasangena dehinam || rajogunamu korikalayandu abhimanamu anuragamu puttinci atmanu bandhincucunnadi
    || tamastvajnanajam viddhi mohanam sarvadehinam | pramadalasyanidrabhistannibadhnati bharata || ajnanamuvalana
    puttunadi tamogunamu adi sarva pranulanu mohimpajeyunadi a gunamu manujuni alasyamutonu nidra tonu
    baddhuni ceyunu || manapamanayostulyastulyo mitraripakshayoh | sarvarambhaparityagi gunatitah sa ucyate
    || shatrumitrulayandu samamaina manassu galavanini trigunatitudanduru || urdhvamulamadhahshakhamashvattham
    prahuravyayam | chandamsi yasya parnani yastam veda sa vedavit || nikrishnamaina ahankaramu kòmmalugagala
    ashvattha vrikshamu anadi ayinadi atti samsara vrikshmunaku vedamulu akuluvantivi atti dani nèringinavade
    vedartha sara mèringinavadu || na tadbhasayate suryo na shashanko na pavakah | yadgatva na nivartante
    taddhama paramam mama || punaravritti rahitamaina mokshapathamu surya candragnula prakashamuna katitamai
    na uttama pathamai yunnadi || aham vaishvanaro bhutva praninam dehamashritah | pranapanasamayuktah
    pacamyannam caturvidham || dehulandu jatharagni svarupudanai varu bhujincu bhakshya lehya padarthamula
    jirnamu ceyucunnanu || tejah kshama dhritih shaucamadroho natimanita | bhavanti sampadam daivimabhijatasya
    bharata || dambho darpobhimanashca krodhah parushyameva ca | ajnanam cabhijatasya partha sampadamasurim
    || itarula vancimpakunduta mòdalagu gunamulu daivamsha sambhutulakundunu avivekamu mòdalagu gunamulu
    rakshasamsha sambhutulakundunu || trividham narakasyedam dvaram nashanamatmanah | kamah krodhastatha
    lobhastasmadetattrayam tyajet || lobhamulu atmanu nashanamu ceyunu avi naraka praptiki hetuvulu kavuna
    vanini vadili veya valayunu || yah shastravidhimutsrijya vartate kamakaratah | na sa siddhimavapnoti
    na sukham na param gatim || shastra vishayamula nanusarimpaka iccha margamuna pravartincuvadu sukha
    siddhulanu pòndajaladu || trividha bhavati shraddha dehinam sa svabhavaja | sattviki rajasi caiva
    tamasi ceti tam shrinu || jivulaku gala shraddha purva janma vasana balamu valana labhyamu tamasamulani
    mudu vidhamulaga unnadi || yajante sattvika devanyaksharakshamsi rajasah | pretanbhutaganamshcanye
    yajante tamasa janah || sattvagunulu devatalanu rajogunulu yaksha rakshasulanu tamogunulu bhuta preta
    ganambulanu shraddha bhaktulato pujincuduru || anudvegakaram vakyam satyam priyahitam ca yat | svadhyayabhyasanam
    caiva vanmayam tapa ucyate || itarula manassula nòppimpanidiyu hitamulato kudina satya bhashanamu
    vedadhyana mònarcuta vacaka tapassani cèppabadunu || kamyanam karmanam nyasam sannyasam kavayo viduh
    | sarvakarmaphalatyagam prahustyagam vicakshanah || jyotishthomadi karmala nacarimpakunduta sanyasamaniyu
    karmaphalamu yishvararpana mònarcuta tyagamaniyu pèddalu cèppuduru || anishtamishtam mishram ca trividham
    karmanah phalam | bhavatyatyaginam pretya na tu sannyasinam kvacit || karmaphalamulu priyamulu priyatipriyamulu
    ani mudu vidhamulu karmaphalamunalu korinavaru janmantaramandu a phalamulanu pònducunnaru koranivaru
    a phalamulanu janmantaramuna pòndajala kunnaru || pravrittim ca nivrittim ca karyakarye bhayabhaye
    | bandham moksham ca ya vetti buddhih sa partha sattviki || bandha mokshamula e jnanamèrugucunnado
    adi sattvaguna samudbhavamani èrugumu || ishvarah sarvabhutanam hriddesherjuna tishthati | bhramayamsarvabhutani
    yantrarudhani mayaya || ishvarudu yèlla bhutamulaku niyamakudai pranula hridayamandunnavadai jantragadu
    bòmmalanadincu ritiga pranula bhramimpajeyucunnadu || sarvadharmamparityajya mamekam sharanam vraja
    | aham tvam sarvapapebhyo mokshyayishyami ma shucah || samasta karmalanu nakarpinci èlla papamulanundi
    ninnu vimuktuni gavintunu || ya idam paramam guhyam madbhakteshvabhidhasyati | bhaktim mayi param
    kritva mamevaishyatyasamshayah || parama rahasyamaina yi gitashastramunu na bhaktula kupadeshamu ceyucunnado
    vadu mokshamuna karhudu || kaccidetacchrutam partha tvayaikagrena cetasa | kaccidajnanasammohah pranashtaste
    dhananjaya || parama gopyamaina yi gita shastramunu cakkaga vintiva ni yajnana janitamaina avivekamu
    nashincinada || nashto mohah smritirlabdha tvatprasadanmayacyuta | sthitosmi gatasandehah karishye
    vacanam tava || na avivekamu ni daya valana tòlagènu naku sujnanamu labhincinadi naku sandehamulanniyu
    tòlaginavi ni ajnanu shirasavahincèdanu || yatra yogeshvarah krishno yatra partho dhanurdharah | tatra
    shrirvijayo bhutirdhruva nitirmatirmama || yogishvarudagu shrikrishnudu dhanurdhariyagu arjunudu yècatanunduro
    acata sampada sthiramagu nitiyundunu gitashastramidam punyam yah pathet prayatah puman | vishnòh padamavapnoti
    bhaya shokadi varjitah || gitashastramunu èvaru pathinturo varu bhaya shokadi varjitulai vishnu sayujyamunu
    pònduduru idi upanishattula saramshamaina gitashastramandu shrikrishnudu arjununakupadeshincina gunatraya
    vibhaga mokshasanyasa yogamulu sarvamu samaptamu om sarvejanah sukhino bhavantu samasta sanmagalani
    bhavantu asatoma sadgamaya tamasoma jyotirgamaya mrityorma amritangamaya om shantih shantih shantih'
  devanagari: ॥ पार्थाय प्रतिबोधितां भगवता नारायणेन स्वयम् । व्यासेन ग्रथितां पुराणमुनिना मध्ये महाभारतम्
    ॥ अद्व्यैतामृत वर्षिणीं भगवतीं अष्टादशाध्यायिनीम् । अम्बा त्वामनुसन्दधामि भगवद्गीते भवद्वेषिणीम् ॥
    भगवद्गीत महाभारतमु यॊक्क समग्र सारांशमु भक्तुडैन अर्जुनुनकु ऒनर्चिन उपदेशमे गीता सारांशमु भारत युद्धमु
    जरुगरादनि सर्व विधमुल भगवानुडु प्रयत्निञ्चॆनु कानि आ महानुभावुनि प्रयत्नमुलु व्यर्थमुलायॆनु अटु पिम्मट
    श्रीकृष्णुडु पार्थुनकु सारथियै निलिचॆनु युद्ध रङ्गमुन अर्जुनुनि कोरिक मेरकु रथमुनु निलिपॆनु अर्जुनुडु
    उभय सैन्यमुललो गल तण्ड्रुलनु ॥ न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च । किं नो राज्येन गोविन्द
    किं भोगैर्जीवितेन वा ॥ स्वजनमुनु चम्पुटकु इष्टपडक अनि धनुर्बाणमुलनु क्रिन्द वैचि दुःखितुडैन अर्जुनुनि
    चूचि श्रीकृष्ण परमात्म ॥ अशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे । गतासूनगतासूंश्च नानुशोचन्ति
    पण्डिताः ॥ दुःखिम्प तगनि वारिनि गूर्चि दुःखिञ्चुट अनुचितमु आत्मानात्म विवेकुलु अनित्यमुलैन शरीरमुलनु
    गूर्चि गानि शाश्वतमुलू अयिन आत्मलनु गूर्चि गानि दुःखिम्परु ॥ देहिनोस्मिन्यथा देहे कौमारं यौवनं जरा
    । तथा देहान्तरप्राप्तिः धीरस्तत्र न मुह्यति ॥ जीवुनकु देहमुनन्दु बाल्यमु मरॊक देहमुनु पॊन्दुट कूडा
    अट्ले कनुकु ई विषयमुन धीरुलु मोहमु नॊन्दरु ॥ वासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोपराणि ।
    तथा शरीराणि विहाय जीर्णानि अन्यानि संयाति नवानि देही ॥ ऎट्लु चिनिगिन वस्त्रमुनु वदलि नूतन वस्त्रमुनु
    धरिञ्चुनो जीर्णमैन शरीरमुनु वदलि क्रॊत्त शरीरमुनु धरिञ्चुचुन्नदि ॥ नैनं छिन्दन्ति शस्त्राणि नैनं दहति
    पावकः । न चैनं क्लेदयन्त्यापो न शोषयति मारुतः ॥ आत्मनु शस्त्रमुलु छेदिम्पजालवु वायुवु आर्पिवेयनू समर्थमु
    कादु ॥ जातस्य हि ध्रुवो मृत्युः ध्रुवं जन्म मृतस्य च । तस्मादपरिहार्येर्थे न त्वं शोचितुमर्हसि ॥ पुट्टिन
    वानिकि मरणमु तप्पदु मरणिञ्चिन वानिकि जन्ममु तप्पदु अनिवार्यमगु ई विषयमुनु गूर्चि शोकिम्प तगदु ॥ हतो
    वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम् । तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः ॥ युद्धमुन
    मरणिञ्चिनचो वीर स्वर्गमुनु पॊन्दॆदवु जयिञ्चिनचो राज्यमुनु भोगिन्तुवु युद्धमुनु चेय कृतनिश्च्युडवै
    लॆम्मु ॥ कर्मण्येवाधिकारस्ते मा फलेषु कदाचन । मा कर्मफलहेतुर्भूः मा ते सङ्गोस्त्वकर्मणि ॥ कर्मलनु
    आचरिञ्चुटयन्दे नीकु अधिकारमु कलदु कानि वानि फलितमु पैन लेदु नीवु कर्म फलमुनकु कारणमु कारादु कर्मलनु
    चेयुट मानरादु ॥ दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः । वीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते ॥ दुःखमुलु
    कलिगिनपुडु दिगुलु चॆन्दनि वाडुनु सुखमुलु कलिगिनपुडु स्पृह कोल्पोनि वाडुनु क्रोधमू पोयिनवाडुनु स्थित
    प्रज्ञुडनि चॆप्पबडुनु ॥ ध्यायतो विषयान् पुंसः सङ्गस्तेषूपजायते । सङ्गात् सञ्जायते कामः कामात् भवति
    सम्मोहः सम्मोहात् स्मृतिविभ्रमः । स्मृतिभ्रंशाद् बुद्धिनाशो बुद्धिनाशात् विषय वाञ्छलनु गूर्चि सदा
    मननमु चेयुवानिकि वानियन्दनुराग मधिकमै क्रोधमु वलन अविवेकमु कलुगुनु दीनिवलन ज्ञापकशक्ति नशिञ्चि दानि
    फलितमुगा मनुजुडु बुद्धिनि कोल्पोयि चिवरकु अधोगति चॆन्दुनु ॥ एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य
    विमुह्यति । स्थित्वास्यामन्तकालेपि ब्रह्मनिर्वाणमृच्छति ॥ आत्मज्ञान पूर्वक कर्मानुष्ठानमु ब्रह्म प्राप्ति
    साधनमु कलिगिन जीवुडु संसारमुन बडक सुखैक स्वरूपमैन आत्म प्राप्तिनि चॆन्दगलडु ॥ लोकेस्मिन् द्विविधा
    निष्ठा पुरा प्रोक्ता मयानघ । ज्ञानयोगेन साङ्ख्यानां कर्मयोगेन योगिनाम् ॥ ई लोकमुलो आत्मानात्म विवेकमुगल
    सन्यासुलकु ज्ञानयोगमु चेतनु चित्तशुद्धिगल योगीश्वरुलकु कर्मयोगमु चेतनु मुक्ति कलुगु चुन्नदनि सृष्टि
    आदियन्दु नाचे चॆप्पबडियुन्नदि ॥ अन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः । यज्ञाद्भवति पर्जन्यो यज्ञः
    कर्मसमुद्भवः ॥ अन्नमुवलन जन्तुजालमु पुट्टुनु वर्षमु वलन अन्नमु समकूडुनु यज्ञमु वलन वर्षमु कलुगुनु
    आ यज्ञमु कर्म वलनने सम्भवमु ॥ एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः । अघायुरिन्द्रियारामो मोघं पार्थ
    स जीवति ॥ नाचे नडुपबडु ई लोकमु अनु चक्रमुनुबट्टि ऎवडु अनुसरिम्पडो वाडु इन्द्रियलोलुडै पाप जीवनुडगुचुन्नाडु
    ज्ञानि कानिवाडु सदा कर्मलनाचरिञ्चुचुने युण्डवलॆनु ॥ यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः । स यत्प्रमाणं
    कुरुते लोकस्तदनुवर्तते ॥ उत्तमुलु अयिनवारु देनि नाचरिन्तुरो दानिने इतरुलुनु आचरिन्तुरु उत्तमुलु देनिनि
    प्रमाणमुगा अङ्गीकरिन्तुरो लोकमन्तयू दानिने अनुसरिन्तुनु ॥ मयि सर्वाणि कर्माणि सन्न्यस्याध्यात्मचेतसा
    । निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः ॥ नीवॊनर्चु समस्त कर्मलनू नायन्दु समर्पिञ्चि ज्ञानमुचे
    निष्कामुडवै सन्तापमुनु वदलि युद्धमुनु चेयुमु ॥ श्रेयान् स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् । स्वधर्मे
    निधनं श्रेयः परधर्मो भयावहः ॥ चक्कगा अनुष्ठिम्पबडिन परधर्ममुकन्न गुणमु लेनिदैननू स्वधर्ममे मेलु अट्टि
    धर्माचरणमुन मरणमु सम्भविञ्चिननू मेले परधर्ममु भयङ्करमैनदि ॥ धूमेनाव्रियते वह्निर्यथादर्शो मलेन च ।
    यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम् ॥ माविचेत शिशुवु यॆट्लु कप्पबडुनो अट्ले काममुचेत ज्ञानमु कप्पबडियुन्नदि
    ॥ यदा यदा हि धर्मस्य ग्लानिर्भवति भारत । अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥ परित्राणाय साधूनां
    विनाशाय च दुष्कृताम् । धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥ ए कालमुन धरममुनकु हानि कलुगुनो अधरममु
    वृद्धि नॊन्दुनो आया समयमुलयन्दु शिष्टरक्षण धर्मसंरक्षणमुल कॊरकु प्रति युगमुन अवतारमुनु दाल्चुचुन्नानु
    ॥ वीतरागभयक्रोधा मन्मया मामुपाश्रिताः । बहवो ज्ञानतपसा पूता मद्भावमागताः ॥ क्रोधमू वदिलि नायन्दु मनस्सु
    लग्नमु चेसि आश्रयिञ्चिन सत्पुरुषुलु ज्ञानयोगमुचेत परिशुद्धुलै ना सान्निध्यमुनु पॊन्दिरि ॥ ये यथा मां
    प्रपद्यन्ते तांस्तथैव भजाम्यहम् । मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ॥ ऎवरॆवरु येये विधमुगा
    नन्नु तॆलियगोरुचुन्नारो वारिनि आया विधमुलुगा नेनु अनुग्रहिञ्चुचुन्नानु ए ऒक्कनियन्दुनु अनुरागमु कानि
    ॥ यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः । ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः ॥ ऎवरि कर्माचरणमुलु
    काम सङ्कल्पमुलु कावो ऎवनि कर्मलु ज्ञानमनु निप्पुचे काल्पबडिनवो अट्टिवानिनि पण्डितुडनि विद्वांसुलु
    पल्कुदुरु ॥ ब्रह्मार्पणं ब्रह्म हविः ब्रह्माग्नौ ब्रह्मणा हुतम् । ब्रह्मैव तेन गन्तव्यं ब्रह्म कर्म
    समाधिना ॥ यज्ञपात्रमु ब्रह्ममु होमद्रव्यमु ब्रह्ममु होममु चेयुवाडु ब्रह्ममु ब्रह्म कर्म समाधिचेत पॊन्दनगु
    फलमु कूडा ब्रह्ममनिये तलञ्चवलयुनु ॥ श्रद्धावान्ल्लभते ज्ञानं तत्परः संयतेन्द्रियः । ज्ञानं लब्ध्वा
    परां शान्तिमचिरेणाधिगच्छति ॥ इन्द्रियनिग्रहमु गलवाडु ज्ञानमुनु पॊन्दुटकु समर्थुडगुनु अट्टि ज्ञानि
    उत्कृष्टमैन मोक्षमुनु पॊन्दुनु इदि भगवद्गीत यन्दु ब्रह्मविद्ययनु योगशास्त्रमुन श्रीकृष्णुडु अर्जुनुनकुप
    देशिञ्चिन विषाद ज्ञान योगमुलु समाप्तमु ॥ सन्न्यासः कर्मयोगश्च निःश्रेयसकरावुभौ । तयोस्तु कर्मसन्न्यासात्कर्मयोगो
    विशिष्यते ॥ कर्म सन्यासमुलु रॆण्डुनू मोक्षसोपानमुलु अन्दु कर्म परित्यागमु कन्न कर्मानुष्ठानमे श्रेष्टमैनदि
    ॥ ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः । लिप्यते न स पापेन पद्मपत्रमिवाम्भसा ॥ ऎवडु फलापेक्ष
    काङ्क्षिम्पक ब्रह्मार्पणमुगा कर्मलनाचरिञ्चुनो अतडु तामराकुन नीटिबिन्दुवुलु अन्टनि रीतिगा पापमुन चिक्कुबडडु
    ॥ ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः । तेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम् ॥ ऎवनि अज्ञानमु
    ज्ञानमुचेत नशिम्पबडुनो अतनिकि ज्ञानमु सूर्युनि वलॆ प्रकाशिञ्चि परमार्थ तत्वमुनु चूपुनु ॥ विद्याविनयसम्पन्ने
    ब्राह्मणे गवि हस्तिनि । शुनि चैव श्वपाके च पण्डिताः समदर्शिनः ॥ विद्या विनय सम्पन्नुडगु ब्राह्मणुनियन्दुनू
    शुनकमाम्समु वण्डुकॊनि तिनुवानियन्दुनू पण्डितुलु समदृष्टि कलिगियुन्दुरु ॥ शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात्
    । कामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः ॥ देहत्यागमुनकु मुन्दु यॆवडु कामक्रोधादि अरिष्ड्वर्गमुल
    जयिञ्चुनो अट्टिवाडु योगि अनबडुनु ॥ यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः । विगतेच्छाभयक्रोधो यः सदा
    मुक्त एव सः ॥ ऎवडु इन्द्रियमुलनु जयिञ्चि दृष्टिनि भ्रूमध्यमुन निलिपि प्राणापान वायुवुलनु स्तम्भिम्पजेसि
    बुद्धिनी स्वाधीनमॊनर्चुकॊनि मोक्षासक्तुडै उण्डुनो अट्टिवाडे मुक्तुडनबडुनु ॥ भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्
    । सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति ॥ सकल यज्ञ तपः फलमुलनु पॊन्दुवानिगनू सकल प्रपञ्च नियामकुनिगनू
    नन्नु ग्रहिञ्चिन महनीयुडु मोक्षमुनु पॊन्दुचुन्नाडु ॥ यं सन्न्यासमिति प्राहुर्योगं तं विद्धि पाण्डव
    । न ह्यसन्न्यस्तसङ्कल्पो योगी भवति कश्चन ॥ दानिने कर्मयोगमनियू अन्दुरु अट्टि यॆड सङ्कल्पत्याग मॊनर्पनिवाडु
    योगि काजालडु ॥ युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु । युक्तस्वप्नावबोधस्य योगो भवति दुःखहा ॥ युक्ताहार
    विहारादुलु कर्माचरणमु गलवानिकि आत्मसम्यमन योगमु लभ्यमु ॥ यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता ।
    योगिनो यतचित्तस्य युञ्जतो योगमात्मनः ॥ गालिलेनिचोट पॆट्टिन दीपमु निश्चलमुगा प्रकाशिञ्चुलागुनने आत्मयोग
    मभ्यसिञ्चिनवानि चित्तमु निश्चलमुगा नुण्डुनु ॥ सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि । ईक्षते योगयुक्तात्मा
    सर्वत्र समदर्शनः ॥ सकल भूतमुलयन्दू समदृष्टि कलिगिनवाडु अन्नि भूतमुलु तन यन्दुनू तननु अन्नि भूतमुलयन्दुनू
    चूचुचुण्डुनु ॥ असंशयं महाबाहो मनो दुर्निग्रहं चलम् । अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ॥ ऎट्टिवानिकैननू
    मनस्सुनु निश्चलमुगा निल्पुट दुस्साध्यमे वैराग्यमुलचेत निरोधिम्पवच्चुनु ॥ योगिनामपि सर्वेषां मद्गतेनान्तरात्मना
    । श्रद्धावान्भजते यो मां स मे युक्ततमो मतः ॥ परिपूर्ण विश्वासमुतो नन्नाश्रयिञ्चि विनयमुतो ऎवरु सेविञ्चि
    भजिन्तुरो वारु समस्त योगुललो उत्तमुलु ॥ मनुष्याणां सहस्रेषु कश्चिद्यतति सिद्धये । यततामपि सिद्धानां
    कश्चिन्मां वेत्ति तत्त्वतः ॥ वेलकॊलदि जनुललो ए ऒक्कडो ज्ञानसिद्धि कॊरकु प्रयत्निञ्चुनु अट्लु प्रयत्निञ्चिन
    वारिलो ऒकानॊकडु मात्रमे नन्नु यदार्थमुगा तॆलुसु कॊनगलुगुचुन्नाडु ॥ भूमिरापोनलो वायुः खं मनो बुद्धिरेव
    च । अहङ्कार इतीयं मे भिन्ना प्रकृतिरष्टधा ॥ अहङ्कारमु अनि ना मायाशक्ति ऎनिमिदि विधमुलैन बेधमुलतो ऒप्पि
    युन्नदनि ग्रहिम्पुमु ॥ मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय । मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव
    ॥ ना कन्न गॊप्पवाडुगानि गॊप्पवस्तुवुगानि मरेदियू प्रपञ्चमुन लेदु सूत्रमुन मणुलु ग्रुच्चबडिनट्लु यी
    जगमन्तयू नायन्दु निक्षिप्तमै उन्नदि ॥ पुण्यो गन्धः पृथिव्यां च तेजश्चास्मि विभावसौ । जीवनं सर्वभूतेषु
    तपश्चास्मि तपस्विषु ॥ यॆल्ल भूतमुलयन्दु आयुवु तपस्वुलयन्दु तपस्सु नेनुगा नॆरुगुमु ॥ दैवी ह्येषा गुणमयी
    मम माया दुरत्यया । मामेव ये प्रपद्यन्ते मायामेतां तरन्ति ते ॥ दैव सम्बन्धमु अगु ना माय अतिक्रमिम्प
    रानिदि नन्नु शरणुजॊच्चिन वारिकि ई माय सुलभसाध्यमु ॥ चतुर्विधा भजन्ते मां जनाः सुकृतिनोर्जुन । आर्तो
    जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ ॥ ज्ञानुलु अनु नालुगु विधमुलैन पुण्यात्मुलु नन्नाश्रयिञ्चुचुन्नारु
    ॥ बहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते । वासुदेवः सर्वमिति स महात्मा सुदुर्लभः ॥ ज्ञान सम्पन्नुडैन
    मानवुडु अनेक जन्ममुलॆत्तिन पिम्मट विज्ञानियै नन्नु शरणमु नॊन्दुचुन्नाडु ॥ अन्तकाले च मामेव स्मरन्मुक्त्वा
    कलेवरम् । यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः ॥ ऎवडु अन्त्यकालमुन नन्नु स्मरिञ्चुचू शरीरमुनु
    वदलुचुन्नाडो वाडु नन्ने चॆन्दुचुन्नाडु ॥ अभ्यासयोगयुक्तेन चेतसा नान्यगामिना । परमं पुरुषं दिव्यं याति
    पार्थानुचिन्तयन् ॥ कविं पुराणमनुशासितारं अणोरणीयंसमनुस्मरेद्यः । सर्वस्य धातारमचिन्त्यरूपं आदित्यवर्णं
    तमसः परस्तात् ॥ एकाग्र चित्तमुन दिव्यरूपुडैन महापुरुषुनि स्मरिञ्चुनो अट्टिवाडु आ परमपुरुषुने चॆन्दुचुन्नाडु
    आ महापुरुषुडे सर्वज्ञुडु प्रपञ्चमुनकु शिक्षकुडु अनूह्यमैन रूपमु कलवाडु सूर्य कान्ति तेजोमयुडु अज्ञानान्धकारमुनकन्न
    इतरुडु ॥ अव्यक्तोक्षर इत्युक्तस्तमाहुः परमां गतिम् । यं प्राप्य न निवर्तन्ते तद्धाम परमं मम ॥ इन्द्रिय
    गोचरमु कानि परब्रह्मपदमु शाश्वतमैनदि पुनर्जन्म रहितमैन आ उत्तमपदमे परमपदमु ॥ शुक्लकृष्णे गती ह्येते
    जगतः शाश्वते मते । एकया यात्यनावृत्तिमन्ययावर्तते पुनः ॥ जगत्तुनन्दु शुक्ल कृष्णमु लनॆडि रॆण्डु मार्गमुलु
    नित्यमुलुगा उन्नवि अन्दु मॊदटि मार्गमु वलन जन्मराहित्यमु रॆण्डव दानिवलन पुनर्जन्ममु कलुगु चुन्नवि
    ॥ वेदेषु यज्ञेषु तपःसु चैव दानेषु यत्पुण्यफलं प्रदिष्टम् । अत्येति तत्सर्वमिदं विदित्वा योगी परं स्थानमुपैति
    चाद्यम् ॥ योगियैनवाडु वेदाध्ययनमु वलन यज्ञतपोदानादुल वलन कलुगु पुण्यफलमुनु आशिम्पक उत्तम पदमैन ब्रह्मपदमुनु
    पॊन्दगलडु ॥ सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम् । कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम्
    ॥ प्रलयकालमुन सकल प्राणुलुनु ना यन्दु लीनमगुचुन्नवि मरल कल्पादि यन्दु सकल प्राणुलनू नेने सृष्टिञ्चु
    चुन्नानु ॥ अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते । तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्
    ॥ ए मानवुडु सर्वकाल सर्वावस्थलयन्दु नन्ने ध्यानिञ्चु चुण्डुनो अट्टिवानि योगक्षेममुलु नेने वहिञ्चु
    चुन्नानु ॥ पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति । तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः ॥ ऎवडु
    भक्तितो नाकु पत्रमैननु उदक मैननु फलापेक्ष रहितमुगा समर्पिञ्चुचुन्नाडो अट्टिवानिनि नेनु प्रीतितो स्वीकरिञ्चुचुन्नानु
    ॥ मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु । मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः ॥ ना यन्दु मनस्सु
    लग्नमु चेसि यॆल्ल कालमुलयन्दु भक्ति श्रद्धलतो स्थिरचित्तुडवै पूजिञ्चितिवेनि नन्ने पॊन्दगलवु इदि उपनिषत्तुल
    सारांशमैन योगशास्त्रमुन श्रीकृष्णुडु अर्जुनुनकुप देशिञ्चिन कर्मसन्यास राज विद्या राजगुह्य योगमुलु
    समाप्तमु ॥ महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा । मद्भावा मानसा जाता येषां लोक इमाः प्रजाः ॥ कश्यपादि
    महर्षि सप्तकमु स्वयम्भूवादि मनुवुलु ना वलनने जन्मिञ्चिरि पिम्मट वारि वलन ऎल्ल लोकमुलन्दलि समस्त भूतमुलुनु
    जन्मिञ्चॆनु ॥ मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् । कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च
    ॥ पण्डितुलु नायन्दु चित्तमुगलवारै ना यन्दे तम प्राणमुलुञ्चि ना महिमानुभाव मॆरिङ्गि ऒकरिकॊकरु उपदेशमुलु
    गाविञ्चुकॊञ्चु ब्रह्मा नन्दमुनु अनुभविञ्चुचुन्नारु ॥ अहमात्मा गुडाकेश सर्वभूताशयस्थितः । अहमादिश्च
    मध्यं च भूतानामन्त एव च ॥ समस्त भूतमुल मनस्सुलन्दुन्न परमात्म स्वरूपुडनु नेने नाशमुलकु नेने कारकुडनु
    ॥ वेदानां सामवेदोस्मि देवानामस्मि वासवः । इन्द्रियाणां मनश्चास्मि भूतानामस्मि चेतना ॥ देवतललो देवेन्द्रुडु
    इन्द्रियमुललो मनस्सु प्राणुलन्दरि बुद्धि नेने ॥ प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् । मृगाणां
    च मृगेन्द्रोहं वैनतेयश्च पक्षिणाम् ॥ राक्षसुललो प्रह्लादुडु पक्षुललो गरुत्मन्तुडु नेने ॥ यद्यद्विभूतिमत्सत्त्वं
    श्रीमदूर्जितमेव वा । तत्तदेवावगच्छ त्वं मम तेजोंशसम्भवम् ॥ लोकमुनन्दु ऐश्वर्य युक्तमै कान्ति युक्तमैन
    समस्त वस्तुवुलु ना तेजो भागमु वलनने सम्प्राप्तमगुनु ॥ पश्य मे पार्थ रूपाणि शतशोथ सहस्रशः । नानाविधानि
    दिव्यानि नानावर्णाकृतीनि च ॥ अनेक वर्णमुलै अनेक विशेषमुलगु ना सस्वरूपमुनु कन्नुलारा दर्शिम्पुमु ॥
    पश्यामि देवांस्तव देव देहे सर्वांस्तथा भूतविशेषसङ्घान् । ब्रह्माणमीशं कमलासनस्थं ऋषींश्च सर्वानुरगांश्च
    दिव्यान् ॥ अनेकबाहूदरवक्त्रनेत्रं पश्यामि त्वां सर्वतोनन्तरूपम् । नान्तं न मध्यं न पुनस्तवादिं पश्यामि
    विश्वेश्वर विश्वरूप ॥ दंष्ट्राकरालानि च ते मुखानि दृष्ट्वैव कालानलसन्निभानि । दिशो न जाने न लभे च
    शर्म प्रसीद देवेश जगन्निवास ॥ वासुकी मॊदलगुगा गल सर्पमुलू नीयन्दु नाकु गोचरमगुचुन्नवि नी विश्वरूपमु
    अनेक बाहुवुलतो मुखमुलतो ऒप्पियुन्नदि अट्लैयू नी आकारमुन आद्यन्त मध्यमुलनु गुर्तिम्प जाल कुन्नानु कोरलचे
    भयङ्करमै प्रलयाग्नि समानमुलैन नी मुखमुलनु चूचुटवलन नाकु दिक्कुलु तॆलियकुन्नवि नायन्दु दय युञ्चि नाकु
    प्रसन्नुडवु गम्मु ॥ कालोस्मि लोकक्षयकृत्प्रवृद्धो लोकांसमाहर्तुमिह प्रवृत्तः । ऋतेपि त्वां न भविष्यन्ति
    सर्वे येवस्थिताः प्रत्यनीकेषु योधाः ॥ ई प्रपञ्चमुनॆल्ल नशिम्पजेयु बलिष्ठमैन काल स्वरूपुडनु नेने ई
    युद्धमुनकु सिद्धपडिन वारिनि नीवु चम्पकुन्ननू ब्रतुक गलवारिन्दॆव्वरुनू लेरु ॥ द्रोणं च भीष्मं च जयद्रथं
    च कर्णं तथान्यानपि योधवीरान् । मया हतांस्त्वं जहि माव्यथिष्ठा युध्यस्व जेतासि रणे सपत्नान् ॥ जयद्रध
    कर्णाधि योध वीरुलु नाचे संहरिम्पबडिरि इक मिगिलिन शतृ वीरुलनु नीवु संहरिम्पुमु ॥ किरीटिनं गदिनं चक्रहस्तम्
    । इच्छामि त्वां द्रष्टुमहं तथैव । तेनैव रूपेण चतुर्भुजेन । सहस्रबाहो भव विश्वमूर्ते ॥ अनेक भुजमुलुगल
    नी विश्वरूपमुनु उपसंहरिञ्चि किरीटमु चक्रमु धरिञ्चिन नी सहज सुन्दरमैन स्वरूपमुनु दर्शिम्पगोरु चुन्नानु
    कृष्णा ॥ सुदुर्दर्शमिदं रूपं दृष्ट्वानसि यन्मम । देवा अप्यस्य रूपस्य नित्यं दर्शनकाङ्क्षिणः ॥ नीवु
    दर्शिञ्चिन ई ना स्वरूपमुनु ऎव्वरुनू चूडजालरु ई विश्वरूपमुनु दर्शिम्प देवतलन्दरुनू सदा कोरुचुन्दुरु
    ॥ मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते । श्रद्धया परयोपेताः ते मे युक्ततमा मताः ऎवरु नायन्दे मनस्सु
    लग्नमु चेसि श्र्द्धाभक्तुलतो नन्नु ध्यानिञ्चु चुन्नारो अट्टिवारु अत्यन्तमू नाकु प्रीतिपात्रुलु ॥ श्रेयो
    हि ज्ञानमभ्यासाज्ज्ञानाद् ध्यानं विशिष्यते । ध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरम् ॥ अभ्यासयोगमुकन्न
    ज्ञानमु ज्ञानमु कन्न ध्यानमु दानिकन्न कर्म फलत्यागमू श्रेष्ठमु अट्टि त्यागमुवल्ल संसार बन्धनमु तॊलगि
    मोक्षप्राप्ति सन्भविञ्चुचुन्नदि ॥ अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः । सर्वारम्भपरित्यागी यो मद्भक्तः
    स मे प्रियः ॥ ऎवडु कोरिकलु लेनिवाडै पक्षपात रहितुडै भयमुनु वीडि कर्मफ्ल त्यागियै नाकु भक्तुडगुनो अट्टिवाडु
    नाकु मिक्किलि प्रीतिपात्रुडु ॥ समः शत्रौ च मित्रे च तथा मानापमानयोः । शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः
    ॥ तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येन केनचित् । अनिकेतः स्थिरमतिर्भक्तिमान्मे प्रियो नरः ॥ शीतोष्ण
    सुख दुःखादुलयन्दुनु समबुद्धि कलिगि चलिञ्चनि मनस्सु कलवाडै नायन्दु भक्ति प्रपत्तुलु चूपु मानवुडु नाकु
    प्रीतिपात्रुडु ॥ इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते । एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः
    ॥ देहमुनॆरिगिनवाडु क्षेत्रज्ञुडनियू पॆद्दलु चॆप्पुदुरु ॥ अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम्
    । एतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोन्यथा ॥ आत्म ज्ञानमुनन्दु मनस्सु लग्नमु चेयुट मौक्षप्राप्ति यन्दु
    दृष्टि कलिगियुण्डुट ज्ञान मार्गमुलनैयू वानिकि इतरमुलैनवि अज्ञानमुलनियू चॆप्पबडुनु ॥ कार्यकारणकर्तृत्वे
    हेतुः प्रकृतिरुच्यते । पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ॥ अदि शरीर सुखदुःखादुलनु तॆलियजेयुनु
    क्षेत्रज्ञुडु आ सुख दुःखमुलनु अनुभविञ्चुचुण्डुनु ॥ समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् । विनश्यत्स्वविनश्यन्तं
    यः पश्यति स पश्यति ॥ शरीरमु नशिञ्चिननू तानु सशिम्पक यॆवडु समस्त भूतमुलन्दुन्न परमेश्वरुनि चूचुनो वाडे
    यॆरिगिनवाडु ॥ अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः । शरीरस्थोपि कौन्तेय न करोति न लिप्यते ॥ गुण
    नाशन रहितुडैनवाडु परमात्म अट्टि परमात्म देहान्त र्गतुडय्युनू कर्मल नाचरिञ्चुवाडु काडु ॥ यथा प्रकाशयत्येकः
    कृत्स्नं लोकमिमं रविः । क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ॥ सूर्युडॊक्कडे यॆल्ल जगत्तुलनू
    ए विधमुगा प्रकाशिम्पजेयुचुन्नाडो आ विधमुगने क्षेत्रज्ञुडु यॆल्ल देहमुलनू प्रकाशिम्पजेयुचुन्नाडु इदि
    उपनिषत्तुल सारांशमैन गीताशास्त्रमन्दु श्रीकृष्णुडु अर्जुनुनकुप देशिञ्चिन विभूति योगमु विश्वरूप सन्दर्शन
    योगमु क्षेत्र क्षेत्रज्ञ विभाग योगमुलु समाप्तमु ॥ परं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम् ।
    यज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ॥ ज्ञानार्जनमुन महनीयुलैन ऋषीश्वरुलु मोक्ष्मुनु पॊन्दिरि
    अट्टि महत्तरमैन ज्ञानमुनु नीकु उपदेशिञ्चुचुन्नानु ॥ सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः । तासां
    ब्रह्म महद्योनिरहं बीजप्रदः पिता ॥ प्रपञ्चमुन जन्मिञ्चु ऎल्ल चराचर समूहमुलकु प्रकृति तल्लि वन्टिदि
    नेनु तण्ड्रि वन्टिवाडनु ॥ तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् । सुखसङ्गेन बध्नाति ज्ञानसङ्गेन
    चानघ ॥ त्रिगुणमुललो सत्त्वगुणमु निर्मलमगुटन्जेसि सुख ज्ञानाभि लाषलचेत आत्मनु देहमुनन्दु बन्धिञ्चुचुन्नदि
    ॥ रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् । तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ॥ रजोगुणमु कोरिकलयन्दु
    अभिमानमू अनुरागमू पुट्टिञ्चि आत्मनु बन्धिञ्चुचुन्नदि ॥ तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् ।
    प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत ॥ अज्ञानमुवलन पुट्टुनदि तमोगुणमु अदि सर्व प्राणुलनू मोहिम्पजेयुनदि
    आ गुणमु मनुजुनि आलस्यमुतोनू निद्र तोनू बद्धुनि चेयुनु ॥ मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः
    । सर्वारम्भपरित्यागी गुणातीतः स उच्यते ॥ शत्रुमित्रुलयन्दु सममैन मनस्सु गलवानिनि त्रिगुणातीतुडन्दुरु
    ॥ ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम् । छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ निकृष्णमैन अहङ्कारमु
    कॊम्मलुगागल अश्वत्थ वृक्षमु अनादि अयिनदि अट्टि संसार वृक्ष्मुनकु वेदमुलु आकुलुवन्टिवि अट्टि दानि नॆरिङ्गिनवाडे
    वेदार्थ सार मॆरिङ्गिनवाडु ॥ न तद्भासयते सूर्यो न शशाङ्को न पावकः । यद्गत्वा न निवर्तन्ते तद्धाम परमं
    मम ॥ पुनरावृत्ति रहितमैन मोक्षपथमु सूर्य चन्द्राग्नुल प्रकाशमुन कतीतमै ना उत्तम पथमै युन्नदि ॥ अहं
    वैश्वानरो भूत्वा प्राणिनां देहमाश्रितः । प्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम् ॥ देहुलन्दु जठराग्नि
    स्वरूपुडनै वारु भुजिञ्चु भक्ष्य लेह्य पदार्थमुल जीर्णमु चेयुचुन्नानु ॥ तेजः क्षमा धृतिः शौचमद्रोहो
    नातिमानिता । भवन्ति सम्पदं दैवीमभिजातस्य भारत ॥ दम्भो दर्पोभिमानश्च क्रोधः पारुष्यमेव च । अज्ञानं
    चाभिजातस्य पार्थ सम्पदमासुरीम् ॥ इतरुल वञ्चिम्पकुण्डुट मॊदलगु गुणमुलु दैवांश सम्भूतुलकुण्डुनु अविवेकमु
    मॊदलगु गुणमुलु राक्षसांश सम्भूतुलकुण्डुनु ॥ त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः । कामः क्रोधस्तथा
    लोभस्तस्मादेतत्त्रयं त्यजेत् ॥ लोभमुलु आत्मनु नाशनमु चेयुनु अवि नरक प्राप्तिकि हेतुवुलु कावुन वानिनि
    वदिलि वेय वलयुनु ॥ यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः । न स सिद्धिमवाप्नोति न सुखं न परां गतिम्
    ॥ शास्त्र विषयमुल ननुसरिम्पक इच्छा मार्गमुन प्रवर्तिञ्चुवाडु सुख सिद्धुलनु पॊन्दजालडु ॥ त्रिविधा भवति
    श्रद्धा देहिनां सा स्वभावजा । सात्त्विकी राजसी चैव तामसी चेति तां शृणु ॥ जीवुलकु गल श्रद्ध पूर्व जन्म
    वासना बलमु वलन लभ्यमु तामसमुलनि मूडु विधमुलगा उन्नदि ॥ यजन्ते सात्त्विका देवान्यक्षरक्षांसि राजसाः
    । प्रेतान्भूतगणांश्चान्ये यजन्ते तामसा जनाः ॥ सत्त्वगुणुलु देवतलनु रजोगुणुलु यक्ष राक्षसुलनु तमोगुणुलु
    भूत प्रेत गणम्बुलनु श्रद्धा भक्तुलतो पूजिञ्चुदुरु ॥ अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत् । स्वाध्यायाभ्यसनं
    चैव वाङ्मयं तप उच्यते ॥ इतरुल मनस्सुल नॊप्पिम्पनिदियू हितमुलतो कूडिन सत्य भाषणमू वेदाध्यन मॊनर्चुट
    वाचक तपस्सनि चॆप्पबडुनु ॥ काम्यानां कर्मणां न्यासं सन्न्यासं कवयो विदुः । सर्वकर्मफलत्यागं प्राहुस्त्यागं
    विचक्षणाः ॥ ज्योतिष्ठोमादि कर्मल नाचरिम्पकुण्डुट सन्यासमनियू कर्मफलमु यीश्वरार्पण मॊनर्चुट त्यागमनियू
    पॆद्दलु चॆप्पुदुरु ॥ अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम् । भवत्यत्यागिनां प्रेत्य न तु सन्न्यासिनां
    क्वचित् ॥ कर्मफलमुलु प्रियमुलू प्रियातिप्रियमुलू अनि मूडु विधमुलु कर्मफलमुनलु कोरिनवारु जन्मान्तरमन्दु
    आ फलमुलनु पॊन्दुचुन्नारु कोरनिवारु आ फलमुलनु जन्मान्तरमुन पॊन्दजाल कुन्नारु ॥ प्रवृत्तिं च निवृत्तिं
    च कार्याकार्ये भयाभये । बन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी ॥ बन्ध मोक्षमुल ए ज्ञानमॆरुगुचुन्नदो
    अदि सत्त्वगुण समुद्भवमनि ऎरुगुमु ॥ ईश्वरः सर्वभूतानां हृद्देशेर्जुन तिष्ठति । भ्रामयंसर्वभूतानि यन्त्रारूढानि
    मायया ॥ ईश्वरुडु यॆल्ल भूतमुलकु नियामकुडै प्राणुल हृदयमन्दुन्नवाडै जन्त्रगाडु बॊम्मलनाडिञ्चु रीतिगा
    प्राणुल भ्रमिम्पजेयुचुन्नाडु ॥ सर्वधर्माम्परित्यज्य मामेकं शरणं व्रज । अहं त्वां सर्वपापेभ्यो मोक्ष्ययिष्यामि
    मा शुचः ॥ समस्त कर्मलनु नाकर्पिञ्चि ऎल्ल पापमुलनुण्डि निन्नु विमुक्तुनि गाविन्तुनु ॥ य इदं परमं गुह्यं
    मद्भक्तेष्वभिधास्यति । भक्तिं मयि परां कृत्वा मामेवैष्यत्यसंशयः ॥ परम रहस्यमैन यी गीताशास्त्रमुनु
    ना भक्तुल कुपदेशमु चेयुचुन्नाडो वाडु मोक्षमुन कर्हुडु ॥ कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा
    । कच्चिदज्ञानसम्मोहः प्रनष्टस्ते धनञ्जय ॥ परम गोप्यमैन यी गीता शास्त्रमुनु चक्कगा विन्टिवा नी यज्ञान
    जनितमैन अविवेकमु नशिञ्चिनदा ॥ नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत । स्थितोस्मि गतसन्देहः
    करिष्ये वचनं तव ॥ ना अविवेकमु नी दय वलन तॊलगॆनु नाकु सुज्ञानमु लभिञ्चिनदि नाकु सन्देहमुलन्नियू तॊलगिनवि
    नी आज्ञनु शिरसावहिञ्चॆदनु ॥ यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः । तत्र श्रीर्विजयो भूतिर्ध्रुवा
    नीतिर्मतिर्मम ॥ योगीश्वरुडगु श्रीकृष्णुडु धनुर्धारियगु अर्जुनुडु यॆचटनुन्दुरो अचट सम्पद स्थिरमगु नीतियुण्डुनु
    गीताशास्त्रमिदं पुण्यं यः पठेत् प्रयतः पुमान् । विष्णॊः पदमवाप्नोति भय शोकादि वर्जितः ॥ गीताशास्त्रमुनु
    ऎवरु पठिन्तुरो वारु भय शोकादि वर्जितुलै विष्णु सायुज्यमुनु पॊन्दुदुरु इदि उपनिषत्तुल सारांशमैन गीताशास्त्रमन्दु
    श्रीकृष्णुडु अर्जुनुनकुपदेशिञ्चिन गुणत्रय विभाग मोक्षसन्यास योगमुलु सर्वमू समाप्तमु ॐ सर्वेजनाः सुखिनो
    भवन्तु समस्त सन्मगलानि भवन्तु असतोमा सद्गमय तमसोमा ज्योतिर्गमय मृत्योर्मा अमृतङ्गमय ॐ शान्तिः शान्तिः
    शान्तिः
