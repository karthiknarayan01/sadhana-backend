id: avalokiteshvarastotram-1
category: stotram
name:
  english: avalokiteshvarastotram 1
  devanagari: अवलोकितेश्वरस्तोत्रम् १
content:
  english: rinu bhagavan bhavati bhanami yavannarakam naiva vishami || 8|| kim copetya karoshi parartham
    muncasi bhagavan mamakritartham | athava prekshya kripa tava punyam janayasi drishtam kathamavipannam
    || 9|| smaranenapi bhavasi paritushtah kshipasi ca kalusham kimiti na drishtah | yasmad bhagavan parahitadaksha
    kshepam ma kuru mamiha raksha || 10|| dantiturangamaputrakalatram rajyamakantakaveshmavicitram | asthishiro'srinmamsaparyantam
    bhavatarthibhyo dattamanantam || 11|| anjanagutikapadukasiddhih siddhaushadhimanimantravishuddhih
    | siddhayati yakshastripuraveshah tushyasi yasya tvam lokesha || 12|| ye karacaranavilocanahina vividhavyadhimahabhayadinah
    | te tvayi tushte pushtasharira vilasantyarujo gunagambhirah || 13|| garalam vyadhirgrahadakinyah
    shantim yanti sada yoginyah | sarati na tasya puro yamadutah proto yasya ca tvam jinabhutah || 14||
    iti lokeshvara kim kriyamanam muncasi bhagavan mamatranam | raumyahamanudinamudyatapanirnashaya trasasamakulavanih
    || 15|| yadvishayendriyacancalamanasa kritabahupapam vyakulamanasa | nitam janma maya'smin sakalam
    jatharanimittam bhramata vikalam || 16|| tatkuru samprati mama lokesha pranato vividhanjalirahameshah
    | yenabhuktvapayikadosham sugatim bhavato yami na moksham || 17|| mohadveshavinashanahetustvam samsaramahodadhisetuh
    | patitastrastotthapitabahustvam guruduritanishakararahuh || 18|| deshitasugatanuttaratattvastvam
    palitabahuduhkhitasattvah | nirjitadurjayamanmathamarastvam santirnabhavarnavaparah || 19|| sakalalananikrintanadehastvam
    paribhavitajagatasudehah | bhagavannanupamakarunasindhustvam janavidito'karanabandhuh || 20|| lilavidalitakarmavibhangastvam
    parahitavishayavyasangah | divyadhyanasamahitacittastvam yacakasadharanacittah || 21|| paramapakurvannnapi
    karunavan mayi paritosham na karoshi bhavan | kathamiha mohamahoragadashtam vishayashariramakushalam
    bhrashtam || 22|| sakalajanartham prati ya karuna sa kim bhavato niyataspharana | yena na rakshasi
    kilvishavantam bhavatah purato mam viruvantam || 23|| natha kripa te vyomavishala sattveshu hi yathambudadhara
    | sthalajalanimnonnatabahudeshe sarati nirantaramanishamasheshe || 24|| iti bhagavatsmaranadyatpunyam
    mama tenedam jagadakshunnam | labhatam shripotalakacalavasam janayatu sundaravividhavilasam || 25||
    iti shrimadaryavalokiteshvarabhattarakasya carapatipadaviracitam stotram sampurnam ||
  devanagari: ृणु भगवन् भवति भणामि यावन्नरकं नैव विशामि ॥ ८॥ किं चोपेत्य करोषि परार्थं मुञ्चसि भगवन् मामकृतार्थम्
    । अथवा प्रेक्ष्य कृपा तव पुण्यं जनयसि दृष्टं कथमविपन्नम् ॥ ९॥ स्मरणेनापि भवसि परितुष्टः क्षिपसि च
    कलुषं किमिति न दृष्टः । यस्माद् भगवन् परहितदक्ष क्षेपं मा कुरु मामिह रक्ष ॥ १०॥ दन्तितुरङ्गमपुत्रकलत्रं
    राज्यमकण्टकवेश्मविचित्रम् । अस्थिशिरोऽसृङ्मांसपर्यन्तं भवतार्थिभ्यो दत्तमनन्तम् ॥ ११॥ अञ्जनगुटिकापादुकसिद्धिः
    सिद्धौषधिमणिमन्त्रविशुद्धिः । सिद्धयति यक्षस्त्रीपुरवेशः तुष्यसि यस्य त्वं लोकेश ॥ १२॥ ये करचरणविलोचनहीना
    विविधव्याधिमहाभयदीनाः । ते त्वयि तुष्टे पुष्टशरीरा विलसन्त्यरुजो गुणगम्भीराः ॥ १३॥ गरलं व्याधिर्ग्रहडाकिन्यः
    शान्तिं यान्ति सदा योगिन्यः । सरति न तस्य पुरो यमदूतः प्रोतो यस्य च त्वं जिनभूतः ॥ १४॥ इति लोकेश्वर
    किं क्रियमाणं मुञ्चसि भगवन् मामत्राणम् । रौम्यहमनुदिनमुद्यतपाणिर्नाशय त्राससमाकुलवाणिः ॥ १५॥ यद्विषयेन्द्रियचञ्चलमनसा
    कृतबहुपापं व्याकुलमनसा । नीतं जन्म मयाऽस्मिन् सकलं जठरनिमित्तं भ्रमता विकलम् ॥ १६॥ तत्कुरु संप्रति
    मम लोकेश प्रणतो विविधाञ्जलिरहमेषः । येनाभुक्त्वापायिकदोषं सुगतिं भवतो यामि न मोक्षम् ॥ १७॥ मोहद्वेषविनाशनहेतुस्त्वं
    संसारमहोदधिसेतुः । पतितस्त्रस्तोत्थापितबाहुस्त्वं गुरुदुरितनिशाकरराहुः ॥ १८॥ देशितसुगतानुत्तरतत्त्वस्त्वं
    पालितबहुदुःखितसत्त्वः । निर्जितदुर्जयमन्मथमारस्त्वं सन्तीर्णभवार्णवपारः ॥ १९॥ सकलालाननिकृन्तनदेहस्त्वं
    परिभावितजगतसुदेहः । भगवन्ननुपमकरुणासिन्धुस्त्वं जनविदितोऽकारणबन्धुः ॥ २०॥ लीलाविदलितकर्मविभङ्गस्त्वं
    परहितविषयव्यासङ्गः । दिव्यध्यानसमाहितचित्तस्त्वं याचकसाधारणचित्तः ॥ २१॥ परमपकुर्वन्न्नपि करुणावान्
    मयि परितोषं न करोषि भवान् । कथमिह मोहमहोरगदष्टं विषयशरीरमकुशलं भ्रष्टम् ॥ २२॥ सकलजनार्थं प्रति या
    करुणा सा किं भवतो नियतस्फरणा । येन न रक्षसि किल्विषवन्तं भवतः पुरतो मां विरुवन्तम् ॥ २३॥ नाथ कृपा
    ते व्योमविशाला सत्त्वेषु हि यथाम्बुदधारा । स्थलजलनिम्नोन्नतबहुदेशे सरति निरन्तरमनिशमशेषे ॥ २४॥ इति
    भगवत्स्मरणाद्यत्पुण्यं मम तेनेदं जगदक्षुण्णम् । लभतां श्रीपोतलकाचलवासं जनयतु सुन्दरविविधविलासम् ॥
    २५॥ इति श्रीमदार्यावलोकितेश्वरभट्टारकस्य चरपतिपादविरचितं स्तोत्रं सम्पूर्णम् ॥
