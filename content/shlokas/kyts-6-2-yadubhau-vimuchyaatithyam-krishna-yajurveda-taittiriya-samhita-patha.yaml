id: kyts-6-2-yadubhau-vimuchyaatithyam-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.2 Yadubhau Vimuchyaatithyam - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande dvitiyah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || yadubhau vimucya nkriyate tadrigeva ta ngrihnati yajnasya santatyai
    patnyanvarabhate patni hi parinahyasyeshe patniyai vanumata nnirvapati yadvai patni yajnasya karoti
    mithuna ntadatho patniya evai nvarabhom 'navacchittyai yava 'nucarairagacchati sarve bhyo vai tebhya
    atithya nkriyate chandagmsi khalu vai somasya rajno ratithyamasi vishnave tvetyaha gayatriya evaitena
    karoti somasya ''tithyamasi vishnave tvetyaha trishtubha evaitena karotyatitheratithyamasi vishnave
    tvetyaha jagatya evaitena karotyagnaye tva rayasposhadavnne vishnave tvetyahanushtubha evaitena karoti
    shyenaya tva somabhrite vishnave tvetyaha gayatriya evaitena karoti panca kritvo grihnati panca kshara
    panktih pankto yajno yajnamevava rundhe brahmavadino vadanti kasma dgayatriya ubhayata atithyasya
    kriyata iti yadeva dgayatriya ubhayata atithyasya kriyate purasta cco parishtacca shiro va eta dyajnasya
    yadatithya nnavakapalah purodasho bhavati tasma nnavadha shiro vishyuta nnavakapalah purodasho bhavati
    te trayastrikapalastrivrita stomena sammitastejastrivri tteja eva yajnasya shirsha ndadhati navakapalah
    purodasho bhavati te trayastrikapalastrivrita pranena sammitastrivridvai strivritameva pranamabhipurvam
    ndadhati prajapaterva etani pakshmani yadashvavala ai kshavi tirashci yadashvavalah prastaro bhavatyaikshavi
    tirashci prajapatereva taccakshu ssambharati deva vai ya ahutirajuhavusta asura nishkavamada shmaryamapashyan
    karmanyo vai karmainena kurviteti te ka nakurvata tairvai te rakshagsyapa paridhayo bhavanti rakshasamapahatyai
    sagg shayati rakshasamananva tpari dadhatyadityo hyevodya drakshagsyapahantyurdhve samidhava dadhatyuparishtadeva
    rakshagsyapa hanti yajusha mmithunatvaya dve a dadhati dvipa dyajamanah pratishthityai brahmavadino
    vada ntyagnishca va etau somashca katha somaya nkriyate nagnaya iti yadagnavagni mmathitva praharati
    tenaivagnaya atithya nkriyate 'tho khalvahuragni ssarva devata iti yaddhavirasadyagni mmanthati havyayaiva
    ''sannaya sarva devata janayati || nte deva mitho vipriya asa 'nyasmai jyaishthyayatishthamanah pancadha
    vyakramannagnirvasubhi ssomo rudrairindro marudbhi rdevaiste 'manyantasurebhyo va ida mbhratrivyebhyo
    raddhyamo yanmitho vipriya ssmo ya na imah priyastanuvasta ssamavadyamahai tabhya 'nyasmai druhyaditi
    tasmadya mprathamo druhyati sa artimarcchati ya ttanunaptragm samavadyati bhratrivyabhibhutyai bhavatyatmana
    para 'sya bhratrivyo bhavati panca kritvo 'vadyati pancadha hi te ta thsamavadyantatho panca kshara
    panktih pankto yajno yajnamevava rundha apataye tva grihnamityaha prano va apatih pranameva prinati
    paripataya ityaha mano vai paripatirmana eva prinati tanunaptra ityaha tanuvo hi te ta ssamavadyanta
    shakvarayetyaha shaktyai hi te ta ssamavadyanta shakma nnojishthayetyahaujishthagm hi te ta datmanah
    samavadyanta 'nadhrishtagg hyetadanadhrishya ityaha devanag hyetadojo 'bhishastipa anabhishastenyamityaha
    nabhishastenyamanu me diksha rmanyatamityaha yathayajurevaita nnantikamiva khalu va asyaitaccaranti
    ya ttanunaptrena pracarantyagm shuragm shuste deva soma puvayate yanmiyate '' pyayayatya tubhyamindrah
    pyayatama tvamindraya pyayasvetya ''pyayayatya pyayaya sakhi thsanya medhayetyahartvijo va asya sakhayasta
    ''pyayayati svasti te deva soma sutyamashiye llokaccyavante ye somama ntarikshadevatyo hi soma apyayita
    eshta rayah preshe bhagayetyaha dyavaprithivibhyameva namaskrityasmin ~loke prati tishthanti devasura
    nte deva bibhyato ssarva devata iti te nkritva 'suranabhyabhava nnagnimiva khalu va esha pravishati
    yo 'vantaradikshamupaiti bhratrivyabhibhutyai bhavatyatmana para 'sya bhratrivyo bhavatyatmanameva
    dikshaya pati prajamavantaradikshaya santara mmekhalagm samayacchate praja hya 'ntaratara taptavrato
    bhavati madantibhirmarjayate nir shshitena vayati samiddhyai ya te agne rudriya tanurityaha svayaivaina
    ddevataya vratayati sayonitvaya shantyai 'tha harini ta deva jetu nta upasadaivajigisha ntasmadahuryashcaivam
    ve~da yashca nopasada vai mahapura njayantiti ta ishugm samaskurvata gnimanikagm somagm shalyam 'bruvan
    ka imamasishyatiti vri~na ahameva pashuna madhipatirasaniti tasma madhipatistagm rudro thsa tisrah
    puro bhittvaibhyo lokebhyo npranudata yadupasada upasadyante bhratrivyaparanutyai nanyamahuti 'gharama
    gharayati yajnasya prajna tyai paramatikramya juhoti paraca evaibhyo lokebhyo yajamano bhratrivya
    npra nudate punaratyakramyopasada njuhoti pranudyaivaibhyo lokebhyo bhratrivyanjitva bhratrivyaloka
    mabhyarohati deva vai yah pratarupasada upasida nnahnastabhirasura ssayagm ratriyai tabhirya upasadyante
    'horatrabhyameva ta dyajamano bhratrivya npra nudate yah prataryajya kuryadayatayamatvaya tisra upasada
    upaiti traya ime loka imaneva loka mpadyante shadva ritava rituneva prinati dvadashahine soma upaiti
    dvadasha masa thsarameva prinati caturvigmshati padyante caturvigmshati mpadyante caturvigmshati rardhamasa
    ardhamasaneva prinatyara mupeyadyah kamayeta 'tha dvavatha trinatha catura esha va ara gra 'vantaradiksha
    'sminnevasmai loke mupeyadyah kamayetamushmi 'gre 'tha trinatha dvavathaikamesha vai parovariyasya
    vantaradiksha 'mushminnevasmai loke ya~nti ya upasada upayanti tesham ya~ unnayate hiyata eva sa nodaneshiti
    su nniyamiva yo vai svarthetam shranto hiyata uta sa nishtyaya saha vasati tasma thsakridunniya naparamunnayeta
    daddhnonnayetaitadvai pashunagm rupagm rupenaiva pashunava rundhe yajno devebhyo nilayata vishnu rupa
    nkritva sa prithivi ntamindra uparyuparyatyakrama 'yamuparyuparyatyakrami ndurge hantetyatha kastvamityaha
    ndurgadaharteti so njahi yadi durge hanta 'siti sa darbhapunjilamu dvrihya sapta giri ddurgadva ahartavocatha
    etama hareti tame bhyo yajna eva yajnama dyavadasinah parapashyati tava nte deva abruvannastveva no
    'syamapiti kiyadvo dasyama iti yavadiyagm salavriki trih parikramati tavanno datteti sa indrah salavriki
    rupa ssarvatah paryakrama ttadimamavindanta yadimamavindanta ta dvedyai veditvagm sa va iyagm sarvaiva
    vediriyati shakshyamiti tva avamaya yajante trigmsha ttirashci bhavati shattrigmsha tpraci caturvigmshatih
    purasta ttirashci dashadasha sampadyante dasha dvirajaivannadyamava rundha uddhanti yadevasya ameddhya
    ntadapa hantyuddhanti tasmadoshadhayah para bhavanti barhi sstrinati tasmadoshadhayah punara bhavantyuttara
    mbarhisha uttarabarhi sstrinati praja vai barhiryajamana uttara barhi ryajamana dyajamano 'yajamanaduttarah
    || yadva anishano bharamadatte vi vai sa lishate ya ddvadasha sahnasyopasada 'hinasya yajnasya viloma
    kriyeta tisra eva sahnasyopasado dvadashahinasya yajnasya saviryatvayatho saloma kriyate vathsasyaika
    sstano bhagi hi so vra~tamupaityatha dvavatha trinatha catura etadvai kshurapavi nama vratam nnudate
    prati janishyamananatho kaniyasaiva bhuya upaiti caturo n vratamupaityatha trinatha dvavathaikametadvai
    sujaghana ntapasyagm suvargyamatho praiva jayate prajaya pashubhiryavagu rajanyasya vrata nkrureva
    vai yavaguh krura iva rajanyo vajrasya rupagm samriddhya amiksha vaishyasya pakayajnasya rupa brahmanasya
    tejo vai bra hmanastejah payastejasaiva tejah paya atma ndhatte 'tho payasa vai garbha vardhante garbha
    iva khalu va esha ya mbhavatyatmanameva ta dvardhayati trivrato vai manurasi ddvivrata asura ekavrata
    devah pratarmaddhyandine devah pratarmaddhyandine saya nmaddhyandine maddhyaratre devana yadasya maddhyandine
    maddhyaratre vrata mbhavati maddhyato va annena bhunjate maddhyata eva tadurja ndhatte bhratrivyabhibhutyai
    bhavatyatmana 'sya bhratrivyo bhavati garbho va esha ya kshito yoni rdikshitavimitam sskandati tadrigeva
    tanna pravastavyamatmano gopithayaisha vai vyaghrah kulagopo yadagnistasma 'nutthaya hantorna pravastavyamatmano
    guptyai dakshinata shshaya etadvai yajamanasya ''yatanaggsva eva ''yatane shaye 'gnimabhyavritya shaye
    devata eva yajnamabhyavritya shaye || purohavishi devayajane yajayedya nkamayetopainamuttaro yajno
    namedabhi suvargam njayedityetadvai purohavirdevayajanam nnagnimapa adityamabhi vipashyatyupainamuttaro
    yajno namatyabhi suvargam njayatyapte devayajane yajaye va~ yavannanase yatavai na rathayaitadva apta
    ndevayajanamapnotyeva bhratrivya mbhratrivya apnotyeko nnate devayajane yajaye nnatadvai devayajanadangirasah
    pashunasrijantantara sadohavirdhane unnatagg mpashumaneva bhavati tryunnate devayajane yajaye ntryunnatadvai
    devayajanadangirasa nnantara ''havaniya syadantara havirdhana nca sadashcantara sadashca gar ncaitadvai
    tryunnata ndevayajanagm suvargameva lokameti pratishthite devayajane yajaye tpratishthakamametadvai
    pratishthita mpratyeva tishthati yatranya anya oshadhayo vyatishakta tpashukamametadvai pashunagm
    rupagm rupenaivasmai pashu nava rundhe pashumaneva bhavati nir ritigrihite devayajane yajayedya ngrahayeyamityetadvai
    nir thsadrishyai satya riksha ngrahayati vyavritte devayajane yajaye mpatre va talpe va mimagmsera
    npracinamahavaniya hapatyadetadvai vyavritta vi~ papmana bhratrivyena mpatre na talpe mimagm sante
    karye devayajane yajaye nkaya vai purusho bhavatyeva || tte deva amanyanta yataran va iyamupavarthsyati
    ta ida mbhavishyantiti tamupamantrayanta sa nmaya kaman vyashnavatha purva 'gnerahutirashnavata iti
    tasmaduttaravedi rvyagharayanti varevritagg hyasyai shamyaya pari mimite 'syai satho yuktenaiva yuktamava
    rundhe vittayani me 'sityaha vitta hyenanava hyenanavadavatanma nathitamityaha nathitan hyenanavadavatanma
    vyathitamityaha vyathitan 'gne angira iti trir harati ya evaishu lokeshvagnaya stanevava rundhe tushni
    ncaturthagm haratyani ruktamevava rundhe sigmhirasi mahishirasityaha sigmhir nantara 'pakramyatishthaduru
    prathasvoru te yajnapatih prathatamityaha yajamanameva prajaya pashubhih prathayati dhruva asiti sagm
    hanti 'siti sagm hanti dhrityai devebhyah shundhasva devebhyah shumbhasvetyava cokshati pra ca kirati
    shuddhya indraghoshastva vasubhih purasta tpatvityaha digbhya evaina mprokshati devag ttaravedirupavavartihaiva
    vi jayamaha ityasura vajramudyatya devanabhyayanta tanindraghosho vasubhih purastadapa nudata manojavah
    pitribhi rdakshinatah praceta rudraih pashca ''dityairuttarato yadevamuttaravedi mprokshati digbhya
    eva ta dyajamano bhratrivya npra nudata indro yati thsalavrikebhyah prayaccha ndakshinata uttaravedya
    adan ya ddakshinata uttaravedyai ni naye dyadeva tatra krura ndhyayecchucai vainamarpayati || sottaravedirabravi
    nmaya kaman vyashnavatheti te deva akamayantasura nbhratrivyanabhi bhavemeti te ssigmhirasi sapatnasahi
    svaheti te nabhibhuyakamayanta prajam ssigmhirasi suprajavani ssvaheti te prajamavindanta te prajam
    akamayanta pashun ssigmhirasi rayasposhavani ssvaheti te pashunavindanta te pashun 'kamayanta pratishtham
    mpratishthamavindanta ta ima 'kamayanta devata ashisha upeyameti te ssigmhirasya vaha deva yajamanaya
    svaheti te devata ashisha upaya npanca kritvo vyagharayati panca kshara panktih pankto yajno yajnamevava
    rundhe 'kshnaya vyagharayati tasmadakshnaya pashavo 'ngani praharanti pratishthityai bhutebhyastveti
    srucamudgrihnati ya eva deva bhutastesha ntaneva tena prinati pautudrava vi~dhritya agnestrayo jyayagmso
    bhratara asa nte devebhyo havyam va~hantah pramiyanta so 'rishyatiti sa nilayata sa yam va~naspatishvavasatta
    mputudrau yamoshadhishu tagm sugandhitejane ya mpetvasyantara shringe ta ndevatah praishamaiccha nnupa
    na a vartasva havya vri~nai yadeva grihitasyahutasya bahihparidhi skanda 'hutasya bahihparidhi skandati
    tesha ntaneva tena prinati so 'sthanvanto me purve bhratarah prameshata 'sthani shataya iti sa ya
    nyasthanyashatayata ta dyanmagm samupamrita dgulgulu yadetan thsambharatyagneh purisha thsambhara
    atho khalvahurete vavaina nte bhratarah pari shere ya tpautudravah paridhaya iti || catushcatvarigmshacca
    baddhamava syati varunapashadevaine muncati pranenekti meddhye evaine karoti savitriyarca hutva havirdhane
    pra vartayati savitriprasuta evaine pra vartayati varuno va esha durvagubhayato baddho yadaksha thsuvagdeva
    duryagm a vadetyaha griha vai durya tnyupanakti patni hi sarvasya mitra mmitratvaya yadvai patni yajnasya
    karoti mithuna ntadatho patniya evaisha yajnasya 'navacchittyai vartmana va anvitya yajnagm rakshagmsi
    jighagmsanti vaishnavibhyamrigbhyam va~rtmano rjuhoti yajno vai vishnuryajnadeva rakshagsyapa hanti
    yadaddhvaryu drakshagmsi yajnagm hanyur mupasya juhotyagnivatyeva juhoti nandho 'ddhvaryurbhavati
    na yajnagm rakshagmsi ghnanti praci pretamaddhvara nkalpayanti ityaha suvargamevaine loka ngamayatyatra
    rametham nprithivya ityaha var ddevayajanagm shiro va eta dyajnasya yaddhavirdhana ndivo va vishnavuta
    va prithivya ityashirpadayarca dakshinasya havirdhanasya methi shata eva yajnasya yajamana ashisho
    'va rundhe dando va auparastritiyasya havirdhanasya vashatkare rudahriyate tritiyasya havirdhanasyavaruddhyai
    shiro va eta dyajnasya yaddhavirdhanam vi~shno raratamasi vishnoh prishthamasityaha tasmadetavaddha
    shiro vishyutam ddhruvamasityaha vaishnavagm hi devataya havirdhanam nna visragm sayedamehenaddhvaryuh
    pramiyeta tasma devasya tva savituh prasava ityabhrima datte prasu rbahubhyamityahashvinau hi devanamaddhvaryu
    asta bhyamityaha yatyai vajra iva va esha yadabhrirabhrirasi narirasityaha shantyai kande kande vai
    kriyamane yajnagm rakshagmsi jighagmsanti parilikhitagm rakshah parilikhita arataya ityaha rakshasa
    idamahagm rakshaso griva api krintami yo ndvishma ityaha dvau vava purushau ya ncaiva dveshti yashcaina
    ngrivah krintati dive tva 'ntarikshaya tva prithivyai tvetyahaibhya evainam lo~kebhyah prokshati parasta
    mmanushya urjamupa jivanti kruramiva va eta 'va nayati shantyai yavamatirava nayatyurgvai yava urgudubamra
    urjaivorjagm samardhayati yajamanena sammitaudubamri bhavati yavaneva yajamanastavati ndadhati pitrinagm
    sadanamasiti barhirava strinati pitridevatya tpitridevatya nikhata sya ravastirya minotyasya vi~dhrityai
    dyutanastva maruto minotvityaha dyutano ha sma vai maruto devana mminoti brahmavani mminoti brahmavani
    ntva kshatravanimityaha yathayajurevaita dghritena dyavaprithivi a prinethamityaudubamrya njuhoti
    dyavaprithivi eva rasenanaktya vasravayatyantameva yajamana naktyaindramasiti chadiradhi ni dadhatyaindragm
    hi devataya sado vishvajanasya chayetyaha vishvajanasya hyesha chaya ya ttrivrita stomena sammita
    ttejasvyeva bhava syaikadashakshara trishtugindriya ntrishtugindriyavyeva bhavati pancadashachadi
    bhratrivyavatah pancadasho vajro bhratrivyabhibhutyai saptadashachadi prajakamasya saptadashah prajapatih
    prajapateraptya ekavigmshatichadi pratishthakama mpratishtha pratishthitya udaram vai~ sada urgudubamro
    maddhyata audubamri mminoti maddhyata eva prajanamurja nmaddhyata urja bhunjate yajamanaloke vai dakshinani
    chadigmshi bhratrivyaloka uttarani dakshinanyuttarani karoti yajamana 'yajamanaduttaro 'ntarvartan
    karoti vyavrittyai tasmadaranya mpraja upa jivanti pari tva girvano gira ityaha yathayajurevaitadindrasya
    syurasindrasya dhruvamasityahaindragm hi devataya sado ya nna visragm sayedamehenaddhvaryuh pramiyeta
    tasma dyajnasya yaddhavirdhana mprana uparava havirdhane khayante tasma shnah prana rakshohano valagahano
    vaishnava nkhanamityaha vaishnava hi devatayoparava asura vai niryanto devana dbahumatrah khayanta
    idamaha nnah samano yamasamano nicakhanetyaha dvau vava purushau yashcaiva samano yashcasamano yamevasmai
    tau valaga mevodvapati santrinatti tasma thsantrinna antaratah prana na sa dasabhinnnah prana apo
    dardra antaratah prana yavamati tyurgvai yavah prana uparavah praneshvevorja ndadhati barhirava strinati
    tasma llomasha antaratah prana ajyena vyagharayati tejo va ajya mprana uparavah praneshveva tejo dadhati
    hanu va ete yajnasya yadadhishavane na sa ntrinattya satrimnne hi hanu atho khalu dirghasome satrindye
    dhrityai shiro va eta dyajnasya yaddhavirdhana prana uparava hanu mprana uparava hanu adhishavane
    jihva carma gravano danta mukhamahavaniyo nasiko rudaragm sado yada khalu vai jihvaya dathsvadhi khadatyatha
    mukha ddhavirdhane carmannadhi gravabhirabhishutya ''havaniye hutva pratyancah paretya sadasi bhakshayanti
    yo vai virajo yajnamukhe doham ve~da duha evai namiyam ttasyai tvakcarmodho 'dhishavane stana uparava
    gravano vathsa ritvijo duhanti somah payo ya evam || harih om || || krishna yajurvediya taittiriya
    samhitayam shashthakande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे द्वितीयः प्रश्नः सोममन्त्रब्राह्मणनिरूपणं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ यदु॒भौ वि॒मुच्या॑ ङ्क्रि॒यते॑ ता॒दृगे॒व त ङ्गृ॑ह्णाति य॒ज्ञस्य॒
    सन्त॑त्यै॒ पत्न्य॒न्वार॑भते॒ पत्नी॒ हि पारी॑णह्य॒स्येशे॒ पत्नि॑यै॒ वानु॑मत॒ न्निर्व॑पति॒ यद्वै पत्नी॑
    य॒ज्ञस्य॑ क॒रोति॑ मिथु॒न न्तदथो॒ पत्नि॑या ए॒वै न्वार॒भों ऽन॑वच्छित्त्यै॒ याव॑ ऽनुच॒रैरा॒गच्छ॑ति॒ सर्वे
    भ्यो॒ वै तेभ्य॑ आति॒थ्य ङ्क्रि॑यते॒ छन्दाग्ं॑सि॒ खलु॒ वै सोम॑स्य॒ राज्ञो॑ रा॑ति॒थ्यम॑सि॒ विष्ण॑वे॒
    त्वेत्या॑ह गायत्रि॒या ए॒वैतेन॑ करोति॒ सोम॑स्या ऽऽति॒थ्यम॑सि॒ विष्ण॑वे॒ त्वेत्या॑ह त्रि॒ष्टुभ॑ ए॒वैतेन॑
    करो॒त्यति॑थेराति॒थ्यम॑सि॒ विष्ण॑वे॒ त्वेत्या॑ह॒ जग॑त्या ए॒वैतेन॑ करोत्य॒ग्नये त्वा रायस्पोष॒दाव्न्ने॒
    विष्ण॑वे॒ त्वेत्या॑हानु॒ष्टुभ॑ ए॒वैतेन॑ करोति श्ये॒नाय॑ त्वा सोम॒भृते॒ विष्ण॑वे॒ त्वेत्या॑ह गायत्रि॒या
    ए॒वैतेन॑ करोति॒ पञ्च॒ कृत्वो॑ गृह्णाति॒ पञ्चा क्षरा प॒ङ्क्तिः पाङ्क्तो॑ य॒ज्ञो य॒ज्ञमे॒वाव॑ रुन्धे
