id: subrahmanyakavacam-3
category: kavacha
name:
  english: subrahmanyakavacam 3
  devanagari: सुब्रह्मण्यकवचम् ३
content:
  english: lam prithivyatmane gandham kalpayami | ham akashatmane pushpani kalpayami | yam vayvatmane
    dhupam kalpayami | ram agnyatmane dipam kalpayami | vam amritatmane amritam mahanaivedyam kalpayami
    | sam sarvatmane tambuladi sarvopacarapujan kalpayami || atha kavacam | subrahmanyah shirah patu shikham
    patu shivatmajah | shivah patu lalatam me bhrumadhyam krauncadaranah || 13|| bhuvau patu kumaro me
    netre patu trinetrakah | payadgaurisutah shrotre gandayugmam haratmajah || 14|| dakshanasaputadvaram
    pranarupi maheshvarah | sarvadevatmakah patu jihvam sarasvatapradah || 15|| dantan rakshatu deveshah
    taluyugmam shivatmajah | devasenapatih patu cubukam cadrijasutah || 16|| parvatinandanah patu dvavoshthau
    mama sarvada | shanmukho me mukham patu sarvadevashikhamanih || 17|| simhagarvapahanta me grivam patu
    sanatanah | tarakasurasamhanta kantham dushtantako'vatu || 18|| subhujo me bhujau patu skandhamagnisuto
    mama | sandhiyugmam guhah patu karau me patu pavanah || 19|| karangulih shrikaro'vyat surarakshanadikshitah
    | vakshah sthalam mahasenah tarakasurasudanah || 20|| kukshim patu sada devah subrahmanyah sureshvarah
    | udaram patu rakshoha nabhim me vishvapalakah || 21|| lokeshah patu prishtham me katim patu dharadharah
    | guhyam jitendriyah patu shishnam patu prajapatih || 22|| andadvayam mahadeva uruyugmam sada mama
    | sarvabhuteshvarah patu januyugmamaghapahah || 23|| janghe me vishvabhukpatu gulphau patu sanatanah
    | vallishvarah patu mama manibandhau mahabalah || 24|| patu vallipatih padau padaprishtham mahaprabhuh
    | padangulih shrikaro me indriyani sureshvarah || 25|| tvacam mahipatih patu romakupamstu shankarih
    | shanmaturah sada patu sarvada ca harapriyah || 26|| kartikeyastu shuklam me raktam sharavanodbhavah
    | vacam vagishvarah patu nadam me'vyatkumarakah || 27|| purvasyam dishi senanirmam patu jagadishvarah
    | agneyyamagnidevashca kraturupi paratparah || 28|| dakshinasyamugrarupah sarvapapavinashanah | khadgadhari
    ca nairrityam sarvarakshoniyamakah || 29|| pashcimasyam dishi sada jaladharo jitendriyah | vayavyam
    pranarupo'vyanmahaseno mahabalah || 30|| uttarasyam dishi sada nidhikarta sa patu mam | shambhuputrah
    sada patu dishyaishanyam mahadyutih || 31|| urdhvam brahmapatih patu caturmukhanishevitah | adhastatpatu
    vishvatma sada brahmandabhritparah || 32|| madhyam patu mahasenah shurasamharakritsada | ahankaram
    mano buddhim skandah patu sada mama || 33|| gangatiranivasi mamadiyame sada'vatu | madhyayame surashreshthastritiye
    patu shambhavah || 34|| dinante lokanatho mam purvaratryam purarijah | ardharatre mahayogi nishante
    kalarupadhrit || 35|| mrityunjayah sarvakalamantastu shikhivahanah | bahih sthitam shaktidharah patu
    mam yogipujitah || 36|| sarvatra mam sada patu yogavidyo niranjanah | patu mam pancabhutebhyah pancabhutatmakastada
    || 37|| tishthantamagnibhuh patu gacchantam shurasudanah | vishakho'vyacchayanam mam nishannam tu
    sureshvarah || 38|| marge me nilakanthashca shailadurgeshu nayakah | aranyadeshe durge cabhayam dadyadbhayapahah
    || 39|| bharyam putrapradah patu putran rakshet haratmajah | pashun rakshenmahateja dhanam dhanapatirmama
    || 40|| rajarajarcitah patu hrasvadeham mahabalah | jivanam patu sarvesho mahamanivibhushanah || 41||
    suryodaye tu mam sarvo hyashvinyadyashca tarakah | meshadya rashayashcaiva prabhavadyashca vatsarah
    || 42|| ayane dve shadritavo masashcaitramukhastatha | shuklakrishnau tatha pakshau tithayah pratipanmukhah
    || 43|| ahoratre ca yamadi muhurta ghatikastatha | kalah kashthadayashcaiva ye canye kalabhedakah
    || 44|| te sarve gunasampannah santu saumyastadajnaya | ye pakshino mahakrurah uragah kruradrishtayah
    || 45|| ulukah kakasanghashca shyenah kankadisamjnakah | shukashca sarikashcaiva gridhrah kanka bhayanakah
    || 46|| te sarve skandadevasya khadgajalena khanditah | shatasho vilayam yantu bhinnapaksha bhayaturah
    || 47|| ye dravyaharinashcaiva ye ca himsapara dvishah | ye pratyuhakara martya dushtamartya durashayah
    || 48|| dushta bhupalasandohah ye bhubharakarah sada | kayavighnakara ye ca ye khala dushtabuddhayah
    || 49|| ye ca mayavinah krurah sarvadravyapaharinah | ye capi dushtakarmano mlecchashca yavanadayah
    || 50|| nityam kshudrakara ye ca hyasmadbadhakarah pare | danava ye mahadaityah pishaca ye mahabalah
    || 51|| shakinidakinibhedah vetala brahmarakshasah | kushmandabhairavadya ye kamini mohini tatha ||
    52|| apasmaragraha ye ca raktamamsabhujo hi ye | gandharvapsarasah siddha ye ca devasya yonayah ||
    53|| ye ca pretah kshetrapalah ye vinayakasamjnakah | mahamesha mahavyaghra mahaturagasamjnakah ||
    54|| mahagovrishasimhadyah saindhava ye mahagajah | vanarah shunaka ye ca varaha vanacarinah || 55||
    vrikoshtrakharamarjarah ye catikshudrajantavah | agadhabhuta bhutangagrahagrahyapradayakah || 56||
    jvalamalashca tadito duratmano'tiduhkhadah | nanarogakara ye ca kshudravidya mahabalah || 57|| mantrayantrasamudbhutah
    tantrakalpitavigrahah | ye sphotaka maharogah vatikah paittikashca ye || 58|| sannipatashleshmakashca
    mahaduhkhakarastatha | maheshvara vaishnavashca vairincashca mahajvarah || 59|| caturthikah pakshikashca
    masashanmasikashca ye | samvatsara durnivarya jvarah paramadarunah || 60|| srishtaka ye mahotpata
    ye jagratsvapnadushakah | ye grahah krurakartaro ye va balagrahadayah || 61|| mahashino mamsabhujo
    manobuddhindriyapahah | sphotakashca mahaghorah carmamamsadisambhavah || 62|| divacora ratricora ye
    sandhyasu ca darunah | jalajah sthalajashcaiva sthavara jangamashca ye || 63|| vishapradah kritrimashca
    mantratantrakriyakarah | maranoccatanonmuladveshamohanakarinah || 64|| garudadyah pakshijata udbhidashcandajashca
    ye | kutayuddhakara ye ca svamidrohakarashca ye || 65|| kshetragramahara ye ca bandhanopadravapradah
    | mantra ye vividhakarah ye ca pidakarastatha || 66|| yo cokta ye hyanuktashca bhupatalantarikshagah
    | te sarve shivaputrasya kavacottaranadiha || 67|| sahasradha layam yantu duradeva tirohitah | phalashrutih
    | ityetatkavacam divyam shanmukhasya mahatmanah || 68|| sarvasampatpradam nrinam sarvakayarthasadhanam
    | sarvavashyakaram punyam putrapautrapradayakam || 69|| rahasyatirahasyam ca guhyadguhyataram mahat
    | sarvedevapriyakaram sarvanandapradayakam || 70|| ashtaishvaryapradam nityam sarvaroganivaranam |
    anena sadrisham varma nasti brahmandagolake || 71|| satyam satyam punah satyam sha
  devanagari: लं पृथिव्यात्मने गन्धं कल्पयामि । हं आकाशात्मने पुष्पाणि कल्पयामि । यं वाय्वात्मने धूपं
    कल्पयामि । रं अग्न्यात्मने दीपं कल्पयामि । वं अमृतात्मने अमृतं महानैवेद्यं कल्पयामि । सं सर्वात्मने
    ताम्बूलादि सर्वोपचारपूजान् कल्पयामि ॥ अथ कवचम् । सुब्रह्मण्यः शिरः पातु शिखां पातु शिवात्मजः । शिवः
    पातु ललाटं मे भ्रूमध्यं क्रौञ्चदारणः ॥ १३॥ भुवौ पातु कुमारो मे नेत्रे पातु त्रिनेत्रकः । पायाद्गौरीसुतः
    श्रोत्रे गण्डयुग्मं हरात्मजः ॥ १४॥ दक्षनासापुटद्वारं प्राणरूपी महेश्वरः । सर्वदेवात्मकः पातु जिह्वां
    सारस्वतप्रदः ॥ १५॥ दन्तान् रक्षतु देवेशः तालुयुग्मं शिवात्मजः । देवसेनापतिः पातु चुबुकं चाद्रिजासुतः
    ॥ १६॥ पार्वतीनन्दनः पातु द्वावोष्ठौ मम सर्वदा । षण्मुखो मे मुखं पातु सर्वदेवशिखामणिः ॥ १७॥ सिंहगर्वापहन्ता
    मे ग्रीवां पातु सनातनः । तारकासुरसंहन्ता कण्ठं दुष्टान्तकोऽवतु ॥ १८॥ सुभुजो मे भुजौ पातु स्कन्धमग्निसुतो
    मम । सन्धियुग्मं गुहः पातु करौ मे पातु पावनः ॥ १९॥ कराङ्गुलीः श्रीकरोऽव्यात् सुररक्षणदीक्षितः । वक्षः
    स्थलं महासेनः तारकासुरसूदनः ॥ २०॥ कुक्षिं पातु सदा देवः सुब्रह्मण्यः सुरेश्वरः । उदरं पातु रक्षोहा
    नाभिं मे विश्वपालकः ॥ २१॥ लोकेशः पातु पृष्ठं मे कटिं पातु धराधरः । गुह्यं जितेन्द्रियः पातु शिश्नं
    पातु प्रजापतिः ॥ २२॥ अण्डद्वयं महादेव ऊरुयुग्मं सदा मम । सर्वभूतेश्वरः पातु जानुयुग्ममघापहः ॥ २३॥
    जङ्घे मे विश्वभुक्पातु गुल्फौ पातु सनातनः । वल्लीश्वरः पातु मम मणिबन्धौ महाबलः ॥ २४॥ पातु वल्लीपतिः
    पादौ पादपृष्ठं महाप्रभुः । पादाङ्गुलीः श्रीकरो मे इन्द्रियाणि सुरेश्वरः ॥ २५॥ त्वचं महीपतिः पातु रोमकूपांस्तु
    शाङ्करिः । षाण्मातुरः सदा पातु सर्वदा च हरप्रियः ॥ २६॥ कार्तिकेयस्तु शुक्लं मे रक्तं शरवणोद्भवः ।
    वाचं वागीश्वरः पातु नादं मेऽव्यात्कुमारकः ॥ २७॥ पूर्वस्यां दिशि सेनानीर्मां पातु जगदीश्वरः । आग्नेय्यामग्निदेवश्च
    क्रतुरूपी परात्परः ॥ २८॥ दक्षिणस्यामुग्ररूपः सर्वपापविनाशनः । खड्गधारी च नैरृत्यां सर्वरक्षोनियामकः
    ॥ २९॥ पश्चिमास्यां दिशि सदा जलाधारो जितेन्द्रियः । वायव्यां प्राणरूपोऽव्यान्महासेनो महाबलः ॥ ३०॥ उत्तरस्यां
    दिशि सदा निधिकर्ता स पातु माम् । शम्भुपुत्रः सदा पातु दिश्यैशान्यां महाद्युतिः ॥ ३१॥ ऊर्ध्वं ब्रह्मपतिः
    पातु चतुर्मुखनिषेवितः । अधस्तात्पातु विश्वात्मा सदा ब्रह्माण्डभृत्परः ॥ ३२॥ मध्यं पातु महासेनः शूरसंहारकृत्सदा
    । अहङ्कारं मनो बुद्धिं स्कन्दः पातु सदा मम ॥ ३३॥ गङ्गातीरनिवासी मामादियामे सदाऽवतु । मध्ययामे सुरश्रेष्ठस्तृतीये
    पातु शाम्भवः ॥ ३४॥ दिनान्ते लोकनाथो मां पुर्वरात्र्यां पुरारिजः । अर्धरात्रे महायोगी निशान्ते कालरूपधृत्
    ॥ ३५॥ मृत्युञ्जयः सर्वकालमन्तस्तु शिखिवाहनः । बहिः स्थितं शक्तिधरः पातु मां योगिपूजितः ॥ ३६॥ सर्वत्र
    मां सदा पातु योगविद्यो निरञ्जनः । पातु मां पञ्चभूतेभ्यः पञ्चभूतात्मकस्तदा ॥ ३७॥ तिष्ठन्तमग्निभूः पातु
    गच्छन्तं शूरसूदनः । विशाखोऽव्याच्छयानं मां निषण्णं तु सुरेश्वरः ॥ ३८॥ मार्गे मे नीलकण्ठश्च शैलदुर्गेषु
    नायकः । अरण्यदेशे दुर्गे चाभयं दद्याद्भयापहः ॥ ३९॥ भार्यां पुत्रप्रदः पातु पुत्रान् रक्षेत् हरात्मजः
    । पशून् रक्षेन्महातेजा धनं धनपतिर्मम ॥ ४०॥ राजराजार्चितः पातु ह्रस्वदेहं महाबलः । जीवनं पातु सर्वेशो
    महामणिविभूषणः ॥ ४१॥ सूर्योदये तु मां सर्वो ह्यश्विन्याद्याश्च तारकाः । मेषाद्या राशयश्चैव प्रभवाद्याश्च
    वत्सराः ॥ ४२॥ अयने द्वे षडृतवो मासाश्चैत्रमुखास्तथा । शुक्लकृष्णौ तथा पक्षौ तिथयः प्रतिपन्मुखाः ॥
    ४३॥ अहोरात्रे च यामादि मुहूर्ता घटिकास्तथा । कलाः काष्ठादयश्चैव ये चान्ये कालभेदकाः ॥ ४४॥ ते सर्वे
    गुणसम्पन्नाः सन्तु सौम्यास्तदाज्ञया । ये पक्षिणो महाक्रूराः उरगाः क्रूरदृष्टयः ॥ ४५॥ उलूकाः काकसङ्घाश्च
    श्येनाः कङ्कादिसंज्ञकाः । शुकाश्च सारिकाश्चैव गृध्राः कङ्का भयानकाः ॥ ४६॥ ते सर्वे स्कन्ददेवस्य खड्गजालेन
    खण्डिताः । शतशो विलयं यान्तु भिन्नपक्षा भयातुराः ॥ ४७॥ ये द्रव्यहारिणश्चैव ये च हिंसापरा द्विषः ।
    ये प्रत्यूहकरा मर्त्या दुष्टमर्त्या दुराशयाः ॥ ४८॥ दुष्टा भूपालसन्दोहाः ये भूभारकराः सदा । कायविघ्नकरा
    ये च ये खला दुष्टबुद्धयः ॥ ४९॥ ये च मायाविनः क्रूराः सर्वद्रव्यापहारिणः । ये चापि दुष्टकर्माणो म्लेच्छाश्च
    यवनादयः ॥ ५०॥ नित्यं क्षुद्रकरा ये च ह्यस्मद्बाधाकराः परे । दानवा ये महादैत्याः पिशाचा ये महाबलाः
    ॥ ५१॥ शाकिनीडाकिनीभेदाः वेताला ब्रह्मराक्षसाः । कूष्माण्डभैरवाद्या ये कामिनी मोहिनी तथा ॥ ५२॥ अपस्मारग्रहा
    ये च रक्तमांसभुजो हि ये । गन्धर्वाप्सरसः सिद्धा ये च देवस्य योनयः ॥ ५३॥ ये च प्रेताः क्षेत्रपालाः
    ये विनायकसंज्ञकाः । महामेषा महाव्याघ्रा महातुरगसंज्ञकाः ॥ ५४॥ महागोवृषसिंहाद्याः सैन्धवा ये महागजाः
    । वानराः शुनका ये च वराहा वनचारिणः ॥ ५५॥ वृकोष्ट्रखरमार्जाराः ये चातिक्षुद्रजन्तवः । अगाधभूता भूताङ्गग्रहग्राह्यप्रदायकाः
    ॥ ५६॥ ज्वालामालाश्च तडितो दुरात्मानोऽतिदुःखदाः । नानारोगकरा ये च क्षुद्रविद्या महाबलाः ॥ ५७॥ मन्त्रयन्त्रसमुद्भूताः
    तन्त्रकल्पितविग्रहाः । ये स्फोटका महारोगाः वातिकाः पैत्तिकाश्च ये ॥ ५८॥ सन्निपातश्लेष्मकाश्च महादुःखकरास्तथा
    । माहेश्वरा वैष्णवाश्च वैरिञ्चाश्च महाज्वराः ॥ ५९॥ चातुर्थिकाः पाक्षिकाश्च मासषाण्मासिकाश्च ये । सांवत्सरा
    दुर्निवार्या ज्वराः परमदारुणाः ॥ ६०॥ सृष्टका ये महोत्पाता ये जाग्रत्स्वप्नदूषकाः । ये ग्रहाः क्रूरकर्तारो
    ये वा बालग्रहादयः ॥ ६१॥ महाशिनो मांसभुजो मनोबुद्धीन्द्रियापहाः । स्फोटकाश्च महाघोराः चर्ममांसादिसम्भवाः
    ॥ ६२॥ दिवाचोरा रात्रिचोरा ये सन्ध्यासु च दारुणाः । जलजाः स्थलजाश्चैव स्थावरा जङ्गमाश्च ये ॥ ६३॥ विषप्रदाः
    कृत्रिमाश्च मन्त्रतन्त्रक्रियाकराः । मारणोच्चाटनोन्मूलद्वेषमोहनकारिणः ॥ ६४॥ गरुडाद्याः पक्षिजाता उद्भिदश्चाण्डजाश्च
    ये । कूटयुद्धकरा ये च स्वामिद्रोहकराश्च ये ॥ ६५॥ क्षेत्रग्रामहरा ये च बन्धनोपद्रवप्रदाः । मन्त्रा
    ये विविधाकाराः ये च पीडाकरास्तथा ॥ ६६॥ यो चोक्ता ये ह्यनुक्ताश्च भूपातालान्तरिक्षगाः । ते सर्वे शिवपुत्रस्य
    कवचोत्तारणादिह ॥ ६७॥ सहस्रधा लयं यान्तु दूरादेव तिरोहिताः । फलश्रुतिः । इत्येतत्कवचं दिव्यं षण्मुखस्य
    महात्मनः ॥ ६८॥ सर्वसम्पत्प्रदं नृणां सर्वकायार्थसाधनम् । सर्ववश्यकरं पुण्यं पुत्रपौत्रप्रदायकम् ॥
    ६९॥ रहस्यातिरहस्यं च गुह्याद्गुह्यतरं महत् । सर्वेदेवप्रियकरं सर्वानन्दप्रदायकम् ॥ ७०॥ अष्टैश्वर्यप्रदं
    नित्यं सर्वरोगनिवारणम् । अनेन सदृशं वर्म नास्ति ब्रह्माण्डगोलके ॥ ७१॥ सत्यं सत्यं पुनः सत्यं श
