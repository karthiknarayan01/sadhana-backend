    । ॐ श्रीं क्लीं कालरात्रीश्च ॐ श्रीं सः नलकूबरी ॥ १११॥ ॐ वां वटेश्वरी स्वाहा महामाया म्लौं तथा । ॐ
    श्रीं चण्डशरा स्वाहा ॐ श्रीं चण्डमदापहा ॥ ११२॥ ॐ ऐं क्लीं सौः च चामुण्डा ॐ श्रीं चण्डेश्वरी तथा ।
