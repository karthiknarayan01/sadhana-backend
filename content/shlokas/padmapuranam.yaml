id: padmapuranam
category: purana
name:
  english: padmapuranam
  devanagari: पद्मपुराणम्
content:
  english: padmapuranam vedavyasah padmapuranam vedavyasah anukramanika puranani agnipuranam kurmapuranam
    garudapuranam naradapuranam padmapuranam brahmapuranam brahmavaivartapuranam brahmandapuranam bhavishyapuranam
    bhagavatapuranam matsyapuranam markandeyapuranam lingapuranam varahapuranam vamanapuranam vayupuranam
    vishnupuranam shivapuranam skandapuranam harivamshapuranam upapuranah kalkipuranam kalikapuranam devibhagavatapuranam
    vishnudharmottarapuranam ramayanam valmikiramayanam yogavasishthah samhitagranthah gargasamhita lakshminarayanasamhita
    vikirnagranthah jaiminiyashvamedhaparva 1
  devanagari: पद्मपुराणम् वेदव्यासः पद्मपुराणम् वेदव्यासः अनुक्रमणिका पुराणानि अग्निपुराणम् कूर्मपुराणम्
    गरुडपुराणम् नारदपुराणम् पद्मपुराणम् ब्रह्मपुराणम् ब्रह्मवैवर्तपुराणम् ब्रह्माण्डपुराणम् भविष्यपुराणम्
    भागवतपुराणम् मत्स्यपुराणम् मार्कण्डेयपुराणम् लिङ्गपुराणम् वराहपुराणम् वामनपुराणम् वायुपुराणम् विष्णुपुराणम्
    शिवपुराणम् स्कन्दपुराणम् हरिवंशपुराणम् उपपुराणाः कल्किपुराणम् कालिकापुराणम् देवीभागवतपुराणम् विष्णुधर्मोत्तरपुराणम्
    रामायणम् वाल्मीकिरामायणम् योगवासिष्ठः संहिताग्रन्थाः गर्गसंहिता लक्ष्मीनारायणसंहिता विकीर्णग्रन्थाः
    जैमिनीयाश्वमेधपर्व १
meaning: {}
