id: shivastotramatrikritam
category: stotram
name:
  english: shivastotramatrikritam
  devanagari: शिवस्तोत्रमत्रिकृतं
content:
  english: namo namo nirguna nirvikara namo namo nishkala nishprapanca | namo namah shanta namo namaste
    namo namaste shiva sarvarupa || 68|| namo namah samba namo namaste namo namah shankara sarvaheto |
    namo namo'meyagunasvarupa turiyashambho satatam namaste || 69|| namo namo'nantagunaikasindho prapannabandho
    bhagavannamaste | namo namah sharva namo namaste namo namah parnya namo namaste || 70|| namo namaste'stu
    namo'stu shambho namo namaste'stu namo'stu rudra | namo namaste girijasahaya namo namaste'stu namo
    mahesha || 71|| namo namaste'stu hiranyabaho namo namaste'tu hiranyarupa | namo namaste'stu hiranyavarna
    namo namaste'stu hiranyaheto || 72|| namo namaste'stu shashankamaule namo namaste'stu pinakapane |
    namo namaste'stu vrishankaketo namo namaste'stu namo girisha || 73|| namo namaste prithivisvarupa
    namo namaste'tu jalasvarupa | tejahsvarupaya namo namaste vayusvarupaya namo namaste || 74|| akasharupaya
    namo namaste kalasvarupaya namo namaste | namo namaste'stu digatmane sada namo namaste sakalatmamurtaye
    || 75|| namo namaste'stu karpadane sada namo namaste'stu kapalamaline | namo namaste'stu namastvishimate
    namo namaste'stu nishangane namah || 76|| namo namaste'stu namo'stu shangine namo namaste'stu namo'stu
    babhrushe | namo namaste shipivishta shambho namo namaste'stu haramaresha || 77|| namo namaste haripujitanghre
    namo namaste harinetrapada | namo namaste harijanmaheto namo namaste harigitakirte || 78|| namo namaste
    vidhijanmaheto namo namaste vidhimurdhahartah | namo namaste harajanmaheto namo namaste harahartrimurte
    || 79|| namo namaste'khilajanmaheto namo namaste'khilanasha heto | namo namo nirmala nityarupa namo
    namo nityavicarashuddha || 80|| namo namo nityavishuddha buddha namo namo nirbhaya bhimarupa | namo
    namah sargavisargaheto namo namah sargavinashaheto || 81|| namo namaste hara mrityumrityo namo namaste
    shivavishnumrityo | namo namaste jagadekamrityo namo namah shankara shankaresha || 82|| || iti shivarahasyantargate
    atrikritam shivastotram sampurnam ||
  devanagari: नमो नमो निर्गुण निर्विकार नमो नमो निष्कल निष्प्रपञ्च । नमो नमः शान्त नमो नमस्ते नमो नमस्ते
    शिव सर्वरूप ॥ ६८॥ नमो नमः साम्ब नमो नमस्ते नमो नमः शङ्कर सर्वहेतो । नमो नमोऽमेयगुणस्वरूप तुरीयशम्भो
    सततं नमस्ते ॥ ६९॥ नमो नमोऽनन्तगुणैकसिन्धो प्रपन्नबन्धो भगवन्नमस्ते । नमो नमः शर्व नमो नमस्ते नमो नमः
    पर्ण्य नमो नमस्ते ॥ ७०॥ नमो नमस्तेऽस्तु नमोऽस्तु शम्भो नमो नमस्तेऽस्तु नमोऽस्तु रुद्र । नमो नमस्ते
    गिरिजासहाय नमो नमस्तेऽस्तु नमो महेश ॥ ७१॥ नमो नमस्तेऽस्तु हिरण्यबाहो नमो नमस्तेऽतु हिरण्यरूप । नमो
    नमस्तेऽस्तु हिरण्यवर्ण नमो नमस्तेऽस्तु हिरण्यहेतो ॥ ७२॥ नमो नमस्तेऽस्तु शशाङ्कमौले नमो नमस्तेऽस्तु
    पिनाकपाणे । नमो नमस्तेऽस्तु वृषाङ्ककेतो नमो नमस्तेऽस्तु नमो गिरीश ॥ ७३॥ नमो नमस्ते पृथिवीस्वरूप नमो
    नमस्तेऽतु जलस्वरूप । तेजःस्वरूपाय नमो नमस्ते वायुस्वरूपाय नमो नमस्ते ॥ ७४॥ आकाशरूपाय नमो नमस्ते कालस्वरूपाय
    नमो नमस्ते । नमो नमस्तेऽस्तु दिगात्मने सदा नमो नमस्ते सकलात्ममूर्तये ॥ ७५॥ नमो नमस्तेऽस्तु कर्पादने
    सदा नमो नमस्तेऽस्तु कपालमालिने । नमो नमस्तेऽस्तु नमस्त्विषीमते नमो नमस्तेऽस्तु निषङ्गणे नमः ॥ ७६॥
    नमो नमस्तेऽस्तु नमोऽस्तु शाङ्गिणे नमो नमस्तेऽस्तु नमोऽस्तु बभ्रुषे । नमो नमस्ते शिपिविष्ट शम्भो नमो
    नमस्तेऽस्तु हरामरेश ॥ ७७॥ नमो नमस्ते हरिपूजिताङ्घ्रे नमो नमस्ते हरिनेत्रपाद । नमो नमस्ते हरिजन्महेतो
    नमो नमस्ते हरिगीतकीर्ते ॥ ७८॥ नमो नमस्ते विधिजन्महेतो नमो नमस्ते विधिमूर्धहर्तः । नमो नमस्ते हरजन्महेतो
    नमो नमस्ते हरहर्तृमूर्ते ॥ ७९॥ नमो नमस्तेऽखिलजन्महेतो नमो नमस्तेऽखिलनाश हेतो । नमो नमो निर्मल नित्यरूप
    नमो नमो नित्यविचारशुद्ध ॥ ८०॥ नमो नमो नित्यविशुद्ध बुद्ध नमो नमो निर्भय भीमरूप । नमो नमः सर्गविसर्गहेतो
    नमो नमः सर्गविनाशहेतो ॥ ८१॥ नमो नमस्ते हर मृत्युमृत्यो नमो नमस्ते शिवविष्णुमृत्यो । नमो नमस्ते जगदेकमृत्यो
    नमो नमः शङ्कर शङ्करेश ॥ ८२॥ ॥ इति शिवरहस्यान्तर्गते अत्रिकृतं शिवस्तोत्रं सम्पूर्णम् ॥
