id: bhairavyashtottarashatanamastotram-2
category: stotram
name:
  english: bhairavyashtottarashatanamastotram 2
  devanagari: भैरव्यष्टोत्तरशतनामस्तोत्रम् २
content:
  english: rupini vishnurupini || 11|| vedantarupini vidya tatha vaikuntharupini | brahmandarupini raksha
    rupino brahmarupini || 12|| vasuda sumahavala vedarupa vinodini | kalika ca dharadhatri raudri ca
    vishvarupini || 13|| virupakshi vishalakshi vishala vishama vidhuh | vidyavati rasavati valavalavati
    badhuh || 14|| vaishvanarovishakha ca veshadeshasvarupini | ranjani rangini ramya rama rasasvarupini
    || 15|| rama shrisarasonmatta rasarupa rasaprada | radhika ramarupa ca radhya ramartti nashini ||
    16|| shatanama stotramidam yah pathet shivamandire | pathitva pathayitva va sarvasaubhagya malabhet
    || 17|| trisandhya yah pathennityam bhaktya dvivatsaravadhi | sarvasiddhishvaro bhutva ganapatyam
    labhetasah || 18|| iti shrikalivilasatantre shribhairavi
  devanagari: रूपिणी विष्णुरूपिणी ॥ ११॥ वेदान्तरूपिणी विद्या तथा वैकुण्ठरूपिणी । ब्रह्मण्डरूपिणी रक्षा
    रूपिणो ब्रह्मरूपिणी ॥ १२॥ वसुदा सुमहावाला वेदरूपा विनोदिनी । कालिका च धराधात्री रौद्री च विश्वरूपिणी
    ॥ १३॥ विरूपाक्षी विशालाक्षी विशाला विषमा विधुः । विद्यावती रसवती वलावलवती बधूः ॥ १४॥ वैश्वानरोविशाखा
    च वेशदेशस्वरूपिणी । रञ्जनी रङ्गिणी रम्या रामा रासस्वरूपिणी ॥ १५॥ रामा श्रीसारसोन्मत्ता रसरूपा रसप्रदा
    । राधिका रामरूपा च राध्या रामार्त्ति नाशिनी ॥ १६॥ शतनाम स्तोत्रमिदं यः पठेत् शिवमन्दिरे । पठित्वा
    पाठयित्वा वा सर्वसौभाग्य मालभेत् ॥ १७॥ त्रिसन्ध्य यः पठेन्नित्यं भक्त्या द्विवत्सरावधि । सर्वसिद्धीश्वरो
    भूत्वा गाणपत्यं लभेतसः ॥ १८॥ इति श्रीकालीविलासतन्त्रे श्रीभैरवी
