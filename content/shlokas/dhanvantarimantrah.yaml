id: dhanvantarimantrah
category: mantra
name:
  english: dhanvantarimantrah
  devanagari: धन्वन्तरिमन्त्रः
content:
  english: dhanvantarimantrah atha shridhanvantarimantrasya apantaratabha rishih | trishtupchandah | dhanvantarirdevata
    | om bijam | svaha shaktih | sarvarogavinashanarthe viniyogah | mantranyasah
  devanagari: धन्वन्तरिमन्त्रः अथ श्रीधन्वन्तरिमन्त्रस्य अपान्तरतभा ऋषिः । त्रिष्टुप्छन्दः । धन्वन्तरिर्देवता
    । ॐ बीजम् । स्वाहा शक्तिः । सर्वरोगविनाशनार्थे विनियोगः । मन्त्रन्यासः
meaning: {}
