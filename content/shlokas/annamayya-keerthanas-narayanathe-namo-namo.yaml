id: annamayya-keerthanas-narayanathe-namo-namo
category: stotram
name:
  english: Annamayya Keerthanas Narayanathe Namo Namo
content:
  english: adi pallavi narayanate namo namo bhava narada sannuta namo namo || murahara bhavahara mukunda
    madhava garuda gamana pankajanabha | parama purusha bhavabandha vimocana nara mriga sharira namo namo
    || jaladhi shayana ravicandra vilocana jalaruha bhavanuta caranayuga | balibandhana gopa vadhu vallabha
    nalino darate namo namo || adideva sakalagama pujita yadavakula mohana rupa | vedoddhara shri venkata
    nayaka nada priyate namo namo ||
  devanagari: आदि पल्लवि नारायणते नमो नमो भव नारद सन्नुत नमो नमो ॥ मुरहर भवहर मुकुन्द माधव गरुड गमन पङ्कजनाभ
    । परम पुरुष भवबन्ध विमोचन नर मृग शरीर नमो नमो ॥ जलधि शयन रविचन्द्र विलोचन जलरुह भवनुत चरणयुग । बलिबन्धन
    गोप वधू वल्लभ नलिनो दरते नमो नमो ॥ आदिदेव सकलागम पूजित यादवकुल मोहन रूप । वेदोद्धर श्री वेङ्कट नायक
    नाद प्रियते नमो नमो ॥
