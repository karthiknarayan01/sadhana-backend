id: vasudevakritam2shrikrishnastotram
category: stotram
name:
  english: vasudevakritam2shrikrishnastotram
  devanagari: वसुदेवकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: rgrahyairgunaih sannapi tadgunagrahah | anavritatvadbahirantaram na te sarvasya sarvatmana
    atmavastunah || 17|| ya atmano drishyaguneshu sanniti vyavasyate svavyatirekato'budhah | vinanuvadam
    na ca tanmanishitam samyagyatastyaktamupadadatpuman || 18|| tvatto'sya janmasthitisamyaman vibho vadantyanihadagunadavikriyat
    | tvayishvare brahmani no virudhyate tvadashrayatvadupacaryate gunaih || 19|| sa tvam trilokasthitaye
    svamayaya bibharshi shuklam khalu varnamatmanah | sargaya raktam rajasopabrimhitam krishnam ca varnam
    tamasa janatyaye || 20|| tvamasya lokasya vibho rirakshishu
  devanagari: र्ग्राह्यैर्गुणैः सन्नपि तद्गुणाग्रहः । अनावृतत्वाद्बहिरन्तरं न ते सर्वस्य सर्वात्मन आत्मवस्तुनः
    ॥ १७॥ य आत्मनो दृश्यगुणेषु सन्निति व्यवस्यते स्वव्यतिरेकतोऽबुधः । विनानुवादं न च तन्मनीषितं सम्यग्यतस्त्यक्तमुपाददत्पुमान्
    ॥ १८॥ त्वत्तोऽस्य जन्मस्थितिसंयमान् विभो वदन्त्यनीहादगुणादविक्रियात् । त्वयीश्वरे ब्रह्मणि नो विरुध्यते
    त्वदाश्रयत्वादुपचर्यते गुणैः ॥ १९॥ स त्वं त्रिलोकस्थितये स्वमायया बिभर्षि शुक्लं खलु वर्णमात्मनः ।
    सर्गाय रक्तं रजसोपबृंहितं कृष्णं च वर्णं तमसा जनात्यये ॥ २०॥ त्वमस्य लोकस्य विभो रिरक्षिषु
