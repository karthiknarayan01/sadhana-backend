id: tripura-upan
category: upanishad
name:
  english: tripura-upan
  devanagari: त्रिपुर-उपन्
content:
  english: phalam ca bhaktani yonih suparishkritashca | nivedayandevatayai mahatyai svatmikrite sukrite
    siddhimeti || 12|| srinyeva sitaya vishvacarshanih pashenaiva pratibadhnatyabhikam | ishubhih pancabhirdhanusha
    ca vidhyatyadishaktiraruna vishvajanya || 13|| bhagah shaktirbhagavankama isha ubha dataraviha saubhaganam
    | samapradhanau samasatvau samojau tayoh shaktirajara vishvayonih || 14|| parisruta havisha bhavitena
    prasankoce galite vaimanaskah | sharvah sarvasya jagato vidhata dharta harta vishvarupatvameti ||
    15|| iyam mahopanishattraipurya yamaksharam paramo girbhiritte | eshargyajuh parametacca samayamatharveyamanya
    ca vidya || 16|| om hrim om hrimityupanishat || om vanme manasi pratishthita | mano me vaci pratishthitam
    | aviravirma edhi | vedasya ma anisthah | shrutam me ma prahasih | anenadhitenahoratran samdadhami
    | ritam vadishyami | satyam vadishyami | tanmamavatu | tadvaktaramavatu | avatu mam | avatu vaktaram
    | avatu vaktaram | om shantih shantih shantih || || iti tripuropanishat ||
  devanagari: फलं च भक्तानि योनीः सुपरिष्कृताश्च । निवेदयन्देवतायै महत्यै स्वात्मीकृते सुकृते सिद्धिमेति
    ॥ १२॥ सृण्येव सितया विश्वचर्षणिः पाशेनैव प्रतिबध्नात्यभीकाम् । इषुभिः पञ्चभिर्धनुषा च विध्यत्यादिशक्तिररुणा
    विश्वजन्या ॥ १३॥ भगः शक्तिर्भगवान्काम ईश उभा दाताराविह सौभगानाम् । समप्रधानौ समसत्वौ समोजौ तयोः शक्तिरजरा
    विश्वयोनिः ॥ १४॥ परिस्रुता हविषा भावितेन प्रसङ्कोचे गलिते वैमनस्कः । शर्वः सर्वस्य जगतो विधाता धर्ता
    हर्ता विश्वरूपत्वमेति ॥ १५॥ इयं महोपनिषत्त्रैपुर्या यामक्षरं परमो गीर्भिरीट्टे । एषर्ग्यजुः परमेतच्च
    सामायमथर्वेयमन्या च विद्या ॥ १६॥ ॐ ह्रीं ॐ ह्रीमित्युपनिषत् ॥ ॐ वाङ्मे मनसि प्रतिष्ठिता । मनो मे वाचि
    प्रतिष्ठितम् । आविरावीर्म एधि । वेदस्य म आणीस्थः । श्रुतं मे मा प्रहासीः । अनेनाधीतेनाहोरात्रान् संदधामि
    । ऋतं वदिष्यामि । सत्यं वदिष्यामि । तन्मामवतु । तद्वक्तारमवतु । अवतु माम् । अवतु वक्तारम् । अवतु वक्तारम्
    । ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति त्रिपुरोपनिषत् ॥
