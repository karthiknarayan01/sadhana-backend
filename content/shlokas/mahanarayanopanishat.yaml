id: mahanarayanopanishat
category: upanishad
name:
  english: mahanarayanopanishat
  devanagari: महानारायणोपनिषत्
content:
  english: satram ya evam vidvanudagayane pramiyate devanameva mahimanam gatvadityasya sayujyam gacchatyatha
    yo dakshine pramiyate pitrinameva mahimanam gatva candramasah sayujyam gacchatyetau vai suryacandramasormahimanau
    brahmano vidvanabhijayati tasmad brahmano mahimanamityupanishat || 1|| om sham no mitrah sham varunah
    | sham no bhavatyaryama | sham na indro brihaspatih | sham no vishnururukramah | namo brahmane | namaste
    vayo | tvameva pratyaksham brahmasi | tvameva pratyaksham brahmavadisham | ritamavadisham |satyamavadisham
    | tanmamavit | tadvaktaramavit | avinmam | avidvaktaram || om sahanavavatu | saha nau bhunaktu | saha
    viryam karavavahai | tejasvi navadhitamastu | ma vidvishavahai || om shantih shantih shantih || iti
    mahanarayanopanishatsamapta || || mahanarayanopanishat || harih om || sham no mitrah sham varunah
    | sham no bhavatyaryama | sham na indro brihaspatih | sham no vishnururukramah || namo brahmane |
    namaste vayo | tvameva pratyaksham brahmasi | tvameva pratyaksham brahma vadishyami | ritam vadishyami
    | satyam vadishyami | tanmamavatu | tadvaktaramavatu | avatu mam | avatu vaktaram || om shantih shantih
    shantih || om saha navavatu | saha nau bhunaktu | saha viryam karavavahai | tejasvi navadhitamastu
    | ma vidvishavahai | om shantih shantih shantih || prathamo'nuvakah | ambhasyapare bhuvanasya madhye
    nakasya prishthe mahato mahiyan | shukrena jyoti
  devanagari: सत्रं य एवं विद्वानुदगयने प्रमीयते देवानामेव महिमानं गत्वादित्यस्य सायुज्यं गच्छत्यथ यो
    दक्षिणे प्रमीयते पितृणामेव महिमानं गत्वा चन्द्रमसः सायुज्यं गच्छत्येतौ वै सूर्याचन्द्रमसोर्महिमानौ
    ब्राह्मणो विद्वानभिजयति तस्माद् ब्रह्मणो महिमानमित्युपनिषत् ॥ १॥ ॐ शं नो मित्रः शं वरुणः । शं नो भवत्यर्यमा
    । शं न इन्द्रो बृहस्पतिः । शं नो विष्णुरुरुक्रमः । नमो ब्रह्मणे । नमस्ते वायो । त्वमेव प्रत्यक्षं
    ब्रह्मासि । त्वामेव प्रत्यक्षं ब्रह्मावादिषम् । ऋतमवादिषम् ।सत्यमवादिषम् । तन्मामावीत् । तद्वक्तारमावीत्
    । आवीन्माम् । आविद्वक्तारम् ॥ ॐ सहनाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु
    । मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति महानारायणोपनिषत्समाप्ता ॥ ॥ महानारायणोपनिषत् ॥
    हरिः ॐ ॥ शं नो मित्रः शं वरुणः । शं नो भवत्यर्यमा । शं न इन्द्रो बृहस्पतिः । शं नो विष्णुरुरुक्रमः
    ॥ नमो ब्रह्मणे । नमस्ते वायो । त्वमेव प्रत्यक्षं ब्रह्मासि । त्वामेव प्रत्यक्षं ब्रह्म वदिष्यामि ।
    ऋतं वदिष्यामि । सत्यं वदिष्यामि । तन्मामवतु । तद्वक्तारमवतु । अवतु माम् । अवतु वक्तारम् ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु । मा विद्विषावहै
    । ॐ शान्तिः शान्तिः शान्तिः ॥ प्रथमोऽनुवाकः । अंभस्यपारे भुवनस्य मध्ये नाकस्य पृष्ठे महतो महीयान्
    । शुक्रेण ज्योती
