id: ramanujavaibhavahetushlokah
category: stotram
name:
  english: ramanujavaibhavahetushlokah
  devanagari: रामानुजवैभवहेतुश्लोकः
content:
  english: shrimadrangapatishca venkatapatih shrivaranadreh patih shriyadvadripatishca kecana tatha divyasthaladhishvarah
    | acaryashca sa yamuno munivarah shrishailapurnastatha shriramanujasamyamindragurave tadrikprasadam
    daduh || 1|| iti shrivaradavishnumahagurubhiranugrihitah shriramanujavaibhavahetushlokah | shrutyantadvayapithadeshikamanih
    shrivatsavamshagranih shriramanujabhaginaya iti yah khyatah kshamamandale | sa shrihastigirishasevanaparah
    pratyastabahyagamah mahakarunukirgunaih varadavishnvakhyocitaireghate || || shrivatsyavaradavishnumahagurave
    namah ||
  devanagari: श्रीमद्रङ्गपतिश्च वेङ्कटपतिः श्रीवारणाद्रेः पतिः श्रीयद्वद्रिपतिश्च केचन तथा दिव्यस्थलाधीश्वराः
    । आचार्यश्च स यामुनो मुनिवरः श्रीशैलपूर्णस्तथा श्रीरामानुजसंयमीन्द्रगुरवे तादृक्प्रसादं ददुः ॥ १॥
    इति श्रीवरदविष्णुमहागुरुभिरनुगृहीतः श्रीरामानुजवैभवहेतुश्लोकः । श्रुत्यन्तद्वयपीठदेशिकमणिः श्रीवत्सवंशाग्रणीः
    श्रीरामानुजभागिनय इति यः ख्यातः क्षमामण्डले । स श्रीहस्तिगिरीशसेवनपरः प्रत्यस्तबाह्यागमः माहाकारुणुकिर्गुणैः
    वरदविष्ण्वाख्योचितैरेघते ॥ ॥ श्रीवात्स्यवरदविष्णुमहागुरवे नमः ॥
meaning: {}
