id: batukabhairavakavacam-2-2
category: kavacha
name:
  english: batukabhairavakavacam 2
  devanagari: बटुकभैरवकवचम् २
content:
  english: batukabhairavakavacam 2 devyuvaca | devadeva jagannatha trinatha shritrilocana | bhavatprasadadbhagavanbhairavasya
    mahatmanah || 1|| kavacam shrotumicchami tvatsnehatishayadaham | shiva uvaca | praninam rakshanartham
    ca bravimi sumukhe gunan || 2|| varmano bhairavasyasya shivabrahma rishih smritah | chandonushtup
    tatha devo bhairavo batukatmajah || 3|| aishvaryasyabhivriddhyarthamishtartham ca niyujyate || 4||
    shulakhadgadamarulasatkaram savyahastamaparam karojjvalam | santatam hridi bhajami bhairavam svadhirudhamadhikarasiddhaye
    || 6|| digvasasam kamalapatravishalanetram bhasmangaragamabhayam prabhumadidevam | dhyayami tam batukanathamaharnisham
    me sarvarthasiddhimatulam kripaya dishantam || 6|| evam dhyatva tu devesham batukakhyam mahabalam
    | uccaretkavacam pashcaddevatabhishtasiddhidam || 7|| om shiro me bhairavah patu bhalam puranishudanah
    | drishau patu trinetro me shravanam nilakanthakah || 8|| digvasa me patu kantam nasikamaganyabhak
    | aushthau tripuraghati me jihvam patu kapaladhrik || 9|| dantanpatu kratudhvamsi cibukam bhutavasakah
    | kapali patu me grivam skandhau patu gajam takah || 10|| bhujau me patu kaumaro hridayam kshetrapalakah
    | abhirumem stanau patu vakshah patu maheshvarah || 11|| kukshau me patu samharta nabhim me shanmukhapriyah
    | bhutanathah katim patu guhyam patu jatadharah || 12|| uru patu vrisharudho januni bhutabhavanah
    | shmashanavasi me patu patu sarvangamishvarah || 13|| ya idam kavacam devi pathetprayatamanasah |
    tasyaishvaryabhivriddhyartham na dadamyaham || 14|| rogarto mucyate rogatputrarthi labhate sutan |
    japitva shraddhaya kanya ayushmantam patim labhet || 15|| vidyavinayasampannam sukulinam surupinam
    | japitva vidhava nari vaidhavyam napnuyatkvacit || 16|| japitva kavacam pratarmucyate natra samshayah
    | nasti tasyapamrityushcakalamrityuh kadacana || 17|| iha loke sukham bhuktva putrapautraih subandhavaih
    | ante kailasamavishya mama padatalam vrajet || 18|| tasmatsarvaprayatnena japennityamatandritah ||
    19|| ye bhaktiyuktah kavacam pathanti te vai kule sve kulino vasanti | tejodhikam vimshatisankhyaya
    dine kailasamapnoti mama prasadat || 20|| etatte kathitam devi yanmam tvam paripricchasi | tvatsnehatishayaduktam
    kavacam bhairavatmakam || 21|| iti shriharikrishnavinirmite brihajjyotisharnave dharmaskandhe upasanastabake
    shribatukabhairavopasanadhyaye shribatukabhairavaka canirupanam nama prakaranam caturtham || 4||
  devanagari: बटुकभैरवकवचम् २ देव्युवाच । देवदेव जगन्नाथ त्रिनाथ श्रीत्रिलोचन । भवत्प्रसादाद्भगवन्भैरवस्य
    महात्मनः ॥ १॥ कवचं श्रोतुमिच्छामि त्वत्स्नेहातिशयादहम् । शिव उवाच । प्राणिनां रक्षणार्थं च ब्रवीमि
    सुमुखे गुणान् ॥ २॥ वर्मणो भैरवस्यास्य शिवब्रह्मा ऋषिः स्मृतः । छन्दोनुष्टुप् तथा देवो भैरवो बटुकात्मजः
    ॥ ३॥ ऐश्वर्यस्याभिवृद्ध्यर्थमिष्टार्थं च नियुज्यते ॥ ४॥ शूलखड्गडमरूलसत्करं सव्यहस्तमपरं करोज्ज्वलम्
    । सन्ततं हृदि भजामि भैरवं स्वाधिरूढमधिकारसिद्धये ॥ ६॥ दिग्वाससं कमलपत्रविशालनेत्रं भस्माङ्गरागमभयं
    प्रभुमादिदेवम् । ध्यायामि तं बटुकनाथमहर्निशं मे सर्वार्थसिद्धिमतुलां कृपया दिशन्तम् ॥ ६॥ एवं ध्यात्वा
    तु देवेशं बटुकाख्यं महाबलम् । उच्चरेत्कवचं पश्चाद्देवताभीष्टसिद्धिदम् ॥ ७॥ ॐ शिरो मे भैरवः पातु भालं
    पुरनिषूदनः । दृशौ पातु त्रिनेत्रो मे श्रवणं नीलकण्ठकः ॥ ८॥ दिग्वासा मे पातु कण्टं नासिकामगन्यभाक्
    । औष्ठौ त्रिपुरघाती मे जिह्वां पातु कपालधृक् ॥ ९॥ दन्तान्पातु क्रतुध्वंसी चिबुकं भूतवासकः । कपाली
    पातु मे ग्रीवां स्कन्धौ पातु गजां तकः ॥ १०॥ भुजौ मे पातु कौमारो हृदयं क्षेत्रपालकः । अभीरुमें स्तनौ
    पातु वक्षः पातु महेश्वरः ॥ ११॥ कुक्षौ मे पातु संहर्ता नाभिं मे षण्मुखप्रियः । भूतनाथः कटिं पातु गुह्यं
    पातु जटाधरः ॥ १२॥ ऊरू पातु वृषारूढो जानुनी भूतभावनः । श्मशानवासी मे पातु पातु सर्वाङ्गमीश्वरः ॥ १३॥
    य इदं कवचं देवि पठेत्प्रयतमानसः । तस्यैश्वर्याभिवृद्ध्यर्थं न ददाम्यहम् ॥ १४॥ रोगार्तो मुच्यते रोगात्पुत्रार्थी
    लभते सुतान् । जपित्वा श्रद्धया कन्या आयुष्मन्तं पतिं लभेत् ॥ १५॥ विद्याविनयसम्पन्नं सुकुलीनं सुरूपिणम्
    । जपित्वा विधवा नारी वैधव्यं नाप्नुयात्क्वचित् ॥ १६॥ जपित्वा कवचं प्रातर्मुच्यते नात्र संशयः । नास्ति
    तस्यापमृत्युश्चाकालमृत्युः कदाचन ॥ १७॥ इह लोके सुखं भुक्त्वा पुत्रपौत्रैः सुबान्धवैः । अन्ते कैलासमाविश्य
    मम पादतलं व्रजेत् ॥ १८॥ तस्मात्सर्वप्रयत्नेन जपेन्नित्यमतन्द्रितः ॥ १९॥ ये भक्तियुक्ताः कवचं पठन्ति
    ते वै कुले स्वे कुलिनो वसन्ति । तेजोधिकं विंशतिसङ्ख्यया दिने कैलासमाप्नोति मम प्रसादात् ॥ २०॥ एतत्ते
    कथितं देवि यन्मां त्वं परिपृच्छसि । त्वत्स्नेहातिशयादुक्तं कवचं भैरवात्मकम् ॥ २१॥ इति श्रीहरिकृष्णविनिर्मिते
    बृहज्ज्योतिषार्णवे धर्मस्कन्धे उपसनास्तबके श्रीबटुकभैरवोपासनाध्याये श्रीबटुकभैरवका चनिरूपणं नाम प्रकरणं
    चतुर्थम् ॥ ४॥
