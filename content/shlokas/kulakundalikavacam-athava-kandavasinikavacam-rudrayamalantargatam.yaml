id: kulakundalikavacam-athava-kandavasinikavacam-rudrayamalantargatam
category: kavacha
name:
  english: kulakundalikavacam athava kandavasinikavacam (rudrayamalantargatam)
  devanagari: कुलकुण्डलीकवचं अथवा कन्दवासिनीकवचम् (रुद्रयामलान्तर्गतम्)
content:
  english: shrikulakundalikavacastotram athava kandavasinikavacam || shriganeshaya namah || || shriumamaheshvarabhyam
    namah || || shrigurave namah || anandabhairavi uvaca | atha vakshye mahadeva kundalikavacam shubham
    | paramanandadam siddham siddhavrindanishevitam || 1|| yatkritva yoginah sarve dharmadharmapradarshakah
    | jnanino manino dharman vicaranti yathamarah || 2|| siddhayo'pyanimadyashca karasthah sarvadevatah
    | etatkavacapathena devendro yogiradbhavet || 3|| rishayo yoginah sarve jatilah kulabhairavah | pratahkale
    trivaram ca madhyahne varayugmakam || 4|| sayahne varamekantu pathetkavacameva ca | pathedevam mahayogi
    kundalidarshanam bhavet || 5|| om asya shrikulakundalikavacasya brahmendra rishih | gayatri chandah
    | kulakundali devata | sarvabhishtasiddhyarthe viniyogah | om ishvari jagatam dhatri lalita sundari
    para | kundali kularupa ca patu mam kulacandika || 6|| shiro me lalita devi patugrakhya kapolakam
    | brahmamantrena putita bhrumadhyam patu me sada || 7|| netratrayam mahakali kalagnibhakshika shikham
    | dantavalim vishalakshi oshthamishtanuvasini || 8|| kamabijatmika vidya adharam patu me sada | liyugastha
    gandayugmam maya vishva rasapriya || 9|| bhuvaneshi karnayugmam cibukam krodhakalika | kapila me galam
    patu sarvabijasvarupini || 10|| matrikavarnaputita kundali kanthameva ca | hridayam kalaprithvi ca
    kankali patu me mukham || 11|| bhujayugmam caturvarga candadorddandakhandini | skandhayugmam skandamata
    halahalagata mama || 12|| angulyagram kulananda shrividya nakhamandalam | kalika bhuvaneshani prishthadesham
    sadavatu || 13|| parshvayugmam mahavira virasanadharabhaya | patu mam kuladarbhastha nabhimudaramambika
    || 14|| katidesham pithasamstha mahamahishaghatini | lingasthanam mahamudra bhagam malamanupriya ||
    15|| bhagirathapriya dhumra muladharam ganeshvari | caturdalam kakshyapujya dalagram me vasundhara
    || 16|| shirsham radha ranakhya ca brahmani patu me mukham | medini patu kamala vagdevi purvagam dalam
    || 17|| chedini dakshine patu patu canda mahatapa | candraghanta sada patu yogini varunam dalam ||
    18|| uttarastham dalam patu prithivimindrapalita | catushkonam kamavidya brahmavidyabjakonakam ||
    19|| ashtashulam sada patu sarvavahanavahana | caturbhuja sada patu dakini kulacancala || 20|| medhrastha
    madanadhara patu me carupankajam | svayambhulinga carvaka kotarakshi mamasanam || 21|| kadambavanamapatu
    kadambavanavasini | vaishnavi parama maya patu me vaishnavam padam || 22|| shaddalam rakini patu rakini
    kamavasini | kameshvari kamarupa shrikrishnam pitavasasam || 23|| vanamala vanadurga shankham me shankhini
    shiva | cakram cakreshvari patu kamalakshi gadam mama || 24|| padmam me padmagandha ca padmamala manohara
    | radilantaksharam patu lakini lokapalini || 25||
  devanagari: श्रीकुलकुण्डलीकवचस्तोत्रम् अथवा कन्दवासिनीकवचम् ॥ श्रीगणेशाय नमः ॥ ॥ श्रीउमामहेश्वराभ्यां
    नमः ॥ ॥ श्रीगुरवे नमः ॥ आनन्दभैरवी उवाच । अथ वक्ष्ये महादेव कुण्डलीकवचं शुभम् । परमानन्ददं सिद्धं
    सिद्धवृन्दनिषेवितम् ॥ १॥ यत्कृत्वा योगिनः सर्वे धर्माधर्मप्रदर्शकाः । ज्ञानिनो मानिनो धर्मान् विचरन्ति
    यथामराः ॥ २॥ सिद्धयोऽप्यणिमाद्याश्च करस्थाः सर्वदेवताः । एतत्कवचपाठेन देवेन्द्रो योगिराड्भवेत् ॥ ३॥
    ऋषयो योगिनः सर्वे जटिलाः कुलभैरवाः । प्रातःकाले त्रिवारं च मध्याह्ने वारयुग्मकम् ॥ ४॥ सायाह्ने वारमेकन्तु
    पठेत्कवचमेव च । पठेदेवं महायोगी कुण्डलीदर्शनं भवेत् ॥ ५॥ ॐ अस्य श्रीकुलकुण्डलीकवचस्य ब्रह्मेन्द्र
    ऋषिः । गायत्री छन्दः । कुलकुण्डली देवता । सर्वाभीष्टसिद्ध्यर्थे विनियोगः । ॐ ईश्वरी जगतां धात्री ललिता
    सुन्दरी परा । कुण्डली कुलरूपा च पातु मां कुलचण्डिका ॥ ६॥ शिरो मे ललिता देवी पातूग्राख्या कपोलकम् ।
    ब्रह्ममन्त्रेण पुटिता भ्रूमध्यं पातु मे सदा ॥ ७॥ नेत्रत्रयं महाकाली कालाग्निभक्षिका शिखाम् । दन्तावलीं
    विशालाक्षी ओष्ठमिष्टानुवासिनी ॥ ८॥ कामबीजात्मिका विद्या अधरं पातु मे सदा । ऌयुगस्था गण्डयुग्मं माया
    विश्वा रसप्रिया ॥ ९॥ भुवनेशी कर्णयुग्मं चिबुकं क्रोधकालिका । कपिला मे गलं पातु सर्वबीजस्वरूपिणी ॥
    १०॥ मातृकावर्णपुटिता कुण्डली कण्ठमेव च । हृदयं कालपृथ्वी च कङ्काली पातु मे मुखम् ॥ ११॥ भुजयुग्मं चतुर्वर्गा
    चण्डदोर्द्दण्डखण्डिनी । स्कन्धयुग्मं स्कन्दमाता हालाहलगता मम ॥ १२॥ अङ्गुल्यग्रं कुलानन्दा श्रीविद्या
    नखमण्डलम् । कालिका भुवनेशानी पृष्ठदेशं सदावतु ॥ १३॥ पार्श्वयुग्मं महावीरा वीरासनधराभया । पातु मां
    कुलदर्भस्था नाभिमुदरमम्बिका ॥ १४॥ कटिदेशं पीठसंस्था महामहिषघातिनी । लिङ्गस्थानं महामुद्रा भगं मालामनुप्रिया
    ॥ १५॥ भगीरथप्रिया धूम्रा मूलाधारं गणेश्वरी । चतुर्दलं कक्ष्यपूज्या दलाग्रं मे वसुन्धरा ॥ १६॥ शीर्षं
    राधा रणाख्या च ब्रह्माणी पातु मे मुखम् । मेदिनी पातु कमला वाग्देवी पूर्वगं दलम् ॥ १७॥ छेदिनी दक्षिणे
    पातु पातु चण्डा महातपा । चन्द्रघण्टा सदा पातु योगिनी वारुणं दलम् ॥ १८॥ उत्तरस्थं दलं पातु पृथिवीमिन्द्रपालिता
    । चतुष्कोणं कामविद्या ब्रह्मविद्याब्जकोणकम् ॥ १९॥ अष्टशूलं सदा पातु सर्ववाहनवाहना । चतुर्भुजा सदा
    पातु डाकिनी कुलचञ्चला ॥ २०॥ मेढ्रस्था मदनाधारा पातु मे चारुपङ्कजम् । स्वयम्भूलिङ्ग चार्वाका कोटराक्षी
    ममासनम् ॥ २१॥ कदम्बवनमापातु कदम्बवनवासिनी । वैष्णवी परमा माया पातु मे वैष्णवं पदम् ॥ २२॥ षड्दलं राकिणी
    पातु राकिणी कामवासिनी । कामेश्वरी कामरूपा श्रीकृष्णं पीतवाससम् ॥ २३॥ वनमाला वनदुर्गा शङ्खं मे शङ्खिनी
    शिवा । चक्रं चक्रेश्वरी पातु कमलाक्षी गदां मम ॥ २४॥ पद्मं मे पद्मगन्धा च पद्ममाला मनोहरा । रादिलान्ताक्षरं
    पातु लाकिनी लोकपालिनी ॥ २५॥
