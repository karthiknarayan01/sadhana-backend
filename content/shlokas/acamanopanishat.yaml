id: acamanopanishat
category: upanishad
name:
  english: acamanopanishat
  devanagari: आचमनोपनिषत्
content:
  english: paitrikam tirtham angushthamule brahmatirtham madhye agnitirtham | na tishthanna hasan na budbudairna
    ca lomaih gokarnakritivat kritva mashamagnajalam pibet | tena triracamet | prathamam yah pibedrigvedah
    prinatu | dvitiyam yahpibedyajurvedah prinatu | tritiyam yah pibet samavedah prinatu | lomadharoshthamatharvavedah
    prinatu | mukhamagnitriptam sarvam prokshati | yah pado prokshati yashcakshushi yashcandramadityau
    yannabhim tena prithivi yastatastena vishnuh | yacchirastena rudrah | murdhni shatakuberah | sarvadevatyaste
    prinantu | ya evam veda | ityupanishat || ityacamanopanishat samapta |
  devanagari: पैतृकं तीर्थं अङ्गुष्ठमूले ब्रह्मतीर्थं मध्ये अग्नितीर्थम् । न तिष्ठन्न हसन् न बुद्बुदैर्न
    च लोमैः गोकर्णाकृतिवत् कृत्वा माषमग्नजलं पिबेत् । तेन त्रिराचामेत् । प्रथमं यः पिबेदृग्वेदः प्रीणातु
    । द्वितीयं यःपिबेद्यजुर्वेदः प्रीणातु । तृतीयं यः पिबेत् सामवेदः प्रीणातु । लोमाधरोष्ठमथर्ववेदः प्रीणातु
    । मुखमग्नितृप्तं सर्वं प्रोक्षति । यः पादो प्रोक्षति यश्चक्षुषी यश्चन्द्रमादित्यौ यन्नाभिं तेन पृथिवी
    यस्ततस्तेन विष्णुः । यच्छिरस्तेन रुद्रः । मूर्ध्नि शतकुबेरः । सर्वदेवत्यास्ते प्रीणन्तु । य एवं वेद
    । इत्युपनिषत् ॥ इत्याचमनोपनिषत् समाप्ता ।
meaning: {}
