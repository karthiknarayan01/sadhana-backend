id: brahmakrishnastotra
category: stotram
name:
  english: brahmakrishnastotra
  devanagari: ब्रह्मक्रिश्नस्तोत्र
content:
  english: shrikrishnastotra brahmaracita shri ganeshaya namah | brahmovaca | raksha raksha hare mam ca
    nimagnam kamasagare | dushkirtijalapurne ca dushpare bahusankate || 1|| bhaktivismritibije ca vipatsopanadustare
    | ativa nirmalajnanacakshuhpracchannakarane || 2|| janmormisangasahite yoshinnakraudhasankule | ratisrotahsamayukte
    gambhire ghora eva ca || 3|| prathamamritarupe ca parinamavishalaye | yamalayapraveshaya muktidvarativismritau
    || 4|| buddhya taranya vijnanairuddharasmanatah svayam | svayam ca tva karnadharah prasida madhusudana
    || 5|| madvidhah katicinnatha niyojya bhavakarmani | santi vishvesha vidhayo he vishveshvara madhava
    || 6|| na karmakshetramevedam brahmaloko'yamipsitah | tathapi na spriha kame tvadbhaktivyavadhayake
    || 7|| he natha karunasindho dinabandho kripam kuru | tvam mahesha mahajnata duhsvapnam mam na darshaya
    || 8|| ityuktva jagatam dhata virarama sanatanah | dhyayam dhyayam matpadabjam shashvatsasmara mamiti
    || 9|| brahmana ca kritam stotram bhaktiyuktashca yah pathet | sa caivakarmavishaye na nimagno bhaveddhruvam
    || 10|| mama mayam vinirjitya sa jnanam labhate dhruvam | iha loke bhaktiyukto madbhaktapravaro bhavet
    || 11|| || iti shribrahmadevakritam shrikrishnastotram sampurnam ||
  devanagari: श्रीकृष्णस्तोत्र ब्रह्मारचित श्री गणेशाय नमः । ब्रह्मोवाच । रक्ष रक्ष हरे मां च निमग्नं
    कामसागरे । दुष्कीर्तिजलपूर्णे च दुष्पारे बहुसङ्कटे ॥ १॥ भक्तिविस्मृतिबीजे च विपत्सोपानदुस्तरे । अतीव
    निर्मलज्ञानचक्षुःप्रच्छन्नकारणे ॥ २॥ जन्मोर्मिसङ्गसहिते योषिन्नक्रौधसङ्कुले । रतिस्रोतःसमायुक्ते गम्भीरे
    घोर एव च ॥ ३॥ प्रथमामृतरूपे च परिणामविषालये । यमालयप्रवेशाय मुक्तिद्वारातिविस्मृतौ ॥ ४॥ बुद्ध्या तरण्या
    विज्ञानैरुद्धरास्मानतः स्वयम् । स्वयं च त्व कर्णधारः प्रसीद मधुसूदन ॥ ५॥ मद्विधाः कतिचिन्नाथ नियोज्या
    भवकर्मणि । सन्ति विश्वेश विधयो हे विश्वेश्वर माधव ॥ ६॥ न कर्मक्षेत्रमेवेदं ब्रह्मलोकोऽयमीप्सितः ।
    तथापि न स्पृहा कामे त्वद्भक्तिव्यवधायके ॥ ७॥ हे नाथ करुणासिन्धो दीनबन्धो कृपां कुरु । त्वं महेश महाज्ञाता
    दुःस्वप्नं मां न दर्शय ॥ ८॥ इत्युक्त्वा जगतां धाता विरराम सनातनः । ध्यायं ध्यायं मत्पदाब्जं शश्वत्सस्मार
    मामिति ॥ ९॥ ब्रह्मणा च कृतं स्तोत्रं भक्तियुक्तश्च यः पठेत् । स चैवाकर्मविषये न निमग्नो भवेद्ध्रुवम्
    ॥ १०॥ मम मायां विनिर्जित्य स ज्ञानं लभते ध्रुवम् । इह लोके भक्तियुक्तो मद्भक्तप्रवरो भवेत् ॥ ११॥ ॥
    इति श्रीब्रह्मदेवकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् ॥
