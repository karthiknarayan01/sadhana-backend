id: rachayema-samskrita-bhavanam-grame-nagare-samasta-rashtre
category: stotram
name:
  english: Rachayema Samskrita Bhavanam (Grame Nagare Samasta Rashtre)
content:
  english: grame nagare samastarashtre racayema samskritabhavanam ishtikam vina mrittikam vina kevalasambhashanavidhaya
    samskritasambhashanakalaya || shishubalanam smitamriduvacane yuvayuvatinam manjubhashane vriddhagurunam
    vatsalahridaye racayema samskritabhavanam || || arunodayatah suprabhatam shubharatrim nishi samvadema
    divanisham samskritavacanena racayema samskritabhavanam || bandhuram matripremato bahujanaruciram
    vacanalalitam shravanamadhuram racayema samskritabhavanam || || mulashila sambhashanamasya hindujanaikyam
    shikharamunnatam sopanam shravanadividhanam racayema samskritabhavanam ||
  devanagari: ग्रामे नगरे समस्तराष्ट्रे रचयेम संस्कृतभवनं इष्टिकां विना मृत्तिकां विना केवलसम्भाषणविधया
    संस्कृतसम्भाषणकलया ॥ शिशुबालानां स्मितमृदुवचने युवयुवतीनां मञ्जुभाषणे वृद्धगुरूणां वत्सलहृदये रचयेम
    संस्कृतभवनम् ॥ ॥ अरुणोदयतः सुप्रभातं शुभरात्रिं निशि संवदेम दिवानिशं संस्कृतवचनेन रचयेम संस्कृतभवनम्
    ॥ बन्धुरं मातृप्रेमतो बहुजनरुचिरं वचनललितं श्रवणमधुरं रचयेम संस्कृतभवनम् ॥ ॥ मूलशिला सम्भाषणमस्य हिन्दुजनैक्यं
    शिखरमुन्नतं सोपानं श्रवणादिविधानं रचयेम संस्कृतभवनम् ॥
