id: ramastuti
category: stotram
name:
  english: ramastuti
  devanagari: रामस्तुति
content:
  english: tulasidasakrita shriramastutih shriramacandra kripalu bhaju mana harana bhavabhaya darunam
    | navakanja locana kanja mukhakara kanjapada kanjarunam || 1|| kamdarpa aganita amita chabi nava nila
    niraja sundaram | patapita panahu~ tar̤ita ruci suci naumi janaka sutavaram || 2|| bhaju dina bandhu
    dinesha danava daityavamshanikandanam | raghunanda anamdakamda koshala canda dasharatha nandanam ||
    3|| sirakrita kundala tilaka caru udara anga vibhushanam | ajanubhuja sara capadhara sangrama jita
    kharadushanam || 4|| iti vadati tulasidasa shankara shesha muni manaranjanam | mama hridayakanja nivasa
    kuru kamadikhaladalamanjanam || 5|| mana jahi raco milahi sovara sahajasundara samvaro | karunanidhana
    sujana shila saneha janata ravaro || 6|| ehi bha~ti gauri ashisa suni siya sahita hiya harshita ali
    | tulasi bhavanihim puji puni puni mudita mana mandira cali || 7|| jani gauri anukula siya hiya harshanah
    jata kahi | manjula mangala mula vama anga parakana lage || siyavara ramacandra pada gahi rahu~ |
    umavara shambhunatha pada gahi rahu~ | mahavira bajara~gi pada gahi rahu~ | sharana gato hari ||
  devanagari: तुलसीदासकृता श्रीरामस्तुतिः श्रीरामचन्द्र कृपालु भजु मन हरण भवभय दारुणम् । नवकञ्ज लोचन कञ्ज
    मुखकर कञ्जपद कञ्जारुणम् ॥ १॥ कंदर्प अगणित अमित छबि नव नील नीरज सुन्दरम् । पटपीत पानहुँ तड़ित रुचि
    सुचि नौमि जनक सुतावरम् ॥ २॥ भजु दीन बन्धु दिनेश दानव दैत्यवंशनिकन्दनम् । रघुनन्द आनंदकंद कोशल चन्द
    दशरथ नन्दनम् ॥ ३॥ सिरक्रीट कुण्डल तिलक चारु उदार अङ्ग विभूषणम् । आजानुभुज सर चापधर सङ्ग्राम जित खरदूषणम्
    ॥ ४॥ इति वदति तुलसीदास शङ्कर शेष मुनि मनरञ्जनम् । मम हृदयकञ्ज निवास कुरु कामादिखलदलमञ्जनम् ॥ ५॥ मन
    जाहि राचो मिलहि सोवर सहजसुन्दर सांवरो । करुणानिधान सुजान शील सनेह जानत रावरो ॥ ६॥ एहि भाँति गौरि अशीस
    सुनि सिय सहित हिय हर्षित अली । तुलसी भवानिहिं पूजि पुनि पुनि मुदित मन मन्दिर चली ॥ ७॥ जानि गौरि अनुकूल
    सिय हिय हर्षनः जात कहि । मञ्जुल मङ्गल मूल वाम अङ्ग परकन लगे ॥ सियावर रामचन्द्र पद गहि रहुँ । उमावर
    शम्भुनाथ पद गहि रहुँ । महाविर बजरँगी पद गहि रहुँ । शरणा गतो हरि ॥
