id: subhagodayastuti
category: stotram
name:
  english: subhagodayastuti
  devanagari: सुभगोदयस्तुति
content:
  english: sadah stada vayostatra prabhava idamahuh samayinah || 28|| tadetatte samvitkamalamiti samjnantaramume
    bhavetsamvitpuja bhavati kamale'sminsamayinam | vishuddhyakhye cakre viyaduditamahuh samayinah sadapurvo
    devah shiva iti himanisamatanuh || 29|| tvadiyairuddyotairbhavati ca vishuddhyakhyasadanam bhavetpuja
    devya himakarakalabhih samayinam | sahasrare cakre nivasati kalapancadashakam tadetannityakhyam bhramati
    sitapakshe samayinam || 30|| atah shukle pakshe
  devanagari: सादः स्तदा वायोस्तत्र प्रभव इदमाहुः समयिनः ॥ २८॥ तदेतत्ते संवित्कमलमिति संज्ञान्तरमुमे भवेत्संवित्पूजा
    भवति कमलेऽस्मिन्समयिनाम् । विशुद्ध्याख्ये चक्रे वियदुदितमाहुः समयिनः सदापूर्वो देवः शिव इति हिमानीसमतनुः
    ॥ २९॥ त्वदीयैरुद्द्योतैर्भवति च विशुद्ध्याख्यसदनं भवेत्पूजा देव्या हिमकरकलाभिः समयिनाम् । सहस्रारे
    चक्रे निवसति कलापञ्चदशकं तदेतन्नित्याख्यं भ्रमति सितपक्षे समयिनाम् ॥ ३०॥ अतः शुक्ले पक्षे
meaning: {}
