    आहु॑तय॒ स्स्युरप्र॑तिष्ठिता॒ स्स्तोमा॒ अप्र॑तिष्ठितान्यु॒क्थानि॑ ति॒सृभिः॑ प्रातस्सव॒ने॑ वा अ॒ग्निर्यावा॑ने॒वा
    द्वा अ॒ग्निर्यावा॑ने॒वा ऽन॑सि यु॒क्त आ॑धी॒यत॑ ए॒वमे॒व त त्प्रत्याहु॑तय॒स्तिष्ठ॑न्ति॒ प्रति॒ स्तोमाः॒
    प्रत्यु॒क्थानि॑ यज्ञाय॒ज्ञिय॑स्य स्तो॒त्रे द्वाभ्या॑म॒भि मृ॑शत्ये॒तावा॒न्॒ वै य॒ज्ञो यावा॑नग्निष्टो॒मो
    भू॒मा त्वा अ॒स्यात॑ ऊ॒र्ध्वः क्रि॑यते॒ यावा॑ने॒व य॒ज्ञस्तम॑न्त॒तो ऽन्वारो॑हति॒ द्वाभ्या॒ म्प्रति॑ष्ठित्या॒
    एक॒या मुत्त॑रो य॒ज्ञो न॑म॒त्यथो॒ सन्त॑त्यै॒ प्र वा ए॒षो ञ्चि॑नु॒ते न वा ए॒तस्या॑निष्ट॒क आहु॑ति॒रव॑
    कल्पते॒ यां ञ्जु॒होति॒ स्रव॑ति॒ वै सा ताग् ऽनु॒ परा॑ भवति य॒ज्ञं म्प्रति॑ष्ठित्यै॒ प्रत्याहु॑तय॒स्तिष्ठ॑न्ति॒
    प्रत्याहु॑तय॒स्तिष्ठ॑न्ति न य॒ज्ञः प॑रा॒भव॑ति॒ न यज॑मानो॒ ऽष्टावुप॑ दधात्य॒ष्टाक्ष॑रा गाय॒त्री गा॑य॒त्रेणै॒वैन॒
    ञ्छन्द॑सा चिनुते॒ यदेका॑दश॒ त्रैष्टु॑भेन॒ य द्द्वाद॑श॒ जाग॑तेन॒ छन्दो॑भिरे॒वैन॑ ञ्चिनुते नपा॒त्को
    वैनामै॒षो त्पु॑नश्चि॒तिर्य ए॒वं ञ्चि॑नु॒त आ तृ॒तीया॒ त्पुरु॑षा॒दन्न॑मत्ति॒ यथा॒ वै पु॑नरा॒धेय॑ ए॒व
    र्ध्नोति॒ स पु॑नरा॒धेय॒मा ध॑त्ते॒ यो ञ्चि॒त्वा नर्ध्नोति॒ स पु॑नश्चि॒ति ञ्चि॑नु॒त ऋद्ध्या॒ अथो॒ खल्वा॑हु॒र्न
    चे॑त॒व्येति॑ रु॒द्रो वा ए॒ष यद॒ग्निर्यथा म्बो॒धय॑ति ता॒दृगे॒व तदथो॒ खल्वा॑हुश्चेत॒व्येति॒ यथा॒ वसी॑याग्ंस
    म्भाग॒धेये॑न बो॒धय॑ति ता॒दृगे॒व तन्मनु॑र॒ग्निम॑चिनुत॒ तेन॒ ना म्पु॑नश्चि॒तिम॑पश्य॒ त्ताम॑चिनुत॒ तया॒
    वै स आ न्त्यग्न्या॒धेये॑न॒ ना ञ्चिन्वीत प॒शुका॑मः प॒शवो॒ वै छन्दाग्ं॑सि पशु॒माने॒व भ॑वति श्येन॒चित॑
    ञ्चिन्वीत सुव॒र्गका॑म श्श्ये॒न ए॒व भू॒त्वा सु॑व॒र्गं ञ्चिन्वीत॒ यः का॒मये॑त शीर् ष॒ण्वान॒मुष्मि॑न्
    ँलो॒के स्या॒मिति॑ शीर् ऽमुष्मि॑न् ँलो॒के भ॑वत्यलज॒चित॑ ञ्चिन्वीत॒ चतु॑स्सीत म्प्रति॒ष्ठाका॑म॒श्चत॑स्रो॒
    दिशो॑ दि॒क्ष्वे॑व प्रति॑ तिष्ठति प्रौग॒चित॑ ञ्चिन्वीत॒ भ्रातृ॑व्यवा॒ न्नुदत उभ॒यतः॑ प्रौग ञ्चिन्वीत॒यः
    का॒मये॑त॒ प्रजा॒ता न्नु॒देय॒ प्रति॑ जनि॒ष्यमा॑णा॒निति॒ प्रैव जा॒ता न्नु॒दते॒ प्रति॑ जनि॒ष्यमा॑णा ञ्चिन्वीत॒
    भ्रातृ॑व्यवा॒न्॒ वज्रो॒ वै रथो॒ वज्र॑मे॒व भ्रातृ॑व्येभ्यः॒ प्रह॑रति द्रोण॒चित॑ ञ्चिन्वी॒तान्न॑कामो॒
    द्रोणे॒ वा अन्न॑ न्ये॒वान्न॒मव॑ रुन्धे समू॒ह्य॑ ञ्चिन्वीत प॒शुका॑मः पशु॒माने॒व भ॑वति ञ्चिन्वीत॒ ग्राम॑कामो
    ग्रा॒म्ये॑व भ॑वति श्मशान॒चित॑ ञ्चिन्वीत॒ यः का॒मये॑त पितृलो॒क ऋ॑द्ध्नुया॒मिति॑ पितृलो॒क ए॒वर्ध्नो॑ति
    विश्वामित्रजमद॒ग्नी वसि॑ष्ठेना ऽस्पर्धेता॒ग्ं॒ स ए॒ता ज॒मद॑ग्निर्विह॒व्या॑ अपश्य॒ त्ता उपा॑धत्त॒ ताभि॒र्वै
    स वसि॑ष्ठस्येन्द्रि॒यं द्वि॑ह॒व्या॑ उप॒दधा॑तीन्द्रि॒यमे॒व ताभि॑र्वी॒र्यं॑ यँज॑मानो॒ भ्रातृ॑व्यस्य
    वृङ्क्ते॒ होतु॒र्धिष्णि॑य॒ उप॑ दधाति यजमानायत॒नं होता॒ स्व ए॒वास्मा॑ आ॒यत॑न इन्द्रि॒यं वीँ॒र्य॑मव॑
    रुन्धे॒ द्वाद॒शोप॑ दधाति॒ द्वाद॑शाक्षरा॒ जग॑ती॒ जाग॑ताः प॒शवो॒ जग॑त्यै॒वास्मै॑ प॒शूनव॑ रुन्धे॒ ऽष्टाव॑ष्टाव॒न्येषु॒
    धिष्णि॑ये॒षूप॑ दधात्य॒ष्टाश॑फाः प॒शवः॑ प॒शूने॒वाव॑ रुन्धे॒ षण्मा ड्वा ऋ॒तव॑ ऋ॒तवः॒ खलु॒ वै दे॒वाः
    पि॒तर॑ ऋ॒तूने॒व दे॒वा अ॒ष्टाच॑त्वारिग्ंशच्च पव॑स्व॒ वाज॑सातय॒ इत्य॑नु॒ष्टु क्प्र॑ति॒पद्भ॑वति ति॒र्
    ऽनु॒ष्टुभ॒श्चत॑स्रो गाय॒त्रियो॒ य दश्व॑स्त्रि॒भिस्तिष्ठग्ग्॑ स्तिष्ठति॒ यच्चत॑स्रो गाय॒त्रिय॒स्तस्मा॒
    थ्सर्वाग्॑ श्च॒तुरः॑ प॒दः प्र॑ति॒दध॒ त्पला॑यते पर॒मा वा ए॒षा छन्द॑सां॒ म्पर॒मस्त्रि॑रा॒त्रो य॒ज्ञाना
    यस्मि॒न्नश्व॑ आल॒भ्यते॒ द्वाद॑श॒ मासाः॒ पञ्च॒र्तव॒स्त्रय॑ इ॒मे लो॒का अ॒सावा॑दि॒त्य ए॑कवि॒ग्ं॒श ए॒ष
    प्र॒जाप॑तिः प्राजाप॒त्यो ऽश्व॒स्तमे॒व सा॒क्षादृ॑द्ध्नोति॒ शक्व॑रयः पृ॒ष्ठ न्ये॒ वा ए॒ते प॒शव॒ आ ल॑भ्यन्त
    उ॒तेव॑ ग्रा॒म्या उ॒तेवा॑ ऽऽर॒ण्या यच्छक्व॑रयः पृ॒ष्ठ म्भव॒न्त्यश्व॑स्य सर्व॒त्वाय॑ पार्थुर॒श्म म्भ॑वति
    र॒श्मिना॒ वा अश्वो॑ म्भव॒त्यश्व॑स्य॒ यत्यै॒ धृत्यै॒ सङ्कृ॑त्यच्छावाकसा॒म म्भ॑वत्युथ्सन्नय॒ज्ञो वा
    ए॒ष यद॑श्वमे॒धः कस्तद्वे॒देत्या॑हु॒र्यदि॒ सर्वो॑ वा क्रि॒यते॒ न वा॒ सर्व॒ इति॒ य थ्सङ्कृ॑त्यच्छावाकसा॒म
    म्भव॒त्यश्व॑स्य सर्व॒त्वाय॒ पर्या प्त्या॒ अन॑न्तरायाय॒ सर्व॑स्तोमो ऽतिरा॒त्र उ॑त्त॒ममह॑र्भवति॒ सर्व॒स्या
    ऽऽप्त्यै॒ सर्व॑स्य॒ जित्यै॒ सर्व॑मे॒व तेना सुव॒र्गाय॑ यत्राकू॒ताय॑ प्र॑थ॒मो दे॑वय॒तामे॒ ॥ हरिः॑ ओम्
