    बिधि चलहु सकल भय त्यागेम् ॥ दो प्रनतपाल रघुबंसमनि त्राहि त्राहि अब मोहि। आरत गिरा सुनत प्रभु अभय करैगो
    तोहि ॥ ॥ रे कपिपोत बोलु सम्भारी। मूढ़ न जानेहि मोहि सुरारी ॥ कहु निज नाम जनक कर भाई। केहि नातें मानिऐ
