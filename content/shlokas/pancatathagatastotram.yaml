id: pancatathagatastotram
category: stotram
name:
  english: pancatathagatastotram
  devanagari: पन्चतथागतस्तोत्रम्
content:
  english: pancatathagatastotram shribuddha buddhadhipa buddharupa buddhanvitan bodhayase vibuddhah |
    buddhya samastan khalu buddhaputra santoshya yogena tu buddhamegham || 1|| shrivajra vajramala jatavajra
    vajrena diptena pradipya lokam | dadan yogena tu vajrasamvarsham vajratmabhavam kurushe suvajra ||
    2|| shriratna ratnakara ratnamegha ratnena ratnam ramase suratna | vidarya daridrayaghanam jananam
    sutejasa ratnamahadhvajena || 3|| shripadma padmottama padmasattva padmansamastan khalupadmajalaih
    | vibodhya padmodbhava padmatoyaih padme kule sthapayase supadma || 4|| shrivishva vishvavisha vishvajnanam
    vishvena vishvavishayena lipta | vishvena sattvan vinayeshu vishvam vidyam suvidyhm sukhaphcithmiti
    || 5|| iti shripancatathagatastotram sampurnam ||
  devanagari: पञ्चतथागतस्तोत्रम् श्रीबुद्ध बुद्धाधिप बुद्धरूप बुद्धान्वितान् बोधयसे विबुद्धः । बुद्ध्या
    समस्तान् खलु बुद्धपुत्र सन्तोष्य योगेन तु बुद्धमेघाम् ॥ १॥ श्रीवज्र वज्रामल जातवज्र वज्रेण दीप्तेन
    प्रदीप्य लोकम् । ददन् योगेन तु वज्रसंवर्षं वज्रात्मभावं कुरुषे सुवज्र ॥ २॥ श्रीरत्न रत्नाकर रत्नमेघ
    रत्नेन रत्नं रमसे सुरत्न । विदार्य दारिद्रयघनं जनानां सुतेजसा रत्नमहाध्वजेन ॥ ३॥ श्रीपद्म पद्मोत्तम
    पद्मसत्त्व पद्मान्समस्तान् खलुपद्मजालैः । विबोध्य पद्मोद्भव पद्मतोयैः पद्मे कुले स्थापयसे सुपद्म ॥
    ४॥ श्रीविश्व विश्वाविश विश्वज्ञानं विश्वेन विश्वविषयेन लिप्त । विश्वेन सत्त्वान् विनयेषु विश्वं विद्यां
    सुविद्य्ःं सुखप्ःचित्ःमिति ॥ ५॥ इति श्रीपञ्चतथागतस्तोत्रं सम्पूर्णम् ॥
