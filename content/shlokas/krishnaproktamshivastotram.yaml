id: krishnaproktamshivastotram
category: stotram
name:
  english: krishnaproktamshivastotram
  devanagari: कृष्णप्रोक्तंशिवस्तोत्रम्
content:
  english: shrikrishnaproktam shivastotram sa devendrashca vayushca so'shvinau sa ca vidyutah | sa candramah
    sa ceshanah sa suryo varunashca sah || 37|| sa kalah so'ntako mrityuh sa tamo ratryahani ca | masardhamasa
    ritavah sandhye samvatsarashca sah || 38|| sa dhata sa vidhata ca vishvakarma sa sarvavit | nakshatrani
    dishashcaiva pradisho'tha grahastatha | vishvamurtirameyatma bhagavanamitadyutih || 39|| ekadha ca
    dvidha caiva bahudha ca sa eva ca | shatadha sahasradha caiva tatha shatasahasradha || 40|| idrishah
    sa mahadevo bhuyashca bhagavanatah | na hi shakya guna vaktumapi varshashatairapi || 41|| iti mahabharate
    anushasanaparvani 145 adhyayantargatam shrikrishnaproktam shivastotram sampurnam | mahabharata | anuparva
    | adhyaya 145
  devanagari: श्रीकृष्णप्रोक्तं शिवस्तोत्रम् स देवेन्द्रश्च वायुश्च सोऽश्विनौ स च विद्युतः । स चन्द्रमाः
    स चेशानः स सूर्यो वरुणश्च सः ॥ ३७॥ स कालः सोऽन्तको मृत्युः स तमो रात्र्यहानि च । मासार्धमासा ऋतवः
    सन्ध्ये संवत्सरश्च सः ॥ ३८॥ स धाता स विधाता च विश्वकर्मा स सर्ववित् । नक्षत्राणि दिशश्चैव प्रदिशोऽथ
    ग्रहास्तथा । विश्वमूर्तिरमेयात्मा भगवानमितद्युतिः ॥ ३९॥ एकधा च द्विधा चैव बहुधा च स एव च । शतधा सहस्रधा
    चैव तथा शतसहस्रधा ॥ ४०॥ ईदृशः स महादेवो भूयश्च भगवानतः । न हि शक्या गुणा वक्तुमपि वर्षशतैरपि ॥ ४१॥
    इति महाभारते अनुशासनपर्वणि १४५ अध्यायान्तर्गतं श्रीकृष्णप्रोक्तं शिवस्तोत्रं सम्पूर्णम् । महाभारत
    । अनुपर्व । अध्याय १४५
