id: jyeshthamasakriteshivashatashtanamastotrammasa-3
category: stotram
name:
  english: jyeshthamasakriteshivashatashtanamastotrammasa 3
  devanagari: ज्येष्ठमासकृतेशिवशताष्टनामस्तोत्रम्मास ३
content:
  english: lobhaya pancasyaya sudhanvane || 51|| trinetraya suparshvaya tushtaya udaraya ca | shivaya
    shantarupaya shatavartaya te namah || 52|| annayasannapalaya attamalaya te namah | namo bhavaya rudraya
    kadrudraya pracetase || 53|| namastendriyahinaya lelihanaya srikvine | vishvaya vishvarupaya vishvasmai
    shirase namah || 54|| sarvatah panipadaya sarvendriyaviharine | rudraya pratirupaya khandacandradharaya
    ca || 55|| vishvotpattivinashaya shadurmirahitaya ca | namah siddhaya sadhyaya yamanam pataye namah
    || 56|| mayobhuve shambhave ca vibhave prabhave namah | dundubhyayahananyaya shangayatha pramaya ca
    || 57|| suviraya sughoraya akshobhyakshobhanaya ca | suprajaya sumedhyaya sudhamne'nantacakshushe
    || 58|| namo buddhaya shuddhaya bandhamokshaya te namah | namaste bhutabhavyaya vartamanaya damyate
    || 59|| namo bhavaya bhadraya ghanaghoshaya te namah | prapannajanarakshaya bhaktapapaharaya ca ||
    60|| saketavasagopyaya yamamargaharaya ca | bhadraya rudrarupaya tandraya ca namo namah | namah sthulaya
    sukshmaya drishyadrishyaya goptrine || 61|| varshate jvalate caiva grasate hrasate namah | namah sucarukoshaya
    uruvakshashikhaya ca || 62|| namo namah suvarnaya tapaniyanibhayate | virupaya prasannaya sarvarupaya
    te namah || 63|| devi namashatashtena pujayejjayeshthamasake | stuvitaivam mahadevam savyenanena sarvada
    || 64|| tasyaham paramaprito dishami paramam gatim || 65|| || iti shivarahasyantargate ishvaraproktam
    jyeshthamasakrite shivashatashtanamastotram sampurnam ||
  devanagari: लोभाय पञ्चास्याय सुधन्वने ॥ ५१॥ त्रिणेत्राय सुपार्श्वाय तुष्टाय उदराय च । शिवाय शान्तरूपाय
    शतावर्ताय ते नमः ॥ ५२॥ अन्नायासन्नपालाय आत्तमालाय ते नमः । नमो भवाय रुद्राय कद्रुद्राय प्रचेतसे ॥
    ५३॥ नमस्तेन्द्रियहीनाय लेलिहानाय सृक्विणे । विश्वाय विश्वरूपाय विश्वस्मै शिरसे नमः ॥ ५४॥ सर्वतः पाणिपादाय
    सर्वेन्द्रियविहारिणे । रुद्राय प्रतिरूपाय खण्डचन्द्रधराय च ॥ ५५॥ विश्वोत्पत्तिविनाशाय षडूर्मिरहिताय
    च । नमः सिद्धाय साध्याय यमानां पतये नमः ॥ ५६॥ मयोभुवे शम्भवे च विभवे प्रभवे नमः । दुन्दुभ्यायाहनन्याय
    शङ्गायाथ प्रमाय च ॥ ५७॥ सुवीराय सुघोराय अक्षोभ्यक्षोभणाय च । सुप्रजाय सुमेध्याय सुधाम्नेऽनन्तचक्षुषे
    ॥ ५८॥ नमो बुद्धाय शुद्धाय बन्धमोक्षाय ते नमः । नमस्ते भूतभव्याय वर्तमानाय दम्यते ॥ ५९॥ नमो भवाय भद्राय
    घनघोषाय ते नमः । प्रपन्नजनरक्षाय भक्तपापहराय च ॥ ६०॥ साकेतवासगोप्याय यममार्गहराय च । भद्राय रुद्ररूपाय
    तन्द्राय च नमो नमः । नमः स्थूलाय सूक्ष्माय दृश्यादृश्याय गोप्त्रिणे ॥ ६१॥ वर्षते ज्वलते चैव ग्रसते
    ह्रसते नमः । नमः सुचारुकोशाय उरुवक्षशिखाय च ॥ ६२॥ नमो नमः सुवर्णाय तपनीयनिभायते । विरूपाय प्रसन्नाय
    सर्वरूपाय ते नमः ॥ ६३॥ देवि नामशताष्टेन पूजयेज्जयेष्ठमासके । स्तुवीतैवं महादेवं सव्येनानेन सर्वदा
    ॥ ६४॥ तस्याहं परमप्रीतो दिशामि परमां गतिम् ॥ ६५॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं ज्येष्ठमासकृते
    शिवशताष्टनामस्तोत्रं सम्पूर्णम् ॥
