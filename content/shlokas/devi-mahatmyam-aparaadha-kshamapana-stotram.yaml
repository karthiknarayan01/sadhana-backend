id: devi-mahatmyam-aparaadha-kshamapana-stotram
category: stotram
name:
  english: Devi Mahatmyam Aparaadha Kshamapana Stotram
content:
  english: aparadhashatam kritva jagadambeti coccaret| yam gatim samavapnoti na tam brahmadayah surah
    || || saparadho'smi sharanam praptastvam jagadambike| idanimanukampyo'ham yathecchasi tatha kuru ||
    || ajnanadvismritebhrantya yannyunamadhikam kritam| tatsarva kshamyatam devi prasida parameshvari
    || || kameshvari jaganmatah saccidanandavigrahe| grihanarcamimam pritya prasida parameshvari || ||
    sarvarupamayi devi sarvam devimayam jagat| ato'ham vishvarupam tvam namami parameshvarim || || purnam
    bhavatu tat sarvam tvatprasadanmaheshvari yadatra pathe jagadambike maya visargabindvaksharahinamiritam|
    || || tadastu sampurnatam prasadatah sankalpasiddhishca sadaiva jayatam|| || bhaktyabhaktyanupurvam
    prasabhakritivashat vyaktamavyaktamamba || || tat sarvam sangamastam bhagavati tvatprasadat prasida
    || || prasadam kuru me devi durgedevi namo'stute || || ||iti aparadha kshamapana stotram samaptam||
  devanagari: अपराधशतं कृत्वा जगदम्बेति चोच्चरेत्। यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ॥ ॥ सापराधोऽस्मि
    शरणां प्राप्तस्त्वां जगदम्बिके। इदानीमनुकम्प्योऽहं यथेच्छसि तथा कुरु ॥ ॥ अज्ञानाद्विस्मृतेभ्रान्त्या
    यन्न्यूनमधिकं कृतं। तत्सर्व क्षम्यतां देवि प्रसीद परमेश्वरी ॥ ॥ कामेश्वरी जगन्माताः सच्चिदानन्दविग्रहे।
    गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरी ॥ ॥ सर्वरूपमयी देवी सर्वं देवीमयं जगत्। अतोऽहं विश्वरूपां
    त्वां नमामि परमेश्वरीं ॥ ॥ पूर्णं भवतु तत् सर्वं त्वत्प्रसादान्महेश्वरी यदत्र पाठे जगदम्बिके मया विसर्गबिन्द्वक्षरहीनमीरितम्।
    ॥ ॥ तदस्तु सम्पूर्णतं प्रसादतः सङ्कल्पसिद्धिश्च सदैव जायतां॥ ॥ भक्त्याभक्त्यानुपूर्वं प्रसभकृतिवशात्
    व्यक्तमव्यक्तमम्ब ॥ ॥ तत् सर्वं साङ्गमास्तां भगवति त्वत्प्रसादात् प्रसीद ॥ ॥ प्रसादं कुरु मे देवि
    दुर्गेदेवि नमोऽस्तुते ॥ ॥ ॥इति अपराध क्षमापण स्तोत्रं समाप्तं॥
