id: annamayya-keerthanas-musina-mutyalakele
category: stotram
name:
  english: Annamayya Keerthanas Musina Mutyalakele
content:
  english: musina mutyala kele mòragulu ashala cittani kele alavokalu || kanduleni momuna kele kasturi
    cindu ni kòppuna kele cemantulu | mandayanamuna kele mattèla motalu gandhamele paipai kammani ni meniki
    || bharapu gubbala kele payyèda ni birapu jupula kele pèdamomu | jirala bhujala kele cèmatalu ni goranta
    golla kele kònavandlu || muddula matala kele mudamulu ni yaddapu jèkkula kele araviri | vòddikamatala
    kele vurpulu niku naddamele tiru venkatadrishu gudi ||
  devanagari: मूसिन मुत्याल केले मॊरगुलु आशल चित्तानि केले अलवोकलु ॥ कन्दुलेनि मोमुन केले कस्तूरि चिन्दु
    नी कॊप्पुन केले चेमन्तुलु । मन्दयानमुन केले मट्टॆल मोतलु गन्धमेले पैपै कम्मनि नी मेनिकि ॥ भारपु गुब्बल
    केले पय्यॆद नी बीरपु जूपुल केले पॆडमोमु । जीरल भुजाल केले चॆमटलु नी गोरण्ट गोल्ल केले कॊनवाण्ड्लु
    ॥ मुद्दुल माटल केले मुदमुलु नी यद्दपु जॆक्कुल केले अरविरि । वॊद्दिकमाटल केले वूर्पुलु नीकु नद्दमेले
    तिरु वेङ्कटाद्रीशु गूडि ॥
