id: parvathi-ashtottara-sata-namavali
category: stotram
name:
  english: Parvathi Ashtottara Sata Namavali
content:
  english: om parvatyai namah om maha devyai namah om jaganmatre namah om sarasvatyai namah om candikayai
    namah om lokajananyai namah om sarvadevadi devatayai namah om gauryai namah om paramayai namah om
    ishayai namah || || om nagendratanayayai namah om satyai namah om brahmacarinyai namah om sharvanyai
    namah om devamatre namah om trilocanyai namah om brahmanyai namah om vaishnavyai namah om raudryai
    namah om kalaratryai namah || || om tapasvinyai namah om shivadutyai namah om vishalakshyai namah
    om camundayai namah om vishnusodarayyai namah om citkalayai namah om cinmayakarayai namah om mahishasuramardinyai
    namah om katyayinyai namah om kalarupayai namah || || om girijayai namah om menakatmajayai namah om
    bhavanyai namah om matrikayai namah om shrimatrenamah om mahagauryai namah om ramayai namah om shucismitayai
    namah om brahmasvarupinyai namah om rajyalakshmyai namah || || om shivapriyayai namah om narayanyai
    namah om mahashaktyai namah om navodhayai namah om bhagyadayinyai namah om annapurnayai namah om sadanandayai
    namah om yauvanayai namah om mohinyai namah om ajnanashudhyai namah || || om jnanagamyayai namah om
    nityayai namah om nityasvarupinyai namah om pushpakarayai namah om purusharthapradayinyai namah om
    maharupayai namah om maharaudryai namah om kamakshyai namah om vamadevyai namah om varadayai namah
    || || om bhayanashinyai namah om vagdevyai namah om vacanyai namah om varahyai namah om vishvatoshinyai
    namah om vardhaniyayai namah om vishalakshayai namah om kulasampatpradayinyai namah om ardhaduhkhacceda
    dakshayai namah om ambayai namah || || om nikhilayoginyai namah om kamalayai namah om kamalakarayai
    namah om raktavarnayai namah om kalanidhayai namah om madhupriyayai namah om kalyanyai namah om karunayai
    namah om janasdhanayai namah om virapatnyai namah || || om virupakshyai namah om viradhitayai namah
    om hemabhasayai namah om srishtirupayai namah om srishtisamharakarinyai namah om ranjanayai namah
    om yauvanakarayai namah om parameshapriyayai namah om parayai namah om pushpinyai namah || || om sadapurasthayinyai
    namah om tarormulatalangatayai namah om haravahasamayuktayai namah om mokshaparayanayai namah om dharadharabhavayai
    namah om muktayai namah om varamantrayai namah om karapradayai namah om vagbhavyai namah om devyai
    namah || || om klim karinyai namah om samvide namah om ishvaryai namah om hrinkarabijayai namah om
    shambhavyai namah om pranavatmikayai namah om shri mahagauryai namah om shubhapradayai namah ||
  devanagari: ॐ पार्वत्यै नमः ॐ महा देव्यै नमः ॐ जगन्मात्रे नमः ॐ सरस्वत्यै नमह् ॐ चण्डिकायै नमः ॐ लोकजनन्यै
    नमः ॐ सर्वदेवादी देवतायै नमः ॐ गौर्यै नमः ॐ परमायै नमः ॐ ईशायै नमः ॥ ॥ ॐ नागेन्द्रतनयायै नमः ॐ सत्यै
    नमः ॐ ब्रह्मचारिण्यै नमः ॐ शर्वाण्यै नमः ॐ देवमात्रे नमः ॐ त्रिलोचन्यै नमः ॐ ब्रह्मण्यै नमः ॐ वैष्णव्यै
    नमः ॐ रौद्र्यै नमः ॐ कालरात्र्यै नमः ॥ ॥ ॐ तपस्विन्यै नमः ॐ शिवदूत्यै नमः ॐ विशालाक्ष्यै नमः ॐ चामुण्डायै
    नमः ॐ विष्णुसोदरय्यै नमः ॐ चित्कलायै नमः ॐ चिन्मयाकारायै नमः ॐ महिषासुरमर्दिन्यै नमः ॐ कात्यायिन्यै
    नमः ॐ कालरूपायै नमः ॥ ॥ ॐ गिरिजायै नमः ॐ मेनकात्मजायै नमः ॐ भवान्यै नमः ॐ मातृकायै नमः ॐ श्रीमात्रेनमः
    ॐ महागौर्यै नमः ॐ रामायै नमः ॐ शुचिस्मितायै नमः ॐ ब्रह्मस्वरूपिण्यै नमः ॐ राज्यलक्ष्म्यै नमः ॥ ॥ ॐ
    शिवप्रियायै नमः ॐ नारायण्यै नमः ॐ माहाशक्त्यै नमः ॐ नवोढायै नमः ॐ भग्यदायिन्यै नमः ॐ अन्नपूर्णायै
    नमः ॐ सदानन्दायै नमः ॐ यौवनायै नमः ॐ मोहिन्यै नमः ॐ अज्ञानशुध्यै नमः ॥ ॥ ॐ ज्ञानगम्यायै नमः ॐ नित्यायै
    नमः ॐ नित्यस्वरूपिण्यै नमः ॐ पुष्पाकारायै नमः ॐ पुरुषार्थप्रदायिन्यै नमः ॐ महारूपायै नमः ॐ महारौद्र्यै
    नमः ॐ कामाक्ष्यै नमः ॐ वामदेव्यै नमः ॐ वरदायै नमः ॥ ॥ ॐ भयनाशिन्यै नमः ॐ वाग्देव्यै नमः ॐ वचन्यै नमः
    ॐ वाराह्यै नमः ॐ विश्वतोषिन्यै नमः ॐ वर्धनीयायै नमः ॐ विशालाक्षायै नमः ॐ कुलसम्पत्प्रदायिन्यै नमः
    ॐ आर्धदुःखच्चेद दक्षायै नमः ॐ अम्बायै नमः ॥ ॥ ॐ निखिलयोगिन्यै नमः ॐ कमलायै नमः ॐ कमलाकारयै नमः ॐ रक्तवर्णायै
    नमः ॐ कलानिधयै नमः ॐ मधुप्रियायै नमः ॐ कल्याण्यै नमः ॐ करुणायै नमः ॐ जनस्धानायै नमः ॐ वीरपत्न्यै नमः
    ॥ ॥ ॐ विरूपाक्ष्यै नमः ॐ वीराधितायै नमः ॐ हेमाभासायै नमः ॐ सृष्टिरूपायै नमः ॐ सृष्टिसंहारकारिण्यै
    नमः ॐ रञ्जनायै नमः ॐ यौवनाकारायै नमः ॐ परमेशप्रियायै नमः ॐ परायै नमः ॐ पुष्पिण्यै नमः ॥ ॥ ॐ सदापुरस्थायिन्यै
    नमः ॐ तरोर्मूलतलङ्गतायै नमः ॐ हरवाहसमायुक्तयै नमः ॐ मोक्षपरायणायै नमः ॐ धराधरभवायै नमः ॐ मुक्तायै
    नमः ॐ वरमन्त्रायै नमः ॐ करप्रदायै नमः ॐ वाग्भव्यै नमः ॐ देव्यै नमः ॥ ॥ ॐ क्लीं कारिण्यै नमः ॐ संविदे
    नमः ॐ ईश्वर्यै नमः ॐ ह्रीङ्कारबीजायै नमः ॐ शाम्भव्यै नमः ॐ प्रणवात्मिकायै नमः ॐ श्री महागौर्यै नमः
    ॐ शुभप्रदायै नमः ॥
