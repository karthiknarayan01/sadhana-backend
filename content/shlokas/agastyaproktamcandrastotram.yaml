id: agastyaproktamcandrastotram
category: stotram
name:
  english: agastyaproktamcandrastotram
  devanagari: अगस्त्यप्रोक्तंचन्द्रस्तोत्रम्
content:
  english: agastyaproktam candrastotram himamshave namashcaiva somacandraya vai namah | candraya vidhave
    nityam namah kumudabandhave || 70|| sudhamshave ca somaya oshadhishaya vai namah | namo'bjaya mrigankaya
    kalanam nidhaye namah || 71|| namo nakshatranathaya sharvaripataye namah | jaivatrikaya satatam dvijarajaya
    vai namah || 72|| iti shriskandapurane vaishnavakhande ayodhyamahatmye tritiyadhyayantargatam agastyaproktam
    candrastotram samaptam | skandapurana | vaishnavakhanda | ayodhyakhanda 8 | adhyaya 3
  devanagari: अगस्त्यप्रोक्तं चन्द्रस्तोत्रम् हिमांशवे नमश्चैव सोमचन्द्राय वै नमः । चन्द्राय विधवे नित्यं
    नमः कुमुदबन्धवे ॥ ७०॥ सुधांशवे च सोमाय ओषधीशाय वै नमः । नमोऽब्जाय मृगाङ्काय कलानां निधये नमः ॥ ७१॥
    नमो नक्षत्रनाथाय शर्वरीपतये नमः । जैवातृकाय सततं द्विजराजाय वै नमः ॥ ७२॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे
    अयोध्यामाहात्म्ये तृतीयाध्यायान्तर्गतं अगस्त्यप्रोक्तं चन्द्रस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड
    । अयोध्याखण्ड ८ । अध्याय ३
meaning: {}
