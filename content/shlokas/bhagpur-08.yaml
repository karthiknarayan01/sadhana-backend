id: bhagpur-08
category: stotram
name:
  english: bhagpur-08
  devanagari: भग्पुर्-०८
content:
  english: 10 || shrishuka uvaca | iti danavadaiteya navindannamritam nripa | yuktah karmani yattashca
    vasudevaparanmukhah || 1|| sadhayitvamritam rajan payayitva svakan suran | pashyatam sarvabhutanam
    yayau garudavahanah || 2|| sapatnanam paramriddhim drishtva te ditinandanah | amrishyamana utpeturdevan
    pratyudyatayudhah || 3|| tatah suraganah sarve sudhaya pitayaidhitah | pratisamyuyudhuh shastrairnarayanapadashrayah
    || 4|| tatra daivasuro nama ranah paramadarunah | rodhasyudanvato rajamstumulo romaharshanah || 5||
    tatranyonyam sapatnaste samrabdhamanaso rane | samasadyasibhirbanairnijaghnurvividhayudhaih || 6||
    shankhaturyamridanganam bheridamarinam mahan | hastyashvarathapattinam nadatam nihsvano'bhavat ||
    7|| rathino rathibhistatra pattibhih saha pattayah | haya hayairibhashcebhaih samasajjanta samyuge
    || 8|| ushtraih kecidibhaih kecidapare yuyudhuh kharaih | kecidgauramukhairrikshairdvipibhirharibhirbhatah
    || 9|| gridhraih kankairbakairanye shyenabhasaistimingilaih | sharabhairmahishaih khadgairgovrishairgavayarunaih
    || 10|| shivabhirakhubhih kecitkrikalasaih shashairnaraih | bastaireke krishnasarairhamsairanye ca
    sukaraih || 11|| anye jalasthalakhagaih sattvairvikritavigrahaih | senayorubhayo rajan vivishuste'grato'gratah
    || 12|| citradhvajapatai rajannatapatraih sitamalaih | mahadhanairvajradandairvyajanairbarhacamaraih
    || 13|| vatoddhutottaroshnishairarcirbhirvarmabhushanaih | sphuradbhirvishadaih shastraih sutaram
    suryarashmibhih || 14|| devadanavaviranam dhvajinyau pandunandana | rejaturviramalabhiryadasamiva
    sagarau || 15|| vairocano balih sankhye so'suranam camupatih | yanam vaihayasam nama kamagam mayanirmitam
    || 16|| sarvasangramikopetam sarvashcaryamayam prabho | apratarkyamanirdeshyam drishyamanamadarshanam
    || 17|| asthitastadvimanagryam sarvanikadhipairvritah | valavyajanachatragryai reje candra ivodaye
    || 18|| tasyasan sarvato yanairyuthanam patayo'surah | namucih shambaro bano vipracittirayomukhah
    || 19|| dvimurdha kalanabho'tha prahetirhetirilvalah | shakunirbhutasantapo vajradamshtro virocanah
    || 20|| hayagrivah shankushirah kapilo meghadundubhih | tarakashcakradrik shumbho nishumbho jambha
    utkalah || 21|| arishto'rishtanemishca mayashca tripuradhipah | anye paulomakaleya nivatakavacadayah
    || 22|| alabdhabhagah somasya kevalam kleshabhaginah | sarva ete ranamukhe bahusho nirjitamarah ||
    23|| simhanadan vimuncantah shankhan dadhmurmaharavan | drishtva sapatnanutsiktan balabhitkupito bhrisham
    || 24|| airavatam dikkarinamarudhah shushubhe svarat | yatha sravatprasravanamudayadrimaharpatih ||
    25|| tasyasan sarvato deva nanavahadhvajayudhah | lokapalah saha ganairvayvagnivarunadayah || 26||
    te'nyonyamabhisamsritya kshipanto marmabhirmithah | ahvayanto vishanto'gre yuyudhurdvandvayodhinah
    || 27|| yuyodha balirindrena tarakena guho'syata | varuno hetinayudhyanmitro rajan prahetina || 28||
    yamastu kalanabhena vishvakarma mayena vai | shambaro yuyudhe tvashtra savitra tu virocanah || 29||
    aparajitena namucirashvinau vrishaparvana | suryo balisutairdevo banajyeshthaih shatena ca || 30||
    rahuna ca tatha somah pulomna yuyudhe'nilah | nishumbhashumbhayordevi bhadrakali tarasvini || 31||
    vrishakapistu jambhena mahishena vibhavasuh | ilvalah saha vatapirbrahmaputrairarindama || 32|| kamadevena
    durmarsha utkalo matribhih saha | brihaspatishcoshanasa narakena shanaishcarah || 33|| maruto nivatakavacaih
    kaleyairvasavo'marah | vishvedevastu paulomai rudrah krodhavashaih saha || 34|| ta evamajavasurah
    surendrah dvandvena samhatya ca yudhyamanah | anyonyamasadya nijaghnurojasa jigishavastikshnasharasitomaraih
    || 35|| bhushundibhishcakragadarshtipattishaih shaktyulmukaih prasaparashvadhairapi | nistrimshabhallaih
    parighaih samudgaraih sabhindipalaishca shiramsi cicchiduh || 36|| gajasturangah sarathah padatayah
    sarohavaha vividha vikhanditah | nikrittabahurushirodharanghraya
  devanagari: १० ॥ श्रीशुक उवाच । इति दानवदैतेया नाविन्दन्नमृतं नृप । युक्ताः कर्मणि यत्ताश्च वासुदेवपराङ्मुखाः
    ॥ १॥ साधयित्वामृतं राजन् पाययित्वा स्वकान् सुरान् । पश्यतां सर्वभूतानां ययौ गरुडवाहनः ॥ २॥ सपत्नानां
    परामृद्धिं दृष्ट्वा ते दितिनन्दनाः । अमृष्यमाणा उत्पेतुर्देवान् प्रत्युद्यतायुधाः ॥ ३॥ ततः सुरगणाः
    सर्वे सुधया पीतयैधिताः । प्रतिसंयुयुधुः शस्त्रैर्नारायणपदाश्रयाः ॥ ४॥ तत्र दैवासुरो नाम रणः परमदारुणः
    । रोधस्युदन्वतो राजंस्तुमुलो रोमहर्षणः ॥ ५॥ तत्रान्योन्यं सपत्नास्ते संरब्धमनसो रणे । समासाद्यासिभिर्बाणैर्निजघ्नुर्विविधायुधैः
    ॥ ६॥ शङ्खतूर्यमृदङ्गानां भेरीडमरिणां महान् । हस्त्यश्वरथपत्तीनां नदतां निःस्वनोऽभवत् ॥ ७॥ रथिनो रथिभिस्तत्र
    पत्तिभिः सह पत्तयः । हया हयैरिभाश्चेभैः समसज्जन्त संयुगे ॥ ८॥ उष्ट्रैः केचिदिभैः केचिदपरे युयुधुः
    खरैः । केचिद्गौरमुखैरृक्षैर्द्वीपिभिर्हरिभिर्भटाः ॥ ९॥ गृध्रैः कङ्कैर्बकैरन्ये श्येनभासैस्तिमिङ्गिलैः
    । शरभैर्महिषैः खड्गैर्गोवृषैर्गवयारुणैः ॥ १०॥ शिवाभिराखुभिः केचित्कृकलासैः शशैर्नरैः । बस्तैरेके कृष्णसारैर्हंसैरन्ये
    च सूकरैः ॥ ११॥ अन्ये जलस्थलखगैः सत्त्वैर्विकृतविग्रहैः । सेनयोरुभयो राजन् विविशुस्तेऽग्रतोऽग्रतः ॥
    १२॥ चित्रध्वजपटै राजन्नातपत्रैः सितामलैः । महाधनैर्वज्रदण्डैर्व्यजनैर्बार्हचामरैः ॥ १३॥ वातोद्धूतोत्तरोष्णीषैरर्चिर्भिर्वर्मभूषणैः
    । स्फुरद्भिर्विशदैः शस्त्रैः सुतरां सूर्यरश्मिभिः ॥ १४॥ देवदानववीराणां ध्वजिन्यौ पाण्डुनन्दन । रेजतुर्वीरमालाभिर्यादसामिव
    सागरौ ॥ १५॥ वैरोचनो बलिः सङ्ख्ये सोऽसुराणां चमूपतिः । यानं वैहायसं नाम कामगं मयनिर्मितम् ॥ १६॥ सर्वसाङ्ग्रामिकोपेतं
    सर्वाश्चर्यमयं प्रभो । अप्रतर्क्यमनिर्देश्यं दृश्यमानमदर्शनम् ॥ १७॥ आस्थितस्तद्विमानाग्र्यं सर्वानीकाधिपैर्वृतः
    । वालव्यजनछत्राग्र्यै रेजे चन्द्र इवोदये ॥ १८॥ तस्यासन् सर्वतो यानैर्यूथानां पतयोऽसुराः । नमुचिः शम्बरो
    बाणो विप्रचित्तिरयोमुखः ॥ १९॥ द्विमूर्धा कालनाभोऽथ प्रहेतिर्हेतिरिल्वलः । शकुनिर्भूतसन्तापो वज्रदंष्ट्रो
    विरोचनः ॥ २०॥ हयग्रीवः शङ्कुशिराः कपिलो मेघदुन्दुभिः । तारकश्चक्रदृक् शुम्भो निशुम्भो जम्भ उत्कलः
    ॥ २१॥ अरिष्टोऽरिष्टनेमिश्च मयश्च त्रिपुराधिपः । अन्ये पौलोमकालेया निवातकवचादयः ॥ २२॥ अलब्धभागाः सोमस्य
    केवलं क्लेशभागिनः । सर्व एते रणमुखे बहुशो निर्जितामराः ॥ २३॥ सिंहनादान् विमुञ्चन्तः शङ्खान् दध्मुर्महारवान्
    । दृष्ट्वा सपत्नानुत्सिक्तान् बलभित्कुपितो भृशम् ॥ २४॥ ऐरावतं दिक्करिणमारूढः शुशुभे स्वराट् । यथा
    स्रवत्प्रस्रवणमुदयाद्रिमहर्पतिः ॥ २५॥ तस्यासन् सर्वतो देवा नानावाहध्वजायुधाः । लोकपालाः सह गणैर्वाय्वग्निवरुणादयः
    ॥ २६॥ तेऽन्योन्यमभिसंसृत्य क्षिपन्तो मर्मभिर्मिथः । आह्वयन्तो विशन्तोऽग्रे युयुधुर्द्वन्द्वयोधिनः
    ॥ २७॥ युयोध बलिरिन्द्रेण तारकेण गुहोऽस्यत । वरुणो हेतिनायुध्यन्मित्रो राजन् प्रहेतिना ॥ २८॥ यमस्तु
    कालनाभेन विश्वकर्मा मयेन वै । शम्बरो युयुधे त्वष्ट्रा सवित्रा तु विरोचनः ॥ २९॥ अपराजितेन नमुचिरश्विनौ
    वृषपर्वणा । सूर्यो बलिसुतैर्देवो बाणज्येष्ठैः शतेन च ॥ ३०॥ राहुणा च तथा सोमः पुलोम्ना युयुधेऽनिलः
    । निशुम्भशुम्भयोर्देवी भद्रकाली तरस्विनी ॥ ३१॥ वृषाकपिस्तु जम्भेन महिषेण विभावसुः । इल्वलः सह वातापिर्ब्रह्मपुत्रैररिन्दम
    ॥ ३२॥ कामदेवेन दुर्मर्ष उत्कलो मातृभिः सह । बृहस्पतिश्चोशनसा नरकेण शनैश्चरः ॥ ३३॥ मरुतो निवातकवचैः
    कालेयैर्वसवोऽमराः । विश्वेदेवास्तु पौलोमै रुद्राः क्रोधवशैः सह ॥ ३४॥ त एवमाजावसुराः सुरेन्द्राः द्वन्द्वेन
    संहत्य च युध्यमानाः । अन्योन्यमासाद्य निजघ्नुरोजसा जिगीषवस्तीक्ष्णशरासितोमरैः ॥ ३५॥ भुशुण्डिभिश्चक्रगदर्ष्टिपट्टिशैः
    शक्त्युल्मुकैः प्रासपरश्वधैरपि । निस्त्रिंशभल्लैः परिघैः समुद्गरैः सभिन्दिपालैश्च शिरांसि चिच्छिदुः
    ॥ ३६॥ गजास्तुरङ्गाः सरथाः पदातयः सारोहवाहा विविधा विखण्डिताः । निकृत्तबाहूरुशिरोधराङ्घ्रय
