id: vishnustotramjanakaproktam
category: stotram
name:
  english: vishnustotramjanakaproktam
  devanagari: विष्णुस्तोत्रंजनकप्रोक्तम्
content:
  english: samyagaha bhavanvipra vacyamevam bhavadvidhaih | mamapi shruyatam vakyam bhavato yadi rocate
    || 11|| yada sarvagato vishnuh paramatma prajapatih | tada mitradimadhyasthasamjna keshu nipatyatam
    || 12|| pita mata tatha bhrata yada nanyajjanardanat | pitrimatrimayim samjnam tada kutra karomyaham
    || 13|| so'ham bravimi yadvakyam tannibodha dvijottama | anekaruparupo'yam vishnurevakhilam jagat
    || 14|| vishnuh pita me jagatah pratishtha vishnurmata vishnurevagrajo me | vishnurgatirvishnumayastathasmi
    vishnau sthito'smyakshagatashca vishnuh || 15|| yo me mamatvopagatah sa vishnuryashcaribhuto mama
    so'pi vishnuh | divam viyadbhuh kakubhashca vishnurbhutani vishnurbhuvanani vishnuh || 16|| pashyami
    vishnum na param tato'nyacchrinomi vishnum na param tato'nyat | sprishami vishnum na param tato'nyajjighrami
    vishnum na param tato'nyat || 17|| rasami vishnum na param tato'nyanmanye ca vishnum na param tato'nyat
    jighrami vishnum na param tato'nyannamami vishnum na param tato'nyat | budhyami vishnum na param tato'nyatsarvam
    hi vishnurna param tato'nyat || 18|| vishnuh samastam na param tato'sti vishnuh samastam na param
    ca devah vishnuh sthaviyanna param tato'sti vishnurlaghiyanna param tato'sti vishnurgariyanna param
    tato'nyat vishnuraniyanna param tato'sti || 19|| yatha na vishnuvyatiriktamanyacchrinomi pashyami
    tatha sprishami | satyena tenopashamam prayantu dosha vimukteh paripanthino ye || 20|| na me'sti bandhurna
    ca me'sti shatrurna bhutavargo na jano madanyah | tvam cahamanye ca sharirabhedairvibhinnamishasya
    hareh svarupam || 21|| murtamurtivishesham tu pashyatastanmayam dvija | krodhaharshadayo bhavah sthasyanti
    hridaye katham || 22|| sa tvam prasida moho'yamatha cenmama suvrata | tathapi ma rusham karshiracikitsya
    hi mohitah || 23|| iti vishnudharmeshu pancashashtitamo'dhyayantargatam janakaproktam vishnustotram
    sampurnam |
  devanagari: सम्यगाह भवान्विप्र वाच्यमेवं भवद्विधैः । ममापि श्रूयतां वाक्यं भवतो यदि रोचते ॥ ११॥ यदा
    सर्वगतो विष्णुः परमात्मा प्रजापतिः । तदा मित्रादिमध्यस्थसंज्ञा केषु निपात्यताम् ॥ १२॥ पिता माता तथा
    भ्राता यदा नान्यज्जनार्दनात् । पितृमातृमयीं संज्ञां तदा कुत्र करोम्यहम् ॥ १३॥ सोऽहं ब्रवीमि यद्वाक्यं
    तन्निबोध द्विजोत्तम । अनेकरूपरूपोऽयं विष्णुरेवाखिलं जगत् ॥ १४॥ विष्णुः पिता मे जगतः प्रतिष्ठा विष्णुर्माता
    विष्णुरेवाग्रजो मे । विष्णुर्गतिर्विष्णुमयस्तथास्मि विष्णौ स्थितोऽस्म्यक्षगतश्च विष्णुः ॥ १५॥ यो मे
    ममत्वोपगतः स विष्णुर्यश्चारिभूतो मम सोऽपि विष्णुः । दिवं वियद्भूः ककुभश्च विष्णुर्भूतानि विष्णुर्भुवनानि
    विष्णुः ॥ १६॥ पश्यामि विष्णुं न परं ततोऽन्यच्छृणोमि विष्णुं न परं ततोऽन्यत् । स्पृशामि विष्णुं न परं
    ततोऽन्यज्जिघ्रामि विष्णुं न परं ततोऽन्यत् ॥ १७॥ रसामि विष्णुं न परं ततोऽन्यन्मन्ये च विष्णुं न परं
    ततोऽन्यत् जिघ्रामि विष्णुं न परं ततोऽन्यन्नमामि विष्णुं न परं ततोऽन्यत् । बुध्यामि विष्णुं न परं ततोऽन्यत्सर्वं
    हि विष्णुर्न परं ततोऽन्यत् ॥ १८॥ विष्णुः समस्तं न परं ततोऽस्ति विष्णुः समस्तं न परं च देवः विष्णुः
    स्थवीयान्न परं ततोऽस्ति विष्णुर्लघीयान्न परं ततोऽस्ति विष्णुर्गरीयान्न परं ततोऽन्यत् विष्णुरणीयान्न
    परं ततोऽस्ति ॥ १९॥ यथा न विष्णुव्यतिरिक्तमन्यच्छृणोमि पश्यामि तथा स्पृशामि । सत्येन तेनोपशमं प्रयान्तु
    दोषा विमुक्तेः परिपन्थिनो ये ॥ २०॥ न मेऽस्ति बन्धुर्न च मेऽस्ति शत्रुर्न भूतवर्गो न जनो मदन्यः । त्वं
    चाहमन्ये च शरीरभेदैर्विभिन्नमीशस्य हरेः स्वरूपम् ॥ २१॥ मूर्तामूर्तिविशेषं तु पश्यतस्तन्मयं द्विज ।
    क्रोधहर्षादयो भावाः स्थास्यन्ति हृदये कथम् ॥ २२॥ स त्वं प्रसीद मोहोऽयमथ चेन्मम सुव्रत । तथापि मा रुषं
    कार्षीरचिकित्स्या हि मोहिताः ॥ २३॥ इति विष्णुधर्मेषु पञ्चषष्टितमोऽध्यायान्तर्गतं जनकप्रोक्तं विष्णुस्तोत्रं
    सम्पूर्णम् ।
