id: jabala
category: upanishad
name:
  english: jabala
  devanagari: जबल
content:
  english: jabalopanishat jabalopanishatkhyatam samnyasajnanagocaram | vastutastraipadam brahma svamatramavashishyate
    || om purnamadah purnamidam purnat purnamudacyate | purnasya purnamadaya purnamevavashishyate || om
    shantih shantih shantih || om brihaspatiruvaca yajnavalkyam yadanu kurukshetram devanam devayajanam
    sarvesham bhutanam brahmasadanam | avimuktam vai kurukshetram devanam devayajanam sarvesham bhutanam
    brahmasadanam | tasmadyatra kvacana gacchati tadeva manyeta tadavimuktameva | idam vai kurukshetram
    devanam devayajanam sarvesham bhutanam brahmasadanam || atra hi jantoh praneshutkramamaneshu rudrastarakam
    brahma vyacashte yenasavamriti bhutva mokshi bhavati tasmadavimuktameva nisheveta avimuktam na vimuncedevamevaitadyajnavalkyah
    || 1|| atha hainamatrih papraccha yajnavalkyam ya esho'nanto'vyakta atma tam kathamaham vijaniyamiti
    || sa hovaca yajnavalkyah so'vimukta upasyo ya esho'nanto'vyakta atma so'vimukte pratishthita iti
    || so'vimuktah kasminpratishthita iti | varanayam nashyam ca madhye pratishthita iti || ka vai varana
    ka ca nashiti | sarvanindriyakritandoshanvarayatiti tena varana bhavati || sarvanindriyakritanpapannashayatiti
    tena nashi bhavatiti || katamam casya sthanam bhavatiti | bhruvorghranasya ca yah sandhih sa esha
    dyaurlokasya parasya ca sandhirbhavatiti | etadvai sandhim sandhyam brahmavida upasata iti | so'vimukta
    upasya iti | so'vimuktam jnanamacashte | yo vaitadevam vedeti || 2|| atha hainam brahmacarina ucuh
    kim japyenamritatvam bruhiti || sa hovaca yajnavalkyah | shatarudriyenetyetanyeva ha va amritasya
    namani || etairha va amrito bhavatiti evamevaitadyajnavalkyah || 3|| atha hainam janako vaideho yajnavalkyamupasametyovaca
    bhagavansamnyasam bruhiti | sa hovaca yajnavalkyah | brahmacaryam parisamapya grihi bhavet | grihi
    bhutva vani bhavet | vani bhutva pravrajet | yadi vetaratha brahmacaryadeva pravrajedgrihadva vanadva
    || atha punaravrati va vrati va snatako va'snatako votsannagniko va yadahareva virajettadahareva pravrajet
    | taddhaike prajapatyameveshti
  devanagari: जाबालोपनिषत् जाबालोपनिषत्ख्यातं संन्यासज्ञानगोचरम् । वस्तुतस्त्रैपदं ब्रह्म स्वमात्रमवशिष्यते
    ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ ॐ बृहस्पतिरुवाच याज्ञवल्क्यं यदनु कुरुक्षेत्रं देवानां देवयजनं सर्वेषां भूतानां
    ब्रह्मसदनम् । अविमुक्तं वै कुरुक्षेत्रं देवानां देवयजनं सर्वेषां भूतानां ब्रह्मसदनम् । तस्माद्यत्र
    क्वचन गच्छति तदेव मन्येत तदविमुक्तमेव । इदं वै कुरुक्षेत्रं देवानां देवयजनं सर्वेषां भूतानां ब्रह्मसदनम्
    ॥ अत्र हि जन्तोः प्राणेषूत्क्रममाणेषु रुद्रस्तारकं ब्रह्म व्याचष्टे येनासावमृती भूत्वा मोक्षी भवति
    तस्मादविमुक्तमेव निषेवेत अविमुक्तं न विमुञ्चेदेवमेवैतद्याज्ञवल्क्यः ॥ १॥ अथ हैनमत्रिः पप्रच्छ याज्ञवल्क्यं
    य एषोऽनन्तोऽव्यक्त आत्मा तं कथमहं विजानीयामिति ॥ स होवाच याज्ञवल्क्यः सोऽविमुक्त उपास्यो य एषोऽनन्तोऽव्यक्त
    आत्मा सोऽविमुक्ते प्रतिष्ठित इति ॥ सोऽविमुक्तः कस्मिन्प्रतिष्ठित इति । वरणायां नाश्यां च मध्ये प्रतिष्ठित
    इति ॥ का वै वरणा का च नाशीति । सर्वानिन्द्रियकृतान्दोषान्वारयतीति तेन वरणा भवति ॥ सर्वानिन्द्रियकृतान्पापान्नाशयतीति
    तेन नाशी भवतीति ॥ कतमं चास्य स्थानं भवतीति । भ्रुवोर्घ्राणस्य च यः सन्धिः स एष द्यौर्लोकस्य परस्य
    च सन्धिर्भवतीति । एतद्वै सन्धिं सन्ध्यां ब्रह्मविद उपासत इति । सोऽविमुक्त उपास्य इति । सोऽविमुक्तं
    ज्ञानमाचष्टे । यो वैतदेवं वेदेति ॥ २॥ अथ हैनं ब्रह्मचारिण ऊचुः किं जप्येनामृतत्वं ब्रूहीति ॥ स होवाच
    याज्ञवल्क्यः । शतरुद्रियेणेत्येतान्येव ह वा अमृतस्य नामानि ॥ एतैर्ह वा अमृतो भवतीति एवमेवैतद्याज्ञवल्क्यः
    ॥ ३॥ अथ हैनं जनको वैदेहो याज्ञवल्क्यमुपसमेत्योवाच भगवन्संन्यासं ब्रूहीति । स होवाच याज्ञवल्क्यः ।
    ब्रह्मचर्यं परिसमाप्य गृही भवेत् । गृही भूत्वा वनी भवेत् । वनी भूत्वा प्रव्रजेत् । यदि वेतरथा ब्रह्मचर्यादेव
    प्रव्रजेद्गृहाद्वा वनाद्वा ॥ अथ पुनरव्रती वा व्रती वा स्नातको वाऽस्नातको वोत्सन्नग्निको वा यदहरेव
    विरजेत्तदहरेव प्रव्रजेत् । तद्धैके प्राजापत्यामेवेष्टि
