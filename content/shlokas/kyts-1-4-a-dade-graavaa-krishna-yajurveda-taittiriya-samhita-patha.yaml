id: kyts-1-4-a-dade-graavaa-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.4 A Dade Graavaa - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande caturthah prashnah sutyadine kartavya
    grahah o shri gurubhyo namah | harih om || a dade grava ddevebhyo gambhiramima nkriddhyuttamena pavinendraya
    somagm sushuta vri~shtivanimindraya tva vritraghna indraya tva vritratura indraya tva 'bhimatighna
    indraya tva ''dityavata indraya tva vishvade sstha vritraturo radhogurta amritasya patnista devi ssomasya
    pibatopahuto yushmakagm somah pibatu yatte soma divi jyotirya ya~duravantarikshe tenasmai yajamanayoru
    raya kriddhyadhi datre voco dhishane vidu sati vidayetha mma vagm higmsisha mma ma higmsishta mpragapagudagadharaktastva
    disha a dhavantvamba ni shvara | yatte soma nnama jagrivi tasmai te soma somaya svaha vacaspataye
    pavasva vajin vrisha vrishno agmshubhya ngabhastiputo devo devana 'si tebhyastva svankrito rna ishaskridhi
    vishve bhyastvendriyebhyo divyebhyah parthivebhyo manastva 'shturvantariksha ssuryaya devebhyastva
    maricipebhya esha te yonih pranaya tva || upayamagrihito 'syantaryaccha maghava npahi somamurushya
    raya 'ntaste dadhami dyavaprithivi antarurvantarikshagm sajosha devairavaraih parai nmadayasva svankrito
    'si madhumatirna ishaskridhi vishve bhyastvendriyebhyo divyebhyah parthivebhyo manastva 'shturvantarikshamanvihi
    svaha ssuryaya devebhya stva maricipebhya esha te yonirapanaya tva || a vayo bhusha shucipa upa na
    nte niyuto vishvavara | upo te andho madyamayami yasya deva dadhishe pu m || upayamagrihito 'si vayave
    tvendravayu ime sutah | upa prayobhira gatamindavo vamushanti hi || upayamagrihito ntvaisha te yonih
    sajosha ssoma ritavridha | mamediha shrutagm hava m | upayamagrihito 'si mitravarunabhya ntvaisha
    te yonir nkasha madhumatyashvina sunritavati | taya yajna mmimikshatam | upayamagrihito ntvaisha te
    yonirmaddhvi prataryujau vi mucyetha mashvinaveha gacchatam | asya somasya pitaye ntvaisha te yonirashvibhya
    tprishnigarbha jyotirjarayu rajaso vimane | imamapagm sangame suryasya shishu nna vipra matibhi rihanti
    || upayamagrihito 'si shandaya tvaisha te yoni mpratnatha purvatha vishvathematha hishadagm suvarvida
    njayantamanu yasu vardhase | upayamagrihito 'si markaya tvaisha te yonih prajah pahi || ye deva divyekadasha
    stha prithivyamaddhyekadasha stha 'phsushado mahinaikadasha stha te deva yajnamima grayano jinva yajna
    njinva yajnapatimabhi savana pahi vishnustva mpahindriyenaisha te yoni bhyastva devebhyah || stricatvarigmshat
    trigmshattrayashca ganino rujanto divagm rudrah prithivi nca sacante | ekadashaso aphsushadah sutagm
    soma njushantagm savanaya vishve grayano jinva yajna njinva yajnapatimabhi savana pahi vishnustva
    mpahindriyenaisha te yoni bhyastva devebhyah || 'sindraya tva brihadvate vayasvata ukthayuve yatta
    indra brihadvayastasmai tva vishnave tvaisha te yonirindraya tvokthayuve shvanaramritaya jatamagnim
    | kavigm samraja njananamasanna patra njanayanta devah || upayamagrihito tva vaishvanaraya dhruvo
    macyutakshittama esha te yoniragnaye madhushca madhavashca shukrashca shucishca nabhashca nabhasyashceshashcorjashca
    sahashca sahasyashca tapashca tapasyashco 'syagmhaspatyaya tva || ndhiyeshita || upayamagrihito ntvaisha
    te yonirindragnibhya shanidhrito vishve devasa a gata | dashvagmso dashushah sutam || upayamagrihito
    bhyastva devebhya esha te yoni bhyastva devebhyah || ndivyagm shasamindra m | vishvasahamavase nutanayogragm
    sahodamiha tagm huvema || upayamagrihito 'sindraya tva marutvata esha te yonirindraya tva marutvate
    || indra marutva iha pahi somam ya~tha sharyate apiba ssutasya | tava praniti tava shura sharmanna
    vivasanti kavayah suyajnah || upayamagrihito 'sindraya tva marutvata esha te yonirindraya tva marutvate
    || indraikanna trigmshat marutvagm indra vrishabho ranaya piba somamanushvadha mmadaya | a sincasva
    jathare maddhva urmi 'si pradivah sutana m || upayamagrihito 'sindraya tva marutvata esha te yonirindraya
    tva marutvate || marutvanekannatrigmshat mahagm indro ya ojasa parjanyo vrishtimagm iva | stomai rvathsasya
    vavridhe || upayamagrihito 'si mahendraya tvaisha te yoni rmahendraya tva || mahanekannavigmshatih
    mahagm indro nrivada car shanipra uta dvibar ssahobhih | asmadriyagvavridhe viryayoruh prithu ssukritah
    kartribhirbhut || upayamagrihito 'si mahendraya tvaisha te yoni rmahendraya tva || kada cana starirasi
    nendra sashcasi dashushe nbhuya innu te dana ndevasya pricyate || upayamagrihito dityebhyastva ||
    kada cana pra yucchasyubhe ni pasi janmani | turiyaditya savana nta indriyama tasthavamrita ndivi
    || yajno devana mpratyeti sumnamadityaso bhavata mridayantah | a vo 'rvaci sumati shcidya varivovittara
    'sat || vivasva adityaisha te somapithastena mandasva tena tripya tripyasma te vaya ntarpayitaro ya
    divya vrishtistaya vamamadya savitarvamamu shvo divedive vamamasmabhyagm savih || vamasya hi kshayasya
    deva bhureraya dhiya vamabhajah syama || upayamagrihito 'si devaya tva savitre || ssavitah payubhishtvagm
    shivebhiradya paripahi no gaya ssuvitaya navyase raksha makirno aghashagmsa ishata || upayamagrihito
    'si devaya tva savitre || hiranyapanimutaye savitaramupa hvaye | sa cetta devata padam || upayamagrihito
    'si devaya tva savitre || 'si supratishthano brihadukshe nama esha te yoni bhyastva devebhyah || brihaspatisutasya
    ta indo indriyavatah patnivanta ssajurdevena tvashtra soma harirasi hariyojano haryo ssthata vajrasya
    bharta prishneh preta tasya te deva someshtayajusha sstutastomasya shastokthasya harivanta ssahasoma
    indraya svaha agna ayugmshi pavasa a suvorjamisha nca nah | are badhasva ducchuna m || upayamagrihito
    tva tejasvata esha te yoniragnaye uttishthannojasa saha pitva shipre avepayah | somamindra camu sutam
    || upayamagrihito 'sindraya tvaujasvata esha te yonirindraya tvaujasvate || uttishthannekavigmshatih
    shato jyotishkridasi surya | vishvama bhasi rocanam || upayamagrihito 'si suryaya tva bhrajasvata
    esha te yoni ssuryaya tva bhrajasvate || a pyayasva madintama soma vishvabhi iyushte ye purvataramapashyan
    vyucchantimushasa mmartyasah | asmabhiru nu praticakshya 'bhudo te yanti ye aparishu pashyan || ntva
    sadayami jyotishkrita ntva sadayami jyotirvida ntva sadayami bhasvati ntva sadayami jvalanti ntva
    sadayami malmalabhavanti ntva sadayami dipyamana ntva sadayami rocamana ntva sadayamyajasra ntva sadayami
    brihajjyotisha ntva sadayami bodhayanti ntva sadayami jagrati prayasaya svaha ''yasaya svaha viyasaya
    svaha sam 'vayasaya svaha shuce svaha shokaya svaha tapyatvai svaha tapate svaha brahmahatyayai svaha
    sarvasmai svaha cittagm santanena bhavam ntanimna pashupatigg sthulahridayenagnigm hridayena rudram
    shvenaushishthahanagm shinginikoshya yu~kta te brahmana hari | arvacinagm su te mano grava krinotu
    vagnuna 'sindraya tva shodashina esha te yonirindraya tva shodashine indramiddhari vahato nca stutirupa
    yajna nca manushanam || upayamagrihito 'sindraya tva shodashina esha te yonirindraya tva shodashine
    asavi soma indra te shavishtha dhrishnava gahi | a tva prinaktvindriyagm raja nna rashmibhih || upayamagrihito
    'sindraya tva shodashina esha te yonirindraya tva shodashine sarvasya pratishivari bhumistvopastha
    a 'smai sushada bhava yaccha 'smai sharma saprathah 'sindraya tva shodashina esha te yonirindraya
    tva shodashine sarvasya shadvigmshatih mahagm indro vajrabahu shshodashi sharma yacchatu | svasti
    no maghava karotu hantu papmanam ndveshti || upayamagrihito 'sindraya tva shodashina esha te yonirindraya
    tva shodashine sajosha indra sagano marudbhi mpiba vritrahanchura vidvan | jahi shatrugm rapa mridho
    nudasva nkrinuhi vishvato nah || upayamagrihito 'sindraya tva shodashina esha te yonirindraya tva
    shodashine va~hanti ketavah | drishe vishvaya surya rmitrasya varunasya 'pra dyavaprithivi antarikshagm
    surya atma jagatastasthushashca || agne naya supatha raye asman vishvani deva vayunani vidvan | yuyoddhyasma
    jjuhurana meno bhuyishtha ngaccha suvah pata rupena vo rupamabhyaimi vayasa vayah | || vo rupamabhyaimi
    vayasa vayah | tutho vo vishvaveda vi bhajatu var || etatte agne radha aiti somacyuta ntanmitrasya
    patha nayartasya patha preta candradakshina yajnasya patha suvita nayanti mpaitrimatyagm sudhatudakshinam
    vi~ suvah pashya vyantariksham ya~tasva sadasyai rasmadda tra devatra gacchata madhumatih pradatarama
    vishata ndevayanena patheta sukritam lo~ke sidata tannah sagg rnidhipatirno agnih | tvashta vishnuh
    prajaya sagmrarano yajamanaya dravina ndadhatu || samindra no manasa neshi gobhi ssagm suribhirmaghavan
    mbrahmana devakritam ndevanagm sumatya yajniyanam || sam raganmahi manasa sagm shivena || tvashta
    no atra varivah krino shtu tanuvo yadvilishtam || yadadya tva prayati yajne asminnagne hotaramavrinimahiha
    | ridhagayadridhaguta 'shamishthah prajanan yajnamupa yahi vidvan || svaga vo deva ssadanamakarma
    ya ajagma savaneda njushanah | jakshivagmsah papivagmsashca vishve 'sme dhatta vasavo vasuni || yana
    'vaha ushato deva deva preraya sve agne sadhasthe npreraya sve agne sadhasthe | vahamana bharamana
    havigmshi vasu ndivama tishthatanu | yajna yajna ngaccha svahaisha te yajno yajnapate sahasu ssvaha
    deva gatuvido gatum vi~ttva gatumita manasaspata ima nno deva deveshu yajnagg svaha vaci svaha vate
    dhah || urugm hi raja varunashcakara suryaya pantha manvetava u | apade pada pratidhatave 'pavakta
    hridayavidhashcit || shata nbhishajah sahasramurvi gambhira sumatishte astu | badhasva dvesho nir
    ncidenah pra mumugddhyasmat || abhishthito varunasya pasho 'gneranikamapa a vivesha | apa tpratirakshannasurya
    ya~kshyagne || prati te jihva ghritamuccaranye thsamudre te hridayamaphsvantah | sa ntva vishantvoshadhi
    ''po yajnasya tva yajnapate havirbhih || suktavake namovake vidhema 'vabhritha nicankuna nicerurasi
    nicankuna rmartyakritamurora no deva rishaspahi sumitra na apa oshadhaya santu durmitrastasmai ssantu
    durmitrastasmai bhuyasu ndvishmo devirapa esha vo garbhastam ssupritagm subhrita tpratiyuto varunasya
    pashah pratyasto varunasya pasha edho 'syedhishimahi samidasi tejo 'si tejo mayi dhehyapo anvacarishagm
    rasena samasrikshmahi | payasvagm agna a 'gama mma sagm srija varcasa || yastva hrida kirina manyamano
    'martya mmartyo johavimi | jatavedo yasho asmasu dhehi prajabhiragne amritatvamashyam || yasmai tvagm
    sukrite jataveda u lokamagne krinavah syonam | ashvinagm sa putrinam nnashate svasti || tve su putra
    shavaso 'vritran kamakatayah | na tvamindrati ricyate || ukthaukthe soma indra mmamada nithenithe
    maghavanagm sutasah | yadigm sabadhah pitara ssamanadaksha avase havante || agne rasena tejasa jatavedo
    vi rocase | rakshoha 'mivacatanah || apo anvacarishagm rasena samasrikshmahi | payasvagm agna a mma
    sagm srija varcasa ||vasu rvasupatir hikamasyagne vibhavasuh | syama te sumatavapi || tvamagne vasupatim
    va~sunamabhi pra mande addhvareshu rajann | addhvareshu rajann | tvaya vajam rmartyanam | tvamagne
    vajasatamam vi~pra vardhanti sushtutam | sa no rasva suvirya nno agnirvarivah krinotvaya mmridhah
    pura etu prabhindann || ayagm shatru njayatu vajasatau || agnina hyagne agnina vipro viprena san thsata
    | sakha sakhya samiddhyase || udagne shucayastava madabdhebhir hiranyapanigm stva shatcatvarigmshat
    | vaca pranaya tva | upayamagrihito 'syapanaya tva | a vayo vayave sajosha ntva | ayamritayubhya ntva
    | ya vamashvibhya ntva | prataryujavashvibhyamashvibhya ntva | ayagm shandaya virata mmarkaya prajah
    pahi | ye deva strigmshada bhyastva devebhyah | upayamagrihito 'sindraya tvokthayuve tva vaishvanaraya
    | madhushca sagm sarpo gni indragnibhya ntva | omaso vishve bhyastva devebhyah | marutva ntantrinindraya
    tva marutvate | mahandve mahendraya tva | kada cana ''dityebhyastva | kada cana stari rvivasva aditya
    | indragm shucirapah | vamantrini devaya tva savitre | susharma bhyastva devebhyah | brihaspati sutasya
    tvashtra soma | harirasi sahasoma indraya svaha | agna ayugshyagnaye tva tejasvate | uttishthannindraya
    tvaujasvate | tarani ssuryaya tva bhrajasvate | a tishthadyashshatindraya tva shodashine ncitram |
    agne naya diva ngaccha | urumayushte yaddeva mumugdhi | agnavishnu sukratu mumuktam | para vai panktyah
    | deva vai ye devah panktyo m | bhumirvyatrishyann | prajapati rvyakshuddhyann | bhumiradiya vai |
    agnihotramadityo vai | bhumi ssulekah | vishnoruduttamam | annapate punasva ''dityah | urugm sagm
    srija varcasa | yastva sushtutam | tvamagne yukshva hi sushtitim | tvamagne vicar shane | yatva vi
    rocase | || harih om || || krishna yajurvediya taittiriya samhitaya mprathamakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे चतुर्थः प्रश्नः सुत्यादिने कर्तव्या ग्रहाः
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ आ द॑दे॒ ग्रावा द्दे॒वेभ्यो॑ गम्भी॒रमि॒म ङ्कृ॑द्ध्युत्त॒मेन॑ प॒विनेन्द्रा॑य॒
    सोम॒ग्ं॒ सुषु॑त॒ वृँष्टि॒वनि॒मिन्द्रा॑य त्वा वृत्र॒घ्न इन्द्रा॑य त्वा वृत्र॒तुर॒ इन्द्रा॑य त्वा ऽभिमाति॒घ्न
    इन्द्रा॑य त्वा ऽऽदि॒त्यव॑त॒ इन्द्रा॑य त्वा वि॒श्वदे स्स्थ॑ वृत्र॒तुरो॒ राधो॑गूर्ता अ॒मृत॑स्य॒ पत्नी॒स्ता
    दे॑वी स्सोम॑स्य पिब॒तोप॑हूतो यु॒ष्माक॒ग्ं॒ सोमः॑ पिबतु॒ यत्ते॑ सोम दि॒वि ज्योति॒र्य यँदु॒राव॒न्तरि॑क्षे॒
    तेना॒स्मै यज॑मानायो॒रु रा॒या कृ॒द्ध्यधि॑ दा॒त्रे वो॑चो॒ धिष॑णे वी॒डू स॒ती वी॑डयेथा॒ म्मा वाग्ं॑ हिग्ंसिष॒
    म्मा मा॑ हिग्ंसिष्ट॒ म्प्रागपा॒गुद॑गध॒राक्तास्त्वा॒ दिश॒ आ धा॑व॒न्त्वम्ब॒ नि ष्व॑र । यत्ते॑ सो॒मा
    न्नाम॒ जागृ॑वि॒ तस्मै॑ ते सोम॒ सोमा॑य॒ स्वाहा वा॒चस्पत॑ये पवस्व वाजि॒न् वृषा॒ वृष्णो॑ अ॒ग्ं॒शुभ्या॒
    ङ्गभ॑स्तिपूतो दे॒वो दे॒वाना ऽसि॒ तेभ्य॑स्त्वा॒ स्वाङ्कृ॑तो र्न॒ इष॑स्कृधि॒ विश्वे भ्यस्त्वेन्द्रि॒येभ्यो॑
    दि॒व्येभ्यः॒ पार्थि॑वेभ्यो॒ मन॑स्त्वा ऽष्टू॒र्व॑न्तरि॑क्ष॒ स्सूर्या॑य दे॒वेभ्य॑स्त्वा मरीचि॒पेभ्य॑
    ए॒ष ते॒ योनिः॑ प्रा॒णाय॑ त्वा ॥ उ॒प॒या॒मगृ॑हीतो ऽस्य॒न्तर्य॑च्छ मघव न्पा॒हि सोम॑मुरु॒ष्य राय॒ ऽन्तस्ते॑
    दधामि॒ द्यावा॑पृथि॒वी अ॒न्तरु॒र्व॑न्तरि॑क्षग्ं स॒जोषा॑ दे॒वैरव॑रैः॒ परै न्मादयस्व॒ स्वाङ्कृ॑तो ऽसि॒
    मधु॑मतीर्न॒ इष॑स्कृधि॒ विश्वे भ्यस्त्वेन्द्रि॒येभ्यो॑ दि॒व्येभ्यः॒ पार्थि॑वेभ्यो॒ मन॑स्त्वा ऽष्टू॒र्व॑न्तरि॑क्ष॒मन्वि॑हि॒
    स्वाहा स्सूर्या॑य दे॒वेभ्य॑ स्त्वा मरीचि॒पेभ्य॑ ए॒ष ते॒ योनि॑रपा॒नाय॑ त्वा ॥ आ वा॑यो भूष शुचिपा॒ उप॑
    न न्ते नि॒युतो॑ विश्ववार । उपो॑ ते॒ अन्धो॒ मद्य॑मयामि॒ यस्य॑ देव दधि॒षे पू म् ॥ उ॒प॒या॒मगृ॑हीतो ऽसि
    वा॒यवे॒ त्वेन्द्र॑वायू इ॒मे सु॒ताः । उप॒ प्रयो॑भि॒रा ग॑त॒मिन्द॑वो वामु॒शन्ति॒ हि ॥ उ॒प॒या॒मगृ॑हीतो
    न्त्वै॒ष ते॒ योनिः॑ स॒जोषा स्सोम॑ ऋतावृधा । ममेदि॒ह श्रु॑त॒ग्ं॒ हव म् । उ॒प॒या॒मगृ॑हीतो ऽसि मि॒त्रावरु॑णाभ्या
    न्त्वै॒ष ते॒ योनि॑र् ङ्कशा॒ मधु॑म॒त्यश्वि॑ना सू॒नृता॑वती । तया॑ य॒ज्ञ म्मि॑मिक्षतम् । उ॒प॒या॒मगृ॑हीतो
    न्त्वै॒ष ते॒ योनि॒र्माद्ध्वी प्रा॒त॒र्युजौ॒ वि मु॑च्येथा॒ मश्वि॑ना॒वेह ग॑च्छतम् । अ॒स्य सोम॑स्य पी॒तये
