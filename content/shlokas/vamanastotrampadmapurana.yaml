id: vamanastotrampadmapurana
category: stotram
name:
  english: vamanastotrampadmapurana
  devanagari: वामनस्तोत्रम्पद्मपुराण
content:
  english: vamanastotram padmapuranantargatam shriganeshaya namah | aditiruvaca | namaste devadevesha
    sarvavyapin janardana | sattvadigunabhedena lokavyaparakarine || 1|| namaste bahurupaya arupaya namo
    namah | sarvaikadbhutarupaya nirgunaya gunatmane || 2|| namaste lokanathaya paramajnanarupine | sadbhaktajanavatsalyashiline
    mangalatmane || 3|| yasyavatararupani hyarjayanti munishvarah | tamadipurusham devam namamishtarthasiddhaye
    || 4|| yam na jananti shrutayo yam na jananti surayah | tam namami jagaddhetum mayinam tamamayinam
    || 5|| yasyavalokanam citram mayopadravavaranam | jagadrupam jagatpalam tam vande padmajadhavam ||
    6|| yo devastyaktasanganam shantanam karunarnavah | karoti hyatmana sangam tam vande sangavarjitam
    || 7|| yatpadabjajalaklinnasevaranjitamastakah | avapuh paramam siddhim tam vande sarvavanditam ||
    8|| yajneshvaram yajnabhujam yajnakarmasu nishthitam | namami yajnaphaladam yajnakarmaprabodhakam
    || 9|| ajamilo'pi papatma yannamoccaranadanu | praptavanparamam dhama tam vande lokasakshinam || 10||
    brahmadya api ye deva yanmayapashayantritah | na jananti param bhavam tam vande sarvanayakam || 11||
    hritpadmanilayo'jnanam durastha iva bhati yah | pramanatitasadbhavam tam vande jnanasakshinam || 12||
    yanmukhadbrahmano jato bahubhyah kshatriyo'jani | tathaiva uruto vaishyah padbhyam shudro ajayata
    || 13|| manasashcandrama jato jatah suryashca cakshushah | mukhadindrastathagnishca pranadvayurajayata
    || 14|| tvamindrah pavanah somastvamishanastvamantakah | tvamagnirnirritishcaiva varunastvam divakarah
    || 15|| devashca sthavarashcaiva pishacashcaiva rakshasah | girayah siddhagandharva nadyo bhumishca
    sagarah || 16|| tvameva jagatamisho punnamasti paratparah |
  devanagari: वामनस्तोत्रम् पद्मपुराणान्तर्गतम् श्रीगणेशाय नमः । अदितिरुवाच । नमस्ते देवदेवेश सर्वव्यापिन्
    जनार्दन । सत्त्वादिगुणभेदेन लोकव्यापारकारिणे ॥ १॥ नमस्ते बहुरूपाय अरूपाय नमो नमः । सर्वैकाद्भुतरूपाय
    निर्गुणाय गुणात्मने ॥ २॥ नमस्ते लोकनाथाय परमज्ञानरूपिणे । सद्भक्तजनवात्सल्यशीलिने मङ्गलात्मने ॥ ३॥
    यस्यावताररूपाणि ह्यर्जयन्ति मुनीश्वराः । तमादिपुरुषं देवं नमामीष्टार्थसिद्धये ॥ ४॥ यं न जानन्ति श्रुतयो
    यं न जानन्ति सूरयः । तं नमामि जगद्धेतुं मायिनं तममायिनम् ॥ ५॥ यस्यावलोकनं चित्रं मायोपद्रववारणम् ।
    जगद्रूपं जगत्पालं तं वन्दे पद्मजाधवम् ॥ ६॥ यो देवस्त्यक्तसङ्गानां शान्तानां करुणार्णवः । करोति ह्यात्मना
    सङ्गं तं वन्दे सङ्गवर्जितम् ॥ ७॥ यत्पादाब्जजलक्लिन्नसेवारञ्जितमस्तकाः । अवापुः परमां सिद्धिं तं वन्दे
    सर्ववन्दितम् ॥ ८॥ यज्ञेश्वरं यज्ञभुजं यज्ञकर्मसु निष्ठितम् । नमामि यज्ञफलदं यज्ञकर्मप्रबोधकम् ॥ ९॥
    अजामिलोऽपि पापात्मा यन्नामोच्चारणादनु । प्राप्तवान्परमं धाम तं वन्दे लोकसाक्षिणम् ॥ १०॥ ब्रह्माद्या
    अपि ये देवा यन्मायापाशयन्त्रिताः । न जानन्ति परं भावं तं वन्दे सर्वनायकम् ॥ ११॥ हृत्पद्मनिलयोऽज्ञानां
    दूरस्थ इव भाति यः । प्रमाणातीतसद्भावं तं वन्दे ज्ञानसाक्षिणम् ॥ १२॥ यन्मुखाद्ब्राह्मणो जातो बाहुभ्यः
    क्षत्रियोऽजनि । तथैव ऊरुतो वैश्यः पद्भ्यां शूद्रो अजायत ॥ १३॥ मनसश्चन्द्रमा जातो जातः सूर्यश्च चक्षुषः
    । मुखादिन्द्रस्तथाग्निश्च प्राणाद्वायुरजायत ॥ १४॥ त्वमिन्द्रः पवनः सोमस्त्वमीशानस्त्वमन्तकः । त्वमग्निर्निरृतिश्चैव
    वरुणस्त्वं दिवाकरः ॥ १५॥ देवाश्च स्थावराश्चैव पिशाचाश्चैव राक्षसाः । गिरयः सिद्धगन्धर्वा नद्यो भूमिश्च
    सागराः ॥ १६॥ त्वमेव जगतामीशो पुन्नामास्ति परात्परः ।
