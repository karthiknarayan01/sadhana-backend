id: gajendramokshanah-bhagavatam
category: stotram
name:
  english: gajendramokshanah bhagavatam
  devanagari: गजेन्द्रमोक्षणः भागवतम्
content:
  english: ringaih payonidhim | dishah kham rocayannaste raupyayasahiranmayaih || 2|| anyaishca kakubhah
    sarva ratnadhatuvicitritaih | nanadrumalatagulmairnirghoshairnirjharambhasam || 3|| sa cavanijyamananghrih
    samantatpayaurmibhih | karoti shyamalam bhumim harinmarakatashmabhih || 4|| siddhacaranagandharvavidyadharamahoragaih
    | kinnarairapsarobhishca kridadbhirjushtakandarah || 5|| yatra sangitasannadairnadadguhamamarshaya
    | abhigarjanti harayah shlaghinah parashankaya || 6|| nanaranyapashuvratasankuladronyalankritah |
    citradrumasurodyanakalakanthavihangamah || 7|| saritsarobhiracchodaih pulinairmanivalukaih | devastrimajjanamodasaurabhambvanilairyutah
    || 8|| tasya dronyam bhagavato varunasya mahatmanah | udyanamritumannama akridam surayoshitam || 9||
    sarvato'lankritam divyairnityam pushpaphaladrumaih | mandaraih parijataishca patalashokacampakaih
    || 10|| cutaih priyalaih panasairamrairamratakairapi | kramukairnalikeraishca kharjurairbijapurakaih
    || 11|| madhukaih shalatalaishca tamalairasanarjunaih | arishtodumbaraplakshairvataih kimshukacandanaih
    || 12|| picumandaih kovidaraih saralaih suradarubhih | drakshekshurambhajambubhirbadaryakshabhayamalaih
    || 13|| bilvaih kapitthairjambirairvrito bhallatakadibhih | tasmin sarah suvipulam lasatkancanapankajam
    || 14|| kumudotpalakahlarashatapatrashriyorjitam | mattashatpadanirghushtam shakuntaishca kalasvanaih
    || 15|| hamsakarandavakirnam cakrahvaih sarasairapi | jalakukkutakoyashtidatyuhakulakujitam || 16||
    matsyakacchapasancaracalatpadmarajahpayah | kadambavetasanalanipavanjulakairvritam || 17|| kundaih
    kurabakashokaih shirishaih kutajengudaih | kubjakaih svarnayuthibhirnagapunnagajatibhih || 18|| mallikashatapatraishca
    madhavijalakadibhih | shobhitam tirajaishcanyairnityartubhiralam drumaih || 19|| tatraikada tadgirikananashrayah
    karenubhirvaranayuthapashcaran | sakantakan kicakavenuvetrava
  devanagari: ृङ्गैः पयोनिधिम् । दिशः खं रोचयन्नास्ते रौप्यायसहिरण्मयैः ॥ २॥ अन्यैश्च ककुभः सर्वा रत्नधातुविचित्रितैः
    । नानाद्रुमलतागुल्मैर्निर्घोषैर्निर्झराम्भसाम् ॥ ३॥ स चावनिज्यमानाङ्घ्रिः समन्तात्पयऊर्मिभिः । करोति
    श्यामलां भूमिं हरिण्मरकताश्मभिः ॥ ४॥ सिद्धचारणगन्धर्वविद्याधरमहोरगैः । किन्नरैरप्सरोभिश्च क्रीडद्भिर्जुष्टकन्दरः
    ॥ ५॥ यत्र सङ्गीतसन्नादैर्नदद्गुहममर्षया । अभिगर्जन्ति हरयः श्लाघिनः परशङ्कया ॥ ६॥ नानारण्यपशुव्रातसङ्कुलद्रोण्यलङ्कृतः
    । चित्रद्रुमसुरोद्यानकलकण्ठविहङ्गमः ॥ ७॥ सरित्सरोभिरच्छोदैः पुलिनैर्मणिवालुकैः । देवस्त्रीमज्जनामोदसौरभाम्ब्वनिलैर्युतः
    ॥ ८॥ तस्य द्रोण्यां भगवतो वरुणस्य महात्मनः । उद्यानमृतुमन्नाम आक्रीडं सुरयोषिताम् ॥ ९॥ सर्वतोऽलङ्कृतं
    दिव्यैर्नित्यं पुष्पफलद्रुमैः । मन्दारैः पारिजातैश्च पाटलाशोकचम्पकैः ॥ १०॥ चूतैः प्रियालैः पनसैराम्रैराम्रातकैरपि
    । क्रमुकैर्नालिकेरैश्च खर्जूरैर्बीजपूरकैः ॥ ११॥ मधूकैः शालतालैश्च तमालैरसनार्जुनैः । अरिष्टोदुम्बरप्लक्षैर्वटैः
    किंशुकचन्दनैः ॥ १२॥ पिचुमन्दैः कोविदारैः सरलैः सुरदारुभिः । द्राक्षेक्षुरम्भाजम्बूभिर्बदर्यक्षाभयामलैः
    ॥ १३॥ बिल्वैः कपित्थैर्जम्बीरैर्वृतो भल्लातकादिभिः । तस्मिन् सरः सुविपुलं लसत्काञ्चनपङ्कजम् ॥ १४॥
    कुमुदोत्पलकह्लारशतपत्रश्रियोर्जितम् । मत्तषट्पदनिर्घुष्टं शकुन्तैश्च कलस्वनैः ॥ १५॥ हंसकारण्डवाकीर्णं
    चक्राह्वैः सारसैरपि । जलकुक्कुटकोयष्टिदात्यूहकुलकूजितम् ॥ १६॥ मत्स्यकच्छपसञ्चारचलत्पद्मरजःपयः । कदम्बवेतसनलनीपवञ्जुलकैर्वृतम्
    ॥ १७॥ कुन्दैः कुरबकाशोकैः शिरीषैः कुटजेङ्गुदैः । कुब्जकैः स्वर्णयूथीभिर्नागपुन्नागजातिभिः ॥ १८॥ मल्लिकाशतपत्रैश्च
    माधवीजालकादिभिः । शोभितं तीरजैश्चान्यैर्नित्यर्तुभिरलं द्रुमैः ॥ १९॥ तत्रैकदा तद्गिरिकाननाश्रयः करेणुभिर्वारणयूथपश्चरन्
    । सकण्टकान् कीचकवेणुवेत्रव
