id: ekashlokibhagavata-2
category: ekashloki
name:
  english: ekashlokibhagavata
  devanagari: एकश्लोकिभागवत
content:
  english: ekashloki bhagavatam adau devakidevigarbhajananam gopigrihe vardhanam mayaputanajivitapaharanam
    govardhanoddharanam | kamsacchedanakauravadihananam kumtisutam palanam etadbhagavatam puranakathitam
    shrikrishnalilamritam | iti shribhagavatasutra ||
  devanagari: एकश्लोकी भागवतम् आदौ देवकिदेविगर्भजननं गोपीगृहे वर्धनम् मायापूतनजीवितापहरणं गोवर्धनोद्धारणम्
    । कंसच्छेदनकौरवादिहननं कुंतीसुतां पालनम् एतद्भागवतं पुराणकथितं श्रीकृष्णलीलामृतम् । इति श्रीभागवतसूत्र
    ॥
meaning: {}
