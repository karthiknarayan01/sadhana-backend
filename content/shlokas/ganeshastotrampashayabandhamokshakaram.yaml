id: ganeshastotrampashayabandhamokshakaram
category: stotram
name:
  english: ganeshastotrampashayabandhamokshakaram
  devanagari: गणेशस्तोत्रम्पाशायबन्धमोक्षकरं
content:
  english: pashaya bandhamokshakaram shriganeshastotram || shriganeshaya namah || ahamuvaca | pashaya
    shastrarajaya namaste bandharupine | moksharupaya vai tubhyam ganeshakarabhushana || 1|| moho mayamayah
    prokto bandhadah sarvajantave | ganeshajnanayuktashced bandhahino naro bhavet || 2|| tadeva bandharupakhyam
    shastram tasya mahatmanah | tvameva pasharupam vai bandhamokshakaram mahat || 3|| ye tvam sharanamapannastesham
    te bandhajam bhayam | nasti shastra ca mam pahi sharanagatamadarat || 4|| namaste tejasam natha dushtanashakaraya
    te | pashaya paramastraya shastranam brahmane namah || 5|| evam stutva mahapasham prananama kritanjalih
    | ahankarashca tam tyaktva pasho vighneshvaram yayau || 6||
  devanagari: पाशाय बन्धमोक्षकरं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ अहमुवाच । पाशाय शस्त्रराजाय नमस्ते
    बन्धरूपिणे । मोक्षरूपाय वै तुभ्यं गणेशकरभूषण ॥ १॥ मोहो मायामयः प्रोक्तो बन्धदः सर्वजन्तवे । गणेशज्ञानयुक्तश्चेद्
    बन्धहीनो नरो भवेत् ॥ २॥ तदेव बन्धरूपाख्यं शस्त्रं तस्य महात्मनः । त्वमेव पाशरूपं वै बन्धमोक्षकरं महत्
    ॥ ३॥ ये त्वां शरणमापन्नास्तेषां ते बन्धजं भयम् । नास्ति शस्त्र च मां पाहि शरणागतमादरात् ॥ ४॥ नमस्ते
    तेजसां नाथ दुष्टनाशकराय ते । पाशाय परमास्त्राय शस्त्राणां ब्रह्मणे नमः ॥ ५॥ एवं स्तुत्वा महापाशं प्रणनाम
    कृताञ्जलिः । अहङ्कारश्च तं त्यक्त्वा पाशो विघ्नेश्वरं ययौ ॥ ६॥
