id: ganga-ashtakam-2
category: stotram
name:
  english: Ganga Ashtakam 2
content:
  english: bhagavati bhavalilamaulimale tavambhah kanamanuparimanam pranino ye sprishanti | amaranagaranaricamaragrahininam
    vigatakalikalankatankamanke luthanti || || brahmandam khandayanti harashirasi jatavallimullasayanti
    svarlokadapatanti kanakagiriguhagandashailat skhalanti | kshoniprishte luthanti duritacayacamurnirbharam
    bhartsayanti pathodhim purayanti suranagarasaritpavani nah punatu || || majjanmatangakumbhacyutamadamadiramodamattalijalam
    snanaih siddhangananam kucayugavigalatkunkumasangapingam | sayam pratarmuninam kushakusumacayaishchinnatirasthaniram
    payanno gangamambhah karikaramakarakrantarahastarangam || || adavadipitamahasya niyamavyaparapatre
    jalam pashcatpannagashayino bhagavatah padodakam pavanam | bhuyah shambhujatavibhushanamanirjahnormaharsheriyam
    kanya kalmashanashini bhagavati bhagirathi patu mam || || shailendradavatarini nijajale majjajjanottarini
    paravaraviharini bhavabhayashrenisamutsarini | sheshangairanukarini harashirovallidalakarini kashiprantaviharini
    vijayate ganga manoharini || || kuto vici vicistava yadi gata locanapatham tvamapita pitambarapuravasam
    vitarasi | tvadutsange gange patati yadi kayastanubhritam tada matah shantakratavapadalabho'pyatilaghuh
    || || bhagavati tava tire niramatrashano'ham vigatavishayatrishnah krishnamaradhayami | sakalakalushabhange
    svargasopanasange taralataratarange devi gange prasida || || matarjahnavi shambhusangamilite maulau
    nidhayanjalim tvattire vapusho'vasanasamaye narayananghridvayam | sanandam smarato bhavishyati mama
    pranaprayanotsave bhuyadbhaktiravicyuta hariharadvaitatmika shashvati || || gangashtakamidam punyam
    yah pathetprayato narah | sarvapapavinirmukto vishnulokam sa gacchati || || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau gangashtakam sampurnam |
  devanagari: भगवति भवलीलामौलिमाले तवाम्भः कणमणुपरिमाणं प्राणिनो ये स्पृशन्ति । अमरनगरनारीचामरग्राहिणीनां
    विगतकलिकलङ्कातङ्कमङ्के लुठन्ति ॥ ॥ ब्रह्माण्डं खण्डयन्ती हरशिरसि जटावल्लिमुल्लासयन्ती स्वर्लोकादापतन्ती
    कनकगिरिगुहागण्डशैलात् स्खलन्ती । क्षोणीपृष्टे लुठन्ती दुरितचयचमूर्निर्भरं भर्त्सयन्ती पाथोधिं पूरयन्ती
    सुरनगरसरित्पावनी नः पुनातु ॥ ॥ मज्जन्मातङ्गकुम्भच्युतमदमदिरामोदमत्तालिजालं स्नानैः सिद्धाङ्गनानां
    कुचयुगविगलत्कुङ्कुमासङ्गपिङ्गम् । सायं प्रातर्मुनीनां कुशकुसुमचयैश्छिन्नतीरस्थनीरं पायान्नो गाङ्गमम्भः
    करिकरमकराक्रान्तरहस्तरङ्गम् ॥ ॥ आदावादिपितामहस्य नियमव्यापारपात्रे जलं पश्चात्पन्नगशायिनो भगवतः पादोदकं
    पावनम् । भूयः शम्भुजटाविभूषणमणिर्जह्नोर्महर्षेरियं कन्या कल्मषनाशिनी भगवती भागीरथी पातु माम् ॥ ॥ शैलेन्द्रादवतारिणी
    निजजले मज्जज्जनोत्तारिणी पारावारविहारिणी भवभयश्रेणीसमुत्सारिणी । शेषाङ्गैरनुकारिणी हरशिरोवल्लीदलाकारिणी
    काशीप्रान्तविहारिणी विजयते गङ्गा मनोहारिणी ॥ ॥ कुतो वीची वीचिस्तव यदि गता लोचनपथं त्वमापीता पीताम्बरपुरवासं
    वितरसि । त्वदुत्सङ्गे गङ्गे पतति यदि कायस्तनुभृतां तदा मातः शान्तक्रतवपदलाभोऽप्यतिलघुः ॥ ॥ भगवति तव
    तीरे नीरमात्राशनोऽहं विगतविषयतृष्णः कृष्णमाराधयामि । सकलकलुषभङ्गे स्वर्गसोपानसङ्गे तरलतरतरङ्गे देवि
    गङ्गे प्रसीद ॥ ॥ मातर्जाह्नवि शम्भुसङ्गमिलिते मौलौ निधायाञ्जलिं त्वत्तीरे वपुषोऽवसानसमये नारायणाङ्घ्रिद्वयम्
    । सानन्दं स्मरतो भविष्यति मम प्राणप्रयाणोत्सवे भूयाद्भक्तिरविच्युता हरिहराद्वैतात्मिका शाश्वती ॥ ॥
    गङ्गाष्टकमिदं पुण्यं यः पठेत्प्रयतो नरः । सर्वपापविनिर्मुक्तो विष्णुलोकं स गच्छति ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ गङ्गाष्टकं सम्पूर्णम् ।
