id: devi-mahatmyam-navaavarna-vidhi
category: stotram
name:
  english: Devi Mahatmyam Navaavarna Vidhi
content:
  english: shriganapatirjayati | om asya shrinavavarnamantrasya brahmavishnurudra rishayah gayatryushniganushtubhashchandamsi
    shrimahakalimahalakshmimahasarasvatyo devatah shrimahakalimahalakshmimahasarasvatiprityarthe jape
    viniyogah|| rishyadinyasah brahmavishnurudra rishibhyo namah mukhe | mahakalimahalakshmimahasarasvatidevatabhyo
    namah guhye | hrim shaktaye namah padayoh | klim kilakaya namah nabhau | om aim hrim klim camundayai
    vicce iti mulena karau samshodhya karanyasah om aim angushthabhyam namah | om hrim tarjanibhyam namah
    | om klim madhyamabhyam namah | om camundayai anamikabhyam namah | om vicce kanishthikabhyam namah
    | om aim hrim klim camundayai vicce karatalakaraprishthabhyam namah | hridayadinyasah om aim hridayaya
    namah | om hrim shirase svaha | om klim shikhayai vashat | om camundayai kavacaya hum | om vicce netratrayaya
    vaushat | om aim hrim klim camundayai vicce astraya phat | aksharanyasah om aim namah shikhayam |
    om hrim namah dakshinanetre | om klim namah vamanetre | om cam namah dakshinakarne | om mum namah
    vamakarne | om dam namah dakshinanasapute | om yaim namah vamanasapute | om vim namah guhye | evam
    vinyasyashtavaram mulena vyapakam kuryat | dinnyasah om aim pracyai namah | om aim agneyyai namah
    | om hrim dakshinayai namah | om hrim nai rityai namah | om klim paticyai namah | om klim vayuvyai
    namah | om camundayai udicyai namah | om camundayai aishanyai namah | om aim hrim klim camundayai
    vicce urdhvayai namah | om aim hrim klim camundayai vicce bhumyai namah | dhyanam om khadgam cakragadeshucapaparighanchulam
    bhushundim shirah shankham sandadhatim karaistrinayanam sarvangabhushavritam | nilashmadyutimasyapadadashakam
    seve mahakalikam yamastautsvapite harau kamalajo hantum madhum kautabham || om akshasrakparashu gadeshukulisham
    padmam dhanuh kundikam dandam shaktimasim ca carma jalajam ghantam surabhajanam | shulam pashasudarshane
    ca dadhatim hastaih pravalaprabham seve sairibhamardinimiha mahalakshmim sarojasthitam || om ghantashulahalani
    shankhamusale cakram dhanuh sayakam | hastabjairdhadhatim ghanantavilasacchitamshutulyaprabham | gauridehasamudbhavam
    trijagatadharabhutam maha | purvamatra sarasvatimanubhaje shumbhadidaityardhinim || om mam malem mahamaye
    sarvashaktisvarupini | caturvargastvayi nyastastasmanme siddhida bhava || om avighnam kuru male tvam
    grihnami dakshine kare | japakale ca siddhyartham prasida mamasiddhaye || aim hrim akshamalikayai
    namah || || om mam malem mahamaye sarvashaktisvarupini | caturvargastvayi nyastastasmanme siddhida
    bhava || om avighnam kuru male tvam grihnami dakshine kare | japakale ca siddhyartham prasida mamasiddhaye
    || om akshamaladhipataye susiddhim dehi dehi sarvamantrarthasadhini sadhaya sadhaya sarvasiddhim parikalpaya
    parikalpaya me svaha | om aim hrim klim camundayai vicce || || guhyatiguhyagoptri tvam grihanasmatkritam
    japam | siddhirbhavatu me devi tvatprasadanmaheshvari || om akshamaladhipataye susiddhim dehi dehi
    sarvamantrarthasadhini sadhaya sadhaya sarvasiddhim parikalpaya parikalpaya me svaha | guhyatiguhyagoptri
    tvam grihanasmatkritam japam | siddhirbhavatu me devi tvatprasadanmaheshvari || karanyasah om hrim
    angushthabhyam namah | om cam tarjanibhyam namah | om dim madhyamabhyam namah | om kam anamikabhyam
    namah | om yaim kanishthikabhyam namah | om hrim candikayai karatalakaraprishthabhyam namah | hridayadinyasah
    khadgini shulini ghora gadini cakrini tatha | shankhini capini banabhushundi paighayudha | hridayaya
    namah || om shulena pahi no devi pahi khadgena cambike | ghantasvanena nah pahi capajyanihsvanena
    ca | shirase svaha || om pracyam raksha pratincyam ca raksha candike raksha dakshine | bhramanenatmashulasya
    uttarasyam tatheshvari | shikhayai vashat || om saumyani yani rupani trailokye vicaranti te | yani
    catyarthaghorani tai rakshasmamstatha bhuvam | kavacaya hum || om khadgashulagadadini yanicastrani
    te'mbike | karapallava sangini tairasman raksha sarvatah | netratrayaya vaushat || om sarvasvarupe
    sarveshe sarvashaktisamanvite | bhayebhyastrahi no devi durge namo'stute | astraya phat || dhyanam
    om vidyuddamaprabham mrigapatiskandhasthitam bhishanam | kanyabhih karavalakhetavilasaddhastabhirasevitam
    | hastaishcakragadasikhetavishikhamshcapam gunam tarjanim | bibhranamanalatmikam shashidharam durgam
    trinetram bhaje ||
  devanagari: श्रीगणपतिर्जयति । ॐ अस्य श्रीनवावर्णमन्त्रस्य ब्रह्मविष्णुरुद्रा ऋषयः गायत्र्युष्णिगनुष्टुभश्छन्दांसि
    श्रीमहाकालीमाहालक्ष्मीमहासरस्वत्यो देवताः श्रीमहाकालीमाहालक्ष्मीमहासरस्वतीप्रीत्यर्थे जपे विनियोगः॥
    ऋष्यादिन्यासः ब्रह्मविष्णुरुद्रा ऋषिभ्यो नमः मुखे । महाकालीमाहालक्ष्मीमहासरस्वतीदेवताभ्यो नमः गुह्ये
    । ह्रीं शक्तये नमः पादयोः । क्लीं कीलकाय नमः नाभौ । ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे इति मूलेन करौ
    संशोध्य करन्यासः ॐ ऐं अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां नमः । ॐ क्लीं मध्यमाभ्यां नमः । ॐ चामुण्डायै
    अनामिकाभ्यां नमः । ॐ विच्चे कनिष्ठिकाभ्यां नमः । ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे करतलकरपृष्ठाभ्यां
    नमः । हृदयादिन्यासः ॐ ऐं हृदयाय नमः । ॐ ह्रीं शिरसे स्वाह । ॐ क्लीं शिखायै वषट् । ॐ चामुण्डायै कवचाय
    हुम् । ॐ विच्चे नेत्रत्रयाय वौषट् । ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे अस्त्राय फट् । अक्षरन्यासः
    ॐ ऐं नमः शिखायाम् । ॐ ह्रीं नमः दक्षिणनेत्रे । ॐ क्लीं नमः वामनेत्रे । ॐ चां नमः दक्षिणकर्णे । ॐ मुं
    नमः वामकर्णे । ॐ डां नमः दक्षिणनासापुटे । ॐ यैं नमः वामनासापुटे । ॐ विं नमः गुह्ये । एवं विन्यस्याष्टवारं
    मूलेन व्यापकं कुर्यात् । दिङ्न्यासः ॐ ऐं प्राच्यै नमः । ॐ ऐं आग्नेय्यै नमः । ॐ ह्रीं दक्षिणायै नमः
    । ॐ ह्रीं नै ऋत्यै नमः । ॐ क्लीं पतीच्यै नमः । ॐ क्लीं वायुव्यै नमः । ॐ चामुण्डायै उदीच्यै नमः । ॐ
    चामुण्डायै ऐशान्यै नमः । ॐ ऐं ह्रीं क्लीं चामुण्डायै विच्चे ऊर्ध्वायै नमः । ॐ ऐं ह्रीं क्लीं चामुण्डायै
    विच्चे भूम्यै नमः । ध्यानम् ॐ खड्गं चक्रगदेषुचापपरिघाञ्छूलं भुशुण्डीं शिरः शङ्खं सन्दधतीं करैस्त्रिनयनां
    सर्वाङ्गभूषावृताम् । नीलाश्मद्युतिमास्यपाददशकां सेवे महाकालिकां यामस्तौत्स्वपिते हरौ कमलजो हन्तुं
    मधुं कौटभम् ॥ ॐ अक्षस्रक्परशू गदेषुकुलिशं पद्मं धनुः कुण्डिकां दण्डं शक्तिमसिं च चर्म जलजं घण्टां
    सुराभाजनम् । शूलं पाशसुदर्शने च दधतीं हस्तैः प्रवालप्रभां सेवे सैरिभमर्दिनीमिह महालक्ष्मीं सरोजस्थिताम्
    ॥ ॐ घण्टाशूलहलानि शङ्खमुसले चक्रं धनुः सायकम् । हस्ताब्जैर्धधतीं घनान्तविलसच्छीतांशुतुल्यप्रभाम् ।
    गौरीदेहसमुद्भवां त्रिजगताधारभूतां महा । पूर्वामत्र सरस्वतीमनुभजे शुम्भादिदैत्यार्धिनीम् ॥ ॐ मां मालें
    महामाये सर्वशक्तिस्वरूपिणि । चतुर्वर्गस्त्वयि न्यस्तस्तस्मान्मे सिद्धिदा भव ॥ ॐ अविघ्नं कुरु माले
    त्वं गृह्णामि दक्षिणे करे । जपकाले च सिद्ध्यर्थं प्रसीद ममसिद्धये ॥ ऐं ह्रीं अक्षमालिकायै नमः ॥ ॥
    ॐ मां मालें महामाये सर्वशक्तिस्वरूपिणि । चतुर्वर्गस्त्वयि न्यस्तस्तस्मान्मे सिद्धिदा भव ॥ ॐ अविघ्नं
    कुरु माले त्वं गृह्णामि दक्षिणे करे । जपकाले च सिद्ध्यर्थं प्रसीद ममसिद्धये ॥ ॐ अक्षमालाधिपतये सुसिद्धिं
    देहि देहि सर्वमन्त्रार्थसाधिनि साधय साधय सर्वसिद्धिं परिकल्पय परिकल्पय मे स्वाहा । ॐ ऐं ह्रीं क्लीं
    चामुण्डायै विच्चे ॥ ॥ गुह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान्महेश्वरि
    ॥ ॐ अक्षमालाधिपतये सुसिद्धिं देहि देहि सर्वमन्त्रार्थसाधिनि साधय साधय सर्वसिद्धिं परिकल्पय परिकल्पय
    मे स्वाहा । गुह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान्महेश्वरि
    ॥ करन्यासः ॐ ह्रीं अङ्गुष्ठाभ्यां नमः । ॐ चं तर्जनीभ्यां नमः । ॐ डिं मध्यमाभ्यां नमः । ॐ कां अनामिकाभ्यां
    नमः । ॐ यैं कनिष्ठिकाभ्यां नमः । ॐ ह्रीं चण्डिकायै करतलकरपृष्ठाभ्यां नमः । हृदयादिन्यासः खड्गिनी शूलिनी
    घोरा गदिनी चक्रिणी तथा । शङ्खिनी चापिनी बाणभुशुण्डी पैघायुधा । हृदयाय नमः ॥ ॐ शूलेन पाहि नो देवि पाहि
    खड्गेन चाम्बिके । घण्टास्वनेन नः पाहि चापज्यानिःस्वनेन च । शिरसे स्वाहा ॥ ॐ प्राच्यां रक्ष प्रतीञ्च्यां
    च रक्ष चण्डिके रक्ष दक्षिणे । भ्रामणेनात्मशूलस्य उत्तरस्यां तथेश्वरि । शिखायै वषट् ॥ ॐ सौम्यानि यानि
    रूपाणि त्रैलोक्ये विचरन्ति ते । यानि चात्यर्थघोराणि तै रक्षास्मांस्तथा भुवम् । कवचाय हुम् ॥ ॐ खड्गशूलगदादीनि
    यानिचास्त्राणि तेऽम्बिके । करपल्लव सङ्गीनि तैरस्मान् रक्ष सर्वतः । नेत्रत्रयाय वौषट् ॥ ॐ सर्वस्वरूपे
    सर्वेशे सर्वशक्तिसमन्विते । भयेभ्यस्त्राहि नो देवि दुर्गे नमोऽस्तुते । अस्त्राय फट् ॥ ध्यानम् ॐ विद्युद्दामप्रभां
    मृगपतिस्कन्धस्थितां भीषणाम् । कन्याभिः करवालखेटविलसद्धस्ताभिरासेविताम् । हस्तैश्चक्रगदासिखेटविशिखांश्चापं
    गुणं तर्जनीम् । बिभ्राणामनलात्मिकां शशिधरां दुर्गां त्रिनेत्रां भजे ॥
