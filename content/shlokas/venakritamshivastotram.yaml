id: venakritamshivastotram
category: stotram
name:
  english: venakritamshivastotram
  devanagari: वेनकृतंशिवस्तोत्रम्
content:
  english: rigalaya tarakaya taraya ca || 94|| namo yajnaya yajine hutaya prahutaya ca | yajnavahaya havyaya
    tapyaya tapanaya ca || 95|| namastu payase tubhyam tundanam pataye namah | annadayannapataye namo
    nanannabhojine || 96|| namah sahasrashirshaya sahasracaranaya ca | sahasrodyatashulaya sahasrabharanaya
    ca || 97|| balanucaragoptre ca balalilavilasine | namo balaya vriddhaya kshubdhaya kshobhanaya ca
    || 98|| gangalulitakeshaya munjakeshaya vai namah | namah shatkarmatushtaya trikarmanirataya ca ||
    99|| nagnapranaya candaya krishaya sphotanaya ca | dharmarthakamamokshanam kathyaya kathanaya ca ||
    100|| sankhyaya sankhyamukhyaya sankhyayogamukhaya ca | namo viratharathyaya catushpatharathaya ca
    || 101|| krishnajinottariyaya vyalayajnopavitine | vaktrasandhanakeshaya harikesha namo'stu te | tryambikambikanathaya
    vyaktavyaktaya vedhase || 102|| kamakamadakamaghna triptatriptavicarine | namah sarvada papaghna kalpasankhyavicarine
    || 103|| mahasattva mahabaho mahabala namo'stu te | mahamegha mahaprakhya mahakala mahadyute || 104||
    meghavarta yugavarta candrarkapataye namah | tvamannamannabhokta ca pakvabhuk pavanottamah || 105||
    jarayujandajashcaiva svedajodbhidajashca ye | tvameva devadevesha bhutagramashcaturvidhah || 106||
    srashta caracarasyasya pata hanta tathaiva ca | tvamahurbrahma vidvamso brahma brahmavidam gatim ||
    107|| manasah paramajyotistvam vayurjyotishamapi | hamsavrikshe madhukaramahustvam brahmavadinah ||
    108|| yajurmayo rinmayastvamahuh samamayastatha | pathyase stutibhirnityam vedopanishadam ganaih ||
    109|| brahmanah kshatriya vaishyah shudra varnavarashca ye | tvameva meghasanghashca vidyuto'shanigarjitam
    || 110|| samvatsarastvamritavo maso masardhameva ca | yuga nimeshah kashthashca nakshatrani grahah
    kalah || 111|| vrikshanam kakubho'si tvam girinam himavan girih | vyaghro mriganam patatam tarkshyo'nantashca
    bhoginam || 112|| kshirodo'syudadhinam ca yantranam dhanureva ca | vajram praharananam ca vratanam
    satyameva ca || 113|| tvameva dvesha iccha ca rago mohah kshamakshame | vyavasayo dhritirlobhah kamakrodhau
    jayajayau || 114|| tvam shari tvam gadi capi khatvangi ca sharasani | chetta metta prahartasi manta
    neta sanatanah || 115|| dashalakshanasamyukto dharmo'rthah kama eva ca | samudrah sarito ganga parvatashca
    saramsi ca || 116|| latavallyastrinaushadhyah pashavo mrigapakshinah | dravyakarmagunarambhah kalapushpaphalapradah
    || 117|| adishcantashca vedanam gayatri pranavastatha | lohito harito nilah krishnah pitah sitastatha
    || 118|| kadrushca kapilashcaiva kapoto mecakastatha | savarnashcapyavarnashca karta harta tvameva
    hi || 119|| tvamindrashca yamashcaiva varuno dhanado'nilah | upaplavashcitrabhanuh svarbhanurbhanureva
    ca || 120|| shikshahautram trisauparnam yajusham shatarudriyam | pavitram ca pavitranam mangalanam
    ca mangalam || 121|| tinduko girijo vriksho mudgam cakhilajivanam | pranah sattvam rajashcaiva tamashca
    pratipatpatih || 122|| prano'panah samanashca udano vyana eva ca | unmeshashca nimeshashca kshutam
    jrimbhitameva ca || 123|| lohitantargato drishtirmahavaktro mahodarah | shuciroma harishmashrururdhvakeshashcalacalah
    || 124|| gitavaditranrityajno gitavaditrakapriyah | matsyo jalo jalaukashca kalah kelikala kalih ||
    125|| akalashca vikalashca dushkalah kala eva ca | mrityushca mrityukarta ca yaksho yakshabhayankarah
    || 126|| samvartako'ntakashcaiva samvartakabalahakah | ghanto ghanti mahaghanti ciri mali ca matalih
    || 127|| brahmakalayamagninam dandi mundi trimundadhrik | caturyugashcaturvedashcaturhotrapravartakah
    || 128|| caturashramyaneta ca caturvarnyakarastatha | nityamakshapriyo dhurto ganadhyaksho ganadhipah
    || 129|| raktamalyambaradharo giriko girikapriyah | shilpam ca shilpinam shreshthah sarvashilpapravartakah
    || 130|| bhaganetrankushashcandah pushno dantavinashanah | svaha svadha vashatkaro namaskaro namo
    namah || 131|| gudhavrato guhyatapastarakastarakamayah | dhata vidhata sandhata prithivya dharano'parah
    || 132|| brahma tapashca satyam ca vratacaryamatharjavam | bhutatma bhutakridbhutirbhutabhavyabhavodbhavah
    || 133|| bhurbhuvah svarritam caiva dhruvo danto maheshvarah | dikshito'dikshitah kanto durdanto dantasambhavah
    || 134|| candravarto yugavartah samvartakapravartakah | binduh kamo hyanuh sthulah karnikarasrajapriyah
    || 135|| nandimukho bhimamukhah sumukho durmukhastatha | hiranyagarbhah shakunirmahoragapatirvirat
    || 136|| adharmaha mahadevo dandadharo ganotkatah | gonardo gopratarashca govrisheshvaravahanah ||
    137|| trailokyagopta govindo gomargo marga eva ca | sthirah shreshthashca sthanushca vikroshah krosha
    eva ca || 138|| durvarano durvishaho duhsaho duratikramah | durddharsho dushprakashashca durdursho
    durjayo jayah || 139|| shashankanalashitoshnah kshuttrishna ca niramayah | adhayo vyadhayashcaiva
    vyadhiha vyadhinashanah || 140|| samuhashca samuhasya hanta devah sanatanah | shikhandi pundarikakshah
    pundarikavanalayah || 141|| tryambako dandadharashca ugradamshtrah kulantakah | vishapahah surashreshthah
    somapastvam marutpate | amritashi jagannatho devadevo ganeshvarah || 142|| madhushcyutanam madhupo
    brahmavak tvam ghritacyutah | sarvalokasya bhokta tvam sarvalokapitamahah || 143|| hiranyaretah purushastvamekah
    tvam stri pumamstvam hi napumsakam ca | balo yuva sthaviro devadamshtra tvanno girirvishvakridvishvaharta
    || 144|| tvam vai dhata vishvakritam varenyastvam pujayanti pranatah sadaiva | candradityau cakshushi
    te bhavan hi tvameva cagnih prapitamahashca | aradhya tvam sarasvatim vaglabhante ahoratre nimishonmeshakarta
    || 145|| na brahma na ca govindah paurana rishayo na te | mahatmyam veditum shakta yathatathyena shankara
    || 146|| pumsam shatasahasrani yatsamavritya tishthati | mahatastamasah pare gopta manta bhavan sada
    || 147|| yam vinidra jitashvasah sattvasthah samyatendriyah | jyotih pashyanti yunjanastasmai yogatmane
    namah || 148|| ya murtayashca sukshmaste na shakya ya nidarshitum | tabhirmam satatam raksha pita
    putramivaurasam || 149|| raksha mam rakshaniyo'ham tavanagha namo'stu te | bhaktanukampi bhagavan
    bhaktashcaham sada tvayi || 150|| jatine dandine nityam lambodarasharirine | kamandalunishangaya tasmai
    rudratmane namah || 151|| yasya kesheshu jimuta nadyah sarvangasandhishu | kukshau samudrashcatvarastasmai
    toyatmane namah || 152|| sambhakshya sarvabhutani yugante paryupasthite | yah shete jalamadhyasthastam
    prapadye'mbushayinam || 153|| pravishya vadanam rahoryah somam pibate nishi | grasatyarkam ca svarbhanu
    rakshitastava tejasa || 154|| ye catra patita garbha rudra gandhasya rakshane | namaste'stu svadha
    svaha prapnuvanti tadadbhute || 155|| ye'ngushthamatrah purusha dehasthah sarvadehinam | rakshantu
    te hi mam nityam te mamapyayayantu vai || 156|| ye nadishu samudreshu parvateshu guhasu ca | vrikshamuleshu
    goshtheshu kantaragahaneshu ca || 157|| catushpatheshu rathyasu catvareshu sabhasu ca | hastyashvarathashalasu
    jirnodyanalayeshu ca || 158|| ye ca pancasu bhuteshu dishasu vidishasu ca | candrarkayormadhyagata
    ye ca candrarkarashmishu || 159|| rasatalagata ye ca ye ca tasmat param gatah | namastebhyo namastebhyo
    namastebhyashca nityashah || 160|| yesham na vidyate sankhya pramanam rupameva ca | asankhyeyagana
    rudra namastebhyo'stu nityashah || 161|| prasida mama bhadram te tava bhavagatasya ca | tvayi me hridayam
    deva tvayi buddhirmatistvayi || 162|| stutvaivam sa mahadevam virarama dvijottamah || 163|| iti shrivamanapurane
    saptacatvarimshattamadhyayantargatam venakritam shivastotram samaptam | vamanapurana | adhyaya 47
  devanagari: ृगालाय तारकाय तराय च ॥ ९४॥ नमो यज्ञाय यजिने हुताय प्रहुताय च । यज्ञवाहाय हव्याय तप्याय तपनाय
    च ॥ ९५॥ नमस्तु पयसे तुभ्यं तुण्डानां पतये नमः । अन्नदायान्नपतये नमो नानान्नभोजिने ॥ ९६॥ नमः सहस्रशीर्षाय
    सहस्रचरणाय च । सहस्रोद्यतशूलाय सहस्राभरणाय च ॥ ९७॥ बालानुचरगोप्त्रे च बाललीलाविलासिने । नमो बालाय
    वृद्धाय क्षुब्धाय क्षोभणाय च ॥ ९८॥ गङ्गालुलितकेशाय मुञ्जकेशाय वै नमः । नमः षट्कर्मतुष्टाय त्रिकर्मनिरताय
    च ॥ ९९॥ नग्नप्राणाय चण्डाय कृशाय स्फोटनाय च । धर्मार्थकाममोक्षाणां कथ्याय कथनाय च ॥ १००॥ साङ्ख्याय
    साङ्ख्यमुख्याय साङ्ख्ययोगमुखाय च । नमो विरथरथ्याय चतुष्पथरथाय च ॥ १०१॥ कृष्णाजिनोत्तरीयाय व्यालयज्ञोपवीतिने
    । वक्त्रसन्धानकेशाय हरिकेश नमोऽस्तु ते । त्र्यम्बिकाम्बिकनाथाय व्यक्ताव्यक्ताय वेधसे ॥ १०२॥ कामकामदकामघ्न
    तृप्तातृप्तविचारिणे । नमः सर्वद पापघ्न कल्पसङ्ख्याविचारिणे ॥ १०३॥ महासत्त्व महाबाहो महाबल नमोऽस्तु
    ते । महामेघ महाप्रख्य महाकाल महाद्युते ॥ १०४॥ मेघावर्त युगावर्त चन्द्रार्कपतये नमः । त्वमन्नमन्नभोक्ता
    च पक्वभुक् पावनोत्तमः ॥ १०५॥ जरायुजाण्डजाश्चैव स्वेदजोद्भिदजाश्च ये । त्वमेव देवदेवेश भूतग्रामश्चतुर्विधः
    ॥ १०६॥ स्रष्टा चराचरस्यास्य पाता हन्ता तथैव च । त्वामाहुर्ब्रह्म विद्वांसो ब्रह्म ब्रह्मविदां गतिम्
    ॥ १०७॥ मनसः परमज्योतिस्त्वं वायुर्ज्योतिषामपि । हंसवृक्षे मधुकरमाहुस्त्वां ब्रह्मवादिनः ॥ १०८॥ यजुर्मयो
    ऋङ्मयस्त्वामाहुः साममयस्तथा । पठ्यसे स्तुतिभिर्नित्यं वेदोपनिषदां गणैः ॥ १०९॥ ब्राह्मणाः क्षत्रिया
    वैश्याः शूद्रा वर्णावराश्च ये । त्वमेव मेघसङ्घाश्च विद्युतोऽशनिगर्जितम् ॥ ११०॥ संवत्सरस्त्वमृतवो मासो
    मासार्धमेव च । युगा निमेषाः काष्ठाश्च नक्षत्राणि ग्रहाः कलाः ॥ १११॥ वृक्षाणां ककुभोऽसि त्वं गिरीणां
    हिमवान् गिरिः । व्याघ्रो मृगाणां पततां तार्क्ष्योऽनन्तश्च भोगिनाम् ॥ ११२॥ क्षिरोदोऽस्युदधीनां च यन्त्राणां
    धनुरेव च । वज्रं प्रहरणानां च व्रतानां सत्यमेव च ॥ ११३॥ त्वमेव द्वेष इच्छा च रागो मोहः क्षमाक्षमे
    । व्यवसायो धृतिर्लोभः कामक्रोधौ जयाजयौ ॥ ११४॥ त्वं शरी त्वं गदी चापी खट्वाङ्गी च शरासनी । छेत्ता मेत्ता
    प्रहर्तासि मन्ता नेता सनातनः ॥ ११५॥ दशलक्षणसंयुक्तो धर्मोऽर्थः काम एव च । समुद्राः सरितो गङ्गा पर्वताश्च
    सरांसि च ॥ ११६॥ लतावल्ल्यस्तृणौषध्यः पशवो मृगपक्षिणः । द्रव्यकर्मगुणारम्भः कालपुष्पफलप्रदः ॥ ११७॥
    आदिश्चान्तश्च वेदानां गायत्री प्रणवस्तथा । लोहितो हरितो नीलः कृष्णः पीतः सितस्तथा ॥ ११८॥ कद्रुश्च
    कपिलश्चैव कपोतो मेचकस्तथा । सवर्णश्चाप्यवर्णाश्च कर्ता हर्ता त्वमेव हि ॥ ११९॥ त्वमिन्द्रश्च यमश्चैव
    वरुणो धनदोऽनिलः । उपप्लवश्चित्रभानुः स्वर्भानुर्भानुरेव च ॥ १२०॥ शिक्षाहौत्रं त्रिसौपर्णं यजुषां शतरुद्रियम्
    । पवित्रं च पवित्राणां मङ्गलानां च मङ्गलम् ॥ १२१॥ तिन्दुको गिरिजो वृक्षो मुद्गं चाखिलजीवनम् । प्राणाः
    सत्त्वं रजश्चैव तमश्च प्रतिपत्पतिः ॥ १२२॥ प्राणोऽपानः समानश्च उदानो व्यान एव च । उन्मेषश्च निमेषश्च
    क्षुतं जृम्भितमेव च ॥ १२३॥ लोहितान्तर्गतो दृष्टिर्महावक्त्रो महोदरः । शुचिरोमा हरिश्मश्रुरूर्ध्वकेशश्चलाचलः
    ॥ १२४॥ गीतवादित्रनृत्यज्ञो गीतवादित्रकप्रियः । मत्स्यो जालो जलौकाश्च कालः केलिकला कलिः ॥ १२५॥ अकालश्च
    विकालश्च दुष्कालः काल एव च । मृत्युश्च मृत्युकर्ता च यक्षो यक्षभयङ्करः ॥ १२६॥ संवर्तकोऽन्तकश्चैव संवर्तकबलाहकः
    । घण्टो घण्टी महाघण्टी चिरी माली च मातलिः ॥ १२७॥ ब्रह्मकालयमाग्नीनां दण्डी मुण्डी त्रिमुण्डधृक् ।
    चतुर्युगश्चतुर्वेदश्चातुर्होत्रप्रवर्तकः ॥ १२८॥ चातुराश्रम्यनेता च चातुर्वर्ण्यकरस्तथा । नित्यमक्षप्रियो
    धूर्तो गणाध्यक्षो गणाधिपः ॥ १२९॥ रक्तमाल्याम्बरधरो गिरिको गिरिकप्रियः । शिल्पं च शिल्पिनां श्रेष्ठः
    सर्वशिल्पप्रवर्तकः ॥ १३०॥ भगनेत्राङ्कुशश्चण्डः पूष्णो दन्तविनाशनः । स्वाहा स्वधा वषट्कारो नमस्कारो
    नमो नमः ॥ १३१॥ गूढव्रतो गुह्यतपास्तारकास्तारकामयः । धाता विधाता सन्धाता पृथिव्या धरणोऽपरः ॥ १३२॥ ब्रह्मा
    तपश्च सत्यं च व्रतचर्यमथार्जवम् । भूतात्मा भूतकृद्भूतिर्भूतभव्यभवोद्भवः ॥ १३३॥ भूर्भुवः स्वरृतं चैव
    ध्रुवो दान्तो महेश्वरः । दीक्षितोऽदीक्षितः कान्तो दुर्दान्तो दान्तसम्भवः ॥ १३४॥ चन्द्रावर्तो युगावर्तः
    संवर्तकप्रवर्तकः । बिन्दुः कामो ह्यणुः स्थूलः कर्णिकारस्रजप्रियः ॥ १३५॥ नन्दीमुखो भीममुखः सुमुखो दुर्मुखस्तथा
    । हिरण्यगर्भः शकुनिर्महोरगपतिर्विराट् ॥ १३६॥ अधर्महा महादेवो दण्डधारो गणोत्कटः । गोनर्दो गोप्रतारश्च
    गोवृषेश्वरवाहनः ॥ १३७॥ त्रैलोक्यगोप्ता गोविन्दो गोमार्गो मार्ग एव च । स्थिरः श्रेष्ठश्च स्थाणुश्च
    विक्रोशः क्रोश एव च ॥ १३८॥ दुर्वारणो दुर्विषहो दुःसहो दुरतिक्रमः । दुर्द्धर्षो दुष्प्रकाशश्च दुर्दुर्शो
    दुर्जयो जयः ॥ १३९॥ शशाङ्कानलशीतोष्णः क्षुत्तृष्णा च निरामयः । आधयो व्याधयश्चैव व्याधिहा व्याधिनाशनः
    ॥ १४०॥ समूहश्च समूहस्य हन्ता देवः सनातनः । शिखण्डी पुण्डरीकाक्षः पुण्डरीकवनालयः ॥ १४१॥ त्र्यम्बको
    दण्डधारश्च उग्रदंष्ट्रः कुलान्तकः । विषापहः सुरश्रेष्ठः सोमपास्त्वं मरुत्पते । अमृताशी जगन्नाथो देवदेवो
    गणेश्वरः ॥ १४२॥ मधुश्च्युतानां मधुपो ब्रह्मवाक् त्वं घृतच्युतः । सर्वलोकस्य भोक्ता त्वं सर्वलोकपितामहः
    ॥ १४३॥ हिरण्यरेताः पुरुषस्त्वमेकः त्वं स्त्री पुमांस्त्वं हि नपुंसकं च । बालो युवा स्थविरो देवदंष्ट्रा
    त्वन्नो गिरिर्विश्वकृद्विश्वहर्ता ॥ १४४॥ त्वं वै धाता विश्वकृतां वरेण्यस्त्वां पूजयन्ति प्रणताः सदैव
    । चन्द्रादित्यौ चक्षुषी ते भवान् हि त्वमेव चाग्निः प्रपितामहश्च । आराध्य त्वां सरस्वतीं वाग्लभन्ते
    अहोरात्रे निमिषोन्मेषकर्ता ॥ १४५॥ न ब्रह्मा न च गोविन्दः पौराणा ऋषयो न ते । माहात्म्यं वेदितुं शक्ता
    याथातथ्येन शङ्कर ॥ १४६॥ पुंसां शतसहस्राणि यत्समावृत्य तिष्ठति । महतस्तमसः पारे गोप्ता मन्ता भवान्
    सदा ॥ १४७॥ यं विनिद्रा जितश्वासाः सत्त्वस्थाः संयतेन्द्रियाः । ज्योतिः पश्यन्ति युञ्जानास्तस्मै योगात्मने
    नमः ॥ १४८॥ या मूर्तयश्च सूक्ष्मास्ते न शक्या या निदर्शितुम् । ताभिर्मां सततं रक्ष पिता पुत्रमिवौरसम्
    ॥ १४९॥ रक्ष मां रक्षणीयोऽहं तवानघ नमोऽस्तु ते । भक्तानुकम्पी भगवान् भक्तश्चाहं सदा त्वयि ॥ १५०॥ जटिने
    दण्डिने नित्यं लम्बोदरशरीरिणे । कमण्डलुनिषङ्गाय तस्मै रुद्रात्मने नमः ॥ १५१॥ यस्य केशेषु जीमूता नद्यः
    सर्वाङ्गसन्धिषु । कुक्षौ समुद्राश्चत्वारस्तस्मै तोयात्मने नमः ॥ १५२॥ सम्भक्ष्य सर्वभूतानि युगान्ते
    पर्युपस्थिते । यः शेते जलमध्यस्थस्तं प्रपद्येऽम्बुशायिनम् ॥ १५३॥ प्रविश्य वदनं राहोर्यः सोमं पिबते
    निशि । ग्रसत्यर्कं च स्वर्भानू रक्षितस्तव तेजसा ॥ १५४॥ ये चात्र पतिता गर्भा रुद्र गन्धस्य रक्षणे ।
    नमस्तेऽस्तु स्वधा स्वाहा प्राप्नुवन्ति तदद्भुते ॥ १५५॥ येऽङ्गुष्ठमात्राः पुरुषा देहस्थाः सर्वदेहिनाम्
    । रक्षन्तु ते हि मां नित्यं ते मामाप्याययन्तु वै ॥ १५६॥ ये नदीषु समुद्रेषु पर्वतेषु गुहासु च । वृक्षमूलेषु
    गोष्ठेषु कान्तारगहनेषु च ॥ १५७॥ चतुष्पथेषु रथ्यासु चत्वरेषु सभासु च । हस्त्यश्वरथशालासु जीर्णोद्यानालयेषु
    च ॥ १५८॥ ये च पञ्चसु भूतेषु दिशासु विदिशासु च । चन्द्रार्कयोर्मध्यगता ये च चन्द्रार्करश्मिषु ॥ १५९॥
    रसातलगता ये च ये च तस्मात् परं गताः । नमस्तेभ्यो नमस्तेभ्यो नमस्तेभ्यश्च नित्यशः ॥ १६०॥ येषां न विद्यते
    सङ्ख्या प्रमाणं रूपमेव च । असङ्ख्येयगणा रुद्रा नमस्तेभ्योऽस्तु नित्यशः ॥ १६१॥ प्रसीद मम भद्रं ते तव
    भावगतस्य च । त्वयि मे हृदयं देव त्वयि बुद्धिर्मतिस्त्वयि ॥ १६२॥ स्तुत्वैवं स महादेवं विरराम द्विजोत्तमः
    ॥ १६३॥ इति श्रीवामनपुराणे सप्तचत्वारिंशत्तमाध्यायान्तर्गतं वेनकृतं शिवस्तोत्रं समाप्तम् । वामनपुराण
    । अध्याय ४७
