id: nirvaana-dasakam
category: stotram
name:
  english: Nirvaana Dasakam
  devanagari: निर्वाणदशकम्
content:
  english: nirvanadashakam shankaracaryah 1953 nirvanadashakam shankaracaryah 1953 || nirvanadashakam
    || na bhumirna toyam na tejo na vayu rna kham nemdriyam va na tesham samuhah | anaikantikatvatsushuptyekasiddha
    stadeko'vashishtah shivah kevalo'ham || 1 na varna na varnashramacaradharma na me dharanadhyanayogadayo'pi
    | anatmashrayo'ham mamadhyasahanattadeko || 2 na mata pita va na deva na loka na deva na yajna na
    tirtham bruvanti | sushuptau nirastatishunyatmakatvattadeko || 3 na samkhyam na shaivam na tatpancaratram
    na jainam na mimamsakadermatam va | vishishtanubhutya vishuddhatmakatvattadeko || 4 na shuklam na
    krishnam na raktam na pitam na pinam na kubjam na hsvam dirgham | arupam tatha jyotirakarakatvantadeko
    || 5 154 brihatstotraratnakare na jagranna me svapnako va sushupti rna vishvo na va tejasahprajnako
    va| avidyatmakatvattrayanam turiyam tadeko ||6 na shasta na shastram na shishyo na shiksha na ca tvam
    na caham na cayam prapancah| svarupavabodhadvikalpasahishnustadeko || 7 na cordhvam na cadho na cantarna
    bahyam na madhyam na tiryan na purva para dik | viyadvyapakatvadakhandaikarupastadeko || 8 api vyapakatvaditattvatprayoga
    tsvatahsiddhabhavadananyashrayatvat | jagantucchametatsamastam tadanyastadeko || 9 na caikam tadanyaddvitiyam
    kutah sya nna cakevalatvam na va kevalatvam | na shunyam na cashunyamadvaitakatva tkatham sarvavedantasiddham
    bravimi ||10 || iti shrimacchankaracaryaviracitam nirvanadashakastotram sampurnam||
  devanagari: निर्वाणदशकम् शङ्कराचार्यः १९५३ निर्वाणदशकम् शङ्कराचार्यः १९५३ ॥ निर्वाणदशकम् ॥ न भूमिर्न
    तोयं न तेजो न वायु र्न खं नेंद्रियं वा न तेषां समूहः । अनैकान्तिकत्वात्सुषुप्त्येकसिद्ध स्तदेकोऽवशिष्टः
    शिवः केवलोऽहम् ।। १ न वर्णा न वर्णाश्रमाचारधर्मा न मे धारणाध्यानयोगादयोऽपि । अनात्माश्रयोऽहं ममाध्यासहानात्तदेको
    ॥ २ न माता पिता वा न देवा न लोका न देवा न यज्ञा न तीर्थं ब्रुवन्ति । सुषुप्तौ निरस्तातिशून्यात्मकत्वात्तदेको
    ॥ ३ न सांख्यं न शैवं न तत्पाञ्चरात्रं न जैनं न मीमांसकादेर्मतं वा । विशिष्टानुभूत्या विशुद्धात्मकत्वात्तदेको
    ॥ ४ न शुक्लं न कृष्णं न रक्तं न पीतं न पीनं न कुब्जं न ह्स्वं दीर्घम् । अरूपं तथा ज्योतिराकारकत्वान्तदेको
    ॥ ५ १५४ बृहत्स्तोत्ररत्नाकरे न जाग्रन्न मे स्वप्नको वा सुषुप्ति र्न विश्वो न वा तेजसःप्राज्ञको वा।
    अविद्यात्मकत्वात्त्रयाणां तुरीयं तदेको ॥६ न शास्ता न शास्त्रं न शिष्यो न शिक्षा न च त्वं न चाहं न
    चायं प्रपञ्चः। स्वरूपावबोधाद्विकल्पासहिष्णुस्तदेको ॥ ७ न चोर्ध्वं न चाधो न चान्तर्न बाह्यं न मध्यं
    न तिर्यङ् न पूर्वा परा दिक् । वियद्व्यापकत्वादखण्डैकरूपस्तदेको ॥ ८ अपि व्यापकत्वादितत्त्वात्प्रयोगा
    त्स्वतःसिद्धभावादनन्याश्रयत्वात् । जगन्तुच्छमेतत्समस्तं तदन्यस्तदेको ॥ ९ न चैकं तदन्यद्द्वितीयं कुतः
    स्या न्न चाकेवलत्वं न वा केवलत्वम् । न शून्यं न चाशून्यमद्वैतकत्वा त्कथं सर्ववेदान्तसिद्धं ब्रवीमि
    ॥१० ॥ इति श्रीमच्छङ्कराचार्यविरचितं निर्वाणदशकस्तोत्रं सम्पूर्णम्।।
