id: parikaraparicayavimshatikastotram
category: stotram
name:
  english: parikaraparicayavimshatikastotram
  devanagari: परिकरपरिचयविंशतिकास्तोत्रम्
content:
  english: shruti brahmaja pranava vidya devaki ceti vishruta || 4|| samashti nigamovedah vasudevashca
    jayatah | sarvevedastuvanti yam nityameva samadarat || 5|| sa eva bhagavan krishnah samuttirna mahitale
    | divyagopanganabhishca kridantam sa cacaraha || 6|| nana shrutigana sarve vanavasi munishvarah |
    gavo gopyashcate sarve sanjatadharani tale || 7|| gokulam vana vaikuntham drumasanti tapasvinah |
    upasanakandarupa shrutidvyeshta sahasra ka || 8|| satadhikyah tatoshtau ca ricopanishadasyaha | daya
    tu rohini devi satyabhamadhara'bhavat || 9|| sudama samata jatah satya'kruro babhuvaha | damashcoddhava
    sanjatah bhutaleti ca sushrumah || 10|| shankhastu sodarolakshya lakshmirupo na samshayah | vishnurupashca
    tam prahuh sindhau ghosha karoti sah || 11|| gopinam grihamadhyetu dadhibhandani vikhanditah | tau
    jataudadhi sindhu kshirasindhushca kathyate || 12|| ishanirmita lokastu cakrarupena bhramyate | ishotpannasya
    lokasya pranavayu sucarmakam || 13|| agnitulyah maheshohi khadgarupena vartate | kashyapolukhalambhuttva
    bhagavantamavapaha || 14|| aditi deva mata tu rajjurupena vartate | sarvashatru nihantri sa gada kali
    babhuvaha || 15|| maya sharngadhanushcaiva ishahaste babhuvaha | maya'vidya ritukala tasya devasya
    bhojanam || 16|| ishahaste jiva sangham kamalamapi shobhitam | gopalo krishnarupashca sakshat maya
    varpudharah || 17|| sudurbodham kuhakante mayaya mohitam jagat | garudovatabhandira sudama narado'bhavat
    || 18|| vrinda bhakti kriya buddhi tasyadevasya jayate | adhasurastupapo'bhuta krodhalobhadi rakshasah
    || 19|| matsara mushtikashcaiva dveshacanura eva ca | darpakuvalayapida vakagarvonasamshayah | kalikamso'bhavat
    tatra adhastu vyadhireva ca || 20|| iti shri svami umeshvaranandatirthaviracitam parikaraparicayavishantika
    stotram sampurnam |
  devanagari: श्रुति ब्रह्मजा प्रणवा विद्या देवकी चेति विश्रुता ॥ ४॥ समष्टि निगमोवेदः वसुदेवश्च जायतः
    । सर्वेवेदास्तुवन्ति यं नित्यमेव समादरात् ॥ ५॥ स एव भगवान् कृष्णः समुत्तीर्ण महीतले । दिव्यगोपाङ्गनाभिश्च
    क्रीडन्तं स चचारह ॥ ६॥ नाना श्रुतिगणा सर्वे वनवासी मुनीश्वराः । गावो गोप्यश्चते सर्वे सञ्जाताधरणी
    तले ॥ ७॥ गोकुलं वन वैकुण्ठं द्रुमासन्ति तपस्विनः । उपासनाकाण्डरूपा श्रुतिद्व्येष्ट सहस्र का ॥ ८॥ सताधिक्यः
    ततोष्टौ च ऋचोपनिषदस्यह । दया तु रोहिणी देवी सत्यभामाधराऽभवत् ॥ ९॥ सुदामा समता जातः सत्यऽक्रूरो बभूवह
    । दमश्चोद्धव सञ्जातः भुतलेति च सुश्रुमः ॥ १०॥ शङ्खस्तु सोदरोलक्ष्या लक्ष्मीरूपो न संशयः । विष्णुरूपश्च
    तं प्राहुः सिन्धौ घोष करोति सः ॥ ११॥ गोपीनां गृहमध्येतु दधिभाण्डानि विखण्डिताः । तौ जातौदधि सिन्धु
    क्षीरसिन्धुश्च कथ्यते ॥ १२॥ ईशनिर्मित लोकस्तु चक्ररूपेण भ्राम्यते । ईशोत्पन्नस्य लोकस्य प्राणवायु
    सुचर्मकम् ॥ १३॥ अग्नितुल्यः महेशोहि खड्गरूपेण वर्तते । कश्यपोलूखलम्भुत्त्वा भगवन्तमवापह ॥ १४॥ अदिति
    देव माता तु रज्जुरूपेण वर्तते । सर्वशत्रु निहन्त्री सा गदा काली बभूवह ॥ १५॥ माया शार्ङ्गधनुश्चैव ईशहस्ते
    बभूवह । मायाऽविद्या ऋतुकाल तस्य देवस्य भोजनम् ॥ १६॥ ईशहस्ते जीव सङ्घं कमलमपि शोभितम् । गोपालो कृष्णरूपश्च
    साक्षात् माया वर्पुधरः ॥ १७॥ सुदुर्बोधं कुहकन्ते मायया मोहितं जगत् । गरुडोवटभाण्डिर सुदामा नारदोऽभवत्
    ॥ १८॥ वृन्दा भक्ति क्रिया बुद्धि तस्यदेवस्य जायते । अधासुरस्तुपापोऽभूत क्रोधलोभादि राक्षसाः ॥ १९॥
    मत्सर मुष्टिकश्चैव द्वेषचाणूर एव च । दर्पकुवलयापीड वकगर्वोनसंशयः । कलिकंसोऽभवत् तत्र अधस्तु व्याधिरेव
    च ॥ २०॥ इति श्री स्वामी उमेश्वरानन्दतीर्थविरचितं परिकरपरिचयविशन्तिका स्तोत्रं सम्पूर्णम् ।
