id: devadibhihkritam7shivastotram
category: stotram
name:
  english: devadibhihkritam7shivastotram
  devanagari: देवादिभिःकृतं७शिवस्तोत्रम्
content:
  english: devadibhih kritam 7 shivastotram brahmovaca | samaradhya haram sukhamavapnumah | gacchamah
    sharanam devam kailasam tu shivalayam || 62|| jagmushca samhatastatra dadrishuh shankaram sthitam
    | alingam ca tatah stotum samarabdhah surastada || 63|| alingaya mahajvalanalarupaya te namah | digambaraya'vikritaye
    parakritaye namah || 64|| divyalilaprarkatre te kshamashilaya te namah | namah shantasvarupaya ghoralingaya
    te namah || 65|| no'paradhan kshamasva'tra mahadeva namo'stu te | svalingam patitam deva prabho samupasamhara
    || 66|| trailokyam dahati vahnimayam dvadasharupabhak | kripam kuru mahadeva tava lilamayam jagat
    || 67|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 196
  devanagari: देवादिभिः कृतं ७ शिवस्तोत्रम् ब्रह्मोवाच । समाराध्य हरं सुखमवाप्नुमः । गच्छामः शरणं देवं
    कैलासं तु शिवालयम् ॥ ६२॥ जग्मुश्च संहतास्तत्र ददृशुः शङ्करं स्थितम् । अलिङ्गं च ततः स्तोतुं समारब्धाः
    सुरास्तदा ॥ ६३॥ अलिङ्गाय महाज्वालानलरूपाय ते नमः । दिगम्बरायाऽविकृतये पराकृतये नमः ॥ ६४॥ दिव्यलीलाप्रर्कत्रे
    ते क्षमाशीलाय ते नमः । नमः शान्तस्वरूपाय घोरलिङ्गाय ते नमः ॥ ६५॥ नोऽपराधान् क्षमस्वाऽत्र महादेव नमोऽस्तु
    ते । स्वलिङ्गं पतितं देव प्रभो समुपसंहर ॥ ६६॥ त्रैलोक्यं दहति वह्निमयं द्वादशरूपभाक् । कृपां कुरु
    महादेव तव लीलामयं जगत् ॥ ६७॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १९६
