id: rudrasahasranamastotralingapurana
category: sahasranama
name:
  english: rudrasahasranamastotralingapurana
  devanagari: रुद्रसहस्रनामस्तोत्रलिन्गपुराण
content:
  english: rigalarupah sarvartho mundah sarvashubhankarah | simhashardularupashca gandhakari kapardyapi
    || 69|| urdhvaretordhvalingi ca urdhvashayi nabhastalah | trijati ciravasashca rudrah senapatirvibhuh
    || 70|| ahoratranca naktanca tigmamanyuh suvarcasah | gajaha daityaha kalo lokadhata gunakarah ||
    71|| simhashardularupanamardracarmambarandharah | kalayogi mahanadah sarvavasashcatushpathah || 72||
    nishacarah pretacari sarvadarshi maheshvarah | bahubhuto bahudhanah sarvasaro'mriteshvarah || 73||
    nrityapriyo nityanrityo nartanah sarvasadhakah | sakarmuko mahabahurmahaghoro mahatapah || 74|| mahasharo
    mahapasho nityo giricaro matah | sahasrahasto vijayo vyavasayo hyaninditah || 75|| amarshano marshanatma
    yajnaha kamanashanah | dakshaha paricari ca prahaso madhyamastatha || 76|| tejo'pahari balavanvidito'bhyudito
    bahuh | gambhiraghosho yogatma yajnaha kamanashanah || 77|| gambhirarosho gambhiro gambhirabalavahanah
    | nyagrodharupo nyagrodho vishvakarma ca vishvabhuk || 78|| tikshnopayashca haryashvah sahayah karmakalavit
    | vishnuh prasadito yajnah samudro vadavamukhah || 79|| hutashanasahayashca prashantatma hutashanah
    | ugrateja mahateja jayo vijayakalavit || 80|| jyotishamayanam siddhih sandhirvigraha eva ca | khadgi
    shankhi jati jvali khacaro dyucaro bali || 81|| vainavi panavi kalah kalakanthah katankatah | nakshatravigraho
    bhavo nibhavah sarvatomukhah || 82|| vimocanastu sharano hiranyakavacodbhavah | mekhalakritirupashca
    jalacarah stutastatha || 83|| vini ca panavi tali nali kalikatustatha | sarvaturyaninadi ca sarvavyapyaparigrahah
    || 84|| vyalarupi bilavasi guhavasi tarangavit | vrikshah shrimalakarma ca sarvabandhavimocanah ||
    85|| bandhanastu surendranam yudhi shatruvinashanah | sakha pravaso durvapah sarvasadhunishevitah
    || 86|| praskando'pyavibhavashca tulyo yajnavibhagavit | sarvavasah sarvacari durvasa vasavo matah
    || 87|| haimo hemakaro yajnah sarvadhari dharottamah | akasho nirvirupashca vivasa uragah khagah ||
    88|| bhikshushca bhikshurupi ca raudrarupah surupavan | vasuretah suvarcasvi vasuvego mahabalah ||
    89|| manovego nishacarah sarvalokashubhapradah | sarvavasi trayivasi upadeshakaro dharah || 90|| muniratma
    munirlokah sabhagyashca sahasrabhuk | pakshi ca paksharupashca atidipto nishakarah || 91|| samiro
    damanakaro hyartho hyarthakaro'vashah | vasudevashca devashca vamadevashca vamanah || 92|| siddhiyogapahari
    ca siddhah sarvarthasadhakah | akshunnah kshunnarupashca vrishano mriduravyayah || 93|| mahaseno vishakhashca
    shashtibhago gavam patih | cakrahastastu vishtambhi mulastambhana eva ca || 94|| riturritukarastalo
    madhurmadhukaro varah | vanaspatyo vajasano nityamashramapujitah || 95|| brahmacari lokacari sarvacari
    sucaravit | ishana ishvarah kalo nishacari hyanekadrik || 96|| nimittastho nimittam ca nandirnandikaro
    harah | nandishvarah sunandi ca nandano vishamardanah || 97|| bhagahari niyanta ca kalo lokapitamahah
    | caturmukho mahalingashcarulingastathaiva ca || 98|| lingadhyakshah suradhyakshah kaladhyaksho yugavahah
    | bijadhyaksho bijakarta adhyatmanugato balah || 99|| itihasashca kalpashca damano jagadishvarah |
    dambho dambhakaro data vamsho vamshakarah kalih || 100|| lokakarta pashupatirmahakarta hyadhokshajah
    | aksharam paramam brahma balavanchukra eva ca || 101|| nityo hyanishah shuddhatma shuddho mano gatirhavih
    | prasadastu balo darpo darpano havyamindrajit || 102|| vedakarah sutrakaro vidvamshca paramardanah
    | mahameghanivasi ca mahaghoro vashikarah || 103|| agnijvalo mahajvalah paridhumravrito ravih | dhishanah
    shankaro nityo varcasvi dhumralocanah || 104|| nilastathangaluptashca shobhano naravigrahah | svasti
    svastisvabhavashca bhogi bhogakaro laghuh || 105|| utsangashca mahangashca mahagarbhah pratapavan
    | krishnavarnah suvarnashca indriyah sarvavarnikah || 106|| mahapado mahahasto mahakayo mahayashah
    | mahamurdha mahamatro mahamitro nagalayah || 107|| mahaskandho mahakarno mahoshthashca mahahanuh
    | mahanaso mahakantho mahagrivah shmashanavan || 108|| mahabalo mahateja hyantaratma mrigalayah |
    lambitoshthashca nishthashca mahamayah payonidhih || 109|| mahadanto mahadamshtro mahajihvo mahamukhah
    | mahanakho maharoma mahakesho mahajatah || 110|| asapatnah prasadashca pratyayo gitasadhakah | prasvedano
    svahenashca adikashca mahamunih || 111|| vrishako vrishaketushca analo vayuvahanah | mandali meruvasashca
    devavahana eva ca || 112|| atharvashirshah samasya riksahasrorjitekshanah | yajuh padabhujo guhyah
    prakashaujastathaiva ca || 113|| amogharthaprasadashca antarbhavyah sudarshanah | upaharah priyah
    sarvah kanakah kancanasthitah || 114|| nabhirnandikaro harmyah pushkarah sthapatih sthitah | sarvashastro
    dhanashcadyo yajno yajva samahitah || 115|| nago nilah kavih kalo makarah kalapujitah | sagano ganakarashca
    bhutabhavanasarathih || 116|| bhasmashayi bhasmagopta bhasmabhutatanurganah | agamashca vilopashca
    mahatma sarvapujitah || 117|| shuklah strirupasampannah shucirbhutanishevitah | ashramasthah kapotastho
    vishvakarma patirvirat || 118|| vishalashakhastamroshtho hyambujalah sunishcitah | kapilah kalashah
    sthula ayudhashcaiva romashah || 119|| gandharvo hyaditistarkshyo hyavijneyah susharadah | parashvadhayudho
    devo hyarthakari subandhavah || 120|| tumbavino mahakopa urdhvareta jaleshayah | ugro vamshakaro vamsho
    vamshavadi hyaninditah || 121|| sarvangarupi mayavi suhrido hyanilo balah | bandhano bandhakarta ca
    subandhanavimocanah || 122|| rakshasaghno'tha kamarirmahadamshtro mahayudhah | lambito lambitoshthashca
    lambahasto varapradah || 123|| bahustvaninditah sarvah shankaro'thapyakopanah | amaresho mahaghoro
    vishvadevah surariha || 124|| ahirbudhnyo nirritishca cekitano hali tatha | ajaikapacca kapali sham
    kumaro mahagirih || 125|| dhanvantarirdhumaketuh suryo vaishravanastatha | dhata vishnushca shakrashca
    mitrastvashta dharo dhruvah || 126|| prabhasah parvato vayuraryama savita ravih | dhritishcaiva vidhata
    ca mandhata bhutabhavanah || 127|| nirastirthashca bhimashca sarvakarma gunodvahah | padmagarbho mahagarbhashcandravaktro
    nabho'naghah || 128|| balavamshcopashantashca puranah punyakrittamah | krurakarta kruravasi tanuratma
    mahaushadhah || 129|| sarvashayah sarvacari praneshah praninam patih | devadevah sukhotsiktah sadasatsarvaratnavit
    || 130|| kailasastho guhavasi himavadgirisamshrayah | kulahari kulakarta bahuvitto bahuprajah || 131||
    pranesho bandhaki vriksho nakulashcadrikastatha | hrasvagrivo mahajanuralolashca mahaushadhih || 132||
    siddhantakari siddharthashchando vyakaranodbhavah | simhanadah simhadamshtrah simhasyah simhavahanah
    || 133|| prabhavatma jagatkalah kalah kampi tarustanuh | sarango bhutacakrankah ketumali suvedhakah
    || 134|| bhutalayo bhutapatirahoratro malo'malah | vasubhritsarvabhutatma nishcalah suvidurbudhah
    || 135|| asuhritsarvabhutanam nishcalashcalavidbudhah | amoghah samyamo hrishto bhojanah pranadharanah
    || 136|| dhritimanmatimamstryakshah sukritastu yudham patih | gopalo gopatirgramo gocarmavasano harah
    || 137|| hiranyabahushca tatha guhavasah praveshanah | mahamana mahakamo cittakamo jitendriyah ||
    138|| gandharashca surapashca tapakarmarato hitah | mahabhuto bhutavrito hyapsaroganasevitah || 139||
    mahaketurdharadhata naikatanaratah svarah | avedaniya avedyah sarvagashca sukhavahah || 140|| taranashcarano
    dhata paridha paripujitah | samyogi vardhano vriddho ganiko'tha ganadhipah || 141|| nityo dhata sahayashca
    devasurapatih patih | yuktashca yuktabahushca sudevo'pi suparvanah || 142|| ashadhashca sushadhashca
    skandhado harito harah | vapuravartamano'nyo vapuh shreshtho mahavapuh || 143|| shiro vimarshanah
    sarvalakshyalakshanabhushitah | akshayo rathagitashca sarvabhogi mahabalah || 144|| samnayo'tha mahamnayastirthadevo
    mahayashah | nirjivo jivano mantrah subhago bahukarkashah || 145|| ratnabhuto'tha ratnangah maharnavanipatavit
    | mulam vishalo hyamritam vyaktavyaktastaponidhih || 146|| arohano'dhirohashca shiladhari mahatapah
    | mahakantho mahayogi yugo yugakaro harih || 147|| yugarupo maharupo vahano gahano nagah | nyayo nirvapano
    padah pandito hyacalopamah || 148|| bahumalo mahamalah shipivishtah sulocanah | vistaro lavanah kupah
    kusumango phalodayah || 149|| rishabho vrishabho bhango manibimbajatadharah | indurvisargah sumukhah
    shurah sarvayudhah sahah || 150|| nivedanah sudhajatah svargadvaro mahadhanuh | giravaso visargashca
    sarvalakshanalakshavit || 151|| gandhamali ca bhagavananantah sarvalakshanah | santano bahulo bahuh
    sakalah sarvapavanah || 152|| karasthali kapali ca urdhvasamhanano yuva | yantratantrasuvikhyato lokah
    sarvashrayo mriduh || 153|| mundo virupo vikrito dandi kundi vikurvanah | varyakshah kakubho vajri
    diptatejah sahasrapat || 154|| sahasramurdha devendrah sarvadevamayo guruh | sahasrabahuh sarvangah
    sharanyah sarvalokakrit || 155|| pavitram trimadhurmantrah kanishthah krishnapingalah | brahmadandavinirmata
    shataghnah shatapashadhrik || 156|| kala kashtha lavo matra muhurtohah kshapa kshanah | vishvakshetraprado
    bijam lingamadyastu nirmukhah || 157|| sadasadvyaktamavyaktam pita mata pitamahah | svargadvaram mokshadvaram
    prajadvaram trivishtapah || 158|| nirvanam hridayashcaiva brahmalokah para gatih | devasuravinirmata
    devasuraparayanah || 159|| devasuragururdevo devasuranamaskritah | devasuramahamatro devasuraganashrayah
    || 160|| devasuraganadhyaksho devasuraganagranih | devadhidevo devarshirdevasuravarapradah || 161||
    devasureshvaro vishnurdevasuramaheshvarah | sarvadevamayo'cintyo devata''tma svayambhavah || 162||
    udgatastrikramo vaidyo varado'varajo'mbarah | ijyo hasti tatha vyaghro devasimho maharshabhah || 163||
    vibudhagryah surashreshthah svargadevastathottamah | samyuktah shobhano vakta ashanam prabhavovyayah
    || 164|| guruh kanto nijah sargah pavitrah sarvavahanah | sha
  devanagari: ृगालरूपः सर्वार्थो मुण्डः सर्वशुभङ्करः । सिंहशार्दूलरूपश्च गन्धकारी कपर्द्यपि ॥ ६९॥ ऊर्ध्वरेतोर्ध्वलिङ्गी
    च ऊर्ध्वशायी नभस्तलः । त्रिजटी चीरवासाश्च रुद्रः सेनापतिर्विभुः ॥ ७०॥ अहोरात्रञ्च नक्तञ्च तिग्ममन्युः
    सुवर्चसः । गजहा दैत्यहा कालो लोकधाता गुणाकरः ॥ ७१॥ सिंहशार्दुलरूपाणामार्द्रचर्माम्बरन्धरः । कालयोगी
    महानादः सर्वावासश्चतुष्पथः ॥ ७२॥ निशाचरः प्रेतचारी सर्वदर्शी महेश्वरः । बहुभूतो बहुधनः सर्वसारोऽमृतेश्वरः
    ॥ ७३॥ नृत्यप्रियो नित्यनृत्यो नर्तनः सर्वसाधकः । सकार्मुको महाबाहुर्महाघोरो महातपाः ॥ ७४॥ महाशरो महापाशो
    नित्यो गिरिचरो मतः । सहस्रहस्तो विजयो व्यवसायो ह्यनिन्दितः ॥ ७५॥ अमर्षणो मर्षणात्मा यज्ञहा कामनाशनः
    । दक्षहा परिचारी च प्रहसो मध्यमस्तथा ॥ ७६॥ तेजोऽपहारी बलवान्विदितोऽभ्युदितो बहुः । गम्भीरघोषो योगात्मा
    यज्ञहा कामनाशनः ॥ ७७॥ गम्भीररोषो गम्भीरो गम्भीरबलवाहनः । न्यग्रोधरूपो न्यग्रोधो विश्वकर्मा च विश्वभुक्
    ॥ ७८॥ तीक्ष्णोपायश्च हर्यश्वः सहायः कर्मकालवित् । विष्णुः प्रसादितो यज्ञः समुद्रो वडवामुखः ॥ ७९॥ हुताशनसहायश्च
    प्रशान्तात्मा हुताशनः । उग्रतेजा महातेजा जयो विजयकालवित् ॥ ८०॥ ज्योतिषामयनं सिद्धिः सन्धिर्विग्रह
    एव च । खड्गी शङ्खी जटी ज्वाली खचरो द्युचरो बली ॥ ८१॥ वैणवी पणवी कालः कालकण्ठः कटङ्कटः । नक्षत्रविग्रहो
    भावो निभावः सर्वतोमुखः ॥ ८२॥ विमोचनस्तु शरणो हिरण्यकवचोद्भवः । मेखलाकृतिरूपश्च जलाचारः स्तुतस्तथा
    ॥ ८३॥ वीणी च पणवी ताली नाली कलिकटुस्तथा । सर्वतूर्यनिनादी च सर्वव्याप्यपरिग्रहः ॥ ८४॥ व्यालरूपी बिलावासी
    गुहावासी तरङ्गवित् । वृक्षः श्रीमालकर्मा च सर्वबन्धविमोचनः ॥ ८५॥ बन्धनस्तु सुरेन्द्राणां युधि शत्रुविनाशनः
    । सखा प्रवासो दुर्वापः सर्वसाधुनिषेवितः ॥ ८६॥ प्रस्कन्दोऽप्यविभावश्च तुल्यो यज्ञविभागवित् । सर्ववासः
    सर्वचारी दुर्वासा वासवो मतः ॥ ८७॥ हैमो हेमकरो यज्ञः सर्वधारी धरोत्तमः । आकाशो निर्विरूपश्च विवासा
    उरगः खगः ॥ ८८॥ भिक्षुश्च भिक्षुरूपी च रौद्ररूपः सुरूपवान् । वसुरेताः सुवर्चस्वी वसुवेगो महाबलः ॥ ८९॥
    मनोवेगो निशाचारः सर्वलोकशुभप्रदः । सर्वावासी त्रयीवासी उपदेशकरो धरः ॥ ९०॥ मुनिरात्मा मुनिर्लोकः सभाग्यश्च
    सहस्रभुक् । पक्षी च पक्षरूपश्च अतिदीप्तो निशाकरः ॥ ९१॥ समीरो दमनाकारो ह्यर्थो ह्यर्थकरोऽवशः । वासुदेवश्च
    देवश्च वामदेवश्च वामनः ॥ ९२॥ सिद्धियोगापहारी च सिद्धः सर्वार्थसाधकः । अक्षुण्णः क्षुण्णरूपश्च वृषणो
    मृदुरव्ययः ॥ ९३॥ महासेनो विशाखश्च षष्टिभागो गवां पतिः । चक्रहस्तस्तु विष्टम्भी मूलस्तम्भन एव च ॥ ९४॥
    ऋतुरृतुकरस्तालो मधुर्मधुकरो वरः । वानस्पत्यो वाजसनो नित्यमाश्रमपूजितः ॥ ९५॥ ब्रह्मचारी लोकचारि सर्वचारि
    सुचारवित् । ईशान ईश्वरः कालो निशाचारी ह्यनेकदृक् ॥ ९६॥ निमित्तस्थो निमित्तं च नन्दिर्नन्दिकरो हरः
    । नन्दीश्वरः सुनन्दी च नन्दनो विषमर्दनः ॥ ९७॥ भगहारी नियन्ता च कालो लोकपितामहः । चतुर्मुखो महालिङ्गश्चारुलिङ्गस्तथैव
    च ॥ ९८॥ लिङ्गाध्यक्षः सुराध्यक्षः कालाध्यक्षो युगावहः । बीजाध्यक्षो बीजकर्ता अध्यात्मानुगतो बलः ॥
    ९९॥ इतिहासश्च कल्पश्च दमनो जगदीश्वरः । दम्भो दम्भकरो दाता वंशो वंशकरः कलिः ॥ १००॥ लोककर्ता पशुपतिर्महाकर्ता
    ह्यधोक्षजः । अक्षरं परमं ब्रह्म बलवाञ्छुक्र एव च ॥ १०१॥ नित्यो ह्यनीशः शुद्धात्मा शुद्धो मानो गतिर्हविः
    । प्रासादस्तु बलो दर्पो दर्पणो हव्यमिन्द्रजित् ॥ १०२॥ वेदकारः सूत्रकारो विद्वांश्च परमर्दनः । महामेघनिवासी
    च महाघोरो वशीकरः ॥ १०३॥ अग्निज्वालो महाज्वालः परिधूम्रावृतो रविः । धिषणः शङ्करो नित्यो वर्चस्वी धूम्रलोचनः
    ॥ १०४॥ नीलस्तथाङ्गलुप्तश्च शोभनो नरविग्रहः । स्वस्ति स्वस्तिस्वभावश्च भोगी भोगकरो लघुः ॥ १०५॥ उत्सङ्गश्च
    महाङ्गश्च महागर्भः प्रतापवान् । कृष्णवर्णः सुवर्णश्च इन्द्रियः सर्ववर्णिकः ॥ १०६॥ महापादो महाहस्तो
    महाकायो महायशाः । महामूर्धा महामात्रो महामित्रो नगालयः ॥ १०७॥ महास्कन्धो महाकर्णो महोष्ठश्च महाहनुः
    । महानासो महाकण्ठो महाग्रीवः श्मशानवान् ॥ १०८॥ महाबलो महातेजा ह्यन्तरात्मा मृगालयः । लम्बितोष्ठश्च
    निष्ठश्च महामायः पयोनिधिः ॥ १०९॥ महादन्तो महादंष्ट्रो महाजिह्वो महामुखः । महानखो महारोमा महाकेशो महाजटः
    ॥ ११०॥ असपत्नः प्रसादश्च प्रत्ययो गीतसाधकः । प्रस्वेदनो स्वहेनश्च आदिकश्च महामुनिः ॥ १११॥ वृषको वृषकेतुश्च
    अनलो वायुवाहनः । मण्डली मेरुवासश्च देववाहन एव च ॥ ११२॥ अथर्वशीर्षः सामास्य ऋक्सहस्रोर्जितेक्षणः ।
    यजुः पादभुजो गुह्यः प्रकाशौजास्तथैव च ॥ ११३॥ अमोघार्थप्रसादश्च अन्तर्भाव्यः सुदर्शनः । उपहारः प्रियः
    सर्वः कनकः काञ्चनस्थितः ॥ ११४॥ नाभिर्नन्दिकरो हर्म्यः पुष्करः स्थपतिः स्थितः । सर्वशास्त्रो धनश्चाद्यो
    यज्ञो यज्वा समाहितः ॥ ११५॥ नगो नीलः कविः कालो मकरः कालपूजितः । सगणो गणकारश्च भूतभावनसारथिः ॥ ११६॥
    भस्मशायी भस्मगोप्ता भस्मभूततनुर्गणः । आगमश्च विलोपश्च महात्मा सर्वपूजितः ॥ ११७॥ शुक्लः स्त्रीरूपसम्पन्नः
    शुचिर्भूतनिषेवितः । आश्रमस्थः कपोतस्थो विश्वकर्मा पतिर्विराट् ॥ ११८॥ विशालशाखस्ताम्रोष्ठो ह्यम्बुजालः
    सुनिश्चितः । कपिलः कलशः स्थूल आयुधश्चैव रोमशः ॥ ११९॥ गन्धर्वो ह्यदितिस्तार्क्ष्यो ह्यविज्ञेयः सुशारदः
    । परश्वधायुधो देवो ह्यर्थकारी सुबान्धवः ॥ १२०॥ तुम्बवीणो महाकोप ऊर्ध्वरेता जलेशयः । उग्रो वंशकरो वंशो
    वंशवादी ह्यनिन्दितः ॥ १२१॥ सर्वाङ्गरूपी मायावी सुहृदो ह्यनिलो बलः । बन्धनो बन्धकर्ता च सुबन्धनविमोचनः
    ॥ १२२॥ राक्षसघ्नोऽथ कामारिर्महादंष्ट्रो महायुधः । लम्बितो लम्बितोष्ठश्च लम्बहस्तो वरप्रदः ॥ १२३॥ बाहुस्त्वनिन्दितः
    सर्वः शङ्करोऽथाप्यकोपनः । अमरेशो महाघोरो विश्वदेवः सुरारिहा ॥ १२४॥ अहिर्बुध्न्यो निरृतिश्च चेकितानो
    हली तथा । अजैकपाच्च कापाली शं कुमारो महागिरिः ॥ १२५॥ धन्वन्तरिर्धूमकेतुः सूर्यो वैश्रवणस्तथा । धाता
    विष्णुश्च शक्रश्च मित्रस्त्वष्टा धरो ध्रुवः ॥ १२६॥ प्रभासः पर्वतो वायुरर्यमा सविता रविः । धृतिश्चैव
    विधाता च मान्धाता भूतभावनः ॥ १२७॥ नीरस्तीर्थश्च भीमश्च सर्वकर्मा गुणोद्वहः । पद्मगर्भो महागर्भश्चन्द्रवक्त्रो
    नभोऽनघः ॥ १२८॥ बलवांश्चोपशान्तश्च पुराणः पुण्यकृत्तमः । क्रूरकर्ता क्रूरवासी तनुरात्मा महौषधः ॥ १२९॥
    सर्वाशयः सर्वचारी प्राणेशः प्राणिनां पतिः । देवदेवः सुखोत्सिक्तः सदसत्सर्वरत्नवित् ॥ १३०॥ कैलासस्थो
    गुहावासी हिमवद्गिरिसंश्रयः । कुलहारी कुलाकर्ता बहुवित्तो बहुप्रजः ॥ १३१॥ प्राणेशो बन्धकी वृक्षो नकुलश्चाद्रिकस्तथा
    । ह्रस्वग्रीवो महाजानुरलोलश्च महौषधिः ॥ १३२॥ सिद्धान्तकारी सिद्धार्थश्छन्दो व्याकरणोद्भवः । सिंहनादः
    सिंहदंष्ट्रः सिंहास्यः सिंहवाहनः ॥ १३३॥ प्रभावात्मा जगत्कालः कालः कम्पी तरुस्तनुः । सारङ्गो भूतचक्राङ्कः
    केतुमाली सुवेधकः ॥ १३४॥ भूतालयो भूतपतिरहोरात्रो मलोऽमलः । वसुभृत्सर्वभूतात्मा निश्चलः सुविदुर्बुधः
    ॥ १३५॥ असुहृत्सर्वभूतानां निश्चलश्चलविद्बुधः । अमोघः संयमो हृष्टो भोजनः प्राणधारणः ॥ १३६॥ धृतिमान्मतिमांस्त्र्यक्षः
    सुकृतस्तु युधां पतिः । गोपालो गोपतिर्ग्रामो गोचर्मवसनो हरः ॥ १३७॥ हिरण्यबाहुश्च तथा गुहावासः प्रवेशनः
    । महामना महाकामो चित्तकामो जितेन्द्रियः ॥ १३८॥ गान्धारश्च सुरापश्च तापकर्मरतो हितः । महाभूतो भूतवृतो
    ह्यप्सरोगणसेवितः ॥ १३९॥ महाकेतुर्धराधाता नैकतानरतः स्वरः । अवेदनीय आवेद्यः सर्वगश्च सुखावहः ॥ १४०॥
    तारणश्चरणो धाता परिधा परिपूजितः । संयोगी वर्धनो वृद्धो गणिकोऽथ गणाधिपः ॥ १४१॥ नित्यो धाता सहायश्च
    देवासुरपतिः पतिः । युक्तश्च युक्तबाहुश्च सुदेवोऽपि सुपर्वणः ॥ १४२॥ आषाढश्च सुषाढश्च स्कन्धदो हरितो
    हरः । वपुरावर्तमानोऽन्यो वपुः श्रेष्ठो महावपुः ॥ १४३॥ शिरो विमर्शनः सर्वलक्ष्यलक्षणभूषितः । अक्षयो
    रथगीतश्च सर्वभोगी महाबलः ॥ १४४॥ साम्नायोऽथ महाम्नायस्तीर्थदेवो महायशाः । निर्जीवो जीवनो मन्त्रः सुभगो
    बहुकर्कशः ॥ १४५॥ रत्नभूतोऽथ रत्नाङ्गः महार्णवनिपातवित् । मूलं विशालो ह्यमृतं व्यक्ताव्यक्तस्तपोनिधिः
    ॥ १४६॥ आरोहणोऽधिरोहश्च शीलधारी महातपाः । महाकण्ठो महायोगी युगो युगकरो हरिः ॥ १४७॥ युगरूपो महारूपो
    वहनो गहनो नगः । न्यायो निर्वापणो पादः पण्डितो ह्यचलोपमः ॥ १४८॥ बहुमालो महामालः शिपिविष्टः सुलोचनः
    । विस्तारो लवणः कूपः कुसुमाङ्गो फलोदयः ॥ १४९॥ ऋषभो वृषभो भङ्गो माणिबिम्बजटाधरः । इन्दुर्विसर्गः सुमुखः
    शूरः सर्वायुधः सहः ॥ १५०॥ निवेदनः सुधाजातः स्वर्गद्वारो महाधनुः । गिरावासो विसर्गश्च सर्वलक्षणलक्षवित्
    ॥ १५१॥ गन्धमाली च भगवाननन्तः सर्वलक्षणः । सन्तानो बहुलो बाहुः सकलः सर्वपावनः ॥ १५२॥ करस्थाली कपाली
    च ऊर्ध्वसंहननो युवा । यन्त्रतन्त्रसुविख्यातो लोकः सर्वाश्रयो मृदुः ॥ १५३॥ मुण्डो विरूपो विकृतो दण्डी
    कुण्डी विकुर्वणः । वार्यक्षः ककुभो वज्री दीप्ततेजाः सहस्रपात् ॥ १५४॥ सहस्रमूर्धा देवेन्द्रः सर्वदेवमयो
    गुरुः । सहस्रबाहुः सर्वाङ्गः शरण्यः सर्वलोककृत् ॥ १५५॥ पवित्रं त्रिमधुर्मन्त्रः कनिष्ठः कृष्णपिङ्गलः
    । ब्रह्मदण्डविनिर्माता शतघ्नः शतपाशधृक् ॥ १५६॥ कला काष्ठा लवो मात्रा मुहूर्तोहः क्षपा क्षणः । विश्वक्षेत्रप्रदो
    बीजं लिङ्गमाद्यस्तु निर्मुखः ॥ १५७॥ सदसद्व्यक्तमव्यक्तं पिता माता पितामहः । स्वर्गद्वारं मोक्षद्वारं
    प्रजाद्वारं त्रिविष्टपः ॥ १५८॥ निर्वाणं हृदयश्चैव ब्रह्मलोकः परा गतिः । देवासुरविनिर्माता देवासुरपरायणः
    ॥ १५९॥ देवासुरगुरुर्देवो देवासुरनमस्कृतः । देवासुरमहामात्रो देवासुरगणाश्रयः ॥ १६०॥ देवासुरगणाध्यक्षो
    देवासुरगणाग्रणीः । देवाधिदेवो देवर्षिर्देवासुरवरप्रदः ॥ १६१॥ देवासुरेश्वरो विष्णुर्देवासुरमहेश्वरः
    । सर्वदेवमयोऽचिन्त्यो देवताऽऽत्मा स्वयम्भवः ॥ १६२॥ उद्गतस्त्रिक्रमो वैद्यो वरदोऽवरजोऽम्बरः । इज्यो
    हस्ती तथा व्याघ्रो देवसिंहो महर्षभः ॥ १६३॥ विबुधाग्र्यः सुरश्रेष्ठः स्वर्गदेवस्तथोत्तमः । संयुक्तः
    शोभनो वक्ता आशानां प्रभवोव्ययः ॥ १६४॥ गुरुः कान्तो निजः सर्गः पवित्रः सर्ववाहनः । श
