id: kalpavrikshamantrah
category: mantra
name:
  english: kalpavrikshamantrah
  devanagari: कल्पवृक्षमन्त्रः
content:
  english: kalpavrikshamantrah || viniyogah || asya kalpavrikshamantrasya narayanarishih | gayatri chandah
    | shriradhakrishnau devata | mama sarvabhishtasiddhyarthe jape viniyogah || || rishyadinyasah || om
    narayanarishaye namah shirasi | om gayatrichandase namah mukhe | om shriradhakrishnadevatabhyam namah
    hridi | om shrim bijaya namah guhye | om hrim shaktaye namah padayoh | om klim kilakaya namah sarvange
    | om viniyogaya namah sarvatra || || karanyasah || om shrim angushthabhyam namah | om hrim tarjanibhyam
    namah | om klim madhyamabhyam namah | om krim anamikabhyam namah | om shnam kanishthikabhyam namah
    | om namah karatalakaraprishthabhyam namah || || shadanganyasah || om shrim hridayaya namah | om hrim
    shirase svaha | om klim shikhayai vashat | om krishnaya kavacaya hum | om namah netratrayaya vaushat
    | om phat astraya phat || || vyapakanyasah || shrim hrim klim krishnaya namah iti mantrena shirahprabhriti
    padantam padadarabhya shirahparyantam trivaram vyapakam nyaset | || aksharanyasah || shrim shirasi
    | hrim lalate | klim bhrumadhye | krim netrayoh | shnam karnayoh | yam nasikayam | nam mukhe | mah
    kanthe | namah hridaye | || matrikanyasah || am am im im um um rim rim lim lim em aim om aum am ah
    shirasi | kam kham gam gham nam dakshinabahau | cam cham jam jham nam vamabahau | tam tham dam dham
    nam dakshinapade | tam tham dam dham nam vamapade | pam pham bam bham mam udare | yam ram lam vam
    hridi | sham sham sam ham ksham sarvange || || cakranyasah || om narayanaya namah muladhare | om kameshvaraya
    namah svadhishthane | om yajnapurushaya namah manipure | om radhamohanaya namah anahate | om cakradharaya
    namah vishuddhau | om padmanabhaya namah talumule | om parshvanathaya namah bhrumadhye | om yogeshvaraya
    namah ajnacakre | om raseshvaryai namah sahasrare | om radheshvaraya namah dvadashante || || dhyanam
    || sindurarunavigraham navaghanashyamam manoharinam radhalingitavamabhagavilasatpitambaralankritam
    | venum vamakare dadhanamanisham mandasmitam sundaram vande shrirasabhupatim smitamukhim raseshvarim
    radhikam || kasturitilakam lalatapatale vakshahsthale kaustubham nasagre navamauktikam karatale venum
    kare kankanam | sarvange haricandanam sulalitam kanthe ca muktavalim radhasangavilasinam smitamukham
    vande mukundam harim || mantrah || shrim hrim klim krishnaya namah || iti kalpavrikshamantrah sampurnah
    |
  devanagari: कल्पवृक्षमन्त्रः ॥ विनियोगः ॥ अस्य कल्पवृक्षमन्त्रस्य नारायणऋषिः । गायत्री छन्दः । श्रीराधाकृष्णौ
    देवता । मम सर्वाभीष्टसिद्ध्यर्थे जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ ॐ नारायणऋषये नमः शिरसि । ॐ गायत्रीछन्दसे
    नमः मुखे । ॐ श्रीराधाकृष्णदेवताभ्यां नमः हृदि । ॐ श्रीं बीजाय नमः गुह्ये । ॐ ह्रीं शक्तये नमः पादयोः
    । ॐ क्लीं कीलकाय नमः सर्वाङ्गे । ॐ विनियोगाय नमः सर्वत्र ॥ ॥ करन्यासः ॥ ॐ श्रीं अङ्गुष्ठाभ्यां नमः
    । ॐ ह्रीं तर्जनीभ्यां नमः । ॐ क्लीं मध्यमाभ्यां नमः । ॐ कृं अनामिकाभ्यां नमः । ॐ ष्णां कनिष्ठिकाभ्यां
    नमः । ॐ नमः करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः ॥ ॐ श्रीं हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ
    क्लीं शिखायै वषट् । ॐ कृष्णाय कवचाय हुं । ॐ नमः नेत्रत्रयाय वौषट् । ॐ फट् अस्त्राय फट् ॥ ॥ व्यापकन्यासः
    ॥ श्रीं ह्रीं क्लीं कृष्णाय नमः इति मन्त्रेण शिरःप्रभृति पादान्तं पादादारभ्य शिरःपर्यन्तं त्रिवारं
    व्यापकं न्यसेत् । ॥ अक्षरन्यासः ॥ श्रीं शिरसि । ह्रीं ललाटे । क्लीं भ्रूमध्ये । कृं नेत्रयोः । ष्णां
    कर्णयोः । यं नासिकायाम् । नं मुखे । मः कण्ठे । नमः हृदये । ॥ मातृकान्यासः ॥ अं आं इं ईं उं ऊं ऋं ॠं
    ऌं ॡं एं ऐं ओं औं अं अः शिरसि । कं खं गं घं ङं दक्षिणबाहौ । चं छं जं झं ञं वामबाहौ । टं ठं डं ढं णं
    दक्षिणपादे । तं थं दं धं नं वामपादे । पं फं बं भं मं उदरे । यं रं लं वं हृदि । शं षं सं हं क्षं सर्वाङ्गे
    ॥ ॥ चक्रन्यासः ॥ ॐ नारायणाय नमः मूलाधारे । ॐ कामेश्वराय नमः स्वाधिष्ठाने । ॐ यज्ञपुरुषाय नमः मणिपूरे
    । ॐ राधामोहनाय नमः अनाहते । ॐ चक्रधराय नमः विशुद्धौ । ॐ पद्मनाभाय नमः तालुमूले । ॐ पार्श्वनाथाय नमः
    भ्रूमध्ये । ॐ योगेश्वराय नमः आज्ञाचक्रे । ॐ रासेश्वर्यै नमः सहस्रारे । ॐ राधेश्वराय नमः द्वादशान्ते
    ॥ ॥ ध्यानम् ॥ सिन्दूरारुणविग्रहं नवघनश्यामं मनोहारिणं राधालिङ्गितवामभागविलसत्पीताम्बरालङ्कृतम् । वेणुं
    वामकरे दधानमनिशं मन्दस्मितं सुन्दरं वन्दे श्रीरसभूपतिं स्मितमुखीं रासेश्वरीं राधिकाम् ॥ कस्तूरीतिलकं
    ललाटपटले वक्षःस्थले कौस्तुभं नासाग्रे नवमौक्तिकं करतले वेणुं करे कङ्कणम् । सर्वाङ्गे हरिचन्दनं सुललितं
    कण्ठे च मुक्तावलिं राधासङ्गविलासिनं स्मितमुखं वन्दे मुकुन्दं हरिम् ॥ मन्त्रः ॥ श्रीं ह्रीं क्लीं कृष्णाय
    नमः ॥ इति कल्पवृक्षमन्त्रः सम्पूर्णः ।
