id: kaushitakibrahmanopanishad
category: upanishad
name:
  english: kaushitakibrahmanopanishad
  devanagari: कौषीतकीब्राह्मणोपनिषद्
content:
  english: agacchatyaparajitamayatanam tam brahmatejah pravishati sa agacchati| indraprajapati dvaragopau
    tavasmadapadravatah sa agacchati vibhupramitam tam brahmayashah pravishati sa agacchati vicakshanamasandim
    brihadrathantare samani purvau padau dhyaita naudhase caparau vairupavairaje anucyete shastrararaivate
    tirashci sa prajna prajnaya hi vipashyati sa agacchtyamitaujasam paryankam sa pranastasya bhutam ca
    bhavishyacca purvau padau shrishcera caparau brihadrathantare anucye bhadrayajnayajniye shirshanyamricashca
    samani ca pracinatanani yajumshi tirashcinani somamshava upastaranamudgitha upashrih shrirupabarhanam
    tasminbrahmaste tamitthamvitpadenaivagra arohati| tam brahmaha ko'siti tam pratibruyat || 5 || riturasmyartavo'smyakashadyoneh
    sambhuto bharya etatsamvatsarasya tejobhutasya bhutasyatmabhutasya tvamatmasi yastvamasi sohamasmiti
    tamaha ko'hamasmiti satyamiti bruyatkim tadyatsatyamiti yadanyaddevebhyashca pranebhyashca tatsadatha
    yaddevacca pranashca tattyam tadetaya vacabhivyahriyate satyamityetavadidam sarvamidam sarvamasi|
    ityevainam tadaha| tadetadrikshlokenabhyuktam yajudarah samashira asavrinmurtiravyayah| sa brahmeti
    hi vijneya rishirbrahmamayo mahaniti| tamaha kena me paumsrani namanyapnotiti praneneti bruyat| kena
    strinamaniti vaceti kena napumsakanamaniti manaseti kena gandhaniti ghraneneti bruyat| kena rupaniti
    cakshusheti kena shabdaniti shrotreneti kenannarasaniti jihvayeti kena karmaniti hastabhyamiti kena
    sukhaduhkhe iti sharireneti kenanandam ratim prajapatimityupastheneti| kenetya iti padabhyamiti kena
    dhiyo vijnatavyam kamaniti prajnayeti bruyattamaha| apo vai khalu me hyasavayam te loka iti sa ya
    brahmanò jitirya vyashtistam jitim jayati tam vyashtim vyashnute ya evam veda ya evam veda || 6 ||
    || dvitiyo'dhyayah || 1|| prano brahmeti ha smaha kaushitakistasya ha va etasya pranasya brahmano
    mano dutam vakpariveshtri cakshurgatram shrotram samshravayitri tasmai va etasmai pranaya brahmana
    etah sarva devata ayacamanaya balim haranti tatho evasmai sarvani bhutanyayacamanayaiva balim haranti
    ya evam veda tasyopanishanna yacediti| tadyatha gramam bhikshitva'labdhopavishennahamato dattamashniyamiti|
    ya evainam purastatpratyacakshiramsta evainamupamantrayante dadama ta ityesha dharmo yacato bhavati|
    anyatastvevainamupamantrayante dadama ta iti || 1 || prano brahmeti ha smaha paingyastasya ha va etasya
    pranasya brahmano vakparastaccakshurarundhe cakshuh parastacchrotramarundhe shrotram parastanmana
    arundhe manah parastatprana arundhe tasmai va etasmai va pranaya brahmana etah sarva devata ayacamanaya
    balim haranti evasmai sarvani bhutanyayacamanayaiva balim haranti ya evam veda tasyopanishanna yacediti
    tadyatha gramam bhikshitva'labdhvopavishennahamato dattamashniyamiti ya evainam purastatpratyacakshiramsta
    evainamupamantrayante dadama ta ityesha dharmò yacito bhavatyanyatastvevainamupamantrayante dadama
    ta iti || 2 || athata ekadhanavarodhanam yadekadhanamabhidhyayatpaurnamasyam va'mavasyayam va shuddhapakshe
    va punye nakshatre'gnimupasamadhaya parisamuhya paristirya paryukshyopurvadakshinam janvacya sruvena
    va camasena va kamsena vaita ajyahutirjuhoti vannamadevatavarodhini sa me'mushmadidamavarundham tasyai
    svaha| pranò nama devata'varòdhini sa memushmadidamavarundham tasyai svaha| cakshurnama devatavarodhini
    sa me'mushmadidamavarundham tasyai svaha| shrotram nama devatavarodhini sa me'mushmadidamavarundham
    tasyai svaha| mano nama devatavarodhini sa me'mushmadidamavarundham tasyai svaha| prajna nama devatavarodhini
    sa me'mushmadidamavarundham tasyai svahetyatha dhumagandham prajighrayajyalepenanganyanuvimrijya vacamyamo'bhipravrijyartham
    bravita dutam va prahinuyallabhate haiva || 3 || athato daivasmaro yasya priyo bubhushedyasyai va
    esham vai teshamevaikasminparvanyagnimupasamadhayaitayaivavritaita ajyahutirjuhoti vacam mayi juhomyasau
    svaha| cakshuste mayi juhomyasau svaha| shrotram te mayi juhomyasau svaha| manaste mayi juhomyasau
    svaha| prajnam te mayi juhomyasau svahetyatha dhumagandham prajighrayajyalepenanganyanuvimrijya vacamyamo'bhipravrijya
    samsparsham jigamishedapi vatadva sambhashamanastishthetpriyo haiva bhavati smaranti haivasya || 4
    || athatah sayamannam pratardanamantaramagnihotramiti cacakshate yavadvai purusho bhashate na tavatpranitum
    shaknoti pranam tada vaci juhoti| yavadvai purushah praniti na tavadbhashitum shaknoti vacam tada
    prane juhoti| ete'nante'mritahutirjagracca svapamshca santatamavyavacchinnam juhotyatha ya anya ahutayo'ntavatyastah
    karmamayyo hi bhavantyetaddha vai purve vidvamso'gnihotram na juhavamcakruh || 5 || uktham brahmeti
    ha smaha shushkabhringarastadrigityupasita sarvani hasmai bhutani shraishthyayabhyarcyante tadyajurityupasita
    sarvani hasmai bhutani shraishthyaya yujyante tatsametyupasita sarvani hasmai bhutani shraishthyaya
    sannamante tacchrirityupasita tadyasha ityupasita tatteja ityupasita tadyathaitacchastranam shrimattamam
    yashasvitamam tejasvitamam bhavati| tathaivaivam vidvansarvesham bhutanam shrimattamo yashasvitamastejasvitamo
    bhavati| tametamaishtakam karmamayamatmanamadhvaryuh samskaroti tasminyajurmayam pravayati yajurmayam
    rinmayam hota rinmaye samamayamudgata sa esha sarvasyai trayividyaya atmaisha u evasyatma etadatma
    bhavati ya evam veda || 6 || athatah sarvajitah kaushitakesrinyupasanani bhavanti yajnopavitam kritvapa
    acamya trirudapatram prasicyodyantamadityamupatishtheta vargo'si papmanam me vrindhityetayaivavrita
    madhye santamudvargo'si papmanam me vrindhityetayaivavritastam yantam samvargo'si papmanam me samvrindhiti|
    yadahoratrabhyam papam karoti santaddhrinkte || 7 || atha masi masyamavasyayam pashcaccandramasam
    drishyamanamupatishthetaitayaivavrita haritatrinabhyam vakpratyasyati yatte susimam hridayamadhi candramasi
    shritam tenamritatvasyeshanam maham pautramagham rudamiti na hasmatpurvah prajah prayantiti nu jataputrasyathajataputrasyapyayasva
    sametu te sante payamsi samuyantu vaja yamaditya amshumapyayayantityetastisra rico japitva masmakam
    pranena prajaya pashubhirapyayayishtha yò'smandveshti yam ca vayam dvishmastasya pranena prajaya pashubhirapyayasveti
    daivimavritamavarta adityasyavritamanvavartayati dakshinam bahumanvavartate || 8 || atha paurnamasyam
    purastaccandramasam drishyamanamupatishthetaitayaivavrita somo rajasi vicakakshanah pancamukho'si
    prajapatirbrahmanasta ekam mukham tena mukhena rajno'tsi tena mukhena mamannadam kuru raja ta ekam
    mukham tena mukhena vishotsi tenaiva mukhena mamannadam kuru shyenasta ekam mukham tena mukhena pakshino'tsi
    tena mukhena mamannadam kuru agnishta ekam mukham tena mukhenemam lokamatsi tena mukhena mamannadam
    kuru tvayi pancamam mukham tena mukhena sarvani bhutanyatsi tena mukhena mamannadam kuru masmakam
    pranena prajaya pashubhiravaksheshtha yo'smadveshti yam ca vayam dvishmastasya pranena prajaya pashubhiravakshiyasveti
    daivimavritamavarta adityasyavritamanvavartanta iti dakshinam bahumanvavartate || 9 || atha samveshanjayayai
    hridayamabhimrishedyatte susime hridaye hitamantah prajapatau manye'ham mam tadvidvamsam tena maham
    pautramagham rudamiti na hasmatpurvah prajah praititi || 10 || atha proshyanputrasya murdhanamabhimrishet|
    angadangatsambhavasi hridayadadhijayase| atma tvam putra mavitha sa jiva sharadah shatamasaviti namasya
    grihnati| ashma bhava parashurbhava hiranyamastritam bhava| tejo vai putranamasi sa jiva sharadah
    shatamasaviti namasya grihnati| yena prajapatih prajah paryagrihnadarishtyai tena tva parigrihnamyasaviti
    namasya grihnatyathasya dakshine karne japatyasmai prayandhi maghavannrijishinnitindra shreshthani
    dravinani dhehiti savye ma cchittha ma vyathishthah shatam sharada ayusho jiva putra| te namna murdhanamabhijighramyasaviti
    trirmurdhanamavajighredgavam tva hinkarenabhihinkaromiti trirmurdhanamabhihinkuryat || 11 || athato
    daivah parimara etadvai brahma dipyate yadagnirjvalatyathaitanmriyate yanna jvalati tasyadityameva
    tejo gacchati vayum prana etadvai brahma dipyate yathadityo drishyate'thaitanmriyate yanna drishyate
    tasya candramasameva tejo gacachati vayum prana etadvai brahma dipyate yaccandrama drishyate| athaitanmriyate
    yanna drishyate tasya vidyutameva tejo gacchati vayum prana etadvai brahma dipyate yadvidyudvidyotate'thaitanmriyate
    yanna vidyotate tasya vayumeva tejo gacchati vayum pranah| ta va etah sarva devata vayumeva pravishya
    vayau mrita na mricchante tasmadeva u punarudirata ityadhidaivatamathadhyatmam || 12 || etadvai brahma
    dipyate yadvaca vadatyathaitanmriyate yanna vadati tasya cakshureva tejo gacchati pranam prana etadvai
    brahma dipyate yaccakshusha pashyatyathaitanmriyate yanna pashyati tasya shrotrameva tejo gacchati
    pranam prana etadvai brahma dipyate yacchròtrena shrinotyathaitanmriyate yanna shrinoti tasya mana
    eva tejo gacchati prana etadvai brahma dipyate yanmanasa dhyayatyathaitanmriyate yanna dhyayati tasya
    pranameva tejo gacchati pranam pranastava etah sarva devatah pranameva pravishya prane mrita na mricchante
    tasma deva u punarudirate tadyadiha va evam vidvamsa ubhau parvatavabhipravarteyatam tusturshamano
    dakshinashcottarashca na haivainam strinviyatam| atha ya enam dvishanti yamshca svayam dveshti ta
    enam sarve parimriyante || 13 || athato nihshreyasadanam sarva ha vai devata aham shreyase vivadamanah|
    asmacchariraduccakramustaddarubhutam shishyethaitadvakpravivesha tadvaca vadacchishya eva| athaitaccakshuh
    pravivesha tadvaca vadaccakshusha pashyacchishya evathainacchròtram pravivesha tadvaca vadaccakshusha
    pashyacchròtrena shrinvacchishya evathainanmanah pravivesha tadvaca vadaccakshusha pashyacchròtrena
    shrinvanmanasa dhyayacchishya evathaitatpranah pravivesha tattata eva samuttasthau te devah prane
    nihshreyasam vicintya pranameva prajnatmanamabhisambhuya sahaitaih sarvairasmallokaduccakramuh| te
    vayu
  devanagari: आगच्छत्यपराजितमायतनं तं ब्रह्मतेजः प्रविशति स आगच्छति। इन्द्रप्रजापती द्वारगोपौ तावस्मादपद्रवतः
    स आगच्छति विभुप्रमितं तं ब्रह्मयशः प्रविशति स आगच्छति विचक्षणामासन्दीं बृहद्रथन्तरे सामनी पूर्वौ पादौ
    ध्यैत नौधसे चापरौ वैरूपवैराजे अनूच्येते शास्त्रररैवते तिरश्ची सा प्रज्ञा प्रज्ञया हि विपश्यति स आगच्छ्त्यमितौजसं
    पर्यङ्कं स प्राणस्तस्य भूतं च भविष्यच्च पूर्वौ पादौ श्रीश्चेरा चापरौ बृहद्रथन्तरे अनूच्ये भद्रयज्ञायज्ञीये
    शीर्षण्यमृचश्च सामानि च प्राचीनातानानि यजूंषि तिरश्चीनानि सोमांशव उपस्तरणमुद्गीथ उपश्रीः श्रीरुपबर्हणं
    तस्मिन्ब्रह्मास्ते तमित्थंवित्पादेनैवाग्र आरोहति। तं ब्रह्माह कोऽसीति तं प्रतिब्रूयात् ॥ ५ ॥ ऋतुरस्म्यार्तवोऽस्म्याकाशाद्योनेः
    सम्भूतो भार्या एतत्संवत्सरस्य तेजोभूतस्य भूतस्यात्मभूतस्य त्वमात्मासि यस्त्वमसि सोहमस्मीति तमाह कोऽहमस्मीति
    सत्यमिति ब्रूयात्किं तद्यत्सत्यमिति यदन्यद्देवेभ्यश्च प्राणेभ्यश्च तत्सदथ यद्देवाच्च प्राणाश्च तत्त्यं
    तदेतया वाचाभिव्याह्रियते सत्यमित्येतावदिदं सर्वमिदं सर्वमसि। इत्येवैनं तदाह। तदेतदृक्श्लोकेनाभ्युक्तं
    यजूदरः सामशिरा असावृङ्मूर्तिरव्ययः। स ब्रह्मेति हि विज्ञेय ऋषिर्ब्रह्ममयो महानिति। तमाह केन मे पौंस्रानि
    नामान्याप्नोतीति प्राणेनेति ब्रूयात्। केन स्त्रीनामानीति वाचेति केन नपुंसकनामानीति मनसेति केन गन्धानिति
    घ्राणेनेति ब्रूयात्। केन रूपाणीति चक्षुषेति केन शब्दानिति श्रोत्रेणेति केनान्नरसानिति जिह्वयेति केन
    कर्माणीति हस्ताभ्यामिति केन सुखदुःखे इति शरीरेणेति केनानन्दं रतिं प्रजापतिमित्युपस्थेनेति। केनेत्या
    इति पादाभ्यामिति केन धियो विज्ञातव्यं कामानिति प्रज्ञयेति ब्रूयात्तमह। आपो वै खलु मे ह्यसावयं ते लोक
    इति सा या ब्रह्मणॊ जितिर्या व्यष्टिस्तां जितिं जयति तां व्यष्टिं व्यश्नुते य एवं वेद य एवं वेद ॥ ६
    ॥ ॥ द्वितीयोऽध्यायः ॥ १॥ प्राणो ब्रह्मेति ह स्माह कौषीतकिस्तस्य ह वा एतस्य प्राणस्य ब्रह्मणो मनो दूतं
    वाक्परिवेष्ट्री चक्षुर्गात्रं श्रोत्रं संश्रावयितृ तस्मै वा एतस्मै प्राणाय ब्रह्मण एताः सर्वा देवता
    अयाचमानाय बलिं हरन्ति तथो एवास्मै सर्वाणि भूतान्ययाचमानायैव बलिं हरन्ति य एवं वेद तस्योपनिषन्न याचेदिति।
    तद्यथा ग्रामं भिक्षित्वाऽलब्धोपविशेन्नाहमतो दत्तमश्नीयामिति। य एवैनं पुरस्तात्प्रत्याचक्षीरंस्त एवैनमुपमन्त्रयन्ते
    ददाम त इत्येष धर्मो याचतो भवति। अन्यतस्त्वेवैनमुपमन्त्रयन्ते ददाम त इति ॥ १ ॥ प्राणो ब्रह्मेति ह स्माह
    पैङ्ग्यस्तस्य ह वा एतस्य प्राणस्य ब्रह्मणो वाक्परस्ताच्चक्षुरारुन्धे चक्षुः परस्ताच्छ्रोत्रमारुन्धे
    श्रोत्रं परस्तान्मन आरुन्धे मनः परस्तात्प्राण आरुन्धे तस्मै वा एतस्मै वा प्राणाय ब्रह्मण एताः सर्वा
    देवता अयाचमानाय बलिं हरन्ति एवास्मै सर्वाणि भूतान्ययचमानायैव बलिं हरन्ति य एवं वेद तस्योपनिषन्न याचेदिति
    तद्यथा ग्रामं भिक्षित्वाऽलब्ध्वोपविशेन्नाहमतो दत्तमश्नीयामिति य एवैनं पुरस्तात्प्रत्याचक्षीरंस्त एवैनमुपमन्त्रयन्ते
    ददाम त इत्येष धर्मॊ याचितो भवत्यन्यतस्त्वेवैनमुपमन्त्रयन्ते ददाम त इति ॥ २ ॥ अथात एकधनावरोधनं यदेकधनमभिध्यायात्पौर्णमास्यां
    वाऽमावास्यायां वा शुद्धपक्षे वा पुण्ये नक्षत्रेऽग्निमुपसमाधाय परिसमुह्य परिस्तीर्य पर्युक्ष्योपूर्वदक्षिणं
    जान्वाच्य स्रुवेण वा चमसेन वा कंसेन वैता आज्याहुतीर्जुहोति वाङ्नामदेवतावरोधिनी सा मेऽमुष्मादिदमवरुन्धां
    तस्यै स्वाहा। प्राणॊ नाम देवताऽवरॊधिनी सा मेमुष्मादिदमवरुन्धां तस्यै स्वाहा। चक्षुर्नाम देवतावरोधिनी
    सा मेऽमुष्मादिदमवरुन्धां तस्यै स्वाहा। श्रोत्रं नाम देवतावरोधिनी सा मेऽमुष्मादिदमवरुन्धां तस्यै स्वाहा।
    मनो नाम देवतावरोधिनी सा मेऽमुष्मादिदमवरुन्धां तस्यै स्वाह। प्रज्ञा नाम देवतावरोधिनी सा मेऽमुष्मादिदमवरुन्धां
    तस्यै स्वाहेत्यथ धूमगन्धं प्रजिघ्रायाज्यलेपेनाङ्गान्यनुविमृज्य वाचंयमोऽभिप्रवृज्यार्थं ब्रवीत दूतं
    वा प्रहिणुयाल्लभते हैव ॥ ३ ॥ अथातो दैवस्मरो यस्य प्रियो बुभूषेद्यस्यै वा एषां वै तेषामेवैकस्मिन्पर्वण्यग्निमुपसमाधायैतयैवावृतैता
    आज्याहुतीर्जुहोति वाचं मयि जुहोम्यसौ स्वाहा। चक्षुस्ते मयि जुहोम्यसौ स्वाहा। श्रोत्रं ते मयि जुहोम्यसौ
    स्वाहा। मनस्ते मयि जुहोम्यसौ स्वाहा। प्रज्ञां ते मयि जुहोम्यसौ स्वाहेत्यथ धूमगन्धं प्रजिघ्रायाज्यलेपेनाङ्गान्यनुविमृज्य
    वाचंयमोऽभिप्रवृज्य संस्पर्शं जिगमिषेदपि वाताद्वा सम्भाषमाणस्तिष्ठेत्प्रियो हैव भवति स्मरन्ति हैवास्य
    ॥ ४ ॥ अथातः सायमन्नं प्रातर्दनमान्तरमग्निहोत्रमिति चाचक्षते यावद्वै पुरुषो भाषते न तावत्प्राणितुं
    शक्नोति प्राणं तदा वाचि जुहोति। यावद्वै पुरुषः प्राणिति न तावद्भाषितुं शक्नोति वाचं तदा प्राणे जुहोति।
    एतेऽनन्तेऽमृताहुतिर्जाग्रच्च स्वपंश्च सन्ततमव्यवच्छिन्नं जुहोत्यथ या अन्या आहुतयोऽन्तवत्यस्ताः कर्ममय्यो
    हि भवन्त्येतद्ध वै पूर्वे विद्वांसोऽग्निहोत्रं न जुहवांचक्रुः ॥ ५ ॥ उक्थं ब्रह्मेति ह स्माह शुष्कभृङ्गरस्तदृगित्युपासीत
    सर्वाणि हास्मै भूतानि श्रैष्ठ्यायाभ्यर्च्यन्ते तद्यजुरित्युपासीत सर्वाणि हास्मै भूतानि श्रैष्ठ्याय
    युज्यन्ते तत्सामेत्युपासीत सर्वाणि हास्मै भूतानि श्रैष्ठ्याय सन्नमन्ते तच्छ्रीरित्युपासीत तद्यश इत्युपासीत
    तत्तेज इत्युपासीत तद्यथैतच्छास्त्राणां श्रीमत्तमं यशस्वितमं तेजस्वितमं भवति। तथैवैवं विद्वान्सर्वेषां
    भूतानां श्रीमत्तमो यशस्वितमस्तेजस्वितमो भवति। तमेतमैष्टकं कर्ममयमात्मानमध्वर्युः संस्करोति तस्मिन्यजुर्मयं
    प्रवयति यजुर्मयम् ऋङ्मयं होता ऋङ्मये साममयमुद्गाता स एष सर्वस्यै त्रयीविद्याया आत्मैष उ एवास्यात्मा
    एतदात्मा भवति य एवं वेद ॥ ६ ॥ अथातः सर्वजितः कौषीतकेस्रीण्युपासनानि भवन्ति यज्ञोपवीतं कृत्वाप आचम्य
    त्रिरुदपात्रं प्रसिच्योद्यन्तमादित्यमुपतिष्ठेत वर्गोऽसि पाप्मानं मे वृङ्धीत्येतयैवावृता मध्ये सन्तमुद्वर्गोऽसि
    पाप्मानं मे वृङ्धीत्येतयैवावृतास्तं यन्तं संवर्गोऽसि पाप्मानं मे संवृङ्धीति। यदहोरात्राभ्यां पापं
    करोति सन्तद्धृङ्क्ते ॥ ७ ॥ अथ मासि मास्यमावास्यायां पश्चाच्चन्द्रमसं दृश्यमानमुपतिष्ठेतैतयैवावृता
    हरिततृणाभ्यां वाक्प्रत्यस्यति यत्ते सुसीमं हृदयमधि चन्द्रमसि श्रितं तेनामृतत्वस्येशानं माहं पौत्रमघं
    रुदमिति न हास्मात्पूर्वाः प्रजाः प्रयन्तीति नु जातपुत्रस्याथाजातपुत्रस्याप्यायस्व समेतु ते सन्ते पयांसि
    समुयन्तु वाजा यमादित्या अंशुमाप्याययन्तीत्येतास्तिस्र ऋचो जपित्वा मास्माकं प्राणेन प्रजया पशुभिराप्याययिष्ठा
    यॊऽस्मान्द्वेष्टि यं च वयं द्विष्मस्तस्य प्राणेन प्रजया पशुभिराप्यायस्वेति दैवीमावृतमावर्त आदित्यस्यावृतमन्वावर्तयति
    दक्षिणं बाहुमन्वावर्तते ॥ ८ ॥ अथ पौर्णमास्यां पुरस्ताच्चन्द्रमसं दृश्यमानमुपतिष्ठेतैतयैवावृता सोमो
    राजासि विचकक्षणः पञ्चमुखोऽसि प्रजापतिर्ब्राह्मणस्त एकं मुखं तेन मुखेन राज्ञोऽत्सि तेन मुखेन मामन्नादं
    कुरु राजा त एकं मुखं तेन मुखेन विशोत्सि तेनैव मुखेन मामन्नादं कुरु श्येनस्त एकं मुखं तेन मुखेन पक्षिणोऽत्सि
    तेन मुखेन मामन्नादं कुरु अग्निष्ट एकं मुखं तेन मुखेनेमं लोकमत्सि तेन मुखेन मामन्नादं कुरु त्वयि पञ्चमं
    मुखं तेन मुखेन सर्वाणि भूतान्यत्सि तेन मुखेन मामन्नादं कुरु मास्माकं प्राणेन प्रजया पशुभिरवक्षेष्ठा
    योऽस्माद्वेष्टि यं च वयं द्विष्मस्तस्य प्राणेन प्रजया पशुभिरवक्षीयस्वेति दैवीमावृतमावर्त आदित्यस्यावृतमन्वावर्तन्त
    इति दक्षिणं बाहुमन्वावर्तते ॥ ९ ॥ अथ संवेशञ्जायायै हृदयमभिमृशेद्यत्ते सुसीमे हृदये हितमन्तः प्रजापतौ
    मन्येऽहं मां तद्विद्वांसं तेन माहं पौत्रमघं रुदमिति न हास्मत्पूर्वाः प्रजाः प्रैतीति ॥ १० ॥ अथ प्रोष्यान्पुत्रस्य
    मूर्धानमभिमृशेत्। अङ्गादङ्गात्सम्भवसि हृदयादधिजायसे। आत्मा त्वं पुत्र माविथ स जीव शरदः शतमसाविति नामास्य
    गृह्णाति। अश्मा भव परशुर्भव हिरण्यमस्तृतं भव। तेजो वै पुत्रनामासि स जीव शरदः शतमसाविति नामास्य गृह्णाति।
    येन प्रजापतिः प्रजाः पर्यगृह्णादरिष्ट्यै तेन त्वा परिगृह्णाम्यसाविति नामास्य गृह्णात्यथास्य दक्षिणे
    कर्णे जपत्यस्मै प्रयन्धि मघवन्नृजीषिन्नितीन्द्र श्रेष्ठानि द्रविणानि धेहीति सव्ये मा च्छित्था मा व्यथिष्ठाः
    शतं शरद आयुषो जीव पुत्र। ते नाम्ना मूर्धानमभिजिघ्राम्यसाविति त्रिर्मूर्धानमवजिघ्रेद्गवां त्वा हिङ्कारेणाभिहिङ्करोमीति
    त्रिर्मूर्धानमभिहिङ्कुर्यात् ॥ ११ ॥ अथातो दैवः परिमर एतद्वै ब्रह्म दीप्यते यदग्निर्ज्वलत्यथैतन्म्रियते
    यन्न ज्वलति तस्यादित्यमेव तेजो गच्छति वायुं प्राण एतद्वै ब्रह्म दीप्यते यथादित्यो दृश्यतेऽथैतन्म्रियते
    यन्न दृश्यते तस्य चन्द्रमसमेव तेजो गचछति वायुं प्राण एतद्वै ब्रह्म दीप्यते यच्चन्द्रमा दृश्यते। अथैतन्म्रियते
    यन्न दृश्यते तस्य विद्युतमेव तेजो गच्छति वायुं प्राण एतद्वै ब्रह्म दीप्यते यद्विद्युद्विद्योततेऽथैतन्म्रियते
    यन्न विद्योतते तस्य वायुमेव तेजो गच्छति वायुं प्राणः। ता वा एताः सर्वा देवता वायुमेव प्रविश्य वायौ
    मृता न मृच्छन्ते तस्मादेव उ पुनरुदीरत इत्यधिदैवतमथाध्यात्मम् ॥ १२ ॥ एतद्वै ब्रह्म दीप्यते यद्वाचा
    वदत्यथैतन्म्रियते यन्न वदति तस्य चक्षुरेव तेजो गच्छति प्राणं प्राण एतद्वै ब्रह्म दीप्यते यच्चक्षुषा
    पश्यत्यथैतन्म्रियते यन्न पश्यति तस्य श्रोत्रमेव तेजो गच्छति प्राणं प्राण एतद्वै ब्रह्म दीप्यते यच्छ्रॊत्रेण
    शृणोत्यथैतन्म्रियते यन्न शृणोति तस्य मन एव तेजो गच्छति प्राण एतद्वै ब्रह्म दीप्यते यन्मनसा ध्यायत्यथैतन्म्रियते
    यन्न ध्यायति तस्य प्राणमेव तेजो गच्छति प्राणं प्राणस्तावा एताः सर्वा देवताः प्राणमेव प्रविश्य प्राणे
    मृता न मृच्छन्ते तस्मा देव उ पुनरुदीरते तद्यदिह वा एवं विद्वांस उभौ पर्वतावभिप्रवर्तेयातां तुस्तूर्षमाणो
    दक्षिणश्चोत्तरश्च न हैवैनं स्तृण्वीयाताम्। अथ य एनं द्विषन्ति यांश्च स्वयं द्वेष्टि त एनं सर्वे परिम्रियन्ते
    ॥ १३ ॥ अथातो निःश्रेयसादानं सर्वा ह वै देवता अहं श्रेयसे विवदमानाः। अस्माच्छरीरादुच्चक्रमुस्तद्दारुभूतं
    शिष्येथैतद्वाक्प्रविवेश तद्वाचा वदच्छिष्य एव। अथैतच्चक्षुः प्रविवेश तद्वाचा वदच्चक्षुषा पश्यच्छिष्य
    एवाथैनच्छ्रॊत्रं प्रविवेश तद्वाचा वदच्चक्षुषा पश्यच्छ्रॊत्रेण शृण्वच्छिष्य एवाथैनन्मनः प्रविवेश तद्वाचा
    वदच्चक्षुषा पश्यच्छ्रॊत्रेण शृण्वन्मनसा ध्यायच्छिष्य एवाथैतत्प्राणः प्रविवेश तत्तत एव समुत्तस्थौ ते
    देवाः प्राणे निःश्रेयसं विचिन्त्य प्राणमेव प्रज्ञात्मानमभिसम्भूय सहैतैः सर्वैरस्माल्लोकादुच्चक्रमुः।
    ते वायु
