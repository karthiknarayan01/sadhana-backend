id: jvarakritam2shrikrishnastotram
category: stotram
name:
  english: jvarakritam2shrikrishnastotram
  devanagari: ज्वरकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: rdevan sadhun lokasetun bibharshi | hamsyunmargan himsaya vartamanan janmaitatte bharaharaya
    bhumeh || 27|| tapto'ham te tejasa duhsahena shantogrenatyulbanena jvarena | tavattapo dehinam te'nghrimulam
    no severan yavadashanubaddhah || 28|| iti shrimadbhagavatamahapurane dashamaskandhe uttarardhe trishashtitamadhyayantargatam
    jvarakritam shrikrishnastotram samaptam | bhagavatapurana | adhyaya 10
  devanagari: र्देवान् साधून् लोकसेतून् बिभर्षि । हंस्युन्मार्गान् हिंसया वर्तमानान् जन्मैतत्ते भारहाराय
    भूमेः ॥ २७॥ तप्तोऽहं ते तेजसा दुःसहेन शान्तोग्रेणात्युल्बणेन ज्वरेण । तावत्तापो देहिनां तेऽङ्घ्रिमूलं
    नो सेवेरन् यावदाशानुबद्धाः ॥ २८॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे उत्तरार्धे त्रिषष्टितमाध्यायान्तर्गतं
    ज्वरकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १०
meaning: {}
