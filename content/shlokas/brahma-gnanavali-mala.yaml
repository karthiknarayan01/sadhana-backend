id: brahma-gnanavali-mala
category: stotram
name:
  english: Brahma Gnanavali Mala
content:
  english: sakricchravanamatrena brahmajnanam yato bhavet | brahmajnanavalimala sarvesham mokshasiddhaye
    || || asango'hamasango'hamasango'ham punah punah | saccidanandarupo'hamahamevahamavyayah || || nityashuddhavimukto'ham
    nirakaro'hamavyayah | bhumanandasvarupo'hamahamevahamavyayah || || nityo'ham niravadyo'ham nirakaro'hamucyate
    | paramanandarupo'hamahamevahamavyayah || || shuddhacaitanyarupo'hamatmaramo'hameva ca | akhandanandarupo'hamahamevahamavyayah
    || || pratyakcaitanyarupo'ham shanto'ham prakriteh parah | shashvatanandarupo'hamahamevahamavyayah
    || || tattvatitah paratmaham madhyatitah parah shivah | mayatitah paranjyotirahamevahamavyayah ||
    || nanarupavyatito'ham cidakaro'hamacyutah | sukharupasvarupo'hamahamevahamavyayah || || mayatatkaryadehadi
    mama nastyeva sarvada | svaprakashaikarupo'hamahamevahamavyayah || || gunatrayavyatito'ham brahmadinam
    ca sakshyaham | anantanantarupo'hamahamevahamavyayah || || antaryamisvarupo'ham kutasthah sarvago'smyaham
    | paramatmasvarupo'hamahamevahamavyayah || || nishkalo'ham nishkriyo'ham sarvatmadyah sanatanah |
    aparokshasvarupo'hamahamevahamavyayah || || dvandvadisakshirupo'hamacalo'ham sanatanah | sarvasakshisvarupo'hamahamevahamavyayah
    || || prajnanaghana evaham vijnanaghana eva ca | akartahamabhoktahamahamevahamavyayah || || niradharasvarupo'ham
    sarvadharo'hameva ca | aptakamasvarupo'hamahamevahamavyayah || || tapatrayavinirmukto dehatrayavilakshanah
    | avasthatrayasakshyasmi cahamevahamavyayah || || drigdrishyau dvau padarthau stah parasparavilakshanau
    | drigbrahma drishyam mayeti sarvavedantadindimah || || aham sakshiti yo vidyadvivicyaivam punah punah
    | sa eva muktah so vidvaniti vedantadindimah || || ghatakudyadikam sarvam mrittikamatrameva ca | tadvadbrahma
    jagatsarvamiti vedantadindimah || || brahma satyam jaganmithya jivo brahmaiva naparah | anena vedyam
    sacchastramiti vedantadindimah || || antarjyotirbahirjyotih pratyagjyotih paratparah | jyotirjyotih
    svayanjyotiratmajyotih shivo'smyaham || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau brahmajnanavalimala sampurna ||
  devanagari: सकृच्छ्रवणमात्रेण ब्रह्मज्ञानं यतो भवेत् । ब्रह्मज्ञानावलीमाला सर्वेषां मोक्षसिद्धये ॥ ॥
    असङ्गोऽहमसङ्गोऽहमसङ्गोऽहं पुनः पुनः । सच्चिदानन्दरूपोऽहमहमेवाहमव्ययः ॥ ॥ नित्यशुद्धविमुक्तोऽहं निराकारोऽहमव्ययः
    । भूमानन्दस्वरूपोऽहमहमेवाहमव्ययः ॥ ॥ नित्योऽहं निरवद्योऽहं निराकारोऽहमुच्यते । परमानन्दरूपोऽहमहमेवाहमव्ययः
    ॥ ॥ शुद्धचैतन्यरूपोऽहमात्मारामोऽहमेव च । अखण्डानन्दरूपोऽहमहमेवाहमव्ययः ॥ ॥ प्रत्यक्चैतन्यरूपोऽहं शान्तोऽहं
    प्रकृतेः परः । शाश्वतानन्दरूपोऽहमहमेवाहमव्ययः ॥ ॥ तत्त्वातीतः परात्माहं मध्यातीतः परः शिवः । मायातीतः
    परञ्ज्योतिरहमेवाहमव्ययः ॥ ॥ नानारूपव्यतीतोऽहं चिदाकारोऽहमच्युतः । सुखरूपस्वरूपोऽहमहमेवाहमव्ययः ॥ ॥
    मायातत्कार्यदेहादि मम नास्त्येव सर्वदा । स्वप्रकाशैकरूपोऽहमहमेवाहमव्ययः ॥ ॥ गुणत्रयव्यतीतोऽहं ब्रह्मादीनां
    च साक्ष्यहम् । अनन्तानन्तरूपोऽहमहमेवाहमव्ययः ॥ ॥ अन्तर्यामिस्वरूपोऽहं कूटस्थः सर्वगोऽस्म्यहम् । परमात्मस्वरूपोऽहमहमेवाहमव्ययः
    ॥ ॥ निष्कलोऽहं निष्क्रियोऽहं सर्वात्माद्यः सनातनः । अपरोक्षस्वरूपोऽहमहमेवाहमव्ययः ॥ ॥ द्वन्द्वादिसाक्षिरूपोऽहमचलोऽहं
    सनातनः । सर्वसाक्षिस्वरूपोऽहमहमेवाहमव्ययः ॥ ॥ प्रज्ञानघन एवाहं विज्ञानघन एव च । अकर्ताहमभोक्ताहमहमेवाहमव्ययः
    ॥ ॥ निराधारस्वरूपोऽहं सर्वाधारोऽहमेव च । आप्तकामस्वरूपोऽहमहमेवाहमव्ययः ॥ ॥ तापत्रयविनिर्मुक्तो देहत्रयविलक्षणः
    । अवस्थात्रयसाक्ष्यस्मि चाहमेवाहमव्ययः ॥ ॥ दृग्दृश्यौ द्वौ पदार्थौ स्तः परस्परविलक्षणौ । दृग्ब्रह्म
    दृश्यं मायेति सर्ववेदान्तडिण्डिमः ॥ ॥ अहं साक्षीति यो विद्याद्विविच्यैवं पुनः पुनः । स एव मुक्तः सो
    विद्वानिति वेदान्तडिण्डिमः ॥ ॥ घटकुड्यादिकं सर्वं मृत्तिकामात्रमेव च । तद्वद्ब्रह्म जगत्सर्वमिति वेदान्तडिण्डिमः
    ॥ ॥ ब्रह्म सत्यं जगन्मिथ्या जीवो ब्रह्मैव नापरः । अनेन वेद्यं सच्छास्त्रमिति वेदान्तडिण्डिमः ॥ ॥ अन्तर्ज्योतिर्बहिर्ज्योतिः
    प्रत्यग्ज्योतिः परात्परः । ज्योतिर्ज्योतिः स्वयञ्ज्योतिरात्मज्योतिः शिवोऽस्म्यहम् ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ ब्रह्मज्ञानावलीमाला सम्पूर्णा ॥
