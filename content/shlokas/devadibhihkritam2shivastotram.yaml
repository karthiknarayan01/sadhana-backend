id: devadibhihkritam2shivastotram
category: stotram
name:
  english: devadibhihkritam2shivastotram
  devanagari: देवादिभिःकृतं२शिवस्तोत्रम्
content:
  english: devadibhih kritam 2 shivastotram ityuktvanyonyamanagham tushtuvuh shivamishvaram | namah sarvatmane
    tubhyam sarvajnaya pinakine || 7|| anaghaya virincaya devyah karyarthadayine | akayayarthakayaya hareh
    kayapaharine || 8|| kayantasthamritadharamandalavasthitaya te | kritadibhedakalaya kalavegaya te namah
    || 9|| kalagnirudrarupaya dharmadyashtapadaya ca | kalivishuddhadehaya kalikakaranaya te || 10|| kalakanthaya
    mukhyaya vahanaya varaya te | ambikapataye tubhyam hiranyapataye namah || 11|| hiranyaretase caiva
    namah sharvaya shuline | kapaladandapashasicarmankushadharaya ca || 12|| pataye haimavatyashca hemashuklaya
    te namah | pitashuklaya rakshartham suranam krishnavartmane || 13|| pancamaya mahapancayajninam phaladaya
    ca | pancasyaphaniharaya pancaksharamayaya te || 14|| pancadha pancakaivalyadevairarcitamurtaye |
    pancaksharadrishe tubhyam paratparataraya te || 15|| shodashasvaravajrangavaktrayakshayarupine | kadipancakahastaya
    cadihastaya te namah || 16|| tadipadaya rudraya tadipadaya te namah | padimedhraya yadyangadhatusaptakadharine
    || 17|| shantatmarupine sakshatkshadatatakrodhine namah | lavarephahaḻangaya nirangaya ca te namah
    || 18|| sarveshameva bhutanam hridi nihsvanakarine | bhruvorante sada sadbhirdrishtayatyantabhanave
    || 19|| bhanusomagninetraya paramatmasvarupine | gunatrayoparisthaya tirthapadaya te namah || 20||
    tirthatattvaya saraya tasmadapi paraya te | rigjayuh samavedaya onkaraya namo namah || 21|| om kare
    trividham rupamasthayoparivasine | pitaya krishnavarnaya raktayatyantatejase || 22|| sthanapancakasamsthaya
    pancadhandabahih kramat | brahmane vishnave tubhyam kumaraya namo namah || 23|| ambayah parameshaya
    sarvoparicaraya te | mulasukshmasvarupaya sthulasukshmaya te namah || 24|| sarvasankalpashunyaya sarvasmadrakshitaya
    te | adimadhyantashunyaya citsamsthaya namo namah || 25|| yamagnivayurudrambusomashakranishacaraih
    | dinmukhe dinmukhe nityam saganaih pujitaya te || 26|| sarveshu sarvada sarvamarge sampujitaya te
    | rudraya rudranilaya kadrudraya pracetase | maheshvaraya dhiraya namah sakshacchivaya te || 27||
    atha sha
  devanagari: देवादिभिः कृतं २ शिवस्तोत्रम् इत्युक्त्वान्योन्यमनघं तुष्टुवुः शिवमीश्वरम् । नमः सर्वात्मने
    तुभ्यं सर्वज्ञाय पिनाकिने ॥ ७॥ अनघाय विरिञ्चाय देव्याः कार्यार्थदायिने । अकायायार्थकायाय हरेः कायापहारिणे
    ॥ ८॥ कायान्तस्थामृताधारमण्डलावस्थिताय ते । कृतादिभेदकालाय कालवेगाय ते नमः ॥ ९॥ कालाग्निरुद्ररुपाय
    धर्माद्यष्टपदाय च । कालीविशुद्धदेहाय कालिकाकारणाय ते ॥ १०॥ कालकण्ठाय मुख्याय वाहनाय वराय ते । अम्बिकापतये
    तुभ्यं हिरण्यपतये नमः ॥ ११॥ हिरण्यरेतसे चैव नमः शर्वाय शूलिने । कपालदण्डपाशासिचर्माङ्कुशधराय च ॥ १२॥
    पतये हैमवत्याश्च हेमशुक्लाय ते नमः । पीतशुक्लाय रक्षार्थं सुराणां कृष्णवर्त्मने ॥ १३॥ पञ्चमाय महापञ्चयज्ञिनां
    फलदाय च । पञ्चास्यफणिहाराय पञ्चाक्षरमयाय ते ॥ १४॥ पञ्चधा पञ्चकैवल्यदेवैरर्चितमूर्तये । पञ्चाक्षरदृशे
    तुभ्यं परात्परतराय ते ॥ १५॥ षोडशस्वरवज्राङ्गवक्त्रायाक्षयरूपिणे । कादिपञ्चकहस्ताय चादिहस्ताय ते नमः
    ॥ १६॥ टादिपादाय रुद्राय तादिपादाय ते नमः । पादिमेढ्राय यद्यङ्गधातुसप्तकधारिणे ॥ १७॥ शान्तात्मरूपिणे
    साक्षात्क्षदततक्रोधिने नमः । लवरेफहळाङ्गाय निरङ्गाय च ते नमः ॥ १८॥ सर्वेषामेव भूतानां हृदि निःस्वनकारिणे
    । भ्रुवोरन्ते सदा सद्भिर्दृष्टायात्यन्तभानवे ॥ १९॥ भानुसोमाग्निनेत्राय परमात्मस्वरूपिणे । गुणत्रयोपरिस्थाय
    तीर्थपादाय ते नमः ॥ २०॥ तीर्थतत्त्वाय साराय तस्मादपि पराय ते । ऋग्जयुः सामवेदाय ओङ्काराय नमो नमः ॥
    २१॥ ॐ कारे त्रिविधं रूपमास्थायोपरिवासिने । पीताय कृष्णवर्णाय रक्तायात्यन्ततेजसे ॥ २२॥ स्थानपञ्चकसंस्थाय
    पञ्चधाण्डबहिः क्रमात् । ब्रह्मणे विष्णवे तुभ्यं कुमाराय नमो नमः ॥ २३॥ अम्बायाः परमेशाय सर्वोपरिचारय
    ते । मूलसूक्ष्मस्वरूपाय स्थूलसूक्ष्माय ते नमः ॥ २४॥ सर्वसङ्कल्पशून्याय सर्वस्माद्रक्षिताय ते । आदिमध्यान्तशून्याय
    चित्संस्थाय नमो नमः ॥ २५॥ यमाग्निवायुरुद्राम्बुसोमशक्रनिशाचरैः । दिङ्मुखे दिङ्मुखे नित्यं सगणैः पूजिताय
    ते ॥ २६॥ सर्वेषु सर्वदा सर्वमार्गे सम्पूजिताय ते । रुद्राय रुद्रनीलाय कद्रुद्राय प्रचेतसे । महेश्वराय
    धीराय नमः साक्षाच्छिवाय ते ॥ २७॥ अथ श
