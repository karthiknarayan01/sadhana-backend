id: shri-suktam
category: stotram
name:
  english: shri suktam
  devanagari: श्री सूक्तम्
content:
  english: uru padmakshi padmasambhave || tanme bhajasi padmakshi yena saukhyam labhamyaham || ashvadayai
    godayai dhanadayai mahadhane || dhanam me labhatam devi sarvakamamshcadehi me || padmanane padmavipadmapatre
    padmapriye padmadalayatakshi || vishvapriye vishvamanonukule tvatpadapadmam mayi samnidhatsva || putrapautra
    dhanam dhanyam hastyashvadigave ratham || prajanam bhavasi mata ayushmamtam karotu me || dhanam agni
  devanagari: उरू पद्माक्षी पद्मसंभवे ॥ तन्मे भजसि पद्माक्षि येन सौख्यं लभाम्यहम् ॥ अश्वदायै गोदायै धनदायै
    महाधने ॥ धनं मे लभतां देवि सर्वकामांश्चदेहि मे ॥ पद्मानने पद्मविपद्मपत्रे पद्मप्रिये पद्मदलायताक्षि
    ॥ विश्वप्रिये विश्वमनोनुकूले त्वत्पादपद्मं मयि संनिधत्स्व ॥ पुत्रपौत्र धनं धान्यं हस्त्यश्वादिगवे
    रथम् ॥ प्रजानां भवसि माता आयुष्मंतं करोतु मे ॥ धनं अग्नि
meaning: {}
