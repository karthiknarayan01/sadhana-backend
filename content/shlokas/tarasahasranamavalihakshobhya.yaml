id: tarasahasranamavalihakshobhya
category: stotram
name:
  english: tarasahasranamavalihakshobhya
  devanagari: तारासहस्रनामावलिःअक्षोभ्य
content:
  english: karpuradhavalayai | yoginyai | yashasvinyai | yamyimyum yakinirupayai | yaimyaum yankararupinyai
    namah | 860 om yogamatre namah | yogagamyayai | yogamargaparayanayai | yogishayai | yojanayai | yamayai
    | yojanayutavistarayai | yathoktacaraniratayai | yathoktaphaladayinyai | yakshakardamasambhushayai
    | yavargarupinipatyai | ramanyai | ramanipritayai | ramayai | ratneshvaryai | ratyai | ratipriyayai
    | ratiratayai | ratitoshanatatparayai | ratnagarbhayai namah | 880 om ratnabijayai namah | rajivalocanayai
    | ramayai | rambijayai | rimsvarupayai | ramrimrumraim svarupinyai | raumrah varnasvarupayai | rajyadatryai
    | rasatulayai | rasatushtayai | rasagatyai | raghuvamshasamudbhavayai | ratirupayai | ratantayai |
    ratigarbhaparayanayai | rajivanetrayai | rajnyai | ramanasurakanyakayai | rajarajeshvaridrashtayai
    | raudryai namah | 900 om rudrapriyayai namah | hate | hadrakanyayai | hadrajayayai | hadramataratanandayai
    | hadrejyayai | trirupayai | ratrincaravibhedinyai | rakshasaghnyai | rakshanayai | rakshovidravinyai
    | ratayai | hacira
  devanagari: कर्पूरधवलायै । योगिन्यै । यशस्विन्यै । यांयींयूं याकिनीरूपायै । यैंयौं यङ्काररूपिण्यै नमः
    । ८६० ॐ योगमात्रे नमः । योगगम्यायै । योगमार्गपरायणायै । योगीशायै । योजनायै । यामायै । योजनायुतविस्तरायै
    । यथोक्ताचारनिरतायै । यथोक्तफलदायिन्यै । यक्षकर्दमसम्भूषायै । यवर्गरूपिणीपत्यै । रमण्यै । रमणीप्रीतायै
    । रमायै । रत्नेश्वर्यै । रत्यै । रतिप्रियायै । रतिरतायै । रतितोषणतत्परायै । रत्नगर्भायै नमः । ८८०
    ॐ रत्नबीजायै नमः । राजीवलोचनायै । रमायै । राम्बीजायै । रींस्वरूपायै । रांरींरूंरैं स्वरूपिण्यै । रौंरः
    वर्णस्वरूपायै । राज्यदात्र्यै । रसातुलायै । रसतुष्टायै । रसगत्यै । रघुवंशसमुद्भवायै । रतिरूपायै ।
    रतान्तायै । रतिगर्भपरायणायै । राजीवनेत्रायै । राज्ञ्यै । रमणासुरकन्यकायै । राजराजेश्वरीद्रष्टायै ।
    रौद्र्यै नमः । ९०० ॐ रुद्रप्रियायै नमः । हटे । हद्रकन्यायै । हद्रजायायै । हद्रमातारतानन्दायै । हद्रेज्यायै
    । त्रिरूपायै । रात्रिञ्चरविभेदिन्यै । राक्षसघ्न्यै । रक्षणायै । रक्षोविद्राविण्यै । रतायै । हचिरा
