id: ranganatha-ashtakam
category: stotram
name:
  english: Ranganatha Ashtakam
  devanagari: रङ्गनाथाष्टकम् (पुष्पा श्रीवत्सेन विरचितम्)
content:
  english: om shriramajayam om sadgurushrityagarajasvamine namo namah | om ranganathaya vidmahe | kshetrajnaya
    ca dhimahi | tannah shripah pracodayat || atha shriranganathashtakam | mahavishnum sadatranam bhaktabhayavarapradam
    | sudhaviksham salakshmikam ranganatham namamyaham || 1|| bhuvaikunthanivasam kam shriranganayakisaham
    | mutyabhasavikasam sam ranganatham namamyaham || 2|| mutyangisevasamharsham netrotsavasuvaibhavam
    | ekadashimahotsaham ranganatham namamyaham || 3|| nagarajasushaiyyam tam karunyanetrasusmitam | padadarshanasanmoksham
    ranganatham namamyaham || 4|| vibhishanapratishthartham puranalaya samsthitam | shrirangakshetramahatmyam
    ranganatham namamyaham || 5|| ramavataralilasvam kaveritiravasanam | gurukirtanasannutam ranganatham
    namamyaham || 6|| tyagarajagurusvamikambhojaragakirtitam | rangashayiharim vande bahukirtanasamstutam
    || 7|| mangalam ranganathaya salakshmikaya mangalam | mangalam gurugeyaya shriramaya(1) sumangalam
    || 8|| tyagarajagurusvamishishyapushpasamarpitam | gurusphurtisphutastotram ranganathashtakam shubham
    || iti sadgurushrityagarajasvaminah shishyaya bhaktaya pushpaya shrivaikunthaikadashidine gurau samarpitam
    gurusphurtisphutastotram shriranganathashtakam || om shubhamastu (1) shrirama shri ṟama / the delight
    of shri / ḻakshmi chomposed and translated by Pushpa shrivatsan (chopyright)
  devanagari: ॐ श्रीरामजयम् ॐ सद्गुरुश्रीत्यागराजस्वामिने नमो नमः । ॐ रङ्गनाथाय विद्महे । क्षेत्रज्ञाय
    च धीमहि । तन्नः श्रीपः प्रचोदयात् ॥ अथ श्रीरङ्गनाथाष्टकम् । महाविष्णुं सदात्राणं भक्ताभयवरप्रदम् ।
    सुधावीक्षं सलक्ष्मीकं रङ्गनाथं नमाम्यहम् ॥ १॥ भूवैकुण्ठनिवासं कं श्रीरङ्गनायकीसहम् । मुत्याभासविकासं
    सं रङ्गनाथं नमाम्यहम् ॥ २॥ मुत्याङ्गिसेवसंहर्षं नेत्रोत्सवसुवैभवम् । एकादशीमहोत्साहं रङ्गनाथं नमाम्यहम्
    ॥ ३॥ नागराजसुशैय्यं तं कारुण्यनेत्रसुस्मितम् । पाददर्शनसन्मोक्षं रङ्गनाथं नमाम्यहम् ॥ ४॥ विभीषणप्रतिष्ठार्थं
    पुराणालय संस्थितम् । श्रीरङ्गक्षेत्रमाहात्म्यं रङ्गनाथं नमाम्यहम् ॥ ५॥ रामावतारलीलस्वं कावेरीतीरवासनम्
    । गुरुकीर्तनसन्नूतं रङ्गनाथं नमाम्यहम् ॥ ६॥ त्यागराजगुरुस्वामिकाम्भोजरागकीर्तितम् । रङ्गशायिहरिं वन्दे
    बहुकीर्तनसंस्तुतम् ॥ ७॥ मङ्गलं रङ्गनाथाय सलक्ष्मीकाय मङ्गलम् । मङ्गलं गुरुगेयाय श्रीरामाय(१) सुमङ्गलम्
    ॥ ८॥ त्यागराजगुरुस्वामिशिष्यापुष्पासमर्पितम् । गुरुस्फूर्तिस्फुटस्तोत्रं रङ्गनाथाष्टकं शुभम् ॥ इति
    सद्गुरुश्रीत्यागराजस्वामिनः शिष्यया भक्तया पुष्पया श्रीवैकुण्ठैकादशीदिने गुरौ समर्पितम् गुरुस्फूर्तिस्फुटस्तोत्रम्
    श्रीरङ्गनाथाष्टकम् ॥ ॐ शुभमस्तु (१) श्रीराम ष्री ऱाम / थे डेलिघ्त् ओफ़् ष्री / ळक्ष्मी छोम्पोसेद् अन्द्
    त्रन्स्लतेद् ब्य् Pउश्प ष्रिवत्सन् (छोप्य्रिघ्त्)
