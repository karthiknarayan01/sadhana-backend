id: sukra-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sukra Ashtottara Sata Nama Stotram
  devanagari: शुक्राष्टोत्तरशतनामस्तोत्रम्
content:
  english: shukra bija mantra - om dra~ drim draum sah shukraya namah || shukrah shucih shubhagunah shubhadah
    shubhalakshanah | shobhanakshah shubhrarupah shuddhasphatikabhasvarah || 1|| dinartiharako daityaguruh
    devabhivanditah | kavyasaktah kamapalah kavih kaḻyanadayakah || 2|| bhadramurtirbhadraguno bhargavo
    bhaktapalanah | bhogado bhuvanadhyaksho bhuktimuktiphalapradah || 3|| carushilashcarurupashcarucandranibhananah
    | nidhirnikhilashastrajno nitividyadhurandharah || 4|| sarvalakshanasampannah sarvapadgunavarjitah
    | samanadhikanirmuktah sakalagamaparagah || 5|| bhrigurbhogakaro bhumisurapalanatatparah | manasvi
    manado manyo mayatito mahashayah || 6|| baliprasanno'bhayado bali balaparakramah | bhavapashaparityago
    balibandhavimocakah || 7|| ghanashayo ghanadhyaksho kambugrivah kaḻadharah | karunyarasasampurnah
    kaḻyanagunavardhanah || 8|| shvetambarah shvetavapuh caturbhujasamanvitah | akshamaladharo'cintyah
    akshinagunabhasurah || 9|| nakshatraganasancaro nayado nitimargadah | varshaprado hrishikeshah kleshanashakarah
    kavih || 10|| cintitarthapradah shantamatih cittasamadhikrit | adhivyadhiharo bhurivikramah punyadayakah
    || 11|| puranapurushah pujyah puruhutadisannutah | ajeyo vijitaratirvividhabharanojjvalah || 12||
    kundapushpapratikasho mandahaso mahamatih | muktaphalasamanabho muktido munisannutah || 13|| ratnasimhasanarudho
    rathastho rajataprabhah | suryapragdeshasancarah surashatrusuhrit kavih || 14|| tulavrishabharashisho
    durdharo dharmapalakah | bhagyado bhavyacaritro bhavapashavimocakah || 15|| gaudadesheshvaro gopta
    guni gunavibhushanah | jyeshthanakshatrasambhuto jyeshthah shreshthah shucismitah || 16|| apavargaprado'nantah
    santanaphaladayakah | sarvaishvaryapradah sarvagirvanaganasannutah || 17|| evam shukragrahasyaiva
    kramadashtottaram shatam | sarvapapaprashamanam sarvapunyaphalapradam || 18|| yah pathecchrunuyadvapi
    sarvankamanavapnuyat || 19|| Provided by manda khrishna shrikanth mandaksk at gmailॅom
  devanagari: शुक्र बीज मन्त्र - ॐ द्राँ द्रीं द्रौं सः शुक्राय नमः ॥ शुक्रः शुचिः शुभगुणः शुभदः शुभलक्षणः
    । शोभनाक्षः शुभ्ररूपः शुद्धस्फटिकभास्वरः ॥ १॥ दीनार्तिहारको दैत्यगुरुः देवाभिवन्दितः । काव्यासक्तः
    कामपालः कविः कळ्याणदायकः ॥ २॥ भद्रमूर्तिर्भद्रगुणो भार्गवो भक्तपालनः । भोगदो भुवनाध्यक्षो भुक्तिमुक्तिफलप्रदः
    ॥ ३॥ चारुशीलश्चारुरूपश्चारुचन्द्रनिभाननः । निधिर्निखिलशास्त्रज्ञो नीतिविद्याधुरन्धरः ॥ ४॥ सर्वलक्षणसम्पन्नः
    सर्वापद्गुणवर्जितः । समानाधिकनिर्मुक्तः सकलागमपारगः ॥ ५॥ भृगुर्भोगकरो भूमिसुरपालनतत्परः । मनस्वी मानदो
    मान्यो मायातीतो महाषयः ॥ ६॥ बलिप्रसन्नोऽभयदो बली बलपराक्रमः । भवपाशपरित्यागो बलिबन्धविमोचकः ॥ ७॥ घनाशयो
    घनाध्यक्षो कम्बुग्रीवः कळाधरः । कारुण्यरससम्पूर्णः कळ्याणगुणवर्धनः ॥ ८॥ श्वेताम्बरः श्वेतवपुः चतुर्भुजसमन्वितः
    । अक्षमालाधरोऽचिन्त्यः अक्षीणगुणभासुरः ॥ ९॥ नक्षत्रगणसञ्चारो नयदो नीतिमार्गदः । वर्षप्रदो हृषीकेशः
    क्लेशनाशकरः कविः ॥ १०॥ चिन्तितार्थप्रदः शान्तमतिः चित्तसमाधिकृत् । आधिव्याधिहरो भूरिविक्रमः पुण्यदायकः
    ॥ ११॥ पुराणपुरुषः पूज्यः पुरुहूतादिसन्नुतः । अजेयो विजितारातिर्विविधाभरणोज्ज्वलः ॥ १२॥ कुन्दपुष्पप्रतीकाशो
    मन्दहासो महामतिः । मुक्ताफलसमानाभो मुक्तिदो मुनिसन्नुतः ॥ १३॥ रत्नसिंहासनारूढो रथस्थो रजतप्रभः । सूर्यप्राग्देशसञ्चारः
    सुरशत्रुसुहृत् कविः ॥ १४॥ तुलावृषभराशीशो दुर्धरो धर्मपालकः । भाग्यदो भव्यचारित्रो भवपाशविमोचकः ॥ १५॥
    गौडदेशेश्वरो गोप्ता गुणी गुणविभूषणः । ज्येष्ठानक्षत्रसम्भूतो ज्येष्ठः श्रेष्ठः शुचिस्मितः ॥ १६॥ अपवर्गप्रदोऽनन्तः
    सन्तानफलदायकः । सर्वैश्वर्यप्रदः सर्वगीर्वाणगणसन्नुतः ॥ १७॥ एवं शुक्रग्रहस्यैव क्रमादष्टोत्तरं शतम्
    । सर्वपापप्रशमनम् सर्वपुण्यफलप्रदम् ॥ १८॥ यः पठेच्छ्रुणुयाद्वापि सर्वान्कामानवाप्नुयात् ॥ १९॥ Pरोविदेद्
    ब्य् ंअन्द ख़्रिश्न श्रिकन्थ् मन्दक्स्क् अत् ग्मैल्ॅओम्
