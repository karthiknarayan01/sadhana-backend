id: varahastotramdharani
category: stotram
name:
  english: varahastotramdharani
  devanagari: वराहस्तोत्रम्धरणि
content:
  english: ringa mahabhuja || 1|| uddhritasmi tvaya deva kalpadau sagarambhasah | sahasrabahuna vishno
    dharayami jagantyaham || 2|| anekadivyabharanayajnasutravirajita | arunarunambaradhara divyaratnavibhushita
    || 3|| udyadbhanupratikashapadapadma namo namah | balacandrabhadamshtragramahabalaparakrama || 4||
    divyacandanaliptanga taptakancanakundala | indranilamanidyotihemangadavibhushita || 5|| vajradamshtragranirbhinnahiranyaksha
    mahabala | pundarikabhiramaksha samasvanamanohara || 6|| shrutisimantabhushatmansarvatmamshcaruvikrama
    | caturananashambhubhyam vanditayatalocana || 7|| sarvavidyamayakara shabdatita namo namah | anandavigraha'nanta
    kalakala namo namah || 8|| iti stutva'cala devi vavande padayorvibhum | iti shriskandapurane vaishnavakhande
    venkatacalamahatmye prathamadhyayantargatam dharanikritam varahastotram samaptam |
  devanagari: ृङ्ग महाभुज ॥ १॥ उद्धृतास्मि त्वया देव कल्पादौ सागराम्भसः । सहस्रबाहुना विष्णो धारयामि जगन्त्यहम्
    ॥ २॥ अनेकदिव्याभरणयज्ञसूत्रविराजित । अरुणारुणाम्बरधर दिव्यरत्नविभूषित ॥ ३॥ उद्यद्भानुप्रतीकाशपादपद्म
    नमो नमः । बालचन्द्राभदंष्ट्राग्रमहाबलपराक्रम ॥ ४॥ दिव्यचन्दनलिप्ताङ्ग तप्तकाञ्चनकुण्डल । इन्द्रनीलमणिद्योतिहेमाङ्गदविभूषित
    ॥ ५॥ वज्रदंष्ट्राग्रनिर्भिन्नहिरण्याक्ष महाबल । पुण्डरीकाभिरामाक्ष सामस्वनमनोहर ॥ ६॥ श्रुतिसीमन्तभूषात्मन्सर्वात्मंश्चारुविक्रम
    । चतुराननशम्भुभ्यां वन्दितायतलोचन ॥ ७॥ सर्वविद्यामयाकार शब्दातीत नमो नमः । आनन्दविग्रहाऽनन्त कालकाल
    नमो नमः ॥ ८॥ इति स्तुत्वाऽचला देवी ववन्दे पादयोर्विभुम् । इति श्रीस्कन्दपुराणे वैष्णवखण्डे वेङ्कटाचलमाहात्म्ये
    प्रथमाध्यायान्तर्गतं धरणिकृतं वराहस्तोत्रं समाप्तम् ।
