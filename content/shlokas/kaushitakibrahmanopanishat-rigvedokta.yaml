id: kaushitakibrahmanopanishat-rigvedokta
category: upanishad
name:
  english: kaushitakibrahmanopanishat (rigvedokta)
  devanagari: कौषीतकिब्राह्मणोपनिषत् (ऋग्वेदोक्त)
content:
  english: kaushitakibrahmanopanishat shrimatkaushitakividyavedyaprajnaparaksharam | pratiyogivinirmuktabrahmamatram
    vicintaye || om vanme manasi pratishthita | mano me vaci pratishthitam | aviravirma edhi | vedasya
    ma anisthah | shrutam me ma prahasih | anenadhitenahoratransandadhami | ritam vadishyami | satyam
    vadishyami | tanmamavatu | tadvaktaramavatu | avatu mamavatu vaktaram || citro ha vai gargyayaniryakshamana
    arunim vavre sa ha putram shvetaketum prajighaya yajayeti tam hasinam papraccha gautamasya putraste
    samvritam loke yasminmadhasyasyanyamaho baddhva tasya loke dhasyasiti sa hovaca nahametadveda hantacaryam
    pracchaniti sa ha pitaramasadya papracchetiti ma prakshitkatham pratibravaniti sa hovacahamapyetanna
    veda sadasyeva vayam svadhyayamadhitya haramahe yannah pare dadatyehyubhau gamishyava iti || sa ha
    samitpanishcitram gargyayanim praticakrama upayaniti tam hovaca brahmarhosi gautama yo mamupaga ehi
    tva jnapayishyamiti || 1|| sa hovaca ye vaike casmallokatprayanti candramasameva te sarve gacchanti
    tesham pranaih purvapaksha apyayate'thaparapakshe na prajanayatyetadvai svargasya lokasya dvaram yashcandramastam
    yatpratyaha tamatisrijate ya enam pratyaha tamiha vrishtirbhutva varshati sa iha kito va patango va
    shakunirva shardulo va simho va matsyo va parashva va purusho vanyo vaiteshu sthaneshu pratyajayate
    yathakarmam yathavidyam tamagatam pricchati ko'siti tam pratibruyadvicakshanadritavo reta abhritam
    pancadashatprasutatpitryavatastanma pumsi kartaryerayadhvam pumsa kartra matari masishiktah sa jayamana
    upajayamano dvadashatrayodasha upamaso dvadashatrayodashena pitra santadvideham pratitadvideham tanma
    ritavo martyava arabhadhvam tena satyena tapasarturasmyartavo'smi ko'si tvamasmiti tamatisrijate ||
    2|| sa etam devayanam panthanamasadyagnilokamagacchati sa vayulokam sa varunalokam sa adityalokam
    sa indralokam sa prajapatilokam sa brahmalokam tasya ha va etasya brahmalokasyarohrido muhurta yeshtiha
    viraja nadi tilyo vrikshah sayujyam samsthanamaparajitamayatanamindraprajapati dvaragopau vibhum pramitam
    vicakshanasandhyamitaujah prayankah priya ca manasi pratirupa ca cakshushi pushpanyadayavayatau vai
    ca jagatyambashcambavayavashcapsarasom'bayanadyastamitthamvida a gacchati tam brahmahabhidhavata mama
    yashasa virajam vayam nadim prapannavanayam jigishyatiti || 3|| tam pancashatanyapsarasam pratidhavanti
    shatam malahastah shatamanjanahastah shatam curnahastah shatam vasohastah shatam kanahastastam brahmalankarenalankurvanti
    sa brahmalankarenalankrito brahma vidvan brahmaivabhipraiti sa agacchatyaram hridam tanmanasatyeti
    tamritva samprativido majjanti sa agacchati muhurtanyeshtihamste'smadapadravanti sa agacchati virajam
    nadim tam manasaivatyeti tatsukritadushkrite dhunute tasya priya jnatayah sukritamupayantyapriya dushkritam
    tadyatha rathena dhavayanrathacakre paryavekshata evamahoratre paryavekshata evam sukritadushkrite
    sarvani ca dvandvani sa esha visukrito vidushkrito brahma vidvanbrahmaivabhipraiti ||4|| sa agacchati
    tilyam vriksham tam brahmagandhah pravishati sa agacchati sayujyam samsthanam tam brahma sa pravishati
    agacchatyaparajitamayatanam tam brahmatejah pravishati sa agacchatindraprajapati dvaragopau tavasmadapadravatah
    sa agacchati vibhupramitam tam brahmayashah pravishati sa agacchati vicakshanamasandim brihadrathantare
    samani purvau padau dhyaita naudhase caparau padau vairupavairaje shakvararaivate tirashci sa prajna
    prajnaya hi vipashyati sa agacchatyamitaujasam paryankam sa pranastasya bhutam ca bhavishyacca purvau
    padau shrishcera caparau brihadrathantare anucye bhadrayajnayajniye shirshanyamricashca samani ca
    pracinatanam yajumshi tirashcinani somamshava upastaranamudgitha upashrih shrirupabarhanam tasminbrahmaste
    tamitthamvitpadenaivagra arohati tam brahmaha ko'siti tam pratibruyat || 5|| riturasmyartavo'smyakashadyoneh
    sambhuto bharyayai retah samvatsarasya tejobhutasya bhutasyatmabhutasya tvamatmasi yastvamasi sohamasmiti
    tamaha ko'hamasmiti satyamiti bruyatkim tadyatsatyamiti yadanyaddevebhyashca pranebhyashca tatsadatha
    yaddevacca pranashca tadyam tadetaya vacabhivyahriyate satyamityetavadidam sarvamidam sarvamasityevainam
    tadaha tadetacchlokenapyuktam || 6|| yajudarah samashira asavrinmurtiravyayah | sa brahmeti hi vijneya
    rishirbrahmamayo mahaniti || tamaha kena paumsrani namanyapnotiti praneneti bruyatkena strinamaniti
    vaceti kena napumsakanamaniti manaseti kena gandhaniti ghraneneti bruyatkena rupaniti cakshusheti
    kena shabdaniti shrotreneti kenannarasaniti jihvayeti kena karmaniti hastabhyamiti kena sukhaduhkhe
    iti sharireneti kenanandam ratim prajapatimityupastheneti kenetya iti padabhyamiti kena dhiyo vijnatavyam
    kamaniti prajnayeti prabruyattamahapo vai khalu me hyasavayam te loka iti sa ya brahmani citirya vyashtistam
    citim jayati tam vyashtim vyashnute ya evam veda ya evam veda || 7|| prathamo'dhyayah || 1|| prano
    brahmeti ha smaha kaushitakistasya ha va etasya pranasya brahmano mano dutam vakpariveshtri cakshurgatram
    shrotram samshravayitri yo ha va etasya pranasya brahmano mano dutam veda dutavanbhavati yo vacam
    pariveshtrim pariveshtrimanbhavati tasmai va etasmai pranaya brahmana etah sarva devata ayacamana
    balim haranti tatho evasmai sarvani bhutanyayacamanayaiva balim haranti ya evam veda tasyopanishanna
    yacediti tadyatha gramam bhikshitva labdhopavishennahagato dattamashniyamiti ya evainam purastatpratyacakshiramsta
    evainamupamantrayante dadama ta ityesha dharmo yacato bhavatyanantarastevainamupamantrayante dadama
    ta iti || 1|| athata ekadhanavarodhanam yadekadhanamabhidhyayatpaurnamasyam vamavasyam va shuddhapakshe
    va punye nakshatre'gnimupasamadhaya parisamuhya paristirya paryuksha purvadakshinam janvacya sruvena
    va camasena va kamsena vaita ajyahutirjuhoti vannamadevatavarodhini sa me'mushmadidamavarunddham tasyai
    svaha cakshurnama devatavarodhini sa me'mushmadidamavarunddham tasyai svaha shrotram nama devatavarodhini
    sa me'mushmadidamavarunddham tasyai svaha mano nama devatavarodhini sa me'mushmadidamavarunddham tasyai
    svahaityatha dhumagandham prajighayajyalepenanganyanuvimrijya vacamyamo'bhipravrijyartham bravita
    dutam va prahinuyallabhate haiva || 3|| athato daivasmaro yasya priyo bubhusheyasyai va esham vaiteshamevaitasminparvanyagnimupasamadhayaitayaivavritaita
    juhomyasau svaha cakshuste mayi juhomyasau svaha prajnanam te mayi juhomyasau svahetyatha dhumagandham
    prajighayajyalepenanganyanuvimrijya vacamyamo'bhipravrijya samsparsham jigamishedapi vatadva sambhashamanastishthetpriyo
    haiva bhavati smaranti haivasya || 4|| athatah sayamannam pratardanamamtaramagnihotramityacakshate
    yavadvai purusho bhasate na tavatpranitum shaknoti pranam tada vaci juhoti yavadvai purushah praniti
    na tavadbhashitum shaknoti vacam tada prane juhotyete'nante'mritahutirjagracca svapamshca santatamavacchinnam
    juhotyatha ya anya ahutayo'ntavatyastah karmamayyobhavantyetaddha vai purve vidvamso'gnihotram juhavamcakruh||
    5|| uktham brahmeti ha smaha shushkabhringarastadrigityupasita sarvani hasmai bhutani shraishthyayabhyarcyante
    tadyajurityupasita sarvani hasmai bhutani shraishthyaya yujyante tatsametyupasita sarvani hasmai bhutani
    shraishthyaya sannamante tacchrityupasita tadyasha ityupasita tatteja ityupasita tadyathaitaccha stranam
    shrimattamam yashasvitamam tejasvitamam bhavati tatho evaivam vidvansarvesham bhutanam shrimattamo
    yashasvitamastejasvitamo bhavati tametamaishtakam karmamayamatmanamadhvaryuh samskaroti tasminyajurbhayam
    pravayati yajurmayam rinmayam hota rinmayam samamayamudgata sa esha sarvasyai trayividyaya atmaisha
    uta evasyatyaitadatma bhavati evam veda || 6|| athatah sarvajitah kaushitakesrinyupasanani bhavanti
    yajnopavitam kritvapa acamya trirudapatram prasicyodyantamadityamupatishtheta vargo'si papmanam me
    vrindhityetayaivavrita madhye santamudvargo'si papmanam ma uddhrindhityetayaivavritaste yantam samvargo'si
    papmanam me samvrindhiti yadahoratrabhyam papam karoti santaddhrinkte || 7|| atha masi masyamavasyayam
    pashcaccandramasam drishyamanamupatishthetaivavrita haritatrinabhyamatha vak pratyasyati yatte susimam
    hridayamadhicandramasi shritam || tenamritatvasyeshanam maham pautramagham rudamiti na hasmatpurvah
    prajah prayantiti na jataputrasyathajataputrasyaha || apyasva sametu te sante payamsi samuyantu vaja
    yamaditya amshumapyayayantityetastisra rico japitva nasmakam pranena prajaya pashubhirapyasveti daivimavritamavarta
    adityasyavritamanvavartayati dakshinam bahumanvavartate || 8|| atha paurnamasyam purastaccandramasam
    drishyamanamupatishthetaitayaivavrita somo rajasi vicakshanah pancamukho'si prajapatirbrahmanasta
    ekam mukham tena mukhena rajno'tsi tena mukhena mamannadam kuru || raja ta ekam mukham tena mukhena
    vishotsi tenaiva mukhena mamannadam kuru || shyenasta ekam mukham tena mukhena pakshino'tsi tena mukhena
    mamannadam kuru || agnista ekam mukham tena mukhenemam lokamatsi tena mukhena mamannadam kuru || sarvani
    bhutanityeva pancamam mukham tena mukhena sarvani bhutanyatsi tena mukhena mamannadam kuru || masmakam
    pranena prajaya pashubhiravaksheshtha yo'smadveshti yam ca vayam dvishmastasya pranena prajaya pashubhiravakshiyasveti
    sthitirdaivimavritamavarta adityasyavritamanvavartanta iti dakshinam bahumanvavartate || 9|| atha
    samveshyanjayayai hridayamabhimrishet || yatte susime hridaye hitamantah prajapatau || manye'ham mam
    tadvidvamsam maham pautramagham rudamiti na hasmatpurvah prajah praiti || 10|| atha proshyanputrasya
    murdhanamabhimrishati || angadangatsambhavasi hridayadadhijayase | atma vai putranamasi sa jiva sharadah
    shatam || asaviti namasya grihnati | ashma bhava parashurbhava hiranyamastritam bhava | tejo vai putranamasi
    sa jiva sharadah shatam || asaviti namasi grihnati| yena prajapatih prajah paryagrihnitarishtyai tena
    tva parigrihnamyasavityathasya dakshine karne japati || asme prayandhi maghavannrijishinnitindrashreshthani
    dravinani dhehiti macchetta ma vyathishthah shatam sharada ayusho jiva putra | te namna murdhanamabhijighramyasaviti
    trirasya murdhanamabhijighredgava tva hinkarenabhihinkaromiti trirasya murdhanamabhihinkuryat || 11||
    athato daivah parimara etadvai brahma dipyate yadagnirjvalatyathaitanmriyate yanna jvalati tasyadityameva
    tejo gacchati vayum prana etadvai brahma dipyate yathadityo drishyate'thaitanmriyate yanna drishyate
    tasya candramasameva tejo gacchati vayum prana etadvai brahma dipyate yaccandrama drishyate'thaitanmriyate
    yanna drishyate tasya vidyutameva tejo gacchati vayum prana etadvai brahma dipyate yadvidyudvidyotate'thaitanmriyate
    yanna vidyotate tasya vayumeva tejo gacchati vayum pranasta va etah sarva devata vayumeva pravishya
    vayau sripta na murcchante tasmadeva punarudirata ityadhidaivatamathadhyatmam || 12|| etadvai brahma
    dipyate yadvaca vadatyathaitanmriyate yanna valati tasya cakshureva tejo gacchati pranam prana etadvai
    brahma dipyate yaccakshusha pashyatyathaitanmriyate yanna pashyati tasya shrotrameva tejo gacchati
    pranam prana etadvai brahma dipyate yacchotrena sha
  devanagari: कौषीतकिब्राह्मणोपनिषत् श्रीमत्कौषीतकीविद्यावेद्यप्रज्ञापराक्षरम् । प्रतियोगिविनिर्मुक्तब्रह्ममात्रं
    विचिन्तये ॥ ॐ वाङ्मे मनसि प्रतिष्ठिता । मनो मे वाचि प्रतिष्ठितम् । आविरावीर्म एधि । वेदस्य मा आणीस्थः
    । श्रुतं मे मा प्रहासीः । अनेनाधीतेनाहोरात्रान्सन्दधामि । ऋतं वदिष्यामि । सत्यं वदिष्यामि । तन्मामवतु
    । तद्वक्तारमवतु । अवतु मामवतु वक्तारम् ॥ चित्रो ह वै गार्ग्यायणिर्यक्षमाण आरुणिं वव्रे स ह पुत्रं
    श्वेतकेतुं प्रजिघाय याजयेति तं हासीनं पप्रच्छ गौतमस्य पुत्रास्ते संवृतं लोके यस्मिन्माधास्यस्यन्यमहो
    बद्ध्वा तस्य लोके धास्यसीति स होवाच नाहमेतद्वेद हन्ताचार्यं प्रच्छानीति स ह पितरमासाद्य पप्रच्छेतीति
    मा प्राक्षीत्कथं प्रतिब्रवाणीति स होवाचाहमप्येतन्न वेद सदस्येव वयं स्वाध्यायमधीत्य हरामहे यन्नः परे
    ददत्येह्युभौ गमिष्याव इति ॥ स ह समित्पाणिश्चित्रं गार्ग्यायणिं प्रतिचक्रम उपायानीति तं होवाच ब्रह्मार्होसि
    गौतम यो मामुपागा एहि त्वा ज्ञपयिष्यामीति ॥ १॥ स होवाच ये वैके चास्माल्लोकात्प्रयन्ति चन्द्रमसमेव ते
    सर्वे गच्छन्ति तेषां प्राणैः पूर्वपक्ष आप्यायतेऽथापरपक्षे न प्रजनयत्येतद्वै स्वर्गस्य लोकस्य द्वारं
    यश्चन्द्रमास्तं यत्प्रत्याह तमतिसृजते य एनं प्रत्याह तमिह वृष्टिर्भूत्वा वर्षति स इह कीटो वा पतङ्गो
    वा शकुनिर्वा शार्दूलो वा सिंहो वा मत्स्यो वा परश्वा वा पुरुषो वान्यो वैतेषु स्थानेषु प्रत्याजायते
    यथाकर्मं यथाविद्यं तमागतं पृच्छति कोऽसीति तं प्रतिब्रूयाद्विचक्षणादृतवो रेत आभृतं पञ्चदशात्प्रसूतात्पित्र्यावतस्तन्मा
    पुंसि कर्तर्येरयध्वं पुंसा कर्त्रा मातरि मासिषिक्तः स जायमान उपजायमानो द्वादशत्रयोदश उपमासो द्वादशत्रयोदशेन
    पित्रा सन्तद्विदेहं प्रतितद्विदेहं तन्म ऋतवो मर्त्यव आरभध्वं तेन सत्येन तपसर्तुरस्म्यार्तवोऽस्मि कोऽसि
    त्वमस्मीति तमतिसृजते ॥ २॥ स एतं देवयानं पन्थानमासाद्याग्निलोकमागच्छति स वायुलोकं स वरुणलोकं स आदित्यलोकं
    स इन्द्रलोकं स प्रजापतिलोकं स ब्रह्मलोकं तस्य ह वा एतस्य ब्रह्मलोकस्यारोहृदो मुहूर्ता येष्टिहा विरजा
    नदी तिल्यो वृक्षः सायुज्यं संस्थानमपराजितमायतनमिन्द्रप्रजापती द्वारगोपौ विभुं प्रमितं विचक्षणासन्ध्यमितौजाः
    प्रयङ्कः प्रिया च मानसी प्रतिरूपा च चाक्षुषी पुष्पाण्यादायावयतौ वै च जगत्यम्बाश्चाम्बावयवाश्चाप्सरसोंऽबयानद्यस्तमित्थंविद
    अ गच्छति तं ब्रह्माहाभिधावत मम यशसा विरजां वायं नदीं प्रापन्नवानयं जिगीष्यतीति ॥ ३॥ तं पञ्चशतान्यप्सरसां
    प्रतिधावन्ति शतं मालाहस्ताः शतमाञ्जनहस्ताः शतं चूर्णहस्ताः शतं वासोहस्ताः शतं कणाहस्तास्तं ब्रह्मालङ्कारेणालङ्कुर्वन्ति
    स ब्रह्मालङ्कारेणालङ्कृतो ब्रह्म विद्वान् ब्रह्मैवाभिप्रैति स आगच्छत्यारं हृदं तन्मनसात्येति तमृत्वा
    सम्प्रतिविदो मज्जन्ति स आगच्छति मुहूर्तान्येष्टिहांस्तेऽस्मादपद्रवन्ति स आगच्छति विरजां नदीं तां मनसैवात्येति
    तत्सुकृतदुष्कृते धूनुते तस्य प्रिया ज्ञातयः सुकृतमुपयन्त्यप्रिया दुष्कृतं तद्यथा रथेन धावयन्रथचक्रे
    पर्यवेक्षत एवमहोरात्रे पर्यवेक्षत एवं सुकृतदुष्कृते सर्वाणि च द्वन्द्वानि स एष विसुकृतो विदुष्कृतो
    ब्रह्म विद्वान्ब्रह्मैवाभिप्रैति ॥४॥ स आगच्छति तिल्यं वृक्षं तं ब्रह्मगन्धः प्रविशति स आगच्छति सायुज्यं
    संस्थानं तं ब्रह्म स प्रविशति आगच्छत्यपराजितमायतनं तं ब्रह्मतेजः प्रविशति स आगच्छतीन्द्रप्रजापती द्वारगोपौ
    तावस्मादपद्रवतः स आगच्छति विभुप्रमितं तं ब्रह्मयशः प्रविशति स आगच्छति विचक्षणामासन्दीं बृहद्रथन्तरे
    सामनी पूर्वौ पादौ ध्यैत नौधसे चापरौ पादौ वैरूपवैराजे शाक्वररैवते तिरश्ची सा प्रज्ञा प्रज्ञया हि विपश्यति
    स आगच्छत्यमितौजसं पर्यङ्कं स प्राणस्तस्य भूतं च भविष्यच्च पूर्वौ पादौ श्रीश्चेरा चापरौ बृहद्रथन्तरे
    अनूच्ये भद्रयज्ञायज्ञीये शीर्षण्यमृचश्च सामानि च प्राचीनातानं यजूंषि तिरश्चीनानि सोमांशव उपस्तरणमुद्गीथ
    उपश्रीः श्रीरुपबर्हणं तस्मिन्ब्रह्मास्ते तमित्थंवित्पादेनैवाग्र आरोहति तं ब्रह्माह कोऽसीति तं प्रतिब्रूयात्
    ॥ ५॥ ऋतुरस्म्यार्तवोऽस्म्याकाशाद्योनेः सम्भूतो भार्यायै रेतः संवत्सरस्य तेजोभूतस्य भूतस्यात्मभूतस्य
    त्वमात्मासि यस्त्वमसि सोहमस्मीति तमाह कोऽहमस्मीति सत्यमिति ब्रूयात्किं तद्यत्सत्यमिति यदन्यद्देवेभ्यश्च
    प्राणेभ्यश्च तत्सदथ यद्देवाच्च प्राणाश्च तद्यं तदेतया वाचाभिव्याह्रियते सत्यमित्येतावदिदं सर्वमिदं
    सर्वमसीत्येवैनं तदाह तदेतच्छ्लोकेनाप्युक्तम् ॥ ६॥ यजूदरः सामशिरा असावृङ्मूर्तिरव्ययः । स ब्रह्मेति
    हि विज्ञेय ऋषिर्ब्रह्ममयो महानिति ॥ तमाह केन पौंस्रानि नामान्याप्नोतीति प्राणेनेति ब्रूयात्केन स्त्रीनामानीति
    वाचेति केन नपुंसकनामानीति मनसेति केन गन्धानिति घ्राणेनेति ब्रूयात्केन रूपाणीति चक्षुषेति केन शब्दानिति
    श्रोत्रेणेति केनान्नरसानिति जिह्वयेति केन कर्माणीति हस्ताभ्यामिति केन सुखदुःखे इति शरीरेणेति केनानन्दं
    रतिं प्रजापतिमित्युपस्थेनेति केनेत्या इति पादाभ्यामिति केन धियो विज्ञातव्यं कामानिति प्रज्ञयेति प्रब्रूयात्तमहापो
    वै खलु मे ह्यसावयं ते लोक इति सा या ब्रह्मणि चितिर्या व्यष्टिस्तां चितिं जयति तां व्यष्टिं व्यश्नुते
    य एवं वेद य एवं वेद ॥ ७॥ प्रथमोऽध्यायः ॥ १॥ प्राणो ब्रह्मेति ह स्माह कौषीतकिस्तस्य ह वा एतस्य प्राणस्य
    ब्रह्मणो मनो दूतं वाक्परिवेष्ट्री चक्षुर्गात्रं श्रोत्रं संश्रावयितृ यो ह वा एतस्य प्राणस्य ब्रह्मणो
    मनो दूतं वेद दूतवान्भवति यो वाचं परिवेष्ट्रीं परिवेष्ट्रीमान्भवति तस्मै वा एतस्मै प्राणाय ब्रह्मण
    एताः सर्वा देवता अयाचमाना बलिं हरन्ति तथो एवास्मै सर्वाणि भूतान्ययाचमानायैव बलिं हरन्ति य एवं वेद
    तस्योपनिषन्न याचेदिति तद्यथा ग्रामं भिक्षित्वा लब्धोपविशेन्नाहगतो दत्तमश्नीयामिति य एवैनं पुरस्तात्प्रत्याचक्षीरंस्त
    एवैनमुपमन्त्रयन्ते ददाम त इत्येष धर्मो याचतो भवत्यनन्तरस्तेवैनमुपमन्त्रयन्ते ददाम त इति ॥ १॥ अथात
    एकधनावरोधनं यदेकधनमभिध्यायात्पौर्णमास्यां वामावास्यां वा शुद्धपक्षे वा पुण्ये नक्षत्रेऽग्निमुपसमाधाय
    परिसमुह्य परिस्तीर्य पर्युक्ष पूर्वदक्षिणं जान्वाच्य स्रुवेण वा चमसेन वा कंसेन वैता आज्याहुतीर्जुहोति
    वाङ्नामदेवतावरोधिनी सा मेऽमुष्मादिदमवरुन्द्धां तस्यै स्वाहा चक्षुर्नाम देवतावरोधिनी सा मेऽमुष्मादिदमवरुन्द्धां
    तस्यै स्वाहा श्रोत्रं नाम देवतावरोधिनी सा मेऽमुष्मादिदमवरुन्द्धां तस्यै स्वाहा मनो नाम देवतावरोधिनी
    सा मेऽमुष्मादिदमवरुन्द्धां तस्यै स्वाहैत्यथ धूमगन्धं प्रजिघायाज्यलेपेनाङ्गान्यनुविमृज्य वाचंयमोऽभिप्रवृज्यार्थं
    ब्रवीत दूतं वा प्रहिणुयाल्लभते हैव ॥ ३॥ अथातो दैवस्मरो यस्य प्रियो बुभूषेयस्यै वा एषां वैतेषमेवैतस्मिन्पर्वण्यग्निमुपसमाधायैतयैवावृतैता
    जुहोम्यसौ स्वाहा चक्षुस्ते मयि जुहोम्यसौ स्वाहा प्रज्ञानं ते मयि जुहोम्यसौ स्वाहेत्यथ धूमगन्धं प्रजिघायाज्यलेपेनाङ्गान्यनुविमृज्य
    वाचंयमोऽभिप्रवृज्य संस्पर्शं जिगमिषेदपि वाताद्वा सम्भाषमाणस्तिष्ठेत्प्रियो हैव भवति स्मरन्ति हैवास्य
    ॥ ४॥ अथातः सायमन्नं प्रातर्दनमम्तरमग्निहोत्रमित्याचक्षते यावद्वै पुरुषो भासते न तावत्प्राणितुं शक्नोति
    प्राणं तदा वाचि जुहोति यावद्वै पुरुषः प्राणिति न तावद्भाषितुं शक्नोति वाचं तदा प्राणे जुहोत्येतेऽनन्तेऽमृताहुतिर्जाग्रच्च
    स्वपंश्च सन्ततमवच्छिन्नं जुहोत्यथ या अन्या आहुतयोऽन्तवत्यस्ताः कर्ममय्योभवन्त्येतद्ध वै पूर्वे विद्वांसोऽग्निहोत्रं
    जुहवांचक्रुः॥ ५॥ उक्थं ब्रह्मेति ह स्माह शुष्कभृङ्गरस्तदृगित्युपासीत सर्वाणि हास्मै भूतानि श्रैष्ठ्यायाभ्यर्च्यन्ते
    तद्यजुरित्युपासीत सर्वाणि हास्मै भूतानि श्रैष्ठ्याय युज्यन्ते तत्सामेत्युपासीत सर्वाणि हास्मै भूतानि
    श्रैष्ठ्याय सन्नमन्ते तच्छ्रीत्युपासीत तद्यश इत्युपासीत तत्तेज इत्युपासीत तद्यथैतच्छा स्त्राणां श्रीमत्तमं
    यशस्वितमं तेजस्वितमं भवति तथो एवैवं विद्वान्सर्वेषां भूतानां श्रीमत्तमो यशस्वितमस्तेजस्वितमो भवति
    तमेतमैष्टकं कर्ममयमात्मानमध्वर्युः संस्करोति तस्मिन्यजुर्भयं प्रवयति यजुर्मयं ऋङ्मयं होता ऋङ्मयं साममयमुद्गाता
    स एष सर्वस्यै त्रयीविद्याया आत्मैष उत एवास्यात्यैतदात्मा भवति एवं वेद ॥ ६॥ अथातः सर्वजितः कौषीतकेस्रीण्युपासनानि
    भवन्ति यज्ञोपवीतं कृत्वाप आचम्य त्रिरुदपात्रं प्रसिच्योद्यन्तमादित्यमुपतिष्ठेत वर्गोऽसि पाप्मानं मे
    वृङ्धीत्येतयैवावृता मध्ये सन्तमुद्वर्गोऽसि पाप्मानं म उद्धृङ्धीत्येतयैवावृतास्ते यन्तं संवर्गोऽसि
    पाप्मानं मे संवृङ्धीति यदहोरात्राभ्यां पापं करोति सन्तद्धृङ्क्ते ॥ ७॥ अथ मासि मास्यमावास्यायां पश्चाच्चन्द्रमसं
    दृश्यमानमुपतिष्ठेतैवावृता हरिततृणाभ्यामथ वाक् प्रत्यस्यति यत्ते सुसीमं हृदयमधिचन्द्रमसि श्रितम् ॥
    तेनामृतत्वस्येशानं माहं पौत्रमघं रुदमिति न हास्मात्पूर्वाः प्रजाः प्रयन्तीति न जातपुत्रस्याथाजातपुत्रस्याह
    ॥ आप्यास्व समेतु ते सन्ते पयांसि समुयन्तु वाजा यमादित्या अंशुमाप्याययन्तीत्येतास्तिस्र ऋचो जपित्वा
    नास्माकं प्राणेन प्रजया पशुभिराप्यस्वेति दैवीमावृतमावर्त आदित्यस्यावृतमन्वावर्तयति दक्षिणं बाहुमन्वावर्तते
    ॥ ८॥ अथ पौर्णमास्यां पुरस्ताच्चन्द्रमसं दृश्यमानमुपतिष्ठेतैतयैवावृता सोमो राजासि विचक्षणः पञ्चमुखोऽसि
    प्रजापतिर्ब्राह्मणस्त एकं मुखं तेन मुखेन राज्ञोऽत्सि तेन मुखेन मामन्नादं कुरु ॥ राजा त एकं मुखं तेन
    मुखेन विशोत्सि तेनैव मुखेन मामन्नादं कुरु ॥ श्येनस्त एकं मुखं तेन मुखेन पक्षिणोऽत्सि तेन मुखेन मामन्नादं
    कुरु ॥ अग्निस्त एकं मुखं तेन मुखेनेमं लोकमत्सि तेन मुखेन मामन्नादं कुरु ॥ सर्वाणि भूतानीत्येव पञ्चमं
    मुखं तेन मुखेन सर्वाणि भूतान्यत्सि तेन मुखेन मामन्नादं कुरु ॥ मास्माकं प्राणेन प्रजया पशुभिरवक्षेष्ठा
    योऽस्माद्वेष्टि यं च वयं द्विष्मस्तस्य प्राणेन प्रजया पशुभिरवक्षीयस्वेति स्थितिर्दैवीमावृतमावर्त आदित्यस्यावृतमन्वावर्तन्त
    इति दक्षिणं बाहुमन्वावर्तते ॥ ९॥ अथ संवेश्यन्जायायै हृदयमभिमृशेत् ॥ यत्ते सुसीमे हृदये हितमन्तः प्रजापतौ
    ॥ मन्येऽहं मां तद्विद्वांसं माहं पौत्रमघं रुदमिति न हास्मत्पूर्वाः प्रजाः प्रैति ॥ १०॥ अथ प्रोष्यान्पुत्रस्य
    मूर्धानमभिमृशति ॥ अङ्गादङ्गात्सम्भवसि हृदयादधिजायसे । आत्मा वै पुत्रनामासि स जीव शरदः शतम् ॥ असाविति
    नामास्य गृह्णाति । अश्मा भव परशुर्भव हिरण्यमस्तृतं भव । तेजो वै पुत्रनामासि स जीव शरदः शतम् ॥ असाविति
    नामासि गृह्णाति। येन प्रजापतिः प्रजाः पर्यगृह्णीतारिष्ट्यै तेन त्वा परिगृह्णाम्यसावित्यथास्य दक्षिणे
    कर्णे जपति ॥ अस्मे प्रयन्धि मघवन्नृजीषिन्नितीन्द्रश्रेष्ठानि द्रविणानि धेहीति माच्छेत्ता मा व्यथिष्ठाः
    शतं शरद आयुषो जीव पुत्र । ते नाम्ना मूर्धानमभिजिघ्राम्यसाविति त्रिरस्य मूर्धानमभिजिघ्रेद्गवा त्वा
    हिङ्कारेणाभिहिङ्करोमीति त्रिरस्य मूर्धानमभिहिङ्कुर्यात् ॥ ११॥ अथातो दैवः परिमर एतद्वै ब्रह्म दीप्यते
    यदग्निर्ज्वलत्यथैतन्म्रियते यन्न ज्वलति तस्यादित्यमेव तेजो गच्छति वायुं प्राण एतद्वै ब्रह्म दीप्यते
    यथादित्यो दृश्यतेऽथैतन्म्रियते यन्न दृश्यते तस्य चन्द्रमसमेव तेजो गच्छति वायुं प्राण एतद्वै ब्रह्म
    दीप्यते यच्चन्द्रमा दृश्यतेऽथैतन्म्रियते यन्न दृश्यते तस्य विद्युतमेव तेजो गच्छति वायुं प्राण एतद्वै
    ब्रह्म दीप्यते यद्विद्युद्विद्योततेऽथैतन्म्रियते यन्न विद्योतते तस्य वायुमेव तेजो गच्छति वायुं प्राणस्ता
    वा एताः सर्वा देवता वायुमेव प्रविश्य वायौ सृप्ता न मूर्च्छन्ते तस्मादेव पुनरुदीरत इत्यधिदैवतमथाध्यात्मम्
    ॥ १२॥ एतद्वै ब्रह्म दीप्यते यद्वाचा वदत्यथैतन्म्रियते यन्न वलति तस्य चक्षुरेव तेजो गच्छति प्राणं प्राण
    एतद्वै ब्रह्म दीप्यते यच्चक्षुषा पश्यत्यथैतन्म्रियते यन्न पश्यति तस्य श्रोत्रमेव तेजो गच्छति प्राणं
    प्राण एतद्वै ब्रह्म दीप्यते यच्छोत्रेण श
