id: devistotramshridharasvami
category: stotram
name:
  english: devistotramshridharasvami
  devanagari: देवीस्तोत्रम्श्रीधरस्वामी
content:
  english: param matrisnehadacinavamida vai svahitaddami | yatha mata snihyettadapi mayi te pritiradhika
    na mata brahmaikyam kila vitanute tvam na ca tatha || 4|| api brahmakaradapi ca nijashaktervibhavatah
    na matastvacchreshtham kimapi kila jane sphutamidam | yaya shaktya ko'pi prabhavati ca sa tvam bhavahare
    tvamevaikam brahmasvayamabhihintam bhedarahitam || 5|| sadekam te rupam bahuvidhataya vedakathitam
    svabhaktya sevante sakalajanasaukhyam vitanushe | tvameka vishvadau tvamiha sakalantarbahirapi tmevaika
    cante sakalamupasamhritya ramase || 6|| tvamindrastvam brahma ravirapi ca candro hariharau narastvam
    nari tvam sakaladivija devya iti yah | dhritih prajna medha matirapi gatistvam shrutinute
  devanagari: परं मातृस्नेहादचिनवमिद वै स्वहितद्दमी । यथा माता स्निह्येत्तदपि मयि ते प्रीतिरधिका न माता
    ब्रह्मैक्यं किल वितनुते त्वं न च तथा ॥ ४॥ अपि ब्रह्मकारादपि च निजशक्तेर्विभवतः न मातस्त्वच्छ्रेष्ठं
    किमपि किल जाने स्फुटमिदम् । यया शक्त्या कोऽपि प्रभवति च सा त्वं भवहरे त्वमेवैकं ब्रह्मस्वयमभिहिन्तं
    भेदरहितम् ॥ ५॥ सदेकं ते रूपं बहुविधतया वेदकथितं स्वभक्त्या सेवन्ते सकलजनसौख्यं वितनुषे । त्वमेका विश्वादौ
    त्वमिह सकलान्तर्बहिरपि त्मेवैका चान्ते सकलमुपसंहृत्य रमसे ॥ ६॥ त्वमिन्द्रस्त्वं ब्रह्मा रविरपि च चन्द्रो
    हरिहरौ नरस्त्वं नारी त्वं सकलदिविजा देव्य इति यः । धृतिः प्रज्ञा मेधा मतिरपि गतिस्त्वं श्रुतिनुते
