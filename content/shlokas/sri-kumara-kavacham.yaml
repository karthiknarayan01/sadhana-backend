id: sri-kumara-kavacham
category: stotram
name:
  english: Sri Kumara Kavacham
content:
  english: om namo bhagavate bhavabandhaharanaya dushtadaitya samhara karanaya shakti shula gada khadga
    khetaka pashankusha musala prasa tomara varadabhaya karalankritaya sharanagata rakshana diksha dhurandhara
    caranaravindaya kukshisthakhila brahmanda mandalaya hridendra antarangabdhi somaya trayastrimshatkoti
    devatanandakanda mama rinaroga shatripida pariharam kuru kuru duhkhaturum mamanandaya anandaya narakabhayanmamuddhara
    uddhara samsritikleshasi hi tam mam sanjivaya sanjivaya mahabhuktim muktim datva me sharanagatam suprasanno
    bhava varado bhava subrahmanya svamin om namaste namaste namaste namah || iti kumara kavacam |
  devanagari: ॐ नमो भगवते भवबन्धहरणाय दुष्टदैत्य संहार कारणाय शक्ति शूल गदा खड्ग खेटक पाशाङ्कुश मुसल प्रास
    तोमर वरदाभय करालङ्कृताय शरणागत रक्षण दीक्षा धुरन्धर चरणारविन्दाय कुक्षिस्थाखिल ब्रह्माण्ड मण्डलाय
    हृदेन्द्र अन्तरङ्गाब्धि सोमाय त्रयस्त्रिंशत्कोटि देवतानन्दकन्द मम ऋणरोग शतृपीडा परिहारं कुरु कुरु
    दुःखातुरुं ममानन्दय आनन्दय नरकभयान्मामुद्धर उद्धर संसृतिक्लेशसि हि तं मां सञ्जीवय सञ्जीवय महाभुक्तिं
    मुक्तिं दत्वा मे शरणागतं सुप्रसन्नो भव वरदो भव सुब्रह्मण्य स्वामिन् ॐ नमस्ते नमस्ते नमस्ते नमः ॥ इति
    कुमार कवचम् ।
