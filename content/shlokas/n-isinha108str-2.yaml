id: n-isinha108str-2
category: stotram
name:
  english: nṟisinha108str-2
  devanagari: न्ऱिसिन्ह१०८स्त्र्-२
content:
  english: janakaya ca | vagishvaraya vedyaya vedhase vedamaulaye || 3|| namo rudraya bhadraya mangalaya
    mahatmane | karunaya turiyaya shivaya paramatmane || 4|| hiranyakashipu
  devanagari: जनकाय च । वागीश्वराय वेद्याय वेधसे वेदमौलये ॥ ३॥ नमो रुद्राय भद्राय मङ्गलाय महात्मने । करुणाय
    तुरीयाय शिवाय परमात्मने ॥ ४॥ हिरण्यकशिपु
meaning: {}
