id: shveta
category: upanishad
name:
  english: shveta
  devanagari: श्वेत
content:
  english: ttasmimshcanyo mayaya sanniruddhah || 9|| mayam tu prakritim vidyanmayinam ca maheshvaram |
    tasyavayavabhutaistu vyaptam sarvamidam jagat || 10|| yo yonim yonimadhitishthatyeko yasminnidam sam
    ca vicaiti sarvam | tamishanam varadam devamidyam nicayyemam shantimatyantameti || 11|| yo devanam
    prabhavashcodbhavashca vishvadhipo rudro maharshih | hiranyagarbham pashyata jayamanam sa no buddhya
    shubhaya samyunaktu || 12|| yo devanamadhipo yasminlloka adhishritah | ya ishe asya dvipadashcatushpadah
    kasmai devaya havisha vidhema || 13|| sukshmatisukshmam kalilasya madhye vishvasya srashtharamanekarupam
    | vishvasyaikam pariveshtitaram jnatva shivam shantimatyantameti || 14|| sa eva kale bhuvanasya gopta
    vishvadhipah sarvabhuteshu gudhah | yasmin yukta brahmarshayo devatashca tamevam jnatva mrityupashamshchinatti
    || 15|| ghritat param mandamivatisukshmam jnatva shivam sarvabhuteshu gudham | vishvasyaikam pariveshtitaram
    jnatva devam mucyate sarvapashaih || 16|| esha devo vishvakarma mahatma sada jananam hridaye sannivishtah
    | hrida manisha manasabhiklripto ya etad viduramritaste bhavanti || 17|| yada'tamastanna diva na ratrih
    na sannacasacchiva eva kevalah | tadaksharam tat saviturvarenyam prajna ca tasmat prasrita purani
    || 18|| nainamurdhvam na tiryancam na madhye na parijagrabhat | na tasya pratima asti yasya nama mahad
    yashah || 19|| na sandrishe tishthati rupamasya na cakshusha pashyati kashcanainam | hrida hridistham
    manasa ya ena
  devanagari: त्तस्मिंश्चान्यो मायया सन्निरुद्धः ॥ ९॥ मायां तु प्रकृतिं विद्यान्मायिनं च महेश्वरम् । तस्यवयवभूतैस्तु
    व्याप्तं सर्वमिदं जगत् ॥ १०॥ यो योनिं योनिमधितिष्ठत्येको यस्मिन्निदं सं च विचैति सर्वम् । तमीशानं
    वरदं देवमीड्यं निचाय्येमां शान्तिमत्यन्तमेति ॥ ११॥ यो देवानां प्रभवश्चोद्भवश्च विश्वाधिपो रुद्रो महर्षिः
    । हिरण्यगर्भं पश्यत जायमानं स नो बुद्ध्या शुभया संयुनक्तु ॥ १२॥ यो देवानामधिपो यस्मिन्ल्लोका अधिश्रिताः
    । य ईशे अस्य द्विपदश्चतुष्पदः कस्मै देवाय हविषा विधेम ॥ १३॥ सूक्ष्मातिसूक्ष्मं कलिलस्य मध्ये विश्वस्य
    स्रष्ठारमनेकरूपम् । विश्वस्यैकं परिवेष्टितारं ज्ञात्वा शिवं शान्तिमत्यन्तमेति ॥ १४॥ स एव काले भुवनस्य
    गोप्ता विश्वाधिपः सर्वभूतेषु गूढः । यस्मिन् युक्ता ब्रह्मर्षयो देवताश्च तमेवं ज्ञात्वा मृत्युपाशांश्छिनत्ति
    ॥ १५॥ घृतात् परं मण्डमिवातिसूक्ष्मं ज्ञात्वा शिवं सर्वभूतेषु गूढम् । विश्वस्यैकं परिवेष्टितारं ज्ञात्वा
    देवं मुच्यते सर्वपाशैः ॥ १६॥ एष देवो विश्वकर्मा महात्मा सदा जनानां हृदये सन्निविष्टः । हृदा मनीषा
    मनसाभिक्लृप्तो य एतद् विदुरमृतास्ते भवन्ति ॥ १७॥ यदाऽतमस्तान्न दिवा न रात्रिः न सन्नचासच्छिव एव केवलः
    । तदक्षरं तत् सवितुर्वरेण्यं प्रज्ञा च तस्मात् प्रसृता पुराणी ॥ १८॥ नैनमूर्ध्वं न तिर्यञ्चं न मध्ये
    न परिजग्रभत् । न तस्य प्रतिमा अस्ति यस्य नाम महद् यशः ॥ १९॥ न सन्दृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति
    कश्चनैनम् । हृदा हृदिस्थं मनसा य एन
