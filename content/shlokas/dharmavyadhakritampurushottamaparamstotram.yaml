id: dharmavyadhakritampurushottamaparamstotram
category: stotram
name:
  english: dharmavyadhakritampurushottamaparamstotram
  devanagari: धर्मव्याधकृतंपुरुषोत्तमपरंस्तोत्रम्
content:
  english: mahavaraho havishambubhojano janardano me hitakriccaturmukhah | kshitidharo mamudadhikshayo
    mahan sa patu vishnuh sharanarthinam tu mam || 45|| mayatatam yena jagattrayam kritam yathagninaikena
    tatam caracaram | caracarasya svayameva sarvatah sa me'stu vishnuh sharanam jagatpatih || 46|| bhave
    bhave yashca sasarjja kam tato jagatprasutam sacaracaram tvidam | tatashca rudratmavati praliyate
    tato harirvishnuharastathocyate || 47|| khatmenduprithvipavanagnibhaskara jalam ca yasya prabhavanti
    murttayah | sa sarvada me bhagavan sanatano dadatu sham vishnuracintyarupadhrik || 48|| itirite tasya
    sanatanah svayam puro babhuvadbhutarupadarshanah | iti varahapurane ashtadhyayantargatam dharmavyadhakritam
    purushottamaparam stotram samaptam | varahapurana | adhyaya 8
  devanagari: महावराहो हविषाम्बुभोजनो जनार्दनो मे हितकृच्चतुर्मुखः । क्षितीधरो मामुदधिक्षयो महान् स पातु
    विष्णुः शरणार्थिनं तु माम् ॥ ४५॥ मायाततं येन जगत्त्रयं कृतं यथाग्निनैकेन ततं चराचरम् । चराचरस्य स्वयमेव
    सर्वतः स मेऽस्तु विष्णुः शरणं जगत्पतिः ॥ ४६॥ भवे भवे यश्च ससर्ज्ज कं ततो जगत्प्रसूतं सचराचरं त्विदम्
    । ततश्च रुद्रात्मवति प्रलीयते ततो हरिर्विष्णुहरस्तथोच्यते ॥ ४७॥ खात्मेन्दुपृथ्वीपवनाग्निभास्करा जलं
    च यस्य प्रभवन्ति मूर्त्तयः । स सर्वदा मे भगवान् सनातनो ददातु शं विष्णुरचिन्त्यरूपधृक् ॥ ४८॥ इतीरिते
    तस्य सनातनः स्वयं पुरो बभूवाद्भुतरूपदर्शनः । इति वराहपुराणे अष्टाध्यायान्तर्गतं धर्मव्याधकृतं पुरुषोत्तमपरं
    स्तोत्रं समाप्तम् । वराहपुराण । अध्याय ८
