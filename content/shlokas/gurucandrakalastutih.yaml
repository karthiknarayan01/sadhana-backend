id: gurucandrakalastutih
category: stotram
name:
  english: gurucandrakalastutih
  devanagari: गुरुचन्द्रकलास्तुतिः
content:
  english: '|| iti kancikamakotipithadhishvarakripapatrena sadashivabrahmendrasannidhivastavyena shriramanasharmana
    shrimadappayyadikshitendrapranatipurvakam viracita gurucandrakalastutih ||'
  devanagari: ॥ इति काञ्चीकामकोटिपीठाधीश्वरकृपापात्रेण सदाशिवब्रह्मेन्द्रसन्निधिवास्तव्येन श्रीरमणशर्मणा
    श्रीमदप्पय्यदीक्षितेन्द्रप्रणतिपूर्वकं विरचिता गुरुचन्द्रकलास्तुतिः ॥
meaning: {}
