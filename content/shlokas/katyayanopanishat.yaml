id: katyayanopanishat
category: upanishad
name:
  english: katyayanopanishat
  devanagari: कात्यायनोपनिषत्
content:
  english: ityuddharet | amritameva shvetamritsna bhavati | tam shuddhajalena pranavena gharshayet | devapitrikarmanyarabhamanastaya
    nityamurdhvapundram bibhriyanmantraih keshavadinam | tadrahitam karma nishphalam rakshamsi grihniyuh
    | tadevamabhyuktam bhavati | nasadikeshantamurdhvapundram vishnoh sthitasya caranadvayakriti | ekangulam
    padatarorasya mulam | tadutpanne dve shakhe | tadeva ca madhyakaro'nguladanyunah | sa shrih pratishthayai
    | shrirharidra | yato harim dravayati tacchricurnam shriyavadhritam adityavarnam shriphale dharayet
    | tajjalena shribijena sammrijya tatsukshmarekham dharayet | sa shriman bhavati | te dve shakhe hamsavarne
    gayatritrishtupchandasi atmaparamatmadaivatye darshapurnamasike ishtapurtakriye bhuktimuktiphale |
    sa rekha shrivarna | gayatri chandah | anandakriyamritatvaphala | ayamurdhvapundravidhih | evam viditva
    yo dharayati sa sarvakarmarho bhavati | kayikatputo bhavati | sa vishnusayujyamavapnoti sa vishnusayujyamavapnoti
    | ya evam veda | ityupanishat ||
  devanagari: इत्युद्धरेत् । अमृतमेव श्वेतमृत्स्ना भवति । तां शुद्धजलेन प्रणवेन घर्षयेत् । देवपितृकर्माण्यारभमाणस्तया
    नित्यमूर्ध्वपुण्ड्रं बिभृयान्मन्त्रैः केशवादीनाम् । तद्रहितं कर्म निष्फलं रक्षांसि गृह्णीयुः । तदेवमभ्युक्तं
    भवति । नासादिकेशान्तमूर्ध्वपुण्ड्रं विष्णोः स्थितस्य चरणद्वयाकृति । एकाङ्गुलं पादतरोरस्य मूलम् । तदुत्पन्ने
    द्वे शाखे । तदेव च मध्याकारोऽङ्गुलादन्यूनः । स श्रीः प्रतिष्ठायै । श्रीर्हरिद्रा । यतो हरिं द्रावयति
    तच्छ्रीचूर्णं श्रियावधृतं आदित्यवर्णं श्रीफले धारयेत् । तज्जलेन श्रीबीजेन सम्मृज्य तत्सूक्ष्मरेखां
    धारयेत् । स श्रीमान् भवति । ते द्वे शाखे हंसवर्णे गायत्रीत्रिष्टुप्छन्दसी आत्मपरमात्मदैवत्ये दर्शपूर्णमासिके
    इष्टापूर्तक्रिये भुक्तिमुक्तिफले । सा रेखा श्रीवर्णा । गायत्री छन्दः । आनन्दक्रियामृतत्वफला । अयमूर्ध्वपुण्ड्रविधिः
    । एवं विदित्वा यो धारयति स सर्वकर्मार्हो भवति । कायिकात्पूतो भवति । स विष्णुसायुज्यमवाप्नोति स विष्णुसायुज्यमवाप्नोति
    । य एवं वेद । इत्युपनिषत् ॥
