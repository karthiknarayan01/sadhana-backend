    श्रीधराश्रया । ॐ श्रीं वां विश्वनिष्ठा च ॐ क्लीं विश्वम्भरार्चिता ॥ ११४॥ ॐ श्रीं क्लीं विश्वधात्री
    च ॐ वां नृत्यविलासिनी । ॐ श्रीं हौं सः निराकारा ॐ श्रीं शाकम्भरी तथा ॥ ११५॥ ॐ श्रीं रां रक्तजिह्वा
