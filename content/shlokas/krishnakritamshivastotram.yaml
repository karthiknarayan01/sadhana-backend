id: krishnakritamshivastotram
category: stotram
name:
  english: krishnakritamshivastotram
  devanagari: कृष्णकृतंशिवस्तोत्रम्
content:
  english: stvamekam sharanamupaimi devamisham || 2|| sankhyastvamagunamathahurekarupam yogastham satatamupasate
    hridistham | vedastvamabhidadhatiha rudramagnim tvamekam sharanamupaimi devamisham || 3|| tvatpade
    kusumamathapi patramekam dattvasau bhavati vimuktavishvabandhah | sarvagham pranudati siddhayogijushtam
    smritva te padayugalam bhavatprasadat || 4|| yasyasheshavibhagahinamamalam hridyantaravasthitam te
    tvam yonimanantamekamacalam satyam param sarvagam | sthanam prahuranadimadhyanidhanam yasmadidam jayate
    nityam tvahamupaimi satyavibhavam vishveshvaram tam shivam || 5|| om namo nilakanthaya trinetraya
    ca ramhase | mahadevaya te nityamishanaya namo namah || 6|| namah pinakine tubhyam namo mundaya dandine
    | namaste vajrahastaya digvastraya kapardine || 7|| namo bhairavanadaya kalarupaya damshtrine | nagayajnopavitaya
    namaste vahniretase || 8|| namo'stu te girishaya svahakaraya te namah | namo muktattahasaya bhimaya
    ca namo namah || 9|| namaste kamanashaya namah kalapramathine | namo bhairavaveshaya haraya ca nishangine
    || 10|| namo'stu te tryambakaya namaste krittivasase | namo'mbikadhipataye pashunam pataye namah ||
    11|| namaste vyomarupaya vyomadhipataye namah | naranarishariraya sankhyayogapravarttine || 12|| namo
    bhairavanathaya devanugatalingine | kumaragurave tubhyam devadevaya te namah || 13|| namo yajnadhipataye
    namaste brahmacarine | mrigavyadhaya mahate brahmadhipataye namah || 14|| namo hamsaya vishvaya mohanaya
    namo namah | yogine yogagamyaya yogamayaya te namah || 15|| namaste pranapalaya ghantanadapriyaya
    ca | kapaline namastubhyam jyotisham pataye namah || 16|| namo namo namastubhyam bhuya eva namo namah
    | mahyam sarvatmana kaman prayaccha parameshvara || 17|| suta uvaca | evam hi bhaktya deveshamabhishtuya
    sa madhavah | papata padayorvipra devadevyoh sa dandavat || 18|| iti kurmapurane purvabhage catvarimshadhyayantargatam
    shrikrishnakritam shivastotram samaptam | kurmapurane purvabhage 24
  devanagari: स्त्वामेकं शरणमुपैमि देवमीशम् ॥ २॥ साङ्ख्यास्त्वामगुणमथाहुरेकरूपं योगस्थं सततमुपासते हृदिस्थम्
    । वेदास्त्वामभिदधतीह रुद्रमग्निं त्वामेकं शरणमुपैमि देवमीशम् ॥ ३॥ त्वत्पादे कुसुममथापि पत्रमेकं दत्त्वासौ
    भवति विमुक्तविश्वबन्धः । सर्वाघं प्रणुदति सिद्धयोगिजुष्टं स्मृत्वा ते पदयुगलं भवत्प्रसादात् ॥ ४॥ यस्याशेषविभागहीनममलं
    हृद्यन्तरावस्थितं ते त्वां योनिमनन्तमेकमचलं सत्यं परं सर्वगम् । स्थानं प्राहुरनादिमध्यनिधनं यस्मादिदं
    जायते नित्यं त्वाहमुपैमि सत्यविभवं विश्वेश्वरं तं शिवम् ॥ ५॥ ॐ नमो नीलकण्ठाय त्रिनेत्राय च रंहसे ।
    महादेवाय ते नित्यमीशानाय नमो नमः ॥ ६॥ नमः पिनाकिने तुभ्यं नमो मुण्डाय दण्डिने । नमस्ते वज्रहस्ताय
    दिग्वस्त्राय कपर्दिने ॥ ७॥ नमो भैरवनादाय कालरूपाय दंष्ट्रिणे । नागयज्ञोपवीताय नमस्ते वह्निरेतसे ॥
    ८॥ नमोऽस्तु ते गिरीशाय स्वाहाकाराय ते नमः । नमो मुक्ताट्टहासाय भीमाय च नमो नमः ॥ ९॥ नमस्ते कामनाशाय
    नमः कालप्रमाथिने । नमो भैरववेषाय हराय च निषङ्गिणे ॥ १०॥ नमोऽस्तु ते त्र्यम्बकाय नमस्ते कृत्तिवाससे
    । नमोऽम्बिकाधिपतये पशूनां पतये नमः ॥ ११॥ नमस्ते व्योमरूपाय व्योमाधिपतये नमः । नरनारीशरीराय साङ्ख्ययोगप्रवर्त्तिने
    ॥ १२॥ नमो भैरवनाथाय देवानुगतलिङ्गिने । कुमारगुरवे तुभ्यं देवदेवाय ते नमः ॥ १३॥ नमो यज्ञाधिपतये नमस्ते
    ब्रह्मचारिणे । मृगव्याधाय महते ब्रह्माधिपतये नमः ॥ १४॥ नमो हंसाय विश्वाय मोहनाय नमो नमः । योगिने योगगम्याय
    योगमायाय ते नमः ॥ १५॥ नमस्ते प्राणपालाय घण्टानादप्रियाय च । कपालिने नमस्तुभ्यं ज्योतिषां पतये नमः
    ॥ १६॥ नमो नमो नमस्तुभ्यं भूय एव नमो नमः । मह्यं सर्वात्मना कामान् प्रयच्छ परमेश्वर ॥ १७॥ सूत उवाच
    । एवं हि भक्त्या देवेशमभिष्टूय स माधवः । पपात पादयोर्विप्रा देवदेव्योः स दण्डवत् ॥ १८॥ इति कूर्मपुराणे
    पूर्वभागे चत्वारिंशाध्यायान्तर्गतं श्रीकृष्णकृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे पूर्वभागे २४
