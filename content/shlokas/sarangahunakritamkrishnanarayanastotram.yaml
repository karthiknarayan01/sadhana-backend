id: sarangahunakritamkrishnanarayanastotram
category: stotram
name:
  english: sarangahunakritamkrishnanarayanastotram
  devanagari: सारन्गहूणकृतंकृष्णनारायणस्तोत्रम्
content:
  english: '| ashtottarashatavaram japtva neme''mbare harim || 25|| anadishrikrishnanarayana vishno jagadguro
    | balakrishna harekrishna raksha rakshaya mamiha || 26|| sharanagatasantratah pahi simhapadastviha
    | aranye tvam vina krishna rakshako''nyo na vidyate || 27|| harekrishna balakrishna shighramayahi
    raksha nah | andhakare vardhamane mrityurnah syanna samshayah || 28|| bhakto''smi cettava krishnanarayana
    prarakshaya | praninam jayate mrityuh kvapi naiva''tra samshayah || 29|| kintu krishna prasahya''tra
    dehanam nakhabhedanaih | mahishinam tvakale''tra mrityuryogyo na me matah || 30|| yasam dugdham hi
    bhagavan piyate pratyaham tvaya | pratarvai pujane krishna naivedye divase nishi || 31|| yadghritena
    pradipam te karayami nishamukhe | tasam tvam rakshanam cenna karoshi nirdayo nu kim || 32|| yasam
    sumadhuram capi picchalam dadhi cottamam | asvadayasi krishna tvam katham naiva prarakshasi || 33||
    shighramayahi rakshartham no cedbhaktastava''smi yah | sa eva prathamam prana~styakshyami pashuhetave
    || 34|| ashritanam rakshanam vai karyam praksvamina sada | svaminashe tato nashah svamidoshaya neshyate
    || 35|| ima mahishyo mam krishna vikshanti rakshakam prati | mayi krishna hridaye tvam sthitah san
    kinna pashyasi || 36|| pashya pashya hare krishna mahapatpatita imah | bhakshako bhakshaka eva mastu
    castvapi rakshakah || 37|| ityuktva''shruni lakshmi sammumoca bhaktaranmama | sarangahuno dirgham
    vai shvasam mumoca nisprihah || 38|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya
    tritiyakhande 209'
  devanagari: । अष्टोत्तरशतवारं जप्त्वा नेमेऽम्बरे हरिम् ॥ २५॥ अनादिश्रीकृष्णनारायण विष्णो जगद्गुरो ।
    बालकृष्ण हरेकृष्ण रक्ष रक्षय मामिह ॥ २६॥ शरणागतसन्त्रातः पाहि सिंहापदस्त्विह । अरण्ये त्वां विना कृष्ण
    रक्षकोऽन्यो न विद्यते ॥ २७॥ हरेकृष्ण बालकृष्ण शीघ्रमायाहि रक्ष नः । अन्धकारे वर्धमाने मृत्युर्नः स्यान्न
    संशयः ॥ २८॥ भक्तोऽस्मि चेत्तव कृष्णनरायण प्ररक्षय । प्राणिनां जायते मृत्युः क्वापि नैवाऽत्र संशयः
    ॥ २९॥ किन्तु कृष्ण प्रसह्याऽत्र देहानां नखभेदनैः । महिषीणां त्वकालेऽत्र मृत्युर्योग्यो न मे मतः ॥
    ३०॥ यासां दुग्धं हि भगवन् पीयते प्रत्यहं त्वया । प्रातर्वै पूजने कृष्ण नैवेद्ये दिवसे निशि ॥ ३१॥ यद्घृतेन
    प्रदीपं ते कारयामि निशामुखे । तासां त्वं रक्षणं चेन्न करोषि निर्दयो नु किम् ॥ ३२॥ यासां सुमधुरं चापि
    पिच्छलं दधि चोत्तमम् । आस्वादयसि कृष्ण त्वं कथं नैव प्ररक्षसि ॥ ३३॥ शीघ्रमायाहि रक्षार्थं नो चेद्भक्तस्तवाऽस्मि
    यः । स एव प्रथमं प्राणाँस्त्यक्ष्यामि पशुहेतवे ॥ ३४॥ आश्रितानां रक्षणं वै कार्यं प्राक्स्वामिना सदा
    । स्वामिनाशे ततो नाशः स्वामिदोषाय नेष्यते ॥ ३५॥ इमा महिष्यो मां कृष्ण वीक्षन्ति रक्षकं प्रति । मयि
    कृष्ण हृदये त्वं स्थितः सन् किन्न पश्यसि ॥ ३६॥ पश्य पश्य हरे कृष्ण महापत्पतिता इमाः । भक्षको भक्षक
    एव मास्तु चास्त्वपि रक्षकः ॥ ३७॥ इत्युक्त्वाऽश्रूणि लक्ष्मि सम्मुमोच भक्तराण्मम । सारङ्गहूणो दीर्घं
    वै श्वासं मुमोच निस्पृहः ॥ ३८॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे
    २०९
