id: kubjikopasanamritapurnopanishat
category: upanishad
name:
  english: kubjikopasanamritapurnopanishat
  devanagari: कुब्जिकोपासनामृतपूर्णोपनिषत्
content:
  english: iti shatamashtottarasahasram sanapatpratyaksham kubjikadarshanam karoti trailokyam vashamanayati
    ya evam vedeti mahakubjikapujanopanishat || 6|| || 11|| kalika ca mahakubja tarapi kubjika smrita
    | shodashi siddhikubja ca kubjika bhuvaneshvari || 1|| kubja bhairavi vikhyata kubjika chinnamastaka
    | dhumavati smrita kubja kubjika bagalamukhi | matangi virakubja ca kubjika kamalapara || 2|| purvamnayeshvari
    kubja pashcimamnayasvarupini | uttaramnayeshvari kubja dakshinamnayasvarupini || 3|| adhamnayeshvari
    kubja mahomniayasvarupini | shasimhasanaga kubja ratnasimhasanasthita || 4|| brahmanisahito brahma
    maheshisahitah shivah | vaishnavisahito vishnuh kubjikam samupasate || 5|| kalikadya mahadashavidyah
    kubjikapujayantrarajopari bahyadikramena shatkone binducakre gurupadishtamargena yajet | dvaradevata
    hyadau sampujya tato'shtakonadevatam yajediti || 6|| kalika mahogrataram shodashi bhuvaneshvari bhairavi
    pracandogracandika dhumavati matangim bagalamukhim shrisiddhilakshmi yathakramenoktamantrena yajet
    | shrisiddhilakshmya mahanavarnamulena shrisiddhilakshmi yajet | binducakrarajopari shrisiddhilakshmi
    mahashodashopacaraih prapujayet | kalikogratarah pracandacandika trikone sa | mpujayet | dvavimshatyaksharena
    mahakalikam yajet | pashcimadikramena shatkonacakre shodashibhuvaneshvaribhairavidhumavatimatangibagalamukhiryajet
    | taram tryaksharena bhuvaneshvarim hyekaksharena caitanyabhairavya mahashatkatamahamantrarajena dhumavati
    saptaksharena matangi mahashtaksharena shattrimshatiraksharimahabrahmastramantrarajena bagalamukhim
    yajet | pashcimadivamavartena tadyantram taccakramandale yathoktakramena kubjika yajet | mahanishardhe
    mahapancamakarena sarvada prapujayediti || 7|| shakteshu divyabrahmacari ratrau nagnah sada maithunasakto
    madhunasakto manasa japapujadiniyamo yoshitam priyakaro bhagodakena tarpanam yonikshatena toyena tarpana
    tenaiva pujanam sarvada kubjikarupamatmanam vibhavya maharghapatram samsthapya mahayantra prapujya
    mahashankhamalaya shatamashtottaram sapya tarpya samarpya lehyacoshyapeyatmaka bhakshyabhojyamacarediti
    || 8|| evam yah kriyate kubjikaradhanam sa nakshatranam yatha somo jyotishamiva bhaskarah | bhati
    sarveshu lokeshviti || 9|| cakshusho hete manaso hete brahmano hete tapasashca hete || 10|| tam tva
    prapadye tam tva pravishami sarvaguh sarvapurushah sarvatma sarvatanuh saha yanme'sti tena || 11||
    sa sarvatma sa sarvabhutatma sa jnanatma sa vishvatma sa paramatma sa antaratma sa antarantaratma
    sa jivatma sa devatma sa vedatma sa lokatma sa parabrahmatma sa jyotirupatma sa sarvavyapipurusho
    bhavati | sa sakshimatro'vatishthati sa punyapapairna lipyate | yantra naduhkham sukham shantam nityananda
    brahmadivanditam nirvanam labdhva punaravartati || 12|| mahapurnabhishekam kritva kubjikopasanam kuryanno
    cedvatulo bhavati pancatvam pra potyevam veda | purnatpurnamudajati purnam purnena sicyate | sa sarvamantropadesham
    grihniyat | keciccidacaryamukhena sauryam ganapatyam shaivam vaishnavam shaktimantram vedoktamantram
    navagrahamantramashtavimshatinakshatramantram sarvamantram grihniyattasya sarvayantrapujane'pyadhikarah
    sa sarvatantradhyapako bhavati || 13|| satyam brihadritamugram diksha tapo brahma yajnah prithivim
    dharayanti || 14|| yadabhivadati dikshamupaiti yadudakam yacatyapah pranayati || 15|| ya eva yajna
    apah praniyante ta eva tah || 16|| yattarpanamaharanti ya evagnishomiyah pashurbadhyate sa eva sah
    || 17|| etadva u svadiyo yadadhigavam kshiram va mamsa va tadeva nashniyat || 18|| shriyam ca va esha
    samvidam ca grihanamashnati yah purvo'titheranati || 19|| ashitavatyatithavashniyadyajnasya satmatvaya
    yajnasyavicchedaya tadvatam || 20|| brahmano jajne prathamo dashashirsho dashasyah | sa somam prathamah
    papau sa cakararasam vishama || 21|| abhi prehi dakshinato bhava no'dha vritrani janghanava bhuri
    | juhomi te dharunam madhvo agramubhavapamshu prathama pibava || 22|| yasya pita pitamahah somam na
    pibati sa pashutvam prapnoti ya evam veda mahakubjikapujanatattvopanishat || 23|| || 12|| atha mahakalikam
    vyakhyasyamah || kamarephendirasamashtirupinimetattigunitamadau | tadanu kurcadvayam | kurcabijam
    tu vyomashashthasvarabindumelanarupam | tadeva dviruccarya | bhuvanadvayam | bhuvana tu vyomajvalanendirakalabindumelanarupa
    | taddyam | dakshina kalika cetyabhimukhagata | tadanu bijasaptakamuccarya brihadbhanujayamuddharet
    | sa tu shivamayo bhavet | sa tu sarvasiddhishvaro bhavet | gatistasyastiti | nanyasya gatirastiti
    | sa tu vagishvarah sa tu narishvarah sa tu deveshvarah sa tu lokeshvarah sa tu sarveshvara iti ||
    1|| bhairavo'sya rishih prokta ushnikchanda udahritah | hridistha ca mahavidya kalika guhyakalika
    || 2|| kali karali ca manojava ca sulohita ya ca sudhumravarna | sphulingini vishvaruci ca devi lelayamana
    iti sapta jihvah || 3|| abhinavajaladasankashamunnatastani kutiladamshtra shavasana kalika dhyeya
    | tri konam trikonam navakonam padmam | tasmindevim sarvangenabhyarcya pancamahamakarena ratrau sarvada
    yajediti || 4|| jivanmuktah sa vijneyo yah smaretkalikam param || 5|| pancamakarena bhuktimuktikavitvaputrapashukirtijnanaishvaryavanbhavati
    ya evam vedeti mahakubjikopanishat || 6|| || 13|| atha mahogrataram vyakhyasyamah || prathamam vedadibijama
    | dvitiyam trapabijama | tritiyam krodhabijamiti || 1|| vagadyam kamaladya kamadyam va jagattarinimetam
    yo vindyatsa vagisho bhavati sarvashravano bhavati sarvam sampadamishte || 2|| shuddha nishkalam trivarnaputam
    yo janati sa papmanam tarati sa brahmahatyam tarati sa virahatyam tarati sa bhrunahatyam tarati sa
    mrityu tarati | muktim labhate garbhajanmajaramaranatapatrayatmakam duhkham tarati || 3|| ya etam
    bhuvanadyam smarati cintayati dharayati gurumupaste sa caturvargaphalabhagbhavati || 4|| yo mahacinakramena
    latagade mahashankhamalaya lakshamavartayati sa vishvadhisho bhavati sa sarvavidyavanbhavati sa brahmadhamavanbhavati
    sa nirlepo nishkalo dvandvavarjito vigatajvara asantattvavishayo amritatvapadamashnute sa nirvanapadamapnoti
    || 5|| pujasthanamasya antah shatkonamashtadalam bhupuramiti | shatkoneshu shadanga madhye taramashtapatte
    yoginyah || 6|| yoginyo yatha | mahakalyatha rudrani ugra bhima tathaiva ca | ghora ca bhramari caiva
    maharatrishca saptami | bhairavi cashtami prokta yoginistashca pujayet || 7|| ittham yo bhajate devim
    sa bhavetkalpapadapah | sarvakamamavapnoti prapnoti paramam padam | om tatsat || 8|| imamadhiyanastarka
    agamapuranakavyadivyaushadhisho bhavati sa sarvamantrajapako bhavati sa sarvayantrapujako bhavati
    sa sarvadevasamo bhavati sa sarvadevasamo bhavati ya evam veda kabjikaradhanakramatattvopanishata
    || 9|| || 14|| atha rajarajeshvarya mahashodasharnamantroddharam vyakhyasyamah || prathamam mahalakshmibijam
    | mahalakshmibijam tu kulakaulini vishvatomukhyarudham mayasvarabhushitam kalakubjikabhushitam | shribijam
    | dvitiyam bhuvaneshvaribijam | bhuvaneshvaribija tu paratma vyapakarudham bindumalinibhushitam kalakubjikayutam
    | bhuvaneshvaribijam | tritiyam kamarajam | kamarajam tu mahakali mamsarudham mohinibhushitam kalakubjikayutam
    | kamarajam | caturtham vagbhavam | vagbhavam tu jnanamrita vyomarupibhushitam kalakubjikayutam |
    vagbhavam | pancamam shaktibijam | shaktibija tu jagabijam jvalamalinibhushitam kalamritavarshaniyutam
    | shaktibijam | shashthamam vedadibijam | vedadibijam tu pashcimasyah purnimabhushitam kalakubjikayutam
    | vedadibijam | saptamam hyashtamam lajjabijam shribijam samuccarya | trikutatma mahapancadashakshari
    navamam dashamaikadashamam bijam bhavati | pancadashakshari tu mahakalah kundali pavakah pinakishah
    | samuccarya bhuvanabijam pathet | paratmaparamatmamahakalicaitanyavedastrakutam pathitva mayabijam
    pathet | nilakanthah sthanuh krodhisho bijatma lajjabijam | dvadashamam shaktibijam | trayodashamam
    caturdashamam vagbhavam manmathakhyam | pancadashamam bhuvaneshvaribijam | lakshmibijam shodashamam
    || 1|| esha mahatripureshvarya mahashodasharnamantraraja yo janati sa sadehasaraupyasayujyasalinatvam
    prapnoti sa nirvanesho bhavati sa sarvasamrajyavanbhavati sa cittanakarshayati sa jivanakarshayati
    sa namakarshayati sa budhyanakarshayati sa dhairyanakarshayati sa rupanakarshayati sa prananakarshayati
    sa devanakarshayati sa | lokanakarshayati sa sarvanakarshayati || 2|| rishishca dakshinamurtih pashchindastu
    sammukhe | devata ca mahavidya shodashi tripureshvari || 3|| bijam ca vagbhavam prokta shaktishca
    shaktibijakama | kamaraja mahabija kilake viniyojayet || 4|| pujasthanamasya bindustrikonamashtakonam
    dashakonam dashakonam manukonamashtapattam shodashapatta vrittatrayam sandhyavrittairishobhayama |
    mahashricakrarajam sarvayantrottama mokshadvaram brahmandakararupam bhugolacakra shricakram | yah
    shricakra vetti sa sarvam vettiti || 5|| adharanavaka mudrashaktayah | prithivyaptejavayvakashashabdasparsharasarupagandhavakpanipadapayupasthamanovikarah
    kamakarshinyadayah shodashashaktayah | vacanadanagamanavisarganandahanopadanopekshakhyabuddhayo anangakusumadyashtau
    | kamakrodhalobhamohamadamatsaryapunyapapamaya brahmayadyashtashaktayah | alambusa kuhurvishvodari
    varuni hastini gandhari yashovati payasvini pusha shankhini sarasvati ida pingala sushumna ceti caturdasha
    nadyah sarvasankshobhanyadi caturdashashaktayah | pranapanavyanodanasamananagakurmakrikalasadevadattadhananjayadayo
    dasha vayavah sarvasiddhiprada devyo bahirdasharaga devatah | etadvayudashasamsargopadhibhedena recakah
    poshakah shoshako dahakah plavakah pranamukhyatvena pancadha jatharagnirbhavati | sariko hariko kshobhako
    jrimbhaka mohaka iti nagapradhanyena pancavidhaste manushyanam dehagah | bhakshyabhojyacoshyalehyapeyatmakam
    pancavidhamannam pacayanti | etaddasha vahikalah sarvajnadya antardasharaga devatah | shitoshnasukhaduhkhecchasattvarajastamogunanvita
    vashinivagdevatadyashtashaktayah | shabdadipancatanmatrah pancapushpabanah | mana ikshudhanuh | ragah
    pashah | dvesha ankushah | avyaktahakaramahattattvamiti | kameshvarivajeshvaribhagamalinyo'ntastrikonaga
    devatah | shuddha nirupadhika sa ca devi kameshvari | sadanandaghanah svatmaiva paradevata | etasya
    sarvasya vimarshah ananyacittatvena ca siddhih | bhavanayah kriya upacarah kartavyamakartavyamupasitavyamiti
    ya evam veda kubjikapujanopanishat || 6|| || 15|| atha bhuvaneshvari vyakhyasyamah || praneshah prakrityarudham
    bindumalinibhushitam kalakubjikayutam || 1|| mahabhuvaneshvarya mahamantraikaksharamantrarajam yo
    janati sa trailokyadhisho bhavati sa sakalasamrajyeshvaro bhavati || 2|| pujasthanamasya antahshatkonamashtadalam
    shodashadalam bhupuramiti || 3|| shribhuvaneshvarya pujayantrarajam yo janati sa sarvaishvaryavanbhavati
    khecaratvam praprotyevam veda mahakubjikadhyanatattvopanishat || 4|| || 16|| atha caitanyabhairavim
    mahamannapurneshvari bhairavim vyakhyasyamah || prathamam caitanyeshvari tripurasundaryarudham maheshvaribhushitam
    kalamritakarshaniyutam prathamam | dvitiyam nilakantham mahakalam pinakisham samuccarya mayabijam
    | tato'mbikapati vrikodari diparudham jvalamalinibhushitam kalakubjikamelanam kvacitsundariyutam |
    caitanyabhairavya mahamantrarajam || 1|| hrim namo bhagavatiti maheshvari padam punah | annapurne
    thayugalam vagishatvapradam parama || 2|| trikonam binducakra tu dalavedasamanvitam | vasupattum shodashabja
    bhupura dvarabhushitam || 3|| idam yantram yantrarajam sarvadevaih prapujitam | balabhairavividyapi
    aim klim sauh tryakshari para || 4|| ratrau tambulapurnamukham kritva sadhakasattamah | lakshamekamanujaptva
    sa kaivalyam padamashnuteti || ya evam veda mahakubjikopasanopanishata || 5|| || 17|| atha pracandograrupam
    kartrikapalahastam pratyalidhapada viparitasanastha svamundadharam lalajjihvam mahaghoram dakinivarninisahitam
    mahachinnamastam vyakhyasyamah || 1|| prathamam mahalakshmibijam | mahalakshmibijam tu visphulingini
    vishvamukhyarudham bindumalinibhushitam kalamritakarshaniyutam | mahalakshmibijam | dvitiyam manobhavabijam
    | manobhavabijam tu mahakali dhararudham govindasvarabhushitam kalakalanidhiyutam | manobhavabijam
    | tritiyam trapabijam | trapabijam tu pranesho vedakantharudham turyasvarabhushitam kalakubjikayutam
    | trapabijam | caturtham vagbhavam | vagbhavam tu sankarshanah kalacetanabhushitam | vagbhavam samuccarya
    vajravairocaniye pathitva bhuvanadvayam | tato'strabijam | tatah shaktirvarenyayuta pracandasvarabhushita
    paramatma vinayakabhushitam || 2|| mahamantrarajam saptadashakshari yo janati sa saptadvipeshvaro
    bhavati sa trilokeshvaro bhavati sa devendro bhavati sa pracandograchinnamastapratyakshadevatadarshanam
    karoti sa chinnamastasvarupo bhavati sa sarvadushtanmarayati shoshayati stambhayati jrimbhayati sa
    caturdashabhuvanadhisho bhavati || 3|| jvalaccitamadhyasamstha madaghurnitalocanama | vidyutkotipratikasham
    dadimikusumopamam | evam dhyatva yajecchinnam ghorarupam digambarama || 4|| pujasthanamasya antah
    krodhabijam vilikhya tatastrikonam dvaratrayabhushitam vrittatrayam trikonam samlikhya vasupattu bhupuram
    || 5|| pracandogracandikamahachinnamastapujayantrarajam yo janati nityam yo'rcayati yopasanam sarvada
    karoti svashikhayam yo dharayati sa brahmatvam prapnoti sa vishnutvam prapnoti sa rudratvam prapnoti
    sa brahmasamo bhutva sarvandevansarvamllokansarvatmanam samsrijati vishnusamo bhutva sa sarvandevansarvamllokansarvatmanam
    | pratipalayati sa rudrasamo bhutva sarvandevansarvamllokansarvatmanam jagatsthavarajangamam bhutam
    bhavadbhavishyatsarvam samharayati sa sarvashastrartham janati sa vedartham karoti sa sarvashastradhyapako
    bhavati nyayamimamsasankhyapatanjalavyakaranavedagamajyotishadharmashastrartham janati sa ayurvedadhanurvedagandharvavedarthashastram
    janati sa sakalashastrartham janati ya evam veda || 6|| mahabhutadinardharatrau gatva shmashane nirjane
    mahograpithalaye bijena snatva pracandacandika dhyatva pitva bhuktva natva smritva pracandogracandikachinnamastapujacakrarajam
    pashcimabhimukham samsthapya mahapancamakaraih sampujya vidhivatsantarpya japya samarpya mahamamsam
    madhunabhigharitam sajyam raktacandanam raktotpalasahasram karavirasahasram juhayat | shakti santoshya
    pancamam kritva svaretasa chinnamastam santarpya kundagolodbhavena svayambhupushpena sarvada yajet
    || 7|| sa navadvipeshvaro bhavati sa maharajarajeshvaro bhavati sa caturdashabhuvanadhisho bhavati
    sa mahakavirbhavati sa mahakavindreshvaro bhavati ya evam veda mahakubjikapujanopanishat || 8|| ||
    18|| atha dhumavatim vyakhyasyamah || prathamam vakratundam mahavidyeshvaribhushitam kalakubjikayutam
    | tatah shabdatma kubjasvarabhushitam | tritiyam vaikhuntham pitamahabhushitam | caturtham varenyam
    | pancamam varahi sarveshvari mohinibhushitam | agamah pramattah sharirakarshanisamyutam || 1|| mahadhumavati
    yo janati sa sarvasaubhagyarogyadhanadhanyaputrapashukirtijnaneshvaryavanbhavati sa trailokyam jayati
    sa rudratvam prapnotyevam veda || 2|| pujayantramasya antahshatkonam vasupattam bhupuram || 3|| dhumavatyah
    pujacakraraja shmashane nararaktena vilikhya mahashakopari mahapancamakaraih pancopacaraih svayambhukusumaih
    samabhyakshamalaya niyamena yo lakshamavartayati sa brahmadimaranam karoti sa sarvana shatrunmarayatyuccatayati
    stambhayati dveshayati shataprayogasiddhibhagbhavati sa khecaratvam prapnotyevam veda mahakubjikarcanatattvamritasaropanishat
    || 4|| || 19|| atha mahabrahmastravidya shatvimshatiratnakshari mahapitambara pitasimhasanastha pitagandhanulepana
    pitapushpanjalirata svarnalankarabhushita mahapitavarna pitambara brahmastravidya | mahabagalamukhyah
    shatvimshatiratnakshari vyakhyasyamah || 1|| prathamam vedadibijam | vedadibijam tu jvalamalini kamakalavrishadhvajabhushitam
    | vedadibija prathamam | dvitiyam sthiramayabijam | sthiramayabijam tu paramatma vyapakarudham bindumalinibhushitam
    kalamritakarshaniyutam samuccarya kapardini
  devanagari: इति शतमष्टोत्तरसहस्रं सनपात्प्रत्यक्षं कुब्जिकादर्शनं करोति त्रैलोक्यं वशमानयति य एवं वेदेति
    महाकुब्जिकापूजनोपनिषत् ॥ ६॥ ॥ ११॥ कालिका च महाकुब्जा तारापि कुब्जिका स्मृता । षोडशी सिद्धिकुब्जा च
    कुब्जिका भुवनेश्वरी ॥ १॥ कुब्जा भैरवी विख्याता कुब्जिका छिन्नमस्तका । धूमावती स्मृता कुब्जा कुब्जिका
    बगलामुखी । मातङ्गी वीरकुब्जा च कुब्जिका कमलापरा ॥ २॥ पूर्वाम्नायेश्वरी कुब्जा पश्चिमाम्नायस्वरूपिणी
    । उत्तराम्नायेश्वरी कुब्जा दक्षिणाम्नायस्वरूपिणी ॥ ३॥ अधाम्नायेश्वरी कुब्जा महोम्निआयस्वरूपिणी । षसिंहासनगा
    कुब्जा रत्नसिंहासनस्थिता ॥ ४॥ ब्रह्माणीसहितो ब्रह्मा माहेशीसहितः शिवः । वैष्णवीसहितो विष्णुः कुब्जिकां
    समुपासते ॥ ५॥ कालिकाद्या महादशविद्याः कुब्जिकापूजायन्त्रराजोपरि बाह्यादिक्रमेण षट्कोणे बिन्दुचक्रे
    गुरूपदिष्टमार्गेण यजेत् । द्वारदेवता ह्यादौ सम्पूज्य ततोऽष्टकोणदेवतां यजेदिति ॥ ६॥ कालिका महोग्रतारां
    षोडशी भुवनेश्वरी भैरवी प्रचण्डोग्रचण्डिका धूमावती मातङ्गीं बगलामुखीं श्रीसिद्धिलक्ष्मी यथाक्रमेणोक्तमन्त्रेण
    यजेत् । श्रीसिद्धिलक्ष्म्या महानवार्णामूलेन श्रीसिद्धिलक्ष्मी यजेत् । बिन्दुचक्रराजोपरि श्रीसिद्धिलक्ष्मी
    महाषोडशोपचारैः प्रपूजयेत् । कालिकोग्रताराः प्रचण्डचण्डिका त्रिकोणे स । म्पूजयेत् । द्वाविंशत्यक्षरेण
    महाकालिकां यजेत् । पश्चिमादिक्रमेण षट्कोणचक्रे षोडशीभुवनेश्वरीभैरवीधूमावतीमातङ्गीबगलामुखीर्यजेत् ।
    तारां त्र्यक्षरेण भुवनेश्वरीं ह्येकाक्षरेण चैतन्यभैरव्या महाषट्कटमहामन्त्रराजेन धूमावती सप्ताक्षरेण
    मातङ्गी महाष्टाक्षरेण षट्त्रिंशतिरक्षरीमहाब्रह्मास्त्रमन्त्रराजेन बगलामुखीं यजेत् । पश्चिमादिवामावर्तेन
    तद्यन्त्रं तच्चक्रमण्डले यथोक्तक्रमेण कुब्जिका यजेत् । महानिशार्धे महापञ्चमकारेण सर्वदा प्रपूजयेदिति
    ॥ ७॥ शाक्तेषु दिव्यब्रह्मचारी रात्रौ नग्नः सदा मैथुनासक्तो मधुनासक्तो मनसा जपपूजादिनियमो योषितां प्रियकरो
    भगोदकेन तर्पणं योनिक्षतेन तोयेन तर्पण तेनैव पूजनं सर्वदा कुब्जिकारूपमात्मानं विभाव्य महार्घपात्रं
    संस्थाप्य महायन्त्र प्रपूज्य महाशङ्खमालया शतमष्टोत्तरं साप्य तर्प्य समर्प्य लेह्यचोष्यपेयात्मक भक्ष्यभोज्यमाचरेदिति
    ॥ ८॥ एवं यः क्रियते कुब्जिकाराधनं स नक्षत्राणां यथा सोमो ज्योतिषामिव भास्करः । भाति सर्वेषु लोकेष्विति
    ॥ ९॥ चक्षुषो हेते मनसो हेते ब्रह्मणो हेते तपसश्च हेते ॥ १०॥ तं त्वा प्रपद्ये तं त्वा प्रविशामि सर्वगुः
    सर्वपुरुषः सर्वात्मा सर्वतनूः सह यन्मेऽस्ति तेन ॥ ११॥ स सर्वात्मा स सर्वभूतात्मा स ज्ञानात्मा स विश्वात्मा
    स परमात्मा स अन्तरात्मा स अन्तरान्तरात्मा स जीवात्मा स देवात्मा स वेदात्मा स लोकात्मा स परब्रह्मात्मा
    स ज्योतिरूपात्मा स सर्वव्यापिपुरुषो भवति । स साक्षिमात्रोऽवतिष्ठति स पुण्यपापैर्न लिप्यते । यन्त्र
    नादुःखं सुखं शान्तं नित्यानन्द ब्रह्मादिवन्दितं निर्वाणं लब्ध्वा पुनरावर्तति ॥ १२॥ महापूर्णाभिषेकं
    कृत्वा कुब्जिकोपासनं कुर्यान्नो चेद्वातुलो भवति पञ्चत्वं प्रा पोत्येवं वेद । पूर्णात्पूर्णमुदजति पूर्णं
    पूर्णेन सिच्यते । स सर्वमन्त्रोपदेशं गृह्णीयात् । केचिच्चिदाचार्यमुखेन सौर्यं गाणपत्यं शैवं वैष्णवं
    शक्तिमन्त्रं वेदोक्तमन्त्रं नवग्रहमन्त्रमष्टाविंशतिनक्षत्रमन्त्रं सर्वमन्त्रं गृह्णीयात्तस्य सर्वयन्त्रपूजनेऽप्यधिकारः
    स सर्वतन्त्राध्यापको भवति ॥ १३॥ सत्यं बृहदृतमुग्रं दीक्षा तपो ब्रह्म यज्ञः पृथिवीं धारयन्ति ॥ १४॥
    यदभिवदति दीक्षामुपैति यदुदकं याचत्यपः प्रणयति ॥ १५॥ या एव यज्ञ आपः प्रणीयन्ते ता एव ताः ॥ १६॥ यत्तर्पणमाहरन्ति
    य एवाग्निषोमीयः पशुर्बध्यते स एव सः ॥ १७॥ एतद्वा उ स्वादीयो यदधिगवं क्षीरं वा मांस वा तदेव नाश्नीयात्
    ॥ १८॥ श्रियं च वा एष संविदं च गृहाणामश्नाति यः पूर्वोऽतिथेरनाति ॥ १९॥ अशितावत्यतिथावश्नीयाद्यज्ञस्य
    सात्मत्वाय यज्ञस्याविच्छेदाय तद्वतम् ॥ २०॥ ब्राह्मणो जज्ञे प्रथमो दशशीर्षो दशास्यः । स सोमं प्रथमः
    पपौ स चकारारसं विषम ॥ २१॥ अभि प्रेहि दक्षिणतो भवा नोऽधा वृत्राणि जङ्घनाव भूरि । जुहोमि ते धरुणं मध्वो
    अग्रमुभावपांशु प्रथमा पिबाव ॥ २२॥ यस्य पिता पितामहः सोमं न पिबति स पशुत्वं प्राप्नोति य एवं वेद महाकुब्जिकापूजनतत्त्वोपनिषत्
    ॥ २३॥ ॥ १२॥ अथ महाकालिकां व्याख्यास्यामः ॥ कामरेफेन्दिरासमष्टिरूपिणीमेतत्तिगुणितामादौ । तदनु कूर्चद्वयम्
    । कूर्चबीजं तु व्योमषष्ठस्वरबिन्दुमेलनरूपम् । तदेव द्विरुच्चार्य । भुवनाद्वयम् । भुवना तु व्योमज्वलनेन्दिराकलाबिन्दुमेलनरूपा
    । तद्द्यम् । दक्षिणा कालिका चेत्यभिमुखगता । तदनु बीजसप्तकमुच्चार्य बृहद्भानुजायामुद्धरेत् । स तु शिवमयो
    भवेत् । स तु सर्वसिद्धीश्वरो भवेत् । गतिस्तस्यास्तीति । नान्यस्य गतिरस्तीति । स तु वागीश्वरः स तु
    नारीश्वरः स तु देवेश्वरः स तु लोकेश्वरः स तु सर्वेश्वर इति ॥ १॥ भैरवोऽस्य ऋषिः प्रोक्त उष्णिक्छन्द
    उदाहृतः । हृदिस्था च महाविद्या कालिका गुह्यकालिका ॥ २॥ काली कराली च मनोजवा च सुलोहिता या च सुधूम्रवर्णा
    । स्फुलिङ्गिनी विश्वरुची च देवी लेलायमाना इति सप्त जिह्वाः ॥ ३॥ अभिनवजलदसङ्काशामुन्नतस्तनी कुटिलदंष्ट्रा
    शवासना कालिका ध्येया । त्रि कोणं त्रिकोणं नवकोणं पद्मम् । तस्मिन्देवीं सर्वाङ्गेनाभ्यर्च्य पञ्चमहामकारेण
    रात्रौ सर्वदा यजेदिति ॥ ४॥ जीवन्मुक्तः स विज्ञेयो यः स्मरेत्कालिकां पराम् ॥ ५॥ पञ्चमकारेण भुक्तिमुक्तिकवित्वपुत्रपशुकीर्तिज्ञानैश्वर्यवान्भवति
    य एवं वेदेति महाकुब्जिकोपनिषत् ॥ ६॥ ॥ १३॥ अथ महोग्रतारां व्याख्यास्यामः ॥ प्रथमं वेदादिबीजम । द्वितीयं
    त्रपाबीजम । तृतीयं क्रोधबीजमिति ॥ १॥ वागाद्यां कमलाद्या कामाद्यां वा जगत्तारिणीमेतां यो विन्द्यात्स
    वागीशो भवति सर्वश्रवणो भवति सर्वां सम्पदमीष्टे ॥ २॥ शुद्धा निष्कलां त्रिवर्णपूतां यो जानाति स पाप्मानं
    तरति स ब्रह्महत्यां तरति स वीरहत्यां तरति स भ्रूणहत्यां तरति स मृत्यु तरति । मुक्तिं लभते गर्भजन्मजरामरणतापत्रयात्मकं
    दुःखं तरति ॥ ३॥ य एतां भुवनाद्यां स्मरति चिन्तयति धारयति गुरुमुपास्ते स चतुर्वर्गफलभाग्भवति ॥ ४॥ यो
    महाचीनक्रमेण लतागादे महाशङ्खमालया लक्षमावर्तयति स विश्वाधीशो भवति स सर्वविद्यावान्भवति स ब्रह्मधामवान्भवति
    स निर्लेपो निष्कलो द्वन्द्ववर्जितो विगतज्वर आसन्तत्त्वविषयो अमृतत्वपदमश्नुते स निर्वाणपदमाप्नोति ॥
    ५॥ पूजास्थानमस्या अन्तः षट्कोणमष्टदलं भूपुरमिति । षट्कोणेषु षडङ्ग मध्ये तारामष्टपत्ते योगिन्यः ॥ ६॥
    योगिन्यो यथा । महाकाल्यथ रुद्राणी उग्रा भीमा तथैव च । घोरा च भ्रामरी चैव महारात्रिश्च सप्तमी । भैरवी
    चाष्टमी प्रोक्ता योगिनीस्ताश्च पूजयेत् ॥ ७॥ इत्थं यो भजते देवीं स भवेत्कल्पपादपः । सर्वकाममवाप्नोति
    प्राप्नोति परमं पदम् । ॐ तत्सत् ॥ ८॥ इमामधीयानस्तर्क आगमपुराणकाव्यदिव्यौषधीशो भवति स सर्वमन्त्रजापको
    भवति स सर्वयन्त्रपूजको भवति स सर्वदेवसमो भवति स सर्वदेवसमो भवति य एवं वेद कब्जिकाराधनक्रमतत्त्वोपनिषत
    ॥ ९॥ ॥ १४॥ अथ राजराजेश्वर्या महाषोडशार्णमन्त्रोद्धारं व्याख्यास्यामः ॥ प्रथमं महालक्ष्मीबीजम् । महालक्ष्मीबीजं
    तु कुलकौलिनी विश्वतोमुख्यारूढं मायास्वरभूषितं कलाकुब्जिकाभूषितम् । श्रीबीजम् । द्वितीयं भुवनेश्वरीबीजम्
    । भुवनेश्वरीबीज तु परात्मा व्यापकारूढं बिन्दुमालिनीभूषितं कलाकुब्जिकायुतम् । भुवनेश्वरीबीजम् । तृतीयं
    कामराजम् । कामराजं तु महाकाली मांसारूढं मोहिनीभूषितं कलाकुब्जिकायुतम् । कामराजम् । चतुर्थं वाग्भवम्
    । वाग्भवं तु ज्ञानामृता व्योमरूपीभूषितं कलाकुब्जिकायुतम् । वाग्भवम् । पञ्चमं शक्तिबीजम् । शक्तिबीज
    तु जगबीजं ज्वालामालिनीभूषितं कलामृतावर्षणीयुतम् । शक्तिबीजम् । षष्ठमं वेदादिबीजम् । वेदादिबीजं तु
    पश्चिमास्यः पूर्णिमाभूषितं कलाकुब्जिकायुतम् । वेदादिबीजम् । सप्तमं ह्यष्टमं लज्जाबीजं श्रीबीजं समुच्चार्य
    । त्रिकूटात्मा महापञ्चदशाक्षरी नवमं दशमैकादशमं बीजं भवति । पञ्चदशाक्षरी तु महाकालः कुण्डली पावकः पिनाकीशः
    । समुच्चार्य भुवनाबीजं पठेत् । परात्मापरमात्मामहाकालीचैतन्यवेदास्त्रकूटं पठित्वा मायाबीजं पठेत् ।
    नीलकण्ठः स्थाणुः क्रोधीशो बीजात्मा लज्जाबीजम् । द्वादशमं शक्तिबीजम् । त्रयोदशमं चतुर्दशमं वाग्भवं
    मन्मथाख्यम् । पञ्चदशमं भुवनेश्वरीबीजम् । लक्ष्मीबीजं षोडशमम् ॥ १॥ एषा महात्रिपुरेश्वर्या महाषोडशार्णमन्त्रराज
    यो जानाति स सादेहसारौप्यसायुज्यसालीनत्वं प्राप्नोति स निर्वाणेशो भवति स सर्वसाम्राज्यवान्भवति स चित्तानाकर्षयति
    स जीवानाकर्षयति स नामाकर्षयति स बुध्यानाकर्षयति स धैर्यानाकर्षयति स रूपानाकर्षयति स प्राणानाकर्षयति
    स देवानाकर्षयति स । लोकानाकर्षयति स सर्वानाकर्षयति ॥ २॥ ऋषिश्च दक्षिणामूर्तिः पश्छिन्दस्तु सम्मुखे
    । देवता च महाविद्या षोडशी त्रिपुरेश्वरी ॥ ३॥ बीजं च वाग्भवं प्रोक्त शक्तिश्च शक्तिबीजकम । कामराज महाबीज
    कीलके विनियोजयेत् ॥ ४॥ पूजास्थानमस्या बिन्दुस्त्रिकोणमष्टकोणं दशकोणं दशकोणं मनुकोणमष्टपत्तं षोडशपत्त
    वृत्तत्रयं सन्ध्यावृत्तैरिशोभायम । महाश्रीचक्रराजं सर्वयन्त्रोत्तम मोक्षद्वारं ब्रह्माण्डाकाररूपं
    भूगोलचक्र श्रीचक्रम् । यः श्रीचक्र वेत्ति स सर्वं वेत्तीति ॥ ५॥ आधारनवक मुद्राशक्तयः । पृथिव्यप्तेजवाय्वाकाशशब्दस्पर्शरसरूपगन्धवाक्पाणिपादपायुपस्थमनोविकाराः
    कामाकर्षिण्यादयः षोडशशक्तयः । वचनादानगमनविसर्गानन्दहानोपादानोपेक्षाख्यबुद्धयो अनङ्गकुसुमाद्यष्टौ ।
    कामक्रोधलोभमोहमदमात्सर्यपुण्यपापमया ब्राह्मयाद्यष्टशक्तयः । अलम्बुसा कुहूर्विश्वोदरी वारुणी हस्तिनी
    गान्धारी यशोवती पयस्विनी पूषा शङ्खिनी सरस्वती इडा पिङ्गला सुषुम्ना चेति चतुर्दश नाड्यः सर्वसङ्क्षोभण्यादि
    चतुर्दशशक्तयः । प्राणापानव्यानोदानसमाननागकूर्मकृकलासदेवदत्तधनञ्जयादयो दश वायवः सर्वसिद्धिप्रदा देव्यो
    बहिर्दशारगा देवताः । एतद्वायुदशसंसर्गोपाधिभेदेन रेचकः पोषकः शोषको दाहकः प्लावकः प्राणमुख्यत्वेन पञ्चधा
    जठराग्निर्भवति । सरिको हारिको क्षोभको जृम्भक मोहक इति नागप्राधान्येन पञ्चविधास्ते मनुष्याणां देहगाः
    । भक्ष्यभोज्यचोष्यलेह्यपेयात्मकं पञ्चविधमन्नं पाचयन्ति । एतद्दश वहिकलाः सर्वज्ञाद्या अन्तर्दशारगा
    देवताः । शीतोष्णसुखदुःखेच्छासत्त्वरजस्तमोगुणान्विता वशिनीवाग्देवताद्यष्टशक्तयः । शब्दादिपञ्चतन्मात्राः
    पञ्चपुष्पबाणाः । मन इक्षुधनुः । रागः पाशः । द्वेष अङ्कुशः । अव्यक्ताहकारमहत्तत्त्वमिति । कामेश्वरीवजेश्वरीभगमालिन्योऽन्तस्त्रिकोणगा
    देवताः । शुद्धा निरुपाधिका सा च देवी कामेश्वरी । सदानन्दघनः स्वात्मैव परदेवता । एतस्य सर्वस्य विमर्शः
    अनन्यचित्तत्वेन च सिद्धिः । भावनायाः क्रिया उपचारः कर्तव्यमकर्तव्यमुपासितव्यमिति य एवं वेद कुब्जिकापूजनोपनिषत्
    ॥ ६॥ ॥ १५॥ अथ भुवनेश्वरी व्याख्यास्यामः ॥ प्राणेशः प्रकृत्यारूढं बिन्दुमालिनीभूषितं कलाकुब्जिकायुतम्
    ॥ १॥ महाभुवनेश्वर्या महामन्त्रैकाक्षरमन्त्रराजं यो जानाति स त्रैलोक्याधीशो भवति स सकलसाम्राज्येश्वरो
    भवति ॥ २॥ पूजास्थानमस्या अन्तःषट्कोणमष्टदलं षोडशदलं भूपुरमिति ॥ ३॥ श्रीभुवनेश्वर्या पूजायन्त्रराजं
    यो जानाति स सर्वैश्वर्यवान्भवति खेचरत्वं प्राप्रोत्येवं वेद महाकुब्जिकाध्यानतत्त्वोपनिषत् ॥ ४॥ ॥ १६॥
    अथ चैतन्यभैरवीं महामन्नपूर्णेश्वरी भैरवीं व्याख्यास्यामः ॥ प्रथमं चैतन्येश्वरी त्रिपुरसुन्दर्यारूढं
    माहेश्वरीभूषितं कलामृताकर्षणीयुतं प्रथमम् । द्वितीयं नीलकण्ठं महाकालं पिनाकीशं समुच्चार्य मायाबीजम्
    । ततोऽम्बिकापति वृकोदरी दीपारूढं ज्वालामालिनीभूषितं कलाकुब्जिकामेलनं क्वचित्सुन्दरीयुतम् । चैतन्यभैरव्या
    महामन्त्रराजम् ॥ १॥ ह्रीं नमो भगवतीति माहेश्वरी पदं पुनः । अन्नपूर्णे ठयुगलं वागीशत्वप्रदं परम ॥ २॥
    त्रिकोणं बिन्दुचक्र तु दलवेदसमन्वितम् । वसुपत्तुं षोडशाब्ज भूपुर द्वारभूषितम् ॥ ३॥ इदं यन्त्रं यन्त्रराजं
    सर्वदेवैः प्रपूजितम् । बालाभैरवीविद्यापि ऐं क्लीं सौः त्र्यक्षरी परा ॥ ४॥ रात्रौ ताम्बूलपूर्णमुखं
    कृत्वा साधकसत्तमः । लक्षमेकमनुजप्त्वा स कैवल्यं पदमश्नुतेति ॥ य एवं वेद महाकुब्जिकोपासनोपनिषत ॥ ५॥
    ॥ १७॥ अथ प्रचण्डोग्ररूपां कर्तृकपालहस्तां प्रत्यालीढपदा विपरीतासनस्था स्वमुण्डधरां ललज्जिह्वां महाघोरां
    डाकिनीवर्णिनीसहितां महाछिन्नमस्तां व्याख्यास्यामः ॥ १॥ प्रथमं महालक्ष्मीबीजम् । महालक्ष्मीबीजं तु
    विस्फुलिङ्गिनी विश्वमुख्यारूढं बिन्दुमालिनीभूषितं कलामृताकर्षणीयुतम् । महालक्ष्मीबीजम् । द्वितीयं
    मनोभवबीजम् । मनोभवबीजं तु महाकाली धरारूढं गोविन्दस्वरभूषितं कलाकलानिधियुतम् । मनोभवबीजम् । तृतीयं
    त्रपाबीजम् । त्रपाबीजं तु प्राणेशो वेदकण्ठारूढं तूर्यस्वरभूषितं कलाकुब्जिकायुतम् । त्रपाबीजम् । चतुर्थं
    वाग्भवम् । वाग्भवं तु सङ्कर्षणः कलाचेतनभूषितम् । वाग्भवं समुच्चार्य वज्रवैरोचनीये पठित्वा भुवनाद्वयम्
    । ततोऽस्त्रबीजम् । ततः शक्तिर्वरेण्ययुत प्रचण्डस्वरभूषित परमात्मा विनायकभूषितम् ॥ २॥ महामन्त्रराजं
    सप्तदशाक्षरी यो जानाति स सप्तद्वीपेश्वरो भवति स त्रिलोकेश्वरो भवति स देवेन्द्रो भवति स प्रचण्डोग्रछिन्नमस्ताप्रत्यक्षदेवतादर्शनं
    करोति स छिन्नमस्तास्वरूपो भवति स सर्वदुष्टान्मारयति शोषयति स्तम्भयति जृम्भयति स चतुर्दशभुवनाधीशो भवति
    ॥ ३॥ ज्वलच्चितामध्यसंस्था मदाघूर्णितलोचनाम । विद्युत्कोटिप्रतीकाशां दाडिमीकुसुमोपमाम् । एवं ध्यात्वा
    यजेच्छिन्नां घोररूपां दिगम्बराम ॥ ४॥ पूजास्थानमस्या अन्तः क्रोधबीजं विलिख्य ततस्त्रिकोणं द्वारत्रयभूषितं
    वृत्तत्रयं त्रिकोणं संलिख्य वसुपत्तू भूपुरम् ॥ ५॥ प्रचण्डोग्रचण्डिकामहाछिन्नमस्तापुजायन्त्रराजं यो
    जानाति नित्यं योऽर्चयति योपासनं सर्वदा करोति स्वशिखायां यो धारयति स ब्रह्मत्वं प्राप्नोति स विष्णुत्वं
    प्राप्नोति स रुद्रत्वं प्राप्नोति स ब्रह्मसमो भूत्वा सर्वान्देवान्सर्वांल्लोकान्सर्वात्मानं संसृजति
    विष्णुसमो भूत्वा स सर्वान्देवान्सर्वांल्लोकान्सर्वात्मानम् । प्रतिपालयति स रुद्रसमो भूत्वा सर्वान्देवान्सर्वांल्लोकान्सर्वात्मानं
    जगत्स्थावरजङ्गमं भूतं भवद्भविष्यत्सर्वं संहारयति स सर्वशास्त्रार्थं जानाति स वेदार्थं करोति स सर्वशास्त्राध्यापको
    भवति न्यायमीमांसासाङ्ख्यपातञ्जलव्याकरणवेदागमज्योतिषधर्मशास्त्रार्थं जानाति स आयुर्वेदधनुर्वेदगान्धर्ववेदार्थशास्त्रं
    जानाति स सकलशास्त्रार्थं जानाति य एवं वेद ॥ ६॥ महाभूतदिनार्धरात्रौ गत्वा श्मशाने निर्जने महोग्रपीठालये
    बीजेन स्नात्वा प्रचण्डचण्डिका ध्यात्वा पीत्वा भुक्त्वा नत्वा स्मृत्वा प्रचण्डोग्रचण्डिकाछिन्नमस्तापूजाचक्रराजं
    पश्चिमाभिमुखं संस्थाप्य महापञ्चमकारैः सम्पूज्य विधिवत्सन्तर्प्य जप्य समर्प्य महामांसं मधुनाभिघारितं
    साज्यं रक्तचन्दनं रक्तोत्पलसहस्रं करवीरसहस्रं जुहयात् । शक्ति सन्तोष्य पञ्चमं कृत्वा स्वरेतसा छिन्नमस्तां
    सन्तर्प्य कुण्डगोलोद्भवेन स्वयम्भूपुष्पेन सर्वदा यजेत् ॥ ७॥ स नवद्वीपेश्वरो भवति स महाराजराजेश्वरो
    भवति स चतुर्दशभुवनाधीशो भवति स महाकविर्भवति स महाकवीन्द्रेश्वरो भवति य एवं वेद महाकुब्जिकापूजनोपनिषत्
    ॥ ८॥ ॥ १८॥ अथ धूमावतीं व्याख्यास्यामः ॥ प्रथमं वक्रतुण्डं महाविद्येश्वरीभूषितं कलाकुब्जिकायुतम् ।
    ततः शब्दात्मा कुब्जस्वरभूषितम् । तृतीयं वैखुण्ठं पितामहभूषितम् । चतुर्थं वरेण्यम् । पञ्चमं वाराही
    सर्वेश्वरी मोहिनीभूषितम् । आगमः प्रमत्तः शरीराकर्षणीसंयुतम् ॥ १॥ महाधूमावती यो जानाति स सर्वसौभाग्यारोग्यधनधान्यपुत्रपशुकीर्तिज्ञानेश्वर्यवान्भवति
    स त्रैलोक्यं जयति स रुद्रत्वं प्राप्नोत्येवं वेद ॥ २॥ पूजायन्त्रमस्या अन्तःषट्कोणं वसुपत्तं भूपुरम्
    ॥ ३॥ धूमावत्याः पूजाचक्रराज श्मशाने नररक्तेन विलिख्य महाशकोपरि महापञ्चमकारैः पञ्चोपचारैः स्वयम्भूकुसुमैः
    समभ्याक्षमालया नियमेन यो लक्षमावर्तयति स ब्रह्मादिमारणं करोति स सर्वान शत्रून्मारयत्युच्चाटयति स्तम्भयति
    द्वेषयति षटप्रयोगसिद्धिभाग्भवति स खेचरत्वं प्राप्नोत्येवं वेद महाकुब्जिकार्चनतत्त्वामृतसारोपनिषत्
    ॥ ४॥ ॥ १९॥ अथ महाब्रह्मास्त्रविद्या षट्विंशतिरत्नाक्षरी महापीताम्बरा पीतसिंहासनस्था पीतगन्धानुलेपना
    पीतपुष्पाञ्जलिरता स्वर्णालङ्कारभूषिता महापीतवर्णा पीताम्बरा ब्रह्मास्त्रविद्या । महाबगलामुख्याः षट्विंशतिरत्नाक्षरी
    व्याख्यास्यामः ॥ १॥ प्रथमं वेदादिबीजम् । वेदादिबीजं तु ज्वालामालिनी कामकलावृषध्वजभूषितम् । वेदादिबीज
    प्रथमम् । द्वितीयं स्थिरमायाबीजम् । स्थिरमायाबीजं तु परमात्मा व्यापकारूढं बिन्दुमालिनीभूषितं कलामृताकर्षणीयुतं
    समुच्चार्य कपर्दिनी
