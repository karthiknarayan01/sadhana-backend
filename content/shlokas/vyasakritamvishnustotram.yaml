id: vyasakritamvishnustotram
category: stotram
name:
  english: vyasakritamvishnustotram
  devanagari: व्यसकृतंविष्णुस्तोत्रम्
content:
  english: vyasakritam vishnustotram vyasa uvaca | namaskritva sureshaya vishnave prabhavishnave purushaya
    puranaya shashvatayavyayaya ca || 1|| caturvyuhatmane tasmai nirgunaya gunaya ca | varishthaya garishthaya
    varenyayamitaya ca || 2|| yajnangayakhilangaya devadyairipsitaya ca | yasmadanutaram nasti yasmannasti
    brihattaram || 3|| yena vishvamidam vyaptamajena sacaracaram | avirbhavatirobhavadrishtadrishtavilakshanam
    || 4|| vadanti yatsrishtamiti tathaivapyupasamhritam | brahmane ca''didevaya namaskritya samadhina
    || 5|| avikaraya shuddhaya nityaya paramatmane | sadaikaruparupaya jishnave vishnave namah || 6||
    namo hiranyagarbhaya haraye shankaraya ca | vasudevaya taraya sargasthityantakarine || 7|| ekanekasvarupaya
    sthulasukshmatmane namah | avyaktavyaktabhutaya vishnave muktihetave || 8|| sargasthitivinashanam
    jagato yo jaganmayah | mulabhuto namastasmai vishnave paramatmane || 9|| adharabhutam vishvasyapyaniyamsamaniyasam
    | pranamya sarvabhutasthamacyutam purushottamam || 10|| jnanasvarupamatyantam nirmalam paramarthatah
    | tamevarthasvarupena bhrantidarshanatah sthitam || 11|| vishnum grasishnum vishvasya sthitisarge
    tatha prabhum | anadim jagatamishamajamakshayamavyayam || 12|| iti brahmapurane ashityadhikashatatamadhyayantargatam
    vyasakritam vishnustotram samaptam | brahmapurana | adhyaya 180
  devanagari: व्यसकृतं विष्णुस्तोत्रम् व्यास उवाच । नमस्कृत्वा सुरेशाय विष्णवे प्रभविष्णवे पूरुषाय पुराणाय
    शाश्वतायाव्ययाय च ॥ १॥ चतुर्व्यूहात्मने तस्मै निर्गुणाय गुणाय च । वरिष्ठाय गरिष्ठाय वरेण्यायामिताय
    च ॥ २॥ यज्ञाङ्गायाखिलाङ्गाय देवाद्यैरीप्सिताय च । यस्मादणुतरं नास्ति यस्मान्नास्ति बृहत्तरम् ॥ ३॥
    येन विश्वमिदं व्याप्तमजेन सचराचरम् । आविर्भावतिरोभावदृष्टादृष्टविलक्षणम् ॥ ४॥ वदन्ति यत्सृष्टमिति
    तथैवाप्युपसंहृतम् । ब्रह्मणे चाऽऽदिदेवाय नमस्कृत्य समाधिना ॥ ५॥ अविकाराय शुद्धाय नित्याय परमात्मने
    । सदैकरूपरूपाय जिष्णवे विष्णवे नमः ॥ ६॥ नमो हिरण्यगर्भाय हरये शङ्कराय च । वासुदेवाय ताराय सर्गस्थित्यन्तकारिणे
    ॥ ७॥ एकानेकस्वरूपाय स्थूलसूक्ष्मात्मने नमः । अव्यक्तव्यक्तभूताय विष्णवे मुक्तिहेतवे ॥ ८॥ सर्गस्थितिविनाशानां
    जगतो यो जगन्मयः । मूलभूतो नमस्तस्मै विष्णवे परमात्मने ॥ ९॥ आधारभूतं विश्वस्याप्यणीयांसमणीयसाम् । प्रणम्य
    सर्वभूतस्थमच्युतं पुरुषोत्तमम् ॥ १०॥ ज्ञानस्वरूपमत्यन्तं निर्मलं परमार्थतः । तमेवार्थस्वरूपेण भ्रान्तिदर्शनतः
    स्थितम् ॥ ११॥ विष्णुं ग्रसिष्णुं विश्वस्य स्थितिसर्गे तथा प्रभुम् । अनादिं जगतामीशमजमक्षयमव्ययम् ॥
    १२॥ इति ब्रह्मपुराणे अशीत्यधिकशततमाध्यायान्तर्गतं व्यसकृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण ।
    अध्याय १८०
