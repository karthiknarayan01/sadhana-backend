id: varunasuktam-1-2
category: veda
name:
  english: varunasuktam 1
  devanagari: वरुणसूक्तम् १
content:
  english: dhaivatah | dhira̱ tva̭sya mahi̱na ja̱numshi̱ vi yasta̱stambha̱ roda̭si cidu̱rvi | pra naka̭mri̱shvam
    nṷnude bri̱hanta̭m dvi̱ta naksha̭tram pa̱pratha̭cca̱ bhuma̭ || 7
  devanagari: धैवतः । धीरा॒ त्व॑स्य महि॒ना ज॒नूंषि॒ वि यस्त॒स्तम्भ॒ रोद॑सी चिदु॒र्वी । प्र नाक॑मृ॒ष्वं
    नु॑नुदे बृ॒हन्तं॑ द्वि॒ता नक्ष॑त्रं प॒प्रथ॑च्च॒ भूम॑ ॥ ७
meaning: {}
