id: kyts-jata-2-4-deva-manushyah-pitarah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 2.4 Deva Manushyah Pitarah - Krishna Yajurveda Taittiriya Samhita
content:
  english: deva manushya manushya deva deva manushyah pitarah pitaro manushya manushyah pitaraste te pitarah
    pitaraste | 'nyato 'nyataste te nnanyato 'nyata asann | asura rakshagmsi rakshagsyasura asura rakshagmsi
    | rakshagmsi pishacah pishaca rakshagmsi rakshagmsi pishacah | pishaca ste te pishacah pishaca ste
    | 'nyato 'nyata ste te ntesha manyato 'nyata stesha devana mutota devana alpam ~lohitam ~lohita malpa
    malpam ~lohitam | nnakurvan ~lohitam ~lohita makurvann | drakshagmsi rakshagmsi ta rakshagmsi ratribhi
    ratribhi rakshagmsi rakshagmsi ratribhih | nratribhi ratribhi rasubhnann | ratribhiriti ratri mrita
    nabhyabhi mrita te deva deva ste te devah | rdeva deva aviduh | ryo yo 'vidu ravidu vai no no vai
    vai nah | mriyate rakshagmsi rakshagmsi mriyate mriyate rakshagmsi | rakshagmsi vai vai rakshagmsi
    rakshagmsi vai | ghnanti ghnantima mimam ghnantititi ghnanti ghnantiti | iti te ta ititi te | te rakshagmsi
    rakshagmsi te te rakshagmsi | rakshag syupopa rakshagmsi rakshag syupa | upamantrayanta mantrayanto
    popa mantrayanta | amantrayanta tani tanyamantrayanta mantrayanta tani | ntani tanyabruvann | vri~namahai
    vrinamahai varam dvrinamahai vrinamahai yat | asuran jayama jayamasura nasuran jayama | ttaj jayama
    jayama tat | asa diti tyasa dasaditi | iti tata stata ititi tatah | tato vai vai tata stato vai |
    vai deva deva vai vai devah | deva asura nasura ndeva deva asuran | nnasura nasura najayann | asuran
    jitva jitva 'sura nasuran jitva | jitva rakshagmsi rakshagmsi jitva jitva rakshagmsi | rakshag syapapa
    rakshagmsi rakshag syapa | apanudanta nudanta papa nudanta | anudanta tani tanyanudanta nudanta tani
    | tani rakshagmsi rakshagmsi tani tani rakshagmsi | rakshag syanrita manritagm rakshagmsi rakshag
    syanritam | anrita makarta kartanrita manrita makarta | akarte tityakarta karte ti | iti samantagm
    samanta mititi samantam | nthsamantagm samanta npari paryavishann | te deva deva ste te devah | deva
    agna vagnau deva deva agnau | agna vanathanta nathantagna vagna vanathanta | anathanta te te 'nathanta
    nathanta te | 'gnaye 'gnaye te te agnaye pravate pravate 'gnaye 'gnaye pravate | mpravate pravate
    purodasha purodasha mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala
    ashtakapalamityashta nnagnaye 'gnaye 'vapa agnaye vibadhavate vibadhavate 'gnaye 'gnaye vibadhavate
    | vibadhavate 'gnaye 'gnaye vibadhavate vibadhavate 'gnaye vibadhavata iti vibadha agnaye pratikavate
    pratikavate 'gnaye 'gnaye pratikavate | tpratikavate pratikavate yat | pratikavata iti pratika agnaye
    pravate pravate 'gnaye 'gnaye pravate | npravate pravate niravapann | yanyevaiva yani yanyeva | tpurasta
    devaiva purasta drakshagmsi rakshagmsi purasta nrakshagmsi rakshag syasann | || tani tena tena tani
    tani tena | tena pra pra tena tena pra | pranudanta nudanta pra pranudanta | dyadanudanta nudanta
    yat | agnaye vibadhavate vibadhavate 'gnaye 'gnaye vibadhavate | vibadhavate yani yani vibadhavate
    vibadhavate yani | vibadhavata iti vibadha yanyevaiva yani yanyeva | evabhito 'bhita evaivabhitah
    | abhito rakshagmsi rakshag syabhito 'bhito rakshagmsi | nrakshagmsi rakshag syasann | tani tena tena
    tani tani tena | tena vi vi tena tena vi | vyabadhanta badhanta vi vyabadhanta | dyadabadhanta badhanta
    yat | agnaye pratikavate pratikavate 'gnaye 'gnaye pratikavate | pratikavate yani yani pratikavate
    pratikavate yani | pratikavata iti pratika yanyevaiva yani yanyeva | tpashca devaiva pashcat | drakshagmsi
    rakshagmsi pashca nrakshagmsi rakshagsyasann | tani tena tena tani tani tena | tenapapa tena tenapa
    | apanudanta nudanta papa nudanta | anudanta tata stato 'nudanta nudanta tatah | tato deva deva stata
    stato devah | ndeva deva abhavann | para 'sura asurah para para 'surah | asura yo yo 'sura asura yah
    | yo yo bhratrivyavan | bhratrivyavaniti bhratrivya spardhamana etayaitaya spardhamana etayeshtye
    shtyaita yaitayeshtya ishtya yajeta yajete shtyeshtya yajeta | yajetagnaye 'gnaye yajeta yajetagnaye
    agnaye pravate pravate 'gnaye 'gnaye pravate | mpravate pravate purodasha purodasha mashtakapala mashtakapala
    mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta vapedagnaye 'gnaye vape
    agnaye vibadhavate vibadhavate 'gnaye 'gnaye vibadhavate | vibadhavate 'gnaye 'gnaye vibadhavate vibadhavate
    'gnaye vibadhavata iti vibadha agnaye pratikavate pratikavate 'gnaye 'gnaye pratikavate | tpratikavate
    pratikavate yat | pratikavata iti pratika agnaye pravate pravate 'gnaye 'gnaye pravate | pravate nirvapati
    nirvapati pravate pravate nirvapati | nirvapati yo yo nirvapati nirvapati yah | evasma dasma devai
    vasma nchreya nasma dasmac chreyan | nbhratrivyo bhratrivya mbhratrivyo bhratrivya stam | tena pra
    pra tena tena pra | pra nudate nudate pra pra nudate | nnudate nudate yat | agnaye vibadhavate vibadhavate
    'gnaye 'gnaye vibadhavate | vibadhavate yo yo vibadhavate vibadhavate yah | vibadhavata iti vibadha
    e vainenainenai vaivainena | nkhsadrim menenainena sadrim | tena vi vi tena tena vi | vi badhate badhate
    vi vi badhate | dbadhate badhate yat | agnaye pratikavate pratikavate 'gnaye 'gnaye pratikavate |
    pratikavate yo yah pratikavate pratikavate yah | pratikavata iti pratika evasma dasma devai vasma
    npapiya nasma dasma tenapapa tena tenapa | apa nudate nudate 'papa nudate | nudate pra pra nudate
    nudate pra | pra shreyagmsagg shreyagmsa mpra pra shreyagmsam | mbhratrivyagg shreyagmsagg shreyagmsa
    nnudate nudate bhratrivya nudate 'tyati nudate nudate 'ti | ati sadrishagm sadrisha matyati sadrisha
    nkramati kramati sadrishagm sadrisha kramati na na kramati kramati na | papiya napno tyapnoti papiya
    npapiya napnoti | pno tyapnoti yah | vidva neta yaitaya vidvan etayeshtye shtyaita yaita yeshtya ishtya
    yajate yajata ishtyeshtya yajate | yajata iti yajate | || ya~tta devasura devasura devasura iti deva
    te deva deva ste te devah | ndeva deva abruvann | yo no no yo yo nah | no viryavattamo viryavattamo
    no no viryavattamah | vi~ryavattamo viryavattama stam | viryavattama iti viryavat anu samarabhamahai
    samarabhamaha anvanu samarabhamahai | samarabhamaha ititi samarabhamahai samarabhamaha iti | samarabhamaha
    iti sam iti te ta ititi te | nnindra mindra mabruvann | vai no no vai vai nah | no viryavattamo viryavattamo
    no no viryavattamah | viryavattamo 'syasi viryavattamo viryavattamo 'si | viryavattama iti viryavat
    ntva masyasi tvam | anu samarabhamahai samarabhamaha anvanu samarabhamahai | samarabhamaha ititi samarabhamahai
    samarabhamaha iti | samarabhamaha iti sam iti sa sa ititi sah | tisro me me tisra stisro me ma ima
    ima me ma imah | ima stanuva stanuva ima ima stanuvah | rviryavati stanuva stanuvo viryavatih | viryavatista
    sta viryavati rviryavati stah | viryavatiriti virya tah prinita prinita ta stah prinita | prinitathatha
    prinita prinitatha | athasura nasura nathatha suran | asura nabhyabhyasura nasura nabhi | abhi bhavishyatha
    bhavishyatha bhyabhi bhavishyatha | bhavishyathe titi bhavishyatha bhavishyathe ti | iti ta sta ititi
    tah | ta vai vai ta sta vai | vai bruhi bruhi vai vai bruhi | bruhititi bruhi bruhiti | nniti tyabruvann
    | iya magmhomu gagmhomu giya miya magmhomuk | agmhomu giya miya magmhomu gagmhomu giyam | agmhomugityagmhah
    vi~mridha vimridheya miyam vi~mridha vimridheyam | iya mindriyavati ndriyavatiya miya mindriyavati
    | indriyavati titi ndriyavati ndriyavatiti | ityabravi dabravi diti tyabravit | ta indraye ndraya
    te ta indraya | indraya gmhomuce 'gmhomuca indraye ndraya gmhomuce agmhomuce purodasha mpurodasha
    magmhomuce 'gmhomuce purodasha agmhomuca ityagmhah purodasha mekadashakapala mekadashakapala mpurodasha
    mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha nnindraye ndraya
    vapa indraya vaimridhaya vaimridhaye ndraye ndraya vaimridhaya | vaimridhaye ndraye ndraya vaimridhaya
    vaimridhaye ndraya | indraye ndriyavata indriyavata indraye ndraye ndriyavate | dyadindriyavata indriyavate
    yat | yadindraye ndraya ya indraya gmhomuce 'gmhomuca indraye ndraya gmhomuce agmhomuce niravapa nnagmhomuce
    'gmhomuce niravapann | agmhomuca ityagmhah nnagmhaso 'gmhaso niravapa agmhasa evaiva gmhaso 'gmhasa
    eva | eva tena tenaivaiva tena | tena mucyanta mucyanta tena tena mucyanta | dyadamucyanta mucyanta
    yat | yadindraye ndraya ya indraya vaimridhaya vaimridhaye ndraye ndraya vaimridhaya | vaimridhaya
    mridho mridho vaimridhaya vaimridhaya mridhah | mridha evaiva mridho mridha eva | eva tena te naivaiva
    tena | tenapapa tena tenapa | dyadaghnata ghnata yat | yadindraye ndraya ya indraye ndriyavata indriyavata
    indraye ndraye ndriyavate | indriyavata indriya mindriya mindriyavata indriyavata indriyam | indriya
    mevaive ndriya mindriya meva | eva tena tenaivaiva tena | ntena tenatmann | adadhata trayastrigmshatkapala
    ntrayastrigmshatkapala madadhatadadhata trayastrigmshatkapalam | trayastrigmshatkapala ntrayastrigmshatkapala
    ntrayastrigmshatkapala trayastrigmshatkapalamiti trayastrigmshat ttrayastrigmsha davapa ntrayastrigmshat
    | dvai vai trayastrigmsha trayastrigmshaditi trayah vai devata devata vai vai devatah devata sta sta
    devata devata stah | ta indra indra sta sta indrah | nnindra indra atmann | anu samarambhayata samarambhayata
    nvanu samarambhayata | samarambhayata bhutyai bhutyai samarambhayata samarambhayata bhutyai mbhutyai
    bhutyai tam | || vava deva deva vava vava devah | ndeva deva vijitim | vijiti muttama muttamam vi~jiti
    muttamam | uttama masu rairasurai ruttama muttama masuraih | rvi vyasurai rasurai vyajayanta jayanta
    vi vyajayanta | ajayanta yo yo 'jayanta jayanta yah | yo yo bhratrivyavan | bhratrivyavaniti bhratrivya
    spardhamana eta yaitaya spardhamana eta yeshtye shtyaita yaita yeshtya ishtya yajeta yajete shtyeshtya
    yajeta | yajete ndraye ndraya yajeta yajete ndraya | indraya gmhomuce 'gmhomuca indraye ndraya gmhomuce
    agmhomuce purodasha mpurodasha magmhomuce 'gmhomuce purodasha agmhomuca ityagmhah purodasha mekadashakapala
    mekadashakapala mpurodasha mekadashakapalam | rnirekadashakapala mekadashakapala ekadashakapalamityekadasha
    vape dindraye ndraya vape indraya vaimridhaya vaimridhaye ndraye ndraya vaimridhaya | vaimridhaye
    ndraye ndraya vaimridhaya vaimridhaye ndraya | indraye ndriyavata indriyavata indraye ndraye ndriyavate
    | indriyavate 'gmhasa 'gmhase ndriyavata indriyavate 'gmhasa | agmhasa vai va agmhasa 'gmhasa vai
    | va esha esha vai va eshah | esha grihito grihita esha esha grihitah | dgrihito grihito yasma dyasmac
    chreyan | nbhratrivyo bhratrivya dbhratrivyo bhratrivyo yat | yadindraye ndraya ya indraya gmhomuce
    'gmhomuca indraye ndraya gmhomuce agmhomuce nirvapati nirvapa tyagmhomuce 'gmhomuce nirvapati | agmhomuca
    ityagmhah nirvapa tyagmhaso 'gmhaso nirvapati nirvapa tyagmhasah | agmhasa evaiva gmhaso 'gmhasa eva
    | eva tena tenaivaiva tena | tena mucyate mucyate tena tena mucyate | mucyate mridha mridha mucyate
    mucyate mridha | mridha vai vai mridha mridha vai | va esha esha vai va eshah | esho 'bhishanno 'bhishanna
    esha esho 'bhishannah | dyasma dabhishanno 'bhishanno yasma thsamaneshu samaneshu yasma ssamaneshu
    samane shvanyah | shreya nutota shreya uta bhratrivyo 'bhratrivya utota bhratrivyah | || dyadabhratrivyo
    'bhratrivyo yat | yadindraye ndraya ya indraya vaimridhaya vaimridhaye ndraye ndraya vaimridhaya |
    vaimridhaya mridho mridho vaimridhaya vaimridhaya mridhah | mridha evaiva mridho mridha eva | eva
    tena te naivaiva tena | tenapapa tena tenapa | apa hate hate 'papa hate | dya ddhate hate yat | yadindraye
    ndraya ya indraye ndriyavata indriyavata indraye ndraye ndriyavate | indriyavata indriya mindriya
    mindriyavata indriyavata indriyam | indriya mevaive ndriya mindriya meva | eva tena te naivaiva tena
    | ntena tena tmann | dhatte trayastrigmshatkapala ntrayastrigmshatkapala ndhatte dhatte trayastrigmshatkapalam
    | trayastrigmshatkapala ntrayastrigmshatkapala ntrayastrigmshatkapala trayastrigmshatkapalamiti trayastrigmshat
    vapati trayastrigmsha dvapati vapati trayastrigmshat | dvai vai trayastrigmsha trayastrigmshaditi
    trayah vai devata devata vai vai devatah devata sta sta devata devata stah | ta evaiva ta sta eva
    | eva yajamano yajamana evaiva yajamanah | yajamano yajamana atmann | anu samarambhayate samarambhayate
    'nvanu samarambhayate | samarambhayate bhutyai bhutyai samarambhayate samarambhayate bhutyai samarambhayata
    iti sam bhutyai sa sa bhutyai bhutyai sa | va eshaisha vai va esha | rvijiti reshaisha vijitih | rnama
    nama vijiti rnama name shtih | ryo ya ishti rishti vidva neta yaitaya vidvan eta yeshtye shtyaita
    yaita yeshtya ishtya yajate yajata ishtyeshtya yajate | yajata uttama muttamam ya~jate yajata uttamam
    | uttama mevaivo ttama muttama meva | vi~jiti mevaiva vijitim | mbhratrivyena bhratrivyena vijitim
    bhratrivyena vi vi bhratrivyena bhratrivyena vi | vi jayate jayate vi vi jayate | jayata iti jayate
    | || ya~tta devasura devasura devasura iti deva ngayatri gayatri tesha gayatryoja ojo gayatri gayatryojah
    | bala mindriya mindriya mbala mindriyam | vi~rya mindriya mindriyam nthsangrihya sangrihya pashu
    sangrihya daya daya sangrihya sangrihya daya | adaya pakramya pakramya daya daya pakramya | apakramya
    tishtha datishtha dapakramya pakramya tishthat | tte te 'tishtha datishtha te 'manyanta manyanta te
    te 'manyanta | amanyanta yataran yatara namanyanta manyanta yataran | iya mupavarthsya tyupavarthsyatiya
    miya mupavarthsyati | upavarthsyati te ta upavarthsya tyupavarthsyati te | upavarthsyatityupa mbhavishyanti
    bhavishyantida mida bhavishyantititi bhavishyanti bhavishyantiti | vyahvayanta hvayanta vi vyahvayanta
    | ahvayanta vishvakarman nnahvayanta hvayanta vishvakarmann | nnititi vishvakarman vishvakarmanniti
    vishva iti deva deva ititi devah | deva dabhi dabhi deva deva dabhi | dabhititi dabhi dabhiti | ityasura
    asura iti tyasurah | ssa sa 'sura asura nanyatara nanyatara shcana cananyatara nanyatarag canopavartato
    pavartata cana canopavartata | upavartata te ta upavartato pavartata te | te deva deva ste te devah
    | ddeva deva etat | 'syasyoja ojo 'si | asi bhrajo bhrajo 'syasi bhrajo bhrajo 'si | ndevana masyasi
    devana dhama nama nama dhama dhama nama | syasi nama namasi | vi~shva masyasi vishva vishva masyasi
    vishvam rvishvayu rasyasi vishvayuh | vishvayuriti vishva sarva masyasi sarvagm sarva masi | asi sarvayuh
    sarvayu rasyasi sarvayuh | sarvayu rabhibhu rabhibhu ssarvayuh sarvayu rabhibhuh | sarvayuriti sarva
    abhibhu riti tyabhibhu rabhibhu riti | iti vava vave titi vava | vava deva deva vava vava devah |
    deva asurana masurana ndeva deva asuranam | asurana moja ojo 'surana masurana mojah | bala mindriya
    mindriya mbala mindriyam | vi~rya mindriya mindriyam pashu navrinjata vrinjata pashu dyadavrinjata
    vrinjata yat | dgayatri gayatri ya gaya tryapakramya pakramya gayatri gaya tryapakramya | apakramya
    tishtha datishtha dapakramya pakramya tishthat | ttasma datishtha datishtha ngayatri gaya tryeta meta
    gayatrititi gayatri gayatriti | itishti mishti mititishti ishti mahu rahu rishti mishti mahuh | vai
    gayatri gayatri vai vai gayatri | va~thsaro gayatri gayatri sam tadapakramya pakramya ta apakramya
    tishtha datishtha dapakramya pakramya tishthat | etaya deva deva eta yaitaya devah | deva asurana
    masurana ndeva deva asuranam | asurana moja ojo 'surana masurana mojah | bala mindriya mindriya mbala
    mindriyam | vi~rya mindriya mindriyam pashu navrinjata vrinjata pashu ttasma davrinjata vrinjata tasma
    va~rga eta metagm sam itishti mishti mititishti ishti mahu rahu rishti mishti mahuh | yo yo bhratrivyavan
    | bhratrivyavaniti bhratrivya spardhamana etayaitaya spardhamana eta yeshtyesht yaita yaita yeshtya
    ishtya yajeta yajete shtyeshtya yajeta | yajetagnaye 'gnaye yajeta yajetagnaye va~rgayagnaye 'gnaye
    sam purodasha mashtakapala mashtakapala mpurodasha mashtakapalam | rnirashtakapala mashtakapala ashtakapalamityashta
    shrita masanna masannagm shritagm shrita masannam | asanna mete naite nasanna masanna metena | etena
    yajusha yajushaite naitena yajusha | yajusha 'bhyabhi yajusha yajusha 'bhi | nmrishe dabhyabhi mrishet
    | mrishe doja ojo mrishe oja evaivauja oja eva | bala mindriya mindriya mbala mindriyam | vi~rya mindriya
    mindriyam nbhratrivyasya bhratrivyasya pashu bhratrivyasya vrinkte vrinkte bhratrivyasya bhratrivyasya
    vrinkte | vrinkte bhavati bhavati vrinkte vrinkte bhavati | bhava tyatmana ''tmana bhavati bhava tyatmana
    atmana para para ''tmana ''tmana para asya bhratrivyo bhratrivyo 'syasya bhratrivyah | bhratrivyo
    bhavati bhavati bhratrivyo bhratrivyo bhavati | prajapatih prajah prajah prajapatih prajapatih prajah
    | prajapatiriti praja praja asrijata srijata prajah praja asrijata | asrijata ta sta asrijata srijata
    tah | tta sta asmat | ssrishta asma dasma srishtah paracih paraci ssrishtah paracih | nparacih paraci
    rayann | ta yatra yatra ta sta yatra | yatra yatra vasann | ttata stato garmut | uda tishtha datishtha
    dudu datishthat | tta sta atishtha datishtha rbrihaspati sta sta brihaspatih | brihaspatishca ca brihaspati
    canvavaita manvavaita anvavaitagm sa so 'nvavaita manvavaitagm sah | rbrihaspati rabravi dabravi brihaspati
    ranaya 'naya brihaspati tva tva 'naya 'naya pra tishthani tishthani pra pra tishthani | tishtha nyathatha
    tishthani tishtha nyatha | atha tva tva 'thatha tva | tva prajah praja stva praja upavarthsya ntyupavarthsyanti
    prajah praja upavarthsyanti | upavarthsyantiti tyupavarthsya ntyupavarthsyantiti | upavarthsyantityupa
    tpra pratishthat | ttata stato 'tishtha datishtha tato vai vai tata stato vai | vai~ vai prajapatim
    | mprajah prajah prajapati prajapatimiti praja praja upavartanto pavartanta prajah praja upavartanta
    | upavartanta yo ya upavartanto pavartanta yah | upavartantetyupa yah prajakamah prajakamo yo yah
    prajakamah | tprajakamah prajakama prajakama iti praja ttasmai tasmai sya ntasmai tasma etam | mprajapatya
    meta meta prajapatyamiti praja prajapati mevaiva prajapati prajapatimiti praja eva svena svenaivaiva
    svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyeno popa bhagadheyena
    bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | evasma asma
    evaivasmai mpraja masma asmai prajam | pra janayati janayati pra pra janayati | janayati prajapatih
    prajapati rjanayati janayati prajapatih | nprajapatih prajapatih pashun | prajapatiriti praja pashu
    nasrijata srijata pashu asrijata te te 'srijata srijata te | ssrishta asma dasma te yatra yatra te
    te yatra | yatra yatra vasann | ttata stato garmut | udatishtha datishtha dudu datishthat | sta natishtha
    datishtha pusha ca ca pusha pusha ca | canvavaita manvavaita anvavaitagm sa so 'nvavaita manvavaitagm
    sah | tpusha pusha 'bravi dabravi pusha 'naya 'naya pusha pusha 'naya anaya ma ma 'naya 'naya ma |
    ma pra pra ma ma pra | pra tishtha tishtha pra pra tishtha | tishthathatha tishtha tishthatha | atha
    tva tva 'thatha tva | tva pashavah pashava stva tva pashavah | pashava upavarthsya ntyupavarthsyanti
    pashavah pashava upavarthsyanti | upavarthsyantiti tyupavarthsya ntyupavarthsyantiti | upavarthsyantityupa
