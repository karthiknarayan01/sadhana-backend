id: kamakhyakavacam-2
category: kavacha
name:
  english: kamakhyakavacam 2
  devanagari: कामाख्याकवचम् २
content:
  english: shrikamakhyakavacam 2 om namah shrikamakhyayai || asya shrikamakhyakavacasya sadashiva rishih
    | anushtupchandah | shrikamakhya devata | dharmarthakamamokshacaturvidhaphalasiddhyarthe jape viniyogah
    || dhyanam | simhasinam mahadevim raktavastram manoharam | pashankushadharam devim kamakhyam cintayed
    budhah || trinetram candravadanam sarvalankarabhushitam | varabhayakaram devim bhaktanugrahakarinim
    || atha kavacam | om kamakhya me shirah patu kameshi lalatakam | bhruvau tripurasundari netre patu
    jagadguruh || 1|| karnau me kalika patu nasikam bhuvaneshvari | mukham me sarvamangalya jihvam vagishvari
    tatha || 2|| dantan patu mahadevi cibukam candikavatu | kantham me bhairavi patu skandhau durga sadavatu
    || 3|| bahu me bhadrakali ca karau patu sureshvari | angulih kamala patu nakhan shrirvijayavatu ||
    4|| vakshah patu jaganmata hridayam parameshvari | stanau me sarvasiddheshi parshvau patu shivapriya
    || 5|| nabhim me kamarupastha katim patu paratpara | guhyam me guhyarupa ca uru patu maheshvari ||
    6|| januni jagadadhara janghe patu jaganmayi | gulphau me kamadayini padau patu kripamayi || 7|| sarvangam
    sarvada patu sarvashaktisvarupini | antarbahishca mam patu kamakhya kamadayini || 8|| purve mam patu
    kamakshi dakshine durgatarini | pashcime parvati patu uttarasyam shivapriya || 9|| agneyyam bhairavi
    patu nairityam kalikavatu | vayavyam patu matangi aishanyam bagalamukhi || 10|| urdhvam patu mahavidya
    adhastat paramambika | sarvato mam sada patu kamakhya vishvamohini || 11|| rane rajakule ghore vane
    shatrusamakule | nadyam girau ca durge ca raksha mam parameshvari || 12|| yah pathet pratarutthaya
    shraddhabhaktisamanvitah | tasya siddhirbhaved devi tvatprasadanna samshayah || 13|| bhuktim muktim
    ca labhate putrapautradisampadah | ante devya mahalokam yati bhaktah sudurlabham || 14|| idam kavacamajnatva
    yo japenmantramishvari | na tasya jayate siddhirvighnairbadhyeta sarvada || 15|| kavacenavrito nityam
    bhakto yah sadhakottamah | tasya haste sada siddhirdevyah karunaya dhruvam || 16|| || iti mayontantre
    shrikamakhyakavacam sampurnam ||
  devanagari: श्रीकामाख्याकवचम् २ ॐ नमः श्रीकामाख्यायै ॥ अस्य श्रीकामाख्याकवचस्य सदाशिव ऋषिः । अनुष्टुप्छन्दः
    । श्रीकामाख्या देवता । धर्मार्थकाममोक्षचतुर्विधफलसिद्ध्यर्थे जपे विनियोगः ॥ ध्यानम् । सिंहासीनां महादेवीं
    रक्तवस्त्रां मनोहराम् । पाशाङ्कुशधरां देवीं कामाख्यां चिन्तयेद् बुधः ॥ त्रिनेत्रां चन्द्रवदनां सर्वालङ्कारभूषिताम्
    । वराभयकरां देवीं भक्तानुग्रहकारिणीम् ॥ अथ कवचम् । ॐ कामाख्या मे शिरः पातु कामेशी ललाटकम् । भ्रुवौ
    त्रिपुरसुन्दरी नेत्रे पातु जगद्गुरुः ॥ १॥ कर्णौ मे कालिका पातु नासिकां भुवनेश्वरी । मुखं मे सर्वमङ्गल्या
    जिह्वां वागीश्वरी तथा ॥ २॥ दन्तान् पातु महादेवी चिबुकं चण्डिकावतु । कण्ठं मे भैरवी पातु स्कन्धौ दुर्गा
    सदावतु ॥ ३॥ बाहू मे भद्रकाली च करौ पातु सुरेश्वरी । अङ्गुलीः कमला पातु नखान् श्रीर्विजयावतु ॥ ४॥ वक्षः
    पातु जगन्माता हृदयं परमेश्वरी । स्तनौ मे सर्वसिद्धेशी पार्श्वौ पातु शिवप्रिया ॥ ५॥ नाभिं मे कामरूपस्था
    कटिं पातु परात्परा । गुह्यं मे गुह्यरूपा च ऊरू पातु महेश्वरी ॥ ६॥ जानुनी जगदाधारा जङ्घे पातु जगन्मयी
    । गुल्फौ मे कामदायिनी पादौ पातु कृपामयी ॥ ७॥ सर्वाङ्गं सर्वदा पातु सर्वशक्तिस्वरूपिणी । अन्तर्बहिश्च
    मां पातु कामाख्या कामदायिनी ॥ ८॥ पूर्वे मां पातु कामाक्षी दक्षिणे दुर्गतारिणी । पश्चिमे पार्वती पातु
    उत्तरस्यां शिवप्रिया ॥ ९॥ आग्नेय्यां भैरवी पातु नैऋत्यां कालिकावतु । वायव्यां पातु मातङ्गी ऐशान्यां
    बगलामुखी ॥ १०॥ ऊर्ध्वं पातु महाविद्या अधस्तात् परमाम्बिका । सर्वतो मां सदा पातु कामाख्या विश्वमोहिनी
    ॥ ११॥ रणे राजकुले घोरे वने शत्रुसमाकुले । नद्यां गिरौ च दुर्गे च रक्ष मां परमेश्वरि ॥ १२॥ यः पठेत्
    प्रातरुत्थाय श्रद्धाभक्तिसमन्वितः । तस्य सिद्धिर्भवेद् देवि त्वत्प्रसादान्न संशयः ॥ १३॥ भुक्तिं मुक्तिं
    च लभते पुत्रपौत्रादिसम्पदः । अन्ते देव्या महालोकं याति भक्तः सुदुर्लभम् ॥ १४॥ इदं कवचमज्ञात्वा यो
    जपेन्मन्त्रमीश्वरि । न तस्य जायते सिद्धिर्विघ्नैर्बाध्येत सर्वदा ॥ १५॥ कवचेनावृतो नित्यं भक्तो यः
    साधकोत्तमः । तस्य हस्ते सदा सिद्धिर्देव्याः करुणया ध्रुवम् ॥ १६॥ ॥ इति मयोन्तन्त्रे श्रीकामाख्याकवचं
    सम्पूर्णम् ॥
