id: dashopanishatsara
category: upanishad
name:
  english: dashopanishatsara
  devanagari: दशोपनिषत्सार
content:
  english: iti vyutpattya brahmavidyapratipadake vedashirobhage'yamupanishacchabdah prayujyate | esha
    vedashirshasthaniyabhago vedantanamna prasiddhah | ayam vedanta eva brahmavidya | brahmano vidya brahmavidya
    | sa ca shuddhacaitanyatmakasya brahmano'bhedena jnanarupa | ata eveyam brahmajnanamiti bhanyate |
    brahmajnanamatmajnanatattvajnanamiti trini namani paryayavacini | saivatmavidya iti kathyate | brahmavidyaiva
    sarvatra samatam darshayati | brahmavidyayaiva'jnanagranthayashchidyante | brahmavidyapraptiprabhavena
    karmacancalyam susamyatam
  devanagari: इति व्युत्पत्त्या ब्रह्मविद्याप्रतिपादके वेदशिरोभागेऽयमुपनिषच्छब्दः प्रयुज्यते । एष वेदशीर्षस्थानीयभागो
    वेदान्तनाम्ना प्रसिद्धः । अयं वेदान्त एव ब्रह्मविद्या । ब्रह्मणो विद्या ब्रह्मविद्या । सा च शुद्धचैतन्यात्मकस्य
    ब्रह्मणोऽभेदेन ज्ञानरूपा । अत एवेयं ब्रह्मज्ञानमिति भण्यते । ब्रह्मज्ञानमात्मज्ञानतत्त्वज्ञानमिति
    त्रीणि नामानि पर्यायवाचीनि । सैवात्मविद्या इति कथ्यते । ब्रह्मविद्यैव सर्वत्र समतां दर्शयति । ब्रह्मविद्ययैवाऽज्ञानग्रन्थयश्छिद्यन्ते
    । ब्रह्मविद्याप्राप्तिप्रभावेण कर्मचाञ्चल्यं सुसंयतं
