id: mankanakarishikritamrudrastotram
category: stotram
name:
  english: mankanakarishikritamrudrastotram
  devanagari: मन्कणकऋषिकृतंरुद्रस्तोत्रम्
content:
  english: mankanakarishikritam rudrastotram tato bhasma kshatadrajannirgatam himasannibham | taddrishtva
    vridito rajansa munih padayorgatah || 107|| nanyam devamaham manye rudratparataram mahat | surasurasya
    jagato gatistvamasi shuladhrik || 108|| tvaya srishtamidam vishvam trailokyam sacaracaram | tvameva
    bhagavansarve pravishanti yugakshaye || 109|| devairapi na shakyastvam parijnatum kuto maya | tvayi
    sarve ca drishyante sura brahmadayo'nagha || 110|| sarvastvamasi lokanam karta karayita ca ha | tvatprasadatsurah
    sarve modantihakutobhayah | evam stutva mahadevam sa rishih pranato'bhavat || 111|| iti mahabharate
    aranyakaparvani 81 adhyayantargatam mankanakarishikritam rudrastotram sampurnam | mahabharata | aranyakaparva
    | adhyaya 81
  devanagari: मङ्कणकऋषिकृतं रुद्रस्तोत्रम् ततो भस्म क्षताद्राजन्निर्गतं हिमसन्निभम् । तद्दृष्ट्वा व्रीडितो
    राजन्स मुनिः पादयोर्गतः ॥ १०७॥ नान्यं देवमहं मन्ये रुद्रात्परतरं महत् । सुरासुरस्य जगतो गतिस्त्वमसि
    शूलधृक् ॥ १०८॥ त्वया सृष्टमिदं विश्वं त्रैलोक्यं सचराचरम् । त्वामेव भगवन्सर्वे प्रविशन्ति युगक्षये
    ॥ १०९॥ देवैरपि न शक्यस्त्वं परिज्ञातुं कुतो मया । त्वयि सर्वे च दृश्यन्ते सुरा ब्रह्मादयोऽनघ ॥ ११०॥
    सर्वस्त्वमसि लोकानां कर्ता कारयिता च ह । त्वत्प्रसादात्सुराः सर्वे मोदन्तीहाकुतोभयाः । एवं स्तुत्वा
    महादेवं स ऋषिः प्रणतोऽभवत् ॥ १११॥ इति महाभारते आरण्यकपर्वणि ८१ अध्यायान्तर्गतं मङ्कणकऋषिकृतं रुद्रस्तोत्रं
    सम्पूर्णम् । महाभारत । आरण्यकपर्व । अध्याय ८१
