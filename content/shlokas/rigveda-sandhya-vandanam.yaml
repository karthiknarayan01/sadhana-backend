id: rigveda-sandhya-vandanam
category: stotram
name:
  english: Rigveda Sandhya Vandanam
content:
  english: shri gurubhyo namah | harih om | sharirashuddhih apavitrah pavitro va sarvavastha ssmaretpundarikaksham
    sa bahyabhyantara shshucih || pundarikaksha pundarikaksha pundarikakshaya namah | acamanam o nnarayanaya
    svaha | o ntrivikramaya namah | om va~manaya namah | om shridharaya namah | om hrishikeshaya namah
    | o ndamodaraya namah | om sankar mpradyumnaya namah | om aniruddhaya namah | o mpurushottamaya namah
    | om athokshajaya namah | o nnarasimhaya namah | om acyutaya namah | o njanardanaya namah | om upendraya
    namah | om haraye namah | om shri krishnaya namah | bhutoccatanam uttishthantu bhutapishacah ya ete
    bhumibharakah | eteshamavirodhena brahmakarma samarabhe || asana samskaram o mprithviti mantrasya
    | meruprishtha rishih | kurmo devata | sutala nchandah | asane viniyogah | anantasanaya namah | o
    mprithvi tvaya dhrita loka devi tvam vi~shnuna dhrita | tva nkuru casanam || pranayamam pranavasya
    parabrahma rishih | paramatma devata | daivi gayatri chandah | pranayame viniyogah || o ntapah | om
    satyam | o mbhargo devasya dhimahi dhiyo yo nah pracodaya t | om apo jyoti raso mbrahma bhurbhuvassvarom
    || sankalpam shri shubhe shobhane muhurte vishnorajnaya atra prithivya njambudvipe bharatavar she
    bharatakhande meroh dakshina digbhage shrishailasya nadyoh madhyadeshe lakshminivasa grihe samasta
    devata brahmana hariharasannidhau adya brahmanah dvitiye pararthe shri shvetavarahakalpe vaivasvata
    manvantare kaliyuge prathamapade asmin vartamana vyavaharika candramanena shri vasare shubhanakshatre
    shubhayoge shubhakarana eva nguna visheshana vishishtayam shubhatithau shrilakshminarayana sayam sandhyamupashishye
    | marjanam apohishtheti tricasya ambarisha ssindhudvipa rishih | apo devata | gayatri chandah | marjane
    viniyogah || om apo hishtha mayobhuvah | ta na urje dadhatana | maheranaya cakshase | yo vah shivatamo
    rasah | tasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavah | yasya kshayaya jinvatha
    | apo janayatha ca nah | mantracamanam suryashcetyasya mantrasya | narayana rishih | suryamamanyu
    manyupatayo ratrirdevata | prakritishchandah | mantracamane viniyogah || om suryashca ma manyushca
    manyupatayashca manyu kritebhyah | papebhyo rakshantam | yadratriya papamakar sham | manasa vaca hastabhyam
    | padbhyamudarena shishna | ratristadavalumpatu | yatkinca durita mmamamrita yonau | surye jyotishi
    juhomi svaha | apah punantvityasya mantrasya | puta rishih | apo devata | ashthi chandah | apa mprashane
    viniyogah | om apah punantu prithivi mprithivi puta punatu mam | punantu brahmanaspatirbrahmaputa
    punatu mam || yaducchishtamabho nca pratigraham svaha agnishcetyasya mantrasya | narayana rishih |
    agnimamanyu manyupatayo ahardevata | prakritishchandah | mantracamane viniyogah || om agnishca ma
    manyushca manyupatayashca manyu kritebhyah | papebhyo rakshantam | yadahna papamakar sham | manasa
    vaca hastabhyam | padbhyamudarena shishna | ahastadavalumpatu | yatkinca durita mmamamrita yonau |
    satye jyotishi juhomi svaha | acamya || punarmarjanam apohishtheti navarcasya suktasya | ambarisha
    sindhudvipa rishih | apo devata | gayatri chandah | pancami vardhamana | saptami pratishtha | antye
    dve anushtubhau | punarmarjane viniyogah || om apo hishtha mayobhuvah | ta na urje dadhatana | maheranaya
    cakshase | yo vah shivatamo rasah | tasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavah
    | yasya kshayaya jinvatha | apo janayatha ca nah | om sha nno devirabhishtaya apo bhavantu pitaye
    | sham yo~rabhi sravantu nah || ishana varyana shaninam | apo yacami bheshajam || apsu me somo abravidantarvishvani
    bheshaja | agni nca vishvashambhuvam || apah prinita bheshajam mama | jyokca surya ndrishe || idamapah
    pravahata yatki mmayi | yadvahamabhidudroha yadva shepa utanritam || apo adyanvacarisham rasena samagasmahi
    | payasvanagna a gahi ta mma sam srija varcasa || sasrishistadapaso divanaktanca sasrishih | varenya
    kraturahama devi ravase huve || papapurusha visarjanam rita ncetyasya mantrasya | aghamar shana rishih
    | bhavavritto devata | anushtu pchandah | mama papapurusha jala visarjane viniyogah || om rita ncabhiddhattapaso
    'dhyajayata | tato ratryajayata tatah samudro arnavah | samudradarnavadadhi sam va~thsaro ajayata
    || ahoratrani vidadhadvishvasya mishato vashi | suryacandramasau dhata yathapurvamakalpayat | diva
    ncantarikshamatho svah || acamya || pranayamam || arghyapradanam purvokta eva nguna visheshana vishishtayam
    shubhatithau shrilakshminarayana prityartha sayam sandhyarghya pradana tatsaviturityasya mantrasya
    | vishvamitra rishih | savita devata | gayatri chandah | prata ssandhyarghyapradane viniyogah || o
    ssvah | tatsaviturvarenya mbhargo devasya dhimahi | dhiyo yo nah pracodayat || ssandhyanga mukhyakalatikramana
    doshapariharartha mprayashcittarghya pradana nkarishye | yadadyakaccetyasya mantrasya | kutsa rishih
    | savita devata | gayatri chandah | prata ssandhyanga prayashcittarghyapradane viniyogah | yadadya
    kacca vritrahannudaga abhisurya | sarva ntadindra te vashe | hamsashshucishadityasya mantrasya | gautamaputro
    vamadeva rishih | suryo devata | jagati chandah | madhyahnika sandhyarghya pradane viniyogah || om
    hamsashshucishadvasurantariksha saddho tavedishadatithirdurona sat | nrishadvara sadrita sadvyoma
    sadabja goja ritaja adrija rita mbrihat | iti prathamarghyam || akrishnenetyasya mantrasya | hiranya
    stupa rishih | savita devata | trishtupchandah | madhyahnika sandhyarghya pradane viniyogah || om
    akrishnena rajasa vartamano niveshayannamrita mmartyanca | hiranya yena savita rathena ''devo yatibhuvanani
    pashyan | iti dvitiyarghyam || tatsaviturityasya mantrasya | vishvamitra rishih | savita devata |
    gayatri chandah | madhyahnika sandhyarghyapradane viniyogah || o ssvah | tatsaviturvarenya mbhargo
    devasya dhimahi | dhiyo yo nah pracodayat | iti tritiyarghyam || madhyahnika sandhyanga mukhyakalatikramana
    doshapariharartha mprayashcittarghya pradana nkarishye | pratardevityasya mantrasya | abhitapa rishih
    | suryo devata | trishtu pchandah | madhyahnika sandhyanga prayashcittarghya pradane viniyogah | o
    mpratardevimaditi dina udita suryasya | raye mitra varuna sarvatatele tokaya tanayaya sham tatsaviturityasya
    mantrasya | vishvamitra rishih | savita devata | gayatri chandah | sayam sandhyarghyapradane viniyogah
    || o ssvah | tatsaviturvarenya mbhargo devasya dhimahi | dhiyo yo nah pracodayat || sayam sandhyanga
    mukhyakalatikramana doshapariharartha mprayashcittarghya pradana nkarishye | udghedabhityasya mantrasya
    | kutsa rishih | savita devata | gayatri chandah | sayam sandhyanga prayashcittarghya pradane viniyogah
    | om udghedabhishruta magham atmapradakshina brahmaiva satya mbrahmaivaham | yosavadityo hiranmayah
    purusha ssa evahamasmi | asavadityo brahma || acamya || pranayamam || nguna visheshana vishishtayam
    shubhatithau shrilakshminarayana prityartha sayam sandhyanga tarpana ntarpayami | gayatri ntarpayami
    | brahmi ntarpayami | savitri ntarpayami | sarasvati ntarpayami | vaishnavi gayatri avahanam omityekakshara
    mbrahma | agnirdevata | brahma ityar sham | gayatri chandah | paramatmam sarupam | sayujyam vi~niyogam
    | ayatu varada devi akshara mbrahma sammitam | gayatri mbrahma jushasva me | yadahna tprati mucyate
    | yadratriya tprati mucyate | sarvavarne mahadevi sandhya vidye sarasvati | ojo 'si balamasi bhrajo
    ndhamanamasi vishvamasi vishvayu ssarvamasi sarvayurabhibhurom | gayatrimavahayami | savitrimavahayami
    | sarasvatimavahayami | chandar shinavahayami | shriyamavahayami | gayatrya gayatri chando vishvamitra
    rishi ssavita devata agnirmukha mbrahma shiro vishnur hridayam rudra shshikha prithivi yonih pranapanavyanodana
    samana sa prana shvetavarna sankhyayana sagotra gayatri caturvimshatyakshara tripada shatkukshih pancashir
    shopanayane viniyogah || purvokta eva nguna visheshana vishishtayam shubhatithau shrilakshminarayana
    prityartha sayam sandhyanga yathashakti gayatri mahamantrajapa nkarishye || karanyasam o ntatsavituh
    brahmatmane angushthabhya vi~shnvatmane tarjanibhya nnamah | bhargo devasya rudratmane madhyamabhya
    nnamah | dhimahi satyatmane anamikabhya nnamah | dhiyo yo nah jnanatmane kanishthikabhya thsarvatmane
    karatala karaprishthabhya nnamah | anganyasam o ntatsavituh brahmatmane hridayaya namah | vare vi~shnvatmane
    shirase svaha | bhargo devasya rudratmane shikhayai vashat | dhimahi satyatmane kavacaya hum | dhiyo
    yo nah jnanatmane netratrayaya vaushat | pracodaya thsarvatmane astraya phat | bhurbhuvassvarom iti
    digbandhah || dhyanam mukta vidruma hemanila dhavalacchayairmukhaistrikshanaih yuktamindu nibaddha
    ratnamakuta ntattvartha varnatmikam | gayatrim va~radabhayankusha kashashshubhrankapala ncakramatharavindayugalam
    hastairvahanti mbhaje || dhyeyassada savitrimandalamadhyavarti narayanassarasijasana sannivishtah
    | keyurava nmakarakundalavan kiriti hari hiranmaya vapurdhritashankhacakrah || ncaiva vyapikanjalika
    nca grathitam sammukhonmukham | pralamba ncaiva matsyah kurmo varahakam | simhakranta ntatha | caturvimshati
    mudra vai gayatryam supratishthitah | iti mudra na janati gayatri nishphalabhavet | ssvah | tatsaviturvare
    nyam | bhargo devasya dhimahi | dhiyo yo nah pracodaya ntatsavituh brahmatmane angushthabhya vi~shnvatmane
    tarjanibhya nnamah | bhargo devasya rudratmane madhyamabhya nnamah | dhimahi satyatmane anamikabhya
    nnamah | dhiyo yo nah jnanatmane kanishthikabhya thsarvatmane karatala karaprishthabhya nnamah | anganyasam
    o ntatsavituh brahmatmane hridayaya namah | vare vi~shnvatmane shirase svaha | bhargo devasya rudratmane
    shikhayai vashat | dhimahi satyatmane kavacaya hum | dhiyo yo nah jnanatmane netratrayaya vaushat
    | pracodaya thsarvatmane astraya phat | bhurbhuvassvarom iti digvimokah || shanam surabhih jnana cakra
    nniryana mudra cetyashtamudrah prakirtitah | suryopasthanam jatavedasetyasya mantrasya kashyapa rishih
    | durgajatavedagnirdevata | trishtu pchandah | suryopasthane viniyogah | o dase sunavama somamaratiyato
    nidahati vedah | sa nah par shadati durgani vishva 'tyagnih || tryambakamiti mantrasya | maitra varunirvasishtha
    rishih | rudro devata | anushtu pchandah | upasthane viniyogah | o mpushtivardhanam | urvarukamiva
    bandhananmrityormrikshiya ma yo~rityasya mantrasya | shamyura rishih | vishvedevah devata | shakvari
    chandah | shantyarthe upasthane viniyogah | o yo~ravrinimahe | gatum ssvastirastu nah | svastirmanushebhyah
    | urdhva njigatu bheshajam | sha namo brahmane ityasya mantrasya prajapati rishih vishvedevah devata
    | jagati shchandah pradakshine viniyogah | o 'stvagnaye namah prithivyai nama oshadhibhyah | namo
    vacaspataye namo vishnave mahate karomi || digdevata namaskarah o nnamah pracyai dishe yashca devata
    etasya mprativasantye tabhyashca namah | o nnamo dakshinayai dishe yashca devata etasya mprativasantye
    tabhyashca namah | o cyai dishe yashca devata etasya mprativasantye tabhyashca namah | o cyai dishe
    yashca devata etasya mprativasantye tabhyashca namah | o nnama urdhvayai dishe yashca devata etasya
    mprativasantye tabhyashca namah | o 'dharayai dishe yashca devata etasya mprativasantye tabhyashca
    namah | o 'vantarayai dishe yashca devata etasya mprativasantye tabhyashca namah || rishi devatadi
    namaskarah namo gangayamunayormadhye ye vasanti te me prasannatmanashcira va~rdhayanti namo gangayamunayormunibhyashca
    namo namo gangayamunayormunibhyashca namah | om sandhyayai namah | savitryai namah | gayatryai namah
    | sarasvatyai namah | sarva bhyo namah | devebhyo namah | rishibhyo namah | munibhyo namah | gurubhyo
    namah | matribhyo namah | pitribhyo namah | kamo nnamo namah | manyurakarishi nnamo namah | yam sada
    sarvabhutani carani sthavarani ca | saya mpratarnamasyanti sama sandhya 'bhirakshatu || devata smaranam
    brahmanyo devakiputro brahmanyo madhusudanah | brahmanyah pundarikaksho brahmanyo vishnuracyutah ||
    namo brahmanyadevaya gobrahmanahitaya ca | jagaddhitaya krishnaya govindaya namo namah || kshirena
    snapite devi candanena vilepite | bilvapatrarcite devi durge ngatah || gayatri prasthana prarthana
    uttame shikhare jate bhumya mparvata murdhani | brahmanebhyo 'bhyanujnata gacchadevi yatha sukham
    || stuto maya varada vedamata pracodayanti pavane dvijata | ayuh prithivya mbrahmavarcasam mahya mbrahmalokam
    || narayana namaskriti namo 'stvanantaya sahasra murtaye sahasra padakshi shiroru bahave | sahasranamne
    purushaya shashvate sahasra koti yugadharine namah || bhumyakashabhivandanam ida ndyava prithivi satyamastu
    | pitarmataryadihopabruve vam | bhuta ndevanamavame avobhih | vidyamesham njiradanum | akashatpatita
    ya~tha gacchati sagaram | sarvadeva namaskarah keshava mpratigacchati || sarvavedeshu yatpunyam sarvatirtheshu
    yatphalam | tatphalam samavapnoti stutva deva njanardanam || vasanadvasudevasya vasita nte jagattrayam
    | sarvabhuta nivaso 'stu te || abhivadanam catussagara paryanta sa gotrah ashvalayanasutrah rik shakhadhyayi
    mbho abhivadaye || acamya || samarpanam yasya smrityaca namoktya tapa ssandhya kriyadishu | nyunam
    sampurnatam ya~ti sadyovande tamacyutam || mantrahina mbhaktihinam ramapate | yatkrita ntu mayadeva
    paripurna ntadastu te || anena pratah sayam sandhyavandanena bhagavan sarvatmaka shshri lakshminarayanah
    priyatam | suprito varado bhavatu | abrahmalokadasheshadalokaloka parvatat | ye santi brahana devastebhyo
    nitya nnamo namah || kayena vaca manasendriyairva buddhyatmana va prakrite ssvabhavat | karomi yadyatsakala
    mparasmai narayanayeti samarpayami || sarvam shrimannarayanarpanamastu ||
  devanagari: श्री गुरुभ्यो नमः । हरिः ओम् । शरीरशुद्धिः अपवित्रः पवित्रो वा सर्वावस्था स्स्मरेत्पुण्डरीकाक्षं
    स बाह्याभ्यन्तर श्शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः । आचमनम् ओ न्नारायणाय स्वाहा
    । ओ न्त्रिविक्रमाय नमः । ॐ वाँमनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ओ न्दामोदराय नमः । ॐ सङ्कर्
    म्प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ओ म्पुरुषोत्तमाय नमः । ॐ अथोक्षजाय नमः । ओ न्नारसिंहाय नमः
    । ॐ अच्युताय नमः । ओ ञ्जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्री कृष्णाय नमः । भूतोच्चाटनम्
    उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन ब्रह्मकर्म समारभे ॥ आसन संस्कारम् ओ म्पृथ्वीति
    मन्त्रस्य । मेरुपृष्ठ ऋषिः । कूर्मो देवता । सुतल ञ्छन्दः । आसने विनियोगः । अनन्तासनाय नमः । ओ म्पृथ्वि
    त्वया धृता लोका देवि त्वं विँष्णुना धृता । त्व ङ्कुरु चासनम् ॥ प्राणायामम् प्रणवस्य परब्रह्म ऋषिः
    । परमात्मा देवता । दैवी गायत्री छन्दः । प्राणायामे विनियोगः ॥ ओ न्तपः । ॐ स॒त्यम् । ओ म्भर्गो॑ दे॒वस्य॑
    धीमहि धीयो॒ यो नः॑ प्रचो॒दया त् । ॐ आपो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भुर्भुव॒स्स्व॒रोम् ॥ सङ्कल्पम् श्री
    शुभे शोभने मुहूर्ते विष्णोराज्ञया अत्र पृथिव्या ञ्जम्बूद्वीपे भरतवर् षे भरतखण्डे मेरोः दक्षिण दिग्भागे
    श्रीशैलस्य नद्योः मध्यदेशे लक्ष्मीनिवास गृहे समस्त देवता ब्राह्मण हरिहरसन्निधौ आद्य ब्रह्मणः द्वितीये
    परार्थे श्री श्वेतवराहकल्पे वैवस्वत मन्वन्तरे कलियुगे प्रथमपादे अस्मिन् वर्तमान व्यावहारिक चान्द्रमानेन
    श्री वासरे शुभनक्षत्रे शुभयोगे शुभकरण एव ङ्गुण विशेषण विशिष्टायां शुभतिथौ श्रीलक्ष्मीनारायण सायं सन्ध्यामुपाशिष्ये
    । मार्जनम् आपोहिष्ठेति तृचस्य अम्बरीष स्सिन्धुद्वीप ऋषिः । आपो देवता । गायत्री छन्दः । मार्जने विनियोगः
    ॥ ॐ आपो॒ हिष्ठा म॑यो॒भुवः॑ । ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो॒ रसः॑ । तस्य॑
    भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवः । यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च
    नः । मन्त्राचमनम् सूर्यश्चेत्यस्य मन्त्रस्य । नारायण ऋषिः । सूर्यमामन्यु मन्युपतयो रात्रिर्देवता ।
    प्रकृतिश्छन्दः । मन्त्राचमने विनियोगः ॥ ॐ सूर्यश्च मा मन्युश्च मन्युपतयश्च मन्यु॑ कृते॒भ्यः । पापेभ्यो॑
    रक्ष॒न्ताम् । यद्रात्रिया पाप॑मका॒र् षम् । मनसा वाचा॑ हस्ता॒भ्याम् । पद्भ्यामुदरे॑ण शि॒श्ना । रात्रि॒स्तद॑वलु॒म्पतु
