id: avanitalam-punaravatirna-syat
category: stotram
name:
  english: Avanitalam Punaravatirna Syat
content:
  english: avanitalam punaravatirna syat samskritagangadhara | dhirabhagirathavamsho'smakam vayam tu kritanirdharah
    || nipatatu panditaharashirasi pravahatu nityamidam vacasi pravishatu vaiyakaranamukham punarapi vahatajjanamanasi
    putrasahasram samuddhritam syat yantu ca janmavikarah || || gramam gramam gacchama samskritashiksham
    yacchama sarveshamapi triptihitartham svaklesham na hi ganayema krite prayatne kim na labheta evam
    santi vicarah || || ya mata samskritimula yasya vyaptissuvishala vanmayarupa sa bhavatu lasatu ciram
    sa vanmala suravanim janavanim kartum yatamahe kritishurah ||
  devanagari: अवनितलं पुनरवतीर्णा स्यात् संस्कृतगङ्गाधारा । धीरभगीरथवंशोऽस्माकं वयं तु कृतनिर्धाराः ॥
    निपततु पण्डितहरशिरसि प्रवहतु नित्यमिदं वचसि प्रविशतु वैयाकरणमुखं पुनरपि वहताज्जनमनसि पुत्रसहस्रं समुद्धृतं
    स्यात् यान्तु च जन्मविकाराः ॥ ॥ ग्रामं ग्रामं गच्छाम संस्कृतशिक्षां यच्छाम सर्वेषामपि तृप्तिहितार्थं
    स्वक्लेशं न हि गणयेम कृते प्रयत्ने किं न लभेत एवं सन्ति विचाराः ॥ ॥ या माता संस्कृतिमूला यस्या व्याप्तिस्सुविशाला
    वाङ्मयरूपा सा भवतु लसतु चिरं सा वाङ्माला सुरवाणीं जनवाणीं कर्तुं यतामहे कृतिशूराः ॥
