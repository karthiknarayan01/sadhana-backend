    ॥ ९९॥ ॐ श्रीं ऐं सौः च चार्वाङ्गी ॐ श्रीं चन्द्रकलाश्रया । ॐ श्रीं चन्द्रकलिप्ताङ्गी ॐ क्रीं पूतासुगन्धिनी
