id: dattanamasankirtanam
category: stotram
name:
  english: dattanamasankirtanam
  devanagari: दत्तनामसन्कीर्तनम्
content:
  english: maharajaviracitam dattanamasankirtanam sampurnam | || iti sham || avadhutacintana shrigurudeva
    datta avadhutacintana shrigurudeva datta avadhutacintana shrigurudeva datta samskritam malakamandaludharah
    karapadmayugme madhyasthapaniyugale damarutrishule | yasyasta urdhvakarayoh shubhashankhacakre vande
    tamatrivaradam bhujashayuktam || om shridattah prasanno'stu shvase shvase dattanama smaratman dattanamasankirtanam
    shridatta datta bhavasagarapota datta shridatta datta surakinnaragita datta | shridatta datta janasamstuta
    datta datta shridatta datta ditavanchita datta datta || 1|| shridatta datta kalitaraka datta datta
    shridatta datta bhayaharaka datta datta | shridatta datta sukhakaraka datta datta shridatta datta
    munidaraka datta datta || 2|| shridatta datta suranayaka datta datta shridatta datta shrutigayaka
    datta datta | shridatta datta gatidayaka datta datta shridatta datta akasayaka datta datta || 3||
    shridatta datta jananatiga datta datta shridatta datta shravanatiga datta datta | shridatta datta
    kavanatiga datta datta shridatta datta pavanatiga datta datta || 4|| shridatta datta nigamagamasara
    datta shridatta datta bhavasagaratara datta | shridatta datta hritabhutalabhara datta shridatta datta
    mukhanirjitamara datta || 5|| shridatta datta bhayamocitalesha datta | shridatta datta hatadaityakulesha
    datta shridatta datta dhritabalasuvesha datta shridatta datta varapingatakesha datta || 6|| shridatta
    datta sukrita'rcita datta datta shridatta datta malavarjita datta datta | shridatta datta suguna'rjita
    datta datta shridatta datta kalagarjita datta datta || 7|| shridatta datta davadagdhaghanesha datta
    shridatta datta bhuvanesha vanesha datta | shridatta datta jatimundiganesha datta shridatta datta
    avadhutajanesha datta || 8|| shridatta datta kamalayatanetra datta shridatta datta shrutigeyacaritra
    datta | shridatta datta suranathasumitra datta shridatta datta bahuveshavicitra datta || 9|| shridatta
    datta karavirasubhiksha datta shridatta datta damanadisushiksha datta | shridatta datta hridashuddhisudiksha
    datta shridatta datta nayakovida daksha datta || 10|| shridatta datta vanavithivihara datta shridatta
    datta dhritamauktikahara datta | shridatta datta kalikalmashatara datta shridatta datta malinoddhritanara
    datta || 11|| shridatta datta surapujita datta datta shridatta datta pikakujita datta datta | shridatta
    datta aligunjita datta datta shridatta datta rajaranjita datta datta || 12|| shridatta datta muninandana
    datta datta shridatta datta agharandhana datta datta | shridatta datta dhritacandana datta datta shridatta
    datta suramandana datta datta || 13|| shridatta datta dadanapriya datta datta shridatta datta hatavikriya
    datta datta | shridatta datta svayamakriya datta datta shridatta datta ditija'priya datta datta ||
    14|| shridatta datta janakamita datta datta shridatta datta vacasa'mita datta datta | shridatta datta
    danuja'jita datta datta shridatta datta malinojjhita datta datta || 15|| shridatta datta karunakara
    datta datta shridatta datta sujatadhara datta datta | shridatta datta priyanirjhara datta datta shridatta
    datta kakubambara datta datta || 16|| shridatta datta varasragdhara datta datta shridatta datta gatamatsara
    datta datta | shridatta datta vritakandara datta datta shridatta datta vidusham vara datta datta ||
    17|| shridatta datta natitushta ganesha datta shridatta datta krititushta dhanesha datta | shridatta
    datta dhritijushta ranesha datta shridatta datta bhuvigupta vanesha datta || 18|| shridatta datta
    varavarnita datta datta shridatta datta kavikirtita datta datta | shridatta datta priyanartita datta
    datta shridatta datta bhayavarjita datta datta || 19|| shridatta datta vrajabhushana datta datta shridatta
    datta ditadushana datta datta | shridatta datta kritamushana datta datta shridatta datta arisudana
    datta datta || 20|| shridatta datta suraposhana datta datta shridatta datta aghashoshana datta datta
    | shridatta datta varaghoshana datta datta shridatta datta munitoshana datta datta || 21|| shridatta
    datta ghanakantisuramya datta shridatta datta varadeshikagamya datta | shridatta datta samakandaraharmya
    datta shridatta datta sulabhapi agamya datta || 22|| shridatta datta calacittavidura datta shridatta
    datta mritacittajapura datta | shridatta datta ranakarkashashura datta shridatta datta shamavannavidura
    datta || 23|| shridatta datta gurudeva sharanya datta shridatta datta gurudeva varenya datta | shridatta
    datta gurudeva vadanya datta shridatta datta gurudeva sudhanya datta || 24|| shridatta datta mukhakanjajitabja
    datta shridatta datta suravandyapadabja datta | shridatta datta sharanagatabhoja datta shridatta datta
    natavanchitada'ja datta || 25|| shridatta datta rinamocana datta datta shridatta datta laghubhojana
    datta datta | shridatta datta kalakujana datta datta shridatta datta hitapujana datta datta || 26||
    shridatta datta manasa smrita datta datta shridatta datta vacasa'rcita datta datta | shridatta datta
    shirasa nata datta datta shridatta datta vapusha''drita datta datta || 27|| shridatta datta janijarana
    datta datta shridatta datta mritimarana datta datta | shridatta datta bhavavarana datta datta shridatta
    datta bhayadarana datta datta || 28|| shridatta datta surasindhvabhishikta datta shridatta datta vidushamatisakta
    datta | shridatta datta parivarjitatikta datta shridatta datta paripalitabhakta datta || 29|| shridatta
    datta munivanditapada datta shridatta datta varavamshaninada datta | shridatta datta parivaritavada
    datta shridatta datta bahumanitasada datta || 30|| shridatta datta sharanagatamitra datta shridatta
    datta bahushobhitacitra datta | shridatta datta parivarjitapatra datta shridatta datta atisundaravaktra
    datta || 31|| shridatta datta bahushikshitamatra datta shridatta datta atipelavagatra datta | shridatta
    datta dhritaramyakapatra datta shridatta datta bahumanitashastra datta || 32|| shridatta datta varamandana
    datta datta shridatta datta parakhandana datta datta | shridatta datta ditabandhana datta datta shridatta
    datta bahuganjana datta datta || 33|| shridatta datta bhavabhanjana datta datta shridatta datta manaso'njana
    datta datta | shridatta datta suraranjana datta datta shridatta datta paramanjana datta datta || 34||
    shridatta datta bhagavan paramesha datta shridatta datta bhagavan hatamesha datta | shridatta datta
    bhagavannajalesha datta shridatta datta bhagavan khajalesha datta || 35|| shridatta datta bhagavannatiramya
    datta shridatta datta bhagavannatidhanya datta | shridatta datta bhagavannatiganya datta shridatta
    datta bhagavannatijanya datta || 36|| shridatta datta bhagavan priyadina datta shridatta datta bhagavan
    priyahina datta | shridatta datta bhagavan dhritamina datta shridatta datta bhagavannajalina datta
    || 37|| shridatta datta bhagavamstrigunesha datta shridatta datta bhagavan vigunesha datta | shridatta
    datta bhagavannriganesha datta shridatta datta bhagavan khaganesha datta || 38|| shridatta datta bhagavan
    munisimha datta shridatta datta bhagavannarasimha datta | shridatta datta bhagavannatisimha datta
    shridatta datta bhagavana gatisimha datta || 39|| shridatta datta bhagavan sugunadhya datta shridatta
    datta bhagavan gatajadya datta | shridatta datta bhagavan suhatadhya datta shridatta datta bhagavana
    varadardhya datta || 40|| shridatta datta bhagavan sakalapta datta shridatta datta bhagavan vikalapta
    datta | shridatta datta bhagavan sagunapta datta shridatta datta bhagavannagunapta datta || 41|| shridatta
    datta bhagavannavadhuta datta shridatta datta bhagavannatiputa datta | shridatta datta bhagavannatahuta
    datta shridatta datta bhagavannatibhuta datta || 42|| shridatta datta avadhuta sumitra datta shridatta
    datta avadhuta kumitra datta | shridatta datta avadhuta lamitra datta shridatta datta avadhuta sucitra
    datta || 43|| shridatta datta giriketana datta datta shridatta datta damavetana datta datta | shridatta
    datta asucetana datta datta shridatta datta aniketana datta datta || 44|| shridatta datta gunasagara
    datta datta shridatta datta natanagara datta datta | shridatta datta vacasam para datta datta shridatta
    datta viyadambara datta datta || 45|| shridatta datta natavatsala datta datta shridatta datta gatakashmala
    datta datta | shridatta datta hatahracchala datta datta shridatta datta shatakaushala datta datta
    || 46|| shridatta datta priyaballava datta datta shridatta datta jitapallava datta datta | shridatta
    datta matasallava datta datta shridatta datta priyakrillava datta datta || 47|| shridatta datta bhagavan
    shishukrida datta shridatta datta bhagavan vibhunida datta | shridatta datta bhagavan hatapida datta
    shridatta datta bhagavannapanida datta || 48|| shridatta datta bhagavan vijanesha datta shridatta
    datta bhagavan sujanesha datta | shridatta datta bhagavannrivaresha datta shridatta datta bhagavan
    shabaresha datta || 49|| shridatta datta shashisuryasunetra datta shridatta datta anileshasupatra
    datta | shridatta datta sharadambujavaktra datta shridatta datta sahana'tisushastra datta || 50||
    shridatta datta bhajatam varadeshta datta shridatta datta bhajatam ditakashta datta | shridatta datta
    vadatamatispashta datta shridatta datta tapatamatishishta datta || 51|| shridatta datta hatadanava
    datta datta shridatta datta vritatanava datta datta | shridatta datta atimanava datta datta shridatta
    datta bahudha nava datta datta || 52|| shridatta datta vacasamatiklishta datta shridatta datta namatam
    ditadishta datta | shridatta datta smaratam kritasvishta datta shridatta datta surakinnarashishta
    datta || 53|| shridatta datta avadhuta rasesha datta shridatta datta avadhuta kanesha datta | shridatta
    datta avadhuta phalesha datta shridatta datta avadhuta ghanesha datta || 54|| shridatta datta avadhuta
    jalesha datta shridatta datta avadhuta sthalesha datta | shridatta datta avadhuta mahesha datta shridatta
    datta avadhuta grahesha datta || 55|| shridatta datta avadhuta kalesha datta shridatta datta avadhuta
    khalesha datta | shridatta datta avadhuta balesha datta shridatta datta avadhuta halesha datta ||
    56|| shridatta datta avadhuta dharesha datta shridatta datta avadhuta naresha datta | shridatta datta
    avadhuta paresha datta shridatta datta avadhuta varesha datta || 57|| shridatta datta avadhuta kavisha
    datta shridatta datta avadhuta gavisha datta | shridatta datta avadhuta pavisha datta shridatta datta
    avadhuta ravisha datta || 58|| shridatta datta avadhuta kshamesha datta shridatta datta avadhuta damesha
    datta | shridatta datta avadhuta yamesha datta shridatta datta avadhuta ramesha datta || 59|| shridatta
    datta bhagavannamaresha datta shridatta datta bhagavannanalesha datta | shridatta datta bhagavannavaresha
    datta shridatta datta bhagavannanilesha datta || 60|| shridatta datta vasudhadhipa datta datta shridatta
    datta surapadapa datta datta | shridatta datta vibudhadhipa datta datta shridatta datta ajapajapa
    datta datta || 61|| shridatta datta bhagavannatidhira datta shridatta datta bhagavannativira datta
    | shridatta datta bhagavannaticira datta shridatta datta bhagavannatinira datta || 62|| shridatta
    datta kusumanjalitushta datta shridatta datta sudalanjalitushta datta | shridatta datta suphalanjalitushta
    datta shridatta datta udakanjalitushta datta || 63|| shridatta datta kamaniyasvarupa datta shridatta
    datta ramaniyasvarupa datta | shridatta datta kavaniyasvarupa datta shridatta datta namaniyasvarupa
    datta || 64|| shridatta datta dhritakambala datta datta shridatta datta atisundara datta datta | shridatta
    datta priyatumbara datta datta shridatta datta jnadhurandhara datta datta || 65|| shridatta datta
    baladarpitakala datta shridatta datta hatakalavikala datta | shridatta datta atibhasurabhala datta
    shridatta datta parikhanditajala datta || 66|| shridatta datta dahara'rcita datta datta shridatta
    datta vipula'rcita datta datta | shridatta datta vimala'rcita datta datta shridatta datta samala'rcita
    datta datta || 67|| shridatta datta navanitamarala datta shridatta datta nagarajakarala datta | shridatta
    datta jarathapi ca bala datta shridatta datta laghurupavishala datta || 68|| shridatta datta gunapujita
    datta datta shridatta datta varapujita datta datta | shridatta datta bahubhojaka datta datta shridatta
    datta bhavayojaka datta datta || 69|| shridatta datta priyamodaka datta datta shridatta datta bahushodhaka
    datta datta | shridatta datta ritabodhaka datta datta shridatta datta bhavarodhaka datta datta ||
    70|| shridatta datta pramada''vrita datta datta shridatta datta jaratha''vrita datta datta | shridatta
    datta vibudha''vrita datta datta shridatta datta abudha''vrita datta datta || 71|| shridatta datta
    dadhitaskara datta datta shridatta datta dhritamaskara datta datta | shridatta datta jitabhaskara
    datta datta shridatta datta kritabhaskara datta datta || 72|| shridatta datta madhura'kshara datta
    datta shridatta datta agama'kshara datta datta | shridatta datta surasakshara datta datta shridatta
    datta aga akshara datta datta || 73|| shridatta datta vacasa vada bhadrajivhe shridatta datta manasa
    smara cittabandho | shridattameva vapusha'rcaya vandya sadho shridattameva shirasa nama ranga dina
    || 74|| namasankirtanam punyam bhaktibhavasamanvitam | bhuktidam muktidam loke kim na payat sada bhayat
    || 75|| datta datta smaran me'yam dehah patatu nirjane carantu pakshinah sarve mishtannam dehajam
    mama || 76|| kashayavasasamajam kamalakshamekam malakamandaludharam ramaniyalilam | goshvanakridanaparam
    nigamantakelim devatrayatmakamaham satatam nato'smi || 77|| janmajanmarjitam punyam papam vapi tathaiva
    ca | datta padarpitam te'stu nasti me kincana'tra ha || 78|| kayena manasa va'pi yadyatkarma shubhashubham
    | karomyatra karishyami tadastu tvatsamarpitam || 79|| dattanamaiva namaiva namaiva mama jivanam |
    kalau nasyeva natyeva natyeva gatiranyatha || 80|| sadacaro duracaro yo vai bhaktya prasevate | dattanamamritam
    hyetat sa sadhurno ciradbhavet || 81|| no papam vidyate loke namna yannaiva dahyate |
  devanagari: महाराजविरचितं दत्तनामसङ्कीर्तनं सम्पूर्णम् । ॥ इति शम् ॥ अवधूतचिन्तन श्रीगुरुदेव दत्त अवधूतचिन्तन
    श्रीगुरुदेव दत्त अवधूतचिन्तन श्रीगुरुदेव दत्त संस्कृतम् मालाकमण्डलुधरः करपद्मयुग्मे मध्यस्थपाणियुगले
    डमरुत्रिशूले । यस्यस्त ऊर्ध्वकरयोः शुभशङ्खचक्रे वन्दे तमत्रिवरदं भुजषयुक्तम् ॥ ॐ श्रीदत्तः प्रसन्नोऽस्तु
    श्वासे श्वासे दत्तनाम स्मरात्मन् दत्तनामसङ्कीर्तनं श्रीदत्त दत्त भवसागरपोत दत्त श्रीदत्त दत्त सुरकिन्नरगीत
    दत्त । श्रीदत्त दत्त जनसंस्तुत दत्त दत्त श्रीदत्त दत्त दितवाञ्छित दत्त दत्त ॥ १॥ श्रीदत्त दत्त कलितारक
    दत्त दत्त श्रीदत्त दत्त भयहारक दत्त दत्त । श्रीदत्त दत्त सुखकारक दत्त दत्त श्रीदत्त दत्त मुनिदारक
    दत्त दत्त ॥ २॥ श्रीदत्त दत्त सुरनायक दत्त दत्त श्रीदत्त दत्त श्रुतिगायक दत्त दत्त । श्रीदत्त दत्त
    गतिदायक दत्त दत्त श्रीदत्त दत्त अकसायक दत्त दत्त ॥ ३॥ श्रीदत्त दत्त जननातिग दत्त दत्त श्रीदत्त दत्त
    श्रवणातिग दत्त दत्त । श्रीदत्त दत्त कवनातिग दत्त दत्त श्रीदत्त दत्त पवनातिग दत्त दत्त ॥ ४॥ श्रीदत्त
    दत्त निगमागमसार दत्त श्रीदत्त दत्त भवसागरतार दत्त । श्रीदत्त दत्त हृतभूतलभार दत्त श्रीदत्त दत्त मुखनिर्जितमार
    दत्त ॥ ५॥ श्रीदत्त दत्त भयमोचितलेश दत्त । श्रीदत्त दत्त हतदैत्यकुलेश दत्त श्रीदत्त दत्त धृतबालसुवेष
    दत्त श्रीदत्त दत्त वरपिङ्गटकेश दत्त ॥ ६॥ श्रीदत्त दत्त सुकृताऽर्चित दत्त दत्त श्रीदत्त दत्त मलवर्जित
    दत्त दत्त । श्रीदत्त दत्त सुगुणाऽर्जित दत्त दत्त श्रीदत्त दत्त कलगर्जित दत्त दत्त ॥ ७॥ श्रीदत्त दत्त
    दवदग्धघनेश दत्त श्रीदत्त दत्त भुवनेश वनेश दत्त । श्रीदत्त दत्त जटिमुण्डिगणेश दत्त श्रीदत्त दत्त अवधूतजनेश
    दत्त ॥ ८॥ श्रीदत्त दत्त कमलायतनेत्र दत्त श्रीदत्त दत्त श्रुतिगेयचरित्र दत्त । श्रीदत्त दत्त सुरनाथसुमित्र
    दत्त श्रीदत्त दत्त बहुवेषविचित्र दत्त ॥ ९॥ श्रीदत्त दत्त करवीरसुभिक्ष दत्त श्रीदत्त दत्त दमनादिसुशिक्ष
    दत्त । श्रीदत्त दत्त हृदशुद्धिसुदीक्ष दत्त श्रीदत्त दत्त नयकोविद दक्ष दत्त ॥ १०॥ श्रीदत्त दत्त वनवीथिविहार
    दत्त श्रीदत्त दत्त धृतमौक्तिकहार दत्त । श्रीदत्त दत्त कलिकल्मषतार दत्त श्रीदत्त दत्त मलिनोद्धृतनार
    दत्त ॥ ११॥ श्रीदत्त दत्त सुरपूजित दत्त दत्त श्रीदत्त दत्त पिककूजित दत्त दत्त । श्रीदत्त दत्त अलिगुञ्जित
    दत्त दत्त श्रीदत्त दत्त रजरञ्जित दत्त दत्त ॥ १२॥ श्रीदत्त दत्त मुनिनन्दन दत्त दत्त श्रीदत्त दत्त अघरन्धन
    दत्त दत्त । श्रीदत्त दत्त धृतचन्दन दत्त दत्त श्रीदत्त दत्त सुरमण्डन दत्त दत्त ॥ १३॥ श्रीदत्त दत्त
    ददनप्रिय दत्त दत्त श्रीदत्त दत्त हतविक्रिय दत्त दत्त । श्रीदत्त दत्त स्वयमक्रिय दत्त दत्त श्रीदत्त
    दत्त दितिजाऽप्रिय दत्त दत्त ॥ १४॥ श्रीदत्त दत्त जनकामित दत्त दत्त श्रीदत्त दत्त वचसाऽमित दत्त दत्त
    । श्रीदत्त दत्त दनुजाऽजित दत्त दत्त श्रीदत्त दत्त मलिनोज्झित दत्त दत्त ॥ १५॥ श्रीदत्त दत्त करुणाकर
    दत्त दत्त श्रीदत्त दत्त सुजटाधर दत्त दत्त । श्रीदत्त दत्त प्रियनिर्झर दत्त दत्त श्रीदत्त दत्त ककुबम्बर
    दत्त दत्त ॥ १६॥ श्रीदत्त दत्त वरस्रग्धर दत्त दत्त श्रीदत्त दत्त गतमत्सर दत्त दत्त । श्रीदत्त दत्त
    वृतकन्दर दत्त दत्त श्रीदत्त दत्त विदुषां वर दत्त दत्त ॥ १७॥ श्रीदत्त दत्त नतितुष्ट गणेश दत्त श्रीदत्त
    दत्त कृतितुष्ट धनेश दत्त । श्रीदत्त दत्त धृतिजुष्ट रणेश दत्त श्रीदत्त दत्त भुविगुप्त वनेश दत्त ॥ १८॥
    श्रीदत्त दत्त वरवर्णित दत्त दत्त श्रीदत्त दत्त कविकीर्तित दत्त दत्त । श्रीदत्त दत्त प्रियनर्तित दत्त
    दत्त श्रीदत्त दत्त भयवर्जित दत्त दत्त ॥ १९॥ श्रीदत्त दत्त व्रजभूषण दत्त दत्त श्रीदत्त दत्त दितदूषण
    दत्त दत्त । श्रीदत्त दत्त कृतमूषण दत्त दत्त श्रीदत्त दत्त अरिसूदन दत्त दत्त ॥ २०॥ श्रीदत्त दत्त सुरपोषण
    दत्त दत्त श्रीदत्त दत्त अघशोषण दत्त दत्त । श्रीदत्त दत्त वरघोषण दत्त दत्त श्रीदत्त दत्त मुनितोषण दत्त
    दत्त ॥ २१॥ श्रीदत्त दत्त घनकान्तिसुरम्य दत्त श्रीदत्त दत्त वरदेशिकगम्य दत्त । श्रीदत्त दत्त समकन्दरहर्म्य
    दत्त श्रीदत्त दत्त सुलभापि अगम्य दत्त ॥ २२॥ श्रीदत्त दत्त चलचित्तविदूर दत्त श्रीदत्त दत्त मृतचित्तजपूर
    दत्त । श्रीदत्त दत्त रणकर्कशशूर दत्त श्रीदत्त दत्त शमवन्नविदूर दत्त ॥ २३॥ श्रीदत्त दत्त गुरुदेव शरण्य
    दत्त श्रीदत्त दत्त गुरुदेव वरेण्य दत्त । श्रीदत्त दत्त गुरुदेव वदान्य दत्त श्रीदत्त दत्त गुरुदेव सुधन्य
    दत्त ॥ २४॥ श्रीदत्त दत्त मुखकञ्जजिताब्ज दत्त श्रीदत्त दत्त सुरवन्द्यपदाब्ज दत्त । श्रीदत्त दत्त शरणागतभोज
    दत्त श्रीदत्त दत्त नतवाञ्छितदाऽज दत्त ॥ २५॥ श्रीदत्त दत्त ऋणमोचन दत्त दत्त श्रीदत्त दत्त लघुभोजन दत्त
    दत्त । श्रीदत्त दत्त कलकूजन दत्त दत्त श्रीदत्त दत्त हितपूजन दत्त दत्त ॥ २६॥ श्रीदत्त दत्त मनसा स्मृत
    दत्त दत्त श्रीदत्त दत्त वचसाऽर्चित दत्त दत्त । श्रीदत्त दत्त शिरसा नत दत्त दत्त श्रीदत्त दत्त वपूषाऽऽदृत
    दत्त दत्त ॥ २७॥ श्रीदत्त दत्त जनिजारण दत्त दत्त श्रीदत्त दत्त मृतिमारण दत्त दत्त । श्रीदत्त दत्त भववारण
    दत्त दत्त श्रीदत्त दत्त भयदारण दत्त दत्त ॥ २८॥ श्रीदत्त दत्त सुरसिन्ध्वभिषिक्त दत्त श्रीदत्त दत्त
    विदुषामतिसक्त दत्त । श्रीदत्त दत्त परिवर्जिततिक्त दत्त श्रीदत्त दत्त परिपालितभक्त दत्त ॥ २९॥ श्रीदत्त
    दत्त मुनिवन्दितपाद दत्त श्रीदत्त दत्त वरवंशनिनाद दत्त । श्रीदत्त दत्त परिवारितवाद दत्त श्रीदत्त दत्त
    बहुमानितसाद दत्त ॥ ३०॥ श्रीदत्त दत्त शरणागतमित्र दत्त श्रीदत्त दत्त बहुशोभितचित्र दत्त । श्रीदत्त
    दत्त परिवर्जितपत्र दत्त श्रीदत्त दत्त अतिसुन्दरवक्त्र दत्त ॥ ३१॥ श्रीदत्त दत्त बहुशिक्षितमात्र दत्त
    श्रीदत्त दत्त अतिपेलवगात्र दत्त । श्रीदत्त दत्त धृतरम्यकपात्र दत्त श्रीदत्त दत्त बहुमानितशास्त्र दत्त
    ॥ ३२॥ श्रीदत्त दत्त वरमण्डन दत्त दत्त श्रीदत्त दत्त परखण्डन दत्त दत्त । श्रीदत्त दत्त दितबन्धन दत्त
    दत्त श्रीदत्त दत्त बहुगञ्जन दत्त दत्त ॥ ३३॥ श्रीदत्त दत्त भवभञ्जन दत्त दत्त श्रीदत्त दत्त मनसोऽञ्जन
    दत्त दत्त । श्रीदत्त दत्त सुररञ्जन दत्त दत्त श्रीदत्त दत्त परमञ्जन दत्त दत्त ॥ ३४॥ श्रीदत्त दत्त भगवन्
    परमेश दत्त श्रीदत्त दत्त भगवन् हतमेष दत्त । श्रीदत्त दत्त भगवन्नजलेश दत्त श्रीदत्त दत्त भगवन् खजलेश
    दत्त ॥ ३५॥ श्रीदत्त दत्त भगवन्नतिरम्य दत्त श्रीदत्त दत्त भगवन्नतिधन्य दत्त । श्रीदत्त दत्त भगवन्नतिगण्य
    दत्त श्रीदत्त दत्त भगवन्नतिजन्य दत्त ॥ ३६॥ श्रीदत्त दत्त भगवन् प्रियदीन दत्त श्रीदत्त दत्त भगवन् प्रियहीन
    दत्त । श्रीदत्त दत्त भगवन् धृतमीन दत्त श्रीदत्त दत्त भगवन्नजलीन दत्त ॥ ३७॥ श्रीदत्त दत्त भगवंस्त्रिगुणेश
    दत्त श्रीदत्त दत्त भगवन् विगुणेश दत्त । श्रीदत्त दत्त भगवन्नृगणेश दत्त श्रीदत्त दत्त भगवन् खगणेश दत्त
    ॥ ३८॥ श्रीदत्त दत्त भगवन् मुनिसिंह दत्त श्रीदत्त दत्त भगवन्नरसिंह दत्त । श्रीदत्त दत्त भगवन्नतिसिंह
    दत्त श्रीदत्त दत्त भगवन गतिसिंह दत्त ॥ ३९॥ श्रीदत्त दत्त भगवन् सुगुणाढ्य दत्त श्रीदत्त दत्त भगवन्
    गतजाड्य दत्त । श्रीदत्त दत्त भगवन् सुहताढ्य दत्त श्रीदत्त दत्त भगवन वरदार्ढ्य दत्त ॥ ४०॥ श्रीदत्त
    दत्त भगवन् सकलाप्त दत्त श्रीदत्त दत्त भगवन् विकलाप्त दत्त । श्रीदत्त दत्त भगवन् सगुणाप्त दत्त श्रीदत्त
    दत्त भगवन्नगुणाप्त दत्त ॥ ४१॥ श्रीदत्त दत्त भगवन्नवधूत दत्त श्रीदत्त दत्त भगवन्नतिपूत दत्त । श्रीदत्त
    दत्त भगवन्नतहूत दत्त श्रीदत्त दत्त भगवन्नतिभूत दत्त ॥ ४२॥ श्रीदत्त दत्त अवधूत सुमित्र दत्त श्रीदत्त
    दत्त अवधूत कुमित्र दत्त । श्रीदत्त दत्त अवधूत लमित्र दत्त श्रीदत्त दत्त अवधूत सुचित्र दत्त ॥ ४३॥ श्रीदत्त
    दत्त गिरिकेतन दत्त दत्त श्रीदत्त दत्त दमवेतन दत्त दत्त । श्रीदत्त दत्त असुचेतन दत्त दत्त श्रीदत्त
    दत्त अनिकेतन दत्त दत्त ॥ ४४॥ श्रीदत्त दत्त गुणसागर दत्त दत्त श्रीदत्त दत्त नटनागर दत्त दत्त । श्रीदत्त
    दत्त वचसां पर दत्त दत्त श्रीदत्त दत्त वियदम्बर दत्त दत्त ॥ ४५॥ श्रीदत्त दत्त नतवत्सल दत्त दत्त श्रीदत्त
    दत्त गतकश्मल दत्त दत्त । श्रीदत्त दत्त हतह्रच्छल दत्त दत्त श्रीदत्त दत्त शतकौशल दत्त दत्त ॥ ४६॥ श्रीदत्त
    दत्त प्रियबल्लव दत्त दत्त श्रीदत्त दत्त जितपल्लव दत्त दत्त । श्रीदत्त दत्त मतसल्लव दत्त दत्त श्रीदत्त
    दत्त प्रियकृल्लव दत्त दत्त ॥ ४७॥ श्रीदत्त दत्त भगवन् शिशुक्रीड दत्त श्रीदत्त दत्त भगवन् विभुनीड दत्त
    । श्रीदत्त दत्त भगवन् हतपीड दत्त श्रीदत्त दत्त भगवन्नपनीड दत्त ॥ ४८॥ श्रीदत्त दत्त भगवन् विजनेश दत्त
    श्रीदत्त दत्त भगवन् सुजनेश दत्त । श्रीदत्त दत्त भगवन्नृवरेश दत्त श्रीदत्त दत्त भगवन् शबरेश दत्त ॥
    ४९॥ श्रीदत्त दत्त शशिसूर्यसुनेत्र दत्त श्रीदत्त दत्त अनिलेशसुपत्र दत्त । श्रीदत्त दत्त शरदम्बुजवक्त्र
    दत्त श्रीदत्त दत्त सहनाऽतिसुशस्त्र दत्त ॥ ५०॥ श्रीदत्त दत्त भजतां वरदेष्ट दत्त श्रीदत्त दत्त भजतां
    दितकष्ट दत्त । श्रीदत्त दत्त वदतामतिस्पष्ट दत्त श्रीदत्त दत्त तपतामतिशिष्ट दत्त ॥ ५१॥ श्रीदत्त दत्त
    हतदानव दत्त दत्त श्रीदत्त दत्त वृततानव दत्त दत्त । श्रीदत्त दत्त अतिमानव दत्त दत्त श्रीदत्त दत्त बहुधा
    नव दत्त दत्त ॥ ५२॥ श्रीदत्त दत्त वचसामतिक्लिष्ट दत्त श्रीदत्त दत्त नमतां दितदिष्ट दत्त । श्रीदत्त
    दत्त स्मरतां कृतस्विष्ट दत्त श्रीदत्त दत्त सुरकिन्नरशिष्ट दत्त ॥ ५३॥ श्रीदत्त दत्त अवधूत रसेश दत्त
    श्रीदत्त दत्त अवधूत कणेश दत्त । श्रीदत्त दत्त अवधूत फलेश दत्त श्रीदत्त दत्त अवधूत घनेश दत्त ॥ ५४॥
    श्रीदत्त दत्त अवधूत जलेश दत्त श्रीदत्त दत्त अवधूत स्थलेश दत्त । श्रीदत्त दत्त अवधूत महेश दत्त श्रीदत्त
    दत्त अवधूत ग्रहेश दत्त ॥ ५५॥ श्रीदत्त दत्त अवधूत कलेश दत्त श्रीदत्त दत्त अवधूत खलेश दत्त । श्रीदत्त
    दत्त अवधूत बलेश दत्त श्रीदत्त दत्त अवधूत हलेश दत्त ॥ ५६॥ श्रीदत्त दत्त अवधूत धरेश दत्त श्रीदत्त दत्त
    अवधूत नरेश दत्त । श्रीदत्त दत्त अवधूत परेश दत्त श्रीदत्त दत्त अवधूत वरेश दत्त ॥ ५७॥ श्रीदत्त दत्त
    अवधूत कवीश दत्त श्रीदत्त दत्त अवधूत गवीश दत्त । श्रीदत्त दत्त अवधूत पवीश दत्त श्रीदत्त दत्त अवधूत
    रवीश दत्त ॥ ५८॥ श्रीदत्त दत्त अवधूत क्षमेश दत्त श्रीदत्त दत्त अवधूत दमेश दत्त । श्रीदत्त दत्त अवधूत
    यमेश दत्त श्रीदत्त दत्त अवधूत रमेश दत्त ॥ ५९॥ श्रीदत्त दत्त भगवन्नमरेश दत्त श्रीदत्त दत्त भगवन्ननलेश
    दत्त । श्रीदत्त दत्त भगवन्नवरेश दत्त श्रीदत्त दत्त भगवन्ननिलेश दत्त ॥ ६०॥ श्रीदत्त दत्त वसुधाधिप दत्त
    दत्त श्रीदत्त दत्त सुरपादप दत्त दत्त । श्रीदत्त दत्त विबुधाधिप दत्त दत्त श्रीदत्त दत्त अजपाजप दत्त
    दत्त ॥ ६१॥ श्रीदत्त दत्त भगवन्नतिधीर दत्त श्रीदत्त दत्त भगवन्नतिवीर दत्त । श्रीदत्त दत्त भगवन्नतिचीर
    दत्त श्रीदत्त दत्त भगवन्नतिनीर दत्त ॥ ६२॥ श्रीदत्त दत्त कुसुमाञ्जलितुष्ट दत्त श्रीदत्त दत्त सुदलाञ्जलितुष्ट
    दत्त । श्रीदत्त दत्त सुफलाञ्जलितुष्ट दत्त श्रीदत्त दत्त उदकाञ्जलितुष्ट दत्त ॥ ६३॥ श्रीदत्त दत्त कमनीयस्वरूप
    दत्त श्रीदत्त दत्त रमणीयस्वरूप दत्त । श्रीदत्त दत्त कवनीयस्वरूप दत्त श्रीदत्त दत्त नमनीयस्वरूप दत्त
    ॥ ६४॥ श्रीदत्त दत्त धृतकम्बल दत्त दत्त श्रीदत्त दत्त अतिसुन्दर दत्त दत्त । श्रीदत्त दत्त प्रियतुम्बर
    दत्त दत्त श्रीदत्त दत्त ज्ञधुरन्धर दत्त दत्त ॥ ६५॥ श्रीदत्त दत्त बलदर्पितकाल दत्त श्रीदत्त दत्त हतकालविकाल
    दत्त । श्रीदत्त दत्त अतिभासुरभाल दत्त श्रीदत्त दत्त परिखण्डितजाल दत्त ॥ ६६॥ श्रीदत्त दत्त दहराऽर्चित
    दत्त दत्त श्रीदत्त दत्त विपुलाऽर्चित दत्त दत्त । श्रीदत्त दत्त विमलाऽर्चित दत्त दत्त श्रीदत्त दत्त
    समलाऽर्चित दत्त दत्त ॥ ६७॥ श्रीदत्त दत्त नवनीतमराल दत्त श्रीदत्त दत्त नगराजकराल दत्त । श्रीदत्त दत्त
    जरठापि च बाल दत्त श्रीदत्त दत्त लघुरूपविशाल दत्त ॥ ६८॥ श्रीदत्त दत्त गुणपूजित दत्त दत्त श्रीदत्त दत्त
    वरपूजित दत्त दत्त । श्रीदत्त दत्त बहुभोजक दत्त दत्त श्रीदत्त दत्त भवयोजक दत्त दत्त ॥ ६९॥ श्रीदत्त
    दत्त प्रियमोदक दत्त दत्त श्रीदत्त दत्त बहुशोधक दत्त दत्त । श्रीदत्त दत्त ऋतबोधक दत्त दत्त श्रीदत्त
    दत्त भवरोधक दत्त दत्त ॥ ७०॥ श्रीदत्त दत्त प्रमदाऽऽवृत दत्त दत्त श्रीदत्त दत्त जरठाऽऽवृत दत्त दत्त
    । श्रीदत्त दत्त विबुधाऽऽवृत दत्त दत्त श्रीदत्त दत्त अबुधाऽऽवृत दत्त दत्त ॥ ७१॥ श्रीदत्त दत्त दधितस्कर
    दत्त दत्त श्रीदत्त दत्त धृतमस्कर दत्त दत्त । श्रीदत्त दत्त जितभास्कर दत्त दत्त श्रीदत्त दत्त कृतभास्कर
    दत्त दत्त ॥ ७२॥ श्रीदत्त दत्त मधुराऽक्षर दत्त दत्त श्रीदत्त दत्त अगमाऽक्षर दत्त दत्त । श्रीदत्त दत्त
    सुरसाक्षर दत्त दत्त श्रीदत्त दत्त अग अक्षर दत्त दत्त ॥ ७३॥ श्रीदत्त दत्त वचसा वद भद्रजिव्हे श्रीदत्त
    दत्त मनसा स्मर चित्तबन्धो । श्रीदत्तमेव वपूषाऽर्चय वन्द्य साधो श्रीदत्तमेव शिरसा नम रङ्ग दीन ॥ ७४॥
    नामसङ्कीर्तनं पुण्यं भक्तिभावसमन्वितम् । भुक्तिदं मुक्तिदं लोके किं न पायात् सदा भयात् ॥ ७५॥ दत्त
    दत्त स्मरन् मेऽयं देहः पततु निर्जने चरन्तु पक्षिणः सर्वे मिष्टान्नं देहजं मम ॥ ७६॥ काषायवाससमजं कमलाक्षमेकं
    मालाकमण्डलुधरं रमणीयलीलम् । गोश्वानक्रीडनपरं निगमान्तकेलिं देवत्रयात्मकमहं सततं नतोऽस्मि ॥ ७७॥ जन्मजन्मार्जितं
    पुण्यं पापं वापि तथैव च । दत्त पादार्पितं तेऽस्तु नास्ति मे किञ्चनाऽत्र ह ॥ ७८॥ कायेन मनसा वाऽपि यद्यत्कर्म
    शुभाशुभम् । करोम्यत्र करिष्यामि तदस्तु त्वत्समर्पितम् ॥ ७९॥ दत्तनामैव नामैव नामैव मम जीवनम् । कलौ
    नास्येव नात्येव नात्येव गतिरन्यथा ॥ ८०॥ सदाचारो दुराचारो यो वै भक्त्या प्रसेवते । दत्तनामामृतं ह्येतत्
    स साधुर्नो चिराद्भवेत् ॥ ८१॥ नो पापं विद्यते लोके नाम्ना यन्नैव दह्यते ।
