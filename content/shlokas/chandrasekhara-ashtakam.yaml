id: chandrasekhara-ashtakam
category: stotram
name:
  english: Chandrasekhara Ashtakam
content:
  english: candrashekhara candrashekhara candrashekhara pahimam | candrashekhara candrashekhara candrashekhara
    rakshamam || ratnasanu sharasanam rajatadri shringa niketanam shinjinikrita pannageshvara macyutanala
    sayakam | kshipradagda puratrayam tridashalayai rabhivanditam candrashekharamashraye mama kim karishyati
    vai yamah || || pancapadapa pushpagandha padambuja dvayashobhitam phalalocana jatapavaka dagdha manmadha
    vigraham | bhasmadigdha kalebaram bhavanashanam bhava mavyayam candrashekhara candrashekhara candrashekhara
    rakshamam || || mattavarana mukhyacarma kritottariya manoharam pankajasana padmalocana pujitanghri
    saroruham | deva sindhu taranga shrikara sikta shubhra jatadharam candrashekhara candrashekhara candrashekhara
    pahimam || || yaksha rajasakham bhagaksha haram bhujanga vibhushanam shailaraja suta parishkrita caruvama
    kalebaram | kshela nilagalam parashvadha dharinam mrigadharinam candrashekhara candrashekhara candrashekhara
    pahimam || || kundalikrita kundalishvara kundalam vrishavahanam naradadi munishvara stutavaibhavam
    bhuvaneshvaram | andhakantaka mashritamara padapam shamanantakam candrashekhara candrashekhara candrashekhara
    rakshamam || || bheshajam bhavarogina makhilapada mapaharinam dakshayajna vinashanam trigunatmakam
    trivilocanam | bhakti mukti phalapradam sakalagha sangha nibarhanam candrashekhara candrashekhara
    candrashekhara rakshamam || marcitam nidhimakshayam haridambaram sarvabhuta patim paratpara maprameya
    manuttamam | somavarina bhuhutashana soma padyakhilakritim candrashekhara candrashekhara candrashekhara
    pahimam || || vishvasrishti vidhayakam punarevapalana tatparam samharam tamapi prapanca masheshaloka
    nivasinam | kridayanta maharnisham gananatha yutha samanvitam candrashekhara candrashekhara candrashekhara
    rakshamam || || mrityubhita mrikandusunukritastavam shivasannidhau yatra kutra ca yah pathenna hi
    tasya mrityubhayam bhavet | purnamayurarogatamakhilarthasampadamadaram candrashekhara eva tasya dadati
    muktimayatnatah ||
  devanagari: चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर पाहिमाम् । चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥
    रत्नसानु शरासनं रजताद्रि शृङ्ग निकेतनं शिञ्जिनीकृत पन्नगेश्वर मच्युतानल सायकम् । क्षिप्रदग्द पुरत्रयं
    त्रिदशालयै रभिवन्दितं चन्द्रशेखरमाश्रये मम किं करिष्यति वै यमः ॥ ॥ पञ्चपादप पुष्पगन्ध पदाम्बुज द्वयशोभितं
    फाललोचन जातपावक दग्ध मन्मध विग्रहम् । भस्मदिग्ध कलेबरं भवनाशनं भव मव्ययं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर
    रक्षमाम् ॥ ॥ मत्तवारण मुख्यचर्म कृतोत्तरीय मनोहरं पङ्कजासन पद्मलोचन पूजिताङ्घ्रि सरोरुहम् । देव सिन्धु
    तरङ्ग श्रीकर सिक्त शुभ्र जटाधरं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर पाहिमाम् ॥ ॥ यक्ष राजसखं भगाक्ष हरं
    भुजङ्ग विभूषणम् शैलराज सुता परिष्कृत चारुवाम कलेबरम् । क्षेल नीलगलं परश्वध धारिणं मृगधारिणम् चन्द्रशेखर
    चन्द्रशेखर चन्द्रशेखर पाहिमाम् ॥ ॥ कुण्डलीकृत कुण्डलीश्वर कुण्डलं वृषवाहनं नारदादि मुनीश्वर स्तुतवैभवं
    भुवनेश्वरम् । अन्धकान्तक माश्रितामर पादपं शमनान्तकं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ॥
    भेषजं भवरोगिणा मखिलापदा मपहारिणं दक्षयज्ञ विनाशनं त्रिगुणात्मकं त्रिविलोचनम् । भक्ति मुक्ति फलप्रदं
    सकलाघ सङ्घ निबर्हणं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ मर्चितं निधिमक्षयं हरिदम्बरं सर्वभूत
    पतिं परात्पर मप्रमेय मनुत्तमम् । सोमवारिन भूहुताशन सोम पाद्यखिलाकृतिं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर
    पाहिमाम् ॥ ॥ विश्वसृष्टि विधायकं पुनरेवपालन तत्परं संहरं तमपि प्रपञ्च मशेषलोक निवासिनम् । क्रीडयन्त
    महर्निशं गणनाथ यूथ समन्वितं चन्द्रशेखर चन्द्रशेखर चन्द्रशेखर रक्षमाम् ॥ ॥ मृत्युभीत मृकण्डुसूनुकृतस्तवं
    शिवसन्निधौ यत्र कुत्र च यः पठेन्न हि तस्य मृत्युभयं भवेत् । पूर्णमायुररोगतामखिलार्थसम्पदमादरं चन्द्रशेखर
    एव तस्य ददाति मुक्तिमयत्नतः ॥
