id: srimad-bhagawad-gita-chapter-8
category: stotram
name:
  english: Srimad Bhagawad Gita Chapter 8
content:
  english: om shri paramatmane namah atha ashtamo'dhyayah | aksharaparabrahmayogah arjuna uvaca kim tadbrahma
    kimadhyatmam kim karma purushottama | adhibhutam ca kim proktamadhidaivam kimucyate || || adhiyajnah
    katham ko'tra dehe'sminmadhusudana | prayanakale ca katham jneyo'si niyatatmabhih || || shribhagavanuvaca
    aksharam brahma paramam svabhavo'dhyatmamucyate | bhutabhavodbhavakaro visargah karmasanjnitah ||
    || adhibhutam ksharo bhavah purushashcadhidaivatam | adhiyajno'hamevatra dehe dehabhritam vara ||
    || antakale ca mameva smaranmuktva kalevaram | yah prayati sa madbhavam yati nastyatra samshayah ||
    || yam yam vapi smaranbhavam tyajatyante kalevaram | tam tamevaiti kaunteya sada tadbhavabhavitah
    || || tasmatsarveshu kaleshu mamanusmara yudhya ca | mayyarpitamanobuddhirmamevaishyasyasamshayam
    || || abhyasayogayuktena cetasa nanyagamina | paramam purusham divyam yati parthanucintayan || ||
    kavim puranamanushasitaramanoraniyamsamanusmaredyah| sarvasya dhataramacintyarupamadityavarnam tamasah
    parastat || || prayanakale manasacalena bhaktya yukto yogabalena caiva| bhruvormadhye pranamaveshya
    samyaksa tam param purushamupaiti divyam || || yadaksharam vedavido vadanti vishanti yadyatayo vitaragah|
    yadicchanto brahmacaryam caranti tatte padam sangrahena pravakshye || || sarvadvarani samyamya mano
    hridi nirudhya ca | murdhnyadhayatmanah pranamasthito yogadharanam || || omityekaksharam brahma vyaharanmamanusmaran
    | yah prayati tyajandeham sa yati paramam gatim || || ananyacetah satatam yo mam smarati nityashah
    | tasyaham sulabhah partha nityayuktasya yoginah || || mamupetya punarjanma duhkhalayamashashvatam
    | napnuvanti mahatmanah samsiddhim paramam gatah || || abrahmabhuvanallokah punaravartino'rjuna |
    mamupetya tu kaunteya punarjanma na vidyate || || sahasrayugaparyantamaharyadbrahmano viduh | ratrim
    yugasahasrantam te'horatravido janah || || avyaktadvyaktayah sarvah prabhavantyaharagame | ratryagame
    praliyante tatraivavyaktasanjnake || || bhutagramah sa evayam bhutva bhutva praliyate | ratryagame'vashah
    partha prabhavatyaharagame || || parastasmattu bhavo'nyo'vyakto'vyaktatsanatanah | yah sa sarveshu
    bhuteshu nashyatsu na vinashyati || || avyakto'kshara ityuktastamahuh paramam gatim | yam prapya na
    nivartante taddhama paramam mama || || purushah sa parah partha bhaktya labhyastvananyaya | yasyantahsthani
    bhutani yena sarvamidam tatam || || yatra kale tvanavrittimavrittim caiva yoginah | prayata yanti
    tam kalam vakshyami bharatarshabha || || agnirjotirahah shuklah shanmasa uttarayanam | tatra prayata
    gacchanti brahma brahmavido janah || || dhumo ratristatha krishnah shanmasa dakshinayanam | tatra
    candramasam jyotiryogi prapya nivartate || || shuklakrishne gati hyete jagatah shashvate mate | ekaya
    yatyanavrittimanyayavartate punah || || naite sriti partha jananyogi muhyati kashcana | tasmatsarveshu
    kaleshu yogayukto bhavarjuna || || vedeshu yajneshu tapahsu caiva daneshu yatpunyaphalam pradishtam|
    atyeti tatsarvamidam viditvayogi param sthanamupaiti cadyam || || om tatsaditi shrimadbhagavadgitasupanishatsu
    brahmavidyayam yogashastre shrikrishnarjunasamvade aksharabrahmayogo namashtamo'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ अष्टमोऽध्यायः । अक्षरपरब्रह्मयोगः अर्जुन उवाच किं तद्ब्रह्म किमध्यात्मं
    किं कर्म पुरुषोत्तम । अधिभूतं च किं प्रोक्तमधिदैवं किमुच्यते ॥ ॥ अधियज्ञः कथं कोऽत्र देहेऽस्मिन्मधुसूदन
    । प्रयाणकाले च कथं ज्ञेयोऽसि नियतात्मभिः ॥ ॥ श्रीभगवानुवाच अक्षरं ब्रह्म परमं स्वभावोऽध्यात्ममुच्यते
    । भूतभावोद्भवकरो विसर्गः कर्मसञ्ज्ञितः ॥ ॥ अधिभूतं क्षरो भावः पुरुषश्चाधिदैवतम् । अधियज्ञोऽहमेवात्र
    देहे देहभृतां वर ॥ ॥ अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम् । यः प्रयाति स मद्भावं याति नास्त्यत्र
    संशयः ॥ ॥ यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम् । तं तमेवैति कौन्तेय सदा तद्भावभावितः ॥ ॥ तस्मात्सर्वेषु
    कालेषु मामनुस्मर युध्य च । मय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयम् ॥ ॥ अभ्यासयोगयुक्तेन चेतसा नान्यगामिना
    । परमं पुरुषं दिव्यं याति पार्थानुचिन्तयन् ॥ ॥ कविं पुराणमनुशासितारमणोरणीयंसमनुस्मरेद्यः। सर्वस्य
    धातारमचिन्त्यरूपमादित्यवर्णं तमसः परस्तात् ॥ ॥ प्रयाणकाले मनसाचलेन भक्त्या युक्तो योगबलेन चैव। भ्रुवोर्मध्ये
    प्राणमावेश्य सम्यक्स तं परं पुरुषमुपैति दिव्यम् ॥ ॥ यदक्षरं वेदविदो वदन्ति विशन्ति यद्यतयो वीतरागाः।
    यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं सङ्ग्रहेण प्रवक्ष्ये ॥ ॥ सर्वद्वाराणि संयम्य मनो हृदि निरुध्य
    च । मूर्ध्न्याधायात्मनः प्राणमास्थितो योगधारणाम् ॥ ॥ ओमित्येकाक्षरं ब्रह्म व्याहरन्मामनुस्मरन् । यः
    प्रयाति त्यजन्देहं स याति परमां गतिम् ॥ ॥ अनन्यचेताः सततं यो मां स्मरति नित्यशः । तस्याहं सुलभः पार्थ
    नित्ययुक्तस्य योगिनः ॥ ॥ मामुपेत्य पुनर्जन्म दुःखालयमशाश्वतम् । नाप्नुवन्ति महात्मानः संसिद्धिं परमां
    गताः ॥ ॥ आब्रह्मभुवनाल्लोकाः पुनरावर्तिनोऽर्जुन । मामुपेत्य तु कौन्तेय पुनर्जन्म न विद्यते ॥ ॥ सहस्रयुगपर्यन्तमहर्यद्ब्रह्मणो
    विदुः । रात्रिं युगसहस्रान्तां तेऽहोरात्रविदो जनाः ॥ ॥ अव्यक्ताद्व्यक्तयः सर्वाः प्रभवन्त्यहरागमे
    । रात्र्यागमे प्रलीयन्ते तत्रैवाव्यक्तसञ्ज्ञके ॥ ॥ भूतग्रामः स एवायं भूत्वा भूत्वा प्रलीयते । रात्र्यागमेऽवशः
    पार्थ प्रभवत्यहरागमे ॥ ॥ परस्तस्मात्तु भावोऽन्योऽव्यक्तोऽव्यक्तात्सनातनः । यः स सर्वेषु भूतेषु नश्यत्सु
    न विनश्यति ॥ ॥ अव्यक्तोऽक्षर इत्युक्तस्तमाहुः परमां गतिम् । यं प्राप्य न निवर्तन्ते तद्धाम परमं मम
    ॥ ॥ पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया । यस्यान्तःस्थानि भूतानि येन सर्वमिदं ततम् ॥ ॥ यत्र
    काले त्वनावृत्तिमावृत्तिं चैव योगिनः । प्रयाता यान्ति तं कालं वक्ष्यामि भरतर्षभ ॥ ॥ अग्निर्जोतिरहः
    शुक्लः षण्मासा उत्तरायणम् । तत्र प्रयाता गच्छन्ति ब्रह्म ब्रह्मविदो जनाः ॥ ॥ धूमो रात्रिस्तथा कृष्णः
    षण्मासा दक्षिणायनम् । तत्र चान्द्रमसं ज्योतिर्योगी प्राप्य निवर्तते ॥ ॥ शुक्लकृष्णे गती ह्येते जगतः
    शाश्वते मते । एकया यात्यनावृत्तिमन्ययावर्तते पुनः ॥ ॥ नैते सृती पार्थ जानन्योगी मुह्यति कश्चन । तस्मात्सर्वेषु
    कालेषु योगयुक्तो भवार्जुन ॥ ॥ वेदेषु यज्ञेषु तपःसु चैव दानेषु यत्पुण्यफलं प्रदिष्टम्। अत्येति तत्सर्वमिदं
    विदित्वायोगी परं स्थानमुपैति चाद्यम् ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासूपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे
    श्रीकृष्णार्जुनसंवादे अक्षरब्रह्मयोगो नामाष्टमोऽध्यायः ॥
