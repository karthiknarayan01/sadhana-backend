id: arunacalastutih
category: stotram
name:
  english: arunacalastutih
  devanagari: अरुणाचलस्तुतिः
content:
  english: 91 kashyam muktirmaranadarunakhyasyacalasya tu smaranat | arunacaleshasamjnam tejolingam smarettadamaranat
    || 1|| pinakinistutih dvidheha sambhuya dhuni pinakini dvidheva raudri hi tanuh pinakini | dvidha
    tanoruttarato'pi caiko yasyah pravahah pravavaha lokah || 2|| pravottara tatra pinakini ya svatiragan
    samvasathanpunani | asyah paro dakshinatah pravaho nananadiyuk pravavaha seyam || 3|| lokastuta yamyapinakiniti
    svayam hi ya sagaramavivesha | manak sadhanartim vina papahantri punanapi nanajanadyadhihantri | anayasato
    ya pinakyaptidatri punatvahamso nah pinakinyavitri || 4|| arunacalatah kancya api dakshinadiksthita
    | cidambarasya kaverya apyudagya punatu mam || 5|| yadhimasavashaccaitryam kritakshaurasya me'lpaka
    | snapanaya kshanadvriddha saddhasevya pinakini || 6|| iti shrivasudevanandasarasvativiracita arunacalapinakinistutishca
    samapta |
  devanagari: ९१ काश्यां मुक्तिर्मरणादरुणाख्यस्याचलस्य तु स्मरणात् । अरुणाचलेशसंज्ञं तेजोलिङ्गं स्मरेत्तदामरणात्
    ॥ १॥ पिनाकिनीस्तुतिः द्विधेह सम्भूय धुनी पिनाकिनी द्विधेव रौद्री हि तनुः पिनाकिनी । द्विधा तनोरुत्तरतोऽपि
    चैको यस्याः प्रवाहः प्रववाह लोकः ॥ २॥ प्रावोत्तरा तत्र पिनाकिनी या स्वतीरगान् संवसथान्पुनानी । अस्याः
    परो दक्षिणतः प्रवाहो नानानदीयुक् प्रववाह सेयम् ॥ ३॥ लोकस्तुता याम्यपिनाकिनीति स्वयं हि या सागरमाविवेश
    । मनाक् साधनार्तिं विना पापहन्त्री पुनानापि नानाजनाद्याधिहन्त्री । अनायासतो या पिनाक्याप्तिदात्री
    पुनात्वहंसो नः पिनाकिन्यवित्री ॥ ४॥ अरुणाचलतः काञ्च्या अपि दक्षिणदिक्स्थिता । चिदम्बरस्य कावेर्या
    अप्युदग्या पुनातु माम् ॥ ५॥ याधिमासवशाच्चैत्र्यां कृतक्षौरस्य मेऽल्पका । स्नापनाय क्षणाद्वृद्धा साद्धासेव्या
    पिनाकिनी ॥ ६॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिता अरुणाचलपिनाकिनीस्तुतिश्च समाप्ता ।
