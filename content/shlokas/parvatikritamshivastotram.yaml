id: parvatikritamshivastotram
category: stotram
name:
  english: parvatikritamshivastotram
  devanagari: पार्वतिकृतंशिवस्तोत्रम्
content:
  english: 30|| varunadisurarcyaya tarunadityavarcase | arunacalanathaya karunamurttaye namah || 31||
    jaya jahnusutacandralekhalankritashekhara | saundaryamohitasheshamunipatnijanashaya || 32|| jaya shailasutasangasambhritanangavaibhava
    | maya narayanabhogakridamredanapandita || 33|| jaya sandhyasamopetasambhritanandatandava | jaya girvanagandharvasiddhavidyadhararcita
    || 34|| jaya herambajanaka jaya shanmukhavatsala | jaya haimavatiprarthya jaya parthivadurlabha ||
    35|| iti shriskandapurane maheshvarakhande'runacalamahatmye uttarardhe vimshadhyayantargatam parvatikritam
    shivastotram samaptam | skandapurana | maheshvarakhanda | arunakhanda | uttarakhanda | adhyaya 20
  devanagari: ३०॥ वरुणादिसुरार्च्याय तरुणादित्यवर्चसे । अरुणाचलनाथाय करुणामूर्त्तये नमः ॥ ३१॥ जय जह्नुसुताचन्द्रलेखालङ्कृतशेखर
    । सौन्दर्यमोहिताशेषमुनिपत्नीजनाशय ॥ ३२॥ जय शैलसुतासङ्गसम्भृतानङ्गवैभव । माया नारायणाभोगक्रीडाम्रेडनपण्डित
    ॥ ३३॥ जय सन्ध्यासमोपेतसम्भृतानन्दताण्डव । जय गीर्वाणगन्धर्वसिद्धविद्याधरार्चित ॥ ३४॥ जय हेरम्बजनक
    जय षण्मुखवत्सल । जय हैमवतीप्रार्थ्य जय पार्थिवदुर्लभ ॥ ३५॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डेऽरुणाचलमाहात्म्ये
    उत्तरार्धे विंशाध्यायान्तर्गतं पार्वतीकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । माहेश्वरखण्ड । अरुणाखण्ड
    । उत्तरखण्ड । अध्याय २०
