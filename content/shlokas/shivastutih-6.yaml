id: shivastutih-6
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: khandakoshakalitakhilapala || 63|| evam stuvanbhadrapade bhadrani labhate narah | datva shambhavavaryanam
    krishnagomithunam shive || 64|| sadakshinam savatsam ca hutva homam vidhanatah | masam naktashano
    bhuyadbhavabhakto jitendriyah || 65|| masante bhadrapaurnamyamevam pujya maheshvaram | svayam bhunjita
    sahito bandhavairbandhamuktaye || 66|| evam bhadrapade mase sampujya parameshvaram | yatyante vamshasahasrairvarairyanairmanoharaih
    || 67|| gitavaditraninadairvirajo'mbaravasasa | gandhacandanamalyadi divyasraganulepanah || 68|| dodhuyamanashcamarairvijito
    vyajanadibhih | viharyaiva padadurdhvam yati matsadanam shive || 69|| tatra me ganapaih sardham modate
    kalamakshayam || 70|| || iti shivarahasyantargate ishvaraproktam bhadrapadamasakrite shivastutih sampurna
    ||
  devanagari: खाण्डकोशकलिताखिलपाल ॥ ६३॥ एवं स्तुवन्भाद्रपदे भद्राणि लभते नरः । दत्वा शाम्भववर्याणां कृष्णगोमिथुनं
    शिवे ॥ ६४॥ सदक्षिणं सवत्सं च हुत्वा होमं विधानतः । मासं नक्ताशनो भूयाद्भवभक्तो जितेन्द्रियः ॥ ६५॥
    मासान्ते भाद्रपौर्णम्यामेवं पूज्य महेश्वरम् । स्वयं भुञ्जीत सहितो बान्धवैर्बन्धमुक्तये ॥ ६६॥ एवं भाद्रपदे
    मासे सम्पूज्य परमेश्वरम् । यात्यन्ते वंशसाहस्रैर्वरैर्यानैर्मनोहरैः ॥ ६७॥ गीतवादित्रनिनदैर्विरजोऽम्बरवाससा
    । गन्धचन्दनमाल्यादि दिव्यस्रगनुलेपनः ॥ ६८॥ दोधूयमानश्चमरैर्वीजितो व्यजनादिभिः । विहार्यैव पदादूर्ध्वं
    याति मत्सदनं शिवे ॥ ६९॥ तत्र मे गणपैः सार्धं मोदते कालमक्षयम् ॥ ७०॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं
    भाद्रपदमासकृते शिवस्तुतिः सम्पूर्णा ॥
