id: acyutashtakam
category: stotram
name:
  english: acyutashtakam
  devanagari: अच्युताष्टकम्
content:
  english: acyutashtakam shankaracaryah acyutashtakam vishnustotrani shankaracaryah acyutam keshavam ramanarayanam
    krishnadamodaram vasudevam harim || shridharam madhavam gopikavallabham janakinayakam ramacandram
    bhaje || 1|| acyutam keshavam satyabhamadhavam madhavam shridharam radhikaradhitam || indiramandiram
    cetasa sundaram devakinandanam nandanam samdadhe || 2|| vishnave jishnave shankhine cakrine rukminiragine
    janakijanaye || vallavivallabhaya'rcitayatmane kamsavidhvamsine vamshine te namah || 3|| krishna govinda
    he rama narayana shripate vasudevajita shrinidhe || acyutananta he madhavadhokshaja dvarakanayaka
    draupadirakshaka || 4|| rakshasakshobhitah sitaya shobhito dandakaranyabhupunyatakaranah || lakshmanenanvito
    vanaraih sevito' gastyasampujito raghavah patu mam || 5|| dhenukarishtako'nishtakriddveshinam keshiha
    kamsahridvamshikavadakah || putanakopakah surajakhelano balagopalakah patu mam sarvada || 6|| vidyududdhayotavanaprasphuradvasasam
    pravridambhodavatprollasadvigraham || vanyaya malaya shobhitorahsthalam lohitamghridvayam varijaksham
    bhaje || 7|| kuncitaih kuntalairbhrajamanananam ratnamaulim lasat kundalam gandayoh || harakeyurakam
    kankanaprojjvalam kinkinimanjulam shyamalam tam bhaje || 8|| acyutasyashtakam yah pathedishtadam prematah
    pratyaham purushah saspriham | vrittatah sumdaram kartri vishvambharam tasya vashyo harirjayate satvaram
    || 9|| || iti shrishamkaracaryaviracitamacyutashtakam sampurnam ||
  devanagari: अच्युताष्टकम् शङ्कराचार्यः अच्युताष्टकम् विष्णुस्तोत्राणि शङ्कराचार्यः अच्युतं केशवं रामनारायणं
    कृष्णदामोदरं वासुदेवं हरिम् ॥ श्रीधरं माधवं गोपिकावल्लभं जानकीनायकं रामचन्द्रं भजे ॥ १॥ अच्युतं केशवं
    सत्यभामाधवं माधवं श्रीधरं राधिकाराधितम् ॥ इन्दिरामन्दिरं चेतसा सुन्दरं देवकीनन्दनं नन्दनं संदधे ॥
    २॥ विष्णवे जिष्णवे शङ्खिने चक्रिणे रुक्मिनीरागिणे जानकीजानये ॥ वल्लवीवल्लभायाऽर्चितायात्मने कंसविध्वंसिने
    वंशिने ते नमः ॥ ३॥ कृष्ण गोविन्द हे राम नारायण श्रीपते वासुदेवाजित श्रीनिधे ॥ अच्युतानन्त हे माधवाधोक्षज
    द्वारकानायक द्रौपदीरक्षक ॥ ४॥ राक्षसक्षोभितः सीतया शोभितो दण्डकारण्यभूपुण्यताकारणः ॥ लक्ष्मणेनान्वितो
    वानरैः सेवितोऽ गस्त्यसंपूजितो राघवः पातु माम् ॥ ५॥ धेनुकारिष्टकोऽनिष्टकृद्द्वेषिणां केशिहा कंसहृद्वंशिकावादकः
    ॥ पूतनाकोपकः सूरजाखेलनो बालगोपालकः पातु माम् सर्वदा ॥ ६॥ विद्युदुद्धयोतवानप्रस्फुरद्वाससं प्रावृडम्भोदवत्प्रोल्लसद्विग्रहम्
    ॥ वन्यया मालया शोभितोरःस्थलं लोहितांघ्रिद्वयं वारिजाक्षं भजे ॥ ७॥ कुञ्चितैः कुन्तलैर्भ्राजमानाननं
    रत्नमौलिं लसत् कुण्डलं गण्डयोः ॥ हारकेयूरकं कङ्कणप्रोज्ज्वलं किङ्किणीमञ्जुलं श्यामलं तं भजे ॥ ८॥ अच्युतस्याष्टकं
    यः पठेदिष्टदं प्रेमतः प्रत्यहं पूरुषः सस्पृहम् । वृत्ततः सुंदरं कर्तृ विश्वंभरं तस्य वश्यो हरिर्जायते
    सत्वरम् ॥ ९॥ ॥ इति श्रीशंकराचार्यविरचितमच्युताष्टकं संपूर्णम् ॥
