id: kyts-4-5-namaste-rudra-manyava-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.5 Namaste Rudra Manyava - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande pancamah prashnah shri gurubhyo namah
    | harih om || namaste rudra manyava utota ishave namah | namaste astu dhanvane bahubhyamuta te namah
    || ya ta ishuh shivatama shiva mbabhuva te dhanuh | shiva sharavya ya tava taya no rudra mridaya ||
    ya te rudra shiva tanuraghora 'papakashini | taya nastanuva shantamaya girishantabhi cakashihi ||
    yamishu nkuru ma higmsih purusha njagat || shivena vacasa tva girishaccha vadamasi | yatha na jjagadayakshmagm
    sumana asat || addhyavocadadhivakta prathamo daivyo bhishak | ahigshca sarva shca yatu dhanyah ||
    asau yastamro aruna uta babhru ssumangalah | ye cemagm rudra abhito dikshu ssahasrasho 'vaishagm heda
    imahe || asau yo 'vasarpati nilagrivo vilohitah | utaina nnudaharyah | utainam vi~shva bhutani sa
    drishto mridayati nah || namo astu nilagrivaya sahasrakshaya midhushe | atho ye asya satvano ntebhyo
    'karannamah || pramunca dhanvanastva mubhayo rartniyorjyam | yashca te hasta ishavah para ta bhagavo
    vapa || avatatya dhanustvagm sahasraksha shateshudhe | nishirya shalyana mmukha shivo nah sumana bhava
    || vijya ndhanuh kapardino vishalyo banavagm uta | aneshannasyeshava abhurasya nishangathih || ya
    te heti rmidhushtama haste babhuva te dhanuh | taya vishvata stvamayakshmaya paribbhuja || namaste
    astvayudhaya | ubhabhya muta te namo bahubhya ntava dhanvane || pari te dhanvano hetirasman vrinaktu
    vishvatah | atho ya ishudhistavare asma namo hiranya bahave senanye dishanca pataye namo namo vrikshebhyo
    harikeshebhyah pashuna mpataye namo namah saspinjaraya tvishimate pathina mpataye namo namo babhlushaya
    vivyadhine mpataye namo namo harikeshayo pavitine pushtana mpataye namo namo bhavasya hetyai jagata
    mpataye namo namo rudraya tatavine kshetrana mpataye namo namah sutaya rohitaya sthapataye vrikshana
    mpataye namo namo mantrine vanijaya kakshana mpataye namo namo bhuvantaye varivaskrita mpataye namo
    nama uccai rghoshaya krandayate pattina mpataye namo namah krithsnavitaya dhavate sattvana ekannatrigmshacca
    ssahamanaya nivyadhina avyadhinina mpataye namo namah kakubhaya nishangine mpataye namo namo nishangina
    ishudhimate taskarana mpataye namo namo vancate parivancate stayuna mpataye namo namo nicerave paricarayaranyana
    mpataye namo namah srikavibhyo jighagmsadbhyo mushnata mpataye namo namo 'simadbhyo nakta ncaradbhyah
    prakrintana mpataye namo nama ushnishine giricaraya kuluncana ishumadbhyo dhanvavibhyashca vo namo
    nama atanvanebhyah pratidadhanebhyashca vo namo nama ayacchadbhyo visrijadbhyashca vo namo namo 'syadbhyo
    viddhyadbhyashca vo namo nama asinebhya shshayanebhyashca vo namo namah svapadbhyo jagradbhyashca
    vo namo namastishthadbhyo dhavadbhyashca vo namo namah sabhabhyah sabhapatibhyashca vo namo namo ashvebhyo
    'shvapatibhya shca vo namah || bhyo vividdhyantibhyashca vo namo nama uganabhya strigmhatibhyashca
    vo namo namo grithsebhyo grithsapatibhyashca vo namo namo vrate bhyo vratapatibhyashca vo namo namo
    ganebhyo ganapatibhyashca vo namo namo virupebhyo vishvarupebhyashca vo namo namo mahadbhyah kshullakebhyashca
    vo namo namo rathibhyo 'rathebhyashca vo namo namo rathe rathapatibhyashca vo namo nama ssenanibhyashca
    vo namo namah kshattribhyah sangrahitribhyashca vo namo namastakshabhyo rathakarebhyashca vo namo
    namah kulalebhyah karmare bhyashca vo namo namah punjishte bhyo nishadebhyashca vo namo nama ishukridbhyo
    dhanvakridbhyashca vo namo namo mrigayubhyah shvanibhyashca vo namo nama shshvapatibhyashca vo namah
    || namo bhavaya ca rudraya ca namah sharvaya ca pashupataye ca namo nilagrivaya ca shitikanthaya ca
    namah kapardine ca vyuptakeshaya ca namah sahasrakshaya ca shatadhanvane ca namo girishaya ca shipivishtaya
    ca namo midhushtamaya ceshumate ca namo hrasvaya ca vamanaya ca namo brihate ca var shiyase ca namo
    vriddhaya ca sam namo agriyaya ca prathamaya ca nama ashave cajiraya ca nama sshighriyaya ca shibhyaya
    ca nama urmyaya cavasvanyaya ca namah srotasyaya ca dvipyaya ca || jyeshthaya ca kanishthaya ca namah
    purvajaya caparajaya ca namo maddhyamaya capagalbhaya ca namo jaghanyaya ca buddhniyaya ca namah sobhyaya
    ca pratisaryaya ca namo yamyaya ca kshemyaya ca nama urvaryaya ca khalyaya ca nama shshlokyaya cavasanyaya
    ca namo vanyaya ca kakshyaya ca namah shravaya ca pratishravaya ca nama ashushenaya cashurathaya ca
    nama shshuraya cavabhindate ca namo varmine ca varuthine ca namo bilmine ca kavacine ca namah shrutaya
    ca shrutasenaya ca || namo dundubhyaya cahananyaya ca namo dhrishnave ca pramrishaya ca namo dutaya
    ca prahitaya ca namo nishangine ceshudhimate ca nama stikshneshave cayudhine ca namah svayudhaya ca
    sudhanvane ca nama ssrutyaya ca pathyaya ca namah katyaya ca nipyaya ca nama ssudyaya ca sarasyaya
    ca namo nadyaya ca vaishantaya ca namah kupyaya cavatyaya ca namo var shyaya ca namo meghyaya ca vidyutyaya
    ca nama iddhriyaya catapyaya ca namo vatyaya ca reshmiyaya ca namo vastavyaya ca vastupaya ca || ssomaya
    ca rudraya ca namastamraya carunaya ca namah shangaya ca pashupataye ca nama ugraya ca bhimaya ca
    namo agrevadhaya ca durevadhaya ca namo hantre ca haniyase ca namo vrikshebhyo harikeshebhyo namastaraya
    namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca
    namastirthyaya ca kulyaya ca namah paryaya cavaryaya ca namah prataranaya cottaranaya ca nama ataryaya
    caladyaya ca nama shshashpyaya ca phenyaya ca namah sikatyaya ca pravahyaya ca || nama irinyaya ca
    prapathyaya ca namah kigmshilaya ca kshayanaya ca namah kapardine ca pulastaye ca namo goshthyaya
    ca grihyaya ca namastalpyaya ca gehyaya ca namah katyaya ca gahvareshthaya ca namo hradayyaya ca niveshpyaya
    ca namah pagmsavyaya ca rajasyaya ca nama shshushkyaya ca harityaya ca namo lopyaya colapyaya ca nama
    urvyaya ca surmyaya ca namah parnyaya ca parnashadyaya ca namo 'paguramanaya cabhighnate ca nama akkhidate
    ca prakkhidate ca namo vah kirikebhyo devanagm hridayebhyo namo vikshinakebhyo namo vicinvatkebhyo
    nama anir hatebhyo nama amivatkebhyah || drape andhasaspate daridrannilalohita | esha nkincanamamat
    || ya te rudra shiva tanu shshiva vishvahabheshaji | shiva rudrasya bheshaji taya no mrida jivase
    || imagm rudraya tavase kapardine kshayadviraya prabharamahe matim | yatha na ddvipade catushpade
    vishva nnanaturam || mrida no rudro tano mayaskridhi kshayadviraya namasa vidhema te | yaccha nca
    yoshca manurayaje pita tadashyama tava rudra pranitau || ma no mahantamuta ma no arbhaka mma na ukshantamuta
    ma na ukshitam | ma no vadhih pitara mpriya ma nastanuvo rudra ririshah || ma nastoke tanaye ma na
    ayushi ma no goshu ma no ashveshu ririshah | vira nmano rudra bhamito vadhir havishmanto namasa vidhema
    te || aratte goghna uta purushaghne kshayadviraya sumnamasme te astu | raksha ca no adhi ca deva bruhyadha
    ca na shsharma yaccha dvibar mugram | mrida jaritre rudra stavano anyante asmannivapantu senah ||
    parino rudrasya heti rvrinaktu paritveshasya durmatiraghayoh | ava sthira maghavadbhya stanushva midhvastokaya
    tanayaya mridaya || midhushtama shivatama shivo nah sumana bhava | parame vriksha ayudha va~sana acara
    pinaka mbibhradagahi || vikirida vilohita namaste astu bhagavah | yaste sahasragm hetayo masmanni
    vapantu tah || sahasrani sahasradha bahuvostava hetayah | tasamishano bhagavah paracina mukha kridhi
    || mekannatrigmshacca sahasrani sahasrasho ye rudra adhi bhumya m | teshagm sahasrayojane 'vadhanvani
    tanmasi || asmi 'ntarikshe bhava adhi || nilagriva kshamacarah || nilagriva shshitikantha divagm rudra
    upashritah || ye vriksheshu saspinjara nilagriva vilohitah || ye bhutana madhipatayo vishikhasah kapardinah
    || ye anneshu vividdhyanti patreshu pibato janan || ye patha mpathirakshaya ailabrida yavyudhah ||
    ye tirthani pracaranti srikavanto nishanginah || ya etavantashca bhuyagmsashca disho rudra vitasthire
    || teshagm sahasrayojane 'vadhanvani tanmasi || namo rudrebhyo ye prithivyam 'ntarikshe ye divi yeshamannam
    ~vato varshamishavastebhyo dasha praci rdashadakshina dashapratici rdashodici rdashordhva stebhyo
    namaste no mridayantu te ya ndvishmo yashca no dveshti tam || harih om || || krishna yajurvediya taittiriya
    samhitaya ncaturtha kande pancamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे पञ्चमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ नम॑स्ते रुद्र म॒न्यव॑ उ॒तोत॒ इष॑वे॒ नमः॑ । नम॑स्ते अस्तु॒ धन्व॑ने बा॒हुभ्या॑मु॒त ते॒ नमः॑ ॥
    या त॒ इषुः॑ शि॒वत॑मा शि॒व म्ब॒भूव॑ ते॒ धनुः॑ । शि॒वा श॑र॒व्या॑ या तव॒ तया॑ नो रुद्र मृडय ॥ या ते॑
    रुद्र शि॒वा त॒नूरघो॒रा ऽपा॑पकाशिनी । तया॑ नस्त॒नुवा॒ शन्त॑मया॒ गिरि॑शन्ता॒भि चा॑कशीहि ॥ यामिषु॑ ङ्कु॑रु॒
    मा हिग्ं॑सीः॒ पुरु॑ष॒ ञ्जग॑त् ॥ शि॒वेन॒ वच॑सा त्वा॒ गिरि॒शाच्छा॑ वदामसि । यथा॑ न॒ ज्जग॑दय॒क्ष्मग्ं
    सु॒मना॒ अस॑त् ॥ अद्ध्य॑वोचदधिव॒क्ता प्र॑थ॒मो दैव्यो॑ भि॒षक् । अहीग्॑श्च॒ सर्वा श्च यातु धा॒न्यः॑ ॥
    अ॒सौ यस्ता॒म्रो अ॑रु॒ण उ॒त ब॒भ्रु स्सु॑म॒ङ्गलः॑ । ये चे॒माग्ं रु॒द्रा अ॒भितो॑ दि॒क्षु स्स॑हस्र॒शो
    ऽवै॑षा॒ग्ं॒ हेड॑ ईमहे ॥ अ॒सौ यो॑ ऽव॒सर्प॑ति॒ नील॑ग्रीवो॒ विलो॑हितः । उ॒तैन॑ न्नुदहा॒र्यः॑ । उ॒तैनं॒
    विँश्वा॑ भू॒तानि॒ स दृ॒ष्टो मृ॑डयाति नः ॥ नमो॑ अस्तु॒ नील॑ग्रीवाय सहस्रा॒क्षाय॑ मी॒ढुषे । अथो॒ ये
    अ॑स्य॒ सत्वा॑नो॒ न्तेभ्यो॑ ऽकर॒न्नमः॑ ॥ प्रमु॑ञ्च॒ धन्व॑न॒स्त्व मु॒भयो॒ रार्त्नि॑यो॒र्ज्याम् । याश्च॑
    ते॒ हस्त॒ इष॑वः॒ परा॒ ता भ॑गवो वप ॥ अ॒व॒तत्य॒ धनु॒स्त्वग्ं सह॑स्राक्ष॒ शते॑षुधे । नि॒शीर्य॑ श॒ल्याना॒
    म्मुखा॑ शि॒वो नः॑ सु॒मना॑ भव ॥ विज्य॒ न्धनुः॑ कप॒र्दिनो॒ विश॑ल्यो॒ बाण॑वाग्ं उ॒त । अने॑शन्न॒स्येष॑व
    आ॒भुर॑स्य निष॒ङ्गथिः॑ ॥ या ते॑ हे॒ति र्मी॑ढुष्टम॒ हस्ते॑ ब॒भूव॑ ते॒ धनुः॑ । तया॒ वि॒श्वत॒ स्त्वम॑य॒क्ष्मया॒
    परि॑ब्भुज ॥ नम॑स्ते अ॒स्त्वायु॑धा॒या । उ॒भाभ्या॑ मु॒त ते॒ नमो॑ बा॒हुभ्या॒ न्तव॒ धन्व॑ने ॥ परि॑ ते॒
    धन्व॑नो हे॒तिर॒स्मान् वृ॑णक्तु वि॒श्वतः॑ । अथो॒ य इ॑षु॒धिस्तवा॒रे अ॒स्म नमो॒ हिर॑ण्य बाहवे सेना॒न्ये॑
