id: shakambharivanashankarisahasranamastotra
category: sahasranama
name:
  english: shakambharivanashankarisahasranamastotra
  devanagari: शाकम्भरीवनशण्करीसहस्रनामस्तोत्र
content:
  english: ringaradevata gramadevata caityadevata || 92|| purdevata rajasabhadevata'shokadevata | caturdashanam
    lokanam devata paradevata || 93|| vapikupatadagadidevata vanadevata | srishtikhela kshemakhela pratisamharakhelana
    || 94|| pushpaparyankashayana pushpavatkundaladvayi | tambulacarvanaprita gauri prathamapushpini ||
    95|| kalyaniyugasampanna kamasanjivani kala | kalakalapakushala kalatita kalatmika || 96|| mahajangalaki
    kalabhujangavishanashini | cikitsa vaidyavidya ca nanamayanidanavit || 97|| pittaprakopashamani vataghni
    kaphanashini | amajvaraprakopaghni navajvaranivarini || 98|| arshoghni shulashamani gulmavyadhinivarini
    | grahaninigrahakari rajayakshmavinashini || 99|| mehaghni pandurogaghni kshayapasmaranashini | upadamshahari
    shvasakasacchardinivarini || 100|| plihaprakopasamhartri pamakanduvinashini | dadrukushthadirogaghni
    nanarogavinashini || 101|| yaksharakshasavetalakushmadagrahabhedini | balagrahaghni candalagrahacandagrahardini
    || 102|| bhutapretapishacaghni nanagrahavimardini | shakinidakinilamadastrigrahanishudini || 103||
    abhicarakadurbadhonmathinyunmadanashini | nanavishartisamhartri dushtadrishtyartinashini || 104||
    dushtasthanasthitarkadigrahapidavinashini | yogakshemakari pushtikari tushtikarishtada || 105|| dhanada
    dhanyada goda vasoda bahumanada | kamitarthaprada shanda caturvidhatumarthada || 106|| brahmamanya
    vishnumanya shivamanyendramanita | devarshimanya brahmarshimanya rajarshimanita || 107|| jaganmanya
    jagaddhatri tryambaka tryambakangana | guhebhavaktrajanani bhadrakalyamayankari || 108|| sati dakshayani
    daksha dakshadhvaranishudini | uma himadrija'parna karnapurancitanana || 109|| kshonidharanitambamba
    bimbabharadanacchada | kundakorakanikasharadapanktih sunasika || 110|| nasikamauktikamaniprabhamalaradacchada
    | sumandahasitalokavimuhyacchambhu manasa || 111|| manasaukogatih sinjanmanjiradivibhushana | kancikkanatkshudraghanta
    kaladhautaghatastani || 112|| muktavidrumaharashrirajankucatatasthali | tatankayugasatkantivilasadgandadarpana
    || 113|| dhammillaprota sauvarnaketakidalamandita | shivarpitasvalavanyatarunyakilikincita || 114||
    sagraiveyakacintakavibhrajatkambukandhara | sakhiskandhasaktabahulatasulalitangika || 115|| nitambakucabharartakrishamadhyasumadhyama
    | nabhisarovarodbhutaromavalivirajita || 116|| trivalirajalalitagauravarnatalodari | camaragrahinivijyamanendudyuticamara
    || 117|| mahakurabakashokapushpavacayalalasa | svatapahsuphalibhutavarottamamaheshvari || 118|| himacalatapahpunyaphalabhutasutakritih
    | trailokyaramaniratna shivaciccandracandrika || 119|| kirtijyotsnadhavalitanekabrahmandagolika |
    shivajivatugulikalasadangulimudrika || 120|| pritilalitasatputragajananashadanana | gangasapatnyajaniteryayatekshanashonima
    || 121|| shivavamankaparyamnkakritasanaparigraha | shivadrishticakorishtamukhapurnendumandala || 122||
    urojashailayugalabhramacchivamanomriga | brahmavishnumukhasheshavrindarakanabhaskrita || 123|| apanganganasantishthannigrahanugrahadvayi
    | sanatkumaradurvasah pramukhopasakarthita || 124|| hadikutatrayopasya kadikutatrayarcita | mridvikamadhupanadyudbodhadhurnitalocana
    || 125|| avyaktabhashana cetidattavitigrahalasa | gayanti vilasanti ca likhanti priyalekhana || 126||
    ullasanti lasanti ca dolandolanatushtibhak | vipancivadanarata saptasvaravibhedavit || 127|| gandharvikinnarividyadhariyakshasurinuta
    | amarikabaribhringisthagitanghrisaroruha || 128|| gandharvaganashravananandandolitamastaka | tilottamorvashirambhanrityadarshanajatamut
    || 129|| acintyamahima'cintyagarima'cintyaladhava | acintyavibhava'cintyavikrama'cintyasadguna ||
    130|| stutih stavya natirnamya gatirgamya mahasati | anasuya'rundhati ca lopamudra'ditirditih || 131||
    saptasamsthasvarupa caranih srugvedika dhruva | ida pranita patri ca svadhasvaha''hutirvapa || 132||
    kavyarupa havyarupa yajnapatrasvarupini | shankarahopurushika gayatrigarbhavallabha || 133|| caturvimshatyaksharatmaparorajasisavadom
    | vedaprasurvedagarbha vishvamitrarshipujita || 134|| rigyajuh samatripada mahasavitridevata | dvijatvasiddhidatri
    ca sankhyayanasagotrika || 135|| gatridurgatisamhartri ca gatrisvargapavargada | bhriguvalli brahmavalli
    kathavalli paratpara || 136|| kaivalpopanishadbrahmopanishanmundakopanishat | chandogyopanishaccaiva
    sarvopanishadatmika || 137|| tattvamadimahavakyarupakhandarthabodhakrit | upakramadishadlingamahatatparyabodhini
    || 138|| jahatsvarthajahatsvarthabhagatyagakhyalakshana | asatkhyatishca satkhyatirmithyakhyatih prabha'prabha
    || 139|| astibhatipriyatma ca namarupasvarupini | shanmatasthapanacaryamahadevakutumbini || 140||
    bhrantirbhantihari bhrantidayini bhrantikarini | vikritirnikritishcapi kritishcopakritistatha || 141||
    sakritih satkritih papakritih sukritirutkritih | akritirvyakritih prayashcittirvittih sthitirgatih
    || 142|| navakundi pancakundi catushkundyekakundika | devasenadaityasenarakshah senadibhedabhak ||
    143|| mahishasyodgatoddandadaityavetandarundahrit | daityasenatrinaranyajvala jyotihsvarupini || 144||
    candamunda mahadaityarundadakandukakhelakrit | pashudehasrikpalalatripta dakshinakalika || 145|| tadancatpretatadrundamala
    vyalavibhushana | haladamshtra shankurada pitanekasuraghata || 146|| netrabhramiparabhutarathacakradvayabhramih
    | vyayamagrahyavakshojanyakkritebhendrakumbhika || 147|| matrimandalamadhyastha matrimandalapujita
    | ghantaghanaghanadhvanaprita pretasanasthita || 148|| mahalasa ca martandabhairavapranavallabha |
    rajavidya rajasati rajastri rajasundari || 149|| gajarajadiralakapuristha yakshadevata | matsyamurtih
    kurmamurtih svikritakrodavigraha || 150|| nrisimhamurtirratyugra dhritavamanavigraha | shrijamadagnyamurtishca
    shriramamurtirhatasrapa || 151|| krishnamurtirbuddhamurtih kalkimurtiramurtika | viranmurtirjaganmurtirjagajjanmadikarini
    || 152|| adharadheyasambandhahina tadubhayatmika | nirguna nishkriya'sanga dharmadharmavivarjita ||
    153|| mayasambandharahitasaccidanandavigraha | jagattarangajaladhirupa citkritibhedabhak || 154||
    mahatattvatmika vaikarahankarasvarupini | rajohankararupa ca tamohankararupini || 155|| akasharupini
    vayurupinyagnisvarupini | ambatmika bhusvarupa pancajnanendriyatmika || 156|| karmendriyatmika pranapanavyanadirupini
    | nagakurmadirupa ca sarvanadiviharini || 157|| adharacakradhishthatri svadhishthanapratishthita |
    manipurakasamsthana'nahatabjadhidevata || 158|| vishuddhacakrapithastha''jnacakraparameshvari | dvipatri
    shodashadali tatha dvadashapatrika || 159|| pradaladdashapatri ca shaddali ca caturdali | vasantamatrika
    badilantavarnadhidevata || 160|| dadiphantaksharavati kadithantakshareshvari | shodashasvarabijeshi
    sparshoshmantahsthadevata || 161|| hakshaksharadvayirupa pancashanmatrikeshvari | sahasrarabjapithastha
    shivashaktirvimuktida || 162|| pancamnayashivaprokta mantrabijadhidevata | sauhklimhrimbijaphalada
    mahaplakshasarasvati || 163|| navarnava saptashati malamantrasvarupini | argaleshi kilakeshi kavaceshi
    trimurtika || 164|| sakaradihakarantamahamantradhidevata | sakritsaptashatipathaprita proktaphalaprada
    || 165|| kumaripujanodyanmuccirantipujanotsuka | viprapujanasantushta nityashrirnityamangala || 166||
    jayadadimacaritra shrida madhyacaritrika | vidyadottamacaritra kamitarthapradayika || 167|| ishtakrishnashtami
    ceshtanavami bhutapurnima | ishtashukraradivasa dhutadipadvayotsuka || 168|| navaratrotsavasakta pujahomabalipriya
    | ishtekshukushmandaphalahutirishtaphalahutih || 169|| pratimasutkrishtapunya ca mahayantrarcanavidhih
    | katyayani kamadogdhri khecari khadgacarmadhrik || 170|| gajasyamata ghatika candika cakradharini
    | chaya chavimayi channa jaramrityuvivarjita || 171|| jhallijhankaramudita jhanjhavatajhanatkritih
    | tankahasta tanaccapathadvayi pallavonmanuh || 172|| damarudhvanamudita dakinishakinishvari | dhundhirajasya
    janani dhakavadyavilasini || 173|| tarika tarika tara tanvangi tanumadhyama | dhupikritasura dirghaveni
    dripta surartihrit || 174|| dhumravarna dhumrakeshi dhumrakshapranaharini | nageshatanaya nari matalli
    pattihetika || 175|| patalalokadhishthatri pherukritamahasura | phanindrashayana bodhadayini bahurupini
    || 176|| bhamini bhasini bhrantikari bhrantivinashini | matangi madiramatta madhavi madhavapriya ||
    177|| yayajukarcita yogidhyeya yogishavallabha | rakacandramukhi rama renuka renukatmaja || 178||
    lokakshi lohita lajja vamakshi vastushantida | shatodari shashvatika shatakumbhavibhushana || 179||
    shadasyamata shatcakravasini sarvamangala | smeranana suprasanna haravamankasamsthita || 180|| harivanditapadabja
    hrimbijabhuvaneshvari | kshaumambarendugokshiradhavala vanashankari || 181||
  devanagari: ृङ्गारदेवता ग्रामदेवता चैत्यदेवता ॥ ९२॥ पूर्देवता राजसभादेवताऽशोकदेवता । चतुर्दशानां लोकानां
    देवता परदेवता ॥ ९३॥ वापीकूपतडागादिदेवता वनदेवता । सृष्टिखेला क्षेमखेला प्रतिसंहारखेलना ॥ ९४॥ पुष्पपर्यङ्कशयना
    पुष्पवत्कुण्डलद्वयी । ताम्बूलचर्वणप्रीता गौरी प्रथमपुष्पिणी ॥ ९५॥ कल्याणीयुगसम्पन्ना कामसञ्जीवनी कला
    । कलाकलापकुशला कलातीता कलात्मिका ॥ ९६॥ महाजाङ्गलकी कालभुजङ्गविषनाशिनी । चिकित्सा वैद्यविद्या च नानामयनिदानवित्
    ॥ ९७॥ पित्तप्रकोपशमनी वातघ्नी कफनाशिनी । आमज्वरप्रकोपघ्नी नवज्वरनिवारिणी ॥ ९८॥ अर्शोघ्नी शूलशमनी गुल्मव्याधिनिवारिणी
    । ग्रहणीनिग्रहकरी राजयक्ष्मविनाशिनी ॥ ९९॥ मेहघ्नी पाण्डुरोगघ्नी क्षयापस्मारनाशिनी । उपदंशहरी श्वासकासच्छर्दिनिवारिणी
    ॥ १००॥ प्लीहप्रकोपसंहर्त्री पामाकण्डूविनाशिनी । दद्रुकुष्ठादिरोगघ्नी नानारोगविनाशिनी ॥ १०१॥ यक्षराक्षसवेतालकूष्माडग्रहभेदिनी
    । बालग्रहघ्नी चण्डालग्रहचण्डग्रहार्दिनी ॥ १०२॥ भूतप्रेतपिशाचघ्नी नानाग्रहविमर्दिनी । शाकिनीडाकिनीलामदस्त्रीग्रहनिषूदिनी
    ॥ १०३॥ अभिचारकदुर्बाधोन्मथिन्युन्मादनाशिनी । नानाविषार्तिसंहर्त्री दुष्टदृष्ट्यार्तिनाशिनी ॥ १०४॥
    दुष्टस्थानस्थितार्कादिग्रहपीडाविनाशिनी । योगक्षेमकरी पुष्टिकरी तुष्टिकरीष्टदा ॥ १०५॥ धनदा धान्यदा
    गोदा वासोदा बहुमानदा । कामितार्थप्रदा शन्दा चतुर्विधतुमर्थदा ॥ १०६॥ ब्रह्ममान्या विष्णुमान्या शिवमान्येन्द्रमानिता
    । देवर्षिमान्या ब्रह्मर्षिमान्या राजर्षिमानिता ॥ १०७॥ जगन्मान्या जगद्धात्री त्र्यम्बका त्र्यम्बकाङ्गना
    । गुहेभवक्त्रजननी भद्रकाल्यमयङ्करी ॥ १०८॥ सती दाक्षायणी दक्षा दक्षाध्वरनिषूदिनी । उमा हिमाद्रिजाऽपर्णा
    कर्णपूराञ्चितानना ॥ १०९॥ क्षोणीधरनितम्बाम्बा बिम्बाभरदनच्छदा । कुन्दकोरकनीकाशरदपङ्क्तिः सुनासिका ॥
    ११०॥ नासिकामौक्तिकमणिप्रभामलरदच्छदा । सुमन्दहसितालोकविमुह्यच्छम्भु मानसा ॥ १११॥ मानसौकोगतिः सिञ्जन्मञ्जीरादिविभूषणा
    । काञ्चीक्कणत्क्षुद्रघण्टा कलधौतघटस्तनी ॥ ११२॥ मुक्ताविद्रुमहारश्रीराजन्कुचतटस्थली । ताटङ्कयुगसत्कान्तिविलसद्गण्डदर्पणा
    ॥ ११३॥ धम्मिल्लप्रोत सौवर्णकेतकीदलमण्डिता । शिवार्पितस्वलावण्यतारुण्यकिलिकिञ्चिता ॥ ११४॥ सग्रैवेयकचिन्ताकविभ्राजत्कम्बुकन्धरा
    । सखीस्कन्धासक्तबाहुलतासुललिताङ्गिका ॥ ११५॥ नितम्बकुचभारार्तकृशमध्यसुमध्यमा । नाभीसरोवरोद्भूतरोमावलिविराजिता
    ॥ ११६॥ त्रिवलीराजललितगौरवर्णतलोदरी । चामरग्राहिणीवीज्यमानेन्दुद्युतिचामरा ॥ ११७॥ महाकुरबकाशोकपुष्पवचयलालसा
    । स्वतपःसुफलीभूतवरोत्तममहेश्वरी ॥ ११८॥ हिमाचलतपःपुण्यफलभूतसुताकृतिः । त्रैलोक्यरमणीरत्ना शिवचिच्चन्द्रचन्द्रिका
    ॥ ११९॥ कीर्तिज्योत्स्नाधवलितानेकब्रह्माण्डगोलिका । शिवजीवातुगुलिकालसदङ्गुलिमुद्रिका ॥ १२०॥ प्रीतिलालितसत्पुत्रगजाननषडानना
    । गङ्गासापत्न्यजनितेर्यायतेक्षणशोणिमा ॥ १२१॥ शिववामाङ्कपर्यंङ्ककृतासनपरिग्रहा । शिवदृष्टिचकोरीष्टमुखपूर्णेन्दुमण्डला
    ॥ १२२॥ उरोजशैलयुगलभ्रमच्छिवमनोमृगा । ब्रह्मविष्णुमुखाशेषवृन्दारकनभस्कृता ॥ १२३॥ अपाङ्गाङ्गणसन्तिष्ठन्निग्रहानुग्रहद्वयी
    । सनत्कुमारदुर्वासः प्रमुखोपासकार्थिता ॥ १२४॥ हादिकूटत्रयोपास्या कादिकूटत्रयार्चिता । मृद्वीकमधुपानाद्युद्बोधधूर्णितलोचना
    ॥ १२५॥ अव्यक्तभाषणा चेटीदत्तवीटीग्रहालसा । गायन्ती विलसन्ती च लिखन्ती प्रियलेखना ॥ १२६॥ उल्लसन्ती
    लसन्ती च दोलान्दोलनतुष्टिभाक् । विपञ्चीवादनरता सप्तस्वरविभेदवित् ॥ १२७॥ गन्धर्वीकिन्नरीविद्याधरीयक्षसुरीनुता
    । अमरीकबरीभृङ्गीस्थगिताङ्घ्रिसरोरुहा ॥ १२८॥ गन्धर्वगानश्रवणानन्दान्दोलितमस्तका । तिलोत्तमोर्वशीरम्भानृत्यदर्शनजातमुत्
    ॥ १२९॥ अचिन्त्यमहिमाऽचिन्त्यगरिमाऽचिन्त्यलाधवा । अचिन्त्यविभवाऽचिन्त्यविक्रमाऽचिन्त्यसद्गुणा ॥ १३०॥
    स्तुतिः स्तव्या नतिर्नम्या गतिर्गम्या महासती । अनसूयाऽरुन्धती च लोपामुद्राऽदितिर्दितिः ॥ १३१॥ सप्तसंस्थास्वरूपा
    चारणिः स्रुग्वेदिका ध्रुवा । इडा प्रणीता पात्री च स्वधास्वाहाऽऽहुतिर्वपा ॥ १३२॥ कव्यरूपा हव्यरूपा
    यज्ञपात्रस्वरूपिणी । शङ्कराहोपुरुषिका गायत्रीगर्भवल्लभा ॥ १३३॥ चतुर्विंशत्यक्षरात्मपरोरजसिसावदोम्
    । वेदप्रसूर्वेदगर्भा विश्वामित्रर्षिपूजिता ॥ १३४॥ ऋग्यजुः सामत्रिपदा महासवितृदेवता । द्विजत्वसिद्धिदात्री
    च साङ्ख्यायनसगोत्रिका ॥ १३५॥ गातृदुर्गतिसंहर्त्री च गातृस्वर्गापवर्गदा । भृगुवल्ली ब्रह्मवल्ली कठवल्ली
    परात्परा ॥ १३६॥ कैवल्पोपनिषद्ब्रह्मोपनिषन्मुण्डकोपनिषत् । छान्दोग्योपनिषच्चैव सर्वोपनिषदात्मिका ॥
    १३७॥ तत्त्वमादिमहावाक्यरूपाखण्डार्थबोधकृत् । उपक्रमादिषड्लिङ्गमहातात्पर्यबोधिनी ॥ १३८॥ जहत्स्वार्थाजहत्स्वार्थभागत्यागाख्यलक्षणा
    । असत्ख्यातिश्च सत्ख्यातिर्मिथ्याख्यातिः प्रभाऽप्रभा ॥ १३९॥ अस्तिभातिप्रियात्मा च नामरूपस्वरूपिणी
    । षण्मतस्थापनाचार्यमहादेवकुटुम्बिनी ॥ १४०॥ भ्रान्तिर्भान्तिहरी भ्रान्तिदायिनी भ्रान्तिकारिणी । विकृतिर्निकृतिश्चापि
    कृतिश्चोपकृतिस्तथा ॥ १४१॥ सकृतिः सत्कृतिः पापकृतिः सुकृतिरुत्कृतिः । आकृतिर्व्याकृतिः प्रायश्चित्तिर्वित्तिः
    स्थितिर्गतिः ॥ १४२॥ नवकुण्डी पञ्चकुण्डी चतुष्कुण्ड्येककुण्डिका । देवसेनादैत्यसेनारक्षः सेनादिभेदभाक्
    ॥ १४३॥ महिषास्योद्गतोद्दण्डदैत्यवेतण्डरुण्डहृत् । दैत्यसेनातृणारण्यज्वाला ज्योतिःस्वरूपिणी ॥ १४४॥
    चण्डमुण्ड महादैत्यरुण्डडकन्दुकखेलकृत् । पशुदेहासृक्पललतृप्ता दक्षिणकालिका ॥ १४५॥ तदञ्चत्प्रेततद्रुण्डमाला
    व्यालविभूषणा । हलदंष्ट्रा शङ्कुरदा पीतानेकसुराघटा ॥ १४६॥ नेत्रभ्रमिपराभूतरथचक्रद्वयभ्रमिः । व्यायामाग्राह्यवक्षोजन्यक्कृतेभेन्द्रकुम्भिका
    ॥ १४७॥ मातृमण्डलमध्यस्था मातृमण्डलपूजिता । घण्टाघणघणध्वानप्रीता प्रेतासनस्थिता ॥ १४८॥ महालसा च मार्तण्डभैरवप्राणवल्लभा
    । राजविद्या राजसती राजस्त्री राजसुन्दरी ॥ १४९॥ गजराजादिरलकापुरीस्था यक्षदेवता । मत्स्यमूर्तिः कूर्ममूर्तिः
    स्वीकृतक्रोडविग्रहा ॥ १५०॥ नृसिंहमूर्तिर्रत्युग्रा धृतवामनविग्रहा । श्रीजामदग्न्यमूर्तिश्च श्रीराममूर्तिर्हतास्रपा
    ॥ १५१॥ कृष्णमूर्तिर्बुद्धमूर्तिः कल्किमूर्तिरमूर्तिका । विराण्मूर्तिर्जगन्मूर्तिर्जगज्जन्मादिकारिणी
    ॥ १५२॥ आधाराधेयसम्बन्धहीना तदुभयात्मिका । निर्गुणा निष्क्रियाऽसङ्गा धर्माधर्मविवर्जिता ॥ १५३॥ मायासम्बन्धरहितासच्चिदानन्दविग्रहा
    । जगत्तरङ्गजलधिरूपा चीत्कृतिभेदभाक् ॥ १५४॥ महातत्त्वात्मिका वैकाराहङ्कारस्वरूपिणी । रजोहङ्काररूपा
    च तमोहङ्काररूपिणी ॥ १५५॥ आकाशरूपिणी वायुरूपिण्यग्निस्वरूपिणी । अम्बात्मिका भूस्वरूपा पञ्चज्ञानेन्द्रियात्मिका
    ॥ १५६॥ कर्मेन्द्रियात्मिका प्राणापानव्यानादिरूपिणी । नागकूर्मादिरूपा च सर्वनाडीविहारिणी ॥ १५७॥ आधारचक्राधिष्ठात्री
    स्वाधिष्ठानप्रतिष्ठिता । मणिपूरकसंस्थानाऽनाहताब्जाधिदेवता ॥ १५८॥ विशुद्धचक्रपीठस्थाऽऽज्ञाचक्रपरमेश्वरी
    । द्विपत्री षोडशदली तथा द्वादशपत्रिका ॥ १५९॥ प्रदलद्दशपत्री च षड्दली च चतुर्दली । वासान्तमातृका बादिलान्तवर्णाधिदेवता
    ॥ १६०॥ डादिफान्ताक्षरवती कादिठान्ताक्षरेश्वरी । षोडशस्वरबीजेशी स्पर्शोष्मान्तःस्थदेवता ॥ १६१॥ हक्षाक्षरद्वयीरूपा
    पञ्चाशन्मातृकेश्वरी । सहस्राराब्जपीठस्था शिवशक्तिर्विमुक्तिदा ॥ १६२॥ पञ्चाम्नायशिवप्रोक्ता मन्त्रबीजाधिदेवता
    । सौःक्लींह्रींबीजफलदा महाप्लक्षसरस्वती ॥ १६३॥ नवार्णवा सप्तशती मालामन्त्रस्वरूपिणी । अर्गलेशी कीलकेशी
    कवचेशी त्रिमूर्तिका ॥ १६४॥ सकारादिहकारान्तमहमन्त्राधिदेवता । सकृत्सप्तशतीपाठप्रीता प्रोक्तफलप्रदा
    ॥ १६५॥ कुमारीपूजनोद्यन्मुच्चिरण्टीपूजनोत्सुका । विप्रपूजनसन्तुष्टा नित्यश्रीर्नित्यमङ्गला ॥ १६६॥ जयदादिमचारित्रा
    श्रीद मध्यचरित्रिका । विद्यादोत्तमचारित्रा कामितार्थप्रदायिका ॥ १६७॥ इष्टकृष्णाष्टमी चेष्टनवमी भूतपूर्णिमा
    । इष्टशुक्रारदिवसा धूतदीपद्वयोत्सुका ॥ १६८॥ नवरात्रोत्सवासक्ता पूजाहोमबलिप्रिया । इष्टेक्षुकूष्माण्डफलाहूतिरिष्टफलाहुतिः
    ॥ १६९॥ प्रतिमासूत्कृष्टपुण्या च महायन्त्रार्चनाविधिः । कात्यायनी कामदोग्ध्री खेचरी खड्गचर्मधृक् ॥
    १७०॥ गजास्यमाता घटिका चण्डिका चक्रधारिणी । छाया छविमयी छन्ना जरामृत्युविवर्जिता ॥ १७१॥ झल्लीझङ्कारमुदिता
    झञ्झावातझणत्कृतिः । टङ्कहस्ता टणच्चापठद्वयी पल्लवोन्मनुः ॥ १७२॥ डमरुध्वानमुदिता डाकिनीशाकिनीश्वरी
    । ढुण्ढिराजस्य जननी ढकावाद्यविलासिनी ॥ १७३॥ तरिका तारिका तारा तन्वङ्गी तनुमध्यमा । धूपीकृतासुरा दीर्घवेणी
    दृप्ता सुरार्तिहृत् ॥ १७४॥ धूम्रवर्णा धूम्रकेशी धूम्राक्षप्राणहारिणी । नगेशतनया नारी मतल्ली पट्टिहेतिका
    ॥ १७५॥ पाताललोकाधिष्ठात्री फेरूकृतमहासुरा । फणीन्द्रशयना बोधदायिनी बहुरूपिणी ॥ १७६॥ भामिनी भासिनी
    भ्रान्तिकरी भ्रान्तिविनाशिनी । मातङ्गी मदिरामत्ता माधवी माधवप्रिया ॥ १७७॥ यायजूकार्चिता योगिध्येया
    योगीशवल्लभा । राकाचन्द्रमुखी रामा रेणुका रेणुकात्मजा ॥ १७८॥ लोकाक्षी लोहिता लज्जा वामाक्षी वास्तुशान्तिदा
    । शातोदरी शाश्वतिका शातकुम्भविभूषणा ॥ १७९॥ षडास्यमाता षट्चक्रवासिनी सर्वमङ्गला । स्मेरानना सुप्रसन्ना
    हरवामाङ्कसंस्थिता ॥ १८०॥ हारिवन्दितपादाब्जा ह्रींबीजभुवनेश्वरी । क्षौमाम्बरेन्दुगोक्षीरधवला वनशङ्करी
    ॥ १८१॥
