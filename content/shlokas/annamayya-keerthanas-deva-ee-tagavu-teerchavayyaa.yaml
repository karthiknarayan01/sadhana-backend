id: annamayya-keerthanas-deva-ee-tagavu-teerchavayyaa
category: stotram
name:
  english: Annamayya Keerthanas Deva Ee Tagavu Teerchavayyaa
content:
  english: deva yi tagavu dircavayya vevelaku nidi vinnapamayya || tanuvuna bòdaminatati nindriyamulu
    pònigi yèkkadiki bovunaya | pènagi tallikada biddalu bhuvilo yènagòni yèkkadi kegudurayya || pòdugucu
    manamuna bòdamina yasalu adana nèkkadiki narugunaya | vòdugucu jalamulanundu matsyamulu padapadi yegati
    basinayya || lali nòkatòkatiki lankèlu nive alarucu nemani yandunaya | balu shrivenkatapati nayatmanu
    galigiti vèkkadi kalushamulayya ||
  devanagari: देव यी तगवु दीर्चवय्या वेवेलकु निदि विन्नपमय्या ॥ तनुवुन बॊडमिनतति निन्द्रियमुलु पॊनिगि
    यॆक्कडिकि बोवुनया । पॆनगि तल्लिकड बिड्डलु भुविलो यॆनगॊनि यॆक्कडि केगुदुरय्या ॥ पॊडुगुचु मनमुन बॊडमिन
    यासलु अदन नॆक्कडिकि नरुगुनया । वॊदुगुचु जलमुलनुण्डु मत्स्यमुलु पदपडि येगति बासीनय्या ॥ ललि नॊकटॊकटिकि
    लङ्कॆलु निवे अलरुचु नेमनि यन्दुनया । बलु श्रीवेङ्कटपति नायात्मनु गलिगिति वॆक्कडि कलुषमुलय्या ॥
