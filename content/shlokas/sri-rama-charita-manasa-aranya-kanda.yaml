    ॥ अस जियँ जानि दसानन सङ्गा। चला राम पद प्रेम अभङ्गा ॥ मन अति हरष जनाव न तेही। आजु देखिहुँ परम सनेही
    ॥ छं निज परम प्रीतम देखि लोचन सुफल करि सुख पाइहौं। श्री सहित अनुज समेत कृपानिकेत पद मन लाइहौम् ॥ निर्बान
    दायक क्रोध जा कर भगति अबसहि बसकरी। निज पानि सर सन्धानि सो मोहि बधिहि सुखसागर हरी ॥ दो मम पाछें धर
    धावत धरें सरासन बान। फिरि फिरि प्रभुहि बिलोकिहुँ धन्य न मो सम आन ॥ ॥ तेहि बन निकट दसानन गयू। तब मारीच
    कपटमृग भयू ॥ अति बिचित्र कछु बरनि न जाई। कनक देह मनि रचित बनाई ॥ सीता परम रुचिर मृग देखा। अङ्ग अङ्ग
    सुमनोहर बेषा ॥ सुनहु देव रघुबीर कृपाला। एहि मृग कर अति सुन्दर छाला ॥ सत्यसन्ध प्रभु बधि करि एही। आनहु
    चर्म कहति बैदेही ॥ तब रघुपति जानत सब कारन। उठे हरषि सुर काजु सँवारन ॥ मृग बिलोकि कटि परिकर बाँधा।
    करतल चाप रुचिर सर साँधा ॥ प्रभु लछिमनिहि कहा समुझाई। फिरत बिपिन निसिचर बहु भाई ॥ सीता केरि करेहु रखवारी।
    बुधि बिबेक बल समय बिचारी ॥ प्रभुहि बिलोकि चला मृग भाजी। धाए रामु सरासन साजी ॥ निगम नेति सिव ध्यान
    न पावा। मायामृग पाछें सो धावा ॥ कबहुँ निकट पुनि दूरि पराई। कबहुँक प्रगटि कबहुँ छपाई ॥ प्रगटत दुरत
    करत छल भूरी। एहि बिधि प्रभुहि गयु लै दूरी ॥ तब तकि राम कठिन सर मारा। धरनि परेउ करि घोर पुकारा ॥ लछिमन
    कर प्रथमहिं लै नामा। पाछें सुमिरेसि मन महुँ रामा ॥ प्रान तजत प्रगटेसि निज देहा। सुमिरेसि रामु समेत
    सनेहा ॥ अन्तर प्रेम तासु पहिचाना। मुनि दुर्लभ गति दीन्हि सुजाना ॥ दो बिपुल सुमन सुर बरषहिं गावहिं
    प्रभु गुन गाथ। निज पद दीन्ह असुर कहुँ दीनबन्धु रघुनाथ ॥ ॥ खल बधि तुरत फिरे रघुबीरा। सोह चाप कर कटि
    तूनीरा ॥ आरत गिरा सुनी जब सीता। कह लछिमन सन परम सभीता ॥ जाहु बेगि सङ्कट अति भ्राता। लछिमन बिहसि कहा
    सुनु माता ॥ भृकुटि बिलास सृष्टि लय होई। सपनेहुँ सङ्कट परि कि सोई ॥ मरम बचन जब सीता बोला। हरि प्रेरित
    लछिमन मन डोला ॥ बन दिसि देव सौम्पि सब काहू। चले जहाँ रावन ससि राहू ॥ सून बीच दसकन्धर देखा। आवा निकट
    जती कें बेषा ॥ जाकें डर सुर असुर डेराहीं। निसि न नीद दिन अन्न न खाहीम् ॥ सो दससीस स्वान की नाई। इत
    उत चिति चला भड़इहाई ॥ इमि कुपन्थ पग देत खगेसा। रह न तेज बुधि बल लेसा ॥ नाना बिधि करि कथा सुहाई। राजनीति
    भय प्रीति देखाई ॥ कह सीता सुनु जती गोसाईं। बोलेहु बचन दुष्ट की नाईम् ॥ तब रावन निज रूप देखावा। भी
    सभय जब नाम सुनावा ॥ कह सीता धरि धीरजु गाढ़आ। आइ गयु प्रभु रहु खल ठाढ़आ ॥ जिमि हरिबधुहि छुद्र सस चाहा।
    भेसि कालबस निसिचर नाहा ॥ सुनत बचन दससीस रिसाना। मन महुँ चरन बन्दि सुख माना ॥ दो क्रोधवन्त तब रावन
    लीन्हिसि रथ बैठाइ। चला गगनपथ आतुर भयँ रथ हाँकि न जाइ ॥ ॥ हा जग एक बीर रघुराया। केहिं अपराध बिसारेहु
    दाया ॥ आरति हरन सरन सुखदायक। हा रघुकुल सरोज दिननायक ॥ हा लछिमन तुम्हार नहिं दोसा। सो फलु पायुँ कीन्हेउँ
    रोसा ॥ बिबिध बिलाप करति बैदेही। भूरि कृपा प्रभु दूरि सनेही ॥ बिपति मोरि को प्रभुहि सुनावा। पुरोडास
    चह रासभ खावा ॥ सीता कै बिलाप सुनि भारी। भे चराचर जीव दुखारी ॥ गीधराज सुनि आरत बानी। रघुकुलतिलक नारि
    पहिचानी ॥ अधम निसाचर लीन्हे जाई। जिमि मलेछ बस कपिला गाई ॥ सीते पुत्रि करसि जनि त्रासा। करिहुँ जातुधान
    कर नासा ॥ धावा क्रोधवन्त खग कैसें। छूटि पबि परबत कहुँ जैसे ॥ रे रे दुष्ट ठाढ़ किन होही। निर्भय चलेसि
    न जानेहि मोही ॥ आवत देखि कृतान्त समाना। फिरि दसकन्धर कर अनुमाना ॥ की मैनाक कि खगपति होई। मम बल जान
    सहित पति सोई ॥ जाना जरठ जटायू एहा। मम कर तीरथ छाँड़इहि देहा ॥ सुनत गीध क्रोधातुर धावा। कह सुनु रावन
    मोर सिखावा ॥ तजि जानकिहि कुसल गृह जाहू। नाहिं त अस होइहि बहुबाहू ॥ राम रोष पावक अति घोरा। होइहि सकल
    सलभ कुल तोरा ॥ उतरु न देत दसानन जोधा। तबहिं गीध धावा करि क्रोधा ॥ धरि कच बिरथ कीन्ह महि गिरा। सीतहि
    राखि गीध पुनि फिरा ॥ चौचन्ह मारि बिदारेसि देही। दण्ड एक भि मुरुछा तेही ॥ तब सक्रोध निसिचर खिसिआना।
    काढ़एसि परम कराल कृपाना ॥ काटेसि पङ्ख परा खग धरनी। सुमिरि राम करि अदभुत करनी ॥ सीतहि जानि चढ़आइ बहोरी।
    चला उताइल त्रास न थोरी ॥ करति बिलाप जाति नभ सीता। ब्याध बिबस जनु मृगी सभीता ॥ गिरि पर बैठे कपिन्ह
    निहारी। कहि हरि नाम दीन्ह पट डारी ॥ एहि बिधि सीतहि सो लै गयू। बन असोक महँ राखत भयू ॥ दो हारि परा खल
    बहु बिधि भय अरु प्रीति देखाइ। तब असोक पादप तर राखिसि जतन कराइ ॥ छठा विश्राम जेहि बिधि कपट कुरङ्ग सँग
    धाइ चले श्रीराम। सो छबि सीता राखि उर रटति रहति हरिनाम ॥ ॥ रघुपति अनुजहि आवत देखी। बाहिज चिन्ता कीन्हि
    बिसेषी ॥ जनकसुता परिहरिहु अकेली। आयहु तात बचन मम पेली ॥ निसिचर निकर फिरहिं बन माहीं। मम मन सीता आश्रम
    नाहीम् ॥ गहि पद कमल अनुज कर जोरी। कहेउ नाथ कछु मोहि न खोरी ॥ अनुज समेत गे प्रभु तहवाँ। गोदावरि तट
    आश्रम जहवाँ ॥ आश्रम देखि जानकी हीना। भे बिकल जस प्राकृत दीना ॥ हा गुन खानि जानकी सीता। रूप सील ब्रत
    नेम पुनीता ॥ लछिमन समुझाए बहु भाँती। पूछत चले लता तरु पाँती ॥ हे खग मृग हे मधुकर श्रेनी। तुम्ह देखी
    सीता मृगनैनी ॥ खञ्जन सुक कपोत मृग मीना। मधुप निकर कोकिला प्रबीना ॥ कुन्द कली दाड़इम दामिनी। कमल सरद
    ससि अहिभामिनी ॥ बरुन पास मनोज धनु हंसा। गज केहरि निज सुनत प्रसंसा ॥ श्रीफल कनक कदलि हरषाहीं। नेकु
    न सङ्क सकुच मन माहीम् ॥ सुनु जानकी तोहि बिनु आजू। हरषे सकल पाइ जनु राजू ॥ किमि सहि जात अनख तोहि पाहीम्
    । प्रिया बेगि प्रगटसि कस नाहीम् ॥ एहि बिधि खौजत बिलपत स्वामी। मनहुँ महा बिरही अति कामी ॥ पूरनकाम राम
    सुख रासी। मनुज चरित कर अज अबिनासी ॥ आगे परा गीधपति देखा। सुमिरत राम चरन जिन्ह रेखा ॥ दो कर सरोज सिर
    परसेउ कृपासिन्धु रधुबीर ॥ निरखि राम छबि धाम मुख बिगत भी सब पीर ॥ ॥ तब कह गीध बचन धरि धीरा । सुनहु
    राम भञ्जन भव भीरा ॥ नाथ दसानन यह गति कीन्ही। तेहि खल जनकसुता हरि लीन्ही ॥ लै दच्छिन दिसि गयु गोसाई।
    बिलपति अति कुररी की नाई ॥ दरस लागी प्रभु राखेंउँ प्राना। चलन चहत अब कृपानिधाना ॥ राम कहा तनु राखहु
    ताता। मुख मुसकाइ कही तेहिं बाता ॥ जा कर नाम मरत मुख आवा। अधमु मुकुत होई श्रुति गावा ॥ सो मम लोचन गोचर
    आगें। राखौं देह नाथ केहि खाँगेँ ॥ जल भरि नयन कहहिँ रघुराई। तात कर्म निज ते गतिं पाई ॥ परहित बस जिन्ह
    के मन माहीँ। तिन्ह कहुँ जग दुर्लभ कछु नाहीँ ॥ तनु तजि तात जाहु मम धामा। देउँ काह तुम्ह पूरनकामा ॥
    दो सीता हरन तात जनि कहहु पिता सन जाइ ॥ जौँ मैँ राम त कुल सहित कहिहि दसानन आइ ॥ ॥ गीध देह तजि धरि हरि
    रुपा। भूषन बहु पट पीत अनूपा ॥ स्याम गात बिसाल भुज चारी। अस्तुति करत नयन भरि बारी ॥ छं जय राम रूप अनूप
    निर्गुन सगुन गुन प्रेरक सही। दससीस बाहु प्रचण्ड खण्डन चण्ड सर मण्डन मही ॥ पाथोद गात सरोज मुख राजीव
    आयत लोचनं। नित नौमि रामु कृपाल बाहु बिसाल भव भय मोचनम् ॥ ॥ बलमप्रमेयमनादिमजमब्यक्तमेकमगोचरं। गोबिन्द
    गोपर द्वन्द्वहर बिग्यानघन धरनीधरम् ॥ जे राम मन्त्र जपन्त सन्त अनन्त जन मन रञ्जनं। नित नौमि राम अकाम
    प्रिय कामादि खल दल गञ्जनम् ॥ । जेहि श्रुति निरञ्जन ब्रह्म ब्यापक बिरज अज कहि गावहीम् ॥ करि ध्यान ग्यान
    बिराग जोग अनेक मुनि जेहि पावहीम् ॥ सो प्रगट करुना कन्द सोभा बृन्द अग जग मोही। मम हृदय पङ्कज भृङ्ग
    अङ्ग अनङ्ग बहु छबि सोही ॥ ॥ जो अगम सुगम सुभाव निर्मल असम सम सीतल सदा। पस्यन्ति जं जोगी जतन करि करत
    मन गो बस सदा ॥ सो राम रमा निवास सन्तत दास बस त्रिभुवन धनी। मम उर बसु सो समन संसृति जासु कीरति पावनी
    ॥ अबिरल भगति मागि बर गीध गयु हरिधाम। तेहि की क्रिया जथोचित निज कर कीन्ही राम ॥ ॥ कोमल चित अति दीनदयाला।
    कारन बिनु रघुनाथ कृपाला ॥ गीध अधम खग आमिष भोगी। गति दीन्हि जो जाचत जोगी ॥ सुनहु उमा ते लोग अभागी।
    हरि तजि होहिं बिषय अनुरागी ॥ पुनि सीतहि खोजत द्वौ भाई। चले बिलोकत बन बहुताई ॥ सङ्कुल लता बिटप घन कानन।
    बहु खग मृग तहँ गज पञ्चानन ॥ आवत पन्थ कबन्ध निपाता। तेहिं सब कही साप कै बाता ॥ दुरबासा मोहि दीन्ही
    सापा। प्रभु पद पेखि मिटा सो पापा ॥ सुनु गन्धर्ब कहुँ मै तोही। मोहि न सोहाइ ब्रह्मकुल द्रोही ॥ दो मन
    क्रम बचन कपट तजि जो कर भूसुर सेव। मोहि समेत बिरञ्चि सिव बस ताकें सब देव ॥ ॥ सापत ताड़त परुष कहन्ता।
    बिप्र पूज्य अस गावहिं सन्ता ॥ पूजिअ बिप्र सील गुन हीना। सूद्र न गुन गन ग्यान प्रबीना ॥ कहि निज धर्म
    ताहि समुझावा। निज पद प्रीति देखि मन भावा ॥ रघुपति चरन कमल सिरु नाई। गयु गगन आपनि गति पाई ॥ ताहि देइ
    गति राम उदारा। सबरी कें आश्रम पगु धारा ॥ सबरी देखि राम गृहँ आए। मुनि के बचन समुझि जियँ भाए ॥ सरसिज
    लोचन बाहु बिसाला। जटा मुकुट सिर उर बनमाला ॥ स्याम गौर सुन्दर दौ भाई। सबरी परी चरन लपटाई ॥ प्रेम मगन
    मुख बचन न आवा। पुनि पुनि पद सरोज सिर नावा ॥ सादर जल लै चरन पखारे। पुनि सुन्दर आसन बैठारे ॥ दो कन्द
    मूल फल सुरस अति दिए राम कहुँ आनि। प्रेम सहित प्रभु खाए बारम्बार बखानि ॥ ॥ पानि जोरि आगें भि ठाढ़ई।
    प्रभुहि बिलोकि प्रीति अति बाढ़ई ॥ केहि बिधि अस्तुति करौ तुम्हारी। अधम जाति मैं जड़मति भारी ॥ अधम ते
    अधम अधम अति नारी। तिन्ह महँ मैं मतिमन्द अघारी ॥ कह रघुपति सुनु भामिनि बाता। मानुँ एक भगति कर नाता
    ॥ जाति पाँति कुल धर्म बड़आई। धन बल परिजन गुन चतुराई ॥ भगति हीन नर सोहि कैसा। बिनु जल बारिद देखिअ जैसा
    ॥ नवधा भगति कहुँ तोहि पाहीं। सावधान सुनु धरु मन माहीम् ॥ प्रथम भगति सन्तन्ह कर सङ्गा। दूसरि रति मम
    कथा प्रसङ्गा ॥ दो गुर पद पङ्कज सेवा तीसरि भगति अमान। चौथि भगति मम गुन गन करि कपट तजि गान ॥ ॥ मन्त्र
    जाप मम दृढ़ बिस्वासा। पञ्चम भजन सो बेद प्रकासा ॥ छठ दम सील बिरति बहु करमा। निरत निरन्तर सज्जन धरमा
    ॥ सातवँ सम मोहि मय जग देखा। मोतें सन्त अधिक करि लेखा ॥ आठवँ जथालाभ सन्तोषा। सपनेहुँ नहिं देखि परदोषा
    ॥ नवम सरल सब सन छलहीना। मम भरोस हियँ हरष न दीना ॥ नव महुँ एकु जिन्ह के होई। नारि पुरुष सचराचर कोई
    ॥ सोइ अतिसय प्रिय भामिनि मोरे। सकल प्रकार भगति दृढ़ तोरेम् ॥ जोगि बृन्द दुरलभ गति जोई। तो कहुँ आजु
    सुलभ भि सोई ॥ मम दरसन फल परम अनूपा। जीव पाव निज सहज सरूपा ॥ जनकसुता कि सुधि भामिनी। जानहि कहु करिबरगामिनी
    ॥ पम्पा सरहि जाहु रघुराई। तहँ होइहि सुग्रीव मिताई ॥ सो सब कहिहि देव रघुबीरा। जानतहूँ पूछहु मतिधीरा
    ॥ बार बार प्रभु पद सिरु नाई। प्रेम सहित सब कथा सुनाई ॥ छं कहि कथा सकल बिलोकि हरि मुख हृदयँ पद पङ्कज
    धरे। तजि जोग पावक देह हरि पद लीन भि जहँ नहिं फिरे ॥ नर बिबिध कर्म अधर्म बहु मत सोकप्रद सब त्यागहू।
    बिस्वास करि कह दास तुलसी राम पद अनुरागहू ॥ दो जाति हीन अघ जन्म महि मुक्त कीन्हि असि नारि। महामन्द
    मन सुख चहसि ऐसे प्रभुहि बिसारि ॥ ॥ चले राम त्यागा बन सोऊ। अतुलित बल नर केहरि दोऊ ॥ बिरही इव प्रभु
    करत बिषादा। कहत कथा अनेक सम्बादा ॥ लछिमन देखु बिपिन कि सोभा। देखत केहि कर मन नहिं छोभा ॥ नारि सहित
    सब खग मृग बृन्दा। मानहुँ मोरि करत हहिं निन्दा ॥ हमहि देखि मृग निकर पराहीं। मृगीं कहहिं तुम्ह कहँ भय
    नाहीम् ॥ तुम्ह आनन्द करहु मृग जाए। कञ्चन मृग खोजन ए आए ॥ सङ्ग लाइ करिनीं करि लेहीं। मानहुँ मोहि सिखावनु
    देहीम् ॥ सास्त्र सुचिन्तित पुनि पुनि देखिअ। भूप सुसेवित बस नहिं लेखिअ ॥ राखिअ नारि जदपि उर माहीं।
    जुबती सास्त्र नृपति बस नाहीम् ॥ देखहु तात बसन्त सुहावा। प्रिया हीन मोहि भय उपजावा ॥ दो बिरह बिकल बलहीन
    मोहि जानेसि निपट अकेल। सहित बिपिन मधुकर खग मदन कीन्ह बगमेल ॥ ॥ देखि गयु भ्राता सहित तासु दूत सुनि
    बात। डेरा कीन्हेउ मनहुँ तब कटकु हटकि मनजात ॥ ॥ बिटप बिसाल लता अरुझानी। बिबिध बितान दिए जनु तानी ॥
    कदलि ताल बर धुजा पताका। दैखि न मोह धीर मन जाका ॥ बिबिध भाँति फूले तरु नाना। जनु बानैत बने बहु बाना
    ॥ कहुँ कहुँ सुन्दर बिटप सुहाए। जनु भट बिलग बिलग होइ छाए ॥ कूजत पिक मानहुँ गज माते। ढेक महोख ऊँट बिसराते
    ॥ मोर चकोर कीर बर बाजी। पारावत मराल सब ताजी ॥ तीतिर लावक पदचर जूथा। बरनि न जाइ मनोज बरुथा ॥ रथ गिरि
    सिला दुन्दुभी झरना। चातक बन्दी गुन गन बरना ॥ मधुकर मुखर भेरि सहनाई। त्रिबिध बयारि बसीठीं आई ॥ चतुरङ्गिनी
    सेन सँग लीन्हें। बिचरत सबहि चुनौती दीन्हेम् ॥ लछिमन देखत काम अनीका। रहहिं धीर तिन्ह कै जग लीका ॥ एहि
    कें एक परम बल नारी। तेहि तें उबर सुभट सोइ भारी ॥ दो तात तीनि अति प्रबल खल काम क्रोध अरु लोभ। मुनि
    बिग्यान धाम मन करहिं निमिष महुँ छोभ ॥ ॥ लोभ कें इच्छा दम्भ बल काम कें केवल नारि। क्रोध के परुष बचन
    बल मुनिबर कहहिं बिचारि ॥ ॥ गुनातीत सचराचर स्वामी। राम उमा सब अन्तरजामी ॥ कामिन्ह कै दीनता देखाई। धीरन्ह
    कें मन बिरति दृढ़आई ॥ क्रोध मनोज लोभ मद माया। छूटहिं सकल राम कीं दाया ॥ सो नर इन्द्रजाल नहिं भूला।
    जा पर होइ सो नट अनुकूला ॥ उमा कहुँ मैं अनुभव अपना। सत हरि भजनु जगत सब सपना ॥ पुनि प्रभु गे सरोबर तीरा।
    पम्पा नाम सुभग गम्भीरा ॥ सन्त हृदय जस निर्मल बारी। बाँधे घाट मनोहर चारी ॥ जहँ तहँ पिअहिं बिबिध मृग
    नीरा। जनु उदार गृह जाचक भीरा ॥ दो पुरिनि सबन ओट जल बेगि न पाइअ मर्म। मायाछन्न न देखिऐ जैसे निर्गुन
    ब्रह्म ॥ ॥ सुखि मीन सब एकरस अति अगाध जल माहिं। जथा धर्मसीलन्ह के दिन सुख सञ्जुत जाहिम् ॥ ॥ बिकसे सरसिज
    नाना रङ्गा। मधुर मुखर गुञ्जत बहु भृङ्गा ॥ बोलत जलकुक्कुट कलहंसा। प्रभु बिलोकि जनु करत प्रसंसा ॥ चक्रवाक
    बक खग समुदाई। देखत बनि बरनि नहिं जाई ॥ सुन्दर खग गन गिरा सुहाई। जात पथिक जनु लेत बोलाई ॥ ताल समीप
    मुनिन्ह गृह छाए। चहु दिसि कानन बिटप सुहाए ॥ चम्पक बकुल कदम्ब तमाला। पाटल पनस परास रसाला ॥ नव पल्लव
    कुसुमित तरु नाना। चञ्चरीक पटली कर गाना ॥ सीतल मन्द सुगन्ध सुभ् । सन्तत बहि मनोहर ब् ॥ कुहू कुहू कोकिल
    धुनि करहीं। सुनि रव सरस ध्यान मुनि टरहीम् ॥ दो फल भारन नमि बिटप सब रहे भूमि निअराइ। पर उपकारी पुरुष
    जिमि नवहिं सुसम्पति पाइ ॥ ॥ देखि राम अति रुचिर तलावा। मज्जनु कीन्ह परम सुख पावा ॥ देखी सुन्दर तरुबर
    छाया। बैठे अनुज सहित रघुराया ॥ तहँ पुनि सकल देव मुनि आए। अस्तुति करि निज धाम सिधाए ॥ बैठे परम प्रसन्न
    कृपाला। कहत अनुज सन कथा रसाला ॥ बिरहवन्त भगवन्तहि देखी। नारद मन भा सोच बिसेषी ॥ मोर साप करि अङ्गीकारा।
    सहत राम नाना दुख भारा ॥ ऐसे प्रभुहि बिलोकुँ जाई। पुनि न बनिहि अस अवसरु आई ॥ यह बिचारि नारद कर बीना।
    गे जहाँ प्रभु सुख आसीना ॥ गावत राम चरित मृदु बानी। प्रेम सहित बहु भाँति बखानी ॥ करत दण्डवत लिए उठाई।
    राखे बहुत बार उर लाई ॥ स्वागत पूँछि निकट बैठारे। लछिमन सादर चरन पखारे ॥ दो नाना बिधि बिनती करि प्रभु
    प्रसन्न जियँ जानि। नारद बोले बचन तब जोरि सरोरुह पानि ॥ ॥ सुनहु उदार सहज रघुनायक। सुन्दर अगम सुगम बर
    दायक ॥ देहु एक बर मागुँ स्वामी। जद्यपि जानत अन्तरजामी ॥ जानहु मुनि तुम्ह मोर सुभ् । जन सन कबहुँ कि
    करुँ दुर् ॥ कवन बस्तु असि प्रिय मोहि लागी। जो मुनिबर न सकहु तुम्ह मागी ॥ जन कहुँ कछु अदेय नहिं मोरें।
    अस बिस्वास तजहु जनि भोरेम् ॥ तब नारद बोले हरषाई । अस बर मागुँ करुँ ढिठाई ॥ जद्यपि प्रभु के नाम अनेका।
    श्रुति कह अधिक एक तें एका ॥ राम सकल नामन्ह ते अधिका। हौ नाथ अघ खग गन बधिका ॥ दो राका रजनी भगति तव
    राम नाम सोइ सोम। अपर नाम उडगन बिमल बसुहुँ भगत उर ब्योम ॥ ॥ एवमस्तु मुनि सन कहेउ कृपासिन्धु रघुनाथ।
    तब नारद मन हरष अति प्रभु पद नायु माथ ॥ ॥ अति प्रसन्न रघुनाथहि जानी। पुनि नारद बोले मृदु बानी ॥ राम
    जबहिं प्रेरेउ निज माया। मोहेहु मोहि सुनहु रघुराया ॥ तब बिबाह मैं चाहुँ कीन्हा। प्रभु केहि कारन करै
    न दीन्हा ॥ सुनु मुनि तोहि कहुँ सहरोसा। भजहिं जे मोहि तजि सकल भरोसा ॥ करुँ सदा तिन्ह कै रखवारी। जिमि
    बालक राखि महतारी ॥ गह सिसु बच्छ अनल अहि धाई। तहँ राखि जननी अरगाई ॥ प्रौढ़ भेँ तेहि सुत पर माता। प्रीति
    करि नहिं पाछिलि बाता ॥ मोरे प्रौढ़ तनय सम ग्यानी। बालक सुत सम दास अमानी ॥ जनहि मोर बल निज बल ताही।
    दुहु कहँ काम क्रोध रिपु आही ॥ यह बिचारि पण्डित मोहि भजहीं। पाएहुँ ग्यान भगति नहिं तजहीम् ॥ दो काम
    क्रोध लोभादि मद प्रबल मोह कै धारि। तिन्ह महँ अति दारुन दुखद मायारूपी नारि ॥ ॥ सुनि मुनि कह पुरान श्रुति
    सन्ता। मोह बिपिन कहुँ नारि बसन्ता ॥ जप तप नेम जलाश्रय झारी। होइ ग्रीषम सोषि सब नारी ॥ काम क्रोध मद
    मत्सर भेका। इन्हहि हरषप्रद बरषा एका ॥ दुर्बासना कुमुद समुदाई। तिन्ह कहँ सरद सदा सुखदाई ॥ धर्म सकल
    सरसीरुह बृन्दा। होइ हिम तिन्हहि दहि सुख मन्दा ॥ पुनि ममता जवास बहुताई। पलुहि नारि सिसिर रितु पाई ॥
    पाप उलूक निकर सुखकारी। नारि निबिड़ रजनी अँधिआरी ॥ बुधि बल सील सत्य सब मीना। बनसी सम त्रिय कहहिं प्रबीना
    ॥ दो अवगुन मूल सूलप्रद प्रमदा सब दुख खानि। ताते कीन्ह निवारन मुनि मैं यह जियँ जानि ॥ ॥ सुनि रघुपति
    के बचन सुहाए। मुनि तन पुलक नयन भरि आए ॥ कहहु कवन प्रभु कै असि रीती। सेवक पर ममता अरु प्रीती ॥ जे न
    भजहिं अस प्रभु भ्रम त्यागी। ग्यान रङ्क नर मन्द अभागी ॥ पुनि सादर बोले मुनि नारद। सुनहु राम बिग्यान
    बिसारद ॥ सन्तन्ह के लच्छन रघुबीरा। कहहु नाथ भव भञ्जन भीरा ॥ सुनु मुनि सन्तन्ह के गुन कहूँ। जिन्ह ते
    मैं उन्ह कें बस रहूँ ॥ षट बिकार जित अनघ अकामा। अचल अकिञ्चन सुचि सुखधामा ॥ अमितबोध अनीह मितभोगी। सत्यसार
    कबि कोबिद जोगी ॥ सावधान मानद मदहीना। धीर धर्म गति परम प्रबीना ॥ दो गुनागार संसार दुख रहित बिगत सन्देह
    ॥ तजि मम चरन सरोज प्रिय तिन्ह कहुँ देह न गेह ॥ ॥ निज गुन श्रवन सुनत सकुचाहीं। पर गुन सुनत अधिक हरषाहीम्
    ॥ सम सीतल नहिं त्यागहिं नीती। सरल सुभाउ सबहिं सन प्रीती ॥ जप तप ब्रत दम सञ्जम नेमा। गुरु गोबिन्द बिप्र
    पद प्रेमा ॥ श्रद्धा छमा मयत्री दाया। मुदिता मम पद प्रीति अमाया ॥ बिरति बिबेक बिनय बिग्याना। बोध जथारथ
    बेद पुराना ॥ दम्भ मान मद करहिं न क् । भूलि न देहिं कुमारग प् ॥ गावहिं सुनहिं सदा मम लीला। हेतु रहित
    परहित रत सीला ॥ मुनि सुनु साधुन्ह के गुन जेते। कहि न सकहिं सारद श्रुति तेते ॥ छं कहि सक न सारद सेष
    नारद सुनत पद पङ्कज गहे। अस दीनबन्धु कृपाल अपने भगत गुन निज मुख कहे ॥ सिरु नाह बारहिं बार चरनन्हि ब्रह्मपुर
    नारद गे ॥ ते धन्य तुलसीदास आस बिहाइ जे हरि रँग रँए ॥ दो रावनारि जसु पावन गावहिं सुनहिं जे लोग। राम
    भगति दृढ़ पावहिं बिनु बिराग जप जोग ॥ ॥ दीप सिखा सम जुबति तन मन जनि होसि पतङ्ग। भजहि राम तजि काम मद
    करहि सदा सतसङ्ग ॥ बाईसवाँ विश्राम इति श्रीमद्रामचरितमानसे सकलकलिकलुषविध्वंसने तृतीयः सोपानः समाप्तः।
