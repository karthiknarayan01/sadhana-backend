id: badararajnakritammanikyadevistotram
category: stotram
name:
  english: badararajnakritammanikyadevistotram
  devanagari: बदरराज्नाकृतंमाणिक्यादेवीस्तोत्रम्
content:
  english: 50|| namah shripurushottamyai harinyai brahmayoshite | namo'nadikrishnanarayananganayai te
    namah || 51|| namo manikyavarnayai dharinyai shriharernamah | namah shrikrishnakantayai parabrahmyai
    namo namah || 52|| bhaktakaryatisampadayitryai matre namo namah | prasanna bhava deveshi hemanalaprashantaye
    || 53|| mahasuro'yam shrikantamrite mridho na jayate | tvam matastanmardanam vai kuru devarthasadhike
    || 54|| namastasyai sarvahantryai rakshayitryai ca te namah | mahanarayanapatnyai manikyayai ca te
    namah || 55|| evamabhyarthya tam shaktim hrida pujam cakara sah | arpayamasa pushpani manikyacarane
    tada || 56|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya caturthakhande tritiyadhyayantargatam
    badararajna kritam manikyadevistotram sampurnam | lakshminarayaniyasamhita | khanda 4| adhyaya 3
  devanagari: ५०॥ नमः श्रीपुरुषोत्तम्यै हरिण्यै ब्रह्मयोषिते । नमोऽनादिकृष्णनारायणाङ्गनायै ते नमः ॥ ५१॥
    नमो माणिक्यवर्णायै धारिण्यै श्रीहरेर्नमः । नमः श्रीकृष्णकान्तायै पारब्राह्म्यै नमो नमः ॥ ५२॥ भक्तकार्यातिसम्पादयित्र्यै
    मात्रे नमो नमः । प्रसन्ना भव देवेशि हेमानलप्रशान्तये ॥ ५३॥ महासुरोऽयं श्रीकान्तामृते मृधो न जायते
    । त्वं मातस्तन्मर्दनं वै कुरु देवार्थसाधिके ॥ ५४॥ नमस्तस्यै सर्वहन्त्र्यै रक्षयित्र्यै च ते नमः ।
    महानारायणपत्न्यै माणिक्यायै च ते नमः ॥ ५५॥ एवमभ्यर्थ्य तां शक्तिं हृदा पूजां चकार सः । अर्पयामास पुष्पाणि
    माणिक्याचरणे तदा ॥ ५६॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य चतुर्थखण्डे तृतीयाध्यायन्तर्गतं
    बदरराज्ञा कृतं माणिक्यादेवीस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता । खण्ड ४। अध्याय ३
meaning: {}
