id: raghavendramangalashtakam
category: stotram
name:
  english: raghavendramangalashtakam
  devanagari: राघवेन्द्रमन्गलाष्टकम्
content:
  english: dhyanaradhanamridvilepanamukhanekopacaran sada | karam karamabhiprayanti caturo lokah pumarthan
    sada shrimatsadgururaghavendrayatirat kuryaddhruvam mangalam || 6|| vedavyasamunishamadhvayatirat
    tikaryavakyamritam jnatva'dvaitamatam halahalasamam tyaktva samakhyaptaye | sankhyavatsukhadam dashopanishadam
    vyakhyam samakhyanmuda shrimatsadgururaghavendrayatirat kuryaddhruvam mangalam || 7|| shrimadvaishnavalokajalakaguruh
    shrimatparivradguruh shastre devaguruh shritamarataruh pratyuhagotrasvaruh | ceto'titashirustatha
    jitavarussatsaukhyasampatkaruh shrimatsadgururaghavendrayatirat kuryaddhruvam mangalam || 8|| yassandhyasvanisham
    guroryatipateh sanmangalasyashtakam sadyah papaharam svasevi vidusham bhaktyaitadabhashitam | bhaktya
    vakti susampadam shubhapadam dirghayurarogyakam kirtim putrakalatrabandhavasuhrinmurtih prayati dhruvam
    || iti shrimadappanacaryakritam raghavendramangalashtakam sampurnam |
  devanagari: ध्यानाराधनमृद्विलेपनमुखानेकोपचारान् सदा । कारं कारमभिप्रयान्ति चतुरो लोकाः पुमर्थान् सदा
    श्रीमत्सद्गुरुराघवेन्द्रयतिराट् कुर्याद्ध्रुवं मङ्गलम् ॥ ६॥ वेदव्यासमुनीशमध्वयतिराट् टीकार्यवाक्यामृतं
    ज्ञात्वाऽद्वैतमतं हलाहलसमं त्यक्त्वा समाख्याप्तये । सङ्ख्यावत्सुखदां दशोपनिषदां व्याख्यां समाख्यन्मुदा
    श्रीमत्सद्गुरुराघवेन्द्रयतिराट् कुर्याद्ध्रुवं मङ्गलम् ॥ ७॥ श्रीमद्वैष्णवलोकजालकगुरुः श्रीमत्परिव्राड्गुरुः
    शास्त्रे देवगुरुः श्रितामरतरुः प्रत्यूहगोत्रस्वरुः । चेतोऽतीतशिरुस्तथा जितवरुस्सत्सौख्यसम्पत्करुः
    श्रीमत्सद्गुरुराघवेन्द्रयतिराट् कुर्याद्ध्रुवं मङ्गलम् ॥ ८॥ यस्सन्ध्यास्वनिशं गुरोर्यतिपतेः सन्मङ्गलस्याष्टकं
    सद्यः पापहरं स्वसेवि विदुषां भक्त्यैतदाभाषितम् । भक्त्या वक्ति सुसम्पदं शुभपदं दीर्घायुरारोग्यकं कीर्तिं
    पुत्रकलत्रबान्धवसुहृन्मूर्तिः प्रयाति ध्रुवम् ॥ इति श्रीमदप्पणाचार्यकृतं राघवेन्द्रमङ्गलाष्टकं सम्पूर्णम्
    ।
