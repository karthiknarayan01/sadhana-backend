id: hayagrivaproktamshrilalitadevistotram
category: stotram
name:
  english: hayagrivaproktamshrilalitadevistotram
  devanagari: हयग्रीवप्रोक्तंश्रीललितादेवीस्तोत्रम्
content:
  english: ringaranayika ceti pancavimshatinamabhih || 17|| stuvanti ye mahabhagam lalitam parameshvarim
    | te prapnuvanti saubhagyamashtau siddhirmahadyashah || 18|| ittham pracandasamrambham calayanti mahadbalam
    | bhandasuram prati kruddha cacala lalitambika || 19|| iti brahmandapurane uttarabhage ashtadashadhyayantargatam
    hayagrivaproktam shrilalitadevistotram samaptam | brahmandapurana | uttarabhaga | lalita | adhyaya
    18
  devanagari: ृङ्गारनायिका चेति पञ्चविंशतिनामभिः ॥ १७॥ स्तुवन्ति ये महाभागां ललितां परमेश्वरीम् । ते प्राप्नुवन्ति
    सौभाग्यमष्टौ सिद्धीर्महद्यशः ॥ १८॥ इत्थं प्रचण्डसंरम्भं चालयन्ती महद्बलम् । भण्डासुरं प्रति क्रुद्धा
    चचाल ललिताम्बिका ॥ १९॥ इति ब्रह्माण्डपुराणे उत्तरभागे अष्टादशाध्यायान्तर्गतं हयग्रीवप्रोक्तं श्रीललितादेवीस्तोत्रं
    समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय १८
meaning: {}
