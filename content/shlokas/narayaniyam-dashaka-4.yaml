id: narayaniyam-dashaka-4
category: stotram
name:
  english: Narayaniyam Dashaka 4
content:
  english: kalyatam mama kurushva tavatim kalyate bhavadupasanam yaya | spashtamashtavidhayogacaryaya
    pushtayashu tava tushtimapnuyam || || brahmacaryadridhatadibhiryamairaplavadiniyamaishca pavitah |
    kurmahe dridhamami sukhasanam pankajadyamapi va bhavatparah || || taramantaranucintya santatam pranavayumabhiyamya
    nirmalah | indriyani vishayadathapahrityasmahe bhavadupasanonmukhah || || asphute vapushi te prayatnato
    dharayema dhishanam muhurmuhuh | tena bhaktirasamantarardratamudvahema bhavadanghricintaka || || visphutavayavabhedasundaram
    tvadvapuh sucirashilanavashat | ashramam manasi cintayamahe dhyanayoganiratastvadashrayah || || dhyayatam
    sakalamurtimidrishimunmishanmadhuratahritatmanam | sandramodarasarupamantaram brahma rupamayi te'vabhasate
    || || tatsamasvadanarupinim sthitim tvatsamadhimayi vishvanayaka | ashritah punaratah paricyutavarabhemahi
    ca dharanadikam || || itthamabhyasananirbharollasattvatparatmasukhakalpitotsavah | muktabhaktakulamaulitam
    gatah sancarema shukanaradadivat || || tvatsamadhivijaye tu yah punarmankshu moksharasikah kramena
    va | yogavashyamanilam shadashrayairunnayatyaja sushumnaya shanaih || || lingadehamapi santyajannatho
    liyate tvayi pare niragrahah | urdhvalokakutuki tu murdhatah sardhameva karanairniriyate || || agnivasaravalarkshapakshagairuttarayanajusha
    ca daivataih | prapito ravipadam bhavatparo modavan dhruvapadantamiyate || || asthito'tha maharalaye
    yada sheshavaktradahanoshmanardyate | iyate bhavadupashrayastada vedhasah padamatah puraiva va ||
    || tatra va tava pade'thava vasan prakritapralaya eti muktatam | svecchaya khalu pura vimucyate samvibhidya
    jagadandamojasa || || tasya ca kshitipayomaho'niladyomahatprakritisaptakavritih | tattadatmakataya
    vishan sukhi yati te padamanavritam vibho || || arciradigatimidrishim vrajan vicyutim na bhajate jagatpate
    | saccidatmaka bhavat gunodayanuccarantamanilesha pahi mam ||
  devanagari: कल्यतां मम कुरुष्व तावतीं कल्यते भवदुपासनं यया । स्पष्टमष्टविधयोगचर्यया पुष्टयाशु तव तुष्टिमाप्नुयाम्
    ॥ ॥ ब्रह्मचर्यदृढतादिभिर्यमैराप्लवादिनियमैश्च पाविताः । कुर्महे दृढममी सुखासनं पङ्कजाद्यमपि वा भवत्पराः
    ॥ ॥ तारमन्तरनुचिन्त्य सन्ततं प्राणवायुमभियम्य निर्मलाः । इन्द्रियाणि विषयादथापहृत्यास्महे भवदुपासनोन्मुखाः
    ॥ ॥ अस्फुटे वपुषि ते प्रयत्नतो धारयेम धिषणां मुहुर्मुहुः । तेन भक्तिरसमन्तरार्द्रतामुद्वहेम भवदङ्घ्रिचिन्तका
    ॥ ॥ विस्फुटावयवभेदसुन्दरं त्वद्वपुः सुचिरशीलनावशात् । अश्रमं मनसि चिन्तयामहे ध्यानयोगनिरतास्त्वदाश्रयाः
    ॥ ॥ ध्यायतां सकलमूर्तिमीदृशीमुन्मिषन्मधुरताहृतात्मनाम् । सान्द्रमोदरसरूपमान्तरं ब्रह्म रूपमयि तेऽवभासते
    ॥ ॥ तत्समास्वदनरूपिणीं स्थितिं त्वत्समाधिमयि विश्वनायक । आश्रिताः पुनरतः परिच्युतावारभेमहि च धारणादिकम्
    ॥ ॥ इत्थमभ्यसननिर्भरोल्लसत्त्वत्परात्मसुखकल्पितोत्सवाः । मुक्तभक्तकुलमौलितां गताः सञ्चरेम शुकनारदादिवत्
    ॥ ॥ त्वत्समाधिविजये तु यः पुनर्मङ्क्षु मोक्षरसिकः क्रमेण वा । योगवश्यमनिलं षडाश्रयैरुन्नयत्यज सुषुम्नया
    शनैः ॥ ॥ लिङ्गदेहमपि सन्त्यजन्नथो लीयते त्वयि परे निराग्रहः । ऊर्ध्वलोककुतुकी तु मूर्धतः सार्धमेव
    करणैर्निरीयते ॥ ॥ अग्निवासरवलर्क्षपक्षगैरुत्तरायणजुषा च दैवतैः । प्रापितो रविपदं भवत्परो मोदवान् ध्रुवपदान्तमीयते
    ॥ ॥ आस्थितोऽथ महरालये यदा शेषवक्त्रदहनोष्मणार्द्यते । ईयते भवदुपाश्रयस्तदा वेधसः पदमतः पुरैव वा ॥
    ॥ तत्र वा तव पदेऽथवा वसन् प्राकृतप्रलय एति मुक्तताम् । स्वेच्छया खलु पुरा विमुच्यते संविभिद्य जगदण्डमोजसा
    ॥ ॥ तस्य च क्षितिपयोमहोऽनिलद्योमहत्प्रकृतिसप्तकावृतीः । तत्तदात्मकतया विशन् सुखी याति ते पदमनावृतं
    विभो ॥ ॥ अर्चिरादिगतिमीदृशीं व्रजन् विच्युतिं न भजते जगत्पते । सच्चिदात्मक भवत् गुणोदयानुच्चरन्तमनिलेश
    पाहि माम् ॥
