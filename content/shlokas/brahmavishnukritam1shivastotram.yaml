id: brahmavishnukritam1shivastotram
category: stotram
name:
  english: brahmavishnukritam1shivastotram
  devanagari: ब्रह्मविष्णुकृतं१शिवस्तोत्रम्
content:
  english: brahmavishnukritam 1 shivastotram brahmacyutavucatuh namo nishkalarupaya namo | nishkalatejase
    namah sakalanathaya namaste sakalatmane || 28|| namah pranavavacyaya namah pranavalingine | namah
    srishtyadikartre ca namah pancamukhaya te || 29|| pancabrahmasvarupaya pancakrityaya te namah | atmane
    brahmane tubhyamanantagunashaktaye || 30|| sakalakalarupaya shambhave gurave namah | iti stutva gurum
    padyairbrahma vishnushca nematuh || 31|| iti shivapurane vishveshvarasamhitayam dashamadhyayantargatam
    brahma
  devanagari: ब्रह्मविष्णुकृतं १ शिवस्तोत्रम् ब्रह्माच्युतावूचतुः नमो निष्कलरूपाय नमो । निष्कलतेजसे नमः
    सकलनाथाय नमस्ते सकलात्मने ॥ २८॥ नमः प्रणववाच्याय नमः प्रणवलिङ्गिने । नमः सृष्ट्यादिकर्त्रे च नमः पञ्चमुखाय
    ते ॥ २९॥ पञ्चब्रह्मस्वरूपाय पञ्चकृत्याय ते नमः । आत्मने ब्रह्मणे तुभ्यमनन्तगुणशक्तये ॥ ३०॥ सकलाकलरूपाय
    शम्भवे गुरवे नमः । इति स्तुत्वा गुरुं पद्यैर्ब्रह्मा विष्णुश्च नेमतुः ॥ ३१॥ इति शिवपुराणे विश्वेश्वरसंहितायां
    दशमाध्यायान्तर्गतं ब्रह्म
meaning: {}
