id: gajananastotram
category: stotram
name:
  english: gajananastotram
  devanagari: गजाननस्तोत्रम्
content:
  english: rinkhala dvijarajadhyaka tundilodara | shashisuprabha vidyaya yuta stanabharanamitedya raksha
    mam || 7|| shashibhaskaravitihotradrik shubhasinduraruce vinayaka | dvipavaktra mahahibhushana tridiveshasuravandya
    pahi mam || 8|| srinipashavaradvijairyuta dvijarajardhaka mushakadhvaja | shubhalohitacandanokshita
    shrutivedyabhayadayaka'va mam || 9|| smaranattava shambhuvidhyajendvinashakradisurah kritarthatam
    | ganapa''puraghaughabhanjana dviparajasya sadaiva pahi mam || 10|| sharanam bhagavanvinayakah sharanam
    me satatam ca siddhika | sharanam punareva tavubhau sharanam nanyadupaimi daivatam || 11|| galaddanagandam
    mahahastitundam suparvapracandam dhritardhendukhandam | karasphotitandam mahahastadandam hritadhyarimundam
    bhaje vakratundam || 12|| gananatha nibandhasamstavam kripayangikuru matkritam hyamum | idameva sada
    pradiyatam karuna mayyatula'stu sarvada || 13|| iti gajananastotram sampurnam ||
  devanagari: ृङ्खल द्विजराजाढ्यक तुन्दिलोदर । शशिसुप्रभ विद्यया युत स्तनभारानमितेड्य रक्ष माम् ॥ ७॥ शशिभास्करवीतिहोत्रदृक्
    शुभसिन्दूररुचे विनायक । द्विपवक्त्र महाहिभूषण त्रिदिवेशासुरवन्द्य पाहि माम् ॥ ८॥ सृणिपाशवरद्विजैर्युत
    द्विजराजार्धक मूषकध्वज । शुभलोहितचन्दनोक्षित श्रुतिवेद्याभयदायकाऽव माम् ॥ ९॥ स्मरणात्तव शम्भुविध्यजेन्द्विनशक्रादिसुराः
    कृतार्थताम् । गणपाऽऽपुरघौघभञ्जन द्विपराजास्य सदैव पाहि माम् ॥ १०॥ शरणं भगवान्विनायकः शरणं मे सततं
    च सिद्धिका । शरणं पुनरेव तावुभौ शरणं नान्यदुपैमि दैवतम् ॥ ११॥ गलद्दानगण्डं महाहस्तितुण्डं सुपर्वप्रचण्डं
    धृतार्धेन्दुखण्डम् । करास्फोटिताण्डं महाहस्तदण्डं हृताढ्यारिमुण्डं भजे वक्रतुण्डम् ॥ १२॥ गणनाथ निबन्धसंस्तवं
    कृपयाङ्गीकुरु मत्कृतं ह्यमुम् । इदमेव सदा प्रदीयतां करुणा मय्यतुलाऽस्तु सर्वदा ॥ १३॥ इति गजाननस्तोत्रं
    सम्पूर्णम् ॥
