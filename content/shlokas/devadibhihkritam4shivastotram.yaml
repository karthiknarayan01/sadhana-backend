id: devadibhihkritam4shivastotram
category: stotram
name:
  english: devadibhihkritam4shivastotram
  devanagari: देवादिभिःकृतं४शिवस्तोत्रम्
content:
  english: devadibhih kritam 4 shivastotram tryambakenabhyanujnatastataste'svasthacetasah | namo namaste'stu
    vibho tata ityabruvanbhavam || 44|| namo devatidevaya dhanvine catimanyave | prajapatimakhaghnaya
    prajapatibhiridyase || 45|| namah stutaya stutyaya stuyamanaya mrityave | vilohitaya rudraya nilagrivaya
    shuline || 46|| amoghaya mrigakshaya pravarayudhayodhine | durvaranaya shukraya brahmane brahmacarine
    || 47|| ishanayaprameyaya niyantre carmavasase | taponityaya pingaya vratine krittivasase || 48||
    vanaspatinam pataye naranam pataye namah | gavam ca pataye nityam yajnanam pataye namah || 50|| namo'stu
    te sasainyaya tryambakayogratejase | manovakkarmabhirdeva tvam prapannanbhajasva nah || 51|| iti mahabharate
    karnaparvani 24 adhyayantargatam devadibhih kritam shivastotram sampurnam | mahabharata | karnaparva
    | adhyaya 24
  devanagari: देवादिभिः कृतं ४ शिवस्तोत्रम् त्र्यम्बकेणाभ्यनुज्ञातास्ततस्तेऽस्वस्थचेतसः । नमो नमस्तेऽस्तु
    विभो तत इत्यब्रुवन्भवम् ॥ ४४॥ नमो देवातिदेवाय धन्विने चातिमन्यवे । प्रजापतिमखघ्नाय प्रजापतिभिरीड्यसे
    ॥ ४५॥ नमः स्तुताय स्तुत्याय स्तूयमानाय मृत्यवे । विलोहिताय रुद्राय नीलग्रीवाय शूलिने ॥ ४६॥ अमोघाय
    मृगाक्षाय प्रवरायुधयोधिने । दुर्वारणाय शुक्राय ब्रह्मणे ब्रह्मचारिणे ॥ ४७॥ ईशानायाप्रमेयाय नियन्त्रे
    चर्मवाससे । तपोनित्याय पिङ्गाय व्रतिने कृत्तिवाससे ॥ ४८॥ वनस्पतीनां पतये नराणां पतये नमः । गवां च
    पतये नित्यं यज्ञानां पतये नमः ॥ ५०॥ नमोऽस्तु ते ससैन्याय त्र्यम्बकायोग्रतेजसे । मनोवाक्कर्मभिर्देव
    त्वां प्रपन्नान्भजस्व नः ॥ ५१॥ इति महाभारते कर्णपर्वणि २४ अध्यायान्तर्गतं देवादिभिः कृतं शिवस्तोत्रं
    सम्पूर्णम् । महाभारत । कर्णपर्व । अध्याय २४
meaning: {}
