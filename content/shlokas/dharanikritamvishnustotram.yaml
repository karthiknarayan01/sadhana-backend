id: dharanikritamvishnustotram
category: stotram
name:
  english: dharanikritamvishnustotram
  devanagari: धरणिकृतंविष्णुस्तोत्रम्
content:
  english: dharanikritam vishnustotram dharanyuvaca | namah kamalapatraksha namaste pitavasase | namah
    surarividhvamsakarine paramatmane || 20|| sheshaparyankashayane dhritavakshasthalashriye | namaste
    sarvadevesha namaste mokshakarine || 21|| namah sharngasicakraya janmamrityuvivarjita | namo nabhyutthitamahakamalasanajanmane
    || 22|| namo vidrumaraktoshthapanipallavashobhine | sharanam tvam prapannasmi trahi narimanagasam23||
    purnanilanjanakaram varaham te janardana | drishtva bhita'smi bhuyo'pi jagattvaddehagocare idanim
    kuru me natha dayam trahi mahaprabho || 24|| keshavah patu me padau janghe narayano mama | madhavo
    me katim patu govindo guhyameva ca || 25|| nabhim vishnustu me patu udaram madhusudanah | urastrivikramah
    patu hridayam patu vamanah || 26|| shridharah patu me kantham hrishikasho mukham mama | padmanabhastu
    nayane shiro damodaro mama || 27|| evam nyasya harernyasam namani jagati tada | namaste bhagavanvishno
  devanagari: धरणिकृतं विष्णुस्तोत्रम् धरण्युवाच । नमः कमलपत्राक्ष नमस्ते पीतवाससे । नमः सुरारिविध्वंसकारिणे
    परमात्मने ॥ २०॥ शेषपर्यङ्कशयने धृतवक्षस्थलश्रिये । नमस्ते सर्वदेवेश नमस्ते मोक्षकारिणे ॥ २१॥ नमः शार्ङ्गासिचक्राय
    जन्ममृत्युविवर्जित । नमो नाभ्युत्थितमहाकमलासनजन्मने ॥ २२॥ नमो विद्रुमरक्तोष्ठपाणिपल्लवशोभिने । शरणं
    त्वां प्रपन्नास्मि त्राहि नारीमनागसम्२३॥ पूर्णनीलाञ्जनाकारं वाराहं ते जनार्दन । दृष्ट्वा भीताऽस्मि
    भूयोऽपि जगत्त्वद्देहगोचरे इदानीं कुरु मे नाथ दयां त्राहि महाप्रभो ॥ २४॥ केशवः पातु मे पादौ जङ्घे नारायणो
    मम । माधवो मे कटिं पातु गोविन्दो गुह्यमेव च ॥ २५॥ नाभिं विष्णुस्तु मे पातु उदरं मधुसूदनः । उरस्त्रिविक्रमः
    पातु हृदयं पातु वामनः ॥ २६॥ श्रीधरः पातु मे कण्ठं हृषीकशो मुखं मम । पद्मनाभस्तु नयने शिरो दामोदरो
    मम ॥ २७॥ एवं न्यस्य हरेर्न्यासं नामानि जगती तदा । नमस्ते भगवन्विष्णो
meaning: {}
