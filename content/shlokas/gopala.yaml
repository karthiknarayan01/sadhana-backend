id: gopala
category: upanishad
name:
  english: gopala
  devanagari: गोपल
content:
  english: ringadharam tu va | mathyate tu jagatsarvam brahmajnanena yena va || 19|| matsarabhutam yadyatsyanmathura
    sa nigadyate | ashtadikpalakairbhumipadmam vikasitam jagat || 20|| samsararnavasamjatam sevitam mama
    manase | candrasuryatvisho divya dhvaja merurhiranmayah || 21|| atapatram brahmalokamathordhvam caranam
    smritam | shrivatsasya svarupam tu vartate lanchanaih saha || 22|| shrivatsalakshanam tasmatkathyate
    brahmavadibhih | yena suryagnivakcandratejasa svasvarupina || 23|| vartate kaustubhakhyamanim vadantishamaninah
    | sattvam rajastama iti ahamkarashcaturbhujah || 24|| pancabhutatmakam shankham kare rajasi samsthitam
    | balasvarupamityantam manashcakram nigadyate || 25|| adya maya bhaveccharngam padmam vishvam kare
    sthitam | adya vidya gada vedya sarvada me kare sthita || 26|| dharmarthakamakeyurairdivyairdivyamayeritaih
    | kantham tu nirgunam proktam malyate adyaya'jaya || 27|| mala nigadyate brahmamstava putraistu manasaih
    | kutastham sattvarupam ca kiritam pravadanti mam || 28|| kshirottaram prasphurantam kundalam yugalam
    smritam | dhyayenmama priyam nityam sa mokshamadhigacchati || 29|| sa mukto bhavati tasmai svatmanam
    tu dadami vai | etatsarvam maya proktam bhavishyadvai vidhe tava || 30|| svarupam dvividham caiva
    sagunam nirgunatmakam || 31|| sa hovacabjayonih | vyaktinam murtinam proktanam katham cabharanani
    bhavanti | katham va deva yajanti | rudra yajanti | brahma yajati | brahmaja yajanti | vinayaka yajanti
    | dvadashaditya yajanti | vasavo yajanti | gandharva yajanti | sapadanuga antardhane tishthanti |
    kam manushya yajanti | sahovaca tam hi vai narayano deva adya vyakta dvadasha murtayah sarveshu lokeshu
    sarveshu deveshu sarveshu manushyeshu tishthantiti | rudreshu raudri brahmanishu brahmi deveshu daivi
    manushyeshu manavi vinayakeshu vighnavinashini adityeshu jyotirgandharveshu gandharvi apsarahsvevam
    gaurvasushvevam kamya antardhaneshvaprakashini avirbhavatirobhava svapade tishthanti | tamasi rajasi
    sattviki manushi vijnanaghana anandasaccidanandaikarase bhaktiyoge tishthati | om pranatmane om tatsadbhurbhuvah
    suvastasmai pranatmane namonamah || 1|| om shrikrishnaya govindaya gopijanavallabhaya om tatsadbhurbhuvah
    suvastasmai namonamah || 2|| omapanatmane om tatsadbhurbhuvah suvastasmai apanatmane namonamah ||
    3|| om shrikrishnayaniruddhaya om tatsadbhurbhuvah suvastasmai vai namonamah || 4|| om vyanatmane
    om tatsadbhurbhuvah suvastasmai vyanatmane namonamah || 5|| om shrikrishnaya ramaya om tatsadbhurbhuvah
    suvastasmai vai namonamah || 6|| omudanatmane om tatsadbhurbhuvah suvastasmai udanatmane namonamah
    || 7|| om shrikrishnaya devakinandanaya om tatsadbhurbhuvah suvastasmai vai namonamah || 8|| om samanatmane
    om tatsadbhurbhuvah suvastasmai samanatmane namonamah || 9|| om shrigopalaya nijasvarupaya om tatsadbhurbhuvah
    suvastasmai vai namonamah || 10|| om yo'sau pradhanatma gopala om tatsadbhurbhuvah suvastasmai vai
    namonamah || 11|| om yo'savindriyatma gopala om tatsadbhurbhuvah suvastasmai vai namonamah || 12||
    om yo'sau bhutatma gopala om tatsadbhurbhuvah suvastasmai vai namonamah || 13|| om yo'savuttamapurusho
    gopala om tatsadbhurbhuvah suvastamai vai namonamah || 14|| om yo'sau brahma param vai brahma om tatsadbhurbhuvah
    suvastasmai vai namonamah || 15|| om yo'sau sarvabhutatma gopala om tatsadbhurbhuvah suvastasmai namonamah
    || 16|| om jagratsvapnasushuptituriyaturiyatito'ntaryami gopala om tatsadbhurbhuvah suvastasmai vai
    namonamah || 17|| eko devah sarvabhuteshu gudhah sarvavyapi sarvabhutantaratma | karmadhyakshah sarvabhutadhivasah
    sakshi ceta kevalo nirgunashca || 18|| rudraya namah | adityaya namah | vinayakaya namah | suryaya
    namah | vidyayai namah | indraya namah | agnaye namah | yamaya namah | nirritaye namah | varunaya
    namah | vayave namah | kuberaya namah | ishanaya namah | sarvebhyo devebhyo namah | dattva stutim
    punyatamam brahmane svasvarupine | kartritvam sarvabhutanamantardhano babhuva sah || 19|| brahmane
    brahmaputrebhyo naradattu shrutam mune | tatha proktam tu gandharvi gaccha tvam svalayantikam || 20||
    iti|| om bhadram karnebhih sha
  devanagari: ृङ्गधरं तु वा । मथ्यते तु जगत्सर्वं ब्रह्मज्ञानेन येन वा ॥ १९॥ मत्सारभूतं यद्यत्स्यान्मथुरा
    सा निगद्यते । अष्टदिक्पालकैर्भूमिपद्मं विकसितं जगत् ॥ २०॥ संसारार्णवसंजातं सेवितं मम मानसे । चन्द्रसूर्यत्विषो
    दिव्या ध्वजा मेरुर्हिरण्मयः ॥ २१॥ आतपत्रं ब्रह्मलोकमथोर्ध्वं चरणं स्मृतम् । श्रीवत्सस्य स्वरूपं तु
    वर्तते लाञ्छनैः सह ॥ २२॥ श्रीवत्सलक्षणं तस्मात्कथ्यते ब्रह्मवादिभिः । येन सूर्याग्निवाक्चन्द्रतेजसा
    स्वस्वरूपिणा ॥ २३॥ वर्तते कौस्तुभाख्यमणिं वदन्तीशमानिनः । सत्त्वं रजस्तम इति अहंकारश्चतुर्भुजः ॥ २४॥
    पञ्चभूतात्मकं शङ्खं करे रजसि संस्थितम् । बालस्वरूपमित्यन्तं मनश्चक्रं निगद्यते ॥ २५॥ आद्या माया भवेच्छार्ङ्गं
    पद्मं विश्वं करे स्थितम् । आद्या विद्या गदा वेद्या सर्वदा मे करे स्थिता ॥ २६॥ धर्मार्थकामकेयूरैर्दिव्यैर्दिव्यमयेरितैः
    । कण्ठं तु निर्गुणं प्रोक्तं माल्यते आद्ययाऽजया ॥ २७॥ माला निगद्यते ब्रह्मंस्तव पुत्रैस्तु मानसैः
    । कूटस्थं सत्त्वरूपं च किरीटं प्रवदन्ति माम् ॥ २८॥ क्षीरोत्तरं प्रस्फुरन्तं कुण्डलं युगलं स्मृतम्
    । ध्यायेन्मम प्रियं नित्यं स मोक्षमधिगच्छति ॥ २९॥ स मुक्तो भवति तस्मै स्वात्मानं तु ददामि वै । एतत्सर्वं
    मया प्रोक्तं भविष्यद्वै विधे तव ॥ ३०॥ स्वरूपं द्विविधं चैव सगुणं निर्गुणात्मकम् ॥ ३१॥ स होवाचाब्जयोनिः
    । व्यक्तीनां मूर्तीनां प्रोक्तानां कथं चाभरणानि भवन्ति । कथं वा देवा यजन्ति । रुद्रा यजन्ति । ब्रह्मा
    यजति । ब्रह्मजा यजन्ति । विनायका यजन्ति । द्वादशादित्या यजन्ति । वसवो यजन्ति । गन्धर्वा यजन्ति । सपदानुगा
    अन्तर्धाने तिष्ठन्ति । कां मनुष्या यजन्ति । सहोवाच तं हि वै नारायणो देव आद्या व्यक्ता द्वादश मूर्तयः
    सर्वेषु लोकेषु सर्वेषु देवेषु सर्वेषु मनुष्येषु तिष्ठन्तीति । रुद्रेषु रौद्री ब्रह्माणीषु ब्राह्मी
    देवेषु दैवी मनुष्येषु मानवी विनायकेषु विघ्नविनाशिनी आदित्येषु ज्योतिर्गन्धर्वेषु गान्धर्वी अप्सरःस्वेवं
    गौर्वसुष्वेवं काम्या अन्तर्धानेष्वप्रकाशिनी आविर्भावतिरोभावा स्वपदे तिष्ठन्ति । तामसी राजसी सात्त्विकी
    मानुषी विज्ञानघन आनन्दसच्चिदानन्दैकरसे भक्तियोगे तिष्ठति । ॐ प्राणात्मने ॐ तत्सद्भूर्भुवः सुवस्तस्मै
    प्राणात्मने नमोनमः ॥ १॥ ॐ श्रीकृष्णाय गोविन्दाय गोपीजनवल्लभाय ॐ तत्सद्भूर्भुवः सुवस्तस्मै नमोनमः ॥
    २॥ ॐअपानात्मने ॐ तत्सद्भूर्भुवः सुवस्तस्मै अपानात्मने नमोनमः ॥ ३॥ ॐ श्रीकृष्णायानिरुद्धाय ॐ तत्सद्भूर्भुवः
    सुवस्तस्मै वै नमोनमः ॥ ४॥ ॐ व्यानात्मने ॐ तत्सद्भूर्भुवः सुवस्तस्मै व्यानात्मने नमोनमः ॥ ५॥ ॐ श्रीकृष्णाय
    रामाय ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ६॥ ॐउदानात्मने ॐ तत्सद्भूर्भुवः सुवस्तस्मै उदानात्मने
    नमोनमः ॥ ७॥ ॐ श्रीकृष्णाय देवकीनन्दनाय ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ८॥ ॐ समानात्मने ॐ तत्सद्भूर्भुवः
    सुवस्तस्मै समानात्मने नमोनमः ॥ ९॥ ॐ श्रीगोपालाय निजस्वरूपाय ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः
    ॥ १०॥ ॐ योऽसौ प्रधानात्मा गोपाल ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ११॥ ॐ योऽसाविन्द्रियात्मा
    गोपाल ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ १२॥ ॐ योऽसौ भूतात्मा गोपाल ॐ तत्सद्भूर्भुवः सुवस्तस्मै
    वै नमोनमः ॥ १३॥ ॐ योऽसावुत्तमपुरुषो गोपाल ॐ तत्सद्भूर्भुवः सुवस्तमै वै नमोनमः ॥ १४॥ ॐ योऽसौ ब्रह्म
    परं वै ब्रह्म ॐ तत्सद्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ १५॥ ॐ योऽसौ सर्वभूतात्मा गोपाल ॐ तत्सद्भूर्भुवः
    सुवस्तस्मै नमोनमः ॥ १६॥ ॐ जाग्रत्स्वप्नसुषुप्तितुरीयतुरीयातीतोऽन्तर्यामी गोपाल ॐ तत्सद्भूर्भुवः सुवस्तस्मै
    वै नमोनमः ॥ १७॥ एको देवः सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा । कर्माध्यक्षः सर्वभूताधिवासः
    साक्षी चेता केवलो निर्गुणश्च ॥ १८॥ रुद्राय नमः । आदित्याय नमः । विनायकाय नमः । सूर्याय नमः । विद्यायै
    नमः । इन्द्राय नमः । अग्नये नमः । यमाय नमः । निरृतये नमः । वरुणाय नमः । वायवे नमः । कुबेराय नमः ।
    ईशानाय नमः । सर्वेभ्यो देवेभ्यो नमः । दत्त्वा स्तुतिं पुण्यतमां ब्रह्मणे स्वस्वरूपिणे । कर्तृत्वं
    सर्वभूतानामन्तर्धानो बभूव सः ॥ १९॥ ब्रह्मणे ब्रह्मपुत्रेभ्यो नारदात्तु श्रुतं मुने । तथा प्रोक्तं
    तु गान्धर्वि गच्छ त्वं स्वालयान्तिकम् ॥ २०॥ इति॥ ॐ भद्रं कर्णेभिः श
