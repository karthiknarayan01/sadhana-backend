id: ganesha-1000
category: stotram
name:
  english: ganesha 1000
  devanagari: गनेश १०००
content:
  english: atha karanyasah | ganeshvaro ganakrida ityangushthabhyam namah | kumaragururishana iti tarjanibhyam
    namah || 1|| brahmandakumbhashcidvyometi madhyamabhyam namah | rakto raktambaradhara ityanamikabhyam
    namah || 2|| sarvasadgurusamsevya iti kanishthikabhyam namah | luptavighnah svabhaktanamiti karatalakaraprishthabhyam
    namah || 3|| atha hridayadinyasah | chandashchandodbhava iti hridayaya namah | nishkalo nirmala iti
    shirase svaha | srishtisthitilayakrida iti shikhayai vashat | jnanam vijnanamananda iti kavacaya hum
    | ashtangayogaphalabhriditi netratrayaya vaushat | anantashaktisahita ityastraya phat | bhurbhuvah
    svarom iti digbandhah || atha dhyanam | gajavadanamacintyam tikshnadamshtram trinetram brihadudaramashesham
    bhutirajam puranam | amaravarasupujyam raktavarnam suresham pashupatisutamisham vighnarajam namami
    || 1|| raktambhodhisthapotollasadarunasarojadhirudham trinetram pasham caivankushakhyam parashumabhayadam
    bahubhirdharayantam | shaktya yuktam gajasyam prithutarajatharam siddhibuddhisametam raktam candrardhamaulim
    sakalabhayaharam vighnarajam namami || 2|| shrisiddhibuddhisahitaya salakshalabhaya shrisvanandeshaya
    brahmanaspataye sangaya saparivaraya sashaktikaya sayudhaya savahanaya savaranaya namah | iti namamantrena
    manasaih pancopacaraih sampujya pathet | shrimahaganapatiruvaca | om ganeshvaro ganakrido gananatho
    ganadhipah | ekadanto vakratundo gajavaktro mahodarah || 1|| lambodaro dhumravarno vikato vighnanashanah
    | sumukho durmukho buddho vighnarajo gajananah || 2|| bhimah pramoda amodah suranando madotkatah |
    herambah shambarah shambhurlambakarno mahabalah || 3|| nandano'lampato'bhirurmeghanado gananjayah
    | vinayako virupaksho virah shuravarapradah || 4|| mahaganapatirbuddhipriyah kshipraprasadanah | rudrapriyo
    ganadhyaksha umaputro'ghanashanah || 5|| kumaragururishanaputro mushakavahanah | siddhipriyah siddhipatih
    siddhah siddhivinayakah || 6|| avighnastumburuh simhavahano mohinipriyah | katankato rajaputrah shakalah
    sammito'mitah || 7|| kushmandasamasambhutirdurjayo dhurjayo jayah | bhupatirbhuvanapatirbhutanam patiravyayah
    || 8|| vishvakarta vishvamukho vishvarupo nidhirgunah | kavih kavinamrishabho brahmanyo brahmavitpriyah
    || 9|| jyeshtharajo nidhipatirnidhipriyapatipriyah | hiranmayapurantahsthah suryamandalamadhyagah
    || 10|| karahatidhvastasindhusalilah pushadantabhit | umankakelikutuki muktidah kulapavanah || 11||
    kiriti kundali hari vanamali manomayah | vaimukhyahatadaityashrih padahatijitakshitih || 12|| sadyojatah
    svarnamunjamekhali durnimittahrit | duhsvapnahritprasahano guni nadapratishthitah || 13|| surupah
    sarvanetradhivaso virasanashrayah | pitambarah khandaradah khandavaishakhasamsthitah || 14|| citrangah
    shyamadashano bhalacandro havirbhujah | yogadhipastarakasthah purusho gajakarnakah || 15|| ganadhirajo
    vijayah sthiro gajapatirdhvaji | devadevah smarah pranadipako vayukilakah || 16|| vipashcidvarado
    nado nadabhinnamahacalah | varaharadano mrityunjayo vyaghrajinambarah || 17|| icchashaktibhavo devatrata
    daityavimardanah | shambhuvaktrodbhavah shambhukopaha shambhuhasyabhuh || 18|| shambhutejah shivashokahari
    gaurisukhavahah | umangamalajo gauritejobhuh svardhunibhavah || 19|| yajnakayo mahanado girivarshma
    shubhananah | sarvatma sarvadevatma brahmamurdha kakupshrutih || 20|| brahmandakumbhashcidvyomabhalahsatyashiroruhah
    | jagajjanmalayonmeshanimesho'gnyarkasomadrik || 21|| girindraikarado dharmadharmoshthah samabrimhitah
    | graharkshadashano vanijihvo vasavanasikah || 22|| bhrumadhyasamsthitakaro brahmavidyamadodakah |
    kulacalamsah somarkaghanto rudrashirodharah || 23|| nadinadabhujah sarpangulikastarakanakhah | vyomanabhih
    shrihridayo meruprishtho'rnavodarah || 24|| kukshisthayakshagandharvarakshahkinnaramanushah | prithvikatih
    srishtilingah shailorurdasrajanukah || 25|| patalajangho munipatkalangushthastrayitanuh | jyotirmandalalangulo
    hridayalananishcalah || 26|| hritpadmakarnikashali viyatkelisarovarah | sadbhaktadhyananigadah pujavarinivaritah
    || 27|| pratapi kashyapo manta ganako vishtapi bali | yashasvi dharmiko jeta prathamah pramatheshvarah
    || 28|| cintamanirdvipapatih kalpadrumavanalayah | ratnamandapamadhyastho ratnasimhasanashrayah ||
    29|| tivrashiroddhritapado jvalinimaulilalitah | nandananditapithashrirbhogado bhushitasanah || 30||
    sakamadayinipithah sphuradugrasanashrayah | tejovatishiroratnam satyanityavatamsitah || 31|| savighnanashinipithah
    sarvashaktyambujalayah | lipipadmasanadharo vahnidhamatrayalayah || 32|| unnataprapado gudhagulphah
    samvritaparshnikah | pinajanghah shlishtajanuh sthuloruh pronnamatkatih || 33|| nimnanabhih sthulakukshih
    pinavaksha brihadbhujah | pinaskandhah kambukantho lamboshtho lambanasikah || 34|| bhagnavamaradastungasavyadanto
    mahahanuh | hrasvanetratrayah shurpakarno nibidamastakah || 35|| stabakakarakumbhagro ratnamaulirnirankushah
    | sarpaharakatisutrah sarpayajnopavitavan || 36|| sarpakotirakatakah sarpagraiveyakangadah | sarpakakshodarabandhah
    sarparajottaracchadah || 37|| rakto raktambaradharo raktamalavibhushanah | raktekshano raktakaro raktatalvoshthapallavah
    || 38|| shvetah shvetambaradharah shvetamalavibhushanah | shvetatapatrarucirah shvetacamaravijitah
    || 39|| sarvavayavasampurnah sarvalakshanalakshitah | sarvabharanashobhadhyah sarvashobhasamanvitah
    || 40|| sarvamangalamangalyah sarvakaranakaranam | sarvadevavarah sharngi bijapuri gadadharah || 41||
    shubhango lokasarangah sutantustantuvardhanah | kiriti kundali hari vanamali shubhangadah || 42||
    ikshucapadharah shuli cakrapanih sarojabhrit | pashi dhritotpalah shalimanjaribhritsvadantabhrit ||
    43|| kalpavallidharo vishvabhayadaikakaro vashi | akshamaladharo jnanamudravan mudgarayudhah || 44||
    purnapatri kambudharo vidhritankushamulakah | karasthamraphalashcutakalikabhritkutharavan || 45||
    pushkarasthasvarnaghatipurnaratnabhivarshakah | bharatisundarinatho vinayakaratipriyah || 46|| mahalakshmipriyatamah
    siddhalakshmimanoramah | ramarameshapurvango dakshinomamaheshvarah || 47|| mahivarahavamango ratikandarpapashcimah
    | amodamodajananah sampramodapramodanah || 48|| samvardhitamahavriddhirriddhisiddhipravardhanah |
    dantasaumukhyasumukhah kantikandalitashrayah || 49|| madanavatyashritanghrih kritavaimukhyadurmukhah
    | vighnasampallavah padmah sarvonnatamadadravah || 50|| vighnakrinnimnacarano dravinishaktisatkritah
    | tivraprasannanayano jvalinipalitaikadrik || 51|| mohinimohano bhogadayinikantimandanah | kaminikantavaktrashriradhishthitavasundharah
    || 52|| vasudharamadonnado mahashankhanidhipriyah | namadvasumatimali mahapadmanidhih prabhuh || 53||
    sarvasadgurusamsevyah shocishkeshahridashrayah | ishanamurdha devendrashikhah pavananandanah || 54||
    pratyugranayano divyo divyastrashataparvadhrik | airavatadisarvashavarano varanapriyah || 55|| vajradyastraparivaro
    ganacandasamashrayah | jayajayaparikaro vijayavijayavahah || 56|| ajayarcitapadabjo nityanandavanasthitah
    | vilasinikritollasah shaundi saundaryamanditah || 57|| anantanantasukhadah sumangalasumangalah |
    jnanashrayah kriyadhara icchashaktinishevitah || 58|| subhagasamshritapado lalitalalitashrayah | kaminipalanah
    kamakaminikelilalitah || 59||
  devanagari: अथ करन्यासः । गणेश्वरो गणक्रीड इत्यङ्गुष्ठाभ्यां नमः । कुमारगुरुरीशान इति तर्जनीभ्यां नमः
    ॥ १॥ ब्रह्माण्डकुम्भश्चिद्व्योमेति मध्यमाभ्यां नमः । रक्तो रक्ताम्बरधर इत्यनामिकाभ्यां नमः ॥ २॥ सर्वसद्गुरुसंसेव्य
    इति कनिष्ठिकाभ्यां नमः । लुप्तविघ्नः स्वभक्तानामिति करतलकरपृष्ठाभ्यां नमः ॥ ३॥ अथ हृदयादिन्यासः ।
    छन्दश्छन्दोद्भव इति हृदयाय नमः । निष्कलो निर्मल इति शिरसे स्वाहा । सृष्टिस्थितिलयक्रीड इति शिखायै
    वषट् । ज्ञानं विज्ञानमानन्द इति कवचाय हुम् । अष्टाङ्गयोगफलभृदिति नेत्रत्रयाय वौषट् । अनन्तशक्तिसहित
    इत्यस्त्राय फट् । भूर्भुवः स्वरोम् इति दिग्बन्धः ॥ अथ ध्यानम् । गजवदनमचिन्त्यं तीक्ष्णदंष्ट्रं त्रिनेत्रं
    बृहदुदरमशेषं भूतिराजं पुराणम् । अमरवरसुपूज्यं रक्तवर्णं सुरेशं पशुपतिसुतमीशं विघ्नराजं नमामि ॥ १॥
    रक्ताम्भोधिस्थपोतोल्लसदरुणसरोजाधिरुढं त्रिनेत्रं पाशं चैवाङ्कुशाख्यं परशुमभयदं बाहुभिर्धारयन्तम् ।
    शक्त्या युक्तं गजास्यं पृथुतरजठरं सिद्धिबुद्धीसमेतं रक्तं चन्द्रार्धमौलिं सकलभयहरं विघ्नराजं नमामि
    ॥ २॥ श्रीसिद्धिबुद्धिसहिताय सलक्षलाभाय श्रीस्वानन्देशाय ब्रह्मणस्पतये साङ्गाय सपरिवाराय सशक्तिकाय
    सायुधाय सवाहनाय सावरणाय नमः । इति नाममन्त्रेण मानसैः पञ्चोपचारैः सम्पूज्य पठेत् । श्रीमहागणपतिरुवाच
    । ॐ गणेश्वरो गणक्रीडो गणनाथो गणाधिपः । एकदन्तो वक्रतुण्डो गजवक्त्रो महोदरः ॥ १॥ लम्बोदरो धूम्रवर्णो
    विकटो विघ्ननाशनः । सुमुखो दुर्मुखो बुद्धो विघ्नराजो गजाननः ॥ २॥ भीमः प्रमोद आमोदः सुरानन्दो मदोत्कटः
    । हेरम्बः शम्बरः शम्भुर्लम्बकर्णो महाबलः ॥ ३॥ नन्दनोऽलम्पटोऽभीरूर्मेघनादो गणञ्जयः । विनायको विरूपाक्षो
    वीरः शूरवरप्रदः ॥ ४॥ महागणपतिर्बुद्धिप्रियः क्षिप्रप्रसादनः । रुद्रप्रियो गणाध्यक्ष उमापुत्रोऽघनाशनः
    ॥ ५॥ कुमारगुरुरीशानपुत्रो मूषकवाहनः । सिद्धिप्रियः सिद्धिपतिः सिद्धः सिद्धिविनायकः ॥ ६॥ अविघ्नस्तुम्बुरुः
    सिंहवाहनो मोहिनीप्रियः । कटङ्कटो राजपुत्रः शाकलः संमितोऽमितः ॥ ७॥ कूष्माण्डसामसम्भूतिर्दुर्जयो धूर्जयो
    जयः । भूपतिर्भुवनपतिर्भूतानां पतिरव्ययः ॥ ८॥ विश्वकर्ता विश्वमुखो विश्वरूपो निधिर्गुणः । कविः कवीनामृषभो
    ब्रह्मण्यो ब्रह्मवित्प्रियः ॥ ९॥ ज्येष्ठराजो निधिपतिर्निधिप्रियपतिप्रियः । हिरण्मयपुरान्तःस्थः सूर्यमण्डलमध्यगः
    ॥ १०॥ कराहतिध्वस्तसिन्धुसलिलः पूषदन्तभित् । उमाङ्ककेलिकुतुकी मुक्तिदः कुलपावनः ॥ ११॥ किरीटी कुण्डली
    हारी वनमाली मनोमयः । वैमुख्यहतदैत्यश्रीः पादाहतिजितक्षितिः ॥ १२॥ सद्योजातः स्वर्णमुञ्जमेखली दुर्निमित्तहृत्
    । दुःस्वप्नहृत्प्रसहनो गुणी नादप्रतिष्ठितः ॥ १३॥ सुरूपः सर्वनेत्राधिवासो वीरासनाश्रयः । पीताम्बरः
    खण्डरदः खण्डवैशाखसंस्थितः ॥ १४॥ चित्राङ्गः श्यामदशनो भालचन्द्रो हविर्भुजः । योगाधिपस्तारकस्थः पुरुषो
    गजकर्णकः ॥ १५॥ गणाधिराजो विजयः स्थिरो गजपतिर्ध्वजी । देवदेवः स्मरः प्राणदीपको वायुकीलकः ॥ १६॥ विपश्चिद्वरदो
    नादो नादभिन्नमहाचलः । वराहरदनो मृत्युञ्जयो व्याघ्राजिनाम्बरः ॥ १७॥ इच्छाशक्तिभवो देवत्राता दैत्यविमर्दनः
    । शम्भुवक्त्रोद्भवः शम्भुकोपहा शम्भुहास्यभूः ॥ १८॥ शम्भुतेजाः शिवाशोकहारी गौरीसुखावहः । उमाङ्गमलजो
    गौरीतेजोभूः स्वर्धुनीभवः ॥ १९॥ यज्ञकायो महानादो गिरिवर्ष्मा शुभाननः । सर्वात्मा सर्वदेवात्मा ब्रह्ममूर्धा
    ककुप्श्रुतिः ॥ २०॥ ब्रह्माण्डकुम्भश्चिद्व्योमभालःसत्यशिरोरुहः । जगज्जन्मलयोन्मेषनिमेषोऽग्न्यर्कसोमदृक्
    ॥ २१॥ गिरीन्द्रैकरदो धर्माधर्मोष्ठः सामबृंहितः । ग्रहर्क्षदशनो वाणीजिह्वो वासवनासिकः ॥ २२॥ भ्रूमध्यसंस्थितकरो
    ब्रह्मविद्यामदोदकः । कुलाचलांसः सोमार्कघण्टो रुद्रशिरोधरः ॥ २३॥ नदीनदभुजः सर्पाङ्गुलीकस्तारकानखः ।
    व्योमनाभिः श्रीहृदयो मेरुपृष्ठोऽर्णवोदरः ॥ २४॥ कुक्षिस्थयक्षगन्धर्वरक्षःकिन्नरमानुषः । पृथ्वीकटिः
    सृष्टिलिङ्गः शैलोरुर्दस्रजानुकः ॥ २५॥ पातालजङ्घो मुनिपात्कालाङ्गुष्ठस्त्रयीतनुः । ज्योतिर्मण्डललाङ्गूलो
    हृदयालाननिश्चलः ॥ २६॥ हृत्पद्मकर्णिकाशाली वियत्केलिसरोवरः । सद्भक्तध्याननिगडः पूजावारिनिवारितः ॥ २७॥
    प्रतापी काश्यपो मन्ता गणको विष्टपी बली । यशस्वी धार्मिको जेता प्रथमः प्रमथेश्वरः ॥ २८॥ चिन्तामणिर्द्वीपपतिः
    कल्पद्रुमवनालयः । रत्नमण्डपमध्यस्थो रत्नसिंहासनाश्रयः ॥ २९॥ तीव्राशिरोद्धृतपदो ज्वालिनीमौलिलालितः
    । नन्दानन्दितपीठश्रीर्भोगदो भूषितासनः ॥ ३०॥ सकामदायिनीपीठः स्फुरदुग्रासनाश्रयः । तेजोवतीशिरोरत्नं
    सत्यानित्यावतंसितः ॥ ३१॥ सविघ्ननाशिनीपीठः सर्वशक्त्यम्बुजालयः । लिपिपद्मासनाधारो वह्निधामत्रयालयः
    ॥ ३२॥ उन्नतप्रपदो गूढगुल्फः संवृतपार्ष्णिकः । पीनजङ्घः श्लिष्टजानुः स्थूलोरुः प्रोन्नमत्कटिः ॥ ३३॥
    निम्ननाभिः स्थूलकुक्षिः पीनवक्षा बृहद्भुजः । पीनस्कन्धः कम्बुकण्ठो लम्बोष्ठो लम्बनासिकः ॥ ३४॥ भग्नवामरदस्तुङ्गसव्यदन्तो
    महाहनुः । ह्रस्वनेत्रत्रयः शूर्पकर्णो निबिडमस्तकः ॥ ३५॥ स्तबकाकारकुम्भाग्रो रत्नमौलिर्निरङ्कुशः ।
    सर्पहारकटीसूत्रः सर्पयज्ञोपवीतवान् ॥ ३६॥ सर्पकोटीरकटकः सर्पग्रैवेयकाङ्गदः । सर्पकक्षोदराबन्धः सर्पराजोत्तरच्छदः
    ॥ ३७॥ रक्तो रक्ताम्बरधरो रक्तमालाविभूषणः । रक्तेक्षणो रक्तकरो रक्तताल्वोष्ठपल्लवः ॥ ३८॥ श्वेतः श्वेताम्बरधरः
    श्वेतमालाविभूषणः । श्वेतातपत्ररुचिरः श्वेतचामरवीजितः ॥ ३९॥ सर्वावयवसम्पूर्णः सर्वलक्षणलक्षितः । सर्वाभरणशोभाढ्यः
    सर्वशोभासमन्वितः ॥ ४०॥ सर्वमङ्गलमाङ्गल्यः सर्वकारणकारणम् । सर्वदेववरः शार्ङ्गी बीजपूरी गदाधरः ॥ ४१॥
    शुभाङ्गो लोकसारङ्गः सुतन्तुस्तन्तुवर्धनः । किरीटी कुण्डली हारी वनमाली शुभाङ्गदः ॥ ४२॥ इक्षुचापधरः
    शूली चक्रपाणिः सरोजभृत् । पाशी धृतोत्पलः शालिमञ्जरीभृत्स्वदन्तभृत् ॥ ४३॥ कल्पवल्लीधरो विश्वाभयदैककरो
    वशी । अक्षमालाधरो ज्ञानमुद्रावान् मुद्गरायुधः ॥ ४४॥ पूर्णपात्री कम्बुधरो विधृताङ्कुशमूलकः । करस्थाम्रफलश्चूतकलिकाभृत्कुठारवान्
    ॥ ४५॥ पुष्करस्थस्वर्णघटीपूर्णरत्नाभिवर्षकः । भारतीसुन्दरीनाथो विनायकरतिप्रियः ॥ ४६॥ महालक्ष्मीप्रियतमः
    सिद्धलक्ष्मीमनोरमः । रमारमेशपूर्वाङ्गो दक्षिणोमामहेश्वरः ॥ ४७॥ महीवराहवामाङ्गो रतिकन्दर्पपश्चिमः ।
    आमोदमोदजननः सम्प्रमोदप्रमोदनः ॥ ४८॥ संवर्धितमहावृद्धिरृद्धिसिद्धिप्रवर्धनः । दन्तसौमुख्यसुमुखः कान्तिकन्दलिताश्रयः
    ॥ ४९॥ मदनावत्याश्रिताङ्घ्रिः कृतवैमुख्यदुर्मुखः । विघ्नसम्पल्लवः पद्मः सर्वोन्नतमदद्रवः ॥ ५०॥ विघ्नकृन्निम्नचरणो
    द्राविणीशक्तिसत्कृतः । तीव्राप्रसन्ननयनो ज्वालिनीपालितैकदृक् ॥ ५१॥ मोहिनीमोहनो भोगदायिनीकान्तिमण्डनः
    । कामिनीकान्तवक्त्रश्रीरधिष्ठितवसुन्धरः ॥ ५२॥ वसुधारामदोन्नादो महाशङ्खनिधिप्रियः । नमद्वसुमतीमाली
    महापद्मनिधिः प्रभुः ॥ ५३॥ सर्वसद्गुरुसंसेव्यः शोचिष्केशहृदाश्रयः । ईशानमूर्धा देवेन्द्रशिखः पवननन्दनः
    ॥ ५४॥ प्रत्युग्रनयनो दिव्यो दिव्यास्त्रशतपर्वधृक् । ऐरावतादिसर्वाशावारणो वारणप्रियः ॥ ५५॥ वज्राद्यस्त्रपरीवारो
    गणचण्डसमाश्रयः । जयाजयपरिकरो विजयाविजयावहः ॥ ५६॥ अजयार्चितपादाब्जो नित्यानन्दवनस्थितः । विलासिनीकृतोल्लासः
    शौण्डी सौन्दर्यमण्डितः ॥ ५७॥ अनन्तानन्तसुखदः सुमङ्गलसुमङ्गलः । ज्ञानाश्रयः क्रियाधार इच्छाशक्तिनिषेवितः
    ॥ ५८॥ सुभगासंश्रितपदो ललिताललिताश्रयः । कामिनीपालनः कामकामिनीकेलिलालितः ॥ ५९॥
