id: ikshvakukritamganeshastotram
category: stotram
name:
  english: ikshvakukritamganeshastotram
  devanagari: इक्ष्वाकुकृतंगणेशस्तोत्रम्
content:
  english: ikshvakukritam ganeshastotram ikshvakuruvaca | namaskritya mahadevam stoshye'ham tam vinayakam
    || 5|| mahaganapatim shuramajitam jnanavardhanam | ekadantam dvidantam ca caturdantam caturbhujam
    || 6|| tryaksham trishulahastam ca raktanetram varapradam | ambikeyam shurpakarnam pracandam ca vinayakam
    || 7|| araktam dandinam caiva vahnivaktram hutapriyam | anarcito vighnakarah sarvakaryeshu yo nrinam
    || 8|| tam namami ganadhyaksham bhimamugramumasutam | madamattam virupaksham bhaktavighnanivarakam
    || 9|| suryakotipratikasham bhinnanjanasamaprabham | buddham sunirmalam shantam namasyami vinayakam
    || 10|| namo'stu gajavaktraya gananam pataye namah | merumandararupaya namah kailasavasine || 11||
    virupaya namaste'stu namaste brahmacarine | bhaktastutaya devaya namastubhyam vinayaka || 12|| tvaya
    purana purvesham devanam karyasiddhaye | gajarupam samasthaya trasitah sarvadanavah || 13|| rishinam
    devatanam ca nayakatvam prakashitam | yatastatah surairagre pujyase tvam bhavatmaja || 14|| tvamaradhya
    ganadhyaksham sarvajnam kamarupinam | karyartham raktakusumai raktacandanavaribhih || 15|| raktambaradharo
    bhutva caturthyamarcayejjapet | trikalamekakalam va pujayenniyatashanah || 16|| rajanam rajapatram
    va rajamantrinameva va | rajyam ca sarvavighnesha vasham kuryat sarashtrakam || 17|| avighnam tapaso
    mahyam kuru naumi vinayaka | mayettham samstuto bhaktya pujitashca visheshatah || 18|| yatphalam sarvatirtheshu
    sarvayajneshu yatphalam | tatphalam purnamapnoti stutva devam vinayakam || 19|| vishamam na bhavettasya
    na ca gacchet parabhavam | na ca vighno bhavettasya jato jatismaro bhavet || 20|| ya idam pathate
    stotram shadbhirmasairvaram labhet | samvatsarena siddhim ca labhate natra samshayah || 21|| iti narasimhapurane
    25
  devanagari: इक्ष्वाकुकृतं गणेशस्तोत्रम् इक्ष्वाकुरुवाच । नमस्कृत्य महादेवं स्तोष्येऽहं तं विनायकम् ॥
    ५॥ महागणपतिं शूरमजितं ज्ञानवर्धनम् । एकदन्तं द्विदन्तं च चतुर्दन्तं चतुर्भुजम् ॥ ६॥ त्र्यक्षं त्रिशूलहस्तं
    च रक्तनेत्रं वरप्रदम् । आम्बिकेयं शूर्पकर्णं प्रचण्डं च विनायकम् ॥ ७॥ आरक्तं दण्डिनं चैव वह्निवक्त्रं
    हुतप्रियम् । अनर्चितो विघ्नकरः सर्वकार्येषु यो नृणाम् ॥ ८॥ तं नमामि गणाध्यक्षं भीममुग्रमुमासुतम् ।
    मदमत्तं विरूपाक्षं भक्तविघ्ननिवारकम् ॥ ९॥ सूर्यकोटिप्रतीकाशं भिन्नाञ्जनसमप्रभम् । बुद्धं सुनिर्मलं
    शान्तं नमस्यामि विनायकम् ॥ १०॥ नमोऽस्तु गजवक्त्राय गणानां पतये नमः । मेरुमन्दररूपाय नमः कैलासवासिने
    ॥ ११॥ विरूपाय नमस्तेऽस्तु नमस्ते ब्रह्मचारिणे । भक्तस्तुताय देवाय नमस्तुभ्यं विनायक ॥ १२॥ त्वया पुराण
    पूर्वेषां देवानां कार्यसिद्धये । गजरूपं समास्थाय त्रासिताः सर्वदानवाः ॥ १३॥ ऋषीणां देवतानां च नायकत्वं
    प्रकाशितम् । यतस्ततः सुरैरग्रे पूज्यसे त्वं भवात्मज ॥ १४॥ त्वामाराध्य गणाध्यक्षं सर्वज्ञं कामरूपिणम्
    । कार्यार्थं रक्तकुसुमै रक्तचन्दनवारिभिः ॥ १५॥ रक्ताम्बरधरो भूत्वा चतुर्थ्यामर्चयेज्जपेत् । त्रिकालमेककालं
    वा पूजयेन्नियताशनः ॥ १६॥ राजानं राजपत्रं वा राजमन्त्रिणमेव वा । राज्यं च सर्वविघ्नेश वशं कुर्यात्
    सराष्ट्रकम् ॥ १७॥ अविघ्नं तपसो मह्यं कुरु नौमि विनायक । मयेत्थं संस्तुतो भक्त्या पूजितश्च विशेषतः
    ॥ १८॥ यत्फलं सर्वतीर्थेषु सर्वयज्ञेषु यत्फलम् । तत्फलं पूर्णमाप्नोति स्तुत्वा देवं विनायकम् ॥ १९॥
    विषमं न भवेत्तस्य न च गच्छेत् पराभवम् । न च विघ्नो भवेत्तस्य जातो जातिस्मरो भवेत् ॥ २०॥ य इदं पठते
    स्तोत्रं षड्भिर्मासैर्वरं लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥ २१॥ इति नरसिंहपुराणे २५
