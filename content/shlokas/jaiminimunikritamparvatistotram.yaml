id: jaiminimunikritamparvatistotram
category: stotram
name:
  english: jaiminimunikritamparvatistotram
  devanagari: जैमिनिमुनिकृतंपार्वतीस्तोत्रम्
content:
  english: jaiminimunikritam parvatistotram 5 jaiminiruvaca | namah shivayai jagadambikayai shivapriyayai
    shivavigrahayai | samudbabhuvadripateh suta ya catushkaparda yuvatih supeshah || 134|| hiranyavarnam
    maninupuranghrim prasannavaktram shukapadmahastam | vishalanetram pranamami gaurim vacovidam vacamudirayantim
    || 135|| namami menatanayamameyamimamumam kantimatimameyam | karoti ya bhutisitau stanau dvau priyam
    sakhayam parishasvajana || 136|| kantamumam kantanibhangakantim bhantamupattanataharyajendram | nato'smi
    yaste girishasya parshve vishvani devi bhuvanani cashte || 137|| vande gaurim tungapinastanim tam
    candracudam klishtasarvangaragam | yaisha duhkhipraninamatmakantim devim devim radhase codayantim
    || 138|| enam vande dinarakshavinodam menakanyam manadanandadatrim | ya vidyanam mangalanam ca vacamesha
    netri radhasah sunritanam || 139|| samsarataporubhayapahantri bhavani bhojyabharanaikabhoge | dhiyam
    varam dehi shive nirargalam yayati vishva durita tarema || 140|| shive katham tvatsamata kva diyate
    jagatkritih kelirayam shivah patih | haristu daso'nucarindira shaci sarasvati va subhagadadirvasu
    || 141|| iti naradapurane uttarabhage trisaptatitamadhyayantargatam jaiminimunikritam parvatistotram
    samaptam | brihannaradiyapurana | uttarabhaga | adhyaya 73
  devanagari: जैमिनिमुनिकृतं पार्वतीस्तोत्रम् ५ जैमिनिरुवाच । नमः शिवायै जगदम्बिकायै शिवप्रियायै शिवविग्रहायै
    । समुद्बभूवाद्रिपतेः सुता या चतुष्कपर्दा युवतिः सुपेशाः ॥ १३४॥ हिरण्यवर्णां मणिनूपुराङ्घ्रिं प्रसन्नवक्त्रां
    शुकपद्महस्ताम् । विशालनेत्रां प्रणमामि गौरीं वचोविदं वाचमुदीरयन्तीम् ॥ १३५॥ नमामि मेनातनयाममेयामिमामुमां
    कान्तिमतीममेयाम् । करोति या भूतिसितौ स्तनौ द्वौ प्रियं सखायं परिषस्वजाना ॥ १३६॥ कान्तामुमां कान्तनिभाङ्गकान्तिं
    भान्तामुपात्तानतहर्यजेन्द्राम् । नतोऽस्मि यास्ते गिरिशस्य पार्श्वे विश्वानि देवी भुवनानि चष्टे ॥ १३७॥
    वन्दे गौरीं तुङ्गपीनस्तनीं तां चन्द्राचूडां क्लिष्टसर्वाङ्गरागाम् । यैषा दुःखिप्राणिनामात्मकान्तिं
    देवीं देवीं राधसे चोदयन्तीम् ॥ १३८॥ एनां वन्दे दीनरक्षाविनोदां मेनाकन्यां मानदानन्ददात्रीम् । या विद्यानां
    मङ्गलानां च वाचामेषा नेत्री राधसः सूनृतानाम् ॥ १३९॥ संसारतापोरुभयापहन्त्री भवानि भोज्याभरणैकभोगे ।
    धियं वरां देहि शिवे निरर्गलां ययाति विश्वा दुरिता तरेम ॥ १४०॥ शिवे कथं त्वत्समता क्व दीयते जगत्कृतिः
    केलिरयं शिवः पतिः । हरिस्तु दासोऽनुचरीन्दिरा शची सरस्वती वा सुभगाददिर्वसु ॥ १४१॥ इति नारदपुराणे उत्तरभागे
    त्रिसप्ततितमाध्यायान्तर्गतं जैमिनिमुनिकृतं पार्वतीस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । उत्तरभाग
    । अध्याय ७३
