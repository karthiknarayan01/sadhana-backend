id: markandeyakritam2vishnustotram
category: stotram
name:
  english: markandeyakritam2vishnustotram
  devanagari: मार्कण्डेयकृतं२विष्णुस्तोत्रम्
content:
  english: 20|| asheshasampurnaruciprahinopadanasankalpavivarjito'pi | dinanukampanugunam bibharshi yuge
    yuge dehamaparashakte || 21|| tvatpadapadmam jagadisha purvamasevyatanatmadhiya maya yat | tatkarmana
    darunapakabhajam dinam paritrahi kripambudhe mam || 22|| asheshalokasthitisrishtilinavilasi yatte
    trigunam vibhati | vapurmahatmanmahadadiheturhetornamaste prakriteh parasya || 23|| sarvatra gatva
    brihadaprameyam pravarddhamanam tvayi brimhitam ca | tadbahmarupam parinamahetum svadhyatmavishvatmakamashrayami
    || 24|| ekarnave mahaghore navasthatum pradeshabhuh | asti lakshmipate meghavarivataprakampanat ||
    25|| trahi vishno jagannatha magnam samsarasagare | mamuddharasmadgovinda kripapangavilokanat || 26||
    iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye tritiyadhyayantargatam markandeyakritam
    vishnustotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda | adhyaya 3
  devanagari: २०॥ अशेषसम्पूर्णरुचिप्रहीणोपादानसङ्कल्पविवर्जितोऽपि । दीनानुकम्पानुगुणं बिभर्षि युगे युगे
    देहमपारशक्ते ॥ २१॥ त्वत्पादपद्मं जगदीश पूर्वमसेव्यतानात्मधिया मया यत् । तत्कर्मणा दारुणपाकभाजं दीनं
    परित्राहि कृपाम्बुधे माम् ॥ २२॥ अशेषलोकस्थितिसृष्टिलीनविलासि यत्ते त्रिगुणं विभाति । वपुर्महात्मन्महदादिहेतुर्हेतोर्नमस्ते
    प्रकृतेः परस्य ॥ २३॥ सर्वत्र गत्वा बृहदप्रमेयं प्रवर्द्धमानं त्वयि बृंहितं च । तद्बह्मरूपं परिणामहेतुं
    स्वाध्यात्मविश्वात्मकमाश्रयामि ॥ २४॥ एकार्णवे महाघोरे नावस्थातुं प्रदेशभूः । अस्ति लक्ष्मीपते मेघवारिवातप्रकम्पनात्
    ॥ २५॥ त्राहि विष्णो जगन्नाथ मग्नं संसारसागरे । मामुद्धरास्माद्गोविन्द कृपापाङ्गविलोकनात् ॥ २६॥ इति
    श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये तृतीयाध्यायान्तर्गतं मार्कण्डेयकृतं विष्णुस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड । अध्याय ३
meaning: {}
