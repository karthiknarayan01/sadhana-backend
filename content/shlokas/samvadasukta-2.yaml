id: samvadasukta-2
category: veda
name:
  english: samvadasukta
  devanagari: सम्वादसूक्त
content:
  english: 11 na va ṷ te ta̱nva̭ ta̱nvam1̱̭ sam pa̭pricyam pa̱pama̭hu̱ryah svasa̭ram ni̱gaccha̭t | a̱nyena̱
    matpra̱muda̭h kalpayasva̱ na te̱ bhrata̭ subhage vashtye̱tat || 10
  devanagari: ११ न वा उ॑ ते त॒न्वा॑ त॒न्वं१॒॑ सं प॑पृच्यां पा॒पमा॑हु॒र्यः स्वसा॑रं नि॒गच्छा॑त् । अ॒न्येन॒
    मत्प्र॒मुदः॑ कल्पयस्व॒ न ते॒ भ्राता॑ सुभगे वष्ट्ये॒तत् ॥ १०
meaning: {}
