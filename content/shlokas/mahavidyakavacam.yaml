id: mahavidyakavacam
category: kavacha
name:
  english: mahavidyakavacam
  devanagari: महाविद्याकवचम्
content:
  english: rinudevi pravakshyami kavacam sarvasiddhidam | adyaya mahavidyayah sarvabhishtaphalapradam
    || 1|| kavacasya rishirdevi sadashiva itiritah | chando'nushtup devata ca mahavidya prakirtitah ||
    2|| dharmarthakamamokshanam viniyogashca sadhane || 3|| aimkarah patu shirshe mam kamabijam tatha
    hridi | ramabijam sadapatu nabhau guhye ca padayoh || 4|| lalate sundari patu ugra mam kanthadeshatah
    | bhagamala sarvagatre linge caitanyarupini || 5|| purve mam patu varahi brahmani dakshine tatha |
    uttare vaishnavi patu cendrani pashcime'vatu || 6|| maheshvari ca agneyam nairrite kamala tatha vayavyam
    patu kaumari camunda ishake'vatu || 7||
  devanagari: ृणुदेवि प्रवक्ष्यामि कवचं सर्वसिद्धिदम् । आद्याया महाविद्यायाः सर्वाभीष्टफलप्रदम् ॥ १॥ कवचस्य
    ऋषिर्देवी सदाशिव इतीरितः । छन्दोऽनुष्टुप् देवता च महाविद्या प्रकीर्तितः ॥ २॥ धर्मार्थकाममोक्षाणां
    विनियोगश्च साधने ॥ ३॥ ऐंकारः पातु शीर्षे मां कामबीजं तथा हृदि । रमाबीजं सदापातु नाभौ गुह्ये च पादयोः
    ॥ ४॥ ललाटे सुन्दरी पातु उग्रा मां कण्ठदेशतः । भगमाला सर्वगात्रे लिङ्गे चैतन्यरूपिणी ॥ ५॥ पूर्वे मां
    पातु वाराही ब्रह्माणी दक्षिणे तथा । उत्तरे वैष्णवी पातु चेन्द्राणी पश्चिमेऽवतु ॥ ६॥ माहेश्वरी च आग्नेयां
    नैरृते कमला तथा वायव्यां पातु कौमारी चामुण्डा ईशकेऽवतु ॥ ७॥
