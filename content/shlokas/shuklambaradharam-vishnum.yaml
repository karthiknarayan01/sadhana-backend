id: shuklambaradharam-vishnum
category: stotra
name:
  english: Shuklambaradharam Vishnum
  devanagari: शुक्लाम्बरधरं विष्णुम्
content:
  english: >-
    shuklambaradharam vishnum shashivarnam chaturbhujam, prasannavadanam
    dhyayet sarva-vighnopashantaye
  devanagari: >-
    शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत्
    सर्वविघ्नोपशान्तये ॥
meaning:
  english: >-
    I meditate on the one clad in white, all-pervading, moon-complexioned,
    four-armed, and gentle-faced — for the removal of all obstacles.
    Traditionally recited before beginning any undertaking.
source_attribution:
  text_source: Traditional Ganesha dhyana shloka, widely recited before undertakings
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
