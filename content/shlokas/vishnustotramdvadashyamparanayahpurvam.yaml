id: vishnustotramdvadashyamparanayahpurvam
category: stotram
name:
  english: vishnustotramdvadashyamparanayahpurvam
  devanagari: विष्णुस्तोत्रम्द्वादश्यांपारणायाःपूर्वम्
content:
  english: namatrayamashesheshu masi masi dinadvayam | tathaivoccarayeddadyaddvadashyam ca yavadikam |
    pranamya ca hrishikesham kritapujah prasadayet || 15|| vishno namaste jagatah prasute om vasudevaya
    namo namaste | narayana tvam pranato'smyacintya jayo'stu me shashvatapunyarasheh || 16|| prasida punyam
    jayametu vishno om vasudevarddhimupaitu punyam | narayanaom bhutimupaitu punyam prayatu casheshamagham
    vinasham || 17|| vishno punyodbhavo me'stu vasudevastu me shubham | narayanastu dharmo me jahi papamasheshatah
    || 18|| anekajanmajanitam balyayauvanavarddhike | punyam vivriddhimayatu yatu papam tu sankshayam
    || 19|| akashadishu shabdadau shrotradau mahadadishu | prakritau purushe caiva brahmanyapi ca sa prabhuh
    | yathaika eva sarvatma vasudevo vyavasthitah || 20|| tena satyena me papam narakartipradam kshayam
    | prayatu sukritasyastu mamanudivasam jayah | papasya hanih punyam ca vriddhimabhyetyanuttamam ||
    21|| evamuccarya vipraya dattva yatkathitam tava | bhunjita kritakrityastu parane gate || 22|| iti
    vishnudharmeshu caturvimsho'dhyayantargatam vishnustotram sampurnam |
  devanagari: नामत्रयमशेषेषु मासि मासि दिनद्वयम् । तथैवोच्चारयेद्दद्याद्द्वादश्यां च यवादिकम् । प्रणम्य
    च हृषीकेशं कृतपूजः प्रसादयेत् ॥ १५॥ विष्णो नमस्ते जगतः प्रसूते ॐ वासुदेवाय नमो नमस्ते । नारायण त्वां
    प्रणतोऽस्म्यचिन्त्य जयोऽस्तु मे शाश्वतपुण्यराशेः ॥ १६॥ प्रसीद पुण्यं जयमेतु विष्णो ॐ वासुदेवर्द्धिमुपैतु
    पुण्यम् । नारायणॐ भूतिमुपैतु पुण्यं प्रयातु चाशेषमघं विनाशम् ॥ १७॥ विष्णो पुण्योद्भवो मेऽस्तु वासुदेवास्तु
    मे शुभम् । नारायणास्तु धर्मो मे जहि पापमशेषतः ॥ १८॥ अनेकजन्मजनितं बाल्ययौवनवार्द्धिके । पुण्यं विवृद्धिमायातु
    यातु पापं तु सङ्क्षयम् ॥ १९॥ आकाशादिषु शब्दादौ श्रोत्रादौ महदादिषु । प्रकृतौ पुरुषे चैव ब्रह्मण्यपि
    च स प्रभुः । यथैक एव सर्वात्मा वासुदेवो व्यवस्थितः ॥ २०॥ तेन सत्येन मे पापं नरकार्तिप्रदं क्षयम् ।
    प्रयातु सुकृतस्यास्तु ममानुदिवसं जयः । पापस्य हानिः पुण्यं च वृद्धिमभ्येत्यनुत्तमाम् ॥ २१॥ एवमुच्चार्य
    विप्राय दत्त्वा यत्कथितं तव । भुञ्जीत कृतकृत्यस्तु पारणे गते ॥ २२॥ इति विष्णुधर्मेषु चतुर्विंशोऽध्यायान्तर्गतं
    विष्णुस्तोत्रं सम्पूर्णम् ।
