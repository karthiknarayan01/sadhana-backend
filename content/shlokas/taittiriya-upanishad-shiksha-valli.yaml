    । तन्मामा॑वीत् । तद्व॒क्तार॑मावीत् । आवी॒न्माम् । आवी ऽनुवाकः ॥ ॥ हरिः॑ ओम् ॥ ॥ श्री कृष्णार्पणमस्तु
