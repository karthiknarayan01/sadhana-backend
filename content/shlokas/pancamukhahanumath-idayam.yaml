id: pancamukhahanumath-idayam
category: hridaya
name:
  english: pancamukhahanumathṟidayam
  devanagari: पन्चमुखहनुमथ्ऱिदयम्
content:
  english: shripancamukha hanumat hridayam || shriganeshaya namah || || shrisitaramacandrabhyam namah
    || om asya shripancavaktra hanumat hridayastotramantrasya bhagavan shriramacandra rishih | anushtup
    chandah | shripancavaktra hanuman devata | om bijam | rudramurtaye iti shaktih | svaha kilakam | shripancavaktra
    hanumaddevata prasadasiddhyarthe jape viniyogah | iti rishyadi nyasah || om hram anjanasutaya angushthabhyam
    namah | om hrim rudramurtaye tarjanibhyam namah | om hrum vayuputraya madhyamabhyam namah | om hraim
    agnigarbhaya anamikabhyam namah | om hraum ramadutaya kanishthikabhyam namah | om hrah pancavaktrahanumate
    karatalakaraprishthabhyam namah | iti karanyasah || om hram anjanasutaya hridayaya namah | om hrim
    rudramurtaye shirase svaha | om hrum vayuputraya shikhayai vashat | om hraim agnigarbhaya kavacaya
    hum | om hraum ramadutaya netratrayaya vaushat | om hrah pancavaktrahanumate astraya phat | iti hridayadi
    shadanganyasah | om bhurbhuvah svaromiti digbandhah || atha dhyanam | dhyayedbaladivakaradyutinibham
    devaridarpapaham devendrapramukhaih prashastayashasam dedipyamanam rica || sugrivadisamastavanarayutam
    suvyaktatattvapriyam samraktarunalocanam pavanajam pitambaralankritam || iti dhyanam || om namo vayuputraya
    pancavaktraya te namah | namo'stu dirghabalaya rakshasantakaraya ca || 1|| vajradeha namastubhyam
    shatananamadapaha | sitasantoshakarana namo raghavakinkara || 2|| srishtipravartaka namo mahasthita
    namo namah | kalakashthasvarupaya masasamvatsaratmaka || 3|| namaste brahmarupaya shivarupaya te namah
    | namo vishnusvarupaya suryarupaya te namah || 4|| namo vahnisvarupaya namo gaganacarine | sarvarambhavanacara
    ashokavananashaka || 5|| namo kailasanilaya malayacala samshraya | namo ravananashaya indrajidvadhakarine
    || 6|| mahadevatmaka namo namo vayutanudbhava | namah sugrivasaciva sitasantoshakarana || 7|| samudrollanghana
    namo saumitreh pranadayaka | mahavira namastubhyam dirghabaho namonamah || 8|| dirghabala namastubhyam
    vajradeha namo namah | chayagrahahara namo varasaumyamukhekshana || 9|| sarvadevasusamsevya munisanghanamaskrita
    | arjunadhvajasamvasa krishnarjunasupujita || 10|| dharmarthakamamokshakhya purusharthapravartaka
    | brahmastrabandya bhagavan ahatasuranayaka || 11|| bhaktakalpamahabhuja bhutabetalanashaka | dushtagrahaharananta
    vasudeva namo'stute || 12|| shriramakarye catura parvatigarbhasambhava | namah pampavanacara rishyamukakritalaya
    || 13|| dhanyamalishapahara kalaneminibarhana | suvarcalaprananatha ramacandraparayana || 14|| namo
    vargasvarupaya varnaniyagunodaya | varishthaya namastubhyam vedarupa namo namah | namastubhyam namastubhyam
    bhuyo bhuyo namamyaham || 15|| iti te kathitam devi hridayam shrihanumatah | sarvasampatkaram punyam
    sarvasaukhyavivardhanam || 16|| dushtabhutagrahaharam kshayapasmaranashanam || 17|| yastvatmaniyamo
    bhaktya vayusunoh sumangalam | hridayam pathate nityam sa brahmasadrisho bhavet || 18|| ajaptam hridayam
    ya imam mantram japati manavah | sa duhkham shighramapnoti mantrasiddhirna jayate || 19|| satyam satyam
    punah satyam mantrasiddhikaram param | ittham ca kathitam purvam sambena svapriyam prati || 20|| maharshergautamatpurvam
    maya praptamidam mune | tanmaya prahitam sarvam shishyavatsalyakaranat || 21|| iti shriparasharasamhitantargate
    shriparasharamaitreyasamvade shripancamukhahanumat hridayastotram sampurnam ||
  devanagari: श्रीपञ्चमुख हनुमत् हृदयम् ॥ श्रीगणेशाय नमः ॥ ॥ श्रीसीतारामचन्द्राभ्यां नमः ॥ ॐ अस्य श्रीपञ्चवक्त्र
    हनुमत् हृदयस्तोत्रमन्त्रस्य भगवान् श्रीरामचन्द्र ऋषिः । अनुष्टुप् छन्दः । श्रीपञ्चवक्त्र हनुमान् देवता
    । ॐ बीजम् । रुद्रमूर्तये इति शक्तिः । स्वाहा कीलकम् । श्रीपञ्चवक्त्र हनुमद्देवता प्रसादसिद्ध्यर्थे
    जपे विनियोगः । इति ऋष्यादि न्यासः ॥ ॐ ह्रां अञ्जनासुताय अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं रुद्रमूर्तये
    तर्जनीभ्यां नमः । ॐ ह्रूं वायुपुत्राय मध्यमाभ्यां नमः । ॐ ह्रैं अग्निगर्भाय अनामिकाभ्यां नमः । ॐ ह्रौं
    रामदूताय कनिष्ठिकाभ्यां नमः । ॐ ह्रः पञ्चवक्त्रहनुमते करतलकरपृष्ठाभ्यां नमः । इति करन्यासः ॥ ॐ ह्रां
    अञ्जनासुताय हृदयाय नमः । ॐ ह्रीं रुद्रमूर्तये शिरसे स्वाहा । ॐ ह्रूं वायुपुत्राय शिखायै वषट् । ॐ ह्रैं
    अग्निगर्भाय कवचाय हुम् । ॐ ह्रौं रामदूताय नेत्रत्रयाय वौषट् । ॐ ह्रः पञ्चवक्त्रहनुमते अस्त्राय फट्
    । इति हृदयादि षडङ्गन्यासः । ॐ भूर्भुवः स्वरोमिति दिग्बन्धः ॥ अथ ध्यानम् । ध्यायेद्बालदिवाकरद्युतिनिभं
    देवारिदर्पापहं देवेन्द्रप्रमुखैः प्रशस्तयशसं देदीप्यमानं ऋचा ॥ सुग्रीवादिसमस्तवानरयुतं सुव्यक्ततत्त्वप्रियं
    संरक्तारुणलोचनं पवनजं पीताम्बरालङ्कृतम् ॥ इति ध्यानम् ॥ ॐ नमो वायुपुत्राय पञ्चवक्त्राय ते नमः । नमोऽस्तु
    दीर्घबालाय राक्षसान्तकराय च ॥ १॥ वज्रदेह नमस्तुभ्यं शताननमदापह । सीतासन्तोषकरण नमो राघवकिङ्कर ॥ २॥
    सृष्टिप्रवर्तक नमो महास्थित नमो नमः । कलाकाष्ठस्वरूपाय माससंवत्सरात्मक ॥ ३॥ नमस्ते ब्रह्मरूपाय शिवरूपाय
    ते नमः । नमो विष्णुस्वरूपाय सूर्यरूपाय ते नमः ॥ ४॥ नमो वह्निस्वरूपाय नमो गगनचारिणे । सर्वरम्भावनचर
    अशोकवननाशक ॥ ५॥ नमो कैलासनिलय मलयाचल संश्रय । नमो रावणनाशाय इन्द्रजिद्वधकारिणे ॥ ६॥ महादेवात्मक नमो
    नमो वायुतनूद्भव । नमः सुग्रीवसचिव सीतासन्तोषकारण ॥ ७॥ समुद्रोल्लङ्घन नमो सौमित्रेः प्राणदायक । महावीर
    नमस्तुभ्यं दीर्घबाहो नमोनमः ॥ ८॥ दीर्घबाल नमस्तुभ्यं वज्रदेह नमो नमः । छायाग्रहहर नमो वरसौम्यमुखेक्षण
    ॥ ९॥ सर्वदेवसुसंसेव्य मुनिसङ्घनमस्कृत । अर्जुनध्वजसंवास कृष्णार्जुनसुपूजित ॥ १०॥ धर्मार्थकाममोक्षाख्य
    पुरुषार्थप्रवर्तक । ब्रह्मास्त्रबन्द्य भगवन् आहतासुरनायक ॥ ११॥ भक्तकल्पमहाभुज भूतबेतालनाशक । दुष्टग्रहहरानन्त
    वासुदेव नमोऽस्तुते ॥ १२॥ श्रीरामकार्ये चतुर पार्वतीगर्भसम्भव । नमः पम्पावनचर ऋष्यमूककृतालय ॥ १३॥ धान्यमालीशापहर
    कालनेमिनिबर्हण । सुवर्चलाप्राणनाथ रामचन्द्रपरायण ॥ १४॥ नमो वर्गस्वरूपाय वर्णनीयगुणोदय । वरिष्ठाय नमस्तुभ्यं
    वेदरूप नमो नमः । नमस्तुभ्यं नमस्तुभ्यं भूयो भूयो नमाम्यहम् ॥ १५॥ इति ते कथितं देवि हृदयं श्रीहनूमतः
    । सर्वसम्पत्करं पुण्यं सर्वसौख्यविवर्धनम् ॥ १६॥ दुष्टभूतग्रहहरं क्षयापस्मारनाशनम् ॥ १७॥ यस्त्वात्मनियमो
    भक्त्या वायुसूनोः सुमङ्गलम् । हृदयं पठते नित्यं स ब्रह्मसदृशो भवेत् ॥ १८॥ अजप्तं हृदयं य इमं मन्त्रं
    जपति मानवः । स दुःखं शीघ्रमाप्नोति मन्त्रसिद्धिर्न जायते ॥ १९॥ सत्यं सत्यं पुनः सत्यं मन्त्रसिद्धिकरं
    परम् । इत्थं च कथितं पूर्वं साम्बेन स्वप्रियां प्रति ॥ २०॥ महर्षेर्गौतमात्पूर्वं मया प्राप्तमिदं मुने
    । तन्मया प्रहितं सर्वं शिष्यवात्सल्यकारणात् ॥ २१॥ इति श्रीपराशरसंहितान्तर्गते श्रीपराशरमैत्रेयसंवादे
    श्रीपञ्चमुखहनुमत् हृदयस्तोत्रं सम्पूर्णम् ॥
