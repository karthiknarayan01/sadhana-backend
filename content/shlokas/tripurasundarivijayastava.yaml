name:
  english: tripurasundarivijayastava
  devanagari: त्रिपुरसुन्दरीविजयस्तव
content:
  english: bhandabhidham haryakshadyamararthita bhagavati divyam tanumashrita | shrimata lalitetyacintya
  devanagari: भण्डाभिधं हर्यक्षाद्यमरार्थिता भगवती दिव्यां तनूमाश्रिता । श्रीमाता ललितेत्यचिन्त्य
