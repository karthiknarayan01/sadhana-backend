id: aitareya
category: upanishad
name:
  english: aitareya
  devanagari: ऐतरेय
content:
  english: aitareyopanishat van me manasi pratishthita mano me vaci pratishthitamaviravirma edhi || vedasya
    ma anisthah shrutam me ma prahasiranenadhitenahoratran sandadhamyritam vadishyami satyam vadishyami
    || tanmamavatu tadvaktaramavatvavatu mamavatu vaktaramavatu vaktaram || || om shantih shantih shantih||
    || atha aitareyopanishadi prathamadhyaye prathamah khandah || om atma va idameka evagra asinnanyatkincana
    mishat | sa ikshata lokannu srija iti || 1|| sa ima~ llokanasrijata | ambho maricirmaramapo'do'mbhah
    parena divam dyauh pratishtha'ntariksham maricayah | prithivi maro ya adhastatta apah || 2|| sa ikshateme
    nu loka lokapalannu srija iti || so'dbhya eva purusham samuddhrityamurchayat || 3|| tamabhyatapattasyabhitaptasya
    mukham nirabhidyata yatha'ndam mukhadvagvaco'gnirnasike nirabhidyetam nasikabhyam pranah | pranadvayurakshini
    nirabhidyetamakshibhyam cakshushcakshusha adityah karnau nirabhidyetam karnabhyam shrotram shrotraddishastvannirabhidyata
    tvaco lomani lomabhya oshadhivanaspatayo hridayam nirabhidyata hridayanmano manasashcandrama nabhirnirabhidyata
    nabhya apano'pananmrityuh shishnam nirabhidyata shishnadreto retasa apah || 4|| || ityaitareyopanishadi
    prathamadhyaye prathamah khandah || || atha aitareyopanishadi prathamadhyaye dvitiyah khandah || ta
    eta devatah srishta asminmahatyarnave prapatan | tamashanapipasabhyamanvavarjat | ta enamabruvannayatanam
    nah prajanihi yasminpratishthita annamadameti || 1|| tabhyo gamanayatta abruvanna vai no'yamalamiti
    | tabhyo'shvamanayatta abruvanna vai no'yamalamiti || 2|| tabhyah purushamanayatta abruvan sukritam
    bateti purusho vava sukritam | ta abravidyathayatanam pravishateti || 3|| agnirvagbhutva mukham pravishadvayuh
    prano bhutva nasike pravishadadityashcakshurbhutva'kshini pravishaddishah shrotram bhutva karnau pravishannoshadhivanaspatayo
    lomani bhutva tvacampravishamshcandrama mano bhutva hridayam pravishanmrityurapano bhutva nabhim pravishadapo
    reto bhutva shishnam pravishan || 4|| tamashanayapipase abrutamavabhyamabhiprajanihiti te abravidetasveva
    vam devatasvabhajamyetasu bhaginnyau karomiti | tasmadyasyai kasyai ca devatayai havirgrihyate bhaginyavevasyamashanayapipase
    bhavatah || 5|| || ityaitareyopanishadi prathamadhyaye dvitiyah khandah || || atha aitareyopanishadi
    prathamadhyaye tritiyah khandah || sa ikshateme nu lokashca lokapalashcannamebhyah srija iti || 1||
    so'po'bhyatapattabhyo'bhitaptabhyo murtirajayata | ya vai sa murtirajayatannam vai tat || 2|| tadenatsrishtam
    parantyajighamsattadvaca'jighrikshat tannashaknodvaca grahitum | sa yaddhainadvaca'grahaishyadabhivyahritya
    haivannamatrapsyat || 3|| tatpranenajighrikshat tannashaknotpranena grahitum sa yaddhainatpranenagrahaishyadabhipranya
    haivannamatrapsyat || 4|| taccakshusha'jighrikshat tannashaknoccakshusha grahitu
  devanagari: ऐतरेयोपनिषत् वाङ् मे मनसि प्रतिष्ठिता मनो मे वाचि प्रतिष्ठितमाविरावीर्म एधि ॥ वेदस्य म आणीस्थः
    श्रुतं मे मा प्रहासीरनेनाधीतेनाहोरात्रान् सन्दधाम्यृतं वदिष्यामि सत्यं वदिष्यामि ॥ तन्मामवतु तद्वक्तारमवत्ववतु
    मामवतु वक्तारमवतु वक्तारम् ॥ ॥ ॐ शान्तिः शान्तिः शान्तिः॥ ॥ अथ ऐतरेयोपनिषदि प्रथमाध्याये प्रथमः खण्डः
    ॥ ॐ आत्मा वा इदमेक एवाग्र आसीन्नान्यत्किञ्चन मिषत् । स ईक्षत लोकान्नु सृजा इति ॥ १॥ स इमाँ ल्लोकानसृजत
    । अम्भो मरीचीर्मरमापोऽदोऽम्भः परेण दिवं द्यौः प्रतिष्ठाऽन्तरिक्षं मरीचयः । पृथिवी मरो या अधस्तात्त
    आपः ॥ २॥ स ईक्षतेमे नु लोका लोकपालान्नु सृजा इति ॥ सोऽद्भ्य एव पुरुषं समुद्धृत्यामूर्छयत् ॥ ३॥ तमभ्यतपत्तस्याभितप्तस्य
    मुखं निरभिद्यत यथाऽण्डं मुखाद्वाग्वाचोऽग्निर्नासिके निरभिद्येतं नासिकाभ्यां प्राणः । प्राणाद्वायुरक्षिणी
    निरभिद्येतमक्षीभ्यां चक्षुश्चक्षुष आदित्यः कर्णौ निरभिद्येतां कर्णाभ्यां श्रोत्रं श्रोत्रद्दिशस्त्वङ्निरभिद्यत
    त्वचो लोमानि लोमभ्य ओषधिवनस्पतयो हृदयं निरभिद्यत हृदयान्मनो मनसश्चन्द्रमा नाभिर्निरभिद्यत नाभ्या अपानोऽपानान्मृत्युः
    शिश्नं निरभिद्यत शिश्नाद्रेतो रेतस आपः ॥ ४॥ ॥ इत्यैतरेयोपनिषदि प्रथमाध्याये प्रथमः खण्डः ॥ ॥ अथ ऐतरेयोपनिषदि
    प्रथमाध्याये द्वितीयः खण्डः ॥ ता एता देवताः सृष्टा अस्मिन्महत्यर्णवे प्रापतन् । तमशनापिपासाभ्यामन्ववार्जत्
    । ता एनमब्रुवन्नायतनं नः प्रजानीहि यस्मिन्प्रतिष्ठिता अन्नमदामेति ॥ १॥ ताभ्यो गामानयत्ता अब्रुवन्न
    वै नोऽयमलमिति । ताभ्योऽश्वमानयत्ता अब्रुवन्न वै नोऽयमलमिति ॥ २॥ ताभ्यः पुरुषमानयत्ता अब्रुवन् सुकृतं
    बतेति पुरुषो वाव सुकृतम् । ता अब्रवीद्यथायतनं प्रविशतेति ॥ ३॥ अग्निर्वाग्भूत्वा मुखं प्राविशद्वायुः
    प्राणो भूत्वा नासिके प्राविशदादित्यश्चक्षुर्भूत्वाऽक्षिणी प्राविशाद्दिशः श्रोत्रं भूत्वा कर्णौ प्राविशन्नोषधिवनस्पतयो
    लोमानि भूत्वा त्वचंप्राविशंश्चन्द्रमा मनो भूत्वा हृदयं प्राविशन्मृत्युरपानो भूत्वा नाभिं प्राविशदापो
    रेतो भूत्वा शिश्नं प्राविशन् ॥ ४॥ तमशनायापिपासे अब्रूतामावाभ्यामभिप्रजानीहीति ते अब्रवीदेतास्वेव वां
    देवतास्वाभजाम्येतासु भागिन्न्यौ करोमीति । तस्माद्यस्यै कस्यै च देवतायै हविर्गृह्यते भागिन्यावेवास्यामशनायापिपासे
    भवतः ॥ ५॥ ॥ इत्यैतरेयोपनिषदि प्रथमाध्याये द्वितीयः खण्डः ॥ ॥ अथ ऐतरेयोपनिषदि प्रथमाध्याये तृतीयः खण्डः
    ॥ स ईक्षतेमे नु लोकाश्च लोकपालाश्चान्नमेभ्यः सृजा इति ॥ १॥ सोऽपोऽभ्यतपत्ताभ्योऽभितप्ताभ्यो मूर्तिरजायत
    । या वै सा मूर्तिरजायतान्नं वै तत् ॥ २॥ तदेनत्सृष्टं पराङ्त्यजिघांसत्तद्वाचाऽजिघृक्षत् तन्नाशक्नोद्वाचा
    ग्रहीतुम् । स यद्धैनद्वाचाऽग्रहैष्यदभिव्याहृत्य हैवान्नमत्रप्स्यत् ॥ ३॥ तत्प्राणेनाजिघृक्षत् तन्नाशक्नोत्प्राणेन
    ग्रहीतुं स यद्धैनत्प्राणेनाग्रहैष्यदभिप्राण्य हैवान्नमत्रप्स्यत् ॥ ४॥ तच्चक्षुषाऽजिघृक्षत् तन्नाशक्नोच्चक्षुषा
    ग्रहीतु
