id: aruneyopanishad
category: upanishad
name:
  english: aruneyopanishad
  devanagari: आरुणेयोपनिषद्
content:
  english: upanishat || om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca sarvani
    sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    me'stu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih
    || om arunih prajapaterlokam jagama | tam gatvovaca | kena bhagavankarmanyasheshato visrijamiti |
    tam hovaca prajapatistava putranbhratrinbandhvadinchikham yajnopavitam yagam sutram svadhyayam ca
    bhurlokabhuvarlokasvarlokamaharlokajanolokatapolokasatyalokam catalatalatalavitalasutalarasatalamahatalapatalam
    brahmandam ca visrijet | dandamacchadanam caiva kaupinam ca parigrahet | shesham visrijediti || 1
    || grihastho brahmacari va vanaprastho va upavitam bhumavapsu va visrijet | alaukikagninudaragnau
    samaropayet | gayatrim ca svavacagnau samaropayet | kuticaro brahmacari kutumbam visrijet | patram
    visrijet | pavitram visrijet | danda~llokamshca visrijediti hovaca | ata urdhvamamantravadacaret |
    urdhvagamanam visrijet | aushadhavadashanamacaret | trisandhyadau snanamacaret | sandhim samadhavatmanyacaret
    | sarveshu vedeshvaranyakamavartayedupanishadamavartayedupanishadamavartayediti || 2 || khalvaham
    brahmasutram sucanatsutram brahmasutramahameva vidvamstrivritsutram tyajedvidvanya evam veda samnyastam
    maya samnyastam maya samnyastam mayeti triruktvabhayam sarvabhutebhyo mattah sarvam pravartate | sakha
    ma gopayojah sakhayo'sindrasya vajro'si vartraghnah sharma me bhava yatpapam tannivarayeti | anena
    mantrena kritam vainavam dandam kaupinam parigrahedaushadhavadashanamacaredaushadhavadashanam prashniyadyathalabhamashniyat
    | brahmacaryamahimsam caparigraham ca satyam ca yatnena he rakshate3 he rakshato3 he rakshata iti
    || 3 || athatah paramahamsaparivrajakanamasanashayanadikam bhumau brahmacarinam mritpatram va'lambupatram
    darupatram va | kamakrodhaharsharoshalobhamohadambhadarpecchasuyamamatvahankaradinapi parityajet |
    varshasu dhruvashilo'shtau masanekaki yatishcaret dvaveva va careddvaveva va carediti || 4 || sa khalvevam
    yo vidvansopanayanadurdhvametani pragva tyajet | pitaram putramagnyupavitam karma kalatram canyadapiha
    | yatayo bhikshartham gramam pravishanti panipatramudarapatram va | om hi om hi om hityetadupanishadam
    vinyaset | khalvetadupanishadam vidvanyam evam veda palasham bailvamashvatthamaudumbaram dandam maunjim
    mekhalam yajnopavitam ca tyaktva shuro ya evam veda | tadvishnoh paramam padam sada pashyanti surayah
    | diviva cakshuratatam | tadvipraso vipanyavo jagrivamsah samindhate | vishnoryatparamam padamiti
    | evam nirvananushasanam vedanushasanam vedanushasanam ityupanishad || 5 || om apyayantu mamangani
    vakpranashcakshuh shrotramatho balamindriyani ca sarvani sarvam brahmopanishadam maham brahma nirakuryam
    ma ma brahma nirakarodanirakaranamastvanirakaranam me'stu tadatmani nirate ya upanishatsu dharmaste
    mayi santu te mayi santu || om shantih shantih shantih || || iti aruneyò'panishatsamapta || adhikadhyayanaya
  devanagari: उपनिषत् ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि सर्वं
    ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेऽस्तु तदात्मनि
    निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ आरुणिः प्रजापतेर्लोकं
    जगाम । तं गत्वोवाच । केन भगवन्कर्माण्यशेषतो विसृजामीति । तं होवाच प्रजापतिस्तव पुत्रान्भ्रातॄन्बन्ध्वादीञ्छिखां
    यज्ञोपवीतं यागं सूत्रं स्वाध्यायं च भूर्लोकभुवर्लोकस्वर्लोकमहर्लोकजनोलोकतपोलोकसत्यलोकं चातलतलातलवितलसुतलरसातलमहातलपातालं
    ब्रह्माण्डं च विसृजेत् । दण्डमाच्छादनं चैव कौपीनं च परिग्रहेत् । शेषं विसृजेदिति ॥ १ ॥ गृहस्थो ब्रह्मचारी
    वा वानप्रस्थो वा उपवीतं भूमावप्सु वा विसृजेत् । अलौकिकाग्नीनुदराग्नौ समारोपयेत् । गायत्रीं च स्ववाचाग्नौ
    समारोपयेत् । कुटीचरो ब्रह्मचारी कुटुम्बं विसृजेत् । पात्रं विसृजेत् । पवित्रं विसृजेत् । दण्डाँल्लोकांश्च
    विसृजेदिति होवाच । अत उर्ध्वममन्त्रवदाचरेत् । ऊर्ध्वगमनं विसृजेत् । औषधवदशनमाचरेत् । त्रिसन्ध्यादौ
    स्नानमाचरेत् । सन्धिं समाधावात्मन्याचरेत् । सर्वेषु वेदेष्वारण्यकमावर्तयेदुपनिषदमावर्तयेदुपनिषदमावर्तयेदिति
    ॥ २ ॥ खल्वहं ब्रह्मसूत्रं सूचनात्सूत्रं ब्रह्मसूत्रमहमेव विद्वांस्त्रिवृत्सूत्रं त्यजेद्विद्वान्य
    एवं वेद संन्यस्तं मया संन्यस्तं मया संन्यस्तं मयेति त्रिरुक्त्वाभयं सर्वभूतेभ्यो मत्तः सर्वं प्रवर्तते
    । सखा मा गोपायोजः सखायोऽसीन्द्रस्य वज्रोऽसि वार्त्रघ्नः शर्म मे भव यत्पापं तन्निवारयेति । अनेन मन्त्रेण
    कृतं वैणवं दण्डं कौपीनं परिग्रहेदौषधवदशनमाचरेदौषधवदशनं प्राश्नीयाद्यथालाभमश्नीयात् । ब्रह्मचर्यमहिंसां
    चापरिग्रहं च सत्यं च यत्नेन हे रक्षते३ हे रक्षतो३ हे रक्षत इति ॥ ३ ॥ अथातः परमहंसपरिव्राजकानामासनशयनादिकं
    भूमौ ब्रह्मचारिणां मृत्पात्रं वाऽलाम्बुपात्रं दारुपात्रं वा । कामक्रोधहर्षरोषलोभमोहदम्भदर्पेच्छासूयाममत्वाहङ्कारादीनपि
    परित्यजेत् । वर्षासु ध्रुवशीलोऽष्टौ मासानेकाकी यतिश्चरेत् द्वावेव वा चरेद्द्वावेव वा चरेदिति ॥ ४ ॥
    स खल्वेवं यो विद्वान्सोपनयनादूर्ध्वमेतानि प्राग्वा त्यजेत् । पितरं पुत्रमग्न्युपवीतं कर्म कलत्रं चान्यदपीह
    । यतयो भिक्षार्थं ग्रामं प्रविशन्ति पाणिपात्रमुदरपात्रं वा । ॐ हि ॐ हि ॐ हीत्येतदुपनिषदं विन्यसेत्
    । खल्वेतदुपनिषदं विद्वान्यम् एवं वेद पालाशं बैल्वमाश्वत्थमौदुम्बरं दण्डं मौञ्जीं मेखलां यज्ञोपवीतं
    च त्यक्त्वा शूरो य एवं वेद । तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्षुराततम् । तद्विप्रासो
    विपन्यवो जागृवांसः समिन्धते । विष्णोर्यत्परमं पदमिति । एवं निर्वाणानुशासनं वेदानुशासनं वेदानुशासनम्
    इत्युपनिषद् ॥ ५ ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि सर्वं
    ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेऽस्तु तदात्मनि
    निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति आरुणेयॊऽपनिषत्समाप्ता
    ॥ अधिकाध्ययनाय
