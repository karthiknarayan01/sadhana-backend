id: kathopanishad-chapter-2-valli-3
category: stotram
name:
  english: Kathopanishad - Chapter 2, Valli 3
content:
  english: ssanatanah| tadeva shukra ntad brahma tadevamritamucyate| tasmim ssarve tadu natyeti kashcana|
    etadvai tat || mprana ejati nissritam| mahad bhayam ya~ etadviduramritaste bhavanti || || bhayadasyagnistapati
    bhayattapati suryah| bhayadindrashca vayushca mrityurdhavati pancamah || mprak sharirasya visrasah|
    tata ssargeshu lokeshu shariratvaya kalpate || ''tmani yatha svapne tatha pitriloke| yatha 'psu pariva
    dadrishe tatha gandharvaloke chayatapayoriva brahmaloke || mprithagbhavamudayastamayau ca yat| prithagutpadyamanana
    mmatva dhiro na shocati || ssattvamuttamam| sattvadadhi mahanatma mahato || avyaktattu parah purusho
    vyapako njnatva mucyate janturamritatva || na sandrishe tishthati rupamasya na cakshusha pashyati
    kashcanainam| hrida manisha manasa 'bhiklripto ya etadviduramritaste bhavanti || || yada pancavatishthante
    jnanani manasa saha| buddhishca na viceshtate tamahuh parama yo~gamiti manyante sthiramindriyadharanam|
    apramattastada bhavati yogo hi prabhavapyayau || || naiva vaca na manasa praptum shakyo na cakshusha|
    astiti bruvato || astityevopalabdhavyastattvabhavena cobhayoh| astityevopalabdhasya tattvabhavah prasidati
    || || yada sarve pramucyante kama ye 'sya hridi shritah| atha martyo 'mrito bhavatyatra brahma samashnute
    || || yada sarve prabhidyante hridayasyeha granthayah| atha martyo 'mrito bhavatyetavaddhyanushasanam
    || ncaika ca hridayasya nadyastasa mmurdhanamabhinissritaika| tayordhvamayannamritatvameti vishvannanya
    utkramane bhavanti || || angushthamatrah purusho 'ntaratma sada jananam hridaye sannivishtah| tam
    svacchariratpravrihenmunjadiveshika vi~dyacchukramamritamiti || 'tha labdhva vidyametam nca kritsnam|
    brahmaprapto virajo
  devanagari: स्सनातनः। तदेव शुक्र न्तद् ब्रह्म तदेवामृतमुच्यते। तस्मिं स्सर्वे तदु नात्येति कश्चन। एतद्वै
    तत् ॥ म्प्राण एजति निस्सृतम्। महद् भयं यँ एतद्विदुरमृतास्ते भवन्ति ॥ ॥ भयादस्याग्निस्तपति भयात्तपति
    सूर्यः। भयादिन्द्रश्च वायुश्च मृत्युर्धावति पञ्चमः ॥ म्प्राक् शरीरस्य विस्रसः। तत स्सर्गेषु लोकेषु
    शरीरत्वाय कल्पते ॥ ऽऽत्मनि यथा स्वप्ने तथा पितृलोके। यथा ऽप्सु परीव ददृशे तथा गन्धर्वलोके छायातपयोरिव
    ब्रह्मलोके ॥ म्पृथग्भावमुदयास्तमयौ च यत्। पृथगुत्पद्यमानाना म्मत्वा धीरो न शोचति ॥ स्सत्त्वमुत्तमम्।
    सत्त्वादधि महानात्मा महतो ॥ अव्यक्तात्तु परः पुरुषो व्यापको ञ्ज्ञात्वा मुच्यते जन्तुरमृतत्व ॥ न सन्दृशे
    तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम्। हृदा मनीषा मनसा ऽभिक्लृप्तो य एतद्विदुरमृतास्ते भवन्ति
    ॥ ॥ यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह। बुद्धिश्च न विचेष्टते तामाहुः परमा योँगमिति मन्यन्ते स्थिरामिन्द्रियधारणाम्।
    अप्रमत्तस्तदा भवति योगो हि प्रभवाप्ययौ ॥ ॥ नैव वाचा न मनसा प्राप्तुं शक्यो न चक्षुषा। अस्तीति ब्रुवतो
    ॥ अस्तीत्येवोपलब्धव्यस्तत्त्वभावेन चोभयोः। अस्तीत्येवोपलब्धस्य तत्त्वभावः प्रसीदति ॥ ॥ यदा सर्वे प्रमुच्यन्ते
    कामा ये ऽस्य हृदि श्रिताः। अथ मर्त्यो ऽमृतो भवत्यत्र ब्रह्म समश्नुते ॥ ॥ यदा सर्वे प्रभिद्यन्ते हृदयस्येह
    ग्रन्थयः। अथ मर्त्यो ऽमृतो भवत्येतावद्ध्यनुशासनम् ॥ ञ्चैका च हृदयस्य नाड्यस्तासा म्मूर्धानमभिनिस्सृतैका।
    तयोर्ध्वमायन्नमृतत्वमेति विष्वङ्ङन्या उत्क्रमणे भवन्ति ॥ ॥ अङ्गुष्ठमात्रः पुरुषो ऽन्तरात्मा सदा जनानां
    हृदये सन्निविष्टः। तं स्वाच्छरीरात्प्रवृहेन्मुञ्जादिवेषीका विँद्याच्छुक्रममृतमिति ॥ ऽथ लब्ध्वा विद्यामेतां
    ञ्च कृत्स्नम्। ब्रह्मप्राप्तो विरजो
