id: vemana-satakam-telugu
category: stotram
name:
  english: Vemana Satakam (Telugu)
content:
  english: talapulona galugu da daivame pròddu talaci cudanataku tatvamagunu vuṟakunda nervunuttama yogira
    vishvadabhirama vinura vema || tana virakti yanèdi dasi cetanu jikki migili vèdalaveka minukucunna
    narudi kedamukti varalèdi cèppadi vishvadabhirama vinura vema || tanadu manasuceta darkinci jyotisha
    mènta cese nanucu nènci cucu tana yadrishtamanta daiva mèṟungada vishvadabhirama vinura vema || tika
    vrasinatlenekulu pèddalu lokamandu jèppi mancu kakulatti janula kanari marmamu vishvadabhirama vinura
    vema || jnanamènna guruvu jnanahainyamu buddhi rèntinandu rimmarecunapudu rimma tèlipèneni rèndòka
    rupura vishvadabhirama vinura vema || janalamani yandru capalatmulaguvaru tèlivileka tammutèliyaleru
    kashtamaina yadavi gasilucunnaru vishvadabhirama vinura vema || janana maranamulana svapna sushuptulu
    jagamulandu nènda jagamulundu narudu jagamunanta nadubatu kadòko vishvadabhirama vinura vema || chayananòsagucètlu
    sadhuvu bodhattu ladagi darinijeri padayavaccu nattunittu datanadi povunidi rama vishvadabhirama vinura
    vema || narudèyaina leka narayanundaina tattvabaddhudaina darani naraya maranamunnadanucu madini nammagavalè
    vishvadabhirama vinura vema || dvarambandhamunaku dalupulu gadiyalu valènè notikòppugala niyatulu
    dharmamèrigi paluka dhanyundau bhuvilona vishvadabhirama vinura vema || brahmaghatamu menu pranambu
    tagagali mitracandra shikhulu netracayamu maṟiyu brahmamanaga mahimida ledaya vishvadabhirama vinura
    vema || yoginanucu gònta yogamugurcaka jagamunèllabatta campi tinucu dhanamu kòṟaku vadu tagavaducundina
    yogikadu vadè yogu vema || ardha yankanamuna kadharamainatti yòntimeda gunju nònaranilpè nintikòka
    magandè yillandrunedguru vishvadabhirama vinura vema || annadanamunaku nadhika sampadagalgi yamaraloka
    pujyudagunu miṟu annamagunu brahmamadi kanaleraya vishvadabhirama vinura vema || bòndi yèvari sòmmu
    poshimpabalumaru prana mèvari sòmmu bhaktiseya dhanamadèvarisòmmu dharmamè tana sòmmu vishvadabhirama
    vinura vema || panduvalana buttè baraga prapancamu panduvalana buttè paramu nihamu pandu melèṟingè
    brahladudilalona vishvadabhirama vinura vema yaraya dhatrijanulakèlla nònara shivuni juda nupama galadu
    manasu cadaranika mahilona judara vishvadabhirama vinura vema || tanagunamu tanaku nundaga nènayanga
    noruni gunamu nèncunu madilo dana gunamu tèliya kanyuni banigòni dushincuvadu vyarthudu vema || jalinòndaradu
    javadati kanaradu adi mulamaina atmamaṟugu poriceri pòndi purnamu nandura vishvadabhirama vinura vema
    matamu vidici cani yogikamelu jatito nèyunna nitivaladè matamubatti jati manakunta kòṟanta vishvadabhirama
    vinura vema || nivaninanu nenaninanu bhavammuna nèṟukayòkka paddhatiyaguna bhavambu dèlisi madini
    rbhavamuga ninnu ganuta paramagu vema nidhula mèttaganela mònasi velpulakunu mròkkanela kapata kalmashamulu
    kadupulo nundaga vishvadabhirama vinura vema || panca mukhamulandu bancakshari janincè panca varnamulanu
    prabalè jagamu pancamukhuni miru prastuti ceyundi vishvadabhirama vinura vema || neyi vènna kaci nidane
    yuncina beri gattipadunu pèruguriti poripori madini ponika pattumu vishvadabhirama vinura vema ||
    mantikundavanti maya sharirambu caccunènnadaina cavadatma ghatamulènniyaina gaganamòkkategada vishvadabhirama
    vinura vema || manta lohamandu mrakula shilalandu patamulandu godapratimalandu tannudèliyu kòṟakudagulada
    paramatma vishvadabhirama vinura vema || nimishamainanu madi nilci nirmalamuga linga jivaveshulanu
    ganci bhangapadaka puja madiyandu jeruta purnapadavi paramu gorina nidiceya bagu vema || dhumadula
    navritamai vyomambunakègani kaliyu nupamulu tanalo shrimincu shivuni jerunu gamadula galiyadatadu
    ghanamuga vema || pagaluduga nasaludugunu vagapudugam gorkèludugu vadi janmambul taguludugu bhogamudigina
    trigunambunu naduga mukti tèruvagu vema || pala niti kalata paramahamsa mèṟugunu niru palu nètlu nercunèmali
    lajnudaina hinudala shivu nèṟuguna vishvadabhirama vinura vema || puttu puttalede pudamini janulèlla
    putti gittaledè purvulèvaru putti gittutèlla vatti bhrantulu sumi vishvadabhirama vinura vema || parula
    vittamandu bhranti vasinayatti purushudavanilona punyamurti parula vittamaraya papasancitamagu vishvadabhirama
    vinura vema || paradhanambulakunu pranamuliccunu satyamantaleka jaradagunu dvijulamancu nintrutejamincukaledu
    vishvadabhirama vinura vema || noru palakavaccu nudi vrayagaradu vratakanna sakshi valavadanna paragaleni
    vrata bhanga patundèccu vishvadabhirama vinura vema || nijamakalla rèndu nilakanthudèṟungu nijamuladakunna
    nitidappu nijamuladunapudu ni rupamanavaccu vishvadabhirama vinura vema || dashagalarinèlla dama bandhuvu
    latandru dashayalemi nèntru takkuvaganu dashayana gama dhana dashamòkkate dasha vishvadabhirama vinura
    vema || tamasinci ceyadaga dètti karyambu vegirimpa nadiyu vishamagunu paccikayadècci padaveya phalamaune
    vishvadabhirama vinura vema || tallibiddalakunu tagavu puttincèdi dhanamu sukhamu gurcunani gadintru
    kani yèllayèdala ghana duhkhan damadi vishvadabhirama vinura vema || tallidandrulènnadagu tòli guruvulu
    parvatibhavu lilabaramagurulu kulivandra jagati gurulana drohamu vishvadabhirama vinura vema || tamasinci
    ceyadaga dètti karyambu vegirimpa nadiyu vishamagunu paccikayadècci padaveya phalamaune vishvadabhirama
    vinura vema || puttu puttalede pudamini janulèlla putti gittaledè purvulèvaru putti gittutèlla vatti
    bhrantulu sumi vishvadabhirama vinura vema || pèttipoyaleni vatti debèlu bhumi buttiremi varu gittaremi
    puttaloni cèdalu puttada gittada vishvadabhirama vinura vema || lokamandubutti lokamandè pèrigi loka
    vibhavamorvaleka janudu lokamandu janiki lobadi cèdipovunu vishvadabhirama vinura vema || madi galigina
    puja madanari mèccunu manasu nilsinanta mahitudagunu manasuleni puja matti samanamu vishvadabhirama
    vinura vema || tamunu janulemanu kòna bunuduro dani sarasi pòndina jadani rani padhambuna nadicina
    dananè dharmatmudandru tannita vema || madamu valana galugu matalu maṟipalki mruccu saddulanògi mosapucci
    kasurabènagèdu kashthundu gurudaune vishvadabhirama vinura vema || manase maya mrigamau mananemiti
    paikigani maniponika manasuna manasunu jampina manande muktigaladu mahilo vema || mantramòkati cèppi
    maṟi devatarcana cesi tamakugarunacèndinadani vedapathana cesi vèrrulai poduru vishvadabhirama vinura
    vema || mathamuloniyogi mayalanniyugosi ghatamulona nunna ghanunidèlisi mata matakuguru maruvaka tèlupura
    vishvadabhirama vinura vema || tirigi vaccuvela maralipoyèdi vela vènta deru dhanamu vantaboru tònètaku
    janunò dhanamèndu bovuno vishvadabhirama vinura vema || ashayanèdu dani gosiveyagaleka mòhabuddi valana
    munuguvaru kashivasulaina ganaboru mokshamu vishvadabhirama vinura vema || cittamanedi vere shithilamainappude
    prakriti yanèdi cèttu padunu pidapa gorkulanèdi pèddakòmmalèndunu gada vishvadabhirama vinura vema
    || bhogambula kashimpaka ragadveshambu rangudadamalo vegamè moksha padambunu raganu natandu yogirayudu
    vema || canuvarèllanu janulam janipoyina vari punya satkathalèllan vinavalè ganavalè manavalè nani
    mashulaku dèlusaguda dantyamu vema || ashayanèdi tralla nakhila janambulu kattupaducu muktiganarairi
    jnanakhadgamunanu khandimpa radòko vishvadabhirama vinura vema || atithi raka cuci yadalinci padavaici
    kathina citulagucu ganaleru karmamunaku mundu dharmamu ganaro vishvadabhirama vinura vema || tanu
    valacina davalacunu tanu valavaka yunnanènadu tavalava dilan tanadu patatopambulu tana mayalu panikiravu
    dharalona vema || matalada vaccu manasu nilvagaledu tèlupavaccu dannu tèliyaledu suriyabattavaccu
    shurudu kaledu vishvadabhirama vinura vema || tanakenadu subhikshamu tanakenadunu bhagambu tanaravayunam
    cunu tana dashakai yèllèda manasanduna jivukucundu mahilo vema || èndina ma nòkatadavini mandina nandagni
    putti yudcunu cètlan dandigala vamshamèllanu candalundòkadu putti cadupunu vema || nijamu tèlisiyunna
    sujinudanijamunè palukavalayugani parulakòraku cavakuda dinka nopadavyam palka vishvadabhirama vinura
    vema || tamunu janulemanu kòna bunuduro dani sarasi pòndina jadani rani padhambuna nadicina dananè
    dharmatmudandru tannita vema || viniyu vinakayundu kaniyu ganaka yundu talaci talapakundu tanu yogi
    manujavarulaceta manipuja gònucundu vishvadabhirama vinura vema || vènna cetabatti vivarambu tèliyaka
    ghritamu korunatti yatani bhandi tanu daivamayyu daivambu dalacunu vishvadabhirama vinura vema ||
    rupuvanka peru rudhiga nilucunu peruvanka kriyalu pènagucundu nashamaunu tudaku namarupa kriyal vishvadabhirama
    vinura vema || lobhamohamulanu prabhavamulu tappu talacina panulèlla tappi canunu tanòkati dalacina
    daivamòndagucundu vishvadabhirama vinura vema || shantame janulanu jayamunòndincunu shantamunanè guruvu
    jada tèliyu shanta bhava mahima jarcimpalemaya vishvadabhirama vinura vema || veshadharinèpudu vishvasimpagaradu
    veshadoshamulòka vidhayè yagunu rattukadè munupu ravanu veshambu vishvadabhirama vinura vema || ingalambu
    toda nila salputodanu paruni yalitoda patitutoda sarasamadutèlla cavuku mulamu vishvadabhirama vinura
    vema || aikamatyamòkka tavashyakam bèpdu dani balimi nèntayaina gudu gaddi vènta bètti kattara yenungu
    vishvadabhirama vinura vema || tamasinci ceyadagadètti karyambu vegirimpa nadiyu vishamagunu paccikayadècci
    padaveya phalamauna vishvadabhirama vinura vema || talli biddalaku tagavu puttincèdi dhanamu sukhamu
    gurcunani gadintru kaniyèlla yèdala ghana duhkhakaramadi vishvadabhirama vinura vema || dòngamatalada
    dòrukunè mokshamu cetagani paluku cetudèccu guruvupaddu kadu gunahainya madiyagu vishvadabhirama vinura
    vema || naluguru kala cotanu da dala cupucu mèlagucundi dhanyata ganaga dalacèdi yatadu niccalu gala
    matale palukucundaga dagu vema || naducuniccu natani battèmiccina vani kadupu callajesi ghanata viducu
    nadupa nera nera natadu nali muccegada vishvadabhirama vinura vema || paduguradumata padiyai dharajèllu
    nòkkadadumata yèkkadèndu vurakundu vani kurèlla nopadu vishvadabhirama vinura vema || pataka mandu
    nòppu palu ratnamula pèmpu bangarandu kurpa baruvu ganunu gani yitara lohamaina hinamu gadè vishvadabhirama
    vinura vema || jannamulanu mariyu janniyala naneka mula nònarciyunna phalamukana raka yundu niti lekunna
    matrana vishvadabhirama vinura vema || tappu paluku paliki tatota cesina kudiyuna lakshmi krungipovu
    notikunda nillu nònaraga nilucuna vishvadabhirama vinura vema || bhumi nadi yanina bhumi phakkuna
    navvu dana hinu~ juci dhanamu navvu kadana bhitu~ juci kalu~du navvunu vishvadabhirama vinura vema
    || niti jyotileka nirmalambagu nedi ètlu kalagubara madèntayaina dhanamu galigiyunna daivambu galugadu
    vishvadabhirama vinura vema || pagayudagu gopamudigina pagayudugan korkèludugu barajanmampum daguludugu
    bhedamudigina trigunamu luduganga mukti sthiramagu vema || pappuleni kudu parulakosahyame yuppuleni
    vadè yadhika baludu muppuleni vadu mòdati sujjanira vishvadabhirama vinura vema || nikkamaina manci
    nilamòkkati calu taluku bèluku ralu tattèdela caduva padyamaraya jalada yòkkati vishvadabhirama vinura
    vema || parula dattamòppi palanacesina nila svadattamunaku vinu madiyagu navani parula datta mahaparimpaga
    radu vishvadhabirama vinura vema || nijamuladu vani nindincu jagamèlla nijamu balkaradu niculakada
    nija mahatmuguda nijamadavalayura vishvadabhirama vinura vema || paduguradumata padiyai dharajèllu
    nòkkadadumata yèkkadèndu vurakundu vani kurèlla nopadu vishvadabhirama vinura vema || parula melu
    cuci palugaki valè nèppu vatti mataladu vadadhamudu atti vani bratuku tadiyela mantika vishvadhabirama
    vinura vema || bhayamantayu dehamunakè bhaya mudigina nishcayambu paramatmunake layamantayu jivunake
    jayamatmaku nanucu jagati~ jatura vema || bhumi nadi yanina bhumi phakkuna navvu dana hinu~ juci dhanamu
    navvu kadana bhitu~ juci kalu~du navvunu vishvadabhirama vinura vema || matajèppa vinani manujudu
    murkhudu mata vinna narudu manudagunu mata vinaga jèppa manuta kudadu vishvadabhirama vinura vema
    || manasu tèlisi yòkani mataku braticèppa santasincu natadu calamèccu manasu dèliyakunnadaniyucu nanunedo
    vishvadabhirama vinura vema || alimatalu vini annadammula rosi verepovuvadu vèrrivadu kukkatoka patti
    godaridina vishvadabhirama vinura vema || jnaniyainavani manaka pujincu manujudèppudu paramunanu mudambu
    sukhamunanducundusurulu mèccaga vishvadabhirama vinura vema || hani kalugabodu harimadi nèncèdu vani
    kabdu paramu vasudhayandu puni nishthamiri pòdalaka yundumu vishvarabhirama vinura vema || alpudèppudu
    paluku nadambaramuganu sajjanundu paluku callaganu kancu moginatlu kanakambu moguna vishvadabhirama
    vinura vema || nyayashastra maraya nanyayamuna dincu dharmashastra mòsagu rugmatambu jyotishamu janamula
    nitula dappincu vishvadabhirama vinura vema || devudanaga vere deshamundunnadè dehitoda nèpudu dehamandè
    vahanamulanèkki padidolucunnadu vishvadabhirama vinura vema || bhumilona buttu bhusaramèllanu tanuvulona
    buttu tattvamèlla shramalona buttu sarvambu tanaunu vishvadabhirama vinura vema || vratakantè hèccu
    paramidu daivambu cetakantè hèccu vrata ledu vrata kajudu karta cetaku dakarta vishvadabhirama vinura
    vema || cippalonabadda cinuku mutyambayyè nita badda cinuku nita galisè brapti galugu cota phalamela
    tappura vishvadabhirama vinura vema || inti intilonanishvarudundaga nanti cudaleka yadavulandu nunta
    metancunundura jogulai vishvadabhirama vinura vema || cittashuddhi kaligicesina punyambu kòncèmaina
    nadiyu kòdavagadu vittanambu marri vrikshambunaku nènto vishvadabhirama vinura vema || agnibana mesi
    yambudhi ninkincu ramudavali kega raka nilici cètlu girulu tècci setuvu gattada vishvadabhirama vinura
    vema || aidu vellu balimi hastambu paniceyu nam dòkandu vidda pòndu cèdunu sviyudòkadu vidina jèdukada
    panibalmi vishvadabhirama vinura vema || atmabuddhi valana nakhilamba tanayyè jivabuddhi valana jivudayyè
    mohabuddhilayamu mundara ganugònu vishvadabhirama vinura vema || gunamulogalavani kulamèncaganela
    gunamu kaligèneni kotiseyu ganamuleka yunna guddigavvayuledu vishvadabhirama vinura vema || tallitandrulandu
    dayaleni putrundu puttanemi puttaloni cèdalu puttada gittada vishvadabhirama vinura vema || kopamuna
    ghanata kòncèmaipovunu kopamunanu gunamu kòratapadunu kopamanacaneni korikalideru vishvadabhirama
    vinura vema || èlugu tolu tècci edadi yutikina nalupu nalupekani tèlupukadu kòyyabòmma tècci kòttite
    guniyonè vishvadabhirama vinura vema || alpabuddhivanikadhikaramiccina dòddavarinèlla tòlagagòttu
    cèppudinèdu kukka cèraku tipèruguna vishvadabhirama vinura vema || pattupattaradu pattividuvaradu
    pattèneni bigiya pattavalayu pattuvidutakanna padicaccutemelu vishvadabhirama vinura vema || tummacèttu
    mundla todaneputtunu vittulònanundu vèdalunatlu murkhunakunu buddhi munduga buttanu vishvadabhirama
    vinura vema || kapati veshamuni kadagandlu padanela vipina bhumi tirigi visuganela yupamutone mukti
    unnadi cudara vishvadabhi rama vinura vema || || anuvugani cota adhikulamanaradu kòncèmundutèlla kòduvakadu
    kònda yaddamandu kòncamai undada vishvadabhirama vinura vema || manasulonunna marmamanta èrigi sthiramu
    cesi atma tetaparici ghatamu nilpavalayu ghanatalinketiki vishvadabhi ramavinura vema || kadalaniyakunda
    gattiga lingambu kattiveyanemi ghanata kalugu bhavamandu shivuni bhavinci kanara vishvadabhirama vinura
    vema || meka jankabèttimèlagucu mandalo bramani tirugu gòlla pagidiganu devunèrugaka paradavetala
    dalacu vishvadabhirama vinura vema || tana kula gotramu lakriti tana sampada kalimi balimi tanakelanaya
    tana vèntaravu nijamidi tana satyame toduvaccu tanato vishvadabhirama vinura vema || kalimigalganemi
    karuna lekundina kalimi tagunè dushtakarmulakunu tenègurpaniga tèruvuna bovada vishvadabhirama vinura
    vema || èndina manòkatadavini mandina nandagni putti yudcunu cètlan dandigala vamshamèllanu candalundòkadu
    putti caduvunu vema || kanulu povuvadu kallu poyinavadu ubhayularayugudi yundinatlu peda peda gudi
    pènagòni yundunu vishvadabhirama vinura vema || mataladu galgu marmamulèrigina pinnapèddatanamu lènnavaladu
    pinnaceti divvè pèddaga vèlagada vishvadhabhirama vinura vema || kòndamuccu pèndliki koti perantalu
    mòndi vani hitudu bandavadu dundagidunakunu kòndèdu dalavayi vishvadabhirama vinura vema || jhushamu
    niru vèdala jaccute siddhamu nitanundaneni nikkipadunu andatòlugu nèdala nandara pani atle vishvadabhi
    rama vinura vema || talliyedva vinaka tanayalu vagacina jalipadèdu vadu jadudu summi taratamya mèruganerani
    pashuvadi vishvadabhirama vinura vema || parulamelu cusi palukaki valè vattimataladu vadu adhamudu
    attivani batukutadi ela mantika vishvadabhirama vinura vema || gangi govupalu garitadainanu calu kadavèdainanu
    nemi kharamupalu bhaktikalgukudu pattèdainanu calu vishvadabhirama vinura vema || cikkiyunnavela simhambunainanu
    bakka kukkayaina badhaseyu balimileni vela pantamulu cèllavu vishvadabhirama vinura vema || panasatònalakanna
    pancadaralakanna juntitenèkanna junnukanna cèṟuku rasamukanna cèlula matalè tipi vishvadabhirama vinura
    vema || nindunadulu paru nilaci gambhiramai vèṟrivagu paṟu vegabòrli alpudaduriti nadhikundu naduna
    vishvadabhirama vinura vema || uppulenikura yòppadu ruculaku pappuleni tindi phalamuledu appulenivadè
    yadhika sampannudu vishvadabhirama vinura vema || pasula vannè veru palèlla òkkati pushpajati veru
    puja òkati darshanambularu daivambu òkkati vishvadabhirama vinura vema || campadagina shatrivu tanaceta
    cikkèneni kidu ceyaradu pòsaga melu cesi pòmmanute melu vishvadabhirama vinura vema || apadagala vela
    arasi bandhuvu judu bhayamu vela judu bantutanamu pedavela judu pèndlamu gunamu vishvadabhirama vinura
    vema || uppu kappurambu òkka polikanundu cuda cuda rucula jada veru purushulandu punya purushulu veraya
    vishvadabhirama vinura vema || atma shuddi leni yacaramadiyela bhandashuddi leni paka mela cittashuddileni
    shivapujalelara vishvadabhirama vinura vema || yinumu viraganeni yinumuru mummaru kaciyètakavaccu
    gramamu ganu manasu virigèneni mari cercaradaya vishvadabhirama vinura vema || kunda kumbhamanna kònda
    parvatamanna nuppu lavanamanna nòkati kadè bhasha littè veru paratatvamòkatè vishvadabhirama vinura
    vema || anaga nanaga raga matisha yillucunundu dinaga dinaga vemu tiyyanundu sadhanamuna panulu samakuru
    dharalona vishvadabhirama vinura vema || cèppuloni rayi cèviloni joriga kantiloni nalusu kali mullu
    intiloni poru nintinta gadaya vishvadabhirama vinura vema || tappu lènnuvaru tandopa tandambu lurvi
    janulakèlla nundu tappu tappu lènnuvaru tama tappulèrugaru vishvadabhirama vinura vema || mirapa ginja
    cuda mida nallaganundu kòriki judalona jurukumanunu sajjanu lagu vari sara mitlundu vishvadabhirama
    vinura vema || medipandu cuda melimai yundunu pòttavicci cuda purugulundu pirikivani madini binkamilagura
    vishvadabhirama vinura vema || veru purugu ceri vrikshambu jèrucunu cidapurugu ceri cèttu jèracu kutsitundu
    ceri gunavantu jèracura vishvadabhirama vinura vema || veshabhasha lèrigi kashayavastramul gattaganè
    mukti galugabodu talalu bodulrina talapulu bodula vishvadabhirama vinura vema
  devanagari: तलपुलोन गलुगु दा दैवमे प्रॊद्दु तलचि चूडनतकु तत्वमगुनु वूऱकुण्ड नेर्वुनुत्तम योगिरा विश्वदाभिराम
    विनुर वेम ॥ तन विरक्ति यनॆडि दासि चेतनु जिक्कि मिगिलि वॆडलवेक मिणुकुचुन्न नरुडि केडमुक्ति वरलॆडि चॆप्पडी
    विश्वदाभिराम विनुर वेम ॥ तनदु मनसुचेत दर्किञ्चि ज्योतिष मॆन्त चेसे ननुचु नॆञ्चि चूचु तन यदृष्टमन्त
    दैव मॆऱुङ्गडा विश्वदाभिराम विनुर वेम ॥ टीक व्रासिनट्लेनेकुलु पॆद्दलु लोकमन्दु जॆप्पि मञ्चु काकुलट्टि
    जनुल कानरी मर्ममु विश्वदाभिराम विनुर वेम ॥ ज्ञानमॆन्न गुरुवु ज्ञानहैन्यमु बुद्धि रॆण्टिनन्दु रिम्मरेचुनपुडु
    रिम्म तॆलिपॆनेनि रॆण्डॊक रूपुरा विश्वदाभिराम विनुर वेम ॥ जाणलमनि यन्द्रु चपलात्मुलगुवारु तॆलिविलेक
    तम्मुतॆलियलेरु कष्टमैन यडवि गासीलुचुन्नारु विश्वदाभिराम विनुर वेम ॥ जनन मरणमुलन स्वप्न सुषुप्तुलु
    जगमुलन्दु नॆण्ड जगमुलुण्डु नरुडु जगमुनण्ट नडुबाटु कादॊको विश्वदाभिराम विनुर वेम ॥ छायननॊसगुचॆट्लु
    साधुवु बोधट्टु लडगि दरिनिजेरि पडयवच्चु नट्टुनिट्टु दाटनदि पोवुनिदि राम विश्वदाभिराम विनुर वेम ॥ नरुडॆयैन
    लेक नारायणुण्डैन तत्त्वबद्धुडैन दरणि नरय मरणमुन्नदनुचु मदिनि नम्मगवलॆ विश्वदाभिराम विनुर वेम ॥ द्वारम्बन्धमुनकु
    दलुपुलु गडियलु वलॆनॆ नोटिकॊप्पुगल नियतुलु धर्ममॆरिगि पलुक धन्युण्डौ भुविलोन विश्वदाभिराम विनुर वेम
    ॥ ब्रह्मघटमु मेनु प्राणम्बु तगगालि मित्रचन्द्र शिखुलु नेत्रचयमु मऱियु ब्रह्ममनग महिमीद लेदया विश्वदाभिराम
    विनुर वेम ॥ योगिननुचु गॊन्त योगमुगूर्चक जगमुनॆल्लबट्ट चम्पि तिनुचु धनमु कॊऱकु वाडु तगवाडुचुण्डिन योगिकाडु
    वाडॆ योगु वेम ॥ अर्ध यङ्कणमुन काधारमैनट्टि यॊण्टिमेड गुञ्जु नॊनरनिल्पॆ निण्टिकॊक मगण्डॆ यिल्लाण्ड्रुनेद्गुरु
    विश्वदाभिराम विनुर वेम ॥ अन्नदानमुनकु नधिक सम्पदगल्गि यमरलोक पूज्युडगुनु मीऱु अन्नमगुनु ब्रह्ममदि
    कनलेरया विश्वदाभिराम विनुर वेम ॥ बॊन्दि यॆवरि सॊम्मु पोषिम्पबलुमारु प्राण मॆवरि सॊम्मु भक्तिसेय धनमदॆवरिसॊम्मु
    धर्ममॆ तन सॊम्मु विश्वदाभिराम विनुर वेम ॥ पण्डुवलन बुट्टॆ बरग प्रपञ्चमु पण्डुवलन बुट्टॆ परमु निहमु
    पण्डु मेलॆऱिङ्गॆ ब्रह्लादुडिललोन विश्वदाभिराम विनुर वेम यरय धात्रिजनुलकॆल्ल नॊनर शिवुनि जूड नुपम गलदु
    मनसु चदरनीक महिलोन जूडरा विश्वदाभिराम विनुर वेम ॥ तनगुणमु तनकु नुण्डग नॆनयङ्गा नोरुनि गुणमु नॆञ्चुनु
    मदिलो दन गुणमु तॆलिय कन्युनि बनिगॊनि दूषिञ्चुवाडु व्यर्थुडु वेम ॥ जालिनॊन्दरादु जवदाटि कनरादु अदि
    मूलमैन आत्ममऱुगु पोरिचेरि पॊन्दि पूर्णमु नन्दुरा विश्वदाभिराम विनुर वेम मतमु विडिचि चनि योगिकामेलु
    जातितो नॆयुन्न नीतिवलदॆ मतमुबट्टि जाति मानकुण्ट कॊऱन्त विश्वदाभिराम विनुर वेम ॥ नीवनिननु नेननिननु
    भावम्मुन नॆऱुकयॊक्क पद्धतियगुना भावम्बु दॆलिसि मदिनि र्भावमुगा निन्नु गनुट परमगु वेम निधुल मॆट्टगनेल
    मॊनसि वेल्पुलकुनु म्रॊक्कनेल कपट कल्मषमुलु कडुपुलो नुण्डगा विश्वदाभिराम विनुर वेम ॥ पञ्च मुखमुलन्दु
    बञ्चाक्षरि जनिञ्चॆ पञ्च वर्णमुलनु प्रबलॆ जगमु पञ्चमुखुनि मीरु प्रस्तुति चेयुण्डी विश्वदाभिराम विनुर
    वेम ॥ नेयि वॆन्न काचि नीडने युञ्चिन बेरि गट्टिपडुनु पॆरुगुरीति पोरिपोरि मदिनि पोनीक पट्टुमु विश्वदाभिराम
    विनुर वेम ॥ मण्टिकुण्डवण्टि माय शरीरम्बु चच्चुनॆन्नडैन चावदात्म घटमुलॆन्नियैन गगनमॊक्कटेगदा विश्वदाभिराम
    विनुर वेम ॥ मण्ट लोहमन्दु म्राकुल शिललन्दु पटमुलन्दु गोडप्रतिमलन्दु तन्नुदॆलियु कॊऱकुदगुलदा परमात्म
    विश्वदाभिराम विनुर वेम ॥ निमिषमैननु मदि निल्चि निर्मलमुग लिङ्ग जीवावेशुलनु गाञ्चि भङ्गपडक पूज मदियन्दु
    जेरुट पूर्णपदवि परमु गोरिन निदिचेय बागु वेम ॥ धूमादुल नावृतमै व्योमम्बुनकॆगनि कलियु नुपमुलु तनलो श्रीमिञ्चु
    शिवुनि जेरुनु गामादुल गलियडतडु घनमुग वेम ॥ पगलुडुग नासलुडुगुनु वगपुडुगं गोर्कॆलुडुगु वडि जन्मम्बुल्
    तगुलुडुगु भोगमुडिगिन त्रिगुणम्बुनु नडुग मुक्ति तॆरुवगु वेम ॥ पाल नीटि कलत परमहंस मॆऱुगुनु नीरु पालु
    नॆट्लु नेर्चुनॆमलि लज्ञुडैन हीनुडल शिवु नॆऱुगुना विश्वदाभिराम विनुर वेम ॥ पुट्टु पुट्टलेदे पुडमिनि
    जनुलॆल्ल पुट्टि गिट्टलेदॆ पूर्वुलॆवरु पुट्टि गिट्टुटॆल्ल वट्टि भ्रान्तुलु सुमी विश्वदाभिराम विनुर
    वेम ॥ परुल वित्तमन्दु भ्रान्ति वासिनयट्टि पुरुषुडवनिलोन पुण्यमूर्ति परुल वित्तमरय पापसञ्चितमगु विश्वदाभिराम
    विनुर वेम ॥ परधनम्बुलकुनु प्राणमुलिच्चुनु सत्यमन्तलेक जारडगुनु द्विजुलमञ्चु निन्त्रुतेजमिञ्चुकलेदु
    विश्वदाभिराम विनुर वेम ॥ नोरु पलकवच्चु नुडि व्रायगरादु व्रातकन्न साक्षि वलवदन्न परगलेनि व्रात भङ्ग
    पाटुन्दॆच्चु विश्वदाभिराम विनुर वेम ॥ निजमाकल्ल रॆण्डु नीलकण्ठुडॆऱुङ्गु निजमुलाडकुन्न नीतिदप्पु निजमुलाडुनपुडु
    नी रूपमनवच्चु विश्वदाभिराम विनुर वेम ॥ दशगलारिनॆल्ल दम बन्धुवु लटण्ड्रु दशयलेमि नॆन्त्रु तक्कुवगनु
    दशयन गम धन दशमॊक्कटे दश विश्वदाभिराम विनुर वेम ॥ तामसिञ्चि चेयदग दॆट्टि कार्यम्बु वेगिरिम्प नदियु
    विषमगुनु पच्चिकायदॆच्चि पडवेय फलमौने विश्वदाभिराम विनुर वेम ॥ तल्लिबिड्डलकुनु तगवु पुट्टिञ्चॆडि धनमु
    सुखमु गूर्चुननि गडिन्त्रु कानि यॆल्लयॆडल घन दुःखन् दमदि विश्वदाभिराम विनुर वेम ॥ तल्लिदण्ड्रुलॆन्नदगु
    तॊलि गुरुवुलु पार्वतीभवु लिलबरमगुरुलु कूलिवाण्ड्र जगति गुरुलन द्रोहमु विश्वदाभिराम विनुर वेम ॥ तामसिञ्चि
    चेयदग दॆट्टि कार्यम्बु वेगिरिम्प नदियु विषमगुनु पच्चिकायदॆच्चि पडवेय फलमौने विश्वदाभिराम विनुर वेम
    ॥ पुट्टु पुट्टलेदे पुडमिनि जनुलॆल्ल पुट्टि गिट्टलेदॆ पूर्वुलॆवरु पुट्टि गिट्टुटॆल्ल वट्टि भ्रान्तुलु
    सुमी विश्वदाभिराम विनुर वेम ॥ पॆट्टिपोयलेनि वट्टि देबॆलु भूमि बुट्टिरेमि वारु गिट्टरेमि पुट्टलोनि
    चॆदलु पुट्टदा गिट्टदा विश्वदाभिराम विनुर वेम ॥ लोकमन्दुबुट्टि लोकमन्दॆ पॆरिगि लोक विभवमोर्वलेक जनुडु
    लोकमन्दु जनिकि लोबडि चॆडिपोवुनु विश्वदाभिराम विनुर वेम ॥ मदि गलिगिन पूज मदनारि मॆच्चुनु मनसु निल्सिनन्त
    महितुडगुनु मनसुलेनि पूज मट्टि समानमु विश्वदाभिराम विनुर वेम ॥ तामुनु जनुलेमनु कॊन बूनुदुरो दानि सरसि
    पॊन्दिन जडनी रानि पधम्बुन नडिचिन दाननॆ धर्मात्मुडण्ड्रु तन्निट वेम ॥ मदमु वलन गलुगु माटलु मऱिपल्कि
    म्रुच्चु सद्दुलनॊगि मोसपुच्चि कासुराबॆनगॆडु कष्ठुण्डु गुरुडौने विश्वदाभिराम विनुर वेम ॥ मनसे माया
    मृगमौ मननेमिटि पैकिगानी मणिपोनीका मनसुन मनसुनु जम्पिन मनन्दे मुक्तिगलदु महिलो वेम ॥ मन्त्रमॊकटि चॆप्पि
    मऱि देवतार्चन चेसि तमकुगरुणचॆन्दिनदनि वेदपठन चेसि वॆर्रुलै पोदुरु विश्वदाभिराम विनुर वेम ॥ मठमुलोनियोगि
    मायलन्नियुगोसि घटमुलोन नुन्न घनुनिदॆलिसि माट माटकुगुरु मरुवक तॆलुपुरा विश्वदाभिराम विनुर वेम ॥ तिरिगि
    वच्चुवेल मरलिपोयॆडि वेल वॆण्ट देरु धनमु वण्टबोरु तॊनॆटकु जनुनॊ धनमॆन्दु बोवुनो विश्वदाभिराम विनुर
    वेम ॥ आशयनॆडु दानि गोसिवेयगालेक मॊहबुद्दि वलन मुनुगुवारु काशिवासुलैन गनबोरु मोक्षमु विश्वदाभिराम विनुर
    वेम ॥ चित्तमनेडि वेरे शिथिलमैनप्पुडे प्रकृति यनॆडि चॆट्टु पडुनु पिदप गोर्कुलनॆडि पॆद्दकॊम्मलॆण्डुनु
    गदा विश्वदाभिराम विनुर वेम ॥ भोगम्बुल काशिम्पक रागद्वेषम्बु रङ्गुडदमलो वेगमॆ मोक्ष पदम्बुनु रागनु
    नातण्डु योगिरायुडु वेम ॥ चनुवारॆल्लनु जनुलं जनिपोयिन वारि पुण्य सत्कथलॆल्लन् विनवलॆ गनवलॆ मनवलॆ ननि
    मषुलकु दॆलुसगूड दन्त्यमु वेम ॥ आशयनॆडि त्राल्ल नखिल जनम्बुलु कट्टुपडुचु मुक्तिगानरैरि ज्ञानखड्गमुननु
    खण्डिम्प रादॊको विश्वदाभिराम विनुर वेम ॥ अतिथि राक चूचि यदलिञ्चि पडवैचि कठिन चितुलगुचु गानलेरु कर्ममुनकु
    मुन्दु धर्ममु गानरो विश्वदाभिराम विनुर वेम ॥ तनु वलचिन दावलचुनु तनु वलवक युन्ननॆनडु तावलव डिलन् तनदु
    पटाटोपम्बुलु तन मायलु पनिकिरावु धरलोन वेम ॥ माटलाड वच्चु मनसु निल्वगलेदु तॆलुपवच्चु दन्नु तॆलियलेदु
    सुरियबट्टवच्चु शूरुडु कालेडु विश्वदाभिराम विनुर वेम ॥ तनकेनाडु सुभिक्षमु तनकेनाडुनु भगम्बु तनरवयुनं
    चुनु तन दशकै यॆल्लॆड मनसन्दुन जिवुकुचुण्डु महिलो वेम ॥ ऎण्डिन मा नॊकटडविनि मण्डिन नन्दग्नि पुट्टि
    यूड्चुनु चॆट्लन् दण्डिगल वंशमॆल्लनु चण्डालुण्डॊकडु पुट्टि चदुपुनु वेम ॥ निजमु तॆलिसियुन्न सुजिनुडानिजमुनॆ
    पलुकवलयुगानि परुलकॊरकु चावकूड दिङ्क नोपदव्यं पल्क विश्वदाभिराम विनुर वेम ॥ तामुनु जनुलेमनु कॊन बूनुदुरो
    दानि सरसि पॊन्दिन जडनी रानि पधम्बुन नडिचिन दाननॆ धर्मात्मुडण्ड्रु तन्निट वेम ॥ विनियु विनकयुण्डु कनियु
    गनक युण्डु तलचि तलपकुण्डु तानु योगि मनुजवरुलचेत मणिपूज गॊनुचुण्डु विश्वदाभिराम विनुर वेम ॥ वॆन्न चेतबट्टि
    विवरम्बु तॆलियक घृतमु कोरुनट्टि यतनि भण्डि तानु दैवमय्यु दैवम्बु दलचुनु विश्वदाभिराम विनुर वेम ॥ रूपुवङ्क
    पेरु रूढिगा निलुचुनु पेरुवङ्क क्रियलु पॆनगुचुण्डु नाशमौनु तुदकु नामरूप क्रियल् विश्वदाभिराम विनुर
    वेम ॥ लोभमोहमुलनु प्राभवमुलु तप्पु तलचिन पनुलॆल्ल तप्पि चनुनु तानॊकटि दलचिन दैवमॊण्डगुचुण्डु विश्वदाभिराम
    विनुर वेम ॥ शान्तमे जनुलनु जयमुनॊन्दिञ्चुनु शान्तमुननॆ गुरुवु जाड तॆलियु शान्त भाव महिम जर्चिम्पलेमया
    विश्वदाभिराम विनुर वेम ॥ वेषधारिनॆपुडु विश्वसिम्पगरादु वेषदोषमुलॊक विधयॆ यगुनु रट्टुकादॆ मुनुपु रावणु
    वेषम्बु विश्वदाभिराम विनुर वेम ॥ इङ्गलम्बु तोड निल सल्पुतोडनु परुनि यालितोड पतितुतोड सरसमाडुटॆल्ल
    चावुकु मूलमु विश्वदाभिराम विनुर वेम ॥ ऐकमत्यमॊक्क टावश्यकं बॆप्डु दानि बलिमि नॆन्तयैन गूडु गड्डि वॆण्ट
    बॆट्टि कट्टरा येनुङ्गु विश्वदाभिराम विनुर वेम ॥ तामसिञ्चि चेयदगदॆट्टि कार्यम्बु वेगिरिम्प नदियु विषमगुनु
    पच्चिकायदॆच्चि पडवेय फलमौना विश्वदाभिराम विनुर वेम ॥ तल्ली बिड्डलकु तगवु पुट्टिञ्चॆडि धनमु सुखमु गूर्चुननि
    गडिन्त्रु कानीयॆल्ल यॆडल घन दुःखकरमदि विश्वदाभिराम विनुर वेम ॥ दॊङ्गमाटलाड दॊरुकुनॆ मोक्षमु चेतगानि
    पलुकु चेटुदॆच्चु गुरुवुपद्दु कादु गुनहैन्य मदियगु विश्वदाभिराम विनुर वेम ॥ नलुगुरु कल चोटनु दा दल
    चूपुचु मॆलगुचुण्डि धन्यात गनगा दलचॆडि यातडु निच्चलु गल माटले पलुकुचुण्डगा दगु वेम ॥ नडुचुनिच्चु नतनि
    बत्तॆमिच्चिन वानि कडुपु चल्लजेसि घनत विडुचु नडुप नेर नेर नतडु नालि मुच्चेगदा विश्वदाभिराम विनुर वेम
    ॥ पदुगुराडुमाट पाडियै धरजॆल्लु नॊक्कडाडुमाट यॆक्कदॆन्दु वूरकुण्डु वानि कूरॆल्ल नोपदु विश्वदाभिराम
    विनुर वेम ॥ पतक मन्दु नॊप्पु पलु रत्नमुल पॆम्पु बङ्गरन्दु कूर्प बरुवु गनुनु गानि यितर लोहमैन हीनमु
    गादॆ विश्वदाभिराम विनुर वेम ॥ जन्नमुलनु मरियु जन्नियल ननेक मुल नॊनर्चियुन्न फलमुकान राक युण्डु नीति
    लेकुन्न मात्रान विश्वदाभिराम विनुर वेम ॥ तप्पु पलुकु पलिकि तातोट चेसिन कूडियुन लक्ष्मी क्रुङ्गिपोवु
    नोटिकुण्ड नील्लु नॊनरगा निलुचुना विश्वदाभिराम विनुर वेम ॥ भूमि नादि यनिन भूमि फक्कुन नव्वु दान हीनुँ
    जूचि धनमु नव्वु कदन भीतुँ जूचि कालुँडु नव्वुनु विश्वदाभिराम विनुर वेम ॥ नीति ज्योतिलेक निर्मलम्बगु
    नेदि ऎट्लु कलगुबर मदॆन्तयैन धनमु गलिगियुन्न दैवम्बु गलुगदु विश्वदाभिराम विनुर वेम ॥ पगयुडगु गोपमुडिगिन
    पगयुडुगन् कोर्कॆलुडुगु बरजन्मम्पुं दगुलुडुगु भेदमुडिगिन त्रिगुणमु लुडुगङ्ग मुक्ति स्थिरमगु वेम ॥ पप्पुलेनि
    कूडु परुलकोसह्यमे युप्पुलेनि वाडॆ यधिक बलुडु मुप्पुलेनि वाडु मॊदटि सुज्जानिरा विश्वदाभिराम विनुर वेम
    ॥ निक्कमैन मञ्चि नीलमॊक्कटि चालु तलुकु बॆलुकु रालु तट्टॆडेल चदुव पद्यमरय जालदा यॊक्कटि विश्वदाभिराम
    विनुर वेम ॥ परुल दत्तमॊप्पि पालनचेसिन निल स्वदत्तमुनकु विनु मडियगु नवनि परुल दत्त महपरिम्पग रादु विश्वधाबिराम
    विनुर वेम ॥ निजमुलाडु वानि निन्दिञ्चु जगमॆल्ल निजमु बल्करादु नीचुलकड निज महात्मुगूड निजमाडवलयुरा विश्वदाभिराम
    विनुर वेम ॥ पदुगुराडुमाट पाडियै धरजॆल्लु नॊक्कडाडुमाट यॆक्कदॆन्दु वूरकुण्डु वानि कूरॆल्ल नोपदु विश्वदाभिराम
    विनुर वेम ॥ परुल मेलु चूचि पलुगाकि वलॆ नॆप्पु वट्टि माटलाडु वाडधमुडु अट्टि वानि ब्रतुकु टदियेल मण्टिका
    विश्वधाबिराम विनुर वेम ॥ भयमन्तयु देहमुनकॆ भय मुडिगिन निश्चयम्बु परमात्मुनके लयमन्तयु जीवुनके जयमात्मकु
    ननुचु जगतिँ जाटुर वेम ॥ भूमि नादि यनिन भूमि फक्कुन नव्वु दान हीनुँ जूचि धनमु नव्वु कदन भीतुँ जूचि
    कालुँडु नव्वुनु विश्वदाभिराम विनुर वेम ॥ माटजॆप्प विननि मनुजुडु मूर्खुडु माट विन्न नरुडु मानुडगुनु
    माट विनग जॆप्प मानुट कूडदु विश्वदाभिराम विनुर वेम ॥ मनसु तॆलिसि यॊकनि माटकु ब्रतिचॆप्प सन्तसिञ्चु
    नतडु चालमॆच्चु मनसु दॆलियकुन्नडनियुचु ननुनेदो विश्वदाभिराम विनुर वेम ॥ आलिमाटलु विनि अन्नदम्मुल रोसि
    वेरेपोवुवाडु वॆर्रिवाडु कुक्कतोक पट्टि गोदारीदिना विश्वदाभिराम विनुर वेम ॥ ज्ञानियैनवानि मानक पूजिञ्चु
    मनुजुडॆप्पुडु परमुननु मुदम्बु सुखमुनन्दुचुण्डुसूरुलु मॆच्चग विश्वदाभिराम विनुर वेम ॥ हानि कलुगबोदु
    हरिमदि नॆञ्चॆडु वानि कब्दु परमु वसुधयन्दु पूनि निष्ठमीरि पॊदलक युण्डुमु विश्वराभिराम विनुर वेम ॥ अल्पुडॆप्पुडु
    पलुकु नाडम्बरमुगानु सज्जनुण्डु पलुकु चल्लगानु कञ्चु मोगिनट्लु कनकम्बु मोगुना विश्वदाभिराम विनुर वेम
    ॥ न्यायशास्त्र मरय नन्यायमुन दिञ्चु धर्मशास्त्र मॊसगु रुग्मतम्बु ज्योतिषमु जनमुल नीतुल दप्पिञ्चु विश्वदाभिराम
    विनुर वेम ॥ देवुडनग वेरे देशमुन्दुन्नाडॆ देहितोड नॆपुडु देहमन्दॆ वाहनमुलनॆक्कि पडिदोलुचुन्नाडु विश्वदाभिराम
    विनुर वेम ॥ भूमिलोन बुट्टु भूसारमॆल्लनु तनुवुलोन बुट्टु तत्त्वमॆल्ल श्रमलोन बुट्टु सर्वम्बु तानौनु
    विश्वदाभिराम विनुर वेम ॥ व्रातकण्टॆ हॆच्चु परमीदु दैवम्बु चेतकण्टॆ हॆच्चु व्रात लेदु व्रात कजुडु कर्त
    चेतकु दाकर्त विश्वदाभिराम विनुर वेम ॥ चिप्पलोनबड्ड चिनुकु मुत्यम्बय्यॆ नीट बड्ड चिनुकु नीट गलिसॆ ब्राप्ति
    गलुगु चोट फलमेल तप्पुरा विश्वदाभिराम विनुर वेम ॥ इण्टि इण्टिलोननीश्वरुडुण्डग नण्टि चूडलेक यडवुलन्दु
    नुण्ट मेटञ्चुनुन्दुरा जोगुलै विश्वदाभिराम विनुर वेम ॥ चित्तशुद्धि कलिगिचेसिन पुण्यम्बु कॊञ्चॆमैन नदियु
    कॊदवगादु वित्तनम्बु मर्रि वृक्षम्बुनकु नॆन्तो विश्वदाभिराम विनुर वेम ॥ अग्निबाना मेसि यम्बुधि निङ्किञ्चु
    रामुडवलि केग राक निलिचि चॆट्लु गिरुलु तॆच्चि सेतुवु गट्टडा विश्वदाभिराम विनुर वेम ॥ ऐदु वेल्लु बलिमि
    हस्तम्बु पनिचेयु नं दॊकण्डु विड्ड पॊन्दु चॆडुनु स्वीयुडॊकडु विडिन जॆडुकदा पनिबल्मि विश्वदाभिराम विनुर
    वेम ॥ आत्मबुद्धि वलन नखिलम्ब तानय्यॆ जीवबुद्धि वलन जीवुडय्यॆ मोहबुद्धिलयमु मुन्दर गनुगॊनु विश्वदाभिराम
    विनुर वेम ॥ गुणमुलोगलवानि कुलमॆञ्चगानेल गुणमु कलिगॆनेनि कोटिसेयु गणमुलेक युन्न गुड्डिगव्वयुलेदु विश्वदाभिराम
    विनुर वेम ॥ तल्लितण्ड्रुलन्दु दयलेनि पुत्रुण्डु पुट्टनेमि पुट्टलोनि चॆदलु पुट्टदा गिट्टदा विश्वदाभिराम
    विनुर वेम ॥ कोपमुन घनत कॊञ्चॆमैपोवुनु कोपमुननु गुणमु कॊरतपडुनु कोपमणचनेनि कोरिकलीडेरु विश्वदाभिराम
    विनुर वेम ॥ ऎलुगु तोलु तॆच्चि एडादि युतिकिना नलुपु नलुपेकानि तॆलुपुकादु कॊय्यबॊम्म तॆच्चि कॊट्टिते
    गुणियोनॆ विश्वदाभिराम विनुर वेम ॥ अल्पबुद्धिवानिकधिकारमिच्चिन दॊड्डवारिनॆल्ल तॊलगगॊट्टु चॆप्पुदिनॆडु
    कुक्क चॆरकु तीपॆरुगुना विश्वदाभिराम विनुर वेम ॥ पट्टुपट्टरादु पट्टिविडुवरादु पट्टॆनेनि बिगिय पट्टवलयु
    पट्टुविडुटकन्ना पडिचच्चुटेमेलु विश्वदाभिराम विनुर वेम ॥ तुम्मचॆट्टु मुण्ड्ल तोडनेपुट्टुनु वित्तुलॊननुण्डु
    वॆडलुनट्लु मूर्खुनकुनु बुद्धि मुन्दुगा बुट्टनु विश्वदाभिराम विनुर वेम ॥ कपटि वेषमूनि कडगण्ड्लु पडनेल
    विपिन भूमि तिरिगि विसुगनेल युपमुतोने मुक्ति उन्नदि चूडरा विश्वदाभि राम विनुर वेम ॥ ॥ अनुवुगानि चोट
    अधिकुलमनरादु कॊञ्चॆमुन्दुटॆल्ल कॊदुवकादु कॊण्ड यद्दमन्दु कॊञ्चमै उण्डदा विश्वदाभिराम विनुर वेम ॥ मनसुलोनुन्न
    मर्ममन्त ऎरिगि स्थिरमु चेसि आत्म तेटपरिचि घटमु निल्पवलयु घनतलिङ्केटिकि विश्वदाभि रामविनुर वेम ॥ कदलनीयकुण्ड
    गट्टिगा लिङ्गम्बु कट्टिवेयनेमि घनत कलुगु भावमन्दु शिवुनि भाविञ्चि कानरा विश्वदाभिराम विनुर वेम ॥ मेक
    जङ्कबॆट्टिमॆलगुचु मन्दलो ब्रमनि तिरुगु गॊल्ल पगिदिगानु देवुनॆरुगक परदवेतल दलचु विश्वदाभिराम विनुर
    वेम ॥ तन कुल गोत्रमु लाकृति तन सम्पद कलिमि बलिमि तनकेलनया तन वॆण्टरावु निजमिदि तन सत्यमे तोडुवच्चु
    तनतो विश्वदाभिराम विनुर वेम ॥ कलिमिगल्गनेमि करुण लेकुण्डिन कलिमि तगुनॆ दुष्टकर्मुलकुनु तेनॆगूर्पनीग
    तॆरुवुन बोवदा विश्वदाभिराम विनुर वेम ॥ ऎण्डिन मानॊकटडविनि मण्डिन नन्दग्नि पुट्टि यूड्चुनु चॆट्लन्
    दण्डिगल वंशमॆल्लनु चण्डालुण्डॊकडु पुट्टि चदुवुनु वेम ॥ कनुलु पोवुवाडु काल्लु पोयिनवाडु उभयुलरयुगूडि
    युण्डिनट्लु पेद पेद गूडि पॆनगॊनि युण्डुनु विश्वदाभिरामा विनुर वेम ॥ माटलाडु गल्गु मर्ममुलॆरिगिन पिन्नपॆद्दतनमु
    लॆन्नवलदु पिन्नचेति दिव्वॆ पॆद्दगा वॆलगदा विश्वधाभिराम विनुर वेम ॥ कॊण्डमुच्चु पॆण्ड्लिकि कोति पेरण्टालु
    मॊण्डि वानि हितुडु बण्डवाडु दुण्डगीडुनकुनु कॊण्डॆडु दलवायि विश्वदाभिरामा विनुर वेम ॥ झुषमु नीरु वॆडल
    जच्चुटे सिद्धमु नीटनुण्डनेनि निक्किपडुनु अण्डतॊलुगु नॆडल नन्दर पनि अट्ले विश्वदाभि राम विनुर वेम ॥
    तल्लियेड्व विनक तनयालु वगचिन जालिपडॆडु वाडु जडुडु सुम्मि तारतम्य मॆरुगनेरनि पशुवदि विश्वदाभिराम विनुर
    वेम ॥ परुलमेलु चूसि पलुकाकि वलॆ वट्टिमाटलाडु वाडु अधमुडु अट्टिवानि बतुकुटदि एल मण्टिका विश्वदाभिराम
    विनुर वेम ॥ गङ्गि गोवुपालु गरिटडैननु चालु कडवॆडैननु नेमि खरमुपालु भक्तिकल्गुकूडु पट्टॆडैननु चालु विश्वदाभिराम
    विनुर वेम ॥ चिक्कियुन्नवेल सिंहम्बुनैननु बक्क कुक्कयैना बाधसेयु बलिमिलेनि वेल पन्तमुलु चॆल्लवु विश्वदाभिराम
    विनुर वेम ॥ पनसतॊनलकन्न पञ्चदारलकन्न जुण्टितेनॆकन्न जुन्नुकन्न चॆऱुकु रसमुकन्न चॆलुल माटलॆ तीपि विश्वदाभिराम
    विनुर वेम ॥ निण्डुनदुलु पारु निलचि गम्भीरमै वॆऱ्रिवागु पाऱु वेगबॊर्लि अल्पुडाडुरीति नधिकुण्डु नाडुना
    विश्वदाभिराम विनुर वेम ॥ उप्पुलेनिकूर यॊप्पदु रुचुलकु पप्पुलेनि तिण्डि फलमुलेदु अप्पुलेनिवाडॆ यधिक
    सम्पन्नुडु विश्वदाभिराम विनुर वेम ॥ पसुल वन्नॆ वेरु पालॆल्ल ऒक्कटि पुष्पजाति वेरु पूज ऒकटि दर्शनम्बुलारु
    दैवम्बु ऒक्कटि विश्वदाभिराम विनुर वेम ॥ चम्पदगिन शतृवु तनचेत चिक्कॆनेनि कीडु चेयरादु पॊसग मेलु चेसि
    पॊम्मनुटे मेलु विश्वदाभिराम विनुर वेम ॥ आपदगल वेल अरसि बन्धुवु जूडु भयमु वेल जूडु बण्टुतनमु पेदवेल
    जूडु पॆण्ड्लामु गुणमु विश्वदाभिराम विनुर वेम ॥ उप्पु कप्पुरम्बु ऒक्क पोलिकनुण्डु चूड चूड रुचुल जाड
    वेरु पुरुषुलन्दु पुण्य पुरुषुलु वेरय विश्वदाभिराम विनुर वेम ॥ आत्म शुद्दि लेनि याचारमदियेल भाण्डशुद्दि
    लेनि पाक मेल चित्तशुद्दिलेनि शिवपूजलेलरा विश्वदाभिराम विनुर वेम ॥ यिनुमु विरगनेनि यिनुमूरु मुम्मारु
    काचियॆतकवच्चु ग्रममु गानु मनसु विरिगॆनेनि मरि चेर्चरादया विश्वदाभिराम विनुर वेम ॥ कुण्ड कुम्भमन्न
    कॊण्ड पर्वतमन्न नुप्पु लवणमन्न नॊकटि कादॆ भाष लिट्टॆ वेरु परतत्वमॊकटॆ विश्वदाभिराम विनुर वेम ॥ अनग
    ननग राग मतिश यिल्लुचुनुण्डु दिनग दिनग वेमु तिय्यनुण्डु साधनमुन पनुलु समकूरु धरलोन विश्वदाभिराम विनुर
    वेम ॥ चॆप्पुलोनि रायि चॆविलोनि जोरीग कण्टिलोनि नलुसु कालि मुल्लु इण्टिलोनि पोरु निन्तिन्त गादया विश्वदाभिराम
    विनुर वेम ॥ तप्पु लॆन्नुवारु तण्डोप तण्डम्बु लुर्वि जनुलकॆल्ल नुण्डु तप्पु तप्पु लॆन्नुवारु तम तप्पुलॆरुगरु
    विश्वदाभिराम विनुर वेम ॥ मिरप गिञ्ज चूड मीद नल्लगनुण्डु कॊरिकि जूडलोन जुरुकुमनुनु सज्जनु लगु वारि
    सार मिट्लुण्डु विश्वदाभिराम विनुर वेम ॥ मेडिपण्डु चूड मेलिमै युण्डुनु पॊट्टविच्चि चूड पुरुगुलुण्डु
    पिरिकिवानि मदिनि बिङ्कमीलागुरा विश्वदाभिराम विनुर वेम ॥ वेरु पुरुगु चेरि वृक्षम्बु जॆरुचुनु चीडपुरुगु
    चेरि चॆट्टु जॆरचु कुत्सितुण्डु चेरि गुणवन्तु जॆरचुरा विश्वदाभिराम विनुर वेम ॥ वेषभाष लॆरिगि काषयवस्त्रमुल्
    गट्टगानॆ मुक्ति गलुगबोदु तललु बोडुलृन तलपुलु बोडुला विश्वदाभिराम विनुर वेम
