id: sukra-graha-pancharatna-stotram
category: stotram
name:
  english: Sukra Graha Pancharatna Stotram
content:
  english: himakunda mrinalabham daityanam paramam gurum | sarvashastra pravaktaram bhargavam pranamamyaham
    || || shuklambaram shukla malyam shukla gandhanulepanam | vajra manikya bhushadhyam kirita makutojjvalam
    || || shvetambara shvetavapushcaturbhuja samanvitah | ratna simhasanarudo rathasthorajataprabhah ||
    || bhrigurbhogakaro bhumisurapalana tatparah | sarvaishvarya prada svarvagirvana ganasannutah || ||
    dandahastanca varadam bhanujvalanga shobhitam | akshamala kamandalam devam tam bhargavam pranamamyaham
    ||
  devanagari: हिमकुन्द मृणालाभं दैत्यानां परमं गुरुम् । सर्वशास्त्र प्रवक्तारं भार्गवं प्रणमाम्यहम् ॥
    ॥ शुक्लाम्बरं शुक्ल माल्यं शुक्ल गन्धानुलेपनम् । वज्र माणिक्य भूषाढ्यं किरीट मकुटोज्ज्वलम् ॥ ॥ श्वेताम्बर
    श्वेतवपुश्चतुर्भुज समन्वितः । रत्न सिंहासनारूडो रथस्थोरजतप्रभः ॥ ॥ भृगुर्भोगकरो भूमीसुरपालन तत्परः
    । सर्वैश्वर्य प्रद स्वर्वगीर्वाण गणसन्नुतः ॥ ॥ दण्डहस्तञ्च वरदां भानुज्वालाङ्ग शोभितम् । अक्षमाला
    कमण्डलं देवं तं भार्गवं प्रणमाम्यहम् ॥
