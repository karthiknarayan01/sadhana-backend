id: vishnusahasranamastotragarudapurana-2
category: sahasranama
name:
  english: vishnusahasranamastotragarudapurana
  devanagari: विष्णुसहस्रनामस्तोत्रगरुडपुराण
content:
  english: '|| 158|| iti namasahasram te vrishabhadhvaja kirtitam | devasya vishnorishasya sarvapapavinashanam
    || 159|| pathandvijashca vishnutvam kshatriyo jayamapnuyat | vaishyo dhanam sukham shudro vishnubhaktisamanvitah
    || 160|| iti shrigarude mahapurane purvakhande prathamamshakhye acarakande shrivishnusahasranamastotranirupanam
    nama pancadasho''dhyayah || garudapurana | purvakhanda | adhyaya 15'
  devanagari: ॥ १५८॥ इति नामसहस्रं ते वृषभध्वज कीर्तितम् । देवस्य विष्णोरीशस्य सर्वपापविनाशनम् ॥ १५९॥
    पठन्द्विजश्च विष्णुत्वं क्षत्रियो जयमाप्नुयात् । वैश्यो धनं सुखं शूद्रो विष्णुभक्तिसमन्वितः ॥ १६०॥
    इति श्रीगारुडे महापुराणे पूर्वखण्डे प्रथमांशाख्ये आचारकाण्डे श्रीविष्णुसहस्रनामस्तोत्रनिरूपणं नाम
    पञ्चदशोऽध्यायः ॥ गरुडपुराण । पूर्वखण्ड । अध्याय १५
meaning: {}
