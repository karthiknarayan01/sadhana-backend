id: prahladakritam1nrisimhastotram
category: stotram
name:
  english: prahladakritam1nrisimhastotram
  devanagari: प्रह्लादकृतं१नृसिंहस्तोत्रम्
content:
  english: prahladakritam 1 nrisimhastotram om namo bhagavate narasimhaya namastejastejase aviravirbhava
    vajranakha vajradamshtra karmashayan randhaya randhaya tamo grasa grasa om svaha abhayamabhayamatmani
    bhuyishtha om kshraum || 8|| svastyastu vishvasya khalah prasidatam dhyayantu bhutani shivam mitho
    dhiya | manashca bhadram bhajatadadhokshaje aveshyatam no matirapyahaituki || 9|| magaradaratmajavittabandhushu
    sango yadi syadbhagavatpriyeshu nah | yah pranavrittya paritushta atmavan siddhyatyaduranna tathendriyapriyah
    || 10|| yatsangalabdham nijaviryavaibhavam tirtham muhuh samsprishatam hi manasam | haratyajo'ntahshrutibhirgato'ngajam
    ko vai na seveta mukundavikramam || 11|| yasyasti bhaktirbhagavatyakincana sarvairgunaistatra samasate
    surah | haravabhaktasya kuto mahadguna manorathenasati dhavato bahih || 12|| harirhi sakshadbhagavan
    sharirina
  devanagari: प्रह्लादकृतं १ नृसिंहस्तोत्रम् ॐ नमो भगवते नरसिंहाय नमस्तेजस्तेजसे आविराविर्भव वज्रनख वज्रदंष्ट्र
    कर्माशयान् रन्धय रन्धय तमो ग्रस ग्रस ॐ स्वाहा अभयमभयमात्मनि भूयिष्ठा ॐ क्ष्रौम् ॥ ८॥ स्वस्त्यस्तु
    विश्वस्य खलः प्रसीदतां ध्यायन्तु भूतानि शिवं मिथो धिया । मनश्च भद्रं भजतादधोक्षजे आवेश्यतां नो मतिरप्यहैतुकी
    ॥ ९॥ मागारदारात्मजवित्तबन्धुषु सङ्गो यदि स्याद्भगवत्प्रियेषु नः । यः प्राणवृत्त्या परितुष्ट आत्मवान्
    सिद्ध्यत्यदूरान्न तथेन्द्रियप्रियः ॥ १०॥ यत्सङ्गलब्धं निजवीर्यवैभवं तीर्थं मुहुः संस्पृशतां हि मानसम्
    । हरत्यजोऽन्तःश्रुतिभिर्गतोऽङ्गजं को वै न सेवेत मुकुन्दविक्रमम् ॥ ११॥ यस्यास्ति भक्तिर्भगवत्यकिञ्चना
    सर्वैर्गुणैस्तत्र समासते सुराः । हरावभक्तस्य कुतो महद्गुणा मनोरथेनासति धावतो बहिः ॥ १२॥ हरिर्हि साक्षाद्भगवान्
    शरीरिणा
