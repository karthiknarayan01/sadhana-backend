id: anjaneya-bhujanga-prayata-stotram
category: stotram
name:
  english: Anjaneya Bhujanga Prayata Stotram
content:
  english: prasannangaragam prabhakancanangam jagadbhitashauryam tusharadridhairyam | trinibhutahetim
    ranodyadvibhutim bhaje vayuputram pavitraptamitram || || bhaje pavanam bhavana nityavasam bhaje balabhanu
    prabha carubhasam | bhaje candrika kunda mandara hasam bhaje santatam ramabhupala dasam || || bhaje
    lakshmanapranarakshatidaksham bhaje toshitaneka girvanapaksham | bhaje ghora sangrama simahataksham
    bhaje ramanamati sampraptaraksham || || kritabhilanadhakshitakshiptapadam ghanakranta bhringam katisthoru
    jangham | viyadvyaptakesham bhujashleshitashmam jayashri sametam bhaje ramadutam || || caladvalaghatam
    bhramaccakravalam kathorattahasam prabhinnabjajandam | mahasimhanada dvishirnatrilokam bhaje canjaneyam
    prabhum vajrakayam || || rane bhishane meghanade sanade saroshe samaropanamitra mukhye | khaganam
    ghananam suranam ca marge natantam samantam hanumantamide || || ghanadratna jambhari dambholi bharam
    ghanaddanta nirdhuta kalogradantam | padaghata bhitabdhi bhutadivasam ranakshonidaksham bhaje pingalaksham
    || || mahagrahapidam mahotpatapidam maharogapidam mahativrapidam | haratyastu te padapadmanurakto
    namaste kapishreshtha ramapriyaya || || jarabharato bhuri pidam sharire niradharanarudha gadha pratapi
    | bhavatpadabhaktim bhavadbhaktiraktim kuru shrihanumatprabho me dayalo || || mahayogino brahmarudradayo
    va na jananti tattvam nijam raghavasya | katham jnayate madrishe nityameva prasida prabho vanarendro
    namaste || || namaste mahasattvavahaya tubhyam namaste mahavajradehaya tubhyam | namaste paribhuta
    suryaya tubhyam namaste kritamartya karyaya tubhyam || || namaste sada brahmacaryaya tubhyam namaste
    sada vayuputraya tubhyam | namaste sada pingalakshaya tubhyam namaste sada ramabhaktaya tubhyam ||
    || hanumadbhujangaprayatam prabhate pradoshe'pi va cardharatre'pi martyah | pathannashnato'pi pramuktoghajalo
    sada sarvada ramabhaktim prayati || || iti shrimadanjaneya bhujangaprayata stotram |
  devanagari: प्रसन्नाङ्गरागं प्रभाकाञ्चनाङ्गं जगद्भीतशौर्यं तुषाराद्रिधैर्यम् । तृणीभूतहेतिं रणोद्यद्विभूतिं
    भजे वायुपुत्रं पवित्राप्तमित्रम् ॥ ॥ भजे पावनं भावना नित्यवासं भजे बालभानु प्रभा चारुभासम् । भजे चन्द्रिका
    कुन्द मन्दार हासं भजे सन्ततं रामभूपाल दासम् ॥ ॥ भजे लक्ष्मणप्राणरक्षातिदक्षं भजे तोषितानेक गीर्वाणपक्षम्
    । भजे घोर सङ्ग्राम सीमाहताक्षं भजे रामनामाति सम्प्राप्तरक्षम् ॥ ॥ कृताभीलनाधक्षितक्षिप्तपादं घनक्रान्त
    भृङ्गं कटिस्थोरु जङ्घम् । वियद्व्याप्तकेशं भुजाश्लेषिताश्मं जयश्री समेतं भजे रामदूतम् ॥ ॥ चलद्वालघातं
    भ्रमच्चक्रवालं कठोराट्टहासं प्रभिन्नाब्जजाण्डम् । महासिंहनादा द्विशीर्णत्रिलोकं भजे चाञ्जनेयं प्रभुं
    वज्रकायम् ॥ ॥ रणे भीषणे मेघनादे सनादे सरोषे समारोपणामित्र मुख्ये । खगानां घनानां सुराणां च मार्गे
    नटन्तं समन्तं हनूमन्तमीडे ॥ ॥ घनद्रत्न जम्भारि दम्भोलि भारं घनद्दन्त निर्धूत कालोग्रदन्तम् । पदाघात
    भीताब्धि भूतादिवासं रणक्षोणिदक्षं भजे पिङ्गलाक्षम् ॥ ॥ महाग्राहपीडां महोत्पातपीडां महारोगपीडां महातीव्रपीडाम्
    । हरत्यस्तु ते पादपद्मानुरक्तो नमस्ते कपिश्रेष्ठ रामप्रियाय ॥ ॥ जराभारतो भूरि पीडां शरीरे निराधारणारूढ
    गाढ प्रतापी । भवत्पादभक्तिं भवद्भक्तिरक्तिं कुरु श्रीहनूमत्प्रभो मे दयालो ॥ ॥ महायोगिनो ब्रह्मरुद्रादयो
    वा न जानन्ति तत्त्वं निजं राघवस्य । कथं ज्ञायते मादृशे नित्यमेव प्रसीद प्रभो वानरेन्द्रो नमस्ते ॥
    ॥ नमस्ते महासत्त्ववाहाय तुभ्यं नमस्ते महावज्रदेहाय तुभ्यम् । नमस्ते परीभूत सूर्याय तुभ्यं नमस्ते कृतामर्त्य
    कार्याय तुभ्यम् ॥ ॥ नमस्ते सदा ब्रह्मचर्याय तुभ्यं नमस्ते सदा वायुपुत्राय तुभ्यम् । नमस्ते सदा पिङ्गलाक्षाय
    तुभ्यं नमस्ते सदा रामभक्ताय तुभ्यम् ॥ ॥ हनूमद्भुजङ्गप्रयातं प्रभाते प्रदोषेऽपि वा चार्धरात्रेऽपि मर्त्यः
    । पठन्नश्नतोऽपि प्रमुक्तोघजालो सदा सर्वदा रामभक्तिं प्रयाति ॥ ॥ इति श्रीमदाञ्जनेय भुजङ्गप्रयात स्तोत्रम्
    ।
