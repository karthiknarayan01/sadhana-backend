id: govinda-damodara-stotram-selected-verses
category: stotram
name:
  english: Govinda Damodara Stotram (Selected Verses)
content:
  english: kararavindena padaravindam mukharavinde viniveshayantam | vatasya patrasya pute shayanam balam
    mukundam manasa smarami || shrikrishna govinda hare murare he natha narayana vasudeva | jihve pibasvamritametadeva
    govinda damodara madhaveti || vikretukamakhilagopakanya muraripadarpitacittavrittih | dadhyadikam
    mohavashadavocat govinda damodara madhaveti || grihe grihe gopavadhukadambah sarve militva samavapya
    yogam | punyani namani pathanti nityam govinda damodara madhaveti || sukham shayana nilaye nije'pi
    namani vishnoh pravadanti martyah | te nishcitam tanmayatam vrajanti govinda damodara madhaveti ||
    jihve sadaivam bhaja sundarani namani krishnasya manoharani | samasta bhaktartivinashanani govinda
    damodara madhaveti || sukhavasane idameva saram duhkhavasane idameva jneyam | dehavasane idameva japyam
    govinda damodara madhaveti || jihve rasajne madhurapriye tvam satyam hitam tvam paramam vadami | avarnayetha
    madhuraksharani govinda damodara madhaveti || tvameva yace mama dehi jihve samagate dandadhare kritante
    | vaktavyamevam madhuram subhaktya govinda damodara madhaveti || shrikrishna radhavara gokulesha gopala
    govardhananatha vishno | jihve pibasvamritametadeva govinda damodara madhaveti ||
  devanagari: करारविन्देन पदारविन्दं मुखारविन्दे विनिवेशयन्तम् । वटस्य पत्रस्य पुटे शयानं बालं मुकुन्दं
    मनसा स्मरामि ॥ श्रीकृष्ण गोविन्द हरे मुरारे हे नाथ नारायण वासुदेव । जिह्वे पिबस्वामृतमेतदेव गोविन्द
    दामोदर माधवेति ॥ विक्रेतुकामाखिलगोपकन्या मुरारिपादार्पितचित्तवृत्तिः । दध्यादिकं मोहवशादवोचत् गोविन्द
    दामोदर माधवेति ॥ गृहे गृहे गोपवधूकदम्बाः सर्वे मिलित्वा समवाप्य योगम् । पुण्यानि नामानि पठन्ति नित्यं
    गोविन्द दामोदर माधवेति ॥ सुखं शयाना निलये निजेऽपि नामानि विष्णोः प्रवदन्ति मर्त्याः । ते निश्चितं
    तन्मयतां व्रजन्ति गोविन्द दामोदर माधवेति ॥ जिह्वे सदैवं भज सुन्दराणि नामानि कृष्णस्य मनोहराणि । समस्त
    भक्तार्तिविनाशनानि गोविन्द दामोदर माधवेति ॥ सुखावसाने इदमेव सारं दुःखावसाने इदमेव ज्ञेयम् । देहावसाने
    इदमेव जाप्यं गोविन्द दामोदर माधवेति ॥ जिह्वे रसज्ञे मधुरप्रिये त्वं सत्यं हितं त्वां परमं वदामि ।
    अवर्णयेथा मधुराक्षराणि गोविन्द दामोदर माधवेति ॥ त्वामेव याचे मम देहि जिह्वे समागते दण्डधरे कृतान्ते
    । वक्तव्यमेवं मधुरं सुभक्त्या गोविन्द दामोदर माधवेति ॥ श्रीकृष्ण राधावर गोकुलेश गोपाल गोवर्धननाथ विष्णो
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥
