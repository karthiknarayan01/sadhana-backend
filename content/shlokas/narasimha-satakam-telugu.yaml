id: narasimha-satakam-telugu
category: stotram
name:
  english: Narasimha Satakam (Telugu)
content:
  english: rcita sindhugambhira | bhaktavatsala | koti bhanuteja | kanjanetra | hiranya kashyapantaka
    | shura | sadhurakshana | shankha cakrahasta | prahlada varada | pa padhvamsa | sarvesha | kshirasagarashayi
    | krishnavarna | pakshivahana | nila bhramarakuntalajala | pallavarunapada carcitanga | kundakutmaladanta
    | vai kunthadhama | bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha padyamul ni
    mida jèppabunitinayya | cittagimpu gana yati prasa la kshanamu judagaledu pancakavya shloka pathana
    ledu amarakandatrayam barasi cudagaledu shastriya grandhamul caduvaledu ni katakshambuna ne racincèda
    gani prajna nayadi gadu dappugaligina sadbhakti takkuvaunè cèṟakunaku vankapoyina bhushanavikasa |
    shridharma puranivasa | dushtasamhara | narasimha namamantramuceta duritajalamu lanni dolavaccu narasimha
    | ni divya namamantramuceta baluvaina rogamul papavaccu narasimha | ni divya namamantramuceta ripusanghamula
    samha rimpavaccu narasimha | ni divya namamantramuceta dandahastuni bantla bhalira | ne ni mahamantra
    balamuceta divya vaikuntha padavi sa dhimpavaccu bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha yanucu nalukatoda baluka nercinavari padamulaku sashtangamuga nama skara marpana jesi
    prastutincèdanayya bahuvidhamula dharanilo narulènta dandivarainanu ninnu gananivari ne smarimpa memu
    shreshthula mancu midukucuncèdivari cènta jeraganonu bhaktavarula dasulaku dasudanu jumi dhatrilona
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha nnanusarimpagaledu dravya mimmani
    vènta dagulaledu kanaka mimmani cala gashtapèttagaledu palla kimmani nota balakaledu sòmmu limmani
    ninnu nammi kòlvagaledu bhumu limmani peru pògadaledu balamu limmani ninnu bratimalagaledu pasula
    nimmani pattu nilavarna cayyananu mokshamiccina jalu naku bhushanavikasa | shridharma puranivasa |
    dushtasamhara | narasimha kalpavrikshambuvalè nivu galga ninka brajala lakshyambu nakela padmanabha
    | bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha sevajesèdagani pudamilo janula
    mè ppulaku gadu janmapavanatakai smaranajesèda gani sarivarilo brati shthalaku gadu muktikosamu nenu
    mròkki vedèdagani dandibhagyamu nimi ttambu gadu ninnu bògadaga vidya nercitinekani kukshinindèdu
    kuti paramarthikamunaku ne batupaditi girtiki napekshapadaledu krishnavarna | bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha satkathal pògadanga lesha manandambu lenivadu punyavantulu
    ninnu bujaseyaga juci bhavamandutsaha padanivadu bhaktavaryulu ni pra bhavamul pògadanga datparatvamuleka
    talaguvadu tanacittamandu ni dhyana mènnadu leka kalamantayu vridha vasudhalonèlla vyardhundu vadè
    yagunu maṟiyu jèdugaka yèppudu bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    gadateṟuda matanna mònasi cannillalo munugalenu tirthayatralace gri tarthu daudamatanna badali nemambu
    le nadapalenu danadharmamula sa dgatini jèndudamanna ghanamuga nayòdda dhanamuledu tapamacarinci sa
    rdhakamu nòndudamanna nimishamaina manassu gadu ninnu smaranacesèda na yadha bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha hani jeyuta kantè dèmputo vasanabhi dinuta melu adubiddalasòmmu
    lapaharincuta kantè banda gattuka nuta baduta melu parulakantala batti balmi guduta kantè badabagni
    kilala baduta melu bratukajalaka dònga panulu ceyuta kantè gònguto mushtèttu janulatodi jagadamadèdu
    panikantè javu melu bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha durjanulaku
    madhuramainatti ninama bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha basulakapari
    tappu prajalu durjanulaina prabhuni tappu bharya gayyalaina brananadhuni tappu tanayudu dushtayina
    tandri tappu sainyambu cèdirina sainyanadhuni tappu kuturu cèdugaina mata tappu ashvambu cèdugaina
    narohakuni tappu danti dushtayina ma yiccavacci natula mèlagudu rippu di bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    mardhudòkkadu ledu manyamul cèṟupa sa mardhu lanta yèndina yullago dèṟigimpa dèvvadu bandina yullamu
    brabhuvu lanta yitadu peda yatancu nèṟigimpa dèvvandu kalavari siru lènna galaru cala danayali ceshtala
    tappènna dèvvadu bèṟakanta ṟankènna yitti dushtula kadhikara miccinatti prabhuvu tappu latancunu bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha dhanamu te dèvvadu vèllipoyèdinadu vèntaradu lakshadhikaraina
    lavana mannamè kani mèṟugu bangarambu mringabodu vitta marjanajesi virravigutè kani kudabèttina sòmmu
    todaradu pònduga maṟugaina bhumilopala bètti danadharmamu leka tudaku dòngala kitturo dòrala kavunò
    tenè juntiga liyyava bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha lobhimanavu
    dunna bhiksha marthimi jeta bèttaledu tanu bèttakayunna tagavu puttadugani yòrulu pèttaga juci yorvaledu
    datadaggaṟa jeri tana mullè cèdinatlu jihvato jadilu cèppucundu phalamu vighnambaina balu santasamunandu
    melu kalgina jala shriramanatha | yituvanti krurunakunu bhikshukula shatruvani bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha taralipòyyèdivela ni svarupamunu dhya nincunatadu nimishamatramulona
    ninnu jerunu gani yamuni cetiki jikki shramalabadadu paramasantoshana bhajana jesèdivari punya memanavaccu
    bhogishayana mokshamu ni dasa mukhyula kagu gani naraka mèkkadidayya ganaleni tucchulaku muktidòrakuta
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha nivè tandrivi maku kamalavasini
    mammu gannatalli ni bhaktavarulanta nijamaina bandhavul ni katakshamu ma ka nekadhanamu ni kirtanalu
    maku loka prapancambu ni sahayamu maku nityasukhamu ni mantrame maku nishkalankapu vidya ni pada dhyanambu
    tulasidalamu rogamula kaushadhamu brahma bhushanavikasa | shridharma puranivasa | dushtasamhara |
    narasimha bhajana tappanu gani maranakalamunandu maṟatunemò yavela yamaduta lagrahambuna vacci pranamul
    pèkalinci pattunapudu kapha vata paityamul gappaga bhramaceta gampa mudbhavamandi kashtapaducu na
    jihvato ninnu narayana yancu bilutuno shramaceta nati kippudè cetu ni bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha rbalamaina kayam bi dèppudo viducuta yèṟukaledu shatavarshamuladaka
    mitamu jèppiri gani nammara damata nèmmanamuna balyamando manci prayamando leka mudimiyando leka musaliyandò
    yurano yadavino yudakamadhyamunano yèppudo viducuta maraname nishcayamu buddhi mantudaina dehamunnantalo
    mimmu bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha tallidandrulu bharya tanayu
    laptulu bava maṟadu lannalu mena mamagaru ghanamuga bandhuvul galginappatikaina danu darlaga vènta
    dagili raru yamuni dutalu prana mapagarincuka poga mamatato boradi manpaleru balaga mandaṟu duhkha
    paduta matramè kani yincuka yayushya cuttamulamidi bhramadisi cura jèkki santatamu mimmu nammuta bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha nnènta bilcinagani maṟu palka vademi munijanarcita
    | ninnu mròkki vedinagani kanula juda vademi catu còccinagani bhagya miyya vademi seva jesèda nanna
    dòrakajala vademi mokshadayaka | yituvanti murkhajanuni kashtapèttina nikemi bhushanavikasa | shridharma
    puranivasa | dushtasamhara | narasimha nityaganamu jesi ramyamòndimpa na radudaganu savadhanamuga
    ni carana pankaja seva salipi mèppampanga shabariganu balyamappatinundi bhakti niyanduna galuganu
    brahlada ghanudaganu ghanamuga nimidi granthamul galpinci vinutiseyanu vyasa sadhudanu murkhamati
    manu shyadhamudanu hinudanu jummi nivu bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    ladanercitigani patiga satyamul palukanera satkarya vighnamul salupa nercitigani yishta mòndaga nirva
    himpanera nòkari sòmmuku dosi lògga nercitigani cèluvuga dharmambu seyanera dhanamu liyyanga va ddanaga
    nercitigani shighra miccèdunatlu bankajataksha | ne nati patakudanu dappulanniyu kshamiyimpa dandri
    vivè | bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha munna paryantambu maya samsarambu
    maragi narudu sakala papamulaina sangrahincunu gani ninnu jerèdi yukti nervaledu tudaku galuniyòddi
    duta liddaṟu vacci gunjuka cani varu grudducunda himsa korvaga leka yedci gantuluvesi dikku ledani
    nalgu dannu vidipimpa vaccèdi dhanyu dedi mundu nidasudai yunna bhushanavikasa | shridharma puranivasa
    | dushtasamhara | narasimha laprayojakulairi purnashunthalu sabha pujyulairi satyavantulamata jana
    virodhambayè vadarubotulamata vasikèkkè dharmavadanaparul daridryamòndiri paramalobhulu dhana praptulairi
    punyavantulu roga bhuta piditulairi dushtamanavulu va bhikshukulaku shaktiledayè nika nivè bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha pulula jampagavaccu pamukanthamu jeta battavaccu
    brahma rakshasakotla baṟadrolagavaccu manujula rogamul manpavaccu jihva kishtamugani cedu mringagavaccu
    badanu khadgamu ceta nadamavaccu gashtamònducu mundla kampalo jòravaccu dittubotula nollu budamilo
    dushtulaku jnana bodha tèlipi sajjanula jeyale dènta bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha lanni ceyagavaccu mukhyudai nadulandu munugavaccu mukkupattuka sandhya mònasi varvagavaccu
    dinnaga japamala drippavaccu vedala karthambu viṟici cèppagavaccu shreshth kratuvu lèlla jeyavaccu
    dhanamu lakshalu kotlu danamiyyagavaccu naishthikacaramul jerakunda ni padambhojamulayandu bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha kathalu sokinajalu pèdda pogula jollu pèttinatlu
    cetu lèttucu buja seyagalginajalu torampu kadiyalu dòdiginatlu mònasi mastakamuto mròkka galginajalu
    cèluvamaina turayi cèkkinatlu galamu nòvvaga ninnu baluka galginajalu vintaga ganthilu puni ninu gòlcute
    sarva bhushanambu litara bhushanamula nicca bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha bògadanerani noru vraja kagocaramaina padubònda suravararcita | ninnu judagorani kanul
    jalamulopala nèlli sarapugundlu shriramadhima | niku sevajeyani menu kuli kammuduvoni kòlimititti
    vedkato nikathal vinani karnamulaina gathinashiladula bhaktileni manavudu rèndupadala bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha annavastramulake pasula narjincuta palakòṟakè
    satini bèndladuta samsara sukhamuke sutula boshincuta gatulakòṟakè sainyamul gurcuta shatrujayamunake
    samu nercutalèlla cavukòṟakè danamiccutayu mum dati sancitamunake ghanamuga jaduvuta satatamuganu
    bhakti niyandu niluputa mukti kòṟakè bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    tanuvu nilvagabodu dhana mèppatiki shashva tambu gadu darasutadulu tanavènta raleru bhrutyulu mritini
    da ppimpaleru bandhujalamu tannu bratikincukoleru balaparakrama memi paniki radu ghanamaina sakala
    bha gyam bènta galgina gocimatrambaina vèrri kukkala bhramalanni vidici ninnu bhajana jesèdivariki
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha rnayamule mèndayè suguna mòkkatiledu
    cuda janina nanyakantala mida nasha managalenu nòrula kshemamu cuci yorvalenu ituvanti durbuddhu linni
    na kunnavi nenu jesèdivanni nicakritulu navanti papishthi naruni bhulokana buttajesiti vela abjadalanetra
    | natandri vaina phalamu neramulu gaci rakshimpu bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha dimpa nerciti gani tinnaga ninu brastu timpanaiti bòrugu kaminulandu buddhi nilpiti gani
    ninnu santatamu dhya nimpanaiti bèrikimuccata laina murisi vintinigani yènci nikatha lala kincanaiti
    gautukambuna bata kamu gadincitigani hèccu punyamu sangra navanilo nenu janminci nandu kemi sarthakamu
    ganaradayè bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha nayasamuna ninnu dalatuno
    talapano talatu nipudè narasimha | narasimha | narasimha | lakshmisha | danavantaka | koti bhanuteja
    | govinda | govinda | govinda | sarvesha | pannagadhipashayi | padmanabha | madhuvairi | madhuvairi
    | madhuvairi | lokesha | nilameghasharira | nigamavinuta | te mishtamuganu bhajanaseyucu nundu na
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha trartha sampadalanni kalugajesèdi
    bhara karta vivè caduvu lèssaga nerpi sabhalo garishthadhi kara mòndincèdi ghanuda vivè nadaka mancidi
    pètti narulu mèccedunatti peru rappincèdi pèdda vivè baluvaina vairagya bhaktijnanamulicci mukti bòndincèdu
    yasalicci vyarthulanu jesi tèlipèdi bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    gapadinanugani dhatrilo nadi cuda dakka bodu evela neroga sattva mòndanga jeyu ne candamunanu aushadhambulu
    manci vanubhavincina gani karma kshinambaina gani gudivaccina gani marana mayyèdu vyadhi jivuni prayanakalambu
    siddhamaina nilucuna deha mindòkka bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    sandhya varcina nemi brahma mandaka kadu brahmanundu tirumani shricurna gururekha lidinanu vishnu
    nòndaka kadu vaishnavundu budini nudutanu busikònina nemi shambhu nòndaka kadu shaivajanudu kashaya
    vastralu gatti kappina nemi yasha povaka kadu gattukònina guruni jèndaka sanmukti bhushanavikasa |
    shridharma puranivasa | dushtasamhara | narasimha namminanduku jala nènaru nayanduncu nèmmanamuna
    nanni vastuvulu ni nnadigi vesataputtè ninkanaina gataksha miyyavayya santasambuna nannu svargamande
    yuncu bhumiyande yuncu bhogashayana | nayamuga vaikuntha nagaramande yuncu narakamande yuncu ècata
    nannuncinanugani yèpudu ninnu maṟaci pokunda ninama bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha mohasagaramandu munugucunduru shuddha mudhajanulu salalitaishvaryamul shashvatam banukòni
    shadbhramalanu mana jala rèvaru sarvakalamu maya samsara baddhulai guruni karunyambu gorukònaru jnana
    bhakti viraktu laina pèddala juci ninda jeyaka mattulainatti durjati manujulèlla ninnu ganaleru mòdatike
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha mèttinappatinundi bahu gadincitinayya
    patakamulu tèlisi cesiti gònni tèliyajalaka cesi badha nònditi nayya padmanabha anubhavincèdu nappu
    dati prayasambancu brajalu cèppaga jala bhayamu galigè nègiri povutakunai ye yupayambaina jesi cutamatanna
    suryashashinetra | nicatu jòcci nanu kalushamulu drunci nannelu bhushanavikasa | shridharma puranivasa
    | dushtasamhara | narasimha papakarmudanancu naku vankalabètta bokucummi natiki shikshalu nannu ceyutakantè
    nedu seyumu nivu nestamanaka atibhayankarulaina yamadutalaku nannu nòppagimpaku mayya yuragashayana
    | ni dasulanu batti nivu dandimpanga vaddu vaddana rènta dandrivai nivu parapida dagulajeya vasigala
    peru kapakirti bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha talligarbhamunandu
    buttinappatinundi punyamèṟuga nekadashivratam bènna dunduga ledu tirthayatralakaina dirugaledu paramarthikamaina
    panulu ceyagaledu bhiksha mòkkanikaina bèttaledu jnanavantulakaina buni mròkkagaledu itara danamulaina
    nalinadalanetra | ninnu ne namminanu jeri rakshimpave nannu bhushanavikasa | shridharma puranivasa
    | dushtasamhara | narasimha dahara miccènu mrigajati kèvvadu metabèttè vanacaradulaku bho jana mèvva
    dippincè jètla kèvvadu nillu cediposè strilagarbhambuna shishuvu nèvvadu pèncè phanula kèvvadu posè
    baraga balu madhupali kèvvadu makaranda mònarincè basula mèvva dòsangè nivèkani veṟè yòka data ledayya
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha dasajalamu niku koti sankhya galaru
    kòduva ledu bantlasandadivalla bahuparakai nannu maṟaci pokumu bhagya mahimaceta dandiga bhrutyulu
    dagili nikundanga bakkabam tepati nenu jeyagaleka yinta vrithajanma yojakudanu ganuka ni satkatakshambu
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha gannatandrivigana ninnu nemaṟakunti
    nenu vidaka yudaraposhanakunai yòkari ne nashimpa nera na kannambu nivu nadapu pèttale nantiva pinna
    pèddalalona dagavu kippudu diya dalacinanu dhanamu bharambaina dalakiritamu nammu kundalambulu paidi
    kòsaku ni shankha cakramul kuduvabètti grasamu nòsangi poshincu bhushanavikasa | shridharma puranivasa
    | dushtasamhara | narasimha kòluvu cesina naku jita mènduku mutta jèppavaiti mancimatalaceta gòncèmiyyagalevu
    kalahamau nika jummi khanditamuga nivu sadhuvu gana ninta paryantambu canavuce ninnallu jarupavalasè
    nika ne sahimpa ni vipudu nannemaina shiksha cesina jeyu nedu karunimpakuntiva nishcayamuga dègabaditi
    cudu nitoda bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha maina sheshudu cala
    bavanamu bhakshinci bratukucundu nanuvuga niku va hanamaina khagaraju gòppapamunu nota gòṟukucundu
    adigaka ni bharya yaina lakshmidevi dinamu perantambu dirugucundu ninnu bhaktulu pilci nityapujalu
    cesi prema bakvannamul svasthamuga niku grasamu jarugucundu gasu ni ceti dòkataina bhushanavikasa
    | shridharma puranivasa | dushtasamhara | narasimha rèndu kannula ninda ninnu jucèdi bhagya mènnadayya
    vasiga na mano vancha dirèdunatlu sògasuga nirupu cupavayya papakarmuni kanta badakapovudamancu barushamaina
    pratijna vanuda vi vancu ne bunyavantulanota nemitiki vistarincè ni kinta kirti drohinainanu na kivu
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha pasaledu dehambu lopala nantata
    roya rota naramulu shalyamul navarandhramulu rakta mamsambu kandalu maila titti baluvaina yènda va
    nala korva dintaina dalale dakali dahamulaku sakala rogamulaku samsthanamè yundu niluva dasthiramaina
    bòndilo nundu pranamul poyinanta gatike gani kòṟagadu bhushanavikasa | shridharma puranivasa | dushtasamhara
    | narasimha padatiramè kani valapu mandulu naku valadu valadu cèlimi seyucu niku seva jesèda gana
    ni dasakotilo nilupavayya grahabhayambunaku ja kramu dalacèdagani ghorarakshalu gatta goranayya pamukatuku
    ninnu bhajana jesèdagani dani mantramu nenu dòrikitivi naku dandi vai dyudavu nivu veyikashtalu vaccinan
    bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha gòṟagani janulace balugaddarimpulu
    dagiliyundagagada deshadeshamulèlla bènagiyundagagada ceri niculaseva nantiyundagagada parula jucina
    bhiti nidaleka veyividhamula ninnu ne bhushanavikasa | shridharma puranivasa | dushtasamhara | narasimha
    jagadamadina gidu kavulato vairambu ganca gidu parama dinula jikka batti kòttina gidu bhikshagandranu
    duhkha pètta gidu nirupedalanu juci nindajesina gidu punyavantula ditta bòsagu gidu sadbhaktulanu
    dira skaramadina gidu guruni dravyamu docu dushtakaryamu lònarincu durjanulaku ghanatarambaina narakambu
