id: pancaksharamantragarbhastotram
category: mantra
name:
  english: pancaksharamantragarbhastotram
  devanagari: पन्चाक्षरमन्त्रगर्भस्तोत्रम्
content:
  english: kamamayo'pi gatashrayano'pi parashrayagashayacancalito'pi | vaishayikadarasamvalito'pi krishna
    tava'smi na ca'smi parasya || 3|| uttamadhairyavibhinnataro'pi nijodaraposhanahetuparo'pi | svikritamatsaramohamado'pi
    krishna tava'smi na ca'smi parasya || 4|| bhaktipathadaramatrakrito'pi vyarthaviruddhakritiprasrito'pi
    | tvatpadasanmukhata'patito'pi krishna tava'smi na ca'smi parasya || 5|| samsritigehakalatrarato'pi
    vyarthadhanarjanakhedasaho'pi | unmadamanasasamshrayano'pi krishna tava'smi na ca'smi parasya || 6||
    krishnapathetaradharmarato'pi svasthitavismritimad hridayo'pi | durjanadurvacanadarano'pi krishna
    tava'smi na ca'smi parasya || 7|| vallabhavamshajanuhsabalo'pi svaprabhupadasarojaphalo'pi | laukikavaidikadharmakhalo'pi
    krishna tava'smi na ca'smi parasya || 8|| pancaksharamahamantragarbhinastotrapathatah | shrimadacaryadasanam
    tadiyatvam bhaveddhruvam || 9|| || iti shriharirayavaracitam shripancaksharagarbhastotram samaptam
    ||
  devanagari: काममयोऽपि गताश्रयणोऽपि पराश्रयगाशयचञ्चलितोऽपि । वैषयिकादरसंवलितोऽपि कृष्ण तवाऽस्मि न चाऽस्मि
    परस्य ॥ ३॥ उत्तमधैर्यविभिन्नतरोऽपि निजोदरपोषणहेतुपरोऽपि । स्वीकृतमत्सरमोहमदोऽपि कृष्ण तवाऽस्मि न चाऽस्मि
    परस्य ॥ ४॥ भक्तिपथादरमात्रकृतोऽपि व्यर्थविरुद्धकृतिप्रसृतोऽपि । त्वत्पदसन्मुखताऽपतितोऽपि कृष्ण तवाऽस्मि
    न चाऽस्मि परस्य ॥ ५॥ संसृतिगेहकलत्ररतोऽपि व्यर्थधनार्जनखेदसहोऽपि । उन्मदमानससंश्रयणोऽपि कृष्ण तवाऽस्मि
    न चाऽस्मि परस्य ॥ ६॥ कृष्णपथेतरधर्मरतोऽपि स्वस्थितविस्मृतिमद् हृदयोऽपि । दुर्जनदुर्वचनादरणोऽपि कृष्ण
    तवाऽस्मि न चाऽस्मि परस्य ॥ ७॥ वल्लभवंशजनुःसबलोऽपि स्वप्रभुपादसरोजफलोऽपि । लौकिकवैदिकधर्मखलोऽपि कृष्ण
    तवाऽस्मि न चाऽस्मि परस्य ॥ ८॥ पञ्चाक्षरमहामन्त्रगर्भिनस्तोत्रपाठतः । श्रीमदाचार्यदासानां तदीयत्वं
    भवेद्ध्रुवम् ॥ ९॥ ॥ इति श्रीहरिरायवरचितं श्रीपञ्चाक्षरगर्भस्तोत्रं समाप्तम् ॥
