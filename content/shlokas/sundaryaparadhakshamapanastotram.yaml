id: sundaryaparadhakshamapanastotram
category: stotram
name:
  english: sundaryaparadhakshamapanastotram
  devanagari: सुन्दर्यपराधक्षमापणस्तोत्रम्
content:
  english: kamalayoh kamapi shive na ca krodhadinam shamanamapi shannam kvacidapi | tadetat kshantavyam
    na khalu pashuroshah samucitah kuputro jayeta kvacidapi kumata na bhavati || 2|| na kaulacarasya smaranamapi
    matarna girije na mantranam japyam shavashayanabhumau tava nishi | kuputranamesha pariharatu ceshtamanimisham
    kuputro jayeta kvacidapi kumata na bhavati || 3|| na tirtheshu snanam tava caranayoh pritijananam
    na mantranam jnanam nija
  devanagari: कमलयोः कामपि शिवे न च क्रोधादीनां शमनमपि षण्णां क्वचिदपि । तदेतत् क्षन्तव्यं न खलु पशुरोषः
    समुचितः कुपुत्रो जायेत क्वचिदपि कुमाता न भवति ॥ २॥ न कौलाचारस्य स्मरणमपि मातर्न गिरिजे न मन्त्राणां
    जाप्यं शवशयनभूमौ तव निशि । कुपुत्राणामेषा परिहरतु चेष्टामनिमिषं कुपुत्रो जायेत क्वचिदपि कुमाता न भवति
    ॥ ३॥ न तीर्थेषु स्नानं तव चरणयोः प्रीतिजननं न मन्त्राणां ज्ञानं निज
meaning: {}
