id: brihaspatikritamrudrastotram
category: stotram
name:
  english: brihaspatikritamrudrastotram
  devanagari: बृहस्पतिकृतंरुद्रस्तोत्रम्
content:
  english: brihaspatikritam rudrastotram brihaspatiruvaca | namo devadhipataye tryambakaya kapardine |
    tripuraghnaya sharvaya namo'dhankanishudine || 12|| virupaya'tirupaya bahurupaya shambhave | yajnavidhvamsakartre
    ca yajnanam phaladayine || 13|| kalantakaya kalaya kalabhogidharaya ca | namo brahmashirohantre brahmanaya
    namo namah || 14|| iti shriskandapurane vaishnavakhande kartikamasamahatmye caturdashadhyayantargatam
    brihaspatikritam rudrastotram samaptam | skandapurana | vaishnavakhanda | kartikakhanda | adhyaya
    14
  devanagari: बृहस्पतिकृतं रुद्रस्तोत्रम् बृहस्पतिरुवाच । नमो देवाधिपतये त्र्यम्बकाय कपर्दिने । त्रिपुरघ्नाय
    शर्वाय नमोऽधङ्कनिषूदिने ॥ १२॥ विरूपायाऽतिरूपाय बहुरूपाय शम्भवे । यज्ञविध्वंसकर्त्रे च यज्ञानां फलदायिने
    ॥ १३॥ कालान्तकाय कालाय कालभोगिधराय च । नमो ब्रह्मशिरोहन्त्रे ब्राह्मणाय नमो नमः ॥ १४॥ इति श्रीस्कन्दपुराणे
    वैष्णवखण्डे कार्तिकमासमाहात्म्ये चतुर्दषाध्यायान्तर्गतं बृहस्पतिकृतं रुद्रस्तोत्रं समाप्तम् । स्कन्दपुराण
    । वैष्णवखण्ड । कार्तिकखण्ड । अध्याय १४
meaning: {}
