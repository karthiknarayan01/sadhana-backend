id: shiva-namavalyashtakam-namavali-ashtakam
category: stotram
name:
  english: Shiva Namavalyashtakam (Namavali Ashtakam)
  devanagari: शिवनामावल्यष्टकम्
content:
  english: he candracuda madanantaka shulapane sthano girisha girijesha mahesha shambho | bhutesha bhitabhayasudana
    mamanatham samsaraduhkhagahanajjagadisha raksha || 1|| he parvatihridayavallabha candramaule bhutadhipa
    pramathanatha girishacapa | he vamadeva bhava rudra pinakapane samsaraduhkhagahanajjagadisha raksha
    || 2|| he nilakantha vrishabhadhvaja pancavaktra lokesha sheshavalaya pramathesha sharva | he dhurjate
    pashupate girijapate mam samsaraduhkhagahanajjagadisha raksha || 3|| he vishvanatha shiva shankara
    devadeva gangadhara pramathanayaka nandikesha | baneshvarandhakaripo hara lokanatha samsaraduhkhagahanajjagadisha
    raksha || 4|| varanasipurapate manikarnikesha viresha dakshamakhakala vibho ganesha | sarvajna sarvahridayaikanivasa
    natha samsaraduhkhagahanajjagadisha raksha || 5|| shrimanmaheshvara kripamaya he dayalo he vyomakesha
    shitikantha ganadhinatha | bhasmangaraga nrikapalakalapamala samsaraduhkhagahanajjagadisha raksha
    || 6|| kailasashailavinivasa vrishakape he mrityunjaya trinayana trijagannivasa | narayanapriya madapaha
    shaktinatha samsaraduhkhagahanajjagadisha raksha || 7|| vishvesha vishvabhavanashaka vishvarupa vishvatmaka
    tribhuvanaikagunadhikesha | he vishvanatha karunamaya dinabandho samsaraduhkhagahanajjagadisha raksha
    || 8|| gaurivilasabhavanaya maheshvaraya pancananaya sharanagatakalpakaya | sharvaya sarvajagatamadhipaya
    tasmai daridryaduhkhadahanaya namah shivaya || 9|| iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau shivanamavalyashtakam sampurnam ||
  devanagari: हे चन्द्रचूड मदनान्तक शूलपाणे स्थाणो गिरीश गिरिजेश महेश शम्भो । भूतेश भीतभयसूदन मामनाथं
    संसारदुःखगहनाज्जगदीश रक्ष ॥ १॥ हे पार्वतीहृदयवल्लभ चन्द्रमौले भूताधिप प्रमथनाथ गिरीशचाप । हे वामदेव
    भव रुद्र पिनाकपाणे संसारदुःखगहनाज्जगदीश रक्ष ॥ २॥ हे नीलकण्ठ वृषभध्वज पञ्चवक्त्र लोकेश शेषवलय प्रमथेश
    शर्व । हे धूर्जटे पशुपते गिरिजापते मां संसारदुःखगहनाज्जगदीश रक्ष ॥ ३॥ हे विश्वनाथ शिव शङ्कर देवदेव
    गङ्गाधर प्रमथनायक नन्दिकेश । बाणेश्वरान्धकरिपो हर लोकनाथ संसारदुःखगहनाज्जगदीश रक्ष ॥ ४॥ वाराणसीपुरपते
    मणिकर्णिकेश वीरेश दक्षमखकाल विभो गणेश । सर्वज्ञ सर्वहृदयैकनिवास नाथ संसारदुःखगहनाज्जगदीश रक्ष ॥ ५॥
    श्रीमन्महेश्वर कृपामय हे दयालो हे व्योमकेश शितिकण्ठ गणाधिनाथ । भस्माङ्गराग नृकपालकलापमाल संसारदुःखगहनाज्जगदीश
    रक्ष ॥ ६॥ कैलासशैलविनिवास वृषाकपे हे मृत्युञ्जय त्रिनयन त्रिजगन्निवास । नारायणप्रिय मदापह शक्तिनाथ
    संसारदुःखगहनाज्जगदीश रक्ष ॥ ७॥ विश्वेश विश्वभवनाशक विश्वरूप विश्वात्मक त्रिभुवनैकगुणाधिकेश । हे विश्वनाथ
    करुणामय दीनबन्धो संसारदुःखगहनाज्जगदीश रक्ष ॥ ८॥ गौरीविलासभवनाय महेश्वराय पञ्चाननाय शरणागतकल्पकाय ।
    शर्वाय सर्वजगतामधिपाय तस्मै दारिद्र्यदुःखदहनाय नमः शिवाय ॥ ९॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ शिवनामावल्यष्टकं सम्पूर्णम् ॥
