id: minakshistotram-2
category: stotram
name:
  english: minakshistotram 2
  devanagari: मीनाक्षीस्तोत्रम् २
content:
  english: shriminakshistotram 2 gaurim kancanapadminitatagriham shrisundareshapriyam niparanyasuvarnakandukaparikridavilolamimam
    | shrimatpandyakulacalagravilasadratnapradipayitam minakshim madhureshvarim shukadharam shripandyabalam
    bhaje || 1|| gaurim vedakadambakananashukim shastratavikekinim vedantakhiladharmahemanalinihamsim
    shivam shambhavim | onkarambujanilamattamadhupam mantramrashakhambikam minakshim madhureshvarim shukadharam
    shripandyabalam bhaje || 2|| gaurim nupurashobhitanghrikamalam tunollasajjanghikam ratnadarshasamanajanuyugalam
    rambhanibhorudvayam | kancibaddhamanojnapinajaghanamavartanabhihridam minakshim madhureshvarim shukadharam
    shripandyabalam bhaje || 3|| gaurim vyomasamanamadhyamayutamuttungavakshoruham vinamanjulasharikanvitakaram
    shankhabhakanthojjvalam | rakacandrasamanacaruvadanam rolamvanilalakam minakshim madhureshvarim shukadharam
    shripandyabalam bhaje || 4|| gaurim manjulaminanetrayugalam kodandasubhrulatam bimboshthim smitakundadantaruciram
    campeyanasojjvalam | ardhendupratibimbaphalaruciramadarshagandasthalam minakshim madhureshvarim shukadharam
    shripandyabalam bhaje || 5|| gaurim kunkumapankalepitalasadvakshojakumbhojjvalam kasturitilakalakam
    malayajam gandholasatkandharam | lakshakardamashobhipadayugalam sindurasimantinim minakshim madhureshvarim
    shukadharam shripandyabalam bhaje || 6|| gaurim campakamallikasukusumaih punnagasaugandhika
  devanagari: श्रीमीनाक्षीस्तोत्रम् २ गौरीं काञ्चनपद्मिनीतटगृहां श्रीसुन्दरेशप्रियां नीपारण्यसुवर्णकन्दुकपरिक्रीडाविलोलामिमाम्
    । श्रीमत्पाण्ड्यकुलाचलाग्रविलसद्रत्नप्रदीपायितां मीनाक्षीं मधुरेश्वरीं शुकधरां श्रीपाण्ड्यबालां भजे
    ॥ १॥ गौरीं वेदकदम्बकाननशुकीं शास्त्राटवीकेकिनीं वेदान्ताखिलधर्महेमनलिनीहंसीं शिवां शाम्भवीम् । ओङ्कारम्बुजनीलमत्तमधुपां
    मन्त्राम्रशाखाम्बिकां मीनाक्षीं मधुरेश्वरीं शुकधरां श्रीपाण्ड्यबालां भजे ॥ २॥ गौरीं नूपुरशोभिताङ्घ्रिकमलां
    तूणोल्लसज्जङ्घिकां रत्नादर्शसमानजानुयुगलां रम्भानिभोरूद्वयाम् । काञ्चीबद्धमनोज्ञपीनजघनामावर्तनाभीहृदां
    मीनाक्षीं मधुरेश्वरीं शुकधरां श्रीपाण्ड्यबालां भजे ॥ ३॥ गौरीं व्योमसमानमध्यमयुतामुत्तुङ्गवक्षोरुहां
    वीणामञ्जुलशारीकान्वितकरां शङ्खाभकण्ठोज्ज्वलाम् । राकाचन्द्रसमानचारुवदनां रोलम्वनीलालकां मीनाक्षीं
    मधुरेश्वरीं शुकधरां श्रीपाण्ड्यबालां भजे ॥ ४॥ गौरीं मञ्जुलमीननेत्रयुगलां कोदण्डसुभ्रूलतां बिम्बोष्ठीं
    स्मितकुन्ददन्तरुचिरां चाम्पेयनासोज्ज्वलाम् । अर्धेन्दुप्रतिबिम्बफालरुचिरामादर्शगण्डस्थलां मीनाक्षीं
    मधुरेश्वरीं शुकधरां श्रीपाण्ड्यबालां भजे ॥ ५॥ गौरीं कुङ्कुमपङ्कलेपितलसद्वक्षोजकुम्भोज्ज्वलां कस्तूरीतिलकालकां
    मलयजां गन्धोलसत्कन्धराम् । लाक्षाकर्दमशोभिपादयुगलां सिन्दूरसीमन्तिनीं मीनाक्षीं मधुरेश्वरीं शुकधरां
    श्रीपाण्ड्यबालां भजे ॥ ६॥ गौरीं चम्पकमल्लिकासुकुसुमैः पुन्नागसौगन्धिका
