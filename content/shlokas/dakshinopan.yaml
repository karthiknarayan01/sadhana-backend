id: dakshinopan
category: upanishad
name:
  english: dakshinopan
  devanagari: दक्शिनोपन्
content:
  english: sa hovaca | vairagyatailasampurne bhaktivartisamanvite | prabodhapurna patre tu jnaptidipam
    vilokayet | mohandhakaranissare udeti svayameva hi | vairagyamaranim kritva jnanam kritvottararanim
    | gadhatamrisramsashantyai gudhamartham nivedayet | mohabhanujasamkrantam vivekakhyam mrikundujam
    | tattvavicarapashena baddham dvaitabhayaturam | ujjivayannijanande svasvarupena samsthitah | shemushi
    dakshina prokta sa yasyabhikshane mukam | dakshinabhimukhah proktah shive'sau brahmavadibhih | sargadikale
    bhagavan virinci rupasyainam sargasamarthyamapya | tutosha citte vancitarthashca labdhva dhanyah so'syopasako
    bhavati dhata |
  devanagari: स होवाच । वैराग्यतैलसम्पूर्णे भक्तिवर्तिसमन्विते । प्रबोधपूर्ण पात्रे तु ज्ञप्तिदीपं विलोकयेत्
    । मोहान्धकारनिस्सारे उदेति स्वयमेव हि । वैराग्यमरणिं कृत्वा ज्ञानं कृत्वोत्तरारणिम् । गाढताम्रिस्रंसशान्त्यै
    गूढमर्थं निवेदयेत् । मोहभानुजसंक्रान्तं विवेकाख्यं मृकुन्डुजम् । तत्त्वाविचारपाशेन बद्धं द्वैतभयातुरम्
    । उज्जीवयन्निजानन्दे स्वस्वरूपेण संस्थितः । शेमुषी दक्षिणा प्रोक्ता सा यस्याभीक्षणे मुकम् । दक्षिणाभिमुखः
    प्रोक्तः शिवेऽसौ ब्रह्मवादिभिः । सर्गादिकाले भगवन् विरिञ्चि रुपास्यैनं सर्गसामर्थ्यमाप्य । तुतोष चित्ते
    वाञ्चितार्थाश्च लब्ध्वा धन्यः सोऽस्योपासको भवति धाता ।
