id: dhumdhisvarupavarnanastotram
category: stotram
name:
  english: dhumdhisvarupavarnanastotram
  devanagari: ढुंढिस्वरूपवर्णनस्तोत्रम्
content:
  english: rinu rajan ganeshasya svarupam yogadam param | bhuktimuktipradam purnam dharitam cennarena
    vai || 7|| citte cintamanih sakshatpancacittapracalakah | pancavrittinirodhena prapyate yogasevaya
    || 8|| asamprajnatasamsthashca gajashabdo mahamate | tadeva mastakam yasya dehah sarvatmako'bhavat
    || 9|| bhrantirupa mahamaya siddhirvamangasamshrita | bhrantidharakarupa sa buddhishca dakshinangake
    || 10|| tayoh svami ganeshashca mayabhyam khelate sada | sambhajasva vidhanena tada samlabhase nripa
    || 11|| iti dhundhisvarupavarnanastotram samaptam |
  devanagari: ृणु राजन् गणेशस्य स्वरूपं योगदं परम् । भुक्तिमुक्तिप्रदं पूर्णं धारितं चेन्नरेण वै ॥ ७॥
    चित्ते चिन्तामणिः साक्षात्पञ्चचित्तप्रचालकः । पञ्चवृत्तिनिरोधेन प्राप्यते योगसेवया ॥ ८॥ असम्प्रज्ञातसंस्थश्च
    गजशब्दो महामते । तदेव मस्तकं यस्य देहः सर्वात्मकोऽभवत् ॥ ९॥ भ्रान्तिरूपा महामाया सिद्धिर्वामाङ्गसंश्रिता
    । भ्रान्तिधारकरूपा सा बुद्धिश्च दक्षिणाङ्गके ॥ १०॥ तयोः स्वामि गणेशश्च मायाभ्यां खेलते सदा । सम्भजस्व
    विधानेन तदा संलभसे नृप ॥ ११॥ इति ढुण्ढिस्वरूपवर्णनस्तोत्रं समाप्तम् ।
