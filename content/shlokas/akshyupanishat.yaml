id: akshyupanishat
category: upanishad
name:
  english: akshyupanishat
  devanagari: अक्ष्युपनिषत्
content:
  english: upanishad || akshyupanishat || yatsaptabhumikavidyavedyanandakalevaram | vikalevarakaivalyam
    ramacandrapadam bhaje || om saha navavatu saha nau bhunaktu saha viryam karavavahai | tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om || atha ha samkritirbhagavanadityalokam
    jagama | tamadityam natva cakshushmatividyaya tamastuvat | om namo bhagavate shrisurya yakshitejase
    namah | om khecaraya namah | om mahasenaya namah | om tamase namah | om rajase namah | om sattvaya
    namah | om asato ma sadgamaya | tamaso ma jyotirgamaya | mrityorma'mritam gamaya | hamso bhagava nchucirupah
    pratirupah | vishvarupam ghrininam jatavedasam hiranmayam jyotirupam tapantam | sahasrarashmih shatadha
    vartamanah purushah prajanamudayatyesha suryah | om namo bhagavate shrisuryayadityayakshitejase'hovahini
    vahini svaheti | evam cakshushmatividyaya stutah shrisuryanarayanah suprito'braviccakshushmati vidyam
    brahmano yo nityamadhite na tasyakshirogo bhavati | na tasya kule'ndho bhavati | ashtau brahmanangrahayitvatha
    vidyasiddhirbhavati | ya evam veda sa mahanbhavati ||
  devanagari: उपनिषद् ॥ अक्ष्युपनिषत् ॥ यत्सप्तभूमिकाविद्यावेद्यानन्दकलेवरम् । विकलेवरकैवल्यं रामचन्द्रपदं
    भजे ॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ ॥ अथ ह सांकृतिर्भगवानादित्यलोकं जगाम । तमादित्यं नत्वा चाक्षुष्मतीविद्यया
    तमस्तुवत् । ॐ नमो भगवते श्रीसूर्या याक्षितेजसे नमः । ॐ खेचराय नमः । ॐ महासेनाय नमः । ॐ तमसे नमः ।
    ॐ रजसे नमः । ॐ सत्त्वाय नमः । ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्माऽमृतं गमय । हंसो
    भगवा ञ्छुचिरूपः प्रतिरूपः । विश्वरूपं घृणिनं जातवेदसं हिरण्मयं ज्योतीरूपं तपन्तम् । सहस्ररश्मिः शतधा
    वर्तमानः पुरुषः प्रजानामुदयत्येष सूर्यः । ॐ नमो भगवते श्रीसूर्यायादित्यायाक्षितेजसेऽहोवाहिनि वाहिनि
    स्वाहेति । एवं चाक्षुष्मतीविद्यया स्तुतः श्रीसूर्यनारायणः सुप्रीतोऽब्रवीच्चाक्षुष्मती विद्यां ब्राह्मणो
    यो नित्यमधीते न तस्याक्षिरोगो भवति । न तस्य कुलेऽन्धो भवति । अष्टौ ब्राह्मणान्ग्राहयित्वाथ विद्यासिद्धिर्भवति
    । य एवं वेद स महान्भवति ॥
