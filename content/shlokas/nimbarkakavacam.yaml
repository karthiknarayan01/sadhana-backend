id: nimbarkakavacam
category: kavacha
name:
  english: nimbarkakavacam
  devanagari: निम्बार्ककवचम्
content:
  english: acarya prapade patu vitatam patu bhutale || 25|| purvasya dishi mam rakshet priya shrilalitasakhi
    | pashuhimsanivrittirmamagneyyam dishi rakshatu || 26|| dakshine campakalata citra nairrityake'vatu
    | tapasamskaranirneta varunyam dishi rakshatu || 27|| padagrasaridoghastu vayavyam dishi rakshatu
    | gauramukhamukhavartirma mudanga dishi rakshatu || 28|| brahmaputrajanoddhartta aishanyam dishi rakshatu
    | ravindushatrusamvasi hyurdhvayam dishi patu mam || 29|| adhastad dishi mam patu sheshaparyantarandhrajit
    | kalatmako diva patu naktam suryasvarupadhrik || 30|| prabhate tvarunah patu madhyahne patu carunih
    | sandhyayamarunih patu nishithe svaprakashavan || 31|| bhaktido hridayam patu catushkam caturakriyah
    | buddhim brahmarthitah patu cittam vishnu
  devanagari: आचार्य प्रपदे पातु विततं पातु भूतले ॥ २५॥ पूर्वस्य दिशि मां रक्षेत् प्रिया श्रीललितासखी
    । पशुहिंसानिवृत्तिर्मामाग्नेय्यां दिशि रक्षतु ॥ २६॥ दक्षिणे चम्पकलता चित्रा नैरृत्यकेऽवतु । तापसंस्कारनिर्णेता
    वारुण्यां दिशि रक्षतु ॥ २७॥ पादाग्रसरिदोघस्तु वायव्यां दिशि रक्षतु । गौरमुखमुखावर्तिर्मा मुदङ्ग दिशि
    रक्षतु ॥ २८॥ ब्रह्मपुत्रजनोद्धर्त्ता ऐशान्यां दिशि रक्षतु । रवीन्दुशत्रुसंवासी ह्यूर्ध्वायां दिशि
    पातु माम् ॥ २९॥ अधस्ताद् दिशि मां पातु शेषपर्यन्तरन्ध्रजित् । कालात्मको दिवा पातु नक्तं सूर्यस्वरूपधृक्
    ॥ ३०॥ प्रभाते त्वरुणः पातु मध्याह्ने पातु चारुणिः । सन्ध्यायामारुणिः पातु निशीथे स्वप्रकाशवान् ॥ ३१॥
    भक्तिदो हृदयं पातु चतुष्कं चतुरक्रियः । बुद्धिं ब्रह्मार्थितः पातु चित्तं विष्णु
