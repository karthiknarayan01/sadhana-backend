id: vishvakarmakavacam
category: kavacha
name:
  english: vishvakarmakavacam
  devanagari: विश्वकर्माकवचम्
content:
  english: pancakatrandashabhujam trinetram dandadharinam | dhyatvashrivishvakarmanam varivaho paristhitim
    || 1|| manasai revasampujyahayu pacaraidvashtabhih | shucih tatah pathedivyam kavacam vishvakarmanah
    || 2|| vishvakarmashirah patu lalatampatu memanuh | kaladeshammayah patutvashtanetrayugantatha ||
    3|| shilpi gandadvayampatu daivajnah patuvoshtakau | am bijam vadanampatah klim bijam kanthadeshakam
    4|| hrim bijam hridayampatu codarampatumahishvarah | brahmatunabhidesham va madhyampatumanobhavah
    || 5|| katathsaujnapatih patu patucorumaheshvarah || janudeshepara brahmanandhe patu virat prabhuh
    || 6|| padaudadeno sadapatu sarvanga vishvakarmakah | sadyojata purvadishivamadevantu dakshine ||
    7|| aghorampashcimepatu tatpurushancottare tatha | ishanampatucordhvaya dhahpatumahishvarah || 8||
    aneyyampatucesha nonairitye girijapatih | vayavyepatumandhavaceshanyepatu vishvabhuk || 9|| prithivyam
    sanagah patu jale patu sanatanah | akashe cahabhuno mam patu pralaskvasarvatah || 10|| suparnah sarvada
    patusarvasankatanashanah | ya idam brahmakavacam trailokyecapidurlabham || 11|| shucirbhutvapathe
    nityam kavacam papanashanam | bhutapretapishacadi kushmanda brahmarakshasah || 12|| divacaratricaramahabhutaganah
    khagah | sukriduccaranadeva nasham yatinasamshayah || 13|| mahadaridrayuktovayuktova sarvapatakaih
    | mucyate sarvapapebhyah shriman sarvasukhibhavet || 14|| gacched brahmamayam dehavishvakarma mujodutaya
    | vishvakarma vyakavacam yah pathosatatannarah || 15|| annapanasadasashtirdhanadhanyadi jayate | anena
    sahashomantronabhuto na bhavishyati || 16|| jalam pibedushah kale kavace nabhimangitam | bala grahamaharoga
    nashamayatitatkshasat || 17|| santatih kanankacayurarogyaishvaya
  devanagari: पञ्चकत्रन्दशभुजं त्रिनेत्रं दण्डधारिणम् । ध्यात्वाश्रीविश्वकर्माणां वारिवाहो परिस्थितिम्
    ॥ १॥ मानसै रेवसम्पूज्यहयु पचारैद्वष्टाभिः । शुचिः ततः पठेदिव्यं कवचं विश्वकर्मणः ॥ २॥ विश्वकर्माशिरः
    पातु ललाटम्पातु मेमनुः । कालदेशम्मयः पातुत्वष्टानेत्रयुगन्तथा ॥ ३॥ शिल्पी गण्डद्वयम्पातु दैवज्ञः पातुवोष्टकौ
    । अं बीजं वदनम्पातः क्लीं बीजं कण्ठदेशकं ४॥ ह्रीं बीजं हृदयम्पातु चोदरम्पातुमहीश्वरः । ब्रह्मातुनाभिदेशं
    व मध्यम्पातुमनोभवः ॥ ५॥ कटथ्सौज्ञपतिः पातु पातुचोरुमहेश्वरः ॥ जानुदेशेपर ब्रह्मानन्धे पातु विराट्
    प्रभुः ॥ ६॥ पदौददेनो सदापातु सर्वाङ्ग विश्वकर्मकः । सद्योजात पूर्वदिशिवामदेवन्तु दक्षिणे ॥ ७॥ अघोरम्पश्चिमेपातु
    तत्पुरुषञ्चोत्तरे तथा । ईशानम्पातुचोर्ध्वाया धःपातुमहीश्वरः ॥ ८॥ आनेय्याम्पातुचेशा नोनैॠत्ये गिरिजापतिः
    । वायव्येपातुमान्धावाचेशान्येपातु विश्वभुक् ॥ ९॥ पृथिव्यां सानगः पातु जले पातु सनातनः । आकाशे चाहभूनो
    मां पातु प्रलस्क्वसर्वतः ॥ १०॥ सुपर्णः सर्वदा पातुसर्वसङ्कटनाशनः । य इदं ब्रह्मकवचं त्रैलोक्येचापिदुर्लभम्
    ॥ ११॥ शुचिर्भूत्वपठे नित्यं कवचं पापनाशनम् । भूतप्रेतापिशाचादि कूष्माण्ड ब्रह्मराक्षसाः ॥ १२॥ दिवाचरात्रिचरामहाभूतगणाः
    खगाः । सुकृदुच्चारणादेव नाशं यातिनसंशयः ॥ १३॥ महादरिद्रयुक्तोवायुक्तोवा सर्वपातकैः । मुच्यते सर्वपापेभ्यः
    श्रीमान् सर्वसुखीभवेत् ॥ १४॥ गच्छेद् ब्रह्ममयं देहाविश्वकर्म मुजोदूतय । विश्वकर्मा व्यकवचं यः पठोसततन्नरः
    ॥ १५॥ अन्नपानसदासष्टिर्धनधान्यादि जायते । अनेन सहशोमन्त्रोनभूतो न भविष्यति ॥ १६॥ जलं पिबेदुषः काले
    कवचे नाभिमङ्गितम् । बाल ग्रहामहारोगा नाशमायातितत्क्षसात् ॥ १७॥ सन्ततिः कनङ्कचायुरारोग्यैश्वय
