id: shriramamantrarajaparamparastotram-2
category: mantra
name:
  english: shriramamantrarajaparamparastotram
  devanagari: श्रीराममन्त्रराजपरम्परास्तोत्रम्
content:
  english: shrianantanandacaryakritam shriramamantrarajaparampara stotram paradhamni sthito ramahpundarikayatekshanah
    | sevaya paraya jushto janakyai tarakam dadau || 1|| shriyah shrirapi lokanam dukhoddharanahetave
    | hanumate dadau mantram sada ramanghrisevine || 2|| tatastu brahmana prapto muhyamanena mayaya |
    kalpantare tu ramo vai brahmane dattavanimam || 3|| mantrarajajapam kritva dhata nirmatritam gatah
    | trayisaramimam dhaturvasishtho labdhavan param || 4|| parasharo vasishthacca sarvasamskarasamyutam
    | mantrarajam param labdhva kritakrityo babhuva ha || 5|| parasharasya satputro vyasah satyavatisutah
    | pituh shadaksharam labdhva cakre vedopabrimhanam || 6|| vyaso'pi bahushishyeshu manvanah shubhayogyatam
    | paramahamsavaryyaya shukadevaya dattavan || 7|| shukadevakripapatro bahmacaryavratesthitah | narottamastu
    tacchishyo nirvanapadavim gatah || 8|| sa capi paramacaryo gangadharaya suraye | mantranam paramam
    tattvam ramamantram pradattavan || 9|| gangadharat sadacaryastato rameshvaro yatih | dvaranandastato
    labdhva parabrahmarato'bhavat || 10|| devanandastu tacchishyah shyamanandastato'grahit | tatsevaya
    shrutanandashcidanandastato'bhavat || 11|| purnanandastato labdhva shriyanandaya dattavan | haryanando
    mahayogi shriyanandanghrisevakah || 12|| haryanandasya shishyo hi raghavanandadeshikah | yasya vai
    shishyatam prapto ramanandah svayam hari || 13|| tasmad guruvarallabdhva devanamapi durlabham | pradattubhyamahantata
    guhyam tarakasamjnakam || 14|| evam parampara saumya prokta shrisampradayinam | mantrarajasya cakhyatirbhumyamevamavatarat
    || 15|| iti shrianantanandacaryakritam shriramamantraraja
  devanagari: श्रीअनन्तानन्दाचार्यकृतं श्रीराममन्त्रराजपरम्परा स्तोत्रम् परधाम्नि स्थितो रामःपुण्डरीकायतेक्षणः
    । सेवया परया जुष्टो जानक्यै तारकं ददौ ॥ १॥ श्रियः श्रीरपि लोकानां दुखोद्धरणहेतवे । हनूमते ददौ मन्त्रं
    सदा रामाङ्घ्रिसेविने ॥ २॥ ततस्तु ब्रह्मणा प्राप्तो मुह्यमानेन मायया । कल्पान्तरे तु रामो वै ब्रह्मणे
    दत्तवानिमम् ॥ ३॥ मन्त्रराजजपं कृत्वा धाता निर्मातृतां गतः । त्रयीसारमिमं धातुर्वसिष्ठो लब्धवान् परम्
    ॥ ४॥ पराशरो वसिष्ठाच्च सर्वसंस्कारसंयुतम् । मन्त्रराजं परं लब्ध्वा कृतकृत्यो बभूव ह ॥ ५॥ पराशरस्य
    सत्पुत्रो व्यासः सत्यवतीसुतः । पितुः षडक्षरं लब्ध्वा चक्रे वेदोपबृंहणम् ॥ ६॥ व्यासोऽपि बहुशिष्येषु
    मन्वानः शुभयोग्यताम् । परमहंसवर्य्याय शुकदेवाय दत्तवान् ॥ ७॥ शुकदेवकृपापात्रो बह्मचर्यव्रतेस्थितः
    । नरोत्तमस्तु तच्छिष्यो निर्वाणपदवीं गतः ॥ ८॥ स चापि परमाचार्यो गङ्गाधराय सूरये । मन्त्राणां परमं
    तत्त्वं राममन्त्रं प्रदत्तवान् ॥ ९॥ गङ्गाधरात् सदाचार्यस्ततो रामेश्वरो यतिः । द्वारानन्दस्ततो लब्ध्वा
    परब्रह्मरतोऽभवत् ॥ १०॥ देवानन्दस्तु तच्छिष्यः श्यामानन्दस्ततोऽग्रहीत् । तत्सेवया श्रुतानन्दश्चिदानन्दस्ततोऽभवत्
    ॥ ११॥ पूर्णानन्दस्ततो लब्ध्वा श्रियानन्दाय दत्तवान् । हर्यानन्दो महायोगी श्रियानन्दाङ्घ्रिसेवकः ॥
    १२॥ हर्यानन्दस्य शिष्यो हि राघवानन्ददेशिकः । यस्य वै शिष्यतां प्राप्तो रामानन्दः स्वयं हरि ॥ १३॥ तस्माद्
    गुरुवारल्लब्ध्वा देवानामपि दुर्लभम् । प्रादात्तुभ्यमहन्तात गुह्यं तारकसंज्ञकम् ॥ १४॥ एवं परम्परा सौम्य
    प्रोक्ता श्रीसम्प्रदायिनाम् । मन्त्रराजस्य चाख्यातिर्भूम्यामेवमवातरत् ॥ १५॥ इति श्रीअनन्तानन्दाचार्यकृतं
    श्रीराममन्त्रराज
