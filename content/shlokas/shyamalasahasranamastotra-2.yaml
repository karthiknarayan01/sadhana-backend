id: shyamalasahasranamastotra-2
category: sahasranama
name:
  english: shyamalasahasranamastotra
  devanagari: श्यामलासहस्रनामस्तोत्र
content:
  english: rinvatim shyamagatrim nyastaikanghrim saroje shashishakaladharam vallakim vadayantim | kalharabaddhamaulim
    niyamitalasacculikam raktavastram matangim bhushitangim madhumadamuditam citrakodbhasiphalam || pancapuja
    | atha sahasranamastotram | om | saubhagyalakshmih saundaryanidhih samarasapriya | sarvakalyananilaya
    sarveshi sarvamangala || 1|| sarvavashyakari sarva sarvamangaladayini | sarvavidyadanadaksha sangitopanishatpriya
    || 2|| sarvabhutahridavasa sarvagirvanapujita | samriddha sangamudita sarvalokaikasamshraya || 3||
    saptakotimahamantrasvarupa sarvasakshini | sarvangasundari sarvagata satyasvarupini || 4|| sama samayasamvedya
    samayajna sadashiva | sangitarasika sarvakalamayashukapriya || 5|| candanalepadigdhangi saccidanandarupini
    | kadambavatinilaya kamalakantasevita || 6|| katakshotpannakandarpa katakshitamaheshvara | kalyani
    kamalasevya kalyanacalavasini || 7|| kanta kandarpajanani karunarasasagara | kalidoshahara kamya kamada
    kamavardhini || 8|| kadambakalikottamsa kadambakusumapriya | kadambamularasika kamakshi kamalanana
    || 9|| kambukanthi kalalapa kamalasanapujita | katyayani kelipara kamalakshasahodari || 10|| kamalakshi
    kalarupa kokakarakucadvaya | kokila kokilarava kumarajanani shiva || 11|| sarvajna santatonmatta sarvaishvaryapradayini
    | sudhapriya suraradhya sukeshi surasundari || 12|| shobhana shubhada shuddha shuddhacittaikavasini
    | vedavedya vedamayi vidyadharaganarcita || 13|| vedantasara vishveshi vishvarupa virupini | virupakshapriya
    vidya vindhyacalanivasini || 14|| vinavadavinodajna vinaganavisharada | vinavati bindurupa brahmani
    brahmarupini || 15|| parvati parama'cintya parashaktih paratpara | parananda pareshani paravidya parapara
    || 16|| bhaktapriya bhaktigamya bhaktanam parama gatih | bhavya bhavapriya bhirurbhavasagaratarini
    || 17|| bhayaghni bhavuka bhavya bhamini bhaktapalini | bhedashunya bhedahantri bhavana munibhavita
    || 18|| maya maheshvari manya matangi malayalaya | mahaniya madonmatta mantrini mantranayika || 19||
    maha''nanda manogamya matangakulamandana | manojna manini madhvi sindhumadhyakritalaya || 20|| madhuprita
    nilakaca madhvirasamadalasa | purnacandrabhavadana purna punyaphalaprada || 21|| pulomajarcita pujya
    purusharthapradayini | narayani nadarupa nadabrahmasvarupini || 22|| nitya navanavakara nityananda
    nirakula | nitilakshapriya netri nilendivaralocana || 23|| tamalakomalakara taruni tanumadhyama |
    tatitpishangavasana tatitkotisabhadyutih || 24|| madhura mangala medhya madhupanapriya sakhi | citkala
    caruvadana sukharupa sukhaprada || 25|| kutastha kaulini kurmapithastha kutilalaka | shanta shantimati
    shantih shyamala shyamalakritih || 26|| shankhini shankari shaivi shankhakundalamandita | kundadanta
    komalangi kumari kulayogini || 27|| nirgarbhayoginisevya nirantararatipriya | shivaduti shivakari
    jatila jagadashraya || | 28|| shambhavi yoginilaya paracaitanyarupini | daharakashanilaya dandiniparipujita
    || 29|| sampatkarigajarudha sandrananda sureshvari | campakodbhasitakaca candrashekharavallabha ||
    30|| carurupa carudanti candrika shambhumohini | vimala vidushi vani kamala kamalasana || 31|| karunapurnahridaya
    kameshi kambukandhara | rajarajeshvari rajamatangi rajavallabha || 32|| saciva saciveshani sacivatvapradayini
    | pancabanarcita bala pancami paradevata || 33|| uma maheshvari gauri sangitajna sarasvati | kavipriya
    kavyakala kalau siddhipradayini || 34|| lalitamantrini ramya lalitarajyapalini | lalitasevanapara
    lalitajnavashamvada || 35|| lalitakaryacatura lalitabhaktapalini | lalitardhasanarudha lavanyarasashevadhih
    || 36|| ranjani lalitashuka lasacculivaranvita | ragini ramani rama rati ratisukhaprada || 37|| bhogada
    bhogyada bhumiprada bhushanashalini | punyalabhya punyakirtih purandarapureshvari || 38|| bhuma''nanda
    bhutikari klinkari klinnarupini | bhanumandalamadhyastha bhamini bharati dhritih || 39|| narayanarcita
    natha nadini nadarupini | pancakonasthita lakshmih purani purarupini || 40|| cakrasthita cakrarupa
    cakrini cakranayika | shatcakramandalantahstha brahmacakranivasini || 41|| antarabhyarcanaprita bahirarcanalolupa
    | pancashatpithamadhyastha matrikavarnarupini || 42|| mahadevi mahashaktih mahamaya mahamatih | maharupa
    mahadiptih mahalavanyashalini || 43|| mahendri madiradripta madirasindhuvasini | madiramodavadana
    madirapanamanthara || 44|| duritaghni duhkhahantri duti dutaratipriya | virasevya vighnahara yogini
    ganasevita || 45|| nijavinaravanandanimilitavilocana | vajreshvari vashyakari sarvacittavimohini ||
    46|| shabari shambararadhya shambari samasamstuta | tripuramantrajapini tripurarcanatatpara || 47||
    trilokeshi trayimata trimurtistridiveshvari | ainkari sarvajanani sauhkari samvidishvari || 48|| bodha
    bodhakari bodhya budharadhya puratani | bhandasodarasamhartri bhandasainyavinashini || 49|| geyacakraratharudha
    gurumurtih kulangana | gandharvashastramarmajna gandharvaganapujita || 50|| jaganmata jayakari janani
    janadevata | shivaradhya shivardhangi shinjanmanjiramandita || 51|| sarvatmika rishikeshi sarvapapavinashini
    | sarvarogahara sadhya dharmini dharmarupini || 52|| acaralabhya svacara khecari yonirupini | pativrata
    pashahantri paramarthasvarupini || 53|| pandita parivaradhya pashandamatabhanjani | shrikari shrimati
    devi bindunadasvarupini || 54|| aparna himavatputri durga durgatiharini | vyalolashankhatatanka vilasadgandapalika
    || 55|| sudhamadhurasalapa sinduratilakojjvala | alaktakaraktapada nandanodyanavasini || 56|| vasantakusumapida
    vasantasamayapriya | dhyananishtha dhyanagamya dhyeya dhyanasvarupini || 57|| daridryahantri daurbhagyashamani
    danavantaka | tirtharupa trinayana turiya doshavarjita || 58|| medhapradayini medhya medini madashalini
    | madhukaitabhasamhartri madhavi madhavapriya || 59|| mahila mahimasara sharvani sharmadayini | rudrani
    rucira raudri rukmabhushanabhushita || 60|| ambika jagatam dhatri jatini dhurjatipriya | sukshmasvarupini
    saumya surucih sulabha shubha || 61|| vipancikalanikkanavimohitajagattraya | bhairavapremanilaya bhairavi
    bhasurakritih || 62|| pushpini punyanilaya punyashravanakirtana | kurukulla kundalini vagishi nakuleshvari
    || 63|| vamakeshi girisuta vartaliparipujita | varunimadaraktakshi vandaruvaradayini || 64|| katakshasyandikaruna
    kandarpamadavardhini | durvashyama dushtahantri dushtagrahavibhedini || 65|| sarvashatrukshayakari
    sarvasampatpravardhini | kabarishobhikalhara kalashinjitamekhala || 66|| mrinalitulvadorvalli mridani
    mrityuvarjita | mridula mrityusamhartri manjula manjubhashini || 67|| karpuravitikabala kamaniyakapolabhuh
    | karpurakshodadigdhangi kartri karanavarjita || 68|| anadinidhana dhatri dhatridharakulodbhava |
    stotrapriya stutimayi mohini mohaharini || 69|| jivarupa jivakari jivanmuktipradayini | bhadrapithasthita
    bhadra bhadrada bhargabhamini || 70|| bhagananda bhagamayi bhagalinga bhageshvari | mattamatangagamana
    matangakulamanjari || 71|| rajahamsagati rajni rajaraja samarcita | bhavani pavani kali dakshina dakshakanyaka
    || 72|| havyavaha havirbhoktri harini duhkhaharini | samsaratarini saumya sarveshi samarapraya ||
    73|| svapnavati jagarini sushupta vishvarupini | taijasi prajnakalana cetana cetanavati || 74|| cinmatra
    cidghana cetya cicchaya citsvarupini | nivrittirupini shantih pratishtha nityarupini || 75|| vidyarupa
    shantyatita kalapancakarupini | hrinkari hrimati hridya hricchaya harivahana || 76|| mulaprakritiravyakta
    vyaktavyaktavinodini | yajnarupa yajnabhoktri yajnangi yajnarupini || 77|| dikshita kshamana kshama
    kshitih kshantih shrutih smritih | eka'neka kamakala kalpa kalasvarupini || 78|| daksha dakshayani
    diksha dakshayajnavinashini | gayatri gaganakara girdevi garudasana || 79|| savitri sakaladhyaksha
    brahmani brahmanapriya | jagannatha jaganmurtih jaganmrityunivarini || 80|| drigrupa drishyanilaya
    drashtri mantri cirantani | vijnatri vipula vedya vriddha varshiyasi mahi || 81|| arya kuharini guhya
    gauri gautamapujita | nandini nalini nitya nitirnayavisharada || 82|| gatagatajna gandharvi girija
    garvanashini | priyavrata prama prana pramanajna priyamvada || 83|| asharira sharirastha namarupavivarjita
    | varnashramavibhagajna varnashramavivarjita || 84|| nityamukta nityatripta nirlepa niravagraha |
    icchajnanakriyashaktih indira bandhurakritih || 85|| manorathaprada mukhya manini manavarjita | niraga
    nirahankara nirnasha nirupaplava || 86|| vicitra citracaritra nishkala nigamalaya | brahmavidya brahmanadi
    bandhahantri balipriya || 87|| sulakshana lakshanajna sundarabhrulatancita | sumitra malini sima mudrini
    mudrikancita || 88|| rajasvala ramyamurtirjaya janmavivarjita | padmalaya padmapitha padmini padmavarnini
    || 89|| vishvambhara vishvagarbha vishveshi vishvatomukhi | advitiya sahasrakshi viradrupa vimocini
    || 90|| sutrarupa shastrakari shastrajna shastradharini | vedavidvedakridvedya vittajna vittashalini
    || 91|| vishada vaishnavi brahmi vairinci vakpradayini | vyakhyatri vamana vriddhih vishvanatha visharada
    || 92|| mudreshvari mundamala kali kankalarupini | maheshvarapritikari maheshvara pativrata || 93||
    brahmandamalini budhnya matangamunipujita | ishvari candika candi niyantri niyamasthita || 94|| sarvantaryamini
    sevya santatih santatiprada | tamalapallavashyama tamroshthi tandavapriya || 95|| natyalasyakari rambha
    natarajapriyangana | anangarupa'nangashriranangeshi vasundhara || 99|| samrajyadayini siddha siddheshi
    siddhidayini | siddhamata siddhapujya siddhartha vasudayini || 97|| bhaktimatkalpalatika bhaktida
    bhaktavatsala | pancashaktyarcitapada paramatmasvarupini || 98|| ajnanatimirajyotsna nityahlada niranjana
    | mugdha mugdhasmita maitri mugdhakeshi madhupriya || 99|| kalapini kamakala kamakelih kalavati |
    akhanda nirahankara pradhanapurusheshvari || 100|| rahahpujya rahahkeli rahahstutya harapriya | sharanya
    gahana guhya guhantahstha guhaprasu || 101|| svasamvedya svaprakasha svatmastha svargadayini | nishprapanca
    niradhara nityanityasvarupini || 102|| narmada nartaki kirtih nishkama nishkala kala | ashtamurtiramoghoma
    nandyadiganapujita || 103|| yantrarupa tantrarupa mantrarupa manonmani | shivakameshvari devi cidrupa
    cittarangini || 104|| citsvarupa citprakasha cinmurtirshcinmayi citih | murkhadura mohahantri mukhya
    krodamukhi sakhi || 105|| jnanajnatrijneyarupa vyomakara vilasini | vimarsharupini vashya vidhanajna
    vijrimbhita || 106|| ketakikusumapida kasturitilakojjvala | mrigya mrigakshi rasika mriganabhisugandhini
    || 107|| yakshakardamaliptangi yakshini yakshapujita | lasanmanikyakataka keyurojjvaladorlata || 108||
    sindurarajatsimanta subhruvalli sunasika | kaivalyada kantimati kathorakucamandala || 109|| talodari
    tamohantri trayastrimshatsuratmika | svayambhuh kusumamoda svayambhukusumapriya || 110|| svadhyayini
    sukharadhya virashrirvirapujita | dravini vidrumabhoshthi vegini vishnuvallabha || 111|| halamada
    lasadvani lola lilavati ratih | lopamudrarcita lakshmirahalyaparipujita || 112|| abrahmakitajanani
    kailasagirivasini | nidhishvari niratanka nishkalanka jaganmayi || 113|| adilakshmiranantashriracyuta
    tattvarupini | namajatyadirahita naranarayanarcita || 114|| guhyopanishadudgita lakshmivaninishevita
    | matangavarada siddha mahayogishvari guruh || 115|| gurupriya kularadhya kulasanketapalini | ciccandramandalantah
    stha cidakashasvarupini || 116|| anangashastratattvajna nanavidharasapriya | nirmala niravadyangi
    nitijna nitirupini || 117|| vyapini vibudhashreshtha kulashailakumarika | vishnuprasurviramata nasamanivirajita
    || 118|| nayika nagarisamstha nityatushta nitambini | pancabrahmamayi pranci brahmatmaikyasvarupini
    || 119|| sarvopanishadudgita sarvanugrahakarini | pavitra pavana puta paramatmasvarupini || 120||
    suryenduvahninayana suryamandalamadhyaga | gayatri gatrarahita suguna gunavarjita || 121|| rakshakari
    ramyarupa satvika sattvadayini | vishvatita vyomarupa sada'rcanajapapriya || 122|| atmabhurajita jishnuraja
    svaha svadha sudha | nanditasheshabhuvana namasankirtanapriya || 123|| gurumurtirgurumayi gurupadarcanapriya
    | gobrahmanatmika gurvi nilakanthi niramaya || 124|| manavi mantrajanani mahabhairavapujita | nityotsava
    nityapushta shyama yauvanashalini || 125|| mahaniya mahamurtirmahati saukhyasantatih | purnodari havirdhatri
    ganaradhya ganeshvari || 126|| gayana garvarahita svedabindullasanmukhi | tungastani tulashunya kanya
    kamalavasini || 127|| sha
  devanagari: ृण्वतीं श्यामगात्रीं न्यस्तैकाङ्घ्रीं सरोजे शशिशकलधरां वल्लकीं वादयन्तीम् । कल्हाराबद्धमौलिं
    नियमितलसच्चूलिकां रक्तवस्त्रां मातङ्गीं भूषिताङ्गीं मधुमदमुदितां चित्रकोद्भासिफालाम् ॥ पञ्चपूजा ।
    अथ सहस्रनामस्तोत्रम् । ॐ । सौभाग्यलक्ष्मीः सौन्दर्यनिधिः समरसप्रिया । सर्वकल्याणनिलया सर्वेशी सर्वमङ्गला
    ॥ १॥ सर्ववश्यकरी सर्वा सर्वमङ्गलदायिनी । सर्वविद्यादानदक्षा सङ्गीतोपनिषत्प्रिया ॥ २॥ सर्वभूतहृदावासा
    सर्वगीर्वाणपूजिता । समृद्धा सङ्गमुदिता सर्वलोकैकसंश्रया ॥ ३॥ सप्तकोटिमहामन्त्रस्वरूपा सर्वसाक्षिणी
    । सर्वाङ्गसुन्दरी सर्वगता सत्यस्वरूपिणी ॥ ४॥ समा समयसंवेद्या समयज्ञा सदाशिवा । सङ्गीतरसिका सर्वकलामयशुकप्रिया
    ॥ ५॥ चन्दनालेपदिग्धाङ्गी सच्चिदानन्दरूपिणी । कदम्बवाटीनिलया कमलाकान्तसेविता ॥ ६॥ कटाक्षोत्पन्नकन्दर्पा
    कटाक्षितमहेश्वरा । कल्याणी कमलासेव्या कल्याणाचलवासिनी ॥ ७॥ कान्ता कन्दर्पजननी करुणारससागरा । कलिदोषहरा
    काम्या कामदा कामवर्धिनी ॥ ८॥ कदम्बकलिकोत्तंसा कदम्बकुसुमाप्रिया । कदम्बमूलरसिका कामाक्षी कमलानना ॥
    ९॥ कम्बुकण्ठी कलालापा कमलासनपूजिता । कात्यायनी केलिपरा कमलाक्षसहोदरी ॥ १०॥ कमलाक्षी कलारूपा कोकाकारकुचद्वया
    । कोकिला कोकिलारावा कुमारजननी शिवा ॥ ११॥ सर्वज्ञा सन्ततोन्मत्ता सर्वैश्वर्यप्रदायिनी । सुधाप्रिया
    सुराराध्या सुकेशी सुरसुन्दरी ॥ १२॥ शोभना शुभदा शुद्धा शुद्धचित्तैकवासिनी । वेदवेद्या वेदमयी विद्याधरगणार्चिता
    ॥ १३॥ वेदान्तसारा विश्वेशी विश्वरूपा विरूपिणी । विरूपाक्षप्रिया विद्या विन्ध्याचलनिवासिनी ॥ १४॥ वीणावादविनोदज्ञा
    वीणागानविशारदा । वीणावती बिन्दुरूपा ब्रह्माणी ब्रह्मरूपिणी ॥ १५॥ पार्वती परमाऽचिन्त्या पराशक्तिः परात्परा
    । परानन्दा परेशानी परविद्या परापरा ॥ १६॥ भक्तप्रिया भक्तिगम्या भक्तानां परमा गतिः । भव्या भवप्रिया
    भीरुर्भवसागरतारिणी ॥ १७॥ भयघ्नी भावुका भव्या भामिनी भक्तपालिनी । भेदशून्या भेदहन्त्री भावना मुनिभाविता
    ॥ १८॥ माया महेश्वरी मान्या मातङ्गी मलयालया । महनीया मदोन्मत्ता मन्त्रिणी मन्त्रनायिका ॥ १९॥ महाऽऽनन्दा
    मनोगम्या मतङ्गकुलमण्डना । मनोज्ञा मानिनी माध्वी सिन्धुमध्यकृतालया ॥ २०॥ मधुप्रीता नीलकचा माध्वीरसमदालसा
    । पूर्णचन्द्राभवदना पूर्णा पुण्यफलप्रदा ॥ २१॥ पुलोमजार्चिता पूज्या पुरुषार्थप्रदायिनी । नारायणी नादरूपा
    नादब्रह्मस्वरूपिणी ॥ २२॥ नित्या नवनवाकारा नित्यानन्दा निराकुला । निटिलाक्षप्रिया नेत्री नीलेन्दीवरलोचना
    ॥ २३॥ तमालकोमलाकारा तरुणी तनुमध्यमा । तटित्पिशङ्गवसना तटित्कोटिसभद्युतिः ॥ २४॥ मधुरा मङ्गला मेध्या
    मधुपानप्रिया सखी । चित्कला चारुवदना सुखरूपा सुखप्रदा ॥ २५॥ कूटस्था कौलिनी कूर्मपीठस्था कुटिलालका ।
    शान्ता शान्तिमती शान्तिः श्यामला श्यामलाकृतिः ॥ २६॥ शङ्खिनी शङ्करी शैवी शङ्खकुण्डलमण्डिता । कुन्ददन्ता
    कोमलाङ्गी कुमारी कुलयोगिनी ॥ २७॥ निर्गर्भयोगिनीसेव्या निरन्तररतिप्रिया । शिवदूती शिवकरी जटिला जगदाश्रया
    ॥ । २८॥ शाम्भवी योगिनिलया परचैतन्यरूपिणी । दहराकाशनिलया दण्डिनीपरिपूजिता ॥ २९॥ सम्पत्करीगजारूढा सान्द्रानन्दा
    सुरेश्वरी । चम्पकोद्भासितकचा चन्द्रशेखरवल्लभा ॥ ३०॥ चारुरूपा चारुदन्ती चन्द्रिका शम्भुमोहिनी । विमला
    विदुषी वाणी कमला कमलासना ॥ ३१॥ करुणापूर्णहृदया कामेशी कम्बुकन्धरा । राजराजेश्वरी राजमातङ्गी राजवल्लभा
    ॥ ३२॥ सचिवा सचिवेशानी सचिवत्वप्रदायिनी । पञ्चबाणार्चिता बाला पञ्चमी परदेवता ॥ ३३॥ उमा महेश्वरी गौरी
    सङ्गीतज्ञा सरस्वती । कविप्रिया काव्यकला कलौ सिद्धिप्रदायिनी ॥ ३४॥ ललितामन्त्रिणी रम्या ललिताराज्यपालिनी
    । ललितासेवनपरा ललिताज्ञावशंवदा ॥ ३५॥ ललिताकार्यचतुरा ललिताभक्तपालिनी । ललितार्धासनारूढा लावण्यरसशेवधिः
    ॥ ३६॥ रञ्जनी लालितशुका लसच्चूलीवरान्विता । रागिणी रमणी रामा रती रतिसुखप्रदा ॥ ३७॥ भोगदा भोग्यदा भूमिप्रदा
    भूषणशालिनी । पुण्यलभ्या पुण्यकीर्तिः पुरन्दरपुरेश्वरी ॥ ३८॥ भूमाऽऽनन्दा भूतिकरी क्लीङ्कारी क्लिन्नरूपिणी
    । भानुमण्डलमध्यस्था भामिनी भारती धृतिः ॥ ३९॥ नारायणार्चिता नाथा नादिनी नादरूपिणी । पञ्चकोणास्थिता
    लक्ष्मीः पुराणी पुररूपिणी ॥ ४०॥ चक्रस्थिता चक्ररूपा चक्रिणी चक्रनायिका । षट्चक्रमण्डलान्तःस्था ब्रह्मचक्रनिवासिनी
    ॥ ४१॥ अन्तरभ्यर्चनप्रीता बहिरर्चनलोलुपा । पञ्चाशत्पीठमध्यस्था मातृकावर्णरूपिणी ॥ ४२॥ महादेवी महाशक्तिः
    महामाया महामतिः । महारूपा महादीप्तिः महालावण्यशालिनी ॥ ४३॥ माहेन्द्री मदिरादृप्ता मदिरासिन्धुवासिनी
    । मदिरामोदवदना मदिरापानमन्थरा ॥ ४४॥ दुरितघ्नी दुःखहन्त्री दूती दूतरतिप्रिया । वीरसेव्या विघ्नहरा योगिनी
    गणसेविता ॥ ४५॥ निजवीणारवानन्दनिमीलितविलोचना । वज्रेश्वरी वश्यकरी सर्वचित्तविमोहिनी ॥ ४६॥ शबरी शम्बराराध्या
    शाम्बरी सामसंस्तुता । त्रिपुरामन्त्रजपिनी त्रिपुरार्चनतत्परा ॥ ४७॥ त्रिलोकेशी त्रयीमाता त्रिमूर्तिस्त्रिदिवेश्वरी
    । ऐङ्कारी सर्वजननी सौःकारी संविदीश्वरी ॥ ४८॥ बोधा बोधकरी बोध्या बुधाराध्या पुरातनी । भण्डसोदरसंहर्त्री
    भण्डसैन्यविनाशिनी ॥ ४९॥ गेयचक्ररथारूढा गुरुमूर्तिः कुलाङ्गना । गान्धर्वशास्त्रमर्मज्ञा गन्धर्वगणपूजिता
    ॥ ५०॥ जगन्माता जयकरी जननी जनदेवता । शिवाराध्या शिवार्धाङ्गी शिञ्जन्मञ्जीरमण्डिता ॥ ५१॥ सर्वात्मिका
    ऋषीकेशी सर्वपापविनाशिनी । सर्वरोगहरा साध्या धर्मिणी धर्मरूपिणी ॥ ५२॥ आचारलभ्या स्वाचारा खेचरी योनिरूपिणी
    । पतिव्रता पाशहन्त्री परमार्थस्वरूपिणी ॥ ५३॥ पण्डिता परिवाराढ्या पाषण्डमतभञ्जनी । श्रीकरी श्रीमती
    देवी बिन्दुनादस्वरूपिणी ॥ ५४॥ अपर्णा हिमवत्पुत्री दुर्गा दुर्गतिहारिणी । व्यालोलशङ्खाताटङ्का विलसद्गण्डपालिका
    ॥ ५५॥ सुधामधुरसालापा सिन्दूरतिलकोज्ज्वला । अलक्तकारक्तपादा नन्दनोद्यानवासिनी ॥ ५६॥ वासन्तकुसुमापीडा
    वसन्तसमयप्रिया । ध्याननिष्ठा ध्यानगम्या ध्येया ध्यानस्वरूपिणी ॥ ५७॥ दारिद्र्यहन्त्री दौर्भाग्यशमनी
    दानवान्तका । तीर्थरूपा त्रिनयना तुरीया दोषवर्जिता ॥ ५८॥ मेधाप्रदायिनी मेध्या मेदिनी मदशालिनी । मधुकैटभसंहर्त्री
    माधवी माधवप्रिया ॥ ५९॥ महिला महिमासारा शर्वाणी शर्मदायिनी । रुद्राणी रुचिरा रौद्री रुक्मभूषणभूषिता
    ॥ ६०॥ अम्बिका जगतां धात्री जटिनी धूर्जटिप्रिया । सुक्ष्मस्वरूपिणी सौम्या सुरुचिः सुलभा शुभा ॥ ६१॥
    विपञ्चीकलनिक्काणविमोहितजगत्त्रया । भैरवप्रेमनिलया भैरवी भासुराकृतिः ॥ ६२॥ पुष्पिणी पुण्यनिलया पुण्यश्रवणकीर्तना
    । कुरुकुल्ला कुण्डलिनी वागीशी नकुलेश्वरी ॥ ६३॥ वामकेशी गिरिसुता वार्तालीपरिपूजिता । वारुणीमदरक्ताक्षी
    वन्दारुवरदायिनी ॥ ६४॥ कटाक्षस्यन्दिकरुणा कन्दर्पमदवर्धिनी । दूर्वाश्यामा दुष्टहन्त्री दुष्टग्रहविभेदिनी
    ॥ ६५॥ सर्वशत्रुक्षयकरी सर्वसम्पत्प्रवर्धिनी । कबरीशोभिकल्हारा कलशिञ्जितमेखला ॥ ६६॥ मृणालीतुल्वदोर्वल्ली
    मृडानी मृत्युवर्जिता । मृदुला मृत्युसंहर्त्री मञ्जुला मञ्जुभाषिणी ॥ ६७॥ कर्पूरवीटीकबला कमनीयकपोलभूः
    । कर्पूरक्षोददिग्धाङ्गी कर्त्री कारणवर्जिता ॥ ६८॥ अनादिनिधना धात्री धात्रीधरकुलोद्भवा । स्तोत्रप्रिया
    स्तुतिमयी मोहिनी मोहहारिणी ॥ ६९॥ जीवरूपा जीवकारी जीवन्मुक्तिप्रदायिनी । भद्रपीठस्थिता भद्रा भद्रदा
    भर्गभामिनी ॥ ७०॥ भगानन्दा भगमयी भगलिङ्गा भगेश्वरी । मत्तमातङ्गगमना मातङ्गकुलमञ्जरी ॥ ७१॥ राजहंसगती
    राज्ञी राजराज समर्चिता । भवानी पावनी काली दक्षिणा दक्षकन्यका ॥ ७२॥ हव्यवाहा हविर्भोक्त्री हारिणी दुःखहारिणी
    । संसारतारिणी सौम्या सर्वेशी समरप्रया ॥ ७३॥ स्वप्नवती जागरिणी सुषुप्ता विश्वरूपिणी । तैजसी प्राज्ञकलना
    चेतना चेतनावती ॥ ७४॥ चिन्मात्रा चिद्घना चेत्या चिच्छाया चित्स्वरूपिणी । निवृत्तिरूपिणी शान्तिः प्रतिष्ठा
    नित्यरूपिणी ॥ ७५॥ विद्यारूपा शान्त्यतीता कलापञ्चकरूपिणी । ह्रीङ्कारी ह्रीमती हृद्या ह्रीच्छाया हरिवाहना
    ॥ ७६॥ मूलप्रकृतिरव्यक्ता व्यक्ताव्यक्तविनोदिनी । यज्ञरूपा यज्ञभोक्त्री यज्ञाङ्गी यज्ञरूपिणी ॥ ७७॥
    दीक्षिता क्षमणा क्षामा क्षितिः क्षान्तिः श्रुतिः स्मृतिः । एकाऽनेका कामकला कल्पा कालस्वरूपिणी ॥ ७८॥
    दक्षा दाक्षायणी दीक्षा दक्षयज्ञविनाशिनी । गायत्री गगनाकारा गीर्देवी गरुडासना ॥ ७९॥ सावित्री सकलाध्यक्षा
    ब्रह्माणी ब्राह्मणप्रिया । जगन्नाथा जगन्मूर्तिः जगन्मृत्युनिवारिणी ॥ ८०॥ दृग्रूपा दृश्यनिलया द्रष्ट्री
    मन्त्री चिरन्तनी । विज्ञात्री विपुला वेद्या वृद्धा वर्षीयसी मही ॥ ८१॥ आर्या कुहरिणी गुह्या गौरी गौतमपूजिता
    । नन्दिनी नलिनी नित्या नीतिर्नयविशारदा ॥ ८२॥ गतागतज्ञा गन्धर्वी गिरिजा गर्वनाशिनी । प्रियव्रता प्रमा
    प्राणा प्रमाणज्ञा प्रियंवदा ॥ ८३॥ अशरीरा शरीरस्था नामरूपविवर्जिता । वर्णाश्रमविभागज्ञा वर्णाश्रमविवर्जिता
    ॥ ८४॥ नित्यमुक्ता नित्यतृप्ता निर्लेपा निरवग्रहा । इच्छाज्ञानक्रियाशक्तिः इन्दिरा बन्धुराकृतिः ॥ ८५॥
    मनोरथप्रदा मुख्या मानिनी मानवर्जिता । नीरागा निरहङ्कारा निर्नाशा निरुपप्लवा ॥ ८६॥ विचित्रा चित्रचारित्रा
    निष्कला निगमालया । ब्रह्मविद्या ब्रह्मनाडी बन्धहन्त्री बलिप्रिया ॥ ८७॥ सुलक्षणा लक्षणज्ञा सुन्दरभ्रूलताञ्चिता
    । सुमित्रा मालिनी सीमा मुद्रिणी मुद्रिकाञ्चिता ॥ ८८॥ रजस्वला रम्यमूर्तिर्जया जन्मविवर्जिता । पद्मालया
    पद्मपीठा पद्मिनी पद्मवर्णिनी ॥ ८९॥ विश्वम्भरा विश्वगर्भा विश्वेशी विश्वतोमुखी । अद्वितीया सहस्राक्षी
    विराड्रूपा विमोचिनी ॥ ९०॥ सूत्ररूपा शास्त्रकरी शास्त्रज्ञा शस्त्रधारिणी । वेदविद्वेदकृद्वेद्या वित्तज्ञा
    वित्तशालिनी ॥ ९१॥ विशदा वैष्णवी ब्राह्मी वैरिञ्ची वाक्प्रदायिनी । व्याख्यात्री वामना वृद्धिः विश्वनाथा
    विशारदा ॥ ९२॥ मुद्रेश्वरी मुण्डमाला काली कङ्कालरूपिणी । महेश्वरप्रीतिकरी महेश्वर पतिव्रता ॥ ९३॥ ब्रह्माण्डमालिनी
    बुध्न्या मतङ्गमुनिपूजिता । ईश्वरी चण्डिका चण्डी नियन्त्री नियमस्थिता ॥ ९४॥ सर्वान्तर्यामिणी सेव्या
    सन्ततिः सन्ततिप्रदा । तमालपल्लवश्यामा ताम्रोष्ठी ताण्डवप्रिया ॥ ९५॥ नाट्यलास्यकरी रम्भा नटराजप्रियाङ्गना
    । अनङ्गरूपाऽनङ्गश्रीरनङ्गेशी वसुन्धरा ॥ ९९॥ साम्राज्यदायिनी सिद्धा सिद्धेशी सिद्धिदायिनी । सिद्धमाता
    सिद्धपूज्या सिद्धार्था वसुदायिनी ॥ ९७॥ भक्तिमत्कल्पलतिका भक्तिदा भक्तवत्सला । पञ्चशक्त्यर्चितपदा परमात्मस्वरूपिणी
    ॥ ९८॥ अज्ञानतिमिरज्योत्स्ना नित्याह्लादा निरञ्जना । मुग्धा मुग्धस्मिता मैत्री मुग्धकेशी मधुप्रिया
    ॥ ९९॥ कलापिनी कामकला कामकेलिः कलावती । अखण्डा निरहङ्कारा प्रधानपुरुषेश्वरी ॥ १००॥ रहःपूज्या रहःकेली
    रहःस्तुत्या हरप्रिया । शरण्या गहना गुह्या गुहान्तःस्था गुहप्रसू ॥ १०१॥ स्वसंवेद्या स्वप्रकाशा स्वात्मस्था
    स्वर्गदायिनी । निष्प्रपञ्चा निराधारा नित्यानित्यस्वरूपिणी ॥ १०२॥ नर्मदा नर्तकी कीर्तिः निष्कामा निष्कला
    कला । अष्टमूर्तिरमोघोमा नन्द्यादिगणपूजिता ॥ १०३॥ यन्त्ररूपा तन्त्ररूपा मन्त्ररूपा मनोन्मनी । शिवकामेश्वरी
    देवी चिद्रूपा चित्तरङ्गिणी ॥ १०४॥ चित्स्वरूपा चित्प्रकाशा चिन्मूर्तिर्श्चिन्मयी चितिः । मूर्खदूरा
    मोहहन्त्री मुख्या क्रोडमुखी सखी ॥ १०५॥ ज्ञानज्ञातृज्ञेयरूपा व्योमाकारा विलासिनी । विमर्शरूपिणी वश्या
    विधानज्ञा विजृम्भिता ॥ १०६॥ केतकीकुसुमापीडा कस्तूरीतिलकोज्ज्वला । मृग्या मृगाक्षी रसिका मृगनाभिसुगन्धिनी
    ॥ १०७॥ यक्षकर्दमलिप्ताङ्गी यक्षिणी यक्षपूजिता । लसन्माणिक्यकटका केयूरोज्ज्वलदोर्लता ॥ १०८॥ सिन्दूरराजत्सीमन्ता
    सुभ्रूवल्ली सुनासिका । कैवल्यदा कान्तिमती कठोरकुचमण्डला ॥ १०९॥ तलोदरी तमोहन्त्री त्रयस्त्रिंशत्सुरात्मिका
    । स्वयम्भूः कुसुमामोदा स्वयम्भुकुसुमप्रिया ॥ ११०॥ स्वाध्यायिनी सुखाराध्या वीरश्रीर्वीरपूजिता । द्राविणी
    विद्रुमाभोष्ठी वेगिनी विष्णुवल्लभा ॥ १११॥ हालामदा लसद्वाणी लोला लीलावती रतिः । लोपामुद्रार्चिता लक्ष्मीरहल्यापरिपूजिता
    ॥ ११२॥ आब्रह्मकीटजननी कैलासगिरिवासिनी । निधीश्वरी निरातङ्का निष्कलङ्का जगन्मयी ॥ ११३॥ आदिलक्ष्मीरनन्तश्रीरच्युता
    तत्त्वरूपिणी । नामजात्यादिरहिता नरनारायणार्चिता ॥ ११४॥ गुह्योपनिषदुद्गीता लक्ष्मीवाणीनिषेविता । मतङ्गवरदा
    सिद्धा महायोगीश्वरी गुरुः ॥ ११५॥ गुरुप्रिया कुलाराध्या कुलसङ्केतपालिनी । चिच्चन्द्रमण्डलान्तः स्था
    चिदाकाशस्वरूपिणी ॥ ११६॥ अनङ्गशास्त्रतत्त्वज्ञा नानाविधरसप्रिया । निर्मला निरवद्याङ्गी नीतिज्ञा नीतिरूपिणी
    ॥ ११७॥ व्यापिनी विबुधश्रेष्ठा कुलशैलकुमारिका । विष्णुप्रसूर्वीरमाता नासामणिविराजिता ॥ ११८॥ नायिका
    नगरीसंस्था नित्यतुष्टा नितम्बिनी । पञ्चब्रह्ममयी प्राञ्ची ब्रह्मात्मैक्यस्वरूपिणी ॥ ११९॥ सर्वोपनिषदुद्गीता
    सर्वानुग्रहकारिणी । पवित्रा पावना पूता परमात्मस्वरूपिणी ॥ १२०॥ सूर्येन्दुवह्निनयना सूर्यमण्डलमध्यगा
    । गायत्री गात्ररहिता सुगुणा गुणवर्जिता ॥ १२१॥ रक्षाकरी रम्यरुपा सात्विका सत्त्वदायिनी । विश्वातीता
    व्योमरूपा सदाऽर्चनजपप्रिया ॥ १२२॥ आत्मभूरजिता जिष्णुरजा स्वाहा स्वधा सुधा । नन्दिताशेषभुवना नामसङ्कीर्तनप्रिया
    ॥ १२३॥ गुरुमूर्तिर्गुरुमयी गुरुपादार्चनप्रिया । गोब्राह्मणात्मिका गुर्वी नीलकण्ठी निरामया ॥ १२४॥ मानवी
    मन्त्रजननी महाभैरवपूजिता । नित्योत्सवा नित्यपुष्टा श्यामा यौवनशालिनी ॥ १२५॥ महनीया महामूर्तिर्महती
    सौख्यसन्ततिः । पूर्णोदरी हविर्धात्री गणाराध्या गणेश्वरी ॥ १२६॥ गायना गर्वरहिता स्वेदबिन्दूल्लसन्मुखी
    । तुङ्गस्तनी तुलाशून्या कन्या कमलवासिनी ॥ १२७॥ श
