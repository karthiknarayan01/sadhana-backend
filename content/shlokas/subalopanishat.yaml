id: subalopanishat
category: upanishad
name:
  english: subalopanishat
  devanagari: सुबालोपनिषत्
content:
  english: '|| subalopanishat || om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya
    purnamevavashishyate || om shantih shantih shantih || || prathamah khandah || om tadahuh kim tadasittasmai
    sa hovaca na sannasanna sadasaditi || 1 || tasmattamah sanjayate tamaso bhutadirbhutaderakashamakashadvayurvayoragniragnerapo''dbhyah
    prithivi || 2 || tadandam samabhavattatsamvatsaramatramushitva dvidhakarodadhastadbhumimuparishtadakasham
    madhye purusho divyah sahasrashirsha purushah sahasrakshah sahasrapat | sahasrabahuriti || 3 || so''gre
    bhutanam mrityumasrijantryaksharam trishiraskam tripadam khandaparashum || 4 || tasya brahma bibheti
    sa brahmanameva vivesha sa manasansapta putranasrijatte ha virajah sapta manasanasrijante ha prajapatayah
    || 5 || brahmano''sya mukhamasidbahu rajanyah kritah | uru tadasya yadvaishyah padbhyam shudro ajayata
    | candrama manaso jatashcakshoh suryo ajayata | shrotradvayushca pranashca hridayatsarvamidam jayate
    || 6 || || dvitiyah khandah || apanannishada yaksharakshasagandharvashcasthibhyah parvata lomabhya
    oshadhivanaspatayo lalatatkrodhajo rudro jayate || 1 || tasyaitasya mahato bhutasya nihshvasitamevaitadyadrigvedo
    yajurvedah samavedo''tharvavedah shiksha kalpo vyakaranam niruktam chando jyotishamayanam nyayo mimamsa
    dharmashastrani vyakhyananyupavyakhyanani ca sarvani ca bhutani || 2 || hiranyajyotiryasminnayamatmadhikshiyanti
    bhuvanani vishva | atmanam dvidhakarodardhena stri ardhena purusho devo bhutva devanasrijadrishirbhutva
    rishinyaksharakshasagandharvangramyanaranyamshca pashunasrijaditara gauritaro''nadvanitaro vadavetaro''shva
    itara gardabhitaro gardabha itara vishvambharitaro vishvambharah || 3 || so''nte vaishvanaro bhutva
    sandagdhva sarvani bhutani prithivyapsu praliyata apastejasi praliyante tejo vayau viliyate vayurakashe
    viliyata akashamindriyeshvindriyani tanmatreshu tanmatrani bhutadau viliyante bhutadirmahati viliyate
    mahanavyakte viliyate''vyaktamakshare viliyate aksharam tamasi viliyate tamah pare deva ekibhavati
    parastanna sannasanna sadasadityetannirvananushasanamiti vedanushasanamiti vedanushasanam || 4 ||
    || tritiyah khandah || asadva idamagra asidajatamabhutamapratishthitamashabdamasparshamarupamarasamagandhamavyayamamahantamabrihantamajamatmanam
    matva dhiro na shocati || 1 || apramanamamukhamashrotramavagamano''tejaskam acakshushkamanamagotramashiraskam
    apanipadamasnigdhamalohitamaprameyam ahrasvamadirghamasthulamananvanalpamaparam anirdeshyamanapavritamapratarkyam
    aprakashyamasamvritamanantaramabahyam na tadashnati kincana na tadashnati kashcana || 2 || etadvai
    satyena danena tapasa''nashakena brahmacaryena nirvedanenanashakena shadangenaiva sadhayedetattrayam
    viksheta damam danam dayamiti na tasya prana utkramantyatraiva samavaliyante brahmaiva sanbrahmapyeti
    ya evam veda || 3 || || caturthah khandah || hridayasya madhye lohitam mamsapindam yasmimstaddaharam
    pundarikam kumudamivanekadha vikasitam hridayasya dasha chidrani bhavanti yeshu pranah pratishthitah
    || 1 || sa yada pranena saha samyujyate tada pashyati nadyo nagarani bahuni vividhani ca yada vyanena
    saha samyujyate tada pashyati devamshca rishimshca yadapanena saha samyujyate tada pashyati yaksharakshasagandharvanyada
    udanena saha samyujyate tada pashyati devalokandevanskandam jayantam ceti yada samanena saha samyujyate
    tada pashyati devalokandhanani ca yada vairambhena saha samyujyate tada pashyati drishtam ca shrutam
    ca bhuktam cabhuktam ca saccasacca sarvam pashyati || 2 || athema dasha dasha nadyo bhavanti | tasamekaikasya
    dvasaptatirdvasaptatih shakha nadisahasrani bhavanti yasminnayamatma svapiti shabdanam ca karotyatha
    yaddvitiye sankoshe svapiti tademam ca lokam param ca lokam pashyati sarvanchabdanvijanati sa samprasada
    ityacakshate pranah shariram parirakshati haritasya nilasya pitasya lohitasya shvetasya nadyo rudhirasya
    purnah || 3 || athatraitaddaharam pundarikam kumudamivanekadha vikasitam yatha keshah sahasradha bhinnastatha
    hita nama nadyo bhavanti hridyakashe pare koshe divyo''yamatma svapiti yatra supto na kancana kamam
    kamayate na kancana svapnam pashyati na tatra deva na devaloka yajna na yajna va na mata na pita na
    bandhurna bandhavo na steno na brahmaha tejaskayamamritam salila evedam salilam vanam bhuyastenaiva
    margena jagraya dhavati samraditi hovaca || 4 || || pancamah khandah || sthanani sthanibhyo yacchati
    nadi tesham nibandhanam cakshuradhyatmam drashtavyamadhibhutamadityastatradhidaivatam nadi tesham
    nibandhanam yashcakshushi yo drashtavye ya aditye yo nadyam yah prane yo vijnane ya anande yo hridyakashe
    ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 1 || shrotramadhyatmam shrotavyamadhibhutam dishastatradhidaivatam nadi tesham nibandhanam yah
    shrotre yah shrotavye yo dikshu yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || 2 || nasadhyatmam ghratavyamadhibhutam
    prithivi tatradhidaivatam nadi tesham nibandhanam yo nasayam yo ghratavye yah prithivyam yo nadyam
    yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 3 || jihvadhyatmam rasayitavyamadhibhutam varunastatradhidaivatam nadi tesham nibandhanam yò jihvayam
    rasayitavye yo varune yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so''yamatma tamatmanamupasitajaramamamritamabhayamashokamanantam || 4 || tvagadhyatmam sparshayitavyamadhibhutam
    vayustatradhidaivatam nadi tesham nibandhanam yastvaci yah sparshayitavye yo vayau yo nadyam yah prane
    yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 5 || mano''dhyatmam mantavyamadhibhutam candrastatradhidaivatam nadi tesham nibandhanam yo manasi
    yo mantavye yashcandre yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || 6 || buddhiradhyatmam
    boddhavyamadhibhutam brahma tatradhidaivatam nadi tesham nibandhanam yo buddhau yo boddhavye yo brahmani
    yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so''yamatma
    tamatmanamupasitajaramamritamabhayamashokamanantam || 7 || ahankaro''dhyatmamahankartavyamadhibhutam
    rudrastatradhidaivatam nadi tesham nibandhanam yo''hankare yo''hankartavye yo rudre yo nadyam yah
    prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 8 || cittamadhyatmam cetayitavyamadhibhutam kshetrajnastatradhidaivatam nadi tesham nibandhanam
    yashcitte yashcetayitavye yah kshetrajne yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya
    etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam ||
    9 || vagadhyatmam vaktavyamadhibhutamagnistatradhidaivatam nadi tesham nibandhanam yo vaci yo vaktavye
    yo''gnau yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati
    so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || 10 || hastavadhyatmamadatavyamadhibhutamindrastatradhidaivatam
    nadi tesham nibandhanam yo haste ya adatavye ya indre yo nadyam yah prane yo vijnane ya anande yo
    hridyakashe ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 11 || padavadhyatmam gantavyamadhibhutam vishnustatradhidaivatam nadi tesham nibandhanam yah pade
    yo gantavye yo vishnau yo nadyam yah prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare
    samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam || 12 || payuradhyatmam visarjayitavyamadhibhutam
    mrityustatradhidaivatam nadi tesham nibandhanam yah payau yo visarjayitavye yo mrityau yo nadyam yah
    prane yo vijnane ya anande yo hridyakashe ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 13 || upastho''dhyatmamanandayitavyamadhibhutam prajapatistatradhidaivatam nadi tesham nibandhanam
    ya upasthe ya anandayitavye yah prajapatau yo nadyam yah prane yo vijnane ya anande yo hridyakashe
    ya etasminsarvasminnantare samcarati so''yamatma tamatmanamupasitajaramamritamabhayamashokamanantam
    || 14 || esha sarvajna esha sarveshvara esha sarvadhipatiresho''ntaryamyesha yonih sarvasya sarvasaukhyerupasyamano
    na ca sarvasaukhyanyupasyati vedashastrairupasyamano na ca vedashastranyupasyati yasyannamidam sarve
    na ca yo''nnam bhavatyatah param sarvanayanah prashastannamayo bhutatma pranamaya indriyatma manomayah
    sankalpatma vijnanamayah kalatmanandamayo layatmaikatvam nasti dvaitam kuto martyam nastyamritam kuto
    nantahprajno na bahihprajno nobhayatahprajno na prajnanaghano na prajno naprajno''pi no viditam vedyam
    nastityetannirvananushasanamiti vedanushasanamiti vedanushasanam || 15 || || shashthah khandah ||
    naiveha kincanagra asidamulamanadhara imah prajah prajayante || 1 || cakshushca drashtavyam ca narayanah
    shrotram ca shrotavyam ca narayano ghranam ca ghratavyam ca narayano jihva ca rasayitavyam ca narayanastvak
    ca sparshayitavyam ca narayano manashca mantavyam ca narayano buddhishca boddhavyam ca narayano''hankarashcahankartavyam
    ca narayanashcittam ca cetayitavyam ca narayano vak ca vaktavyam ca narayano hastau cadatavyam ca
    narayanah padau ca gantavyam ca narayanah payushca visarjayitavyam ca narayana upasthashcanandayitavyam
    ca narayano dhata vidhata karta vikarta divyo deva eko narayanah || 2 || aditya rudra maruto vasavo''shvinavrico
    yajumshi samani mantro''gnirajyahutirnarayana udbhavah sambhavo divyo deva eko narayanah || 3 || mata
    pita bhrata nivasah sharanam suhridgatirnarayanah || 4 || viraja sudarshanajitasomyamoghakumaramritasatyamadhyamanasirashishutasurasuryabhasvaravijneyani
    nadinamani divyani || 5 || garjati gayati vati varshati varuno''ryama candramah kalah kalirdhata brahma
    prajapatirmaghava divasashcardhadivasashca kalah kalpashcordhvam ca dishashca sarvam narayanah ||
    6 || purusha evedam sarvam yadbhutam yacca bhavyam | utamritatvasyeshano yadannenatirohati | tadvishnoh
    paramam padam sada pashyanti surayah | diviva cakshuratatam | tadvipraso vipanyavo jagrivamsah samindhate
    | vishnoryatparamam padam | tadetannirvananushasanamiti vedanushasanamiti vedanushasanam || 7 || ||
    saptamah khandah || antahsharire nihito guhayamaja eko nityo yasya prithivi shariram yah prithivimantare
    samcaran yam prithivi na veda | yasyapah shariram yo''pontare samcaranyamapo na viduh | yasya tejah
    shariram yastejontare samcaran yam tejo na veda | yasya vayuh shariram yo vayumantare samcaran ya
    vayurna veda | yasyakashah shariram ya akashamantare samcaran yamakasho na veda | yasya manah shariram
    yo manontare samcaran yam mano na veda| yasya buddhih shariram yo buddhimantare samcaran yam buddhirna
    veda | yasyahankarah shariram yo''hankaramantare samcaran yamahankaro na veda | yasya cittam shariram
    yashcittamantare samcaran yam cittam na veda | yasyavyaktam shariram yo''vyaktamantare samcaran yamavyaktam
    na veda | yasyaksharam shariram yo''ksharamantare samcaran yamaksharam na veda | yasya mrityuh shariram
    yo mrityumantare samcaran yam mrityurna veda | sa esha sarvabhutantaratmapahatapapma divyo deva eko
    narayanah || 1 || etam vidyamapantaratamaya dadavapantaratamo brahmane dadau brahma ghorangirase dadau
    ghorangira raikvaya dadau raikvo ramaya dadau ramah sarvebhyo bhutebhyo dadavityevam nirvananushasanamiti
    vedanushasanamiti vedanushasanam || 2 || || ashtamah khandah || antahsharire nihito guhayam shuddhah
    so''yamatma sarvasya medomamsakledavakirne shariramadhye''tyantopahate citrabhittipratikashe gandharvanagaropame
    kadaligarbhavannihsare jalabudbudavaccancale nihsritamatmanamacintyarupam divyam devamasangam shuddham
    tejaskayamarupam sarveshvaramacintyamashariram nihitam guhayamamritam vibhrajamanamanandam tam pashyanti
    vidvamsastena laye na pashyanti || 1 || || navamah khandah || atha hainam'
  devanagari: ॥ सुबालोपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ प्रथमः खण्डः ॥ ॐ तदाहुः किं तदासीत्तस्मै स होवाच न सन्नासन्न सदसदिति
    ॥ १ ॥ तस्मात्तमः सञ्जायते तमसो भूतादिर्भूतादेराकाशमाकाशाद्वायुर्वायोरग्निरग्नेरापोऽद्भ्यः पृथिवी ॥
    २ ॥ तदण्डं समभवत्तत्संवत्सरमात्रमुषित्वा द्विधाकरोदधस्ताद्भूमिमुपरिष्टादाकाशं मध्ये पुरुषो दिव्यः
    सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् । सहस्रबाहुरिति ॥ ३ ॥ सोऽग्रे भूतानां मृत्युमसृजन्त्र्यक्षरं
    त्रिशिरस्कं त्रिपादं खण्डपरशुम् ॥ ४ ॥ तस्य ब्रह्मा बिभेति स ब्रह्माणमेव विवेश स मानसान्सप्त पुत्रानसृजत्ते
    ह विराजः सप्त मानसानसृजन्ते ह प्रजापतयः ॥ ५ ॥ ब्राह्मणोऽस्य मुखमासीद्बाहू राजन्यः कृतः । ऊरू तदस्य
    यद्वैश्यः पद्भ्यां शूद्रो अजायत । चन्द्रमा मनसो जातश्चक्षोः सूर्यो अजायत । श्रोत्राद्वायुश्च प्राणश्च
    हृदयात्सर्वमिदं जायते ॥ ६ ॥ ॥ द्वितीयः खण्डः ॥ अपानान्निषादा यक्षराक्षसगन्धर्वाश्चास्थिभ्यः पर्वता
    लोमभ्य ओषधिवनस्पतयो ललाटात्क्रोधजो रुद्रो जायते ॥ १ ॥ तस्यैतस्य महतो भूतस्य निःश्वसितमेवैतद्यदृग्वेदो
    यजुर्वेदः सामवेदोऽथर्ववेदः शिक्षा कल्पो व्याकरणं निरुक्तं छन्दो ज्योतिषामयनं न्यायो मीमांसा धर्मशास्त्राणि
    व्याख्यानान्युपव्याख्यानानि च सर्वाणि च भूतानि ॥ २ ॥ हिरण्यज्योतिर्यस्मिन्नयमात्माधिक्षियन्ति भुवनानि
    विश्वा । आत्मानं द्विधाकरोदर्धेन स्त्री अर्धेन पुरुषो देवो भूत्वा देवानसृजदृषिर्भूत्वा ऋषीन्यक्षराक्षसगन्धर्वान्ग्राम्यानारण्यांश्च
    पशूनसृजदितरा गौरितरोऽनड्वानितरो वडवेतरोऽश्व इतरा गर्दभीतरो गर्दभ इतरा विश्वम्भरीतरो विश्वम्भरः ॥ ३
    ॥ सोऽन्ते वैश्वानरो भूत्वा सन्दग्ध्वा सर्वाणि भूतानि पृथिव्यप्सु प्रलीयत आपस्तेजसि प्रलीयन्ते तेजो
    वायौ विलीयते वायुराकाशे विलीयत आकाशमिन्द्रियेष्विन्द्रियाणि तन्मात्रेषु तन्मात्राणि भूतादौ विलीयन्ते
    भूतादिर्महति विलीयते महानव्यक्ते विलीयतेऽव्यक्तमक्षरे विलीयते अक्षरं तमसि विलीयते तमः परे देव एकीभवति
    परस्तान्न सन्नासन्न सदसदित्येतन्निर्वाणानुशासनमिति वेदानुशासनमिति वेदानुशासनम् ॥ ४ ॥ ॥ तृतीयः खण्डः
    ॥ असद्वा इदमग्र आसीदजातमभूतमप्रतिष्ठितमशब्दमस्पर्शमरूपमरसमगन्धमव्ययममहान्तमबृहन्तमजमात्मानं मत्वा
    धीरो न शोचति ॥ १ ॥ अप्रमाणममुखमश्रोत्रमवागमनोऽतेजस्कम् अचक्षुष्कमनामगोत्रमशिरस्कम् अपाणिपादमस्निग्धमलोहितमप्रमेयम्
    अह्रस्वमदीर्घमस्थूलमनण्वनल्पमपारम् अनिर्देश्यमनपावृतमप्रतर्क्यम् अप्रकाश्यमसंवृतमनन्तरमबाह्यं न तदश्नाति
    किञ्चन न तदश्नाति कश्चन ॥ २ ॥ एतद्वै सत्येन दानेन तपसाऽनाशकेन ब्रह्मचर्येण निर्वेदनेनानाशकेन षडङ्गेनैव
    साधयेदेतत्त्रयं वीक्षेत दमं दानं दयामिति न तस्य प्राणा उत्क्रामन्त्यत्रैव समवलीयन्ते ब्रह्मैव सन्ब्रह्माप्येति
    य एवं वेद ॥ ३ ॥ ॥ चतुर्थः खण्डः ॥ हृदयस्य मध्ये लोहितं मांसपिण्डं यस्मिंस्तद्दहरं पुण्डरीकं कुमुदमिवानेकधा
    विकसितं हृदयस्य दश छिद्राणि भवन्ति येषु प्राणाः प्रतिष्ठिताः ॥ १ ॥ स यदा प्राणेन सह संयुज्यते तदा
    पश्यति नद्यो नगराणि बहूनि विविधानि च यदा व्यानेन सह संयुज्यते तदा पश्यति देवांश्च ऋषींश्च यदापानेन
    सह संयुज्यते तदा पश्यति यक्षराक्षसगन्धर्वान्यदा उदानेन सह संयुज्यते तदा पश्यति देवलोकान्देवान्स्कन्दं
    जयन्तं चेति यदा समानेन सह संयुज्यते तदा पश्यति देवलोकान्धनानि च यदा वैरम्भेण सह संयुज्यते तदा पश्यति
    दृष्टं च श्रुतं च भुक्तं चाभुक्तं च सच्चासच्च सर्वं पश्यति ॥ २ ॥ अथेमा दश दश नाड्यो भवन्ति । तासामेकैकस्या
    द्वासप्ततिर्द्वासप्ततिः शाखा नाडीसहस्राणि भवन्ति यस्मिन्नयमात्मा स्वपिति शब्दानां च करोत्यथ यद्द्वितीये
    सङ्कोशे स्वपिति तदेमं च लोकं परं च लोकं पश्यति सर्वाञ्छब्दान्विजानाति स सम्प्रसाद इत्याचक्षते प्राणः
    शरीरं परिरक्षति हरितस्य नीलस्य पीतस्य लोहितस्य श्वेतस्य नाड्यो रुधिरस्य पूर्णाः ॥ ३ ॥ अथात्रैतद्दहरं
    पुण्डरीकं कुमुदमिवानेकधा विकसितं यथा केशः सहस्रधा भिन्नस्तथा हिता नाम नाड्यो भवन्ति हृद्याकाशे परे
    कोशे दिव्योऽयमात्मा स्वपिति यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति न तत्र देवा न देवलोका
    यज्ञा न यज्ञा वा न माता न पिता न बन्धुर्न बान्धवो न स्तेनो न ब्रह्महा तेजस्कायममृतं सलिल एवेदं सलिलं
    वनं भूयस्तेनैव मार्गेण जाग्राय धावति सम्राडिति होवाच ॥ ४ ॥ ॥ पञ्चमः खण्डः ॥ स्थानानि स्थानिभ्यो यच्छति
    नाडी तेषां निबन्धनं चक्षुरध्यात्मं द्रष्टव्यमधिभूतमादित्यस्तत्राधिदैवतं नाडी तेषां निबन्धनं यश्चक्षुषि
    यो द्रष्टव्ये य आदित्ये यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे
    संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ १ ॥ श्रोत्रमध्यात्मं श्रोतव्यमधिभूतं दिशस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यः श्रोत्रे यः श्रोतव्ये यो दिक्षु यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो
    हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ २ ॥
    नासाध्यात्मं घ्रातव्यमधिभूतं पृथिवी तत्राधिदैवतं नाडी तेषां निबन्धनं यो नासायां यो घ्रातव्ये यः पृथिव्यां
    यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा
    तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ ३ ॥ जिह्वाध्यात्मं रसयितव्यमधिभूतं वरुणस्तत्राधिदैवतं नाडी
    तेषां निबन्धनं यॊ जिह्वायां रसयितव्ये यो वरुणे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरमममृतमभयमशोकमनन्तम् ॥ ४ ॥ त्वगध्यात्मं
    स्पर्शयितव्यमधिभूतं वायुस्तत्राधिदैवतं नाडी तेषां निबन्धनं यस्त्वचि यः स्पर्शयितव्ये यो वायौ यो नाड्यां
    यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ ५ ॥ मनोऽध्यात्मं मन्तव्यमधिभूतं चन्द्रस्तत्राधिदैवतं नाडी तेषां निबन्धनं यो मनसि यो मन्तव्ये यश्चन्द्रे
    यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा
    तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ ६ ॥ बुद्धिरध्यात्मं बोद्धव्यमधिभूतं ब्रह्मा तत्राधिदैवतं नाडी
    तेषां निबन्धनं यो बुद्धौ यो बोद्धव्ये यो ब्रह्मणि यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ ७ ॥ अहङ्कारोऽध्यात्ममहङ्कर्तव्यमधिभूतं
    रुद्रस्तत्राधिदैवतं नाडी तेषां निबन्धनं योऽहङ्कारे योऽहङ्कर्तव्ये यो रुद्रे यो नाड्यां यः प्राणे यो
    विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ ८ ॥ चित्तमध्यात्मं चेतयितव्यमधिभूतं क्षेत्रज्ञस्तत्राधिदैवतं नाडी तेषां निबन्धनं यश्चित्ते यश्चेतयितव्ये
    यः क्षेत्रज्ञे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे
    संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ ९ ॥ वागध्यात्मं वक्तव्यमधिभूतमग्निस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यो वाचि यो वक्तव्ये योऽग्नौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ १० ॥ हस्तावध्यात्ममादातव्यमधिभूतमिन्द्रस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं यो हस्ते य आदातव्ये य इन्द्रे यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे
    य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ ११ ॥ पादावध्यात्मं
    गन्तव्यमधिभूतं विष्णुस्तत्राधिदैवतं नाडी तेषां निबन्धनं यः पादे यो गन्तव्ये यो विष्णौ यो नाड्यां यः
    प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम्
    ॥ १२ ॥ पायुरध्यात्मं विसर्जयितव्यमधिभूतं मृत्युस्तत्राधिदैवतं नाडी तेषां निबन्धनं यः पायौ यो विसर्जयितव्ये
    यो मृत्यौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति
    सोऽयमात्मा तमात्मानमुपासीताजरममृतमभयमशोकमनन्तम् ॥ १३ ॥ उपस्थोऽध्यात्ममानन्दयितव्यमधिभूतं प्रजापतिस्तत्राधिदैवतं
    नाडी तेषां निबन्धनं य उपस्थे य आनन्दयितव्ये यः प्रजापतौ यो नाड्यां यः प्राणे यो विज्ञाने य आनन्दे
    यो हृद्याकाशे य एतस्मिन्सर्वस्मिन्नन्तरे संचरति सोऽयमात्मा तमात्मानमुपसीताजरममृतमभयमशोकमनन्तम् ॥ १४
    ॥ एष सर्वज्ञ एष सर्वेश्वर एष सर्वाधिपतिरेषोऽन्तर्याम्येष योनिः सर्वस्य सर्वसौख्येरुपास्यमानो न च सर्वसौख्यान्युपास्यति
    वेदशास्त्रैरुपास्यमानो न च वेदशास्त्राण्युपास्यति यस्यान्नमिदं सर्वे न च योऽन्नं भवत्यतः परं सर्वनयनः
    प्रशास्तान्नमयो भूतात्मा प्राणमय इन्द्रियात्मा मनोमयः सङ्कल्पात्मा विज्ञानमयः कालात्मानन्दमयो लयात्मैकत्वं
    नास्ति द्वैतं कुतो मर्त्यं नास्त्यमृतं कुतो नान्तःप्रज्ञो न बहिःप्रज्ञो नोभयतःप्रज्ञो न प्रज्ञानघनो
    न प्रज्ञो नाप्रज्ञोऽपि नो विदितं वेद्यं नास्तीत्येतन्निर्वाणानुशासनमिति वेदानुशासनमिति वेदानुशासनम्
    ॥ १५ ॥ ॥ षष्ठः खण्डः ॥ नैवेह किञ्चनाग्र आसीदमूलमनाधारा इमाः प्रजाः प्रजायन्ते ॥ १ ॥ चक्षुश्च द्रष्टव्यं
    च नारायणः श्रोत्रं च श्रोतव्यं च नारायणो घ्राणं च घ्रातव्यं च नारायणो जिह्वा च रसयितव्यं च नारायणस्त्वक्
    च स्पर्शयितव्यं च नारायणो मनश्च मन्तव्यं च नरायणो बुद्धिश्च बोद्धव्यं च नारायणोऽहङ्कारश्चाहङ्कर्तव्यं
    च नारायणश्चित्तं च चेतयितव्यं च नारायणो वाक् च वक्तव्यं च नारायणो हस्तौ चादातव्यं च नारायणः पादौ च
    गन्तव्यं च नारायणः पायुश्च विसर्जयितव्यं च नारायण उपस्थश्चानन्दयितव्यं च नारायणो धाता विधाता कर्ता
    विकर्ता दिव्यो देव एको नारायणः ॥ २ ॥ आदित्या रुद्रा मरुतो वसवोऽश्विनावृचो यजूंषि सामानि मन्त्रोऽग्निराज्याहुतिर्नारायण
    उद्भवः सम्भवो दिव्यो देव एको नारायणः ॥ ३ ॥ माता पिता भ्राता निवासः शरणं सुहृद्गतिर्नारायणः ॥ ४ ॥ विराजा
    सुदर्शनाजितासोम्यामोघाकुमारामृतासत्यामध्यमानासीराशिशुतासूरासूर्याभास्वराविज्ञेयानि नाडीनामानि दिव्यानि
    ॥ ५ ॥ गर्जति गायति वाति वर्षति वरुणोऽर्यमा चन्द्रमाः कालः कलिर्धाता ब्रह्मा प्रजापतिर्मघवा दिवसाश्चार्धदिवसाश्च
    कलाः कल्पाश्चोर्ध्वं च दिशश्च सर्वं नारायणः ॥ ६ ॥ पुरुष एवेदं सर्वं यद्भूतं यच्च भव्यम् । उतामृतत्वस्येशानो
    यदन्नेनातिरोहति । तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्षुराततम् । तद्विप्रासो विपन्यवो
    जागृवांसः समिन्धते । विष्णोर्यत्परमं पदम् । तदेतन्निर्वाणानुशासनमिति वेदानुशासनमिति वेदानुशासनम् ॥
    ७ ॥ ॥ सप्तमः खण्डः ॥ अन्तःशरीरे निहितो गुहायामज एको नित्यो यस्य पृथिवी शरीरं यः पृथिवीमन्तरे संचरन्
    यं पृथिवी न वेद । यस्यापः शरीरं योऽपोन्तरे संचरन्यमापो न विदुः । यस्य तेजः शरीरं यस्तेजोन्तरे संचरन्
    यं तेजो न वेद । यस्य वायुः शरीरं यो वायुमन्तरे संचरन् य वायुर्न वेद । यस्याकाशः शरीरं य आकाशमन्तरे
    संचरन् यमाकाशो न वेद । यस्य मनः शरीरं यो मनोन्तरे संचरन् यं मनो न वेद। यस्य बुद्धिः शरीरं यो बुद्धिमन्तरे
    संचरन् यं बुद्धिर्न वेद । यस्याहङ्कारः शरीरं योऽहङ्कारमन्तरे संचरन् यमहङ्कारो न वेद । यस्य चित्तं
    शरीरं यश्चित्तमन्तरे संचरन् यं चित्तं न वेद । यस्याव्यक्तं शरीरं योऽव्यक्तमन्तरे संचरन् यमव्यक्तं
    न वेद । यस्याक्षरं शरीरं योऽक्षरमन्तरे संचरन् यमक्षरं न वेद । यस्य मृत्युः शरीरं यो मृत्युमन्तरे संचरन्
    यं मृत्युर्न वेद । स एष सर्वभूतान्तरात्मापहतपाप्मा दिव्यो देव एको नारायणः ॥ १ ॥ एतां विद्यामपान्तरतमाय
    ददावपान्तरतमो ब्रह्मणे ददौ ब्रह्मा घोराङ्गिरसे ददौ घोराङ्गिरा रैक्वाय ददौ रैक्वो रामाय ददौ रामः सर्वेभ्यो
    भूतेभ्यो ददावित्येवं निर्वाणानुशासनमिति वेदानुशासनमिति वेदानुशासनम् ॥ २ ॥ ॥ अष्टमः खण्डः ॥ अन्तःशरीरे
    निहितो गुहायां शुद्धः सोऽयमात्मा सर्वस्य मेदोमांसक्लेदावकीर्णे शरीरमध्येऽत्यन्तोपहते चित्रभित्तिप्रतीकाशे
    गान्धर्वनगरोपमे कदलीगर्भवन्निःसारे जलबुद्बुदवच्चञ्चले निःसृतमात्मानमचिन्त्यरूपं दिव्यं देवमसङ्गं शुद्धं
    तेजस्कायमरूपं सर्वेश्वरमचिन्त्यमशरीरं निहितं गुहायाममृतं विभ्राजमानमानन्दं तं पश्यन्ति विद्वांसस्तेन
    लये न पश्यन्ति ॥ १ ॥ ॥ नवमः खण्डः ॥ अथ हैनं
