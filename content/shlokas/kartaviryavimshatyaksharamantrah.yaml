id: kartaviryavimshatyaksharamantrah
category: mantra
name:
  english: kartaviryavimshatyaksharamantrah
  devanagari: कार्तवीर्यविंशत्यक्षरमन्त्रः
content:
  english: agneyadi pithapadeshu dharmadimshca caturdikpalakan | pithagatreshu purvadimadharmadimstathaiva
    ca || 1|| karnikayam tatha'nante kandam || saroruham | patrani kesaramshcai karnikanca tatha yajet
    || 2|| tarakaignyavarnap ||| dutrimandalam | ganatrayam ca satvadi tatashcatmacatushtayam || 3|| mayatatvam
    kalatatvam vi ||| param tatha | ekaikopari sampujya tato shaktim yajennava || 4|| vimalotkarshini
    jnanakriyayogashca pancami | prajnasatyantayeshananugraha navami para || 5|| sarvadrishteshupatreshu
    karnikayam yajetkramat | caturdha navadha yuktaih svaisvaireva ca namabhih || 6|| karnikayam yajetpashcat
    pithamantrena mantravit | om namo bhagavate vishnave sarvabhutatmane vasudevaya sarvayogatmane yogapithatmane
    namah | anena pushpanjalim dadyat | iti sampujite pithe devimavahya pujayet | atha devapithe yantram
    sthapaniyam caitanyavigraham devam sthitam hridayapankaje | shvasamargena satatam cintayetkusumanjalau
    || 1|| padukamudrayaniya murtau samyojya siddhaya || tatra puja kramah | avahanadimudrah pushpakshatadibhih
    purvadikkramena pujayet | purve coramaryai namah | dakshine suraryai namah | pashcime arimaryai namah
    | uttaretanmadavibhanjikayai namah | sphatikakhangacarmadhara vira sarvabharanabhushitah ishagneyanairrityavayavyeshu
    duhkhanashanam | dushtanashana duritanashana amayanashana raktavarna banabanasanadhara sarvabharanayuktah
    ishanyadishu ashta dikshu kshemankarivashyakari shrikari ca yashaskari ayuhkari prajnakari vidyakari
    dhanakari etassitaprabhavaradambujadhararatnamshukapravarana harakundalollasitah | haihayanathamanojna
    dhyayetsaundaryalasitah pramadah | atha indradi dikpalan pujayet | pashcat navarnavena | avahanarghyapadyacamaniyamadhuparkasnanavasanabharana
  devanagari: आग्नेयादि पीठपादेषु धर्मादींश्च चतुर्दिक्पालकान् । पीठगात्रेषु पूर्वादिमधर्मादींस्तथैव च
    ॥ १॥ कर्णिकायां तथाऽनन्ते कन्दं ॥ सरोरुहम् । पत्राणि केसरांश्चै कर्णिकाञ्च तथा यजेत् ॥ २॥ ताराकैग्न्यवर्णप्
    ॥। दुत्रिमण्डलम् । गणत्रयं च सत्वादि ततश्चात्मचतुष्टयम् ॥ ३॥ मायातत्वं कालतत्वं वि ॥। परं तथा । एकैकोपरि
    सम्पूज्य ततो शक्तिं यजेन्नव ॥ ४॥ विमलोत्कर्षिणी ज्ञानाक्रियायोगश्च पञ्चमी । प्रज्ञासत्यान्तयेशानानुग्रहा
    नवमी परा ॥ ५॥ सर्वादृष्टेषुपत्रेषु कर्णिकायां यजेत्क्रमात् । चतुर्धा नवधा युक्तैः स्वैस्वैरेव च नामभिः
    ॥ ६॥ कर्णिकायां यजेत्पश्चात् पीठमन्त्रेण मन्त्रवित् । ॐ नमो भगवते विष्णवे सर्वभूतात्मने वासुदेवाय
    सर्वयोगात्मने योगपीठात्मने नमः । अनेन पुष्पाञ्जलिं दद्यात् । इति सम्पूजिते पीठे देवीमावाह्य पूजयेत्
    । अथ देवपीठे यन्त्रं स्थापनीयं चैतन्यविग्रहं देवं स्थितं हृदयपङ्कजे । श्वासमार्गेण सततं चिन्तयेत्कुसुमाञ्जलौ
    ॥ १॥ पादुकामुद्रयानीय मूर्तौ संयोज्य सिद्धया ॥ तत्र पूजा क्रमः । आवाहनादिमुद्राः पुष्पाक्षतादिभिः
    पूर्वदिक्क्रमेण पूजयेत् । पूर्वे चोरमार्यै नमः । दक्षिणे सुरार्यै नमः । पश्चिमे अरिमार्यै नमः । उत्तरेतन्मदविभञ्जिकायै
    नमः । स्फटिकाखङ्गचर्मधरा वीरा सर्वाभरणभूषिताः ईशग्नेयनैरृत्यवायव्येषु दुःखनाशनम् । दुष्टनाशना दुरितनाशना
    आमयनाशना रक्तवर्णा बाणबाणासनधरा सर्वाभरणयुक्ताः ईशान्यादिषु अष्ट दिक्षु क्षेमङ्करीवश्यकरी श्रीकरी
    च यशस्करी आयुःकरी प्रज्ञाकरी विद्याकरी धनकरी एतास्सितप्रभावरदाम्बुजधरारत्नांशुकप्रावरणा हरकुण्डलोल्लसिताः
    । हैहयनाथमनोज्ञा ध्यायेत्सौन्दर्यलसिताः प्रमदाः । अथ इन्द्रादि दिक्पालान् पूजयेत् । पश्चात् नवार्णवेन
    । आवाहनार्घ्यपाद्याचमनीयमधुपर्कस्नानवसनाभरण
