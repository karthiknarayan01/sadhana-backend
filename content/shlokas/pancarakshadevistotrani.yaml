id: pancarakshadevistotrani
category: raksha
name:
  english: pancarakshadevistotrani
  devanagari: पन्चरक्षादेवीस्तोत्राणि
content:
  english: pancarakshadevistotrani 1 mahapratisarastotram om namah shrimahapratisarayai | tathagatadyastathatam
    tattvamapurmahattaram | dharanidharanadyasyah pratisaram namami tam || 1|| rane shakro'jayaddaityan
    dharanidhvajadhrig bahun | sangramajayadam bhimam pratisaram namami tam || 2|| yatprabhavad brahmadatto'labhad
    rajyamakantakam | sarvabhaumapradam devim pratisaram namami tam || 3|| bahvaparadho'pi yadbhakto rajyadhikaramaptavan
    | shastradibhitisamhatrim pratisaram namami tam || 4|| ratnanyavapurvanijo yam smritvodadhinirgatah
    | sarvabadhaprashamanim pratisaram namami tam || 5|| shrimahapratisararakshadevistotram sampurnam
    | 2 mahamantranusarinistotram om namah shrimahamantranusarinyai | buddhadhishthanato buddhabhayadam
    bhayanashinim | bhavambudhinimagnanam namo mantranusarinim || 1|| yanmantroccaranadeva shaditayah
    sudarunah | nasham prayanti varadam namo mantramusarinim || 2|| mantranusarino lokan nanye mantradayo
    grahah | pidayanti priyamshcapi namo mantranusarinim || 3|| buddho'bhyabhashad gathasta yanmantrakathanantaram
    | yabhih sarvatra svasti syannamo mantranusarinim || 4|| kalau buddhavihine'smin lokanam hitamacaret
    | papotpataprashamanim namo mantranusarinim || 5|| shrimahamantranusarinistotram sampurnam | 3 mahamayuristotram
    om namah shrimahamayuriryai | dushtam krishnabhujangam ca narah svantikam palayet | yasya mantranubhavena
    mayurim pranamami tam || 1|| brahmadayo lokapala yaddharanya samapnuvan | svani svanyadhikarani mayurim
    pranamami tam || 2|| svarnavabhasam shikhinam nalabhajjapinam kudhih | amoghenapi pashena mayurim
    pranamami tam || 3|| yanmantrajapato jivah prajivanchushkapadapah | mritasanjivinim devim mayurim
    pranamami tam || 4|| yanmantrisangat pavano mahopadravashantikrit | buddhanam bodhidam nityam mayurim
    pranamami tam || 5|| shrimahamayurirakshadevistotram sampurnam | 4 mahashitavatirakshadevistotram
    om namo mahashitavatyai | yaddharanimanujapan rahulo bhadramaptavan | vihethito grahaih sarvaih shitavatim
    namamyaham || 1|| papatape shitakarim shitaladyupasargatah | shitoshnaduhkhashamanim shitavatim namamyaham
    || 2|| mantragranthitasutranam dharanallakshayojanam | pathikanam palayitrim shitavatim namamyaham
    || 3|| shmashanasthena munina ya samuccarita pura | grahopadravashantyartham shitavatim namamyaham
    || 4|| grahabhibhutavatanam granthipadavidharinam | grahabhitiprashamanim shitavatim namamyaham ||
    5|| shri mahashitavatirakshadevistotram sampurnam | 5 mahasahasrapramardinistotram om namah shrimahasahasrapramardinye
    | mahasahasrike loke sahasrahitakarinam | sahasrasattvajananim naumi sahasramardinim || 1|| sopadravayam
    vaishalyam mahotsavo yatah sada | mahopasargashamanim naumi sahasramardinim || 2|| yaksharakshasabhutanam
    damanim dushtacetasam | duritopadravahatam naumi sahasramardinim || 3|| yaddharanipathanato rakshitah
    shakyakeshari | vishato vishadigdham tam naumi sahasramardinim || 4|| madhumishritabhaishajyam sarvaroganivaranam
    | mritasanjivanam loke naumi sahasramardinim || 5|| iti shrimahasahasramardinirakshadevistotram sampurnam
    ||
  devanagari: पञ्चरक्षादेवीस्तोत्राणि १ महाप्रतिसरास्तोत्रं ॐ नमः श्रीमहाप्रतिसरायै । तथागताद्यास्तथतां
    तत्त्वमापुर्महत्तरम् । धारणीधारणाद्यस्याः प्रतिसरां नमामि ताम् ॥ १॥ रणे शक्रोऽजयद्दैत्यान् धारणीध्वजधृग्
    बहून् । सङ्ग्रामजयदां भीमां प्रतिसरां नमामि ताम् ॥ २॥ यत्प्रभावाद् ब्रह्मदत्तोऽलभद् राज्यमकण्टकम्
    । सार्वभौमप्रदां देवीं प्रतिसरां नमामि ताम् ॥ ३॥ बह्वपराधोऽपि यद्भक्तो राज्याधिकारमाप्तवान् । शस्त्रादिभीतिसंहत्रीं
    प्रतिसरां नमामि ताम् ॥ ४॥ रत्नान्यवापुर्वणिजो यां स्मृत्वोदधिनिर्गताः । सर्वबाधाप्रशमनीं प्रतिसरां
    नमामि ताम् ॥ ५॥ श्रीमहाप्रतिसरारक्षादेवीस्तोत्रं सम्पूर्णम् । २ महामन्त्रानुसारिणीस्तोत्रं ॐ नमः श्रीमहामन्त्रानुसारिण्यै
    । बुद्धाधिष्ठानतो बुद्धाभयदां भयनाशिनीम् । भवाम्बुधिनिमग्नानां नमो मन्त्रानुसारिणीम् ॥ १॥ यन्मन्त्रोच्चारणादेव
    षडीतयः सुदारुणाः । नाशं प्रयान्ति वरदां नमो मन्त्रामुसारिणीम् ॥ २॥ मन्त्रानुसारिणो लोकान् नान्ये मन्त्रादयो
    ग्रहाः । पीडयन्ति प्रियांश्चापि नमो मन्त्रानुसारिणीम् ॥ ३॥ बुद्धोऽभ्यभाषद् गाथास्ता यन्मन्त्रकथनान्तरम्
    । याभिः सर्वत्र स्वस्ति स्यान्नमो मन्त्रानुसारिणीम् ॥ ४॥ कलौ बुद्धविहीनेऽस्मिन् लोकानां हितमाचरेत्
    । पापोत्पातप्रशमनीं नमो मन्त्रानुसारिणीम् ॥ ५॥ श्रीमहामन्त्रानुसारिणीस्तोत्रं सम्पूर्णम् । ३ महामायूरीस्तोत्रं
    ॐ नमः श्रीमहामायूरीर्यै । दुष्टं कृष्णभुजङ्गं च नरः स्वान्तिकं पालयेत् । यस्या मन्त्रानुभावेन मायूरीं
    प्रणमामि ताम् ॥ १॥ ब्रह्मादयो लोकपाला यद्धारण्या समाप्नुवन् । स्वानि स्वान्यधिकाराणि मायूरीं प्रणमामि
    ताम् ॥ २॥ स्वर्णावभासं शिखिनं नालभज्जपिनं कुधीः । अमोघेनापि पाशेन मायूरीं प्रणमामि ताम् ॥ ३॥ यन्मन्त्रजपतो
    जीवाः प्राजीवञ्छुष्कपादपाः । मृतसञ्जीविनीं देवीं मायूरीं प्रणमामि ताम् ॥ ४॥ यन्मन्त्रिसङ्गात् पवनो
    महोपद्रवशान्तिकृत् । बुद्धानां बोधिदां नित्यं मायूरीं प्रणमामि ताम् ॥ ५॥ श्रीमहामायूरीरक्षादेवीस्तोत्रं
    सम्पूर्णम् । ४ महाशीतवतीरक्षादेवीस्तोत्रं ॐ नमो महाशीतवत्यै । यद्धारणीमनुजपन् राहुलो भद्रमाप्तवान्
    । विहेठितो ग्रहैः सर्वैः शीतवतीं नमाम्यहम् ॥ १॥ पापतापे शीतकरीं शीतलाद्युपसर्गतः । शीतोष्णदुःखशमनीं
    शीतवतीं नमाम्यहम् ॥ २॥ मन्त्रग्रन्थितसूत्राणां धारणाल्लक्षयोजनम् । पथिकानां पालयित्रीं शीतवतीं नमाम्यहम्
    ॥ ३॥ श्मशानस्थेन मुनिना या समुच्चारिता पुरा । ग्रहोपद्रवशान्त्यर्थं शीतवतीं नमाम्यहम् ॥ ४॥ ग्रहाभिभूतवातानां
    ग्रन्थिपदविधारिणाम् । ग्रहभीतिप्रशमनीं शीतवतीं नमाम्यहम् ॥ ५॥ श्री महाशीतवतीरक्षादेवीस्तोत्रं सम्पूर्णम्
    । ५ महासाहस्रप्रमर्दिनीस्तोत्रं ॐ नमः श्रीमहासाहस्रप्रमर्दिन्ये । महासाहस्रिके लोके साहस्रहितकारिणाम्
    । सहस्रसत्त्वजननीं नौमि साहस्रमर्दिनीम् ॥ १॥ सोपद्रवायां वैशाल्यां महोत्सवो यतः सदा । महोपसर्गशमनीं
    नौमि साहस्रमर्दिनीम् ॥ २॥ यक्षराक्षसभूतानां दमनीं दुष्टचेतसाम् । दुरितोपद्रवहतां नौमि साहस्रमर्दिनीम्
    ॥ ३॥ यद्धारणीपठनतो रक्षितः शाक्यकेशरी । विषतो विषदिग्धां तां नौमि साहस्रमर्दिनीम् ॥ ४॥ मधुमिश्रितभैषज्यं
    सर्वरोगनिवारणम् । मृतसञ्जीवनं लोके नौमि साहस्रमर्दिनीम् ॥ ५॥ इति श्रीमहासाहस्रमर्दिनीरक्षादेवीस्तोत्रं
    सम्पूर्णम् ॥
