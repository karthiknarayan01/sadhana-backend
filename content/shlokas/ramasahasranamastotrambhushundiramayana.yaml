id: ramasahasranamastotrambhushundiramayana
category: sahasranama
name:
  english: ramasahasranamastotrambhushundiramayana
  devanagari: रामसहस्रनामस्तोत्रम्भुशुण्डीरामायण
content:
  english: ramah shyamo harirvishnuh keshavah keshinashanah | narayano madhavashca shridharo madhusudanah
    || 11|| ravanarih kamsaniha vakiprananivarttanah | tadakahananodyukto vishvamitrapriyah kriti || 12||
    vedango yajnavaraho dharmajno medinipatih | vasudevo'ravindaksho govindo gopatih prabhuh || 13|| padmakanto
    vikunthabhuh kirtikanyasukhapradah | janakiprananathashca sitavishleshanashanah || 14|| mukundo muktidata
    ca kaustubhi karunakarah | kharadushananashi ca maricaprananashakah || 15|| subahumaranotsahi pakshishraddhavidhayakah
    | vihangapitrisambandhi kshanatushto gatipradah || 16|| putanamatrigatido vinivrittatrinanilah | pavanah
    paramanandah kalindijalakelikrit || 17|| sarayujalakelishca saketapuradaivatah | mathurasthananilayo
    vishrutatma trayistutah || 18|| kaunteyavijayodyuktah setukrit sindhugarbhavit | saptatalaprabhedi
    ca mahasthikshepanoddhurah || 19|| kaushalyanandanah krishnah kishorijanavallabhah | abhirivallabho
    virah kotikandarpavigrahah || 20|| govarddhanagiriprashi govarddhanagirishvarah | gokulesho nnajeshashca
    sahajapranavallabhah || 21|| bhulilakelisantoshi vamakotiprasadanah | bhillapatnikripasindhuh kaivarttakarunakarah
    || 22|| jambavadbhaktido bhokta jambavatyanganapatih | sitapriyo rukminishah kalyanagunasagarah ||
    23|| bhaktapriyo dasharathih kaitabharih kritotsavah | kadambavanamadhyasthah shilasamtaradayakah
    || 24|| raghavo raghuvirashca hanumatsakhyavarddhanah | pitambaro'cyutah shriman shrigopijanavallabhah
    || 25|| bhakteshto bhaktidata ca bhargavadvijagarvajit | kodandaramah krodhatma lankavijayapanditah
    || 26|| kumbhakarnanihanta ca yuva kaishorasundarah | vanamali ghanashyamo gocaranaparakrami || 27||
    kakapakshadharo vesho vito dhrishtah shathah patih | anukulo dakshinashca tarah kapatakovidah || 28||
    ashvamedhapraneta ca raja dasharathatmajah | raghavendro maharajah shriramanandavigrahah || 29|| kshattrah
    kshattrakulottaso mahatejah pratapavan | mahasainyo mahacapo lakshmanaikantasupriyah || 30|| kaikeyiprananirmata
    vitarajyo vanalayah | citrakutapriyasthano mrigayacaratatparah || 31|| kirataveshah kruratma pashumamsaikabhojanah
    | phalapushpakritaharah kandamulanishevanah || 32|| payovrato vidhanajnah saddharmapratipalakah |
    gadadharo yajnakartta shraddhakarta dvijarcakah || 33|| pitribhakto matribhakto bandhuh svajanatoshakrit
    | matsyah kurmo nrisimhashca varaho vamanastatha || 34|| raghuramah parashuramo balaramo ramapatih
    | ramalingasthapayita shivabhaktiparayanah || 35||
  devanagari: रामः श्यामो हरिर्विष्णुः केशवः केशिनाशनः । नारायणो माधवश्च श्रीधरो मधुसूदनः ॥ ११॥ रावणारिः
    कंसनिहा वकीप्राणनिवर्त्तनः । ताडकाहननोद्युक्तो विश्वामित्रप्रियः कृती ॥ १२॥ वेदाङ्गो यज्ञवाराहो धर्मज्ञो
    मेदिनीपतिः । वासुदेवोऽरविन्दाक्षो गोविन्दो गोपतिः प्रभुः ॥ १३॥ पद्माकान्तो विकुण्ठाभूः कीर्तिकन्यासुखप्रदः
    । जानकीप्राणनाथश्च सीताविश्लेषनाशनः ॥ १४॥ मुकुन्दो मुक्तिदाता च कौस्तुभी करुणाकरः । खरदूषणनाशी च मारीचप्राणनाशकः
    ॥ १५॥ सुबाहुमारणोत्साही पक्षिश्राद्धविधायकः । विहङ्गपितृसम्बन्धी क्षणतुष्टो गतिप्रदः ॥ १६॥ पूतनामातृगतिदो
    विनिवृत्ततृणानिलः । पावनः परमानन्दः कालिन्दीजलकेलिकृत् ॥ १७॥ सरयूजलकेलिश्च साकेतपुरदैवतः । मथुरास्थाननिलयो
    विश्रुतात्मा त्रयीस्तुतः ॥ १८॥ कौन्तेयविजयोद्युक्तः सेतुकृत् सिन्धुगर्भवित् । सप्ततालप्रभेदी च महास्थिक्षेपणोद्धुरः
    ॥ १९॥ कौशल्यानन्दनः कृष्णः किशोरीजनवल्लभः । आभीरीवल्लभो वीरः कोटिकन्दर्पविग्रहः ॥ २०॥ गोवर्द्धनगिरिप्राशी
    गोवर्द्धनगिरीश्वरः । गोकुलेशो न्नजेशश्च सहजाप्राणवल्लभः ॥ २१॥ भूलीलाकेलिसन्तोषी वामाकोटिप्रसादनः ।
    भिल्लपत्नीकृपासिन्धुः कैवर्त्तकरुणाकरः ॥ २२॥ जाम्बवद्भक्तिदो भोक्ता जाम्बवत्यङ्गनापतिः । सीताप्रियो
    रुक्मिणीशः कल्याणगुणसागरः ॥ २३॥ भक्तप्रियो दाशरथिः कैटभारिः कृतोत्सवः । कदम्बवनमध्यस्थः शिलासंतारदायकः
    ॥ २४॥ राघवो रघुवीरश्च हनुमत्सख्यवर्द्धनः । पीताम्बरोऽच्युतः श्रीमान् श्रीगोपीजनवल्लभः ॥ २५॥ भक्तेष्टो
    भक्तिदाता च भार्गवद्विजगर्वजित् । कोदण्डरामः क्रोधात्मा लङ्काविजयपण्डितः ॥ २६॥ कुम्भकर्णनिहन्ता च
    युवा कैशोरसुन्दरः । वनमाली घनश्यामो गोचारणपराक्रमी ॥ २७॥ काकपक्षधरो वेषो विटो धृष्टः शठः पतिः । अनुकूलो
    दक्षिणश्च तारः कपटकोविदः ॥ २८॥ अश्वमेधप्रणेता च राजा दशरथात्मजः । राघवेन्द्रो महाराजः श्रीरामानन्दविग्रहः
    ॥ २९॥ क्षत्त्रः क्षत्त्रकुलोत्तसो महातेजाः प्रतापवान् । महासैन्यो महाचापो लक्ष्मणैकान्तसुप्रियः ॥
    ३०॥ कैकेयीप्रणनिर्माता वीतराज्यो वनालयः । चित्रकूटप्रियस्थानो मृगयाचारतत्परः ॥ ३१॥ किरातवेषः क्रूरात्मा
    पशुमांसैकभोजनः । फलपुष्पकृताहारः कन्दमूलनिषेवणः ॥ ३२॥ पयोव्रतो विधानज्ञः सद्धर्मप्रतिपालकः । गदाधरो
    यज्ञकर्त्ता श्राद्धकर्ता द्विजार्चकः ॥ ३३॥ पितृभक्तो मातृभक्तो बन्धुः स्वजनतोषकृत् । मत्स्यः कूर्मो
    नृसिंहश्च वराहो वामनस्तथा ॥ ३४॥ रघुरामः परशुरामो बलरामो रमापतिः । रामलिङ्गस्थापयिता शिवभक्तिपरायणः
    ॥ ३५॥
