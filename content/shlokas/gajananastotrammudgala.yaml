id: gajananastotrammudgala
category: stotram
name:
  english: gajananastotrammudgala
  devanagari: गजाननस्तोत्रम्मुद्गल
content:
  english: samyutah | antardadhe tato deva manuyah svasthalam yayuh || 14|| pita parasharastasya mata
    vai vatsala prabhoh | shokasagaramagnau tau shrutva vartam nipetatuh || 15|| tatah karuniko devastayoshcittaprakashakah
    | yogashantimayam jnanam bodhayamasa shashvatam || 16|| murtim madiyam vai kritva samsthapya brahmanaih
    saha | tasyah puja prakartavya bhavadbhyam nityamadarat || 17|| dehavyaparita tatra kartavya hridi
    shantidam | yogarupadharam drishtva kalamakramatam sada || 18|| evamuktva hridistho'sau ganeshom'tardadhe
    tatah | kritavantau mahabhagau tatha dakshasuyoginau || 19|| acala sthapita murtih siddhida sa'bhavatpara
    | darshanan mokshada daksha sakamanam prakamada || 20|| etatte kathitam sarvam gajasuravadhashritam
    | caritam gananathasya sarvapapaharam shubham || 21|| yah sha
  devanagari: संयुतः । अन्तर्दधे ततो देवा मनुयः स्वस्थलं ययुः ॥ १४॥ पिता पराशरस्तस्य माता वै वत्सला प्रभोः
    । शोकसागरमग्नौ तौ श्रुत्वा वार्तां निपेततुः ॥ १५॥ ततः कारुणिको देवस्तयोश्चित्तप्रकाशकः । योगशान्तिमयं
    ज्ञानं बोधयामास शाश्वतम् ॥ १६॥ मूर्तिं मदीयां वै कृत्वा संस्थाप्य ब्राह्मणैः सह । तस्याः पूजा प्रकर्तव्या
    भवद्भ्यां नित्यमादरात् ॥ १७॥ देहव्यापारिता तत्र कर्तव्या हृदि शान्तिदम् । योगरूपधरं दृष्ट्वा कालमाक्रमतं
    सदा ॥ १८॥ एवमुक्त्वा हृदिस्थोऽसौ गणेशोंऽतर्दधे ततः । कृतवन्तौ महाभागौ तथा दक्षसुयोगिनौ ॥ १९॥ अचला
    स्थापिता मूर्तिः सिद्धिदा साऽभवत्परा । दर्शनान् मोक्षदा दक्ष सकामानां प्रकामदा ॥ २०॥ एतत्ते कथितं
    सर्वं गजासुरवधाश्रितम् । चरितं गणनाथस्य सर्वपापहरं शुभम् ॥ २१॥ यः श
