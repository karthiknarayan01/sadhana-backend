id: sri-rama-tandava-stotram
category: stotram
name:
  english: Sri Rama Tandava Stotram
content:
  english: '|| indradayo ucuh || jatakatahayuktamundaprantavistritam hareh apangakruddhadarshanopahara
    curnakuntalah | pracandavegakaranena pinjalah pratigrahah sa kruddhatandavasvarupadhrigvirajate harih
    || || atheha vyuhaparshnipragvaruthini nishanginah tathanjaneyrikshabhupasaurabalinandanah | pracandadanavanalam
    samudratulyanashakah namo''stute suraricakrabhakshakaya mrityave || || kalevare kashayavasahastakarmukam
    hareh upasanopasangamarthadhrigvishakhamandalam | hridi smaran dashakriteh kucakracauryapatakam vidaryate
    pracandatandavakritih sa raghavah || || prakandakandakandakarmadehachidrakaranam kukutakutakutakaunapatmajabhimardanam
    | tathagunangunangunangunangunena darshayan kripitakeshalanghyamishamekaraghavam bhaje || || savanaranvitah
    tathaplutam shariramasrija virodhimedasagramamsagulmakalakhandanaih | mahasipashashaktidandadharakaih
    nishacaraih pariplutam kritam shavaishca yena bhumimandalam || || vishaladamshtrakumbhakarnamegharavakarakaih
    tathahiravanadyakampanatikayajitvaraih | surakshitam manoramam suvarnalankanagarim nijastrasankulairabhedyakotamardanam
    kritah || || prabuddhabuddhayogibhih maharshisiddhacaranaih videhajapriyah sadanuto stuto ca svastibhih
    | pulastyanandanatmajasya mundarundachedanam surariyuthabhedanam vilokayami sampratam || || karalakalarupinam
    mahogracapadharinam kumohagrastamarkatacchabhallatranakaranam | vibhishanadibhih sadabhishenane''bhicintakam
    bhajami jitvaram tathormilapateh priyagrajam || || itastatah muhurmuhuh paribhramanti kauntikah anuplavapravahaprasikashca
    vaijayantikah | mridhe prabhakarasya vamshakirtino''padanatam abhikramena raghavasya tandavakriteh
    gatah || || nirakritim niramayam tathadisrishtikaranam mahojjvalam ajam vibhum puranapurusham harim
    | nirankusham nijatmabhaktajanmamrityunashakam adharmamargaghatakam kapishavyuhanayakam || || karalapalicakrashulatikshnabhindipalakaih
    kutharasarvalasidhenukelishalyamudgaraih | supushkarena pushkaranca pushkarastramaranaih sadaplutam
    nishacaraih supushkaranca pushkaram || || prapannabhaktarakshakam vasundharatmajapriyam kapishavrindasevitam
    samastadushanapaham | surasurabhivanditam nishacarantakam vibhum jagatprashastikaranam bhajeha ramamishvaram
    || || || iti shribhagavatanandaguruna viracite shriraghavendracarite indradi devaganaih kritam shriramatandavastotram
    sampurnam ||'
  devanagari: ॥ इन्द्रादयो ऊचुः ॥ जटाकटाहयुक्तमुण्डप्रान्तविस्तृतं हरेः अपाङ्गक्रुद्धदर्शनोपहार चूर्णकुन्तलः
    । प्रचण्डवेगकारणेन पिञ्जलः प्रतिग्रहः स क्रुद्धताण्डवस्वरूपधृग्विराजते हरिः ॥ ॥ अथेह व्यूहपार्ष्णिप्राग्वरूथिनी
    निषङ्गिनः तथाञ्जनेयृक्षभूपसौरबालिनन्दनाः । प्रचण्डदानवानलं समुद्रतुल्यनाशकाः नमोऽस्तुते सुरारिचक्रभक्षकाय
    मृत्यवे ॥ ॥ कलेवरे कषायवासहस्तकार्मुकं हरेः उपासनोपसङ्गमार्थधृग्विशाखमण्डलम् । हृदि स्मरन् दशाकृतेः
    कुचक्रचौर्यपातकं विदार्यते प्रचण्डताण्डवाकृतिः स राघवः ॥ ॥ प्रकाण्डकाण्डकाण्डकर्मदेहछिद्रकारणं कुकूटकूटकूटकौणपात्मजाभिमर्दनम्
    । तथागुणङ्गुणङ्गुणङ्गुणङ्गुणेन दर्शयन् कृपीटकेशलङ्घ्यमीशमेकराघवं भजे ॥ ॥ सवानरान्वितः तथाप्लुतं शरीरमसृजा
    विरोधिमेदसाग्रमांसगुल्मकालखण्डनैः । महासिपाशशक्तिदण्डधारकैः निशाचरैः परिप्लुतं कृतं शवैश्च येन भूमिमण्डलम्
    ॥ ॥ विशालदंष्ट्रकुम्भकर्णमेघरावकारकैः तथाहिरावणाद्यकम्पनातिकायजित्वरैः । सुरक्षितां मनोरमां सुवर्णलङ्कनागरीं
    निजास्त्रसङ्कुलैरभेद्यकोटमर्दनं कृतः ॥ ॥ प्रबुद्धबुद्धयोगिभिः महर्षिसिद्धचारणैः विदेहजाप्रियः सदानुतो
    स्तुतो च स्वस्तिभिः । पुलस्त्यनन्दनात्मजस्य मुण्डरुण्डछेदनं सुरारियूथभेदनं विलोकयामि साम्प्रतम् ॥
    ॥ करालकालरूपिणं महोग्रचापधारिणं कुमोहग्रस्तमर्कटाच्छभल्लत्राणकारणम् । विभीषणादिभिः सदाभिषेणनेऽभिचिन्तकं
    भजामि जित्वरं तथोर्मिलापतेः प्रियाग्रजम् ॥ ॥ इतस्ततः मुहुर्मुहुः परिभ्रमन्ति कौन्तिकाः अनुप्लवप्रवाहप्रासिकाश्च
    वैजयन्तिकाः । मृधे प्रभाकरस्य वंशकीर्तिनोऽपदानतां अभिक्रमेण राघवस्य ताण्डवाकृतेः गताः ॥ ॥ निराकृतिं
    निरामयं तथादिसृष्टिकारणं महोज्ज्वलं अजं विभुं पुराणपूरुषं हरिम् । निरङ्कुशं निजात्मभक्तजन्ममृत्युनाशकं
    अधर्ममार्गघातकं कपीशव्यूहनायकम् ॥ ॥ करालपालिचक्रशूलतीक्ष्णभिन्दिपालकैः कुठारसर्वलासिधेनुकेलिशल्यमुद्गरैः
    । सुपुष्करेण पुष्कराञ्च पुष्करास्त्रमारणैः सदाप्लुतं निशाचरैः सुपुष्करञ्च पुष्करम् ॥ ॥ प्रपन्नभक्तरक्षकं
    वसुन्धरात्मजाप्रियं कपीशवृन्दसेवितं समस्तदूषणापहम् । सुरासुराभिवन्दितं निशाचरान्तकं विभुं जगत्प्रशस्तिकारणं
    भजेह राममीश्वरम् ॥ ॥ ॥ इति श्रीभागवतानन्दगुरुणा विरचिते श्रीराघवेन्द्रचरिते इन्द्रादि देवगणैः कृतं
    श्रीरामताण्डवस्तोत्रं सम्पूर्णम् ॥
