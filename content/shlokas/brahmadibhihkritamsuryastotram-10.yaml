id: brahmadibhihkritamsuryastotram-10
category: stotram
name:
  english: brahmadibhihkritamsuryastotram 10
  devanagari: ब्रह्मादिभिःकृतंसूर्यस्तोत्रम् १०
content:
  english: brahmadibhih kritam suryastotram 10 jnatva ca paramatmanam sarva eva prithak prithak | divyabhih
    stutibhirdevah stuto''smabhistadeshvarah || 8|| brahmadaya ucuh | adidevo'si devanamaishvaryacca tvamishvarah
    | adikartta'si bhutanam devadevo divakarah || 9|| jivanah sarvabhutanam devagandharvarakshasam | munikinnarasiddhanam
    tathaivoragapakshinam || 10|| tvam brahma tvam mahadevastvam vishnustvam prajapatih | vayurindrashca
    somashca vivasvanvarunastatha || 11|| tvam kalah sushtikartta ca harta bharta tatha prabhuh | saritah
    sagarah shaila vidyudindradhanumshi ca || 12|| pralayah prabhavashcaiva vyaktavyaktah sanatanah |
    ishvaratparato vidya vidyayah paratah shivah || 13|| shivatparataro devastvameva parameshvarah | sarvatah
    panipadantah sarvato'kshishiromukhah || 14|| sahasramshuh sahasrasyah sahasracaranekshanah | bhutadirbhurbhuvahsvashca
    mahah satyam tapo janah || 15|| pradiptam dipanam divyam sarvalokaprakashakam | durniriksham surendranam
    yadrupam tasya te namah || 16|| surasiddhaganairjushtam bhrigvatripulahadibhih | stutam paramamavyaktam
    yadrupam tasya te namah || 17|| vedyam vedavidam nityam sarvajnanasamanvitam | sarvadevatidevasya
    yadrupam tasya te namah || 18|| vishvakridvishvabhutam ca vaishvanarasurarcitam | vishvasthitamacintyam
    ca yadrupam tasya te namah || 19|| param yajnat param vedat param lokat param divah | paramatmetyabhikhyatam
    yadrupam tasya te namah || 20|| avijneyamanalakshyamadhyanagatamavyayam | anadinidhanam caiva yadrupam
    tasya te namah || 21|| namo namah karanakaranaya namo namah papavimocanaya | namo namaste ditijardanaya
    namo namo rogavimocanaya || 22|| namo namah sarvavarapradaya namo namah sarvasukhapradaya | namo namah
    sarvadhanapradaya namo namah sarvamatipradaya || 23|| stutah sa bhagavanevam taijasam rupamasthitah
    | uvaca vaca kalyanya ko varo vah pradiyatam || 24|| iti brahmapurane trayastrimshadhyayantargatam
    brahmadibhih kritam suryastotram samaptam | brahmapurana | adhyaya 33
  devanagari: ब्रह्मादिभिः कृतं सूर्यस्तोत्रम् १० ज्ञात्वा च परमात्मानं सर्व एव पृथक् पृथक् । दिव्याभिः
    स्तुतिभिर्देवः स्तुतोऽऽस्माभिस्तदेश्वरः ॥ ८॥ ब्रह्मादय ऊचुः । आदिदेवोऽसि देवानामैश्वर्याच्च त्वमीश्वरः
    । आदिकर्त्ताऽसि भूतानां देवदेवो दिवाकरः ॥ ९॥ जीवनः सर्वभूतानां देवगन्धर्वरक्षसाम् । मुनिकिन्नरसिद्धानां
    तथैवोरगपक्षिणाम् ॥ १०॥ त्वं ब्रह्मा त्वं महादेवस्त्वं विष्णुस्त्वं प्रजापतिः । वायुरिन्द्रश्च सोमश्च
    विवस्वान्वरुणस्तथा ॥ ११॥ त्वं कालः सुष्टिकर्त्ता च हर्ता भर्ता तथा प्रभुः । सरितः सागराः शैला विद्युदिन्द्रधनूंषि
    च ॥ १२॥ प्रलयः प्रभवश्चैव व्यक्ताव्यक्तः सनातनः । ईश्वरात्परतो विद्या विद्यायाः परतः शिवः ॥ १३॥ शिवात्परतरो
    देवस्त्वमेव परमेश्वरः । सर्वतः पाणिपादान्तः सर्वतोऽक्षिशिरोमुखः ॥ १४॥ सहस्रांशुः सहस्रास्यः सहस्रचरणेक्षणः
    । भूतादिर्भूर्भुवःस्वश्च महः सत्यं तपो जनः ॥ १५॥ प्रदीप्तं दीपनं दिव्यं सर्वलोकप्रकाशकम् । दुर्निरीक्षं
    सुरेन्द्राणां यद्रूपं तस्य ते नमः ॥ १६॥ सुरसिद्धगणैर्जुष्टं भृग्वत्रिपुलहादिभिः । स्तुतं परममव्यक्तं
    यद्रूपं तस्य ते नमः ॥ १७॥ वेद्यं वेदविदां नित्यं सर्वज्ञानसमन्वितम् । सर्वदेवातिदेवस्य यद्रूपं तस्य
    ते नमः ॥ १८॥ विश्वकृद्विश्वभूतं च वैश्वानरसुरार्चितम् । विश्वस्थितमचिन्त्यं च यद्रूपं तस्य ते नमः
    ॥ १९॥ परं यज्ञात् परं वेदात् परं लोकात् परं दिवः । परमात्मेत्यभिख्यातं यद्रूपं तस्य ते नमः ॥ २०॥ अविज्ञेयमनालक्ष्यमध्यानगतमव्ययम्
    । अनादिनिधनं चैव यद्रूपं तस्य ते नमः ॥ २१॥ नमो नमः कारणकारणाय नमो नमः पापविमोचनाय । नमो नमस्ते दितिजार्दनाय
    नमो नमो रोगविमोचनाय ॥ २२॥ नमो नमः सर्ववरप्रदाय नमो नमः सर्वसुखप्रदाय । नमो नमः सर्वधनप्रदाय नमो नमः
    सर्वमतिप्रदाय ॥ २३॥ स्तुतः स भगवानेवं तैजसं रूपमास्थितः । उवाच वाचा कल्याण्या को वरो वः प्रदीयताम्
    ॥ २४॥ इति ब्रह्मपुराणे त्रयस्त्रिंशाध्यायान्तर्गतं ब्रह्मादिभिः कृतं सूर्यस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ३३
