id: gayatri-mantra
category: mantra
name:
  english: Gayatri Mantra
  devanagari: गायत्री मन्त्र
content:
  english: >-
    om bhur bhuvah svah tat savitur varenyam bhargo devasya dhimahi
    dhiyo yo nah pracodayat
  devanagari: >-
    ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि धियो यो नः
    प्रचोदयात्
meaning:
  english: >-
    A prayer to the sun as the source of light and intellect, asking
    that it awaken and guide our understanding.
source_attribution:
  text_source: Rigveda 3.62.10
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
