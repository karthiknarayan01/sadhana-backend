id: narayaniyam-dashaka-22
category: stotram
name:
  english: Narayaniyam Dashaka 22
content:
  english: ajamilo nama mahisurah pura caran vibho dharmapathan grihashrami | gurorgira kananametya drishtavan
    sudhrishtashilam kulatam madakulam || || svatah prashanto'pi tadahritashayah svadharmamutsrijya taya
    samaraman | adharmakari dashami bhavan puna rdadhau bhavannamayute sute ratim || || sa mrityukale
    yamarajakinkaran bhayankaramstrinabhilakshayan bhiya | pura manak tvatsmritivasanabalat juhava narayananamakam
    sutam || || durashayasyapi tadatvanirgata tvadiyanamaksharamatravaibhavat | puro'bhipeturbhavadiyaparshadah
    caturbhujah pitapata manoramah || || amum ca sampashya vikarshato bhatan vimuncatetyarurudhurbaladami
    | nivaritaste ca bhavajjanaistada tadiyapapam nikhilam nyavedayan || || bhavantu papani katham tu
    nishkrite krite'pi bho dandanamasti panditah | na nishkritih kim vidita bhavadrisha miti prabho tvatpurusha
    babhashire || || shrutismritibhyam vihita vratadayah punanti papam na lunanti vasanam | anantaseva
    tu nikrintati dvayi miti prabho tvatpurusha babhashire || || anena bho janmasahasrakotibhih kriteshu
    papeshvapi nishkritih krita | yadagrahinnama bhayakulo hare riti prabho tvatpurusha babhashire ||
    || nrinamabuddhyapi mukundakirtanam dahatyaghaughan mahimasya tadrishah | yathagniredhamsi yathaushadham
    gada niti prabho tvatpurusha babhashire || || itiritairyamyabhatairapasrite bhavadbhatanam ca gane
    tirohite | bhavatsmritim kancana kalamacaran bhavatpadam prapi bhavadbhatairasau || || svakinkaravedanashankito
    yama stvadanghribhakteshu na gamyatamiti | svakiyabhrityanashishikshaduccakaih sa deva vatalayanatha
    pahi mam ||
  devanagari: अजामिलो नाम महीसुरः पुरा चरन् विभो धर्मपथान् गृहाश्रमी । गुरोर्गिरा काननमेत्य दृष्टवान्
    सुधृष्टशीलां कुलटां मदाकुलाम् ॥ ॥ स्वतः प्रशान्तोऽपि तदाहृताशयः स्वधर्ममुत्सृज्य तया समारमन् । अधर्मकारी
    दशमी भवन् पुन र्दधौ भवन्नामयुते सुते रतिम् ॥ ॥ स मृत्युकाले यमराजकिङ्करान् भयङ्करांस्त्रीनभिलक्षयन्
    भिया । पुरा मनाक् त्वत्स्मृतिवासनाबलात् जुहाव नारायणनामकं सुतम् ॥ ॥ दुराशयस्यापि तदात्वनिर्गत त्वदीयनामाक्षरमात्रवैभवात्
    । पुरोऽभिपेतुर्भवदीयपार्षदाः चतुर्भुजाः पीतपटा मनोरमाः ॥ ॥ अमुं च सम्पाश्य विकर्षतो भटान् विमुञ्चतेत्यारुरुधुर्बलादमी
    । निवारितास्ते च भवज्जनैस्तदा तदीयपापं निखिलं न्यवेदयन् ॥ ॥ भवन्तु पापानि कथं तु निष्कृते कृतेऽपि
    भो दण्डनमस्ति पण्डिताः । न निष्कृतिः किं विदिता भवादृशा मिति प्रभो त्वत्पुरुषा बभाषिरे ॥ ॥ श्रुतिस्मृतिभ्यां
    विहिता व्रतादयः पुनन्ति पापं न लुनन्ति वासनाम् । अनन्तसेवा तु निकृन्तति द्वयी मिति प्रभो त्वत्पुरुषा
    बभाषिरे ॥ ॥ अनेन भो जन्मसहस्रकोटिभिः कृतेषु पापेष्वपि निष्कृतिः कृता । यदग्रहीन्नाम भयाकुलो हरे रिति
    प्रभो त्वत्पुरुषा बभाषिरे ॥ ॥ नृणामबुद्ध्यापि मुकुन्दकीर्तनं दहत्यघौघान् महिमास्य तादृशः । यथाग्निरेधांसि
    यथौषधं गदा निति प्रभो त्वत्पुरुषा बभाषिरे ॥ ॥ इतीरितैर्याम्यभटैरपासृते भवद्भटानां च गणे तिरोहिते ।
    भवत्स्मृतिं कञ्चन कालमाचरन् भवत्पदं प्रापि भवद्भटैरसौ ॥ ॥ स्वकिङ्करावेदनशङ्कितो यम स्त्वदङ्घ्रिभक्तेषु
    न गम्यतामिति । स्वकीयभृत्यानशिशिक्षदुच्चकैः स देव वातालयनाथ पाहि माम् ॥
