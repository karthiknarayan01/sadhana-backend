id: naradparivra
category: upanishad
name:
  english: naradparivra
  devanagari: नरद्परिव्र
content:
  english: datividurakarmacaravidyaduro na pranavakirtanaparo yadyatkarma karoti tattatphalamanubhavati
    erandatailaphenavadatah sarvam parityajya tatprasaktam manodandam karapatram digambaram drishtva parivrajedbhikshuh
    | balonmattapishacavanmaranam jivitam va na kanksheta kalameva pratiksheta nirdeshabhritakanyayena
    parivraditi | titikshajnanavairagyashamadigunavarjitah | bhikshamatrena jivi syatsa yatiryativrittiha
    || 1|| na dandadharanena na mundanena na veshena na dambhacarena muktih | jnanadando dhrito yena ekadandi
    sa ucyate | kashthadando dhrito yena sarvashi jnanavarjitah | sa yati narakanghoranmaharauravasamjnitan
    || 2|| pratishtha sukarivishthasama gita maharshibhih | tasmadenam parityajya kitavatparyatedyatih
    || 3|| ayacitam yathalabham bhojanacchadanam bhavet | parecchaya ca digvasah snanam kuryatparecchaya
    || 4|| svapne'pi yo yuktah syajjagrativa visheshatah | idrikceshtah smritah shreshtho varishtho brahmavadinam
    || 5|| alabhe na vishadi syallabhe caiva na harshayet | pranayatrikamatrah syanmatrasangadvinirgatah
    || 6|| abhipujitalabhamshca jugupsetaiva sarvashah | abhipujitalabhaistu yatirmukto'pi badhyate ||
    7|| pranayatranimittam ca vyangare bhuktavajjane | kale prashaste varnanam bhikshartham paryatedgrihan
    || 8|| panipatrashcaranyogi nasakridbhaikshamacaret | tishthanbhunjyaccaranbhunjyanmadhyenacamanam
    tatha || 9|| abdhivaddhritamaryada bhavanti vishadashayah | niyatim na vimuncanti mahanto bhaskara
    eva || 10|| asyena tu yadaharam govanmrigayate munih | tada samah syatsarveshu so'mritatvaya kalpate
    || 11|| anindyam vai vrajangeham nindyam geham tu varjayet | anavrite visheddvari gehe naivavrite
    vrajet || 12|| pamsuna ca praticchannashunyagarapratishrayah | vrikshamulaniketo va tyaktasarvapriyapriyah
    || 13|| yatrastamitashayi syanniragniraniketanah | yathalabdhopajivi syanmunirdanto jitendriyah ||
    14|| nishkramya vanamasthaya jnanayajno jitendriyah | kalakankshi caranneva brahmabhuyaya kalpate
    || 15|| abhayam sarvabhutebhyo dattva carati yo munih | na tasya sarvabhutebhyo bhayamutpadyate kvacit
    || 16|| nirmanashcanahankaro nirdvandvashchinnasamshayah | naiva krudhyati na dveshti nanritam bhashate
    gira || 17|| punyayatanacari ca bhutanamavihimsakah | kale prapte bhavadbhaiksham kalpyate brahmabhuyase
    || 18|| vanaprasthagrihasthabhyam na samsrijyeta karhicit | ajnatacaryam lipseta na cainam harsha
    avishet || 19|| adhva suryena nirdishtah kitavadvicarenmahim | ashiryuktani karmani himsayuktani yani
    ca || 20|| lokasamgrahayuktani naiva kuryanna karayet | nasacchatreshu sajjeta nopajiveta jivikam
    | ativadamstyajettarkanpaksham kancana nashrayet || 21|| na shishyananubadhnita granthannaivabhyasedbahun
    | na vyakhyamupayunjita narambhanarabhetkvacit || 22|| avyaktalingo'vyaktartho munirunmattabalavat
    | kavirmukavadatmanam taddrishtya darshayennrinam || 23|| na kuryanna vadetkincinna dhyayetsadhvasadhu
    va | atmaramo'naya vrittya vicarejjadavanmunih || 24|| ekashcarenmahimetam nihsangah samyatendriyah
    | atmakrida atmaratiratmavansamadarshanah || 25|| budho balakavatkridetkushalo jadavaccaret | vadedunmattavadvidvan
    gocaryam naigamashcaret ||26|| kshipro'vamanito'sadbhih pralabdho'suyito'pi va | taditah samniruddho
    va vrittya va parihapitah || 27|| vishthito mutrito vajnairbahudhaivam prakampitah | shreyaskamah
    kricchragata atmanatmanamuddharet || 28|| sammananam param hanim yogarddheh kurute yatah | janenavamato
    yogi yogasiddhim ca vindati || 29|| tatha careta vai yogi satam dharmamadushayan | jana yathavamanyerangaccheyurnaiva
    sangatim || 30|| jarayujandajadinam vanmanahkayakarmabhih | yuktah kurvita na droham sarvasangamshca
    varjayet || 31|| kamakrodhau tatha darpalobhamohadayashca ye | tamstu doshanparityajya parivrad bhayavarjitah
    || 32|| bhaikshashanam ca maunitvam tapo dhyanam visheshatah | samyagjnanam ca vairagyam dharmo'yam
    bhikshuke matah || 33|| kashayavasah satatam dhyanayogaparayanah | gramante vrikshamule va vaseddevalaye'pi
    va || 34|| bhaikshena vartayennityam naikannashi bhavetkvacit | cittashuddhirbhavedyavattavannityam
    caretsudhih || 35|| tatah pravrajya shuddhatma samcaredyatra kutracit | bahirantashca sarvatra sampashyanhi
    janardanam || 36|| sarvatra vicarenmauni vayuvadvitakalmashah | samaduhkhasukhah kshanto hastapraptam
    ca bhakshayet || 37|| nirvairena samam pashyandvijagoshvamrigadishu | bhavayanmanasa vishnum paramatmanamishvaram
    || 38|| cinmayam paramanandam brahmaivahamiti smaran | jnatvaivam manodandam dhritva ashanivritto
    bhutva ashambaradharo bhutva sarvada manovakkayakarmabhih sarvasamsaramutsrijya prapancavanmukhah
    svarupanusandhanena bhramarakitanyayena mukto bhavatityupanishat || iti pancamopadeshah || 5|| atha
    naradah pitamahamuvaca | bhagavan tadabhyasavashat bhramakitanyayavattadabhyasah kathamiti | tamaha
    pitamahah | satyavagjnanavairagyabhyam vishishtadehavashishto vaset | jnanam shariram vairagyam jivanam
    viddhi shantidanti netre manomukham buddhih kala pancavimshatitattvanyavayava avastha pancamahabhutani
    karma bhaktijnanavairagyam shakha jagratsvapnasushuptituriyashcaturdashakaranani pankastambhakaraniti
    | evamapi navamatipankam karnadhara iva yanteva gajam svabuddhya vashikritya svavyatiriktam sarvam
    kritakam nashvaramiti matva viraktah purushah sarvada brahmahamiti vyavaharennanyatkincidveditavyam
    svavyatirekena | jivanmukto vasetkritakrityo bhavati | na naham brahmeti vyavaharetkintu brahmahamasmityajasram
    jagratsvapnasushuptishu | turiyavastham prapya turiyatitatvam vrajeddiva jagrannaktam svapnam sushuptamardharatram
    gatamityekavasthayam catasro'vasthastvekaikakaranadhinanam caturdashakarananam vyaparashcakshuradinam
    | cakshusho rupagrahanam shrotrayoh shabdagrahanam jihvaya rasasvadanam ghranasya gandhagrahanam vacaso
    vagvyaparah paneradanam padayoh samcarah payorutsarga upasthasyanandagrahanam tvacah sparshagrahanam
    | tadadhina ca vishayagrahanabuddhih buddhya buddhyati cittena cetayatyahankarenahankaroti | visrijya
    jiva etandehabhimanena jivo bhavati | grihabhimanena grihastha iva sharire jivah samcarati | pragdale
    punyavrittiragneyam nidralasyau dakshinayam krauryabuddhirnairrityam papabuddhih pashcime kridaratirvayavyam
    gamane buddhiruttare shantirishanye jnanam karnikayam vairagyam kesareshvatmacinta ityevam vaktram
    jnatva jivadavastham prathamam jagraddvitiyam svapnam tritiyam sushuptam caturtham turiyam caturbhirvirahitam
    turiyatitam | vishvataijasaprajnatatasthabhedaireka eva eko devah sakshi nirgunashca tadbrahmahamiti
    vyaharet | no cejjagradavasthayam jagradadicatasro'vasthah svapne svapnadicatasro'vasthah sushupte
    sushuptyadicatasro'vasthah turiye turiyadicatasro'vasthah natvevam turiyatitasya nirgunasya | sthulasukshmakaranarupairvishvataijasaprajneshvaraih
    sarvavasthasu sakshi tveka evavatishthate | uta tatastho drashta tatastho na drashta drashtritvanna
    drashtaiva kartritvabhoktritva ahankaradibhih sprishto jivah jivetaro na sprishtah | jivo'pi na sprishta
    iti cenna | jivabhimanena kshetrabhimanah | sharirabhimanena jivatvam | jivatvam ghatakashamahakashava
  devanagari: दतिविदूरकर्माचारविद्यादूरो न प्रणवकीर्तनपरो यद्यत्कर्म करोति तत्तत्फलमनुभवति एरण्डतैलफेनवदतः
    सर्वं परित्यज्य तत्प्रसक्तं मनोदण्डं करपात्रं दिगम्बरं दृष्ट्वा परिव्रजेद्भिक्षुः । बालोन्मत्तपिशाचवन्मरणं
    जीवितं वा न काङ्क्षेत कालमेव प्रतीक्षेत निर्देशभृतकन्यायेन परिव्राडिति । तितिक्षाज्ञानवैराग्यशमादिगुणवर्जितः
    । भिक्षामात्रेण जीवि स्यात्स यतिर्यतिवृत्तिहा ॥ १॥ न दण्डधारणेन न मुण्डनेन न वेषेण न दम्भाचारेण मुक्तिः
    । ज्ञानदण्डो धृतो येन एकदण्डी स उच्यते । काष्ठदण्डो धृतो येन सर्वाशी ज्ञानवर्जितः । स याति नरकान्घोरान्महारौरवसंज्ञितान्
    ॥ २॥ प्रतिष्ठा सूकरीविष्ठासमा गीता महर्षिभिः । तस्मादेनां परित्यज्य कीटवत्पर्यटेद्यतिः ॥ ३॥ अयाचितं
    यथालाभं भोजनाच्छादनं भवेत् । परेच्छया च दिग्वासाः स्नानं कुर्यात्परेच्छया ॥ ४॥ स्वप्नेऽपि यो युक्तः
    स्याज्जाग्रतीव विशेषतः । ईदृक्चेष्टः स्मृतः श्रेष्ठो वरिष्ठो ब्रह्मवादिनाम् ॥ ५॥ अलाभे न विषादी स्याल्लाभे
    चैव न हर्षयेत् । प्राणयात्रिकमात्रः स्यान्मात्रासङ्गाद्विनिर्गतः ॥ ६॥ अभिपूजितलाभांश्च जुगुप्सेतैव
    सर्वशः । अभिपूजितलाभैस्तु यतिर्मुक्तोऽपि बध्यते ॥ ७॥ प्राणयात्रानिमित्तं च व्यङ्गारे भुक्तवज्जने ।
    काले प्रशस्ते वर्णानां भिक्षार्थं पर्यटेद्गृहान् ॥ ८॥ पाणिपात्रश्चरन्योगी नासकृद्भैक्षमाचरेत् । तिष्ठन्भुञ्ज्याच्चरन्भुञ्ज्यान्मध्येनाचमनं
    तथा ॥ ९॥ अब्धिवद्धृतमर्यादा भवन्ति विशादाशयाः । नियतिं न विमुञ्चन्ति महान्तो भास्करा एव ॥ १०॥ आस्येन
    तु यदाहारं गोवन्मृगयते मुनिः । तदा समः स्यात्सर्वेषु सोऽमृतत्वाय कल्पते ॥ ११॥ अनिन्द्यं वै व्रजन्गेहं
    निन्द्यं गेहं तु वर्जयेत् । अनावृते विशेद्द्वारि गेहे नैवावृते व्रजेत् ॥ १२॥ पांसुना च प्रतिच्छन्नशून्यागारप्रतिश्रयः
    । वृक्षमूलनिकेतो वा त्यक्तसर्वप्रियाप्रियः ॥ १३॥ यत्रास्तमितशायी स्यान्निरग्निरनिकेतनः । यथालब्धोपजीवी
    स्यान्मुनिर्दान्तो जितेन्द्रियः ॥ १४॥ निष्क्रम्य वनमास्थाय ज्ञानयज्ञो जितेन्द्रियः । कालकाङ्क्षी चरन्नेव
    ब्रह्मभूयाय कल्पते ॥ १५॥ अभयं सर्वभूतेभ्यो दत्त्वा चरति यो मुनिः । न तस्य सर्वभूतेभ्यो भयमुत्पद्यते
    क्वचित् ॥ १६॥ निर्मानश्चानहङ्कारो निर्द्वन्द्वश्छिन्नसंशयः । नैव क्रुध्यति न द्वेष्टि नानृतं भाषते
    गिरा ॥ १७॥ पुण्यायतनचारी च भूतानामविहिंसकः । काले प्राप्ते भवद्भैक्षं कल्प्यते ब्रह्मभूयसे ॥ १८॥ वानप्रस्थगृहस्थाभ्यां
    न संसृज्येत कर्हिचित् । अज्ञातचर्यां लिप्सेत न चैनं हर्ष आविशेत् ॥ १९॥ अध्वा सूर्येण निर्दिष्टः कीटवद्विचरेन्महीम्
    । आशीर्युक्तानि कर्माणि हिंसायुक्तानि यानि च ॥ २०॥ लोकसंग्रहयुक्तानि नैव कुर्यान्न कारयेत् । नासच्छात्रेषु
    सज्जेत नोपजीवेत जीविकाम् । अतिवादांस्त्यजेत्तर्कान्पक्षं कञ्चन नाश्रयेत् ॥ २१॥ न शिष्याननुबध्नीत ग्रन्थान्नैवाभ्यसेद्बहून्
    । न व्याख्यामुपयुञ्जीत नारम्भानारभेत्क्वचित् ॥ २२॥ अव्यक्तलिङ्गोऽव्यक्तार्थो मुनिरुन्मत्तबालवत् ।
    कविर्मूकवदात्मानं तद्दृष्ट्या दर्शयेन्नृणाम् ॥ २३॥ न कुर्यान्न वदेत्किञ्चिन्न ध्यायेत्साध्वसाधु वा
    । आत्मारामोऽनया वृत्त्या विचरेज्जडवन्मुनिः ॥ २४॥ एकश्चरेन्महीमेतां निःसङ्गः संयतेन्द्रियः । आत्मक्रीड
    आत्मरतिरात्मवान्समदर्शनः ॥ २५॥ बुधो बालकवत्क्रीडेत्कुशलो जडवच्चरेत् । वदेदुन्मत्तवद्विद्वान् गोचर्यां
    नैगमश्चरेत् ॥२६॥ क्षिप्रोऽवमानितोऽसद्भिः प्रलब्धोऽसूयितोऽपि वा । ताडितः संनिरुद्धो वा वृत्त्या वा
    परिहापितः ॥ २७॥ विष्ठितो मूत्रितो वाज्ञैर्बहुधैवं प्रकम्पितः । श्रेयस्कामः कृच्छ्रगत आत्मनात्मानमुद्धरेत्
    ॥ २८॥ संमाननं परां हानिं योगर्द्धेः कुरुते यतः । जनेनावमतो योगी योगसिद्धिं च विन्दति ॥ २९॥ तथा चरेत
    वै योगी सतां धर्ममदूषयन् । जना यथावमन्येरन्गच्छेयुर्नैव सङ्गतिम् ॥ ३०॥ जरायुजाण्डजादीनां वाङ्मनःकायकर्मभिः
    । युक्तः कुर्वीत न द्रोहं सर्वसङ्गांश्च वर्जयेत् ॥ ३१॥ कामक्रोधौ तथा दर्पलोभमोहादयश्च ये । तांस्तु
    दोषान्परित्यज्य परिव्राड् भयवर्जितः ॥ ३२॥ भैक्षाशनं च मौनित्वं तपो ध्यानं विशेषतः । सम्यग्ज्ञानं च
    वैराग्यं धर्मोऽयं भिक्षुके मतः ॥ ३३॥ काषायवासाः सततं ध्यानयोगपरायणः । ग्रामान्ते वृक्षमूले वा वसेद्देवालयेऽपि
    वा ॥ ३४॥ भैक्षेण वर्तयेन्नित्यं नैकान्नाशी भवेत्क्वचित् । चित्तशुद्धिर्भवेद्यावत्तावन्नित्यं चरेत्सुधीः
    ॥ ३५॥ ततः प्रव्रज्य शुद्धात्मा संचरेद्यत्र कुत्रचित् । बहिरन्तश्च सर्वत्र सम्पश्यन्हि जनार्दनम् ॥
    ३६॥ सर्वत्र विचरेन्मौनी वायुवद्वीतकल्मषः । समदुःखसुखः क्षान्तो हस्तप्राप्तं च भक्षयेत् ॥ ३७॥ निर्वैरेण
    समं पश्यन्द्विजगोश्वमृगादिषु । भावयन्मनसा विष्णुं परमात्मानमीश्वरम् ॥ ३८॥ चिन्मयं परमानन्दं ब्रह्मैवाहमिति
    स्मरन् । ज्ञात्वैवं मनोदण्डं धृत्वा आशानिवृत्तो भूत्वा आशाम्बरधरो भूत्वा सर्वदा मनोवाक्कायकर्मभिः
    सर्वसंसारमुत्सृज्य प्रपञ्चावाङ्मुखः स्वरूपानुसन्धानेन भ्रमरकीटन्यायेन मुक्तो भवतीत्युपनिषत् ॥ इति
    पञ्चमोपदेशः ॥ ५॥ अथ नारदः पितामहमुवाच । भगवन् तदभ्यासवशात् भ्रमकीटन्यायवत्तदभ्यासः कथमिति । तमाह पितामहः
    । सत्यवाग्ज्ञानवैराग्याभ्यां विशिष्टदेहावशिष्टो वसेत् । ज्ञानं शरीरं वैराग्यं जीवनं विद्धि शान्तिदान्ती
    नेत्रे मनोमुखं बुद्धिः कला पञ्चविंशतितत्त्वान्यवयव अवस्था पञ्चमहाभूतानि कर्म भक्तिज्ञानवैराग्यं शाखा
    जाग्रत्स्वप्नसुषुप्तितुरीयाश्चतुर्दशकरणानि पङ्कस्तम्भाकाराणीति । एवमपि नावमतिपङ्कं कर्णधार इव यन्तेव
    गजं स्वबुद्ध्या वशीकृत्य स्वव्यतिरिक्तं सर्वं कृतकं नश्वरमिति मत्वा विरक्तः पुरुषः सर्वदा ब्रह्माहमिति
    व्यवहरेन्नान्यत्किञ्चिद्वेदितव्यं स्वव्यतिरेकेण । जीवन्मुक्तो वसेत्कृतकृत्यो भवति । न नाहं ब्रह्मेति
    व्यवहरेत्किन्तु ब्रह्माहमस्मीत्यजस्रं जाग्रत्स्वप्नसुषुप्तिषु । तुरीयावस्थां प्राप्य तुरीयातीतत्वं
    व्रजेद्दिवा जाग्रन्नक्तं स्वप्नं सुषुप्तमर्धरात्रं गतमित्येकावस्थायां चतस्रोऽवस्थास्त्वेकैककरणाधीनानां
    चतुर्दशकरणानां व्यापारश्चक्षुरादीनाम् । चक्षुषो रूपग्रहणं श्रोत्रयोः शब्दग्रहणं जिह्वाया रसास्वादनं
    घ्राणस्य गन्धग्रहणं वचसो वाग्व्यापारः पाणेरादानं पादयोः संचारः पायोरुत्सर्ग उपस्थस्यानन्दग्रहणं त्वचः
    स्पर्शग्रहणम् । तदधीना च विषयग्रहणबुद्धिः बुद्ध्या बुद्ध्यति चित्तेन चेतयत्यहङ्कारेणाहङ्करोति । विसृज्य
    जीव एतान्देहाभिमानेन जीवो भवति । गृहाभिमानेन गृहस्थ इव शरीरे जीवः संचरति । प्राग्दले पुण्यावृत्तिराग्नेयां
    निद्रालस्यौ दक्षिणायां क्रौर्यबुद्धिर्नैरृत्यां पापबुद्धिः पश्चिमे क्रीडारतिर्वायव्यां गमने बुद्धिरुत्तरे
    शान्तिरीशान्ये ज्ञानं कर्णिकायां वैराग्यं केसरेष्वात्मचिन्ता इत्येवं वक्त्रं ज्ञात्वा जीवदवस्थां प्रथमं
    जाग्रद्द्वितीयं स्वप्नं तृतीयं सुषुप्तं चतुर्थं तुरीयं चतुर्भिर्विरहितं तुरीयातीतम् । विश्वतैजसप्राज्ञतटस्थभेदैरेक
    एव एको देवः साक्षी निर्गुणश्च तद्ब्रह्माहमिति व्याहरेत् । नो चेज्जाग्रदवस्थायां जाग्रदादिचतस्रोऽवस्थाः
    स्वप्ने स्वप्नादिचतस्रोऽवस्थाः सुषुप्ते सुषुप्त्यादिचतस्रोऽवस्थाः तुरीये तुरीयादिचतस्रोऽवस्थाः नत्वेवं
    तुरीयातीतस्य निर्गुणस्य । स्थूलसूक्ष्मकारणरूपैर्विश्वतैजसप्राज्ञेश्वरैः सर्वावस्थासु साक्षी त्वेक
    एवावतिष्ठते । उत तटस्थो द्रष्टा तटस्थो न द्रष्टा द्रष्टृत्वान्न द्रष्टैव कर्तृत्वभोक्तृत्व अहङ्कारादिभिः
    स्पृष्टो जीवः जीवेतरो न स्पृष्टः । जीवोऽपि न स्पृष्ट इति चेन्न । जीवाभिमानेन क्षेत्राभिमानः । शरीराभिमानेन
    जीवत्वम् । जीवत्वं घटाकाशमहाकाशव
