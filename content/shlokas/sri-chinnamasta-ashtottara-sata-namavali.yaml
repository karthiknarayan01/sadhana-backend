    | om siddhinivahayai namah | om siddhayai namah | | om siddhanishevitayai namah | om shubhadayai namah
    | om shubhagayai namah | om shuddhayai namah | om shuddhasattvayai namah | om shubhavahayai namah
    | om shreshthayai namah | om drishtimayidevyai namah | om drishtisamharakarinyai namah | om sharvanyai
    namah | | om sarvagayai namah | om sarvayai namah | om sarvamangalakarinyai namah | om shivayai namah
    | om shantayai namah | om shantirupayai namah | om mridanyai namah | om madanaturayai namah |
  devanagari: ॐ छिन्नमस्तायै नमः । ॐ महाविद्यायै नमः । ॐ महाभीमायै नमः । ॐ महोदर्यै नमः । ॐ चण्डेश्वर्यै
    नमः । ॐ चण्डमात्रे नमः । ॐ चण्डमुण्डप्रभञ्जिन्यै नमः । ॐ महाचण्डायै नमः । ॐ चण्डरूपायै नमः । ॐ चण्डिकायै
    नमः । । ॐ चण्डखण्डिन्यै नमः । ॐ क्रोधिन्यै नमः । ॐ क्रोधजनन्यै नमः । ॐ क्रोधरूपायै नमः । ॐ कुह्वे
    नमः । ॐ कलायै नमः । ॐ कोपातुरायै नमः । ॐ कोपयुतायै नमः । ॐ कोपसंहारकारिण्यै नमः । ॐ वज्रवैरोचन्यै
