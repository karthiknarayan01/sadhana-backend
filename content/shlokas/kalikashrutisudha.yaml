id: kalikashrutisudha
category: stotram
name:
  english: kalikashrutisudha
  devanagari: कालिकाश्रुतिसुधा
content:
  english: ganaiste sannidhim bhushitam kritva''radhanapurvakam shubhagunannunam labhante sutan || 4||
    evam stotumanargalam sukavitashaktim pradehyambike jnanam sarvasarasvatishu vimalam vakpatavam cottamam
    | sadbhuddhim sumano'pi dehi sudridham gatram ca kirtim shriyam sodhva tvatpadabhaktimeva nitaram
    sarvaparadhamshca me || 5|| || om tatsat||
  devanagari: गणैस्ते सन्निधिं भूषितं कृत्वाऽऽराधनपूर्वकं शुभगुणान्नूनं लभन्ते सुतान् ॥ ४॥ एवं स्तोतुमनर्गलां
    सुकविताशक्तिं प्रदेह्यम्बिके ज्ञानं सर्वसरस्वतीषु विमलं वाक्पाटवं चोत्तमम् । सद्भुद्धिं सुमनोऽपि देहि
    सुदृढं गात्रं च कीर्तिं श्रियं सोढ्वा त्वत्पदभक्तिमेव नितरां सर्वापराधांश्च मे ॥ ५॥ ॥ ॐ तत्सत्॥
meaning: {}
