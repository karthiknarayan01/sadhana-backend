id: rigvediya-pancha-rudram
category: stotram
name:
  english: Rigvediya Pancha Rudram
content:
  english: '|| om shri ganeshaya namah || ganapati stutih harih om ganana ntva ganapatim havamahe kavi
    nkavinamupamashravastamam | jyeshtharajam brahmana mbrahmanaspata a nah sha rinvannutibhih sida sadanam
    || ida ganapate ganeshu tvam nkavinam | na rite tavatkriyate ki mmaghavancitramarca || a tu na indra
    kshumanta ngṟubhaya | mahahasti dakshinena || om shri mahaganapataye namah || atha pancarudra prathamamandale
    tricatvarimsham suktam rishih kanvo ghaurah | devata harih om kadrudraya prac hushtamaya tavyase |
    vocema shantamam hride || a no aditih karatpashve nribhyo yatha gav a tokaya rudriy a no mitro varuno
    yath mmedhapatim rudra shshukra iva suryo hir anyamiva rocate | shreshth nnah karatyarvate suga e
    | nribhyo naribhyo gav oma shriyamadhi ni dh ehi shatasya nrinam | mahi shravastuvinrimnam || || ma
    nah somaparibadho mar atayo juhuranta | a na indo vaj e praja amritasya parasmindham annritasya |
    murdha nabh prathama mandale caturdashottarashatatam suktam rishih kutsa angirasah | devata rudrah
    | chandah nicrittrishtup | svarah ima rudraya tavas iraya pra bharamahe matih | yatha shamasaddvipade
    catushpade vishva e asminnanaturam || o rudrota no mayaskridhi kshayadv iraya namasa vidhema te |
    yaccha nca yoshca manurayeje pita tadashyama tava rudra pran || ashyama te sumati irasya tava rudra
    midhvah | sumnayannidvish o asmakama cararishtavira juhavama te havih || nkavimavase ni hvayamahe
    | are asmaddaivyam hel o asyatu sumatimidvayamasya vṟunimahe || || divo varahamarusha nnamasa ni hvayamahe
    | haste bibhradbheshaja vary ani sharma varma cchardirasmabhyam amucyate vacah svado iyo rudraya vardhanam
    | rasv a ca no amrita martabhojanam tman e tokaya tanayaya mrila || o mahantamuta man antamuta ma
    na ukshitam | man o vadhih pitaram mota mataram ma nah priyastanv || ma nastoke tanaye ma na ayau
    ma no goshu ma no ashv eshu ririshah | viranma n o rudra bhamito vadhir anpashupa ivakaram rasv a
    pitarmarutam sumnamasme | bhadra hit e sumatirmṟulayattamath nkshayadvira sumnamasme t e astu | mrila
    ca no adhi ca bruhi devadh a ca nah sharma yaccha dvibar o asma avasyavah shrinotu no havam o mitro
    varuno mamahantamaditih sindhuh prithivi uta dyauh || dvitiyamandale trayastrimsham suktam rishih
    gritsamadah | devata rudrah | chandah bhurikpanktih | svarah e pitarmarutam sumnam etu ma nah suryasya
    sandrish o viro arvati kshameta pra j ayemahi rudra prajabhih || || tvadattebhi rudra shantamebhi
    a ashiya bheshajebhih | vya o jatasya rudra shriyasi tavastamastavasam iti rapaso yuyodhi || a rudra
    cukrudhama nam obhirma dushtuti vrishabha ma sah o vira~ arpaya bheshajebhirbhishaktama havate yo
    havirbhirava stom ndishiya | ridudarah suhavo ma n a mamanda vrishabho marutvantvaksh iyasa vayasa
    nadhamanam | ghrin iva cchayamarapa ashiya vivaseyam rudrasya sumnam || hasto yo asti bheshajo jal
    ashah | apabharta rapaso daivyasyabhi nu m e vrishabhaya shvitice maho mahim sushtutim irayami | namasya
    kalmalikinam nam obhirgrinimasi tvesham rudrasya nama || pururupa ugro babhru shshukrebhih pipishe
    hir anadasya bhuvanasya bhurerna va u yoshadrudradasury shi sayakani dhanvar ndayase vishvamabhvam
    na va oj iyo rudra tvadasti || nna bhimamupahatnumugram | mrila jaritre rudra stav e asmanni vapantu
    senah || kumarashcitpitaram vandamanam prati nanama rudropayant erdataram satpati ngrinishe stutastva
    o bheshaja marutah shuc ini ya shantama vrishano ya mayobhu | yani manuravṟunita pita nasta sha nca
    yoshca rudrasya vashmi || || pari no heti rudrasya vrijyah pari tveshasya durmatirmahi g at | ava
    sthira maghavadbhyastanushva midhvastokaya tanayaya mrila || || eva babhro vrishabha cekitana yath
    a deva na hṟunishe na hamsi | havanashrunn odhi brihadvadema vidath shashthamandale catussaptatitamam
    suktam rishih bharadvajo bar haspatyah | devata somarudrau | chandah ''ramashnuvantu | dam edame sapta
    ratna dadh arudra vi vṟuhatam vish iva ya no gayamavivesha | are b mparacairasme bhadra sa ushravasani
    santu || arudra yuvametanyasme vishv a tanushu bheshajani dhattam | ava syata mmuncatam yanno asti
    tanushu baddha || tigmayudhau tigmah arudraviha su mṟulata o muncatam varunasya pash saptamamandale
    shatcatvarimsham suktam rishih vasishthah | devata rudrah | chandah svaratpanktih | svarah ima rudraya
    sthiradh anvane girah kshipreshave devaya svadhavn haya sahamanaya vedhas e tigmayudhaya bharata shrinotu
    nah || ena kshamyasya janmanah samr ajyena divyasya cetati | avannav antirupa no durashcaranamivo
    rudra jasu no bhava || e didyudavasrishta divaspari kshmaya carati pari sa vṟunaktu nah | sahasra
    nte svapivata bheshaja ma nastokeshu tanayeshu ririshah || e bhuma prasitau hilitasya | an hishi jivashamse
    yuya || asme rudra mehana parvataso vritrahatye bharahutau sajoshah shshamsate stuvate dhayi pajra
    indrajyeshtha asma~ avantu devah || tvamagne rudro asuro maho divastvam shardho maruta shshaunahotro
    bhargavo gritsamadah anamadhvarasya rudram hot aram satyayajam rodasyoh | agni mpura tanayitnoracittaddhir
    anyarupamavase krinudhvam || tava shriye marut o marjayanta rudra yatte janima caru citram | padam
    nnidhayi tena pasi guhyam nama gon ngirbhirabhi rudra a rudramaktau | brihantamrishvamajaram sushumnamridhagghuvema
    kavin ssudhanva yo vishvasya kshayati bheshajasya | yakshv mme hasto bhagavanaya mme bhagavattarah
    | aya mpushtivardhanam | urvarukamiva bandhananmrityormukshiya mamrit shanti pathamantrah harih om
    tatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodayat || ishanassarvavidyanamishvara ssarvabhutanam
    | brahmadhipatirbrahmano ''dhipatirbahma shivo me ''stu sadashivom || om shivo namasi svadhitiste
    pita namaste astu ma ma hi sih | nivartayamyayushe ''nnadyaya prajananaya rayasposhaya suprajastvaya
    suviryaya || om vi~shvani deva savitarduritani parasuva | yadbhadra shshantirantariksha shantih prithivi
    shantirapah shantiroshadhayah shantih | vanaspatayah shantirvishvedeva shshantirbrahma shantih sarva
    shantih shantireva shantih sa ma shantiredhi || om sarvesham raso yatsamah | sarveshamevainametad
    vedana rasenabhishincati || om shambhave namah | namaste astu bhagavanvishveshvaraya mahadevaya tryambakaya
    tripurantakaya trikagnikalaya kalagnirudraya nilakanthaya mrityunjayaya sarveshvaraya sadashivaya
    shrimanmahadevaya namah || om yadaksharapadabhrashta nca yadbhavet | tatsarva ndeva prasida parameshvara
    || om shantih shantih shantih || anena shri rudrabhishekakarmana shri bhavanishankara maharudrah priyata
    nna mama | iti shririgvediya pancarudram samapta | || om shri samba sadashivarpanamastu ||'
  devanagari: ॥ ॐ श्री गणेशाय नमः ॥ गणपति स्तुतिः हरिः॑ ॐ ग॒णाना न्त्वा ग॒णप्॑अतिं हवामहे क॒वि ङ्क्॑अवी॒नाम्॑उप॒मश्र्॑अवस्तमम्
    । ज्ये॒ष्ठ॒राजं॒ ब्रह्म्॑अणा म्ब्रह्मणस्पत॒ आ नः॑ श ऋ॒ण्वन्नू॒तिभिः॑ सीद॒ साद्॑अनम् ॥ ईद गणपते ग॒णेषु॒
    त्वाम् ङ्कवी॒नाम् । न ऋ॒ते तवत्क्र्॑इयते॒ कि म्म्॑अघवञ्चि॒त्रम्॑अर्च ॥ आ तू न्॑अ इन्द्र क्षु॒मन्त
    ङ्ग्ऱ्॑उभाय । म॒हा॒ह॒स्ती दक्ष्॑इणेन ॥ ॐ श्री महागणपतये॒ नमः॑ ॥ अथ पञ्चरुद्र प्रथममण्डले त्रिचत्वारिंशं
    सूक्तं ऋषिः कण्वो घौरः । देवता हरिः॑ ॐ कद्रु॒द्राय॒ प्रच् हुष्ट्॑अमाय॒ तव्य्॑असे । वो॒चेम॒ शन्त्॑अमं
    हृ॒दे ॥ आ नो अद्॑इतिः॒ कर॒त्पश्वे॒ नृभ्यो॒ यथा॒ गव् आ तो॒काय्॑अ रु॒द्रिय् आ नो मि॒त्रो वर्॑उणो॒ यथ्
    म्मे॒धप्॑अतिं रु॒द्र श्शु॒क्र ॑इव॒ सूर्यो॒ हिर् अण्यमिव॒ रोच्॑अते । श्रेष्ठ् न्नः॑ कर॒त्यर्व्॑अते
    सु॒ग ए । नृभ्यो॒ नार्॑इभ्यो॒ गव् ओम॒ श्रिय॒मधि॒ नि ध् एहि श॒तस्य्॑अ नृ॒णाम् । महि॒ श्रव्॑अस्तुविनृ॒म्णम्
    ॥ ॥ मा नः॑ सोमपरि॒बाधो॒ मार् आतयो जुहुरन्त । आ न्॑अ इन्दो॒ वाज् ए प्र॒जा अ॒मृत्॑अस्य॒ पर्॑अस्मि॒न्धाम्
    अन्नृ॒तस्य्॑अ । मू॒र्धा नाभ् प्रथम मण्डले चतुर्दशोत्तरशततं सूक्तम् ऋषिः कुत्स आङ्गिरसः । देवता रुद्रः
    । छन्दः निचृत्त्रिष्टुप् । स्वरः इ॒मा रु॒द्राय्॑अ त॒वस् ईराय॒ प्र भ्॑अरामहे म॒तीः । यथा॒ शमस्॑अद्द्वि॒पदे॒
    चत्॑उष्पदे॒ विश्व ए अ॒स्मिन्न्॑अनातु॒रम् ॥ ओ रुद्रो॒त नो॒ मय्॑अस्कृधि क्ष॒यद्व् ईराय॒ नम्॑असा विधेम
    ते । यच्छ ञ्च॒ योश्च॒ मन्॑उराये॒जे पि॒ता तद्॑अश्याम॒ तव्॑अ रुद्र॒ प्रण् ॥ अ॒श्याम्॑अ ते सुम॒ति ईरस्य॒
    तव्॑अ रुद्र मीढ्वः । सु॒म्ना॒यन्निद्विश् ओ अ॒स्माक॒मा च॒रार्॑इष्टवीरा जुहवाम ते ह॒विः ॥ ङ्क॒विमव्॑असे॒
    नि ह्व्॑अयामहे । आ॒रे अ॒स्मद्दैव्यं॒ हेल् ओ अस्यतु सुम॒तिमिद्व॒यम॒स्या व्ऱ्॑उणीमहे ॥ ॥ दि॒वो व्॑अरा॒हम्॑अरु॒ष
    न्नम्॑असा॒ नि ह्व्॑अयामहे । हस्ते॒ बिभ्र्॑अद्भेष॒जा वार्य् आणि॒ शर्म॒ वर्म्॑अ च्छ॒र्दिर॒स्मभ्यं आमुच्यते॒
    वचः॑ स्वा॒दो ईयो रु॒द्राय॒ वर्ध्॑अनम् । रास्व् आ च नो अमृत मर्त॒भोज्॑अनं॒ त्मन् ए तो॒काय॒ तन्॑अयाय
    मृल ॥ ओ म॒हान्त्॑अमु॒त मान् अन्तमु॒त मा न्॑अ उक्षि॒तम् । मान् ओ वधीः पि॒तरं॒ मोत मा॒तरं॒ मा नः॑ प्रि॒यास्त॒न्व्
    ॥ मा न्॑अस्तो॒के तन्॑अये॒ मा न्॑अ आ॒यौ मा नो॒ गोषु॒ मा नो॒ अश्व् एषु रीरिषः । वी॒रान्मा न् ओ रुद्र
    भामि॒तो व्॑अधीर् आन्पशु॒पा इ॒वाक्॑अरं॒ रास्व् आ पितर्मरुतां सु॒म्नम॒स्मे । भ॒द्रा हित् ए सुम॒तिर्म्ऱ्॑उल॒यत्त॒माथ्
    ङ्क्षय्॑अद्वीर सु॒म्नम॒स्मे त् ए अस्तु । मृ॒ला च्॑अ नो॒ अध्॑इ च ब्रूहि दे॒वाध् आ च नः॒ शर्म्॑अ यच्छ
    द्वि॒बर् ओ अस्मा अव॒स्यवः॑ शृ॒णोत्॑उ नो॒ हवं ओ मि॒त्रो वर्॑उणो मामहन्ता॒मद्॑इतिः॒ सिन्धुः॑ पृथि॒वी
    उ॒त द्यौः ॥ द्वितीयमण्डले त्रयस्त्रिंशं सूक्तम् ऋषिः गृत्समदः । देवता रुद्रः । छन्दः भुरिक्पङ्क्तिः
    । स्वरः ए पितर्मरुतां सु॒म्नम् एतु॒ मा नः॒ सूर्य्॑अस्य स॒न्दृश् ओ वी॒रो अर्व्॑अति क्षमेत॒ प्र ज् आयेमहि
    रुद्र प्र॒जाभिः॑ ॥ ॥ त्वाद्॑अत्तेभी रुद्र॒ शन्त्॑अमेभि आ अशीय भेष॒जेभिः॑ । व्य ओ जा॒तस्य्॑अ रुद्र
    श्रि॒यास्॑इ त॒वस्त्॑अमस्त॒वसां ईती॒ रप्॑असो युयोधि ॥ आ रुद्र चुक्रुधामा॒ नम् ओभि॒र्मा दुष्ट्॑उती वृषभ॒
    मा सह् ओ वी॒राँ ॑अर्पय भेष॒जेभ्॑इर्भि॒षक्त्॑अम हव्॑अते॒ यो ह॒विर्भि॒रव॒ स्तोम् न्द्॑इषीय । ऋ॒दू॒दरः॑
    सु॒हवो॒ मा न् आ ममन्द वृष॒भो म॒रुत्वा॒न्त्वक्ष् ईयसा॒ वय्॑असा॒ नाध्॑अमानम् । घृण् ईव च्छा॒याम्॑अर॒पा
    ॑अशी॒या व्॑इवासेयं रु॒द्रस्य्॑अ सु॒म्नम् ॥ हस्तो॒ यो अस्त्॑इ भेष॒जो जल् आषः । अ॒प॒भ॒र्ता रप्॑असो॒
    दैव्य्॑अस्या॒भी नु म् ए वृष॒भाय्॑अ श्विती॒चे म॒हो म॒हीं स्॑उष्टु॒तिम् ईरयामि । न॒म॒स्या क्॑अल्मली॒किनं॒
    नम् ओभिर्गृणी॒मस्॑इ त्वे॒षं रु॒द्रस्य॒ नाम्॑अ ॥ पुरु॒रूप्॑अ उ॒ग्रो ब॒भ्रु श्शु॒क्रेभिः॑ पिपिशे॒ हिर्
    आनाद॒स्य भुव्॑अनस्य॒ भूरे॒र्न वा ॑उ योषद्रु॒द्राद्॑असु॒र्य् षि॒ साय्॑अकानि॒ धन्वार् न्द्॑अयसे॒ विश्व॒मभ्वं॒
    न वा ओज् ईयो रुद्र॒ त्वद्॑अस्ति ॥ न्न भी॒मम्॑उपह॒त्नुमु॒ग्रम् । मृ॒ला ज्॑अरि॒त्रे र्॑उद्र॒ स्तव् ए
    अ॒स्मन्नि व्॑अपन्तु॒ सेनाः ॥ कु॒मा॒रश्च्॑इत्पि॒तरं॒ वन्द्॑अमानं॒ प्रत्॑इ नानाम रुद्रोप॒यन्त् एर्दा॒तारं॒
    सत्प्॑अति ङ्गृणीषे स्तु॒तस्त्व ओ भेष॒जा म्॑अरुतः॒ शुच् ईनि॒ या शन्त्॑अमा वृषणो॒ या म्॑अयो॒भु । यानि॒
    मनु॒रव्ऱ्॑उणीता पि॒ता न॒स्ता श ञ्च॒ योश्च्॑अ रु॒द्रस्य्॑अ वश्मि ॥ ॥ पर्॑इ णो हे॒ती रु॒द्रस्य्॑अ वृज्याः॒
    पर्॑इ त्वे॒षस्य्॑अ दुर्म॒तिर्म॒ही ग् आत् । अव्॑अ स्थि॒रा म॒घव्॑अद्भ्यस्तनुष्व॒ मीढ्व्॑अस्तो॒काय॒ तन्॑अयाय
    मृल ॥ ॥ ए॒वा ब्॑अभ्रो वृषभ चेकितान॒ यथ् आ देव॒ न ह्ऱ्॑उणी॒षे न हंस्॑इ । ह॒व॒न॒श्रुन्न् ओधि बृ॒हद्व्॑अदेम
    वि॒दथ् षष्ठमण्डले चतुस्सप्ततितमं सूक्तम् ऋषिः भरद्वाजो बार् हस्पत्यः । देवता सोमारुद्रौ । छन्दः ऽर्॑अमश्नुवन्तु
    । दम् एदमे स॒प्त रत्ना॒ दध् आरुद्रा॒ वि व्ऱ्॑उहतं॒ विष् ईवा॒ या नो॒ गय्॑अमावि॒वेश्॑अ । आ॒रे ब् म्परा॒चैर॒स्मे
    भ॒द्रा स उश्रव॒सान्॑इ सन्तु ॥ आरुद्रा यु॒वमे॒तान्य॒स्मे विश्व् आ त॒नूष्॑उ भेष॒जान्॑इ धत्तम् । अव्॑अ
    स्यत म्मु॒ञ्चतं॒ यन्नो॒ अस्त्॑इ त॒नूष्॑उ ब॒द्ध ॥ ति॒ग्माय्॑उधौ ति॒ग्मह् आरुद्रावि॒ह सु म्ऱ्॑उलत ओ
    मुञ्चतं॒ वर्॑उणस्य॒ पाश् सप्तममण्डले षट्चत्वारिंशं सूक्तम् ऋषिः वसिष्ठः । देवता रुद्रः । छन्दः स्वराट्पङ्क्तिः
    । स्वरः इ॒मा रु॒द्राय्॑अ स्थि॒रध् अन्वने॒ गिरः॑ क्षि॒प्रेष्॑अवे दे॒वाय्॑अ स्व॒धाव्न् हाय॒ सह्॑अमानाय
    वे॒धस् ए ति॒ग्माय्॑उधाय भरता शृ॒णोत्॑उ नः ॥ एण॒ क्षम्य्॑अस्य॒ जन्म्॑अनः॒ साम्र् आज्येन दि॒व्यस्य॒
    चेत्॑अति । अव॒न्नव् अन्ती॒रुप्॑अ नो॒ दुर्॑अश्चरानमी॒वो र्॑उद्र॒ जास्॑उ नो भव ॥ ए दि॒द्युदव्॑असृष्टा
    दि॒वस्पर्॑इ क्ष्म॒या चर्॑अति॒ परि॒ सा व्ऱ्॑उणक्तु नः । स॒हस्र न्ते स्वपिवात भेष॒जा मा न्॑अस्तो॒केषु॒
    तन्॑अयेषु रीरिषः ॥ ए भूम॒ प्रस्॑इतौ हीलि॒तस्य्॑अ । आन् हिष्॑इ जीवशं॒से यू॒य ॥ अ॒स्मे रु॒द्रा मे॒हना॒
    पर्व्॑अतासो वृत्र॒हत्ये॒ भर्॑अहूतौ स॒जोषाः श्शंस्॑अते स्तुव॒ते धाय्॑इ प॒ज्र इन्द्र्॑अज्येष्ठा अ॒स्माँ
    ॑अवन्तु दे॒वाः ॥ त्वम्॑अग्ने रु॒द्रो अस्॑उरो म॒हो दि॒वस्त्वं शर्धो॒ मार्॑उत श्शौनहोत्रो भार्गवो गृत्समदः
    आनमध्व॒रस्य्॑अ रु॒द्रं होत् आरं सत्य॒यजं॒ रोद्॑अस्योः । अ॒ग्नि म्पु॒रा त्॑अनयि॒त्नोर॒चित्ता॒द्धिर्
    अण्यरूप॒मव्॑असे कृणुध्वम् ॥ तव्॑अ श्रि॒ये म॒रुत् ओ मर्जयन्त॒ रुद्र॒ यत्ते॒ जन्॑इम॒ चार्॑उ चि॒त्रम्
    । प॒दं न्नि॒धायि॒ तेन्॑अ पासि॒ गुह्यं॒ नाम॒ गोन् ङ्गी॒र्भिरा॒भी रु॒द्र आ रु॒द्रम॒क्तौ । बृ॒हन्त्॑अमृ॒ष्वम॒जरं
    सुषु॒म्नमृध्॑अग्घुवेम क॒विन् स्सु॒धन्वा॒ यो विश्व्॑अस्य॒ क्षय्॑अति भेष॒जस्य्॑अ । यक्ष्व् म्मे॒ हस्तो॒
    भग्॑अवान॒य म्मे॒ भग्॑अवत्तरः । अ॒य म्पुष्टि॒वर्ध्॑अनम् । उ॒र्वा॒रु॒कम्॑इव॒ बन्ध्॑अनान्मृ॒त्योर्म्॑उक्षीय॒
    मामृत् शान्ति पाठमन्त्रः हरिः॑ ॐ तत्पुर्॑उषाय वि॒द्मह्॑ए महादे॒वाय्॑अ धीमहि । तन्न्॑ओ रुद्रः प्रचो॒दय्॑आत्
    ॥ ईशानस्सर्व्॑अविद्या॒ना॒मीश्वर स्सर्व्॑अभूता॒नां॒ । ब्रह्माध्॑इपति॒र्ब्रह्म॒णो ऽध्॑इपति॒र्बह्म्॑आ
    शि॒वो म्॑ए ऽस्तु सदाशि॒वोम् ॥ ॐ शि॒वो नाम्॑आसि॒ स्वध्॑इतिस्ते पि॒ता नम्॑अस्ते अस्तु॒ मा म्॑आ हि सीः
    । निव्॑अर्तयाम्याय्॑उषे॒ ऽन्नाद्य्॑आय॒ प्रजन्॑अनाय रा॒यस्पोष्॑आय सुप्रजा॒स्त्वाय्॑अ सु॒वीर्य्॑आय ॥
    ॐ विँश्व्॑आनि देव सवितर्दुरि॒तानि॒ परासुव । यद्भ॒द्र श्शान्त्॑इर॒न्तर्॑इक्ष॒ शान्तिः॑ पृथि॒वी शान्ति॒रापः॒
    शान्ति॒रोष्॑अधयः॒ शान्तिः॑ । वन॒स्पत्॑अयः॒ शान्ति॒र्विश्व्॑एदे॒वा श्शान्ति॒र्ब्रह्म॒ शान्तिः॒ सर्व॒
    शान्तिः॒ शान्त्॑इरे॒व शान्तिः॒ सा मा॒ शान्त्॑इरेधि ॥ ॐ सर्वेषां रसो यत्सामः । सर्वेषामेवैनमेतद् वेदाना
    रसेनाभिषिञ्चति ॥ ॐ शम्भ्॑अवे॒ नमः॑ । नम्॑अस्ते अस्तु भगवन्विश्वेश्व॒राय्॑अ महादे॒वाय्॑अ त्र्यम्ब॒काय्॑अ
    त्रिपुरान्त॒काय्॑अ त्रिकाग्निका॒लाय्॑अ कालाग्निरु॒द्राय्॑अ नीलक॒ण्ठाय्॑अ मृत्युञ्ज॒याय्॑अ सर्वेश्व॒राय्॑अ
    सदाशि॒वाय्॑अ श्रीमन्महादे॒वाय॒ नमः॑ ॥ ॐ यदक्षरपदभ्रष्ट ञ्च यद्भवेत् । तत्सर्व न्देव प्रसीद परमेश्वर
    ॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ ॥ अनेन श्री रुद्राभिषेककर्मणा श्री भवानीशङ्कर महारुद्राः प्रीयता न्न
    मम । इति श्रीऋग्वेदीय पञ्चरुद्रं समाप्ता । ॥ ॐ श्री साम्ब सदाशिवार्पणमस्तु ॥
