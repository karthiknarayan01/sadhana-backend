id: venkateshvarakritis-2
category: stotram
name:
  english: venkateshvarakritis 2
  devanagari: वेन्कटेश्वरक्रितिस् २
content:
  english: ragamalika pa|| namo narayanaya | namo narayanaya || anupa|| narayanaya sagunabrahmane sarva|
    parayanaya shobhanamurtaye namo || ca|| nityaya vibudhasamstutyaya nityadhipatyaya munigana pratyayaya
    | satyaya pratyakshaya sanmanasasangatyaya jagadavanakrityaya te namo || ca|| akramoddhatabahuvikramatikrantashukrashishyonmulanakramaya
    | shakradigirvanavakrabhayabhanganirvakraya nihataricakraya te namo || ca|| aksharayatinirapekshaya
    pundarikakshaya shrivatsalakshanaya | akshinavijnanadakshayogindrasamrakshanukampakatakshaya te namo
    || ca|| karirajavaradaya kaustubhabharanaya | muravairine jaganmohanaya | tarunendukotirataruni manasstotraparitoshacittaya
    paramaya te namo || ca|| patradanotsavaprathita venkataraya | dhatrishakamitarthapradaya | gotrabhinmaniruciragatraya
    ravicandranetraya sheshadrinilayaya te namo || 39
  devanagari: रागमालिक प॥ नमो नारायणाय । नमो नारायणाय ॥ अनुप॥ नारायणाय सगुणब्रह्मणे सर्व। पारायणाय शोभनमूर्तये
    नमो ॥ च॥ नित्याय विबुधसंस्तुत्याय नित्याधिपत्याय मुनिगण प्रत्ययाय । सत्याय प्रत्यक्षाय सन्मानससाङ्गत्याय
    जगदावनकृत्याय ते नमो ॥ च॥ आक्रमोद्धतबाहुविक्रमातिक्रान्तशुक्रशिष्योन्मूलनक्रमाय । शक्रादिगीर्वाणवक्रभयभङ्गनिर्वक्राय
    निहतारिचक्राय ते नमो ॥ च॥ अक्षरायातिनिरपेक्षाय पुण्डरीकाक्षाय श्रीवत्सलक्षणाय । अक्षीणविज्ञानदक्षयोगीन्द्रसंरक्षानुकम्पाकटाक्षाय
    ते नमो ॥ च॥ करिराजवरदाय कौस्तुभाभरणाय । मुरवैरिणे जगन्मोहनाय । तरुणेन्दुकोटिरतरुणी मनस्स्तोत्रपरितोषचित्ताय
    परमाय ते नमो ॥ च॥ पात्रदानोत्सवप्रथित वेङ्कटराय । धात्रीशकामितार्थप्रदाय । गोत्रभिन्मणिरुचिरगात्राय
    रविचन्द्रनेत्राय शेषाद्रिनिलयाय ते नमो ॥ ३९
