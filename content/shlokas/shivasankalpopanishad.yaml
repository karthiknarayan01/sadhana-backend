id: shivasankalpopanishad
category: upanishad
name:
  english: shivasankalpopanishad
  devanagari: शिवसन्कल्पोपनिशद्
content:
  english: sarva̱mota̭m pra̱jana̱m tanme̱ mana̭h shi̱vasa̭nkalpamastu || 5|| su̱sha̱ra̱thirashva̭niva̱
    yanma̭nu̱shya̱nneni̱yate̱'bhishṷbhirva̱jina̭ iva | hri̱tprati̭shtha̱m yada̭ji̱ram javi̭shtha̱m tanme̱
    mana̭h shi̱vasa̭nkalpamastu || 6|| om shanti̱h shanti̱h shanti̭h || || iti vajasaneyasamhitayam shivasankalpopanishat
    samapta || || shrishivasankalpopanishat || yajjagrato duramudaiti daivam tadu suptasya tathaivaiti
    | durangamam jyotisham jyotirekam tanme manah shivasankalpamastu || 1|| yena karmanyapaso manishino
    yajne krinvanti vidatheshu dhirah | yadapurvam yakshamantah prajanam tanme manah shivasankalpamastu
    || 2|| yatprajnanamuta ceto dhritishca yajjyotirantaramritam prajasu | yasmanna'rite kim cana karma
    kriyate tanme manah shivasankalpamastu || 3|| yenedam bhutam bhuvanam bhavishyatparigrihitamamritena
    sarvam | yena yajnastayate saptahota tanme manah shivasankalpamastu || 4|| yasminnricah sama yaju
  devanagari: सर्व॒मोतं॑ प्र॒जानां॒ तन्मे॒ मनः॑ शि॒वस॑ङ्कल्पमस्तु ॥ ५॥ सु॒षा॒र॒थिरश्वा॑निव॒ यन्म॑नु॒ष्या॒न्नेनी॒यते॒ऽभीशु॑भिर्वा॒जिन॑
    इव । हृ॒त्प्रति॑ष्ठं॒ यद॑जि॒रं जवि॑ष्ठं॒ तन्मे॒ मनः॑ शि॒वस॑ङ्कल्पमस्तु ॥ ६॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑
    ॥ ॥ इति वाजसनेयसंहितायां शिवसङ्कल्पोपनिषत् समाप्ता ॥ ॥ श्रीशिवसङ्कल्पोपनिषत् ॥ यज्जाग्रतो दूरमुदैति
    दैवं तदु सुप्तस्य तथैवैति । दूरङ्गमं ज्योतिषां ज्योतिरेकं तन्मे मनः शिवसङ्कल्पमस्तु ॥ १॥ येन कर्माण्यपसो
    मनीषिणो यज्ञे कृण्वन्ति विदथेषु धीराः । यदपूर्वं यक्षमन्तः प्रजानां तन्मे मनः शिवसङ्कल्पमस्तु ॥ २॥
    यत्प्रज्ञानमुत चेतो धृतिश्च यज्ज्योतिरन्तरमृतं प्रजासु । यस्मान्नऽऋते किं चन कर्म क्रियते तन्मे मनः
    शिवसङ्कल्पमस्तु ॥ ३॥ येनेदं भूतं भुवनं भविष्यत्परिगृहीतममृतेन सर्वम् । येन यज्ञस्तायते सप्तहोता तन्मे
    मनः शिवसङ्कल्पमस्तु ॥ ४॥ यस्मिन्नृचः साम यजू
