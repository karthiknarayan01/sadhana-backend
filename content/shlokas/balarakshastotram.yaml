id: balarakshastotram
category: raksha
name:
  english: balarakshastotram
  devanagari: बालारक्षास्तोत्रम्
content:
  english: shribalarakshastotram sarvalokaikajanake sarvabhishtaphalaprade | raksha mam kshudrajalebhyah
    patakebhyashca sarvada || 1|| jagaddhite jagannetri jaganmatarjaganmaye | jagadduritajalebhyo raksha
    mamahitam hara || 2|| vanmanah kayakaranairjanmantarashatarjitam | papam nashaya deveshi pahi mam
    kripaya'nisham || 3|| janmantarasahasreshu yatkritam dushkritam maya | tannivaraya mam pahi sharanye
    bhaktavatsale || 4|| maya kritanyasheshani madiyaishca kritani ca | papani nashayasvadya pahi mam
    paradevate || 5|| jnanajnanakritaih papaih sampraptam duritam kshanat | nivaraya jaganmatarakhilairanivaritam
    || 6|| asatkaryanivrittim ca satkayasya pravartanam | devatatmanusandhanam dehi me parameshvari ||
    7|| sarvavaranavidyanam sandhanenanucintanam | deshikanghrismritim caiva dehi me jagadishvari || 8||
    anusyutaraparabrahmanandamritanishevanam | atyantanishcalam cittam dehi me jagadishvari || 9|| anusyutaraparabrahmanandamritanishevanam
    | atyantanishcalam cittam dehi me parameshvari || 10|| sadashivadyairdhatryantaih devatabhirmunishvaraih
    | upasitam padam yattaddehi me parameshvari || 11|| indradibhirasheshaishca devairasurarakshasaih
    | kritam vighnam nivaryashu kripaya raksha raksha mam || 12|| atmanamatmanah snigdhamashritam paricarakam
    | dravyadam bandhuvargam ca deveshi pariraksha nah || 13|| upasakasya yo yo me yathashaktyanukulakrit
    | suhridam raksha tam nityam dvishantamanukulaya || 14|| daihikadaihikannanahetukatkevaladbhayat |
    pahi mam pranatapattibhanjane vishvalocane || 15|| nityanandamayam saukhyam nirmalam nirupadhikam
    | dehi me nishcalam bhaktim nikhilabhishtasiddhide || 16|| yanmaya sakalopayaih karaniyamitah param
    | tatsarvam bodhayasvamba sarvalokahite rate || 17|| pradehi buddhiyogam tam yena tvamupayamyaham
    | kamanam hridyasamroham dehi me kripayeshvari || 18|| bhavabdhau patitam bhitamanatham dinamanasam
    | uddhritya kripaya devi nidhehi caranambuje || 19|| iti shribalarakshastotram sampurnam |
  devanagari: श्रीबालारक्षास्तोत्रम् सर्वलोकैकजनके सर्वाभीष्टफलप्रदे । रक्ष मां क्षुद्रजालेभ्यः पातकेभ्यश्च
    सर्वदा ॥ १॥ जगद्धिते जगन्नेत्रि जगन्मातर्जगन्मये । जगद्दुरितजालेभ्यो रक्ष मामहितं हर ॥ २॥ वाङ्मनः
    कायकरणैर्जन्मान्तरशतार्जितम् । पापं नाशय देवेशि पाहि मां कृपयाऽनिशम् ॥ ३॥ जन्मान्तरसहस्रेषु यत्कृतं
    दुष्कृतं मया । तन्निवारय मां पाहि शरण्ये भक्तवत्सले ॥ ४॥ मया कृतान्यशेषाणि मदीयैश्च कृतानि च । पापानि
    नाशयस्वाद्य पाहि मां परदेवते ॥ ५॥ ज्ञानाज्ञानकृतैः पापैः साम्प्राप्तं दुरितं क्षणात् । निवारय जगन्मातरखिलैरनिवारितम्
    ॥ ६॥ असत्कार्यनिवृत्तिं च सत्कायस्य प्रवर्तनम् । देवतात्मानुसन्धानं देहि मे परमेश्वरि ॥ ७॥ सर्वावरणविद्यानां
    सन्धानेनानुचिन्तनम् । देशिकाङ्घ्रिस्मृतिं चैव देहि मे जगदीश्वरि ॥ ८॥ अनुस्यूतरपरब्रह्मानन्दामृतनिषेवणम्
    । अत्यन्तनिश्चलं चित्तं देहि मे जगदीश्वरि ॥ ९॥ अनुस्यूतरपरब्रह्मानन्दामृतनिषेवणम् । अत्यन्तनिश्चलं
    चित्तं देहि मे परमेश्वरि ॥ १०॥ सदाशिवाद्यैर्धात्र्यन्तैः देवताभिर्मुनीश्वरैः । उपासितं पदं यत्तद्देहि
    मे परमेश्वरि ॥ ११॥ इन्द्रादिभिरशेषैश्च देवैरसुरराक्षसैः । कृतं विघ्नं निवार्याशु कृपया रक्ष रक्ष माम्
    ॥ १२॥ आत्मानमात्मनः स्निग्धमाश्रितं परिचारकम् । द्रव्यदं बन्धुवर्गं च देवेशि परिरक्ष नः ॥ १३॥ उपासकस्य
    यो यो मे यथाशक्त्यनुकूलकृत् । सुहृदं रक्ष तं नित्यं द्विषन्तमनुकूलय ॥ १४॥ दैहिकादैहिकान्नानाहेतुकात्केवलद्भयात्
    । पाहि मां प्रणतापत्तिभञ्जने विश्वलोचने ॥ १५॥ नित्यानन्दमयं सौख्यं निर्मलं निरूपाधिकम् । देहि मे निश्चलां
    भक्तिं निखिलाभिष्टसिद्धिदे ॥ १६॥ यन्मया सकलोपायैः करणीयमितः परम् । तत्सर्वं बोधयस्वाम्ब सर्वलोकहिते
    रते ॥ १७॥ प्रदेहि बुद्धियोगं तं येन त्वामुपयाम्यहम् । कामानां हृद्यसंरोहं देहि मे कृपयेश्वरि ॥ १८॥
    भवाब्धौ पतितं भीतमनाथं दीनमानसम् । उद्धृत्य कृपया देवि निधेहि चरणाम्बुजे ॥ १९॥ इति श्रीबालारक्षास्तोत्रं
    सम्पूर्णम् ।
