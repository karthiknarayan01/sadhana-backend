id: devaihkritam11shivastotram
category: stotram
name:
  english: devaihkritam11shivastotram
  devanagari: देवैःकृतं११शिवस्तोत्रम्
content:
  english: devaih kritam 11 shivastotram deva ucuh | jaya shambho'khiladhara jaya nama maheshvara | jaya
    rudra mahadeva jaya vishvambhara prabho || 36|| jaya kalipate svaminjayanandapravardhaka | jaya tryambaka
    sarvesha jaya mayapate vibho || 37|| jaya nirguna nishkama karanatita sarvaga | jaya lilakhiladharadhritarupa
    namo'stu te || 38|| jaya svabhaktasatkamapradesha karunakara | jaya sanandasadrupa jaya mayagunakrite
    || 39|| jayogra mrida sarvatman dinabandho dayanidhe | jayavikara mayesha vanmano'titavigraha || 40||
    iti shivapurane rudrasamhitayam parvatikhande ekapancashattamadhyayantargatam devaih kritam shivastotram
    samaptam | shivapurana | rudrasamhita | parvatikhanda 3 | adhyaya 51
  devanagari: देवैः कृतं ११ शिवस्तोत्रम् देवा ऊचुः । जय शम्भोऽखिलाधार जय नाम महेश्वर । जय रुद्र महादेव
    जय विश्वम्भर प्रभो ॥ ३६॥ जय कालीपते स्वामिञ्जयानन्दप्रवर्धक । जय त्र्यम्बक सर्वेश जय मायापते विभो
    ॥ ३७॥ जय निर्गुण निष्काम कारणातीत सर्वग । जय लीलाखिलाधारधृतरूप नमोऽस्तु ते ॥ ३८॥ जय स्वभक्तसत्कामप्रदेश
    करुणाकर । जय सानन्दसद्रूप जय मायागुणाकृते ॥ ३९॥ जयोग्र मृड सर्वात्मन् दीनबन्धो दयानिधे । जयाविकार
    मायेश वाङ्मनोऽतीतविग्रह ॥ ४०॥ इति शिवपुराणे रुद्रसंहितायां पार्वतीखण्डे एकपञ्चाशत्तमाध्यायान्तर्गतं
    देवैः कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । रुद्रसंहिता । पार्वतीखण्ड ३ । अध्याय ५१
