id: dhenustotram
category: stotram
name:
  english: dhenustotram
  devanagari: धेनुस्तोत्रम्
content:
  english: matarnamami caranamstava pavanamshca samsaranavaitiya hridabhavabhaktya | param nayashu tavaputramimam
    suritya samsarasindhutaranam hi tavashreyana || 1|| devashca devya itiya nivasanti dhenau gopujanena
    nikhilashca bhavanti triptah | ayughritam paya idam bhavatiha virya matah stutasi bahudha shrutibhistvamittham
    || 2|| ojo dhritih sumatirevamativashantirjnanam ca bhaktirapi nityamadainyamevam | matastvadiya payaso
    ghritatastatastad vanchannti nityamamarah kimutyanyamartyah|| 3|| agniryathenghanamidam stutapancagavyam
    papam tatha dahati satyamitiha matva | matah pibanti khalu vedaratashca viprah pushnasi pasi sakalanparishuddhadeha
    || 4|| yam varnayanti nikhilah shrutayah sadaiva brahmeti krishnabhagavan sa hi devadevah | sevam
    taveha kritavan kimu madrushashca kim varnayami tava bhagyamito mahatmyam || 5||
  devanagari: मातर्नमामि चरणांस्तव पावनांश्च संसारनावैतिय हृदभावभक्त्या । पारं नायशु तवपुत्रमिमं सुरीत्या
    संसारसिन्धुतरणं हि तवाश्रेयण ॥ १॥ देवाश्च देव्य इतिय निवसन्ति धेनौ गोपूजनेन निखिलाश्च भवन्ति तृप्ताः
    । आयुघृतं पय इदं भवतीह वीर्य मातः स्तुतासी बहुधा श्रुतिभिस्त्वमित्थम् ॥ २॥ ओजो धृतिः सुमतिरेवमतीवशान्तिर्ज्ञानं
    च भक्तिरपि नित्यमदैन्यमेवम् । मातस्त्वदीय पयसो घृततस्ततस्तद् वाञ्छन्न्ति नित्यममराः कीमुत्यान्यमर्त्याः॥
    ३॥ अग्निर्यथेङ्घनमिदं स्तुतपञ्चगव्यं पापं तथा दहति सत्यमितीह मत्वा । मातः पिबन्ति खलु वेदरताश्च विप्राः
    पुष्णासि पासि सकलान्परिशुद्धदेहा ॥ ४॥ यं वर्णयन्ति निखिलाः श्रुतयः सदैव ब्रह्मेति कृष्णभगवान् स हि
    देवदेवः । सेवां तवेह कृतवान् किमु माद्रुशाश्च किं वर्णयामि तव भाग्यमितो महात्म्यम् ॥ ५॥
