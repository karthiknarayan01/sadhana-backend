id: mahasarasvatistavam
category: stotram
name:
  english: mahasarasvatistavam
  devanagari: महासरस्वतीस्तवम्
content:
  english: kriyante brahmavadibhih | anirdeshyam tatha canyadardhamatranvitam param || 10|| avikaryakshayam
    divyam parinamavivarjitam | tavaitatparamam rupam yanna shakyam mayoditum || 11|| na casye na ca tajjihva
    tamroshthadibhirucyate | indro'pi vasavo brahma candrarkau jyotireva ca || 12|| vishvavasam vishvarupam
    vishvesham parameshvaram | sankhyavedantavadoktam bahushakhasthirikritam || 13|| anadimadhyanidhanam
    sadasanna sadeva yat | ekantvanekam napyekam bhavabhedasamashraitam || 14|| anakhyam shadgunakhyanca
    vargakhyam trigunashrayam | nanashaktimatamekam shaktivaibhavikam param || 15|| sukhasukham mahasaukhyarupam
    tvayi vibhavyate | evam devi
  devanagari: क्रियन्ते ब्रह्मवादिभिः । अनिर्देश्यं तथा चान्यदर्धमात्रान्वितं परम् ॥ १०॥ अविकार्यक्षयं
    दिव्यं परिणामविवर्जितम् । तवैतत्परमं रूपं यन्न शक्यं मयोदितुम् ॥ ११॥ न चास्ये न च तज्जिह्वा ताम्रोष्ठादिभिरुच्यते
    । इन्द्रोऽपि वसवो ब्रह्मा चन्द्रार्कौ ज्योतिरेव च ॥ १२॥ विश्वावासं विश्वरूपं विश्वेशं परमेश्वरम् ।
    साङ्ख्यवेदान्तवादोक्तं बहुशाखास्थिरीकृतम् ॥ १३॥ अनादिमध्यनिधनं सदसन्न सदेव यत् । एकन्त्वनेकं नाप्येकं
    भवभेदसमाश्रैतम् ॥ १४॥ अनाख्यं षड्गुणाख्यञ्च वर्गाख्यं त्रिगुणाश्रयम् । नानाशक्तिमतामेकं शक्तिवैभविकं
    परम् ॥ १५॥ सुखासुखं महासौख्यरूपं त्वयि विभाव्यते । एवं देवि
