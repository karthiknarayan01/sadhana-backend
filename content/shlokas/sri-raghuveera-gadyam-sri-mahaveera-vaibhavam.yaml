id: sri-raghuveera-gadyam-sri-mahaveera-vaibhavam
category: stotram
name:
  english: Sri Raghuveera Gadyam (Sri Mahaveera Vaibhavam)
content:
  english: shrimanvenkatanatharya kavitarkika kesari | vedantacaryavaryome sannidhattam sadahridi || jayatyashrita
    santrasa dhvanta vidhvamsanodayah | prabhavan sitaya devya paramavyoma bhaskarah || jaya jaya mahavira
    mahadhira dhaureya devasura samara samaya samudita nikhila nirjara nirdharita niravadhika mahatmya
    dashavadana damita daivata parishadabhyarthita dasharathi bhava dinakara kula kamala divakara divishadadhipati
    rana sahacarana catura dasharatha carama rinavimòcana kosala suta kumara bhava kancukita karanakara
    kaumara keli gopayita kaushikadhvara ranadhvara dhurya bhavya divyastra brinda vandita pranata jana
    vimata vimathana durlalita dorlalita tanutara vishikha vitadana vighatita vishararu shararu tataka
    tatakeya jadakirana shakaladhara jatila natapati makuta tata natanapatu vibudhasaridatibahula madhugalana
    lalitapada nalinaraja upamridita nijavrijina jahadupala tanurucira parama munivara yuvati nuta kushika
    suta kathita vidita nava vividha katha maithila nagara sulocana locana cakora candra khandaparashu
    kodanda prakanda khandana shaunda bhujadanda candakara kirana mandala bodhita pundarika vana ruci
    luntaka locana mocita janaka hridaya shankatanka parihrita nikhila narapati varana janaka duhitri
    kucatata viharana samucita karatala shatakoti shataguna kathina parashudhara munivara karadhrita duravanamatama
    nija dhanurakarshana prakashita parameshthya kratuhara shikhari kantuka vihrityunmukha jagadaruntuda
    jitahari danti danta dantura dashavadana damana kushala dashashatabhuja mukha nripatikula rudhira
    jhara bharita prithutara tataka tarpita pitrika bhrigupati sugati vihatikara nata parudishu parigha
    anrita bhaya mushita hridaya pitri vacana palana pratijnavajnata yauvarajya nishada raja sauhrida
    sucita saushilya sagara bharadvaja shasana parigrihita vicitra citrakuta giri kataka tata ramyavasatha
    pranata bharata makutatata sughatita padukagryabhisheka nirvartita sarvaloka yoga kshema pishita ruci
    vihita durita valamathana tanaya balibhuganugati sarabhasa shayana trina shakala paripatana bhaya
    cakita sakala sura munivara bahumata mahastra samarthya druhina hara valamathana duralaksha sharalaksha
    dandaka tapovana jangama parijata vilulita bahuphala makha kalama rajanicara mriga mrigayarambha sambhrita
    cirabhridanurodha trishirah shirastritaya timira nirasa vasarakara dushana jalanidhi shoshana toshita
    rishigana ghoshita vijaya ghoshana kharatara khara taru khandana canda pavana dvisapta rakshah sahasra
    nalavana vilolana mahakalabha mahita mahamritha darshana mudita maithili dridhatara parirambhana vibhava
    viropita vikata viravrana marica maya mriga carma parikarmita nirbhara darbhastarana vikrama yasho
    labha vikrita jivita gridhraraja deha didhaksha lakshita bhaktajana dakshinya kalpita vibudhabhava
    kabandhabhinandita avandhya mahima munijana bhajana mushita hridaya kalusha shabari moksha sakshibhuta
    prabhanjanatanaya bhavuka bhashita ranjita hridaya taranisuta sharanagati paratantrikrita svatantrya
    dridhaghatita kailasa koti vikata dundubhi kankala kuta dura vikshepa daksha dakshinetara padangushtha
    daracalana vishvasta suhridashaya atiprithula bahu vitapi giri dharani vivara yugapadudaya vivrita
    citrapunkha vaicitrya vipula bhuja shailamula nibida nipidita ravana ranaranaka janaka caturudadhi
    viharana catura kapikulapati hridaya vishala shilatala darana daruna shilimukha apara paravara parikha
    parivrita parapura parisrita dava dahana javana pavanabhava kapivara parishvanga bhavita sarvasva
    dana ahita sahodara rakshah parigraha visamvadi vividha saciva vipralambha samaya samrambha samujjrimbhita
    sarveshvara bhava sakritprapanna jana samrakshana dikshita vira pratishayana bhumika bhushita payodhi
    pulina pralaya shikhi parusha vishikha shikha shoshitakupara varipura prabala ripu kalaha kutuka catula
    kapikula karatala tulita hrita giri nikara sadhita setupatha sima simantita samudra drutagati tarumriga
    varuthini niruddha lankavarodha vepathu lasya lilopadesha deshika dhanurjyaghosha gagana cara kanaka
    giri garima dhara nigamamaya nija garuda garudanila lava galita visha vadana shara kadana akritacara
    vanacara ranakarana vailakshya kunitaksha bahuvidha raksho baladhyaksha vakshah kavata patana patima
    satopa kopavalepa katuratadatani tankriti catula kathora karmukha vinirgata vishankata vishikha vitadana
    vighatita makuta vihvala vishravastanaya vishrama samaya vishranana vikhyata vikrama kumbhakarna kulagiri
    vidalana dambholi bhuta nishshanka kankapatra abhicarana hutavaha paricarana vighatana sarabhasa paripatadaparimita
    kapibala jaladhi lahari kalakalarava kupita maghavaji dabhihananakridanuja sakshika rakshasa dvandvayuddha
    apratidvandva paurusha tryambaka samadhika ghorastradambara sarathi hrita ratha satrapa shatrava satyapita
    pratapa shita shara krita lavana dashamukha mukha dashaka nipatana punarudaya dara galita janita dara
    tarala harihaya nayana nalinavana ruci khacita khatala nipatita surataru kusuma vitati surabhita ratha
    patha akhila jagadadhika bhuja bala dasha lapana dashaka lavana janita kadana paravasha rajanicara
    yuvati vilapana vacana samavishaya nigama shikhara nikara mukhara mukha muni vara paripanita abhigata
    shatamakha hutavaha pitripati nirriti varuna pavana dhanada girisha mukha surapati nuta mudita amita
    mati vidhi vidita kathita nija vibhava jaladhi prishata lava vigata bhaya vibudha paribridha vibodhita
    virashayana shayita vanara pritanaugha sva samaya vighatita sughatita sahridaya sahadharmacarinika
    vibhishana vashamvadikrita lankaishvarya pushpaka rabhasa gati goshpadikrita gaganarnava pratijnarnava
    tarana krita kshana bharata manoratha samhita simhasanadhirudha hataka giri kataka sadrisha pada pitha
    nikata tata pariluthita nikhila nripati kirita koti vividha mani gana kirana nikara nirajita carana
    rajiva divya bhaumayodhyadhidaivata pitri vadha kupita parashu dhara muni vihita nripa hanana kadana
    purva kala prabhava shata guna pratishthapita dharmika raja vamsha shubha carita rata bharata kharvita
    garva gandharva yutha gita vijaya gatha shata shasita madhusuta shatrughna sevita kusha lava parigrihita
    kula gatha vishesha vidhivasha parinamadamara bhaniti kavivara racita nija carita nibandhana nishamana
    nirvrita punarupasthapita vimana vara vishranana prinita vaishravana vishravita yashah prapanca pancatapanna
    munikumara sanjivanamrita tretayuga pravartita kartayuga vrittanta avikala bahusuvarna hayamakha sahasra
    nirvahana nirvartita nija varnashrama dharma saketa janapada jani dhanika jangama taditara jantu jata
    divya gati dana darshita nitya nissima vaibhava bhava tapana tapita bhaktajana bhadrarama namaste
    punaste namah || caturmukheshvaramukhaih putrapautradishaline | namah sitasametaya ramaya grihamedhine
    || kavikathakasimhakathitam kathorasukumaragumbhagambhiram | bhavabhayabheshajametat pathata mahaviravaibhavam
    sudhiyah || iti shrimahaviravaibhavam ||
  devanagari: श्रीमान्वेङ्कटनाथार्य कवितार्किक केसरि । वेदान्ताचार्यवर्योमे सन्निधत्तां सदाहृदि ॥ जयत्याश्रित
    सन्त्रास ध्वान्त विध्वंसनोदयः । प्रभावान् सीतया देव्या परमव्योम भास्करः ॥ जय जय महावीर महाधीर धौरेय
    देवासुर समर समय समुदित निखिल निर्जर निर्धारित निरवधिक माहात्म्य दशवदन दमित दैवत परिषदभ्यर्थित दाशरथि
    भाव दिनकर कुल कमल दिवाकर दिविषदधिपति रण सहचरण चतुर दशरथ चरम ऋणविमॊचन कोसल सुता कुमार भाव कञ्चुकित
    कारणाकार कौमार केलि गोपायित कौशिकाध्वर रणाध्वर धुर्य भव्य दिव्यास्त्र बृन्द वन्दित प्रणत जन विमत विमथन
    दुर्ललित दोर्ललित तनुतर विशिख विताडन विघटित विशरारु शरारु ताटका ताटकेय जडकिरण शकलधर जटिल नटपति मकुट
    तट नटनपटु विबुधसरिदतिबहुल मधुगलन ललितपद नलिनरज उपमृदित निजवृजिन जहदुपल तनुरुचिर परम मुनिवर युवति नुत
    कुशिक सुत कथित विदित नव विविध कथ मैथिल नगर सुलोचना लोचन चकोर चन्द्र खण्डपरशु कोदण्ड प्रकाण्ड खण्डन
    शौण्ड भुजदण्ड चण्डकर किरण मण्डल बोधित पुण्डरीक वन रुचि लुण्टाक लोचन मोचित जनक हृदय शङ्कातङ्क परिहृत
    निखिल नरपति वरण जनक दुहितृ कुचतट विहरण समुचित करतल शतकोटि शतगुण कठिन परशुधर मुनिवर करधृत दुरवनमतम
    निज धनुराकर्षण प्रकाशित पारमेष्ठ्य क्रतुहर शिखरि कन्तुक विहृत्युन्मुख जगदरुन्तुद जितहरि दन्ति दन्त
    दन्तुर दशवदन दमन कुशल दशशतभुज मुख नृपतिकुल रुधिर झर भरित पृथुतर तटाक तर्पित पितृक भृगुपति सुगति विहतिकर
    नत परुडिषु परिघ अनृत भय मुषित हृदय पितृ वचन पालन प्रतिज्ञावज्ञात यौवराज्य निषाद राज सौहृद सूचित सौशील्य
    सागर भरद्वाज शासन परिगृहीत विचित्र चित्रकूट गिरि कटक तट रम्यावसथ प्रणत भरत मकुटतट सुघटित पादुकाग्र्याभिषेक
    निर्वर्तित सर्वलोक योग क्षेम पिशित रुचि विहित दुरित वलमथन तनय बलिभुगनुगति सरभस शयन तृण शकल परिपतन
    भय चकित सकल सुर मुनिवर बहुमत महास्त्र सामर्थ्य द्रुहिण हर वलमथन दुरालक्ष शरलक्ष दण्डका तपोवन जङ्गम
    पारिजात विलुलित बहुफल मख कलम रजनिचर मृग मृगयारम्भ सम्भृत चीरभृदनुरोध त्रिशिरः शिरस्त्रितय तिमिर निरास
    वासरकर दूषण जलनिधि शोषण तोषित ऋषिगण घोषित विजय घोषण खरतर खर तरु खण्डन चण्ड पवन द्विसप्त रक्षः सहस्र
    नलवन विलोलन महाकलभ महित महामृथ दर्शन मुदित मैथिली दृढतर परिरम्भण विभव विरोपित विकट वीरव्रण मारीच माया
    मृग चर्म परिकर्मित निर्भर दर्भास्तरण विक्रम यशो लाभ विक्रीत जीवित गृध्रराज देह दिधक्षा लक्षित भक्तजन
    दाक्षिण्य कल्पित विबुधभाव कबन्धाभिनन्दित अवन्ध्य महिम मुनिजन भजन मुषित हृदय कलुष शबरी मोक्ष साक्षिभूत
    प्रभञ्जनतनय भावुक भाषित रञ्जित हृदय तरणिसुत शरणागति परतन्त्रीकृत स्वातन्त्र्य दृढघटित कैलास कोटि विकट
    दुन्दुभि कङ्काल कूट दूर विक्षेप दक्ष दक्षिणेतर पादाङ्गुष्ठ दरचलन विश्वस्त सुहृदाशय अतिपृथुल बहु विटपि
    गिरि धरणि विवर युगपदुदय विवृत चित्रपुङ्ख वैचित्र्य विपुल भुज शैलमूल निबिड निपीडित रावण रणरणक जनक चतुरुदधि
    विहरण चतुर कपिकुलपति हृदय विशाल शिलातल दारण दारुण शिलीमुख अपार पारावार परिखा परिवृत परपुर परिसृत दव
    दहन जवन पवनभव कपिवर परिष्वङ्ग भावित सर्वस्व दान अहित सहोदर रक्षः परिग्रह विसंवादि विविध सचिव विप्रलम्भ
    समय संरम्भ समुज्जृम्भित सर्वेश्वर भाव सकृत्प्रपन्न जन संरक्षण दीक्षित वीर प्रतिशयन भूमिका भूषित पयोधि
    पुलिन प्रलय शिखि परुष विशिख शिखा शोषिताकूपार वारिपूर प्रबल रिपु कलह कुतुक चटुल कपिकुल करतल तूलित हृत
    गिरि निकर साधित सेतुपथ सीमा सीमन्तित समुद्र द्रुतगति तरुमृग वरूथिनी निरुद्ध लङ्कावरोध वेपथु लास्य
    लीलोपदेश देशिक धनुर्ज्याघोष गगन चर कनक गिरि गरिम धर निगममय निज गरुड गरुदनिल लव गलित विष वदन शर कदन
    अकृतचर वनचर रणकरण वैलक्ष्य कूणिताक्ष बहुविध रक्षो बलाध्यक्ष वक्षः कवाट पाटन पटिम साटोप कोपावलेप कटुरटदटनि
    टङ्कृति चटुल कठोर कार्मुख विनिर्गत विशङ्कट विशिख विताडन विघटित मकुट विह्वल विश्रवस्तनय विश्रम समय
    विश्राणन विख्यात विक्रम कुम्भकर्ण कुलगिरि विदलन दम्भोलि भूत निश्शङ्क कङ्कपत्र अभिचरण हुतवह परिचरण
    विघटन सरभस परिपतदपरिमित कपिबल जलधि लहरि कलकलरव कुपित मघवजि दभिहननकृदनुज साक्षिक राक्षस द्वन्द्वयुद्ध
    अप्रतिद्वन्द्व पौरुष त्र्यम्बक समधिक घोरास्त्राडम्बर सारथि हृत रथ सत्रप शात्रव सत्यापित प्रताप शित
    शर कृत लवण दशमुख मुख दशक निपतन पुनरुदय दर गलित जनित दर तरल हरिहय नयन नलिनवन रुचि खचित खतल निपतित सुरतरु
    कुसुम वितति सुरभित रथ पथ अखिल जगदधिक भुज बल दश लपन दशक लवन जनित कदन परवश रजनिचर युवति विलपन वचन समविषय
    निगम शिखर निकर मुखर मुख मुनि वर परिपणित अभिगत शतमख हुतवह पितृपति निरृति वरुण पवन धनद गिरिश मुख सुरपति
    नुत मुदित अमित मति विधि विदित कथित निज विभव जलधि पृषत लव विगत भय विबुध परिबृढ विबोधित वीरशयन शायित
    वानर पृतनौघ स्व समय विघटित सुघटित सहृदय सहधर्मचारिणीक विभीषण वशंवदीकृत लङ्कैश्वर्य पुष्पक रभस गति
    गोष्पदीकृत गगनार्णव प्रतिज्ञार्णव तरण कृत क्षण भरत मनोरथ संहित सिंहासनाधिरूढ हाटक गिरि कटक सदृश पाद
    पीठ निकट तट परिलुठित निखिल नृपति किरीट कोटि विविध मणि गण किरण निकर नीराजित चरण राजीव दिव्य भौमायोध्याधिदैवत
    पितृ वध कुपित परशु धर मुनि विहित नृप हनन कदन पूर्व काल प्रभव शत गुण प्रतिष्ठापित धार्मिक राज वंश शुभ
    चरित रत भरत खर्वित गर्व गन्धर्व यूथ गीत विजय गाथा शत शासित मधुसुत शत्रुघ्न सेवित कुश लव परिगृहीत कुल
    गाथा विशेष विधिवश परिणमदमर भणिति कविवर रचित निज चरित निबन्धन निशमन निर्वृत पुनरुपस्थापित विमान वर
    विश्राणन प्रीणित वैश्रवण विश्रावित यशः प्रपञ्च पञ्चतापन्न मुनिकुमार सञ्जीवनामृत त्रेतायुग प्रवर्तित
    कार्तयुग वृत्तान्त अविकल बहुसुवर्ण हयमख सहस्र निर्वहण निर्वर्तित निज वर्णाश्रम धर्म साकेत जनपद जनि
    धनिक जङ्गम तदितर जन्तु जात दिव्य गति दान दर्शित नित्य निस्सीम वैभव भव तपन तापित भक्तजन भद्राराम नमस्ते
    पुनस्ते नमः ॥ चतुर्मुखेश्वरमुखैः पुत्रपौत्रादिशालिने । नमः सीतासमेताय रामाय गृहमेधिने ॥ कविकथकसिंहकथितं
    कठोरसुकुमारगुम्भगम्भीरम् । भवभयभेषजमेतत् पठत महावीरवैभवं सुधियः ॥ इति श्रीमहावीरवैभवम् ॥
