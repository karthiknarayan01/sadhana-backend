id: narayaniyam-dashaka-67
category: stotram
name:
  english: Narayaniyam Dashaka 67
content:
  english: sphuratparanandarasatmakena tvaya samasaditabhogalilah | asimamanandabharam prapanna mahantamapurmadamambujakshyah
    || || niliyate'sau mayi mayyamayam ramapatirvishvamanobhiramah | iti sma sarvah kalitabhimana nirikshya
    govind tirohito'bhuh || || radhabhidham tavadajatagarvamatipriyam gopavadhum murare | bhavanupadaya
    gato viduram taya saha svairaviharakari || || tirohite'tha tvayi jatatapah samam sametah kamalayatakshyah
    | vane vane tvam parimargayantyo vishadamapurbhagavannaparam || || ha cuta ha campaka karnikara ha
    mallike malati balavalyah | kim vikshito no hridayaikacorah ityadi tastvatpravana vilepuh || || nirikshito'yam
    sakhi pankajakshah puro mametyakulamalapanti | tvam bhavanacakshushi vikshya kacittapam sakhinam dvigunicakara
    || || tvadatmikasta yamunatatante tavanucakruh kila ceshtitani | vicitya bhuyo'pi tathaiva manattvaya
    vimuktam dadrishushca radham || || tatah samam ta vipine samantattamovataravadhi margayantyah | punarvimishra
    yamunatatante bhrisham vilepushca jagurgunamste || || tatha vyathasankulamanasanam vrajangananam karunaikasindho
    | jagattrayimohanamohanatma tvam pradurasirayi mandahasi || || sandigdhasandarshanamatmakantam tvam
    vikshya tanvyah sahasa tadanim | kim kim na cakruh pramadatibharat sa tvam gadat palaya marutesha
    ||
  devanagari: स्फुरत्परानन्दरसात्मकेन त्वया समासादितभोगलीलाः । असीममानन्दभरं प्रपन्ना महान्तमापुर्मदमम्बुजाक्ष्यः
    ॥ ॥ निलीयतेऽसौ मयि मय्यमायं रमापतिर्विश्वमनोभिरामः । इति स्म सर्वाः कलिताभिमाना निरीक्ष्य गोविन्द्
    तिरोहितोऽभूः ॥ ॥ राधाभिधां तावदजातगर्वामतिप्रियां गोपवधूं मुरारे । भवानुपादाय गतो विदूरं तया सह स्वैरविहारकारी
    ॥ ॥ तिरोहितेऽथ त्वयि जाततापाः समं समेताः कमलायताक्ष्यः । वने वने त्वां परिमार्गयन्त्यो विषादमापुर्भगवन्नपारम्
    ॥ ॥ हा चूत हा चम्पक कर्णिकार हा मल्लिके मालति बालवल्यः । किं वीक्षितो नो हृदयैकचोरः इत्यादि तास्त्वत्प्रवणा
    विलेपुः ॥ ॥ निरीक्षितोऽयं सखि पङ्कजाक्षः पुरो ममेत्याकुलमालपन्ती । त्वां भावनाचक्षुषि वीक्ष्य काचित्तापं
    सखीनां द्विगुणीचकार ॥ ॥ त्वदात्मिकास्ता यमुनातटान्ते तवानुचक्रुः किल चेष्टितानि । विचित्य भूयोऽपि
    तथैव मानात्त्वया विमुक्तां ददृशुश्च राधाम् ॥ ॥ ततः समं ता विपिने समन्तात्तमोवतारावधि मार्गयन्त्यः
    । पुनर्विमिश्रा यमुनातटान्ते भृशं विलेपुश्च जगुर्गुणांस्ते ॥ ॥ तथा व्यथासङ्कुलमानसानां व्रजाङ्गनानां
    करुणैकसिन्धो । जगत्त्रयीमोहनमोहनात्मा त्वं प्रादुरासीरयि मन्दहासी ॥ ॥ सन्दिग्धसन्दर्शनमात्मकान्तं
    त्वां वीक्ष्य तन्व्यः सहसा तदानीम् । किं किं न चक्रुः प्रमदातिभारात् स त्वं गदात् पालय मारुतेश ॥
