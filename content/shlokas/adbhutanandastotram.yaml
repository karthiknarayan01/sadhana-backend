id: adbhutanandastotram
category: stotram
name:
  english: adbhutanandastotram
  devanagari: अद्भुतानन्दस्तोत्रम्
content:
  english: shriadbhutanandastotram niraksharam mahaprajnam bhaktashreshtham gunottamam | ramakrishnaprabhorevam
    ramadattasya sevakam || 1|| antarbahishca pashyantam bhagavantam sadamuda | vikshya shriramakrishno
    yam diksham pradat svalilaya || 2|| sevaya ramakrishnasya sharadakarunabalat | dharmatattvam nirikshantam
    hastamalakavacchivam || 3|| tattvanyupanishadgani svanubhutya vikasayan | nirvrittim yah param lebhe
    tannamamah sadadbhutam || 4|| ramakrishnasya mahatim srishtimadbhutamadbhutam | manyate yam mahabhaktam
    vivekanandarupadhrik || 5|| evam bhaktottamam shreshtham lilamanasa vigraham | adbhutantvadadbhutanandam
    bhuyo bhuyo namamyaham || 6|| jagatyamavatirnasya sadhakasya priyasya ca | tasya shri padapadme nah
    pranamah santu nityashah || 7|| adbhutam caritam nityam smareyurbhayavihvalah | tesham sarvam bhayam
    yayad bhavodbhavabhayena ca || 8|| iti adhyapakapanditashrikumudaranjanagosvamitarkavedantatirthaviracitam
  devanagari: श्रीअद्भुतानन्दस्तोत्रम् निरक्षरं महाप्राज्ञं भक्तश्रेष्ठं गुणोत्तमम् । रामकृष्णप्रभोरेवं
    रामदत्तस्य सेवकम् ॥ १॥ अन्तर्बहिश्च पश्यन्तं भगवन्तं सदामुदा । वीक्ष्य श्रीरामकृष्णो यं दीक्षां प्रदात्
    स्वलीलया ॥ २॥ सेवया रामकृष्णस्य शारदाकरुणाबलात् । धर्मतत्त्वं निरीक्षन्तं हस्तामलकवच्छिवम् ॥ ३॥ तत्त्वान्युपनिषद्गानि
    स्वानुभूत्या विकासयन् । निर्वृत्तिं यः परां लेभे तन्नमामः सदाद्भुतम् ॥ ४॥ रामकृष्णस्य महतीं सृष्टिमद्भुतमद्भुताम्
    । मन्यते यं महाभक्तं विवेकानन्दरूपधृक् ॥ ५॥ एवं भक्तोत्तमं श्रेष्ठं लीलामानस विग्रहम् । अद्भुतन्त्वदद्भुतानन्दं
    भूयो भूयो नमाम्यहम् ॥ ६॥ जगत्यामवतीर्णस्य साधकस्य प्रियस्य च । तस्य श्री पादपद्मे नः प्रणामाः सन्तु
    नित्यशः ॥ ७॥ अद्भुतं चरितं नित्यं स्मरेयुर्भयविह्वलाः । तेषां सर्वं भयं यायाद् भवोद्भवभयेन च ॥ ८॥
    इति अध्यापकपण्डितश्रीकुमुदरञ्जनगोस्वामीतर्कवेदान्ततीर्थविरचितं
meaning: {}
