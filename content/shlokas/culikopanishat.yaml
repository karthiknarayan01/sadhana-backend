id: culikopanishat
category: upanishad
name:
  english: culikopanishat
  devanagari: चूलिकोपनिषत्
content:
  english: iti shrutyantarat || 15|| iti tritiyah khandah || 3|| brahmadyam sthavarantam ca pashyanto
    jnanacakshushah | tamekameva pashyanti parishuddham vibhum dvijah || 16|| dvijastraivarnika vedavidah
    || 16|| yasminsarvamidam protam brahma sthavarajangamam | tasminneva layam yanti budbudah sagare yatha
    || 17|| yasminbhavah praliyante linasya vyaktatam yayuh | nashyante vyaktatam bhuyo jayante budbuda
    iva | kshetrajnadhishthitam caiva karanairvyanjayedbudhah || 18|| brahmeti | brahmakaryam sthavaradi
    yasminprotam tamekam brahmaiva pashyantityanvayah | layam yanti sarve bhavah | linasya linamasyam
    mukham dvaramavidyalakshanam yesham te tathoktah santo vyaktatam yayurgatah | punarnashyante nashyanti
    | bhuyashca vyaktatam jayante janayanti | antarbhavitanyarthatvatsakarmakah | gacchanti va | dvih
    kathanam srishtipralayayorabhyasajnapanartham | kshetrajnenadhishthitam shariram | karanairanumitakaranairhetubhirvimatam
    cetanadhishthitam kriyavattvadrathavadityadibhih | vyanjayellakshayet | budhah panditah || 17|| 18
    || iti caturthah khandah || 4|| evam sahasrasho devam paryasyantam punah punah || 19|| ya evam shravayecchraddhe
    brahmano niyatavratah | akshayyamannapanam ca pitrinam copatishthate || 20|| evam sahasrashah punah
    punah paryasyantam devam janmamaranadiprabandhamapadyamanam jivam | ishvararadhanenoddharediti sheshah
    | vairagyarthamidamabhihitam | tasyannam panam cakshayyam bhavati | pitrinam cakshayyamevopatishthate
    || 19|| 20 || brahma brahmavidhanam tu ye vidurbrahmanadayah | te layam yanti tatraiva linasya brahmashayine
    linasya brahmashayina iti || 21|| ityatharvavede culikopanishatsamapta || 13|| brahma kutastham |
    brahmavidhanam tajjnanopayam | linasya linamasyam mukham pravrittidvaram ragadi yesham te tathoktah
    | kimartham linasyah | brahmashayine brahmani shete tacchilo brahmashayi bhavapradhano nirdeshah |
    brahmashayitvaya brahmani shayanam kartumekibhavitumityarthah | dviruktih samaptyartha || 21|| iti
    pancamah khandah || 5|| narayanena racita shrutimatropajivana | aspashtapadavakyanam dipika culikabhidhe
    || 1|| iti narayanaviracita culikopanishaddipika samapta || 18|| om purnamadah purnamidam purnatpurnamudacyate
    | purnasya purnamadaya purnamevavashishyate || om shantih shantih shantih ||
  devanagari: इति श्रुत्यन्तरात् ॥ १५॥ इति तृतीयः खण्डः ॥ ३॥ ब्रह्माद्यं स्थावरान्तं च पश्यन्तो ज्ञानचक्षुषः
    । तमेकमेव पश्यन्ति परिशुद्धं विभुं द्विजाः ॥ १६॥ द्विजास्त्रैवर्णिका वेदविदः ॥ १६॥ यस्मिन्सर्वमिदं
    प्रोतं ब्रह्म स्थावरजङ्गमम् । तस्मिन्नेव लयं यान्ति बुद्बुदाः सागरे यथा ॥ १७॥ यस्मिन्भावाः प्रलीयन्ते
    लीनास्या व्यक्ततां ययुः । नश्यन्ते व्यक्ततां भूयो जायन्ते बुद्बुदा इव । क्षेत्रज्ञाधिष्ठितं चैव कारणैर्व्यञ्जयेद्बुधः
    ॥ १८॥ ब्रह्मेति । ब्रह्मकार्यं स्थावरादि यस्मिन्प्रोतं तमेकं ब्रह्मैव पश्यन्तीत्यन्वयः । लयं यान्ति
    सर्वे भावाः । लीनास्या लीनमास्यं मुखं द्वारमविद्यालक्षणं येषां ते तथोक्ताः सन्तो व्यक्ततां ययुर्गताः
    । पुनर्नश्यन्ते नश्यन्ति । भूयश्च व्यक्ततां जायन्ते जनयन्ति । अन्तर्भावितण्यर्थत्वात्सकर्मकः । गच्छन्ति
    वा । द्विः कथनं सृष्टिप्रलययोरभ्यासज्ञापनार्थम् । क्षेत्रज्ञेनाधिष्ठितं शरीरम् । कारणैरनुमितकारणैर्हेतुभिर्विमतं
    चेतनाधिष्ठितं क्रियावत्त्वाद्रथवदित्यादिभिः । व्यञ्जयेल्लक्षयेत् । बुधः पण्डितः ॥ १७॥ १८ ॥ इति चतुर्थः
    खण्डः ॥ ४॥ एवं सहस्रशो देवं पर्यस्यन्तं पुनः पुनः ॥ १९॥ य एवं श्रावयेच्छ्राद्धे ब्राह्मणो नियतव्रतः
    । अक्षय्यमन्नपानं च पितॄणां चोपतिष्ठते ॥ २०॥ एवं सहस्रशः पुनः पुनः पर्यस्यन्तं देवं जन्ममरणादिप्रबन्धमापद्यमानं
    जीवम् । ईश्वराराधनेनोद्धरेदिति शेषः । वैराग्यार्थमिदमभिहितम् । तस्यान्नं पानं चाक्षय्यं भवति । पितॄणां
    चाक्षय्यमेवोपतिष्ठते ॥ १९॥ २० ॥ ब्रह्म ब्रह्मविधानं तु ये विदुर्ब्राह्मणादयः । ते लयं यान्ति तत्रैव
    लीनास्या ब्रह्मशायिने लीनास्या ब्रह्मशायिन इति ॥ २१॥ इत्यथर्ववेदे चूलिकोपनिषत्समाप्ता ॥ १३॥ ब्रह्म
    कूटस्थम् । ब्रह्मविधानं तज्ज्ञानोपायम् । लीनास्या लीनमास्यं मुखं प्रवृत्तिद्वारं रागादि येषां ते तथोक्ताः
    । किमर्थं लीनास्याः । ब्रह्मशायिने ब्रह्मणि शेते तच्छीलो ब्रह्मशायी भावप्रधानो निर्देशः । ब्रह्मशायित्वाय
    ब्रह्मणि शयनं कर्तुमेकीभवितुमित्यर्थः । द्विरुक्तिः समाप्त्यर्था ॥ २१॥ इति पञ्चमः खण्डः ॥ ५॥ नारायणेन
    रचिता श्रुतिमात्रोपजीवना । अस्पष्टपदवाक्यानां दीपिका चूलिकाभिधे ॥ १॥ इति नारायणविरचिता चूलिकोपनिषद्दीपिका
    समाप्ता ॥ १८॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥
    ॐ शान्तिः शान्तिः शान्तिः ॥
