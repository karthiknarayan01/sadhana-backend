id: mudgala
category: upanishad
name:
  english: mudgala
  devanagari: मुद्गल
content:
  english: nahoratransandadhamyritam vadishyami satyam vadishyami || tanmamavatu tadvaktaramavatu avatu
    mamavatu vaktaramavatu vaktaram || om purushasuktarthanirnayam vyakhyasyamah purushasamhitayam purushasuktarthah
    samgrahena procyate | sahasrashirshetyatra sashabdo'nantavacakah | anantayojanam praha dashangulavacastatha
    || 1|| tasya prathamaya vishnordeshato vyaptiririta | dvitiyaya casya vishnoh kalato vyaptirucyate
    || 2|| vishnormokshapradatvam ca kathitam tu tritiyaya | etavaniti mantrena vaibhavam kathitam hareh
    || 3|| etenaiva ca mantrena caturvyuho vibhashitah | tripadityanaya proktamaniruddhasya vaibhavam
    || 4|| tasmadviradityanaya padanarayanaddhareh | prakriteh purushasyapi samutpattih pradarshita ||
    5|| yatpurushenetyanaya srishtiyajnah samiritah | saptasyasanparidhayah samidhashca samiritah || 6||
    tam yajnamiti mantrena srishtiyajnah samiritah | anenaiva ca mantrena mokshashca samudiritah || 7||
    tasmaditi ca mantrena jagatsrishtih samirita | vedahamiti mantrabhyam vaibhavam kathitam hareh ||
    8|| yajnenetyupasamharah srishtermokshasya ceritah | ya evametajjanati sa hi mukto bhavediti || 9||
    1|| atha tatha mudgalopanishadi purushasuktasya vaibhavam vistarena pratipaditam | vasudeva indraya
    bhagavajjnanamupadishya punarapi sukshmashravanaya pranatayendraya paramarahasyabhutam purushasuktabhyam
    khandadvayabhyamupadishat | dvau khandavucyete | yo'ya muktah sa purusho namarupajnanagocaram samsarinamatidurjneyam
    vishayam vihaya kleshadibhih samklishtadevadijihirshaya sahasrakalavayavakalyanam drishtamatrena mokshadam
    veshamadade | tena veshena bhumyadilokam vyapyananta
  devanagari: नाहोरात्रान्सन्दधाम्यृतं वदिष्यामि सत्यं वदिष्यामि ॥ तन्मामवतु तद्वक्तारमवतु अवतु मामवतु
    वक्तारमवतु वक्तारम् ॥ ॐ पुरुषसूक्तार्थनिर्णयं व्याख्यास्यामः पुरुषसंहितायां पुरुषसूक्तार्थः संग्रहेण
    प्रोच्यते । सहस्रशीर्षेत्यत्र सशब्दोऽनन्तवाचकः । अनन्तयोजनं प्राह दशाङ्गुलवचस्तथा ॥ १॥ तस्य प्रथमया
    विष्णोर्देशतो व्याप्तिरीरिता । द्वितीयया चास्य विष्णोः कालतो व्याप्तिरुच्यते ॥ २॥ विष्णोर्मोक्षप्रदत्वं
    च कथितं तु तृतीयया । एतावानिति मन्त्रेण वैभवं कथितं हरेः ॥ ३॥ एतेनैव च मन्त्रेण चतुर्व्यूहो विभाषितः
    । त्रिपादित्यनया प्रोक्तमनिरुद्धस्य वैभवम् ॥ ४॥ तस्माद्विराडित्यनया पादनारायणाद्धरेः । प्रकृतेः पुरुषस्यापि
    समुत्पत्तिः प्रदर्शिता ॥ ५॥ यत्पुरुषेणेत्यनया सृष्टियज्ञः समीरितः । सप्तास्यासन्परिधयः समिधश्च समीरिताः
    ॥ ६॥ तं यज्ञमिति मन्त्रेण सृष्टियज्ञः समीरितः । अनेनैव च मन्त्रेण मोक्षश्च समुदीरितः ॥ ७॥ तस्मादिति
    च मन्त्रेण जगत्सृष्टिः समीरिता । वेदाहमिति मन्त्राभ्यां वैभवं कथितं हरेः ॥ ८॥ यज्ञेनेत्युपसंहारः सृष्टेर्मोक्षस्य
    चेरितः । य एवमेतज्जानाति स हि मुक्तो भवेदिति ॥ ९॥ १॥ अथ तथा मुद्गलोपनिषदि पुरुषसूक्तस्य वैभवं विस्तरेण
    प्रतिपादितम् । वासुदेव इन्द्राय भगवज्ज्ञानमुपदिश्य पुनरपि सूक्ष्मश्रवणाय प्रणतायेन्द्राय परमरहस्यभूतं
    पुरुषसूक्ताभ्यां खण्डद्वयाभ्यामुपादिशत् । द्वौ खण्डावुच्येते । योऽय मुक्तः स पुरुषो नामरूपज्ञानागोचरं
    संसारिणामतिदुर्ज्ञेयं विषयं विहाय क्लेशादिभिः संक्लिष्टदेवादिजिहीर्षया सहस्रकलावयवकल्याणं दृष्टमात्रेण
    मोक्षदं वेषमाददे । तेन वेषेण भूम्यादिलोकं व्याप्यानन्त
