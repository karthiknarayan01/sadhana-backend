id: vasishthamuniproktamtrailokyavijayakavacastotram
category: stotram
name:
  english: vasishthamuniproktamtrailokyavijayakavacastotram
  devanagari: वसिष्ठमुनिप्रोक्तंत्रैलोक्यविजयकवचस्तोत्रम्
content:
  english: 37|| iti shribrahmande mahapurane madhyamabhage trayastrimshattamadhyayantargatam vasishthamuniproktam
    trailokyavijayakavacastotram samaptam | brahmandapurana | madhyabhaga | upoddhata | adhyaya 33
  devanagari: ३७॥ इति श्रीब्रह्माण्डे महापुराणे मध्यमभागे त्रयस्त्रिंशत्तमाध्यायान्तर्गतं वसिष्ठमुनिप्रोक्तं
    त्रैलोक्यविजयकवचस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण । मध्यभाग । उपोद्धात । अध्याय ३३
meaning: {}
