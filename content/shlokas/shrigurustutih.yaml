id: shrigurustutih
category: stotram
name:
  english: shrigurustutih
  devanagari: श्रीगुरुस्तुतिः
content:
  english: shrigurustuti yo babhanabhananneva munibhyo brahma nirdvayam | dakshinamurtaye tasmai prajnanagurave
    namah || 1|| sthapitam brahmanishthena yenadvaitamatam bhuvi | tasmai shankarasamjnaya vijnanagurave
    namah || 2|| amshavatarah skandasya vishvacaryo vidam varah | pranamyate mahabhago ramano bhagavanrishih
    || 3|| dakshinamurtisarambham shankaracaryamadhyamam | ramanacaryaparyantam vande guruparamparam ||
    4|| timirani na kevalam vacobhih karunapangavilokitaishca nrinam | hridaye prasaranti mardayantam
    bhagavantam ramanam gurum namami || 5|| || iti shribhagavanmaharshiramanantevasino vasishthasya narasimhasunoh
    ganapateh kritih shrigurustutih samapta || anushtubvrittam
  devanagari: श्रीगुरुस्तुती यो बभाणाभणन्नेव मुनिभ्यो ब्रह्म निर्द्वयम् । दक्षिणामूर्तये तस्मै प्रज्ञानगुरवे
    नमः ॥ १॥ स्थापितं ब्रह्मनिष्ठेन येनाद्वैतमतं भुवि । तस्मै शङ्करसंज्ञाय विज्ञानगुरवे नमः ॥ २॥ अंशावतारः
    स्कन्दस्य विश्वाचार्यो विदां वरः । प्रणम्यते महाभागो रमणो भगवानृषिः ॥ ३॥ दक्षिणामूर्तिसारम्भां शङ्कराचार्यमध्यमाम्
    । रमणाचार्यपर्यन्तां वन्दे गुरुपरम्पराम् ॥ ४॥ तिमिराणि न केवलं वचोभिः करुणापाङ्गविलोकितैश्च नॄणाम्
    । हृदये प्रसरन्ति मर्दयन्तं भगवन्तं रमणं गुरुं नमामि ॥ ५॥ ॥ इति श्रीभगवन्महर्षिरमणान्तेवासिनो वासिष्ठस्य
    नरसिंहसूनोः गणपतेः कृतिः श्रीगुरुस्तुतिः समाप्ता ॥ अनुष्टुब्वृत्तम्
