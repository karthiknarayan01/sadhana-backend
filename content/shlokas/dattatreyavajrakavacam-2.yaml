id: dattatreyavajrakavacam-2
category: stotram
name:
  english: dattatreyavajrakavacam
  devanagari: दत्तात्रेयवज्रकवचम्
content:
  english: om atmane namah | om drim manase namah | om am drim shrim sauh om klam klim klum klaim klaum
    klah | shridattatreyaprasadasiddhyarthe jape viniyogah | om dram angushthabhyam namah | om drim tarjanibhyam
    namah | om drum madhyamabhyam namah | om draim anamikabhyam namah | om draum kanishthikabhyam namah
    | om drah karatalakaraprishthabhyam namah | evam hridayadi nyasah | om bhurbhuvahsvaromiti digbandhah
    | atha dhyanam | jadadankurakandaya saccidanandamurtaye | dattatreyaya yogindracandraya paramatmane
    || kada yogi kada bhogi kada nagnah pishacavat | dattatreyo harih sakshadbhuktimuktipradayakah ||
    varanasipurasnayi kolhapurajapadarah | mahuripurabhikshashi sahyashayi digambara || indranilasamakarashcandrakantisamadyutih
    | vaiduryasadrishasphurtishcalatkincijjatadharah || snigdhadhavalyayuktaksho'tyantanilakaninikah |
    bhruvakshahshmashrunilankah sashankasadrishananah || hasanirjitaniharah kanthanirjitakambukah | mamsalamso
    dirghabahuh paninirjitapallavah || vishalapinavakshashca tamrapanirdalodarah | prithulashronilalito
    vishalajaghanasthalah || rambhastambhopamanorurjanupurvaikajanghakah | gudhagulphah kurmaprishtholasatpadosharisthalah
    || raktaravindasadrisharamaniyapadadharah | carmambaradharo yogi smartrigami kshane kshane || jnanopadeshanirato
    vipaddharanadikshitah | siddhasanasamasina rijukayo hasanmukhah || vamahastena varado dakshinenabhayankarah
    | balonmattapishacibhih kvacidyuktah parikshitah || tyagi bhogi mahayogi nityanando niranjanah | sarvarupi
    sarvadata sarvagah sarvakamadah || bhasmoddhulitasarvango mahapatakanashanah | bhuktiprado muktidata
    jivanmukto na samshayah || evam dhyatva'nanyacitto madvajrakavacam pathet | mameva pashyansarvatra
    sa maya saha sancaret || digambaram bhasmasugandhalepanam cakram trishulam damarum gadayudham | padmasanam
    yogimunindravanditam datteti namasmaranena nityam || om dattatreyah shirah patu sahasrabjeshu samsthitah
    | bhalam patvanasuyeyashcandramandalamadhyagah || 28|| kurcam manomayah patu ham ksham dvidalapadmabhuh
    | jyotirupo'kshini patu patu shabdatmakah shruti || 29|| nasikam patu gandhatma mukham patu rasatmakah
    | jihvam vedatmakah patu dantoshthau patu dharmikah || 30|| kapolavatribhuh patu patvashesham mamatvavit
    | svaratma shodasharabjasthitah svatma'vatadgalam || 31|| skandhau candranujah patu bhujau patu kritadibhuh
    | jatruni shatrujit patu patu vakshahsthalam harih || 32|| kadithantadvadasharapadmago marudatmakah
    | yogishvareshvarah patu hridayam hridayasthitah || 33|| parshve harih parshvavarti patu parshvasthitah
    smritah | hathayogadiyogajnah kukshi patu kripanidhih || 34|| dakaradiphakarantadasharasarasiruhe
    | nabhisthale vartamano nabhim vahnyatmako'vatu || 35|| vahnitatvamayo yogi rakshatanmanipurakam |
    katim katisthabrahmandavasudevatmako'vatu || 36|| vakaradilakarantashatpatrambujabodhakah | jalatatvamayo
    yogi svadhishthanam mamavatu || 37|| siddhasanasamasina uru siddheshvaro'vatu | vadisantacatushpatrasaroruhanibodhakah
    || 38|| muladharam mahirupo rakshatadviryanigrahi | prishtham ca sarvatah patu janyunyastakarambujah
    || 39|| janghe patvavadhutendrah patvanghri tirthapavanah | sarvangam patu sarvatma romanyavatu keshavah
    || 40|| carma carmambarah patu raktam bhaktipriyo'vatu | mamsam mamsakarah patu majjam majjatmako'vatu
    || 41|| asthini sthiradhih payanmedham vedhah prapalayet | shukram sukhakarah patu cittam patu dridhakritih
    || 42|| manobuddhimahankaram hrishikeshatmako'vatu | karmendriyani patvishah patu jnanendriyanyajah
    || 43|| bandhun bandhuttamah payacchatrubhyah patu shatrujit | griharamadhanakshetraputradinchankaro'vatu
    || 44|| bharyam prakritivit patu pashvadinpatu sharngabhrit | prananpatu pradhanajno bhakshyadinpatu
    bhaskarah || 45|| sukham candratmakah patu duhkhat patu purantakah | pashunpashupatih patu bhutim
    bhuteshvaro mama || 46|| pracyam vishaharah patu patvagneyyam makhatmakah | yamyam dharmatmakah patu
    nairityam sarvavairihrit || 47|| varahah patu varunyam vayavyam pranado'vatu | kauberyam dhanadah
    patu patvaishanyam mahaguruh || 48|| urdhvam patu mahasiddhah patvadhastajjatadharah | rakshahinam
    tu yatsthanam rakshatvadimunishvarah || 49|| etanme vajrakavacam yah pathecchrinuyadapi | vajrakayashciranjivi
    dattatreyo'hamabruvam || 50|| tyagi bhogi mahayogi sukhaduhkhavivarjitah | sarvatrasiddhasankalpo
    jivanmukto'dya vartate || 52|| ityuktvantardadhe yogi dattatreyo digambarah | daladano'pi tajjaptva
    jivanmuktah sa vartate || 53|| bhillo durashrava nama tadanim shrutavadinam | sakricchravanamatrena
    vajrango'bhavadapyasau || 54|| ityetadvajrakavacam dattatreyasya yoginah | shrutvashesham shambhumukhat
    punarapyaha parvati || 55|| parvatyuvaca | etatkavacamahatmyam vada vistarato mama | kutra kena kada
    japyam kim yajapyam katham katham || 56|| uvaca shambhustatsarvam parvatya vinayoditam | shrishiva
    uvaca | shrunu parvati vakshyami samahitamanavilam || 57|| dharmarthakamamokshanamidameva parayanam
    | hastyashvarathapadatisarvaishvaryapradayakam || 58|| putramitrakalatradisarvasantoshasadhanam |
    vedashastradividyanam nidhanam paramam hi tat || 59|| sangitashastrasahityasatkavitvavidhayakam |
    buddhividyasmritiprajnamatipraudhipradayakam || 60|| sarvasantoshakaranam sarvaduhkhanivaranam | shatru
    samharakam shighram yashahkirtivivardhanam || 61|| ashtasamkhya maharogah sannipatastrayodasha | shannavatyakshirogashca
    vimshatirmeharogakah || 62|| ashtadasha tu kushthani gulmanyashtavidhanyapi | ashitirvatarogashca
    catvarishattu paittikah || 63|| vimshatishleshmarogashca kshayacaturthikadayah | mantrayantrakuyogadyah
    kalpatantradinirmitah || 64|| brahmarakshasavetalakushmandadigrahodbhavah | sangajah deshakalasthastapatrayasamutthitah
    || 65|| navagrahasamudbhuta mahapatakasambhavah | sarve rogah pranashyanti sahasravartanaddhruvam
    || 66|| ayutavrittimatrena vandhya putravati bhavet | ayutadvitayavrittya hyapamrityujayo bhavet ||
    67|| ayutatritayaccaiva khecaratvam prajayate | sahasradayutadarvak sarvakaryani sadhayet || 68||
    lakshavritya karyasiddhirbhavetyeva na samshayah | vishavrikshasya muleshu tishthan vai dakshinamukhah
    || 69|| kurute masamatrena vairinam vikalendriyam | audumbaratarormule vriddhikamena japyate || 70||
    shrivakshamule shrikami tintini shantikarmani | ojaskamo'shvatthamule strikamaih sahakarake || 71||
    jnanarthi tulasimule garbhagehe sutarthibhih | dhanarthibhistu sukshetre pashukamaistu goshthake ||
    72|| devalaye sarvakamaistatkale sarvadarshitam | nabhimatrajale sthitva bhanumalokya yo japet ||
    73|| yuddhe va shastravade va sahasrena jayo bhavet | kanthamatre jale sthitva yo ratrau kavacam pathet
    || 74|| jvarapasmarakushthaditapajvaranivaranam | yatra yatsyatsthiram yadyatprasannam tannivartate
    || 75|| tena tatra hi japtavyam tatah siddhirbhaveddhruvam | ityuktvan ca shivo gaurye rahasyam paramam
    shubham || 76|| yah pathet vajrakavacam dattatreyosamo bhavet | evam shivena kathitam himavatsutayai
    proktam || 77|| daladamunaye'trisutenapurvam yah ko'pi vajrakavacam | pathatiha loke dattopamashcarati
    yogivarashcirayuh || 78|| || iti shrirudrayamale himavatkhande umamaheshvarasamvade shridattatreyavajrakavacastotram
    sampurnam ||
  devanagari: ॐ आत्मने नमः । ॐ द्रीं मनसे नमः । ॐ आं द्रीं श्रीं सौः ॐ क्लां क्लीं क्लूं क्लैं क्लौं क्लः
    । श्रीदत्तात्रेयप्रसादसिद्ध्यर्थे जपे विनियोगः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां
    नमः । ॐ द्रूं मध्यमाभ्यां नमः । ॐ द्रैं अनामिकाभ्यां नमः । ॐ द्रौं कनिष्ठिकाभ्यां नमः । ॐ द्रः करतलकरपृष्ठाभ्यां
    नमः । एवं हृदयादि न्यासः । ॐ भूर्भुवःस्वरोमिति दिग्बन्धः । अथ ध्यानम् । जददङ्कुरकन्दाय सच्चिदानन्दमूर्तये
    । दत्तात्रेयाय योगीन्द्रचन्द्राय परमात्मने ॥ कदा योगी कदा भोगी कदा नग्नः पिशाचवत् । दत्तात्रेयो हरिः
    साक्षाद्भुक्तिमुक्तिप्रदायकः ॥ वाराणसीपुरस्नायी कोल्हापुरजपादरः । माहुरीपुरभिक्षाशी सह्यशायी दिगम्बर
    ॥ इन्द्रनीलसमाकारश्चन्द्रकान्तिसमद्युतिः । वैडुर्यसदृशस्फूर्तिश्चलत्किञ्चिज्जटाधरः ॥ स्निग्धधावल्ययुक्ताक्षोऽत्यन्तनीलकनीनिकः
    । भ्रूवक्षःश्मश्रुनीलाङ्कः सशाङ्कसदृशाननः ॥ हासनिर्जितनीहारः कण्ठनिर्जितकम्बुकः । मांसलांसो दीर्घबाहुः
    पाणिनिर्जितपल्लवः ॥ विशालपीनवक्षाश्च ताम्रपाणिर्दलोदरः । पृथुलश्रोणिललितो विशालजघनस्थलः ॥ रम्भास्तम्भोपमानोरुर्जानुपूर्वैकजङ्घकः
    । गूढगुल्फः कूर्मपृष्ठोलसत्पादोषरिस्थलः ॥ रक्तारविन्दसदृशरमणीयपदाधरः । चर्माम्बरधरो योगी स्मर्तृगामी
    क्षणे क्षणे ॥ ज्ञानोपदेशनीरतो विपद्धरणदीक्षितः । सिद्धासनसमासीन ऋजुकायो हसन्मुखः ॥ वामहस्तेन वरदो
    दक्षिणेनाभयङ्करः । बालोन्मत्तपिशाचीभिः क्वचिद्युक्तः परीक्षितः ॥ त्यागी भोगी महायोगी नित्यानन्दो निरञ्जनः
    । सर्वरूपी सर्वदाता सर्वगः सर्वकामदः ॥ भस्मोद्धूलितसर्वाङ्गो महापातकनाशनः । भुक्तिप्रदो मुक्तिदाता
    जीवन्मुक्तो न संशयः ॥ एवं ध्यात्वाऽनन्यचित्तो मद्वज्रकवचं पठेत् । मामेव पश्यन्सर्वत्र स मया सह सङ्चरेत्
    ॥ दिगम्बरं भस्मसुगन्धलेपनं चक्रं त्रिशूलं डमरुं गदायुधम् । पद्मासनं योगिमुनीन्द्रवन्दितं दत्तेति नामस्मरणेन
    नित्यम् ॥ ॐ दत्तात्रेयः शिरः पातु सहस्राब्जेषु संस्थितः । भालं पात्वानसूयेयश्चन्द्रमण्डलमध्यगः ॥ २८॥
    कूर्चं मनोमयः पातु हं क्षं द्विदलपद्मभूः । ज्योतिरूपोऽक्षिणी पातु पातु शब्दात्मकः श्रुती ॥ २९॥ नासिकां
    पातु गन्धात्मा मुखं पातु रसात्मकः । जिह्वां वेदात्मकः पातु दन्तोष्ठौ पातु धार्मिकः ॥ ३०॥ कपोलावत्रिभूः
    पातु पात्वशेषं ममात्ववित् । स्वरात्मा षोडशाराब्जस्थितः स्वात्माऽवताद्गलम् ॥ ३१॥ स्कन्धौ चन्द्रानुजः
    पातु भुजौ पातु कृतादिभूः । जत्रुणी शत्रुजित् पातु पातु वक्षःस्थलं हरिः ॥ ३२॥ कादिठान्तद्वादशारपद्मगो
    मरुदात्मकः । योगीश्वरेश्वरः पातु हृदयं हृदयस्थितः ॥ ३३॥ पार्श्वे हरिः पार्श्ववर्ती पातु पार्श्वस्थितः
    स्मृतः । हठयोगादियोगज्ञः कुक्षी पातु कृपानिधिः ॥ ३४॥ डकारादिफकारान्तदशारसरसीरुहे । नाभिस्थले वर्तमानो
    नाभिं वह्न्यात्मकोऽवतु ॥ ३५॥ वह्नितत्वमयो योगी रक्षतान्मणिपूरकम् । कटिं कटिस्थब्रह्माण्डवासुदेवात्मकोऽवतु
    ॥ ३६॥ वकारादिलकारान्तषट्पत्राम्बुजबोधकः । जलतत्वमयो योगी स्वाधिष्ठानं ममावतु ॥ ३७॥ सिद्धासनसमासीन
    ऊरू सिद्धेश्वरोऽवतु । वादिसान्तचतुष्पत्रसरोरुहनिबोधकः ॥ ३८॥ मूलाधारं महीरूपो रक्षताद्वीर्यनिग्रही
    । पृष्ठं च सर्वतः पातु जान्युन्यस्तकराम्बुजः ॥ ३९॥ जङ्घे पात्ववधूतेन्द्रः पात्वङ्घ्री तीर्थपावनः ।
    सर्वाङ्गं पातु सर्वात्मा रोमाण्यवतु केशवः ॥ ४०॥ चर्म चर्माम्बरः पातु रक्तं भक्तिप्रियोऽवतु । मांसं
    मांसकरः पातु मज्जां मज्जात्मकोऽवतु ॥ ४१॥ अस्थीनि स्थिरधीः पायान्मेधां वेधाः प्रपालयेत् । शुक्रं सुखकरः
    पातु चित्तं पातु दृढाकृतिः ॥ ४२॥ मनोबुद्धिमहङ्कारं हृषीकेशात्मकोऽवतु । कर्मेन्द्रियाणि पात्वीशः पातु
    ज्ञानेन्द्रियाण्यजः ॥ ४३॥ बन्धून् बन्धूत्तमः पायाच्छत्रुभ्यः पातु शत्रुजित् । गृहारामधनक्षेत्रपुत्रादीञ्छङ्करोऽवतु
    ॥ ४४॥ भार्यां प्रकृतिवित् पातु पश्वादीन्पातु शार्ङ्गभृत् । प्राणान्पातु प्रधानज्ञो भक्ष्यादीन्पातु
    भास्करः ॥ ४५॥ सुखं चन्द्रात्मकः पातु दुःखात् पातु पुरान्तकः । पशून्पशूपतिः पातु भूतिं भूतेश्वरो मम
    ॥ ४६॥ प्राच्यां विषहरः पातु पात्वाग्नेय्यां मखात्मकः । याम्यां धर्मात्मकः पातु नैऋत्यां सर्ववैरिहृत्
    ॥ ४७॥ वराहः पातु वारुण्यां वायव्यां प्राणदोऽवतु । कौबेर्यां धनदः पातु पात्वैशान्यां महागुरुः ॥ ४८॥
    उर्ध्वं पातु महासिद्धः पात्वधस्ताज्जटाधरः । रक्षाहीनं तु यत्स्थानं रक्षत्वादिमुनीश्वरः ॥ ४९॥ एतन्मे
    वज्रकवचं यः पठेच्छृणुयादपि । वज्रकायश्चिरञ्जीवी दत्तात्रेयोऽहमब्रुवम् ॥ ५०॥ त्यागी भोगी महायोगी सुखदुःखविवर्जितः
    । सर्वत्रसिद्धसङ्कल्पो जीवन्मुक्तोऽद्य वर्तते ॥ ५२॥ इत्युक्त्वान्तर्दधे योगी दत्तात्रेयो दिगम्बरः
    । दलादनोऽपि तज्जप्त्वा जीवन्मुक्तः स वर्तते ॥ ५३॥ भिल्लो दूरश्रवा नाम तदानीं श्रुतवादिनम् । सकृच्छ्रवणमात्रेण
    वज्राङ्गोऽभवदप्यसौ ॥ ५४॥ इत्येतद्वज्रकवचं दत्तात्रेयस्य योगिनः । श्रुत्वाशेषं शम्भुमुखात् पुनरप्याह
    पार्वती ॥ ५५॥ पार्वत्युवाच । एतत्कवचमाहात्म्यं वद विस्तरतो मम । कुत्र केन कदा जाप्यं किं यजाप्यं कथं
    कथम् ॥ ५६॥ उवाच शम्भुस्तत्सर्वं पार्वत्या विनयोदितम् । श्रीशिव उवाच । श्रुणु पार्वति वक्ष्यामि समाहितमनाविलम्
    ॥ ५७॥ धर्मार्थकाममोक्षाणामिदमेव परायणम् । हस्त्यश्वरथपादातिसर्वैश्वर्यप्रदायकम् ॥ ५८॥ पुत्रमित्रकलत्रादिसर्वसन्तोषसाधनम्
    । वेदशास्त्रादिविद्यानां निधानं परमं हि तत् ॥ ५९॥ सङ्गीतशास्त्रसाहित्यसत्कवित्वविधायकम् । बुद्धिविद्यास्मृतिप्रज्ञामतिप्रौढिप्रदायकम्
    ॥ ६०॥ सर्वसन्तोषकरणं सर्वदुःखनिवारणम् । शत्रु संहारकं शीघ्रं यशःकीर्तिविवर्धनम् ॥ ६१॥ अष्टसंख्या महारोगाः
    सन्निपातास्त्रयोदश । षण्णवत्यक्षिरोगाश्च विंशतिर्मेहरोगकाः ॥ ६२॥ अष्टादश तु कुष्ठानि गुल्मान्यष्टविधान्यपि
    । अशीतिर्वातरोगाश्च चत्वारिशत्तु पैत्तिकाः ॥ ६३॥ विंशतिश्लेष्मरोगाश्च क्षयचातुर्थिकादयः । मन्त्रयन्त्रकुयोगाद्याः
    कल्पतन्त्रादिनिर्मिताः ॥ ६४॥ ब्रह्मराक्षसवेतालकूष्माण्डादिग्रहोद्भवाः । सङ्गजाः देशकालस्थास्तापत्रयसमुत्थिताः
    ॥ ६५॥ नवग्रहसमुद्भूता महापातकसम्भवाः । सर्वे रोगाः प्रणश्यन्ति सहस्रावर्तनाद्ध्रुवम् ॥ ६६॥ अयुतावृत्तिमात्रेण
    वन्ध्या पुत्रवती भवेत् । अयुतद्वितयावृत्त्या ह्यपमृत्युजयो भवेत् ॥ ६७॥ अयुतत्रितयाच्चैव खेचरत्वं प्रजायते
    । सहस्रादयुतादर्वाक् सर्वकार्याणि साधयेत् ॥ ६८॥ लक्षावृत्या कार्यसिद्धिर्भवेत्येव न संशयः । विषवृक्षस्य
    मूलेषु तिष्ठन् वै दक्षिणामुखः ॥ ६९॥ कुरुते मासमात्रेण वैरिणं विकलेन्द्रियम् । औदुम्बरतरोर्मूले वृद्धिकामेन
    जाप्यते ॥ ७०॥ श्रीवक्षमूले श्रीकामी तिन्तिणी शान्तिकर्मणि । ओजस्कामोऽश्वत्थमूले स्त्रीकामैः सहकारके
    ॥ ७१॥ ज्ञानार्थी तुलसीमूले गर्भगेहे सुतार्थिभिः । धनार्थिभिस्तु सुक्षेत्रे पशुकामैस्तु गोष्ठके ॥ ७२॥
    देवालये सर्वकामैस्तत्काले सर्वदर्शितम् । नाभिमात्रजले स्थित्वा भानुमालोक्य यो जपेत् ॥ ७३॥ युद्धे वा
    शास्त्रवादे वा सहस्रेण जयो भवेत् । कण्ठमात्रे जले स्थित्वा यो रात्रौ कवचं पठेत् ॥ ७४॥ ज्वरापस्मारकुष्ठादितापज्वरनिवारणम्
    । यत्र यत्स्यात्स्थिरं यद्यत्प्रसन्नं तन्निवर्तते ॥ ७५॥ तेन तत्र हि जप्तव्यं ततः सिद्धिर्भवेद्ध्रुवम्
    । इत्युक्त्वान् च शिवो गौर्ये रहस्यं परमं शुभं ॥ ७६॥ यः पठेत् वज्रकवचं दत्तात्रेयोसमो भवेत् । एवं
    शिवेन कथितं हिमवत्सुतायै प्रोक्तं ॥ ७७॥ दलादमुनयेऽत्रिसुतेनपूर्वम् यः कोऽपि वज्रकवचं । पठतीह लोके
    दत्तोपमश्चरति योगिवरश्चिरायुः ॥ ७८॥ ॥ इति श्रीरुद्रयामले हिमवत्खण्डे उमामहेश्वरसंवादे श्रीदत्तात्रेयवज्रकवचस्तोत्रं
    सम्पूर्णम् ॥
