id: bagalamukhikavacam
category: kavacha
name:
  english: bagalamukhikavacam
  devanagari: बगलामुखीकवचम्
content:
  english: rinu vakshyami bhairavi pranavallabhe || pathitva dharayitva tu trailaukye vijayi bhavet ||
    om asya shribagalamukhikavacasya naradarishiranushtupchandah shribagalamukhi devata lam bijam aim
    kilakam purusharthacatushtaye jape viniyogah || shiro me bagala patu hridayaikakshari para | om hrim
    om me lalate ca bagala vairinashini || gadahasta sada patu mukham me mokshadayini | vairijihvandhara
    patu kantham me bagalamukhi || udaram nabhidesham ca patu nityam paratpara | paratparapara patu mama
    guhyam sureshvari || hastau caiva tatha patu parvatiparipatu me | vivade vishame ghore sangrame ripusankate
    || pitambaradhara patu sarvangam shivanartaki | shrividyasamayo patu matangiduritashiva || patuputram
    sutam caiva kalatram kalika mama | patu nityam bhrataram me pitaram shulini sada || sandehi bagaladevyah
    kavacam manmukhoditam | naiva deyamamukhyaya sarvasiddhipradayakam || pathanaddharanadasya pujanadvanchitam
    labhet | idam kavacamajnatva yo japed bagalamukhim || pibanti shonitam tasya yoginyah prapyasadarah
    | vashye cakarshane caiva marane mohane tatha || mahabhaye vipattau ca pathedvapathayettu yah | tasya
    sarvarthasiddhih syadbhaktiyuktasya parvati || iti shrirudrayamale bagalamukhikavacam sampurnam ||
  devanagari: ृणु वक्ष्यामि भैरवी प्राणवल्लभे ॥ पठित्वा धारयित्वा तु त्रैलौक्ये विजयी भवेत् ॥ ॐ अस्य श्रीबगलामुखीकवचस्य
    नारदऋषिरनुष्टुप्छन्दः श्रीबगलामुखी देवता लं बीजं ऐं कीलकं पुरुषार्थचतुष्टये जपे विनियोगः ॥ शिरो मे
    बगला पातु हृदयैकाक्षरी परा । ॐ ह्रीं ॐ मे ललाटे च बगला वैरिनाशिनी ॥ गदाहस्ता सदा पातु मुखं मे मोक्षदायिनी
    । वैरिजिह्वान्धरा पातु कण्ठं मे बगलामुखी ॥ उदरं नाभिदेशं च पातु नित्यं परात्परा । परात्परपरा पातु
    मम गुह्यं सुरेश्वरी ॥ हस्तौ चैव तथा पातु पार्वतीपरिपातु मे । विवादे विषमे घोरे सङ्ग्रामे रिपुसङ्कटे
    ॥ पीताम्बरधरा पातु सर्वाङ्गं शिवनर्तकी । श्रीविद्यासमयो पातु मातङ्गीदुरिताशिवा ॥ पातुपुत्रं सुतां
    चैव कलत्रं कालिका मम । पातु नित्यं भ्रातरं मे पितरं शूलिनी सदा ॥ सन्देहि बगलादेव्याः कवचं मन्मुखोदितम्
    । नैव देयममुख्याय सर्वसिद्धिप्रदायकम् ॥ पठनाद्धारणादस्य पूजनाद्वाञ्छितं लभेत् । इदं कवचमज्ञात्वा यो
    जपेद् बगलामुखीम् ॥ पिबन्ति शोणितं तस्य योगिन्यः प्राप्यसादराः । वश्ये चाकर्षणे चैव मारणे मोहने तथा
    ॥ महाभये विपत्तौ च पठेद्वापाठयेत्तु यः । तस्य सर्वार्थसिद्धिः स्याद्भक्तियुक्तस्य पार्वती ॥ इति श्रीरुद्रयामले
    बगलामुखीकवचं सम्पूर्णम् ॥
