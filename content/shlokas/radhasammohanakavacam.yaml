id: radhasammohanakavacam
category: kavacha
name:
  english: radhasammohanakavacam
  devanagari: राधासम्मोहनकवचम्
content:
  english: siddhyarthe viniyogah || om raseshvari me shirah patu lalatam krishnamohini | netre patu ca
    radhika shruti patu sulocana || 1|| nasikam patu sarvangi mukham patu manohara | kantham patu ca sundari
    bahu patu ca rasika || 2|| hastau patu jaganmata hridayam patu radhika | kukshim patu mahamaya katim
    patu vilasini || 3|| uru patu rati
  devanagari: सिद्ध्यर्थे विनियोगः ॥ ॐ रासेश्वरी मे शिरः पातु ललाटं कृष्णमोहिनी । नेत्रे पातु च राधिका
    श्रुती पातु सुलोचना ॥ १॥ नासिकां पातु सर्वाङ्गी मुखं पातु मनोहरा । कण्ठं पातु च सुन्दरी बाहू पातु
    च रासिका ॥ २॥ हस्तौ पातु जगन्माता हृदयं पातु राधिका । कुक्षिं पातु महामाया कटिं पातु विलासिनी ॥ ३॥
    उरू पातु रति
meaning: {}
