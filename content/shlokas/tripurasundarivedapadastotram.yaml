id: tripurasundarivedapadastotram
category: stotram
name:
  english: tripurasundarivedapadastotram
  devanagari: त्रिपुरसुन्दरीवेदपादस्तोत्रम्
content:
  english: llakshmirgaurityevamanye vadanti | shashvanmatah pratyagadvaitarupam shamsanti kecinnivido
    janah || 46|| laliteti sudhapuramadhuricoramambike | tava namasti yattena jihva me madhumattama ||
    47|| ye sampannah sadhanaistaishcatturbhih shushrushabhirdeshikam prinayanti | samyagvidvanshuddhasattvantaranam
    teshamevaitam brahmavidyam vadeta || 48|| abhicaradibhih krityam yah prerayati mayyume | tava hunkarasantrasta
    pratyakkartaramricchatu || 49|| jagatpavitri mamikamapaharashu durjaram | prasida me daya dhune prashastimamba
    naskridhi || 50|| kadambarunamambaya rupam cintaya citta me | munca papiyasim nishtham ma gridhah
    kasya sviddhanam || 51|| bhandabhandanalilayam raktacandanapankilah | ankushastava tam hanyadyashca
    no dvishate janah || 52|| re re citta tvam vritha shokasindhau majjasyantarvacmyupayam vimuktyai |
    devyah padau pujayaikaksharena tatte padam sangrahena bravimyom || 53|| cancadbalatapajyotsnakalamandalashaline
    | aikshavaya namo matarbahubhyam tava dhanvane || 54|| tamevadyam brahmavidyamupase murtairvedaih
    stuyamanam bhavanim | hanta svatmattvena yam muktikamo matva dhiro harshashokau jahati || 55|| sharanam
    karavanyamba caranam tava sundari | shepe tvatpadukabhyam me nanyah pantha ayanaya || 56|| ratnacchatraishcamarairdarpanadyai
  devanagari: ल्लक्ष्मीर्गौरीत्येवमन्ये वदन्ति । शश्वन्मातः प्रत्यगद्वैतरूपां शंसन्ति केचिन्निविदो जनाः
    ॥ ४६॥ ललितेति सुधापूरमाधुरीचोरमम्बिके । तव नामास्ति यत्तेन जिह्वा मे मधुमत्तमा ॥ ४७॥ ये सम्पन्नाः
    साधनैस्तैश्चत्तुर्भिः शुश्रूषाभिर्देशिकं प्रीणयन्ति । सम्यग्विद्वाञ्शुद्धसत्त्वान्तराणां तेषामेवैतां
    ब्रह्मविद्यां वदेत ॥ ४८॥ अभिचारादिभिः कृत्यां यः प्रेरयति मय्युमे । तव हुङ्कारसन्त्रस्ता प्रत्यक्कर्तारमृच्छतु
    ॥ ४९॥ जगत्पवित्रि मामिकामपहराशु दुर्जराम् । प्रसीद मे दया धुने प्रशस्तिमम्ब नस्कृधि ॥ ५०॥ कदम्बारुणमम्बाया
    रूपं चिन्तय चित्त मे । मुञ्च पापीयसीं निष्ठां मा गृधः कस्य स्विद्धनम् ॥ ५१॥ भण्डभण्डनलीलायां रक्तचन्दनपङ्किलः
    । अङ्कुशस्तव तं हन्याद्यश्च नो द्विषते जनः ॥ ५२॥ रे रे चित्त त्वं वृथा शोकसिन्धौ मज्जस्यन्तर्वच्म्युपायं
    विमुक्त्यै । देव्याः पादौ पूजयैकाक्षरेण तत्ते पदं सङ्ग्रहेण ब्रवीम्योम् ॥ ५३॥ चञ्चद्बालातपज्योत्स्नाकलामण्डलशालिने
    । ऐक्षवाय नमो मातर्बाहुभ्यां तव धन्वने ॥ ५४॥ तामेवाद्यां ब्रह्मविद्यामुपासे मूर्तैर्वेदैः स्तूयमानां
    भवानीम् । हन्त स्वात्मत्त्वेन यां मुक्तिकामो मत्वा धीरो हर्षशोकौ जहाति ॥ ५५॥ शरणं करवाण्यम्ब चरणं
    तव सुन्दरि । शेपे त्वत्पादुकाभ्यां मे नान्यः पन्था अयनाय ॥ ५६॥ रत्नच्छत्रैश्चामरैर्दर्पणाद्यै
