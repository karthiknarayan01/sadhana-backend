id: stutih-2
category: stotram
name:
  english: stutih
  devanagari: स्तुतिः
content:
  english: jaya jaya samsritirugvinashavaidya || 108|| jaya jaya sarvasurorusarvanatha jaya jaya shriparvatendrajasanatha
    | jaya jaya carushashankashobhimaule jaya jaya papagirindrapakshavajra || 109|| jaya jaya kalabhujanganashashila
    jaya jaya kundalakundalishamala | jaya jaya bhasmavibhushanangasanga jaya jaya bhaktahridabjapapabhanga
    || 110|| jaya jaya krittivasana vishvamurte jaya jaya sarvajanavanaikatana | jaya jaya hemasamanadama
    shobhin jaya jaya duravinashicarukama || 111|| jaya jaya dehavarardhashobhikanta jaya jaya bhaktajanaikabhushitanta
    | jaya jaya deva varaihi hritarijadya
  devanagari: जय जय संसृतिरुग्विनाशवैद्य ॥ १०८॥ जय जय सर्वसुरोरुसर्वनाथ जय जय श्रीपर्वतेन्द्रजासनाथ ।
    जय जय चारुशशाङ्कशोभिमौले जय जय पापगिरीन्द्रपक्षवज्र ॥ १०९॥ जय जय कालभुजङ्गनाशशील जय जय कुण्डलकुण्डलीशमाल
    । जय जय भस्मविभूषणाङ्गसङ्ग जय जय भक्तहृदब्जपापभङ्ग ॥ ११०॥ जय जय कृत्तिवसान विश्वमूर्ते जय जय सर्वजनावनैकतान
    । जय जय हेमसमानदाम शोभिन् जय जय दूरविनाशिचारुकाम ॥ १११॥ जय जय देहवरार्धशोभिकान्त जय जय भक्तजनैकभूषितान्त
    । जय जय देव वरैहि हृतारिजाड्य
meaning: {}
