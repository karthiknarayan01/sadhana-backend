id: kytb-3-7-acchidra-kanda-prayaschitta-krishna-yajurveda-taittiriya-brahmana-patha-sarvan-va-eshognau
category: stotram
name:
  english: KYTB 3.7 Acchidra Kanda Prayaschitta - Krishna Yajurveda Taittiriya Brahmana Patha - Sarvan
    Va Eshognau
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake saptamah prapathakah shri gurubhyo namah
    | harih om || acchidra mprayashcittena mantraishca yajnacchidrapuranadacchidramucyate anuvakam shapurnamaseshtivishayani
    kani citprayashcittani sarvan 'gninanvadhaya vratamupaiti | sa yadanishtva prayayat | akamaprita ena
    nkama nanu prayayuh | ateja aviryah syat | sa juhuyat | tubhya nta angirastama | vishva ssukshitayah
    prithak | agne kamaya yemira iti | kamanevasmi nti | tejasvi viryava nbhavati || santatirva esha yajnasya
    | yo 'gninanvadhaya vratamupaiti | sa yadudvayati | vicchitti mprancamuddhritya | manasopatishtheta
    | mano vai prajapatih | prajapatyo yajnah || || manasaiva yajnagm santanoti | bhurityaha | bhuto vai
    prajapatih | bhutimevopaiti || vi va esha indriyena viryenardhyate | yasya ragnirapakshayati | yavacchamyaya
    praviddhye t | yadi tavadapakshaye t | tagm sambharet | ida || tritiyena jyotisha sam ve~shanastanuvai
    caruredhi | priye devana mparame janitra iti | brahmanaivainagm sambharati | saiva tatah prayashcittih
    | yadi parasta t | anu prayayavasyet | so eva tatah prayashcittih || oshadhirva etasya pashu npayah
    pravishati | yasya havishe vathsa apakrita dhayanti || yadduhyat | yataya mna havisha yajeta | yanna
    duhyat | yajnaparu rantariyat | vayavyam nnirvapet | vayurvai payasah pradapayita | sa evasmai payah
    pradapayati | payo va oshadhayah | payah payah | payasaivasmai payo || athottarasmai havishe vathsanapa
    kuryat | saiva tatah prayashcittih || anyataran nbhagadheyena vyardhayati | ye yajamanasya saya gacchanti
    | yasya saya ndugdhagm havirarti marcchati | indraya vrihinni pavaset | payo va oshadhayah | paya
    evarabhya grihitvo || athetara aindrah purodashah syat | indriye evasmai samici dadhati | payo va
    oshadhayah | payah payah | payasaivasmai payo 'varundhe | athottarasmai havishe vathsanapa kuryat
    | saiva tatah prayashcittih || ubhayan nbhagadheyena vyardhayati | ye yajamanasya saya nca pratashca
    grihama gacchanti | yasyobhayagm havirarti nnirvapet | agni ya~jet | agnimukha eva devatah va~ anvanya
    devatah | indramanvanyah | ta evobhayih prinati | payo va oshadhayah | payah payah | payasaivasmai
    payo 'varundhe | athottarasmai havishe vathsanapa kuryat || || saiva tatah prayashcittih || ardho
    va etasya yajnasya miyate | yasya vratye lambhuka bhavati | tamaparuddhya yajeta | sarvenaiva yajnena
    yajate | tamishtvo pahvayeta | amuhamasmi | sa tvam | dyauraham | prithivi tvam | samaham | riktvam
    | tavehi sambhavava | saha reto dadhavahai | pugmse putraya vettavai | rayasposhaya suprajastvaya
    suviryayeti | ardha evainamu pahvayate | saiva tatah prayashcittih || prithivi tvamashtau ca vi vai
    yadi parastaramoshadhiran yataranubhayanardho vai agnihotrasamnayyasadharanani prayashcittani shshannena
    juhuyat | apraja apashuryajamana ssyat | yadanayatane ninaye t | prajapatyayarca valmika vanayet |
    prajapatyo vai valmikah | yajnah prajapatih | prajapataveva yajna mpratishthapayati | bhurityaha |
    bhuto vai prajapatih || || bhutimevopaiti | ta m | saiva tatah prayashcittih || yatkita vapannena
    juhuyat | apraja apashu ssyat | yadanayatane ninaye t | maddhyamena parnena dyava 'ntah paridhi ninayet
    | dyavaprithivyo || tatkritva | anya m | saiva tatah prayashcittih || yadavavrishtena juhuyat | aparupa
    njayeta | kilaso va syadar tpratyeyat | yajnam vi~cchindyat | sa juhuyat | mitro jana n kalpayati
    prajanann || || mitro dadhara prithivimuta dyam | mitrah krishtira nimisha 'bhicashte | satyaya havya
    jjuhoteti | mitrenaivaina tkalpayati | tatkritva | anya m | saiva tatah prayashcittih || ya mahutyagm
    hutaya t | dvipadbhih pashubhi ryajamano vyriddhyeta | yaduttaraya 'bhijuhuyat || || catushpadbhih
    pashubhi ryajamano vyriddhyeta | yatra vettha vanaspate devana nguhya namani | tatra havyani gamayeti
    vanaspatya madhaya | tushnimeva puna rjuhuyat | vanaspatinaiva yajnasyarta ncahuti vidadhara | tatkritva
    | anya m | saiva tatah prayashcittih || yatpura prayajebhyah pramangara t | addhvaryave ca yajamanaya
    cakagg syat || ddakshina | brahmane ca yajamanaya cakagg syat | ya tpratyak | hotre ca patniyai ca
    yajamanaya cakagg syat | yadudam | agnidhe ca pashubhyashca yajamanaya cakagg syat | yadabhijuhuyat
    | rudro ssyat | yannabhi juhuyat | asha || sruvasya buddhnenabhi nidaddhyat | ma tamo ma yajnastamanma
    yajamana stamat | namaste astvayate | namo rudra parayate | namo yatra nishidasi | amu mma higmsiriti
    yena skande mpraharet | sahasrashringo vrishabho jatavedah | stomaprishtho ghritava thsupratikah |
    ma no hasinmetthito nettva jahama | goposha nca yaccheti | brahmanaivaina mpraharati | saiva tatah
    prayashcittih || yadvisshannena prajapatyaya ya tkita maddhyamena yadavavrishtena ya tpura prayajebhya
    pramngaro ya tpratyagyadudann 'nukalpah homadharah vi va esha indriyena viryenardhyate | yasya rmathyamano
    na jayate | yatranya t | tata ahritya hotavya nna vindet | ajayagm hotavya m | agneyi va esha | yadaja
    | agna || ajasya tu nashniyat | yadajasya shniyat | yamevagna njuhuyat | tamadyat | tasmadajasya nashya
    nna vindet | brahmanasya dakshine haste hotavya m | esha va agni rvai ntu vasatyai naparundhyat |
    yadbra va~satya aparundhyat | yasminne mbhagadheyena vyardhayet | tasma dbrahmano vasatyai naparuddhyah
    || yadi brahmana nna vindet | darbhastabem hotavya vai darbhastabamh | agnave || yaddarbhanaddhyasita
    | yamevagna njuhuyat | tamaddhyasita | tasma ddarbha naddhyasitavyah || yadi darbhanna vindet | aphsu
    hotavya m | apo vai sarva devatah mbhavati | apastu na paricakshita | yadapah paricakshita || || ya
    mevaphsvahuti mparicakshita | tasmadapo na paricakshyah || meddhya ca va etasyameddhya ca tanuvau
    sagmsrijyete | yasya ragnayah sagmsrijyante | agnaye vivicaye purodasha nnirvapet | meddhya nca tanuvau
    vyavartayati || agnaye vratapataye purodasha nnirvapet | agnimeva vratapatigg svena bhagadheye nopadhavati
    | sa evainam || garbhagg sravantamagadamakah | agni stvashta brihaspatih | prithivya mparacaih ||
    reto va etadvajina mahitagneh | yadagnihotram | tadyathsrave sravet | garbhagg sravantama rityaha
    | reta evasmin vajina || agnirityaha | agnirvai retodhah | reta eva taddadhati | indra ityaha | indriya
    dadhati | tvashtetyaha | tvashta vai pashuna mmithunanagm rupakrit | rupamava pashushu dadhati | brihaspatirityaha
    | brahma vai devana mbrihaspatih | brahmanaivasmai prajah prajanayati || prithivya tpratishthapayati
    || nabhi prapnoti nir mparacairityaha | rakshasamapahatyai || mbrihaspatih panca ca mbrahmanasya darbhastambe
    aishtikayajamanamantrah yah purasta tprasravanti | uparishta thsarvatashca yah | tabhi rashmipavitrabhih
    | shraddham ya~jnamarabhe || deva gatuvidah | gatum ya~jnaya vindata | manasaspatina devena | vata
    dyajnah prayujyatam || tritiyasyai divah | gayatriya soma abhritah || || somapithaya sannayitum |
    vakala mantaramadade || apo devi sstha | ima patrani shundhata | upatankyaya devana m | parnavalkamuta
    shundhata || payo griheshu payo aghniyasu | payo vathseshu paya indraya havishe dhriyasva | gayatri
    parnavalkena | paya yo~ mayo bhuh | ya udyantama rohati suryamahne njyotiruttamam | shvo yajnaya ramata
    nrudranadityan | indrena saha devatah | tah purvah parigrihnami | sva ayatane manishaya ye~ pravishtah
    | tandeva nparigrihnami purvah || havyavadiha tanavahatu | paurnamasagm haviridamesha mmayi | amavasyagm
    haviridamesha 'gni pashavah | devasagm sadamagamann | ta npurvah parigrihnami | sva ayatane manishaya
    || iha praja vishvarupa ramantam | agni va~sanah | tah purvah parigrihnami || || sva ayatane manishaya
    || iha pashavo vishvarupa ramantam | agni npurvah parigrihnami | sva ayatane manishaya mpitrinamagnih
    | ava ddhavya pitribhya a | ta mpurvah parigrihnami | avisha ntvagm sabhapalah || || vijayabhagagm
    samindhatam | agne didaya me sabhya | vijityai sharadah shatam || annamavasathiya m | abhiharani sharadah
    shatam | avasathe shriya m | ahirbuddhniyo niyacchatu || idamaha shthebhyah | vasubhyo yajna mprabravimi
    | idamaha mindra jyeshthebhyah || || rudrebhyo yajna mprabravimi | idamaham jyeshthebhyah | adityebhyo
    yajna mprabravimi || payasvati roshadhayah | payasvadvirudha mpayaso yatpayah | tena mamindra sagmsrija
    || agne ncarishyami | tacchakeya ntanme raddhyatam | vayo vratapata aditya vratapate || ncarishyami
    | tacchakeya ntanme raddhyatam || ima mpracimudicim | ishamurjamabhi sagg skritam | bahuparnamashushkagram
    | harami pashupamaham || yatkrishno rupa nkritva | pravishastvam va~naspatin | tatastvamekavigmshatidha
    | sambharami susambhrita ssamidhah | yajnayuranusancaran | upavesha m | sambharami susabhrinta ||
    ya jata oshadhayah | devebhya striyuga mparva raddhyasam | paristara m | sadevagm shivamastu me ||
    || acchetta vo ma risham | jivani sharadah shatam || aparimitana mparimitah | sannahye sukritayakam
    | eno ma niga nkatamacca naham | punarutthaya bahula bhavantu || sakridacchinna mbarhirurnamridu |
    syona mpitribhyastva bharamyaham | asmi nthsidantu me pitarah somyah | pitamahah prapitamahashcanugai
    tpalashe darbhah | iya npradesha samintah | yajne pavitra mpotritamam | payo havya nkarotu me || imau
    pranapanau | yajnasyangani sarvashah | apyayayantau sancaratam | pavitre havyashodhane || pavitre
    stho vaishnavi | vayurva mpranashcapanashca | yajamana mapigacchatam | yajne hyabhuta mpotarau | pavitre
    havyashodhane || tvaya vedim vi~viduh prithivim | tvaya yajno jayate vishvadanih | acchidram ya~jnamanveshi
    vidvan | tvaya hota santanotyardhamasan || trayastrigmsho 'si tantunam | pavitrena sahagahi || ||
    shiveyagm rajjurabhidhani mupasevatam || aprasragmsaya yajnasya | ukhe upadadhamyaham | pashubhi mbibhritam
    | indraya shrita madharayann | indraya havih krinvantah | shiva shshagmo bhavasi nah || ndevapatram
    | yajnasyayushi prayujyatam | tirah pavitramatinitah | apo dharaya ma 'tiguh || devena savitrotputah
    | vaso ssuryasya rashmibhih | ga ndohapavitre rajju m | sarva patrani shundhata || eta acaranti madhumadduhanah
    | prajavati ryashaso vishvarupah || || bahvi rbhavantirupa jayamanah | iha va indro ramayatu gavah
    || pusha stha || ayakshma vah prajaya sagmsrijami | rayasposhena bahula bhavantih | urja mpayah pinvamana
    ghrita nca | jivo jivantirupa va ssadeyam || dyaushcemam mprithivi ca sanduhatam | dhata somena saha
    vatena vayuh | yajamanaya dravina mmadhumatigm suvarvida m | tadindragni jinvatagm sunritavat | ta
    mamritatve dadhatu || kamadhukshah prano bruhi | indraya havirindriyam || amum mpayo hitam || bahu
    dugdhindraya devebhyah | havya || vathsebhyo manushye bhyah | punardohaya kalpatam || yajnasya santatirasi
    | yajnasya tva santatimanusantanomi || adastamasi vishnave tva | yajnayapi dadhamyaham | adbhirariktena
    patrena | yah putah parisherate || aya || parnavalkah pavitra ssomaddhi nirmitah || imau parna nca
    | devanagm havyashodhanau | pratarveshaya gopaya | vishno havyagm hi rakshasi || ubhavagni upastrinate
    | devata upavasantu me | aha stah purvah parigrihnami yah purastadimamurjamiha praja iha pashavo mpitrinamagnih
    anuvakam aishtikayajamanamantrah deva deveshu para kramaddhvam | prathama dvitiyeshu | dvitiya stritiyeshu
    | trirekadasha iha ma 'vata | idagm shakeyam nkaromi | atma karotvatmane nkarishye bheshajam | ida
    mme vishvabheshaja | ashvina pravatam yu~vam || idamahagm senaya abhitvaryai || || mukhamapohami ||
    suryajyoti rvibhahi | mahata indriyaya || apyayata nghritayonih | agnir 'numanyatam | khamankshva
    tvacamankshva | surupa ntejasa | agnaye jushta mabhigharayami || syona || ghritasya dharaya susheva
    thsidamrite pratitishtha | vrihina mmedha sumanasyamanah || ardrah prathasnu rbhuvanasya gopah | shrita
    uthsnati janita matinam || yasta atma pashushu pravishtah | devanam vi~shthamanu yo vitasthe | atmanva
    ngaccha suvarvinda yajamanaya mahya m || ira bhutih prithivyai raso motkramit || pitarah pitaro devah
    | yo smi na tamantaremi | sva shrantam | svagm hutam | tasya me rupadrashta | vayurupashrota | adityo
    'nukhyata | dyauh pita || || prithivi mata | prajapati rbandhuh | ya evasmi sa san vi~ktha ma tva
    higmsisham | ma te tejo 'pakramit | bharatamuddhare manushinca | avadanani te pratyavadasyami | namaste
    astu ma ma higmsih || yadavadanani te 'vadyann | vilomakar || ajyena pratyanajmyenat | tatta apyayata
    mpunah || ajyayo yavamatrat | avyadha tkrityatamidam | ma rurupama yajnasya | shuddhagg svishtamidagm
    havih || manuna drishta nghritapadim | mitravarunasamiritam | dakshinardhadasabhinndann | avadya njushasva
    nah | jinva ga jinvarvatah | tasya ste bhakshivanah syama | sarvatmana ssarvaganah || braddhna pinvasva
    | dadato me ma kshayi | kurvato me mopadasat | disha nklriptirasi | disho me kalpantam | kalpanta
    shca manushishca | ahoratre me kalpetam | ardhamasa me kalpantam | masa me kalpantam | ritavo me kalpantam
    | sam va~thsaro me kalpatam | klriptirasi kalpata ''shapalebhyah | caturbhyo amrite || vidhema havisha
    vayam | bhajata mbhajamah | apaspinva | oshadhirjinva | dvipatpahi | catushpadava | divo vrishtimeraya
    | brahmanana || somyanagm somapithina m | nirbhakto bra hmanasyasti || samankta havisha ghritena |
    samadityai rvasubhi mmarudbhih | samindrena vishvebhi rdevebhiranktam | divya || indrani va vidhava
    bhuyasam | aditiriva suputra | asthuri tva gar || upanishade suprajastvaya || sa mpatni patya sukritena
    gacchatam | yajnasya yuktau dhuryavabhutam | sajannanau vijahata maratih | divi jyotiraja ramarabhetam
    || dasha te tanuvo yajna yajniyah | tah prinatu yajamano ghritena | narishthayoh prashishamidamanah
    | devana ndeva akalpayann || || urjo bhagagm shatakratu | etadva ntena prinani | tena tripyatamagmhahau
    || aha ndevanagm sukritamasmi loke | mamedamishta nna mithu rbhavati | aha vanuyajami vidvan | yada
    m || adarasridbhavata deva soma | asmin yajne maruto mridata nah | ma no vidadabhi bhamo ashastih
    || dvajana dveshya ya || rishabham va~yam | purnamasam ya~jamahe | sa no dohatagm suvirya m | rayasposhagm
    sahasrina m | pranaya suradhase | purnamasaya svaha || amavasya subhaga susheva | dhenuriva bhuya
    apyayamana | sa no dohatagm suvirya m | rayasposhagm sahasrina m | apanaya suradhase | amavasyayai
    svaha || abhistrinihi paridhehi vedi mma higmsiramuya shayana | hotrishadana harita | nishka ime yajamanasya
    braddhne || sa no dohatagm suviryagm sapta ca aishtikayajamanamantrah paristrinita paridhattagnim
    | parihito mbhunaktu | apagm rasa oshadhinagm suvarnah | nishka ime yajamanasya santu kamadughah |
    amutramushmin ~loke || bhupate bhuvanapate | mahato bhutasya pate | brahmana ntva vrinimahe || aha
    mmahato bhutasya patih || || devena savitra prasuta artvijya nkarishyami | deva savitareta ntva vrinate
    | brihaspati mmanase prabravimi | mano gayatriyai | gayatri trishtubhe bjagatyai | jagatyanushtubhe
    kpanktyai | panktih prajapataye || || prajapati rvishve bhyo devebhyah | vishve deva brihaspataye
    | brihaspati rbrahmane | brahma bhurbhuva ssuvah | brihaspati rdevana mmanushyanam | brihaspate yajna
    nkaromi | yo vo devashcarati brahmacarya m | medhavi dikshu manasa tapasvi || || antardutashcarati
    manushishu || catuh shikhanda yuvati | ghritapratika bhuvanasya maddhye | marmrijyamana mahate saubhagaya
    | mahya ndhukshva yajamanaya kaman || bhumi rbhutva mahimana mpuposha | tato devi vardhayate payagmsi
    | yajniya yajnam vi~cayanti shanca | oshadhirapa iha shakvarishca || yo ma hrida manasa yashca vaca
    || || yo brahmana karmana dveshti devah | ya shshrutena hridayeneshnata ca | tasye ndra vajrena shirashchinadmi
    || urnamridu prathamanagg syonam | devebhyo jushtagm sadanaya barhih | suvarge loke yajamanagm hi
    dhehi | ma nnakasya prishthe parame vyomann || catuh shikhanda yuvati | ghritapratika vayunani vaste
    | sa stiryamana mahate saubhagaya || || sa me dhukshva yajamanaya kaman | shiva ca me shagma caidhi
    | syona ca me sushada caidhi | urjasvati ca me payasvati caidhi | ishamurja mme pinvasva | brahma
    tejo me pinvasva | kshatramojo me pinvasva | visha mme pinvasva | ayurannadya mme pinvasva | praja
    yajna upa bhuya innu me | avikshobhaya paridhindadhami | dharta dharuno dhariyan | agni rdveshagmsi
    nirito nudatai || vicchinadmi vidhritibhyagm sapatnan | jata ye ca janishyamanah | visho yantrabhyam
    vi~dhamamyenan | ahagg 'sani devah | visho yantre nudamane aratim | vishva || sidanti devi sukritasya
    loke | dhriti stho vidhriti svadhriti | prananmayi dharayatam | praja mmayi dharayatam | pashunmayi
    dharayatam || aya mprastara ubhayasya dharta | dharta prayajana m | sa dadhara samidho vishvarupah
    | tasmin thsruco addhyasadayami || aroha patho juhu devayanan || shayah prathamaja ye puranah | hiranyapaksha
    'jira sambhritanga | vahasi ma sukritam ya~tra lokah || avaha mbadha upabhrita sapatnan | jata ye
    ca janishyamanah | dohai yajnagm sudughamiva dhenum | ahamuttaro bhuyasam | adhare mathsapatnah ||
    yo ma vaca manasa durmarayuh | hrida || idamasya cittamadhara | ahamuttaro bhuyasam | adhare mathsapatnah
    'si shakvarah | ghritacinagm sunuh | priyena namna priye sadasi sida || syono me sida sushadah prithivyam
    | prathayi prajaya pashubhih suvarge loke | divi sida prithivya mantarikshe | ahamuttaro bhuyasam
    || || adhare mathsapatnah sthali ghritasya purna | acchinnapaya shshatadhara uthsah | marutena sharmana
    daivyena || yajno 'si sarvatah shritah | sarvato ma mme santvashishah | sahasra | prajapatirasi sarvatah
    shritah || mme santvashishah | sahasra m | anenendraya pashavo 'cikithsann | tena deva avatopa mam
    | iheshamurjam ssaha ojah saneyam | shrita mmadhu vajinivat | yeno nmahendram | dadhi ma manvavindat
    | guha sati ngahane gahvareshu | sa vindatu yajamanaya lokam | acchidram mbhurikarma karotu || ayam
    ssamasadaddhavishman | rica samna yajusha devatabhih || thsuryavato jayema | indrasya sakhya mashyam
    || yo nah kaniya iha kamayatai | asmin yajne yajamanaya mahya m | apa tamindragni bhuvanannudetam
    | aha vi~deya || agne vajajit | vaja || vajajityayai samma rjmi | agnimanna damannadyaya || upahuto
    dyauh pita | upa ma ndyauh pita hvayatam | agni ddhrat | ayushe varcase | jivatvai punyaya | upahuta
    prithivi mata | upa ma mmata prithivi hvayatam | agni || ayushe varcase | jivatvai punyaya || mano
    jyoti rjushatamajya ndadhatu | brihaspati nnah | vishve deva iha madayantam || ya nte agna avrishcami
    | aham kshipitashcarann | praja nca | nicairdeva nivrishcata || 'bhidasati | samano yashca nishtyah
    | iddhmasyeva prakshayatah | ma tasyoccheshi kincana | yo ma ndveshti jatavedah | ya ndveshmi yashca
    mam | sarvagstanagne sandaha | yag ndveshmi ye ca mam || agne vajajit | vaja m | vajajityayai samma
    mannadyaya || vedi rbarahi shshritagm havih | iddhmah paridhaya ya~jna rico yajuh | yajya mme sannatayo
    namantam | iddhmasam 'vatatah | prithivya addhyutthitah | tena sahasrakandena | dvishantagm shocayamasi
    | dvishanme bahu shocatu | oshadhe mo ahagm shucam || yajna namaste yajna | namo namashca te yajna
