id: ashtavakra-gita-chapter-3
category: stotram
name:
  english: Ashtavakra Gita Chapter 3
content:
  english: ashtavakra uvaca || avinashinamatmanamekam vijnaya tattvatah | tavatmajnanasya dhirasya kathamartharjane
    ratih || || atmajnanadaho pritirvishayabhramagocare | shukterajnanato lobho yatha rajatavibhrame ||
    || vishvam sphurati yatredam taranga iva sagare | so'hamasmiti vijnaya kim dina iva dhavasi || ||
    shrutvapi shuddhacaitanya atmanamatisundaram | upasthe'tyantasamsakto malinyamadhigacchati || || sarvabhuteshu
    catmanam sarvabhutani catmani | munerjanata ashcaryam mamatvamanuvartate || || asthitah paramadvaitam
    moksharthe'pi vyavasthitah | ashcaryam kamavashago vikalah kelishikshaya || || udbhutam jnanadurmitramavadharyatidurbalah
    | ashcaryam kamamakankshet kalamantamanushritah || || ihamutra viraktasya nityanityavivekinah | ashcaryam
    mokshakamasya mokshad eva vibhishika || || dhirastu bhojyamano'pi pidyamano'pi sarvada | atmanam kevalam
    pashyan na tushyati na kupyati || || ceshtamanam shariram svam pashyatyanyashariravat | samstave capi
    nindayam katham kshubhyet mahashayah || || mayamatramidam vishvam pashyan vigatakautukah | api sannihite
    mrityau katham trasyati dhiradhih || || nihspriham manasam yasya nairashye'pi mahatmanah | tasyatmajnanatriptasya
    tulana kena jayate || || svabhavad eva janano drishyametanna kincana | idam grahyamidam tyajyam sa
    kim pashyati dhiradhih || || antastyaktakashayasya nirdvandvasya nirashishah | yadricchayagato bhogo
    na duhkhaya na tushtaye ||
  devanagari: अष्टावक्र उवाच ॥ अविनाशिनमात्मानमेकं विज्ञाय तत्त्वतः । तवात्मज्ञानस्य धीरस्य कथमर्थार्जने
    रतिः ॥ ॥ आत्माज्ञानादहो प्रीतिर्विषयभ्रमगोचरे । शुक्तेरज्ञानतो लोभो यथा रजतविभ्रमे ॥ ॥ विश्वं स्फुरति
    यत्रेदं तरङ्गा इव सागरे । सोऽहमस्मीति विज्ञाय किं दीन इव धावसि ॥ ॥ श्रुत्वापि शुद्धचैतन्य आत्मानमतिसुन्दरम्
    । उपस्थेऽत्यन्तसंसक्तो मालिन्यमधिगच्छति ॥ ॥ सर्वभूतेषु चात्मानं सर्वभूतानि चात्मनि । मुनेर्जानत आश्चर्यं
    ममत्वमनुवर्तते ॥ ॥ आस्थितः परमाद्वैतं मोक्षार्थेऽपि व्यवस्थितः । आश्चर्यं कामवशगो विकलः केलिशिक्षया
    ॥ ॥ उद्भूतं ज्ञानदुर्मित्रमवधार्यातिदुर्बलः । आश्चर्यं काममाकाङ्क्षेत् कालमन्तमनुश्रितः ॥ ॥ इहामुत्र
    विरक्तस्य नित्यानित्यविवेकिनः । आश्चर्यं मोक्षकामस्य मोक्षाद् एव विभीषिका ॥ ॥ धीरस्तु भोज्यमानोऽपि
    पीड्यमानोऽपि सर्वदा । आत्मानं केवलं पश्यन् न तुष्यति न कुप्यति ॥ ॥ चेष्टमानं शरीरं स्वं पश्यत्यन्यशरीरवत्
    । संस्तवे चापि निन्दायां कथं क्षुभ्येत् महाशयः ॥ ॥ मायामात्रमिदं विश्वं पश्यन् विगतकौतुकः । अपि सन्निहिते
    मृत्यौ कथं त्रस्यति धीरधीः ॥ ॥ निःस्पृहं मानसं यस्य नैराश्येऽपि महात्मनः । तस्यात्मज्ञानतृप्तस्य तुलना
    केन जायते ॥ ॥ स्वभावाद् एव जानानो दृश्यमेतन्न किञ्चन । इदं ग्राह्यमिदं त्याज्यं स किं पश्यति धीरधीः
    ॥ ॥ अन्तस्त्यक्तकषायस्य निर्द्वन्द्वस्य निराशिषः । यदृच्छयागतो भोगो न दुःखाय न तुष्टये ॥
