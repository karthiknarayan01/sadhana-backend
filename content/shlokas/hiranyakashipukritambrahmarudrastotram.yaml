id: hiranyakashipukritambrahmarudrastotram
category: stotram
name:
  english: hiranyakashipukritambrahmarudrastotram
  devanagari: हिरण्यकशिपुकृतंब्रह्मरुद्रस्तोत्रम्
content:
  english: hiranyakashipukritam brahmarudrastotram rudrah praha tada daityam kim te manasi rocate || 71||
    yadartham tapa atishtho vrinu varandadamyaham | shrutva drishtva ca varadam natva gadgadaya gira ||
    72|| namah sarvadhibhutaya sarvantaryamine namah | tapahphalapradatre te brahmane shambhave namah
    || 73|| namo'stu janakaya'trabhavate kashyapaya ca | namo maricaye tadvat sarvarshibhyo namo namah
    || 74|| sarve shubhapradataro bhavantu mama sarvada | yadi deya vara mahyam patram caham mato'smi
    vah || 75|| sura'suramanushyanam gandharvoragarakshasam | pashupakshimriganam ca siddhanam ca mahatmanam
    || 76|| yakshavidyadharanam codbhijjanam kinnaratmanam | kimpumsam sarvaroganam mantryayudhastrayantrinam
    || 77|| sarvesham dattashapanamavadhyatvam ca me bhavet | na'ntarbahirna divase na ratrau cijjadairna
    ca || 78|| na prithvyam na'mbare mrityurmama syadajasrishtitah | yuddhe ca'pratidvandvatvamaikapatyam
    ca dehinam || 79|| sarvesham lokapalanamishvaratvamakhanditam | tapoyogaprabhavanamavinasho mamastviti
    || 80|| ityete tu varah sveshta diyantam pitribhishca me | brahmajnaya tada rudrah praha shishyam
    tapasvinam || 81|| shishya caite varah janmavatam tu durlabhah sada | tathapi vitaramo'dya kah srishtau
    shashvato janah || 82|| iti dattva varan rudrabrahmadyah ketanam yayuh | hiranyakashipushcapi nivavrite
    tapahsthalat || 83|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 135
  devanagari: हिरण्यकशिपुकृतं ब्रह्मरुद्रस्तोत्रम् रुद्रः प्राह तदा दैत्यं किं ते मनसि रोचते ॥ ७१॥ यदर्थं
    तप आतिष्ठो वृणु वरान्ददाम्यहम् । श्रुत्वा दृष्ट्वा च वरदं नत्वा गद्गदया गिरा ॥ ७२॥ नमः सर्वाधिभूताय
    सर्वान्तर्यामिणे नमः । तपःफलप्रदात्रे ते ब्रह्मणे शम्भवे नमः ॥ ७३॥ नमोऽस्तु जनकायाऽत्रभवते कश्यपाय
    च । नमो मरीचये तद्वत् सर्वर्षिभ्यो नमो नमः ॥ ७४॥ सर्वे शुभप्रदातारो भवन्तु मम सर्वदा । यदि देया वरा
    मह्यं पात्रं चाहं मतोऽस्मि वः ॥ ७५॥ सुराऽसुरमनुष्याणां गन्धर्वोरगरक्षसाम् । पशुपक्षिमृगाणां च सिद्धानां
    च महात्मनाम् ॥ ७६॥ यक्षविद्याधराणां चोद्भिज्जानां किन्नरात्मनाम् । किम्पुंसां सर्वरोगाणां मन्त्र्यायुधास्त्रयन्त्रिणाम्
    ॥ ७७॥ सर्वेषां दत्तशापानामवध्यत्वं च मे भवेत् । नाऽन्तर्बहिर्न दिवसे न रात्रौ चिज्जडैर्न च ॥ ७८॥ न
    पृथ्व्यां नाऽम्बरे मृत्युर्मम स्यादजसृष्टितः । युद्धे चाऽप्रतिद्वन्द्वत्वमैकपत्यं च देहिनाम् ॥ ७९॥
    सर्वेषां लोकपालानामीश्वरत्वमखण्डितम् । तपोयोगप्रभावाणामविनाशो ममास्त्विति ॥ ८०॥ इत्येते तु वराः स्वेष्टा
    दीयन्तां पितृभिश्च मे । ब्रह्माज्ञया तदा रुद्रः प्राह शिष्यं तपस्विनम् ॥ ८१॥ शिष्य चैते वराः जन्मवतां
    तु दुर्लभाः सदा । तथापि वितरामोऽद्य कः सृष्टौ शाश्वतो जनः ॥ ८२॥ इति दत्त्वा वरान् रुद्रब्रह्माद्याः
    केतनं ययुः । हिरण्यकशिपुश्चापि निववृते तपःस्थलात् ॥ ८३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    १३५
