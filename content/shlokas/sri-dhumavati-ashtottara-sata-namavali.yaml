id: sri-dhumavati-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Dhumavati Ashtottara Sata Namavali
content:
  english: om dhumavatyai namah | om dhumravarnayai namah | om dhumrapanaparayanayai namah | om dhumrakshamathinyai
    namah | om dhanyayai namah | om dhanyasthananivasinyai namah | om aghoracarasantushtayai namah | om
    aghoracaramanditayai namah | om aghoramantrasampritayai namah | om aghoramantrapujitayai namah | |
    om attattahasaniratayai namah | om malinambaradharinyai namah | om vriddhayai namah | om virupayai
    namah | om vidhavayai namah | om vidyayai namah | om viraladvijayai namah | om pravriddhaghonayai
    namah | om kumukhyai namah | om kutilayai namah | | om kutilekshanayai namah | om karalyai namah |
    om karalasyayai namah | om kankalyai namah | om shurpadharinyai namah | om kakadhvajaratharudhayai
    namah | om kevalayai namah | om kathinayai namah | om kuhve namah | om kshutpipasarditayai namah |
    | om nityayai namah | om lalajjihvayai namah | om digambaryai namah | om dirghodaryai namah | om dirgharavayai
    namah | om dirghangyai namah | om dirghamastakayai namah | om vimuktakuntalayai namah | om kirtyayai
    namah | om kailasasthanavasinyai namah | | om krurayai namah | om kalasvarupayai namah | om kalacakrapravartinyai
    namah | om vivarnayai namah | om cancalayai namah | om dushtayai namah | om dushtavidhvamsakarinyai
    namah | om candyai namah | om candasvarupayai namah | om camundayai namah | | om candanihsvanayai
    namah | om candavegayai namah | om candagatyai namah | om candavinashinyai namah | om mundavinashinyai
    namah | om candalinyai namah | om citrarekhayai namah | om citrangyai namah | om citrarupinyai namah
    | om krishnayai namah | | om kapardinyai namah | om kullayai namah | om krishnarupayai namah | om
    kriyavatyai namah | om kumbhastanyai namah | om mahonmattayai namah | om madirapanavihvalayai namah
    | om caturbhujayai namah | om lalajjihvayai namah | om shatrusamharakarinyai namah | | om shavarudhayai
    namah | om shavagatayai namah | om shmashanasthanavasinyai namah | om duraradhyayai namah | om duracarayai
    namah | om durjanapritidayinyai namah | om nirmamsayai namah | om nirakarayai namah | om dhumahastayai
    namah | om varanvitayai namah | | om kalahayai namah | om kalipritayai namah | om kalikalmashanashinyai
    namah | om mahakalasvarupayai namah | om mahakalaprapujitayai namah | om mahadevapriyayai namah |
    om medhayai namah | om mahasankatanashinyai namah | om bhaktapriyayai namah | om bhaktagatyai namah
    | | om bhaktashatruvinashinyai namah | om bhairavyai namah | om bhuvanayai namah | om bhimayai namah
    | om bharatyai namah | om bhuvanatmikayai namah | om bherundayai namah | om bhimanayanayai namah |
    om trinetrayai namah | om bahurupinyai namah | | om trilokeshyai namah | om trikalajnayai namah |
    om trisvarupayai namah | om trayitanave namah | om trimurtyai namah | om tanvyai namah | om trishaktaye
    namah | om trishulinyai namah |
  devanagari: ॐ धूमावत्यै नमः । ॐ धूम्रवर्णायै नमः । ॐ धूम्रपानपरायणायै नमः । ॐ धूम्राक्षमथिन्यै नमः ।
    ॐ धन्यायै नमः । ॐ धन्यस्थाननिवासिन्यै नमः । ॐ अघोराचारसन्तुष्टायै नमः । ॐ अघोराचारमण्डितायै नमः ।
    ॐ अघोरमन्त्रसम्प्रीतायै नमः । ॐ अघोरमन्त्रपूजितायै नमः । । ॐ अट्टाट्टहासनिरतायै नमः । ॐ मलिनाम्बरधारिण्यै
    नमः । ॐ वृद्धायै नमः । ॐ विरूपायै नमः । ॐ विधवायै नमः । ॐ विद्यायै नमः । ॐ विरलाद्विजायै नमः । ॐ प्रवृद्धघोणायै
    नमः । ॐ कुमुख्यै नमः । ॐ कुटिलायै नमः । । ॐ कुटिलेक्षणायै नमः । ॐ कराल्यै नमः । ॐ करालास्यायै नमः
    । ॐ कङ्काल्यै नमः । ॐ शूर्पधारिण्यै नमः । ॐ काकध्वजरथारूढायै नमः । ॐ केवलायै नमः । ॐ कठिनायै नमः ।
    ॐ कुह्वे नमः । ॐ क्षुत्पिपासार्दितायै नमः । । ॐ नित्यायै नमः । ॐ ललज्जिह्वायै नमः । ॐ दिगम्बर्यै नमः
    । ॐ दीर्घोदर्यै नमः । ॐ दीर्घरवायै नमः । ॐ दीर्घाङ्ग्यै नमः । ॐ दीर्घमस्तकायै नमः । ॐ विमुक्तकुन्तलायै
    नमः । ॐ कीर्त्यायै नमः । ॐ कैलासस्थानवासिन्यै नमः । । ॐ क्रूरायै नमः । ॐ कालस्वरूपायै नमः । ॐ कालचक्रप्रवर्तिन्यै
    नमः । ॐ विवर्णायै नमः । ॐ चञ्चलायै नमः । ॐ दुष्टायै नमः । ॐ दुष्टविध्वंसकारिण्यै नमः । ॐ चण्ड्यै नमः
    । ॐ चण्डस्वरूपायै नमः । ॐ चामुण्डायै नमः । । ॐ चण्डनिःस्वनायै नमः । ॐ चण्डवेगायै नमः । ॐ चण्डगत्यै
    नमः । ॐ चण्डविनाशिन्यै नमः । ॐ मुण्डविनाशिन्यै नमः । ॐ चाण्डालिन्यै नमः । ॐ चित्ररेखायै नमः । ॐ चित्राङ्ग्यै
    नमः । ॐ चित्ररूपिण्यै नमः । ॐ कृष्णायै नमः । । ॐ कपर्दिन्यै नमः । ॐ कुल्लायै नमः । ॐ कृष्णरूपायै नमः
    । ॐ क्रियावत्यै नमः । ॐ कुम्भस्तन्यै नमः । ॐ महोन्मत्तायै नमः । ॐ मदिरापानविह्वलायै नमः । ॐ चतुर्भुजायै
    नमः । ॐ ललज्जिह्वायै नमः । ॐ शत्रुसंहारकारिण्यै नमः । । ॐ शवारूढायै नमः । ॐ शवगतायै नमः । ॐ श्मशानस्थानवासिन्यै
    नमः । ॐ दुराराध्यायै नमः । ॐ दुराचारायै नमः । ॐ दुर्जनप्रीतिदायिन्यै नमः । ॐ निर्मांसायै नमः । ॐ निराकारायै
    नमः । ॐ धूमहस्तायै नमः । ॐ वरान्वितायै नमः । । ॐ कलहायै नमः । ॐ कलिप्रीतायै नमः । ॐ कलिकल्मषनाशिन्यै
    नमः । ॐ महाकालस्वरूपायै नमः । ॐ महाकालप्रपूजितायै नमः । ॐ महादेवप्रियायै नमः । ॐ मेधायै नमः । ॐ महासङ्कटनाशिन्यै
    नमः । ॐ भक्तप्रियायै नमः । ॐ भक्तगत्यै नमः । । ॐ भक्तशत्रुविनाशिन्यै नमः । ॐ भैरव्यै नमः । ॐ भुवनायै
    नमः । ॐ भीमायै नमः । ॐ भारत्यै नमः । ॐ भुवनात्मिकायै नमः । ॐ भेरुण्डायै नमः । ॐ भीमनयनायै नमः । ॐ
    त्रिनेत्रायै नमः । ॐ बहुरूपिण्यै नमः । । ॐ त्रिलोकेश्यै नमः । ॐ त्रिकालज्ञायै नमः । ॐ त्रिस्वरूपायै
    नमः । ॐ त्रयीतनवे नमः । ॐ त्रिमूर्त्यै नमः । ॐ तन्व्यै नमः । ॐ त्रिशक्तये नमः । ॐ त्रिशूलिन्यै नमः
    ।
