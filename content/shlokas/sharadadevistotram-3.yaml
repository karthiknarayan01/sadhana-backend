id: sharadadevistotram-3
category: stotram
name:
  english: sharadadevistotram 3
  devanagari: शारदादेवीस्तोत्रम् ३
content:
  english: ranantaviryam shashisuryanetram | abrahmalokah pranamanti yam tam namamyaham sharadasharadambam
    || 4|| devim hi shambhoh paramasya vishnoh priyam ca sitam raghunandanasya | shri sharadam va avataramukhya
    shri ramakrishnasya namami bhuyah || 5|| byaikshanta siddha stava shaktimantram tejomayam yam hi tapobhirugraih
    | tameva nrinam bhava mokshasetum jane tu naham sharanagataste || 6|| naktandivam yad yatayo'pi devah
    siddhadisanghastava padapadmam | dhyayanti gayanti namanti nityam divyam padam tadvinayena yace ||
    7|| mohandhakare'ti mamatvagarte bhrashto'smi matah paripahi mam tvam | shri ramakrishna
  devanagari: रनन्तवीर्यां शशिसूर्यनेत्राम् । आब्रह्मलोकाः प्रणमन्ति यां तां नमाम्यहं शारदशारदाम्बाम्
    ॥ ४॥ देवीं हि शम्भोः परमस्य विष्णोः प्रियां च सीतां रघुनन्दनस्य । श्री शारदां वा अवतारमुख्य श्री रामकृष्णस्य
    नमामि भूयः ॥ ५॥ ब्यैक्षन्त सिद्धा स्तव शक्तिमन्त्रं तेजोमयं यं हि तपोभिरुग्रैः । तमेव नृणां भव मोक्षसेतुं
    जाने तु नाहं शरणागतस्ते ॥ ६॥ नक्तन्दिवं यद् यतयोऽपि देवाः सिद्धादिसङ्घास्तव पादपद्मम् । ध्यायन्ति
    गायन्ति नमन्ति नित्यं दिव्यं पदं तद्विनयेन याचे ॥ ७॥ मोहान्धकारेऽति ममत्वगर्ते भ्रष्टोऽस्मि मातः परिपाहि
    मां त्वम् । श्री रामकृष्ण
