id: durlabhopanishadstotram
category: stotram
name:
  english: durlabhopanishadstotram
  devanagari: दुर्लभोपनिषद्स्तोत्रम्
content:
  english: durlabhopanishadstotram gururvai sadam purna madaiva tulyam prano badaryai vahitam sadaiva
    | cintyam vicintyam bhavamekarupam gururvai sharanyam gururvai sharanyam || 1|| gururvai prapanna
    mahitam vadaivam atyorvatam vai prahitam sadaiva | devotvameva bhavatam sahi cintyarupam gururvai
    sharanyam gururvai sharanyam || 2|| satam vai sadanam dehalayovai pratorbhavevai sahitam na dirghayai
    | purnatam param purna madaiva rupam gururvai sharanyam gururvai sharanyam || 3|| adoyam vadevam cintyam
    sahetam purvottarupam caranam sadaiyam | atmo satam purna madaiva cintyam gururvai sharanyam gururvai
    sharanyam || 4|| caitanyarupam aparam sadaiva pranodavevam caranam sadaiva | satirtho sadaivam bhavatam
    vadaiva gururvai sharanyam gururvai sharanyam || 5|| caitanyarupam bhavatam sadaiva jnanocchvasam
    sahitam tadaiva | devottham purna madaiva shaktim gururvai sharanyam gururvai sharanyam || 6|| na
    tato vatanyai na matam na bhratam na deho vadanyai patnirvatevam | na janami vittim na vritam na rupam
    gururvai sharanyam gururvai sharanyam || 7|| tvadiyam tvadeyam bhavatvam bhaveyam cintyam vicintyam
    sahitam sadaiva | atonavatam bhavameka nityam gururvai sharanyam gururvai sharanyam || 8|| iti durlabhopanishadstotram
    sampurnam |
  devanagari: दुर्लभोपनिषद्स्तोत्रम् गुरुर्वै सदां पूर्ण मदैव तुल्यं प्राणो बदार्यै वहितं सदैव । चिन्त्यं
    विचिन्त्यं भवमेकरूपं गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ १॥ गुरुर्वै प्रपन्ना महितं वदैवं अत्योर्वतां
    वै प्रहितं सदैव । देवोत्वमेव भवतं सहि चिन्त्यरूपं गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ २॥ सतं वै सदानं
    देहालयोवै प्रातोर्भवेवै सहितं न दीर्घयै । पूर्णतं परां पूर्ण मदैव रूपं गुरुर्वै शरण्यं गुरुर्वै शरण्यम्
    ॥ ३॥ अदोयं वदेवं चिन्त्यं सहेतं पूर्वोत्तरूपं चरणं सदैयम् । आत्मो सतां पूर्ण मदैव चिन्त्यं गुरुर्वै
    शरण्यं गुरुर्वै शरण्यम् ॥ ४॥ चैतन्यरूपं अपरं सदैव प्राणोदवेवं चरणं सदैव । सतीर्थो सदैवं भवतं वदैव
    गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ ५॥ चैतन्यरूपं भवतं सदैव ज्ञानोच्छ्वासं सहितं तदैव । देवोत्थां पूर्ण
    मदैव शक्तीं गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ ६॥ न तातो वतान्यै न मातं न भ्रातं न देहो वदान्यै पत्निर्वतेवम्
    । न जानामि वित्तीं न व्रितं न रूपं गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ ७॥ त्वदीयं त्वदेयं भवत्वं भवेयं
    चिन्त्यं विचिन्त्यं सहितं सदैव । आतोनवातं भवमेक नित्यं गुरुर्वै शरण्यं गुरुर्वै शरण्यम् ॥ ८॥ इति दुर्लभोपनिषद्स्तोत्रं
    सम्पूर्णम् ।
