  devanagari: ॐ नमो भगवते श्री रमणाय अरुणाचल अक्षर मणिमाल अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला
    अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला अरुणाचल मनुचु स्मरियिञ्चुवारल अहमु निर्मूलिम्पु अरुणाचला
    अलगु सुन्दरमुल वलॆ चेरि नेनु नी वुन्दमभिन्नमै अरुणाचला लोदूरि लागि नी लोगुहनु चॆरगा अनुमरिञ्चि तेमॊको
    अरुणाचला ऎवरिकिगा नन्नु एलिति विडिचिन अखिलमु निन्दिञ्चु अरुणाचला ई निन्द तप्पु निन्नेटिकि दलपिञ्चितिक
    विडुवारॆवररु अरुणाचला कनिन जननि कन्न घनदयादायका इदिया यनुग्रहमु अरुणाचला निन्नेमार्चि यरुगनीक युल्लमु
    पैनि नुरुदिगा नुण्डुमा अरुणाचला ऊरूरु तिरुगक युल्लमु निनु गनि यणग नी द्युति जूपुमु अरुणाचला ननु चॆरचि
    यिपुडु ननु कलियक विडुटिदि मगतन मॊक्कॊया अरुणाचला एटि की निदुर नन्नितरुलु लागग इदि नीकु न्यायमा अरुणाचला
    पञ्चेन्द्रिय खलुलु मदिलोन दूरुचो मदिनि नीवुन्दवो अरुणाचला ऒकडवौ निनु माय मॊनरिञ्चि वच्चुवारॆवरिदि
    नी जालमु अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव
    अरुणाचला ओङ्कार वाक्यार्ध युत्तम समहीन निन्नॆवरॆरुगुवारु अरुणाचला अव्वबोलॆ नॊसगि नाकु नी करुण नन्नेलुट
    नी भारमु अरुणाचला कन्नुकु गन्नयि कन्नुलेक कनु निनु कनुवारॆवरुगनुमु अरुणाचला इनुमु आयस्कान्तमु वलॆ
    गविसि ननु विडुवक कलसि नातोनुण्डुमु अरुणाचला गिरि रूप मैनट्टि करुणा समुद्रमा कृप चेसि नन्नेलुं अरुणाचला
    क्रिन्द मीदॆटनु चॆन्नॊन्दु किरणमणि ना क्रिन्दु गति मापु अरुणाचला कुट्र यन्तयु गोसि गुणमुग बालिञ्चु
    गुरु रूपमै वॆलुगु अरुणाचला कूचि वाल्गन्नुल कोतबडक कृप चेसि नन् चेरि कावुं अरुणाचला वञ्चका वेडियुन्
    गॊञ्चॆमुन् गरगवे अभय मञ्चेलुमा अरुणाचला अडुगकिच्चॆडु नीदु नकलङ्क मगु कीर्ति हानि सेयक ब्रोवु अरुणाचला
    हस्तलमलक नीदु सद्रसमुन सुखोन्माद मॊन्दग नेलु अरुणाचला वल नुञ्चि भक्तुल परिमार्चु निनु गट्टुकॊनि यॆट्लु
    जीविन्तुनु अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव
    अरुणाचला कोपरहित गुण गुरिगाग ननु गॊनु कॊरयेमि चेसिति अरुणाचला गौतम पूजित करुणा घन नगमा कड गण्ट एलुमा
    अरुणाचला सकलमु कबलिञ्चु करकान्तियिन मनो जलज मरल्पुमा अरुणाचला तिण्डिनि निन्जेरितिनि तिन ना नेनु शान्तमै
    पोवुदुनु अरुणाचला मदि चल्लपड भद्रकर मुञ्चि यमृतनोर् तॆरु मनुग्रहचन्द्र अरुणाचला वन्नॆनु चॆरचि निर्वाण
    मॊनर्चि कृपावन्नॆ निडि ब्रोवुमरुणाचला सुख समुद्रमु पॊङ्ग वाक् मनम्मुलडङ्ग नूरक नमरु मन्दरुणाचला वञ्चिन्तुवेल
    नन् शोधिम्पकिक नीदु ज्योति रूपमु चूपुं अरुणाचला परविद्य गरपि यी भूमि मैकमु वीडि रूपगु विद्य जूपु अरुणाचला
    चेरकुन्ननु मेनु नीरुग गरगि कन्नीटेरयि नशिन्तु अरुणाचला छी यनि द्रोसिन चेयु कर्म तपन गाकेदि मनु मारं
    अरुणाचला चॆप्पक चॆपि नीवु मौनत नुण्डनि यूरक युन्दुवे अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव
    अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला सोमरि नैतिनि मिन्ननि सुख निद्र कन्न वेरॆदि गति
    अरुणाचला शौर्यमु जूपिति शमियिञ्चॆ ननि माय चलियि प कुन्नावु अरुणाचला कुक्ककु न्नीचमे नेने गुरुतुगॊनि
    वॆदकि निन्जेरुदु अरुणाचला ज्ञानमु लेक नी यास दैन्यमु बाप ज्ञानमु दॆल्पि ब्रोवुमरुणाचला तेटि वलॆनु
    नीवु विकसिम्प लेदनि यॆदुट निलुतुवेल अरुणाचला तत्व मॆरुगजाल नन्तयै निलुतुवे यिदियेमि तत्वमो अरुणाचला
    ता नेनु ताननु तत्व मिद्दानिनि तानुगा चूपिन्तु अरुणाचला त्रिप्पि यहन्तनु नॆप्पुडु लो द्रुष्टि गन दॆलियु
    ननुनदे अरुणाचला तीरमुण्डनि यॆद वॆदकियु निन्नु ने तिरिगि पॊन्दिति ब्रोवु मरुणाचला सत्य ज्ञानमु लेनि
    यी जन्म फलमेमि यॊप्पग रावेल अरुणाचला शुद्ध वाङ्ग्मन युतुलं दोचु नी निजा हन्त गल्पि ननु ब्रोवु अरुणाचला
    दैव मनुचु निन्नु दरिचेरगा नन्नु पूर्ण नाश मॊनर्चिति अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला
    अरुणाचल शिव अरुणाचल शिव अरुणाचल शिव अरुणाचला वॆदुकक गनिन सच्च्रीयनुग्रहनिधि मदि तॆगुल् तीर्चि ब्रोवु
    अरुणाचला धैर्यमु परुगिडु नी निजहमरय ने नाशमैति ब्रोवु अरुणाचला ताकि कृपाकरमु ननु गलियकुन्न निजमु नशिन्तु
    ब्रोवु अरुणाचला दोषरहित नीवु नातो नैक्यमयि नित्यानन्द मयमोनर्परुणाचला नगकु नॆडमुकादु निन्वॆदकिन नन्नु
    गनु कृपानग वेसि अरुणाचला नान लेदॆ वॆदुक नेनयि नी वॊण्टि स्थाणुवै निलिचितिवि अरुणाचला नी ज्वाल गाल्चिनन्
    नीरु सेसॆडु मुन्नॆ नी कृप वर्षिम्पु अरुणाचला नीवु ने नणग नित्यानन्दमयमुगा निलुचु स्थिति करुणि पु अरुणाचला
    अणुरूपु निन्नु ने मिन्नु रूपुं चेर भावोर्मुलॆपुडागु अरुणाचला सूत्र ज्ञानमु लेनि पामरु ना माया ज्ञानमु
    कोसिकावु अरुणाचला मक्कि मक्कि करगि ने निन्नु शरणन्द नग्नुडवै निल्चिति अरुणाचला नेस्तमुण्डनि नाकु नी
    याश चूपिनन् मोसगिम्पक ब्रोवु अरुणाचला अरुणाचल शिव अरुणाचल शिव अरुणाचल
