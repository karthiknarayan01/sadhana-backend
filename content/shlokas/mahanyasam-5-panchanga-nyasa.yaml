id: mahanyasam-5-panchanga-nyasa
category: stotram
name:
  english: Mahanyasam - 5. Panchanga Nyasa
content:
  english: mprapadyami sadyo jataya vai namo namah | bhave bhave natibhave bhavasva mam | bhavo dbhavaya
    namah || padabhya jyeshthaya namah shreshthaya namo rudraya namah kalaya namah kalavikaranaya namo
    balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya namo manonmanaya namah |
    urumadhyamabhya bhyo ghoraghoratarebhyah | sarve bhyo namaste astu rudrarupebhyah || hridayaya namah
    | tatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodaya mishvarasarva bhutanam brahmadhipati
    rbrahma shivo me astu sadashivom || murdhne namah |
  devanagari: म्प्र॑पद्या॒मि॒ स॒द्यो जा॒ताय॒ वै नमो॒ नमः॑ । भ॒वे भ॑वे॒ नाति॑भवे भवस्व॒ माम् । भ॒वो द्भ॑वाय॒
    नमः॑ ॥ पादाभ्या ज्ये॒ष्ठाय॒ नमः॑ श्रे॒ष्ठाय॒ नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒ नमः॒ कल॑विकरणाय॒ नमो॒ बल॑विकरणाय॒
    नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒ नम॒ स्सर्व॑भूतदमनाय॒ नमो॑ म॒नोन्म॑नाय॒ नमः॑ । ऊरुमध्यमाभ्या भ्यो॒ घोर॒घोर॑तरेभ्यः
    । सर्वे भ्यो॒ नम॑स्ते अस्तु रु॒द्ररू॑पेभ्यः ॥ हृदयाय नमः । तत्पुरु॑षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि
    । तन्नो॑ रुद्रः प्रचो॒दया मीश्वरसर्व॑ भूता॒नां॒ ब्रह्माधि॑पति॒ र्ब्रह्मा॑ शि॒वो मे॑ अस्तु सदाशि॒वोम्
    ॥ मूर्ध्ने नमः ।
