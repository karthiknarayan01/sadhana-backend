id: rudrakavacam-2
category: kavacha
name:
  english: rudrakavacam 2
  devanagari: रुद्रकवचम् २
content:
  english: sarvarthasadhane viniyogah | rudro mamagratah patu prishthatah patu shankarah | kapardi dakshine
    patu vamaparshve tatha harah || 2|| shivah shirasi mam patu lalate nilalohitah | netram me tryambakah
    patu bahuyugmam maheshvarah || 3|| hridaye ca mahadeva ishvarashca tathodare | nabhau kukshau katisthane
    padau patu maheshvarah || 4|| sarvam rakshatu bhuteshah sarvagatrani me harah | pasham shulanca divyastram
    khadgam vajram tathaiva ca || 5|| namaskaromi bhutesha raksha mam jagadishvara | papebhyo narakebhyashca
    trahi mam bhaktavatsala || 6|| janmamrityujaravyadhikamakrodhadapi prabho | lobhamohanmahadeva raksha
    mam tridasheshvara || 7|| tvam gatistvam matishcaiva tvam bhumistvam parayanah | kayena manasa vaca
    tvayi bhaktirdridhastu me || 8|| phalashrutih | ityetadrudrakavacam pathanatpapanashanam | mahadevaprasadena
    bhairavena ca kirtitam || 9|| na tasya papam deheshu na bhayam tasya vidyate | prapnoti sukhamarogyam
    putramayuh pravarddhanam || 10|| putrarthi labhate putrandhanarthi dhanamapnuyat | vidyarthi labhate
    vidyam moksharthi mokshameva ca || 11|| vyadhito mucyate rogadbaddho mucyeta bandhanat | brahmahatyadi
    papam ca pathanadeva nashyati || 12|| iti kriyoddishe mahatantraraje devishvarasamvade rudrakavacam
    samaptam | ashtamah patalah
  devanagari: सर्वार्थसाधने विनियोगः । रुद्रो मामग्रतः पातु पृष्ठतः पातु शङ्करः । कपर्दी दक्षिणे पातु
    वामपार्श्वे तथा हरः ॥ २॥ शिवः शिरसि मां पातु ललाटे नीललोहितः । नेत्रं मे त्र्यम्बकः पातु बाहुयुग्मं
    महेश्वरः ॥ ३॥ हृदये च महादेव ईश्वरश्च तथोदरे । नाभौ कुक्षौ कटिस्थाने पादौ पातु महेश्वरः ॥ ४॥ सर्वं
    रक्षतु भूतेशः सर्वगात्राणि मे हरः । पाशं शूलञ्च दिव्यास्त्रं खड्गं वज्रं तथैव च ॥ ५॥ नमस्करोमि भूतेश
    रक्ष मां जगदीश्वर । पापेभ्यो नरकेभ्यश्च त्राहि मां भक्तवत्सल ॥ ६॥ जन्ममृत्युजराव्याधिकामक्रोधादपि
    प्रभो । लोभमोहान्महादेव रक्ष मां त्रिदशेश्वर ॥ ७॥ त्वं गतिस्त्वं मतिश्चैव त्वं भूमिस्त्वं परायणः ।
    कायेन मनसा वाचा त्वयि भक्तिर्दृढास्तु मे ॥ ८॥ फलश्रुतिः । इत्येतद्रुद्रकवचं पाठनात्पापनाशनम् । महादेवप्रसादेन
    भैरवेन च कीर्तितम् ॥ ९॥ न तस्य पापं देहेषु न भयं तस्य विद्यते । प्राप्नोति सुखमारोग्यं पुत्रमायुः
    प्रवर्द्धनम् ॥ १०॥ पुत्रार्थी लभते पुत्रान्धनार्थी धनमाप्नुयात् । विद्यार्थी लभते विद्यां मोक्षार्थी
    मोक्षमेव च ॥ ११॥ व्याधितो मुच्यते रोगाद्बद्धो मुच्येत बन्धनात् । ब्रह्महत्यादि पापं च पठनादेव नश्यति
    ॥ १२॥ इति क्रियोड्डीशे महातन्त्रराजे देवीश्वरसंवादे रुद्रकवचं समाप्तम् । अष्टमः पटलः
