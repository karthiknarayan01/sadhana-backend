id: subra-stotra
category: stotram
name:
  english: subra stotra
  devanagari: सुब्र स्तोत्र
content:
  english: nilakanthavahanam dvishadbhujam kiritinam lolaratnakundalaprabhabhiramashanmukham | shulashaktidandakukkutakshamalikadharam
    balamishvaram kumarashailavasinam bhaje|| 1||
  devanagari: नीलकण्ठवाहनं द्विषड्भुजं किरीटिनं लोलरत्नकुण्डलप्रभाभिरामषण्मुखम् । शूलशक्तिदण्डकुक्कुटाक्षमालिकाधरं
    बालमीश्वरं कुमारशैलवासिनं भजे॥ १॥
meaning: {}
