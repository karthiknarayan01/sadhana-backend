id: kamakshinavaratnamalikastotram
category: stotram
name:
  english: kamakshinavaratnamalikastotram
  devanagari: कामाक्षीनवरत्नमालिकास्तोत्रम्
content:
  english: iti shrikamakshi navaratnamalika stotram sampurnam | stotram udyatkoti nishakara pratibhatam
    bhadrasane susthitam sankhyatitagunojjvalam bhagavatim trailokyasammohinim | cetibhuta samasta devamahilam
    divyambaralankritam vande kamavilocanamanudinam vanchatiriktapradam || 1|| bhadram bhushanagandhamalyaruciram
    sandhyabhrashonambaram hastanyasta shukambujam harivirincadyaissada pujitam | nitya'nityavivekadam
    nirupamam nityadi shaktyavritam vande kamavilocanamanudinam vanchatiriktapradam || 2|| shrimaccinmaya
    kamakotinilayam sarvajnapitheshvarim mulamnaya mathadhipairyativaraissamsevitanghridvayam | icchajnana
    samasta shaktisahitam samipyamuktyadidam vande kamavilocanamanudinam vanchatiriktapradam || 3|| vedyam
    vaidikamantrakairabhinutamonkaranadatmikam kaulacara vivarjitam samayinim kandarpakantipradam | jaticampakamallika
    parilasatkantham manoharinim vande kamavilocanamanudinam vanchatiriktapradam || 4|| bhaktanam paripalanotsukatamam
    bhagyapradam nirmalam shokaranyadavanalam pranamatam svardhenuvatkamadam | mudranandita manasam muniganairaradhitamambikam
    vande kamavilocanamanudinam vanchatiriktapradam || 5|| kaivalyaika parayanam kalaravam kashmirapankancitam
    rajatkancana ratnacaru makutam rajivapatrekshanam | divyaughairmanujaishca siddhanivahairbhunirjaraissevitam
    vande kamavilocanamanudinam vanchatiriktapradam || 6|| mayam manavapalinim madhumarti mandaramaladharam
    somadyadhvarasapriyam suranutam sha
  devanagari: इति श्रीकामाक्षी नवरत्नमालिका स्तोत्रं सम्पूर्णम् । स्तोत्रम् उद्यत्कोटि निशाकर प्रतिभटां
    भद्रासने सुस्थितां सङ्ख्यातीतगुणोज्ज्वलां भगवतीं त्रैलोक्यसम्मोहिनीम् । चेटीभूत समस्त देवमहिलां दिव्याम्बरालङ्कृतां
    वन्दे कामविलोचनामनुदिनं वाञ्छातिरिक्तप्रदाम् ॥ १॥ भद्रां भूषणगन्धमाल्यरुचिरां सन्ध्याभ्रशोणाम्बरां
    हस्तन्यस्त शुकाम्बुजां हरिविरिञ्चाद्यैस्सदा पूजिताम् । नित्याऽनित्यविवेकदां निरुपमां नित्यादि शक्त्यावृतां
    वन्दे कामविलोचनामनुदिनं वाञ्छातिरिक्तप्रदाम् ॥ २॥ श्रीमच्चिन्मय कामकोटिनिलयां सर्वज्ञपीठेश्वरीं मूलाम्नाय
    मठाधिपैर्यतिवरैस्संसेविताङ्घ्रिद्वयाम् । इच्छाज्ञान समस्त शक्तिसहितां सामीप्यमुक्त्यादिदां वन्दे कामविलोचनामनुदिनं
    वाञ्छातिरिक्तप्रदाम् ॥ ३॥ वेद्यां वैदिकमन्त्रकैरभिनुतामोङ्कारनादात्मिकां कौलाचार विवर्जितां समयिनीं
    कन्दर्पकान्तिप्रदाम् । जातीचम्पकमल्लिका परिलसत्कण्ठां मनोहारिणीं वन्दे कामविलोचनामनुदिनं वाञ्छातिरिक्तप्रदाम्
    ॥ ४॥ भक्तानां परिपालनोत्सुकतमां भाग्यप्रदां निर्मलां शोकारण्यदवानलां प्रणमतां स्वर्धेनुवत्कामदाम्
    । मुद्रानन्दित मानसां मुनिगणैराराधितामम्बिकाम् वन्दे कामविलोचनामनुदिनं वाञ्छातिरिक्तप्रदाम् ॥ ५॥ कैवल्यैक
    परायणां कलरवां काश्मीरपङ्काञ्चितां राजत्काञ्चन रत्नचारु मकुटां राजीवपत्रेक्षणाम् । दिव्यौघैर्मनुजैश्च
    सिद्धनिवहैर्भूनिर्जरैस्सेवितां वन्दे कामविलोचनामनुदिनं वाञ्छातिरिक्तप्रदाम् ॥ ६॥ मायां मानवपालिनीं
    मधुमर्ती मन्दारमालाधरां सोमाद्यध्वरसप्रियां सुरनुतां श
