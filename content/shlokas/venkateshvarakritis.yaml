id: venkateshvarakritis
category: stotram
name:
  english: venkateshvarakritis
  devanagari: वेन्कटेश्वरक्रितिस्
content:
  english: rupaka shankha cakra gada panim aham vande shri shanga nandaka kaustubha dharinam vande ||
    pankeruha caranam padmavati ramanam shankatapaharanam sada bhaktabharanam kumkuma pankila gatram pankaja
    vishala netram shankara sannuti patram venkata varada kshetram || gajendra samrakshanam garuda vaha
    vicakshanam ajendradi vilakshanam amrita sara bhakshanam ajamiladi prabhrit yaneka dasadi santaranam
    bhaje purna candrikanga guruguhantahkaranam kujadigrahavihitam virajanadi tatasthitam sajatiyadirahitam
    nijanandabodhahitam ||
  devanagari: रूपक शङ्ख चक्र गदा पाणिं अहं वन्दे श्री शाङ्ग नन्दक कौस्तुभ धारिणं वन्दे ॥ पङ्केरुह चरणं
    पद्मावति रमणं शङ्कतापहरणं सदा भक्ताभरणं कुंकुम पङ्किल गात्रं पङ्कज विशाल नेत्रं शङ्कर सन्नुति पात्रं
    वेङ्कट वरद क्षेत्रम् ॥ गजेन्द्र संरक्षणं गरुड वाह विचक्षणं अजेन्द्रादि विलक्षणं अमृत सार भक्षणं अजामीलादि
    प्रभृत् यनेक दासादि सन्तरणं भजे पूर्ण चन्द्रिकाङ्ग गुरुगुहान्तःकरणं कुजादिग्रहविहितं विरजानदी तटस्थितं
    सजातीयादिरहितं निजानन्दबोधहितम् ॥
