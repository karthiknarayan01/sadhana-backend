id: brahmanakritamdevistotram
category: stotram
name:
  english: brahmanakritamdevistotram
  devanagari: ब्रह्मणाकृतंदेवीस्तोत्रम्
content:
  english: ringaranayike | jayajaye'dhikasiddheshi jaya yogindravandite || 23|| jayajaya jagadamba nityarupe
    jayajaya sannutalokasaukhyadatri | jayajaya himashailakirtaniye jayajaya shankarakamavamanetri ||
    24|| jagajjanmasthitidhvamsapidhananugrahanmuhuh | ya karoti svasankalpattasyai devyai namo namah
    || 25|| varnashramanam sankaryakarinah papino janan | nihantyadyatitikshnastraistasyai devyai namo
    namah || 26|| nagamaishca na vedaishca na shastrairna ca yogibhih | vedya ya ca svasamvedya tasyai
    devyai namo namah || 27|| rahasyamnayavedantaistattvavidbhirmunishvaraih | param brahmeti ya khyata
    tasyai devyai namo namah || 28|| hridayasthapi sarvesham ya na kenapi drishyate | sukshmavijnanarupayai
    tasyai devyai namo namah || 29|| brahma vishnushca rudrashca ishvarashca sadashivah | yaddhyanaikapara
    nityam tasyai devyai namo namah || 30|| yaccaranabhakta indradya yadajnameva bibhrati | samrajyasampadishayai
    tasyai devyai namo namah || 31|| veda nihshvasitam yasya vikshitam bhutapancakam | smitam caracaram
    vishvam tasyai devyai namo namah || 32|| sahasrashirsha bhogindro dharitrim tu yadajnaya | dhatte
    sarvajanadharam tasyai devyai namo namah || 33|| jvalatyagnistapatyarko vato vati yadajnaya | jnanashaktisvarupayai
    tasyai devyai namo namah || 34|| pancavimshatitattvani mayakancukapancakam | yanmayam munayah prahustasyai
    devyai namo namah || 35|| shivashaktishvarashcaiva shuddhabodhah sadashivah | yadunmeshavibhedah syustasyai
    devyai namo namah || 36|| gururmantro devata ca tatha pranashca pancadha | ya virajati cidrupa tasyai
    devyai namo namah || 37|| sarvatmanamantaratma paramandarupini | shrividyeti smrita va tu tasyai devyai
    namo namah || 38|| darshanani ca sarvani yadangani vidurbudhah | tattanniyamayupayai tasyai devyai
    namo namah || 39|| ya bhati sarvalokeshu manimantraushadhatmana | tattvopadesharupayai tasyai devyai
    namo namah || 40|| deshakalapadarthatma yadyadvastu yatha tatha | tattadrupena ya bhati tasyai devyai
    namo namah || 41|| he pratibhatakara kalyanagunashalini | vishvottirneti cakhyata tasyai devyai namo
    namah || 42|| iti stutva mahadevim dhata lokapitamahah | bhuyo bhuyo namaskritya sahasa sharanam gatah
    || 43|| iti brahmandapurane uttarabhage ekonacatvarimshadhyayantargatam brahmana kritam devistotram
    samaptam | brahmandapurana | uttarabhaga | lalita | adhyaya 39
  devanagari: ृङ्गारनायिके । जयजयेऽधिकसिद्धेशि जय योगीन्द्रवन्दिते ॥ २३॥ जयजय जगदम्ब नित्यरूपे जयजय सन्नुतलोकसौख्यदात्रि
    । जयजय हिमशैलकीर्तनीये जयजय शङ्करकामवामनेत्रि ॥ २४॥ जगज्जन्मस्थितिध्वंसपिधानानुग्रहान्मुहुः । या करोति
    स्वसङ्कल्पात्तस्यै देव्यै नमो नमः ॥ २५॥ वर्णाश्रमाणां साङ्कर्यकारिणः पापिनो जनान् । निहन्त्याद्यातितीक्ष्णास्त्रैस्तस्यै
    देव्यै नमो नमः ॥ २६॥ नागमैश्च न वेदैश्च न शास्त्रैर्न च योगिभिः । वेद्या या च स्वसंवेद्या तस्यै देव्यै
    नमो नमः ॥ २७॥ रहस्याम्नायवेदान्तैस्तत्त्वविद्भिर्मुनीश्वरैः । परं ब्रह्मेति या ख्याता तस्यै देव्यै
    नमो नमः ॥ २८॥ हृदयस्थापि सर्वेषां या न केनापि दृश्यते । सूक्ष्मविज्ञानरूपायै तस्यै देव्यै नमो नमः
    ॥ २९॥ ब्रह्मा विष्णुश्च रुद्रश्च ईश्वरश्च सदाशिवः । यद्ध्यानैकपरा नित्यं तस्यै देव्यै नमो नमः ॥ ३०॥
    यच्चरणभक्ता इन्द्राद्या यदाज्ञामेव बिभ्रति । साम्राज्यसम्पदीशायै तस्यै देव्यै नमो नमः ॥ ३१॥ वेदा निःश्वसितं
    यस्या वीक्षितं भूतपञ्चकम् । स्मितं चराचरं विश्वं तस्यै देव्यै नमो नमः ॥ ३२॥ सहस्रशीर्षा भोगीन्द्रो
    धरित्रीं तु यदाज्ञया । धत्ते सर्वजनाधारां तस्यै देव्यै नमो नमः ॥ ३३॥ ज्वलत्यग्निस्तपत्यर्को वातो वाति
    यदाज्ञया । ज्ञानशक्तिस्वरूपायै तस्यै देव्यै नमो नमः ॥ ३४॥ पञ्चविंशतितत्त्वानि मायाकञ्चुकपञ्चकम् ।
    यन्मयं मुनयः प्राहुस्तस्यै देव्यै नमो नमः ॥ ३५॥ शिवशक्तीश्वराश्चैव शुद्धबोधः सदाशिवः । यदुन्मेषविभेदाः
    स्युस्तस्यै देव्यै नमो नमः ॥ ३६॥ गुरुर्मन्त्रो देवता च तथा प्राणाश्च पञ्चधा । या विराजति चिद्रूपा
    तस्यै देव्यै नमो नमः ॥ ३७॥ सर्वात्मनामन्तरात्मा परमान्दरूपिणी । श्रीविद्येति स्मृता वा तु तस्यै देव्यै
    नमो नमः ॥ ३८॥ दर्शनानि च सर्वाणि यदङ्गानि विदुर्बुधाः । तत्तन्नियमयूपायै तस्यै देव्यै नमो नमः ॥ ३९॥
    या भाति सर्वलोकेषु मणिमन्त्रौषधात्मना । तत्त्वोपदेशरूपायै तस्यै देव्यै नमो नमः ॥ ४०॥ देशकालपदार्थात्मा
    यद्यद्वस्तु यथा तथा । तत्तद्रूपेण या भाति तस्यै देव्यै नमो नमः ॥ ४१॥ हे प्रतिभटाकारा कल्याणगुणशालिनी
    । विश्वोत्तीर्णेति चाख्याता तस्यै देव्यै नमो नमः ॥ ४२॥ इति स्तुत्वा महादेवीं धाता लोकपितामहः । भूयो
    भूयो नमस्कृत्य सहसा शरणं गतः ॥ ४३॥ इति ब्रह्माण्डपुराणे उत्तरभागे एकोनचत्वारिंशाध्यायान्तर्गतं ब्रह्मणा
    कृतं देवीस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय ३९
