id: markandeyamuniproktamsarasvatistotram
category: stotram
name:
  english: markandeyamuniproktamsarasvatistotram
  devanagari: मार्कण्डेयमुनिप्रोक्तंसरस्वतीस्तोत्रम्
content:
  english: markandeyamuniproktam sarasvatistotram tasmin plakshe sthitam drishtva markandeyo mahamunih
    | pranipatya tada murdhna tushtavatha sarasvatim || 5|| markandeya uvaca | tvam devi sarvalokanam
    mata devaranih shubha | sadasaddevi yatkincinmokshadayyarthavatpadam || 6|| tatsarvam tvayi samyogi
    yogivaddevi samsthitam | aksharam paramam devi yatra sarvam pratishthitam | aksharam paramam brahma
    vishvam caitatksharatmakam || 7|| darunyavasthito vahnirbhumau gandho yatha dhruvam | tatha tvayi
    sthitam brahma jagaccedamasheshatah || 8|| om karaksharasamsthanam yattaddevi sthirasthiram | tatra
    matratrayam sarvamasti yaddevi nasti ca || 9|| trayo lokastrayo vedastraividyam pavakatrayam | trini
    jyotimshi vargashca trayo dharmadayastatha || 10|| trayo gunastrayo varnastrayo devastatha kramat
    | traidhatavastathavasthah pitarashcaivamadayah || 11|| etanmatratrayam devi tava rupam sarasvati
    | vibhinnadarshanamadyam brahmano hi sanatanim || 12|| somasamstha havihsamstha pakasamstha sanatani
    | tastvaduccaranaddevi kriyante brahmavadibhih || 13|| anirdeshyapadam tvetadarddhamatrashritam param
    | avikaryakshayam divyam parinamavivarjitam || 14|| tavaitatparamam rupam yanna shakyam mayoditum
    | na casyena na va jihvatalvoshthadibhirucyate || 15|| sa vishnuh sa vrisho brahma candrarkajyotireva
    ca | vishvavasam vishvarupam vishvatmanamanishvaram || 16|| sankhyasiddhantavedoktam bahushakhasthirikritam
    | anadimadhyanidhanam sadasacca sadeva tu || 17|| ekam tvanekadhapyekabhavavedasamashritam | anakhyam
    shadgunakhyam ca bahvakhyam trigunashrayam || 18|| nanashaktivibhavajnam nanashaktivibhavakam | sukhatsukham
    mahatsaukhyam rupam tattvagunatmakam || 19|| evam devi tvaya vyaptam sakalam nishkalam ca yat | advaitavasthitam
    brahma yacca dvaite vyavasthitam || 20|| ye'rtha nitya ye vinashyanti canye ye'rthah sthula ye tatha
    santi sukshmah | ye va bhumau ye'ntarikshe'nyato va tesham devi tvatta evopalabdhih || 21|| yadva
    murtam yadamurtam samastam yadva bhuteshvekamekam ca kincit | yacca dvaite vyastabhutam ca lakshyam
    tatsambaddham tvatsvarairvyanjanaishca || 22|| iti vamanapurane dvatrimshadhyayantargatam markandeyamuniproktam
    sarasvatistotram samaptam | vamanapurana | adhyaya 32
  devanagari: मार्कण्डेयमुनिप्रोक्तं सरस्वतीस्तोत्रम् तस्मिन् प्लक्षे स्थितां दृष्ट्वा मार्कण्डेयो महामुनिः
    । प्रणिपत्य तदा मूर्ध्ना तुष्टावाथ सरस्वतीम् ॥ ५॥ मार्कण्डेय उवाच । त्वं देवि सर्वलोकानां माता देवारणिः
    शुभा । सदसद्देवि यत्किञ्चिन्मोक्षदाय्यर्थवत्पदम् ॥ ६॥ तत्सर्वं त्वयि संयोगि योगिवद्देवि संस्थितम्
    । अक्षरं परमं देवि यत्र सर्वं प्रतिष्ठितम् । अक्षरं परमं ब्रह्म विश्वं चैतत्क्षरात्मकम् ॥ ७॥ दारुण्यवस्थितो
    वह्निर्भूमौ गन्धो यथा ध्रुवम् । तथा त्वयि स्थितं ब्रह्म जगच्चेदमशेषतः ॥ ८॥ ॐ काराक्षरसंस्थानं यत्तद्देवि
    स्थिरास्थिरम् । तत्र मात्रात्रयं सर्वमस्ति यद्देवि नास्ति च ॥ ९॥ त्रयो लोकास्त्रयो वेदास्त्रैविद्यं
    पावकत्रयम् । त्रीणि ज्योतींषि वर्गाश्च त्रयो धर्मादयस्तथा ॥ १०॥ त्रयो गुणास्त्रयो वर्णास्त्रयो देवास्तथा
    क्रमात् । त्रैधातवस्तथावस्थाः पितरश्चैवमादयः ॥ ११॥ एतन्मात्रात्रयं देवि तव रूपं सरस्वति । विभिन्नदर्शनामाद्यां
    ब्रह्मणो हि सनातनीम् ॥ १२॥ सोमसंस्था हविःसंस्था पाकसंस्था सनातनी । तास्त्वदुच्चारणाद्देवि क्रियन्ते
    ब्रह्मवादिभिः ॥ १३॥ अनिर्देश्यपदं त्वेतदर्द्धमात्राश्रितं परम् । अविकार्यक्षयं दिव्यं परिणामविवर्जितम्
    ॥ १४॥ तवैतत्परमं रूपं यन्न शक्यं मयोदितुम् । न चास्येन न वा जिह्वाताल्वोष्ठादिभिरुच्यते ॥ १५॥ स विष्णुः
    स वृषो ब्रह्मा चन्द्रार्कज्योतिरेव च । विश्वावासं विश्वरूपं विश्वात्मानमनीश्वरम् ॥ १६॥ साङ्ख्यसिद्धान्तवेदोक्तं
    बहुशाखास्थिरीकृतम् । अनादिमध्यनिधनं सदसच्च सदेव तु ॥ १७॥ एकं त्वनेकधाप्येकभाववेदसमाश्रितम् । अनाख्यं
    षड्गुणाख्यं च बह्वाख्यं त्रिगुणाश्रयम् ॥ १८॥ नानाशक्तिविभावज्ञं नानाशक्तिविभावकम् । सुखात्सुखं महात्सौख्यं
    रूपं तत्त्वगुणात्मकम् ॥ १९॥ एवं देवि त्वया व्याप्तं सकलं निष्कलं च यत् । अद्वैतावस्थितं ब्रह्म यच्च
    द्वैते व्यवस्थितम् ॥ २०॥ येऽर्था नित्या ये विनश्यन्ति चान्ये येऽर्थाः स्थूला ये तथा सन्ति सूक्ष्माः
    । ये वा भूमौ येऽन्तरिक्षेऽन्यतो वा तेषां देवि त्वत्त एवोपलब्धिः ॥ २१॥ यद्वा मूर्तं यदमूर्तं समस्तं
    यद्वा भूतेष्वेकमेकं च किञ्चित् । यच्च द्वैते व्यस्तभूतं च लक्ष्यं तत्सम्बद्धं त्वत्स्वरैर्व्यञ्जनैश्च
    ॥ २२॥ इति वामनपुराणे द्वात्रिंशाध्यायान्तर्गतं मार्कण्डेयमुनिप्रोक्तं सरस्वतीस्तोत्रं समाप्तम् । वामनपुराण
    । अध्याय ३२
