id: narayaniyam-dashaka-80
category: stotram
name:
  english: Narayaniyam Dashaka 80
content:
  english: satrajitastvamatha lubdhavadarkalabdham divyam syamantakamanim bhagavannayacih | tatkaranam
    bahuvidham mama bhati nunam tasyatmajam tvayi ratam chalato vivodhum || || adattam tam tubhyam manivaramanenalpamanasa
    prasenastadbhrata galabhuvi vahan prapa mrigayam | ahannenam simho manimahasi mamsabhramavashat kapindrastam
    hatva manimapi ca balaya dadivan || || shashamsuh satrajidgiramanu janastvam maniharam jananam piyusham
    bhavati guninam doshakanika | tatah sarvajno'pi svajanasahito marganaparah prasenam tam drishtva harimapi
    gato'bhuh kapiguham || || bhavantamavitarkayannativayah svayam jambavan mukundasharanam hi mam ka
    iha roddhumityalapan | vibho raghupate hare jaya jayetyalam mushtibhi shciram tava samarcanam vyadhita
    bhaktacudamanih || || budhva'tha tena dattam navaramanim varamanim ca parigrihnan | anugrihnannamumagah
    sapadi ca satrajite manim pradah || || tadanu sa khalu brilalolo vilolavilocanam duhitaramaho dhiman
    bhamam giraiva pararpitam | adita manina tubhyam labhyam sametya bhavanapi pramuditamanastasyaivadanmanim
    gahanashayah || || vrilakulam ramayati tvayi satyabhamam kaunteyadahakathayatha kurun prayate | hi
    gandineyakritavarmagira nipatya satrajitam shatadhanurmanimajahara || || shokat kurunupagatamavalokya
    kantam hatva drutam shatadhanum samaharshayastam | ratne sashanka iva maithilagehametya ramo gadam
    samashishikshata dhartarashtram || || akrura esha bhagavan bhavadicchayaiva satrajitah kucaritasya
    yuyoja himsam | akrurato manimanahritavan punastvam tasyaiva bhutimupadhatumiti bruvanti || || bhaktastvayi
    sthiratarah sa hi gandineya stasyaiva kapathamatih kathamisha jata | vijnanavan prashamavanahamityudirnam
    garvam dhruvam shamayitum bhavata kritaiva || || yatam bhayena kritavarmayutam punasta mahuya tadvinihitam
    ca manim prakashya | tatraiva suvratadhare vinidhaya tushyan bhamakucantashayanah pavanesha payah
    ||
  devanagari: सत्राजितस्त्वमथ लुब्धवदर्कलब्धं दिव्यं स्यमन्तकमणिं भगवन्नयाचीः । तत्कारणं बहुविधं मम भाति
    नूनं तस्यात्मजां त्वयि रतां छलतो विवोढुम् ॥ ॥ अदत्तं तं तुभ्यं मणिवरमनेनाल्पमनसा प्रसेनस्तद्भ्राता
    गलभुवि वहन् प्राप मृगयाम् । अहन्नेनं सिंहो मणिमहसि मांसभ्रमवशात् कपीन्द्रस्तं हत्वा मणिमपि च बालाय
    ददिवान् ॥ ॥ शशंसुः सत्राजिद्गिरमनु जनास्त्वां मणिहरं जनानां पीयूषं भवति गुणिनां दोषकणिका । ततः सर्वज्ञोऽपि
    स्वजनसहितो मार्गणपरः प्रसेनं तं दृष्ट्वा हरिमपि गतोऽभूः कपिगुहाम् ॥ ॥ भवन्तमवितर्कयन्नतिवयाः स्वयं
    जाम्बवान् मुकुन्दशरणं हि मां क इह रोद्धुमित्यालपन् । विभो रघुपते हरे जय जयेत्यलं मुष्टिभि श्चिरं तव
    समर्चनं व्यधित भक्तचूडामणिः ॥ ॥ बुध्वाऽथ तेन दत्तां नवरमणीं वरमणिं च परिगृह्णन् । अनुगृह्णन्नमुमागाः
    सपदि च सत्राजिते मणिं प्रादाः ॥ ॥ तदनु स खलु ब्रीलालोलो विलोलविलोचनां दुहितरमहो धीमान् भामां गिरैव
    परार्पिताम् । अदित मणिना तुभ्यं लभ्यं समेत्य भवानपि प्रमुदितमनास्तस्यैवादान्मणिं गहनाशयः ॥ ॥ व्रीलाकुलां
    रमयति त्वयि सत्यभामां कौन्तेयदाहकथयाथ कुरून् प्रयाते । ही गान्दिनेयकृतवर्मगिरा निपात्य सत्राजितं शतधनुर्मणिमाजहार
    ॥ ॥ शोकात् कुरूनुपगतामवलोक्य कान्तां हत्वा द्रुतं शतधनुं समहर्षयस्ताम् । रत्ने सशङ्क इव मैथिलगेहमेत्य
    रामो गदां समशिशिक्षत धार्तराष्ट्रम् ॥ ॥ अक्रूर एष भगवन् भवदिच्छयैव सत्राजितः कुचरितस्य युयोज हिंसाम्
    । अक्रूरतो मणिमनाहृतवान् पुनस्त्वं तस्यैव भूतिमुपधातुमिति ब्रुवन्ति ॥ ॥ भक्तस्त्वयि स्थिरतरः स हि
    गान्दिनेय स्तस्यैव कापथमतिः कथमीश जाता । विज्ञानवान् प्रशमवानहमित्युदीर्णं गर्वं ध्रुवं शमयितुं भवता
    कृतैव ॥ ॥ यातं भयेन कृतवर्मयुतं पुनस्त माहूय तद्विनिहितं च मणिं प्रकाश्य । तत्रैव सुव्रतधरे विनिधाय
    तुष्यन् भामाकुचान्तशयनः पवनेश पायाः ॥
