id: mahavidyavaishnavikavacastotram
category: kavacha
name:
  english: mahavidyavaishnavikavacastotram
  devanagari: महाविद्यावैष्णवीकवचस्तोत्रम्
content:
  english: rinu vetalabhairava | vaishnavitantrasamjnasya vaishnavyashca visheshatah || 1|| tatra mantradyaksharam
    tu vasudevasvarupadhrik | varno dvitiyo brahmaiva tritiyashcandrashekharah || 2|| caturtho gajavaktrashca
    pancamastu divakarah | shaktih svayam pakarashca mahamaya jaganmayi || 3|| yakarastu mahalakshmih
    sheshavarnah sarasvati | yogini purvavarnasya shailaputri prakirtita || 4|| dvitiyasya tu varnasya
    candika yogini mata | candaghanta tritiyasya kushmanda tatparasya ca || 5|| skandamata takarasya pasya
    katyayani svayam | kalaratrih saptamasya mahadeviti samsthita || 6|| prathamam varnakavacam yoginikavacam
    tatha | devaughakavacam pashcaddevidikkavacam tatha || 7|| tatastu parshvakavacam dvitiyantavyayasya
    ca | kavacam tu tatah pashcat shadvarnakavacam tatha || 8|| abhedyakavacam ceti sarvatranaparayanam
    | imani kavacanyashtau yo janati narottamah | so'hameva mahadevo devirupashca shaktiman || 9|| om
    asya shrivaishnavikavacastotramahamantrasya narayana rishih | anushtup chandah | shrimahavidya vaishnavikatyayani
    devata | sarvarthasadhane jape viniyogah || ah patu purvakashthayamagneyyam patu kah sada | patu co
    yamakashthayanto nairrityam ca sarvada || 10|| mam patu to'sau pashcatye shaktirvayavyadiggata | murdhni
    rakshatu mam so'sau bahau mam dakshine tu kah | mam vamabahau ca patu hridi to mam sadavatu || 11||
    tah patu kanthadeshe mam katyoh shaktistathavatu | yah patu dakshine pade sho mam vamapade tatha ||
    12|| shailaputri tu purvasyamagneyyam patu candika | candaghanta patu yamyam yamabhitivimardini ||
    13|| nairritye tvatha kushmanda patu mam jagatam prasuh | skandamata pashcimayam mam rakshatu sadaiva
    hi || 14|| katyayani mam vayavye patu lokeshvari sada | kalaratri tu kauberyam sada rakshatu mam svayam
    || 15|| mahagauri tatheshanyam satatam patu pavani | netrayorvasudevo mam patu nityam sanatanah ||
    16|| brahma mam patu vadane padmayonirayonijah | nasabhage rakshatu mam sarvada candrashekharah ||
    17|| gajavaktrah stanyayugme patu nityam haratmajah | vamadakshinapanyormam nityam patu divakarah
    || 18|| mahamaya svayam nabhau mam patu parameshvari | mahalakshmih patu guhye januni tu sarasvati
    || 19|| mahamaya purvabhage nityam rakshatu mamshubha | agnijvala tathagneyyam payannityam varasani
    || 20|| rudrani patu mam yamyam nairrityam candanayika | ugracanda pashcimayam patu nityam maheshvari
    || 21|| pracanda patu vayavye kauberyam ghorarupini | ishvari ca tathaishanyam patu nityam sanatani
    || 22|| urdhve patu mahamaya patvadhah parameshvari | agratah patu mamugra prishthato vaishnavi tatha
    || 23|| brahmani dakshine parshve nityam rakshatu shobhana | kaumari parvate patu varahi salile ca
    mam || 24|| narasimhi damshtribhaye patu mam vipineshu ca | aindri mam patu cakashe tatha sarvajale
    sthale || 25|| setuh sarvangulih patu devadih patu karnayoh | devantashcibuke patu parshvayoh shaktipancamah
    || 26|| ha patu mam tathairvorvormaya rakshatu janghayoh | sarvendriyani me patu romakupeshu sarvada
    || 27|| tvaci mam vai sada patu mamshambhuh patu sarvada | nakhadantakaroshthadau yo mam patu sadaiva
    hi || 28|| devadih patu mam hastau devantah stanakakshayoh | etadadau tu yah seturbahye mam patu dehatah
    || 29|| ajnacakre sushumnayamshatcakre hridisandhishu | adishodashacakre ca lalatakasha eva ca ||
    30|| vaishnavitantramantrashca mam nityam rakshatatsada | karnanadishu sarvasu parshvakakshashikhasu
    ca || 31|| rudhirasnayumajjasu mastishkeshu ca parvasu | dvitiyashtaksharo mantrah kavacam patu sarvatah
    || 32|| reto vayau nabhirandhre prishthasandhishu sarvatah | shadaksharastritiyo'yam mantro mam patu
    sarvada || 33|| nasarandhre mahamaya kantharandhre tu vaishnavi | sarvasandhishu mam patu durga durgartiharini
    || 34|| shrotrayorhum phadityevam nityam rakshatu kalika | netrabijatrayam netre sada tishthatu rakshitum
    || 35|| om aim hrim hraum nasikayam rakshanti castu candika | om hrim hrum mam sada tara jihvamule
    tu tishthatu || 36|| hridi tishthatu me seturjnanam rakshitumuttamam | om kshaum phat ca mahamari
    patu mam sarvatah sada || 37|| om jum sah kaushiki mam pranan rakshatu rakshita | om hrim hrum mam
    bhargadayita dehashunyeshu patu mam || 38|| om mah sadashailaputri sarvanogran pramrijyatam | om hrim
    sah sphem kshah phadastraya simhavyaghrabhayadranat || 39|| shivaduti patu nityam hrim sarvastreshu
    tishthatu | om hram hrim sah candaghanta karnachidreshu patu mam || 40|| om hrim sah kameshvari kamanabhitishthatu
    rakshatu | om am hum phat ugracanda ripun vighnan vimardatam || 41|| om am lam patu mam nityam vaishnavi
    jagadishvari | om kam brahmani patu cakrat om cam rudrani tu shaktitah || 42|| om tam kaumari patu
    vajrat om tam varahi tu kandatah | om pam patu narasimhi mam kravyadebhyastathastratah || 43|| shastrastrebhyah
    samastebhyo yantrebhyo'nishtamantratah | candika mam sada patu om yam sam devyai namo namah || 44||
    vishvasaghatakebhyo mamaindri rakshatu manmanah | om namo mahamayayai om vaishnavyai namo namah |
    raksha mam sarvabhutebhyah sarvatra parameshvari || 45|| adhare vayumarge hridi kamaladale candravatsmerasurye
    hastau vahnau samiddhe vishatu varadayamantramashtaksharam tat | yadbrahma murdhni dhatte hariravati
    gale candracudo hridistham tanmam patu pradhanam nikhilamatishayampradmagarbhabhabijam || 46|| adyah
    sheshah svaraughairnamayabalavarairasvarenapi yuktaih sanusvara visargairhariharaviditam yatsahasram
    ca sashtam | mantranam setubandham nivasati satatam vaishnavitantramantre tanmam payatpavitram paramavaramajambhutalavyomabhage
    || 47|| anganyashtau tathashtau vasava iha tathaivashtamurtirdalani proktanyashtau tathashtau madhumatiracitah
    siddhayo'shtau tathaiva | ashtavashtashtasankhya jagati ratikalah kshiprakashtangayoga mayyashtavaksharani
    ksharatu sahigano yaddhridoyastvamusham || 48|| phalashrutih
  devanagari: ृणु वेतालभैरव । वैष्णवीतन्त्रसंज्ञस्य वैष्णव्याश्च विशेषतः ॥ १॥ तत्र मन्त्राद्यक्षरं तु
    वासुदेवस्वरूपधृक् । वर्णो द्वितीयो ब्रह्मैव तृतीयश्चन्द्रशेखरः ॥ २॥ चतुर्थो गजवक्त्रश्च पञ्चमस्तु
    दिवाकरः । शक्तिः स्वयं पकारश्च महामाया जगन्मयी ॥ ३॥ यकारस्तु महालक्ष्मीः शेषवर्णः सरस्वती । योगिनी
    पूर्ववर्णस्य शैलपुत्री प्रकीर्तिता ॥ ४॥ द्वितीयस्य तु वर्णस्य चण्डिका योगिनी मता । चण्डघण्टा तृतीयस्य
    कूष्माण्डा तत्परस्य च ॥ ५॥ स्कन्दमाता तकारस्य पस्य कात्यायनी स्वयम् । कालरात्रिः सप्तमस्य महादेवीति
    संस्थिता ॥ ६॥ प्रथमं वर्णकवचं योगिनीकवचं तथा । देवौघकवचं पश्चाद्देवीदिक्कवचं तथा ॥ ७॥ ततस्तु पार्श्वकवचं
    द्वितीयान्ताव्ययस्य च । कवचं तु ततः पश्चात् षड्वर्णकवचं तथा ॥ ८॥ अभेद्यकवचं चेति सर्वत्राणपरायणम्
    । इमानि कवचान्यष्टौ यो जानाति नरोत्तमः । सोऽहमेव महादेवो देवीरूपश्च शक्तिमान् ॥ ९॥ ॐ अस्य श्रीवैष्णवीकवचस्तोत्रमहामन्त्रस्य
    नारायण ऋषिः । अनुष्टुप् छन्दः । श्रीमहाविद्या वैष्णवीकात्यायनी देवता । सर्वार्थसाधने जपे विनियोगः
    ॥ अः पातु पूर्वकाष्ठायामाग्नेय्यां पातु कः सदा । पातु चो यमकाष्ठायाण्टो नैरृत्यां च सर्वदा ॥ १०॥ मां
    पातु तोऽसौ पाश्चात्ये शक्तिर्वायव्यदिग्गता । मूर्ध्नि रक्षतु मां सोऽसौ बाहौ मां दक्षिणे तु कः । मां
    वामबाहौ च पातु हृदि तो मां सदावतु ॥ ११॥ तः पातु कण्ठदेशे मां कट्योः शक्तिस्तथावतु । यः पातु दक्षिणे
    पादे शो मां वामपदे तथा ॥ १२॥ शैलपुत्री तु पूर्वस्यांआग्नेय्यां पातु चण्डिका । चण्डाघण्टा पातु याम्यां
    यमभीतिविमर्दिनी ॥ १३॥ नैरृत्ये त्वथ कूष्माण्डा पातु मां जगतां प्रसूः । स्कन्दमाता पश्चिमायां मां रक्षतु
    सदैव हि ॥ १४॥ कात्यायनी मां वायव्ये पातु लोकेश्वरी सदा । कालरात्री तु कौबेर्यां सदा रक्षतु मां स्वयम्
    ॥ १५॥ महागौरी तथेशान्यां सततं पातु पावनी । नेत्रयोर्वासुदेवो मां पातु नित्यं सनातनः ॥ १६॥ ब्रह्मा
    मां पातु वदने पद्मयोनिरयोनिजः । नासाभागे रक्षतु मां सर्वदा चन्द्रशेखरः ॥ १७॥ गजवक्त्रः स्तन्ययुग्मे
    पातु नित्यं हरात्मजः । वामदक्षिणपाण्योर्मां नित्यं पातु दिवाकरः ॥ १८॥ महामाया स्वयं नाभौ मां पातु
    परमेश्वरी । महालक्ष्मीः पातु गुह्ये जानुनी तु सरस्वती ॥ १९॥ महामाया पूर्वभागे नित्यं रक्षतु मांशुभा
    । अग्निज्वाला तथाग्नेय्यां पायान्नित्यं वरासनी ॥ २०॥ रुद्राणी पातु मां याम्यां नैरृत्यां चण्डनायिका
    । उग्रचण्डा पश्चिमायां पातु नित्यं महेश्वरी ॥ २१॥ प्रचण्डा पातु वायव्ये कौबेर्यां घोररूपिणी । ईश्वरी
    च तथैशान्यां पातु नित्यं सनातनी ॥ २२॥ ऊर्ध्वे पातु महामाया पात्वधः परमेश्वरी । अग्रतः पातु मामुग्रा
    पृष्ठतो वैष्णवी तथा ॥ २३॥ ब्रह्माणी दक्षिणे पार्श्वे नित्यं रक्षतु शोभना । कौमारी पर्वते पातु वाराही
    सलिले च माम् ॥ २४॥ नारसिंही दंष्ट्रिभये पातु मां विपिनेषु च । ऐन्द्री मां पातु चाकाशे तथा सर्वजले
    स्थले ॥ २५॥ सेतुः सर्वाङ्गुलीः पातु देवादिः पातु कर्णयोः । देवान्तश्चिबुके पातु पार्श्वयोः शक्तिपञ्चमः
    ॥ २६॥ हा पातु मां तथैर्वोर्वोर्माया रक्षतु जङ्घयोः । सर्वेन्द्रियाणि मे पातु रोमकूपेषु सर्वदा ॥ २७॥
    त्वचि मां वै सदा पातु मांशम्भुः पातु सर्वदा । नखदन्तकरोष्ठादौ यो मां पातु सदैव हि ॥ २८॥ देवादिः पातु
    मां हस्तौ देवान्तः स्तनकक्षयोः । एतदादौ तु यः सेतुर्बाह्ये मां पातु देहतः ॥ २९॥ आज्ञाचक्रे सुषुम्नायांषट्चक्रे
    हृदिसन्धिषु । आदिषोडशचक्रे च ललाटाकाश एव च ॥ ३०॥ वैष्णवीतन्त्रमन्त्रश्च मां नित्यं रक्षतात्सदा । कर्णनाडीषु
    सर्वासु पार्श्वकक्षशिखासु च ॥ ३१॥ रुधिरस्नायुमज्जासु मस्तिष्केषु च पर्वसु । द्वितीयाष्टाक्षरो मन्त्रः
    कवचं पातु सर्वतः ॥ ३२॥ रेतो वायौ नाभिरन्ध्रे पृष्ठसन्धिषु सर्वतः । षडक्षरस्तृतीयोऽयं मन्त्रो मां पातु
    सर्वदा ॥ ३३॥ नासारन्ध्रे महामाया कण्ठरन्ध्रे तु वैष्णवी । सर्वसन्धिषु मां पातु दुर्गा दुर्गार्तिहारिणी
    ॥ ३४॥ श्रोत्रयोर्हुं फडित्येवं नित्यं रक्षतु कालिका । नेत्रबीजत्रयं नेत्रे सदा तिष्ठतु रक्षितुम् ॥
    ३५॥ ॐ ऐं ह्रीं ह्रौं नासिकायां रक्षन्ती चास्तु चण्डिका । ॐ ह्रीं ह्रूं मां सदा तारा जिह्वमूले तु तिष्ठतु
    ॥ ३६॥ हृदि तिष्ठतु मे सेतुर्ज्ञानं रक्षितुमुत्तमम् । ॐ क्षौं फट् च महामारी पातु मां सर्वतः सदा ॥ ३७॥
    ॐ जूं सः कौशिकी मां प्राणन् रक्षतु रक्षिता । ॐ ह्रीं ह्रूं मां भर्गदयिता देहशून्येषु पातु माम् ॥ ३८॥
    ॐ मः सदाशैलपुत्री सर्वानोग्रान् प्रमृज्यताम् । ॐ ह्रीं सः स्फें क्षः फडस्त्राय सिंहव्याघ्रभयाद्रणात्
    ॥ ३९॥ शिवदूती पातु नित्यं ह्रीं सर्वास्त्रेषु तिष्ठतु । ॐ ह्रां ह्रीं सः चण्डघण्टा कर्णछिद्रेषु पातु
    माम् ॥ ४०॥ ॐ ह्रीं सः कामेश्वरी कामानभितिष्ठतु रक्षतु । ॐ आं हूं फट् उग्रचण्डा रिपून् विघ्नान् विमर्दताम्
    ॥ ४१॥ ॐ आं लां पातु मां नित्यं वैष्णवी जगदीश्वरी । ॐ कं ब्रह्माणी पातु चक्रात् ॐ चं रुद्राणी तु शक्तितः
    ॥ ४२॥ ॐ टं कौमारी पातु वज्रात् ॐ तं वाराही तु काण्डतः । ॐ पं पातु नारसिंही मां क्रव्यादेभ्यस्तथास्त्रतः
    ॥ ४३॥ शस्त्रास्त्रेभ्यः समस्तेभ्यो यन्त्रेभ्योऽनिष्टमन्त्रतः । चण्डिका मां सदा पातु ॐ यं सं देव्यै
    नमो नमः ॥ ४४॥ विश्वासघातकेभ्यो मामैन्द्री रक्षतु मन्मनः । ॐ नमो महामायायै ॐ वैष्णव्यै नमो नमः । रक्ष
    मां सर्वभूतेभ्यः सर्वत्र परमेश्वरी ॥ ४५॥ आधारे वायुमार्गे हृदि कमलदले चन्द्रवत्स्मेरसूर्ये हस्तौ वह्नौ
    समिद्धे विशतु वरदयामन्त्रमष्टाक्षरं तत् । यद्ब्रह्मा मूर्ध्नि धत्ते हरिरवति गले चन्द्रचूडो हृदिस्थं
    तन्मां पातु प्रधानं निखिलमतिशयम्प्रद्मगर्भाभबीजम् ॥ ४६॥ आद्याः शेषाः स्वरौघैर्नमयबलवरैरस्वरेणापि युक्तैः
    सानुस्वारा विसर्गैर्हरिहरविदितं यत्सहस्रं च साष्टम् । मन्त्राणां सेतुबन्धं निवसति सततं वैष्णवीतन्त्रमन्त्रे
    तन्मां पायात्पवित्रं परमवरमजम्भूतलव्योमभागे ॥ ४७॥ अङ्गान्यष्टौ तथाष्टौ वसव इह तथैवाष्टमूर्तिर्दलानि
    प्रोक्तान्यष्टौ तथाष्टौ मधुमतिरचिताः सिद्धयोऽष्टौ तथैव । अष्टावष्टाष्टसङ्ख्या जगति रतिकलाः क्षिप्रकाष्टाङ्गयोगा
    मय्यष्टावक्षराणि क्षरतु सहिगणो यद्धृदोयस्त्वमूषाम् ॥ ४८॥ फलश्रुतिः
