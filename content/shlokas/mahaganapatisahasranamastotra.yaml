id: mahaganapatisahasranamastotra
category: sahasranama
name:
  english: mahaganapatisahasranamastotra
  devanagari: महागणपतिसहस्रनामस्तोत्र
content:
  english: padmanabhasamarcitah || 114|| udgitho naradantadhyamalabhushanabhushitah | narado varano lolashravanah
    shurpakashravah || 115|| brihadullasanasadhyavyaptatrailokyamandalah | ilamandalasambhrantakritanugrahajivakah
    || 116|| brihatkarnancalodbhutavayuvijitadiktatah | brihadasyaravakrantabhimabrahmandabhandakah ||
    117|| brihatpadasamakrantasaptapatalavepitah | brihaddantakritatyugrarananandarasalasah || 118|| brihaddhastadhritasheshayudhanirjitadanavah
    | sphuratsinduravadanah sphurattejo'gnilocanah || 119|| uddipitamanisphurjannupuradhvaninaditah |
    calattoyapravahadhyanadijalakanakulah || 120|| bhramatkunjarasanghatavanditanghrisaroruhah | brahmacyutamaharudrapurahsarasurarcitah
    || 121|| asheshasheshaprabhritivyalajalopasevitah | gurjatpancananaravapraptakashadharatalah || 122||
    hahahuhukritatyugrasuravibhrantamanasah | pancashadvarnabijadhyamantramantritavigrahah || 123|| vedantashastrapiyushadharaplavitabhutalah
    | shankhadhvanisamakrantapataladinabhastalah || 124|| cintamanirmahamallo bhallahasto balih kalih
    | kritatretayugollasabhasamanajagattrayah || 125|| dvaparah paralokaikakarmadhvantasudhakarah | sudhasiktavapurvyaptabrahmandadikatahakah
    || 126|| akaradikshakarantavarnapanktisamujjvalah | akarakaraprodgitataranadaninaditah || 127|| ikarekaramantradhyamalabhramanalalasah
    | ukarokaraprodgarighoranagopavitakah || 128|| rivarnankitarikarapadmadvayasamujjvalah | lrikarayutalrikarashankhapurnadigantarah
    || 129|| ekaraikaragirijastanapanavicakshanah | okaraukaravishvadikritasrishtikramalasah || 130||
    amahvarnavalivyaptapadadishirshamandalah | karnatalakritatyuccairvayuvijitanirjarah || 131|| khageshadhvajaratnankakiritarunapadakah
    | garvitasheshagandharvagitatatparashrotrakah || 132|| ghanavahanavagishapurahsarasurarcitah | navarnamritadharadhyashobhamanaikadantakah
    || 133|| candrakunkumajambalaliptasundaravigrahah | chatracamararatnadhyamukutalankritananah || 134||
    jatabaddhamahanarghamanipanktivirajitah | jhankarimadhupavratagananadaninaditah || 135|| navarnakritasamharadaityasrikpurnamudgarah
    | tankarukaphalasvadavepitasheshamurdhajah || 136|| thakaradhyadakarankadhakaranandatoshitah | navarnamritapiyushadharadharasudhadharah
    || 137|| tamrasindurapunjadhyalalataphalakacchavih | thakaradhanapanktyadhyasantoshitadvijavrajah
    || 138|| dayamayahridambhojadhritatrailokyamandalah | dhanadadimahayakshasamsevitapadambujah || 139||
    namitasheshadevaughakiritamaniranjitah | paravargapavargadimargacchedanadakshakah || 140|| phanicakrasamakrantagalamandalamanditah
    | baddhabhruyugabhimograsantarjitasurasurah || 141|| bhavanihridayanandavardhanaikanishakarah | madirakalashasphitakaralaikakarambujah
    || 142|| yajnantarayasanghataghatasajjikritayudhah | ratnakarasutakantakantikirtivivardhanah || 143||
    lambodaramahabhimavapurdinikritasurah | varunadidigishanaracitarcanacarcitah || 144|| shankaraikapriyapremanayananandavardhanah
    | shodashasvaritalapagitaganavicakshanah || 145|| samastadurgatisarinnathottaranakodupah | haradibrahmavaikunthabrahmagitadipathakah
    || 146|| kshamapuritahritpadmasamrakshitacaracarah | tarankamantravarnaikavigrahojjvalavigrahah ||
    147|| akaradikshakarantavidyabhushitavigrahah | om shrim vinayako om hrim vighnadhyaksho ganadhipah
    || 148|| herambo modakaharo vaktratundo vidhismritah | vedantagito vidyarthi shuddhamantrah shadaksharah
    || 149|| ganesho varado devo dvadashaksharamantritah | saptakotimahamantramantritasheshavigrahah ||
    150|| gangeyo ganasevyashca om shrim dvaimaturah shivah | om hrim shrim klim glaum gam devo mahaganapatih
    prabhuh
  devanagari: पद्मनाभसमर्चितः ॥ ११४॥ उद्गीथो नरदन्ताढ्यमालाभूषणभूषितः । नारदो वारणो लोलश्रवणः शूर्पकश्रवाः
    ॥ ११५॥ बृहदुल्लासनासाढ्यव्याप्तत्रैलोक्यमण्डलः । इलामण्डलसम्भ्रान्तकृतानुग्रहजीवकः ॥ ११६॥ बृहत्कर्णाञ्चलोद्भूतवायुवीजितदिक्तटः
    । बृहदास्यरवाक्रान्तभीमब्रह्माण्डभाण्डकः ॥ ११७॥ बृहत्पादसमाक्रान्तसप्तपातालवेपितः । बृहद्दन्तकृतात्युग्ररणानन्दरसालसः
    ॥ ११८॥ बृहद्धस्तधृताशेषायुधनिर्जितदानवः । स्फुरत्सिन्दूरवदनः स्फुरत्तेजोऽग्निलोचनः ॥ ११९॥ उद्दीपितमणिस्फूर्जन्नूपुरध्वनिनादितः
    । चलत्तोयप्रवाहाढ्यनदीजलकणाकुलः ॥ १२०॥ भ्रमत्कुञ्जरसङ्घातवन्दिताङ्घ्रिसरोरुहः । ब्रह्माच्युतमहारुद्रपुरःसरसुरार्चितः
    ॥ १२१॥ अशेषशेषप्रभृतिव्यालजालोपसेवितः । गूर्जत्पञ्चाननारावप्राप्ताकाशधरातलः ॥ १२२॥ हाहाहूहूकृतात्युग्रसुरविभ्रान्तमानसः
    । पञ्चाशद्वर्णबीजाढ्यमन्त्रमन्त्रितविग्रहः ॥ १२३॥ वेदान्तशास्त्रपीयूषधाराप्लावितभूतलः । शङ्खध्वनिसमाक्रान्तपातालादिनभस्तलः
    ॥ १२४॥ चिन्तामणिर्महामल्लो भल्लहस्तो बलिः कलिः । कृतत्रेतायुगोल्लासभासमानजगत्त्रयः ॥ १२५॥ द्वापरः
    परलोकैककर्मध्वान्तसुधाकरः । सुधासिक्तवपुर्व्याप्तब्रह्माण्डादिकटाहकः ॥ १२६॥ अकारादिक्षकारान्तवर्णपङ्क्तिसमुज्ज्वलः
    । अकाराकारप्रोद्गीततारनादनिनादितः ॥ १२७॥ इकारेकारमन्त्राढ्यमालाभ्रमणलालसः । उकारोकारप्रोद्गारिघोरनागोपवीतकः
    ॥ १२८॥ ऋवर्णाङ्कितॠकारपद्मद्वयसमुज्ज्वलः । लृकारयुतलॄकारशङ्खपूर्णदिगन्तरः ॥ १२९॥ एकारैकारगिरिजास्तनपानविचक्षणः
    । ओकारौकारविश्वादिकृतसृष्टिक्रमालसः ॥ १३०॥ अंअःवर्णावलीव्याप्तपादादिशीर्षमण्डलः । कर्णतालकृतात्युच्चैर्वायुवीजितनिर्जरः
    ॥ १३१॥ खगेशध्वजरत्नाङ्ककिरीटारुणपादकः । गर्विताशेषगन्धर्वगीततत्परश्रोत्रकः ॥ १३२॥ घनवाहनवागीशपुरःसरसुरार्चितः
    । ङवर्णामृतधाराढ्यशोभमानैकदन्तकः ॥ १३३॥ चन्द्रकुङ्कुमजम्बाललिप्तसुन्दरविग्रहः । छत्रचामररत्नाढ्यमुकुटालङ्कृताननः
    ॥ १३४॥ जटाबद्धमहानर्घमणिपङ्क्तिविराजितः । झाङ्कारिमधुपव्रातगाननादनिनादितः ॥ १३५॥ ञवर्णकृतसंहारदैत्यासृक्पूर्णमुद्गरः
    । टङ्कारुकफलास्वादवेपिताशेषमूर्धजः ॥ १३६॥ ठकाराढ्यडकाराङ्कढकारानन्दतोषितः । णवर्णामृतपीयूषधाराधरसुधाधरः
    ॥ १३७॥ ताम्रसिन्दूरपुञ्जाढ्यललाटफलकच्छविः । थकारधनपङ्क्त्याढ्यसन्तोषितद्विजव्रजः ॥ १३८॥ दयामयहृदम्भोजधृतत्रैलोक्यमण्डलः
    । धनदादिमहायक्षसंसेवितपदाम्बुजः ॥ १३९॥ नमिताशेषदेवौघकिरीटमणिरञ्जितः । परवर्गापवर्गादिमार्गच्छेदनदक्षकः
    ॥ १४०॥ फणिचक्रसमाक्रान्तगलमण्डलमण्डितः । बद्धभ्रूयुगभीमोग्रसन्तर्जितसुरासुरः ॥ १४१॥ भवानीहृदयानन्दवर्धनैकनिशाकरः
    । मदिराकलशस्फीतकरालैककराम्बुजः ॥ १४२॥ यज्ञान्तरायसङ्घातघातसज्जीकृतायुधः । रत्नाकरसुताकान्तकान्तिकीर्तिविवर्धनः
    ॥ १४३॥ लम्बोदरमहाभीमवपुर्दीनीकृतासुरः । वरुणादिदिगीशानरचितार्चनचर्चितः ॥ १४४॥ शङ्करैकप्रियप्रेमनयनानन्दवर्धनः
    । षोडशस्वरितालापगीतगानविचक्षणः ॥ १४५॥ समस्तदुर्गतिसरिन्नाथोत्तारणकोडुपः । हरादिब्रह्मवैकुण्ठब्रह्मगीतादिपाठकः
    ॥ १४६॥ क्षमापूरितहृत्पद्मसंरक्षितचराचरः । ताराङ्कमन्त्रवर्णैकविग्रहोज्ज्वलविग्रहः ॥ १४७॥ अकारादिक्षकारान्तविद्याभूषितविग्रहः
    । ॐ श्रीं विनायको ॐ ह्रीं विघ्नाध्यक्षो गणाधिपः ॥ १४८॥ हेरम्बो मोदकाहारो वक्त्रतुण्डो विधिस्मृतः ।
    वेदान्तगीतो विद्यार्थी शुद्धमन्त्रः षडक्षरः ॥ १४९॥ गणेशो वरदो देवो द्वादशाक्षरमन्त्रितः । सप्तकोटिमहामन्त्रमन्त्रिताशेषविग्रहः
    ॥ १५०॥ गाङ्गेयो गणसेव्यश्च ॐ श्रीं द्वैमातुरः शिवः । ॐ ह्रीं श्रीं क्लीं ग्लौं गं देवो महागणपतिः प्रभुः
