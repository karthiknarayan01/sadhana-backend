id: hamsopanishad
category: upanishad
name:
  english: hamsopanishad
  devanagari: हंसोपनिषद्
content:
  english: upanishad || hamsopanishat || om purnamadah purnamidam purnat purnamudacyate | purnasya purnamadaya
    purnamevavashishyate || om shantih shantih shantih || gautama uvaca | bhagavansarvadharmajna sarvashastravisharada
    | brahmavidyaprabodho hi kenopayena jayate || 1 || sanatkumara uvaca | vicarya sarvavedeshu matam
    jnatva pinakinah | parvatya kathitam tattvam shrinu gautama tanmama || 2 || anakhyeyamidam guhyam
    yoginam koshasannibham | hamsasyakritivistaram bhuktimuktiphalapradam || 3 || atha hamsaparamahamsanirnayam
    vyakhyasyamah | brahmacarine shantaya dantaya gurubhaktaya | hamsahamseti sada dhyayan || 4 || sarveshu
    deheshu vyapto vartate | yatha hyagnih kashtheshu tileshu tailamiva tam viditva mrityumatyeti || 5
    || gudamavashtabhyadharadvayumutthapyasvadhishthanam trih pradakshinikritya manipurakam ca gatva anahatamatikramya
    vishuddhau pranannirudhyajnamanudhyayanbrahmarandhram dhyayan trimatro'hamityeva sarvada pashyatyanakarashca
    bhavati || 6 || esho'sau paramahamso bhanukotipratikasho yenedam sarvam vyaptam || 7 || tasyashtadha
    vrittirbhavati | purvadale punye matih | agneye nidralasyadayo bhavanti | yamye kraurye matih | nairrite
    pape manisha | varunyam krida | vayavyam gamanadau buddhih | saumye ratipritih | ishanye dravyadanam
    | madhye vairagyam | kesare jagradavastha | karnikayam svapnam | linge sushuptih | padmatyage turiyam
    | yada hamse nado vilino bhavati tat turiyatitam || 8 || atho nadamadharadbrahmarandhraparyantam shuddhasphatikasankashah
    | sa vai brahma paramatmetyucyate || 1 || atha hamsa rishih | avyaktagayatri chandah | paramahamso
    devata | hamiti bijam | sa iti shaktih | so'hamiti kilakam || 10 || shat sankhyaya ahoratrayorekavimshatisahasrani
    shat shatanyadhikani bhavanti | suryaya somaya niranjanaya nirabhasayatanusukshmam pracodayaditi ||
    11 || agnishomabhyam vaushat hridayadyanganyasakaranyasau bhavatah || 12 || evam kritva hridaye ashtadale
    hamsatmanam dhyayet || 13 || agnishomau pakshavonkarah shiro ukaro bindu strinetram mukham rudro rudrani
    caranau | dvividham kanthatah kuryadityunmanah ajapopasamhara ityabhidhiyate || 14 || evam hamsavashattasmanmano
    hamso vicaryate || 15 || asyeva japakotyam nadamanubhavati evam sarvam hamsavashannado dashavidho
    jayate | ciniti prathamah | cinciniti dvitiyah | ghantanadastritiyah | shankhanadashcaturthah | pancamastantrinadah
    | shashthastalanadah | saptamo venunadah | ashtamo mridanganadah | navamo bherinadah | dashamo meghanadah
    || 16 || navamam parityajya dashamamevabhyaset || 17 || prathame cincinigatram dvitiye gatrabhanjanam
    | tritiye khedanam yati caturthe kampate shirah || 18 || pancame sravate talu shashthe'mritanishevanam
    | saptame gudhavijnanam para vaca tathashtame || 19 || adrishyam navame deham divyam cakshustathamalam
    | dashame paramam brahma bhavedbrahmatmasannidhau || 20 || tasminmano viliyate manasi sankalpavikalpe
    dagdhe punyapape sadashivah shaktyatma sarvatravasthitah svayamjyotih shuddho buddho nityo niranjanah
    shantah prakashata iti vedanuvacanam bhavatityupanishat || 21 || om purnamadah purnamidam purnat purnamudacyate
    | purnasya purnamadaya purnamevavashishyate || om shantih shantih shantih || || iti hamsopanishatsamapta
    || adhikadhyayanaya
  devanagari: उपनिषद् ॥ हंसोपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय
    पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ गौतम उवाच । भगवन्सर्वधर्मज्ञ सर्वशास्त्रविशारद । ब्रह्मविद्याप्रबोधो
    हि केनोपायेन जायते ॥ १ ॥ सनत्कुमार उवाच । विचार्य सर्ववेदेषु मतं ज्ञात्वा पिनाकिनः । पार्वत्या कथितं
    तत्त्वं शृणु गौतम तन्मम ॥ २ ॥ अनाख्येयमिदं गुह्यं योगिनां कोशसन्निभम् । हंसस्याकृतिविस्तारं भुक्तिमुक्तिफलप्रदम्
    ॥ ३ ॥ अथ हंसपरमहंसनिर्णयं व्याख्यास्यामः । ब्रह्मचारिणे शान्ताय दान्ताय गुरुभक्ताय । हंसहंसेति सदा
    ध्यायन् ॥ ४ ॥ सर्वेषु देहेषु व्याप्तो वर्तते । यथा ह्यग्निः काष्ठेषु तिलेषु तैलमिव तं विदित्वा मृत्युमत्येति
    ॥ ५ ॥ गुदमवष्टभ्याधाराद्वायुमुत्थाप्यस्वाधिष्ठानं त्रिः प्रदक्षिणीकृत्य मणिपूरकं च गत्वा अनाहतमतिक्रम्य
    विशुद्धौ प्राणान्निरुध्याज्ञामनुध्यायन्ब्रह्मरन्ध्रं ध्यायन् त्रिमात्रोऽहमित्येव सर्वदा पश्यत्यनाकारश्च
    भवति ॥ ६ ॥ एषोऽसौ परमहंसो भानुकोटिप्रतीकाशो येनेदं सर्वं व्याप्तम् ॥ ७ ॥ तस्याष्टधा वृत्तिर्भवति ।
    पूर्वदले पुण्ये मतिः । आग्नेये निद्रालस्यादयो भवन्ति । याम्ये क्रौर्ये मतिः । नैर्ऋते पापे मनीषा ।
    वारुण्यां क्रीडा । वायव्यां गमनादौ बुद्धिः । सौम्ये रतिप्रीतिः । ईशान्ये द्रव्यादानम् । मध्ये वैराग्यम्
    । केसरे जाग्रदवस्था । कर्णिकायां स्वप्नम् । लिङ्गे सुषुप्तिः । पद्मत्यागे तुरीयम् । यदा हंसे नादो
    विलीनो भवति तत् तुरीयातीतम् ॥ ८ ॥ अथो नादमाधाराद्ब्रह्मरन्ध्रपर्यन्तं शुद्धस्फटिकसङ्काशः । स वै ब्रह्म
    परमात्मेत्युच्यते ॥ १ ॥ अथ हंस ऋषिः । अव्यक्तगायत्री छन्दः । परमहंसो देवता । हमिति बीजम् । स इति शक्तिः
    । सोऽहमिति कीलकम् ॥ १० ॥ षट् सङ्ख्यया अहोरात्रयोरेकविंशतिसहस्राणि षट् शतान्यधिकानि भवन्ति । सूर्याय
    सोमाय निरञ्जनाय निराभासायतनुसूक्ष्मं प्रचोदयादिति ॥ ११ ॥ अग्नीषोमाभ्यां वौषट् हृदयाद्यङ्गन्यासकरन्यासौ
    भवतः ॥ १२ ॥ एवं कृत्वा हृदये अष्टदले हंसात्मानं ध्यायेत् ॥ १३ ॥ अग्नीषोमौ पक्षावोङ्कारः शिरो उकारो
    बिन्दु स्त्रिनेत्रं मुखं रुद्रो रुद्राणी चरणौ । द्विविधं कण्ठतः कुर्यादित्युन्मनाः अजपोपसंहार इत्यभिधीयते
    ॥ १४ ॥ एवं हंसवशात्तस्मान्मनो हंसो विचार्यते ॥ १५ ॥ अस्येव जपकोट्यां नादमनुभवति एवं सर्वं हंसवशान्नादो
    दशविधो जायते । चिणीति प्रथमः । चिञ्चिणीति द्वितीयः । घण्टानादस्तृतीयः । शङ्खनादश्चतुर्थः । पञ्चमस्तन्त्रीनादः
    । षष्ठस्तालनादः । सप्तमो वेणुनादः । अष्टमो मृदङ्गनादः । नवमो भेरीनादः । दशमो मेघनादः ॥ १६ ॥ नवमं परित्यज्य
    दशममेवाभ्यसेत् ॥ १७ ॥ प्रथमे चिञ्चिणीगात्रं द्वितीये गात्रभञ्जनम् । तृतीये खेदनं याति चतुर्थे कम्पते
    शिरः ॥ १८ ॥ पञ्चमे स्रवते तालु षष्ठेऽमृतनिषेवणम् । सप्तमे गूढविज्ञानं परा वाचा तथाष्टमे ॥ १९ ॥ अदृश्यं
    नवमे देहं दिव्यं चक्षुस्तथामलम् । दशमे परमं ब्रह्म भवेद्ब्रह्मात्मसन्निधौ ॥ २० ॥ तस्मिन्मनो विलीयते
    मनसि सङ्कल्पविकल्पे दग्धे पुण्यपापे सदाशिवः शक्त्यात्मा सर्वत्रावस्थितः स्वयंज्योतिः शुद्धो बुद्धो
    नित्यो निरञ्जनः शान्तः प्रकाशत इति वेदानुवचनं भवतीत्युपनिषत् ॥ २१ ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्
    पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति हंसोपनिषत्समाप्ता
    ॥ अधिकाध्ययनाय
