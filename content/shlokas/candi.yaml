id: candi
category: stotram
name:
  english: candi
  devanagari: चन्दि
content:
  english: shricandipathah || om shri devaih namah || || atha camdipathah || ya devi sarvabhuteshu vishnumayeti
    shabdita | namastasyai 14 namastasyai 15 namastasyai namo namah || 5
  devanagari: श्रीचण्डीपाठः ॥ ॐ श्री देवैः नमः ॥ ॥ अथ चंडीपाठः ॥ या देवी सर्वभूतेषु विष्णुमायेति शब्दिता
    । नमस्तस्यै १४ नमस्तस्यै १५ नमस्तस्यै नमो नमः ॥ ५
