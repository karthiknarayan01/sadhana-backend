id: lakshmanakavacaananda
category: kavacha
name:
  english: lakshmanakavacaananda
  devanagari: लक्ष्मनकवचआनन्द
content:
  english: ramaprishthasthitam ramyam ratnakundaladharinam | nilotpaladaḻashyamam ratnakankanamanditam
    || 1|| ramasya mastake divyam bibhrantam chatramuttamam | varapitambaradharam mukutenadhishobhitam
    || 2|| tunire karmuke capi bibhrantam ca smitananam | ratnamaladharam divyam pushpamalavirajitam ||
    3|| evam dhyatva lakshmanam ca raghavanyastalocanam | kavacam japaniyam hi tato bhaktyatra manavaih
    || 4|| atha kavacam | om lakshmanah patu me purve dakshine raghavanujah | praticyam patu saumitrih
    patudicyam raghuttamah || 5|| adhah patu mahavirah cordhvam patu nripatmajah | madhye patu ramadasah
    sarvatah satyapalakah || 6|| smitananah shirah patu bhalam paturmiladhavah | bhruvormadhye dhanurdhari
    sumitranandano'kshini || 7|| kapole ramamantri ca sarvada patu vai mama | karnamule sada patu kabandhabhujakhandanah
    || 8|| nasagram me sada patu sumitra''nandavardhanah | ramanyastekshanah patu sada me'tra mukham bhuvi
    || 9|| sitavakyakarah patu mama vanim sada'tra hi | saumyarupah patu jihvam anantah patu me dvijan
    || 10|| cibukam patu rakshoghnah kantham patvasurardanah | skandhau patu jitaratih bhujau pankajalocanah
    || 11|| karau kankanadhari ca nakhan raktanakho'vatu | kukshim patu vinidro me vakshah patu jitendriyah
    || 12|| parshve raghavaprishthasthah prishthadesham manoramah | nabhim gambhiranabhistu katim ca rukmamekhalah
    || 13|| guhyam patu sahasrasyah patu lingam haripriyah | uru patu vishnutalpah sumukho'vatu januni
    || 14|| nagendrah patu me janghe gulphau nupuravan mama | padavangadatato'vyat patvangani sulocanah
    || 15|| citraketupita patu mama padangulih sada | romani me sada patu ravivamshasamudbhavah || 16||
    dasharathasutah patu nishayam mama sadaram | bhugoladhari mam patu divase divase sada || 17|| sarvakaleshu
    mamindrajiddhanta'vatu sarvada | evam saumitrikavacam sutikshna kathitam maya || 18|| idam pratah
    samutthaya ye pathantyatra manavah | te dhanya manava loke tesham ca saphalo bhavah || 19|| saumitreh
    kavacasyasya pathanannishcayena hi | putrarthi labhate putran dhanarthi dhanamapnuyat || 20|| patnikamo
    labhetpatnim godhanarthi tu godhanam | dhanyarthi prapnuyaddhanyam rajyarthi rajyamapnuyat || 21||
    pathitam ramakavacam saumitrikavacam vina | ghritena hino naivedyastena datto na samyashayah || 22||
    kevalam ramakavacam pathitam manavairyadi | tatpathena susantushto na bhavedraghunandanah || 23||
    atah prayatnatashcedam saumitrikavacam naraih | pathaniyam sarvadaiva sarvavanchitadayakam || 24||
    iti shrishatakotiramacaritantargate shrimadanandaramayane valmikiye manoharakande pancadashasargantargatam
    shrilakshmanakavacam sampurnam || hanumat
  devanagari: रामपृष्ठस्थितं रम्यं रत्नकुण्डलधारिणम् । नीलोत्पलदळश्यामं रत्नकङ्कणमण्डितम् ॥ १॥ रामस्य
    मस्तके दिव्यं बिभ्रन्तं छत्रमुत्तमम् । वरपीताम्बरधरं मुकुटेनाधिशोभितम् ॥ २॥ तूणीरे कार्मुके चापि बिभ्रन्तं
    च स्मिताननम् । रत्नमालाधरं दिव्यं पुष्पमालाविराजितम् ॥ ३॥ एवं ध्यात्वा लक्ष्मणं च राघवन्यस्तलोचनम्
    । कवचं जपनीयं हि ततो भक्त्यात्र मानवैः ॥ ४॥ अथ कवचम् । ॐ लक्ष्मणः पातु मे पूर्वे दक्षिणे राघवानुजः
    । प्रतीच्यां पातु सौमित्रिः पातूदीच्यां रघूत्तमः ॥ ५॥ अधः पातु महावीरः चोर्ध्वं पातु नृपात्मजः । मध्ये
    पातु रामदासः सर्वतः सत्यपालकः ॥ ६॥ स्मिताननः शिरः पातु भालं पातूर्मिलाधवः । भ्रुवोर्मध्ये धनुर्धारी
    सुमित्रानन्दनोऽक्षिणी ॥ ७॥ कपोले रममन्त्री च सर्वदा पातु वै मम । कर्णमूले सदा पातु कबन्धभुजखण्डनः
    ॥ ८॥ नासाग्रं मे सदा पातु सुमित्राऽऽनन्दवर्धनः । रामन्यस्तेक्षणः पातु सदा मेऽत्र मुखं भुवि ॥ ९॥ सीतावाक्यकरः
    पातु मम वाणीं सदाऽत्र हि । सौम्यरूपः पातु जिह्वां अनन्तः पातु मे द्विजान् ॥ १०॥ चिबुकं पातु रक्षोघ्नः
    कण्ठं पात्वसुरार्दनः । स्कन्धौ पातु जितारातिः भुजौ पङ्कजलोचनः ॥ ११॥ करौ कङ्कणधारी च नखान् रक्तनखोऽवतु
    । कुक्षिं पातु विनिद्रो मे वक्षः पातु जितेन्द्रियः ॥ १२॥ पार्श्वे राघवपृष्ठस्थः पृष्ठदेशं मनोरमः ।
    नाभिं गम्भीरनाभिस्तु कटिं च रुक्ममेखलः ॥ १३॥ गुह्यं पातु सहस्रास्यः पातु लिङ्गं हरिप्रियः । ऊरू पातु
    विष्णुतल्पः सुमुखोऽवतु जानुनी ॥ १४॥ नागेन्द्रः पातु मे जङ्घे गुल्फौ नूपुरवान् मम । पादावङ्गदतातोऽव्यात्
    पात्वङ्गानि सुलोचनः ॥ १५॥ चित्रकेतुपिता पातु मम पादाङ्गुलीः सदा । रोमाणि मे सदा पातु रविवंशसमुद्भवः
    ॥ १६॥ दशरथसुतः पातु निशायां मम सादरम् । भूगोलधारी मां पातु दिवसे दिवसे सदा ॥ १७॥ सर्वकालेषु मामिन्द्रजिद्धन्ताऽवतु
    सर्वदा । एवं सौमित्रिकवचं सुतीक्ष्ण कथितं मया ॥ १८॥ इदं प्रातः समुत्थाय ये पठन्त्यत्र मानवाः । ते
    धन्या मानवा लोके तेषां च सफलो भवः ॥ १९॥ सौमित्रेः कवचस्यास्य पठनान्निश्चयेन हि । पुत्रार्थी लभते पुत्रान्
    धनार्थी धनमाप्नुयात् ॥ २०॥ पत्नीकामो लभेत्पत्नीं गोधनार्थी तु गोधनम् । धान्यार्थी प्राप्नुयाद्धान्यं
    राज्यार्थी राज्यमाप्नुयात् ॥ २१॥ पठितं रामकवचं सौमित्रिकवचं विना । घृतेन हीनो नैवेद्यस्तेन दत्तो न
    संयशयः ॥ २२॥ केवलं रामकवचं पठितं मानवैर्यदि । तत्पाठेन सुसन्तुष्टो न भवेद्रघुनन्दनः ॥ २३॥ अतः प्रयत्नतश्चेदं
    सौमित्रिकवचं नरैः । पठनीयं सर्वदैव सर्ववाञ्छितदायकम् ॥ २४॥ इति श्रीशतकोटिरामचरितान्तर्गते श्रीमदानन्दरामायणे
    वाल्मीकीये मनोहरकाण्डे पञ्चदशसर्गान्तर्गतं श्रीलक्ष्मणकवचं सम्पूर्णम् ॥ हनुमत्
