id: nava-graha-peedahara-stotram
category: stotram
name:
  english: Nava Graha Peedahara Stotram
content:
  english: grahanamadiradityo lokarakshanakarakah | vishamasthanasambhutam pidam haratu me ravih || ||
    rohinishah sudhamurtih sudhagatrah sudhashanah | vishamasthanasambhutam pidam haratu me vidhuh ||
    || bhumiputro mahateja jagatam bhayakrit sada | vrishtikridvrishtiharta ca pidam haratu me kujah ||
    || utpatarupo jagatam candraputro mahadyutih | suryapriyakaro vidvan pidam haratu me budhah || ||
    devamantri vishalakshah sada lokahite ratah | anekashishyasampurnah pidam haratu me guruh || || daityamantri
    gurustesham pranadashca mahamatih | prabhustaragrahanam ca pidam haratu me bhriguh || || suryaputro
    dirghadeho vishalakshah shivapriyah | mandacarah prasannatma pidam haratu me shanih || || mahashira
    mahavaktro dirghadamshtro mahabalah | atanushcordhvakeshashca pidam haratu me shikhi || || anekarupavarnaishca
    shatasho'tha sahasrashah | utpatarupo jagatam pidam haratu me tamah ||
  devanagari: ग्रहाणामादिरादित्यो लोकरक्षणकारकः । विषमस्थानसम्भूतां पीडां हरतु मे रविः ॥ ॥ रोहिणीशः सुधामूर्तिः
    सुधागात्रः सुधाशनः । विषमस्थानसम्भूतां पीडां हरतु मे विधुः ॥ ॥ भूमिपुत्रो महातेजा जगतां भयकृत् सदा
    । वृष्टिकृद्वृष्टिहर्ता च पीडां हरतु मे कुजः ॥ ॥ उत्पातरूपो जगतां चन्द्रपुत्रो महाद्युतिः । सूर्यप्रियकरो
    विद्वान् पीडां हरतु मे बुधः ॥ ॥ देवमन्त्री विशालाक्षः सदा लोकहिते रतः । अनेकशिष्यसम्पूर्णः पीडां हरतु
    मे गुरुः ॥ ॥ दैत्यमन्त्री गुरुस्तेषां प्राणदश्च महामतिः । प्रभुस्ताराग्रहाणां च पीडां हरतु मे भृगुः
    ॥ ॥ सूर्यपुत्रो दीर्घदेहो विशालाक्षः शिवप्रियः । मन्दचारः प्रसन्नात्मा पीडां हरतु मे शनिः ॥ ॥ महाशिरा
    महावक्त्रो दीर्घदंष्ट्रो महाबलः । अतनुश्चोर्ध्वकेशश्च पीडां हरतु मे शिखी ॥ ॥ अनेकरूपवर्णैश्च शतशोऽथ
    सहस्रशः । उत्पातरूपो जगतां पीडां हरतु मे तमः ॥
