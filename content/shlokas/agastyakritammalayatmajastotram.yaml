id: agastyakritammalayatmajastotram
category: stotram
name:
  english: agastyakritammalayatmajastotram
  devanagari: अगस्त्यकृतंमलयात्मजास्तोत्रम्
content:
  english: agastyakritam malayatmajastotram iti vaca kumbhayonih bahumanya punahpunah | natvaivanjalina
    devim tushtava malayatmajam || 60|| namastubhyamabrahmakitam vishvam papatpalayanti payobhih | tirthakara
    tvam drishyase tvam prakritya sukshmakara drishyase vedavagbhih || 61|| tredha bhanktva svam tanum
    dyotayantim ganga krishna bharatiti prashastim | bhaktanasman papatah pahi matastamre sampatsadhane
    tvam samartha || 62|| ashailabdhim srotasam yo dadhara piyushena prajyakuladvaye te | stanyakshirenaiva
    lokam punana matastamre devi nitya bhava tvam || 63|| ityabhishtuya tamram devimatrih paramadharmavit
    | anasuyasamayukto dhyanarudho'bhavat punah || 64|| iti tamraparnimahatmye saptamamadhyayantargatam
    agastyakritam malayatmajastotram sampurnam | tamraparnimahatmya | adhyaya 7
  devanagari: अगस्त्यकृतं मलयात्मजास्तोत्रम् इति वाचा कुम्भयोनिः बहुमान्य पुनःपुनः । नत्वैवाञ्जलिना देवीं
    तुष्टाव मलयात्मजाम् ॥ ६०॥ नमस्तुभ्यमाब्रह्मकीटं विश्वं पापात्पालयन्ती पयोभिः । तीर्थाकारा त्वं दृश्यसे
    त्वं प्रकृत्या सूक्ष्माकारा दृश्यसे वेदवाग्भिः ॥ ६१॥ त्रेधा भङ्क्त्वा स्वां तनुं द्योतयन्तीं गङ्गा
    कृष्णा भारतीति प्रशस्तिम् । भक्तानस्मान् पापतः पाहि मातस्ताम्रे सम्पत्साधने त्वं समर्था ॥ ६२॥ आशैलाब्धिं
    स्रोतसां यो दधारा पीयूषेण प्राज्यकूलद्वये ते । स्तन्यक्षीरेणैव लोकं पुनाना मातस्ताम्रे देवि नित्या
    भव त्वम् ॥ ६३॥ इत्यभिष्टूय ताम्रां देवीमत्रिः परमधर्मवित् । अनसूयासमायुक्तो ध्यानारूढोऽभवत् पुनः ॥
    ६४॥ इति ताम्रपर्णीमाहात्म्ये सप्तमामाध्यायान्तर्गतं अगस्त्यकृतं मलयात्मजास्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य
    । अध्याय ७
