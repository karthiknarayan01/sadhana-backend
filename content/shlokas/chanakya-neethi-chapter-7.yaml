id: chanakya-neethi-chapter-7
category: stotram
name:
  english: Chanakya Neethi - Chapter 7
content:
  english: arthanasham manastapam grihe dushcaritani ca | vancanam capamanam ca matimanna prakashayet
    || || dhanadhanyaprayogeshu vidyasangrahane tatha | ahare vyavahare ca tyaktalajjah sukhi bhavet ||
    || santoshamritatriptanam yatsukham shantireva ca | na ca taddhanalubdhanamitashcetashca dhavatam
    || || santoshastrishu kartavyah svadare bhojane dhane | trishu caiva na kartavyo'dhyayane japadanayoh
    || || viprayorvipravahnyoshca dampatyoh svamibhrityayoh | antarena na gantavyam halasya vrishabhasya
    ca || || padabhyam na sprishedagnim gurum brahmanameva ca | naiva gam na kumarim ca na vriddham na
    shishum tatha || || shakatam pancahastena dashahastena vajinam | gajam hastasahasrena deshatyagena
    durjanam || || hasti ankushamatrena vaji hastena tadyate | shringi lagudahastena khadgahastena durjanah
    || || tushyanti bhojane vipra mayura ghanagarjite | sadhavah parasampattau khalah paravipattishu ||
    || anulomena balinam pratilomena durjanam | atmatulyabalam shatrum vinayena balena va || || bahuviryam
    balam rajnam brahmano brahmavidbali | rupayauvanamadhuryam strinam balamanuttamam || || natyantam
    saralairbhavyam gatva pashya vanasthalim | chidyante saralastatra kubjastishthanti padapah || || yatrodakam
    tatra vasanti hamsa stathaiva shushkam parivarjayanti | na hamsatulyena narena bhavyam punastyajantah
    punarashrayante || || uparjitanam vittanam tyaga eva hi rakshanam | tadagodarasamsthanam parivaha
    ivambhasam || || yasyarthastasya mitrani yasyarthastasya bandhavah | yasyarthah sa puma~lloke yasyarthah
    sa ca panditah || || svargasthitanamiha jivaloke catvari cihnani vasanti dehe | danaprasango madhura
    ca vani devarcanam brahmanatarpanam ca || || atyantakopah katuka ca vani daridrata ca svajaneshu vairam
    | nicaprasangah kulahinaseva cihnani dehe narakasthitanam || || gamyate yadi mrigendramandiram labhyate
    karikapalamauktikam | jambukalayagate ca prapyate vatsapucchakharacarmakhandanam || || shunah pucchamiva
    vyartham jivitam vidyaya vina | na guhyagopane shaktam na ca damshanivarane || || vacam shaucam ca
    manasah shaucamindriyanigrahah | sarvabhutadayashaucametacchaucam pararthinam || || pushpe gandham
    tile tailam kashthe'gnim payasi ghritam | ikshau gudam tatha dehe pashyatmanam vivekatah ||
  devanagari: अर्थनाशं मनस्तापं गृहे दुश्चरितानि च । वञ्चनं चापमानं च मतिमान्न प्रकाशयेत् ॥ ॥ धनधान्यप्रयोगेषु
    विद्यासङ्ग्रहणे तथा । आहारे व्यवहारे च त्यक्तलज्जः सुखी भवेत् ॥ ॥ सन्तोषामृततृप्तानां यत्सुखं शान्तिरेव
    च । न च तद्धनलुब्धानामितश्चेतश्च धावताम् ॥ ॥ सन्तोषस्त्रिषु कर्तव्यः स्वदारे भोजने धने । त्रिषु चैव
    न कर्तव्योऽध्ययने जपदानयोः ॥ ॥ विप्रयोर्विप्रवह्न्योश्च दम्पत्योः स्वामिभृत्ययोः । अन्तरेण न गन्तव्यं
    हलस्य वृषभस्य च ॥ ॥ पादाभ्यां न स्पृशेदग्निं गुरुं ब्राह्मणमेव च । नैव गां न कुमारीं च न वृद्धं न
    शिशुं तथा ॥ ॥ शकटं पञ्चहस्तेन दशहस्तेन वाजिनम् । गजं हस्तसहस्रेण देशत्यागेन दुर्जनम् ॥ ॥ हस्ती अङ्कुशमात्रेण
    वाजी हस्तेन ताड्यते । शृङ्गी लगुडहस्तेन खड्गहस्तेन दुर्जनः ॥ ॥ तुष्यन्ति भोजने विप्रा मयूरा घनगर्जिते
    । साधवः परसम्पत्तौ खलाः परविपत्तिषु ॥ ॥ अनुलोमेन बलिनं प्रतिलोमेन दुर्जनम् । आत्मतुल्यबलं शत्रुं विनयेन
    बलेन वा ॥ ॥ बाहुवीर्यं बलं राज्ञां ब्रह्मणो ब्रह्मविद्बली । रूपयौवनमाधुर्यं स्त्रीणां बलमनुत्तमम्
    ॥ ॥ नात्यन्तं सरलैर्भाव्यं गत्वा पश्य वनस्थलीम् । छिद्यन्ते सरलास्तत्र कुब्जास्तिष्ठन्ति पादपाः ॥
    ॥ यत्रोदकं तत्र वसन्ति हंसा स्तथैव शुष्कं परिवर्जयन्ति । न हंसतुल्येन नरेण भाव्यं पुनस्त्यजन्तः पुनराश्रयन्ते
    ॥ ॥ उपार्जितानां वित्तानां त्याग एव हि रक्षणम् । तडागोदरसंस्थानां परीवाह इवाम्भसाम् ॥ ॥ यस्यार्थास्तस्य
    मित्राणि यस्यार्थास्तस्य बान्धवाः । यस्यार्थाः स पुमाँल्लोके यस्यार्थाः स च पण्डितः ॥ ॥ स्वर्गस्थितानामिह
    जीवलोके चत्वारि चिह्नानि वसन्ति देहे । दानप्रसङ्गो मधुरा च वाणी देवार्चनं ब्राह्मणतर्पणं च ॥ ॥ अत्यन्तकोपः
    कटुका च वाणी दरिद्रता च स्वजनेषु वैरम् । नीचप्रसङ्गः कुलहीनसेवा चिह्नानि देहे नरकस्थितानाम् ॥ ॥ गम्यते
    यदि मृगेन्द्रमन्दिरं लभ्यते करिकपालमौक्तिकम् । जम्बुकालयगते च प्राप्यते वत्सपुच्छखरचर्मखण्डनम् ॥ ॥
    शुनः पुच्छमिव व्यर्थं जीवितं विद्यया विना । न गुह्यगोपने शक्तं न च दंशनिवारणे ॥ ॥ वाचां शौचं च मनसः
    शौचमिन्द्रियनिग्रहः । सर्वभूतदयाशौचमेतच्छौचं परार्थिनाम् ॥ ॥ पुष्पे गन्धं तिले तैलं काष्ठेऽग्निं पयसि
    घृतम् । इक्षौ गुडं तथा देहे पश्यात्मानं विवेकतः ॥
