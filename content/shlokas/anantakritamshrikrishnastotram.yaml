id: anantakritamshrikrishnastotram
category: stotram
name:
  english: anantakritamshrikrishnastotram
  devanagari: अनन्तकृतंश्रीकृष्णस्तोत्रम्
content:
  english: anantakritam shrikrishnastotram ananta uvaca | tvamananto hi bhagavannahameva kalamshakah |
    vishvaikasthe kshudrakurme mashako'ham gaje yatha || 24|| asankhyasheshah kurmashca brahmavishnushivatmakah
    | asankhyani ca vishvani teshamishah svayam bhavan || 25|| asmakamidrisham natha sudinam kva bhavishyati
    | svapnadrishtashca yashceshah sa drishtah sarvajivinam || 26|| natha prayasi golokam putam kritva
    vasundharam | tamanatham rudantim ca nimagnam shokasagare || 27|| iti brahmavaivartapurane shrikrishnajanmakhande
    purvabhage ekonatrimshadhikashatatamadhyayantargatam anantakritam shrikrishnastotram samaptam | brahmavaivartapurana
    | shrikrishnajanma
  devanagari: अनन्तकृतं श्रीकृष्णस्तोत्रम् अनन्त उवाच । त्वमनन्तो हि भगवन्नाहमेव कलांशकः । विश्वैकस्थे
    क्षुद्रकूर्मे मशकोऽहं गजे यथा ॥ २४॥ असङ्ख्यशेषाः कूर्माश्च ब्रह्मविष्णुशिवात्मकाः । असङ्ख्यानि च विश्वानि
    तेषामीशः स्वयं भवान् ॥ २५॥ अस्माकमीदृशं नाथ सुदिनं क्व भविष्यति । स्वप्नादृष्टश्च यश्चेशः स दृष्टः
    सर्वजीविनाम् ॥ २६॥ नाथ प्रयासि गोलोकं पूतां कृत्वा वसुन्धराम् । तामनाथां रुदन्तीं च निमग्नां शोकसागरे
    ॥ २७॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वभागे एकोनत्रिंशाधिकशततमाध्यायान्तर्गतं अनन्तकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
meaning: {}
