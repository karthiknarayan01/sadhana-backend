id: mumukshubhyahhariproktahmantrah
category: mantra
name:
  english: mumukshubhyahhariproktahmantrah
  devanagari: मुमुक्षुभ्यःहरिप्रोक्ताःमन्त्राः
content:
  english: '|| 108|| ityetebhyo dadau mantran mumukshubhyah svayam harih | atha sarve yayustatrajnapta
    vai pancamakratoh || 109|| iti shrilakshminarayaniyasamhita | khanda 2| adhyaya 130'
  devanagari: ॥ १०८॥ इत्येतेभ्यो ददौ मन्त्रान् मुमुक्षुभ्यः स्वयं हरिः । अथ सर्वे ययुस्तत्राज्ञप्ता वै
    पञ्चमक्रतोः ॥ १०९॥ इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय १३०
meaning: {}
