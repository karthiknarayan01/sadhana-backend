id: lomashamuniproktambalakrishnakavacam
category: kavacha
name:
  english: lomashamuniproktambalakrishnakavacam
  devanagari: लोमशमुनिप्रोक्तंबालकृष्णकवचम्
content:
  english: balakrishno'stu me pracyam cakrahetih pareshvarah || 36|| gadadharo balakrishno dakshine me'stu
    sarvada | pashcime sharngadhrika krishnanarayano'stu me sada || 37|| uttare khadgadhrik krishnanarayano'stu
    me sada | koneshvastu hrishikesho madhye madhye janardanah || 38|| prithvyam varaharupo'stu vyomni
    naraharih prabhuh | kshuradhara'titikshnam ca sudarshanam samantatah || 39|| pretabhutan prahantveva
    rakshasa~shca nishacaran | gada sahasradharordhvam hantu vrikan pishacakan || 40|| sharngam dhanurharestiryakkushmandadin
    prahantu ca | yakshan daityan jrimbhaka~shca khagan kruran vinayakan || 41|| shankho vishnorninadena
    hantu dushta~shca pannagan | simhan vyaghran sharabha~shca dandashukan pashu~statha || 42|| vishnoh
    padmam mama shatrun saumyan dadhatu gandhatah | cittavrittiharan smrityaharan balaujasam haran ||
    43|| sampadbhogahara~shcapi shubhalakshanaharakan | striputradhanasadanaharan prashamayatvapi || 44||
    hareh sankirtanacca'stu svasthyamaindriyakam mama | buddhisvasthyam manahsvasthyam dehasvasthyam sukhavaham
    || 45|| prishthe cagre parshvayoshca koneshvastu harirmama | shikhayam me nakheshveshah carmasvastu
    harirmama
  devanagari: बालकृष्णोऽस्तु मे प्राच्यां चक्रहेतिः परेश्वरः ॥ ३६॥ गदाधरो बालकृष्णो दक्षिणे मेऽस्तु सर्वदा
    । पश्चिमे शार्ङ्गधृक कृष्णनारायणोऽस्तु मे सदा ॥ ३७॥ उत्तरे खड्गधृक् कृष्णनारायणोऽस्तु मे सदा । कोणेष्वस्तु
    हृषीकेशो मध्ये मध्ये जनार्दनः ॥ ३८॥ पृथ्व्यां वराहरूपोऽस्तु व्योम्नि नरहरिः प्रभुः । क्षुरधाराऽतितीक्ष्णं
    च सुदर्शनं समन्ततः ॥ ३९॥ प्रेतभूतान् प्रहन्त्वेव राक्षसाँश्च निशाचरान् । गदा सहस्रधारोर्ध्वं हन्तु
    वृकान् पिशाचकान् ॥ ४०॥ शार्ङ्गं धनुर्हरेस्तिर्यक्कुष्माण्डादीन् प्रहन्तु च । यक्षान् दैत्यान् जृम्भकाँश्च
    खगान् क्रूरान् विनायकान् ॥ ४१॥ शङ्खो विष्णोर्निनादेन हन्तु दुष्टाँश्च पन्नगान् । सिंहान् व्याघ्रान्
    शरभाँश्च दन्दशूकान् पशूँस्तथा ॥ ४२॥ विष्णोः पद्मं मम शत्रून् सौम्यान् दधातु गन्धतः । चित्तवृत्तिहरान्
    स्मृत्याहरान् बलौजसां हरान् ॥ ४३॥ सम्पद्भोगहराँश्चापि शुभलक्षणहारकान् । स्त्रीपुत्रधनसदनहरान् प्रशामयत्वपि
    ॥ ४४॥ हरेः सङ्कीर्तनाच्चाऽस्तु स्वास्थ्यमैन्द्रियकं मम । बुद्धिस्वास्थ्यं मनःस्वास्थ्यं देहस्वास्थ्यं
    सुखावहम् ॥ ४५॥ पृष्ठे चाग्रे पार्श्वयोश्च कोणेष्वस्तु हरिर्मम । शिखायां मे नखेष्वेषः चर्मस्वस्तु हरिर्मम
