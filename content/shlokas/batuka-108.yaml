id: batuka-108
category: stotram
name:
  english: batuka 108
  devanagari: बतुक १०८
content:
  english: shribatukabhairavashtottarashatanamavalih om asya shri batukabhairavashtottarashatanama mantrasya
    brihadaranyaka rishih | anushtup chandah | shri batukabhairavo devata | bam bijam | hrim shaktih|
    pranava kilakam | shri batukabhairava prityartham ebhirdravyaih prithak nama mantrena havane viniyogah
    | tatradau hram bam iti karanyasam hridayadi nyasam ca kritva dhyatva gandhakshataih sampujya havanam
    kuryyat | om bhairavaya namah | om bhutanathaya namah | om bhutatmane namah | om bhutabhavanaya namah
    | om kshetrajnaya namah | om kshetrapalaya namah | om kshetradaya namah | om kshatriyaya namah | om
    viraji namah | om shmashana vasine namah | 10 om mamsashine namah | om kharvarashine namah | om smarantakaya
    namah | om raktapaya namah | om panapaya namah | om siddhaya namah | om siddhidaya namah | om siddhisevitaya
    namah | om kankalaya namah | om kalashamanaya namah | 20 om kalakashthaya namah | om tanaye namah
    | om kavaye namah | om trinetraya namah | om bahunetraya namah | om pingalalocanaya namah | om shulapanaye
    namah | om khadgapanaye namah | om kapaline namah | om dhumralocanaya namah | 30 om abhirave namah
    | om bhairavinathaya namah | om bhutapaya namah | om yoginipataye namah | om dhanadaya namah | om
    adhanaharine namah | om dhanavate namah | om pritivardhanaya namah | om nagaharaya namah | om nagapashaya
    namah | 40 om vyomakeshaya namah | om kapalabhrite namah | om kalaya namah | om kapalamaline namah
    | om kamaniyaya namah | om kalanidhaye namah | om trilocanaya namah | om jvalannetraya namah | om
    trishikhine namah | om trilokapaya namah | 50
  devanagari: श्रीबटुकभैरवाष्टोत्तरशतनामवलिः ॐ अस्य श्री बटुकभैरवाष्टोत्तरशतनाम मन्त्रस्य बृहदारण्यक ऋषिः
    । अनुष्टुप् छन्दः । श्री बटुकभैरवो देवता । बं बीजम् । ह्रीं शक्तिः। प्रणव कीलकम् । श्री बटुकभैरव प्रीत्यर्थं
    एभिर्द्रव्यैः पृथक् नाम मन्त्रेण हवने विनियोगः । तत्रादौ ह्रां बां इति करन्यासं हृदयादि न्यासं च कृत्वा
    ध्यात्वा गन्धाक्षतैः सम्पुज्य हवनं कुर्य्यात् । ॐ भैरवाय नमः । ॐ भूतनाथाय नमः । ॐ भूतात्मने नमः ।
    ॐ भूतभावनाय नमः । ॐ क्षेत्रज्ञाय नमः । ॐ क्षेत्रपालाय नमः । ॐ क्षेत्रदाय नमः । ॐ क्षत्रियाय नमः ।
    ॐ विरजि नमः । ॐ श्मशान वासिने नमः । १० ॐ मांसाशिने नमः । ॐ खर्वराशिने नमः । ॐ स्मरान्तकाय नमः । ॐ
    रक्तपाय नमः । ॐ पानपाय नमः । ॐ सिद्धाय नमः । ॐ सिद्धिदाय नमः । ॐ सिद्धिसेविताय नमः । ॐ कङ्कालाय नमः
    । ॐ कालाशमनाय नमः । २० ॐ कलाकाष्ठाय नमः । ॐ तनये नमः । ॐ कवये नमः । ॐ त्रिनेत्राय नमः । ॐ बहुनेत्राय
    नमः । ॐ पिङ्गललोचनाय नमः । ॐ शूलपाणये नमः । ॐ खड्गपाणये नमः । ॐ कपालिने नमः । ॐ धूम्रलोचनाय नमः ।
    ३० ॐ अभिरवे नमः । ॐ भैरवीनाथाय नमः । ॐ भूतपाय नमः । ॐ योगिनीपतये नमः । ॐ धनदाय नमः । ॐ अधनहारिणे नमः
    । ॐ धनवते नमः । ॐ प्रीतिवर्धनाय नमः । ॐ नागहाराय नमः । ॐ नागपाशाय नमः । ४० ॐ व्योमकेशाय नमः । ॐ कपालभृते
    नमः । ॐ कालाय नमः । ॐ कपालमालिने नमः । ॐ कमनीयाय नमः । ॐ कलानिधये नमः । ॐ त्रिलोचनाय नमः । ॐ ज्वलन्नेत्राय
    नमः । ॐ त्रिशिखिने नमः । ॐ त्रिलोकपाय नमः । ५०
