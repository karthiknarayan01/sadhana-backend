id: annamayya-keerthanas-raajeeva-netraaya
category: stotram
name:
  english: Annamayya Keerthanas Raajeeva Netraaya
content:
  english: khandacapu pallavi rajiva netraya raghavaya namo | saujanya nilayaya janakishaya || dasharatha
    tanujaya tataka damanaya kushika sambhava yajna gopanaya | pashupati maha dhanurbhanjanaya namo vishada
    bhargavarama vijaya karunaya || rajiva netraya raghavaya namo bharita dharmaya shurpanakhanga haranaya
    kharadushanaya ripu khandanaya | tarani sambhava sainya rakshakayanamo nirupama maha varinidhi bandhanaya
    || rajiva netraya raghavaya namo hata ravanaya samyami natha varadaya atulita ayodhya puradhipaya
    | hitakara shri venkateshvaraya namo vitata vavilipati vira ramaya || rajiva netraya raghavaya namo
    | saujanya nilayaya janakishaya ||
  devanagari: खन्दचापु पल्लवि राजीव नेत्राय राघवाय नमो । सौजन्य निलयाय जानकीशाय ॥ दशरथ तनूजाय ताटक दमनाय
    कुशिक सम्भव यज्ञ गोपनाय । पशुपति महा धनुर्भञ्जनाय नमो विशद भार्गवराम विजय करुणाय ॥ राजीव नेत्राय राघवाय
    नमो भरित धर्माय शुर्पणखाङ्ग हरणाय खरदूषणाय रिपु खण्डनाय । तरणि सम्भव सैन्य रक्षकायनमो निरुपम महा वारिनिधि
    बन्धनाय ॥ राजीव नेत्राय राघवाय नमो हत रावणाय संयमि नाथ वरदाय अतुलित अयोध्या पुराधिपाय । हितकर श्री
    वेङ्कटेश्वराय नमो वितत वाविलिपाटि वीर रामाय ॥ राजीव नेत्राय राघवाय नमो । सौजन्य निलयाय जानकीशाय ॥
