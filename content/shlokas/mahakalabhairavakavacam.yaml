id: mahakalabhairavakavacam
category: kavacha
name:
  english: mahakalabhairavakavacam
  devanagari: महाकालभैरवकवचम्
content:
  english: shrimahakalabhairavakavacam shridevyuvaca | devadeva mahabaho bhaktanam sukhavardhana | kena
    siddhim dadatyashu kali trailokyamohana || 1|| tanme vada daya''dhara sadhakabhishtasiddhaye | kripam
    kuru jagannatha vada vedavidam vara || 2|| shribhairava uvaca | gopaniyam prayatnena tattvat tattvam
    paratparam | esha siddhikarah samyak kimatho kathayamyaham || 3|| mahakalamaham vande sarvasiddhipradayakam
    | devadanavagandharvakinnaraparisevitam || 4|| kavacam tattvadevasya pathanad ghoradarshane | satyam
    bhavati sannidhyam kavacastavanantarat || 5|| siddhim dadati sa tushta kritva kavacamuttamam | samrajyatvam
    priyam datva putravat paripalayet || 6|| kavacasya rishirdevi kalika dakshina tatha viratchandah suvijneyam
    mahakalastu devata | kalika sadhane caiva viniyogah prakirttitah || 7|| om shmashanastho maharudro
    mahakalo digambarah | kapalakartrika vame shulam khatvangam dakshine || 8|| bhujangabhushite devi
    bhasmasthimanimanditah | jvalatpavakamadhyastho bhasmashayyavyavasthitah || 9|| viparitaratam tatra
    kalikam hridayopari | peyam khadyam ca coshyam ca tau kritva tu parasparam | evam bhaktya yajed devam
    sarvasiddhih prajayate || 10|| pranavam purvamuccarya mahakalaya tatpadam | namah patu mahamantrah
    sarvashastrarthaparagah || 11|| ashtaksharo maha mantrah sarvashaparipurakah | sarvapapakshayam yati
    grahane bhaktavatsale || 12|| kurcadvandvam mahakala prasideti padadvayam | lajjayugmam vahnijaya
    sa tu rajeshvaro mahan || 13|| mantragrahanamatrena bhaveta satyam mahakavih | gadyapadyamayi vani
    ganganirjharita tatha || 14|| tasya nama tu deveshi deva gayanti bhavukah | shaktibijadvayam datva
    kurcam syat tadanantaram || 15|| mahakalapadam datva mayabijayugam tatha | kurcamekam samuddhritya
    mahamantro dashaksharah || 16|| rajasthane durgame ca patu mam sarvato muda | vedadibijamadaya bhagaman
    tadanantaram || 17|| mahakalaya samprocya kurcam datva ca thadvayam | hrimkarapurvamuddhritya vedadistadanantaram
    || 18|| mahakalasyantabhage svahantamanumuttamam | dhanam putram sada patu bandhudaraniketanam ||
    19|| pingalaksho manjuyuddhe yuddhe nityam jayapradah | sambhavyah sarvadushtaghnah patu svasthanavallabhah
    || 20|| iti te kathitam tubhyam devanamapi durlabham | anena pathanad devi vighnanasho yatha bhavet
    || 21|| sampujakah shucisnatah bhaktiyuktah samahitah | sarvavyadhivinirmuktah vairimadhye visheshatah
    || 22|| mahabhimah sada patu sarvasthana vallabham |
  devanagari: श्रीमहाकालभैरवकवचम् श्रीदेव्युवाच । देवदेव महाबाहो भक्तानां सुखवर्धन । केन सिद्धिं ददात्याशु
    काली त्रैलोक्यमोहन ॥ १॥ तन्मे वद दयाऽऽधार साधकाभीष्टसिद्धये । कृपां कुरु जगन्नाथ वद वेदविदां वर ॥
    २॥ श्रीभैरव उवाच । गोपनीयं प्रयत्नेन तत्त्वात् तत्त्वं परात्परम् । एष सिद्धिकरः सम्यक् किमथो कथयाम्यहम्
    ॥ ३॥ महाकालमहम् वन्दे सर्वसिद्धिप्रदायकम् । देवदानवगन्धर्वकिन्नरपरिसेवितम् ॥ ४॥ कवचं तत्त्वदेवस्य
    पठनाद् घोरदर्शने । सत्यं भवति सान्निध्यं कवचस्तवनान्तरात् ॥ ५॥ सिद्धिं ददाति सा तुष्टा कृत्वा कवचमुत्तमम्
    । साम्राज्यत्वं प्रियं दत्वा पुत्रवत् परिपालयेत् ॥ ६॥ कवचस्य ऋषिर्देवी कालिका दक्षिणा तथा विराट्छन्दः
    सुविज्ञेयं महाकालस्तु देवता । कालिका साधने चैव विनियोगः प्रकीर्त्तितः ॥ ७॥ ॐ श्मशानस्थो महारुद्रो
    महाकालो दिगम्बरः । कपालकर्तृका वामे शूलं खट्वाङ्गम् दक्षिणे ॥ ८॥ भुजङ्गभूषिते देवि भस्मास्थिमणिमण्डितः
    । ज्वलत्पावकमध्यस्थो भस्मशय्याव्यवस्थितः ॥ ९॥ विपरीतरतां तत्र कालिकां हृदयोपरि । पेयं खाद्यं च चोष्यं
    च तौ कृत्वा तु परस्परम् । एवं भक्त्या यजेद् देवं सर्वसिद्धिः प्रजायते ॥ १०॥ प्रणवं पूर्वमुच्चार्य
    महाकालाय तत्पदम् । नमः पातु महामन्त्रः सर्वशास्त्रार्थपारगः ॥ ११॥ अष्टक्षरो महा मन्त्रः सर्वाशापरिपूरकः
    । सर्वपापक्षयं याति ग्रहणे भक्तवत्सले ॥ १२॥ कूर्चद्वन्द्वं महाकाल प्रसीदेति पदद्वयम् । लज्जायुग्मं
    वह्निजाया स तु राजेश्वरो महान् ॥ १३॥ मन्त्रग्रहणमात्रेण भवेत सत्यं महाकविः । गद्यपद्यमयी वाणी गङ्गानिर्झरिता
    तथा ॥ १४॥ तस्य नाम तु देवेशि देवा गायन्ति भावुकाः । शक्तिबीजद्वयं दत्वा कूर्चं स्यात् तदनन्तरम् ॥
    १५॥ महाकालपदं दत्वा मायाबीजयुगं तथा । कूर्चमेकं समुद्धृत्य महामन्त्रो दशाक्षरः ॥ १६॥ राजस्थाने दुर्गमे
    च पातु मां सर्वतो मुदा । वेदादिबीजमादाय भगमान् तदनन्तरम् ॥ १७॥ महाकालाय सम्प्रोच्य कूर्चं दत्वा च
    ठद्वयम् । ह्रींकारपूर्वमुद्धृत्य वेदादिस्तदनन्तरम् ॥ १८॥ महाकालस्यान्तभागे स्वाहान्तमनुमुत्तमम् ।
    धनं पुत्रं सदा पातु बन्धुदारानिकेतनम् ॥ १९॥ पिङ्गलाक्षो मञ्जुयुद्धे युद्धे नित्यं जयप्रदः । सम्भाव्यः
    सर्वदुष्टघ्नः पातु स्वस्थानवल्लभः ॥ २०॥ इति ते कथितं तुभ्यं देवानामपि दुर्लभम् । अनेन पठनाद् देवि
    विघ्ननाशो यथा भवेत् ॥ २१॥ सम्पूजकः शुचिस्नातः भक्तियुक्तः समाहितः । सर्वव्याधिविनिर्मुक्तः वैरिमध्ये
    विशेषतः ॥ २२॥ महाभीमः सदा पातु सर्वस्थान वल्लभम् ।
