id: teksht
category: stotram
name:
  english: teksht
  devanagari: टेक्ष्त्
content:
  english: vimsho'dhyayah agastyena tamraparnya mukhopajanasambandhakritanilimapanodanaya indrakilakshetre
    shambhavavrata anushthana kathanavelayam tamraparnya katham indrakilamiti prashne krite indrena vritravadhaya
    dadhicimaharsheh asthyacanam | tat danaya ca tena maharshina dehatyagah | shabarakshyai namah | 1
  devanagari: विंशोऽध्यायः अगस्त्येन ताम्रपर्ण्या मुखोपजनसम्बन्धकृतनीलिमापनोदनाय इन्द्रकीलक्षेत्रे शाम्भवव्रत
    अनुष्ठान कथनवेलायां ताम्रपर्ण्या कथं इन्द्रकीलमिति प्रश्ने कृते इन्द्रेण वृत्रवधाय दधीचीमहर्षेः अस्थ्याचनम्
    । तत् दानाय च तेन महर्षिणा देहत्यागः । शबराक्ष्यै नमः । १
meaning: {}
