id: shastapancaksharastotram
category: stotram
name:
  english: shastapancaksharastotram
  devanagari: शास्तापन्चाक्षरस्तोत्रम्
content:
  english: yakshinyabhimatam purnapushkalaparisevitam | kshipraprasadakam nityam shastaram pranato'smyaham
    || 6|| iti shrishastri pancaksharastotram sampurnam ||
  devanagari: यक्षिण्यभिमतं पूर्णापुष्कलापरिसेवितम् । क्षिप्रप्रसादकं नित्यं शास्तारं प्रणतोऽस्म्यहम्
    ॥ ६॥ इति श्रीशास्तृ पञ्चाक्षरस्तोत्रं सम्पूर्णम् ॥
meaning: {}
