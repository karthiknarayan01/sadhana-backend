id: manidweepa-varnana-3-devi-bhagavatham
category: stotram
name:
  english: Manidweepa Varnana - 3 (Devi Bhagavatham)
content:
  english: vyasa uvaca | tadeva devisadanam madhyabhage virajate | sahasra stambhasamyuktashcatvarasteshu
    mandapah || || shringaramandapashcaiko muktimandapa eva ca | jnanamandapa sanjnastu tritiyah parikirtitah
    || || ekantamandapashcaiva caturthah parikirtitah | nana vitanasamyukta nana dhupaistu dhupitah ||
    || kotisuryasamah kantya bhranjante mandapah shubhah | tanmandapanam paritah kashmiravanika smrita
    || || mallikakundavanika yatra pushkalakah sthitah | asankhyata mrigamadaih puritastatsrava nripa
    || || mahapadmatavi tadvadratnasopananirmita | sudharasenasampurna gunjanmattamadhuvrata || || hamsakarandavakirna
    gandhapurita diktata | vanikanam sugandhaistu manidvipam suvasitam || || shringaramandape devyo gayanti
    vividhaih svaraih | sabhasado devavasha madhye shrijagadambika || || muktimandapamadhye tu mocayatyanisham
    shiva | jnanopadesham kurute tritiye nripa mandape || || caturthamandape caiva jagadraksha vicintanam
    | mantrini sahita nityam karoti jagadambika || || cintamanigrihe rajanchakti tattvatmakaih paraih
    | sopanairdashabhiryukto mancakopyadhirajate || || brahma vishnushca rudrashca ishvarashca sadashivah
    | ete mancakhurah proktah phalakastu sadashivah || || tasyopari mahadevo bhuvanesho virajate | ya
    devi nijalilartham dvidhabhuta babhuvaha || || srishtyadau tu sa evayam tadardhango maheshvarah |
    kandarpa darpanashodyatkoti kandarpasundarah || || pancavaktrastrinetrashca manibhushana bhushitah
    | harinabhitiparashunvaram ca nijabahubhih || || dadhanah shodashabdo'sau devah sarveshvaro mahan
    | kotisurya pratikashashcandrakoti sushitalah || || shuddhasphatika sankashastrinetrah shitala dyutih
    | vamanke sannishanna'sya devi shribhuvaneshvari || || navaratnaganakirna kancidama virajita | taptakancanasannaddha
    vaiduryangadabhushana || || kanacchricakratatanka vitanka vadanambuja | lalatakanti vibhava vijitardhasudhakara
    || || bimbakanti tiraskariradacchada virajita | lasatkunkumakasturitilakodbhasitanana || || divya
    cudamani sphara cancaccandrakasuryaka | udyatkavisamasvaccha nasabharana bhasura || || cintakalambitasvaccha
    muktaguccha virajita | patira panka karpura kunkumalankrita stani || || vicitra vividha kalpa kambusankasha
    kandhara | dadimiphalabijabha dantapankti virajita || || anarghya ratnaghatita mukutancita mastaka
    | mattalimalavilasadalakadhya mukhambuja || || kalankakarshyanirmukta sharaccandranibhanana | jahnavisalilavarta
    shobhinabhivibhushita || || manikya shakalabaddha mudrikangulibhushita | pundarikadalakara nayanatrayasundari
    || || kalpitaccha maharaga padmaragojjvalaprabha | ratnakinkinikayukta ratnakankanashobhita || ||
    manimuktasarapara lasatpadakasantatih | ratnangulipravitata prabhajalalasatkara || || kancukigumphitapara
    nana ratnatatidyutih | mallikamodi dhammilla mallikalisaravrita || || suvrittanibidottunga kucabharalasa
    shiva | varapashankushabhiti lasadbahu catushtaya || || sarvashringaraveshadhya sukumarangavallari
    | saundaryadharasarvasva nirvyajakarunamayi || || nijasamlapamadhurya vinirbhartsitakacchapi | kotikotiravindunam
    kantim ya bibhrati para || || nana sakhibhirdasibhistatha devanganadibhih | sarvabhirdevatabhistu
    samantatpariveshtita || || icchashaktya jnanashaktya kriyashaktya samanvita | lajja tushtistatha pushtih
    kirtih kantih kshama daya || || buddhirmedhasmritirlakshmirmurtimatyonganah smritah | jaya ca vijaya
    caivapyajita caparajita || || nitya vilasini dogdhri tvaghora mangala nava | pithashaktaya etastu
    sevante yam parambikam || || yasyastu parshvabhagestonidhitau shankhapadmakau | navaratna vahanadyastatha
    vai kancanasravah || || saptadhatuvahanadyo nidhibhyam tu vinirgatah | sudhasindhvantagaminyastah
    sarva nripasattama || || sa devi bhuvaneshani tadvamanke virajate | sarvesha tvam maheshasya yatsanga
    deva nanyatha || || cintamani grihasya'sya pramanam shrinu bhumipa | sahasrayojanayamam mahantastatpracakshate
    || || taduttare mahashalah purvasmad dvigunah smritah | antarikshagatam tvetanniradharam virajate
    || || sankocashca vikashashca jayate'sya nirantaram | patavatkaryavashatah pralaye sarjane tatha ||
    || shalanam caiva sarvesham sarvakantiparavadhi | cintamanigriham proktam yatra devi mahomayi || ||
    yeye upasakah santi pratibrahmandavartinah | deveshu nagalokeshu manushyeshvitareshu ca || || shridevyaste
    ca sarvepi vrajantyatraiva bhumipa | devikshetre ye tyajanti pranandevyarcane ratah || || te sarve
    yanti tatraiva yatra devi mahotsava | ghritakulya dugdhakulya dadhikulya madhusravah || || syandanti
    saritah sarvastathamritavahah parah | draksharasavahah kashcijjamburasavahah parah || || amrekshurasavahinyo
    nadyastastu sahasrashah | manorathaphalavrikshavapyah kupastathaiva ca || || yatheshtapanaphaladana
    nyunam kincidasti hi | na rogapalitam vapi jara vapi kadacana || || na cinta na ca matsaryam kamakrodhadikam
    tatha | sarve yuvanah sastrikah sahasradityavarcasah || || bhajanti satatam devim tatra shribhuvaneshvarim
    | kecitsalokatapannah kecitsamipyatam gatah || || sarupatam gatah kecitsarshtitam ca paregatah | yayastu
    devatastatra pratibrahmandavartinam || || samashtayah sthitastastu sevante jagadishvarim | saptakotimahamantra
    murtimanta upasate || || mahavidyashca sakalah samyavasthatmikam shivam | karanabrahmarupam tam maya
    shabalavigraham || || ittham rajanmaya proktam manidvipam mahattaram | na suryacandrau no vidyutkotayognistathaiva
    ca || || etasya bhasa kotyamsha kotyamsho napi te samah | kvacidvidrumasankasham kvacinmarakatacchavi
    || || vidyudbhanusamacchayam madhyasuryasamam kvacit | vidyutkotimahadhara sarakantitatam kvacit ||
    || kvacitsindura nilendram manikya sadrishacchavi | hirasara mahagarbha dhagaddhagita diktatam ||
    || kantya davanalasamam taptakancana sannibham | kvaciccandropalodgaram suryodgaram ca kutra cit ||
    || ratnashringi samayuktam ratnaprakara gopuram | ratnapatrai ratnaphalairvrikshaishca parimanditam
    || || nrityanmayurasanghaishca kapotaranitojjvalam | kokilakakalilapaih shukalapaishca shobhitam ||
    || suramya ramaniyambu lakshavadhi sarovritam | tanmadhyabhaga vilasadvikacadratna pankajaih || ||
    sugandhibhih samantattu vasitam shatayojanam | mandamaruta sambhinna caladdruma samakulam || || cintamani
    samuhanam jyotisha vitatambaram | ratnaprabhabhirabhito dhagaddhagita diktatam || || vrikshavrata
    mahagandhavatavrata supuritam | dhupadhupayitam rajanmanidipayutojjvalam || || manijalaka sacchidra
    taralodarakantibhih | dinmohajanakam caitaddarpanodara samyutam || || aishvaryasya samagrasya shringarasyakhilasya
    ca | sarvajnatayah sarvayastejasashcakhilasya ca || || parakramasya sarvasya sarvottamagunasya ca
    | sakala ya dayayashca samaptiriha bhupate || || rajna anandamarabhya brahmalokanta bhumishu | ananda
    ye sthitah sarve te'traivantarbhavanti hi || || iti te varnitam rajanmanidvipam mahattaram | mahadevyah
    paramsthanam sarvalokottamottamam || || etasya smaranatsadyah sarvapapam vinashyati | pranotkramanasandhau
    tu smritva tatraiva gacchati || || adhyaya pancakam tvetatpathennityam samahitah | bhutapretapishacadi
    badha tatra bhavenna hi || || navina griha nirmane vastuyage tathaiva ca | pathitavyam prayatnena
    kalyanam tena jayate || || iti shridevibhagavate mahapurane dvadashaskandhe dvadashodhyayah ||
  devanagari: व्यास उवाच । तदेव देवीसदनं मध्यभागे विराजते । सहस्र स्तम्भसंयुक्ताश्चत्वारस्तेषु मण्डपाः
    ॥ ॥ शृङ्गारमण्डपश्चैको मुक्तिमण्डप एव च । ज्ञानमण्डप सञ्ज्ञस्तु तृतीयः परिकीर्तितः ॥ ॥ एकान्तमण्डपश्चैव
    चतुर्थः परिकीर्तितः । नाना वितानसंयुक्ता नाना धूपैस्तु धूपिताः ॥ ॥ कोटिसूर्यसमाः कान्त्या भ्राञ्जन्ते
    मण्डपाः शुभाः । तन्मण्डपानां परितः काश्मीरवनिका स्मृता ॥ ॥ मल्लिकाकुन्दवनिका यत्र पुष्कलकाः स्थिताः
    । असङ्ख्याता मृगमदैः पूरितास्तत्स्रवा नृप ॥ ॥ महापद्माटवी तद्वद्रत्नसोपाननिर्मिता । सुधारसेनसम्पूर्णा
    गुञ्जन्मत्तमधुव्रता ॥ ॥ हंसकारण्डवाकीर्णा गन्धपूरित दिक्तटा । वनिकानां सुगन्धैस्तु मणिद्वीपं सुवासितम्
    ॥ ॥ शृङ्गारमण्डपे देव्यो गायन्ति विविधैः स्वरैः । सभासदो देववशा मध्ये श्रीजगदम्बिका ॥ ॥ मुक्तिमण्डपमध्ये
    तु मोचयत्यनिशं शिवा । ज्ञानोपदेशं कुरुते तृतीये नृप मण्डपे ॥ ॥ चतुर्थमण्डपे चैव जगद्रक्षा विचिन्तनम्
    । मन्त्रिणी सहिता नित्यं करोति जगदम्बिका ॥ ॥ चिन्तामणिगृहे राजञ्छक्ति तत्त्वात्मकैः परैः । सोपानैर्दशभिर्युक्तो
    मञ्चकोप्यधिराजते ॥ ॥ ब्रह्मा विष्णुश्च रुद्रश्च ईश्वरश्च सदाशिवः । एते मञ्चखुराः प्रोक्ताः फलकस्तु
    सदाशिवः ॥ ॥ तस्योपरि महादेवो भुवनेशो विराजते । या देवी निजलीलार्थं द्विधाभूता बभूवह ॥ ॥ सृष्ट्यादौ
    तु स एवायं तदर्धाङ्गो महेश्वरः । कन्दर्प दर्पनाशोद्यत्कोटि कन्दर्पसुन्दरः ॥ ॥ पञ्चवक्त्रस्त्रिनेत्रश्च
    मणिभूषण भूषितः । हरिणाभीतिपरशून्वरं च निजबाहुभिः ॥ ॥ दधानः षोडशाब्दोऽसौ देवः सर्वेश्वरो महान् । कोटिसूर्य
    प्रतीकाशश्चन्द्रकोटि सुशीतलः ॥ ॥ शुद्धस्फटिक सङ्काशस्त्रिनेत्रः शीतल द्युतिः । वामाङ्के सन्निषण्णाऽस्य
    देवी श्रीभुवनेश्वरी ॥ ॥ नवरत्नगणाकीर्ण काञ्चीदाम विराजिता । तप्तकाञ्चनसन्नद्ध वैदूर्याङ्गदभूषणा ॥
    ॥ कनच्छ्रीचक्रताटङ्क विटङ्क वदनाम्बुजा । ललाटकान्ति विभव विजितार्धसुधाकरा ॥ ॥ बिम्बकान्ति तिरस्कारिरदच्छद
    विराजिता । लसत्कुङ्कुमकस्तूरीतिलकोद्भासितानना ॥ ॥ दिव्य चूडामणि स्फार चञ्चच्चन्द्रकसूर्यका । उद्यत्कविसमस्वच्छ
    नासाभरण भासुरा ॥ ॥ चिन्ताकलम्बितस्वच्छ मुक्तागुच्छ विराजिता । पाटीर पङ्क कर्पूर कुङ्कुमालङ्कृत स्तनी
    ॥ ॥ विचित्र विविधा कल्पा कम्बुसङ्काश कन्धरा । दाडिमीफलबीजाभ दन्तपङ्क्ति विराजिता ॥ ॥ अनर्घ्य रत्नघटित
    मुकुटाञ्चित मस्तका । मत्तालिमालाविलसदलकाढ्य मुखाम्बुजा ॥ ॥ कलङ्ककार्श्यनिर्मुक्त शरच्चन्द्रनिभानना
    । जाह्नवीसलिलावर्त शोभिनाभिविभूषिता ॥ ॥ माणिक्य शकलाबद्ध मुद्रिकाङ्गुलिभूषिता । पुण्डरीकदलाकार नयनत्रयसुन्दरी
    ॥ ॥ कल्पिताच्छ महाराग पद्मरागोज्ज्वलप्रभा । रत्नकिङ्किणिकायुक्त रत्नकङ्कणशोभिता ॥ ॥ मणिमुक्तासरापार
    लसत्पदकसन्ततिः । रत्नाङ्गुलिप्रवितत प्रभाजाललसत्करा ॥ ॥ कञ्चुकीगुम्फितापार नाना रत्नततिद्युतिः । मल्लिकामोदि
    धम्मिल्ल मल्लिकालिसरावृता ॥ ॥ सुवृत्तनिबिडोत्तुङ्ग कुचभारालसा शिवा । वरपाशाङ्कुशाभीति लसद्बाहु चतुष्टया
    ॥ ॥ सर्वशृङ्गारवेषाढ्या सुकुमाराङ्गवल्लरी । सौन्दर्यधारासर्वस्वा निर्व्याजकरुणामयी ॥ ॥ निजसंलापमाधुर्य
    विनिर्भर्त्सितकच्छपी । कोटिकोटिरवीन्दूनां कान्तिं या बिभ्रती परा ॥ ॥ नाना सखीभिर्दासीभिस्तथा देवाङ्गनादिभिः
    । सर्वाभिर्देवताभिस्तु समन्तात्परिवेष्टिता ॥ ॥ इच्छाशक्त्या ज्ञानशक्त्या क्रियाशक्त्या समन्विता ।
    लज्जा तुष्टिस्तथा पुष्टिः कीर्तिः कान्तिः क्षमा दया ॥ ॥ बुद्धिर्मेधास्मृतिर्लक्ष्मीर्मूर्तिमत्योङ्गनाः
    स्मृताः । जया च विजया चैवाप्यजिता चापराजिता ॥ ॥ नित्या विलासिनी दोग्ध्री त्वघोरा मङ्गला नवा । पीठशक्तय
    एतास्तु सेवन्ते यां पराम्बिकाम् ॥ ॥ यस्यास्तु पार्श्वभागेस्तोनिधीतौ शङ्खपद्मकौ । नवरत्न वहानद्यस्तथा
    वै काञ्चनस्रवाः ॥ ॥ सप्तधातुवहानद्यो निधिभ्यां तु विनिर्गताः । सुधासिन्ध्वन्तगामिन्यस्ताः सर्वा नृपसत्तम
    ॥ ॥ सा देवी भुवनेशानी तद्वामाङ्के विराजते । सर्वेश त्वं महेशस्य यत्सङ्गा देव नान्यथा ॥ ॥ चिन्तामणि
    गृहस्याऽस्य प्रमाणं शृणु भूमिप । सहस्रयोजनायामं महान्तस्तत्प्रचक्षते ॥ ॥ तदुत्तरे महाशालाः पूर्वस्माद्
    द्विगुणाः स्मृताः । अन्तरिक्षगतं त्वेतन्निराधारं विराजते ॥ ॥ सङ्कोचश्च विकाशश्च जायतेऽस्य निरन्तरम्
    । पटवत्कार्यवशतः प्रलये सर्जने तथा ॥ ॥ शालानां चैव सर्वेषां सर्वकान्तिपरावधि । चिन्तामणिगृहं प्रोक्तं
    यत्र देवी महोमयी ॥ ॥ येये उपासकाः सन्ति प्रतिब्रह्माण्डवर्तिनः । देवेषु नागलोकेषु मनुष्येष्वितरेषु
    च ॥ ॥ श्रीदेव्यास्ते च सर्वेपि व्रजन्त्यत्रैव भूमिप । देवीक्षेत्रे ये त्यजन्ति प्राणान्देव्यर्चने
    रताः ॥ ॥ ते सर्वे यान्ति तत्रैव यत्र देवी महोत्सवा । घृतकुल्या दुग्धकुल्या दधिकुल्या मधुस्रवाः ॥ ॥
    स्यन्दन्ति सरितः सर्वास्तथामृतवहाः पराः । द्राक्षारसवहाः काश्चिज्जम्बूरसवहाः पराः ॥ ॥ आम्रेक्षुरसवाहिन्यो
    नद्यस्तास्तु सहस्रशः । मनोरथफलावृक्षावाप्यः कूपास्तथैव च ॥ ॥ यथेष्टपानफलदान न्यूनं किञ्चिदस्ति हि
    । न रोगपलितं वापि जरा वापि कदाचन ॥ ॥ न चिन्ता न च मात्सर्यं कामक्रोधादिकं तथा । सर्वे युवानः सस्त्रीकाः
    सहस्रादित्यवर्चसः ॥ ॥ भजन्ति सततं देवीं तत्र श्रीभुवनेश्वरीम् । केचित्सलोकतापन्नाः केचित्सामीप्यतां
    गताः ॥ ॥ सरूपतां गताः केचित्सार्ष्टितां च परेगताः । यायास्तु देवतास्तत्र प्रतिब्रह्माण्डवर्तिनाम्
    ॥ ॥ समष्टयः स्थितास्तास्तु सेवन्ते जगदीश्वरीम् । सप्तकोटिमहामन्त्रा मूर्तिमन्त उपासते ॥ ॥ महाविद्याश्च
    सकलाः साम्यावस्थात्मिकां शिवाम् । कारणब्रह्मरूपां तां माया शबलविग्रहाम् ॥ ॥ इत्थं राजन्मया प्रोक्तं
    मणिद्वीपं महत्तरम् । न सूर्यचन्द्रौ नो विद्युत्कोटयोग्निस्तथैव च ॥ ॥ एतस्य भासा कोट्यंश कोट्यंशो नापि
    ते समाः । क्वचिद्विद्रुमसङ्काशं क्वचिन्मरकतच्छवि ॥ ॥ विद्युद्भानुसमच्छायं मध्यसूर्यसमं क्वचित् । विद्युत्कोटिमहाधारा
    सारकान्तिततं क्वचित् ॥ ॥ क्वचित्सिन्दूर नीलेन्द्रं माणिक्य सदृशच्छवि । हीरसार महागर्भ धगद्धगित दिक्तटम्
    ॥ ॥ कान्त्या दावानलसमं तप्तकाञ्चन सन्निभम् । क्वचिच्चन्द्रोपलोद्गारं सूर्योद्गारं च कुत्र चित् ॥ ॥
    रत्नशृङ्गि समायुक्तं रत्नप्राकार गोपुरम् । रत्नपत्रै रत्नफलैर्वृक्षैश्च परिमण्डितम् ॥ ॥ नृत्यन्मयूरसङ्घैश्च
    कपोतरणितोज्ज्वलम् । कोकिलाकाकलीलापैः शुकलापैश्च शोभितम् ॥ ॥ सुरम्य रमणीयाम्बु लक्षावधि सरोवृतम् ।
    तन्मध्यभाग विलसद्विकचद्रत्न पङ्कजैः ॥ ॥ सुगन्धिभिः समन्तात्तु वासितं शतयोजनम् । मन्दमारुत सम्भिन्न
    चलद्द्रुम समाकुलम् ॥ ॥ चिन्तामणि समूहानां ज्योतिषा वितताम्बरम् । रत्नप्रभाभिरभितो धगद्धगित दिक्तटम्
    ॥ ॥ वृक्षव्रात महागन्धवातव्रात सुपूरितम् । धूपधूपायितं राजन्मणिदीपायुतोज्ज्वलम् ॥ ॥ मणिजालक सच्छिद्र
    तरलोदरकान्तिभिः । दिङ्मोहजनकं चैतद्दर्पणोदर संयुतम् ॥ ॥ ऐश्वर्यस्य समग्रस्य शृङ्गारस्याखिलस्य च ।
    सर्वज्ञतायाः सर्वायास्तेजसश्चाखिलस्य च ॥ ॥ पराक्रमस्य सर्वस्य सर्वोत्तमगुणस्य च । सकला या दयायाश्च
    समाप्तिरिह भूपते ॥ ॥ राज्ञ आनन्दमारभ्य ब्रह्मलोकान्त भूमिषु । आनन्दा ये स्थिताः सर्वे तेऽत्रैवान्तर्भवन्ति
    हि ॥ ॥ इति ते वर्णितं राजन्मणिद्वीपं महत्तरम् । महादेव्याः परंस्थानं सर्वलोकोत्तमोत्तमम् ॥ ॥ एतस्य
    स्मरणात्सद्यः सर्वपापं विनश्यति । प्राणोत्क्रमणसन्धौ तु स्मृत्वा तत्रैव गच्छति ॥ ॥ अध्याय पञ्चकं त्वेतत्पठेन्नित्यं
    समाहितः । भूतप्रेतपिशाचादि बाधा तत्र भवेन्न हि ॥ ॥ नवीन गृह निर्माणे वास्तुयागे तथैव च । पठितव्यं
    प्रयत्नेन कल्याणं तेन जायते ॥ ॥ इति श्रीदेवीभागवते महापुराणे द्वादशस्कन्धे द्वादशोध्यायः ॥
