id: parabrahmapakaraditrishatistotram
category: stotram
name:
  english: parabrahmapakaraditrishatistotram
  devanagari: परब्रह्मपकारादित्रिशतिस्तोत्रम्
content:
  english: shriparabrahmapakaraditrishatistotram asya shriparabrahmapakaraditrishatistotrasya niranjanaparabrahmarishih
    | anushtup chandah | parabrahmadevata | parabrahmamayah bijam | cinmayi parashaktih shaktih | bhagavati
    parabrahmalalitambika kilakam | shriparabrahmapakaraditrishatipathe viniyogah || purnatparataram purnam
    parabrahma sanatanam | purnapurnatiguhyam ca purnanandasvarupakam || 1|| param jyotih param dhama
    paratparamanamayam | paramarthaikasaram ca paratattvaprakashakam || 2|| parabodhaikanilayam paramanandavigraham
    | paramaksharanirlepam parashantipradayakam || 3|| paramam vyomavistaram paracaitanyamadbhutam | paramatmasvarupam
    ca parabrahmaikakaranam || 4|| parameshvaramavyaktam parashaktisamanvitam | paramaudaryasampannam
    paravedyavivarjitam || 5|| paranirvananilayam parajnanaikabhasvaram | paramayamalatitam parashuddhaikamandalam
    || 6|| parasakshisvarupam ca paravanmanasagatam | parakalpantasakshinam parabinduprakashitam || 7||
    paradevamayam nityam paralokaikavanditam | parayogindrasamsevyam paratattvaikagocaram || 8|| paramantrarthagudham
    ca parayantraikamadhyagam | paravidyapratishthanam paragamavinishcitam || 9|| parabrahmamayam nityam
    parabrahmaikaveditam | paramangaladam shantam parapurnam niranjanam || 10|| paramatmaprabhum vande
    parameshtiprakashakam | paramatmaikanilayam paramarthaikanirnayam || 11|| paramam karanatitam parakaryavivarjitam
    | paramanumahattvadivarjitam parameshvaram || 12|| paramakashasankasham paramanandasagaram | paramohavinirmuktam
    paramuktipradayakam || 13|| paramarshiganadhyeyam paravedantavarnitam | parabodhamritasaram parabrahmaikacinmayam
    || 14|| parashaktisamayuktam parashaktyekavanditam | parashaktiprakashakhyam parashaktivilasitam ||
    15|| parasarvajnabhavastham parasarvagatam vibhum | parasarveshvaram devam parasarvaprakashakam ||
    16|| parasatyasvarupam ca parasankalpavarjitam | parasiddhantanishnatam parasiddhipradayakam || 17||
    parasaubhagyasampannam parasaumyasvabhavakam | parasaundaryasaram ca parasaukhyaikadayakam || 18||
    parasrishtipravartakam parasamharakarakam | parasthityadharabhutam paralilavilasitam || 19|| parabrahmaparam
    dhama parabrahmaikavigraham | parabrahmarasam purnam parabrahmamayam mahat || 20|| paramavyaktarupam
    ca parameshanamavyayam | parameshthipadastham ca paramantaravartinam || 21|| paramayatanam shuddham
    paramanandavardhanam | paramatmaprabodham ca paramatmaikabhasvaram || 22|| paramatmaikasakshinam paramantarnirantaram
    | paramatmaprakasham ca paramatmarasatmakam || 23|| paramaradhyadevam ca paramopasanatmakam | paramarthaikavijneyam
    paramajnanadayakam || 24|| paramaushadhamavyagram parabhavaroganashanam | paramamritadharam ca paramanandavarshakam
    || 25|| parameshvarasandrishyam paramodaraceshtitam | paramoccapadam nityam paramodgitavaibhavam ||
    26|| parameshthisamaradhyam parameshthiprapujitam | parameshthisvarupam ca parameshthiprakashitam
    || 27|| paramantrasvarupam ca paramantrarthagocaram | paramantraikavedyam ca paramantraprabodhakam
    || 28|| paramudravinirmuktam parabhavaikasadhakam | parabhaktiprakasham ca parabhaktaikavanchitam
    || 29|| parabrahmaikanishtham ca parabrahmaparayanam | parabrahmaprasadam ca parabrahmaikamangalam
    || 30|| paramuktisvarupam ca paramuktipradayakam | paranirmalacaitanyam paranirvanadayakam || 31||
    parasphuranarupam ca parasphurtivivardhanam | parasaumyaprakasham ca parasaukhyaikamandiram || 32||
    paravishvaprasutirmulam paravishvavilapakrit | paravishvaikasakshi ca paravishvavilakshanam || 33||
    parakalavinirmuktam parakalapravartakam | parakalantakam shantam parakalaikasakshinam || 34|| paratattvaikanishtham
    ca paratattvavivarjitam | paratattvapradipam ca paratattvaikabodhakam || 35|| parayogasamadhistham
    parayogivararcitam | parayogaikagamyam ca parayogaprakashakam || 36|| paranadasvarupam ca paranadavivardhanam
    | paranadantasamlinam paranadaikamandalam || 37|| parabindusvarupam ca parabinduvilakshanam | parabinduprakasham
    ca parabindvatmakam mahat || 38|| parakalatigam shuddham parakalavivarjitam | parakalaprabhasaram
    parakalaikamulakam || 39|| paramarshasvarupam ca paramarshaikasadhakam | paramritarasasaram paramritapradayakam
    || 40|| parantaryamisvarupam ca parantaryamivanditam | parantaryamisakshinam parantaryamivigraham
    || 41|| parabodhapradipam ca parabodhaikadayakam | parabodhamritasaram parabodhaikamandiram || 42||
    paravyomavilasam ca paravyomaikabhasvaram | paravyomatisukshmam ca paravyomaprakashakam || 43|| parahamsasvarupam
    ca parahamsaikasevitam | parahamsagatigamyam ca parahamsaparayanam || 44|| paramaunasvarupam ca paramaunaprakashakam
    | paramaunaikavedyam ca paramaunavivardhanam || 45|| paracittaprabodham ca paracittaikanayakam | paracittasthitam
    nityam paracittavilakshanam || 46|| paranandarasarnavam paranandaikavigraham | paranandapravaham ca
    paranandapradayakam || 47|| parashunyavinirmuktam parapurnaikamandalam | parapurnaprakasham ca parapurnaikadayakam
    || 48|| parabrahmasvarupam ca parabrahmaikakaranam | parabrahmaprabhajalam parabrahmaikavaibhavam
    || 49|| paramangalamavyaktam paramangalavardhanam | paramangaladhamam ca paramangalamanditam || 50||
    parabrahmaikavijnanam parabrahmaikasadhanam | parabrahmaikavishrantam parabrahmaikamandalam || 51||
    parabrahmaikasandehacchedakam jnanabhasvaram | parabrahmaikanirdharam parabrahmaikanishcayam || 52||
    parabrahmaikasarajnam parabrahmaikabhavitam | parabrahmaikasamvedyam parabrahmaikacintanam || 53||
    parabrahmaikanirlepam parabrahmaikanirmalam | parabrahmaikanirvanam parabrahmaikashashvatam || 54||
    parabrahmaikavedantam parabrahmaikagocaram | parabrahmaikasamsthanam parabrahmaikadarshanam || 55||
    parabrahmaikasarvasvam parabrahmaikajivanam | parabrahmaikahridayam parabrahmaikavaibhavam || 56||
    parabrahmaikamadhuryam parabrahmaikamanjulam | parabrahmaikalavanyam parabrahmaikasundaram || 57||
    parabrahmaikashaktim ca parabrahmaikavigraham | parabrahmaikaliladhyam parabrahmaikapalakam || 58||
    parabrahmaikanilayam parabrahmaikamandiram | parabrahmaikadipam ca parabrahmaikabhasvaram || 59||
    parabrahmalalitambikam parameshim paratparam | parabrahmasvarupam tam pranamami nirantaram || 60||
    idam parabrahmaparayananam guhyam param brahmarasaikasaram | yah pathate bhaktiyutah prashanto na
    tasya lokeshu parabhavah syat || 1|| trisandhyametat prajapennaro yah shucih prasanno gurubhaktiyuktah
    | tasyaiva vak siddhimupaiti nityam jnanapravahashca hridi pravriddhah || 2|| yasya smritau vartati
    namamala parabrahmapurnakhyapadapradipa | tasyaiva cittam vimalam bhavet tat yatha nabhah sharadacandrashubhram
    || 3|| na daridryam na ca dainyabhavo na mohajalam na ca karmabandhah | parabrahmatattvaikanirudhacittah
    sa muktimarge satatam pravrittah || 4|| avidyaya yah parimohitatma samsaraghorarnavamadhyamagnah |
    pathan trishatyah paramam vibhutim prapnoti tattvamritasindhuparam || 5|| na kevalam bhautikasiddhilabho
    na kevalam svargapadaprasiddhih | asya prabhavat paramaikyabodhah svayamprakashah hridi jayate hi
    || 6|| vedantavedyam paramam rahasyam agamyagamyam munibhirvicintyam | yasyaiva nityam hridi samsthitam
    syat sa veda sarvam na ca tasya mohah || 7|| ashtau disho yasya yasho vahanti lokatrayam yasya padam
    namanti | siddhashca yogindraganashca nityam stuvanti tam brahmamayam naram hi || 8|| ekavaram pathedyastu
    shraddhaya shuddhamanasah | tasya janmarjitam papam kshiyate natra samshayah || 9|| shatavaram pathedyastu
    manasa niyamena ca | tasya jnanapradipasya prakasho jayate dhruvam || 10|| sahasravarapathena purashcaryaphalam
    labhet | cinmatraikasthitim yati na punarmohabhagbhavet || 11|| lakshapathena siddhih syat iti yogishu
    nishcayah | parabrahmaikabhavena liyate sadhakottamah || 12|| nasya tulya katha kacinnasya tulyam
    phalam smritam | yatra parabrahma prakashate || 13|| gopaniyam prayatnena bhaktihinaya narpayet |
    shraddhavate gurau bhakte datavyam brahmavedine || 14|| yah pathet pratarutthaya nityam shraddhasamanvitah
    | sa jivanneva muktah syat satyam satyam na samshayah || 15|| iti shriparabrahmapakaraditrishatistotram
    sampurnam |
  devanagari: श्रीपरब्रह्मपकारादित्रिशतिस्तोत्रम् अस्य श्रीपरब्रह्मपकारादित्रिशतिस्तोत्रस्य निरञ्जनपरब्रह्मऋषिः
    । अनुष्टुप् छन्दः । परब्रह्मदेवता । परब्रह्ममयः बीजम् । चिन्मयी पराशक्तिः शक्तिः । भगवती परब्रह्मललिताम्बिका
    कीलकम् । श्रीपरब्रह्मपकारादित्रिशतिपाठे विनियोगः ॥ पूर्णात्परतरं पूर्णं परब्रह्म सनातनम् । पूर्णपूर्णातिगुह्यं
    च पूर्णानन्दस्वरूपकम् ॥ १॥ परं ज्योतिः परं धाम परात्परमनामयम् । परमार्थैकसारं च परतत्त्वप्रकाशकम्
    ॥ २॥ परबोधैकनिलयं परमानन्दविग्रहम् । परमाक्षरनिर्लेपं परशान्तिप्रदायकम् ॥ ३॥ परमं व्योमविस्तारं परचैतन्यमद्भुतम्
    । परमात्मस्वरूपं च परब्रह्मैककारणम् ॥ ४॥ परमेश्वरमव्यक्तं पराशक्तिसमन्वितम् । परमौदार्यसम्पन्नं परवेद्यविवर्जितम्
    ॥ ५॥ परनिर्वाणनिलयं परज्ञानैकभास्वरम् । परमायामलातीतं परशुद्धैकमण्डलम् ॥ ६॥ परसाक्षिस्वरूपं च परवाङ्मनसागतम्
    । परकल्पान्तसाक्षिणं परबिन्दुप्रकाशितम् ॥ ७॥ परदेवमयं नित्यं परलोकैकवन्दितम् । परयोगीन्द्रसंसेव्यं
    परतत्त्वैकगोचरम् ॥ ८॥ परमन्त्रार्थगूढं च परयन्त्रैकमध्यगम् । परविद्याप्रतिष्ठानं परागमविनिश्चितम्
    ॥ ९॥ परब्रह्ममयं नित्यं परब्रह्मैकवेदितम् । परमङ्गलदं शान्तं परपूर्णं निरञ्जनम् ॥ १०॥ परमात्मप्रभुं
    वन्दे परमेष्टिप्रकाशकम् । परमात्मैकनिलयं परमार्थैकनिर्णयम् ॥ ११॥ परमं कारणातीतं परकार्यविवर्जितम्
    । परमाणुमहत्त्वादिवर्जितं परमेश्वरम् ॥ १२॥ परमाकाशसङ्काशं परमानन्दसागरम् । परमोहविनिर्मुक्तं परमुक्तिप्रदायकम्
    ॥ १३॥ परमर्षिगणाध्येयं परवेदान्तवर्णितम् । परबोधामृतासारं परब्रह्मैकचिन्मयम् ॥ १४॥ परशक्तिसमायुक्तं
    परशक्त्येकवन्दितम् । परशक्तिप्रकाशाख्यं परशक्तिविलासितम् ॥ १५॥ परसर्वज्ञभावस्थं परसर्वगतं विभुम् ।
    परसर्वेश्वरं देवं परसर्वप्रकाशकम् ॥ १६॥ परसत्यस्वरूपं च परसङ्कल्पवर्जितम् । परसिद्धान्तनिष्णातं परसिद्धिप्रदायकम्
    ॥ १७॥ परसौभाग्यसम्पन्नं परसौम्यस्वभावकम् । परसौन्दर्यसारं च परसौख्यैकदायकम् ॥ १८॥ परसृष्टिप्रवर्तकं
    परसंहारकारकम् । परस्थित्याधारभूतं परलीलाविलासितम् ॥ १९॥ परब्रह्मपरं धाम परब्रह्मैकविग्रहम् । परब्रह्मरसं
    पूर्णं परब्रह्ममयं महत् ॥ २०॥ परमाव्यक्तरूपं च परमेशानमव्ययम् । परमेष्ठिपदस्थं च परमान्तरवर्तिनम्
    ॥ २१॥ परमायतनं शुद्धं परमानन्दवर्धनम् । परमात्मप्रबोधं च परमात्मैकभास्वरम् ॥ २२॥ परमात्मैकसाक्षिणं
    परमान्तर्निरन्तरम् । परमात्मप्रकाशं च परमात्मरसात्मकम् ॥ २३॥ परमाराध्यदेवं च परमोपासनात्मकम् । परमार्थैकविज्ञेयं
    परमज्ञानदायकम् ॥ २४॥ परमौषधमव्यग्रं परभवरोगनाशनम् । परमामृतधारं च परमानन्दवर्षकम् ॥ २५॥ परमेश्वरसन्दृश्यं
    परमोदारचेष्टितम् । परमोच्चपदं नित्यं परमोद्गीतवैभवम् ॥ २६॥ परमेष्ठिसमाराध्यं परमेष्ठिप्रपूजितम् ।
    परमेष्ठिस्वरूपं च परमेष्ठिप्रकाशितम् ॥ २७॥ परमन्त्रस्वरूपं च परमन्त्रार्थगोचरम् । परमन्त्रैकवेद्यं
    च परमन्त्रप्रबोधकम् ॥ २८॥ परमुद्राविनिर्मुक्तं परभावैकसाधकम् । परभक्तिप्रकाशं च परभक्तैकवाञ्छितम्
    ॥ २९॥ परब्रह्मैकनिष्ठं च परब्रह्मपरायणम् । परब्रह्मप्रसादं च परब्रह्मैकमङ्गलम् ॥ ३०॥ परमुक्तिस्वरूपं
    च परमुक्तिप्रदायकम् । परनिर्मलचैतन्यं परनिर्वाणदायकम् ॥ ३१॥ परस्फुरणरूपं च परस्फूर्तिविवर्धनम् । परसौम्यप्रकाशं
    च परसौख्यैकमन्दिरम् ॥ ३२॥ परविश्वप्रसूतिर्मूलं परविश्वविलापकृत् । परविश्वैकसाक्षी च परविश्वविलक्षणम्
    ॥ ३३॥ परकालविनिर्मुक्तं परकालप्रवर्तकम् । परकालान्तकं शान्तं परकालैकसाक्षिणम् ॥ ३४॥ परतत्त्वैकनिष्ठं
    च परतत्त्वविवर्जितम् । परतत्त्वप्रदीपं च परतत्त्वैकबोधकम् ॥ ३५॥ परयोगसमाधिस्थं परयोगिवरार्चितम् ।
    परयोगैकगम्यं च परयोगप्रकाशकम् ॥ ३६॥ परनादस्वरूपं च परनादविवर्धनम् । परनादान्तसंलीनं परनादैकमण्डलम्
    ॥ ३७॥ परबिन्दुस्वरूपं च परबिन्दुविलक्षणम् । परबिन्दुप्रकाशं च परबिन्द्वात्मकं महत् ॥ ३८॥ परकलातिगं
    शुद्धं परकलाविवर्जितम् । परकलाप्रभासारं परकलैकमूलकम् ॥ ३९॥ परामर्शस्वरूपं च परामर्शैकसाधकम् । परामृतरसासारं
    परामृतप्रदायकम् ॥ ४०॥ परान्तर्यामिस्वरूपं च परान्तर्यामिवन्दितम् । परान्तर्यामिसाक्षिणं परान्तर्यामिविग्रहम्
    ॥ ४१॥ परबोधप्रदीपं च परबोधैकदायकम् । परबोधामृतासारं परबोधैकमन्दिरम् ॥ ४२॥ परव्योमविलासं च परव्योमैकभास्वरम्
    । परव्योमातिसूक्ष्मं च परव्योमप्रकाशकम् ॥ ४३॥ परहंसस्वरूपं च परहंसैकसेवितम् । परहंसगतिगम्यं च परहंसपरायणम्
    ॥ ४४॥ परमौनस्वरूपं च परमौनप्रकाशकम् । परमौनैकवेद्यं च परमौनविवर्धनम् ॥ ४५॥ परचित्तप्रबोधं च परचित्तैकनायकम्
    । परचित्तस्थितं नित्यं परचित्तविलक्षणम् ॥ ४६॥ परानन्दरसार्णवं परानन्दैकविग्रहम् । परानन्दप्रवाहं च
    परानन्दप्रदायकम् ॥ ४७॥ परशून्यविनिर्मुक्तं परपूर्णैकमण्डलम् । परपूर्णप्रकाशं च परपूर्णैकदायकम् ॥ ४८॥
    परब्रह्मस्वरूपं च परब्रह्मैककारणम् । परब्रह्मप्रभाजालं परब्रह्मैकवैभवम् ॥ ४९॥ परमङ्गलमव्यक्तं परमङ्गलवर्धनम्
    । परमङ्गलधामं च परमङ्गलमण्डितम् ॥ ५०॥ परब्रह्मैकविज्ञानं परब्रह्मैकसाधनम् । परब्रह्मैकविश्रान्तं परब्रह्मैकमण्डलम्
    ॥ ५१॥ परब्रह्मैकसन्देहच्छेदकं ज्ञानभास्वरम् । परब्रह्मैकनिर्धारं परब्रह्मैकनिश्चयम् ॥ ५२॥ परब्रह्मैकसारज्ञं
    परब्रह्मैकभावितम् । परब्रह्मैकसंवेद्यं परब्रह्मैकचिन्तनम् ॥ ५३॥ परब्रह्मैकनिर्लेपं परब्रह्मैकनिर्मलम्
    । परब्रह्मैकनिर्वाणं परब्रह्मैकशाश्वतम् ॥ ५४॥ परब्रह्मैकवेदान्तं परब्रह्मैकगोचरम् । परब्रह्मैकसंस्थानं
    परब्रह्मैकदर्शनम् ॥ ५५॥ परब्रह्मैकसर्वस्वं परब्रह्मैकजीवनम् । परब्रह्मैकहृदयं परब्रह्मैकवैभवम् ॥ ५६॥
    परब्रह्मैकमाधुर्यं परब्रह्मैकमञ्जुलम् । परब्रह्मैकलावण्यं परब्रह्मैकसुन्दरम् ॥ ५७॥ परब्रह्मैकशक्तिं
    च परब्रह्मैकविग्रहम् । परब्रह्मैकलीलाढ्यं परब्रह्मैकपालकम् ॥ ५८॥ परब्रह्मैकनिलयं परब्रह्मैकमन्दिरम्
    । परब्रह्मैकदीपं च परब्रह्मैकभास्वरम् ॥ ५९॥ परब्रह्मललिताम्बिकां परमेशीं परात्पराम् । परब्रह्मस्वरूपां
    तां प्रणमामि निरन्तरम् ॥ ६०॥ इदं परब्रह्मपरायणानां गुह्यं परं ब्रह्मरसैकसारम् । यः पठते भक्तियुतः
    प्रशान्तो न तस्य लोकेषु पराभवः स्यात् ॥ १॥ त्रिसन्ध्यमेतत् प्रजपेन्नरो यः शुचिः प्रसन्नो गुरुभक्तियुक्तः
    । तस्यैव वाक् सिद्धिमुपैति नित्यं ज्ञानप्रवाहश्च हृदि प्रवृद्धः ॥ २॥ यस्य स्मृतौ वर्तति नाममाला परब्रह्मपूर्णाख्यपदप्रदीपा
    । तस्यैव चित्तं विमलं भवेत् तत् यथा नभः शारदचन्द्रशुभ्रम् ॥ ३॥ न दारिद्र्यं न च दैन्यभावो न मोहजालं
    न च कर्मबन्धः । परब्रह्मतत्त्वैकनिरूढचित्तः स मुक्तिमार्गे सततं प्रवृत्तः ॥ ४॥ अविद्यया यः परिमोहितात्मा
    संसारघोरार्णवमध्यमग्नः । पठन् त्रिशत्याः परमां विभूतिं प्राप्नोति तत्त्वामृतसिन्धुपारम् ॥ ५॥ न केवलं
    भौतिकसिद्धिलाभो न केवलं स्वर्गपदप्रसिद्धिः । अस्य प्रभावात् परमैक्यबोधः स्वयम्प्रकाशः हृदि जायते हि
    ॥ ६॥ वेदान्तवेद्यं परमं रहस्यं आगम्यगम्यं मुनिभिर्विचिन्त्यम् । यस्यैव नित्यं हृदि संस्थितं स्यात्
    स वेद सर्वं न च तस्य मोहः ॥ ७॥ अष्टौ दिशो यस्य यशो वहन्ति लोकत्रयं यस्य पदं नमन्ति । सिद्धाश्च योगीन्द्रगणाश्च
    नित्यं स्तुवन्ति तं ब्रह्ममयं नरं हि ॥ ८॥ एकवारं पठेद्यस्तु श्रद्धया शुद्धमानसः । तस्य जन्मार्जितं
    पापं क्षीयते नात्र संशयः ॥ ९॥ शतवारं पठेद्यस्तु मनसा नियमेन च । तस्य ज्ञानप्रदीपस्य प्रकाशो जायते
    ध्रुवम् ॥ १०॥ सहस्रवारपाठेन पुरश्चर्याफलं लभेत् । चिन्मात्रैकस्थितिं याति न पुनर्मोहभाग्भवेत् ॥ ११॥
    लक्षपाठेन सिद्धिः स्यात् इति योगिषु निश्चयः । परब्रह्मैकभावेन लीयते साधकोत्तमः ॥ १२॥ नास्य तुल्या
    कथा काचिन्नास्य तुल्यं फलं स्मृतम् । यत्र परब्रह्म प्रकाशते ॥ १३॥ गोपनीयं प्रयत्नेन भक्तिहीनाय नार्पयेत्
    । श्रद्धावते गुरौ भक्ते दातव्यं ब्रह्मवेदिने ॥ १४॥ यः पठेत् प्रातरुत्थाय नित्यं श्रद्धासमन्वितः ।
    स जीवन्नेव मुक्तः स्यात् सत्यं सत्यं न संशयः ॥ १५॥ इति श्रीपरब्रह्मपकारादित्रिशतिस्तोत्रं सम्पूर्णम्
    ।
