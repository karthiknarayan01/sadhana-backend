    बाघिनि भूखी ॥ ब्याधि असाधि जानि तिन्ह त्यागी। चलीं कहत मतिमन्द अभागी ॥ राजु करत यह दैअँ बिगोई। कीन्हेसि
    अस जस करि न कोई ॥ एहि बिधि बिलपहिं पुर नर नारीं। देहिं कुचालिहि कोटिक गारीम् ॥ जरहिं बिषम जर लेहिं
    उसासा। कवनि राम बिनु जीवन आसा ॥ बिपुल बियोग प्रजा अकुलानी। जनु जलचर गन सूखत पानी ॥ अति बिषाद बस लोग
    लोगाई। गे मातु पहिं रामु गोसाई ॥ मुख प्रसन्न चित चौगुन च् । मिटा सोचु जनि राखै र् नव गयन्दु रघुबीर
    मनु राजु अलान समान। छूट जानि बन गवनु सुनि उर अनन्दु अधिकान ॥ ॥ रघुकुलतिलक जोरि दौ हाथा। मुदित मातु
    पद नायु माथा ॥ दीन्हि असीस लाइ उर लीन्हे। भूषन बसन निछावरि कीन्हे ॥ बार बार मुख चुम्बति माता। नयन
    नेह जलु पुलकित गाता ॥ गोद राखि पुनि हृदयँ लगाए। स्त्रवत प्रेनरस पयद सुहाए ॥ प्रेमु प्रमोदु न कछु कहि
    जाई। रङ्क धनद पदबी जनु पाई ॥ सादर सुन्दर बदनु निहारी। बोली मधुर बचन महतारी ॥ कहहु तात जननी बलिहारी।
    कबहिं लगन मुद मङ्गलकारी ॥ सुकृत सील सुख सीवँ सुहाई। जनम लाभ कि अवधि अघाई ॥ दो जेहि चाहत नर नारि सब
    अति आरत एहि भाँति। जिमि चातक चातकि तृषित बृष्टि सरद रितु स्वाति ॥ ॥ तात जाउँ बलि बेगि नहाहू। जो मन
    भाव मधुर कछु खाहू ॥ पितु समीप तब जाएहु भैआ। भि बड़इ बार जाइ बलि मैआ ॥ मातु बचन सुनि अति अनुकूला। जनु
    सनेह सुरतरु के फूला ॥ सुख मकरन्द भरे श्रियमूला। निरखि राम मनु भवरुँ न भूला ॥ धरम धुरीन धरम गति जानी।
    कहेउ मातु सन अति मृदु बानी ॥ पिताँ दीन्ह मोहि कानन राजू। जहँ सब भाँति मोर बड़ काजू ॥ आयसु देहि मुदित
    मन माता। जेहिं मुद मङ्गल कानन जाता ॥ जनि सनेह बस डरपसि भोरें। आनँदु अम्ब अनुग्रह तोरेम् ॥ दो बरष चारिदस
    बिपिन बसि करि पितु बचन प्रमान। आइ पाय पुनि देखिहुँ मनु जनि करसि मलान ॥ ॥ बचन बिनीत मधुर रघुबर के।
    सर सम लगे मातु उर करके ॥ सहमि सूखि सुनि सीतलि बानी। जिमि जवास परें पावस पानी ॥ कहि न जाइ कछु हृदय
    बिषादू। मनहुँ मृगी सुनि केहरि नादू ॥ नयन सजल तन थर थर काँपी। माजहि खाइ मीन जनु मापी ॥ धरि धीरजु सुत
    बदनु निहारी। गदगद बचन कहति महतारी ॥ तात पितहि तुम्ह प्रानपिआरे। देखि मुदित नित चरित तुम्हारे ॥ राजु
    देन कहुँ सुभ दिन साधा। कहेउ जान बन केहिं अपराधा ॥ तात सुनावहु मोहि निदानू। को दिनकर कुल भयु कृसानू
    ॥ दो निरखि राम रुख सचिवसुत कारनु कहेउ बुझाइ। सुनि प्रसङ्गु रहि मूक जिमि दसा बरनि नहिं जाइ ॥ ॥ राखि
    न सकि न कहि सक जाहू। दुहूँ भाँति उर दारुन दाहू ॥ लिखत सुधाकर गा लिखि राहू। बिधि गति बाम सदा सब काहू
    ॥ धरम सनेह उभयँ मति घेरी। भि गति साँप छुछुन्दरि केरी ॥ राखुँ सुतहि करुँ अनुरोधू। धरमु जाइ अरु बन्धु
    बिरोधू ॥ कहुँ जान बन तौ बड़इ हानी। सङ्कट सोच बिबस भि रानी ॥ बहुरि समुझि तिय धरमु सयानी। रामु भरतु
    दौ सुत सम जानी ॥ सरल सुभाउ राम महतारी। बोली बचन धीर धरि भारी ॥ तात जाउँ बलि कीन्हेहु नीका। पितु आयसु
    सब धरमक टीका ॥ दो राजु देन कहि दीन्ह बनु मोहि न सो दुख लेसु। तुम्ह बिनु भरतहि भूपतिहि प्रजहि प्रचण्ड
    कलेसु ॥ ॥ जौं केवल पितु आयसु ताता। तौ जनि जाहु जानि बड़इ माता ॥ जौं पितु मातु कहेउ बन जाना। तौं कानन
    सत अवध समाना ॥ पितु बनदेव मातु बनदेवी। खग मृग चरन सरोरुह सेवी ॥ अन्तहुँ उचित नृपहि बनबासू। बय बिलोकि
    हियँ होइ हराँसू ॥ बड़भागी बनु अवध अभागी। जो रघुबंसतिलक तुम्ह त्यागी ॥ जौं सुत कहौ सङ्ग मोहि लेहू।
    तुम्हरे हृदयँ होइ सन्देहू ॥ पूत परम प्रिय तुम्ह सबही के। प्रान प्रान के जीवन जी के ॥ ते तुम्ह कहहु
    मातु बन ज् ँ। मैं सुनि बचन बैठि पछित् यह बिचारि नहिं करुँ हठ झूठ सनेहु बढ़आइ। मानि मातु कर नात बलि
    सुरति बिसरि जनि जाइ ॥ ॥ देव पितर सब तुन्हहि गोसाई। राखहुँ पलक नयन की नाई ॥ अवधि अम्बु प्रिय परिजन
    मीना। तुम्ह करुनाकर धरम धुरीना ॥ अस बिचारि सोइ करहु उपाई। सबहि जिअत जेहिं भेण्टेहु आई ॥ जाहु सुखेन
    बनहि बलि ज् ँ। करि अनाथ जन परिजन ग् ँ ॥ सब कर आजु सुकृत फल बीता। भयु कराल कालु बिपरीता ॥ बहुबिधि बिलपि
    चरन लपटानी। परम अभागिनि आपुहि जानी ॥ दारुन दुसह दाहु उर ब्यापा। बरनि न जाहिं बिलाप कलापा ॥ राम उठाइ
    मातु उर लाई। कहि मृदु बचन बहुरि समुझाई ॥ दो समाचार तेहि समय सुनि सीय उठी अकुलाइ। जाइ सासु पद कमल जुग
    बन्दि बैठि सिरु नाइ ॥ ॥ दीन्हि असीस सासु मृदु बानी। अति सुकुमारि देखि अकुलानी ॥ बैठि नमितमुख सोचति
    सीता। रूप रासि पति प्रेम पुनीता ॥ चलन चहत बन जीवननाथू। केहि सुकृती सन होइहि साथू ॥ की तनु प्रान कि
    केवल प्राना। बिधि करतबु कछु जाइ न जाना ॥ चारु चरन नख लेखति धरनी। नूपुर मुखर मधुर कबि बरनी ॥ मनहुँ
    प्रेम बस बिनती करहीं। हमहि सीय पद जनि परिहरहीम् ॥ मञ्जु बिलोचन मोचति बारी। बोली देखि राम महतारी ॥
    तात सुनहु सिय अति सुकुमारी। सासु ससुर परिजनहि पिआरी ॥ दो पिता जनक भूपाल मनि ससुर भानुकुल भानु। पति
    रबिकुल कैरव बिपिन बिधु गुन रूप निधानु ॥ ॥ मैं पुनि पुत्रबधू प्रिय पाई। रूप रासि गुन सील सुहाई ॥ नयन
    पुतरि करि प्रीति बढ़आई। राखेउँ प्रान जानिकिहिं लाई ॥ कलपबेलि जिमि बहुबिधि लाली। सीञ्चि सनेह सलिल प्रतिपाली
    ॥ फूलत फलत भयु बिधि बामा। जानि न जाइ काह परिनामा ॥ पलँग पीठ तजि गोद हिण्ड़ओरा। सियँ न दीन्ह पगु अवनि
    कठोरा ॥ जिअनमूरि जिमि जोगवत रहूँ। दीप बाति नहिं टारन कहूँ ॥ सोइ सिय चलन चहति बन साथा। आयसु काह होइ
    रघुनाथा। चन्द किरन रस रसिक चकोरी। रबि रुख नयन सकि किमि जोरी ॥ दो करि केहरि निसिचर चरहिं दुष्ट जन्तु
    बन भूरि। बिष बाटिकाँ कि सोह सुत सुभग सजीवनि मूरि ॥ ॥ बन हित कोल किरात किसोरी। रचीं बिरञ्चि बिषय सुख
    भोरी ॥ पाइन कृमि जिमि कठिन सुभ् । तिन्हहि कलेसु न कानन क् ॥ कै तापस तिय कानन जोगू। जिन्ह तप हेतु तजा
    सब भोगू ॥ सिय बन बसिहि तात केहि भाँती। चित्रलिखित कपि देखि डेराती ॥ सुरसर सुभग बनज बन चारी। डाबर जोगु
    कि हंसकुमारी ॥ अस बिचारि जस आयसु होई। मैं सिख देउँ जानकिहि सोई ॥ जौं सिय भवन रहै कह अम्बा। मोहि कहँ
    होइ बहुत अवलम्बा ॥ सुनि रघुबीर मातु प्रिय बानी। सील सनेह सुधाँ जनु सानी ॥ दो कहि प्रिय बचन बिबेकमय
    कीन्हि मातु परितोष। लगे प्रबोधन जानकिहि प्रगटि बिपिन गुन दोष ॥ चौदहवाँ विश्राम मातु समीप कहत सकुचाहीं।
    बोले समु समुझि मन माहीम् ॥ राजकुमारि सिखावन सुनहू। आन भाँति जियँ जनि कछु गुनहू ॥ आपन मोर नीक जौं चहहू।
    बचनु हमार मानि गृह रहहू ॥ आयसु मोर सासु सेवकाई। सब बिधि भामिनि भवन भलाई ॥ एहि ते अधिक धरमु नहिं दूजा।
    सादर सासु ससुर पद पूजा ॥ जब जब मातु करिहि सुधि मोरी। होइहि प्रेम बिकल मति भोरी ॥ तब तब तुम्ह कहि कथा
    पुरानी। सुन्दरि समुझाएहु मृदु बानी ॥ कहुँ सुभायँ सपथ सत मोही। सुमुखि मातु हित राखुँ तोही ॥ दो गुर
    श्रुति सम्मत धरम फलु पाइअ बिनहिं कलेस। हठ बस सब सङ्कट सहे गालव नहुष नरेस ॥ ॥ मैं पुनि करि प्रवान पितु
    बानी। बेगि फिरब सुनु सुमुखि सयानी ॥ दिवस जात नहिं लागिहि बारा। सुन्दरि सिखवनु सुनहु हमारा ॥ जौ हठ
    करहु प्रेम बस बामा। तौ तुम्ह दुखु पाउब परिनामा ॥ काननु कठिन भयङ्करु भारी। घोर घामु हिम बारि बयारी
    ॥ कुस कण्टक मग काँकर नाना। चलब पयादेहिं बिनु पदत्राना ॥ चरन कमल मुदु मञ्जु तुम्हारे। मारग अगम भूमिधर
    भारे ॥ कन्दर खोह नदीं नद नारे। अगम अगाध न जाहिं निहारे ॥ भालु बाघ बृक केहरि नागा। करहिं नाद सुनि धीरजु
    भागा ॥ दो भूमि सयन बलकल बसन असनु कन्द फल मूल। ते कि सदा सब दिन मिलिहिं सबुइ समय अनुकूल ॥ ॥ नर अहार
    रजनीचर चरहीं। कपट बेष बिधि कोटिक करहीम् ॥ लागि अति पहार कर पानी। बिपिन बिपति नहिं जाइ बखानी ॥ ब्याल
    कराल बिहग बन घोरा। निसिचर निकर नारि नर चोरा ॥ डरपहिं धीर गहन सुधि आएँ। मृगलोचनि तुम्ह भीरु सुभाएँ
    ॥ हंसगवनि तुम्ह नहिं बन जोगू। सुनि अपजसु मोहि देइहि लोगू ॥ मानस सलिल सुधाँ प्रतिपाली। जिऐ कि लवन पयोधि
    मराली ॥ नव रसाल बन बिहरनसीला। सोह कि कोकिल बिपिन करीला ॥ रहहु भवन अस हृदयँ बिचारी। चन्दबदनि दुखु कानन
    भारी ॥ दो सहज सुह्द गुर स्वामि सिख जो न करि सिर मानि ॥ सो पछिताइ अघाइ उर अवसि होइ हित हानि ॥ ॥ सुनि
    मृदु बचन मनोहर पिय के। लोचन ललित भरे जल सिय के ॥ सीतल सिख दाहक भि कैंसें। चकिहि सरद चन्द निसि जैंसेम्
    ॥ उतरु न आव बिकल बैदेही। तजन चहत सुचि स्वामि सनेही ॥ बरबस रोकि बिलोचन बारी। धरि धीरजु उर अवनिकुमारी
    ॥ लागि सासु पग कह कर जोरी। छमबि देबि बड़इ अबिनय मोरी ॥ दीन्हि प्रानपति मोहि सिख सोई। जेहि बिधि मोर
    परम हित होई ॥ मैं पुनि समुझि दीखि मन माहीं। पिय बियोग सम दुखु जग नाहीम् ॥ दो प्राननाथ करुनायतन सुन्दर
    सुखद सुजान। तुम्ह बिनु रघुकुल कुमुद बिधु सुरपुर नरक समान ॥ ॥ मातु पिता भगिनी प्रिय भाई। प्रिय परिवारु
    सुह्रद समुदाई ॥ सासु ससुर गुर सजन सहाई। सुत सुन्दर सुसील सुखदाई ॥ जहँ लगि नाथ नेह अरु नाते। पिय बिनु
    तियहि तरनिहु ते ताते ॥ तनु धनु धामु धरनि पुर राजू। पति बिहीन सबु सोक समाजू ॥ भोग रोगसम भूषन भारू।
    जम जातना सरिस संसारू ॥ प्राननाथ तुम्ह बिनु जग माहीं। मो कहुँ सुखद कतहुँ कछु नाहीम् ॥ जिय बिनु देह
    नदी बिनु बारी। तैसिअ नाथ पुरुष बिनु नारी ॥ नाथ सकल सुख साथ तुम्हारें। सरद बिमल बिधु बदनु निहारेम्
    ॥ दो खग मृग परिजन नगरु बनु बलकल बिमल दुकूल। नाथ साथ सुरसदन सम परनसाल सुख मूल ॥ ॥ बनदेवीं बनदेव उदारा।
    करिहहिं सासु ससुर सम सारा ॥ कुस किसलय साथरी सुहाई। प्रभु सँग मञ्जु मनोज तुराई ॥ कन्द मूल फल अमिअ अहारू।
    अवध सौध सत सरिस पहारू ॥ छिनु छिनु प्रभु पद कमल बिलोकि। रहिहुँ मुदित दिवस जिमि कोकी ॥ बन दुख नाथ कहे
    बहुतेरे। भय बिषाद परिताप घनेरे ॥ प्रभु बियोग लवलेस समाना। सब मिलि होहिं न कृपानिधाना ॥ अस जियँ जानि
    सुजान सिरोमनि। लेइअ सङ्ग मोहि छाड़इअ जनि ॥ बिनती बहुत करौं का स्वामी। करुनामय उर अन्तरजामी ॥ दो राखिअ
    अवध जो अवधि लगि रहत न जनिअहिं प्रान। दीनबन्धु सन्दर सुखद सील सनेह निधान ॥ ॥ मोहि मग चलत न होइहि हारी।
    छिनु छिनु चरन सरोज निहारी ॥ सबहि भाँति पिय सेवा करिहौं। मारग जनित सकल श्रम हरिहौम् ॥ पाय पखारी बैठि
    तरु छाहीं। करिहुँ बाउ मुदित मन माहीम् ॥ श्रम कन सहित स्याम तनु देखें। कहँ दुख समु प्रानपति पेखेम्
    ॥ सम महि तृन तरुपल्लव डासी। पाग पलोटिहि सब निसि दासी ॥ बारबार मृदु मूरति जोही। लागहि तात बयारि न मोही।
    को प्रभु सँग मोहि चितवनिहारा। सिङ्घबधुहि जिमि ससक सिआरा ॥ मैं सुकुमारि नाथ बन जोगू। तुम्हहि उचित तप
    मो कहुँ भोगू ॥ दो ऐसेउ बचन कठोर सुनि जौं न ह्रदु बिलगान। तौ प्रभु बिषम बियोग दुख सहिहहिं पावँर प्रान
    ॥ ॥ अस कहि सीय बिकल भि भारी। बचन बियोगु न सकी सँभारी ॥ देखि दसा रघुपति जियँ जाना। हठि राखें नहिं राखिहि
    प्राना ॥ कहेउ कृपाल भानुकुलनाथा। परिहरि सोचु चलहु बन साथा ॥ नहिं बिषाद कर अवसरु आजू। बेगि करहु बन
    गवन समाजू ॥ कहि प्रिय बचन प्रिया समुझाई। लगे मातु पद आसिष पाई ॥ बेगि प्रजा दुख मेटब आई। जननी निठुर
    बिसरि जनि जाई ॥ फिरहि दसा बिधि बहुरि कि मोरी। देखिहुँ नयन मनोहर जोरी ॥ सुदिन सुघरी तात कब होइहि। जननी
    जिअत बदन बिधु जोइहि ॥ दो बहुरि बच्छ कहि लालु कहि रघुपति रघुबर तात। कबहिं बोलाइ लगाइ हियँ हरषि निरखिहुँ
    गात ॥ ॥ लखि सनेह कातरि महतारी। बचनु न आव बिकल भि भारी ॥ राम प्रबोधु कीन्ह बिधि नाना। समु सनेहु न जाइ
    बखाना ॥ तब जानकी सासु पग लागी। सुनिअ माय मैं परम अभागी ॥ सेवा समय दैअँ बनु दीन्हा। मोर मनोरथु सफल
    न कीन्हा ॥ तजब छोभु जनि छाड़इअ छोहू। करमु कठिन कछु दोसु न मोहू ॥ सुनि सिय बचन सासु अकुलानी। दसा कवनि
    बिधि कहौं बखानी ॥ बारहि बार लाइ उर लीन्ही। धरि धीरजु सिख आसिष दीन्ही ॥ अचल हौ अहिवातु तुम्हारा। जब
    लगि गङ्ग जमुन जल धारा ॥ दो सीतहि सासु असीस सिख दीन्हि अनेक प्रकार। चली नाइ पद पदुम सिरु अति हित बारहिं
    बार ॥ ॥ समाचार जब लछिमन पाए। ब्याकुल बिलख बदन उठि धाए ॥ कम्प पुलक तन नयन सनीरा। गहे चरन अति प्रेम
    अधीरा ॥ कहि न सकत कछु चितवत ठाढ़ए। मीनु दीन जनु जल तें काढ़ए ॥ सोचु हृदयँ बिधि का होनिहारा। सबु सुखु
    सुकृत सिरान हमारा ॥ मो कहुँ काह कहब रघुनाथा। रखिहहिं भवन कि लेहहिं साथा ॥ राम बिलोकि बन्धु कर जोरें।
    देह गेह सब सन तृनु तोरेम् ॥ बोले बचनु राम नय नागर। सील सनेह सरल सुख सागर ॥ तात प्रेम बस जनि कदराहू।
    समुझि हृदयँ परिनाम उछाहू ॥ दो मातु पिता गुरु स्वामि सिख सिर धरि करहि सुभायँ। लहेउ लाभु तिन्ह जनम कर
    नतरु जनमु जग जायँ ॥ ॥ अस जियँ जानि सुनहु सिख भाई। करहु मातु पितु पद सेवकाई ॥ भवन भरतु रिपुसूदन नाहीं।
    राउ बृद्ध मम दुखु मन माहीम् ॥ मैं बन जाउँ तुम्हहि लेइ साथा। होइ सबहि बिधि अवध अनाथा ॥ गुरु पितु मातु
    प्रजा परिवारू। सब कहुँ परि दुसह दुख भारू ॥ रहहु करहु सब कर परितोषू। नतरु तात होइहि बड़ दोषू ॥ जासु
    राज प्रिय प्रजा दुखारी। सो नृपु अवसि नरक अधिकारी ॥ रहहु तात असि नीति बिचारी। सुनत लखनु भे ब्याकुल
    भारी ॥ सिअरें बचन सूखि गे कैंसें। परसत तुहिन तामरसु जैसेम् ॥ दो उतरु न आवत प्रेम बस गहे चरन अकुलाइ।
    नाथ दासु मैं स्वामि तुम्ह तजहु त काह बसाइ ॥ ॥ दीन्हि मोहि सिख नीकि गोसाईं। लागि अगम अपनी कदराईम् ॥
    नरबर धीर धरम धुर धारी। निगम नीति कहुँ ते अधिकारी ॥ मैं सिसु प्रभु सनेहँ प्रतिपाला। मन्दरु मेरु कि
    लेहिं मराला ॥ गुर पितु मातु न जानुँ काहू। कहुँ सुभाउ नाथ पतिआहू ॥ जहँ लगि जगत सनेह सगाई। प्रीति प्रतीति
    निगम निजु गाई ॥ मोरें सबि एक तुम्ह स्वामी। दीनबन्धु उर अन्तरजामी ॥ धरम नीति उपदेसिअ ताही। कीरति भूति
    सुगति प्रिय जाही ॥ मन क्रम बचन चरन रत होई। कृपासिन्धु परिहरिअ कि सोई ॥ दो करुनासिन्धु सुबन्ध के सुनि
    मृदु बचन बिनीत। समुझाए उर लाइ प्रभु जानि सनेहँ सभीत ॥ ॥ मागहु बिदा मातु सन जाई। आवहु बेगि चलहु बन
    भाई ॥ मुदित भे सुनि रघुबर बानी। भयु लाभ बड़ गि बड़इ हानी ॥ हरषित ह्दयँ मातु पहिं आए। मनहुँ अन्ध फिरि
    लोचन पाए। जाइ जननि पग नायु माथा। मनु रघुनन्दन जानकि साथा ॥ पूँछे मातु मलिन मन देखी। लखन कही सब कथा
    बिसेषी ॥ गी सहमि सुनि बचन कठोरा। मृगी देखि दव जनु चहु ओरा ॥ लखन लखेउ भा अनरथ आजू। एहिं सनेह बस करब
    अकाजू ॥ मागत बिदा सभय सकुचाहीं। जाइ सङ्ग बिधि कहिहि कि नाही ॥ दो समुझि सुमित्राँ राम सिय रूप सुसीलु
    सुभाउ। नृप सनेहु लखि धुनेउ सिरु पापिनि दीन्ह कुदाउ ॥ ॥ धीरजु धरेउ कुअवसर जानी। सहज सुह्द बोली मृदु
    बानी ॥ तात तुम्हारि मातु बैदेही। पिता रामु सब भाँति सनेही ॥ अवध तहाँ जहँ राम निवासू। तहँइँ दिवसु जहँ
    भानु प्रकासू ॥ जौ पै सीय रामु बन जाहीं। अवध तुम्हार काजु कछु नाहिम् ॥ गुर पितु मातु बन्धु सुर साई।
    सेइअहिं सकल प्रान की नाईम् ॥ रामु प्रानप्रिय जीवन जी के। स्वारथ रहित सखा सबही कै ॥ पूजनीय प्रिय परम
    जहाँ तें। सब मानिअहिं राम के नातेम् ॥ अस जियँ जानि सङ्ग बन जाहू। लेहु तात जग जीवन लाहू ॥ दो भूरि भाग
    भाजनु भयहु मोहि समेत बलि जाउँ। जौम तुम्हरें मन छाड़इ छलु कीन्ह राम पद ठाउँ ॥ ॥ पुत्रवती जुबती जग सोई।
    रघुपति भगतु जासु सुतु होई ॥ नतरु बाँझ भलि बादि बिआनी। राम बिमुख सुत तें हित जानी ॥ तुम्हरेहिं भाग
    रामु बन जाहीं। दूसर हेतु तात कछु नाहीम् ॥ सकल सुकृत कर बड़ फलु एहू। राम सीय पद सहज सनेहू ॥ राग रोषु
    इरिषा मदु मोहू। जनि सपनेहुँ इन्ह के बस होहू ॥ सकल प्रकार बिकार बिहाई। मन क्रम बचन करेहु सेवकाई ॥ तुम्ह
    कहुँ बन सब भाँति सुपासू। सँग पितु मातु रामु सिय जासू ॥ जेहिं न रामु बन लहहिं कलेसू। सुत सोइ करेहु
    इहि उपदेसू ॥ छं उपदेसु यहु जेहिं तात तुम्हरे राम सिय सुख पावहीं। पितु मातु प्रिय परिवार पुर सुख सुरति
    बन बिसरावहीं। तुलसी प्रभुहि सिख देइ आयसु दीन्ह पुनि आसिष दी। रति हौ अबिरल अमल सिय रघुबीर पद नित नित
    नी ॥ सो मातु चरन सिरु नाइ चले तुरत सङ्कित हृदयँ। बागुर बिषम तोराइ मनहुँ भाग मृगु भाग बस ॥ ॥ गे लखनु
    जहँ जानकिनाथू। भे मन मुदित पाइ प्रिय साथू ॥ बन्दि राम सिय चरन सुहाए। चले सङ्ग नृपमन्दिर आए ॥ कहहिं
    परसपर पुर नर नारी। भलि बनाइ बिधि बात बिगारी ॥ तन कृस दुखु बदन मलीने। बिकल मनहुँ माखी मधु छीने ॥ कर
    मीजहिं सिरु धुनि पछिताहीं। जनु बिन पङ्ख बिहग अकुलाहीम् ॥ भि बड़इ भीर भूप दरबारा। बरनि न जाइ बिषादु
    अपारा ॥ सचिवँ उठाइ राउ बैठारे। कहि प्रिय बचन रामु पगु धारे ॥ सिय समेत दौ तनय निहारी। ब्याकुल भयु भूमिपति
    भारी ॥ दो सीय सहित सुत सुभग दौ देखि देखि अकुलाइ। बारहिं बार सनेह बस राउ लेइ उर लाइ ॥ ॥ सकि न बोलि
    बिकल नरनाहू। सोक जनित उर दारुन दाहू ॥ नाइ सीसु पद अति अनुरागा। उठि रघुबीर बिदा तब मागा ॥ पितु असीस
    आयसु मोहि दीजै। हरष समय बिसमु कत कीजै ॥ तात किएँ प्रिय प्रेम प्रमादू। जसु जग जाइ होइ अपबादू ॥ सुनि
    सनेह बस उठि नरनाहाँ। बैठारे रघुपति गहि बाहाँ ॥ सुनहु तात तुम्ह कहुँ मुनि कहहीं। रामु चराचर नायक अहहीम्
    ॥ सुभ अरु असुभ करम अनुहारी। ईस देइ फलु ह्दयँ बिचारी ॥ करि जो करम पाव फल सोई। निगम नीति असि कह सबु
    कोई ॥ दो औरु करै अपराधु कौ और पाव फल भोगु। अति बिचित्र भगवन्त गति को जग जानै जोगु ॥ ॥ रायँ राम राखन
    हित लागी। बहुत उपाय किए छलु त्यागी ॥ लखी राम रुख रहत न जाने। धरम धुरन्धर धीर सयाने ॥ तब नृप सीय लाइ
    उर लीन्ही। अति हित बहुत भाँति सिख दीन्ही ॥ कहि बन के दुख दुसह सुनाए। सासु ससुर पितु सुख समुझाए ॥ सिय
    मनु राम चरन अनुरागा। घरु न सुगमु बनु बिषमु न लागा ॥ औरु सबहिं सीय समुझाई। कहि कहि बिपिन बिपति अधिकाई
    ॥ सचिव नारि गुर नारि सयानी। सहित सनेह कहहिं मृदु बानी ॥ तुम्ह कहुँ तौ न दीन्ह बनबासू। करहु जो कहहिं
    ससुर गुर सासू ॥ दो सिख सीतलि हित मधुर मृदु सुनि सीतहि न सोहानि। सरद चन्द चन्दनि लगत जनु चकी अकुलानि
    ॥ ॥ सीय सकुच बस उतरु न देई। सो सुनि तमकि उठी कैकेई ॥ मुनि पट भूषन भाजन आनी। आगें धरि बोली मृदु बानी
    ॥ नृपहि प्रान प्रिय तुम्ह रघुबीरा। सील सनेह न छाड़इहि भीरा ॥ सुकृत सुजसु परलोकु नस् । तुम्हहि जान
    बन कहिहि न क् ॥ अस बिचारि सोइ करहु जो भावा। राम जननि सिख सुनि सुखु पावा ॥ भूपहि बचन बानसम लागे। करहिं
    न प्रान पयान अभागे ॥ लोग बिकल मुरुछित नरनाहू। काह करिअ कछु सूझ न काहू ॥ रामु तुरत मुनि बेषु बनाई।
    चले जनक जननिहि सिरु नाई ॥ दो सजि बन साजु समाजु सबु बनिता बन्धु समेत। बन्दि बिप्र गुर चरन प्रभु चले
    करि सबहि अचेत ॥ ॥ निकसि बसिष्ठ द्वार भे ठाढ़ए। देखे लोग बिरह दव दाढ़ए ॥ कहि प्रिय बचन सकल समुझाए।
    बिप्र बृन्द रघुबीर बोलाए ॥ गुर सन कहि बरषासन दीन्हे। आदर दान बिनय बस कीन्हे ॥ जाचक दान मान सन्तोषे।
    मीत पुनीत प्रेम परितोषे ॥ दासीं दास बोलाइ बहोरी। गुरहि सौम्पि बोले कर जोरी ॥ सब कै सार सँभार गोसाईं।
    करबि जनक जननी की नाई ॥ बारहिं बार जोरि जुग पानी। कहत रामु सब सन मृदु बानी ॥ सोइ सब भाँति मोर हितकारी।
    जेहि तें रहै भुआल सुखारी ॥ दो मातु सकल मोरे बिरहँ जेहिं न होहिं दुख दीन। सोइ उपाउ तुम्ह करेहु सब पुर
    जन परम प्रबीन ॥ ॥ एहि बिधि राम सबहि समुझावा। गुर पद पदुम हरषि सिरु नावा। गनपती गौरि गिरीसु मनाई। चले
    असीस पाइ रघुराई ॥ राम चलत अति भयु बिषादू। सुनि न जाइ पुर आरत नादू ॥ कुसगुन लङ्क अवध अति सोकू। हहरष
    बिषाद बिबस सुरलोकू ॥ गि मुरुछा तब भूपति जागे। बोलि सुमन्त्रु कहन अस लागे ॥ रामु चले बन प्रान न जाहीं।
    केहि सुख लागि रहत तन माहीं। एहि तें कवन ब्यथा बलवाना। जो दुखु पाइ तजहिं तनु प्राना ॥ पुनि धरि धीर
    कहि नरनाहू। लै रथु सङ्ग सखा तुम्ह जाहू ॥ दो सुठि सुकुमार कुमार दौ जनकसुता सुकुमारि। रथ चढ़आइ देखराइ
    बनु फिरेहु गेँ दिन चारि ॥ ॥ जौ नहिं फिरहिं धीर दौ भाई। सत्यसन्ध दृढ़ब्रत रघुराई ॥ तौ तुम्ह बिनय करेहु
    कर जोरी। फेरिअ प्रभु मिथिलेसकिसोरी ॥ जब सिय कानन देखि डेराई। कहेहु मोरि सिख अवसरु पाई ॥ सासु ससुर
    अस कहेउ सँदेसू। पुत्रि फिरिअ बन बहुत कलेसू ॥ पितृगृह कबहुँ कबहुँ ससुरारी। रहेहु जहाँ रुचि होइ तुम्हारी
    ॥ एहि बिधि करेहु उपाय कदम्बा। फिरि त होइ प्रान अवलम्बा ॥ नाहिं त मोर मरनु परिनामा। कछु न बसाइ भेँ
    बिधि बामा ॥ अस कहि मुरुछि परा महि र् । रामु लखनु सिय आनि देख् पाइ रजायसु नाइ सिरु रथु अति बेग बनाइ।
    गयु जहाँ बाहेर नगर सीय सहित दौ भाइ ॥ ॥ तब सुमन्त्र नृप बचन सुनाए। करि बिनती रथ रामु चढ़आए ॥ चढ़इ रथ
    सीय सहित दौ भाई। चले हृदयँ अवधहि सिरु नाई ॥ चलत रामु लखि अवध अनाथा। बिकल लोग सब लागे साथा ॥ कृपासिन्धु
    बहुबिधि समुझावहिं। फिरहिं प्रेम बस पुनि फिरि आवहिम् ॥ लागति अवध भयावनि भारी। मानहुँ कालराति अँधिआरी
    ॥ घोर जन्तु सम पुर नर नारी। डरपहिं एकहि एक निहारी ॥ घर मसान परिजन जनु भूता। सुत हित मीत मनहुँ जमदूता
    ॥ बागन्ह बिटप बेलि कुम्हिलाहीं। सरित सरोवर देखि न जाहीम् ॥ दो हय गय कोटिन्ह केलिमृग पुरपसु चातक मोर।
    पिक रथाङ्ग सुक सारिका सारस हंस चकोर ॥ ॥ राम बियोग बिकल सब ठाढ़ए। जहँ तहँ मनहुँ चित्र लिखि काढ़ए ॥
    नगरु सफल बनु गहबर भारी। खग मृग बिपुल सकल नर नारी ॥ बिधि कैकेई किरातिनि कीन्ही। जेंहि दव दुसह दसहुँ
    दिसि दीन्ही ॥ सहि न सके रघुबर बिरहागी। चले लोग सब ब्याकुल भागी ॥ सबहिं बिचार कीन्ह मन माहीं। राम लखन
    सिय बिनु सुखु नाहीम् ॥ जहाँ रामु तहँ सबुइ समाजू। बिनु रघुबीर अवध नहिं काजू ॥ चले साथ अस मन्त्रु दृढ़आई।
    सुर दुर्लभ सुख सदन बिहाई ॥ राम चरन पङ्कज प्रिय जिन्हही। बिषय भोग बस करहिं कि तिन्हही ॥ दो बालक बृद्ध
    बिहाइ गृँह लगे लोग सब साथ। तमसा तीर निवासु किय प्रथम दिवस रघुनाथ ॥ ॥ रघुपति प्रजा प्रेमबस देखी। सदय
    हृदयँ दुखु भयु बिसेषी ॥ करुनामय रघुनाथ गोसाँई। बेगि पाइअहिं पीर पराई ॥ कहि सप्रेम मृदु बचन सुहाए।
    बहुबिधि राम लोग समुझाए ॥ किए धरम उपदेस घनेरे। लोग प्रेम बस फिरहिं न फेरे ॥ सीलु सनेहु छाड़इ नहिं जाई।
    असमञ्जस बस भे रघुराई ॥ लोग सोग श्रम बस गे सोई। कछुक देवमायाँ मति मोई ॥ जबहिं जाम जुग जामिनि बीती।
    राम सचिव सन कहेउ सप्रीती ॥ खोज मारि रथु हाँकहु ताता। आन उपायँ बनिहि नहिं बाता ॥ दो राम लखन सुय जान
    चढ़इ सम्भु चरन सिरु नाइ ॥ सचिवँ चलायु तुरत रथु इत उत खोज दुराइ ॥ ॥ जागे सकल लोग भेँ भोरू। गे रघुनाथ
    भयु अति सोरू ॥ रथ कर खोज कतहहुँ नहिं पावहिं। राम राम कहि चहु दिसि धावहिम् ॥ मनहुँ बारिनिधि बूड़ जहाजू।
    भयु बिकल बड़ बनिक समाजू ॥ एकहि एक देंहिं उपदेसू। तजे राम हम जानि कलेसू ॥ निन्दहिं आपु सराहहिं मीना।
    धिग जीवनु रघुबीर बिहीना ॥ जौं पै प्रिय बियोगु बिधि कीन्हा। तौ कस मरनु न मागें दीन्हा ॥ एहि बिधि करत
    प्रलाप कलापा। आए अवध भरे परितापा ॥ बिषम बियोगु न जाइ बखाना। अवधि आस सब राखहिं प्राना ॥ दो राम दरस
    हित नेम ब्रत लगे करन नर नारि। मनहुँ कोक कोकी कमल दीन बिहीन तमारि ॥ ॥ सीता सचिव सहित दौ भाई। सृङ्गबेरपुर
    पहुँचे जाई ॥ उतरे राम देवसरि देखी। कीन्ह दण्डवत हरषु बिसेषी ॥ लखन सचिवँ सियँ किए प्रनामा। सबहि सहित
    सुखु पायु रामा ॥ गङ्ग सकल मुद मङ्गल मूला। सब सुख करनि हरनि सब सूला ॥ कहि कहि कोटिक कथा प्रसङ्गा। रामु
    बिलोकहिं गङ्ग तरङ्गा ॥ सचिवहि अनुजहि प्रियहि सुनाई। बिबुध नदी महिमा अधिकाई ॥ मज्जनु कीन्ह पन्थ श्रम
    गयू। सुचि जलु पिअत मुदित मन भयू ॥ सुमिरत जाहि मिटि श्रम भारू। तेहि श्रम यह लौकिक ब्यवहारू ॥ दो सुध्द
    सचिदानन्दमय कन्द भानुकुल केतु। चरित करत नर अनुहरत संसृति सागर सेतु ॥ ॥ यह सुधि गुहँ निषाद जब पाई।
    मुदित लिए प्रिय बन्धु बोलाई ॥ लिए फल मूल भेण्ट भरि भारा। मिलन चलेउ हिँयँ हरषु अपारा ॥ करि दण्डवत भेण्ट
    धरि आगें। प्रभुहि बिलोकत अति अनुरागेम् ॥ सहज सनेह बिबस रघुराई। पूँछी कुसल निकट बैठाई ॥ नाथ कुसल पद
    पङ्कज देखें। भयुँ भागभाजन जन लेखेम् ॥ देव धरनि धनु धामु तुम्हारा। मैं जनु नीचु सहित परिवारा ॥ कृपा
    करिअ पुर धारिअ प् । थापिय जनु सबु लोगु सिह् ॥ कहेहु सत्य सबु सखा सुजाना। मोहि दीन्ह पितु आयसु आना
    ॥ दो बरष चारिदस बासु बन मुनि ब्रत बेषु अहारु। ग्राम बासु नहिं उचित सुनि गुहहि भयु दुखु भारु ॥ ॥ राम
    लखन सिय रूप निहारी। कहहिं सप्रेम ग्राम नर नारी ॥ ते पितु मातु कहहु सखि कैसे। जिन्ह पठे बन बालक ऐसे
    ॥ एक कहहिं भल भूपति कीन्हा। लोयन लाहु हमहि बिधि दीन्हा ॥ तब निषादपति उर अनुमाना। तरु सिंसुपा मनोहर
    जाना ॥ लै रघुनाथहि ठाउँ देखावा। कहेउ राम सब भाँति सुहावा ॥ पुरजन करि जोहारु घर आए। रघुबर सन्ध्या करन
    सिधाए ॥ गुहँ सँवारि साँथरी डसाई। कुस किसलयमय मृदुल सुहाई ॥ सुचि फल मूल मधुर मृदु जानी। दोना भरि भरि
    राखेसि पानी ॥ दो सिय सुमन्त्र भ्राता सहित कन्द मूल फल खाइ। सयन कीन्ह रघुबंसमनि पाय पलोटत भाइ ॥ ॥ उठे
    लखनु प्रभु सोवत जानी। कहि सचिवहि सोवन मृदु बानी ॥ कछुक दूर सजि बान सरासन। जागन लगे बैठि बीरासन ॥ गुँह
    बोलाइ पाहरू प्रतीती। ठावँ ठाँव राखे अति प्रीती ॥ आपु लखन पहिं बैठेउ जाई। कटि भाथी सर चाप चढ़आई ॥ सोवत
    प्रभुहि निहारि निषादू। भयु प्रेम बस ह्दयँ बिषादू ॥ तनु पुलकित जलु लोचन बही। बचन सप्रेम लखन सन कही
    ॥ भूपति भवन सुभायँ सुहावा। सुरपति सदनु न पटतर पावा ॥ मनिमय रचित चारु चौबारे। जनु रतिपति निज हाथ सँवारे
    ॥ दो सुचि सुबिचित्र सुभोगमय सुमन सुगन्ध सुबास। पलँग मञ्जु मनिदीप जहँ सब बिधि सकल सुपास ॥ ॥ बिबिध बसन
    उपधान तुराई। छीर फेन मृदु बिसद सुहाई ॥ तहँ सिय रामु सयन निसि करहीं। निज छबि रति मनोज मदु हरहीम् ॥
    ते सिय रामु साथरीं सोए। श्रमित बसन बिनु जाहिं न जोए ॥ मातु पिता परिजन पुरबासी। सखा सुसील दास अरु दासी
    ॥ जोगवहिं जिन्हहि प्रान की नाई। महि सोवत तेइ राम गोसाईम् ॥ पिता जनक जग बिदित प्रभ् । ससुर सुरेस सखा
    रघुर् ॥ रामचन्दु पति सो बैदेही। सोवत महि बिधि बाम न केही ॥ सिय रघुबीर कि कानन जोगू। करम प्रधान सत्य
    कह लोगू ॥ दो कैकयनन्दिनि मन्दमति कठिन कुटिलपनु कीन्ह। जेहीं रघुनन्दन जानकिहि सुख अवसर दुखु दीन्ह ॥
    ॥ भि दिनकर कुल बिटप कुठारी। कुमति कीन्ह सब बिस्व दुखारी ॥ भयु बिषादु निषादहि भारी। राम सीय महि सयन
    निहारी ॥ बोले लखन मधुर मृदु बानी। ग्यान बिराग भगति रस सानी ॥ काहु न कौ सुख दुख कर दाता। निज कृत करम
    भोग सबु भ्राता ॥ जोग बियोग भोग भल मन्दा। हित अनहित मध्यम भ्रम फन्दा ॥ जनमु मरनु जहँ लगि जग जालू। सम्पती
    बिपति करमु अरु कालू ॥ धरनि धामु धनु पुर परिवारू। सरगु नरकु जहँ लगि ब्यवहारू ॥ देखिअ सुनिअ गुनिअ मन
    माहीं। मोह मूल परमारथु नाहीम् ॥ दो सपनें होइ भिखारि नृप रङ्कु नाकपति होइ। जागें लाभु न हानि कछु तिमि
    प्रपञ्च जियँ जोइ ॥ ॥ अस बिचारि नहिं कीजा रोसू। काहुहि बादि न देइअ दोसू ॥ मोह निसाँ सबु सोवनिहारा।
    देखिअ सपन अनेक प्रकारा ॥ एहिं जग जामिनि जागहिं जोगी। परमारथी प्रपञ्च बियोगी ॥ जानिअ तबहिं जीव जग जागा।
    जब जब बिषय बिलास बिरागा ॥ होइ बिबेकु मोह भ्रम भागा। तब रघुनाथ चरन अनुरागा ॥ सखा परम परमारथु एहू। मन
    क्रम बचन राम पद नेहू ॥ राम ब्रह्म परमारथ रूपा। अबिगत अलख अनादि अनूपा ॥ सकल बिकार रहित गतभेदा। कहि
    नित नेति निरूपहिं बेदा। दो भगत भूमि भूसुर सुरभि सुर हित लागि कृपाल। करत चरित धरि मनुज तनु सुनत मिटहि
    जग जाल ॥ पन्द्रहवा विश्राम सखा समुझि अस परिहरि मोहु। सिय रघुबीर चरन रत होहू ॥ कहत राम गुन भा भिनुसारा।
    जागे जग मङ्गल सुखदारा ॥ सकल सोच करि राम नहावा। सुचि सुजान बट छीर मगावा ॥ अनुज सहित सिर जटा बनाए। देखि
    सुमन्त्र नयन जल छाए ॥ हृदयँ दाहु अति बदन मलीना। कह कर जोरि बचन अति दीना ॥ नाथ कहेउ अस कोसलनाथा। लै
    रथु जाहु राम कें साथा ॥ बनु देखाइ सुरसरि अन्हवाई। आनेहु फेरि बेगि दौ भाई ॥ लखनु रामु सिय आनेहु फेरी।
    संसय सकल सँकोच निबेरी ॥ दो नृप अस कहेउ गोसाईँ जस कहि करौं बलि सोइ। करि बिनती पायन्ह परेउ दीन्ह बाल
    जिमि रोइ ॥ ॥ तात कृपा करि कीजिअ सोई। जातें अवध अनाथ न होई ॥ मन्त्रहि राम उठाइ प्रबोधा। तात धरम मतु
    तुम्ह सबु सोधा ॥ सिबि दधीचि हरिचन्द नरेसा। सहे धरम हित कोटि कलेसा ॥ रन्तिदेव बलि भूप सुजाना। धरमु
    धरेउ सहि सङ्कट नाना ॥ धरमु न दूसर सत्य समाना। आगम निगम पुरान बखाना ॥ मैं सोइ धरमु सुलभ करि पावा। तजें
    तिहूँ पुर अपजसु छावा ॥ सम्भावित कहुँ अपजस लाहू। मरन कोटि सम दारुन दाहू ॥ तुम्ह सन तात बहुत का कहूँ।
    दिएँ उतरु फिरि पातकु लहूँ ॥ दो पितु पद गहि कहि कोटि नति बिनय करब कर जोरि। चिन्ता कवनिहु बात कै तात
    करिअ जनि मोरि ॥ ॥ तुम्ह पुनि पितु सम अति हित मोरें। बिनती करुँ तात कर जोरेम् ॥ सब बिधि सोइ करतब्य
    तुम्हारें। दुख न पाव पितु सोच हमारेम् ॥ सुनि रघुनाथ सचिव सम्बादू। भयु सपरिजन बिकल निषादू ॥ पुनि कछु
    लखन कही कटु बानी। प्रभु बरजे बड़ अनुचित जानी ॥ सकुचि राम निज सपथ देवाई। लखन सँदेसु कहिअ जनि जाई ॥
    कह सुमन्त्रु पुनि भूप सँदेसू। सहि न सकिहि सिय बिपिन कलेसू ॥ जेहि बिधि अवध आव फिरि सीया। सोइ रघुबरहि
    तुम्हहि करनीया ॥ नतरु निपट अवलम्ब बिहीना। मैं न जिअब जिमि जल बिनु मीना ॥ दो मिकें ससरें सकल सुख जबहिं
    जहाँ मनु मान ॥ तँह तब रहिहि सुखेन सिय जब लगि बिपति बिहान ॥ ॥ बिनती भूप कीन्ह जेहि भाँती। आरति प्रीति
    न सो कहि जाती ॥ पितु सँदेसु सुनि कृपानिधाना। सियहि दीन्ह सिख कोटि बिधाना ॥ सासु ससुर गुर प्रिय परिवारू।
    फिरतु त सब कर मिटै खभारू ॥ सुनि पति बचन कहति बैदेही। सुनहु प्रानपति परम सनेही ॥ प्रभु करुनामय परम
    बिबेकी। तनु तजि रहति छाँह किमि छेङ्की ॥ प्रभा जाइ कहँ भानु बिहाई। कहँ चन्द्रिका चन्दु तजि जाई ॥ पतिहि
    प्रेममय बिनय सुनाई। कहति सचिव सन गिरा सुहाई ॥ तुम्ह पितु ससुर सरिस हितकारी। उतरु देउँ फिरि अनुचित
    भारी ॥ दो आरति बस सनमुख भिउँ बिलगु न मानब तात। आरजसुत पद कमल बिनु बादि जहाँ लगि नात ॥ ॥ पितु बैभव
    बिलास मैं डीठा। नृप मनि मुकुट मिलित पद पीठा ॥ सुखनिधान अस पितु गृह मोरें। पिय बिहीन मन भाव न भोरेम्
    ॥ ससुर चक्कवि कोसलर् । भुवन चारिदस प्रगट प्रभ् ॥ आगें होइ जेहि सुरपति लेई। अरध सिङ्घासन आसनु देई ॥
    ससुरु एतादृस अवध निवासू। प्रिय परिवारु मातु सम सासू ॥ बिनु रघुपति पद पदुम परागा। मोहि केउ सपनेहुँ
    सुखद न लागा ॥ अगम पन्थ बनभूमि पहारा। करि केहरि सर सरित अपारा ॥ कोल किरात कुरङ्ग बिहङ्गा। मोहि सब सुखद
    प्रानपति सङ्गा ॥ दो सासु ससुर सन मोरि हुँति बिनय करबि परि पायँ ॥ मोर सोचु जनि करिअ कछु मैं बन सुखी
    सुभायँ ॥ ॥ प्राननाथ प्रिय देवर साथा। बीर धुरीन धरें धनु भाथा ॥ नहिं मग श्रमु भ्रमु दुख मन मोरें। मोहि
    लगि सोचु करिअ जनि भोरेम् ॥ सुनि सुमन्त्रु सिय सीतलि बानी। भयु बिकल जनु फनि मनि हानी ॥ नयन सूझ नहिं
    सुनि न काना। कहि न सकि कछु अति अकुलाना ॥ राम प्रबोधु कीन्ह बहु भाँति। तदपि होति नहिं सीतलि छाती ॥
    जतन अनेक साथ हित कीन्हे। उचित उतर रघुनन्दन दीन्हे ॥ मेटि जाइ नहिं राम रजाई। कठिन करम गति कछु न बसाई
    ॥ राम लखन सिय पद सिरु नाई। फिरेउ बनिक जिमि मूर गवाँई ॥ दो रथ हाँकेउ हय राम तन हेरि हेरि हिहिनाहिं।
    देखि निषाद बिषादबस धुनहिं सीस पछिताहिम् ॥ ॥ जासु बियोग बिकल पसु ऐसे। प्रजा मातु पितु जीहहिं कैसेम्
    ॥ बरबस राम सुमन्त्रु पठाए। सुरसरि तीर आपु तब आए ॥ मागी नाव न केवटु आना। कहि तुम्हार मरमु मैं जाना
    ॥ चरन कमल रज कहुँ सबु कही। मानुष करनि मूरि कछु अही ॥ छुअत सिला भि नारि सुहाई। पाहन तें न काठ कठिनाई
    ॥ तरनिउ मुनि घरिनि होइ जाई। बाट परि मोरि नाव उड़आई ॥ एहिं प्रतिपालुँ सबु परिवारू। नहिं जानुँ कछु और
    कबारू ॥ जौ प्रभु पार अवसि गा चहहू। मोहि पद पदुम पखारन कहहू ॥ छं पद कमल धोइ चढ़आइ नाव न नाथ उतराई चहौं।
    मोहि राम राउरि आन दसरथ सपथ सब साची कहौम् ॥ बरु तीर मारहुँ लखनु पै जब लगि न पाय पखारिहौं। तब लगि न
    तुलसीदास नाथ कृपाल पारु उतारिहौम् ॥ सो सुनि केबट के बैन प्रेम लपेटे अटपटे। बिहसे करुनाऐन चिति जानकी
    लखन तन ॥ ॥ कृपासिन्धु बोले मुसुकाई। सोइ करु जेंहि तव नाव न जाई ॥ वेगि आनु जल पाय पखारू। होत बिलम्बु
    उतारहि पारू ॥ जासु नाम सुमरत एक बारा। उतरहिं नर भवसिन्धु अपारा ॥ सोइ कृपालु केवटहि निहोरा। जेहिं जगु
    किय तिहु पगहु ते थोरा ॥ पद नख निरखि देवसरि हरषी। सुनि प्रभु बचन मोहँ मति करषी ॥ केवट राम रजायसु पावा।
    पानि कठवता भरि लेइ आवा ॥ अति आनन्द उमगि अनुरागा। चरन सरोज पखारन लागा ॥ बरषि सुमन सुर सकल सिहाहीं।
    एहि सम पुन्यपुञ्ज कौ नाहीम् ॥ दो पद पखारि जलु पान करि आपु सहित परिवार। पितर पारु करि प्रभुहि पुनि
    मुदित गयु लेइ पार ॥ ॥ उतरि ठाड़ भे सुरसरि रेता। सीयराम गुह लखन समेता ॥ केवट उतरि दण्डवत कीन्हा। प्रभुहि
    सकुच एहि नहिं कछु दीन्हा ॥ पिय हिय की सिय जाननिहारी। मनि मुदरी मन मुदित उतारी ॥ कहेउ कृपाल लेहि उतराई।
    केवट चरन गहे अकुलाई ॥ नाथ आजु मैं काह न पावा। मिटे दोष दुख दारिद दावा ॥ बहुत काल मैं कीन्हि मजूरी।
    आजु दीन्ह बिधि बनि भलि भूरी ॥ अब कछु नाथ न चाहिअ मोरें। दीनदयाल अनुग्रह तोरेम् ॥ फिरती बार मोहि जे
    देबा। सो प्रसादु मैं सिर धरि लेबा ॥ दो बहुत कीन्ह प्रभु लखन सियँ नहिं कछु केवटु लेइ। बिदा कीन्ह करुनायतन
    भगति बिमल बरु देइ ॥ ॥ तब मज्जनु करि रघुकुलनाथा। पूजि पारथिव नायु माथा ॥ सियँ सुरसरिहि कहेउ कर जोरी।
    मातु मनोरथ पुरुबि मोरी ॥ पति देवर सङ्ग कुसल बहोरी। आइ करौं जेहिं पूजा तोरी ॥ सुनि सिय बिनय प्रेम रस
    सानी। भि तब बिमल बारि बर बानी ॥ सुनु रघुबीर प्रिया बैदेही। तव प्रभाउ जग बिदित न केही ॥ लोकप होहिं
    बिलोकत तोरें। तोहि सेवहिं सब सिधि कर जोरेम् ॥ तुम्ह जो हमहि बड़इ बिनय सुनाई। कृपा कीन्हि मोहि दीन्हि
    बड़आई ॥ तदपि देबि मैं देबि असीसा। सफल होपन हित निज बागीसा ॥ दो प्राननाथ देवर सहित कुसल कोसला आइ। पूजहि
    सब मनकामना सुजसु रहिहि जग छाइ ॥ ॥ गङ्ग बचन सुनि मङ्गल मूला। मुदित सीय सुरसरि अनुकुला ॥ तब प्रभु गुहहि
    कहेउ घर जाहू। सुनत सूख मुखु भा उर दाहू ॥ दीन बचन गुह कह कर जोरी। बिनय सुनहु रघुकुलमनि मोरी ॥ नाथ साथ
    रहि पन्थु देखाई। करि दिन चारि चरन सेवकाई ॥ जेहिं बन जाइ रहब रघुराई। परनकुटी मैं करबि सुहाई ॥ तब मोहि
    कहँ जसि देब रजाई। सोइ करिहुँ रघुबीर दोहाई ॥ सहज सनेह राम लखि तासु। सङ्ग लीन्ह गुह हृदय हुलासू ॥ पुनि
    गुहँ ग्याति बोलि सब लीन्हे। करि परितोषु बिदा तब कीन्हे ॥ दो तब गनपति सिव सुमिरि प्रभु नाइ सुरसरिहि
    माथ। सखा अनुज सिया सहित बन गवनु कीन्ह रधुनाथ ॥ ॥ तेहि दिन भयु बिटप तर बासू। लखन सखाँ सब कीन्ह सुपासू
    ॥ प्रात प्रातकृत करि रधुसाई। तीरथराजु दीख प्रभु जाई ॥ सचिव सत्य श्रध्दा प्रिय नारी। माधव सरिस मीतु
    हितकारी ॥ चारि पदारथ भरा भँडारु। पुन्य प्रदेस देस अति चारु ॥ छेत्र अगम गढ़उ गाढ़ सुहावा। सपनेहुँ नहिं
    प्रतिपच्छिन्ह पावा ॥ सेन सकल तीरथ बर बीरा। कलुष अनीक दलन रनधीरा ॥ सङ्गमु सिंहासनु सुठि सोहा। छत्रु
    अखयबटु मुनि मनु मोहा ॥ चवँर जमुन अरु गङ्ग तरङ्गा। देखि होहिं दुख दारिद भङ्गा ॥ दो सेवहिं सुकृति साधु
    सुचि पावहिं सब मनकाम। बन्दी बेद पुरान गन कहहिं बिमल गुन ग्राम ॥ ॥ को कहि सकि प्रयाग प्रभ् । कलुष पुञ्ज
    कुञ्जर मृगर् ॥ अस तीरथपति देखि सुहावा। सुख सागर रघुबर सुखु पावा ॥ कहि सिय लखनहि सखहि सुनाई। श्रीमुख
    तीरथराज बड़आई ॥ करि प्रनामु देखत बन बागा। कहत महातम अति अनुरागा ॥ एहि बिधि आइ बिलोकी बेनी। सुमिरत
    सकल सुमङ्गल देनी ॥ मुदित नहाइ कीन्हि सिव सेवा। पुजि जथाबिधि तीरथ देवा ॥ तब प्रभु भरद्वाज पहिं आए।
    करत दण्डवत मुनि उर लाए ॥ मुनि मन मोद न कछु कहि जाइ। ब्रह्मानन्द रासि जनु पाई ॥ दो दीन्हि असीस मुनीस
    उर अति अनन्दु अस जानि। लोचन गोचर सुकृत फल मनहुँ किए बिधि आनि ॥ ॥ कुसल प्रस्न करि आसन दीन्हे। पूजि
    प्रेम परिपूरन कीन्हे ॥ कन्द मूल फल अङ्कुर नीके। दिए आनि मुनि मनहुँ अमी के ॥ सीय लखन जन सहित सुहाए।
    अति रुचि राम मूल फल खाए ॥ भे बिगतश्रम रामु सुखारे। भरव्दाज मृदु बचन उचारे ॥ आजु सुफल तपु तीरथ त्यागू।
    आजु सुफल जप जोग बिरागू ॥ सफल सकल सुभ साधन साजू। राम तुम्हहि अवलोकत आजू ॥ लाभ अवधि सुख अवधि न दूजी।
    तुम्हारें दरस आस सब पूजी ॥ अब करि कृपा देहु बर एहू। निज पद सरसिज सहज सनेहू ॥ दो करम बचन मन छाड़इ छलु
    जब लगि जनु न तुम्हार। तब लगि सुखु सपनेहुँ नहीं किएँ कोटि उपचार ॥ सुनि मुनि बचन रामु सकुचाने। भाव भगति
    आनन्द अघाने ॥ तब रघुबर मुनि सुजसु सुहावा। कोटि भाँति कहि सबहि सुनावा ॥ सो बड सो सब गुन गन गेहू। जेहि
    मुनीस तुम्ह आदर देहू ॥ मुनि रघुबीर परसपर नवहीं। बचन अगोचर सुखु अनुभवहीम् ॥ यह सुधि पाइ प्रयाग निवासी।
    बटु तापस मुनि सिद्ध उदासी ॥ भरद्वाज आश्रम सब आए। देखन दसरथ सुअन सुहाए ॥ राम प्रनाम कीन्ह सब काहू।
    मुदित भे लहि लोयन लाहू ॥ देहिं असीस परम सुखु पाई। फिरे सराहत सुन्दरताई ॥ दो राम कीन्ह बिश्राम निसि
    प्रात प्रयाग नहाइ। चले सहित सिय लखन जन मुददित मुनिहि सिरु नाइ ॥ ॥ राम सप्रेम कहेउ मुनि पाहीं। नाथ
    कहिअ हम केहि मग जाहीम् ॥ मुनि मन बिहसि राम सन कहहीं। सुगम सकल मग तुम्ह कहुँ अहहीम् ॥ साथ लागि मुनि
    सिष्य बोलाए। सुनि मन मुदित पचासक आए ॥ सबन्हि राम पर प्रेम अपारा। सकल कहहि मगु दीख हमारा ॥ मुनि बटु
    चारि सङ्ग तब दीन्हे। जिन्ह बहु जनम सुकृत सब कीन्हे ॥ करि प्रनामु रिषि आयसु पाई। प्रमुदित हृदयँ चले
    रघुराई ॥ ग्राम निकट जब निकसहि जाई। देखहि दरसु नारि नर धाई ॥ होहि सनाथ जनम फलु पाई। फिरहि दुखित मनु
    सङ्ग पठाई ॥ दो बिदा किए बटु बिनय करि फिरे पाइ मन काम। उतरि नहाए जमुन जल जो सरीर सम स्याम ॥ ॥ सुनत
    तीरवासी नर नारी। धाए निज निज काज बिसारी ॥ लखन राम सिय सुन्दरताई। देखि करहिं निज भाग्य बड़आई ॥ अति
    लालसा बसहिं मन माहीं। नाउँ गाउँ बूझत सकुचाहीम् ॥ जे तिन्ह महुँ बयबिरिध सयाने। तिन्ह करि जुगुति रामु
    पहिचाने ॥ सकल कथा तिन्ह सबहि सुनाई। बनहि चले पितु आयसु पाई ॥ सुनि सबिषाद सकल पछिताहीं। रानी रायँ कीन्ह
    भल नाहीम् ॥ तेहि अवसर एक तापसु आवा। तेजपुञ्ज लघुबयस सुहावा ॥ कवि अलखित गति बेषु बिरागी। मन क्रम बचन
    राम अनुरागी ॥ दो सजल नयन तन पुलकि निज इष्टदेउ पहिचानि। परेउ दण्ड जिमि धरनितल दसा न जाइ बखानि ॥ ॥ राम
    सप्रेम पुलकि उर लावा। परम रङ्क जनु पारसु पावा ॥ मनहुँ प्रेमु परमारथु दोऊ। मिलत धरे तन कह सबु कोऊ ॥
    बहुरि लखन पायन्ह सोइ लागा। लीन्ह उठाइ उमगि अनुरागा ॥ पुनि सिय चरन धूरि धरि सीसा। जननि जानि सिसु दीन्हि
    असीसा ॥ कीन्ह निषाद दण्डवत तेही। मिलेउ मुदित लखि राम सनेही ॥ पिअत नयन पुट रूपु पियूषा। मुदित सुअसनु
    पाइ जिमि भूखा ॥ ते पितु मातु कहहु सखि कैसे। जिन्ह पठे बन बालक ऐसे ॥ राम लखन सिय रूपु निहारी। होहिं
    सनेह बिकल नर नारी ॥ दो तब रघुबीर अनेक बिधि सखहि सिखावनु दीन्ह। राम रजायसु सीस धरि भवन गवनु तेँइँ कीन्ह
    ॥ ॥ पुनि सियँ राम लखन कर जोरी। जमुनहि कीन्ह प्रनामु बहोरी ॥ चले ससीय मुदित दौ भाई। रबितनुजा कि करत
    बड़आई ॥ पथिक अनेक मिलहिं मग जाता। कहहिं सप्रेम देखि दौ भ्राता ॥ राज लखन सब अङ्ग तुम्हारें। देखि सोचु
    अति हृदय हमारेम् ॥ मारग चलहु पयादेहि पाएँ। ज्योतिषु झूठ हमारें भाएँ ॥ अगमु पन्थ गिरि कानन भारी। तेहि
    महँ साथ नारि सुकुमारी ॥ करि केहरि बन जाइ न जोई। हम सँग चलहि जो आयसु होई ॥ जाब जहाँ लगि तहँ पहुँचाई।
    फिरब बहोरि तुम्हहि सिरु नाई ॥ दो एहि बिधि पूँछहिं प्रेम बस पुलक गात जलु नैन। कृपासिन्धु फेरहि तिन्हहि
    कहि बिनीत मृदु बैन ॥ ॥ जे पुर गाँव बसहिं मग माहीं। तिन्हहि नाग सुर नगर सिहाहीम् ॥ केहि सुकृतीं केहि
    घरीं बसाए। धन्य पुन्यमय परम सुहाए ॥ जहँ जहँ राम चरन चलि जाहीं। तिन्ह समान अमरावति नाहीम् ॥ पुन्यपुञ्ज
    मग निकट निवासी। तिन्हहि सराहहिं सुरपुरबासी ॥ जे भरि नयन बिलोकहिं रामहि। सीता लखन सहित घनस्यामहि ॥
    जे सर सरित राम अवगाहहिं। तिन्हहि देव सर सरित सराहहिम् ॥ जेहि तरु तर प्रभु बैठहिं जाई। करहिं कलपतरु
