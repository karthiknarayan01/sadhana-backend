id: yamakritamkrishnanarayanastotram
category: stotram
name:
  english: yamakritamkrishnanarayanastotram
  devanagari: यमकृतंकृष्णनरायणस्तोत्रम्
content:
  english: yamakritam krishnanarayanastotram nihshvasantam ca dinam ca svadhikaranirarthakam | yamaraja'pi
    niladrau shriharim pranipatya ca || 70|| tushtava shrijagannatham svadhikaradridhasthitau | namaste
    caikatattvaya dvaitaya'nantakaya ca || 71|| svaprotasarvarupaya dhritipushtikaraya ca | sarvabhasadhidevaya
    namaste sarvayonaye || 72|| vishvasaya gurave sakshine te namo namah | karunyasindhave tubhyam paratitaya
    te namah || 73|| janmamrityuprahartre te namo'stu dinabandhave | mayadhishthatratmane te pitakausheyavasase
    || 74|| mayacakrakartanaya cakrine te namo namah | dandadatre'dhikartre te parameshaya vai namah ||
    75|| nilameghasuvapushe niladrivasitaya ca | namaste pundarikakshishobhitaya gadabhrite || 76|| shrivatsakaustubhashobhabhasatsamudhavakshase
    | nilavarnam nilashailaguhavasam kripalayam || 77|| ashritanam tu duhkhaghnam pranamami paratparam
    | yatpadayorashraye samllubdha shriranapayini || 78|| vartate shashvati lakshmirbhaktaishvaryapradayini
    | ya prakritih paradhina paresha tava vancchaya || 79|| tvamavrittya vikasam samprayati bandhamuktaye
    | bhuktabhogaya carpayati nirvanatam tvadicchaya || 80|| tvameva tu parabrahma brahmarupena vartase
    | bhumarupena ca vyuharupena vartase tatha || 81|| yamarupena ca rudrarupena vartase vibho | lakshminarayana
    vishno krishnanarayanaprabho || 82|| kambhareyamaharaja kripalo te namo muhuh | prabhanarayana parvatishanarayana
    prabho | hamsanarayana manjunarayana namo'stu te || 83|| sagunesha tava patnim duhkhahartrim namamyaham
    | putracintavarayitrim dharayitrim namamyaham || 84|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 581
  devanagari: यमकृतं कृष्णनरायणस्तोत्रम् निःश्वसन्तं च दीनं च स्वाधिकारनिरर्थकम् । यमराजाऽपि नीलाद्रौ
    श्रीहरिं प्रणिपत्य च ॥ ७०॥ तुष्टाव श्रीजगन्नाथं स्वाधिकारदृढस्थितौ । नमस्ते चैकतत्त्वाय द्वैतायाऽनन्तकाय
    च ॥ ७१॥ स्वप्रोतसर्वरूपाय धृतिपुष्टिकराय च । सर्वाभासाधिदेवाय नमस्ते सर्वयोनये ॥ ७२॥ विश्वासाय गुरवे
    साक्षिणे ते नमो नमः । कारुण्यसिन्धवे तुभ्यं परातीताय ते नमः ॥ ७३॥ जन्ममृत्युप्रहर्त्रे ते नमोऽस्तु
    दीनबन्धवे । मायाधिष्ठात्रात्मने ते पीतकौशेयवाससे ॥ ७४॥ मायाचक्रकर्तनाय चक्रिणे ते नमो नमः । दण्डदात्रेऽधिकर्त्रे
    ते परमेशाय वै नमः ॥ ७५॥ नीलमेघसुवपुषे नीलाद्रिवासिताय च । नमस्ते पुण्डरीकाक्षिशोभिताय गदाभृते ॥ ७६॥
    श्रीवत्सकौस्तुभशोभाभासत्समूढवक्षसे । नीलवर्णं नीलशैलगुहावासं कृपालयम् ॥ ७७॥ आश्रितानां तु दुःखघ्नं
    प्रणमामि परात्परम् । यत्पादयोराश्रये संल्लुब्धा श्रीरनपायिनी ॥ ७८॥ वर्तते शाश्वती लक्ष्मीर्भक्तैश्वर्यप्रदायिनी
    । या प्रकृतिः पराधीना परेश तव वाञ्च्छया ॥ ७९॥ त्वामावृत्त्य विकासं सम्प्रयाति बन्धमुक्तये । भुक्तभोगाय
    चार्पयति निर्वाणतां त्वदिच्छया ॥ ८०॥ त्वमेव तु परब्रह्म ब्रह्मरूपेण वर्तसे । भूमरूपेण च व्यूहरूपेण
    वर्तसे तथा ॥ ८१॥ यमरूपेण च रुद्ररूपेण वर्तसे विभो । लक्ष्मीनारायण विष्णो कृष्णनारायणप्रभो ॥ ८२॥ काम्भरेयमहाराज
    कृपालो ते नमो मुहुः । प्रभानारायण पार्वतीशनारायण प्रभो । हंसनारायण मञ्जूनारायण नमोऽस्तु ते ॥ ८३॥ सगुणेश
    तव पत्नीं दुःखहर्त्रीं नमाम्यहम् । पुत्रचिन्तावारयित्रीं धारयित्रीं नमाम्यहम् ॥ ८४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ५८१
