id: gayatri-hridayam
category: hridaya
name:
  english: gayatri hridayam
  devanagari: गायत्री हृदयम्
content:
  english: sandhyakalastathacchadanam samvatsaro nimishamahoratra adityashcandramah || 20|| sahasraparamam
    devim shatamadhyam dashavaram | sahasranetram gayatrim sharanamaham prapadye || 21|| om tatsaviturvarenyaya
    namah | om tat purva jayaya namah | om tat prataraditya pratishthaya namah || 22|| sayamadhiyano divasakritam
    papam nashayati | prataradhiyano ratrikritam papam nashayati | tat sayam prataradhiyano'papo bhavati
    || 23|| ya idam gayatrihridayam brahmanah pathet apeyapanat puto bhavati | abhakshyabhakshanat puto
    bhavati | ajnanat puto bhavati | svarnasteyat puto bhavati | guru talpagamanat puto bhavati | apankti
    pavanat puto bhavati | brahmahatyayah puto bhavati | abrahmacari brahmacari bhavati | ityanena hridayenadhitena
    kratu sahasreneshto bhavati | shashti shatasahasrani japyani phalani bhavanti ashtau brahmanan samyag
    grahayedarthasiddhirbhavati || 24|| ya idam nityamadhiyano brahmanah prayatah shucih sarvapapaih pramucyate
    iti | brahmaloke mahiyate ityaha bhagavan yajnavalkyah || 25|| || iti gayatri hridayam sampurnam||
  devanagari: सन्ध्याकालस्तथाच्छादनं संवत्सरो निमिषमहोरात्र आदित्यश्चन्द्रमाः ॥ २०॥ सहस्रपरमां देवीं शतमध्यां
    दशावराम् । सहस्रनेत्रां गायत्रीं शरणमहं प्रपद्ये ॥ २१॥ ॐ तत्सवितुर्वरेण्याय नमः । ॐ तत् पूर्व जयाय
    नमः । ॐ तत् प्रातरादित्य प्रतिष्ठाय नमः ॥ २२॥ सायमधीयानो दिवसकृतं पापं नाशयति । प्रातरधीयानो रात्रिकृतं
    पापं नाशयति । तत् सायं प्रातरधीयानोऽपापो भवति ॥ २३॥ य इदं गायत्रीहृदयं ब्राह्मणः पठेत् अपेयपानात्
    पूतो भवति । अभक्ष्यभक्षणात् पूतो भवति । अज्ञानात् पूतो भवति । स्वर्णस्तेयात् पूतो भवति । गुरु तल्पगमनात्
    पूतो भवति । अपङ्क्ति पावनात् पूतो भवति । ब्रह्महत्यायाः पूतो भवति । अब्रह्मचारी ब्रह्मचारी भवति ।
    इत्यनेन हृदयेनाधीतेन क्रतु सहस्रेणेष्टो भवति । षष्टि शतसहस्राणि जप्यानि फलानि भवन्ति अष्टौ ब्राह्मणान्
    सम्यग् ग्राहयेदर्थसिद्धिर्भवति ॥ २४॥ य इदं नित्यमधीयानो ब्राह्मणः प्रयतः शुचिः सर्वपापैः प्रमुच्यते
    इति । ब्रह्मलोके महीयते इत्याह भगवान् याज्ञवल्क्यः ॥ २५॥ ॥ इति गायत्री हृदयं सम्पूर्णम्॥
