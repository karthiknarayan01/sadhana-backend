id: bhavopanishat
category: upanishad
name:
  english: bhavopanishat
  devanagari: भावोपनिषत्
content:
  english: upanishad bhavopanishat || atha bhavopanishata|| om bhadram karnebhih shrinuyama deva bhadram
    pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema devahitam yadayuh || svasti
    na indro vriddhashravah svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu
    || om shantih shantih shantih || atmanamakhandamandalakaramavritya sakalabrahmandamandalam svaprakasham
    dhyayet | shriguruh sarvakaranabhuta shakttih || 1|| tena navarandhrarupo dehah || 2|| navacakrarupam
    shricakram || 3|| varahi pitrirupa kurukulla balidevata mata || 4|| purusha|rthah sagarah || 5|| deho
    navaratnadvipah || 6|| tvagadi sapttadhaturomasamyukttah || 7|| samkalpah kalpataravastejah kalpakodyanam
    || 8|| rasanaya bhavyamana madhuramlatikttakatukashayalavanarasah shadritavah || 9|| jnanamardhyam
    jneyam havirjnata hota jnatrijnanajneyanamabhedabhavanam shricakrapujanam || 10|| niyatih shrringaradayo
    rasa animadayah || 11|| kamakrodhalobhamohamadamatsa|ryapunyapapamaya brahmyadyayashatashakttayah
    || 12|| adharanavakam mudrashakttayah || 13|| prithivyaptejovaivakashashrotratvakcakshurjihvaghrana
    vakpanipadapayupasthani manovikarah kamakarshinyadi shodasha shakttayah || 14|| vacanadanagamanavisarganandahanopadanopekshakhya
    bhuddhayo'nangakusumadyashtau || 15|| alambusa kuhurvishvodara varana hastijihva yashovati payasvini
    gandhari pusha shankhini sarasvatida pingala sushumna ceti caturdasha nadyah sarvasamkshhobhinyadi
    caturdashashakttayah || 16|| pranapanavyanodanasamananagaku|rmakrikaradevadattadhanamjaya dashavayavah
    sarvasiddhipradadibahirdasharadevatah || 17|| etadvayusamsargakopadhibhedhena recakah pacakah shoshako
    dahakah plavaka iti pranamukhyavena pamcadha jatharagnirbhavati|| 18|| ksharaka uddharakah kshobhako
    jrimbhako mohaka iti nagapradhanyena pamcabidhaste manushyanam dehaga bhakshhyabhojyashoshyalehyapeyatmakapancavidhamannam
    pacayanti|| 19|| eta dashavahnikalah sarvajnadya antardasharadevatah || 20|| shitoshnasukhaduhkhecchah
    sattvam rajastamo vashinyadishaktthayoashtau || 21|| shabdadi tanmattrah pamcapushpabanah || 22||
    mana ikshhudhanuh || 23|| ragah pashah || 24|| dvesho'nkushah || 25|| avyaktta mahadahamkarah kamekshvari
    vajreshvari bhagamalinyo'ntasttrikonaga devatah || 26|| nirupadhikasamvideva kameshvara || 27|| sadanandapurna
    svatmeva paradevata lalita || 28|| lauhityametasya sarvasya vimarsha || 29|| ananyacittatvena ca siddhih
    || 30|| bhavanayah kriya upacarah || 31|| aham tvamasti nasti kartavyamakartavyamupasitavyamiti vikalpanamatmani
    vilapanam homah || 32|| bhavanavishayanamabhedabhavana tarpanam || 33|| pamcadashatithirupena kalasya
    parinamavalokanam || 34|| evamam muhurtattritayam muhurtadvitayam muhurtamattram va bhavanaparo jivanmuktto
    bhavati sa eva shivayogiti gadyate|| 35|| adimatenantashcakrabhavanah pratipaditah || 36|| ya evam
    veda so'tharvashiro'dhite || 37|| ityupanishat || om bhadram karnebhih shrinuyama devah | bhadram
    pashyemakshabhiryajatrah| sthirairangaistushtuva
  devanagari: उपनिषद् भावोपनिषत् ॥ अथ भावोपनिषत॥ ॐ भद्रं कर्णेभिः शृणुयाम देवा भद्रम् पष्येमाक्षभिर्यजत्राः
    । स्थिरैरङ्गैस्तुष्तुवाँसस्तनूभिर्व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः
    पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ आत्मानमखण्दमण्दलाकारमवृत्य सकलब्रह्मान्दमन्दलं स्वप्रकाशं ध्यायेत् । श्रीगुरुः सर्वकारणभूता
    शक्त्तिः ॥ १॥ तेन नवरन्ध्ररूपो देहः ॥ २॥ नवचक्ररूपं श्रीचक्रम् ॥ ३॥ वाराही पितृरूपा कुरुकुल्ला बलिदेवता
    माता ॥ ४॥ पुरुषा।र्थाः सागराः ॥ ५॥ देहो नवरत्नद्वीपः ॥ ६॥ त्वगादि सप्त्तधातुरोमसंयुक्त्तः ॥ ७॥ संकल्पाः
    कल्पतरवस्तेजः कल्पकोद्यानम् ॥ ८॥ रसनया भाव्यमाना मधुराम्लतिक्त्तकटुकषायलवणरसाः षडृतवः ॥ ९॥ ज्ञानमर्ध्यम्
    ज्ञेयम् हविर्ज्ञाता होता ज्ञातृज्ञानज्ञेयानामभेदभवनम् श्रीचक्रपूजनम् ॥ १०॥ नियतिः श्रृङ्गारादयो रसा
    अणिमादयः ॥ ११॥ कामक्रोधलोभमोहमदमात्स।र्यपुण्यपापमया ब्राह्म्याद्ययषटशक्त्तयः ॥ १२॥ आधरनवकम् मुद्राशक्त्तयः
    ॥ १३॥ पृथिव्यप्तेजोवाइवाकाशाश्रोत्रत्वक्चक्षुर्जिह्वघ्राण वाक्पाणिपादपायूपस्थानि मनोविकाराः कामाकर्षिण्यादि
    षोदश शक्त्तयः ॥ १४॥ वचनादानागमनविसर्गानन्दहानोपादानोपेक्षाख्य भुद्धयोऽनङ्गकुसुमाद्यष्टौ ॥ १५॥ अलम्बुसा
    कुहुर्विश्वोदरा वारणा हस्तिजिह्वा यशोवती पयस्विनी गान्धारी पूषा शङ्खिनी सरस्वतीडा पिङ्गला सुषुम्ना
    चेति चतुर्दश नाड्यः सर्वसंक्ष्होभिण्यदि चतुर्दशशक्त्तयः ॥ १६॥ प्राणापानव्यानोदानसमाननागकू।र्मकृकरदेवदत्तधनंजया
    दशवायवः सर्वसिद्धिप्रदादिबहिर्दशारदेवताः ॥ १७॥ एतद्वायुसंसर्गकोपाधिभेधेन रेचकः पाचकः शोषको दाहकः प्लावक
    इति प्राणमुख्यवेन पंचधा जठराग्निर्भवति॥ १८॥ क्षारक उद्धारकः क्षोभको जृंभको मोहक इति नागप्राधान्येन
    पंचबिधास्ते मनुष्याणां देहगा भक्ष्ह्यभोज्यशोष्यलेह्यपेयात्मकपञ्चविधमन्नं पाचयन्ति॥ १९॥ एता दशवह्निकलाः
    सर्वज्ञाद्या अन्तर्दशारदेवताः ॥ २०॥ शीतोष्णासुखदुःखेच्छाः सत्त्वं रजस्तमो वशिन्यादिशक्त्थयोअष्तौ ॥
    २१॥ शब्दादि तन्मात्त्राः पंचपुष्पबाणाः ॥ २२॥ मन इक्ष्हुधनुः ॥ २३॥ रागः पाशः ॥ २४॥ द्वेषोऽङ्कुशः ॥
    २५॥ अव्यक्त्त महदहंकाराः कामेक्ष्वरी वज्रेश्वरी भगमालिन्योऽन्तस्त्त्रिकोणगा देवताः ॥ २६॥ निरुपाधिकसंविदेव
    कामेश्वर ॥ २७॥ सदानन्दपूर्ण स्वात्मेव परदेवता ललिता ॥ २८॥ लौहित्यमेतस्य सर्वस्य विमर्श ॥ २९॥ अनन्यचित्तत्वेन
    च सिद्धिः ॥ ३०॥ भावनायाः क्रिया उपचरः ॥ ३१॥ अहं त्वमस्ति नास्ति कर्तव्यमकर्तव्यमुपासितव्यमिति विकल्पानामात्मनि
    विलापनम् होमः ॥ ३२॥ भवनाविषयाणामभेदभवना तर्पणम् ॥ ३३॥ पंचदशतिथिरूपेण कालस्य परिणामावलोकनम् ॥ ३४॥ एवमं
    मुहूर्तत्त्रितयं मुहूर्तद्वितयं मुहूर्तमात्त्रं वा भावनापरो जीवन्मुक्त्तो भवति स एव शिवयोगीति गद्यते॥
    ३५॥ आदिमतेनान्तश्चक्रभावनाः प्रतिपादिताः ॥ ३६॥ य एवं वेद सोऽथर्वशिरोऽधीते ॥ ३७॥ इत्युपनिषत् ॥ ॐ भद्रं
    कर्णेभिः शृणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः। स्थिरैरङ्गैस्तुष्टुवा
