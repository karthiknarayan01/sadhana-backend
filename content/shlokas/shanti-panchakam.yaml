id: shanti-panchakam
category: stotram
name:
  english: Shanti Panchakam
content:
  english: nno bhavatvaryama | sha nna indro brihaspatih | sha nno vishnururukramah | namo brahmane |
    namaste vayo | tvameva pratyaksha mbrahmasi | tvameva pratyaksha mbrahma vadishyami | ritam va~dishyami
    | satyam va~dishyami | tanmamavatu | tadvaktaramavatu | avatu mam | avatu vaktaram nno bhavatvaryama
    | sha nna indro brihaspatih | sha nno vishnururukramah | namo brahmane | namaste vayo | tvameva pratyaksha
    mbrahmasi | tvameva pratyaksha mbrahmavadisham | ritamavadisham | satyamavadisham | tanmamavit | tadvaktaramavit
    | avinmam | avi || om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu
    ma vidvishavahai || namo vace ya codita ya canudita tasyai vace namo namo vace namo vacaspataye nama
    rishibhyo mantrakridbhyo mantrapatibhyo ma mamrishayo mantrakrito mantrapatayah paradurma nmantrakrito
    mantrapati va~camudyasagm shiva madastanjushtam shsharma prithivi sharma vishvamida njagat | sharma
    candrashca suryashca sharma brahma prajapati | bhutam va~dishye tejo vadishye yasho vadishye tapo
    vadishye brahma vadishye satyam va~dishye tasma ahamida mme prajayai pashuna mbhuyadupastaranamaha
    mprajayai pashunam bhuyasa mpranapanau mrityormapata mpranapanau ma ma hasishta mmadhu manishye madhu
    janishye madhu vakshyami madhu vadishyami madhumati ndevebhyo vacamudyasagm shushrushenya mma deva
    avantu shobhayai pitaro 'numadantu || om shanti mmatarishva shanna stapatu suryah | ahani sha mbhavantu
    na shshagm ratrih pratidhiyatam || shamusha no vyucchatu shamaditya udetu nah | shiva na shshantamabhava
    sumridika sarasvati | mate vyoma sandrishi || idayai vastvasi vastumadva stumanto bhuyasma ma vasto
    shchiths mahyavastu ssa bhuyad yo ndvishmah || pratishtha 'si pratishthavanto bhuyasma ma pratishthaya
    chiths mahya pratishthassa bhuyad yo vahi yadrapah | tvagmhi vishvabheshajo devana nduta iyase ||
    dvavimau vatau vata asindhora paravatah | daksha mme anya avatu para 'nyo vatu yadrapah || yadado
    vata te grihe hitah | tato no dehi jivase tato no dhehi bheshajam | tato no maha avaha vata avatu
    bheshajam || shambhur no hride prana ayugmshi tarishat | indrasya griho ntva prapadye sagussashvah
    | saha yanme asti tena || bhuh prapadye bhuvah prapadye suvah prapadye bhurbhuvassuvah prapadye vayum
    prapadye mprapadye prajapater brahmakosha mbrahma prapadya o mprapadye || antariksha mbrihadagnayah
    parvatashca yaya vatah svastya svastimantaya svastya svasti manasani || pranapanau mrityor ma pata
    mpranapanau ma ma hasishta mmayyagni stejo dadhatu mayi medha mmayindra indriya ndadhatu mayi medha
    mmayi suryo bhrajo dadhatu || dyubhiraktubhih paripata narishtebhirashvina saubhagebhih | tanno mitro
    varuno mamahanta sindhuh prithivi utadyauh || kayanashcitra abhuva duti sadavridha ssakha | kayashacishthaya
    vrita || kastva satyo madana mmagmhishtho mathsadandhasah | dridha vasu || abhishuna ssakhina mbhavasyutibhih
    || vayassuparna upasedurindra mpriyamedha rishayo nadhamanah | apaddhvantamu rnuhi purdhicakshur mumugdhyasma
    nnidhayeva baddhan || shanno devirabhishtaya apo bhavantu pitaye rabhisravantunah || ishana varyana
    shaninam | apo yacami bheshajam || sumitrana apa oshadhaya ssantu durmitrastasmai bhuya apohishtha
    mayobhuva stana urje dadhatana | mahe ranaya cakshase | yo vah shivatamo rasastasya bhajayateha nah
    | ushatiriva matarah | tasma ara ngamamavo yasya kshayaya jinvatha | apo janayatha canah || prithivi
    shanta sa 'gnina shanta sa me shanta shucagm shamayatu | antarikshagm shanta ntad vayuna shanta ntanme
    shantagm shucagm shamayatu | dyau ''dityena shanta sa me shanta shucagm shamayatu || prithivi shantirantarikshagm
    shantir dyau shshantir disha shcandrama shshantir nakshatrani shanti vanaspataya shshantir rashva
    shshantih purusha shshantir brahma shantir brahmana shshanti reva shanti shshantir me astu shantih
    || taya 'hagm shantya sarva shantya mahya ndvipade catushpade ca shanti nkaromi shantir me astu shantih
    || eha shrishca hrishca dhritishca tapo medha pratishtha shraddha satya ndharmashcaitani mottishthanta
    manuttishthantu mamag shrishca hrishca dhritishca tapo medha pratishtha shraddha satya ndharmashcaitani
    ma ma hasishuh || udayusha svayusho doshadhinagm raseno tparjanyasya shushmenodastha mamritagm anu
    || taccakshur devahita cchukramuccarat || nnandama sharadashshata mbhavama sharadashshatagm shrinavama
    sharadashshata mprabravama sharadashshata majitasyama sharadashshata ssarirasya maddhyathsa ma vrishabho
    lohitaksha ssuryo vipashci brahmanashcotanyasi brahmana anistho brahmana avapanamasi dhariteyam prithivi
    brahmana mahi dharita menena mahadantariksha ndadhara prithivigm sadevam ndharayani mamadvedo 'dhi
    visrasat | medhamanishe mavishatagm samici bhutasya bhavyasyavaruddhyai sarvamayurayani sarvamayurayani
    || abhir girbhir yadatona unamapyayaya harivo vardhamanah | yada stotribhyo mahi gotra rujasi bhuyishthabhajo
    adhate shyama | brahma pravadishma tanno mahasit || om shanti
  devanagari: न्नो॑ भवत्वर्य॒मा । श न्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । श न्नो॒ विष्णु॑रुरुक्र॒मः । नमो॒ ब्रह्म॑णे
    । नम॑स्ते वायो । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्म॑ वदिष्यामि । ऋ॒तं
    वँ॑दिष्यामि । स॒त्यं वँ॑दिष्यामि । तन्माम॑वतु । तद्व॒क्तार॑मवतु । अव॑तु॒ माम् । अव॑तु व॒क्तारम् न्नो॑
    भवत्वर्य॒मा । श न्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । श न्नो॒ विष्णु॑रुरुक्र॒मः । नमो॒ ब्रह्म॑णे । नम॑स्ते वायो
    । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वामे॒व प्र॒त्यक्ष॒ म्ब्रह्मावा॑दिषम् । ऋ॒तम॑वादिषम् । स॒त्यम॑वादिषम्
    । तन्मामा॑वीत् । तद्व॒क्तार॑मावीत् । आवी॒न्माम् । आवी ॥ ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑
    ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै ॥ नमो॑ वा॒चे या चो॑दि॒ता या चानु॑दिता॒ तस्यै॑
    वा॒चे नमो॒ नमो॑ वा॒चे नमो॑ वा॒चस्पत॑ये॒ नम॒ ऋषि॑भ्यो मन्त्र॒कृद्भ्यो॒ मन्त्र॑पतिभ्यो॒ मा मामृष॑यो
    मन्त्र॒कृतो॑ मन्त्र॒पत॑यः॒ परा॑दु॒र्मा न्मन्त्र॒कृतो॑ मन्त्र॒पती॒ वाँच॑मुद्यासग्ं शि॒वा मद॑स्ता॒ञ्जुष्टां
    श्शर्म॑ पृथि॒वी शर्म॒ विश्व॑मि॒द ञ्जग॑त् । शर्म॑ च॒न्द्रश्च॒ सूर्य॑श्च॒ शर्म॑ ब्रह्म प्रजाप॒ती । भू॒तं
    वँदिष्ये॒ तेजो॑ वदिष्ये॒ यशो॑ वदिष्ये॒ तपो॑ वदिष्ये॒ ब्रह्म॑ वदिष्ये स॒त्यं वँ॑दिष्ये॒ तस्मा॑ अ॒हमि॒द
    म्मे प्र॒जायै॑ पशू॒ना म्भू॑यादुप॒स्तर॑णम॒ह म्प्र॒जायै॑ पशू॒नां भू॑यास॒ म्प्राणा॑पानौ मृ॒त्योर्मा॑पात॒
    म्प्राणा॑पानौ॒ मा मा॑ हासिष्ट॒ म्मधु॑ मनिष्ये॒ मधु॑ जनिष्ये॒ मधु॑ वक्ष्यामि॒ मधु॑ वदिष्यामि॒ मधु॑मती
    न्दे॒वेभ्यो॒ वाच॑मुद्यासग्ं शुश्रू॒षेण्या म्मा॑ दे॒वा अ॑वन्तु शो॒भायै॑ पि॒तरो ऽनु॑मदन्तु ॥ ॐ शान्ति॒
    म्मात॒रिश्वा॒ शन्न॑ स्तपतु॒ सूर्यः॑ । अहा॑नि॒ श म्भ॑वन्तु न॒ श्शग्ं रात्रिः॒ प्रति॑धीयताम् ॥ शमु॒षा
    नो॒ व्यु॑च्छतु॒ शमा॑दि॒त्य उदे॑तु नः । शि॒वा न॒ श्शन्त॑माभव सुमृडी॒का सर॑स्वति । माते॒ व्यो॑म स॒न्दृशि॑
    ॥ इडा॑यै॒ वास्त्व॑सि वास्तु॒मद्वा स्तु॒मन्तो॑ भूयास्म॒ मा वास्तो श्छिथ्स् मह्यवा॒स्तु स्स भू॑या॒द्
    यो न्द्वि॒ष्मः ॥ प्र॒ति॒ष्ठा ऽसि॑ प्रति॒ष्ठाव॑न्तो भूयास्म॒ मा प्र॑ति॒ष्ठाया छिथ्स् मह्य प्रति॒ष्ठस्स
    भू॑या॒द् यो वाहि॒ यद्रपः॑ । त्वग्ंहि वि॒श्वभे॑षजो दे॒वाना न्दू॒त ईय॑से ॥ द्वावि॒मौ वातौ॑ वात॒ आसिन्धो॒रा
    प॑रा॒वतः॑ । दक्ष॑ म्मे अ॒न्य आ॒वातु॒ परा॒ ऽन्यो वा॑तु॒ यद्रपः॑ ॥ यद॒दो वा॑त ते गृ॒हे॑ हि॒तः । ततो॑
    नो देहि जी॒वसे॒ ततो॑ नो धेहि भेष॒जम् । ततो॑ नो॒ मह॒ आव॑ह॒ वात॒ आवा॑तु भेष॒जम् ॥ श॒म्भूर् नो॑ हृ॒दे
    प्रण॒ आयुग्ं॑षि तारिषत् । इन्द्र॑स्य गृ॒हो॑ न्त्वा॒ प्र॑पद्ये॒ सगु॒स्साश्वः॑ । स॒ह यन्मे॒ अस्ति॒ तेन॑
    ॥ भूः प्रप॑द्ये॒ भुवः॒ प्रप॑द्ये॒ सुवः॒ प्रप॑द्ये॒ भूर्भुव॒स्सुवः॒ प्रप॑द्ये वा॒युं प्रप॒द्ये म्प्रप॑द्ये
    प्र॒जाप॑तेर् ब्रह्मको॒श म्ब्रह्म॒ प्रप॑द्य॒ ओ म्प्रप॑द्ये ॥ अ॒न्तरि॑क्ष म्बृ॒हद॒ग्नयः॒ पर्व॑ताश्च॒
    यया॒ वातः॑ स्व॒स्त्या स्व॑स्ति॒मान्तया स्व॒स्त्या स्व॑स्ति॒ मान॑सानि ॥ प्राणा॑पानौ मृ॒त्योर् मा॑ पात॒
    म्प्राणा॑पानौ॒ मा मा॑ हासिष्ट॒ म्मय्य॒ग्नि स्तेजो॑ दधातु॒ मयि॑ मे॒धा म्मयीन्द्र॑ इन्द्रि॒य न्द॑धातु॒
    मयि॑ मे॒धा म्मयि॒ सूर्यो॒ भ्राजो॑ दधातु ॥ द्यु॒भिर॒क्तुभिः॒ परि॑पात नरि॑ष्टेभिरश्विना॒ सौभ॑गेभिः ।
    तन्नो॑ मि॒त्रो वरु॑णो मामहन्ता॒ सिन्धुः॑ पृथि॒वी उ॒तद्यौः ॥ कया॑नश्चि॒त्र आभु॑व दू॒ती स॒दावृ॑ध॒ स्सखा
    । कया॒शचि॑ष्ठया वृ॒ता ॥ कस्त्वा॑ स॒त्यो मदा॑ना॒ म्मग्ंहि॑ष्ठो मथ्स॒दन्ध॑सः । दृ॒ढा वसु॑ ॥ अ॒भीषुण॒
    स्सखी॑ना म्भ॑वास्यू॒तिभिः॑ ॥ वय॑स्सुप॒र्णा उप॑सेदु॒रिन्द्र॑ म्प्रि॒यमे॑धा॒ ऋष॑यो॒ नाध॑मानाः । अप॑द्ध्वा॒न्तमू
    र्णु॒हि पू॒र्धिचक्षु॑र् मुमु॒ग्ध्य॑स्मा न्नि॒धये॑व ब॒द्धान् ॥ शन्नो॑ दे॒वीर॒भिष्ट॑य॒ आपो॑ भवन्तु पी॒तये
    र॒भिस्र॑वन्तुनः ॥ ईशा॑ना॒ वार्या॑णा॒ षणी॒नाम् । अ॒पो या॑चामि भेष॒जम् ॥ सु॒मि॒त्रान॒ आप॒ ओष॑धय स्सन्तु
    दुर्मि॒त्रास्तस्मै॑ भूया आपो॒हिष्ठा म॑यो॒भुव॒ स्तान॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से । यो वः॑
    शि॒वत॑मो॒ रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒तरः॑ । तस्मा॒ अर॑ ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ
    । आपो॑ ज॒नय॑था चनः ॥ पृ॒थि॒वी शा॒न्ता सा ऽग्निना॑ शा॒न्ता सा मे॑ शा॒न्ता शुचग्ं॑ शमयतु । अ॒न्तरि॑क्षग्ं
    शा॒न्त न्तद् वा॒युना॑ शा॒न्त न्तन्मे॑ शा॒न्तग्ं शुचग्ं॑ शमयतु । द्यौ ऽऽदि॒त्येन॑ शा॒न्ता सा मे॑ शा॒न्ता
    शुचग्ं॑ शमयतु ॥ पृ॒थि॒वी शान्ति॑र॒न्तरि॑क्ष॒ग्ं॒ शान्ति॒र् द्यौ श्शान्ति॒र् दिश॒ श्च॒न्द्रमा॒ श्शान्ति॒र्
    नक्ष॑त्राणि॒ शान्ति॒ वन॒स्पत॑य॒ श्शान्ति॒र् रश्व॒ श्शान्तिः॒ पुरु॑ष॒ श्शान्ति॒र् ब्रह्म॒ शान्ति॑र्
    ब्राह्म॒ण श्शान्ति॒ रे॒व शान्ति॒ श्शान्ति॑र् मे अस्तु शान्तिः॑ ॥ तया॒ ऽहग्ं शा॒न्त्या स॑र्व शा॒न्त्या
    मह्य॑ न्द्वि॒पदे॒ चतु॑ष्पदे च॒ शान्ति॑ ङ्करोमि॒ शान्ति॑र् मे अस्तु॒ शान्तिः॑ ॥ एह॒ श्रीश्च॒ ह्रीश्च॒
    धृति॑श्च॒ तपो॑ मे॒धा प्र॑ति॒ष्ठा श्र॒द्धा स॒त्य न्धर्म॑श्चै॒तानि॒ मोत्ति॑ष्ठन्त॒ मनूत्ति॑ष्ठन्तु॒
    मामा॒ग्॒ श्रीश्च॒ ह्रीश्च॒ धृति॑श्च॒ तपो॑ मे॒धा प्र॑ति॒ष्ठा श्र॒द्धा स॒त्य न्धर्म॑श्चै॒तानि॑ मा॒ मा
    हा॑सिषुः ॥ उदायु॑षा स्वा॒युषो दोष॑धीना॒ग्ं॒ रसे॒नो त्प॒र्जन्य॑स्य॒ शुष्मे॒णोद॑स्था म॒मृता॒ग्ं॒ अनु॑
    ॥ तच्चक्षु॑र् दे॒वहि॑त च्छु॒क्रमु॒च्चर॑त् ॥ न्नन्दा॑म श॒रद॑श्श॒त म्भवा॑म श॒रद॑श्श॒तग्ं शृ॒णवा॑म श॒रद॑श्श॒त
    म्प्रब्र॑वाम श॒रद॑श्श॒त मजी॑तास्याम श॒रद॑श्श॒त स्सरि॒रस्य॒ मद्ध्या॒थ्स मा॑ वृष॒भो लो॑हिता॒क्ष स्सूर्यो॑
    विप॒श्चि ब्रह्म॑ण॒श्चोत॑न्यसि॒ ब्रह्म॑ण आ॒णीस्थो॒ ब्रह्म॑ण आ॒वप॑नमसि धारि॒तेयं पृ॑थि॒वी ब्रह्म॑णा
    म॒ही धा॑रि॒त मे॑नेन म॒हद॒न्तरि॑क्ष॒ न्दाधार पृथि॒वीग्ं सदे॑वां॒ न्धा॑रयाणि॒ मामद्वेदो ऽधि॒ विस्र॑सत्
    । मे॒धा॒म॒नी॒षे मावि॑शताग्ं स॒मीची॑ भू॒तस्य॒ भव्य॒स्याव॑रुद्ध्यै॒ सर्व॒मायु॑रयाणि॒ सर्व॒मायु॑रयाणि
    ॥ आ॒भिर् गी॒र्भिर् यदतो॑न ऊ॒नमाप्या॑यय हरिवो॒ वर्ध॑मानः । य॒दा स्तो॒तृभ्यो॒ महि॑ गो॒त्रा रु॒जासि॑
    भूयिष्ठ॒भाजो॒ अध॑ते श्याम । ब्रह्म॒ प्रावा॑दिष्म॒ तन्नो॒ माहा॑सीत् ॥ ॐ शान्ति॒
