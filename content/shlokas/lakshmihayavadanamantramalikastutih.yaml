id: lakshmihayavadanamantramalikastutih
category: mantra
name:
  english: lakshmihayavadanamantramalikastutih
  devanagari: लक्ष्मीहयवदनमन्त्रमालिकास्तुतिः
content:
  english: llasayasaditatmadvayamiva savidhe jagradarkasya vimbam || 26|| haridram kinnu sutram shrutitatisudatikanthamusharthaklriptam
    srotassarasvatam vanmayajananagirernissrita veti shakyam | vaktre vahasya vamaprasrititalalasaddhaimasatpustakantah
    divyatsutram pavitram mama kalayatu sham bhanumanoh sagotram || 27|| shvabhreshvabhrebhiyatindititanujanusho
    bhramayitva vibhindan shirnangan kirnakeshan bhrishamatirabhasam patayan nirjaranam | svarajyam prajyayanyo
    mihira iva himajyadharadujjihanah bhabhatyashvasyavametarakaravidhritashcakrarajassa novyat || 28||
    shishyanam cittabhumau pracurataratamahkantakani vyapohya asicyatyartham katakshamritarasavisaraishshastrabijani
    vaptum | nirnidro jnanamudrarucirakaratale dakshine yo'kshamalam bibhradbhatyashvavaktuh saharatu
    nitaramamhasam samhatim me || 29|| ramyam syadvimbamindoh sharaduditarucerambaranniryadetat kim va
    dindirakhandam kalashajalanidheh kim nu va pundarikam | vagbrahmoddamalilagrihamiti vibudhairuhyamano
    hayasye nopattah savyahaste mama bhavatu shubhalambanam kamburajah || 30|| sevya sharvadisarvatridashaparishada
    shashvadasashvini shrih asmakam ya sapatni lasati bata shiro'syadhirudheti sershyam | jetum tam santatoditvaravaramahasa
    bhati nakshatramala devacchande sthita yam satatamapi samaradhayantiva so'vyat || 31|| nantuh santrasahari
    dadhadapi haritam shashvadatmanyanunam yastam murdhnyeva nityam prakatayati hareh purushasyapi satyam
    | shrautim mukhyetaratvavagatimapi vishishtadvitiyatvadrishtim spashtikartum jagatyam sphutayatu sa
    jhatityasmadishtam vishishtam || 32|| maste'rvan vistaraih kim vihara mama manomandurayamamandam kalpante'nuplavaste
    mama satatamime hindriyashva dasha'pi | kim catranalpakalpavasaravisaraduccavacakaramurti
  devanagari: ल्लासायासादितात्मद्वयमिव सविधे जाग्रदर्कस्य विम्बम् ॥ २६॥ हारिद्रं किन्नु सूत्रं श्रुतिततिसुदतीकण्ठमूषार्थक्लृप्तं
    स्रोतस्सारस्वतं वाङ्मयजननगीरेर्निस्सृत वेति शक्यम् । वक्त्रे वाहस्य वामप्रसृतितललसद्धैमसत्पुस्तकान्तः
    दीव्यत्सूत्रं पवित्रं मम कलयतु शं भानुमानोः सगोत्रम् ॥ २७॥ श्वभ्रेष्वभ्रेभियातीन्दितितनुजनुषो भ्रामयित्वा
    विभिन्दन् शीर्णाङ्गान् कीर्णकेशान् भृशमतिरभसं पातयन् निर्जराणाम् । स्वाराज्यं प्राज्ययन्यो मिहिर इव
    हिमज्याधरादुज्जिहानः भाभात्यश्वास्यवामेतरकरविधृतश्चक्रराजस्स नोव्यात् ॥ २८॥ शिष्याणां चित्तभूमौ प्रचुरतरतमःकण्टकानि
    व्यपोह्य आसिच्यात्यर्थं कटाक्षामृतरसविसरैश्शास्त्रबीजानि वप्तुम् । निर्निद्रो ज्ञानमुद्रारुचिरकरतले
    दक्षिणे योऽक्षमालां बिभ्रद्भात्यश्ववक्तुः सहरतु नितरामंहसां संहतिं मे ॥ २९॥ रम्यं स्याद्विम्बमिन्दोः
    शरदुदितरुचेरम्बरान्निर्यदेतत् किं वा डिण्डीरखण्डं कलशजलनिधेः किं नु वा पुण्डरीकम् । वाग्ब्रह्मोद्दामलीलागृहमिति
    विबुधैरूह्यमानो हयास्ये नोपात्तः सव्यहस्ते मम भवतु शुभालम्बनं कम्बुराजः ॥ ३०॥ सेव्या शर्वादिसर्वत्रिदशपरिषदा
    शश्वदासाश्विनी श्रीः अस्माकं या सपत्नी लसति बत शिरोऽस्याधिरूढेति सेर्ष्यम् । जेतुं तां सन्ततोदित्वरवरमहसा
    भाति नक्षत्रमाला देवच्छन्दे स्थिता यं सततमपि समाराधयन्तीव सोऽव्यात् ॥ ३१॥ नन्तुः सन्त्रासहारी दधदपि
    हरितां शश्वदात्मन्यनूनां यस्तां मूर्ध्न्येव नित्यं प्रकटयति हरेः पूरुषस्यापि सत्यम् । श्रौतीं मुख्येतरत्वावगतिमपि
    विशिष्टाद्वितीयत्वदृष्टिं स्पष्टीकर्तुं जगत्यां स्फुटयतु स झटित्यस्मदिष्टं विशिष्टम् ॥ ३२॥ मस्तेऽर्वन्
    विस्तरैः किं विहर मम मनोमन्दुरायाममन्दं कल्पन्तेऽनुप्लवास्ते मम सततमिमे हीन्द्रियाश्वा दशाऽपि । किं
    चात्रानल्पकल्पावसरविसरदुच्चावचाकारमूर्ति
