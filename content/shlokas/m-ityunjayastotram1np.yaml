id: m-ityunjayastotram1np
category: stotram
name:
  english: mṟityunjayastotram1nP
  devanagari: म्ऱित्युन्जयस्तोत्रम्१ण्P
content:
  english: narayanam sahasraksham padmanabham puratanam | pranato'smi hrishikesham kim me mrityuh karishyati
    || 63|| govindam pundarikakshamanantamajamavyayam | keshavam ca prapanno'smi kim me mrityuh karishyati
    || 64|| vasudevam jagadyonim bhanuvarnamatindriyam | damodaram prapanno'smi kim me mrityuh karishyati
    || 65|| shankhacakradharam devam channarupinamavyayam | adhokshajam prapanno'smi kim me mrityuh karishyati
    || 66|| varaham vamanam vishnum narasimham janardanam | madhavam ca prapanno'smi kim me mrityuh karishyati
    || 67|| purusham pushkaram punyam kshemabijam jagatpatim | lokanatham prapanno'smi kim me mrityuh
    karishyati || 68|| bhutatmanam mahatmanam jagadyonimayonijam | vishvarupam prapanno'smi kim me mrityuh
    karishyati || 69|| sahasrashirasam devam vyaktavyaktam sanatanam | mahayogam prapanno'smi kim me mrityuh
    karishyati || 70|| ityudiritamakarnya stotram tasya mahatmanah | apayatastato mrityurvishnudutaishca
    piditah || 71|| iti tena jito mrityurmarkandeyena dhimata | prasanne pundarikakshe nrisimhe nasti
    durlabham || 72|| mrityunjayamidam punyam mrityuprashamanam shubham | markandeyahitarthaya svayam
    vishnuruvaca ha || 73|| ya idam pathate bhaktya trikalam niyatah shucih | nakale tasya mrityuh syannarasyacyutacetasah
    || 74|| hritpadmamadhye purusham puranam narayanam shashvatamadidevam | sancintya suryadapi rajamanam
    mrityum sa yogi jitavamstadaiva || 75|| iti | narasimhapurana adhyaya 7 shlokasamkhya 75 iti shrinarasimhapurane
    markandeyamrityunjayo nama saptamo'dhyayah || 7|| nrisimhapanjarastotram
  devanagari: नारायणं सहस्राक्षं पद्मनाभं पुरातनम् । प्रणतोऽस्मि हृषीकेशं किं मे मृत्युः करिष्यति ॥ ६३॥
    गोविन्दं पुण्डरीकाक्षमनन्तमजमव्ययम् । केशवं च प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६४॥ वासुदेवं
    जगद्योनिं भानुवर्णमतीन्द्रियम् । दामोदरं प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६५॥ शङ्खचक्रधरं देवं
    छन्नरूपिणमव्ययम् । अधोक्षजं प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६६॥ वाराहं वामनं विष्णुं नरसिंहं
    जनार्दनम् । माधवं च प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६७॥ पुरुषं पुष्करं पुण्यं क्षेमबीजं जगत्पतिम्
    । लोकनाथं प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६८॥ भूतात्मानं महात्मानं जगद्योनिमयोनिजम् । विश्वरूपं
    प्रपन्नोऽस्मि किं मे मृत्युः करिष्यति ॥ ६९॥ सहस्रशिरसं देवं व्यक्ताव्यक्तं सनातनम् । महायोगं प्रपन्नोऽस्मि
    किं मे मृत्युः करिष्यति ॥ ७०॥ इत्युदीरितमाकर्ण्य स्तोत्रं तस्य महात्मनः । अपयातस्ततो मृत्युर्विष्णुदूतैश्च
    पीडितः ॥ ७१॥ इति तेन जितो मृत्युर्मार्कण्डेयेन धीमता । प्रसन्ने पुण्डरीकाक्षे नृसिंहे नास्ति दुर्लभम्
    ॥ ७२॥ मृत्युञ्जयमिदं पुण्यं मृत्युप्रशमनं शुभम् । मार्कण्डेयहितार्थाय स्वयं विष्णुरुवाच ह ॥ ७३॥ य
    इदं पठते भक्त्या त्रिकालं नियतः शुचिः । नाकाले तस्य मृत्युः स्यान्नरस्याच्युतचेतसः ॥ ७४॥ हृत्पद्ममध्ये
    पुरुषं पुराणं नारायणं शाश्वतमादिदेवम् । सञ्चिन्त्य सूर्यादपि राजमानं मृत्युं स योगी जितवांस्तदैव ॥
    ७५॥ इति । नरसिंहपुराण अध्याय ७ श्लोकसंख्या ७५ इति श्रीनरसिंहपुराणे मार्कण्डेयमृत्युञ्जयो नाम सप्तमोऽध्यायः
    ॥ ७॥ नृसिंहपञ्जरस्तोत्रं
