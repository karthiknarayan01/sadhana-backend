id: bhargavakritammahadevastotram
category: stotram
name:
  english: bhargavakritammahadevastotram
  devanagari: भार्गवकृतंमहादेवस्तोत्रम्
content:
  english: mastam nayasyabhimatani nishacaranam | dedipyase dinamane gagane hitaya lokatrayasya jagadishvara
    tannamaste || 101|| loke'tivelamativelamahamahobhirnirmasi kaumudamudam ca samutsamudram | vidravitakhilatamah
    sutamo himamsho piyushapuraparipurita tannamaste || 102|| tvam pavane pathi sada gatirasyupasyah kastvam
    vina bhuvanajivana jivatiha | stabdhaprabhanjana vivardhitasarvajanto santoshita hi kulasarvaga tannamaste
    || 103|| vishvaikapavana tavakapavakaika shakterrite'mritavatamritadivyakaryam | pranityado jagadaho
    jagadantaratmam
  devanagari: मस्तं नयस्यभिमतानि निशाचराणाम् । देदीप्यसे दिनमणे गगने हिताय लोकत्रयस्य जगदीश्वर तन्नमस्ते
    ॥ १०१॥ लोकेऽतिवेलमतिवेलमहामहोभिर्निर्मासि कौमुदमुदं च समुत्समुद्रम् । विद्राविताखिलतमाः सुतमो हिमांशो
    पीयूषपूरपरिपूरित तन्नमस्ते ॥ १०२॥ त्वं पावने पथि सदा गतिरस्युपास्यः कस्त्वां विना भुवनजीवन जीवतीह
    । स्तब्धप्रभञ्जन विवर्धितसर्वजन्तो सन्तोषिता हि कुलसर्वग तन्नमस्ते ॥ १०३॥ विश्वैकपावन तावकपावकैक शक्तेरृतेऽमृतवतामृतदिव्यकार्यम्
    । प्राणित्यदो जगदहो जगदन्तरात्मं
meaning: {}
