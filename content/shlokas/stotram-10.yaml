id: stotram-10
category: stotram
name:
  english: stotram
  devanagari: स्तोत्रम्
content:
  english: shriramakrishnashtottarashatanamastotram jayatu jayatu vancha kalpashakhi sashishyah sa jayatu
    bhagavan yah sadguru ramakrishnah | jayatu ca janani shri sharada bhaktidatri vimala carana renam
    dinabhaktah prayace || 1|| tritapanashako devah punah patita pavanah | brahmavishnurmaheshastvam nirguno'si
    niranjanah || 2|| lokamvilokya sakalam kamarthatamasavritam | uditastvam samuddharttum tarunaruna
    sarathih || 3|| putrarupenavatirya
  devanagari: श्रीरामकृष्णाष्टोत्तरशतनामस्तोत्रम् जयतु जयतु वाञ्छा कल्पशाखी सशिष्यः स जयतु भगवान् यः सद्गुरु
    रामकृष्णः । जयतु च जननी श्री शारदा भक्तिदात्री विमल चरण रेणं दीनभक्तः प्रयाचे ॥ १॥ त्रितापनाशको देवः
    पुनः पतित पावनः । ब्रह्माविष्णुर्महेशस्त्वं निर्गुणोऽसि निरञ्जनः ॥ २॥ लोकंविलोक्य सकलं कामार्थतमसावृतम्
    । उदितस्त्वं समुद्धर्त्तुं तरुणारुण सारथिः ॥ ३॥ पुत्ररूपेणावतीर्य
meaning: {}
