id: uttishthashrikrishnashtaksharamantrah
category: mantra
name:
  english: uttishthashrikrishnashtaksharamantrah
  devanagari: उत्तिष्ठश्रीकृष्णाष्टाक्षरमन्त्रः
content:
  english: uttishtha shrikrishnashtaksharamantrah || viniyogah || asya shrikrishnashtaksharamantrasya
    vamadeva rishih | panktih chandah | shrivishnurdevata | sarvabhishtasiddhyarthe jape viniyogah ||
    || rishyadinyasah || vamadevarishaye namah shirasi | panktichandase namah mukhe | shrivishnudevatayai
    namah hridi | viniyogaya namah sarvange || || karanyasah || om um angushthabhyam namah | om tim tarjanibhyam
    namah | om shtham madhyamabhyam namah | om shrim anamikabhyam namah | om krishnaya kanishthikabhyam
    namah | om svaha karatalakaraprishthabhyam namah || || pancanganyasah || bhishaya bhishaya hum hridayaya
    namah | trasaya trasaya hum shirase svaha | pramardaya pramardaya hum shikhayai vashat | pradhvamsaya
    pradhvamsaya hum kavacaya hum | rakshaya rakshaya hum netratrayaya vaushat || || shadanganyasah ||
    uttishtha shrikrishna svaha hum astraya phat || || dhyanam || dugdhambhodhau sitadvipam nanamaniganairyutam
    | vanam cintayet tatra sakalartusamanvitam || nyasoktabharanaih shastrairupetam diptatejasam | surasurarshimukhyaishca
    sevitam capsaroganaih || shankhacakragadapadmadharinam kamalekshanam | pitambaradharam devam shrivatsankitavakshasam
    || mandasmitamukhambhojam kaustubhabharanojjvalam | uttishthantam jagannatham vande shrikrishnamavyayam
    || || mantrah || uttishtha shrikrishna svaha || || purashcaranam || asya mantrasya ashtalakshajapah
    karyah | dugdhaktabilvasamidha dashamshahomah vidheyah || iti uttishtha shrikrishnashtaksharamantrah
    sampurnah |
  devanagari: उत्तिष्ठ श्रीकृष्णाष्टाक्षरमन्त्रः ॥ विनियोगः ॥ अस्य श्रीकृष्णाष्टाक्षरमन्त्रस्य वामदेव
    ऋषिः । पङ्क्तिः छन्दः । श्रीविष्णुर्देवता । सर्वाभीष्टसिद्ध्यर्थे जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥
    वामदेवऋषये नमः शिरसि । पङ्क्तिछन्दसे नमः मुखे । श्रीविष्णुदेवतायै नमः हृदि । विनियोगाय नमः सर्वाङ्गे
    ॥ ॥ करन्यासः ॥ ॐ उं अङ्गुष्ठाभ्यां नमः । ॐ तिं तर्जनीभ्यां नमः । ॐ ष्ठं मध्यमाभ्यां नमः । ॐ श्रीं
    अनामिकाभ्यां नमः । ॐ कृष्णाय कनिष्ठिकाभ्यां नमः । ॐ स्वाहा करतलकरपृष्ठाभ्यां नमः ॥ ॥ पञ्चाङ्गन्यासः
    ॥ भीषय भीषय हुं हृदयाय नमः । त्रासय त्रासय हुं शिरसे स्वाहा । प्रमर्दय प्रमर्दय हुं शिखायै वषट् ।
    प्रध्वंसय प्रध्वंसय हुं कवचाय हुं । रक्षय रक्षय हुं नेत्रत्रयाय वौषट् ॥ ॥ षडङ्गन्यासः ॥ उत्तिष्ठ श्रीकृष्ण
    स्वाहा हुं अस्त्राय फट् ॥ ॥ ध्यानम् ॥ दुग्धाम्भोधौ सितद्वीपं नानामणिगणैर्युतम् । वनं चिन्तयेत् तत्र
    सकलर्तुसमन्वितम् ॥ न्यासोक्ताभरणैः शस्त्रैरुपेतं दीप्ततेजसम् । सुरासुरर्षिमुख्यैश्च सेवितं चाप्सरोगणैः
    ॥ शङ्खचक्रगदापद्मधारिणं कमलेक्षणम् । पीताम्बरधरं देवं श्रीवत्साङ्कितवक्षसम् ॥ मन्दस्मितमुखाम्भोजं
    कौस्तुभाभरणोज्ज्वलम् । उत्तिष्ठन्तं जगन्नाथं वन्दे श्रीकृष्णमव्ययम् ॥ ॥ मन्त्रः ॥ उत्तिष्ठ श्रीकृष्ण
    स्वाहा ॥ ॥ पुरश्चरणम् ॥ अस्य मन्त्रस्य अष्टलक्षजपः कार्यः । दुग्धाक्तबिल्वसमिधा दशांशहोमः विधेयः ॥
    इति उत्तिष्ठ श्रीकृष्णाष्टाक्षरमन्त्रः सम्पूर्णः ।
