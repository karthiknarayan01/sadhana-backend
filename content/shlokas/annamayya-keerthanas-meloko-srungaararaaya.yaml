id: annamayya-keerthanas-meloko-srungaararaaya
category: stotram
name:
  english: Annamayya Keerthanas Meloko Srungaararaaya
content:
  english: adi pallavi meluko shringararaya meti madanagopala | melukovè napala muncina nidhanama || sandadice
    gopikala javvanavanamulona | kanduvandirige madagajamavu | yindumukhi satyabhama hridaya padmamuloni
    | gandhamu mariginatti gandu tummèda || meluko shringararaya meti madanagopala gatigudi rukminikaugita
    panjaramulo | ratimuddu guriseti raciluka | satula padaruvela janta kannula galuvala | kitamai pòdimina
    na yindu bimbama || meluko shringararaya meti madanagopala varusam gòlaniloni vari cannungòndalapai
    | nirati valina na nilameghama | shiranuramuna moci shri venkatadri mida | garima varalicce kalpataruva
    || meluko shringararaya meti madanagopala | melukovè napala muncina nidhanama ||
  devanagari: आदि पल्लवि मेलुको शृङ्गारराय मेटि मदनगोपाल । मेलुकोवॆ नापाल मुञ्चिन निधानमा ॥ सन्दडिचे गोपिकल
    जव्वनवनमुलोन । कन्दुवन्दिरिगे मदगजमवु । यिन्दुमुखि सत्यभाम हृदय पद्ममुलोनि । गन्धमु मरिगिनट्टि गण्डु
    तुम्मॆद ॥ मेलुको शृङ्गारराय मेटि मदनगोपाल गतिगूडि रुक्मिणिकौगिट पञ्जरमुलो । रतिमुद्दु गुरिसेटि राचिलुका
    । सतुल पदारुवेल जण्ट कन्नुल गलुवल । कितमै पॊडिमिन ना यिन्दु बिम्बम ॥ मेलुको शृङ्गारराय मेटि मदनगोपाल
    वरुसं गॊलनिलोनि वारि चन्नुङ्गॊण्डलपै । निरति वालिन ना नीलमेघमा । शिरनुरमुन मोचि श्री वेङ्कटाद्रि मीद
    । गरिम वरालिच्चे कल्पतरुवा ॥ मेलुको शृङ्गारराय मेटि मदनगोपाल । मेलुकोवॆ नापाल मुञ्चिन निधानमा ॥
