id: gayatri-samhita
category: stotram
name:
  english: gayatri samhita
  devanagari: गायत्री संहिता
content:
  english: samsiddhih sahayogashca sarvatah | svasthyam va traya ete syustasmallabhashca laukikah || 14||
    kathinyam vividham ghoram hyapadam samhatistatha | shighram vinashatam yanti vividha vighnarashayah
    || 15|| vinashadukta shatrunamantah shaktirvivardhate | samkatanamanayasam param yati taya narah ||
    16|| gayatryupasakasvante satkama udbhavanti hi | tatpurtaye'bhijayante sahajam sadhananyapi || 17||
    trutayah sarvatha dosha vighna yanti yadantatam | manavo nirbhayam yati purnonnati patham tada ||
    18|| bahyamcabhyantaram tvasya nityam sanmargagaminah | unnaterubhayam dvaram yatyunmuktakapatatam
    || 19|| atah svasthena cittena shraddhaya nishthaya tatha | kartavyaviratam kale gayatryah samupasana
    || 20|| dayaluh shakti sampanna mata buddhimati yatha | kalyanam kurute hyeva premna balasya catmanah
    || 21|| tathaiva mata lokanam gayatri bhaktavatsala | vidadhati hitam nityam bhaktanam dhruvamatmanah
    || 22|| kurvannapi trutirloke balako mataram prati | yatha bhavati kashcinna tasya apritibhajanah
    || 23|| kurvannapi trutirbhaktah kvacit gayatryupasane | na tatha phalamapnoti viparitam kadacana
    || 24|| aksharanam tu gayatrya gumphanam hyasti tadvidham | bhavanti jagrita yena sarva guhyastu granthayah
    || 25|| jagrita granthayastvetah sukshmah sadhakamanase | divyashaktisamudbhutim kshipram kurvantyasamshayam
    || 26|| janayanti krite pumsameta vai divyashaktayah | vividhan vai parinaman bhavyan mangalapuritan
    || 27|| mantrasyoccaranam karyam shuddhamevapramadatah | tadashakto japennityam sapranavastu vyahritih
    || 28|| omiti pranavah purvam bhurbhuvah svastaduttaram | eshokta laghu gayatri vidvadbhirvedapanditaih
    || 29|| shuddham paridhanamadhaya shuddhe vai vayumandale | shuddha dehamanobhyam vai karya gayatryupasana
    || 30|| dikshamadaya gayatrya brahmanishthagrajanmana | arabhyatam tatah samyagvidhinopasana sata
    || 31|| gayatryupasanamuktva nityavashyakakarmasu | uktastatra dvijatinam nanadhyayo vicakshanaih
    || 32|| aradhayanti gayatrim na nityam ye dvijanmanah | jayante hi svakarmabhyaste cyuta natra samshayah
    || 33|| shudrastu janmana sarve pashcadyanti dvijanmatam | gayatryaiva janah sakam hyupavitasya dharanat
    || 34|| uccata patitanam ca papinam papanashanam | jayete kripayaivasyah vedamaturanantaya || 35||
    gayatrya ya yuta sandhya brahmasandhya tu sa mata | kirtitam sarvatah shreshtham tasyanushthanamagamaih
    || 36|| acamanam shikhabandhah pranayamo'ghamarshanam | nyasashcopasanayam tu panca kosha mata budhaih
    || 37|| dhyanatastu tatah pashcat savadhanena cetasa | japya satatam tulasi malaya ca muhurmuhuh ||
    38|| eka varam pratidinam nyunato nyunasankhyakam | dhimanmantra shatam nunam nityamashtottaram japet
    || 39|| brahme muhurte pranmukho merudandam pratanya hi | padmasanam samasinah sandhyavandanamacaret
    || 40|| dainyaruk shoka cintanam virodhakramanapadam | karyam gayatryanushthanam bhayanam varanaya
    ca || 41|| jayate sa sthitirasmanmano'bhilashayanvita | yatah sarve'bhijayante yatha kalam hi purnatam
    || 42|| anushthanattu vai tasmadguptadhyatmika
  devanagari: संसिद्धिः सहयोगश्च सर्वतः । स्वास्थ्यं वा त्रय एते स्युस्तस्माल्लाभाश्च लौकिकाः ॥ १४॥ काठिन्यं
    विविधं घोरं ह्यापदां संहतिस्तथा । शीघ्रं विनाशतां यान्ति विविधा विघ्नराशयः ॥ १५॥ विनाशादुक्त शत्रूणामन्तः
    शक्तिर्विवर्धते । संकटानामनायासं पारं याति तया नरः ॥ १६॥ गायत्र्युपासकस्वान्ते सत्कामा उद्भवन्ति हि
    । तत्पूर्तयेऽभिजायन्ते सहजं साधनान्यपि ॥ १७॥ त्रुटयः सर्वथा दोषा विघ्ना यान्ति यदान्तताम् । मानवो
    निर्भयं याति पूर्णोन्नति पथं तदा ॥ १८॥ बाह्यंचाभ्यन्तरं त्वस्य नित्यं सन्मार्गगामिनः । उन्नतेरुभयं
    द्वारं यात्युन्मुक्तकपाटताम् ॥ १९॥ अतः स्वस्थेन चित्तेन श्रद्धया निष्ठया तथा । कर्तव्याविरतं काले
    गायत्र्याः समुपासना ॥ २०॥ दयालुः शक्ति सम्पन्ना माता बुद्धिमती यथा । कल्याणं कुरुते ह्येव प्रेम्णा
    बालस्य चात्मनः ॥ २१॥ तथैव माता लोकानां गायत्री भक्तवत्सला । विदधाति हितं नित्यं भक्तानां ध्रुवमात्मनः
    ॥ २२॥ कुर्वन्नपि त्रुटीर्लोके बालको मातरं प्रति । यथा भवति कश्चिन्न तस्या अप्रीतिभाजनः ॥ २३॥ कुर्वन्नपि
    त्रुटीर्भक्तः क्वचित् गायत्र्युपासने । न तथा फलमाप्नोति विपरीतं कदाचन ॥ २४॥ अक्षराणां तु गायत्र्या
    गुम्फनं ह्यस्ति तद्विधम् । भवन्ति जागृता येन सर्वा गुह्यास्तु ग्रन्थयः ॥ २५॥ जागृता ग्रन्थयस्त्वेताः
    सूक्ष्माः साधकमानसे । दिव्यशक्तिसमुद्भूतिं क्षिप्रं कुर्वन्त्यसंशयम् ॥ २६॥ जनयन्ति कृते पुंसामेता
    वै दिव्यशक्तयः । विविधान् वै परिणामान् भव्यान् मङ्गलपूरितान् ॥ २७॥ मन्त्रस्योच्चारणं कार्यं शुद्धमेवाप्रमादतः
    । तदशक्तो जपेन्नित्यं सप्रणवास्तु व्याहृतीः ॥ २८॥ ओमिति प्रणवः पूर्वं भूर्भुवः स्वस्तदुत्तरम् । एषोक्ता
    लघु गायत्री विद्वद्भिर्वेदपण्डितैः ॥ २९॥ शुद्धं परिधानमाधाय शुद्धे वै वायुमण्डले । शुद्ध देहमनोभ्यां
    वै कार्या गायत्र्युपासना ॥ ३०॥ दीक्षामादाय गायत्र्या ब्रह्मनिष्ठाग्रजन्मना । आरभ्यतां ततः सम्यग्विधिनोपासना
    सता ॥ ३१॥ गायत्र्युपासनामुक्त्वा नित्यावश्यककर्मसु । उक्तस्तत्र द्विजातीनां नानध्यायो विचक्षणैः ॥
    ३२॥ आराधयन्ति गायत्रीं न नित्यं ये द्विजन्मनः । जायन्ते हि स्वकर्मभ्यस्ते च्युता नात्र संशयः ॥ ३३॥
    शूद्रास्तु जन्मना सर्वे पश्चाद्यान्ति द्विजन्मताम् । गायत्र्यैव जनाः साकं ह्युपवीतस्य धारणात् ॥ ३४॥
    उच्चता पतितानां च पापिनां पापनाशनम् । जायेते कृपयैवास्याः वेदमातुरनन्तया ॥ ३५॥ गायत्र्या या युता सन्ध्या
    ब्रह्मसन्ध्या तु सा मता । कीर्तितं सर्वतः श्रेष्ठं तस्यानुष्ठानमागमैः ॥ ३६॥ आचमनं शिखाबन्धः प्राणायामोऽघमर्षणम्
    । न्यासश्चोपासनायां तु पञ्च कोषा मता बुधैः ॥ ३७॥ ध्यानतस्तु ततः पश्चात् सावधानेन चेतसा । जप्या सततं
    तुलसी मालया च मुहुर्मुहुः ॥ ३८॥ एक वारं प्रतिदिनं न्यूनतो न्यूनसङ्ख्यकम् । धीमान्मन्त्र शतं नूनं नित्यमष्टोत्तरं
    जपेत् ॥ ३९॥ ब्राह्मे मुहूर्ते प्राङ्मुखो मेरुदण्डं प्रतन्य हि । पद्मासनं समासीनः सन्ध्यावन्दनमाचरेत्
    ॥ ४०॥ दैन्यरुक् शोक चिन्तानां विरोधाक्रमणापदाम् । कार्यं गायत्र्यनुष्ठानं भयानं वारणाय च ॥ ४१॥ जायते
    सा स्थितिरस्मान्मनोऽभिलाषयान्विता । यतः सर्वेऽभिजायन्ते यथा कालं हि पूर्णताम् ॥ ४२॥ अनुष्ठानात्तु
    वै तस्माद्गुप्ताध्यात्मिक
