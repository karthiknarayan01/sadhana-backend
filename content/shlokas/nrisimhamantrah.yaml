id: nrisimhamantrah
category: mantra
name:
  english: nrisimhamantrah
  devanagari: नृसिंहमन्त्रः
content:
  english: shriganeshaya namah | shrilakshminrisimhaya namah | karpuradhamadhavalam katakangadadi chatram
    trinetrashashishekharamanditangam | vamankasamsthitaramanayanabhiramam cakrabjashankhasagadam nriharim
    namami | atha mantrarajanushthanakramah kathyate | snanadi nityakriyah samapya viviktadeshe sukhasane
    samyagupavishya guruparamparam natva shuddhibhuta shuddhipranapratishthamatrikannyasayogapithanyasantam
    kritva'bhadram karnebhiriti shanti pathitva svasti na iti ca prakritiprakritasheshavishesha yadvibhutayah
    pravishantumamantasthe vishnoshcaranarenavah || 1|| shritapiniya shrutisutrasarasatsampradayamalagandhashobham
    nityam nrisimhasya karotu | saisha santoshamanushtubha kalpamala || 2|| sakricchratapyasauvidha sadyo
    dahati samstim | tuladahekidhanasti marah kalanalarcishah || 3|| asya mahimasimanamaviditva nivartate
    | apyaupanishadi vani paurusheyi tu kim punah || 4|| avarshavasinamenam vadatah kutilatmanam | langhayanti
    nrisimhasya divyamajnamavajnaya || 5|| iti shlokanpathitva pranavashaktibijasamputitena mulamantrena
    pranayamatrayam kritva kritanjalirbhutva asya shrinrisimhanushtubhamantrarajasya vidhih || prajapatirbrahma
    rishih | anushtup chandah | shri bhagavan mangaleshvarah | shrinrisimhah paramatma devata | iti shirovadana
    hridayeshu vinyaset | adya jaganmula prakritih shaktih | mahapurusha adyam bijam | buddhirdvitiya
    shaktih | tadupadhikapratyagatma dvitiyam bijam | amritapurani madhyavartini muladharadarabhya brahmarandhraparyanta
    sushumnasarasvati kuladevi tritiya shaktih | tatsahacara udano vayustritiyam bijam | im caturthi shaktih
    | ham caturtham bijam | evam nabhau vinyasya | parabrahmatattvam paramatma kshetram | shuklo varnah
    | udattasvarah ityuccarya nri ityetaddashtam kilakam jnatam | satsiddhirapratibandhakam simha ityeddashtam
    kilakam jnatam satsarvasiddhipradam iti padayovirnyaset | tatharishim murdhni mukhe chando devatam
    hridi vinyaset | adhare bijashakti ca kilakam padayornyaset | tatah niratishayanirantaranrisimhaprasadasiddhyarthe
    jape viniyogah pranavashaktibijasamputitena mulamantrena karashuddhim kuryat | prakoshthe manibandhe
    ca kurparakarayostale tatprishthe ca dante ca karashuddhirudahrita | evam karashuddhi vidhaya pancaganyasam
    kuryat | om im ham ugram | om plum ham im om angushthabhyam namah | hridayaya namah | om im ham jvala0
    kham ham im om tarjanibhyam namah | shirase svaha | om im ham nrisimha ma im1 dam im om madhyamabhyam
    namah | shikhayai vashat | om im ham mrityu0 ham ham im om anamikabhyam namah | kavacaya hum | om
    im ham ugram0 bhyaham ham im om kanishthikabhyam namah | vaushat | astraya phat | tatah pranavashaktibijasamputitena
    mulena vyapakatrayam kuryat || athaksharam nyasam kuryat | shirolalatanetradvayamukha doh pancasandhyagrakatidvayaguhyanabhi
    hridayagaladharagaleshu om um om om gram om ityadi pranavasamputitanyaksharani nyaset | atha dvadashavidhinyasam
    kuryat tadyatha pranavashaktibijani pranavasamputitani | namo tani sabindukani ca dakshinatarjanimarabhya
    vamatarjaniparyantam dvatrimsharekhasu vinyasya vamangushtharekhatrayeshu | bijashaktipranavan pranavasamputitani
    namo tani vinyaset | vamakaratale mendhe muladhare urvoh janvoh janghayoh parshvayostadangulishu |
    ham im om om ham om namah | raktasthimajjasu | athadvayaksharanyasah | padadi murdhniparyantam om
    om im ham om ugram om namah om viram om namah | padayoh evam sarvatra urvoh katyam nabhyam hridi bahvoh
    kanthe cubuke oshthayoh gandayoh karnayoh asye nasikayoh netrayoh om myaham ham im om om namah murdhni
    | atha padanyasah | mukhadi padaparyanta om im ham om ugram om namah mukhe murdhni nasikayam netrayoh
    shrotrayoh vadane hradaye nabhyam kattyam janvoh om aham ham im om om namah padayoh || atha caturaksharanyasah
    | nasikadipadaparyantam om om im ham om ugram viram om namah | nasikanayanayoh shravanayoh nabhau
    hradi murdhni bahvoh om namamyaham ham im om namah padayoh | atha padanyasah | om om im ham ugram
    vishnum om namah murdhni | jvalam om namah hridi | nrisimham im om namah nabhau om mrityu myaham ham
    im om om namah sarvangeshu | athardhanyasah | om im ham ugram mukham om namah murdhadihridayaparyantam
    om nrisimha myaham ham im om om namah | hridayadipadaparyantam athogranyasah | mukhadipadaparyantam
    om om im ham ugram ugram namamyaham om namah mukhe | om viram ugram namamyaham om namah shirasi ityadi
    ghranayoh cakshushoh shrotayoh kesarasthaneshu hridaye nabhau | om mrityumrityum ugram namamyaham
    ham ham im om katyadipadaparyantam | atha viranyasah | asya nyasasya purvavadeva mukhadisthanani om
    im ham ugram viram namamyaham | mukhe om viram viram om namah | namamyaham om namah shirasi ghranayoshca
    cakshushoh shrotayoh kesarasthaneshu hridaye nabhau mrityumrityum viram namamyaham ham im om namah
    katyadipadaparyantam | atha simhanyasah | om im ham ugrasimham namamyaham om namah mukhe om viram
    simham namamyaham shirasi ghranayoshcakshushoh shrotayoh kesarasthaneshu hridaye nabhau om mrityumrityum
    simham namamyaham || ham im om om namah katyadipadaparyantam vinyaset | iti dashavidhanyasah | atha
    harinyasah | om om im ham om om namah muladhare om gram om namah svadhishthane om vim om namah tadupari
    manipurake tadahi mahavishnum anahataparyantam tadahi jvalantam vishuddhaparyantam sarvato bhrumadhyajnaparyantam
    mukham nri netrayoh simham murdhni bhishanam bhadram dakshinahaste mrityumrityum vamahaste mam dakshinapadebhya
    vamapade ham ham im om om namah | ittham savarnamurdhadi padaparyantam nyaset | asya harinyasasya
    sakshaddharisarupyadi prapakasya mahatmyam harireva janati | manushyo vaktum na samarthah || atha
    pancatattvanyasah | om im ham ugram vishnum rik prithivyatmane namah | padayoh om jvalantam sarvatomukham
    yajuragnyatmane namah guhye om nrisimham samatmane namah hridaye | om mrityumrityum ham ham im om
    atharvagirasavambatmane namah mukhe om im ham ugram vishnum mahavishnum jvalantam sarvatomukham |
    nrisimham bhishanam bhadram mrityumrityum namamyaham | ham im om samasta itihasabhyam pranavakashatmane
    namah shirasi | ugranrisimhaya namah | krom nrisimhaya namah | vira nrisimhaya namah | vidambana nrisimhaya
    namah | kopa nrisimhaya namah | shiromukha hridayenabhipadeshu vinyaset || am atmatattveshvaraya padayoh
    um vitattveshvaraya guhye mam shivatattveshvaraya nabhau om sarvatattveshvaraya nabhyadipadaparyantam
    vyapakarupena vinyaset | am atmatattvetyadimantratrayamuktva hridayamukhashirassu vinyasya om sarvatattveshvaraya
    namah murdhniparyantam vyapakarupena vinyaset | am atmatattvetyadi punarmantratrayena padahridayashirassu
    vinyasya om sarvatattveshvaraya nama iti sarvangavyapakam kuryat || punah purvavat vyapakatrayam kuryat
    | om im ham am ugram vishnum am shuklavarnaya anandatmane hridayaya namah om jvalantam sarvatomukham
    om hrim ghrinih suryadityah shrim um shuklavarnaya kriyatmane shirase svaha | mam nrisim im om bhurlakshmirbhuvarlakshmih
    suvah kalakarni tanno mahalakshmih pracodayat | mam pingalavarnaya jyotiratmane shikhayai vashat om
    mrityumrityum namamyaham om nrisimhaya vidmahe vajranakhaya dhimahi tannah simhah pracodayat | ham
    im om om hemavarnaya mayatmane kavacaya hum | om im ham ugram viram mahavishnum jvalantam sarvatomukham
    nrisimham bhishanam bhadram mrityumrityum namamyaham ham ham im om sarvavedatmane vidyudvarnaya mahacakratmane
    astraya phat | om bhurbhuvah svah iti digbandhah | satyajnaneti etat shlokoktalakshanah shrinrisimhah
    svayam bhutva lam prithivityadi pancopacarapujam kritva mulam dvadashavaram japitva dvisvarasamna
    vyapakatrayam kuryat || atra udatanudattabhyam aksharanam dvandvashah ganam tarjanyagrenangushthamula
    parva sprishan angushthantaparvonchrayena udattam gayet | angushthagrena kanishthikagratanmulaparvannanudattam
    gayet | auma om iti pranavasya dviravritya ashtamatratvam sampadya gayet | matrashabdena varna ucyate
    | a u udattena ma om anudattena gitimatrasankhya 345 a u punarudattena ma om punaranudattena sarva
    gane tistrahshca tastra panca va matra bhavanti evam shaktibijayorapi caturgunenashthamatratvam sampadya
    gayet | im ham im ham iti || tathaivaprathamapadam tadangapranavam ca pragaya dvitiyapadam gitva saurasavitri
    samarahitam pathitva tritiyapadam ca pragayajurlakshmim samarahitam pathet | saurasavitri yajulakshmayorna
    ganamiti sampradayah | tatashcaturthapadam nrisimhagayatri ca pragathamishrena sama gayet | dvigunikritayoh
    shaktibijayoh pranavasya caikaikam matram mishrikritya gayet | imahamu imahamu evam dvisvarasama trivaram
    pragaya vyapakatrayam kuryat | ugram viram mahavishnum a u ma om a u ma om ityadi prakashe ganasya
    jneyah | idamanushtubhasama anenanushtabhasamna shrilakshminrisimhatmano mama dehe vyapakanyasah sampadyatam
    lakshminrisimhaham brahmasmiti vyapakasamante pathet || atha shatsvarasamna padashongam nyasam kuryat
    | udattamadyadvayamatra gitva nicaistritiyam caturiyapancamau madhyasvarenaiva tathaiveti padapurane
    tathaiva shashtheruccairamuccairmanumashtamam ca | iti shatsvara samagana prakarah | atra pranavasya
    dviravrittya ashtamatrasu a u m om m amadhyamasvarena u m om m shatsvaraganakale dirghaksharani vamahastangulibhih
    grihniyat | tarjanimadhyamanamikakanishthikanam madhyamaparvani vakrangushthagratah sprishannudattopakramenottarottaram
    anudattam shanairgayet | ayameva madhyamasvarah karshanakhyah evam shaktibije prathamapadam tadante
    angapranavam ca gitva im ham im ham im ham im ham ugram viram maha vishnum a u ma om a u ma om m sasagaram
    saparvatam sasaptadvipam vasundharam agnirvairdeva idam sarvam vishvabhutani prana vai indriyani pashavonnamamritam
    samrat svarat virat tasya ha vai pranavasya ya purva matra prithivyakarah sa rigbhirarigvedo brahma
    vasavo gayatri garhapatyah soyamatma ca tushyajjagarita sthano bahih prajnah saptanga ekonavimshatimukhah
    sthulabhugvaishvanarah prathamah padah iti vakyacatushtayam pathitva om im ham am ugram viram mahavishnum
    | am shuklavarnayanandatmane hridayaya namah || tato dvitiyam padam pragaya jvalantam sarvatomukham
    | om hrim ghrinih surya adityah shrim shriyalakshmi aupalamambikangam shashthim ca yamindrasenetyapyahuh
    | tam vidyam brahmayonim sarupamihayushe sharanamaham prapadye iti vakyadvayam pathitva shriyadi saptashaktibhih
    kanakalashairamritamaniyabhishicyamanamatmanam nrisimham dhyayet | svashirasi lakshmimudram ca pradarshayet
    | yakshagandharvapsaroganasevitamantariksham rigyajuhsamatharvarupah suryotaradityehirashpayah purushah
    dvitiyantariksham sa ukarah sayajurbhiryajurvedo vishnurudratrishtup dakshinagnih sva prasthanontah
    prajnah saptangaekonavimshatimukhah praviviktamuktaijaso dvitiyah padah | um jvalantam sarvatomukham
    om hrim ghrinih suryadityah shrim um krishnavarnaya priyatmane shirase svaha || tatastritiyam padam
    pragaya nrisimham bhishanam bhadram om bhurityadi yajurlakshmim pathitva vasuradityaih sarvairdevaih
    sevitam divam ya oshadhinam prabhavati tarapatih somah tritiya dyauh samakarah sa samabhih samavedo
    rudradityah jagatyahavaniyah yatra suptonakancanakamam kamayate na kancana sva prapashyati tatsushuptam
    sushuptasthanaekibhutah prajnanaghana evanandamayo svanandabhuk cetomukhah prajnastritiyah padah esha
    sarveshvara esha sarvajna eshotaryamyeshayonih sarvasya prabhavapyayau hi bhutanam | mam nrisimham
    bhishanam bhadram om bhurlakshmih bhuvarlakshmih suvah kalakarna kalakarna | tanno mahalakshmih pracodayat
    | mam pingalavarnaya jyotiratmane shikhayai vashat || tatashcaturthapadam pragaya | mrityumrityum
    namamyaham nrisimhagayatrim ca pragaya | om nrisimhaya vidmahe vajranakhaya dhimahi tannah simhah
    pracodayat | mishranam ca pragaya i ma ha bhu i ma ha bhu brahmasvarupam niranjanam paramavyomnikam
    sabrahma sashivah saharih sendrah soksharah paramasvarat yavasanesya caturthyardhamatra sa somaloka
    onkarah sa atharvanairmantrairatharvavedah samvartakognirmaruto viradekarishirbhasvati smrita | na
    vahi prajnam nantah prajnam nobhayatah prajnam na prajnam na prajnam na prajnanaghanam adrishtamavyavaharya
    magratmalakshana macityamavyapadeshyamekatmapratyayasaram prapancopashamam shivamadvaitam caturtham
    manyate sa atma savijneyah | om mrityumrityum namamyaham om nrisimhaya dhimahi tannah simhah pracodayat
    | ham im om om hemavarnaya mayatmane kavacaya hum | atha pancamam mahacakrakhyammastramucyate | shatsvarasamnaiva
    pranavam shaktibijam ca pragaya prathamapadam gitva tadangapranavam ca pragaya dvitiyapadam gitva
    saurasavitrim samarahitam pathet | tatastritiyapadam gitva yajulakshmim samarahitam pathet || tatashcaturthapadam
    nrisimhagayatri ca pragaya mishranasamam gayet | catvaro vedah sangah sashakhah catvarah pada bhavanti
    pranavam sarvam pancamam bhavati shadaram va etatsudarshanam mahacakram tasmatshadaram bhavati shatpatram
    cakram bhavati shad va ritava ritubhih samitam | bhavati madhye nabhirbhavati nabhyam va ete arah
    pratishthitah | ma yatha va etatsarvam veshtitam bhavati natmanam maya sprishati tasmadyatha bahirveshtitam
    bhavati athashtaramashtapatram cakram bhavati rico akshare parame vyomanyasmindeva adhivishvenisheduh
    yastam na veda kimrica karishyati ya etadvidusta ime samasate || iti etatsarvam pathitva svashariram
    brahmandam bhavayitva shariramadhye nabhi dhyatva tasminkshirasagaram dhyatva shvetadvipam ca dhyatva
    sheshaparyanke pranavam vicintya nrisimhaika ksharam vicitya om raum om sahasrara hum phat om namo
    narayanaya om namo bhagavate vasudevaya am am am a om om om gram om myam om om ham om evam sarvatra
    ka kham gam jah vasunam sthanani | sam jam dam dham rudranam sthanani nam gham sham sham aditya sthanani
    sam ham lam ksham vishvedevanam sthanani om um mam brahmavishnumaheshvaranam sthanani ham sam suryacandramasoh
    sthane om im ham ugram
  devanagari: श्रीगणेशाय नमः । श्रीलक्ष्मीनृसिंहाय नमः । कर्पूरधामधवलं कटकाङ्गदादि छत्रं त्रिनेत्रशशिशेखरमण्डिताङ्गम्
    । वामाङ्कसंस्थितरमानयनाभिरामं चक्राब्जशङ्खसगदं नृहरिं नमामि । अथ मन्त्रराजानुष्ठानक्रमः कथ्यते । स्नानादि
    नित्यक्रियाः समाप्य विविक्तदेशे सुखासने सम्यगुपविश्य गुरुपरम्परां नत्वा शुद्धीभूत शुद्धिप्राणप्रतिष्ठामातृकान्न्यासयोगपीठन्यासान्तं
    कृत्वाऽभद्रं कर्णेभिरिति शान्ति पठित्वा स्वस्ति न इति च प्रकृतिप्राकृताशेषविशेषा यद्विभूतयः प्रविशन्तुममान्तस्थे
    विष्णोश्चरणरेणवः ॥ १॥ श्रीतापिनीय श्रुतिसूत्रसारसत्सम्प्रदायामलगन्धशोभां नित्यं नृसिंहस्य करोतु ।
    सैषा सन्तोषमानुष्टुभ कल्पमाला ॥ २॥ सकृच्छ्रताप्यसौविधा सद्यो दहति संस्तिम् । तूलदाहेकिधानस्ति मारः
    कालानलार्चिषः ॥ ३॥ अस्या महिमसीमानमविदित्वा निवर्तते । अप्यौपनिषदी वाणी पौरुषेयी तु किं पुनः ॥ ४॥
    अवर्षवासिनामेनां वदतः कुटिलात्मनाम् । लङ्घयन्ति नृसिंहस्य दिव्यामाज्ञामवज्ञया ॥ ५॥ इति श्लोकान्पठित्वा
    प्रणवशक्तिबीजसम्पुटितेन मूलमन्त्रेण प्राणायामत्रयं कृत्वा कृताञ्जलीर्भूत्वा अस्य श्रीनृसिंहानुष्टुभमन्त्रराजस्य
    विधिः ॥ प्रजापतिर्ब्रह्मा ऋषिः । अनुष्टुप् छन्दः । श्री भगवान् मङ्गलेश्वरः । श्रीनृसिंहः परमात्मा
    देवता । इति शिरोवदन हृदयेषु विन्यसेत् । आद्या जगन्मूला प्रकृतिः शक्तिः । महापुरुष आद्यं बीजम् । बुद्धिर्द्वितीया
    शक्तिः । तदुपाधिकप्रत्यगात्मा द्वितीयं बीजम् । अमृतपूरणी मध्यवर्तिनी मूलाधारादारभ्य ब्रह्मरन्ध्रपर्यन्ता
    सुषुम्नासरस्वती कुलदेवी तृतीया शक्तिः । तत्सहचर उदानो वायुस्तृतीयं बीजम् । ईं चतुर्थी शक्तिः । हं
    चतुर्थं बीजम् । एवं नाभौ विन्यस्य । परब्रह्मतत्त्वं परमात्मा क्षेत्रम् । शुक्लो वर्णः । उदात्तस्वरः
    इत्युच्चार्य नृ इत्येतद्दष्टं कीलकं ज्ञातम् । सत्सिद्धिरप्रतिबन्धकं सिंह इत्येद्दष्टं कीलकं ज्ञातं
    सत्सर्वसिद्धिप्रदं इति पादयोविर्न्यसेत् । तथाऋषिं मूर्ध्नि मुखे छन्दो देवतां हृदि विन्यसेत् । आधारे
    बीजशक्ती च कीलकं पादयोर्न्यसेत् । ततः निरतिशयनिरन्तरनृसिंहप्रसादसिद्ध्यर्थे जपे विनियोगः प्रणवशक्तिबीजसम्पुटितेन
    मूलमन्त्रेण करशुद्धिं कुर्यात् । प्रकोष्ठे मणिबन्धे च कूर्परकरयोस्तले तत्पृष्ठे च दन्ते च करशुद्धिरुदाहृता
    । एवं करशुद्धि विधाय पञ्चागन्यासं कुर्यात् । ॐ ईं हं उग्रम् । ॐ प्लुं हं ईं ॐ अङ्गुष्ठाभ्यां नमः ।
    हृदयाय नमः । ॐ ईं हं ज्वल० खं हं ईं ॐ तर्जनीभ्यां नमः । शिरसे स्वाहा । ॐ ईं हं नृसिंह म ईं१ दं ईं
