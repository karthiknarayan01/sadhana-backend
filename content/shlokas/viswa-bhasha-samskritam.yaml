id: viswa-bhasha-samskritam
category: stotram
name:
  english: Viswa Bhasha Samskritam
  devanagari: विश्वभाषासंस्कृतम्
content:
  english: saralabhasha samskritam sarasabhasha samskritam | sarasasaralamanojnamangaladevabhasha samskritam
    || 1|| madhurabhasha samskritam mridulabhasha samskritam | mridulamadhuramanoharamritatulyabhasha
    samskritam || 2|| devabhasha samskritam vedabhasha samskritam | bhedabhavavinashakam khalu divyabhasha
    samskritam || 3|| amritabhasha samskritam atulabhasha samskritam | sukritijanahridi parilasitashubhavaradabhasha
    samskritam || 4|| bhuvanabhasha samskritam bhavanabhasha samskritam | bharatabhuvi parilasitakavyamanojnabhasha
    samskritam || 5|| shastrabhasha samskritam shastrabhasha samskritam | shastrashastrabhridarshabharatarashtrabhasha
    samskritam || 6|| dharmabhasha samskritam karmabhasha samskritam | dharmakarmapracodakam khalu vishvabhasha
    samskritam || 7||
  devanagari: सरलभाषा संस्कृतं सरसभाषा संस्कृतम् । सरससरलमनोज्ञमङ्गलदेवभाषा संस्कृतम् ॥ १॥ मधुरभाषा संस्कृतं
    मृदुलभाषा संस्कृतम् । मृदुलमधुरमनोहरामृततुल्यभाषा संस्कृतम् ॥ २॥ देवभाषा संस्कृतं वेदभाषा संस्कृतम्
    । भेदभावविनाशकं खलु दिव्यभाषा संस्कृतम् ॥ ३॥ अमृतभाषा संस्कृतं अतुलभाषा संस्कृतम् । सुकृतिजनहृदि परिलसितशुभवरदभाषा
    संस्कृतम् ॥ ४॥ भुवनभाषा संस्कृतं भवनभाषा संस्कृतम् । भरतभुवि परिलसितकाव्यमनोज्ञभाषा संस्कृतम् ॥ ५॥
    शस्त्रभाषा संस्कृतं शास्त्रभाषा संस्कृतम् । शस्त्रशास्त्रभृदार्षभारतराष्ट्रभाषा संस्कृतम् ॥ ६॥ धर्मभाषा
    संस्कृतं कर्मभाषा संस्कृतम् । धर्मकर्मप्रचोदकं खलु विश्वभाषा संस्कृतम् ॥ ७॥
