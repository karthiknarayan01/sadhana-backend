id: turiyashodashitrailokyavijayakavacastotram-sartham
category: kavacha
name:
  english: turiyashodashitrailokyavijayakavacastotram (sartham)
  devanagari: तुरीयाषोडशीत्रैलोक्यविजयकवचस्तोत्रम् (सार्थम्)
content:
  english: rahasyatirahasyakam | turiyam kavacam divyam sarvamantramayam shubham || 11|| pujante tu japatpurvam
    kavacam samudirayet | || viniyogah || asya shrikavacasyasya rishiranandabhairavah || 12|| shrividya
    devatashchando gayatrirucivrittikam | ramabijam parashaktih vagbhavam kilakam smritam || 13|| mama
    sarvarthasiddhayarthe jape tu viniyogatah | || karanyasah || angushthagre vagbhavam ca hrillekham
    tarjani nyaset || 14|| lakshmibijam madhyamayamangira'namika tatha | parabijam kanishthayam lakshmim
    karatale nyaset || 15|| || shadanganyasah || hridaye vagbhavam nyasyat param shirasi ca nyaset | lakshmibijam
    shikhayam ca kavace vagbhavam nyaset || 16|| hrillekham netrayornyasyadastram tu kamalam nyaset |
    || digbandhanam || bhurbhuvah svariti manuna digbandhanamacaret || 17|| dhyanam tasya pravakshyami
    dharmakamarthamokshadam | nyasadhyanadikam sarvam kritva tu kavacam pathet || 18|| || dhyanam || kshirasagaramadhyasthe
    ratnadvipe manohare | ratnasimhasane divye tatra devim vicintayet || 19|| kotisuryapratikasham candrakotinibhananam
    | dadimipushpasankasham kunkumodarasannibham || 20|| japakusumasankasham trinetram ca caturbhujam
    | pashankushadharam ramyamikshucapasharanvitam || 21|| karpurashakalonmishratambulapuritananam | sarvasha
  devanagari: रहस्यातिरहस्यकम् । तुरीयं कवचं दिव्यं सर्वमन्त्रमयं शुभम् ॥ ११॥ पूजान्ते तु जपात्पूर्वं
    कवचं समुदीरयेत् । ॥ विनियोगः ॥ अस्य श्रीकवचस्यास्य ऋषिरानन्दभैरवः ॥ १२॥ श्रीविद्या देवताश्छन्दो गायत्रीरुचिवृत्तिकम्
    । रमाबीजं पराशक्तिः वाग्भवं कीलकं स्मृतम् ॥ १३॥ मम सर्वार्थसिद्धयर्थे जपे तु विनियोगतः । ॥ करन्यासः
    ॥ अङ्गुष्ठाग्रे वाग्भवं च हृल्लेखां तर्जनी न्यसेत् ॥ १४॥ लक्ष्मीबीजं मध्यमायामङ्गिराऽनामिका तथा ।
    पराबीजं कनिष्ठायां लक्ष्मीं करतले न्यसेत् ॥ १५॥ ॥ षडङ्गन्यासः ॥ हृदये वाग्भवं न्यस्यात् परां शिरसि
    च न्यसेत् । लक्ष्मीबीजं शिखायां च कवचे वाग्भवं न्यसेत् ॥ १६॥ हृल्लेखां नेत्रयोर्न्यस्यादस्त्रं तु
    कमलां न्यसेत् । ॥ दिग्बन्धनम् ॥ भूर्भुवः स्वरिति मनुना दिग्बन्धनमाचरेत् ॥ १७॥ ध्यानं तस्य प्रवक्ष्यामि
    धर्मकामार्थमोक्षदम् । न्यासध्यानादिकं सर्वं कृत्वा तु कवचं पठेत् ॥ १८॥ ॥ ध्यानम् ॥ क्षीरसागरमध्यस्थे
    रत्नद्वीपे मनोहरे । रत्नसिंहासने दिव्ये तत्र देवीं विचिन्तयेत् ॥ १९॥ कोटिसूर्यप्रतीकाशां चन्द्रकोटिनिभाननाम्
    । दाडिमीपुष्पसङ्काशां कुङ्कुमोदरसन्निभाम् ॥ २०॥ जपाकुसुमसङ्काशां त्रिनेत्रां च चतुर्भुजाम् । पाशाङ्कुशधरां
    रम्यामिक्षुचापशरान्विताम् ॥ २१॥ कर्पूरशकलोन्मिश्रताम्बूलपूरिताननाम् । सर्वश
