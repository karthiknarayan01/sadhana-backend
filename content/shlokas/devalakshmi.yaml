id: devalakshmi
category: stotram
name:
  english: devalakshmi
  devanagari: देवलक्ष्मि
content:
  english: rimge ca sumdari || padmavati padmavane malati malativane | kumdadamti kumdavane sushila ketakivane
    || kadambamala tvam devi kadambakanane'pi ca | rajalakshmi rajagehe grihalakshmigrihe grihe || ityuktva
    devatah sarva munayo manavastatha | rurudurnamravadanah shushkakamthoshtha talukah || iti lakshmistavam
    punyam sarvadevaih kritam shubham | yah pathetpratarutthaya sa vai sarvai labhed dhruvam || abharyo
    labhate bharyam vinitam susutam satim | sushilam sumdarim ramyamatisupriyavadinim || putrapautravatim
    shuddham kulajam komalam varam | aputro labhate putram vaishnavam cirajivinam | paramaishvaryayuktam
    ca vidyavamtam yashasvinam | bhrashtarajyo labhedrajyam bhrashtashrirlabhate shriyam || hatabamdhurlabhedbamdhum
    dhanabhrashto dhanam labhet | kirtihino labhetkirtim pratishtham ca labhed dhruvam || sarvamamgaladam
    stotram shokasamtapanashanam | harshanamdakaram shashvaddharma mokshasuhritpradam || || iti shridevakrita
    lakshmistotram sampurnam ||
  devanagari: ृंगे च सुंदरी ॥ पद्मावती पद्मवने मालती मालतीवने । कुंददंती कुंदवने सुशीला केतकीवने ॥ कदंबमाला
    त्वं देवी कदंबकाननेऽपि च । राजलक्ष्मी राजगेहे गृहलक्ष्मीगृहे गृहे ॥ इत्युक्त्वा देवताः सर्वा मुनयो
    मनवस्तथा । रूरूदुर्नम्रवदनाः शुष्ककंठोष्ठ तालुकाः ॥ इति लक्ष्मीस्तवं पुण्यं सर्वदेवैः कृतं शुभम् ।
    यः पठेत्प्रातरूत्थाय स वै सर्वै लभेद् ध्रुवम् ॥ अभार्यो लभते भार्यां विनीतां सुसुतां सतीम् । सुशीलां
    सुंदरीं रम्यामतिसुप्रियवादिनीम् ॥ पुत्रपौत्रवतीं शुद्धां कुलजां कोमलां वराम् । अपुत्रो लभते पुत्रं
    वैष्णवं चिरजीविनम् । परमैश्वर्ययुक्तं च विद्यावंतं यशस्विनम् । भ्रष्टराज्यो लभेद्राज्यं भ्रष्टश्रीर्लभते
    श्रियम् ॥ हतबंधुर्लभेद्बंधुं धनभ्रष्टो धनं लभेत् । कीर्तिहीनो लभेत्कीर्तिं प्रतिष्ठां च लभेद् ध्रुवम्
    ॥ सर्वमंगलदं स्तोत्रं शोकसंतापनाशनम् । हर्षानंदकरं शश्वद्धर्म मोक्षसुहृत्प्रदम् ॥ ॥ इति श्रीदेवकृत
    लक्ष्मीस्तोत्रं सम्पूर्णम् ॥
meaning: {}
