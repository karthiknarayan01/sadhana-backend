id: pindopanishat
category: upanishad
name:
  english: pindopanishat
  devanagari: पिण्डोपनिषत्
content:
  english: pindopanishat om devata rishayah sarve brahmanamidamabruvan | mritasya diyate pindam katham
    grihnantyacetasah || bhinne pancatmake dehe gate pancasu pancadha | hamsastvastva gato deham kasmin
    sthane vyavasthitah || tryaham vasati toyeshu tryaham vasati cagnishu | tryahamakashago bhutva dinamekantu
    vayugah || prathamena tu pindena kalanam tasya sambhavah | dvitiyena tu pindena masatvakcchonitodbhavah
    || tritiyena tu pindena matistasyabhijayate | caturthena tu pindena asthi majja prajayate || pancamena
    tu pindena hastangulyah shiro mukham | shashthena kritapindena hritkantham talu jayate || saptamena
    tu pindena dirghamayuh prajayate | ashtamena tu pindena vacam pushyati viryavan || navamena tu pindena
    sarvendriyasamahritih | dashamena tu pindena bhavanam plavanam tatha | pinde pinde sharirasya pindadanena
    sambhavah || iti pindopanishat samapta
  devanagari: पिण्डोपनिषत् ॐ देवता ऋषयः सर्वे ब्रह्माणमिदमब्रुवन् । मृतस्य दीयते पिण्डं कथं गृह्णन्त्यचेतसः
    ।। भिन्ने पञ्चात्मके देहे गते पञ्चसु पञ्चधा । हंसस्त्वस्त्वा गतो देहं कस्मिन् स्थाने व्यवस्थितः ।।
    त्र्यहं वसति तोयेषु त्र्यहं वसति चाग्निषु । त्र्यहमाकाशगो भूत्वा दिनमेकन्तु वायुगः ।। प्रथमेन तु पिण्डेन
    कलानां तस्य सम्भवः । द्वितीयेन तु पिण्डेन मासत्वक्च्छोणितोद्भवः ।। तृतीयेन तु पिण्डेन मतिस्तस्याभिजायते
    । चतुर्थेन तु पिण्डेन अस्थि मज्जा प्रजायते ।। पञ्चमेन तु पिण्डेन हस्ताङ्गुल्यः शिरो मुखम् । षष्ठेन
    कृतपिण्डेन हृत्कण्ठं तालु जायते ।। सप्तमेन तु पिण्डेन दीर्घमायुः प्रजायते । अष्टमेन तु पिण्डेन वाचं
    पुष्यति वीर्यवान् ।। नवमेन तु पिण्डेन सर्वेन्द्रियसमाहृतिः । दशमेन तु पिण्डेन भावनं प्लावनं तथा ।
    पिण्डे पिण्डे शरीरस्य पिण्डदानेन सम्भवः ।। इति पिण्डोपनिषत् समाप्ता
