    tejobindu 3|12 sarvadhishthanarupo'smi sarvada cidghano'smyaham || 90|| tejobindu 3|12 cittavrittivihino'ham
    cidatmaikaraso'smyaham || 91||tejobindu 3|14 aham brahmaiva sarvam syadaham caitanyameva hi || 92||
    tejobindu 3|16 ahamevahamevasmi bhumakarasvarupavan || 93|| tejobindu 3|16 ahameva mahanatma hyahameva
    paratparah || 94|| tejobindu 3|17 ahamanyavadabhami hyahameva shariravat || 95|| tejobindu 3|17 aham
    shishyavadabhami hyaham lokatrayashrayah || 96|| tejobindu 3|18 aham kalatrayatito hyaham vedairupasitah
    || 97|| tejobindu 3|18 aham shastrena nirnita aham citte vyavasthitah || 98|| tejobindu 3|19 anandaghana
    evahamaham brahmasmi kevalam || 99|| tejobindu 3|26 atmanatmani tripto'smi hyarupo hyahamavyayah ||
    100|| tejobindu 3|28 akashadapi sukshmo'hamadyantabhavavanaham || 101|| tejobindu 3|29 sattamatrasvarupo'ham
    shuddhamokshasvarupavan || 102|| tejobindu 3|30 satyanandasvarupo'ham jnananandaghano'smyaham || 103||
    tejobindu 3|31 namarupavimukto'hamahamanandavigrahah || 104|| tejobindu 3|36 adicaitanyamatro'hamakhandaikaraso'smyaham
    || 105|| tejobindu 3|37 sarvatra purnarupo'ham paramritaraso'smyaham || 106|| tejobindu 3|38 ekamevadvitiyam
    sadbrahmaivaham na samshayah || 107|| tejobindu 3|39 ahameva param brahma hyahameva gurorguruh ||
    108|| tejobindu 6|44 sarvajnanaprakasho'smi mukhyavijnanavigrahah || 109|| tejobindu 6|68 turyaturyaprakasho'smi
    turyaturyadivarjitah || 110|| tejobindu 6|69 drishisvarupam gaganopamam param sakridvibhatam tvajamekamaksharam
