id: shripadasaptati
category: stotram
name:
  english: shripadasaptati
  devanagari: श्रीपादसप्तति
content:
  english: rlakshatvam gamitah prasunadhanusho vismapanam taddvayam || 53|| brahmam maghavanam ca vahanamaho
    mandairgatairninditam dhavalyena nakhatvisham vihasito vaho'pi maheshvarah | ittham vahanavairitam
    bhajati te padastato manmahe katyayanyamuna nyaghani mahishah karttantavahabhramat || 54|| simantaprakare
    surendrasudrisham sindurarekhatmana manikyadyutisanjnayaiva makutikotishu daityadruham | shambhormurdhni
    jataghatarunarucivyajena padaprabhai
  devanagari: र्लक्षत्वं गमितः प्रसूनधनुषो विस्मापनं तद्द्वयम् ॥ ५३॥ ब्राह्मं माघवनं च वाहनमहो मन्दैर्गतैर्निन्दितं
    धावल्येन नखत्विषां विहसितो वाहोऽपि माहेश्वरः । इत्थं वाहनवैरितां भजति ते पादस्ततो मन्महे कात्यायन्यमुना
    न्यघानि महिषः कार्त्तान्तवाहभ्रमात् ॥ ५४॥ सीमन्तप्रकरे सुरेन्द्रसुदृशां सिन्दूररेखात्मना माणिक्यद्युतिसञ्ज्ञयैव
    मकुटीकोटीषु दैत्यद्रुहाम् । शम्भोर्मूर्ध्नि जटाघटारुणरुचिव्याजेन पादप्रभै
meaning: {}
