id: sangramavijayavidya
category: kavacha
name:
  english: sangramavijayavidya
  devanagari: सन्ग्रामविजयविद्या
content:
  english: om vicce hum phat svaha | padamala jayakhyeyam sarvakarmaprasadhika | sarvada homajapyadyaih
    pathadyaishca rane jayah || 3|| ashtavimshabhuja dhyeya asikhetakashatkarau | gadadandayutau canyau
    sharacapadharau parau || 4|| mushtimudgarayukyau ca shankhakhadgayutau parau | dhvajavajratharo canya
    sacakraparashu parau || 5|| damarudarpanadhyau ca shaktikuntadharau parau | halena musalena''dhyau
    pashatomarasamyutau || 6|| dhakkapanava samyuktavabhayau mushtikanvitau | tarjayanti ca mahisham ghatani
    homato'rijit | trimadhvaktatilairhomo na deya yasya kasyacit || 7|| iti sangramavijayavidyavarnanam
    sampurnam ||
  devanagari: ॐ विच्चे हुं फट् स्वाहा । पदमाला जयाख्येयं सर्वकर्मप्रसाधिका । सर्वदा होमजप्याद्यैः पाठाद्यैश्च
    रणे जयः ॥ ३॥ अष्टाविंशभुजा ध्येया असिखेटकषट्करौ । गदादण्डयुतौ चान्यौ शरचापधरौ परौ ॥ ४॥ मुष्टिमुद्गरयुक्यौ
    च शङ्खखड्गयुतौ परौ । ध्वजवज्रथरो चान्य सचक्रपरशु परौ ॥ ५॥ डमरुदर्पणाढ्यौ च शक्तिकुन्तधरौ परौ । हलेन
    मुसलेनाऽऽढ्यौ पाशतोमरसंयुतौ ॥ ६॥ ढक्कापणव संयुक्तावभयौ मुष्टिकान्वितौ । तर्जयन्ती च महिषं घातनी होमतोऽरिजित्
    । त्रिमध्वाक्ततिलैर्होमो न देया यस्य कस्यचित् ॥ ७॥ इति सङ्ग्रामविजयविद्यावर्णनं सम्पूर्णम् ॥
