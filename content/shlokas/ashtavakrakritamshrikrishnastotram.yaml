id: ashtavakrakritamshrikrishnastotram
category: stotram
name:
  english: ashtavakrakritamshrikrishnastotram
  devanagari: अष्टावक्रकृतंश्रीकृष्णस्तोत्रम्
content:
  english: ashtavakrakritam shrikrishnastotram ashtavakra uvaca | gunatita gunadhara gunabija gunatmaka
    | gunisha guninam bija gunayana namo'stu te || 40|| siddhisvarupa siddhyesha siddhibija paratpara
    | siddhisiddhigunadhisha siddhanam gurave namah || 41|| he vedabija vedajna vedinvedavidam vara |
    vedajnatadyarupesha vedajnesha namo'stu te || 42|| brahmanantesha sheshendra dharmadinamadhishvara
    | sarva sarvesha sharvesha bijarupa namo'stu te || 43|| prakrite prakrita prajna prakritisha paratpara
    | samsaravriksha tadbija phalarupa namo'stu te || 44|| srishtisthityantabijesha srishtisthityantakarana
    | mahavirattarorbija radhikesha namo'stu te || 45|| aho yasya trayah skandha brahmavishnumaheshvarah
    | shakhaprashakha vedadyastapamsi kusumani ca || 46|| samsaraviphala eva prakrityankurameva ca | tadadhara
    niradhara sarvadhara namo'stu te || 47|| tejorupa nirakara pratyakshanuhameva ca | sarvakaratipratyaksha
    svecchamaya namo'stu te || 48|| ityuktva sa munishreshtho nipatya caranambuje | pranamstatyaja yogena
    tayoh pratyaksha eva ca || 49|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve konatrimshadhyayantargatam
    ashtavakrakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: अष्टावक्रकृतं श्रीकृष्णस्तोत्रम् अष्टावक्र उवाच । गुणातीत गुणाधार गुणबीज गुणात्मक । गुणीश
    गुणिनां बीज गुणायन नमोऽस्तु ते ॥ ४०॥ सिद्धिस्वरूप सिद्ध्येश सिद्धिबीज परात्पर । सिद्धिसिद्धिगुणाधीश
    सिद्धानां गुरवे नमः ॥ ४१॥ हे वेदबीज वेदज्ञ वेदिन्वेदविदां वर । वेदाज्ञाताद्यरूपेश वेदाज्ञेश नमोऽस्तु
    ते ॥ ४२॥ ब्रह्मानन्तेश शेषेन्द्र धर्मादीनामधीश्वर । सर्व सर्वेश शर्वेश बीजरूप नमोऽस्तु ते ॥ ४३॥ प्रकृते
    प्राकृत प्रज्ञ प्रकृतीश परात्पर । संसारवृक्ष तद्बीज फलरूप नमोऽस्तु ते ॥ ४४॥ सृष्टिस्थित्यन्तबीजेश
    सृष्टिस्थित्यन्तकारण । महाविराट्तरोर्बीज राधिकेश नमोऽस्तु ते ॥ ४५॥ अहो यस्य त्रयः स्कन्धा ब्रह्मविष्णुमहेश्वराः
    । शाखाप्रशाखा वेदाद्यास्तपांसि कुसुमानि च ॥ ४६॥ संसारविफला एव प्रकृत्यङ्कुरमेव च । तदाधार निराधार
    सर्वाधार नमोऽस्तु ते ॥ ४७॥ तेजोरूप निराकार प्रत्यक्षानूहमेव च । सर्वाकारातिप्रत्यक्ष स्वेच्छामय नमोऽस्तु
    ते ॥ ४८॥ इत्युक्त्वा स मुनिश्रेष्ठो निपत्य चरणाम्बुजे । प्राणांस्तत्याज योगेन तयोः प्रत्यक्ष एव च
    ॥ ४९॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे कोनत्रिंशाध्यायान्तर्गतं अष्टावक्रकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
