id: varahastotram
category: stotram
name:
  english: varahastotram
  devanagari: वराहस्तोत्रम्
content:
  english: varahastotram athava shriyajnavarahastavah shri ganeshaya namah || rishaya ucuh || jitam jitam
    te'jita yajnabhavana trayim tanum svam paridhunvate namah | yadromagarteshu nililyuradhvarastasmai
    namah karanasukaraya te || 1|| rupam tavaitannanu dushkritatmanam durdarshanam deva yadadhvaratmakam
    | chandamsi yasya tvaci barhiromasvajyam drishi tvanghrishu caturhotram || 2|| sruktunda asitsruva
    isha nasayoridodare camasah karnarandhre | prashitramasye grasane grahastu te yaccarvanam te bhagavannagnihotram
    || 3|| dikshanujanmopasadah shirodharam tvam prayaniyodayaniyadamshtrah | jihva pravargyastava shirshakam
    kratoh sabhyavasathyam citayo'savo hi te || 4|| somastu retah savananyavasthitih samsthavibhedastava
    deva dhatavah | satrani sarvani sharirasandhistvam sarvayajnakraturishtibandhanah || 5|| namo namaste'khilayantradevatadravyaya
    sarvakratave kriyatmane | vairagyabhaktyatmajayanubhavitajnanaya vidyagurave namo namah || 6|| damshtragrakotya
    bhagavamstvaya dhrita virajate bhudhara bhuh sabhudhara | yatha vanannihsarato data dhrita matangajendrasya
    sapatrapadmini || 7|| trayimayam rupamidam ca saukaram bhumandalenatha data dhritena te | cakasti
    sha
  devanagari: वराहस्तोत्रम् अथवा श्रीयज्ञवराहस्तवः श्री गणेशाय नमः ॥ ऋषय ऊचुः ॥ जितं जितं तेऽजित यज्ञभावन
    त्रयीं तनुं स्वां परिधुन्वते नमः । यद्रोमगर्तेषु निलिल्युरध्वरास्तस्मै नमः कारणसूकराय ते ॥ १॥ रूपं
    तवैतन्ननु दुष्कृतात्मनां दुर्दर्शनं देव यदध्वरात्मकम् । छन्दांसि यस्य त्वचि बर्हिरोमस्वाज्यं दृशि
    त्वङ्घ्रिषु चातुर्होत्रम् ॥ २॥ स्रुक्तुण्ड आसीत्स्रुव ईश नासयोरिडोदरे चमसाः कर्णरन्ध्रे । प्राशित्रमास्ये
    ग्रसने ग्रहास्तु ते यच्चर्वणं ते भगवन्नग्निहोत्रम् ॥ ३॥ दीक्षानुजन्मोपसदः शिरोधरं त्वं प्रायणीयोदयनीयदंष्ट्रः
    । जिह्वा प्रवर्ग्यस्तव शीर्षकं क्रतोः सभ्यावसथ्यं चितयोऽसवो हि ते ॥ ४॥ सोमस्तु रेतः सवनान्यवस्थितिः
    संस्थाविभेदास्तव देव धातवः । सत्राणि सर्वाणि शरीरसन्धिस्त्वं सर्वयज्ञक्रतुरिष्टिबन्धनः ॥ ५॥ नमो नमस्तेऽखिलयन्त्रदेवताद्रव्याय
    सर्वक्रतवे क्रियात्मने । वैराग्यभक्त्यात्मजयानुभावितज्ञानाय विद्यागुरवे नमो नमः ॥ ६॥ दंष्ट्राग्रकोट्या
    भगवंस्त्वया धृता विराजते भूधर भूः सभूधरा । यथा वनान्निःसरतो दता धृता मतङ्गजेन्द्रस्य सपत्रपद्मिनी
    ॥ ७॥ त्रयीमयं रूपमिदं च सौकरं भूमण्डलेनाथ दता धृतेन ते । चकास्ति श
