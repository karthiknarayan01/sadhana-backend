    म्मा॒ता पृ॑थि॒वी हिग्ं॑सी॒दिय॑द॒स्यायु॑ र्मे धे॒ह्यूर्ग॒स्यूर्ज॑ म्मे धेहि॒ युङ्ङ॑सि॒ वर्चो॑ ऽसि॒
    वर्चो॒ मयि॑ धेह्य॒ग्नये॑ गृ॒हप॑तये॒ स्वाहा॒ सोमा॑य॒ वन॒स्पत॑ये॒ स्वाहेन्द्र॑स्य॒ बला॑य॒ स्वाहा॑ म॒रुता॒मोज॑से॒
    स्वाहा॑ ह॒ग्ं॒स सद्धोता॑ वेदि॒षदति॑थि द्व्यो॑म॒सद॒ब्जा गो॒जा ऋ॑त॒जा अ॑द्रि॒जा ऋ॒त क्ष॒त्रस्य॒ नाभि॑रसि
    क्ष॒त्रस्य॒ योनि॑रसि स्यो॒नामा सी॑द सु॒षदा॒मा सी॑द॒ मा त्वा॑ हिग्ंसी॒न्मा मा॑ हिग्ंसी॒न्नि ष॑साद धृ॒तव्र॑तो॒
    वरु॑णः प॒स्त्या ऽसि॑ स॒त्यस॑वो॒ ब्रह्मा ऽसि सु॒शेवो॒ ब्रह्मा ऽसि स॒त्यध॒र्मेन्द्र॑स्य॒ वज्रो॑ ऽसि॒
    वार्त्र॑घ्न॒स्तेन॑ मे रद्ध्य॒ दिशो॒ न्नप्त्रे॒ स्वाहो॒र्जो नप्त्रे॒ स्वाहा॒ ऽग्नये॑ गृ॒हप॑तये॒ स्वाहा
    आ॒ग्ने॒यम॒ष्टाक॑पाल॒ न्निर्व॑पति॒ हिर॑ण्य॒ वँ॑थ्सत॒री दक्षि॑णा सावि॒त्र मुपद्ध्व॒स्तो दक्षि॑णा पौ॒ष्ण
    श्या॒मो दक्षि॑णा बार् ञ्च॒रुग्ं शि॑तिपृ॒ष्ठो दक्षि॑णै॒न्द्र मृष॒भो दक्षि॑णा वारु॒ण म्म॒हानि॑रष्टो॒
    दक्षि॑णा सौ॒म्य र्दक्षि॑णा त्वा॒ष्ट्रम॒ष्टाक॑पालग्ं शु॒ण्ठो दक्षि॑णा वैष्ण॒व आ॒ग्ने॒यग्ं हिर॑ण्यग्ं
    सारस्व॒तं ङ्क्रीणन्ति पुण्डरिस्र॒जा म्प्र य॑च्छति द॒शभि॑ ङ्क्रीणाति दश॒पेयो॑ भवति श॒त ह्म॒णाः पि॑बन्ति
    सप्तद॒शग्ग् म्भ॑वति प्राका॒शाव॑द्ध्व॒र्यवे॑ ददाति॒ स्रज॑ मुद्गा॒त्रे रु॒क्मग्ं होत्रे म्प्रस्तोतृप्रतिह॒र्तृभ्या॒
    ह्मणाच्छ॒ग्ं॒सिने॒ वास॑सी नेष्टापो॒तृभ्या॒ग्॒ स्थूरि॑ यवाचि॒त म॒ग्नीधे॑ भार्ग॒वो होता॑ भवति श्राय॒न्तीय॑
    म्भ॑वति वारव॒न्तीय॑ मग्निष्टोमसा॒मग्ं सा॑रस्व॒ती न्निर्व॑पति॒ हिर॑ण्य॒ मृष॒भो दक्षि॑णा वैश्वदे॒व म्पि॒शङ्गी॑
    पष्ठौ॒ही दक्षि॑णा मैत्रावरु॒णी ञ्च॒रुग्ं शि॑तिपृ॒ष्ठो दक्षि॑णा ङ्ग॒र्भिणी॒मा ल॑भते मारु॒ती म्पू॒ष्णे
    पु॑रो॒डाश॒ न्निर्व॑पति॒ सर॑स्वते सत्य॒वाचे॑ च॒रुग्ं स॑वि॒त्रे स॒त्यप्र॑सवाय पुरो॒डाश॒ न्तिसृध॒न्वग्ं
    शु॑ष्कदृ॒ति अ॒ग्ने॒यग्ं हिर॑ण्यमै॒द्रमृ॑ष॒भो वै न्त्वा॒ष्ट्रम॒ष्टाक॑पालं न्दक्षि॑णो रथवाहनवा॒हो दक्षि॑णा
    सारस्व॒त ञ्च॒रुमुत्त॑रो रथवाहनवा॒हो दक्षि॑णा ॥ म॒मृते॑न सृ॒जामि॒ सग्ं सोमे॑न॒ सोमो म्पच्यस्व॒ सर॑स्वत्यै
    पच्य॒स्वेन्द्रा॑य सु॒त्रांणे॑ पच्यस्व पु॒नातु॑ ते परि॒स्रुत॒ग्ं॒ सोम॒ग्ं॒ सूर्य॑स्य दुहि॒ता । वारे॑ण॒
    शश्व॑ता॒ तना ॥ वा॒युः पू॒तः प॒वित्रे॑ण प्र॒त्यं सोमो॒ अति॑द्रुतः । इन्द्र॑स्य॒ युज्य॒ द्यथा॒ दान्त्य॑नुपू॒र्वं
    विँ॒यूय॑ । इ॒हेहै॑षा ङ्कृणुत॒ भोज॑नानि॒ ये ब॒र्॒हिषो॒ नमो॑वृक्ति॒ न्न ज॒ग्मुः ॥ आ॒श्वि॒न न्धू॒म्रमा
    ल॑भते सारस्व॒त म्मे॒षमै॒न्द्रमृ॑ष॒भ न्निर्व॑पति सावि॒त्र न्दश॑कपाल॒ग्ं॒ सोम॑प्रतीकाः पितरस्तृप्णुत॒
    वड॑बा॒ दक्षि॑णा ॥ अग्ना॑विष्णू॒ महि॒ त ङ्घृ॒तस्य॒ गुह्या॑नि॒ नाम॑ । दमे॑दमे स॒प्त रत्ना॒ दधा॑ना॒ प्रति॑
    वा ञ्जि॒ह्वा घृ॒तमा च॑रण्येत् ॥ अग्ना॑विष्णू॒ महि॒ धाम॑ प्रि॒यं वीँ॒थो घृ॒तस्य॒ गुह्या॑ जुषा॒णा ।
    दमे॑दमे सुष्टु॒ती र्वा॑वृधा॒ना प्रति॑ वा ञ्जि॒ह्वा घृ॒तमुच्च॑रण्येत् ॥ प्र णो॑ दे॒वी सर॑स्वती॒ वाजे॑भि
    र्वा॒जिनी॑वती । धी॒ना म॑वि॒त्र्य॑वतु । आ नो॑ दि॒वो बृ॑ह॒तः पर्व॑ता॒दा सर॑स्वती यज॒ता ग॑न्तु य॒ज्ञम्
    । हव॑ न्दे॒वी जु॑जुषा॒णा घृ॒ताची॑ श॒ग्मा न्नो॒ वाच॑मुश॒ती शृ॑णोतु ॥ बृह॑स्पते जु॒षस्व॑ नो ह॒व्यानि॑
    विश्वदेव्य । रास्व॒ रत्ना॑नि दा॒शुषे ॥ ए॒वा पि॒त्रे वि॒श्वदे॑वाय॒ वृष्णे॑ य॒ज्ञै र्वि॑धेम॒ नम॑सा ह॒विर्भिः॑
