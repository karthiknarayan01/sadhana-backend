id: kumarikavacam-rudrayamalottaratantrantargatam
category: kavacha
name:
  english: kumarikavacam (rudrayamalottaratantrantargatam)
  devanagari: कुमारीकवचम् (रुद्रयामलोत्तरतन्त्रान्तर्गतम्)
content:
  english: pranavo me shirah patu maya sandayika sati | lalatodrdhvam mahamaya patu me shrisarasvati ||
    6|| kamaksha vatukeshani trimuttirbhalameva me | camunda bijarupa ca vadanam kalika mama || 7|| patu
    mam suryaga nityam tatha netradvayam mama | karnayugmam kamabijam svarupomatapasvini || 8|| rasanagram
    tatha patu vagdevi malini mama | damarastha kamarupa dantagram kunjika mama || 9|| devi pranavarupa'sau
    patu nityam shiva mama | oshthadharam shaktibijatmika svahasvarupini || 10|| payanme kalasandashta
    pancavayusvarupini | galadesham maharaudri patu me caparajita || 11|| kshaum bijam me tatha kantham
    rudrani svahayanvita | hridayam bhairavi vidya patu shodasha susvara || 12|| dvau bahu patu sarvatra
    mahalakshmih pradhanika | sarvamantrasvarupam me codaram pithanayika || 13|| parshvayugmam tatha patu
    kumari vagbhavatmika | kaishori katidesham me mayabijasvarupini || 14|| janghayugmam jayanti me yogini
    kullukayuta | sarvangamambikadevi patu mantrarthagamini || 15|| keshagram kamaladevi nasagram vindhyavasini
    | cibukam candika devi kumari patu me sada || 16|| hridayam lalita devi prishtham parvatavasini |
    trishaktih shodashi devi lingam guhyam sadavatu || 17|| shmashane cambika devi gangagarbhe ca vaishnavi
    | shunyagare pancamudra mantrayantraprakashini || 18|| catushpathe tatha patu mameva vajradharini
    | shavasanagata canda mundamalavibhushita || 19|| patu mane kalinge ca vaikhari shaktirupini | vane
    patu mahabala maharanye ranapriya || 20|| mahajale tadage ca shatrumadhye sarasvati | mahakashapathe
    prithvi patu mam shitala sada || 21|| ranamadhye rajalakshmih kumari kulakamini | arddhanarishvara
    patu mama padatalam mahi || 22|| navalakshamahavidya kumari rupadharini | kotisuryapratikasha candrakotisushitala
    || 23|| patu mam varada vani vatukeshvarakamini iti te kathitam natha kavacam paramadbhutam || 24||
    kumaryah kuladayinyah pancatattvarthaparaga yo japet pancatattvena stotrena kavacena ca || 25|| akashagamini
    siddhirbhavettasya na samshayah || 26|| vajradehi bhavet kshipram kavacasya prapathatah | sarvasiddhishvaro
    yogi jnani bhavati yah pathet || 27|| vivade vyavahare ca sangrame kulamandale | mahapathe shmashane
    ca yogasiddho bhavet sa ca || 28|| pathitva jayamapnoti satyam satyam kuleshvara vashikaranakavacam
    sarvatra jayadam shubham || 29|| punyavrati pathennityam yatishrimanbhaved dhruvam siddhavidya kumari
    ca dadati siddhimuttamam || 30|| pathedyah sha
  devanagari: प्रणवो मे शिरः पातु माया सन्दायिका सती । ललाटोद्र्ध्वं महामाया पातु मे श्रीसरस्वती ॥ ६॥
    कामाक्षा वटुकेशानी त्रिमूत्तिर्भालमेव मे । चामुण्डा बीजरूपा च वदनं कालिका मम ॥ ७॥ पातु मां सूर्यगा
    नित्यं तथा नेत्रद्वयं मम । कर्णयुग्मं कामबीजं स्वरूपोमातपस्विनी ॥ ८॥ रसनाग्रं तथा पातु वाग्देवी मालिनी
    मम । डामरस्था कामरूपा दन्ताग्रं कुञ्जिका मम ॥ ९॥ देवी प्रणवरूपाऽसौ पातु नित्यं शिवा मम । ओष्ठाधरं
    शक्तिबीजात्मिका स्वाहास्वरूपिणी ॥ १०॥ पायान्मे कालसन्दष्टा पञ्चवायुस्वरूपिणी । गलदेशं महारौद्री पातु
    मे चापराजिता ॥ ११॥ क्षौं बीजं मे तथा कण्ठं रुद्राणी स्वाहयान्विता । हृदयं भैरवी विद्या पातु षोडश सुस्वरा
    ॥ १२॥ द्वौ बाहू पातु सर्वत्र महालक्ष्मीः प्रधानिका । सर्वमन्त्रस्वरूपं मे चोदरं पीठनायिका ॥ १३॥ पार्श्वयुग्मं
    तथा पातु कुमारी वाग्भवात्मिका । कैशोरी कटिदेशं मे मायाबीजस्वरूपिणी ॥ १४॥ जङ्घायुग्मं जयन्ती मे योगिनी
    कुल्लुकायुता । सर्वाङ्गमम्बिकादेवी पातु मन्त्रार्थगामिनी ॥ १५॥ केशाग्रं कमलादेवी नासाग्रं विन्ध्यवासिनी
    । चिबुकं चण्डिका देवी कुमारी पातु मे सदा ॥ १६॥ हृदयं ललिता देवी पृष्ठं पर्वतवासिनी । त्रिशक्तिः षोडशी
    देवी लिङ्गं गुह्यं सदावतु ॥ १७॥ श्मशाने चाम्बिका देवी गङ्गागर्भे च वैष्णवी । शून्यागारे पञ्चमुद्रा
    मन्त्रयन्त्रप्रकाशिनी ॥ १८॥ चतुष्पथे तथा पातु मामेव वज्रधारिणी । शवासनगता चण्डा मुण्डमालाविभूषिता
    ॥ १९॥ पातु माने कलिङ्गे च वैखरी शक्तिरूपिणी । वने पातु महाबाला महारण्ये रणप्रिया ॥ २०॥ महाजले तडागे
    च शत्रुमध्ये सरस्वती । महाकाशपथे पृथ्वी पातु मां शीतला सदा ॥ २१॥ रणमध्ये राजलक्ष्मीः कुमारी कुलकामिनी
    । अर्द्धनारीश्वरा पातु मम पादतलं मही ॥ २२॥ नवलक्षमहाविद्या कुमारी रूपधारिणी । कोटिसूर्यप्रतीकाशा चन्द्रकोटिसुशीतला
    ॥ २३॥ पातु मां वरदा वाणी वटुकेश्वरकामिनी इति ते कथितं नाथ कवचं परमाद्भुतम् ॥ २४॥ कुमार्याः कुलदायिन्याः
    पञ्चतत्त्वार्थपारग यो जपेत् पञ्चतत्त्वेन स्तोत्रेण कवचेन च ॥ २५॥ आकाशगामिनी सिद्धिर्भवेत्तस्य न संशयः
    ॥ २६॥ वज्रदेही भवेत् क्षिप्रं कवचस्य प्रपाठतः । सर्वसिद्धीश्वरो योगी ज्ञानी भवति यः पठेत् ॥ २७॥ विवादे
    व्यवहारे च सङ्ग्रामे कुलमण्डले । महापथे श्मशाने च योगसिद्धो भवेत् स च ॥ २८॥ पठित्वा जयमाप्नोति सत्यं
    सत्यं कुलेश्वर वशीकरणकवचं सर्वत्र जयदं शुभम् ॥ २९॥ पुण्यव्रती पठेन्नित्यं यतिश्रीमान्भवेद् ध्रुवम्
    सिद्धविद्या कुमारी च ददाति सिद्धिमुत्तमाम् ॥ ३०॥ पठेद्यः श
