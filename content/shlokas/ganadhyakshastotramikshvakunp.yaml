id: ganadhyakshastotramikshvakunp
category: stotram
name:
  english: ganadhyakshastotramikshvakunP
  devanagari: गणाध्यक्षस्तोत्रमीक्ष्वाकुण्P
content:
  english: shriganadhyakshastotram ikshvakukrita bharadvaja uvaca katham stuto ganadhyakshastena rajna
    mahatmana | yatha tena tapastaptam tanme vada mahamate || 1|| suta uvaca caturthidivase raja snatva
    trishavanam dvija | raktambaradharo bhutva raktagandhanulepanah || 2|| suraktakusumairhridyairvinayakamatharcayat
    | raktacandanatoyena snanapurvam yathavidhi || 3|| vilipya raktagandhena raktapushpaih prapujayat
    | tato'sau dattavan dhupamajyayuktam sacandanam | naivedyam caiva haridram gudakhandaghritaplutam
    || 4|| evam suvidhina pujya vinayakamathastavit | ikshvakuruvaca namaskritya mahadevam stoshye'ham
    tam vinayakam || 5|| mahaganapatim shuramajitam jnanavardhanam | ekadantam dvidantam ca caturdantam
    caturbhujam || 6|| tryaksham trishulahastam ca raktanetram varapradam | ambikeyam shurpakarnam pracandam
    ca vinayakam || 7|| araktam dandinam caiva vahnivaktram hutapriyam | anarcito vighnakarah sarvakaryeshu
    yo nrinam || 8|| tam namami ganadhyaksham bhimamugramumasutam | madamattam virupaksham bhaktivighnanivarakam
    || 9|| suryakotipratikasham bhinnanjanasamaprabham | buddham sunirmalam shantam namasyami vinayakam
    || 10|| namo'stu gajavaktraya gananam pataye namah | merumandararupaya namah kailasavasine || 11||
    virupaya namaste'stu namaste brahmacarine | bhaktastutaya devaya namastubhyam vinayaka || 12|| tvaya
    purana purvesham devanam karyasiddhaye | gajarupam samasthaya trasitah sarvadanavah || 13|| rishinam
    devatanam ca nayakatvam prakashitam | yatastatah surairagre pujyase tvam bhavatmaja || 14|| tvamaradhya
    ganadhyaksham sarvajnam kamarupinam | karyartham raktakusumai raktacandanavaribhih || 15|| raktambaradharo
    bhutva caturthyamarcayejjapet | trikalamekakalam va pujayenniyatashanah || 16|| rajanam rajaputram
    va rajamantrinameva va | rajyam ca sarvavighnesha vasham kuryat sarashtrakam || 17|| avighnam tapaso
    mahyam kuru naumi vinayaka | mayettham samstuto bhaktya pujitashca visheshatah || 18|| yatphalam sarvatirtheshu
    sarvayajneshu yatphalam | tatphalam purnamapnoti stutva devam vinayakam || 19|| vishamam na bhavet
    tasya na ca gacchet parabhavam | na ca vighno bhavet tasya jato jatismaro bhavet || 20|| ya idam pathate
    stotram shadbhirmasairvaram labhet | samvatsarena siddhim ca labhate natra samshayah || 21|| suta
    uvaca evam stutva pura raja ganadhyaksham dvijottama | tapasam veshamasthaya tapashcartum gato vanam
    || 22|| utsrijya vastram nagatvaksadrisham bahumulyakam | kathinam tu tvacam vakshim katyam dhatte
    nripottamah || 23|| tatha ratnani divyani valayani nirasya tu | akshasutramalankaram phalaih padmasya
    shobhanam || 24|| tathottamange mukutam ratnahatakashobhitam | tyaktva jatakalapam tu tapo'rthe vibhriyannripah
    || 25|| iti | narasimhapurana adhyaya 25 shlokasamkhya 72 shrinarasimhapurane ikshvakucarite pancavimsho'dhyayah
    || 25||
  devanagari: श्रीगणाध्यक्षस्तोत्रं ईक्ष्वाकुकृत भरद्वाज उवाच कथं स्तुतो गणाध्यक्षस्तेन राज्ञा महात्मना
    । यथा तेन तपस्तप्तं तन्मे वद महामते ॥ १॥ सूत उवाच चतुर्थीदिवसे राजा स्नात्वा त्रिषवणं द्विज । रक्ताम्बरधरो
    भूत्वा रक्तगन्धानुलेपनः ॥ २॥ सुरक्तकुसुमैर्हृद्यैर्विनायकमथार्चयत् । रक्तचन्दनतोयेन स्नानपूर्वं यथाविधि
    ॥ ३॥ विलिप्य रक्तगन्धेन रक्तपुष्पैः प्रपूजयत् । ततोऽसौ दत्तवान् धूपमाज्ययुक्तं सचन्दनम् । नैवेद्यं
    चैव हारिद्रं गुडखण्डघृतप्लुतम् ॥ ४॥ एवं सुविधिना पूज्य विनायकमथास्तवीत् । इक्ष्वाकुरुवाच नमस्कृत्य
    महादेवं स्तोष्येऽहं तं विनायकम् ॥ ५॥ महागणपतिं शूरमजितं ज्ञानवर्धनम् । एकदन्तं द्विदन्तं च चतुर्दन्तं
    चतुर्भुजम् ॥ ६॥ त्र्यक्षं त्रिशूलहस्तं च रक्तनेत्रं वरप्रदम् । आम्बिकेयं शूर्पकर्णं प्रचण्डं च विनायकम्
    ॥ ७॥ आरक्तं दण्डिनं चैव वह्निवक्त्रं हुतप्रियम् । अनर्चितो विघ्नकरः सर्वकार्येषु यो नृणाम् ॥ ८॥ तं
    नमामि गणाध्यक्षं भीममुग्रमुमासुतम् । मदमत्तं विरूपाक्षं भक्तिविघ्ननिवारकम् ॥ ९॥ सूर्यकोटिप्रतीकाशं
    भिन्नाञ्जनसमप्रभम् । बुद्धं सुनिर्मलं शान्तं नमस्यामि विनायकम् ॥ १०॥ नमोऽस्तु गजवक्त्राय गणानां पतये
    नमः । मेरुमन्दररूपाय नमः कैलासवासिने ॥ ११॥ विरूपाय नमस्तेऽस्तु नमस्ते ब्रह्मचारिणे । भक्तस्तुताय देवाय
    नमस्तुभ्यं विनायक ॥ १२॥ त्वया पुराण पूर्वेषां देवानां कार्यसिद्धये । गजरूपं समास्थाय त्रासिताः सर्वदानवाः
    ॥ १३॥ ऋषीणां देवतानां च नायकत्वं प्रकाशितम् । यतस्ततः सुरैरग्रे पूज्यसे त्वं भवात्मज ॥ १४॥ त्वामाराध्य
    गणाध्यक्षं सर्वज्ञं कामरूपिणम् । कार्यार्थं रक्तकुसुमै रक्तचन्दनवारिभिः ॥ १५॥ रक्ताम्बरधरो भूत्वा
    चतुर्थ्यामर्चयेज्जपेत् । त्रिकालमेककालं वा पूजयेन्नियताशनः ॥ १६॥ राजानं राजपुत्रं वा राजमन्त्रिणमेव
    वा । राज्यं च सर्वविघ्नेश वशं कुर्यात् सराष्ट्रकम् ॥ १७॥ अविघ्नं तपसो मह्यं कुरु नौमि विनायक । मयेत्थं
    संस्तुतो भक्त्या पूजितश्च विशेषतः ॥ १८॥ यत्फलं सर्वतीर्थेषु सर्वयज्ञेषु यत्फलम् । तत्फलं पूर्णमाप्नोति
    स्तुत्वा देवं विनायकम् ॥ १९॥ विषमं न भवेत् तस्य न च गच्छेत् पराभवम् । न च विघ्नो भवेत् तस्य जातो जातिस्मरो
    भवेत् ॥ २०॥ य इदं पठते स्तोत्रं षड्भिर्मासैर्वरं लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥ २१॥
    सूत उवाच एवं स्तुत्वा पुरा राजा गणाध्यक्षं द्विजोत्तम । तापसं वेषमास्थाय तपश्चर्तुं गतो वनम् ॥ २२॥
    उत्सृज्य वस्त्रं नागत्वक्सदृशं बहुमूल्यकम् । कठिनां तु त्वचं वाक्षीं कट्यां धत्ते नृपोत्तमः ॥ २३॥
    तथा रत्नानि दिव्यानि वलयानि निरस्य तु । अक्षसूत्रमलङ्कारं फलैः पद्मस्य शोभनम् ॥ २४॥ तथोत्तमाङ्गे मुकुटं
    रत्नहाटकशोभितम् । त्यक्त्वा जटाकलापं तु तपोऽर्थे विभृयान्नृपः ॥ २५॥ इति । नरसिंहपुराण अध्याय २५ श्लोकसंख्या
    ७२ श्रीनरसिंहपुराणे इक्ष्वाकुचरिते पञ्चविंशोऽध्यायः ॥ २५॥
