id: ganeshashtottarashatanamastotram-5
category: stotram
name:
  english: ganeshashtottarashatanamastotram 5
  devanagari: गणेशाष्टोत्तरशतनामस्तोत्रम् ५
content:
  english: shriganeshashtottarashatanamastotram 5 ganeshvaro ganakrido mahaganapatistatha | vishvakarta
    vishvamukho durjayo dhurvaho jayah || 1|| surupah sarvanetradhivaso virasanashrayah | yogadhipastarakasthah
    purusho gajakarnakah || 2|| citrankashyamadashano bhalacandrashcaturbhujah | shambhuteja yajnakayah
    sarvatma samabrimhitah || 3|| kulacalamso vyomanabhih kalpadrumavanalayah | nimnanabhih sthulakukshih
    pinavaksha brihadbhujah || 4|| pinaskandhah kambukantho lamboshtho lambanasikah | sarvavayavasampurnah
    sarvalakshanalakshitah || 5|| ikshucapadharah shuli kantikandalitashrayah | akshamaladharo jnanamudravan
    vijayavahah || 6|| kaminikamanah kamamalini kelilalitah | amoghasiddhiradhara adharadheyavarjitah
    || 7|| indivaradalashyama indumandalanirmalah | karmasakshi karmakarta karmakarmaphalapradah || 8||
    kamandaludharah kalpah kapardi katisutrabhrit || karunyadehah kapilo guhyagamanirupitah || 9|| guhashayo
    guhabdhistho ghatakumbho ghatodarah | purnanandah paranando dhanado dharanidharah || 10|| brihattamo
    brahmaparo brahmanyo brahmavitpriyah | bhavyo bhutalayo bhogadata caiva mahamanah || 11|| varenyo
    vamadevashca vanyo vajra
  devanagari: श्रीगणेशाष्टोत्तरशतनामस्तोत्रम् ५ गणेश्वरो गणक्रीडो महागणपतिस्तथा । विश्वकर्ता विश्वमुखो
    दुर्जयो धूर्वहो जयः ॥ १॥ सुरूपः सर्वनेत्राधिवासो वीरासनाश्रयः । योगाधिपस्तारकस्थः पुरुषो गजकर्णकः
    ॥ २॥ चित्राङ्कश्यामदशनो भालचन्द्रश्चतुर्भुजः । शम्भुतेजा यज्ञकायः सर्वात्मा सामबृंहितः ॥ ३॥ कुलाचलांसो
    व्योमनाभिः कल्पद्रुमवनालयः । निम्ननाभिः स्थूलकुक्षिः पीनवक्षा बृहद्भुजः ॥ ४॥ पीनस्कन्धः कम्बुकण्ठो
    लम्बोष्ठो लम्बनासिकः । सर्वावयवसम्पूर्णः सर्वलक्षणलक्षितः ॥ ५॥ इक्षुचापधरः शूली कान्तिकन्दलिताश्रयः
    । अक्षमालाधरो ज्ञानमुद्रावान् विजयावहः ॥ ६॥ कामिनीकामनः काममालिनी केलिलालितः । अमोघसिद्धिराधार आधाराधेयवर्जितः
    ॥ ७॥ इन्दीवरदलश्याम इन्दुमण्डलनिर्मलः । कर्मसाक्षी कर्मकर्ता कर्माकर्मफलप्रदः ॥ ८॥ कमण्डलुधरः कल्पः
    कपर्दी कटिसूत्रभृत् ॥ कारुण्यदेहः कपिलो गुह्यागमनिरूपितः ॥ ९॥ गुहाशयो गुहाब्धिस्थो घटकुम्भो घटोदरः
    । पूर्णानन्दः परानन्दो धनदो धरणीधरः ॥ १०॥ बृहत्तमो ब्रह्मपरो ब्रह्मण्यो ब्रह्मवित्प्रियः । भव्यो भूतालयो
    भोगदाता चैव महामनाः ॥ ११॥ वरेण्यो वामदेवश्च वन्यो वज्र
