id: dattasahasranamastotram-2
category: stotram
name:
  english: dattasahasranamastotram 2
  devanagari: दत्तसहस्रनामस्तोत्रम् २
content:
  english: digambaram bhasmavilepitangam bodhatmakam muktikaram parsannam | nirmanasam shyamatanum bhaje'ham
    dattatreyam brahmasamadhiyuktam || atha sahasranamastotram | dattatreyo mahoyogi yogeshashcamaraprabhum
    | munirdigambaro balo mayamukto madapahah || 1|| avadhuto mahanathah shankaro'maravallabhah | mahadevashcadidevah
    puranaprabhurishvarah || 2|| sattvakritsattvabhridbhavah sattvatma sattvasagarah | sattvavitsattvasakshi
    ca sattvasadhyo'maradhipah || 3|| bhutakridbhutabhriccaiva bhutatma bhutasambhavah | bhutabhavo bhavo
    bhutavittatha bhutakaranah || 4|| bhutasakshi prabhutishca bhutanam parama gatih | bhutasangavihinatma
    bhutatma bhutashankarah || 5|| bhutanatho mahanathashcadinatho maheshvarah | sarvabhutanivasatma bhutasantapanashanah
    || 6|| sarvatma sarvabhritsarvah sarvajnah sarvanirnayah | sarvasakshi brihadbhanuh sarvavitsarvamangalah
    || 7|| shantah satyah samah purno hyekaki kamalapatih | ramo ramapriyashcaiva viramo ramakaranam ||
    8|| shuddhatma pavano'nantah pratitah paramarthabhrit | hamsasakshi vibhushcaiva prabhuh pralaya ityapi
    || 9|| siddhatma paramatma ca siddhanam parama gatih || siddhisiddhastatha sadhyah sadhano hyuttamastatha
    || 10|| sulakshanah sumedhavi vidyavanvigatantarah | vijvarashca mahabahurbahulanandavardhanah ||
    11|| avyaktapurushah prajnah parajnah paramarthadrik | paraparavinirmukto yuktastattvaprakashavan
    || 12|| dayavanbhagavanbhavi bhavatma bhavakaranah | bhavasantapanashashca pushpavanpandito budhah
    || 13|| pratyakshavasturvishvatma pratyagbrahma sanatanah | pramanavigatashcaiva pratyaharaniyojakah
    || 14|| pranavah pranavatitah pramukhah pralayatmakah | mrityunjayo viviktatma shankaratma paro vapuh
    || 15|| paramastanuvijneyah paramatmani samsthitah | prabodhakalanadharah prabhavapravarottamah ||
    16|| cidambarashcidvilasashcidakashashciduttamah | cittacaitanyacittatma devanam parama gatih || 17||
    acetyashcetanadharashcetanacittavikramah | cittatma cetanarupo lasatpankajalocanah || 18|| parabrahma
    param jyotih param dhama parantapah | param sutram param tantram pavitram paramohavan || 19|| kshetrajnah
    kshetragah kshetrah kshetradharah puranjanah | kshetrashunyo lokasakshi kshetravanbahunayakah || 20||
    yogendo yogapujyashca yoga atmavidam shucih | yogamayadharah sthanuracalah kamalapatih || 21|| yogesho
    yoganirmata yogajnanaprakashanah | yogapalo lokapalah samsaratamanashanah || 22|| guhyo guhyatamo
    gupto mukto yuktah sanatanah | gahano gaganakaro gambhiro gananayakah || 23|| govindo gopatirgopta
    gobhago bhavasamsthitah | gosakshi gotamarishca gandharo gaganakritih || 24|| yogayukto bhogayuktah
    shankamuktasamadhiman | sahajah sakaleshanah kartaviryavarapradah || 25|| saraja virajah pumso pavanah
    papanashanah | puman paravaravinirmuktah paranjyotih puratanah || 26|| nanajyotiranekatma svayanjyotih
    sadashivah | divyajyotirmayashcaiva satyavijnanabhaskarah || 27|| nityashuddhah parah purnah prakashah
    prakatodbhavah | pramadavigatashcaiva pareshah paravikramah || 28|| yogi yogo yogapashca yogabhyasaprakashanah
    | yokta mokta vidhata ca trata pata nirayudhyah || 29|| nityamukto nityayuktah satyah satyaparakramah
    | sattvashuddhikarah sattvastatha sattvambhritam gatih || 30|| shridharah shrivapuh shriman shrinivaso'mararcitah
    | shrinidhih shripatih shreshthah shreyaskashcaramashrayah || 31|| tyagi tyagarthasampannastyagatma
    tyagavigrahah | tyagalakshanasiddhatma tyagajnastyagakaranah || 32|| bhogo bhokta tatha bhogyo bhogasadhanakaranah
    | bhogi bhogarthasampanno bhogajnanaprakashanah || 33|| kevalah keshavah krishnah kamvasah kamalalayah
    | kamalasanapujyashca harirajnanakhandanah || 34|| mahatma mahadadishca maheshottamavanditah | manobuddhivihinatma
    manatma manavadhipah || 35|| bhuvanesho vibhutishca dhritirmedha smritirdaya | duhkhadavanalo buddhah
    prabuddhah parameshvarah || 36|| kamaha krodhaha caiva dambhadarpamadapahah | ajnanapatimirarishca
    bhavarirbhuvaneshvarah || 37|| rupakudrupabhridrupi rupatma rupakaranah | rupajno rupasakshi ca namarupo
    gunantakah || 38|| aprameyah prameyashca pramanam pranavashrayah | pramanarahito'cintyashcetanavigato'jarah
    || 39|| aksharo'ksharamuktashca vijvaro jvaranashanah | vishishto vittashastri ca drishto drishtantavarjitah
    || 40|| gunesho gunakayashca gunatma ganabhavanah | anantagunasampanno gunagarbho gunadhipah || 41||
    ganesho gunanathashca gunatma ganabhavanah | ganabandhurvivekatma gunayuktah parakrami || 42|| atarkyah
    kraturagnishca kritajnah saphalashrayah | yajnashca yajnaphaldo yajna ijyo'marottamah || 43|| hiranyagarbhah
    shrigarbhah khagarbhah kunapeshvarah | mayagarbho lokagarbhah svayambhurbhuvanantakah || 44|| nishpapo
    nibido nandi bodhi bodhasamashrayah | bodhatma bodhanatma ca bhedavaitandakhandanah || 45|| svabhavyo
    bhavanirmukto vyakto'vyaktasamashrayah | nityatripto nirabhaso nirvanah sharanah suhrit || 46|| guhyesho
    gunagambhiro gunadoshanivaranah | gunasangavihinashca yogarerdarpanashanah || 47|| anandah paramanandah
    svanandasukhavardhanah | satyanandashcidanandah sarvanandaparayanah || 48|| sadrupah sahajah satyah
    svanandah sumanoharah | sarvah sarvantarashcaiva purvatpurvatarastatha || 49|| khamayah khaparah khadih
    khambrahma khatanuh khagah | khavasah khavihinashca khanidhih khaparashrayah || 50|| anantashcadirupashca
    suryamandalamadhyagah | amoghah paramamoghah parokshah varadah kavih || 51|| vishvacakshurvishvasakshi
    vishvabahurdhaneshvarah | dhananjayo mahatejastejishthastaijasah sukhi || 52|| jyotirjyotirmayo jeta
    jyotisham jyotiratmakah | jyotishamapi jyotishca janako janamohanah || 53|| jitendriyo jitakrodho
    jitatma jitamanasah | jitasango jitaprano jitasamsaravasanah || 54|| nirvasano niralambo niryogakshemavarjitah
    | niriho nirahankaro nirashirnirupadhikah || 55|| nityabodho viviktatma vishuddhottamagauravah | vidyarthi
    paramarthi ca shraddharthi sadhanatmakah || 56|| pratyahari nirahari sarvaharaparayanah | nityashuddho
    nirakankshi parayanaparayanah || 57|| anoranutarah sukshmah sthulah sthulatarastatha | ekastatha'nekarupo
    vishvarupah sanatanah || 58|| naikarupo virupatma naikabodhamayo'pi ca | naikanamamayashcaiva naikavidyavivardhanah
    || 59|| ekashcaikantikashcaiva nanabhavavivarjitah | ekaksharastatha bijah purnabimbah sanatanah ||
    60|| mantraviryo mantrabijah shastraviryo jagatpatih | nanaviryadharashcaiva shakreshah prithivipatih
    || 61|| praneshah pranadah pranah pranayamaparayanah | pranapancakanirmuktah koshapancakavarjitah
    || 62|| nishcalo nishkalo'sango nishprapanco niramayah | niradharo nirakaro nirvikaro niranjanah ||
    63|| nishpratito nirabhaso nirasakto nirakulah | nishthasarvagatashcaiva nirarambho nirashrayah ||
    64|| nirantarah sattvagopta shanto danto mahamunih | nihshabdah sukritah svasthah satyavadi sureshvarah
    || 65|| jnanado jnanavijnani jnanatma''nandapuritah | jnanayajnavidam daksho jnanagnirjvalano budhah
    || 66|| dayavanbhavarogarishcikitsacaramagatih | candramandalamadhyasthashcandrakotisushitalah ||
    67|| yantakritparamo yantri yantrarudhaparajitah | yantravidyantravasashca yantradharo dharadharah
    || 68|| tattvajnastattvabhutatma mahattattvaprakashanah | tattvasankhyanayogajnah sankhyashastrapravartakah
    || 69|| anantavikramo devo madhavashca dhaneshvarah | sadhuh sadhuvarishthatma savadhano'marottamah
    || 70|| nihsankalpo niradharo durdharo hyatmavitpatih | arogyasukhadashcaiva pravaro vasavastatha
    || 71|| pareshah paramodarah pratyakcaitanyadurgamah | duradharsho duravaso duratvaparinashanah ||
    72|| vedavidvedakridvedo vedatma vimalashayah | viviktasevi ca samsarashramanashanastatha || 73||
    brahmayonirbrihadyonirvishvayonirvidehavan | vishalaksho vishvanatho hatakangadabhushanah || 74||
    abadhyo jagadaradhyo jagadarjavapalanah | janavandhanavandharmi dharmago dharmavardhanah || 75|| amritah
    shashvatah sadyah siddhidah sumanoharah | khalubrahmakhalusthano muninam parama gatih || 76|| upadrashta
    tatha shreshthah shucirbhuto hyanamayah | vedasiddhantavedyashca manasahladavardhanah || 77|| dehadanyo
    gunadanyo lokadanyo vivekavit | dushtasvapnaharashcaiva gururguruvarottamah || 78|| karmi karmavinirmuktah
    samnyasi sadhakeshvarah | sarvabhavavihinashca trishnasanganivarakah || 79|| tyagi tyagavapustyagastyagadanavivarjitah
    | tyagakaranatyagatma sadguruh sukhadayakah || 80|| daksho dakshadivandyashca jnanavadapravartakah
    | shabdabrahmamayatma ca shabdabrahmaprakashavan || 81|| grasishnuh prabhavishnushca sahishnurvigatantarah
    | vidvattamo mahavandyo vishalottamavanmunih || 82|| brahmavidbrahmabhavashca brahmarshirbahmanapriyah
    | brahma brahmaprakashatma brahmavidyaprakashanah || 83|| atrivamshaprabhutatma tapasottamavanditah
    | atmavasi vidheyatma hyatrivamshavivardhanah || 84|| pravartano nivrittatma pralayodakasannibhah
    | narayano mahagarbho bhargavapriyakrittamah || 85|| sankalpaduhkhadalanah samsaratamanashanah | trivikramastridhakarastrimurtistrigunatmakah
    || 86|| bhedatrayaharashcaiva tapatrayanivarakah | doshatrayavibhedi ca samshayarnavakhandanah ||
    87|| asamshayastvasammudho hyavadi rajananditah | rajayogi mahayogi svabhavagalitastatha || 88|| punyashlokah
    pavitranghrirdhyanayogaparayanah | dhyanastho dhyanagamyashca vidheyatma puratanah || 89|| avijneyo
    hyantaratma mukhyabimbasanatanah | jivasanjivano jivashcidvilasashcidashrayah || 90|| mahendro'maramanyashca
    yogendro yogavittamah | yogadharmastatha yogastattvastattvavinishcayah || 91|| naikabahuranantatma
    naikanamaparakramah | naikakshi naikapadashca nathanathottamottamah || 92|| sahasrashirsha purushah
    sahasrakshah sahasrapat | sahasrarupadrikcaiva sahasraramayoddhavah || 93|| tripadapurushashcaiva
    tripadurdhvastathaiva ca | tryambakashca mahaviryo yogaviryavisharadah || 94|| vijayi vinayi jeta
    vitaragi virajitah | rudro raudro mahabhimah prajnamukhyah sadashucih || 95|| antarjyotiranantatma
    pratyagatma nirantarah | arupashcatmarupashca sarvabhavavinirvritah || 96|| antah shunyo bahih shunyah
    shunyatma shunyabhavanah | antahpurno bahihpurnah purnatma purnabhavanah || 97|| antastyagi bahistyagi
    tyagatma sarvayogavan | antaryagi bahiryagi sarvayogaparayanah || 98|| antarbhogi bahirbhogi sarvabhogaviduttamah
    | antarnishtho bahirnishthah sarvanishthamayastatha || 99|| bahyantaravimuktashca bahyantaravivarjitah
    | shantah shuddho vishuddhashca nirvanah prakriteh parah || 100|| akalah kalanemi ca kalakalo janeshvarah
    | kalatma kalakarta ca kalajnah kalanashanah || 101|| kaivalyapadadata ca kaivalyasukhadayakah | kaivalyakalanadharo
    nirbharo harshavardhanah || 102|| hridayastho hrishikesho govindo garbhavarjitah | sakalagamapujyashca
    nigamo nigamashrayah || 103|| parashaktih parakirtih paravrittirnidhismritih | paravidya parakshantirvibhaktiryuktasadgatih
    || 104|| svaprakashah prakashatma parasamvedanatmakah | svasevyah svavidam svatma svasamvedyo'naghah
    kshami || 105|| svanusandhanashilatma svanusandhanagocarah | svanusandhanashunyatma svanusandhanashrayastatha
    || 106|| svabodhadarpano'bhangah kandarpakulanashanah | brahmacari brahmavetta brahmano brahmavittamah
    || 107|| tattvabodhah sudhavarshah pavanah papapavakah | brahmasutravidheyatma brahmasutrardhanirnayah
    || 108|| atyantiko mahakalpah sankalpavartanashanah | adhivyadhiharashcaiva samshayarnavashoshakah
    || 109|| tattvatmajnanasandesho mahanubhavabhavitah | atmanubhavasampannah svanubhavasukhashrayah
    || 110|| acintyashca brihadbhanuh pramadotkarshanashanah | aniketaprashantatma shunyavaso jagadvapuh
    || 111|| cidgatishcinmayashcakri mayacakrapravartakah | sarvavarnavidarambhi sarvarambhaparayanah
    || 112|| puranah pravaro data sundarah kanakangadi | anisuyatmajo dattah sarvajnah sarvakamadah ||
    113|| kamajitkamapalashca kami kamapradagamah | kamavankamaposhashca sarvakamanivartakah || 114||
    sarvakarmaphalotpattih sarvakamaphalapradah | sarvakarmaphalaih pujyah sarvakarmaphalashrayah || 115||
    vishvakarma kritatma ca kritajnah sarvasakshikah | sarvarambhaparityagi jadonmattapishacavan || 116||
    bhikshurbhikshakarashcaiva bhaikshahari nirashrami | akulashcanukulashca vikalo hyakalastatha || 117||
    jatilo vanacari ca dandi mundi ca gandavan | dehadharmavihinatma hyekaki sangavarjitah || 118|| ashramyanashramarambho'nacari
    karmavarjitah | asandehi ca sandehi na kincinna ca kincanah || 119|| nridehi dehashunyashca nabhavi
    bhavanirgatah | nabrahmaca parabrahma svayameva nirakulah || 120|| anaghashcagurushcaiva nathanathottamo
    guruh | dvibhujah prakritashcaiva janakashca pitamahah || 121|| anatma na ca nanatma nitirnitimatam
    varah | sahajah sadrishah siddhashcaikashcinmatra eva ca || 122|| na kartapi ca karta ca bhokta bhogavivarjitah
    | turiyasturiyatitah svacchah sarvamayastatha || 123|| sarvadhishthanarupashca sarvadhyeyavivarjitah
    | sarvalokanivasatma sakalottamavanditah || 124|| dehabhriddehakriccaiva dehatma dehabhavanah | dehi
    dehavibhaktashca dehabhavaprakashanah || 125|| layastho layaviccaiva layabhavashca bodhavan | layatito
    layasyanto layabhavanivaranah || 126|| vimukhah pramukhashcaiva pratyanmukhavadacari | vishvabhugvishvadhrigvishvo
    vishvakshemakarastatja || 127|| avikshipto'pramadi ca pararddhih paramarthadrik | svanubhavavihinashca
    svanubhavaprakashanah || 128|| nirindriyashca nirbuddhirnirabhaso nirakritah | nirahankarashcarupatma
    nirvapuh sakalashrayah || 129|| shokaduhkhaharashcaiva bhogamokshaphalapradah | suprasannastatha sukshmah
    shabdabrahmarthasangrahah || 130|| agamapayashunyashca sthanadashca satangatih | akritah sukritashcaiva
    kritakarma vinirvritah || 131|| bhedatrayavarashcaiva dehatrayavinirgatah | sarvakamamayashcaiva sarvakamanivartakah
    || 132|| siddheshvaro'jarah pancabanadarpahutashanah | caturaksharabijatma svabhushcitkirtibhushanah
    || 133|| agadhabuddhirakshubdhashcandrasuryagnilocanah | yamadamshtro'tisamharta paramanandasagarah
    || 134|| lilavishvambharo bhanurbhairavo bhimalocanah | brahmacaryambarah kalastvacalashcalanantakah
    || 135|| adidevo jagadyonirvasavarivimardanah | vikarmakarmakarmajno'nanyagamako'gamah || 136|| abaddhakarmashunyashca
    kamaragakulakshayah | yogandhakaramathanah padmajanmadivanditah || 137|| bhaktakamo'grajashcakri bhavanirbhavabhavakah
    | bhedantako mahanagryo niguho gocarantakah || 138|| kalagnishamanah shankhacakrapadmagadadharah |
    dipto dinapatih shasta svacchando muktidayakah || 139|| vyomadharmambaro bhetta bhasmadhari dharadharah
    | dharmagupto'nvayatma ca vyatirekarthanirnayah || 140|| ekanekagunabhasabhasanirbhasavarjitah | bhavabhavasvabhavatma
    bhavabhavavibhavavit || 141|| yogihridayavishramo'nantavidyavivardhanah | vighnantakastrikalajnastattvatma
    jnanasagarah || 142|| itidam dattasahasram sayam pratah pathettu yah | sa ihamutra labhate nirvanam
    paramam sukham || 143|| guruvare dattabhakto bhaktibhavasamanvitah | pathetsadaiva to hyetatsa labheccintitam
    dhruvam || 144|| iti shrimaddattatreyapuranoktam shrimaddattatreyasahasranamastotram sampurnam ||
  devanagari: दिगम्बरं भस्मविलेपिताङ्गं बोधात्मकं मुक्तिकरं पर्सन्नम् । निर्मानसं श्यामतनुं भजेऽहं दत्तात्रेयं
    ब्रह्मसमाधियुक्तम् ॥ अथ सहस्रनामस्तोत्रम् । दत्तात्रेयो महोयोगी योगेशश्चामरप्रभुम् । मुनिर्दिगम्बरो
    बालो मायामुक्तो मदापहः ॥ १॥ अवधूतो महानाथः शङ्करोऽमरवल्लभः । महादेवश्चादिदेवः पुराणप्रभुरीश्वरः ॥
    २॥ सत्त्वकृत्सत्त्वभृद्भावः सत्त्वात्मा सत्त्वसागरः । सत्त्ववित्सत्त्वसाक्षी च सत्त्वसाध्योऽमराधिपः
    ॥ ३॥ भूतकृद्भूतभृच्चैव भूतात्मा भूतसम्भवः । भूतभावो भवो भूतवित्तथा भूतकारणः ॥ ४॥ भूतसाक्षी प्रभूतिश्च
    भूतानां परमा गतिः । भूतसङ्गविहीनात्मा भूतात्मा भूतशङ्करः ॥ ५॥ भूतनाथो महानाथश्चादिनाथो महेश्वरः ।
    सर्वभूतनिवासात्मा भूतसन्तापनाशनः ॥ ६॥ सर्वात्मा सर्वभृत्सर्वः सर्वज्ञः सर्वनिर्णयः । सर्वसाक्षी बृहद्भानुः
    सर्ववित्सर्वमङ्गलः ॥ ७॥ शान्तः सत्यः समः पूर्णो ह्येकाकी कमलापतिः । रामो रामप्रियश्चैव विरामो रामकारणम्
    ॥ ८॥ शुद्धात्मा पावनोऽनन्तः प्रतीतः परमार्थभृत् । हंससाक्षी विभुश्चैव प्रभुः प्रलय इत्यपि ॥ ९॥ सिद्धात्मा
    परमात्मा च सिद्धानां परमा गतिः ॥ सिद्धिसिद्धस्तथा साध्यः साधनो ह्युत्तमस्तथा ॥ १०॥ सुलक्षणः सुमेधावी
    विद्यावान्विगतान्तरः । विज्वरश्च महाबाहुर्बहुलानन्दवर्धनः ॥ ११॥ अव्यक्तपुरुषः प्राज्ञः परज्ञः परमार्थदृक्
    । परापरविनिर्मुक्तो युक्तस्तत्त्वप्रकाशवान् ॥ १२॥ दयावान्भगवान्भावी भावात्मा भावकारणः । भवसन्तापनाशश्च
    पुष्पवान्पण्डितो बुधः ॥ १३॥ प्रत्यक्षवस्तुर्विश्वात्मा प्रत्यग्ब्रह्म सनातनः । प्रमाणविगतश्चैव प्रत्याहारनियोजकः
    ॥ १४॥ प्रणवः प्रणवातीतः प्रमुखः प्रलयात्मकः । मृत्युञ्जयो विविक्तात्मा शङ्करात्मा परो वपुः ॥ १५॥ परमस्तनुविज्ञेयः
    परमात्मनि संस्थितः । प्रबोधकलनाधारः प्रभावप्रवरोत्तमः ॥ १६॥ चिदम्बरश्चिद्विलासश्चिदाकाशश्चिदुत्तमः
    । चित्तचैतन्यचित्तात्मा देवानां परमा गतिः ॥ १७॥ अचेत्यश्चेतनाधारश्चेतनाचित्तविक्रमः । चित्तात्मा चेतनारूपो
    लसत्पङ्कजलोचनः ॥ १८॥ परब्रह्म परं ज्योतिः परं धाम परन्तपः । परं सूत्रं परं तन्त्रं पवित्रं परमोहवान्
    ॥ १९॥ क्षेत्रज्ञः क्षेत्रगः क्षेत्रः क्षेत्राधारः पुरञ्जनः । क्षेत्रशून्यो लोकसाक्षी क्षेत्रवान्बहुनायकः
    ॥ २०॥ योगेन्दो योगपूज्यश्च योग आत्मविदां शुचिः । योगमायाधरः स्थाणुरचलः कमलापतिः ॥ २१॥ योगेशो योगनिर्माता
    योगज्ञानप्रकाशनः । योगपालो लोकपालः संसारतमनाशनः ॥ २२॥ गुह्यो गुह्यतमो गुप्तो मुक्तो युक्तः सनातनः
    । गहनो गगनाकारो गम्भीरो गणनायकः ॥ २३॥ गोविन्दो गोपतिर्गोप्ता गोभागो भावसंस्थितः । गोसाक्षी गोतमारिश्च
    गान्धारो गगनाकृतिः ॥ २४॥ योगयुक्तो भोगयुक्तः शङ्कामुक्तसमाधिमान् । सहजः सकलेशानः कार्तवीर्यवरप्रदः
    ॥ २५॥ सरजा विरजाः पुंसो पावनः पापनाशनः । पुमान् परावरविनिर्मुक्तः परञ्ज्योतिः पुरातनः ॥ २६॥ नानाज्योतिरनेकात्मा
    स्वयञ्ज्योतिः सदाशिवः । दिव्यज्योतिर्मयश्चैव सत्यविज्ञानभास्करः ॥ २७॥ नित्यशुद्धः परः पूर्णः प्रकाशः
    प्रकटोद्भवः । प्रमादविगतश्चैव परेशः परविक्रमः ॥ २८॥ योगी योगो योगपश्च योगाभ्यासप्रकाशनः । योक्ता मोक्ता
    विधाता च त्राता पाता निरायुध्यः ॥ २९॥ नित्यमुक्तो नित्ययुक्तः सत्यः सत्यपराक्रमः । सत्त्वशुद्धिकरः
    सत्त्वस्तथा सत्त्वम्भृतां गतिः ॥ ३०॥ श्रीधरः श्रीवपुः श्रीमान् श्रीनिवासोऽमरार्चितः । श्रीनिधिः श्रीपतिः
    श्रेष्ठः श्रेयस्कश्चरमाश्रयः ॥ ३१॥ त्यागी त्यागार्थसम्पन्नस्त्यागात्मा त्यागविग्रहः । त्यागलक्षणसिद्धात्मा
    त्यागज्ञस्त्यागकारणः ॥ ३२॥ भोगो भोक्ता तथा भोग्यो भोगसाधनकारणः । भोगी भोगार्थसम्पन्नो भोगज्ञानप्रकाशनः
    ॥ ३३॥ केवलः केशवः कृष्णः कंवासाः कमलालयः । कमलासनपूज्यश्च हरिरज्ञानखण्डनः ॥ ३४॥ महात्मा महदादिश्च
    महेशोत्तमवन्दितः । मनोबुद्धिविहीनात्मा मानात्मा मानवाधिपः ॥ ३५॥ भुवनेशो विभूतिश्च धृतिर्मेधा स्मृतिर्दया
    । दुःखदावानलो बुद्धः प्रबुद्धः परमेश्वरः ॥ ३६॥ कामहा क्रोधहा चैव दम्भदर्पमदापहः । अज्ञानपतिमिरारिश्च
    भवारिर्भुवनेश्वरः ॥ ३७॥ रूपकुद्रूपभृद्रूपी रूपात्मा रूपकारणः । रूपज्ञो रूपसाक्षी च नामरूपो गुणान्तकः
    ॥ ३८॥ अप्रमेयः प्रमेयश्च प्रमाणं प्रणवाश्रयः । प्रमाणरहितोऽचिन्त्यश्चेतनाविगतोऽजरः ॥ ३९॥ अक्षरोऽक्षरमुक्तश्च
    विज्वरो ज्वरनाशनः । विशिष्टो वित्तशास्त्री च दृष्टो दृष्टान्तवर्जितः ॥ ४०॥ गुणेशो गुणकायश्च गुणात्मा
    गणभावनः । अनन्तगुणसम्पन्नो गुणगर्भो गुणाधिपः ॥ ४१॥ गणेशो गुणनाथश्च गुणात्मा गणभावनः । गणबन्धुर्विवेकात्मा
    गुणयुक्तः पराक्रमी ॥ ४२॥ अतर्क्यः क्रतुरग्निश्च कृतज्ञः सफलाश्रयः । यज्ञश्च यज्ञफल्दो यज्ञ इज्योऽमरोत्तमः
    ॥ ४३॥ हिरण्यगर्भः श्रीगर्भः खगर्भः कुणपेश्वरः । मायागर्भो लोकगर्भः स्वयम्भूर्भुवनान्तकः ॥ ४४॥ निष्पापो
    निबिडो नन्दी बोधी बोधसमाश्रयः । बोधात्मा बोधनात्मा च भेदवैतण्डखण्डनः ॥ ४५॥ स्वाभाव्यो भावनिर्मुक्तो
    व्यक्तोऽव्यक्तसमाश्रयः । नित्यतृप्तो निराभासो निर्वाणः शरणः सुहृत् ॥ ४६॥ गुह्येशो गुणगम्भीरो गुणदोषनिवारणः
    । गुणसङ्गविहीनश्च योगारेर्दर्पनाशनः ॥ ४७॥ आनन्दः परमानन्दः स्वानन्दसुखवर्धनः । सत्यानन्दश्चिदानन्दः
    सर्वानन्दपरायणः ॥ ४८॥ सद्रूपः सहजः सत्यः स्वानन्दः सुमनोहरः । सर्वः सर्वान्तरश्चैव पूर्वात्पूर्वतरस्तथा
    ॥ ४९॥ खमयः खपरः खादिः खम्ब्रह्म खतनुः खगः । खवासाः खविहीनश्च खनिधिः खपराश्रयः ॥ ५०॥ अनन्तश्चादिरूपश्च
    सूर्यमण्डलमध्यगः । अमोघः परमामोघः परोक्षः वरदः कविः ॥ ५१॥ विश्वचक्षुर्विश्वसाक्षी विश्वबाहुर्धनेश्वरः
    । धनञ्जयो महातेजास्तेजिष्ठस्तैजसः सुखी ॥ ५२॥ ज्योतिर्ज्योतिर्मयो जेता ज्योतिषां ज्योतिरात्मकः । ज्योतिषामपि
    ज्योतिश्च जनको जनमोहनः ॥ ५३॥ जितेन्द्रियो जितक्रोधो जितात्मा जितमानसः । जितसङ्गो जितप्राणो जितसंसारवासनः
    ॥ ५४॥ निर्वासनो निरालम्बो निर्योगक्षेमवर्जितः । निरीहो निरहङ्कारो निराशीर्निरुपाधिकः ॥ ५५॥ नित्यबोधो
    विविक्तात्मा विशुद्धोत्तमगौरवः । विद्यार्थी परमार्थी च श्रद्धार्थी साधनात्मकः ॥ ५६॥ प्रत्याहारी निराहारी
    सर्वाहारपरायणः । नित्यशुद्धो निराकाङ्क्षी पारायणपरायणः ॥ ५७॥ अणोरणुतरः सूक्ष्मः स्थूलः स्थूलतरस्तथा
    । एकस्तथाऽनेकरूपो विश्वरूपः सनातनः ॥ ५८॥ नैकरूपो विरूपात्मा नैकबोधमयोऽपि च । नैकनाममयश्चैव नैकविद्याविवर्धनः
    ॥ ५९॥ एकश्चैकान्तिकश्चैव नानाभावविवर्जितः । एकाक्षरस्तथा बीजः पूर्णबिम्बः सनातनः ॥ ६०॥ मन्त्रवीर्यो
    मन्त्रबीजः शास्त्रवीर्यो जगत्पतिः । नानावीर्यधरश्चैव शक्रेशः पृथिवीपतिः ॥ ६१॥ प्राणेशः प्राणदः प्राणः
    प्राणायामपरायणः । प्राणपञ्चकनिर्मुक्तः कोशपञ्चकवर्जितः ॥ ६२॥ निश्चलो निष्कलोऽसङ्गो निष्प्रपञ्चो निरामयः
    । निराधारो निराकारो निर्विकारो निरञ्जनः ॥ ६३॥ निष्प्रतीतो निराभासो निरासक्तो निराकुलः । निष्ठासर्वगतश्चैव
    निरारम्भो निराश्रयः ॥ ६४॥ निरन्तरः सत्त्वगोप्ता शान्तो दान्तो महामुनिः । निःशब्दः सुकृतः स्वस्थः सत्यवादी
    सुरेश्वरः ॥ ६५॥ ज्ञानदो ज्ञानविज्ञानी ज्ञानात्माऽऽनन्दपूरितः । ज्ञानयज्ञविदां दक्षो ज्ञानाग्निर्ज्वलनो
    बुधः ॥ ६६॥ दयावान्भवरोगारिश्चिकित्साचरमागतिः । चन्द्रमण्डलमध्यस्थश्चन्द्रकोटिसुशीतलः ॥ ६७॥ यन्तकृत्परमो
    यन्त्री यन्त्रारूढपराजितः । यन्त्रविद्यन्त्रवासश्च यन्त्राधारो धराधरः ॥ ६८॥ तत्त्वज्ञस्तत्त्वभूतात्मा
    महत्तत्त्वप्रकाशनः । तत्त्वसङ्ख्यानयोगज्ञः साङ्ख्यशास्त्रप्रवर्तकः ॥ ६९॥ अनन्तविक्रमो देवो माधवश्च
    धनेश्वरः । साधुः साधुवरिष्ठात्मा सावधानोऽमरोत्तमः ॥ ७०॥ निःसङ्कल्पो निराधारो दुर्धरो ह्यात्मवित्पतिः
    । आरोग्यसुखदश्चैव प्रवरो वासवस्तथा ॥ ७१॥ परेशः परमोदारः प्रत्यक्चैतन्यदुर्गमः । दुराधर्षो दुरावासो
    दूरत्वपरिनाशनः ॥ ७२॥ वेदविद्वेदकृद्वेदो वेदात्मा विमलाशयः । विविक्तसेवी च संसारश्रमनाशनस्तथा ॥ ७३॥
    ब्रह्मयोनिर्बृहद्योनिर्विश्वयोनिर्विदेहवान् । विशालाक्षो विश्वनाथो हाटकाङ्गदभूषणः ॥ ७४॥ अबाध्यो जगदाराध्यो
    जगदार्जवपालनः । जनवान्धनवान्धर्मी धर्मगो धर्मवर्धनः ॥ ७५॥ अमृतः शाश्वतः साद्यः सिद्धिदः सुमनोहरः ।
    खलुब्रह्मखलुस्थानो मुनीनां परमा गतिः ॥ ७६॥ उपद्रष्टा तथा श्रेष्ठः शुचिर्भूतो ह्यनामयः । वेदसिद्धान्तवेद्यश्च
    मानसाह्लादवर्धनः ॥ ७७॥ देहदन्यो गुणादन्यो लोकादन्यो विवेकवित् । दुष्टस्वप्नहरश्चैव गुरुर्गुरुवरोत्तमः
    ॥ ७८॥ कर्मी कर्मविनिर्मुक्तः संन्यासी साधकेश्वरः । सर्वभावविहीनश्च तृष्णासङ्गनिवारकः ॥ ७९॥ त्यागी
    त्यागवपुस्त्यागस्त्यागदानविवर्जितः । त्यागकारणत्यागात्मा सद्गुरुः सुखदायकः ॥ ८०॥ दक्षो दक्षादिवन्द्यश्च
    ज्ञानवादप्रवर्तकः । शब्दब्रह्ममयात्मा च शब्दब्रह्मप्रकाशवान् ॥ ८१॥ ग्रसिष्णुः प्रभविष्णुश्च सहिष्णुर्विगतान्तरः
    । विद्वत्तमो महावन्द्यो विशालोत्तमवाङ्मुनिः ॥ ८२॥ ब्रह्मविद्ब्रह्मभावश्च ब्रह्मर्षिर्बाह्मणप्रियः
    । ब्रह्म ब्रह्मप्रकाशात्मा ब्रह्मविद्याप्रकाशनः ॥ ८३॥ अत्रिवंशप्रभूतात्मा तापसोत्तमवन्दितः । आत्मवासी
    विधेयात्मा ह्यत्रिवंशविवर्धनः ॥ ८४॥ प्रवर्तनो निवृत्तात्मा प्रलयोदकसन्निभः । नारायणो महागर्भो भार्गवप्रियकृत्तमः
    ॥ ८५॥ सङ्कल्पदुःखदलनः संसारतमनाशनः । त्रिविक्रमस्त्रिधाकारस्त्रिमूर्तिस्त्रिगुणात्मकः ॥ ८६॥ भेदत्रयहरश्चैव
    तापत्रयनिवारकः । दोषत्रयविभेदी च संशयार्णवखण्डनः ॥ ८७॥ असंशयस्त्वसम्मूढो ह्यवादी राजनन्दितः । राजयोगी
    महायोगी स्वभावगलितस्तथा ॥ ८८॥ पुण्यश्लोकः पवित्राङ्घ्रिर्ध्यानयोगपरायणः । ध्यानस्थो ध्यानगम्यश्च विधेयात्मा
    पुरातनः ॥ ८९॥ अविज्ञेयो ह्यन्तरात्मा मुख्यबिम्बसनातनः । जीवसञ्जीवनो जीवश्चिद्विलासश्चिदाश्रयः ॥ ९०॥
    महेन्द्रोऽमरमान्यश्च योगेन्द्रो योगवित्तमः । योगधर्मस्तथा योगस्तत्त्वस्तत्त्वविनिश्चयः ॥ ९१॥ नैकबाहुरनन्तात्मा
    नैकनामपराक्रमः । नैकाक्षी नैकपादश्च नाथनाथोत्तमोत्तमः ॥ ९२॥ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात्
    । सहस्ररूपदृक्चैव सहस्रारमयोद्धवः ॥ ९३॥ त्रिपादपुरुषश्चैव त्रिपादूर्ध्वस्तथैव च । त्र्यम्बकश्च महावीर्यो
    योगवीर्यविशारदः ॥ ९४॥ विजयी विनयी जेता वीतरागी विराजितः । रुद्रो रौद्रो महाभीमः प्राज्ञमुख्यः सदाशुचिः
    ॥ ९५॥ अन्तर्ज्योतिरनन्तात्मा प्रत्यगात्मा निरन्तरः । अरूपश्चात्मरूपश्च सर्वभावविनिर्वृतः ॥ ९६॥ अन्तः
    शून्यो बहिः शून्यः शून्यात्मा शून्यभावनः । अन्तःपूर्णो बहिःपूर्णः पूर्णात्मा पूर्णभावनः ॥ ९७॥ अन्तस्त्यागी
    बहिस्त्यागी त्यागात्मा सर्वयोगवान् । अन्तर्यागी बहिर्यागी सर्वयोगपरायणः ॥ ९८॥ अन्तर्भोगी बहिर्भोगी
    सर्वभोगविदुत्तमः । अन्तर्निष्ठो बहिर्निष्ठः सर्वनिष्ठामयस्तथा ॥ ९९॥ बाह्यान्तरविमुक्तश्च बाह्यान्तरविवर्जितः
    । शान्तः शुद्धो विशुद्धश्च निर्वाणः प्रकृतेः परः ॥ १००॥ अकालः कालनेमी च कालकालो जनेश्वरः । कालात्मा
    कालकर्ता च कालज्ञः कालनाशनः ॥ १०१॥ कैवल्यपददाता च कैवल्यसुखदायकः । कैवल्यकलनाधारो निर्भरो हर्षवर्धनः
    ॥ १०२॥ हृदयस्थो हृषीकेशो गोविन्दो गर्भवर्जितः । सकलागमपूज्यश्च निगमो निगमाश्रयः ॥ १०३॥ पराशक्तिः पराकीर्तिः
    परावृत्तिर्निधिस्मृतिः । पराविद्या पराक्षान्तिर्विभक्तिर्युक्तसद्गतिः ॥ १०४॥ स्वप्रकाशः प्रकाशात्मा
    परसंवेदनात्मकः । स्वसेव्यः स्वविदां स्वात्मा स्वसंवेद्योऽनघः क्षमी ॥ १०५॥ स्वानुसन्धानशीलात्मा स्वानुसन्धानगोचरः
    । स्वानुसन्धानशून्यात्मा स्वानुसन्धानाश्रयस्तथा ॥ १०६॥ स्वबोधदर्पणोऽभङ्गः कन्दर्पकुलनाशनः । ब्रह्मचारी
    ब्रह्मवेत्ता ब्राह्मणो ब्रह्मवित्तमः ॥ १०७॥ तत्त्वबोधः सुधावर्षः पावनः पापपावकः । ब्रह्मसूत्रविधेयात्मा
    ब्रह्मसूत्रार्धनिर्णयः ॥ १०८॥ आत्यन्तिको महाकल्पः सङ्कल्पावर्तनाशनः । आधिव्याधिहरश्चैव संशयार्णवशोषकः
    ॥ १०९॥ तत्त्वात्मज्ञानसन्देशो महानुभवभावितः । आत्मानुभवसम्पन्नः स्वानुभावसुखाश्रयः ॥ ११०॥ अचिन्त्यश्च
    बृहद्भानुः प्रमदोत्कर्षनाशनः । अनिकेतप्रशान्तात्मा शून्यवासो जगद्वपुः ॥ १११॥ चिद्गतिश्चिन्मयश्चक्री
    मायाचक्रप्रवर्तकः । सर्ववर्णविदारम्भी सर्वारम्भपरायणः ॥ ११२॥ पुराणः प्रवरो दाता सुन्दरः कनकाङ्गदी
    । अनिसूयात्मजो दत्तः सर्वज्ञः सर्वकामदः ॥ ११३॥ कामजित्कामपालश्च कामी कामप्रदागमः । कामवान्कामपोषश्च
    सर्वकामनिवर्तकः ॥ ११४॥ सर्वकर्मफलोत्पत्तिः सर्वकामफलप्रदः । सर्वकर्मफलैः पूज्यः सर्वकर्मफलाश्रयः ॥
    ११५॥ विश्वकर्मा कृतात्मा च कृतज्ञः सर्वसाक्षिकः । सर्वारम्भपरित्यागी जडोन्मत्तपिशाचवान् ॥ ११६॥ भिक्षुर्भिक्षाकरश्चैव
    भैक्षाहारी निराश्रमी । अकूलश्चानुकूलश्च विकलो ह्यकलस्तथा ॥ ११७॥ जटिलो वनचारी च दण्डी मुण्डी च गण्डवान्
    । देहधर्मविहीनात्मा ह्येकाकी सङ्गवर्जितः ॥ ११८॥ आश्रम्यनाश्रमारम्भोऽनाचारी कर्मवर्जितः । असन्देही
    च सन्देही न किञ्चिन्न च किञ्चनः ॥ ११९॥ नृदेही देहशून्यश्च नाभावी भावनिर्गतः । नाब्रह्मच परब्रह्म स्वयमेव
    निराकुलः ॥ १२०॥ अनघश्चागुरुश्चैव नाथनाथोत्तमो गुरुः । द्विभुजः प्राकृतश्चैव जनकश्च पितामहः ॥ १२१॥
    अनात्मा न च नानात्मा नीतिर्नीतिमतां वरः । सहजः सदृशः सिद्धश्चैकश्चिन्मात्र एव च ॥ १२२॥ न कर्तापि च
    कर्ता च भोक्ता भोगविवर्जितः । तुरीयस्तुरीयातीतः स्वच्छः सर्वमयस्तथा ॥ १२३॥ सर्वाधिष्ठानरूपश्च सर्वध्येयविवर्जितः
    । सर्वलोकनिवासात्मा सकलोत्तमवन्दितः ॥ १२४॥ देहभृद्देहकृच्चैव देहात्मा देहभावनः । देही देहविभक्तश्च
    देहभावप्रकाशनः ॥ १२५॥ लयस्थो लयविच्चैव लयाभावश्च बोधवान् । लयातीतो लयस्यान्तो लयभावनिवारणः ॥ १२६॥
    विमुखः प्रमुखश्चैव प्रत्यङ्मुखवदाचरी । विश्वभुग्विश्वधृग्विश्वो विश्वक्षेमकरस्तत्जा ॥ १२७॥ अविक्षिप्तोऽप्रमादी
    च परर्द्धिः परमार्थदृक् । स्वानुभावविहीनश्च स्वानुभावप्रकाशनः ॥ १२८॥ निरिन्द्रियश्च निर्बुद्धिर्निराभासो
    निराकृतः । निरहङ्कारश्चरूपात्मा निर्वपुः सकलाश्रयः ॥ १२९॥ शोकदुःखहरश्चैव भोगमोक्षफलप्रदः । सुप्रसन्नस्तथा
    सूक्ष्मः शब्दब्रह्मार्थसङ्ग्रहः ॥ १३०॥ आगमापायशून्यश्च स्थानदश्च सताङ्गतिः । अकृतः सुकृतश्चैव कृतकर्मा
    विनिर्वृतः ॥ १३१॥ भेदत्रयवरश्चैव देहत्रयविनिर्गतः । सर्वकाममयश्चैव सर्वकामनिवर्तकः ॥ १३२॥ सिद्धेश्वरोऽजरः
    पञ्चबाणदर्पहुताशनः । चतुरक्षरबीजात्मा स्वभूश्चित्कीर्तिभूषणः ॥ १३३॥ अगाधबुद्धिरक्षुब्धश्चन्द्रसूर्याग्निलोचनः
    । यमदंष्ट्रोऽतिसंहर्ता परमानन्दसागरः ॥ १३४॥ लीलाविश्वम्भरो भानुर्भैरवो भीमलोचनः । ब्रह्मचर्याम्बरः
    कालस्त्वचलश्चलनान्तकः ॥ १३५॥ आदिदेवो जगद्योनिर्वासवारिविमर्दनः । विकर्मकर्मकर्मज्ञोऽनन्यगमकोऽगमः ॥
    १३६॥ अबद्धकर्मशून्यश्च कामरागकुलक्षयः । योगान्धकारमथनः पद्मजन्मादिवन्दितः ॥ १३७॥ भक्तकामोऽग्रजश्चक्री
    भावनिर्भावभावकः । भेदान्तको महानग्र्यो निगूहो गोचरान्तकः ॥ १३८॥ कालाग्निशमनः शङ्खचक्रपद्मगदाधरः ।
    दीप्तो दीनपतिः शास्ता स्वच्छन्दो मुक्तिदायकः ॥ १३९॥ व्योमधर्माम्बरो भेत्ता भस्मधारी धराधरः । धर्मगुप्तोऽन्वयात्मा
    च व्यतिरेकार्थनिर्णयः ॥ १४०॥ एकानेकगुणाभासाभासनिर्भासवर्जितः । भावाभावस्वभावात्मा भावाभावविभाववित्
    ॥ १४१॥ योगिहृदयविश्रामोऽनन्तविद्याविवर्धनः । विघ्नान्तकस्त्रिकालज्ञस्तत्त्वात्मा ज्ञानसागरः ॥ १४२॥
    इतीदं दत्तसाहस्रं सायं प्रातः पठेत्तु यः । स इहामुत्र लभते निर्वाणं परमं सुखम् ॥ १४३॥ गुरुवारे दत्तभक्तो
    भक्तिभावसमन्वितः । पठेत्सदैव तो ह्येतत्स लभेच्चिन्तितं ध्रुवम् ॥ १४४॥ इति श्रीमद्दत्तात्रेयपुराणोक्तं
    श्रीमद्दत्तात्रेयसहस्रनामस्तोत्रं सम्पूर्णम् ॥
