id: kena-upanishad-part-4
category: stotram
name:
  english: Kena Upanishad - Part 4
content:
  english: sa brahmeti hovaca brahmano va etadvijaye mahiyadhvamiti tato haiva vidancakara brahmeti ||
    || tasmadva ete deva atitaramivanyandevanyadagnirvayurindraste hyenannedishtha shuste hyenatprathamo
    vidancakara brahmeti || 'titaramivanyandevansa hyenannedishtha sha sa hyenatprathamo vidancakara brahmeti
    || || tasyaisha adesho yadetadvidyuto vyadyutada ya~ddetadgacchativa ca mano 'nena caitadupasmaratyabhikshnam
    sankalpah || nnama tadvanamityupasitavyam sa ya etadevam ve~dabhi hainagm sarvani bhutani sam mbho
    bruhityukta ta upanishadbrahmim va~va ta upanishadamabrumeti || || tasyai tapo damah karmeti pratishtha
    veda ssarvangani satyamayatanam || ve~dapahatya papmanamanante svarge loke jyeye pratitishthati pratitishthati
    || || || iti kenopanishadi caturthah khandah || om apyayantu mamangani vakpranashcakshu shshrotramatho
    balamindriyani ca sarvani | sarva mma ma brahma nirakarodanirakaranamastvanirakarana 'stu | tadatmani
    nirate ya upanishatsu dharmaste mayi santu te mayi santu | om shanti shshantih || || iti kenopanishat
    ||
  devanagari: सा ब्रह्मेति होवाच ब्रह्मणो वा एतद्विजये महीयध्वमिति ततो हैव विदाञ्चकार ब्रह्मेति ॥ ॥ तस्माद्वा
    एते देवा अतितरामिवान्यान्देवान्यदग्निर्वायुरिन्द्रस्ते ह्येनन्नेदिष्ठ शुस्ते ह्येनत्प्रथमो विदाञ्चकार
    ब्रह्मेति ॥ ऽतितरामिवान्यान्देवान्स ह्येनन्नेदिष्ठ श स ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति ॥ ॥ तस्यैष
    आदेशो यदेतद्विद्युतो व्यद्युतदा यँद्देतद्गच्छतीव च मनो ऽनेन चैतदुपस्मरत्यभीक्ष्णं सङ्कल्पः ॥ न्नाम
    तद्वनमित्युपासितव्यं स य एतदेवं वेँदाभि हैनग्ं सर्वाणि भूतानि सं म्भो ब्रूहीत्युक्ता त उपनिषद्ब्राह्मीं
    वाँव त उपनिषदमब्रूमेति ॥ ॥ तस्यै तपो दमः कर्मेति प्रतिष्ठा वेदा स्सर्वाङ्गानि सत्यमायतनम् ॥ वेँदापहत्य
    पाप्मानमनन्ते स्वर्गे लोके ज्येये प्रतितिष्ठति प्रतितिष्ठति ॥ ॥ ॥ इति केनोपनिषदि चतुर्थः खण्डः ॥ ॐ
    आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षु श्श्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि । सर्व म्मा मा ब्रह्म
    निराकरोदनिराकरणमस्त्वनिराकरण ऽस्तु । तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ।
    ॐ शान्ति॒ श्शान्तिः॑ ॥ ॥ इति केनोपनिषत् ॥
