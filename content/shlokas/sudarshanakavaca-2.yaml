id: sudarshanakavaca-2
category: kavacha
name:
  english: sudarshanakavaca 2
  devanagari: सुदर्शनकवच २
content:
  english: sarvashatrukshayarthe sudarshana stotrapathe viniyogah || 1|| atha nyasah om narayana rishaye
    namah shirase svaha | om gayatri chandase namah mukhe netratrayaya vaushat | om dushtam daraya darayeti
    kilakaya namah hridaye kavacaya hum | om hram hrim hrum dvisha iti bijam guhye shikhayai vashat |
    om sudarashana jvalatpavakasankasheti kilakaya sarvange astraya phat iti rishyadi | pashcanmulamantrena
    nyasadhyanam kuryat || 2|| atha mulamantrah om hram hrim namo bhagavate bho bho sudarshanacakra dushtam
    daraya daraya duritam hana hana papam matha matha arogyam kuru kuru hum hum phat svaha | anena mulamantrena
    purashcaranam kritva tada ayudhasannidhyam bhavati bhavati || 3|| atha shatrunashana prayogamantrah
    om hrim hrim hrum sudarshanacakrarajan dushtan daha daha sarvadushtan bhayam kuru kuru vidaraya vidaraya
    paramantran grasaya grasaya bhakshaya bhakshaya dravaya dravaya hum hum phat || 4|| atha mohanamantrah
    om hum hana hana hram hram hana hana onkara hana hana om hrim sudarshanacakra sarvajanavashyam kuru
    kuru thah hra thah thah svaha || 5|| atha lakshmiprapti prayogamantrah om shrim hrim klim hram hram
    sudarshanacakra mamagrihe ashtasiddhim kuru kuru aim klim svaha || 6|| atha akarshana prayogamantrah
    om hram hrim hrim klim klim jambhaya jambhaya amukam akarshaya akarshaya mama vashyam jri jri kuru
    kuru svaha || 7|| om hram shodashavaram purakam kritva shrom hram trishashti varam kumbhakam kritva
    om hram dvatrimshadvaram recakam kuryat | iti pranayamah |
  devanagari: सर्वशत्रुक्षयार्थे सुदर्शन स्तोत्रपाठे विनियोगः ॥ १॥ अथ न्यासः ॐ नारायण ऋषये नमः शिरसे स्वाहा
    । ॐ गायत्री छन्दसे नमः मुखे नेत्रत्रयाय वौषट् । ॐ दुष्टं दारय दारयेति कीलकाय नमः हृदये कवचाय हुम्
    । ॐ ह्रां ह्रीं ह्रूं द्विष इति बीजम् गुह्ये शिखायै वषट् । ॐ सुदरशन ज्वलत्पावकसङ्काशेति कीलकाय सर्वाङ्गे
    अस्त्राय फट् इति ऋष्यादि । पश्चान्मूलमन्त्रेण न्यासध्यानं कुर्यात् ॥ २॥ अथ मूलमन्त्रः ॐ ह्रां ह्रीं
    नमो भगवते भो भो सुदर्शनचक्र दुष्टं दारय दारय दुरितं हन हन पापं मथ मथ आरोग्यं कुरु कुरु हुं हुं फट्
    स्वाहा । अनेन मूलमन्त्रेण पुरश्चरणं कृत्वा तदा आयुधसान्निध्यं भवति भवति ॥ ३॥ अथ शत्रुनाशन प्रयोगमन्त्रः
    ॐ ह्रीं ह्रीं ह्रूं सुदर्शनचक्रराजन् दुष्टान् दह दह सर्वदुष्टान् भयं कुरु कुरु विदारय विदारय परमन्त्रान्
    ग्रासय ग्रासय भक्षय भक्षय द्रावय द्रावय हुं हुं फट् ॥ ४॥ अथ मोहनमन्त्रः ॐ हुं हन हन ह्रां ह्रां हन
    हन ओङ्कार हन हन ओं ह्रीं सुदर्शनचक्र सर्वजनवश्यं कुरु कुरु ठः ह्रा ठः ठः स्वाहा ॥ ५॥ अथ लक्ष्मीप्राप्ति
    प्रयोगमन्त्रः ॐ श्रीं ह्रीं क्लीं ह्रां ह्रां सुदर्शनचक्र ममगॄहे अष्टसिद्धिं कुरु कुरु ऐं क्लीं स्वाहा
    ॥ ६॥ अथ आकर्षण प्रयोगमन्त्रः ॐ ह्रां ह्रीं ह्रीं क्लीं क्लीं जम्भय जम्भय अमुकं आकर्षय आकर्षय मम वश्यं
    ज्री ज्री कुरु कुरु स्वाहा ॥ ७॥ ॐ ह्रां षोडशवारं पूरकं कॄत्वा श्रों ह्रां त्रिषष्टि वारं कुम्भकं कृत्वा
    ॐ ह्रां द्वात्रिंशद्वारं रेचकं कुर्यात् । इति प्राणायामः ।
