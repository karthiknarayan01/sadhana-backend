id: subrahridayastotra
category: hridaya
name:
  english: subrahridayastotra
  devanagari: सुब्रह्रिदयस्तोत्र
content:
  english: rinvantu munayah sarve guhyadguhyataram mahat | subrahmanyasya hridayam sarvabhutahitodayam
    || 4|| sarvarthasiddhidam punyam sarvakaryaika sadhanam | dharmarthakamadam guhyam dhanadhanyapravardhanam
    || 5|| rahasyametaddevanam adeyam yasya kasyacit | sarvamitrakaram gopyam tejobalasamanvitam || 6||
    pravakshyami hitartham vah paritushtena cetasa | hritpadmakarnikamadhye dhyayetsarvamanoharam || 7||
    suvarnamantapandivyam ratnatoranarajitam | ratnastambha sahasraishca shobhitam paramatbhutam || 8||
    paramanandanilayam bhasvatsuryasamaprabham | devadanavagandharvagarudairyakshakinnaraih | || 9|| sevarthamagataissiddhaih
    sadhyairadhyushitam sada | mahayogindra samsevyam mandaratarumanditam || 10|| manikya vidrumaishcaiva
    maha shribhiruncitam | tanmadhye'nantaratnashri jatamakuta shobhitam || 11|| ratnasimhasanam divyam
    ravikotisamaprabham | sarvashcaryamayam punyam sarvaratna parishkritam || 12|| tanmadhyeshtadalampadmam
    udyatsurya prabhodaram | nigamagamarolambam lambakam citsvarupinim || 13|| vidya jyotirmayam divyam
    devatabhirnamaskritam | dedipyamana rucibhirvishakham sumanoharam || 14|| tanmadhye sarvalokesham
    dhyayetsarvangasundaram | anantadityasankasha mashritabhishtadayakam || 15|| acintyajnanavijnanatejobalasamarjitam
    | sarvayudha dharam viram sarvashcaryamayam guham || 16|| maharha ratnakhacitam shatkiritavirajitam
    | shashangardha kalaramya samudyadmaulibhushanam || 17|| sampurna candrasahasra samudyadvadanojvalam
    | vishala phala lalitam vilolalaka bhushanam || 18|| madanojvala kodanda mangala bhru virajitam |
    vistirnarupatejasam vilasatdvadashekshanam || 19|| carushrivarna sampurna karnashobhabhibhasuram |
    mani prabha mayura shri sphuranmakarakundalam || 20|| lasat darpana darpaghna gandasthala virajitam
    | navyakancana pushpashri nasa putavirajitam || 21|| mandahasa prabhajala madhuradhara shobhitam |
    sarvalakshana lakshmisha kambusundara kandharam || 22|| mahaniya maharatna divyahara virajitam | udagranaga
    keyura sannaddhashubhakundalam || 23|| ratnakankana samshobhi karagra shrimahojvalam | mahamanikya
    paryanka vakshasthala virajitam || 24|| samasta jagadadharam svarnavarnashubhodaram | atigambhirya
    sambhavya nabhinava saroruham || 25|| ratnasha
  devanagari: ृण्वान्तु मुनयः सर्वे गुह्याद्गुह्यतरं महत् । सुब्रह्मण्यस्य हृदयं सर्वभूतहितोदयम् ॥ ४॥
    सर्वार्थसिद्धिदं पुण्यं सर्वकार्यैक साधनम् । धर्मार्थकामदं गुह्यं धनधान्यप्रवर्धनम् ॥ ५॥ रहस्यमेतद्देवानां
    अदेयं यस्य कस्यचित् । सर्वमित्रकरं गोप्यं तेजोबलसमन्वितम् ॥ ६॥ प्रवक्ष्यामि हितार्थं वः परितुष्टेन
    चेतसा । हृत्पद्मकर्णिकामध्ये ध्यायेत्सर्वमनोहरम् ॥ ७॥ सुवर्णमण्टपन्दिव्यं रत्नतोरणराजितम् । रत्नस्तम्भ
    सहस्रैश्च शोभितं परमात्भुतम् ॥ ८॥ परमानन्दनिलयं भास्वत्सूर्यसमप्रभम् । देवदानवगन्धर्वगरुडैर्यक्षकिन्नरैः
    । ॥ ९॥ सेवार्थमागतैस्सिद्धैः साध्यैरध्युषितं सदा । महायोगीन्द्र संसेव्यं मन्दारतरुमण्डितम् ॥ १०॥ माणिक्य
    विद्रुमैश्चैव महा श्रीभिरुञ्चितम् । तन्मध्येऽनन्तरत्नश्री जटामकुट शोभितम् ॥ ११॥ रत्नसिंहासनं दिव्यं
    रविकोटिसमप्रभम् । सर्वाश्चर्यामयं पुण्यं सर्वरत्न परिष्कृतम् ॥ १२॥ तन्मध्येष्टदलम्पद्मं उद्यत्सूर्या
    प्रभोदरम् । निगामागमरोलम्बं लम्बकं चित्स्वरूपिणिम् ॥ १३॥ विद्या ज्योतिर्मयं दिव्यं देवताभिर्नमस्कृतम्
    । देदीप्यमाना रुचिभिर्विशाखं सुमनोहरम् ॥ १४॥ तन्मध्ये सर्वलोकेशं ध्यायेत्सर्वाङ्गसुन्दरम् । अनन्तादित्यसङ्काश
    माश्रिताभीष्टदायकम् ॥ १५॥ अचिन्त्यज्ञानविज्ञानतेजोबलसमार्जितम् । सर्वायुध धरं वीरं सर्वाश्चर्यामयं
    गुहम् ॥ १६॥ महर्ह रत्नखचितं षट्किरीटविराजितम् । शशाङ्गार्ध कलारम्य समुद्यद्मौलिभूषणम् ॥ १७॥ सम्पूर्ण
    चन्द्रसाहस्र समुद्यद्वदनोज्वलम् । विशाल फाल ललितं विलोलालक भूषणम् ॥ १८॥ मदनोज्वल कोदण्ड मङ्गल भ्रू
    विराजितम् । विस्तीर्णरूपतेजसं विलसत्द्वादशेक्षणम् ॥ १९॥ चारुश्रीवर्ण सम्पूर्ण कर्णशोभाभिभासुरम् ।
    मणि प्रभा मयूर श्री स्फुरन्मकरकुण्डलम् ॥ २०॥ लसत् दर्पण दर्पघ्न गण्डस्थल विराजितम् । नव्यकाञ्चन पुष्पश्री
    नासा पुटविराजितम् ॥ २१॥ मन्दहास प्रभाजाल मधुराधर शोभितम् । सर्वलक्षण लक्ष्मीश कम्बुसुन्दर कन्धरम्
    ॥ २२॥ महनीय महारत्न दिव्यहार विराजितम् । उदग्रनाग केयूर सन्नद्धशुभकुण्डलम् ॥ २३॥ रत्नकङ्कण संशोभि
    कराग्र श्रीमहोज्वलम् । महामाणिक्य पर्यङ्क वक्षस्थल विराजितम् ॥ २४॥ समस्त जगदाधारं स्वर्णवर्णशुभोदरम्
    । अतिगाम्भीर्य सम्भाव्य नाभीनव सरोरुहम् ॥ २५॥ रत्नश
