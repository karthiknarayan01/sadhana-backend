id: ganeshastutigitam
category: stotram
name:
  english: ganeshastutigitam
  devanagari: गणेशस्तुतिगीतम्
content:
  english: ganeshastutigitam hemajasutam bhaje ganeshamishanandanam ekadanta vakratunda nagayajnasutrakam
    | raktagatra dhumranetra shuklavastramanditam kalpavriksha bhakta raksha namo'stute gajananam || 1||
    pashapani cakrapani mushakadirohinam agnikoti suryajyoti vajrakoti nirmalam | citrabhala bhaktijala
    bhalacandrashobhitam kalpavriksha bhakta raksha namo'stute gajananam || 2|| bhutabhavya havyakavya
    bhrigubhargavarcitam divyavahni kalajala lokapalavanditam | purnabrahma suryavarna purusham purantakam
    kalpavriksha bhakta raksha namo'stute gajananam || 3|| vishvavirya vishvasurya vishvakarmanirmalam
    vishvaharta vishvakarta yatra tatra pujitam | caturmukham caturbhujam sevitam caturyagam kalpavriksha
    bhakta raksha namo'stute gajananam || 4|| riddhi buddhi ashtasiddhi navanidhanadayakam yajnakarma
    sarvadharma sarvavarnarcitama | puta dhumra dushta mushta dayakam vinayakam kalpavriksha bhakta raksha
    namo'stute gajananam || 5|| harsharupa varsharupa purusharupavanditam shurpakarna raktavarna raktacandanalepitam
    | yoga ishta yoga srishta yoga drishtidayakam kalpavriksha bhakta raksha namo'stute gajananam || 6||
    iti ganeshastutigitam samaptam |
  devanagari: गणेशस्तुतिगीतम् हेमजासुतं भजे गणेशमीशनन्दनं एकदन्त वक्रतुण्ड नागयज्ञसूत्रकम् । रक्तगात्र
    धूम्रनेत्र शुक्लवस्त्रमण्डितं कल्पवृक्ष भक्त रक्ष नमोऽस्तुते गजाननम् ॥ १॥ पाशपाणि चक्रपाणि मूषकादिरोहिणं
    अग्निकोटि सूर्यज्योति वज्रकोटि निर्मलम् । चित्रभाल भक्तिजाल भालचन्द्रशोभितं कल्पवृक्ष भक्त रक्ष नमोऽस्तुते
    गजाननम् ॥ २॥ भूतभव्य हव्यकव्य भृगुभार्गवार्चितं दिव्यवह्नि कालजाल लोकपालवन्दितम् । पूर्णब्रह्म सूर्यवर्ण
    पूरुषं पुरान्तकं कल्पवृक्ष भक्त रक्ष नमोऽस्तुते गजाननम् ॥ ३॥ विश्ववीर्य विश्वसूर्य विश्वकर्मनिर्मलं
    विश्वहर्ता विश्वकर्ता यत्र तत्र पूजितम् । चतुर्मुखं चतुर्भुजं सेवितं चतुर्यगं कल्पवृक्ष भक्त रक्ष
    नमोऽस्तुते गजाननम् ॥ ४॥ ऋद्धि बुद्धि अष्टसिद्धि नवनिधानदायकं यज्ञकर्म सर्वधर्म सर्ववर्णार्चितम । पूत
    धूम्र दुष्ट मुष्ट दायकं विनायकं कल्पवृक्ष भक्त रक्ष नमोऽस्तुते गजाननम् ॥ ५॥ हर्षरूप वर्षरूप पुरुषरूपवन्दितं
    शूर्पकर्ण रक्तवर्ण रक्तचन्दनलेपितम् । योग इष्ट योग सृष्ट योग दृष्टिदायकं कल्पवृक्ष भक्त रक्ष नमोऽस्तुते
    गजाननम् ॥ ६॥ इति गणेशस्तुतिगीतं समाप्तम् ।
