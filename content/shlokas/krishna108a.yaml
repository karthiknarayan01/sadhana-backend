id: krishna108a
category: stotram
name:
  english: krishna108a
  devanagari: क्रिश्न१०८अ
content:
  english: shrikrishnaprityarthe shrikrishnashtottarashatanamajape viniyogah | shrishesha uvaca | om shrikrishnah
    kamalanatho vasudevah sanatanah | vasudevatmajah punyo lilamanushavigrahah || 1|| shrivatsakaustubhadharo
    yashodavatsalo harih | caturbhujattacakrasigadashankhambujayudhah || 2|| devakinandanah shrisho nandagopapriyatmajah
    | yamunavegasamhari balabhadrapriyanujah || 3|| putanajivitaharah shakatasurabhanjanah | nandavrajajananandi
    saccidanandavigrahah || 4|| navanitanavahari mucukundaprasadakah | shodashastrisahasreshastribhango
    madhurakritih || 5|| shukavagamritabdhindurgovindo govidampatih | vatsapalanasancari dhenukasurabhanjanah
    || 6|| trinikritatrinavarto yamalarjunabhanjanah | uttalatalabhetta ca tamalashyamalakritih || 7||
    gopagopishvaro yogi suryakotisamaprabhah | ilapatih paramjyotiryadavendro yadudvahah || 8|| vanamali
    pitavasah parijatapaharakah | govardhanacaloddharta gopalah sarvapalakah || 9|| ajo niranjanah kamajanakah
    kanjalocanah | madhuha mathuranatho dvarakanayako bali || 10|| vrindavanantasancari tulasidamabhushanah
    | syamantakamanerharta naranarayanatmakah || 11|| kubjakrishnambaradharo mayi paramapurushah | mushtikasuracanuramahayuddhavisharadah
    || 12|| samsaravairi kamsarirmurarirnarakantakah | anadirbrahmacari ca krishnavyasanakarshakah ||
    13|| shishupalashiracchetta duryodhanakulantakrit | vidurakruravarado vishvarupapradarshakah || 14||
    satyavak satyasankalpah satyabhamarato jayi | subhadrapurvajo vishnurbhishmamuktipradayakah || 15||
    jagadgururjagannatho venuvadyavisharadah | venunadavisharadah vrishabhasuravidhvamsi bakarirbanabahukrit
    || 16||
  devanagari: श्रीकृष्णप्रीत्यर्थे श्रीकृष्णाष्टोत्तरशतनामजपे विनियोगः । श्रीशेष उवाच । ॐ श्रीकृष्णः कमलानाथो
    वासुदेवः सनातनः । वसुदेवात्मजः पुण्यो लीलामानुषविग्रहः ॥ १॥ श्रीवत्सकौस्तुभधरो यशोदावत्सलो हरिः ।
    चतुर्भुजात्तचक्रासिगदाशङ्खाम्बुजायुधः ॥ २॥ देवकीनन्दनः श्रीशो नन्दगोपप्रियात्मजः । यमुनावेगसंहारी
    बलभद्रप्रियानुजः ॥ ३॥ पूतनाजीवितहरः शकटासुरभञ्जनः । नन्दव्रजजनानन्दी सच्चिदानन्दविग्रहः ॥ ४॥ नवनीतनवाहारी
    मुचुकुन्दप्रसादकः । षोडशस्त्रीसहस्रेशस्त्रिभङ्गो मधुराकृतिः ॥ ५॥ शुकवागमृताब्धीन्दुर्गोविन्दो गोविदाम्पतिः
    । वत्सपालनसञ्चारी धेनुकासुरभञ्जनः ॥ ६॥ तृणीकृततृणावर्तो यमलार्जुनभञ्जनः । उत्तालतालभेत्ता च तमालश्यामलाकृतिः
    ॥ ७॥ गोपगोपीश्वरो योगी सूर्यकोटिसमप्रभः । इलापतिः परंज्योतिर्यादवेन्द्रो यदूद्वहः ॥ ८॥ वनमाली पीतवासाः
    पारिजातापहारकः । गोवर्धनाचलोद्धर्ता गोपालः सर्वपालकः ॥ ९॥ अजो निरञ्जनः कामजनकः कञ्जलोचनः । मधुहा मथुरानाथो
    द्वारकानायको बली ॥ १०॥ वृन्दावनान्तसञ्चारी तुलसीदामभूषणः । स्यमन्तकमणेर्हर्ता नरनारायणात्मकः ॥ ११॥
    कुब्जाकृष्णाम्बरधरो मायी परमपूरुषः । मुष्टिकासुरचाणूरमहायुद्धविशारदः ॥ १२॥ संसारवैरी कंसारिर्मुरारिर्नरकान्तकः
    । अनादिर्ब्रह्मचारी च कृष्णाव्यसनकर्षकः ॥ १३॥ शिशुपालशिरच्छेत्ता दुर्योधनकुलान्तकृत् । विदुराक्रूरवरदो
    विश्वरूपप्रदर्शकः ॥ १४॥ सत्यवाक् सत्यसङ्कल्पः सत्यभामारतो जयी । सुभद्रापूर्वजो विष्णुर्भीष्ममुक्तिप्रदायकः
    ॥ १५॥ जगद्गुरुर्जगन्नाथो वेणुवाद्यविशारदः । वेणुनादविशारदः वृषभासुरविध्वंसी बकारिर्बाणबाहुकृत् ॥ १६॥
