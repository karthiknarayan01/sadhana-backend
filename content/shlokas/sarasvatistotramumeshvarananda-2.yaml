id: sarasvatistotramumeshvarananda-2
category: stotram
name:
  english: sarasvatistotramumeshvarananda 2
  devanagari: सरस्वतीस्तोत्रमुमेश्वरानन्द २
content:
  english: shrisarasvatistotram navarka bimbadyuti mudgalat halat tatanka keyura kirita kankanam | sphuratkvanannupurava
    ranjitam namami kotindumukhim sarasvatim || 1|| vande sada'ham kalahamsa udvate calatpade cancala
    cancusampute | nirdhauta muktaphala hara sancayam sangharayantim subhagam sarasvatim || 2|| varabhayam
    pustaka vallakiyutam param dadhanam vimale karadvaye | namamyaham tvam shubhadam sarasvatim jaganmayim
    brahmamayim manoharam || 3|| tarangitankshaumasitambare pare dehi svarajnanamativa mangale | yenadvitiyohi
    bhaveyamakshare sarvoparisyam para rajamandale || 4|| shuklam brahmavicara sara paramamadyam jagad
    vyapini vina pustaka dharinimabhayadam jadyandhakarapaham | hastesphatikamalikam vidadhatim padmasane
    samsthitam vandetam parameshvarim bhagavatim buddhipradam sharadam || 5|| iti shri svami umeshvaranandatirthaviracitam
    sarasvatistotram sampurnam |
  devanagari: श्रीसरस्वतीस्तोत्रम् नवार्क बिम्बद्युति मुद्गलत् हलत् ताटङ्क केयूर किरीट कङ्कणम् । स्फुरत्क्वणन्नूपुराव
    रञ्जितां नमामि कोटिन्दुमुखीं सरस्वतीम् ॥ १॥ वन्दे सदाऽहं कलहंस उद्वते चलत्पदे चञ्चल चञ्चुसम्पुटे ।
    निर्धौत मुक्ताफल हार सञ्चयं सङ्घारयन्तीं सुभगां सरस्वतीम् ॥ २॥ वराभयं पुस्तक वल्लकीयुतां परं दधानं
    विमले करद्वये । नमाम्यहं त्वं शुभदां सरस्वतीं जगन्मयीं ब्रह्ममयीं मनोहराम् ॥ ३॥ तरङ्गिताङ्क्षौमसिताम्बरे
    परे देहि स्वरज्ञानमतीव मङ्गले । येनाद्वितीयोहि भवेयमक्षरे सर्वोपरिस्यां पर राजमण्डले ॥ ४॥ शुक्लां
    ब्रह्मविचार सार परमामाद्यां जगद् व्यापिनी वीणा पुस्तक धारिणीमभयदां जाड्यान्धकारापहाम् । हस्तेस्फाटिकमालिकां
    विदधतीं पद्मासने संस्थितां वन्देतां परमेश्वरीं भगवतीं बुद्धिप्रदां शारदाम् ॥ ५॥ इति श्री स्वामी उमेश्वरानन्दतीर्थविरचितं
    सरस्वतीस्तोत्रं सम्पूर्णम् ।
