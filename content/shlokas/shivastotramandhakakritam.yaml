id: shivastotramandhakakritam
category: stotram
name:
  english: shivastotramandhakakritam
  devanagari: शिवस्तोत्रमन्धककृतं
content:
  english: namami murdhna bhagavantamekam samahita yam vidurishatattvam | puratanam punyamanantarupam
    kalam kavim yogaviyogahetum || 28|| damshtrakaralam divi nrityamanam hutashavaktram jvalanarkarupam
    | sahasrapadakshishirobhiyuktam bhavantamekam pranamami rudram || 29|| jayadidevamarapujitanghre vibhagahinamalatattvarupam
    | tvamagnireko bahudha vibhajyase vadyadibhedairakhilatmarupah || 30|| tvamekamahuh purusham puranamadityavarnam
    tamasah parastat | tvam pashyasidam paripalyajasram tvamantako yogiganabhijushtah || 31|| ekantaratma
    bahudha nivishti deheshu dehadivisheshahinah | tvamatmatattvam paramarthashabdam bhavantamahuh shivameva
    kecit || 32|| tvamaksharam brahma param pavitramanandarupam pranavabhidhanam | tvamishvaro vedavideshu
    siddhah svayambhuvo'sheshavisheshahinah || 33|| tvamindrarupo varuno'gnirupo hamsah prano mrityurannadhiyajnah
    | prajapatirbhagavanekarupo nilagriva stuyase vedavidbhih || 34|| narayanastvam jagatamanadih pitamahastvam
    prapitamahashca | vedantaguhyopanishatsu gitah sadashivastvam parameshvaro'si || 35|| namah parastattamasah
    parasmai paratmane pancaparantaraya || trimurtyatitaya niranjanaya sahasrashaktyasanasamsthitaya ||
    36|| trimurtaye'nantaparatmamurtaye jagannivasaya jaganmayaya | namo lalatarpitalocanaya namo jananam
    hridi samsthitaya || 37|| phanindraharaya namo'stu tubhyam munindrasiddharcitapadapadma || aishvaryadharmasanasamsthitaya
    namah parantaya bhavodbhavaya || 38|| sahasracandrarkasamuhamurtaye namo'gnicandrarkatrilocanaya |
    namo'stu somayanamadhyamaya namo'stu devaya hiranyabahave || 39|| namo'tiguhyaya guhantaraya vedantavijnanavinishcitaya
    | trikalahinamaladhamadhamne namo maheshaya namah shivaya || 40|| stavenanena bhagavanprito bhutva'tha
    bhairavah | avarohya ca shulagraduvaca parameshvarah || 41|| tvaya'ham stotravaryena topito daityapungava
    | prito'smi tava dasyami ganapatyam hi durlabham || 42|| nandishvarasamo vatsa bhringi nama gano bhava
    | evam labdhavaro daityah kotisuryasamaprabhah || 43|| nilakanthastrinetrashca vrishaketurjatadharah
    | tam drishtva devatah sarva harshanirbharamanasah || 44|| tushtuvurganarajam tam bhairavasya samipagam
    | iti saurapurane ekonatrimshatyadhyayantargatam andhakakritam shivastotram sampurnam |
  devanagari: नमामि मूर्ध्ना भगवन्तमेकं समाहिता यं विदुरीशतत्त्वम् । पुरातनं पुण्यमनन्तरूपं कालं कविं
    योगवियोगहेतुम् ॥ २८॥ दंष्ट्राकरालं दिवि नृत्यमानं हुताशवक्त्रं ज्वलनार्करूपम् । सहस्रपादाक्षिशिरोभियुक्तं
    भवन्तमेकं प्रणमामि रुद्रम् ॥ २९॥ जयादिदेवामरपूजिताङ्घ्रे विभागहीनामलतत्त्वरूपम् । त्वमग्निरेको बहुधा
    विभज्यसे वाद्यादिभेदैरखिलात्मरूपः ॥ ३०॥ त्वामेकमाहुः पुरुषं पुराणमादित्यवर्णं तमसः परस्तात् । त्वं
    पश्यसीदं परिपाल्यजस्रं त्वमन्तको योगिगणाभिजुष्टः ॥ ३१॥ एकान्तरात्मा बहुधा निविष्टी देहेषु देहादिविशेषहीनः
    । त्वमात्मतत्त्वं परमार्थशब्दं भवन्तमाहुः शिवमेव केचित् ॥ ३२॥ त्वमक्षरं ब्रह्म परं पवित्रमानन्दरूपं
    प्रणवाभिधानम् । त्वमीश्वरो वेदविदेषु सिद्धः स्वायम्भुवोऽशेषविशेषहीनः ॥ ३३॥ त्वमिन्द्ररूपो वरुणोऽग्निरूपो
    हंसः प्राणो मृत्युरन्नाधियज्ञः । प्रजापतिर्भगवानेकरूपो नीलग्रीव स्तूयसे वेदविद्भिः ॥ ३४॥ नारायणस्त्वं
    जगतामनादिः पितामहस्त्वं प्रपितामहश्च । वेदान्तगुह्योपनिषत्सु गीतः सदाशिवस्त्वं परमेश्वरोऽसि ॥ ३५॥
    नमः परस्तात्तमसः परस्मै परात्मने पञ्चपरान्तराय ॥ त्रिमूर्त्यतीताय निरञ्जनाय सहस्रशक्त्यासनसंस्थिताय
    ॥ ३६॥ त्रिमूर्तयेऽनन्तपरात्ममूर्तये जगन्निवासाय जगन्मयाय । नमो ललाटार्पितलोचनाय नमो जनानां हृदि संस्थिताय
    ॥ ३७॥ फणीन्द्रहाराय नमोऽस्तु तुभ्यं मुनीन्द्रसिद्धार्चितपादपद्म ॥ ऐश्वर्यधर्मासनसंस्थिताय नमः परान्ताय
    भवोद्भवाय ॥ ३८॥ सहस्रचन्द्रार्कसमूहमूर्तये नमोऽग्निचन्द्रार्कत्रिलोचनाय । नमोऽस्तु सोमायनमध्यमाय नमोऽस्तु
    देवाय हिरण्यबाहवे ॥ ३९॥ नमोऽतिगुह्याय गुहान्तराय वेदान्तविज्ञानविनिश्चिताय । त्रिकालहीनामलधामधाम्ने
    नमो महेशाय नमः शिवाय ॥ ४०॥ स्तवेनानेन भगवान्प्रीतो भूत्वाऽथ भैरवः । अवरोह्य च शूलाग्रादुवाच परमेश्वरः
    ॥ ४१॥ त्वयाऽहं स्तोत्रवर्येण तोपितो दैत्यपुङ्गव । प्रीतोऽस्मि तव दास्यामि गाणपत्यं हि दुर्लभम् ॥ ४२॥
    नन्दीश्वरसमो वत्स भृङ्गी नाम गणो भव । एवं लब्धवरो दैत्यः कोटिसूर्यसमप्रभः ॥ ४३॥ नीलकण्ठस्त्रिनेत्रश्च
    वृषकेतुर्जटाधरः । तं दृष्ट्वा देवताः सर्वा हर्षनिर्भरमानसाः ॥ ४४॥ तुष्टुवुर्गणराजं तं भैरवस्य समीपगम्
    । इति सौरपुराणे एकोनत्रिंशत्यध्यायान्तर्गतं अन्धककृतं शिवस्तोत्रं सम्पूर्णम् ।
