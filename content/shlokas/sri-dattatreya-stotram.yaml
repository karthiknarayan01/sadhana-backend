id: sri-dattatreya-stotram
category: stotram
name:
  english: Sri Dattatreya Stotram
content:
  english: jatadharam pandurangam shulahastam kripanidhim | sarvarogaharam devam dattatreyamaham bhaje
    || || asya shridattatreyastotramantrasya bhagavannaradrishih | anushtup chandah | shridattah paramatma
    devata | shridattatreya prityarthe jape viniyogah || narada uvaca | jagadutpattikartre ca sthitisamharahetave
    | bhavapashavimuktaya dattatreya namo'stu te || || jarajanmavinashaya dehashuddhikaraya ca | digambara
    dayamurte dattatreya namo'stu te || || karpurakantidehaya brahmamurtidharaya ca | vedashastraparijnaya
    dattatreya namo'stu te || || hrasvadirghakrishasthulanamagotravivarjita | pancabhutaikadiptaya dattatreya
    namo'stu te || || yajnabhokte ca yajnaya yajnarupadharaya ca | yajnapriyaya siddhaya dattatreya namo'stu
    te || || adau brahma harirmadhye hyante devassadashivah | murtitrayasvarupaya dattatreya namo'stu
    te || || bhogalayaya bhogaya yogayogyaya dharine | jitendriya jitajnaya dattatreya namo'stu te ||
    || digambaraya divyaya divyarupadharaya ca | sadoditaparabrahma dattatreya namo'stu te || || jambudvipe
    mahakshetre matapuranivasine | jayamana satam deva dattatreya namo'stu te || || bhikshatanam grihe
    grame patram hemamayam kare | nanasvadamayi bhiksha dattatreya namo'stu te || || brahmajnanamayi mudra
    vastre cakashabhutale | prajnanaghanabodhaya dattatreya namo'stu te || || avadhuta sadananda parabrahmasvarupine
    | videhadeharupaya dattatreya namo'stu te || || satyarupa sadacara satyadharmaparayana | satyashrayaparokshaya
    dattatreya namo'stu te || || shulahastagadapane vanamalasukandhara | yajnasutradhara brahman dattatreya
    namo'stu te || || ksharaksharasvarupaya paratparataraya ca | dattamuktiparastotra dattatreya namo'stu
    te || || datta vidyadhya lakshmisha datta svatmasvarupine | gunanirgunarupaya dattatreya namo'stu
    te || || shatrunashakaram stotram jnanavijnanadayakam | sarvapapam shamam yati dattatreya namo'stu
    te || || idam stotram mahaddivyam dattapratyakshakarakam | dattatreyaprasadacca naradena prakirtitam
    || || iti shrinaradapurane naradaviracitam shri dattatreya stotram |
  devanagari: जटाधरं पाण्डुराङ्गं शूलहस्तं कृपानिधिम् । सर्वरोगहरं देवं दत्तात्रेयमहं भजे ॥ ॥ अस्य श्रीदत्तात्रेयस्तोत्रमन्त्रस्य
    भगवान्नारदृषिः । अनुष्टुप् छन्दः । श्रीदत्तः परमात्मा देवता । श्रीदत्तात्रेय प्रीत्यर्थे जपे विनियोगः
    ॥ नारद उवाच । जगदुत्पत्तिकर्त्रे च स्थितिसंहारहेतवे । भवपाशविमुक्ताय दत्तात्रेय नमोऽस्तु ते ॥ ॥ जराजन्मविनाशाय
    देहशुद्धिकराय च । दिगम्बर दयामूर्ते दत्तात्रेय नमोऽस्तु ते ॥ ॥ कर्पूरकान्तिदेहाय ब्रह्ममूर्तिधराय
    च । वेदशास्त्रपरिज्ञाय दत्तात्रेय नमोऽस्तु ते ॥ ॥ ह्रस्वदीर्घकृशस्थूलनामगोत्रविवर्जित । पञ्चभूतैकदीप्ताय
    दत्तात्रेय नमोऽस्तु ते ॥ ॥ यज्ञभोक्ते च यज्ञाय यज्ञरूपधराय च । यज्ञप्रियाय सिद्धाय दत्तात्रेय नमोऽस्तु
    ते ॥ ॥ आदौ ब्रह्मा हरिर्मध्ये ह्यन्ते देवस्सदाशिवः । मूर्तित्रयस्वरूपाय दत्तात्रेय नमोऽस्तु ते ॥ ॥
    भोगालयाय भोगाय योगयोग्याय धारिणे । जितेन्द्रिय जितज्ञाय दत्तात्रेय नमोऽस्तु ते ॥ ॥ दिगम्बराय दिव्याय
    दिव्यरूपधराय च । सदोदितपरब्रह्म दत्तात्रेय नमोऽस्तु ते ॥ ॥ जम्बूद्वीपे महाक्षेत्रे मातापुरनिवासिने
    । जयमान सतां देव दत्तात्रेय नमोऽस्तु ते ॥ ॥ भिक्षाटनं गृहे ग्रामे पात्रं हेममयं करे । नानास्वादमयी
    भिक्षा दत्तात्रेय नमोऽस्तु ते ॥ ॥ ब्रह्मज्ञानमयी मुद्रा वस्त्रे चाकाशभूतले । प्रज्ञानघनबोधाय दत्तात्रेय
    नमोऽस्तु ते ॥ ॥ अवधूत सदानन्द परब्रह्मस्वरूपिणे । विदेहदेहरूपाय दत्तात्रेय नमोऽस्तु ते ॥ ॥ सत्यरूप
    सदाचार सत्यधर्मपरायण । सत्याश्रयपरोक्षाय दत्तात्रेय नमोऽस्तु ते ॥ ॥ शूलहस्तगदापाणे वनमालासुकन्धर ।
    यज्ञसूत्रधर ब्रह्मन् दत्तात्रेय नमोऽस्तु ते ॥ ॥ क्षराक्षरस्वरूपाय परात्परतराय च । दत्तमुक्तिपरस्तोत्र
    दत्तात्रेय नमोऽस्तु ते ॥ ॥ दत्त विद्याढ्य लक्ष्मीश दत्त स्वात्मस्वरूपिणे । गुणनिर्गुणरूपाय दत्तात्रेय
    नमोऽस्तु ते ॥ ॥ शत्रुनाशकरं स्तोत्रं ज्ञानविज्ञानदायकम् । सर्वपापं शमं याति दत्तात्रेय नमोऽस्तु ते
    ॥ ॥ इदं स्तोत्रं महद्दिव्यं दत्तप्रत्यक्षकारकम् । दत्तात्रेयप्रसादाच्च नारदेन प्रकीर्तितम् ॥ ॥ इति
    श्रीनारदपुराणे नारदविरचितं श्री दत्तात्रेय स्तोत्रम् ।
