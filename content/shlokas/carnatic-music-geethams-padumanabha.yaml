id: carnatic-music-geethams-padumanabha
category: stotram
name:
  english: Carnatic Music Geethams - Padumanabha
content:
  english: mayamalava gaula janyaragam tisra jati triputa talam angah kannada pallavi padumanabha paramapurusha
    paranjyoti svarupa viduravandya vimalacarita vihangadi rohana anupallavi udadhinivasa uraga shayana
    unna tonnata mahima yadukulottama yajna rakshaka yajna shikshaka rama nama caranam vibhishana palaka
    namo namo ibhavaradayaka namo namo shubhaprada sumanorada su rendra manoranjana abhinava purandhara
    vi svarah pallavi ri sa da || pa ra ma | pu ru | sha | da pa | ma pa || da da pa | ma ga | ri sa ||
    pa ram | da pa | ma pa || da da pa | ma ga | ri sa || vi ham || anupallavi pa ma pa | da sa | da pa
    || u da dhi | ni va | ma | ma ga | ri sa || ya du ku | lo | da pa | ma pa || da da pa | ma ga | ri
    sa || vi bhi | da pa | ma pa || da da pa | ma ga | ri sa || i bha | na mo | na mo || pa ma pa | da
    sa ma | ma ga | ri sa || a bhi na | va pa | ma ga | ri sa || ththa
  devanagari: मायामालव गौल जन्यरागम् तिस्र जाति त्रिपुट तालम् अङ्गाः कन्नड पल्लवि पदुमनाभ परमपुरुषा परञ्ज्योति
    स्वरूप विदुरवन्द्य विमलचरित विहङ्गादि रोहण अनुपल्लवि उदधिनिवास उरग शयन उन्न तोन्नत महिमा यदुकुलोत्तम
    यज्ञ रक्षक यज्ञ शिक्षक राम नाम चरणम् विभीषण पालक नमो नमो इभवरदायक नमो नमो शुभप्रद सुमनोरद सु रेन्द्र
    मनोरञ्जन अभिनव पुरन्धर वि स्वराः पल्लवि रि स द ॥ प र म । पु रु । षा । द प । म प ॥ द द प । म ग । रि
    स ॥ प रं । द प । म प ॥ द द प । म ग । रि स ॥ वि हं ॥ अनुपल्लवि प म प । द स । द प ॥ उ द धि । नि वा ।
    म । म ग । रि स ॥ य दु कु । लो । द प । म प ॥ द द प । म ग । रि स ॥ वि भी । द प । म प ॥ द द प । म ग ।
    रि स ॥ इ भ । न मो । न मो ॥ प म प । द स म । म ग । रि स ॥ अ भि न । व प । म ग । रि स ॥ ठ्ठ
