id: dashavatara-stuti
category: stotram
name:
  english: Dashavatara Stuti
content:
  english: namasmaranadanyopayam na hi pashyamo bhavatarane | rama hare krishna hare tava nama vadami
    sada nrihare || vedoddharavicaramate somakadanavasamharane | minakarasharira namo bhaktam te paripalaya
    mam || || manthanacaladharanaheto devasura paripala vibho | kurmakarasharira namo bhaktam te paripalaya
    mam || || bhucorakahara punyamate kridoddhritabhudevahare | krodakarasharira namo bhaktam te paripalaya
    mam || || hiranyakashipucchedanaheto prahlada'bhayadharanaheto | narasimhacyutarupa namo bhaktam te
    paripalaya mam || || bhavabandhanahara vitatamate padodakavihataghatate | vatupatuveshamanojna namo
    bhaktam te paripalaya mam || || kshitipativamshakshayakaramurte kshitipatikartaharamurte | bhrigukularama
    paresha namo bhaktam te paripalaya mam || || sitavallabha dasharathe dasharathanandana lokaguro |
    ravanamardana rama namo bhaktam te paripalaya mam || || krishnananta kripajaladhe kamsare kamalesha
    hare | kaliyamardana lokaguro bhaktam te paripalaya mam || || danavasatimanapahara tripuravijayamardanarupa
    | buddhajnaya ca bauddha namo bhaktam te paripalaya mam || || shishtajanavana dushtahara khagaturagottamavahana
    te | kalkirupaparipala namo bhaktam te paripalaya mam || || namasmaranadanyopayam na hi pashyamo bhavatarane
    | rama hare krishna hare tava nama vadami sada nrihare || iti dashavatara stutih |
  devanagari: नामस्मरणादन्योपायं न हि पश्यामो भवतरणे । राम हरे कृष्ण हरे तव नाम वदामि सदा नृहरे ॥ वेदोद्धारविचारमते
    सोमकदानवसंहरणे । मीनाकारशरीर नमो भक्तं ते परिपालय माम् ॥ ॥ मन्थानाचलधारणहेतो देवासुर परिपाल विभो ।
    कूर्माकारशरीर नमो भक्तं ते परिपालय माम् ॥ ॥ भूचोरकहर पुण्यमते क्रीडोद्धृतभूदेवहरे । क्रोडाकारशरीर
    नमो भक्तं ते परिपालय माम् ॥ ॥ हिरण्यकशिपुच्छेदनहेतो प्रह्लादाऽभयधारणहेतो । नरसिंहाच्युतरूप नमो भक्तं
    ते परिपालय माम् ॥ ॥ भवबन्धनहर विततमते पादोदकविहताघतते । वटुपटुवेषमनोज्ञ नमो भक्तं ते परिपालय माम्
    ॥ ॥ क्षितिपतिवंशक्षयकरमूर्ते क्षितिपतिकर्ताहरमूर्ते । भृगुकुलराम परेश नमो भक्तं ते परिपालय माम् ॥
    ॥ सीतावल्लभ दाशरथे दशरथनन्दन लोकगुरो । रावणमर्दन राम नमो भक्तं ते परिपालय माम् ॥ ॥ कृष्णानन्त कृपाजलधे
    कंसारे कमलेश हरे । कालियमर्दन लोकगुरो भक्तं ते परिपालय माम् ॥ ॥ दानवसतिमानापहर त्रिपुरविजयमर्दनरूप
    । बुद्धज्ञाय च बौद्ध नमो भक्तं ते परिपालय माम् ॥ ॥ शिष्टजनावन दुष्टहर खगतुरगोत्तमवाहन ते । कल्किरूपपरिपाल
    नमो भक्तं ते परिपालय माम् ॥ ॥ नामस्मरणादन्योपायं न हि पश्यामो भवतरणे । राम हरे कृष्ण हरे तव नाम वदामि
    सदा नृहरे ॥ इति दशावतार स्तुतिः ।
