id: devidashashloki
category: stotram
name:
  english: devidashashloki
  devanagari: देविदशश्लोकी
content:
  english: ankanupeta shashi samkasha vaktra kamalam || 7 jambhari kumbhi prithu kumbhapahasi kuca sambhavya
    hara tilaka rambha karimdra kara dambhapahoru gati dimbha anuramjita pada | shambha udara parirambhankurat
    pulaka dambhanuraga pishuna sham bhasura abharana gumpha sada dishatu shumbhasura praharana || 8 dakshayani
    danuja shiksha vidhau vitata diksha manohara guna bhikshashino natana viksha vinoda mukha dakshadhvara
    praharana | viksham vidhehi mayi daksha svakiya jana paksha vipaksha vimukhi yakshesha sevita nirakshepa
    shakti jaya lakshyavadhana kalana || 9 dakshayani
  devanagari: अङ्कानुपेत शशि संकाश वक्त्र कमलाम् ॥ ७ जंभारि कुंभि पृथु कुंभापहासि कुच संभाव्य हार तिलका
    रंभा करींद्र कर दंभापहोरु गति डिंभा अनुरंजित पदा । शंभा उदार परिरंभाङ्कुरात् पुलक दंभानुराग पिशुना
    शम् भासुर आभरण गुंफा सदा दिशतु शुंभासुर प्रहरणा ॥ ८ दाक्षायणी दनुज शिक्षा विधौ वितत दीक्षा मनोहर गुणा
    भिक्षाशिनो नटन वीक्षा विनोद मुख दक्षाध्वर प्रहरणा । वीक्षाम् विधेहि मयि दक्षा स्वकीय जन पक्षा विपक्ष
    विमुखी यक्षेश सेवित निराक्षेप शक्ति जय लक्ष्यावधान कलना ॥ ९ दाक्षायणी
