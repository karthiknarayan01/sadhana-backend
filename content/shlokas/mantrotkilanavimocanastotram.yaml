id: mantrotkilanavimocanastotram
category: mantra
name:
  english: mantrotkilanavimocanastotram
  devanagari: मन्त्रोत्कीलनविमोचनस्तोत्रम्
content:
  english: am am brahma im im svarupi em aim utkilani vimuncati | am ah prakashayanti mama manastu sarvamantrasiddhipradayini
    || 1 yatha ca varnarupani namakarmatmika para | tvayaitatsrijyate sarva palyate ca tathaiva ca ||
    2 srishtisthitikari caiva sarvapralayakarini | niranjanasya devasya nama karmavidhayini || 3 baddho
    vimucyate sarva tvayaiva brahmarupini | tvamadyananta shaktinam pravaho jayate taya || 4 samsmritapujita'nanta
    yoginamapi siddhida | tvayabrahmavirincadya bhramante nija karmana || 5 tathaiva ca mahavishnuh sarvadevastuti
    tatah | sa tushta sarva mantranam mritanam cetani sada || 6 mritasanjivanishambho prasadacchukra siddhida
    | brahmandam cetayanti vividha suraganan pramodaih pritah | sandipayanti nijaguna vitataih shadgunan
    prerayanti | varnandevan jayanti ditisuta damani sapya hunkara kartri kshetri tasyaiva japyam svara
    vitatanutam mocayecchaya jatam || idam mahatripura sundari stotram pathet bhaktyastu yo narah | sarvankamanavapnoti
    sarvasiddhih bhavet dhruvam || iti shivarahasye pancaratre madhyama samhitayam shivashakti samvade
    shaiva vaishnava shakti saura ganapatya mantrotkilana vimocana stotram sampurnam ||
  devanagari: अं आं ब्रह्म इं ईं स्वरूपी एं ऐं उत्कीलनी विमुञ्चती । अं अः प्रकाशयन्ती मम मनास्तु सर्वमन्त्रसिद्धिप्रदायिनी
    ॥ १ यथा च वर्णरूपाणि नामकर्मात्मिका परा । त्वयैतत्सृज्यते सर्व पाल्यते च तथैव च ॥ २ सृष्टिस्थितिकरी
    चैव सर्वप्रलयकारिणी । निरञ्जनस्य देवस्य नाम कर्मविधायिनी ॥ ३ बद्धो विमुच्यते सर्व त्वयैव ब्रह्मरूपिणी
    । त्वमाद्यानन्त शक्तीनां प्रवाहो जायते तया ॥ ४ संस्मृतापूजिताऽनन्ता योगिनामपि सिद्धिदा । त्वयाब्रह्मविरिञ्चाद्या
    भ्रमन्ते निज कर्मणा ॥ ५ तथैव च महाविष्णुः सर्वदेवस्तुति ततः । सा तुष्टा सर्व मन्त्राणां मृतानां चेतनी
    सदा ॥ ६ मृतसञ्जीवनीशम्भो प्रसादाच्छुक्र सिद्धिदा । ब्रह्माण्डं चेतयन्ती विविध सुरगणान् प्रमोदैः प्रीताः
    । सन्दीपयन्ति निजगुण विततैः षड्गुणान् प्रेरयन्ती । वर्णान्देवान् जयन्ती दितिसुत दमनी साप्य हुङ्कार
    कार्त्री क्षेत्री तस्यैव जाप्यं स्वर विततनुतां मोचयेच्छाय जातम् ॥ इदं महात्रिपुर सुन्दरी स्तोत्रं
    पठेत् भक्त्यास्तु यो नरः । सर्वान्कामानवाप्नोति सर्वसिद्धिः भवेत् ध्रुवम् ॥ इति शिवरहस्ये पञ्चरात्रे
    मध्यम संहितायां शिवशक्ति संवादे शैव वैष्णव शक्ति सौर गाणपत्य मन्त्रोत्कीलन विमोचन स्तोत्रं सम्पूर्णम्
    ॥
