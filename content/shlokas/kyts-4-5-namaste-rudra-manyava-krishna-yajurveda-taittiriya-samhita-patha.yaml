    नमो॒ नमः॑ सू॒ताया रोहि॑ताय स्थ॒पत॑ये वृ॒क्षाणा॒ म्पत॑ये॒ नमो॒ नमो॑ म॒न्त्रिणे॑ वाणि॒जाय॒ कक्षा॑णा॒
    म्पत॑ये॒ नमो॒ नमो॑ भुव॒न्तये॑ वारिवस्कृ॒ता म्पत॑ये॒ नमो॒ नम॑ उ॒च्चै र्घो॑षाया क्र॒न्दय॑ते पत्ती॒ना
