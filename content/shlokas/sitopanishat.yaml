id: sitopanishat
category: upanishad
name:
  english: sitopanishat
  devanagari: सीतोपनिषत्
content:
  english: khanasaparvatah | tatparvate karmajnanamayibhirbahushakha bhavanti ||20|| tatratrayimayam shastramadyam
    sarvarthadarshanam | rigyajuhsamarupatvattrayiti parikirtita ||21|| hetuna karyasiddhena caturdha
    parikirtita | rico yajumshi samani atharvangirasastatha ||22|| caturhotrapradhanatvallingaditritayam
    trayi | atharvangirasam rupam samarigyajuratmakam ||23|| tatha dishantyabhicarasamanyena prithakprithak
    | ekavimshatishakhayamrigvedah parikirtitah ||24|| shatam ca navashakhasu yajushameva janmanam | samnah
    sahasrashakhah syuh pancashakha atharvanah ||25|| vaikhanasamatastasminnadau pratyakshadarshanam |
    smaryate munibhirnityam vaikhanasamatah param ||26|| kalpo vyakaranam shiksha niruktam jyotisham chanda
    etani shadangani ||27|| upangamayanam caiva mimamsanyayavistarah | dharmajnasevitartham ca vedavedo'dhikam
    tatha ||28|| nibandhah sarvashakha ca samayacarasangatih | dharmashastram maharshinamantahkaranasambhritam
    | itihasapuranakhyamupangam ca prakirtitam ||29|| vastuvedo dhanurvedo gandharvashca tatha mune |
    ayurvedashca pancaite upavedah prakirtita
  devanagari: खानसपर्वतः । तत्पर्वते कर्मज्ञानमयीभिर्बहुशाखा भवन्ति ॥२०॥ तत्रत्रयीमयं शास्त्रमाद्यं सर्वार्थदर्शनम्
    । ऋग्यजुःसामरूपत्वात्त्रयीति परिकीर्तिता ॥२१॥ हेतुना कार्यसिद्धेन चतुर्धा परिकीर्तिता । ऋचो यजूंषि
    सामानि अथर्वाङ्गिरसस्तथा ॥२२॥ चातुर्होत्रप्रधानत्वाल्लिङ्गादित्रितयं त्रयी । अथर्वाङ्गिरसं रूपं सामऋग्यजुरात्मकम्
    ॥२३॥ तथा दिशन्त्याभिचारसामान्येन पृथक्पृथक् । एकविंशतिशाखायामृग्वेदः परिकीर्तितः ॥२४॥ शतं च नवशाखासु
    यजुषामेव जन्मनाम् । साम्नः सहस्रशाखाः स्युः पञ्चशाखा अथर्वणः ॥२५॥ वैखानसमतस्तस्मिन्नादौ प्रत्यक्षदर्शनम्
    । स्मर्यते मुनिभिर्नित्यं वैखानसमतः परम् ॥२६॥ कल्पो व्याकरणं शिक्षा निरुक्तं ज्योतिषं छन्द एतानि षडङ्गानि
    ॥२७॥ उपाङ्गमयनं चैव मीमांसान्यायविस्तरः । धर्मज्ञसेवितार्थं च वेदवेदोऽधिकं तथा ॥२८॥ निबन्धाः सर्वशाखा
    च समयाचारसङ्गतिः । धर्मशास्त्रं महर्षिणामन्तःकरणसम्भृतम् । इतिहासपुराणाख्यमुपाङ्गं च प्रकीर्तितम्
    ॥२९॥ वास्तुवेदो धनुर्वेदो गान्धर्वश्च तथा मुने । आयुर्वेदश्च पञ्चैते उपवेदाः प्रकीर्तिता
