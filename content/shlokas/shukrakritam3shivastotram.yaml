id: shukrakritam3shivastotram
category: stotram
name:
  english: shukrakritam3shivastotram
  devanagari: शुक्रकृतं३शिवस्तोत्रम्
content:
  english: shukrakritam 3 shivastotram shukra uvaca | varadaya namastubhyam haraya gunashaline | shankaraya
    maheshaya tryambakaya namo namah || 29|| jivanaya namastubhyam lokanatha vrishakape | madanagne kalashatro
    vamadevaya te namah || 30|| sthanave vishvarupaya vamanaya sadagate | mahadevaya sharvaya ishvaraya
    namo namah || 31|| trinayana hara bhava shankara umapate jimutaketo grihagriha shmashananirata bhutivilepana
    shulapane pashupate gopate tatpurushasattama namo namaste | iti vamanapurane ekonasaptatitamadhyayantargatam
    shukramaharshikritam shivastotram samaptam | vamanapurana | adhyaya 69
  devanagari: शुक्रकृतं ३ शिवस्तोत्रम् शुक्र उवाच । वरदाय नमस्तुभ्यं हराय गुणशालिने । शङ्कराय महेशाय त्र्यम्बकाय
    नमो नमः ॥ २९॥ जीवनाय नमस्तुभ्यं लोकनाथ वृषाकपे । मदनाग्ने कालशत्रो वामदेवाय ते नमः ॥ ३०॥ स्थाणवे विश्वरूपाय
    वामनाय सदागते । महादेवाय शर्वाय ईश्वराय नमो नमः ॥ ३१॥ त्रिनयन हर भव शङ्कर उमापते जीमूतकेतो गृहागृह
    श्मशाननिरत भूतिविलेपन शूलपाणे पशुपते गोपते तत्पुरुषसत्तम नमो नमस्ते । इति वामनपुराणे एकोनसप्ततितमाध्यायान्तर्गतं
    शुक्रमहर्षिकृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ६९
meaning: {}
