id: r-04
category: veda
name:
  english: r 04
  devanagari: र् ०४
content:
  english: 02 sakhe̱ sakha̭yama̱bhya va̭vritsva̱shum na ca̱kram rathyḙva̱ ramhya̱smabhya̭m dasma̱ ramhya̭
    | agnḙ mriḻi̱kam varṷne̱ saca̭ vido ma̱rutsṷ vi̱shvabha̭nushu | to̱kaya̭ tu̱je shṷshucana̱ sham
    kri̭dhya̱smabhya̭m dasma̱ sham kri̭dhi || 4
  devanagari: ०२ सखे॒ सखा॑यम॒भ्या व॑वृत्स्वा॒शुं न च॒क्रं रथ्ये॑व॒ रंह्या॒स्मभ्यं॑ दस्म॒ रंह्या॑ । अग्ने॑
    मृळी॒कं वरु॑णे॒ सचा॑ विदो म॒रुत्सु॑ वि॒श्वभा॑नुषु । तो॒काय॑ तु॒जे शु॑शुचान॒ शं कृ॑ध्य॒स्मभ्यं॑ दस्म॒
    शं कृ॑धि ॥ ४
meaning: {}
