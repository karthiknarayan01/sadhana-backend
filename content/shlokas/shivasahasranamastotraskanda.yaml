id: shivasahasranamastotraskanda
category: sahasranama
name:
  english: shivasahasranamastotraskanda
  devanagari: शिवसहस्रनामस्तोत्रस्कन्द
content:
  english: om harashshambhurmahadevo nilakanthassadashivah | bharta varah pandaranga anandashshantavigrahah
    || 1|| eko'nanto mrigadharah shulapanirbhavah shivah | vahnimadhyanato muktah svayambhurnishinartanah
    || 2|| nandi parashupanishca jyotirbhasmangaragabhrit | gajotpadi kapali ca nityashshuddho'gnidharakah
    || 3|| shankaro bhuratho merucapo vrishabhavahanah | utpattishunyo bhutesho nagabharanadharanah ||
    4|| umardhadehi himavajjamata bharga uttamah | umapatirvahnipanishchetta pralayanirbhayah || 5|| ekarudrah
    parthabanaprado rudro'tiviryavan | ravicakrarathastadvatsomacakrarathahsmritah || 6|| digambarassarvaneta
    vishnumatsyanibarhakah | matsyanetrapaharica matsyanetra vibhushanah || 7|| matsyapujitapadashca tathaiva
    kamalasanah | vedavedyah smritastadvadvedashvaratha iritah || 8|| vedashca vedakaupino vedanupurakastatha
    | vedavakyo vedamurtirvedanto vedapujitah || 9|| sarveshvaro nadavacyo brahmamurdhanikrintanah | tandavashcamritastadvadurdhvatandavapanditah
    || 10|| anandashcanda anandatandavah pushadantabhit | bhaganetraharastadvadgajacarmambarapriyah ||
    11|| kamantako vyaghrabhedi mrigi caikangakastatha | nirvikarah pashupatissarvatmagocarastatha ||
    12|| agrinetro bhanunetrashcandranetro'pi kathyate | kurmanigrahakah kurmakapalaharakastatha || 13||
    kurmapujyastatha kurmakapalabharanastatha | vyaghracarmambarah svami tatha pashavimocakah || 14||
    onkarabhenad dvandvabhanjakajnanamurtayah | vishnubano ganapatih puto'yantu puratanah || 15|| bhutanushca
    kripamurtih vishnutpadakapadavan| subrahmanyapita brahmapita sthanuratha smritah || 16|| arbhakakshirajaladhiprado
    potrivibhedakah | potridantapahari ca potridantavibhushanah || 17|| potripujitapadashca candrapushpeshukastatha
    | sarvopadanakastadvadardrabho'gnisamakritih || 18|| matapitrivihinashca dharmadharmavubhavapi | niyuktarathasarathyabrahmapujitapadavan
    || 19|| raktapingajato vishnurabhayo bhanudipavan| bhutaseno mahayogi yogi kaliyanartanah || 20||
    gitapriyo narasimhanigrahita'pi kathyate| narasimhashirobhusho narasimhatvagambarah || 21|| narasimhatvagutpati
    narasimhasupujitah | anurupi maharupi atisundaravigrahah || 22|| acaryashca punyagiriracaryo'pi ca
    kathyate| bhikshamardanagolanam girishvacarya iritah || 23|| tathaishashtamahasiddhirantakantaka iritah
    | ghorastathaiva girishah kritamalavibhushanah || 24|| vrishadhvajo damarukadharo vishnvakshidharakah
    | raktangashca brahmasrishtipradashcabhayarupavan || 25|| vishnurakshapradastadvadashtaishvaryasamanvitah
    | tathaivashtagunesho vai cashtamangalakeshvarah || 26|| bakasurasya harta ca bakapakshadharo'pi sah
    | tatha manmathanatho'pi vasudevasutapradah || 27|| mahavato'dhvanityashca tyaktaketaka iritah | mahavrato
    bilvamaladhari pashupatah smritah || 28|| tridhabhashca paranjyotirdvisahasradvijo bhavan | trivikramanihanta
    ca trivikramasupujitah || 29|| trivikramatvagutpati tatha taccarmakancukah | trivikramasthidandi ca
    sarvo madhyasthako'pi sah || 30|| vatamulo venijatastatha vishnvasthibhushanah | vikrito vijayashcaiva
    tatha bhaktakripakarah || 31|| stotrapujapriyo ramavarado hridayambujah | tatha parashuramainoharakastena
    pujitah || 32|| rudrakshamali bhogi ca mahabhogi ca samsmritah | bhogatitashca sarvesho yogatito haripriyah
    || 33|| vedavedantakarta ca tryambakamanoharau | vinayako vitarano vicitro vrata ityapi || 34|| paramesho
    virupaksho devadevastrilocanah | vainiko vishtarastho'yam tatha kshirasamakritih || 35|| aranah kathakashcaiva
    sumukho'mritavagapi | dhusturapushpadhari ca rigyajurvedinavubhau || 36|| samavedi tatha'tharvavedi
    kamikakaranau | vimalo makutashcaiva vatulo'cintyayogajau || 37|| diptassukshmastathaivayam virashca
    kirano'pi ca | ajitashca sahasrashca amshuman suprabhedakah || 38|| tatha vijayanishvasau namna svayambhuvo'pyayam
    | analo rauravashcandrajnano bimba udiritah || 39|| prodgito lalitassiddhastatha santananamavan| sharvottarastathacaryaparameshvara
    iritah || 40|| upagamasamakhyo'pi tatha shivapuranakah | bhavishyacca tathaivayam markandeyo'pi laingakah
    || 41|| skando varaho'pi tatha vamano matsyakurmakau | brahmando brahmapadmau ca garudo vishnunaradau
    || 42|| tatha bhagavatagneyau brahmakaivartako'pyayam | tathaivopapurano'pi ramasyastraprado'pi sah
    || 43|| ramasya capahari ca ramapujitapadavan| mayi ca shuddhamayi ca vaikhari madhyama para || 44||
    pashyanti ca tatha sukshma tatha pranavacapavan | jnanastrassakalashcaiva nishkalassakalashca vai
    || 45|| vishnoh patirayam tadvadvalabhadrabalapradah | balacapapahartta ca balapujitapadavan || 46||
    dandayudho vanganasoragocarasugandhinau | shrikantho'pyayamacarah khatvangah pashabhrittatha || 47||
    svarnarupi svarnaviryassakalatma'dhipah smritah | pralayah kalanatho'pi vijnanam kalanayakah || 48||
    pinakapanissukrito vishkaro visturaktapah | vishnoh ksharakarastadvakrishnajnanaprado hi sah || 49||
    krishnaya putradah krishnayuddhadah krishnapapaha | krishnapujitapadashca karkivishnvashvabhanjanah
    || 50|| karkipujitapadashca vahnijihvatikrintanah | bharatinasikacchetta papanasho jitendriyah ||
    51|| shishto vishishtah karta ca bhimebhyo bhima ucyate | shivatattvam tatha vidyatattvam pancaksharo'pi
    sah || 52|| pancavaktrah smitashirodhari brahmasthibhushanah | atmatattvam tatha drishyasahayo rasaviryavan
    || 53|| adrishyadrashta menaya jamatograshshadangavan | tatha dakshashirashchetta tatpurusho brahmanashshikhi
    || 54|| ashtamurtishcashtabhujashshadaksharasamahvayah | pancakrityah pancadhenuh pancavriksho'gnikashcivan
    || 55|| shankhavarnassarpakatissutro'hankara iritah | svahakarah svadhakarah phatkarassumukhah smritah
    || 56|| dinandhakakripalushca vamadevo'pi kanthyate | dhirah kalpo yugo varshamasavritusamahvayah
    || 57|| rashivasaranakshatrayogah karana iritah | ghati kashtha vinadi ca prano gurunimeshakau ||
    58|| shravanarksho meghavaho brahmandasrigudiritah | jagratsvapnasushuptishca turyo'yamatituryavan
    || 59|| tathaiva kevalavasthassakalavastha ityapi| shuddhavasthottamangau ca srishtirakshavidhayinau
    || 60|| samharta ca tirobhuta anugrahakarastatha | svatantrah paratantrashca shanmukhah kala iritah
    || 61|| akalashca tatha pashupatastrakara ishvarah | aghorakshurikastrau ca pratyangastro'pi kthyate
    || 62|| padotsrishtamahacakro vishnuveshyabhujangakah | nagayajnopaviti ca pancavarno'pi mokshadah
    || 63|| vayvagnishau sarpakacchah pancamurtashca bhogadah | tatha vishnushirashchetta sheshajyo bindunadakah
    || 64|| sarvajno vishnunigalamokshako bijavarnakah | bilvapatradharo bindunadapithastu shaktidah ||
    65|| tatha ravananishpeshta bhairavotpadako'pyayam| dakshayajnavinashi ca tripuratrayashikshakah ||
    66|| sindurapatradhari ca mandarasragalankritah | nirviryo bhavanatitastatha bhutaganeshvarah || 67||
    bishnubhrumadhyapadi ca sarvopadanakaranam | nimittakaranam sarvasahakaryapi kathyate || 68|| tatsadvyasakaracchetta
    shulaprotaharistatha | bhedabhedau vedavallikanthacchetta hi kathyate || 69|| pancabrahmasvarupi ca
    bhedabhedobhayatmavan | acchasphatika sankasho brahmabhasmavalepanah || 70|| nirdagdhavishnubhasmangaragah
    pingajatadharah | candarpitaprasadashca dhata dhatrivivarjitah || 71|| kalpatitah kalpabhasma cagastyakusumapriyah
    | anukalpopakalpau ca sankalpashchedadundubhih || 72|| vikalpo vishnudurjneyapado mrityunjayah smritah
    | vishnushmashananatano vishnukeshopavitavan || 73|| brahmashmashananatanah pancaravanaghatakah |
    sarpadhishantarastadvadanalasuraghatakah || 74|| mahishasurasamharta nalidurvavatamsakah | devarshinaradaityesho
    rakshasesho dhaneshvarah || 75|| caracaresho'nupado murticchandasvarupinau | ekadvitricatuh pancajanino
    vikramashramah || 76|| brahmavishnukapalaptajayakinkinikanghrikah | samharakattahaso'pi sarvasamharakah
    smritah || 77|| sarvasamharanetragnih srishtikridvanmanoyutah | samharakrit trishulo'pi rakshakritpanipadavan
    || 78|| bhringinatyapriyashshankhapadmanidhyoradhishvarah | sarvantaro bhaktacintitarthado bhaktavatsalah
    || 79|| bhaktaparadhasodha ca vikirnajata iritah | jatamakutadharica vishadastro'pi kathyate|| 80||
    apasmarikritavidyaprishthanghrih sthaulyavarjitah | yuva nityayuva vriddho nityavriddho'pi kathyate
    || 81|| shaktyutpati shaktiyuktassatyatsatyo'pi kathyate| vishnutpadaka advandvah satyasatyashca iritah
    || 82|| muladharastatha svadhishthanashca manipurakah | anahato vishuddhyajne tatha brahmabilam smritah
    || 83|| varabhayakarashshastripita tarakamarakah | salokyadashva samipyadayi sarupyadah smritah ||
    84|| sayujyamuktidastadvaddharikandharapadukah | nikrittabrahmamurdha ca shakinidakinishvarah || 85||
    yoginimohininatho durganatho'pi kathyate| yajno yajneshvaro yajnahavirbhugyajvanam priyah || 86||
    vishnushapapaharta ca candrashapapaharakah | indrashapapahartaca vedagamapuranakrit || 87|| vishnubrahmopadeshta
    ca skandomadeshiko'pyayam| vighneshasyopadeshta ca nandikeshagurustatha || 88|| tatha rishigurussarvagururdashadigishvarah
    | dashayudhadashangau ca jnanayajnopavitavan|| 89|| brahmavishnushiromundakandukah parameshvarah |
    jnanakriyayogacaryaniratoragakundalau || 90|| brahmatalapriyo vishnupatahapritirapyayam| bhandasurapahartaca
    kankapatradharo'pyayam || 91|| tantravadyaratastadvadarkapushpapriyo'pyayam| vishnvasyamuktaviryo'pi
    devyaggrakritatandavah || 92|| jnanambaro jnanabhusho vishnushankhapriyo'pyayam | vishnudaravimuktatmaviryashcaiva
    paratparah || 93|| maheshvarashceshvaro'pi lingodbhavasukhasanau | umasakhashcandracudashcardhanarishvarah
    smritah || 94|| somaskandastatha cakraprasadi ca trimurtikah | ardhangavishnushca tatha dakshinamurtiravyayah
    || 95|| bhikshatanashca kankalah kamarih kalashasanah | jalandhararistripurahanta ca vishabhakshanah
    || 96|| kalyanasundarasharabhamurti ca tripadapi | ekapado bhairavashca vrisharudhassadanatah || 97||
    gangadharashshannavatitattvamapyayamiritah | tatha sashtashatabhedamuratirashtashatahvayah || 98||
    ashtottarashatam talaraganrittaikapanditah | sahasrakhyassahasrakshassahasramukha iritah || 99|| sahasrabahu
    stanmurtiranantamukha iritah | anantanamapi tatha canantashrutirapyayam || 100|| anantanayanastadvadanantaghranamanditah
    | anantarupyayam tadvadanantaishvaryavan smritah || 101|| anantashaktikrityavananantajnanavanayam
    | anantanandasandoha anantaudaryavanayam || 102|| tathaiva prithivimurtih prithivisho'pi kathyate
    | prithividharakastadvatprithivyantara iritah || 103|| prithivyatitashca tatha parthivandabhimanyayam
    | tadandapurushahridayakamalo'pi nigadyate || 104|| tadandabhuvaneshanah tacchaktidharanatmakah |
    adharashaktyadhishthananantah kalagnirapyayam || 105|| kalagnirudrabhuvanapatirapyayamiritah | anantashca
    tatheshashca shankarah padmapingalau || 106|| kalashca jalajashcaiva krodho'tibala iritah | dhanadashcatikushmandabhuvanesho'pi
    kathyate || 107|| kushmandassaptapatalanayako'pi nigadyate | patalanto'pi ceshano balatibalanavubhau
    || 108|| balavikaranashcayam balesho'pi baleshvarah | baladhyakshashca balavanhatakesho'pi kathyate
    || 109|| tatha tadbhuvaneshanastathaivashtagajeshvarah | ashtanageshvarastadvadbhulokesho'pi kathyate
    || 110|| mervisho merushikhararajo'vanipatistatha | tryambakashcashtakulaparvatesho'pi kathyate ||
    111|| manasottaragiri stadvadvishvesho'pi nigadyate | svarnalokashcakravalagirivasaviramakah || 112||
    dharmo vividhadhama ca shankhapalashca kathyate | tatha kanakaroma ca parjanyah ketumanapi || 113||
    virocano haricchayo raktacchayashca kathyate | mahandhakaranatho'pi andabhittishvaro'pyayam || 114||
    pracivajrishvaro dakshinapracisho'pi gadyate | agnishvaro dakshinashca digisho dharmaradapi || 115||
    dakshinashapatistadvannirritisho'pi kathyate | pashcimashapatistadvadvarunesho'pi kathyate || 116||
    tathodakpashcimesho'pi vayvisho'pi tathocyate | tathaivottaradinnathah kuberesho'pi cocyate || 117||
    tathaivottarapurvesha ishanesho'pi kathyate | kailasashikharinathah shrikanthaparameshvarah || 118||
    mahakailasanatho'pi mahasadashivah smritah | bhuvarlokeshashambhugrassuryamandalanayakah || 119||
    prakasharudro yashcandramandalesho'pi kathyate | tatha candramahadevo nakshatranamadhishvarah || 120||
    grahalokesha gandharvagandharveshavubhavapi | siddhavidyadharesho'yam kinnaresho'pi kathyate || 121||
    yakshacarananatho'pi svarlokesho'pi sa smritah | bhimashcaiva maharlokanathashcaiva mahabhavah ||
    122|| janalokeshvaro jnanapado jananavarjitah | atipingala ashcaryo bhautikashca sha
  devanagari: ॐ हरश्शम्भुर्महादेवो नीलकण्ठस्सदाशिवः । भर्ता वरः पाण्डराङ्ग आनन्दश्शान्तविग्रहः ॥ १॥ एकोऽनन्तो
    मृगधरः शूलपाणिर्भवः शिवः । वह्निमध्यनटो मुक्तः स्वयम्भूर्निशिनर्तनः ॥ २॥ नन्दी परशुपाणिश्च ज्योतिर्भस्माङ्गरागभृत्
    । गजोत्पादी कपाली च नित्यश्शुद्धोऽग्निधारकः ॥ ३॥ शङ्करो भूरथो मेरुचापो वृषभवाहनः । उत्पत्तिशून्यो
    भूतेशो नागाभरणधारणः ॥ ४॥ उमार्धदेही हिमवज्जामाता भर्ग उत्तमः । उमापतिर्वह्निपाणिश्छेत्ता प्रलयनिर्भयः
    ॥ ५॥ एकरुद्रः पार्थबाणप्रदो रुद्रोऽतिवीर्यवान् । रविचक्ररथस्तद्वत्सोमचक्ररथःस्मृतः ॥ ६॥ दिगम्बरस्सर्वनेता
    विष्णुमत्स्यनिबर्हकः । मत्स्यनेत्रापहारीच मत्स्यनेत्र विभूषणः ॥ ७॥ मत्स्यपूजितपादश्च तथैव कमलासनः
    । वेदवेद्यः स्मृतस्तद्वद्वेदाश्वरथ ईरितः ॥ ८॥ वेदश्च वेदकौपीनो वेदनुपूरकस्तथा । वेदवाक्यो वेदमूर्तिर्वेदान्तो
    वेदपूजितः ॥ ९॥ सर्वेश्वरो नादवाच्यो ब्रह्ममूर्धनिकृन्तनः । ताण्डवश्चामृतस्तद्वदूर्ध्वताण्डवपण्डितः
    ॥ १०॥ आनन्दश्चण्ड आनन्दताण्डवः पूषदन्तभित् । भगनेत्रहरस्तद्वद्गजचर्माम्बरप्रियः ॥ ११॥ कामान्तको व्याघ्रभेदी
    मृगी चैकाङ्गकस्तथा । निर्विकारः पशुपतिस्सर्वात्मगोचरस्तथा ॥ १२॥ अग्रिनेत्रो भानुनेत्रश्चन्द्रनेत्रोऽपि
    कथ्यते । कूर्मनिग्राहकः कूर्मकपालाहारकस्तथा ॥ १३॥ कूर्मपूज्यस्तथा कूर्मकपालाभरणस्तथा । व्याघ्रचर्माम्बरः
    स्वामी तथा पाशविमोचकः ॥ १४॥ ओङ्काराभेनद् द्वन्द्वभञ्जकज्ञानमूर्तयः । विष्णुबाणो गणपतिः पूतोऽयन्तु
    पुरातनः ॥ १५॥ भूतनुश्च कृपामूर्तिः विष्णूत्पादकपादवान्। सुब्रह्मण्यपिता ब्रह्मपिता स्थाणुरथ स्मृतः
    ॥ १६॥ अर्भकक्षीरजलधिप्रदो पोत्रिविभेदकः । पोत्रिदन्तापहारी च पोत्रिदन्तविभूषणः ॥ १७॥ पोत्रिपूजितपादश्च
    चन्द्रपुष्पेषुकस्तथा । सर्वोपादानकस्तद्वदार्द्रभोऽग्निसमाकृतिः ॥ १८॥ मातापितृविहीनश्च धर्माधर्मावुभावपि
    । नियुक्तरथसारथ्यब्रह्मपूजितपादवान् ॥ १९॥ रक्तपिङ्गजटो विष्णुरभयो भानुदीपवान्। भूतसेनो महायोगी योगी
    कालियनर्तनः ॥ २०॥ गीतप्रियो नारसिंहनिग्रहीताऽपि कथ्यते। नारसिंहशिरोभूषो नारसिंहत्वगम्बरः ॥ २१॥ नारसिंहत्वगुत्पाटी
    नारासिंहसुपूजितः । अणुरूपी महारूपी अतिसुन्दरविग्रहः ॥ २२॥ आचार्यश्च पुण्यगिरिराचार्योऽपि च कथ्यते।
    भिक्षामर्दनगोलानां गिरिष्वाचार्य ईरितः ॥ २३॥ तथैषाष्टमहासिद्धिरन्तकान्तक ईरितः । घोरस्तथैव गिरिशः
    कृतमालविभूषणः ॥ २४॥ वृषध्वजो डमरुकधरो विष्ण्वक्षिधारकः । रक्ताङ्गश्च ब्रह्मसृष्टिप्रदश्चाभयरूपवान्
    ॥ २५॥ विष्णुरक्षाप्रदस्तद्वदष्टैश्वर्यसमन्वितः । तथैवाष्टगुणेशो वै चाष्टमङ्गलकेश्वरः ॥ २६॥ बकासुरस्य
    हर्ता च बकपक्षधरोऽपि सः । तथा मन्मथनाथोऽपि वासुदेवसुतप्रदः ॥ २७॥ महावतोऽध्वनित्यश्च त्यक्तकेतक ईरितः
    । महाव्रतो बिल्वमालाधारी पाशुपतः स्मृतः ॥ २८॥ त्रिधाभाश्च परञ्ज्योतिर्द्विसहस्रद्विजो भवान् । त्रिविक्रमनिहन्ता
    च त्रिविक्रमसुपूजितः ॥ २९॥ त्रिविक्रमत्वगुत्पाटी तथा तच्चर्मकञ्चुकः । त्रिविक्रमास्थिदण्डी च सर्वो
    मध्यस्थकोऽपि सः ॥ ३०॥ वटमूलो वेणिजटस्तथा विष्ण्वस्थिभूषणः । विकृतो विजयश्चैव तथा भक्तकृपाकरः ॥ ३१॥
    स्तोत्रपूजाप्रियो रामवरदो हृदयाम्बुजः । तथा परशुरामैनोहारकस्तेन पूजितः ॥ ३२॥ रुद्राक्षमाली भोगी च
    महाभोगी च संस्मृतः । भोगातीतश्च सर्वेशो योगातीतो हरिप्रियः ॥ ३३॥ वेदवेदान्तकर्ता च त्र्यम्बकमनोहरौ
    । विनायको वितरणो विचित्रो व्रत इत्यपि ॥ ३४॥ परमेशो विरूपाक्षो देवदेवस्त्रिलोचनः । वैणिको विष्टरस्थोऽयं
    तथा क्षीरसमाकृतिः ॥ ३५॥ आरणः काठकश्चैव सुमुखोऽमृतवागपि । धुस्तूरपुष्पधारी च ऋग्यजुर्वेदिनावुभौ ॥ ३६॥
    सामवेदी तथाऽथर्ववेदी कामिककारणौ । विमलो मकुटश्चैव वातुलोऽचिन्त्ययोगजौ ॥ ३७॥ दीप्तस्सूक्ष्मस्तथैवायं
    वीरश्च किरणोऽपि च । अजितश्च सहस्रश्च अंशुमान् सुप्रभेदकः ॥ ३८॥ तथा विजयनिश्वासौ नाम्ना स्वायम्भुवोऽप्ययम्
    । अनलो रौरवश्चन्द्रज्ञानो बिम्ब उदीरितः ॥ ३९॥ प्रोद्गीतो ललितस्सिद्धस्तथा सन्ताननामवान्। शर्वोत्तरस्तथाचार्यपारमेश्वर
    ईरितः ॥ ४०॥ उपागमसमाख्योऽपि तथा शिवपुराणकः । भविष्यच्च तथैवायं मार्कण्डेयोऽपि लैङ्गकः ॥ ४१॥ स्कान्दो
    वराहोऽपि तथा वामनो मत्स्यकूर्मकौ । ब्रह्माण्डो ब्राह्मपाद्मौ च गारुडो विष्णुनारदौ ॥ ४२॥ तथा भागवताग्नेयौ
    ब्रह्मकैवर्तकोऽप्ययम् । तथैवोपपुराणोऽपि रामस्यास्त्रप्रदोऽपि सः ॥ ४३॥ रामस्य चापहारी च रामपूजितपादवान्।
    मायी च शुद्धमायी च वैखरी मध्यमा परा ॥ ४४॥ पश्यन्ती च तथा सूक्ष्मा तथा प्रणवचापवान् । ज्ञानास्त्रस्सकलश्चैव
    निष्कलस्सकलश्च वै ॥ ४५॥ विष्णोः पतिरयं तद्वद्वलभद्रबलप्रदः । बलचापापहर्त्ता च बलपूजितपादवान् ॥ ४६॥
    दण्डायुधो वाङ्गनसोरगोचरसुगन्धिनौ । श्रीकण्ठोऽप्ययमाचारः खट्वाङ्गः पाशभृत्तथा ॥ ४७॥ स्वर्णरूपी स्वर्णवीर्यस्सकलात्माऽधिपः
    स्मृतः । प्रलयः कालनाथोऽपि विज्ञानं कालनायकः ॥ ४८॥ पिनाकपाणिस्सुकृतो विष्कारो विस्तुरक्तपः । विष्णोः
    क्षारकरस्तद्वकृष्णज्ञानप्रदो हि सः ॥ ४९॥ कृष्णाय पुत्रदः कृष्णयुद्धदः कृष्णपापहा । कृष्णपूजितपादश्च
    कर्किविष्ण्वश्वभञ्जनः ॥ ५०॥ कर्किपूजितपादश्च वह्निजिह्वातिकृन्तनः । भारतीनासिकाच्छेत्ता पापनाशो जितेन्द्रियः
    ॥ ५१॥ शिष्टो विशिष्टः कर्ता च भीमेभ्यो भीम उच्यते । शिवतत्त्वं तथा विद्यातत्त्वं पञ्चाक्षरोऽपि सः
    ॥ ५२॥ पञ्चवक्त्रः स्मितशिरोधारी ब्रह्मास्थिभूषणः । आत्मतत्त्वं तथा दृश्यसहायो रसवीर्यवान् ॥ ५३॥ अदृश्यद्रष्टा
    मेनाया जामातोग्रष्षडङ्गवान् । तथा दक्षशिरश्छेत्ता तत्पुरुषो ब्राह्मणश्शिखी ॥ ५४॥ अष्टमूर्तिश्चाष्टभुजष्षडक्षरसमाह्वयः
    । पञ्चकृत्यः पञ्चधेनुः पञ्चवृक्षोऽग्निकश्चिवान् ॥ ५५॥ शङ्खवर्णस्सर्पकटिस्सूत्रोऽहङ्कार ईरितः । स्वाहाकारः
    स्वधाकारः फट्कारस्सुमुखः स्मृतः ॥ ५६॥ दीनान्धककृपालुश्च वामदेवोऽपि कन्थ्यते । धीरः कल्पो युगो वर्षमासावृतुसमाह्वयः
    ॥ ५७॥ राशिवासरनक्षत्रयोगाः करण ईरितः । घटी काष्ठा विनाडी च प्राणो गुरुनिमेषकौ ॥ ५८॥ श्रवणर्क्षो मेघवाहो
    ब्रह्माण्डसृगुदीरितः । जाग्रत्स्वप्नसुषुप्तिश्च तुर्योऽयमतितुर्यवान् ॥ ५९॥ तथैव केवलावस्थस्सकलावस्थ
    इत्यपि। शुद्धावस्थोत्तमाङ्गौ च सृष्टिरक्षाविधायिनौ ॥ ६०॥ संहर्ता च तिरोभूत अनुग्रहकरस्तथा । स्वतन्त्रः
    परतन्त्रश्च षण्मुखः काल ईरितः ॥ ६१॥ अकालश्च तथा पाशुपतास्त्रकर ईश्वरः । अघोरक्षुरिकास्त्रौ च प्रत्यङ्गास्त्रोऽपि
    क्थ्यते ॥ ६२॥ पादोत्सृष्टमहाचक्रो विष्णुवेश्याभुजङ्गकः । नागयज्ञोपवीती च पञ्चवर्णोऽपि मोक्षदः ॥ ६३॥
    वाय्वग्नीशौ सर्पकच्छः पञ्चमूर्तश्च भोगदः । तथा विष्णुशिरश्छेत्ता शेषज्यो बिन्दुनादकः ॥ ६४॥ सर्वज्ञो
    विष्णुनिगलमोक्षको बीजवर्णकः । बिल्वपत्रधरो बिन्दुनादपीठस्तु शक्तिदः ॥ ६५॥ तथा रावणनिष्पेष्टा भैरवोत्पादकोऽप्ययम्।
    दक्षयज्ञविनाशी च त्रिपुरत्रयशिक्षकः ॥ ६६॥ सिन्दूरपत्रधारी च मन्दारस्रगलङ्कृतः । निर्वीर्यो भावनातीतस्तथा
    भूतगणेश्वरः ॥ ६७॥ बिष्णुभ्रूमध्यपादी च सर्वोपादानकारणम् । निमित्तकारणं सर्वसहकार्यपि कथ्यते ॥ ६८॥
    तत्सद्व्यासकरच्छेत्ता शूलप्रोतहरिस्तथा । भेदाभेदौ वेदवल्लीकण्ठच्छेत्ता हि कथ्यते ॥ ६९॥ पञ्चब्रह्मस्वरूपी
    च भेदाभेदोभयात्मवान् । अच्छस्फटिक सङ्काशो ब्रह्मभस्मावलेपनः ॥ ७०॥ निर्दग्धविष्णुभस्माङ्गरागः पिङ्गजटाधरः
    । चण्डार्पितप्रसादश्च धाता धातृविवर्जितः ॥ ७१॥ कल्पातीतः कल्पभस्म चागस्त्यकुसुमप्रियः । अनुकल्पोपकल्पौ
    च सङ्कल्पश्छेददुन्दुभिः ॥ ७२॥ विकल्पो विष्णुदुर्ज्ञेयपादो मृत्युञ्जयः स्मृतः । विष्णुश्मशाननटनो विष्णुकेशोपवीतवान्
    ॥ ७३॥ ब्रह्मश्मशाननटनः पञ्चरावणघातकः । सर्पाधीशान्तरस्तद्वदनलासुरघातकः ॥ ७४॥ महिषासुरसंहर्ता नालीदूर्वावतंसकः
    । देवर्षिनरदैत्येशो राक्षसेशो धनेश्वरः ॥ ७५॥ चराचरेशोऽनुपदो मूर्तिच्छन्दस्वरूपिणौ । एकद्वित्रिचतुः
    पञ्चजानिनो विक्रमाश्रमः ॥ ७६॥ ब्रह्मविष्णुकपालाप्तजयकिङ्किणिकाङ्घ्रिकः । संहारकाट्टहासोऽपि सर्वसंहारकः
    स्मृतः ॥ ७७॥ सर्वसंहारनेत्राग्निः सृष्टिकृद्वाङ्मनोयुतः । संहारकृत् त्रिशूलोऽपि रक्षाकृत्पाणिपादवान्
    ॥ ७८॥ भृङ्गिनाट्यप्रियश्शङ्खपद्मनिध्योरधीश्वरः । सर्वान्तरो भक्तचिन्तितार्थदो भक्तवत्सलः ॥ ७९॥ भक्तापराधसोढा
    च विकीर्णजट ईरितः । जटामकुटधारीच विशदास्त्रोऽपि कथ्यते॥ ८०॥ अपस्मारीकृताविद्यापृष्ठाङ्घ्रिः स्थौल्यवर्जितः
    । युवा नित्ययुवा वृद्धो नित्यवृद्धोऽपि कथ्यते ॥ ८१॥ शक्त्युत्पाटी शक्तियुक्तस्सत्यात्सत्योऽपि कथ्यते।
    विष्णूत्पादक अद्वन्द्वः सत्यासत्यश्च ईरितः ॥ ८२॥ मूलाधारस्तथा स्वाधिष्ठानश्च मणिपूरकः । अनाहतो विशुद्ध्याज्ञे
    तथा ब्रह्मबिलं स्मृतः ॥ ८३॥ वराभयकरश्शास्तृपिता तारकमारकः । सालोक्यदश्व सामीप्यदायी सारूप्यदः स्मृतः
    ॥ ८४॥ सायुज्यमुक्तिदस्तद्वद्धरिकन्धरपादुकः । निकृत्तब्रह्ममूर्धा च शाकिनीडाकिनीश्वरः ॥ ८५॥ योगिनीमोहिनीनाथो
    दुर्गानाथोऽपि कथ्यते। यज्ञो यज्ञेश्वरो यज्ञहविर्भुग्यज्वनां प्रियः ॥ ८६॥ विष्णुशापापहर्ता च चन्द्रशापापहारकः
    । इन्द्रशापापहर्ताच वेदागमपुराणकृत् ॥ ८७॥ विष्णुब्रह्मोपदेष्टा च स्कन्दोमादेशिकोऽप्ययम्। विघ्नेशस्योपदेष्टा
    च नन्दिकेशगुरुस्तथा ॥ ८८॥ तथा ऋषिगुरुस्सर्वगुरुर्दशदिगीश्वरः । दशायुधदशाङ्गौ च ज्ञानयज्ञोपवीतवान्॥
    ८९॥ ब्रह्मविष्णुशिरोमुण्डकन्दुकः परमेश्वरः । ज्ञानक्रियायोगचर्यानिरतोरगकुण्डलौ ॥ ९०॥ ब्रह्मतालप्रियो
    विष्णुपटहप्रीतिरप्ययम्। भण्डासुरापहर्ताच कङ्कपत्रधरोऽप्ययम् ॥ ९१॥ तन्त्रवाद्यरतस्तद्वदर्कपुष्पप्रियोऽप्ययम्।
    विष्ण्वास्यमुक्तवीर्योऽपि देव्यग्ग्रकृतताण्डवः ॥ ९२॥ ज्ञानाम्बरो ज्ञानभूषो विष्णुशङ्खप्रियोऽप्ययम्
    । विष्णूदरविमुक्तात्मवीर्यश्चैव परात्परः ॥ ९३॥ महेश्वरश्चेश्वरोऽपि लिङ्गोद्भवसुखासनौ । उमासखश्चन्द्रचूडश्चार्धनारीश्वरः
    स्मृतः ॥ ९४॥ सोमास्कन्दस्तथा चक्रप्रसादी च त्रिमूर्तिकः । अर्धाङ्गविष्णुश्च तथा दक्षिणामूर्तिरव्ययः
    ॥ ९५॥ भिक्षाटनश्च कङ्कालः कामारिः कालशासनः । जलन्धरारिस्त्रिपुरहन्ता च विषभक्षणः ॥ ९६॥ कल्याणसुन्दरशरभमूर्ती
    च त्रिपादपि । एकपादो भैरवश्च वृषारूढस्सदानटः ॥ ९७॥ गङ्गाधरष्षण्णवतितत्त्वमप्ययमीरितः । तथा साष्टशतभेदमूरतिरष्टशताह्वयः
    ॥ ९८॥ अष्टोत्तरशतं तालरागनृत्तैकपण्डितः । सहस्राख्यस्सहस्राक्षस्सहस्रमुख ईरितः ॥ ९९॥ सहस्रबाहु स्तन्मूर्तिरनन्तमुख
    ईरितः । अनन्तनामापि तथा चानन्तश्रुतिरप्ययम् ॥ १००॥ अनन्तनयनस्तद्वदनन्तघ्राणमण्डितः । अनन्तरूप्ययं
    तद्वदनन्तैश्वर्यवान् स्मृतः ॥ १०१॥ अनन्तशक्तिकृत्यावाननन्तज्ञानवानयम् । अनन्तानन्दसन्दोह अनन्तौदार्यवानयम्
    ॥ १०२॥ तथैव पृथिवीमूर्तिः पृथिवीशोऽपि कथ्यते । पृथिवीधारकस्तद्वत्पृथिव्यान्तर ईरितः ॥ १०३॥ पृथिव्यतीतश्च
    तथा पार्थिवाण्डाभिमान्ययम् । तदण्डपुरुषहृदयकमलोऽपि निगद्यते ॥ १०४॥ तदण्डभुवनेशानः तच्छक्तिधरणात्मकः
    । आधारशक्त्यधिष्ठानानन्ताः कालाग्निरप्ययम् ॥ १०५॥ कालाग्निरुद्रभुवनपतिरप्ययमीरितः । अनन्तश्च तथेशश्च
    शङ्करः पद्मपिङ्गलौ ॥ १०६॥ कालश्च जलजश्चैव क्रोधोऽतिबल ईरितः । धनदश्चातिकूश्माण्डभुवनेशोऽपि कथ्यते
    ॥ १०७॥ कूश्माण्डस्सप्तपातालनायकोऽपि निगद्यते । पातालान्तोऽपि चेशानो बलातिबलनावुभौ ॥ १०८॥ बलविकरणश्चायं
    बलेशोऽपि बलेश्वरः । बलाध्यक्षश्च बलवान्हाटकेशोऽपि कथ्यते ॥ १०९॥ तथा तद्भुवनेशानस्तथैवाष्टगजेश्वरः
    । अष्टनागेश्वरस्तद्वद्भूलोकेशोऽपि कथ्यते ॥ ११०॥ मेर्वीशो मेरुशिखरराजोऽवनिपतिस्तथा । त्र्यम्बकश्चाष्टकुलपर्वतेशोऽपि
    कथ्यते ॥ १११॥ मानसोत्तरगिरि स्तद्वद्विश्वेशोऽपि निगद्यते । स्वर्णलोकश्चक्रवालगिरिवासविरामकः ॥ ११२॥
    धर्मो विविधधामा च शङ्खपालश्च कथ्यते । तथा कनकरोमा च पर्जन्यः केतुमानपि ॥ ११३॥ विरोचनो हरिच्छायो रक्तच्छायश्च
    कथ्यते । महान्धकारनाथोऽपि अण्डभित्तीश्वरोऽप्ययम् ॥ ११४॥ प्राचीवज्रीश्वरो दक्षिणप्राचीशोऽपि गद्यते
    । अग्नीश्वरो दक्षिणश्च दिगीशो धर्मराडपि ॥ ११५॥ दक्षिणाशापतिस्तद्वन्निरृतीशोऽपि कथ्यते । पश्चिमाशापतिस्तद्वद्वरुणेशोऽपि
    कथ्यते ॥ ११६॥ तथोदक्पश्चिमेशोऽपि वाय्वीशोऽपि तथोच्यते । तथैवोत्तरदिङ्नाथः कुबेरेशोऽपि चोच्यते ॥ ११७॥
    तथैवोत्तरपूर्वेश ईशानेशोऽपि कथ्यते । कैलासशिखरीनाथः श्रीकण्ठपरमेश्वरः ॥ ११८॥ महाकैलासनाथोऽपि महासदाशिवः
    स्मृतः । भुवर्लोकेशशम्भूग्रास्सूर्यमण्डलनायकः ॥ ११९॥ प्रकाशरुद्रो यश्चन्द्रमण्डलेशोऽपि कथ्यते । तथा
    चन्द्रमहादेवो नक्षत्राणामधीश्वरः ॥ १२०॥ ग्रहलोकेश गन्धर्वगान्धर्वेशावुभावपि । सिद्धविद्याधरेशोऽयं
    किन्नरेशोऽपि कथ्यते ॥ १२१॥ यक्षचारणनाथोऽपि स्वर्लोकेशोऽपि स स्मृतः । भीमश्चैव महर्लोकनाथश्चैव महाभवः
    ॥ १२२॥ जनलोकेश्वरो ज्ञानपादो जननवर्जितः । अतिपिङ्गल आश्चर्यो भौतिकश्च श
