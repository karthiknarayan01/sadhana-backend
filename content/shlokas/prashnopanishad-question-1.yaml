id: prashnopanishad-question-1
category: stotram
name:
  english: Prashnopanishad - Question 1
content:
  english: nnamah paramatmane | harih om || sukesha ca bharadvaja ssauryayani ca gargyah kausalyashcashvalayano
    bhargavo vaidarbhih kabandhi katyayanaste haite brahmapara brahmanishthah para mbrahmanveshamanah
    esha ha vai tatsarvam va~kshyatiti te ha samitpanayo bhagavanta mpippaladamupasannah || || tan ha
    sa rishiruvaca bhuya eva tapasa brahmacaryena shraddhaya sam npricchata yadi vijnasyama ssarvam ha
    vo vakshama iti || || atha kabandhi katyayana upetya papraccha bhagavan kuto ha va imah prajah prajayanta
    iti || prajakamo vai prajapati 'tapyata sa tapastaptva sa mithunamutpadayate| rayi nca prananceti
    etau me bahudha prajah karishyata iti || || adityo ha vai prano rayireva candramah rayirva eta nca
    tasmanmurtireva rayih || mpravishati tena pracya nrashmishu sannidhatte| yaddakshinam ya~dantara disho
    yatsarva mprakashayati tena sarva nrashmishu sannidhatte || || sa esha vaishvanaro vishvarupah prano
    'gnirudayate| tadetad rica ntapantam| sahasrarashmi shshatadha vartamanah pranah prajanamudayatyesha
    suryah || va~tsaro vai prajapatih tasyayane dakshinancottara nca| tadye ha vai tadishtapurte kritamityupasate
    te candramasameva lokamabhijayante ta eva punaravartante| tasmadeta rishayah prajakama dakshina mpratipadyante|
    esha ha vai rayiryah pitriyanah || || athottarena tapasa brahmacaryena shraddhaya vidyayatmanamanvishyadityamabhijayante|
    etadvai prananamayatanametadamritamabhayameta tparayanametasmanna punaravartanta ityesha nirodhah|
    tadesha shlokah || ndiva ahuh pare ardhe purishinam| atheme anya u pare vicakshanam saptacakre shadara
    ahurarpitamiti || || maso vai prajapatistasya krishnapaksha eva rayi shshuklah pranastasmadeta rishaya
    nkurvantitara itarasminn || || ahoratro vai prajapatistasyahareva prano ratrireva rayih| pranam va~
    ete praskandanti ye diva ratya sam yu~jyante brahmacaryameva tadyadratrau ratya sam vai~ prajapatistato
    ha vai tadretastasmadimah prajah prajayanta iti || || tadye ha vai tatprajapativrata ncaranti te mithunamutpadayante|
    teshamevaisha brahmaloko yesha || teshamasau virajo brahmaloko na yeshu jihmamanrita
  devanagari: न्नमः परमात्मने । हरिः ओम् ॥ सुकेशा च भारद्वाज स्सौर्यायणी च गार्ग्यः कौसल्यश्चाश्वलायनो
    भार्गवो वैदर्भिः कबन्धी कात्यायनस्ते हैते ब्रह्मपरा ब्रह्मनिष्ठाः पर म्ब्रह्मान्वेषमाणाः एष ह वै तत्सर्वं
    वँक्ष्यतीति ते ह समित्पाणयो भगवन्त म्पिप्पलादमुपसन्नाः ॥ ॥ तान् ह स ऋषिरुवाच भूय एव तपसा ब्रह्मचर्येण
    श्रद्धया सं न्पृच्छत यदि विज्ञास्याम स्सर्वं ह वो वक्षाम इति ॥ ॥ अथ कबन्धी कात्यायन उपेत्य पप्रच्छ
    भगवन् कुतो ह वा इमाः प्रजाः प्रजायन्त इति ॥ प्रजाकामो वै प्रजापति ऽतप्यत स तपस्तप्त्वा स मिथुनमुत्पादयते।
    रयि ञ्च प्राणञ्चेति एतौ मे बहुधा प्रजाः करिष्यत इति ॥ ॥ आदित्यो ह वै प्राणो रयिरेव चन्द्रमाः रयिर्वा
    एत ञ्च तस्मान्मूर्तिरेव रयिः ॥ म्प्रविशति तेन प्राच्या न्रश्मिषु सन्निधत्ते। यद्दक्षिणां यँदन्तरा
    दिशो यत्सर्व म्प्रकाशयति तेन सर्वा न्रश्मिषु सन्निधत्ते ॥ ॥ स एष वैश्वानरो विश्वरूपः प्राणो ऽग्निरुदयते।
    तदेतद् ऋचा न्तपन्तम्। सहस्ररश्मि श्शतधा वर्तमानः प्राणः प्रजानामुदयत्येष सूर्यः ॥ वँत्सरो वै प्रजापतिः
    तस्यायने दक्षिणञ्चोत्तर ञ्च। तद्ये ह वै तदिष्टापूर्ते कृतमित्युपासते ते चान्द्रमसमेव लोकमभिजयन्ते
    त एव पुनरावर्तन्ते। तस्मादेत ऋषयः प्रजाकामा दक्षिण म्प्रतिपद्यन्ते। एष ह वै रयिर्यः पितृयाणः ॥ ॥ अथोत्तरेण
    तपसा ब्रह्मचर्येण श्रद्धया विद्ययात्मानमन्विष्यादित्यमभिजयन्ते। एतद्वै प्राणानामायतनमेतदमृतमभयमेत
    त्परायणमेतस्मान्न पुनरावर्तन्त इत्येष निरोधः। तदेष श्लोकः ॥ न्दिव आहुः परे अर्धे पुरीषिणम्। अथेमे
    अन्य उ परे विचक्षणं सप्तचक्रे षडर आहुरर्पितमिति ॥ ॥ मासो वै प्रजापतिस्तस्य कृष्णपक्श एव रयि श्शुक्लः
    प्राणस्तस्मादेत ऋषय ङ्कुर्वन्तीतर इतरस्मिन्न् ॥ ॥ अहोरात्रो वै प्रजापतिस्तस्याहरेव प्राणो रात्रिरेव
    रयिः। प्राणं वाँ एते प्रस्कन्दन्ति ये दिवा रत्या सं युँज्यन्ते ब्रह्मचर्यमेव तद्यद्रात्रौ रत्या सं
    वैँ प्रजापतिस्ततो ह वै तद्रेतस्तस्मादिमाः प्रजाः प्रजायन्त इति ॥ ॥ तद्ये ह वै तत्प्रजापतिव्रत ञ्चरन्ति
    ते मिथुनमुत्पादयन्ते। तेषामेवैष ब्रह्मलोको येषा ॥ तेषामसौ विरजो ब्रह्मलोको न येषु जिह्ममनृत
