id: shribhavanyashtakam
category: stotram
name:
  english: shribhavanyashtakam
  devanagari: श्रीभवान्यष्टकम्
content:
  english: sadaham gatistvam gatistvam tvameka bhavani || 2 || n janami danam na ca dhyanayogam na janami
    tantram na ca stotra stotramntram | na janami pujam na ca nyasayogam gatistvam gatistvam tvameka bhavani
    || 3 || na janami punyam na janami tirtham na janami muktim layam va kadacit | na janami bhaktim vratam
    vapi matargatistvam gatistvam tvameka bhavani || 4 || kukarmi kusadgi kubudhdi
  devanagari: सदाहं गतिस्त्वं गतिस्त्वं त्वमेका भवानी ॥ २ ॥ न् जानामि दानं न च ध्यानयोगम् न जानामि तन्त्रम्
    न च स्तोत्र स्तोत्रम्न्त्रम् । न जानामि पुजाम् न च न्यासयोगम् गतिस्त्वं गतिस्त्वं त्वमेका भवानी ॥
    ३ ॥ न जानामि पुण्यं न जानामि तिर्थम् न जानामि मुक्तिं लयं वा कदाचित् । न जानामि भक्तिं व्रतं वापि
    मातर्गतिस्त्वं गतिस्त्वं त्वमेका भवानी ॥ ४ ॥ कुकर्मी कुसड्गी कुबुध्दी
meaning: {}
