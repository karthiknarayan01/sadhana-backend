id: kalisantaranopanishat-krishnayajurvedokta
category: upanishad
name:
  english: kalisantaranopanishat (krishnayajurvedokta)
  devanagari: कलिसन्तरणोपनिषत् (कृष्णयजुर्वेदोक्त)
content:
  english: punarnaradah papraccha bhagavan ko'sya vidhiriti | tam hovaca nasya vidhiriti | sarvada shucirashucirva
    pathan brahmanah salokatam samipatam sarupatam sayujyameti | yadasya shodashakasya sardhatrikotirjapati
    tada brahmahatyam tarati | tarati virahatyam | svarnasteyat puto bhavati | vrishaligamanat puto bhavati
    | pitridevamanushyanamapakarat puto bhavati | sarvadharmaparityagapapat sadyah shucitamapnuyat | sadyo
    mucyate sadyo mucyate ityupanishat || 3|| om saha navavatu | saha nau bhunaktu | saha viryankaravavahai
    | tejasvinavadhitamastu ma vidvishavahai | om shantih shantih shantih |
  devanagari: पुनर्नारदः पप्रच्छ भगवन् कोऽस्य विधिरिति । तं होवाच नास्य विधिरिति । सर्वदा शुचिरशुचिर्वा
    पठन् ब्राह्मणः सलोकतां समीपतां सरूपतां सायुज्यमेति । यदास्य षोडशकस्य सार्धत्रिकोटीर्जपति तदा ब्रह्महत्यां
    तरति । तरति वीरहत्याम् । स्वर्णस्तेयात् पूतो भवति । वृषलीगमनात् पूतो भवति । पितृदेवमनुष्याणामपकारात्
    पूतो भवति । सर्वधर्मपरित्यागपापात् सद्यः शुचितामाप्नुयात् । सद्यो मुच्यते सद्यो मुच्यते इत्युपनिषत्
    ॥ ३॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यङ्करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः
    शान्तिः शान्तिः ।
meaning: {}
