id: annamayya-keerthanas-nanati-bathuku
category: stotram
name:
  english: Annamayya Keerthanas Nanati Bathuku
content:
  english: mukhari nanati batuku natakamu kanaka kannadi kaivalyamu || puttutayu nijamu povutayu nijamu
    nattanadimi pani natakamu | yèttanèduti kaladi prapancamu katta gadapatidi kaivalyamu || kudicedannamu
    koka cuttèdidi nadumantrapu pani natakamu | vòdi kattukònina ubhaya karmamulu gadi datinapude kaivalyamu
    || tègadu papamu tiradu punyamu nagi nagi kalamu natakamu | èguvane shri venkateshvarudelika gaganamu
    mididi kaivalyamu ||
  devanagari: मुखारि नानाटि बतुकु नाटकमु कानक कन्नदि कैवल्यमु ॥ पुट्टुटयु निजमु पोवुटयु निजमु नट्टनडिमी
    पनि नाटकमु । यॆट्टनॆदुटि कलदी प्रपञ्चमु कट्ट गडपटिदि कैवल्यमु ॥ कुडिचेदन्नमु कोक चुट्टॆडिदि नडुमन्त्रपु
    पनि नाटकमु । वॊडि कट्टुकॊनिन उभय कर्ममुलु गडि दाटिनपुडे कैवल्यमु ॥ तॆगदु पापमु तीरदु पुण्यमु नगि नगि
    कालमु नाटकमु । ऎगुवने श्री वेङ्कटेश्वरुडेलिक गगनमु मीदिदि कैवल्यमु ॥
