id: akhilandeshvaristotram-onkararnavamadhyage-tripathage
category: stotram
name:
  english: akhilandeshvaristotram (onkararnavamadhyage tripathage)
  devanagari: अखिलाण्डेश्वरीस्तोत्रम् (ओङ्कारार्णवमध्यगे त्रिपथगे)
content:
  english: akhilandeshvaristotram onkararnavamadhyage tripathage onkarabijatmike onkarena sukhaprade shubhakare
    okarabindupriye | onkare jagadambike shashikale onkarapithasthite daso'ham tava padapadmayugalam vande'khilandeshvari
    || 1|| hrinkararnavavarnamadhyanilaye hrinkaravarnatmike | hrinkarabdhisucarucandrakadhare hrinkaranadapriye
    | hrinkare tripureshvari sucarite hrinkarapithasthite daso'ham tava padapadmayugalam vande'khilandeshvari
    || 2|| shricakrankitabhushanojjvalamukhe shrirajarajeshvari shrikanthardhasharirabhaganilaye shrijambunathapriye
    | shrikantasya sahodare sumanase shribindupithapriye daso'ham tava padapadmayugalam vande'khilandeshvari
    || 3|| kasturitilakojjvale kalihare klinkarabijatmike
  devanagari: अखिलाण्डेश्वरीस्तोत्रम् ओङ्कारार्णवमध्यगे त्रिपथगे ओङ्कारबीजात्मिके ओङ्कारेण सुखप्रदे शुभकरे
    ओकारबिन्दुप्रिये । ओङ्कारे जगदम्बिके शशिकले ओङ्कारपीठस्थिते दासोऽहं तव पादपद्मयुगलं वन्देऽखिलाण्डेश्वरि
    ॥ १॥ ह्रीङ्कारार्णववर्णमध्यनिलये ह्रीङ्कारवर्णात्मिके । ह्रीङ्काराब्धिसुचारुचान्द्रकधरे ह्रीङ्कारनादप्रिये
    । ह्रीङ्कारे त्रिपुरेश्वरी सुचरिते ह्रीङ्कारपीठस्थिते दासोऽहं तव पादपद्मयुगलं वन्देऽखिलाण्डेश्वरि
    ॥ २॥ श्रीचक्राङ्कितभूषणोज्ज्वलमुखे श्रीराजराजेश्वरि श्रीकण्ठार्धशरीरभागनिलये श्रीजम्बुनाथप्रिये ।
    श्रीकान्तस्य सहोदरे सुमनसे श्रीबिन्दुपीठप्रिये दासोऽहं तव पादपद्मयुगलं वन्देऽखिलाण्डेश्वरि ॥ ३॥ कस्तूरीतिलकोज्ज्वले
    कलिहरे क्लीङ्कारबीजात्मिके
