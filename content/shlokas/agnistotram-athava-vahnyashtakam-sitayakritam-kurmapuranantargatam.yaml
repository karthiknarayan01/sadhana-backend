id: agnistotram-athava-vahnyashtakam-sitayakritam-kurmapuranantargatam
category: stotram
name:
  english: agnistotram athava vahnyashtakam (sitayakritam kurmapuranantargatam)
  devanagari: अग्निस्तोत्रम् अथवा वह्न्यष्टकम् (सीतायाकृतं कूर्मपुराणान्तर्गतम्)
content:
  english: iti vahnyashtakam japtva ramapatni yashasvini | dhyayanti manasa tasthau ramamunmilitekshana
    || 9|| iti kurmapurane purvabhage catustrimshadhyayantargatam sitaya kritam agnistotram athava vahnyashtakam
    samaptam | kurmapurane uttarabhage 34
  devanagari: इति वह्न्यष्टकं जप्त्वा रामपत्नी यशस्विनी । ध्यायन्ती मनसा तस्थौ राममुन्मीलितेक्षणा ॥ ९॥
    इति कूर्मपुराणे पूर्वभागे चतुस्त्रिंशाध्यायान्तर्गतं सीताया कृतं अग्निस्तोत्रं अथवा वह्न्यष्टकं समाप्तम्
    । कूर्मपुराणे उत्तरभागे ३४
meaning: {}
