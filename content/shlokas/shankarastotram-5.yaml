id: shankarastotram-5
category: stotram
name:
  english: shankarastotram 5
  devanagari: शन्करस्तोत्रम् ५
content:
  english: '| bhavata hridaye daridryaduhkhamatyugram | pitamapi visham tasmadbhitamatah kantha evaste
    || 1|| tippani 1| parvaratriramanah purnimacandrastasyamritabhasam sarva garva haratiti tatsambuddhau
    | tebhyo''pyatidhavalastapashantikarashca | 2| he shankara tava sadidyam karabjam ke anatam anagham
    nishpapam kartumalam na ityanvayah | sarvanapi natananaghan vidadhyaditi bhavah | 3| he akhilesha
    sarvesha | yatha te padapamsuh sukhaptyai bhavati tatha divishadam padapa api na ityanvayah | 4| bhajatam
    bhaktanamishte | 5| svargavasinamaranam shatam tasya kshayakarmani vinashe''nargalamanyahatam prathita
    nistula shaktiryasya tadrishah tatsambuddhau | 6| shannam dvishatam vargah kamadishatkam | 7| mantavo''paradhastesham
    kotayah | 8| tushararug dhavalah tvam himagirishca | 9| alpe va mahati va yadasi jalajantau va mudiha
    vartate sa khalu toyadeva| evam tavaiva sevaya jagati sukhamiti yojyam | 10| vinduna prajnena | 11|
    dushta ishvara rajadayah | 12| sanagam | 13| apatam digambaram | 14| utkamutkanthitam hridayam yasyastadrishi
    dhih | 15| yena vastuna mama mut tat tvaya kanthe vidhritamityanvayah | 16| bhavasya samsarasya tapam
    duhkham bhajatiti tadrik | ashuddha ca mama mano bhavata vasaya nangikritam kimityanvayah | 17| na
    agah iti padacchedah | 18| ka aryadhava iti padacchedah | arya parvati | tava ka katha kshamibhirnuta
    netyanvayah | 19| shrutishatasya yah stavastasya mukhyamaspadam | 20| he umesha'
  devanagari: । भवता हृदये दारिद्र्यदुःखमत्युग्रं । पीतमपि विषं तस्माद्भीतमतः कण्ठ एवास्ते ॥ १॥ टिप्पणि
    १। पर्वरात्रिरमणः पूर्णिमाचन्द्रस्तस्यामृतभासां सर्व गर्व हरतीति तत्सम्बुद्धौ । तेभ्योऽप्यतिधवलस्तापशान्तिकरश्च
    । २। हे शङ्कर तव सदीड्यं कराब्जं के आनतं अनघं निष्पापं कर्तुमलं न इत्यन्वयः । सर्वानपि नताननघान् विदध्यादिति
    भावः । ३। हे आखिलेश सर्वेश । यथा ते पादपांसुः सुखाप्त्यै भवति तथा दिविषदां पादपा अपि न इत्यन्वयः ।
    ४। भजतां भक्तानामिष्टे । ५। स्वर्गवासिनामराणां शतं तस्य क्षयकर्मणि विनाशेऽनर्गलमन्याहतं प्रथिता निस्तुला
    शक्तिर्यस्य तादृशः तत्सम्बुद्धौ । ६। षण्णां द्विषतां वर्गः कामादिषट्कम् । ७। मन्तवोऽपराधास्तेषां कोटयः
    । ८। तुषाररुग् धवलः त्वं हिमगिरिश्च । ९। अल्पे वा महति वा यादसि जलजन्तौ वा मुदिह वर्तते सा खलु तोयादेव।
    एवं तवैव सेवया जगति सुखमिति योज्यम् । १०। विन्दुना प्राज्ञेन । ११। दुष्टा ईश्वरा राजादयः । १२। सनागम्
    । १३। अपटं दिगम्बरम् । १४। उत्कमुत्कण्ठितं हृदयं यस्यास्तादृशी धीः । १५। येन वस्तुना मम मुत् तत् त्वया
    कण्ठे विधृतमित्यन्वयः । १६। भवस्य संसारस्य तापं दुःखं भजतीति तादृक् । अशुद्ध च मम मनो भवता वासाय नाङ्गीकृतं
    किमित्यन्वयः । १७। न आगः इति पदच्छेदः । १८। का आर्याधव इति पदच्छेदः । आर्या पार्वती । तव का कथा क्षमिभिर्नुता
    नेत्यन्वयः । १९। श्रुतिशतस्य यः स्तवस्तस्या मुख्यमास्पदम् । २०। हे उमेश
