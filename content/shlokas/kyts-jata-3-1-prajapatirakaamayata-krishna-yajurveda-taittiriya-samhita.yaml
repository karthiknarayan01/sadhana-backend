id: kyts-jata-3-1-prajapatirakaamayata-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 3.1 Prajapatirakaamayata - Krishna Yajurveda Taittiriya Samhita
content:
  english: prajapati rakamayata kamayata prajapatih prajapati rakamayata | prajapatiriti praja akamayata
    prajah praja akamayata kamayata prajah | ssrijeya srijeya prajah praja srijeye titi srijeya srijeye
    ti | iti sa sa ititi sah | tapo 'tapyata tapyata tapa stapo 'tapyata | atapyata sa so 'tapyata tapyata
    sah | sarpa nasrijata srijata sarpa asrijata sa so 'srijata srijata sah | so 'kamayata kamayata sa
    so 'kamayata | akamayata prajah praja akamayata kamayata prajah | ssrijeya srijeya prajah praja srijeye
    titi srijeya srijeye ti | iti sa sa ititi sah | ndvitiyagm sa sa dvitiya dvitiya matapyata tapyata
    dvitiya ndvitiya matapyata | atapyata sa so 'tapyata tapyata sah | sa vayagmsi vayagmsi sa sa vayagmsi
    | vayag syasrijata srijata vayagmsi vayag syasrijata | asrijata sa so 'srijata srijata sah | so 'kamayata
    kamayata sa so 'kamayata | akamayata prajah praja akamayata kamayata prajah | ssrijeya srijeya prajah
    praja srijeye titi srijeya srijeye ti | iti sa sa ititi sah | ntritiyagm sa sa tritiya tritiya matapyata
    tapyata tritiya atapyata sa so 'tapyata tapyata sah | sa eta metagm sa sa etam | dikshitavada mapashya
    dapashya kshitavada mapashyat | dikshitavadamiti dikshita ttata stato 'vada davada tato vai vai tata
    stato vai | praja asrijata srijata prajah praja asrijata | dyadasrijata srijata yat | tapa staptva
    taptva tapa stapa staptva | ntaptva taptva di va~dati vadati dikshitavada dikshitavadamiti dikshita
    vadati prajah praja vadati vadati prajah | praja evaiva prajah praja eva | dyajamano yajamana sta
    ssrijate srijate yajamano yajamana thsrijate srijate yat | dikshito 'meddhya mameddhya kshito 'meddhyam
    | mpashyati pashya tyameddhya mameddhya pashya tyapapa pashyati pashya tyapa | ddiksha diksha 'sma
    dasma diksha kramati kramati diksha diksha kramati | nkramati kramati nila haro vi vi haro haro vi
    | tyeti vi vyeti | etyabaddha mabaddha metye tyabaddham | mmano mano 'baddha mabaddha ssurya shcakshu
    shcakshu njyotishagm surya ssuryo jyotisham | jyotishag shreshtha shshreshtho jyotisha njyotishag
    shreshthah | shreshtho dikshe dikshe shreshtha dikshe ma ma dikshe dikshe ma | ma hasir hasi hasi
    rititi hasir ityahahe tityaha | ddiksha diksha 'sma dasma diksha 'papa diksha diksha 'pa | apa kramati
    krama tyapapa kramati | kramati na na kramati kramati na | nnila masyasya nila na haro haro na na
    harah | haro vi vi haro haro vi | tyeti vi vyeti | shati divya divya abhivar divya apa apo divya divya
    apah | ntapa stapo diksha rni rasyasya nih | rghnanti ghnanti ni ghna ntyundati rundati rghnanti ghna
    ntyundatih | mbala mundati rundati dhattauja ojo dhatta dhattaujah | ojo dhatta dhattauja ojo dhatta
    | dhatta ma ma dhatta dhatta ma | mme me diksham | ma tapa stapo ma ma tapah | rnish tapa stapo nih
    | rvadhishta vadhishta ni vadhishte titi vadhishta vadhishte ti | ityahahe tityaha | ahaita deta daha
    haitat | eta devaivaita deta deva | eva sarvagm sarva mevaiva sarva nthsarvagm sarva matmann | dhatte
    na na dhatte dhatte na | na tapa stapo na na tapah | rnish tapa stapo nih | rghnanti ghnanti ni ghna
    ntyagni ragni rvai va agni ragni kshitasya dikshitasya vai vai di dikshitasya devata devata dikshitasya
    dikshitasya devata devata sa sa devata devata sah | hyasma dasma detar hi tira stira etar tira ive
    va tira stira iva | ishvaragm rakshagmsi rakshagmsishvara mi shvaragm rakshagmsi | rakshagmsi hantor
    hanto rakshagmsi rakshagmsi hantoh dbhadra ddhantor hanto bhadra dabhyabhi bhadra shshreyo 'bhyabhi
    shreyah | shreyah pra pra shreya pre hihi pra pre hi | rbrihaspati rihihi brihaspatih | brihaspatih
    puraeta puraeta brihaspati rbrihaspatih puraeta | puraeta te te puraeta puraeta te te astvastu te
    te astu | astvi titya stva stviti | ityahahe tityaha | aha brahma brahmahaha brahma | brahma vai vai
    brahma brahma vai | rbrihaspati stam | eva nvarabhate 'nvarabhata evaiva nvarabhate | 'nvarabhate
    'nvarabhate sah | sa ena menagm sa sa enam | enagm sagm sa mena menagm sam | mparayati parayati sagm
    sa parayatya parayati parayatya | ida maganma ganme da mida maganma | ndevayajana maganma ganma devayajanam
    | mprithivyah prithivya devayajana prithivya ititi prithivyah prithivya iti | ityahahe tityaha | ndevayajana
    mahaha devayajanam | devayajanagm hi hi devayajana ndevayajanagm hi | hyesha esha hi hyeshah | esha
    prithivyah prithivya esha esha prithivyah | prithivya agaccha tyagacchati prithivyah prithivya agacchati
    | agacchati yo ya agaccha tyagacchati yah | yo yajate yajate yo yo yajate | yajate vishve vishve yajate
    yajate vishve vishve deva deva vishve vishve devah | yadajushanta jushanta ya ajushanta purve purve
    'jushanta jushanta purve purva ititi purve purva iti | ityahahe tityaha | aha vishve vishva ahaha
    vishve vishve hi hi vishve vishve hi | hyeta deta ddhi hyetat | ddeva deva eta deta deva joshayante
    joshayante deva deva joshayante | dyaj joshayante joshayante yat | brahmana rikhsamabhya mrikhsamabhya
    hmana rikhsamabhya khsamabhya mrikhsamabhyam rikhsamabhyamityrikhsama ssantaranto yajusha yajusha
    santarantah | santaranta ititi santaranta ssantaranta iti | ityahahe tityaha | khsamabhya mrikhsamabhya
    mahaha r rikhsamabhyagm hi hyrikhsamabhya mrikhsamabhyagm hi | rikhsamabhyamityrikhsama hyesha esha
    hi hyeshah | esha yajusha yajushaisha esha yajusha | yajusha santarati santarati yajusha yajusha santarati
    | ssantarati santarati yah | yo yajate yajate yo yo yajate | yajate rayo rayo yajate yajate rayah
    | raya sposhena poshena rayo raya sposhena | mposhena poshena sam | sa mishesha sagm sa misha | isha
    madema mademe shesha madema | mademe titi madema mademe ti | ityahahe tityaha | aha shisha mashisha
    maha hashisha ashisha mevai vashisha mashisha meva | evaita meta mevai vaitam | eta maita meta ma
    | shasta iti shaste | || esha te ta esha esha te te gayatro gayatra ste te gayatrah | gayatro bhago
    bhago gayatro gayatro bhagah | bhaga ititi bhago bhaga iti | iti me ma ititi me | me somaya somaya
    me me somaya | thsomaya somaya brutat | bruta desha esha bruta esha te ta esha esha te te traishtubha
    straishtubha ste te traishtubhah | traishtubho jagato jagata straishtubha straishtubho jagatah | jagato
    bhago bhago jagato jagato bhagah | bhaga ititi bhago bhaga iti | iti me ma ititi me | me somaya somaya
    me me somaya | thsomaya somaya brutat | brutac chandomana dbrutac chandomana chandomanagm samra nchandomanagm
    samra chandomanamiti chandah gacche titi gaccha gacche ti | iti me ma ititi me | me somaya somaya
    me me somaya | thsomaya somaya brutat | somagm rajanagm rajanagm somagm somagm rajanam | jyagm rajanagm
    rajanagm samra jyam ~lokam ~lokagm samra ngamayitva gamayitva lokam ~loka gamayitva krinati krinati
    gamayitva gamayitva krinati | krinati gacchati gacchati krinati krinati gacchati | gacchati svanag
    svana ngacchati gacchati svana jyagg svanag svanagm samra nchandagmsi chandagmsi samra chandagmsi
    khalu khalu chandagmsi chandagmsi khalu | khalu vai vai khalu khalu vai | vai somasya somasya vai
    vai somasya | somasya rajno rajna ssomasya somasya rajnah | jyo rajno rajna lloko lokah purasta thsomasya
    somasya purasta thsomasya somasya krayat | abhi mantrayeta mantrayeta bhyabhi mantrayeta | mantrayeta
    samra mmantrayeta mantrayeta samra enam ~lokam ~loka mena menam ~lokam | ngamayitva gamayitva lokam
    ~loka gamayitva krinati krinati gamayitva gamayitva krinati | krinati gacchati gacchati krinati krinati
    gacchati | gacchati svanag svana ngacchati gacchati svana jyagg svanag svanagm samra vai tanunaptrasya
    tanunaptrasya vai vai tanunaptrasya | tanunaptrasya pratishtha ntanunaptrasya tanunaptrasya pratishtham
    | tanunaptrasyeti tanu ve~da veda pratishtha pratishthamiti prati veda prati prati veda veda prati
    | pratyevaiva prati pratyeva | eva tishthati tishtha tyevaiva tishthati | tishthati brahmavadino brahmavadina
    stishthati tishthati brahmavadinah | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti
    | brahmavadina iti brahma vadanti na na vadanti vadanti na | na prashnanti prashnanti na na prashnanti
    | prashnanti na na prashnanti prashnanti na | na juhvati juhvati na na juhvati | juhva tyathatha juhvati
    juhva tyatha | atha kva kvathatha kva | kva tanunaptram | mprati prati tanunaptra tanunaptramiti tanu
    prati tishthati tishthati prati prati tishthati | tishthatititi tishthati tishthatiti | iti prajapatau
    prajapata vititi prajapatau | prajapatau manasi manasi prajapatau prajapatau manasi | prajapataviti
    praja manasititi manasi manasiti | dbruya dititi bruyat | tri ravava tri stri rava | ava jighrej jighre
    davava jighret | tprajapatau prajapatau jighrej jighre prajapatau tva tva prajapatau prajapatau tva
    | prajapataviti praja tva manasi manasi tva tva manasi | manasi juhomi juhomi manasi manasi juhomi
    | juhomititi juhomi juhomiti | itye shaisheti tyesha | esha vai va eshaisha vai | vai tanunaptrasya
    tanunaptrasya vai vai tanunaptrasya | tanunaptrasya pratishtha pratishtha tanunaptrasya tanunaptrasya
    pratishtha | tanunaptrasyeti tanu pratishtha yo yah pratishtha pratishtha yah | pratishtheti prati
    veda prati prati veda veda prati | pratyevaiva prati pratyeva | eva tishthati tishtha tyevaiva tishthati
    | tishthati yo ya stishthati tishthati yah | yo vai vai yo yo vai | || va addhvaryo raddhvaryo rvai
    va addhvaryoh | addhvaryoh pratishtha mpratishtha maddhvaryo raddhvaryoh pratishtham | ve~da veda
    pratishtha pratishthamiti prati veda prati prati veda veda prati | pratyevaiva prati pratyeva | eva
    tishthati tishtha tyevaiva tishthati | tishthati yato yata stishthati tishthati yatah | yato manyeta
    manyeta yato yato manyeta | manyeta nabhikramya nabhikramya manyeta manyeta nabhikramya | anabhikramya
    hoshyami hoshya myanabhikramya nabhikramya hoshyami | anabhikramyetyanabhi hoshyamititi hoshyami hoshyamiti
    | ttishthagg stishthagg sta nna tishthagg stishtha a shravayec chravaye da shravayet | shravaye deshaisha
    shravayec chravaye desha | esha vai va eshaisha vai | va addhvaryo raddhvaryo rvai va addhvaryoh |
    addhvaryoh pratishtha pratishtha 'ddhvaryo raddhvaryoh pratishtha | pratishtha yo yah pratishtha pratishtha
    yah | pratishtheti prati veda prati prati veda veda prati | pratyevaiva prati pratyeva | eva tishthati
    tishtha tyevaiva tishthati | ttishthati tishthati yat | yadabhikramya bhikramya ya abhikramya juhuyaj
    juhuya dabhikramya bhikramya juhuyat | pratishthaya juhuyaj juhuya pratishthaya iya diya pratishthaya
    iyat | pratishthaya iti prati thsamanatra samanatra tasma samanatra tishthata tishthata samanatra
    samanatra tishthata | tishthata hotavyagm hotavya ntishthata tishthata hotavya mpratishthityai pratishthityai
    hotavyagm hotavya pratishthityai yo yah pratishthityai pratishthityai yah | pratishthitya iti prati
    va addhvaryo raddhvaryo rvai va addhvaryoh | sva maddhvaryo raddhvaryo veda veda svavan | svava nevaiva
    svava eva bhavati bhava tyevaiva bhavati | khsrug bhavati bhavati sruk | va asyasya vai va asya |
    sva masyasya svam | va~yavyagg svagg vayavya masyasya vayavyam sva masyasya svam | || 'syasya camasa
    shcamaso sva masyasya svam | va 'nanvarabhya nanvarabhya va va 'nanvarabhya | ananvarabhya shravaye
    dashravaye dananvarabhya nanvarabhya shravaye ananvarabhyetyananu shravaye dashravaye ttasma danvarabhya
    | anvarabhya shravya mashravya manvarabhya ashravyagg sva thsva dashravya mashravyagg svat | naityeti
    na naiti | soma mapratishthapya pratishthapya somagm soma mapratishthapya | apratishthapya stotragg
    stotra mapratishthapya pratishthapya stotram | apratishthapyetyaprati stotra mupakaro tyupakaroti
    stotragg stotra mupakaroti | upakaro tyapratishthito 'pratishthita upakaro tyupakaro tyapratishthitah
    | ssomo 'pratishthito 'pratishthita apratishthita ityaprati somo bhavati bhavati soma bhava tyapratishthito
    'pratishthito bhavati bhava tyapratishthitah | sstomo 'pratishthito 'pratishthita apratishthita ityaprati
    stomo 'pratishthita nyapratishthitani stoma sstomo 'pratishthitani | apratishthita nyuktha nyuktha
    nyapratishthita nyapratishthita nyukthani | apratishthitanityaprati uktha nyapratishthito 'pratishthita
    uktha nyuktha nyapratishthitah | apratishthito yajamano yajamano 'pratishthito 'pratishthito yajamanah
    | apratishthita ityaprati yajamano 'pratishthito 'pratishthito yajamano yajamano 'pratishthitah |
    apratishthito 'ddhvaryu raddhvaryu rapratishthito 'pratishthito 'ddhvaryuh | apratishthita ityaprati
    va~yavya maddhvaryu raddhvaryu vai somasya somasya vai vai somasya | somasya pratishtha pratishtha
    somasya somasya pratishtha | pratishtha camasa shcamasah pratishtha pratishtha camasah | pratishtheti
    prati 'syasya camasa shcamaso asya pratishtha pratishtha 'sya ssomah pratishtha pratishtha somah |
    pratishtheti prati sstomasya stomasya soma sstomasya stomasya stomah | stoma ukthana mukthanag stoma
    ngraha mukthana mukthana va grihitva grihitva va va grihitva | ngrihitva grihitva camasam | vonni
    yonniya va vonniya | unniya stotragg stotra munni yonniya stotram | stotra mupakurya dupakurya stotra
    mupakuryat | tprati pratyupakurya dupakurya upakuryadityupa pratyevaiva prati pratyeva | eva somagm
    soma mevaiva soma somagg sthapayati sthapayati somagm somagg sthapayati | sthapayati prati prati sthapayati
    sthapayati prati | prati stomagg stoma mprati prati stoma mprati prati stomagg stoma pratyuktha nyukthani
    prati pratyukthani | ukthani prati pratyuktha nyukthani prati | prati yajamano yajamanah prati prati
    yajamanah | yajamana stishthati tishthati yajamano yajamana stishthati | tishthati prati prati tishthati
    tishthati prati | pratyaddhvaryu raddhvaryuh prati pratyaddhvaryuh | addhvaryurityaddhvaryuh | ||
    mbharanti bharanti sagm sa dbharanti bharanti yat | thsomakrayanyai somakrayanyai ya mpadagm somakrayanyai
    somakrayanyai padam | somakrayanya iti soma yajnamukhagm havirdhane havirdhane yajnamukham ya~jnamukhagm
    havirdhane yajnamukhamiti yajna hi havirdhane havirdhane yar havirdhane iti havih hi havirdhane havirdhane
    yar havirdhane praci praci havirdhane havirdhane praci havirdhane iti havih pravartayeyuh pravartayeyuh
    praci praci pravartayeyu star hi pravartayeyuh pravartayeyu star pravartayeyuriti pra aksha mupopaksha
    maksha mupa | njya danjya dupopa dyajnamukhe yajnamukhe yajnamukha evaiva yajnamukhe yajnamukha eva
    | yajnamukha iti yajna ya~jna mevaiva yajnam | yajna manvanu yajnam anu sagm sa manvanu sam | ntanoti
    tanoti sagm sa ntanoti tanoti pranca pranca magni magni mpranca magnim | mpra pragni magni pra haranti
    haranti pra pra haranti | hara ntyudu ddharanti hara ntyut | a nayanti nayantya nayanti | naya ntyanvanu
    nayanti naya ntyanu | anvanag syanag syanva nvanagmsi | anagmsi pra pranag syanagmsi pra | pra vartayanti
    vartayanti pra pra vartayanti | vartaya ntyathatha vartayanti vartaya ntyatha | atha vai va athatha
    vai | va asyasya vai va asya | esha dhishniyo dhishniya esha esha dhishniyah | dhishniyo hiyate hiyate
    dhishniyo dhishniyo hiyate | hiyate sa sa hiyate hiyate sah | so 'nvanu sa so 'nu | anu dhyayati dhyaya
    tyanvanu dhyayati | dhyayati sa sa dhyayati dhyayati sah | ishvaro rudro rudra i rudro bhutva bhutva
    rudro rudro bhutva | mbhutva bhutva prajam | || yajamanasya yajamanasya pashu ryajamanasya yajamanasya
    shamayitoh | pashu maprita maprita aprita mudanca mudanca maprita maprita mudancam | nnayanti naya
    ntyudanca mudanca hi nayanti nayanti tar ntasya tasya pashushrapanam | pashushrapanagm hare ddhare
    mpashushrapanagm haret | pashushrapanamiti pashu ttena tena hare ddhare tenai vaiva tena tenaiva |
    nkaroti karoti bhagina karoti yajamano yajamanah karoti karoti yajamanah | yajamano vai vai yajamano
    yajamano vai | va ahavaniya ahavaniyo vai va ahavaniyah | ahavaniyo yajamanam ya~jamana mahavaniya
    ahavaniyo yajamanam | yadahavaniya dahavaniya mpashushrapana mahavaniya dahavaniya pashushrapanagm
    haranti haranti pashushrapana mpashushrapanagm haranti | pashushrapanamiti pashu haranti sa sa haranti
    haranti sah | thsya devaiva syat | nnirmanthyagg sya nirmanthyamiti nih dva va kuryat | dyajamanasya
    yajamanasya kurya yajamanasya satmatvaya satmatvaya yajamanasya yajamanasya satmatvaya | satmatvaya
    yadi yadi satmatvaya satmatvaya yadi | satmatvayeti satma pasho ravadana mavadana mpashoh pasho ravadana
    nnashye davadana mavadana nashye dajyasya jyasya nashye nnashye dajyasya | ajyasya pratyakhyaya mpratyakhyaya
    majyasya jyasya pratyakhyaya pratyakhyaya mavava pratyakhyaya mpratyakhyaya mava | pratyakhyayamiti
    prati ddye davava dyet | eva tata stata evaiva tatah | tatah prayashcittih prayashcitti stata statah
    prayashcittih | rye ye prayashcittih prayashcitti vimathniranniti vi tan kamayeta kamayeta tag kamayetarti
    marti nkamayeta kamayetarti arti ma ''rti marti ma | riccheyu rarccheyuh | riccheyu riti tyriccheyur
    tkuvi dititi kuvit | kuvi danganga kuvi ange ti tyangange ti | iti namovriktivatya namovriktiva tyetiti
    namovriktivatya | namovriktiva tyarcarca namovriktivatya namovriktiva tyarca | namovriktivatyeti namovrikti
    ddhra ricarca ''gni ddhre juhuyaj juhuya dagni namovrikti mevaiva namovrikti namovriktimiti namah
    evaisha mesha mevaivaisha vri~nkte vrinkta esha mesham ktajag vrinkte vrinkte tajak | arti ma ''rti
    marti ma | arccha ntyriccha ntyarcchanti | ricchantityricchanti | || rjayamana jayamanah prajapateh
    prajapate prajapateriti praja jayamanah prajah praja jayamana jayamanah prajah | praja jata jatah
    prajah praja jatah | jatashca ca jata jatashca | ca ya yashca ca yah | ya ima ima ya ya imah | tasmai
    prati prati tasmai tasmai prati | prati pra pra prati prati pra | pra vedaya vedaya pra pra vedaya
    | vedaya cikitvag vedaya vedaya cikitvan | cikitvagm anvanu cikitvag shcikitvagm anu | mmanyata manvanu
    manyatam | manyatamiti manyatam | mpashupate pashupate pashu pashupate te te pashupate pashupate te
    | te adyadya te te adya | adya baddhnami baddhna myadyadya baddhnami | baddhna myagne 'gne baddhnami
    baddhna myagne | agne sukritasya sukritasya gne 'gne sukritasya | sukritasya maddhye maddhye sukritasya
    sukritasya maddhye maddhya iti maddhye anu manyasva manyasva nvanu manyasva | manyasva suyaja suyaja
    manyasva manyasva suyaja suyaja yajama yajama suyaja suyaja yajama | ida mastva stvida mida mastu
    | astu havyagm havya mastvastu havyam | havyamiti havyam | prajanantah prati prati prajanantah prajanantah
    prati | prajananta iti pra prati grihnanti grihnanti prati prati grihnanti | grihnanti purve purve
    grihnanti grihnanti purve prana mangebhyo 'nge bhyah pari paryangebhyo 'nge paryacaranta macaranta
    mpari paryacarantam | ya~hi yahi suvargagm suvargam yahi pathibhih pathibhi ryahi yahi pathibhih |
    devayanai roshadhi shvoshadhishu devayanai rdevayanai roshadhishu | oshadhishu prati pratyoshadhi
    shvoshadhishu prati | prati tishtha tishtha prati prati tishtha | shsharirai stishtha tishtha shariraih
    | sharirairiti shariraih | yesha misha ishe yesham ishe pashupatih pashupati risha ishe pashupatih
    | || mpashupatih pashupatih pashunam | catushpada mutota catushpada catushpadamiti catuh nnishkrito
    nishkrito 'yam | nishkrita iti nih raya sposhah posha rayo raya sposhah posha yajamanasya yajamanasya
