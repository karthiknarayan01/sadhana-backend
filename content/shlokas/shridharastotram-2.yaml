id: shridharastotram-2
category: stotram
name:
  english: shridharastotram 2
  devanagari: श्रीधरस्तोत्रम् २
content:
  english: shridharastotram anandaghanarupaya nitya mangalarupine | mokshanandaya shantaya shridharaya
    namo namah || 1|| jnanamritaya triptaya jnanabodhaya yogine | jnanajyotisvarupaya shridharaya namo
    namah || 2|| vishvoddharaya shuddhaya vishvakalyanakarine | vishvesha vishvavandyaya shridharaya namo
    namah || 3|| gurave yativaryaya purnavairagyasindhave | bhaktoddharavataraya shridharaya namo namah
    || 4|| satyajnanasvarupaya nityabrahmasvarupine | bhakti mukti pradatre ca shridharaya namo namah
    || 5|| brahmanandavabodhaya daivisampabvidhayine | anandavana rupaya shridharaya namo namah || 6||
    dayasagararupaya saccidanandarupine | sarvavedantavedyaya shridharaya namo namah || 7|| bhaktatritapacandraya
    bhaktatranaparayine | samsara taranartaya shridharaya namo namah || 8|| bhaktibhavakritam sa stotram
    punyam pavanamuttam | pathetadinida stotram samukto bhavati dhruvam || 9|| iti kumari janaki devishri
    viracitam shrigurushridharastotram sampurnam |
  devanagari: श्रीधरस्तोत्रम् आनन्दघनरूपाय नित्य मङ्गलरूपिणे । मोक्षानन्दाय शान्ताय श्रीधराय नमो नमः ॥
    १॥ ज्ञानामृताय तृप्ताय ज्ञानबोधाय योगिने । ज्ञानज्योतिस्वरूपाय श्रीधराय नमो नमः ॥ २॥ विश्वोद्धाराय
    शुद्धाय विश्वकल्याणकारिणे । विश्वेश विश्ववन्द्याय श्रीधराय नमो नमः ॥ ३॥ गुरवे यतिवर्याय पूर्णवैराग्यसिन्धवे
    । भक्तोद्धारावताराय श्रीधराय नमो नमः ॥ ४॥ सत्यज्ञानस्वरूपाय नित्यब्रह्मस्वरूपिणे । भक्ति मुक्ति प्रदात्रे
    च श्रीधराय नमो नमः ॥ ५॥ ब्रह्मानन्दावबोधाय दैवीसम्पब्विधायिने । आनन्दवन रूपाय श्रीधराय नमो नमः ॥ ६॥
    दयासागररूपाय सच्चिदानन्दरूपिणे । सर्ववेदान्तवेद्याय श्रीधराय नमो नमः ॥ ७॥ भक्तत्रितापचन्द्राय भक्तत्राणपरायिणे
    । संसार तारणार्तय श्रीधराय नमो नमः ॥ ८॥ भक्तिभावकृतं सा स्तोत्रं पुण्यं पावनमुत्तम् । पठेतदिनिद स्तोत्रं
    समुक्तो भवति ध्रुवम् ॥ ९॥ इति कुमारी जानकी देवीश्री विरचितं श्रीगुरुश्रीधरस्तोत्रं सम्पूर्णम् ।
meaning: {}
