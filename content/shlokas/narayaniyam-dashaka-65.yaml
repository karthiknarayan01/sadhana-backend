id: narayaniyam-dashaka-65
category: stotram
name:
  english: Narayaniyam Dashaka 65
content:
  english: gopijanaya kathitam niyamavasane marotsavam tvamatha sadhayitum pravrittah | sandrena candramahasa
    shishirikritashe prapurayo muralikam yamunavanante || || sammurchanabhiruditasvaramandalabhih sammurchayantamakhilam
    bhuvanantaralam | tvadvenunadamupakarnya vibho tarunya stattadrisham kamapi cittavimohamapuh || ||
    ta gehakrityaniratastanayaprasaktah kantopasevanaparashca saroruhakshyah | sarvam visrijya muraliravamohitaste
    kantaradeshamayi kantatano sametah || || kashcinnijangaparibhushanamadadhana venupranadamupakarnya
    kritardhabhushah | tvamagata nanu tathaiva vibhushitabhya sta eva samrurucire tava locanaya || ||
    haram nitambabhuvi kacana dharayanti kancim ca kanthabhuvi deva samagata tvam | haritvamatmajaghanasya
    mukunda tubhyam vyaktam babhasha iva mugdhamukhi visheshat || || kacit kuce punarasajjitakanculika
    vyamohatah paravadhubhiralakshyamana | tvamayayau nirupamapranayatibhara rajyabhishekavidhaye kalashidhareva
    || || kashcit grihat kila niretumaparayantya stvameva deva hridaye sudridham vibhavya | deham vidhuya
    paracitsukharupamekam tvamavishan paramima nanu dhanyadhanyah || || jaratmana na paramatmataya smarantyo
    naryo gatah paramahamsagatim kshanena | tam tvam prakashaparamatmatanum kathanci ccitte vahannamritamashramamashnuviya
    || || abhyagatabhirabhito vrajasundaribhi rmugdhasmitardravadanah karunavaloki | nissimakantijaladhistvamavekshyamano
    vishvaikahridya hara me pavanesha rogan ||
  devanagari: गोपीजनाय कथितं नियमावसाने मारोत्सवं त्वमथ साधयितुं प्रवृत्तः । सान्द्रेण चान्द्रमहसा शिशिरीकृताशे
    प्रापूरयो मुरलिकां यमुनावनान्ते ॥ ॥ सम्मूर्छनाभिरुदितस्वरमण्डलाभिः सम्मूर्छयन्तमखिलं भुवनान्तरालम्
    । त्वद्वेणुनादमुपकर्ण्य विभो तरुण्य स्तत्तादृशं कमपि चित्तविमोहमापुः ॥ ॥ ता गेहकृत्यनिरतास्तनयप्रसक्ताः
    कान्तोपसेवनपराश्च सरोरुहाक्ष्यः । सर्वं विसृज्य मुरलीरवमोहितास्ते कान्तारदेशमयि कान्ततनो समेताः ॥
    ॥ काश्चिन्निजाङ्गपरिभूषणमादधाना वेणुप्रणादमुपकर्ण्य कृतार्धभूषाः । त्वामागता ननु तथैव विभूषिताभ्य
    स्ता एव संरुरुचिरे तव लोचनाय ॥ ॥ हारं नितम्बभुवि काचन धारयन्ती काञ्चीं च कण्ठभुवि देव समागता त्वाम्
    । हारित्वमात्मजघनस्य मुकुन्द तुभ्यं व्यक्तं बभाष इव मुग्धमुखी विशेषात् ॥ ॥ काचित् कुचे पुनरसज्जितकञ्चुलीका
    व्यामोहतः परवधूभिरलक्ष्यमाणा । त्वामाययौ निरुपमप्रणयातिभार राज्याभिषेकविधये कलशीधरेव ॥ ॥ काश्चित्
    गृहात् किल निरेतुमपारयन्त्य स्त्वामेव देव हृदये सुदृढं विभाव्य । देहं विधूय परचित्सुखरूपमेकं त्वामाविशन्
    परमिमा ननु धन्यधन्याः ॥ ॥ जारात्मना न परमात्मतया स्मरन्त्यो नार्यो गताः परमहंसगतिं क्षणेन । तं त्वां
    प्रकाशपरमात्मतनुं कथञ्चि च्चित्ते वहन्नमृतमश्रममश्नुवीय ॥ ॥ अभ्यागताभिरभितो व्रजसुन्दरीभि र्मुग्धस्मितार्द्रवदनः
    करुणावलोकी । निस्सीमकान्तिजलधिस्त्वमवेक्ष्यमाणो विश्वैकहृद्य हर मे पवनेश रोगान् ॥
