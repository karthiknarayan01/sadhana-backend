id: sumati-satakam-telugu
category: stotram
name:
  english: Sumati Satakam (Telugu)
content:
  english: shri ramuni dayacetanu narudhiga sakala janulu naura yanaga dharalamaina nitulu noruraga javulu
    putta nudivèda sumati || || akkaraku rani cuttamu mròkkina varamini velpu mòharamuna da nèkkina barani
    gurramu grakkuna vidavangavalayu gadara sumati || || adigina jitambiyyani midimelapu dòranu gòlci
    midukuta kantèn vadigala yèddula gattuka madi dunnuku bratuka vaccu mahilo sumati || || adiyasa kòluvu
    gòluvaku kujanula todan viduvaka kurimi seyaku madavini dodarakònti narugaku sumati || gadalaka madhuramulagu
    bhasha ludugi mauna vratudau adhikara roga purita badhirandhaka shavamu juda bapamu sumati || || appu
    kòni ceyu vibhavamu muppuna briayamputalu dapparayani nripu rajyamu dèpparamai mida gidu dèccura sumati
    || vaidyudu nèppudu nèdatègaka paru nerunu dvijudun jòppadina yura nundumu còppadakunnatti yuru còrakumu
    sumati || || alluni mancitanambu gòllani sahitya vidya bòlluna dancina biyyamu dèllani kakulunu levu
    tèliyumu sumati || || akònna kudè yamritamu takòncaka niccuvandè data dharitrin sokorcuvadè manujudu
    tekuva galavadè vamsha tilakudu sumati || || akali yudugani kadupunu vekatiyagu lanja padupu viduvani
    bratukun brakònna nuti yudakamu mekala padiyunu rota medini sumati || ranamuna jòccunade magatanambu
    sukavishvarulun mèccunade nercu vaduku vaccunade kidu summu vasudhanu sumati || || immuga jaduvani
    norunu namma yani bilici yanna madugani norun dammula biluvani norunu gummari manu dravvinatti guntara
    sumati || || udumundadè nurendlunu badiyundadè permi bamu padinurendlun maduvuna gòkkèra yundadè kadu
    nila burushartha parudu gavalè sumati || || uttamagunamulu nicuna kèttèṟaguna galuga nercu nèyyèdalam
    da nètticci karagi posina nittadi bangaramagunè yilalo sumati || udakamu dravèdu hayamunu madamuna
    nuppòngucundu mattebhambun mòdavu kada nunna vrishabhamu jaduvani yanicu gadaku janakura sumati ||
    || upakariki nupakaramu viparitamu gadu seya vivarimpanga napakariki nupakaramu nèpamènnaka seyuvadu
    nerpari sumati || || upamimpa mòdalu tiyyana kapatam bèdanèdanu jèṟaku kai vadine po nèpamulu vèdakunu
    gadapata gapatapu durjati pòndu gadara sumati || || èppati kèyyadi prastuta mappatika mataladi yanyula
    manamul nòppincaka tappincuka tiruguvadu dhanyudu sumati || || èppudu dappulu vèdakèdu nappurushuni
    gòlvaguda dadi yètlannan sarpambu padaga nidanu gappa vasincina vidhambu gadara sumati || || èppudu
    sampada kaligina nappudu bandhuvulu vattu radi yètlannan tèppaluga jèṟuvu nindina gappalu padivelu
    ceru gadara sumati || duṟakumi bandhujanula doshamu summi miṟakumi guruvu najna medini sumati || ||
    òka yuriki nòka karanamu gakavikalu gaka yundunè sakalambunu gòttuvadaka sahajamu sumati || || òru
    natma dalacu sati vidu maṟumatalu paluku satula mannimpakumi vèṟa pèṟugani bhatunelaku || òllani sati
    nòllani pati nòllani cèlikani viduva nòllani vade gòllandu kaka dharalo gòllandunu gòlladaunè gunamuna
    sumati || || odala bandlunu vaccunu odalu nabandlamida nòppuga vaccun odalu bandlunu valane vadambadu
    galimi lemi vasudhanu sumati || || kadu balavantudainanu budamini brayamputali buttina yintan dadavunda
    niccèneniyu badupuga nangadiki danè bamputa sumati || || kanakapu simhasanamuna shunakamu gurcundabètti
    shubha lagnamunam dònaraga battamu gattina vènukati gunamela manu vinara sumati || muppuna daridrudainanu
    tappadu maṟi duhkha maguta tathyamu sumati || || kamalamulu nita basina kamalaptuni rashmi soki kamalina
    bhangin tama tama nèlavulu dappina tama mitrulu shatrulauta tathyamu sumati || || karanamu garanamu
    nammina maranantaka maunu gani manaledu sumi karanamu dana sari karanamu maṟi nammaka marma mika manavalè
    sumati || || karanamula nanusarimpaka virasambuna dinna tindi vikatincu jumi yirusuna kandèna bèttaka
    parameshvaru bandi yaina baradu sumati || gara maruduga lèkka gònaru gadara sumati || || kasugaya
    gaṟaci cucina masalaka pasa yògaru raka madhurambaguna pasa galugu yuvatulundaga pasi balala bònduvadu
    pashuvura sumati || || kavi kani vani vratayu navarasa bhavamulu leni natula valapun davili canu pandi
    neyani vividhayudha kaushalambu vridhara sumati || || kadu sumi dussangati kanta pòndina pidapan vadu
    sumi yappiccuta ledu sumi satula valapu leshamu sumati || || kamukudu danisi vidicina komali baravitudu
    gavaya goruta yèllan bremamuna jèṟaku pippiki cimalu vèsa muginatlu siddhamu sumati || || karanamu
    leni nagavunu prithivi sthalilo buranamu leni burèyu viranamu leni pèndli vridhara sumati || || kulakanta
    toda nèppudu galahimpaku vatti tappu ghatiyimpakumi kalakanthi kanta kanni ròlikina siri yinta nunda
    nòlladu sumati || || kurimi gala dinamulalo neramu lènnadunu galuga neravu maṟi ya kurimi virasambainanu
    neramule tocu cundu nikkamu sumati || || kòncèpu naru sangatice nancitamuga gidu vaccu nadi yètlannan
    gincittu nalli kuttina mancamunaku jetu vaccu mahilo sumati || || kòkkokamèlla jadivina mikkili ròkkamu
    liyyaka cikkadura varakanta siddhamu sumati || || kòṟa gani kòduku buttina kòṟa gamiyè kadu tandri
    gunamula jèṟacun cèṟaku tuda vènnu buttina jèṟakuna tipèlla jèṟacu siddhamu sumati || || komali vishvasambunu
    bhumishula nammikalunu bònkura sumati || || gadana gala magani jucina nadugaduguna madugu lidudu rativalu
    damalo gada nudugu magani jucina nada pinugu vaccè nancu naguduru sumati || || cintimpaku kadacina
    pani kintulu valaturani namma kèntayu madilo nantahpura kantalato mantanamula manu midiyè matamura
    sumati || || cimalu pèttina puttalu pamula kiravainayatlu pamarudu dagan hemambu guda bèttina bhumishula
    pala jeru bhuvilo sumati || || cuttamulu gani varalu cuttamulamu nikatancu sòmpu dalirpan nèttukòni
    yashrayinturu gattiga dravyambu galuga gadara sumati || || cetulaku dòdavu danamu bhutalanathulaku
    dòdavu bònkami dharalo nitiyè tòdavèvvariki natiki manambu tòdavu nayamuga sumati || kadu vegam badici
    padina garyam bagune jèdipoyina karyamèlla jekuṟu sumati || || tana kopamè tana shatruvu tana shantamè
    tanaku raksha daya cuttambau tana santoshamè svargamu tana duhkhamè naraka mandru tathyamu sumati
    || || tana yuri tapasi tapamunu tana putruni vidya pèmpu dana pèrati cèttu mandunu manasuna varnimparètti
    manujulu sumati || || tana kalimi yindra bhogamu tana lemiyè svargaloka daridryambun tanu valacina
    yadiyè rambha tathyamu sumati || || tana varu leni cotanu manujunakunu niluva dagadu mahilo sumati
    || || tamalamu veyani norunu vimatulato cèlimi cesi vètabadu tèlivin gamalamulu leni kòlakunu himadhamudu
    leni ratri hinamu sumati || || talanundu vishamu phanikini vèlayanga doka nundu vrishcikamunakun tala
    toka yanaka yundunu khalunaku niluvèlla vishamu gadara sumati || || talapòdugu dhanamu posina vèlayaliki
    nijamu ledu vivarimpanga dala dadivi basa jesina vèlayalini nammaradu vinara sumati || valuvalu masinanu
    brana vallabhunainan gulakantalaina roturu tilakimpaga bhumilona diramuga sumati || || tanu bhujimpani
    yarthamu manava pati jeru gònta maṟi bhugatamau ganala nigalu gurcina teniya yòru jerunatlu tiramuga
    sumati || || daggaṟa kòndèmu sèppèdu prèggada palukulaku raju priyudai maṟi da nèggu braja kacarincuta
    bòggulakai kalpataruvu bòducuta sumati || || dhanapati sakhudai yundina nènayanga shivudu bhikshamèttaga
    valasèn dana vari kènta galigina dana bhagyamè tanaku gaka tathyamu sumati || || dhirulaku jeyu meladi
    sarambagu narikela salilamu bhangin gauravamunu maṟi midata bhuri sukhavahamu nagunu bhuvilo sumati
    || || naduvakumi tèruvòkkata guduvakumi shatru ninta gurimi todan nuduvakumi yòrula manasu nòvvaga
    sumati || nammaku mangadi vanini nammaku mi vama hastu navanini sumati || || nayamuna balum dravaru
    bhayamunanu vishammunaina bhakshinturuga bhayame jupanga valayu baguga sumati || || narapatulu meṟa
    dappina diramòppaga vidhava yinta dirpari yainan maranantaka maunugani manadu sumati || || navarasa
    bhavalankrita kavita goshtiyunu madhura ganambunu da naviveki kènta jèppina jèvitiki shankhudinatlu
    siddhamu sumati || navvakumi vipravarula nayamidi sumati || || nire pranadharamu nore rasabharitamaina
    nuduvula kèllan nariyè narulaku ratnamu cirayè shringaramandru siddhamu sumati || || pagavala dèvvari
    todanu vagavanga valadu lemi vaccina pidapan dèga nada valadu sabhalanu maguvaku manasiyya valadu
    mahilo sumati || dannu gurina satikadakunu sutukadaku rittacetula matimantulu canaru niti margamu
    sumati || || paniceyunèdala dasiyu danabhukti yèdala dalliyu nan dana kulakanta yundu nagura sumati
    || parulu danu bògada nègadaka paru laligina naluga natadu paramudu sumati || sarigani goshti seyaku
    siricèdi cuttambu kadaku jeraku sumati || || parasatula goshthi nundina purushudu gangeyudaina bhuvi
    ninda padun barasati sushilayainanu barusangati nunna ninda palagu sumati || || parulaku nishtamu
    sèppaku pòrugindlaku banulu leka povaku mèpudun baru gadisina sati gavayaku mèṟigiyu birusaina hayamu
    lèkkaku sumati || || parvamula satula gavayaku murvishvaru karuna nammi yubbaku madilo garvimpa nali
    bèmpaku nirvahanamu leni cota niluvaku sumati || || palu domi seyu vidiyamu tarunulayèdalan bòla yaluka
    nati kutami vèla yintani cèpparadu vinara sumati || || patèṟugani pati kòluvunu gutambuna kèṟukapadani
    komali ratiyun betètta jeyu cèlimiyu netiki nèduridinattu lènnaga sumati || || palanu galasina jalamunu
    pala vidhambunanè yundu barikimpanga pala cavi jèṟacu gavuna palasudagu vani pòndu valadura sumati
    || || palasunakaina yapada jalimbadi tirpa dagadu sarvajnunakun telagni badaga battina melèṟugunè
    mitu gaka medini sumati || || piluvani panulaku bovuta biluvani perantambunu valuvani cèlimiyunu jeya
    valadura sumati || || putrotsahamu tandriki putrudu janmincinapudè puttadu janula putruni kanugòni
    bògadaga putrotsahambu nadu pòndura sumati || || purikini pranamu gomati varikini pranambu niru vasumati
    lonan garikini pranamu tòndamu sirikini pranambu maguva siddhamu sumati || || puli palu dècci yiccina
    nalavadaga gundè gosi yaṟace nidinan vèlayaliki gurmi ledu vinara sumati || || pèttina dinamula lopala
    nattadavulanaina vaccu nanarthamulun bèttani dinamula ganakapu gattèkkina nemi ledu gadara sumati
    || || pòruguna bagavadundina niravòndaka vratakadè yelika yainan garanalaku braduku ledu gadara sumati
    || || bangaru kuduva bèttaku sangaramuna baṟipoku sarasudavaite nangadi vèccamu vadaku vèngalito jèlimi
    valadu vinara sumati || || balavantuda nakemani paluvurato nigrahinci palukuta mela balavanta maina
    sarpamu cali cimala ceta jikki cavadè sumati || || madinòkani valaci yundaga madicèdi yòka krura vitudu
    manaka tirugun badi ciluka pilli pattina jaduvunè yapanjaramuna jagatini sumati || || mandala pati
    samukhambuna mèndaina pradhani leka mèlaguta yèllan gòndanta madapu tenugu tòndamu lekundinatlu docura
    sumati || || mantrigalavani rajyamu tantramu sèdakunda nilucu daṟacuga dharalo mantri vihinuni rajyamu
    jantrapu giludinatlu jarugadu sumati || || mataku branamu satyamu kotaku branambu subhata koti dharitrin
    botiki branamu manamu citiki branambu vralu siddhamu sumati || || manadhanu datmadhriti cèdi hinundagu
    vani nashrayincuta yèllan manèdu jalamula lopala nenugu mèyi dacinattu lèṟugumu sumati || || melèncani
    malinyuni mangali hituga nelina narapati rajyamu nela galasi povugani nègadadu sumati || || rapòmmani
    piluvani ya bhupaluni gòlva bhukti muktulu galave dipambu leni yintanu jepuna killadinatlu siddhamu
    sumati || || rupinci paliki bònkaku prapagu cuttambu nèggu palukaku madilo gopincu raju gòlvaku papapu
    deshambu sòṟaku padilamu sumati || || lavigalavani kantènu bhavimpaga nitiparudu balavantundau granambanta
    gajambunu mavativadèkkinatlu mahilo sumati || || vaṟadaina cenu dunnaku kaṟavainanu bandhujanula kada
    kegakumi parulaku marmamu cèppaku pirikiki dalavayi tanamu pèttaku sumati || || varipanta leni yurunu
    todu dòrakani tèruvun dharanu pati leni grihamunu narayanga rudrabhumi yanadagu sumati || || vinadagu
    nèvvaru jèppina vininantanè vega padaka vivarimpa dagun kani kalla nijamu dèlisina manujudè po niti
    parudu mahilo sumati || || vidèmu seyani norunu jedèla yadharamritambu seyani norun padangarani norunu
    budida kiravaina padu bòndara sumati || || vèlayali valana gurimi galagadu maṟi galigèneni kadateṟaduga
    baluvuru nadacèdu tèruvuna mòlavadu puvu mòlicèneni pòdaladu sumati || || vèlayalu ceyu basalu vèlayaga
    mògasala bòndu vèlamala cèlimin galalona ganna kalimiyu vilasitamuga nammaradu vinara sumati || visamu
    da jeyanatti viridi gani kasulu gala vadè raju gadara sumati || || shubhamula pòndani caduvunu nabhinayamuga
    ragarasamu nandani patal gubha gubhalu leni kutami sabha mèccani matalèlla jappana sumati || || sarasamu
    virasamu kòṟake paripurna sukhambu ladhika badhala kòṟake pèruguta viruguta kòṟake dhara tagguta hèccu
    kòṟakè tathyamu sumati || || siri ta vaccina vaccunu salalitamuga narikela salilamu bhangin siri ta
    boyina bovunu kari mringina vèlaga pandu karanini sumati || || strila yèda vaduladaku balurato jèlimicesi
    bhashimpakumi melina pati ninda seya kènnadu sumati ||
  devanagari: श्री रामुनि दयचेतनु नारूढिग सकल जनुलु नौरा यनगा धारालमैन नीतुलु नोरूरग जवुलु पुट्ट नुडिवॆद
    सुमती ॥ ॥ अक्करकु रानि चुट्टमु म्रॊक्किन वरमीनि वेल्पु मॊहरमुन दा नॆक्किन बारनि गुर्रमु ग्रक्कुन विडवङ्गवलयु
    गदरा सुमती ॥ ॥ अडिगिन जीतम्बिय्यनि मिडिमेलपु दॊरनु गॊल्चि मिडुकुट कण्टॆन् वडिगल यॆद्दुल गट्टुक मडि
    दुन्नुकु ब्रतुक वच्चु महिलो सुमती ॥ ॥ अडियास कॊलुवु गॊलुवकु कुजनुल तोडन् विडुवक कूरिमि सेयकु मडविनि
    दोडरकॊण्टि नरुगकु सुमती ॥ गदलक मधुरमुलगु भाष लुडुगि मौन व्रतुडौ अधिकार रोग पूरित बधिरान्धक शवमु जूड
    बापमु सुमती ॥ ॥ अप्पु कॊनि चेयु विभवमु मुप्पुन बृआयम्पुटालु दप्परयनि नृपु राज्यमु दॆप्परमै मीद गीडु
    दॆच्चुर सुमती ॥ वैद्युडु नॆप्पुडु नॆडतॆगक पारु नेरुनु द्विजुडुन् जॊप्पडिन यूर नुण्डुमु चॊप्पडकुन्नट्टि
    यूरु चॊरकुमु सुमती ॥ ॥ अल्लुनि मञ्चितनम्बु गॊल्लनि साहित्य विद्य बॊल्लुन दञ्चिन बिय्यमु दॆल्लनि काकुलुनु
    लेवु तॆलियुमु सुमती ॥ ॥ आकॊन्न कूडॆ यमृतमु ताकॊञ्चक निच्चुवाङ्डॆ दात धरित्रिन् सोकोर्चुवाडॆ मनुजुडु
    तेकुव गलवाडॆ वंश तिलकुडु सुमती ॥ ॥ आकलि युडुगनि कडुपुनु वेकटियगु लञ्ज पडुपु विडुवनि ब्रतुकुन् ब्राकॊन्न
    नूति युदकमु मेकल पाडियुनु रोत मेदिनि सुमती ॥ रणमुन जॊच्चुनदे मगतनम्बु सुकवीश्वरुलुन् मॆच्चुनदे नेर्चु
    वदुकु वच्चुनदे कीडु सुम्मु वसुधनु सुमती ॥ ॥ इम्मुग जदुवनि नोरुनु नम्मा यनि बिलिचि यन्न मडुगनि नोरुन्
    दम्मुल बिलुवनि नोरुनु गुम्मरि मनु द्रव्विनट्टि गुण्टर सुमती ॥ ॥ उडुमुण्डदॆ नूरेण्ड्लुनु बडियुण्डदॆ
    पेर्मि बामु पदिनूरेण्ड्लुन् मडुवुन गॊक्कॆर युण्डदॆ कडु निल बुरुषार्थ परुडु गावलॆ सुमती ॥ ॥ उत्तमगुणमुलु
    नीचुन कॆत्तॆऱगुन गलुग नेर्चु नॆय्यॆडलं दा नॆत्तिच्चि करगि पोसिन नित्तडि बङ्गारमगुनॆ यिललो सुमती ॥
    उदकमु द्रावॆडु हयमुनु मदमुन नुप्पॊङ्गुचुण्डु मत्तेभम्बुन् मॊदवु कड नुन्न वृषभमु जदुवनि यानीचु गडकु
    जनकुर सुमती ॥ ॥ उपकारिकि नुपकारमु विपरीतमु गादु सेय विवरिम्पङ्गा नपकारिकि नुपकारमु नॆपमॆन्नक सेयुवाडु
    नेर्परि सुमती ॥ ॥ उपमिम्प मॊदलु तिय्यन कपटं बॆडनॆडनु जॆऱकु कै वडिने पो नॆपमुलु वॆदकुनु गडपट गपटपु
    दुर्जाति पॊन्दु गदरा सुमती ॥ ॥ ऎप्पटि कॆय्यदि प्रस्तुत मप्पटिका माटलाडि यन्युल मनमुल् नॊप्पिञ्चक तप्पिञ्चुक
    तिरुगुवाडु धन्युडु सुमती ॥ ॥ ऎप्पुडु दप्पुलु वॆदकॆडु नप्पुरुषुनि गॊल्वगूड ददि यॆट्लन्नन् सर्पम्बु
    पडग नीडनु गप्प वसिञ्चिन विधम्बु गदरा सुमती ॥ ॥ ऎप्पुडु सम्पद कलिगिन नप्पुडु बन्धुवुलु वत्तु रदि यॆट्लन्नन्
    तॆप्पलुग जॆऱुवु निण्डिन गप्पलु पदिवेलु चेरु गदरा सुमती ॥ दूऱकुमी बन्धुजनुल दोषमु सुम्मी मीऱकुमी गुरुवु
    नाज्ञ मेदिनि सुमती ॥ ॥ ऒक यूरिकि नॊक करणमु गकविकलु गाक युण्डुनॆ सकलम्बुनु गॊट्टुवडक सहजमु सुमती ॥
    ॥ ऒरु नात्म दलचु सति विडु मऱुमाटलु पलुकु सतुल मन्निम्पकुमी वॆऱ पॆऱुगनि भटुनेलकु ॥ ऒल्लनि सति नॊल्लनि
    पति नॊल्लनि चॆलिकानि विडुव नॊल्लनि वाडे गॊल्लण्डु काक धरलो गॊल्लण्डुनु गॊल्लडौनॆ गुणमुन सुमती ॥ ॥
    ओडल बण्ड्लुनु वच्चुनु ओडलु नाबण्ड्लमीद नॊप्पुग वच्चुन् ओडलु बण्ड्लुनु वलने वाडम्बडु गलिमि लेमि वसुधनु
    सुमती ॥ ॥ कडु बलवन्तुडैननु बुडमिनि ब्रायम्पुटालि बुट्टिन यिण्टन् दडवुण्ड निच्चॆनेनियु बडुपुग नङ्गडिकि
    दानॆ बम्पुट सुमती ॥ ॥ कनकपु सिंहासनमुन शुनकमु गूर्चुण्डबॆट्टि शुभ लग्नमुनं दॊनरग बट्टमु गट्टिन वॆनुकटि
    गुणमेल मानु विनरा सुमती ॥ मुप्पुन दरिद्रुडैननु तप्पदु मऱि दुःख मगुट तथ्यमु सुमती ॥ ॥ कमलमुलु नीट बासिन
    कमलाप्तुनि रश्मि सोकि कमलिन भङ्गिन् तम तम नॆलवुलु दप्पिन तम मित्रुलु शत्रुलौट तथ्यमु सुमती ॥ ॥ करणमु
    गरणमु नम्मिन मरणान्तक मौनु गानि मनलेडु सुमी करणमु दन सरि करणमु मऱि नम्मक मर्म मीक मनवलॆ सुमती ॥ ॥
    करणमुल ननुसरिम्पक विरसम्बुन दिन्न तिण्डि विकटिञ्चु जुमी यिरुसुन कन्दॆन बॆट्टक परमेश्वरु बण्डि यैन
    बारदु सुमती ॥ गर मरुदुग लॆक्क गॊनरु गदरा सुमती ॥ ॥ कसुगाय गऱचि चूचिन मसलक पस यॊगरु राक मधुरम्बगुना
    पस गलुगु युवतुलुण्डग पसि बालल बॊन्दुवाडु पशुवुर सुमती ॥ ॥ कवि कानि वानि व्रातयु नवरस भावमुलु लेनि
    नातुल वलपुन् दविलि चनु पन्दि नेयनि विविधायुध कौशलम्बु वृधरा सुमती ॥ ॥ कादु सुमी दुस्सङ्गति कान्त पॊन्दिन
    पिदपन् वादु सुमी यप्पिच्चुट लेदु सुमी सतुल वलपु लेशमु सुमती ॥ ॥ कामुकुडु दनिसि विडिचिन कोमलि बरविटुडु
    गवय गोरुट यॆल्लन् ब्रेममुन जॆऱकु पिप्पिकि चीमलु वॆस मूगिनट्लु सिद्धमु सुमती ॥ ॥ कारणमु लेनि नगवुनु
    पृथिवी स्थलिलो बूरणमु लेनि बूरॆयु वीरणमु लेनि पॆण्ड्लि वृधरा सुमती ॥ ॥ कुलकान्त तोड नॆप्पुडु गलहिम्पकु
    वट्टि तप्पु घटियिम्पकुमी कलकण्ठि कण्ट कन्नी रॊलिकिन सिरि यिण्ट नुण्ड नॊल्लदु सुमती ॥ ॥ कूरिमि गल दिनमुललो
    नेरमु लॆन्नडुनु गलुग नेरवु मऱि या कूरिमि विरसम्बैननु नेरमुले तोचु चुण्डु निक्कमु सुमती ॥ ॥ कॊञ्चॆपु
    नरु सङ्गतिचे नञ्चितमुग गीडु वच्चु नदि यॆट्लन्नन् गिञ्चित्तु नल्लि कुट्टिन मञ्चमुनकु जेटु वच्चु महिलो
    सुमती ॥ ॥ कॊक्कोकमॆल्ल जदिविन मिक्किलि रॊक्कमु लिय्यक चिक्कदुरा वारकान्त सिद्धमु सुमती ॥ ॥ कॊऱ गानि
    कॊडुकु बुट्टिन कॊऱ गामियॆ कादु तण्ड्रि गुणमुल जॆऱचुन् चॆऱकु तुद वॆन्नु बुट्टिन जॆऱकुन तीपॆल्ल जॆऱचु
    सिद्धमु सुमती ॥ ॥ कोमलि विश्वासम्बुनु भूमीशुल नम्मिकलुनु बॊङ्कुर सुमती ॥ ॥ गडन गल मगनि जूचिन नडुगडुगुन
    मडुगु लिडुदु रतिवलु दमलो गड नुडुगु मगनि जूचिन नड पीनुगु वच्चॆ नञ्चु नगुदुरु सुमती ॥ ॥ चिन्तिम्पकु
    कडचिन पनि किन्तुलु वलतुरनि नम्म कॆन्तयु मदिलो नन्तःपुर कान्तलतो मन्तनमुल मानु मिदियॆ मतमुर सुमती ॥
    ॥ चीमलु पॆट्टिन पुट्टलु पामुल किरवैनयट्लु पामरुडु दगन् हेमम्बु गूड बॆट्टिन भूमीशुल पाल जेरु भुविलो
    सुमती ॥ ॥ चुट्टमुलु गानि वारलु चुट्टमुलमु नीकटञ्चु सॊम्पु दलिर्पन् नॆट्टुकॊनि याश्रयिन्तुरु गट्टिग
    द्रव्यम्बु गलुग गदरा सुमती ॥ ॥ चेतुलकु दॊडवु दानमु भूतलनाथुलकु दॊडवु बॊङ्कमि धरलो नीतियॆ तॊडवॆव्वारिकि
    नातिकि मानम्बु तॊडवु नयमुग सुमती ॥ कडु वेगं बडिचि पडिन गार्यं बगुने जॆडिपोयिन कार्यमॆल्ल जेकुऱु सुमती
    ॥ ॥ तन कोपमॆ तन शत्रुवु तन शान्तमॆ तनकु रक्ष दय चुट्टम्बौ तन सन्तोषमॆ स्वर्गमु तन दुःखमॆ नरक मण्ड्रु
    तथ्यमु सुमती ॥ ॥ तन यूरि तपसि तपमुनु तन पुत्रुनि विद्य पॆम्पु दन पॆरटि चॆट्टु मन्दुनु मनसुन वर्णिम्परॆट्टि
    मनुजुलु सुमती ॥ ॥ तन कलिमि यिन्द्र भोगमु तन लेमियॆ स्वर्गलोक दारिद्र्यम्बुन् तनु वलचिन यदियॆ रम्भ
    तथ्यमु सुमती ॥ ॥ तन वारु लेनि चोटनु मनुजुनकुनु निलुव दगदु महिलो सुमती ॥ ॥ तमलमु वेयनि नोरुनु विमतुलतो
    चॆलिमि चेसि वॆतबडु तॆलिविन् गमलमुलु लेनि कॊलकुनु हिमधामुडु लेनि रात्रि हीनमु सुमती ॥ ॥ तलनुण्डु विषमु
    फणिकिनि वॆलयङ्गा दोक नुण्डु वृश्चिकमुनकुन् तल तोक यनक युण्डुनु खलुनकु निलुवॆल्ल विषमु गदरा सुमती ॥
    ॥ तलपॊडुगु धनमु पोसिन वॆलयालिकि निजमु लेदु विवरिम्पङ्गा दल दडिवि बास जेसिन वॆलयालिनि नम्मरादु विनरा
    सुमती ॥ वलुवलु मासिननु ब्राण वल्लभुनैनन् गुलकान्तलैन रोतुरु तिलकिम्पग भूमिलोन दिरमुग सुमती ॥ ॥ तानु
    भुजिम्पनि यर्थमु मानव पति जेरु गॊन्त मऱि भूगतमौ गानल नीगलु गूर्चिन तेनिय यॊरु जेरुनट्लु तिरमुग सुमती
    ॥ ॥ दग्गऱ कॊण्डॆमु सॆप्पॆडु प्रॆग्गड पलुकुलकु राजु प्रियुडै मऱि दा नॆग्गु ब्रज काचरिञ्चुट बॊग्गुलकै
    कल्पतरुवु बॊडुचुट सुमती ॥ ॥ धनपति सखुडै युण्डिन नॆनयङ्गा शिवुडु भिक्षमॆत्तग वलसॆन् दन वारि कॆन्त गलिगिन
    दन भाग्यमॆ तनकु गाक तथ्यमु सुमती ॥ ॥ धीरुलकु जेयु मेलदि सारम्बगु नारिकेल सलिलमु भङ्गिन् गौरवमुनु मऱि
    मीदट भूरि सुखावहमु नगुनु भुविलो सुमती ॥ ॥ नडुवकुमी तॆरुवॊक्कट गुडुवकुमी शत्रु निण्ट गूरिमि तोडन् नुडुवकुमी
    यॊरुल मनसु नॊव्वग सुमती ॥ नम्मकु मङ्गडि वानिनि नम्मकु मी वाम हस्तु नवनिनि सुमती ॥ ॥ नयमुन बालुं द्रावरु
    भयमुननु विषम्मुनैन भक्षिन्तुरुगा भयमे जूपङ्ग वलयु बागुग सुमती ॥ ॥ नरपतुलु मेऱ दप्पिन दिरमॊप्पग विधव
    यिण्ट दीर्परि यैनन् मरणान्तक मौनुगानि मानदु सुमती ॥ ॥ नवरस भावालङ्कृत कविता गोष्टियुनु मधुर गानम्बुनु
    दा नविवेकि कॆन्त जॆप्पिन जॆविटिकि शङ्खूदिनट्लु सिद्धमु सुमती ॥ नव्वकुमी विप्रवरुल नयमिदि सुमती ॥ ॥
    नीरे प्राणाधारमु नोरे रसभरितमैन नुडुवुल कॆल्लन् नारियॆ नरुलकु रत्नमु चीरयॆ शृङ्गारमण्ड्रु सिद्धमु
    सुमती ॥ ॥ पगवल दॆव्वरि तोडनु वगवङ्गा वलदु लेमि वच्चिन पिदपन् दॆग नाड वलदु सभलनु मगुवकु मनसिय्य वलदु
    महिलो सुमती ॥ दन्नु गूरिन सतिकडकुनु सुतुकडकु रित्तचेतुल मतिमन्तुलु चनरु नीति मार्गमु सुमती ॥ ॥ पनिचेयुनॆडल
    दासियु दनभुक्ति यॆडल दल्लियु नन् दन कुलकान्त युण्डु नगुरा सुमती ॥ परुलु दनु बॊगड नॆगडक परु ललिगिन
    नलुग नतडु परमुडु सुमती ॥ सरिगानि गोष्टि सेयकु सिरिचॆडि चुट्टम्बु कडकु जेरकु सुमती ॥ ॥ परसतुल गोष्ठि
    नुण्डिन पुरुषुडु गाङ्गेयुडैन भुवि निन्द पडुन् बरसति सुशीलयैननु बरुसङ्गति नुन्न निन्द पालगु सुमती ॥
    ॥ परुलकु निष्टमु सॆप्पकु पॊरुगिण्ड्लकु बनुलु लेक पोवकु मॆपुडुन् बरु गदिसिन सति गवयकु मॆऱिगियु बिरुसैन
    हयमु लॆक्ककु सुमती ॥ ॥ पर्वमुल सतुल गवयकु मुर्वीश्वरु करुण नम्मि युब्बकु मदिलो गर्विम्प नालि बॆम्पकु
    निर्वहणमु लेनि चोट निलुवकु सुमती ॥ ॥ पलु दोमि सेयु विडियमु तरुणुलयॆडलन् बॊल यलुक नाटि कूटमि वॆल यिन्तनि
    चॆप्परादु विनरा सुमती ॥ ॥ पाटॆऱुगनि पति कॊलुवुनु गूटम्बुन कॆऱुकपडनि कोमलि रतियुन् बेटॆत्त जेयु चॆलिमियु
    नेटिकि नॆदुरीदिनट्टु लॆन्नग सुमती ॥ ॥ पालनु गलसिन जलमुनु पाल विधम्बुननॆ युण्डु बरिकिम्पङ्गा पाल चवि
    जॆऱचु गावुन पालसुडगु वानि पॊन्दु वलदुर सुमती ॥ ॥ पालसुनकैन यापद जालिम्बडि तीर्प दगदु सर्वज्ञुनकुन्
    तेलग्नि बडग बट्टिन मेलॆऱुगुनॆ मीटु गाक मेदिनि सुमती ॥ ॥ पिलुवनि पनुलकु बोवुट बिलुवनि पेरण्टम्बुनु
    वलुवनि चॆलिमियुनु जेय वलदुर सुमती ॥ ॥ पुत्रोत्साहमु तण्ड्रिकि पुत्रुडु जन्मिञ्चिनपुडॆ पुट्टदु जनुला
    पुत्रुनि कनुगॊनि बॊगडग पुत्रोत्साहम्बु नाडु पॊन्दुर सुमती ॥ ॥ पुरिकिनि प्राणमु गोमटि वरिकिनि प्राणम्बु
    नीरु वसुमति लोनन् गरिकिनि प्राणमु तॊण्डमु सिरिकिनि प्राणम्बु मगुव सिद्धमु सुमती ॥ ॥ पुलि पालु दॆच्चि
    यिच्चिन नलवडगा गुण्डॆ गोसि यऱचे निडिनन् वॆलयालिकि गूर्मि लेदु विनरा सुमती ॥ ॥ पॆट्टिन दिनमुल लोपल
    नट्टडवुलनैन वच्चु नानार्थमुलुन् बॆट्टनि दिनमुल गनकपु गट्टॆक्किन नेमि लेदु गदरा सुमती ॥ ॥ पॊरुगुन बगवाडुण्डिन
    निरवॊन्दक व्रातकाडॆ येलिक यैनन् गरणालकु ब्रदुकु लेदु गदरा सुमती ॥ ॥ बङ्गारु कुदुव बॆट्टकु सङ्गरमुन
    बाऱिपोकु सरसुडवैते नङ्गडि वॆच्चमु वाडकु वॆङ्गलितो जॆलिमि वलदु विनरा सुमती ॥ ॥ बलवन्तुड नाकेमनि पलुवुरतो
    निग्रहिञ्चि पलुकुट मेला बलवन्त मैन सर्पमु चलि चीमल चेत जिक्कि चावदॆ सुमती ॥ ॥ मदिनॊकनि वलचि युण्डग
    मदिचॆडि यॊक क्रूर विटुडु मानक तिरुगुन् बदि चिलुक पिल्लि पट्टिन जदुवुनॆ यापञ्जरमुन जगतिनि सुमती ॥ ॥
    मण्डल पति समुखम्बुन मॆण्डैन प्रधानि लेक मॆलगुट यॆल्लन् गॊण्डन्त मदपु टेनुगु तॊण्डमु लेकुण्डिनट्लु
    दोचुर सुमती ॥ ॥ मन्त्रिगलवानि राज्यमु तन्त्रमु सॆडकुण्ड निलुचु दऱचुग धरलो मन्त्रि विहीनुनि राज्यमु
    जन्त्रपु गीलूडिनट्लु जरुगदु सुमती ॥ ॥ माटकु ब्राणमु सत्यमु कोटकु ब्राणम्बु सुभट कोटि धरित्रिन् बोटिकि
    ब्राणमु मानमु चीटिकि ब्राणम्बु व्रालु सिद्धमु सुमती ॥ ॥ मानधनु डात्मधृति चॆडि हीनुण्डगु वानि नाश्रयिञ्चुट
    यॆल्लन् मानॆडु जलमुल लोपल नेनुगु मॆयि दाचिनट्टु लॆऱुगुमु सुमती ॥ ॥ मेलॆञ्चनि मालिन्युनि मङ्गलि हितुगा
    नेलिन नरपति राज्यमु नेल गलसि पोवुगानि नॆगडदु सुमती ॥ ॥ रापॊम्मनि पिलुवनि या भूपालुनि गॊल्व भुक्ति
    मुक्तुलु गलवे दीपम्बु लेनि यिण्टनु जेपुन कील्लाडिनट्लु सिद्धमु सुमती ॥ ॥ रूपिञ्चि पलिकि बॊङ्ककु प्रापगु
    चुट्टम्बु नॆग्गु पलुककु मदिलो गोपिञ्चु राजु गॊल्वकु पापपु देशम्बु सॊऱकु पदिलमु सुमती ॥ ॥ लाविगलवानि
    कण्टॆनु भाविम्पग नीतिपरुडु बलवन्तुण्डौ ग्रानम्बन्त गजम्बुनु मावटिवाडॆक्किनट्लु महिलो सुमती ॥ ॥ वऱदैन
    चेनु दुन्नकु कऱवैननु बन्धुजनुल कड केगकुमी परुलकु मर्ममु चॆप्पकु पिरिकिकि दलवायि तनमु पॆट्टकु सुमती
    ॥ ॥ वरिपण्ट लेनि यूरुनु तोडु दॊरकनि तॆरुवुन् धरनु पति लेनि गृहमुनु नरयङ्गा रुद्रभूमि यनदगु सुमती ॥
    ॥ विनदगु नॆव्वरु जॆप्पिन विनिनन्तनॆ वेग पडक विवरिम्प दगुन् कनि कल्ल निजमु दॆलिसिन मनुजुडॆ पो नीति
    परुडु महिलो सुमती ॥ ॥ वीडॆमु सेयनि नोरुनु जेडॆल यधरामृतम्बु सेयनि नोरुन् पाडङ्गरानि नोरुनु बूडिद किरवैन
    पाडु बॊन्दर सुमती ॥ ॥ वॆलयालि वलन गूरिमि गलगदु मऱि गलिगॆनेनि कडतेऱदुगा बलुवुरु नडचॆडु तॆरुवुन मॊलवदु
    पुवु मॊलिचॆनेनि पॊदलदु सुमती ॥ ॥ वॆलयालु चेयु बासलु वॆलयग मॊगसाल बॊन्दु वॆलमल चॆलिमिन् गललोन गन्न
    कलिमियु विलसितमुग नम्मरादु विनरा सुमती ॥ वीसमु दा जेयनट्टि वीरिडि गानी कासुलु गल वाडॆ राजु गदरा सुमती
    ॥ ॥ शुभमुल पॊन्दनि चदुवुनु नभिनयमुग रागरसमु नन्दनि पाटल् गुभ गुभलु लेनि कूटमि सभ मॆच्चनि माटलॆल्ल
    जप्पन सुमती ॥ ॥ सरसमु विरसमु कॊऱके परिपूर्ण सुखम्बु लधिक बाधल कॊऱके पॆरुगुट विरुगुट कॊऱके धर तग्गुट
    हॆच्चु कॊऱकॆ तथ्यमु सुमती ॥ ॥ सिरि ता वच्चिन वच्चुनु सललितमुग नारिकेल सलिलमु भङ्गिन् सिरि ता बोयिन
    बोवुनु करि म्रिङ्गिन वॆलग पण्डु करणिनि सुमती ॥ ॥ स्त्रील यॆड वादुलाडकु बालुरतो जॆलिमिचेसि भाषिम्पकुमी
    मेलिन पति निन्द सेय कॆन्नडु सुमती ॥
