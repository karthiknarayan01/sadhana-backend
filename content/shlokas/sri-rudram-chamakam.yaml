id: sri-rudram-chamakam
category: stotram
name:
  english: Sri Rudram Chamakam
content:
  english: om agnavishnu sajoshasemavardhantu va ngirah | dyumnairvajebhiragatam | vajashca me prasavashca
    me prayatishca me prasitishca me dhitishca me kratushca me svarashca me shlokashca me shravashca me
    shrutishca me jyotishca me suvashca me pranashca me 'panashca me vyanashca me nca me vakca me manashca
    me cakshushca me shrotra nca me dakshashca me bala nca ma ojashca me sahashca ma ayushca me jara ca
    ma atma ca me tanushca me sharma ca me varma ca me 'sthani ca me parugmshi ca me sharirani ca me ||
    nca me manyushca me bhamashca me 'mbhashca me jema ca me mahima ca me varima ca me prathima ca me
    var shma ca me draghuya ca me vriddha nca me vriddhishca me satya nca me shraddha ca me jagacca me
    dhana nca me vashashca me tvishishca me krida ca me modashca me jata nca me bhavishyacca me suga nca
    ma riddhishca me klipta nca me kliptishca me matishca me sumatishca me || nca me mayashca me priya
    'nukamashca me kamashca me saumanasashca me bhadra nca me shreyashca me vasyashca me yashashca me
    bhagashca me dravina nca me yanta ca me dharta ca me kshemashca me dhritishca me vishva nca me mahashca
    me sam vi~cca me jnatra nca me sushca me prasushca me sira nca me layashca ma rita 'namayacca me jivatushca
    me dirghayutva nca me susha ca me sudina || urkca me sunrita ca me payashca me rasashca me ghrita
    nca me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca me jaitra nca me rayishca
    me rayashca me pushta nca me pushtishca me vibhu ca me prabhu ca me bahu ca me bhuyashca me purna
    'kshitishca me kuyavashca me 'kshucca me vrihayashca me yava shca me mudgashca me khalva shca me priyangavashca
    me 'navashca me shyamaka || ashma ca me mrittika ca me girayashca me parvatashca me sikatashca me
    vanaspatayashca me hiranya nca me trapushca me shyama 'gnishca ma apashca me virudhashca ma oshadhayashca
    me krishtapacya nca me gramyashca me pashava aranyashca yajnena kalpantam vitta nca me vittishca me
    bhuta nca me bhutishca me vasu ca me vasatishca me karma ca me shaktishca me 'rthashca ma emashca
    ma itishca me gatishca me || || agnishca ma indrashca me somashca ma indrashca me savita ca ma indrashca
    me sarasvati ca ma indrashca me pusha ca ma indrashca me brihaspatishca ma indrashca me mitrashca
    ma indrashca me varunashca ma indrashca me tvashtha ca ma indrashca me dhata ca ma indrashca me vishnushca
    ma indrashca me 'shvinau ca ma indrashca me marutashca ma indrashca me vishve ca me deva indrashca
    me prithivi ca ma indrashca me nca ma indrashca me dyaushca ma indrashca me dishashca ma indrashca
    me murdha ca ma indrashca me prajapatishca ma indrashca me || || agmshushca me rashmishca me 'dhipatishca
    ma upagmshushca me 'ntaryamashca ma aindravayavashca me maitravarunashca ma ashvinashca me pratiprasthanashca
    me shukrashca me manthi ca ma agrayanashca me vaishvadevashca me dhruvashca me vaishvanarashca ma
    ritugrahashca me shca ma aindragnashca me vaishvadevashca me marutvatiya shca me mahendrashca ma adityashca
    me savitrashca me sarasvatashca me paushnashca me patnivatashca me hariyojanashca me || || idhmashca
    me barhishca me vedishca me dhishniyashca me srucashca me camasashca me gravanashca me svaravashca
    ma uparavashca me 'dhishavane ca me dronakalashashca me vayavyani ca me putabhricca ma adhavaniyashca
    ma agni nca me grihashca me sadashca me purodasha 'vabhrithashca me svagakarashca me || || agnishca
    me gharmashca me 'rkashca me suryashca me pranashca me 'shvamedhashca me prithivi ca me 'ditishca
    me ditishca me dyaushca me shakvarirangulayo dishashca me yajnena kalpantamrikca me sama ca me stomashca
    me yajushca me diksha ca me tapashca ma ritushca me vrata rvrishtya brihadrathantare ca me yajnena
    kalpetam || shca me vatsashca me tryavishca me tryavica me dityavat ca me dityauhi ca me pancavishca
    me pancavi ca me trivatsashca me trivatsa ca me turyavat ca me turyauhi ca me pashthavat ca me pashthauhi
    ca ma uksha ca me vasha ca ma rishabhashca me vehacca me 'nadvanca me dhenushca ma ayuryajnena kalpatam
    prano yajnena kalpatamapano yajnena kalpatam vyano yajnena kalpatam cakshuryajnena kalpatag shrotram
    ya~jnena kalpatam mano yajnena kalpatam vagyajnena kalpatamatma yajnena kalpatam yajno yajnena kalpatam
    || || eka ca me tisrashca me panca ca me sapta ca me nava ca ma ekadasha ca me trayodasha ca me pancadasha
    ca me saptadasha ca me navadasha ca ma ekavigmshatishca me trayovigmshatishca me pancavigmshatishca
    me saptavigmshatishca me navavigmshatishca ma ekatrigmshacca me trayastrigmshacca me catasrashca me
    'shtau ca me dvadasha ca me shodasha ca me vigmshatishca me caturvigmshatishca me 'shtavigmshatishca
    me dvatrigmshacca me shat trigmshacca me catvarigmshacca me catushcatvarigmshacca me 'shtacatvarigmshacca
    me vajashca prasavashcapijashca kratushca suvashca murdha ca vyashniyashcantyayanashcantyashca bhauvanashca
    bhuvanashcadhipatishca || rbrihaspatirukthamadani shagmsishadvishve deva ktavacah prithivimatarma
    ma higmsirmadhu manishye madhu janishye madhu vakshyami madhu vadishyami madhumati ndevebhyo vacamudyasagmshushrushenya
    bhyastam ma deva avantu shobhayai pitaro 'numadantu || om shanti
