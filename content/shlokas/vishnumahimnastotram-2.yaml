id: vishnumahimnastotram-2
category: stotram
name:
  english: vishnumahimnastotram 2
  devanagari: विष्णुमहिम्नस्तोत्रम् २
content:
  english: kavalita ho jate haim | devataom ke adhipati indra ke sada nirnimesha rahanevale hajara netra
    bhi banda hone se nahim baca pate | isi prakara shivaji bhi brahmanda ka nasha karate karate apana
    astitva kho baithate haim | isa mahasamsara mem kevala apa hi yogashayyarur̤ha hokara sarvada vihara
    karate rahate haim || 20|| purendradyairdevairmahishabhayabhitaistu bhagavan mukhaddevi jata nijagaranasameta
    ranamukhe | jaghanendrarindram dhritasakalashaktim muraripo tatha shaktistomastava nijamahimno bahutarah
    || 21|| anvaya
  devanagari: कवलित हो जाते हैं । देवताओं के अधिपति इन्द्र के सदा निर्निमेष रहनेवाले हजार नेत्र भी बन्द
    होने से नहीं बच पाते । इसी प्रकार शिवजी भी ब्रह्माण्ड का नाश करते करते अपना अस्तित्व खो बैठते हैं
    । इस महासंसार में केवल आप ही योगशय्यारूढ़ होकर सर्वदा विहार करते रहते हैं ॥ २०॥ पुरेन्द्राद्यैर्देवैर्महिषभयभीतैस्तु
    भगवन् मुखाद्देवी जाता निजगरणसमेता रणमुखे । जघानेन्द्रारीन्द्रं धृतसकलशक्तिं मुररिपो तथा शक्तिस्तोमास्तव
    निजमहिम्नो बहुतराः ॥ २१॥ अन्वय
