id: namavali-39
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: martandatejase namah | manikyavacakaya | mananirbharaya | mahendravaradaya | mantrine | mayavirahitatmavate
    | marabadhavinirmuktaya | maratunirajanghikaya | marutashaphanabhushaya | maheshvarajaneshvaraya |
    matrikanyasanirataya | matripadabjapujakaya | mayapayavinirmuktaya | manadaya | margadarshakaya |
    maravairikripapatrayamanottama vagjharaya | mayavadanivirjetre | mahatirthakritadaraya namah | 18
  devanagari: मार्ताण्डतेजसे नमः । माणिक्यवाचकाय । माननिर्भराय । महेन्द्रवरदाय । मन्त्रिणे । मायाविरहितात्मवते
    । मारबाधाविनिर्मुक्ताय । मारतूणीरजङ्घिकाय । मारुताशफणाभूषाय । महेश्वरजनेश्वराय । मातृकान्यासनिरताय
    । मातृपादाब्जपूजकाय । मायापायविनिर्मुक्ताय । मानदाय । मार्गदर्शकाय । मारवैरिकृपापात्रायमानोत्तम वाग्झराय
    । मायावादनिविर्जेत्रे । महातीर्थकृतादराय नमः । १८
meaning: {}
