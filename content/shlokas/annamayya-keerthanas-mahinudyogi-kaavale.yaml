id: annamayya-keerthanas-mahinudyogi-kaavale
category: stotram
name:
  english: Annamayya Keerthanas Mahinudyogi Kaavale
content:
  english: mahinudyogi kavalè manujudaina vadu | sahaji valè nundi emi sadhincalèdu || vèdaki talacukunte
    vishnudu kanavaccu | cèdari maracite srishti cikatau | pòdali nadicitenu bhumèlla mètti ravaccu |
    nidurincite kalamu nimishamai tocu || vedukato cadivite vedashastra sampannudau | jadato nurakundite
    jadudaunu | vodaka tapasiyaite vunnatonnatudau | kudaka somari aite gunahinudaunu || muraharu gòlicite
    mokshamu sadhincavaccu | vèravèragaka undite viridiyaunu | sharanante shrivenkateshvarudu rakshincunu
    | paraga samshayincite pashandudaunu ||
  devanagari: महिनुद्योगि कावलॆ मनुजुडैन वाडु । सहजि वलॆ नुण्डि एमि साधिञ्चलॆडु ॥ वॆदकि तलचुकुण्टे विष्णुडु
    कानवच्चु । चॆदरि मरचिते सृष्टि चीकटौ । पॊदलि नडिचितेनु भूमॆल्ला मॆट्टि रावच्चु । निदुरिञ्चिते कालमु
    निमिषमै तोचु ॥ वेडुकतो चदिविते वेदशास्त्र सम्पन्नुडौ । जाडतो नूरकुण्डिते जडुडौनु । वोडक तपसियैते वुन्नतोन्नतुडौ
    । कूडक सोमरि ऐते गुणहीनुडौनु ॥ मुरहरु गॊलिचिते मोक्षमु साधिञ्चवच्चु । वॆरवॆरगक उण्डिते वीरिडियौनु
    । शरणण्टे श्रीवेङ्कटेश्वरुडु रक्षिञ्चुनु । परग संशयिञ्चिते पाषण्डुडौनु ॥
