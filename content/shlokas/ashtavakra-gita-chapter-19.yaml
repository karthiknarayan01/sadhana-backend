id: ashtavakra-gita-chapter-19
category: stotram
name:
  english: Ashtavakra Gita Chapter 19
content:
  english: janaka uvaca || tattvavijnanasandamshamadaya hridayodarat | nanavidhaparamarshashalyoddharah
    krito maya || || kva dharmah kva ca va kamah kva carthah kva vivekita | kva dvaitam kva ca va'dvaitam
    svamahimni sthitasya me || || kva bhutam kva bhavishyad va vartamanamapi kva va | kva deshah kva ca
    va nityam svamahimni sthitasya me || || kva catma kva ca vanatma kva shubham kvashubham yatha | kva
    cinta kva ca vacinta svamahimni sthitasya me || || kva svapnah kva sushuptirva kva ca jagaranam tatha
    | kva turiyam bhayam vapi svamahimni sthitasya me || || kva duram kva samipam va bahyam kvabhyantaram
    kva va | kva sthulam kva ca va sukshmam svamahimni sthitasya me || || kva mrityurjivitam va kva lokah
    kvasya kva laukikam | kva layah kva samadhirva svamahimni sthitasya me || || alam trivargakathaya
    yogasya kathayapyalam | alam vijnanakathaya vishrantasya mamatmani ||
  devanagari: जनक उवाच ॥ तत्त्वविज्ञानसन्दंशमादाय हृदयोदरात् । नानाविधपरामर्शशल्योद्धारः कृतो मया ॥ ॥
    क्व धर्मः क्व च वा कामः क्व चार्थः क्व विवेकिता । क्व द्वैतं क्व च वाऽद्वैतं स्वमहिम्नि स्थितस्य मे
    ॥ ॥ क्व भूतं क्व भविष्यद् वा वर्तमानमपि क्व वा । क्व देशः क्व च वा नित्यं स्वमहिम्नि स्थितस्य मे ॥
    ॥ क्व चात्मा क्व च वानात्मा क्व शुभं क्वाशुभं यथा । क्व चिन्ता क्व च वाचिन्ता स्वमहिम्नि स्थितस्य
    मे ॥ ॥ क्व स्वप्नः क्व सुषुप्तिर्वा क्व च जागरणं तथा । क्व तुरीयं भयं वापि स्वमहिम्नि स्थितस्य मे
    ॥ ॥ क्व दूरं क्व समीपं वा बाह्यं क्वाभ्यन्तरं क्व वा । क्व स्थूलं क्व च वा सूक्ष्मं स्वमहिम्नि स्थितस्य
    मे ॥ ॥ क्व मृत्युर्जीवितं वा क्व लोकाः क्वास्य क्व लौकिकम् । क्व लयः क्व समाधिर्वा स्वमहिम्नि स्थितस्य
    मे ॥ ॥ अलं त्रिवर्गकथया योगस्य कथयाप्यलम् । अलं विज्ञानकथया विश्रान्तस्य ममात्मनि ॥
