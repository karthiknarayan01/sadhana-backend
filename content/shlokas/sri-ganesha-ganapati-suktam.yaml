id: sri-ganesha-ganapati-suktam
category: stotram
name:
  english: Sri Ganesha (Ganapati) Suktam
content:
  english: a tu na indra kshumanta ngribhaya | mahahasti dakshinena || tuvikurmintuvide ntuvimagham |
    tuvimatramavo || etonvindram stavamesha | na radhasa mardhishannah || shadupa gasishacchravatsama
    giyama nam | abhiradhasajugurat || bhara dakshinenabhi savyena pra mrisha | indra mano vasornirbha
    || upakramasva bhara dhrishata dhrishno jana || indra ya u nu te asti vajo vipre ssanitvah | asmabhi
    || sadyojuvaste vaja shca makshu jarante || ntva ganapatim havamahe kavi nkavinamupamashravastamam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || da ganapate ganeshu tvama nkavinam
    | na rite tvatkriyate ki mmaghavancitramarca || maghavannadhamanantsakhe kridhi ranakritsatyashushmabhakte
    cida bhaja raye asman ||
  devanagari: आ तू न॑ इन्द्र क्षु॒मन्त ङ्गृ॑भाय । म॒हा॒ह॒स्ती दक्षि॑णेन ॥ तुविकू॒र्मिन्तु॒विदे न्तु॒वीम॑घम्
    । तु॒वि॒मा॒त्रमवो ॥ एतो॒न्विन्द्रं॒ स्तवा॒मेशा । न राध॑सा मर्धिषन्नः ॥ ष॒दुप॑ गासिष॒च्छ्रव॒त्साम॑
    गी॒यमा नम् । अ॒भिराध॑साजुगुरत् ॥ भर॒ दक्षि॑णेना॒भि स॒व्येन॒ प्र मृ॑श । इन्द्र॒ मानो॒ वसो॒र्निर्भा
    ॥ उप॑क्रम॒स्वा भ॑र धृष॒ता धृ॑ष्णो॒ जना ॥ इन्द्र॒ य उ॒ नु ते॒ अस्ति॒ वाजो॒ विप्रे स्सनि॑त्वः । अ॒स्माभि॒
    ॥ स॒द्यो॒जुव॑स्ते॒ वाजा श्च म॒क्षू ज॑रन्ते ॥ न्त्वा ग॒णप॑तिं हवामहे क॒वि ङ्क॑वी॒नामु॑प॒मश्र॑वस्तमम्
    । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ द गणपते ग॒णेषु॒ त्वामा ङ्कवी॒नाम्
    । न ऋ॒ते त्वत्क्रि॑यते॒ कि म्म॑घवञ्चि॒त्रम॑र्च ॥ मघव॒न्नाध॑माना॒न्त्सखे कृधि रणकृत्सत्यशु॒ष्माभ॑क्ते
    चि॒दा भ॑जा रा॒ये अ॒स्मान् ॥
