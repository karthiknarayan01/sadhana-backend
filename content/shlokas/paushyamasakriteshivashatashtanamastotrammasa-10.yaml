id: paushyamasakriteshivashatashtanamastotrammasa-10
category: stotram
name:
  english: paushyamasakriteshivashatashtanamastotrammasa 10
  devanagari: पौष्यमासकृतेशिवशताष्टनामस्तोत्रम्मास १०
content:
  english: bhrumadhye samsthitayaiva nadamadhyasthitaya ca | candrabimbasthitayaiva shivaya shivadehine
    || 74|| vahnisomarkarupaya trimshacchaktisvarupine | trimatrapranavayatha tridhamasthitaye namah ||
    75|| sadashivaya shantaya maheshaya pinakine | sarvajnaya sharanyaya sadyojataya te namah || 76||
    aghoraya namastubhyam vamadevaya te namah | tatpurshaya namastubhyamishanaya namonamah || 77|| ananteshaya
    sukshmaya utapaya namonamah | ekakshaya namastubhyamekarudraya te namah || 78|| namastrimurtaye tubhyam
    shrikanthaya shikhandine | anantasanasamsthaya sarvadaya gadabhrite || 79|| vimalaya vishalaya vimalangaya
    te namah | vedagamartharupaya yogasankhyarataya ca || 80|| yogasamsthaya divyaya yogine yogadayine
    | samastashokasamhartre drigdrishyatitatejase || 81|| pratyaharaya shuddhaya yamaya niyamaya ca |
    dhyanadhyeyaya duraya nirvyaparaya te namah || 82|| alingine ca lingaya lingasthanaya te namah |
  devanagari: भ्रूमध्ये संस्थितायैव नादमध्यस्थिताय च । चन्द्रबिम्बस्थितायैव शिवाय शिवदेहिने ॥ ७४॥ वह्निसोमार्करूपाय
    त्रिंशच्छक्तिस्वरूपिणे । त्रिमात्रप्रणवायाथ त्रिधामस्थितये नमः ॥ ७५॥ सदाशिवाय शान्ताय महेशाय पिनाकिने
    । सर्वज्ञाय शरण्याय सद्योजाताय ते नमः ॥ ७६॥ अघोराय नमस्तुभ्यं वामदेवाय ते नमः । तत्पूर्षाय नमस्तुभ्यमीशानाय
    नमोनमः ॥ ७७॥ अनन्तेशाय सूक्ष्माय उतपाय नमोनमः । एकाक्षाय नमस्तुभ्यमेकरुद्राय ते नमः ॥ ७८॥ नमस्त्रिमूर्तये
    तुभ्यं श्रीकण्ठाय शिखण्डिने । अनन्तासनसंस्थाय सर्वदाय गदाभृते ॥ ७९॥ विमलाय विशालाय विमलाङ्गाय ते नमः
    । वेदागमार्थरूपाय योगसाङ्ख्यरताय च ॥ ८०॥ योगसंस्थाय दिव्याय योगिने योगदायिने । समस्तशोकसंहर्त्रे दृग्दृश्यातीततेजसे
    ॥ ८१॥ प्रत्याहाराय शुद्धाय यमाय नियमाय च । ध्यानध्येयाय दूराय निर्व्यापाराय ते नमः ॥ ८२॥ अलिङ्गिने
    च लिङ्गाय लिङ्गस्थानाय ते नमः ।
