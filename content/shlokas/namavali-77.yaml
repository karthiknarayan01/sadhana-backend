id: namavali-77
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om skandaya namah | om guhaya namah | om shanmukhaya namah | om bhalanetrasutaya namah | om
    prabhave namah | om pingaḻaya namah | om krittikasunave namah | om shikhivahanaya namah | om dvishadbhujaya
    namah | om dvishannetraya namah | 10 || om kumaraya namah | om pishitashanabhanjanaya namah | om tarakasurasamhartre
    namah | om rakshobalanishudanaya namah | om mattaya namah | om pramattaya namah | om unmattaya namah
    | om surasainyabhirakshakaya namah | om devasenapataye namah | om prajnaya namah | 20 || om kripalave
    namah | om bhaktavatsalaya namah | om umasutaya namah | om mahasenaya namah | om kumaraya namah |
    om krauncadaranaya namah | om senanine namah | om agrajanmane namah | om vishakhaya namah | om shankaratmajaya
    namah | 30 || om shivasvamine namah | om ganasvamine namah | om sarvasvamine namah | om sanatanaya
    namah | om anantashaktaye namah | om akshobhyaya namah | om parvatipriyanandanaya namah | om gangasutaya
    namah | om sharodbhutaya namah | om ahutaya namah | 40 || om pavakatmajaya namah | om jrimbhaya namah
    | om prajrimbhaya namah | om ujjrimbhaya namah | om kamalasanasannutaya namah | om ekavarnaya namah
    | om dvivarnaya namah | om trivarnaya namah | om sumanoharaya namah | om caturvarnyaya namah | 50
    || om pancavarnaya namah | om prajapataye namah | om ahaspataye namah | om agnigarbhaya namah | om
    shamigarbhaya namah | om vishvagarbhaya namah | om surarighne namah | om haridvarnaya namah | om shubhakaraya
    namah | om vakpatave namah | 60 || om vatuveshadhrite namah | om pushne namah | om gabhastirgaganaya
    namah | om candravarnaya namah | om kaladharaya namah | om mayadharaya namah | om mahamayaya namah
    | om kailasavasathaya namah | om shikhine namah | om vishvayonaye namah | 70 || om ameyatmane namah
    | om tejonidhaye namah | om anamayaya namah | om parameshthine namah | om parabrahmaya namah | om
    vedagarbhaya namah | om viradvasave namah | om pulindakanyabhartre namah | om mahasarasvatapradaya
    namah | om ashritakhiladatre namah | 80 || om coraghnaya namah | om roganashanaya namah | om anantashaktiranandaya
    namah | om shikhandikritaketanaya namah | om dambhaya namah | om paramadambhaya namah | om mahadambhaya
    namah | om vrishakapaye namah | om karanaya namah | om kantadehaya namah | om karanatitavigrahaya
    namah | om ahirupaya namah | om amritavapave namah | om pranayamaparayanaya namah | om viruddhahartre
    namah | om viraghnaya namah | om raktashyamalalocanaya namah | om bahuvarnaya namah | om ganapataye
    namah | om svabhaktabhishtadayakaya namah | 100 || om sarveshvaraya namah | om lokagurave namah |
    om asuranikanashanaya namah | om subrahmanyaya namah | om guhayaya namah | om skandaya namah | om
    brahmanyaya namah | om brahmanapriyaya namah | 108 || || iti shivarahasyantargate skandashatashtanamavalih
    sampurna ||
