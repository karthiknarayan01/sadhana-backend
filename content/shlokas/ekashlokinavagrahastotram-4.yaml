name:
  english: ekashlokinavagrahastotram 4
  devanagari: एकश्लोकीनवग्रहस्तोत्रम् ४
content:
  english: sarve prasanna grahah || om adityadi navagraha devatabhyo namo namah || ityekashloki navagrahadevataprarthanastotram
    samaptam |
  devanagari: सर्वे प्रसन्ना ग्रहाः ॥ ॐ आदित्यादि नवग्रह देवताभ्यो नमो नमः ॥ इत्येकश्लोकी नवग्रहदेवताप्रार्थनास्तोत्रं
    समाप्तम् ।
