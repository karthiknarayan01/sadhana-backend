id: gurvashtakam
category: stotram
name:
  english: Gurvashtakam
  devanagari: गुर्वष्टकम् १ (वन्देऽहं सच्चिदानन्दं)
content:
  english: vande'ham saccidanandam bhedatitam jagadgurum | nityam purnam nirakaram nirgunam sarvasamsthitam
    || 1|| paratparataram dhyeyam nityamananda-karanam | hridayakasha-madhyastham shuddha-sphatika-sannibham
    || 2|| akhanda-mandalakaram vyaptam yena cara'caram | tatpadam darshitam yena tasmai shrigurave namah
    || 3|| gururbrahma gururvishnurgururdevo maheshvarah | gurureva param brahma tasmai shrigurave namah
    || 4|| ajnana-timirandhasya jnananjana-shalakaya | cakshurunmilitam yena tasmai shrigurave namah ||
    5|| caitanyam shashvatam shantam vyomatitam niranjanam | vindu-nada-kalatitam tasmai shrigurave namah
    || 6|| aneka-janma -samprapta -karmabandha -vidahine | ajnajnana-pradanena tasmai shrigurave namah
    || 7|| shishyanam mokshadanaya lilaya dehadharine | sadehe'pi videhaya tasmai shrigurave namah ||
    8|| gurvashtakamidam stotram sayam-pratastu yah pathet | sa vimukto bhavellokat sadguro kripaya dhruvam
    || 9|| iti gurvashtakam sampurnam |
  devanagari: वन्देऽहं सच्चिदानन्दं भेदातीतं जगद्गुरुम् । नित्यं पूर्णं निराकारं निर्गुणं सर्वसंस्थितम्
    ॥ १॥ परात्परतरं ध्येयं नित्यमानन्द-कारणम् । हृदयाकाश-मध्यस्थं शुद्ध-स्फटिक-सन्निभम् ॥ २॥ अखण्ड-मण्डलाकारं
    व्याप्तं येन चराऽचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ३॥ गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो
    महेश्वरः । गुरुरेव परं ब्रह्म तस्मै श्रीगुरवे नमः ॥ ४॥ अज्ञान-तिमिरान्धस्य ज्ञानाञ्जन-शलाकया । चक्षुरुन्मीलितं
    येन तस्मै श्रीगुरवे नमः ॥ ५॥ चैतन्यं शाश्वतं शान्तं व्योमातीतं निरञ्जनम् । विन्दु-नाद-कलातीतं तस्मै
    श्रीगुरवे नमः ॥ ६॥ अनेक-जन्म -संप्राप्त -कर्मबन्ध -विदाहिने । आज्ञज्ञान-प्रदानेन तस्मै श्रीगुरवे नमः
    ॥ ७॥ शिष्याणां मोक्षदानाय लीलया देहधारिणे । सदेहेऽपि विदेहाय तस्मै श्रीगुरवे नमः ॥ ८॥ गुर्वष्टकमिदं
    स्तोत्रं सायं-प्रातस्तु यः पठेत् । स विमुक्तो भवेल्लोकात् सद्गुरो कृपया ध्रुवम् ॥ ९॥ इति गुर्वष्टकं
    सम्पूर्णम् ।
