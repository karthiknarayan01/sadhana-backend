id: curnika
category: stotram
name:
  english: curnika
  devanagari: चूर्णिका
content:
  english: shri janardanam | ayodhya nagara pattabhisheka vishesha mahotsava nirantara diganta vishranta
    harahira karpura payah paravara bharata vani kundendu mandakini candana suradenu sharadambu talivara
    dhampoli shata danashva subhakirtihsh shadakshara pandu bhuta sabha vibhrajamana nikhila bhuvanaika
    yashah sandram shri upendram | bhaktajana samrakshana dikshana kataksha shobhadya samuttarim shri
    harim | keshavadi caturvimshati nama garbha sandarpita nija gathangikrita medha vartishnum shri krishnam
    | sarva suparva parvati hridaya kamala taraka brahmanamam sampurnakamam pavatarananu kana sandram
    bhavajanita bhayohchedah chidramachidram bhaktajana manorathonnidram
  devanagari: श्री जनार्दनम् । अयोध्या नगर पट्टाभिषेक विशेष महोत्सव निरन्तर दिगन्त विश्रान्त हारहीर कर्पूर
    पयः पारावार भारत वाणी कुन्देन्दु मन्दाकिनी चन्दन सुरदेनु शरदम्बु तालीवर धम्पोलि शत दानाश्व सुभकीर्तिःश्
    षडाक्षर पाण्डु भूत सभा विभ्राजमान निखिल भुवनैक यशः सान्द्रं श्री उपेन्द्रम् । भक्तजन संरक्षण दीक्षण
    कटाक्ष शोभाद्य समुत्तरिं श्री हरिम् । केशवादि चतुर्विंशति नाम गर्भ सन्दर्पित निज गथाङ्गीकृत मेधा वर्तिष्णुं
    श्री कृष्णम् । सर्व सुपर्व पार्वती हृदय कमल तारक ब्रह्मनामं सम्पूर्णकामं पवतरणानु कन सान्द्रं भवजनित
    भयोःछेदः छिद्रमछिद्रं भक्तजन मनोरथोन्निद्रं
meaning: {}
