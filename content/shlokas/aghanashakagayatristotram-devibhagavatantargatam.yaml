id: aghanashakagayatristotram-devibhagavatantargatam
category: stotram
name:
  english: aghanashakagayatristotram (devibhagavatantargatam)
  devanagari: अघनाशकगायत्रीस्तोत्रम् (देवीभागवतान्तर्गतम्)
content:
  english: bhaktanukampinsarvajna hridayam papanashanam | gayatryah kathitam tasmadgayatryah stotramiraya
    || 1|| adishakte jaganmatarbhaktanugrahakarini | sarvatra vyapike'nante shrisandhye te namo'stu te
    || 2|| tvameva sandhya gayatri savitri ca sarasvati | brahmi ca vaishnavi raudri rakta shveta sitetara
    || 3|| pratarbala ca madhyahne yauvanastha bhavetpunah | brahma sayam bhagavati cintyate munibhih
    sada || 4|| vriddha sayam hamsastha garudarudha tatha vrishabhavahini | rigvedadhyayini bhumau drishyate
    ya tapasvibhih || 5|| yajurvedam pathanti ca antarikshe virajate | sa samagapi sarveshu bhramyamana
    tatha bhuvi || 6|| rudralokam gata tvam hi vishnulokanivasini | tvameva brahmano loke'martyanugrahakarini
    || 7|| saptarshipritijanani maya bahuvaraprada | shivayoh karanetrottha hyashrusvedasamudbhava ||
    8|| anandajanani durga dashadha paripathyate | varenya varada caiva varishtha varavarnini || 9|| garishtha
    ca vararha ca vararoha ca saptami | nilaganga tatha sandhya sarvada bhogamokshada || 10|| bhagirathi
    martyaloke patale bhogavatyapi | trilokavahini devi sthanatrayanivasini || 11|| bhurlokastha tvamevasi
    dharitri lokadharini | bhuvo loke vayushaktih svarloke tejasam nidhih || 12|| maharloke mahasiddhirjanaloke
    janetyapi | tapasvini tapoloke satyaloke tu satyavak || 13|| kamala vishnuloke ca gayatri brahmalokaga
    | brahmalokada rudraloke sthita gauri harardhanganivasini || 14|| ahamo mahatashcaiva prakritistvam
    hi giyase | samyavasthatmika tvam hi shabalabrahmarupini || 15|| tatah parapara shaktih parama tvam
    hi giyase | icchashaktih kriyashaktirjnanashaktistrishaktida || 16|| ganga ca yamuna caiva vipasha
    ca sarasvati | sarayurdevika sindhurnarmaderavati tatha || 17|| godavari shatadrushca kaveri devalokaga
    | kaushiki candrabhaga ca vitasta ca sarasvati || 18|| gandaki tapini toya gomati vetravatyapi | ida
    ca pingala caiva sushumna ca tritiyaka || 19|| gandhari hastijihva ca pushapusha tathaiva ca | alambusha
    kuhushcaiva shankhini pranavahini || 20|| nadi ca tvam sharirastha giyase praktanairbudhaih | hritapadmastha
    pranashaktih kanthastha svapnanayika || 21|| talustha tvam sadadhara bindustha bindumalini | mule
    tu kundali shaktirvyapini keshamulaga || 22|| shikhamadhyasana tvam hi shikhagre tu manonmani | kimanyad
    bahunoktena yatkincijjagatitraye || 23|| tatsarvam tvam mahadevi shriye sandhye namo'stu te | itidam
    kirtitam stotram sandhyayam bahupunyadam || 24|| mahapapaprashamanam mahasiddhividhayakam | ya idam
    kirtayet stotram sandhyakale samahitah || 25|| aputrah prapnuyat putram dhanarthi dhanamapnuyat |
    sarvatirthatapodanayajnayogaphalam labhet || 26|| bhogan bhuktva ciram kalamante mokshamavapnuyat
    | tapasvibhih kritam stotram snanakale tu yah pathet || 27|| yatra kutra jale magnah sandhyamajjanajam
    phalam | labhate natra sandehah satyam ca narada || 28|| sha
  devanagari: भक्तानुकम्पिन्सर्वज्ञ हृदयं पापनाशनम् । गायत्र्याः कथितं तस्माद्गायत्र्याः स्तोत्रमीरय ॥
    १॥ आदिशक्ते जगन्मातर्भक्तानुग्रहकारिणि । सर्वत्र व्यापिकेऽनन्ते श्रीसन्ध्ये ते नमोऽस्तु ते ॥ २॥ त्वमेव
    सन्ध्या गायत्री सावित्री च सरस्वती । ब्राह्मी च वैष्णवी रौद्री रक्ता श्वेता सितेतरा ॥ ३॥ प्रातर्बाला
    च मध्याह्ने यौवनस्था भवेत्पुनः । ब्रह्मा सायं भगवती चिन्त्यते मुनिभिः सदा ॥ ४॥ वृद्धा सायं हंसस्था
    गरुडारूढा तथा वृषभवाहिनी । ऋग्वेदाध्यायिनी भूमौ दृश्यते या तपस्विभिः ॥ ५॥ यजुर्वेदं पठन्ती च अन्तरिक्षे
    विराजते । सा सामगापि सर्वेषु भ्राम्यमाणा तथा भुवि ॥ ६॥ रुद्रलोकं गता त्वं हि विष्णुलोकनिवासिनी । त्वमेव
    ब्रह्मणो लोकेऽमर्त्यानुग्रहकारिणी ॥ ७॥ सप्तर्षिप्रीतिजननी माया बहुवरप्रदा । शिवयोः करनेत्रोत्था ह्यश्रुस्वेदसमुद्भवा
    ॥ ८॥ आनन्दजननी दुर्गा दशधा परिपठ्यते । वरेण्या वरदा चैव वरिष्ठा वरवर्णिनी ॥ ९॥ गरिष्ठा च वरार्हा च
    वरारोहा च सप्तमी । नीलगङ्गा तथा सन्ध्या सर्वदा भोगमोक्षदा ॥ १०॥ भागीरथी मर्त्यलोके पाताले भोगवत्यपि
    । त्रिलोकवाहिनी देवी स्थानत्रयनिवासिनी ॥ ११॥ भूर्लोकस्था त्वमेवासि धरित्री लोकधारिणी । भुवो लोके वायुशक्तिः
    स्वर्लोके तेजसां निधिः ॥ १२॥ महर्लोके महासिद्धिर्जनलोके जनेत्यपि । तपस्विनी तपोलोके सत्यलोके तु सत्यवाक्
    ॥ १३॥ कमला विष्णुलोके च गायत्री ब्रह्मलोकगा । ब्रह्मलोकदा रुद्रलोके स्थिता गौरी हरार्धाङ्गनिवासिनी
    ॥ १४॥ अहमो महतश्चैव प्रकृतिस्त्वं हि गीयसे । साम्यावस्थात्मिका त्वं हि शबलब्रह्मरूपिणी ॥ १५॥ ततः परापरा
    शक्तिः परमा त्वं हि गीयसे । इच्छाशक्तिः क्रियाशक्तिर्ज्ञानशक्तिस्त्रिशक्तिदा ॥ १६॥ गङ्गा च यमुना चैव
    विपाशा च सरस्वती । सरयूर्देविका सिन्धुर्नर्मदेरावती तथा ॥ १७॥ गोदावरी शतद्रुश्च कावेरी देवलोकगा ।
    कौशिकी चन्द्रभागा च वितस्ता च सरस्वती ॥ १८॥ गण्डकी तापिनी तोया गोमती वेत्रवत्यपि । इडा च पिङ्गला चैव
    सुषुम्णा च तृतीयका ॥ १९॥ गान्धारी हस्तिजिह्वा च पूषापूषा तथैव च । अलम्बुषा कुहूश्चैव शङ्खिनी प्राणवाहिनी
    ॥ २०॥ नाडी च त्वं शरीरस्था गीयसे प्राक्तनैर्बुधैः । हृतपद्मस्था प्राणशक्तिः कण्ठस्था स्वप्ननायिका
    ॥ २१॥ तालुस्था त्वं सदाधारा बिन्दुस्था बिन्दुमालिनी । मूले तु कुण्डली शक्तिर्व्यापिनी केशमूलगा ॥ २२॥
    शिखामध्यासना त्वं हि शिखाग्रे तु मनोन्मनी । किमन्यद् बहुनोक्तेन यत्किञ्चिज्जगतीत्रये ॥ २३॥ तत्सर्वं
    त्वं महादेवि श्रिये सन्ध्ये नमोऽस्तु ते । इतीदं कीर्तितं स्तोत्रं सन्ध्यायां बहुपुण्यदम् ॥ २४॥ महापापप्रशमनं
    महासिद्धिविधायकम् । य इदं कीर्तयेत् स्तोत्रं सन्ध्याकाले समाहितः ॥ २५॥ अपुत्रः प्राप्नुयात् पुत्रं
    धनार्थी धनमाप्नुयात् । सर्वतीर्थतपोदानयज्ञयोगफलं लभेत् ॥ २६॥ भोगान् भुक्त्वा चिरं कालमन्ते मोक्षमवाप्नुयात्
    । तपस्विभिः कृतं स्तोत्रं स्नानकाले तु यः पठेत् ॥ २७॥ यत्र कुत्र जले मग्नः सन्ध्यामज्जनजं फलम् । लभते
    नात्र सन्देहः सत्यं च नारद ॥ २८॥ श
