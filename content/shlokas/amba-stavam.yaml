id: amba-stavam
category: stotram
name:
  english: Amba Stavam
content:
  english: yamamananti munayah prakritim puranim vidyeti yam shrutirahasyavido vadanti | tamardhapallavitashankararupamudram
    devimananyasharanah sharanam prapadye || || amba staveshu tava tavadakartrikani kunthibhavanti vacasamapi
    gumbhanani | dimbhasya me stutirasavasamanjasapi vatsalyanighnahridayam bhavatim dhinotu || || vyometi
    binduriti nada itindulekha rupeti vagbhavatanuriti matriketi | nihsyandamanasukhabodhasudhasvarupa
    vidyotase manasi bhagyavatam jananam || || avirbhavatpulakasantatibhih sharirai rnihsyandamanasalilairnayanaishca
    nityam | vagbhishca gadgadapadabhirupasate ye padau tavamba bhuvaneshu ta eva dhanyah || || vaktram
    yadudyatamabhishtutaye bhavatya stubhyam namo yadapi devi shirah karoti | cetashca yattvayi parayanamamba
    tani kasyapi kairapi bhavanti tapovisheshaih || || mulalavalakuharadudita bhavani nirbhidya shatsarasijani
    tatillateva | bhuyo'pi tatra vishasi dhruvamandalendu nihsyandamanaparamamritatoyarupa || || dagdham
    yada madanamekamanekadha te mugdhah katakshavidhirankurayancakara | dhatte tadaprabhriti devi lalatanetram
    satyam hriyaiva mukulikritamindumauleh || || ajnatasambhavamanakalitanvavayam bhikshum kapalinamavasasamadvitiyam
    | purvam karagrahanamangalato bhavatyah shambhum ka eva bubudhe girirajakanye || || carmambaram ca
    shavabhasmavilepanam ca bhikshatanam ca natanam ca paretabhumau | vetalasamhatiparigrahata ca shambhoh
    shobham bibharti girije tava sahacaryat || || kalpopasamharanakelishu panditani candani khandaparashorapi
    tandavani | alokanena tava komalitani mata rlasyatmana parinamanti jagadvibhutyai || || jantorapashcimatanoh
    sati karmasamye nihsheshapashapatalacchidura nimeshat | kalyani deshikakatakshasamashrayena karunyato
    bhavati shambhavavedadiksha || || muktavibhushanavati navavidrumabha yaccetasi sphurasi tarakiteva
    sandhya | ekah sa eva bhuvanatrayasundarinam kandarpatam vrajati pancasharim vinapi || || ye bhavayantyamritavahibhiramshujalai
    rapyayamanabhuvanamamriteshvarim tvam | te langhayanti nanu mataralanghaniyam brahmadibhih suravarairapi
    kalakaksham || || yah sphatikakshagunapustakakundikadhyam vyakhyasamudyatakaram sharadindushubhram
    | padmasanam ca hridaye bhavatimupaste matah sa vishvakavitarkikacakravarti || || barhavatamsayutabarbarakeshapasham
    gunjavalikritaghanastanaharashobham | shyamam pravalavadanam sukumarahastam tvameva naumi shabarim
    shabarasya jayam || || ardhena kim navalatalalitena mugdhe kritam vibhoh parushamardhamidam tvayeti
    | alijanasya parihasavacamsi manye mandasmitena tava devi jadi bhavanti || || brahmanda budbudakadambakasankulo'yam
    mayodadhirvividhaduhkhatarangamalah | ashcaryamamba jhatiti pralayam prayati tvaddhyanasantatimahabadabamukhagnau
    || || dakshayaniti kutileti kuhariniti katyayaniti kamaleti kalavatiti | eka sati bhagavati paramarthato'pi
    sandrishyase bahuvidha nanu nartakiva || || anandalakshanamanahatanamni deshe nadatmana parinatam
    tava rupamishe | pratyanmukhena manasa pariciyamanam shamsanti netrasalilaih pulakaishca dhanyah ||
    || tvam candrika shashini tigmarucau rucistvam tvam cetanasi purushe pavane balam tvam | tvam svadutasi
    salile shikhini tvamushma nihsarameva nikhilam tvadrite yadi syat || || jyotimshi yaddivi caranti
    yadantariksham sute payamsi yadahirdharanim ca dhatte | yadvati vayuranalo yadudarciraste tatsarvamamba
    tava kevalamajnayaiva || || sankocamicchasi yada girije tadanim vaktarkayostvamasi bhumiranamarupa
    | yadva vikasamupayasi yada tadanim tvannamarupagananah sukara bhavanti || || bhogaya devi bhavatim
    kritinah pranamya bhrukinkarikritasarojagrihah sahasram | cintamanipracayakalpitakelishaile kalpadrumopavana
    eva ciram ramante || || hartum tvameva bhavasi tvadadhinamishe samsaratapamakhilam dayaya pashunam
    | vaikartani kiranasamhatireva shakta dharmam nijam shamayitum nijayaiva vrishtya || || shaktih shariramadhidaivatamantaratma
    jnanam kriya karanamasanajalamiccha | aishvaryamayatanamavaranani ca tvam kim tanna yadbhavasi devi
    shashankamauleh || || bhumau nivrittirudita payasi pratishtha vidya'nale maruti shantirativakantih
    | vyomniti yah kila kalah kalayanti vishvam tasam hi durataramamba padam tvadiyam || || yavatpadam
    padasarojayugam tvadiyam nangikaroti hridayeshu jagaccharanye | tavadvikalpajatilah kutilaprakara
    starkagrahah samayinam pralayam na yanti || || nirdevayanapitriyanaviharameke kritva manah karanamandalasarvabhaumam
    | dhyane niveshya tava karanapancakasya parvani parvati nayanti nijasanatvam || || sthulasu murtishu
    mahipramukhasu murteh kasyashcanapi tava vaibhavamamba yasyah | patya giramapi na shakyata eva vaktum
    sapi stuta kila mayeti titikshitavyam || || kalagnikotirucimamba shadadhvashuddhau aplavaneshu bhavatimamritaughavrishtim
    | shyamam ghanastanatatam shakalikritagham dhyayanta eva jagatam guravo bhavanti || || vidyam param
    katicidambaramamba keci danandameva katicitkaticicca mayam | tvam vishvamahurapare vayamamanamah sakshadaparakarunam
    gurumurtimeva || || kuvalayadalanilam barbarasnigdhakesham prithutarakucabharakrantakantavalagnam
    | kimiha bahubhiruktaistvatsvarupam param nah sakalajanani matah santatam sannidhattam || || iti shrikalidasa
    viracita pancastavyam caturthah ambastavah |
  devanagari: यामामनन्ति मुनयः प्रकृतिं पुराणीं विद्येति यां श्रुतिरहस्यविदो वदन्ति । तामर्धपल्लवितशङ्कररूपमुद्रां
    देवीमनन्यशरणः शरणं प्रपद्ये ॥ ॥ अम्ब स्तवेषु तव तावदकर्तृकाणि कुण्ठीभवन्ति वचसामपि गुम्भनानि । डिम्भस्य
    मे स्तुतिरसावसमञ्जसापि वात्सल्यनिघ्नहृदयां भवतीं धिनोतु ॥ ॥ व्योमेति बिन्दुरिति नाद इतीन्दुलेखा रूपेति
    वाग्भवतनूरिति मातृकेति । निःस्यन्दमानसुखबोधसुधास्वरूपा विद्योतसे मनसि भाग्यवतां जनानाम् ॥ ॥ आविर्भवत्पुलकसन्ततिभिः
    शरीरै र्निःस्यन्दमानसलिलैर्नयनैश्च नित्यम् । वाग्भिश्च गद्गदपदाभिरुपासते ये पादौ तवाम्ब भुवनेषु त
    एव धन्याः ॥ ॥ वक्त्रं यदुद्यतमभिष्टुतये भवत्या स्तुभ्यं नमो यदपि देवि शिरः करोति । चेतश्च यत्त्वयि
    परायणमम्ब तानि कस्यापि कैरपि भवन्ति तपोविशेषैः ॥ ॥ मूलालवालकुहरादुदिता भवानि निर्भिद्य षट्सरसिजानि
    तटिल्लतेव । भूयोऽपि तत्र विशसि ध्रुवमण्डलेन्दु निःस्यन्दमानपरमामृततोयरूपा ॥ ॥ दग्धं यदा मदनमेकमनेकधा
    ते मुग्धः कटाक्षविधिरङ्कुरयाञ्चकार । धत्ते तदाप्रभृति देवि ललाटनेत्रं सत्यं ह्रियैव मुकुलीकृतमिन्दुमौलेः
    ॥ ॥ अज्ञातसम्भवमनाकलितान्ववायं भिक्षुं कपालिनमवाससमद्वितीयम् । पूर्वं करग्रहणमङ्गलतो भवत्याः शम्भुं
    क एव बुबुधे गिरिराजकन्ये ॥ ॥ चर्माम्बरं च शवभस्मविलेपनं च भिक्षाटनं च नटनं च परेतभूमौ । वेतालसंहतिपरिग्रहता
    च शम्भोः शोभां बिभर्ति गिरिजे तव साहचर्यात् ॥ ॥ कल्पोपसंहरणकेलिषु पण्डितानि चण्डानि खण्डपरशोरपि ताण्डवानि
    । आलोकनेन तव कोमलितानि मात र्लास्यात्मना परिणमन्ति जगद्विभूत्यै ॥ ॥ जन्तोरपश्चिमतनोः सति कर्मसाम्ये
    निःशेषपाशपटलच्छिदुरा निमेषात् । कल्याणि देशिककटाक्षसमाश्रयेण कारुण्यतो भवति शाम्भववेददीक्षा ॥ ॥ मुक्ताविभूषणवती
    नवविद्रुमाभा यच्चेतसि स्फुरसि तारकितेव सन्ध्या । एकः स एव भुवनत्रयसुन्दरीणां कन्दर्पतां व्रजति पञ्चशरीं
    विनापि ॥ ॥ ये भावयन्त्यमृतवाहिभिरंशुजालै राप्यायमानभुवनाममृतेश्वरीं त्वाम् । ते लङ्घयन्ति ननु मातरलङ्घनीयां
    ब्रह्मादिभिः सुरवरैरपि कालकक्षाम् ॥ ॥ यः स्फाटिकाक्षगुणपुस्तककुण्डिकाढ्यां व्याख्यासमुद्यतकरां शरदिन्दुशुभ्राम्
    । पद्मासनां च हृदये भवतीमुपास्ते मातः स विश्वकवितार्किकचक्रवर्ती ॥ ॥ बर्हावतंसयुतबर्बरकेशपाशां गुञ्जावलीकृतघनस्तनहारशोभाम्
    । श्यामां प्रवालवदनां सुकुमारहस्तां त्वामेव नौमि शबरीं शबरस्य जायाम् ॥ ॥ अर्धेन किं नवलताललितेन मुग्धे
    क्रीतं विभोः परुषमर्धमिदं त्वयेति । आलीजनस्य परिहासवचांसि मन्ये मन्दस्मितेन तव देवि जडी भवन्ति ॥ ॥
    ब्रह्माण्ड बुद्बुदकदम्बकसङ्कुलोऽयं मायोदधिर्विविधदुःखतरङ्गमालः । आश्चर्यमम्ब झटिति प्रलयं प्रयाति
    त्वद्ध्यानसन्ततिमहाबडबामुखाग्नौ ॥ ॥ दाक्षायणीति कुटिलेति कुहारिणीति कात्यायनीति कमलेति कलावतीति ।
    एका सती भगवती परमार्थतोऽपि सन्दृश्यसे बहुविधा ननु नर्तकीव ॥ ॥ आनन्दलक्षणमनाहतनाम्नि देशे नादात्मना
    परिणतं तव रूपमीशे । प्रत्यङ्मुखेन मनसा परिचीयमानं शंसन्ति नेत्रसलिलैः पुलकैश्च धन्याः ॥ ॥ त्वं चन्द्रिका
    शशिनि तिग्मरुचौ रुचिस्त्वं त्वं चेतनासि पुरुषे पवने बलं त्वम् । त्वं स्वादुतासि सलिले शिखिनि त्वमूष्मा
    निःसारमेव निखिलं त्वदृते यदि स्यात् ॥ ॥ ज्योतींषि यद्दिवि चरन्ति यदन्तरिक्षं सूते पयांसि यदहिर्धरणीं
    च धत्ते । यद्वाति वायुरनलो यदुदर्चिरास्ते तत्सर्वमम्ब तव केवलमाज्ञयैव ॥ ॥ सङ्कोचमिच्छसि यदा गिरिजे
    तदानीं वाक्तर्कयोस्त्वमसि भूमिरनामरूपा । यद्वा विकासमुपयासि यदा तदानीं त्वन्नामरूपगणनाः सुकरा भवन्ति
    ॥ ॥ भोगाय देवि भवतीं कृतिनः प्रणम्य भ्रूकिङ्करीकृतसरोजगृहाः सहस्रम् । चिन्तामणिप्रचयकल्पितकेलिशैले
    कल्पद्रुमोपवन एव चिरं रमन्ते ॥ ॥ हर्तुं त्वमेव भवसि त्वदधीनमीशे संसारतापमखिलं दयया पशूनाम् । वैकर्तनी
    किरणसंहतिरेव शक्ता धर्मं निजं शमयितुं निजयैव वृष्ट्या ॥ ॥ शक्तिः शरीरमधिदैवतमन्तरात्मा ज्ञानं क्रिया
    करणमासनजालमिच्छा । ऐश्वर्यमायतनमावरणानि च त्वं किं तन्न यद्भवसि देवि शशाङ्कमौलेः ॥ ॥ भूमौ निवृत्तिरुदिता
    पयसि प्रतिष्ठा विद्याऽनले मरुति शान्तिरतीवकान्तिः । व्योम्नीति याः किल कलाः कलयन्ति विश्वं तासां हि
    दूरतरमम्ब पदं त्वदीयम् ॥ ॥ यावत्पदं पदसरोजयुगं त्वदीयं नाङ्गीकरोति हृदयेषु जगच्छरण्ये । तावद्विकल्पजटिलाः
    कुटिलप्रकारा स्तर्कग्रहाः समयिनां प्रलयं न यान्ति ॥ ॥ निर्देवयानपितृयानविहारमेके कृत्वा मनः करणमण्डलसार्वभौमम्
    । ध्याने निवेश्य तव कारणपञ्चकस्य पर्वाणि पार्वति नयन्ति निजासनत्वम् ॥ ॥ स्थूलासु मूर्तिषु महीप्रमुखासु
    मूर्तेः कस्याश्चनापि तव वैभवमम्ब यस्याः । पत्या गिरामपि न शक्यत एव वक्तुं सापि स्तुता किल मयेति तितिक्षितव्यम्
    ॥ ॥ कालाग्निकोटिरुचिमम्ब षडध्वशुद्धौ आप्लावनेषु भवतीममृतौघवृष्टिम् । श्यामां घनस्तनतटां शकलीकृताघां
    ध्यायन्त एव जगतां गुरवो भवन्ति ॥ ॥ विद्यां परां कतिचिदम्बरमम्ब केचि दानन्दमेव कतिचित्कतिचिच्च मायाम्
    । त्वां विश्वमाहुरपरे वयमामनामः साक्षादपारकरुणां गुरुमूर्तिमेव ॥ ॥ कुवलयदलनीलं बर्बरस्निग्धकेशं पृथुतरकुचभाराक्रान्तकान्तावलग्नम्
    । किमिह बहुभिरुक्तैस्त्वत्स्वरूपं परं नः सकलजननि मातः सन्ततं सन्निधत्ताम् ॥ ॥ इति श्रीकालिदास विरचित
    पञ्चस्तव्यां चतुर्थः अम्बास्तवः ।
