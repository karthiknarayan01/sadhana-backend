id: narayaniyam-dashaka-66
category: stotram
name:
  english: Narayaniyam Dashaka 66
content:
  english: upayatanam sudrisham kusumayudhabanapatavivashanam | abhivanchitam vidhatum kritamatirapi ta
    jagatha vamamiva || || gaganagatam muninivaham shravayitum jagitha kulavadhudharmam | dharmyam khalu
    te vacanam karma tu no nirmalasya vishvasyam || || akarnya te pratipam vanimenidrishah param dinah
    | ma ma karunasindho parityajetyaticiram vilepustah || || tasam ruditairlapitaih karunakulamanaso
    murare tvam | tabhissamam pravritto yamunapulineshu kamamabhirantum || || candrakarasyandalasatsundarayamunatatantavithishu
    | gopijanottariyairapaditasamstaro nyashidastvam || || sumadhuranarmalapanaih karasangrahanaishca
    cumbanollasaih | gadhalinganasangaistvamanganalokamakulicakrishe || || vasoharanadine yadvasoharanam
    pratishrutam tasam | tadapi vibho rasavivashasvantanam kanta subhruvamadadhah || || kandalitagharmalesham
    kundamridusmeravaktrapathojam | nandasuta tvam trijagatsundaramupaguhya nandita balah || || viraheshvangaramayah
    shringaramayashca sangame hi tvam nitaramangaramayastatra punassangame'pi citramidam || || radhatungapayodharasadhuparirambhalolupatmanam
    | aradhaye bhavantam pavanapuradhisha shamaya sakalagadan ||
  devanagari: उपयातानां सुदृशां कुसुमायुधबाणपातविवशानाम् । अभिवाञ्छितं विधातुं कृतमतिरपि ता जगाथ वाममिव
    ॥ ॥ गगनगतं मुनिनिवहं श्रावयितुं जगिथ कुलवधूधर्मम् । धर्म्यं खलु ते वचनं कर्म तु नो निर्मलस्य विश्वास्यम्
    ॥ ॥ आकर्ण्य ते प्रतीपां वाणीमेणीदृशः परं दीनाः । मा मा करुणासिन्धो परित्यजेत्यतिचिरं विलेपुस्ताः ॥
    ॥ तासां रुदितैर्लपितैः करुणाकुलमानसो मुरारे त्वम् । ताभिस्समं प्रवृत्तो यमुनापुलिनेषु काममभिरन्तुम्
    ॥ ॥ चन्द्रकरस्यन्दलसत्सुन्दरयमुनातटान्तवीथीषु । गोपीजनोत्तरीयैरापादितसंस्तरो न्यषीदस्त्वम् ॥ ॥ सुमधुरनर्मालपनैः
    करसङ्ग्रहणैश्च चुम्बनोल्लासैः । गाढालिङ्गनसङ्गैस्त्वमङ्गनालोकमाकुलीचकृषे ॥ ॥ वासोहरणदिने यद्वासोहरणं
    प्रतिश्रुतं तासाम् । तदपि विभो रसविवशस्वान्तानां कान्त सुभ्रुवामदधाः ॥ ॥ कन्दलितघर्मलेशं कुन्दमृदुस्मेरवक्त्रपाथोजम्
    । नन्दसुत त्वां त्रिजगत्सुन्दरमुपगूह्य नन्दिता बालाः ॥ ॥ विरहेष्वङ्गारमयः शृङ्गारमयश्च सङ्गमे हि त्वम्
    नितरामङ्गारमयस्तत्र पुनस्सङ्गमेऽपि चित्रमिदम् ॥ ॥ राधातुङ्गपयोधरसाधुपरीरम्भलोलुपात्मानम् । आराधये
    भवन्तं पवनपुराधीश शमय सकलगदान् ॥
