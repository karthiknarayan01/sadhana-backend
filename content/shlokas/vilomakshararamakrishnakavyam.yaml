id: vilomakshararamakrishnakavyam
category: stotram
name:
  english: vilomakshararamakrishnakavyam
  devanagari: विलोमाक्षररामकृष्णकाव्यम्
content:
  english: tam bhusutamuktimudarahasam vande yato bhavyabhavam dayashrih | shriyadavam bhavyabhatoyadevam
    samharadamuktimutasubhutam || 1|| ciram virancirna ciram virancih sakarata satyasataraka sa | sakarata
    satyasataraka sa ciram virancirna ciram virancih || 2|| tamasityasati satyasimata mayayakshamasamakshayayama
    | mayayakshasamakshayayama tamasityasati satyasimata || 3|| ka tapaghni tarakadya vipapa tredha vidya
    noshnakrityam nivase | seva nityam krishnanodya vidhatre papavidyakarataghni pataka || 4|| shriramato
    madhyamatodi yena dhiro'nisham vashyavativaradva | dvaravativashyavasham nirodhi nayedito madhyamato'mara
    shrih || 5|| kaushike tritapasi ksharavrati yo'dadad'dvitanayasvamaturam | rantumasvayana tadvidadayo'
    tivrarakshasi patatrikeshikau || 6|| lambadharoru trayalambanase tvam yahi yahi ksharamagatajna |
    jnatagama raksha hi yahi ya tvam sena balam yatra rurodha balam || 7|| lankayana nityagama dhavasha
    sakam tayanunnayamanukara | rakanuma yannanu yatakamsa shavadhamagatya ninaya kalam || 8|| gadhijadhvaravaira
    ye te'tita rakshasa matah | tamasaksharatatite ye ravairadhvajadhigah || 9|| tavadeva daya deve yage
    yavadavasana | nasavadavaya geya vede yadavadevata || 10|| sabhasvaye bhagnamanena capam kinashatanaddharusha
    shilashaih | shailashisharuddhanatashanaki pancanane magnabhaye svabhasah || 11|| na veda yamaksharabhamasitam
    ka taraka vishnujite'vivade | devavite jishnuvikarata ka tam simabharakshamayadavena || 12|| tivragoranvayatraryo
    vaidehimanaso matah | tamaso na mahidevai
  devanagari: तं भूसुतामुक्तिमुदारहासं वन्दे यतो भव्यभवं दयाश्रीः । श्रीयादवं भव्यभतोयदेवं संहारदामुक्तिमुतासुभूतम्
    ॥ १॥ चिरं विरञ्चिर्न चिरं विरञ्चिः साकारता सत्यसतारका सा । साकारता सत्यसतारका सा चिरं विरञ्चिर्न चिरं
    विरञ्चिः ॥ २॥ तामसीत्यसति सत्यसीमता माययाक्षमसमक्षयायमा । माययाक्षसमक्षयायमा तामसीत्यसति सत्यसीमता
    ॥ ३॥ का तापघ्नी तारकाद्या विपापा त्रेधा विद्या नोष्णकृत्यं निवासे । सेवा नित्यं कृष्णनोद्या विधात्रे
    पापाविद्याकारताघ्नी पताका ॥ ४॥ श्रीरामतो मध्यमतोदि येन धीरोऽनिशं वश्यवतीवराद्वा । द्वारावतीवश्यवशं
    निरोधी नयेदितो मध्यमतोऽमरा श्रीः ॥ ५॥ कौशिके त्रितपसि क्षरव्रती योऽददाद्ऽद्वितनयस्वमातुरम् । रन्तुमास्वयन
    तद्विदादयोऽ तीव्ररक्षसि पतत्रिकेशिकौ ॥ ६॥ लम्बाधरोरु त्रयलम्बनासे त्वं याहि याहि क्षरमागताज्ञा । ज्ञातागमा
    रक्ष हि याहि या त्वं सेना बलं यत्र रुरोध बालम् ॥ ७॥ लङ्कायना नित्यगमा धवाशा साकं तयानुन्नयमानुकारा
    । राकानुमा यन्ननु यातकंसा शावाधमागत्य निनाय कालम् ॥ ८॥ गाधिजाध्वरवैरा ये तेऽतीता रक्षसा मताः । तामसाक्षरतातीते
    ये रावैरध्वजाधिगाः ॥ ९॥ तावदेव दया देवे यागे यावदवासना । नासवादवया गेया वेदे यादवदेवता ॥ १०॥ सभास्वये
    भग्नमनेन चापं कीनाशतानद्धरुषा शिलाशैः । शैलाशिषारुद्धनताशनाकी पञ्चानने मग्नभये स्वभासः ॥ ११॥ न वेद
    यामक्षरभामसीतां का तारका विष्णुजितेऽविवादे । देवाविते जिष्णुविकारता का तां सीमभारक्षमयादवेन ॥ १२॥
    तीव्रगोरन्वयत्रार्यो वैदेहीमनसो मतः । तमसो न महीदेवै
