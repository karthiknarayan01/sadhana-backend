id: brahmadidevaihkritam2shivastotram
category: stotram
name:
  english: brahmadidevaihkritam2shivastotram
  devanagari: ब्रह्मादिदेवैःकृतं२शिवस्तोत्रम्
content:
  english: 50|| surasuradhipataye yatinam pataye namah | candaya candadandaya varakhatvangadandine ||
    51|| virupaksha shubhakhyaya vishvarupaya vai namah | shantaya ca manojnaya trinetraya namo namah
    || 52|| vedhase vishvarupaya daityasamharine namah | bhaktanukampine'tyartham rudrajnanaparaya ca
    || 53|| virupaya surupaya rupanam shatadharine | pancasyaya shubhasyaya candrasyaya namo namah ||
    54|| varadaya varahaya sukurmaya namo namah || 55|| trinetra tranamasmakam tripuraghna vidhiyatam
    | vanmanahkayabhavaistvam prapannanam maheshvara || 56|| iti shriskandapurane avantyakhande avantikshetramahatmye
    shashthadhyayantargatam brahmadidevaih kritam shivastotram samaptam | skandapurana | avantyakhanda
    | avantyakhanda | adhyaya 6
  devanagari: ५०॥ सुरासुराधिपतये यतीनां पतये नमः । चण्डाय चण्डदण्डाय वरखट्वाङ्गदण्डिने ॥ ५१॥ विरूपाक्ष
    शुभाख्याय विश्वरूपाय वै नमः । शान्ताय च मनोज्ञाय त्रिनेत्राय नमो नमः ॥ ५२॥ वेधसे विश्वरूपाय दैत्यसंहारिणे
    नमः । भक्तानुकम्पिनेऽत्यर्थं रुद्रज्ञानपराय च ॥ ५३॥ विरूपाय सुरूपाय रूपाणां शतधारिणे । पञ्चास्याय
    शुभास्याय चन्द्रास्याय नमो नमः ॥ ५४॥ वरदाय वराहाय सुकूर्माय नमो नमः ॥ ५५॥ त्रिनेत्र त्राणमस्माकं त्रिपुरघ्न
    विधीयताम् । वाङ्मनःकायभावैस्त्वां प्रपन्नानां महेश्वर ॥ ५६॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे अवन्तीक्षेत्रमाहात्म्ये
    षष्ठाध्यायान्तर्गतं ब्रह्मादिदेवैः कृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । आवन्त्यखण्ड
    । अध्याय ६
