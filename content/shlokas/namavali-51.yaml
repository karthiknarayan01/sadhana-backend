id: namavali-51
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: namah | om shuline namah | om hrasvaya namah | om urdhvaya namah | om dhumraya namah | om dandine
    namah | 10 || om rukmatejase namah | om jyeshthaya namah | om shreshthaya namah | om balapramathanaya
    namah | om vanyaya namah | om pujyaya namah | om sadyojataya namah | om gahvaraya namah | om adhvareshaya
    namah | om havyavahaya namah | 20 || om carine namah | om bhutanamudbhavaya namah | om prabhave namah
    | om vibhave namah | om devaya namah | om dyotamanaya namah | om manatitaya namah | om shambhave namah
    | om vedangaya namah | om pradhanaya namah | 30 || om yogasankhyaviharine namah | om dhruvadhruvaya
    namah | om shantaya namah | om vishvaya namah | om sumaharshaye namah | om grahaya namah | om grahyarupaya
    namah | om grihasthaya namah | om yatatmane namah | om ahoratraya namah | 40 || om masaya namah |
    om ritave namah | om kratave namah | om samvatsaraya namah | om yugakalatmane namah | om parardhaya
    namah | om prasannaya namah | om shushkaya namah | om haritaya namah | om dharmadharmasvarupaya namah
    | 50 || om paraya namah | om vibhave namah | om purantakaya namah | om bhimaya namah | om vargaya
    namah | om dhritaye namah | om manvantaraya namah | om kavyaya namah | om vishvapyayavidhayine namah
    | om vishvasargaya namah | 60 || om bhargaya namah | om jyotishe namah | om divyacakshushe namah |
    om kalpadyaya namah | om nibaddhaya namah |
