id: ambarishakritamvishnustotram
category: stotram
name:
  english: ambarishakritamvishnustotram
  devanagari: अम्बरीषकृतंविष्णुस्तोत्रम्
content:
  english: ambarishakritam vishnustotram ambarisha uvaca | prasida lokanathesha mama natha janardana |
    krishna vishno jagannatha sarvalokanamaskrita || 33|| tvamadistvamanadistvamanantah purushah prabhuh
    | aprameyo vibhurvishnurgovindah kamalekshanah || 34|| maheshvarangajo madhye pushkarah khagamah khagah
    | kavyavahah kapali tvam havyavahah prabhanjanah || 35|| adidevah kriyanandah paramatma''tmani sthitah
    | tvam prapanno'smi govinda jaya devakinandana | jaya deva jagannatha pahi mam pushkarekshana || 36||
    nanya gatistvadanya me tvameva sharanam mama | iti shrilingamahapurane uttarabhage pancamadhyayantargatam
    ambarishakritam vishnustotram samaptam | lingapurana | uttarabhaga | adhyaya 5
  devanagari: अम्बरीषकृतं विष्णुस्तोत्रम् अम्बरीष उवाच । प्रसीद लोकनाथेश मम नाथ जनार्दन । कृष्ण विष्णो
    जगन्नाथ सर्वलोकनमस्कृत ॥ ३३॥ त्वमादिस्त्वमनादिस्त्वमनन्तः पूरुषः प्रभुः । अप्रमेयो विभुर्विष्णुर्गोविन्दः
    कमलेक्षणः ॥ ३४॥ महेश्वराङ्गजो मध्ये पुष्करः खगमः खगः । कव्यवाहः कपाली त्वं हव्यवाहः प्रभञ्जनः ॥ ३५॥
    आदिदेवः क्रियानन्दः परमात्माऽऽत्मनि स्थितः । त्वां प्रपन्नोऽस्मि गोविन्द जय देवकीनन्दन । जय देव जगन्नाथ
    पाहि मां पुष्करेक्षण ॥ ३६॥ नान्या गतिस्त्वदन्या मे त्वमेव शरणं मम । इति श्रीलिङ्गमहापुराणे उत्तरभागे
    पञ्चमाध्यायान्तर्गतं अम्बरीषकृतं विष्णुस्तोत्रं समाप्तम् । लिङ्गपुराण । उत्तरभाग । अध्याय ५
