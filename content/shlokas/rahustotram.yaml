id: rahustotram
category: stotram
name:
  english: rahustotram
  devanagari: रहुस्तोत्रम्
content:
  english: raho karaḻavadana ravicandrabhayankara | tamorupa namastubhyam prasadam kuru sarvada || 8||
    simhikasuta suryare siddhagandharvapujita | simhavaha namastubhyam sarvanrogan nivaraya || 9|| kripanaphalakahasta
    trishulin varadayaka | garaḻatigaraḻasya gadanme nashayakhilan || 10|| svarbhano sarpavadana sudhakaravimardana
    | surasuravarastutya sarvada tvam prasida me || 11|| iti samprarthito rahuh dushtasthanagato'pi va
    | suprito jayate tasya sarvan rogan vinashayet || 12|| vishanna jayate bhitih maharogasya ka katha
    | sarvan kamanavapnoti nashtam rajyamavapnuyat || 13|| evam pathedanudinam stavarajametam martyah
    prasanna hridayo vijitendriyo yah | arogyamayuratulam labhate suputransarve graha vishamagah suratiprasannah
    || 14|| iti rahustotram sampurnam |
  devanagari: राहो कराळवदन रविचन्द्रभयङ्कर । तमोरूप नमस्तुभ्यं प्रसादं कुरु सर्वदा ॥ ८॥ सिम्हिकासुत सूर्यारे
    सिद्धगन्धर्वपूजित । सिंहवाह नमस्तुभ्यं सर्वान्रोगान् निवारय ॥ ९॥ कृपाणफलकाहस्त त्रिशूलिन् वरदायक ।
    गरळातिगराळास्य गदान्मे नाशयाखिलान् ॥ १०॥ स्वर्भानो सर्पवदन सुधाकरविमर्दन । सुरासुरवरस्तुत्य सर्वदा
    त्वं प्रसीद मे ॥ ११॥ इति सम्प्रार्थितो राहुः दुष्टस्थानगतोऽपि वा । सुप्रीतो जायते तस्य सर्वान् रोगान्
    विनाशयेत् ॥ १२॥ विषान्न जायते भीतिः महारोगस्य का कथा । सर्वान् कामानवाप्नोति नष्टं राज्यमवाप्नुयात्
    ॥ १३॥ एवं पठेदनुदिनं स्तवराजमेतं मर्त्यः प्रसन्न हृदयो विजितेन्द्रियो यः । आरोग्यमायुरतुलं लभते सुपुत्रान्सर्वे
    ग्रहा विषमगाः सुरतिप्रसन्नाः ॥ १४॥ इति राहुस्तोत्रं सम्पूर्णम् ।
