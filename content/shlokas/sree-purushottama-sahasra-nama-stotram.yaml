  devanagari: विनियोगः पुराणपुरुषो विष्णुः पुरुषोत्तम उच्यते । नाम्नां सहस्रं वक्ष्यामि तस्य भागवतोद्धृतम्
    ॥ ॥ यस्य प्रसादाद्वागीशाः प्रजेशा विभवोन्नताः । क्षुद्रा अपि भवन्त्याशु श्रीकृष्णं तं नतोऽस्म्यहम्
    ॥ ॥ अनन्ता एव कृष्णस्य लीला नामप्रवर्तिकाः । उक्ता भागवते गूहाः प्रकटा अपि कुत्रचित् ॥ ॥ अतस्तानि
    प्रवक्ष्यामि नामानि मुरवैरिणः । सहस्रं यैस्तु पठितैः पठितं स्याच्छुकामृतम् ॥ ॥ कृष्णनामसहस्रस्य ऋषिरग्निर्निरूपितः
    । गायत्री च तथा छन्दो देवता पुरुषोत्तमः ॥ ॥ विनियोगः समस्तेषु पुरुषार्थेषु वै मतः । बीजं भक्तप्रियः
    शक्तिः सत्यवागुच्यते हरिः ॥ ॥ भक्तोद्धरणयत्नस्तु मन्त्रोऽत्र परमो मतः । अवतारितभक्तांशः कीलकं परिकीर्तितम्
    ॥ ॥ अस्त्रं सर्वसमर्थश्च गोविन्दः कवचं मतम् । पुरुषो ध्यानमत्रोक्तः सिद्धिः शरणसंस्मृतिः ॥ ॥ अधिकारलीला
    श्रीकृष्णः सच्चिदानन्दो नित्यलीलाविनोदकृत् । सर्वागमविनोदी च लक्ष्मीशः पुरुषोत्तमः ॥ ॥ आदिकालः सर्वकालः
    कालात्मा माययावृतः । भक्तोद्धारप्रयत्नात्मा जगत्कर्ता जगन्मयः ॥ ॥ नामलीलापरो विष्णुर्व्यासात्मा शुकमोक्षदः
    । व्यापिवैकुण्ठदाता च श्रीमद्भागवतागमः ॥ ॥ शुकवागमृताब्धीन्दुः शौनकाद्यखिलेष्टदः । भक्तिप्रवर्तकस्त्राता
    व्यासचिन्ताविनाशकः ॥ ॥ सर्वसिद्धान्तवागात्मा नारदाद्यखिलेष्टदः । अन्तरात्मा ध्यानगम्यो भक्तिरत्नप्रदायकः
    ॥ ॥ मुक्तोपसृप्यः पूर्णात्मा मुक्तानां रतिवर्धनः । भक्तकार्यैकनिरतो द्रौण्यस्त्रविनिवारकः ॥ ॥ भक्तस्मयप्रणेता
    च भक्तवाक्परिपालकः । ब्रह्मण्यदेवो धर्मात्मा भक्तानां च परीक्षकः ॥ ॥ आसन्नहितकर्ता च मायाहितकरः प्रभुः
    । उत्तराप्राणदाता च ब्रह्मास्त्रविनिवारकः ॥ ॥ सर्वतः पाणवपतिः परीक्षिच्छुद्धिकारणम् । गूहात्मा सर्ववेदेषु
    भक्तैकहृदयङ्गमः ॥ ॥ कुन्तीस्तुत्यः प्रसन्नात्मा परमाद्भुतकार्यकृत् । भीष्ममुक्तिप्रदः स्वामी भक्तमोहनिवारकः
    ॥ ॥ सर्वावस्थासु संसेव्यः समः सुखहितप्रदः । कृतकृत्यः सर्वसाक्षी भक्तस्त्रीरतिवर्धनः ॥ ॥ सर्वसौभाग्यनिलयः
    परमाश्चर्यरूपधृक् । अनन्यपुरुषस्वामी द्वारकाभाग्यभाजनम् ॥ ॥ बीजसंस्कारकर्ता च परीक्षिज्जानपोषकः ।
    सर्वत्रपूर्णगुणकः सर्वभूषणभूषितः ॥ ॥ सर्वलक्षणदाता च धृतराष्ट्रविमुक्तिदः । सन्मार्गरक्षको नित्यं
    विदुरप्रीतिपूरकः ॥ ॥ लीलाव्यामोहकर्ता च कालधर्मप्रवर्तकः । पाणवानां मोक्षदाता परीक्षिद्भाग्यवर्धनः
    ॥ ॥ कलिनिग्रहकर्ता च धर्मादीनां च पोषकः । सत्सङ्गजानहेतुश्च श्रीभागवतकारणम् ॥ ॥ प्राकृतादृष्टमार्गश्च॥॥॥॥॥॥
    चोन्तिनुएद् ज्ञान लीला ॥॥॥॥॥॥॥॥॥॥॥॥ श्रोतव्यः सकलागमैः । कीर्तितव्यः शुद्धभावैः स्मर्तव्यश्चात्मवित्तमैः
    ॥ ॥ अनेकमार्गकर्ता च नानाविधगतिप्रदः । पुरुषः सकलाधारः सत्त्वैकनिलयात्मभूः ॥ ॥ सर्वध्येयो योगगम्यो
    भक्त्या ग्राह्यः सुरप्रियः । जन्मादिसार्थककृतिर्लीलाकर्ता पतिः सताम् ॥ ॥ आदिकर्ता तत्त्वकर्ता सर्वकर्ता
    विशारदः । नानावतारकर्ता च ब्रह्माविर्भावकारणम् ॥ ॥ दशलीलाविनोदी च नानासृष्टिप्रवर्तकः । अनेककल्पकर्ता
    च सर्वदोषविवर्जितः ॥ ॥ सर्गलीला वैराग्यहेतुस्तीर्थात्मा सर्वतीर्थफलप्रदः । तीर्थशुद्धैकनिलयः स्वमार्गपरिपोषकः
    ॥ ॥ तीर्थकीर्तिर्भक्तगम्यो भक्तानुशयकार्यकृत् । भक्ततुल्यः सर्वतुल्यः स्वेच्छासर्वप्रवर्तकः ॥ ॥ गुणातीतोऽनवद्यात्मा
    सर्गलीलाप्रवर्तकः । साक्षात्सर्वजगत्कर्ता महदादिप्रवर्तकः ॥ ॥ मायाप्रवर्तकः साक्षी मायारतिविवर्धनः
    । आकाशात्मा चतुर्मूर्तिश्चतुर्धा भूतभावनः ॥ ॥ रजःप्रवर्तको ब्रह्मा मरीच्यादिपितामहः । वेदकर्ता यज्ञकर्ता
    सर्वकर्ताऽमितात्मकः ॥ ॥ अनेकसृष्टिकर्ता च दशधासृष्टिकारकः । यज्ञाङ्गो यज्ञवाराहो भूधरो भूमिपालकः ॥
    ॥ सेतुर्विधरणो जैत्रो हिरण्याक्षान्तकः सुरः । दितिकश्यपकामैकहेतुसृष्टिप्रवर्तकः ॥ ॥ देवाभयप्रदाता
    च वैकुण्ठाधिपतिर्महान् । सर्वगर्वप्रहारी च सनकाद्यखिलार्थदः ॥ ॥ सर्वाश्वासनकर्ता च भक्ततुल्याहवप्रदः
    । काललक्षणहेतुश्च सर्वार्थज्ञापकः परः ॥ ॥ भक्तोन्नतिकरः सर्वप्रकारसुखदायकः । नानायुद्धप्रहरणो ब्रह्मशापविमोचकः
    ॥ ॥ पुष्टिसर्गप्रणेता च गुणसृष्टिप्रवर्तकः । कर्दमेष्टप्रदाता च देवहूत्यखिलार्थदः ॥ ॥ शुक्लनारायणः
    सत्यकालधर्मप्रवर्तकः । ज्ञानावतारः शान्तात्मा कपिलः कालनाशकः ॥ ॥ त्रिगुणाधिपतिः साङ्ख्यशास्त्रकर्ता
    विशारदः । सर्गदूषणहारी च पुष्टिमोक्षप्रवर्तकः ॥ ॥ लौकिकानन्ददाता च ब्रह्मानन्दप्रवर्तकः । भक्तिसिद्धान्तवक्ता
    च सगुणज्ञानदीपकः ॥ ॥ आत्मप्रदः पूर्णकामो योगात्मा योगभावितः । जीवन्मुक्तिप्रदः श्रीमानन्यभक्तिप्रवर्तकः
    ॥ ॥ कालसामर्थ्यदाता च कालदोषनिवारकः । गर्भोत्तमज्ञानदाता कर्ममार्गनियामकः ॥ ॥ सर्वमार्गनिराकर्ता भक्तिमार्गैकपोषकः
    । सिद्धिहेतुः सर्वहेतुः सर्वाश्चर्यैककारणम् ॥ ॥ चेतनाचेतनपतिः समुद्रपरिपूजितः । साङ्ख्याचार्यस्तुतः
    सिद्धपूजितः सर्वपूजितः ॥ ॥ विसर्गलीला विसर्गकर्ता सर्वेशः कोटिसूर्यसमप्रभः । अनन्तगुणगम्भीरो महापुरुषपूजितः
    ॥ ॥ अनन्तसुखदाता च ब्रह्मकोटिप्रजापतिः । सुधाकोटिस्वास्थ्यहेतुः कामधुक्कोटिकामदः ॥ ॥ समुद्रकोटिगम्भीरस्तीर्थकोटिसमाह्वयः
    । सुमेरुकोटिनिष्कम्पः कोटिब्रह्माण्डविग्रहः ॥ ॥ कोट्यश्वमेधपापघ्नो वायुकोटिमहाबलः । कोटीन्दुजगदानन्दी
    शिवकोटिप्रसादकृत् ॥ ॥ सर्वसद्गुणमाहात्म्यः सर्वसद्गुणभाजनम् । मन्वादिप्रेरको धर्मो यज्ञनारायणः परः
    ॥ ॥ आकूतिसूनुर्देवेन्द्रो रुचिजन्माऽभयप्रदः । दक्षिणापतिरोजस्वी क्रियाशक्तिः परायणः ॥ ॥ दत्तात्रेयो
    योगपतिर्योगमार्गप्रवर्तकः । अनसूयागर्भरत्नमृषिवंशविवर्धनः ॥ ॥ गुणत्रयविभागज्ञश्चतुर्वर्गविशारदः ।
    नारायणो धर्मसूनुर्मूर्तिपुण्ययशस्करः ॥ ॥ सहस्रकवचच्छेदी तपःसारो नरप्रियः । विश्वानन्दप्रदः कर्मसाक्षी
    भारतपूजितः ॥ ॥ अनन्ताद्भुतमाहात्म्यो बदरीस्थानभूषणम् । जितकामो जितक्रोधो जितसङ्गो जितेन्द्रियः ॥ ॥
    उर्वशीप्रभवः स्वर्गसुखदायी स्थितिप्रदः । अमानी मानदो गोप्ता भगवच्छास्त्रबोधकः ॥ ॥ ब्रह्मादिवन्द्यो
    हंसश्रीर्मायावैभवकारणम् । विविधानन्तसर्गात्मा विश्वपूरणतत्परः ॥ ॥ यज्ञजीवनहेतुश्च यज्ञस्वामीष्टबोधकः
    । नानासिद्धान्तगम्यश्च सप्ततन्तुश्च षड्गुणः ॥ ॥ प्रतिसर्गजगत्कर्ता नानालीलाविशारदः । ध्रुवप्रियो ध्रुवस्वामी
    चिन्तिताधिकदायकः ॥ ॥ दुर्लभानन्तफलदो दयानिधिरमित्रहा । अङ्गस्वामी कृपासारो वैन्यो भूमिनियामकः ॥ ॥
    भूमिदोग्धा प्रजाप्राणपालनैकपरायणः । यशोदाता ज्ञानदाता सर्वधर्मप्रदर्शकः ॥ ॥ पुरञ्जनो जगन्मित्रं विसर्गान्तप्रदर्शकः
    । प्रचेतसां पतिश्चित्रभक्तिहेतुर्जनार्दनः ॥ ॥ स्मृतिहेतुब्रह्मभावसायुज्यादिप्रदः शुभः । विजयी ॥॥॥॥॥॥॥॥॥॥
    चोन्तिनुएद् स्थानलीला ॥॥ स्थितिलीलाब्धिरच्युतो विजयप्रदः ॥ ॥ स्वसामर्थ्यप्रदो भक्तकीर्तिहेतुरधोक्षजः
    । प्रियव्रतप्रियस्वामी स्वेच्छावादविशारदः ॥ ॥ सङ्ग्यगम्यः स्वप्रकाशः सर्वसङ्गविवर्जितः । इच्छायां
    च समर्यादस्त्यागमात्रोपलम्भनः ॥ ॥ अचिन्त्यकार्यकर्ता च तर्कागोचरकार्यकृत् । श ऋङ्गाररसमर्यादा आग्नीध्ररसभाजनम्
    ॥ ॥ नाभीष्टपूरकः कर्ममर्यादादर्शनोत्सुकः । सर्वरूपोऽद्भुततमो मर्यादापुरुषोत्तमः ॥ ॥ सर्वरूपेषु सत्यात्मा
    कालसाक्षी शशिप्रभः । मेरुदेवीव्रतफलमृषभो भगलक्षणः ॥ ॥ जगत्सन्तर्पको मेघरूपी देवेन्द्रदर्पहा । जयन्तीपतिरत्यन्तप्रमाणाशेषलौकिकः
    ॥ ॥ शतधान्यस्तभूतात्मा शतानन्दो गुणप्रसूः । वैष्णवोत्पादनपरः सर्वधर्मोपदेशकः ॥ ॥ परहंसक्रियागोप्ता
    योगचर्याप्रदर्शकः । चतुर्थाश्रमनिर्णेता सदानन्दशरीरवान् ॥ ॥ प्रदर्शितान्यधर्मश्च भरतस्वाम्यपारकृत्
    । यथावत्कर्मकर्ता च सङ्गानिष्टप्रदर्शकः ॥ ॥ आवश्यकपुनर्जन्मकर्ममार्गप्रदर्शकः । यज्ञरूपमृगः शान्तः
    सहिष्णुः सत्पराक्रमः ॥ ॥ रहूगणगतिज्ञश्च रहूगणविमोचकः । भवाटवीतत्त्ववक्ता बहिर्मुखहिते रतः ॥ ॥ गयस्वामी
    स्थानवंशकर्ता स्थानविभेदकृत् । पुरुषावयवो भूमिविशेषविनिरूपकः ॥ ॥ जम्बूद्वीपपतिर्मेरुनाभिपद्मरुहाश्रयः
    । नानाविभूतिलीलाढ्यो गङ्गोत्पत्तिनिदानकृत् ॥ ॥ गङ्गामाहात्म्यहेतुश्च गङ्गारूपोऽतिगूढकृत् । वैकुण्ठदेहहेत्वम्बुजन्मकृत्
    सर्वपावनः ॥ ॥ शिवस्वामी शिवोपास्यो गूढः सङ्कर्षणात्मकः । स्थानरक्षार्थमत्स्यादिरूपः सर्वैकपूजितः ॥
    ॥ उपास्यनानारूपात्मा ज्योतीरूपो गतिप्रदः । सूर्यनारायणो वेदकान्तिरुज्ज्वलवेषधृक् ॥ ॥ हंसोऽन्तरिक्षगमनः
    सर्वप्रसवकारणम् । आनन्दकर्ता वसुदो बुधो वाक्पतिरुज्ज्वलः ॥ ॥ कालात्मा कालकालश्च कालच्छेदकृदुत्तमः
    । शिशुमारः सर्वमूर्तिराधिदैविकरूपधृक् ॥ ॥ अनन्तसुखभोगाढ्यो विवरैश्वर्यभाजनम् । सङ्कर्षणो दैत्यपतिः
    सर्वाधारो बृहद्वपुः ॥ ॥ अनन्तनरकच्छेदी स्मृतिमात्रार्तिनाशनः । सर्वानुग्रहकर्ता च ॥॥॥॥॥॥॥॥॥॥ चोन्तिनुएद्
    पोषण लीला ॥॥॥॥॥॥॥॥ मर्यादाभिन्नशास्त्रकृत् ॥ ॥ कालान्तकभयच्छेदी नामसामर्थ्यरूपधृक् । उद्धारानर्हगोप्त्रात्मा
    नामादिप्रेरकोत्तमः ॥ ॥ अजामिलमहादुष्टमोचकोऽघविमोचकः । धर्मवक्ताऽक्लिष्टवक्ता विष्णुधर्मस्वरूपधृक्
    ॥ ॥ सन्मार्गप्रेरको धर्ता त्यागहेतुरधोक्षजः । वैकुण्ठपुरनेता च दाससंवृद्धिकारकः ॥ ॥ दक्षप्रसादकृद्धंसगुह्यस्तुतिविभावनः
    । स्वाभिप्रायप्रवक्ता च मुक्तजीवप्रसूतिकृत् ॥ ॥ नारदप्रेरणात्मा च हर्यश्वब्रह्मभावनः । शबलाश्वहितो
    गूढवाक्यार्थज्ञापनक्षमः ॥ ॥ गूढार्थज्ञापनः सर्वमोक्षानन्दप्रतिष्ठितः । पुष्टिप्ररोहहेतुश्च दासैकज्ञातहृद्गतः
    ॥ ॥ शान्तिकर्ता सुहितकृत् स्त्रीप्रसूः सर्वकामधुक् । पुष्टिवंशप्रणेता च विश्वरूपेष्टदेवता ॥ ॥ कवचात्मा
    पालनात्मा वर्मोपचितिकारणम् । विश्वरूपशिरश्छेदी त्वाष्ट्रयज्ञविनाशकः ॥ ॥ वृत्रस्वामी वृत्रगम्यो वृत्रव्रतपरायणः
    । वृत्रकीर्तिर्वृत्रमोक्षो मघवत्प्राणरक्षकः ॥ ॥ अश्वमेधहविर्भोक्ता देवेन्द्रामीवनाशकः । संसारमोचकश्चित्रकेतुबोधनतत्परः
    ॥ ॥ मन्त्रसिद्धिः सिद्धिहेतुः सुसिद्धिफलदायकः । महादेवतिरस्कर्ता भक्त्यै पूर्वार्थनाशकः ॥ ॥ देवब्राह्मणविद्वेषवैमुख्यज्ञापकः
    शिवः । आदित्यो दैत्यराजश्च महत्पतिरचिन्त्यकृत् ॥ ॥ मरुतां भेदकस्त्राता व्रतात्मा पुम्प्रसूतिकृत् ।
    ऊतिलीला कर्मात्मा वासनात्मा च ऊतिलीलापरायणः ॥ ॥ समदैत्यसुरः स्वात्मा वैषम्यज्ञानसंश्रयः । देहाद्युपाधिरहितः
    सर्वज्ञः सर्वहेतुविद् ॥ ॥ ब्रह्मवाक्स्थापनपरः स्वजन्मावधिकार्यकृत् । सदसद्वासनाहेतुस्त्रिसत्यो भक्तमोचकः
    ॥ ॥ हिरण्यकशिपुद्वेषी प्रविष्टात्माऽतिभीषणः । शान्तिज्ञानादिहेतुश्च प्रह्लादोत्पत्तिकारणम् ॥ ॥ दैत्यसिद्धान्तसद्वक्ता
    तपःसार उदारधीः । दैत्यहेतुप्रकटनो भक्तिचिह्नप्रकाशकः ॥ ॥ सद्द्वेषहेतुः सद्द्वेषवासनात्मा निरन्तरः
    । नैष्ठुर्यसीमा प्रह्लादवत्सलः सङ्गदोषहा ॥ ॥ महानुभावः साकारः सर्वाकारः प्रमाणभूः । स्तम्भप्रसूतिर्नृहरिर्नृसिंहो
    भीमविक्रमः ॥ ॥ विकटास्यो ललज्जिह्वो नखशस्त्रो जवोत्कटः । हिरण्यकशिपुच्छेदी क्रूरदैत्यनिवारकः ॥ ॥ सिंहासनस्थः
    क्रोधात्मा लक्ष्मीभयविवर्धनः । ब्रह्माद्यत्यन्तभयभूरपूर्वाचिन्त्यरूपधृक् ॥ ॥ भक्तैकशान्तहृदयो भक्तस्तुत्यः
    स्तुतिप्रियः । भक्ताङ्गलेहनोद्धूतक्रोधपुङ्जः प्रशान्तधीः ॥ ॥ स्मृतिमात्रभयत्राता ब्रह्मबुद्धिप्रदायकः
    । गोरूपधार्यमृतपाः शिवकीर्तिविवर्धनः ॥ ॥ धर्मात्मा सर्वकर्मात्मा विशेषात्माऽऽश्रमप्रभुः । संसारमग्नस्वोद्धर्ता
    सन्मार्गाखिलतत्त्ववाक् ॥ ॥ आचारात्मा सदाचारः ॥॥॥॥॥॥॥॥॥ चोन्तिनुएद् मन्वन्तरलीला ॥॥॥॥॥॥॥॥॥॥मन्वन्तरविभावनः
    । स्मृत्याऽशेषाशुभहरो गजेन्द्रस्मृतिकारणम् ॥ ॥ जातिस्मरणहेत्वैकपूजाभक्तिस्वरूपदः । यज्ञो भयान्मनुत्राता
    विभुर्ब्रह्मव्रताश्रयः ॥ ॥ सत्यसेनो दुष्टघाती हरिर्गजविमोचकः । वैकुण्ठो लोककर्ता च अजितोऽमृतकारणम्
    ॥ ॥ उरुक्रमो भूमिहर्ता सार्वभौमो बलिप्रियः । विभुः सर्वहितैकात्मा विष्वक्सेनः शिवप्रियः ॥ ॥ धर्मसेतुर्लोकधृतिः
    सुधामान्तरपालकः । उपहर्ता योगपतिर्बृहद्भानुः क्रियापतिः ॥ ॥ चतुर्दशप्रमाणात्मा धर्मो मन्वादिबोधकः
    । लक्ष्मीभोगैकनिलयो देवमन्त्रप्रदायकः ॥ ॥ दैत्यव्यामोहकः साक्षाद्गरुडस्कन्धसंश्रयः । लीलामन्दरधारी
    च दैत्यवासुकिपूजितः ॥ ॥ समुद्रोन्मथनायत्तोऽविघ्नकर्ता स्ववाक्यकृत् । आदिकूर्मः पवित्रात्मा मन्दराघर्षणोत्सुकः
    ॥ ॥ श्वासैजदब्धिवार्वीचिः कल्पान्तावधिकार्यकृत् । चतुर्दशमहारत्नो लक्ष्मीसौभाग्यवर्धनः ॥ ॥ धन्वन्तरिः
    सुधाहस्तो यज्ञभोक्ताऽऽर्तिनाशनः । आयुर्वेदप्रणेता च देवदैत्याखिलार्चितः ॥ ॥ बुद्धिव्यामोहको देवकार्यसाधनतत्परः
    । स्त्रीरूपो मायया वक्ता दैत्यान्तःकरणप्रियः ॥ ॥ पायितामृतदेवांशो युद्धहेतुस्मृतिप्रदः । सुमालिमालिवधकृन्माल्यवत्प्राणहारकः
    ॥ ॥ कालनेमिशिरश्छेदी दैत्ययज्ञविनाशकः । इन्द्रसामर्थ्यदाता च दैत्यशेषस्थितिप्रियः ॥ ॥ शिवव्यामोहको
    मायी भृगुमन्त्रस्वशक्तिदः । बलिजीवनकर्ता च स्वर्गहेतुर्व्रतार्चितः ॥ ॥ अदित्यानन्दकर्ता च कश्यपादितिसम्भवः
    । उपेन्द्र इन्द्रावरजो वामनब्रह्मरूपधृक् ॥ ॥ ब्रह्मादिसेवितवपुर्यज्ञपावनतत्परः । याच्ञोपदेशकर्ता च
    ज्ञापिताशेषसंस्थितिः ॥ ॥ सत्यार्थप्रेरकः सर्वहर्ता गर्वविनाशकः । त्रिविक्रमस्त्रिलोकात्मा विश्वमूर्तिः
    पृथुश्रवाः ॥ ॥ पाशबद्धबलिः सर्वदैत्यपक्षोपमर्दकः । सुतलस्थापितबलिः स्वर्गाधिकसुखप्रदः ॥ ॥ कर्मसम्पूर्तिकर्ता
    च स्वर्गसंस्थापितामरः । ज्ञातत्रिविधधर्मात्मा महामीनोऽब्धिसंश्रयः ॥ ॥ सत्यव्रतप्रियो गोप्ता मत्स्यमूर्तिधृतश्रुतिः
    । श ऋङ्गबद्धधृतक्षोणिः सर्वार्थज्ञापको गुरुः ॥ ॥ ईशानुकथालीला ईशसेवकलीलात्मा सूर्यवंशप्रवर्तकः । सोमवंशोद्भवकरो
    मनुपुत्रगतिप्रदः ॥ ॥ अम्बरीषप्रियः साधुर्दुर्वासोगर्वनाशकः । ब्रह्मशापोपसंहर्ता भक्तकीर्तिविवर्धनः
    ॥ ॥ इक्ष्वाकुवंशजनकः सगराद्यखिलार्थदः । भगीरथमहायत्नो गङ्गाधौताङ्घ्रिपङ्कजः ॥ ॥ ब्रह्मस्वामी शिवस्वामी
    सगरात्मजमुक्तिदः । खट्वाङ्गमोक्षहेतुश्च रघुवंशविवर्धनः ॥ ॥ रघुनाथो रामचन्द्रो रामभद्रो रघुप्रियः ।
    अनन्तकीर्तिः पुण्यात्मा पुण्यश्लोकैकभास्करः ॥ ॥ कोशलेन्द्रः प्रमाणात्मा सेव्यो दशरथात्मजः । लक्ष्मणो
    भरतश्चैव शत्रुघ्नो व्यूहविग्रहः ॥ ॥ विश्वामित्रप्रियो दान्तस्ताडकावधमोक्षदः । वायव्यास्त्राब्धिनिक्षिप्तमारीचश्च
    सुबाहुहा ॥ ॥ वृषध्वजधनुर्भङ्गप्राप्तसीतामहोत्सवः । सीतापतिर्भृगुपतिगर्वपर्वतनाशकः ॥ ॥ अयोध्यास्थमहाभोगयुक्तलक्ष्मीविनोदवान्
    । कैकेयीवाक्यकर्ता च पितृवाक्परिपालकः ॥ ॥ वैराग्यबोधकोऽनन्यसात्त्विकस्थानबोधकः । अहल्यादुःखहारी च
    गुहस्वामी सलक्ष्मणः ॥ ॥ चित्रकूटप्रियस्थानो दण्डकारण्यपावनः । शरभङ्गसुतीक्ष्णादिपूजितोऽगस्त्यभाग्यभूः
    ॥ ॥ ऋषिसम्प्रार्थितकृतिर्विराधवधपण्डितः । छिन्नशूर्पणखानासः खरदूषणघातकः ॥ ॥ एकबाणहतानेकसहस्रबलराक्षसः
    । मारीचघाती नियतसीतासम्बन्धशोभितः ॥ ॥ सीतावियोगनाट्यश्च जटायुर्वधमोक्षदः । शबरीपूजितो भक्तहनुमत्प्रमुखावृतः
    ॥ ॥ दुन्दुभ्यस्थिप्रहरणः सप्ततालविभेदनः । सुग्रीवराज्यदो वालिघाती सागरशोषणः ॥ ॥ सेतुबन्धनकर्ता च विभीषणहितप्रदः
    । रावणादिशिरश्छेदी राक्षसाघौघनाशकः ॥ ॥ सीताऽभयप्रदाता च पुष्पकागमनोत्सुकः । अयोध्यापतिरत्यन्तसर्वलोकसुखप्रदः
    ॥ ॥ मथुरापुरनिर्माता सुकृतज्ञस्वरूपदः । जनकज्ञानगम्यश्च ऐलान्तप्रकटश्रुतिः ॥ ॥ हैहयान्तकरो रामो दुष्टक्षत्रविनाशकः
    । सोमवंशहितैकात्मा यदुवंशविवर्धनः ॥ ॥ निरोधलीला परब्रह्मावतरणः केशवः क्लेशनाशनः । भूमिभारावतरणो भक्तार्थाखिलमानसः
    ॥ ॥ सर्वभक्तनिरोधात्मा लीलानन्तनिरोधकृत् । भूमिष्ठपरमानन्दो देवकीशुद्धिकारणम् ॥ ॥ वसुदेवज्ञाननिष्ठसमजीवनिवारकः
    । सर्ववैराग्यकरणस्वलीलाधारशोधकः ॥ ॥ मायाज्ञापनकर्ता च शेषसम्भारसम्भृतिः । भक्तक्लेशपरिज्ञाता तन्निवारणतत्परः
    ॥ ॥ आविष्टवसुदेवांशो देवकीगर्भभूषणम् । पूर्णतेजोमयः पूर्णः कंसाधृष्यप्रतापवान् ॥ ॥ विवेकज्ञानदाता
    च ब्रह्माद्यखिलसंस्तुतः । सत्यो जगत्कल्पतरुर्नानारूपविमोहनः ॥ ॥ भक्तिमार्गप्रतिष्ठाता विद्वन्मोहप्रवर्तकः
    । मूलकालगुणद्रष्टा नयनानन्दभाजनम् ॥ ॥ वसुदेवसुखाब्धिश्च देवकीनयनामृतम् । पितृमातृस्तुतः पूर्वसर्ववृत्तान्तबोधकः
    ॥ ॥ गोकुलागतिलीलाप्तवसुदेवकरस्थितिः । सर्वेशत्वप्रकटनो मायाव्यत्ययकारकः ॥ ॥ ज्ञानमोहितदुष्टेशः प्रपञ्चास्मृतिकारणम्
    । यशोदानन्दनो नन्दभाग्यभूगोकुलोत्सवः ॥ ॥ नन्दप्रियो नन्दसूनुर्यशोदायाः स्तनन्धयः । पूतनासुपयःपाता
    मुग्धभावातिसुन्दरः ॥ ॥ सुन्दरीहृदयानन्दो गोपीमन्त्राभिमन्त्रितः । गोपालाश्चर्यरसकृत् शकटासुरखण्डनः
    ॥ ॥ नन्दव्रजजनानन्दी नन्दभाग्यमहोदयः । तृणावर्तवधोत्साहो यशोदाज्ञानविग्रहः ॥ ॥ बलभद्रप्रियः कृष्णः
    सङ्कर्षणसहायवान् । रामानुजो वासुदेवो गोष्ठाङ्गणगतिप्रियः ॥ ॥ किङ्किणीरवभावज्ञो वत्सपुच्छावलम्बनः ।
    नवनीतप्रियो गोपीमोहसंसारनाशकः ॥ ॥ गोपबालकभावज्ञश्चौर्यविद्याविशारदः । मृत्स्नाभक्षणलीलास्यमाहात्म्यज्ञानदायकः
    ॥ ॥ धराद्रोणप्रीतिकर्ता दधिभाण्डविभेदनः । दामोदरो भक्तवश्यो यमलार्जुनभञ्जनः ॥ ॥ बृहद्वनमहाश्चर्यो
    वृन्दावनगतिप्रियः । वत्सघाती बालकेलिर्बकासुरनिषूदनः ॥ ॥ अरण्यभोक्ताऽप्यथवा बाललीलापरायणः । प्रोत्साहजनकश्चैवमघासुरनिषूदनः
    ॥ ॥ व्यालमोक्षप्रदः पुष्टो ब्रह्ममोहप्रवर्धनः । अनन्तमूर्तिः सर्वात्मा जङ्गमस्थावराकृतिः ॥ ॥ ब्रह्ममोहनकर्ता
    च स्तुत्य आत्मा सदाप्रियः । पौगण्डलीलाभिरतिर्गोचारणपरायणः ॥ ॥ वृन्दावनलतागुल्मवृक्षरूपनिरूपकः । नादब्रह्मप्रकटनो
    वयःप्रतिकृतिस्वनः ॥ ॥ बर्हिनृत्यानुकरणो गोपालानुकृतिस्वनः । सदाचारप्रतिष्ठाता बलश्रमनिराकृतिः ॥ ॥
    तरुमूलकृताशेषतल्पशायी सखिस्तुतः । गोपालसेवितपदः श्रीलालितपदाम्बुजः ॥ ॥ गोपसम्प्रार्थितफलदाननाशितधेनुकः
    । कालीयफणिमाणिक्यरञ्जितश्रीपदाम्बुजः ॥ ॥ दृष्टिसङ्जीविताशेषगोपगोगोपिकाप्रियः । लीलासम्पीतदावाग्निः
    प्रलम्बवधपण्डितः ॥ ॥ दावाग्न्यावृतगोपालदृष्ट्याच्छादनवह्निपः । वर्षाशरद्विभूतिश्रीर्गोपीकामप्रबोधकः
    ॥ ॥ गोपीरत्नस्तुताशेषवेणुवाद्यविशारदः । कात्यायनीव्रतव्याजसर्वभावाश्रिताङ्गनः ॥ ॥ सत्सङ्गतिस्तुतिव्याजस्तुतवृन्दावनाङ्घ्रिपः
    । गोपक्षुच्छान्तिसंव्याजविप्रभार्याप्रसादकृत् ॥ ॥ हेतुप्राप्तेन्द्रयागस्वकार्यगोसवबोधकः । शैलरूपकृताशेषरसभोगसुखावहः
    ॥ ॥ लीलागोवर्धनोद्धारपालितस्वव्रजप्रियः । गोपस्वच्छन्दलीलार्थगर्गवाक्यार्थबोधकः ॥ ॥ इन्द्रधेनुस्तुतिप्राप्तगोविन्देन्द्राभिधानवान्
    । व्रतादिधर्मसंसक्तनन्दक्लेशविनाशकः ॥ ॥ नन्दादिगोपमात्रेष्टवैकुण्ठगतिदायकः । वेणुवादस्मरक्षोभमत्तगोपीविमुक्तिदः
    ॥ ॥ सर्वभावप्राप्तगोपीसुखसंवर्धनक्षमः । गोपीगर्वप्रणाशार्थतिरोधानसुखप्रदः ॥ ॥ कृष्णभावव्याप्तविश्वगोपीभावितवेषधृक्
    । राधाविशेषसम्भोगप्राप्तदोषनिवारकः ॥ ॥ परमप्रीतिसङ्गीतसर्वाद्भुतमहागुणः । मानापनोदनाक्रन्दगोपीदृष्टिमहोत्सवः
    ॥ ॥ गोपिकाव्याप्तसर्वाङ्गः स्त्रीसम्भाषाविशारदः । रासोत्सवमहासौख्यगोपीसम्भोगसागरः ॥ ॥ जलस्थलरतिव्याप्तगोपीदृष्ट्यभिपूजितः
    । शास्त्रानपेक्षकामैकमुक्तिद्वारविवर्धनः ॥ ॥ सुदर्शनमहासर्पग्रस्तनन्दविमोचकः । गीतमोहितगोपीधृक्षङ्खचूडविनाशकः
    ॥ ॥ गुणसङ्गीतसन्तुष्टिर्गोपीसंसारविस्मृतिः । अरिष्टमथनो दैत्यबुद्धिव्यामोहकारकः ॥ ॥ केशिघाती नारदेष्टो
    व्योमासुरविनाशकः । अक्रूरभक्तिसंराद्धपादरेणुमहानिधिः ॥ ॥ रथावरोहशुद्धात्मा गोपीमानसहारकः । ह्रदसन्दर्शिताशेषवैकुण्ठाक्रूरसंस्तुतः
    ॥ ॥ मथुरागमनोत्साहो मथुराभाग्यभाजनम् । मथुरानगरीशोभादर्शनोत्सुकमानसः ॥ ॥ दुष्टरञ्जकघाती च वायकार्चितविग्रहः
    । वस्त्रमालासुशोभाङ्गः कुब्जालेपनभूषितः ॥ ॥ कुब्जासुरूपकर्ता च कुब्जारतिवरप्रदः । प्रसादरूपसन्तुष्टहरकोदण्डखण्डनः
    ॥ ॥ शकलाहतकंसाप्तधनूरक्षकसैनिकः । जाग्रत्स्वप्नभयव्याप्तमृत्युलक्षणबोधकः ॥ ॥ मथुरामल्ल ओजस्वी मल्लयुद्धविशारदः
    । सद्यः कुवलयापीडघाती चाणूरमर्दनः ॥ ॥ लीलाहतमहामल्लः शलतोशलघातकः । कंसान्तको जितामित्रो वसुदेवविमोचकः
    ॥ ॥ ज्ञाततत्त्वपितृज्ञानमोहनामृतवाङ्मयः । उग्रसेनप्रतिष्ठाता यादवाधिविनाशकः ॥ ॥ नन्दादिसान्त्वनकरो
    ब्रह्मचर्यव्रते स्थितः । गुरुशुश्रूषणपरो विद्यापारमितेश्वरः ॥ ॥ सान्दीपनिमृतापत्यदाता कालान्तकादिजित्
    । गोकुलाश्वासनपरो यशोदानन्दपोषकः ॥ ॥ गोपिकाविरहव्याजमनोगतिरतिप्रदः । समोद्धवभ्रमरवाक् गोपिकामोहनाशकः
    ॥ ॥ कुब्जारतिप्रदोऽक्रूरपवित्रीकृतभूगृहः । पृथादुःखप्रणेता च पाण्डवानां सुखप्रदः ॥ ॥ दशमस्कन्धोत्तरार्धनामानि
    निरोधलीला जरासन्धसमानीतसैन्यघाती विचारकः । यवनव्याप्तमथुराजनदत्तकुशस्थलिः ॥ ॥ द्वारकाद्भुतनिर्माणविस्मापितसुरासुरः
    । मनुष्यमात्रभोगार्थभूम्यानीतेन्द्रवैभवः ॥ ॥ यवनव्याप्तमथुरानिर्गमानन्दविग्रहः । मुचुकुन्दमहाबोधयवनप्राणदर्पहा
    ॥ ॥ मुचुकुन्दस्तुताशेषगुणकर्ममहोदयः । फलप्रदानसन्तुष्टिर्जन्मान्तरितमोक्षदः ॥ ॥ शिवब्राह्मणवाक्याप्तजयभीतिविभावनः
    । प्रवर्षणप्रार्थिताग्निदानपुण्यमहोत्सवः ॥ ॥ रुक्मिणीरमणः कामपिता प्रद्युम्नभावनः । स्यमन्तकमणिव्याजप्राप्तजाम्बवतीपतिः
    ॥ ॥ सत्यभामाप्राणपतिः कालिन्दीरतिवर्धनः । मित्रविन्दापतिः सत्यापतिर्वृषनिषूदनः ॥ ॥ भद्रावाञ्छितभर्ता
    च लक्ष्मणावरणक्षमः । इन्द्रादिप्रार्थितवधनरकासुरसूदनः ॥ ॥ मुरारिः पीठहन्ता च ताम्रादिप्राणहारकः ।
    षोडशस्त्रीसहस्रेशः छत्रकुण्डलदानकृत् ॥ ॥ पारिजातापहरणो देवेन्द्रमदनाशकः । रुक्मिणीसमसर्वस्त्रीसाध्यभोगरतिप्रदः
    ॥ ॥ रुक्मिणीपरिहासोक्तिवाक्तिरोधानकारकः । पुत्रपौत्रमहाभाग्यगृहधर्मप्रवर्तकः ॥ ॥ शम्बरान्तकसत्पुत्रविवाहहतरुक्मिकः
    । उषापहृतपौत्रश्रीर्बाणबाहुनिवारकः ॥ ॥ शीतज्वरभयव्याप्तज्वरसंस्तुतषड्गुणः । शङ्करप्रतियोद्धा च द्वन्द्वयुद्धविशारदः
    ॥ ॥ नृगपापप्रभेत्ता च ब्रह्मस्वगुणदोषदृक् । विष्णुभक्तिविरोधैकब्रह्मस्वविनिवारकः ॥ ॥ बलभद्राहितगुणो
    गोकुलप्रीतिदायकः । गोपीस्नेहैकनिलयो गोपीप्राणस्थितिप्रदः ॥ ॥ वाक्यातिगामियमुनाहलाकर्षणवैभवः । पौण्ड्रकत्याजितस्पर्धः
    काशीराजविभेदनः ॥ ॥ काशीनिदाहकरणः शिवभस्मप्रदायकः । द्विविदप्राणघाती च कौरवाखर्वगर्वनुत् ॥ ॥ लाङ्गलाकृष्टनगरीसंविग्नाखिलनागरः
    । प्रपन्नाभयदः साम्बप्राप्तसन्मानभाजनम् ॥ ॥ नारदान्विष्टचरणो भक्तविक्षेपनाशकः । सदाचारैकनिलयः सुधर्माध्यासितासनः
    ॥ ॥ जरासन्धावरुद्धेन विज्ञापितनिजक्लमः । मन्त्र्युद्धवादिवाक्योक्तप्रकारैकपरायणः ॥ ॥ राजसूयादिमखकृत्
    सम्प्रार्थितसहायकृत् । इन्द्रप्रस्थप्रयाणार्थमहत्सम्भारसम्भृतिः ॥ ॥ जरासन्धवधव्याजमोचिताशेषभूमिपः
    । सन्मार्गबोधको यज्ञक्षितिवारणतत्परः ॥ ॥ शिशुपालहतिव्याजजयशापविमोचकः । दुर्योधनाभिमानाब्धिशोषबाणवृकोदरः॥
    ॥ महादेववरप्राप्तपुरशाल्वविनाशकः । दन्तवक्त्रवधव्याजविजयाघौघनाशकः ॥ ॥ विदूरथप्राणहर्ता न्यस्तशस्त्रास्त्रविग्रहः
    । उपधर्मविलिप्ताङ्गसूतघाती वरप्रदः ॥ ॥ बल्वलप्राणहरणपालितर्षिश्रुतिक्रियः । सर्वतीर्थाघनाशार्थतीर्थयात्राविशारदः
    ॥ ॥ ज्ञानक्रियाविभेदेष्टफलसाधनतत्परः । सारथ्यादिक्रियाकर्ता भक्तवश्यत्वबोधकः ॥ ॥ सुदामारङ्कभार्यार्थभूम्यानीतेन्द्रवैभवः
    । रविग्रहनिमित्ताप्तकुरुक्षेत्रैकपावनः ॥ ॥ नृपगोपीसमस्तस्त्रीपावनार्थाखिलक्रियः । ऋषिमार्गप्रतिष्ठाता
    वसुदेवमखक्रियः ॥ ॥ वसुदेवज्ञानदाता देवकीपुत्रदायकः । अर्जुनस्त्रीप्रदाता च बहुलाश्वस्वरूपदः ॥ ॥ श्रुतदेवेष्टदाता
    च सर्वश्रुतिनिरूपितः । महादेवाद्यतिश्रेष्ठो भक्तिलक्षणनिर्णयः ॥ ॥ वृकग्रस्तशिवत्राता नानावाक्यविशारदः
    । नरगर्वविनाशार्थहृतब्राह्मणबालकः ॥ ॥ लोकालोकपरस्थानस्थितबालकदायकः । द्वारकास्थमहाभोगनानास्त्रीरतिवर्धनः
    ॥ ॥ मनस्तिरोधानकृतव्यग्रस्त्रीचित्तभावितः । मुक्तिलीला मुक्तिलीलाविहरणो मौशलव्याजसंहृतिः ॥ ॥ श्रीभागवतधर्मादिबोधको
    भक्तिनीतिकृत् । उद्धवज्ञानदाता च पञ्चविंशतिधा गुरुः ॥ ॥ आचारभक्तिमुक्त्यादिवक्ता शब्दोद्भवस्थितिः
    । हंसो धर्मप्रवक्ता च सनकाद्युपदेशकृत् ॥ ॥ भक्तिसाधनवक्ता च योगसिद्धिप्रदायकः । नानाविभूतिवक्ता च
    शुद्धधर्मावबोधकः ॥ ॥ मार्गत्रयविभेदात्मा नानाशङ्कानिवारकः । भिक्षुगीताप्रवक्ता च शुद्धसाङ्ख्यप्रवर्तकः
    ॥ ॥ मनोगुणविशेषात्मा ज्ञापकोक्तपुरूरवाः । पूजाविधिप्रवक्ता च सर्वसिद्धान्तबोधकः ॥ ॥ लघुस्वमार्गवक्ता
    च स्वस्थानगतिबोधकः । यादवाङ्गोपसंहर्ता सर्वाश्चर्यगतिक्रियः ॥ ॥ आश्रयलीला कालधर्मविभेदार्थवर्णनाशनतत्परः
    । बुद्धो गुप्तार्थवक्ता च नानाशास्त्रविधायकः ॥ ॥ नष्टधर्ममनुष्यादिलक्षणज्ञापनोत्सुकः । आश्रयैकगतिज्ञाता
    कल्किः कलिमलापहः ॥ ॥ शास्त्रवैराग्यसम्बोधो नानाप्रलयबोधकः । विशेषतः शुकव्याजपरीक्षिज्ज्ञानबोधकः ॥
    ॥ शुकेष्टगतिरूपात्मा परीक्षिद्देहमोक्षदः । शब्दरूपो नादरूपो वेदरूपो विभेदनः ॥ ॥ व्यासः शाखाप्रवक्ता
    च पुराणार्थप्रवर्तकः । मार्कण्डेयप्रसन्नात्मा वटपत्रपुटेशयः ॥ ॥ मायाव्याप्तमहामोहदुःखशान्तिप्रवर्तकः
    । महादेवस्वरूपश्च भक्तिदाता कृपानिधिः ॥ ॥ आदित्यान्तर्गतः कालः द्वादशात्मा सुपूजितः । श्रीभागवतरूपश्च
    सर्वार्थफलदायकः ॥ ॥ इतीदं कीर्तनीयस्य हरेर्नामसहस्रकम् । पञ्चसप्ततिविस्तीर्णं पुराणान्तरभाषितम् ॥
    ॥ य एतत्प्रातरुत्थाय श्रद्धावान् सुसमाहितः । जपेदर्थाहितमतिः स गोविन्दपदं लभेत् ॥ ॥ सर्वधर्मविनिर्मुक्तः
    सर्वसाधनवर्जितः । एतद्धारणमात्रेण कृष्णस्य पदवीं व्रजेत् ॥ ॥ हर्यावेशितचित्तेन श्रीभागवतसागरात् ।
    समुद्धृतानि नामानि चिन्तामणिनिभानि हि ॥ ॥ कण्ठस्थितान्यर्थदीप्त्या बाधन्तेऽज्ञानजं तमः । भक्तिं श्रीकृष्णदेवस्य
    साधयन्ति विनिश्चितम् ॥ ॥ किम्बहूक्तेन भगवान् नामभिः स्तुतषड्गुणः । आत्मभावं नयत्याशु भक्तिं च कुरुते
    दृढाम् ॥ ॥ यः कृष्णभक्तिमिह वाञ्छति साधनौघैर् नामानि भासुरयशांसि जपेत्स नित्यम् । तं वै हरिः स्वपुरुषं
    कुरुतेऽतिशीघ्रम् आत्मार्पणं समधिगच्छति भावतुष्टः ॥ ॥ श्रीकृष्ण कृष्णसख वृष्णिवृषावनिध्रुग् राजन्यवंशदहनानपवर्गवीर्य
    । गोविन्द गोपवनिताव्रजभृत्यगीत तीर्थश्रवः श्रवणमङ्गल पाहि भृत्यान् ॥ ॥ ॥ इति श्रीभागवतसारसमुच्चये
    वैश्वानरोक्तं श्रीवल्लभाचार्यविरचितं श्रीपुरुषोत्तमसहस्रनामस्तोत्रं सम्पूर्णम् ॥
