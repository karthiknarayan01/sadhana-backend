id: muktikopanishat
category: upanishad
name:
  english: muktikopanishat
  devanagari: मुक्तिकोपनिषत्
content:
  english: 40|| purvottareshu vihitatattacchantipurahsaram | vedavidyavratasnatadeshikasya mukhatsvayam
    || 41|| grihitvashtottarashatam ye pathanti dvijottamah | prarabdhakshayaparyantam jivanmukta bhavanti
    te || 42|| tatah kalavashadeva prarabdhe tu kshayam gate | vaidehim mamakim muktim yanti nastyatrasamshayah
    || 43|| sarvopanishadam madhye saramashtottarashatam | sakricchravanamatrena sarvaghaughanikrintanam
    || 44|| mayopadishtam shishyaya tubhyam pavananandana | idam shastram mayadishtam guhyamashtottaram
    shatam || 45|| jnanato'jnanato vapi pathatam bandhamocakam | rajyam deyam dhanam deyam yacatah kamapuranam
    || 45|| idamashtottarashatam na deyam yasya kasyacit | nastikaya kritaghnaya duracararataya vai ||
    47|| madbhaktivimukhayapi shastragarteshu muhyate | gurubhaktivihinaya datavyam na kadacana || 48||
    sevaparaya shishyaya hitaputraya marute | madbhaktaya sushilaya kulinaya sumedhase || 49|| samyak
    parikshya datavyamevamashtottaram shatam | yah pathecchrinuyadvapi sa mameti na samshayah | tadetadricabhyuktam
    | vidya ha vai brahmanamajagama gopaya ma shevadhishti'hamasmi | asuyakayanrijave shathaya ma ma bruya
    viryavati tatha syam | yameva vidyashrutamapramattam medhavinam brahmacaryopapannam | tasma imamupasannaya
    samyak parikshya dadyadvaishnavimatmanishtham || 1|| atha hainam shriramacandram marutih papraccha
    rigvedadivibhagena prithak shantimanubruhiti | sa hovaca shriramah | aitareyakaushitakinadabindvatmaprabodhanirvana
    mudgalakshamalikatripurasaubhagyabahvrica namrigvedagatanam dashasamkhyakanamupanishadam vanme manasiti
    shantih || 1|| ishavasyabrihadaranyajabalahamsaparamahamsasubala mantrikaniralambatrishikhibrahmanamandalabrahmanadvayataraka
    paingalabhikshuturiyatitadhyatmatarasarayajnavalkya shatyayanimuktikanam shuklayajurvedagatanamekonavimshati
    samkhyakanamupanishadam purnamada iti shantih || 2|| kathavallitaittiriyakabrahmakaivalyashvetashvataragarbha
    narayanamritabindvamritanadakalagnirudrakshurika sarvasarashukarahasyatejobindudhyanabindubrahmavidya
    yogatattvadakshinamurtiskandasharirakayogashikhaikakshara akshyavadhutakatharudrahridayayogakundalinipancabrahma
    pranagnihotravarahakalisantaranasarasvatirahasyanam krishnayajurvedagatanam dvatrimshatsamkhyakanamupanishadam
    saha navavatviti shantih || 3|| kenachandogyarunimaitrayanimaitreyivajrasucikayogacudamani vasudevamahatsamnyasavyaktakundikasavitrirudrakshajabaladarshana
    jabalinam samavedagatanam shodashasamkhyakana mupanishadanamapyayantviti shantih || 4|| prashnamundakamandukyatharvashiro'tharvashikhabrihajjabala
    nrisimhatapaninaradaparivrajakasitasharabhamahanarayana ramarahasyaramatapanishandilyaparamahamsaparivrajaka
    annapurnasuryatmapashupataparabrahmatripuratapanadevibhavana brahmajabalaganapatimahavakyagopalatapanakrishnahayagriva
    dattatreyagarudanamatharvavedagatanamekatrimshatsamkhyakana mupanishadam bhadram karnebhiriti shantih
    || 5|| mumukshavah purushah sadhanacatushtayasampannah shraddhavantah sukulabhavam shrotriyam shastravatsalya
    gunavantamakutilam sarvabhutahiteratam dayasamudram sadgurum vidhivadupasamgamyopaharapanayo'shtottarashatopanishadam
    vidhivadadhitya shravanamanananididhyasanani nairantaryena kritva prarabdhakshayaddehatrayabhamgam
    prapyopadhivinirmukta ghatakashavatparipurnata videhamuktih | saiva kaivalyamuktiriti | ata eva brahmalokastha
    api brahmamukhadvedantashravanadi kritva tena saha kaivalyam labhante | atah sarvesham kaivalyamuktirjnanamatrenokta
    | na karmasamkhyayogopasanadibhirityupanishat || iti prathamo'dhyayah || 1|| tatha hainam shriramacandram
    marutih papraccha | keyam va tatsiddhih siddhya va kim prayojanamiti | sahovaca shriramah | purushasya
    kartritvabhoktritva sukhaduhkhadilakshanashcittadharmah klesharupatvadbandho bhavati | tannirodhanam
    jivanmuktih | upadhivinirmukta ghatakashavatprarabdhakshayadvidehamuktih | jivanmuktividehamuktyorashtottarashatopanishadah
    pramanam | kartritvadiduhkhanivrittidvara nityanandavaptih prayojanam bhavati | tatpurushaprayatnasadhyam
    bhavati | yatha putrakameshtina putram vanijyadina vittam jyotishtomena svargam tatha purushaprayatnasadhyavedantashravanadijanitasamadhina
    jivanmuktyadilabho bhavati | sarvavasanakshayattallabhah | atra shloka bhavanti || ucchastram shastritam
    ceti paurusham dvividham matam | atrocchastramanarthaya paramarthaya shastritam || 2
  devanagari: ४०॥ पूर्वोत्तरेषु विहिततत्तच्छान्तिपुरःसरम् । वेदविद्याव्रतस्नातदेशिकस्य मुखात्स्वयम् ॥
    ४१॥ गृहीत्वाष्टोत्तरशतं ये पठन्ति द्विजोत्तमाः । प्रारब्धक्षयपर्यन्तं जीवन्मुक्ता भवन्ति ते ॥ ४२॥
    ततः कालवशादेव प्रारब्धे तु क्षयं गते । वैदेहीं मामकीं मुक्तिं यान्ति नास्त्यत्रसंशयः ॥ ४३॥ सर्वोपनिषदां
    मध्ये सारमष्टोत्तरशतम् । सकृच्छ्रवणमात्रेण सर्वाघौघनिकृन्तनम् ॥ ४४॥ मयोपदिष्टं शिष्याय तुभ्यं पवननन्दन
    । इदं शास्त्रं मयादिष्टं गुह्यमष्टोत्तरं शतम् ॥ ४५॥ ज्ञानतोऽज्ञानतो वापि पठतां बन्धमोचकम् । राज्यं
    देयं धनं देयं याचतः कामपूरणम् ॥ ४५॥ इदमष्टोत्तरशतं न देयं यस्य कस्यचित् । नास्तिकाय कृतघ्नाय दुराचाररताय
    वै ॥ ४७॥ मद्भक्तिविमुखायापि शास्त्रगर्तेषु मुह्यते । गुरुभक्तिविहीनाय दातव्यं न कदाचन ॥ ४८॥ सेवापराय
    शिष्याय हितपुत्राय मारुते । मद्भक्ताय सुशीलाय कुलीनाय सुमेधसे ॥ ४९॥ सम्यक् परीक्ष्य दातव्यमेवमष्टोत्तरं
    शतम् । यः पठेच्छृणुयाद्वापि स मामेति न संशयः । तदेतदृचाभ्युक्तम् । विद्या ह वै ब्राह्मणमाजगाम गोपाय
    मा शेवधिष्टीऽहमस्मि । असूयकायानृजवे शठाय मा मा ब्रूया वीर्यवती तथा स्याम् । यमेव विद्याश्रुतमप्रमत्तं
    मेधाविनं ब्रह्मचर्योपपन्नम् । तस्मा इमामुपसन्नाय सम्यक् परीक्ष्य दद्याद्वैष्णवीमात्मनिष्ठाम् ॥ १॥
    अथ हैनं श्रीरामचन्द्रं मारुतिः पप्रच्छ ऋग्वेदादिविभागेन पृथक् शान्तिमनुब्रूहीति । स होवाच श्रीरामः
    । ऐतरेयकौषीतकीनादबिन्द्वात्मप्रबोधनिर्वाण मुद्गलाक्षमालिकात्रिपुरासौभाग्यबह्वृचा नामृग्वेदगतानां दशसंख्याकानामुपनिषदां
    वाङ्मे मनसीति शान्तिः ॥ १॥ ईशावास्यबृहदारण्यजाबालहंसपरमहंससुबाल मन्त्रिकानिरालम्बत्रिशिखीब्राह्मणमण्डलब्राह्मणाद्वयतारक
    पैङ्गलभिक्षुतुरीयातीताध्यात्मतारसारयाज्ञवल्क्य शाट्यायनीमुक्तिकानां शुक्लयजुर्वेदगतानामेकोनविंशति
    संख्याकानामुपनिषदां पूर्णमद इति शान्तिः ॥ २॥ कठवल्लीतैत्तिरीयकब्रह्मकैवल्यश्वेताश्वतरगर्भ नारायणामृतबिन्द्वमृतनादकालाग्निरुद्रक्षुरिका
    सर्वसारशुकरहस्यतेजोबिन्दुध्यानबिन्दुब्रह्मविद्या योगतत्त्वदक्षिणामूर्तिस्कन्दशारीरकयोगशिखैकाक्षर अक्ष्यवधूतकठरुद्रहृदययोगकुण्डलिनीपञ्चब्रह्म
    प्राणाग्निहोत्रवराहकलिसन्तरणसरस्वतीरहस्यानां कृष्णयजुर्वेदगतानां द्वात्रिंशत्संख्याकानमुपनिषदां सह
    नाववत्विति शान्तिः ॥ ३॥ केनच्हान्दोग्यारुणिमैत्रायणिमैत्रेयीवज्रसूचिकायोगचूडामणि वासुदेवमहत्संन्यासाव्यक्तकुण्डिकासावित्रीरुद्राक्षजाबालदर्शन
    जाबालीनां सामवेदगतानां षोडशसंख्याकाना मुपनिषदानामाप्यायन्त्विति शान्तिः ॥ ४॥ प्रश्नमुण्डकमाण्डुक्याथर्वशिरोऽथर्वशिखाबृहज्जाबाल
    नृसिंहतापनीनारदपरिव्राजकसीताशरभमहानारायण रामरहस्यरामतापनीशाण्डिल्यपरमहंसपरिव्राजक अन्नपूर्णासूर्यात्मपाशुपतपरब्रह्मत्रिपुरातपनदेवीभावना
    ब्रह्मजाबालगणपतिमहावाक्यगोपालतपनकृष्णहयग्रीव दत्तात्रेयगारुडानामथर्ववेदगतानामेकत्रिंशत्संख्याकाना
    मुपनिषदां भद्रं कर्णेभिरिति शान्तिः ॥ ५॥ मुमुक्षवः पुरुषाः साधनचतुष्टयसंपन्नाः श्रद्धावन्तः सुकुलभवं
    श्रोत्रियं शास्त्रवात्सल्य गुणवन्तमकुटिलं सर्वभूतहितेरतं दयासमुद्रं सद्गुरुं विधिवदुपसंगम्योपहारपाणयोऽष्टोत्तरशतोपनिषदं
    विधिवदधीत्य श्रवणमनननिदिध्यासनानि नैरन्तर्येण कृत्वा प्रारब्धक्षयाद्देहत्रयभंगं प्राप्योपाधिविनिर्मुक्त
    घटाकाशवत्परिपूर्णता विदेहमुक्तिः । सैव कैवल्यमुक्तिरिति । अत एव ब्रह्मलोकस्था अपि ब्रह्ममुखाद्वेदान्तश्रवणादि
    कृत्वा तेन सह कैवल्यं लभन्ते । अतः सर्वेषां कैवल्यमुक्तिर्ज्ञानमात्रेणोक्ता । न कर्मसांख्ययोगोपासनादिभिरित्युपनिषत्
    ॥ इति प्रथमोऽध्यायः ॥ १॥ तथा हैनं श्रीरामचन्द्रं मारुतिः पप्रच्छ । केयं वा तत्सिद्धिः सिद्ध्या वा
    किं प्रयोजनमिति । सहोवाच श्रीरामः । पुरुषस्य कर्तृत्वभोक्तृत्व सुखदुःखादिलक्षणश्चित्तधर्मः क्लेशरूपत्वाद्बन्धो
    भवति । तन्निरोधनं जीवन्मुक्तिः । उपाधिविनिर्मुक्त घटाकाशवत्प्रारब्धक्षयाद्विदेहमुक्तिः । जीवन्मुक्तिविदेहमुक्त्योरष्टोत्तरशतोपनिषदः
    प्रमाणम् । कर्तृत्वादिदुःखनिवृत्तिद्वारा नित्यानन्दावाप्तिः प्रयोजनं भवति । तत्पुरुषप्रयत्नसाध्यं
    भवति । यथा पुत्रकामेष्टिना पुत्रं वाणिज्यादिना वित्तं ज्योतिष्टोमेन स्वर्गं तथा पुरुषप्रयत्नसाध्यवेदान्तश्रवणादिजनितसमाधिना
    जीवन्मुक्त्यादिलाभो भवति । सर्ववासनाक्षयात्तल्लाभः । अत्र श्लोका भवन्ति ॥ उच्छास्त्रं शास्त्रितं चेति
    पौरुषं द्विविधं मतम् । अत्रोच्छस्त्रमनर्थाय परमार्थाय शास्त्रितम् ॥ २
