name:
  english: ramakrishnastotram 10
  devanagari: रामकृष्णस्तोत्रम् १०
content:
  english: mohandhakaraih stuto gito ya iha satatam tam bhaje ramakrishnam || iti shriramakrishnastotram
    sampurnam |
  devanagari: मोहान्धकारैः स्तुतो गीतो य इह सततं तं भजे रामकृष्णम् ॥ इति श्रीरामकृष्णस्तोत्रं सम्पूर्णम्
    ।
