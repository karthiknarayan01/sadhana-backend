id: radhaparihara
category: stotram
name:
  english: radhaparihara
  devanagari: राधापरीहार
content:
  english: tvam devi jagatam mata vishnumaya sanatani | krishnapranadhidevi ca krishnapranadhika shubha
    || 1|| krishnapremamayi shaktih krishnasaubhagyarupini | krishnabhaktiprade radhe namaste mangalaprade
    || 2|| adya me saphalam janma jivanam sarthakam mama | pujitasi maya sa ca ya shrikrishnen pujita
    || 3|| krishnavakshasi ya radha sarvasaubhagyasamyuta | rase raseshvarirupa vrinda vrindavane vane
    || 4|| krishnapriya ca goloke tulasi kanane tuya | campavati krishnasamge krida campakakanane || 5||
    candrakli candravane shatashringe satiti ca | virajadarpahantri ca virajatatakanane || 6|| padmavati
    padmavane krishna krishnasarovare | bhadra kunjakutire ca kamya ca kamyake vane || 7|| vaikunthe ca
    mahalakshmirvani narayanorasi | kshirode sindhukanya ca martye lakshmirharipriya || 8|| sarvasvarge
    svargalakshmirdevaduhkhavinashini | sanatani vishnumaya durga shamkaravakshasi || 9|| savitri ve
  devanagari: त्वं देवी जगतां माता विष्णुमाया सनातनी । कृष्णप्राणाधिदेवि च कृष्णप्राणाधिका शुभा ॥ १॥ कृष्णप्रेममयी
    शक्तिः कृष्णसौभाग्यरूपिणी । कृष्णभक्तिप्रदे राधे नमस्ते मङ्गलप्रदे ॥ २॥ अद्य मे सफलं जन्म जीवनं सार्थकं
    मम । पूजितासि मया सा च या श्रीकृष्णेन् पूजिता ॥ ३॥ कृष्णवक्षसि या राधा सर्वसौभाग्यसंयुता । रासे रासेश्वरीरूपा
    वृन्दा वृन्दावने वने ॥ ४॥ कृष्णप्रिया च गोलोके तुलसी कानने तुया । चम्पावती कृष्णसंगे क्रीडा चम्पककानने
    ॥ ५॥ चन्द्राक्ली चन्द्रवने शतश्रिङ्गे सतीति च । विरजादर्पहन्त्रि च विरजातटकानने ॥ ६॥ पद्मावती पद्मवने
    कृष्णा कृष्णसरोवरे । भद्रा कुञ्जकुटीरे च काम्या च काम्यके वने ॥ ७॥ वैकुण्ठे च महालक्ष्मीर्वाणी नारायणोरसि
    । क्षीरोदे सिन्धुकन्या च मर्त्ये लक्ष्मीर्हरिप्रिया ॥ ८॥ सर्वस्वर्गे स्वर्गलक्ष्मीर्देवदुःखविनाशिनी
    । सनातनी विष्णुमाया दुर्गा शंकरवक्षसि ॥ ९॥ सावित्री वे
