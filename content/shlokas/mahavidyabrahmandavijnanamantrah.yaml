id: mahavidyabrahmandavijnanamantrah
category: mantra
name:
  english: mahavidyabrahmandavijnanamantrah
  devanagari: महाविद्याब्रह्माण्डविज्नानमन्त्रः
content:
  english: mahavidyabrahmandavijnanamantrah || viniyogah || asya shrimahavidyabrahmandavijnanamantrasya
    | shriparabrahma rishih | atijagati chandah | shrianekabrahmandasamrajnimahavidya devata | pranavadisarvabijani
    bijam | akaradiksharashaktih shaktih | shrimatrika kilakam | om hrim shrim ityashramah | brahmandavijnanapraptyarthe
    jape viniyogah || || rishyadinyasah || shriparabrahmarishaye namah shirasi | atijagatichandase namah
    mukhe | shrianekabrahmandasamrajnimahavidyadevatayai namah hridi | pranavadisarvabijaya namah guhye
    | akaradiksharashaktaye namah padayoh | shrimatrikakilakaya namah sarvange || || karanyasah || om
    angushthabhyam namah | hrim tarjanibhyam namah | shrim madhyamabhyam namah | ratnadvipadarshite anamikabhyam
    namah | darshaya darshaya kanishthikabhyam namah | hum phat svaha karatalakaraprishthabhyam namah
    || || shadanganyasah || om hrim shrim hridayaya namah | ratnadvipadarshite shirase svaha | darshaya
    darshaya mama shikhayai vashat | anekajanmasancitasarvapapajalam chindhi chindhi kavacaya hum | cetaya
    cetaya atmatattvam netratrayaya vaushat | mantrayantrabrahmandavijnanam darshaya darshaya hum phat
    svaha astraya phat || bhurbhuvahsvaromiti digbandhah || || aksharanyasah || om shirasi | hrim lalate
    | shrim bhrumadhye | rat dakshinanetre | na vamanetre | dvi dakshinakarne | pa vamakarne | dar dakshinanasapute
    | shi vamanasapute | te mukhe | dar kanthe | shaya dakshinaskandhe | dar vamaskandhe | shaya hridaye
    | ma katyam | ma nabhau | a ne guhye | ka ja dakshinorau | janma vamorau | sanci dakshinajanuni |
    ta vamajanuni | sarva dakshinajanghayam | pa vamajanghayam | paja dakshinagulphe | lam vamagulphe
    | chi dakshinapade | ndhi vamapade | chi sarvange | ndhi prishthe | ceta hridayakamale | ya kanthamule
    | ceta bhrumadhye | ya sahasrare | at hridi | ma tat nabhau | ttvam muladhare | mantra hridayat dakshinabahau
    | yantra hridayat vamabahau | brahmanda hridayat dakshinapade | vijnanam hridayat vamapade | dar sarvanadishu
    | shaya sarvacakreshu | dar sarvapraneshu | shaya sarvadehe | hum abhamandale | phat digbandhe | svaha
    sarvatovyapte paramajyotishi || mantrah | om hrim shrim ratnadvipadarshite darshaya darshaya mama
    | anekajanmasancitasarvapapajalam chindhi chindhi | cetaya cetaya atmatattvam | mantrayantrabrahmandavijnanam
    darshaya darshaya | hum phat svaha || iti mahavidyabrahmandavijnanamantrah sampurnah |
  devanagari: महाविद्याब्रह्माण्डविज्ञानमन्त्रः ॥ विनियोगः ॥ अस्य श्रीमहाविद्याब्रह्माण्डविज्ञानमन्त्रस्य
    । श्रीपरब्रह्म ऋषिः । अतिजगती छन्दः । श्रीअनेकब्रह्माण्डसाम्राज्ञीमहाविद्या देवता । प्रणवादिसर्वबीजानि
    बीजम् । अकारादिक्षरशक्तिः शक्तिः । श्रीमातृका कीलकम् । ॐ ह्रीं श्रीं इत्याश्रमः । ब्रह्माण्डविज्ञानप्राप्त्यर्थे
    जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ श्रीपरब्रह्मऋषये नमः शिरसि । अतिजगतीछन्दसे नमः मुखे । श्रीअनेकब्रह्माण्डसाम्राज्ञीमहाविद्यादेवतायै
    नमः हृदि । प्रणवादिसर्वबीजाय नमः गुह्ये । अकारादिक्षरशक्तये नमः पादयोः । श्रीमातृकाकीलकाय नमः सर्वाङ्गे
    ॥ ॥ करन्यासः ॥ ॐ अङ्गुष्ठाभ्यां नमः । ह्रीं तर्जनीभ्यां नमः । श्रीं मध्यमाभ्यां नमः । रत्नद्वीपदर्शिते
    अनामिकाभ्यां नमः । दर्शय दर्शय कनिष्ठिकाभ्यां नमः । हुं फट् स्वाहा करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः
    ॥ ॐ ह्रीं श्रीं हृदयाय नमः । रत्नद्वीपदर्शिते शिरसे स्वाहा । दर्शय दर्शय मम शिखायै वषट् । अनेकजन्मसञ्चितसर्वपापजालं
    छिन्धि छिन्धि कवचाय हुम् । चेतय चेतय आत्मतत्त्वं नेत्रत्रयाय वौषट् । मन्त्रयन्त्रब्रह्माण्डविज्ञानं
    दर्शय दर्शय हुं फट् स्वाहा अस्त्राय फट् ॥ भूर्भुवःस्वरोमिति दिग्बन्धः ॥ ॥ अक्षरन्यासः ॥ ॐ शिरसि ।
    ह्रीं ललाटे । श्रीं भ्रूमध्ये । रत् दक्षिणनेत्रे । न वामनेत्रे । द्वी दक्षिणकर्णे । प वामकर्णे । दर्
    दक्षिणनासापुटे । शि वामनासापुटे । ते मुखे । दर् कण्ठे । शय दक्षिणस्कन्धे । दर् वामस्कन्धे । शय हृदये
    । म कट्याम् । म नाभौ । अ ने गुह्ये । क ज दक्षिणोरौ । जन्म वामोरौ । सञ्चि दक्षिणजानुनि । त वामजानुनि
    । सर्व दक्षिणजङ्घायाम् । पा वामजङ्घायाम् । पजा दक्षिणगुल्फे । लं वामगुल्फे । छि दक्षिणपादे । न्धि
    वामपादे । छि सर्वाङ्गे । न्धि पृष्ठे । चेत हृदयकमले । य कण्ठमूले । चेत भ्रूमध्ये । य सहस्रारे । आत्
    हृदि । म तत् नाभौ । त्त्वं मूलाधारे । मन्त्र हृदयात् दक्षिणबाहौ । यन्त्र हृदयात् वामबाहौ । ब्रह्माण्ड
    हृदयात् दक्षिणपादे । विज्ञानं हृदयात् वामपादे । दर् सर्वनाडीषु । शय सर्वचक्रेषु । दर् सर्वप्राणेषु
    । शय सर्वदेहे । हुं आभामण्डले । फट् दिग्बन्धे । स्वाहा सर्वतोव्याप्ते परमज्योतिषि ॥ मन्त्रः । ॐ ह्रीं
    श्रीं रत्नद्वीपदर्शिते दर्शय दर्शय मम । अनेकजन्मसञ्चितसर्वपापजालं छिन्धि छिन्धि । चेतय चेतय आत्मतत्त्वम्
    । मन्त्रयन्त्रब्रह्माण्डविज्ञानं दर्शय दर्शय । हुं फट् स्वाहा ॥ इति महाविद्याब्रह्माण्डविज्ञानमन्त्रः
    सम्पूर्णः ।
