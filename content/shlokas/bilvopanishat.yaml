id: bilvopanishat
category: upanishad
name:
  english: bilvopanishat
  devanagari: बिल्वोपनिषत्
content:
  english: tam hovaca bhagavan sadashivah || na vaktavyam na vaktavyam na vaktavyam kadacana | matsvarupastvayam
    jneyo bilvavriksho vidhanatah | ekena bilvapatrena santushto'smi mahamune || iti bruvantam parameshvaram
    punah pranamyeti hovaca || bhagavan sarvalokesha satyajnanadilakshana | katham puja prakartavya tam
    vadasva dayanidhe || iti punah pricchantam vamadevamalingyeti hovaca || budvimamstvamiti jnatva vakshyami
    munisattama | mama priyena bilvena tvam kurushva madarcanam || dravyanamuttamairloke mama pujavidhau
    tava | patrapushpakshatairdivyairbilvapatraih samarcaya || bilvapatram vina puja vyartha bhavati sarvada
    | mama rupamiti jneyam sarvarupam tadeva hi || pratah snatva vidhanena sandhyakarma samapya ca bhutirudrakshabharana
    udicim dishamashrayet || sadyojatadibhirmantrairnamaskritya punah punah | pradakshinatrayam kritva
    shivarupamiti sphutam || devim dhyayettatha vrikshe vishnurupam ca sarvada | brahmarupam ca vijneyam
    sarvarupam vibhavayet || vamadakshinamadhyastham brahmavishnushivatmakam | indradayashca yakshanta
    vrintabhage vyavasthitah || prishthabhage'mritam yasmadarcayenmama tushtaye | uttanabilvapatram ca
    yah kuryanmama mastake || mama sayujyamapnoti natra karya vicarana | trimurtistrigunam bailvamagnirupa
    tathaiva ca | brahmarupam kalarupam vedarupam mahamune || puratano'ham purusho'hamisho hiranmayo'ham
    shivarupamasmi | sabilvarupam sagunatmarupam trimurtirupam shivarupamasmi || prishthabhage'mritam
    nyastam devairbrahmadibhih pura | uttanabilvapatrena pujayet sarvasiddhaye || tasmat sarvaprayatnena
    bilvapatraih sadarcaya | bilvapatram vina vastu nasti kincittavanagha || tasmat sarvaprayatnena bilvapatraih
    sadarcaya | uttanapatrapujam ca yah kuryanmama mastake || iha loke'khilam saukhyam prapnotyante pure
    mama | tishthatyeva mahavirah punarjanmavivarjitah || sodakairbilvapatraishca yah kuryanmama pujanam
    | mama sannidhyamapnoti pramathaih saha modate || satyam satyam punah satyamuddhritya bhujamucyate
    | bilvapujanato loke matpujayah para na hi || trisuparnam triricam rupam trisuparnam trayimayam |
    trigunam nijaganmurtitrayam shaktitrayam tridrik || kalatrayam ca savanatrayam lingatrayam tripat
    | tejastrayamakarokaramakarapranavatmakam || deveshu brahmano'ham hi trisuparnamayacitam | mahyam
    vai brahmanayedam maya vijnaptakamikam || dadyadbrahmabhrunavirahatyayashcanyapatakaih | mukto'khandanandabodho
    brahmabhuyaya kalpate || trisuparnopanishadah pathanatpanktipavanah | bodhako hya sahasradvai panktim
    pavayate dhruvam || trisuparnashrutirhyesha nishkritau tridale rata | shraddhatsva vidvannadyam taditi
    vedanushasanam || akhandanandasambodhamayo yasmadaham mune | vinyastamritabhagena suparnenavakunthaya
    || amritam mokshavacantu tenasmadavakunthanat | prapyete bhogamokshau hi sthityante madanugrahat ||
    uttanabhagaparnena murdhni me nyubjamarpayet | mokshe'mritavakuntho'ham bhaveyam tava kamadhuk ||
    yena kena prakarena bilvakenapi mam yaja | tirthadanatapoyogasvadhyaya naiva tatsamah || bilvam vidhanatah
    sthapya vardhayitva ca taddalaih | yah pujayati mam bhaktya so'hameva na samshayah || ya etadadhite
    brahmaha'brahmaha bhavati | svarnasteyyasteyi bhavati | surapayyapayi bhavati | guruvadhugamyagami
    bhavati | mahapatakopapatakebhyah puto bhavati | na ca punaravartate | na ca punaravartate | na ca
    punaravartate | om satyam ||
  devanagari: तं होवाच भगवान् सदाशिवः ॥ न वक्तव्यं न वक्तव्यं न वक्तव्यं कदाचन । मत्स्वरूपस्त्वयं ज्ञेयो
    बिल्ववृक्षो विधानतः । एकेन बिल्वपत्रेण सन्तुष्टोऽस्मि महामुने ॥ इति ब्रुवन्तं परमेश्वरं पुनः प्रणम्येति
    होवाच ॥ भगवन् सर्वलोकेश सत्यज्ञानादिलक्षण । कथं पूजा प्रकर्तव्या तां वदस्व दयानिधे ॥ इति पुनः पृच्छन्तं
    वामदेवमालिङ्ग्येति होवाच ॥ बुद्विमांस्त्वमिति ज्ञात्वा वक्ष्यामि मुनिसत्तम । मम प्रियेण बिल्वेन त्वं
    कुरुष्व मदर्चनम् ॥ द्रव्याणामुत्तमैर्लोके मम पूजाविधौ तव । पत्रपुष्पाक्षतैर्दिव्यैर्बिल्वपत्रैः समर्चय
    ॥ बिल्वपत्रं विना पूजा व्यर्था भवति सर्वदा । मम रूपमिति ज्ञेयं सर्वरूपं तदेव हि ॥ प्रातः स्नात्वा
    विधानेन सन्ध्याकर्म समाप्य च भूतिरुद्राक्षभरण उदीचीं दिशमाश्रयेत् ॥ सद्योजातादिभिर्मन्त्रैर्नमस्कृत्य
    पुनः पुनः । प्रदक्षिणत्रयं कृत्वा शिवरूपमिति स्फुटम् ॥ देवीं ध्यायेत्तथा वृक्षे विष्णुरूपं च सर्वदा
    । ब्रह्मरूपं च विज्ञेयं सर्वरूपं विभावयेत् ॥ वामदक्षिणमध्यस्थं ब्रह्मविष्णुशिवात्मकम् । इन्द्रादयश्च
    यक्षान्ता वृन्तभागे व्यवस्थिताः ॥ पृष्ठभागेऽमृतं यस्मादर्चयेन्मम तुष्टये । उत्तानबिल्वपत्रं च यः कुर्यान्मम
    मस्तके ॥ मम सायुज्यमाप्नोति नात्र कार्या विचारणा । त्रिमूर्तिस्त्रिगुणं बैल्वमग्निरूप तथैव च । ब्रह्मरूपं
    कलारूपं वेदरूपं महामुने ॥ पुरातनोऽहं पुरुषोऽहमीशो हिरण्मयोऽहं शिवरूपमस्मि । सबिल्वरूपं सगुणात्मरूपं
    त्रिमूर्तिरूपं शिवरूपमस्मि ॥ पृष्ठभागेऽमृतं न्यस्तं देवैर्ब्रह्मादिभिः पुरा । उत्तानबिल्वपत्रेण पूजयेत्
    सर्वसिद्धये ॥ तस्मात् सर्वप्रयत्नेन बिल्वपत्रैः सदार्चय । बिल्वपत्रं विना वस्तु नास्ति किञ्चित्तवानघ
    ॥ तस्मात् सर्वप्रयत्नेन बिल्वपत्रैः सदार्चय । उत्तानपत्रपूजां च यः कुर्यान्मम मस्तके ॥ इह लोकेऽखिलं
    सौख्यं प्राप्नोत्यन्ते पुरे मम । तिष्ठत्येव महावीरः पुनर्जन्मविवर्जितः ॥ सोदकैर्बिल्वपत्रैश्च यः कुर्यान्मम
    पूजनम् । मम सान्निध्यमाप्नोति प्रमथैः सह मोदते ॥ सत्यं सत्यं पुनः सत्यमुद्धृत्य भुजमुच्यते । बिल्वपूजनतो
    लोके मत्पूजायाः परा न हि ॥ त्रिसुपर्णं त्रिऋचां रूपं त्रिसुपर्णं त्रयीमयम् । त्रिगुणं निजगन्मूर्तित्रयं
    शक्तित्रयं त्रिदृक् ॥ कालत्रयं च सवनत्रयं लिङ्गत्रयं त्रिपात् । तेजस्त्रयमकारोकारमकारप्रणवात्मकम्
    ॥ देवेषु ब्राह्मणोऽहं हि त्रिसुपर्णमयाचितम् । मह्यं वै ब्राह्मणायेदं मया विज्ञप्तकामिकम् ॥ दद्याद्ब्रह्मभ्रूणवीरहत्यायाश्चान्यपातकैः
    । मुक्तोऽखण्डानन्दबोधो ब्रह्मभूयाय कल्पते ॥ त्रिसुपर्णोपनिषदः पठनात्पङ्क्तिपावनः । बोधको ह्या सहस्राद्वै
    पङ्क्तिं पावयते ध्रुवम् ॥ त्रिसुपर्णश्रुतिर्ह्येषा निष्कृतौ त्रिदले रता । श्रद्धत्स्व विद्वन्नाद्यं
    तदिति वेदानुशासनम् ॥ अखण्डानन्दसम्बोधमयो यस्मादहं मुने । विन्यस्तामृतभागेन सुपर्णेनावकुण्ठय ॥ अमृतं
    मोक्षवाचन्तु तेनास्मदवकुण्ठनात् । प्राप्येते भोगमोक्षौ हि स्थित्यन्ते मदनुग्रहात् ॥ उत्तानभागपर्णेन
    मूर्ध्नि मे न्युब्जमर्पयेत् । मोक्षेऽमृतावकुण्ठोऽहं भवेयं तव कामधुक् ॥ येन केन प्रकारेण बिल्वकेनापि
    मां यज । तीर्थदानतपोयोगस्वाध्याया नैव तत्समाः ॥ बिल्वं विधानतः स्थाप्य वर्धयित्वा च तद्दलैः । यः पूजयति
    मां भक्त्या सोऽहमेव न संशयः ॥ य एतदधीते ब्रह्महाऽब्रह्महा भवति । स्वर्णस्तेय्यस्तेयी भवति । सुरापाय्यपायी
    भवति । गुरुवधूगाम्यगामी भवति । महापातकोपपातकेभ्यः पूतो भवति । न च पुनरावर्तते । न च पुनरावर्तते ।
    न च पुनरावर्तते । ॐ सत्यम् ॥
