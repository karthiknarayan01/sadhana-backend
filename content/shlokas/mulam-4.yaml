id: mulam-4
category: raksha
name:
  english: mulam
  devanagari: मूलम्
content:
  english: shriramarakshastotram || om shriganeshaya namah || asya shriramarakshastotramantrasya | budhakaushika
    rishih | shrisitaramacandro devata | anushtup chandah | sita shaktih | shrimad hanumana kilakam |
    shriramacandraprityarthe ramarakshastotrajape viniyogah || atha dhyanam | dhyayedajanubahum dhritasharadhanusham
    baddhapadmasanastham pitam vaso vasanam navakamaladalaspardhinetram prasannam | vamankarudha sitamukhakamalamilallocanam
    niradabham nanalankaradiptam dadhatamurujatamandanam ramacandram || iti dhyanam || caritam raghunathasya
    shatakoti pravistaram | ekaikamaksharam pumsam mahapatakanashanam || 1|| dhyatva nilotpalashyamam
    ramam rajivalocanam | janakilakshmanopetam jatamukutamanditam || 2|| sasitunadhanurbanapanim naktancarantakam
    | svalilaya jagattratumavirbhutamajam vibhum || 3|| ramaraksham pathetprajnah papaghnim sarvakamadam
    | shiro me raghavah patu bhalam dasharathatmajah || 4|| kausalyeyo drishau patu vishvamitrapriyah
    shruti | ghranam patu makhatrata mukham saumitrivatsalah || 5|| jihvam vidyanidhih patu kantham bharatavanditah
    | skandhau divyayudhah patu bhujau bhagneshakarmukah || 6|| karau sitapatih patu hridayam jamadagnyajit
    | madhyam patu kharadhvamsi nabhim jambavadashrayah || 7|| sugriveshah kati patu sakthini hanumatprabhuh
    | uru raghuttamah patu rakshahkulavinashakrit || 8|| januni setukritpatu janghe dashamukhantakah |
    padau bibhishanashridah patu ramo'khilam vapuh || 9|| etam ramabalopetam raksham yah sukriti pathet
    | sa cirayuh sukhi putri vijayi vinayi bhavet || 10|| patalabhutalavyomacarinashchadmacarinah | na
    drashtumapi shaktaste rakshitam ramanamabhih || 11|| rameti ramabhadreti ramacandreti va smaran |
    naro na lipyate papaih bhuktim muktim ca vindati || 12|| jagajjaitraikamantrena ramanamnabhirakshitam
    | yah kanthe dharayettasya karasthah sarvasiddhayah || 13|| vajrapanjaranamedam yo ramakavacam smaret
    | avyahatajnah sarvatra labhate jayamangalam || 14|| adishtavan yatha svapne ramarakshamimam harah
    | tatha likhitavan pratah prabuddho budhakaushikah || 15|| aramah kalpavrikshanam viramah sakalapadam
    | abhiramastrilokanam ramah shriman sa nah prabhuh || 16|| tarunau rupasampannau sukumarau mahabalau
    | pundarikavishalakshau cirakrishnajinambarau || 17|| phalamulashinau dantau tapasau brahmacarinau
    | putrau dasharathasyaitau bhratarau ramalakshmanau || 18|| sharanyau sarvasattvanam shreshthau sarvadhanushmatam
    | rakshah kulanihantarau trayetam no raghuttamau || 19|| attasajjadhanushavishusprishavakshayashuganishangasanginau
    | rakshanaya mama ramalakshmanavagratah pathi sadaiva gacchatam || 20|| sannaddhah kavaci khadgi capabanadharo
    yuva | gacchanmanoratho'smakam ramah patu salakshmanah || 21|| ramo dasharathih shuro lakshmananucaro
    bali | kakutsthah purushah purnah kausalyeyo raghuttamah || 22|| vedantavedyo yajneshah puranapurushottamah
    | janakivallabhah shriman aprameya parakramah || 23|| ityetani japannityam madbhaktah shraddhayanvitah
    | ashvamedhadhikam punyam samprapnoti na samshayah || 24|| ramam durvadalashyamam padmaksham pitavasasam
    | stuvanti namabhirdivyaih na te samsarino narah || 25|| ramam lakshmanapurvajam raghuvaram sitapatim
    sundaram | kakutstham karunarnavam gunanidhim viprapriyam dharmikam | rajendram satyasandham dasharathatanayam
    shyamalam shantamurtim | vande lokabhiramam raghukulatilakam raghavam ravanarim || 26|| ramaya ramabhadraya
    ramacandraya vedhase | raghunathaya nathaya sitayah pataye namah || 27|| shrirama rama raghunandana
    rama rama shrirama rama bharatagraja rama rama | shrirama rama ranakarkasha rama rama shrirama rama
    sharanam bhava rama rama || 28|| shriramacandracaranau manasa smarami shriramacandracaranau vacasa
    grinami | shriramacandracaranau shirasa namami shriramacandracaranau sharanam prapadye || 29|| mata
    ramo matpita ramacandrah svami ramo matsakha ramacandrah | sarvasvam me ramacandro dayalu
  devanagari: श्रीरामरक्षास्तोत्रम् ॥ ॐ श्रीगणेशाय नमः ॥ अस्य श्रीरामरक्षास्तोत्रमन्त्रस्य । बुधकौशिक
    ऋषिः । श्रीसीतारामचन्द्रो देवता । अनुष्टुप् छन्दः । सीता शक्तिः । श्रीमद् हनुमान कीलकम् । श्रीरामचन्द्रप्रीत्यर्थे
    रामरक्षास्तोत्रजपे विनियोगः ॥ अथ ध्यानम् । ध्यायेदाजानुबाहुं धृतशरधनुषं बद्धपद्मासनस्थं पीतं वासो
    वसानं नवकमलदलस्पर्धिनेत्रं प्रसन्नम् । वामाङ्कारूढ सीतामुखकमलमिलल्लोचनं नीरदाभं नानालङ्कारदीप्तं दधतमुरुजटामण्डनं
    रामचन्द्रम् ॥ इति ध्यानम् ॥ चरितं रघुनाथस्य शतकोटि प्रविस्तरम् । एकैकमक्षरं पुंसां महापातकनाशनम् ॥
    १॥ ध्यात्वा नीलोत्पलश्यामं रामं राजीवलोचनम् । जानकीलक्ष्मणोपेतं जटामुकुटमण्डितम् ॥ २॥ सासितूणधनुर्बाणपाणिं
    नक्तञ्चरान्तकम् । स्वलीलया जगत्त्रातुमाविर्भूतमजं विभुम् ॥ ३॥ रामरक्षां पठेत्प्राज्ञः पापघ्नीं सर्वकामदाम्
    । शिरो मे राघवः पातु भालं दशरथात्मजः ॥ ४॥ कौसल्येयो दृशौ पातु विश्वामित्रप्रियः श्रुती । घ्राणं पातु
    मखत्राता मुखं सौमित्रिवत्सलः ॥ ५॥ जिह्वां विद्यानिधिः पातु कण्ठं भरतवन्दितः । स्कन्धौ दिव्यायुधः पातु
    भुजौ भग्नेशकार्मुकः ॥ ६॥ करौ सीतापतिः पातु हृदयं जामदग्न्यजित् । मध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः
    ॥ ७॥ सुग्रीवेशः कटी पातु सक्थिनी हनुमत्प्रभुः । ऊरू रघूत्तमः पातु रक्षःकुलविनाशकृत् ॥ ८॥ जानुनी सेतुकृत्पातु
    जङ्घे दशमुखान्तकः । पादौ बिभीषणश्रीदः पातु रामोऽखिलं वपुः ॥ ९॥ एतां रामबलोपेतां रक्षां यः सुकृती पठेत्
    । स चिरायुः सुखी पुत्री विजयी विनयी भवेत् ॥ १०॥ पातालभूतलव्योमचारिणश्छद्मचारिणः । न द्रष्टुमपि शक्तास्ते
    रक्षितं रामनामभिः ॥ ११॥ रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् । नरो न लिप्यते पापैः भुक्तिं मुक्तिं
    च विन्दति ॥ १२॥ जगज्जैत्रैकमन्त्रेण रामनाम्नाभिरक्षितम् । यः कण्ठे धारयेत्तस्य करस्थाः सर्वसिद्धयः
    ॥ १३॥ वज्रपञ्जरनामेदं यो रामकवचं स्मरेत् । अव्याहताज्ञः सर्वत्र लभते जयमङ्गलम् ॥ १४॥ आदिष्टवान् यथा
    स्वप्ने रामरक्षामिमां हरः । तथा लिखितवान् प्रातः प्रबुद्धो बुधकौशिकः ॥ १५॥ आरामः कल्पवृक्षाणां विरामः
    सकलापदाम् । अभिरामस्त्रिलोकानां रामः श्रीमान् स नः प्रभुः ॥ १६॥ तरुणौ रूपसम्पन्नौ सुकुमारौ महाबलौ
    । पुण्डरीकविशालाक्षौ चीरकृष्णाजिनाम्बरौ ॥ १७॥ फलमूलाशिनौ दान्तौ तापसौ ब्रह्मचारिणौ । पुत्रौ दशरथस्यैतौ
    भ्रातरौ रामलक्ष्मणौ ॥ १८॥ शरण्यौ सर्वसत्त्वानां श्रेष्ठौ सर्वधनुष्मताम् । रक्षः कुलनिहन्तारौ त्रायेतां
    नो रघूत्तमौ ॥ १९॥ आत्तसज्जधनुषाविषुस्पृशावक्षयाशुगनिषङ्गसङ्गिनौ । रक्षणाय मम रामलक्ष्मणावग्रतः पथि
    सदैव गच्छताम् ॥ २०॥ सन्नद्धः कवची खड्गी चापबाणधरो युवा । गच्छन्मनोरथोऽस्माकं रामः पातु सलक्ष्मणः ॥
    २१॥ रामो दाशरथिः शूरो लक्ष्मणानुचरो बली । काकुत्स्थः पुरुषः पूर्णः कौसल्येयो रघूत्तमः ॥ २२॥ वेदान्तवेद्यो
    यज्ञेशः पुराणपुरुषोत्तमः । जानकीवल्लभः श्रीमान् अप्रमेय पराक्रमः ॥ २३॥ इत्येतानि जपन्नित्यं मद्भक्तः
    श्रद्धयान्वितः । अश्वमेधाधिकं पुण्यं सम्प्राप्नोति न संशयः ॥ २४॥ रामं दूर्वादलश्यामं पद्माक्षं पीतवाससम्
    । स्तुवन्ति नामभिर्दिव्यैः न ते संसारिणो नराः ॥ २५॥ रामं लक्ष्मणपूर्वजं रघुवरं सीतापतिं सुन्दरम् ।
    काकुत्स्थं करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम् । राजेन्द्रं सत्यसन्धं दशरथतनयं श्यामलं शान्तमूर्तिम्
    । वन्दे लोकाभिरामं रघुकुलतिलकं राघवं रावणारिम् ॥ २६॥ रामाय रामभद्राय रामचन्द्राय वेधसे । रघुनाथाय
    नाथाय सीतायाः पतये नमः ॥ २७॥ श्रीराम राम रघुनन्दन राम राम श्रीराम राम भरताग्रज राम राम । श्रीराम राम
    रणकर्कश राम राम श्रीराम राम शरणं भव राम राम ॥ २८॥ श्रीरामचन्द्रचरणौ मनसा स्मरामि श्रीरामचन्द्रचरणौ
    वचसा गृणामि । श्रीरामचन्द्रचरणौ शिरसा नमामि श्रीरामचन्द्रचरणौ शरणं प्रपद्ये ॥ २९॥ माता रामो मत्पिता
    रामचन्द्रः स्वामी रामो मत्सखा रामचन्द्रः । सर्वस्वं मे रामचन्द्रो दयालु
