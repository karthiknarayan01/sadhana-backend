id: stutikusumanjalih
category: stotram
name:
  english: stutikusumanjalih
  devanagari: स्तुतिकुसुमान्जलिः
content:
  english: prabhuprasadanam trayodasham stotram atha nutibhiramantharaksharabhih sujanamanomrigavagurabhirabhih
    | vibhumabhayadamadaradaratikshapanapanapravanam prasadayamah || 1|| suramukutavitankaratnarocihkhacitanakhankurakesarabhiramam
    | puraharacaranaravindayugmam shirasi vidhatta kiritavancchaya kim || 2|| kalayatu bhavatamabhagnavrittirharaharashankarashankareti
    suktih | aviralagalamandanapratishtham kimamalamauktikadamakamanabhih || 3|| kalayata manikundale'valepam
    shlathayata nirmmalamallikabhilasham | haracaritanutikramairajasram kuruta navashravanavatamsalilam
    || 4|| iha vihatabhavopatapamapatprashamasamarthamanarthanashahetum | namati na matimanamanaviyapramadavidhanaparam
    param haram kah || 5|| trijagati bhajati sthitim budhanam dhuri duritakshatishikshitah sa ekah | shashishakalashikhamanipranamapranayi
    bibharti shirashcirasthiram yah || 6|| sa jayati jagadishashaktipatastava kavituryadasaktamuktidevi
    | rasamasamacamatkritiprasutim vitarati kancanasiddhimeti yena || 7|| iha vidadhatu nama pamaranam
    pranatikritamapare prabhupratitim | prabhavati na tu mrityubhitibhange jagati bhavantamrite'mritesha
    kashcit || 8|| viyadiyati mahasvimandale kah shritavati kartumanashtaceshtamishte | vishamatamatamah
    prabandhamandham jagadagadam ghrinimantamantarena || 9|| shakalitakalitarsha saprakarsha prakatitaharsha
    maharshabhadhirudha | disha vishadamadabhramabhrasindhudravadhavalam bhavalanghanam prasadam || 10||
    prabhavati bhavati prasadaramyam dishati drisham na vibha vibhavarinam | savitari vitarishyati prakasham
    nahi mahimaprabhavo vibhavarinam || 11|| samucitasadasadvicaracaryacaturatarah katarah kalau madanyah
    | iha paramashivam bhavam vijetum paramashivam bhavameva sevate yah || 12|| shamayitumalamagnimagnireva
    glayapati hanta himam himam vivriddham | jarayati ca payah payah kimanyaddharati bhavam bhava eva
    bhaktibhajam || 13|| varamajinajatabhritah kapalapranayikarasya narasya bhaikshyavrittih | smaraharacaranaravindasevavirahavati
    na tu cakravartimurtih || 14|| marubhuvi varamushnarashmirashmiprakarakadarthitamurtirekabhekah |
    na tu bhavadanuragabhagadheyaglapanavipadvikalikrito manushyah || 15|| kalimalapatali malimasatvam
    nayati matim hatadarpa darpanabham | iti shitigala shitarashmiprasarasitam rasitam tava'rthayamah
    || 16|| nutimukharamukhah prasadapatram bhavati mameti yadaisha te kritantah | api kavalitasaptalokalokah
    prabhavati naiva tadaisha me kritantah || 17|| tava ravijapurandhakapramathe drishi vishikhe trishikhe
    ca yah kritasthah | paricaranaparah puravirasit sa jayati daivatamuttamam krishanuh || 18|| samajani
    janitasprihah sa ekastrijagati candrakirita krishnasarah | upakaranapadam jagama krittistava caranastaranakramena
    yasya || 19|| janirapi jayati vinitaritirjagati bhujangamapungavasya tasya | manikatakamudasya yasya
    shasyam bhava bhavadangadabhangimeti bhogah || 20|| alabhata bhagavannabandhyamekastribhuvanasimani
    janma pungavendrah | tava bhava shavabhasmarushitom'ghrih shirasi dhrito vinayanatena yena || 21||
    janayati jagati spriham na kesham janirapi kunjarashekharasya tasya | tribhuvanamahitasya yasya krittirbhava
    bhavadambaradambaram bibharti || 22|| sa jayati jitakala kalakutah svajanipavitritamugdhadugdhasindhuh
    | tava kavalabhuvam javadavaptah kalayati yahshitikantha kanthapitham || 23|| parinatasharadindusundarabham
    vadanamanabhranabhonibhashca kanthah | iti shubhamubhayam vibhorabhinnatridashadhuniyamunavidambi
    vando || 24|| himahimakarahari vari gangam kuvalayakantikalindakanyakambhah | iti shubhamubhayam prabhuprasadadvapuriva
    hariharam varam prapadye || 25|| dhritakutilakalah kilandhakari rucitamalimasabhogibhogayogah | tvayi
    sapadi paranmukhe yatha'ham tvamiva mahakalikalabhagnashaktih || 26|| kavalitavishamaklamam dadhanah
    satatasamashritatarakarirupam | dvijapatimukutastathaiva jatu tvamiva shiva tvayi sammukhe bhaveyam
    || 27|| jaya jayada vaco vimunca muncanmadhu madhuram janaranjanapragalbham | hara hara duritam mama'dya
    madyadbhava bhava bhimadabhimadarshanastvam || 28|| nijavrijinavijrimbhitam mamaitattrijagadanugrahanityadikshitastvam
    | kvacidapi bhagavannadrishtapurvam prathayasi yanmayi vihvale'valepam || 29|| pranamati vidhure puro'valagne
    dadhati mayi prasabham gadabhiyogam | kimiti parijane dayamritardram drishamapakaravativa no dadhasi
    || 30|| sphutavikatavikasvarapradiptajvalanamahinamahindrahara cakshuh | balavadalavadarpakalakamakshayakaramakaramashu
    munca siddheh || 31|| himakaramakaradhvajau na rupam kavidhishanau dhishanaucitim na tivram | ranamarunamarutsakhau
    jigishoranuharato haratoshino na tejah || 32|| ravikaravikasatsitabjashubhraprasrimaracamaracaruhasini
    shrih | bhava na bhavanamujjhati kshanam yatsukritavatam tava tam pranaumi shaktim
  devanagari: प्रभुप्रसादनं त्रयोदशं स्तोत्रम् अथ नुतिभिरमन्थराक्षराभिः सुजनमनोमृगवागुराभिराभिः । विभुमभयदमादरादरातिक्षपणपणप्रवणं
    प्रसादयामः ॥ १॥ सुरमुकुटविटङ्करत्नरोचिःखचितनखाङ्कुरकेसराभिरामम् । पुरहरचरणारविन्दयुग्मं शिरसि विधत्त
    किरीटवाञ्च्छया किम् ॥ २॥ कलयतु भवतामभग्नवृत्तिर्हरहरशङ्करशङ्करेति सूक्तिः । अविरलगलमण्डनप्रतिष्ठां
    किममलमौक्तिकदामकामनाभिः ॥ ३॥ कलयत मणिकुण्डलेऽवलेपं श्लथयत निर्म्मलमल्लिकाभिलाषम् । हरचरितनुतिक्रमैरजस्रं
    कुरुत नवश्रवणावतंसलीलाम् ॥ ४॥ इह विहतभवोपतापमापत्प्रशमसमर्थमनर्थनाशहेतुम् । नमति न मतिमानमानवीयप्रमदविधानपरं
    परं हरं कः ॥ ५॥ त्रिजगति भजति स्थितिं बुधानां धुरि दुरितक्षतिशिक्षितः स एकः । शशिशकलशिखामणिप्रणामप्रणयि
    बिभर्ती शिरश्चिरस्थिरं यः ॥ ६॥ स जयति जगदीशशक्तिपातस्तव कवितुर्यदसक्तमुक्तिदेवी । रसमसमचमत्कृतिप्रसूतिं
    वितरति काञ्चनसिद्धिमेति येन ॥ ७॥ इह विदधतु नाम पामराणां प्रणतिकृतामपरे प्रभुप्रतीतिम् । प्रभवति न
    तु मृत्युभीतिभङ्गे जगति भवन्तमृतेऽमृतेश कश्चित् ॥ ८॥ वियदियति महस्विमण्डले कः श्रितवति कर्तुमनष्टचेष्टमीष्टे
    । विषमतमतमः प्रबन्धमन्धं जगदगदं घृणिमन्तमन्तरेण ॥ ९॥ शकलितकलितर्ष सप्रकर्ष प्रकटितहर्ष महर्षभाधिरूढ
    । दिश विशदमदभ्रमभ्रसिन्धुद्रवधवलं भवलङ्घनं प्रसादम् ॥ १०॥ प्रभवति भवति प्रसादरम्यां दिशति दृशं न विभा
    विभावरीणाम् । सवितरि वितरिष्यति प्रकाशं नहि महिमप्रभवो विभावरीणाम् ॥ ११॥ समुचितसदसद्विचारचर्याचतुरतरः
    कतरः कलौ मदन्यः । इह परमशिवं भवं विजेतुं परमशिवं भवमेव सेवते यः ॥ १२॥ शमयितुमलमग्निमग्निरेव ग्लयपति
    हन्त हिमं हिमं विवृद्धम् । जरयति च पयः पयः किमन्यद्धरति भवं भव एव भक्तिभाजाम् ॥ १३॥ वरमजिनजटाभृतः
    कपालप्रणयिकरस्य नरस्य भैक्ष्यवृत्तिः । स्मरहरचरणारविन्दसेवाविरहवती न तु चक्रवर्तिमूर्तिः ॥ १४॥ मरुभुवि
    वरमुष्णरश्मिरश्मिप्रकरकदर्थितमूर्तिरेकभेकः । न तु भवदनुरागभागधेयग्लपनविपद्विकलीकृतो मनुष्यः ॥ १५॥
    कलिमलपटली मलीमसत्वं नयति मतिं हतदर्प दर्पणाभाम् । इति शितिगल शीतरश्मिप्रसरसितं रसितं तवाऽर्थयामः ॥
    १६॥ नुतिमुखरमुखः प्रसादपात्रं भवति ममेति यदैष ते कृतान्तः । अपि कवलितसप्तलोकलोकः प्रभवति नैव तदैष
    मे कृतान्तः ॥ १७॥ तव रविजपुरान्धकप्रमाथे दृशि विशिखे त्रिशिखे च यः कृतास्थः । परिचरणपरः पुराविरासीत्
    स जयति दैवतमुत्तमं कृशानुः ॥ १८॥ समजनि जनितस्पृहः स एकस्त्रिजगति चन्द्रकिरीट कृष्णसारः । उपकरणपदं
    जगाम कृत्तिस्तव चरणास्तरणक्रमेण यस्य ॥ १९॥ जनिरपि जयति विनीतरीतिर्जगति भुजङ्गमपुङ्गवस्य तस्य । मणिकटकमुदस्य
    यस्य शस्यं भव भवदङ्गदभङ्गिमेति भोगः ॥ २०॥ अलभत भगवन्नबन्ध्यमेकस्त्रिभुवनसीमनि जन्म पुङ्गवेन्द्रः ।
    तव भव शवभस्मरूषितोंऽघ्रिः शिरसि धृतो विनयानतेन येन ॥ २१॥ जनयति जगति स्पृहां न केषां जनिरपि कुञ्जरशेखरस्य
    तस्य । त्रिभुवनमहितस्य यस्य कृत्तिर्भव भवदम्बरडम्बरं बिभर्ति ॥ २२॥ स जयति जितकाल कालकूटः स्वजनिपवित्रितमुग्धदुग्धसिन्धुः
    । तव कवलभुवं जवादवाप्तः कलयति यःशितिकण्ठ कण्ठपीठम् ॥ २३॥ परिणतशरदिन्दुसुन्दराभं वदनमनभ्रनभोनिभश्च
    कण्ठः । इति शुभमुभयं विभोरभिन्नत्रिदशधुनीयमुनाविडम्बि वन्दो ॥ २४॥ हिमहिमकरहारि वारि गाङ्गं कुवलयकान्तिकलिन्दकन्यकाम्भः
    । इति शुभमुभयं प्रभुप्रसादाद्वपुरिव हारिहरं वरं प्रपद्ये ॥ २५॥ धृतकुटिलकलः किलान्धकारी रुचितमलीमसभोगिभोगयोगः
    । त्वयि सपदि पराङ्मुखे यथाऽहं त्वमिव महाकलिकालभग्नशक्तिः ॥ २६॥ कवलितविषमक्लमं दधानः सततसमाश्रिततारकारिरूपम्
    । द्विजपतिमुकुटस्तथैव जातु त्वमिव शिव त्वयि सम्मुखे भवेयम् ॥ २७॥ जय जयद वचो विमुञ्च मुञ्चन्मधु मधुरं
    जनरञ्जनप्रगल्भम् । हर हर दुरितं ममाऽद्य माद्यद्भव भव भीमदभीमदर्शनस्त्वम् ॥ २८॥ निजवृजिनविजृम्भितं
    ममैतत्त्रिजगदनुग्रहनित्यदीक्षितस्त्वम् । क्वचिदपि भगवन्नदृष्टपूर्वं प्रथयसि यन्मयि विह्वलेऽवलेपम्
    ॥ २९॥ प्रणमति विधुरे पुरोऽवलग्ने दधति मयि प्रसभं गदाभियोगम् । किमिति परिजने दयामृतार्द्रां दृशमपकारवतीव
    नो दधासि ॥ ३०॥ स्फुटविकटविकस्वरप्रदीप्तज्वलनमहीनमहीन्द्रहार चक्षुः । बलवदलवदर्पकालकामक्षयकरमाकरमाशु
    मुञ्च सिद्धेः ॥ ३१॥ हिमकरमकरध्वजौ न रूपं कविधिषणौ धिषणौचितीं न तीव्राम् । रणमरुणमरुत्सखौ जिगीषोरनुहरतो
    हरतोषिणो न तेजः ॥ ३२॥ रविकरविकसत्सिताब्जशुभ्रप्रसृमरचामरचारुहासिनी श्रीः । भव न भवनमुज्झति क्षणं यत्सुकृतवतां
    तव तां प्रणौमि शक्तिम्
