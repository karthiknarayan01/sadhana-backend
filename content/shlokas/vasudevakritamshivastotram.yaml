id: vasudevakritamshivastotram
category: stotram
name:
  english: vasudevakritamshivastotram
  devanagari: वासुदेवकृतंशिवस्तोत्रम्
content:
  english: vasudevakritam shivastotram vasudeva uvaca | yudhishthira mahabaho mahabhagyam mahatmanah |
    rudraya bahurupaya bahunamne nibodha me || 1|| vadantyagnim mahadevam tatha sthanum maheshvaram |
    ekaksham tryambakam caiva vishvarupam shivam tatha || 2|| dve tanu tasya devasya vedajna brahmana
    viduh | ghoramanyam shivamanyam te tanu bahudha punah || 3|| ugra ghora tanurya'sya so'gnirvidyutsa
    bhaskarah | shiva saumya ca ya tasya dharmastvapo'tha candramah || 4|| atmano'rdham tu tasyagnirucyate
    bharatarshabha | brahmacaryam caratyesha shiva yasya tanustatha || 5|| yasya ghoratama murtirjagatsamharate
    taya | ishvaratvanmahattvacca maheshvara iti smritah || 6|| yannirdahati yattikshno yadugro yatpratapavan
    | mamsashonitamajjado yattato rudra ucyate || 7|| devanam sumahanyacca yaccasya vishayo mahan | yacca
    vishvam mahatpati mahadevastatah smritah || 8|| samedhayati yannityam sarvarthansarvakarmabhih | shivamicchanmanushyanam
    tasmadesha shivah smritah || 9|| dahatyurdhvam sthito yacca pranotpattih sthitishca yat | sthiralingashca
    yannityam tasmatsthanuriti smritah || 10|| yadasya bahudha rupam bhutam bhavyam bhavattatha | sthavaram
    jangamam caiva bahurupastatah smritah || 11|| dhumram rupam ca yattasya dhurjatityata ucyate | vishve
    devashca yattasminvishvarupastatah smritah || 12|| sahasraksho'yutaksho va sarvato'kshimayo'pi va
    | cakshushah prabhavastejo nastyanto'thasya cakshusham || 13|| sarvatha yatpashunpati taishca yadramate
    punah | teshamadhipatiryacca tasmatpashupatih smritah || 14|| nityena brahmacaryena lingamasya yada
    sthitam | mahayantyasya lokashca maheshvara iti smritah || 15|| vigraham pujayedyo vai lingam vapi
    mahatmanah | lingam pujayita nityam mahatim shriyamashnute || 16|| rishayashcapi devashca gandharvapsarasastatha
    | lingamevarcayanti sma yattadurdhvam samasthitam || 17|| pujyamane tatastasminmodate sa maheshvarah
    | sukham dadati pritatma bhaktanam bhaktavatsalah || 18|| esha eva shmashaneshu devo vasati nityashah
    | yajante tam janastatra virasthananishevinam || 19|| iti mahabharate anushasanaparvani 146 adhyayantargatam
    vasudevakritam shivastotram sampurnam | mahabharata | anuparva | adhyaya 146
  devanagari: वासुदेवकृतं शिवस्तोत्रम् वासुदेव उवाच । युधिष्ठिर महाबाहो महाभाग्यं महात्मनः । रुद्राय बहुरूपाय
    बहुनाम्ने निबोध मे ॥ १॥ वदन्त्यग्निं महादेवं तथा स्थाणुं महेश्वरम् । एकाक्षं त्र्यम्बकं चैव विश्वरूपं
    शिवं तथा ॥ २॥ द्वे तनू तस्य देवस्य वेदज्ञा ब्राह्मणा विदुः । घोरामन्यां शिवामन्यां ते तनू बहुधा पुनः
    ॥ ३॥ उग्रा घोरा तनुर्याऽस्य सोऽग्निर्विद्युत्स भास्करः । शिवा सौम्या च या तस्य धर्मस्त्वापोऽथ चन्द्रमाः
    ॥ ४॥ आत्मनोऽर्धं तु तस्याग्निरुच्यते भरतर्षभ । ब्रह्मचर्यं चरत्येष शिवा यास्य तनुस्तथा ॥ ५॥ यास्य
    घोरतमा मूर्तिर्जगत्संहरते तया । ईश्वरत्वान्महत्त्वाच्च महेश्वर इति स्मृतः ॥ ६॥ यन्निर्दहति यत्तीक्ष्णो
    यदुग्रो यत्प्रतापवान् । मांसशोणितमज्जादो यत्ततो रुद्र उच्यते ॥ ७॥ देवानां सुमहान्यच्च यच्चास्य विषयो
    महान् । यच्च विश्वं महत्पाति महादेवस्ततः स्मृतः ॥ ८॥ समेधयति यन्नित्यं सर्वार्थान्सर्वकर्मभिः । शिवमिच्छन्मनुष्याणां
    तस्मादेष शिवः स्मृतः ॥ ९॥ दहत्यूर्ध्वं स्थितो यच्च प्राणोत्पत्तिः स्थितिश्च यत् । स्थिरलिङ्गश्च यन्नित्यं
    तस्मात्स्थाणुरिति स्मृतः ॥ १०॥ यदस्य बहुधा रूपं भूतं भव्यं भवत्तथा । स्थावरं जङ्गमं चैव बहुरूपस्ततः
    स्मृतः ॥ ११॥ धूम्रं रूपं च यत्तस्य धूर्जटीत्यत उच्यते । विश्वे देवाश्च यत्तस्मिन्विश्वरूपस्ततः स्मृतः
    ॥ १२॥ सहस्राक्षोऽयुताक्षो वा सर्वतोऽक्षिमयोऽपि वा । चक्षुषः प्रभवस्तेजो नास्त्यन्तोऽथास्य चक्षुषाम्
    ॥ १३॥ सर्वथा यत्पशून्पाति तैश्च यद्रमते पुनः । तेषामधिपतिर्यच्च तस्मात्पशुपतिः स्मृतः ॥ १४॥ नित्येन
    ब्रह्मचर्येण लिङ्गमस्य यदा स्थितम् । महयन्त्यस्य लोकाश्च महेश्वर इति स्मृतः ॥ १५॥ विग्रहं पूजयेद्यो
    वै लिङ्गं वापि महात्मनः । लिङ्गं पूजयिता नित्यं महतीं श्रियमश्नुते ॥ १६॥ ऋषयश्चापि देवाश्च गन्धर्वाप्सरसस्तथा
    । लिङ्गमेवार्चयन्ति स्म यत्तदूर्ध्वं समास्थितम् ॥ १७॥ पूज्यमाने ततस्तस्मिन्मोदते स महेश्वरः । सुखं
    ददाति प्रीतात्मा भक्तानां भक्तवत्सलः ॥ १८॥ एष एव श्मशानेषु देवो वसति नित्यशः । यजन्ते तं जनास्तत्र
    वीरस्थाननिषेविणम् ॥ १९॥ इति महाभारते अनुशासनपर्वणि १४६ अध्यायान्तर्गतं वासुदेवकृतं शिवस्तोत्रं सम्पूर्णम्
    । महाभारत । अनुपर्व । अध्याय १४६
