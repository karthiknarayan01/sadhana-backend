id: naradakritam2narayanastotram
category: stotram
name:
  english: naradakritam2narayanastotram
  devanagari: नारदकृतं२नारायणस्तोत्रम्
content:
  english: 10|| tvam vasudevo'si jagannivasah kshemaya lokasya tapah karoshi | yogeshvareshopashamastha
    atmaramadhipastvam parahamsasadguruh || 11|| vibhurrishinamrishabho'ksharatma jiveshvaranam ca niyamako'si
    | sakshi mahapurusha atmatantrah kalo'bhavadyadbhrukutermahamshca || 12|| sargadilila jagatam tvamisha
    karoshi mayapurushatmanaiva | tathapyakartta nanu nirguno'si bhuma parabrahma paratparashca || 13||
    satyah svayanjyotiratarkyashaktistvam brahmabhutatmavicintyamurttih | brihadvratacarya mahamunindra
    kandarpadarpapaharapratapa || 14|| tapasvinam ye ripavah prasiddhah krodho raso matsaralobhamukhyah
    | apyashramam te'pi kadapi veshtum nemam kshama hyesha tava pratapah || 15|| chandomayo jnanamayo'mritadhva
    dharmatmako dharmasargabhiposhta | unmulitadharmasargo mahatma tvamavyayashcakshayo'vyaktabandhuh
    || 16|| nirdosharupasya tava'khilah kriya bhavanti vai nirguna nirgunasya | dharmarthakamepsubhirarcaniyastvamishvaro
    natha mumukshubhishca | tvam kalamayayamasamsritibhyo mahabhayatpatumekah samarthah | bhaktaparadhananavekshamano
    mahadayaluh kila bhaktavatsalah || 18|| dhritavatarasya hi namamatram rupam ca va yah smaredantakale
    | so'pi prabho ghoramahaghasanghatsadyo vimukto divamashu yati || 19|| tam tvam vihaya'tra tu yo manushyo
    dehe tridhatavapi daihikeshu | jaya''tmajajnatidhaneshu sajjate sa mayaya vancita eva mudhah || 9
  devanagari: १०॥ त्वं वासुदेवोऽसि जगन्निवासः क्षेमाय लोकस्य तपः करोषि । योगेश्वरेशोपशमस्थ आत्मारामाधिपस्त्वं
    परहंससद्गुरुः ॥ ११॥ विभुरृषीणामृषभोऽक्षरात्मा जीवेश्वराणां च नियामकोऽसि । साक्षी महापूरुष आत्मतन्त्रः
    कालोऽभवद्यद्भ्रुकुटेर्महांश्च ॥ १२॥ सर्गादिलीला जगतां त्वमीश करोषि मायापुरुषात्मनैव । तथाप्यकर्त्ता
    ननु निर्गुणोऽसि भूमा परब्रह्म परात्परश्च ॥ १३॥ सत्यः स्वयञ्ज्योतिरतर्क्यशक्तिस्त्वं ब्रह्मभूतात्मविचिन्त्यमूर्त्तिः
    । बृहद्व्रताचार्य महामुनीन्द्र कन्दर्पदर्पापहरप्रताप ॥ १४॥ तपस्विनां ये रिपवः प्रसिद्धाः क्रोधो रसो
    मत्सरलोभमुख्याः । अप्याश्रमं तेऽपि कदापि वेष्टुं नेमं क्षमा ह्येष तव प्रतापः ॥ १५॥ छन्दोमयो ज्ञानमयोऽमृताध्वा
    धर्मात्मको धर्मसर्गाभिपोष्टा । उन्मूलिताधर्मसर्गो महात्मा त्वमव्ययश्चाक्षयोऽव्यक्तबन्धुः ॥ १६॥ निर्दोषरूपस्य
    तवाऽखिलाः क्रिया भवन्ति वै निर्गुणा निर्गुणस्य । धर्मार्थकामेप्सुभिरर्चनीयस्त्वमीश्वरो नाथ मुमुक्षुभिश्च
    । त्वं कालमायायमसंसृतिभ्यो महाभयात्पातुमेकः समर्थः । भक्तापराधाननवेक्षमाणो महादयालुः किल भक्तवत्सलः
    ॥ १८॥ धृतावतारस्य हि नाममात्रं रूपं च वा यः स्मरेदन्तकाले । सोऽपि प्रभो घोरमहाघसङ्घात्सद्यो विमुक्तो
    दिवमाशु याति ॥ १९॥ तं त्वां विहायाऽत्र तु यो मनुष्यो देहे त्रिधातावपि दैहिकेषु । जायाऽऽत्मजज्ञातिधनेषु
    सज्जते स मायया वञ्चित एव मूढः ॥ ९
