id: narayaniyam-dashaka-50
category: stotram
name:
  english: Narayaniyam Dashaka 50
content:
  english: taralamadhukrit vrinde vrindavane'tha manohare pashupashishubhih sakam vatsanupalanalolupah
    | haladharasakho deva shriman viceritha dharayan gavalamuralivetram netrabhiramatanudyutih || || vihitajagatiraksham
    lakshmikarambujalalitam dadati caranadvandvam vrindavane tvayi pavane | kimiva na babhau sampatsampuritam
    taruvallari saliladharanigotrakshetradikam kamalapate || || vilasadulape kantarante samiranashitale
    vipulayamunatire govardhanacalamurdhasu | lalitamuralinadah sancarayan khalu vatsakam kvacana divase
    daityam vatsakritim tvamudaikshathah || || rabhasavilasatpuccham vicchayato'sya vilokayan kimapi valitaskandham
    randhrapratikshamudikshitam | tamatha carane bibhradvibhramayan muhuruccakaih kuhacana mahavrikshe
    cikshepitha kshatajivitam || || nipatati mahadaitye jatya duratmani tatkshanam nipatanajavakshunnakshoniruhakshatakanane
    | divi parimilat vrinda vrindarakah kusumotkaraih shirasi bhavato harshadvarshanti nama tada hare
    || || surabhilatama murdhanyurdhvam kutah kusumavali nipatati tavetyukto balaih sahelamudairayah |
    jhatiti danujakshepenordhvam gatastarumandalat kusumanikarah so'yam nunam sameti shanairiti || ||
    kvacana divase bhuyo bhuyastare parushatape tapanatanayapathah patum gata bhavadadayah | calitagarutam
    prekshamasurbakam khalu vismritam kshitidharagarucchede kailasashailamivaparam || || pibati salilam
    gopavrate bhavantamabhidrutah sa kila nigilannagniprakhyam punardrutamudvaman | dalayitumagattrotyah
    kotya tada''shu bhavan vibho khalajanabhidacuncushcancu pragrihya dadara tam || || sapadi sahajam
    sandrashtum va mritam khalu putana manujamaghamapyagre gatva pratikshitumeva va | shamananilayam yate
    tasmin bake sumanogane kirati sumanovrindam vrindavanat grihamaiyathah || || lalitamuralinadam durannishamya
    vadhujanai stvaritamupagamyaradarudhamodamudikshitah | janitajananinandanandah samiranamandira prathitavasate
    shaure durikurushva mamamayan ||
  devanagari: तरलमधुकृत् वृन्दे वृन्दावनेऽथ मनोहरे पशुपशिशुभिः साकं वत्सानुपालनलोलुपः । हलधरसखो देव श्रीमन्
    विचेरिथ धारयन् गवलमुरलीवेत्रं नेत्राभिरामतनुद्युतिः ॥ ॥ विहितजगतीरक्षं लक्ष्मीकराम्बुजलालितं ददति
    चरणद्वन्द्वं वृन्दावने त्वयि पावने । किमिव न बभौ सम्पत्सम्पूरितं तरुवल्लरी सलिलधरणीगोत्रक्षेत्रादिकं
    कमलापते ॥ ॥ विलसदुलपे कान्तारान्ते समीरणशीतले विपुलयमुनातीरे गोवर्धनाचलमूर्धसु । ललितमुरलीनादः सञ्चारयन्
    खलु वात्सकं क्वचन दिवसे दैत्यं वत्साकृतिं त्वमुदैक्षथाः ॥ ॥ रभसविलसत्पुच्छं विच्छायतोऽस्य विलोकयन्
    किमपि वलितस्कन्धं रन्ध्रप्रतीक्षमुदीक्षितम् । तमथ चरणे बिभ्रद्विभ्रामयन् मुहुरुच्चकैः कुहचन महावृक्षे
    चिक्षेपिथ क्षतजीवितम् ॥ ॥ निपतति महादैत्ये जात्या दुरात्मनि तत्क्षणं निपतनजवक्षुण्णक्षोणीरुहक्षतकानने
    । दिवि परिमिलत् वृन्दा वृन्दारकाः कुसुमोत्करैः शिरसि भवतो हर्षाद्वर्षन्ति नाम तदा हरे ॥ ॥ सुरभिलतमा
    मूर्धन्यूर्ध्वं कुतः कुसुमावली निपतति तवेत्युक्तो बालैः सहेलमुदैरयः । झटिति दनुजक्षेपेणोर्ध्वं गतस्तरुमण्डलात्
    कुसुमनिकरः सोऽयं नूनं समेति शनैरिति ॥ ॥ क्वचन दिवसे भूयो भूयस्तरे परुषातपे तपनतनयापाथः पातुं गता भवदादयः
    । चलितगरुतं प्रेक्षामासुर्बकं खलु विस्मृतं क्षितिधरगरुच्छेदे कैलासशैलमिवापरम् ॥ ॥ पिबति सलिलं गोपव्राते
    भवन्तमभिद्रुतः स किल निगिलन्नग्निप्रख्यं पुनर्द्रुतमुद्वमन् । दलयितुमगात्त्रोट्याः कोट्या तदाऽऽशु
    भवान् विभो खलजनभिदाचुञ्चुश्चञ्चू प्रगृह्य ददार तम् ॥ ॥ सपदि सहजां सन्द्रष्टुं वा मृतां खलु पूतना मनुजमघमप्यग्रे
    गत्वा प्रतीक्षितुमेव वा । शमननिलयं याते तस्मिन् बके सुमनोगणे किरति सुमनोवृन्दं वृन्दावनात् गृहमैयथाः
    ॥ ॥ ललितमुरलीनादं दूरान्निशम्य वधूजनै स्त्वरितमुपगम्यारादारूढमोदमुदीक्षितः । जनितजननीनन्दानन्दः समीरणमन्दिर
    प्रथितवसते शौरे दूरीकुरुष्व ममामयान् ॥
