id: lakshminrisimhamalamantrah-3
category: mantra
name:
  english: lakshminrisimhamalamantrah 3
  devanagari: लक्ष्मीनृसिंहमालामन्त्रः ३
content:
  english: uccatanaya namah svaha || 4|| om bhurbhuvasvah om kshraum namo bhagavate narasimhaya raudrajvalaprajvalitanetratrayaya
    pralayakalagnirudravataraya vishvarupaya stambhodbhavaya anantadivyayudhadharaya danavakulasamharakaya
    raktaranjita murdhaja dhaga dhaga bhaga bhaga bhobhumanbrahmandabhayankaratandavanarasimha shrikeshavadevarupa
    dashavrindavara ekadasharudradvadashabhanutejajvalanarasimha mama guru prasadaya prasadaya sarvarakshasan
    dahaya dahaya bhakshaya bhakshaya maraya maraya mardaya mardaya tapaya tapaya dipaya dipaya vidaraya
    vidaraya stambhaya stambhaya mohaya mohaya vibhramaya vibhramaya uccataya uccataya hana hana paca
    paca samharaya samharaya uccatanaya namah svaha || 5|| om bhurbhuvasvah om kshraum namo bhagavate
    narasimhaya bhutamandalabhairavamandalakushmandamandalaya kshamandalani kampaya kampaya aveshaya aveshaya
    akarshaya akarshaya anandaya anandaya nrityaya nrityaya vada vada uccatanaya namah svaha || 6|| om
    bhurbhuvasvah om kshraum namo bhagavate narasimhaya hiranyakshavakshovidaranaya jaya jaya ehi ehi
    bhagavan garudadhvaja mama sarvopadravan vajradehena curnaya curnaya mudgarabharanaharanaya samudram
    shoshaya shoshaya asuragandharvayakshapishacabrahmarakshasabhutapretapishacan vidhvamsaya vidhvamsaya
    purvaparashulamulapatinam pratistambhaya pratistambhaya paramantra parayantra paratantrani chindi
    chindi bhidi bhidi ayamari vinivari apamrityubhayasakalasankatan vidhvamsaya vidhvamsaya hana hana
    paca paca raksha raksha ahonarasimhaya antakantakaya uccatanaya namah svaha || 7|| om kshraum | phalashrutih
    | siddhim navadinaishcaiva japam kuryannarottamah | ayutam tu japam kartum siddhistu jayate dhruvam
    || 1|| havanam tu dashamshena kuryattarpanameva ca | brahmanan bhojayeccaiva dashamshenapyanukramat
    || 2|| siddhirbhavati rajendra ekacittena tejasa | ekannam bhojanam karyam bhumishayi na mancake ||
    3|| jitendriyo va purusho yavat samaptikam bhavet | athava mandalam karyam japamavartayetshatam ||
    4|| atharvaneshu vedeshu rishinam ca shatam pura | na hi lokeshu vikhyatam rajan sarvabhayapaham ||
    5|| bhutapretapishacamshca yakshagandharvarakshasan | dasyuvyaghrarane rajan kanane'pi jale'pi va
    || 6|| sarvarakshakaram stotram harestu pritikarakam | idam tu pathitam rajan sarvakaman avapnuyat
    || 7|| paramantrani tantrani jaranam maranadikam | uccataneshu rajendra stambhaneshu bhavishyati ||
    8|| | harestu pratimam sthapya nityapujam ca karayet | sthapayeddevadevesham japam kritva yathavidhi
    || 9|| adau ca shatagayatrya japenaiva narottamah |
  devanagari: उच्चाटनाय नमः स्वाहा ॥ ४॥ ॐ भूर्भुवस्वः ॐ क्ष्रौं नमो भगवते नारसिंहाय रौद्रज्वालाप्रज्वलितनेत्रत्रयाय
    प्रलयकालाग्निरुद्रावताराय विश्वरूपाय स्तम्भोद्भवाय अनन्तदिव्यायुधधराय दानवकुलसंहारकाय रक्तरञ्जित मूर्धज
    धग धग भग भग भोभूमन्ब्रह्माण्डभयङ्करताण्डवनारसिंह श्रीकेशवदेवरूप दशवृन्दावर एकादशरुद्रद्वादशभानुतेजज्वालानारसिंह
    मम गुरु प्रसादय प्रसादय सर्वराक्षसान् दाहय दाहय भक्षय भक्षय मारय मारय मर्दय मर्दय तापय तापय दीपय दीपय
    विदारय विदारय स्तम्भय स्तम्भय मोहय मोहय विभ्रामय विभ्रामय उच्चाटय उच्चाटय हन हन पच पच संहारय संहारय
    उच्चाटनाय नमः स्वाहा ॥ ५॥ ॐ भूर्भुवस्वः ॐ क्ष्रौं नमो भगवते नारसिंहाय भूतमण्डलभैरवमण्डलकूष्माण्डमण्डलय
    क्षमण्डलानि कम्पय कम्पय आवेशय आवेशय आकर्षय आकर्षय आनन्दय आनन्दय नृत्यय नृत्यय वद वद उच्चाटनाय नमः
    स्वाहा ॥ ६॥ ॐ भूर्भुवस्वः ॐ क्ष्रौं नमो भगवते नारसिंहाय हिरण्याक्षवक्षोविदारणाय जय जय एहि एहि भगवन्
    गरुडध्वज मम सर्वोपद्रवान् वज्रदेहेन चूर्णय चूर्णय मुद्गराभरणहरणाय समुद्रं शोषय शोषय असुरगन्धर्वयक्षपिशाचब्रह्मराक्षसभूतप्रेतपिशाचान्
    विध्वंसय विध्वंसय पूर्वापरशूलमूलपातिनं प्रतिस्तम्भय प्रतिस्तम्भय परमन्त्र परयन्त्र परतन्त्राणि छिन्दि
    छिन्दि भिदि भिदि अयमारि विनिवारि अपमृत्युभयसकलसङ्कटान् विध्वंसय विध्वंसय हन हन पच पच रक्ष रक्ष अहोनारसिंहाय
    अन्तकान्तकाय उच्चाटनाय नमः स्वाहा ॥ ७॥ ॐ क्ष्रौम् । फलश्रुतिः । सिद्धिं नवदिनैश्चैव जपं कुर्यान्नरोत्तमः
    । अयुतं तु जपं कर्तुं सिद्धिस्तु जायते ध्रुवम् ॥ १॥ हवनं तु दशांशेन कुर्यात्तर्पणमेव च । ब्राह्मणान्
    भोजयेच्चैव दशांशेनाप्यनुक्रमात् ॥ २॥ सिद्धिर्भवति राजेन्द्र एकचित्तेन तेजसा । एकान्नं भोजनं कार्यं
    भूमिशायि न मञ्चके ॥ ३॥ जितेन्द्रियो वा पुरुषो यावत् सामाप्तिकं भवेत् । अथवा मण्डलं कार्यं जपमावर्तयेत्शतम्
    ॥ ४॥ अथर्वणेषु वेदेषु ऋषीणां च शतं पुरा । न हि लोकेषु विख्यातं राजन् सर्वभयापहम् ॥ ५॥ भूतप्रेतपिशाचांश्च
    यक्षगन्धर्वराक्षसान् । दस्युव्याघ्ररणे राजन् काननेऽपि जलेऽपि वा ॥ ६॥ सर्वरक्षाकरं स्तोत्रं हरेस्तु
    प्रीतिकारकम् । इदं तु पठितं राजन् सर्वकामान् अवाप्नुयात् ॥ ७॥ परमन्त्राणि तन्त्राणि जारणं मारणादिकम्
    । उच्चाटनेषु राजेन्द्र स्तम्भनेषु भविष्यति ॥ ८॥ । हरेस्तु प्रतिमां स्थाप्य नित्यपूजां च कारयेत् ।
    स्थापयेद्देवदेवेशं जपं कृत्वा यथाविधि ॥ ९॥ आदौ च शतगायत्र्या जपेनैव नरोत्तमः ।
