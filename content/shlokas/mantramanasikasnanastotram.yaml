id: mantramanasikasnanastotram
category: mantra
name:
  english: mantramanasikasnanastotram
  devanagari: मन्त्रमानसिकस्नानस्तोत्रम्
content:
  english: mantramanasikasnanastotram sankalpam | om alinilaghanashyamam nalinayatalocanam | smarami pundarikaksham
    tena snato bhavamyaham || dhyanam | anantaditya sankasham vasudevam caturbhujam | shankhacakragadapadmadharinam
    vanamalinam || shyamalam shantahridayam prasannavadanam shubham | divyacandanaliptangam caruhasam
    suvikshanam | vanamalaparivritam naradadibhirarcitam || suvarnakankanairdiptam kinkinibhirvirajitam
    | keyuraharinam devam suvarnamakutojjvalam | anekaratnasanchanna sphuranmakarakundalam || padapadmasushobhitam
    | tatpadapankajadgangam pravahantim svamurdhani | cintaye brahmarandhrena pravishantim svakam tanum
    || taya samkshalaye deham bahyamabhyantaram malam | antarbahishca shuddhyantam bahyamabhyantarani
    ca || mantram | om
  devanagari: मन्त्रमानसिकस्नानस्तोत्रम् सङ्कल्पम् । ॐ अलिनीलघनश्यामं नलिनायतलोचनम् । स्मरामि पुण्डरीकाक्षं
    तेन स्नातो भवाम्यहम् ॥ ध्यानम् । अनन्तादित्य सङ्काशं वासुदेवं चतुर्भुजम् । शङ्खचक्रगदापद्मधारिणं वनमालिनम्
    ॥ श्यामलं शान्तहृदयं प्रसन्नवदनं शुभम् । दिव्यचन्दनलिप्ताङ्गं चारुहासं सुवीक्षणम् । वनमालापरिवृतं
    नारदादिभिरर्चितम् ॥ सुवर्णकङ्कणैर्दीप्तं किङ्किणीभिर्विराजितम् । केयूरहारिणं देवं सुवर्णमकुटोज्ज्वलम्
    । अनेकरत्नसञ्छन्न स्फुरन्मकरकुण्डलम् ॥ पादपद्मसुशोभितम् । तत्पादपङ्कजाद्गङ्गां प्रवहन्तीं स्वमूर्धनि
    । चिन्तये ब्रह्मरन्ध्रेण प्रविशन्तीं स्वकां तनुम् ॥ तया संक्षालये देहं बाह्यमाभ्यन्तरं मलम् । अन्तर्बहिश्च
    शुद्ध्यन्तं बाह्यमभ्यन्तराणि च ॥ मन्त्रम् । ॐ
