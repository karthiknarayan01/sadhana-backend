id: ganeshastotramsomadattakritam
category: stotram
name:
  english: ganeshastotramsomadattakritam
  devanagari: गणेशस्तोत्रम्सोमदत्तकृतं
content:
  english: somadattakritam shriganeshastotram || shriganeshaya namah || somadatta uvaca | ganeshaya pareshaya
    sada shantipradayine | yoginam yogarupaya hridisthaya namo namah || 61|| vighneshaya mahavighnavighnadaya
    paratmane | vighnahartre svabhaktanam sattadharaya te namah || 62|| anadaye mahakala kalaya kalarupine
    | ante viharayuktayadinathaya namo namah || 63|| vinayakaya devaya sarvesham nayakaya ca | nayakebhyah
    padadinam datre tubhyam namo namah || 64|| lambodaraya sarveshamudarasthaya te namah | aparodarabhavaya
    brahmeshaya namo namah || 65|| adimadhyantahinaya tadakarasvarupine | svanandapataye tubhyam svasamvedyaya
    te namah || 66|| siddhidatre subhaktebhyo dushtanam siddhiharine | siddhipate mahasiddhirupaya te
    namo namah || 67|| buddhipate subuddhinam datre sadhujanapriya | durbuddhidayine tubhyam dushtebhyo
    vai namo namah || 68|| samprajnatasvarupayasamprajnatam mahashirah | tayoryoge narakara gajakaraya
    te namah || 69|| kim staumi gananatha tvam sada yogasvarupine | ataste namanam kritva kritakrityo
    bhavamyaham || 70|| dhanyo'ham sarvabhuteshu tvam drishtva gananayakam | kulam shilam yasho dhanyam
    janakau tapa ashramah || 71|| dhanyam vratam ganadhisha mahat kartikamasagam | tasyacaranamatrena
    tvam me drishtigatah prabho || 72|| bhaktim tvadiyapadeshu dehi me dviradanana | nanyadyace bhramairyuktam
    ganapatyaparayanah || 73|| tasya tadvacanam shrutva ganeshastamuvaca ha | yadyadicchasi tattatte saphalam
    prabhavishyati || 74|| ganapatyapriyo'tyantam bhavishyasi mahamune | bhakto madiyapadasya sarvamanyo
    bhavishyasi || 75|| tvaya kritamidam stotram sarvasiddhipradayakam | bhavishyati nrinam vipra pathatam
    sha
  devanagari: सोमदत्तकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ सोमदत्त उवाच । गणेशाय परेशाय सदा शान्तिप्रदायिने
    । योगिनां योगरूपाय हृदिस्थाय नमो नमः ॥ ६१॥ विघ्नेशाय महाविघ्नविघ्नदाय परात्मने । विघ्नहर्त्रे स्वभक्तानां
    सत्ताधाराय ते नमः ॥ ६२॥ अनादये महाकाल कालाय कालरूपिणे । अन्ते विहारयुक्तायादिनाथाय नमो नमः ॥ ६३॥ विनायकाय
    देवाय सर्वेषां नायकाय च । नायकेभ्यः पदादीनां दात्रे तुभ्यं नमो नमः ॥ ६४॥ लम्बोदराय सर्वेषामुदरस्थाय
    ते नमः । अपारोदारभावाय ब्रह्मेशाय नमो नमः ॥ ६५॥ आदिमध्यान्तहीनाय तदाकारस्वरूपिणे । स्वानन्दपतये तुभ्यं
    स्वसंवेद्याय ते नमः ॥ ६६॥ सिद्धिदात्रे सुभक्तेभ्यो दुष्टानां सिद्धिहारिणे । सिद्धिपते महासिद्धिरूपाय
    ते नमो नमः ॥ ६७॥ बुद्धिपते सुबुद्धीनां दात्रे साधुजनप्रिय । दुर्बुद्धिदायिने तुभ्यं दुष्टेभ्यो वै
    नमो नमः ॥ ६८॥ सम्प्रज्ञातस्वरूपायासम्प्रज्ञातं महाशिरः । तयोर्योगे नराकार गजाकाराय ते नमः ॥ ६९॥ किं
    स्तौमि गणनाथ त्वां सदा योगस्वरूपिणे । अतस्ते नमनं कृत्वा कृतकृत्यो भवाम्यहम् ॥ ७०॥ धन्योऽहं सर्वभूतेषु
    त्वां दृष्ट्वा गणनायकम् । कुलं शीलं यशो धन्यं जनकौ तप आश्रमः ॥ ७१॥ धन्यं व्रतं गणाधीश महत् कार्तिकमासगम्
    । तस्याचरणमात्रेण त्वं मे दृष्टिगतः प्रभो ॥ ७२॥ भक्तिं त्वदीयपादेषु देहि मे द्विरदानन । नान्यद्याचे
    भ्रमैर्युक्तं गाणपत्यपरायणः ॥ ७३॥ तस्य तद्वचनं श्रुत्वा गणेशस्तमुवाच ह । यद्यदिच्छसि तत्तत्ते सफलं
    प्रभविष्यति ॥ ७४॥ गाणपत्यप्रियोऽत्यन्तं भविष्यसि महामुने । भक्तो मदीयपादस्य सर्वमान्यो भविष्यसि ॥
    ७५॥ त्वया कृतमिदं स्तोत्रं सर्वसिद्धिप्रदायकम् । भविष्यति नृणां विप्र पठतां श
