id: manjushristotram
category: stotram
name:
  english: manjushristotram
  devanagari: मन्जुश्रीस्तोत्रम्
content:
  english: manjushristotram shrimanjunathakamalasanaratnamaulirvidyadhipo bhuvanamandalacakravarti | dhyanadhipocitavirajitasaumyarupo
    vandamahe suranarasuravanditaryam || 1|| balakritih kuvalayojjvalalolahastah keyuraharamanikundalaghrishtagandah
    | khadamshca shodasharadam sukumararupam vandamahe suravararcitamanjughosham || 2|| romagrakupavivare
    parivartamanam vishvaprapancakaranam sugatatmajasya | traividyamantra tava natha gunarnavena sukshmaya
    buddhatanayaya namo'stu tasmai || 3|| gambhiradharmanayamargasukhapratishtham jnanodadhim nikhilasattvakritarthakaram
    | prajnanidhanagunasagaramaprameyam manjushriyam jinasutam satatam namami || 4|| viditasakalatattvah
    kshiptasantapasattvastribhuvana upakari sarvaduhkhapahari | madanamathanavirashcarurupah sucirastribhuvanajanatoshah
    patu mam manjughoshah || 5|| balendurucirabhasam varabharanabhushitam | prajnabjamalapatraksham vande
    manjushriyam sada || 6|| patram vamakare yasya bhramannanjalisannibham | namna te sarvato lakshmirmanjughosham
    namamyaham || 7|| khadgapustakahastaya candramandalavartine | ajnanadhvantasuryaya manjughoshaya te
    namah || 8|| jnanottaraprabhaketum pranidhanamatim tatha | shantendriyam manjughosham bhaktitah pranamamyaham
    || 9|| iti shri manjushristavastotram sampurnam ||
  devanagari: मञ्जुश्रीस्तोत्रम् श्रीमञ्जुनाथकमलासनरत्नमौलिर्विद्याधिपो भुवनमण्डलचक्रवर्ती । ध्यानाधिपोचितविराजितसौम्यरूपो
    वन्दामहे सुरनरासुरवन्दितार्यम् ॥ १॥ बालाकृतिः कुवलयोज्ज्वललोलहस्तः केयूरहारमणिकुण्डलघृष्टगण्डः । खादंश्च
    षोडशरदं सुकुमाररूपं वन्दामहे सुरवरार्चितमञ्जुघोषम् ॥ २॥ रोमाग्रकूपविवरे परिवर्तमानं विश्वप्रपञ्चकरणं
    सुगतात्मजस्य । त्रैविद्यमन्त्र तव नाथ गुणार्णवेण सूक्ष्माय बुद्धतनयाय नमोऽस्तु तस्मै ॥ ३॥ गम्भीरधर्मनयमार्गसुखप्रतिष्ठं
    ज्ञानोदधिं निखिलसत्त्वकृतार्थकारम् । प्रज्ञानिधानगुणसागरमप्रमेयं मञ्जुश्रियं जिनसुतं सततं नमामि ॥
    ४॥ विदितसकलतत्त्वः क्षिप्तसन्तापसत्त्वस्त्रिभुवन उपकारी सर्वदुःखापहारी । मदनमथनवीरश्चारुरूपः सुचीरस्त्रिभुवनजनतोषः
    पातु मां मञ्जुघोषः ॥ ५॥ बालेन्दुरुचिराभासं वराभरणभूषितम् । प्रज्ञाब्जामलपत्राक्षं वन्दे मञ्जुश्रियं
    सदा ॥ ६॥ पात्रं वामकरे यस्य भ्रमन्नञ्जलिसन्निभम् । नाम्ना ते सर्वतो लक्ष्मीर्मञ्जुघोषं नमाम्यहम् ॥
    ७॥ खड्गपुस्तकहस्ताय चन्द्रमण्डलवर्तिने । अज्ञानध्वान्तसूर्याय मञ्जुघोषाय ते नमः ॥ ८॥ ज्ञानोत्तरप्रभाकेतुं
    प्रणिधानमतिं तथा । शान्तेन्द्रियं मञ्जुघोषं भक्तितः प्रणमाम्यहम् ॥ ९॥ इति श्री मञ्जुश्रीस्तवस्तोत्रं
    सम्पूर्णम् ॥
