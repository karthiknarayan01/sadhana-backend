id: purushottamaproktamkamadevaratistotram
category: stotram
name:
  english: purushottamaproktamkamadevaratistotram
  devanagari: पुरुषोत्तमप्रोक्तंकामदेवरतिस्तोत्रम्
content:
  english: '|| 81|| gitavaditranirghoshairanetavyo griham prati | adhivasanapurvam ca sarvatobhadramandale
    || 82|| sthapayitva harim kamam ratim ca damanadrumam | acchadya shvetavastrena pujayet kanyaka priye
    || 83|| klim kamadevaya namo hrim | ratyai ca namo namah | purvasyam hrim ca kandarpam pujayami nisha''''game
    || 84|| gandhapushpakshatadhupadipanaivedyakaih shubhaih | arartrikadibhirdaivam pujayami patim prabhum
    || 85|| madanaya namah pracyam manmathaya namo''gnike | kandarpaya namo yamye''nangaya namo nairrite
    || 86|| varunyam mohanaya namah smaraya namo''nile | kauberyamishvaraya namah pushpabanayaishanyam
    namah || 87|| sarvadikshu namaskritya mam kanya pujayet tatah |'
  devanagari: ॥ ८१॥ गीतवादित्रनिर्घोषैरानेतव्यो गृहं प्रति । अधिवासनपूर्वं च सर्वतोभद्रमण्डले ॥ ८२॥ स्थापयित्वा
    हरिं कामं रतिं च दमनद्रुमम् । आच्छाद्य श्वेतवस्त्रेण पूजयेत् कन्यका प्रिये ॥ ८३॥ क्लीं कामदेवाय नमो
    ह्रीम् । रत्यै च नमो नमः । पूर्वस्यां ह्रीं च कन्दर्पं पूजयामि निशाऽऽगमे ॥ ८४॥ गन्धपुष्पाक्षतधूपदीपनैवेद्यकैः
    शुभैः । आरार्त्रिकादिभिर्दैवं पूजयामि पतिं प्रभुम् ॥ ८५॥ मदनाय नमः प्राच्यां मन्मथाय नमोऽग्निके ।
    कन्दर्पाय नमो याम्येऽनङ्गाय नमो नैरृते ॥ ८६॥ वारुण्यां मोहनाय नमः स्मराय नमोऽनिले । कौबेर्यामीश्वराय
    नमः पुष्पबाणायैशान्यां नमः ॥ ८७॥ सर्वदिक्षु नमस्कृत्य मां कन्या पूजयेत् ततः ।
