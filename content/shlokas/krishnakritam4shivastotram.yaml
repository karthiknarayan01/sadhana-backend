id: krishnakritam4shivastotram
category: stotram
name:
  english: krishnakritam4shivastotram
  devanagari: कृष्णकृतं४शिवस्तोत्रम्
content:
  english: shrikrishnakritam 4 shivastotram namo'stu te shashvata sarvayone brahmadhipam tvamrishayo vadanti
    | tapashca sattvam ca rajastamashca tvameva satyam ca vadanti santah || 30|| tvam vai brahma ca rudrashca
    varuno'gnirmanurbhavah | dhata tvashta vidhata ca tvam prabhuh sarvatomukhah || 31|| tvatto jatani
    bhutani sthavarani carani ca | tvamadih sarvabhutanam samharashca tvameva hi || 32|| ye cendriyarthashca
    manashca kritsnam ye vayavah sapta tathaiva cagnih | ye va divistha devatashcapi pumsam tasmatparam
    tvamrishayo vadanti || 33|| veda yajnashca somashca dakshina pavako havih | yajnopagam ca yatkincidbhagavamstadasamshayam
    || 34|| ishtam dattamadhitam ca vratani niyamashca ye | hrih kirtih shrirdyutistushtih siddhishcaiva
    tvadarpana || 35|| kamah krodho bhayam lobho madah stambho'tha matsarah | adhayo vyadhayashcaiva bhagavamstanayastava
    || 36|| kritirvikarah pralayah pradhanam prabhavo'vyayah | manasah parama yonih svabhavashcapi shashvatah
    || 37|| avyaktah pavana vibho sahasramsho hiranmayah || 37|| adirgunanam sarvesham bhavanvai jivanashrayah
    | mahanatma matirbrahma vishvah shambhuh svayambhuvah || 38|| buddhih prajnopalabdhishca samvitkhyatirdhritih
    smritih | paryayavacakaih shabdairmahanatma vibhavyase || 39|| tvam buddhva brahmano vidvanna pramoham
    nigacchati | hridayam sarvabhutanam kshetrajnastvamrishishtutah || 40|| sarvatahpanipadastvam sarvato'kshishiromukhah
    | sarvatahshrutima~lloke sarvamavritya tishthasi || 41|| phalam tvamasi tigmamsho nimeshadishu karmasu
    | tvam vai prabharcih purushah sarvasya hridi samsthitah | anima laghima praptirishano jyotiravyayah
    || 42|| tvayi buddhirmatirlokah prapannah samshritashca ye | dhyanino nityayogashca satyasandha jitendriyah
    || 43|| yastvam dhruvam vedayate guhashayam prabhum puranam purusham vishvarupam | hiranmayam buddhimatam
    param gatim sa buddhimanbuddhimatitya tishthati || 44|| viditva sapta sukshmani shadangam tvam ca
    murtitah | pradhanavidhiyogasthastvameva vishate budhah || 45|| iti mahabharate anushasanaparvani
    15 adhyayantargatam shrikrishnakritam shivastotram sampurnam | mahabharata | anuparva | adhyaya 15
  devanagari: श्रीकृष्णकृतं ४ शिवस्तोत्रम् नमोऽस्तु ते शाश्वत सर्वयोने ब्रह्माधिपं त्वामृषयो वदन्ति ।
    तपश्च सत्त्वं च रजस्तमश्च त्वामेव सत्यं च वदन्ति सन्तः ॥ ३०॥ त्वं वै ब्रह्मा च रुद्रश्च वरुणोऽग्निर्मनुर्भवः
    । धाता त्वष्टा विधाता च त्वं प्रभुः सर्वतोमुखः ॥ ३१॥ त्वत्तो जातानि भूतानि स्थावराणि चराणि च । त्वमादिः
    सर्वभूतानां संहारश्च त्वमेव हि ॥ ३२॥ ये चेन्द्रियार्थाश्च मनश्च कृत्स्नं ये वायवः सप्त तथैव चाग्निः
    । ये वा दिविस्था देवताश्चापि पुंसां तस्मात्परं त्वामृषयो वदन्ति ॥ ३३॥ वेदा यज्ञाश्च सोमश्च दक्षिणा
    पावको हविः । यज्ञोपगं च यत्किञ्चिद्भगवांस्तदसंशयम् ॥ ३४॥ इष्टं दत्तमधीतं च व्रतानि नियमाश्च ये । ह्रीः
    कीर्तिः श्रीर्द्युतिस्तुष्टिः सिद्धिश्चैव त्वदर्पणा ॥ ३५॥ कामः क्रोधो भयं लोभो मदः स्तम्भोऽथ मत्सरः
    । आधयो व्याधयश्चैव भगवंस्तनयास्तव ॥ ३६॥ कृतिर्विकारः प्रलयः प्रधानं प्रभवोऽव्ययः । मनसः परमा योनिः
    स्वभावश्चापि शाश्वतः ॥ ३७॥ अव्यक्तः पावन विभो सहस्रांशो हिरण्मयः ॥ ३७॥ आदिर्गुणानां सर्वेषां भवान्वै
    जीवनाश्रयः । महानात्मा मतिर्ब्रह्मा विश्वः शम्भुः स्वयम्भुवः ॥ ३८॥ बुद्धिः प्रज्ञोपलब्धिश्च संवित्ख्यातिर्धृतिः
    स्मृतिः । पर्यायवाचकैः शब्दैर्महानात्मा विभाव्यसे ॥ ३९॥ त्वां बुद्ध्वा ब्राह्मणो विद्वान्न प्रमोहं
    निगच्छति । हृदयं सर्वभूतानां क्षेत्रज्ञस्त्वमृषिष्टुतः ॥ ४०॥ सर्वतःपाणिपादस्त्वं सर्वतोऽक्षिशिरोमुखः
    । सर्वतःश्रुतिमाँल्लोके सर्वमावृत्य तिष्ठसि ॥ ४१॥ फलं त्वमसि तिग्मांशो निमेषादिषु कर्मसु । त्वं वै
    प्रभार्चिः पुरुषः सर्वस्य हृदि संस्थितः । अणिमा लघिमा प्राप्तिरीशानो ज्योतिरव्ययः ॥ ४२॥ त्वयि बुद्धिर्मतिर्लोकाः
    प्रपन्नाः संश्रिताश्च ये । ध्यानिनो नित्ययोगाश्च सत्यसन्धा जितेन्द्रियाः ॥ ४३॥ यस्त्वां ध्रुवं वेदयते
    गुहाशयं प्रभुं पुराणं पुरुषं विश्वरूपम् । हिरण्मयं बुद्धिमतां परां गतिं स बुद्धिमान्बुद्धिमतीत्य तिष्ठति
    ॥ ४४॥ विदित्वा सप्त सूक्ष्माणि षडङ्गं त्वां च मूर्तितः । प्रधानविधियोगस्थस्त्वामेव विशते बुधः ॥ ४५॥
    इति महाभारते अनुशासनपर्वणि १५ अध्यायान्तर्गतं श्रीकृष्णकृतं शिवस्तोत्रं सम्पूर्णम् । महाभारत । अनुपर्व
    । अध्याय १५
