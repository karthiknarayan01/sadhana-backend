id: sudarshana-ashtottara-sata-namavali
category: stotram
name:
  english: Sudarshana Ashtottara Sata Namavali
  devanagari: सुदर्शनाष्टोत्तरशतनामावली
content:
  english: '|| shrih || om shri sudarshanaya namah | om cakrarajaya namah | om tejovyuhaya namah | om
    mahadyutaye namah | om sahasra-bahave namah | 5| om diptangaya namah | om arunakshaya namah | om pratapavate
    namah | om anekaditya-samkashaya namah | om prodyajjvalabhiranjitaya namah | 10| om saudamini-sahasrabhaya
    namah | om manikundala-shobhitaya namah | om pancabhutamano-rupaya namah | om shatkonantara-samsthitaya
    namah | om harantahkaranodbhutarosha- bhishana vigrahaya namah | 15| om haripanilasatpadmavihara-
    manoharaya namah | om shrakararupaya namah | om sarvajnaya namah | om sarvalokarcitaprabhave namah
    | om caturdashasahasraraya namah | 20| om caturvedamayaya namah | om analaya namah | om bhaktacandramasa-jyotishe
    namah | om bhavaroga-vinashakaya namah | om rephatmakaya namah | 25| om makaraya namah | om rakshosrigrushitangaya
    namah | om sarvadaityagrivanala-vibhedana- mahagajaya namah | om bhima-damshtraya namah | om ujjvalakaraya
    namah | 30| om bhimakarmane namah | om trilocanaya namah | om nilavartmane namah | om nityasukhaya
    namah | om nirmalashriyai namah | 35| om niranjanaya namah | om raktamalyambaradharaya namah | om
    raktacandana-rushitaya namah | om rajogunakritaye namah | om shuraya namah | 40| om rakshahkula-yamopamaya
    namah | om nitya-kshemakaraya namah | om prajnaya namah | om pashandajana-khandanaya namah | om narayanajnanuvartine
    namah | 45| om naigamantah-prakashakaya namah | om balinandanadordandakhandanaya namah | om vijayakritaye
    namah | om mitrabhavine namah | om sarvamayaya namah | 50| om tamo-vidhvamsakaya namah | om rajassattvatamodvartine
    namah | om trigunatmane namah | om trilokadhrite namah | om harimayagunopetaya namah | 55| om avyayaya
    namah | om akshasvarupabhaje namah | om paramatmane namah | om param jyotishe namah | om pancakritya-parayanaya
    namah | 60| om jnanashakti-balaishvarya-virya-tejah- prabhamayaya namah | om sadasat-paramaya namah
    | om purnaya namah | om vanmayaya namah | om varadaya namah | 65| om acyutaya namah | om jivaya namah
    | om gurave namah | om hamsarupaya namah | om pancashatpitha-rupakaya namah | 70| om matrikamandaladhyakshaya
    namah | om madhu-dhvamsine namah | om manomayaya namah | om buddhirupaya namah | om cittasakshine
    namah | 75| om saraya namah | om hamsaksharadvayaya namah | om mantra-yantra-prabhavajnaya namah |
    om mantra-yantramayaya namah | om vibhave namah | 80| om srashtre namah | om kriyaspadaya namah |
    om shuddhaya namah | om adharaya namah | om cakra-rupakaya namah | 85| om nirayudhaya namah | om asamrambhaya
    namah | om sarvayudha-samanvitaya namah | om omkara-rupine namah | om purnatmane namah | 90| om amkarassadhya-bandhanaya
    namah | om aimkaraya namah | om vakpradaya namah | om vagmine namah | om shrimkaraishvarya-vardhanaya
    namah | 95| om klimkara-mohanakaraya namah | om humphatkshobhanakritaye namah | om indrarcita-manovegaya
    namah | om dharanibhara-nashakaya namah | om viraradhyaya namah | 100| om vishvarupaya namah | om
    vaishnavaya namah | om vishnu-rupakaya namah | om satyavrataya namah | om satyaparaya namah | 105|
    om satyadharmanushangakaya namah | om narayanakripavyuhatejashcakraya namah | om sudarshanaya namah
    | 108| shrivijayalakshmi-sameta shrisudarshana-parabrahmane namah | || shri sudarshanashtottarashatanamavalih
    sampurna ||'
  devanagari: ॥ श्रीः ॥ ॐ श्री सुदर्शनाय नमः । ॐ चक्रराजाय नमः । ॐ तेजोव्यूहाय नमः । ॐ महाद्युतये नमः
    । ॐ सहस्र-बाहवे नमः । ५। ॐ दीप्ताङ्गाय नमः । ॐ अरुणाक्षाय नमः । ॐ प्रतापवते नमः । ॐ अनेकादित्य-संकाशाय
    नमः । ॐ प्रोद्यज्ज्वालाभिरञ्जिताय नमः । १०। ॐ सौदामिनी-सहस्राभाय नमः । ॐ मणिकुण्डल-शोभिताय नमः । ॐ
    पञ्चभूतमनो-रूपाय नमः । ॐ षट्कोणान्तर-संस्थिताय नमः । ॐ हरान्तःकरणोद्भूतरोष- भीषण विग्रहाय नमः । १५।
    ॐ हरिपाणिलसत्पद्मविहार- मनोहराय नमः । ॐ श्राकाररूपाय नमः । ॐ सर्वज्ञाय नमः । ॐ सर्वलोकार्चितप्रभवे
    नमः । ॐ चतुर्दशसहस्राराय नमः । २०। ॐ चतुर्वेदमयाय नमः । ॐ अनलाय नमः । ॐ भक्तचान्द्रमस-ज्योतिषे नमः
    । ॐ भवरोग-विनाशकाय नमः । ॐ रेफात्मकाय नमः । २५। ॐ मकाराय नमः । ॐ रक्षोसृग्रूषिताङ्गाय नमः । ॐ सर्वदैत्यग्रीवानाल-विभेदन-
    महागजाय नमः । ॐ भीम-दंष्ट्राय नमः । ॐ उज्ज्वलाकाराय नमः । ३०। ॐ भीमकर्मणे नमः । ॐ त्रिलोचनाय नमः ।
    ॐ नीलवर्त्मने नमः । ॐ नित्यसुखाय नमः । ॐ निर्मलश्रियै नमः । ३५। ॐ निरञ्जनाय नमः । ॐ रक्तमाल्यांबरधराय
    नमः । ॐ रक्तचन्दन-रूषिताय नमः । ॐ रजोगुणाकृतये नमः । ॐ शूराय नमः । ४०। ॐ रक्षःकुल-यमोपमाय नमः । ॐ
    नित्य-क्षेमकराय नमः । ॐ प्राज्ञाय नमः । ॐ पाषण्डजन-खण्डनाय नमः । ॐ नारायणाज्ञानुवर्तिने नमः । ४५।
