id: ramajayaramajayajayaramamantramahatmyam
category: mantra
name:
  english: ramajayaramajayajayaramamantramahatmyam
  devanagari: रामजयरामजयजयराममन्त्रमहात्म्यम्
content:
  english: 7687 shrirama nama mritamantra bija sanjivani cenmanasi pravishta | hala halam va pralayanalam
    va mrityormukhe va vishatam kutobhi || 2|| shrishabda purvam jaya shabda madhyam jaya dvaye na'pi
    punah prayuktam | trisapta krittva raghunatha namah japanni hanyan dvijakoti hatya || 3||
  devanagari: ७६८७ श्रीराम नामा मृतमन्त्र बीज सञ्जीवनी चेन्मनसि प्रविष्टा । हाला हलं वा प्रलयानलं वा मृत्योर्मुखे
    वा विशतां कुतोभी ॥ २॥ श्रीशब्द पूर्वं जय शब्द मध्यं जय द्वये नाऽपि पुनः प्रयुक्तम् । त्रिसप्त कृत्त्वा
    रघुनाथ नामः जपन्नि हन्यान् द्विजकोटि हत्या ॥ ३॥
meaning: {}
