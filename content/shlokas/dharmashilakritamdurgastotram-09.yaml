id: dharmashilakritamdurgastotram-09
category: stotram
name:
  english: dharmashilakritamdurgastotram 09
  devanagari: धर्मशीलकृतंदुर्गास्तोत्रम् ०९
content:
  english: dharmashilakritam durgastotram 9 dharmashila uvaca | eka tu prakritirnitya sarvavarnasvarupini
    || 6|| sa tvam bhagavati sakshattvaya sarvamidam tatam | tvadajnaya surashreshtho racitva lokamuttamam
    || 7|| mahalakshmya tvaya sarddham bubhuje nirmalam sukham | tvadbhaktya bhagavanvishnustrailokyam
    brahmanirmitam || 8|| palayamshca mahalakshmya tvaya sarddham sanatani | tvadbalena mahadevi trailokyam
    vishnupalitam || 9|| mahakalya tvaya sarddham bhasma kritva virajate | sarve devastatha daityah pitaro
    manujah khagah || 10|| tvallilaya ca te jata jaganmatarnamo'stu te | ityuktavantam nripatim vaguvacasharirini
    || 11|| iti bhavishyapurane pratisargaparvani dvitiyakhande shashthadhyayantargatam dharamashilakritam
    durgastatram samaptam | bhavishyapurana | pratisargaparva | dvitiyakhanda | adhyaya 6
  devanagari: धर्मशीलकृतं दुर्गास्तोत्रम् ९ धर्मशील उवाच । एका तु प्रकृतिर्नित्या सर्ववर्णस्वरूपिणी ॥
    ६॥ सा त्वं भगवती साक्षात्त्वया सर्वमिदं ततम् । त्वदाज्ञया सुरश्रेष्ठो रचित्वा लोकमुत्तमम् ॥ ७॥ महालक्ष्म्या
    त्वया सार्द्धं बुभुजे निर्मलं सुखम् । त्वद्भक्त्या भगवान्विष्णुस्त्रैलोक्यं ब्रह्मनिर्मितम् ॥ ८॥ पालयंश्च
    महालक्ष्म्या त्वया सार्द्धं सनातनि । त्वद्बलेन महादेवि त्रैलोक्यं विष्णुपालितम् ॥ ९॥ महाकाल्या त्वया
    सार्द्धं भस्म कृत्वा विराजते । सर्वे देवास्तथा दैत्याः पितरो मनुजाः खगाः ॥ १०॥ त्वल्लीलया च ते जाता
    जगन्मातर्नमोऽस्तु ते । इत्युक्तवन्तं नृपतिं वागुवाचाशरीरिणी ॥ ११॥ इति भविष्यपुराणे प्रतिसर्गपर्वणि
    द्वितीयखण्डे षष्ठाध्यायान्तर्गतं धरमशीलकृतं दुर्गास्तत्रं समाप्तम् । भविष्यपुराण । प्रतिसर्गपर्व ।
    द्वितीयखण्ड । अध्याय ६
