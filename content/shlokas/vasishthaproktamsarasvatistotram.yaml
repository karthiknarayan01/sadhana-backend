id: vasishthaproktamsarasvatistotram
category: stotram
name:
  english: vasishthaproktamsarasvatistotram
  devanagari: वसिष्ठप्रोक्तंसरस्वतीस्तोत्रम्
content:
  english: vasishthaproktam sarasvatistotram vasishtha uvaca | pitamahasya sarasah pravrittasi sarasvati
    | vyaptam tvaya jagatsarvam tavaivambhobhiruttamaih || 13|| tvamevakashaga devi megheshu srijase payah
    | sarvastvapastvameveti tvatto vayamadhimahe || 14|| pushtirdhritistatha kirtih siddhih kantih kshama
    tatha | svadha svaha tatha vani tavayattamidam jagat || 15|| tvameva sarvabhuteshu vanirupena samsthita
    | evam sarasvati tena stuta bhagavati tada || 16|| iti vamanapurane catvarimshadhyayantargatam vasishthaproktam
    sarasvatistotram samaptam | vamanapurana | adhyaya 40
  devanagari: वसिष्ठप्रोक्तं सरस्वतीस्तोत्रम् वसिष्ठ उवाच । पितामहस्य सरसः प्रवृत्तासि सरस्वति । व्याप्तं
    त्वया जगत्सर्वं तवैवाम्भोभिरुत्तमैः ॥ १३॥ त्वमेवाकाशगा देवी मेघेषु सृजसे पयः । सर्वास्त्वापस्त्वमेवेति
    त्वत्तो वयमधीमहे ॥ १४॥ पुष्टिर्धृतिस्तथा कीर्तिः सिद्धिः कान्तिः क्षमा तथा । स्वधा स्वाहा तथा वाणी
    तवायत्तमिदं जगत् ॥ १५॥ त्वमेव सर्वभूतेषु वाणीरूपेण संस्थिता । एवं सरस्वती तेन स्तुता भगवती तदा ॥ १६॥
    इति वामनपुराणे चत्वारिंशाध्यायान्तर्गतं वसिष्ठप्रोक्तं सरस्वतीस्तोत्रं समाप्तम् । वामनपुराण । अध्याय
    ४०
