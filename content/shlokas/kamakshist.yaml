  english: shrikamakshistotram 1 karanaparacidrupa kancipurasimni kamapithagata | kacana viharati karuna
    kashmirastabakakomalangalata || 1|| mu
  devanagari: श्रीकामाक्षिस्तोत्रम् १ कारणपरचिद्रूपा काञ्चीपुरसीम्नि कामपीठगता । काचन विहरति करुणा काश्मीरस्तबककोमलाङ्गलता
    ॥ १॥ मू
