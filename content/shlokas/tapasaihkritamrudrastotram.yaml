id: tapasaihkritamrudrastotram
category: stotram
name:
  english: tapasaihkritamrudrastotram
  devanagari: तापसैःकृतंरुद्रस्तोत्रम्
content:
  english: tapasaih kritam rudrastotram tapasa ucuh | namo devadhidevaya sarvadevamayaya ca | namah shantaya
    sukshmaya namashcandhakabhedine || 18|| namo'stu sarvarudrebhyo ye divam samshritah sada | jivapayanti
    jagatim vayubhishca prithagvidhaih || 19|| namo'stu sarvarudrebhyo ye sthita varunim disham | rakshanti
    sarvalokamshca pishacanam duratmanam || 20|| namo'stu sarvarudrebhyo dishamurdhvam samashritah | rakshanti
    sakalamllokanbhutarnam jambhakadbhayat || 21|| namo'stu sarvarudrebhyo ye'dha urdhvam samashritah
    | rakshanti sakalamllokankushmandanam bhayatsada || 22|| asankhyatah sahasrani ye rudra bhumimashritah
    | namastebhyo'pi sarvebhyastesham rakshanti ye rujah || 23|| iti shriskandapurane nagarakhande shatsaptatitamadhikadvishatatamadhyayantargatam
    tapasaih kritam rudrastotram samaptam | skandapurana | nagarakhanda | adhyaya 276
  devanagari: तापसैः कृतं रुद्रस्तोत्रम् तापसा ऊचुः । नमो देवाधिदेवाय सर्वदेवमयाय च । नमः शान्ताय सूक्ष्माय
    नमश्चान्धकभेदिने ॥ १८॥ नमोऽस्तु सर्वरुद्रेभ्यो ये दिवं संश्रिताः सदा । जीवापयन्ति जगतीं वायुभिश्च
    पृथग्विधैः ॥ १९॥ नमोऽस्तु सर्वरुद्रेभ्यो ये स्थिता वारुणीं दिशम् । रक्षन्ति सर्वलोकांश्च पिशाचानां
    दुरात्मनाम् ॥ २०॥ नमोऽस्तु सर्वरुद्रेभ्यो दिशमूर्ध्वं समाश्रिताः । रक्षन्ति सकलांल्लोकान्भूतार्नां
    जम्भकाद्भयात् ॥ २१॥ नमोऽस्तु सर्वरुद्रेभ्यो येऽध ऊर्ध्वं समाश्रिताः । रक्षन्ति सकलांल्लोकान्कूष्माण्डानां
    भयात्सदा ॥ २२॥ असङ्ख्याताः सहस्राणि ये रुद्रा भूमिमाश्रिताः । नमस्तेभ्योऽपि सर्वेभ्यस्तेषां रक्षन्ति
    ये रुजः ॥ २३॥ इति श्रीस्कन्दपुराणे नागरखण्डे षट्सप्ततितमाधिकद्विशततमाध्यायान्तर्गतं तापसैः कृतं रुद्रस्तोत्रं
    समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय २७६
