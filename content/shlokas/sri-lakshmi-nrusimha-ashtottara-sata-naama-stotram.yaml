id: sri-lakshmi-nrusimha-ashtottara-sata-naama-stotram
category: stotram
name:
  english: Sri Lakshmi Nrusimha Ashtottara Sata Naama Stotram
content:
  english: narasimho mahasimho divyasimho mahabalah | ugrasimho mahadevasstambhajashcogralocanah || ||
    raudrassarvadbhutah shriman yoganandastrivikramah | harih kolahalashcakri vijayo jayavardhanah ||
    || pancananah parabrahma ca'ghoro ghoravikramah | jvalanmukho jvalamali mahajvalo mahaprabhuh || ||
    nitilakshassahasraksho durnirikshah pratapanah | mahadamshtrayudhah prajnashcandakopi sadashivah ||
    || hiranyakashipudhvamsi daityadanavabhanjanah | gunabhadro mahabhadro balabhadrassubhadrakah || ||
    karalo vikaralashca vikarta sarvakartrikah | shimshumarastrilokatma ishassarveshvaro vibhuh || ||
    bhairavadambaro divyashca'cyutah kavi madhavah | adhokshajo'ksharashsharvo vanamali varapradah ||
    || vishvambharo'dbhuto bhavyah shrivishnuh purushottamah | anaghastro nakhastrashca suryajyotissureshvarah
    || || sahasrabahuhssarvajnassarvasiddhipradayakah | vajradamshtro vajranakho mahanandah parantapah
    || || sarvamantraikarupashca sarvayantravidaranah | sarvatantratmako'vyaktassuvyakto bhaktavatsalah
    || || vaishakhashuklabhutotthah sharanagatavatsalah | udarakirtih punyatma mahatma candavikramah ||
    || vedatrayaprapujyashca bhagavanparameshvarah | shrivatsankah shrinivaso jagadvyapi jaganmayah ||
    || jagatpalo jagannatho mahakayo dvirupabhrit | paramatma paranjyotirnirgunashca nrikesari || || paratattvah
    parandhama saccidanandavigrahah | lakshminrisimhassarvatma dhirah prahladapalakah || || idam shrimannrisimhasya
    namnamashtottaram shatam | trisandhyam yah pathedbhaktya sarvabhishtamavapnuyat || || iti shrinrisimhapujakalpe
    shri lakshminrisimhashtottarashatanama stotram |
  devanagari: नारसिंहो महासिंहो दिव्यसिंहो महाबलः । उग्रसिंहो महादेवस्स्तम्भजश्चोग्रलोचनः ॥ ॥ रौद्रस्सर्वाद्भुतः
    श्रीमान् योगानन्दस्त्रिविक्रमः । हरिः कोलाहलश्चक्री विजयो जयवर्धनः ॥ ॥ पञ्चाननः परब्रह्म चाऽघोरो घोरविक्रमः
    । ज्वलन्मुखो ज्वालमाली महाज्वालो महाप्रभुः ॥ ॥ निटिलाक्षस्सहस्राक्षो दुर्निरीक्षः प्रतापनः । महादंष्ट्रायुधः
    प्राज्ञश्चण्डकोपी सदाशिवः ॥ ॥ हिरण्यकशिपुध्वंसी दैत्यदानवभञ्जनः । गुणभद्रो महाभद्रो बलभद्रस्सुभद्रकः
    ॥ ॥ करालो विकरालश्च विकर्ता सर्वकर्तृकः । शिंशुमारस्त्रिलोकात्मा ईशस्सर्वेश्वरो विभुः ॥ ॥ भैरवाडम्बरो
    दिव्यश्चाऽच्युतः कवि माधवः । अधोक्षजोऽक्षरश्शर्वो वनमाली वरप्रदः ॥ ॥ विश्वम्भरोऽद्भुतो भव्यः श्रीविष्णुः
    पुरुषोत्तमः । अनघास्त्रो नखास्त्रश्च सूर्यज्योतिस्सुरेश्वरः ॥ ॥ सहस्रबाहुःस्सर्वज्ञस्सर्वसिद्धिप्रदायकः
    । वज्रदंष्ट्रो वज्रनखो महानन्दः परन्तपः ॥ ॥ सर्वमन्त्रैकरूपश्च सर्वयन्त्रविदारणः । सर्वतन्त्रात्मकोऽव्यक्तस्सुव्यक्तो
    भक्तवत्सलः ॥ ॥ वैशाखशुक्लभूतोत्थः शरणागतवत्सलः । उदारकीर्तिः पुण्यात्मा महात्मा चण्डविक्रमः ॥ ॥ वेदत्रयप्रपूज्यश्च
    भगवान्परमेश्वरः । श्रीवत्साङ्कः श्रीनिवासो जगद्व्यापी जगन्मयः ॥ ॥ जगत्पालो जगन्नाथो महाकायो द्विरूपभृत्
    । परमात्मा परञ्ज्योतिर्निर्गुणश्च नृकेसरी ॥ ॥ परतत्त्वः परन्धाम सच्चिदानन्दविग्रहः । लक्ष्मीनृसिंहस्सर्वात्मा
    धीरः प्रह्लादपालकः ॥ ॥ इदं श्रीमन्नृसिंहस्य नाम्नामष्टोत्तरं शतम् । त्रिसन्ध्यं यः पठेद्भक्त्या सर्वाभीष्टमवाप्नुयात्
    ॥ ॥ इति श्रीनृसिंहपूजाकल्पे श्री लक्ष्मीनृसिंहाष्टोत्तरशतनाम स्तोत्रम् ।
