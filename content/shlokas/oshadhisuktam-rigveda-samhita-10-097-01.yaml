id: oshadhisuktam-rigveda-samhita-10-097-01
category: sukta
name:
  english: oshadhisuktam (rigveda samhita 10|097|01)
  devanagari: ओषधिसूक्तम् (ऋग्वेद संहिता १०।०९७।०१)
content:
  english: 23 svararahitam | ya oshadhih purva jata devebhyastriyugam pura | manai nu babhrunamaham shatam
    dhamani sapta ca || 10
  devanagari: २३ स्वररहितम् । या ओषधीः पूर्वा जाता देवेभ्यस्त्रियुगं पुरा । मनै नु बभ्रूणामहं शतं धामानि
    सप्त च ॥ १०
meaning: {}
