id: niralamba
category: upanishad
name:
  english: niralamba
  devanagari: निरलम्ब
content:
  english: niralambopanishat yatralambalambibhavo vidyate na kadacana | jnavijnasamyagjnalambam niralambam
    harim bhaje || om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || om namah shivaya gurave saccidananda murtaye | nishprapancaya shantaya
    niralambaya tejase || niralambam samashritya salambam vijahati yah | sa samnyasi ca yogi ca kaivalyam
    padamashnute | eshamajnanajantunam samastarishtashantaye | yadyadboddhavyamakhilam tadashankya bravimyaham
    || kim brahma | ka ishvarah | ko jivah | ka prakritih | kah paramatma | ko brahma | ko vishnuh | ko
    rudrah | ka indrah | kah shamanah | kah suryah | kashcandrah | ke surah | ke asurah | ke pishacah
    | ke manushyah | kah striyah | ke pashvadayah | kim sthavaram | ke brahmanadayah | ka jatih | kim
    karma | kimakarma | kim jnanam | kimajnanam | kim sukham | kim duhkham | kah svargah | ko narakah
    | ko bandhah | ko mokshah | ka upasyah | kah shishyah | ko vidvan | ko mudhah | kimasuram | kim tapah
    | kim paramam padam | kim grahyam | kimagrahyam | kah samnyasityahashankyaha brahmeti | sa hovaca
    mahadahankaraprithivyaptejovayvakashatvena brihadrupenandakoshena karmajnanartharupataya bhasamanamadvitiyamakhilopadhivinirmuktam
    tatsakalashaktyupabrimhitamanadyanantam shuddham shivam shantam nirgunamityadi
  devanagari: निरालम्बोपनिषत् यत्रालम्बालम्बिभावो विद्यते न कदाचन । ज्ञविज्ञसम्यग्ज्ञालम्बं निरालम्बं
    हरिं भजे ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ
    शान्तिः शान्तिः शान्तिः ॥ ॐ नमः शिवाय गुरवे सच्चिदानन्द मूर्तये । निष्प्रपञ्चाय शान्ताय निरालम्बाय
    तेजसे ॥ निरालम्बं समाश्रित्य सालम्बं विजहाति यः । स संन्यासी च योगी च कैवल्यं पदमश्नुते । एषमज्ञानजन्तूनां
    समस्तारिष्टशान्तये । यद्यद्बोद्धव्यमखिलं तदाशङ्क्य ब्रवीम्यहम् ॥ किं ब्रह्म । क ईश्वरः । को जीवः ।
    का प्रकृतिः । कः परमात्मा । को ब्रह्मा । को विष्णुः । को रुद्रः । क इन्द्रः । कः शमनः । कः सूर्यः
    । कश्चन्द्रः । के सुराः । के असुराः । के पिशाचाः । के मनुष्याः । काः स्त्रियः । के पश्वादयः । किं
    स्थावरम् । के ब्राह्मणादयः । का जातिः । किं कर्म । किमकर्म । किं ज्ञानम् । किमज्ञानम् । किं सुखम्
    । किं दुःखम् । कः स्वर्गः । को नरकः । को बन्धः । को मोक्षः । क उपास्यः । कः शिष्यः । को विद्वान् ।
    को मूढः । किमासुरम् । किं तपः । किं परमं पदम् । किं ग्राह्यम् । किमग्राह्यम् । कः संन्यासीत्याहशङ्क्याह
    ब्रह्मेति । स होवाच महदहङ्कारपृथिव्यप्तेजोवाय्वाकाशत्वेन बृहद्रूपेणाण्डकोशेन कर्मज्ञानार्थरूपतया भासमानमद्वितीयमखिलोपाधिविनिर्मुक्तं
    तत्सकलशक्त्युपबृंहितमनाद्यनन्तं शुद्धं शिवं शान्तं निर्गुणमित्यादि
