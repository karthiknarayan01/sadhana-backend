id: ganeshakritamshriradhastotram-09
category: stotram
name:
  english: ganeshakritamshriradhastotram 09
  devanagari: गणेशकृतंश्रीराधास्तोत्रम् ०९
content:
  english: ganeshakritam shriradhastotram 9 ganesha uvaca | tava puja jaganmatarlokashikshakari shubhe
    | brahmasvarupa bhavati krishnavakshahsthalasthita || 3|| yatpadapadmamatulam dhyayante te sudurlabham
    | sura brahmeshasheshadya munindrah sanakadayah || 4|| jivanmuktashca bhaktashca siddhendrah kapiladayah
    | tasya pranadhidevi tvam priya pranadhika para || 5|| vamanganirmita radha dakshinangashca madhavah
    | mahalakshmirjaganmata tava vamanganirmita || 6|| vasoh sarvanivasasya prasustvam parameshvari |
    vedanam jagatameva mulprakritirishvari || 7|| sarvah prakritika matah srishtyam ca tvadvibhutayah
    | vishvani karyarupani tvam ca karanarupini || 8|| pralaye brahmanah pate tannimesho harerapi | adau
    radham samuccarya pashcatkrishnam paratparam || 9|| sa eva pandito yogi golokam yati lilaya | vyatikrame
    mahapapi brahmahatyam labheddhruvam || 10|| jagatam bhavati mata paramatma pita harih | pitureva gururmata
    pujya vandya paratpara || 11|| bhajate devamanyam va krishnam va sarvakaranam | punyakshetre mahamudho
    yadi nindati radhikam || 12|| vamshahanirbhavettasya duhkhashokamihaiva ca | pacyate niraye ghore
    yavaccandradivakarau || 13|| gurushca jnanodgiranajjnanam syanmantratantrayoh | sa ca mantrashca tattantram
    bhaktih syaddhruvayoryatah || 14|| nishevya mantram devanam jiva janmani janmani | bhakta bhavanti
    durgayah padapadme sudurlabhe || 15|| nishevya mantre shambhoshca jagatam karanasya ca | tada prapnoti
    yuvayoh padapadmam sudurlabham || 16|| yuvayoh padapadmam ca durlabham prapya punyavan | kshanardham
    shodashamsham ca nahi muncati daivatah || 17|| bhaktya ca yuvayormantram grihitva vaishnavadapi |
    stavam va kavacam va'pi karmamulanikrintanam || 18|| yojapet paraya bhaktya punyakshetre ca bharate
    | purushanam sahasram ca tvatmana sardhamuddharet || 19|| gurumabhyarcya vidhivadvastralankaracandanaih
    | kavacam dharayedyo hi vishnutulyo bhaveddhruvam || 20|| iti brahmavaivartapurane shrikrishnajanmakhande
    purvabhage caturvimshadhikashatatamadhyayantargatam ganeshakritam shriradhastotram samaptam | brahmavaivartapurana
    | shrikrishnajanma
  devanagari: गणेशकृतं श्रीराधास्तोत्रम् ९ गणेश उवाच । तव पूजा जगन्मातर्लोकशिक्षाकरी शुभे । ब्रह्मस्वरूपा
    भवती कृष्णवक्षःस्थलस्थिता ॥ ३॥ यत्पादपद्ममतुलं ध्यायन्ते ते सुदुर्लभम् । सुरा ब्रह्मेशशेषाद्या मुनीन्द्राः
    सनकादयः ॥ ४॥ जीवन्मुक्ताश्च भक्ताश्च सिद्धेन्द्राः कपिलादयः । तस्य प्राणाधिदेवी त्वं प्रिया प्राणाधिका
    परा ॥ ५॥ वामाङ्गनिर्मिता राधा दक्षिणाङ्गश्च माधवः । महालक्ष्मीर्जगन्माता तव वामाङ्गनिर्मिता ॥ ६॥ वसोः
    सर्वनिवासस्य प्रसूस्त्वं परमेश्वरी । वेदानां जगतामेव मूल्प्रकृतिरीश्वरी ॥ ७॥ सर्वाः प्राकृतिका मातः
    सृष्ट्यां च त्वद्विभूतयः । विश्वानि कार्यरूपाणि त्वं च कारणरूपिणी ॥ ८॥ प्रलये ब्रह्मणः पाते तन्निमेषो
    हरेरपि । आदौ राधां समुच्चार्य पश्चात्कृष्णं परात्परम् ॥ ९॥ स एव पण्डितो योगी गोलोकं याति लीलया । व्यतिक्रमे
    महापापी ब्रह्महत्यां लभेद्ध्रुवम् ॥ १०॥ जगतां भवती माता परमात्मा पिता हरिः । पितुरेव गुरुर्माता पूज्या
    वन्द्या परात्परा ॥ ११॥ भजते देवमन्यं वा कृष्णं वा सर्वकारणम् । पुण्यक्षेत्रे महामूढो यदि निन्दति राधिकाम्
    ॥ १२॥ वंशहानिर्भवेत्तस्य दुःखशोकमिहैव च । पच्यते निरये घोरे यावच्चन्द्रदिवाकरौ ॥ १३॥ गुरुश्च ज्ञानोद्गिरणाज्ज्ञानं
    स्यान्मन्त्रतन्त्रयोः । स च मन्त्रश्च तत्तन्त्रं भक्तिः स्याद्ध्रुवयोर्यतः ॥ १४॥ निषेव्य मन्त्रं देवानां
    जीवा जन्मनि जन्मनि । भक्ता भवन्ति दुर्गायाः पादपद्मे सुदुर्लभे ॥ १५॥ निषेव्य मन्त्रे शम्भोश्च जगतां
    कारणस्य च । तदा प्राप्नोति युवयोः पादपद्मं सुदुर्लभम् ॥ १६॥ युवयोः पादपद्मं च दुर्लभं प्राप्य पुण्यवान्
    । क्षणार्धं षोडशांशं च नहि मुञ्चति दैवतः ॥ १७॥ भक्त्या च युवयोर्मन्त्रं गृहीत्वा वैष्णवादपि । स्तवं
    वा कवचं वाऽपि कर्ममूलनिकृन्तनम् ॥ १८॥ योजपेत् परया भक्त्या पुण्यक्षेत्रे च भारते । पुरुषाणां सहस्रं
    च त्वात्मना सार्धमुद्धरेत् ॥ १९॥ गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः । कवचं धारयेद्यो हि विष्णुतुल्यो
    भवेद्ध्रुवम् ॥ २०॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वभागे चतुर्विंशाधिकशततमाध्यायान्तर्गतं
    गणेशकृतं श्रीराधास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
