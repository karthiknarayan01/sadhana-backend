id: navagrahagayatri
category: mantra
name:
  english: navagrahagayatri
  devanagari: नवग्रहगायत्री
content:
  english: shani shani om kakadhvajaya vidmahe khadgahastaya dhimahi tanno mandah pracodayat || shani
    om shanaishcaraya vidmahe suryaputraya dhimahi tanno mandah pracodayat || shani om suryaputraya vidmahe
    mrityurupaya dhimahi tannah saurih pracodayat || shani om nilanjanaya vidmahe suryaputraya dhimahi
    tannah shanaishcarah pracodayat || shani om bhagabhavaya vidmahe mrityurupaya dhimahi tannah shanaishcarah
    pracodayat || rahu rahu om nakadhvajaya vidmahe padmahastaya dhimahi tanno rahuh pracodayat || rahu
    om shirorupaya vidmahe amriteshaya dhimahi tanno rahuh pracodayat || rahu om nilambaraya ca vidmahe
    shuladharaya dhimahi tanno rahuh pracodayat || ketu ketu om ashvadhvajaya vidmahe shulahastaya dhimahi
    tannah ketuh pracodayat || ketu om gadahastaya vidmahe amriteshaya dhimahi tannah ketuh pracodayat
    || ketu om citravarnaya vidmahe sarparupaya dhimahi tannah ketuh pracodayat || ketu om dhumravarnaya
    vidmahe vikritananaya dhimahi tannah ketuh pracodayat || ketu om padmaputraya vidmahe amriteshaya
    dhimahi tannah ketuh pracodayat ||
  devanagari: शनी शनी ॐ काकध्वजाय विद्महे खड्गहस्ताय धीमहि तन्नो मन्दः प्रचोदयात् ॥ शनी ॐ शनैश्चराय विद्महे
    सूर्यपुत्राय धीमहि तन्नो मन्दः प्रचोदयात् ॥ शनी ॐ सूर्यपुत्राय विद्महे मृत्युरूपाय धीमहि तन्नः सौरिः
    प्रचोदयात् ॥ शनी ॐ नीलाञ्जनाय विद्महे सूर्यपुत्राय धीमहि तन्नः शनैश्चरः प्रचोदयात् ॥ शनी ॐ भगभवाय
    विद्महे मृत्युरूपाय धीमहि तन्नः शनैश्चरः प्रचोदयात् ॥ राहु राहु ॐ नाकध्वजाय विद्महे पद्महस्ताय धीमहि
    तन्नो राहुः प्रचोदयात् ॥ राहु ॐ शिरोरूपाय विद्महे अमृतेशाय धीमहि तन्नो राहुः प्रचोदयात् ॥ राहु ॐ नीलाम्बराय
    च विद्महे शूलधराय धीमहि तन्नो राहुः प्रचोदयात् ॥ केतु केतु ॐ अश्वध्वजाय विद्महे शूलहस्ताय धीमहि तन्नः
    केतुः प्रचोदयात् ॥ केतु ॐ गदाहस्ताय विद्महे अमृतेशाय धीमहि तन्नः केतुः प्रचोदयात् ॥ केतु ॐ चित्रवर्णाय
    विद्महे सर्परूपाय धीमहि तन्नः केतुः प्रचोदयात् ॥ केतु ॐ धूम्रवर्णाय विद्महे विकृताननाय धीमहि तन्नः
    केतुः प्रचोदयात् ॥ केतु ॐ पद्मपुत्राय विद्महे अमृतेशाय धीमहि तन्नः केतुः प्रचोदयात् ॥
