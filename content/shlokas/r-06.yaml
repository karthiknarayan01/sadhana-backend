id: r-06
category: veda
name:
  english: r 06
  devanagari: र् ०६
content:
  english: 05 a̱gnima̭gnim vah sa̱midha̭ duvasyata pri̱yampri̭yam vo̱ ati̭thim grini̱shani̭ | upa̭ vo
    gi̱rbhira̱mrita̭m vivasata de̱vo de̱veshu̱ vana̭te̱ hi varya̭m de̱vo de̱veshu̱ vana̭te̱ hi no̱ duva̭h
    || 6
  devanagari: ०५ अ॒ग्निम॑ग्निं वः स॒मिधा॑ दुवस्यत प्रि॒यम्प्रि॑यं वो॒ अति॑थिं गृणी॒षणि॑ । उप॑ वो गी॒र्भिर॒मृतं॑
    विवासत दे॒वो दे॒वेषु॒ वन॑ते॒ हि वार्यं॑ दे॒वो दे॒वेषु॒ वन॑ते॒ हि नो॒ दुवः॑ ॥ ६
