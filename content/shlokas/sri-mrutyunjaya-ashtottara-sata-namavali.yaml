id: sri-mrutyunjaya-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Mrutyunjaya Ashtottara Sata Namavali
content:
  english: om mrityunjayaya namah | om shulapanine namah | om vajradamshtraya namah | om umapataye namah
    | om sadashivaya namah | om trinayanaya namah | om kalakantaya namah | om nagabhushanaya namah | om
    pinakadrite namah | om gangadharaya namah || || om pashupataye namah | om sambhave namah | om atyugraya
    namah | om aryodamaya namah | om mahadevaya namah | om vishvavyapine namah | om ishvaraya namah |
    om adyaya namah | om sahasrashtaya namah | om shivaya namah || || om sukshushuraya namah | om atindriyaya
    namah | om paranandamayaya namah | om anantaya namah | om vishvamurtaye namah | om maheshvaraya namah
    | om anoraniyase namah | om ishanaya namah | om ashtamurtaya namah | om sitadyutaye namah || || om
    cidatmane namah | om purushaktaya namah | om anandamayaya namah | om jyotirmayaya namah | om bhusvarupaya
    namah | om girishaya namah | om girishaya namah | om aparupaya namah | om bhutiledaya namah | om kalarandhraya
    namah || || om kapaladrite namah | om vidyutenprabhaya namah | om pancavaktraya namah | om dakshamuktakaya
    namah | om aghoraya namah | om vamadevaya namah | om sadyojataya namah | om candramauliye namah |
    om nilaruhaya namah | om divyakanthisamanvitaya namah || || om bhaganetrapraharine namah | om durjatine
    namah | om madanantakaya namah | om darurabhave namah | om vedajihuya namah | om pinakaparishothitaya
    namah | om nilakanthaya namah | om tatpurushaya namah | om shankaraya namah | om jagadishvaraya namah
    || || om giridradanvaye namah | om herambatataya namah | om satanave namah | om maheshvaraya namah
    | om mrigavaidaya namah | om virabhadraya namah | om purarayai namah | om pramathadipaya namah | om
    gangadharaya namah | om vishvakartre namah || || om vishvabhartre namah | om niramayaya namah | om
    vedantavedyaya namah | om niradvandvaya namah | om nirabhasaya namah | om niranjanavaryaya namah |
    om kubera mitraya namah | om nisangaya namah | om nirmalaya namah | om nirgunaya namah || || om vishvasakshine
    namah | om vishvahartre namah | om vishvacaryaya namah | om nigamagauragutyaya namah | om sarvalokavarapradaya
    namah | om nishkalankaya namah | om nirantanakaya namah | om sarvapapartibhavajanaya namah | om tejorupaya
    namah | om niradharaya namah || || om vishveshvaraya namah | om vishvarupaya namah | om vaktrasahasrashobhitraya
    namah | om kapalamalabhananaya namah | om virupakshaya namah | om maharudraya namah | om kalabhairavaya
    namah | om nagendrakundalopitaya namah | om bhargaya namah | om bhargaya namah || || om bhadravataraya
    namah | om apamrityuharaya namah | om kalaya namah | om goraya namah | om shuline namah | om bhayankaraya
    namah | om vishvatomokshasampannaya namah | om mrityunjayaya namah || || || iti shri mrityunjaya ashtottara
    shatanamavalih sampurnam ||
  devanagari: ॐ मृत्युञ्जयाय नमः । ॐ शूलपाणिने नमः । ॐ वज्रदंष्ट्राय नमः । ॐ उमापतये नमः । ॐ सदाशिवाय
