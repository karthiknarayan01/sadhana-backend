id: lakshminrisimhamantraradhanam
category: mantra
name:
  english: lakshminrisimhamantraradhanam
  devanagari: लक्ष्मीनृसिंहमन्त्राराधनम्
content:
  english: shrilakshminrisimhamantraradhanam shri ganeshaya namah | shri lakshminrisimhaya namah | shri
    gurucaranakamalebhyo namah | acamya pranayamah | deshakalau sankirtya | sumukhashcetyadi evangunavisheshanavishishtayam
    punyatithau | mama samastapapakshayartham shrilakshminrisimhadevata prityartham lakshminrisimhamantraradhanamaham
    karishye | tadanga bhushuddhi bhutashuddhi pranapratishtha antarmatrika bahirmatrika nyasadikam karishye
    | iti sankalpya | bhushuddhayadikam kritva | om bhadrankarnebhih iti | om svastina indro vri||| iti
    japitva | om hrim am am im im um um rim rim lim lim em aim om aum am a kam kham gam gham n cam cham
    jam jham n tam tham dam dham nam tam tham dam dham nam pam pham bam bham mam yam ram lam vam sham
    sham sam ham ḻam ksham shrim om || iti japitva || om hamsa hamsaya dhimahi | tanno hamsah pracodayat
    || iti hamsagayatrimantrah || ganapatimantrah | om hrim shrim klim glaum gam ganapataye vara varada
    siddhiganapataye svaha || surya mantrah | om shrim ghrinih suryadivyo || durgamantrah om hrim bhuvaneshvaryai
    namah || asuri mantrah | om namah katuke katuke patre asuri raktavasase || atharvarnasya duhitre ghorakarmanikarake
    || nrisimhasyaprasthitasya gatim bhaja upavishtasya bhagam bhaja shayitasya mano bhaja prabuddhasya
    hridayam bhaja bhaja bhaja bhaja bhaja bhaja bhaja bhaja bhaja tavadbhajam yavanme vashamanaya svaha
    || annapurne mantrah om hrim shrim klim namo bhagavati maheshvari annapurne svaha || mahalakshmi mantrah
    | om shrim hrim klim kam som smitam hiranya prakaramardram jvalantim triptam tarpayantim padmesthitam
    padmavarnam tam ihopahnaye shriyam klim hrim shri om || bakulivagishvari mantrah om aim oshthapidhana
    nakuli dantai parivrittapavih || klim savasyaivaca ishana caru mamiha vadayet | dharana sarasvati
    mantrah || om aim namo brahmane dharanam me astvanirakaranam dharayita bhuyamsam klim karnayoh shrutammacyodvam
    mamamushya om sauh || oshthapidhana nakuli dantaih parivritapavih sarvasyai vaca ishana caru bija
    rahitam || om namo brahmane dharanam me astva nirakaranam dharayita bhuyasam karnayoh shrutam macyo
    dvam mamamushya || oshthapidhana nakuli dantaih parivritta pavih sarvasyai vaca ishana carumamihavadayet
    | vada vada vagvadini svaha || om hrim bagalamukhi mantrah | om hlim bagalamukhi sarvadushtanam vacam
    mukham stambhaya jihva kilaya buddhim vinashaya hlim svaha || om shrim hrim klim mahalakshmi kamaladharinim
    simhavahinyai svaha || om aim hrim kli trim om phat camundayai viccai navarnavamantrah | om hrim trim
    om phat | dakshinakali || om krim krim krim um hum hri krim dakshina kalike krim krim krim hum hum
    hrim hrim svaha || bagalahridaya ashati mantrah || om am hlim prom um glaum em klim hrim bagalamukhi
    aveshaya aveshaya am hrim krom brahmastrarupini ehyehi am hrlim krom mamahridaye ciram tishtha tishtha
    shighrasiddhipradatripura mantrah || aim aim sauh klim klim aim aim klim sauh asya shri shiva shivamantrah
    || om namah shivaya || shivashtakshara mantrah || om hrim hrim namah shivaya || dakshinamurtayemahyam
    medham prajnam prayaccha svaha || mahamrityunjaya mantrah || om haum om jum om sah om bhuh om bhuvah
    om svah om tryambakam yajamahe sugandhim pushtivardhanam || urvarukamivabandhananmrityormukshi yamamritat
    || om svah om bhuvah om svah om mah om jum om haum om || ramamantrah om ram ramaya namah | om shrim
    sitayai svaha || om hrim namo anjaneyaya mahabalaya svaha || iti hanumanmamantrah || atha krishnamantrah
    || om klim krishnaya govindaya gopijanavallabhaya svaha || santana gopalamantrah || om klim devakisuta
    govinndavasudevajagatpate | dehi me nayam krishna tvamaham sharanagatah | lakshmivyankatesha mantrah
    || om krim shrim aim shrim krim shrinivasaya lakshmi vyankateshaya namah | narayana mantrah || om
    namo narayanaya || vasudeva mantrah | om namo bhagavate vasudevaya || om sam somaya namah | om ram
    agnaye svaha | yajurlakshmih mantrah om bhurlakshmih suvahkalakarnitam no lakshmih pracodayat | om
    asya shri lakshminrisimhekakshara mantrasya atririshih gayatri chandah om shri lakshmi nrisimhah paramatmadevata
    om kshraum bijam | om shaktih kilakam | shrilakshminrisimhaprasadasidhyartham jape viniyogah | om
    atraye rishaye namah shirasi gayatri chandase namah mukhe om lakshminrisimhadevatayai namah hridaye
    | om kshraum bijaya namah nabhau padayoh || om shaktaye namah guhye | ram kilakaya namah padayoh om
    shram dhrim tarjanibhyam namah | om shram ksham madhyamabhyam namah | om shram kshramangushthabhyam
    namah | om shrim kshrim tarjanibhyam namah | om shram kshram madhyamabhyam namah | om shraim kshraim
    anamikabhyam namah | om shraum kshraum kanishthikabhyam namah | om shrah kshrah karatalakaraprishthabhyam
    namah | mulena trirvyapakam kuryat || atha dhyanam | om satyajnanamukhasvarupamamalam kshirabdhimadhyasthalim
    | yogarudhamatiprasannavadanam bhushasahasrojvalam | tryakshancakrapinaka sabhayava
  devanagari: श्रीलक्ष्मीनृसिंहमन्त्राराधनम् श्री गणेशाय नमः । श्री लक्ष्मीनृसिंहाय नमः । श्री गुरुचरणकमलेभ्यो
    नमः । आचम्य प्राणायामः । देशकालौ सङ्कीर्त्य । सुमुखश्चेत्यादि एवङ्गुणविशेषणविशिष्टायां पुण्यतिथौ ।
    मम समस्तपापक्षयार्थं श्रीलक्ष्मीनृसिंहदेवता प्रीत्यर्थं लक्ष्मीनृसिंहमन्त्राराधनमहं करिष्ये । तदङ्ग
    भूशुद्धि भूतशुद्धि प्राणप्रतिष्ठा अन्तर्मातृका बहिर्मातृका न्यासादिकं करिष्ये । इति सङ्कल्प्य । भूशुद्धयादिकं
    कृत्वा । ॐ भद्रङ्कर्णेभिः इति । ॐ स्वस्तिन इन्द्रो वृ॥। इति जपित्वा । ॐ ह्रीं अं आं इं ईं उं ऊं ऋं
    ॠं ऌं ॡं एं ऐं ओं औं अं अ कं खं गं घं ङ् चं छं जं झं ञ् टं ठं डं ढं णं तं थं दं धं नं पं फं बं भं
    मं यं रं लं वं शं षं सं हं ळं क्षं श्रीं ॐ ॥ इति जपित्वा ॥ ॐ हंस हंसाय धीमही । तन्नो हंसः प्रचोदयात्
    ॥ इति हंसगायत्रीमन्त्रः ॥ गणपतिमन्त्रः । ॐ ह्रीं श्रीं क्लीं ग्लौं गं गणपतये वर वरद सिद्धिगणपतये स्वाहा
    ॥ सूर्य मन्त्रः । ॐ श्रीं घृणिः सूर्यादिव्यो ॥ दुर्गामन्त्रः ॐ ह्रीं भुवनेश्वर्यै नमः ॥ आसुरी मन्त्रः
    । ॐ नमः कटुके कटुके पत्रे आसुरी रक्तवाससे ॥ अथर्वर्णस्य दुहित्रे घोरकर्मणिकारके ॥ नृसिंहस्यप्रस्थितस्य
    गतिं भज उपविष्टस्य भगं भज शयितस्य मनो भज प्रबुद्धस्य हृदयं भज भज भज भज भज भज भज भज भज तावद्भजं यावन्मे
    वशमानय स्वाहा ॥ अन्नपूर्णे मन्त्रः ॐ ह्रीं श्रीं क्लीं नमो भगवती माहेश्वरी अन्नपूर्णे स्वाहा ॥ महालक्ष्मी
    मन्त्रः । ॐ श्रीं ह्रीं क्लीं कां सों स्मितां हिरण्य प्राकारामार्द्रां ज्वलन्तीं तृप्तां तर्पयन्तीं
    पद्मेस्थितां पद्मवर्णां तां इहोपह्नये श्रियं क्लीं ह्रीं श्री ॐ ॥ बकुलीवागीश्वरी मन्त्रः ॐ ऐं ओष्ठापिधाना
    नकुली दन्तै परिवृत्तपविः ॥ क्लीं सवस्यैवाच ईशाना चारु मामिह वादयेत् । धारणा सरस्वती मन्त्रः ॥ ॐ ऐं
    नमो ब्रह्मणे धारणं मे अस्त्वनिराकरणं धारयिता भूयांसं क्लीं कर्णयोः श्रुतम्माच्योद्वं ममामुष्य ॐ सौः
    ॥ ओष्ठापिधाना नकुली दन्तैः परिवृतापविः सर्वस्यै वाच ईशाना चारु बीज रहितम् ॥ ॐ नमो ब्रह्मणे धारणं मे
    अस्त्व निराकारणं धारयिता भूयासं कर्णयोः श्रुतं माच्यो द्वं ममामुष्य ॥ ओष्ठपिधाना नकुली दन्तैः परिवृत्ता
    पविः सर्वस्यै वाच ईशाना चारुमामिहवादयेत् । वद वद वाग्वादिनी स्वाहा ॥ ॐ ह्रीं बगलामुखी मन्त्रः । ॐ
    ह्लीं बगलामुखि सर्वदुष्टानां वाचं मुखं स्तम्भय जिह्वा कीलय बुद्धिं विनाशय ह्लीं स्वाहा ॥ ॐ श्रीं ह्रीं
    क्लीं महालक्ष्मी कमलधारिणीं सिंहवाहिन्यै स्वाहा ॥ ॐ ऐं ह्रीं क्ली त्रीं ॐ फट् चामुण्डायै विच्चै नवार्णवमन्त्रः
    । ॐ ह्रीं त्रीं ॐ फट् । दक्षिणकाली ॥ ॐ क्रीं क्रीं क्रीं ऊं हूं ह्री क्रीं दक्षिण कालिके क्रीं क्रीं
    क्रीं हूं हूं ह्रीं ह्रीं स्वाहा ॥ बगलाहृदय अशाति मन्त्रः ॥ ॐ आं ह्लीं प्रों ऊं ग्लौं एं क्लीं ह्रीं
    बगलामुखि आवेशय आवेशय आं ह्रीं क्रों ब्रह्मास्त्ररूपिणि एह्येहि आं ह्र्लीं क्रों ममहृदये चिरं तिष्ठ
    तिष्ठ शीघ्रसिद्धिप्रदत्रिपुरा मन्त्रः ॥ ऐं ऐं सौः क्लीं क्लीं ऐं ऐं क्लीं सौः अस्य श्री शिव शिवमन्त्रः
    ॥ ॐ नमः शिवाय ॥ शिवाष्टाक्षर मन्त्रः ॥ ॐ ह्रीं ह्रीं नमः शिवाय ॥ दक्षिणामूर्तयेमह्यं मेधां प्रज्ञां
    प्रयच्छ स्वाहा ॥ महामृत्युञ्जय मन्त्रः ॥ ॐ हौं ॐ जूं ॐ सः ॐ भूः ॐ भुवः ॐ स्वः ॐ त्र्यम्बकं यजामहे
    सुगन्धिं पुष्टिवर्धनम् ॥ उर्वारुकमिवबन्धनान्मृत्योर्मुक्षी यमामृतात् ॥ ॐ स्वः ॐ भुवः ॐ स्वः ॐ मः ॐ
    जूं ॐ हौं ॐ ॥ राममन्त्रः ॐ रां रामाय नमः । ॐ श्रीं सीतायै स्वाहा ॥ ॐ ह्रीं नमो अञ्जनेयाय महाबलाय स्वाहा
    ॥ इति हनुमन्ममन्त्रः ॥ अथ कृष्णमन्त्रः ॥ ॐ क्लीं कृष्णाय गोविन्दाय गोपीजनवल्लभाय स्वाहा ॥ सन्तान गोपालमन्त्रः
    ॥ ॐ क्लीं देवकीसुत गोविन्न्दवासुदेवजगत्पते । देहि मे नयं कृष्ण त्वामहं शरणागतः । लक्ष्मीव्यङ्कटेश
    मन्त्रः ॥ ॐ क्रीं श्रीं ऐं श्रीं क्रीं श्रीनिवासाय लक्ष्मी व्यङ्कटेशाय नमः । नारायण मन्त्रः ॥ ॐ नमो
    नारायणाय ॥ वासुदेव मन्त्रः । ॐ नमो भगवते वासुदेवाय ॥ ॐ सं सोमाय नमः । ॐ रं अग्नये स्वाहा । यजुर्लक्ष्मीः
    मन्त्रः ॐ भूर्लक्ष्मीः सुवःकालकर्णितं नो लक्ष्मीः प्रचोदयात् । ॐ अस्य श्री लक्ष्मीनृसिंहेकाक्षर मन्त्रस्य
    अत्रिऋषिः गायत्री छन्दः ॐ श्री लक्ष्मी नृसिंहः परमात्मादेवता ॐ क्ष्रौं बीजम् । ॐ शक्तिः कीलकम् । श्रीलक्ष्मीनृसिंहप्रसादसिध्यर्थं
    जपे विनियोगः । ॐ अत्रये ऋषये नमः शिरसि गायत्री छन्दसे नमः मुखे ॐ लक्ष्मीनृसिंहदेवतायै नमः हृदये ।
    ॐ क्ष्रौं बीजाय नमः नाभौ पादयोः ॥ ॐ शक्तये नमः गुह्ये । रं कीलकाय नमः पादयोः ॐ श्रां ध्रीं तर्जनीभ्यां
    नमः । ॐ श्रं क्षं मध्यमाभ्यां नमः । ॐ श्रां क्ष्रांअङ्गुष्ठाभ्यां नमः । ॐ श्रीं क्ष्रीं तर्जनीभ्यां
    नमः । ॐ श्रं क्ष्रं मध्यामाभ्यां नमः । ॐ श्रैं क्ष्रैं अनामिकाभ्यां नमः । ॐ श्रौं क्ष्रौं कनिष्ठिकाभ्यां
    नमः । ॐ श्रः क्ष्रः करतलकरपृष्ठाभ्यां नमः । मूलेन त्रिर्व्यापकं कुर्यात् ॥ अथ ध्यानम् । ॐ सत्यज्ञानमुखस्वरूपममलं
    क्षीराब्धिमध्यस्थलीम् । योगारूढमतिप्रसन्नवदनं भूषासहस्रोज्वलम् । त्र्यक्षञ्चक्रपिनाक साभयव
