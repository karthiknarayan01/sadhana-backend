id: maha-ganapati-mantra-vigraha-kavacham
category: stotram
name:
  english: Maha Ganapati Mantra Vigraha Kavacham
content:
  english: om asya shrimahaganapati mantravigraha kavacasya | shrishiva rishih | devigayatri chandah |
    shri mahaganapatirdevata | om shrim hrim klim glaum gam bijani | ganapataye varavaradeti shaktih |
    sarvajanam me vashamanaya svaha kilakam | shri mahaganapatiprasadasiddhyarthe jape viniyogah | karanyasah
    | om shrim hrim klim angushthabhyam namah | glaum gam ganapataye tarjanibhyam namah | varavarada madhyamabhyam
    namah | sarvajanam me anamikabhyam namah | vashamanaya kanishthikabhyam namah | svaha karatala karaprishthabhyam
    namah | nyasah | om shrim hrim klim hridayaya namah | glaum gam ganapataye shirase svaha | varavarada
    shikhayai vashat | sarvajanam me netratrayaya vaushat | svaha astraya phat | dhyanam bijapuragadekshukarmuka
    rija cakrabjapashotpala vrihyagrasvavishanaratnakalashaprodyatkarambhoruhah | dhyeyo vallabhaya sapadmakaraya
    shlishtojvaladbhushaya vishvotpattivipattisamsthitikaro vighnesha ishtarthadah | iti dhyatva | lam
    ityadi manasopacaraih sampujya kavacam pathet | onkaro me shirah patu shrinkarah patu phalakam | hrim
    bijam me lalate'vyat klim bijam bhruyugam mama || || glaum bijam netrayoh patu gam bijam patu nasikam
    | gam bijam mukhapadme'vyadmahasiddhiphalapradam || || nakaro dantayoh patu pakaro lambikam mama |
    takarah patu me talvoryekara oshthayormama || || vakarah kanthadeshe'vyadrakarashcopakanthake | dvitiyastu
    vakaro me hridayam patu sarvada || || rakarastu dvitiyo vai ubhau parshvau sada mama | dakara udare
    patu sakaro nabhimandale || || rvakarah patu me lingam jakarah patu guhyake | nakarah patu me janghe
    mekaro janunordvayoh || || vakarah patu me gulphau shakarah padayordvayoh | makarastu sada patu dakshapadangulishu
    ca || || nakarastu sada patu vamapadangulishu ca | yakaro me sada patu dakshapadatale tatha || ||
    svakaro brahmarupakhyo vamapadatale tatha | hakarah sarvada patu sarvange ganapah prabhuh || || purve
    mam patu shrirudrah shrim hrim klim phat kaladharah | agneyyam me sada patu hrim shrim klim lokamohanah
    || || dakshine shriyamah patu krim hram aim hrim hsraum namah | nairritye nirritih patu am hrim krom
    krom namo namah || || pashcime varunah patu shrim hrim klim phat hsraum namah | vayurme patu vayavye
    hrum hrim shrim hsphrem namo namah || || uttare dhanadah patu shrim hrim shrim hrim dhaneshvarah |
    ishanye patu mam devo hraum hrim jum sah sadashivah || || prapannaparijataya svaha mam patu ishvarah
    | urdhvam me sarvada patu gam glaum klim hsraum namo namah || || anantaya namah svaha adhastaddishi
    rakshatu | purve mam ganapah patu dakshine kshetrapalakah || || pashcime patu mam durga aim hrim klim
    candika shiva | uttare vatukah patu hrim vam vam vatukah shivah || || svaha sarvarthasiddheshca dayako
    vishvanayakah | punah purve ca mam patu shrimanasitabhairavah || || agneyyam patu no hrim hrim hrum
    krom krom rurubhairavah | dakshine patu mam kraum krom hraim hraim me candabhairavah || || nairritye
    patu mam hrim hrum hraum hraum hrim hsraim namo namah | svaha me sarvabhutatma patu mam krodhabhairavah
    || || pashcime ishvarah patu krim klim unmattabhairavah | vayavye patu mam hrim klim kapali kamalekshanah
    || || uttare patu mam devo hrim hrim bhishanabhairavah | ishanye patu mam devah klim hrim samharabhairavah
    || || urdhvam me patu deveshah shrisammohanabhairavah | adhastadvatukah patu sarvatah kalabhairavah
    || || itidam kavacam divyam brahmavidyakalevaram | gopaniyam prayatnena yadicchedatmanah sukham ||
    || jananijaravadgopya vidyaishetyagama jaguh | ashtamyam ca caturdashyam sankrantau grahaneshvapi
    || || bhaume'vashyam patheddhiro mohayatyakhilam jagat | ekavritya bhavedvidya dviravritya dhanam
    labhet || || triravritya rajavashyam turyavritya'khilah prajah | pancavritya gramavashyam shadavritya
    ca mantrinah || || saptavritya sabhavashya ashtavritya bhuvah shriyam | navavritya ca narinam sarvakarshanakarakam
    || || dashavrittih pathennityam shanmasabhyasayogatah | devata vashamayati kim punarmanava bhuvi ||
    || kavacasya ca divyasya sahasravartanannarah | devatadarshanam sadyo natrakarya vicarana || || ardharatre
    samutthaya caturthyam bhriguvasare | raktamalambaradharo raktagandhanulepanah || || savadhanena manasa
    pathedekottaram shatam | svapne murtimayam devam pashyatyeva na samshayah || || idam kavacamajnatva
    ganesham bhajate narah | kotilaksham prajaptvapi na mantram siddhido bhavet || || pushpanjalyashtakam
    datva mulenaiva sakrit pathet | apivarshasahasranam pujayah phalamapnuyat || || bhurje likhitva svarnastam
    gutikam dharayedyadi | kanthe va dakshine bahau sakuryaddasavajjagat || || na deyam parashishyebhyo
    deyam shishyebhya eva ca | abhaktebhyopi putrebhyo datva narakamapnuyat || || ganeshabhaktiyuktaya
    sadhave ca prayatnatah | datavyam tena vighneshah suprasanno bhavishyati || || iti shridevirahasye
    shrimahaganapati mantravigrahakavacam sampurnam |
  devanagari: ॐ अस्य श्रीमहागणपति मन्त्रविग्रह कवचस्य । श्रीशिव ऋषिः । देवीगायत्री छन्दः । श्री महागणपतिर्देवता
    । ॐ श्रीं ह्रीं क्लीं ग्लौं गं बीजानि । गणपतये वरवरदेति शक्तिः । सर्वजनं मे वशमानय स्वाहा कीलकम् ।
    श्री महागणपतिप्रसादसिद्ध्यर्थे जपे विनियोगः । करन्यासः । ॐ श्रीं ह्रीं क्लीं अङ्गुष्ठाभ्यां नमः ।
    ग्लौं गं गणपतये तर्जनीभ्यां नमः । वरवरद मध्यमाभ्यां नमः । सर्वजनं मे अनामिकाभ्यां नमः । वशमानय कनिष्ठिकाभ्यां
    नमः । स्वाहा करतल करपृष्ठाभ्यां नमः । न्यासः । ॐ श्रीं ह्रीं क्लीं हृदयाय नमः । ग्लौं गं गणपतये शिरसे
    स्वाहा । वरवरद शिखायै वषट् । सर्वजनं मे नेत्रत्रयाय वौषट् । स्वाहा अस्त्राय फट् । ध्यानम् बीजापूरगदेक्षुकार्मुक
    ऋजा चक्राब्जपाशोत्पल व्रीह्यग्रस्वविषाणरत्नकलशप्रोद्यत्कराम्भोरुहः । ध्येयो वल्लभया सपद्मकरया श्लिष्टोज्वलद्भूषया
    विश्वोत्पत्तिविपत्तिसंस्थितिकरो विघ्नेश इष्टार्थदः । इति ध्यात्वा । लं इत्यादि मानसोपचारैः सम्पूज्य
    कवचं पठेत् । ओङ्कारो मे शिरः पातु श्रीङ्कारः पातु फालकम् । ह्रीं बीजं मे ललाटेऽव्यात् क्लीं बीजं भ्रूयुगं
    मम ॥ ॥ ग्लौं बीजं नेत्रयोः पातु गं बीजं पातु नासिकाम् । गं बीजं मुखपद्मेऽव्याद्महासिद्धिफलप्रदम् ॥
    ॥ णकारो दन्तयोः पातु पकारो लम्बिकां मम । तकारः पातु मे ताल्वोर्येकार ओष्ठयोर्मम ॥ ॥ वकारः कण्ठदेशेऽव्याद्रकारश्चोपकण्ठके
    । द्वितीयस्तु वकारो मे हृदयं पातु सर्वदा ॥ ॥ रकारस्तु द्वितीयो वै उभौ पार्श्वौ सदा मम । दकार उदरे
    पातु सकारो नाभिमण्डले ॥ ॥ र्वकारः पातु मे लिङ्गं जकारः पातु गुह्यके । नकारः पातु मे जङ्घे मेकारो जानुनोर्द्वयोः
    ॥ ॥ वकारः पातु मे गुल्फौ शकारः पादयोर्द्वयोः । माकारस्तु सदा पातु दक्षपादाङ्गुलीषु च ॥ ॥ नकारस्तु
    सदा पातु वामपादाङ्गुलीषु च । यकारो मे सदा पातु दक्षपादतले तथा ॥ ॥ स्वाकारो ब्रह्मरूपाख्यो वामपादतले
    तथा । हाकारः सर्वदा पातु सर्वाङ्गे गणपः प्रभुः ॥ ॥ पूर्वे मां पातु श्रीरुद्रः श्रीं ह्रीं क्लीं फट्
    कलाधरः । आग्नेय्यां मे सदा पातु ह्रीं श्रीं क्लीं लोकमोहनः ॥ ॥ दक्षिणे श्रीयमः पातु क्रीं ह्रं ऐं
    ह्रीं ह्स्रौं नमः । नैरृत्ये निरृतिः पातु आं ह्रीं क्रों क्रों नमो नमः ॥ ॥ पश्चिमे वरुणः पातु श्रीं
    ह्रीं क्लीं फट् ह्स्रौं नमः । वायुर्मे पातु वायव्ये ह्रूं ह्रीं श्रीं ह्स्फ्रें नमो नमः ॥ ॥ उत्तरे
    धनदः पातु श्रीं ह्रीं श्रीं ह्रीं धनेश्वरः । ईशान्ये पातु मां देवो ह्रौं ह्रीं जूं सः सदाशिवः ॥ ॥
    प्रपन्नपारिजाताय स्वाहा मां पातु ईश्वरः । ऊर्ध्वं मे सर्वदा पातु गं ग्लौं क्लीं ह्स्रौं नमो नमः ॥
    ॥ अनन्ताय नमः स्वाहा अधस्ताद्दिशि रक्षतु । पूर्वे मां गणपः पातु दक्षिणे क्षेत्रपालकः ॥ ॥ पश्चिमे पातु
    मां दुर्गा ऐं ह्रीं क्लीं चण्डिका शिवा । उत्तरे वटुकः पातु ह्रीं वं वं वटुकः शिवः ॥ ॥ स्वाहा सर्वार्थसिद्धेश्च
    दायको विश्वनायकः । पुनः पूर्वे च मां पातु श्रीमानसितभैरवः ॥ ॥ आग्नेय्यां पातु नो ह्रीं ह्रीं ह्रुं
    क्रों क्रों रुरुभैरवः । दक्षिणे पातु मां क्रौं क्रों ह्रैं ह्रैं मे चण्डभैरवः ॥ ॥ नैरृत्ये पातु मां
    ह्रीं ह्रूं ह्रौं ह्रौं ह्रीं ह्स्रैं नमो नमः । स्वाहा मे सर्वभूतात्मा पातु मां क्रोधभैरवः ॥ ॥ पश्चिमे
    ईश्वरः पातु क्रीं क्लीं उन्मत्तभैरवः । वायव्ये पातु मां ह्रीं क्लीं कपाली कमलेक्षणः ॥ ॥ उत्तरे पातु
    मां देवो ह्रीं ह्रीं भीषणभैरवः । ईशान्ये पातु मां देवः क्लीं ह्रीं संहारभैरवः ॥ ॥ ऊर्ध्वं मे पातु
    देवेशः श्रीसम्मोहनभैरवः । अधस्ताद्वटुकः पातु सर्वतः कालभैरवः ॥ ॥ इतीदं कवचं दिव्यं ब्रह्मविद्याकलेवरम्
    । गोपनीयं प्रयत्नेन यदीच्छेदात्मनः सुखम् ॥ ॥ जननीजारवद्गोप्या विद्यैषेत्यागमा जगुः । अष्टम्यां च चतुर्दश्यां
    सङ्क्रान्तौ ग्रहणेष्वपि ॥ ॥ भौमेऽवश्यं पठेद्धीरो मोहयत्यखिलं जगत् । एकावृत्या भवेद्विद्या द्विरावृत्या
    धनं लभेत् ॥ ॥ त्रिरावृत्या राजवश्यं तुर्यावृत्याऽखिलाः प्रजाः । पञ्चावृत्या ग्रामवश्यं षडावृत्या च
    मन्त्रिणः ॥ ॥ सप्तावृत्या सभावश्या अष्टावृत्या भुवः श्रियम् । नवावृत्या च नारीणां सर्वाकर्षणकारकम्
    ॥ ॥ दशावृत्तीः पठेन्नित्यं षण्मासाभ्यासयोगतः । देवता वशमायाति किं पुनर्मानवा भुवि ॥ ॥ कवचस्य च दिव्यस्य
    सहस्रावर्तनान्नरः । देवतादर्शनं सद्यो नात्रकार्या विचारणा ॥ ॥ अर्धरात्रे समुत्थाय चतुर्थ्यां भृगुवासरे
    । रक्तमालाम्बरधरो रक्तगन्धानुलेपनः ॥ ॥ सावधानेन मनसा पठेदेकोत्तरं शतम् । स्वप्ने मूर्तिमयं देवं पश्यत्येव
    न संशयः ॥ ॥ इदं कवचमज्ञात्वा गणेशं भजते नरः । कोटिलक्षं प्रजप्त्वापि न मन्त्रं सिद्धिदो भवेत् ॥ ॥
    पुष्पाञ्जल्यष्टकं दत्वा मूलेनैव सकृत् पठेत् । अपिवर्षसहस्राणां पूजायाः फलमाप्नुयात् ॥ ॥ भूर्जे लिखित्वा
    स्वर्णस्तां गुटिकां धारयेद्यदि । कण्ठे वा दक्षिणे बाहौ सकुर्याद्दासवज्जगत् ॥ ॥ न देयं परशिष्येभ्यो
    देयं शिष्येभ्य एव च । अभक्तेभ्योपि पुत्रेभ्यो दत्वा नरकमाप्नुयात् ॥ ॥ गणेशभक्तियुक्ताय साधवे च प्रयत्नतः
    । दातव्यं तेन विघ्नेशः सुप्रसन्नो भविष्यति ॥ ॥ इति श्रीदेवीरहस्ये श्रीमहागणपति मन्त्रविग्रहकवचं सम्पूर्णम्
    ।
