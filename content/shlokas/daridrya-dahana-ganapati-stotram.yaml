id: daridrya-dahana-ganapati-stotram
category: stotram
name:
  english: Daridrya Dahana Ganapati Stotram
content:
  english: suvarna varna sundaram sitaika danta 'bhayapradham | caturbhujam trilocanam bhujanga mopavitinam
    praphulla varijasanam bhajami sindhurananam || kirita hara kundalam pradipta bahu bhushanam pracanda
    ratna kankanam prashobhitanghri yashtikam | prabhata surya sundarambara dvaya pradharinam saratna
    hemanupura prashobhitanghri pankajam || suvarna danda mandita pracanda caru camaram griha pratirna
    sundaram yugakshana pramoditam | kavindra cittaranjakam maha vipatti bhanjakam shadakshara svarupinam
    bhajedgajendra rupinam || virinci vishnu vanditam virupalocana stutim girisha darshanecchaya samarpitam
    parashaya | nirantaram surasuraih suputra vamalocanaih mahamakheshta karmanu bhajami tundilam || madaugha
    lubdha cancalarka manju gunjita ravam prabuddha cittaranjakam pramoda karnacalakam | ananya bhakti
    mananam pracanda mukti dayakam namami nitya madarena vakratunda nayakam || daridrya vidravana mashu
    kamadam stotram pathèdeta madarat | putri kalatra svajaneshu maitri puman dekadanta varaprasadat ||
    iti shrimacchankaracarya viracitam daridrya dahana ganapati stotram sampurnam ||
  devanagari: सुवर्ण वर्ण सुन्दरं सितैक दन्त ऽभयप्रधम् । चतुर्भुजं त्रिलोचनं भुजङ्ग मोपवीतिनं प्रफुल्ल
    वारिजासनं भजामि सिन्धुराननम् ॥ किरीट हार कुण्डलं प्रदीप्त बाहु भूषणं प्रचण्ड रत्न कङ्कणं प्रशोभिताङ्घ्रि
    यष्टिकम् । प्रभात सूर्य सुन्दराम्बर द्वय प्रधारिणं सरत्न हेमनूपुर प्रशोभिताङ्घ्रि पङ्कजम् ॥ सुवर्ण
    दण्ड मण्डित प्रचण्ड चारु चामरं गृह प्रतीर्ण सुन्दरं युगक्षण प्रमोदितम् । कवीन्द्र चित्तरञ्जकं महा
    विपत्ति भञ्जकं षडक्षर स्वरूपिणं भजेद्गजेन्द्र रूपिणम् ॥ विरिञ्चि विष्णु वन्दितं विरुपलोचन स्तुतिं
    गिरीश दर्शनेच्छया समार्पितं पराशाया । निरन्तरं सुरासुरैः सुपुत्र वामलोचनैः महामखेष्ट कर्मनु भजामि
    तुन्दिलम् ॥ मदौघ लुब्ध चञ्चलार्क मञ्जु गुञ्जिता रवं प्रबुद्ध चित्तरञ्जकं प्रमोद कर्णचालकम् । अनन्य
    भक्ति माननं प्रचण्ड मुक्ति दायकं नमामि नित्य मादरेण वक्रतुण्ड नायकम् ॥ दारिद्र्य विद्रावण माशु कामदं
    स्तोत्रं पठॆदेत मादरात् । पुत्री कलत्र स्वजनेषु मैत्री पुमान् देकदन्त वरप्रासादात् ॥ इति श्रीमच्छङ्कराचार्य
    विरचितं दारिद्र्य दहन गणपति स्तोत्रं सम्पूर्णम् ॥
