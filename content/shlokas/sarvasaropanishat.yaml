id: sarvasaropanishat
category: upanishad
name:
  english: sarvasaropanishat
  devanagari: सर्वसारोपनिषत्
content:
  english: caturdashakaranairatma shabdadivishayasankalpadindharmanyada karoti tada manomayah kosha ityucyate
    | etatkoshatrayasamsaktam tadgatavisheshajno yada bhasate tada vijnanamayah kosha ityucyate | etatkoshacatushtayasamsaktam
    svakaranajnane vatakanikayamiva vriksho yada vartate tadanandamayah kosha ityucyate || 5 || sukhaduhkhabuddhya
    shreyo'ntah karta yada tada ishtavishaye buddhih sukhabuddhiranishtavishaye buddhirduhkhabuddhih |
    shabdasparsharuparasagandhah sukhaduhkhahetavah | punyapapakarmanusari bhutva praptasharirasamyogamapraptasharirasamyogamiva
    kurvano yada drishyate tadopahitajiva ityucyate || 6 || mana adishca pranadishca icchadishca sattvadishca
    punyadishca ete pancavarganam dharmibhutatmajnanadrite na vinashyatyatmasannidhau nityatvena pratiyamana
    atmopadhiryastallingashariram hridgranthirityucyate || 7 || tatra yatprakashate caitanyam sa kshetrajna
    ityucyate || 8 || jnatrijnanajneyanamavirbhavatirobhavajnata svayamavirbhavatirobhavarahitah svayamjyotih
    sakshityucyate || 9 || brahmadipipilikaparyantam sarvapranibuddhishu avashishtatayòpalabhyamanah sarvapranibuddhistho
    yada tada kutastha ityucyate || 10 || kutasathòpahitabhedanam svarupalabhaheturbhutva manigane sutramiva
    sarvakshetreshvanusyutatvena yada kashyate atma tadantaryamityucyate || 11 || satyam jnanamanantamanandam
    sarvopadhivinirmuktam katakamukutadyapadhirahitasuvarnaghanavad vijnanacinmatrasvabhavatma yada bhasate
    tada tvam padarthah pratyagatmetyucyate | satyam jnanamanantam brahma | satyamavinashi | avinashi
    nama deshakalavastunimitteshu vinashyatsu yanna vinashyati tadavinashi | jnanam nama utpattivinasharahitanairantaryam
    caitanyam jnanamityucyate | anantam nama mridvikareshu mridiva svarnavikareshu svarnamiva tantuvikareshu
    tanturiva avyaktadisrishtiprapanceshu purnam vyapakam caitanyam anantamityucyate | anandam nama sukhacaitanyasvarupo'parimitanandasamudro'vashishtasukhasvarupashcananda
    ityucyate || 12 || etadvastucatushtayam yasya lakshanam deshakalavastunimitteshvavyabhicari tatpadarthah
    paramatmetyucyate || 13 || tvam padarthadaupadhikattatpadarthadaupadhikabhedadvilakshanamakashavatsukshmam
    kevalam sattamatrasvabhavam param brahmetyucyate | 14 || maya nama anadirantavati pramana'pramanasadharana
    na sati nasati na sadasati svayamadhika vikararahita nirupyamana satitaralakshanashunya sa maya iti
    ucyate | ajnanam tucchapyasati kalatraye'pi pamaranam vastavi ca sattvabuddhirlaukikanamiidamitthamityanirvacaniya
    vaktum na shakyate || 15 || naham bhavamyaham devo nendriyani dashaiva tu | na buddhirna manah shashvannahankarah
    tathaiva ca || 16 || aprano hyamanah shubhro buddhyadinam hi sarvada | sakshyaham sarvada nityashcinmatro'ham
    na samshayah || 17 || naham karta naiva bhokta prakriteh sakshirupakah | matsannidhyatpravartante
    dehadya ajada iva || 18 || sthanurnityah sadanandah shuddho jnanamayo'malah | atmaham sarvabhutanam
    vibhuh sakshi na samshayah || 19 || brahmaivaham sarvavedantavedyam naham vedyam vyomavatadirupam
    | rupam naham nama naham na karma brahmaivaham saccidanandarupam || 20 || naham deho janmamrityu kuto
    me naham pranah kshutpipase kuto me | naham cetah shokamohau kuto me naham karta bandhamokshau kuto
    me ityupanishat || 21 || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || || iti sarvasaròpanishatsamapta || adhikadhyayanaya
  devanagari: चतुर्दशकरणैरात्मा शब्दादिविषयसङ्कल्पादीन्धर्मान्यदा करोति तदा मनोमयः कोश इत्युच्यते । एतत्कोशत्रयसंसक्तं
    तद्गतविशेषज्ञो यदा भासते तदा विज्ञानमयः कोश इत्युच्यते । एतत्कोशचतुष्टयसंसक्तं स्वकारणाज्ञाने वटकणिकायामिव
    वृक्षो यदा वर्तते तदानन्दमयः कोश इत्युच्यते ॥ ५ ॥ सुखदुःखबुद्ध्या श्रेयोऽन्तः कर्ता यदा तदा इष्टविषये
    बुद्धिः सुखबुद्धिरनिष्टविषये बुद्धिर्दुःखबुद्धिः । शब्दस्पर्शरूपरसगन्धाः सुखदुःखहेतवः । पुण्यपापकर्मानुसारी
    भूत्वा प्राप्तशरीरसंयोगमप्राप्तशरीरसंयोगमिव कुर्वाणो यदा दृश्यते तदोपहितजीव इत्युच्यते ॥ ६ ॥ मन आदिश्च
    प्राणादिश्च इच्छादिश्च सत्त्वादिश्च पुण्यादिश्च एते पञ्चवर्गाणां धर्मीभूतात्मज्ञानादृते न विनश्यत्यात्मसन्निधौ
    नित्यत्वेन प्रतीयमान आत्मोपाधिर्यस्तल्लिङ्गशरीरं हृद्ग्रन्थिरित्युच्यते ॥ ७ ॥ तत्र यत्प्रकाशते चैतन्यं
    स क्षेत्रज्ञ इत्युच्यते ॥ ८ ॥ ज्ञातृज्ञानज्ञेयानामाविर्भावतिरोभावज्ञाता स्वयमाविर्भावतिरोभावरहितः
    स्वयंज्योतिः साक्षीत्युच्यते ॥ ९ ॥ ब्रह्मादिपिपीलिकापर्यन्तं सर्वप्राणिबुद्धिषु अवशिष्टतयॊपलभ्यमानः
    सर्वप्राणिबुद्धिस्थो यदा तदा कूटस्थ इत्युच्यते ॥ १० ॥ कूटसथॊपहितभेदानां स्वरूपलाभहेतुर्भूत्वा मणिगणे
    सूत्रमिव सर्वक्षेत्रेष्वनुस्यूतत्वेन यदा काश्यते आत्मा तदान्तर्यामीत्युच्यते ॥ ११ ॥ सत्यं ज्ञानमनन्तमानन्दं
    सर्वोपाधिविनिर्मुक्तं कटकमुकुटाद्यपाधिरहितसुवर्णघनवद् विज्ञानचिन्मात्रस्वभावात्मा यदा भासते तदा त्वं
    पदार्थः प्रत्यगात्मेत्युच्यते । सत्यं ज्ञानमनन्तं ब्रह्म । सत्यमविनाशि । अविनाशि नाम देशकालवस्तुनिमित्तेषु
    विनश्यत्सु यन्न विनश्यति तदविनाशि । ज्ञानं नाम उत्पत्तिविनाशरहितनैरन्तर्यं चैतन्यं ज्ञानमित्युच्यते
    । अनन्तं नाम मृद्विकारेषु मृदिव स्वर्णविकारेषु स्वर्णमिव तन्तुविकारेषु तन्तुरिव अव्यक्तादिसृष्टिप्रपञ्चेषु
    पूर्णं व्यापकं चैतन्यम् अनन्तमित्युच्यते । आनन्दं नाम सुखचैतन्यस्वरूपोऽपरिमितानन्दसमुद्रोऽवशिष्टसुखस्वरूपश्चानन्द
    इत्युच्यते ॥ १२ ॥ एतद्वस्तुचतुष्टयं यस्य लक्षणं देशकालवस्तुनिमित्तेष्वव्यभिचारी तत्पदार्थः परमात्मेत्युच्यते
    ॥ १३ ॥ त्वं पदार्थादौपाधिकात्तत्पदार्थादौपाधिकभेदाद्विलक्षणमाकाशवत्सूक्ष्मं केवलं सत्तामात्रस्वभावं
    परं ब्रह्मेत्युच्यते । १४ ॥ माया नाम अनादिरन्तवती प्रमाणाऽप्रमाणसाधारणा न सती नासती न सदसती स्वयमधिका
    विकाररहिता निरूप्यमाणा सतीतरलक्षणशून्या सा माया इति उच्यते । अज्ञानं तुच्छाप्यसती कालत्रयेऽपि पामराणां
    वास्तवी च सत्त्वबुद्धिर्लौकिकानामिइदमित्थमित्यनिर्वचनीया वक्तुं न शक्यते ॥ १५ ॥ नाहं भवाम्यहं देवो
    नेन्द्रियाणि दशैव तु । न बुद्धिर्न मनः शश्वन्नाहङ्कारः तथैव च ॥ १६ ॥ अप्राणो ह्यमनाः शुभ्रो बुद्ध्यादीनां
    हि सर्वदा । साक्ष्यहं सर्वदा नित्यश्चिन्मात्रोऽहं न संशयः ॥ १७ ॥ नाहं कर्ता नैव भोक्ता प्रकृतेः साक्षिरूपकः
    । मत्सान्निध्यात्प्रवर्तन्ते देहाद्या अजडा इव ॥ १८ ॥ स्थाणुर्नित्यः सदानन्दः शुद्धो ज्ञानमयोऽमलः ।
    आत्माहं सर्वभूतानां विभुः साक्षी न संशयः ॥ १९ ॥ ब्रह्मैवाहं सर्ववेदान्तवेद्यं नाहं वेद्यं व्योमवातादिरूपम्
    । रूपं नाहं नाम नाहं न कर्म ब्रह्मैवाहं सच्चिदानन्दरूपम् ॥ २० ॥ नाहं देहो जन्ममृत्यु कुतो मे नाहं
    प्राणः क्षुत्पिपासे कुतो मे । नाहं चेतः शोकमोहौ कुतो मे नाहं कर्ता बन्धमोक्षौ कुतो मे इत्युपनिषत्
    ॥ २१ ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ ॥ इति सर्वसारॊपनिषत्समाप्ता ॥ अधिकाध्ययनाय
