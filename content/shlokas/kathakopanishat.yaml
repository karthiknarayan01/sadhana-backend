id: kathakopanishat
category: upanishad
name:
  english: kathakopanishat
  devanagari: काठकोपनिषत्
content:
  english: anandavaptisadhanatvam caha | tadrisham tattvajnanam sadhanam vina na setsyatiti tatsadhanabhutam
    dvividharmokaropasanamaha yamah | tatastena nirupadhikamatisukshmam pravacanadibhirasadhyamatmatattvamuktam
    ||1||2|| atha ca parvoktavidyavidyathoh svarupasadhanaphalani | vidyavidyayo jnanasaukaryartha ratharupakakalpana
    | tatradau gantagantavyavivekartha tattvampadartha bhutau dvavatmanavaha | tatra bhoktajivasya samsaram
    moksham va gacchato rathino rathadivacchariradini gatisadhanani darshayati sma | tatra samsaramoksharupagati
    dvaividhyam vatum sarathidvaividhyam tato gamanasya paramavadhibhutam vishnupadam | tasya sarvotkrishtatam
    dyotayitum sapekshotkrishtatvaparampara cokta | tata atmani sambhavattadaikagyaprakaramaha | tato
    jnane prayatitavyamiti shrutivakyam | tato'shabdamityadi brahmanah svarupam | tajjnananmuktih | atha
    casyopakhyanasya pathanashravanayoh phalashrutih||1||3|| prathamadhyaye samkshepenoktasya brahmasvarupasya
    vistarasho nirupane dvitiyo'dhyaya upayuktah | tatra prathamamindriyanam parakpravanatvamatmadarshana
    pratibandhakamuktam | tata atmanashcaitanyasvarupam kathitam | jiveshabhedanira karanam | jivaikyapratipadanam
    | jivanityatvanirakaranam || 2 || 1 || atra coktameva brahma punah prakarantarena nirdharayati sma
    | tathahei tvampadarthabhedena prakritam brahma pratipipadayishuryamo dehadisamghatadatmatat tasyaivatmano'stitvakathanam
    | tasyatmana ekatvam svatantryam nityatvam ca taddarshinam shashvatam sukham | tatastasyatmanah sukhamayatve
    viduramanubhavasya pramanyam kathitam | atma na paraprakashyah kimtu svayamprakasha iti ca kathatam
    || 2 || 2 || tatah samsarakaranatvena brahmasvarupavadharanaya karyavarga vrikshasya rupaka malambyaha
    | tatah sarveniyantritvarupam brahmalingamuktam | asminneva sharire brahmajnanam sampadaniyam yatah
    pitrilokadau tatsampadanam na sambhavatityuktam | tata atmajnanapratibandhakam dosham pratikartu yogamaha|
    cittasyanamkagratarurupam evam yogasahayyena cittasyaikagratamavapya paramarthadarshino nivrittakamasya
    janmamaranabhavalakshanam phalamuktam | evam paramarthatattvam yena jnayate teno pasakenopasanaya
    brahmalokadih prapyate | ajnanina karmana samsara gatiravapyata ityuktishca | tatah sarvavaluyarthabhutasya
    brahmatmaikatvalakshana syopasamharah | tata akhyayikopasamharah ||2||3|| 2 taitiriyabrahmanastha
    naciketasa akhyayika | iyameva naciketasa akhyayika taitiriyabrahmane tritiyakanda ekadashaprapathake'shtame'navaka
    upalabhyate tatparyamittham
  devanagari: आनन्दावाप्तिसाधनत्वं चाह । तादृशं तत्त्वज्ञानं साधनं विना न सेत्स्यतीति तत्साधनभूतं द्विविधर्मोकारोपासनमाह
    यमः । ततस्तेन निरूपाधिकमतिसूक्ष्मं प्रवचनादिभिरसाध्यमात्मतत्त्वमुक्तम् ॥१॥२॥ अथ च पर्वोक्तविद्याविद्यथोः
    स्वरूपसाधनफलानि । विद्याविद्ययो ज्ञानसौकर्यार्था रथरूपककल्पना । तत्रादौ गन्तगन्तव्यविवेकार्थ तत्त्वंपदार्थ
    भूतौ द्वावात्मानावाह । तत्र भोक्तजीवस्य संसारं मोक्षं वा गच्छतो रथिनो रथादिवच्छरीरादीनि गतिसाधनानि
    दर्शयति स्म । तत्र संसारमोक्षरूपगति द्वैविध्यं वतुं सारथिद्वैविध्यं ततो गमनस्य परमावधिभूतं विष्णुपदम्
    । तस्य सर्वोत्कृष्टतां द्योतयितुं सापेक्षोत्कृष्टत्वपरम्परा चोक्ता । तत आत्मनी संभवात्तदैकाग्यप्रकारमाह
    । ततो ज्ञाने प्रयतितव्यमिति श्रुतिवाक्यम् । ततोऽशब्दमित्यादि ब्रह्मणः स्वरूपम् । तज्ज्ञानान्मुक्तिः
    । अथ चास्योपाख्यानस्य पठनश्रवणयोः फलश्रुतिः॥१॥३॥ प्रथमाध्याये संक्षेपेणोक्तस्य ब्रह्मस्वरूपस्य विस्तरशो
    निरूपणे द्वितीयोऽध्याय उपयुक्तः । तत्र प्रथममिन्द्रियाणां पराक्प्रवणत्वमात्मदर्शन प्रतिबन्धकमुक्तम्
    । तत आत्मनश्चैतन्यस्वरूपं कथितम् । जीवेशभेदनिरा करणम् । जीवैक्यप्रतिपादनम् । जीवानित्यत्वनिराकरणम्
    ॥ २ ॥ १ ॥ अत्र चोक्तमेव ब्रह्म पुनः प्रकारान्तरेण निर्धारयति स्म । तथाहेि त्वंपदार्थाभेदेन प्रकृतं
    ब्रह्म प्रतिपिपादयिषुर्यमो देहादिसंघातादात्मतत् तस्यैवात्मनोऽस्तित्वकथनम् । तस्यात्मन एकत्वं स्वातन्त्र्यं
    नित्यत्वं च तद्दर्शिनां शाश्वतं सुखम् । ततस्तस्यात्मनः सुखमयत्वे विदुरामनुभवस्य प्रामाण्यं कथितम्
    । आत्मा न परप्रकाश्यः किंतु स्वयंप्रकाश इति च काथतम् ॥ २ ॥ २ ॥ ततः संसारकारणत्वेन ब्रह्मस्वरूपावधारणाय
    कार्यवर्ग वृक्षस्य रूपक मालम्ब्याह । ततः सर्वेनियन्तृत्वरूपं ब्रह्मलिङ्गमुक्तम् । अस्मिन्नेव शरीरे
    ब्रह्मज्ञानं संपादनीयं यतः पितृलोकादौ तत्संपादनं न संभवतीत्युक्तम् । तत आत्मज्ञानप्रतिबन्धकं दोषं
    प्रतिकर्तु योगमाह। चित्तस्यानंकाग्रतारुरूपं एवं योगसाहाय्येन चित्तस्यैकाग्रतामवाप्य परमार्थदर्शिनो
    निवृत्तकामस्य जन्ममरणाभावलक्षणं फलमुक्तम् । एवं परमार्थतत्त्वं येन ज्ञायते तेनो पासकेनोपासनया ब्रह्मलोकादिः
    प्राप्यते । अज्ञानिना कर्मणा संसार गतिरवाप्यत इत्युक्तिश्च । ततः सर्ववलुयर्थभूतस्य ब्रह्मात्मैकत्वलक्षण
    स्योपसंहारः । तत आख्यायिकोपसंहारः ॥२॥३॥ २ तैतिरीयब्राह्मणस्था नचिकेतस आख्यायिका । इयमेव नचिकेतस आख्यायिका
    तैतिरीयब्राह्मणे तृतीयकाण्ड एकादशप्रपाठकेऽष्टमेऽनवाक उपलभ्यते तात्पर्यमित्थम्
