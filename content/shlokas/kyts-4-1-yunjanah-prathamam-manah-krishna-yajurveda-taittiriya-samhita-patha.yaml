    महित्व॒ना ऽऽनाक॑ न्त॒स्थुरु॒रु च॑क्रिरे॒ सदः॑ । विष्णु॒ र्यद्धा वँयो॒ न सी॑द॒न्नधि॑ ब॒र्॒हिषि॑ प्रि॒ये
    ॥ प्रचि॒त्रम॒र्क ङ्गृ॑ण॒ते तु॒राय॒ मारु॑ताय॒ स्वत॑वसे भरद्ध्वम् । ये सहाग्ं॑सि॒ सह॑सा॒ सह॑न्ते॒ रेज॑ते
    अग्ने पृथि॒वी म॒खेभ्यः॑ । रेज॑ते अग्ने पृथि॒वी म॒खेभ्यः॑ ॥ विश्वे॑ दे॒वा विश्वे॑ देवाः ॥ द्यावा॑ नः
    पृथि॒वी इ॒मग्ं सि॒द्ध्रम॒द्य दि॑वि॒स्पृश न्दे॒वेषु॑ यच्छताम् ॥ प्र पू र्व॒जे पि॒तरा॒ नव्य॑सीभिर्गी॒र्भिः
    कृ॑णुद्ध्व॒ग्ं॒ सद॑ने ऋ॒तस्य॑ । आ नो द्यावापृथिवी॒ दैव्ये॑न॒ जने॑न यात॒ वँरू॑थम् ॥ अ॒ग्निग्ग् स्तोमे॑न
    बोधय समिधा॒नो अम॑र्त्यम् । ह॒व्या दे॒वेषु॑ नो दधत् ॥ स ह॑व्य॒वाडम॑र्त्य उ॒शिग्दू॒तश्चनो॑हितः । अ॒ग्निर्धि॒या
    समृ॑ण्वति ॥ शन्नो॑ भवन्तु॒ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थ काण्डे प्रथमः
    प्रश्न
