id: sri-madhvacharya-kruta-dwadasha-stotra-6
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 6
content:
  english: atha shashthastotram matsyakarupa layodaviharin vedavinetra caturmukhavandya | kurmasvarupaka
    mandaradharin lokavidharaka devavarenya || || sukararupaka danavashatro bhumividharaka yajnavaranga
    | deva nrisimha hiranyakashatro sarva bhayantaka daivatabandho || || vamana vamana manavavesha daityavarantaka
    karanarupa | rama bhrigudvaha surjitadipte kshatrakulantaka shambhuvarenya || || raghava raghava rakshasa
    shatro marutivallabha janakikanta | devakinandana nandakumara vrindavanancana gokulacandra || || kandaphalashana
    sundararupa nanditagokulavanditapada | indrasutavaka nandakahasta candanacarcita sundarinatha || ||
    indivarodara dalanayana mandaradharin govinda vande | candrashatanana kundasuhasa nanditadaivatanandasupurna
    || || devakinandana sundararupa rukminivallabha pandavabandho | daityavimohaka nityasukhade devavibodhaka
    buddhasvarupa || || dushtakulantaka kalkisvarupa dharmavivardhana mulayugade | narayanamalakaranamurte
    purnagunarnava nityasubodha || || anandatirthakrita harigatha papahara shubhanityasukhartha || ||
    iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu shashthastotram sampurnam
  devanagari: अथ षष्ठस्तोत्रम् मत्स्यकरूप लयोदविहारिन् वेदविनेत्र चतुर्मुखवन्द्य । कूर्मस्वरूपक मन्दरधारिन्
    लोकविधारक देववरेण्य ॥ ॥ सूकररूपक दानवशत्रो भूमिविधारक यज्ञावराङ्ग । देव नृसिंह हिरण्यकशत्रो सर्व भयान्तक
    दैवतबन्धो ॥ ॥ वामन वामन माणववेष दैत्यवरान्तक कारणरूप । राम भृगूद्वह सूर्जितदीप्ते क्षत्रकुलान्तक शम्भुवरेण्य
    ॥ ॥ राघव राघव राक्षस शत्रो मारुतिवल्लभ जानकिकान्त । देवकिनन्दन नन्दकुमार वृन्दावनाञ्चन गोकुलचन्द्र
    ॥ ॥ कन्दफलाशन सुन्दररूप नन्दितगोकुलवन्दितपाद । इन्द्रसुतावक नन्दकहस्त चन्दनचर्चित सुन्दरिनाथ ॥ ॥ इन्दीवरोदर
    दलनयन मन्दरधारिन् गोविन्द वन्दे । चन्द्रशतानन कुन्दसुहास नन्दितदैवतानन्दसुपूर्ण ॥ ॥ देवकिनन्दन सुन्दररूप
    रुक्मिणिवल्लभ पाण्डवबन्धो । दैत्यविमोहक नित्यसुखादे देवविबोधक बुद्धस्वरूप ॥ ॥ दुष्टकुलान्तक कल्किस्वरूप
    धर्मविवर्धन मूलयुगादे । नारायणामलकारणमूर्ते पूर्णगुणार्णव नित्यसुबोध ॥ ॥ आनन्दतीर्थकृता हरिगाथा पापहरा
    शुभनित्यसुखार्था ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु षष्ठस्तोत्रं सम्पूर्णम्
