id: prarthana
category: stotram
name:
  english: prarthana
  devanagari: प्रर्थन
content:
  english: matribhumi prarthana sartha rashtriya svayamsevaka sangha prarthana namaste sada vatsale matribhume
    tvaya hindubhume sukham vardhito'ham | mahamangale punyabhume tvadarthe patatvesha kayo namaste namaste
    || 1||
  devanagari: मातृभूमी प्रार्थना सार्था राष्ट्रीय स्वयंसेवक सङ्घ प्रार्थना नमस्ते सदा वत्सले मातृभूमे
    त्वया हिन्दुभूमे सुखं वर्धितोऽहम् । महामङ्गले पुण्यभूमे त्वदर्थे पतत्वेष कायो नमस्ते नमस्ते ॥ १॥
meaning: {}
