id: sandhyastotram
category: stotram
name:
  english: sandhyastotram
  devanagari: सन्ध्यास्तोत्रम्
content:
  english: sandhyastotram om aho devi mahadevi sandhye vidye sarasvati | ajare amare caiva brahmayone
    namo'stute || sandhye devi namo'stute || devi tvam prakritacittam papakrantamabhunmama | tannihsaraya
    cittanme papam hum phat namo'stute || dipta sukshma jaya bhadra vibhutirvimala tatha | amogha vidyuta
    ceti madhye shrih sarvatomukhi || namaste devadeveshi sarvatriptikare pare | amritanandamayi sandhye
    devi tasyaih namo namah || sandhye devi namo'stute || guhyatiguhyam bhoktri tvam sandhye sarasvati
    mude | ajare amare matah trahi mam bhavasagarat || aparadha sahasrani tvasatkarmashatani ca | matto
    jatani sandhye tvam kshamasva parameshvari || sandhyadatri ca bhoktri ca devi sarvamidam jagat | sarasvati
    prakritidhatri sandhye devi namo'stute || atmarupa jnatum praptum jnanam nishkalmisham ritam | sandhyastotram
    pathennityam sarvakamartha siddhaye || sandhye devi namo'stute ||
  devanagari: सन्ध्यास्तोत्रम् ॐ अहो देवि महादेवि सन्ध्ये विद्ये सरस्वति । अजरे अमरे चैव ब्रह्मयोने नमोऽस्तुते
    ॥ सन्ध्ये देवि नमोऽस्तुते ॥ देवि त्वं प्राकृतचित्तं पापाक्रान्तमभून्मम । तन्निःसारय चित्तान्मे पापं
    हुं फट् नमोऽस्तुते ॥ दीप्ता सूक्ष्मा जया भद्रा विभूतिर्विमला तथा । अमोघा विद्युता चेति मध्ये श्रीः
    सर्वतोमुखी ॥ नमस्ते देवदेवेशि सर्वतृप्तिकरे परे । अमृतानन्दमयि सन्ध्ये देवि तस्यैः नमो नमः ॥ सन्ध्ये
    देवि नमोऽस्तुते ॥ गुह्यातिगुह्यं भोक्त्रि त्वं सन्ध्ये सरस्वति मुदे । अजरे अमरे मातः त्राहि मां भवसागरात्
    ॥ अपराध सहस्राणि त्वसत्कर्मशतानि च । मत्तो जातानि सन्ध्ये त्वं क्षमस्व परमेश्वरि ॥ सन्ध्यादात्री च
    भोक्त्री च देवी सर्वमिदं जगत् । सरस्वती प्रकृतिधात्री सन्ध्ये देवि नमोऽस्तुते ॥ आत्मारूप ज्ञातुं प्राप्तुं
    ज्ञानं निष्कल्मिषं ऋतम् । सन्ध्यास्तोत्रं पठेन्नित्यं सर्वकामार्थ सिद्धये ॥ सन्ध्ये देवि नमोऽस्तुते
    ॥
