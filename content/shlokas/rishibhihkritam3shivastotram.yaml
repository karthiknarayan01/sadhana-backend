id: rishibhihkritam3shivastotram
category: stotram
name:
  english: rishibhihkritam3shivastotram
  devanagari: ऋषिभिःकृतं३शिवस्तोत्रम्
content:
  english: rishibhih kritam 3 shivastotram rishaya ucuh | om namo mulaprakritaye ajitaya mahatmane | anavritaya
    devaya nihsprihaya namo namah || 13|| nama adyaya bijaya arsheyaya pravarttine | anantaraya caikaya
    avyaktaya namo namah || 14|| nanavicitrabhujagangadabhushanaya sarveshvaraya virajaya namo varaya
    | vishvatmane paramakaranakaranaya phullaravindavipulayatalocanaya || 15|| adrishyamavyaktamanadimavyayam
    yadaksharam brahma vadanti sarvagam | nishamya yam mrityumukhatpramucyate tamadidevam sharanam prapadye
    || 16|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye tryadhikashatatamadhyayantargatam
    rishibhih kritam shivastotram samaptam | skandapurana | prabhasakhanda | adhyaya 103
  devanagari: ऋषिभिः कृतं ३ शिवस्तोत्रम् ऋषय ऊचुः । ॐ नमो मूलप्रकृतये अजिताय महात्मने । अनावृताय देवाय
    निःस्पृहाय नमो नमः ॥ १३॥ नम आद्याय बीजाय आर्षेयाय प्रवर्त्तिने । अनन्तराय चैकाय अव्यक्ताय नमो नमः
    ॥ १४॥ नानाविचित्रभुजगाङ्गदभूषणाय सर्वेश्वराय विरजाय नमो वराय । विश्वात्मने परमकारणकारणाय फुल्लारविन्दविपुलायतलोचनाय
    ॥ १५॥ अदृश्यमव्यक्तमनादिमव्ययं यदक्षरं ब्रह्म वदन्ति सर्वगम् । निशाम्य यं मृत्युमुखात्प्रमुच्यते तमादिदेवं
    शरणं प्रपद्ये ॥ १६॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये त्र्यधिकशततमाध्यायान्तर्गतं
    ऋषिभिः कृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय १०३
