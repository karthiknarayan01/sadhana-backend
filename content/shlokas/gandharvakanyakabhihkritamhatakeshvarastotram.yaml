id: gandharvakanyakabhihkritamhatakeshvarastotram
category: stotram
name:
  english: gandharvakanyakabhihkritamhatakeshvarastotram
  devanagari: गन्धर्वकन्यकाभिःकृतंहाटकेश्वरस्तोत्रम्
content:
  english: gandharvakanyakabhih kritam hatakeshvarastotram namo'stu sharva shambho trinetra carugatra
    trailokyanatha umapate dakshayajnavidhvamsakara kamanganashana ghorapapapranashana mahapurusha mahogramurte
    sarvasattvakshayankara shubhankara maheshvara trishuladharin smarare guhavasin digvasah mahashankhashekhara
    |
  devanagari: गन्धर्वकन्यकाभिः कृतं हाटकेश्वरस्तोत्रम् नमोऽस्तु शर्व शम्भो त्रिनेत्र चारुगात्र त्रैलोक्यनाथ
    उमापते दक्षयज्ञविध्वंसकर कामाङ्गनाशन घोरपापप्रणाशन महापुरुष महोग्रमूर्ते सर्वसत्त्वक्षयङ्कर शुभङ्कर
    महेश्वर त्रिशूलधारिन् स्मरारे गुहावासिन् दिग्वासः महाशङ्खशेखर ।
meaning: {}
