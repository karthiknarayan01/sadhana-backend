id: ardhanarishvarasahasranamastotram-1
category: sahasranama
name:
  english: ardhanarishvarasahasranamastotram 1
  devanagari: अर्धनारीश्वरसहस्रनामस्तोत्रम् १
content:
  english: ardhanarishvarasahasranamastotram om | akhandamandalakarashcakhilandaikanayika | amarendrarcitapadashcamararinishudini
    || 1|| anadinidhano'nantakotisuryasamaprabha | ananto'nantabhuteshi cajito'mitavikrama || 2|| avinashapadasthema
    cavanmanasagocara | anantakotikalyanaguno'nantagunashraya || 3|| aghaha caghasamhartri cavedyo'ditivandita
    | apavargapradata caivakhilabhishtadayini || 4|| adimadhyantarahita adityayutabhasura | agamabhyarcitapada
    amnayarthavilasini || 5|| akhandalamukhastutya atmanandavidhayini | ashapalasamaradhya adhivyadhivinashini
    || 6|| apadadrindradambholirapannartiprabhanjana | adityamandalantahstha adishaktisvarupini || 7||
    ashavarambaradhara ashantaishvaryadayini | anandalaharipurna anandollasashalini || 8|| acantaduritastoma
    adharadheyarupini | adhyatmikadhishamana agovrindanivarini || 9|| indirapatipujyanghririndradistutavaibhava
    | ibhacarmambaradhara ibhakumbhanibhastani || 10|| ibhavaktramahasenajanakashceshtadayini | ishtighna
    ishtikartri caiveyattatitavikramah || 11|| icchajnanakriyashaktiricchakalitavigrahah | indira bharati
    dattahastayugmollasatkara || 12|| indrayajnasukharadhya idapingalamadhyaga | ihamutrasukharadhya indubimbasamanana
    || 13|| inenduvahninayana inducudakutumbini | indriyadigunatita indranistutimodita || 14|| ishatsmitamukhambhoja
    ishvarardhasharirini | ishvarashceshavanita idya ishitvasiddhida || 15|| ishanadibrahmarupa ihadhikaphalaprada
    | ikarartharahasyajna ikararthasvarupini || 16|| itibadhaprashamana ishamayavilasini | idyastayeshajivaturishanatyaktacetanah
    || 17|| tathedrigityasamvedha ishanorjitadanavah | ishitri cepsitakara ishvaratvavidhayini || 18||
    ukshendravahanarudha utpattilayavarjita | unnataishvaryasampanna utsedhapadadayini || 19|| ushapatisamaradhya
    ushakotisamarcita | usharbudhakshinirdagdhanangashcoruparakrama || 20|| ugra ugrapratapa caivomapatirudaradhih
    | udyadbhanupratikasha unnatastanamandala || 21|| ugradanavasamharta cotsavapriyamanasa | ushnikchandahsvarupadhyashcoragadrinivasini
    || 22|| udagrashrirupanishadudyanacarakokila | urvashigitasantushta urdhvamnayanivasini || 23|| urdhvareta
    urdhvagatirunadhikavivarjitah | urdhvandajanmadharini urjitakhilashatrukah || 24|| ushmagnikanasantaptadineshagnindubhalaka
    | ucirucishmaticormya urudeshantamardava || 25|| uravyottamaveshashca urdhvayogatigamini | unavacya
    unasamya urdhvatandavapanditah || 26|| urdhvalasyasahaya ca urikritasamastadah | urjasvanmanimaladhya
    rigyajuhsamagayanah || 27|| ribhukshastutapadabja rishipatnisamarcitah | rishirajarshisamsevya rishirrinavimocini
    || 28|| rigyajuhsamasarajnah ricam praciti sannuta | rudrakshamalikabhusho rudranikotisevita || 29||
    rudrakotijitamitrah ritushonambaravrita | ritulakshmisahasresha riksharajasamanana || 30|| rinatrayavimuktashca
    rinapatakanashini | rigadivedavinutah rigvedaryasvarupini || 31|| ritunathasakharatih ritukalamahojjvala
    | krurapapapariharah kruralokaparanmukhi || 32|| rupanirjitakandarpo rupalavanyavaridhih | rupyacalanivasashca
    rupayauvanashalini || 33|| bhrunayogiganaradhyo bhrunahartivinashini | bhrubhangavilasadvaktra bhrujitendrasharasana
    || 34|| luptakandarpagatrashca shlishtakantakalevara | lunthitaripurashcaiva klriptavrittisurangana
    || 35|| labdhabhaktijanapreyan labdhabhogavidambini | lulayavahanaratih lulayasuramardini || 36||
    lubdhabhasmangaragadhyah klriptakalpasamujjvala | lunabrahmashiralidhamadiramodavihvala || 37|| klibyah
    klinkaranilaya shlaghyah shlaghyagunashraya | mlanetaramukhambhojo blumbijarthasvarupini || 38|| enaracuda
    ekaksharyaika ekantavasini | eshanarahitashcainalocana caidhitotsavah || 39|| ekantapujanaprita ekantadhyanatatparah
    | ekabhoga ekasaukhyah ekaishvaryapradayini || 40|| ekabhakta ekaguna ekantadhvaradikshitah | ekaviraprabhapuranimajjatpriyamanasa
