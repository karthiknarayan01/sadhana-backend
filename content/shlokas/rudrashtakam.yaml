id: rudrashtakam
category: stotram
name:
  english: Rudrashtakam
content:
  english: namamishamishana nirvanarupam vibhum vyapakam brahmaveda svarupam | nijam nirgunam nirvikalpam
    niriham cidakasha || nirakaramonkaramulam turiyam girajnanagotitamisham girisham | karalam mahakalakalam
    kripalum gunagara sankashagauram gabhiram manobhutakoti prabhasi shariram | sphuranmaulikallolini
    caruganga lasadbhala balendu kanthe bhujangam || || calatkundalam shubhranetram vishalam prasannananam
    nilakantham dayalum | mrigadhisha carmambaram mundamalam priyam shankaram sarvanatham bhajami || ||
    pracandam prakrishtam pragalbham paresham akhandam bhaje bhanukotiprakasham | trayi nirmulanam shulapanim
    bhaje'ham bhavanipatim bhavagamyam || kalpantakari sada sajjanananda data purari | cidananda sandohamohapahari
    prasida prasida prabho manmathari || padaravindam bhajantiha loke pare va naranam | na tavatsukham
    shanti santapanasham prasida prabho sarvabhutadhivasam || || na janami yogam japam naiva pujam nato'ham
    sada sarvada deva tubhyam | jara duhkhaughatatapyamanam prabho pahi shapannamamisha shambho || ||
    rudrashtakamidam proktam viprena haratushtaye | ye pathanti nara bhaktya tesham shambhuh prasidati
    || || || iti shriramacaritamanase uttarakande shrigosvami tulasidasakritam shrirudrashtakam sampurnam
    ||
  devanagari: नमामीशमीशान निर्वाणरूपं विभुं व्यापकं ब्रह्मवेद स्वरूपम् । निजं निर्गुणं निर्विकल्पं निरीहं
    चिदाकाश ॥ निराकारमोङ्कारमूलं तुरीयं गिराज्ञानगोतीतमीशं गिरीशम् । करालं महाकालकालं कृपालुं गुणागार
    सङ्काशगौरं गभीरं मनोभूतकोटि प्रभासी शरीरम् । स्फुरन्मौलिकल्लोलिनी चारुगङ्गा लसद्भाल बालेन्दु कण्ठे
    भुजङ्गम् ॥ ॥ चलत्कुण्डलं शुभ्रनेत्रं विशालं प्रसन्नाननं नीलकण्ठं दयालुम् । मृगाधीश चर्माम्बरं मुण्डमालं
    प्रियं शङ्करं सर्वनाथं भजामि ॥ ॥ प्रचण्डं प्रकृष्टं प्रगल्भं परेशं अखण्डं भजे भानुकोटिप्रकाशम् । त्रयी
    निर्मूलनं शूलपाणिं भजेऽहं भवानीपतिं भावगम्यम् ॥ कल्पान्तकारी सदा सज्जनानन्द दाता पुरारी । चिदानन्द
    सन्दोहमोहापहारी प्रसीद प्रसीद प्रभो मन्मथारी ॥ पादारविन्दं भजन्तीह लोके परे वा नराणाम् । न तावत्सुखं
    शान्ति सन्तापनाशं प्रसीद प्रभो सर्वभूताधिवासम् ॥ ॥ न जानामि योगं जपं नैव पूजां नतोऽहं सदा सर्वदा देव
    तुभ्यम् । जरा दुःखौघतातप्यमानं प्रभो पाहि शापान्नमामीश शम्भो ॥ ॥ रुद्राष्टकमिदं प्रोक्तं विप्रेण हरतुष्टये
    । ये पठन्ति नरा भक्त्या तेषां शम्भुः प्रसीदति ॥ ॥ ॥ इति श्रीरामचरितमानसे उत्तरकाण्डे श्रीगोस्वामि
    तुलसीदासकृतं श्रीरुद्राष्टकं सम्पूर्णम् ॥
