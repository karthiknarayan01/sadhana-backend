id: balakavacam-2
category: kavacha
name:
  english: balakavacam 2
  devanagari: बालाकवचम् २
content:
  english: kamarajastatha hridi | sauh shaktibijam mam patu nabhau guhye ca padayoh || 4|| aim klim sauh
    vadane patu bala mam sarvasiddhaye | hasakalahrim sauh patu skandhe bhairavi kanthadeshatah || 5||
    sundari nabhideshe'vyaccarce kamakala sada | bhrunasayorantarale mahatripurasundari || 6|| lalate
    subhaga patu bhaga mam kanthadeshatah | bhagodaya tu hridaye udare bhagasarpini || 7|| bhagamala nabhideshe
    linge patu manobhava | guhye patu mahavira rajarajeshvari shiva || 8|| caitanyarupini patu padayorjagadambika
    | narayani sarvagatre sarvakaryashubhankari || 9|| brahmani patu mam purve dakshine vaishnavi tatha
    | pashcime patu varahi hyuttare tu maheshvari || 10|| agneyyam patu kaumari mahalakshmishca nairrite
    | vayavye patu camunda cendrani patu ceshake || 11|| jale patu mahamaya prithivyam sarvamangala |
    sklrim mam sarvatah patu sakalahrim patu sandhishu || 12|| jale sthale tatha''kashe dikshu rajagrihe
    tatha | kshum kshem mam tvarita patu sahrim saklim manobhava || 13|| hamsah payanmahadevi param nishkaladevata
    | vijaya mangala duti kalyani bhagamalini | jalamalininitya ca sarvada patu mam shiva || 14|| ityetatkavacam
    devi baladevyah prakirtitam | sarvasvam me tava pritya pranavadrakshitam kuru || 15||
  devanagari: कामराजस्तथा हृदि । सौः शक्तिबीजं मां पातु नाभौ गुह्ये च पादयोः ॥ ४॥ ऐं क्लीं सौः वदने पातु
    बाला मां सर्वसिद्धये । हसकलह्रीं सौः पातु स्कन्धे भैरवी कण्ठदेशतः ॥ ५॥ सुन्दरी नाभिदेशेऽव्याच्चर्चे
    कामकला सदा । भ्रूनासयोरन्तराले महात्रिपुरसुन्दरी ॥ ६॥ ललाटे सुभगा पातु भगा मां कण्ठदेशतः । भगोदया
    तु हृदये उदरे भगसर्पिणी ॥ ७॥ भगमाला नाभिदेशे लिङ्गे पातु मनोभवा । गुह्ये पातु महावीरा राजराजेश्वरी
    शिवा ॥ ८॥ चैतन्यरूपिणी पातु पादयोर्जगदम्बिका । नारायणी सर्वगात्रे सर्वकार्यशुभङ्करी ॥ ९॥ ब्रह्माणी
    पातु मां पूर्वे दक्षिणे वैष्णवी तथा । पश्चिमे पातु वाराही ह्युत्तरे तु महेश्वरी ॥ १०॥ आग्नेय्यां पातु
    कौमारी महालक्ष्मीश्च नैरृते । वायव्ये पातु चामुण्डा चेन्द्राणी पातु चेशके ॥ ११॥ जले पातु महामाया पृथिव्यां
    सर्वमङ्गला । स्क्ल्रीं मां सर्वतः पातु सकलह्रीं पातु सन्धिषु ॥ १२॥ जले स्थले तथाऽऽकाशे दिक्षु राजगृहे
    तथा । क्षूं क्षें मां त्वरिता पातु सह्रीं सक्लीं मनोभवा ॥ १३॥ हंसः पायान्महादेवी परं निष्कलदेवता ।
    विजया मङ्गला दूती कल्याणी भगमालिनी । जलामालिनिनित्या च सर्वदा पातु मां शिवा ॥ १४॥ इत्येतत्कवचं देवि
    बालादेव्याः प्रकीर्तितम् । सर्वस्वं मे तव प्रीत्या प्राणवद्रक्षितं कुरु ॥ १५॥
