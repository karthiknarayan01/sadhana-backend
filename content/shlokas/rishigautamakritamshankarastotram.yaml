id: rishigautamakritamshankarastotram
category: stotram
name:
  english: rishigautamakritamshankarastotram
  devanagari: ऋषिगौतमकृतंशन्करस्तोत्रम्
content:
  english: ritam satyam param brahma purusham krishnapingalam | urdhvaretam virupaksham vishvarupam bhajanvaham
    || 85|| yo vedantaughamrigyatma yo vedantashiromanih | tameva devadevesham bhaja shankaramanvaham
    || 86|| yo vishnumaulimandaramakarandrardapadukah | tameva devadevesham bhaja shankaramanvaham ||
    87|| kandarpadarpadamano yo nityo yo manonmanah | tameva devadevesham bhaja shankaramanvaham || 88||
    vidaritanrisimho yo yo'sau sharabharupadhrik | tameva devadevesham bhaja shankaramanvaham || 89||
    yatah sarvamabhuddrishyam jagadetaccaracaram | tameva devadevesham bhaja shankaramanvaham || 90||
    yadbhayatpavate vato yadbhityodeti bhanuman | tameva devadevesham bhaja shankaramanvaham || 91|| yadbhayadanalendrau
    ca svasvakarmani tishthatah | tameva devadevesham bhaja shankaramanvaham || 92|| yo agnavoshadhishvapsu
    vishvam vyapyadhitishthati | tameva devadevesham bhaja shankaramanvaham || 93|| yo'nanto nishkalo'nanto
    nirguno nirupadhikah | tameva devadevesham bhaja shankaramanvaham || 94|| yah sarvakarta sarvatma
    sarvasakshi sadashivah | tameva devadevesham bhaja shankaramanvaham || 95|| || iti shivarahasyantargate
    rishigautamakritam shankarastotram sampurnam ||
  devanagari: ऋतं सत्यं परं ब्रह्म पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरेतं विरूपाक्षं विश्वरूपं भजान्वहम् ॥
    ८५॥ यो वेदान्तौघमृग्यात्मा यो वेदान्तशिरोमणिः । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ८६॥ यो विष्णुमौलिमन्दारमकरन्द्रार्दपादुकः
    । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ८७॥ कन्दर्पदर्पदमनो यो नित्यो यो मनोन्मनः । तमेव देवदेवेशं भज शङ्करमन्वहम्
    ॥ ८८॥ विदारितनृसिम्हो यो योऽसौ शारभरूपधृक् । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ८९॥ यतः सर्वमभूद्दृश्यं
    जगदेतच्चराचरम् । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ९०॥ यद्भयात्पवते वातो यद्भीत्योदेति भानुमान् । तमेव
    देवदेवेशं भज शङ्करमन्वहम् ॥ ९१॥ यद्भयादनलेन्द्रौ च स्वस्वकर्मणि तिष्ठतः । तमेव देवदेवेशं भज शङ्करमन्वहम्
    ॥ ९२॥ यो अग्नावोषधीष्वप्सु विश्वं व्याप्याधितिष्ठति । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ९३॥ योऽनन्तो
    निष्कलोऽनन्तो निर्गुणो निरुपाधिकः । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ९४॥ यः सर्वकर्ता सर्वात्मा सर्वसाक्षी
    सदाशिवः । तमेव देवदेवेशं भज शङ्करमन्वहम् ॥ ९५॥ ॥ इति शिवरहस्यान्तर्गते ऋषिगौतमकृतं शङ्करस्तोत्रं सम्पूर्णम्
    ॥
