id: dharmambikastava
category: stotram
name:
  english: dharmambikastava
  devanagari: धर्माम्बिकास्तव
content:
  english: dharmambikastavah tyagarajaviracitah kalyanamritakamadhenumahile kamapriyaharshade karunyamritavapike
    pikashishusvanandasallapini | kameshapriyakamakalpalatike kadambavatipriye dehi shripadapadmabhaktimanisham
    dharmambike shrishive || 1 || enibalavilocane phanimanishrenilasatkankane tunirakritajanghike trinayane
    sthanormanoharini | vanipanisarojavaditalasadvinasvaralapike dehi shripadapadmabhaktimanisham dharmambike
    shrishive || 2 || ishitvadivibhutikasvavibhave ikarasimhasane indranipathitastute ihaparatranadhvaje
    indire | ishanadisurendrasevakajane ishadhirajeshvari dehi shripadapadmabhaktimanisham dharmambike
    shrishive || 3 || lavanyabdhipayojavaktranayane lakshmikaralokane lakshmikantanishevitanghrikamale
    lambodarashrikari | lakshyalakshyavilakshane kshanavatam svanandavriddhiprade dehi shripadapadmabhaktimanisham
    dharmambike shrishive || 4 || hripashadivimocane'ticature hridgranthivicchedike hridyanandasudharasardramadhuna
    samtarpanahladini | hrimkararthajagadvilasavibhave vidye vimarshatmike dehi shripadapadmabhaktimanisham
    dharmambike shrishive || 5 || hastishreshthasukumbhasamnibhakuce haryakshamadhye shubhe hemabjananapanipadanayane
    candrardhaphale shive | he mararimatervimohadalasannilalake nirmale dehi shripadapadmabhaktimanisham
    dharmambike shrishive || 6 || satyanandacidishvarapranayini saubhagyaratnakari samrajyaprabhudeshikendrakarunasyandamritasvardhuni
    | sarvasharahitasya bhaktahridayasyanandakadambini dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 7 || kalpe kalakaleshi kalpakalane samkalpasiddhakhile kalakalavibhagakalpanakale kalantakapreyasi
    | kalopadhivivarjite kalimalapradhvamsini kamade dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 8 || hakshadvandvadalatrikonavilasajjyotsnakalaradhite hamsadvandvagatiprabodhajananashrideshikendratmike
    | hamsarohavicakshane abhayade anandasamvardhini dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 9 || lajjanamramukhe pranrityati shive lasyapriye lakshane lakshyarthe layavarjite lalitavakpiyushasamdohini
    | lakshmimanasarajahamsi lalite lamajjagandhapriye dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 10 || hrimkare hridayatrikonanilaye hridye suraradhite hrimkaradhvanilinacittasulabhe hrishteshvareshteshvari
    | hrimkaragnimukhaprashantakalanasarvajnasamrajyade dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 11 || satyasatyavivarjite samarase samvillate shashvate sarvajnanavibodhinishakarune saubhagyavidyamayi
    | saccitsaukhyavilasakelikutuke sarvapavargatmike dehi shripadapadmabhaktimanisham dharmambike shrishive
    || 12 || karmakarmavivarjite kavimukhe vagvrishtikadambini kavyalapavibodhinishakalike kaumari katyayani
    | kantardhenduvibhushane smarakale shrikamakotishvari dehi shripadapadmabhaktimanisham dharmambike
    shrishive || 13 || labdhashrikamalalayalayalasatkameshvarapreyasi laksharaktarasapraliptacaranadvandve
    laghushyamale | lauhityacchavipatalisumapade paryaptakamaprade dehi shripadapadmabhaktimanisham dharmambike
    shrishive || 14 || hrimkarotthitanadasamtatisudhadharabhisamtarpite hrimkaratrayamantravidrumalatajyotihsvarupe
    pare | hrimkarakshararupini tribhuvanashrirajarajeshvari dehi shripadapadmabhaktimanisham dharmambike
    shrishive || 15 || mulalavalajaparavitapiprasunai
  devanagari: धर्माम्बिकास्तवः त्यागराजविरचितः कल्याणामृतकामधेनुमहिले कामप्रियाहर्षदे कारुण्यामृतवापिके
    पिकशिशुस्वानन्दसल्लापिनि । कामेशप्रियकामकल्पलतिके कादम्बवाटीप्रिये देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके
    श्रीशिवे ॥ १ ॥ एणीबालविलोचने फणिमणिश्रेणीलसत्कङ्कणे तूणीराकृतजङ्घिके त्रिनयने स्थाणोर्मनोहारिणि ।
    वाणीपाणिसरोजवादितलसद्वीणास्वरालापिके देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ २ ॥ ईशित्वादिविभूतिकस्वविभवे
    ईकारसिंहासने इन्द्राणीपठितस्तुते इहपरत्राणध्वजे इन्दिरे । ईशानादिसुरेन्द्रसेवकजने ईशाधिराजेश्वरी देहि
    श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ ३ ॥ लावण्याब्धिपयोजवक्त्रनयने लक्ष्मीकरालोकने लक्ष्मीकान्तनिषेविताङ्घ्रिकमले
    लम्बोदरश्रीकरि । लक्ष्यालक्ष्यविलक्षणे क्षणवतां स्वानन्दवृद्धिप्रदे देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके
    श्रीशिवे ॥ ४ ॥ ह्रीपाशादिविमोचनेऽतिचतुरे हृद्ग्रन्थिविच्छेदिके हृद्यानन्दसुधारसार्द्रमधुना संतर्पणाह्लादिनि
    । ह्रींकारार्थजगद्विलासविभवे विद्ये विमर्शात्मिके देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥
    ५ ॥ हस्तिश्रेष्ठसुकुम्भसंनिभकुचे हर्यक्षमध्ये शुभे हेमाब्जाननपाणिपादनयने चन्द्रार्धफाले शिवे । हे
    मारारिमतेर्विमोहदलसन्नीलालके निर्मले देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ ६ ॥ सत्यानन्दचिदीश्वरप्रणयिनी
    सौभाग्यरत्नाकरी साम्राज्यप्रभुदेशिकेन्द्रकरुणास्यन्दामृतस्वर्धुनी । सर्वाशारहितस्य भक्तहृदयस्यानन्दकादम्बिनी
    देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ ७ ॥ कल्पे कालकलेशि कल्पकलने संकल्पसिद्धाखिले कालाकालविभागकल्पनकले
    कालान्तकप्रेयसि । कालोपाधिविवर्जिते कलिमलप्रध्वंसिनी कामदे देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे
    ॥ ८ ॥ हक्षद्वन्द्वदलत्रिकोणविलसज्ज्योत्स्नाकलाराधिते हंसद्वन्द्वगतिप्रबोधजननश्रीदेशिकेन्द्रात्मिके
    । हंसारोहविचक्षणे अभयदे आनन्दसंवर्धिनी देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ ९ ॥ लज्जानम्रमुखे
    प्रनृत्यति शिवे लास्यप्रिये लक्षणे लक्ष्यार्थे लयवर्जिते ललितवाक्पीयूषसंदोहिनि । लक्ष्मीमानसराजहंसि
    ललिते लामज्जगन्धप्रिये देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ १० ॥ ह्रींकारे हृदयत्रिकोणनिलये
    हृद्ये सुराराधिते ह्रींकारध्वनिलीनचित्तसुलभे हृष्टेश्वरेष्टेश्वरि । ह्रींकाराग्निमुखप्रशान्तकलनासर्वज्ञसाम्राज्यदे
    देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ ११ ॥ सत्यासत्यविवर्जिते समरसे संविल्लते शाश्वते सर्वज्ञानविबोधिनीशकरुणे
    सौभाग्यविद्यामयि । सच्चित्सौख्यविलासकेलिकुतुके सर्वापवर्गात्मिके देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके
    श्रीशिवे ॥ १२ ॥ कर्माकर्मविवर्जिते कविमुखे वाग्वृष्टिकादम्बिनी काव्यालापविबोधिनीशकलिके कौमारि कात्यायनि
    । कान्तार्धेन्दुविभूषणे स्मरकले श्रीकामकोटीश्वरी देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥
    १३ ॥ लब्धश्रीकमलालयालयलसत्कामेश्वरप्रेयसी लाक्षारक्तरसप्रलिप्तचरणद्वन्द्वे लघुश्यामले । लौहित्यच्छविपाटलीसुमपदे
    पर्याप्तकामप्रदे देहि श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ १४ ॥ ह्रींकारोत्थितनादसंततिसुधाधाराभिसंतर्पिते
    ह्रींकारत्रयमन्त्रविद्रुमलताज्योतिःस्वरूपे परे । ह्रींकाराक्षररूपिणि त्रिभुवनश्रीराजराजेश्वरी देहि
    श्रीपदपद्मभक्तिमनिशं धर्माम्बिके श्रीशिवे ॥ १५ ॥ मूलालवालजपराविटपिप्रसूनै
