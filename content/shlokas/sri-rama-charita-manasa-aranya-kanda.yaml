    बिनु फर सर रघुपति मोहि मारा ॥ सत जोजन आयुँ छन माहीं। तिन्ह सन बयरु किएँ भल नाहीम् ॥ भि मम कीट भृङ्ग
    की नाई। जहँ तहँ मैं देखुँ दौ भाई ॥ जौं नर तात तदपि अति सूरा। तिन्हहि बिरोधि न आइहि पूरा ॥ दो जेहिं
