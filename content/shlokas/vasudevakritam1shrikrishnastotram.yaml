id: vasudevakritam1shrikrishnastotram
category: stotram
name:
  english: vasudevakritam1shrikrishnastotram
  devanagari: वसुदेवकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: vasudevakritam 1 shrikrishnastotram vasudeva uvaca | prasida devadevesha devanam pravara prabho
    | tatha''vayoh prasadena kritabhyuddhara keshava || 80|| aradhito yadbhagavanavatirno grihe mama |
    durvrittanidhanarthaya tena nah pavitam kulam || 81|| tvamantah sarvabhutanam sarvabhuteshvavasthitah
    | vartate ca samastatmamstvatto bhutabhavishyati || 82|| yajne tvamijyase'cintya sarvadevamayacyute
    | tvameva yajno yajva ca yajnanam parameshvara || 83|| sapahnavam mama mano yadetattvayi jayate |
    devakyashca''tmajapritya tadatyantavidambana || 84|| tvam karta sarvabhutanamanadinidhano bhavan |
    kva ca me manushasyaisha jihva putreti vakshyati || 85|| jagadetajjagannatha sambhutamakhilam yatah
    | kaya yuktya vina mayam so'smattah sambhavishyati || 86|| yasminpratishthitam sarvam jagatsthavarajangamam
    | sa koshthotsangashayane manushyajjayate katham || 87|| sa tvam prasida parameshvara pahi vishva
  devanagari: वसुदेवकृतं १ श्रीकृष्णस्तोत्रम् वसुदेव उवाच । प्रसीद देवदेवेश देवानां प्रवर प्रभो । तथाऽऽवयोः
    प्रसादेन कृताभ्युद्धार केशव ॥ ८०॥ आराधितो यद्भगवानवतीर्णो गृहे मम । दुर्वृत्तनिधनार्थाय तेन नः पावितं
    कुलम् ॥ ८१॥ त्वमन्तः सर्वभूतानां सर्वभूतेष्ववस्थितः । वर्तते च समस्तात्मंस्त्वत्तो भूतभविष्यती ॥ ८२॥
    यज्ञे त्वमिज्यसेऽचिन्त्य सर्वदेवमयाच्युते । त्वमेव यज्ञो यज्वा च यज्ञानां परमेश्वर ॥ ८३॥ सापह्नवं
    मम मनो यदेतत्त्वयि जायते । देवक्याश्चाऽऽत्मजप्रीत्या तदत्यन्तविडम्बना ॥ ८४॥ त्वं कर्ता सर्वभूतानामनादिनिधनो
    भवान् । क्व च मे मानुषस्यैषा जिह्वा पुत्रेति वक्ष्यति ॥ ८५॥ जगदेतज्जगन्नाथ सम्भूतमखिलं यतः । कया युक्त्या
    विना मायां सोऽस्मत्तः सम्भविष्यति ॥ ८६॥ यस्मिन्प्रतिष्ठितं सर्वं जगत्स्थावरजङ्गमम् । स कोष्ठोत्सङ्गशयने
    मनुष्याज्जायते कथम् ॥ ८७॥ स त्वं प्रसीद परमेश्वर पाहि विश्व
