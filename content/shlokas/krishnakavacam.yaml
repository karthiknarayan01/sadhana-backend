id: krishnakavacam
category: kavacha
name:
  english: krishnakavacam
  devanagari: क्रिश्नकवचम्
content:
  english: om sarveshaya svaheti kankalam patu me sada | om gopiramanaya svaha nitambam patu me sada ||
    36|| om gopiramananathaya padau patu sada mama | om hrim shrim rasikeshaya svaha sarvam sada'vatu|37
    || om keshavaya svaheti mama keshansada'vatu | namah krishnaya svaheti brahmarandhram sada'vatu ||
    38|| om madhavaya svaheti me lomani sada'vatu | om hrim shrim rasikeshaya svaha sarvam sada'vatu ||
    39|| paripurnatamah krishnah pracyam mam sarvada'vatu | svayam golokanatho mamagneyam dishi rakshatu
    || 40|| purnabrahmasvarupashca dakshine mam sada'vatu | nairrityam patu mam krishnah pashcime patu
    mam harih || 41|| govindah patu mam shashvadvayavyam dishi nityashah | uttare mam sada patu rasikanam
    shiromanih || 42|| aishanyam mam sada patu vrindavana
  devanagari: ॐ सर्वेशाय स्वाहेति कङ्कालं पातु मे सदा । ॐ गोपीरमणाय स्वाह नितम्बं पातु मे सदा ॥ ३६॥ ॐ
    गोपीरमणनाथाय पादौ पातु सदा मम । ॐ ह्रीं श्रीं रसिकेशाय स्वाहा सर्वं सदाऽवतु।३७ ॥ ॐ केशवाय स्वाहेति
    मम केशान्सदाऽवतु । नमः कृष्णाय स्वाहेति ब्रह्मरन्ध्रं सदाऽवतु ॥ ३८॥ ॐ माधवाय स्वाहेति मे लोमानि सदाऽवतु
    । ॐ ह्रीं श्रीं रसिकेशाय स्वाहा सर्वं सदाऽवतु ॥ ३९॥ परिपूर्णतमः कृष्णः प्राच्यां मां सर्वदाऽवतु ।
    स्वयं गोलोकनाथो मामाग्नेयां दिशि रक्षतु ॥ ४०॥ पूर्णब्रह्मस्वरूपश्च दक्षिणे मां सदाऽवतु । नैरॄत्यां
    पातु मां कृष्णः पश्चिमे पातु मां हरिः ॥ ४१॥ गोविन्दः पातु मां शश्वद्वायव्यां दिशि नित्यशः । उत्तरे
    मां सदा पातु रसिकानां शिरोमणिः ॥ ४२॥ ऐशान्यां मां सदा पातु वृन्दावन
