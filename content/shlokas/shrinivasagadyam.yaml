id: shrinivasagadyam
category: stotram
name:
  english: shrinivasagadyam
  devanagari: श्रीनिवासगद्यम्
content:
  english: ringa galadgagana gangasamalingitasya || 4|| simatigaguna ramanuja muni namankita bahubhumashraya
    suradhama layavanarama yatavanasima parivrita vishankatatata nirantara vijrimbhita bhaktirasa nirjharanantaryaharya
    prasravana dharapura vibhramada salilabhara bharita maha tatakamanditasya || 5|| kalikardamamalamardana
    kalitodyama vilasadyamaniyamadima munigana nishevyamana pratyakshibhavannijasalila samajjananamajjana
    nikhila papanashana papanashana tirthadhyasitasya || 6|| murari sevaka jaradhipidita nirartijivana
    nirashabhusura varatisundara surangana ratikaranga saushthava kumaratakriti kumarataraka samapanodaya
    damanapataka mahapadamaya vihapanodita sakala bhuvana vidita kumaradharabhidhana tirthadhishthitasya
    || 7|| dharani talagata sakalahata kalilashubha salilagata bahulavividha malahati catura ruciratara
    vilokamatravidalita vividha mahapataka svamipushkarini sametasya || 8|| bahusankata narakavata patadutkata
    kalikankata kalushodbhata janapataka vinipataka rucinataka karahataka kalashahrita kamalarata shubhamajjana
    jalasajjana bharita nijadurita hatinirata janasatata nirargalapeyiyamana salila sambhrita vishankata
    katahatirtha bhushitasya || 9|| evamadima bhurimanjima sarvapataka garvahapaka sindhudambara harishambara
    vividhavipula punyatirtha nivaha nivasasya || 10|| shri venkatacalasya || 11|| shikharashekhara mahakalpa
    shakhi || 12|| kharvibhavadatigarvi kritagurumervisha girimukhorvidharakuladarvikara dayitorvi dharashikharorvi
    satata sadurvi kriticananavaghanagarvacarvananipuna tanukirana masrinita girishikharashekhara tarunikara
    timirah || 13|| vanipati sharvanidayitendranishvaramukhananiyo rasaveni nibha shubhavani nutamahimani
    yastarakoni bhavadakhilabhuvana bhavanodarah || 14|| vaimanika gurubhumadhika guna ramanuja kritadhamakara
    karadhamaridara lalamaccha kanaka damayita nijaramalayanavakisalayamaya torana malayitavanamaladharah
    || 15|| kalambuda malanibha nilalaka jalavrita balabja salilamalaphalanka samulamrita dharadvayavadhirana
    dhiralalitatara vishadatara ghana ghanasaramayordhvapundra rekhadvayarucirah || 16|| suvikasvaradalabhasvarakamalodaragatameduranavakesaratatibhasuraparipinjara
  devanagari: ृङ्ग गलद्गगन गङ्गासमालिङ्गितस्य ॥ ४॥ सीमातिगगुण रामानुज मुनि नामाङ्कित बहुभूमाश्रय सुरधामा
    लयवनरामा यतवनसीमा परिवृत विशङ्कटतट निरन्तर विजृम्भित भक्तिरस निर्झरानन्तार्याहार्य प्रस्रवण धारापूर
    विभ्रमद सलिलभर भरित महा तटाकमण्डितस्य ॥ ५॥ कलिकर्दममलमर्दन कलितोद्यम विलसद्यमनियमादिम मुनिगण निषेव्यमाण
    प्रत्यक्षीभवन्निजसलिल समज्जननमज्जन निखिल पापनाशन पापनाशन तिर्थाध्यासितस्य ॥ ६॥ मुरारि सेवक जराधिपीडित
    निरार्तिजीवन निराशभूसुर वरातिसुन्दर सुराङ्गना रतिकराङ्ग सौष्ठव कुमारताकृति कुमारतारक समापनोदय दमानपातक
    महापदामय विहापनोदित सकल भुवन विदित कुमारधाराभिधान तिर्थाधिष्ठितस्य ॥ ७॥ धरणि तलगत सकलहत कलिलशुभ सलिलगत
    बहुलविविध मलहति चतुर रुचिरतर विलोकमात्रविदलित विविध महापातक स्वामिपुष्करिणी समेतस्य ॥ ८॥ बहुसङ्कट
    नरकावट पतदुत्कट कलिकङ्कट कलुषोद्भट जनपातक विनिपातक रुचिनाटक करहाटक कलशाहृत कमलारत शुभमज्जन जलसज्जन
    भरित निजदुरित हतिनिरत जनसतत निरर्गलपेयीयमान सलिल सम्भृत विशङ्कट कटाहतीर्थ भूषितस्य ॥ ९॥ एवमादिम भुरिमञ्जिम
    सर्वपातक गर्वहापक सिन्धुडम्बर हारिशम्बर विविधविपुल पुण्यतीर्थ निवह निवासस्य ॥ १०॥ श्री वेङ्कटाचलस्य
    ॥ ११॥ शिखरशेखर महाकल्प शाखी ॥ १२॥ खर्वीभवदतिगर्वि कृतगुरुमेर्विश गिरिमुखोर्वीधरकुलदर्वीकर दयितोर्वी
    धरशिखरोर्वी सतत सदुर्वी कृतिचणनवघनगर्वचर्वणनिपुण तनुकिरण मसृणित गिरिशिखरशेखर तरुनिकर तिमिरः ॥ १३॥
    वाणीपति शर्वाणीदयितेन्द्राणीश्वरमुखनाणीयो रसवेणी निभ शुभवाणी नुतमहिमाणी यस्तरकोणी भवदखिलभुवन भवनोदरः
    ॥ १४॥ वैमानिक गुरुभूमाधिक गुण रामानुज कृतधामाकर करधामारिदर ललामाच्छ कनक दामायित निजरामालयनवकिसलयमय
    तोरण मालायितवनमालाधरः ॥ १५॥ कालाम्बुद मालानिभ नीलालक जालावृत बालाब्ज सलीलामलफालाङ्क समूलामृत धाराद्वयावधीरण
    धीरललिततर विशदतर घन घनसारमयोर्ध्वपुण्ड्र रेखाद्वयरुचिरः ॥ १६॥ सुविकस्वरदलभास्वरकमलोदरगतमेदुरनवकेसरततिभासुरपरिपिञ्जर
