id: mahogratarashtakastotram
category: stotram
name:
  english: mahogratarashtakastotram
  devanagari: महोग्रताराष्टकस्तोत्रम्
content:
  english: ste devasurasangare vijayino nihshankamanke gatah | devo'ham bhuvane na me sama iti sparddham
    vahantah pare tattulya niyatam tatha ciramami nasham vrajanti svayam || 6|| tvannamasmaranat palayanapara
    drashtum ca shakta na te bhutapretapishacarakshasagana yakshashca nagadhipah | daitya danavapungavashca
    khacara vyaghradika jantavo dakinyah kupitantakashca manuja matah kshanam bhutale || 7|| lakshmih
    siddhaganashca padukamukhah siddhastatha varinam stambhashcapi ranangane gajaghatastambhastatha mohanam
    | matastvatpadasevaya khalu nrinam siddhyanti te te gunah kantih kantatara bhavecca mahati mudho'pi
    vacaspatih || 8|| tarashtakamidam ramyam bhaktiman yah pathennarah | pratarmadhyahnakale ca sayahne
    niyatah shucih || 9|| labhate kavitam divyam sarvashastrarthavid bhavet | lakshmimanashvaram prapya
    bhuktva bhogan yathepsitan || 10|| kirti kantim ca nairujyam sarvesham priyatam vrajet | vikhyatim
    caiva lokeshu prapyante mokshamapnuyat || 11|| iti shrimahogratarashtakastotram sampurnam ||
  devanagari: स्ते देवासुरसङ्गरे विजयिनो निःशङ्कमङ्के गताः । देवोऽहं भुवने न मे सम इति स्पर्द्धां वहन्तः
    परे तत्तुल्या नियतं तथा चिरममी नाशं व्रजन्ति स्वयम् ॥ ६॥ त्वन्नामस्मरणात् पलायनपरा द्रष्टुं च शक्ता
    न ते भूतप्रेतपिशाचराक्षसगणा यक्षाश्च नागाधिपाः । दैत्या दानवपुङ्गवाश्च खचरा व्याघ्रादिका जन्तवो डाकिन्यः
    कुपितान्तकाश्च मनुजा मातः क्षणं भूतले ॥ ७॥ लक्ष्मीः सिद्धगणाश्च पादुकमुखाः सिद्धास्तथा वारिणां स्तम्भश्चापि
    रणाङ्गणे गजघटास्तम्भस्तथा मोहनम् । मातस्त्वत्पदसेवया खलु नृणां सिद्ध्यन्ति ते ते गुणाः कान्तिः कान्ततरा
    भवेच्च महती मूढोऽपि वाचस्पतिः ॥ ८॥ ताराष्टकमिदं रम्यं भक्तिमान् यः पठेन्नरः । प्रातर्मध्याह्नकाले
    च सायाह्ने नियतः शुचिः ॥ ९॥ लभते कवितां दिव्यां सर्वशास्त्रार्थविद् भवेत् । लक्ष्मीमनश्वरां प्राप्य
    भुक्त्वा भोगान् यथेप्सितान् ॥ १०॥ कीर्ति कान्तिं च नैरुज्यं सर्वेषां प्रियतां व्रजेत् । विख्यातिं
    चैव लोकेषु प्राप्यान्ते मोक्षमाप्नुयात् ॥ ११॥ इति श्रीमहोग्रताराष्टकस्तोत्रं सम्पूर्णम् ॥
