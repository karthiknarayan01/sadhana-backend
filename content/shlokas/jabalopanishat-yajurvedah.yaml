id: jabalopanishat-yajurvedah
category: upanishad
name:
  english: jabalopanishat (yajurvedah)
  devanagari: जाबालोपनिषत् (यजुर्वेदः)
content:
  english: upanishad || jabalopanishat || om purnamadah purnamidam purnat purnamudacyate | purnasya purnamadaya
    purnamevavashishyate || om shantih shantih shantih || brihaspatiruvaca yajnavalkyam yadanu kurukshetram
    devanam devayajanam sarvesham bhutanam brahmasadanam | avimuktam vai kurukshetram devanam devayajanam
    sarvesham bhutanam brahmasadanam | tasmadyatra kvacana gacchati tadeva manyeta tadavimuktameva | idam
    vai kurukshetram devanam devayajanam sarvesham bhutanam brahmasadanam | atra hi jantoh praneshutkramamaneshu
    rudrastarakam brahma vyacashte yenasavamritibhutva mokshibhavati | tasmadavimuktameva nisheveta avimuktam
    na vimuncedevamevaitadyajnavalkyah || 1 || atha hainamatrih papraccha yajnavalkyam ya esho'nanto'vyakta
    atma tam kathamaham vijaniyamiti | sa hovaca yajnavalkyah so'vimukta upasyo ya esho'nanto'vyakta atma
    so'vimukte pratishthita iti || 2 || so'vimuktah kasminpratishthita iti varanayam nashyam ca madhye
    pratishthita iti | ka vai varana ka ca nashiti | sarvanindriyakritandoshanvarayatiti tena varana bhavati
    | sarvanindriyakritanpapannashayatiti tena nashi bhavatiti | katamam casya sthanam bhavatiti | bhruvorghranasya
    ca yah sandhih sa esha dyaurlokasya parasya ca sandhirbhavatiti | etadvai sandhim sandhyam brahmavida
    upasata iti | so'vimukta upasya iti | so'vimuktam jnanamacashte | yo vaitadevam vedeti || 3 || atha
    hainam brahmacarina ucuh kim japyenamritatvam bruhiti | sa hovaca yajnavalkyah | shatarudriyenetyetanyeva
    ha va amritasya namani | etairha va amrito bhavatiti || 4 || atha ha janako vaideho yajnavalkyamupasametyovaca
    bhagavansamnyasam bruhiti | sa hovaca yajnavalkyah | brahmacaryam samapya grihi bhavet | grihi bhutva
    vani bhavet | vani bhutva pravrajet | yadi vetaratha brahmacaryadeva pravrajedgrihadva vanadva | atha
    punaravrati va vrati va snatako va'snatako va utsannagniranagniko va yadahareva virajettadahareva
    pravrajet || 5 || taddhaike prajapatyameveshtim kurvanti | tadu tatha na kuryadagneyimeva kuryat |
    agnirha vai pranah pranameva tatha karoti | pancantraidhataviyameva kuryat | etayaiva trayo dhatavo
    yaduta sattvam rajastama iti | ayam te yonih ritvijo yato jatah arocathah | tam janannagna arohatha
    no vardhayarayim | ityanena mantrenagnimajighret | esha ha va agneryoniryah pranah pranam gaccha svahetyevamevaitadaha
    || 6 || gramadagnimahritya purvadagnimaghrapayet | yadyagnim na vindedapsu juhuyat | apo vai sarva
    devatah | sarvabhyo devatabhyo juhomi svaheti hutvodhritya prashniyatsajyam haviranamayam mokshamantrah
    trayyaivam vindet | tadbrahmaitadupasitavyam | evamevaitadbhagavanniti vai yajnavalkyah || 7 || atha
    hainamatrih papraccha yajnavalkyam | pricchami tva yajnavalkya ayajnopaviti katham brahmana iti |
    sa hovaca yajnavalkya idamevasya tadyajnopavitam ya atmapah prashyacamyayam vidhih parivrajakanam
    || 8 || viradhvane va'nashake va'pam praveshe va'gnipraveshe va mahaprasthane va | atha parivradvivarnavasa
    mundo'parigrahah shuciradrohi bhaikshano brahmabhuyaya bhavatiti | yadyaturah syanmanasa vaca samnyaset
    | esha pantha brahmana hanuvittastenaiti samnyasi brahmavidityevamevaisha bhagavan vai yajnavalkyah
    || 9 || tatra paramahamsa nama samvartakarunishvetaketudurvasaribhunidaghajadabharatadattatreyaraivatakaprabhritayo'vyaktalinga
    avyaktacara anunmatta unmattavadacarantah || 10 || tridandam kamandalum shikyam patram jalapavitram
    shikham yajnopavitam ca ityetatsarvam bhuhsvahetyapsu parityajyatmanamanvicchet || 11 || yatha jatarupadharo
    nirdvando nishparigrahastattattvabrahmamarge samyaksampannah shuddhamanasah pranasandharanartham yathoktakale
    vimukto bhaikshamacarannudarapatrena labhalabhau samau bhutva shunyagaradevagrihatrinakutavalmikavrikshamula
  devanagari: उपनिषद् ॥ जाबालोपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय
    पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ बृहस्पतिरुवाच याज्ञवल्क्यं यदनु कुरुक्षेत्रं देवानां
    देवयजनं सर्वेषां भूतानां ब्रह्मसदनम् । अविमुक्तं वै कुरुक्षेत्रं देवानां देवयजनं सर्वेषां भूतानां
    ब्रह्मसदनम् । तस्माद्यत्र क्वचन गच्छति तदेव मन्येत तदविमुक्तमेव । इदं वै कुरुक्षेत्रं देवानां देवयजनं
    सर्वेषां भूतानां ब्रह्मसदनम् । अत्र हि जन्तोः प्राणेषूत्क्रममाणेषु रुद्रस्तारकं ब्रह्म व्याचष्टे येनासावमृतीभूत्वा
    मोक्षीभवति । तस्मादविमुक्तमेव निषेवेत अविमुक्तं न विमुञ्चेदेवमेवैतद्याज्ञवल्क्यः ॥ १ ॥ अथ हैनमत्रिः
    पप्रच्छ याज्ञवल्क्यं य एषोऽनन्तोऽव्यक्त आत्मा तं कथमहं विजानीयामिति । स होवाच याज्ञवल्क्यः सोऽविमुक्त
    उपास्यो य एषोऽनन्तोऽव्यक्त आत्मा सोऽविमुक्ते प्रतिष्ठित इति ॥ २ ॥ सोऽविमुक्तः कस्मिन्प्रतिष्ठित इति
    वरणायां नाश्यां च मध्ये प्रतिष्ठित इति । का वै वरणा का च नाशीति । सर्वानिन्द्रियकृतान्दोषान्वारयतीति
    तेन वरणा भवति । सर्वानिन्द्रियकृतान्पापान्नाशयतीति तेन नाशी भवतीति । कतमं चास्य स्थानं भवतीति । भ्रुवोर्घ्राणस्य
    च यः सन्धिः स एष द्यौर्लोकस्य परस्य च सन्धिर्भवतीति । एतद्वै सन्धिं सन्ध्यां ब्रह्मविद उपासत इति ।
    सोऽविमुक्त उपास्य इति । सोऽविमुक्तं ज्ञानमाचष्टे । यो वैतदेवं वेदेति ॥ ३ ॥ अथ हैनं ब्रह्मचारिण ऊचुः
    किं जप्येनामृतत्वं ब्रूहीति । स होवाच याज्ञवल्क्यः । शतरुद्रियेणेत्येतान्येव ह वा अमृतस्य नामानि ।
    एतैर्ह वा अमृतो भवतीति ॥ ४ ॥ अथ ह जनको वैदेहो याज्ञवल्क्यमुपसमेत्योवाच भगवन्संन्यासं ब्रूहीति । स
    होवाच याज्ञवल्क्यः । ब्रह्मचर्यं समाप्य गृही भवेत् । गृही भूत्वा वनी भवेत् । वनी भूत्वा प्रव्रजेत्
    । यदि वेतरथा ब्रह्मचर्यादेव प्रव्रजेद्गृहाद्वा वनाद्वा । अथ पुनरव्रती वा व्रती वा स्नातको वाऽस्नातको
    वा उत्सन्नाग्निरनग्निको वा यदहरेव विरजेत्तदहरेव प्रव्रजेत् ॥ ५ ॥ तद्धैके प्राजापत्यामेवेष्टिं कुर्वन्ति
    । तदु तथा न कुर्यादाग्नेयीमेव कुर्यात् । अग्निर्ह वै प्राणः प्राणमेव तथा करोति । पञ्चान्त्रैधातवीयामेव
    कुर्यात् । एतयैव त्रयो धातवो यदुत सत्त्वं रजस्तम इति । अयं ते योनिः ऋत्विजो यतो जातः अरोचथाः । तं
    जानन्नग्न आरोहाथा नो वर्धयरयिम् । इत्यनेन मन्त्रेणाग्निमाजिघ्रेत् । एष ह वा अग्नेर्योनिर्यः प्राणः
    प्राणं गच्छ स्वाहेत्येवमेवैतदाह ॥ ६ ॥ ग्रामादग्निमाहृत्य पूर्वदग्निमाघ्रापयेत् । यद्यग्निं न विन्देदप्सु
    जुहुयात् । आपो वै सर्वा देवताः । सर्वाभ्यो देवताभ्यो जुहोमि स्वाहेति हुत्वोधृत्य प्राश्नीयात्साज्यं
    हविरनामयं मोक्षमन्त्रः त्रय्यैवं विन्देत् । तद्ब्रह्मैतदुपासितव्यम् । एवमेवैतद्भगवन्निति वै याज्ञवल्क्यः
    ॥ ७ ॥ अथ हैनमत्रिः पप्रच्छ याज्ञवल्क्यम् । पृच्छामि त्वा याज्ञवल्क्य अयज्ञोपवीति कथं ब्राह्मण इति
    । स होवाच याज्ञवल्क्य इदमेवास्य तद्यज्ञोपवीतं य आत्मापः प्राश्याचम्यायं विधिः परिव्राजकानाम् ॥ ८ ॥
    वीराध्वाने वाऽनाशके वाऽपां प्रवेशे वाऽग्निप्रवेशे वा महाप्रस्थाने वा । अथ परिव्राड्विवर्णवासा मुण्डोऽपरिग्रहः
    शुचिरद्रोही भैक्षणो ब्रह्मभूयाय भवतीति । यद्यातुरः स्यान्मनसा वाचा संन्यसेत् । एष पन्था ब्रह्मणा हानुवित्तस्तेनैति
    संन्यासी ब्रह्मविदित्येवमेवैष भगवन् वै याज्ञवल्क्यः ॥ ९ ॥ तत्र परमहंसा नाम संवर्तकारुणिश्वेतकेतुदुर्वासऋभुनिदाघजडभरतदत्तात्रेयरैवतकप्रभृतयोऽव्यक्तलिङ्गा
    अव्यक्ताचारा अनुन्मत्ता उन्मत्तवदाचरन्तः ॥ १० ॥ त्रिदण्डं कमण्डलुं शिक्यं पात्रं जलपवित्रं शिखां यज्ञोपवीतं
    च इत्येतत्सर्वं भूःस्वाहेत्यप्सु परित्यज्यात्मानमन्विच्छेत् ॥ ११ ॥ यथा जातरूपधरो निर्द्वन्दो निष्परिग्रहस्तत्तत्त्वब्रह्ममार्गे
    सम्यक्सम्पन्नः शुद्धमानसः प्राणसन्धारणार्थं यथोक्तकाले विमुक्तो भैक्षमाचरन्नुदरपात्रेण लाभालाभौ समौ
    भूत्वा शून्यागारदेवगृहतृणकूटवल्मीकवृक्षमूल
