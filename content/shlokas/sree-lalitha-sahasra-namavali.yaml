id: sree-lalitha-sahasra-namavali
category: stotram
name:
  english: Sree Lalitha Sahasra Namavali
content:
  english: '|| dhyanam || sindurarunavigraham trinayanam manikyamaulisphurat taranayakashekharam smitamukhimapinavakshoruham
    | panibhyamalipurnaratnacashakam raktotpalam bibhratim saumyam ratnaghatastharaktacaranam dhyayetparamambikam
    || arunam karunatarangitakshim dhritapashankushapushpabanacapam | animadibhiravritam mayukhairahamityeva
    vibhavaye bhavanim || dhyayet padmasanastham vikasitavadanam padmapatrayatakshim hemabham pitavastram
    karakalitalasaddhemapadmam varangim | sarvalankarayuktam satatamabhayadam bhaktanamram bhavanim shrividyam
    shantamurtim sakalasuranutam sarvasampatpradatrim || sakunkumavilepanamalikacumbikasturikam samandahasitekshanam
    sasharacapapashankusham | asheshajanamohinimarunamalyabhushambaram japakusumabhasuram japavidhau smaredambikam
