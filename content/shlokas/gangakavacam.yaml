id: gangakavacam
category: kavacha
name:
  english: gangakavacam
  devanagari: गन्गाकवचम्
content:
  english: shiro me patu sa ganga divyacyutanghricyuta | bhalam bhagirathi patu netre ca jahnunandini
    || 3|| shruti me jahnavi patu ghranayugmam surapaga | rasanam patu me nityam ganga papapranashini
    || 4|| vadanam sakalam patu sada mandakini mama | skandhau patu ca me bahu ganga sagaragamini || 5||
    karau rakshatu sa ganga shambhumastakamandini | hridayam nabhimadhyam ca patu devanadi mama || 6||
    katidvayam sada patu brahmandakhandini mama | januni jahnuja patu payadurum trimargaga || 7|| gulphayugmam
    sada patu sa me sharmapradayini | prapadam patu me nityam kalikalmashanashini || 8|| kashitalagata
    ya ca kalindisangama ca ya | sa patu mama sarvangam ganga gaganamekhala || 9|| nirjarairvandita ya
    ca caturvargaphalaprada | tasya idam ca gangayah kavacam paramadbhutam || 10|| atha phalashrutih
  devanagari: शिरो मे पातु सा गङ्गा दिव्याच्युताङ्घ्रिच्युता । भालं भागीरथी पातु नेत्रे च जह्नुनन्दिनी
    ॥ ३॥ श्रुती मे जाह्नवी पातु घ्राणयुग्मं सुरापगा । रसनां पातु मे नित्यं गङ्गा पापप्रणाशिनी ॥ ४॥ वदनं
    सकलं पातु सदा मन्दाकिनी मम । स्कन्धौ पातु च मे बाहू गङ्गा सागरगामिनी ॥ ५॥ करौ रक्षतु सा गङ्गा शम्भुमस्तकमण्डिनी
    । हृदयं नाभिमध्यं च पातु देवनदी मम ॥ ६॥ कटिद्वयं सदा पातु ब्रह्माण्डखण्डिनी मम । जानुनी जह्नुजा पातु
    पायादूरूं त्रिमार्गगा ॥ ७॥ गुल्फयुग्मं सदा पातु सा मे शर्मप्रदायिनी । प्रपदं पातु मे नित्यं कलिकल्मषनाशिनी
    ॥ ८॥ काशीतलगता या च कालिन्दीसङ्गमा च या । सा पातु मम सर्वाङ्गं गङ्गा गगनमेखला ॥ ९॥ निर्जरैर्वन्दिता
    या च चतुर्वर्गफलप्रदा । तस्या इदं च गङ्गायाः कवचं परमाद्भुतम् ॥ १०॥ अथ फलश्रुतिः
