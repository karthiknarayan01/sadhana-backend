id: narasinha-inamocanastotra
category: stotram
name:
  english: narasinhaṟinamocanastotra
  devanagari: नरसिन्हऱिणमोचनस्तोत्र
content:
  english: shrinarasimharinamocanastotram shriganeshaya namah | om devanam karyasidhyartham sabhastambhasamudbhavam
    | shrinrisimham mahaviram namami rinamuktaye || 1|| lakshmyalingitavamangam bhaktanamabhayapradam
    | shrinrisimham mahaviram namami rinamuktaye || 2|| prahladavaradam shrisham daiteshvaravidaranam
    | shrinrisimham mahaviram namami rinamuktaye || 3|| smaranatsarvapapaghnam kadrujam vishanashanam
    | shrinrisimham mahaviram namami rinamuktaye || 4|| antramaladharam shankhacakrabjayudhadharinam |
    shrinrisimham mahaviram namami rinamuktaye || 5|| simhanadena mahata digdantibhayadayakam | shrinrisimham
    mahaviram namami rinamuktaye || 6|| kotisuryapratikashamabhicarikanashanam | shrinrisimham mahaviram
    namami rinamuktaye || 7|| vedantavedyam yajnesham brahmarudradisamstutam | shrinrisimham mahaviram
    namami rinamuktaye om || 8|| idam yo pathate nityam rinamocakasamjnakam | anrinijayate sadyo dhanam
    shighramavapnuyat || 9|| || iti shrinrisimhapurane rinamocanastotram sampurnam ||
  devanagari: श्रीनरसिंहऋणमोचनस्तोत्रम् श्रीगणेशाय नमः । ॐ देवानां कार्यसिध्यर्थं सभास्तम्भसमुद्भवम् ।
    श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ १॥ लक्ष्म्यालिङ्गितवामाङ्गं भक्तानामभयप्रदम् । श्रीनृसिंहं महावीरं
    नमामि ऋणमुक्तये ॥ २॥ प्रह्लादवरदं श्रीशं दैतेश्वरविदारणम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥
    ३॥ स्मरणात्सर्वपापघ्नं कद्रुजं विषनाशनम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ४॥ अन्त्रमालाधरं
    शङ्खचक्राब्जायुधधारिणम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ५॥ सिंहनादेन महता दिग्दन्तिभयदायकम्
    । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये ॥ ६॥ कोटिसूर्यप्रतीकाशमभिचारिकनाशनम् । श्रीनृसिंहं महावीरं नमामि
    ऋणमुक्तये ॥ ७॥ वेदान्तवेद्यं यज्ञेशं ब्रह्मरुद्रादिसंस्तुतम् । श्रीनृसिंहं महावीरं नमामि ऋणमुक्तये
    ॐ ॥ ८॥ इदं यो पठते नित्यं ऋणमोचकसंज्ञकम् । अनृणीजायते सद्यो धनं शीघ्रमवाप्नुयात् ॥ ९॥ ॥ इति श्रीनृसिंहपुराणे
    ऋणमोचनस्तोत्रं सम्पूर्णम् ॥
