id: kartaviryamahamantrah
category: mantra
name:
  english: kartaviryamahamantrah
  devanagari: कार्तवीर्यमहामन्त्रः
content:
  english: '| karishye''ham ca madhyahme yatheshtam sukhamicchati yantram ca pujayennityam || 6|| dainyattanastitadgehe
    sada kalam ca siddhisyad shatrunashaya nishcitam | alakshminashamayati vasa lakshmirnirantaram ||
    7|| adhama dharmam janati ishtapraptyai na samshayah | mahavashyakari yukto rajasammanameva ca mahakantakanashe
    ca nityotsaheti mangalam || 8|| sangrame darune vashye shastrabadha na jayate | rajadvare mahadvare
    vijayam prapnuvanti ca || 9|| santajvaravinashi ca caturthikanivaranam | apamrityuhare tasmaddirghamayuh
    sukhi bhavet || 10|| vyaghracorabhayam caiva agnibadha tathaiva ca | sarpabadham na janati sarvabadhavinashanam
    || 11|| kshayam ca durdaram rogam sada rogena piditam | yantrodakam pibennityam ashtamase tu jayate
    || 12|| gudavyadhi vinashi ca mutravyadhi vinashanam | yantrodakam pibennityam varshamekam tu jayate
    || 13|| dvikale pujayedyantram shucirbhutva ca manavah | kuryajjapam shatadinam labhedrajyadikam bhavet
    || 14|| dashapradakshinam nityam maunam kuryatsutam dridham | putrabhave tvaya nari labhet kritasutani
    ca || 15|| arkashcandrashca bhaumashca guruh kashyashshanaishcarah | budho rahushca ketushca tasya
    pida na jayate || 16|| pashyanti madadrishtinam nirbadha ca bhavishyati | yantrodakam pibennityam
    pushtiman navamasike || 17|| kanthe badhva ca bahunam balagrahanivaranam | pujayetkrishimadhyahne
    utkrishtam ca phalam labhet || 18|| praniyanmaranadanye svargaloke mahiyate | svasya papavinirmukto
    padam sayujyamapnuyat || 19|| iti damakeshvatantre umamaheshvarasamvade kartaviryayantram | prasanna
    tatkaliko bhavati shatkonopari tandulam nidhaya || 20|| avahanapurvakam dipam prajvalya pashcat japam
    kuryat | dipamadhye sarthapalani ghritam nidhaya tanmadhye ekadasha tantuvartikam kritva nidhaya dipam
    prajvalya | madhyamapakshe sardhadvitiyatankaghritam nidhaya tanmadhye ca | catuhsutravartikam kritva
    nidhaya dipam prajvalya uttama pakshe ashtottarasahasrajapah kanishtapakshe ashtottarashatam japah
    om phrim crim klim bhrum am hrim krim shrim hum phat svaha | shri karttaviryarjunaya namah | asya
    shri kartavirya mahamantrasya dattatreyo bhagavan rishih | karttaviryarjuno vidyuccakravarti devata
    | kam bijam | kim shaktih krim kilakam | mama sakala kamana sidhyarthe jape viniyogah kartaviryamantrah
    |'
  devanagari: । करिष्येऽहं च मध्याह्मे यथेष्टं सुखमिच्छति यन्त्रं च पूजयेन्नित्यम् ॥ ६॥ दैन्यात्तानास्तितद्गेहे
    सदा कालं च सिद्धिस्याद् शत्रुनाशाय निश्चितम् । अलक्ष्मीनाशमायाति वस लक्ष्मीर्निरन्तरम् ॥ ७॥ अधम धर्मं
    जानाति इष्टप्राप्त्यै न संशयः । महावश्यकरी युक्तो राजसम्मानमेव च महाकण्टकनाशे च नित्योत्साहेति मङ्गलम्
    ॥ ८॥ सङ्ग्रामे दारुणे वश्ये शस्त्रबाधा न जायते । राजद्वारे महाद्वारे विजयं प्राप्नुवन्ति च ॥ ९॥ सान्तज्वरविनाशी
    च चातुर्थिकनिवारणम् । अपमृत्युहरे तस्माद्दीर्घमायुः सुखी भवेत् ॥ १०॥ व्याघ्रचोरभयं चैव अग्निबाधा तथैव
    च । सर्पबाधां न जानाति सर्वबाधाविनाशनम् ॥ ११॥ क्षयं च दुर्दरं रोगं सदा रोगेण पीडितम् । यन्त्रोदकं
    पिबेन्नित्यं अष्टमासे तु जायते ॥ १२॥ गुदव्याधि विनाशी च मूत्रव्याधि विनाशनम् । यन्त्रोदकं पिबेन्नित्यं
    वर्षमेकं तु जायते ॥ १३॥ द्विकाले पूजयेद्यन्त्रं शुचिर्भूत्वा च मानवः । कुर्याज्जपं शतदिनं लभेद्राज्यादिकं
    भवेत् ॥ १४॥ दशप्रदक्षिणं नित्यं मौनं कुर्यात्सुतं दृढम् । पुत्राभावे त्वया नारी लभेत् कृतसुतानि च
    ॥ १५॥ अर्कश्चन्द्रश्च भौमश्च गुरुः काश्यश्शनैश्चरः । बुधो राहुश्च केतुश्च तस्य पीडा न जायते ॥ १६॥
    पश्यन्ती मददृष्टीनां निर्बाधा च भविष्यति । यन्त्रोदकं पिबेन्नित्यं पुष्टिमान् नवमासिके ॥ १७॥ कण्ठे
    बध्वा च बाहूनां बालग्रहनिवारणम् । पूजयेत्कृषिमध्याह्ने उत्कृष्टं च फलं लभेत् ॥ १८॥ प्राणीयान्मरणादन्ये
    स्वर्गलोके महीयते । स्वस्य पापविनिर्मुक्तो पदं सायुज्यमाप्नुयात् ॥ १९॥ इति डामकेश्वतन्त्रे उमामहेश्वरसंवादे
    कार्तवीर्ययन्त्रम् । प्रसन्ना तात्कालिको भवति षट्कोणोपरि तण्डुलं निधाय ॥ २०॥ आवाहनपूर्वकं दीपं प्रज्वाल्य
    पश्चात् जपं कुर्यात् । दीपमध्ये सार्थपलानि घृतं निधाय तन्मध्ये एकादश तन्तुवर्तिकां कृत्वा निधाय दीपं
    प्रज्वाल्य । मध्यमपक्षे सार्धद्वितीयटङ्कघृतं निधाय तन्मध्ये च । चतुःसूत्रवर्तिकां कृत्वा निधाय दीपं
    प्रज्वाल्य उत्तम पक्षे अष्टोत्तरसहस्रजपः कनिष्टपक्षे अष्टोत्तरशतं जपः ॐ फ्रीं च्रीं क्लीं भ्रूं आं
    ह्रीं क्रीं श्रीं हुं फट् स्वाहा । श्री कार्त्तवीर्यार्जुनाय नमः । अस्य श्री कार्तवीर्य महामन्त्रस्य
    दत्तात्रेयो भगवान् ऋषिः । कार्त्तवीर्यार्जुनो विद्युच्चक्रवर्ती देवता । कां बीजम् । कीं शक्तिः कृं
    कीलकम् । मम सकल कामना सिध्यर्थे जपे विनियोगः कार्तवीर्यमन्त्रः ।
