id: brahmakamandalutirthastotram
category: stotram
name:
  english: brahmakamandalutirthastotram
  devanagari: ब्रह्मकमण्डलुतीर्थस्तोत्रम्
content:
  english: brahmakamandalutirthastotram || shriganeshaya namah || devarshaya ucuh | sarvadibhutam triguneshu
    samstham tirtheshu yat sarvavikarahinam | tirtham turiyam ca namamahe tattirthatmakam papavinashadaksham
    || 4|| gangadinadyah prabhava yatashca sarvantarastham sthitamatmarupam | nadatmakam rupamatho vidhaya
    taccalakam yattu namamahe tat || 5|| puranagitam vidhipapanasham kamandalustham paramaprameyam | aparatirtheshu
    tadatmabhavam bhavishyate dehadharam namamah || 6|| natho vidhata ca bhavenmahatman papena yuktashca
    tatha sthitashcet | vishvam param nashamupaishyati tvam pratyakshatamehi dayakaratah || 7|| gangasvarupaya
    namo namaste brahmatmajarupadharaya tubhyam | tubhyam prayagaya ca narmadaya kalindikasthaya namo
    namo vai || 8|| krishnasvarupaya kakudmatistha yaddevanadyai ca payoshnikayai | venisvarupaya ca pushkaraya
    tapiprabhasaya ca sarvatirtha || 9|| godavarirupadharaya tubhyam kshiprasthasindhustha mahisvarupa
    | kaverikastham sarayusvarupam purne namaste'stu kamandalustham || 10|| sardhatrikotipravarasthakaya
    tirtheshvarayaiva namo namaste | anantatirthapravaraya nityam kshetre mayure tu samasthitaya || 11||
    varampatisthaya sarovaraya vapisthakupaya namo namaste | yadyajjalam bhanughanastharupam tatrasthakayaiva
    namo namaste || 12|| tvaya tatam sarvamidam vibhati caracarastham ca jalam paresha | kripakatakshamritadharaya'sman
    rakshasva sandarshaya te svarupam || 13||
  devanagari: ब्रह्मकमण्डलुतीर्थस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ देवर्षय ऊचुः । सर्वादिभूतं त्रिगुणेषु संस्थं
    तीर्थेषु यत् सर्वविकारहीनम् । तीर्थं तुरीयं च नमामहे तत्तीर्थात्मकं पापविनाशदक्षम् ॥ ४॥ गङ्गादिनद्यः
    प्रभवा यतश्च सर्वान्तरस्थं स्थितमात्मरूपम् । नादात्मकं रूपमथो विधाय तच्चालकं यत्तु नमामहे तत् ॥ ५॥
    पुराणगीतं विधिपापनाशं कमण्डलुस्थं परमप्रमेयम् । अपारतीर्थेषु तदात्मभावं भविष्यते देहधरं नमामः ॥ ६॥
    नाथो विधाता च भवेन्महात्मन् पापेन युक्तश्च तथा स्थितश्चेत् । विश्वं परं नाशमुपैष्यति त्वं प्रत्यक्षतामेहि
    दयाकरातः ॥ ७॥ गङ्गास्वरूपाय नमो नमस्ते ब्रह्मात्मजारूपधराय तुभ्यम् । तुभ्यं प्रयागाय च नार्मदाय कालिन्दिकास्थाय
    नमो नमो वै ॥ ८॥ कृष्णास्वरूपाय ककुद्मतीस्थ यद्देवनद्यै च पयोष्णिकायै । वेणीस्वरूपाय च पुष्कराय तापीप्रभासाय
    च सर्वतीर्थ ॥ ९॥ गोदावरीरूपधराय तुभ्यं क्षिप्रास्थसिन्धुस्थ महीस्वरूप । कावेरिकास्थं सरयूस्वरूपं पूर्णे
    नमस्तेऽस्तु कमण्डलुस्थम् ॥ १०॥ सार्धत्रिकोटीप्रवरस्थकाय तीर्थेश्वरायैव नमो नमस्ते । अनन्ततीर्थप्रवराय
    नित्यं क्षेत्रे मयूरे तु समास्थिताय ॥ ११॥ वाराम्पतिस्थाय सरोवराय वापीस्थकूपाय नमो नमस्ते । यद्यज्जलं
    भानुघनस्थरूपं तत्रस्थकायैव नमो नमस्ते ॥ १२॥ त्वया ततं सर्वमिदं विभाति चराचरस्थं च जलं परेश । कृपाकटाक्षामृतधारयाऽस्मान्
    रक्षस्व सन्दर्शय ते स्वरूपम् ॥ १३॥
