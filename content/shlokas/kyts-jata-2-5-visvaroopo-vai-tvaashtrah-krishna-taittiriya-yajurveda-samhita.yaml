id: kyts-jata-2-5-visvaroopo-vai-tvaashtrah-krishna-taittiriya-yajurveda-samhita
category: stotram
name:
  english: KYTS Jata 2.5 Visvaroopo Vai Tvaashtrah - Krishna Taittiriya Yajurveda Samhita
content:
  english: vishvarupo vai vai vishvarupo vishvarupo vai | vishvarupa iti vishva vai tvashtra stvashtro
    vai vai tvashtrah | tvashtrah purohitah purohita stvashtra stvashtrah purohitah | mpurohitah purohito
    devana purohita iti purah thsvasriyah svasriya asi dasi svasriyo 'surana masuranag svasriyah svasriyo
    'suranam | ntasya tasya surana masurana tasya trini trini tasya tasya trini | trini shirshani shirshani
    trini trini shirshani | nchirshani shirsha nyasann | nthsomapanagm somapana masa somapanagm surapanagm
    surapanagm somapanagm somapanagm surapana surapana mannadana mannadanagm surapanagm surapana mannadanam
    | surapanamiti sura 'nnadana mannadanagm sah | mpratyakshagm sa sa pratyaksha ndevebhyo devebhyah
    pratyaksha pratyakshamiti prati ndevebhyo devebhyo bhagam | paroksha masurebhyo 'surebhyah paroksha
    mparoksha masurebhyah | ssarvasmai sarvasma asurebhyo 'surebhya sarvasmai vai vai sarvasmai sarvasmai
    vai | pratyakshamiti prati va~danti vadanti bhaga vadanti yasmai yasmai vadanti vadanti yasmai yasma
    evaiva yasmai yasma eva | mparoksha mevaiva paroksha va~danti vadanti paroksha vadanti tasya tasya
    vadanti vadanti tasya | tasya bhago bhaga stasya tasya bhagah | bhaga udita udito bhago bhaga uditah
    | ttasma dudita udita stasma tasma dindra indra stasma ttasma dindrah | indro 'bibhe dabibhe dindra
    indro 'bibhet | abibhe didrim idrim mabibhe dabibhe didrim | vai rashtragm rashtram vi~ vi rashtragm
    rashtram vi paryavartayati paryavartayati vi vi paryavartayati | paryavartayatititi paryavartayati
    paryavartayatiti | paryavartayatiti pari iti tasya tasye titi tasya | vajra madaya daya vajram adaya
    shirshani shirsha nyadaya daya shirshani | shirsha nyacchina dacchinac chirshani shirsha nyacchinat
    | thsomapanagm somapanam somapana masi dasi thsomapanagm somapana masi sa kapinjalah kapinjala tkapinjalah
    kapinjalo 'bhavat | thsurapanagm surapanam surapanagm sa sa surapanagm surapanagm sah | surapanamiti
    sura sa kalavinkah kalavinka tkalavinkah kalavinko yat | yadannadana mannadanam 'nnadana mannadanagm
    sah | sa tittiri stittiri tittiri stasya tasya tittiri stittiri stasya | 'njalina tasya tasya mbrahmahatya
    manjalina brahmahatya mupopa brahmahatya mbrahmahatya mupa | brahmahatyamiti brahma upagrihna dagrihna
    dupopa grihnat | nta magrihna dagrihna nta mabibha rabibha stam | mbhutani bhutani ta bhuta nyabhyabhi
    bhutani bhuta nyabhi | brahmahanniti brahma iti sa sa ititi sah | mprithivigm sa sa prithivim | prithivi
    mupopa prithivi upasi dadasida dupopa sidat | asi dadasya asya asida dasida dasyai | asyai brahmahatyayai
    brahmahatyaya asya asyai brahmahatyayai brahmahatyayai tritiya brahmahatyayai tritiyam | brahmahatyaya
    iti brahma mprati prati tritiya prati grihana grihana prati prati grihana | grihane titi grihana grihane
    ti | iti sa setiti sa | dvrinai vrinai khatat | tparabhavishyanti parabhavishyanti khata parabhavishyanti
    manye manye parabhavishyanti parabhavishyanti manye | parabhavishyantiti para manye tata stato manye
    manye tatah | tato ma ma tata stato ma | ma para para ma ma para iti pura puretiti pura | pura te
    te pura pura te va~thsara dapyapi sam droha dapyapi rohat | ityabravi dabravi diti tyabravit | ttasma
    dabravi dabravi tpura pura tasma tprithivyai prithivyai sam mprithivyai prithivyai khatam | api rohati
    roha tyapyapi rohati | va~revritagm rohati rohati varevritam | varevritagm hi hi varevritam hyasya
    asyai hi hyasyai | ntritiya masya asyai tritiyam | brahmahatyayai tritiya brahmahatyayai prati prati
    brahmahatyayai brahmahatyayai prati | brahmahatyaya iti brahma pratyagrihna dagrihna tprati pratyagrihnat
    | ttadagrihna dagrihna thsvakritagg svakrita svakrita mirina mirinagg svakritagg svakrita mirinam
    | irina mabhava dabhava dirina mirina mabhavat | tasma dahitagni rahitagni stasma ttasma dahitagnih
    | shshraddhadeva ahitagni rahitagni ahitagnirityahita ssvakrite svakrite shraddhadeva shraddhadeva
    iti shraddha svakrita irina irine svakrite svakrita irine | irine na ne rina irine na | thsye davava
    syet | brahmahatyayai hi hi brahmahatyayai brahmahatyayai hi | brahmahatyaya iti brahma hyesha esha
    hi hyeshah | esha varno varna esha esha varnah | nthsa sa vanaspatin | vanaspati nupopa vanaspatin
    upasi dadasida dupopa sidat | asida dasya asya asida dasida dasyai | asyai brahmahatyayai brahmahatyaya
    asya asyai brahmahatyayai brahmahatyayai tritiya brahmahatyayai tritiyam | brahmahatyaya iti brahma
    mprati prati tritiya prati grihnita grihnita prati prati grihnita | grihnite titi grihnita grihnite
    ti | iti te ta ititi te | vri~namahai vrinamahai varam dvrinamahai vrinamahai vriknat | tparabhavishyantah
    parabhavishyanto vrikna tparabhavishyantah | || parabhavishyanto manyamahe manyamahe parabhavishyantah
    parabhavishyanto manyamahe | parabhavishyanta iti para manyamahe tata stato manyamahe manyamahe tatah
    | tato ma ma tata stato ma | ma para para ma ma para para bhuma bhuma para para bhuma | bhume titi
    bhuma bhume ti | ityavrashcana davrashcana diti tyavrashcanat | dvo va avrashcana davrashcana vo bhuyagmso
    bhuyagmso vo vo bhuyagmsah | dbhuyagmso bhuyagmsa ut | tishtha nititi tishtha ityabravi dabravi diti
    tyabravit | ttasma dabravi dabravi tasma davrashcana davrashcana ttasma davrashcanat | vri~kshana
    mavrashcana davrashcana mbhuyagmso bhuyagmso vrikshanam dbhuyagmso bhuyagmsa ut | ttishthanti tishtha
    ntyudu tishthanti varevritam ntishthanti tishthanti varevritam | varevritagm hi hi varevritam hyesha
    meshagm hi hyesham | brahmahatyayai tritiya brahmahatyayai prati prati brahmahatyayai brahmahatyayai
    prati | brahmahatyaya iti brahma nprati pratyagrihnann | sa niryaso niryasa nniryaso niryaso 'bhavat
    | nniryasasya niryasasya tasma niryasasya na na niryasasya niryasasya na | niryasasyeti nih brahmahatyaya
    ashya mashya brahmahatyayai hi hi brahmahatyayai brahmahatyayai hi | brahmahatyaya iti brahma hyesha
    esha hi hyeshah | esha varno varna esha esha varnah | varno 'tho atho varno varno 'tho atho khalu
    khalvatho atho khalu | khalu yo yah khalu khalu yah | eva lohito lohita evaiva lohitah | lohito yo
    yo lohito lohito yah | va ''vrashcana davrashcana dva va ''vrashcanat | nniryeshati niryesha tyavrashcana
    davrashcana niryeshati tasya tasya niryeshati niryeshati tasya | tasya na na tasya tasya na | nkama
    mashya mashya kama manyasya nyasya kama 'nyasya nyasya sah | sa strishagmsadagg strishagmsadagm sa
    sa strishagmsadam | strishagmsada mupopa strishagmsadagg strishagmsada mupa | strishagmsadamiti stri
    upasida dasida dupopasidat | asida dasya asya asida dasida dasyai | asyai brahmahatyayai brahmahatyaya
    asya asyai brahmahatyayai brahmahatyayai tritiya brahmahatyayai tritiyam | brahmahatyaya iti brahma
    mprati prati tritiya prati grihnita grihnita prati prati grihnita | grihnite titi grihnita grihnite
    ti | iti ta sta ititi tah | nta sta abruvann | vri~namahai vrinamahai varam vrinamaha ritviya dritviya
    dvrinamahai vrinamaha ritviyat | mpraja mritviya dritviya vi~ndamahai vindamahai praja vi~ndamahai
    vindamahai kama rvijanitora vijanitoh | mbhavama bhavama sagm sa bhavame titi bhavama bhavame ti |
    ttasma dititi tasma tasma dritviya dritviya ttasma dritviyat | sstriya ritviya dritviya sstriyah prajam
    | vi~ndante vindante praja vi~ndante vindante kama rvijanitora vijanitoh | mbhavanti bhavanti sagm
    sa bhavanti varevritam mbhavanti bhavanti varevritam | varevritagm hi hi varevritam hyasa masagm hi
    hyasam | brahmahatyayai tritiya brahmahatyayai prati prati brahmahatyayai brahmahatyayai prati | brahmahatyaya
    iti brahma nprati pratyagrihnann | sa malavadvasa malavadvasa ssa sa malavadvasah | nmalavadvasa malavadvasa
    abhavat | malavadvasa iti malavat nmalavadvasasa malavadvasasa tasma malavadvasasa na na malavadvasasa
    malavadvasasa na | malavadvasaseti malavat va~deta vadeta sagm sam vadeta na na vadeta vadeta na |
    || sahasi tasita saha sahasita | asita na nasi tasita na | nasya asya na nasyah asya anna manna masya
    asya anna anna madya dadya danna manna madyat | brahmahatyaya adya dadya brahmahatyayai hi hi brahmahatyayai
    brahmahatyayai hi | brahmahatyaya iti brahma hyeshaisha hi hyesha | mpratimucya pratimucya varnam
    pratimucyasta aste pratimucya pratimucyaste pratimucyeti prati aste 'tho atho asta aste 'tho atho
    khalu khalvatho atho khalu | khalvahu rahuh khalu khalvahuh | ahu rabhyanjana mabhyanjana mahu rahu
    rabhyanjanam | va~va vava bhyanjana mabhyanjanam sstriya vava vava striyah | striya anna mannagg striya
    anna mabhyanjana mabhyanjana manna manna mabhyanjanam | abhyanjana mevaiva bhyanjana mabhyanjana meva
    | mpratigrihyanna na pratigrihya pratigrihyamiti prati anya diti tyanya danya diti | malavadvasasagm
    sambhavanti sambhavanti malavadvasasa mmalavadvasasagm sambhavanti | malavadvasasamiti malavat ssambhavanti
    sambhavanti yah | ya stata stato yo ya statah | tato jayate jayate tatastato jayate | jayate sa sa
    jayate jayate sah | so 'bhishasto 'bhishasta ya~ mabhishasto 'bhishasto yam | ya maranye 'ranye yam
    aranye tasyai tasya aranye 'ranye tasyai sstena stasyai tasyai ntasyai tasyai paraci hritamukhi hritamukhi
    tasyai tasyai hritamu khyapagalbho 'pagalbho hritamukhi hritamu khyapagalbhah | hritamukhiti hrita
    apagalbho ya ya 'pagalbho 'pagalbho ya | ya snati snati ya ya snati | snati tasya stasya ssnati snati
    tasyah tasya aphsvaphsu tasya stasya aphsu | aphsu maruko maruko 'phsvaphsu marukah | maruko ya ya
    maruko maruko ya | 'bhyankte ya ya 'bhyankte | || abhyankte tasyai tasya abhyankte tasyai dushcarma
    dushcarma tasyai tasyai dushcarma dushcarma ya ya dushcarma dushcarma ya | pralikhate ya ya pralikhate
    pralikhate tasyai tasyai tasyai khalatih khalati stasyai tasyai khalatih | khalati rapamaryapamari
    khalatih khalati rapamari | apamari ya ya 'pama ryapamari ya | ya ''nkta ankte ya ya ''nkte | ankte
    tasyai tasya ankta ankte tasyai tasyai kanah kana stasyai tasyai kanah | kano ya ya kanah kano ya
    | ya dato dato ya ya datah | dato dhavate dhavate dato dato dhavate | dhavate tasyai tasyai dhavate
    dhavate tasyai shyavadanniti shyava ya nakhani nakhani ya ya nakhani | nakhani nikrintate nikrintate
    nakhani nakhani nikrintate nikrintate tasyai tasyai nikrintate nikrintate tasyai tasyai kunakhi kunakhi
    tasyai tasyai kunakhi | kunakhi ya ya kunakhi kunakhi ya | ya krinatti krinatti ya ya krinatti | krinatti
    tasyai tasyai krinatti krinatti tasyai klibah kliba stasyai tasyai klibo ya ya klibah klibo ya | ya
    rajjugm rajjum rajjugm srijati srijati rajjugm rajjugm srijati | srijati tasya stasya ssrijati srijati
    tasyah tasya udbandhuka udbandhuka stasya stasya udbandhukah | udbandhuko ya yodbandhuka udbandhuko
    ya | udbandhuka ityut ya parnena parnena ya ya parnena | parnena pibati pibati parnena parnena pibati
    | pibati tasya stasyah pibati pibati tasyah tasya unmaduka unmaduka stasya stasya unmadukah | unmaduko
    ya yonmaduka unmaduko ya | unmaduka ityut ya kharvena kharvena ya ya kharvena | kharvena pibati pibati
    kharvena kharvena pibati | pibati tasyai tasyai pibati pibati tasyai tasyai kharvah kharva stasyai
    tasyai kharvah | kharva stisra stisrah kharvah kharva stisrah | tisro ratri ratri stisra stisro ratrih
    vra~tagm ratri ratri 'njalina carec care danjalina anjalina va va 'njalina pibe dakharvena kharvena
    pibe akharvena va va 'kharvena kharvena va | va patrena patrena va va patrena | prajayai patrena patrena
    prajayai prajayai gopithaya gopithaya prajayai prajayai gopithaya | gopithayeti gopithaya | || tvashta
    hataputro hataputra stvashta tvashta hataputrah | hataputro vindram vi~ndragm hataputro hataputro
    vindra vindragm somagm somam soma ma somagm soma ma | a 'hara daharada 'harat | ttasmigg stasmi nnindra
    indra stasmigg stasmi indra upahava mupahava mindra indra upahavam | ccha taicchato pahava mupahava
    mai mputra mahvayata hvayata putram | avadhi riti tyavadhi ravadhi riti | iti sa sa ititi sah | ya~jnaveshasagm
    sa sa yajnaveshasam | nkritva kritva yajnaveshasam yajnaveshasamiti yajna prasaha kritva kritva prasaha
    prasaha somagm soma thsomagm soma mapibat | ttasya tasyapiba dapiba yadatyashishyata tyashishyata
    ya ttadatyashishyata tyashishyata tat | atyashishyatetyati ttvashta tvashta ta tvashta ''havaniya
    mahavaniya ntvashta tvashta ''havaniya ahavaniya mupopa havaniya mahavaniya mupa | upa pra propopa
    pra | tpra pravartayat | thsvaha svaha 'vartaya davartaya svahendrashatru rindrashatru ssvaha svahendrashatruh
    | rvardhasva vardhasve ndrashatru rindrashatru indrashatruritindra vardhasve titi vardhasva vardhasve
    ti | ttadavartaya davartaya dvritrasya vritrasya ta vritrasya vritratvam vri~trasya vritrasya vritratvam
    | vritratvamiti vritra thsvaha svaha 'bravi dabravi svahendrashatru rindrashatru ssvaha svahendrashatruh
    | rvardhasva vardhasve ndrashatru rindrashatru indrashatruritindra vardhasve titi vardhasva vardhasve
    ti | ttasma dititi tasma tasma dasyasya tasma asye ndra indro 'syasye ndrah | || shshatru rindra indra
    shatru rabhava dabhavac chatru nthsa sa sambhavann | nnagnishoma vagnishomau sambhavan bhyagnishoma
    vagnishoma vabhi | agnishomavityagni abhi sagm sa mabhyabhi sam | sa ishumatramishumatra mishumatramishumatragm
    sa sa ishumatramishumatram | ishumatramishumatram vi~shvam mishumatramishumatra mishumatramishumatram
    ishumatramishumatramitishumatram vishvam mavardhata vardhata vishvam avardhata sa so 'vardhata vardhata
    sah | iman ~lokan ~loka nima niman ~lokan | loka navrino davrino llokan ~loka navrinot | iman ~lokan
    ~loka nima niman ~lokan | loka navrino davrino llokan ~loka navrinot | dvritrasya vritrasya ta vritrasya
    vritratvam vri~trasya vritrasya vritratvam | vritratvamiti vritra tasma dindra indra stasma ttasma
    dindrah | indro 'bibhe dabibhe dindra indro 'bibhet | thsa so 'bibhe dabibhe mprajapatigm sa sa prajapatim
    | prajapati mupopa prajapati mprajapati mupa | prajapatimiti praja upa dhava dadhava dupopa dhavat
    | shshatru radhava dadhavac chatruh | me 'janyajani me me 'jani | ajaniti tyaja nyajaniti | iti tasmai
    tasma ititi tasmai ntasmai tasmai vajra vajragm siktva siktva vajram va~jragm siktva | siktva pra
    pra siktva siktva pra | ayaccha dete naitena yaccha dayaccha detena | etena jahi jahyete naitena jahi
    | jahititi jahi jahiti | iti tena tene titi tena | tenabhyabhi tena tenabhi | ayata tau ta vayatayata
    tau | ta vabruta mabruta ntau ta vabrutam | abruta magnishoma vagnishoma vabruta mabruta magnishomau
    agnishomau ma ma 'gnishoma vagnishomau ma | agnishomavityagni ma pra pra ma ma pra | || ha rava mavagm
    har ava manta ranta rava mava mantah | ssvah svo 'nta ranta iti mama mame titi mama | mama vai vai
    mama mama vai | ityabravi dabravi diti tyabravit | mma mabravi dabravi ita mititita mita miti | iti
    tau ta vititi tau | bhagadheya maiccheta maiccheta mbhagadheya maicchetam | ntabhya maiccheta maiccheta
    eta magnishomiya magnishomiya meta meta magnishomiya agnishomiya mekadashakapala mekadashakapala magnishomiya
    magnishomiya mekadashakapalam | agnishomiyamityagni mpurnamase purnamasa ekadashakapala mekadashakapala
    ekadashakapalamityekadasha purnamase pra pra purnamase purnamase pra | purnamasa iti purna ttau ta
    vayaccha dayaccha ta vabruta mabruta ntau ta vabrutam | bhyabruta mabruta mabhi | abhi sandashtau
    sandashta vabhyabhi sandashtau | sandashtau vai vai sandashtau sandashtau vai | vai svah svo vai vai
    svah | svo na na svah svo na | shshaknuvo na na shaknuvah | shaknuva aitu maitugm shaknuva aitu mitityaitu
    maitu miti | iti sa sa ititi sah | indra atmana atmana indra indra atmanah | atmanah shitarurau shitarura
    vatmana atmanah shitarurau | shitarura vajanaya dajanayac chitarurau shitarura vajanayat | rjanma
    janma shitarurayo shitarurayoriti shita janma yo yo janma janma yah | shshitarurayo reva mevagm shitarurayoh
    rjanma janma shitarurayo shitarurayoriti shita janma veda veda janma janma veda | veda na na veda
    veda na | || enagm shitarurau shitarura vena menagm shitarurau | shshitarurau shitarurau hatah | ntabhyagm
    hato hata stabhya j janjabhyamanaj janjabhyamana j janjabhyamanat | janjabhyamana dagnishoma vagnishomau
    janjabhyamanaj janjabhyamana dagnishomau rni ragnishoma vagnishomau nih | agnishomavityagni nirakramata
    makramata mpranapanau pranapana vakramata makramata pranapanau vai vai pranapanau pranapanau vai |
    pranapanaviti prana mpranah prano 'jahita majahita prano vai vai pranah prano vai | vai daksho daksho
    vai vai dakshah | daksho 'pano 'pano daksho daksho 'panah | apanah kratuh kratu rapano 'panah kratuh
    | tkratuh kratu stasma j janjabhyamano janjabhyamana stasma janjabhyamano bruya dbruyaj janjabhyamano
    janjabhyamano bruyat | mayi dakshakratu dakshakratu mayi mayi dakshakratu | dakshakratu ititi dakshakratu
    dakshakratu iti | dakshakratu iti daksha iti pranapanau pranapana vititi pranapanau | pranapana vevaiva
    pranapanau pranapana veva | pranapanaviti prana dhatte sarvagm sarva ssarvagm sarva mayuh | ayu retyetyayu
    rayureti | ddevata devata vritrat | nnirhuya nirhuya vritra nirhuya vartraghnam nnirhuya nirhuya vartraghnam
    | vartraghnagm havir va~rtraghnagm havih | vartraghnamiti vartra havih purnamase purnamase havir rnish
    purnamase purnamase nih | purnamasa iti purna dghnanti ghnantyavapa davapa ghnanti vai vai ghnanti
    ghnanti vai | mpurnamase purnamasa ena mena purnamasa a purnamase purnamasa a | purnamasa iti purna
    a 'mavasyaya mamavasyaya ma 'mavasyayam | || ntyamavasyaya mamavasyaya amavasyayamityama pyayayanti
    tasma tpyayayanti pyayayanti tasma dvartraghni vartraghni tasma vartraghni purnamase purnamase vartraghni
    vartraghni purnamase | vartraghni iti vartra purnamase 'nvanu purnamase purnamase 'nu | purnamasa
    iti purna cyete ucyete anvanu ucyete vridhanvati vridhanvati ucyete ucyete vridhanvati | ucyete ityucyete
    | vridhanvati amavasyaya mamavasyayam vri~dhanvati vridhanvati amavasyayam | vridhanvati iti vridhann
    ttadamavasyaya mamavasyaya amavasyayamityama thsaggsthapya saggsthapya ta saggsthapya vartraghnam
    va~rtraghnagm saggsthapya saggsthapya vartraghnam | saggsthapyeti sam vartraghnagm havir va~rtraghnagm
    havih | vartraghnamiti vartra vajra madaya daya vajram adaya punah puna radaya daya punah | puna rabhyabhi
    punah puna rabhi | ayata te te ayata yata te | te abruta mabruta nte te abrutam | ndyavaprithivi dyavaprithivi
    abruta mabruta dyavaprithivi ma ma dyavaprithivi dyavaprithivi ma | dyavaprithivi iti dyava ma pra
    pra ma ma pra | ha ravayo ravayor rvai va avayo ravayo shshrito vai vai shritah | shrita ititi shrita
    iti te te ititi te | te abruta mabruta nte te abrutam | va~ra mabruta mabrutam vri~navahai vrinavahai
    varam vrinavahai nakshatravihita nakshatravihita vrinavahai vrinavahai nakshatravihita | nakshatravihita
    'ha maha nnakshatravihita nakshatravihita 'ham | nakshatravihiteti nakshatra asaniti tyasa nyasaniti
    | ityasa vasa vitityasau | asa vabravi dabravi dasa vasa vabravit | abravic citravihita citravihita
    'bravi dabravic citravihita | citravihita 'ha maha ncitravihita citravihita 'ham | citravihiteti citra
    aha mitityaha maha miti | itiya miya mititiyam | nnakshatravihita nakshatravihita tasma nakshatravihita
    'sa vasau nakshatravihita nakshatravihita 'sau | nakshatravihiteti nakshatra asau citravihita citravihita
