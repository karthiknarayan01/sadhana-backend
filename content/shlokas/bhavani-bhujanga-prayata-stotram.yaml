id: bhavani-bhujanga-prayata-stotram
category: stotram
name:
  english: Bhavani Bhujanga Prayata Stotram
content:
  english: shadadharapankeruhantarviraja tsushumnantarale'titejollasantim | sudhamandalam dravayantim
    pibantim sudhamurtimide cidanandarupam || || jvalatkotibalarkabhasarunangim sulavanyashringarashobhabhiramam
    | mahapadmakinjalkamadhye viraja ttrikone nishannam bhaje shribhavanim || || kvanatkinkininupurodbhasiratna
    prabhalidhalakshardrapadabjayugmam | ajeshacyutadyaih suraih sevyamanam mahadevi manmurdhni te bhavayami
    || || sushonambarabaddhaniviviraja nmaharatnakancikalapam nitambam | sphuraddakshinavartanabhim ca
    tisro valiramba te romarajim bhaje'ham || || lasadvrittamuttungamanikyakumbho pamashri stanadvandvamambambujakshi
    | bhaje dugdhapurnabhiramam tavedam mahaharadiptam sada prasnutasyam || || shirishaprasunollasadbahudandai
    rjvaladbanakodandapashankushaishca | calatkankanodarakeyurabhusho jjvaladbhirlasantim bhaje shribhavanim
    || || sharatpurnacandraprabhapurnabimba dharasmeravaktraravindam sushantam | suratnavaliharatatankashobham
    mahasuprasannam bhaje shribhavanim || || sunasaputam sundarabhrulalatam tavaushthashriyam danadaksham
    kataksham | lalate lasadgandhakasturibhusham sphuracchrimukhambhojamide'hamamba || || calatkuntalantarbhramadbhringabrindam
    ghanasnigdhadhammillabhushojjvalam te | sphuranmaulimanikyabaddhendurekha vilasollasaddivyamurdhanamide
    || || iti shribhavani svarupam tavedam prapancatparam catisukshmam prasannam | sphuratvamba dimbhasya
    me hritsaroje sada vanmayam sarvatejomayam ca || || ganeshabhimukhyakhilaih shaktibrindai rvritam
    vai sphuraccakrarajollasantim | param rajarajeshvari traipuri tvam shivankoparistham shivam bhavayami
    || || tvamarkastvamindustvamagnistvamapa stvamakashabhuvayavastvam mahattvam | tvadanyo na kashcit
    prapanco'sti sarvam sadanandasamvitsvarupam bhaje'ham || || shrutinamagamye suvedagamajna mahimno
    na jananti param tavamba | stutim kartumicchami te tvam bhavani kshamasvedamatra pramugdhah kilaham
    || || gurustvam shivastvam ca shaktistvameva tvamevasi mata pita ca tvameva | tvamevasi vidya tvamevasi
    bandhu rgatirme matirdevi sarvam tvameva || || sharanye varenye sukarunyamurte hiranyodaradyairaganye
    supunye | bhavaranyabhiteshca mam pahi bhadre namaste namaste namaste bhavani || || itimam mahacchribhavanibhujangam
    stutim yah pathedbhaktiyuktashca tasmai | svakiyam padam shashvatam vedasaram shriyam cashtasiddhim
    bhavani dadati || || bhavani bhavani bhavani trivaram udaram muda sarvada ye japanti | na shokam na
    moham na papam na bhitih kadacitkathancitkutashcijjananam || || || iti shrimacchankaracaryaviracita
    bhavani bhujangam sampurnam ||
  devanagari: षडाधारपङ्केरुहान्तर्विराज त्सुषुम्नान्तरालेऽतितेजोल्लसन्तीम् । सुधामण्डलं द्रावयन्तीं पिबन्तीं
    सुधामूर्तिमीडे चिदानन्दरूपाम् ॥ ॥ ज्वलत्कोटिबालार्कभासारुणाङ्गीं सुलावण्यशृङ्गारशोभाभिरामाम् । महापद्मकिञ्जल्कमध्ये
    विराज त्त्रिकोणे निषण्णां भजे श्रीभवानीम् ॥ ॥ क्वणत्किङ्किणीनूपुरोद्भासिरत्न प्रभालीढलाक्षार्द्रपादाब्जयुग्मम्
    । अजेशाच्युताद्यैः सुरैः सेव्यमानं महादेवि मन्मूर्ध्नि ते भावयामि ॥ ॥ सुशोणाम्बराबद्धनीवीविराज न्महारत्नकाञ्चीकलापं
    नितम्बम् । स्फुरद्दक्षिणावर्तनाभिं च तिस्रो वलीरम्ब ते रोमराजिं भजेऽहम् ॥ ॥ लसद्वृत्तमुत्तुङ्गमाणिक्यकुम्भो
    पमश्रि स्तनद्वन्द्वमम्बाम्बुजाक्षि । भजे दुग्धपूर्णाभिरामं तवेदं महाहारदीप्तं सदा प्रस्नुतास्यम् ॥
    ॥ शिरीषप्रसूनोल्लसद्बाहुदण्डै र्ज्वलद्बाणकोदण्डपाशाङ्कुशैश्च । चलत्कङ्कणोदारकेयूरभूषो ज्ज्वलद्भिर्लसन्तीं
    भजे श्रीभवानीम् ॥ ॥ शरत्पूर्णचन्द्रप्रभापूर्णबिम्बा धरस्मेरवक्त्रारविन्दां सुशान्ताम् । सुरत्नावलीहारताटङ्कशोभां
    महासुप्रसन्नां भजे श्रीभवानीम् ॥ ॥ सुनासापुटं सुन्दरभ्रूललाटं तवौष्ठश्रियं दानदक्षं कटाक्षम् । ललाटे
    लसद्गन्धकस्तूरिभूषं स्फुरच्छ्रीमुखाम्भोजमीडेऽहमम्ब ॥ ॥ चलत्कुन्तलान्तर्भ्रमद्भृङ्गबृन्दं घनस्निग्धधम्मिल्लभूषोज्ज्वलं
    ते । स्फुरन्मौलिमाणिक्यबद्धेन्दुरेखा विलासोल्लसद्दिव्यमूर्धानमीडे ॥ ॥ इति श्रीभवानि स्वरूपं तवेदं
    प्रपञ्चात्परं चातिसूक्ष्मं प्रसन्नम् । स्फुरत्वम्ब डिम्भस्य मे हृत्सरोजे सदा वाङ्मयं सर्वतेजोमयं च
    ॥ ॥ गणेशाभिमुख्याखिलैः शक्तिबृन्दै र्वृतां वै स्फुरच्चक्रराजोल्लसन्तीम् । परां राजराजेश्वरि त्रैपुरि
    त्वां शिवाङ्कोपरिस्थां शिवां भावयामि ॥ ॥ त्वमर्कस्त्वमिन्दुस्त्वमग्निस्त्वमाप स्त्वमाकाशभूवायवस्त्वं
    महत्त्वम् । त्वदन्यो न कश्चित् प्रपञ्चोऽस्ति सर्वं सदानन्दसंवित्स्वरूपं भजेऽहम् ॥ ॥ श्रुतीनामगम्ये
    सुवेदागमज्ञा महिम्नो न जानन्ति पारं तवाम्ब । स्तुतिं कर्तुमिच्छामि ते त्वं भवानि क्षमस्वेदमत्र प्रमुग्धः
    किलाहम् ॥ ॥ गुरुस्त्वं शिवस्त्वं च शक्तिस्त्वमेव त्वमेवासि माता पिता च त्वमेव । त्वमेवासि विद्या त्वमेवासि
    बन्धु र्गतिर्मे मतिर्देवि सर्वं त्वमेव ॥ ॥ शरण्ये वरेण्ये सुकारुण्यमूर्ते हिरण्योदराद्यैरगण्ये सुपुण्ये
    । भवारण्यभीतेश्च मां पाहि भद्रे नमस्ते नमस्ते नमस्ते भवानि ॥ ॥ इतीमां महच्छ्रीभवानीभुजङ्गं स्तुतिं
    यः पठेद्भक्तियुक्तश्च तस्मै । स्वकीयं पदं शाश्वतं वेदसारं श्रियं चाष्टसिद्धिं भवानी ददाति ॥ ॥ भवानी
    भवानी भवानी त्रिवारं उदारं मुदा सर्वदा ये जपन्ति । न शोकं न मोहं न पापं न भीतिः कदाचित्कथञ्चित्कुतश्चिज्जनानाम्
    ॥ ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता भवानी भुजङ्गं सम्पूर्णम् ॥
