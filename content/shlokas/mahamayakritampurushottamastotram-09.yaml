id: mahamayakritampurushottamastotram-09
category: stotram
name:
  english: mahamayakritampurushottamastotram 09
  devanagari: महामायाकृतंपुरुषोत्तमस्तोत्रम् ०९
content:
  english: namaste'ksharavasaya parameshaya te namah || 10|| avatarasvarupaya'vatarine ca te namah | maya'ham
    bhavatah shaktirmayalokashca te prabho || 11|| ishvaranamalayashca tavaiva bhumikastvimah | tattvani
    ca samastani tavaiva karyakani vai || 12|| puranapurushastvam vai sarvakaranakaranam | shribhulilaramanatha
    manikimuktikapate || 13|| prajnapadmavatikanta namaste sukhadapate | lakshmipadmapate tubhyam namo
    narayanaya vai || 14|| sarveshvarasvarupaya sarvadevatmane namah | anantamurtaye krishnanarayana hare
    namah || 15|| te'cyutaya ca kantaya parameshaya te namah | sarvajnaya samastaya gopalatmaja te namah
    || 16|| sarvasrishtyatmane tubhyam namaste paramatmane | brahmane jyotishe tubhyam namaste shucivarcase
    || 17|| prasavitre namah pitre sargasthityantahetave | narayanaya ca namah sarvatmantaravartine ||
    18|| anantadivyagunavan
  devanagari: नमस्तेऽक्षरवासाय परमेशाय ते नमः ॥ १०॥ अवतारस्वरूपायाऽवतारिणे च ते नमः । मायाऽहं भवतः शक्तिर्मायालोकाश्च
    ते प्रभो ॥ ११॥ ईश्वराणामालयाश्च तवैव भूमिकास्त्विमाः । तत्त्वानि च समस्तानि तवैव कार्यकाणि वै ॥ १२॥
    पुराणपुरुषस्त्वं वै सर्वकारणकारणम् । श्रीभूलीलारमानाथ माणिकीमुक्तिकापते ॥ १३॥ प्रज्ञापद्मावतीकान्त
    नमस्ते सुखदापते । लक्ष्मीपद्मापते तुभ्यं नमो नारायणाय वै ॥ १४॥ सर्वेश्वरस्वरूपाय सर्वदेवात्मने नमः
    । अनन्तमूर्तये कृष्णनारायण हरे नमः ॥ १५॥ तेऽच्युताय च कान्ताय परमेशाय ते नमः । सर्वज्ञाय समस्ताय गोपालात्मज
    ते नमः ॥ १६॥ सर्वसृष्ट्यात्मने तुभ्यं नमस्ते परमात्मने । ब्रह्मणे ज्योतिषे तुभ्यं नमस्ते शुचिवर्चसे
    ॥ १७॥ प्रसवित्रे नमः पित्रे सर्गस्थित्यन्तहेतवे । नारायणाय च नमः सर्वात्मान्तरवर्तिने ॥ १८॥ अनन्तदिव्यगुणवन्
