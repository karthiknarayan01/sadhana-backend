id: bhagvadnev
category: upanishad
name:
  english: bhagvadnev
  devanagari: भग्वद्नेव्
content:
  english: 78|| om tatsaditi shrimadbhagavadgitasupanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade
    mokshasamnyasayogo nama ashtadasho'dhyayah || 18|| om shantakaram bhujagashayanam padmanabham suresham
    | vishvadharam gaganasadrisham meghavarnam shubhangam | lakshmikantam kamalanayanam yogibhirdhyanagamyam
    | vande vishnum bhavabhayaharam sarvalokaikanatham ||
  devanagari: ७८॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासूपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे
    मोक्षसंन्यासयोगो नाम अष्टादशोऽध्यायः ॥ १८॥ ॐ शान्ताकारं भुजगशयनं पद्मनाभं सुरेशम् । विश्वाधारं गगनसदृशं
    मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यम् । वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्
    ॥
meaning: {}
