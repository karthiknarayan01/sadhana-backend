id: avalokiteshvarashtakastotram
category: stotram
name:
  english: avalokiteshvarashtakastotram
  devanagari: अवलोकितेश्वराष्टकस्तोत्रम्
content:
  english: avalokiteshvarashtakastotram om namo'valokiteshvaraya | stutva gunairanupamairanubindupatram
    stotram maya kritamidam jadavalishena | lokeshvaram gunanidhim gunasagaram ca nityam namami shirasanjalisamputena
    || 1|| praneshu yan sravati yena rasambuparan kshuttrishnaduhkhaparipiditasarvasattvan | evamvidham
    jagadidam paripalanaya tasmai namo'stu satatam hi yatharthanamne || 2|| satkunkumattamarunankasamanavarnam
    dvatrimshalakshanavibhushitagatrashobham | sarveshu yasya karunamayavatsalatvam tasmai namami bhavate
    karunamayaya || 3|| samsarasagaramahalayanashadaksha ekastvameva sharanam bhuvi naikanatha | kenapi
    tvadgunagana ganane na shakyastam lokanathamavalokitanamasamjnam || 4|| nanavidhabharanamanditadivyarupam
    balendulagnajatabhushitalokanatham | vame ca mandaladharam varadam ca savye tvam lokanatha sharanam
    pravrajami nityam || 5|| brahmadibhih parivritam surasiddhasanghairgandharvakinnaramahoraganagayakshaih
    | nathasya yasya bhavatashcaranambujam ca tam lokanathacaranam sharanam vrajami || 6|| bhutaih pishacagarudoragarakshasibhih
    kumbhandaputanamahallakarajarajaih | vaishvanarasurashataih parivarabhutam tam lokanathacaranam sharanam
    gato'smi || 7|| abdhirdivakarakarairnahi shoshameti tadvatkavishvarashatairgunasagaraste | lokeshvara
    prathitakirtinidhanabhuto na kshiyate gunanidhirgunasagarasya || 8|| shlokashtakam pratidinam khalu
    ye pathanti te prapnuvanti sahasa dhanaputramokshan | kushthadiroganikaram kshamatam prayati vandamahe
    ca nitaram tava padayugme || 9|| iti shri aryavalokiteshvarasya shlokashtakam sampurnam ||
  devanagari: अवलोकितेश्वराष्टकस्तोत्रम् ॐ नमोऽवलोकितेश्वराय । स्तुत्वा गुणैरनुपमैरनुबिन्दुपात्रं स्तोत्रं
    मया कृतमिदं जडवालिशेन । लोकेश्वरं गुणनिधिं गुणसागरं च नित्यं नमामि शिरसाञ्जलिसम्पुटेन ॥ १॥ प्राणेषु
    यन् स्रवति येन रसाम्बुपारान् क्षुत्तृष्णदुःखपरिपीडितसर्वसत्त्वान् । एवंविधं जगदिदं परिपालनाय तस्मै
    नमोऽस्तु सततं हि यथार्थनाम्ने ॥ २॥ सत्कुङ्कुमात्तमरुणाङ्कसमानवर्णं द्वात्रिंशलक्षणविभूषितगात्रशोभम्
    । सर्वेषु यस्य करुणामयवत्सलत्वं तस्मै नमामि भवते करुणामयाय ॥ ३॥ संसारसागरमहालयनाशदक्ष एकस्त्वमेव शरणं
    भुवि नैकनाथ । केनापि त्वद्गुणगणा गणने न शक्यास्तं लोकनाथमवलोकितनामसंज्ञम् ॥ ४॥ नानाविधाभरणमण्डितदिव्यरूपं
    बालेन्दुलग्नजटभूषितलोकनाथम् । वामे च मण्डलधरं वरदं च सव्ये त्वां लोकनाथ शरणं प्रव्रजामि नित्यम् ॥
    ५॥ ब्रह्मादिभिः परिवृतं सुरसिद्धसङ्घैर्गन्धर्वकिन्नरमहोरगनागयक्षैः । नाथस्य यस्य भवतश्चरणाम्बुजं च
    तं लोकनाथचरणं शरणं व्रजामि ॥ ६॥ भूतैः पिशाचगरुडोरगराक्षसीभिः कुम्भाण्डपूतनमहल्लकराजराजैः । वैश्वानरासुरशतैः
    परिवारभूतं तं लोकनाथचरणं शरणं गतोऽस्मि ॥ ७॥ अब्धिर्दिवाकरकरैर्नहि शोषमेति तद्वत्कवीश्वरशतैर्गुणसागरस्ते
    । लोकेश्वर प्रथितकीर्तिनिधानभूतो न क्षीयते गुणनिधिर्गुणसागरस्य ॥ ८॥ श्लोकाष्टकं प्रतिदिनं खलु ये पठन्ति
    ते प्राप्नुवन्ति सहसा धनपुत्रमोक्षान् । कुष्ठादिरोगनिकरं क्षमतां प्रयाति वन्दामहे च नितरां तव पादयुग्मे
    ॥ ९॥ इति श्री आर्यावलोकितेश्वरस्य श्लोकाष्टकं सम्पूर्णम् ॥
