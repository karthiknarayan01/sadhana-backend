id: vande-mataram
category: stotram
name:
  english: Vande Mataram
  devanagari: वन्देमातरम् (ओट्टुरूउन्निनम्पूतिरिप्पादविरचितम्)
content:
  english: bangakshaunyam ramacandra dvijate- rdharmakshetre lilayaivavatirnam | satyajnananandavatsalyamurtim
    nityam vande mataram sharadakhyam || 1|| dehasavatya klishyamanaprapumsam suptam bodham samyagunmilayantim
    | shokam moham cashu nirmulayantim bhaktya vandemataram sharadakhyam || 2|| mayasindhau majjatah pranivargan
    premodarenatmapadaplavena | uddhritya dragasya param nayantim murdhna vandemataram sharadakhyam ||
    3|| tacchabdarthashcandiketi prasiddha- shchandovasacchadito rajatiti | pashyannarcad ramakrishno'pi
    yam tam dorbhyam vandemataram sharadakhyam || 4|| rambhadinam svarvadhunamadhisham radhadinam manushinamadhinam
    | artatranairkarpita svakhilartham bhuyo vande mataram sharadakhyam || 5|| iti shriotturuunninamputirippadaviracitam
    vandemataram stotram sampurnam |
  devanagari: बङ्गक्षौण्यां रामचन्द्र द्विजाते- र्धर्मक्षेत्रे लीलयैवावतीर्णाम् । सत्यज्ञानानन्दवात्सल्यमूर्तिं
    नित्यं वन्दे मातरं शारदाख्याम् ॥ १॥ देहासवत्या क्लिश्यमानप्रपुंसां सुप्तं बोधं सम्यगुन्मीलयन्तीम्
    । शोकं मोहं चाशु निर्मूलयन्तीं भक्त्या वन्देमातरं शारदाख्याम् ॥ २॥ मायासिन्धौ मज्जतः प्राणिवर्गान्
    प्रेमोदारेणात्मपादप्लवेन । उद्धृत्य द्रागस्य पारं नयन्तीं मूर्ध्ना वन्देमातरं शारदाख्याम् ॥ ३॥ तच्छब्दार्थश्चण्डिकेति
    प्रसिद्ध- श्छन्दोवासच्छादितो राजतीति । पश्यन्नार्चद् रामकृष्णोऽपि यां तां दोर्भ्यां वन्देमातरं शारदाख्याम्
    ॥ ४॥ रम्भादीनां स्वर्वधूनामधीशां राधादीनां मानुषीणामधीनाम् । आर्तत्राणैर्कार्पित स्वाखिलार्थां भूयो
    वन्दे मातरं शारदाख्याम् ॥ ५॥ इति श्रीओट्टुरूउन्निनम्पूतिरिप्पादविरचितं वन्देमातरम् स्तोत्रं सम्पूर्णम्
    ।
