id: parashustuti
category: stotram
name:
  english: parashustuti
  devanagari: परशुस्तुति
content:
  english: parashuramastuti shri ganeshaya namah | kulacala yasya mahim dvijebhyah prayacchatah somadrishattvamapuh
    | babhuvurutsargajalam samudrah sa rainukeyah shriyamatanitu || 1|| nashishyah kimabhudbhavah kipabhavannaputrini
    renuka nabhudvishvamakarmukam kimiti yah prinatu ramatrapa | vipranam pratimandiram maniganonmishrani
    dandahaternambdhino sa maya yamo'rpi mahishenambhamsi nodvahitah || 2|| payadvo yamadagnivamshatilako
    viravratalankrito ramo nama munishvaro nripavadhe bhasvatkutharayudhah | yenasheshahatahitangarudhiraih
    santarpitah purvaja bhaktya cashvamakhe samudravasana bhurhantakarikrita || 3|| dvare kalpatarum grihe
    suragavim cintamaninangade piyusham sarasishu vipravadane vidyashcatasro dasha | eva kartumayam tapasyati
    bhrigorvamshavatamso munih payadvo'khilarajakakshayakaro bhudevabhushamanih || 4|| || iti parashuramamastutih
    ||
  devanagari: परशुरामस्तुती श्री गणेशाय नमः । कुलाचला यस्य महीं द्विजेभ्यः प्रयच्छतः सोमदृषत्त्वमापुः
    । बभूवुरुत्सर्गजलं समुद्राः स रैणुकेयः श्रियमातनीतु ॥ १॥ नाशिष्यः किमभूद्भवः किपभवन्नापुत्रिणी रेणुका
    नाभूद्विश्वमकार्मुकं किमिति यः प्रीणातु रामत्रपा । विप्राणां प्रतिमन्दिरं मणिगणोन्मिश्राणि दण्डाहतेर्नांब्धीनो
    स मया यमोऽर्पि महिषेणाम्भांसि नोद्वाहितः ॥ २॥ पायाद्वो यमदग्निवंशतिलको वीरव्रतालङ्कृतो रामो नाम मुनीश्वरो
    नृपवधे भास्वत्कुठारायुधः । येनाशेषहताहिताङ्गरुधिरैः सन्तर्पिताः पूर्वजा भक्त्या चाश्वमखे समुद्रवसना
    भूर्हन्तकारीकृता ॥ ३॥ द्वारे कल्पतरुं गृहे सुरगवीं चिन्तामणीनङ्गदे पीयूषं सरसीषु विप्रवदने विद्याश्चतस्रो
    दश । एव कर्तुमयं तपस्यति भृगोर्वंशावतंसो मुनिः पायाद्वोऽखिलराजकक्षयकरो भूदेवभूषामणिः ॥ ४॥ ॥ इति परशुराममस्तुतिः
    ॥
