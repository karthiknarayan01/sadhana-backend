id: ramanujavarnanashlokah
category: stotram
name:
  english: ramanujavarnanashlokah
  devanagari: रामानुजवर्णनाश्लोकाः
content:
  english: shriramanujavarnanashlokah shrivenkatadhvarigurubhiranugrihitah || shrih || || shrimate ramanujaya
    namah || || shrimate venkatadhvarine namah || esha bhutapuri nirikshitacari doshapahantri maya shrimanatra
    gunabdhiravirabhavat ramanujaryo munih | trayyantamritasindhumanthanabhavaddhayyangavinatmakam vijnanam
    yadupajnameva vidushamadyapi vidyotate || 1|| kamadivairiganabhimanavadyanijanamabhilashagarima vaimanikaryasamabhuma
    matau vacanasimatilanghimahima | shrimananunakalasomanano vimaladhamavamanitaravih kshemani jrimbhayatu
    bhumavamutra sa ca ramanujo yatipatih || 2|| sa jayati ramanujayatih ajayati paravadinam yadiyoktih
    | sanjayati bodhamanagham ranjayati budhan vyatham ca bhanjayati || 3|| te mimamsashastra
  devanagari: श्रीरामानुजवर्णनाश्लोकाः श्रीवेङ्कटाध्वरिगुरुभिरनुगृहीताः ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय
    नमः ॥ ॥ श्रीमते वेङ्कटाध्वरिणे नमः ॥ एषा भूतपुरी निरीक्षितचरी दोषापहन्त्री मया श्रीमानत्र गुणाब्धिराविरभवत्
    रामानुजार्यो मुनिः । त्रय्यन्तामृतसिन्धुमन्थनभवद्धय्यङ्गवीनात्मकं विज्ञानं यदुपज्ञमेव विदुषामद्यापि
    विद्योतते ॥ १॥ कामादिवैरिगणभीमानवद्यनिजनामाभिलाषगरिमा वैमानिकार्यसमभूमा मतौ वचनसीमातिलङ्घिमहिमा ।
    श्रीमाननूनकलसोमाननो विमलधामावमानितरविः क्षेमाणि जृम्भयतु भूमावमुत्र स च रामानुजो यतिपतिः ॥ २॥ स जयति
    रामानुजयतिः अजयति परवादिनं यदीयोक्तिः । सञ्जयति बोधमनघं रञ्जयति बुधान् व्यथां च भञ्जयति ॥ ३॥ ते मीमांसाशास्त्र
