id: suryasahasranamastotra-2
category: sahasranama
name:
  english: suryasahasranamastotra
  devanagari: सूर्यसहस्रनामस्तोत्र
content:
  english: rinoti niyatendriyah || 140|| sa viro dharminam raja lakshmivanapi jayate | dhanavanjayate
    loke putravan rajavallabhah || 141|| ayurarogyavan nityam sa bhavet sampadam padam | ravau pathenmahadevi
    suryam sampujya kaulikah || 142|| suryodaye ravim dhyata labhet kaman yathepsitan | sankrantau yah
    pathed devi trikalam bhaktipurvakam || 143|| iha loke shriyam bhuktva sarvarogaih pramucyate | saptamyam
    shuklapakshe yah pathadastangate ravau || 144|| sarvarogyamayam deham dharayet kaulikottamah | vyatipate
    pathed devi madhyahne samyatendriyah || 145|| dhanam putran yasho manam labhet suryaprasadatah | cakrarcane
    pathed devi japan mulam ravim smaran || 146|| ravibhutva mahacinakramacaravicakshanah | sarvashatrun
    vijityashu labhellakshmim pratapavan || 147|| yah pathet paradeshastho vatukarcanatatparah | kantashrito
    vitabhayo bhavet sa shivasannibhah || 148|| shatavartam pathedyastu suryodayayugantare | savita sarvalokesho
    varadah sahasa bhavet || 149|| bahunatra kimuktena pathanadasya parvati | iha lakshmim sada bhuktva
    paratrapnoti tatpadam || 150|| ravau devi likhedbhurje mantranamasahasrakam | ashtagandhena divyena
    nilapushpaharidraya || 151|| pancamritaushadhibhishca nriyukpiyushabindubhih | vilikhya vidhivanmantri
    yantramadhye'rnaveshtitam || 152|| gutim vidhaya samveshtya mulamantramanusmaran | kanyakartitasutrena
    veshtayedraktalakshaya || 153|| suvarnena ca samveshtya pancagavyena shodhayet | sadhayenmantrarajena
    dharayenmurdhni va bhuje || 154|| kim kim na sadhayed devi yanmamapi sudurlabham | kushtharogi ca
    shuli ca pramehi kukshirogavan || 155|| bhagandharaturo'pyarshi ashmarivamshca kricchravan | mucyate
    sahasa dhritva gutimetam sudurlabham || 156|| vandhya ca kakavandhya ca mritavatsa ca kamini | dharayedgutikametam
    vakshasi smayatarpita || 157|| vandhya labhet sutam kantam kakavandhyapi parvati | mritavatsa bahun
    putran surupamshca cirayushah || 158 || rane gatva gutim dhritva shatrunjitva labhecchriyam | akshatango
    maharajah sukhi svapuramavishet || 159|| yo dharayed bhuje nityam rajalokavashankarim | gutikam mohanakarshastambhanoccatanakshamam
    || 150|| sa bhavet suryasankasho mahasa mahasam nidhih | dhanena dhanado devi vibhavena ca shankarah
    || 161|| shriyendro yashasa ramah paurushena ca bhargavah | gira brihaspatirdevi nayena bhrigunandanah
    || 162|| balena vayusankasho dayaya purushottamah | arogyena ghatodbhutih kantya purnendusannibhah
    || 163|| dharmena dharmarajashca ratnai ratnakaropamah | gambhiryena tathambhodhirdatritvena balih
    svayam || 164|| siddhya shribhairavah sakshadanandena cidishvarah | kim pralapena bahuna pathedva
    dharayecchive || 165|| sha
  devanagari: ृणोति नियतेन्द्रियः ॥ १४०॥ स वीरो धर्मिणां राजा लक्ष्मीवानपि जायते । धनवाञ्जायते लोके पुत्रवान्
    राजवल्लभः ॥ १४१॥ आयुरारोग्यवान् नित्यं स भवेत् सम्पदां पदम् । रवौ पठेन्महादेवि सूर्यं सम्पूज्य कौलिकः
    ॥ १४२॥ सूर्योदये रविं ध्याता लभेत् कामान् यथेप्सितान् । सङ्क्रान्तौ यः पठेद् देवि त्रिकालं भक्तिपूर्वकम्
    ॥ १४३॥ इह लोके श्रियं भुक्त्वा सर्वरोगैः प्रमुच्यते । सप्तम्यां शुक्लपक्षे यः पठदस्तङ्गते रवौ ॥ १४४॥
    सर्वारोग्यमयं देहं धारयेत् कौलिकोत्तमः । व्यतीपाते पठेद् देवि मध्याह्ने संयतेन्द्रियः ॥ १४५॥ धनं पुत्रान्
    यशो मानं लभेत् सूर्यप्रसादतः । चक्रार्चने पठेद् देवि जपन् मूलं रविं स्मरन् ॥ १४६॥ रवीभूत्वा महाचीनक्रमाचारविचक्षणः
    । सर्वशत्रून् विजित्याशु लभेल्लक्ष्मीं प्रतापवान् ॥ १४७॥ यः पठेत् परदेशस्थो वटुकार्चनतत्परः । कान्ताश्रितो
    वीतभयो भवेत् स शिवसन्निभः ॥ १४८॥ शतावर्तं पठेद्यस्तु सूर्योदययुगान्तरे । सविता सर्वलोकेशो वरदः सहसा
    भवेत् ॥ १४९॥ बहुनात्र किमुक्तेन पठनादस्य पार्वति । इह लक्ष्मीं सदा भुक्त्वा परत्राप्नोति तत्पदम् ॥
    १५०॥ रवौ देवि लिखेद्भूर्जे मन्त्रनामसहस्रकम् । अष्टगन्धेन दिव्येन नीलपुष्पहरिद्रया ॥ १५१॥ पञ्चामृतौषधीभिश्च
    नृयुक्पीयूषबिन्दुभिः । विलिख्य विधिवन्मन्त्री यन्त्रमध्येऽर्णवेष्टितम् ॥ १५२॥ गुटीं विधाय संवेष्ट्य
    मूलमन्त्रमनुस्मरन् । कन्याकर्तितसूत्रेण वेष्टयेद्रक्तलाक्षया ॥ १५३॥ सुवर्णेन च संवेष्ट्य पञ्चगव्येन
    शोधयेत् । साधयेन्मन्त्रराजेन धारयेन्मूर्ध्नि वा भुजे ॥ १५४॥ किं किं न साधयेद् देवि यन्ममापि सुदुर्लभम्
    । कुष्ठरोगी च शूली च प्रमेही कुक्षिरोगवान् ॥ १५५॥ भगन्धरातुरोऽप्यर्शी अश्मरीवांश्च कृच्छ्रवान् । मुच्यते
    सहसा धृत्वा गुटीमेतां सुदुर्लभाम् ॥ १५६॥ वन्ध्या च काकवन्ध्या च मृतवत्सा च कामिनी । धारयेद्गुटिकामेतां
    वक्षसि स्मयतर्पिता ॥ १५७॥ वन्ध्या लभेत् सुतं कान्तं काकवन्ध्यापि पार्वति । मृतवत्सा बहून् पुत्रान्
    सुरूपांश्च चिरायुशः ॥ १५८ ॥ रणे गत्वा गुटीं धृत्वा शत्रूञ्जित्वा लभेच्छ्रियम् । अक्षताङ्गो महाराजः
    सुखी स्वपुरमाविशेत् ॥ १५९॥ यो धारयेद् भुजे नित्यं राजलोकवशङ्करीम् । गुटिकां मोहनाकर्षस्तम्भनोच्चाटनक्षमाम्
    ॥ १५०॥ स भवेत् सूर्यसङ्काशो महसा महसां निधिः । धनेन धनदो देवि विभवेन च शङ्करः ॥ १६१॥ श्रियेन्द्रो
    यशसा रामः पौरुषेण च भार्गवः । गिरा बृहस्पतिर्देवि नयेन भृगुनन्दनः ॥ १६२॥ बलेन वायुसङ्काशो दयया पुरुषोत्तमः
    । आरोग्येण घटोद्भूतिः कान्त्या पूर्णेन्दुसन्निभः ॥ १६३॥ धर्मेण धर्मराजश्च रत्नै रत्नाकरोपमः । गाम्भीर्येण
    तथाम्भोधिर्दातृत्वेन बलिः स्वयम् ॥ १६४॥ सिद्ध्या श्रीभैरवः साक्षादानन्देन चिदीश्वरः । किं प्रलापेन
    बहुना पठेद्वा धारयेच्छिवे ॥ १६५॥ श
