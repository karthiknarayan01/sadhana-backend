id: rishibhihkritamvarahastotram-04
category: stotram
name:
  english: rishibhihkritamvarahastotram 04
  devanagari: ऋषिभिःकृतंवराहस्तोत्रम् ०४
content:
  english: ringodhaghanena bhuyasa kulacalendrasya yathaiva vibhramah || 41|| samsthapayainam jagatam
    satasthusham lokaya patnimasi mataram pita | vidhema casyai namasa saha tvaya yasyam svatejo'gnimivaranavadhah
    || 42|| kah shraddadhitanyatamastava prabho rasam gataya bhuva udvibarhanam | na vismayo'sau tvayi
    vishvavismaye yo mayayedam sasrije'tivismayam || 43|| vidhunvata vedamayam nijam vapuh janastapahsatyanivasino
    vayam | satashikhoddhutashivambubindubhih vimrijyamana bhrishamisha pavitah || 45|| sa vai bata bhrashtamatistavaisha
    te yah karmanam paramaparakarmanah | yadyogamayagunayogamohitam vishvam samastam bhagavan vidhehi
    sham || 45|| iti shrimadbhagavatamahapurane tritiyaskandhe trayodashadhyayantargatam rishibhih kritam
    varahastotram samaptam | bhagavatapurana | adhyaya 3
  devanagari: ृङ्गोढघनेन भूयसा कुलाचलेन्द्रस्य यथैव विभ्रमः ॥ ४१॥ संस्थापयैनां जगतां सतस्थुषां लोकाय पत्नीमसि
    मातरं पिता । विधेम चास्यै नमसा सह त्वया यस्यां स्वतेजोऽग्निमिवारणावधाः ॥ ४२॥ कः श्रद्दधीतान्यतमस्तव
    प्रभो रसां गताया भुव उद्विबर्हणम् । न विस्मयोऽसौ त्वयि विश्वविस्मये यो माययेदं ससृजेऽतिविस्मयम् ॥
    ४३॥ विधुन्वता वेदमयं निजं वपुः जनस्तपःसत्यनिवासिनो वयम् । सटाशिखोद्धूतशिवाम्बुबिन्दुभिः विमृज्यमाना
    भृशमीश पाविताः ॥ ४५॥ स वै बत भ्रष्टमतिस्तवैष ते यः कर्मणां पारमपारकर्मणः । यद्योगमायागुणयोगमोहितं
    विश्वं समस्तं भगवन् विधेहि शम् ॥ ४५॥ इति श्रीमद्भागवतमहापुराणे तृतीयस्कन्धे त्रयोदशाध्यायान्तर्गतं
    ऋषिभिः कृतं वराहस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ३
