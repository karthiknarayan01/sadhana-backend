id: sudarshanakavaca
category: kavacha
name:
  english: sudarshanakavaca
  devanagari: सुदर्शनकवच
content:
  english: ritim patu kapolam devavallabhah || 5|| vishvatma patu me vaktram jihvam vidyamayo harih |
    kantham patu mahajvalah skandhau divyayudheshvarah || 6|| bhujau me patu vijayi karau kaitabhanashanah
    | shatkona samsthitah patu hridayam dhama mamakam || 7|| madhyam patu mahaviryah trinetro nabhimandalam
    | sarvayudhamayah patu katim shronim mahadhyutih || 8|| somasuryagni nayanah uru patu ca mamakau |
    guhyam patu mahamayah januni tu jagatpatih || 9|| janghe patu mamajasram ahirbudhnyah supujitah |
    gulphau patu vishuddhatma padau parapuranjayah || 10|| sakalayudha sampurnah nikhilangam sudarshanah
    | ya idam kavacam divyam paramananda dayinam || 11|| saudarshanamidam yo vai sada shuddhah pathen
    narah | tasyartha siddhirvipula karastha bhavati dhruvam || 12|| kushmanda canda bhutadhyah yeca dushtah
    grahah smritah | palayante'nisham pitah varmanosya prabhavatah || 13|| kushtapasmara gulmadyah vyadayah
    karmahetukah | nashyantyetan mantritambu panat sapta dinavadhi || 14|| anena mantritammritsnam tulasimulah
    samsthitam | lalate tilakam kritva mohayet trijagan narah || 15|| iti shribhrigusamhitokta shrisudarshana
    kavacam sampurnam ||
  devanagari: ृतिं पातु कपोलं देववल्लभः ॥ ५॥ विश्वात्मा पातु मे वक्त्रं जिह्वां विद्यामयो हरिः । कण्ठं
    पातु महाज्वालः स्कन्धौ दिव्यायुधेश्वरः ॥ ६॥ भुजौ मे पातु विजयी करौ कैटभनाशनः । षट्कोण संस्थितः पातु
    हृदयं धाम मामकम् ॥ ७॥ मध्यं पातु महावीर्यः त्रिनेत्रो नाभिमण्डलम् । सर्वायुधमयः पातु कटिं श्रोणिं
    महाध्युतिः ॥ ८॥ सोमसूर्याग्नि नयनः ऊरु पातु च ममकौ । गुह्यं पातु महामायः जानुनी तु जगत्पतिः ॥ ९॥ जङ्घे
    पातु ममाजस्रं अहिर्बुध्न्यः सुपूजितः । गुल्फौ पातु विशुद्धात्मा पादौ परपुरञ्जयः ॥ १०॥ सकलायुध सम्पूर्णः
    निखिलाङ्गं सुदर्शनः । य इदं कवचं दिव्यं परमानन्द दायिनम् ॥ ११॥ सौदर्शनमिदं यो वै सदा शुद्धः पठेन्
    नरः । तस्यार्थ सिद्धिर्विपुला करस्था भवति ध्रुवम् ॥ १२॥ कूष्माण्ड चण्ड भूताध्याः येच दुष्टाः ग्रहाः
    स्मृताः । पलायन्तेऽनिशं पीताः वर्मणोस्य प्रभावतः ॥ १३॥ कुष्टापस्मार गुल्माद्याः व्यादयः कर्महेतुकाः
    । नश्यन्त्येतन् मन्त्रिताम्बु पानात् सप्त दिनावधि ॥ १४॥ अनेन मन्त्रिताम्मृत्स्नां तुलसीमूलः संस्थिताम्
    । ललाटे तिलकं कृत्वा मोहयेत् त्रिजगन् नरः ॥ १५॥ इति श्रीभृगुसंहितोक्त श्रीसुदर्शन कवचं सम्पूर्णम्
    ॥
