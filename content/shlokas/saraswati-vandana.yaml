id: saraswati-vandana
category: stotra
name:
  english: Saraswati Vandana
  devanagari: सरस्वती वन्दना
content:
  english: >-
    ya kundendu-tushara-hara-dhavala ya shubhra-vastravrita, ya
    vina-vara-danda-mandita-kara ya shveta-padmasana
  devanagari: >-
    या कुन्देन्दुतुषारहारधवला या शुभ्रवस्त्रावृता । या
    वीणावरदण्डमण्डितकरा या श्वेतपद्मासना ॥
meaning:
  english: >-
    She who is as white as jasmine, the moon, and a garland of snow;
    who is clothed in white; who holds the graceful staff of the
    veena in her hand; who is seated on a white lotus — an invocation
    to Goddess Saraswati.
source_attribution:
  text_source: Traditional Saraswati invocation verse, widely recited before learning
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
