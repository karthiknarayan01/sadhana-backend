id: annamayya-keerthanas-ammamma-emamma
category: stotram
name:
  english: Annamayya Keerthanas Ammamma Emamma
content:
  english: adi pallavi ammamma emamma alamelmanga nancaramma | tammiyinta nalarukòmma oyamma || caranam
    nirilona talladince nike talavanci nirikinda pulakinci niramanundu | gorikòna cèmarinci kopame pacarinci
    sarèku niyaluka ittè calincavamma || ammamma emamma alamelmanga nancaramma | tammiyinta nalarukòmma
    oyamma || nikugane cèyyicaci nindakopamureci mekòni nivirahana menu vèncini | ikadakadi satula hridayame
    pèrareci aku madiciyyanaina anatiyyavamma || ammamma emamma alamelmanga nancaramma | tammiyinta nalarukòmma
    oyamma || cakkadanamulè pènci sakalamu galadanci nikkapu venkateshudu nike pòncini | makkuvato alamelmanga
    nancaramma akkuna natani nitte alarincavamma || ammamma emamma alamelmanga nancaramma | tammiyinta
    nalarukòmma oyamma ||
  devanagari: आदि पल्लवि अम्मम्म एमम्म अलमेल्मङ्ग नाञ्चारम्म । तम्मियिण्ट नलरुकॊम्म ओयम्म ॥ चरणं नीरिलोन
    तल्लडिञ्चे नीके तलवञ्ची नीरिकिन्द पुलकिञ्ची नीरमणुण्डु । गोरिकॊन चॆमरिञ्ची कोपमे पचरिञ्ची सारॆकु नीयलुक
    इट्टॆ चालिञ्चवम्म ॥ अम्मम्म एमम्म अलमेल्मङ्ग नाञ्चारम्म । तम्मियिण्ट नलरुकॊम्म ओयम्म ॥ नीकुगाने चॆय्यिचाची
    निण्डाकोपमुरेची मेकॊनि नीविरहान मेनु वॆञ्चीनि । ईकडाकडि सतुल हृदयमे पॆररेची आकु मडिचिय्यनैन आनतिय्यवम्मा
    ॥ अम्मम्म एमम्म अलमेल्मङ्ग नाञ्चारम्म । तम्मियिण्ट नलरुकॊम्म ओयम्म ॥ चक्कदनमुलॆ पॆञ्ची सकलमु गालदञ्चि
    निक्कपु वेङ्कटेशुडु नीके पॊञ्चीनि । मक्कुवतो अलमेल्मङ्ग नाञ्चारम्म अक्कुन नातनि निट्टे अलरिञ्चवम्म
    ॥ अम्मम्म एमम्म अलमेल्मङ्ग नाञ्चारम्म । तम्मियिण्ट नलरुकॊम्म ओयम्म ॥
