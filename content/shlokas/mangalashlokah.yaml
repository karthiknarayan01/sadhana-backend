id: mangalashlokah
category: stotram
name:
  english: mangalashlokah
  devanagari: मन्गलश्लोकाः
content:
  english: mangalashlokah shriramanujamunibhiranugrihitah || shrih || || shrimate ramanujaya namah ||
    || mangalashlokah || ashesha cidacitvastu sheshine sheshashayine | nirmalananda kalyana nidhaye vishnave
    namah || 1|| samasta cidacidvastu sharirayakhilatmane | shrimate nirmalananto danvate vishnave namah
    || 2|| akhila bhuvanajanma sthemabhangadilile vinatavividabhutavrata rakshaikadikshe | shruti shirasividipte
    brahmamani shrinivase bhavatu mama parasmin semushi bhaktirupa || 3|| shriyah kantonanto varagunaganaikaspadavapuh
    hata sheshavatyah paramakhapato vanmanasayoh | abhumirbhumiryo natajanadrishamadi purusho manastatpadabje
    paricaranasaktam bhavatu me || 4|| parabrahma vaivajnam bhramaparigatam samsaratiyat paropadyalidham
    vivashamashubhasyaspadamapi | shruti nyayapetam jagati vitatam mohanamidam tamoyenapastam sa hi vijayate
    yamuna munih || 5|| yatpadamboruhadhyana vidvasta sheshakalmashah | vastudamupayatoham yamuneyam namamitam
    || 6|| iti shriramanujamunibhiranugrihitah mangalashlokah samapta |
  devanagari: मङ्गलश्लोकाः श्रीरामानुजमुनिभिरनुगृहीताः ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय नमः ॥ ॥ मङ्गलश्लोकाः
    ॥ अशेष चिदचित्वस्तु शेषिणे शेषशायिने । निर्मलानन्द कल्याण निधये विष्णवे नमः ॥ १॥ समस्त चिदचिद्वस्तु
    शरीरायाखिलात्मने । श्रीमते निर्मलानन्तो दन्वते विष्णवे नमः ॥ २॥ अखिल भुवनजन्म स्थेमभङ्गादिलीले विनतविविदभूतव्रात
    रक्षैकदीक्षे । श्रुति शिरसिविदीप्ते ब्रह्ममणि श्रीनिवासे भवतु मम परस्मिन् सेमुषी भक्तिरूपा ॥ ३॥ श्रियः
    कान्तोनन्तो वरगुणगणैकास्पदवपुः हता शेषावत्यः परमखपतो वाङ्मनसयोः । अभूमिर्भूमिर्यो नतजनदृशामादि पुरुषो
    मनस्तत्पादाब्जे परिचरणसक्तं भवतु मे ॥ ४॥ परब्रह्म वैवाज्ञं भ्रमपरिगतं संसारतियत् परोपाद्यलीढं विवशमशुभस्यास्पदमपि
    । श्रुति न्यायापेतं जगति विततं मोहनमिदं तमोयेनापास्तं स हि विजयते यामुन मुनिः ॥ ५॥ यत्पदाम्बोरुहाध्यान
    विद्वस्ता शेषकल्मषः । वस्तुदामुपयातोहं यामुनेयं नमामितम् ॥ ६॥ इति श्रीरामानुजमुनिभिरनुगृहीताः मङ्गलश्लोकाः
    समाप्ता ।
