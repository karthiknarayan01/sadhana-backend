id: giribhihkritamkartikeyastotram
category: stotram
name:
  english: giribhihkritamkartikeyastotram
  devanagari: गिरिभिःकृतंकार्तिकेयस्तोत्रम्
content:
  english: giribhih kritam kartikeyastotram 4 giraya ucuh | namah kalyanarupaya namaste vishvamangala
    | vishvabandho namaste'stu namaste vishvabhavana || 81|| varishthah shvapaca yena krita vai darshanattvaya
    | tvam namamo jagadbandhum tvam vayam sharanagatah || 82|| namaste parvatiputra shankaratmaja te namah
    | namaste krittikasuno agnibhuta namo'stu te || 83|| namo'stu te devavaraih supujya namo'stu te jnanavidam
    varishtha | namo'stu te devavara prasida sharanya sarvartivinashadaksha || 84|| evam stuto giribhih
    karttikeyo hyumasutah | tangirinsuprasannatma varam datum samutsukah || 85|| iti shriskandapurane
    maheshvarakhande
  devanagari: गिरिभिः कृतं कार्तिकेयस्तोत्रम् ४ गिरय ऊचुः । नमः कल्याणरूपाय नमस्ते विश्वमङ्गल । विश्वबन्धो
    नमस्तेऽस्तु नमस्ते विश्वभावन ॥ ८१॥ वरीष्ठाः श्वपचा येन कृता वै दर्शनात्त्वया । त्वां नमामो जगद्बन्धुं
    त्वां वयं शरणागताः ॥ ८२॥ नमस्ते पार्वतीपुत्र शङ्करात्मज ते नमः । नमस्ते कृत्तिकासूनो अग्निभूत नमोऽस्तु
    ते ॥ ८३॥ नमोऽस्तु ते देववरैः सुपूज्य नमोऽस्तु ते ज्ञानविदां वरिष्ठ । नमोऽस्तु ते देववर प्रसीद शरण्य
    सर्वार्तिविनाशदक्ष ॥ ८४॥ एवं स्तुतो गिरिभिः कार्त्तिकेयो ह्युमासुतः । तान्गिरीन्सुप्रसन्नात्मा वरं
    दातुं समुत्सुकः ॥ ८५॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
meaning: {}
