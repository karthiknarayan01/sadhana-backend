id: ashtalakshmi-stotram
category: stotram
name:
  english: ashtalakshmi stotram
  devanagari: अष्टलक्ष्मी स्तोत्रम्
content:
  english: '|| adilakshmi || sumanasavandita sundari madhavicandra sahodari hemamaye | muniganamandita
    mokshapradayinimanjuḻabhashini vedanute || pankajavasini devasupujitasadgunavarshini shantiyute |
    jayajaya he madhusudana kaminiadilakshmi sada palaya mam || 1|| || dhanyalakshmi || ahikali kalmashanashini
    kaminivaidikarupinivedamaye | kshirasamudbhava mangalarupinimantranivasini mantranute || mangaladayini
    ambujavasinidevaganashrita padayute | jayajaya he madhusudana kaminidhanyalakshmi sada palaya mam
    || 2|| || dhairyalakshmi || jayavaravarnini vaishnavi bhargavimantrasvarupini mantramaye | suraganapujita
    shighraphalapradajnanavikasini shastranute || bhavabhayaharini papavimocanisadhujanashrita padayute
    | jayajaya he madhusudana kaminidhairyalakshmi sadapalaya mam || 3|| || gajalakshmi || jayajaya durgatinashini
    kaminisarvaphalaprada shastramaye | rathagaja turagapadadi samavritaparijanamandita lokanute || harihara
    brahma supujita sevitatapanivarini padayute | jayajaya hemadhusudana kaminigajalakshmi rupenapalayamam
    || 4|| || santanalakshmi || ahikhaga vahinimohini cakriniragavivardhini jnanamaye | gunaganavaridhi
    lokahitaishinisvarasapta bhushitagananute || sakala surasura devamunishvaramanavavandita padayute
    | jayajaya he madhusudana kaminisantanalakshmi tvam palaya mam || 5|| || vijayalakshmi || jaya kamalasani
    sadgatidayinijnanavikasini ganamaye | anudinamarcita kunkumadhusara'
  devanagari: ॥ आदिलक्ष्मी ॥ सुमनसवन्दित सुन्दरि माधविचन्द्र सहोदरि हेममये । मुनिगणमण्डित मोक्षप्रदायिनिमञ्जुळभाषिणि
    वेदनुते ॥ पङ्कजवासिनि देवसुपूजितसद्गुणवर्षिणि शान्तियुते । जयजय हे मधुसूदन कामिनिआदिलक्ष्मि सदा पालय
    माम् ॥ १॥ ॥ धान्यलक्ष्मी ॥ अहिकलि कल्मषनाशिनि कामिनिवैदिकरूपिणिवेदमये । क्षीरसमुद्भव मङ्गलरूपिणिमन्त्रनिवासिनि
    मन्त्रनुते ॥ मङ्गलदायिनि अम्बुजवासिनिदेवगणाश्रित पादयुते । जयजय हे मधुसूदन कामिनिधान्यलक्ष्मि सदा
    पालय माम् ॥ २॥ ॥ धैर्यलक्ष्मी ॥ जयवरवर्णिनि वैष्णवि भार्गविमन्त्रस्वरूपिणि मन्त्रमये । सुरगणपूजित
    शीघ्रफलप्रदज्ञानविकासिनि शास्त्रनुते ॥ भवभयहारिणि पापविमोचनिसाधुजनाश्रित पादयुते । जयजय हे मधुसूदन
    कामिनिधैर्यलक्ष्मि सदापालय माम् ॥ ३॥ ॥ गजलक्ष्मी ॥ जयजय दुर्गतिनाशिनि कामिनिसर्वफलप्रद शास्त्रमये
    । रथगज तुरगपदादि समावृतपरिजनमण्डित लोकनुते ॥ हरिहर ब्रह्म सुपूजित सेविततापनिवारिणि पादयुते । जयजय
    हेमधुसूदन कामिनिगजलक्ष्मि रूपेणपालयमाम् ॥ ४॥ ॥ सन्तानलक्ष्मी ॥ अहिखग वाहिनिमोहिनि चक्रिणिरागविवर्धिनि
    ज्ञानमये । गुणगणवारिधि लोकहितैषिणिस्वरसप्त भूषितगाननुते ॥ सकल सुरासुर देवमुनीश्वरमानववन्दित पादयुते
    । जयजय हे मधुसूदन कामिनिसन्तानलक्ष्मि त्वं पालय माम् ॥ ५॥ ॥ विजयलक्ष्मी ॥ जय कमलासनि सद्गतिदायिनिज्ञानविकासिनि
    गानमये । अनुदिनमर्चित कुङ्कुमधूसर
