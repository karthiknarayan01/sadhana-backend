id: vedavyasamantrah
category: mantra
name:
  english: vedavyasamantrah
  devanagari: वेदव्यासमन्त्राः
content:
  english: dhyayecchashanka shatakotyati saukhyakantim samsicyamanamamritorughataih sureshaih | varnabhimanibhirajeshamukhaih
    sahaiva pancashata pratigirantamashesha vidyah || iti shrivedavyasamantrah samaptah |
  devanagari: ध्यायेच्छशाङ्क शतकोट्यति सौख्यकान्तिं संसिच्यमानममृतोरुघटैः सुरेशैः । वर्णाभिमानिभिरजेशमुखैः
    सहैव पञ्चाशता प्रतिगिरन्तमशेष विद्याः ॥ इति श्रीवेदव्यासमन्त्राः समाप्ताः ।
meaning: {}
