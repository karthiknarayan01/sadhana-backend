id: narayaniyam-dashaka-64
category: stotram
name:
  english: Narayaniyam Dashaka 64
content:
  english: alokya shailoddharanadirupam prabhavamuccaistava gopalokah | vishveshvaram tvamabhimatya vishve
    nandam bhavajjatakamanvapricchan || || gargodito nirgadito nijaya vargaya tatena tava prabhavah |
    purvadhikastvayyanuraga eshamaidhishta tavat bahumanabharah || || tato'vamanoditatattvabodhah suradhirajah
    saha divyagavya| upetya tushtava sa nashtagarvah sprishtva padabjam manimaulina te || || snehasnutaistvam
    surabhih payobhirgovindanamankitamabhyashincat | airavatopahritadivyagangapathobhirindro'pi ca jataharshah
    || || jagattrayeshe tvayi gokuleshe tatha'bhishikte sati gopavatah | nake'pi vaikunthapade'pyalabhyam
    shriyam prapede bhavatah prabhavat || || kadacidantaryamunam prabhate snayan pita varunapurushena
    | nitastamanetumagah purim tvam tam varunim karanamartyarupah || || sasambhramam tena jaladhipena
    prapujitastvam pratigrihya tatam | upagatastatkshanamatmageham pita'vadattaccaritam nijebhyah || ||
    harim vinishcitya bhavantametan bhavatpadalokanabaddhatrishnan || nirikshya vishno paramam padam taddurapamanyaistvamadidrishastan
    || || sphuratparanandarasapravahaprapurnakaivalyamahapayodhau | ciram nimagnah khalu gopasanghastvayaiva
    bhuman punaruddhritaste || || karabadaravadevam deva kutravatare nijapadamanavapyam darshitam bhaktibhajam
    | tadiha pashuparupi tvam hi sakshat paratma pavanapuranivasin pahi mamamayebhyah ||
  devanagari: आलोक्य शैलोद्धरणादिरूपं प्रभावमुच्चैस्तव गोपलोकाः । विश्वेश्वरं त्वामभिमत्य विश्वे नन्दं
    भवज्जातकमन्वपृच्छन् ॥ ॥ गर्गोदितो निर्गदितो निजाय वर्गाय तातेन तव प्रभावः । पूर्वाधिकस्त्वय्यनुराग
    एषामैधिष्ट तावत् बहुमानभारः ॥ ॥ ततोऽवमानोदिततत्त्वबोधः सुराधिराजः सह दिव्यगव्या। उपेत्य तुष्टाव स
    नष्टगर्वः स्पृष्ट्वा पदाब्जं मणिमौलिना ते ॥ ॥ स्नेहस्नुतैस्त्वां सुरभिः पयोभिर्गोविन्दनामाङ्कितमभ्यषिञ्चत्
    । ऐरावतोपाहृतदिव्यगङ्गापाथोभिरिन्द्रोऽपि च जातहर्षः ॥ ॥ जगत्त्रयेशे त्वयि गोकुलेशे तथाऽभिषिक्ते सति
    गोपवाटः । नाकेऽपि वैकुण्ठपदेऽप्यलभ्यां श्रियं प्रपेदे भवतः प्रभावात् ॥ ॥ कदाचिदन्तर्यमुनं प्रभाते
    स्नायन् पिता वारुणपूरुषेण । नीतस्तमानेतुमगाः पुरीं त्वं तां वारुणीं कारणमर्त्यरूपः ॥ ॥ ससम्भ्रमं तेन
    जलाधिपेन प्रपूजितस्त्वं प्रतिगृह्य तातम् । उपागतस्तत्क्षणमात्मगेहं पिताऽवदत्तच्चरितं निजेभ्यः ॥ ॥
    हरिं विनिश्चित्य भवन्तमेतान् भवत्पदालोकनबद्धतृष्णान् ॥ निरीक्ष्य विष्णो परमं पदं तद्दुरापमन्यैस्त्वमदीदृशस्तान्
    ॥ ॥ स्फुरत्परानन्दरसप्रवाहप्रपूर्णकैवल्यमहापयोधौ । चिरं निमग्नाः खलु गोपसङ्घास्त्वयैव भूमन् पुनरुद्धृतास्ते
    ॥ ॥ करबदरवदेवं देव कुत्रावतारे निजपदमनवाप्यं दर्शितं भक्तिभाजाम् । तदिह पशुपरूपी त्वं हि साक्षात्
    परात्मा पवनपुरनिवासिन् पाहि मामामयेभ्यः ॥
