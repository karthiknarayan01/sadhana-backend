id: devibhagavatapuranam
category: purana
name:
  english: devibhagavatapuranam
  devanagari: देवीभागवतपुराणम्
content:
  english: puranani agnipuranam kurmapuranam garudapuranam naradapuranam padmapuranam brahmapuranam brahmavaivartapuranam
    brahmandapuranam bhavishyapuranam bhagavatapuranam matsyapuranam markandeyapuranam lingapuranam varahapuranam
    vamanapuranam vayupuranam vishnupuranam shivapuranam skandapuranam harivamshapuranam upapuranah kalkipuranam
    kalikapuranam devibhagavatapuranam vishnudharmottarapuranam ramayanam valmikiramayanam yogavasishthah
    samhitagranthah gargasamhita lakshminarayanasamhita vikirnagranthah jaiminiyashvamedhaparva shrimad
    devibhagavata mahapuranam mahatmyam skandha 1 skandha 2 skandha 3 skandha 4 skandha 5 skandha 6 skandha
    7 skandha 8 skandha 9 skandha 10 skandha 11 skandha 12 devibhagavata puranasya samagri shri bhide
    mahodayasya saujanyat nimnalikhita jalaprishthatah grihitam bhavati
  devanagari: पुराणानि अग्निपुराणम् कूर्मपुराणम् गरुडपुराणम् नारदपुराणम् पद्मपुराणम् ब्रह्मपुराणम् ब्रह्मवैवर्तपुराणम्
    ब्रह्माण्डपुराणम् भविष्यपुराणम् भागवतपुराणम् मत्स्यपुराणम् मार्कण्डेयपुराणम् लिङ्गपुराणम् वराहपुराणम्
    वामनपुराणम् वायुपुराणम् विष्णुपुराणम् शिवपुराणम् स्कन्दपुराणम् हरिवंशपुराणम् उपपुराणाः कल्किपुराणम्
    कालिकापुराणम् देवीभागवतपुराणम् विष्णुधर्मोत्तरपुराणम् रामायणम् वाल्मीकिरामायणम् योगवासिष्ठः संहिताग्रन्थाः
    गर्गसंहिता लक्ष्मीनारायणसंहिता विकीर्णग्रन्थाः जैमिनीयाश्वमेधपर्व श्रीमद् देवीभागवत महापुराणम् माहात्म्यम्
    स्कन्ध १ स्कन्ध २ स्कन्ध ३ स्कन्ध ४ स्कन्ध ५ स्कन्ध ६ स्कन्ध ७ स्कन्ध ८ स्कन्ध ९ स्कन्ध १० स्कन्ध
    ११ स्कन्ध १२ देवीभागवत पुराणस्य सामग्री श्री भिडे महोदयस्य सौजन्यात् निम्नलिखित जालपृष्ठतः गृहीतं
    भवति
meaning: {}
