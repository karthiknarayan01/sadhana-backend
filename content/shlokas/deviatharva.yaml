id: deviatharva
category: upanishad
name:
  english: deviatharva
  devanagari: देवीअथर्व
content:
  english: rashtri aham suve pitaramasya murdhanmama yonirapsvantah samudre | ya evam veda | sa daivim
    sampadamapnoti || 7|| te deva abruvan | namo devyai mahadevyai shivayai satatam namah | namah prakrityai
    bhadrayai niyatah pranatah sma tam || 8|| tamagnivarnam tapasa jvalantim vairocanim karmaphaleshu
    jushtam | durgam devim sharanam prapadyamahe'surannashayitryai te namah || 9|| devim vacamajanayanta
    devastam vishvarupah pashavo vadanti | sa no mandreshamurjam duhana dhenurvagasmanupa sushtutaitu
    || 10|| kalaratrim brahmastutam vaishnavim skandamataram | sarasvatimaditim dakshaduhitaram namamah
    pavanam shivam || 11|| mahalakshmyai ca vidmahe sarvashaktyai ca dhimahi | tanno devi pracodayat ||
    12|| aditirhyajanishta daksha ya duhita tava | tam deva anvajayanta bhadra amritabandhavah || 13||
    kamo yonih kamala vajrapanirguha hasa matarishvabhramindrah | punarguha sakala mayaya ca purucyaisha
    vishvamatadividyom || 14||
  devanagari: राष्ट्री अहं सुवे पितरमस्य मूर्धन्मम योनिरप्स्वन्तः समुद्रे । य एवं वेद । स दैवीं सम्पदमाप्नोति
    ॥ ७॥ ते देवा अब्रुवन् । नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै भद्रायै नियताः प्रणताः
    स्म ताम् ॥ ८॥ तामग्निवर्णां तपसा ज्वलन्तीं वैरोचनीं कर्मफलेषु जुष्टाम् । दुर्गां देवीं शरणं प्रपद्यामहेऽसुरान्नाशयित्र्यै
    ते नमः ॥ ९॥ देवीं वाचमजनयन्त देवास्तां विश्वरूपाः पशवो वदन्ति । सा नो मन्द्रेषमूर्जं दुहाना धेनुर्वागस्मानुप
    सुष्टुतैतु ॥ १०॥ कालरात्रीं ब्रह्मस्तुतां वैष्णवीं स्कन्दमातरम् । सरस्वतीमदितिं दक्षदुहितरं नमामः
    पावनां शिवाम् ॥ ११॥ महालक्ष्म्यै च विद्महे सर्वशक्त्यै च धीमहि । तन्नो देवी प्रचोदयात् ॥ १२॥ अदितिर्ह्यजनिष्ट
    दक्ष या दुहिता तव । तां देवा अन्वजायन्त भद्रा अमृतबन्धवः ॥ १३॥ कामो योनिः कमला वज्रपाणिर्गुहा हसा
    मातरिश्वाभ्रमिन्द्रः । पुनर्गुहा सकला मायया च पुरूच्यैषा विश्वमातादिविद्योम् ॥ १४॥
