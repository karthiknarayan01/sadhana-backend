    कुला॑लेभ्यः क॒र्मारे भ्यश्च वो॒ नमो॒ नमः॑ पु॒ञ्जिष्टे भ्यो निषा॒देभ्य॑श्च वो॒ नमो॒ नम॑ इषु॒कृद्भ्यो॑
