id: udghatanakavacastotram
category: stotram
name:
  english: udghatanakavacastotram
  devanagari: उद्घाटनकवचस्तोत्रम्
content:
  english: kurma ka pancopacara se pujana karem | kramanusara phira kalasha ki sankshipta puja karake
    jala ko abhimantrita kara atmaprokshana puja samagri ka prokshana karem | pancagavya prashana kara
    lem | ucita samajhem to sarvaprathama dashavidha snana bhi karem | dipaka ka pujana karem | digraksha
    ka vidhana karem tatha ganapati ke pujana
  devanagari: कूर्म का पञ्चोपचार से पूजन करें । क्रमानुसार फिर कलश की सङ्क्षिप्त पूजा करके जल को अभिमन्त्रित
    कर आत्मप्रोक्षण पूजा सामग्री का प्रोक्षण करें । पञ्चगव्य प्राशन कर लें । उचित समझें तो सर्वप्रथम दशविध
    स्नान भी करें । दीपक का पूजन करें । दिग्रक्षा का विधान करें तथा गणपति के पूजन
meaning: {}
