id: saptashati-tantradurga
category: sahasranama
name:
  english: saptashati tantradurga
  devanagari: सप्तशति तन्त्रदुर्गा
content:
  english: om mam male mahamaye sarvashakti svarupini | caturvargastvayi nyastastasmanme siddhida bhava
    || 1|| om avighnam kuru male tvam grihnami dakshinekare | japakale ca siddhyartham prasida mama siddhaye
    || 2|| om akshamaladhipataye susiddhim dehi dehi sarvamantrarthasadhini sadhaya sadhaya sarvasiddhim
    parikalpaya parikalpaya me svaha || isa prakara prarthana karake japa arambha kare | japa pura karake
    japa ko bhagavati ko samarpita karate huye kahe | guhyatiguhyagoptri tvam grihanasmatkritam japam
    | siddhirbhavatu me devi tvatprasadan maheshvari || pashcat nice likhe anusara saptashati ka nyasa
    kare | || itinavarnajapavidhih samaptah || athatantradurgasaptashatinyasah || karanyasah || om hrim
    angushthabhyam namah | om cam tarjanibhyam namah | om dim madhyamabhyam namah | om kam anamikabhyam
    namah | om yaim kanishthakabhyam namah | om hrim candikayai karatalakaraprishthabhyam namah | || hridayadinyasah
    || om aim slum namah khadginishulinighora cakrini gadinitatha | om aim nom namah shankhini capini
    banabhushundi parighayudha || hridayaya namah | om aim phraim namah om shulenapahi no devi pahikhadgenacambike
    | ghantasvanena nah pahi capajyanisvanena ca || shirase svaha | om aim krim namah om pracyamraksha
    praticyanca candikeraksha dakshinem | bhramanenatmashulasya uttarasyantatheshvari || shikhayai vashat
    | om aim mlum namah om saumyaniyanirupani trailokyevicarantite | yani catyarthaghorani tairakshasma~statha
    bhuvam || kavacayahum | om aim ghrem namah om khadgashulagadadini yanicastranite'mbike | karapallavasangini
    tairasman rakshasarvatah || netratrayayavaushat | om aim shrum namah om sarvasvarupe sarveshe sarvashaktisamanvite
    | bhayebhyastrahi no devi durge devi namo'stute || astraya phat | || dhyanam || vidyuddamasamaprabham
    mrigapatiskandhasthitam bhishanam kanyabhihkaravalakhetavilasaddhastabhirasevitam || hastaishcakragadasikhetavishikham
    shcapam gunam tarjanim vibhranamanalatmikam shashidharam durgam trinetram bhaje || artha
  devanagari: ॐ मां माले महामाये सर्वशक्ति स्वरूपिणि । चतुर्वर्गस्त्वयि न्यस्तस्तस्मान्मे सिद्धिदा भव
    ॥ १॥ ॐ अविघ्नं कुरु माले त्वं गृह्णामि दक्षिणेकरे । जपकाले च सिद्ध्यर्थं प्रसीद मम सिद्धये ॥ २॥ ॐ
    अक्षमालाधिपतये सुसिद्धिं देहि देहि सर्वमन्त्रार्थसाधिनि साधय साधय सर्वसिद्धिं परिकल्पय परिकल्पय मे
    स्वाहा ॥ इस प्रकार प्रार्थना करके जप आरम्भ करे । जप पूरा करके जप को भगवती को समर्पित करते हुये कहे
    । गुह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान् महेश्वरि ॥
    पश्चात् नीचे लिखे अनुसार सप्तशती का न्यास करे । ॥ इतिनवार्णजपविधिः समाप्तः ॥ अथतन्त्रदुर्गासप्तशतीन्यासः
    ॥ करन्यासः ॥ ॐ ह्रीं अङ्गुष्ठाभ्यां नमः । ॐ चं तर्जनीभ्यां नमः । ॐ डिं मध्यमाभ्यां नमः । ॐ कां अनामिकाभ्यां
    नमः । ॐ यैं कनिष्ठकाभ्यां नमः । ॐ ह्रीं चण्डिकायै करतलकरपृष्ठाभ्यां नमः । ॥ हृदयादिन्यासः ॥ ॐ ऐं स्लूं
    नमः खड्गिनीशूलिनीघोरा चक्रिणी गदिनीतथा । ॐ ऐं नों नमः शङ्खिनी चापिनी बाणभुशुण्डी परिघायुधा ॥ हृदयाय
    नमः । ॐ ऐं फ्रैं नमः ॐ शूलेनपाहि नो देवि पाहिखड्गेनचाम्बिके । घण्टास्वनेन नः पाहि चापज्यानिस्वनेन
    च ॥ शिरसे स्वाहा । ॐ ऐं क्रीं नमः ॐ प्राच्यांरक्ष प्रतीच्याञ्च चण्डिकेरक्ष दक्षिणें । भ्रामणेनात्मशूलस्य
    उत्तरस्यान्तथेश्वरि ॥ शिखायै वषट् । ॐ ऐं म्लूं नमः ॐ सौम्यानियानिरूपाणि त्रैलोक्येविचरन्तिते । यानि
    चात्यर्थघोराणि तैरक्षास्माँस्तथा भुवम् ॥ कवचायहुम् । ॐ ऐं घ्रें नमः ॐ खड्गशूलगदादीनि यानिचास्त्राणितेऽम्बिके
    । करपल्लवसङ्गीनि तैरस्मान् रक्षसर्वतः ॥ नेत्रत्रयायवौषट् । ॐ ऐं श्रूं नमः ॐ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते
    । भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तुते ॥ अस्त्राय फट् । ॥ ध्यानं ॥ विद्युद्दामसमप्रभां मृगपतिस्कन्धस्थितां
    भीषणां कन्याभिःकरवालखेटविलसद्धस्ताभिरासेविताम् ॥ हस्तैश्चक्रगदासिखेटविशिखां श्चापं गुणं तर्जनीं विभ्राणामनलात्मिकां
    शशिधरां दुर्गां त्रिनेत्रां भजे ॥ अर्थ
