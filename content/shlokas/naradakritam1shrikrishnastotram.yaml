id: naradakritam1shrikrishnastotram
category: stotram
name:
  english: naradakritam1shrikrishnastotram
  devanagari: नारदकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: 30|| tvadanghridivyajyotsnaika mumukshunam hridi sthitam | mahatsantamasamhartum sadyah shaktasti
    satpate || 31|| sarvairvedaistvamevejya upasyo jneya eva ca | nirupito'si bhagavansarvakaranakaranam
    || 32|| ekaikasmin romakupe yattavasti sitam mahah | shantamanandarupam ca tatkotinduprabhadhikam
    || 33|| asmimstvamakshare dhamni nirgune'mritasamjnake | mahahpunje sadaivasse nirgunah purushottamah
    || 34|| brahmandabhayadatkalanmayayashca mahabhayat | mukta bhakta bhavantyeva tvadiyopasanabalat
    || 35|| tam tvamahamupeto'smi sharanam jagadishvaram | sarvatmanam vibhum brahma mahapurushamacyutam
    || 36|| yatha tvaccaranambhoje bhaktirme nishcala sada | bhavettathaiva devesha karttumarhasyanugraham
    || 37|| iti shriskandapurane vaishnavakhande vasudevamasamahatmye saptadashadhyayantargatam naradakritam
    shrikrishnastotram samaptam | skandapurana | vaishnavakhanda | vasudevakhanda | adhyaya 17
  devanagari: ३०॥ त्वदङ्घ्रिदिव्यज्योत्स्नैका मुमुक्षूणां हृदि स्थितम् । महत्सन्तमसंहर्तुं सद्यः शक्तास्ति
    सत्पते ॥ ३१॥ सर्वैर्वेदैस्त्वमेवेज्य उपास्यो ज्ञेय एव च । निरूपितोऽसि भगवन्सर्वकारणकारणम् ॥ ३२॥ एकैकस्मिन्
    रोमकूपे यत्तवास्ति सितं महः । शान्तमानन्दरूपं च तत्कोटीन्दुप्रभाधिकम् ॥ ३३॥ अस्मिंस्त्वमक्षरे धाम्नि
    निर्गुणेऽमृतसंज्ञके । महःपुञ्जे सदैवास्से निर्गुणः पुरुषोत्तमः ॥ ३४॥ ब्रह्माण्डभयदात्कालान्मायायाश्च
    महाभयात् । मुक्ता भक्ता भवन्त्येव त्वदीयोपासनाबलात् ॥ ३५॥ तं त्वामहमुपेतोऽस्मि शरणं जगदीश्वरम् । सर्वात्मानं
    विभुं ब्रह्म महापुरुषमच्युतम् ॥ ३६॥ यथा त्वच्चरणाम्भोजे भक्तिर्मे निश्चला सदा । भवेत्तथैव देवेश कर्त्तुमर्हस्यनुग्रहम्
    ॥ ३७॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे वासुदेवमासमाहात्म्ये सप्तदशाध्यायान्तर्गतं नारदकृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । वासुदेवखण्ड । अध्याय १७
