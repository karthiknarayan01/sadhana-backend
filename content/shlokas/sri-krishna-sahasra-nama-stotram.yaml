    krishnam sarathimaptavan || || draupadya damayantya ca savitrya ca sushilaya | duritani jitanyetajjapadaptam
    ca vanchitam || || kimidam bahuna shamsanmanavo modanirbharah | brahmanandamavapyante krishnasayujyamapnuyat
