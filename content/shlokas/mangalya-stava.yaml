id: mangalya-stava
category: stotram
name:
  english: Mangalya Stava
  devanagari: माङ्गल्यस्तवः
content:
  english: the first tvo verses form dhalbya's question and vhat follovs form his dvarfish form and are
    folloved by one verse eac about hayagriva, vorshipping the ḻord one can get all his vishes fulfilled|
    the neksht stotram| ġreat acaryas like shri Parasara Bhattar and shri Vedanta desika had stotram and
    lends authrity to it| devotis may, therefore include dalbhyah - karyarambheshu sarveshu duhsvapneshu
    ca sattama | amangalyeshu drishteshu yajjaptavyam taducyatam || 1|| yenarambhashca siddhyanti duhsvapnashcopashamyati
    | amangalanam drishtanam pariharashca jayate || 2|| shri pulastyah:- janardanam bhutapatim jagadgurum
    smaran manushyah satatam mahamune | dushtanyasheshanyapahanti sadhayati asheshakaryani ca yanyabhipsati
    || 3|| shrinushva canyat gadato mamakhilam vadami yat te dvijavarya! mangalam | sarvarthasiddhim pradadati
    yat sada nihantysheshani ca patakani || 4|| pratishtitam yatra jagaccaracaram jagattraye yo jagatashca
    hetuh | jagacca patyatti ca yah sa sarvada mamastu mangalyavivriddhaye harih || 5|| vyomambuvayvagnimahisvarupaih
    vistaravan yo'nutaro'nubhavat | asthulasukshmah satatam pareshvaro mamastu mangalyavivriddhaye harih
    || 6|| yasmat parasmat purushadanantat anadimadhyadadhikam na kimcit | sa hetuhetuh parameshvareshvarah
    mamastu mangalyavivriddhaye harih || 7|| hiranyagarbhacyutarudrarupi srijatyashesham paripati hanti
    | gunagraniryo bhagavan sa sarvada mamastu mangalyavivriddhaye harih || 8|| parah suranam paramo'suranam
    paro yatinam paramo muninam | parah samastasya ca yah sa sarvada mamastu mangalyavivriddhaye harih
    || 9|| dhyato muninamapakalmashairyo dadati muktim parameshvareshvarah | manobhiramah purushah sa
    sarvada mamastu mangalyavivriddhaye harih || 10|| surendravaivasvatavittapambupasvaruparupi paripati
    yo jagat | sa shuddhashuddhah parameshvareshvaro mamastu mangalyavivriddhaye harih || 11|| yannamasankirtanato
    vimucyate hyanekajanmarjitapapasancayat | papendhanagnih sa sadaiva nirmalo mamastu mangalyavivriddhaye
    harih || 12|| yenoddhriteyam dharani rasatalat asheshasrishtisthitikaranadikam | bibharti vishvam
    jagatah sa mulam mamastu mangalyavivriddhaye harih || 13|| padeshu veda jathare caracaram romasvashesha
    munayo mukhe makhah | yasyeshvareshasya sa sarvada prabhuh mamastu mangalyavivriddhaye harih || 14||
    samasta yajnangamayam vapuh prabhoh yasyangamisheshvarasamstutasya | varaharupi bhagavan sa sarvada
    mamastu mangalyavivriddhaye harih || 15|| vikshobhya sarvodadhitoyasambhavam dadhara dhatrim jagatashca
    yo bhuvam | yajneshvaro yajnapuman sa sarvada mamastu mangalyavivriddhaye harih || 16|| patalamuleshvarabhogisamhato
    vinyasya padau pritivim ca bibhratah | yasyopamanam na babhuva so'cyuto mamastu mangalyavivriddhaye
    harih || 17|| saghargharam yasya ca brimhitam muhuh sanandanadyairjanalokasamshritaih | shrutam jayetyuktiparaih
    sa sarvada mamastu mangalyavivriddhaye harih || 18|| ekarnavad yasya mahiyasau mahim adaya vegena
    khamutpatishyatah | natam vapuryogivaraih sa sarvada mamastu mangalyavivriddhaye harih || 19|| hato
    hiranyakshamahasurah pura puranapumsa paramena yena | varaharupah sa patih prajapatih mamastu mangalyavivriddhaye
    harih || 20|| damshtrakaralam surabhitinashakam kritam vapurdivyanrisimharupina | tratum jagat yena
    sa sarvada prabhuh mamastu mangalyavivriddhaye harih || 21|| daityendravakshahsthaladaradarunaih kareruhairyah
    krakacanukaribhih | viccheda lokasya bhayani so'cyuto mamastu mangalyavivriddhaye harih || 22|| dantantadiptadyutinirmalani
    yah cakara sarvani disham mukhani | ninadavitrasitadanavo hyasau mamastu mangalyavivriddhaye harih
    || 23|| yannamasamkirtanato mahabhayat vimokshamapnoti na samshayam narah | sa sarvalokartiharo nrikesari
    mamastu mangalyavivriddhaye harih || 24|| satakaralabhramananilahatah sphutanti yasyambudharah samantatah
    | sa divyasimhah sphuritanalekshano mamastu mangalyavivriddhaye harih || 25|| yadikshanajyotishi rashmimandalam
    pralinamishanna raraja bhasvatah | kutah shashankasya sa divyarupadhrik mamastu mangalyavivriddhaye
    harih || 26|| asheshadeveshanareshvareshvaraih sada stutam yaccaritam mahadbhutam | sa sarvalokartiharo
    mahaharih mamastu mangalyavivriddhaye harih || 27|| dravanti daityah pranamanti devatah nashyanti
    rakshamsi apayanti carayah | yatkirtanat so'dbhutarupakesari mamastu mangalyavivriddhaye harih ||
    28|| rikpavitam yo yajusha hi shrimat samadhvanidhvastasamastapatakam | cakre jagat vamanakah sa sarvada
    mamastu mangalyavivriddhaye harih || 29|| yatpadavinyasapavitratam mahi yayau viyaccargyajushamudiranat
    | sa vamano divyasharirarupadrin mamastu mangalyavivriddhaye harih || 30|| yasmin prayate'surabhubhrito'dhvarat
    nanama khedadavanih sasagara | sa vamanah sarvajaganmayah sada mamastu mangalyavivriddhaye harih ||
    31|| mahadbhute daityapatermahadhvare yasmin pravishte kshubhitam mahasuraih | sa vamano'ntasthitasaptalokadhrin
    mamastu mangalyavivriddhaye harih || 32|| samghaih suranam divi bhutalasthitaih tatha manushyairgagane
    ca khecaraih | stutah kramad yah praccara sarvada mamastu mangalyavivriddhaye harih || 33|| krantva
    dharitrim gaganam tatha divam marutpateryah pradadau trivishtapam | sa devadevo bhuvaneshvareshvaro
    mamastu mangalyavivriddhaye harih || 34|| anugraham capi baleranuttmam cakara yashcendrapadopamam
    kshanat | suramshca yajnamshabhujah sa sarvada mamastu mangalyavivriddhaye harih || 35|| rasatalad
    yena pura samahritah samastaveda jalacararirupina | sa kaitabharimadhuha'mbushayi mamastu mangalyavivriddhaye
    harih || 36|| nihkshatriyam yashca cakara medinim anekasho bahuvanam tatha'cchinat | yah kartaviryasya
    sa bhargavottamo mamastu mangalyavivriddhaye harih || 37|| nihatya yo valinamugravikramam nibaddhya
    setum jaladhau dashananam | jaghana canyan rajanicaran asau mamastu mangalyavivriddhaye harih || 38||
    cikshepa balah shakatam, babhanja yo yamarjunam, kamsamarim jaghana ca | mamarda canuramukhan sa sarvada
    mamastu mangalyavivriddhaye harih || 39|| pratah sahasramshumaricinirmalam karena bibhrat bhagavan
    sudarshanam | kaumodaki capi gadamananto mamastu mangalyavivriddhaye harih || 40|| himendukundasphatikabhanirmalam
    mukhanilapuritamishvareshvarah | madhyahnakale'pi sa shankhamudvahan mamastu mangalyavivriddhaye harih
    || 41|| tathaparahne pravikasi pankajam vakshasthalena shriyamudvahan harih | vistaripadmayatapatralocano
    mamastu mangalyavivriddhaye harih || 42|| sarveshu kaleshu samastadesheshu asheshakaryeshu tatheshvareshvarah
    | sarvaih svarupairbhagavan anadiman mamastu mangalyavivriddhaye harih || 43|| etat pathan dalbhya
    samastapapaih vimucyate vishnuparo manushyah | siddhyanti karyani tatha'sya sarvan arthanavapnoti
    yathecchate tan || 44|| duhsvapnah prashamamupaiti pathyamane stotre'smin shravanavidhau sadodyatasya
    | prarambho drutamupayati siddhimishah papani kshapayati casya devadevah || 45|| mangalyam paramapadam
    sada'rthasiddhim nirvighnamadhikaphalam shriyam dadati | kim loke tadiha paratra capi pumsam yadvishnupravanadhiyam
    na dalbhya! sadhyam || 46|| devendrastribhuvanamarthamekapimgah samsiddhim tribhuvanagam ca kartaviryah
    | vaidehah paramapadam prasadya vishnum sampraptah sakalaphalaprado hi vishnuh || 47|| sarvarambheshu
    dalbhyaitad duhsvapneshu ca panditah | japedekamana vishnau tatha'mangalyadarshane || 48|| shamam
    prayanti dushtani grahapidashca darunah | karmarambhashca siddhyanti punyamapnoti cottamam || 49||
    harirdadati bhadrani mangalyastutisamstutah | karotyakhilarupaistu rakshamakshatashaktibhrit || 50||
    || shrivishnudharmottarantargatah mangalyastavah sampurnah ||
  devanagari: ठे फ़िर्स्त् त्वो वेर्सेस् फ़ोर्म् ढल्ब्य'स् क़ुएस्तिओन् अन्द् व्हत् फ़ोल्लोव्स् फ़ोर्म् ःइस्
    द्वर्फ़िश् फ़ोर्म् अन्द् अरे फ़ोल्लोवेद् ब्य् ओने वेर्से एअच् अबोउत् ःअयग्रिव, वोर्शिप्पिन्ग् थे ळोर्द्
    ओने चन् गेत् अल्ल् हिस् विशेस् फ़ुल्फ़िल्लेद्। ठे नेक्ष्त् स्तोत्रम्। ग़्रेअत् अचर्यस् लिके ष्रि Pअरसर
    Bहत्तर् अन्द् ष्रि Vएदन्त डेसिक हद् स्तोत्रम् अन्द् लेन्द्स् औथ्रित्य् तो इत्। डेवोतीस् मय्, थेरेफ़ोरे
    इन्च्लुदे दाल्भ्यः - कार्यारंभेषु सर्वेषु दुःस्वप्नेषु च सत्तम । अमाङ्गल्येषु दृष्टेषु यज्जप्तव्यं
    तदुच्यताम् ॥ १॥ येनारंभाश्च सिद्ध्यन्ति दुःस्वप्नश्चोपशाम्यति । अमङ्गलानां दृष्टानां परिहारश्च जायते
    ॥ २॥ श्री पुलस्त्यः:- जनार्दनं भूतपतिं जगद्गुरुं स्मरन् मनुष्यः सततं महामुने । दुष्टान्यशेषण्यपहन्ति
    साधयति अशेषकार्याणि च यान्यभीप्सति ॥ ३॥ शृणुष्व चान्यत् गदतो ममाखिलं वदामि यत् ते द्विजवर्य! मङ्गलम्
    । सर्वार्थसिद्धिं प्रददाति यत् सदा निहन्त्य्शेषाणि च पातकानि ॥ ४॥ प्रतिष्टितं यत्र जगच्चराचरं जगत्त्रये
    यो जगतश्च हेतुः । जगच्च पात्यत्ति च यः स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ५॥ व्योमाम्बुवाय्वग्निमहीस्वरूपैः
    विस्तारवान् योऽणुतरोऽणुभावात् । अस्थूलसूक्ष्मः सततं परेश्वरो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ६॥ यस्मात्
    परस्मात् पुरुषादनन्तात् अनादिमध्यादधिकं न किंचित् । स हेतुहेतुः परमेश्वरेश्वरः ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ ७॥ हिरण्यगर्भाच्युतरुद्ररूपी सृजत्यशेषं परिपाति हन्ति । गुणाग्रणीर्यो भगवान् स सर्वदा ममास्तु
    माङ्गल्यविवृद्धये हरिः ॥ ८॥ परः सुराणां परमोऽसुराणां परो यतीनां परमो मुनीनाम् । परः समस्तस्य च यः
    स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ९॥ ध्यातो मुनीनामपकल्मषैर्यो ददाति मुक्तिं परमेश्वरेश्वरः
    । मनोभिरामः पुरुषः स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ १०॥ सुरेन्द्रवैवस्वतवित्तपाम्बुपस्वरूपरूपी
    परिपाति यो जगत् । स शुद्धशुद्धः परमेश्वरेश्वरो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ११॥ यन्नामसङ्कीर्तनतो
    विमुच्यते ह्यनेकजन्मार्जितपापसञ्चयात् । पापेन्धनाग्निः स सदैव निर्मलो ममास्तु माङ्गल्यविवृद्धये हरिः
    ॥ १२॥ येनोद्धृतेयं धरणी रसातलात् अशेषसृष्टिस्थितिकारणादिकम् । बिभर्ति विश्वं जगतः स मूलं ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ १३॥ पादेषु वेदा जठरे चराचरं रोमस्वशेषा मुनयो मुखे मखाः । यस्येश्वरेशस्य स सर्वदा प्रभुः ममास्तु
    माङ्गल्यविवृद्धये हरिः ॥ १४॥ समस्त यज्ञाङ्गमयं वपुः प्रभोः यस्याङ्गमीशेश्वरसंस्तुतस्य । वराहरूपी भगवान्
    स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ १५॥ विक्षोभ्य सर्वोदधितोयसंभवं दधार धात्रीं जगतश्च यो भुवम्
    । यज्ञेश्वरो यज्ञपुमान् स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ १६॥ पातालमूलेश्वरभोगिसंहतो विन्यस्य
    पादौ पृतिवीं च बिभ्रतः । यस्योपमानं न बभूव सोऽच्युतो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ १७॥ सघर्घरं
    यस्य च बृंहितं मुहुः सनन्दनाद्यैर्जनलोकसंश्रितैः । श्रुतं जयेत्युक्तिपरैः स सर्वदा ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ १८॥ एकार्णवाद् यस्य महीयसौ महीं आदाय वेगेन खमुत्पतिष्यतः । नतं वपुर्योगिवरैः स सर्वदा ममास्तु
    माङ्गल्यविवृद्धये हरिः ॥ १९॥ हतो हिरण्याक्षमहासुरः पुरा पुराणपुंसा परमेण येन । वराहरूपः स पतिः प्रजापतिः
    ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २०॥ दंष्ट्राकरालं सुरभीतिनाशकं कृतं वपुर्दिव्यनृसिंहरूपिणा । त्रातुं
    जगत् येन स सर्वदा प्रभुः ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २१॥ दैत्येन्द्रवक्षःस्थलदारदारुणैः करेरुहैर्यः
    क्रकचानुकारिभिः । विच्छेद लोकस्य भयानि सोऽच्युतो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २२॥ दन्तान्तदीप्तद्युतिनिर्मलानि
    यः चकार सर्वाणि दिशां मुखानि । निनादवित्रासितदानवो ह्यसौ ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २३॥ यन्नामसंकीर्तनतो
    महाभयात् विमोक्षमाप्नोति न संशयं नरः । स सर्वलोकार्तिहरो नृकेसरी ममास्तु माङ्गल्यविवृद्धये हरिः ॥
    २४॥ सटाकरालभ्रमणानिलाहताः स्फुटन्ति यस्यांबुधराः समन्ततः । स दिव्यसिंहः स्फुरितानलेक्षणो ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ २५॥ यदीक्षणज्योतिषि रश्मिमण्डलं प्रलीनमीषन्न रराज भास्वतः । कुतः शशाङ्कस्य स दिव्यरूपधृक् ममास्तु
    माङ्गल्यविवृद्धये हरिः ॥ २६॥ अशेषदेवेशनरेश्वरेश्वरैः सदा स्तुतं यच्चरितं महाद्भुतम् । स सर्वलोकार्तिहरो
    महाहरिः ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २७॥ द्रवन्ति दैत्याः प्रणमन्ति देवताः नश्यन्ति रक्षांसि अपयान्ति
    चारयः । यत्कीर्तनात् सोऽद्भुतरूपकेसरी ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २८॥ ऋक्पावितं यो यजुषा हि श्रीमत्
    सामध्वनिध्वस्तसमस्तपातकम् । चक्रे जगत् वामनकः स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ २९॥ यत्पादविन्यासपवित्रतां
    मही ययौ वियच्चर्ग्यजुषामुदीरणात् । स वामनो दिव्यशरीररूपदृङ् ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३०॥ यस्मिन्
    प्रयातेऽसुरभूभृतोऽध्वरात् ननाम खेदादवनिः ससागरा । स वामनः सर्वजगन्मयः सदा ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ ३१॥ महाद्भुते दैत्यपतेर्महाध्वरे यस्मिन् प्रविष्टे क्षुभितं महासुरैः । स वामनोऽन्तस्थितसप्तलोकधृङ्
    ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३२॥ संघैः सुराणां दिवि भूतलस्थितैः तथा मनुष्यैर्गगने च खेचरैः । स्तुतः
    क्रमाद् यः प्रच्चार सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३३॥ क्रान्त्वा धरित्रीं गगनं तथा दिवं
    मरुत्पतेर्यः प्रददौ त्रिविष्टपम् । स देवदेवो भुवनेश्वरेश्वरो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३४॥
    अनुग्रहं चापि बलेरनुत्त्मं चकार यश्चेन्द्रपदोपमं क्षणात् । सुरांश्च यज्ञांशभुजः स सर्वदा ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ ३५॥ रसातलाद् येन पुरा समाहृताः समस्तवेदा जलचाररिरूपिणा । स कैटभारिमधुहाऽम्बुशायी ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ ३६॥ निःक्षत्रियं यश्च चकार मेदिनीं अनेकशो बाहुवनं तथाऽच्छिनत् । यः कार्तवीर्यस्य स भार्गवोत्तमो
    ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३७॥ निहत्य यो वालिनमुग्रविक्रमं निबद्ध्य सेतुं जलधौ दशाननम् । जघान
    चान्यान् रजनीचरान् असौ ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३८॥ चिक्षेप बालः शकटं, बभञ्ज यो यमार्जुनं,
    कंसमरिं जघान च । ममर्द चाणूरमुखान् स सर्वदा ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ३९॥ प्रातः सहस्रांशुमरीचिनिर्मलं
    करेण बिभ्रत् भगवान् सुदर्शनम् । कौमोदकी चापि गदामनन्तो ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ४०॥ हिमेन्दुकुन्दस्फटिकाभनिर्मलं
    मुखानिलापूरितमीश्वरेश्वरः । मध्याह्नकालेऽपि स शन्खमुद्वहन् ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ४१॥ तथापराह्णे
    प्रविकासि पङ्कजं वक्षस्थलेन श्रियमुद्वहन् हरिः । विस्तारिपद्मायतपत्रलोचनो ममास्तु माङ्गल्यविवृद्धये
    हरिः ॥ ४२॥ सर्वेषु कालेषु समस्तदेशेषु अशेषकार्येषु तथेश्वरेश्वरः । सर्वैः स्वरूपैर्भगवान् अनादिमान्
    ममास्तु माङ्गल्यविवृद्धये हरिः ॥ ४३॥ एतत् पठन् दाल्भ्य समस्तपापैः विमुच्यते विष्णुपरो मनुष्यः । सिद्ध्यन्ति
    कार्याणि तथाऽस्य सर्वान् अर्थानवाप्नोति यथेच्छते तान् ॥ ४४॥ दुःस्वप्नः प्रशममुपैति पठ्यमाने स्तोत्रेऽस्मिन्
    श्रवणविधौ सदोद्यतस्य । प्रारम्भो द्रुतमुपयाति सिद्धिमीशः पापानि क्षपयति चास्य देवदेवः ॥ ४५॥ माङ्गल्यं
    परमपदं सदाऽर्थसिद्धिं निर्विघ्नामधिकफलां श्रियं ददाति । किं लोके तदिह परत्र चापि पुंसां यद्विष्णुप्रवणधियां
    न दाल्भ्य! साध्यम् ॥ ४६॥ देवेन्द्रस्त्रिभुवनमर्थमेकपिंगः संसिद्धिं त्रिभुवनगां च कार्तवीर्यः । वैदेहः
    परमपदं प्रसाद्य विष्णुं संप्राप्ताः सकलफलप्रदो हि विष्णुः ॥ ४७॥ सर्वारम्भेषु दाल्भ्यैतद् दुःस्वप्नेषु
    च पण्डितः । जपेदेकमना विष्णौ तथाऽमङ्गल्यदर्शने ॥ ४८॥ शमं प्रयान्ति दुष्टानि ग्रहपीडाश्च दारुणाः ।
    कर्मारम्भाश्च सिद्ध्यन्ति पुण्यमाप्नोति चोत्तमम् ॥ ४९॥ हरिर्ददाति भद्राणि मङ्गल्यस्तुतिसंस्तुतः ।
    करोत्यखिलरूपैस्तु रक्षामक्षतशक्तिभृत् ॥ ५०॥ ॥ श्रीविष्णुधर्मोत्तरान्तर्गतः माङ्गल्यस्तवः संपूर्णः
    ॥
