id: sri-devi-khadgamala-stotram
category: stotram
name:
  english: Sri Devi Khadgamala Stotram
content:
  english: shri devi prarthana hrinkarasanagarbhitanalashikham sauh klim kalam bibhratim sauvarnambaradharinim
    varasudhadhautam trinetrojjvalam | vande pustakapashamankushadharam sragbhushitamujjvalam tvam gaurim
    tripuram paratparakalam shricakrasancarinim || asya shri shuddhashaktimalamahamantrasya upasthendriyadhishthayi
    varunaditya rishayah devi gayatri chandah satvika kakarabhattarakapithasthita kameshvarankanilaya
    mahakameshvari shri lalita bhattarika devata aim bijam klim shaktih sauh kilakam mama khadgasiddhyarthe
    sarvabhishtasiddhyarthe jape viniyogah mulamantrena shadanganyasam kuryat | dhyanam tadrisham khadgamapnoti
    yena hastasthitenavai | ashtadasha mahadvipa samrat bhokta bhavishyati || araktabham trinetramarunimavasanam
    ratnatatankaramyam hastambhojaissapashankusha madana dhanussayakairvisphurantim | apinottunga vakshoruha
    kalashaluthattara harojjvalangim dhyayedambhoruhastha mishvarimishvaranam || lamityadipanca pujam
    kuryat yathashakti mulamantram japet | lam prithivitattvatmikayai shri lalitatripurasundari parabhattarikayai
    gandham parikalpayami akashatattvatmikayai shri lalitatripurasundari parabhattarikayai pushpam parikalpayami
    vayutattvatmikayai shri lalitatripurasundari parabhattarikayai dhupam parikalpayami tejastattvatmikayai
    shri lalitatripurasundari parabhattarikayai dipam parikalpayami amritatattvatmikayai shri lalitatripurasundari
    parabhattarikayai amritanaivedyam parikalpayami sarvatattvatmikayai shri lalitatripurasundari parabhattarikayai
    tambuladisarvopacaran parikalpayami namah shri devi sambodhanam om aim hrim shrim aim klim sauh om
    namastripurasundari shricakra prathamavaranadevatah animasiddhe trailokyamohana cakrasvamini shricakra
    dvitiyavaranadevatah kamakarshini sarvashaparipuraka cakrasvamini shricakra tritiyavaranadevatah anangakusume
    sarvasankshobhanacakrasvamini shricakra caturthavaranadevatah sarvasankshobhini sarvadvandvakshayankari
    sarvasaubhagyadayaka cakrasvamini shricakra pancamavaranadevatah sarvasiddhiprade sarvarthasadhaka
    cakrasvamini shricakra shashtavaranadevatah sarvajne sarvaishvaryapradayini sarvarakshakaracakrasvamini
    shricakra saptamavaranadevatah vashini sarvarogaharacakrasvamini shricakra ashtamavaranadevatah banini
    sarvasiddhipradacakrasvamini shricakra navamavaranadevatah shri shri mahabhattarike sarvanandamayacakrasvamini
    navacakreshvari namani tripure namaskaranavaksharica mahamaheshvari mahamaha shricakranagarasamrajni
    namaste namaste namaste namah | phalashrutih esha vidya mahasiddhidayini smritimatratah | agnivatamahakshobhe
    rajarashtrasyaviplave || lunthane taskarabhaye sangrame salilaplave | samudrayanavikshobhe bhutapretadike
    bhaye || apasmarajvaravyadhimrityukshamadijebhaye | shakini putanayaksharakshahkushmandaje bhaye ||
    mitrabhede grahabhaye vyasaneshvabhicarike | anyeshvapi ca dosheshu malamantram smarennarah || tadrisham
    khadgamapnoti yena hastasthitenavai | ashtadashamahadvipasamradbhoktabhavishyati || sarvopadravanirmuktassakshacchivamayobhavet
    | apatkale nityapujam vistaratkartumarabhet || ekavaram japadhyanam sarvapujaphalam labhet | navavaranadevinam
    lalitaya mahaujanah || ekatra gananarupo vedavedangagocarah | sarvagamarahasyarthah smaranatpapanashini
    || lalitayamaheshanya mala vidya mahiyasi | naravashyam narendranam vashyam narivashankaram || animadigunaishvaryam
    ranjanam papabhanjanam | tattadavaranasthayi devatabrindamantrakam || malamantram param guhyam param
    dhama prakirtitam | shaktimala pancadhasyacchivamala ca tadrishi || tasmadgopyataradgopyam rahasyam
    bhuktimuktidam || || iti shri vamakeshvaratantre umamaheshvarasamvade devikhadgamalastotraratnam samaptam
    ||
  devanagari: श्री देवी प्रार्थन ह्रीङ्कारासनगर्भितानलशिखां सौः क्लीं कलां बिभ्रतीं सौवर्णाम्बरधारिणीं
    वरसुधाधौतां त्रिनेत्रोज्ज्वलाम् । वन्दे पुस्तकपाशमङ्कुशधरां स्रग्भूषितामुज्ज्वलां त्वां गौरीं त्रिपुरां
    परात्परकलां श्रीचक्रसञ्चारिणीम् ॥ अस्य श्री शुद्धशक्तिमालामहामन्त्रस्य उपस्थेन्द्रियाधिष्ठायी वरुणादित्य
    ऋषयः देवी गायत्री छन्दः सात्विक ककारभट्टारकपीठस्थित कामेश्वराङ्कनिलया महाकामेश्वरी श्री ललिता भट्टारिका
    देवता ऐं बीजं क्लीं शक्तिः सौः कीलकं मम खड्गसिद्ध्यर्थे सर्वाभीष्टसिद्ध्यर्थे जपे विनियोगः मूलमन्त्रेण
    षडङ्गन्यासं कुर्यात् । ध्यानम् तादृशं खड्गमाप्नोति येन हस्तस्थितेनवै । अष्टादश महाद्वीप सम्राट् भोक्ता
    भविष्यति ॥ आरक्ताभां त्रिणेत्रामरुणिमवसनां रत्नताटङ्करम्यां हस्ताम्भोजैस्सपाशाङ्कुश मदन धनुस्सायकैर्विस्फुरन्तीम्
    । आपीनोत्तुङ्ग वक्षोरुह कलशलुठत्तार हारोज्ज्वलाङ्गीं ध्यायेदम्भोरुहस्था मीश्वरीमीश्वराणाम् ॥ लमित्यादिपञ्च
    पूजां कुर्यात् यथाशक्ति मूलमन्त्रं जपेत् । लं पृथिवीतत्त्वात्मिकायै श्री ललितात्रिपुरसुन्दरी पराभट्टारिकायै
    गन्धं परिकल्पयामि आकाशतत्त्वात्मिकायै श्री ललितात्रिपुरसुन्दरी पराभट्टारिकायै पुष्पं परिकल्पयामि वायुतत्त्वात्मिकायै
    श्री ललितात्रिपुरसुन्दरी पराभट्टारिकायै धूपं परिकल्पयामि तेजस्तत्त्वात्मिकायै श्री ललितात्रिपुरसुन्दरी
    पराभट्टारिकायै दीपं परिकल्पयामि अमृततत्त्वात्मिकायै श्री ललितात्रिपुरसुन्दरी पराभट्टारिकायै अमृतनैवेद्यं
    परिकल्पयामि सर्वतत्त्वात्मिकायै श्री ललितात्रिपुरसुन्दरी पराभट्टारिकायै ताम्बूलादिसर्वोपचारान् परिकल्पयामि
    नमः श्री देवी सम्बोधनं ॐ ऐं ह्रीं श्रीं ऐं क्लीं सौः ॐ नमस्त्रिपुरसुन्दरी श्रीचक्र प्रथमावरणदेवताः
    अणिमासिद्धे त्रैलोक्यमोहन चक्रस्वामिनी श्रीचक्र द्वितीयावरणदेवताः कामाकर्षिणी सर्वाशापरिपूरक चक्रस्वामिनी
    श्रीचक्र तृतीयावरणदेवताः अनङ्गकुसुमे सर्वसङ्क्षोभणचक्रस्वामिनी श्रीचक्र चतुर्थावरणदेवताः सर्वसङ्क्षोभिणी
    सर्वद्वन्द्वक्षयङ्करी सर्वसौभाग्यदायक चक्रस्वामिनी श्रीचक्र पञ्चमावरणदेवताः सर्वसिद्धिप्रदे सर्वार्थसाधक
    चक्रस्वामिनी श्रीचक्र षष्टावरणदेवताः सर्वज्ञे सर्वैश्वर्यप्रदायिनी सर्वरक्षाकरचक्रस्वामिनी श्रीचक्र
    सप्तमावरणदेवताः वशिनी सर्वरोगहरचक्रस्वामिनी श्रीचक्र अष्टमावरणदेवताः बाणिनी सर्वसिद्धिप्रदचक्रस्वामिनी
    श्रीचक्र नवमावरणदेवताः श्री श्री महाभट्टारिके सर्वानन्दमयचक्रस्वामिनी नवचक्रेश्वरी नामानि त्रिपुरे
    नमस्कारनवाक्षरीच महामहेश्वरी महामहा श्रीचक्रनगरसाम्राज्ञी नमस्ते नमस्ते नमस्ते नमः । फलश्रुतिः एषा
    विद्या महासिद्धिदायिनी स्मृतिमात्रतः । अग्निवातमहाक्षोभे राजाराष्ट्रस्यविप्लवे ॥ लुण्ठने तस्करभये
    सङ्ग्रामे सलिलप्लवे । समुद्रयानविक्षोभे भूतप्रेतादिके भये ॥ अपस्मारज्वरव्याधिमृत्युक्षामादिजेभये ।
    शाकिनी पूतनायक्षरक्षःकूष्माण्डजे भये ॥ मित्रभेदे ग्रहभये व्यसनेष्वाभिचारिके । अन्येष्वपि च दोषेषु
    मालामन्त्रं स्मरेन्नरः ॥ तादृशं खड्गमाप्नोति येन हस्तस्थितेनवै । अष्टादशमहाद्वीपसम्राड्भोक्ताभविष्यति
    ॥ सर्वोपद्रवनिर्मुक्तस्साक्षाच्छिवमयोभवेत् । आपत्काले नित्यपूजां विस्तारात्कर्तुमारभेत् ॥ एकवारं जपध्यानं
    सर्वपूजाफलं लभेत् । नवावरणदेवीनां ललिताया महौजनः ॥ एकत्र गणनारूपो वेदवेदाङ्गगोचरः । सर्वागमरहस्यार्थः
    स्मरणात्पापनाशिनी ॥ ललितायामहेशान्या माला विद्या महीयसी । नरवश्यं नरेन्द्राणां वश्यं नारीवशङ्करम्
    ॥ अणिमादिगुणैश्वर्यं रञ्जनं पापभञ्जनम् । तत्तदावरणस्थायि देवताबृन्दमन्त्रकम् ॥ मालामन्त्रं परं गुह्यं
    परं धाम प्रकीर्तितम् । शक्तिमाला पञ्चधास्याच्छिवमाला च तादृशी ॥ तस्माद्गोप्यतराद्गोप्यं रहस्यं भुक्तिमुक्तिदम्
    ॥ ॥ इति श्री वामकेश्वरतन्त्रे उमामहेश्वरसंवादे देवीखड्गमालास्तोत्ररत्नं समाप्तम् ॥
