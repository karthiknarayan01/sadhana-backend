id: vedavyasaproktamhayagrivastotram
category: stotram
name:
  english: vedavyasaproktamhayagrivastotram
  devanagari: वेदव्यासप्रोक्तंहयग्रीवस्तोत्रम्
content:
  english: vedavyasaproktam hayagrivastotram sa adih sa madhyah sa cantah prajanam sa dhata sa dheyah
    sa karta sa karyam | yugante sa suptah susankshipya lokanyugadau prabuddho jagaddhyutsasarja || 89||
    tasmai namadhvam devaya nirgunaya gunatmane | ajaya vishvarupaya dhamne sarvadivaukasam || 90|| mahabhutadhipataye
    rudranam pataye tatha | adityapataye caiva vasunam pataye tatha || 91|| ashvibhyam pataye caiva marutam
    pataye tatha | vedayajnadhipataye vedangapataye'pi ca || 92|| samudravasine nityam haraye munjakeshine
    | shantaye sarvabhutanam mokshadharmanubhashine || 93|| tapasam tejasam caiva pataye yashaso'pi ca
    | vacashca pataye nityam saritam pataye tatha || 94|| kapardine varahaya ekasha
  devanagari: वेदव्यासप्रोक्तं हयग्रीवस्तोत्रम् स आदिः स मध्यः स चान्तः प्रजानां स धाता स धेयः स कर्ता
    स कार्यम् । युगान्ते स सुप्तः सुसङ्क्षिप्य लोकान्युगादौ प्रबुद्धो जगद्ध्युत्ससर्ज ॥ ८९॥ तस्मै नमध्वं
    देवाय निर्गुणाय गुणात्मने । अजाय विश्वरूपाय धाम्ने सर्वदिवौकसाम् ॥ ९०॥ महाभूताधिपतये रुद्राणां पतये
    तथा । आदित्यपतये चैव वसूनां पतये तथा ॥ ९१॥ अश्विभ्यां पतये चैव मरुतां पतये तथा । वेदयज्ञाधिपतये वेदाङ्गपतयेऽपि
    च ॥ ९२॥ समुद्रवासिने नित्यं हरये मुञ्जकेशिने । शान्तये सर्वभूतानां मोक्षधर्मानुभाषिणे ॥ ९३॥ तपसां
    तेजसां चैव पतये यशसोऽपि च । वाचश्च पतये नित्यं सरितां पतये तथा ॥ ९४॥ कपर्दिने वराहाय एकश
