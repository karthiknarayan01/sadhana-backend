id: ganeshastotramjajalirkritam
category: stotram
name:
  english: ganeshastotramjajalirkritam
  devanagari: गणेशस्तोत्रम्जाजलिर्कृतं
content:
  english: jajalirkritam shriganeshastotram || shriganeshaya namah || jajaliruvaca | namaste brahmanathaya
    ballaleshasvarupine | ballalavaradatre te ganeshaya namo namah || 110|| vighneshaya mahavighnanashanaya
    paratmane | bhaktanam bhaktanathayabhaktanam vighnakarine || 111|| paratparatarayaiva sagunaya caturbhuja
    | nirgunaya tayoryoge herambaya namo namah || 112|| vakratundaya devayaikadantaya mahodara | lambodaraya
    sarvesham matre pitre namo namah || 113|| svanandavasine tubhyam sada svanandabhogine | nanamayapracalaya
    mayikaya namo namah || 114|| siddhibuddhipate tubhyam siddhibuddhimayaya te | ameyashaktaye caiva
    shaktihinaya te namah || 115|| devaya danavayaiva devadanavamardine | sarvakaraya sarvebhyo hinaya
    te namo namah || 116|| yoganam yoganathaya shantinam shantirupine | brahmanam pataye tubhyam cintamane
    namo namah || 117|| kim staumi tvam ganadhyaksha yatra veda visismire | dhanyo'ham sarvabhavaih pashyami
    tvam yogarupinam || 118|| evamuktva ganeshanam nanama bhaktibhavatah | tamutthapya ganeshano jagada
    bhaktavatsalah || 119||
  devanagari: जाजलिर्कृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ जाजलिरुवाच । नमस्ते ब्रह्मनाथाय बल्लालेशस्वरूपिणे
    । बल्लालवरदात्रे ते गणेशाय नमो नमः ॥ ११०॥ विघ्नेशाय महाविघ्ननाशनाय परात्मने । भक्तानां भक्तनाथायाभक्तानां
    विघ्नकारिणे ॥ १११॥ परात्परतरायैव सगुणाय चतुर्भुज । निर्गुणाय तयोर्योगे हेरम्बाय नमो नमः ॥ ११२॥ वक्रतुण्डाय
    देवायैकदन्ताय महोदर । लम्बोदराय सर्वेषां मात्रे पित्रे नमो नमः ॥ ११३॥ स्वानन्दवासिने तुभ्यं सदा स्वानन्दभोगिने
    । नानामायाप्रचालाय मायिकाय नमो नमः ॥ ११४॥ सिद्धिबुद्धिपते तुभ्यं सिद्धिबुद्धिमयाय ते । अमेयशक्तये
    चैव शक्तिहीनाय ते नमः ॥ ११५॥ देवाय दानवायैव देवदानवमर्दिने । सर्वाकाराय सर्वेभ्यो हीनाय ते नमो नमः
    ॥ ११६॥ योगानां योगनाथाय शान्तीनां शान्तिरूपिणे । ब्रह्मणां पतये तुभ्यं चिन्तामणे नमो नमः ॥ ११७॥ किं
    स्तौमि त्वां गणाध्यक्ष यत्र वेदा विसिस्मिरे । धन्योऽहं सर्वभावैः पश्यामि त्वां योगरूपिणम् ॥ ११८॥ एवमुक्त्वा
    गणेशानं ननाम भक्तिभावतः । तमुत्थाप्य गणेशानो जगाद भक्तवत्सलः ॥ ११९॥
