id: radhopanishat
category: upanishad
name:
  english: radhopanishat
  devanagari: राधोपनिषत्
content:
  english: gokuladhye mathuramandale vrindavanamadhye sahasradalapadme shodashadalamadhye ashtadalakesare
    govindo'pi shyamapitambaro dvibhujo mayurapinchashirah venuvetrahasto nirgunah saguno nirakarah sakaro
    nirihah sa ceshtate virajata iti | parshve radhika ceti | tasya amsho lakshmidurgavijayadishaktiriti
    | pashcime sammukhe lalita | vayavye shyamala | uttarasmin shrimati | aishanyam haripriya | purvasmin
    vishala | agneyyam shraddha | yamyam padma | nairrityam bhadra | shodashadale agre candravati | tadvame
    citrarekha | tatparshve citrakara | tatparshve madanasundari | tatparshve shrimada | tatparshve shashirekha
    | tatparshve krishnapriya | tatparshve vrinda | tatparshve manohara | tatparshve yogananda | tatparshve
    parananda | tatparshve premananda | tatparshve satyananda | tatparshve candra | tatparshve kishorivallabha
    | tatparshve karunakushala iti | evam vividha gopyah krishnasevam kurvantiti | iti vedavacanam bhavati
    | iti vedavacanam bhavati | iti vedavacanam bhavati | manasapujaya japena dhyanena kirtanena stutya
    manasena sarvena nityasthalam prapnoti | nanyeneti | nanyeneti | nanyeneti || ityatharvanyam purushabodhanyam
    paramahamsyam prathamah prapathakah || dvitiyah prapathakah om sa'nuyukta
  devanagari: गोकुलाढ्ये माथुरमण्डले वृन्दावनमध्ये सहस्रदलपद्मे षोडशदलमध्ये अष्टदलकेसरे गोविन्दोऽपि श्यामपीताम्बरो
    द्विभुजो मयूरपिञ्छशिराः वेणुवेत्रहस्तो निर्गुणः सगुणो निराकारः साकारो निरीहः स चेष्टते विराजत इति
    । पार्श्वे राधिका चेति । तस्या अंशो लक्ष्मीदुर्गाविजयादिशक्तिरिति । पश्चिमे सम्मुखे ललिता । वायव्ये
    श्यामला । उत्तरस्मिन् श्रीमती । ऐशान्यां हरिप्रिया । पूर्वस्मिन् विशाला । अग्नेय्यां श्रद्धा । याम्यां
    पद्मा । नैरृत्यां भद्रा । षोडशदले अग्रे चन्द्रावती । तद्वामे चित्ररेखा । तत्पार्श्वे चित्रकरा । तत्पार्श्वे
    मदनसुन्दरी । तत्पार्श्वे श्रीमदा । तत्पार्श्वे शशिरेखा । तत्पार्श्वे कृष्णप्रिया । तत्पार्श्वे वृन्दा
    । तत्पार्श्वे मनोहरा । तत्पार्श्वे योगनन्दा । तत्पार्श्वे परानन्दा । तत्पार्श्वे प्रेमानन्दा । तत्पार्श्वे
    सत्यानन्दा । तत्पार्श्वे चन्द्रा । तत्पार्श्वे किशोरीवल्लभा । तत्पार्श्वे करुणाकुशला इति । एवं विविधा
    गोप्यः कृष्णसेवां कुर्वन्तीति । इति वेदवचनं भवति । इति वेदवचनं भवति । इति वेदवचनं भवति । मानसपूजया
    जपेन ध्यानेन कीर्तनेन स्तुत्या मानसेन सर्वेण नित्यस्थलं प्राप्नोति । नान्येनेति । नान्येनेति । नान्येनेति
    ॥ इत्याथर्वण्यां पुरुषबोधन्यां पारमहंस्यां प्रथमः प्रपाठकः ॥ द्वितीयः प्रपाठकः ॐ साऽनुयुक्ता
