id: kyts-jata-5-7-yo-vaa-ayathaa-devatam-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.7 Yo Vaa Ayathaa Devatam - Krishna Yajurveda Taittiriya Samhita
content:
  english: va ayathadevata mayathadevatam vai~ va ayathadevatam | ayathadevata magni magni mayathadevata
    mayathadevata magnim | cinuta a cinute cinuta a | bhyo vrishcyate vrishcyate devata vrishcyate papiya
    npapiyan vrishcyate vrishcyate papiyan | nbhavati bhavati papiya bhavati yo yo bhavati bhavati yah
    | yo~ yo yathadevatam | yathadevatamiti yatha a vrishcyate vrishcyata a vrishcyate | vrishcyate vasiyan
    vasiyan vrishcyate vrishcyate vasiyan | nbhavati bhavati vasiyan bhava tyagneyya ''gneyya bhavati
    bhava tyagneyya | agneyya gayatriya gayatriya ''gneyya ''gneyya gayatriya | gayatriya prathama ngayatriya
    gayatriya prathamam | citi mabhyabhi citi nmrishe dabhyabhi mrishet | njagatya jagatya dvitiya njagatya
    jagatya tritiya tritiya manushtubha 'nushtubha tritiya ntritiya manushtubha anushtubha caturthi ncaturthi
    manushtubha 'nushtubha caturthim | mpanktya panktya caturthi mpanktya panktya pancamim | yathadevata
    mevaiva yathadevatam yathadevatamiti yatha evagni magni mevai vagnim | ncinute cinute 'gni magni cinute
    na na cinute cinute na | a vrishcyate vrishcyata a vrishcyate | vrishcyate vasiyan vasiyan vrishcyate
    vrishcyate vasiyan | nbhavati bhavati vasiyan bhava tidaya idayai bhavati bhava tidayai | idayai vai
    va idaya idayai vai | va eshaisha vai va esha | rvibhakti reshaisha vibhaktih | vibhaktih pashavah
    pashavo vibhakti rvibhaktih pashavah | pashava ideda pashavah pashava ida ida pashubhih pashubhi rideda
    pashubhih | mpashubhih pashubhi renam | ncinute cinuta ena mena cinute yo yashcinute cinute yah |
    vai prajapataye prajapataye vai vai prajapataye | prajapataye pratiprocya pratiprocya prajapataye
    prajapataye pratiprocya | prajapataya iti praja pratipro cyagni magni mpratiprocya pratipro cyagnim
    | pratiprocyeti prati ncinoti cino tyagni magni cinoti na na cinoti cinoti na | arti ma ''rti marti
    ma | arccha tyriccha tyarcchati | riccha tyashva vashva vriccha tyriccha tyashvau ashva vabhito 'bhito
    'shva vashva vabhitah | ntishtheta mabhito 'bhita stishthetam | nkrishnah krishna stishtheta krishna
    uttarata uttaratah krishnah krishna uttaratah | shshveta uttarata uttarata shveto dakshino dakshina
    shshveto dakshinah | dakshina stau tau dakshino dakshina stau | ta valabhya labhya tau ta valabhya
    | ala bhyeshtaka ishtaka alabhya labhyeshtakah | ishtaka upo peshtaka ishtaka upa | ddaddhya dupopa
    daddhyat | vai prajapateh prajapate rvai vai prajapateh | prajapate rupagm rupa mprajapateh prajapate
    rupam | prajapateriti praja mprajapatyah prajapatyo rupagm rupa prajapatyo 'shvo 'shvah prajapatyah
    prajapatyo 'shvah | prajapatya iti praja thsaksha dashvo 'shvah sakshat | saksha devaiva saksha eva
    prajapataye prajapataya evaiva prajapataye | prajapataye pratiprocya pratiprocya prajapataye prajapataye
    pratiprocya | prajapataya iti praja pratiprocyagni magni mpratiprocya pratiprocyagnim | pratiprocyeti
    prati ncinoti cino tyagni magni cinoti na na cinoti cinoti na | arti ma ''rti marti ma | arccha tyriccha
    tyarcchati | riccha tyeta deta driccha tyriccha tyetat | va ahno 'hno vai va ahnah | ahno rupagm rupa
    mahno 'hno rupam | shveto 'shvo 'shvah shveta ashvo ratriyai ratriya ashvo 'shvo ratriyai | ratriyai
    krishnah krishno ratriyai ratriyai krishnah | tkrishnah krishna etat | eta dahno 'hna eta deta dahnah
    | ahno rupagm rupa mahno 'hno rupam | || yadishtaka ishtaka ya ishtaka ratriyai ratriya ishtaka ishtaka
    ratriyai | mpurishagm ratriyai ratriyai purisham | purisha mishtaka ishtakah purisha mpurisha mishtakah
    | nnishtaka ishtaka upadhasyann | upadhasyannityupa shveta mashva mashvagg shvetagg ashva mabhya bhyashva
    mashva mabhi | nmrishe dabhyabhi mrishet | mpurisha mupadhasyann | nnupadhasyan krishnam | upadhasyannityupa
    krishna mahoratrabhya mahoratrabhya nkrishna mahoratrabhya ahoratrabhya mevai vahoratrabhya mahoratrabhya
    meva | ahoratrabhyamityahah evaina mena mevai vaina ncinute cinuta ena mena cinute hiranyapatragm
    hiranyapatra ncinute cinute hiranyapatram | hiranyapatragm hiranyapatra hiranyapatramiti hiranya ndadati
    dadati purna dadati madhavyo madhavyo dadati dadati madhavyah | madhavyo 'sa nyasani madhavyo madhavyo
    'sani | asani titya sa nya saniti | iti saurya saurye titi saurya | saurya citravatya citravatya saurya
    saurya citravatya | citravatya 'vava citravatya citravatya 'va | citravatyeti citra kshata ikshate
    citram | citra mevaiva citra eva bhavati bhava tyevaiva bhavati | bhavati maddhyandine maddhyandine
    bhavati bhavati maddhyandine | maddhyandine 'shva mashva mmaddhyandine maddhyandine 'shva ashva mava
    vashva mashva mava | ava ghrapayati ghrapaya tyavava ghrapayati | ghrapaya tyasa vasau ghrapayati
    ghrapaya tyasau | asau vai va asa vasau vai | va aditya adityo vai va adityah | aditya indra indra
    aditya aditya indrah | indra esha esha indra indra eshah | esha prajapatih prajapati resha esha prajapatih
    | prajapatih prajapatyah prajapatyah prajapatih prajapatih prajapatyah | prajapatiriti praja prajapatyo
    'shvo 'shvah prajapatyah prajapatyo 'shvah | prajapatya iti praja nta mashvo 'shva stam | thsaksha
    devaiva sakshat | saksha driddhno tyriddhnoti saksha thsaksha driddhnoti | riddhnotityriddhnoti |
    || tva magne 'gne tva vri~shabha magne 'gne vrishabham | mpunah puna shcekitana asthuri no no 'sthuryasthuri
    nah | hapatyani no no gar hapatyani santu santu gar santu tigmena tigmena santu santu tigmena | tigmena
    no na stigmena tigmena nah | no brahmana brahmana no no brahmana | mbrahmana brahmana sam | sagm shishadhi
    shishadhi sagm sagm shishadhi | shishadhiti shishadhi | pashavo vai vai pashavah pashavo vai | va
    eta ete vai va ete | yadishtaka ishtaka ya ncitya mishtaka ishtaka shcitya ncitya mrishabha mrishabha
    ncityamiti cityam upa dadhati dadha tyupopa dadhati | ndadhati dadhati mithunam | mithuna mevaiva
    mithuna ttada syasya tat | yajne karoti karoti yajne yajne karoti | karoti prajananaya prajananaya
    karoti karoti prajananaya | tprajananaya prajananaya tasma dyutheyuthe yutheyuthe tasma yutheyutha
    rishabha rishabho yutheyuthe yutheyutha rishabhah | yutheyutha iti yuthe va~thsarasya pratima va~thsarasya
    pratimam | pratimamiti prati tva ratri ratri tva tva ratri | ratryupasata upasate ratri ratryupasate
    | prajagm suviragm suvira nkritva kritva suviragm suvira nkritva kritva vishva ashnavadityashnavat
    | prajapatya meta meta mprajapatya metam | prajapatyamiti praja eta mupo paita meta mupa | upa dadhati
    dadha tyupopa dadhati | ndadhati dadha tiyam | vavaishaisha vava vavaisha | shtakaya mekashtakaya
    mevaivai ka ekashtakaya manna manna mekashtakaya mekashtakaya manna ekashtakayamityeka kriyate 'nna
    manna evai tayai tayai vaivai taya etaya 'vavai tayai taya 'va | ava rundhe rundhe 'vava rundhe |
    rundha eshaisha rundhe rundha esha | esha vai va eshaisha vai | vai prajapateh prajapate rvai vai
    prajapateh | prajapateh kamadugha kamadugha prajapateh prajapateh kamadugha prajapateriti praja kamadugha
    taya taya kamadugha kamadugha taya tayai vaiva taya tayaiva | eva yajamano yajamana evaiva yajamanah
    | yajamano yajamano 'mushminn | amushmin ~loke loke 'mushmi nnamushmin ~loke | 'gni magnim ~loke loke
    nduhe duhe 'gni magni duhe yena yena duhe duhe yena | yena deva deva yena yena devah | deva jyotisha
    jyotisha deva deva jyotisha | jyoti shordhva urdhva jyotisha jyoti shordhvah | nnurdhva urdhva udayann
    | yenaditya aditya yena yenadityah | aditya vasavo vasava aditya aditya vasavah | vasavo yena yena
    vasavo vasavo yena | yena rudra rudra yena yena rudrah | rudra iti rudrah | yenangiraso 'ngiraso yena
    yenangirasah | mmahimana mangiraso 'ngiraso mahimana mahimana manashu ranashu mmahimana manashuh |
    anashu stena tena nashu ranashu stena | tvetu tena tenaitu | etu yajamano yajamana etvetu yajamanah
    | ssvasti svasti yajamano yajamana svastiti svasti | suvargaya vai vai suvargaya suvargaya vai | va
    esha esha vai va eshah | esha lokaya lokayaisha esha lokaya | lokaya ciyate ciyate lokaya lokaya ciyate
    | || dyac ciyate ciyate yat | ryena yenagni ragni yena deva deva yena yena devah | deva jyotisha jyotisha
    deva deva jyotisha | jyoti shordhva urdhva jyotisha jyoti shordhvah | nnurdhva urdhva udayann | ityukhya
    mukhya miti tyukhya ukhyagm sagm sa mukhya mukhyagm sam | sa mindha indhe sagm sa mindhe | indha ishtaka
    ishtaka indha indha ishtakah | ishtaka evaiveshtaka ishtaka eva | evaita eta evai vaitah | eta upopaita
    eta upa | upa dhatte dhatta upopa dhatte | dhatte vanaspatya vanaspatya dhatte dhatte vanaspatyah
    | ssuvargasya suvargasya vanaspatya vanaspatya suvargasya lokasya lokasya suvargasya suvargasya lokasya
    | suvargasyeti suvah lokasya samashtyai samashtyai lokasya lokasya samashtyai | samashtyai shatayudhaya
    shatayudhaya samashtyai samashtyai shatayudhaya | ryaya shatayudhaya shatayudhaya shatavi ryaya shatotaye
    shatotaye shatavi shatotaye 'bhimatishahe 'bhimatishahe shatotaye shatotaye 'bhimatishahe abhimatishaha
    ityabhimati yo no no yo yo nah | shsharadah sharado no na sharado ajita najita ncharadah sharado ajitan
    | ajita nindra indro ajita najita nindrah | nnesha dindra indro neshat | ati duritani durita nyatyati
    duritani | duritani vishva vishva duritani duritani vishva ye catvara shcatvaro ye ye catvarah | catvarah
    pathayah pathaya shcatvara shcatvarah pathayah | pathayo devayana devayanah pathayah pathayo devayanah
    devayana antara 'ntara devayana devayana antara | antara dyavaprithivi dyavaprithivi antara 'ntara
    dyavaprithivi | dyavaprithivi viyanti viyanti dyavaprithivi dyavaprithivi viyanti | dyavaprithivi
    iti dyava yo ajyani majyanim ajyani majiti majiti majyani majyani majitim | ajiti mavaha davaha dajiti
    majiti mavaha ttasmai tasma avaha davaha tasmai no na stasmai tasmai nah | no deva deva no no devah
    | devah pari pari deva devah pari | || pari datta datta pari pari datta | datte heha datta datteha
    | iha sarve sarva ihe ha sarve grishmo hemanto hemanto grishmo grishmo hemantah | hemanta utota hemanto
    hemanta uta | uta no na utota nah | no vasanto vasanto no no vasantah | ssuvitagm suvitam no astvastu
    no no astu | tesha mrituna mrituna ritunagm shatasharadanagm shatasharadana mrituna mritunagm shatasharadanam
    | nnivate nivate shatasharadanagm shatasharadana shatasharadanamiti shata nnivate nivata esham | esha
    mabhaye 'bhaya esha mesha mabhaye | abhaye syama syama bhaye 'bhaye syama | iduvathsaraya parivathsaraya
    parivathsaraye duvathsaraye duvathsaraya parivathsaraya | iduvathsarayetidu va~thsaraya parivathsaraya
    parivathsaraya sam parivathsarayeti pari va~thsaraya krinuta krinuta sam tkrinuta krinuta brihat |
    vayagm sumatau sumatau vayam sumatau yajniyanam ya~jniyanagm sumatau sumatau yajniyanam | njyog jyog
    yajniyanam jyogajita ajita jyog jyogajitah | ajita ahata ahata ajita ajita ahatah | ssyama syama hata
    ahata sa manaishta naishta sagm sa manaishta | anaishta deva deva anaishta naishta devah | deva stvaya
    tvaya deva deva stvaya tvaya 'vasena vasena tvaya tvaya 'vasena | avasena sagm sa mavasena vasena
    sam | sa mashimahya shimahi sagm sa mashimahi | ashimahi tva tva 'shimahya shimahi tva | mayobhuh
    pito pito mayobhu pito a pito pito a | pito iti pito | || a vishasva vishasva vishasva | vi~shasva
    vishasva sham | ntokaya tokaya shagm sha tokaya tanuve tanuve tokaya tokaya tanuve ssyona stanuve
    tanuve syona iti syonah | ajyani reta eta ajyani rajyani retah | eta upopaita eta upa | upa dadhati
    dadha tyupopa dadhati | dadha tyeta eta dadhati dadha tyetah | eta vai va eta eta vai | vai devata
    devata vai vai devatah devata aparajita aparajita devata devata aparajitah | aparajita sta sta aparajita
    aparajita stah | ta evaiva ta sta eva | eva pra praivaiva pra | pra vishati vishati pra pra vishati
    | vishati na na vishati vishati na | eva jiyate jiyata evaiva jiyate | jiyate brahmavadino brahmavadino
    jiyate jiyate brahmavadinah | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina
    iti brahma dvadanti vadanti yat | yadardhamasa ardhamasa ya ardhamasa masa masa ardhamasa ardhamasa
    masah ardhamasa ityardha masa ritava ritavo masa masa ritavah | va~thsara ritava ritavah sam va~thsara
    oshadhi roshadhi oshadhih pacanti paca ntyoshadhi roshadhih pacanti | ntyathatha pacanti paca tkasma
    dathatha kasma kasma danyabhyo 'nyabhyah kasma tkasma danyabhyah | bhyo 'nyabhyo 'nyabhyo devata nirupyata
    upyate ni upyata iti tyupyata upyata iti | ityeta eta itityetah | eta hi hyeta eta hi | ddevata devata
    sta ndevata devata udajayann | yadritubhya ritubhyo ya nnirvape dritubhya ritubhyo nirvape daddhya
    dagrayana ma ddaddhya dagrayanam | nnirupya nirupya nirupyaita eta nirupya nirupyaitah | eta ahuti
    rahuti reta eta ahutih | rjuhoti juho tyahuti rahuti juho tyardhamasa nardhamasani juhoti juho tyardhamasani
    | ardhamasa nevaiva rdhamasa nardhamasa neva | ardhamasanityardha nmasa nevaiva masan | mprinati prinati
    sam prinati na na prinati prinati na | ndadhati dadhati samadagm samada ddadhati dadhati bhadrat |
    sa manaishta naishta sagm sa manaishta | anaishta deva deva anaishta naishta devah | deva ititi deva
    deva iti | ityahahe tityaha | aha hutadyaya hutadya yahaha hutadyaya | hutadyaya yajamanasya yajamanasya
    hutadyaya hutadyaya yajamanasya | yajamanasya parabhavaya parabhavaya yajamanasya yajamanasya parabhavaya
    | indrasya vajro vajra indra syendrasya vajrah | 'syasi vajro vajro 'si | asi vartraghno vartraghno
    'syasi vartraghnah | vartraghna stanupa stanupa vartraghno vartraghna stanupah | vartraghna iti vartra
    tanupa no na stanupa stanupa nah | nah pratispashah pratispasho no nah pratispashah | pratispasha
    iti prati yo no no yo yo nah | ddakshinato dakshinatah purasta ddakshinato dakshinatah pashcat | pashca
    duttarata uttaratah pashca tpashca duttaratah | uttarato 'ghayu raghayu ruttarata uttarato 'ghayuh
    | aghayu rabhidasa tyabhidasa tyaghayu raghayu rabhidasati | abhidasa tyeta meta mabhidasa tyabhidasa
    tyetam | etagm sa sa eta metagm sah | so 'shmana mashmanagm sa so 'shmanam | ashmana mriccha tvriccha
    tvashmana mashmana mricchatu | ricchatvityricchatu | ya~tta devasura devasura devasura iti deva te
    'sura asura ste te 'surah | asura digbhyo digbhyo 'sura asura digbhyah | digbhya a digbhyo digbhya
    a | a 'badhanta badhanta 'badhanta | sta nabadhanta badhanta tan | ndeva deva stag deva ishveshva
    deva deva ishva ishva ca ceshveshva ca | ca vajrena vajrena ca ca vajrena | vajrena ca ca vajrena
    vajrena ca | apa nudanta nudanta papa nudanta | dyadanudanta nudanta yat | tyupadadhati vajrini rvajrini
    rupadadhati | upadadha tishve shvopadadha ishva ca ceshveshva ca | dvajrena vajrena ta vajrena ca
    ca vajrena vajrena ca | ca yajamano yajamanashca ca yajamanah | yajamano bhratrivya yajamano yajamano
    bhratrivyan | bhratrivya napapa bhratrivya nbhratrivya napa | apa nudate nudate 'papa nudate | nudate
    dikshu dikshu nudate nudate dikshu | dikshu popa dikshu dikshupa | upa dadhati dadha tyupopa dadhati
    | || dadhati devapura devapura dadhati dadhati devapurah | devapura evaiva devapura devapura eva |
    evaita eta evai vaitah | stanupani reta eta stanupanih tanupanih pari pari tanupani paryuhata uhate
    pari paryuhate | uhate 'gnavishnu agnavishnu uhata uhate 'gnavishnu | agnavishnu sajoshasa sajoshasa
    'gnavishnu agnavishnu sajoshasa | agnavishnu ityagna ssajoshasa sajosha semah | ntvima ima vardhantu
    | va~rdhantu vardhantu vam | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina
    iti brahma dvadanti vadanti yat | na devatayai devatayai na na devatayai | devatayai juhvati juhvati
    devatayai devatayai juhvati | juhva tyathatha juhvati juhva tyatha | atha kindevatya kindevatya 'thatha
    kindevatya kindevatya vaso kindevatya kindevatya vasoh kindevatyeti kim dharetiti dhara dhareti |
    ityagni ragni riti tyagnih | rvasu ragni ragni vasu stasya tasya vasu tasyai shaisha tasya tasyaisha
    | esha dhara dharai shaisha dhara rdhara dhara vishnuh | vasu stasya tasya vasu tasyai shaisha tasya
    tasyaisha | esha dhara dharai shaisha dhara ''gnavaishnavya ''gnavaishnavya dhara dhara agnavaishnavya
    rcarca ''gnavaishnavya ''gnavaishnavya rca | agnavaishnavyetya njuhoti juhoti dhara juhoti bhagadheyena
    bhagadheyena juhoti juhoti bhagadheyena | bhagadheye naivaiva bhagadheyena bhagadheyenaiva | evaina
    vena vevai vainau enau sagm sa mena venau sam | sa mardhaya tyardhayati sagm sa mardhayati | ardhaya
    tyatho atho ardhaya tyardhaya tyatho atho eta meta matho atho etam | eta mevai vaita meta meva | ||
    eva huti mahuti mevai vahutim | ahuti mayatanavati mayatanavati mahuti mahuti mayatanavatim | nkaroti
    karo tyayatanavati mayatanavati ayatanavatimityayatana karoti yatkamo yatkamah karoti karoti yatkamah
    | ya~tkamo yatkama enam | njuhoti juho tyena mena ttaj juhoti juhoti tat | ava rundhe rundhe 'vava
    rundhe | rundhe rudro rudro rundhe rundhe rudrah | rudro vai vai rudro rudro vai | va esha esha vai
    va eshah | agni stasya tasyagni ragni stasya | tasyaite ete tasya tasyaite | ete tanuvau tanuva vete
    ete tanuvau tanuvau ghora ghora tanuvau tanuvau ghora | ghora 'nya 'nya ghora ghora 'nya | anya shiva
    shiva 'nya 'nya shiva | shiva 'nya 'nya shiva shiva 'nya | dyadanya 'nya yat | yac chatarudriyagm
    shatarudriyam njuhoti juhoti shatarudriyagm shatarudriya shatarudriyamiti shata juhoti ya ya juhoti
    juhoti ya | asya ghora ghora 'sya rghora ghora tanuh | ntanu stanu stam | tena shamayati shamayati
    tena tena shamayati | dyac chamayati shamayati yat | njuhoti juhoti dhara juhoti ya ya juhoti juhoti
    ya | asya shiva shiva 'sya shshiva shiva tanuh | ntanu stanu stam | tena prinati prinati tena tena
    prinati | prinati yo yah prinati prinati yah | rdharayai dharayai vaso ndharayai dharayai pratishtham
    | || ve~da veda pratishtha pratishthamiti prati veda prati prati veda veda prati | pratye vaiva prati
    pratyeva | eva tishthati tishthatye vaiva tishthati | ttishthati tishthati yat | ajya mucchishye tocchishye
    tajya majya mucchishyeta | ucchishyeta tasmigg stasmi nnucchishye tocchishyeta tasminn | ucchishyetetyut
    ntasmigg stasmi brahmaudanamiti brahma brahmana shcatvara shcatvaro hmana shcatvarah | catvarah pra
    pra catvara shcatvarah pra | prashniyu rashniyuh pra prashniyuh | ashniyu resha esho 'shniyu rashniyu
    reshah | esha vai va esha esha vai | brahmana eshaisha bra esha khalu khalve shaisha khalu | khalu
    vai vai khalu khalu vai | agneh priya priya 'gne ragneh priya | priya tanu stanuh priya priya tanuh
    | vaishvanarah priyaya priyaya mevaiva priyaya evaina mena mevai vaina mprati prati tanuva prati shthapayati
    sthapayati prati prati shthapayati | sthapayati catasra shcatasra ssthapayati sthapayati catasrah
    | rdhenu shcatasra shcatasro dhenuh | tabhi revaiva tabhi stabhi reva | eva yajamano yajamana evaiva
    yajamanah | yajamano yajamano 'mushminn | amushmin ~loke loke 'mushmi nnamushmin ~loke | 'gni magnim
    ~loke loke nduhe duhe 'gni magni njuhomi juhomi citti juhomi manasa manasa juhomi juhomi manasa |
    manasa ghritena ghritena manasa manasa ghritena | ghritenetiti ghritena ghriteneti | itya hahe tityaha
    | bhya vai va adabhya 'da vai nama nama vai vai nama | namai shaisha nama namaisha | esha ''huti rahuti
    reshaisha ''hutih | shvakarma nyahuti rahuti vaishvakarmani na na vai vaishvakarmaniti vaishva ncikyana
