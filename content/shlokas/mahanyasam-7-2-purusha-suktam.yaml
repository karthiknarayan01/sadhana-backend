id: mahanyasam-7-2-purusha-suktam
category: stotram
name:
  english: Mahanyasam - 7.2. Purusha Suktam
content:
  english: sha purushah | sahasraksha ssahasrapat | sa bhumim vi~shvato vritva | atyatishtha ddashangulam
    | purusha evedagm sarva m | utamritatvasyeshanah | yadannena tirohati | etavanasya mahima | ato jyayagshca
    purushah || 'sya vishva bhutani | tripadasya ndivi | tripadurdhva udai tpunah | tato vishvam vya~kramat
    | sashananashane abhi || tasma dviradajayata | virajo adhi purushah | sa jato atyaricyata | pashca
    | deva yajnamatanvata | vasanto asyasidajya m | grishma iddhma shsharaddhavih | saptasyasa ssapta
    samidhah kritah | devaya ntanvanah | abadhna hishi praukshann | purusha tena deva ayajanta | saddhya
    rishayashca ye | tasma thsarvahutah | sambhrita mprishadajyam | pashug shcakre vayavyan | aranya ngramyashca
    ye | tasma ssamani jajnire | chandagmsi jajnire tasma tasmadashva ajayanta | ye ke cobhayadatah |
    gavo ha jajnire tasma jjata ajavayah | yatpurusham vya~dadhuh | katidha vyakalpayann | mukha nkimasya
    kau bahu | kavuru padavucyete | brahmano 'sya mukhamasit | bahu rajanyah kritah || dvaishyah | padbhyagm
    shudro ajayata | candrama manaso jatah | caksho ssuryo ajayata | mukha dindrashcagnishca | prana dvayurajayata
    | nabhya asidantariksham | shir ssamavartata | padbhya t | tatha lokagm akalpayann || ntamasastu pare
    | sarvani rupani vicitya dhirah | namani kritvabhivadan yadaste dyamudajahara | shakrah pravidva npradishashcatasrah
    | tamevam vi~dvanamrita iha bhavati | nanyah pantha ayanaya vidyate | yajnena yajnamayajanta devah
    | tani dharmani prathamanyasann | te ha naka ssacante | yatra purve saddhya nnamo bhagavate rudraya
    || purushasuktagm shirase svaha ||
  devanagari: षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठ द्दशाङ्गु॒लम्
    । पुरु॑ष ए॒वेदग्ं सर्व म् । उ॒तामृ॑त॒त्वस्येशा॑नः । यदन्ने॑ना ति॒रोह॑ति । ए॒तावा॑नस्य महि॒मा । अतो॒
    ज्यायाग्॑श्च॒ पूरु॑षः ॥ ऽस्य॒ विश्वा॑ भू॒तानि॑ । त्रि॒पाद॑स्या॒ न्दि॒वि । त्रि॒पादू॒र्ध्व उदै॒ त्पुनः॑
    । ततो॒ विष्वं॒ व्यँ॑क्रामत् । सा॒श॒ना॒न॒श॒ने अ॒भि ॥ तस्मा द्वि॒राड॑जायत । वि॒राजो॒ अधि॒ पूरु॑षः ।
    स जा॒तो अत्य॑रिच्यत । प॒श्चा । दे॒वा य॒ज्ञमत॑न्वत । व॒स॒न्तो अ॑स्यासी॒दाज्य म् । ग्री॒ष्म इ॒द्ध्म
    श्श॒रद्ध॒विः । स॒प्तास्या॑स स्स॒प्त स॒मिधः॑ कृ॒ताः । दे॒वाय न्त॑न्वा॒नाः । अब॑ध्न॒ हिषि॒ प्रौक्षन्न्॑
    । पुरु॑ष तेन॑ दे॒वा अय॑जन्त । सा॒द्ध्या ऋष॑यश्च॒ ये । तस्मा थ्स॑र्व॒हुतः॑ । सम्भृ॑त म्पृषदा॒ज्यम्
    । प॒शूग् श्च॑क्रे वाय॒व्यान्॑ । आ॒र॒ण्या न्ग्रा॒म्याश्च॒ ये । तस्मा स्सामा॑नि जज्ञिरे । छन्दाग्ं॑सि
    जज्ञिरे॒ तस्मा तस्मा॒दश्वा॑ अजायन्त । ये के चो॑भ॒याद॑तः । गावो॑ ह जज्ञिरे॒ तस्मा ज्जा॒ता अ॑जा॒वयः॑
    । यत्पुरु॑षं॒ व्यँ॑दधुः । क॒ति॒धा व्य॑कल्पयन्न् । मुख॒ ङ्किम॑स्य॒ कौ बा॒हू । कावू॒रू पादा॑वुच्येते
    । ब्रा॒ह्म॒णो ऽस्य॒ मुख॑मासीत् । बा॒हू रा॑ज॒न्यः॑ कृ॒तः ॥ द्वैश्यः॑ । प॒द्भ्याग्ं शू॒द्रो अ॑जायत ।
    च॒न्द्रमा॒ मन॑सो जा॒तः । चक्षो॒ स्सूर्यो॑ अजायत । मुखा॒ दिन्द्र॑श्चा॒ग्निश्च॑ । प्रा॒णा द्वा॒युर॑जायत
    । नाभ्या॑ आसीद॒न्तरि॑क्षम् । शी॒र् स्सम॑वर्तत । प॒द्भ्या त् । तथा॑ लो॒काग्ं अ॑कल्पयन्न् ॥ न्तम॑स॒स्तु
    पा॒रे । सर्वा॑णि रू॒पाणि॑ वि॒चित्य॒ धीरः॑ । नामा॑नि कृ॒त्वाभि॒वद॒न् यदास्ते द्यमु॑दाज॒हार॑ । श॒क्रः
    प्रवि॒द्वा न्प्र॒दिश॒श्चत॑स्रः । तमे॒वं विँ॒द्वान॒मृत॑ इ॒ह भ॑वति । नान्यः पन्था॒ अय॑नाय विद्यते ।
    य॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वाः । तानि॒ धर्मा॑णि प्रथ॒मान्या॑सन्न् । ते ह॒ नाक॑ स्सचन्ते । यत्र॒ पूर्वे॑
    सा॒द्ध्या न्नमो भगवते॑ रुद्रा॒य ॥ पुरुषसूक्तग्ं शिरसे स्वाहा ॥
