id: nandibhillakritamkrishnanarayanastotram
category: stotram
name:
  english: nandibhillakritamkrishnanarayanastotram
  devanagari: नन्दिभिल्लकृतंकृष्णनारायणस्तोत्रम्
content:
  english: nandibhillakritam krishnanarayanastotram nandibhilla uvaca | namo namaste nijarakshakaya namo
    namaste'nyavinashakaya | namo namaste shivasangrahaya kaladhinathaya namo namaste || 47|| namo namaste
    bahumohanaya namo'tigarvishthasushasakaya | namo hridisthaya pareshvaraya ca'nadinarayana te namo'stu
    || 48|| namo'kshareshaya paravaraya namo namaste'khilakaranaya | namah samastangajatattvagarbhaprapurakayacyuta
    te namo'stu || 49|| namo'vatarinnavataradhartre hyanantamukta'bhinishevitaya | anadikrishnaya pareshvaraya
    narayanayeti namo'stu tubhyam || 50|| shrikantarupaya rameshvaraya radhadhinathaya namo namaste |
    namo'stu te shripurapalakaya bhumannamaste laliteshvaraya || 51|| sarveshvarishaya samastasarveshvareshvareshaya
    namo'stu tubhyam | vairajanathaya jaganniyantre mayeshvaraya'cyuta te namo'stu || 52|| pitrirshidevarshisharirakaya
    caracarantahstha ca te namo'stu | shrimanikipashavatishcaraya prashadhinathaya namo'stu tubhyama ||
    53|| brahmapriyavamanivasakaya haripriyadyabhirabhishtutaya | kritasthali kunkumavapikaya gopalabalaya
    namo namaste || 54|| shrikambharamatribhavaya krishnanarayanashrisha ca te namo'stu | sadhusvarupaya
    makhatmakaya svaminnamaste ranaranjanaya || 55|| janmasthitibhramshakaraya vishno jishno namaste parameshvaraya
    | sadbhaktalabhyaya kripavashaya shaktaya kalaya namo bhavaya || 56|| rudraya banaya rathaya shastre
    yamaya dharmaya namo dvijaya | pranaya jivaya tadatmane te'nvitaya riktaya namo'vyayaya || 57|| nagasvarupaya
    madantakaya hridyaya nirvanakaraya dhatre | shighram sharanyam tvamabhiprapadya nayaksharam mokshapadam
    hare mam || 58|| kritaparadham bahugarvadribdham parashriyam vikshya sada jvalantam | rane sthitam
    pranagatim tyajantam kshamapya sarvam naya mokshanam te || 59|| sarvajna sarvesha samastacakshuh samastakarna'tmamanassu
    samstha | divyam nijam darshanamatra dehi mritansamasta~shca samuddhara'tra || 60|| hare'gniratena
    vibodhitena mayapi garvadavamanitastvam | atoshadavanalamadhyamaptam samuddhara shrisha vidhehi divyam
    || 61|| svargam yatha va narakam madartham yadasti tatte'rpitamatra krishna | prapannajivam paralokayanam
    naya'ksharam dhama vinashya papam || 62|| hare krishna hare vishno krishnanarayana prabho | tavasmiti
    tavasmiti moksham mam naya madhava || 63|| ityuktva maunamadaya kritanjalirhridantare | vivesha nandibhillo
    vai smaran dhyayan prabhum patim || 64|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya
    caturthakhande 85
  devanagari: नन्दिभिल्लकृतं कृष्णनारायणस्तोत्रम् नन्दिभिल्ल उवाच । नमो नमस्ते निजरक्षकाय नमो नमस्तेऽन्यविनाशकाय
    । नमो नमस्ते शिवसङ्ग्रहाय कलाधिनाथाय नमो नमस्ते ॥ ४७॥ नमो नमस्ते बहुमोहनाय नमोऽतिगर्विष्ठसुशासकाय
    । नमो हृदिस्थाय परेश्वराय चाऽनादिनारायण ते नमोऽस्तु ॥ ४८॥ नमोऽक्षरेशाय परावराय नमो नमस्तेऽखिलकारणाय
    । नमः समस्ताङ्गजतत्त्वगर्भप्रपूरकायाच्युत ते नमोऽस्तु ॥ ४९॥ नमोऽवतारिन्नवतारधर्त्रे ह्यनन्तमुक्ताऽभिनिषेविताय
    । अनादिकृष्णाय परेश्वराय नारायणायेति नमोऽस्तु तुभ्यम् ॥ ५०॥ श्रीकान्तरूपाय रमेश्वराय राधाधिनाथाय नमो
    नमस्ते । नमोऽस्तु ते श्रीपुरपालकाय भूमन्नमस्ते ललितेश्वराय ॥ ५१॥ सर्वेश्वरीशाय समस्तसर्वेश्वरेश्वरेशाय
    नमोऽस्तु तुभ्यम् । वैराजनाथाय जगन्नियन्त्रे मायेश्वरायाऽच्युत ते नमोऽस्तु ॥ ५२॥ पितृर्षिदेवर्षिशरीरकाय
    चराचरान्तःस्थ च ते नमोऽस्तु । श्रीमाणिकीपाशवतीश्चराय प्रशाधिनाथाय नमोऽस्तु तुभ्यम ॥ ५३॥ ब्रह्मप्रियावामनिवासकाय
    हरिप्रियाद्याभिरभिष्टुताय । कृतस्थली कुङ्कुमवापिकाय गोपालबालाय नमो नमस्ते ॥ ५४॥ श्रीकम्भरामातृभवाय
    कृष्णनारायणश्रीश च ते नमोऽस्तु । साधुस्वरूपाय मखात्मकाय स्वामिन्नमस्ते रणरञ्जनाय ॥ ५५॥ जन्मस्थितिभ्रंशकराय
    विष्णो जिष्णो नमस्ते परमेश्वराय । सद्भक्तलभ्याय कृपावशाय शक्ताय कालाय नमो भवाय ॥ ५६॥ रुद्राय बाणाय
    रथाय शास्त्रे यमाय धर्माय नमो द्विजाय । प्राणाय जीवाय तदात्मने तेऽन्विताय रिक्ताय नमोऽव्ययाय ॥ ५७॥
    नागस्वरूपाय मदन्तकाय हृद्याय निर्वाणकराय धात्रे । शीघ्रं शरण्यं त्वमभिप्रपद्य नयाक्षरं मोक्षपदं हरे
    माम् ॥ ५८॥ कृतापराधं बहुगर्वदृब्धं परश्रियं वीक्ष्य सदा ज्वलन्तम् । रणे स्थितं प्राणगतिं त्यजन्तं
    क्षमाप्य सर्वं नय मोक्षणं ते ॥ ५९॥ सर्वज्ञ सर्वेश समस्तचक्षुः समस्तकर्णाऽत्ममनस्सु संस्थ । दिव्यं
    निजं दर्शनमत्र देहि मृतान्समस्ताँश्च समुद्धराऽत्र ॥ ६०॥ हरेऽग्निरातेन विबोधितेन मयापि गर्वादवमानितस्त्वम्
    । अतोषदावानलमध्यमाप्तं समुद्धर श्रीश विधेहि दिव्यम् ॥ ६१॥ स्वर्गं यथा वा नरकं मदर्थं यदस्ति तत्तेऽर्पितमत्र
    कृष्ण । प्रपन्नजीवं परलोकयानं नयाऽक्षरं धाम विनाश्य पापम् ॥ ६२॥ हरे कृष्ण हरे विष्णो कृष्णनारायण प्रभो
    । तवास्मीति तवास्मीति मोक्षं मां नय माधव ॥ ६३॥ इत्युक्त्वा मौनमादाय कृताञ्जलिर्हृदन्तरे । विवेश नन्दिभिल्लो
    वै स्मरन् ध्यायन् प्रभुं पतिम् ॥ ६४॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य चतुर्थखण्डे
    ८५
