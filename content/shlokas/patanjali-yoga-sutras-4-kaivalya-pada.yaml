id: patanjali-yoga-sutras-4-kaivalya-pada
category: stotram
name:
  english: Patanjali Yoga Sutras - 4 (Kaivalya Pada)
content:
  english: atha kaivalyapadah | janmaushadhimantratapassamadhijah siddhayah || || jatyantaraparinamah
    prakrityapurat || || nimittamaprayojakam prakritinamvaranabhedastu tatah kshetrikavat || || nirmanacittanyasmitamatrat
    || || pravrittibhede prayojakam cittamekamanekesham || || tatra dhyanajamanashayam || || karmashuklakrishnam
    yoginah trividhamitaresham || || tatastadvipakanugunanamevabhivyaktirvasananam || || jati desha kala
    vyavahitanamapyanantaryam smritisamskarayoh ekarupatvat || || tasamanaditvam cashisho nityatvat ||
    || hetuphalashrayalambanaih sangrihitatvateshamabhavetadabhavah || || atitanagatam svarupato'styadhvabhedaddharmanam
    || || te vyaktasukshmah gunatmanah || || parinamaikatvat vastutattvam || || vastusamye cittabhedattayorvibhaktah
    panthah || || na caikacittatantram vastu tadapramanakam tada kim syat || || taduparagapekshitvat cittasya
    vastujnatajnatam || || sadajnatah cittavrittayah tatprabhoh purushasyaparinamitvat || || na tatsvabhasam
    drishyatvat || || eka samaye cobhayanavadharanam || || cittantara drishye buddhibuddheh atiprasangah
    smritisankarashca || || citerapratisankramayah tadakarapattau svabuddhi samvedanam || || drashtridrishyoparaktam
    cittam sarvartham || || tadasankhyeya vasanabhih citramapi parartham samhatyakaritvat || || visheshadarshinah
    atmabhavabhavananivrittih || || tada vivekanimnam kaivalyapragbharam cittam || || tacchidreshu pratyayantarani
    samskarebhyah || || hanamesham kleshavaduktam || || prasankhyane'pyakusidasya sarvatha vivekakhyateh
    dharmameghassamadhih || || tatah kleshakarmanivrittih || || tada sarvavaranamalapetasya jnanasyanantyat
    jneyamalpam || || tatah kritarthanam parinamakramasamaptirgunanam || || kshanapratiyogi parinamaparanta
    nirgrahyah kramah || || purusharthashunyanam gunanampratiprasavah kaivalyam svarupapratishtha va citishaktiriti
    || || iti patanjalayogadarshane kaivalyapado nama caturthah padah |
  devanagari: अथ कैवल्यपादः । जन्मौषधिमन्त्रतपस्समाधिजाः सिद्धयः ॥ ॥ जात्यन्तरपरिणामः प्रकृत्यापूरात्
    ॥ ॥ निमित्तमप्रयोजकं प्रकृतीनांवरणभेदस्तु ततः क्षेत्रिकवत् ॥ ॥ निर्माणचित्तान्यस्मितामात्रात् ॥ ॥
    प्रवृत्तिभेदे प्रयोजकं चित्तमेकमनेकेषाम् ॥ ॥ तत्र ध्यानजमनाशयम् ॥ ॥ कर्माशुक्लाकृष्णं योगिनः त्रिविधमितरेषाम्
    ॥ ॥ ततस्तद्विपाकानुगुणानामेवाभिव्यक्तिर्वासनानाम् ॥ ॥ जाति देश काल व्यवहितानामप्यानन्तर्यं स्मृतिसंस्कारयोः
    एकरूपत्वात् ॥ ॥ तासामनादित्वं चाशिषो नित्यत्वात् ॥ ॥ हेतुफलाश्रयालम्बनैः सङ्गृहीतत्वातेषामभावेतदभावः
    ॥ ॥ अतीतानागतं स्वरूपतोऽस्त्यध्वभेदाद्धर्माणाम् ॥ ॥ ते व्यक्तसूक्ष्माः गुणात्मानः ॥ ॥ परिणामैकत्वात्
    वस्तुतत्त्वम् ॥ ॥ वस्तुसाम्ये चित्तभेदात्तयोर्विभक्तः पन्थाः ॥ ॥ न चैकचित्ततन्त्रं वस्तु तदप्रमाणकं
    तदा किं स्यात् ॥ ॥ तदुपरागापेक्षित्वात् चित्तस्य वस्तुज्ञाताज्ञातम् ॥ ॥ सदाज्ञाताः चित्तवृत्तयः तत्प्रभोः
    पुरुषस्यापरिणामित्वात् ॥ ॥ न तत्स्वाभासं दृश्यत्वात् ॥ ॥ एक समये चोभयानवधारणम् ॥ ॥ चित्तान्तर दृश्ये
    बुद्धिबुद्धेः अतिप्रसङ्गः स्मृतिसङ्करश्च ॥ ॥ चितेरप्रतिसङ्क्रमायाः तदाकारापत्तौ स्वबुद्धि संवेदनम्
    ॥ ॥ द्रष्टृदृश्योपरक्तं चित्तं सर्वार्थम् ॥ ॥ तदसङ्ख्येय वासनाभिः चित्रमपि परार्थं संहत्यकारित्वात्
    ॥ ॥ विशेषदर्शिनः आत्मभावभावनानिवृत्तिः ॥ ॥ तदा विवेकनिम्नं कैवल्यप्राग्भारं चित्तम् ॥ ॥ तच्छिद्रेषु
    प्रत्ययान्तराणि संस्कारेभ्यः ॥ ॥ हानमेषां क्लेशवदुक्तम् ॥ ॥ प्रसङ्ख्यानेऽप्यकुसीदस्य सर्वथा विवेकख्यातेः
    धर्ममेघस्समाधिः ॥ ॥ ततः क्लेशकर्मनिवृत्तिः ॥ ॥ तदा सर्वावरणमलापेतस्य ज्ञानस्यानन्त्यात् ज्ञेयमल्पम्
    ॥ ॥ ततः कृतार्थानां परिणामक्रमसमाप्तिर्गुणानाम् ॥ ॥ क्षणप्रतियोगी परिणामापरान्त निर्ग्राह्यः क्रमः
    ॥ ॥ पुरुषार्थशून्यानां गुणानाम्प्रतिप्रसवः कैवल्यं स्वरूपप्रतिष्ठा वा चितिशक्तिरिति ॥ ॥ इति पातञ्जलयोगदर्शने
    कैवल्यपादो नाम चतुर्थः पादः ।
