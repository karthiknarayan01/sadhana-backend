id: mrityukritamshivastotram
category: stotram
name:
  english: mrityukritamshivastotram
  devanagari: मृत्युकृतंशिवस्तोत्रम्
content:
  english: mrityukritam shivastotram rishaya ucuh | yo lilaya vishvamidam cakara dhata vidhata bhuvanatrayasya
    | yo vishvarupah sadasatparo yah someshvaram tam sharanam vrajamah || 14|| mrityuruvaca | icchamatrena
    yah sarvam hanti pati karoti ca | tamaham tridasheshanam sharanam yami shankaram || 15|| mahanalam
    mahakayam mahanagavibhushanam | mahamurtidharam devam sharanam yami shankaram || 16|| iti brahmapurane
    shodashadhikashatatamadhyayantargatam rishibhistatha mrityukritam shivastotram samaptam | brahmapurana
    | adhyaya 116
  devanagari: मृत्युकृतं शिवस्तोत्रम् ऋषय ऊचुः । यो लीलया विश्वमिदं चकार धाता विधाता भुवनत्रयस्य । यो
    विश्वरूपः सदसत्परो यः सोमेश्वरं तं शरणं व्रजामः ॥ १४॥ मृत्युरुवाच । इच्छामात्रेण यः सर्वं हन्ति पाति
    करोति च । तमहं त्रिदशेशानं शरणं यामि शङ्करम् ॥ १५॥ महानलं महाकायं महानागविभूषणम् । महामूर्तिधरं देवं
    शरणं यामि शङ्करम् ॥ १६॥ इति ब्रह्मपुराणे षोडशाधिकशततमाध्यायान्तर्गतं ऋषिभिस्तथा मृत्युकृतं शिवस्तोत्रं
    समाप्तम् । ब्रह्मपुराण । अध्याय ११६
meaning: {}
