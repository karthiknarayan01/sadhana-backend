id: kyts-jata-5-2-vishnumukhaa-vai-devaah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.2 Vishnumukhaa Vai Devaah - Krishna Yajurveda Taittiriya Samhita
content:
  english: vishnumukha vai vai vishnumukha vishnumukha vai | vishnumukha iti vishnu vai deva deva vai
    vai devah | deva shchandobhi shchandobhi rdeva deva shchandobhih | chandobhi rima niman chandobhi
    shchandobhi riman | chandobhiriti chandah iman ~lokan ~loka nima niman ~lokan | loka nanapajayya manapajayyam
    ~lokan ~loka nanapajayyam | bhya napajayya manapajayya mabhi | vishnukraman kramate kramate vishnukraman
    vishnukraman kramate | vishnukramaniti vishnu rvishnuh kramate kramate vishnuh | vishnu revaiva vishnu
    eva bhutva bhutvai vaiva bhutva | bhutva yajamano yajamano bhutva bhutva yajamanah | yajamana shchandobhi
    shchandobhi ryajamano yajamana shchandobhih | chandobhirima niman chandobhi shchandobhi riman | chandobhiriti
    chandah iman ~lokan ~loka nima niman ~lokan | loka nanapajayya manapajayyam ~lokan ~loka nanapajayyam
    | bhyanapajayya manapajayya mabhi | abhi jayati jaya tyabhyabhi jayati | rjayati jayati vishnoh vishnoh
    kramah kramo vishno 'syasi kramah kramo 'si | asyabhimatiha 'bhimatiha 'syasya bhimatiha | abhimati
    hetitya bhimatiha 'bhimatiheti | abhimatihetyabhimati itya hahe tityaha | aha gayatri gaya tryahaha
    gayatri | gayatri vai vai gayatri gayatri vai | vai prithivi prithivi vai vai prithivi | prithivi
    traishtubha mprithivi prithivi traishtubham | traishtubha mantariksha mantariksha ntraishtubha mantariksham
    | njagati jagatya ntariksha mantariksha rjagati jagati dyauh | dyau ranushtubhi ranushtubhi rdyau
    ranushtubhih | rdisho disha anushtubhi ranushtubhi anushtubhirityanu disha shchandobhi shchandobhi
    rdisho disha shchandobhih | chandobhi revaiva chandobhi shchandobhi reva | chandobhiriti chandah eve
    ma nima nevaive man | iman ~lokan ~loka nima niman ~lokan | ya~thapurvam ~lokan ~lokan yathapurva
    mabhyabhi yathapurvam yathapurvamiti yatha abhi jayati jaya tyabhyabhi jayati | jayati prajapatih
    prajapati rjayati jayati prajapatih | prajapati ragni magni mprajapatih prajapati ragnim | prajapatiriti
    praja agni masrijata srijatagni magni masrijata | asrijata sa so 'srijata srijata sah | etaya 'nvan
    veta yaitaya 'nu | anvai daidan van vai ndadai dai dakrandat | ndaditi tyakranda dakranda diti | iti
    taya tayetiti taya taya vai vai taya taya vai | mpriya magne ragneh priyam | dhama vava dhama dhamava
    | ava rundha rundha vava rundha | dyadarundha rundha yat | eta manva hanva haita meta manvaha | anva
    hagne ragne ranvaha nvahagneh | agne revai vagne ragne reva | evaita yaita yaivai vaitaya mpriya meta
    yaitaya dhama vava dhama dhamava | ava rundhe rundhe 'vava rundhe | shvaro rundhe rundha ishvarah
    | va esha esha vai va eshah | mpara mesha esha param | mpradaghah pradaghah para pradagho yo yah pradaghah
    pradagho yah | yo yo vishnukraman | vishnukraman kramate kramate vishnukraman vishnukraman kramate
    | vishnukramaniti vishnu kramate catasribhi shcatasribhih kramate kramate catasribhih | catasribhira
    catasribhi shcatasribhira | catasribhiriti catasri a vartate vartata a vartate | vartate catvari catvari
    vartate vartate catvari | catvari chandagmsi chandagmsi catvari catvari chandagmsi | chandagmsi chandagmsi
    | chandagmsi khalu khalu chandagmsi chandagmsi khalu | khalu vai vai khalu khalu vai | agneh priya
    priya 'gne ragneh priya | priya tanu stanuh priya priya tanuh | ntanu stanuh priyam | priya mevaiva
    priya ntanuva masyasya tanuva tanuva mabhyabhi tanuva abhi paryavartate paryavartate 'bhyabhi paryavartate
    | || paryavartate dakshina dakshina paryavartate paryavartate dakshina | paryavartata iti pari dakshina
    paryavartate paryavartate dakshina dakshina paryavartate | paryavartate svagg mparyavartate paryavartate
    svam | paryavartata iti pari vi~rya mevaiva virya virya manvanu viryam anu paryavartate paryavartate
    'nvanu paryavartate | paryavartate tasma tparyavartate paryavartate tasma paryavartata iti pari ddakshino
    dakshina stasma dakshino 'rdho 'rdho dakshino dakshino 'rdhah | ardha atmana atmano 'rdho 'rdha atmanah
    | atmano viryavattaro viryavattara atmana atmano viryavattarah | viryavattaro 'tho atho viryavattaro
    viryavattaro 'tho viryavattara iti viryavat atho adityasya dityasya tho atho adityasya | aditya syaivai
    vadityasya ditya syaiva | evavrita mavrita mevaiva vrita avrita man van vavrita mavrita manu | anu
    paryavartate paryavartate 'nvanu paryavartate | paryavartate shunashshepagm shunashshepa mparyavartate
    paryavartate shunashshepa paryavartata iti pari shunashshepa majigarti majigartigm shunashshepagm
    shunashshepa majigartim | va~runo varuna ajigarti majigartim varuno 'grihna dagrihna dvaruno varuno
    'grihnat | thsa so 'grihna dagrihna sa eta metagm sa sa etam | va~runi meta metam varuni mapashya
    dapashya va~runi mapashyat | ttaya taya 'pashya dapashya taya vai vai taya taya vai | sa atmana matmanagm
    sa sa atmana dvarunapasha datmana matmanam varunapasha damunca damunca dvarunapasha damuncat | varunapashaditi
    varuna dvaruno varuno 'munca damunca varuno vai vai varuno varuno vai | ngrihnati grihna tyeta meta
    grihnati yo yo grihnati grihnati yah | pratimuncata ukha mukha pratimuncata iti prati uduttama muttama
    mudu duttamam | va~runa varunottama muttamam asma diti tyasma dasma diti | ityahahe tityaha | aha
    tmana matmana maha hatmana atmana mevai vatmana matmana meva | evaita yaita yaivai vaitaya dvarunapasha
    detayai taya varunapashat | || nmuncati muncati varunapasha varunapashaditi varuna muncatya muncati
    muncatya | tva 'harsha maharsha ntva tva 'harsham | aharsha miti tyahar ityahahe tityaha | hyena menagm
    hi hyenam | enagm harati haratyena menagm harati | harati dhruvo dhruvo harati harati dhruvah | dhruva
    stishtha tishtha dhruvo dhruva stishtha | tishtha vicacali ravicacali stishtha tishtha vicacalih |
    avicacali rititya vicacali ravicacali riti | ityahahe tityaha | aha pratishthityai pratishthitya ahaha
    pratishthityai | pratishthityai visho vishah pratishthityai pratishthityai vishah | pratishthitya
    iti prati visha stva tva visho visha stva | sarva vanchantu vanchantu sarva ssarva vanchantu | ntvititi
    vanchantu vancha ityahahe tityaha | aha visha visha ''haha visha | vishai vaiva visha vishaiva | evaina
    mena mevai vaina enagm sagm sa mena menagm sam | sa mardhaya tyardhayati sagm sa mardhayati | nnardhaya
    tyardhaya tyasminn | nrashtragm rashtra masmi rashtra madhyadhi rashtragm rashtra madhi | adhi shraya
    shraya dhyadhi shraya | shraye titi shraya shrayeti | ityahahe tityaha | aha rashtragm rashtra mahaha
    rashtram | rashtra mevaiva rashtragm rashtra meva | nnevai vasminn | nkamayeta kamayeta yam kamayeta
    rashtragm rashtra nkamayeta kamayeta rashtram | drashtragm rashtragg nmanasa manasa dhyayet | drashtragm
    rashtra rashtra mevaiva rashtragm rashtra meva | eva bhavati bhava tyevaiva bhavati | bhava tyagre
    'gre bhavati bhava tyagre nnagre agre brihann | ushasa murdhva urdhva ushasa mushasa murdhvah | urdhvo
    astha dastha durdhva urdhvo asthat | astha dititya stha dastha diti | ityahahe tityaha | ahagra magra
    mahahagra agra mevai vagra magra meva | evaina mena mevai vaina enagm samananagm samanana mena menagm
    samanana nkaroti karoti samananagm samanana karoti nirjagmiva nnirjagmivan karoti karoti nirjagmivan
    | ntamasa stamaso nirjagmiva nirjagmivaniti nih tamasa ititi tamasa stamasa iti | ityahahe tityaha
    | aha tama stama ahaha tamah | tama evaiva tama stama eva | evasma dasma devai vasma apa hanti hantya
    papa hanti | hanti jyotisha jyotisha hanti hanti jyotisha | jyotisha ''jyotisha jyotisha | aga diti
    tyaga daga diti | ityahahe tityaha | rjyoti rahaha jyotih | jyoti revaiva jyoti nnevai vasminn | ndadhati
    dadha tyasmi dadhati catasribhi shcatasribhi rdadhati dadhati catasribhih | catasribhih sadayati sadayati
    catasribhi shcatasribhih sadayati | catasribhiriti catasri sadayati catvari catvari sadayati sadayati
    catvari | catvari chandagmsi chandagmsi catvari catvari chandagmsi | chandagmsi chandobhi shchandobhi
    shchandagmsi chandagmsi chandobhih | chandobhi revaiva chandobhi shchandobhi reva | chandobhiriti
    chandah eva ticchandasa 'ticchanda saivaiva ticchandasa | aticchandaso ttamayo ttamaya 'ticchandasa
    'ticchandaso ttamaya va eshaisha vai va esha | nchandasa meshaisha chandasam | ya daticchanda aticchanda
    ya shmaticchanda aticchanda var aticchanda ityati evaina mena mevai vaina enagm samananagm samanana
    mena menagm samanana nkaroti karoti samananagm samanana karoti sadvati sadvati karoti karoti sadvati
    | sadvati bhavati bhavati sadvati sadvati bhavati | bhavati sattvagm sattva mbhavati bhavati sattvam
    | sattva mevaiva sattvagm sattva meva | evaina mena mevai vaina ngamayati gamaya tyena mena gamayati
    vathsaprena vathsaprena gamayati gamayati vathsaprena | vathsapreno popa vathsaprena vathsapre nopa
    | vathsapreneti vathsa upa tishthate tishthata upopa tishthate | tishthata ete naitena tishthate tishthata
    etena | etena vai va ete naitena vai | rvai vai vathsaprih | rbhalandano bhalandano vathsapri vathsapririti
    vathsa rbhalandano bhalandano mpriya magne ragneh priyam | dhama vava dhama dhamava | ava rundha rundha
    vava rundha | ndhagne ragne rarundha rundhagneh | agne revaivagne ragne reva | evaite naite naivai
    vaitena | mpriya mete naitena priyam | dhama vava dhama dhamava | ava rundhe rundhe 'vava rundhe |
    rundha ekadasha mekadashagm rundhe rundha ekadasham | mbhavati bhava tyekadasha mekadasha bhava tyeka
    dhaikadha bhavati bhava tyekadha | eka dhaivai vaika dhaika dhaiva | eva yajamane yajamana evaiva
    yajamane | ya~jamane yajamane virya ndadhati dadhati viryam dadhati stomena stomena dadhati dadhati
    stomena | stomena vai vai stomena stomena vai | vai deva deva vai vai devah | ndeva deva asminn |
    asmin ~loke loke nnardhnuvan ~loke loka a ardhnuvan chandobhi shchandobhi rardhnuva nnardhnuvan chandobhih
    | nnamushmin chandobhi shchandobhi ramushminn | chandobhiriti chandah nthstomasya stomasya mushmi
    stoma syeveva stomasya stomasyeva | iva khalu khalviveva khalu | khalu vai vai khalu khalu vai | drupagm
    rupa meta deta vathsapramiti vathsa thsaprena vathsaprena ya vathsapreno patishthata upatishthate
    vathsaprena vathsapreno patishthate | vathsapreneti vathsa upatishthata ima mima mupatishthata upatishthata
    imam | upatishthata ityupa ima mevaivema mima meva | eva tena tenai vaiva tena | ntena tena lokam
    | loka mabhyabhi lokam ~loka mabhi | abhi jayati jaya tyabhyabhi jayati | dyaj jayati jayati yat |
    vishnukraman kramate kramate vishnukraman vishnukraman kramate | vishnukramaniti vishnu nkramate kramate
    'mum | amu mevaivamu mamu meva | eva tai stai revaiva taih | loka mabhyabhi lokam ~loka mabhi | abhi
    jayati jaya tyabhyabhi jayati | jayati purvedyuh pu rjayati jayati purvedyuh | purvedyuh pra pra pu
    pra kramati kramati pra pra kramati | krama tyuttaredyu ruttaredyuh kramati krama tyuttaredyuh | uttaredyu
    rupopo ttaredyu ruttaredyu rupa | upa tishthate tishthata upopa tishthate | ttishthate tishthate tasma
    dyoge yoge tasma yoge 'nyasa manyasam yo~ge yoge 'nyasa mprajana manyasa manyasa mmano manah prajana
    ksheme ksheme mano manah ksheme 'nyasa manyasa nksheme ksheme 'nyasa ttasma danyasa manyasa dyayavaro
    yayavara stasma kshemyasya kshemyasya yayavaro yayavarah kshemya syesha ishe kshemyasya kshemya syeshe
    | ttasma disha ishe tasma dyayavaro yayavara stasma ya~yavaro yayavarah kshemya maddhyavasya tyaddhyavasyati
    kshemya nkshemya maddhyavasyati | addhyavasyati mushti mushti addhyavasya tyaddhyavasyati mushti |
    addhyavasyatityadhi mushti karoti karoti mushti mushti karoti | mushti iti mushti | ya~cchati yacchati
    vacam yacchati yajnasya yajnasya yacchati yacchati yajnasya | yajnasya dhrityai dhrityai yajnasya
    yajnasya dhrityai annapate 'nnasya nnasya nnapate 'nnapate 'nnasya | annasya no no annasya nnasya
    nah | no dehi dehi no no dehi | dehititi dehi dehiti | ityahahe tityaha | ahagni ragni raha hagnih
    | rvai va agni ragni va annapati rannapati ssa so 'nnapati rannapati evasma asma evai vasmai asma
    anna manna masma asma anna mpra pranna manna pra yacchati yacchati pra pra yacchati | yaccha tyanamivasya
    namivasya yacchati yaccha tyanamivasya | anamivasya shushminah shushmino 'namiva syanamivasya shushminah
    | shushmina ititi shushminah shushmina iti | ityahahe tityaha | aha yakshmasya yakshmasya haha yakshmasya
    | ayakshma syeti tyayakshmasya yakshmasyeti | iti vava vave titi vava | eta daha haita deta daha |
    aha pra prahaha pra | mpra pra pradatara ntarisha starishah pradatara pradataramiti pra tarisha urja
    murja ntarisha starisha urja nno na urja murjannah | no dhehi dhehi no no dhehi | dvipade dhehi dhehi
    dvipade dvipade catushpade catushpade dvipade dvipade catushpade | catushpada ititi catushpade catushpada
    iti | catushpada iti catuh ityahahe tityaha | ahashisha mashisha maha hashisha ashisha mevai vashisha
    mashisha meva | evaita meta mevai vaitam | eta maita meta ma | u tva tva vu tva | tva vishve vishve
    vishve deva deva vishve vishve devah | deva ititi deva deva iti | ityahahe tityaha | aha pranah prana
    ahaha pranah | prana vai vai pranah prana vai | vai vishve vishve vai vai vishve vishve deva deva
    vishve vishve devah | devah pranaih pranai rdeva devah pranaih | || pranai revaiva pranaih pranai
    reva | evaina mena mevai vaina ena mudu dena mena mut | dyacchate yacchata udu yacchate 'gne 'gne
    yacchate yacchate 'gne ntvagne 'gne bharantu | bharantu cittibhi shcittibhi rbharantu bharantu cittibhih
    | cittibhi rititi cittibhi shcittibhi riti | cittibhiriti citti ityahahe tityaha | aha yasmai yasma
    ahaha yasmai yasma evaiva yasmai yasma eva | evaina mena mevai vaina ncittaya cittayaina mena cittayo
    dyacchata udyacchate cittaya cittayo dyacchate | udyacchate tena teno dyacchata udyacchate tena |
    udyacchata ityut tenai vaiva tena tenaiva | evaina mena mevai vaina enagm sagm sa mena menagm sam
    | sa mardhaya tyardhayati sagm sa mardhayati | ardhayati catasribhi shcatasribhi rardhaya tyardhayati
    catasribhih | catasribhira catasribhi shcatasribhira | catasribhiriti catasri a sadayati sadayatya
    sadayati | sadayati catvari catvari sadayati sadayati catvari | catvari chandagmsi chandagmsi catvari
    catvari chandagmsi | chandagmsi chandobhi shchandobhi shchandagmsi chandagmsi chandobhih | chandobhi
    revaiva chandobhi shchandobhi reva | chandobhiriti chandah eva ticchandasa 'ticchandasai vaiva ticchandasa
    | aticchanda sottama yo ttamaya 'ticchandasa 'ticchanda sottamaya va eshaisha vai va esha | nchandasa
    meshaisha chandasam | yadaticchanda aticchanda ya shma ticchanda aticchanda var aticchanda ityati
    evaina mena mevai vaina enagm samananagm samanana mena menagm samanana nkaroti karoti samananagm samanana
    karoti sadvati sadvati karoti karoti sadvati | sadvati bhavati bhavati sadvati sadvati bhavati | bhavati
    sattvagm sattva mbhavati bhavati sattvam | sattva mevaiva sattvagm sattva meva | evaina mena mevai
    vaina ngamayati gamaya tyena mena gamayati pra pra gamayati gamayati pra | idagne agna idi dagne |
    agne jyotishman jyotishma nagne agne jyotishman | yahi yahi jyotishman jyotishman yahititi yahi yahiti
    | ityahahe tityaha | rjyoti rahaha jyotih | jyoti revaiva jyoti nnevai vasminn | ndadhati dadha tyasmi
    dadhati tanuva tanuva dadhati dadhati tanuva tanuva vai vai tanuva tanuva vai | va esha esha vai va
    eshah | esha hinasti hina styesha esha hinasti | ya~gm hinasti hinasti yam | yagm hinasti hinasti
    yam hinasti ma ma hinasti hinasti ma | higmsi stanuva tanuva higmsir prajah praja stanuva tanuva praja
    ititi prajah praja iti | ityahahe tityaha | aha prajabhyah prajabhya ahaha prajabhyah | prajabhya
    evaiva prajabhyah prajabhya eva | evaina mena mevai vaina enagm shamayati shamaya tyena menagm shamayati
    | shamayati rakshagmsi rakshagmsi shamayati shamayati rakshagmsi | rakshagmsi vai vai rakshagmsi rakshagmsi
    vai | yajnagm sacante sacante yajnam thsacante sacante yat | ana uthsarja tyuthsarja tyano 'na uthsarjati
    | uthsarja tyakranda dakranda duthsarja tyuthsarja tyakrandat | akranda diti tyakranda dakranda diti
    | ityan van viti tyanu | anvaha han van vaha | aha rakshasagm rakshasa mahaha rakshasam | rakshasa
    mapahatya apahatyai rakshasagm rakshasa mapahatyai | apahatya anasa 'nasa 'pahatya apahatya anasa
    | ntyanasa 'nasa vahanti | ntyapaciti mapacitim apaciti mevaiva paciti mapaciti meva | nnevai vasminn
    | ndadhati dadha tyasmi ddadhati dadhati tasma tasma dana svyanasvi tasma anasvi ca cana svyanasvi
    ca | ca rathi rathi ca ca rathi | rathi ca ca rathi rathi ca | atithina mapacitatama vapacitatama
    vatithina matithina mapacitatamau | apacitatama vapacitima napacitima napacitatama vapacitatama vapacitiman
    | apacitatamavityapacita nbhavati bhava tyapacitima napacitima apacitimanityapaciti bhavati yo yo
    bhavati bhavati yah | veda samidha samidha veda veda samidha samidha 'gni magnigm samidha samidha
    'gnim | nduvasyata duvasya tagni magni duvasyate titi duvasyata duvasyateti | nghritanushikta mititi
    ghritanushiktam | ghritanushikta mavasite 'vasite ghritanushikta nghritanushikta mavasite | ghritanushiktamiti
    ghrita avasite samidhagm samidha mavasite 'vasite samidha samidha ma samidhagm samidha ma | a dadhati
    dadhatya dadhati | dadhati yatha yatha dadhati dadhati yatha yatha 'tithaye 'tithaye yatha yatha 'tithaye
    | atithaya agataya gataya tithaye 'tithaya agataya | thsarpishvada gataya gataya sarpishvat | sarpishva
    datithya matithyagm sarpishva thsarpishva datithyam | kriyata atithya matithya dgayatriya gayatriya
    ta hmanasya brahmanasya gayatriya gayatriya bra brahmanasya gayatro gayatro bra hmanasya brahmanasya
    gayatrah | gayatro hi hi gayatro gayatro hi | brahmana strishtubha trishtubha rajanyasya rajanyasya
    trishtubha trishtubha rajanyasya | rajanyasya traishtubha straishtubho rajanyasya rajanyasya traishtubhah
    | traishtubho hi hi traishtubha straishtubho hi | hi rajanyo rajanyo hi hi rajanyah | 'phsvaphsu rajanyo
    rajanyo aphsu bhasma bhasma phsvaphsu bhasma | bhasma pra pra bhasma bhasma pra | pra veshayati veshayati
    pra pra veshayati | veshaya tyaphsuyoni raphsuyoni rveshayati veshaya tyaphsuyonih | rvai va aphsuyoni
    raphsuyoni aphsuyonirityaphsu evaina mena mevai vaina ngamayati gamayati yonim gamayati tisribhi stisribhi
    rgamayati gamayati tisribhih | tisribhih pra pra tisribhi stisribhih pra | pra veshayati veshayati
    pra pra veshayati | dveshayati veshayati trivrit | yava nevaiva yavan evagni ragni revai vagnih |
    nta magni ragni stam | ngamayati gamayati pratishtha pratishthamiti prati gamayati para para gamayati
    gamayati para para vai vai para para vai | va esha esha vai va eshah | 'gni magni mesha esho va~pati
    vapa tyagni magnim vapati yo yo vapati vapati yah | aphsu bhasma bhasma phsvaphsu bhasma | bhasma
    praveshayati praveshayati bhasma bhasma praveshayati | praveshayati jyotishmatibhya mpraveshayati
    praveshayati jyotishmatibhyam | jyotishmatibhya mavava jyotishmatibhya njyotishmatibhya mava | ava
    dadhati dadha tyavava dadhati | rdadhati dadhati jyotih | jyoti revaiva jyoti nnevai vasminn | ndadhati
    dadha tyasmi ndadhati dadhati dvabhya mpratishthityai pratishthityai dvabhya pratishthityai para para
    pratishthityai pratishthityai para pratishthitya iti prati para vai vai para para vai | va esha esha
