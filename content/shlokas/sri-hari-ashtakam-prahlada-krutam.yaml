id: sri-hari-ashtakam-prahlada-krutam
category: stotram
name:
  english: Sri Hari Ashtakam (Prahlada Krutam)
content:
  english: harirharati papani dushtacittairapi smritah | anicchaya'pi samsprishto dahatyeva hi pavakah
    || || sa ganga sa gaya setuh sa kashi sa ca pushkaram | jihvagre vartate yasya harirityaksharadvayam
    || || varanasyam kurukshetre naimisharanya eva ca | yatkritam tena yenoktam harirityaksharadvayam
    || || prithivyam yani tirthani punyanyayatanani ca | tani sarvanyasheshani harirityaksharadvayam ||
    || gavam kotisahasrani hemakanyasahasrakam | dattam syattena yenoktam harirityaksharadvayam || ||
    rigvedo'tha yajurvedah samavedo'pyatharvanah | adhitastena yenoktam harirityaksharadvayam || || ashvamedhairmahayajnairnaramedhaistathaiva
    ca | ishtam syattena yenoktam harirityaksharadvayam || || pranah prayana patheyam samsaravyadhinashanam
    | duhkhatyanta paritranam harirityaksharadvayam || || baddhah parikarastena mokshaya gamanam prati
    | sakriduccaritam yena harirityaksharadvayam || || haryashtakamidam punyam pratarutthaya yah pathet
    | ayushyam balamarogyam yasho vriddhih shriyavaham || || prahladena kritam stotram duhkhasagarashoshanam
    | yah pathetsa naro yati tadvishnoh paramam padam || || iti prahladakrita shri haryashtakam |
  devanagari: हरिर्हरति पापानि दुष्टचित्तैरपि स्मृतः । अनिच्छयाऽपि संस्पृष्टो दहत्येव हि पावकः ॥ ॥ स गङ्गा
    स गया सेतुः स काशी स च पुष्करम् । जिह्वाग्रे वर्तते यस्य हरिरित्यक्षरद्वयम् ॥ ॥ वाराणस्यां कुरुक्षेत्रे
    नैमिशारण्य एव च । यत्कृतं तेन येनोक्तं हरिरित्यक्षरद्वयम् ॥ ॥ पृथिव्यां यानि तीर्थानि पुण्यान्यायतनानि
    च । तानि सर्वाण्यशेषाणि हरिरित्यक्षरद्वयम् ॥ ॥ गवां कोटिसहस्राणि हेमकन्यासहस्रकम् । दत्तं स्यात्तेन
    येनोक्तं हरिरित्यक्षरद्वयम् ॥ ॥ ऋग्वेदोऽथ यजुर्वेदः सामवेदोऽप्यथर्वणः । अधीतस्तेन येनोक्तं हरिरित्यक्षरद्वयम्
    ॥ ॥ अश्वमेधैर्महायज्ञैर्नरमेधैस्तथैव च । इष्टं स्यात्तेन येनोक्तं हरिरित्यक्षरद्वयम् ॥ ॥ प्राणः प्रयाण
    पाथेयं संसारव्याधिनाशनम् । दुःखात्यन्त परित्राणं हरिरित्यक्षरद्वयम् ॥ ॥ बद्धः परिकरस्तेन मोक्षाय गमनं
    प्रति । सकृदुच्चारितं येन हरिरित्यक्षरद्वयम् ॥ ॥ हर्यष्टकमिदं पुण्यं प्रातरुत्थाय यः पठेत् । आयुष्यं
    बलमारोग्यं यशो वृद्धिः श्रियावहम् ॥ ॥ प्रह्लादेन कृतं स्तोत्रं दुःखसागरशोषणम् । यः पठेत्स नरो याति
    तद्विष्णोः परमं पदम् ॥ ॥ इति प्रह्लादकृत श्री हर्यष्टकम् ।
