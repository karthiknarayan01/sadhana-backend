id: shuklayajurvediyasandhya
category: veda
name:
  english: shuklayajurvediyasandhya
  devanagari: शुक्लयजुर्वेदीयसन्ध्या
content:
  english: shi bhasmani || || gayatrimantrah || om bhurbhuvahsvah om tatsaviturvvarennyambharggo devasya
    dhimahi || dhiyoyonah ppracodayat || om tryambakamityasya vasishtha rishih rudro devata anushthubchandah
    bhasmabhimantrane viniyogah || om tryayambaka~yyajamahesugandhimpushttivarddhanam || urvvarukamiva
    bandhanannmrityormmukshiyamamritat || om tryayushamityasya narayana rishih rudro devata ushinakchandah
    bhasmadharane viniyogah || om tryayushanjamadaggneh kashshyapasyatryayusham || yaddeveshutryayushantanno'stutryayusham
    || || acamanam || om keshavaya namah svaha | om narayanaya namah svaha | om madhavaya namah svaha
    | om govindaya namah | hastam prakshalya || atha devatanamaskarah || om vishnave namah| om madhusudanaya
    namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah| om rishikeshaya namah |
    om padmanabhaya namah | om damodakaraya namah | om samkarshanaya namah | om vasudevaya namah| om pradyumnaya
    namah| om aniruddhaya namah om purushottamaya namah | om adhokshajaya namah| om nrisimhaya namah |
    om acyutaya namah| om janardanaya namah| om upendraya namah | om shriharaye namah| om shrikrishnaya
    namah | || viniyogah || om pranavasya parabrahma rishih paramatma devata daivi gayatri chamdah pranayame
    viniyogah || ||pranayamah|| om bhuh om bhuvah om svah om mahah om janah om tapah om satyam om tatsaviturvvarennyambharggo
    devasya dhimahi || dhiyoyonah ppracodayat || om apojyotiraso'mritam brahma bhurbhuvahsvarom || evam
    purakah kumbhakah recakah iti kramena trivaram pathet || shikhabandhanam || om manastoka iti mantrasya
    kutsa rishih jagati chandah eko rudro devata shikhabandhane viniyogah || om manastoketanayemana ayushimanogoshumano'shshveshuririshah||
    manovvirannrudrabhaminovvadhirhavishmmantah sadamitvahavamahe || ||anganyasah || om vishnurvishnuh
    | vak vak pranah pranah cakshuh cakshuh shrotram shrotram nabhih hridayam kantheh mukham shirah shikha
    bahubhyam yashobalam || || marjanam || om apavitrah pavitro va sarvavastham gato'pi va | yah smaretpundarikaksham
    sa bahyabhyantarah shucih || om pavitresthovvaishnavyausaviturvah prasava' uttpunammyacchidrena pavitrena
    suryyasya rashmibhih tasyate pavitrapate pavitra putasya yattkamah punetacchakeyam || || sankalpah
    || om atradya mahamangalyaphalapradamasottamemase amukamase amukapakshe amukatithau amukavasare mamopattaduritakshayartham
    brahmavaptaye pratahsandhyopasanamaham karishye || || bhumiprarthana || || viniyogah || om prithivityasya
    meruprishtha rishih sutalam chandah kurmo devata asane viniyogah || om prithvi tvaya dhrita loka devi
    tvam vishnuna dhrita || tvanca dharaya mam devi pavitram kuru casanam || om kurmaya namah | om sheshaya
    namah | om anantaya namah | || bhutashuddhih || om apasarpantu te bhuta ye bhuta bhumisamsthitah |
    ye bhuta vighnakartaraste nashyantu shivajnaya || apakramantu bhutani pishacah sarvatodisham | sarveshamavirodhena
    sandhyakarma samarambhe ||
  devanagari: षि भस्मानि ॥ ॥ गायत्रिमन्त्रः ॥ ॐ भूर्भुवःस्वः ॐ तत्सवितुर्व्वरेण्ण्यम्भर्ग्गो देवस्य धीमहि
    ॥ धियोयोनः प्प्रचोदयात् ॥ ॐ त्र्यम्बकमित्यस्य वसिष्ठ ऋषिः रुद्रो देवता अनुष्ठुब्छन्दः भस्माभिमन्त्रणे
    विनियोगः ॥ ॐ त्र्ययम्बकँय्यजामहेसुगन्धिम्पुष्ट्टिवर्द्धनम् ॥ उर्व्वारुकमिव बन्धनान्न्मृत्योर्म्मुक्षीयमामृतात्
    ॥ ॐ त्र्यायुषमित्यस्य नारायण ऋषिः रुद्रो देवता उषिणक्छन्दः भस्मधारणे विनियोगः ॥ ॐ त्र्यायुषञ्जमदग्ग्नेः
    कश्श्यपस्यत्र्यायुषम् ॥ यद्देवेषुत्र्यायुषन्तन्नोऽस्तुत्र्यायुषम् ॥ ॥ आचमनम् ॥ ॐ केशवाय नमः स्वाहा
    । ॐ नारायणाय नमः स्वाहा । ॐ माधवाय नमः स्वाहा । ॐ गोविन्दाय नमः । हस्तं प्रक्षाल्य ॥ अथ देवतानमस्कारः
    ॥ ॐ विष्णवे नमः। ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः। ॐ ऋषिकेशाय
    नमः । ॐ पद्मनाभाय नमः । ॐ दमोदकराय नमः । ॐ संकर्षणाय नमः । ॐ वासुदेवाय नमः। ॐ प्रद्युम्नाय नमः। ॐ
    अनिरुद्धाय नमः ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः। ॐ नृसिंहाय नमः । ॐ अच्युताय नमः। ॐ जनार्दनाय
    नमः। ॐ उपेन्द्राय नमः । ॐ श्रीहरये नमः। ॐ श्रीकृष्णाय नमः । ॥ विनियोगः ॥ ॐ प्रणवस्य परब्रह्म ऋषिः
    परमात्मा देवता दैवी गायत्री छंदः प्राणायामे विनियोगः ॥ ॥प्राणायामः॥ ॐ भूः ॐ भुवः ॐ स्वः ॐ महः ॐ जनः
    ॐ तपः ॐ सत्यम् ॐ तत्सवितुर्व्वरेण्ण्यम्भर्ग्गो देवस्य धीमहि ॥ धियोयोनः प्प्रचोदयात् ॥ ॐ आपोज्योतीरसोऽमृतं
    ब्रह्म भूर्भुवःस्वरोम् ॥ एवं पूरकः कुम्भकः रेचकः इति क्रमेण त्रिवारं पठेत् ॥ शिखाबन्धनम् ॥ ॐ मनस्तोक
    इति मन्त्रस्य कुत्स ऋषिः जगती छन्दः एको रुद्रो देवता शिखाबन्धने विनियोगः ॥ ॐ मनस्तोकेतनयेमान आयुषिमानोगोषुमानोऽश्श्वेषुरीरिषः॥
    मानोव्वीरान्न्रुद्रभामिनोव्वधीर्हवीष्म्मन्तः सदामित्वाहवामहे ॥ ॥अङ्गन्यासः ॥ ॐ विष्णुर्विष्णुः । वाक्
    वाक् प्राणः प्राणः चक्षुः चक्षुः श्रोत्रं श्रोत्रं नाभिः हृदयं कण्ठेः मुखं शिरः शिखा बाहुभ्यां यशोबलम्
    ॥ ॥ मार्जनम् ॥ ॐ अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत्पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ ॐ पवित्रेस्थोव्वैष्णव्यौसवितुर्वः प्रसवऽ उत्त्पुनाम्म्यच्छिद्रेण पवित्रेण सूर्य्यस्य रश्मिभिः
    तस्यते पवित्रपते पवित्र पूतस्य यत्त्कामः पुनेतच्छकेयम् ॥ ॥ सङ्कल्पः ॥ ॐ अत्राद्य महामाङ्गल्यफलप्रदमासोत्तमेमासे
    अमुकमासे अमुकपक्षे अमुकतिथौ अमुकवासरे ममोपात्तदुरितक्षयर्थं ब्रह्मवाप्तये प्रातःसन्ध्योपासनमहं करिष्ये
    ॥ ॥ भूमिप्रार्थना ॥ ॥ विनियोगः ॥ ॐ पृथिवीत्यस्य मेरुपृष्ठ ऋषिः सुतलं छन्दः कूर्मो देवता आसने विनियोगः
    ॥ ॐ पृथ्वि त्वया धृता लोका देवि त्वं विष्णुना धृता ॥ त्वञ्च धारय मां देवि पवित्रं कुरु चासनम् ॥ ॐ
    कूर्माय नमः । ॐ शेषाय नमः । ॐ अनन्ताय नमः । ॥ भूतशुद्धिः ॥ ॐ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः
    । ये भूता विघ्नकर्तारस्ते नश्यन्तु शिवाज्ञया ॥ अपक्रमन्तु भूतानि पिशाचाः सर्वतोदिशम् । सर्वेषामविरोधेन
    सन्ध्याकर्म समारम्भे ॥
