id: venkateshvaradvadashapanjarika
category: stotram
name:
  english: venkateshvaradvadashapanjarika
  devanagari: वेन्कटेश्वरद्वादशपन्जरिका
content:
  english: shrivenkateshvara dvadashamanjarikastotram shrirastu || shri kalyana gunollasam cidvilasam
    mahaujasam | sheshadrimastakavasam shrinivasam bhajamahe || 1|| varahavesha bhulokam lakshmimohana
    vigraham | vedanta gocaram devam venkatesham bhajamahe || 2|| sangana marcitakaram prasanna mukhapankajam
    | vishvavishvambharadhisham vrishadrisham bhajamahe || 3|| kanatkanaka veladhyam karuna varunalayam
    | shri vasudeva cinmurtim sheshadrisham bhajamahe || 4|| ghanaghanam sheshadri shikharananda mandiram
    | shritacataka samraksham simhadrisham bhajamahe || 5|| mangaḻatram padmaksham kasturi tilakojjvalam
    | tulasyadi manahpujyam taragana vibhutvame || 6|| svamipushkarini tirtha vasam vyasabhih varnitam
    | svanghrisucita hastabjam satyarupam bhajamahe || 7|| shrimannarayanam shrisham brahmanda vasana
    tatparam | brahmanyam saccidanandam mohatitam bhajamahe || 8|| anjanadrishvaram lokaranjanam muniranjanam
    | bhaktarti bhanjanam bhakta parijatam tamashraye || 9|| bhilli manoharyam satya manantam jagatam
    vibhum | narayanacalapatim satyanandam tamashraye || 10|| caturmukhatryambakadhyam sannutarya kadambakam
    | brahma pramukhanitranam pradhana purushashraye || 11|| shrimatpadmasanagrastha cintitartha pradayikam
    | lokaika nayakam shrimad venkatadrisha mashraye || 12|| venkatadri hareh stotram dvadasha shloka
    samyutam | yahpatheh satatam bhaktya tasyamuktih kare sthita || 13|| sarvapapaharam prahuh venkateshastadocyateh
    | tvannamako venkatadrih smarato venkateshvarah sadyah samsmaranadeva moksha samrajya mapnuyat ||
    14|| venkateshvara padadvandyam prajamisra smaranam sada | bhuyashsharanyome sakshaddevesho bhaktavatsalah
    || 15|| || shri venkateshvara dvadasha manjarika stotram sampurnam ||
  devanagari: श्रीवेङ्कटेश्वर द्वादशमञ्जरिकास्तोत्रम् श्रीरस्तु ॥ श्री कल्याण गुणोल्लासं चिद्विलासं महौजसम्
    । शेषाद्रिमस्तकावासं श्रीनिवासं भजामहे ॥ १॥ वाराहवेष भूलोकं लक्ष्मीमोहन विग्रहम् । वेदान्त गोचरं देवं
    वेङ्कटेशं भजामहे ॥ २॥ साङ्गाना मर्चिताकारं प्रसन्न मुखपङ्कजम् । विश्वविश्वम्भराधीशं वृषाद्रीशं भजामहे
    ॥ ३॥ कनत्कनक वेलाढ्यं करुणा वरुणालयम् । श्री वासुदेव चिन्मूर्तिं शेषाद्रीशं भजामहे ॥ ४॥ घनाघनं शेषाद्रि
    शिखरानन्द मन्दिरम् । श्रितचातक संरक्षं सिंहाद्रीशं भजामहे ॥ ५॥ मङ्गळत्रं पद्माक्षं कस्तूरी तिलकोज्ज्वलम्
    । तुलस्यादि मनःपूज्यं तारागण विभूत्वमे ॥ ६॥ स्वामिपुष्करिणी तीर्थ वासं व्यासाभिः वर्णितम् । स्वाङ्घ्रीसूचित
    हस्ताब्जं सत्यरूपं भजामहे ॥ ७॥ श्रीमन्नारायणं श्रीशं ब्रह्माण्डा वसन तत्परम् । ब्रह्मण्यं सच्चिदानन्दं
    मोहातीतं भजामहे ॥ ८॥ अञ्जनाद्रीश्वरं लोकरञ्जनं मुनिरञ्जनम् । भक्तार्ति भञ्जनं भक्त पारिजातं तमाश्रये
    ॥ ९॥ भिल्ली मनोहर्यं सत्य मनन्तं जगतां विभुम् । नारायणाचलपतिं सत्यानन्दं तमाश्रये ॥ १०॥ चतुर्मुखत्र्यम्बकाढ्यं
    सन्नुतार्य कदम्बकम् । ब्रह्म प्रमुखनित्रानं प्रधान पुरुषाश्रये ॥ ११॥ श्रीमत्पद्मासनाग्रस्थ चिन्तितार्थ
    प्रदायिकम् । लोकैक नायकं श्रीमद् वेङ्कटाद्रीश माश्रये ॥ १२॥ वेङ्कटाद्रि हरेः स्तोत्रं द्वादश श्लोक
    संयुतम् । यःपठेः सततं भक्त्या तस्यमुक्तिः करे स्थिता ॥ १३॥ सर्वपापहरं प्राहुः वेङ्कटेशस्तदोच्यतेः
    । त्वन्नामको वेङ्कटाद्रिः स्मरतो वेङ्कटेश्वरः सद्यः संस्मरणादेव मोक्ष साम्राज्य माप्नुयात् ॥ १४॥ वेङ्कटेश्वर
    पदद्वन्द्यं प्रजामिस्र स्मरणं सदा । भूयाश्शरण्योमे साक्षाद्देवेशो भक्तवत्सलः ॥ १५॥ ॥ श्री वेङ्कटेश्वर
    द्वादश मञ्जरिका स्तोत्रं सम्पूर्णम् ॥
