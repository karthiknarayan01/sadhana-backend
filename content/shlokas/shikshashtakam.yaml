id: shikshashtakam
category: stotram
name:
  english: shikshashtakam
  devanagari: शिक्षाष्टकम्
content:
  english: statrarpita niyamitah smarane na kalah| etadrishi tava kripa bhagavanmamapi durdaivamidrishamihajani
    nanuragah||2|| trinadapi sunicena tarorapi sahishnuna| amanina manadena kirtaniyah sada harih ||3||
    na dhanam na janam na sundarim kavitam va jagadisha kamaye| mama janmani janmanishvare bhavatad bhaktirahaituki
    tvayi||4|| ayi nandatanuja kimkaram patitam mam vishame bhavambudhau| kripaya tava padapamkaja
  devanagari: स्तत्रार्पिता नियमितः स्मरणे न कालः। एतादृशी तव कृपा भगवन्ममापि दुर्दैवमीदृशमिहाजनि नानुरागः॥२॥
    तृणादपि सुनीचेन तरोरपि सहिष्णुना। अमानिना मानदेन कीर्तनीयः सदा हरिः ॥३॥ न धनं न जनं न सुन्दरीं कवितां
    वा जगदीश कामये। मम जन्मनि जन्मनीश्वरे भवताद् भक्तिरहैतुकी त्वयि॥४॥ अयि नन्दतनुज किंकरं पतितं मां विषमे
    भवाम्बुधौ। कृपया तव पादपंकज
meaning: {}
