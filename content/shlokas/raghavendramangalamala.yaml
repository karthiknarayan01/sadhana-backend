id: raghavendramangalamala
category: shataka
name:
  english: raghavendramangalamala
  devanagari: राघवेन्द्रमन्गलमाला
content:
  english: shriraghavendramangalamala raghavendram namaskritya haryanandam gurum tatha | kurve mangalamalam
    shriraghavendrasya tushtaye || 1|| mangalanam nivasaya jaganmangalakarine | mangalaikasvarupaya raghavendraya
    mangalam || 2|| shrijanakinivasaya shrisaketanivasine | nikhilantarnivasaya raghavendraya mangalam
    || 3|| sitakantaya shantayanantapapantakarine | anantaruparupaya raghavendraya mangalam || 4|| prapannanandadatre
    ca prapannarttivinashine | avinashisvarupaya raghavendraya mangalam || 5|| vanchakalpalataramalokabhiramamurttaye
    | sakalapadviramaya raghavendraya mangalam || 6|| sarvavidyadhiradhyayavidyashunyaparatmane | vedavedyanavadyaya
    raghavendraya mangalam || 7|| cidacidbhyam vishishtaya shishtapakshasurakshine | saccidanandarupaya
    raghavendraya mangalam || 8|| brahmane paripurnaya karyakaranarupine | sharngine purnakamaya raghavendraya
    mangalam || 9|| bhaktatantrasvatantraya bhaktabhishtarthadayine | bhaktyamuktipradatre ca raghavendraya
    mangalam || 10|| sarvashaktimate sarvasheshine sarvavedine | sarvasampadvidhatre ca raghavendraya
    mangalam || 11|| tyajyavarjyaya pujyayanantashreyogunabdhaye | sarvesham cittacauraya raghavendraya
    mangalam || 12|| samhartre casyavishvasya kartre bhartre tathaiva ca | kirttanattarayitre ca raghavendraya
    mangalam || 13|| divyadehaya hridyaya divyalankaradharine | divyaparikarayatha raghavendraya mangalam
    || 14|| vyapine'ntarvahishcasya sarvasya jagatah sate | advitiyasvarupaya raghavendraya mangalam ||
    15|| shrikaushalyatanujaya shrisarayuviharine | cakravarttikumaraya raghavendraya mangalam || 16||
    tar̤akaghatine vishvamitrasya yajnarakshine | ahilyoddharakaraya raghavendraya mangalam || 17|| janakaradhitayatha
    shambhucapavibhedine | janakiparinetre ca raghavendraya mangalam || 18|| mithiladhipajamatre mithilamohakarine
    | jamadagnyavijetre ca raghavendraya mangalam || 19|| ancitaya nishadena tirtharajam gataya ca | vanavasena
    hrishtaya raghavendraya mangalam || 20|| citrashaktinidhanaya citrakutaviharine | parnashaladhivasaya
    raghavendraya mangalam || 21|| bharatenanunitaya pituradeshakarine | rakshobadhapratijnatre raghavendraya
    mangalam || 22|| sitasaumitriyuktaya capine banine tatha | kharadushanahantre ca raghavendraya mangalam
    || 23|| maricamrityukaraya shavaryaradhitaya ca | munindrairvihitarcaya raghavendraya mangalam ||
    24|| vanarendrasya mitraya balimuktividhayine | pravarshanadhivasaya raghavendraya mangalam || 25||
    hanumatprarthitayatha hanumatsevitanghraye | hanumatpreshayitre ca raghavendraya mangalam || 26||
    sitashokavimugdhaya sitanveshanakarine | sitayah shokahartre ca raghavendraya mangalam || 27|| vibhishanasharanyaya
    sindhau setuvidhayine || ullanghitasamudraya raghavendraya mangalam || 28|| yolankadhipasamhari lankam
    shritaya yo'dadat | tasmai lankavijetre ca raghavendraya mangalam || 29|| shrimate raghuviraya ranadhiraya
    dhanvine | samabhyadhikashunyaya raghavendraya mangalam || 30|| brahmashambhusurendradi surashreshthastutaya
    ca | kritasitaparikshaya raghavendraya mangalam || 31|| maithilimadhigamyatha pushpakarohine muda
    | ayodhyanandakartre ca raghavendraya mangalam || 32|| svamine koshalendraya ramarajya pravartine
    | rajadhirajarajaya raghavendraya mangalam || 33|| bhumijavallabhayatha bhuminathaya dharmine | danine
    sarvabhaumaya raghavendraya mangalam || 34|| lokabhiramarupaya lokabhiramakarmane | lokabhiramabhavaya
    raghavendraya mangalam || 35|| sitashobhitavamaya sitacittavinodine | sitayah pranarupaya raghavendraya
    mangalam || 36|| jananam svanuraktanamayodhyavasinam satam | mokshapradanakartre ca raghavendraya
    mangalam || 37|| vipariteshu kaleshu kshinabandhoshca bandhave | sarvasvaya svabhaktanam raghavendraya
    mangalam || 38|| kapyasapundarikakshapitakausheya vasase | meghashyamabhiramaya raghavendraya mangalam
    || 39|| anathananca nathaya dharmagodvijarakshine | jagaddhitaya ramaya raghavendraya mangalam ||
    40|| samuddharaya vedanam svasvarupanivedinam | dhritamatsyasvarupaya raghavendraya mangalam || 41||
    devebhyo'mritadanaya mandaracaladharine | kurmavatararupaya raghavendraya mangalam || 42|| vishvambharam
    samuddhartum daityenamalinikritam | dhritavaraharupaya raghavendraya mangalam || 43|| prahladam ca
    pitustrasad gopitvahladakarine | narasimhasvarupaya raghavendraya mangalam || 44|| chalayitva balim
    bhuyodevarajyam pravartitum | dhritavamanarupaya raghavendraya mangalam || 45|| kshiti kshatrakshayam
    kritva brahmanebhyah samarpine | jamadagnyasvarupaya raghavendraya mangalam || 46|| sadhunanca paritratre
    samharya dushtarakshasan | dasharathisvarupaya raghavendraya mangalam || 47|| vamshyalokamano hartre
    gitaya'jnanaharine | dhritakrishnasvarupaya raghavendraya mangalam || 48|| devadvisho'tha sammohya
    shrautadharmasya guptaye | dhritabuddhasvarupaya raghavendraya mangalam || 49|| kalau kali vinashyatha
    kritadharmapravarttine | dhritakalkisvarupaya raghavendraya mangalam || 50|| sarveshamavataranam mulaya
    paramatmane | vibhutimritalokaya raghavendraya mangalam || 51|| anoraniyase tadvanmahato'pimahiyase
    | sarvanushastikaraya raghavendraya mangalam || 52|| adityatulyavarnaya tamasah paravartine | kavaye'cintyarupaya
    raghavendraya mangalam || 53|| sarvahritsannivishtaya smrityutpadavinashine | vedakridvevavandyaya
    raghavendraya mangalam || 54|| namatam svamanaskanam svabhaktanam svayajinam | svapraptih kurvate
    nityam raghavendraya mangalam || 55|| utpattidhvamsashunyaya mrityorapyatha mrityave | aparicchinnarupaya
    raghavendraya mangalam || 56|| satyasya varmane lokasharmane'klishtakarmane | varjyayakleshakarmabhyam
    raghavendraya mangalam || 57|| satyapriyaya satyaya satyakritsatyavedine | satyavishvanidanaya raghavendraya
    mangalam || 58|| asharanyasharanyaya devadevaya vedhase | vyaktashadgunyaceshtaya raghavendraya mangalam
    || 59|| sarvavishvaniyantre ca paramaishvaryashaline | saulabhyagunayuktaya raghavendraya mangalam
    || 60|| sarvebhyo'bhayadatre ca sakridevaprapattitah | upeyopayarupaya raghavendraya mangalam || 61||
    rameti kirttite capi yamadutaughatarjine | bharjitrebhavabijanam raghavendraya mangalam || 62|| bhayabhayavidhatarah
    sarve yacchasane sthitah | tasmai hi nikhileshaya raghavendraya mangalam || 63|| abhayam prinanadyasya
    bhayam yasyavadhiranat | tasmai bhagavatenityam raghavendraya mangalam || 64|| yasyanandavidebhitirvidyate
    na kutashcana | tasma anandayuktaya raghavendraya mangalam || 65|| prananam pranarupaya jyotisham
    jyotishe tatha | suryantarvasashilaya raghavendraya mangalam || 66|| nityanamapi nityo yashcetanananca
    cetanah | tasmai kamapradatre hi raghavendraya mangalam || 67|| cidacittattvadehaya cidacidvyapine
    tatha | cidacittattvabhinnaya raghavendraya mangalam || 68|| sahastrabahupadaya sahastrashirase tatha
    | sahastranananetraya raghavendraya mangalam || 69|| murttamurttasvarupaya tathaikanekamurtaye | duradurasthitayatha
    raghavendraya mangalam || 70|| bhavasantapasantaptajananam khinnacetasam | katakshamritadatre ca raghavendraya
    mangalam || 71|| dehasaundaryasampattya sarvalokanivasinam | sutaram mohakaraya raghavendraya mangalam
    || 72|| ramante yogino yasmin satyanande cidatmani | tasmai sarvabhiramaya raghavendraya mangalam
    || 73|| satvadigunashunyatvannirgunaya mahatmane | sadgunaih sagunayapi raghavendraya mangalam ||
    74|| sarvarcanarcaniyaya sarvebhyah phaladayine | sarvavacakavacyaya raghavendraya mangalam || 75||
    vede ramayane caiva purane bharate tatha | pancaratre ca gitaya raghavendraya mangalam || 76|| nigamairmedhaya
    capi tapasa yo na labhyate | tasmai bhaktyekalabhyaya raghavendraya mangalam || 77|| karmadyaparatantraya
    purnashadgunyamurtaye | acyutayavikaraya raghavendraya mangalam || 78|| shashvad bhaktasamuhasya sadyogakshemavahine
    | pradhanapurusheshaya raghavendraya mangalam || 79|| purushayottamayatha ksharaksharaparaya ca |
    paramatmabhidhanaya raghavendraya mangalam || 80|| yoginam dhyeyavandyaya jneyaya bhavaharine | mahapurushasamjnaya
    raghavendraya mangalam || 81|| vishnave vivudharatijishnave prabhavishnave | sarvalokaikanathaya raghavendraya
    mangalam || 82|| jagato gurave sarvajagadvandyaya dharmine | amoghayudhavrindaya raghavendraya mangalam
    || 83|| vijnanadanashilaya purnavijnanashaline | vijnanadhanarupaya raghavendraya mangalam || 84||
    daivataya ca devanam shrutinam divyacakshushe | yoganetranjanayatha raghavendraya mangalam || 85||
    apadayorupadayapanaye corupanaye | anetrayorunetraya raghavendraya mangalam || 86|| akarnayorukarnaya
    hyadehayorudehine | arupayorurupaya raghavendraya mangalam || 87|| lokaikasetave tadvat sarvalokaikahetave
    | setavebhavapathodhe raghavendraya mangalam || 88|| bhavantyanandino jiva yam rasam prapya shashvatam
    | tasmai rasasvarupaya raghavendraya mangalam || 89|| sasurasya surendrasyasuranam brahmashulinoh
    | aradhyaya narananca raghavendraya mangalam || 90|| pranaya vaishnavananca cintayitre ca kurmavat
    | kalpapadaparupaya raghavendraya mangalam || 91|| nrityati nikhilam vishvam yanmayavashagam sada
    | tasmai cadbhutamayaya raghavendraya mangalam || 92|| tiryate yatprapattyahi daivi maya duratyaya
    | tasmai sharanyavaryaya raghavendraya mangalam || 93|| yam bhajan suduracarah purushashcaiti sadhutam
    | adhamoddharine tasmai raghavendraya mangalam || 94|| yasya smaranamatrena bahyabhyantah shucirbhavet
    | shucinam shucaye tasmai raghavendraya mangalam || 95|| yasya kirtanamatrena nyunamayati purnatam
    | tasmai purnasvarupaya raghavendraya mangalam || 96|| yatseva mokshasaudhasyakantaka rajapaddhatih
    | tasmai sevyavarenyaya raghavendraya mangalam || 97|| srishte vishve pravishyatha namarupavibhajine
    | tatah prak satsvarupaya raghavendraya mangalam || 98|| toshayitre cakoranam bhaktanam murtirashmibhih
    | candraya ramacandraya raghavendraya mangalam || 99|| sarvadharman parityajya sharanagatabhavatah
    | mocayitre ca papebhyo raghavendraya mangalam || 100|| bhasayitre ca bhanvaderbhanukotiprabhavate
    | svayamprakasharupaya raghavendraya mangalam || 101|| samashtisrishtikaraya vyashtisrishtividhayine
    | virincyadyatmarupaya raghavendraya mangalam || 102|| vishvatitaya vishvaya yam maya nativartate
    | mayadhishthayine tasmai raghavendraya mangalam || 103|| niradharaya shaktaya sarvadharaya modine
    | svemahimnisthitayatha raghavendraya mangalam || 104|| dharmarthakamamokshakhyapurusharthapradayine
    | advitiyavadanyaya raghavendraya mangalam || 105|| samyuge jatarosham yam vibhyati vivudhadikah |
    tasmai tejonidhanaya raghavendraya mangalam || 106|| caritrena ca yuktaya sarvabhutahitaya ca | jitakrodhanasuyaya
    raghavendraya mangalam || 107|| kathancidupakarena kritenaikena tushyate | dharmajnaya kritajnaya
    raghavendraya mangalam || 108|| na smaratyatmavattvena yo'paradhashatam kila | tasmai kshamasamudraya
    raghavendraya mangalam || 109|| acaryasarvabhauma shriraghavanandanirmita | bhuyanmangalamaleyam lokamangalakarini
    || 110|| iti durvadadhvantamarttanda jagadguru shriraghavanandacarya siddhasamrat pranita shriraghavendramangalamala
    samapta |
  devanagari: श्रीराघवेन्द्रमङ्गलमाला राघवेन्द्रं नमस्कृत्य हर्यानन्दं गुरुं तथा । कुर्वे मङ्गलमालां श्रीराघवेन्द्रस्य
    तुष्टये ॥ १॥ मङ्गलानां निवासाय जगन्मङ्गलकारिणे । मङ्गलैकस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ २॥ श्रीजानकीनिवासाय
    श्रीसाकेतनिवासिने । निखिलान्तर्निवासाय राघवेन्द्राय मङ्गलम् ॥ ३॥ सीताकान्ताय शान्तायानन्तपापान्तकारिणे
    । अनन्तरूपरूपाय राघवेन्द्राय मङ्गलम् ॥ ४॥ प्रपन्नानन्ददात्रे च प्रपन्नार्त्तिविनाशिने । अविनाशिस्वरूपाय
    राघवेन्द्राय मङ्गलम् ॥ ५॥ वाञ्छाकल्पलतारामलोकाभिराममूर्त्तये । सकलापद्विरामाय राघवेन्द्राय मङ्गलम्
    ॥ ६॥ सर्वविद्याधिराध्यायाविद्याशून्यपरात्मने । वेदवेद्यानवद्याय राघवेन्द्राय मङ्गलम् ॥ ७॥ चिदचिद्भ्यां
    विशिष्टाय शिष्टपक्षसुरक्षिणे । सच्चिदानन्दरूपाय राघवेन्द्राय मङ्गलम् ॥ ८॥ ब्रह्मणे परिपूर्णाय कार्यकारणरूपिणे
    । शार्ङ्गिणे पूर्णकामाय राघवेन्द्राय मङ्गलम् ॥ ९॥ भक्ततन्त्रस्वतन्त्राय भक्ताभीष्टार्थदायिने । भक्त्यामुक्तिप्रदात्रे
    च राघवेन्द्राय मङ्गलम् ॥ १०॥ सर्वशक्तिमते सर्वशेषिणे सर्ववेदिने । सर्वसम्पद्विधात्रे च राघवेन्द्राय
    मङ्गलम् ॥ ११॥ त्याज्यवर्ज्याय पूज्यायानन्तश्रेयोगुणाब्धये । सर्वेषां चित्तचौराय राघवेन्द्राय मङ्गलम्
    ॥ १२॥ संहर्त्रे चास्यविश्वस्य कर्त्रे भर्त्रे तथैव च । कीर्त्तनात्तारयित्रे च राघवेन्द्राय मङ्गलम्
    ॥ १३॥ दिव्यदेहाय हृद्याय दिव्यालङ्कारधारिणे । दिव्यपरिकरायाथ राघवेन्द्राय मङ्गलम् ॥ १४॥ व्यापिनेऽन्तर्वहिश्चास्य
    सर्वस्य जगतः सते । अद्वितीयस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ १५॥ श्रीकौशल्यातनूजाय श्रीसरयूविहारिणे
    । चक्रवर्त्तिकुमाराय राघवेन्द्राय मङ्गलम् ॥ १६॥ ताड़काघातिने विश्वामित्रस्य यज्ञरक्षिणे । अहिल्योद्धारकाराय
    राघवेन्द्राय मङ्गलम् ॥ १७॥ जनकाराधितायाथ शम्भुचापविभेदिने । जानकीपरिणेत्रे च राघवेन्द्राय मङ्गलम्
    ॥ १८॥ मिथिलाधिपजामात्रे मिथिलामोहकारिणे । जामदग्न्यविजेत्रे च राघवेन्द्राय मङ्गलम् ॥ १९॥ अञ्चिताय
    निषादेन तीर्थराजं गताय च । वनवासेन हृष्टाय राघवेन्द्राय मङ्गलम् ॥ २०॥ चित्रशक्तिनिधानाय चित्रकूटविहारिणे
    । पर्णशालाधिवासाय राघवेन्द्राय मङ्गलम् ॥ २१॥ भरतेनानुनीताय पितुरादेशकारिणे । रक्षोबधप्रतिज्ञात्रे
    राघवेन्द्राय मङ्गलम् ॥ २२॥ सीतासौमित्रियुक्ताय चापिने बाणिने तथा । खरदूषणहन्त्रे च राघवेन्द्राय मङ्गलम्
    ॥ २३॥ मारीचमृत्युकाराय शवर्याराधिताय च । मुनीन्द्रैर्विहीतार्चाय राघवेन्द्राय मङ्गलम् ॥ २४॥ वानरेन्द्रस्य
    मित्राय बालिमुक्तिविधायिने । प्रवर्षणाधिवासाय राघवेन्द्राय मङ्गलम् ॥ २५॥ हनुमत्प्रार्थितायाथ हनुमत्सेवितान्घ्रये
    । हनुमत्प्रेषयित्रे च राघवेन्द्राय मङ्गलम् ॥ २६॥ सीताशोकविमुग्धाय सीतान्वेषणकारिणे । सीतायाः शोकहर्त्रे
    च राघवेन्द्राय मङ्गलम् ॥ २७॥ विभीषणशरण्याय सिन्धौ सेतुविधायिने ॥ उल्लङ्घितसमुद्राय राघवेन्द्राय मङ्गलम्
    ॥ २८॥ योलङ्काधिपसंहारी लङ्कां श्रिताय योऽददात् । तस्मै लङ्काविजेत्रे च राघवेन्द्राय मङ्गलम् ॥ २९॥
    श्रीमते रघुवीराय रणधीराय धन्विने । समाभ्यधिकशून्याय राघवेन्द्राय मङ्गलम् ॥ ३०॥ ब्रह्मशम्भुसुरेन्द्रादि
    सुरश्रेष्ठस्तुताय च । कृतसीतापरीक्षाय राघवेन्द्राय मङ्गलम् ॥ ३१॥ मैथिलीमधिगम्याथ पुष्पकारोहिणे मुदा
    । अयोध्यानन्दकर्त्रे च राघवेन्द्राय मङ्गलम् ॥ ३२॥ स्वामिने कोशलेन्द्राय रामराज्य प्रवर्तिने । राजाधिराजराजाय
    राघवेन्द्राय मङ्गलम् ॥ ३३॥ भूमिजावल्लभायाथ भूमिनाथाय धर्मिणे । दानिने सार्वभौमाय राघवेन्द्राय मङ्गलम्
    ॥ ३४॥ लोकाभिरामरूपाय लोकाभिरामकर्मणे । लोकाभिरामभावाय राघवेन्द्राय मङ्गलम् ॥ ३५॥ सीताशोभितवामाय सीताचित्तविनोदिने
    । सीतायाः प्राणरूपाय राघवेन्द्राय मङ्गलम् ॥ ३६॥ जनानां स्वानुरक्तानामयोध्यावासिनां सताम् । मोक्षप्रदानकर्त्रे
    च राघवेन्द्राय मङ्गलम् ॥ ३७॥ विपरितेषु कालेषु क्षीणबन्धोश्च बन्धवे । सर्वस्वाय स्वभक्तानां राघवेन्द्राय
    मङ्गलम् ॥ ३८॥ कप्यासपुण्डरीकाक्षपीतकौशेय वाससे । मेघश्यामाभिरामाय राघवेन्द्राय मङ्गलम् ॥ ३९॥ अनाथानाञ्च
    नाथाय धर्मगोद्विजरक्षिणे । जगद्धिताय रामाय राघवेन्द्राय मङ्गलम् ॥ ४०॥ समुद्धाराय वेदानां स्वस्वरूपनिवेदिनाम्
    । धृतमत्स्यस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ४१॥ देवेभ्योऽमृतदानाय मन्दराचलधारिणे । कूर्मावताररूपाय
    राघवेन्द्राय मङ्गलम् ॥ ४२॥ विश्वम्भरां समुद्धर्तुं दैत्येनमलिनीकृताम् । धृतवाराहरूपाय राघवेन्द्राय
    मङ्गलम् ॥ ४३॥ प्रह्लादं च पितुस्त्रासाद् गोपित्वाह्लादकारिणे । नरसिंहस्वरूपाय राघवेन्द्राय मङ्गलम्
    ॥ ४४॥ छलयित्वा बलिं भूयोदेवराज्यं प्रवर्तितुम् । धृतवामनरूपाय राघवेन्द्राय मङ्गलम् ॥ ४५॥ क्षिति क्षत्रक्षयं
    कृत्वा ब्राह्मणेभ्यः समर्पिणे । जामदग्न्यस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ४६॥ साधूनाञ्च परित्रात्रे
    संहार्य दुष्टराक्षसान् । दाशरथिस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ४७॥ वंश्यालोकमनो हर्त्रे गीतयाऽज्ञानहारिणे
    । धृतकृष्णस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ४८॥ देवद्विषोऽथ सम्मोह्य श्रौतधर्मस्य गुप्तये । धृतबुद्धस्वरूपाय
    राघवेन्द्राय मङ्गलम् ॥ ४९॥ कलौ कलि विनाश्याथ कृतधर्मप्रवर्त्तिने । धृतकल्किस्वरूपाय राघवेन्द्राय मङ्गलम्
    ॥ ५०॥ सर्वेषामवताराणां मूलाय परमात्मने । विभूतिमृतलोकाय राघवेन्द्राय मङ्गलम् ॥ ५१॥ अणोरणीयसे तद्वन्महतोऽपिमहीयसे
    । सर्वानुशास्तिकाराय राघवेन्द्राय मङ्गलम् ॥ ५२॥ आदित्यतुल्यवर्णाय तमसः पारवर्तिने । कवयेऽचिन्त्यरूपाय
    राघवेन्द्राय मङ्गलम् ॥ ५३॥ सर्वहृत्सन्निविष्टाय स्मृत्युत्पादविनाशिने । वेदकृद्वेववन्द्याय राघवेन्द्राय
    मङ्गलम् ॥ ५४॥ नमतां स्वमनस्कानां स्वभक्तानां स्वयाजिनाम् । स्वप्राप्तिः कुर्वते नित्यां राघवेन्द्राय
    मङ्गलम् ॥ ५५॥ उत्पत्तिध्वंसशून्याय मृत्योरप्यथ मृत्यवे । अपरिच्छिन्नरूपाय राघवेन्द्राय मङ्गलम् ॥ ५६॥
    सत्यस्य वर्मणे लोकशर्मणेऽक्लिष्टकर्मणे । वर्ज्यायक्लेशकर्माभ्यां राघवेन्द्राय मङ्गलम् ॥ ५७॥ सत्यप्रियाय
    सत्याय सत्यकृत्सत्यवेदिने । सत्यविश्वनिदानाय राघवेन्द्राय मङ्गलम् ॥ ५८॥ अशरण्यशरण्याय देवदेवाय वेधसे
    । व्यक्तषाड्गुण्यचेष्टाय राघवेन्द्राय मङ्गलम् ॥ ५९॥ सर्वविश्वनियन्त्रे च परमैश्वर्यशालिने । सौलभ्यगुणयुक्ताय
    राघवेन्द्राय मङ्गलम् ॥ ६०॥ सर्वेभ्योऽभयदात्रे च सकृदेवप्रपत्तितः । उपेयोपायरूपाय राघवेन्द्राय मङ्गलम्
    ॥ ६१॥ रामेति कीर्त्तिते चापि यमदूतौघतर्जिने । भर्जित्रेभवबीजानां राघवेन्द्राय मङ्गलम् ॥ ६२॥ भयाभयविधातारः
    सर्वे यच्छासने स्थिताः । तस्मै हि निखिलेशाय राघवेन्द्राय मङ्गलम् ॥ ६३॥ अभयं प्रीणनाद्यस्य भयं यस्यावधीरणात्
    । तस्मै भगवतेनित्यं राघवेन्द्राय मङ्गलम् ॥ ६४॥ यस्यानन्दविदेभीतिर्विद्यते न कुतश्चन । तस्मा आनन्दयुक्ताय
    राघवेन्द्राय मङ्गलम् ॥ ६५॥ प्राणानां प्राणरूपाय ज्योतिषां ज्योतिषे तथा । सूर्यान्तर्वासशीलाय राघवेन्द्राय
    मङ्गलम् ॥ ६६॥ नित्यानामपि नित्यो यश्चेतनानाञ्च चेतनः । तस्मै कामप्रदात्रे हि राघवेन्द्राय मङ्गलम्
    ॥ ६७॥ चिदचित्तत्त्वदेहाय चिदचिद्व्यापिने तथा । चिदचित्तत्त्वभिन्नाय राघवेन्द्राय मङ्गलम् ॥ ६८॥ सहस्त्रबाहुपादाय
    सहस्त्रशिरसे तथा । सहस्त्रानननेत्राय राघवेन्द्राय मङ्गलम् ॥ ६९॥ मूर्त्तामूर्त्तस्वरूपाय तथैकानेकमूर्तये
    । दूरादूरस्थितायाथ राघवेन्द्राय मङ्गलम् ॥ ७०॥ भवसन्तापसन्तप्तजनानां खिन्नचेतसाम् । कटाक्षामृतदात्रे
    च राघवेन्द्राय मङ्गलम् ॥ ७१॥ देहसौन्दर्यसम्पत्त्या सर्वलोकनिवासिनाम् । सुतरां मोहकाराय राघवेन्द्राय
    मङ्गलम् ॥ ७२॥ रमन्ते योगिनो यस्मिन् सत्यानन्दे चिदात्मनि । तस्मै सर्वाभिरामाय राघवेन्द्राय मङ्गलम्
    ॥ ७३॥ सत्वादिगुणशून्यत्वान्निर्गुणाय महात्मने । सद्गुणैः सगुणायापि राघवेन्द्राय मङ्गलम् ॥ ७४॥ सर्वार्चनार्चनीयाय
    सर्वेभ्यः फलदायिने । सर्ववाचकवाच्याय राघवेन्द्राय मङ्गलम् ॥ ७५॥ वेदे रामायणे चैव पुराणे भारते तथा
    । पाञ्चरात्रे च गीताय राघवेन्द्राय मङ्गलम् ॥ ७६॥ निगमैर्मेधया चापि तपसा यो न लभ्यते । तस्मै भक्त्येकलभ्याय
    राघवेन्द्राय मङ्गलम् ॥ ७७॥ कर्माद्यपरतन्त्राय पूर्णषाड्गुण्यमूर्तये । अच्युतायाविकाराय राघवेन्द्राय
    मङ्गलम् ॥ ७८॥ शश्वद् भक्तसमूहस्य सद्योगक्षेमवाहिने । प्रधानपुरुषेशाय राघवेन्द्राय मङ्गलम् ॥ ७९॥ पुरुषायोत्तमायाथ
    क्षराक्षरपराय च । परमात्माभिधानाय राघवेन्द्राय मङ्गलम् ॥ ८०॥ योगिनां ध्येयवन्द्याय ज्ञेयाय भवहारिणे
    । महापुरुषसंज्ञाय राघवेन्द्राय मङ्गलम् ॥ ८१॥ विष्णवे विवुधारातिजिष्णवे प्रभविष्णवे । सर्वलोकैकनाथाय
    राघवेन्द्राय मङ्गलम् ॥ ८२॥ जगतो गुरवे सर्वजगद्वन्द्याय धर्मिणे । अमोघायुधवृन्दाय राघवेन्द्राय मङ्गलम्
    ॥ ८३॥ विज्ञानदानशीलाय पूर्णविज्ञानशालिने । विज्ञानधनरूपाय राघवेन्द्राय मङ्गलम् ॥ ८४॥ दैवताय च देवानां
    श्रुतीनां दिव्यचक्षुषे । योगनेत्राञ्जनायाथ राघवेन्द्राय मङ्गलम् ॥ ८५॥ अपादायोरूपादायापाणये चोरूपाणये
    । अनेत्रायोरुनेत्राय राघवेन्द्राय मङ्गलम् ॥ ८६॥ अकर्णायोरुकर्णाय ह्यदेहायोरुदेहिने । अरुपायोरुरूपाय
    राघवेन्द्राय मङ्गलम् ॥ ८७॥ लोकैकसेतवे तद्वत् सर्वलोकैकहेतवे । सेतवेभवपाथोधे राघवेन्द्राय मङ्गलम् ॥
    ८८॥ भवन्त्यानन्दिनो जीवा यं रसं प्राप्य शाश्वतम् । तस्मै रसस्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ८९॥ ससुरस्य
    सुरेन्द्रस्यासुराणां ब्रह्मशूलिनोः । आराध्याय नराणाञ्च राघवेन्द्राय मङ्गलम् ॥ ९०॥ प्राणाय वैष्णवानाञ्च
    चिन्तयित्रे च कूर्मवत् । कल्पपादपरूपाय राघवेन्द्राय मङ्गलम् ॥ ९१॥ नृत्यति निखिलं विश्वं यन्मायावशगं
    सदा । तस्मै चाद्भुतमायाय राघवेन्द्राय मङ्गलम् ॥ ९२॥ तीर्यते यत्प्रपत्त्याहि दैवी माया दुरत्यया । तस्मै
    शरण्यवर्याय राघवेन्द्राय मङ्गलम् ॥ ९३॥ यं भजन् सुदुराचारः पुरुषश्चैति साधुताम् । अधमोद्धारिणे तस्मै
    राघवेन्द्राय मङ्गलम् ॥ ९४॥ यस्य स्मरणमात्रेण बाह्याभ्यन्तः शुचिर्भवेत् । शुचीनां शुचये तस्मै राघवेन्द्राय
    मङ्गलम् ॥ ९५॥ यस्य कीर्तनमात्रेण न्यूनमायाति पूर्णताम् । तस्मै पूर्णस्वरूपाय राघवेन्द्राय मङ्गलम्
    ॥ ९६॥ यत्सेवा मोक्षसौधस्याकण्टका राजपद्धतिः । तस्मै सेव्यवरेण्याय राघवेन्द्राय मङ्गलम् ॥ ९७॥ सृष्टे
    विश्वे प्रविश्याथ नामरूपविभाजिने । ततः प्राक् सत्स्वरूपाय राघवेन्द्राय मङ्गलम् ॥ ९८॥ तोषयित्रे चकोराणां
    भक्तानां मूर्तिरश्मिभिः । चन्द्राय रामचन्द्राय राघवेन्द्राय मङ्गलम् ॥ ९९॥ सर्वधर्मान् परित्यज्य शरणागतभावतः
    । मोचयित्रे च पापेभ्यो राघवेन्द्राय मङ्गलम् ॥ १००॥ भासयित्रे च भान्वादेर्भानुकोटिप्रभावते । स्वयम्प्रकाशरूपाय
    राघवेन्द्राय मङ्गलम् ॥ १०१॥ समष्टिसृष्टिकराय व्यष्टिसृष्टिविधायिने । विरिञ्च्याद्यात्मरूपाय राघवेन्द्राय
    मङ्गलम् ॥ १०२॥ विश्वातीताय विश्वाय यं माया नातिवर्तते । मायाधिष्ठायिने तस्मै राघवेन्द्राय मङ्गलम्
    ॥ १०३॥ निराधाराय शक्ताय सर्वाधाराय मोदिने । स्वेमहिम्निस्थितायाथ राघवेन्द्राय मङ्गलम् ॥ १०४॥ धर्मार्थकाममोक्षाख्यपुरुषार्थप्रदायिने
    । अद्वितीयवदान्याय राघवेन्द्राय मङ्गलम् ॥ १०५॥ संयुगे जातरोषं यं विभ्यति विवुधादिकाः । तस्मै तेजोनिधानाय
    राघवेन्द्राय मङ्गलम् ॥ १०६॥ चारित्रेण च युक्ताय सर्वभूतहिताय च । जितक्रोधानसूयाय राघवेन्द्राय मङ्गलम्
    ॥ १०७॥ कथञ्चिदुपकारेण कृतेनैकेन तुष्यते । धर्मज्ञाय कृतज्ञाय राघवेन्द्राय मङ्गलम् ॥ १०८॥ न स्मरत्यात्मवत्त्वेन
    योऽपराधशतं किल । तस्मै क्षमासमुद्राय राघवेन्द्राय मङ्गलम् ॥ १०९॥ आचार्यसार्वभौम श्रीराघवानन्दनिर्मिता
    । भूयान्मङ्गलमालेयं लोकमङ्गलकारिणी ॥ ११०॥ इति दुर्वादध्वान्तमार्त्तण्ड जगद्गुरु श्रीराघवानन्दाचार्य
    सिद्धसंराट् प्रणीता श्रीराघवेन्द्रमङ्गलमाला समाप्ता ।
