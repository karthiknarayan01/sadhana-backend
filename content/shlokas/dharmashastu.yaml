id: dharmashastu
category: stotram
name:
  english: dharmashastu
  devanagari: धर्मशस्तु
content:
  english: shridharmashastuh pancaratnam lokaviram mahapujyam sarvarakshakaram vibhum | parvatihridayanandam
    shastaram pranamamyaham || 1|| viprapujyam vishvavandyam vishnushambhoh priyam sutam | kshipraprasadaniratam
    shastaram pranamamyaham || 2|| mattamatangagamanam karunyamritapuritam | sarvavighnaharam devam shastaram
    pranamamyaham || 3|| asmatkuleshvaram devamasmacchatruvinashanam | asmadishtapradataram shastaram
    pranamamyaham || 4|| pandyeshavamshatilakam kerale kelivigraham | artatranaparam devam shastaram pranamamyaham
    || 5|| pancaratnakhyametadyo nityam shuddhah pathennarah | tasya prasanno bhagavan shasta vasati manase
    || || iti shri dharmashastuhpancaratnam samaptam ||
  devanagari: श्रीधर्मशास्तुः पञ्चरत्नम् लोकवीरं महापूज्यं सर्वरक्षाकरं विभुम् । पार्वतीहृदयानन्दं शास्तारं
    प्रणमाम्यहम् ॥ १॥ विप्रपूज्यं विश्ववन्द्यं विष्णुशम्भोः प्रियं सुतम् । क्षिप्रप्रसादनिरतं शास्तारं
    प्रणमाम्यहम् ॥ २॥ मत्तमातङ्गगमनं कारुण्यामृतपूरितम् । सर्वविघ्नहरं देवं शास्तारं प्रणमाम्यहम् ॥ ३॥
    अस्मत्कुलेश्वरं देवमस्मच्छत्रुविनाशनम् । अस्मदिष्टप्रदातारं शास्तारं प्रणमाम्यहम् ॥ ४॥ पाण्ड्येशवंशतिलकं
    केरले केलिविग्रहम् । आर्तत्राणपरं देवं शास्तारं प्रणमाम्यहम् ॥ ५॥ पञ्चरत्नाख्यमेतद्यो नित्यं शुद्धः
    पठेन्नरः । तस्य प्रसन्नो भगवान् शास्ता वसति मानसे ॥ ॥ इति श्री धर्मशास्तुःपञ्चरत्नं समाप्तम् ॥
