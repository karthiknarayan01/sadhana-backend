id: brihaspatikritam1shivastotram
category: stotram
name:
  english: brihaspatikritam1shivastotram
  devanagari: बृहस्पतिकृतं१शिवस्तोत्रम्
content:
  english: tiranantarupamonkaramatram prakriteh param yat | cidrupamanandamayam samastamevam vadantisha
    mumukshavastvam || 74|| aradhayantyatra bhavantamisham mahamakhaih pancabhirapyakamah | samsarasindhoh
    paramaptakama vishanti divyam bhuvanam vapuste || 75|| sarveshu sattveshu samatvabuddhya samvikshya
    shatsurmishu shantabhavah | jnanena te karmaphalani hitva dhyanena te tvam pravishanti shambho ||
    76|| na jati dharmani na vedashastram na dhyanayogo na samadhidharmah | rudram shivam shankaram shantacittam
    bhaktya devam somamaham namasye || 77|| murkho'pi shambho tava padabhaktya samapnuyanmuktimayim tanum
    te | jnaneshu yajneshu tapahsu caiva dhyaneshu homeshu mahaphaleshu || 78|| sampannametatphalamuttamam
    yatsomeshvare bhaktiraharnisham yat | svargasya jivasya sada priyasya phalasya drishtasya tatha shrutasya
    || 79|| svargasya mokshasya jagannivasa sopanapanktistava bhaktiresha | tvatpadasampraptiphalaptaye
    tu sopanapanktim na vadanti dhirah || 80|| tasmaddayalo mama bhaktirastu naivastyupayastava rupaseva
    | atmiyamalokya mahattvamisha papeshu casmasu kuru prasadam || 81|| sthulam ca sukshmam tvamanadi
    nityam pita ca mata yadasacca sacca | evam stuto yah shrutibhih puranairnamami someshvaramishitaram
    || 82|| iti brahmapurane dvavimshadhikashatatamadhyayantargatam brihaspatikritam shivastotram samaptam
    | brahmapurana | adhyaya 122
  devanagari: तिरनन्तरूपमोङ्कारमात्रं प्रकृतेः परं यत् । चिद्रूपमानन्दमयं समस्तमेवं वदन्तीश मुमुक्षवस्त्वाम्
    ॥ ७४॥ आराधयन्त्यत्र भवन्तमीशं महामखैः पञ्चभिरप्यकामाः । संसारसिन्धोः परमाप्तकामा विशन्ति दिव्यं भुवनं
    वपुस्ते ॥ ७५॥ सर्वेषु सत्त्वेषु समत्वबुद्ध्या संवीक्ष्य षट्सूर्मिषु शान्तभावाः । ज्ञानेन ते कर्मफलानि
    हित्वा ध्यानेन ते त्वां प्रविशन्ति शम्भो ॥ ७६॥ न जाति धर्माणि न वेदशास्त्रं न ध्यानयोगो न समाधिधर्मः
    । रुद्रं शिवं शङ्करं शान्तचित्तं भक्त्या देवं सोममहं नमस्ये ॥ ७७॥ मूर्खोऽपि शम्भो तव पादभक्त्या समाप्नुयान्मुक्तिमयीं
    तनुं ते । ज्ञानेषु यज्ञेषु तपःसु चैव ध्यानेषु होमेषु महाफलेषु ॥ ७८॥ सम्पन्नमेतत्फलमुत्तमं यत्सोमेश्वरे
    भक्तिरहर्निशं यत् । स्वर्गस्य जीवस्य सदा प्रियस्य फलस्य दृष्टस्य तथा श्रुतस्य ॥ ७९॥ स्वर्गस्य मोक्षस्य
    जगन्निवास सोपानपङ्क्तिस्तव भक्तिरेषा । त्वत्पादसम्प्राप्तिफलाप्तये तु सोपानपङ्क्तिं न वदन्ति धीराः
    ॥ ८०॥ तस्माद्दयालो मम भक्तिरस्तु नैवास्त्युपायस्तव रूपसेवा । आत्मीयमालोक्य महत्त्वमीश पापेषु चास्मासु
    कुरु प्रसादम् ॥ ८१॥ स्थूलं च सूक्ष्मं त्वमनादि नित्यं पिता च माता यदसच्च सच्च । एवं स्तुतो यः श्रुतिभिः
    पुराणैर्नमामि सोमेश्वरमीशितारम् ॥ ८२॥ इति ब्रह्मपुराणे द्वाविंशाधिकशततमाध्यायान्तर्गतं बृहस्पतिकृतं
    शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १२२
