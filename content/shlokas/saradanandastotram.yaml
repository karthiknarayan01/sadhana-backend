id: saradanandastotram
category: stotram
name:
  english: saradanandastotram
  devanagari: सारदानन्दस्तोत्रम्
content:
  english: '| ityevam ghoshayantam tam matrimurtidrisham namah || 2|| kritsnam sangham dharayantam vasukimiva
    murdhani | prakashayantam nityam ca lilagrantham janeshu vai || 3|| pariveshya tu tallilam janeshuccavaceshu
    ca | anandayantam bhaktamstan bhagavatpremavigraham || 4|| purayantam ca bhaktanam bhaktitrishnam
    sudurlabham | tam vande saradanandam sharadamatrisevakam || 5|| jnanayogasya yogasya bhaktiyogasya
    karmanam | murtam vigraharupam tam namami shreshthapurusham || 6|| karunasindhurupam tam sarvanandavivardhanam
    | tam naumi saradanandam svaminam bhaktibhavatah || 7|| saradanandadevam ye smaranti shraddhayanvitah
    | prapnuvantyeva te muktim karamalakavacchubham || 8|| iti adhyapakapanditashrikumudaranjanagosvamitarkavedantatirthaviracitam'
  devanagari: । इत्येवं घोषयन्तं तं मातृमूर्तिदृशं नमः ॥ २॥ कृत्स्नं सङ्घं धारयन्तं वासुकिमिव मूर्धनि
    । प्रकाशयन्तं नित्यं च लीलाग्रन्थं जनेषु वै ॥ ३॥ परिवेश्य तु तल्लीलां जनेषूच्चावचेषु च । आनन्दयन्तं
    भक्तांस्तान् भगवत्प्रेमविग्रहाम् ॥ ४॥ पूरयन्तं च भक्तानां भक्तितृष्णां सुदुर्लभाम् । तं वन्दे सारदानन्दं
    शारदामातृसेवकम् ॥ ५॥ ज्ञानयोगस्य योगस्य भक्तियोगस्य कर्मणाम् । मूर्तं विग्रहरूपं तं नमामि श्रेष्ठपूरुषम्
    ॥ ६॥ करुणासिन्धुरूपं तं सर्वानन्दविवर्धनम् । तं नौमि सारदानन्दं स्वामिनं भक्तिभावतः ॥ ७॥ सारदानन्ददेवं
    ये स्मरन्ति श्रद्धयान्विताः । प्राप्नुवन्त्येव ते मुक्तिं करामलकवच्छुभाम् ॥ ८॥ इति अध्यापकपण्डितश्रीकुमुदरञ्जनगोस्वामीतर्कवेदान्ततीर्थविरचितं
