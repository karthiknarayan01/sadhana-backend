id: kanvamaharshinakritamgangastotram-09
category: stotram
name:
  english: kanvamaharshinakritamgangastotram 09
  devanagari: कण्वमहर्षिणाकृतंगन्गास्तोत्रम् ०९
content:
  english: kanvamaharshina kritam gangastotram 9 kanva uvaca | namo'stu gange paramartiharini namah kshudhe
    sarvajanartikarini | namo maheshanajatodbhave shubhe namo mahamrityumukhadvinihsrite || 8|| punyatmanam
    shantarupe krodharupe duratmanam | saridrupena sarvesham tapapapapaharini || 9|| kshudharupena sarvesham
    tapapapaprade namah | namah shreyaskari devi namah papapratardini | namah shantikari devi namo daridryanashini
    || 10|| brahovaca | ityevam stuvatastasya purastadabhavaddvayam | ekam gangam manohari hyaparam bhishanakriti
    | namah kritanjalirbhutva namaskritva dvijottamah || 11|| kanva uvaca | sarvamangalamangalye brahmi
    maheshvari shubhe | vaishnavi tryambake devi godavari namo'stu te || 12|| tryambakasya jatodbhute
    gautamasyaghanashini | saptadha sagaram yanti godavari namo'stu te || 13|| sarvapapakritam pape dharmakamarthanashini
    | duhkhalobhamayi devi kshudhe tubhyam namo namah || 14|| iti brahmapurane pancashityadhyayantargatam
    kanvamaharshikritam gangastotram samaptam | brahmapurana | adhyaya 85
  devanagari: कण्वमहर्षिणा कृतं गङ्गास्तोत्रम् ९ कण्व उवाच । नमोऽस्तु गङ्गे परमार्तिहारिणि नमः क्षुधे
    सर्वजनार्तिकारिणि । नमो महेशानजटोद्भवे शुभे नमो महामृत्युमुखाद्विनिःसृते ॥ ८॥ पुण्यात्मनां शान्तरूपे
    क्रोधरूपे दुरात्मनाम् । सरिद्रूपेण सर्वेषां तापपापापहारिणि ॥ ९॥ क्षुधारूपेण सर्वेषां तापपापप्रदे नमः
    । नमः श्रेयस्करि देवि नमः पापप्रतर्दिनि । नमः शान्तिकरि देवि नमो दारिद्र्यनाशिनि ॥ १०॥ ब्रहोवाच ।
    इत्येवं स्तुवतस्तस्य पुरस्तादभवद्द्वयम् । एकं गाङ्गं मनोहारि ह्यपरं भीषणाकृति । नमः कृताञ्जलिर्भूत्वा
    नमस्कृत्वा द्विजोत्तमः ॥ ११॥ कण्व उवाच । सर्वमङ्गलमङ्गल्ये ब्राह्मि माहेश्वरि शुभे । वैष्णवि त्र्यम्बके
    देवि गोदावरि नमोऽस्तु ते ॥ १२॥ त्र्यम्बकस्य जटोद्भूते गौतमस्याघनाशिनि । सप्तधा सागरं यान्ति गोदावरि
    नमोऽस्तु ते ॥ १३॥ सर्वपापकृतां पापे धर्मकामार्थनाशिनि । दुःखलोभमयि देवि क्षुधे तुभ्यं नमो नमः ॥ १४॥
    इति ब्रह्मपुराणे पञ्चाशीत्यध्यायान्तर्गतं कण्वमहर्षिकृतं गङ्गास्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय
    ८५
