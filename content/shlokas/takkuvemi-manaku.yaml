id: takkuvemi-manaku
category: stotram
name:
  english: Takkuvemi Manaku
content:
  english: takkuvemi manaku ramum dòkkadundu varaku prakkatoduga bhagavantudu mana cakradhariyai cèntanè
    undaga || || takkuvemi manaku || mruccusomakuni munu jampina a matsamurti manapakshamunundaga || ||
    takkuvemi manaku || bhumisvargamulu pònduga gòlacina vamanundu manavadai yundaga || || takkuvemi manaku
    || dashagrivumuni dandincina a dhasharadha ramuni daya manakundaga || || takkuvemi manaku || dushtakamsuni
    duncinatti shri krishnudu manapai gripato nundaga || || takkuvemi manaku || ramadasuni gacèdi shri
    mannarayani nèranammiyundaga ||
  devanagari: तक्कुवेमि मनकू रामुं डॊक्कडुण्डु वरकू प्रक्कतोडुगा भगवन्तुडु मन चक्रधारियै चॆन्तनॆ उण्डगा
    ॥ ॥ तक्कुवेमि मनकू ॥ म्रुच्चुसोमकुनि मुनु जम्पिन आ मत्समूर्ति मनपक्षमुनुण्डगा ॥ ॥ तक्कुवेमि मनकू ॥
    भूमिस्वर्गमुलु पॊन्दुग गॊलचिन वामनुण्डु मनवाडै युण्डग ॥ ॥ तक्कुवेमि मनकू ॥ दशग्रीवुमुनि दण्डिञ्चिन
    आ धशरध रामुनि दय मनकुण्डग ॥ ॥ तक्कुवेमि मनकू ॥ दुष्टकंसुनी दुञ्चिनट्टि श्री कृष्णुडु मनपै गृपतो नुण्डग
    ॥ ॥ तक्कुवेमि मनकू ॥ रामदासुनि गाचॆडि श्री मन्नारायणि नॆरनम्मियुण्डग ॥
