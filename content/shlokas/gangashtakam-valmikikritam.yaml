id: gangashtakam-valmikikritam
category: stotram
name:
  english: gangashtakam (valmikikritam)
  devanagari: गङ्गाष्टकम् (वाल्मीकिकृतम्)
content:
  english: vaijayanti bhavatim bhagirathim prarthaye | tvattire vasatah tvadambu pibatastvadvicishu prenkhatah
    tvannama smaratastvadarpitadrishah syanme shariravyayah || 1|| tvattire tarukotarantaragato gange
    vihango param tvannire narakantakarini varam matsyo'thava kacchapah | naivanyatra madandhasindhuraghatasanghattaghantarana
  devanagari: वैजयन्ति भवतीं भागीरथीं प्रार्थये । त्वत्तीरे वसतः त्वदम्बु पिबतस्त्वद्वीचिषु प्रेङ्खतः
    त्वन्नाम स्मरतस्त्वदर्पितदृशः स्यान्मे शरीरव्ययः ॥ १॥ त्वत्तीरे तरुकोटरान्तरगतो गङ्गे विहङ्गो परं
    त्वन्नीरे नरकान्तकारिणि वरं मत्स्योऽथवा कच्छपः । नैवान्यत्र मदान्धसिन्धुरघटासङ्घट्टघण्टारण
meaning: {}
