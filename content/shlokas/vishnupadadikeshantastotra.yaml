id: vishnupadadikeshantastotra
category: stotram
name:
  english: vishnupadadikeshantastotra
  devanagari: विष्णुपादादिकेशान्तस्तोत्र
content:
  english: vagbhugauryadibhedairviduriha munayo yam yadiyaishca pumsam karunyardraih katakshaih sakridapi
    patitaih sampadah syuh samagrah | kundendusvacchamandasmitamadhuramukhambhoruham sundarangim vande
    vandyamaseshairapi murabhiduromandiramindiram tam || 8 || anvayah
  devanagari: वाग्भूगौर्यादिभेदैर्विदुरिह मुनयो यां यदीयैश्च पुंसाम् कारुण्यार्द्रैः कटाक्षैः सकृदपि पतितैः
    सम्पदः स्युः समग्राः । कुन्देन्दुस्वच्छमन्दस्मितमधुरमुखाम्भोरुहां सुन्दराङ्गीम् वन्दे वन्द्यामसेषैरपि
    मुरभिदुरोमन्दिरामिन्दिरां ताम् ॥ ८ ॥ अन्वयः
meaning: {}
