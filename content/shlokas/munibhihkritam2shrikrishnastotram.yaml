id: munibhihkritam2shrikrishnastotram
category: stotram
name:
  english: munibhihkritam2shrikrishnastotram
  devanagari: मुनिभिःकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: munibhih kritam 2 shrikrishnastotram munaya ucuh | yanmayaya tattvaviduttama vayam vimohita
    vishvasrijamadhishvarah | yadishitavyayati gudha ihaya aho vicitram bhagavadviceshtitam || 16|| aniha
    etadbahudhaika atmana srijatyavatyatti na badhyate yatha | bhaumairhi bhumirbahunamarupini aho vibhumnashcaritam
    vidambanam || 17|| athapi kale svajanabhiguptaye bibharshi sattvam khalanigrahaya ca | svalilaya vedapatham
    sanatanam varnashramatma purushah paro bhavan || 18|| brahma te hridayam shuklam tapahsvadhyayasamyamaih
    | yatropalabdham sadvyaktamavyaktam ca tatah param || 19|| tasmadbrahmakulam brahman shastrayonestvamatmanah
    | sabhajayasi saddhama tadbrahmanyagranirbhavan || 20|| adya no janmasaphalyam vidyayastapaso drishah
    | tvaya sangamya sadgatya yadantah shreyasam parah || 21|| namastasmai bhagavate krishnayakunthamedhase
    | svayogamayayacchannamahimne paramatmane || 22|| na yam vidantyami bhupa ekaramashca vrishnayah |
    mayajavanikacchannamatmanam kalamishvaram || 23|| yatha shayanah purusha atmanam gunatattvadrik |
    namamatrendriyabhatam na veda rahitam param || 24|| evam tva namamatreshu vishayeshvindriyehaya |
    mayaya vibhramaccitto na veda smrityupaplavat || 25|| tasyadya te dadrishimanghrimaghaughamarsha
  devanagari: मुनिभिः कृतं २ श्रीकृष्णस्तोत्रम् मुनय ऊचुः । यन्मायया तत्त्वविदुत्तमा वयं विमोहिता विश्वसृजामधीश्वराः
    । यदीशितव्यायति गूढ ईहया अहो विचित्रं भगवद्विचेष्टितम् ॥ १६॥ अनीह एतद्बहुधैक आत्मना सृजत्यवत्यत्ति
    न बध्यते यथा । भौमैर्हि भूमिर्बहुनामरूपिणी अहो विभूम्नश्चरितं विडम्बनम् ॥ १७॥ अथापि काले स्वजनाभिगुप्तये
    बिभर्षि सत्त्वं खलनिग्रहाय च । स्वलीलया वेदपथं सनातनं वर्णाश्रमात्मा पुरुषः परो भवान् ॥ १८॥ ब्रह्म
    ते हृदयं शुक्लं तपःस्वाध्यायसंयमैः । यत्रोपलब्धं सद्व्यक्तमव्यक्तं च ततः परम् ॥ १९॥ तस्माद्ब्रह्मकुलं
    ब्रह्मन् शास्त्रयोनेस्त्वमात्मनः । सभाजयसि सद्धाम तद्ब्रह्मण्याग्रणीर्भवान् ॥ २०॥ अद्य नो जन्मसाफल्यं
    विद्यायास्तपसो दृशः । त्वया सङ्गम्य सद्गत्या यदन्तः श्रेयसां परः ॥ २१॥ नमस्तस्मै भगवते कृष्णायाकुण्ठमेधसे
    । स्वयोगमाययाच्छन्नमहिम्ने परमात्मने ॥ २२॥ न यं विदन्त्यमी भूपा एकारामाश्च वृष्णयः । मायाजवनिकाच्छन्नमात्मानं
    कालमीश्वरम् ॥ २३॥ यथा शयानः पुरुष आत्मानं गुणतत्त्वदृक् । नाममात्रेन्द्रियाभातं न वेद रहितं परम् ॥
    २४॥ एवं त्वा नाममात्रेषु विषयेष्विन्द्रियेहया । मायया विभ्रमच्चित्तो न वेद स्मृत्युपप्लवात् ॥ २५॥
    तस्याद्य ते ददृशिमाङ्घ्रिमघौघमर्ष
