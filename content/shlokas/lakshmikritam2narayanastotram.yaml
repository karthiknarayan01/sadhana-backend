id: lakshmikritam2narayanastotram
category: stotram
name:
  english: lakshmikritam2narayanastotram
  devanagari: लक्ष्मीकृतं२नारायणस्तोत्रम्
content:
  english: lakshmikritam 2 narayanastotram shrilakshmiruvaca | mahakalo maharudro yamo yamasya kinkarah
    | yadatmano jagatsarvam niyamayanti te namah || 1|| pasho vajram gada shaktirdandashcakram trishulakam
    | yadatmanah pravartante tasmai te vibhave namah || 2|| dhritirdaya sahayatvam nitikshamopakaritah
    | yatprayukta prabhavanti tasmai gunatmane namah || 3|| mamata parata naijam sthitih pushtirvimokshanam
    | yadatmaka kritam syadvai nirgunam gunine namah || 4|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 260
  devanagari: लक्ष्मीकृतं २ नारायणस्तोत्रम् श्रीलक्ष्मीरुवाच । महाकालो महारुद्रो यमो यमस्य किङ्कराः ।
    यदात्मानो जगत्सर्वं नियमयन्ति ते नमः ॥ १॥ पाशो वज्रं गदा शक्तिर्दण्डश्चक्रं त्रिशूलकम् । यदात्मानः
    प्रवर्तन्ते तस्मै ते विभवे नमः ॥ २॥ धृतिर्दया सहायत्वं नीतिक्षमोपकारिताः । यत्प्रयुक्ता प्रभवन्ति
    तस्मै गुणात्मने नमः ॥ ३॥ ममता परता नैजं स्थितिः पुष्टिर्विमोक्षणम् । यदात्मक कृतं स्याद्वै निर्गुणं
    गुणिने नमः ॥ ४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने २६०
