id: narayanasahasranamastotra-nsamhita
category: stotram
name:
  english: narayanasahasranamastotraḻnsamhita
  devanagari: नारायणसहस्रनामस्तोत्रळ्ण्संहिता
content:
  english: '| uttishtheti karau dhritva kritva vakshasi yoginam || 56|| samashlishyaddhasa~sturnam svayam
    sahasradha''bhavat | samutthitaih sahasrasvarupairashlishyadacyutah || 57|| tatasturnam harishcaikasvarupah
    sambabhuva ha | vitihotro''pi sahasa tvekarupo vyajayata || 58|| ashcaryacakita loka jayashabdan pracakrire
    | tavacchribalakrishno''pi babhuva rishabho guruh || 59|| vriddhah shvetajatayukto vivastro dhulidhusarah
    | vicitta iva conmatto jitasarvendriyo yatih || 60|| svabhavatejasa vyapto brahmanishthaparah puman
    | aprakrita iva tvaste vimana iva dehishu || 61|| vitihotro''pi ca gurumrishabham vikshya dandavat
    | cakara bahudha tatra tushtava parameshvaram || 62|| tvam gurustvam cantaratma rishabhastvam ca yogirat
    | yogeshvaro bhavaneva tvam ceshastvam pareshvarah || 63|| tvam muktastvam mahamukto mukteshvaro bhavanapi
    | aksharam tvam bhavan brahma parabrahma bhavanapi || 64|| bhagavan krishna evasi krishnanarayano''si
    ca | anadishrikrishnanarayanastvam parameshvarah || 65|| avatarah rishabhadyastavaiva shripate vibho
    | radhapatistvameva''si lakshmipatistvameva ca || 66|| vasudevipatistvam ca narayanipatistatha | muktapatirbrahmapatirdhamapatistvameva
    ca || 67|| mahakalasya hetustvam mahavishnoshca karanam | sadashivasya hetustvam vairajasya ca karanam
    || 68|| bhuma tvam purushasamjnah purushottama ityapi | brahmavishnumaheshanam rudranam sarjako bhavan
    || 69|| devanam lokapalanam pitrinam sarjako bhavan | maharshinam yatinam ca sadhunam sarjakah satam
    || 70|| satinam kamaladyanam patih pata ca vai bhavan | suranam manavanam ca pashunam pakshinam tatha
    || 71|| vallinam ca drumanam ca sarjakastvam rasapradah | kamadhenukamavallicintamanyadisarjakah ||
    72|| yaksharakshahpishacanam sarjakastvam khacarinam | varijanam vanasthanam bhugarbhanam prasarjakah
    || 73|| daityanam danavanam ca sarjakastvam janardanah | dinanathadaridranam rakshakah poshako bhavan
    || 74|| ashritanamannadata sharanyashcartidehinam | kamukanam kamadata sakamanam prapurakah || 75||
    tvam nari tvam narashcasse tvam garbhastvam kumarakah tvam bijam tvam sasyarupastvam pushpam phalamityapi
    || 76|| tvamindrastvamindriyastvam nidra tvam jagaro bhavan | tvam sushuptirmahanandastvam pritistvam
    ratistatha || 77|| manmathastvam manojanyo manahsamstho bhavanapi | jnanam jnata jneyameva tvameva''si
    pareshvara || 78|| tvam ritustvam dinam ratristvamudyogo viramakah | tvam vishvasashcashrayashca tvam
    mata ca pita guruh || 79|| dhanam dhanyam tvameva''sim shaktirbalam tvameva ca | nitirbhaktirvrisho
    rago vairagyam ca tvameva ha || 80|| tvam pranastvam jivanam ca naikadha caikadha bhavan | prakashastvam
    pravrittistvam nirodhastvam gunatmakah || 81|| gunatitastvameva''si sarvasiddhigunashrayah | ashcaryam
    tvam camatkarastvamaishvaryam prabhutvakam || 82|| tvam bhurjalam bhava~stejo''nilastvam tvam tatha''nalah
    | tvam kham tvam matrakam tvam ca buddhistvam caishanatrayam || 83|| tvam pariksha titiksha tvam tvam
    bubhuksha mumukshata | tvam snehastvam dhyanavrittistvam samadhih paratparah || 84|| upastistvam cittacaityam
    tvam jadayam tvam tatha''nuta | tvam samyam tvam ca vaishamyam tvameva sarvameva ha || 85|| aham tvam
    vitihotrastvam tvam guruh rishabhastatha | tavaivam''shakala''''veshavibhutisrishtijam tvidam || 86||
    yat kimcid drishyate capi bhujyate liyate''pi ca | yasmad yatra ca yenapi yadartham ca tvameva sah
    || 87|| tasmai krishnaya nathaya brahmane parabrahmane | samarpayami catmanam vitihotrabhidham sada
    || 88|| danameva na tu nyasam napi kusidakam tatha | yatheshtaviniyogarham samarpayami mam tvaham
    || 89|| iti stutva radhike sampapata padayorhareh | vitihotrashca''tha krishnastamutthapayadurdhvakam
    || 90|| samashrlishya punarhastau datva tasya ca murdhani | nyayumkta varalabhartham vitihotram hariryada
    || 91|| vitihotrastada praha sthasye''tra tavapadayoh | ante moksham gamishyasyaksharam dhama tava
    prabho || 92|| dehi vasam sada catra tathastuvaca vai harih | radhike tanmahattirtham rishabhakhyam
    sarovare || 93|| vitihotrabhidham tirtham sahasrayogitirthakam | evam namna tadevasit prasiddham mokshadam
    shubham || 94|| harirbabhuva sahasa balakrishnasvarupadhrik | prayayau ca nijavasam vitihotrastate
    sthitah || 95|| vatavriksham samashlishya tapaso janadarshanah | tatra tirthe kritasnanah prapsyanti
    paramam gatim || 96|| yogasiddhimavapsyanti yogabhyasam vina''pi ca | radhike tatra samsnannashameshyanti
    patakam || 97|| ardram shushkam mahatsvalpam parapidakaram ca yat | sarvam nashyati papam tajjalapanadapi
    drutam || 98|| tatra''nnadanatah syattu vajimedhasamam phalam | rishabhasya''''layakarturmama dhama''ksharam
    bhavet || 99|| ityevam bhagavanaha radhike tirthavaibhavam | pathanacchravanaccasya bhavettattirthajam
    phalam || 100|| || itishrilakshminarayaniyasamhitayam dvitiye tretasantane vitihotrayogeshvaraya rishabharupena
    sahasrarupena ca harerdarshanam'
  devanagari: । उत्तिष्ठेति करौ धृत्वा कृत्वा वक्षसि योगिनम् ॥ ५६॥ समाश्लिष्यद्धसँस्तूर्णं स्वयं सहस्रधाऽभवत्
    । समुत्थितैः सहस्रस्वरूपैराश्लिष्यदच्युतः ॥ ५७॥ ततस्तूर्णं हरिश्चैकस्वरूपः सम्बभूव ह । वीतीहोत्रोऽपि
    सहसा त्वेकरूपो व्यजायत ॥ ५८॥ आश्चर्यचकिता लोका जयशब्दान् प्रचक्रिरे । तावच्छ्रीबालकृष्णोऽपि बभूव ऋषभो
    गुरुः ॥ ५९॥ वृद्धः श्वेतजटायुक्तो विवस्त्रो धूलिधूसरः । विचित्त इव चोन्मत्तो जितसर्वेन्द्रियो यतिः
    ॥ ६०॥ स्वभावतेजसा व्याप्तो ब्रह्मनिष्ठापरः पुमान् । अप्राकृत इव त्वास्ते विमना इव देहिषु ॥ ६१॥ वीतिहोत्रोऽपि
    च गुरुमृषभं वीक्ष्य दण्डवत् । चकार बहुधा तत्र तुष्टाव परमेश्वरम् ॥ ६२॥ त्वं गुरुस्त्वं चान्तरात्मा
    ऋषभस्त्वं च योगिराट् । योगेश्वरो भवानेव त्वं चेशस्त्वं परेश्वरः ॥ ६३॥ त्वं मुक्तस्त्वं महामुक्तो मुक्तेश्वरो
    भवानपि । अक्षरं त्वं भवान् ब्रह्म परब्रह्म भवानपि ॥ ६४॥ भगवान् कृष्ण एवासि कृष्णनारायणोऽसि च । अनादिश्रीकृष्णनारायणस्त्वं
    परमेश्वरः ॥ ६५॥ अवताराः ऋषभाद्यास्तवैव श्रीपते विभो । राधापतिस्त्वमेवाऽसि लक्ष्मीपतिस्त्वमेव च ॥ ६६॥
    वासुदेवीपतिस्त्वं च नारायणीपतिस्तथा । मुक्तपतिर्ब्रह्मपतिर्धामपतिस्त्वमेव च ॥ ६७॥ महाकालस्य हेतुस्त्वं
    महाविष्णोश्च कारणम् । सदाशिवस्य हेतुस्त्वं वैराजस्य च कारणम् ॥ ६८॥ भूमा त्वं पूरुषसंज्ञः पुरुषोत्तम
    इत्यपि । ब्रह्मविष्णुमहेशानां रुद्राणां सर्जको भवान् ॥ ६९॥ देवानां लोकपालानां पितॄणां सर्जको भवान्
    । महर्षीणां यतीनां च साधूनां सर्जकः सताम् ॥ ७०॥ सतीनां कमलाद्यानां पतिः पाता च वै भवान् । सुराणां
    मानवानां च पशूनां पक्षिणां तथा ॥ ७१॥ वल्लीनां च द्रुमाणां च सर्जकस्त्वं रसप्रदः । कामधेनुकामवल्लीचिन्तामण्यादिसर्जकः
    ॥ ७२॥ यक्षरक्षःपिशाचानां सर्जकस्त्वं खचारिणाम् । वारिजानां वनस्थानां भूगर्भाणां प्रसर्जकः ॥ ७३॥ दैत्यानां
    दानवानां च सर्जकस्त्वं जनार्दनः । दीनानाथदरिद्रानां रक्षकः पोषको भवान् ॥ ७४॥ आश्रितानामन्नदाता शरण्यश्चार्तिदेहिनाम्
    । कामुकानां कामदाता सकामानां प्रपूरकः ॥ ७५॥ त्वं नारी त्वं नरश्चास्से त्वं गर्भस्त्वं कुमारकः त्वं
    बीजं त्वं सस्यरूपस्त्वं पुष्पं फलमित्यपि ॥ ७६॥ त्वमिन्द्रस्त्वमिन्द्रियस्त्वं निद्रा त्वं जागरो भवान्
    । त्वं सुषुप्तिर्महानन्दस्त्वं प्रीतिस्त्वं रतिस्तथा ॥ ७७॥ मन्मथस्त्वं मनोजन्यो मनःसंस्थो भवानपि ।
    ज्ञानं ज्ञाता ज्ञेयमेव त्वमेवाऽसि परेश्वर ॥ ७८॥ त्वम् ऋतुस्त्वं दिनं रात्रिस्त्वमुद्योगो विरामकः ।
    त्वं विश्वासश्चाश्रयश्च त्वं माता च पिता गुरूः ॥ ७९॥ धनं धान्यं त्वमेवाऽसिं शक्तिर्बलं त्वमेव च ।
    नीतिर्भक्तिर्वृषो रागो वैराग्यं च त्वमेव ह ॥ ८०॥ त्वं प्राणस्त्वं जीवनं च नैकधा चैकधा भवान् । प्रकाशस्त्वं
    प्रवृत्तिस्त्वं निरोधस्त्वं गुणात्मकः ॥ ८१॥ गुणातीतस्त्वमेवाऽसि सर्वसिद्धिगुणाश्रयः । आश्चर्यं त्वं
    चमत्कारस्त्वमैश्वर्यं प्रभुत्वकम् ॥ ८२॥ त्वं भूर्जलं भवाँस्तेजोऽनिलस्त्वं त्वं तथाऽनलः । त्वं खं त्वं
    मात्रकं त्वं च बुद्धिस्त्वं चैषणात्रयम् ॥ ८३॥ त्वं परीक्षा तितिक्षा त्वं त्वं बुभुक्षा मुमुक्षता ।
    त्वं स्नेहस्त्वं ध्यानवृत्तिस्त्वं समाधिः परात्परः ॥ ८४॥ उपास्तिस्त्वं चित्तचैत्यं त्वं जाडयं त्वं
    तथाऽणुता । त्वं साम्यं त्वं च वैषम्यं त्वमेव सर्वमेव ह ॥ ८५॥ अहं त्वं वीतिहोत्रस्त्वं त्वं गुरूः ऋषभस्तथा
    । तवैवांऽशकलाऽऽवेशविभूतिसृष्टिजं त्विदम् ॥ ८६॥ यत् किंचिद् दृश्यते चापि भुज्यते लीयतेऽपि च । यस्माद्
    यत्र च येनापि यदर्थं च त्वमेव सः ॥ ८७॥ तस्मै कृष्णाय नाथाय ब्रह्मणे परब्रह्मणे । समर्पयामि चात्मानं
    वीतिहोत्राभिधं सदा ॥ ८८॥ दानमेव न तु न्यासं नापि कुसीदकं तथा । यथेष्टविनियोगार्हं समर्पयामि मां त्वहम्
    ॥ ८९॥ इति स्तुत्वा राधिके सम्पपात पादयोर्हरेः । वीतिहोत्रश्चाऽथ कृष्णस्तमुत्थापयदूर्ध्वकम् ॥ ९०॥ समाश्र्लिष्य
    पुनर्हस्तौ दत्वा तस्य च मूर्धनि । न्ययुंक्त वरलाभार्थं वीतिहोत्रं हरिर्यदा ॥ ९१॥ वीतिहोत्रस्तदा प्राह
    स्थास्येऽत्र तवपादयोः । अन्ते मोक्षं गमिष्यस्यक्षरं धाम तव प्रभो ॥ ९२॥ देहि वासं सदा चात्र तथास्तूवाच
    वै हरिः । राधिके तन्महत्तीर्थम् ऋषभाख्यं सरोवरे ॥ ९३॥ वीतिहोत्राभिधं तीर्थं सहस्रयोगितीर्थकम् । एवं
    नाम्ना तदेवासीत् प्रसिद्धं मोक्षदं शुभम् ॥ ९४॥ हरिर्बभूव सहसा बालकृष्णस्वरूपधृक् । प्रययौ च निजावासं
    वीतिहोत्रस्तटे स्थितः ॥ ९५॥ वटवृक्षं समाश्लिष्य तापसो जनदर्शनः । तत्र तीर्थे कृतस्नानाः प्राप्स्यन्ति
    परमां गतिम् ॥ ९६॥ योगसिद्धिमवाप्स्यन्ति योगाभ्यासं विनाऽपि च । राधिके तत्र संस्नान्नाशमेष्यन्ति पातकम्
    ॥ ९७॥ आर्द्रं शुष्कं महत्स्वल्पं परपीडाकरं च यत् । सर्वं नश्यति पापं तज्जलपानादपि द्रुतम् ॥ ९८॥ तत्राऽन्नदानतः
    स्यात्तु वाजिमेधसमं फलम् । ऋषभस्याऽऽलयकर्तुर्मम धामाऽक्षरं भवेत् ॥ ९९॥ इत्येवं भगवानाह राधिके तीर्थवैभवम्
    । पठनाच्छ्रवणाच्चास्य भवेत्तत्तीर्थजं फलम् ॥ १००॥ ॥ इतिश्रीलक्ष्मीनारायणीयसंहितायां द्वितीये त्रेतासन्ताने
    वीतिहोत्रयोगेश्वराय ऋषभरूपेण सहस्ररूपेण च हरेर्दर्शनम्
