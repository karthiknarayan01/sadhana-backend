id: gopicandanopanishat
category: upanishad
name:
  english: gopicandanopanishat
  devanagari: गोपीचन्दनोपनिषत्
content:
  english: manushanam papasamharanacchuddhantakarananam brahmajnanapraptishca | ya evam vedetyupanishat
    || 2|| gopityagra ucyatam candanam tu tatah pashcat | gopityaksharadvayam candanam tu triyaksharam
    tasmadaksharapancakam | ya evamvidvan gopicandanam dharayedakshayam padamapnoti pancatvam na sa pashyati
    tato'mritatvamashnute tato'mritamashnuta iti || 3|| atha mayashabalitam brahmasittatashca mahadadya
    brahmano mahamayasammilitat | pancabhuteshu gandhavatiyam prithivyasit | prithivyashca vaibhavadvarnabhedah
    | pitavarna mrido jayante lokanugrahartham | mayasahitabrahmasambhogavashadasya candanasya vaibhavam
    | ya evamvidvanyatihaste dadyadanupaplavah sarvamayureti | tatah prajapatyam rayasposham gaushpatyam
    ca | ya etadrahasyam sayam pratardhyayedahoratrakritam papam nashayati mrito mokshamashnuta iti ||
    4|| gopicandanapankena lalatam yastu lepayet | ekadandi tridandi va sa vai moksham samashnute || 1||
    gopicandanaliptango yam yam pashyati cakshusha | tam tam putam vijaniyadrajabhih satkrito bhavet ||
    2|| brahmahanta kritaghnashca goghnashca guru talpagah | tesham papani nashyanti gopicandanadharanat
    || 3|| gopicandanaliptango mriyate yatra kutracit | abhivyapyayato bhutva devendrapadamashnute ||
    4|| gopicandanaliptangam purusham ya upasate | evam brahmadayo devastanmukhastanupasate || 5|| gopicandanaliptangah
    purusho yena pujyate | vishnupujitabhutitvadvishnuloke mahiyate || 6|| sadacarah shubhakalpo mitaharo
    jitendriyah | gopicandanaliptangah sakshadvishnumayo bhavet || 7|| gopicandanaliptango vratam yastu
    samacaret | tatah kotigunam punyamityevam munirabravit || 8|| gopicandanaliptangairjapadanadi yatkritam
    | nyunam sampurnatam yati vidhanena visheshatah || 9|| gopicandanamayushyam balarogyavivardhanam |
    kamadam mokshadam caiva ityevam munayo'bruvan || 10|| agnishtomasahasrani vajapeya shatani ca | tesham
    punyamavapnoti gopicandanadharanat || 11|| gopicandanadanasya nashvamedhakritah phalam | na gangaya
    samam tirtham na shuddhirgopicandanat || 12|| bahuma'tra kimuktena gopicandanamandanam | na tattulyam
    bhavelloke natra karya vicarana || 13|| candanam capi gopinam kelikunkumasambhavam | mandanatpavanam
    nrinam bhuktimuktiphalapradam || 14|| krishnagopiratodbhutam papaghnam gopicanadanam | tatprasadatsarvadaiva
    caturvargaphalapradam | tilamatrapradanena kancanadrisamam phalam || 15|| kunkumam krishnagopinam
    jalakridasu sambhritam | gopicandanamityuktam dvaravatyam sureshvaraih || 16|| krishnagopijalakridakunkumam
    candanairyutam | tilamatram pradayedam punatya dashamam kulam || 17|| gopicandanakhandam tu cakrakaram
    sulakshanam | vishnurupamidam punyam pavanam patavarnakah || 18|| apo va agra asan | tatra prajapatirvayurbhutva'shramyatedam
    srijeyamiti | sa tapo'tapyata | tata onkaramapashyat | tato vyahritistato gayatrim | gayatrya vedastairidamasrijata
    | dhumamargavistritam hi vedarthamabhisandhaya caturdasha lokanasrijata | tata upanishadah shrutaya
    avirbabhuvuh | arcimargavistritam vedarthamabhisandhaya sarvanvedasarahasyopanishadanganbrahmaloke
    sthapayamasa | tashcopadishadvaivasvate'ntare sagunam brahma cidghananandaikarupam purushottamarupena
    mathurayam vasudevasadmanyavirbhavishyati | tatra bhavatyah sarvalokotkrishtasaundaryakridabhoga gopikasvarupaih
    parabrahmanandaikarupam krishnam bhajishyatha | tatra shlokah
  devanagari: मानुषाणां पापसंहरणाच्छुद्धान्तकरणानां ब्रह्मज्ञानप्राप्तिश्च । य एवं वेदेत्युपनिषत् ॥ २॥
    गोपीत्यग्र उच्यतां चन्दनं तु ततः पश्चात् । गोपीत्यक्षरद्वयं चन्दनं तु त्रियक्षरं तस्मादक्षरपञ्चकम्
    । य एवंविद्वान् गोपीचन्दनं धारयेदक्षयं पदमाप्नोति पञ्चत्वं न स पश्यति ततोऽमृतत्वमश्नुते ततोऽमृतमश्नुत
    इति ॥ ३॥ अथ मायाशबलितं ब्रह्मासीत्ततश्च महदाद्या ब्रह्मणो महामायासम्मिलितात् । पञ्चभूतेषु गन्धवतीयं
    पृथिव्यासीत् । पृथिव्याश्च वैभवाद्वर्णभेदाः । पीतवर्णा मृदो जायन्ते लोकानुग्रहार्थम् । मायासहितब्रह्मसम्भोगवशादस्य
    चन्दनस्य वैभवम् । य एवंविद्वान्यतिहस्ते दद्यादनुपप्लवः सर्वमायुरेति । ततः प्राजापत्यं रायस्पोषं गौष्पत्यं
    च । य एतद्रहस्यं सायं प्रातर्ध्यायेदहोरात्रकृतं पापं नाशयति मृतो मोक्षमश्नुत इति ॥ ४॥ गोपीचन्दनपङ्केन
    ललाटं यस्तु लेपयेत् । एकदण्डी त्रिदण्डी वा स वै मोक्षं समश्नुते ॥ १॥ गोपीचन्दनलिप्ताङ्गो यं यं पश्यति
    चक्षुषा । तं तं पूतं विजानीयाद्राजभिः सत्कृतो भवेत् ॥ २॥ ब्रह्महन्ता कृतघ्नश्च गोघ्नश्च गुरु तल्पगः
    । तेषां पापानि नश्यन्ति गोपीचन्दनधारणात् ॥ ३॥ गोपीचन्दनलिप्ताङ्गो म्रियते यत्र कुत्रचित् । अभिव्याप्यायतो
    भूत्वा देवेन्द्रपदमश्नुते ॥ ४॥ गोपीचन्दनलिप्ताङ्गं पुरुषं य उपासते । एवं ब्रह्मादयो देवास्तन्मुखास्तानुपासते
    ॥ ५॥ गोपीचन्दनलिप्ताङ्गः पुरुषो येन पूज्यते । विष्णुपूजितभूतित्वाद्विष्णुलोके महीयते ॥ ६॥ सदाचारः
    शुभाकल्पो मिताहारो जितेन्द्रियः । गोपीचन्दनलिप्ताङ्गः साक्षाद्विष्णुमयो भवेत् ॥ ७॥ गोपीचन्दनलिप्ताङ्गो
    व्रतं यस्तु समाचरेत् । ततः कोटिगुणं पुण्यमित्येवं मुनिरब्रवीत् ॥ ८॥ गोपीचन्दनलिप्ताङ्गैर्जपदानादि
    यत्कृतम् । न्यूनं सम्पूर्णतां याति विधानेन विशेषतः ॥ ९॥ गोपीचन्दनमायुष्यं बलारोग्यविवर्धनम् । कामदं
    मोक्षदं चैव इत्येवं मुनयोऽब्रुवन् ॥ १०॥ अग्निष्टोमसहस्राणि वाजपेय शतानि च । तेषां पुण्यमवाप्नोति गोपीचन्दनधारणात्
    ॥ ११॥ गोपीचन्दनदानस्य नाश्वमेधकृतः फलम् । न गङ्गया समं तीर्थं न शुद्धिर्गोपिचन्दनात् ॥ १२॥ बहुमाऽत्र
    किमुक्तेन गोपीचन्दनमण्डनम् । न तत्तुल्यं भवेल्लोके नात्र कार्या विचारणा ॥ १३॥ चन्दनं चापि गोपीनां
    केलिकुङ्कुमसम्भवम् । मण्डनात्पावनं नॄणां भुक्तिमुक्तिफलप्रदम् ॥ १४॥ कृष्णगोपीरतोद्भूतं पापघ्नं गोपिचनदनम्
    । तत्प्रसादात्सर्वदैव चतुर्वर्गफलप्रदम् । तिलमात्रप्रदानेन काञ्चनाद्रिसमं फलम् ॥ १५॥ कुङ्कुमं कृष्णगोपीनां
    जलक्रीडासु सम्भृतम् । गोपीचन्दनमित्युक्तं द्वारवत्यां सुरेश्वरैः ॥ १६॥ कृष्णगोपीजलक्रीडाकुङ्कुमं चन्दनैर्युतम्
    । तिलमात्रं प्रदायेदं पुनात्या दशमं कुलम् ॥ १७॥ गोपीचन्दनखण्डं तु चक्राकारं सुलक्षणम् । विष्णुरूपमिदं
    पुण्यं पावनं पातवर्णकः ॥ १८॥ आपो वा अग्र आसन् । तत्र प्रजापतिर्वायुर्भूत्वाऽश्राम्यतेदं सृजेयमिति
    । स तपोऽतप्यत । तत ओङ्कारमपश्यत् । ततो व्याहृतीस्ततो गायत्रीम् । गायत्र्या वेदास्तैरिदमसृजत । धूममार्गविस्तृतं
    हि वेदार्थमभिसन्धाय चतुर्दश लोकानसृजत । तत उपनिषदः श्रुतय आविर्बभूवुः । अर्चिमार्गविस्तृतं वेदार्थमभिसन्धाय
    सर्वान्वेदासरहस्योपनिषदङ्गान्ब्रह्मलोके स्थापयामास । ताश्चोपादिशद्वैवस्वतेऽन्तरे सगुणं ब्रह्म चिद्घनानन्दैकरूपं
    पुरुषोत्तमरूपेण मथुरायां वसुदेवसद्मन्याविर्भविष्यति । तत्र भवत्यः सर्वलोकोत्कृष्टसौन्दर्यक्रीडाभोगा
    गोपिकास्वरूपैः परब्रह्मानन्दैकरूपं कृष्णं भजिष्यथ । तत्र श्लोकाः
