    दाशरथी करुणापयोनिधी ॥ जलनिधिलोनदूऱि कुल शैलमुमीटि धरित्रिगॊम्मुनं दलवडमाटिरक्कसुनि यङ्गमुगीटिबलीन्द्रुनिन्
    रसा तलमुनमाटि पार्धिवक दम्बमुगूऱ्चिन मेटिराम ना तलपुननाटि रागदवॆ दाशरथी करुणापयोनिधी ॥ भण्डन भीमुडा
    र्तजन बान्धवुडुज्ज्वल बाणतूणको दण्डकलाप्रचण्ड भुज ताण्डवकीर्तिकि राममूर्तिकिन् रॆण्डव साटिदैवमिक लेडनुचुन्
    गडगट्टि भेरिका डाण्ड डडाण्ड डाण्ड निनदम्बु लजाण्डमुनिण्ड मत्तवे दण्डमु नॆक्कि चाटॆदनु दाशरथी करुणापयोनिधी
    ॥ अवनिज कन्नुदोयि तॊगलन्दु वॆलिङ्गॆडु सोम जानकी कुवलयनेत्र गब्बिचनुकॊण्डल नुण्डु घनम्ब मैधिली नवनव
    यौवनम्बनु वनम्बुकुन् मददन्ति वीवॆका दविलि भजिन्तु नॆल्लपुडु दाशरथी करुणापयोनिधी ॥ खरकरवंशजा विनु मुखण्डित
    भूतपिशाचढाकिनी ज्वर परितापसर्पभय वारकमैन भवत्पदाब्ज नि स्पुर दुरुवज्रपञ्जरमुजॊच्चिति नीयॆड दीन मानवो
    ध्धर बिरुदङ्क मेमऱुकु दाशरथी करुणापयोनिधी ॥ जुर्रॆदमीक थामृतमु जुर्रॆदमीपदकञ्जतो यमुन् जुर्रॆद रामनाममुन
    जॊब्बिलुचुन्न सुधारसम्ब ने जुर्रॆद जुर्रुजुर्रुँग रुचुल् गनुवारिपदम्बु गूर्पवे तुर्रुलतोडि पॊत्तिडक
    दाशरथी करुणापयोनिधी ॥ घोरकृतान्त वीरभट कोटिकि गुण्डॆदिगुल् दरिद्रता कारपिशाच संहरण कार्यविनोदि विकुण्ठ
    मन्दिर द्वार कवाट भेदि निजदास जनावलिकॆल्ल प्रॊद्दु नी तारकनाम मॆन्नुकॊन दाशरथी करुणापयोनिधी ॥ विन्नपमालकिञ्चु
    रघुवीर नहिप्रतिलोकमन्दु ना कन्नदुरात्मुडुं बरम कारुणिकोत्तम वेल्पुलन्दु नी कन्न महात्मुडुं बतित कल्मषदूरुडु
    लेडुनाकुवि द्वन्नुत नीवॆनाकु गति दाशरथी करुणापयोनिधी ॥ पॆम्पुनँदल्लिवै कलुष बृन्दसमागम मॊन्दुकुण्डु
    र क्षिम्पनुदण्ड्रिवै मॆयु वसिञ्चुदु शेन्द्रिय रोगमुल् निवा रिम्पनु वॆज्जवै कृप गुऱिञ्चि परम्बु दिरबुगाँग
    स त्सम्पदलीय नीवॆगति दाशरथी करुणापयोनिधी ॥ कुक्षिनजाण्डपं क्तुलॊन गूर्चि चराचरजन्तुकोटि सं रक्षणसेयु
    तण्ड्रिवि परम्पर नी तनयुण्डनैन ना पक्षमु नीवुगावलदॆ पापमु लॆन्नि यॊनर्चिनन् जग द्रक्षक कर्तवीवॆकद
    दाशरथी करुणापयोनिधी ॥ गद्दरियो गिहृत्कमल गन्धर सानुभवम्बुँजॆन्दु पॆ न्निद्दवु गण्डुँ देँटि थरणीसुत
    कौँगिलिपञ्जरम्बुनन् मुद्दुलुगुल्कु राचिलुक मुक्तिनिधानमुरामराँगदे तद्दयु नेँडु नाकडकु दाशरथी करुणापयोनिधी
    ॥ कलियुग मर्त्यकोटिनिनु गङ्गॊन रानिविधम्बो भक्तव त्सलतवहिम्पवो चटुल सान्द्रविपद्दश वार्धि ग्रुङ्कुचो
    बिलिचिन बल्क विन्तमऱपी नरुलिट्लनरादु गाक नी तलपुन लेदॆ सीत चॆऱ दाशरथी करुणापयोनिधी ॥ जनवर मीक थालि
    विनसैँपक कर्णमुलन्दु घण्टिका निनद विनोदमुल् सुलुपुनीचुनकुन् वरमिच्चिनावु नि न्ननयमुनम्मि कॊल्चिन महात्मुनकेमि
    यॊसङ्गु दोसनं दननुत माकॊसङ्गुमय दाशरथी करुणापयोनिधी ॥ पापमु लॊन्दुवेल रणपन्नग भूत भयज्वारादुलन् दापद
    नॊन्दुवेल भरताग्रज मिम्मु भजिञ्चुवारिकिन् ब्रापुग नीवुदम्मु डिरुपक्कियलन् जनि तद्वित्ति सं तापमु माम्पि
    कातुरट दाशरथी करुणापयोनिधि ॥ अगणित जन्मकर्मदुरि ताम्बुधिलो बहुदुःखवीचिकल् दॆगिपडवीडलेक जगतीधर नीपदभक्ति
    नावचे दगिलि तरिम्पगोरिति बदम्पबडि नदु भयम्भु माम्पवे तगदनि चित्तमं दिडक दाशरथी करुणापयोनिधी ॥ नेनॊनरिञ्चु
    पापमुल नेकमुलैननु नादुजिह्वकुं बानकमय्यॆमीपरम पावननाममुदॊण्टि चिल्करा माननुगावुमन्न तुदि माटकु सद्गति
    जॆन्दॆगावुनन् दानि धरिम्पगोरॆदनु दाशरथी करुणापयोनिधी ॥ परधनमुल् हरिञ्चि परभामलनण्टि परान्न मब्बिनन्
    मुरिपम कानिमीँदनगु मोसमॆऱुङ्गदु मानसम्बु स्तरमदिकालकिङ्कर गदाहति पाल्पडनीक मम्मु नेदु तऱिदरिजेर्चि
    काचॆदवॊ दाशरथी करुणापयोनिधी ॥ चेसिति घोरकृत्यमुलु चेसिति भागवतापचारमुल् चेसिति नन्यदैवमुलँ जेरि भजिञ्चिन
    वारिपॊन्दु नेँ जेसिन नेरमुल् दलँचि चिक्कुलँबॆट्टकुमय्ययय्य नी दासुँडनय्य भद्रगिरि दाशरथी करुणापयोनिधी
    ॥ परुल धनम्बुँजूचिपर भामलजूचि हरिम्पगोरु म द्गुरुतरमानसं बनॆडु दॊङ्गनुबट्टिनिरूढदास्य वि स्फुरितविवेक
    पाशमुलँ जुट्टि भवच्चरणम्बने मरु त्तरुवुनगट्टिवेयग दॆ दाशरथी करुणापयोनिधी ॥ सललित रामनाम जपसार मॆऱुङ्गनु
    गाशिकापुरी निलयुडगानुमीचरण नीरजरेणु महाप्रभावमुं दॆलियनहल्यगानु जगतीवर नीदगु सत्यवाक्यमुं दलपग रावणासुरुनि
    तम्मुडगानु भवद्विलासमुल् दलचिनुतिम्प नातरमॆ दाशरथी करुणापयोनिधी ॥ पातकुलैन मीकृपकु बात्रुलु कारॆतलञ्चिचूड
    ज ट्रातिकिगल्गॆ बावन मरातिकि राज्यसुखम्बुगल्गॆ दु र्जातिकि बुण्यमब्बॆगपि जातिमहत्त्वमुनॊन्दॆगावुनं
    दातव यॆट्टिवारलकु दाशरथी करुणापयोनिधी ॥ मामक पातक वज्रमु म्राम्पनगण्यमु चित्रगुप्तुले येमनि व्रातुरो
    कालकिङ्कर स्तोम मॊनर्चिटेमॊ विनजॊप्पड दिन्तकमुन्नॆदीनचिं तामणि यॊट्लु गाचॆदवॊ दाशरथी करुणापयोनिधी
    ॥ दासिन चुट्टूमा शबरि दानि दयामति नेलिनावु गुहुडु तावकदास्य मॊसङ्गिनावु ने जेसिन पापमो विनुति चेसिनगाववु
    गावुमय्य नी दासुललोन नेनॊकँड दाशरथी करुणापयोनिधी ॥ दीक्षवहिञ्चि नाकॊलदि दीनुल नॆन्दऱि गाचितो जग द्रक्षक
    तॊल्लिया द्रुपद राजतनूज तलञ्चिनन्तने यक्षयमैन वल्वलिडि तक्कट नामॊऱजित्तगिञ्चि प्रत्यक्षमु गाववेमिटिकि
    दाशरथी करुणापयोनिधी ॥ नीलघनाभमूर्तिवगु निन्नु गनुङ्गॊनिकोरि वेडिनन् जालमुसेसि डागॆदवु संस्तुति कॆक्किन
    रामनाम मे मूलनु दाचुकोगलवु मुक्तिकि ब्रापदि पापमूलकु द्दालमुगादॆ मायॆडल दाशरथी करुणापयोनिधी ॥ वलदु
    पराकु भक्तजनवत्सल नी चरितम्बु वम्मुगा वलदु पराकु नीबिरुदु वज्रमुवण्टिदि गान कूरके वलदु पराकु नादुरित
    वार्धिकि दॆप्पवुगा मनम्बुलो दलतुमॆका निरन्तरमु दाशरथी करुनापयोनिधी ॥ तप्पुलॆऱुङ्ग लेक दुरितम्बुलु
    सेसितिनण्टि नीवुमा यप्पवुगावु मण्टि निकनन्युलकुन् नुदुरण्टनण्टिनी कॊप्पिदमैन दासजनु लॊप्पिन बण्टुकु
    बटवण्टि ना तप्पुल कॆल्ल नीवॆगति दाशरथी करुणापयोनिधी ॥ इतडु दुरात्मुडञ्चुजनु लॆन्नँग नाऱडिँगॊण्टिनेनॆपो
    पतितुँड नण्टिनो पतित पावनमूर्तिवि नीवुगल्ल ने नितिरुल वेँडनण्टि निह मिच्चिननिम्मुपरम्बॊसङ्गुमी यतुलित
    रामनाम मधु राक्षर पालिनिरन्तरं बहृ द्गतमनि नम्मिकॊल्चॆदनु दाशरथी करुणापयोनिधी ॥ अञ्चितमैननीदु करुणामृतसारमु
    नादुपैनि ब्रो क्षिञ्चिन जालुदाननिर सिञ्चॆदनादुरितम्बु लॆल्लदू लिञ्चॆद वैरिवर्ग मॆडलिञ्चॆद गोर्कुलनीदुबण्टनै
    दञ्चॆद गालकिङ्करुल दाशरथी करुणापयोनिधी ॥ जलनिधु लेडुनॊक्क मॊगिँ जक्किकिदॆच्चॆशरम्बु ऱातिनिं पलरँग
    जेसॆनातिगँब दाब्जपरागमु नी चरित्रमुं जलजभवादि निर्जरुलु सन्नुति सेयँग लेरु गावुनं दलपनगण्यमय्य यिदि
    दाशरथी करुणापयोनिधी ॥ कोतिकिशक्यमा यसुरकोटुल गॆल्वनु गाल्चॆबो निजं बातनिमेन शीतकरुडौट दवानलु डॆट्टिविन्त
    मा सीतपतिव्रता महिमसेवकु भाग्यमुमीकटाक्षमु धातकु शक्यमा पॊगड दाशरथी करुणापयोनिधी ॥ भूपललाम रामरघुपुङ्गवराम
    त्रिलोक राज्य सं स्धापनराम मोक्षफल दायक राम मदीय पापमुल् पापगदय्यराम निनु ब्रस्तुति चेसॆदनय्यराम सी
    तापतिराम भद्रगिरि दासरथी करुणापयोनिधी ॥ नीसहजम्बु सात्विकमु नीविडिपट्टु सुधापयोधि प द्मासनुडात्मजुण्डु
    गमलालयनी प्रियुरालु नीकु सिं हासनमिद्धरित्रि गॊडुगाक समक्षुलु चन्द्रबास्करुल् नीसुमतल्पमादिफणि नीवॆ
    समस्तमु गॊल्चिनट्टि नी दासुल भाग्यमॆट्टिदय दाशरथी करुणापयोनिधी ॥ चरणमु सोकिनट्टि शिलजव्वनिरूपगु टॊक्कविन्त
    सु स्धिरमुग नीटिपै गिरुलु देलिन दॊक्कटि विन्तगानि मी स्मरण दनर्चुमानवुलु सद्गति जॆन्दिन दॆन्तविन्त
    यी धरनु धरात्मजारमण दाशरथी करुणापयोनिधी ॥ दैवमु तल्लिदण्ड्रितगु दात गुरुण्डु सखुण्डु निन्नॆ का भावन
    सेयुचुन्नतऱि पापमुलॆल्ल मनोविकार दु र्भावितुजेयुचुन्नविकृपामतिवैननु कावुमी जग त्पावनमूर्ति भद्रगिरि
    दाशरथी करुणापयोनिधी ॥ वासव राज्यभोग सुख वार्धिनि देलु प्रभुत्वमब्बिना यासकुमेर लेदु कनकाद्रिसमान धनम्बुगूर्चिनं
    गासुनु वॆण्टरादु कनि कानक चेसिन पुण्यपापमुल् वीसरबोव नीवु पदिवेलकु जालु भवम्बुनॊल्ल नी दासुनिगाग नेलुकॊनु
    दाशरथी करुणापयोनिधी ॥ सूरिजनुल् दयापरुलु सूनृतवादु ललुब्धमानवुल् वेरपतिप्रताङ्गनलु विप्रुलु गोवुलु
    वेदमुल् महा भारमुदाल्पगा जनुलु पावनमैन परोपकार स त्कार मॆऱुङ्गुले रकट दाशरथी करुणापयोनिधी ॥ वारिचरावतारमु
    वारिधिलो जॊऱबाऱि क्रोध वि स्तारगुडैन या निगमतस्करवीर निशाचरेन्द्रुनिं जेरि वधिञ्चि वेदमुल चिक्कॆडलिञ्चि
    विरिञ्चिकि महो दारतनिच्चितीवॆगद दाशरथी करुणापयोनिधी ॥ करमनुर क्तिमन्दरमु गव्वमुगा नहिराजुद्राडुगा
    दॊरकॊन देवदानवुलु दुग्धपयोधिमथिञ्चुचुन्नचो धरणिचलिम्पलोकमुलु तल्लडमन्दग गूर्ममै धरा धरमु धरिञ्चितीवॆकद
    दाशरथी करुणापयोनिधी ॥ धारुणि जापजुट्टिन विधम्बुनगैकॊनि हेमनेत्रुड व्वारिधिलोनदागिननु वानिवधिञ्चि वराहमूर्तिवै
    धारुणिदॊण्टिकै वडिनि दक्षिणशृङ्गमुन धरिञ्चि वि स्तार मॊनर्चितीवे कद दाशरथी करुणापयोनिधी ॥ पॆटपॆटनुक्कु
    कम्बमुन भीकरदन्त नखान्तर प्रभा पटलमु गप्प नुप्पतिलि भण्डनवीधि नृसिंहभीकर स्फुटपटुशक्ति हेमकशिपु विदलिञ्चि
    सुरारिपट्टि नं तटगृपजूचितीवॆकद दाशरथी करुणापयोनिधी ॥ पदयुगलम्बु भूगगन भागमुल वॆसनूनि विक्रमा स्पदमगुनब्बलीन्द्रुनॊक
    पादमुनन्दल क्रिन्दनॊत्तिमे लॊदवजगत्त्रयम्बु बुरु हूतुनिकिय्यवटुण्डवैनचि त्सदमलमूर्ति वीवॆकद दाशरथी
    करुणापयोनिधी ॥ इरुवदियॊक्कमाऱु धरणीशुल नॆल्लवधिञ्चि तत्कले बर रुधिर प्रवाहमुन बैतृकतर्पण मॊप्पजेसि
    भू सुरवरकोटिकि मुदमु सॊप्पड भार्गवराममूर्तिवै धरणिनॊसङ्गिती वॆकद दाशरथी करुणापयोनिधी ॥ दुरमुन दाटकन्दुनिमि
    धूर्जटिविल् दुनुमाडिसीतनुं बरिणयमन्दि तण्ड्रिपनुप घन काननभूमि केगि दु स्तरपटुचण्ड काण्डकुलिशाहति रावणकुम्भकर्ण
    भू धरमुल गूल्चिती वॆकद दाशरथी करुणापयोनिधी ॥ अनुपमयादवान्वयसु धाब्धिसुधानिधि कृष्णमूर्तिनी कनुजुडुगाजनिञ्चि
    कुजनावलिनॆल्ल नडञ्चि रोहिणी तनयुडनङ्ग बाहुबल दर्पमुन बलराम मूर्तिवै तनरिन वेल्पवीवॆकद दाशरथी करुणापयोनिधी
    ॥ सुरलुनुतिम्पगा द्रिपुर सुन्दरुल वरियिम्पबुद्धरू परयग दाल्चितीवु त्रिपुरासुरकोटि दहिञ्चुनप्पुडा हरुनकुदोडुगा
    वरश रासन बाणमुखो ग्रसाधनो त्कर मॊनरिञ्चितीवुकद दाशरथी करुणापयोनिधी ॥ सङ्करदुर्गमै दुरित सङ्कुलमैन
    जगम्बुजूचि स र्वङ्कषलील नु त्तम तुरङ्गमुनॆक्कि करासिबूनि वी राङ्कविलास मॊप्प गलि काकृत सज्जनकोटिकि
    निरा तङ्क मॊनर्चितीवुकद दाशरथी करुणापयोनिधी ॥ मनमुननूहपोषणलु मर्वकमुन्नॆ कफादिरोगमुल् दनुवुननण्टि
    मेनिबिगि दप्पकमुन्नॆनरुण्डु मोक्ष सा धन मॊनरिम्पँगावलयुँ दत्त्वविचारमु मानियुण्डुट ल्तनुवुनकु विरोधमिदि
    दाशरथी करुणापयोनिधी ॥ मुदमुन काटपट्टुभव मोहमद्व दिरदाङ्कुशम्बु सं पदल कॊटारु कोरिकल पण्ट परम्बुन कादि
    वैरुल न्नदन जयिञ्चुत्रोव विपदब्धिकिनावगदा सदाभव त्सदमलनामसंस्मरण दाशरथी करुणापयोनिधी ॥ दुरित लतानुसार
    भय दुःख कदम्बमु रामनामभी करतल हेतिचेँ दॆगि वकावकलै चनकुण्ड नेर्चुने दरिकॊनि मण्डुचुण्डु शिख दार्कॊनिन
    शलबादिकीटको त्करमु विलीनमैचनवॆ दाशरथी करुणापयोनिधी ॥ हरिपदभक्तिनिन्द्रियज यान्वितुडुत्तमुँडिन्द्रिमम्बुलन्
    मरुगक निल्पनूदिननु मध्यमुँडिन्द्रियपारश्युडै परगिनचो निकृष्टुडनि पल्कग दुर्मतिनैन नन्नु ना दरमुन नॆट्लुकाचॆदवॊ
    दाशरथी करुणापयोनिधी ॥ वनकरिचिक्कु मैनसकु पाचविकिं जॆडिपोयॆ मीनुता विनिकिकिँजिक्कॆँजिल्वगनु वेँदुऱुँ
    जॆन्दॆनु लेल्लु ताविलो मनिकिनशिञ्चॆ देटितर मायिरुमूँटिनि गॆल्वनै दुसा धनमुलनी वॆ कावनगु दाशरथी करुणापयोनिधी
    ॥ करमुलुमीकुम्रॊक्कुलिड कन्नुलु मिम्मुनॆ चूड जिह्व मी स्मरणदनर्पवीनुलुभ वत्कथलन् विनुचुण्डनास मी यऱुतुनु
    बॆट्टुपूसरुल कासगॊनं बरमार्थ साधनो त्करमिदि चेयवेकृपनु दाशरथी करुणापयोनिधी ॥ चिरतरभक्ति नॊक्कतुलसीदल
    मर्पण चेयुवाडु खे चरगरु डोरग प्रमुख सङ्घमुलो वॆलुगन् सधा भवत् सुरुचिर धीन्द पादमुल बूजलॊनर्चिन वारिकॆल्लद
    त्पर मरचेतिधात्रिगद दाशरथी करुणापयोनिधी ॥ भानुडु तूर्पुनन्दुगनु पुट्टिनँ बावक चन्द्र तेजमुल् हीनत
    जॆन्दिनट्लु जगदेक विराजितमैन नी पद ध्यानमु चेयुचुन्नँ बर दैवमरीचुलडङ्गकुण्डु ने दानव गर्व निर्दलन
    दाशरथी करुणापयोनिधी ॥ नीमहनीयतत्त्व रस निर्ण यबोध कथामृताब्धिलो दामुनुग्रुङ्कुलाडकवृ थातनुकष्टमुजॆन्दि
    मानवुं डी महिलोकतीर्थमुल नॆल्ल मुनिङ्गिन दुर्विकार हृ तामसपङ्कमुल् विदुनॆ दाशरथी करुणापयोनिधी ॥ नीमहनीयतत्त्व
    रस निर्ण यबोध कथामृताब्धिलो दामुनुग्रुङ्कुलाडकवृ थातनुकष्टमुजॆन्दि मानवुं डी महिलोकतीर्थमुल नॆल्ल
    मुनिङ्गिन दुर्विकार हृ तामसपङ्कमुल् विदुनॆ दाशरथी करुणापयोनिधी ॥ काञ्चन वस्तुसङ्कलित कल्मष मग्नि पुटम्बु
    बॆट्टॆवा रिञ्चिनरीति नात्मनिगिडिञ्चिन दुष्कर दुर्मलत्रयं बञ्चित भ क्तियोग दह नार्चिँदगुल्पक पायुने
    कन त्काञ्चनकुण्डलाभरण दाशरथी करुणापयोनिधी ॥ नीसति पॆक्कु गल्मुलिडनेर्पिरि लोक मकल्मषम्बुगा नीसुत सेयु
    पावनमु निर्मित कार्यधुरीण दक्षुडै नीसुतुडिच्चु नायुवुलु निन्न भुजिञ्चिनँ गल्गकुण्डुने दासुलकीप्सि
    तार्थमुल दाशरथी करुणापयोनिधी ॥ वारिजपत्रमन्दिडिन वारिविधम्बुन वर्तनीयमं दारय रॊम्पिलोन दनु वण्टनि
    कुम्मरपुर्वुरीति सं सारमुन मॆलङ्गुचु विचारडैपरमॊन्दुगादॆस त्कार मॆऱिङ्गि मानवुडु दाशरथी करुणापयोनिधी
    ॥ ऎक्कडि तल्लिदण्ड्रि सुतुलॆक्कडि वारु कलत्र बान्धवं बॆक्कड जीवुँडॆट्टि तनु वॆत्तिन बुट्टुनु बोवुचुन्न
    वा डॊक्कडॆपाप पुणय फल मॊन्दिन नॊक्कडॆ कानराडुवे ऱॊक्कडु वॆण्टनण्टिभव मॊल्लनयाकृप जूडुवय्यनी टक्करि
    मायलन्दिडक दाशरथी करुणा पयोनिधी ॥ दॊरसिनकायमुल्मुदिमि तोचिनँजूचिप्रभुत्वमुल्सिरु ल्मॆऱपुलुगागजूचिमऱि
    मेदिनिलोँदमतोडिवारुमुं दरुगुटजूचिचूचि तॆगु नायुवॆऱुङ्गक मोहपाशमु लरुगनिवारिकेमिगति दाशरथी करुणापयोनिधी
    ॥ सिरिगलनाँडु मैमऱचि चिक्किननाँडुदलञ्चि पुण्यमुल् पॊरिँबॊरि सेयनैतिननि पॊक्किनँ गल्गु नॆगालिचिच्चुपैँ
    गॆरलिन वेलँदप्पिकॊनि कीड्पडु वेल जलम्बु गोरि त त्तरमुनँ द्रव्विनं गलदॆ दाशरथी करुणापयोनिधी ॥ जीवनमिङ्कँ
    बङ्कमुन जिक्किन मीनु चलिम्पकॆन्तयु दावुननिल्चि जीवनमॆ दद्दयुँ गोरुविधम्बु चॊप्पडं दावलमैनँगानि गुऱि
    तप्पनिवाँडु तरिञ्चुवाँडया तावकभक्तियो गमुन दाशरथी करुणापयोनिधी ॥ सरसुनिमानसम्बु सर सज्ञुडॆरुङ्गुनु
    मुष्कराधमुं डॆऱिँगिग्रहिञ्चुवाडॆ कॊल नेकनिसमुँ गागदुर्दुरं बरयँग नेर्चुनॆट्लु विक चाब्दमरन्द रसैक
    सौरभो त्करमुमिलिन्द मॊन्दुक्रिय दाशरथी करुणापयोनिधी ॥ नोँचिनतल्लिदण्ड्रिकिँ दनूभवुँडॊक्कडॆचालु मेटिचे
    चाँचनिवाडु वेऱॊकँडु चाचिन लेदन किच्चुवाँडुनो राँचिनिजम्बकानि पलु काडनिवाँडु रणम्बुलोन मेन् दाचनिवाँडु
    भद्रगिरि दाशरथी करुणापयोनिधी ॥ श्रीयुतजानकीरमण चिन्नयरूप रमेशराम ना रायण पाहिपाहियनि ब्रस्तुतिँ जेसिति
    नामनम्बुनं बायक किल्बिषव्रज वि पाटनमन्दँग जेसि सत्कला दायि फलम्बुनाकियवॆ दाशरथी करुणापयोनिधी ॥ ऎन्तटिपुण्यमो
    शबरि यॆङ्गिलिगॊण्टिवि विन्तगादॆ नी मन्तन मॆट्टिदो युडुत मैनिक राग्र नखाङ्कुरम्बुलन् सन्तसमन्दँ जेसितिवि
    सत्कुलजन्ममु लेमि लॆक्क वे दान्तमुगादॆ नी महिम दाशरथी करुणापयोनिधी ॥ बॊङ्कनिवाँडॆयोग्युडरि बृन्दमु
    लॆत्तिन चोटजिव्वकुं जङ्कनिवाँडॆजोदु रभसम्बुन नर्थि करम्बुसाँचिनं गॊङ्कनिवाँडॆदात मिमुँ गॊल्चिभजिञ्चिन
    वाँडॆ पोनिरा तङ्क मनस्कुँ डॆन्न गनु दाशरथी करुणापयोनिधी ॥ भ्रमरमुगीटकम्बुँ गॊनि पाल्पडि झाङ्करणो कारियै
    भ्रमरमुगानॊनर्चुननि पल्कुटँ जेसि भवादि दुःखसं तमसमॆडल्चि भक्तिसहि तम्बुग जीवुनि विश्वरूप त त्त्वमुनधरिञ्चु
    टेमरुदु दाशरथी करुणापयोनिधी ॥ तरुवुलु पूचिकायलगु दक्कुसुमम्बुलु पूजगाभव च्चरणमु सोकिदासुलकु सारमुलो
    धनधान्यराशुलै करिभट घोटकाम्बर नकायमुलै विरजा समु त्तरण मॊनर्चुजित्रमिदि दाशरथी करुणापयोनिधी ॥ पट्टितिभट्टरार्यगुरु
    पादमुलिम्मॆयिनूर्ध्व पुण्ड्रमुल् वॆट्टितिमन्त्रराज मॊडि बॆट्टिति नय्यमकिङ्क रालिकिं गट्टितिबॊम्ममीचरण
    कञ्जलन्दुँ दलम्पुपॆट्टि बो दट्टितिँ बापपुञ्जमुल दाशरथी करुणापयोनिधी ॥ अल्लन लिङ्गमन्त्रि सुतुडत्रिज
    गोत्रजुडादिशाख कं चॆर्ल कुलोद्बवुं दम्ब्रसिद्धिडनै भवदङ्कितम्बुगा नॆल्लकवुल् नुतिम्प रचियिञ्चिति गोपकवीन्द्रुडन्
    जग द्वल्लभ नीकु दासुडनु दाशरथी करुणापयोनिधी
