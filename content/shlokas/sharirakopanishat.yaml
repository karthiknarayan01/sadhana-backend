id: sharirakopanishat
category: upanishad
name:
  english: sharirakopanishat
  devanagari: शारीरकोपनिषत्
content:
  english: ittamatyantahkaranacatushtayam | tesham kramena sankalpavikalpadhyavasayabhimanavadharanasvarupashcaite
    vishayah | manahsthanam galantam buddhervadanamahankarasya hridayam cittasya nabhiriti | asthicarmanadiromamamsashceti
    prithivyamshah | mutrashleshmaraktashukrasveda abamshah | kshuttrishnalasyamohamaithunanyagneh | pracaranavilekhanasthulakshyunmeshanimeshadi
    vayoh | kamakrodhalobhamohabhayanyakashasya | shabdasparsharuparasagandhah prithivigunah | shabdasparsharuparasashcapam
    gunah | shabdasparsharupanyagnigunah | shabdasparshaviti vayugunau | shabda eka akashasya | sattvikarajasatamasalakshanani
    trayo gunah || ahimsa satyamasteyabrahmacaryaparigrahah | akrodho gurushushrusha shaucam santosha
    arjavam || 1|| amanitvamadambhitvamastikatvamahimsrata | ete sarve guna jneyah sattvikasya visheshatah
    || 2|| aham karta'smyaham bhokta'smyaham vakta'bhimanavan | ete guna rajasasya procyante brahmavittamaih
    || 3|| nidralasye moharagau maithunam cauryameva ca | ete gunastamasasya procyante brahmavadibhih
    || 4|| urdhve satviko madhye rajaso'dhastamasa iti | satyajnanam sattvikam | dharmajnanam rajasam
    | timirandham tamasamiti | jagratsvapnasushuptituriyamiti caturvidha avasthah | jnanendriyakarmendriyantahkaranacatushtayam
    caturdashakaranayuktam jagrat | antahkaranacatushtayaireva samyuktah svapnah | cittaikakarana sushuptih
    | kevalajivayuktameva turiyamiti | unmilitanimilitamadhyasthajivaparamatmanormadhye jivatma kshetrajna
    iti vijnayate || buddhikarmendriyapranapancakairmanasa dhiya | shariram saptadashabhih sukshmam tallingamucyate
    || 5|| mano buddhirahankarah khanilagnijalani bhuh | etah prakritayastvashtau vikarah shodashapare
    || 6|| shrotram tvakcakshushi jihva ghranam caiva tu pancamam | payupasthau karau padau vakcaiva dashami
    mata || 7|| shabdah sparshashca rupam ca raso gandhastathaiva ca | trayovimshatiretani tattvani prakritani
    tu | caturvimshatiravyaktam pradhanam purushah parah || 8|| ityupanishat || om saha navavatu | saha
    nau bhunaktu | saha viryam karavavahai | tejasvi navadhitamastu | ma vidvishavahai || om shantih shantih
    shantih || || iti krishnayajurvediya sharirakopanishatsamapta || adhikadhyayanaya
  devanagari: इत्तमत्यन्तःकरणचतुष्टयम् । तेषां क्रमेण सङ्कल्पविकल्पाध्यवसायाभिमानावधारणास्वरूपश्चैते विषयाः
    । मनःस्थानं गलान्तं बुद्धेर्वदनमहङ्कारस्य हृदयं चित्तस्य नाभिरिति । अस्थिचर्मनाडीरोममांसाश्चेति पृथिव्यंशाः
    । मूत्रश्लेष्मरक्तशुक्रस्वेदा अबंशाः । क्षुत्तृष्णालस्यमोहमैथुनान्यग्नेः । प्रचारणविलेखनस्थूलाक्ष्युन्मेषनिमेषादि
    वायोः । कामक्रोधलोभमोहभयान्याकाशस्य । शब्दस्पर्शरूपरसगन्धाः पृथिवीगुणाः । शब्दस्पर्शरूपरसाश्चापां
    गुणाः । शब्दस्पर्शरूपाण्यग्निगुणाः । शब्दस्पर्षाविति वायुगुणौ । शब्द एक आकाशस्य । सात्त्विकराजसतामसलक्षणानि
    त्रयो गुणाः ॥ अहिंसा सत्यमस्तेयब्रह्मचर्यापरिग्रहाः । अक्रोधो गुरुशुश्रुषा शौचं सन्तोष आर्जवम् ॥ १॥
    अमानित्वमदम्भित्वमास्तिकत्वमहिंस्रता । एते सर्वे गुणा ज्ञेयाः सात्त्विकस्य विशेषतः ॥ २॥ अहं कर्ताऽस्म्यहं
    भोक्ताऽस्म्यहं वक्ताऽभिमानवान् । एते गुणा राजसस्य प्रोच्यन्ते ब्रह्मवित्तमैः ॥ ३॥ निद्रालस्ये मोहरागौ
    मैथुनं चौर्यमेव च । एते गुणस्तामसस्य प्रोच्यन्ते ब्रह्मवादिभिः ॥ ४॥ ऊर्ध्वे सात्विको मध्ये रजसोऽधस्तामस
    इति । सत्यज्ञानं सात्त्विकम् । धर्मज्ञानं राजसम् । तिमिरान्धं तामसमिति । जाग्रत्स्वप्नसुषुप्तितुरीयमिति
    चतुर्विधा अवस्थाः । ज्ञानेन्द्रियकर्मेन्द्रियान्तःकरणचतुष्टयं चतुर्दशकरणयुक्तं जाग्रत् । अन्तःकरणचतुष्टयैरेव
    संयुक्तः स्वप्नः । चित्तैककरणा सुषुप्तिः । केवलजीवयुक्तमेव तुरीयमिति । उन्मीलितनिमीलितमध्यस्थजीवपरमात्मनोर्मध्ये
    जीवात्मा क्षेत्रज्ञ इति विज्ञायते ॥ बुद्धिकर्मेन्द्रियप्राणपञ्चकैर्मनसा धिया । शरीरं सप्तदशभिः सूक्ष्मं
    तल्लिङ्गमुच्यते ॥ ५॥ मनो बुद्धिरहङ्कारः खानिलाग्निजलानि भूः । एताः प्रकृतयस्त्वष्टौ विकाराः षोडशापरे
    ॥ ६॥ श्रोत्रं त्वक्चक्षुषी जिह्वा घ्राणं चैव तु पञ्चमम् । पायूपस्थौ करौ पादौ वाक्चैव दशमी मता ॥ ७॥
    शब्दः स्पर्शश्च रूपं च रसो गन्धस्तथैव च । त्रयोविंशतिरेतानि तत्त्वानि प्रकृतानि तु । चतुर्विंशतिरव्यक्तं
    प्रधानं पुरुषः परः ॥ ८॥ इत्युपनिषत् ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु
    । मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति कृष्णयजुर्वेदीय शारीरकोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
