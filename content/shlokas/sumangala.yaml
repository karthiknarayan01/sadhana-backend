id: sumangala
category: stotram
name:
  english: sumangala
  devanagari: सुमन्गल
content:
  english: sumangalastotram sumangalam mangalamishvaraya te sumangalam mangalamacyutaya te | sumangalam
    mangalamantaratmane sumangalam mangalamabjanabha te || sumangalam shrinilayoruvakshase sumangalam
    padmabhavadisevite | sumangalam padmajagannivasine sumangalam cashritamuktidayine || canuradarpaghnasubahudandayoh
    sumangalam mangalamadipurusha | balarkakotipratimaya te vibho cakraya daityendravinashahetave || shankhaya
    kotindusamanatejase sharngaya ratnojjvaladivyarupine | khadgaya vidyamayavigrahaya te sumangalam mangalamastu
    te vibho || tadavayostattva vishishtasheshine sheshitvasambandhanibodhanaya te | yanmangalanam ca
    sumangalaya te punah punarmangalamastu santatam || iti shrivishnucittasvamikritam sumangalastotram
    sampurnam |
  devanagari: सुमङ्गलस्तोत्रम् सुमङ्गलं मङ्गलमीश्वराय ते सुमङ्गलं मङ्गलमच्युताय ते । सुमङ्गलं मङ्गलमन्तरात्मने
    सुमङ्गलं मङ्गलमब्जनाभ ते ॥ सुमङ्गलं श्रीनिलयोरुवक्षसे सुमङ्गलं पद्मभवादिसेविते । सुमङ्गलं पद्मजगन्निवासिने
    सुमङ्गलं चाश्रितमुक्तिदायिने ॥ चाणूरदर्पघ्नसुबाहुदण्डयोः सुमङ्गलं मङ्गलमादिपूरुष । बालार्ककोटिप्रतिमाय
    ते विभो चक्राय दैत्येन्द्रविनाशहेतवे ॥ शङ्खाय कोटिन्दुसमानतेजसे शार्ङ्गाय रत्नोज्ज्वलदिव्यरूपिणे ।
    खड्गाय विद्यामयविग्रहाय ते सुमङ्गलं मङ्गलमस्तु ते विभो ॥ तदावयोस्तत्त्व विशिष्टशेषिणे शेषित्वसम्बन्धनिबोधनाय
    ते । यन्मङ्गलानां च सुमङ्गलाय ते पुनः पुनर्मङ्गलमस्तु सन्ततम् ॥ इति श्रीविष्णुचित्तस्वामिकृतं सुमङ्गलस्तोत्रं
    सम्पूर्णम् ।
