id: shivanandastotram
category: stotram
name:
  english: shivanandastotram
  devanagari: शिवानन्दस्तोत्रम्
content:
  english: ityakhya yasmai datta nijecchaya || 3|| bharatiyani tirthani parikramya svalilaya | sarvatraiveshvaram
    rupam drishtavantam namami tam || 4|| bahiryad drishyate kim ca sarvam tadishvaratmakam | ishatiriktam
    nastiti muktakantham vyaghoshayat || 5|| shriramakrishnadevam shrisharadam jananim tatha | vivekanandamurtim
    yo'pashyad hridi nirantaram || 6|| mumukshunamasankhyanamadhyatmikajalam dadat | nyapurayanmanastrishnam
    shivanandam namami tam || 7|| anirvanapradipasya shikhavat satyavigraham | shivanandam sada naumi
    dharmamarga pradarshakam || 8|| shriramakrishnasanghasya dvitiyam nayakam vibhum | shivakalpam shivanandamanantam
    pranamami tam || 9|| shivanandasya caritam smarantah shuddhamanasah | brahmasvarupatamante yanti nastyatra
    samshayah || 10|| iti adhyapakapandita shrikumudaranjanagosvamitarkavedantatirthaviracitam
  devanagari: इत्याख्या यस्मै दत्ता निजेच्छया ॥ ३॥ भारतीयानि तीर्थानि परिक्रम्य स्वलीलया । सर्वत्रैवेश्वरं
    रूपं दृष्टवन्तं नमामि तम् ॥ ४॥ बहिर्यद् दृश्यते किं च सर्वं तदीश्वरात्मकम् । ईशातिरिक्तं नास्तीति
    मुक्तकण्ठं व्यघोषयत् ॥ ५॥ श्रीरामकृष्णदेवं श्रीशारदां जननीं तथा । विवेकानन्दमूर्तिं योऽपश्यद् हृदि
    निरन्तरम् ॥ ६॥ मुमुक्षूणामसङ्ख्यानामाध्यात्मिकजलं ददत् । न्यपूरयन्मनस्तृष्णां शिवानन्दं नमामि तम्
    ॥ ७॥ अनिर्वाणप्रदीपस्य शिखावत् सत्यविग्रहम् । शिवानन्दं सदा नौमि धर्ममार्ग प्रदर्शकम् ॥ ८॥ श्रीरामकृष्णसङ्घस्य
    द्वितीयं नायकं विभुम् । शिवकल्पं शिवानन्दमनन्तं प्रणमामि तम् ॥ ९॥ शिवानन्दस्य चरितं स्मरन्तः शुद्धमानसाः
    । ब्रह्मस्वरूपतामन्ते यान्ति नास्त्यत्र संशयः ॥ १०॥ इति अध्यापकपण्डित श्रीकुमुदरञ्जनगोस्वामीतर्कवेदान्ततीर्थविरचितं
meaning: {}
