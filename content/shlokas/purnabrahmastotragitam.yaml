id: purnabrahmastotragitam
category: stotram
name:
  english: purnabrahmastotragitam
  devanagari: पूर्णब्रह्मस्तोत्रगीतम्
content:
  english: bandhu tvameva sarvam jagannathasvami bhaktabhavapremi namamyaham jagannathasvami bhaktabhavapremi
    namamyaham || 1|| kuncitakesham ca sancitavesham vartulasthulanayanam mamesham pinakaninaka nayanakosham
    akrishta oshtham ca utkrishta shvasam jagannathasvami bhaktabhavapremi namamyaham jagannathasvami
    bhaktabhavapremi namamyaham || 2|| nilacale cancalaya sahitam adideva nishcalanande sthitam anandakandam
    vishvavinducandram nandanandanam tvam indrasya indram jagannathasvami bhaktabhavapremi namamyaham
    jagannathasvami bhaktabhavapremi namamyaham || 3|| srishti
  devanagari: बन्धु त्वमेव सर्वं जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहम्
    ॥ १॥ कुञ्चितकेशं च सञ्चितवेशं वर्तुलस्थूलनयनं ममेशं पिनाकनीनाका नयनकोशं आकृष्ट ओष्ठं च उत्कृष्ट श्वासं
    जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहम् ॥ २॥ नीलाचले चञ्चलया सहितं
    आदिदेव निश्चलानन्दे स्थितं आनन्दकन्दं विश्वविन्दुचन्द्रं नन्दनन्दनं त्वं इन्द्रस्य इन्द्रं जगन्नाथस्वामी
    भक्तभावप्रेमी नमाम्यहं जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहम् ॥ ३॥ सृष्टि
