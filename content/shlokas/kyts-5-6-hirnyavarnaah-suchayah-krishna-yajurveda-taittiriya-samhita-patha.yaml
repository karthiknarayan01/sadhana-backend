    त्रीणि॒ वाव रेताग्ं॑सि पि॒ता पु॒त्रः पौत्रो॒ त्ति॒स्र उप॑ दधाति॒ रेत॑स॒ वाँव प्र॑थ॒मा रे॑त॒स्सिग्
