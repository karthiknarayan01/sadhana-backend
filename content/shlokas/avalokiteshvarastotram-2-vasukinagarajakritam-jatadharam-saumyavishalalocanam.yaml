id: avalokiteshvarastotram-2-vasukinagarajakritam-jatadharam-saumyavishalalocanam
category: stotram
name:
  english: avalokiteshvarastotram 2 (vasukinagarajakritam jatadharam saumyavishalalocanam)
  devanagari: अवलोकितेश्वरस्तोत्रम् २ (वासुकिनागराजकृतम् जटाधरं सौम्यविशाललोचनम्)
content:
  english: avalokiteshvarastotram 2 om namo'valokiteshvaraya | jatadharam saumyavishalalocanam sadaprasannananacandramandalam
    | surasurairvanditapadapankajam namami natham manipadmasambhavam || 1|| sarojapatrayatadivyalocanam
    kudrishtisamshodhitashuddhalocanam | kripamritardram jagadekalocanam namami natham manipadmasambhavam
    || 2|| harenduharardhahimadhikojjavalam nighrishtagandamalalolakundalam | gabhastimalakulakotisankulam
    namami natham manipadmasambhavam || 3|| prabuddhadharmadhvani dharmadhatukam sahasrabahum dvicatushca
    shadbhujam | khadhatuna tulyamanantabahukam namami natham manipadmasambhavam || 4|| upayaprajnodadhimanthanodbhavam
    tridhatusamrakshanahetusambhavam | jinendramaulim jinadhatusambhavam namami natham manipadmasambhavam
    || 5|| padmopari gatam natham padmahastam jatadharam | aryavalokitam vande sarvasattvanukampakam ||
    6|| iti shrivasukinagarajakritamaryavalokiteshvarastotram sampurnam ||
  devanagari: अवलोकितेश्वरस्तोत्रम् २ ॐ नमोऽवलोकितेश्वराय । जटाधरं सौम्यविशाललोचनं सदाप्रसन्नाननचन्द्रमण्डलम्
    । सुरासुरैर्वन्दितपादपङ्कजं नमामि नाथं मणिपद्मसम्भवम् ॥ १॥ सरोजपत्रायतदिव्यलोचनं कुदृष्टिसंशोधितशुद्धलोचनम्
    । कृपामृतार्द्रं जगदेकलोचनं नमामि नाथं मणिपद्मसम्भवम् ॥ २॥ हारेन्दुहारार्धहिमाधिकोज्जवलं निघृष्टगण्डामललोलकुण्डलम्
    । गभस्तिमालाकुलकोटिसङ्कुलं नमामि नाथं मणिपद्मसम्भवम् ॥ ३॥ प्रबुद्धधर्माध्वनि धर्मधातुकं सहस्रबाहुं
    द्विचतुश्च षड्भुजम् । खधातुना तुल्यमनन्तबाहुकं नमामि नाथं मणिपद्मसम्भवम् ॥ ४॥ उपायप्रज्ञोदधिमन्थनोद्भवं
    त्रिधातुसंरक्षणहेतुसम्भवम् । जिनेन्द्रमौलिं जिनधातुसम्भवं नमामि नाथं मणिपद्मसम्भवम् ॥ ५॥ पद्मोपरि
    गतं नाथं पद्महस्तं जटाधरम् । आर्यावलोकितं वन्दे सर्वसत्त्वानुकम्पकम् ॥ ६॥ इति श्रीवासुकिनागराजकृतमार्यावलोकितेश्वरस्तोत्रं
    सम्पूर्णम् ॥
