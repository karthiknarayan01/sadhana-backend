id: mantramat-ikapushpamala
category: mantra
name:
  english: mantramatṟikapushpamala
  devanagari: मन्त्रमात्ऱिकापुष्पमाला
content:
  english: padyam kunkumacandanadibharitairarghyam saratnakshataih | shuddhairacamaniyakam tava jalairbhaktya
    maya kalpitam karunyamritavaridhe tadakhilam santushtaye kalpatam || 3|| lakshye yogijanasya rakshitajagajjale
    vishalekshane praleyambupatirakunkumalasatkarpuramishrodakaih | gokshirairapi narikelasalilaih shuddhodakairmantritaih
    snanam devi dhiya mayaitadakhilam santushtaye kalpatam || 4|| hrinkarankitamantralakshitatano hemacalatsancitaih
    ratnairujjvalamuttariyasahitam kausumbhavarnamshukam | muktasantatiyajnasutramamalam sauvarnatantutbhavam
    dattam devi dhiya mayaitadakhilam santushtaye kalpatam || 5|| hamsairapyatilobhaniyagamane haravalimujjvalam
    hindoladyutihirapuritatare hemangadekankane | manjirau manikundale makutamapyardhenducudamanim nasamauktikamanguliyakatakau
    kancimapi svikuru || 6|| sarvange ghanasarakunkumaghanashrigandhapankankitam kasturitilakanca phalaphalake
    gorocanapatrakam | gandadarshanamandale nayanayordivyanjanam te'ncitam kanthabje mriganabhipankamamalam
    tvatpritaye kalpatam || 7|| kalharotpalamallikamaruvakaih sauvarnapankeruhai
  devanagari: पाद्यं कुङ्कुमचन्दनादिभरितैरर्घ्यं सरत्नाक्षतैः । शुद्धैराचमनीयकं तव जलैर्भक्त्या मया कल्पितं
    कारुण्यामृतवारिधे तदखिलं सन्तुष्टये कल्पताम् ॥ ३॥ लक्ष्ये योगिजनस्य रक्षितजगज्जाले विशालेक्षणे प्रालेयाम्बुपटीरकुङ्कुमलसत्कर्पूरमिश्रोदकैः
    । गोक्षीरैरपि नारिकेलसलिलैः शुद्धोदकैर्मन्त्रितैः स्नानं देवि धिया मयैतदखिलं सन्तुष्टये कल्पताम् ॥
    ४॥ ह्रीङ्काराङ्कितमन्त्रलक्षिततनो हेमाचलात्सञ्चितैः रत्नैरुज्ज्वलमुत्तरीयसहितं कौसुम्भवर्णांशुकम्
    । मुक्तासन्ततियज्ञसूत्रममलं सौवर्णतन्तूत्भवं दत्तं देवि धिया मयैतदखिलं सन्तुष्टये कल्पताम् ॥ ५॥ हम्सैरप्यतिलोभनीयगमने
    हारावलीमुज्ज्वलां हिन्दोलद्युतिहीरपूरिततरे हेमाङ्गदेकङ्कणे । मञ्जीरौ मणिकुण्डले मकुटमप्यर्धेन्दुचूडामणिं
    नासामौक्तिकमङ्गुलीयकटकौ काञ्चीमपि स्वीकुरु ॥ ६॥ सर्वाङ्गे घनसारकुङ्कुमघनश्रीगन्धपङ्काङ्कितं कस्तूरीतिलकञ्च
    फालफलके गोरोचनापत्रकम् । गण्डादर्शनमण्डले नयनयोर्दिव्याञ्जनं तेऽञ्चितं कण्ठाब्जे मृगनाभिपङ्कममलं त्वत्प्रीतये
    कल्पताम् ॥ ७॥ कल्हारोत्पलमल्लिकामरुवकैः सौवर्णपङ्केरुहै
