id: namavali-4-2
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shriannapurnashtottarashatanamavali || shriganeshaya namah || om annapurnayai namah | om shivayai
    namah | om devyai namah | om bhimayai namah | om pushtyai namah | om sarasvatyai namah | om sarvajnayai
    namah | om parvatyai namah | om durgayai namah | om sharvanyai namah || 10|| om shivavallabhayai namah
    | om vedavedyayai namah | om mahavidyayai namah | om vidyadatrai namah | om visharadayai namah | om
    kumaryai namah | om tripurayai namah | om balayai namah | om lakshmyai namah | om shriyai namah ||
    20|| om bhayaharinai namah | om bhavanyai namah | om vishnujananyai namah | om brahmadijananyai namah
    | om ganeshajananyai namah | om shaktyai namah | om kumarajananyai namah | om shubhayai namah | om
    bhogapradayai namah | om bhagavatyai namah || 30|| om bhaktabhishtapradayinyai namah | om bhavarogaharayai
    namah | om bhavyayai namah | om shubhrayai namah | om paramamangalayai namah | om bhavanyai namah
    | om cancalayai namah | om gauryai namah | om carucandrakaladharayai namah | om vishalakshyai namah
    || 40|| om vishvamatre namah | om vishvavandyayai namah | om vilasinyai namah | om aryayai namah |
    om kalyananilayayai namah | om rudranyai namah | om kamalasanayai namah | om shubhapradayai namah
    | om shubhavartayai namah | om vrittapinapayodharayai namah || 50|| om ambayai namah | om samharamathanyai
    namah | om mridanyai namah | om sarvamangalayai namah | om vishnusamsevitayai namah | om siddhayai
    namah | om brahmanyai namah | om surasevitayai namah | om paramanandadayai namah | om shantyai namah
    || 60|| om paramanandarupinyai namah | om paramanandajananyai namah | om parayai namah | om anandapradayinyai
    namah | om paropakaraniratayai namah | om paramayai namah | om bhaktavatsalayai namah | om purnacandrabhavadanayai
    namah | om purnacandranibhamshukayai namah | om shubhalakshanasampannayai namah || 70|| om shubhanandagunarnavayai
    namah | om shubhasaubhagyanilayayai namah | om shubhadayai namah | om ratipriyayai namah | om candikayai
    namah | om candamathanyai namah | om candadarpanivarinyai namah | om martandanayanayai namah | om
    sadhvyai namah | om candragninayanayai namah || 80|| om satyai namah | om pundarikaharayai namah |
    om purnayai namah | om punyadayai namah | om punyarupinyai namah | om mayatitayai namah | om shreshthamayayai
    namah | om shreshthadharmayai namah | om atmavanditayai namah | om asrishtyai namah || 90|| om sangarahitayai
    namah | om srishtihetave namah | om kapardinyai namah | om vrisharudhayai namah | om shulahastayai
    namah | om sthitisamharakarinyai namah | om mandasmitayai namah | om skandamatre namah | om shuddhacittayai
    namah | om munistutayai namah || 100|| om mahabhagavatyai namah | om dakshayai namah | om dakshadhvaravinashinyai
    namah | om sarvarthadatryai namah | om savitryai namah | om sadashivakutumbinyai namah | om nityasundarasarvangyai
    namah | om saccidanandalakshanayai namah | || iti shri annapurnashtottarashatanamavalih sampurnam
    ||
  devanagari: श्रीअन्नपूर्णाष्टोत्तरशतनामावली ॥ श्रीगणेशाय नमः ॥ ॐ अन्नपूर्णायै नमः । ॐ शिवायै नमः । ॐ
    देव्यै नमः । ॐ भीमायै नमः । ॐ पुष्ट्यै नमः । ॐ सरस्वत्यै नमः । ॐ सर्वज्ञायै नमः । ॐ पार्वत्यै नमः
    । ॐ दुर्गायै नमः । ॐ शर्वाण्यै नमः ॥ १०॥ ॐ शिववल्लभायै नमः । ॐ वेदवेद्यायै नमः । ॐ महाविद्यायै नमः
    । ॐ विद्यादात्रै नमः । ॐ विशारदायै नमः । ॐ कुमार्यै नमः । ॐ त्रिपुरायै नमः । ॐ बालायै नमः । ॐ लक्ष्म्यै
    नमः । ॐ श्रियै नमः ॥ २०॥ ॐ भयहारिणै नमः । ॐ भवान्यै नमः । ॐ विष्णुजनन्यै नमः । ॐ ब्रह्मादिजनन्यै नमः
    । ॐ गणेशजनन्यै नमः । ॐ शक्त्यै नमः । ॐ कुमारजनन्यै नमः । ॐ शुभायै नमः । ॐ भोगप्रदायै नमः । ॐ भगवत्यै
    नमः ॥ ३०॥ ॐ भक्ताभीष्टप्रदायिन्यै नमः । ॐ भवरोगहरायै नमः । ॐ भव्यायै नमः । ॐ शुभ्रायै नमः । ॐ परममङ्गलायै
    नमः । ॐ भवान्यै नमः । ॐ चञ्चलायै नमः । ॐ गौर्यै नमः । ॐ चारुचन्द्रकलाधरायै नमः । ॐ विशालाक्ष्यै नमः
    ॥ ४०॥ ॐ विश्वमात्रे नमः । ॐ विश्ववन्द्यायै नमः । ॐ विलासिन्यै नमः । ॐ आर्यायै नमः । ॐ कल्याणनिलायायै
    नमः । ॐ रुद्राण्यै नमः । ॐ कमलासनायै नमः । ॐ शुभप्रदायै नमः । ॐ शुभावर्तायै नमः । ॐ वृत्तपीनपयोधरायै
    नमः ॥ ५०॥ ॐ अम्बायै नमः । ॐ संहारमथन्यै नमः । ॐ मृडान्यै नमः । ॐ सर्वमङ्गलायै नमः । ॐ विष्णुसंसेवितायै
    नमः । ॐ सिद्धायै नमः । ॐ ब्रह्माण्यै नमः । ॐ सुरसेवितायै नमः । ॐ परमानन्ददायै नमः । ॐ शान्त्यै नमः
    ॥ ६०॥ ॐ परमानन्दरूपिण्यै नमः । ॐ परमानन्दजनन्यै नमः । ॐ परायै नमः । ॐ आनन्दप्रदायिन्यै नमः । ॐ परोपकारनिरतायै
    नमः । ॐ परमायै नमः । ॐ भक्तवत्सलायै नमः । ॐ पूर्णचन्द्राभवदनायै नमः । ॐ पूर्णचन्द्रनिभांशुकायै नमः
    । ॐ शुभलक्षणसम्पन्नायै नमः ॥ ७०॥ ॐ शुभानन्दगुणार्णवायै नमः । ॐ शुभसौभाग्यनिलयायै नमः । ॐ शुभदायै नमः
    । ॐ रतिप्रियायै नमः । ॐ चण्डिकायै नमः । ॐ चण्डमथन्यै नमः । ॐ चण्डदर्पनिवारिण्यै नमः । ॐ मार्ताण्डनयनायै
    नमः । ॐ साध्व्यै नमः । ॐ चन्द्राग्निनयनायै नमः ॥ ८०॥ ॐ सत्यै नमः । ॐ पुण्डरीकहरायै नमः । ॐ पूर्णायै
    नमः । ॐ पुण्यदायै नमः । ॐ पुण्यरूपिण्यै नमः । ॐ मायातीतायै नमः । ॐ श्रेष्ठमायायै नमः । ॐ श्रेष्ठधर्मायै
    नमः । ॐ आत्मवन्दितायै नमः । ॐ असृष्ट्यै नमः ॥ ९०॥ ॐ सङ्गरहितायै नमः । ॐ सृष्टिहेतवे नमः । ॐ कपर्दिन्यै
    नमः । ॐ वृषारूढायै नमः । ॐ शूलहस्तायै नमः । ॐ स्थितिसंहारकारिण्यै नमः । ॐ मन्दस्मितायै नमः । ॐ स्कन्दमात्रे
    नमः । ॐ शुद्धचित्तायै नमः । ॐ मुनिस्तुतायै नमः ॥ १००॥ ॐ महाभगवत्यै नमः । ॐ दक्षायै नमः । ॐ दक्षाध्वरविनाशिन्यै
    नमः । ॐ सर्वार्थदात्र्यै नमः । ॐ सावित्र्यै नमः । ॐ सदाशिवकुटुम्बिन्यै नमः । ॐ नित्यसुन्दरसर्वाङ्ग्यै
    नमः । ॐ सच्चिदानन्दलक्षणायै नमः । ॥ इति श्री अन्नपूर्णाष्टोत्तरशतनामावलिः सम्पूर्णम् ॥
