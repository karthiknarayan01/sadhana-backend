id: samplerig
category: veda
name:
  english: samplerig
  devanagari: सम्प्लेरिग्
content:
  english: rinuyama deva bhadram pashyemakshabhiryajatrah | 108916082 sthirairangaistushtuvamsastanubhirvyashemadevahitam
    yadayuh || 108916091 shatamin nu sharado anti deva yatra nashcakra jarasam tanunam | 108916092 putraso
    yatra pitaro bhavanti ma no madhya ririshatayurgantoh || 108916101 aditirdyauraditirantarikshamaditirmata
    sa pita sa putrah | 108916102 vishve deva aditih panca jana aditirjatamaditirjanitvam || 109017011
    rijuniti no varuno mitro nayatu vidvan | 109017012 aryama devaih sajoshah || 109017021 te hi vasvo
    vasavanaste apramura mahobhih | 109017022 vrata rakshante vishvaha || 109017031 te asmabhyam sharma
    yamsannamrita martyebhyah | 109017032 badhamanapa dvishah || 109017041 vi nah pathah suvitaya ciyantvindro
    marutah | 109017042 pusha bhago vandyasah || 109017051 uta no dhiyo goagrah pushan vishnavevayavah
    | 109017052 karta nah svastimatah || 109018061 madhu vata ritayate madhu ksharanti sindhavah | 109018062
    madhvirnah santvoshadhih || 109018071 madhu naktamutoshaso madhumat parthivam rajah | 109018072 madhu
    dyaurastu nah pita || 109018081 madhuman no vanaspatirmadhumanastu suryah | 109018082 madhvirgavo
    bhavantu nah || 109018091 sham no mitrah sham varunah sham no bhavatvaryama | 109018092 sham na indro
    brihaspatih sham no vishnururukramah ||
  devanagari: ृणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः । १०८९१६०८२ स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिर्व्यशेमदेवहितं
    यदायुः ॥ १०८९१६०९१ शतमिन् नु शरदो अन्ति देवा यत्रा नश्चक्रा जरसं तनूनाम् । १०८९१६०९२ पुत्रासो यत्र
    पितरो भवन्ति मा नो मध्या रीरिषतायुर्गन्तोः ॥ १०८९१६१०१ अदितिर्द्यौरदितिरन्तरिक्षमदितिर्माता स पिता
    स पुत्रः । १०८९१६१०२ विश्वे देवा अदितिः पञ्च जना अदितिर्जातमदितिर्जनित्वम् ॥ १०९०१७०११ ऋजुनीती नो
    वरुणो मित्रो नयतु विद्वान् । १०९०१७०१२ अर्यमा देवैः सजोषाः ॥ १०९०१७०२१ ते हि वस्वो वसवानास्ते अप्रमूरा
    महोभिः । १०९०१७०२२ व्रता रक्षन्ते विश्वाहा ॥ १०९०१७०३१ ते अस्मभ्यं शर्म यंसन्नमृता मर्त्येभ्यः । १०९०१७०३२
    बाधमानाप द्विषः ॥ १०९०१७०४१ वि नः पथः सुविताय चियन्त्विन्द्रो मरुतः । १०९०१७०४२ पूषा भगो वन्द्यासः
    ॥ १०९०१७०५१ उत नो धियो गोअग्राः पूषन् विष्णवेवयावः । १०९०१७०५२ कर्ता नः स्वस्तिमतः ॥ १०९०१८०६१ मधु
    वाता ऋतायते मधु क्षरन्ति सिन्धवः । १०९०१८०६२ माध्वीर्नः सन्त्वोषधीः ॥ १०९०१८०७१ मधु नक्तमुतोषसो मधुमत्
    पार्थिवं रजः । १०९०१८०७२ मधु द्यौरस्तु नः पिता ॥ १०९०१८०८१ मधुमान् नो वनस्पतिर्मधुमानस्तु सूर्यः ।
    १०९०१८०८२ माध्वीर्गावो भवन्तु नः ॥ १०९०१८०९१ शं नो मित्रः शं वरुणः शं नो भवत्वर्यमा । १०९०१८०९२ शं
    न इन्द्रो बृहस्पतिः शं नो विष्णुरुरुक्रमः ॥
