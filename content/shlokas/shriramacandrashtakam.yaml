id: shriramacandrashtakam
category: stotram
name:
  english: shriramacandrashtakam
  devanagari: श्रीरामचन्द्राष्टकम्
content:
  english: shriramacandrashtakam om cidakaro dhata paramasukhadah pavanatanur munindrairyogindrairyatipatisurendrairhanumata
    | sada sevyah purno janakatanayangah suraguru ramanatho ramo ramatu mama citte tu satatam || 1|| mukundo
    govindo janakatanayalalitapadah padam prapta yasyadhamakulabhava capi shabari | giratito'gamyo vimaladhishanairvedavacasa
    ramanatho ramo ramatu mama citte tu satatam || 2|| dharadhisho'dhishah suranaravaranam raghupatih
    kiriti keyuri kanakakapishah shobhitavapuh | samasinah pithe ravishatanibhe shantamanaso ramanatho
    ramo ramatu mama citte tu satatam || 3|| varenyah sharanyah kapipatisakhashcantavidhuro lalate kashmiro
    ruciragatibhangah shashimukhah | narakaro ramo yatipatinutah samsritiharo ramanatho ramo ramatu mama
    citte tu satatam || 4|| virupakshah kashyamupadishati yannama shivadam sahasram yannamnam pathati
    girija pratyushasi vai | svaloke gayantishvaravidhimukha yasya caritam ramanatho ramo ramatu mama
    citte tu satatam || 5|| paro dhiro'dhiro'surakulabhavashcasuraharah paratma sarvajno narasuraganairgitasuyashah
    | ahalyashapaghnah sharakararijuhkaushikasakho ramanatho ramo ramatu mama citte tu satatam || 6||
    hrishikeshah shaurirdharanidharashayi madhuripur upendro vaikuntho gajaripuharastushtamanasa | balidhvamsi
    viro dasharathasuto nitinipuno ramanatho ramo ramatu mama citte tu satatam || 7|| kavih saumitridyah
    kapatamrigaghati vanacaro ranashlaghi danto dharanibharaharta suranutah | amani manajno nikhilajanapujyo
    hridishayo ramanatho ramo ramatu mama citte tu satatam || 8|| idam ramastotram varamamaradasena racitam
    ushahkale bhaktya yadi pathati yo bhavasahitam | manushyah sa kshipram janimritibhayam tapajanakam
    parityajya shrishtham raghupatipadam yati shivadam || 9|| || iti shrimadramadasapujyapadashishyashrimaddham
    sadasashishyenamaradasakhyakavina viracitam shriramacandrashtakam samaptam
  devanagari: श्रीरामचन्द्राष्टकम् ॐ चिदाकारो धाता परमसुखदः पावनतनुर् मुनीन्द्रैर्योगीन्द्रैर्यतिपतिसुरेन्द्रैर्हनुमता
    । सदा सेव्यः पूर्णो जनकतनयाङ्गः सुरगुरू रमानाथो रामो रमतु मम चित्ते तु सततम् ॥ १॥ मुकुन्दो गोविन्दो
    जनकतनयालालितपदः पदं प्राप्ता यस्याधमकुलभवा चापि शबरी । गिरातीतोऽगम्यो विमलधिषणैर्वेदवचसा रमानाथो रामो
    रमतु मम चित्ते तु सततम् ॥ २॥ धराधीशोऽधीशः सुरनरवराणां रघुपतिः किरीटी केयूरी कनककपिशः शोभितवपुः । समासीनः
    पीठे रविशतनिभे शान्तमनसो रमानाथो रामो रमतु मम चित्ते तु सततम् ॥ ३॥ वरेण्यः शारण्यः कपिपतिसखश्चान्तविधुरो
    ललाटे काश्मीरो रुचिरगतिभङ्गः शशिमुखः । नराकारो रामो यतिपतिनुतः संसृतिहरो रमानाथो रामो रमतु मम चित्ते
    तु सततम् ॥ ४॥ विरूपाक्षः काश्यामुपदिशति यन्नाम शिवदं सहस्रं यन्नाम्नां पठति गिरिजा प्रत्युषसि वै ।
    स्वलोके गायन्तीश्वरविधिमुखा यस्य चरितं रमानाथो रामो रमतु मम चित्ते तु सततम् ॥ ५॥ परो धीरोऽधीरोऽसुरकुलभवश्चासुरहरः
    परात्मा सर्वज्ञो नरसुरगणैर्गीतसुयशाः । अहल्याशापघ्नः शरकरऋजुःकौशिकसखो रमानाथो रामो रमतु मम चित्ते
    तु सततम् ॥ ६॥ हृषीकेशः शौरिर्धरणिधरशायी मधुरिपुर् उपेन्द्रो वैकुण्ठो गजरिपुहरस्तुष्टमनसा । बलिध्वंसी
    वीरो दशरथसुतो नीतिनिपुणो रमानाथो रामो रमतु मम चित्ते तु सततम् ॥ ७॥ कविः सौमित्रीड्यः कपटमृगघाती वनचरो
    रणश्लाघी दान्तो धरणिभरहर्ता सुरनुतः । अमानी मानज्ञो निखिलजनपूज्यो हृदिशयो रमानाथो रामो रमतु मम चित्ते
    तु सततम् ॥ ८॥ इदं रामस्तोत्रं वरममरदासेन रचितम् उषःकाले भक्त्या यदि पठति यो भावसहितम् । मनुष्यः स
    क्षिप्रं जनिमृतिभयं तापजनकं परित्यज्य श्रीष्ठं रघुपतिपदं याति शिवदम् ॥ ९॥ ॥ इति श्रीमद्रामदासपूज्यपादशिष्यश्रीमद्धं
    सदासशिष्येणामरदासाख्यकविना विरचितं श्रीरामचन्द्राष्टकं समाप्तम्
