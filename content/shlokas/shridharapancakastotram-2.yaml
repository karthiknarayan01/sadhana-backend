id: shridharapancakastotram-2
category: stotram
name:
  english: shridharapancakastotram 2
  devanagari: श्रीधरपन्चकस्तोत्रम् २
content:
  english: shrishridharapancakastotram namami shridharam shantam satyadharmasvarupinam | svanandamritatriptam
    tam divyam brahmasanatanam || 1|| sarvatmanam mahatmanam vishvadharam maheshvaram | anadyanantam sarvajnam
    sadgurum mokshadayinam || 2|| dattatreyayatishreshtham ganagapuravasinam | ghritavataram dharmartham
    narasimhasarasvatim || 3|| bhaktartinashanam bhumasvaminam smartrigaminam | svatmabuddhipradataram
    dehabuddhivinashanam || 4|| atmakridam dayamurtim premabhaktipriyam vibhum | karunyavigraham punyam
    mokshashridharapavanam || 5|| iti shridharadasa bhave viracitam shrishridharapancakastotram sampurnam
    |
  devanagari: श्रीश्रीधरपञ्चकस्तोत्रम् नमामि श्रीधरं शान्तं सत्यधर्मस्वरूपिणम् । स्वानन्दामृततृप्तं तं
    दिव्यं ब्रह्मसनातनम् ॥ १॥ सर्वात्मानं महात्मानं विश्वाधारं महेश्वरम् । अनाद्यनन्तं सर्वज्ञं सद्गुरुं
    मोक्षदायिनम् ॥ २॥ दत्तात्रेययतिश्रेष्ठं गाणगापुरवासिनम् । घृतावतारं धर्मार्थं नरसिंहसरस्वतिम् ॥ ३॥
    भक्तार्तिनाशनं भूमास्वामिनं स्मर्तृगामिनम् । स्वात्मबुद्धिप्रदातारं देहबुद्धिविनाशनम् ॥ ४॥ आत्मक्रीडं
    दयामूर्तिं प्रेमभक्तिप्रियं विभुम् । कारुण्यविग्रहं पुण्यं मोक्षश्रीधरपावनम् ॥ ५॥ इति श्रीधरदास भावे
    विरचितं श्रीश्रीधरपञ्चकस्तोत्रं सम्पूर्णम् ।
meaning: {}
