id: vijayee-viswa-tiranga-pyaara
category: stotram
name:
  english: Vijayee Viswa Tiranga Pyaara
content:
  english: vijayi vishvatiranga pyara jhanda uncha rahe hamara ||jhanda|| sada shakti barsane vala prema
    sudha sarsane vala vironko harshane vala matribhumika tan man sara ||jhanda|| svatantrataki bhishana
    ran me lag kar badè josh kshan kshan me mit jave bhay sankat sara ||jhanda|| in jhandeke nice nirbhay
    le svarajya yaha avicala nishcay bolo bharat mataki jay svatantrata hi dhyey hamara ||jhanda|| is
    ki shan ni jane pave cahè jan bhalehi jayè vishva vijaya kar ke dikh lave tab huve prana purna hamara
    ||jhanda||
  devanagari: विजयी विश्वतिरङ्गा प्यारा झण्डा ऊञ्छा रहे हमारा ॥झण्डा॥ सदा शक्ति बर्साने वाला प्रेम सुधा
    सर्साने वाला वीरोङ्को हर्षाने वाला मातृभूमिका तन् मन् सारा ॥झण्डा॥ स्वतन्त्रताकी भीषण रण् मे लग् कर्
    बडॆ जोष् क्षण् क्षङ् मे मिट् जावे भय् सङ्कट् सारा ॥झण्डा॥ इन् झण्डेके नीचे निर्भय् ले स्वराज्य यह
    अविचल निश्चय् बोलो भारत् माताकी जय् स्वतन्त्रता हि ध्येय् हमारा ॥झण्डा॥ इस् की षान् नी जाने पावे चाहॆ
    जान् भलेहि जायॆ विश्व विजय कर् के दिख् लावे तब् हूवे प्रण पूर्ण हमारा ॥झण्डा॥
