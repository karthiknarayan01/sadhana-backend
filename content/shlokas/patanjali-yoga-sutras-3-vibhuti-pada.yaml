id: patanjali-yoga-sutras-3-vibhuti-pada
category: stotram
name:
  english: Patanjali Yoga Sutras - 3 (Vibhuti Pada)
content:
  english: shripatanjalayogadarshanam | atha vibhutipadah | deshabandhashcittasya dharana || || tatra
    pratyayaikatanata dhyanam || || tadevarthamatranirbhasam svarupashunyamiva samadhih || || trayamekatra
    samyamah || || tajjayat prajnalokah || || tasya bhumishu viniyogah || || trayamantarangam purvebhyah
    || || tadapi bahirangam nirbijasya || || vyutthananirodhasamskarayorabhibhavapradurbhavau nirodhakshanacittanvayo
    nirodhaparinamah || || tasya prashantavahita samskarat || || sarvarthataikagratayoh kshayodayau cittasya
    samadhiparinamah || || tatah punah shantoditau tulyapratyayau cittasyaikagrata parinamah || || etena
    bhutendriyeshu dharmalakshanavasthaparinama vyakhyatah || || shantoditavyapadeshyadharmanupati dharmi
    || || kramanyatvam parinamanyatve hetuh || || parinamatrayasamyamadatitanagatajnanam || || shabdarthapratyayanamitaretaradhyasat
    sankarastatpravibhagasamyamat sarvabhutarutajnanam || || samskarasakshatkaranat purvajatijnanam ||
    || pratyayasya paracittajnanam || || na ca tat salambanam tasyavishayibhutatvat || || kayarupasamyamat
    tadgrahyashaktistambhe cakshuh prakashasamprayoge'ntardhanam || || sopakramam nirupakramam ca karma
    tatsamyamadaparantajnanamarishtebhyo va || || maitryadishu balani || || baleshu hastibaladini || ||
    pravrittyalokanyasat sukshmavyavahitaviprakrishtajnanam || || bhuvanajnanam surye samyamat || || candre
    taravyuhajnanam || || dhruve tadgatijnanam || || nabhicakre kayavyuhajnanam || || kanthakupe kshutpipasanivrittih
    || || kurmanadyam sthairyam || || murdhajyotishi siddhadarshanam || || pratibhadva sarvam || || hridaye
    cittasamvit || || sattvapurushayoratyantasankirnayoh pratyayavishesho bhogah pararthatvat svarthasamyamat
    purushajnanam || || tatah pratibhashravanavedanadarshasvadavarta jayante || || te samadhavupasargavyutthane
    siddhayah || || bandhakaranashaithilyat pracarasamvedanacca cittasya parashariraveshah || || udanajayajjalapankakantakadishvasanga
    utkrantishca || || samanajayajjvalanam || || shrotrakashayoh sambandhasamyamat divyam shrotram ||
    || kayakashayoh sambandhasamyamat laghutulasamapatteshca akashagamanam || || bahirakalpita vrittirmahavideha
    tatah prakashavaranakshayah || || sthulasvarupasukshmanvayarthavattvasamyamat bhutajayah || || tato'nimadipradurbhavah
    kayasampat taddharmanabhighatashca || || rupalavanyabalavajrasamhananatvani kayasampat || || grahanasvarupasmitanvayarthavattvasamyamadindriyajayah
    || || tato manojavitvam vikaranabhavah pradhanajayashca || || sattvapurushanyatakhyatimatrasya sarvabhavadhishthatritvam
    sarvajnatritvanca || || tadvairagyadapi doshabijakshaye kaivalyam || || sthanyupanimantrane sangasmayakaranam
    punaranishtaprasangat || || kshanatatkramayoh samyamadvivekajam jnanam || || jatilakshanadeshairanyatanavacchedat
    tulyayostatah pratipattih || || tarakam sarvavishayam sarvathavishayamakramam ceti vivekajam jnanam
    || || sattvapurushayoh shuddhisamye kaivalyam || || iti shripatanjalayogadarshane vibhutipado nama
    tritiyah padah |
  devanagari: श्रीपातञ्जलयोगदर्शनम् । अथ विभूतिपादः । देशबन्धश्चित्तस्य धारणा ॥ ॥ तत्र प्रत्ययैकतानता
    ध्यानम् ॥ ॥ तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः ॥ ॥ त्रयमेकत्र संयमः ॥ ॥ तज्जयात् प्रज्ञालोकः
    ॥ ॥ तस्य भूमिषु विनियोगः ॥ ॥ त्रयमन्तरङ्गं पूर्वेभ्यः ॥ ॥ तदपि बहिरङ्गं निर्बीजस्य ॥ ॥ व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भावौ
    निरोधक्षणचित्तान्वयो निरोधपरिणामः ॥ ॥ तस्य प्रशान्तवाहिता संस्कारात् ॥ ॥ सर्वार्थतैकाग्रतयोः क्षयोदयौ
    चित्तस्य समाधिपरिणामः ॥ ॥ ततः पुनः शान्तोदितौ तुल्यप्रत्ययौ चित्तस्यैकाग्रता परिणामः ॥ ॥ एतेन भूतेन्द्रियेषु
    धर्मलक्षणावस्थापरिणामा व्याख्याताः ॥ ॥ शान्तोदिताव्यपदेश्यधर्मानुपाती धर्मी ॥ ॥ क्रमान्यत्वं परिणामान्यत्वे
    हेतुः ॥ ॥ परिणामत्रयसंयमादतीतानागतज्ञानम् ॥ ॥ शब्दार्थप्रत्ययानामितरेतराध्यासात् सङ्करस्तत्प्रविभागसंयमात्
    सर्वभूतरुतज्ञानम् ॥ ॥ संस्कारसाक्षात्करणात् पूर्वजातिज्ञानम् ॥ ॥ प्रत्ययस्य परचित्तज्ञानम् ॥ ॥ न च
    तत् सालम्बनं तस्याविषयीभूतत्वात् ॥ ॥ कायरूपसंयमात् तद्ग्राह्यशक्तिस्तम्भे चक्षुः प्रकाशासम्प्रयोगेऽन्तर्धानम्
    ॥ ॥ सोपक्रमं निरुपक्रमं च कर्म तत्संयमादपरान्तज्ञानमरिष्टेभ्यो वा ॥ ॥ मैत्र्यादिषु बलानि ॥ ॥ बलेषु
    हस्तिबलादीनि ॥ ॥ प्रवृत्त्यालोकन्यासात् सूक्ष्मव्यवहितविप्रकृष्टज्ञानम् ॥ ॥ भुवनज्ञानं सूर्ये संयमात्
    ॥ ॥ चन्द्रे ताराव्यूहज्ञानम् ॥ ॥ ध्रुवे तद्गतिज्ञानम् ॥ ॥ नाभिचक्रे कायव्यूहज्ञानम् ॥ ॥ कण्ठकूपे क्षुत्पिपासानिवृत्तिः
    ॥ ॥ कूर्मनाड्यां स्थैर्यम् ॥ ॥ मूर्धज्योतिषि सिद्धदर्शनम् ॥ ॥ प्रातिभाद्वा सर्वम् ॥ ॥ हृदये चित्तसंवित्
    ॥ ॥ सत्त्वपुरुषयोरत्यन्तासङ्कीर्णयोः प्रत्ययाविशेषो भोगः परार्थत्वात् स्वार्थसंयमात् पुरुषज्ञानम्
    ॥ ॥ ततः प्रातिभश्रावणवेदनादर्शास्वादवार्ता जायन्ते ॥ ॥ ते समाधावुपसर्गाव्युत्थाने सिद्धयः ॥ ॥ बन्धकारणशैथिल्यात्
    प्रचारसंवेदनाच्च चित्तस्य परशरीरावेशः ॥ ॥ उदानजयाज्जलपङ्ककण्टकादिष्वसङ्ग उत्क्रान्तिश्च ॥ ॥ समानजयाज्ज्वलनम्
    ॥ ॥ श्रोत्राकाशयोः सम्बन्धसंयमात् दिव्यं श्रोत्रम् ॥ ॥ कायाकाशयोः सम्बन्धसंयमात् लघुतूलसमापत्तेश्च
    आकाशगमनम् ॥ ॥ बहिरकल्पिता वृत्तिर्महाविदेहा ततः प्रकाशावरणक्षयः ॥ ॥ स्थूलस्वरूपसूक्ष्मान्वयार्थवत्त्वसंयमात्
    भूतजयः ॥ ॥ ततोऽणिमादिप्रादुर्भावः कायसम्पत् तद्धर्मानभिघातश्च ॥ ॥ रूपलावण्यबलवज्रसंहननत्वानि कायसम्पत्
    ॥ ॥ ग्रहणस्वरूपास्मितान्वयार्थवत्त्वसंयमादिन्द्रियजयः ॥ ॥ ततो मनोजवित्वं विकरणभावः प्रधानजयश्च ॥ ॥
    सत्त्वपुरुषान्यताख्यातिमात्रस्य सर्वभावाधिष्ठातृत्वं सर्वज्ञातृत्वञ्च ॥ ॥ तद्वैराग्यादपि दोषबीजक्षये
    कैवल्यम् ॥ ॥ स्थान्युपनिमन्त्रणे सङ्गस्मयाकरणं पुनरनिष्टप्रसङ्गात् ॥ ॥ क्षणतत्क्रमयोः संयमाद्विवेकजं
    ज्ञानम् ॥ ॥ जातिलक्षणदेशैरन्यतानवच्छेदात् तुल्ययोस्ततः प्रतिपत्तिः ॥ ॥ तारकं सर्वविषयं सर्वथाविषयमक्रमं
    चेति विवेकजं ज्ञानम् ॥ ॥ सत्त्वपुरुषयोः शुद्धिसाम्ये कैवल्यम् ॥ ॥ इति श्रीपातञ्जलयोगदर्शने विभूतिपादो
    नाम तृतीयः पादः ।
