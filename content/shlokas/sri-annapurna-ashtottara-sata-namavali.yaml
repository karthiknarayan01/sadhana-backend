id: sri-annapurna-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Annapurna Ashtottara Sata Namavali
content:
  english: om annapurnayai namah om shivayai namah om devyai namah om bhimayai namah om pushtyai namah
    om sarasvatyai namah om sarvajnayai namah om parvatyai namah om durgayai namah om sharvanyai namah
    om shivavallabhayai namah om vedavedyayai namah om mahavidyayai namah om vidyadatrai namah om visharadayai
    namah om kumaryai namah om tripurayai namah om balayai namah om lakshmyai namah om shriyai namah om
    bhayaharinyai namah om bhavanyai namah om vishnujananyai namah om brahmadijananyai namah om ganeshajananyai
    namah om shaktyai namah om kumarajananyai namah om shubhayai namah om bhogapradayai namah om bhagavatyai
    namah om bhaktabhishtapradayinyai namah om bhavarogaharayai namah om bhavyayai namah om shubhrayai
    namah om paramamangalayai namah om bhavanyai namah om cancalayai namah om gauryai namah om carucandrakaladharayai
    namah om vishalakshyai namah om vishvamatre namah om vishvavandyayai namah om vilasinyai namah om
    aryayai namah om kalyananilayayai namah om rudranyai namah om kamalasanayai namah om shubhapradayai
    namah om shubhayai namah om anantayai namah om vrittapinapayodharayai namah om ambayai namah om samharamathanyai
    namah om mridanyai namah om sarvamangalayai namah om vishnusamsevitayai namah om siddhayai namah om
    brahmanyai namah om surasevitayai namah om paramanandadayai namah om shantyai namah om paramanandarupinyai
    namah om paramanandajananyai namah om parayai namah om anandapradayinyai namah om paropakaraniratayai
    namah om paramayai namah om bhaktavatsalayai namah om purnacandrabhavadanayai namah om purnacandranibhamshukayai
    namah om shubhalakshanasampannayai namah om shubhanandagunarnavayai namah om shubhasaubhagyanilayayai
    namah om shubhadayai namah om ratipriyayai namah om candikayai namah om candamathanyai namah om candadarpanivarinyai
    namah om martandanayanayai namah om sadhvyai namah om candragninayanayai namah om satyai namah om
    pundarikaharayai namah om purnayai namah om punyadayai namah om punyarupinyai namah om mayatitayai
    namah om shreshthamayayai namah om shreshthadharmatmavanditayai namah om asrishtyai namah om sangarahitayai
    namah om srishtihetave namah om kapardinyai namah om vrisharudhayai namah om shulahastayai namah om
    sthitisamharakarinyai namah om mandasmitayai namah om skandamatre namah om shuddhacittayai namah om
    munistutayai namah om mahabhagavatyai namah om dakshayai namah om dakshadhvaravinashinyai namah om
    sarvarthadatryai namah om savitryai namah om sadashivakutumbinyai namah om nityasundarasarvangyai
    namah om saccidanandalakshanayai namah
  devanagari: ॐ अन्नपूर्णायै नमः ॐ शिवायै नमः ॐ देव्यै नमः ॐ भीमायै नमः ॐ पुष्ट्यै नमः ॐ सरस्वत्यै नमः
