id: ashtamurtirakshastotram
category: raksha
name:
  english: ashtamurtirakshastotram
  devanagari: अष्टमूर्तिरक्षास्तोत्रम्
content:
  english: sankasha deha he citsabhanatha vishvambharesha | shambho vibho bhimadahara pravishta vyomesha
    mam pahi kripayashtamurte || 5|| he bharga taranekhilalokasutra he dvadashatman shrutimantra gatra
    | ishana jyotirmayadityanetra ravirupa mam pahi mahasashtamurte || 6|| he soma somarddha shodashakalatman
    he tarakantastha shashikhandamaulin | svaminmahadeva manasaviharin shashirupa mam pahi sudhayashtamurte
    || 7|| he vishvayajnesha yajamanavesha he sarvabhutatmabhutaprakasha | prathitah pashunam patireka
    idya atmesha mam pahi paramashtamurte || 8|| paramatmanah khah prathamah prasutah vyomacca vayurjanitastatognih
    analajjalobhut adbhyastu dharanih suryendukalitan satatam namami | divyashtamurtin satatam namami
    samvinmayan tan satatam namami || 9|| iti shriishvaranandagiriviracitam ashtamurtirakshastotram sampurnam
    |
  devanagari: सङ्काश देह हे चित्सभानाथ विश्वम्भरेश । शम्भो विभो भीमदहर प्रविष्ट व्योमेश मां पाहि कृपयाष्टमूर्ते
    ॥ ५॥ हे भर्ग तरणेखिललोकसूत्र हे द्वादशात्मन् श्रुतिमन्त्र गात्र । ईशान ज्योतिर्मयादित्यनेत्र रविरूप
    मां पाहि महसाष्टमूर्ते ॥ ६॥ हे सोम सोमार्द्ध षोडशकलात्मन् हे तारकान्तस्थ शशिखण्डमौलिन् । स्वामिन्महादेव
    मानसविहारिन् शशिरूप मां पाहि सुधयाष्टमूर्ते ॥ ७॥ हे विश्वयज्ञेश यजमानवेष हे सर्वभूतात्मभूतप्रकाश ।
    प्रथितः पशूनां पतिरेक ईड्य आत्मेश मां पाहि परमाष्टमूर्ते ॥ ८॥ परमात्मनः खः प्रथमः प्रसूतः व्योमाच्च
    वायुर्जनितस्ततोग्निः अनलाज्जलोभूत् अद्भ्यस्तु धरणिः सूर्येन्दुकलितान् सततं नमामि । दिव्याष्टमूर्तीन्
    सततं नमामि संविन्मयान् तान् सततं नमामि ॥ ९॥ इति श्रीईश्वरनन्दगिरिविरचितं अष्टमूर्तिरक्षास्तोत्रं सम्पूर्णम्
    ।
