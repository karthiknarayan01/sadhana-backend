id: garbha-rakshambika-stotram
category: stotram
name:
  english: Garbha Rakshambika Stotram
  devanagari: गर्भरक्षाम्बिकास्तोत्रम्
content:
  english: shrimadhavi-kananasthe garbharakshambike pahi bhaktam stuvantam || vapitate vamabhage vamadevasya
    devasya devi sthita tvam | manya varenya vadanya pahi garbhasthajantun tatha bhaktalokan | shrimadhavi-kananasthe
    garbharakshambike pahi bhaktam stuvantam || 1|| shrigarbharakshapure ya divyasaundarya-yukta sumangalyagatri
    | dhatri janitri jananam divyarupam dayardram manojnam bhaje tvam | shrimadhavi-kananasthe garbharakshambike
    pahi bhaktam stuvantam || 2|| ashadhamase supunye shukravare sugandhena gandhena lipta | divyambarakalpavesha
    vajapeyadi-yagastha-bhaktaih sudrishta | shrimadhavi-kananasthe garbharakshambike pahi bhaktam stuvantam
    || 3|| kalyanadatrim namasye vedikakhya-striya garbharakshakarim tvam | balaissada sevitanghrim garbharaksharthamaradupetairupetam
    | shrimadhavi-kananasthe garbharakshambike pahi bhaktam stuvantam || 4|| brahmotsave vipravithyam
    vadyaghoshena tushtam rathe sannivishtam | sarvarthadatrim bhaje'ham devavrindairapidyam jaganmataram
    tvam | shrimadhavi-kananasthe garbharakshambike pahi bhaktam stuvantam || 5|| etat kritam stotraratnam
    dikshitanantaramena devyah sutushtyai | nityam pathedyastu bhaktya putrapautradi-bhagyam bhavettasya
    nityam || 6|| iti brahmashri anantaramadikshitavaryaviracitam garbharakshambika-stotram sampurnam
    ||
  devanagari: श्रीमाधवी-काननस्थे गर्भरक्षाम्बिके पाहि भक्तं स्तुवन्तम् ॥ वापीतटे वामभागे वामदेवस्य देवस्य
    देवी स्थिता त्वम् । मान्या वरेण्या वदान्या पाहि गर्भस्थजन्तून् तथा भक्तलोकान् । श्रीमाधवी-काननस्थे
    गर्भरक्षाम्बिके पाहि भक्तं स्तुवन्तम् ॥ १॥ श्रीगर्भरक्षापुरे या दिव्यसौन्दर्य-युक्ता सुमाङ्गल्यगात्री
    । धात्री जनित्री जनानां दिव्यरूपां दयार्द्रां मनोज्ञां भजे त्वाम् । श्रीमाधवी-काननस्थे गर्भरक्षाम्बिके
    पाहि भक्तं स्तुवन्तम् ॥ २॥ आषाढमासे सुपुण्ये शुक्रवारे सुगन्धेन गन्धेन लिप्ता । दिव्याम्बराकल्पवेषा
    वाजपेयादि-यागस्थ-भक्तैः सुदृष्टा । श्रीमाधवी-काननस्थे गर्भरक्षाम्बिके पाहि भक्तं स्तुवन्तम् ॥ ३॥ कल्याणदात्रीं
    नमस्ये वेदिकाख्य-स्त्रिया गर्भरक्षाकरीं त्वाम् । बालैस्सदा सेविताङ्घ्रिं गर्भरक्षार्थमारादुपेतैरुपेताम्
    । श्रीमाधवी-काननस्थे गर्भरक्षाम्बिके पाहि भक्तं स्तुवन्तम् ॥ ४॥ ब्रह्मोत्सवे विप्रवीथ्यां वाद्यघोषेण
    तुष्टां रथे सन्निविष्टाम् । सर्वार्थदात्रीं भजेऽहं देववृन्दैरपीड्यां जगन्मातरं त्वाम् । श्रीमाधवी-काननस्थे
    गर्भरक्षाम्बिके पाहि भक्तं स्तुवन्तम् ॥ ५॥ एतत् कृतं स्तोत्ररत्नं दीक्षितानन्तरामेण देव्याः सुतुष्ट्यै
    । नित्यं पठेद्यस्तु भक्त्या पुत्रपौत्रादि-भाग्यं भवेत्तस्य नित्यम् ॥ ६॥ इति ब्रह्मश्री अनन्तरामदीक्षितवर्यविरचितं
    गर्भरक्षाम्बिका-स्तोत्रं सम्पूर्णम् ॥
