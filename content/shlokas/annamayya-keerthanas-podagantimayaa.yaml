id: annamayya-keerthanas-podagantimayaa
category: stotram
name:
  english: Annamayya Keerthanas Podagantimayaa
content:
  english: attatalam pòdagantimayya mimmu purushottama mammu nèdayakavayya koneti rayada || korimammu
    nelinatti kuladaivama cala nerici pèddaliccina nidhanama | garavinci dappidircu kalameghama maku ceruvajittamuloni
    shrinivasuda || bhavimpa gaivasamaina parijatama mammu cevadera gacinatti cintamani | kavinci korikalicce
    kamadhenuva mammu tavai rakshinceti dharanidhara || cèdanika bratikince siddhamantrama roga ladaci
    rakshince divyaushadhama | badibayaka tirige pranabandhuda mammu gadiyincinatti shri venkatanathuda
    ||
  devanagari: अट्टतालं पॊडगण्टिमय्य मिम्मु पुरुषोत्तमा मम्मु नॆडयकवय्य कोनेटि रायडा ॥ कोरिमम्मु नेलिनट्टि
    कुलदैवमा चाल नेरिचि पॆद्दलिच्चिन निधानमा । गारविञ्चि दप्पिदीर्चु कालमेघमा माकु चेरुवजित्तमुलोनि श्रीनिवासुडा
    ॥ भाविम्प गैवसमैन पारिजातमा मम्मु चेवदेर गाचिनट्टि चिन्तामणी । काविञ्चि कोरिकलिच्चे कामधेनुवा मम्मु
    तावै रक्षिञ्चेटि धरणीधरा ॥ चॆडनीक ब्रतिकिञ्चे सिद्धमन्त्रमा रोगा लडचि रक्षिञ्चे दिव्यौषधमा । बडिबायक
    तिरिगे प्राणबन्धुडा मम्मु गडियिञ्चिनट्टि श्री वेङ्कटनाथुडा ॥
