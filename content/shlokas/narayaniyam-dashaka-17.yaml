id: narayaniyam-dashaka-17
category: stotram
name:
  english: Narayaniyam Dashaka 17
content:
  english: uttanapadanripatermanunandanasya jaya babhuva surucirnitaramabhishta | anya sunitiriti bharturanadrita
    sa tvameva nityamagatih sharanam gata'bhut || || anke pituh suruciputrakamuttamam tam drishtva dhruvah
    kila sunitisuto'dhirokshyan | acikshipe kila shishuh sutaram surucya dussantyaja khalu bhavadvimukhairasuya
    || || tvanmohite pitari pashyati daravashye duram duruktinihatah sa gato nijambam | sa'pi svakarmagatisantaranaya
    pumsam tvatpadameva sharanam shishave shashamsa || || akarnya so'pi bhavadarcananishcitatma mani niretya
    nagarat kila pancavarshah | sandrishtanaradaniveditamantramarga stvamararadha tapasa madhukananante
    || || tate vishannahridaye nagarim gatena shrinaradena parisantvitacittavrittau | balastvadarpitamanah
    kramavardhitena ninye kathoratapasa kila pancamasan || || tavattapobalanirucch vasite digante devarthitastvamudayatkarunardracetah
    | tvadrupacidrasanilinamateh purasta davirbabhuvitha vibho garudadhirudhah || || tvaddarshanapramadabharatarangitam
    tam drigbhyam nimagnamiva ruparasayane te | tushtushamanamavagamya kapoladeshe samsprishtavanasi darena
    tatha''darena || || tavadvibodhavimalam pranuvantamena mabhashathastvamavagamya tadiyabhavam | rajyam
    ciram samanubhuya bhajasva bhuyah sarvottaram dhruva padam vinivrittihinam || || ityucishi tvayi gate
    nripanandano'sa vananditakhilajano nagarimupetah | reme ciram bhavadanugrahapurnakama state gate ca
    vanamadritarajyabharah || || yakshena deva nihate punaruttame'smin yakshaih sa yuddhanirato virato
    manuktya | shantya prasannahridayaddhanadadupeta ttvadbhaktimeva sudridhamavrinonmahatma || || ante
    bhavatpurushanitavimanayato matra samam dhruvapade mudito'yamaste | evam svabhrityajanapalanaloladhistvam
    vatalayadhipa nirundhi mamamayaughan ||
  devanagari: उत्तानपादनृपतेर्मनुनन्दनस्य जाया बभूव सुरुचिर्नितरामभीष्टा । अन्या सुनीतिरिति भर्तुरनादृता
    सा त्वामेव नित्यमगतिः शरणं गताऽभूत् ॥ ॥ अङ्के पितुः सुरुचिपुत्रकमुत्तमं तं दृष्ट्वा ध्रुवः किल सुनीतिसुतोऽधिरोक्ष्यन्
    । आचिक्षिपे किल शिशुः सुतरां सुरुच्या दुस्सन्त्यजा खलु भवद्विमुखैरसूया ॥ ॥ त्वन्मोहिते पितरि पश्यति
    दारवश्ये दूरं दुरुक्तिनिहतः स गतो निजाम्बाम् । साऽपि स्वकर्मगतिसन्तरणाय पुंसां त्वत्पादमेव शरणं शिशवे
    शशंस ॥ ॥ आकर्ण्य सोऽपि भवदर्चननिश्चितात्मा मानी निरेत्य नगरात् किल पञ्चवर्षः । सन्दृष्टनारदनिवेदितमन्त्रमार्ग
    स्त्वामारराध तपसा मधुकाननान्ते ॥ ॥ ताते विषण्णहृदये नगरीं गतेन श्रीनारदेन परिसान्त्वितचित्तवृत्तौ
    । बालस्त्वदर्पितमनाः क्रमवर्धितेन निन्ये कठोरतपसा किल पञ्चमासान् ॥ ॥ तावत्तपोबलनिरुच्छ् वसिते दिगन्ते
    देवार्थितस्त्वमुदयत्करुणार्द्रचेताः । त्वद्रूपचिद्रसनिलीनमतेः पुरस्ता दाविर्बभूविथ विभो गरुडाधिरूढः
    ॥ ॥ त्वद्दर्शनप्रमदभारतरङ्गितं तं दृग्भ्यां निमग्नमिव रूपरसायने ते । तुष्टूषमाणमवगम्य कपोलदेशे संस्पृष्टवानसि
    दरेण तथाऽऽदरेण ॥ ॥ तावद्विबोधविमलं प्रणुवन्तमेन माभाषथास्त्वमवगम्य तदीयभावम् । राज्यं चिरं समनुभूय
    भजस्व भूयः सर्वोत्तरं ध्रुव पदं विनिवृत्तिहीनम् ॥ ॥ इत्यूचिषि त्वयि गते नृपनन्दनोऽसा वानन्दिताखिलजनो
    नगरीमुपेतः । रेमे चिरं भवदनुग्रहपूर्णकाम स्ताते गते च वनमादृतराज्यभारः ॥ ॥ यक्षेण देव निहते पुनरुत्तमेऽस्मिन्
    यक्षैः स युद्धनिरतो विरतो मनूक्त्या । शान्त्या प्रसन्नहृदयाद्धनदादुपेता त्त्वद्भक्तिमेव सुदृढामवृणोन्महात्मा
    ॥ ॥ अन्ते भवत्पुरुषनीतविमानयातो मात्रा समं ध्रुवपदे मुदितोऽयमास्ते । एवं स्वभृत्यजनपालनलोलधीस्त्वं
    वातालयाधिप निरुन्धि ममामयौघान् ॥
