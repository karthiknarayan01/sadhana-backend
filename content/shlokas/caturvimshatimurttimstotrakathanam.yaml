id: caturvimshatimurttimstotrakathanam
category: stotram
name:
  english: caturvimshatimurttimstotrakathanam
  devanagari: चतुर्विंशतिमूर्त्तिंस्तोत्रकथनम्
content:
  english: caturvimshatimurttimstotrakathanam bhagavanuvaca | omrupah keshavah padmashankhacakragadadharah
    | narayanah shankhapadmagadacakri pradakshinam || 1|| tato gadi madhavo'rishankhapadmi namami tam
    | cakrakaumodakipadmashankhi govinda urjitah || 2|| mokshadah shrigadi padmi shankhi vishnushca cakradhrik
    | shankhacakrabjagadinam madhusudanamaname || 3|| bhaktya trivikramah padmagadi cakri ca shankhyapi
    | shankhacakragadapadmi vamanah patu mam sada || 4|| gatidah shridharah padmi cakrasharngi ca shankhyapi
    | hripikesho gadi cakri padmi shankhi ca patu nah || 5|| varadah padmanabhastu shankhabjarigadadharah
    | damodarah padmashankhagadacakri namami tam || 6|| tene gadi shankhacakri vasudevo'bjabhrijjagat
    | sankarshano gadi shankhi padmi cakri ca patu vah || 7|| gadi cakri shankhagadi pradyumnah padmabhritprabhuh
    | aniruddhashcakragadi shankhi padmi ca patu nah || 8|| suresho'ryabjashankhadhyah shrigadi purupottamah
    | adhokshajah padmagadi shankhacakri ca patu vah || 9|| devo nrisimhashcakrabjagadi shankhi namami
    tam | acyutah shrigadi padmi cakri shankhi ca patu vah || 10|| balarupi shankhagadi upendrashcakrapadmyapi
    | janarddanah padmacakri shankhadhari gadadharah || 11|| shankhi padmi ca cakri ca harih kaumodakidharah
    | krishnah shankhi gadi padmi cakri me bhuktimuktidah || 12|| adimurtirvasudevastasmatsankarpano'bhavat
    | sankarshanacca pradyumnah pradyumnadaniruddhakah || 13|| keshavadiprabhedena ekaikasya tridha kramat
    | dvadashaksharakam stotram caturvimshatimurttimat || 14|| yah pathecchrinuyadvapi nirmalah sarvamapnuyat
    || 15|| ityadimahapurane agneye caturvimshatimurttistotram | nama ashtacatvarimsho'dhyayah || 48||
    agnipurana | adhyaya 48
  devanagari: चतुर्विंशतिमूर्त्तिंस्तोत्रकथनम् भगवानुवाच । ॐरूपः केशवः पद्मशङ्खचक्रगदाधरः । नारायणः शङ्खपद्मगदाचक्री
    प्रदक्षिणम् ॥ १॥ ततो गदी माधवोऽरिशङ्खपद्मी नमामि तम् । चक्रकौमोदकीपद्मशङ्खी गोविन्द ऊर्जितः ॥ २॥ मोक्षदः
    श्रीगदी पद्मी शङ्खी विष्णुश्च चक्रधृक् । शङ्खचक्राब्जगदिनं मधुसूदनमानमे ॥ ३॥ भक्त्या त्रिविक्रमः पद्मगदी
    चक्री च शङ्ख्यपि । शङ्खचक्रगदापद्मी वामनः पातु मां सदा ॥ ४॥ गतिदः श्रीधरः पद्मी चक्रशार्ङ्गी च शङ्ख्यपि
    । हृपीकेशो गदी चक्री पद्मी शङ्खी च पातु नः ॥ ५॥ वरदः पद्मनाभस्तु शङ्खाब्जारिगदाधरः । दामोदरः पद्मशङ्खगदाचक्री
    नमामि तम् ॥ ६॥ तेने गदी शङ्खचक्री वासुदेवोऽब्जभृज्जगत् । सङ्कर्षणो गदी शङ्खी पद्मी चक्री च पातु वः
    ॥ ७॥ गदी चक्री शङ्खगदी प्रद्युम्नः पद्मभृत्प्रभुः । अनिरुद्धश्चक्रगदी शङ्खी पद्मी च पातु नः ॥ ८॥ सुरेशोऽर्यब्जशङ्खाढ्यः
    श्रीगदी पुरुपोत्तमः । अधोक्षजः पद्मगदी शङ्खचक्री च पातु वः ॥ ९॥ देवो नृसिंहश्चक्राब्जगदी शङ्खी नमामि
    तम् । अच्युतः श्रीगदी पद्मी चक्री शङ्खी च पातु वः ॥ १०॥ बालरूपी शङ्खगदी उपेन्द्रश्चक्रपद्म्यपि । जनार्द्दनः
    पद्मचक्री शङ्खधारी गदाधरः ॥ ११॥ शङ्खी पद्मी च चक्री च हरिः कौमोदकीधरः । कृष्णः शङ्खी गदी पद्मी चक्री
    मे भुक्तिमुक्तिदः ॥ १२॥ आदिमूर्तिर्वासुदेवस्तस्मात्सङ्कर्पणोऽभवत् । सङ्कर्षणाच्च प्रद्युम्नः प्रद्युम्नादनिरुद्धकः
    ॥ १३॥ केशवादिप्रभेदेन एकैकस्य त्रिधा क्रमात् । द्वादशाक्षरकं स्तोत्रं चतुर्विंशातिमूर्त्तिमत् ॥ १४॥
    यः पठेच्छृणुयाद्वापि निर्मलः सर्वमाप्नुयात् ॥ १५॥ इत्यादिमहापुराणे आग्नेये चतुर्विंशतिमूर्त्तिस्तोत्रम्
    । नाम अष्टाचत्वारिंशोऽध्यायः ॥ ४८॥ अग्निपुराण । अध्याय ४८
