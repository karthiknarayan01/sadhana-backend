id: narayaniyam-dashaka-5
category: stotram
name:
  english: Narayaniyam Dashaka 5
content:
  english: vyaktavyaktamidam na kincidabhavatprakprakritaprakshaye mayayam gunasamyaruddhavikritau tvayyagatayam
    layam | no mrityushca tada'mritam ca samabhunnahno na ratreh sthiti statraikastvamashishyathah kila
    paranandaprakashatmana || || kalah karma gunashca jivanivaha vishvam ca karyam vibho cillilaratimeyushi
    tvayi tada nirlinatamayayuh | tesham naiva vadantyasattvamayi bhoh shaktyatmana tishthatam no cet
    kim gaganaprasunasadrisham bhuyo bhavetsambhavah || || evam ca dviparardhakalavigataviksham sisrikshatmikam
    bibhrane tvayi cukshubhe tribhuvanibhavaya maya svayam | mayatah khalu kalashaktirakhiladrishtam svabhavo'pi
    ca pradurbhuya gunanvikasya vidadhustasyassahayakriyam || || mayasannihito'pravishtavapusha sakshiti
    gito bhavan bhedaistam pratibimbato vivishivan jivo'pi naivaparah | kaladipratibodhita'tha bhavata
    sancodita ca svayam maya sa khalu buddhitattvamasrijadyo'sau mahanucyate || || tatrasau trigunatmako'pi
    ca mahan sattvapradhanah svayam jive'smin khalu nirvikalpamahamityudbodhanishpadkah | cakre'smin savikalpabodhakamahantattvam
    mahan khalvasau sampushtam trigunaistamo'tibahulam vishno bhavatpreranat || || so'ham ca trigunakramat
    trividhatamasadya vaikariko bhuyastaijasatamasaviti bhavannadyena sattvatmana devanindriyamanino'krita
    dishavatarkapashyashvino vahnindracyutamitrakan vidhuvidhishrirudrasharirakan || || bhuman manasabuddhyahankritimilaccittakhyavrittyanvitam
    taccantahkaranam vibho tava balat sattvamsha evasrijat | jatastaijasato dashendriyaganastattamasamshatpuna
    stanmatram nabhaso marutpurapate shabdo'jani tvadbalat || || shabdadvyoma tatah sasarjitha vibho sparsham
    tato marutam tasmadrupamato maho'tha ca rasam toyam ca gandham mahim | evam madhava purvapurvakalanadadyadyadharmanvitam
    bhutagramamimam tvameva bhagavan prakashayastamasat || || ete bhutaganastathendriyagana devashca jatah
    prithan no shekurbhuvanandanirmitividhau devairamibhistada | tvam nanavidhasuktibhirnutagunastattvanyamunyavisham
    shceshtashaktimudirya tani ghatayan hairanyamandam vyadhah || || andam tatkhalu purvasrishtasalile'tishthat
    sahasram samah nirbhindannakrithashcaturdashajagadrupam viradahvayam | sahasraih karapadamurdhanivahairnishsheshajivatmako
    nirbhato'si marutpuradhipa sa mam trayasva sarvamayat ||
  devanagari: व्यक्ताव्यक्तमिदं न किञ्चिदभवत्प्राक्प्राकृतप्रक्षये मायायां गुणसाम्यरुद्धविकृतौ त्वय्यागतायां
    लयम् । नो मृत्युश्च तदाऽमृतं च समभून्नाह्नो न रात्रेः स्थिति स्तत्रैकस्त्वमशिष्यथाः किल परानन्दप्रकाशात्मना
    ॥ ॥ कालः कर्म गुणाश्च जीवनिवहा विश्वं च कार्यं विभो चिल्लीलारतिमेयुषि त्वयि तदा निर्लीनतामाययुः ।
    तेषां नैव वदन्त्यसत्त्वमयि भोः शक्त्यात्मना तिष्ठतां नो चेत् किं गगनप्रसूनसदृशां भूयो भवेत्सम्भवः
    ॥ ॥ एवं च द्विपरार्धकालविगतावीक्षां सिसृक्षात्मिकां बिभ्राणे त्वयि चुक्षुभे त्रिभुवनीभावाय माया स्वयम्
    । मायातः खलु कालशक्तिरखिलादृष्टं स्वभावोऽपि च प्रादुर्भूय गुणान्विकास्य विदधुस्तस्यास्सहायक्रियाम्
    ॥ ॥ मायासन्निहितोऽप्रविष्टवपुषा साक्षीति गीतो भवान् भेदैस्तां प्रतिबिम्बतो विविशिवान् जीवोऽपि नैवापरः
    । कालादिप्रतिबोधिताऽथ भवता सञ्चोदिता च स्वयं माया सा खलु बुद्धितत्त्वमसृजद्योऽसौ महानुच्यते ॥ ॥ तत्रासौ
    त्रिगुणात्मकोऽपि च महान् सत्त्वप्रधानः स्वयं जीवेऽस्मिन् खलु निर्विकल्पमहमित्युद्बोधनिष्पाद्कः । चक्रेऽस्मिन्
    सविकल्पबोधकमहन्तत्त्वं महान् खल्वसौ सम्पुष्टं त्रिगुणैस्तमोऽतिबहुलं विष्णो भवत्प्रेरणात् ॥ ॥ सोऽहं
    च त्रिगुणक्रमात् त्रिविधतामासाद्य वैकारिको भूयस्तैजसतामसाविति भवन्नाद्येन सत्त्वात्मना देवानिन्द्रियमानिनोऽकृत
    दिशावातार्कपाश्यश्विनो वह्नीन्द्राच्युतमित्रकान् विधुविधिश्रीरुद्रशारीरकान् ॥ ॥ भूमन् मानसबुद्ध्यहङ्कृतिमिलच्चित्ताख्यवृत्त्यन्वितं
    तच्चान्तःकरणं विभो तव बलात् सत्त्वांश एवासृजत् । जातस्तैजसतो दशेन्द्रियगणस्तत्तामसांशात्पुन स्तन्मात्रं
    नभसो मरुत्पुरपते शब्दोऽजनि त्वद्बलात् ॥ ॥ शब्दाद्व्योम ततः ससर्जिथ विभो स्पर्शं ततो मारुतं तस्माद्रूपमतो
    महोऽथ च रसं तोयं च गन्धं महीम् । एवं माधव पूर्वपूर्वकलनादाद्याद्यधर्मान्वितं भूतग्राममिमं त्वमेव भगवन्
    प्राकाशयस्तामसात् ॥ ॥ एते भूतगणास्तथेन्द्रियगणा देवाश्च जाताः पृथङ् नो शेकुर्भुवनाण्डनिर्मितिविधौ
    देवैरमीभिस्तदा । त्वं नानाविधसूक्तिभिर्नुतगुणस्तत्त्वान्यमून्याविशं श्चेष्टाशक्तिमुदीर्य तानि घटयन्
    हैरण्यमण्डं व्यधाः ॥ ॥ अण्डं तत्खलु पूर्वसृष्टसलिलेऽतिष्ठत् सहस्रं समाः निर्भिन्दन्नकृथाश्चतुर्दशजगद्रूपं
    विराडाह्वयम् । साहस्रैः करपादमूर्धनिवहैर्निश्शेषजीवात्मको निर्भातोऽसि मरुत्पुराधिप स मां त्रायस्व
    सर्वामयात् ॥
