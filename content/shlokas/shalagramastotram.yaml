id: shalagramastotram
category: stotram
name:
  english: shalagramastotram
  devanagari: शालग्रामस्तोत्रम्
content:
  english: shrishalagramastotramantrajape viniyogah || yudhishthira uvaca | shridevadeva devesha devatarcanamuttamam
    | tatsarvam shrotumicchami bruhi me purushottama || 1|| shribhagavanuvaca | gandakyam cottare tire
    girirajasya dakshine | dashayojanavistirna mahakshetravasundhara || 2|| shalagramo bhaveddevo devi
    dvaravati bhavet | ubhayoh sangamo yatra muktistatra na samshayah || 3|| shalagramashila yatra yatra
    dvaravati shila | ubhayoh sangamo yatra muktistatra na samshayah || 4|| ajanmakritapapanam prayashcittam
    ya icchati | shalagramashilavari papahari namo'stu te || 5|| akalamrityuharanam sarvavyadhivinashanam
    | vishnoh padodakam pitva shirasa dharayamyaham || 6|| shankhamadhye sthitam toyam bhramitam keshavopari
    | angalagnam manushyanam brahmahatyadikam dahet || 7|| snanodakam pivennityam cakrankitashilodbhavam
    | prakshalya shuddham tattoyam brahmahatyam vyapohati || 8|| agnishtomasahasrani vajapeyashatani ca
    | samyak phalamavapnoti vishnornaivedyabhakshanat || 9|| naivedyayuktam tulasim ca mishritam visheshatah
    padajalena vishnoh | yo'shnati nityam purato murareh prapnoti yajnayutakotipunyam || 10|| khanditah
    sphutita bhinna vahnidagdhastathaiva ca | shalagramashila yatra tatra dosho na vidyate || 11|| na
    mantrah pujanam naiva na tirtham na ca bhavana | na stutirnopacarashca shalagramashilarcane || 12||
    brahmahatyadikam papam manovakkayasambhavam | shighram nashyati tatsarvam shalagramashilarcanat ||
    13|| nanavarnamayam caiva nanabhogena veshtitam | tatha varaprasadena lakshmikantam vadamyaham ||
    14|| narayanodbhavo devashcakramadhye ca karmana | tatha varaprasadena lakshmikantam vadamyaham ||
    15|| krishne shilatale yatra sukshmam cakram ca drishyate | saubhagyam santatim dhatte sarva saukhyam
    dadati ca || 16|| vasudevasya cihnani drishtva papaih pramucyate | shridharah sukare vame haridvarnastu
    drishyate || 17|| varaharupinam devam kurmangairapi cihnitam | gopadam tatra drishyeta varaham vamanam
    tatha || 18|| pitavarnam tu devanam raktavarnam bhayavaham | narasimho bhaveddevo mokshadam ca prakirtitam
    || 19|| shankhacakragadakurmah shankho yatra pradrishyate | shankhavarnasya devanam vame devasya lakshanam
    || 20|| damodaram tatha sthulam madhye cakram pratishthitam | purnadvarena sankirna pitarekha ca drishyate
    || 21|| chatrakare bhavedrajyam vartule ca mahashriyah | cipite ca mahaduhkham shulagre tu ranam dhruvam
    || 22|| lalate sheshabhogastu shiropari sukancanam | cakrakancanavarnanam vamadevasya lakshanam ||
    23|| vamaparshve ca vai cakre krishnavarnastu pingalam | lakshminrisimhadevanam prithagvarnastu drishyate
    || 24|| lamboshthe ca daridram syatpingale hanireva ca | lagnacakre bhavedyadhirvidare maranam dhruvam
    || 25|| padodakam ca nirmalyam mastake dharayetsada | vishnorddashtam bhakshitavyam tulasidalamishritam
    || 26|| kalpakotisahasrani vaikunthe vasate sada | shalagramashilabindurhatyakotivinashanah || 27||
    tasmatsampujayeddhyatva pujitam capi sarvada | shalagramashilastotram yah pathecca dvijottamah ||
    28|| sa gacchetparamam sthanam yatra lokeshvaro harih | sarvapapavinirmukto vishnulokam sa gacchati
    || 29|| dashavataro devanam prithagvarnastu drishyate | ipsitam labhate rajyam vishnupujamanukramat
    || 30|| kotyo hi brahmahatyanamagamyagamyakotayah | tah sarva nashamayanti vishnunaivedyabhakshanat
    || 31|| vishnoh padodakam pitva kotijanmaghanashanam | tasmadashtagunam papam bhumau bindunipatanat
    || 32|| raghuvara
  devanagari: श्रीशालग्रामस्तोत्रमन्त्रजपे विनियोगः ॥ युधिष्ठिर उवाच । श्रीदेवदेव देवेश देवतार्चनमुत्तमम्
    । तत्सर्वं श्रोतुमिच्छामि ब्रूहि मे पुरुषोत्तम ॥ १॥ श्रीभगवानुवाच । गण्डक्यां चोत्तरे तीरे गिरिराजस्य
    दक्षिणे । दशयोजनविस्तीर्णा महाक्षेत्रवसुन्धरा ॥ २॥ शालग्रामो भवेद्देवो देवी द्वारावती भवेत् । उभयोः
    सङ्गमो यत्र मुक्तिस्तत्र न संशयः ॥ ३॥ शालग्रामशिला यत्र यत्र द्वारावती शिला । उभयोः सङ्गमो यत्र मुक्तिस्तत्र
    न संशयः ॥ ४॥ आजन्मकृतपापानां प्रायश्चित्तं य इच्छति । शालग्रामशिलावारि पापहारि नमोऽस्तु ते ॥ ५॥ अकालमृत्युहरणं
    सर्वव्याधिविनाशनम् । विष्णोः पादोदकं पीत्वा शिरसा धारयाम्यहम् ॥ ६॥ शङ्खमध्ये स्थितं तोयं भ्रामितं
    केशवोपरि । अङ्गलग्नं मनुष्याणां ब्रह्महत्यादिकं दहेत् ॥ ७॥ स्नानोदकं पिवेन्नित्यं चक्राङ्कितशिलोद्भवम्
    । प्रक्षाल्य शुद्धं तत्तोयं ब्रह्महत्यां व्यपोहति ॥ ८॥ अग्निष्टोमसहस्राणि वाजपेयशतानि च । सम्यक् फलमवाप्नोति
    विष्णोर्नैवेद्यभक्षणात् ॥ ९॥ नैवेद्ययुक्तां तुलसीं च मिश्रितां विशेषतः पादजलेन विष्णोः । योऽश्नाति
    नित्यं पुरतो मुरारेः प्राप्नोति यज्ञायुतकोटिपुण्यम् ॥ १०॥ खण्डिताः स्फुटिता भिन्ना वह्निदग्धास्तथैव
    च । शालग्रामशिला यत्र तत्र दोषो न विद्यते ॥ ११॥ न मन्त्रः पूजनं नैव न तीर्थं न च भावना । न स्तुतिर्नोपचारश्च
    शालग्रामशिलार्चने ॥ १२॥ ब्रह्महत्यादिकं पापं मनोवाक्कायसम्भवम् । शीघ्रं नश्यति तत्सर्वं शालग्रामशिलार्चनात्
    ॥ १३॥ नानावर्णमयं चैव नानाभोगेन वेष्टितम् । तथा वरप्रसादेन लक्ष्मीकान्तं वदाम्यहम् ॥ १४॥ नारायणोद्भवो
    देवश्चक्रमध्ये च कर्मणा । तथा वरप्रसादेन लक्ष्मीकान्तं वदाम्यहम् ॥ १५॥ कृष्णे शिलातले यत्र सूक्ष्मं
    चक्रं च दृश्यते । सौभाग्यं सन्ततिं धत्ते सर्व सौख्यं ददाति च ॥ १६॥ वासुदेवस्य चिह्नानि दृष्ट्वा पापैः
    प्रमुच्यते । श्रीधरः सुकरे वामे हरिद्वर्णस्तु दृश्यते ॥ १७॥ वराहरूपिणं देवं कूर्माङ्गैरपि चिह्नितम्
    । गोपदं तत्र दृश्येत वाराहं वामनं तथा ॥ १८॥ पीतवर्णं तु देवानां रक्तवर्णं भयावहम् । नारसिंहो भवेद्देवो
    मोक्षदं च प्रकीर्तितम् ॥ १९॥ शङ्खचक्रगदाकूर्माः शङ्खो यत्र प्रदृश्यते । शङ्खवर्णस्य देवानां वामे देवस्य
    लक्षणम् ॥ २०॥ दामोदरं तथा स्थूलं मध्ये चक्रं प्रतिष्ठितम् । पूर्णद्वारेण सङ्कीर्णा पीतरेखा च दृश्यते
    ॥ २१॥ छत्राकारे भवेद्राज्यं वर्तुले च महाश्रियः । चिपिटे च महादुःखं शूलाग्रे तु रणं ध्रुवम् ॥ २२॥
    ललाटे शेषभोगस्तु शिरोपरि सुकाञ्चनम् । चक्रकाञ्चनवर्णानां वामदेवस्य लक्षणम् ॥ २३॥ वामपार्श्वे च वै
    चक्रे कृष्णवर्णस्तु पिङ्गलम् । लक्ष्मीनृसिंहदेवानां पृथग्वर्णस्तु दृश्यते ॥ २४॥ लम्बोष्ठे च दरिद्रं
    स्यात्पिङ्गले हानिरेव च । लग्नचक्रे भवेद्याधिर्विदारे मरणं ध्रुवम् ॥ २५॥ पादोदकं च निर्माल्यं मस्तके
    धारयेत्सदा । विष्णोर्द्दष्टं भक्षितव्यं तुलसीदलमिश्रितम् ॥ २६॥ कल्पकोटिसहस्राणि वैकुण्ठे वसते सदा
    । शालग्रामशिलाबिन्दुर्हत्याकोटिविनाशनः ॥ २७॥ तस्मात्सम्पूजयेद्ध्यात्वा पूजितं चापि सर्वदा । शालग्रामशिलास्तोत्रं
    यः पठेच्च द्विजोत्तमः ॥ २८॥ स गच्छेत्परमं स्थानं यत्र लोकेश्वरो हरिः । सर्वपापविनिर्मुक्तो विष्णुलोकं
    स गच्छति ॥ २९॥ दशावतारो देवानां पृथग्वर्णस्तु दृश्यते । ईप्सितं लभते राज्यं विष्णुपूजामनुक्रमात् ॥
    ३०॥ कोट्यो हि ब्रह्महत्यानामगम्यागम्यकोटयः । ताः सर्वा नाशमायान्ति विष्णुनैवेद्यभक्षणात् ॥ ३१॥ विष्णोः
    पादोदकं पीत्वा कोटिजन्माघनाशनम् । तस्मादष्टगुणं पापं भूमौ बिन्दुनिपातनात् ॥ ३२॥ रघुवर
