id: ganga-ashtakam
category: stotram
name:
  english: Ganga Ashtakam
content:
  english: bhagavati tava tire niramatrashano'ham vigatavishayatrishnah krishnamaradhayami | sakala kalushabhange
    svargasopanasange taralataratarange devi gange prasida || || bhagavati bhavalila maulimale tavambhah
    kanamanuparimanam pranino ye sprishanti | amaranagaranari camara grahininam vigata kalikalankatankamanke
    luthanti || || brahmandam khandayanti harashirasi jatavallimullasayanti svarlokadapatanti kanakagiriguhagandashailat
    skhalanti | kshoniprishthe luthanti duritacayacamurnirbharam bhartsayanti pathodhim purayanti suranagarasaritpavani
    nah punatu || || majjanmatanga kumbhacyuta madamadiramodamattalijalam snanaih siddhangananam kucayuga
    vilasatkunkumasangapingam | sayam pratarmuninam kushakusumacayaishchinnatirasthaniram payanno gangamambhah
    karikalabha karakranta rangastarangam || || adavadi pitamahasya niyama vyapara patre jalam pashcatpannagashayino
    bhagavatah padodakam pavanam | bhuyah shambhujatavibhushana manirjahnormaharsheriyam kanya kalmashanashini
    bhagavati bhagirathi drishyate || || shailendradavatarini nijajale majjajjanottarini paravaraviharini
    bhavabhayashreni samutsarini | sheshangairanukarini harashirovallidalakarini kashiprantaviharini vijayate
    ganga manoharini || || kuto vicirvicistava yadi gata locanapatham tvamapita pitambarapuravasam vitarasi
    | tvadutsange gange patati yadi kayastanubhritam tada matah shantakratavapadalabho'pyatilaghuh ||
    || gange trailokyasare sakalasuravadhudhautavistirnatoye purnabrahmasvarupe haricaranarajoharini svargamarge
    | prayashcitam yadi syattava jalakanika brahmahatyadi pape kastvam stotum samarthah trijagadaghahare
    devi gange prasida || || matarjahnavi shambhusangamilite maulau nidhayanjalim tvattire vapusho'vasanasamaye
    narayananghridvayam | sanandam smarato bhavishyati mama pranaprayanotsave bhuyadbhaktiravicyuta hariharadvaitatmika
    shashvati || || gangashtakamidam punyam yah pathetprayato narah | sarvapapavinirmukto vishnulokam
    sa gacchati ||
  devanagari: भगवति तव तीरे नीरमात्राशनोऽहम् विगतविषयतृष्णः कृष्णमाराधयामि । सकल कलुषभङ्गे स्वर्गसोपानसङ्गे
    तरलतरतरङ्गे देवि गङ्गे प्रसीद ॥ ॥ भगवति भवलीला मौलिमाले तवाम्भः कणमणुपरिमाणं प्राणिनो ये स्पृशन्ति
    । अमरनगरनारी चामर ग्राहिणीनां विगत कलिकलङ्कातङ्कमङ्के लुठन्ति ॥ ॥ ब्रह्माण्डं खण्डयन्ती हरशिरसि जटावल्लिमुल्लासयन्ती
    स्वर्लोकादापतन्ती कनकगिरिगुहागण्डशैलात् स्खलन्ती । क्षोणीपृष्ठे लुठन्ती दुरितचयचमूर्निर्भरं भर्त्सयन्ती
    पाथोधिं पूरयन्ती सुरनगरसरित्पावनी नः पुनातु ॥ ॥ मज्जन्मातङ्ग कुम्भच्युत मदमदिरामोदमत्तालिजालं स्नानैः
    सिद्धाङ्गनानां कुचयुग विलसत्कुङ्कुमासङ्गपिङ्गम् । सायं प्रातर्मुनीनां कुशकुसुमचयैश्छिन्नतीरस्थनीरं
    पायान्नो गाङ्गमम्भः करिकलभ कराक्रान्त रङ्गस्तरङ्गम् ॥ ॥ आदावादि पितामहस्य नियम व्यापार पात्रे जलं
    पश्चात्पन्नगशायिनो भगवतः पादोदकं पावनम् । भूयः शम्भुजटाविभूषण मणिर्जह्नोर्महर्षेरियं कन्या कल्मषनाशिनी
    भगवती भागीरथी दृश्यते ॥ ॥ शैलेन्द्रादवतारिणी निजजले मज्जज्जनोत्तारिणी पारावारविहारिणी भवभयश्रेणी समुत्सारिणी
    । शेषाङ्गैरनुकारिणी हरशिरोवल्लीदलाकारिणी काशीप्रान्तविहारिणी विजयते गङ्गा मनोहारिणी ॥ ॥ कुतो वीचिर्वीचिस्तव
    यदि गता लोचनपथं त्वमापीता पीताम्बरपुरवासं वितरसि । त्वदुत्सङ्गे गङ्गे पतति यदि कायस्तनुभृतां तदा मातः
    शान्तक्रतवपदलाभोऽप्यतिलघुः ॥ ॥ गङ्गे त्रैलोक्यसारे सकलसुरवधूधौतविस्तीर्णतोये पूर्णब्रह्मस्वरूपे हरिचरणरजोहारिणि
    स्वर्गमार्गे । प्रायश्चितं यदि स्यात्तव जलकणिका ब्रह्महत्यादि पापे कस्त्वां स्तोतुं समर्थः त्रिजगदघहरे
    देवि गङ्गे प्रसीद ॥ ॥ मातर्जाह्नवी शम्भुसङ्गमिलिते मौलौ निधायाञ्जलिं त्वत्तीरे वपुषोऽवसानसमये नारायणाङ्घ्रिद्वयम्
    । सानन्दं स्मरतो भविष्यति मम प्राणप्रयाणोत्सवे भूयाद्भक्तिरविच्युता हरिहराद्वैतात्मिका शाश्वती ॥ ॥
    गङ्गाष्टकमिदं पुण्यं यः पठेत्प्रयतो नरः । सर्वपापविनिर्मुक्तो विष्णुलोकं स गच्छति ॥
