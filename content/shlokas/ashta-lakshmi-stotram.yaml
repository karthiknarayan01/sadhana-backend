id: ashta-lakshmi-stotram
category: stotram
name:
  english: Ashta Lakshmi Stotram
  devanagari: अष्टलक्ष्मीस्तोत्रम्
content:
  english: '|| adilakshmi || sumanasavandita sundari madhavi candra sahodari hemamaye | muniganamandita
    mokshapradayini manjuḻabhashini vedanute || pankajavasini devasupujita sadgunavarshini shantiyute
    | jayajaya he madhusudana kamini adilakshmi sada palaya mam|h || 1|| || dhanyalakshmi || ahikali kalmashanashini
    kamini vaidikarupini vedamaye | kshirasamudbhava mangalarupini mantranivasini mantranute || mangaladayini
    ambujavasini devaganashrita padayute | jayajaya he madhusudana kamini dhanyalakshmi sada palaya mam|h
    || 2|| || dhairyalakshmi || jayavaravarnini vaishnavi bhargavi mantrasvarupini mantramaye | suraganapujita
    shighraphalaprada jnanavikasini shastranute || bhavabhayaharini papavimocani sadhujanashrita padayute
    | jayajaya he madhusudana kamini dhairyalakshmi sada palaya mam|h || 3|| || gajalakshmi || jayajaya
    durgatinashini kamini sarvaphalaprada shastramaye | rathagaja turagapadadi samavrita parijanamandita
    lokanute || harihara brahma supujita sevita tapanivarini padayute | jayajaya he madhusudana kamini
    gajalakshmi rupena palaya mam|h || 4|| || santanalakshmi || ahikhaga vahini mohini cakrini ragavivardhini
    jnanamaye | gunaganavaridhi lokahitaishini svarasapta bhushita gananute || sakala surasura devamunishvara
    manavavandita padayute | jayajaya he madhusudana kamini santanalakshmi tvam palaya mam|h || 5|| ||
    vijayalakshmi || jaya kamalasani sadgatidayini jnanavikasini ganamaye | anudinamarcita kunkumadhusara-
    bhushita vasita vadyanute || kanakadharastuti vaibhava vandita shankara deshika manya pade | jayajaya
    he madhusudana kamini vijayalakshmi sada palaya mam|h || 6|| || vidyalakshmi || pranata sureshvari
    bharati bhargavi shokavinashini ratnamaye | manimayabhushita karnavibhushana shantisamavrita hasyamukhe
    || navanidhidayini kalimalaharini kamita phalaprada hastayute | jayajaya he madhusudana kamini vidyalakshmi
    sada palaya mam|h ||7|| || dhanalakshmi || dhimidhimi dhimdhimi dhimdhimi dhimdhimi dundubhi nada
    supurnamaye | ghumaghuma ghumghuma ghumghuma ghumghuma shankhaninada suvadyanute || vedapuranetihasa
    supujita vaidikamarga pradarshayute | jayajaya he madhusudana kamini dhanalakshmi rupena palaya mam|h
    || 8||'
  devanagari: ॥ आदिलक्ष्मी ॥ सुमनसवन्दित सुन्दरि माधवि चन्द्र सहोदरि हेममये । मुनिगणमण्डित मोक्षप्रदायिनि
    मञ्जुळभाषिणि वेदनुते ॥ पङ्कजवासिनि देवसुपूजित सद्गुणवर्षिणि शान्तियुते । जयजय हे मधुसूदन कामिनि आदिलक्ष्मि
    सदा पालय माम्।ह् ॥ १॥ ॥ धान्यलक्ष्मी ॥ अहिकलि कल्मषनाशिनि कामिनि वैदिकरूपिणि वेदमये । क्षीरसमुद्भव
    मङ्गलरूपिणि मन्त्रनिवासिनि मन्त्रनुते ॥ मङ्गलदायिनि अम्बुजवासिनि देवगणाश्रित पादयुते । जयजय हे मधुसूदन
    कामिनि धान्यलक्ष्मि सदा पालय माम्।ह् ॥ २॥ ॥ धैर्यलक्ष्मी ॥ जयवरवर्णिनि वैष्णवि भार्गवि मन्त्रस्वरूपिणि
    मन्त्रमये । सुरगणपूजित शीघ्रफलप्रद ज्ञानविकासिनि शास्त्रनुते ॥ भवभयहारिणि पापविमोचनि साधुजनाश्रित
    पादयुते । जयजय हे मधुसूदन कामिनि धैर्यलक्ष्मि सदा पालय माम्।ह् ॥ ३॥ ॥ गजलक्ष्मी ॥ जयजय दुर्गतिनाशिनि
    कामिनि सर्वफलप्रद शास्त्रमये । रथगज तुरगपदादि समावृत परिजनमण्डित लोकनुते ॥ हरिहर ब्रह्म सुपूजित सेवित
    तापनिवारिणि पादयुते । जयजय हे मधुसूदन कामिनि गजलक्ष्मि रूपेण पालय माम्।ह् ॥ ४॥ ॥ सन्तानलक्ष्मी ॥ अहिखग
    वाहिनि मोहिनि चक्रिणि रागविवर्धिनि ज्ञानमये । गुणगणवारिधि लोकहितैषिणि स्वरसप्त भूषित गाननुते ॥ सकल
    सुरासुर देवमुनीश्वर मानववन्दित पादयुते । जयजय हे मधुसूदन कामिनि सन्तानलक्ष्मि त्वं पालय माम्।ह् ॥
    ५॥ ॥ विजयलक्ष्मी ॥ जय कमलासनि सद्गतिदायिनि ज्ञानविकासिनि गानमये । अनुदिनमर्चित कुङ्कुमधूसर- भूषित
    वासित वाद्यनुते ॥ कनकधरास्तुति वैभव वन्दित शङ्कर देशिक मान्य पदे । जयजय हे मधुसूदन कामिनि विजयलक्ष्मि
    सदा पालय माम्।ह् ॥ ६॥ ॥ विद्यालक्ष्मी ॥ प्रणत सुरेश्वरि भारति भार्गवि शोकविनाशिनि रत्नमये । मणिमयभूषित
    कर्णविभूषण शान्तिसमावृत हास्यमुखे ॥ नवनिधिदायिनि कलिमलहारिणि कामित फलप्रद हस्तयुते । जयजय हे मधुसूदन
    कामिनि विद्यालक्ष्मि सदा पालय माम्।ह् ॥७॥ ॥ धनलक्ष्मी ॥ धिमिधिमि धिंधिमि धिंधिमि धिंधिमि दुन्दुभि
    नाद सुपूर्णमये । घुमघुम घुंघुम घुंघुम घुंघुम शङ्खनिनाद सुवाद्यनुते ॥ वेदपुराणेतिहास सुपूजित वैदिकमार्ग
    प्रदर्शयुते । जयजय हे मधुसूदन कामिनि धनलक्ष्मि रूपेण पालय माम्।ह् ॥ ८॥
