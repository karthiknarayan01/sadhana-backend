id: shatrumardanamshatkarmanamkavacam
category: kavacha
name:
  english: shatrumardanamshatkarmanamkavacam
  devanagari: शत्रुमर्दनम्षट्कर्मणांकवचम्
content:
  english: rinu devi mahabhage savadhanavadharaya | shatrunam prananashartham kupitah kala eva sah ||
    11|| dashavaktra dashabhuja dashapadanjanaprabha | kotisuryaprabha kali mama shatrun vinashaya | nashayitva
    kshanam devi anyashatrun vinashaya || 12|| krim krim krim ugraprabhe vikatadamshtre parapaksham mohaya
    mohaya paca paca matha matha daha daha hana hana maraya maraya ye mam himsitumudyata yoginicakraistan
    varaya varaya chindhi chindhi bhindhi bhindhi karalini grihnagrihna om krim krim krim krim sphura
    sphura pura pura puna puna culva culva dhaka dhaka dhama dhama maraya maraya sarvajagadvashamanaya
    om namah svaha | iti te kavacam devi bhadrakalya pracoditam | bhurje vilikhitancaitat svarnastham
    dharayedyadi || 13|| shikhayam dakshine bahau kanthe va dharayedyadi | trailokyam mohayetkrodhattrailokyam
    curnayetkshanat || 14|| putravandhanavandhiman nanavidyanidhirbhavet | brahmakhadini shastrani tadgatrasparshanattatah
    || 15|| shatravo nashamayanti rajatena pragharitam | masamatrena shatrunam mahavipadakaranam || 16||
    yam yam shatrum smaranmartyah kavacam pathati dhruvam | tam tam nashayate sadyastathyam te tadvadamyaham
    || 17|| dharane bhajate shatruh kanthashocam sada bhavet | hatkampo jayate tavadyavattasya kripa na
    cet || 18|| iti kriyoddishe mahatantraraje devishvarasamvade shatkarmanam kavacam samaptam | caturdashah
    patalah
  devanagari: ृणु देवि महाभागे सावधानावधारय । शत्रूणां प्राणनाशार्थं कुपितः काल एव सः ॥ ११॥ दशवक्त्रा
    दशभुजा दशपादाञ्जनप्रभा । कोटिसूर्यप्रभा काली मम शत्रून् विनाशय । नाशयित्वा क्षणं देवि अन्यशत्रून्
    विनाशय ॥ १२॥ क्रीं क्रीं क्रीं उग्रप्रभे विकटदंष्ट्रे परपक्षं मोहय मोहय पच पच मथ मथ दह दह हन हन मारय
    मारय ये मां हिंसितुमुद्यता योगिनीचक्रैस्तान् वारय वारय छिन्धि छिन्धि भिन्धि भिन्धि करालिनि गृह्णगृह्ण
    ओं क्रीं क्रीं क्रीं क्रीं स्फूर स्फूर पूर पूर पून पून चूल्व चूल्व धक धक धम धम मारय मारय सर्वजगद्वशमानय
    ॐ नमः स्वाहा । इति ते कवचं देवि भद्रकाल्या प्रचोदितम् । भूर्जे विलिखितञ्चैतत् स्वर्णस्थं धारयेद्यदि
    ॥ १३॥ शिखायां दक्षिणे बाहौ कण्ठे वा धारयेद्यदि । त्रैलोक्यं मोहयेत्क्रोधात्त्रैलोक्यं चूर्णयेत्क्षणात्
    ॥ १४॥ पुत्रवान्धनवान्धीमान् नानाविद्यानिधिर्भवेत् । ब्रह्माखादीनि शस्त्राणि तद्गात्रस्पर्शनात्ततः
    ॥ १५॥ शत्रवो नाशमायान्ति रजतेन प्रघारितम् । मासमात्रेण शत्रूणां महविपदकारणम् ॥ १६॥ यं यं शत्रुं स्मरन्मर्त्यः
    कवचं पठति ध्रुवम् । तं तं नाशयते सद्यस्तथ्यं ते तद्वदाम्यहम् ॥ १७॥ धारणे भजते शत्रुः कण्ठशोचं सदा
    भवेत् । हत्कम्पो जायते तावद्यावत्तस्य कृपा न चेत् ॥ १८॥ इति क्रियोड्डीशे महातन्त्रराजे देवीश्वरसंवादे
    षट्कर्मणां कवचं समाप्तम् । चतुर्दशः पटलः
