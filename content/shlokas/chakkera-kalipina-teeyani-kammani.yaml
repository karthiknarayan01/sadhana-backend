id: chakkera-kalipina-teeyani-kammani
category: stotram
name:
  english: Chakkera Kalipina Teeyani Kammani
content:
  english: pallavi cakkèra kalipina tiyyani kammani todu pèrugu tèlugu cakkani palukula sòbagula nadakala
    hamsa hoyala bèdagu nannaya tikkana èrrana pitikina avu pala pòdugu caduvula talliki sumadhura shailiki
    puttinillu tèlugu ||ca|| caranam himagiri jalanidhi padamula amarina jilugu vèlugu tèlugu gana yati
    prasala rasa dhvani shakhala kavitalallu pulugu nava nava padamula kavita radhamula sagipovu nèlavu
    alavokaga ashtavadhanamulu seyu kavula kòluvu ||ca|| caranam allasani allikala jigibigini amritadhara
    tèlugu shrinathuni kavita sudharalo amara ganga parugu rayala kalpanalo ramakrishnuni shilpamulo rasa
    dharayai dhruva tarayai mana desha bhashalanu lèssayai deva bhashato celimicesi palu desha deshamula
    vasikèkkinadi caranam mana aksharala tiru mallèpadu kuduru mana bhasha pala kadali bhavam madhu murali
    ajanta padamula alankritam mana bhasha amrita janitam bharata bhasha bharati nuduta tèlugu bhasha
    tilakam jònnavittula ramalingeshvara ravu
  devanagari: पल्लवि चक्कॆर कलिपिन तिय्यनि कम्मनि तोडु पॆरुगु तॆलुगु चक्कनि पलुकुल सॊबगुल नडकल हंस होयल
    बॆडगु नन्नय तिक्कन ऎर्रन पितिकिन आवु पाल पॊदुगु चदुवुल तल्लिकि सुमधुर शैलिकि पुट्टिनिल्लु तॆलुगु ॥च॥
    चरणं हिमगिरि जलनिधि पदमुल अमरिन जिलुगु वॆलुगु तॆलुगु गण यति प्रासल रस ध्वनि शाखल कवितलल्लु पुलुगु
    नव नव पदमुल कविता रधमुल सागिपोवु नॆलवु अलवोकग अष्टावधानमुलु सेयु कवुल कॊलुवु ॥च॥ चरणं अल्लसानि अल्लिकल
    जिगिबिगिनि अमृतधार तॆलुगु श्रीनाथुनि कविता सुधारलो अमर गङ्ग परुगु रायल कल्पनलो रामकृष्णुनि शिल्पमुलो
    रस धारयै ध्रुव तारयै मन देश भाषलनु लॆस्सयै देव भाषतो चेलिमिचेसि पलु देश देशमुल वासिकॆक्किनदि चरणं
    मन अक्षराल तीरु मल्लॆपादु कुदुरु मन भाष पाल कडलि भावं मधु मुरलि अजन्त पदमुल अलङ्कृतं मन भाष अमृत जनितं
    भारत भाष भारति नुदुट तॆलुगु भाष तिलकं जॊन्नवित्तुल रामलिङ्गेश्वर रावु
