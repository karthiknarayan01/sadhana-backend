id: vidura-neethi-udyoga-parvam-chapter-37
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 37
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani viduravakye saptatrimsho''dhyayah ||
    vidura uvaca | saptadashemanrajendra manuh svayambhuvo''bravit | vaicitravirya purushanakasham mushtibhirghnatah
    || || tanevindrasya hi dhanuranamyam namato''bravit | atho maricinah padananamyannamatastatha || ||
    yashcashishyam shasati yash ca kupyate yashcativelam bhajate dvishantam | striyashca yo''rakshati
    bhadramastu te yashcayacyam yacati yash ca katthate || || yashcabhijatah prakarotyakaryam yashcabalo
    balina nityavairi | ashraddadhanaya ca yo braviti yashcakamyam kamayate narendra || || vadhva hasam
    shvashuro yash ca manyate vadhva vasannuta yo manakamah | parakshetre nirvapati yashca bijam striyam
    ca yah parivadate''tivelam || || yashcaiva labdhva na smaramityuvaca dattva ca yah katthati yacyamanah
    | yashcasatah santvamupasatiha ete''nuyantyanilam pashahastah || || yasminyatha vartate yo manushyas
    tasmimstatha vartitavyam sa dharmah | mayacaro mayaya vartitavyah sadhvacarah sadhuna pratyudeyah
    || || dhritarashtra uvaca | shatayuruktah purushah sarvavedeshu vai yada | napnotyatha ca tatsarvamayuh
    keneha hetuna || || vidura uvaca | ativado''timanashca tathatyago naradhipah | krodhashcativivitsa
    ca mitradrohashca tani shat || || eta evasayastikshnah krintantyayumshi dehinam | etani manavanghnanti
    na mrityurbhadramastu te || || vishvastasyaiti yo daranyashcapi guru takpagah | vrishali patirdvijo
    yashca panapashcaiva bharata || || sharanagataha caiva sarve brahmahanaih samah | etaih sametya kartavyam
    prayashcittamiti shrutih || || grihi vadanyo''napaviddha vakyah sheshanna bhokapyavihimsakash ca |
    nanarthakrittyaktakalih kritajnah satyo mriduh svargamupaiti vidvan || || sulabhah purusha rajansatatam
    priyavadinah | apriyasya tu pathyasya vakta shrota ca durlabhah || || yo hi dharmam vyapashritya hitva
    bhartuh priyapriye | apriyanyaha pathyani tena raja sahayavan || || tyajetkularthe purusham gramasyarthe
    kulam tyajet | gramam janapadasyarthe atmarthe prithivim tyajet || || apadartham dhanam raksheddaranraksheddhanairapi
    | atmanam satatam raksheddarairapi dhanairapi || || uktam maya dyutakale''pi rajan naivam yuktam vacanam
    pratipiya | tadaushadham pathyamivaturasya na rocate tava vaicitra virya || || kakairimamshcitrabarhanmayuran
    parajaishthah pandavandhartarashtraih | hitva simhankroshtu kanguhamanah prapte kale shocita tvam
    narendra || || yastata na krudhyati sarvakalam bhrityasya bhaktasya hite ratasya | tasminbhritya bhartari
    vishvasanti na cainamapatsu parityajanti || || na bhrityanam vritti samrodhanena bahyam janam sanjighrikshedapurvam
    | tyajanti hyenamucitavaruddhah snigdha hyamatyah parihinabhogah || || krityani purvam parisankhyaya
    sarvany ayavyayavanurupam ca vrittim | sangrihniyadanurupansahayan sahayasadhyani hi dushkarani ||
    || abhiprayam yo viditva tu bhartuh sarvani karyani karotyatandrih | vakta hitanamanurakta aryah shaktijna
    atmeva hi so''nukampyah || || vakyam tu yo nadriyate''nushishtah pratyaha yashcapi niyujyamanah |
    prajnabhimani pratikulavadi tyajyah sa tadriktvarayaiva bhrityah || || astabdhamaklibamadirghasutram
    sanukrosham shlakshnamaharyamanyaih | aroga jatiyamudaravakyam dutam vadantyashta gunopapannam ||
    || na vishvasajjatu parasya geham gacchennarashcetayano vikale | na catvare nishi tishthennigudho
    na rajanyam yoshitam prarthayita || || na nihnavam satra gatasya gacchet samsrishta mantrasya kusangatasya
    | na ca bruyannashvasami tvayiti sa karanam vyapadesham tu kuryat || || ghrini raja pumshcali rajabhrityah
    putro bhrata vidhava bala putra | sena jivi coddhrita bhakta eva vyavahare vai varjaniyah syurete
    || || guna dasha snanashilam bhajante balam rupam svaravarnaprashuddhih | sparshashca gandhashca vishuddhata
    ca shrih saukumaryam pravarashca naryah || || gunashca shanmitabhuktam bhajante arogyamayushca sukham
    balam ca | anavilam casya bhavedapatyam na cainamadyuna iti kshipanti || || akarma shilam ca mahashanam
    ca lokadvishtam bahu mayam nrishamsam | adeshakalajnamanishta vesham etangrihe na prativasayita ||
    || kadaryamakroshakamashrutam ca varaka sambhutamamanya maninam | nishthurinam kritavairam kritaghnam
    etanbhritarto''pi na jatu yacet || || sanklishtakarmanamatipravadam nityanritam cadridha bhaktikam
    ca | vikrishtaragam bahumaninam capy etanna seveta naradhamanshat || || sahayabandhana hyarthah sahayashcarthabandhanah
    | anyonyabandhanavetau vinanyonyam na sidhyatah || || utpadya putrananrinamshca kritva vrittim ca
    tebhyo''nuvidhaya kam cit | sthane kumarih pratipadya sarva aranyasamstho munivadbubhushet || || hitam
    yatsarvabhutanamatmanashca sukhavaham | tatkuryadishvaro hyetanmulam dharmarthasiddhaye || || buddhih
    prabhavastejashca sattvamutthanameva ca | vyavasayashca yasya syattasyavritti bhayam kutah || || pashya
    doshanpandavairvigrahe tvam yatra vyatherannapi devah sa shakrah | putrairvairam nityamudvignavaso
    yashah pranasho dvishatam ca harshah || || bhishmasya kopastava cendra kalpa dronasya rajnashca yudhishthirasya
    | utsadayellokamimam pravriddhah shveto grahastiryagivapatankhe || || tava putrashatam caiva karnah
    panca ca pandavah | prithivimanushaseyurakhilam sagarambaram || || dhartarashtra vanam rajanvyaghrah
    pandusuta matah | ma vanam chindhi sa vyaghram ma vyaghranninasho vanat || || na syadvanamrite vyaghranvyaghra
    na syurrite vanam | vanam hi rakshyate vyaghrairvyaghranrakshati kananam || || na tathecchantyakalyanah
    paresham veditum gunan | yathaisham jnatumicchanti nairgunyam papacetasah || || arthasiddhim paramicchandharmamevaditash
    caret | na hi dharmadapaityarthah svargalokadivamritam || || yasyatma viratah papatkalyane ca niveshitah
    | tena sarvamidam buddham prakritirvikritirshca ya || || yo dharmamartham kamam ca yathakalam nishevate
    | dharmarthakamasamyogam yo''mutreha ca vindati || || sanniyacchati yo vegamutthitam krodhaharshayoh
    | sa shriyo bhajanam rajanyashcapatsu na muhyati || || balam panca vidham nityam purushanam nibodha
    me | yattu bahubalam nama kanishtham balamucyate || || amatyalabho bhadram te dvitiyam balamucyate
    | dhanalabhastritiyam tu balamahurjigishavah || || yattvasya sahajam rajanpitripaitamaham balam |
    abhijata balam nama taccaturtham balam smritam || || yena tvetani sarvani sangrihitani bharata | yadbalanam
    balam shreshtham tatprajna balamucyate || || mahate yo''pakaraya narasya prabhavennarah | tena vairam
    samasajya durastho''smiti nashvaset || || strishu rajasu sarpeshu svadhyaye shatrusevishu | bhoge
    cayushi vishvasam kah prajnah kartumarhati || || prajna sharenabhihatasya jantosh cikitsakah santi
    na caushadhani | na homamantra na ca mangalani natharvana napyagadah susiddhah || || sarpashcagnishca
    simhashca kulaputrashca bharata | navajneya manushyena sarve te hyatitejasah || || agnistejo mahalloke
    gudhastishthati darushu | na copayunkte taddaru yavanno dipyate paraih || || sa eva khalu darubhyo
    yada nirmathya dipyate | tada tacca vanam canyannirdahatyashu tejasa || || evameva kule jatah pavakopama
    tejasah | kshamavanto nirakarah kashthe''gniriva sherate || || lata dharma tvam saputrah shalah pandusuta
    matah | na lata vardhate jatu mahadrumamanashrita || || vanam rajamstvam saputro''mbikeya simhanvane
    pandavamstata viddhi | simhairvihinam hi vanam vinashyet simha vinashyeyurrite vanena || || || iti
    shrimahabharate udyogaparvani prajagaraparvani viduravakye saptatrimsho''dhyayah ||'
  devanagari: ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये सप्तत्रिंशोऽध्यायः ॥ विदुर उवाच
    । सप्तदशेमान्राजेन्द्र मनुः स्वायम्भुवोऽब्रवीत् । वैचित्रवीर्य पुरुषानाकाशं मुष्टिभिर्घ्नतः ॥ ॥ तानेविन्द्रस्य
    हि धनुरनाम्यं नमतोऽब्रवीत् । अथो मरीचिनः पादाननाम्यान्नमतस्तथा ॥ ॥ यश्चाशिष्यं शासति यश् च कुप्यते
    यश्चातिवेलं भजते द्विषन्तम् । स्त्रियश्च योऽरक्षति भद्रमस्तु ते यश्चायाच्यं याचति यश् च कत्थते ॥ ॥
    यश्चाभिजातः प्रकरोत्यकार्यं यश्चाबलो बलिना नित्यवैरी । अश्रद्दधानाय च यो ब्रवीति यश्चाकाम्यं कामयते
    नरेन्द्र ॥ ॥ वध्वा हासं श्वशुरो यश् च मन्यते वध्वा वसन्नुत यो मानकामः । परक्षेत्रे निर्वपति यश्च बीजं
    स्त्रियं च यः परिवदतेऽतिवेलम् ॥ ॥ यश्चैव लब्ध्वा न स्मरामीत्युवाच दत्त्वा च यः कत्थति याच्यमानः ।
    यश्चासतः सान्त्वमुपासतीह एतेऽनुयान्त्यनिलं पाशहस्ताः ॥ ॥ यस्मिन्यथा वर्तते यो मनुष्यस् तस्मिंस्तथा
    वर्तितव्यं स धर्मः । मायाचारो मायया वर्तितव्यः साध्वाचारः साधुना प्रत्युदेयः ॥ ॥ धृतराष्ट्र उवाच ।
    शतायुरुक्तः पुरुषः सर्ववेदेषु वै यदा । नाप्नोत्यथ च तत्सर्वमायुः केनेह हेतुना ॥ ॥ विदुर उवाच । अतिवादोऽतिमानश्च
    तथात्यागो नराधिपः । क्रोधश्चातिविवित्सा च मित्रद्रोहश्च तानि षट् ॥ ॥ एत एवासयस्तीक्ष्णाः कृन्तन्त्यायूंषि
    देहिनाम् । एतानि मानवान्घ्नन्ति न मृत्युर्भद्रमस्तु ते ॥ ॥ विश्वस्तस्यैति यो दारान्यश्चापि गुरु तक्पगः
    । वृषली पतिर्द्विजो यश्च पानपश्चैव भारत ॥ ॥ शरणागतहा चैव सर्वे ब्रह्महणैः समाः । एतैः समेत्य कर्तव्यं
    प्रायश्चित्तमिति श्रुतिः ॥ ॥ गृही वदान्योऽनपविद्ध वाक्यः शेषान्न भोकाप्यविहिंसकश् च । नानर्थकृत्त्यक्तकलिः
    कृतज्ञः सत्यो मृदुः स्वर्गमुपैति विद्वान् ॥ ॥ सुलभाः पुरुषा राजन्सततं प्रियवादिनः । अप्रियस्य तु पथ्यस्य
    वक्ता श्रोता च दुर्लभः ॥ ॥ यो हि धर्मं व्यपाश्रित्य हित्वा भर्तुः प्रियाप्रिये । अप्रियाण्याह पथ्यानि
    तेन राजा सहायवान् ॥ ॥ त्यजेत्कुलार्थे पुरुषं ग्रामस्यार्थे कुलं त्यजेत् । ग्रामं जनपदस्यार्थे आत्मार्थे
    पृथिवीं त्यजेत् ॥ ॥ आपदर्थं धनं रक्षेद्दारान्रक्षेद्धनैरपि । आत्मानं सततं रक्षेद्दारैरपि धनैरपि ॥
    ॥ उक्तं मया द्यूतकालेऽपि राजन् नैवं युक्तं वचनं प्रातिपीय । तदौषधं पथ्यमिवातुरस्य न रोचते तव वैचित्र
    वीर्य ॥ ॥ काकैरिमांश्चित्रबर्हान्मयूरान् पराजैष्ठाः पाण्डवान्धार्तराष्ट्रैः । हित्वा सिंहान्क्रोष्टु
    कान्गूहमानः प्राप्ते काले शोचिता त्वं नरेन्द्र ॥ ॥ यस्तात न क्रुध्यति सर्वकालं भृत्यस्य भक्तस्य हिते
    रतस्य । तस्मिन्भृत्या भर्तरि विश्वसन्ति न चैनमापत्सु परित्यजन्ति ॥ ॥ न भृत्यानां वृत्ति संरोधनेन बाह्यं
    जनं सञ्जिघृक्षेदपूर्वम् । त्यजन्ति ह्येनमुचितावरुद्धाः स्निग्धा ह्यमात्याः परिहीनभोगाः ॥ ॥ कृत्यानि
    पूर्वं परिसङ्ख्याय सर्वाण्य् आयव्ययावनुरूपां च वृत्तिम् । सङ्गृह्णीयादनुरूपान्सहायान् सहायसाध्यानि
    हि दुष्कराणि ॥ ॥ अभिप्रायं यो विदित्वा तु भर्तुः सर्वाणि कार्याणि करोत्यतन्द्रीः । वक्ता हितानामनुरक्त
    आर्यः शक्तिज्ञ आत्मेव हि सोऽनुकम्प्यः ॥ ॥ वाक्यं तु यो नाद्रियतेऽनुशिष्टः प्रत्याह यश्चापि नियुज्यमानः
    । प्रज्ञाभिमानी प्रतिकूलवादी त्याज्यः स तादृक्त्वरयैव भृत्यः ॥ ॥ अस्तब्धमक्लीबमदीर्घसूत्रं सानुक्रोशं
    श्लक्ष्णमहार्यमन्यैः । अरोग जातीयमुदारवाक्यं दूतं वदन्त्यष्ट गुणोपपन्नम् ॥ ॥ न विश्वासाज्जातु परस्य
    गेहं गच्छेन्नरश्चेतयानो विकाले । न चत्वरे निशि तिष्ठेन्निगूढो न राजन्यां योषितं प्रार्थयीत ॥ ॥ न निह्नवं
    सत्र गतस्य गच्छेत् संसृष्ट मन्त्रस्य कुसङ्गतस्य । न च ब्रूयान्नाश्वसामि त्वयीति स कारणं व्यपदेशं तु
    कुर्यात् ॥ ॥ घृणी राजा पुंश्चली राजभृत्यः पुत्रो भ्राता विधवा बाल पुत्रा । सेना जीवी चोद्धृत भक्त
    एव व्यवहारे वै वर्जनीयाः स्युरेते ॥ ॥ गुणा दश स्नानशीलं भजन्ते बलं रूपं स्वरवर्णप्रशुद्धिः । स्पर्शश्च
    गन्धश्च विशुद्धता च श्रीः सौकुमार्यं प्रवराश्च नार्यः ॥ ॥ गुणाश्च षण्मितभुक्तं भजन्ते आरोग्यमायुश्च
    सुखं बलं च । अनाविलं चास्य भवेदपत्यं न चैनमाद्यून इति क्षिपन्ति ॥ ॥ अकर्म शीलं च महाशनं च लोकद्विष्टं
    बहु मायं नृशंसम् । अदेशकालज्ञमनिष्ट वेषम् एतान्गृहे न प्रतिवासयीत ॥ ॥ कदर्यमाक्रोशकमश्रुतं च वराक
    सम्भूतममान्य मानिनम् । निष्ठूरिणं कृतवैरं कृतघ्नम् एतान्भृतार्तोऽपि न जातु याचेत् ॥ ॥ सङ्क्लिष्टकर्माणमतिप्रवादं
    नित्यानृतं चादृढ भक्तिकं च । विकृष्टरागं बहुमानिनं चाप्य् एतान्न सेवेत नराधमान्षट् ॥ ॥ सहायबन्धना
    ह्यर्थाः सहायाश्चार्थबन्धनाः । अन्योन्यबन्धनावेतौ विनान्योन्यं न सिध्यतः ॥ ॥ उत्पाद्य पुत्राननृणांश्च
    कृत्वा वृत्तिं च तेभ्योऽनुविधाय कां चित् । स्थाने कुमारीः प्रतिपाद्य सर्वा अरण्यसंस्थो मुनिवद्बुभूषेत्
    ॥ ॥ हितं यत्सर्वभूतानामात्मनश्च सुखावहम् । तत्कुर्यादीश्वरो ह्येतन्मूलं धर्मार्थसिद्धये ॥ ॥ बुद्धिः
    प्रभावस्तेजश्च सत्त्वमुत्थानमेव च । व्यवसायश्च यस्य स्यात्तस्यावृत्ति भयं कुतः ॥ ॥ पश्य दोषान्पाण्डवैर्विग्रहे
    त्वं यत्र व्यथेरन्नपि देवाः स शक्राः । पुत्रैर्वैरं नित्यमुद्विग्नवासो यशः प्रणाशो द्विषतां च हर्षः
    ॥ ॥ भीष्मस्य कोपस्तव चेन्द्र कल्प द्रोणस्य राज्ञश्च युधिष्ठिरस्य । उत्सादयेल्लोकमिमं प्रवृद्धः श्वेतो
    ग्रहस्तिर्यगिवापतन्खे ॥ ॥ तव पुत्रशतं चैव कर्णः पञ्च च पाण्डवाः । पृथिवीमनुशासेयुरखिलां सागराम्बराम्
    ॥ ॥ धार्तराष्ट्रा वनं राजन्व्याघ्राः पाण्डुसुता मताः । मा वनं छिन्धि स व्याघ्रं मा व्याघ्रान्नीनशो
    वनात् ॥ ॥ न स्याद्वनमृते व्याघ्रान्व्याघ्रा न स्युरृते वनम् । वनं हि रक्ष्यते व्याघ्रैर्व्याघ्रान्रक्षति
    काननम् ॥ ॥ न तथेच्छन्त्यकल्याणाः परेषां वेदितुं गुणान् । यथैषां ज्ञातुमिच्छन्ति नैर्गुण्यं पापचेतसः
    ॥ ॥ अर्थसिद्धिं परामिच्छन्धर्ममेवादितश् चरेत् । न हि धर्मादपैत्यर्थः स्वर्गलोकादिवामृतम् ॥ ॥ यस्यात्मा
    विरतः पापात्कल्याणे च निवेशितः । तेन सर्वमिदं बुद्धं प्रकृतिर्विकृतिर्श्च या ॥ ॥ यो धर्ममर्थं कामं
    च यथाकालं निषेवते । धर्मार्थकामसंयोगं योऽमुत्रेह च विन्दति ॥ ॥ सन्नियच्छति यो वेगमुत्थितं क्रोधहर्षयोः
    । स श्रियो भाजनं राजन्यश्चापत्सु न मुह्यति ॥ ॥ बलं पञ्च विधं नित्यं पुरुषाणां निबोध मे । यत्तु बाहुबलं
    नाम कनिष्ठं बलमुच्यते ॥ ॥ अमात्यलाभो भद्रं ते द्वितीयं बलमुच्यते । धनलाभस्तृतीयं तु बलमाहुर्जिगीषवः
    ॥ ॥ यत्त्वस्य सहजं राजन्पितृपैतामहं बलम् । अभिजात बलं नाम तच्चतुर्थं बलं स्मृतम् ॥ ॥ येन त्वेतानि
    सर्वाणि सङ्गृहीतानि भारत । यद्बलानां बलं श्रेष्ठं तत्प्रज्ञा बलमुच्यते ॥ ॥ महते योऽपकाराय नरस्य प्रभवेन्नरः
    । तेन वैरं समासज्य दूरस्थोऽस्मीति नाश्वसेत् ॥ ॥ स्त्रीषु राजसु सर्पेषु स्वाध्याये शत्रुसेविषु । भोगे
    चायुषि विश्वासं कः प्राज्ञः कर्तुमर्हति ॥ ॥ प्रज्ञा शरेणाभिहतस्य जन्तोश् चिकित्सकाः सन्ति न चौषधानि
    । न होममन्त्रा न च मङ्गलानि नाथर्वणा नाप्यगदाः सुसिद्धाः ॥ ॥ सर्पश्चाग्निश्च सिंहश्च कुलपुत्रश्च भारत
    । नावज्ञेया मनुष्येण सर्वे ते ह्यतितेजसः ॥ ॥ अग्निस्तेजो महल्लोके गूढस्तिष्ठति दारुषु । न चोपयुङ्क्ते
    तद्दारु यावन्नो दीप्यते परैः ॥ ॥ स एव खलु दारुभ्यो यदा निर्मथ्य दीप्यते । तदा तच्च वनं चान्यन्निर्दहत्याशु
    तेजसा ॥ ॥ एवमेव कुले जाताः पावकोपम तेजसः । क्षमावन्तो निराकाराः काष्ठेऽग्निरिव शेरते ॥ ॥ लता धर्मा
    त्वं सपुत्रः शालाः पाण्डुसुता मताः । न लता वर्धते जातु महाद्रुममनाश्रिता ॥ ॥ वनं राजंस्त्वं सपुत्रोऽम्बिकेय
    सिंहान्वने पाण्डवांस्तात विद्धि । सिंहैर्विहीनं हि वनं विनश्येत् सिंहा विनश्येयुरृते वनेन ॥ ॥ ॥ इति
    श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरवाक्ये सप्तत्रिंशोऽध्यायः ॥
