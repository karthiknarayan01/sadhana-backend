id: mahamahimanvitam-adityastotram
category: stotram
name:
  english: mahamahimanvitam adityastotram
  devanagari: महामहिमान्वितं आदित्यस्तोत्रम्
content:
  english: mahamahimanvitam adityastotram appayyadikshita mahamahimanvitam adityastotram appayyadikshita
    || mahamahimanvitam adityastotram || atha shrimadappayyadikshitaviracitam mahamahimanvitam adityastotram
    || vistarayamamanam dashabhirupagato yojananam sahasraih cakre pancaranabhitritayavati lasan nemishatke
    nivishtah | saptacchandasturangahitavahanadhuro hayanamshatrivarga vyaktakliptakhilangah sphuratu
    mama purah syandanashcandabhanoh || 1|| adityairapsarobhirmunibhirahivarairgramaniyatudhanaih gandharvairvalakhilyaih
    parivritadashamamshasya kritsnam rathasya | madhyam vyapyadhitishthan maniriva nabhaso mandalashcandarashmeh
    brahmajyotirvivartah shrutinikaraghanibhavarupah samindhe || 2|| nirgacchanto'rkabimban nikhilajanibhritam
    hardanadipravishtah nadyo vasvadibrindarakaganamadhunastasya nanadigutthah | varshantastoyamushnam
    tuhinamapi jalanyapibantah samantat pitradinam svadhaushadhyamritarasakrito bhanti kantiprarohah||
    3|| shreshthastesham sahasre tridivavasudhayoh pancadigvyaptibhajam shubhramshum tarakaugham shashitanayamukhan
    panca codbhasayantah | arogo bhrajamukhyastribhuvanadahane saptasurya bhavantah sarvan vyadhin sushumnaprabhritaya
    iha me suryapadah kshipantu || 4|| adityanashritah shannavatigunasahasranvita rashmayo'nye mase mase
    vibhaktastribhuvanabhavanam pavayantah sphuranti | yesham bhuvyapracare jagadavanakritam saptarashmyutthitanam
    samsarpe cadhimase vratayajanamukhah satkriyah na kriyante || 5|| adityam mandalantahsphuradarunavapustejasa
    vyaptavishvam pratarmadhyahnasayam samayavibhajanadrigyajussamasevyam | prapyam ca prapakam ca prathitamatipathijnaninamuttarasmin
    sakshad brahmetyupasyam sakalabhayaharabhyudgamam samshrayami || 6|| yacchaktya'dhishthitanam tapanahimajalotsarjanadirjagatyam
    adityanamasheshah prabhavati niyatah svasvamasadhikarah | yat pradhanyam vyanakti svayamapi bhagavan
    dvadashasteshu bhutva tam trailokyasya mulam pranamata paramam daivatam saptasaptim || 7|| svahstrigandharvayaksha
    munivarabhujaga yatudhanashca nityam nrittairgitairabhishugrahanutivahanairagratah sevaya ca | yasya
    pritim vitanvantyamitaparikara dvadasha dvadashaite hridyabhirvalakhilyah saranibhanitibhistam bhaje
    lokabandhum || 8|| brahmande yasya janmoditamushasi parabrahmamukhyatmajasya dhyeyam rupam shirodoshcaranapadajusha
    vyahritinam trayena | tat satyam brahma pashyamyaharahamabhidham nityamadityarupam bhutanam bhunabhassvah
    prabhritishu vasatam pranasukshmamshamekam || 9|| aditye lokacakshushyavahitamanasam yoginam drishyamantah
    svacchasvarnabhamurtim vidalitanalinodaradrishyakshiyugmam | riksamodganageshnam niratishayalasallokakameshabhavam
    sarvavadyoditatvaduditasamuditam brahma shambhum prapadye || 10|| omityudgithabhakteravayavapadavim
    praptavatyakshare'smin yasyopastih samastam duritamapanayatvarkabimbe sthitasya | yat pujaikapradhananyaghamakhilamapi
    ghnanti kricchravratani dhyatah sarvopatapan haratu parashivah so'yamadyo bhishannah || 11|| aditye
    mandalarcih purushavibhidayadyantamadhyagamatma
  devanagari: महामहिमान्वितं आदित्यस्तोत्रम् अप्पय्यदीक्षित महामहिमान्वितं आदित्यस्तोत्रम् अप्पय्यदीक्षित
    ॥ महामहिमान्वितं आदित्यस्तोत्रम् ॥ अथ श्रीमदप्पय्यदीक्षितविरचितं महामहिमान्वितं आदित्यस्तोत्रम् ॥
    विस्तारायाममानं दशभिरुपगतो योजनानां सहस्रैः चक्रे पञ्चारनाभित्रितयवति लसन् नेमिषट्के निविष्टः । सप्तच्छन्दस्तुरङ्गाहितवहनधुरो
    हायनांशत्रिवर्ग व्यक्ताकॢप्ताखिलाङ्गः स्फुरतु मम पुरः स्यन्दनश्चण्डभानोः ॥ १॥ आदित्यैरप्सरोभिर्मुनिभिरहिवरैर्ग्रामणीयातुधानैः
    गन्धर्वैर्वालखिल्यैः परिवृतदशमांशस्य कृत्स्नं रथस्य । मध्यं व्याप्याधितिष्ठन् मणिरिव नभसो मण्डलश्चण्डरश्मेः
    ब्रह्मज्योतिर्विवर्तः श्रुतिनिकरघनीभावरूपः समिन्धे ॥ २॥ निर्गच्छन्तोऽर्कबिम्बान् निखिलजनिभृतां हार्दनाडीप्रविष्टाः
    नाड्यो वस्वादिबृन्दारकगणमधुनस्तस्य नानादिगुत्थाः । वर्षन्तस्तोयमुष्णं तुहिनमपि जलान्यापिबन्तः समन्तात्
    पित्रादीनां स्वधौषध्यमृतरसकृतो भान्ति कान्तिप्ररोहाः॥ ३॥ श्रेष्ठास्तेषां सहस्रे त्रिदिववसुधयोः पञ्चदिग्व्याप्तिभाजां
    शुभ्रांशुं तारकौघं शशितनयमुखान् पञ्च चोद्भासयन्तः । आरोगो भ्राजमुख्यास्त्रिभुवनदहने सप्तसूर्या भवन्तः
    सर्वान् व्याधीन् सुषुम्नाप्रभृतय इह मे सूर्यपादाः क्षिपन्तु ॥ ४॥ आदित्यानाश्रिताः षण्णवतिगुणसहस्रान्विता
    रश्मयोऽन्ये मासे मासे विभक्तास्त्रिभुवनभवनं पावयन्तः स्फुरन्ति । येषां भुव्यप्रचारे जगदवनकृतां सप्तरश्म्युत्थितानां
    संसर्पे चाधिमासे व्रतयजनमुखाः सत्क्रियाः न क्रियन्ते ॥ ५॥ आदित्यं मण्डलान्तःस्फुरदरुणवपुस्तेजसा व्याप्तविश्वं
    प्रातर्मध्याह्नसायं समयविभजनादृग्यजुस्सामसेव्यम् । प्राप्यं च प्रापकं च प्रथितमतिपथिज्ञानिनामुत्तरस्मिन्
    साक्षाद् ब्रह्मेत्युपास्यं सकलभयहराभ्युद्गमं संश्रयामि ॥ ६॥ यच्छक्त्याऽधिष्ठितानां तपनहिमजलोत्सर्जनादिर्जगत्याम्
    आदित्यानामशेषः प्रभवति नियतः स्वस्वमासाधिकारः । यत् प्राधान्यं व्यनक्ति स्वयमपि भगवान् द्वादशस्तेषु
    भूत्वा तं त्रैलोक्यस्य मूलं प्रणमत परमं दैवतं सप्तसप्तिम् ॥ ७॥ स्वःस्त्रीगन्धर्वयक्षा मुनिवरभुजगा
    यातुधानाश्च नित्यं नृत्तैर्गीतैरभीशुग्रहनुतिवहनैरग्रतः सेवया च । यस्य प्रीतिं वितन्वन्त्यमितपरिकरा
    द्वादश द्वादशैते हृद्याभिर्वालखिल्याः सरणिभणितिभिस्तं भजे लोकबन्धुम् ॥ ८॥ ब्रह्माण्डे यस्य जन्मोदितमुषसि
    परब्रह्ममुख्यात्मजस्य ध्येयं रूपं शिरोदोश्चरणपदजुषा व्याहृतीनां त्रयेण । तत् सत्यं ब्रह्म पश्याम्यहरहमभिधं
    नित्यमादित्यरूपं भूतानां भूनभस्स्वः प्रभृतिषु वसतां प्राणसूक्ष्मांशमेकम् ॥ ९॥ आदित्ये लोकचक्षुष्यवहितमनसां
    योगिनां दृश्यमन्तः स्वच्छस्वर्णाभमूर्तिं विदलितनलिनोदारदृश्याक्षियुग्मम् । ऋक्सामोद्गानगेष्णं निरतिशयलसल्लोककामेशभावं
    सर्वावद्योदितत्वादुदितसमुदितं ब्रह्म शम्भुं प्रपद्ये ॥ १०॥ ओमित्युद्गीथभक्तेरवयवपदवीं प्राप्तवत्यक्षरेऽस्मिन्
    यस्योपास्तिः समस्तं दुरितमपनयत्वर्कबिम्बे स्थितस्य । यत् पूजैकप्रधानान्यघमखिलमपि घ्नन्ति कृच्छ्रव्रतानि
    ध्यातः सर्वोपतापान् हरतु परशिवः सोऽयमाद्यो भिषङ्नः ॥ ११॥ आदित्ये मण्डलार्चिः पुरुषविभिदयाद्यन्तमध्यागमात्म
