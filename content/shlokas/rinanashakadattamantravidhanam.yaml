id: rinanashakadattamantravidhanam
category: mantra
name:
  english: rinanashakadattamantravidhanam
  devanagari: ऋणनाशकदत्तमन्त्रविधानम्
content:
  english: om asya shririnanashakadattamantrasya bhagavan sadashiva rishih | anushtupchandah | shridatto
    devata | mama rinanashanarthe shridattamantrajape viniyogah || rishyadinyasah | shrisadashivarishaye
    namah shirasi | anushtupchandase namah mukhe | shridattadevatayai namah hridaye | mama rinanashanarthe
    shridattamantrajape viniyogaya namah sarvange || karanyasah | om angushthabhyam namah | dram tarjanibhyam
    namah | ham madhyamabhyam namah | klim anamikabhyam namah | dattatreyaya kanishthikabhyam namah |
    svaha karatalakaraprishthabhyam namah || hridayadishadanganyasah | om hridayaya namah | dram shirase
    svaha | ham shikhayai vashat | klim kavacaya hum | dattatreyaya netratrayaya vaushat | svaha astraya
    phat || dhyanam
  devanagari: ॐ अस्य श्रीऋणनाशकदत्तमन्त्रस्य भगवान् सदाशिव ऋषिः । अनुष्टुप्छन्दः । श्रीदत्तो देवता । मम
    ऋणनाशनार्थे श्रीदत्तमन्त्रजपे विनियोगः ॥ ऋष्यादिन्यासः । श्रीसदाशिवऋषये नमः शिरसि । अनुष्टुप्छन्दसे
    नमः मुखे । श्रीदत्तदेवतायै नमः हृदये । मम ऋणनाशनार्थे श्रीदत्तमन्त्रजपे विनियोगाय नमः सर्वाङ्गे ॥
    करन्यासः । ॐ अङ्गुष्ठाभ्यां नमः । द्रां तर्जनीभ्यां नमः । हां मध्यमाभ्यां नमः । क्लीं अनामिकाभ्यां
    नमः । दत्तात्रेयाय कनिष्ठिकाभ्यां नमः । स्वाहा करतलकरपृष्ठाभ्यां नमः ॥ हृदयादिषडङ्गन्यासः । ॐ हृदयाय
    नमः । द्रां शिरसे स्वाहा । हां शिखायै वषट् । क्लीं कवचाय हुम् । दत्तात्रेयाय नेत्रत्रयाय वौषट् । स्वाहा
    अस्त्राय फट् ॥ ध्यानम्
