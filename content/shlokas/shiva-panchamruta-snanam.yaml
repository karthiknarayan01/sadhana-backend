id: shiva-panchamruta-snanam
category: stotram
name:
  english: Shiva Panchamruta Snanam
content:
  english: nkuryat || || pancamritasnanam || atha pancamritadevatabhyo namah | dhyanavahanadi shodashopacarapujassamarpayami
    | bhavanishankaramuddishya bhavanishankara prityartha nkarishyamah | kshiram apyayasva sametu te vishvatassoma
    vrishniyam | bhava vajasya sangathe || shri bhavanishankarasvamine namah kshirena snapayami | apo
    hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate
    ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah |
    shri bhavanishankarasvamine namah | kshirasnananantaram shuddhodaka snanam samarpayami | dadhi dadhikrav
    njishnorashvasya vajinah | surabhi no mukha karatprana ayugmshi tarishat || shri bhavanishankarasvamine
    namah | dadhna snapayami | apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah
    shivatamo rasastasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha
    | apo janayatha ca nah | shri bhavanishankarasvamine namah | dadhisnananantaram shuddhodaka snanam
    samarpayami | ajyam shukramasi jyotirasi tejosi devovassavitotpuna tvacchidrena pavitrena vasossuryasya
    rashmibhih | shri bhavanishankarasvamine namah | ajyena snapayami | apo hishtha mayobhuvasta na urje
    dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva matarah
    | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine
    namah | ajya snananantaram shuddhodaka snanam samarpayami | madhu madhuvata ritayate madhuksharanti
    sindhavah | madhvi ssantvoshadhih | madhu naktamutoshasi madhumatparthivagm rajah | madhudyaurastu
    nah pita | madhumanno vanaspatirmadhumag m astu suryah | madhvirgavo bhavantu nah | shri bhavanishankarasvamine
    namah | madhuna snapayami | apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo
    vah shivatamo rasastasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya
    jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine namah | madhusnananantaram shuddhodaka
    snanam samarpayami | sharkara svaduh pavasva divyaya janmane | svadurindraya suhavitu namne | svadurmitraya
    varunaya vayave | brihaspataye madhumagm ada bhyah | shri bhavanishankarasvamine namah | sharkaraya
    snapayami | apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya
    bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha
    ca nah | shri bhavanishankarasvamine namah | sharkara snananantaram shuddhodaka snanam samarpayami
    | shri bhavanishankarasvamine namah | pancamrita snanam samarpayami | shankhodakam apo hishtha mayobhuvasta
    na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva
    matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine
    namah | shankhodakena snapayami || phalodakam yah phalinirya aphala apushpayashca pushpinih | brihaspati
    prasutastano muncantvag m hasah || shri bhavanishankarasvamine namah | phalodakena snapayami | gandhodakam
    gandhadvara m | ishvarigm sarvabhutana ntamihopahvaye shriyam || shri bhavanishankarasvamine namah
    | gandhodakena snapayami | pushpodakam yo nbhavati | candrama va apa mpushpam | pushpava nbhavati
    | shri bhavanishankarasvamine namah | pushpodakena snapayami | akshatodakam ayane te parayane durva
    rohantu pushpinih | hradashca pundarikani samudrasya griha ime | shri bhavanishankarasvamine namah
    | akshatodakena snapayami | suvarnodakam tathsuvarnagm hiranyamabhavat | tathsuvarnasya hiranyasyajanma
    | ya evagm suvarnasya hiranyasya janmaveda | suvarna atmana bhavati | shri bhavanishankarasvamine
    namah | suvarnodakena snapayami | rudrakshodakam tryambakam mpushti vardhanam | urvarukamiva bandhananmrityormukshiya
    ma t || shri bhavanishankarasvamine namah | rudrakshodakena snapayami | bhasmodakam ma no mahantamuta
    ma no arbhakam ma na ukshantamuta ma na ukshitam | ma no mmota mataram priya ma nastanuvo rudra ririshah
    | shri bhavanishankarasvamine namah | bhasmodakena snapayami | bilvodakam ma nastoke tanaye ma na
    ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamito havishmanto namasa vidhema te
    | shri bhavanishankarasvamine namah | bilvodakena snapayami | durvodakam kandatkandatprarohanti parushah
    parushah pari | evano durve pratanu sahasrena shatena ca || shri bhavanishankarasvamine namah | durvodakena
    snapayami | atha malapakar shana snanam | hiranyavarnashshucayah pavaka yasu jatah kashyapo yasvindrah
    | agnim ndadhire virupasta na apashshagg syona bhavantu || yasagm raja varuno yati madhye satyanrite
    avapashyanjananam | madhushcutashshucayo yah pavakasta na apashshagg syona bhavantu || yasa ndeva
    divi krinvanti bhaksham ya antarikshe bahudha bhavanti | yah prithivi mpayasondanti shukrasta na apashshagg
    syona bhavantu || shivena ma cakshusha pashyatapashshivaya tanuvopa sprishata tvaca mme | sarvagm
    agnigm raphsushado huve vo mayi varco balamojo nidhatta || ssamprayatirahavanadata hate | tasmada
    nadyo nama stha ta vo namani sindhavah || yatpreshita varunenatashshibhagm samavalgata | tadapnodindro
    vo yatistasmadapo anusthana || apakamaggm syandamana avivarata vo hi kam | indro vashshaktibhirdevistasmadvarnama
    vo hitam || eko vo devo apyatishthathsyandamana yathavasham | udanishurmahiriti tasmadudakamucyate
    || apo bhadra ghritamidapa anuragnishomau bibhratyapa ittah | tivro raso madhupricam arangama a ma
    pranena saha varcasagann || aditpashyamyuta va shrinomya ma ghosho gacchati vanma asam | manye bhejano
    amritasya tar hi hiranyavarna atripam apo hishtha mayobhuvasta na urje dadhatana | maheranaya cakshase
    | yo vah shivatamo rasastasya bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya
    jinvatha | apo janayatha ca nah | shri bhavanishankarasvamine namah | shuddhodakena snapayami | divishrayasvantariksheyatasva
    prithivyasambhava brahmavarcasamasi brahmavarcasayatva | apa ngrahangrihnatyetadvapa rajasuyam ya~detegrahassavo
    'gnirvarunasavo rajasuyamagnisavashcityastabhyameva suyate 'tho ubhavevalokavabhijayati yashca rajasuyenejanasya
    yashcagnicita apo bhavantyapo va agnerbhratrivya yadapo 'gneradhastadupadadhati bhratrivyabhibhutyai
    bhavatyatmanapara 'syabhratrivyo bhavatyamritam va~ apastasmadadbhiravatantamabhishincanti nartimarchatisarvamayureti
    || pavamanassuvarjanah | pavitrena vicar shanih | yah pota sa punatu ma | punantu ma devajanah | punantu
    manavo dhiya | punantu vishva ayavah | jatavedah pavitravat | pavitrena punahi ma | shukrena devadidyat
    | agne kratva kratugm ranu | yatte pavitramarcishi | agne vitatamantara | brahma tena punimahe | ubhabhya
    ndevasavitah | pavitrena savena ca | ida mbrahma punimahe | vaishvadevi punati devyaga t | yasyai
    bahvistanuvo vitaprishthah | taya madanta ssadhamadyeshu | vayagg syama patayo rayinam | vaishvanaro
    rashmibhirma punatu | vatah praneneshiro mayo bhuh | dyavaprithivi payasa payobhih | ritavari yajniye
    ma punitam || brihadbhissavitastribhih | var shishthairdevamanmabhih | agne dakshaih punahi ma | yena
    deva apunata | yenapo divyankashah | tena divyena brahmana | ida mbrahma punimahe | yah pavamaniraddhyeti
    | rishibhissambhritagm rasam | sarvagm sa putamashnati | svadita mmatarishvana | pavamaniryo adhyeti
    | rishibhissambhritagm rasam | tasmai sarasvati duhe | kshiragm sarpirmadhudakam || pavamanissvastyayanih
    | sudughahi payasvatih | rishibhissambhrito rasah | brahmaneshvamritagm hitam | pavamanirdishantu
    nah | imam lo~kamatho amum | kaman thsamardhayantu nah | devi rdevaissamabhritah | pavamanissvastyayanih
    | sudughahi ghritashcutah | rishibhissambhrito rasah | brahmaneshvamritagm hitam | yena devah pavitrena
    | atmana | tena sahasradharena | pavamanyah punantu ma | prajapatya | shatodyamagm hiranmayam | tena
    brahma vido vayam | puta mbrahma punimahe | indrassuniti sahama punatu | somassvastya varunassamicya
    pramrinabhih punatu ma | jataveda morjayantya punatu | apo va idagm sarvam vi~shva bhutanyapah prana
    va apah pashava apo 'mritamapah samradapo viradapah svaradapashchandagmsyapo jyotigmshyapo yajugmshyapassatyamapassarva
    devata apo bhurbhuvassuvarapa om || apah pranayati | shraddhava apah | shraddhamevarabhya praniya
    pracarati | apah pranayati | yajno vaa apah | yajnamevarabhya praniya pracarati apah pranayati | vajro
    va apah | vajrameva bhratrivyebhyah prahritya praniya pracarati | apah pranayati | apo vai rakshoghnih
    | rakshasamapahatyai | apah pranayati | apo vai devana mpriyandhama | devanameva priyandhama praniya
    pracarati | apah pranayati | apo vai sarva devatah | devata evarabhya praniya pracarati | apovaishantah
    | shantabhirevasya shucagmshamayati || shri bhavanishankarasvamine namah | malapakar shanasnanam samarpayami
    |
  devanagari: ङ्कुर्यात् ॥ ॥ पञ्चामृतस्नानम् ॥ अथ पञ्चामृतदेवताभ्यो नमः । ध्यानावाहनादि षोडशोपचारपूजास्समर्पयामि
    । भवानीशङ्करमुद्दिश्य भवानीशङ्कर प्रीत्यर्थ ङ्करिष्यामः । क्षीरं आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑स्सोम॒
    वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे ॥ श्री भवानीशङ्करास्वामिने नमः क्षीरेण स्नपयामि । आपो॒ हिष्ठा म॑यो॒भुव॒स्ता
    न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः
    । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । श्री भवानीशङ्करास्वामिने नमः ।
    क्षीरस्नानानन्तरं शुद्धोदक स्नानं समर्पयामि । दधि द॒धि॒क्राव् ञ्जि॒ष्णोरश्व॑स्य वा॒जिनः॑ । सु॒रभि
    नो॒ मुखा॑ कर॒त्प्रण॒ आयूग्ं॑षि तारिषत् ॥ श्री भवानीशङ्करास्वामिने नमः । दध्ना स्नपयामि । आपो॒ हिष्ठा
    म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व
    मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । श्री भवानीशङ्करास्वामिने
    नमः । दधिस्नानानन्तरं शुद्धोदक स्नानं समर्पयामि । आज्यं शु॒क्रम॑सि॒ ज्योति॑रसि॒ तेजो॑सि दे॒वोव॑स्सवि॒तोत्पु॑ना॒
    त्वच्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒स्सूर्य॑स्य र॒श्मिभिः॑ । श्री भवानीशङ्करास्वामिने नमः । आज्येन स्नपयामि
    । आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒
    ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । श्री
    भवानीशङ्करास्वामिने नमः । आज्य स्नानानन्तरं शुद्धोदक स्नानं समर्पयामि । मधु मधु॒वाता॑ ऋताय॒ते मधु॑क्षरन्ति॒
    सिन्ध॑वः । माध्वी स्स॒न्त्वोष॑धीः । मधु॒ नक्त॑मु॒तोष॑सि॒ मधु॑म॒त्पार्थि॑व॒ग्ं॒ रजः॑ । मधु॒द्यौर॑स्तु
    नः पि॒ता । मधु॑मान्नो॒ वन॒स्पति॒र्मधु॑माग् ं अस्तु॒ सूर्यः॑ । माध्वी॒र्गावो॑ भवन्तु नः । श्री भवानीशङ्करास्वामिने
    नमः । मधुना स्नपयामि । आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो
    रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑
    ज॒नय॑था च नः । श्री भवानीशङ्करास्वामिने नमः । मधुस्नानानन्तरं शुद्धोदक स्नानं समर्पयामि । शर्कर स्वा॒दुः
    प॑वस्व दि॒व्याय॒ जन्म॑ने । स्वा॒दुरिन्द्रा॑य सु॒हवी॑तु॒ नाम्ने । स्वा॒दुर्मि॒त्राय॒ वरु॑णाय वा॒यवे॒
    । बृह॒स्पत॑ये॒ मधु॑मा॒ग्ं अदा भ्यः । श्री भवानीशङ्करास्वामिने नमः । शर्करया स्नपयामि । आपो॒ हिष्ठा
    म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व
    मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । श्री भवानीशङ्करास्वामिने
    नमः । शर्कर स्नानानन्तरं शुद्धोदक स्नानं समर्पयामि । श्री भवानीशङ्करास्वामिने नमः । पञ्चामृत स्नानं
    समर्पयामि । शङ्खोदकं आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो
    रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑
    ज॒नय॑था च नः । श्री भवानीशङ्करास्वामिने नमः । शङ्खोदकेन स्नपयामि ॥ फलोदकं याः फ॒लिनी॒र्या अ॑फ॒ला अ॑पु॒ष्पायाश्च॑
    पु॒ष्पिणीः । बृह॒स्पति॑ प्रसूता॒स्तानो॑ मुञ्च॒न्त्वग् ं ह॑सः ॥ श्री भवानीशङ्करास्वामिने नमः । फलोदकेन
    स्नपयामि । गन्धोदकं ग॒न्ध॒द्वा॒रा म् । ई॒श्वरी॑ग्ं सर्व॑भूता॒ना॒ न्तामि॒होप॑ह्वये॒ श्रियम् ॥ श्री
    भवानीशङ्करास्वामिने नमः । गन्धोदकेन स्नपयामि । पुष्पोदकं यो॑ न्भ॑वति । च॒न्द्रमा॒ वा अ॒पा म्पुष्प॑म्
    । पुष्प॑वा न्भ॑वति । श्री भवानीशङ्करास्वामिने नमः । पुष्पोदकेन स्नपयामि । अक्षतोदकं आय॑ने ते प॒राय॑णे॒
    दूर्वा॑ रोहन्तु पु॒ष्पिणीः॑ । ह्र॒दाश्च॑ पु॒ण्डरी॑काणि समु॒द्रस्य॑ गृ॒हा इ॒मे । श्री भवानीशङ्करास्वामिने
    नमः । अक्षतोदकेन स्नपयामि । सुवर्णोदकं तथ्सु॒वर्ण॒ग्ं॒ हिर॑ण्यमभवत् । तथ्सु॒वर्ण॑स्य॒ हिर॑ण्यस्य॒जन्म॑
    । य ए॒वग्ं सु॒वर्ण॑स्य॒ हिर॑ण्यस्य॒ जन्म॒वे॑द । सु॒वर्ण॑ आ॒त्मना॑ भवति । श्री भवानीशङ्करास्वामिने
    नमः । सुवर्णोदकेन स्नपयामि । रुद्राक्षोदकं त्र्य॑म्बकं म्पु॑ष्टि॒ वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑नान्मृ॒त्योर्मु॑क्षीय॒
