id: kyts-jata-6-3-chaatvaalaad-dhishniyaanupavapati-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.3 Chaatvaalaad Dhishniyaanupavapati - Krishna Yajurveda Taittiriya Samhita
content:
  english: ndhishniyag shcatvalac catvala dhishniya nupopa dhishniya upa vapati vapa tyupopa vapati |
    rvapati vapati yonih | vai yajnasya yajnasya vai vai yajnasya | ya~jnasya yajnasya catvalam | ya~jnasya
    yajnasya catvala yajnasya sayonitvaya sayonitvaya yajnasya yajnasya sayonitvaya | sayonitvaya deva
    deva ssayonitvaya sayonitvaya devah | sayonitvayeti sayoni deva vai vai deva deva vai | para 'jayanta
    jayanta para para 'jayanta | nta majayanta jayanta tam | puna rapapa punah puna rapa | vai yajnasya
    yajnasya vai vai yajnasya | yajnasya parajita maparajitam ya~jnasya yajnasya parajitam | dyadaparajita
    maparajitam viharati viharati dhishniya dviharati viharati yat | eva yajnasya yajnasyaivaiva yajnasya
    | yajnasya parajita maparajitam ya~jnasya yajnasya parajitam | ntata stato 'parajita maparajita tata
    evaiva tata stata eva | evaina mena mevai vaina mpunah puna rena mena puna stanute tanute punah puna
    stanute | tanute parajitya parajitya tanute tanute parajitya | paraji tyeveva parajitya parajityeva
    | iva khalu khalviveva khalu | khalu vai vai khalu khalu vai | va eta ete vai va ete | ete yanti yantyeta
    ete yanti | yanti ye ye yanti yanti ye | ye~ ye bahishpavamanam | bahishpavamanagm sarpanti sarpanti
    bahishpavamana mbahishpavamanagm sarpanti | bahishpavamanamiti bahih sarpanti bahishpavamane bahishpavamane
    sarpanti sarpanti bahishpavamane | bahishpavamane stute stute bahishpavamane bahishpavamane stute
    | bahishpavamana iti bahih stuta ahaha stute stuta aha | || ahagni dagni daha hagni agni dagni nagni
    nagni dagni dagnin | vi vyagni nagnin vi hara hara vi vi hara | sstrinahi strinahi barhi strinahi
    purodasha nthstrinahi strinahi purodashan | purodashagm ala mala kurvi titi kuru kurviti | ya~jna
    mititi yajnam | eva pajitya paji tyaivaiva pajitya | apajitya punah puna rapajitya pajitya punah |
    puna stanvana stanvanah punah puna stanvanah | tanvana yanti yanti tanvana stanvana yanti | yantyangarai
    rangarai ryanti yantyangaraih | rdve dve angarai rangarai dve savane savane dve dve savane | savane
    vi vi savane savane vi | vi harati harati vi vi harati | harati harati shalakabhih | ntritiyagm shalakabhi
    shshalakabhi stritiya tritiyagm sashukratvaya sashukratvaya tritiya ntritiyagm sashukratvaya | sashukratva
    yatho atho sashukratvaya sashukratva yatho sashukratvayeti sashukra atho sagm sa matho atho sam |
    mbharati bharati sagm sa bhara tyevaiva bharati bhara tyeva | evaina dena devai vainat | ddhishniya
    dhishniya ena dena dhishniya vai vai dhishniya dhishniya vai | vai va amushminn | amushmin ~loke loke
    'mushmi nnamushmin ~loke | loke somagm somam ~loke loke soma nthsomagm soma marakshann | ntebhya stebhyo
    'raksha tebhyo 'dhyadhi tebhya stebhyo 'dhi | adhi somagm soma madhyadhi soma soma ma somagm soma
    ma | nnaharanna 'harann | nta manvavayann | anvavayannityanu npari paryavishann | veda vindate vindate
    veda veda vindate vindate pariveshtara vi~ndate vindate pariveshtara nte te pariveshtara pariveshtaramiti
    pari te somapithena somapithena te te somapithena | somapithena vi vi somapithena somapithena vi |
    rdhyanta rdhyanta vi vya rdhyanta rdhyanta te | te deveshu deveshu te te deveshu | deveshu somapithagm
    somapitha ndeveshu deveshu somapitham | ccha ntaicchanta somapithagm somapitha mai ccha ntaicchanta
    tan | ndeva deva stag ndeva deva abruvann | ndvedve dvedve abruva dvedve namani namani dvedve dvedve
    namani | nnamani namani kuruddhvam | namani iti namani | kuruddhva mathatha kuruddhva atha pra prathatha
    pra | pra va va pra pra va va ''phsyatha phsyatha va va ''phsyatha | aphsyatha na naphsyatha phsyatha
    na | ityagnayo 'gnaya iti tyagnayah | agnayo vai va agnayo 'gnayo vai | va athatha vai va atha | atha
    dhishniya dhishniya athatha dhishniyah | ddhishniya dhishniya stasma brahmano 'rdhuko 'rdhuko brahmano
    bra ntesha mardhuko 'rdhuka stesha paryavishanniti pari te somapithagm somapitha nte te somapitham
    | mpra pra somapithagm somapitha npra prapnuvann | nnahavaniya ahavaniya apnuva ahavaniya agniddhriya
    agniddhriya ahavaniya ahavaniya agniddhriyah | agniddhriyo hotriyo hotriya agniddhriya agniddhriyo
    hotriyah | agniddhriya itya hotriyo marjaliyo marjaliyo hotriyo hotriyo marjaliyah | marjaliya stasma
    nmarjaliyo marjaliya stasma tteshu teshu tasma teshu juhvati juhvati teshu teshu juhvati | juhva tyatihaya
    tihaya juhvati juhva tyatihaya | dvasha datihaya tihaya vashat | karoti vi vi karoti karoti vi | hyeta
    ete hi hyete | || ete somapithena somapithenaita ete somapithena | somapithena rdhyanta rdhyanta somapithena
    somapithena rdhyanta | ardhyanta deva deva ardhyanta rdhyanta devah | deva vai vai deva deva vai |
    vai ya ya vai vai yah | yah pracih praci praci rahuti rahutih pracih praci rahutih | ahuti rajuhavu
    rajuhavu rahuti rahuti rajuhavuh | rye ye 'juhavu rajuhavu purasta dasura asurah purasta tpurasta
    dasurah | nnasura asura asann | stabhi stabhi stag tabhih pra pra tabhi stabhih pra | pranudanta nudanta
    pra pranudanta | anudanta ya ya anudanta nudanta yah | pashca dasura asurah pashca nnasura asura asann
    | stabhi stabhi stag tabhi rapapa tabhi stabhi rapa | apanudanta nudanta papa nudanta | anudanta pracih
    praci ranudanta nudanta pracih praci ranya anyah pracih praci ranyah | anya ahutaya ahutayo 'nya anya
    ahutayah | ahutayo huyante huyanta ahutaya ahutayo huyante pratya masina asinah pratya ndhishniya
    nasina asino dhishniyan | dhishniyan vyagharayati vyagharayati dhishniya ndhishniyan vyagharayati
    | dvyagharayati vyagharayati pashcat | pashcac ca ca pashca tpurasta devaiva purasta ca yajamano yajamanashca
    ca yajamanah | yajamano bhratrivya yajamano yajamano bhratrivyan | npra pra bhratrivya pra nudate
    nudate pra pra nudate | nnudate nudate tasma tparacih paraci stasma paracih prajah prajah paracih
    paracih prajah | prajah pra pra prajah prajah pra | pra viyante viyante pra pra viyante | viyante
    praticih rviyante viyante praticih rjayante jayante praticih jayante pranah prana jayante jayante
    pranah | prana vai vai pranah prana vai | va eta ete vai va ete | ddhishniya dhishniya ya ddhishniya
    dhishniya yat | yadaddhvaryu raddhvaryu addhvaryuh pratya mpratyam maddhvaryu raddhvaryuh pratyam
    | dhishniya natisarpe datisarpe ndhishniya natisarpe nprana natisarpe datisarpe tpramayukah pramayukah
    kar tpramayukah pramayuka pramayuka iti pra va eshaisha vai va esha | esha yajnasya yajna syaishaisha
    yajnasya | dyajnasya yajnasya yat | hotordhva urdhvo hota hotordhvah | urdhvah khalu khalurdhva urdhvah
    khalu | khalu vai vai khalu khalu vai | vai nabhyai nabhyai vai vai nabhyai pranah prano nabhyai nabhyai
    mpranah prano 'vam | ava mapano 'pano 'va mava mapanah | dyadapano 'pano yat | yadaddhvaryu raddhvaryu
    addhvaryuh pratya mpratyam maddhvaryu raddhvaryuh pratyam | hotara matisarpe datisarpe ddhotaragm
    hotara matisarpe atisarpe dapane 'pane 'tisarpe datisarpe dapane | mprana mapane 'pane pranam | tpramayukah
    pramayuko daddhya tpramayukah pramayuka pramayuka iti pra naddhvaryu raddhvaryu ddhvaryu raddhvaryu
    rupa | dgaye dupopa gayet | va addhvaryu raddhvaryu rvai va addhvaryuh | dyadaddhvaryu raddhvaryu
    yadaddhvaryu raddhvaryu addhvaryu rupagaye dupagaye daddhvaryu raddhvaryu rupagaye gatra upagaye dupagaye
    dud tpra pra yacchet | yacche dupadasu kopadasuka yacche dyacche dupadasuka | upadasuka 'syasyo padasu
    kopadasuka 'sya | asya vag vaga syasya vak | brahmavadino vadanti vadanti brahmavadino brahmavadino
    vadanti | brahmavadina iti brahma vadanti na na vadanti vadanti na | nasaggsthite 'saggsthite na nasaggsthite
    | asaggsthite some some 'saggsthite 'saggsthite some asaggsthita ityasam 'ddhvaryu raddhvaryu addhvaryuh
    pratya mpratyam maddhvaryu raddhvaryuh pratyam | atiya diya datyatiyat | iya dathathe yadiya datha
    | atha katha katha 'thatha katha | kshinani dakshinani katha katha da dakshinani hotugm hotu ndakshinani
    dakshinani hotu hotu metyeti hotugm hotu meti | eti yamo yama etyeti yamah | yamo hi hi yamo yamo
    hi | nteshagm sa sa tesha nkasmai kasmai tesha kasma ahaha kasmai kasma aha | aha deva deva ahaha
    devah | va~ va 'yama mayamam va 'nvanu va va 'nu | anu jnasyanti jnasya ntyanvanu jnasyanti | jnasyanti
    titi jnasyanti jnasyantiti | ityuttare nottarene tityuttarena | ddhra muttare nottarena gni mparitya
    paritya gni paritya juhoti juhoti paritya paritya juhoti | juhoti dakshinani dakshinani juhoti juhoti
    dakshinani | dakshinani na na da kshinani dakshinani na | karshati ni ni kar anye dhishniya dhishniya
    anye dhishniya upyanta upyante dhishniya dhishniya upyante upyante na nopyanta upyante na | nnivapati
    nivapati yan nivapati tena tena nivapati nivapati tena | nprinati prinati tag nprinati prinati yan
    | na nivapati nivapati na na nivapati | nnivapati nivapati yat | yadanudisha tyanudishati ya anudishati
    tena tena nudisha tyanudishati tena | suvargaya vai vai suvargaya suvargaya vai | va eta nyetani vai
    va etani | etani lokaya lokayai tanyetani lokaya | lokaya huyante huyante lokaya lokaya huyante |
    dyaddhuyante huyante yat | dvaisarjanani vaisarjanani ya vaisarjanani dvabhya vai~sarjanani vaisarjanani
    dvabhya hapatye juhoti juhoti gar ddvipaj juhoti juhoti dvipat | dyajamano yajamano dvipa yajamanah
    pratishthityai pratishthityai yajamano yajamanah pratishthityai | pratishthitya agni ddhre pratishthityai
    pratishthitya agni pratishthitya iti prati ddhre juhoti juho tyagni juho tyantarikshe 'ntarikshe juhoti
    juho tyantarikshe | antariksha evaiva ntarikshe 'ntariksha eva | a kramate kramata a kramate | kramata
    ahavaniya ahavaniye kramate kramata ahavaniye ahavaniye juhoti juho tyahavaniya ahavaniye juhoti |
    juhoti suvargagm suvarga njuhoti juhoti suvargam | suvarga mevaiva suvargagm suvarga meva | evaina
    mena mevai vaina enam ~lokam ~loka mena menam ~lokam | ngamayati gamayati lokam ~loka ngamayati gamayati
    devan | vai suvargagm suvargam suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ya~to yato lokam
    ~lokam yato rakshagmsi rakshagmsi yato yato rakshagmsi | rakshag syajighagmsa nrakshagmsi rakshag
    syajighagmsann | te somena somena te te somena | somena rajna rajna somena somena rajna rajna rakshagmsi
    rakshagmsi rajna rajna rakshagmsi | rakshag syapahatya pahatya rakshagmsi rakshag syapahatya | apaha
    tyaptu maptu mapaha tyapaha tyaptum | aptu matmana matmana maptu maptu matmana nkritva kritva ''tmana
    matmana kritva suvargagm suvarga nkritva kritva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam
    ~lokam | nnayan ~lokam ~loka mayann | nrakshasagm rakshasa maya rakshasa manupalabhaya nupalabhaya
    rakshasagm rakshasa manupalabhaya | anupalabhayatta atto 'nupalabhaya nupalabhayattah | somo bhavati
    bhavati soma bhava tyathatha bhavati bhava tyatha | atha vaisarjanani vaisarjana nyathatha vaisarjanani
    | || vaisarjanani juhoti juhoti vaisarjanani vaisarjanani juhoti | juhoti rakshasagm rakshasa njuhoti
    juhoti rakshasam | rakshasa mapahatya apahatyai rakshasagm rakshasa mapahatyai | ntva mapahatya apahatyai
    tvam | tvagm soma soma tva soma tanukridbhya stanukridbhyah soma soma tanukridbhyah | tanukridbhya
    ititi tanukridbhya stanukridbhya iti | tanukridbhya iti tanukrit ityahahe tityaha | ttanukri dahaha
    tanukrit | tanukriddhi hi tanukri hyesha esha hi hyeshah | bhyo 'nyakritebhyo 'nyakritebhyo dvesho
    bhyo 'nyakritebhyah | anyakritebhya iti tyanyakritebhyo 'nyakritebhya iti | anyakritebhya ityanya
    ityahahe tityaha | aha nyakrita nyanyakrita nyahaha nyakritani | anyakritani hi hyanyakrita nya nyakritani
    hi | anyakritanityanya hi rakshagmsi rakshagmsi hi hi rakshagmsi | rakshag syu ruru rakshagmsi rakshag
    syuru | uru yanta yanto ruru yanta | yanta 'syasi yanta yanta 'si | va~rutha masyasi varutham | varutha
    mititi varutham ityahahe tityaha | uru no na ururu nah | na skridhi kridhi no na skridhi | kridhi
    titi kridhi kridhiti | iti vava vave titi vava | eta daha haita deta daha | aha jushano jushana ahaha
    jushanah | jushano aptu raptu rjushano jushano aptuh | aptu rajyasyajya syaptu raptu rajyasya | ajyasya
    vetu vetvajya syajyasya vetu | vetvititi vetu vetviti | ityahahe tityaha | ahaptu maptu maha haptum
    | aptu mevai vaptu maptu meva | ya~jamana mevaiva yajamanam | nkritva kritva yajamanam kritva suvargagm
    suvarga nkritva kritva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | ngamayati gamayati
    lokam ~loka gamayati rakshasagm rakshasa ngamayati gamayati rakshasam | rakshasa manupalabhaya nupalabhaya
    rakshasagm rakshasa manupalabhaya | anupalabhaya 'nupalabhaya nupalabhaya | a somagm soma ma soma
    ndadate dadate somagm soma dadata a dadate dadata a | || a vayavyani vayavya nya vayavyani vayavya
    ndronakalasha ma dronakalasham | dronakalashamiti drona a nayanti nayantya nayanti | ntyanvanu nayanti
    naya anvanag syanag syan van vanagmsi | anagmsi pra pranag syanagmsi pra | pra vartayanti vartayanti
    pra pra vartayanti | dvartayanti vartayanti yavat | asya styastya sya syasti | asti tena tena styasti
    tena | tena saha saha tena tena saha | saha suvargagm suvargagm saha saha suvargam | suvargam ~lokam
    ~lokagm suvargagm suvargam ~lokam | tyeti lokam ~loka meti | eti nayavatya nayava tyaityeti nayavatya
    | ca nayavatya nayavatya r ddhre juhoti juho tyagni juhoti suvargasya suvargasya juhoti juhoti suvargasya
    | suvargasya lokasya lokasya suvargasya suvargasya lokasya | suvargasyeti suvah tyai lokasya lokasya
    bhini nno vayavyani vayavyani grav vayavyani dronakalasha va~yavyani vayavyani dronakalasham | dronakalashamiti
    drona upa vasayati vasaya tyupopa vasayati | vasayati vi vi vasayati vasayati vi | hyena menagm hi
    hyenam | rgrihnate grihnate tai stai dgrihnate grihnate yat | sahopavasaye dupavasaye upavasaye dapuvayeta
    puvayeto pavasaye dupavasaye dapuvayeta | apuvayeta saumya saumya 'puvayeta puvayeta saumya | ca saumya
    saumya r pra padayati padayati pra pra padayati | padayati svaya svaya padayati padayati svaya svayaivaiva
    svaya svayaiva | || evaina mena mevai vaina ndevataya devatayaina mena devataya pra pra devataya devataya
    pra | pra padayati padayati pra pra padayati | padaya tyaditya adityah padayati padaya tyadityah |
    ssado 'ditya aditya asya ditya aditya asyasya dityah | ssado 'ditya aditya side titi sida sideti |
    ityahahe tityaha | ryathayaju rahaha yathayajuh | yathayaju revaiva yathayaju evaita deta devai vaitat
    | dyajamano yajamana eta deta yajamano vai vai yajamano yajamano vai | va eta syaitasya vai va etasya
    | etasya pura puraita syaitasya pura | pura gopta gopta pura pura gopta | gopta bhavati bhavati gopta
    gopta bhavati | bhava tyesha esha bhavati bhava tyeshah | esha vo va esha esha vah | vo deva deva
    vo vo deva | rdeva deva savitah | ityahahe tityaha | ssavitriprasuta ahaha savitriprasutah | savitriprasuta
    evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri evaina mena mevai vaina pra
    yacchati yacchati pra pra yacchati | dyacchati yaccha tyetat | tvagm soma soma tva ndevo devo devan
    | upaga aga upopagah | aga iti tyaga aga iti | ityahahe tityaha | aha devo deva ahaha devah | devo
    hi hi devo devo hi | hyesha esha hi hyeshah | deva nupai tyupaiti deva upaitida mida mupai tyupaitidam
    | ida maha maha mida mida maham | mmanushyo manushyo 'ha maha nmanushyo manushyo manushyan | manushyani
    titi manushya ityahahe tityaha | aha manushyo manushya ahaha manushyah | manushyo hi hi manushyo manushyo
    hi | hyesha esha hi hyeshah | manushya nupai tyupaiti manushya nmanushya nupaiti | dyadupai tyupaiti
    yat | bruya dapraja apraja bruya dbruya daprajah | apraja apashu rapashu rapraja apraja apashuh |
    ryajamano yajamano 'pashu rapashu prajaya saha saha prajaya prajaya saha saha prajaya raya sposhena
    poshena rayo raya sposhena | poshene titi poshena posheneti | ityahahe tityaha | prajaya ''haha prajaya
    eva pashubhih pashubhi revaiva pashubhih | pashubhih saha saha pashubhih pashubhih saha | sahema mimagm
    saha sahemam | imam ~lokam ~loka mima mimam ~lokam | loka mupavartata upavartate lokam ~loka mupavartate
    | upavartate namo nama upavartata upavartate namah | namo devebhyo devebhyo namo namo devebhyah |
    devebhya ititi devebhyo devebhya iti | ityahahe tityaha | aha namaskaro namaskara ahaha namaskarah
    | namaskaro hi hi namaskaro namaskaro hi | ndevanagm hi hi devana devanag svadha svadha devana ndevanag
    svadha | svadha pitribhyah pitribhyah svadha svadha pitribhyah | pitribhya ititi pitribhyah pitribhya
    iti | pitribhya iti pitri ityahahe tityaha | ssvadhakara ahaha svadhakarah | svadhakaro hi hi svadhakara
    svadhakara iti svadha mpitrinagm hi hi pitrinam | || ida maha maha mida mida maham | rvarunasya varunasya
    ni dvarunasya varunasya pasha ityahahe tityaha | dvarunapasha dahaha varunapashat | varunapasha devaiva
    varunapasha varunapashaditi varuna rmucyate mucyate ni mucyate 'gne 'gne mucyate mucyate 'gne vratapate
    vratapate 'gne 'gne vratapata atmana atmano vratapate vratapata atmanah | vratapata iti vrata atmanah
    purva purva ''tmana atmanah purva purva tanu stanuh purva purva tanuh | tanu radeya ''deya tanu stanu
    radeya adeyeti tyadeya ''deyeti | ityahu rahuri tityahuh | ahuh kah ka ahu rahuh kah | nthsve sve
    vasiyan sve vashe vashe sve sve vashe vashe bhute bhute vashe vashe bhute | rbhute bhute punah | va
    dadati dadati va va dadati | dadati na na dadati dadati na | iti gravano gravana ititi gravanah |
    gravano vai vai gravano gravano vai | vai somasya somasya vai vai somasya | somasya rajno rajna ssomasya
    somasya rajnah | rajno malimlusena malimlusena rajno rajno malimlusena | malimlusena yo yo malimlusena
    malimlusena yah | malimluseneti malimlu ddhra upavasaya tyupavasaya tyagni upavasayati na nopavasaya
    tyupavasayati na | mmalimlusena malimlusenaina mena malimlusena vindati vindati malimlusena malimlusena
    vindati | malimluseneti malimlu vindatiti vindati | || rica hutva hutva r yu~pagm hutva hutva yupa
    yupa maccha ccha yupam tye tyaccha cchaiti | vai devataya devataya vai vai devataya | devataya yupo
    yupo devataya devataya yupah | ssvaya svaya yupo yupa svayaivaiva svaya svayaiva | evaina mena mevai
    vaina ndevataya devatayaina mena devataya 'cchaccha devataya devataya 'ccha | tye tyaccha cchaiti
    | atyanya nanya natya tyanyan | anya naga maga manya nanya naga aganna naga maganna | anya nupo panya
    nanya nupa | upaga maga mupo pagam | aga miti tyaga maga miti | ityahahe tityaha | ahatya tyaha hati
    | ati hi hya tyati hi | anya netye tyanya nanya neti | eti na naityeti na | anya nupai tyupai tyanya
    nanya nupaiti | upaitya rva garva gupai tyupai tyarvak | mparaih parai ravidam | mparah paro 'vida
    mavida paro 'varai ravaraih parah paro 'varaih | avarai riti tyavarai ravarai riti | ityahahe tityaha
    | aha rva garva gaha harvak | arva gghi hya rvaga rva gghi | hyena menagm hi hyenam | mparaih parai
    rena mena rvindati vindati paraih parai vindati parah paro vindati vindati parah | paro 'varai ravaraih
