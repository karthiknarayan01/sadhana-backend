id: ramanujastutipadyani
category: stotram
name:
  english: ramanujastutipadyani
  devanagari: रामानुजस्तुतिपद्यानि
content:
  english: ramanujastutipadyani shriparasharabhattarakairanugrihitani || shrih || || shrimate ramanujaya
    namah || || shriparasharabhattarakebhyo namah || shriparasharabhattaryah shrirangeshapurohitah | shrivatsankasutah
    shriman shreyase me'stu bhuyase || ramanujamunirjiyat yo harerbhaktiyantratah | kalikolahalakridamudhagrahamapaharat
    || 1||
  devanagari: रामानुजस्तुतिपद्यानि श्रीपराशरभट्टारकैरनुगृहीतानि ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय नमः ॥ ॥
    श्रीपराशरभट्टारकेभ्यो नमः ॥ श्रीपराशरभट्टार्यः श्रीरङ्गेशपुरोहितः । श्रीवत्साङ्कसुतः श्रीमान् श्रेयसे
    मेऽस्तु भूयसे ॥ रामानुजमुनिर्जीयात् यो हरेर्भक्तियन्त्रतः । कलिकोलाहलक्रीडामुधाग्रहमपाहरत् ॥ १॥
meaning: {}
