id: alternative-4
category: stotram
name:
  english: alternative
  devanagari: आल्तेर्नतिवे
content:
  english: tvam || 6|| sadratnasaratatirajitasatkiritah kausumbhacaruvasanadvaya urjitashrih | sarvatramangalakarasmaranapratapo
    vighnam mamapahara siddhivinayaka
  devanagari: त्वम् ॥ ६॥ सद्रत्नसारततिराजीतसत्किरीटः कौसुम्भचारुवसनद्वय ऊर्जितश्रीः । सर्वत्रमङ्गलकरस्मरणप्रतापो
    विघ्नं ममापहर सिद्धिविनायक
meaning: {}
