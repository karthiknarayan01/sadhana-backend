id: ganesha-8
category: stotram
name:
  english: ganesha 8
  devanagari: गनेश ८
content:
  english: shriganeshastotram sartham shriganeshaya namah | narada uvaca | pranamya shirasa devam gauriputram
    vinayakam | bhaktavasam smarennityamayuhkamarthasiddhaye || 1|| prathamam vakratundam ca ekadantam
    dvitiyakam | tritiyam krishnapingaksham gajavaktram caturthakam || 2|| lambodaram pancamam ca shashtham
    vikatameva ca | saptamam vighnarajendram dhumravarnam tathashtamam || 3|| navamam bhalacandram ca
    dashamam tu vinayakam | ekadasham ganapatim dvadasham tu gajananam || 4|| dvadashaitani namani trisandhyam
    yah pathennarah | na ca vighnabhayam tasya sarvasiddhikarah prabhuh || 5|| vidyarthi labhate vidyam
    dhanarthi labhate dhanam | putrarthi labhate putranmoksharthi labhate gatim || 6|| japedganapatistotram
    shadbhirmasaih phalam labhet | samvatsarena siddhim ca labhate natra samshayah || 7|| ashtabhyo brahmanebhyashca
    likhitva yah samarpayet | tasya vidya bhavetsarva ganeshasya prasadatah || 8|| || iti shrinaradapurane
    samkatanashanam ganeshastotram sampurnam ||
  devanagari: श्रीगणेशस्तोत्रं सार्थम् श्रीगणेशाय नमः । नारद उवाच । प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम्
    । भक्तावासं स्मरेन्नित्यमायुःकामार्थसिद्धये ॥ १॥ प्रथमं वक्रतुण्डं च एकदन्तं द्वितीयकम् । तृतीयं कृष्णपिङ्गाक्षं
    गजवक्त्रं चतुर्थकम् ॥ २॥ लम्बोदरं पञ्चमं च षष्ठं विकटमेव च । सप्तमं विघ्नराजेन्द्रं धूम्रवर्णं तथाष्टमम्
    ॥ ३॥ नवमं भालचन्द्रं च दशमं तु विनायकम् । एकादशं गणपतिं द्वादशं तु गजाननम् ॥ ४॥ द्वादशैतानि नामानि
    त्रिसन्ध्यं यः पठेन्नरः । न च विघ्नभयं तस्य सर्वसिद्धिकरः प्रभुः ॥ ५॥ विद्यार्थी लभते विद्यां धनार्थी
    लभते धनम् । पुत्रार्थी लभते पुत्रान्मोक्षार्थी लभते गतिम् ॥ ६॥ जपेद्गणपतिस्तोत्रं षड्भिर्मासैः फलं
    लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥ ७॥ अष्टभ्यो ब्राह्मणेभ्यश्च लिखित्वा यः समर्पयेत् ।
    तस्य विद्या भवेत्सर्वा गणेशस्य प्रसादतः ॥ ८॥ ॥ इति श्रीनारदपुराणे संकटनाशनं गणेशस्तोत्रं सम्पूर्णम्
    ॥
