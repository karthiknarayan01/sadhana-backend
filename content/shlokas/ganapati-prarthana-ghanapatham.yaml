id: ganapati-prarthana-ghanapatham
category: stotram
name:
  english: Ganapati Prarthana Ghanapatham
content:
  english: om shri gurubhyo namah | harih om || o ntva ganapatigm havamahe kavi nkavinam upamashravastavam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || ganana ntva ganapatim || tva ganapati
    ntvatva ganapatigm havamahe havamahe ganapati ntvatva ganapatigm havamahe | ganapatigm havamahe havamahe
    ganapati nganapatigm havamahe kavinkavigm havamahe ganapati nganapatigm havamahe kavim | ganapatimitigana
    patim || havamahe kavi nkavigm havamahe havamahe kavi nkavigm havamahe havamahe kavinkavinam || kavinkavinankavina
    nkavinamupamashravastama mupamashravastamankavina nkavinamupamashravastamam || kavinamupamashrava
    stamamupamashravastama nkavina nkavina mupamashravastamam | upamashravastama mityupamashravah tamam
    || jyeshtarajam brahmana njyeshtharajam jyeshtharajam brahmana mbrahmano brahmano brahmana njyeshtharajam
    jyeshtharajam brahmana mbrahmanah | jyeshtharajamitijyeshtha rajam mbrahmano brahmano brahmanam brahmana
    mbrahmanaspate patebrahmano brahmanam brahmana mbrahmanaspate || brahmanaspate pate brahmano brahmanaspata
    apate brahmano brahmanaspata a | pata a patepata anona apate pata anah || anona anashshrinvanchrinvanna
    anashshrinvann | na shshrinvanchrinvannona shshrinvannutibhi rutibhishshrinvannona shshrinvannutibhih
    || shshrinvannutibhi rutibhishshrinvanchrinvannutibhissida sidotibhishshrinvan chrinvannutibhissida
    || utibhissida sidotibhi rutibhissida sadanagm sadanagm sidotibhirutibhissida sadanam | utibhi rityuti
    bhih || sidasadanagm sadanagm sida sida sadanam | sadanamiti sadanam || om shri mahaganapataye namah
    ||
  devanagari: ॐ श्री गुरुभ्यो नमः । हरिः ओम् ॥ ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां उप॒मश्र॑वस्तवम्
    । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ ग॒णाना न्त्वा ग॒णप॑तिम् ॥ त्वा॒
    ग॒णप॑ति न्त्वात्वा ग॒णप॑तिग्ं हवामहे हवामहे ग॒णप॑ति न्त्वात्वा गणप॑तिग्ं हवामहे । ग॒णप॑तिग्ं हवामहे
    हवामहे ग॒णप॑ति ङ्ग॒णप॑तिग्ं हवामहे क॒विन्क॒विग्ं ह॑वामहे ग॒णप॑ति ङ्ग॒णप॑तिग्ं हवामहे क॒विम् । ग॒णप॑ति॒मिति॑ग॒ण
    प॒ति॒म् ॥ ह॒वा॒म॒हे॒ क॒वि ङ्क॒विग्ं॒ ह॑वामहे हवामहे क॒वि ङ्क॒विग्ं॒ ह॑वामहे हवामहे क॒विन्क॑वी॒नाम्
    ॥ क॒विन्क॑वी॒नान्क॑वी॒ना ङ्क॑वी॒नामु॑प॒मश्र॑वस्तम मुप॒मश्र॑वस्तमङ्क॑वी॒ना ङ्क॑वी॒नामु॑प॒मश्र॑वस्तमम्
    ॥ क॒वी॒नामु॑प॒मश्र॑व स्तममुप॒मश्र॑वस्तम ङ्कवी॒ना न्क॑वी॒ना मु॑प॒मश्र॑वस्तमम् । उ॒प॒मश्र॑वस्तम॒ मित्यु॑प॒मश्र॑वः
    त॒म॒म् ॥ ज्ये॒ष्ट॒राजं॒ ब्रह्म॑णा॒ ञ्ज्येष्ठ॒राजं॑ ज्येष्ठ॒राजं॒ ब्रह्म॑णा म्ब्रह्मणो ब्रह्मणो॒ ब्रह्म॑णा
    ञ्ज्येष्ठ॒राजं॑ ज्येष्ठ॒राजं॒ ब्रह्म॑णा म्ब्रह्मणः । ज्ये॒ष्ठ॒राज॒मिति॑ज्येष्ठ राजम् म्ब्रह्मणो ब्रह्मणो॒
    ब्रह्म॑णां॒ ब्रह्म॑णा म्ब्रह्मणस्पते पतेब्रह्मणो॒ ब्रह्म॑णां॒ ब्रह्म॑णा म्ब्रह्मणस्पते ॥ ब्र॒ह्म॒ण॒स्प॒ते॒
    प॒ते॒ ब्र॒ह्म॒णो॒ ब्र॒ह्म॒ण॒स्प॒त॒ आप॑ते ब्रह्मणो ब्रह्मणस्पत॒ आ । प॒त॒ आ प॑तेपत॒ आनो॑न॒ आप॑ते पत॒
    आनः॑ ॥ आनो॑न॒ आन॑श्शृ॒ण्वन्छृ॒ण्वन्न॒ आन॑श्शृण्वन्न् । न॒ श्शृण्वन्छृ॒ण्वन्नो॑न श्शृ॒ण्वन्नू॒तिभि॑
    रू॒तिभि॑श्शृ॒ण्वन्नो॑न श्शृ॒ण्वन्नू॒तिभिः॑ ॥ श्शृ॒ण्वन्नू॒तिभि॑ रू॒तिभि॑श्शृ॒ण्वन्छृ॒ण्वन्नू॒तिभि॑स्सीद
    सीदो॒तिभि॑श्शृ॒ण्वन् छृ॒ण्वन्नू॒तिभि॑स्सीद ॥ ऊ॒तिभि॑स्सीद सीदो॒तिभि॑ रू॒तिभि॑स्सीद॒ साद॑न॒ग्ं॒ साद॑नग्ं॒
    सीदो॒तिभि॑रू॒तिभि॑स्सीद॒ साद॑नम् । ऊ॒तिभि॒ रित्यू॒ति भिः॒ ॥ सी॒द॒साद॑न॒ग्ं॒ साद॑नग्ं॒ सीद सीद॒ साद॑नम्
    । साद॑न॒मिति॒ साद॑नम् ॥ ॐ श्री महागणपतये नमः ॥
