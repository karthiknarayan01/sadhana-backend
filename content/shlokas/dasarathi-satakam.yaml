    तक्किनमाधुरी महिम दाशरथी करुणापयोनिधी ॥ अण्डजवाह निन्नु हृदयम्बुननम्मिन वारि पापमुल् कॊण्डलवण्टिवैन
    वॆसगूलि नशिम्पक युन्नॆ सन्त ता खण्डलवैभवोन्नतुलु गल्गकमानुनॆ मोक्ष लक्ष्मिकै दण्डयॊसङ्गकुन्नॆ तुद
    दाशरथी करुणापयोनिधी ॥ चिक्कनिपालपै मिसिमि जॆन्दिन मीगड पञ्चदारतो मॆक्किनभङ्गि मीविमल मेचकरूप सुधारसम्बु
