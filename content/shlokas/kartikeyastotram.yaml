id: kartikeyastotram
category: stotram
name:
  english: kartikeyastotram
  devanagari: कार्तिकेयस्तोत्रम्
content:
  english: shri ganeshaya namah | shri skanda uvaca yogishvaro mahasenah kartikeyo'gninamdanah | skandah
    kumarah senani svami shamkarasambhavah || gamgeyastamracudashca brahmacari shikhidhvajah | tarakarirumaputrah
    krauncarishca shadananah || shabdabrahma samudrashca siddhah sarasvato guhah | sanatkumaro bhagavan
    bhoga moksha phalapradah || sharajanma gunadishah purvajo mukti margakrit | sarvagama praneta ca vanchitartha
    pradarshanah || ashtavimshati namani madiyaniti yah pathet | pratyusham shraddhaya yukto muko vacaspatirbhavet
    || mahamantramaya niti mama namanukirtanam | mahaprajnamavapnoti natra karya vicarana || || iti shri
    rudrayamale prajnavivardhanakhyam shrimatkartikeyastotram sampurnam ||
  devanagari: श्री गणेशाय नमः । श्री स्कन्द उवाच योगीश्वरो महासेनः कार्तिकेयोऽग्निनंदनः । स्कन्दः कुमारः
    सेनानी स्वामी शंकरसम्भवः ॥ गांगेयस्ताम्रचूडश्च ब्रह्मचारी शिखिध्वजः । तारकारिरुमापुत्रः क्रौञ्चारिश्च
    षडाननः ॥ शब्दब्रह्म समुद्रश्च सिद्धः सारस्वतो गुहः । सनत्कुमारो भगवान् भोग मोक्ष फलप्रदः ॥ शरजन्मा
    गुणादीशः पूर्वजो मुक्ति मार्गकृत् । सर्वागम प्रणेता च वाञ्छितार्थ प्रदर्शनः ॥ अष्टाविंशति नामानि मदीयानीति
    यः पठेत् । प्रत्यूषम् श्रद्धया युक्तो मूको वाचस्पतिर्भवेत् ॥ महामन्त्रमया नीति मम नामानुकीर्तनम् ।
    महाप्रज्ञामवाप्नोति नात्र कार्या विचारणा ॥ ॥ इति श्री रुद्रयामले प्रज्ञाविवर्धनाख्यम् श्रीमत्कार्तिकेयस्तोत्रम्
    संपूर्णम् ॥
