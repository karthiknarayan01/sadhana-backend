id: bhaktisamvardhanashatakam
category: shataka
name:
  english: bhaktisamvardhanashatakam
  devanagari: भक्तिसंवर्धनशतकम्
content:
  english: yukadamshaprabhritibhirapi pratyaham badhyamanah | atmotsrishtairavishahashakrinmutrapankaishca
    liptah sakrando'ham tava muraripo balakah palaniyah || 10|| dantotpatteh prathamamamridu prayamaharajatam
    bhoktum vacchannanipunataya duyamano nikamam | yavat krandamyahamatitaram dinadinah kshudhartah tavaddeva
    prasaratu mayi kshipramekah katakshah || 11|| uttishthasuh kathamapi samutthapito balavargaih mandam
    mandam kimapi carananyasamakankshamanah | nalambhushnurjhatiti patitam nishthure bhumiprishthe yavanmuhyamyajita
    bhavata rakshaniyo'smi tavat || 12|| kridalaulyadgurubhirasakrit preritah kruravagbhih | vidyabhyase
    pracakitamana hanta shocami yavat | yavadduye dashanapatanaih karnavedhena caham tavat pitambara tava
    kripaloka evavalambah || 13|| sasnehabhyam paravashataya pushyamanah pitribhyam kridalaulyaprathitabahucapalyamullanghaya
    balyam | dvaitiyikam punaratha vayah prapnuvan driptacitto lakshmijane tava padayugam vismaran masma
    bhuvam || 14|| dharmacaram dinamanuparityajya vidhvastalajjah papanyapadayitumuditauddhatyamudyogashali
    | arthapatyapriyasutakalatradisaktashayo'ham garhabhyartah sadasi vidusham ma bhaveyam murare || 15||
    ashapashairnigalitamahantagrahagrahakritta svasthavasthaparicayamanushthananishthavihinam | driptam
    cittam mama kuru tamodhama kamabhitaptam ma ma magnam narakamathana strivishabdhau dayabdhe || 16||
    tyaktva dhairyam vyapagataparipakamuccairvipakam muktva hitva sapadi ca kripam vakpatutvam ca kritva
    | krodhodvrittam bhavati yadi me dhvastatattvaprabodham cittam cakrayudha tava padasthasnu kartavyameva
    || 17|| dehe mamsakshata jabharite rupavattabhimanat kancit kalam vapushi milito yauvanasyodayacca
    | aishvaryadapyahaha sahasa nashvararadvishvamurte cittam mattam pracalati yadi tvamrite ka gatirme
    || 18|| vidyavattvam dravinaguruta putramitradisaukhyam kasyapi syadyadi savayasah prayasho jayamanah
    | antah santapakridaviratam matsaro duhsahatma ma ma natha prasabhamabhavam prashra yasyapaneta ||
    19|| yasmin kasminnapi laghutare karyavastunyavastham kalam desham punaraganayan dravyajatam tyajami
    | yasmatkshobhat samucitamapasyami dharmam ca tasmat ceto dambhadviramatu mametyadya yace hare tvam
    || 20|| kancid ddashtva sapadi vipade bhartsaye tatsamaksham vegaddhavami ca pathi jale nishpatamyutpatami
    | kincahetormuhurapi hasamyuccakairyatprabhavat darpah so'yam na bhavatu mama tvatprasadanmukunda
    || 21|| maturvakyam piturapi nirakritya nityam guruna
  devanagari: यूकादंशप्रभृतिभिरपि प्रत्यहं बाध्यमानः । आत्मोत्सृष्टैरविषहशकृन्मूत्रपङ्कैश्च लिप्तः साक्रन्दोऽहं
    तव मुररिपो बालकः पालनीयः ॥ १०॥ दन्तोत्पत्तेः प्रथमममृदु प्रायमाहारजातं भोक्तुं वाच्छन्ननिपुणतया दूयमानो
    निकामम् । यावत् क्रन्दाम्यहमतितरां दीनदीनः क्षुधार्तः तावद्देव प्रसरतु मयि क्षिप्रमेकः कटाक्षः ॥ ११॥
    उत्तिष्ठासुः कथमपि समुत्थापितो बालवर्गैः मन्दं मन्दं किमपि चरणन्यासमाकाङ्क्षमाणः । नालम्भूष्णुर्झटिति
    पतितं निष्ठुरे भूमिपृष्ठे यावन्मुह्याम्यजित भवता रक्षणीयोऽस्मि तावत् ॥ १२॥ क्रीडालौल्याद्गुरुभिरसकृत्
    प्रेरितः क्रूरवाग्भिः । विद्याभ्यासे प्रचकितमना हन्त शोचामि यावत् । यावद्दूये दशनपतनैः कर्णवेधेन चाहं
    तावत् पीताम्बर तव कृपालोक एवावलम्बः ॥ १३॥ सस्नेहाभ्यां परवशतया पुष्यमाणः पितृभ्यां क्रीडालौल्यप्रथितबहुचापल्यमुल्लङ्घय
    बाल्यम् । द्वैतीयीकं पुनरथ वयः प्राप्नुवन् दृप्तचित्तो लक्ष्मीजाने तव पदयुगं विस्मरन् मास्म भूवम्
    ॥ १४॥ धर्माचारं दिनमनुपरित्यज्य विध्वस्तलज्जः पापान्यापादयितुमुदितौद्धत्यमुद्योगशाली । अर्थापत्यप्रियसुतकलत्रादिसक्ताशयोऽहं
    गर्हाभ्यर्तः सदसि विदुषां मा भवेयं मुरारे ॥ १५॥ आशापाशैर्निगलितमहन्ताग्रहग्राहकृत्त स्वस्थावस्थापरिचयमनुष्ठाननिष्ठाविहीनम्
    । दृप्तं चित्तं मम कुरु तमोधाम कामभितप्तं मा मा मग्नं नरकमथन स्त्रीविषाब्धौ दयाब्धे ॥ १६॥ त्यक्त्वा
    धैर्यं व्यपगतपरीपाकमुच्चैर्विपाकं मुक्त्वा हित्वा सपदि च कृपां वाक्पटुत्वं च कृत्वा । क्रोधोद्वृत्तं
    भवति यदि मे ध्वस्ततत्त्वप्रबोधं चित्तं चक्रायुध तव पदस्थास्नु कर्तव्यमेव ॥ १७॥ देहे मांसक्षत जभरिते
    रूपवत्ताभिमानात् कञ्चित् कालं वपुषि मिलितो यौवनस्योदयाच्च । ऐश्वर्यादप्यहह सहसा नश्वरराद्विश्वमूर्ते
    चित्तं मत्तं प्रचलति यदि त्वामृते का गतिर्मे ॥ १८॥ विद्यावत्त्वं द्रविणगुरुता पुत्रमित्रादिसौख्यं
    कस्यापि स्याद्यदि सवयसः प्रायशो जायमानः । अन्तः सन्तापकृदविरतं मत्सरो दुःसहात्मा मा मा नाथ प्रसभमभवं
    प्रश्र यस्यापनेता ॥ १९॥ यस्मिन् कस्मिन्नपि लघुतरे कार्यवस्तुन्यवस्थां कालं देशं पुनरगणयन् द्रव्यजातं
    त्यजामि । यस्मात्क्षोभात् समुचितमपास्यामि धर्मं च तस्मात् चेतो डम्भाद्विरमतु ममेत्यद्य याचे हरे त्वाम्
    ॥ २०॥ कञ्चिद् द्दष्ट्वा सपदि विपदे भर्त्सये तत्समक्षं वेगाद्धावामि च पथि जले निष्पताम्युत्पतामि ।
    किञ्चाहेतोर्मुहुरपि हसाम्युच्चकैर्यत्प्रभावात् दर्पः सोऽयं न भवतु मम त्वत्प्रसादान्मुकुन्द ॥ २१॥ मातुर्वाक्यं
    पितुरपि निराकृत्य नित्यं गुरूणा
