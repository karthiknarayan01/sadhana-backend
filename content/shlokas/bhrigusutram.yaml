id: bhrigusutram
category: sutra
name:
  english: bhrigusutram
  devanagari: भृगुसूत्रम्
content:
  english: ketuyute sarpashapat sutakshayah || 30|| shubhadrishte pariharah || 31|| lagnatshashthe guruphalam
    shatrukshayah jnativriddhih pautradidarshanam vranasharirah shubhayute rogabhavah || 32|| papayute
    papakshetre vatashaityadirogah || 33|| mandakshetre rahuyute maharogah || 34|| lagnatsaptame guruphalam
    vidya dhaneshah bahulabhapradah cintadhikah vidyavan pativratya bhaktiyuta kalatrah || 35|| bhavadhipe
    balahine rahuketushanikujayute papavikshanadvakalatrantaram || 36|| shubhayute uccasvakshetre ekadaravan
    kalatradvara bahuvittavan sukhi catustrimshadvarshe pratishthasiddhih || 37|| lagnadashtame guruphalam
    alpayuh nicakrityakari || 38|| papayute patitah || 39|| bhavadhipe shubhayute randhredirghayuh ||
    40|| balahine alpayuh || 41|| papayute saptadashavarshadupari vidhavasangamo bhavati || 42|| uccasvakshetre
    dirghayuh balahinah arogi yogapaurushah vidvan vedashastravicakshanah || 43|| lagnannavame guruphalam
    dharmikah || 44|| tapasvi sadhutarudhah dhanikah pancatrimshadyajnakarta pitrudirghayuh satkarmasiddhih
    anekapratishthavan bahujanapalakah || 45|| lagnaddashame guruphalam dharmika shubhakarmakari gitapathakah
    yogyatavan praudhakirtih bahujanapujyah || 46|| bhavadhipe balayute visheshakratusiddhih || 47|| papayute
    papakshetre karmavighnah || 48|| dushkritiyatra labhahinah || 49|| lagnadekadashe guruphalam vidvan
    dhanavan bahulabhavan dvatrimshadvarshe ashvarudhah || 50|| aneka pratishthasiddhih || 51|| shubhapapayute
    gajalabhah || 52|| bhagyavriddhih candrayute nikshepalabhah || 53|| lagnaddvadashe guruphalam nirdhanah
    pathitah alpaputrah ganitashastrajnah sambhogi || 54|| granthivrani ayogyah || 55|| shubhayute uccasvakshetre
    svargalokapraptih || 56|| papayute papalokapraptih || 57|| dharmamulena dhanavyayah brahmana stri
    sambhogi garbhini sangami || 58|| atha tanvadidvadasha bhavasthita bhriguphalamaha tatradau lagne
    bhriguphalam ganitashastrajnah || 1|| dirghayuh darapriyah vastralankarapriyah rupalavanyapriyah gunavan
    || 2|| stripriyah dhanividvan || 3|| shubhayute aneka bhushanavan || 4|| svarnakantidehah || 5|| papavikshitayute
    nicastagate coravancanavan || 6|| vatashleshmadirogavan || 7|| bhavadhipe rahuyute briha dvidvijo
    bhavati || 8|| vahane shubhayute gajantaishvaryavan || 9|| svakshetre maharajayogah || 10|| randhare
    shashthashthavyayadhipeshukre durbale stridvayam || 11|| cancalabhagyah || 12|| krurabuddhih || 13||
    lagnaddvitiye bhriguphalam dhanavan kutumbi subhojanah vinayavan || 14|| netre vilasadhanavan sumukhah
    || 15|| dyavan paropakari || 16|| dvatrimshadvarshe uttamastrilabhah || 17|| bhavadhipe durbalah duhsthane
    netravaiparityam bhavati || 18|| shashiyute nishandhah kutumbahino netrarogi dhananashakarah || 19||
    lagnattritiye bhriguphalam atilubdhah dakshinyavan bhratrivriddhih sankalpasiddhih pashcat sahodarabhavah
    || 20|| kramena bhratritatparah vittabhogaparah || 21|| bhavadhipe balayute uccasvakshetre bhratrivriddhih
    duhsthane papayute bhratrinashah || 22|| lagnaccaturthe bhriguphalam shobhanavan buddhiman bhratrisaukhyam
    sukhi kshamavan || 23|| trimshadvarshe ashvavahanapraptih || 24|| kshirasamriddhih bhavadhipe balayute
    ashvandolikakanakacaturangadivriddhih || 25|| tatrapapayute papakshetre arinicage balahine kshetravahanahinah
    || 26|| matrikleshavan || 27|| kalatrantarabhogi || 28|| lagnatpancame bhriguphalam buddhiman mantri
    senapatih || 29|| matamahi drishva yauvanadara putravan || 30|| rajasanmani mantri sujnah striprasannatavriddhih
    || 31|| tatrapapayute papakshetre arinicage buddhijadyayutah putrashah || 32|| tatrashubhayute buddhiman
    nitimatputrasiddhih vahanayogah || 33|| lagnashashthe bhriguphalam jnatiprajasiddhi shatrukshayah
    putrapautravan || 34|| apatravyayakari mayavadi rogavan aryaputravan || 35|| bhavadhipe balayute shatrujnatirddhih
    shatrupapayute nicasthe bhaveshendusthe shatrujnatinashah || 36|| lagnatsaptame bhriguphalam atikamukah
    mukhacumbakah || 37|| arthavan paradararatah vahanavan sakalakaryanipunah stridveshi satpradhana janabandhukalatrah
    || 38|| papayute shatrukshetre arinicage kalatranashah || 39|| vivahadvayam || 40|| bahupapayute anekakalatrantara
    praptih || 41|| putrahinah || 42|| shubhayute ucce svakshetre tule kalatradeshe bahuvittavan || 43||
    kalatramulena bahuprabalyayogah strigoshthih || 44|| lagnadashtame bhriguphalam sukhi caturthe varshe
    matrigandah || 45|| ardhayuh rogihitadaravan asantushtah || 46|| shubhakshetre purnayuh || 47|| tatra
    papayute alpayuh || 48|| lagnannavame bhriguphalam dharmikah tapasvi anushthanaparah || 49|| padebahuttamalakshanah
    dharmi bhogavriddhih sutadaravan || 50|| pitri dirghayuh || 51|| tatra papayute pitrarishtavan ||
    52|| papayute papakshetre arinicage dhanahanih || 53|| gurudaragah || 54|| shubhayute bhagyavriddhih
    || 55|| maharajayogah || 56|| vahanakameshayute mahabhagyavan ashvandolyadi vahanavan || 57|| vastralankarapriyah
    || 58|| lagnaddashame bhriguphalam bahupratapavan papayute karmavighnakarah gurubudhacandrayute anekavahanarohanavan
    || 59|| anekaritusiddhih || 60|| digantavishrutakirtih anekarajayogah bahubhagyavan vacalah || 61||
    lagnadekadashe bhriguphalam vidvan bahudhanavan bhumilabhavan dayavan shubhayute aneka vahanayogah
    || 62|| papayute papamuladdhanalabhah || 63|| shubhayute shubhamulat nicarkshe paparandhreshadi yoge
    labhahinah || 64|| lagnaddvadashe bhriguphalam bahuladaridryavan || 65|| papayute vishayalubdhaparah
    || 66|| shubhayuktashcet bahudhanavan || 67|| shayyakhatvangadisaukhyavan shubhalokapraptih papayute
    narakapraptih || 68|| atha tanvadidvadasha bhavasthita shaniphalamaha tatradau lagne shaniphalam vatapittadehah
    || 1|| ucce puragramadhipah dhanadhanya samriddhih || 2|| svarkshe pitridhanavan || 3|| vahaneshakarmeshakshetre
    bahubhagyam || 4|| maharajayogah || 5|| candramasa drishte bhikshuki vrittih || 6|| shubhadrishte
    nivrittah || 7|| lagnaddvitiye shaniphalam dravyabhavah daradvayam || 8|| papayute daravancanamathadhipah
    alpakshetravan netrarogi || 9|| lagnattritiye shaniphalam bhratrihanikarakah || 10|| adrishtah durvrittah
    || 11|| uccasvakshetre bhratrivriddhih || 12|| tatrapapayute bhratridveshi || 13|| lagnaccaturthe
    shaniphalam matrihanih dvimatrivan || 14|| saukhyahanih nirdhanah || 15|| uccasvakshetre na doshah
    || 16|| ashvadiandoladyavarohi || 17|| lagneshemande matridirghayuh || 18|| saukhyavan || 19|| randhreshayukte
    matrarishtam || 20|| sukhahanih || 21|| lagnatpancame shaniphalam putrahinah atidaridri durvrittah
    dattaputri || 22|| svakshetre striprajasiddhih || 23|| gurudrishte stridvayam || 24|| tatra prathama'putra
    dvitiya putravati || 25|| balayute mande stribhiryuktah || 26|| lagnatshashthe shaniphalam alpajnatih
    shatrukshayah || 27|| dhanadhanyasamriddhih kujayute deshantara sancari || 28|| alparajayogah || 29||
    bhangayogatkvacitsaukhyakvacidyogabhangah || 30|| randhreshe mande arishtam vatarogi shulavranadehi
    || 31|| lagnatsaptame shaniphalam shariradoshakarah krishakalatrah veshyasambhogavan atidukhih uccasvakshetragate
    anekastrisambhogi || 32|| ketuyute strisambhogi || 33|| kujayute shishnacumbanaparah || 34|| shukrayute
    bhagacumbanaparah || 35|| parastrisambhogi || 36|| lagnadashtame shaniphalam tripadayuh daridri shudrastriratah
    sevakah || 37|| uccasvakshetre dirghayuh || 38|| arinicage bhavadhipe alpayuh || 39|| kashtannabhogi
    || 40|| lagnannavame shaniphalam patitah jirnoddharakarah ekonacatvarimshadvarshe tatakagopuranirmanakartta
    || 41|| uccasvakshetre pitridirghayuh || 42|| papayute durbale pitrarishtavan || 43|| lagnaddashame
    shaniphalam pancavimshativarshe gangasnani atilubdhah pittashariri || 44|| papayute karmavighnakarah
    shubhayute karmasiddhih || 45|| lagnadekadashe shaniphalam bahudhani vighnakarah bhumilabhah rajapujakah
    || 46|| ucce svakshetre va vidvan || 47|| mahabhagyayogah bahudhani vahanayogah || 48|| lagnaddvadashe
    shaniphalam patitah vikalangah || 49|| papayute netracchedah || 50|| shubhayute sukhi sunetrah punyalokapraptih
    || 51|| papayute naraka praptih || 52|| apatravyayakari nirdhanah || 53|| atha tanvadidvadasha bhavasthita
    rahuketvoh phalamaha tatradau lagne rahuketvoh phalam mritaprasutih || 1|| meshavrishabhakarkarashisthe
    dyavan || 2|| bahubhogi || 3|| ashubhe drishte mukhalanchani || 4|| lagnaddvitiye rahuketvoh phalam
    nirdhanah dehavyadhih putrashokah shyamavarnah || 5|| papayute cubuke lanchanam || 6|| lagnattritiye
    rahuketvoh phalam tilanishpavamudrakodravasamriddhivan || 7|| shubhayute kanthalanchanam || 8|| lagnaccaturthe
    rahuketuphalam bahubhushanasamriddhih jayadvayam sevakah matrikleshah papayute nishcayena || 9|| shubhayutadrishte
    na doshah || 10|| lagnatpancame rahuketvoh phalam putrabhavah sarpashapat sutakshayah || 11|| naga
    pratishthaya putrapraptih || 12|| pavanavyadhih durmargi rajakopah dushtagramavasi || 13|| lagnatshashthe
    rahuketvoh phalam dhiravan atisukhi || 14|| induyute rajastribhogi || 15|| nirdhanah corah || 16||
    lagnatsaptame rahuketvoh phalam daradvayam tanmadhye prathamastrinashah dvitiye kalatre gulmavyadhih
    || 17|| papayute gandotpattih || 18|| shubhayute gandanivrittih || 19|| niyamena daradvayam || 20||
    shubhayute ekameva || 21|| lagnadashtame rahuketvoh phalam atirogi dvatrimshadvarshayushmana || 22||
    shubhayute pancacatvarimshadvarshe bhavadhipe balayute svocce shashtivarshaniva jivitam || 23|| lagnannavame
    rahuketvoh phalam putrahinah shudrastrisambhogi sevakah dharmahinah || 24|| lagnaddashame rahuketvoh
    phalam vitantusangamah || 25|| durgramavasah || 26|| shubhayute na doshah || 27|| kavyavyasanah ||
    28|| lagnadekadashe rahuketvoh phalam putraih samridhdah || 29|| dhanadhanya samridhdah || 30|| lagnaddvadashe
    rahuketvoh phalam alpaputrah || 31|| netrarogi papagatih || 32|| iti bhrigusutrani samapta |
  devanagari: केतुयुते सर्पशापात् सुतक्षयः ॥ ३०॥ शुभदृष्टे परिहारः ॥ ३१॥ लग्नात्षष्ठे गुरुफलं शत्रुक्षयः
    ज्ञातिवृद्धिः पौत्रादिदर्शनं व्रणशरीरः शुभयुते रोगाभावः ॥ ३२॥ पापयुते पापक्षेत्रे वातशैत्यादिरोगः
    ॥ ३३॥ मन्दक्षेत्रे राहुयुते महारोगः ॥ ३४॥ लग्नात्सप्तमे गुरुफलं विद्या धनेशः बहुलाभप्रदः चिन्ताधिकः
    विद्यवान् पातिव्रत्य भक्तियुत कलत्रः ॥ ३५॥ भावाधिपे बलहीने राहुकेतुशनिकुजयुते पापवीक्षणाद्वाकलत्रान्तरम्
    ॥ ३६॥ शुभयुते उच्चस्वक्षेत्रे एकदारवान् कलत्रद्वारा बहुवित्तवान् सुखी चतुस्त्रिम्शद्वर्षे प्रतिष्ठासिद्धिः
    ॥ ३७॥ लग्नादष्टमे गुरुफलं अल्पायुः नीचकृत्यकारी ॥ ३८॥ पापयुते पतितः ॥ ३९॥ भावाधिपे शुभयुते रन्ध्रेदीर्घायुः
    ॥ ४०॥ बलहीने अल्पायुः ॥ ४१॥ पापयुते सप्तदशवर्षादुपरि विधवासङ्गमो भवति ॥ ४२॥ उच्चस्वक्षेत्रे दीर्घायुः
    बलहीनः अरोगी योगपौरुषः विद्वान् वेदशास्त्रविचक्षणः ॥ ४३॥ लग्नान्नवमे गुरुफलं धार्मिकः ॥ ४४॥ तपस्वी
    साधुतारूढः धनिकः पञ्चत्रिंशद्यज्ञकर्ता पित्रुदीर्घायुः सत्कर्मसिद्धिः अनेकप्रतिष्ठावान् बहुजनपालकः
    ॥ ४५॥ लग्नाद्दशमे गुरुफलं धार्मिक शुभकर्मकारी गीतापाठकः योग्यतावान् प्रौढकीर्तिः बहुजनपूज्यः ॥ ४६॥
    भावाधिपे बलयुते विशेषक्रतुसिद्धिः ॥ ४७॥ पापयुते पापक्षेत्रे कर्मविघ्नः ॥ ४८॥ दुष्कृतियात्रा लाभहीनः
    ॥ ४९॥ लग्नादेकादशे गुरुफलं विद्वान् धनवान् बहुलाभवान् द्वात्रिंशद्वर्षे अश्वारूढः ॥ ५०॥ अनेक प्रतिष्ठासिद्धिः
    ॥ ५१॥ शुभपापयुते गजलाभः ॥ ५२॥ भाग्यवृद्धिः चन्द्रयुते निक्षेपलाभः ॥ ५३॥ लग्नाद्द्वादशे गुरुफलं निर्धनः
    पठितः अल्पपुत्रः गणितशास्त्रज्ञः सम्भोगी ॥ ५४॥ ग्रन्थिव्रणी अयोग्यः ॥ ५५॥ शुभयुते उच्चस्वक्षेत्रे
    स्वर्गलोकप्राप्तिः ॥ ५६॥ पापयुते पापलोकप्राप्तिः ॥ ५७॥ धर्ममूलेन धनव्ययः ब्राह्मण स्त्री सम्भोगी गर्भिणी
    सङ्गमी ॥ ५८॥ अथ तन्वादिद्वादश भावस्थित भृगुफलमाह तत्रादौ लग्ने भृगुफलं गणितशास्त्रज्ञः ॥ १॥ दीर्घायुः
    दारप्रियः वस्त्रालङ्कारप्रियः रूपलावण्यप्रियः गुणवान् ॥ २॥ स्त्रीप्रियः धनीविद्वान् ॥ ३॥ शुभयुते अनेक
    भूषणवान् ॥ ४॥ स्वर्णकान्तिदेहः ॥ ५॥ पापवीक्षितयुते नीचास्तगते चोरवञ्चनवान् ॥ ६॥ वातश्लेष्मादिरोगवान्
    ॥ ७॥ भावाधिपे राहुयुते बृह द्विद्विजो भवति ॥ ८॥ वाहने शुभयुते गजान्तैश्वर्यवान् ॥ ९॥ स्वक्षेत्रे महाराजयोगः
    ॥ १०॥ रन्धरे षष्ठाष्ठव्ययाधिपेशुक्रे दुर्बले स्त्रीद्वयम् ॥ ११॥ चञ्चलभाग्यः ॥ १२॥ क्रूरबुद्धिः ॥ १३॥
    लग्नाद्द्वितीये भृगुफलं धनवान् कुटुम्बी सुभोजनः विनयवान् ॥ १४॥ नेत्रे विलासधनवान् सुमुखः ॥ १५॥ द्यावान्
    परोपकारी ॥ १६॥ द्वत्रिंषद्वर्षे उत्तमस्त्रीलाभः ॥ १७॥ भावाधिपे दुर्बलः दुःस्थाने नेत्रवैपरीत्यं भवति
    ॥ १८॥ शशियुते निशान्धः कुटुम्बहीनो नेत्ररोगी धननाशकरः ॥ १९॥ लग्नात्तृतीये भृगुफलं अतिलुब्धः दाक्षिण्यवान्
    भ्रातृवृद्धिः सङ्कल्पसिद्धिः पश्चात् सहोदराभावः ॥ २०॥ क्रमेण भ्रातृतत्परः वित्तभोगपरः ॥ २१॥ भावाधिपे
    बलयुते उच्चस्वक्षेत्रे भ्रातृवृद्धिः दुःस्थाने पापयुते भ्रातृनाशः ॥ २२॥ लग्नाच्चतुर्थे भृगुफलं शोभनवान्
    बुद्धिमान् भ्रातृसौख्यं सुखी क्षमावान् ॥ २३॥ त्रिंशद्वर्षे अश्ववाहनप्राप्तिः ॥ २४॥ क्षीरसमृद्धिः भावाधिपे
    बलयुते अश्वान्दोलिकाकनकचतुरङ्गादिवृद्धिः ॥ २५॥ तत्रपापयुते पापक्षेत्रे अरिनीचगे बलहीने क्षेत्रवाहनहीनः
    ॥ २६॥ मातृक्लेशवान् ॥ २७॥ कलत्रान्तरभोगी ॥ २८॥ लग्नात्पञ्चमे भृगुफलं बुद्धिमान् मन्त्री सेनापतिः ॥
    २९॥ मातामही दृश्वा यौवनदार पुत्रवान् ॥ ३०॥ राजसन्मानी मन्त्री सुज्ञः स्त्रीप्रसन्नतावृद्धिः ॥ ३१॥
    तत्रपापयुते पापक्षेत्रे अरिनीचगे बुद्धिजाड्ययुतः पुत्राशः ॥ ३२॥ तत्रशुभयुते बुद्धिमान् नीतिमत्पुत्रसिद्धिः
    वाहनयोगः ॥ ३३॥ लग्नाषष्ठे भृगुफलं ज्ञातिप्रजासिद्धि शत्रुक्षयः पुत्रपौत्रवान् ॥ ३४॥ अपात्रव्ययकारी
    मायावादी रोगवान् आर्यपुत्रवान् ॥ ३५॥ भावाधिपे बलयुते शत्रुज्ञातिर्द्धिः शत्रुपापयुते नीचस्थे भावेशेन्दुस्थे
    शत्रुज्ञातिनाशः ॥ ३६॥ लग्नात्सप्तमे भृगुफलं अतिकामुकः मुखचुम्बकः ॥ ३७॥ अर्थवान् परदाररतः वाहनवान्
    सकलकार्यनिपुणः स्त्रीद्वेषी सत्प्रधान जनबन्धुकलत्रः ॥ ३८॥ पापयुते शत्रुक्षेत्रे अरिनीचगे कलत्रनाशः
    ॥ ३९॥ विवाहद्वयम् ॥ ४०॥ बहुपापयुते अनेककलत्रान्तर प्राप्तिः ॥ ४१॥ पुत्रहीनः ॥ ४२॥ शुभयुते उच्चे स्वक्षेत्रे
    तुले कलत्रदेशे बहुवित्तवान् ॥ ४३॥ कलत्रमूलेन बहुप्राबल्ययोगः स्त्रीगोष्ठिः ॥ ४४॥ लग्नादष्टमे भृगुफलं
    सुखी चतुर्थे वर्षे मातृगण्डः ॥ ४५॥ अर्धायुः रोगीहितदारवान् असन्तुष्टः ॥ ४६॥ शुभक्षेत्रे पुर्णायुः
    ॥ ४७॥ तत्र पापयुते अल्पायुः ॥ ४८॥ लग्नान्नवमे भृगुफलं धार्मिकः तपस्वी अनुष्ठानपरः ॥ ४९॥ पादेबहूत्तमलक्षणः
    धर्मी भोगवृद्धिः सुतदारवान् ॥ ५०॥ पितृ दीर्घायुः ॥ ५१॥ तत्र पापयुते पित्ररिष्टवान् ॥ ५२॥ पापयुते पापक्षेत्रे
    अरिनीचगे धनहानिः ॥ ५३॥ गुरुदारगः ॥ ५४॥ शुभयुते भाग्यवृद्धिः ॥ ५५॥ महाराजयोगः ॥ ५६॥ वाहनकामेशयुते महाभाग्यवान्
    अश्वान्दोल्यादि वाहनवान् ॥ ५७॥ वस्त्रालङ्कारप्रियः ॥ ५८॥ लग्नाद्दशमे भृगुफलं बहुप्रतापवान् पापयुते
    कर्मविघ्नकरः गुरुबुधचन्द्रयुते अनेकवाहनारोहणवान् ॥ ५९॥ अनेकऋतुसिद्धिः ॥ ६०॥ दिगन्तविश्रुतकीर्तिः अनेकराजयोगः
    बहुभाग्यवान् वाचालः ॥ ६१॥ लग्नादेकादशे भृगुफलं विद्वान् बहुधनवान् भूमिलाभवान् दयावान् शुभयुते अनेक
    वाहनयोगः ॥ ६२॥ पापयुते पापमूलाद्धनलाभः ॥ ६३॥ शुभयुते शुभमुलात् नीचर्क्षे पापरन्ध्रेशादि योगे लाभहीनः
    ॥ ६४॥ लग्नाद्द्वादशे भृगुफलं बहुलदारिद्र्यवान् ॥ ६५॥ पापयुते विषयलुब्धपरः ॥ ६६॥ शुभयुक्तश्चेत् बहुधनवान्
    ॥ ६७॥ शय्याखट्वाङ्गादिसौख्यवान् शुभलोकप्राप्तिः पापयुते नरकप्राप्तिः ॥ ६८॥ अथ तन्वादिद्वादश भावस्थित
    शनिफलमाह तत्रादौ लग्ने शनिफलं वातपित्तदेहः ॥ १॥ उच्चे पुरग्रामाधिपः धनधान्य समृद्धिः ॥ २॥ स्वर्क्षे
    पितृधनवान् ॥ ३॥ वाहनेशकर्मेशक्षेत्रे बहुभाग्यम् ॥ ४॥ महाराजयोगः ॥ ५॥ चन्द्रमसा दृष्टे भिक्षुकी वृत्तिः
    ॥ ६॥ शुभदृष्टे निवृत्तः ॥ ७॥ लग्नाद्द्वितीये शनिफलं द्रव्याभावः दारद्वयम् ॥ ८॥ पापयुते दारवञ्चनामठाधिपः
    अल्पक्षेत्रवान् नेत्ररोगी ॥ ९॥ लग्नात्तृतीये शनिफलं भ्रातृहानिकारकः ॥ १०॥ अदृष्टः दुर्वृत्तः ॥ ११॥
    उच्चस्वक्षेत्रे भ्रातृवृद्धिः ॥ १२॥ तत्रपापयुते भ्रातृद्वेषी ॥ १३॥ लग्नाच्चतुर्थे शनिफलं मातृहानिः
    द्विमातृवान् ॥ १४॥ सौख्यहानिः निर्धनः ॥ १५॥ उच्चस्वक्षेत्रे न दोषः ॥ १६॥ अश्वादिआन्दोलाद्यवरोही ॥
    १७॥ लग्नेशेमन्दे मातृदीर्घयुः ॥ १८॥ सौख्यवान् ॥ १९॥ रन्ध्रेशयुक्ते मात्ररिष्टम् ॥ २०॥ सुखहानिः ॥ २१॥
    लग्नात्पञ्चमे शनिफलं पुत्रहीनः अतिदरिद्री दुर्वृत्तः दत्तपुत्री ॥ २२॥ स्वक्षेत्रे स्त्रीप्रजासिद्धिः
    ॥ २३॥ गुरुदृष्टे स्त्रीद्वयम् ॥ २४॥ तत्र प्रथमाऽपुत्रा द्वितीया पुत्रवती ॥ २५॥ बलयुते मन्दे स्त्रीभिर्युक्तः
    ॥ २६॥ लग्नात्षष्ठे शनिफलं अल्पज्ञातिः शत्रुक्षयः ॥ २७॥ धनधान्यसमृद्धिः कुजयुते देशान्तर सञ्चारी ॥
    २८॥ अल्पराजयोगः ॥ २९॥ भङ्गयोगात्क्वचित्सौख्यक्वचिद्योगभङ्गः ॥ ३०॥ रन्ध्रेशे मन्दे अरिष्टं वातरोगी
    शूलव्रणदेही ॥ ३१॥ लग्नात्सप्तमे शनिफलं शरीरदोषकरः कृशकलत्रः वेश्यासम्भोगवान् अतिदुखीः उच्चस्वक्षेत्रगते
    अनेकस्त्रीसम्भोगी ॥ ३२॥ केतुयुते स्त्रीसम्भोगी ॥ ३३॥ कुजयुते शिश्नचुम्बनपरः ॥ ३४॥ शुक्रयुते भगचुम्बनपरः
    ॥ ३५॥ परस्त्रीसम्भोगी ॥ ३६॥ लग्नादष्टमे शनिफलं त्रिपादायुः दरिद्री शूद्रस्त्रीरतः सेवकः ॥ ३७॥ उच्चस्वक्षेत्रे
    दीर्घायुः ॥ ३८॥ अरिनीचगे भावाधिपे अल्पायुः ॥ ३९॥ कष्टान्नभोगी ॥ ४०॥ लग्नान्नवमे शनिफलं पतितः जीर्णोद्धारकरः
    एकोनचत्वारिंशद्वर्षे तटाकगोपुरनिर्माणकर्त्ता ॥ ४१॥ उच्चस्वक्षेत्रे पितृदीर्घायुः ॥ ४२॥ पापयुते दुर्बले
    पित्ररिष्टवान् ॥ ४३॥ लग्नाद्दशमे शनिफलं पञ्चविंशतिवर्षे गङ्गास्नानी अतिलुब्धः पित्तशरीरी ॥ ४४॥ पापयुते
    कर्मविघ्नकरः शुभयुते कर्मसिद्धिः ॥ ४५॥ लग्नादेकादशे शनिफलं बहुधनी विघ्नकरः भूमिलाभः राजपूजकः ॥ ४६॥
    उच्चे स्वक्षेत्रे वा विद्वान् ॥ ४७॥ महाभाग्ययोगः बहुधनी वाहनयोगः ॥ ४८॥ लग्नाद्द्वादशे शनिफलं पतितः
    विकलाङ्गः ॥ ४९॥ पापयुते नेत्रच्छेदः ॥ ५०॥ शुभयुते सुखी सुनेत्रः पुण्यलोकप्राप्तिः ॥ ५१॥ पापयुते नरक
    प्राप्तिः ॥ ५२॥ अपात्रव्ययकारी निर्धनः ॥ ५३॥ अथ तन्वादिद्वादश भावस्थित राहुकेत्वोः फलमाह तत्रादौ लग्ने
    राहुकेत्वोः फलं मृतप्रसूतिः ॥ १॥ मेषवृषभकर्कराशिस्थे द्यावान् ॥ २॥ बहुभोगी ॥ ३॥ अशुभे दृष्टे मुखलाञ्छनी
    ॥ ४॥ लग्नाद्द्वितीये राहुकेत्वोः फलं निर्धनः देहव्याधिः पुत्रशोकः श्यामवर्णः ॥ ५॥ पापयुते चुबुके लाञ्छनम्
    ॥ ६॥ लग्नात्तृतीये राहुकेत्वोः फलं तिलनिष्पावमुद्रकोद्रवसमृद्धिवान् ॥ ७॥ शुभयुते कण्ठलाञ्छनम् ॥ ८॥
    लग्नाच्चतुर्थे राहुकेतुफलं बहुभूषणसमृद्धिः जायाद्वयं सेवकः मातृक्लेशः पापयुते निश्चयेन ॥ ९॥ शुभयुतदृष्टे
    न दोषः ॥ १०॥ लग्नात्पञ्चमे राहुकेत्वोः फलं पुत्राभावः सर्पशापात् सुतक्षयः ॥ ११॥ नाग प्रतिष्ठया पुत्रप्राप्तिः
    ॥ १२॥ पवनव्याधिः दुर्मार्गी राजकोपः दुष्टग्रामवासी ॥ १३॥ लग्नात्षष्ठे राहुकेत्वोः फलं धीरवान् अतिसुखी
    ॥ १४॥ इन्दुयुते राजस्त्रीभोगी ॥ १५॥ निर्धनः चोरः ॥ १६॥ लग्नात्सप्तमे राहुकेत्वोः फलं दारद्वयं तन्मध्ये
    प्रथमस्त्रीनाशः द्वितिये कलत्रे गुल्मव्याधिः ॥ १७॥ पापयुते गण्डोत्पत्तिः ॥ १८॥ शुभयुते गण्डनिवृत्तिः
    ॥ १९॥ नियमेन दारद्वयम् ॥ २०॥ शुभयुते एकमेव ॥ २१॥ लग्नादष्टमे राहुकेत्वोः फलं अतिरोगी द्वत्रिंशद्वर्षायुष्मान
    ॥ २२॥ शुभयुते पञ्चचत्वारिंशद्वर्षे भावाधिपे बलयुते स्वोच्चे षष्टिवर्षाणिवा जीवितम् ॥ २३॥ लग्नान्नवमे
    राहुकेत्वोः फलं पुत्रहीनः शूद्रस्त्रीसम्भोगी सेवकः धर्महीनः ॥ २४॥ लग्नाद्दशमे राहुकेत्वोः फलं वितन्तुसङ्गमः
    ॥ २५॥ दुर्ग्रामवासः ॥ २६॥ शुभयुते न दोषः ॥ २७॥ काव्यव्यसनः ॥ २८॥ लग्नादेकादशे राहुकेत्वोः फलं पुत्रैः
    समृध्दः ॥ २९॥ धनधान्य समृध्दः ॥ ३०॥ लग्नाद्द्वादशे राहुकेत्वोः फलं अल्पपुत्रः ॥ ३१॥ नेत्ररोगी पापगतिः
    ॥ ३२॥ इति भृगुसूत्राणि समाप्ता ।
