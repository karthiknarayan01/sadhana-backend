id: mahamrityunjayamalamantrah-2
category: mantra
name:
  english: mahamrityunjayamalamantrah
  devanagari: महामृत्युन्जयमालामन्त्रः
content:
  english: om namo bhagavate mahamrityunjayeshvaraya amriteshvaraya akhilalokapalakaya atmanathaya sarvasankata
    nivaranaya parvatiparameshvaraya | om ham haum nam mam shim vam yam haum ham | om shlim pam shum hum
    jum sah jum sah jum palaya palaya | mahamrityunjayeshvaraya ham ham haum jum sah jum sah jum mrityunjayamurtaye
    atmanam raksha raksha sarvagrahan nivaraya nivaraya | mahamrityunjayamurtaye sarvasankatam nivaraya
    nivaraya sarvarogarishtam nivaraya nivaraya | mahamrityubhayam nivaraya nivaraya | mahamrityunjayamurtaye
    sarvasankatam nivaraya nivaraya sakaladushtagrahaganopadravam nivaraya nivaraya | ashta maharogam
    nivaraya nivaraya | sarvarogopadravam nivaraya nivaraya | haim ham ham jum sah jum sah jum mahamrityunjaya
    murtaye arogadridhagatra dirghayushyam kuru kuru | daraputrapautra sabandhava janan raksha raksha
  devanagari: ॐ नमो भगवते महामृत्युञ्जयेश्वराय अमृतेश्वराय अखिललोकपालकाय आत्मनाथाय सर्वसङ्कट निवारणाय
    पार्वतीपरमेश्वराय । ॐ हां हौं नं मं शिं वं यं हौं हाम् । ॐ श्लीं पं शुं हुं जुं सः जुं सः जुं पालय
    पालय । महामृत्युञ्जयेश्वराय हं हां हौं जुं सः जुं सः जुं मृत्युञ्जयमूर्तये आत्मानं रक्ष रक्ष सर्वग्रहान्
    निवारय निवारय । महामृत्युञ्जयमूर्तये सर्वसङ्कटं निवारय निवारय सर्वरोगारिष्टं निवारय निवारय । महामृत्युभयं
    निवारय निवारय । महामृत्युञ्जयमूर्तये सर्वसङ्कटं निवारय निवारय सकलदुष्टग्रहगणोपद्रवं निवारय निवारय
    । अष्ट महारोगं निवारय निवारय । सर्वरोगोपद्रवं निवारय निवारय । हैं हां हं जुं सः जुं सः जुं महामृत्युञ्जय
    मूर्तये अरोगदृढगात्र दीर्घायुष्यं कुरु कुरु । दारापुत्रपौत्र सबान्धव जनान् रक्ष रक्ष
