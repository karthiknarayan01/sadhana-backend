id: namavali-105
category: sahasranama
name:
  english: namavali
  devanagari: नामावली
content:
  english: svarupinyai namah | om shatodaryai namah | om shubhalokayai namah | om shucaye namah | 890
    om shucijanapriyayai namah | om shuddhipriyayai namah | om shuddhidatryai namah | om shulinyai namah
    | om shauryashalinyai namah | om shankhinyai namah | om shakinyai namah | om shokamoha
  devanagari: स्वरूपिण्यै नमः । ॐ शातोदर्यै नमः । ॐ शुभालोकायै नमः । ॐ शुचये नमः । ८९० ॐ शुचिजनप्रियायै
    नमः । ॐ शुद्धिप्रियायै नमः । ॐ शुद्धिदात्र्यै नमः । ॐ शूलिन्यै नमः । ॐ शौर्यशालिन्यै नमः । ॐ शङ्खिन्यै
    नमः । ॐ शाकिन्यै नमः । ॐ शोकमोह
