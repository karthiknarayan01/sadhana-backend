id: rishibhihkritam3vishnustotram
category: stotram
name:
  english: rishibhihkritam3vishnustotram
  devanagari: ऋषिभिःकृतं३विष्णुस्तोत्रम्
content:
  english: rartharthibhih svashirasa dhritapadarenuh | dhanyarpitanghritulasi navadamadhamno lokam madhuvratapateriva
    kamayana || 20|| yastam viviktacaritairanuvartamanam natyadriyatparamabhagavataprasangah | sa tvam
    dvijanupathapunyarajahpunitah shrivatsalakshma kimaga bhagabhajanastvam || 21|| dharmasya te bhagavatastriyuga
    tribhih svaih padbhishcaracaramidam dvijadevatartham | nunam bhritam tadabhighati rajastamashca sattvena
    no varadaya tanuva nirasya || 22|| iti shrimadbhagavatamahapurane tritiyaskandhe shodashadhyayantargatam
    rishibhih kritam vishnustotram samaptam | bhagavatapurana | adhyaya 3
  devanagari: रर्थार्थिभिः स्वशिरसा धृतपादरेणुः । धन्यार्पिताङ्घ्रितुलसी नवदामधाम्नो लोकं मधुव्रतपतेरिव
    कामयाना ॥ २०॥ यस्तां विविक्तचरितैरनुवर्तमानां नात्याद्रियत्परमभागवतप्रसङ्गः । स त्वं द्विजानुपथपुण्यरजःपुनीतः
    श्रीवत्सलक्ष्म किमगा भगभाजनस्त्वम् ॥ २१॥ धर्मस्य ते भगवतस्त्रियुग त्रिभिः स्वैः पद्भिश्चराचरमिदं द्विजदेवतार्थम्
    । नूनं भृतं तदभिघाति रजस्तमश्च सत्त्वेन नो वरदया तनुवा निरस्य ॥ २२॥ इति श्रीमद्भागवतमहापुराणे तृतीयस्कन्धे
    षोडशाध्यायान्तर्गतं ऋषिभिः कृतं विष्णुस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ३
meaning: {}
