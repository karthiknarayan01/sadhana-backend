id: narayana-stotram
category: stotram
name:
  english: Narayana Stotram
content:
  english: narayana narayana jaya govinda hare || narayana narayana jaya gopala hare || karunaparavara
    varunalayagambhira narayana || || ghananiradasankasha kritakalikalmashanashana narayana || || narayana
    narayana jaya govinda hare yamunatiravihara dhritakaustubhamanihara narayana || || pitambaraparidhana
    surakalyananidhana narayana || || narayana narayana jaya govinda hare manjulagunjabhusha mayamanushavesha
    narayana || || radhadharamadhurasika rajanikarakulatilaka narayana || || narayana narayana jaya govinda
    hare muraliganavinoda vedastutabhupada narayana || || varijabhushabharana rajivarukminiramana narayana
    || barhinibarhapida natanatakaphanikrida narayana narayana narayana jaya govinda hare jalaruhadalanibhanetra
    jagadarambhakasutra narayana || || patakarajanisamhara karunalaya mamuddhara narayana || || narayana
    narayana jaya govinda hare agha bakahayakamsare keshava krishna murare narayana || || hatakanibhapitambara
    abhayam kuru me mavara narayana || || narayana narayana jaya govinda hare dasharatharajakumara danavamadasamhara
    narayana || || govardhanagiri ramana gopimanasaharana narayana || || narayana narayana jaya govinda
    hare || vishvamitramakhatra vividhavaranucaritra narayana || || narayana narayana jaya govinda hare
    dhvajavajrankushapada dharanisutasahamoda narayana || || janakasutapratipala jaya jaya samsmritilila
    narayana || || narayana narayana jaya govinda hare dasharathavagdhritibhara dandaka vanasancara narayana
    || || mushtikacanurasamhara munimanasavihara narayana || || narayana narayana jaya govinda hare valivinigrahashaurya
    varasugrivahitarya narayana || || mam muralikara dhivara palaya palaya shridhara narayana || || narayana
    narayana jaya govinda hare jalanidhi bandhana dhira ravanakanthavidara narayana || || tatakamardana
    rama natagunavividha surama narayana || || narayana narayana jaya govinda hare gautamapatnipujana
    karunaghanavalokana narayana || || sambhramasitahara saketapuravihara narayana || || narayana narayana
    jaya govinda hare acaloddhritacancatkara bhaktanugrahatatpara narayana || || naigamaganavinoda rakshita
    suprahlada narayana || bharata yatavarashankara namamritamakhilantara narayana narayana narayana jaya
    govinda hare narayana || narayana narayana jaya gopala hare narayana narayana narayana || iti shrimacchankaracarya
    viracitam narayana stotram sampurnam ||
  devanagari: नारायण नारायण जय गोविन्द हरे ॥ नारायण नारायण जय गोपाल हरे ॥ करुणापारावार वरुणालयगम्भीर नारायण
    ॥ ॥ घननीरदसङ्काश कृतकलिकल्मषनाशन नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे यमुनातीरविहार धृतकौस्तुभमणिहार
    नारायण ॥ ॥ पीताम्बरपरिधान सुरकल्याणनिधान नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे मञ्जुलगुञ्जाभूष मायामानुषवेष
    नारायण ॥ ॥ राधाधरमधुरसिक रजनीकरकुलतिलक नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे मुरलीगानविनोद वेदस्तुतभूपाद
    नारायण ॥ ॥ वारिजभूषाभरण राजीवरुक्मिणीरमण नारायण ॥ बर्हिनिबर्हापीड नटनाटकफणिक्रीड नारायण नारायण नारायण
    जय गोविन्द हरे जलरुहदलनिभनेत्र जगदारम्भकसूत्र नारायण ॥ ॥ पातकरजनीसंहार करुणालय मामुद्धर नारायण ॥ ॥
    नारायण नारायण जय गोविन्द हरे अघ बकहयकंसारे केशव कृष्ण मुरारे नारायण ॥ ॥ हाटकनिभपीताम्बर अभयं कुरु
    मे मावर नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे दशरथराजकुमार दानवमदसंहार नारायण ॥ ॥ गोवर्धनगिरि रमण
    गोपीमानसहरण नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे ॥ विश्वामित्रमखत्र विविधवरानुचरित्र नारायण ॥ ॥
    नारायण नारायण जय गोविन्द हरे ध्वजवज्राङ्कुशपाद धरणीसुतसहमोद नारायण ॥ ॥ जनकसुताप्रतिपाल जय जय संस्मृतिलील
    नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे दशरथवाग्धृतिभार दण्डक वनसञ्चार नारायण ॥ ॥ मुष्टिकचाणूरसंहार
    मुनिमानसविहार नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे वालिविनिग्रहशौर्य वरसुग्रीवहितार्य नारायण ॥
    ॥ मां मुरलीकर धीवर पालय पालय श्रीधर नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे जलनिधि बन्धन धीर रावणकण्ठविदार
    नारायण ॥ ॥ ताटकमर्दन राम नटगुणविविध सुराम नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे गौतमपत्नीपूजन करुणाघनावलोकन
    नारायण ॥ ॥ सम्भ्रमसीताहार साकेतपुरविहार नारायण ॥ ॥ नारायण नारायण जय गोविन्द हरे अचलोद्धृतचञ्चत्कर
    भक्तानुग्रहतत्पर नारायण ॥ ॥ नैगमगानविनोद रक्षित सुप्रह्लाद नारायण ॥ भारत यतवरशङ्कर नामामृतमखिलान्तर
    नारायण नारायण नारायण जय गोविन्द हरे नारायण ॥ नारायण नारायण जय गोपाल हरे नारायण नारायण नारायण ॥ इति
    श्रिमच्छङ्कराचार्य विरचितं नारायण स्तोत्रं सम्पूर्णम् ॥
