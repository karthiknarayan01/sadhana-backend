id: purnabrahmastotramgitam
category: stotram
name:
  english: purnabrahmastotramgitam
  devanagari: पूर्णब्रह्मस्तोत्रम्गीतम्
content:
  english: purnabrahmastotram purnacandramukham nilendurupam udbhashitam devam divyamsvarupam purnam tvam
    svarnam tvam varnam tvam devam pita mata bandhu tvameva sarvam jagannatha svami bhaktabhavapremi namamyaham
    jagannatha svami bhaktabhavapremi namamyaham || 1|| kuncitakesham ca sancitavesham vartulasthulanayanam
    mamesham pinakaninika nayanakosham jagannatha svami bhaktabhavapremi namamyaham jagannatha svami bhaktabhavapremi
    namamyaham || 2|| nilacale cancalaya sahitam nandanandanam tvam indrasya indram jagannathasvami bhaktabhavapremi
    namamyaham jagannatha svami bhaktabhavapremi namamyaham || 3|| srishti sthiti pralaya sarvamuḻam sukshmatisukshmam
    tvam sthulatisthulam kantimayanantam antimaprantam prashantakuntaḻam te murttimantam jagannatha svami
    bhaktabhavapremi namamyaham jagannatha svami bhaktabhavapremi namamyaham || 4|| yajna tapa veda jnanat
    atitam bhavapremachande sadavashitvam shuddhat shuddham tvam ca purnat purnam krishnameghatulyam amulyavarnam
    jagannatha svami bhaktabhavapremi namamyaham jagannatha svami bhaktabhavapremi namamyaham || 5|| vishvaprakasham
    sarvakleshanasham mana buddhi prana shvasaprashvasam matsya kurma nrisimha vamanah tvam varaha rama
    ananta astitvam jagannatha svami bhaktabhavapremi namamyaham jagannatha svami bhaktabhavapremi namamyaham
    || 6|| dhruvasya vishnuh tvam bhaktasya pranam radhapati deva he arttatranam sarva jnana saram loka
    adharam bhavasancaram abhavasamharam jagannatha svami bhaktabhavapremi namamyaham jagannatha svami
    bhaktabhavapremi namamyaham || 7|| baladeva subhadra parshve sthitam sudarshana sange nitya shobhitam
    namami namami sarvange devam he purnabrahma hari mama sarvam jagannatha svami bhaktabhavapremi namamyaham
    jagannatha svami bhaktabhavapremi namamyaham || 8|| krishnadasahridi bhava sancaram sada kuru svami
    tava kinkaram tava kripa vindu hi eka saram anyatha he natha sarva asaram jagannatha svami bhaktabhavapremi
    namamyaham jagannatha svami bhaktabhavapremi namamyaham || 9|| || iti shrikrishnadasaviracitam purnabrahmastotram
    sampurnam ||
  devanagari: पूर्णब्रह्मस्तोत्रम् पूर्णचन्द्रमुखं नीलेन्दुरूपं उद्भाषितं देवं दिव्यंस्वरूपं पूर्णं त्वं
    स्वर्णं त्वं वर्णं त्वं देवं पिता माता बन्धु त्वमेव सर्वं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ
    स्वामी भक्तभावप्रेमी नमाम्यहम् ॥ १॥ कुञ्चितकेशं च सञ्चितवेशं वर्तुलस्थूलनयनं ममेशं पिनाकनीनिका नयनकोशं
    जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहम् ॥ २॥ नीलाचले चञ्चलया
    सहितं नन्दनन्दनं त्वं इन्द्रस्य इन्द्रं जगन्नाथस्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी
    नमाम्यहम् ॥ ३॥ सृष्टि स्थिति प्रलय सर्वमूळं सूक्ष्मातिसुक्ष्मं त्वं स्थूलातिस्थूलं कान्तिमयानन्तं
    अन्तिमप्रान्तं प्रशान्तकुन्तळं ते मूर्त्तिमन्तं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी
    भक्तभावप्रेमी नमाम्यहम् ॥ ४॥ यज्ञ तप वेद ज्ञानात् अतीतं भावप्रेमछन्दे सदावशित्वं शुद्धात् शुद्धं त्वं
    च पूर्णात् पूर्णं कृष्णमेघतुल्यं अमूल्यवर्णं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी
    भक्तभावप्रेमी नमाम्यहम् ॥ ५॥ विश्वप्रकाशं सर्वक्लेशनाशं मन बुद्धि प्राण श्वासप्रश्वासं मत्स्य कूर्म
    नृसिंह वामनः त्वं वराह राम अनन्त अस्तित्वं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी
    नमाम्यहम् ॥ ६॥ ध्रुवस्य विष्णुः त्वं भक्तस्य प्राणं राधापति देव हे आर्त्तत्राणं सर्व ज्ञान सारं लोक
    आधारं भावसञ्चारं अभावसंहारं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहम्
    ॥ ७॥ बलदेव सुभद्रा पार्श्वे स्थितं सुदर्शन सङ्गे नित्य शोभितं नमामि नमामि सर्वाङ्गे देवं हे पूर्णब्रह्म
    हरि मम सर्वं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहम् ॥ ८॥ कृष्णदासहृदि
    भाव सञ्चारं सदा कुरु स्वामी तव किङ्करं तव कृपा विन्दु हि एक सारं अन्यथा हे नाथ सर्व असारं जगन्नाथ
    स्वामी भक्तभावप्रेमी नमाम्यहं जगन्नाथ स्वामी भक्तभावप्रेमी नमाम्यहम् ॥ ९॥ ॥ इति श्रीकृष्णदासविरचितं
    पूर्णब्रह्मस्तोत्रं सम्पूर्णम् ॥
