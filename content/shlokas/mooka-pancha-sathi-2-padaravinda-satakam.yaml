id: mooka-pancha-sathi-2-padaravinda-satakam
category: stotram
name:
  english: Mooka Pancha Sathi 2 - Padaravinda Satakam
content:
  english: mahimnah panthanam madanaparipanthipranayini prabhurnirnetum te bhavati yatamano'pi katamah
    | tathapi shrikancivihritirasike ko'pi manaso vipakastvatpadastutividhishu jalpakayati mam || || galagrahi
    paurandarapuravanipallavarucam dhritapathamyanamarunamahasamadimaguruh | samindhe bandhukastabakasahayudhva
    dishi dishi prasarpankamakshyashcaranakirananamarunima || || maralinam yanabhyasanakalanamulagurave
    daridranam tranavyatikarasurodyanatarave | tamaskandapraudhiprakatanatiraskarapatave jano'yam kamakshyashcarananalinaya
    sprihayate || || vahanti saindurim saranimavanamramarapuṟi purandhrisimante kavikamalabalarkasushama
    | trayisimantinyah stanatatanicolarunapati vibhanti kamakshyah padanalinakantirvijayate || || pranamribhutasya
    pranayakalahatrastamanasah smararateshcudaviyati grihamedhi himakarah | yayoh sandhyam kantim vahati
    sushamabhishcaranayoh tayorme kamakshya hridayamapatandram viharatam || || yayoh pithayante vibudhamukutinam
    patalika yayoh saudhayante svayamudayabhajo bhanitayah | yayoh dasayante sarasijabhavadyashcaranayoh
    tayorme kamakshya dinamanu varivartu hridayam || || nayanti sankocam sarasijarucam dikparisare srijanti
    lauhityam nakhakiranacandrardhakhacita | kavindranam hritkairavavikasanodyogajanani sphuranti kamakshyah
    caranarucisandhya vijayate || || viravairmanjiraih kimapi kathayantiva madhuram purastadanamre puravijayini
    smeravadane | vayasyeva praudha shithilayati ya premakalaha praroham kamakshyah caranayugali sa vijayate
    || || suparvastrilolalakaparicitam shatpadakulaih sphurallaksharagam tarunataranijyotirarunaih | bhritam
    kantyambhobhih visrimaramarandaih sarasijaih vidhatte kamakshyah caranayugalam bandhupadavim || ||
    rajahsamsarge'pi sthitamarajasameva hridaye param raktatvena sthitamapi viraktaikasharanam | alabhyam
    mandanam dadhadapi sada mandagatitam vidhatte kamakshyah caranayugamashcaryalaharim || || jatala manjirasphuradarunaratnamshunikaraih
    nishidanti madhye nakharucijharigangapayasam | jagattranam kartum janani mama kamakshi niyatam tapashcaryam
    dhatte tava caranapathojayugali || || tulakotidvandvakkanitabhanitabhitivacasoh vinamram kamakshi
    visrimaramahahpatalitayoh | kshanam vinyasena kshapitatamasorme lalitayoh puniyanmurdhanam puraharapurandhri
    caranayoh || || bhavani druhyetam bhavanibiditebhyo mama muhu stamovyamohebhyastava janani kamakshi
    caranau | yayorlakshabindusphuranadharanaddhvarjatijata kutira shonankam vahati vapurenankakalika
    || || pavitrikuryurnuh padatalabhuvah patalarucah paragaste papaprashamanadhurinah parashive | kanam
    labdhum yesham nijashirasi kamakshi vivasha valanto vyatanvantyahamahamikam madhavamukhah || || balakamalabhirnakharucimayibhih
    parivrite vinamrasvarnarivikacakacakalambudakule | sphurantah kamakshi sphutadalitabandhukasuhrida
    statillekhayante tava caranapathojakiranah || || saragah sadveshah prasrimarasaroje pratidinam nisargadakramanvibudhajanamurdhanamadhikam
    | kathankaram matah kathaya padapadmastava satam natanam kamakshi prakatayati kaivalyasaranim || ||
    japalakshmishono janitaparamajnananalini vikasavyasango viphalitajagajjadyagarima | manahpurvadrim
    me tilakayatu kamakshi tarasa tamaskandadrohi tava caranapathojaramanah || || namaskurmah prenkhanmanikatakanilotpalamahah
    payodhau rinkhadbhirnakhakiranaphenairdhavalite | sphutam kurvanaya prabalacaladaurvanalashikha vitarkam
    kamakshyah satatamarunimne caranayoh || || shive pashayetamalaghuni tamahkupakuhare dinadhishayetam
    mama hridayapathojavipine | nabhomasayetam sarasakavitaritisariti tvadiyau kamakshi prasritakiranau
    devi caranau || || nishaktam shrutyante nayanamiva sadvrittaruciraih samairjushtam shuddhairadharamiva
    ramyairdvijaganaih | shive vakshojanmadvitayamiva muktashritamume tvadiyam kamakshi pranatasharanam
    naumi caranam || || namasyasamsajjannamuciparipanthipranayini nisargaprenkholatkuralakulakalahishabale
    | nakhacchayadugdhodadhipayasi te vaidrumarucam pracaram kamakshi pracurayati padabjasushama || ||
    kada durikartum katuduritakakolajanitam mahantam santapam madanaparipanthipriyatame | kshanatte kamakshi
    tribhuvanaparitapaharane patiyamsam lapsye padakamalasevamritarasam || || yayoh sandhyam rocih satatamarunimne
    sprihayate yayoshcandri kantih paripatati drishtva nakharucim | yayoh pakodrekam pipathishati bhaktya
    kisalayam mradimnah kamakshya manasi caranau tau tanumahe || || jagannedam nedam paramiti parityajya
    yatibhih kushagriyasvantaih kushaladhishanaih shastrasaranau | gaveshyam kamakshi dhruvamakritakanam
    girisute giramaidamparyam tava caranapadmam vijayate || || kritasnanam shastramritasarasi kamakshi
    nitaram dadhanam vaishadyam kalitarasamanandasudhaya | alankaram bhumermunijanamanashcinmayamaha payodherantasstham
    tava caranaratnam mrigayate || || manogehe mohodbhavatimirapurne mama muhuh daridranikurvandinakarasahasrani
    kiranaih | vidhattam kamakshi prasrimaratamovancanacanah kshanardham sannidhyam caranamanidipo janani
    te || || kavinam cetovannakhararucisamparki vibudha sravantisrotovatpatumukharitam hamsakaravaih |
    dinarambhashrivanniyatamarunacchayasubhagam madantah kamakshyah sphuratu padapankeruhayugam || ||
    sada kim samparkatprakritikathinairnakimukutaih tatairniharadreradhikamanuna yogimanasa | vibhinte
    sammoham shishirayati bhaktanapi drisham adrishyam kamakshi prakatayati te padayugalam || || pavitrabhyamamba
    prakritimridulabhyam tava shive padabhyam kamakshi prasabhamabhibhutaih sacakitaih | pravalairambhojairapi
    ca vanavasavratadashah sadaivarabhyante paricaritananadvijaganaih || || ciraddrishya hamsaih kathamapi
    sada hamsasulabham nirasyanti jadyam niyatajadamadhyaikasharanam | adoshavyasanga satatamapi doshaptimalinam
    payojam kamakshyah parihasati padabjayugali || || suranamanandaprabalanataya mandanataya nakhendujyotsnabhirvisrimaratamahkhandanataya
    | payojashridveshavrataratataya tvaccaranayoh vilasah kamakshi prakatayati naishakaradasham || ||
    sitimna kantinam nakharajanusham padanalina cchavinam shonimna tava janani kamakshi namane | labhante
    mandaragrathitanavabandhukakusuma srajam samicinyam surapurapurandhrikacabharah || || sphuranmadhye
    shuddhe nakhakiranadugdhabdhipayasam vahannabjam cakram daramapi ca lekhatmakataya | shrito matsyam
    rupam shriyamapi dadhano nirupamam tridhama kamakshyah padanalinanama vijayate || || nakhashrisannaddhastabakanicitah
    svaishca kiranaih pishangaih kamakshi prakatitalasatpallavarucih | satam gamyah shanke sakalaphaladata
    surataruh tvadiyah pado'yam tuhinagirirajanyatanaye || || vashatkurvanmanjirakalakalaih karmalahari
    havimshi prauddandam jvalati paramajnanadahane | mahiyankamakshi sphutamahasi johoti sudhiyam manovedyam
    matastava caranayajva girisute || || mahamantram kincinmanikatakanadairmridu japan kshipandikshu svaccham
    nakharucimayam bhasmanarajah | natanam kamakshi prakritipaturaccatya mamata pishacim pado'yam prakatayati
    te mantrikadasham || || udite bodhendau tamasi nitaram jagmushi dasham daridram kamakshi prakatamanuragam
    vidadhati | sitenacchadyangam nakharucipatenanghriyugali purandhri te matah svayamabhisaratyeva hridayam
    || || dinarambhah sampannalinavipinanamabhinavo vikaso vasantah sukavipikalokasya niyatah | pradoshah
    kamakshi prakataparamajnanashashina shcakasti tvatpadasmaranamahima shailatanaye || || dhritacchayam
    nityam sarasiruhamaitriparicitam nidhanam diptinam nikhilajagatam bodhajanakam | mumukshunam margaprathanapatu
    kamakshi padavim padam te patangim parikalayate parvatasute || || shanaistirtva mohambudhimatha samarodhumanasah
    kramatkaivalyakhyam sukritisulabham saudhavalabhim | labhante nihshrenimiva jhatiti kamakshi caranam
    purashcaryabhiste puramathanasimantini janah || || pracandartikshobhapramathanakrite pratibhasari
    tpravahaproddandikaranajaladaya pranamatam | pradipaya praudhe bhavatamasi kamakshi carana prasadaunmukhyaya
    sprihayati jano'yam janani te || || marudbhih samsevya satatamapi cancalyarahita sadarunyam yanti
    parinatidaridranasushama | gunotkarshanmanjirakakalakalaistarjanapatuh pravalam kamakshyah parihasati
    padabjayugali || || jagadrakshadaksha jalajarucishikshapatutara samairnamya ramya satatamabhigamya
    budhajanaih | dvayi lilalola shrutishu surapaladimukuti tatisimadhama tava janani kamakshi padayoh
    || || giram durau corau jadimatimiranam kritajaga tparitranau shonau munihridayalilaikanipunau | nakhaih
    smerau sarau nigamavacasam khanditabhava grahonmadau padau tava janani kamakshi kalaye || || avishrantam
    pankam yadapi kalayanyavakamayam nirasyankamakshi pranamanajusham pankamakhilam | tulakotidvandam
    dadhadapi ca gacchannatulatam giram margam pado girivarasute langhayati te || || pravalam savrilam
    vipinavivare vepayati ya sphurallilam balatapamadhikabalam vadati ya | rucim sandhyam vandhyam viracayati
    ya vardhayatu sa shivam me kamakshyah padanalinapatalyalahari || || kiranjyotsnaritim nakhamukharuca
    hamsamanasam vitanvanah pritim vikacatarunambhoruharucih | prakashah shripadastava janani kamakshi
    tanute sharatkalapraudhim shashishakalacudapriyatame || || nakhankurasmeradyutivimalagangambhasi sukham
    kritasnanam jnanamritamamalamasvadya niyatam | udancanmanjirasphuranamanidipe mama mano manojne kamakshyashcaranamaniharmye
    viharatam || || bhavambhodhau naukam jadimavipine pavakashikha mamartyendradinamadhimukutamuttamsakalikam
    | jagattape jyotsnamakritakavacahpanjarapute shukastrim kamakshya manasi kalaye padayugalim || ||
    paratmaprakashyapratiphalanacuncuh pranamatam manojnastvatpado manimukuramudram kalayate | yadiyam
    kamakshi prakritimasrinah shodhakadasham vidhatum ceshthante balaripuvadhutikacabharah || || avishrantam
    tishthannakritakavacahkandaraputi kutirantah praudham nakharucisatalim prakatayan | pracandam khandatvam
    nayatu mama kamakshi tarasa tamovetandendram tava caranakanthiravapatih || || purastatkamakshi pracurarasamakhandalapuri
    purandhrinam lasyam tava lalitamalokya shanakaih | nakhashribhih smera bahu vitanute nupuraravai shcamatkritya
    shanke caranayugali caturacanah || || sarojam nindanti nakhakiranakarpurashishira nishikta mararermukutashashirekhahimajalaih
    | sphuranti kamakshi sphutarucimaye pallavacaye tavadhatte maitrim pathikasudrisha padayugali || ||
    natanam sampatteranavaratamakarshanajapah prarohatsamsaraprasaragarimastambhanajapah | tvadiyah kamakshi
    smaraharamanomohanajapah patiyannah payatpadanalinamanjiraninadah || || vitanvitha nathe mama shirasi
    kamakshi kripaya padambhojanyasam pashuparibridhapranadayite | pibanto yanmudram prakatamupakampaparisaram
    drisha nanandyante nalinabhavanarayanamukhah || || pranamodyadbrindaramukutamandarakalika vilolallolambaprakaramayadhumapracurima
    | pradiptah padabjadyutivitatipatalyalahari krishanuh kamakshya mama dahatu samsaravipinam || || valakshashrirrikshadhipashishusadrikshaistava
    nakhaih jighrikshurdakshatvam sarasiruhabhikshutvakarane | kshananme kamakshi kshapitabhavasankshobhagarima
    vacovaicakshanyam caranayugali pakshmalayatat || || samantatkamakshi kshatatimirasantanasubhagan anantabhirbhabhirdinamanu
    digantanviracayan | ahantaya hanta mama jadimadantavalaharih vibhintam santapam tava caranacintamanirasau
    || || dadhano bhasvattamamritanilayo lohitavapuh vinamranam saumyo gururapi kavitvam ca kalayan |
    gatau mando gangadharamahishi kamakshi bhajatam tamahketurmatastava caranapadmo vijayate || || nayantim
    dasatvam nalinabhavamukhyanasulabha pradanaddinanamamaratarudaurbhagyajananim | jagajjanmakshemakshayavidhishu
    kamakshi padayo rdhurinamishte karastava bhanitumahopurushikam || || jano'yam santapto janani bhavacandamshukiranaih
    alabdhavaikam shitam kanamapi parajnanapayasah | tamomarge panthastava jhatiti kamakshi shishiram
    padambhojacchayam paramashivajaye mrigayate || || jayatyamba shrimannakhakiranacinamshukamayam vitanam
    bibhrane suramukutasanghattamasrine | nijarunyakshaumastaranavati kamakshi sulabha budhaih samvinnari
    tava caranamanikyabhavane || || pratimah kamakshi sphuritatarunadityakirana shriyo muladravyam tava
    caranamadrindratanaye | surendrashamapurayati yadasau dhvantamakhilam dhunite digbhaganapi ca mahasa
    patalayate || || mahabhashyavyakhyapatushayanamaropayati va smaravyaparershyapishunanitilam karayati
    va | dvirephanamadhyasayati satatam vadhivasatim pranamrankamakshyah padanalinamahatmyagarima || ||
    vivekambhassrotassnapanaparipatishishirite samibhute shastrasmaranahalasankarshanavashat | satam cetahkshetre
    vapati tava kamakshi carano mahasamvitsasyaprakaravarabijam girisute || || dadhano mandarastabakaparipatim
    nakharuca vahandiptam shonangulipatalacampeyakalikam | ashokollasam nah pracurayatu kamakshi carano
    vikasi vasantah samaya iva te sharvadayite || || nakhamshupracuryaprasrimaramaralalidhavalah sphuranmanjirodyanmarakatamahashshaivalayutah
    | bhavatyah kamakshi sphutacaranapatalyakapato nadah shonabhikhyo nagapatitanuje vijayate || || dhunanam
    pankaugham paramasulabham kantakakulaih vikasavyasangam vidadhadaparadhinamanisham | nakhendujyotsnabhirvishadaruci
    kamakshi nitaram asamanyam manye sarasijamidam te padayugam || || karindraya druhyatyalasagatililasu
    vimalaih payojairmatsaryam prakatayati kamam kalayate | padambhojadvandvam tava tadapi kamakshi hridayam
    muninam shantanam kathamanishamasmai sprihayate || || nirasta shonimna caranakirananam tava shive
    samindhana sandhyaruciracalarajanyatanaye | asamarthyadenam paribhavitumetatsamarucam sarojanam jane
    mukulayati shobham pratidinam || || upadikshaddakshyam tava carananama gururasau maralanam shanke
    masrinagatilalityasaranau | ataste nistandram niyatamamuna sakhyapadavim prapannam pathojam prati
    dadhati kamakshi kutukam || || dadhanaih samsargam prakritimalinaih shatpadakulaih dvijadhishashlaghavidhishu
    vidadhadbhirmukulatam | rajomishraih padmairniyatamapi kamakshi padayoh virodhaste yukto vishamasharavairipriyatame
    || || kavitvashrimishrikarananipunau rakshanacanau vipannanam shrimannalinamasrinau shonakiranau |
    munindranamantahkaranasharanau mandasaranau manojnau kamakshya duritaharanau naumi caranau || || parasmatsarvasmadapi
    ca parayormuktikarayoh nakhashribhirjyotsnakalitatulayostamratalayoh | niliye kamakshya nigamanutayornakinatayoh
    nirastapronmilannalinamadayoreva padayoh || || svabhavadanyonyam kisalayamapidam tava padam mradimna
    shonimna bhagavati dadhate sadrishatam | vane purvasyeccha satatamavane kim tu jagatam parasyettham
    bhedah sphurati hridi kamakshi sudhiyam || || katham vacalo'pi prakatamanimanjiraninadaih sadaivanandardranviracayati
    vacamyamajanan | prakritya te shonacchavirapi ca kamakshi carano manishanairmalyam kathamiva nrinam
    mamsalayate || || calattrishnaviciparicalanaparyakulataya muhurbhrantastantah paramashivavamakshi
    paravan | titirshuh kamakshi pracuratarakarmambudhimamum kadaham lapsye te caranamanisetum girisute
    || || vishushyantyam prajnasariti duritagrishmasamaya prabhavena kshine sati mama manahkekini shuca
    | tvadiyah kamakshi sphuritacaranambhodamahima nabhomasatopam nagapatisute kim na kurute || || vinamranam
    cetobhavanavalabhisimni carana pradipe prakashyam dadhati tava nirdhutatamasi | asima kamakshi svayamalaghudushkarmalahari
    vighurnanti shantim shalabhaparipativa bhajate || || virajanti shuktirnakhakiranamuktamanitateh vipatpathorashau
    tarirapi naranam pranamatam | tvadiyah kamakshi dhruvamalaghuvahnirbhavavane muninam jnanagneraranirayamanghirvijayate
    || || samastaih samsevyah satatamapi kamakshi vibudhaih stuto gandharvastrisulalitavipancikalaravaih
    | bhavatya bhindano bhavagirikulam jrimbhitatamo baladrohi matashcaranapuruhuto vijayate || || vasantam
    bhaktanamapi manasi nityam parilasad ghanacchayapurnam shucimapi nrinam tapashamanam | nakhendujyotsnabhih
    shishiramapi padmodayakaram namamah kamakshyashcaranamadhikashcaryakaranam || || kavindranam nanabhanitigunacitrikritavacah
    prapancavyaparaprakatanakalakaushalanidhih | adhahkurvannabjam sanakabhrigumukhyairmunijanaih namasyah
    kamakshyashcaranaparameshthi vijayate || || bhavatyah kamakshi sphuritapadapankeruhabhuvam paraganam
    puraih parihritakalankavyatikaraih | natanamamrishte hridayamukure nirmalaruci prasanne nishshesham
    pratiphalati vishvam girisute || || tava trastam padatkisalayamaranyantaramagat param rekharupam kamalamamumevashritamabhut
    | jitanam kamakshi dvitayamapi yuktam paribhave videshe vaso va sharanagamanam va nijaripoh || ||
    grihitva yatharthyam nigamavacasam deshikakripa kataksharkajyotishshamitamamatabandhatamasah | yatante
    kamakshi pratidivasamantardradhayitum tvadiyam padabjam sukritaparipakena sujanah || || jadanamapyamba
    smaranasamaye tavaccaranayoh bhramanmanthakshmabhriddhumughumitasindhupratibhatah | prasannah kamakshi
    prasabhamadharaspandanakara bhavanti svacchandam prakritiparipakka bhanitayah || || vahannapyashrantam
    madhuraninadam hamsakamasau tamevadhah kartum kimiva yatate keligamane | bhavasyaivanandam vidadhadapi
    kamakshi carano bhavatyastaddroham bhagavati kimevam vitanute || || yadatyantam tamyatyalasagativartasvapi
    shive tadetatkamakshi prakritimridulam te padayugam | kiritaih sanghattam kathamiva suraughasya sahate
    munindranamaste manasi ca katham sucinishite || || manorange matke vibudhajanasammodajanani saragavyasangam
    sarasamridusancarasubhaga | manojna kamakshi prakatayatu lasyaprakaranam rananmanjira te caranayugalinartakavadhuh
    || || parishkurvanmatah pashupatikapardam caranarat paracam hritpadmam paramabhanitinam ca makutam
    | bhavakhye pathodhau pariharatu kamakshi mamata paradhinatvam me parimushitapathojamahima || || prasunaih
    samparkadamaratarunikuntalabhavaih abhishtanam danadanishamapi kamakshi namatam | svasangatkankeliprasavajanakatvena
    ca shive tridha dhatte vartam surabhiriti pado girisute || || mahamohastenavyatikarabhayatpalayati
    yo vinikshiptam svasminnijajanamanoratnamanisham | sa ragasyodrekatsatatamapi kamakshi tarasa kimevam
    pado'sau kisalayarucim corayati te || || sada svadunkaram vishayalaharishalikanikam samasvadya shrantam
    hridayashukapotam janani me | kripajale phalekshanamahishi kamakshi rabhasat grihitva rundhitharastava
    padayugipanjarapute || || dhunanam kamakshi smaranalavamatrena jadima jvarapraudhim gudhasthiti nigamanaikunjakuhare
    | alabhyam sarvesham katicana labhante sukritinah ciradanvishyantastava caranasiddhaushadhamidam ||
    || rananmanjirabhyam lalitagamanabhyam sukritinam manovastavyabhyam mathitatimirabhyam nakharuca |
    nidheyabhyam patya nijashirasi kamakshi satatam namaste padabhyam nalinamridulabhyam girisute || ||
    surage rakendupratinidhimukhe parvatasute cirallabhye bhaktya shamadhanajananam parishada | manobhringo
    matkah padakamalayugme janani te prakamam kamakshi tripuraharavamakshi ramatam || || shive samvidrupe
    shashishakalacudapriyatame shanairgatyagatya jitasuravarebhe girisute | yatante santaste carananalinalanayugale
    sada baddham cittapramadakariyutham dridhataram || || yashah sute matarmadhurakavitam pakshmalayate
    shriyam datte citte kamapi paripakam prathayate | satam pashagranthim shithilayati kim kim na kurute
    prapanne kamakshyah pranatiparipati caranayoh || || manisham mahendrim kakubhamiva te kamapi dasham
    pradhatte kamakshyashcaranatarunadityakiranah | yadiye samparke dhritarasamaranda kavayatam paripakam
    dhatte parimalavati suktinalini || || pura mararatih puramajayadamba stavashataih prasannayam satyam
    tvayi tuhinashailendratanaye | ataste kamakshi sphuratu tarasa kalasamaye samayate matarmama manasi
    padabjayugalam || || padadvandvam mandam gatishu nivasantam hridi satam giramante bhrantam kritakarahitanam
    paribridhe | jananamanandam janani janayantam pranamatam tvadiyam kamakshi pratidinamaham naumi vimalam
    || || idam yah kamakshyashcarananalinastotrashatakam japennityam bhaktya nikhilajagadahladajanakam
    | sa vishvesham vandyah sakalakavilokaikatilakah ciram bhuktva bhoganparinamati cidrupakalaya || ||
    || iti padaravindashatakam sampurnam ||
  devanagari: महिम्नः पन्थानं मदनपरिपन्थिप्रणयिनि प्रभुर्निर्णेतुं ते भवति यतमानोऽपि कतमः । तथापि श्रीकाञ्चीविहृतिरसिके
    कोऽपि मनसो विपाकस्त्वत्पादस्तुतिविधिषु जल्पाकयति माम् ॥ ॥ गलग्राही पौरन्दरपुरवनीपल्लवरुचां धृतपाथम्यानामरुणमहसामादिमगुरुः
    । समिन्धे बन्धूकस्तबकसहयुध्वा दिशि दिशि प्रसर्पन्कामाक्ष्याश्चरणकिरणानामरुणिमा ॥ ॥ मरालीनां यानाभ्यसनकलनामूलगुरवे
    दरिद्राणां त्राणव्यतिकरसुरोद्यानतरवे । तमस्काण्डप्रौढिप्रकटनतिरस्कारपटवे जनोऽयं कामाक्ष्याश्चरणनलिनाय
    स्पृहयते ॥ ॥ वहन्ती सैन्दूरीं सरणिमवनम्रामरपुऱी पुरन्ध्रीसीमन्ते कविकमलबालार्कसुषमा । त्रयीसीमन्तिन्याः
    स्तनतटनिचोलारुणपटी विभान्ती कामाक्ष्याः पदनलिनकान्तिर्विजयते ॥ ॥ प्रणम्रीभूतस्य प्रणयकलहत्रस्तमनसः
    स्मरारातेश्चूडावियति गृहमेधी हिमकरः । ययोः सान्ध्यां कान्तिं वहति सुषमाभिश्चरणयोः तयोर्मे कामाक्ष्या
    हृदयमपतन्द्रं विहरताम् ॥ ॥ ययोः पीठायन्ते विबुधमुकुटीनां पटलिका ययोः सौधायन्ते स्वयमुदयभाजो भणितयः
    । ययोः दासायन्ते सरसिजभवाद्याश्चरणयोः तयोर्मे कामाक्ष्या दिनमनु वरीवर्तु हृदयम् ॥ ॥ नयन्ती सङ्कोचं
    सरसिजरुचं दिक्परिसरे सृजन्ती लौहित्यं नखकिरणचन्द्रार्धखचिता । कवीन्द्राणां हृत्कैरवविकसनोद्योगजननी
    स्फुरन्ती कामाक्ष्याः चरणरुचिसन्ध्या विजयते ॥ ॥ विरावैर्माञ्जीरैः किमपि कथयन्तीव मधुरं पुरस्तादानम्रे
    पुरविजयिनि स्मेरवदने । वयस्येव प्रौढा शिथिलयति या प्रेमकलह प्ररोहं कामाक्ष्याः चरणयुगली सा विजयते
    ॥ ॥ सुपर्वस्त्रीलोलालकपरिचितं षट्पदकुलैः स्फुरल्लाक्षारागं तरुणतरणिज्योतिररुणैः । भृतं कान्त्यम्भोभिः
    विसृमरमरन्दैः सरसिजैः विधत्ते कामाक्ष्याः चरणयुगलं बन्धुपदवीम् ॥ ॥ रजःसंसर्गेऽपि स्थितमरजसामेव हृदये
    परं रक्तत्वेन स्थितमपि विरक्तैकशरणम् । अलभ्यं मन्दानां दधदपि सदा मन्दगतितां विधत्ते कामाक्ष्याः चरणयुगमाश्चर्यलहरीम्
    ॥ ॥ जटाला मञ्जीरस्फुरदरुणरत्नांशुनिकरैः निषिदन्ती मध्ये नखरुचिझरीगाङ्गपयसाम् । जगत्त्राणं कर्तुं जननि
    मम कामाक्षि नियतं तपश्चर्यां धत्ते तव चरणपाथोजयुगली ॥ ॥ तुलाकोटिद्वन्द्वक्कणितभणिताभीतिवचसोः विनम्रं
    कामाक्षी विसृमरमहःपाटलितयोः । क्षणं विन्यासेन क्षपिततमसोर्मे ललितयोः पुनीयान्मूर्धानं पुरहरपुरन्ध्री
    चरणयोः ॥ ॥ भवानि द्रुह्येतां भवनिबिडितेभ्यो मम मुहु स्तमोव्यामोहेभ्यस्तव जननि कामाक्षि चरणौ । ययोर्लाक्षाबिन्दुस्फुरणधरणाद्ध्वर्जटिजटा
    कुटीरा शोणाङ्कं वहति वपुरेणाङ्ककलिका ॥ ॥ पवित्रीकुर्युर्नुः पदतलभुवः पाटलरुचः परागास्ते पापप्रशमनधुरीणाः
    परशिवे । कणं लब्धुं येषां निजशिरसि कामाक्षि विवशा वलन्तो व्यातन्वन्त्यहमहमिकां माधवमुखाः ॥ ॥ बलाकामालाभिर्नखरुचिमयीभिः
    परिवृते विनम्रस्वर्नारीविकचकचकालाम्बुदकुले । स्फुरन्तः कामाक्षि स्फुटदलितबन्धूकसुहृद स्तटिल्लेखायन्ते
    तव चरणपाथोजकिरणाः ॥ ॥ सरागः सद्वेषः प्रसृमरसरोजे प्रतिदिनं निसर्गादाक्रामन्विबुधजनमूर्धानमधिकम् ।
    कथङ्कारं मातः कथय पदपद्मस्तव सतां नतानां कामाक्षि प्रकटयति कैवल्यसरणिम् ॥ ॥ जपालक्ष्मीशोणो जनितपरमज्ञाननलिनी
    विकासव्यासङ्गो विफलितजगज्जाड्यगरिमा । मनःपूर्वाद्रिं मे तिलकयतु कामाक्षि तरसा तमस्काण्डद्रोही तव चरणपाथोजरमणः
    ॥ ॥ नमस्कुर्मः प्रेङ्खन्मणिकटकनीलोत्पलमहः पयोधौ रिङ्खद्भिर्नखकिरणफेनैर्धवलिते । स्फुटं कुर्वाणाय प्रबलचलदौर्वानलशिखा
    वितर्कं कामाक्ष्याः सततमरुणिम्ने चरणयोः ॥ ॥ शिवे पाशायेतामलघुनि तमःकूपकुहरे दिनाधीशायेतां मम हृदयपाथोजविपिने
    । नभोमासायेतां सरसकवितारीतिसरिति त्वदीयौ कामाक्षि प्रसृतकिरणौ देवि चरणौ ॥ ॥ निषक्तं श्रुत्यन्ते नयनमिव
    सद्वृत्तरुचिरैः समैर्जुष्टं शुद्धैरधरमिव रम्यैर्द्विजगणैः । शिवे वक्षोजन्मद्वितयमिव मुक्ताश्रितमुमे
    त्वदीयं कामाक्षि प्रणतशरणं नौमि चरणम् ॥ ॥ नमस्यासंसज्जन्नमुचिपरिपन्थिप्रणयिनी निसर्गप्रेङ्खोलत्कुरलकुलकालाहिशबले
    । नखच्छायादुग्धोदधिपयसि ते वैद्रुमरुचां प्रचारं कामाक्षि प्रचुरयति पादाब्जसुषमा ॥ ॥ कदा दूरीकर्तुं
    कटुदुरितकाकोलजनितं महान्तं सन्तापं मदनपरिपन्थिप्रियतमे । क्षणात्ते कामाक्षि त्रिभुवनपरीतापहरणे पटीयांसं
    लप्स्ये पदकमलसेवामृतरसम् ॥ ॥ ययोः सान्ध्यं रोचिः सततमरुणिम्ने स्पृहयते ययोश्चान्द्री कान्तिः परिपतति
    दृष्ट्वा नखरुचिम् । ययोः पाकोद्रेकं पिपठिषति भक्त्या किसलयं म्रदिम्नः कामाक्ष्या मनसि चरणौ तौ तनुमहे
    ॥ ॥ जगन्नेदं नेदं परमिति परित्यज्य यतिभिः कुशाग्रीयस्वान्तैः कुशलधिषणैः शास्त्रसरणौ । गवेष्यं कामाक्षि
    ध्रुवमकृतकानां गिरिसुते गिरामैदम्पर्यं तव चरणपद्मं विजयते ॥ ॥ कृतस्नानं शास्त्रामृतसरसि कामाक्षि नितरां
    दधानं वैशद्यं कलितरसमानन्दसुधया । अलङ्कारं भूमेर्मुनिजनमनश्चिन्मयमहा पयोधेरन्तस्स्थं तव चरणरत्नं मृगयते
    ॥ ॥ मनोगेहे मोहोद्भवतिमिरपूर्णे मम मुहुः दरिद्राणीकुर्वन्दिनकरसहस्राणि किरणैः । विधत्तां कामाक्षि
    प्रसृमरतमोवञ्चनचणः क्षणार्धं सान्निध्यं चरणमणिदीपो जननि ते ॥ ॥ कवीनां चेतोवन्नखररुचिसम्पर्कि विबुध
    स्रवन्तीस्रोतोवत्पटुमुखरितं हंसकरवैः । दिनारम्भश्रीवन्नियतमरुणच्छायसुभगं मदन्तः कामाक्ष्याः स्फुरतु
    पदपङ्केरुहयुगम् ॥ ॥ सदा किं सम्पर्कात्प्रकृतिकठिनैर्नाकिमुकुटैः तटैर्नीहाराद्रेरधिकमणुना योगिमनसा
    । विभिन्ते सम्मोहं शिशिरयति भक्तानपि दृशाम् अदृश्यं कामाक्षि प्रकटयति ते पादयुगलम् ॥ ॥ पवित्राभ्यामम्ब
    प्रकृतिमृदुलाभ्यां तव शिवे पदाभ्यां कामाक्षि प्रसभमभिभूतैः सचकितैः । प्रवालैरम्भोजैरपि च वनवासव्रतदशाः
    सदैवारभ्यन्ते परिचरितनानाद्विजगणैः ॥ ॥ चिराद्दृश्या हंसैः कथमपि सदा हंससुलभं निरस्यन्ती जाड्यं नियतजडमध्यैकशरणम्
    । अदोषव्यासङ्गा सततमपि दोषाप्तिमलिनं पयोजं कामाक्ष्याः परिहसति पादाब्जयुगली ॥ ॥ सुराणामानन्दप्रबलनतया
    मण्डनतया नखेन्दुज्योत्स्नाभिर्विसृमरतमःखण्डनतया । पयोजश्रीद्वेषव्रतरततया त्वच्चरणयोः विलासः कामाक्षि
    प्रकटयति नैशाकरदशाम् ॥ ॥ सितिम्ना कान्तीनां नखरजनुषां पादनलिन च्छवीनां शोणिम्ना तव जननि कामाक्षि नमने
    । लभन्ते मन्दारग्रथितनवबन्धूककुसुम स्रजां सामीचीन्यं सुरपुरपुरन्ध्रीकचभराः ॥ ॥ स्फुरन्मध्ये शुद्धे
    नखकिरणदुग्धाब्धिपयसां वहन्नब्जं चक्रं दरमपि च लेखात्मकतया । श्रितो मात्स्यं रूपं श्रियमपि दधानो निरुपमां
    त्रिधामा कामाक्ष्याः पदनलिननामा विजयते ॥ ॥ नखश्रीसन्नद्धस्तबकनिचितः स्वैश्च किरणैः पिशङ्गैः कामाक्षि
    प्रकटितलसत्पल्लवरुचिः । सतां गम्यः शङ्के सकलफलदाता सुरतरुः त्वदीयः पादोऽयं तुहिनगिरिराजन्यतनये ॥ ॥
    वषट्कुर्वन्माञ्जीरकलकलैः कर्मलहरी हवींषि प्रौद्दण्डं ज्वलति परमज्ञानदहने । महीयान्कामाक्षि स्फुटमहसि
    जोहोति सुधियां मनोवेद्यां मातस्तव चरणयज्वा गिरिसुते ॥ ॥ महामन्त्रं किञ्चिन्मणिकटकनादैर्मृदु जपन् क्षिपन्दिक्षु
    स्वच्छं नखरुचिमयं भास्मनरजः । नतानां कामाक्षि प्रकृतिपटुरच्चाट्य ममता पिशाचीं पादोऽयं प्रकटयति ते
    मान्त्रिकदशाम् ॥ ॥ उदीते बोधेन्दौ तमसि नितरां जग्मुषि दशां दरिद्रां कामाक्षि प्रकटमनुरागं विदधती ।
    सितेनाच्छाद्याङ्गं नखरुचिपटेनाङ्घ्रियुगली पुरन्ध्री ते मातः स्वयमभिसरत्येव हृदयम् ॥ ॥ दिनारम्भः सम्पन्नलिनविपिनानामभिनवो
    विकासो वासन्तः सुकविपिकलोकस्य नियतः । प्रदोषः कामाक्षि प्रकटपरमज्ञानशशिन श्चकास्ति त्वत्पादस्मरणमहिमा
    शैलतनये ॥ ॥ धृतच्छायं नित्यं सरसिरुहमैत्रीपरिचितं निधानं दीप्तीनां निखिलजगतां बोधजनकम् । मुमुक्षूणां
    मार्गप्रथनपटु कामाक्षि पदवीं पदं ते पातङ्गीं परिकलयते पर्वतसुते ॥ ॥ शनैस्तीर्त्वा मोहाम्बुधिमथ समारोढुमनसः
    क्रमात्कैवल्याख्यां सुकृतिसुलभां सौधवलभीम् । लभन्ते निःश्रेणीमिव झटिति कामाक्षि चरणं पुरश्चर्याभिस्ते
    पुरमथनसीमन्तिनि जनाः ॥ ॥ प्रचण्डार्तिक्षोभप्रमथनकृते प्रातिभसरि त्प्रवाहप्रोद्दण्डीकरणजलदाय प्रणमताम्
    । प्रदीपाय प्रौढे भवतमसि कामाक्षि चरण प्रसादौन्मुख्याय स्पृहयति जनोऽयं जननि ते ॥ ॥ मरुद्भिः संसेव्या
    सततमपि चाञ्चल्यरहिता सदारुण्यं यान्ती परिणतिदरिद्राणसुषमा । गुणोत्कर्षान्माञ्जीरककलकलैस्तर्जनपटुः
    प्रवालं कामाक्ष्याः परिहसति पादाब्जयुगली ॥ ॥ जगद्रक्षादक्षा जलजरुचिशिक्षापटुतरा समैर्नम्या रम्या सततमभिगम्या
    बुधजनैः । द्वयी लीलालोला श्रुतिषु सुरपालादिमुकुटी तटीसीमाधामा तव जननि कामाक्षि पदयोः ॥ ॥ गिरां दूरौ
    चोरौ जडिमतिमिराणां कृतजग त्परित्राणौ शोणौ मुनिहृदयलीलैकनिपुणौ । नखैः स्मेरौ सारौ निगमवचसां खण्डितभव
    ग्रहोन्मादौ पादौ तव जननि कामाक्षि कलये ॥ ॥ अविश्रान्तं पङ्कं यदपि कलयन्यावकमयं निरस्यन्कामाक्षि प्रणमनजुषां
    पङ्कमखिलम् । तुलाकोटिद्वन्दं दधदपि च गच्छन्नतुलतां गिरां मार्गं पादो गिरिवरसुते लङ्घयति ते ॥ ॥ प्रवालं
    सव्रीलं विपिनविवरे वेपयति या स्फुरल्लीलं बालातपमधिकबालं वदति या । रुचिं सान्ध्यां वन्ध्यां विरचयति
    या वर्धयतु सा शिवं मे कामाक्ष्याः पदनलिनपाटल्यलहरी ॥ ॥ किरञ्ज्योत्स्नारीतिं नखमुखरुचा हंसमनसां वितन्वानः
    प्रीतिं विकचतरुणाम्भोरुहरुचिः । प्रकाशः श्रीपादस्तव जननि कामाक्षि तनुते शरत्कालप्रौढिं शशिशकलचूडप्रियतमे
    ॥ ॥ नखाङ्कूरस्मेरद्युतिविमलगङ्गाम्भसि सुखं कृतस्नानं ज्ञानामृतममलमास्वाद्य नियतम् । उदञ्चन्मञ्जीरस्फुरणमणिदीपे
    मम मनो मनोज्ञे कामाक्ष्याश्चरणमणिहर्म्ये विहरताम् ॥ ॥ भवाम्भोधौ नौकां जडिमविपिने पावकशिखा ममर्त्येन्द्रादीनामधिमुकुटमुत्तंसकलिकाम्
    । जगत्तापे ज्योत्स्नामकृतकवचःपञ्जरपुटे शुकस्त्रीं कामाक्ष्या मनसि कलये पादयुगलीम् ॥ ॥ परत्मप्राकाश्यप्रतिफलनचुञ्चुः
    प्रणमतां मनोज्ञस्त्वत्पादो मणिमुकुरमुद्रां कलयते । यदीयां कामाक्षि प्रकृतिमसृणाः शोधकदशां विधातुं
    चेष्ठन्ते बलरिपुवधूटीकचभराः ॥ ॥ अविश्रान्तं तिष्ठन्नकृतकवचःकन्दरपुटी कुटीरान्तः प्रौढं नखरुचिसटालीं
    प्रकटयन् । प्रचण्डं खण्डत्वं नयतु मम कामाक्षि तरसा तमोवेतण्डेन्द्रं तव चरणकण्ठीरवपतिः ॥ ॥ पुरस्तात्कामाक्षि
    प्रचुररसमाखण्डलपुरी पुरन्ध्रीणां लास्यं तव ललितमालोक्य शनकैः । नखश्रीभिः स्मेरा बहु वितनुते नूपुररवै
    श्चमत्कृत्या शङ्के चरणयुगली चाटुरचनाः ॥ ॥ सरोजं निन्दन्ती नखकिरणकर्पूरशिशिरा निषिक्ता मारारेर्मुकुटशशिरेखाहिमजलैः
    । स्फुरन्ती कामाक्षि स्फुटरुचिमये पल्लवचये तवाधत्ते मैत्रीं पथिकसुदृशा पादयुगली ॥ ॥ नतानां सम्पत्तेरनवरतमाकर्षणजपः
    प्ररोहत्संसारप्रसरगरिमस्तम्भनजपः । त्वदीयः कामाक्षि स्मरहरमनोमोहनजपः पटीयान्नः पायात्पदनलिनमञ्जीरनिनदः
    ॥ ॥ वितन्वीथा नाथे मम शिरसि कामाक्षि कृपया पदाम्भोजन्यासं पशुपरिबृढप्राणदयिते । पिबन्तो यन्मुद्रां
    प्रकटमुपकम्पापरिसरं दृशा नानन्द्यन्ते नलिनभवनारायणमुखाः ॥ ॥ प्रणामोद्यद्बृन्दारमुकुटमन्दारकलिका विलोलल्लोलम्बप्रकरमयधूमप्रचुरिमा
    । प्रदीप्तः पादाब्जद्युतिविततिपाटल्यलहरी कृशानुः कामाक्ष्या मम दहतु संसारविपिनम् ॥ ॥ वलक्षश्रीरृक्षाधिपशिशुसदृक्षैस्तव
    नखैः जिघृक्षुर्दक्षत्वं सरसिरुहभिक्षुत्वकरणे । क्षणान्मे कामाक्षि क्षपितभवसङ्क्षोभगरिमा वचोवैचक्षन्यं
    चरणयुगली पक्ष्मलयतात् ॥ ॥ समन्तात्कामाक्षि क्षततिमिरसन्तानसुभगान् अनन्ताभिर्भाभिर्दिनमनु दिगन्तान्विरचयन्
    । अहन्ताया हन्ता मम जडिमदन्तावलहरिः विभिन्तां सन्तापं तव चरणचिन्तामणिरसौ ॥ ॥ दधानो भास्वत्ताममृतनिलयो
    लोहितवपुः विनम्राणां सौम्यो गुरुरपि कवित्वं च कलयन् । गतौ मन्दो गङ्गाधरमहिषि कामाक्षि भजतां तमःकेतुर्मातस्तव
    चरणपद्मो विजयते ॥ ॥ नयन्तीं दासत्वं नलिनभवमुख्यानसुलभ प्रदानाद्दीनानाममरतरुदौर्भाग्यजननीम् । जगज्जन्मक्षेमक्षयविधिषु
    कामाक्षि पदयो र्धुरीणामीष्टे करस्तव भणितुमाहोपुरुषिकाम् ॥ ॥ जनोऽयं सन्तप्तो जननि भवचण्डांशुकिरणैः
    अलब्धवैकं शीतं कणमपि परज्ञानपयसः । तमोमार्गे पान्थस्तव झटिति कामाक्षि शिशिरां पदाम्भोजच्छायां परमशिवजाये
    मृगयते ॥ ॥ जयत्यम्ब श्रीमन्नखकिरणचीनांशुकमयं वितानं बिभ्राणे सुरमुकुटसङ्घट्टमसृणे । निजारुण्यक्षौमास्तरणवति
    कामाक्षि सुलभा बुधैः संविन्नारी तव चरणमाणिक्यभवने ॥ ॥ प्रतीमः कामाक्षि स्फुरिततरुणादित्यकिरण श्रियो
    मूलद्रव्यं तव चरणमद्रीन्द्रतनये । सुरेन्द्राशामापूरयति यदसौ ध्वान्तमखिलं धुनीते दिग्भागानपि च महसा
    पाटलयते ॥ ॥ महाभाष्यव्याख्यापटुशयनमारोपयति वा स्मरव्यापारेर्ष्यापिशुननिटिलं कारयति वा । द्विरेफाणामध्यासयति
    सततं वाधिवसतिं प्रणम्रान्कामाक्ष्याः पदनलिनमाहात्म्यगरिमा ॥ ॥ विवेकाम्भस्स्रोतस्स्नपनपरिपाटीशिशिरिते
    समीभूते शास्त्रस्मरणहलसङ्कर्षणवशात् । सतां चेतःक्षेत्रे वपति तव कामाक्षि चरणो महासंवित्सस्यप्रकरवरबीजं
    गिरिसुते ॥ ॥ दधानो मन्दारस्तबकपरिपाटीं नखरुचा वहन्दीप्तां शोणाङ्गुलिपटलचाम्पेयकलिकाम् । अशोकोल्लासं
    नः प्रचुरयतु कामाक्षि चरणो विकासी वासन्तः समय इव ते शर्वदयिते ॥ ॥ नखांशुप्राचुर्यप्रसृमरमरालालिधवलः
    स्फुरन्मञ्जीरोद्यन्मरकतमहश्शैवलयुतः । भवत्याः कामाक्षि स्फुटचरणपाटल्यकपटो नदः शोणाभिख्यो नगपतितनूजे
    विजयते ॥ ॥ धुनानं पङ्कौघं परमसुलभं कण्टककुलैः विकासव्यासङ्गं विदधदपराधीनमनिशम् । नखेन्दुज्योत्स्नाभिर्विशदरुचि
    कामाक्षि नितराम् असामान्यं मन्ये सरसिजमिदं ते पदयुगम् ॥ ॥ करीन्द्राय द्रुह्यत्यलसगतिलीलासु विमलैः
    पयोजैर्मात्सर्यं प्रकटयति कामं कलयते । पदाम्भोजद्वन्द्वं तव तदपि कामाक्षि हृदयं मुनीनां शान्तानां
    कथमनिशमस्मै स्पृहयते ॥ ॥ निरस्ता शोणिम्ना चरणकिरणानां तव शिवे समिन्धाना सन्ध्यारुचिरचलराजन्यतनये ।
    असामर्थ्यादेनं परिभवितुमेतत्समरुचां सरोजानां जाने मुकुलयति शोभां प्रतिदिनम् ॥ ॥ उपादिक्षद्दाक्ष्यं
    तव चरणनामा गुरुरसौ मरालानां शङ्के मसृणगतिलालित्यसरणौ । अतस्ते निस्तन्द्रं नियतममुना सख्यपदवीं प्रपन्नं
    पाथोजं प्रति दधति कामाक्षि कुतुकम् ॥ ॥ दधानैः संसर्गं प्रकृतिमलिनैः षट्पदकुलैः द्विजाधीशश्लाघाविधिषु
    विदधद्भिर्मुकुलताम् । रजोमिश्रैः पद्मैर्नियतमपि कामाक्षि पदयोः विरोधस्ते युक्तो विषमशरवैरिप्रियतमे
    ॥ ॥ कवित्वश्रीमिश्रीकरणनिपुणौ रक्षणचणौ विपन्नानां श्रीमन्नलिनमसृणौ शोणकिरणौ । मुनीन्द्राणामन्तःकरणशरणौ
    मन्दसरणौ मनोज्ञौ कामाक्ष्या दुरितहरणौ नौमि चरणौ ॥ ॥ परस्मात्सर्वस्मादपि च परयोर्मुक्तिकरयोः नखश्रीभिर्ज्योत्स्नाकलिततुलयोस्ताम्रतलयोः
    । निलीये कामाक्ष्या निगमनुतयोर्नाकिनतयोः निरस्तप्रोन्मीलन्नलिनमदयोरेव पदयोः ॥ ॥ स्वभावादन्योन्यं किसलयमपीदं
    तव पदं म्रदिम्ना शोणिम्ना भगवति दधाते सदृशताम् । वने पूर्वस्येच्छा सततमवने किं तु जगतां परस्येत्थं
    भेदः स्फुरति हृदि कामाक्षि सुधियाम् ॥ ॥ कथं वाचालोऽपि प्रकटमणिमञ्जीरनिनदैः सदैवानन्दार्द्रान्विरचयति
    वाचंयमजनान् । प्रकृत्या ते शोणच्छविरपि च कामाक्षि चरणो मनीषानैर्मल्यं कथमिव नृणां मांसलयते ॥ ॥ चलत्तृष्णावीचीपरिचलनपर्याकुलतया
    मुहुर्भ्रान्तस्तान्तः परमशिववामाक्षि परवान् । तितीर्षुः कामाक्षि प्रचुरतरकर्माम्बुधिममुं कदाहं लप्स्ये
    ते चरणमणिसेतुं गिरिसुते ॥ ॥ विशुष्यन्त्यां प्रज्ञासरिति दुरितग्रीष्मसमय प्रभावेण क्षीणे सति मम मनःकेकिनि
    शुचा । त्वदीयः कामाक्षि स्फुरितचरणाम्भोदमहिमा नभोमासाटोपं नगपतिसुते किं न कुरुते ॥ ॥ विनम्राणां चेतोभवनवलभीसीम्नि
    चरण प्रदीपे प्राकाश्यं दधति तव निर्धूततमसि । असीमा कामाक्षि स्वयमलघुदुष्कर्मलहरी विघूर्णन्ती शान्तिं
    शलभपरिपाटीव भजते ॥ ॥ विराजन्ती शुक्तिर्नखकिरणमुक्तामणिततेः विपत्पाथोराशौ तरिरपि नराणां प्रणमताम् ।
    त्वदीयः कामाक्षि ध्रुवमलघुवह्निर्भववने मुनीनां ज्ञानाग्नेररणिरयमङ्घिर्विजयते ॥ ॥ समस्तैः संसेव्यः
    सततमपि कामाक्षि विबुधैः स्तुतो गन्धर्वस्त्रीसुललितविपञ्चीकलरवैः । भवत्या भिन्दानो भवगिरिकुलं जृम्भिततमो
    बलद्रोही मातश्चरणपुरुहूतो विजयते ॥ ॥ वसन्तं भक्तानामपि मनसि नित्यं परिलसद् घनच्छायापूर्णं शुचिमपि
    नृणां तापशमनम् । नखेन्दुज्योत्स्नाभिः शिशिरमपि पद्मोदयकरं नमामः कामाक्ष्याश्चरणमधिकाश्चर्यकरणम् ॥
    ॥ कवीन्द्राणां नानाभणितिगुणचित्रीकृतवचः प्रपञ्चव्यापारप्रकटनकलाकौशलनिधिः । अधःकुर्वन्नब्जं सनकभृगुमुख्यैर्मुनिजनैः
    नमस्यः कामाक्ष्याश्चरणपरमेष्ठी विजयते ॥ ॥ भवत्याः कामाक्षि स्फुरितपदपङ्केरुहभुवां परागाणां पूरैः परिहृतकलङ्कव्यतिकरैः
    । नतानामामृष्टे हृदयमुकुरे निर्मलरुचि प्रसन्ने निश्शेषं प्रतिफलति विश्वं गिरिसुते ॥ ॥ तव त्रस्तं पादात्किसलयमरण्यान्तरमगात्
    परं रेखारूपं कमलममुमेवाश्रितमभूत् । जितानां कामाक्षि द्वितयमपि युक्तं परिभवे विदेशे वासो वा शरणगमनं
    वा निजरिपोः ॥ ॥ गृहीत्वा याथार्थ्यं निगमवचसां देशिककृपा कटाक्षर्कज्योतिश्शमितममताबन्धतमसः । यतन्ते
    कामाक्षि प्रतिदिवसमन्तर्द्रढयितुं त्वदीयं पादाब्जं सुकृतपरिपाकेन सुजनाः ॥ ॥ जडानामप्यम्ब स्मरणसमये
    तवच्चरणयोः भ्रमन्मन्थक्ष्माभृद्धुमुघुमितसिन्धुप्रतिभटाः । प्रसन्नाः कामाक्षि प्रसभमधरस्पन्दनकरा भवन्ति
    स्वच्छन्दं प्रकृतिपरिपक्का भणितयः ॥ ॥ वहन्नप्यश्रान्तं मधुरनिनदं हंसकमसौ तमेवाधः कर्तुं किमिव यतते
    केलिगमने । भवस्यैवानन्दं विदधदपि कामाक्षि चरणो भवत्यास्तद्द्रोहं भगवति किमेवं वितनुते ॥ ॥ यदत्यन्तं
    ताम्यत्यलसगतिवार्तास्वपि शिवे तदेतत्कामाक्षि प्रकृतिमृदुलं ते पदयुगम् । किरीटैः सङ्घट्टं कथमिव सुरौघस्य
    सहते मुनीन्द्राणामास्ते मनसि च कथं सूचिनिशिते ॥ ॥ मनोरङ्गे मत्के विबुधजनसम्मोदजननी सरागव्यासङ्गं सरसमृदुसञ्चारसुभगा
    । मनोज्ञा कामाक्षि प्रकटयतु लास्यप्रकरणं रणन्मञ्जीरा ते चरणयुगलीनर्तकवधूः ॥ ॥ परिष्कुर्वन्मातः पशुपतिकपर्दं
    चरणराट् पराचां हृत्पद्मं परमभणितीनां च मकुटम् । भवाख्ये पाथोधौ परिहरतु कामाक्षि ममता पराधीनत्वं मे
    परिमुषितपाथोजमहिमा ॥ ॥ प्रसूनैः सम्पर्कादमरतरुणीकुन्तलभवैः अभीष्टानां दानादनिशमपि कामाक्षि नमताम्
    । स्वसङ्गात्कङ्केलिप्रसवजनकत्वेन च शिवे त्रिधा धत्ते वार्तां सुरभिरिति पादो गिरिसुते ॥ ॥ महामोहस्तेनव्यतिकरभयात्पालयति
    यो विनिक्षिप्तं स्वस्मिन्निजजनमनोरत्नमनिशम् । स रागस्योद्रेकात्सततमपि कामाक्षि तरसा किमेवं पादोऽसौ
    किसलयरुचिं चोरयति ते ॥ ॥ सदा स्वादुङ्कारं विषयलहरीशालिकणिकां समास्वाद्य श्रान्तं हृदयशुकपोतं जननि
    मे । कृपाजाले फालेक्षणमहिषि कामाक्षि रभसात् गृहीत्वा रुन्धीथारस्तव पदयुगीपञ्जरपुटे ॥ ॥ धुनानं कामाक्षि
    स्मरणलवमात्रेण जडिम ज्वरप्रौढिं गूढस्थिति निगमनैकुञ्जकुहरे । अलभ्यं सर्वेषां कतिचन लभन्ते सुकृतिनः
    चिरादन्विष्यन्तस्तव चरणसिद्धौषधमिदम् ॥ ॥ रणन्मञ्जीराभ्यां ललितगमनाभ्यां सुकृतिनां मनोवास्तव्याभ्यां
    मथिततिमिराभ्यां नखरुचा । निधेयाभ्यां पत्या निजशिरसि कामाक्षि सततं नमस्ते पादाभ्यां नलिनमृदुलाभ्यां
    गिरिसुते ॥ ॥ सुरागे राकेन्दुप्रतिनिधिमुखे पर्वतसुते चिराल्लभ्ये भक्त्या शमधनजनानां परिषदा । मनोभृङ्गो
    मत्कः पदकमलयुग्मे जननि ते प्रकामं कामाक्षि त्रिपुरहरवामाक्षि रमताम् ॥ ॥ शिवे संविद्रूपे शशिशकलचूडप्रियतमे
    शनैर्गत्यागत्या जितसुरवरेभे गिरिसुते । यतन्ते सन्तस्ते चरणनलिनालानयुगले सदा बद्धं चित्तप्रमदकरियूथं
    दृढतरम् ॥ ॥ यशः सूते मातर्मधुरकवितां पक्ष्मलयते श्रियं दत्ते चित्ते कमपि परिपाकं प्रथयते । सतां पाशग्रन्थिं
    शिथिलयति किं किं न कुरुते प्रपन्ने कामाक्ष्याः प्रणतिपरिपाटी चरणयोः ॥ ॥ मनीषां माहेन्द्रीं ककुभमिव
    ते कामपि दशां प्रधत्ते कामाक्ष्याश्चरणतरुणादित्यकिरणः । यदीये सम्पर्के धृतरसमरन्दा कवयतां परीपाकं
    धत्ते परिमलवती सूक्तिनलिनी ॥ ॥ पुरा मारारातिः पुरमजयदम्ब स्तवशतैः प्रसन्नायां सत्यां त्वयि तुहिनशैलेन्द्रतनये
    । अतस्ते कामाक्षि स्फुरतु तरसा कालसमये समायाते मातर्मम मनसि पादाब्जयुगलम् ॥ ॥ पदद्वन्द्वं मन्दं गतिषु
    निवसन्तं हृदि सतां गिरामन्ते भ्रान्तं कृतकरहितानां परिबृढे । जनानामानन्दं जननि जनयन्तं प्रणमतां त्वदीयं
    कामाक्षि प्रतिदिनमहं नौमि विमलम् ॥ ॥ इदं यः कामाक्ष्याश्चरणनलिनस्तोत्रशतकं जपेन्नित्यं भक्त्या निखिलजगदाह्लादजनकम्
    । स विश्वेषां वन्द्यः सकलकविलोकैकतिलकः चिरं भुक्त्वा भोगान्परिणमति चिद्रूपकलया ॥ ॥ ॥ इति पादारविन्दशतकं
    सम्पूर्णम् ॥
