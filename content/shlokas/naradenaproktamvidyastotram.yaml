id: naradenaproktamvidyastotram
category: stotram
name:
  english: naradenaproktamvidyastotram
  devanagari: नारदेनप्रोक्तंविद्यास्तोत्रम्
content:
  english: naradena proktam vidyastotram om namastubhyam bhagavate vasudevaya dhimahi | pradyumnayaniruddhaya
    namah sankarshanaya ca || 18|| namo vijnanamatraya paramanandamurtaye | atmaramaya shantaya nivrittadvaitadrishtaye
    || 19|| atmanandanubhutyaiva nyastashaktyurmaye namah | hrishikeshaya mahate namaste vishvamurtaye
    || 20|| vacasyuparate'prapya ya eko manasa saha | anamarupashcinmatrah so'vyannah sadasatparah ||
    21|| yasminnidam yatashcedam tishthatyapyeti jayate | mrinmayeshviva mrijjatistasmai te brahmane namah
    || 22|| yanna sprishanti na vidurmanobuddhindriyasavah | antarbahishca vitatam vyomavattannato'smyaham
    || 23|| dehendriyapranamanodhiyo'mi yadamshaviddhah pracaranti karmasu | naivanyada lohamivaprataptam
    sthaneshu taddrashtrapadeshameti || 24|| om namo bhagavate mahapurushaya mahanubhavaya mahavibhutipataye
    sakalasatvataparivridha
  devanagari: नारदेन प्रोक्तं विद्यास्तोत्रम् ॐ नमस्तुभ्यं भगवते वासुदेवाय धीमहि । प्रद्युम्नायानिरुद्धाय
    नमः सङ्कर्षणाय च ॥ १८॥ नमो विज्ञानमात्राय परमानन्दमूर्तये । आत्मारामाय शान्ताय निवृत्तद्वैतदृष्टये
    ॥ १९॥ आत्मानन्दानुभूत्यैव न्यस्तशक्त्यूर्मये नमः । हृषीकेशाय महते नमस्ते विश्वमूर्तये ॥ २०॥ वचस्युपरतेऽप्राप्य
    य एको मनसा सह । अनामरूपश्चिन्मात्रः सोऽव्यान्नः सदसत्परः ॥ २१॥ यस्मिन्निदं यतश्चेदं तिष्ठत्यप्येति
    जायते । मृण्मयेष्विव मृज्जातिस्तस्मै ते ब्रह्मणे नमः ॥ २२॥ यन्न स्पृशन्ति न विदुर्मनोबुद्धीन्द्रियासवः
    । अन्तर्बहिश्च विततं व्योमवत्तन्नतोऽस्म्यहम् ॥ २३॥ देहेन्द्रियप्राणमनोधियोऽमी यदंशविद्धाः प्रचरन्ति
    कर्मसु । नैवान्यदा लोहमिवाप्रतप्तं स्थानेषु तद्द्रष्ट्रपदेशमेति ॥ २४॥ ॐ नमो भगवते महापुरुषाय महानुभावाय
    महाविभूतिपतये सकलसात्वतपरिवृढ
