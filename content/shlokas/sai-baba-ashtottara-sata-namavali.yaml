id: sai-baba-ashtottara-sata-namavali
category: stotram
name:
  english: Sai Baba Ashtottara Sata Namavali
content:
  english: om shri sayinathaya namah | om lakshminarayanaya namah | om krishnaramashivamarutyadirupaya
    namah | om sheshashayine namah | om godavaritatashiradivasine namah | om bhaktahridalayaya namah |
    om sarvahrinnilayaya namah | om bhutavasaya namah | om bhutabhavishyadbhavavarjitaya namah | om kalatitaya
    namah || || om kalaya namah | om kalakalaya namah | om kaladarpadamanaya namah | om mrityunjayaya
    namah | om amartyaya namah | om martyabhayapradaya namah | om jivadharaya namah | om sarvadharaya
    namah | om bhaktavasanasamarthaya namah | om bhaktavanapratijnaya namah || || om annavastradaya namah
    | om arogyakshemadaya namah | om dhanamangalyapradaya namah | om riddhisiddhidaya namah | om putramitrakalatrabandhudaya
    namah | om yogakshemavahaya namah | om apadbandhavaya namah | om margabandhave namah | om bhuktimuktisvargapavargadaya
    namah | om priyaya namah || || om pritivardhanaya namah | om antaryamine namah | om saccidatmane namah
    | om nityanandaya namah | om paramasukhadaya namah | om parameshvaraya namah | om parabrahmane namah
    | om paramatmane namah | om jnanasvarupine namah | om jagatahpitre namah || || om bhaktanammatridatripitamahaya
    namah | om bhaktabhayapradaya namah | om bhaktaparadhinaya namah | om bhaktanugrahakataraya namah
    | om sharanagatavatsalaya namah | om bhaktishaktipradaya namah | om jnanavairagyadaya namah | om premapradaya
    namah | om samshayahridaya daurbalya papakarmavasanakshayakaraya namah | om hridayagranthibhedakaya
    namah || || om karmadhvamsine namah | om shuddhasatvasthitaya namah | om gunatitagunatmane namah |
    om anantakalyanagunaya namah | om amitaparakramaya namah | om jayine namah | om durdharshakshobhyaya
    namah | om aparajitaya namah | om trilokeshu avighatagataye namah | om ashakyarahitaya namah || ||
    om sarvashaktimurtaye namah | om svarupasundaraya namah | om sulocanaya namah | om bahurupavishvamurtaye
    namah | om arupavyaktaya namah | om acintyaya namah | om sukshmaya namah | om sarvantaryamine namah
    | om manovagatitaya namah | om premamurtaye namah || || om sulabhadurlabhaya namah | om asahayasahayaya
    namah | om anathanathadinabandhave namah | om sarvabharabhrite namah | om akarmanekakarmasukarmine
    namah | om punyashravanakirtanaya namah | om tirthaya namah | om vasudevaya namah | om satangataye
    namah | om satparayanaya namah || || om lokanathaya namah | om pavananaghaya namah | om amritamshuve
    namah | om bhaskaraprabhaya namah | om brahmacaryatapashcaryadi suvrataya namah | om satyadharmaparayanaya
    namah | om siddheshvaraya namah | om siddhasankalpaya namah | om yogeshvaraya namah | om bhagavate
    namah || || om bhaktavatsalaya namah | om satpurushaya namah | om purushottamaya namah | om satyatattvabodhakaya
    namah | om kamadishadvairidhvamsine namah | om abhedanandanubhavapradaya namah | om samasarvamatasammataya
    namah | om shridakshinamurtaye namah | om shrivenkatesharamanaya namah | om adbhutanandacaryaya namah
    || || om prapannartiharaya namah | om samsarasarvaduhkhakshayakaraya namah | om sarvavitsarvatomukhaya
    namah | om sarvantarbahisthitaya namah | om sarvamangalakaraya namah | om sarvabhishtapradaya namah
    | om samarasanmargasthapanaya namah | om shrisamarthasadgurusayinathaya namah ||
  devanagari: ॐ श्री सायिनाथाय नमः । ॐ लक्ष्मीनारायणाय नमः । ॐ कृष्णरामशिवमारुत्यादिरूपाय नमः । ॐ शेषशायिने
    नमः । ॐ गोदावरीतटशिरडीवासिने नमः । ॐ भक्तहृदालयाय नमः । ॐ सर्वहृन्निलयाय नमः । ॐ भूतावासाय नमः । ॐ
    भूतभविष्यद्भाववर्जिताय नमः । ॐ कालातीताय नमः ॥ ॥ ॐ कालाय नमः । ॐ कालकालाय नमः । ॐ कालदर्पदमनाय नमः
    । ॐ मृत्युञ्जयाय नमः । ॐ अमर्त्याय नमः । ॐ मर्त्याभयप्रदाय नमः । ॐ जीवाधाराय नमः । ॐ सर्वाधाराय नमः
    । ॐ भक्तावसनसमर्थाय नमः । ॐ भक्तावनप्रतिज्ञाय नमः ॥ ॥ ॐ अन्नवस्त्रदाय नमः । ॐ आरोग्यक्षेमदाय नमः ।
    ॐ धनमाङ्गल्यप्रदाय नमः । ॐ ऋद्धिसिद्धिदाय नमः । ॐ पुत्रमित्रकलत्रबन्धुदाय नमः । ॐ योगक्षेमवहाय नमः
    । ॐ आपद्बान्धवाय नमः । ॐ मार्गबन्धवे नमः । ॐ भुक्तिमुक्तिस्वर्गापवर्गदाय नमः । ॐ प्रियाय नमः ॥ ॥ ॐ
    प्रीतिवर्धनाय नमः । ॐ अन्तर्यामिने नमः । ॐ सच्चिदात्मने नमः । ॐ नित्यानन्दाय नमः । ॐ परमसुखदाय नमः
    । ॐ परमेश्वराय नमः । ॐ परब्रह्मणे नमः । ॐ परमात्मने नमः । ॐ ज्ञानस्वरूपिणे नमः । ॐ जगतःपित्रे नमः
    ॥ ॥ ॐ भक्तानाम्मातृदातृपितामहाय नमः । ॐ भक्ताभयप्रदाय नमः । ॐ भक्तपराधीनाय नमः । ॐ भक्तानुग्रहकातराय
    नमः । ॐ शरणागतवत्सलाय नमः । ॐ भक्तिशक्तिप्रदाय नमः । ॐ ज्ञानवैराग्यदाय नमः । ॐ प्रेमप्रदाय नमः । ॐ
    संशयहृदय दौर्बल्य पापकर्मवासनाक्षयकराय नमः । ॐ हृदयग्रन्थिभेदकाय नमः ॥ ॥ ॐ कर्मध्वंसिने नमः । ॐ शुद्धसत्वस्थिताय
    नमः । ॐ गुणातीतगुणात्मने नमः । ॐ अनन्तकल्याणगुणाय नमः । ॐ अमितपराक्रमाय नमः । ॐ जयिने नमः । ॐ दुर्धर्षाक्षोभ्याय
    नमः । ॐ अपराजिताय नमः । ॐ त्रिलोकेषु अविघातगतये नमः । ॐ अशक्यरहिताय नमः ॥ ॥ ॐ सर्वशक्तिमूर्तये नमः
    । ॐ स्वरूपसुन्दराय नमः । ॐ सुलोचनाय नमः । ॐ बहुरूपविश्वमूर्तये नमः । ॐ अरूपव्यक्ताय नमः । ॐ अचिन्त्याय
    नमः । ॐ सूक्ष्माय नमः । ॐ सर्वान्तर्यामिने नमः । ॐ मनोवागतीताय नमः । ॐ प्रेममूर्तये नमः ॥ ॥ ॐ सुलभदुर्लभाय
    नमः । ॐ असहायसहायाय नमः । ॐ अनाथनाथदीनबन्धवे नमः । ॐ सर्वभारभृते नमः । ॐ अकर्मानेककर्मासुकर्मिणे नमः
    । ॐ पुण्यश्रवणकीर्तनाय नमः । ॐ तीर्थाय नमः । ॐ वासुदेवाय नमः । ॐ सताङ्गतये नमः । ॐ सत्परायणाय नमः
    ॥ ॥ ॐ लोकनाथाय नमः । ॐ पावनानघाय नमः । ॐ अमृतांशुवे नमः । ॐ भास्करप्रभाय नमः । ॐ ब्रह्मचर्यतपश्चर्यादि
    सुव्रताय नमः । ॐ सत्यधर्मपरायणाय नमः । ॐ सिद्धेश्वराय नमः । ॐ सिद्धसङ्कल्पाय नमः । ॐ योगेश्वराय नमः
    । ॐ भगवते नमः ॥ ॥ ॐ भक्तवत्सलाय नमः । ॐ सत्पुरुषाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ सत्यतत्त्वबोधकाय नमः
    । ॐ कामादिषड्वैरिध्वंसिने नमः । ॐ अभेदानन्दानुभवप्रदाय नमः । ॐ समसर्वमतसम्मताय नमः । ॐ श्रीदक्षिणामूर्तये
    नमः । ॐ श्रीवेङ्कटेशरमणाय नमः । ॐ अद्भुतानन्दचर्याय नमः ॥ ॥ ॐ प्रपन्नार्तिहराय नमः । ॐ संसारसर्वदुःखक्षयकराय
    नमः । ॐ सर्ववित्सर्वतोमुखाय नमः । ॐ सर्वान्तर्बहिस्थिताय नमः । ॐ सर्वमङ्गलकराय नमः । ॐ सर्वाभीष्टप्रदाय
    नमः । ॐ समरसन्मार्गस्थापनाय नमः । ॐ श्रीसमर्थसद्गुरुसायिनाथाय नमः ॥
