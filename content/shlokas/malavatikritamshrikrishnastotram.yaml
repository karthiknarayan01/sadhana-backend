id: malavatikritamshrikrishnastotram
category: stotram
name:
  english: malavatikritamshrikrishnastotram
  devanagari: मालावतिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: malavatikritam shrikrishnastotram malavatyuvaca | vande tam paramatmanam sarvakaranakaranam
    | vina yena shavah sarve pranino jagatitale || 9|| nirliptam sakshirupam ca sarvesham sarvakarmasu
    | vidyamanam na drishtam ca sarvaih sarvatra sarvada || 10|| yena srishta ca prakritih sarvadhara
    paratpara | brahmavishnushivadinam prasurya trigunatmika || 11|| jagatsrashta svayam brahma niyato
    yasya sevaya | pata vishnushca jagatam samhartta shankarah svayam || 12|| dhyayante yam surah sarve
    munayo manavastatha | siddhashca yoginah santah santatam prakriteh param || 13|| sakaram ca nirakaram
    param svecchamayam vibhum | varam varenyam varadam vararham varakaranam || 14|| tapahphalam tapobijam
    tapasam ca phalapradam | svayantapahsvarupam ca sarvarupam ca sarvatah || 15|| sarvadharam sarvabijam
    karma tatkarmanam phalam | tesham ca phaladataram tadbijam kshayakaranam || 16|| svayantejahsvarupam
    ca bhaktanugrahavigraham | sevadhyanam na ghatate bhaktanam vigraham vina || 17|| tattejo mandalakaram
    suryakotisamaprabham | ativa kamaniyam ca rupam tatra manoharam || 18|| navinaniradashyamam sharatpankajalocanam
    | sharatparvanacandrasyamishaddhasyasamanvitam || 19|| kotikandarpalavanyam liladhama manoharam |
    candanokshitasarvangam ratnabhushanabhushitam || 20|| dvibhujam muralihastam pitakausheyavasasam |
    kishoravayasam shantam radhakantamanantakam || 21|| gopanganaparivritam kutracinnirjane vane | kutracidrasamadhyastham
    radhaya parishevitam || 22|| kutracidgopavesham ca veshtitam gopabalakaih | shatasha
  devanagari: मालावतिकृतं श्रीकृष्णस्तोत्रम् मालावत्युवाच । वन्दे तं परमात्मानं सर्वकारणकारणम् । विना
    येन शवाः सर्वे प्राणिनो जगतीतले ॥ ९॥ निर्लिप्तं साक्षिरूपं च सर्वेषां सर्वकर्मसु । विद्यमानं न दृष्टं
    च सर्वैः सर्वत्र सर्वदा ॥ १०॥ येन सृष्टा च प्रकृतिः सर्वाधारा परात्परा । ब्रह्मविष्णुशिवादीनां प्रसूर्या
    त्रिगुणात्मिका ॥ ११॥ जगत्स्रष्टा स्वयं ब्रह्मा नियतो यस्य सेवया । पाता विष्णुश्च जगतां संहर्त्ता शङ्करः
    स्वयम् ॥ १२॥ ध्यायन्ते यं सुराः सर्वे मुनयो मनवस्तथा । सिद्धाश्च योगिनः सन्तः सन्ततं प्रकृतेः परम्
    ॥ १३॥ साकारं च निराकारं परं स्वेच्छामयं विभुम् । वरं वरेण्यं वरदं वरार्हं वरकारणम् ॥ १४॥ तपःफलं तपोबीजं
    तपसां च फलप्रदम् । स्वयन्तपःस्वरूपं च सर्वरूपं च सर्वतः ॥ १५॥ सर्वाधारं सर्वबीजं कर्म तत्कर्मणां फलम्
    । तेषां च फलदातारं तद्बीजं क्षयकारणम् ॥ १६॥ स्वयन्तेजःस्वरूपं च भक्तानुग्रहविग्रहम् । सेवाध्यानं न
    घटते भक्तानां विग्रहं विना ॥ १७॥ तत्तेजो मण्डलाकारं सूर्यकोटिसमप्रभम् । अतीव कमनीयं च रूपं तत्र मनोहरम्
    ॥ १८॥ नवीननीरदश्यामं शरत्पङ्कजलोचनम् । शरत्पार्वणचन्द्रास्यमीषद्धास्यसमन्वितम् ॥ १९॥ कोटिकन्दर्पलावण्यं
    लीलाधाम मनोहरम् । चन्दनोक्षितसर्वाङ्गं रत्नभूषणभूषितम् ॥ २०॥ द्विभुजं मुरलीहस्तं पीतकौशेयवाससम् ।
    किशोरवयसं शान्तं राधाकान्तमनन्तकम् ॥ २१॥ गोपाङ्गनापरिवृतं कुत्रचिन्निर्जने वने । कुत्रचिद्रासमध्यस्थं
    राधया परिषेवितम् ॥ २२॥ कुत्रचिद्गोपवेषं च वेष्टितं गोपबालकैः । शतश
