id: brahmanakritam04shivastotram
category: stotram
name:
  english: brahmanakritam04shivastotram
  devanagari: ब्रह्मणाकृतं०४शिवस्तोत्रम्
content:
  english: brahmana kritam 4 shivastotram brahmovaca | namaste'stu mahadeva bhutabhavya bhavashraya |
    namaste stutinityaya namastrailokyapaline || 11|| namah pavitradehaya sarvakalmashanashine | caracaraguro
    guhyaguhyanam ca prakashakrit || 12|| roga na yanti bhishajaih sarvarogavinashana | rauravajinasamvita
    vitashoka namo'stu te || 13|| varikallolasankshubdhamahabuddhivighattine | tvannamajapino deva na
    bhavanti bhavashrayah || 14|| namaste nityanityaya namastrailokyapalana | shankarayaprameyaya vyadhinam
    shamanaya ca || 15|| parayaparimeyaya sarvabhutapriyaya ca | yogeshvaraya devaya sarvapapakshayaya
    ca || 16|| namah sthanave siddhaya siddhavandistutaya ca | bhutasamsaradurgaya vishvarupaya te namah
    || 17|| phanindroktamahimne te phanindrangadadharine | phanindravaraharaya bhaskaraya namo namah ||
    18|| iti vamanapurane ekonanavatitamadhyayantargatam brahmana kritam shivastotram samaptam | vamanapurana
    | adhyaya 49
  devanagari: ब्रह्मणा कृतं ४ शिवस्तोत्रम् ब्रह्मोवाच । नमस्तेऽस्तु महादेव भूतभव्य भवाश्रय । नमस्ते स्तुतिनित्याय
    नमस्त्रैलोक्यपालिने ॥ ११॥ नमः पवित्रदेहाय सर्वकल्मषनाशिने । चराचरगुरो गुह्यगुह्यानां च प्रकाशकृत्
    ॥ १२॥ रोगा न यान्ति भिषजैः सर्वरोगविनाशन । रौरवाजिनसंवीत वीतशोक नमोऽस्तु ते ॥ १३॥ वारिकल्लोलसङ्क्षुब्धमहाबुद्धिविघट्टिने
    । त्वन्नामजापिनो देव न भवन्ति भवाश्रयाः ॥ १४॥ नमस्ते नित्यनित्याय नमस्त्रैलोक्यपालन । शङ्करायाप्रमेयाय
    व्याधीनां शमनाय च ॥ १५॥ परायापरिमेयाय सर्वभूतप्रियाय च । योगेश्वराय देवाय सर्वपापक्षयाय च ॥ १६॥ नमः
    स्थाणवे सिद्धाय सिद्धवन्दिस्तुताय च । भूतसंसारदुर्गाय विश्वरूपाय ते नमः ॥ १७॥ फणीन्द्रोक्तमहिम्ने
    ते फणीन्द्राङ्गदधारिणे । फणीन्द्रवरहाराय भास्कराय नमो नमः ॥ १८॥ इति वामनपुराणे एकोननवतितमाध्यायान्तर्गतं
    ब्रह्मणा कृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ४९
