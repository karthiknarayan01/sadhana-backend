id: anantha-padmanabha-swamy-ashtottara-sata-namavali
category: stotram
name:
  english: Anantha Padmanabha Swamy Ashtottara Sata Namavali
content:
  english: om krishnaya namah om kamalanathaya namah om vasudevaya namah om sanatanaya namah om vasudevatmajaya
    namah om punyaya namah om lilamanusha vigrahaya namah om vatsa kaustubhadharaya namah om yashodavatsalaya
    namah om hariye namah || || om caturbhujatta sakrasigada namah om shankhambujayudhayuja namah om devakinandanaya
    namah om shrishaya namah om nandagopapriyatmajaya namah om yamunaveda samharine namah om balabhadra
    priyanujaya namah om putanajivita haraya namah om shakatasura bhanjanaya namah om nandavrajajananandine
    namah || || om saccidananda vigrahaya namah om navanita viliptangaya namah om anaghaya namah om navanitaharaya
    namah om mucukunda prasadakaya namah om shodashastri sahasreshaya namah om tribhangine namah om madhurakrutaye
    namah om shukavagamritabdindave namah || || om govindaya namah om yoginampataye namah om vatsavaticaraya
    namah om anantaya namah om dhenukasura bhanjanaya namah om trinikrita trinavartaya namah om yamalarjuna
    bhanjanaya namah om uttalottalabhetre namah om tamalashyamala kritiye namah om gopagopishvaraya namah
    om yogine namah om kotisurya samaprabhaya namah || || om ilapataye namah om paranjyotishe namah om
    yadavendraya namah om yadudvahaya namah om vanamaline namah om pitavasane namah om parijatapaharakaya
    namah om govarthanaca loddartre namah om gopalaya namah om sarvapalakaya namah || || om ajaya namah
    om niranjanaya namah om kamajanakaya namah om kanjalocanaya namah om madhughne namah om madhuranathaya
    namah om dvarakanayakaya namah om baline namah om brindavananta sancarine namah || || tulasidamabhushanaya
    namah om shamantakamanerhartre namah om naranarayanatmakaya namah om kujja krishnambaradharaya namah
    om mayine namah om parama purushaya namah om mushtikasura canura namah om mallayuddavisharadaya namah
    om samsaravairine namah om kamsaraye namah om muraraye namah || || om narakantakaya namah om krishnavyasana
    karshakaya namah om shishupalashira ccetre namah om duryodana kulantakaya namah om vidurakruravaradaya
    namah om vishvarupapradarshakaya namah om satyavace namah om satyasankalpaya namah om satyabhamarataya
    namah om jayine namah om subhadra purvajaya namah || || om vishnave namah om bhishmamukti pradayakaya
    namah om jagadgurave namah om jagannathaya namah om venunada visharadaya namah om vrishabhasura vidvamsine
    namah om banasura karantakrite namah om yudhishtira pratishtatre namah om barhibarha vatamsakaya namah
    om pardhasaradiye namah || || om avyaktaya namah om gitamrita mahòdhadhiye namah om kaliya phanimanikyaram
    namah om jita shripadambujaya namah om damodaraya namah om yajna bhoktre namah om danavendra vinashakaya
    namah om narayanaya namah om parabrahmane namah om pannagashana vahanaya namah || || om jalakrida
    samasakta gopi vastrapahara kaya namah om punya shlokaya namah om tirdha krite namah om veda vedyaya
    namah om dayanidhaye namah om sarva tirdhatmakaya namah om sarvagra harupine namah om om paratparaya
    namah || || shri ananta padmanabha ashtottara shatanamavali sampurnam
