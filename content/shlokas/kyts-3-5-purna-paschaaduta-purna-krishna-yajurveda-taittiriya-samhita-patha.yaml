id: kyts-3-5-purna-paschaaduta-purna-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 3.5 Purna Paschaaduta Purna - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ntritiyakande pancamah prashnah shri gurubhyo namah
    | harih om || purna pashcaduta purna purastadu rnamasi jigaya | tasya va~santa uttame naka iha madayantam
    || yatte deva adadhu rbhagadheyamamavasye sam va~santo mahitva | sano yajna mpiprihi vishvavare rayi
    nno dhehi subhage suvira m ||niveshani sangamani vasunam vi~shva rupani vasu nyaveshayanti | sahasraposhagm
    subhaga rarana sa na agan vi~dana || agnishomau prathamau viryena vasu nrudranadityaniha jinvatam
    | maddhyagm hi pau mbrahmana vriddhau sukritena satavatha 'smabhyagm sahaviragm rayi nni yacchatam
    || adityashca shapurnamasau praiphsa nniruptagm havirasidatha ''ditya etau homavapashya ntavajuhavustato
    vai te dar purva a 'labhanta dar valabhamana etau homau purasta shapurnamasava labhate brahmavadino
    vadanti sa tvai dar shapurnamasava labheta ya enayoranu lomanca pratilomanca vidyadityamavasyaya urdhva
    rnamasyai praticina mpurvamalabheta pratilomamenava labheta kshiyeta sarasvatau homau kshiyeta sarasvatau
    homau purasta jjuhuyadamavasya vai sarasvatyanuloma mevainava labhate 'mumapyayamanamanva pyayata
    agnavaishnava mpurastannirvape thsarasvatyai carugm sarasvate dvadashakapalam gneyo bhavatyagnirvai
    yajnamukham shnavo bhavati yajno vai vishnuryajnameva ''rabhya pratanute sarasvatyai carurbhavati
    sarasvate dvadashakapalo 'mavasya vai sarasvati purnamasa ntaveva sakshada rabhata riddhnotya ssarasvate
    bhavati mithunatvaya praja tyai mithunau gavau dakshina samriddhyai || va~sishthah pratyakshamapashya
    nte vakshyami yatha tvatpurohitah prajah prajanishyante 'tha metarebhya rishibhyo ma pravoca iti tasma
    etan ttato vasishthapurohitah prajah prajayanta tasma dvasishtho brahma karyah praiva jayate rashmirasi
    kshayaya tva kshaya tyaha deva vai kshayo devebhya eva yajna ''ha pretirasi dharmaya tva dharma njinvetyaha
    manushya vai dharmo manushye ''hanvitirasi dive tva diva njinvetyahaibhya eva lokebhyo yajna njinvetyaha
    vrishtimeva 'sityaha mithunatvayoshigasi vasubhyastva vasu njinvetyahashtau vasava ekadasha rudra
    dvadasha ''ditya etavanto vai devastebhya eva yajna 'si pitribhyastva pitrin jinvetyaha devaneva pitrinanu
    santanoti tanturasi prajabhyastva praja jinve tyaha pitrineva praja anu santanoti pritanashadasi pashubhyastva
    pashunjinvetyaha praja eva pashunanu santanotirevadasyo rjinvetyahaushadhishveva pashu npratishthapayatyabhijidasi
    yuktagravendraya tvendra njinvetyahabhijitya adhipatirasi pranaya tva prana njinvetyaha prajasveva
    prana ndadhati trivridasi pravridasityaha mithunatvaya sagmroho 'si veshashrirasi vasyashtirasityaha
    pratishthityai || agnina devena pritana jayami gayatrena chandasa trivrita stomena rathantarena samna
    vashatkarena vajrena purvaja nbadhe pratyenannude ndveshti yanca vaya ndvishmo vishnoh kramena 'tyenan
    kramamindrena devena pritana jayami traishtubhena chandasa pancadashena stomena brihata samna vashatkarena
    vajrena vishvebhirdevebhih pritana vishvebhirdevebhih pritana jayami jagatena chandasa saptadashena
    stomena vamadevyena samna vashatkarena vajrena parajanindrena sayujo vayagm sasahyama pritanyatah
    | ghnanto vritranyaprati | yatte agne tejastenaha ntejasvi bhuyasam ya~tte agne varcastenaham va~rcasvi
    bhuyasam ya~tte agne harastenahagm harasvi bhuyasam || brihata samna vashatkarena vajrena ye deva
    yajnahano yajnamushah prithivyamaddhyasate | agnirma tebhyo rakshatu gacchema sukrito vayam || a 'ganma
    mitravaruna varenya ratrina mbhago yuvayoryo asti | naka ssukritasya loke tritiye prishthe adhi rocane
    divah || ye deva yajnahano yajnamusho 'ddhyasate | vayurma tebhyo rakshatu gacchema sukrito vayam
    || yaste ratri rdevayanirantara dyavaprithivi viyanti | grihaishca sarvaih prajaya nvagre suvo ruhanastarata
    rajagmsi || ye deva yajnahano yajnamusho divyaddhyasate | suryo ma tebhyo rakshatu gacchema sukrito
    vayam || yenendraya samabharah payagsyuttamena havisha jatavedah | tena 'gne tvamuta vardhayemagm
    sajatanag shraishthya a dhe hyenam || yajnahano vai deva yajnamusha ssanti ta eshu lokeshvasata adadana
    vimathnana yo dadati yo yajate tasya | ye deva yajnahanah prithivyamaddhyasate ye antarikshe ye divityahemaneva
    lokag lo~kametyapa vai somenejanaddevata shca yajnashca kramantyagneya mpancakapalamudavasaniya pankto
    yajno devata shcaiva yajnancava rundhegayatro va agnirgayatra chandasta nchandasa vyardhayati ya nkarotyashtakapalah
    karyo 'shtakshara gayatri gayatro nchandasa samardhayati panktyau yajyanuvakye bhavatah pankto yajnastenaiva
    yajnannaiti || stricatvarigmshacca suryo ma devo devebhyah patu vayurantariksha 'gnirma patu cakshushah
    | saksha shusha savitarvishvacar shana etebhih soma namabhirvidhema te tebhih soma namabhirvidhema
    te || aha njyotisha vi tamo vavara | yadantariksha 'bhudahagm suryamubhayato dadar ncyavayatindrah
    prasnautu maruto var shayantunnambhaya prithivi nnabhah | udno divyasya no dehishano visrija driti
    m || pashavo va ete yadaditya esha rudro yadagniroshadhih prasyagnavaditya njuhoti rudradeva pashunantardadhatyatho
    oshadhishveva pashu npratishthapayati kaviryajnasya vitanoti pantha nnakasya prishthe adhi rocane
    divah | yena havyam va~hasi yasi duta itah praceta amuta ssaniyan || yaste vishva ssantyagneyah prithivya
    mbarhishi surye yah | taste gacchantvahuti nghritasya devayate yajamanaya sharma || ashasana ssuviryagm
    rayasposhagg svashviyam | brihaspatina raya svagakrito mahyam ntva nahyami payasa ghritena sa ntva
    nahyamyapa oshadhibhih | sa ntva nahyami prajaya kshita sanavo vajamasme || praitu brahmanaspatni
    vedim va~rnena sidatu | athahamanukamini sve loke visha iha || suprajasastva vayagm supatnirupa sedima
    | agne sapatnadambhanamadabdhaso ada vi~shyami varunasya pasham ~yamabaddhnita savita suketah | dhatushca
    yonau sukritasya loke syona mme saha patya karomi || prehyudehyritasya vamiranvagniste nnayatvaditirmaddhya
    ndadatagm rudravasrishta 'si yuva nama ma ma higmsirvasubhyo rudrebhya adityebhyo vishve bhyo vo devebhyah
    pannejanirgrihnami yajnaya vah pannejani ssadayami vishvasya te vishvavato vrishniyavata gne vamiranu
    sadrimshi vishva retagmsi dhishiya yajno ni devirdevebhyo yajnamashishannasmin thsunvati yajamana
    ashisha ssamudreshtha gandharvamatishthatanu | vatasya patmannida iditah || vashatkaro vai gayatriyai
    shiro mpravishathsa khadiro ssruvo bhavati chandasameva rasenava dyati sarasa asya ''hutayo bhavanti
    tritiyasyamito divi soma asi ttasya parnamacchidyata ta tparnasya parnatvam ya~sya parnamayi juhu
    rbhavati saumya asya ''hutayo bhavanti jushante 'sya deva ahutirdeva vai brahmannavadanta ta thsushrava
    vai nama yasya parnamayi juhurbhavati na papagg shlokagm shrinoti brahma vai parno vinmaruto 'shvattho
    yasya parnamayi juhurbhavatya brahmanaivannamava rundhe eva vishyaddhyuhati va vishyaddhyuhati rashtram
    vai~ parno vidashvattho ya tparnamayi juhurbhavatya drashtrameva vishyaddhyuhati prajapatirva ajuho
    ''hutih pratyatishtha ttato vikankata udatishtha ttatah praja asrijata yasya vaikankati dhruva bhavati
    pratyavasya ''hutayastishthantyatho praiva jayata etadvai srucagm rupam ssruco bhavanti sarva nyevainagm
    rupani pashunamupatishthante nasyapa 'si prajapataye tva jyotishmate jyotishmanta ngrihnami dakshaya
    dakshavridhe rata 'gni jihvebhyastvartayubhya indrajyeshthebhyo varunarajabhyo vatapibhyah parjanya
    'ntarikshaya tva prithivyai tva 'pa jijyasato jahyapa yo no njahi pranaya tva 'panaya tva vyanaya
    tva sate tva 'dbhyastvaushadhibhyo vishve bhyastva bhutebhyo yatah praja akkhidra ajayanta tasmai
    tva prajapataye vibhudavamne jyotishmate jyotishmanta va~ addhvaryushca yajamanashca devatamantaritastasya
    a vrishcyete prajapatya ssarva devata devata bhya eva nihnuvate jyeshtho va esha grahanam ya~syaisha
    grihyate jyaishthyameva gacchati sarvasam va~ etaddevatanagm rupam ya~desha graho yasyaisha grihyate
    sarva nyevainagm rupani pashunamupatishthanta upayamagrihito 'si prajapataye tva jyotishmate jyotishmanta
    ngrihnamityaha jyotirevainagm samanana jihvebhyastvartayubhya ityahaitavatirvai devatastabhya evainagm
    sarva ndra dvishato mana ityaha bhratrivyapanuttyai pranaya tva 'panaya tvetyaha prananeva yajamane
    dadhati tasmai tva prajapataye vibhudavamne jyotishmate jyotishmanta bhyo juhotyajyagraha ttejaskamasya
    tejo va ajya ntejasvyeva bhavati somagraha dbrahmavarcasakamasya brahmavarcasam brahmavarcasyeva bhavati
    dadhigraha tpashukamasyorgvai daddhyur kpashava urjaivasma urja tve kratumapi vrinjanti vishve dviryadete
    tri ssvaduna srija samata u shu madhu madhuna 'bhi yodhi | upayamagrihito 'si prajapataye tva jushta
    ngrihnamyesha te yonih prajapataye tva || pranagraha ngrihnatyetavadva asti yavadete graha sstomashchandagmsi
    prishthani disho yavadevasti ta dava rundhe jyeshtha va eta hmanah pura vidamakra tteshagm sarva disho
    yasyai te grihyante jyaishthyameva gacchatyabhi disho jayati panca grihyante panca disha vriddhnuvanti
    navanava grihyante nava vai purushe pranah prananeva yajamaneshu dadhati prayaniye codayaniye ca grihyante
    prana vai pranagrahah prana vai pranagrahah pranaireva prayanti pranairudyanti dashame ngrihyante
    prana vai pranagrahah pranebhyah khalu va eta tpraja yanti yadvamadevyam yo~neshcyavate dashame pra
    devandevya dhiya bharata jatavedasam | havya no vakshadanushak || ayamu shya pradevayur hota yajnaya
    niyate | ratho na yorabhivrito ghrinivan cetati tmana || ayamagnirurushyatyamritadiva janmanah | sahasashci
    ndevo jivatave kritah || idayastva pade vaya nnabha prithivya adhi | jatavedo ni dhimahyagne havyaya
    vodhave | ssvanika devairurnavanta nghritavantagm savitre yajna nnaya yajamanaya sadhu || sida hota
    ssva u loke cikitvan thsadaya yajnagm sukritasya yonau havisha yajasyagne briha dyajamane vayo dhah
    || ni hota hotrishadane vidanastvesho didivagm asada thsudakshah | adabdhavrata shshucijihvo agnih
    || tva u nah paraspastvam mu nah paraspastvam va~sya a vrishabha praneta | agne tokasya nastane tanunamaprayuccha
    ndidyadbodhi gopah || abhi tva deva savitarishanam nbhagamimahe || mahi dyauh prithivi cana imam mmimikshatam
    | piprita nno bharimabhih || tvamagne pushkaradaddhyatharva niramanthata | murdhno vishvasya vaghatah
    || tamu tva daddhyannrishih tva daddhyannrishih putra idhe atharvanah | vritrahana mpurandaram ||
    tamu tva pathyo vrisha samidhe dasyuhantamam | dhana njayagm ranerane || uta bruvantu jantava udagnirvritraha
    njayo ranerane || a yagm haste na khadinagm shishu nna bibhrati | vishamagnigg svaddhvaram || pradeva
    ndevavitaye bharata vasuvittamam | asve yonau ni shidatu || a njatavedasi priyagm shishita 'tithim
    | syona a grihapatim || agnina ssamiddhyate kavirgrihapatiryuva hyagne agnina vipro viprena san thsata
    | sakha sakhya samiddhyase mmarjayanta sukratu mpuroyavanamajishu | sveshu kshayeshu vajina m || yajnena
    yajnamayajanta devastani dharmani prathamanyasann | te ha naka mmahimanah sacante yatra purve saddhya
    || krishna yajurvediya taittiriya samhitaya ntritiyakande pancamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे पञ्चमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ पू॒र्णा प॒श्चादु॒त पू॒र्णा पु॒रस्ता॒दु र्णमा॒सी जि॑गाय । तस्या वँस॑न्त उत्त॒मे नाक॑ इ॒ह मा॑दयन्ताम्
    ॥ यत्ते॑ दे॒वा अद॑धु र्भाग॒धेय॒ममा॑वास्ये सं॒ वँस॑न्तो महि॒त्वा । सानो॑ य॒ज्ञ म्पि॑पृहि विश्ववारे
    र॒यि न्नो॑ धेहि सुभगे सु॒वीर म् ॥नि॒वेश॑नी स॒ङ्गम॑नी॒ वसू॑नां॒ विँश्वा॑ रू॒पाणि॒ वसू न्यावे॒शय॑न्ती
    । स॒ह॒स्र॒पो॒षग्ं सु॒भगा॒ ररा॑णा॒ सा न॒ आग॒न् विँदा॒ना ॥ अग्नी॑षोमौ प्रथ॒मौ वी॒र्ये॑ण॒ वसू न्रु॒द्राना॑दि॒त्यानि॒ह
    जि॑न्वतम् । मा॒द्ध्यग्ं हि पौ म्ब्रह्म॑णा वृ॒द्धौ सु॑कृ॒तेन॑ सा॒तावथा॒ ऽस्मभ्यग्ं॑ स॒हवी॑राग्ं र॒यि
    न्नि य॑च्छतम् ॥ आ॒दि॒त्याश्चा शपूर्णमा॒सौ प्रैफ्स॒ न्निरु॑प्तग्ं ह॒विरासी॒दथा॑ ऽऽदि॒त्या ए॒तौ होमा॑वपश्य॒
    न्ताव॑जुहवु॒स्ततो॒ वै ते द॑र् पूर्व॒ आ ऽल॑भन्त दर् वा॒लभ॑मान ए॒तौ होमौ॑ पु॒रस्ता शपूर्णमा॒सावा ल॑भते
    ब्रह्मवा॒दिनो॑ वदन्ति॒ स त्वै द॑र् शपूर्णमा॒सावा ल॑भेत॒ य ए॑नयोरनु लो॒मञ्च॑ प्रतिलो॒मञ्च॑ वि॒द्यादित्य॑मावा॒स्या॑या
    ऊ॒र्ध्व र्णमा॒स्यै प्र॑ती॒चीन॒ म्पूर्वा॑मा॒लभे॑त प्रतिलो॒ममे॑ना॒वा ल॑भेता॒ क्षी॒ये॒त॒ सा॒र॒स्व॒तौ
    होमौ॑ क्षीयेत सारस्व॒तौ होमौ॑ पु॒रस्ता ज्जुहुयादमावा॒स्या॑ वै सर॑स्वत्यनुलो॒म मे॒वैना॒वा ल॑भते॒ ऽमुमा॒प्याय॑मान॒मन्वा
    प्या॑यत आग्नावैष्ण॒व म्पु॒रस्ता॒न्निर्व॑पे॒ थ्सर॑स्वत्यै च॒रुग्ं सर॑स्वते॒ द्वाद॑शकपालं॒ ग्ने॒यो भव॑त्य॒ग्निर्वै
    य॑ज्ञमु॒खं ष्ण॒वो भव॑ति य॒ज्ञो वै विष्णु॑र्य॒ज्ञमे॒वा ऽऽरभ्य॒ प्रत॑नुते॒ सर॑स्वत्यै च॒रुर्भ॑वति॒ सर॑स्वते॒
    द्वाद॑शकपालो ऽमावा॒स्या॑ वै सर॑स्वती पू॒र्णमा॑स॒ न्तावे॒व सा॒क्षादा र॑भत ऋ॒द्ध्नोत्या स्सर॑स्वते भवति
    मिथुन॒त्वाय॒ प्रजा त्यै मिथु॒नौ गावौ॒ दक्षि॑णा॒ समृ॑द्ध्यै ॥ वँसि॑ष्ठः प्र॒त्यक्ष॑मपश्य॒ न्ते वक्ष्यामि॒
    यथा॒ त्वत्पु॑रोहिताः प्र॒जाः प्र॑जनि॒ष्यन्ते ऽथ॒ मेत॑रेभ्य॒ ऋषि॑भ्यो॒ मा प्रवो॑च॒ इति॒ तस्मा॑ ए॒तान्
    त्ततो॒ वसि॑ष्ठपुरोहिताः प्र॒जाः प्राजा॑यन्त॒ तस्मा द्वासि॒ष्ठो ब्र॒ह्मा का॒र्यः॑ प्रैव जा॑यते र॒श्मिर॑सि॒
    क्षया॑य त्वा॒ क्षय॑ त्या॑ह दे॒वा वै क्षयो॑ दे॒वेभ्य॑ ए॒व य॒ज्ञ ऽऽह॒ प्रेति॑रसि॒ धर्मा॑य त्वा॒ धर्म॑
    ञ्जि॒न्वेत्या॑ह मनु॒ष्या॑ वै धर्मो॑ मनु॒ष्ये ऽऽहान्वि॑तिरसि दि॒वे त्वा॒ दिव॑ ञ्जि॒न्वेत्या॑है॒भ्य
    ए॒व लो॒केभ्यो॑ य॒ज्ञ ञ्जि॒न्वेत्या॑ह॒ वृष्टि॑मे॒वा ऽसीत्या॑ह मिथुन॒त्वायो॒शिग॑सि॒ वसु॑भ्यस्त्वा॒ वसू
    ञ्जि॒न्वेत्या॑हा॒ष्टौ वस॑व॒ एका॑दश रु॒द्रा द्वाद॑शा ऽऽदि॒त्या ए॒ताव॑न्तो॒ वै दे॒वास्तेभ्य॑ ए॒व य॒ज्ञ
    ऽसि पि॒तृभ्य॑स्त्वा पि॒तॄन् जि॒न्वेत्या॑ह दे॒वाने॒व पि॒तॄननु॒ सन्त॑नोति॒ तन्तु॑रसि प्र॒जाभ्य॑स्त्वा
    प्र॒जा जि॒न्वे त्या॑ह पि॒तॄने॒व प्र॒जा अनु॒ सन्त॑नोति पृतना॒षाड॑सि प॒शुभ्य॑स्त्वा प॒शूञ्जि॒न्वेत्या॑ह
    प्र॒जा ए॒व प॒शूननु॒ सन्त॑नोतिरे॒वद॒स्यो र्जि॒न्वेत्या॒हौष॑धीष्वे॒व प॒शू न्प्रति॑ष्ठापयत्यभि॒जिद॑सि
    यु॒क्तग्रा॒वेन्द्रा॑य॒ त्वेन्द्र॑ ञ्जि॒न्वेत्या॑हा॒भिजि॑त्या॒ अधि॑पतिरसि प्रा॒णाय॑ त्वा प्रा॒ण ञ्जि॒न्वेत्या॑ह
    प्र॒जास्वे॒व प्रा॒णा न्द॑धाति त्रि॒वृद॑सि प्र॒वृद॒सीत्या॑ह मिथुन॒त्वाय॑ सग्ंरो॒हो॑ ऽसि॒ वेष॑श्रिरसि॒
    वस्य॑ष्टिर॒सीत्या॑ह॒ प्रति॑ष्ठित्यै ॥ अ॒ग्निना॑ दे॒वेन॒ पृत॑ना जयामि गाय॒त्रेण॒ छन्द॑सा त्रि॒वृता॒
