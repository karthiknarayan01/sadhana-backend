id: vivekanandastotram-2
category: stotram
name:
  english: vivekanandastotram 2
  devanagari: विवेकानन्दस्तोत्रम् २
content:
  english: shrivivekanandastotram prakatashariramisham bhavabharanivasam parahitakalitalalita lilabhasam
    | candramaulinatanatha narendram gurumiha shambhu mir̤ae || 1|| vivekaviragaghanam shrutivispharanetram
    galitamihirakararanjitagatram | candramaulinatanatha narendram gurumiha shambhu mir̤ae || 2|| chinnajanmajaravinasha
    paksham karunakatakshavinikshepadaksham | candramaulinatanatha narendram gurumiha shambhu mir̤ae ||
    3|| gurugatajivitamaho tyaktakamakancanam mayinamiva kada vyaktamavyaktam | candramaulinatanatha narendra
    gurumiha shambhu mir̤ae || 4|| shirodhritapratipaccandrakalam salilam jnanabhaktikritiyogaikacittam
    | candramaulinatanatha narendram gurumiha shambhu mir̤ae || 5|| iti shrisharaccandra cakravartiviracitam
  devanagari: श्रीविवेकानन्दस्तोत्रम् प्रकटशरीरमीशं भवभारनिवासं परहितकलितललित लीलाभासम् । चन्द्रमौलिनटनाथ
    नरेन्द्रं गुरुमिह शम्भु मीड़ए ॥ १॥ विवेकविरागघनं श्रुतिविस्फारनेत्रं गलितमिहिरकररञ्जितगात्रम् । चन्द्रमौलिनटनाथ
    नरेन्द्रं गुरुमिह शम्भु मीड़ए ॥ २॥ छिन्नजन्मजराविनाश पक्षं करुणाकटाक्षविनिक्षेपदक्षम् । चन्द्रमौलिनटनाथ
    नरेन्द्रं गुरुमिह शम्भु मीड़ए ॥ ३॥ गुरुगतजीवितमहो त्यक्तकामकाञ्चनं मायिनमिव कदा व्यक्तमव्यक्तम् ।
    चन्द्रमौलिनटनाथ नरेन्द्र गुरुमिह शम्भु मीड़ए ॥ ४॥ शिरोधृतप्रतिपच्चन्द्रकलं सलीलं ज्ञानभक्तिकृतियोगैकचित्तम्
    । चन्द्रमौलिनटनाथ नरेन्द्रं गुरुमिह शम्भु मीड़ए ॥ ५॥ इति श्रीशरच्चन्द्र चक्रवर्तिविरचितं
