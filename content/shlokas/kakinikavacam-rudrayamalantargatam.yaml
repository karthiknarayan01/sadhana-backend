id: kakinikavacam-rudrayamalantargatam
category: kavacha
name:
  english: kakinikavacam (rudrayamalantargatam)
  devanagari: काकिनीकवचम् (रुद्रयामलान्तर्गतम्)
content:
  english: 43|| pranakhyam shuklapadme niravadhinilayam shakinim pitavastram sukshmam bhushatirudrodbhavatanucapalam
    cancalam siddhilolam | hastaih padmaishcaturbhih sunayanakamalairbhasamanam shivadhyam padmabhitipracandasicasahitam
    shakamatam bhajami || 76
  devanagari: ४३॥ प्राणाख्यां शुक्लपद्मे निरवधिनिलयां शाकिनीं पीतवस्त्रां सूक्ष्मां भूषातिरुद्रोद्भवतनुचपलां
    चञ्चलां सिद्धिलोलाम् । हस्तैः पद्मैश्चतुर्भिः सुनयनकमलैर्भासमानां शिवाढ्यां पद्माभीतिप्रचण्डासिचसहितां
    शाकमातां भजामि ॥ ७६
meaning: {}
