id: annamayya-keerthanas-emoko-chigurutadharamuna
category: stotram
name:
  english: Annamayya Keerthanas Emoko Chigurutadharamuna
content:
  english: adi pallavi emòko cigurutadharamuna èdanèdakasturi nindènu | bhamini vibhunaku vrasina patrika
    kadu kada || caranam kaliki cakorakshiki kadakannulu kèmpaitocina | cèluvambippudidemo cintimparecèlulu
    | naluvuna praneshvarunipai natinayakònacupulu | niluvunapèrukaganantina nètturukadukada || emòko
    cigurutadharamuna èdanèdakasturi nindènu | bhamini vibhunaku vrasina patrika kadu kada || caranam
    padatiki canugavamèrugulu paipai payyèda vèlupala | kadumincina vidhamemo kanugònare cèlulu | vudugani
    vedukato priyudòttina nakhashashirekhalu | vèdalagavesavikalapu vènnèlakadukada || caranam muddiya
    cèkkula kèlakula mutyapu jallula cerpula | vòddikalagulivemo uhimpare cèlulu | gaddari tiruvenkatapati
    kògitiyadharamritamula | addina suratapu cèmatala andamu kadu kada || emòko cigurutadharamuna èdanèdakasturi
    nindènu | bhamini vibhunaku vrasina patrika kadu kada ||
  devanagari: आदि पल्लवि एमॊको चिगुरुटधरमुन ऎडनॆडकस्तूरि निण्डॆनु । भामिनि विभुनकु व्रासिन पत्रिक कादु
    कदा ॥ चरणं कलिकि चकोराक्षिकि कडकन्नुलु कॆम्पैतोचिन । चॆलुवम्बिप्पुडिदेमो चिन्तिम्परेचॆलुलु । नलुवुन
    प्राणेश्वरुनिपै नाटिनयाकॊनचूपुलु । निलुवुनपॆरुकगनण्टिन नॆत्तुरुकादुकदा ॥ एमॊको चिगुरुटधरमुन ऎडनॆडकस्तूरि
    निण्डॆनु । भामिनि विभुनकु व्रासिन पत्रिक कादु कदा ॥ चरणं पडतिकि चनुगवमॆरुगुलु पैपै पय्यॆद वॆलुपल ।
    कडुमिञ्चिन विधमेमो कनुगॊनरे चॆलुलु । वुडुगनि वेडुकतो प्रियुडॊत्तिन नखशशिरेखलु । वॆडलगवेसविकालपु वॆन्नॆलकादुकदा
    ॥ चरणं मुद्दिय चॆक्कुल कॆलकुल मुत्यपु जल्लुल चेर्पुल । वॊद्दिकलागुलिवेमो ऊहिम्परे चॆलुलु । गद्दरि
    तिरुवेङ्कटपति कॊगिटियधरामृतमुल । अद्दिन सुरतपु चॆमटल अन्दमु कादु कदा ॥ एमॊको चिगुरुटधरमुन ऎडनॆडकस्तूरि
    निण्डॆनु । भामिनि विभुनकु व्रासिन पत्रिक कादु कदा ॥
