id: kyts-jata-4-3-apaan-tvemanthsaadayaami-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.3 Apaan Tvemanthsaadayaami - Krishna Yajurveda Taittiriya Samhita
content:
  english: ntva tvemann | thsadayami sadaya myema sadaya myapa mapagm sadayami sadaya myapam | ntva tvodmann
    | thsadayami sadaya myodma sadaya myapa mapagm sadayami sadaya myapam | ntva tva bhasmann | thsadayami
    sadayami bhasma sadaya myapa mapagm sadayami sadaya myapam | tva jyotishi jyotishi tva tva jyotishi
    | jyotishi sadayami sadayami jyotishi jyotishi sadayami | sadaya myapa mapagm sadayami sadaya myapam
    | tva 'yane 'yane tva tva 'yane | ayane sadayami sadaya myayane 'yane sadayami | 'rnave sadayami sadaya
    myarnave | arnave sadane sadane 'rnave sadane sida sida sadane sadane sida | sida samudre samudre
    sida sida samudre | samudre sadane sadane samudre samudre sadane | sadane sida sida sadane sadane
    sida | sida salile salile sida sida salile | salile sadane sadane salile salile sadane | sadane sida
    sida sadane sadane sida | sidapa mapagm sida sidapam | nkshaye kshaye 'pa mapa kshaye sida sida kshaye
    kshaye sida | sidapa mapagm sida sidapam | apagm sadhishi sadhi shyapa mapagm sadhishi | sadhishi
    sida sida sadhishi sadhishi sida | sidapa mapagm sida sidapam | tva sadane sadane tva tva sadane |
    sadane sadayami sadayami sadane sadane sadayami | sadaya myapa mapagm sadayami sadaya myapam | tva
    sadhasthe sadhasthe sadhasthe sadayami sadayami sadhasthe sadhasthe sadayami | sadaya myapa mapagm
    sadayami sadaya myapam | tva purishe purishe tva tva purishe | purishe sadayami sadayami purishe purishe
    sadayami | sadaya myapa mapagm sadayami sadaya myapam | yonau sadayami sadayami yonau yonau sadayami
    | sadaya myapa mapagm sadayami sadaya myapam | tva pathasi pathasi tva tva pathasi | pathasi sadayami
    sadayami pathasi pathasi sadayami | sadayami gayatri gayatri sadayami sadayami gayatri | gayatri chanda
    shchando gayatri gayatri chandah | pchanda shchanda strishtup | pchanda shchanda strishtu chando jagati
    jagati chanda shchando jagati | jagati chanda shchando jagati jagati chandah | chando 'nushtu banushtu
    pchanda shchando 'nushtup | pchanda shchando 'nushtu banushtu chandah panktih pankti shchanda shchandah
    panktih | pankti shchanda shchandah panktih pankti shchandah | chanda iti chandah | || mpurah puro
    'ya maya puro bhuvo bhuvah purah puro bhuvah | bhuva stasya tasya bhuvo bhuva stasya | tasya pranah
    prana stasya tasya pranah | prano bhauvayano bhauvayanah pranah prano bhauvayanah | bhauvayano vasanto
    vasanto bhauvayano bhauvayano vasantah | vasantah pranayanah pranayano vasanto vasantah pranayanah
    | pranayano gayatri gayatri pranayanah pranayano gayatri | gayatri vasanti vasanti gayatri gayatri
    vasanti | vasanti gayatriyai gayatriyai vasanti vasanti gayatriyai | gayatriyai gayatra ngayatriyai
    gayatriyai gayatram | gayatra dupagmshu rupagmshu dgayatra dupagmshuh | upagmshu rupagmsho rupagmsho
    rupagmshu rupagmshu rupagmshoh | upagmsho strivri ttrivri dupagmsho rupagmsho strivrit | ttrivrita
    strivrita strivri trivrito rathantaragm rathantara ntrivrita strivrito rathantaram | rathantaragm
    rathantara drathantaragm rathantaragm rathantarat | dvasishtho vasishtho rathantara vasishtha rishir
    rishi rvasishtho vasishtha rishih | rishih prajapatigrihitaya prajapatigrihitaya r shirrishih prajapatigrihitaya
    | prajapatigrihitaya tvaya tvaya prajapatigrihitaya prajapatigrihitaya tvaya prajapatigrihitayeti
    prajapati ngrihnami grihnami prana grihnami prajabhyah prajabhyo grihnami grihnami prajabhyah | mprajabhyah
    prajabhyo 'yam | ndakshina dakshina 'ya maya dakshina vishvakarma vishvakarma dakshina dakshina vishvakarma
    | vishvakarma tasya tasya vishvakarma vishvakarma tasya | vishvakarmeti vishva tasya mano mana stasya
    tasya manah | mmano mano vaishvakarmanam | ngrishmo grishmo vai vaishvakarmanamiti vaishva grishmo
    manaso manaso grishmo grishmo manasah | mmanaso mana sastrishtuk | trishtug graishmi graishmi trishtu
    ktrishtug graishmi | graishmi trishtubha strishtubho graishmi graishmi trishtubhah | trishtubha aida
    maida ntrishtubha strishtubha aidam | aida maida daida daida maida maidat | 'ntaryama aida daida dantaryamah
    | 'ntaryama dantaryama dantaryamo antaryama ityantah tpancadashah pancadasho 'ntaryama dantaryama
    antaryamadityantah pancadashah pancadasha tpancadashah pancadashah pancadashat | pancadashaditi panca
    dbrihato brihato briha brihato bharadvajo bharadvajo brihato brihato bharadvajah | bharadvaja rishir
    rishi rbharadvajo bharadvaja rishih | rishih prajapatigrihitaya prajapatigrihitaya r shir rishih prajapatigrihitaya
    | prajapatigrihitaya tvaya tvaya prajapatigrihitaya prajapatigrihitaya tvaya prajapatigrihitayeti
    prajapati tvaya mano mana stvaya tvaya manah | mano grihnami grihnami mano mano grihnami | || grihnami
    prajabhyah prajabhyo grihnami grihnami prajabhyah | mprajabhyah prajabhyo 'yam | dvishvavyaca vishvavyacah
    pashca vishvavyaca stasya tasya vishvavyaca vishvavyaca stasya | vishvavyaca iti vishva tasya cakshu
    shcakshu stasya tasya cakshuh | va~rshani varshani vaishvavyacasam vaishvavyacasamiti vaishva varshani
    cakshushani cakshushani varshani varshani cakshushani | cakshushani jagati jagati cakshushani cakshushani
    jagati | jagati varshi varshi jagati jagati varshi | varshi jagatya jagatya varshi varshi jagatyah
    | jagatya rikshama mrikshama njagatya jagatya rikshamam | rikshama mrikshama drikshama drikshama mrikshama
    mrikshamat | shshukra rikshama drikshama cchukrah | shshukra cchukra cchukra vai~rupagm saptadasha
    saptadashaditi sapta dvishvamitro vishvamitro vairupa vishvamitra rishir rishi rvishvamitro vishvamitra
    rishih | vishvamitra iti vishva rishih prajapatigrihitaya prajapatigrihita yar shirrishih prajapatigrihitaya
    | prajapatigrihitaya tvaya tvaya prajapatigrihitaya prajapatigrihitaya tvaya prajapatigrihitayeti
    prajapati tvaya cakshu shcakshu stvaya tvaya cakshuh | rgrihnami grihnami cakshu shcakshu grihnami
    prajabhyah prajabhyo grihnami grihnami prajabhyah | mprajabhyah prajabhya idam | ida muttara duttara
    dida mida muttarat | ssuva ruttara duttara suva stasya tasya suva tasya shrotragg shrotra ntasya tasya
    shrotra shrotragm sauvagm sauvagg shrotragg shrotragm sauvam | thsauvagm sauvagm sharat | sharac chrautri
    shrautri shara cchara cchrautri | shrautrya nushtu banushtu pchrautri shrautrya nushtup | pcharadi
    sharadya nushtu banushtu shara dyanushtubho 'nushtubhah sharadi shara dyanushtubhah | anushtubhah
    svaragg svara manushtubho 'nushtubhah svaram | nmanthi manthi svara manthi manthino manthino manthi
    manthi manthinah | manthina ekavigmsha ekavigmsho manthino manthina ekavigmshah | ekavigmsha ekavigmsha
    dekavigmsha dekavigmsha ekavigmsha ekavigmshat | ekavigmsha ityeka vai~raja mekavigmsha dekavigmsha
    ekavigmshadityeka vairajaj jamadagni dvairajaj jamadagnih | jamadagnir rishir rishi rjamadagnirrishih
    | rishih prajapatigrihitaya prajapatigrihitayar shirrishih prajapatigrihitaya | prajapatigrihitaya
    tvaya tvaya prajapatigrihitaya prajapatigrihitaya tvaya prajapatigrihitayeti prajapati tvaya shrotragg
    shrotra ntvaya tvaya shrotra ngrihnami grihnami shrotragg shrotra grihnami prajabhyah prajabhyo grihnami
    grihnami prajabhyah | mprajabhyah prajabhya iyam | iya muparyupa riya miya mupari | rmati ruparyupari
    matih | mati stasyai tasyai mati ktasyai tasyai vak | mmati mati vag va mati hemanto hemanto mati
    mati hemantah | cyayano hemanto hemanto va vacyayanah panktih pankti cyayanah panktih | haimanti haimanti
    panktih panktir haimanti panktyai panktyai haimanti haimanti panktyai | tpanktyai panktyai nidhanavat
    | nnidhanavato nidhanavato nidhanava nidhanavaditi nidhana grayano nidhanavato nidhanavata agrayanah
    | nidhanavata iti nidhana ttrinavatrayastrigmshau trinavatrayastrigmsha va ttrinavatrayastrigmshau
    | trinavatrayastrigmshau trinavatrayastrigmshabhya ntrinavatrayastrigmshabhya ntrinavatrayastrigmshau
    trinavatrayastrigmshau trinavatrayastrigmshabhya trinavatrayastrigmshaviti trinava trayastrigmshau
    | trinavatrayastrigmshabhyagm shakvararaivate sha kvararaivate trinavatrayastrigmshabhya ntrinavatrayastrigmshabhyagm
    shakvararaivate | trinavatrayastrigmshabhyamiti trinava trayastrigmshabhya kvararaivatabhyagm shakvararaivatabhyagm
    shakvararaivate sha shakvararaivate iti shakvara shakvararaivatabhyam vi~shvakarma vishvakarma shakvararaivatabhyagm
    shakvararaivatabhyam shakvararaivatabhyamiti shakvara rvishvakarma vishvakarma r vishvakarmeti vishva
    rishih prajapatigrihitaya prajapatigrihitaya r shir rishih prajapatigrihitaya | prajapatigrihitaya
    tvaya tvaya prajapatigrihitaya prajapatigrihitaya tvaya prajapatigrihitayeti prajapati ngrihnami grihnami
    vacam grihnami prajabhyah prajabhyo grihnami grihnami prajabhyah | mpraci praci disham | va~santo
    vasanto disha vasanta rituna mritunam va~santo vasanta ritunam | rituna magni ragnir rituna mrituna
    magnih | rdevata devata 'gni ragni devata brahma brahma devata devata brahma | mbrahma brahma dravinam
    | u pancadashavartanih pancadashavartaniru vu pancadashavartanih | pancadashavartani stryavi stryavih
    pancadashavartanih pancadashavartani stryavih | pancadashavartaniriti pancadasha rvayo vaya stryavi
    stryavi mpurovatah purovato 'yana mayana purovato vato vatah purovatah purovato vatah | purovata iti
    purah ssanago vato vata rdakshina dakshina r ndakshina dakshina disham | ngrishmo grishmo disha grishma
    rituna mrituna ngrishmo grishma ritunam | rituna mindra indra rituna mrituna mindrah | indro devata
    deva tendra indro devata mpancadashah pancadasho dravina sstomah pancadashah pancadasha ssaptadashavartaniru
    vu saptadashavartanih | saptadashavartaniriti saptadasha dvayo vayo dityava dityavaditi ditya vaya
    streta treta vayo vaya streta treta 'yana mayana ntreta treta 'yanam | ndakshinadvato dakshinadvato
    'yana mayana dakshinadvato vato vato dakshinadvato dakshinadvato vatah | dakshinadvata iti dakshinat
    vatah sanatanah sanatano vato vatah sanatanah | sanatana rishir rishih sanatanah sanatana rishih |
    praticyri shir rishih pratici va~rsha varsha disha varsha rituna mritunam va~rsha varsha ritunam |
    vi~shve vishva rituna mritunam vishve deva deva vishve vishve devah | deva devata devata deva deva
    devata ddevata devata vit | ssaptadasho dravina ndravinagm saptadashah | u vekavigmshavartani rekavigmshavartaniru
    u vekavigmshavartanih | ekavigmshavartani strivathsa strivathsa ekavigmshavartani rekavigmshavartani
    strivathsah | ekavigmshavartanirityekavigmsha trivathso vayo vaya strivathsa strivathso vayah | trivathsa
    iti tri dvaparo dvaparo vayo vayo dvaparo 'yana mayana ndvaparo dvaparo 'yanam | mpashcadvatah pashcadvato
    'yana mayana pashcadvato vato vatah pashcadvatah pashcadvato vatah | pashcadvata iti pashcat vato
    'habhuno 'habhuno vato vato 'habhunah | ahabhuna rishir rishi rahabhuno 'habhuna rishih | rishi rudi
    cyudi cyrishir rishi rudici | ndisha mudi cyudici disham | shara drituna mritunagm shara cchara dritunam
    | mmitravarunau mitravaruna vrituna mrituna mitravarunau devata devata mitravarunau mitravarunau devata
    mitravarunaviti mitra ndevata devata pushtam | dravina mekavigmsha ekavigmsho dravina ndravina mekavigmshah
    | sstoma ekavigmsha ekavigmsha ekavigmsha ityeka u trinavavartanistrinavavartaniru vu trinavavartanih
    | trinavavartani sturyava ttrinavavartani strinavavartani sturyavat | trinavavartaniriti trinava dvayo
    vaya sturyava turyavaditi turya skando vayo vaya askandah | askando 'yana mayana maskanda a ayana
    muttaradvata uttaradvato 'yana mayana muttaradvatah | uttaradvato vato vata uttaradvata uttaradvato
    vatah | uttaradvata ityuttarat vatah pratnah pratno vato vatah pratnah | pratna rishir rishih pratnah
    pratna rishih | rishi rurdhvo rdhva shir rishi rurdhva | ndisha murdhvo rdhva disham | dishagm hemantashishirau
    hemantashishirau disha ndishagm hemantashishirau | hemantashishira vrituna mritunagm hemantashishirau
    hemantashishira vritunam | hemantashishiraviti hemanta rdevata devata brihaspati devata varco varco
    devata devata varcah | va~rco varco dravinam | ntrinava strinavo dravina sstoma strinava strinava
    u trayastrigmshavartani strayastrigmshavartaniru vu trayastrigmshavartanih | trayastrigmshavartanih
    pashthava ttrayastrigmshavartani strayastrigmshavartanih pashthavat | trayastrigmshavartaniriti trayastrigmsha
    rvayo vayo 'bhibhuh | abhibhu rayana mayana mabhibhu rabhibhu rayanam | vi~shvagvato vishvagvato 'yana
    mayanam vishvagvato vato vato vishvagvato vishvagvato vatah | vishvagvata iti vishvak ssuparno vato
    vatah suparnah | suparna rishir rishih suparna rishih pitarah pitara rishir rishih pitarah | pitarah
    pitamahah pitamahah pitarah pitarah pitamahah | pitamahah pare pare pitamahah pitamahah pare pare
    'vare 'vare pare pare 'vare | avare te te 'vare 'vare te | te no na ste te nah | nah pantu pantu no
    nah pantu | te no na ste te nah | ntva vantu no no 'vantu | asmin kshatre kshatre nnasmin kshatre
    | asya mashishya shishyasya masya mashishi | ashishyasya masya mashishya shishyasyam | mpurodhaya
    masya masya mpurodhaya masminn | purodhayamiti purah asmin karman karma nnasmin karmann | dhruvakshitiriti
    dhruva rdhruva dhruva dhruvayoni dhruvayoniriti dhruva dhruva 'syasi dhruva dhruva 'si | ndhruva masyasi
    dhruvam | sida saddhya saddhya sida sida saddhya | saddhyeti saddhya | nketu mukhya syokhyasya ketum
    | purasta dashvina 'shvina purasta tpurasta dashvina 'ddhvaryu addhvaryu ashvina 'shvina addhvaryu
    sadayatagm sadayata maddhvaryu addhvaryu sadayatam | addhvaryu ityaddhvaryu | sadayata mihe ha sadayatagm
    sadayata miha | sve dakshe dakshe sve sve dakshe dakshe dakshapita dakshapita dakshe dakshe dakshapita
    | dakshapite heha dakshapita dakshapiteha | iha sida side heha sida | sida devatra devatra sida sida
    devatra | devatra prithivi prithivi devatra devatra prithivi | prithivi brihati brihati prithivi prithivi
    brihati | brihati rarana rarana brihati brihati rarana | svasastha tanuva tanuva svasastha svasastha
    tanuva ntanuva tanuva sam | vi~shasva vishasva sagm sam vishasva pita pita vishasva vishasva pita
    | piteveva pita piteva | ivai dhye dhive vaidhi | edhi sunave sunava edhyedhi sunave sunava a sunave
    sunava a | a susheva susheva ''susheva susheva 'shvina 'shvina susheva susheva 'shvina 'ddhvaryu addhvaryu
    ashvina 'shvina addhvaryu sadayatagm sadayata maddhvaryu addhvaryu sadayatam | addhvaryu ityaddhvaryu
    | sadayata miheha sadayatagm sadayata miha | kulayini vasumati vasumati kulayini kulayini vasumati
    | vasumati vayodha vayodha vasumati vasumati vayodhah | vayodha rayigm rayim va~yodha vayodha rayim
    | nno no rayigm rayi no vardha vardha no no vardha | va~rdha vardha bahulam | bahulagm suviragm suvira
    apamati mamati mapapa matim | ndurmati mamati mamati mbadhamana badhamana durmati badhamana rayo rayo
    badhamana badhamana rayah | raya sposhe poshe rayo raya sposhe mposhe poshe yajnapatim | yajnapati
    mabhajantya bhajanti yajnapatim ya~jnapati mabhajanti | yajnapatimiti yajna ssuva rabhajantya bhajanti
    suvah | dhehi yajamanaya yajamanaya dhehi dhehi yajamanaya | ya~jamanaya yajamanaya posha posha mashvina
    'shvina posha 'ddhvaryu addhvaryu ashvina 'shvina addhvaryu sadayatagm sadayata maddhvaryu addhvaryu
    sadayatam | addhvaryu ityaddhvaryu | sadayata miheha sadayatagm sadayata miha | mpurisha magne ragneh
    purisham | purisha masyasi purisha asi devayani devaya nyasyasi devayani ndevayani devayani tam |
    tva vishve vishve vishve abhyabhi vishve vishve abhi | abhi grinantu grinantva bhyabhi grinantu |
    grinantu deva deva grinantu grinantu devah | stomaprishtha ghritavati ghritavati stomaprishtha stomaprishtha
    ghritavati | stomaprishtheti stoma ghritavati heha ghritavati ghritavatiha | iha sida side heha sida
    | thsida sida prajavat | prajava dasme asme prajava prajavaditi praja asme dravina dravina 'sme asme
    dravina | dravina ''dravina dravina | a yajasva yajasva yajasva | yaja svashvina 'shvina yajasva yaja
    svashvina 'ddhvaryu addhvaryu ashvina 'shvina addhvaryu sadayatagm sadayata maddhvaryu addhvaryu sadayatam
    | addhvaryu ityaddhvaryu | sadayata miheha sadayatagm sadayata miha | divo murdha murdha divo divo
    murdha | murdha 'syasi murdha murdha 'si | asi prithivyah prithivya asyasi prithivyah | rnabhih prithivyah
    prithivya nabhih | rvishtambhani vishtambhani nabhi vi~shtambhani vishtambhani disham | disha madhipatnya
    dhipatni disha adhipatni bhuvanana mbhuvanana madhipatnya dhipatni bhuvananam | bhuvananamiti bhuvananam
    | || rdraphso draphsa urmi rurmi ndraphso draphso apam | apa masya syapa mapa masi | asi vishvakarma
    vishvakarma 'syasi vishvakarma | vishvakarma te te vishvakarma vishvakarma te | vishvakarmeti vishva
    ta rishir rishi ste ta rishih | rishi rashvina 'shvina r shir rishi rashvina 'ddhvaryu addhvaryu ashvina
    'shvina addhvaryu sadayatagm sadayata maddhvaryu addhvaryu sadayatam | addhvaryu ityaddhvaryu | sadayata
    miheha sadayatagm sadayata miha | saju rudrai rudrai ssaju rudrai rudrai saju radityai radityai ssaju
    radityaih | ssaju radityai radityai vayonadhai ragnaye agnaye vayonadhai tva tva 'gnaye agnaye tva
    vaishvanaraya vaishvanaraya tva tva vaishvanaraya | vaishvanaraya shvina 'shvina vaishvanaraya vaishvanaraya
    shvina 'ddhvaryu addhvaryu ashvina 'shvina addhvaryu sadayatagm sadayata maddhvaryu addhvaryu sadayatam
    | addhvaryu ityaddhvaryu | sadayata miheha sadayatagm sadayata miha | me pahi pahi me me pahi | mpahi
    pahyapanam | mme me apana mapana me pahi pahi me me pahi | mpahi pahi vyanam | me pahi pahi me me
    pahi | pahi cakshu shcakshuh pahi pahi cakshuh | rme me cakshu shcakshu ma urvyo rvya me ma urvya
    | vi bhahi bhahi vi vi bhahi | bhahi shrotragg shrotra mbhahi bhahi shrotra mme me shrotragg shrotra
    me shlokaya shlokaya me me shlokaya | shshlokaya shlokayapah | apa spinva pinvapo apa spinva | pinvaushadhi
    roshadhish pinva pinvaushadhih | rjinva jinvaushadhi roshadhi ddvipaj jinva jinva dvipat | tpahi pahi
    dvipa pahi catushpac catushpa tpahi pahi catushpat | catushpa davava catushpac catushpa dava | catushpaditi
    catuh ava divo divo 'vava divah | ndivo divo vrishti rvayo vaya stryavi stryavi ptrishtub vayo vaya
    strishtup | pchanda shchanda strishtu ddityavat chanda shchando dityavat | dvayo vayo dityava dityavaditi
    ditya dvayo vayo virat | virat chanda shchando vira chandah pancavih pancavi shchanda shchandah pancavih
    | rvayo vayah pancavih pancavi pancaviriti panca vayo gayatri gayatri vayo vayo gayatri | gayatri
    chanda shchando gayatri gayatri chandah | chanda strivathsa strivathsa shchanda shchanda strivathsah
    | trivathso vayo vaya striva thsastrivathso vayah | trivathsa iti tri vaya ushni hoshniha vayo vaya
    ushniha ushniha chanda shchanda ushni hoshniha chandah | tturyavat chanda shchanda sturyavat | dvayo
    vaya sturyava turyavaditi turya vayo 'nushtu banushtub vayo vayo 'nushtup | pchanda shchando 'nushtu
    banushtu tpashthavac chanda shchandah pashthavat | vayo brihati brihati vayo vayo brihati | brihati
    chanda shchando brihati brihati chandah | chanda ukshoksha chanda shchanda uksha | uksha vayo vaya
    ukshoksha vayah | vayah satobrihati satobrihati vayo vayah satobrihati | satobrihati chanda shchandah
    satobrihati satobrihati chandah | chanda rishabha rishabha shchanda shchanda rishabhah | rishabho
