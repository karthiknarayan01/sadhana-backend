id: jambhalastotram
category: stotram
name:
  english: jambhalastotram
  devanagari: जम्भलस्तोत्रम्
content:
  english: jambhalastotram namaste jambhalarupaya dhanadhyakshaya vai namah | kuberatmasvarupaya yaksharajaya
    te namah || 1|| namah saumyaya shantaya ratnabhandanivasine | namah sarvarthasiddhaya lokapalasvarupine
    || 2|| tvam vaishravanarupena lokapalo dhanadhipah | tvam yaksharupena sthitva daridryam harase prabho
    || 3|| tvam ratnavrishtirupena jananam purayasva bhoh | tvam suvarnasvarupena bhumerbhandam prakashase
    || 4|| tvam nagayakshagandharvakinnaraih sevitah sada | tvam devadanavashreshthaih stuyase tridiveshvara
    || 5|| himalaye gahvare ca ratnadhatunivasini | guptadhanadhipe devi yakshasattvaniyojita || 6|| tvam
    kuberasya hridayam tvam dhanasyadhidevata | tvam lokapalamadhyastho rakshasi jagatim sada || 7|| daridryaduhkhadavagnim
    shamayasva dayanidhe | dhanadhanyasamriddhim ca dehi me jambhaleshvara || 8|| ratnavarsham suvarnam
    ca grihakshetrasamriddhaye | putramitrakalatram ca saubhagyam ca pradehi me || 9|| tvam hrim bijasvarupena
    siddhido'si mahabala | tvam jam bijadharo devo yakshadhipatiravyayah || 10|| namami tvam mahayaksham
    kuberamshasamudbhavam | jambhalarupam devesham sarvakamaphalapradam || 11|| idam stotram pathennityam
    shraddhaya yah samahitah | daridryanasham labhate dhanadhanyasamriddhiman || 12|| yaksharajaprasadena
    kuberanugrahena ca | sarvarthasiddhimapnoti loke ca paraloke ca || 13|| iti yogirajatantre jambhalastotram
    sampurnam |
  devanagari: जम्भलस्तोत्रम् नमस्ते जम्भलरूपाय धनाध्यक्षाय वै नमः । कुबेरात्मस्वरूपाय यक्षराजाय ते नमः
    ॥ १॥ नमः सौम्याय शान्ताय रत्नभाण्डनिवासिने । नमः सर्वार्थसिद्धाय लोकपालस्वरूपिणे ॥ २॥ त्वं वैश्रवणरूपेण
    लोकपालो धनाधिपः । त्वं यक्षरूपेण स्थित्वा दारिद्र्यं हरसे प्रभो ॥ ३॥ त्वं रत्नवृष्टिरूपेण जनानां पूरयस्व
    भोः । त्वं सुवर्णस्वरूपेण भूमेर्भाण्डं प्रकाशसे ॥ ४॥ त्वं नागयक्षगन्धर्वकिन्नरैः सेवितः सदा । त्वं
    देवदानवश्रेष्ठैः स्तूयसे त्रिदिवेश्वर ॥ ५॥ हिमालये गह्वरे च रत्नधातुनिवासिनि । गुप्तधनाधिपे देवि यक्षसत्त्वनियोजित
    ॥ ६॥ त्वं कुबेरस्य हृदयं त्वं धनस्याधिदेवता । त्वं लोकपालमध्यस्थो रक्षसि जगतीं सदा ॥ ७॥ दारिद्र्यदुःखदावाग्निं
    शमयस्व दयानिधे । धनधान्यसमृद्धिं च देहि मे जम्भलेश्वर ॥ ८॥ रत्नवर्षं सुवर्णं च गृहक्षेत्रसमृद्धये
    । पुत्रमित्रकलत्रं च सौभाग्यं च प्रदेहि मे ॥ ९॥ त्वं ह्रीं बीजस्वरूपेण सिद्धिदोऽसि महाबल । त्वं जं
    बीजधरो देवो यक्षाधिपतिरव्ययः ॥ १०॥ नमामि त्वां महायक्षं कुबेरांशसमुद्भवम् । जम्भलरूपं देवेशं सर्वकामफलप्रदम्
    ॥ ११॥ इदं स्तोत्रं पठेन्नित्यं श्रद्धया यः समाहितः । दारिद्र्यनाशं लभते धनधान्यसमृद्धिमान् ॥ १२॥ यक्षराजप्रसादेन
    कुबेरानुग्रहेण च । सर्वार्थसिद्धिमाप्नोति लोके च परलोके च ॥ १३॥ इति योगिराजतन्त्रे जम्भलस्तोत्रं सम्पूर्णं
    ।
