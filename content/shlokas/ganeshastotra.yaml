id: ganeshastotra
category: stotram
name:
  english: ganeshastotra
  devanagari: गणेशस्तोत्र
content:
  english: shriganeshastotram mahaganapatistotram vakratundaganeshastavarajah omkaramadyam pravadanti
    santo vacah shrutinamapi ye grinanti | gajananam devagananatamghrim bhaje'hamarddhendukritavatamsam
    || 1|| padaravindarcanatatparanam samsaradavanalabhangadaksham | nirantaram nirgatadanatoyaistam naumi
    vighneshvaramambujabham || 2|| kritangaragam navakumkumena
  devanagari: श्रीगणेशस्तोत्रम् महागणपतिस्तोत्रम् वक्रतुण्डगणेशस्तवराजः ॐकारमाद्यं प्रवदन्ति सन्तो वाचः
    श्रुतिनामपि ये गृणन्ति । गजाननं देवगणानतांघ्रिं भजेऽहमर्द्धेन्दुकृतावतंसम् ॥ १॥ पादारविन्दार्चनतत्पराणां
    संसारदावानलभङ्गदक्षम् । निरन्तरं निर्गतदानतोयैस्तं नौमि विघ्नेश्वरमम्बुजाभम् ॥ २॥ कृताङ्गरागं नवकुंकुमेन
meaning: {}
