id: suryanamasaptatistotram
category: stotram
name:
  english: suryanamasaptatistotram
  devanagari: सूर्यनामसप्ततिस्तोत्रम्
content:
  english: 80|| dyumanirharidashvo'rko bhanumanbhayanashanah | chando'shvo vedavedyashca bhasvanpusha
    vrishakapih || 81|| ekacakraratho mitro mandeharistamisraha | daityaha papaharta ca dharmo dharmaprakashakah
    || 82|| helikashcitrabhanushca kalighnastarkshyavahanah | dikpatih padmininathah kusheshayakaro harih
    || 83|| gharmarashmirdurnirikshyashcandamshuh kashyapatmajah | ebhih saptatisankhyakaih punyaih suryasya
    namabhih || 84|| pranavadi caturthyantairnamaskarasamanvitaih | pratyekamuccarannama drishtvadrishtva
    divakaram || 85|| vigrihya paniyugmena tamrapatram sunirmalam | janubhyamavanim gatva paripurya jalena
    ca || 86|| karaviradi kusumai raktacandanamishritaih | durvankurairakshataishca nikshiptaih patramadhyatah
    || 87|| dadyadarghyamanarghyaya savitre dhyanapurvakam | upamaulim samaniya tatpatram nanyadrinmanah
    || 88|| pratimantram namaskuryadudayastamaye ravim | anaya namasaptatya mahamantrarahasyaya || 89||
    evam kurvannaro jatu na daridro na duhkhabhak | vyadhibhirmucyate ghorairapijanmantararjitaih || 1
  devanagari: ८०॥ द्युमणिर्हरिदश्वोऽर्को भानुमान्भयनाशनः । छन्दोऽश्वो वेदवेद्यश्च भास्वान्पूषा वृषाकपिः
    ॥ ८१॥ एकचक्ररथो मित्रो मन्देहारिस्तमिस्रहा । दैत्यहा पापहर्ता च धर्मो धर्मप्रकाशकः ॥ ८२॥ हेलिकश्चित्रभानुश्च
    कलिघ्नस्तार्क्ष्यवाहनः । दिक्पतिः पद्मिनीनाथः कुशेशयकरो हरिः ॥ ८३॥ घर्मरश्मिर्दुर्निरीक्ष्यश्चण्डांशुः
    कश्यपात्मजः । एभिः सप्ततिसङ्ख्याकैः पुण्यैः सूर्यस्य नामभिः ॥ ८४॥ प्रणवादि चतुर्थ्यन्तैर्नमस्कारसमन्वितैः
    । प्रत्येकमुच्चरन्नाम दृष्ट्वादृष्ट्वा दिवाकरम् ॥ ८५॥ विगृह्य पाणियुग्मेन ताम्रपात्रं सुनिर्मलम् ।
    जानुभ्यामवनिं गत्वा परिपूर्य जलेन च ॥ ८६॥ करवीरादि कुसुमै रक्तचन्दनमिश्रितैः । दूर्वाङ्कुरैरक्षतैश्च
    निक्षिप्तैः पात्रमध्यतः ॥ ८७॥ दद्यादर्घ्यमनर्घ्याय सवित्रे ध्यानपूर्वकम् । उपमौलिं समानीय तत्पात्रं
    नान्यदृङ्मनाः ॥ ८८॥ प्रतिमन्त्रं नमस्कुर्यादुदयास्तमये रविम् । अनया नामसप्तत्या महामन्त्ररहस्यया ॥
    ८९॥ एवं कुर्वन्नरो जातु न दरिद्रो न दुःखभाक् । व्याधिभिर्मुच्यते घोरैरपिजन्मान्तरार्जितैः ॥ १
