id: annamayya-keerthanas-choodaramma-satulaaraa
category: stotram
name:
  english: Annamayya Keerthanas Choodaramma Satulaaraa
content:
  english: cudaramma satulara sobana padaramma | kudunnadi pati cudi kuduta nancari || shrimahalakshmiyata
    singaralake marudu | kamuni talliyata cakkadanalake marudu | somuni tobuttuvata sòmpukalalakemarudu
    | komalangi i cudi kuduta nancari || kalashabdhi kuturata gambhiralake marudu | talapaloka matayata
    daya mari emarudu | jalajanivasiniyata calladanamemarudu | kòladimira i cudi kuduta nancari || amaravanditayata
    atti mahima emarudu | amritamu cuttamata anandalakemarudu | tamito shrivenkateshu danè vacci pèndladè
    | kaumèra vayassu i cudi kuduta nancari ||
  devanagari: चूडरम्म सतुलारा सोबान पाडरम्म । कूडुन्नदि पति चूडि कुडुत नाञ्चारि ॥ श्रीमहालक्ष्मियट सिङ्गारालके
    मरुदु । कामुनि तल्लियट चक्कदनालके मरुदु । सोमुनि तोबुट्टुवट सॊम्पुकललकेमरुदु । कोमलाङ्गि ई चूडि कुडुत
    नाञ्चारि ॥ कलशाब्धि कूतुरट गम्भीरलके मरुदु । तलपलोक मातयट दय मरि एमरुदु । जलजनिवासिनियट चल्लदनमेमरुदु
    । कॊलदिमीर ई चूडि कुडुत नाञ्चारि ॥ अमरवन्दितयट अट्टी महिम एमरुदु । अमृतमु चुट्टमट आनन्दालकेमरुदु ।
    तमितो श्रीवेङ्कटेशु दानॆ वच्चि पॆण्ड्लाडॆ । कौमॆर वयस्सु ई चूडि कुडुत नाञ्चारि ॥
