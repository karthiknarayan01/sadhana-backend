id: lakshminrisimhashup
category: stotram
name:
  english: lakshminrisimhashup
  devanagari: लक्ष्मिन्रिसिम्हषुप्
content:
  english: kartavyam daivamahnikam || 1|| uttishthottishtha govimda uttishtha garudadhvaja | uttishtha
    kamalakanta trailokyam mangaḻam kuru || 2|| yadadrinathashubhamandirakalpavalli padmalaye janani padmabhavadivandye
    | bhaktartibhanjani dayamayadivyarupe lakshminrisimhadayite tava suprabhatam || 3|| jvalanrisimha
    karunamaya divyamurte yogabhinandana nrisimha dayasamudra
  devanagari: कर्तव्यं दैवमाह्निकम् ॥ १॥ उत्तिष्ठोत्तिष्ठ गोविंद उत्तिष्ठ गरुडध्वज । उत्तिष्ठ कमलाकान्त
    त्रैलोक्यं मङ्गळं कुरु ॥ २॥ यादाद्रिनाथशुभमन्दिरकल्पवल्लि पद्मालये जननि पद्मभवादिवन्द्ये । भक्तार्तिभञ्जनि
    दयामयदिव्यरूपे लक्ष्मीनृसिंहदयिते तव सुप्रभातम् ॥ ३॥ ज्वालानृसिंह करुणामय दिव्यमूर्ते योगाभिनन्दन
    नृसिंह दयासमुद्र
meaning: {}
