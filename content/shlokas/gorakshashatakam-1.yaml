id: gorakshashatakam-1
category: shataka
name:
  english: gorakshashatakam 1
  devanagari: गोरक्षशतकम् १
content:
  english: detadvyadhivikarahari yaminam padmasanam procyate || 9|| adharam prathamam cakram svadhishthanam
    dvitiyakam | yonisthanam dvayormadhye kamarupam nigadyate || 10|| adharakhye gudasthane pankajam yaccaturdalam
    | tanmadhye procyate yonih kamakhya siddhavandita || 11|| yonimadhye mahalingam pashcimabhimukham
    sthitam | mastake manivadbhinnam yo janati sa yogavit || 12|| taptacamikarabhasam tadillekheva visphurat
    | caturasram puram vahneradhomedhratpritishthitam || 13|| svashabdena bhavetpranah svadhishthanam
    tadashrayah | svadhishthanakhyaya tasmanmedhravabhidhiyate || 14|| tantuna manivatproto yatra kandah
    sushumnaya | tannabhimandalam cakram procyate manipurakam || 15|| urdhvam medhradadho nabheh kandayonih
    svagandavat | tatra nadyah samutpannah sahasrani dvisaptatih || 16|| teshu nadisahasreshu dvisaptatirudahritah
    | pradhanyatpranavahinyo bhuyastatra dasha smritah || 17|| ida ca pingala caiva sushumna ca tritiyaka
    | gandhari hastijihva ca pusha caiva yashasvini || 18|| alambusha kuhushcaiva shankhini dashami smrita
    | etannadimayam cakram jnatavyam yogibhih sada || 19|| ida vame sthita bhage pingala dakshine tatha
    | sushumna madhyadeshe tu gandhari vamacakshushi || 20|| dakshine hastijihva ca pusha karne ca dakshine
    | yashasvini vamakarne casane vapyalambusha || 21|| kuhushca lingadeshe tu mulasthane ca shankhini
    | evam dvaramupashritya tishthanti dasha nadikah || 22|| satatam pranavahinyah somasuryagnidevatah
    | idapingalasushumna ca tisro nadya udahritah || 23|| pranapanau samanashca hyudano vyana eva ca |
    nagah kurmashca krikaro devadatto dhananjayah || 24|| nagadyah panca vikhyatah pranadyah panca vayavah
    | ete nadisahasreshu vartante jivarupinah || 25|| pranapanavasho jivo hyadhashcordhvam ca dhavati
    | vamadakshinamargena cancalatvanna drishyate || 26|| akshipto bhuvi dandena yathoccalati kandukah
    | pranapanasamakshiptastatha jivo'nukrishyate || 27|| rajjubaddho yatha shyeno gato'pyakrishyate |
    gunabaddhastatha jivah pranapanena krishyate || 28|| apanah karshati pranah prano'panam ca karshati
    | urdhvadhah samsthitavetau yo janati sa yogavit || 29|| kandordhve kundalishaktirashtadha kundalikrita
    | brahmadvaramukham nityam mukhenavritya tishthati || 30|| prabuddha vahniyogena manasa maruta hata
    | prajivagunamadaya vrajatyurdhvam sushumnaya || 31|| mahamudram namomudramuddiyanam jalandharam |
    mulabandham ca yo vetti sa yogi siddhibhajanam || 32|| vakshonyastahanurnipidya suciram yonim ca vamamghrina
    hastabhyamavadharitam prasaritam padam tatha dakshinam | apurya shvasanena kukshiyugalam baddhva shanai
    recayed esha patakanashini sumahati mudra nrinam procyate || 33|| kapalakuhare jihva pravishta viparitaga
    | bhruvorantargata drishtirmudra bhavati khecari || 34|| urdhvam medhradadho nabheruddiyanam pracakshate
    | uddiyanajayo bandho mrityumatangakesari || 35|| jalandhare krite bandhe kanthasankocalakshane |
    na piyusham patatyagnau na ca vayuh prakupyati || 36|| parshnibhagena sampidya yonimakuncayedgudam
    | apanamurdhvamakrishya mulabandho nigadyate || 37|| yatah kalabhayat brahma pranayamaparayanah |
    yogino munayashcaiva tatah pranam nibandhayet || 38|| cale vate calam sarvam nishcale nishcalam bhavet
    | yogi sthanutvamapnoti tato vayum nibandhayet || 39|| shattrimshadangulam hamsah prayanam kurute
    bahih | vamadakshinamargena tatah prano'bhidhiyate || 40|| baddhapadmasano yogi namaskritya gurum
    shivam | nasagradrishtirekaki pranayamam samabhyaset || 41|| prano dehasthito vayurayamastannibandhanam
    | ekashvasamayi matra tadyogo gaganayate || 42|| baddhapadmasano yogi pranam candrena purayet | dharayitva
    yathashakti bhuyah suryena recayet || 43|| amritodadhisankasham kshirodadhavalaprabham | dhyatva candramayam
    bimbam pranayame sukhi bhavet || 44|| pranam suryena cakrishya purayedudaram shanaih | kumbhayitva
    vidhanena bhuyashcandrena recayet || 45|| prajvalajjvalana jvala punjamadityamandalam | dhyatva nabhisthitam
    yogi pranayame sukhi bhavet || 46|| recakah purakashcaiva kumbhakah pranavatmakah | pranayamo bhavettredha
    matra dvadashasamyutah || 47|| dvadashadhamake matra madhyame dvigunastatah | uttame triguna matrah
    pranayamasya nirnayah || 48|| adhame ca ghano gharmah kampo bhavati madhyame | uttishthatyuttame yogi
    baddhapadmasano muhuh || 49|| anganam mardanam shastam shramasamjatavarina | katvamlalavanatyagi kshirabhojanamacaret
    || 50|| mandam mandam pibedvayum mandam mandam viyojayet | nadhikam stambhayedvayum na ca shighram
    vimocayet || 51|| urdhvamakrishya capanam vatam prane niyojayet | murdhanam niyate shaktya sarvapapaih
    pramucyate || 52|| pranayamo bhavatyevam patakendhanapatakah | enombudhimahasetuh procyate yogibhih
    sada || 53|| asanena rujo hanti pranayamena patakam | vikaram manasam yogi pratyaharena sarvada ||
    54|| candramritamayim dharam pratyaharati bhaskarah | tatpratyaharanam tasya pratyaharah sa ucyate
    || 55|| eka stri bhujyate dvabhyamagata somamandalat | tritiyo yo bhavettabhyam sa bhavatyajaramarah
    || 56|| nabhideshe bhavatyeko bhaskaro dahanatmakah | amritatma sthito nityam talumule ca candramah
    || 57|| varshatyadhomukhashcandro grasatyurdhvamukho ravih | jnatavyam karanam tatra yena piyushamapyate
    || 58|| urdhvanabhiradhastalu urdhvabhanuradhah shashi | karanam viparitakhyam guruvaktrena labhyate
    || 59|| tridha baddho vrisho yatra rauraviti mahasvanam | anahatam ca tac cakram hridaye yogino viduh
    || 60|| anahatamatikramya cakramya manipurakam | prapte pranam mahapadmam yogitvamamritayate || 61||
    vishabdah samsmrito hamso nirmalah shuddha ucyate | atah kanthe vishuddhakhye cakram cakravido viduh
    || 62|| vishuddhe parame cakre dhritva somakalajalam | masena na kshayam yati vancayitva mukham raveh
    || 63|| sampidya rasanagrena rajadantabilam mahat | dhyatvamritamayim devim shanmasena kavirbhavet
    || 64|| amritapurnadehasya yogino dvitrivatsarat | urdhvam pravartate reto'pyanimadigunodayah || 65||
    indhanani yatha vahnistailavarti ca dipakah | tatha somakalapurnam dehi deham na muncati || 66|| asanena
    samayuktah pranayamena samyutah | pratyaharena samyukto dharanam ca samabhyaset || 67|| hridaye pancabhutanam
    dharanashca prithak prithak | manaso nishcalatvena dharana ca vidhiyate || 68|| ya prithvi haritaladesharucira
    pita lakaranvita samyukta kamalasanena hi catushkona hridi sthayini | pranam tatra viniya pancaghatikashcittanvitam
    dharayed esha stambhakari sada kshitijayam kuryadbhuvo dharana || 69|| ardhendupratimam ca kundadhavalam
    kanthe'mbutattavam sthitam yatpiyushavakarabijasahitam yuktam sada vishnuna | pranam tatra viniya
    pancaghatikashcittanvitam dharayed esha durvahakalakutajarana syadvarini dharana || 70|| yattalasthitamindragopasadrisham
    tattvam trikonojjvalam tejorephamayam pravalaruciram rudrena yatsangatam | pranam tatra viniya pancaghatikashcittanvitam
    dharaye esha vahnijayam sada vidadhate vaishvanari dharana || 71|| yadbhinnanjanapunjasannibhamidam
    tattvam bhruvorantare vrittam vayumayam yakarasahitam yatreshvaro devata | pranam tatra viniya pancaghatikashcittanvitam
    dharayed esha khe gamanam karoti yaminam syadvayavi dharana || 72|| akasham suvishuddhavarisadrisham
    yadbrahmarandhre sthitam tatradyena sadashivena sahitam shantam hakaraksharam | pranam tatra viniya
    pancaghatikashcittanvitam dharayed esha mokshakavatapatanapatuh prokta nabhodharana || 73|| stambhani
    dravani caiva dahani bhramani tatha | shoshani ca bhavantyevam bhutanam pancadharanah || 74|| karmana
    manasa vaca dharanah panca durlabhah | vidhaya satatam yogi sarvapapaih pramucyate || 75|| sarvam
    cintasamavarti yogino hridi vartate | yattattve nishcitam cetastattu dhyanam pracakshate || 76|| dvidha
    bhavati taddhyanam sagunam nirgunam tatha | sagunam varnabhedena nirgunam kevalam viduh || 77|| adharam
    prathamam cakram taptakancanasannibham | nasagre drishtimadaya dhyatva muncati kilbisham || 78|| svadhishthanam
    dvitiyam tu sanmanikyasushobhanam | nasagre drishtimadaya dhyatva muncati patakam || 79|| tarunadityasamkasham
    cakram ca manipurakam | nasagre drishtimadaya dhyatva samkshobhayejjagat || 80||
  devanagari: देतद्व्याधिविकारहारि यमिनां पद्मासनं प्रोच्यते ॥ ९॥ आधारं प्रथमं चक्रं स्वाधिष्ठानं द्वितीयकम्
    । योनिस्थानं द्वयोर्मध्ये कामरूपं निगद्यते ॥ १०॥ आधाराख्ये गुदस्थाने पङ्कजं यच्चतुर्दलम् । तन्मध्ये
    प्रोच्यते योनिः कामाख्या सिद्धवन्दिता ॥ ११॥ योनिमध्ये महालिङ्गं पश्चिमाभिमुखं स्थितम् । मस्तके मणिवद्भिन्नं
    यो जानाति स योगवित् ॥ १२॥ तप्तचामीकराभासं तडिल्लेखेव विस्फुरत् । चतुरस्रं पुरं वह्नेरधोमेढ्रात्प्रितिष्ठितम्
    ॥ १३॥ स्वशब्देन भवेत्प्राणः स्वाधिष्ठानं तदाश्रयः । स्वाधिष्ठानाख्यया तस्मान्मेढ्रवाभिधीयते ॥ १४॥
    तन्तुना मणिवत्प्रोतो यत्र कन्दः सुषुम्णया । तन्नाभिमण्डलं चक्रं प्रोच्यते मणिपूरकम् ॥ १५॥ ऊर्ध्वं
    मेढ्रादधो नाभेः कन्दयोनिः स्वगाण्डवत् । तत्र नाड्यः समुत्पन्नाः सहस्राणि द्विसप्ततिः ॥ १६॥ तेषु नाडिसहस्रेषु
    द्विसप्ततिरुदाहृताः । प्राधान्यात्प्राणवाहिन्यो भूयस्तत्र दश स्मृताः ॥ १७॥ इडा च पिङ्गला चैव सुषुम्णा
    च तृतीयका । गान्धारी हस्तिजिह्वा च पूषा चैव यशस्विनी ॥ १८॥ अलम्बुषा कुहूश्चैव शङ्खिनी दशमी स्मृता
    । एतन्नाडिमयं चक्रं ज्ञातव्यं योगिभिः सदा ॥ १९॥ इडा वामे स्थिता भागे पिङ्गला दक्षिणे तथा । सुषुम्णा
    मध्यदेशे तु गान्धारी वामचक्षुषि ॥ २०॥ दक्षिणे हस्तिजिह्वा च पूषा कर्णे च दक्षिणे । यशस्विनी वामकर्णे
    चासने वाप्यलम्बुषा ॥ २१॥ कूहुश्च लिङ्गदेशे तु मूलस्थाने च शङ्खिनी । एवं द्वारमुपाश्रित्य तिष्ठन्ति
    दश नाडिकाः ॥ २२॥ सततं प्राणवाहिन्यः सोमसूर्याग्निदेवताः । इडापिङ्गलासुषुम्णा च तिस्रो नाड्य उदाहृताः
    ॥ २३॥ प्राणापानौ समानश्च ह्युदानो व्यान एव च । नागः कूर्मश्च कृकरो देवदत्तो धनञ्जयः ॥ २४॥ नागाद्याः
    पञ्च विख्याताः प्राणाद्याः पञ्च वायवः । एते नाडिसहस्रेषु वर्तन्ते जीवरूपिणः ॥ २५॥ प्राणापानवशो जीवो
    ह्यधश्चोर्ध्वं च धावति । वामदक्षिणमार्गेण चञ्चलत्वान्न दृश्यते ॥ २६॥ आक्षिप्तो भुवि दण्डेन यथोच्चलति
    कन्दुकः । प्राणापानसमाक्षिप्तस्तथा जीवोऽनुकृष्यते ॥ २७॥ रज्जुबद्धो यथा श्येनो गतोऽप्याकृष्यते । गुणबद्धस्तथा
    जीवः प्राणापानेन कृष्यते ॥ २८॥ अपानः कर्षति प्राणः प्राणोऽपानं च कर्षति । ऊर्ध्वाधः संस्थितावेतौ यो
    जानाति स योगवित् ॥ २९॥ कन्दोर्ध्वे कुण्डलीशक्तिरष्टधा कुण्डलीकृता । ब्रह्मद्वारमुखं नित्यं मुखेनावृत्य
    तिष्ठति ॥ ३०॥ प्रबुद्धा वह्नियोगेन मनसा मारुता हता । प्रजीवगुणमादाय व्रजत्यूर्ध्वं सुषुम्णया ॥ ३१॥
    महामुद्रां नमोमुद्रामुड्डियानं जलन्धरम् । मूलबन्धं च यो वेत्ति स योगी सिद्धिभाजनम् ॥ ३२॥ वक्षोन्यस्तहनुर्निपीड्य
    सुचिरं योनिं च वामांघ्रिणा हस्ताभ्यामवधारितं प्रसरितं पादं तथा दक्षिणम् । आपूर्य श्वसनेन कुक्षियुगलं
    बद्ध्वा शनै रेचयेद् एषा पातकनाशिनी सुमहती मुद्रा नॄणां प्रोच्यते ॥ ३३॥ कपालकुहरे जिह्वा प्रविष्टा
    विपरीतगा । भ्रुवोरन्तर्गता दृष्टिर्मुद्रा भवति खेचरी ॥ ३४॥ ऊर्ध्वं मेढ्रादधो नाभेरुड्डियानं प्रचक्षते
    । उड्डियानजयो बन्धो मृत्युमातङ्गकेसरी ॥ ३५॥ जालन्धरे कृते बन्धे कण्ठसङ्कोचलक्षणे । न पीयूषं पतत्यग्नौ
    न च वायुः प्रकुप्यति ॥ ३६॥ पार्ष्णिभागेन सम्पीड्य योनिमाकुञ्चयेद्गुदम् । अपानमूर्ध्वमाकृष्य मूलबन्धो
    निगद्यते ॥ ३७॥ यतः कालभयात् ब्रह्मा प्राणायामपरायणः । योगिनो मुनयश्चैव ततः प्राणं निबन्धयेत् ॥ ३८॥
    चले वाते चलं सर्वं निश्चले निश्चलं भवेत् । योगी स्थाणुत्वमाप्नोति ततो वायुं निबन्धयेत् ॥ ३९॥ षट्त्रिंशदङ्गुलं
    हंसः प्रयाणं कुरुते बहिः । वामदक्षिणमार्गेण ततः प्राणोऽभिधीयते ॥ ४०॥ बद्धपद्मासनो योगी नमस्कृत्य गुरुं
    शिवम् । नासाग्रदृष्टिरेकाकी प्राणायामं समभ्यसेत् ॥ ४१॥ प्राणो देहस्थितो वायुरायामस्तन्निबन्धनम् ।
    एकश्वासमयी मात्रा तद्योगो गगनायते ॥ ४२॥ बद्धपद्मासनो योगी प्राणं चन्द्रेण पूरयेत् । धारयित्वा यथाशक्ति
    भूयः सूर्येण रेचयेत् ॥ ४३॥ अमृतोदधिसङ्काशं क्षीरोदधवलप्रभम् । ध्यात्वा चन्द्रमयं बिम्बं प्राणायामे
    सुखी भवेत् ॥ ४४॥ प्राणं सूर्येण चाकृष्य पूरयेदुदरं शनैः । कुम्भयित्वा विधानेन भूयश्चन्द्रेण रेचयेत्
    ॥ ४५॥ प्रज्वलज्ज्वलन ज्वाला पुञ्जमादित्यमण्डलम् । ध्यात्वा नाभिस्थितं योगी प्राणायामे सुखी भवेत् ॥
    ४६॥ रेचकः पूरकश्चैव कुम्भकः प्रणवात्मकः । प्राणायामो भवेत्त्रेधा मात्रा द्वादशसंयुतः ॥ ४७॥ द्वादशाधमके
    मात्रा मध्यमे द्विगुणास्ततः । उत्तमे त्रिगुणा मात्राः प्राणायामस्य निर्णयः ॥ ४८॥ अधमे च घनो घर्मः
    कम्पो भवति मध्यमे । उत्तिष्ठत्युत्तमे योगी बद्धपद्मासनो मुहुः ॥ ४९॥ अङ्गानां मर्दनं शस्तं श्रमसंजातवारिणा
    । कट्वम्ललवणत्यागी क्षीरभोजनमाचरेत् ॥ ५०॥ मन्दं मन्दं पिबेद्वायुं मन्दं मन्दं वियोजयेत् । नाधिकं स्तम्भयेद्वायुं
    न च शीघ्रं विमोचयेत् ॥ ५१॥ ऊर्ध्वमाकृष्य चापानं वातं प्राणे नियोजयेत् । मूर्धानं नीयते शक्त्या सर्वपापैः
    प्रमुच्यते ॥ ५२॥ प्राणायामो भवत्येवं पातकेन्धनपातकः । एनोम्बुधिमहासेतुः प्रोच्यते योगिभिः सदा ॥ ५३॥
    आसनेन रुजो हन्ति प्राणायामेन पातकम् । विकारं मानसं योगी प्रत्याहारेण सर्वदा ॥ ५४॥ चन्द्रामृतमयीं धारां
    प्रत्याहारति भास्करः । तत्प्रत्याहरणं तस्य प्रत्याहारः स उच्यते ॥ ५५॥ एका स्त्री भुज्यते द्वाभ्यामागता
    सोममण्डलात् । तृतीयो यो भवेत्ताभ्यां स भवत्यजरामरः ॥ ५६॥ नाभिदेशे भवत्येको भास्करो दहनात्मकः । अमृतात्मा
    स्थितो नित्यं तालुमूले च चन्द्रमाः ॥ ५७॥ वर्षत्यधोमुखश्चन्द्रो ग्रसत्यूर्ध्वमुखो रविः । ज्ञातव्यं
    करणं तत्र येन पीयूषमाप्यते ॥ ५८॥ ऊर्ध्वनाभिरधस्तालु ऊर्ध्वभानुरधः शशी । करणं विपरीताख्यं गुरुवक्त्रेण
    लभ्यते ॥ ५९॥ त्रिधा बद्धो वृषो यत्र रौरवीति महास्वनम् । अनाहतं च तच् चक्रं हृदये योगिनो विदुः ॥ ६०॥
    अनाहतमतिक्रम्य चाक्रम्य मणिपूरकम् । प्राप्ते प्राणं महापद्मं योगित्वममृतायते ॥ ६१॥ विशब्दः संस्मृतो
    हंसो निर्मलः शुद्ध उच्यते । अतः कण्ठे विशुद्धाख्ये चक्रं चक्रविदो विदुः ॥ ६२॥ विशुद्धे परमे चक्रे
    धृत्वा सोमकलाजलम् । मासेन न क्षयं याति वञ्चयित्वा मुखं रवेः ॥ ६३॥ सम्पीड्य रसनाग्रेण राजदन्तबिलं महत्
    । ध्यात्वामृतमयीं देवीं षण्मासेन कविर्भवेत् ॥ ६४॥ अमृतापूर्णदेहस्य योगिनो द्वित्रिवत्सरात् । ऊर्ध्वं
    प्रवर्तते रेतोऽप्यणिमादिगुणोदयः ॥ ६५॥ इन्धनानि यथा वह्निस्तैलवर्ति च दीपकः । तथा सोमकलापूर्णं देही
    देहं न मुञ्चति ॥ ६६॥ आसनेन समायुक्तः प्राणायामेन संयुतः । प्रत्याहारेण संयुक्तो धारणां च समभ्यसेत्
    ॥ ६७॥ हृदये पञ्चभूतानां धारणाश्च पृथक् पृथक् । मनसो निश्चलत्वेन धारणा च विधीयते ॥ ६८॥ या पृथ्वी हरितालदेशरुचिरा
    पीता लकारान्विता संयुक्ता कमलासनेन हि चतुष्कोणा हृदि स्थायिनी । प्राणं तत्र विनीय पञ्चघटिकाश्चित्तान्वितं
    धारयेद् एषा स्तम्भकरी सदा क्षितिजयं कुर्याद्भुवो धारणा ॥ ६९॥ अर्धेन्दुप्रतिमं च कुन्दधवलं कण्ठेऽम्बुतत्तवं
    स्थितं यत्पीयूषवकारबीजसहितं युक्तं सदा विष्णुना । प्राणं तत्र विनीय पञ्चघटिकाश्चित्तान्वितं धारयेद्
    एषा दुर्वहकालकूटजरणा स्याद्वारिणी धारणा ॥ ७०॥ यत्तालस्थितमिन्द्रगोपसदृशं तत्त्वं त्रिकोणोज्ज्वलं तेजोरेफमयं
    प्रवालरुचिरं रुद्रेण यत्सङ्गतम् । प्राणं तत्र विनीय पञ्चघटिकाश्चित्तान्वितं धारये एषा वह्निजयं सदा
    विदधते वैश्वानरी धारणा ॥ ७१॥ यद्भिन्नाञ्जनपुञ्जसान्निभमिदं तत्त्वं भ्रुवोरन्तरे वृत्तं वायुमयं यकारसहितं
    यत्रेश्वरो देवता । प्राणं तत्र विनीय पञ्चघटिकाश्चित्तान्वितं धारयेद् एषा खे गमनं करोति यमिनां स्याद्वायवी
    धारणा ॥ ७२॥ आकाशं सुविशुद्धवारिसदृशं यद्ब्रह्मरन्ध्रे स्थितं तत्राद्येन सदाशिवेन सहितं शान्तं हकाराक्षरम्
    । प्राणं तत्र विनीय पञ्चघटिकाश्चित्तान्वितं धारयेद् एषा मोक्षकवाटपाटनपटुः प्रोक्ता नभोधारणा ॥ ७३॥
    स्तम्भनी द्रावणी चैव दहनी भ्रामणी तथा । शोषणी च भवन्त्येवं भूतानां पञ्चधारणाः ॥ ७४॥ कर्मणा मनसा वाचा
    धारणाः पञ्च दुर्लभाः । विधाय सततं योगी सर्वपापैः प्रमुच्यते ॥ ७५॥ सर्वं चिन्तासमावर्ति योगिनो हृदि
    वर्तते । यत्तत्त्वे निश्चितं चेतस्तत्तु ध्यानं प्रचक्षते ॥ ७६॥ द्विधा भवति तद्ध्यानं सगुणं निर्गुणं
    तथा । सगुणं वर्णभेदेन निर्गुणं केवलं विदुः ॥ ७७॥ आधारं प्रथमं चक्रं तप्तकाञ्चनसन्निभम् । नासाग्रे
    दृष्टिमादाय ध्यात्वा मुञ्चति किल्बिषम् ॥ ७८॥ स्वाधिष्ठानं द्वितीयं तु सन्माणिक्यसुशोभनम् । नासाग्रे
    दृष्टिमादाय ध्यात्वा मुञ्चति पातकम् ॥ ७९॥ तरुणादित्यसंकाशं चक्रं च मणिपूरकम् । नासाग्रे दृष्टिमादाय
    ध्यात्वा संक्षोभयेज्जगत् ॥ ८०॥
