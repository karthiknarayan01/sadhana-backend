id: brahmakritamkancikamakshistotram
category: stotram
name:
  english: brahmakritamkancikamakshistotram
  devanagari: ब्रह्मकृतंकान्चीकामाक्षीस्तोत्रम्
content:
  english: ringaraveshadhyam sarvabharanabhushitam | adilakshmim pravikshyaiva brahmavishnvishamataram
    || 28|| kamakshim tam divyadevimastaushidvishvasrit svayam | anadishrikrishnanarayanasya jananim bhuvi
    || 29|| brahmovaca | jaya lakshmi mahalakshmi jaganmatah pareshvari | jaya shrinathasahaje jaya shrisarvamangale
    || 30|| jayashrikarunarashe jaya vaishnavavandite | jaya lokaprapujye tvam lokakartryai ca te namah
    || 31|| ananyabhavanabhaktairvedyayai te namo namah | amnayamunisanghatairjnatokta ya pareshvari ||
    32|| parabrahmasvarupayai matre te vai namo namah | hridayasthe namastubhyam samrajyasampadishvari
    | veda nihshvasitam te vai tasyai matre namo namah || 33|| sahasrashirsha devo'pi dhatte yadajnaya
    kshitim | suryacandragnayo bhanti yadamshatejasa sada || 34|| pancavimshatirupayai matre lakshmyai
    namo namah | ishvara api yasyaste prapyaishvaryani ceshvarah || 35|| sarvatmanamantarastham paramanandarupinim
    | shrividyam shrimahalakshmim tvam namami punah punah || 36|| sarvajnanatmika yupatmika svarnatmika'si
    ca | tattvopadesharupa ca smriddhyatma shantivarshini || 37|| deshakalapadarthatma manimantraushadhatmika
    | dhatutaijasarupa ca tasyai matrai namo namah || 38|| kalyanagunasampanna kambharabhutishalini |
    kunkumavapikamata balakrishnaprasuh rama || 39|| anadishrikrishnanarayanankashobhita'vyaya | varam
    varam surashtre tvam samayasi namo'stu te || 40|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya
    tritiyakhande 120
  devanagari: ृङ्गारवेषाढ्यां सर्वाभरणभूषिताम् । आदिलक्ष्मीं प्रवीक्ष्यैव ब्रह्मविष्ण्वीशमातरम् ॥ २८॥
    कामाक्षीं तां दिव्यदेवीमस्तौषीद्विश्वसृट् स्वयम् । अनादिश्रीकृष्णनारायणस्य जननीं भुवि ॥ २९॥ ब्रह्मोवाच
    । जय लक्ष्मि महालक्ष्मि जगन्मातः परेश्वरि । जय श्रीनाथसहजे जय श्रीसर्वमङ्गले ॥ ३०॥ जयश्रीकरुणाराशे
    जय वैष्णववन्दिते । जय लोकप्रपूज्ये त्वं लोककर्त्र्यै च ते नमः ॥ ३१॥ अनन्यभावनाभक्तैर्वेद्यायै ते नमो
    नमः । आम्नायमुनिसङ्घातैर्ज्ञातोक्ता या परेश्वरी ॥ ३२॥ परब्रह्मस्वरूपायै मात्रे ते वै नमो नमः । हृदयस्थे
    नमस्तुभ्यं साम्राज्यसम्पदीश्वरि । वेदा निःश्वसितं ते वै तस्यै मात्रे नमो नमः ॥ ३३॥ सहस्रशीर्षा देवोऽपि
    धत्ते यदाज्ञया क्षितिम् । सूर्यचन्द्राग्नयो भान्ति यदंशतेजसा सदा ॥ ३४॥ पञ्चविंशतिरूपायै मात्रे लक्ष्म्यै
    नमो नमः । ईश्वरा अपि यस्यास्ते प्राप्यैश्वर्याणि चेश्वराः ॥ ३५॥ सर्वात्मनामन्तरस्थां परमानन्दरूपिणीम्
    । श्रीविद्यां श्रीमहालक्ष्मीं त्वां नमामि पुनः पुनः ॥ ३६॥ सर्वज्ञानात्मिका यूपात्मिका स्वर्णात्मिकाऽसि
    च । तत्त्वोपदेशरूपा च स्मृद्ध्यात्मा शान्तिवर्षिणी ॥ ३७॥ देशकालपदार्थात्मा मणिमन्त्रौषधात्मिका । धातुतैजसरूपा
    च तस्यै मात्रै नमो नमः ॥ ३८॥ कल्याणगुणसम्पन्ना कम्भराभूतिशालिनी । कुङ्कुमवापिकामाता बालकृष्णप्रसूः
    रमा ॥ ३९॥ अनादिश्रीकृष्णनारायणाङ्कशोभिताऽव्यया । वारं वारं सुराष्ट्रे त्वं समायासि नमोऽस्तु ते ॥ ४०॥
    इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १२०
