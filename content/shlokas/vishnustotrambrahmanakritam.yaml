id: vishnustotrambrahmanakritam
category: stotram
name:
  english: vishnustotrambrahmanakritam
  devanagari: विष्णुस्तोत्रम्ब्राह्मणकृतम्
content:
  english: pranipatyaksharam vishvam vishvahetum niranjanam | yatprarthayamyavikalam sakalam tatprayacchatu
    || 77|| kartaramakritam vishnum sarvakaranakaranam | anoraniyamsamajam sarvavyapinamishvaram || 78||
    paratparataram yasmannasti sarveshvaratparam | tam pranamyacyutam devam prarthayami yadastu tat ||
    79|| sarveshvaracyutananta paramatmanjanardana | samsarabdhimahapota samuddhara maharnavat || 80||
    vyomanilagnyambudharasvarupa tanmatrasarvendriyabuddhirupa | antahsthitatmanparamatmarupa prasida
    sarveshvara vishvarupa || 81|| tamadiranto jagato'sya madhyamadestvamadih pralayasya cantah | tvatto
    bhavatyetadasheshamisha tvayyeva cante layamabhyupaiti || 82|| pradipavartyantagato'gniralpo yathatikakshe
    vitatam prayati | tadvadvisrishteramaradibhinnairvikashamayasi vibhutibhedaih || 83|| yatha nadinam
    bahavo'mbuvegah samantato'bdhim bhagavanvishanti | tvayyantakale jagadacyutedam tatha layam gacchati
    sarvabhute || 84|| tvam sarvametadbahudhaika eva jagatpate karyamivabhyupetam | yadasti yannasti ca
    tattvameva hare tvadanyadbhagavankimasti || 85|| kintvisha maya bhavato nijeyamavishkritavishkritalokasrishte
    | yayahamesho'nyatamo mameti madiyamasyabhivadanti mudhah || 86|| taya vimudhena mayabjanabha na yatkritam
    tatkvacidasti kincit | bhumyambaragnisalileshu deva jagratsushuptyadishu duhkhitena || 87|| na santi
    tavanti jalanyapidya sarveshu nathabdhishu sarvakalam | stanyani yavanti mayatighore pitani samsaramahasamudre
    || 88|| sampacchilanam himavanmahendra kailasamervadishu naiva tadrik | dehanyanekanyanugrihnato me
    praptasthisampanmahati yathesha || 89|| tvayyarpitam natha punah punarme manah samakshipya sudurdharo'pi
    | rago hi vashyam kurute tato'nu lobhadayah kim bhagavankaromi || 90|| ekagratamulyabalena labhyam
    bhavaushadham tvam bhagavankilaikah | manah parayattamidam bhave'sminsamsaraduhkhatkimaham karomi
    || 91|| na santi te deva bhuvi pradesha na yeshu jato'smi tatha vinashtah | atta maya yeshu na jantavashca
    sambhakshito yaishca na jantusanghaih || 92|| simhena bhutva bahavo mayatta vyaghrena bhutva bahavo
    mayattah | tathanyarupairbahavo mayattah sambhakshito'ham bahubhistatashca || 93|| utkrantiduhkhanyatiduhsahani
    sahasrasho yanyanusamsmarami | taih samsmritaistatkshanameva deva tadidyatha me hridayam prayati ||
    94|| tatashca duhkhanyanivaranani yantragnishastraughasamudbhavani | bhavanti yanyacyuta narakanam
    tanyeva teshamupamanamatram || 95|| duhkhanyasahyani ca garbhavase vinmutramadhye'tinipiditasya |
    bhavanti yani cyavatashca garbhattesham svarupam gaditum na shakyam || 96|| duhkhani baleshu mahanti
    natha kaumarake yauvaninashca pumsah | jvaratisarakshirugadikani samastaduhkhalaya eva vriddhah ||
    97|| karoti karmacyuta tatkshanena papam narah kayamanovacobhih | yasyabdalakshairapi nantameti shastradiyantragninipidaneshu
    || 98|| duhkhani yanishtaviyogajani bhavanti samsaraviharabhajam | pratyekashasteshu nara vinashamicchantyasunam
    mamatabhibhutah || 99|| shokabhibhutasya mamashru deva yavatpramanam na jalam payoda | tavatpramanam
    na jalam payoda muncantyanekairapi varshalakshaih || 100|| manye dharitri paramanusankhyamupaiti pitrorgananamashesham
    | mitranyamitranyanujivibandhunsankhyatamisho'smi na devadeva || 101|| so'ham bhrishartah karunam
    kuru tvam samsaragarte patitasya vishno | mahatmanam samshrayamabhyupeto naivavasidatyatidurgato'pi
    || 102|| parayanam rogavatam hi vaidyo mahabdhimagnasya ca naurnarasya | balasya matapitarau sughorasamsarakhinnasya
    hare tvamekah || 103|| prasida sarveshvara sarvabhuta sarvasya heto paramarthasara | mamuddharasmaduruduhkhapankatsamsaragartatsvaparigrahena
    || 104|| dharmatmanamavikalam tvayi natha bhaktim shraddhavatam satatamudvahatam varenya | karyam
    kiyanmama vimudhadhiyo'dhamasya bhutva kripaluramalamaja dehi buddhim || 105|| jnatva yayakhilamasaramasarameva
    bhutendriyadikamaparamamuktimulam | mayantareyamacalam tava vishvarupa sammohitam sakalameva jagadyayaitat
    || 106|| brahmendrarudramarudashvidivakaradya jnatum na yam paramaguhyatamam samarthah | na tvamalam
    stutipatheshvahamishitaram stoshyami mohakalushalpamatirmanushyah || 107|| yasmadidam bhavati yatra
    jagattathedam yasmimllayam vrajati yashca jagatsvarupah | tam sargasamsthitivinashanimittabhutam stotum
    bhavantamalamisha na kashcidasti || 108|| mudho'yamalpamatiralpasuceshtito'yam klishtam mano'sya vishayairna
    mayi prasangi | ittham kripam kuru mayi pranate kilesha tvam stotumambujabhavo'pi hi deva neshah ||
    109|| yasyodare sakala eva mahidhracandra
  devanagari: प्रणिपत्याक्षरं विश्वं विश्वहेतुं निरञ्जनम् । यत्प्रार्थयाम्यविकलं सकलं तत्प्रयच्छतु ॥ ७७॥
    कर्तारमकृतं विष्णुं सर्वकारणकारणम् । अणोरणीयांसमजं सर्वव्यापिनमीश्वरम् ॥ ७८॥ परात्परतरं यस्मान्नास्ति
    सर्वेश्वरात्परम् । तं प्रणम्याच्युतं देवं प्रार्थयामि यदस्तु तत् ॥ ७९॥ सर्वेश्वराच्युतानन्त परमात्मञ्जनार्दन
    । संसाराब्धिमहापोत समुद्धर महार्णवात् ॥ ८०॥ व्योमानिलाग्न्यम्बुधरस्वरूप तन्मात्रसर्वेन्द्रियबुद्धिरूप
    । अन्तःस्थितात्मन्परमात्मरूप प्रसीद सर्वेश्वर विश्वरूप ॥ ८१॥ तमादिरन्तो जगतोऽस्य मध्यमादेस्त्वमादिः
    प्रलयस्य चान्तः । त्वत्तो भवत्येतदशेषमीश त्वय्येव चान्ते लयमभ्युपैति ॥ ८२॥ प्रदीपवर्त्यन्तगतोऽग्निरल्पो
    यथातिकक्षे विततं प्रयाति । तद्वद्विसृष्टेरमरादिभिन्नैर्विकाशमायासि विभूतिभेदैः ॥ ८३॥ यथा नदीनां बहवोऽम्बुवेगाः
    समन्ततोऽब्धिं भगवन्विशन्ति । त्वय्यन्तकाले जगदच्युतेदं तथा लयं गच्छति सर्वभूते ॥ ८४॥ त्वं सर्वमेतद्बहुधैक
    एव जगत्पते कार्यमिवाभ्युपेतम् । यदस्ति यन्नास्ति च तत्त्वमेव हरे त्वदन्यद्भगवन्किमस्ति ॥ ८५॥ किन्त्वीश
    माया भवतो निजेयमाविष्कृताविष्कृतलोकसृष्टे । ययाहमेषोऽन्यतमो ममेति मदीयमस्याभिवदन्ति मूढाः ॥ ८६॥ तया
    विमूढेन मयाब्जनाभ न यत्कृतं तत्क्वचिदस्ति किञ्चित् । भूम्यम्बराग्निसलिलेषु देव जाग्रत्सुषुप्त्यादिषु
    दुःखितेन ॥ ८७॥ न सन्ति तावन्ति जलान्यपीड्य सर्वेषु नाथाब्धिषु सर्वकालम् । स्तन्यानि यावन्ति मयातिघोरे
    पीतानि संसारमहासमुद्रे ॥ ८८॥ सम्पच्छिलानां हिमवन्महेन्द्र कैलासमेर्वादिषु नैव तादृक् । देहान्यनेकान्यनुगृह्णतो
    मे प्राप्तास्थिसम्पन्महति यथेश ॥ ८९॥ त्वय्यर्पितं नाथ पुनः पुनर्मे मनः समाक्षिप्य सुदुर्धरोऽपि । रागो
    हि वश्यं कुरुते ततोऽनु लोभादयः किं भगवन्करोमि ॥ ९०॥ एकाग्रतामूल्यबलेन लभ्यं भवौषधं त्वं भगवन्किलैकः
    । मनः परायत्तमिदं भवेऽस्मिन्संसारदुःखात्किमहं करोमि ॥ ९१॥ न सन्ति ते देव भुवि प्रदेशा न येषु जातोऽस्मि
    तथा विनष्टः । अत्ता मया येषु न जन्तवश्च सम्भक्षितो यैश्च न जन्तुसङ्घैः ॥ ९२॥ सिंहेन भूत्वा बहवो मयात्ता
    व्याघ्रेण भूत्वा बहवो मयात्ताः । तथान्यरूपैर्बहवो मयात्ताः सम्भक्षितोऽहं बहुभिस्ततश्च ॥ ९३॥ उत्क्रान्तिदुःखान्यतिदुःसहानि
    सहस्रशो यान्यनुसंस्मरामि । तैः संस्मृतैस्तत्क्षणमेव देव तडिद्यथा मे हृदयं प्रयाति ॥ ९४॥ ततश्च दुःखान्यनिवारणानि
    यन्त्राग्निशस्त्रौघसमुद्भवानि । भवन्ति यान्यच्युत नारकानां तान्येव तेषामुपमानमात्रम् ॥ ९५॥ दुःखान्यसह्यानि
    च गर्भवासे विण्मूत्रमध्येऽतिनिपीडितस्य । भवन्ति यानि च्यवतश्च गर्भात्तेषां स्वरूपं गदितुं न शक्यम्
    ॥ ९६॥ दुःखानि बालेषु महान्ति नाथ कौमारके यौवनिनश्च पुंसः । ज्वरातिसाराक्षिरुगादिकानि समस्तदुःखालय
    एव वृद्धः ॥ ९७॥ करोति कर्माच्युत तत्क्षणेन पापं नरः कायमनोवचोभिः । यस्याब्दलक्षैरपि नान्तमेति शस्त्रादियन्त्राग्निनिपीडनेषु
    ॥ ९८॥ दुःखानि यानीष्टवियोगजानि भवन्ति संसारविहारभाजाम् । प्रत्येकशस्तेषु नरा विनाशमिच्छन्त्यसूनां
    ममताभिभूताः ॥ ९९॥ शोकाभिभूतस्य ममाश्रु देव यावत्प्रमाणं न जलं पयोदा । तावत्प्रमाणं न जलं पयोदा मुञ्चन्त्यनेकैरपि
    वर्षलक्षैः ॥ १००॥ मन्ये धरित्री परमाणुसङ्ख्यामुपैति पित्रोर्गणनामशेषम् । मित्राण्यमित्राण्यनुजीविबन्धून्सङ्ख्यातमीशोऽस्मि
    न देवदेव ॥ १०१॥ सोऽहं भृशार्तः करुणां कुरु त्वं संसारगर्ते पतितस्य विष्णो । महात्मनां संश्रयमभ्युपेतो
    नैवावसीदत्यतिदुर्गतोऽपि ॥ १०२॥ परायणं रोगवतां हि वैद्यो महाब्धिमग्नस्य च नौर्नरस्य । बालस्य मातापितरौ
    सुघोरसंसारखिन्नस्य हरे त्वमेकः ॥ १०३॥ प्रसीद सर्वेश्वर सर्वभूत सर्वस्य हेतो परमार्थसार । मामुद्धरास्मादुरुदुःखपङ्कात्संसारगर्तात्स्वपरिग्रहेण
    ॥ १०४॥ धर्मात्मनामविकलां त्वयि नाथ भक्तिं श्रद्धावतां सततमुद्वहतां वरेण्य । कार्यं कियन्मम विमूढधियोऽधमस्य
    भूत्वा कृपालुरमलामज देहि बुद्धिम् ॥ १०५॥ ज्ञात्वा ययाखिलमसारमसारमेव भूतेन्द्रियादिकमपारममुक्तिमूलम्
    । मायान्तरेयमचलां तव विश्वरूप सम्मोहितं सकलमेव जगद्ययैतत् ॥ १०६॥ ब्रह्मेन्द्ररुद्रमरुदश्विदिवाकराद्या
    ज्ञातुं न यं परमगुह्यतमं समर्थाः । न त्वामलं स्तुतिपथेष्वहमीशितारं स्तोष्यामि मोहकलुषाल्पमतिर्मनुष्यः
    ॥ १०७॥ यस्मादिदं भवति यत्र जगत्तथेदं यस्मिंल्लयं व्रजति यश्च जगत्स्वरूपः । तं सर्गसंस्थितिविनाशनिमित्तभूतं
    स्तोतुं भवन्तमलमीश न कश्चिदस्ति ॥ १०८॥ मूढोऽयमल्पमतिरल्पसुचेष्टितोऽयं क्लिष्टं मनोऽस्य विषयैर्न मयि
    प्रसङ्गि । इत्थं कृपां कुरु मयि प्रणते किलेश त्वां स्तोतुमम्बुजभवोऽपि हि देव नेशः ॥ १०९॥ यस्योदरे
    सकल एव महीध्रचन्द्र
