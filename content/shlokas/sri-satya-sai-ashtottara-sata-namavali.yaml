id: sri-satya-sai-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Satya Sai Ashtottara Sata Namavali
content:
  english: om shri sayi satyasayibabaya namah | om shri sayi satyasvarupaya namah | om shri sayi satyadharmaparayanaya
    namah | om shri sayi varadaya namah | om shri sayi satpurushaya namah | om shri sayi satyagunatmane
    namah | om shri sayi sadhuvardhanaya namah | om shri sayi sadhujanaposhanaya namah | om shri sayi
    sarvajnaya namah | om shri sayi sarvajanapriyaya namah || om shri sayi sarvashaktimurtaye namah |
    om shri sayi sarveshaya namah | om shri sayi sarvasangaparityagine namah | om shri sayi sarvantaryamine
    namah | om shri sayi mahimatmane namah | om shri sayi maheshvarasvarupaya namah | om shri sayi partigramodbhavaya
    namah | om shri sayi partikshetranivasine namah | om shri sayi yashahkayashirdivasine namah | om shri
    sayi jodi adipalli somappaya namah || om shri sayi bharadvajrishigotraya namah | om shri sayi bhaktavatsalaya
    namah | om shri sayi apantaratmane namah | om shri sayi avataramurtaye namah | om shri sayi sarvabhayanivarine
    namah | om shri sayi apastambasutraya namah | om shri sayi abhayapradaya namah | om shri sayi ratnakaravamshodbhavaya
    namah | om shri sayi shirdi sayi abheda shaktyavataraya namah | om shri sayi shankaraya namah || om
    shri sayi shirdi sayi murtaye namah | om shri sayi dvarakamayivasine namah | om shri sayi citravatitata
    puttaparti viharine namah | om shri sayi shaktipradaya namah | om shri sayi sharanagatatranaya namah
    | om shri sayi anandaya namah | om shri sayi anandadaya namah | om shri sayi artatranaparayanaya namah
    | om shri sayi anathanathaya namah | om shri sayi asahaya sahayaya namah || om shri sayi lokabandhavaya
    namah | om shri sayi lokarakshaparayanaya namah | om shri sayi lokanathaya namah | om shri sayi dinajanaposhanaya
    namah | om shri sayi murtitrayasvarupaya namah | om shri sayi muktipradaya namah | om shri sayi kalushaviduraya
    namah | om shri sayi karunakaraya namah | om shri sayi sarvadharaya namah | om shri sayi sarvahridvasine
    namah || om shri sayi punyaphalapradaya namah | om shri sayi sarvapapakshayakaraya namah | om shri
    sayi sarvaroganivarine namah | om shri sayi sarvabadhaharaya namah | om shri sayi anantanutakartrine
    namah | om shri sayi adipurushaya namah | om shri sayi adishaktaye namah | om shri sayi aparupashaktine
    namah | om shri sayi avyaktarupine namah | om shri sayi kamakrodhadhvamsine namah || om shri sayi
    kanakambaradharine namah | om shri sayi adbhutacaryaya namah | om shri sayi apadbandhavaya namah |
    om shri sayi prematmane namah | om shri sayi premamurtaye namah | om shri sayi premapradaya namah
    | om shri sayi priyaya namah | om shri sayi bhaktapriyaya namah | om shri sayi bhaktamandaraya namah
    | om shri sayi bhaktajanahridayaviharine namah || om shri sayi bhaktajanahridayalayaya namah | om
    shri sayi bhaktaparadhinaya namah | om shri sayi bhaktijnanapradipaya namah | om shri sayi bhaktijnanapradaya
    namah | om shri sayi sujnanamargadarshakaya namah | om shri sayi jnanasvarupaya namah | om shri sayi
    gitabodhakaya namah | om shri sayi jnanasiddhidaya namah | om shri sayi sundararupaya namah | om shri
    sayi punyapurushaya namah || om shri sayi phalapradaya namah | om shri sayi purushottamaya namah |
    om shri sayi puranapurushaya namah | om shri sayi atitaya namah | om shri sayi kalatitaya namah |
    om shri sayi siddhirupaya namah | om shri sayi siddhasankalpaya namah | om shri sayi arogyapradaya
    namah | om shri sayi annavastradayine namah | om shri sayi samsaraduhkha kshayakaraya namah || om
    shri sayi sarvabhishtapradaya namah | om shri sayi kalyanagunaya namah | om shri sayi karmadhvamsine
    namah | om shri sayi sadhumanasashobhitaya namah | om shri sayi sarvamatasammataya namah | om shri
    sayi sadhumanasaparishodhakaya namah | om shri sayi sadhakanugrahavatavrikshapratishthapakaya namah
    | om shri sayi sakalasamshayaharaya namah | om shri sayi sakalatattvabodhakaya namah | om shri sayi
    yogishvaraya namah || om shri sayi yogindravanditaya namah | om shri sayi sarvamangalakaraya namah
    | om shri sayi sarvasiddhipradaya namah | om shri sayi apannivarine namah | om shri sayi artiharaya
    namah | om shri sayi shantamurtaye namah | om shri sayi sulabhaprasannaya namah | om shri sayi bhagavan
    satyasayibabaya namah ||
  devanagari: ॐ श्री सायि सत्यसायिबाबाय नमः । ॐ श्री सायि सत्यस्वरूपाय नमः । ॐ श्री सायि सत्यधर्मपरायणाय
    नमः । ॐ श्री सायि वरदाय नमः । ॐ श्री सायि सत्पुरुषाय नमः । ॐ श्री सायि सत्यगुणात्मने नमः । ॐ श्री
    सायि साधुवर्धनाय नमः । ॐ श्री सायि साधुजनपोषणाय नमः । ॐ श्री सायि सर्वज्ञाय नमः । ॐ श्री सायि सर्वजनप्रियाय
    नमः ॥ ॐ श्री सायि सर्वशक्तिमूर्तये नमः । ॐ श्री सायि सर्वेशाय नमः । ॐ श्री सायि सर्वसङ्गपरित्यागिने
    नमः । ॐ श्री सायि सर्वान्तर्यामिने नमः । ॐ श्री सायि महिमात्मने नमः । ॐ श्री सायि महेश्वरस्वरूपाय
    नमः । ॐ श्री सायि पर्तिग्रामोद्भवाय नमः । ॐ श्री सायि पर्तिक्षेत्रनिवासिने नमः । ॐ श्री सायि यशःकायषिर्डीवासिने
    नमः । ॐ श्री सायि जोडि आदिपल्लि सोमप्पाय नमः ॥ ॐ श्री सायि भारद्वाजृषिगोत्राय नमः । ॐ श्री सायि भक्तवत्सलाय
    नमः । ॐ श्री सायि अपान्तरात्मने नमः । ॐ श्री सायि अवतारमूर्तये नमः । ॐ श्री सायि सर्वभयनिवारिणे नमः
    । ॐ श्री सायि आपस्तम्बसूत्राय नमः । ॐ श्री सायि अभयप्रदाय नमः । ॐ श्री सायि रत्नाकरवंशोद्भवाय नमः
    । ॐ श्री सायि षिर्डी सायि अभेद शक्त्यावताराय नमः । ॐ श्री सायि शङ्कराय नमः ॥ ॐ श्री सायि षिर्डी सायि
    मूर्तये नमः । ॐ श्री सायि द्वारकामायिवासिने नमः । ॐ श्री सायि चित्रावतीतट पुट्टपर्ति विहारिणे नमः
    । ॐ श्री सायि शक्तिप्रदाय नमः । ॐ श्री सायि शरणागतत्राणाय नमः । ॐ श्री सायि आनन्दाय नमः । ॐ श्री सायि
    आनन्ददाय नमः । ॐ श्री सायि आर्तत्राणपरायणाय नमः । ॐ श्री सायि अनाथनाथाय नमः । ॐ श्री सायि असहाय सहायाय
    नमः ॥ ॐ श्री सायि लोकबान्धवाय नमः । ॐ श्री सायि लोकरक्षापरायणाय नमः । ॐ श्री सायि लोकनाथाय नमः । ॐ
    श्री सायि दीनजनपोषणाय नमः । ॐ श्री सायि मूर्तित्रयस्वरूपाय नमः । ॐ श्री सायि मुक्तिप्रदाय नमः । ॐ
    श्री सायि कलुषविदूराय नमः । ॐ श्री सायि करुणाकराय नमः । ॐ श्री सायि सर्वाधाराय नमः । ॐ श्री सायि सर्वहृद्वासिने
    नमः ॥ ॐ श्री सायि पुण्यफलप्रदाय नमः । ॐ श्री सायि सर्वपापक्षयकराय नमः । ॐ श्री सायि सर्वरोगनिवारिणे
    नमः । ॐ श्री सायि सर्वबाधाहराय नमः । ॐ श्री सायि अनन्तनुतकर्तृणे नमः । ॐ श्री सायि आदिपुरुषाय नमः
    । ॐ श्री सायि आदिशक्तये नमः । ॐ श्री सायि अपरूपशक्तिने नमः । ॐ श्री सायि अव्यक्तरूपिणे नमः । ॐ श्री
    सायि कामक्रोधध्वंसिने नमः ॥ ॐ श्री सायि कनकाम्बरधारिणे नमः । ॐ श्री सायि अद्भुतचर्याय नमः । ॐ श्री
    सायि आपद्बान्धवाय नमः । ॐ श्री सायि प्रेमात्मने नमः । ॐ श्री सायि प्रेममूर्तये नमः । ॐ श्री सायि प्रेमप्रदाय
    नमः । ॐ श्री सायि प्रियाय नमः । ॐ श्री सायि भक्तप्रियाय नमः । ॐ श्री सायि भक्तमन्दाराय नमः । ॐ श्री
    सायि भक्तजनहृदयविहारिणे नमः ॥ ॐ श्री सायि भक्तजनहृदयालयाय नमः । ॐ श्री सायि भक्तपराधीनाय नमः । ॐ श्री
    सायि भक्तिज्ञानप्रदीपाय नमः । ॐ श्री सायि भक्तिज्ञानप्रदाय नमः । ॐ श्री सायि सुज्ञानमार्गदर्शकाय नमः
    । ॐ श्री सायि ज्ञानस्वरूपाय नमः । ॐ श्री सायि गीताबोधकाय नमः । ॐ श्री सायि ज्ञानसिद्धिदाय नमः । ॐ
    श्री सायि सुन्दररूपाय नमः । ॐ श्री सायि पुण्यपुरुषाय नमः ॥ ॐ श्री सायि फलप्रदाय नमः । ॐ श्री सायि
    पुरुषोत्तमाय नमः । ॐ श्री सायि पुराणपुरुषाय नमः । ॐ श्री सायि अतीताय नमः । ॐ श्री सायि कालातीताय नमः
    । ॐ श्री सायि सिद्धिरूपाय नमः । ॐ श्री सायि सिद्धसङ्कल्पाय नमः । ॐ श्री सायि आरोग्यप्रदाय नमः । ॐ
    श्री सायि अन्नवस्त्रदायिने नमः । ॐ श्री सायि संसारदुःख क्षयकराय नमः ॥ ॐ श्री सायि सर्वाभीष्टप्रदाय
    नमः । ॐ श्री सायि कल्याणगुणाय नमः । ॐ श्री सायि कर्मध्वंसिने नमः । ॐ श्री सायि साधुमानसशोभिताय नमः
    । ॐ श्री सायि सर्वमतसम्मताय नमः । ॐ श्री सायि साधुमानसपरिशोधकाय नमः । ॐ श्री सायि साधकानुग्रहवटवृक्षप्रतिष्ठापकाय
    नमः । ॐ श्री सायि सकलसंशयहराय नमः । ॐ श्री सायि सकलतत्त्वबोधकाय नमः । ॐ श्री सायि योगीश्वराय नमः ॥
    ॐ श्री सायि योगीन्द्रवन्दिताय नमः । ॐ श्री सायि सर्वमङ्गलकराय नमः । ॐ श्री सायि सर्वसिद्धिप्रदाय नमः
    । ॐ श्री सायि आपन्निवारिणे नमः । ॐ श्री सायि आर्तिहराय नमः । ॐ श्री सायि शान्तमूर्तये नमः । ॐ श्री
    सायि सुलभप्रसन्नाय नमः । ॐ श्री सायि भगवान् सत्यसायिबाबाय नमः ॥
