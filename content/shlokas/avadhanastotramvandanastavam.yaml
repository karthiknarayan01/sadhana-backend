id: avadhanastotramvandanastavam
category: stotram
name:
  english: avadhanastotramvandanastavam
  devanagari: अवधानस्तोत्रम्वन्दनास्तवम्
content:
  english: rgandharvayakshamunibhih parivanditaya | dvatrimshadadivaralakshanabhushitaya nityam namami
    shirasa karunamayaya || 1|| balarkakotisamatejakalevaraya alokite sugatashekharadharitaya | shubhramshumaulitilakaya
    jatadharaya nityam namami shirasa karunamayaya || 2|| ambhojapanikamalasanasamsthitaya yajnopavitaphanirajasumanditaya
    | ratnadiharakanakojjvalabhushitaya nityam namami shirasa karunamayaya || 3|| utpadabhangabhavasagaratarakaya
    durgrahadurgatibhuvam parimocakaya | ragadidoshaparimukta sunirmalaya nityam namami shirasa karunamayaya
    || 4|| maitryadibhishcaturabrahmaviharanaya dharamritaih sakalasattvasuposhanaya | mohandhakarakritadoshavidaranaya
    nityam namami shirasa karunamayaya || 5|| daityendravamshavalitaranamokshadaya sattvopakaratvaritakritanishcayaya
    | sarvajnajnanaparipuritadeshanaya nityam namami shirasa karunamayaya || 6|| ashtadashanarakamargavishodhanaya
    ajnanagadhatimiraparidhvamsanaya | jnanaikadrishtivyavalokitamokshadaya nityam namami shirasa karunamayaya
    || 7|| tvam lokanatha bhuvaneshvara supradaya daridrayaduhkhamayapanjaradaranaya | tvatpadapankajayugaprativanditaya
    nityam namami shirasa karunamayaya || 8|| martandamandalarucistathatasvabhavam tvam naumyahah suphaladah
    vimalaprabhavam | cintamanim susadrisham tvatidurbhago'ham nityam namami shirasa karunamayaya || 9||
    yadbhaktito dashanakhanjalisottamanga
  devanagari: र्गन्धर्वयक्षमुनिभिः परिवन्दिताय । द्वात्रिंशदादिवरलक्षणभूषिताय नित्यं नमामि शिरसा करुणामयाय
    ॥ १॥ बालार्ककोटिसमतेजकलेवराय आलोकिते सुगतशेखरधारिताय । शुभ्रांशुमौलितिलकाय जटधराय नित्यं नमामि शिरसा
    करुणामयाय ॥ २॥ अम्भोजपाणिकमलासनसंस्थिताय यज्ञोपवीतफणिराजसुमण्डिताय । रत्नादिहारकनकोज्ज्वलभूषिताय नित्यं
    नमामि शिरसा करुणामयाय ॥ ३॥ उत्पादभङ्गभवसागरतारकाय दुर्ग्राहदुर्गतिभुवां परिमोचकाय । रागादिदोषपरिमुक्त
    सुनिर्मलाय नित्यं नमामि शिरसा करुणामयाय ॥ ४॥ मैत्र्यादिभिश्चतुरब्रह्मविहारणाय धारामृतैः सकलसत्त्वसुपोषणाय
    । मोहान्धकारकृतदोषविदारणाय नित्यं नमामि शिरसा करुणामयाय ॥ ५॥ दैत्येन्द्रवंशवलितारणमोक्षदाय सत्त्वोपकारत्वरितकृतनिश्चयाय
    । सर्वज्ञज्ञानपरिपूरितदेशनाय नित्यं नमामि शिरसा करुणामयाय ॥ ६॥ अष्टादशनरकमार्गविशोधनाय अज्ञानगाढतिमिरपरिध्वंसनाय
    । ज्ञानैकदृष्टिव्यवलोकितमोक्षदाय नित्यं नमामि शिरसा करुणामयाय ॥ ७॥ त्वं लोकनाथ भुवनेश्वर सुप्रदाय
    दारिद्रयदुःखमयपञ्जरदारणाय । त्वत्पादपङ्कजयुगप्रतिवन्दिताय नित्यं नमामि शिरसा करुणामयाय ॥ ८॥ मार्तण्डमण्डलरुचिस्तथतास्वभावं
    त्वां नौम्यहः सुफलदः विमलप्रभावम् । चिन्तामणिं सुसदृशं त्वतिदुर्भगोऽहं नित्यं नमामि शिरसा करुणामयाय
    ॥ ९॥ यद्भक्तितो दशनखाञ्जलिसोत्तमाङ्ग
