id: parabrahmamahimnastotram
category: stotram
name:
  english: parabrahmamahimnastotram
  devanagari: परब्रह्ममहिम्नस्तोत्रम्
content:
  english: shriparabrahmamahimnastotram ishvara uvaca | katham nu vakshyami parasya tattvam yadvanmanahsimavilanghitam
    sat | yasminnidam bhati jagatsamagram yasmadidam naparamasti kincit || 1|| na tasya sankhya na ca
    namarashih na ruparekha na gunapravahah | svayamprakasham svayameva shantam svayambhuvam svatmamayam
    param tat || 2|| yadekamevadvitayam puranam yadekabijam bahudha vibhati | yadantarale'pi nirantaram
    tat yadavyaye vyomni cidekadhama || 3|| yatrodita vedagiro nivritta yatrarthajatam svayameva maunam
    | yatrashritah siddhagana munindrah svanandapurnah pranamanti nityam || 4|| tatsaviturmandalamadhyavartin
    natiprakasham na tamovishesham | dipasya dipam hridayantarastham bodhaikasaram paramam rahasyam ||
    5|| kali ca ya tarini durgarupa kshama ca ya shodashika prasiddha | radheti ya premamayi vibhati bhairavyaparam
    parameva sa hi || 6|| nanabhidhanairbahudha grihita nanasamacaravibhagayukta | eko rasah sarvanadipravahe
    yatharnave tadvadiyam pratishtha || 7|| na shaktamargo na ca vaishnavakhyah naivashritah shaivapatho
    na saurah | yatsarvamargaprabhavam sanityam tattattvamekam pranamami nityam || 8|| nishkampamantahkaranapradipam
    nirmuktasankalpavikalpajalam | nirvyuhamadvaitamahamahimnam nirmeghacandraprabhamaprameyam || 9||
    yannirjharanamapi nirjharatvam yadagnitejo'pi parityajatyeva | yadvayuvego'pi viliyate'nte yadambudharapi
    layam prayati || 10|| yatra kshano nasti na kalparekha yatraiva kalah svamapi tyajanti | yatra grahastarakapunjavarga
    dhulikanabha iva drishyarupah || 11|| tadeva nadah pranavasya garbhah tadeva bindurna ca bindureva
    | tadeva shunyam na ca shunyamatram tadeva purnam paripurnamekam || 12|| avacyavacyam paramarthagamyam
    drishyadidrishyam paridrishyahinam | gamyam na gantum manasapi shakyam jneyam na jnatum nigamairapiha
    || 13|| yatra pravishta bahavo mahantah na pratyavartanti kathancideva | svanandasindhau parimagnabhavah
    svayanjyotimshi svayameva bhutva || 14|| yadanghrirenorna patanti veda yannetrapate galitah puranah
    | yatsmerarekhasu viliyate'rthah tanmaunamekam sharanam mamastu || 15|| kim varnaye tadvibhavam mahatman
    yatraksharanamapi janma nasti | yatra svayamsakshini kevalatve stotram mamaitadapi lajjate'dya ||
    16|| aho kim brumastadanupamamavyaktavibhavam yato vaco yanti svayamapi vilajjanta iva | yato buddhirnityam
    pratinivartate vismayavati tadekam vande'ham paramamamritam nirvikritim || 17|| tvameva kali tarini
    sundari durga radhika tatha | chinna vairocini caiva madhumati bhairavi tatha || 18|| bagalambika
    kamalaya simantika vedagarbhika | tripadi ca para shaktih sarvanamaikakaranam || 19|| na te janmotpattirna
    ca nidhanarekhaparicayah na ca tvam samsargo na ca vikritibhedaprasarah | acintyasyapyantah parishishiradiptiprakarah
    svayanjyotirdhamnam paramapadavibhutavibhavah || 20|| yadiyam sancintya kshanamapi mahayoginivahah
    svabhavadunmuktah svayamiva bhavantyavyathahridah | yadiyacchayayam shrutishikharamaulinamitaya layam
    yantyarthaughah svapadanihitah svaprabhavatah || 21|| na vedo vedaste na ca nigamamulam tava padam
    na tantram tattvam te na ca samayasanketavishayah | yadekasminneva pralayajaladhau bhati vimalam tadantahsphurtyaikam
    paramahasi dhamni prathitam || 22|| vilaso no lila na ca parimitih kacana tava prakasho no'prakasha
    iti nipunairapyagamitah | yathambhodhergarbhe manigana ivanantarucayah tathaiva tvayyarthah svayamuditanidrah
    pralayinah || 23|| katham sakshatkuryam kathamapi na pashyami bhavatim katham dhyayeyam tvam kathamapi
    na cintami prithak | aho vismero'yam paramahasi gudhapranayitah svayam drashta drishyam svayamapi
    ca darshanakramah || 24|| yatraikasminnarthe bahuvacanamapyekavacanam yatraikasminnadau pralaya iva
    sargah prasarati | yatra kshobho'pyantah paramashishirasparshalahari tadetadbrahmaiva pranamata hrida
    maunanilayam || 25|| yadaksharam naksharamityabhidhatum na hi kshamah surendra brahmadya munivaraganashcapi
    satatam | atastvam vandamo natashirasi nihshabdavapusha yato maunam stotram bhavati paramam bhavanidhishu
    || 26|| yadullanghya svairam pracarati mahakalalahari yadudbhutah kalo'pi kshanakana ivavirbhavati
    | yadadhare dhatte dhruvamapi dhruvatvam dhruvapadam tadekam nityam te paramahasi dhama pranamyate
    || 27|| na yatronmesho'sti na ca nimisharekhapi bhavati na sandhirno bhedo na ca parinatih kacana
    punah | svabhavasyapyantah svayamabhinavah spharamahima vibhatyeko bhavah paramaparipurnah prashamitah
    || 28|| tvameva vyomabha tvamasi pavanaspandanamayi tvameva kshonibhrit tvamamritarasaprodgamabhuva
    | tvamevapo vahnistvamasi hridi cinmandalalata tvamevaikam tattvam bahirapi ca nanatvamiva || 29||
    tvameva kali tarini sundari durga radhika tatha | chinna vairocini caiva madhumati bhairavi tatha
    || 30|| bagalambika kamalaya simantika vedagarbhika | tripadi ca para devi sarvarupaikakaranam ||
    31|| na te maya maya na ca khalu mahamohanakari na te shaktih shaktirna ca prithagupadhiprasarah |
    yadekasyocchvase prakatitamidam vishvavalayam nishayamutsuptam punariva layam samshrayati tat || 32||
    yadantah saumyatvam dahati shatakotyarkakiranaih yadugratvam snigdham shishiramiva sandram prasrimaram
    | virodho'pyatraikah samarasataya vartata iti mahadbhirnirneyam na khalu matibhirlaukikajanaih ||
    33|| na sakshi no drishyam na ca khalu drishormadhyagatita na dhata no dheyah na ca karanavargaprasarah
    | akhandaikasvantaprathitaparipurnaprabhritayah svayanjatah santah svayamiha layam yanti bhavati ||
    34|| yadiyasyaikasmin smitalavavilasaprasaratah sahasranyandanam prakatitamaho vismayapadam | punastasminneva
    kshanalavavinidraprashamane na kinciddrishyam syat paramamiva kevalyamakhilam || 35|| anantanamantah
    parimitirapihaparicita paricchedacchedaprashamitapadapraudhiramala | niralambalambaprathitaparamarthaprakatanam
    tavaitadvaibhavyam kathamiva gira varnayatu kah || 36|| ato nihshesharthapravilayavinirmuktahridayah
    mahayogindraste natashirasa eva sthitimitah | na bhashante kincit smitamadhuramaunaikasarasah svayam
    bhutva tasmin svayamiva pare nirvritimayah || 37|| yato vedanam sragapi nikhila nihsritirabhut yato
    vedanganam vinihitapadam bhavanidhayah | yato'pyupavedah pravitatavicitrarthanicayah svayambhasa bhanti
    prakatitamaharthaprakarah || 38|| rigvedo yajurvedah samavedo'tharvanastatha | tvadiyapreranadeva
    svasvamargapravartakah || 39|| shiksha kalpo vyakaranam niruktam chanda eva ca | jyotisham ca tvadiyasya
    nihshvasa iva nirmalam || 40|| ayurdhanurgandharvashca sthapatyam copavedakam | tvadiyabodharekhayam
    kanika iva samsthitam || 41|| ashtadashapuranani tathopapuranasancayah | itihasadvayam divyam tvadbhavaikaprakashakam
    || 42|| vaishnavagamashastrani shaivagamasamudgamah | shaktatantraprabandhashca ganapatyadidarshanam
    || 43|| sauramargah kaumarashca pancaratraprakirtitah | sarve tvadiyasanketacchayamatraprakashakah
    || 44|| na mantro na yajno na tapasi na yogakriyapathah prithaktvena tvatto yadi pariganetkashcidabudhah
    | yathaikasminnarke prabhavati sahasramshunikarah tathaikasmimstvayyeva pravilasati sarvapranayita
    || 45|| tvam shrikulasundari dhumavati para | krishno ramacandrashca sakala yashoda yashumati || 46||
    ishaputrah parabhaktiryoniryonimandalam | yogini yogijanaprokta devadevi maheshvarah || 47|| tvameva
    shrutisima tvamasi hridayasyopari dhruva tvamevantahsukshma tvamasi bahirapyapratihata | tvamevarthanarthau
    tvamasi parihasah prashamita tvamevaikam guhyam svayamabhinavam cinmayapadam || 48|| na kenapyakhyeyam
    na ca kathanayogyam tava padam na coddeshyam lakshyam na ca layavikalpah kvacana te | aho ye sandadhyuh
    svahridi nikhilam maunasarasi te dhanyah santo hi svayamamritadharamadhishayah || 49|| yadiyacchayayam
    prasarati mahadbhutanivaho yadiyasparshena prakritirapi nrityatyanupadam | yadiyapratyagrasphuranalavaleshapranayini
    svayam siddhirbhati svayamapi ca nirvanasarita || 50|| na te desho desho na ca samayarekha tava vibho
    na madhyam no'nto na ca parita evasti bhavatah | anantasyapyantah svayamapi nirantahprathitata mahashanterdhamnah
    kimiva nu nidarshyam kavibhih || 51|| yadiyaikasminbinduni nihitamashesham bhuvanajam yadiyaikasminnucchvasiti
    sakalam jivitamidam | yadiyaikasminnistimitalaharau liyata idam jagajjalam sarvam svapita iva nirvyajamahasi
    || 52|| tvamevaksharanamagamaparamam maunapadavim tvamevarthanamantaritarasagudhaprabhavita | tvamevoddeshyanamapi
    nikhilasimantaragata svayam lakshyalakshyaprashamitamahacitraracana || 53|| na te siddhih sadhya na
    ca karanamargah pariganah na yogo no bhogo na ca viratirapyasti prithak | yadekasminneva prasarati
    samagrah parinayah svayamsiddham tattvam svayamamritamevadya satatam || 54|| prabuddhanam bodhah pranatahridayanam
    parigatih viraktanam shantih karunarasikanam pararucih | mahamaunavyaptaprasaravimalanandaracanam
    tvadiyam vaibhavyam na khalu parimatum prabhavati || 55|| yatraikah shvaso'pi shrutishatasamutpattijanakah
    yatraikah sankalpah pranavashatakotiprasarakrit | yatraikah sandarshah sakalamatabhedakshayakarah
    tadeva brahmakhyam paramamamalam kevalapadam || 56|| niralambalambaprakatanapatiyanapi girah svayam
    tatra stabdhah patita iva nihshabdasarasi | vicitrairvyakalpairupacitakavinamapi matih tavaikasmindhamni
    prasarati viliyeta sahasa || 57|| atah sarve bhavah svapadamiva samprapya sahasa vinihshesham tyaktva
    svakritimabhimanam ca sakalam | bhavantyekasvantaprasaraparipurnamritamayah pranamya tvam nityam paramaparipakam
    gatadhiyah || 58|| ya etatpunyam paramamahimnah stavamamalam samadhau va shante hridi vinihitaikagramatina
    | sakridvapi shraddhapranatimadhurenoccarati yah sa jivanmuktah syadapi na kathitairlakshanaganaih
    || 59|| na tasya prajnaya gananamupayati tridashatih na siddhinam sankhya na ca tapasi sima prathita
    | svayamsamvitsindhoh salilakanikamatramapi yah pibedasya stotradbhavati paripurnamritamayah || 60||
    na tasya vyadhirva na ca bhavabhayacchayanivahah na janmapradhvamsaprabhavaparikhedaprasaranam | yadiyapratyagraprasararasapathonidhilavat
    svayam samsaro'yam smitamiva vilino bhavati hi || 61|| yamuddishyaikagro nayanajalamekam patati cet
    tadashrauto binduh shatashatayugaradhanaphalam | yadekah shvaso'sya stavanapathanaveshavashagah sa
    kalpanam kotipranatiphalamekatra labhate || 62|| ayam na stotrarthah phalamiti na vacyam kavibhirapi
    phalam yatraivasti svayamiha tadeva stutiriyam | phalam napekshante paramahridayavishtamanasah svayampurnananda
    bhavati hi para bhaktiracalam || 63|| na lakshmirnaishvaryam na ca surapadam napi ca shivah na brahmatvam
    vishnoh padamapi na kamyam budhajanaih | yadekasminnantah paramamritanistandramahasi svayamsiddham
    tattvam tadiha labhate stotrarasikah || 64|| sa vedanam vedah sa nigamahridam hridyamamritam sa tantranam
    guhyam sa khalu samayanamapi parah | sa sarvesham bhavaprabhavavilayanamadhipatih svayam bhutva tishthet
    svayamakhilamekam parapadam || 65|| ato nityam bhaktya pranatimadhurairmanasapadaih pathedetadguhyam
    yadi manasi shuddhih prasrimata | na tasyapekshasti kvacidapi punarjanmavishaye param brahmaivaham
    iti sahasa sphurtirudiyat || 66|| iti shriparamayogeshvaratantre umamaheshvarasamvade catuhshashtitame
    patale yonikhande parabrahmamahimnastotram sampurnam ||
  devanagari: श्रीपरब्रह्ममहिम्नस्तोत्रम् ईश्वर उवाच । कथं नु वक्ष्यामि परस्य तत्त्वं यद्वाङ्मनःसीमविलङ्घितं
    सत् । यस्मिन्निदं भाति जगत्समग्रं यस्मादिदं नापरमस्ति किञ्चित् ॥ १॥ न तस्य सङ्ख्या न च नामराशिः न
    रूपरेखा न गुणप्रवाहः । स्वयम्प्रकाशं स्वयमेव शान्तं स्वयम्भुवं स्वात्ममयं परं तत् ॥ २॥ यदेकमेवाद्वितयं
    पुराणं यदेकबीजं बहुधा विभाति । यदन्तरालेऽपि निरन्तरं तत् यदव्यये व्योम्नि चिदेकधाम ॥ ३॥ यत्रोदिता
    वेदगिरो निवृत्ता यत्रार्थजातं स्वयमेव मौनम् । यत्राश्रिताः सिद्धगणा मुनीन्द्राः स्वानन्दपूर्णाः प्रणमन्ति
    नित्यम् ॥ ४॥ तत्सवितुर्मण्डलमध्यवर्तिन् नातिप्रकाशं न तमोविशेषम् । दीपस्य दीपं हृदयान्तरस्थं बोधैकसारं
    परमं रहस्यम् ॥ ५॥ काली च या तारिणि दुर्गरूपा क्षमा च या षोडशिका प्रसिद्धा । राधेति या प्रेममयी विभाति
    भैरव्यपारं परमेव सा हि ॥ ६॥ नानाभिधानैर्बहुधा गृहीता नानासमाचारविभागयुक्ता । एको रसः सर्वनदीप्रवाहे
    यथार्णवे तद्वदियं प्रतिष्ठा ॥ ७॥ न शाक्तमार्गो न च वैष्णवाख्यः नैवाश्रितः शैवपथो न सौरः । यत्सर्वमार्गप्रभवं
    सनित्यं तत्तत्त्वमेकं प्रणमामि नित्यम् ॥ ८॥ निष्कम्पमन्तःकरणप्रदीपं निर्मुक्तसङ्कल्पविकल्पजालम् ।
    निर्व्यूहमद्वैतमहामहिम्नं निर्मेघचन्द्रप्रभमप्रमेयम् ॥ ९॥ यन्निर्झराणामपि निर्झरत्वं यदग्नितेजोऽपि
    परित्यजत्येव । यद्वायुवेगोऽपि विलीयतेऽन्ते यदम्बुधारापि लयं प्रयाति ॥ १०॥ यत्र क्षणो नास्ति न कल्परेखा
    यत्रैव कालः स्वमपि त्यजन्ति । यत्र ग्रहास्तारकपुञ्जवर्गा धूलीकणाभा इव दृश्यरूपाः ॥ ११॥ तदेव नादः प्रणवस्य
    गर्भः तदेव बिन्दुर्न च बिन्दुरेव । तदेव शून्यं न च शून्यमात्रं तदेव पूर्णं परिपूर्णमेकम् ॥ १२॥ अवाच्यवाच्यं
    परमार्थगम्यं दृश्यादिदृश्यं परिदृश्यहीनम् । गम्यं न गन्तुं मनसापि शक्यं ज्ञेयं न ज्ञातुं निगमैरपीह
    ॥ १३॥ यत्र प्रविष्टा बहवो महान्तः न प्रत्यवर्तन्ति कथञ्चिदेव । स्वानन्दसिन्धौ परिमग्नभावाः स्वयञ्ज्योतींषि
    स्वयमेव भूत्वा ॥ १४॥ यदङ्घ्रिरेणोर्न पतन्ति वेदा यन्नेत्रपाते गलिताः पुराणाः । यत्स्मेररेखासु विलीयतेऽर्थः
    तन्मौनमेकं शरणं ममास्तु ॥ १५॥ किं वर्णये तद्विभवं महात्मन् यत्राक्षराणामपि जन्म नास्ति । यत्र स्वयंसाक्षिणि
    केवलत्वे स्तोत्रं ममैतदपि लज्जतेऽद्य ॥ १६॥ अहो किं ब्रूमस्तदनुपममव्यक्तविभवं यतो वाचो यान्ति स्वयमपि
    विलज्जन्त इव । यतो बुद्धिर्नित्यं प्रतिनिवर्तते विस्मयवती तदेकं वन्देऽहं परमममृतं निर्विकृतिम् ॥ १७॥
    त्वमेव काली तारिणी सुन्दरी दुर्गा राधिका तथा । छिन्ना वैरोचिनी चैव मधुमती भैरवी तथा ॥ १८॥ बगलाम्बिका
    कमलया सीमन्तिका वेदगर्भिका । त्रिपदी च परा शक्तिः सर्वनामैककारणम् ॥ १९॥ न ते जन्मोत्पत्तिर्न च निधनरेखापरिचयः
    न च त्वं संसर्गो न च विकृतिभेदप्रसरः । अचिन्त्यस्याप्यन्तः परिशिशिरदीप्तिप्रकरः स्वयञ्ज्योतिर्धाम्नां
    परमपदवीभूतविभवः ॥ २०॥ यदीयं सञ्चिन्त्य क्षणमपि महायोगिनिवहाः स्वभावादुन्मुक्ताः स्वयमिव भवन्त्यव्यथहृदः
    । यदीयच्छायायां श्रुतिशिखरमौलीनमितया लयं यान्त्यर्थौघाः स्वपदनिहिताः स्वप्रभवतः ॥ २१॥ न वेदो वेदस्ते
    न च निगममूलं तव पदं न तन्त्रं तत्त्वं ते न च समयसङ्केतविषयः । यदेकस्मिन्नेव प्रलयजलधौ भाति विमलं तदन्तःस्फूर्त्यैकं
    परमहसि धाम्नि प्रथितम् ॥ २२॥ विलासो नो लीला न च परिमितिः काचन तव प्रकाशो नोऽप्रकाश इति निपुणैरप्यगमितः
    । यथाम्भोधेर्गर्भे मणिगण इवानन्तरुचयः तथैव त्वय्यर्थाः स्वयमुदितनिद्राः प्रलयिनः ॥ २३॥ कथं साक्षात्कुर्यां
    कथमपि न पश्यामि भवतीं कथं ध्यायेयं त्वां कथमपि न चिन्तामि पृथक् । अहो विस्मेरोऽयं परमहसि गूढप्रणयितः
    स्वयं द्रष्टा दृश्यं स्वयमपि च दर्शनक्रमः ॥ २४॥ यत्रैकस्मिन्नर्थे बहुवचनमप्येकवचनं यत्रैकस्मिन्नादौ
    प्रलय इव सर्गः प्रसरति । यत्र क्षोभोऽप्यन्तः परमशिशिरस्पर्शलहरी तदेतद्ब्रह्मैव प्रणमत हृदा मौननिलयम्
    ॥ २५॥ यदक्षरं नाक्षरमित्यभिधातुं न हि क्षमाः सुरेन्द्रा ब्रह्माद्या मुनिवरगणाश्चापि सततम् । अतस्त्वां
    वन्दामो नतशिरसि निःशब्दवपुषा यतो मौनं स्तोत्रं भवति परमं भावनिधिषु ॥ २६॥ यदुल्लङ्घ्य स्वैरं प्रचरति
    महाकाललहरी यदुद्भूतः कालोऽपि क्षणकण इवाविर्भवति । यदाधारे धत्ते ध्रुवमपि ध्रुवत्वं ध्रुवपदं तदेकं
    नित्यं ते परमहसि धाम प्रणम्यते ॥ २७॥ न यत्रोन्मेषोऽस्ति न च निमिषरेखापि भवति न सन्धिर्नो भेदो न च
    परिणतिः काचन पुनः । स्वभावस्याप्यन्तः स्वयमभिनवः स्फारमहिमा विभात्येको भावः परमपरिपूर्णः प्रशमितः
    ॥ २८॥ त्वमेव व्योमाभा त्वमसि पवनस्पन्दनमयी त्वमेव क्षोणीभृत् त्वममृतरसप्रोद्गमभुवा । त्वमेवापो वह्निस्त्वमसि
    हृदि चिन्मण्डललता त्वमेवैकं तत्त्वं बहिरपि च नानात्वमिव ॥ २९॥ त्वमेव काली तारिणी सुन्दरी दुर्गा राधिका
    तथा । छिन्ना वैरोचिनी चैव मधुमती भैरवी तथा ॥ ३०॥ बगलाम्बिका कमलया सीमन्तिका वेदगर्भिका । त्रिपदी च
    परा देवि सर्वरूपैककारणम् ॥ ३१॥ न ते माया माया न च खलु महामोहनकरी न ते शक्तिः शक्तिर्न च पृथगुपाधिप्रसरः
    । यदेकस्योच्छ्वासे प्रकटितमिदं विश्ववलयं निशायामुत्सुप्तं पुनरिव लयं संश्रयति तत् ॥ ३२॥ यदन्तः सौम्यत्वं
    दहति शतकोट्यर्ककिरणैः यदुग्रत्वं स्निग्धं शिशिरमिव सान्द्रं प्रसृमरम् । विरोधोऽप्यत्रैकः समरसतया वर्तत
    इति महद्भिर्निर्णेयं न खलु मतिभिर्लौकिकजनैः ॥ ३३॥ न साक्षी नो दृश्यं न च खलु दृशोर्मध्यगतिता न धाता
    नो धेयः न च करणवर्गप्रसरः । अखण्डैकस्वान्तप्रथितपरिपूर्णप्रभृतयः स्वयञ्जाताः सन्तः स्वयमिह लयं यान्ति
    भवति ॥ ३४॥ यदीयस्यैकस्मिन् स्मितलवविलासप्रसरतः सहस्राण्यण्डानां प्रकटितमहो विस्मयपदम् । पुनस्तस्मिन्नेव
    क्षणलवविनिद्राप्रशमने न किञ्चिद्दृश्यं स्यात् परममिव केवल्यमखिलम् ॥ ३५॥ अनन्तानामन्तः परिमितिरपीहापरिचिता
    परिच्छेदच्छेदप्रशमितपदप्रौढिरमला । निरालम्बालम्बप्रथितपरमार्थप्रकटनं तवैतद्वैभव्यं कथमिव गिरा वर्णयतु
    कः ॥ ३६॥ अतो निःशेषार्थप्रविलयविनिर्मुक्तहृदयाः महायोगीन्द्रास्ते नतशिरस एव स्थितिमिताः । न भाषन्ते
    किञ्चित् स्मितमधुरमौनैकसरसाः स्वयं भूत्वा तस्मिन् स्वयमिव परे निर्वृतिमयाः ॥ ३७॥ यतो वेदानां स्रगपि
    निखिला निःसृतिरभूत् यतो वेदाङ्गानां विनिहितपदं भावनिधयः । यतोऽप्युपवेदाः प्रविततविचित्रार्थनिचयाः
    स्वयम्भासा भान्ति प्रकटितमहार्थप्रकराः ॥ ३८॥ ऋग्वेदो यजुर्वेदः सामवेदोऽथर्वणस्तथा । त्वदीयप्रेरणादेव
    स्वस्वमार्गप्रवर्तकाः ॥ ३९॥ शिक्षा कल्पो व्याकरणं निरुक्तं छन्द एव च । ज्योतिषं च त्वदीयस्य निःश्वास
    इव निर्मलम् ॥ ४०॥ आयुर्धनुर्गान्धर्वश्च स्थापत्यं चोपवेदकम् । त्वदीयबोधरेखायां कणिका इव संस्थितम्
    ॥ ४१॥ अष्टादशपुराणानि तथोपपुराणसञ्चयाः । इतिहासद्वयं दिव्यं त्वद्भावैकप्रकाशकम् ॥ ४२॥ वैष्णवागमशास्त्राणि
    शैवागमसमुद्गमाः । शाक्ततन्त्रप्रबन्धाश्च गणपत्यादिदर्शनम् ॥ ४३॥ सौरमार्गः कौमारश्च पाञ्चरात्रप्रकीर्तितः
    । सर्वे त्वदीयसङ्केतच्छायामात्रप्रकाशकाः ॥ ४४॥ न मन्त्रो न यज्ञो न तपसि न योगक्रियापथः पृथक्त्वेन
    त्वत्तो यदि परिगणेत्कश्चिदबुधः । यथैकस्मिन्नर्के प्रभवति सहस्रांशुनिकरः तथैकस्मिंस्त्वय्येव प्रविलसति
    सर्वप्रणयिता ॥ ४५॥ त्वं श्रीकुलसुन्दरी धूमावती परा । कृष्णो रामचन्द्रश्च सकला यशोदा यशुमती ॥ ४६॥ ईशपुत्रः
    पराभक्तिर्योनिर्योनिमण्डलम् । योगिनी योगिजनप्रोक्ता देवदेवी महेश्वरः ॥ ४७॥ त्वमेव श्रुतिसीमा त्वमसि
    हृदयस्योपरि ध्रुवा त्वमेवान्तःसूक्ष्मा त्वमसि बहिरप्यप्रतिहता । त्वमेवार्थानर्थौ त्वमसि परिहासः प्रशमिता
    त्वमेवैकं गुह्यं स्वयमभिनवं चिन्मयपदम् ॥ ४८॥ न केनाप्याख्येयं न च कथनयोग्यं तव पदं न चोद्देश्यं लक्ष्यं
    न च लयविकल्पः क्वचन ते । अहो ये सन्दध्युः स्वहृदि निखिलं मौनसरसि ते धन्याः सन्तो हि स्वयममृतधारामधिशयाः
    ॥ ४९॥ यदीयच्छायायां प्रसरति महद्भूतनिवहो यदीयस्पर्शेन प्रकृतिरपि नृत्यत्यनुपदम् । यदीयप्रत्यग्रस्फुरणलवलेशप्रणयिनी
    स्वयं सिद्धिर्भाति स्वयमपि च निर्वाणसरिता ॥ ५०॥ न ते देशो देशो न च समयरेखा तव विभो न मध्यं नोऽन्तो
    न च परित एवास्ति भवतः । अनन्तस्याप्यन्तः स्वयमपि निरन्तःप्रथितता महाशान्तेर्धाम्नः किमिव नु निदर्श्यं
    कविभिः ॥ ५१॥ यदीयैकस्मिन्बिन्दुनि निहितमशेषं भुवनजं यदीयैकस्मिन्नुच्छ्वसिति सकलं जीवितमिदम् । यदीयैकस्मिन्निस्तिमितलहरौ
    लीयत इदं जगज्जालं सर्वं स्वपित इव निर्व्याजमहसि ॥ ५२॥ त्वमेवाक्षराणामगमपरमं मौनपदवीं त्वमेवार्थानामन्तरितरसगूढप्रभविता
    । त्वमेवोद्देश्यानामपि निखिलसीमान्तरगता स्वयं लक्ष्यालक्ष्यप्रशमितमहाचित्ररचना ॥ ५३॥ न ते सिद्धिः
    साध्या न च करणमार्गः परिगणः न योगो नो भोगो न च विरतिरप्यस्ति पृथक् । यदेकस्मिन्नेव प्रसरति समग्रः
    परिनयः स्वयंसिद्धं तत्त्वं स्वयममृतमेवाद्य सततम् ॥ ५४॥ प्रबुद्धानां बोधः प्रणतहृदयानां परिगतिः विरक्तानां
    शान्तिः करुणरसिकानां पररुचिः । महामौनव्याप्तप्रसरविमलानन्दरचनं त्वदीयं वैभव्यं न खलु परिमातुं प्रभवति
    ॥ ५५॥ यत्रैकः श्वासोऽपि श्रुतिशतसमुत्पत्तिजनकः यत्रैकः सङ्कल्पः प्रणवशतकोटीप्रसरकृत् । यत्रैकः सन्दर्शः
    सकलमतभेदक्षयकरः तदेव ब्रह्माख्यं परमममलं केवलपदम् ॥ ५६॥ निरालम्बालम्बप्रकटनपटीयानपि गिरः स्वयं तत्र
    स्तब्धाः पतित इव निःशब्दसरसि । विचित्रैर्व्याकल्पैरुपचितकवीनामपि मतिः तवैकस्मिन्धाम्नि प्रसरति विलीयेत
    सहसा ॥ ५७॥ अतः सर्वे भावाः स्वपदमिव सम्प्राप्य सहसा विनिःशेषं त्यक्त्वा स्वकृतिमभिमानं च सकलम् । भवन्त्येकस्वान्तप्रसरपरिपूर्णामृतमयाः
    प्रणम्य त्वां नित्यं परमपरिपाकं गतधियः ॥ ५८॥ य एतत्पुण्यं परममहिम्नः स्तवममलं समाधौ वा शान्ते हृदि
    विनिहितैकाग्रमतिना । सकृद्वापि श्रद्धाप्रणतिमधुरेणोच्चरति यः स जीवन्मुक्तः स्यादपि न कथितैर्लक्षणगणैः
    ॥ ५९॥ न तस्य प्रज्ञाया गणनमुपयाति त्रिदशतिः न सिद्धीनां सङ्ख्या न च तपसि सीमा प्रथिता । स्वयंसंवित्सिन्धोः
    सलिलकणिकामात्रमपि यः पिबेदस्य स्तोत्राद्भवति परिपूर्णामृतमयः ॥ ६०॥ न तस्य व्याधिर्वा न च भवभयच्छायनिवहः
    न जन्मप्रध्वंसप्रभवपरिखेदप्रसरणम् । यदीयप्रत्यग्रप्रसररसपाथोनिधिलवात् स्वयं संसारोऽयं स्मितमिव विलीनो
    भवति हि ॥ ६१॥ यमुद्दिश्यैकाग्रो नयनजलमेकं पतति चेत् तदश्रौतो बिन्दुः शतशतयुगाराधनफलम् । यदेकः श्वासोऽस्य
    स्तवनपठनावेशवशगः स कल्पानां कोटिप्रणतिफलमेकत्र लभते ॥ ६२॥ अयं न स्तोत्रार्थः फलमिति न वाच्यं कविभिरपि
    फलं यत्रैवास्ति स्वयमिह तदेव स्तुतिरियम् । फलं नापेक्षन्ते परमहृदयाविष्टमनसः स्वयम्पूर्णानन्दा भवति
    हि परा भक्तिरचलम् ॥ ६३॥ न लक्ष्मीर्नैश्वर्यं न च सुरपदं नापि च शिवः न ब्रह्मत्वं विष्णोः पदमपि न काम्यं
    बुधजनैः । यदेकस्मिन्नन्तः परममृतनिस्तन्द्रमहसि स्वयंसिद्धं तत्त्वं तदिह लभते स्तोत्ररसिकः ॥ ६४॥ स
    वेदानां वेदः स निगमहृदां हृद्यममृतं स तन्त्राणां गुह्यं स खलु समयानामपि परः । स सर्वेषां भावप्रभवविलयानामधिपतिः
    स्वयं भूत्वा तिष्ठेत् स्वयमखिलमेकं परपदम् ॥ ६५॥ अतो नित्यं भक्त्या प्रणतिमधुरैर्मानसपदैः पठेदेतद्गुह्यं
    यदि मनसि शुद्धिः प्रसृमता । न तस्यापेक्षास्ति क्वचिदपि पुनर्जन्मविषये परं ब्रह्मैवाहं इति सहसा स्फूर्तिरुदियात्
    ॥ ६६॥ इति श्रीपरमयोगेश्वरतन्त्रे उमामाहेश्वरसंवादे चतुःषष्टितमे पटले योनिखण्डे परब्रह्ममहिम्नस्तोत्रं
    सम्पूर्णम् ॥
