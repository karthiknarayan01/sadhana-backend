id: yoganayikasahasranamastotram
category: sahasranama
name:
  english: yoganayikasahasranamastotram
  devanagari: योगनायिकासहस्रनामस्तोत्रम्
content:
  english: vara || 39|| vapurayitashricakra varada varavarnini | varahavadanaradhya varnapancadashatmika
    || 40|| vasishtharcya valkalantarhitaramyastanadvayi | vashini vallaki varna varshakalaprapujita ||
    41|| valli vasudalaprantavrittakatyashritadara | varga varavrisharudha vashanmantrasusamjnaka || 42||
    valayakaravaiduryavarakankanabhushana | vajrancitashirobhusha vajramangalyabhushita || 43|| vagvadini
    vamakeshi vacaspativaraprada | vadini vagadhishthatri varuni vayusevita || 44|| vatsyayanasutantrokta
    vani vakyapadarthaja | vadyaghoshapriya vadyavrindarambhanatotsuka || 45|| vapikupasamipastha vartali
    vamalocana | vastoshpatidya vamanghridhritanupurashobhita || 46|| vama varanasikshetra vadaveyavaraprada
    | vamanga vanchitaphaladatri vacalakhandita || 47|| vacyavacakavakyartha vamana vajivahana | vasukikanthabhushadhyavamadevapriyangana
    || 48|| vijaya vimala vishva vigraha vidhritankusha | vinodavanavastavya vibhaktanda vidhidita ||
    49|| vikrama vishajantughni vishvamitravaraprada | vishvambhara vishnushaktirvijijnasavicakshana ||
    50|| vitankatyagarajendrapithasamstha vidhidita | vidita vishvajanani vistaritacamubala || 51|| vidyavinayasampanna
    vidyadvadashanayika | vibhakaratyarbudabha vidhatri vindhyavasini || 52|| virupakshasakhi vishvanathavamorusamsthita
    | vishalya vishikha vighna viprarupa viharini || 53|| vinayakaguhakrida vishalakshi viragini | vipula
    vishvarupakhya vishaghni vishvabhamini || 54|| vishoka viraja vipra vidyullekheva bhasura | viparitaratipritapatirvijayasamyuta
    || 55|| virincivishnuvanitadhritacamarasevita | virapanapriya vira vinapustakadharini || 56|| viramartandavarada
    virabahupriyankari | virashtashtakaparita virashurajanapriya || 57|| vijitashricamaradhrillakshmivaninishevita
    | viralakshmirvitihotranitila virabhadraka || 58|| vriksharajasumulastha vrishabhadhvajalanchana |
    vrishakapayi vrittajna vriddha vrittantanayika || 59|| vrivrivarnangavinyasa venikritashiroruha |
    vedika vedavinuta vetandakritavahana || 60|| vedamata vegahantri vetasigrihamadhyaga | vetalanatanaprita
    venkatadrinivasini || 61|| venuvinamridangadi vadyaghoshavisharada | veshini vainateyanukampini vairinashini
    || 62|| vainayaki vaidyamata vaishnavi vainikasvana | vaijayantishtavarada vaikunthavarasodari ||
    63|| vaishakhapujita vaishya vaidehi vaidyashasini | vaikuntha vaijayantidya vaiyaghramunisevita ||
    64|| vaihayasinatirasa vaushatshraushatsvarupini | vandita vangadeshastha vamshaganavinodini || 65||
    vamryadirakshika vankrirvandarujanavatsala | vanditakhilalokashrih vakshahsthalamanohara || 66|| sharvani
    sharabhakara shaptajanmanuragini | shakvari shamitaghaugha shakta shatakararcita || 67|| shaci sharavati
    shakrasevya shayitasundari | sharabhricchabari shaktimohini shanapushpika || 68|| shakuntakshi shakarakhya
    shatasahasrapujita | shabdamata shatavrittipujita shatrunashini || 69|| shatananda shatamukhi shamibilvapriya
    shashi | shanakaih padavinyastapradakshinanatipriya || 70|| shatakumbhabhishiktangi shatakumbhastanadvayi
    | shatatapamunindredya shalavrikshakritalaya || 71|| shasaka shakvaraprita shala shakambharinuta |
    sharngapanibala shastrijanani sharadambika || 72|| shapamuktamanuprita shabariveshadharini | shambhavi
    shashvataishvarya shasanadhinavallabha || 73|| shastratattvarthanilaya shalivahanavandita | shardulacarmavastavya
    shantipaushtikanayika || 74|| shantida shalida shapamocini shadavapriya | sharika shukahastordhva
    shakhanekantarashruta || 75|| shakaladimarikshakhamantrakirtitavaibhava | shivakameshvarankastha shikhandimahishi
    shiva || 76|| shivarambha shivadvaita shivasayujyadayini | shivasankalpamantredya shivena saha modita
    || 77|| shirishapushpasankasha shitikanthakutumbini | shivamargavidam shreshtha shivakameshasundari
    || 78|| shivanatyaparitangi shivajnanapradayini | shivanrittasadalokamanasa shivasakshini || 79||
    shivakamakhyakoshthastha shishuda shishurakshaki | shivagamaikarasika shikshitasurakanyaka || 80||
    shilpishalakritavasa shikhivaha shilamayi | shimshapavrikshaphalavadbhinnanekarimastaka || 81|| shirahsthitenducakranka
    shitikumbhasumapriya | shinjannupurabhushattakritamanmathabherika || 82|| shiveshta shibikarudha shivaravabhayankari
    | shirordhvanilayasina shivashaktyaikyarupini || 83|| shivasanasamavishta shivarcya shivavallabha
    | shivadarshanasantushta shivamantrajapapriya || 84|| shivaduti shivananya shivasanasamanvita | shishyacaritashailesha
    shivaganavigayini || 85|| shivashailakritavasa shivamba shivakomala | shivagangasarastirapratyanmandiravasini
    || 86|| shivakshararambhapancadashaksharamanupriya | shikhadevi shivabhinna shivatattvavimarshini
    || 87|| shivalokanasantushta shivardhangasukomala | shivaratridinaradhya shivasya hridayangama ||
    88|| shivarupa shivapara shivavakyarthabodhini | shivarcanarata shilpalakshana shilpisevita || 89||
    shivagamarahasyoktya shivohambhavitantara | shimbijashravanananda shimantarnamamantrarat || 90|| shikara
    shitala shila shitapankajamadhyaga | shitabhiruh shighragantri shirshaka shikaraprabha || 91|| shitacamikarabhasa
    shirshoddhupitakuntala | shitagangajalasnata shuka
  devanagari: वरा ॥ ३९॥ वपुरायितश्रीचक्रा वरदा वरवर्णिनी । वराहवदनाराध्या वर्णपञ्चदशात्मिका ॥ ४०॥ वसिष्ठार्च्या
    वल्कलान्तर्हितरम्यस्तनद्वयी । वशिनी वल्लकी वर्णा वर्षाकालप्रपूजिता ॥ ४१॥ वल्ली वसुदलप्रान्तवृत्तकट्याश्रितादरा
    । वर्गा वरवृषारूढा वषण्मन्त्रसुसंज्ञका ॥ ४२॥ वलयाकारवैडूर्यवरकङ्कणभूषणा । वज्राञ्चितशिरोभूषा वज्रमाङ्गल्यभूषिता
    ॥ ४३॥ वाग्वादिनी वामकेशी वाचस्पतिवरप्रदा । वादिनी वागधिष्ठात्री वारुणी वायुसेविता ॥ ४४॥ वात्स्यायनसुतन्त्रोक्ता
    वाणी वाक्यपदार्थजा । वाद्यघोषप्रिया वाद्यवृन्दारम्भनटोत्सुका ॥ ४५॥ वापीकूपसमीपस्था वार्ताली वामलोचना
    । वास्तोष्पतीड्या वामाङ्घ्रिधृतनूपुरशोभिता ॥ ४६॥ वामा वाराणसीक्षेत्रा वाडवेयवरप्रदा । वामाङ्गा वाञ्छितफलदात्री
    वाचालखण्डिता ॥ ४७॥ वाच्यवाचकवाक्यार्था वामना वाजिवाहना । वासुकीकण्ठभूषाढ्यवामदेवप्रियाङ्गना ॥ ४८॥
    विजया विमला विश्वा विग्रहा विधृताङ्कुशा । विनोदवनवास्तव्या विभक्ताण्डा विधीडिता ॥ ४९॥ विक्रमा विषजन्तुघ्नी
    विश्वामित्रवरप्रदा । विश्वम्भरा विष्णुशक्तिर्विजिज्ञासाविचक्षणा ॥ ५०॥ विटङ्कत्यागराजेन्द्रपीठसंस्था
    विधीडिता । विदिता विश्वजननी विस्तारितचमूबला ॥ ५१॥ विद्याविनयसम्पन्ना विद्याद्वादशनायिका । विभाकरात्यर्बुदाभा
    विधात्री विन्ध्यवासिनी ॥ ५२॥ विरूपाक्षसखी विश्वनाथवामोरुसंस्थिता । विशल्या विशिखा विघ्ना विप्ररूपा
    विहारिणी ॥ ५३॥ विनायकगुहक्रीडा विशालाक्षी विरागिणी । विपुला विश्वरूपाख्या विषघ्नी विश्वभामिनी ॥ ५४॥
    विशोका विरजा विप्रा विद्युल्लेखेव भासुरा । विपरीतरतिप्रीतपतिर्विजयसंयुता ॥ ५५॥ विरिञ्चिविष्णुवनिताधृतचामरसेविता
    । वीरपानप्रिया वीरा वीणापुस्तकधारिणी ॥ ५६॥ वीरमार्तण्डवरदा वीरबाहुप्रियङ्करी । वीराष्टाष्टकपरीता वीरशूरजनप्रिया
    ॥ ५७॥ वीजितश्रीचामरधृल्लक्ष्मीवाणीनिषेविता । वीरलक्ष्मीर्वीतिहोत्रनिटिला वीरभद्रका ॥ ५८॥ वृक्षराजसुमूलस्था
    वृषभध्वजलाञ्छना । वृषाकपायी वृत्तज्ञा वृद्धा वृत्तान्तनायिका ॥ ५९॥ वृवॄवर्णाङ्गविन्यासा वेणीकृतशिरोरुहा
    । वेदिका वेदविनुता वेतण्डकृतवाहना ॥ ६०॥ वेदमाता वेगहन्त्री वेतसीगृहमध्यगा । वेतालनटनप्रीता वेङ्कटाद्रिनिवासिनी
    ॥ ६१॥ वेणुवीणामृदङ्गादि वाद्यघोषविशारदा । वेषिणी वैनतेयानुकम्पिनी वैरिनाशिनी ॥ ६२॥ वैनायकी वैद्यमाता
    वैष्णवी वैणिकस्वना । वैजयन्तीष्टवरदा वैकुण्ठवरसोदरी ॥ ६३॥ वैशाखपूजिता वैश्या वैदेही वैद्यशासिनी ।
    वैकुण्ठा वैजयन्तीड्या वैयाघ्रमुनिसेविता ॥ ६४॥ वैहायसीनटीरासा वौषट्श्रौषट्स्वरूपिणी । वन्दिता वङ्गदेशस्था
    वंशगानविनोदिनी ॥ ६५॥ वम्र्यादिरक्षिका वङ्क्रिर्वन्दारुजनवत्सला । वन्दिताखिललोकश्रीः वक्षःस्थलमनोहरा
    ॥ ६६॥ शर्वाणी शरभाकारा शप्तजन्मानुरागिणी । शक्वरी शमिताघौघा शक्ता शतकरार्चिता ॥ ६७॥ शची शरावती शक्रसेव्या
    शयितसुन्दरी । शरभृच्छबरी शक्तिमोहिनी शणपुष्पिका ॥ ६८॥ शकुन्ताक्षी शकाराख्या शतसाहस्रपुजिता । शब्दमाता
    शतावृत्तिपूजिता शत्रुनाशिनी ॥ ६९॥ शतानन्दा शतमुखी शमीबिल्वप्रिया शशी । शनकैः पदविन्यस्तप्रदक्षिणनतिप्रिया
    ॥ ७०॥ शातकुम्भाभिषिक्ताङ्गी शातकुम्भस्तनद्वयी । शातातपमुनीन्द्रेड्या शालवृक्षकृतालया ॥ ७१॥ शासका शाक्वरप्रीता
    शाला शाकम्भरीनुता । शार्ङ्गपाणिबला शास्तृजननी शारदाम्बिका ॥ ७२॥ शापमुक्तमनुप्रीता शाबरीवेषधारिणी ।
    शाम्भवी शाश्वतैश्वर्या शासनाधीनवल्लभा ॥ ७३॥ शास्त्रतत्त्वार्थनिलया शालिवाहनवन्दिता । शार्दूलचर्मवास्तव्या
    शान्तिपौष्टिकनायिका ॥ ७४॥ शान्तिदा शालिदा शापमोचिनी शाडवप्रिया । शारिका शुकहस्तोर्ध्वा शाखानेकान्तरश्रुता
    ॥ ७५॥ शाकलादिमऋक्शाखामन्त्रकीर्तितवैभवा । शिवकामेश्वराङ्कस्था शिखण्डिमहिषी शिवा ॥ ७६॥ शिवारम्भा शिवाद्वैता
    शिवसायुज्यदायिनी । शिवसङ्कल्पमन्त्रेड्या शिवेन सह मोदिता ॥ ७७॥ शिरीषपुष्पसङ्काशा शितिकण्ठकुटुम्बिनी
    । शिवमार्गविदां श्रेष्ठा शिवकामेशसुन्दरी ॥ ७८॥ शिवनाट्यपरीताङ्गी शिवज्ञानप्रदायिनी । शिवनृत्तसदालोकमानसा
    शिवसाक्षिणी ॥ ७९॥ शिवकामाख्यकोष्ठस्था शिशुदा शिशुरक्षकी । शिवागमैकरसिका शिक्षितासुरकन्यका ॥ ८०॥ शिल्पिशालाकृतावासा
    शिखिवाहा शिलामयी । शिंशपावृक्षफलवद्भिन्नानेकारिमस्तका ॥ ८१॥ शिरःस्थितेन्दुचक्राङ्का शितिकुम्भसुमप्रिया
    । शिञ्जन्नूपुरभूषात्तकृतमन्मथभेरिका ॥ ८२॥ शिवेष्टा शिबिकारूढा शिवारावाभयङ्करी । शिरोर्ध्वनिलयासीना
    शिवशक्त्यैक्यरूपिणी ॥ ८३॥ शिवासनसमाविष्टा शिवार्च्या शिववल्लभा । शिवदर्शनसन्तुष्टा शिवमन्त्रजपप्रिया
    ॥ ८४॥ शिवदूती शिवानन्या शिवासनसमन्विता । शिष्याचरितशैलेशा शिवगानविगायिनी ॥ ८५॥ शिवशैलकृतावासा शिवाम्बा
    शिवकोमला । शिवगङ्गासरस्तीरप्रत्यङ्मन्दिरवासिनी ॥ ८६॥ शिवाक्षरारम्भपञ्चदशाक्षरमनुप्रिया । शिखादेवी
    शिवाभिन्ना शिवतत्त्वविमर्शिनी ॥ ८७॥ शिवालोकनसन्तुष्टा शिवार्धाङ्गसुकोमला । शिवरात्रिदिनाराध्या शिवस्य
    हृदयङ्गमा ॥ ८८॥ शिवरूपा शिवपरा शिववाक्यार्थबोधिनी । शिवार्चनरता शिल्पलक्षणा शिल्पिसेविता ॥ ८९॥ शिवागमरहस्योक्त्या
    शिवोहम्भावितान्तरा । शिम्बीजश्रवणानन्दा शिमन्तर्नाममन्त्रराट् ॥ ९०॥ शीकारा शीतला शीला शीतपङ्कजमध्यगा
    । शीतभीरुः शीघ्रगन्त्री शीर्षका शीकरप्रभा ॥ ९१॥ शीतचामीकराभासा शीर्षोद्धूपितकुन्तला । शीतगङ्गाजलस्नाता
    शुका
