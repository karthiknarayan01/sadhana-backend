id: raghavendrasahasranamastotram
category: stotram
name:
  english: raghavendrasahasranamastotram
  devanagari: राघवेन्द्रसहस्रनामस्तोत्रम्
content:
  english: nijapradakshinenaiva sarvayatraphalapradah || 108|| nitiman nutapadabjo nyunapurnatvavarjitah
    | nidratyagi nisprihashca nidradoshanivaranah || 109|| nutanamshukadhari ca nripapujitapadukah | nrinam
    sukhaprado neta netranandakarakritih || 110|| niyami naigamadyaishca bhaktibhavena sevitah | nedishtho
    bhajatam bhaktya nauka bhaktabhavambudheh || 111|| nandatmajapriyo natho nandano nandanadrumah | prasannah
    paritapaghnah prasiddhah paratapahrit || 112|| prathamah pratipannarthah prasadhitamahatapah | parakramajitaratih
    pratimanavivarjitah || 113|| pravarah prakramajnashca paravadijayapradah pramukhah prabalah prajnashali
    pratyuhanashakah || 114|| prapanjasukhadata ca prakritisthah pravrittikrit | prabhutasampat patrornadhari
    pranavatatparah || 115|| pracandah pradaradhvamsi pratigrahavivarjitah | pratyakshaphaladata ca prasadabhimukhah
    parah || 116|| pathakah pavanah pata pranadata prasadakrit | praptasiddhih parijatadarpaha pakasadhanah
    || 117|| patirapadukah parshvavarti parayanapriyah | pinyakikritadurvadi pita pidavinashakah || 118||
    pritiman pitavasanah piyusham pivarangakah | priyamvadah piditaghah pulaki pushtivardhanah || 119||
    putravatpalyabhaktaughah punyakirtih puraskritah | pushtapriyah pundradhari purasthah punyavardhanah
    || 120|| purnakamah purvabhashi prithuh prithukavardhanah | prishtaprashnapariharta prithivikshemakarakah
    || 121|| peshalah pretabhitighnah peyapadodakaprabhuh | prenkhadvanivilasashca prerakah premavardhanah
    || 122|| paishunyarahitah protasukhadah poshakagranih | protadharma paurushadah purakah panktipavanah
    || 123|| panditah pankaha pampavasi pangutvavarakah | phalodayakarah bhaladuraksharamadapahrit ||
    124|| phullanetro'tha phalitatapasyah pharpharikavak | phutkaroccatitanekatapatrayapishacakah || 125||
    phantaneketarasadhyakaryo rakshatu mam sada | balavan bahudata ca badariphalalolupah || 126|| balapriyo
    brahmanagryo badhahanta ca bahudah | buddhidata budho buddhamataghati budhapriyah || 127|| vrindavanasthatoyona
    sarvatirthaphalapradah | vairagyollasakarta ca vrindavanasamashrayah || 128|| bilvapatrarcanaprito
    bandhuroktishca bandhaha | bandhurbadhirataharta bandhuvidveshavaranah || 129|| vandhyaputrapradatvadyaih
    yathayogena srishtikrit | bahuprajapalakashca vetaladilayapradah || 130|| bhaktanam jayasiddhyartham
    vadyajnanapradah svayam | bhagavadbhaktavidveshtuh sadyah pratyakshabandhakrit || 131|| bhaktido bhavyadata
    ca bhagandaranivaranah | bhavasaukhyapradah bharmapitho bhasmikritashubhah || 132|| bhavabhitiharo
    bhagnadaridryo bhajanapriyah | bhavajno bhaskaraprakhyo bhamatyagi ca bhagyadah || 133|| bhavyarthasucako
    bharyasaktanamapi saukhyadah | bhaktabharadharo bhaktadharo bhogapriyah sada || 134|| bhikshurbhimapadasakto
    bhuktimuktiphalapradah | bhutapretapishacadi bhayapidanivaranah || 135|| bhuma bhutiprado bhuridata
    bhupativanditah | bhrunakarta bhrityabharta bhaktavashyashca bheshajam || 136|| bhairavo bhavarogasya
    bhokta bhojanadayakah | bhauriko bhautikarishtaharta bhaumajadoshaha || 137|| bhangaprado'rimodasya
    bhrantihino'vatat sa mam | mallikakusumasakto mathitanyamato mahan || 138|| masrinatvan marutprakhyo
    mahandhanayanapradah | mahodayo manyuhino mahavirapadarcakah || 139|| malimasamaladhvamsi mukurah
    shastrasamvidam | mahishikshetrago madhvamatadugdhabdhicandrama || 140||
  devanagari: निजप्रदक्षिणेनैव सर्वयात्राफलप्रदः ॥ १०८॥ नीतिमान् नुतपादाब्जो न्यूनपूर्णत्ववर्जितः । निद्रात्यागी
    निस्पृहश्च निद्रादोषनिवारणः ॥ १०९॥ नूतनांशुकधारी च नृपपूजितपादुकः । नृणां सुखप्रदो नेता नेत्रानन्दकराकृतिः
    ॥ ११०॥ नियमी नैगमाद्यैश्च भक्तिभावेन सेवितः । नेदिष्ठो भजतां भक्त्या नौका भक्तभवाम्बुधेः ॥ १११॥ नन्दात्मजप्रियो
    नाथो नन्दनो नन्दनद्रुमः । प्रसन्नः परितापघ्नः प्रसिद्धः परतापहृत् ॥ ११२॥ प्रथमः प्रतिपन्नार्थः प्रसाधितमहातपाः
    । पराक्रमजितारातिः प्रतिमानविवर्जितः ॥ ११३॥ प्रवरः प्रक्रमज्ञश्च परवादिजयप्रदः प्रमुखः प्रबलः प्रज्ञाशाली
    प्रत्यूहनाशकः ॥ ११४॥ प्रपञ्जसुखदाता च प्रकृतिस्थः प्रवृत्तिकृत् । प्रभूतसम्पत् पत्रोर्णधारी प्रणवतत्परः
    ॥ ११५॥ प्रचण्डः प्रदरध्वंसी प्रतिग्रहविवर्जितः । प्रत्यक्षफलदाता च प्रसादाभिमुखः परः ॥ ११६॥ पाठकः
    पावनः पाता प्राणदाता प्रसादकृत् । प्राप्तसिद्धिः पारिजातदर्पहा पाकसाधनः ॥ ११७॥ पाटीरपादुकः पार्श्ववर्ती
    परायणप्रियः । पिण्याकीकृतदुर्वादी पिता पीडाविनाशकः ॥ ११८॥ प्रीतिमान् पीतवसनः पीयूषं पीवराङ्गकः । प्रियंवदः
    पीडिताघः पुलकी पुष्टिवर्धनः ॥ ११९॥ पुत्रवत्पाल्यभक्तौघः पुण्यकीर्तिः पुरस्कृतः । पुष्टप्रियः पुण्ड्रधारी
    पुरस्थः पुण्यवर्धनः ॥ १२०॥ पूर्णकामः पूर्वभाषी पृथुः पृथुकवर्धनः । पृष्टप्रश्नपरीहर्ता पृथिवीक्षेमकारकः
    ॥ १२१॥ पेशलः प्रेतभीतिघ्नः पेयपादोदकप्रभुः । प्रेङ्खद्वाणीविलासश्च प्रेरकः प्रेमवर्धनः ॥ १२२॥ पैशुन्यरहितः
    प्रोतसुखदः पोषकाग्रणीः । प्रोतधर्मा पौरुषदः पूरकः पङ्क्तिपावनः ॥ १२३॥ पण्डितः पङ्कहा पम्पावासी पङ्गुत्ववारकः
    । फलोदयकरः भालदुरक्षरमदापहृत् ॥ १२४॥ फुल्लनेत्रोऽथ फलिततपस्यः फर्फरीकवाक् । फूत्कारोच्चाटितानेकतापत्रयपिशाचकः
    ॥ १२५॥ फाण्टानेकेतरासाध्यकार्यो रक्षतु मां सदा । बलवान् बहुदाता च बदरीफललोलुपः ॥ १२६॥ बालप्रियो ब्राह्मणाग्र्यो
    बाधाहन्ता च बाहुदः । बुद्धिदाता बुधो बुद्धमतघाती बुधप्रियः ॥ १२७॥ वृन्दावनस्थतोयोन सर्वतीर्थफलप्रदः
    । वैराग्योल्लासकर्ता च वृन्दावनसमाश्रयः ॥ १२८॥ बिल्वपत्रार्चनप्रीतो बन्धुरोक्तिश्च बन्धहा । बन्धुर्बधिरताहर्ता
    बन्धुविद्वेषवारणः ॥ १२९॥ वन्ध्यापुत्रप्रदत्वाद्यैः यथायोगेन सृष्टिकृत् । बहुप्रजापालकश्च वेतालादिलयप्रदः
    ॥ १३०॥ भक्तानां जयसिद्ध्यर्थं वाद्यज्ञानप्रदः स्वयम् । भगवद्भक्तविद्वेष्टुः सद्यः प्रत्यक्षबन्धकृत्
    ॥ १३१॥ भक्तिदो भव्यदाता च भगन्दरनिवारणः । भवसौख्यप्रदः भर्मपीठो भस्मीकृताशुभः ॥ १३२॥ भवभीतिहरो भग्नदारिद्र्यो
    भजनप्रियः । भावज्ञो भास्करप्रख्यो भामत्यागी च भाग्यदः ॥ १३३॥ भाव्यर्थसूचको भार्यासक्तानामपि सौख्यदः
    । भक्तभारधरो भक्ताधारो भोगप्रियः सदा ॥ १३४॥ भिक्षुर्भीमपदासक्तो भुक्तिमुक्तिफलप्रदः । भूतप्रेतपिशाचादि
    भयपीडानिवारणः ॥ १३५॥ भूमा भूतिप्रदो भूरिदाता भूपतिवन्दितः । भ्रूणकर्ता भृत्यभर्ता भक्तवश्यश्च भेषजम्
    ॥ १३६॥ भैरवो भवरोगस्य भोक्ता भोजनदायकः । भौरिको भौतिकारिष्टहर्ता भौमजदोषहा ॥ १३७॥ भङ्गप्रदोऽरिमोदस्य
    भ्रान्तिहीनोऽवतात् स माम् । मल्लिकाकुसुमासक्तो मथितान्यमतो महान् ॥ १३८॥ मसृणत्वङ् मरुत्प्रख्यो महान्धनयनप्रदः
    । महोदयो मन्युहीनो महावीरपदार्चकः ॥ १३९॥ मलीमसमलध्वंसी मुकुरः शास्त्रसंविदाम् । महिषीक्षेत्रगो मध्वमतदुग्धाब्धिचन्द्रमा
    ॥ १४०॥
