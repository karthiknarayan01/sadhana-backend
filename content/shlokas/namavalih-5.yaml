name:
  english: namavalih
  devanagari: नामावलिः
content:
  english: om batukaya namah | om varadaya namah | om shuraya namah | om bhairavaya namah | om kalabhairavaya
    namah | om bhairavivallabhaya namah | om bhavyaya namah | om dandapanaye namah | om dayanidhaye namah
    | 9|| om vetalavahanaya namah | om raudraya namah | om rudrabhrikutisambhavaya namah | om kapalalocanaya
    namah | om kantaya namah | om kaminivashakritaya namah | om vashine namah | 16|| om apaduddharanaya
    namah | om dhiraya namah | om harinankashiromanaye namah | om damshtrakaralaya namah | om drishtaushthaya
    namah | om dhrishtaya namah | om dushtanibarhanaya namah | 23|| om sarpaharaya namah | om sarpashiraya
    namah | om sarpakundalamanditaya namah | om kapaline namah | om karunapurnaya namah | om kapalikashiromanaye
    namah | 29|| om shmashanavasine namah | om mamsashine namah | om madhumattaya namah | om attahasavate
    namah | om vagmine namah | om vamavrataya namah | om vanmine namah | om vamadevapriyankaraya namah
    | 37|| om vanecaraya namah | om giricaraya namah | om vasudaya namah | om vayuvegavate namah | om
    yogine namah | om yogavratadharaya namah | om yoginivallabhaya namah | om yune namah | 45|| om virabhadraya
    namah | om vishvanathaya namah | om vijetaya namah | om viravanditaya namah | om bhutadhyakshaya namah
    | om bhutidharaya namah | om bhutabhitinivaranaya namah | 52|| om kalankahinaya namah | om kankaline
    namah | om kruraya namah | om kukkuravahanaya namah | om gadhaya namah | om gahanaya namah | om gambhiraya
    namah | om gananathe sahodaraya namah | 60|| om deviputraya namah | om divyamurtaye namah | om diptimate
    namah | om diptalocanaya namah | om mahasenapriyakaraya namah | om manyaya namah | om madhavamatulaya
    namah | 67|| om bhadrakalipataye namah | om bhadraya namah | om bhadradaya namah | om bhadravahanaya
    namah | om pashupahararasikaya namah | om pashine namah | om pashupataye namah | om pataye
