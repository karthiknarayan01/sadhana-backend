id: dakshakritamrudrastotram
category: stotram
name:
  english: dakshakritamrudrastotram
  devanagari: दक्षकृतंरुद्रस्तोत्रम्
content:
  english: dakshakritam rudrastotram daksha uvaca | namami devam varadam varenyam maheshvaram jnananidhim
    sanatanam | namami devadhipatishvaram haram sadasukhadhyam jagadekabandhavam || 32|| namami vishveshvaravishvarupam
    puratanam brahmanijatmarupam | namami sharvam bhavabhavabhavam paratparam shankaramanato'smi || 33||
    devadeva mahadeva kripam kuru namo'stu te | aparadham kshamasvadya mama shambho kripanidhe || 34||
    anugrahah kritaste hi dandavyajena shankara | khalo'ham mudhadhirdeva jnatam tattvam maya na te ||
    35|| adya jnatam maya tattvam sarvopari bhavanmatah | vishnubrahmadibhissevyo vedavedyo maheshvarah
    || 36|| sadhunam kalpavrikshastvam dushtanam dandadhriksada | svatantrah paramatma hi bhaktabhishtavarapradah
    || 37|| vidyatapovratadharanasrijah prathamam dvijan | atmatattvam samavettum mukhatah parameshvarah
    || 38|| sarvapadbhyah palayita gopatistu pashuniva | grihitadando dushtamstan maryadaparipalakah ||
    39|| maya duruktavishikhaih praviddhah parameshvarah | amaranatidinashan madanugrahakarakah || 2
  devanagari: दक्षकृतं रुद्रस्तोत्रम् दक्ष उवाच । नमामि देवं वरदं वरेण्यं महेश्वरं ज्ञाननिधिं सनातनम्
    । नमामि देवाधिपतीश्वरं हरं सदासुखाढ्यं जगदेकबान्धवम् ॥ ३२॥ नमामि विश्वेश्वरविश्वरूपं पुरातनं ब्रह्मनिजात्मरूपम्
    । नमामि शर्वं भवभावभावं परात्परं शङ्करमानतोऽस्मि ॥ ३३॥ देवदेव महादेव कृपां कुरु नमोऽस्तु ते । अपराधं
    क्षमस्वाद्य मम शम्भो कृपानिधे ॥ ३४॥ अनुग्रहः कृतस्ते हि दण्डव्याजेन शङ्कर । खलोऽहं मूढधीर्देव ज्ञातं
    तत्त्वं मया न ते ॥ ३५॥ अद्य ज्ञातं मया तत्त्वं सर्वोपरि भवान्मतः । विष्णुब्रह्मादिभिस्सेव्यो वेदवेद्यो
    महेश्वरः ॥ ३६॥ साधूनां कल्पवृक्षस्त्वं दुष्टानां दण्डधृक्सदा । स्वतन्त्रः परमात्मा हि भक्ताभीष्टवरप्रदः
    ॥ ३७॥ विद्यातपोव्रतधरानसृजः प्रथमं द्विजान् । आत्मतत्त्वं समावेत्तुं मुखतः परमेश्वरः ॥ ३८॥ सर्वापद्भ्यः
    पालयिता गोपतिस्तु पशूनिव । गृहीतदण्डो दुष्टांस्तान् मर्यादापरिपालकः ॥ ३९॥ मया दुरुक्तविशिखैः प्रविद्धः
    परमेश्वरः । अमरानतिदीनाशान् मदनुग्रहकारकः ॥ २
