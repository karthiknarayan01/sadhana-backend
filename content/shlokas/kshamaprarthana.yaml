id: kshamaprarthana
category: stotram
name:
  english: kshamaprarthana
  devanagari: क्षमाप्रार्थना
content:
  english: kshamaprarthana aparadhasahastrani kriyante'harnisham maya | daso'yamati mam matva kshamasva
    parameshvari ||1|| avahanam na janami na janami visarjanam | pujam caiva na janami kshamyatam parameshvari
    ||2|| mantrahinam kriyahinam bhaktihinam sureshvari | yatpujitam maya devi paripurnam tadastu me ||3||
    aparadhashatam kritva jagadambeti coccaret | yam gatim samavapnoti na tam brahmadayah surah ||4||
    saparadho'smi sharanam praptastvam jagadambike | idanimanukamapyo'ham yathecchasi tatha kuru ||5||
    ajnanadvismritebhrantya yannyunamadhikam kritam | tatsarvam kshamyatam devi prasida parameshvari ||6||
    kameshvari jaganmatah saccidanandavigrahe | grihanarcamimam pritya prasida parameshvari ||7|| grihyatiguhyagoptri
    tvam grihanasmatkritam japam | siddhirbhavatu me devi tvatprasadatsureshvari ||8|| || shridurgarpanamastu
    ||
  devanagari: क्षमाप्रार्थना अपराधसहस्त्राणि क्रियन्तेऽहर्निशं मया । दासोऽयमति मां मत्वा क्षमस्व परमेश्वरी
    ॥१॥ आवाहनं न जानामि न जानामि विसर्जनम् । पूजां चैव न जानामि क्षम्यतां परमेश्वरि ॥२॥ मन्त्रहीनं क्रियाहीनं
    भक्तिहीनं सुरेश्वरी । यत्पूजितं मया देवि परिपूर्णं तदस्तु मे ॥३॥ अपराधशतं कृत्वा जगदम्बेति चोच्चरेत्
    । यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ॥४॥ सापराधोऽस्मि शरणं प्राप्तस्त्वां जगदम्बिके । इदानीमनुकमप्योऽहं
    यथेच्छसि तथा कुरु ॥५॥ अज्ञानाद्विस्मृतेभ्रान्त्या यन्न्यूनमधिकं कृतम् । तत्सर्वं क्षम्यतां देवि प्रसीद
    परमेश्वरि ॥६॥ कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे । गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरि ॥७॥
    गृह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादात्सुरेश्वरि ॥८॥
    ॥ श्रीदुर्गार्पणमस्तु ॥
