id: shiva-shadakshari-stotram
category: stotram
name:
  english: Shiva Shadakshari Stotram
content:
  english: '||om om|| onkarabindu samyuktam nityam dhyayanti yoginah | kamadam mokshadam tasmadonkaraya
    namonamah || || ||om nam|| namanti munayah sarve namantyapsarasam ganah | naranamadidevaya nakaraya
    namonamah || || ||om mam|| mahatatvam mahadeva priyam jnanapradam param | mahapapaharam tasmanmakaraya
    namonamah || || ||om shim|| shivam shantam shivakaram shivanugrahakaranam | mahapapaharam tasmacchikaraya
    namonamah || || ||om vam|| vahanam vrishabhoyasya vasukih kanthabhushanam | vame shaktidharam devam
    vakaraya namonamah || || ||om yam|| yakare samsthito devo yakaram paramam shubham | yam nityam paramanandam
    yakaraya namonamah || || shadaksharamidam stotram yah pathecchiva sannidhau | tasya mrityubhayam nasti
    hyapamrityubhayam kutah || shivashiveti shiveti shiveti va bhavabhaveti bhaveti bhaveti va | harahareti
    hareti hareti va bhajamanashshivameva nirantaram || iti shrimatparamahamsa parivrajakacarya shrimacchankarabhagavatpadapujyakrita
    shivashadaksharistotram sampurnam |'
  devanagari: ॥ॐ ॐ॥ ओङ्कारबिन्दु संयुक्तं नित्यं ध्यायन्ति योगिनः । कामदं मोक्षदं तस्मादोङ्काराय नमोनमः
    ॥ ॥ ॥ॐ नं॥ नमन्ति मुनयः सर्वे नमन्त्यप्सरसां गणाः । नराणामादिदेवाय नकाराय नमोनमः ॥ ॥ ॥ॐ मं॥ महातत्वं
    महादेव प्रियं ज्ञानप्रदं परम् । महापापहरं तस्मान्मकाराय नमोनमः ॥ ॥ ॥ॐ शिं॥ शिवं शान्तं शिवाकारं शिवानुग्रहकारणम्
    । महापापहरं तस्माच्छिकाराय नमोनमः ॥ ॥ ॥ॐ वां॥ वाहनं वृषभोयस्य वासुकिः कण्ठभूषणम् । वामे शक्तिधरं देवं
    वकाराय नमोनमः ॥ ॥ ॥ॐ यं॥ यकारे संस्थितो देवो यकारं परमं शुभम् । यं नित्यं परमानन्दं यकाराय नमोनमः
    ॥ ॥ षडक्षरमिदं स्तोत्रं यः पठेच्छिव सन्निधौ । तस्य मृत्युभयं नास्ति ह्यपमृत्युभयं कुतः ॥ शिवशिवेति
    शिवेति शिवेति वा भवभवेति भवेति भवेति वा । हरहरेति हरेति हरेति वा भजमनश्शिवमेव निरन्तरम् ॥ इति श्रीमत्परमहंस
    परिव्राजकाचार्य श्रीमच्छङ्करभगवत्पादपूज्यकृत शिवषडक्षरीस्तोत्रं सम्पूर्णम् ।
