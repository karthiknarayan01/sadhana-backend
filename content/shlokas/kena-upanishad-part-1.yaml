id: kena-upanishad-part-1
category: stotram
name:
  english: Kena Upanishad - Part 1
content:
  english: '|| atha kenopanishat || om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu
    ma vidvishavahai shshantih || om apyayantu mamangani vakpranashcakshu shshrotramatho balamindriyani
    ca sarvani | sarva mma ma brahma nirakarodanirakaranamastvanirakarana ''stu | tadatmani nirate ya
    upanishatsu dharmaste mayi santu te mayi santu | om shanti shshantih || keneshita mmanah kena pranah
    prathamah praiti yuktah | keneshitam nka u devo yunakti || || shrotrasya shrotra mmanaso mano yad
    vaco ha vacam sa u pranasya pranah | cakshushashcakshuratimucya dhirah pretyasmallokadamrita bhavanti
    || || na tatra cakshurgacchati na vagacchati no manah | na vidmo na vijanimo yathaitadanushishyat
    || || anyadeva tadviditadatho aviditadadhi | iti shushruma purvesham ye~ nastadvyacacakshire || ye~na
    vagabhyudyate | tadeva brahma tvam || yanmanasa na manute yenahurmano matam | tadeva brahma tvam ||
    yaccakshusha na pashyati yena cakshumshi pashyati | tadeva brahma tvam || yacchrotrena na shrinoti
    yena shrotramidam shrutam | tadeva brahma tvam || yatpranena na praniti yena pranah praniyate | tadeva
    brahma tvam || || iti kenopanishadi prathamah khandah ||'
  devanagari: ॥ अथ केनोपनिषत् ॥ ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒
    मा वि॑द्विषा॒वहै श्शान्तिः॑ ॥ ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षु श्श्रोत्रमथो बलमिन्द्रियाणि
    च सर्वाणि । सर्व म्मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरण ऽस्तु । तदात्मनि निरते य उपनिषत्सु धर्मास्ते
    मयि सन्तु ते मयि सन्तु । ॐ शान्ति॒ श्शान्तिः॑ ॥ केनेषित म्मनः केन प्राणः प्रथमः प्रैति युक्तः । केनेषितां
    ङ्क उ देवो युनक्ति ॥ ॥ श्रोत्रस्य श्रोत्र म्मनसो मनो यद् वाचो ह वाचं स उ प्राणस्य प्राणः । चक्षुषश्चक्षुरतिमुच्य
    धीराः प्रेत्यास्माल्लोकादमृता भवन्ति ॥ ॥ न तत्र चक्षुर्गच्छति न वागच्छति नो मनः । न विद्मो न विजानीमो
    यथैतदनुशिष्यात् ॥ ॥ अन्यदेव तद्विदितादथो अविदितादधि । इति शुश्रुम पूर्वेषां येँ नस्तद्व्याचचक्षिरे
    ॥ येँन वागभ्युद्यते । तदेव ब्रह्म त्वं ॥ यन्मनसा न मनुते येनाहुर्मनो मतम् । तदेव ब्रह्म त्वं ॥ यच्चक्षुषा
    न पश्यति येन चक्षूंषि पश्यति । तदेव ब्रह्म त्वं ॥ यच्छ्रोत्रेण न शृणोति येन श्रोत्रमिदं श्रुतम् ।
    तदेव ब्रह्म त्वं ॥ यत्प्राणेन न प्राणिति येन प्राणः प्रणीयते । तदेव ब्रह्म त्वं ॥ ॥ इति केनोपनिषदि
    प्रथमः खण्डः ॥
