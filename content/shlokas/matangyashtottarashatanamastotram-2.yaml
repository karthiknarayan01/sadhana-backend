id: matangyashtottarashatanamastotram-2
category: stotram
name:
  english: matangyashtottarashatanamastotram 2
  devanagari: मातन्ग्यष्टोत्तरशतनामस्तोत्रम् २
content:
  english: rinu | yasya prasada dishoham parvati pranavallabhe || 1|| asya shrimatangi shatanamastotrasya
    shrikrishna rishirgayatricchandah shrimatangi devata caturvarga siddhaye viniyogah || om madhavi mathura
    matta mananiya madoddhata | manya ca manadatri ca manisha manamohini || 2|| mathura madhavi madhya
    manasi manamohini | madhura manayogya ca mattamatangagamini || 3|| menaka manavi medha madana madanottara
    | matta pramatta madana modana madanoddhata || 4|| manani manayogya ca mekhala maramohini | manorupa
    unmani ca mashamedhamadoddhata || 5|| nimesha nirnimesha ca managi mathura tatha | madamatta mahamatta
    manada madhusudani || 6|| matirmata mahalakshmirnitya madanapidita | meghavidyutprabhakasha meghanandapravarddhini
    || 7|| madana madarupa ca muniguhya munistuta | artharupa mahamedha maya matta svarupini || 8|| mukundapujita
    mauni maunavrataparayana | medha medhavati madhya madana madanatura || 9|| manushi ca manorupa mahamohasvarupini
    | tarani taruni tara tarini taralekshana || 10|| turoya ca tatha tuthya tulya ca tamasi tithih | tirthatirtha
    mayi tirtharupini tamasantara || 11|| tapasya tapasi tapa tapana tulana iti | golokavasini gamya gunajna
    gunarupini || 12|| gauri ca gopini gaura ganaganasvarupini | girisha girisha gandha gagana gaganeshvari
    || 13|| ikararupini nitya ishvari ishvarapriya | sangrihya iti te devi shatanama itiritam || 14 trisandhya
    yah pathennityam tasya siddhirna samshayah || 15|| iti shrikalivilasatantre shrimatangishatanamastotram
    samaptam | om tatsadityadi | iti shrikalivilasatantre saptadashapatalah samaptah |
  devanagari: ृणु । यस्य प्रसादा दीशोहं पार्वति प्राणवल्लभे ॥ १॥ अस्य श्रीमातङ्गी शतनामस्तोत्रस्य श्रीकृष्ण
    ऋषिर्गायत्रीच्छन्दः श्रीमातङ्गी देवता चतुर्वर्ग सिद्धये विनियोगः ॥ ॐ माधवी मथुरा मत्ता माननीया मदोद्धता
    । मान्या च मानदात्री च मनीषा मानमोहिनी ॥ २॥ मथुरा माधवी मध्या मानसी मनमोहिनी । माधुरा मानयोग्या च
    मत्तमातङ्गगामिनी ॥ ३॥ मेनका मानवी मेधा मदना मदनोत्तरा । मत्ता प्रमत्ता मदना मोदना मदनोद्धता ॥ ४॥ माननी
    मानयोग्या च मेखला मरमोहिनी । मनोरूपा उन्मनी च माषामेधामदोद्धता ॥ ५॥ निमेषा निर्निमेषा च मानगी मथुरा
    तथा । मदमत्ता महामत्ता मानदा मधुसूदनी ॥ ६॥ मतिर्माता महालक्ष्मीर्नित्या मदनपीडिता । मेघविद्युत्प्रभाकाशा
    मेघानन्दप्रवर्द्धिनी ॥ ७॥ मदना मदरूपा च मुनिगुह्या मुनिस्तुता । अर्थरूपा महामेधा माया मत्ता स्वरूपिणी
    ॥ ८॥ मुकुन्दपूजिता मौनी मौनव्रतपरायणा । मेधा मेधावती मध्या मदना मदनातुरा ॥ ९॥ मानुषी च मनोरूपा महामोहस्वरूपिणी
    । तरणी तरुणी तारा तारिणी तरलेक्षणा ॥ १०॥ तुरोया च तथा तुथ्या तुल्या च तामसी तिथिः । तीर्थातीर्थ मयी
    तीर्थरूपिणी तामसान्तरा ॥ ११॥ तपस्या तापसी तापा तपना तुलना इति । गोलोकवासिनी गम्या गुणज्ञा गुणरूपिणी
    ॥ १२॥ गौरी च गोपिनी गौरा गानागानस्वरूपिणी । गिरीशा गिरिशा गन्धा गगणा गगणेश्वरी ॥ १३॥ ईकाररूपिणी नित्या
    ईश्वरी ईश्वरप्रिया । सङ्गृह्य इति ते देवि शतनाम इतीरितम् ॥ १४ त्रिसन्ध्य यः पठेन्नित्यं तस्य सिद्धिर्न
    संशयः ॥ १५॥ इति श्रीकालीविलासतन्त्रे श्रीमातङ्गीशतनामस्तोत्रं समाप्तम् । ॐ तत्सदित्यादि । इति श्रीकालीविलासतन्त्रे
    सप्तदशपटलः समाप्तः ।
