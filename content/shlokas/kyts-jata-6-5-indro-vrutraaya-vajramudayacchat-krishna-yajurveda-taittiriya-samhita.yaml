id: kyts-jata-6-5-indro-vrutraaya-vajramudayacchat-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.5 Indro Vrutraaya Vajramudayacchat - Krishna Yajurveda Taittiriya Samhita
content:
  english: indro vritraya vritrayendra indro vritraya | vri~traya vritraya vajra udayaccha dayaccha dudu
    dayacchat | thsa so 'yaccha dayaccha dvritro vritro vajra vajra dudyata dudyata dvajra dudyatat |
    udyata dabibhe dabibhe dudyata dudyata dabibhet | thsa so 'bibhe dabibhe nma ma 'bravi dabravi me
    pra pra me me pra | ha rastyasti har asti vai va astyasti vai | te pra pra te te pra | syami dasyami
    pra pra da dasya mititi dasyami dasya miti | iti tasmai tasma ititi tasmai tasma ukthya mukthya ntasmai
    tasma ukthya mpra prokthya mukthya ttasmai tasma ayaccha dayaccha udayaccha dayaccha dudu dayacchat
    | thsa so 'yaccha dayaccha nma ma 'bravi dabravi me pra pra me me pra | ha rastyasti har asti vai
    va astyasti vai | te pra pra te te pra | syami dasyami pra pra da dasya mititi dasyami dasya miti
    | iti tasmai tasma ititi tasmai tasma ukthya mukthya ntasmai tasma ukthya ukthya mevai vokthya mukthya
    meva | eva pra praivaiva pra | ttasmai tasma ayaccha dayaccha ntasmai tasmai tritiya udayaccha dayaccha
    dudu dayacchat | vishnu ranvanu vishnu anvatishthata tishthata nvan vatishthata | atishthata jahi
    jahya tishthata tishthata jahi | jahi titi jahi jahiti | iti sa sa ititi sah | nma ma 'bravi dabravi
    me pra pra me me pra | ha rastyasti har asti vai va astyasti vai | te pra pra te te pra | syami dasyami
    pra pra da dasya mititi dasyami dasya miti | iti tasmai tasma ititi tasmai tasma ukthya mukthya ntasmai
    tasma ukthya ukthya mevai vokthya mukthya meva | eva pra praivaiva pra | yajno hi hi yajno yajno hi
    | hi tasya tasya hi hi tasya | tasya maya maya tasya tasya maya | yadukthya ukthyo ya ukthyo grihyate
    grihyata ukthya ukthyo grihyate grihyata indriya mindriya ngrihyate grihyata indriyam | indriya mevai
    vendriya mindriya meva | ya~jamano yajamano viryam yajamano bhratrivyasya bhratrivyasya yajamano yajamano
    bhratrivyasya | bhratrivyasya vrinkte vrinkte bhratrivyasya bhratrivyasya vrinkte | vrinkta indra
    yendraya vrinkte vrinkta indraya | indraya tva tvendra yendraya tva | tva brihadvate brihadvate tva
    tva brihadvate | brihadvate vayasvate vayasvate brihadvate brihadvate vayasvate | brihadvata iti brihat
    vayasvata ititi vayasvate vayasvata iti | ityahahe tityaha | ahendra yendraya hahendraya | indraya
    hi hindra yendraya hi | ttasmai tasma ayaccha dayaccha tva tva tasmai tasmai tva vishnave vishnave
    tva tva vishnave | vishnave tva tva vishnave vishnave tva | tvetiti tva tveti | ityahahe tityaha |
    rvishnu revaiva vishnuh | vishnu ranvatishthata nvatishthata vishnu rvishnu ranvatishthata | anvatishthata
    jahi jahya nvatishthata nvatishthata jahi | anvatishthatetyanu jahi titi jahi jahiti | ttasma dititi
    tasma vishnu manvabhaja tyanvabhajati vishnum vi~shnu manvabhajati | anvabhajati tri stri ranvabhaja
    tyanvabhajati trih | rgrihnati grihnati ni grihnati tri stri rgrihnati grihnati trih | tasmai pra
    pra tasmai tasmai pra | ayaccha desha esho 'yaccha dayaccha deshah | esha te ta esha esha te ryoni
    ste te yonih | asiti tyasya siti | ityahahe tityaha | aha punahpunah punahpuna rahaha punahpunah |
    punahpunar hi hi punahpunah punahpunar hi | punahpunariti punah hyasma dasma ddhi hyasmat | nnirgrihnati
    nirgrihna tyasma dasma nirgrihnati cakshu shcakshu rnirgrihnati nirgrihnati cakshuh | nirgrihnatiti
    nih rvai vai cakshu shcakshu dyajnasya yajna syaita deta dyajnasya yajnasya yat | yadukthya ukthyo
    ya ttasma dukthya ukthya stasma tasma dukthya mukthya ukthyagm hutagm huta mukthya mukthyagm hutam
    | ssoma hutagm hutagm somah soma anvaya ntyanvayanti soma ssoma anvayanti | anvayanti tasma ttasma
    danvaya ntyanvayanti tasma tasma datma ''tma tasma atma cakshu shcakshu ratma ''tma cakshuh | cakshu
    ranvanu cakshu shcakshu ranu | tye tyan van veti | ttasma detyeti tasma mbahavo bahavo yantam bahavo
    'nvanu bahavo bahavo 'nu | anu yanti yantya nvanu yanti | dyanti yanti tasma tasma deka eka stasma
    mbahuna meka eko bahunam | mbhadro bhadro bahuna bhadro bhavati bhavati bhadro bhadro bhavati | tasma
    deka eka stasma rbahvi reka eko bahvih | rjaya jaya bahvi jaya vindate vindate jaya jaya vindate |
    vindate yadi yadi vindate vindate yadi | yadi kamayeta kamayeta yadi yadi kamayeta | kamayeta ddhvaryu
    raddhvaryuh kamayeta kamayeta ddhvaryuh | addhvaryu ratmana matmana maddhvaryu raddhvaryu ratmana
    ya~jnayashasena yajnayashase natmana matmanam ya~jnayashasena yajnayashasena yajnayashaseneti yajna
    arpayeya miti tyarpayeya marpayeya miti | ityantara 'nta reti tyantara | antara ''havaniya mahavaniya
    mantara 'ntara ''havaniya nca cahavaniya mahavaniya ca havirdhanagm havirdhana nca ca havirdhanagm
    havirdhana havirdhanamiti havih ca tishthagg stishthagg shca ca tishthann | tishtha nnavava tishthagg
    stishthannava | nnaye davava nayet | naye datmana matmana atmana mevai vatmana matmana meva | eva
    yajnayashasena yajnayashase naivaiva yajnayashasena | rpaya tyarpayati yajnayashasena yajnayashasena
    yajnayashaseneti yajna arpayati yadi yadyarpaya tyarpayati yadi | yadi kamayeta kamayeta yadi yadi
    kamayeta | nkamayeta kamayeta yajamanam | ya~jnayashasena yajnayashasena yajamanam ya~jnayashasena
    yajnayashasena yajnayashaseneti yajna arpayeya miti tyarpayeya marpayeya miti | ityantara 'nta retityantara
    | antara sadohavirdhane sadohavirdhane antara 'ntara sadohavirdhane | sadohavirdhane tishthagg stishthan
    thsadohavirdhane sadohavirdhane tishthann | sadohavirdhane iti sadah tishtha nnavava tishthagg stishthannava
    | nnaye davava nayet | yajamana mevaiva yajamanam eva yajnayashasena yajnayashase naivaiva yajnayashasena
    | rpaya tyarpayati yajnayashasena yajnayashasena yajnayashaseneti yajna arpayati yadi yadyarpaya tyarpayati
    yadi | yadi kamayeta kamayeta yadi yadi kamayeta | n kamayeta kamayeta sadasyan | yajnayashasena yajnayashasena
    sadasya ya~jnayashasena yajnayashasena yajnayashaseneti yajna arpayeya miti tyarpayeya marpayeya miti
    | sada alabhya labhya sada alabhya vava labhya labhyava | nnaye davava nayet | sadasya nevaiva sadasya
    eva yajnayashasena yajnayashase naivaiva yajnayashasena | rpaya tyarpayati yajnayashasena yajnayashasena
    yajnayashaseneti yajna arpayatityarpayati | || dyajnasya yajnasyaita deta dyajnasya yajnasya yat |
    dhruva uttama uttamo dhruvo dhruva uttamah | ngrahana muttama uttamo grahanam | ngrihyate grihyate
    grahana dgrihyate grihyate tasma tasma dayu rayush tasma mpranana mayu rayuh pranana pranana muttama
    muttama mpranana muttamam | mmurdhana muttama muttama ndivo divo murdhana ndivo divo aratim | mprithivyah
    prithivya arati marati prithivya ititi prithivyah prithivya iti | ityahahe tityaha | mmurdhana mahaha
    murdhana murdhana mevaiva murdhana evaina mena mevai vaina enagm samananagm samanana mena menagm samanana
    nkaroti karoti samananagm samanana karoti vaishvanaram nkaroti karoti vaishvanaram | vaishvanara mritaya
    r agni miti tyagni magni miti | ityahahe tityaha | shvanara mahaha vaishvanaram | vaishvanaragm hi
    hi vai hi devataya devataya hi hi devataya | devataya ''yu rayu rdevataya devataya ''yuh | ayu rubhayatovaishvanara
    ubhayatovaishvanara ayu rayu rubhayatovaishvanarah | ubhayatovaishvanaro grihyate grihyata ubhayatovaishvanara
    ubhayatovaishvanaro grihyate | ubhayatovaishvanara ityubhayatah dgrihyate grihyate tasma tasma dubhayata
    ubhayata stasma ubhayatah pranah prana ubhayata ubhayatah pranah | prana adhasta dadhasta tpranah
    prana adhasta c ca cadhasta dadhasta coparishta duparishtac ca coparishtat | uparishtac ca coparishta
    duparishtac ca | cardhino 'rdhinashca cardhinah | 'rdhino 'rdhino 'nye | anye graha graha anye graha
    grihyante grihyante graha graha grihyante grihyante 'rdhyardhi grihyante grihyante 'rdhi | ardhi dhruvo
    dhruvo 'rdhyardhi dhruvah | ddhruvo dhruva stasma tasma dardhyardhi tasma ardhyava mava mardhya rdhyavam
    | mpranah prano 'va mava mpranana manyesha manyesha anye graha graha anye ssadyante sadyante graha
    graha sadyante 'nupopte 'nupopte sadyante sadyante 'nupopte | anupopte dhruvo dhruvo 'nupopte 'nupopte
    dhruvah | ddhruvo dhruva stasma tasma dasthna 'sthna tasma asthna 'nya anya asthna 'sthna 'nyah |
    anyah prajah praja anya anyah prajah | prajah pratitishthanti pratitishthanti prajah prajah pratitishthanti
    | pratitishthanti magmsena magmsena pratitishthanti pratitishthanti magmsena | pratitishthantiti prati
    magmse nanya anya magmsena magmse nanyah | anya asura asura anya anya asurah | asura vai va asura
    asura vai | va uttarata uttarato vai va uttaratah | mprithivi muttarata uttaratah prithivim | deva
    dhruvena dhruvena deva deva dhruvena | ndhruvena dhruvena drihann | ddhruvasya dhruvasya ta dhruvasya
    dhruvatva ndhruvasya dhruvasya dhruvatvam | dhruvatvamiti dhruva dhruva uttarata uttarato dhruvo dhruva
    uttaratah | ssadyate sadyata uttarata uttarata sadyate dhrityai dhrityai sadyate sadyate dhrityai
    rdhrityai dhritya ayuh | dyajnasya yajna syaita deta dyajnasya yajnasya yat | dhruva atma ''tma dhruvo
    dhruva atma | atma hota hota ''tma ''tma hota dyaddhota hota yat | yaddhotricamase hotricamase ya
    ndhruvagm hotricamase hotricamase dhruvam | hotricamasa iti hotri dhruva mavanaya tyavanayati dhruva
    ndhruva mavanayati | nnavanaya tyavanaya tyatmann | eva yajnasya yajna syaivaiva yajnasya | ryajnasya
    yajna syayuh | || rdadhati dadha tyayu rayu ddadhati dadhati purasta purasta duktha syokthasya purasta
    tpurasta dukthasya | ukthasya vaniyo 'vaniya uktha syokthasya vaniyah | avaniya iti tyavaniyo 'vaniya
    iti | ityahu rahu riti tyahuh | tpurasta dahu rahuh purasta purasta ddhi hi purasta hyayusha ayusho
    hi hyayushah | ayusho bhunkte bhunkta ayusha ayusho bhunkte | bhunkte maddhyato maddhyato bhunkte
    bhunkte maddhyatah | maddhyato 'vaniyo 'vaniyo maddhyato maddhyato 'vaniyah | avaniya iti tyavaniyo
    'vaniya iti | ityahu rahu riti tyahuh | rmaddhyamena maddhyame nahu rahu maddhyamena hi hi maddhyamena
    maddhyamena hi | hyayusha ayusho hi hyayushah | ayusho bhunkte bhunkta ayusha ayusho bhunkte | bhunkta
    uttarardha uttarardhe bhunkte bhunkta uttarardhe | uttarardhe 'vaniyo 'vaniya uttarardha uttarardhe
    'vaniyah | uttarardha ityuttara avaniya iti tyavaniyo 'vaniya iti | ityahu rahu riti tyahuh | ttamenahu
    rahu ruttamena | uttamena hi hyuttame no hyayusha ayusho hi hyayushah | ayusho bhunkte bhunkta ayusha
    ayusho bhunkte | mbhunkte bhunkte vai vaishvadevya mricyrici vai vaishvadevyamiti vaishva rici shasyamanayagm
    shasyamanaya mricyrici shasyamanayam | shasyamanaya mavava shasyamanayagm shasyamanaya mava | ava
    nayati naya tyavava nayati | nayati vaishvadevyo vaishvadevyo nayati nayati vaishvadevyah | vaishvadevyo
    vai vai vai shvadevyo vaishvadevyo vai | vaishvadevya iti vaishva vai prajah praja vai vai prajah
    | prajah prajasu prajasu prajah prajah prajasu | praja svevaiva prajasu praja sveva | evayu rayu revai
    vayuh | rdadhati dadha tyayu rayu dadhatiti dadhati | || yajnena vai vai yajnena yajnena vai | vai
    deva deva vai vai devah | ssuvargagm suvarga suvargam ~lokam ~lokagm suvargagm suvargam ~lokam | nnayan
    ~lokam ~loka mayann | te 'manyanta manyanta te te 'manyanta | amanyanta manushya manushya amanyanta
    manyanta manushyah manushya no no manushya manushya nah | no 'nvabhavishya ntyanvabhavishyanti no
    no 'nvabhavishyanti | anvabhavishya ntiti tyanvabhavishya ntyanvabhavishya ntiti | anvabhavishyantityanu
    iti te ta ititi te | va~thsarena te te sam va~thsarena yopayitva yopayitva sam va~thsarena yopayitva
    | yopayitva suvargagm suvargam yo~payitva yopayitva suvargam | suvargam ~lokam ~lokagm suvargagm suvargam
    ~lokam | nnayan ~lokam ~loka mayann | rishaya rishaya ritugrahaih | ritugrahai revaiva rtugrahair
    ritugrahairityritu evan van vevaivanu | anu pra pranvanu pra | npra prajanann | yadritugraha ritugraha
    ya ritugraha grihyante grihyanta ritugraha ritugraha grihyante ritugraha ityritu grihyante suvargasya
    suvargasya grihyante grihyante suvargasya | suvargasya lokasya lokasya suvargasya suvargasya lokasya
    | suvargasyeti suvah tyai lokasya lokasya prajna tyai dvadasha dvadasha prajna dvadasha grihyante
    grihyante dvadasha dvadasha grihyante | grihyante dvadasha dvadasha grihyante grihyante dvadasha |
    dvadasha masa masa dvadasha dvadasha masah va~thsarasya prajna tyai saha saha prajna saha prathamau
    prathamau saha saha prathamau | prathamau grihyete grihyete prathamau prathamau grihyete | grihyete
    saha saha grihyete grihyete saha | grihyete iti grihyete | sahottama vuttamau saha sahottamau | ttasma
    duttama vuttamau tasma ddvaudvau dvaudvau tasma dvaudva vritu ritu dvaudvau dvaudva vritu | ritu ubhayatomukha
    mubhayatomukha mritu ritu ubhayatomukham | ubhayatomukha mritupatra mritupatra mubhayatomukha mubhayatomukha
    mritupatram | ubhayatomukhamityubhayatah mbhavati bhava tyritupatra mritupatra ritupatramityritu bhavati
    kah ko bhavati bhavati kah | ko hi hi kah ko hi | || veda yato yato veda veda yatah | yata rituna
    mritunam ya~to yata ritunam | mmukha mrituna mrituna tkritvah kritva shsha kritva ahaha kritvah kritva
    aha | va ritava ritavo vai va ritavah | ritava ritu nritu nritava ritava ritun | eva prinati prina
    tyevaiva prinati | prina tyritubhir ritubhih prinati prina tyritubhih | ritubhi riti tyritubhir iti
    catu shcatu rititi catuh | catu shcatushpada shcatushpada shcatu shcatu shcatushpadah | catushpada
    evaiva catushpada shcatushpada eva | catushpada iti catuh npashu nevaiva pashun | nprinati prinati
    pashu rdvih prinati prinati dvih | dvipada ahaha dvipadah | dvipada evaiva dvipado eva prinati prina
    tyevaiva prinati | prina tyrituna r prinati prina tyrituna tkritvah kritva shsha kritva ahaha kritvah
    kritva aha | ritubhi rahaha rtubhih | ritubhi riti tyritubhir iti catu shcatu rititi catuh | c catu
    shcatu stasma tasmac catushpada shcatushpada stasma ttasmac catushpadah | catushpadah pashavah pashava
    shcatushpada shcatushpadah pashavah | catushpada iti catuh npashavah pashava ritun | upa jivanti jiva
    ntyupopa jivanti | rjivanti jivanti dvih | ttasma dahaha tasma dvipada shcatushpada shcatushpado dvipado
    dvipada shcatushpadah | shcatushpada shcatushpadah pashun | catushpada iti catuh upa jivanti jiva
    ntyupopa jivanti | jiva ntyrituna r tuna jivanti jiva ntyrituna tkritvah kritva shsha kritva ahaha
    kritvah kritva aha | ritubhi riti tyritubhir iti catu shcatu rititi catuh | rdvi shcatu shcatu aha
    kramana makramana maha hakramanam | akramana mevaiva kramana makramana meva | yajamanah kurute kurute
    yajamano yajamanah kurute | kurute suvargasya suvargasya kurute kurute suvargasya | suvargasya lokasya
    lokasya suvargasya suvargasya lokasya | suvargasyeti suvah lokasya samashtyai samashtyai lokasya lokasya
    samashtyai | samashtyai na na samashtyai samashtyai na | anya manvan vanya manya manu | anu pra pranvanu
    pra | pra padyeta padyeta pra pra padyeta | tpadyeta padyeta yat | anya manuprapadyeta nuprapadyeta
    nya manya manuprapadyeta | anuprapadyeta r ritu ranuprapadyeta nuprapadyeta r anuprapadyetetyanu ritu
    manvan vritu mritu manu | anu pra pranvanu pra | pra padyeta padyeta pra pra padyeta | tava ritavah
    padyeta padyeta r ritavo mohuka mohuka ritava ritavo mohukah | ssyuh prasiddham | || prasiddha mevaiva
    prasiddha evaddhvaryu raddhvaryu revai vaddhvaryuh | rdakshinena dakshine naddhvaryu raddhvaryu dakshinena
    pra pra dakshinena dakshinena pra | pra padyate padyate pra pra padyate | padyate prasiddha mpadyate
    padyate prasiddham | mpratiprasthata pratiprasthata prasiddha pratiprastha tottare nottarena pratiprasthata
    pratiprastha tottarena | pratiprasthateti prati ttasma duttare nottarena tasma tasma daditya aditya
    stasma ttasma dadityah | tthshadaditya aditya shshat | maso dakshinena dakshinena maso maso dakshinena
    | dakshine naityeti dakshinena dakshinenaiti | shaduttare nottarena sha uttare nopayamagrihita upayamagrihita
    uttare nottare nopayamagrihitah | upayamagrihito 'sya syupayamagrihita upayamagrihito 'si | upayamagrihita
    ityupayama asi sagmsarpah sagmsarpo 'syasi sagmsarpah | 'syasi sagmsarpah sagmsarpo 'si | asyagmhaspatya
    yagmhaspatyaya sya syagmhaspatyaya | agmhaspatyaya tva tva 'gmhaspatya yagmhaspatyaya tva | agmhaspatyayetyagmhah
    tvetiti tva tveti | ityahahe tityaha | aha styastya hahasti | asti trayodasha strayodasho 'styasti
    trayodashah | trayodasho maso masa strayodasha strayodasho masah | trayodasha iti trayah masa ititi
    maso masa iti | ityahu rahu riti tyahuh | ntamahu rahu stam | tprinati prinati ta prinatiti prinati
    | || suvargaya vai vai suvargaya suvargaya vai | va eta ete vai va ete | ete lokaya lokayaita ete
    lokaya | lokaya grihyante grihyante lokaya lokaya grihyante | dgrihyante grihyante yat | yadritugraha
    ritugraha ya ritugraha ritugraha jyotih | ritugraha ityritu jyoti rindragni indragni jyoti rjyoti
    rindragni | dyadindragni indragni yat | aindragna mritupatrena r ndragna mritupatrena | ritupatrena
    grihnati grihna tyritupatrena r tupatrena grihnati | ritupatrenetyritu rgrihnati grihnati jyotih |
    jyoti revaiva jyoti evasma asma evai vasmai asma uparishta duparishta dasma asma uparishtat | ddadhati
    dadha tyuparishta duparishta dadhati suvargasya suvargasya dadhati dadhati suvargasya | suvargasya
    lokasya lokasya suvargasya suvargasya lokasya | lokasya nukhyatya anukhyatyai lokasya lokasya nukhyatyai
    | anukhyatya ojobhrita vojobhrita vanukhyatya anukhyatya ojobhritau anukhyatya ityanu ojobhritau vai
    va ojobhrita vojobhritau vai | va eta vetau vai va etau | ndevana meta vetau devana yadindragni indragni
    ya dyadindragni indragni yat | aindragno grihyate grihyata aindragna ai ndragno grihyate grihyata
    oja ojo grihyate grihyata ojah | oja evai vauja oja eva | ava rundhe rundhe 'vava rundhe | rundhe
    vaishvadevam shvadevagm rundhe rundhe vaishvadevam | vaishvadevagm shukrapatrena shukrapatrena vaishvadevam
    shvadevagm shukrapatrena | vaishvadevamiti vaishva shukrapatrena grihnati grihnati shukrapatrena shukrapatrena
    grihnati | shukrapatreneti shukra grihnati vaishvadevyo vaishvadevyo grihnati grihnati vaishvadevyah
    | vaishvadevyo vai vai vai shvadevyo vaishvadevyo vai | vaishvadevya iti vaishva vai prajah praja
    vai vai prajah | praja asa vasau prajah praja asau | asa vaditya adityo 'sa vasa vadityah | shshukra
    aditya aditya vaishvadevagm shukrapatrena shukrapatrena vaishvadevam shvadevagm shukrapatrena | vaishvadevamiti
    vaishva shukrapatrena grihnati grihnati shukrapatrena shukrapatrena grihnati | shukrapatreneti shukra
    dgrihnati grihnati tasma tasma dasa vasau tasma asa vaditya adityo 'sa vasa vadityah | ssarva aditya
    aditya mprajah prajah pratyam | tye tyudu deti | ttasma detyeti tasma eva manyate manyata evaiva manyate
    | mmanyate manyate mam | tprati pratyut | udaga daga dudu dagat | aga diti tyaga daga diti | shvadeva
    mititi vaishvadevam | vaishvadevagm shukrapatrena shukrapatrena vaishvadevam shvadevagm shukrapatrena
    | vaishvadevamiti vaishva shukrapatrena grihnati grihnati shukrapatrena shukrapatrena grihnati | shukrapatreneti
