id: brahmadibhihkritamnarasimhastotram
category: stotram
name:
  english: brahmadibhihkritamnarasimhastotram
  devanagari: ब्रह्मादिभिःकृतंनरसिंहस्तोत्रम्
content:
  english: brahmadibhih kritam narasimhastotram namo'ksharapararupaksharantaryamine ca te | namo muktabhivandyaya
    namo vyuhatmane ca te || 52|| namah prakritirupaya pradhanapurushaya te | mahakalasvarupaya bhumarupaya
    ca te namah || 53|| apratarkyasvarupaya'nantarupaya te namah | abhaktanashakartre te bhaktarakshanakarine
    || 54|| varadananurupaya tathaiva daityaghatine | sarvatmane karalaya vikaralaya te namah || 55||
    yajnabhagapradatre te rakshakaya namo namah | hridi bodhaya devanam tratre tasmai namo namah || 56||
    tapomargapravrittaya rishigamyaya te namah | shraddhatriptipradaya'tra paratradayine namah || 57||
    yogagatiprasaraya siddhismriddhigrihaya ca | tapobalaprakrishtaya dharmatma~ste namo namah || 58||
    stutistutyaya vidyayah shubhadhipataye namah | ratnapradatre nyayaya nitidhatre namo namah || 59||
    manutvasamrakshakaya prajapatitvadayine | natanatyagayakanam kridagityatmane namah || 60|| vahakatvapradatre
    te saparyadipradayine | vishtikaryaniyoktre te jagadishaya te namah || 61|| vaishnavanam rakshakaya
    bahurupadharaya te | narayanaya krishnaya shriharaye namo namah || 62|| nityam shantasvarupayedanim
    bhayankaraya te | avismritasvarupaya'dbhutaya haraye namah || 63|| ityakashattushtuvuste'ntikam ke'pi
    na cayayuh | ugramrityormukhe gantum shrimrite kah patet shvasan || 64|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 140
  devanagari: ब्रह्मादिभिः कृतं नरसिंहस्तोत्रम् नमोऽक्षरपररूपाक्षरान्तर्यामिणे च ते । नमो मुक्ताभिवन्द्याय
    नमो व्यूहात्मने च ते ॥ ५२॥ नमः प्रकृतिरूपाय प्रधानपुरुषाय ते । महाकालस्वरूपाय भूमरूपाय च ते नमः ॥
    ५३॥ अप्रतर्क्यस्वरूपायाऽनन्तरूपाय ते नमः । अभक्तनाशकर्त्रे ते भक्तरक्षणकारिणे ॥ ५४॥ वरदानानुरूपाय
    तथैव दैत्यघातिने । सर्वात्मने करालाय विकरालाय ते नमः ॥ ५५॥ यज्ञभागप्रदात्रे ते रक्षकाय नमो नमः । हृदि
    बोधाय देवानां त्रात्रे तस्मै नमो नमः ॥ ५६॥ तपोमार्गप्रवृत्ताय ऋषिगम्याय ते नमः । श्राद्धतृप्तिप्रदायाऽत्र
    परत्रदायिने नमः ॥ ५७॥ योगगतिप्रसाराय सिद्धिस्मृद्धिगृहाय च । तपोबलप्रकृष्टाय धर्मात्मँस्ते नमो नमः
    ॥ ५८॥ स्तुतिस्तुत्याय विद्यायाः शुभाधिपतये नमः । रत्नप्रदात्रे न्यायाय नीतिधात्रे नमो नमः ॥ ५९॥ मनुत्वसंरक्षकाय
    प्रजापतित्वदायिने । नटनाट्यगायकानां क्रीडागीत्यात्मने नमः ॥ ६०॥ वाहकत्वप्रदात्रे ते सपर्यादिप्रदायिने
    । विष्टिकार्यनियोक्त्रे ते जगदीशाय ते नमः ॥ ६१॥ वैष्णवानां रक्षकाय बहुरूपधराय ते । नारायणाय कृष्णाय
    श्रीहरये नमो नमः ॥ ६२॥ नित्यं शान्तस्वरूपायेदानीं भयङ्कराय ते । अविस्मृतस्वरूपायाऽद्भुताय हरये नमः
    ॥ ६३॥ इत्याकाशात्तुष्टुवुस्तेऽन्तिकं केऽपि न चाययुः । उग्रमृत्योर्मुखे गन्तुं श्रीमृते कः पतेत् श्वसन्
    ॥ ६४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १४०
