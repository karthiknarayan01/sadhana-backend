id: shrirangastotram
category: stotram
name:
  english: shrirangastotram
  devanagari: श्रिरन्गस्तोत्रम्
content:
  english: shrirangastotram padmadhiraje garudadhiraje virincaraje surarajaraje | trailokyaraje'khilarajaraje
    shrirangaraje ramatam mano me || 1|| nilabjavarne bhujapurnakarne karnantanetre kamalakalatre | shrimallarange
    jitamallarange shrirangarange ramatam mano me || 2|| lakshminivase jagatam nivase hritpadmavase ravibimbavase
    | kshirabdhivase phanibhogavase shrirangavase ramatam mano me || 3|| kuberalile jagadekalile mandaramalankitacaruphale
    | daityantakale'khilalokamaule shrirangalile ramatam mano me || 4|| amoghanidre jagadekanidre videhanidre
    ca samudranidre | shriyoganidre sukhayoganidre shriranganidre ramatam mano me || 5|| anandarupe nijabodharupe
    brahmasvarupe kshitimurtirupe | vicitrarupe ramaniyarupe shrirangarupe ramatam mano me || 6|| bhaktakritarthe
    muraravanarthe bhaktasamarthe jagadekakirte | anekamurte ramaniyamurte shrirangamurte ramatam mano
    me || 7|| kamsapramathe narakapramathe dushtapramathe jagatam nidane | anathanathe jagadekanathe shriranganathe
    ramatam mano me || 8|| sucitrashayi jagadekashayi nandankashayi kamalankashayi | ambhodhishayi vatapatrashayi
    shrirangashayi ramatam mano me || 9|| sakaladuritahari bhumibharapahari dashamukhakulahari daityadarpapahari
    | sulalitakritacari parijatapahari tribhuvanabhayahari priyatam shrimurarih || 10|| rangastotramidam
    punyam pratahkale pathennarah | kotijanmarjitam papam smaranena vinashyati || iti shrirangastotram
    sampurnam ||
  devanagari: श्रीरङ्गस्तोत्रम् पद्माधिराजे गरुडाधिराजे विरिञ्चराजे सुरराजराजे । त्रैलोक्यराजेऽखिलराजराजे
    श्रीरङ्गराजे रमतां मनो मे ॥ १॥ नीलाब्जवर्णे भुजपूर्णकर्णे कर्णान्तनेत्रे कमलाकलत्रे । श्रीमल्लरङ्गे
    जितमल्लरङ्गे श्रीरङ्गरङ्गे रमतां मनो मे ॥ २॥ लक्ष्मीनिवासे जगतां निवासे हृत्पद्मवासे रविबिम्बवासे
    । क्षीराब्धिवासे फणिभोगवासे श्रीरङ्गवासे रमतां मनो मे ॥ ३॥ कुबेरलीले जगदेकलीले मन्दारमालाङ्कितचारुफाले
    । दैत्यान्तकालेऽखिललोकमौले श्रीरङ्गलीले रमतां मनो मे ॥ ४॥ अमोघनिद्रे जगदेकनिद्रे विदेहनिद्रे च समुद्रनिद्रे
    । श्रीयोगनिद्रे सुखयोगनिद्रे श्रीरङ्गनिद्रे रमतां मनो मे ॥ ५॥ आनन्दरूपे निजबोधरूपे ब्रह्मस्वरूपे क्षितिमूर्तिरूपे
    । विचित्ररूपे रमणीयरूपे श्रीरङ्गरूपे रमतां मनो मे ॥ ६॥ भक्ताकृतार्थे मुररावणार्थे भक्तसमर्थे जगदेककीर्ते
    । अनेकमूर्ते रमणीयमूर्ते श्रीरङ्गमूर्ते रमतां मनो मे ॥ ७॥ कंसप्रमाथे नरकप्रमाथे दुष्टप्रमाथे जगतां
    निदाने । अनाथनाथे जगदेकनाथे श्रीरङ्गनाथे रमतां मनो मे ॥ ८॥ सुचित्रशायी जगदेकशायी नन्दाङ्कशायी कमलाङ्कशायी
    । अम्भोधिशायी वटपत्रशायी श्रीरङ्गशायी रमतां मनो मे ॥ ९॥ सकलदुरितहारी भूमिभारापहारी दशमुखकुलहारी दैत्यदर्पापहारी
    । सुललितकृतचारी पारिजातापहारी त्रिभुवनभयहारी प्रीयतां श्रीमुरारिः ॥ १०॥ रङ्गस्तोत्रमिदं पुण्यं प्रातःकाले
    पठेन्नरः । कोटिजन्मार्जितं पापं स्मरणेन विनश्यति ॥ इति श्रीरङ्गस्तोत्रं सम्पूर्णम् ॥
