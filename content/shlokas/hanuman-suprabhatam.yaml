id: hanuman-suprabhatam
category: stotram
name:
  english: Hanuman Suprabhatam
content:
  english: shri anjaneya suprabhatamu amala kanakavarnam prajvala tpavakaksham sarasija nibhavaktram sarvada
    suprasannam | patutara ghanagatram kundalalankritangam rana jaya karavalam ramadutam namami || anjana
    supraja vira purva sandhya pravartate uttishtha harishardula kartavyam daivamahnikam | uttishtottishtha
    hanuman uttishtha vijayadhvaja uttishtha virajakanta trailokyam mangalankuru || shri rama bhakta abhaya
    hanuman tavasuprabhatam || shri ramacandra caranambuja mattabhringa shri ramacandra japashila bhavabdhipota
    | shri janaki hridayatapa nivaramurte shri vira dhira hanuman tava suprabhatam || shri rama bhakta
    abhaya hanuman tavasuprabhatam || shri rama divya caritamrita svadulola shri rama kinkara gunakara
    dinabandho | shri ramabhakta jagadeka mahograshauryam shri vira dhira hanuman tava suprabhatam ||
    shri rama bhakta abhaya hanuman tavasuprabhatam || sugrivamitra kapishekhara punya murte sugriva raghava
    namagama divyakirte | sugriva mantrivara shura kulagraganya shri vira dhira hanuman tava suprabhatam
    || shri rama bhakta abhaya hanuman tavasuprabhatam || bhaktarti bhanjana dayakara yogivandya shri
    kesaripriya tanuja suvarnadeha | shri bhaskaratmaja manombuja cancarika shri vira dhira hanuman tava
    suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam || shri marutapriya tanuja mahabaladhya
    mainaka vandita padambuja danditarin | shri ushtra vahana sulakshana lakshitanga shri vira dhira hanuman
    tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam || pancananasya bhavabhiti harasyarama
    padabda sevana parasya paratparasya | shri anjanapriya sutasya suvigrahasya shri vira dhira hanuman
    tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam || gandharva yaksha bhujagadhipa
    kinnarashca aditya vishvavasu rudra surarshisanghah | sankirtayanti tavadivya sunamapanktim shri vira
    dhira hanuman tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam || shri gautama
    cyavana tumbura naradatri maitreya vyasa janakadi maharshisanghah | gayanti harshabharita stava divyakirtim
    shri vira dhira hanuman tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam || bhringavali
    ca makaranda rasam pibedvai kujantyutardha madhuram caranayudhacca | devalaye ghana gabhira sushankha
    ghoshah niryanti vira hanuman tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam
    || pampa sarovara supunya pavitra tirdha madaya hema kalashaishca maharshisanghah | tishtanti tvakcarana
    pankaja sevanartham shri vira dhira hanuman tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam
    || shri suryaputra priyanatha manojnamurte vatatmaja kapivira supingalaksha sanjivaraya raghuvira
    subhaktavarya shri vira dhira hanuman tava suprabhatam || shri rama bhakta abhaya hanuman tavasuprabhatam
    ||
  devanagari: श्री आञ्जनेय सुप्रभातमु अमल कनकवर्णं प्रज्वल त्पावकाक्षं सरसिज निभवक्त्रं सर्वदा सुप्रसन्नम्
    । पटुतर घनगात्रं कुण्डलालङ्कृताङ्गं रण जय करवालं रामदूतं नमामि ॥ अञ्जना सुप्रजा वीर पूर्वा सन्ध्या
    प्रवर्तते उत्तिष्ठ हरिशार्दूल कर्तव्यं दैवमाह्निकम् । उत्तिष्टोत्तिष्ठ हनुमान् उत्तिष्ठ विजयध्वज उत्तिष्ठ
    विरजाकान्त त्रैलोक्यं मङ्गलङ्कुरु ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ श्री रामचन्द्र चरणाम्बुज
    मत्तभृङ्ग श्री रामचन्द्र जपशील भवाब्धिपोत । श्री जानकी हृदयताप निवारमूर्ते श्री वीर धीर हनुमान् तव
    सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ श्री राम दिव्य चरितामृत स्वादुलोल श्री राम किङ्कर
    गुणाकर दीनबन्धो । श्री रामभक्त जगदेक महोग्रशौर्यं श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त
    अभय हनुमान् तवसुप्रभातम् ॥ सुग्रीवमित्र कपिशेखर पुण्य मूर्ते सुग्रीव राघव नमागम दिव्यकीर्ते । सुग्रीव
    मन्त्रिवर शूर कुलाग्रगण्य श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम्
    ॥ भक्तार्ति भञ्जन दयाकर योगिवन्द्य श्री केसरीप्रिय तनूज सुवर्णदेह । श्री भास्करात्मज मनोम्बुज चञ्चरीक
    श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ श्री मारुतप्रिय तनूज
    महबलाढ्य मैनाक वन्दित पदाम्बुज दण्डितारिन् । श्री उष्ट्र वाहन सुलक्षण लक्षिताङ्ग श्री वीर धीर हनुमान्
    तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ पञ्चाननस्य भवभीति हरस्यराम पादाब्द सेवन परस्य
    परात्परस्य । श्री अञ्जनाप्रिय सुतस्य सुविग्रहस्य श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त
    अभय हनुमान् तवसुप्रभातम् ॥ गन्धर्व यक्ष भुजगाधिप किन्नराश्च आदित्य विश्ववसु रुद्र सुरर्षिसङ्घाः ।
    सङ्कीर्तयन्ति तवदिव्य सुनामपङ्क्तिं श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान्
    तवसुप्रभातम् ॥ श्री गौतम च्यवन तुम्बुर नारदात्रि मैत्रेय व्यास जनकादि महर्षिसङ्घाः । गायन्ति हर्षभरिता
    स्तव दिव्यकीर्तिं श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ भृङ्गावली
    च मकरन्द रसं पिबेद्वै कूजन्त्युतार्ध मधुरं चरणायुधाच्च । देवालये घन गभीर सुशङ्ख घोषाः निर्यान्ति वीर
    हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ पम्पा सरोवर सुपुण्य पवित्र तीर्ध
    मादाय हेम कलशैश्च महर्षिसङ्घाः । तिष्टन्ति त्वक्चरण पङ्कज सेवनार्थं श्री वीर धीर हनुमान् तव सुप्रभातम्
    ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम् ॥ श्री सूर्यपुत्र प्रियनाथ मनोज्ञमूर्ते वातात्मज कपिवीर सुपिङ्गलाक्ष
    सञ्जीवराय रघुवीर सुभक्तवर्य श्री वीर धीर हनुमान् तव सुप्रभातम् ॥ श्री राम भक्त अभय हनुमान् तवसुप्रभातम्
    ॥
