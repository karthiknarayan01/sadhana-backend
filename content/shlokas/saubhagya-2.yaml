id: saubhagya-2
category: veda
name:
  english: saubhagya
  devanagari: सौभग्य
content:
  english: svayamuccalite dehe dehi nityasamadhina | nishcalam tam vijaniyatsamadhirabhidhiyate || 18||
    yatrayatra mano yati tatratatra param padam | tatratatra param brahma sarvatra samavasthitam || 19||
    iti|| || 2|| atha hainam deva ucurnavacakravivekamanubruhiti | tatheti sa hovaca adhare brahmacakram
    triravrittam bhagamandalakaram | tatra mulakande shaktih pavakakaram dhyayet | tatraiva kamarupapitham
    sarvakamapradam bhavati | ityadharacakram | dvitiyam svadhishthanacakram shaddalam | tanmadhye pashcimabhimukham
    lingam pravalankurasadrisham dhyayet | tatraivodyanapitham jagadakarshanasiddhidam bhavati | tritiyam
    nabhicakram pancavartam sarpakutilakaram | tanmadhye kundalinim balarkakotiprabham tanumadhyam dhyayet
    | samarthyashaktih sarvasiddhiprada bhavati | manipuracakram hridayacakram | ashtadalamadhomukham
    | tanmadhye jyotirmayalingakaram dhyayet | saiva hamsakala sarvapriya sarvalokavashyakari bhavati
    | kanthacakram caturangulam | tatra vame ida candranadi dakshine pingala suryanadi tanmadhye sushumnam
    shvetavarnam dhyayet | ya evam vedanahata siddhida bhavati | talucakram | tatramritadharapravahah
    | ghantikalingamulacakrarandhre rajadantavalambinivivaram dashadvadasharam | tatra shunyam dhyayet
    | cittalayo bhavati | saptamam bhrucakramangushthamatram | tatra jnananetram dipashikhakaram dhyayet
    | tadeva kapalakandavaksiddhidam bhavati | ajnacakramashtamam | brahmarandhram nirvanacakram | tatra
    sucikagrihetaram dhumrashikhakaram dhyayet | tatra jalandharapitham mokshapradam bhavatiti parabrahmacakram
    | navamamakashacakram | tatra shodashadalapadmamurdhvamukham tanmadhyakarnikatrikutakaram | tanmadhye
    urdhvashaktih | tam pashyandhyayet | tatraiva purnagiripitham sarvecchasiddhisadhanam bhavati | saubhagyalakshmyupanishadam
    nityamadhite yo'gniputo bhavati | sa vayuputo bhavati | sa sakaladhanadhanyasatputrakalatrahayabhugajapashumahishidasidasa
  devanagari: स्वयमुच्चलिते देहे देही नित्यसमाधिना । निश्चलं तं विजानीयात्समाधिरभिधीयते ॥ १८॥ यत्रयत्र
    मनो याति तत्रतत्र परं पदम् । तत्रतत्र परं ब्रह्म सर्वत्र समवस्थितम् ॥ १९॥ इति॥ ॥ २॥ अथ हैनं देवा ऊचुर्नवचक्रविवेकमनुब्रूहीति
    । तथेति स होवाच आधारे ब्रह्मचक्रं त्रिरावृत्तं भगमण्डलाकारम् । तत्र मूलकन्दे शक्तिः पावकाकारं ध्यायेत्
    । तत्रैव कामरूपपीठं सर्वकामप्रदं भवति । इत्याधारचक्रम् । द्वितीयं स्वाधिष्ठानचक्रं षड्दलम् । तन्मध्ये
    पश्चिमाभिमुखं लिङ्गं प्रवालाङ्कुरसदृशं ध्यायेत् । तत्रैवोड्याणपीठं जगदाकर्षणसिद्धिदं भवति । तृतीयं
    नाभिचक्रं पञ्चावर्तं सर्पकुटिलाकारम् । तन्मध्ये कुण्डलिनीं बालार्ककोटिप्रभां तनुमध्यां ध्यायेत् ।
    सामर्थ्यशक्तिः सर्वसिद्धिप्रदा भवति । मणिपूरचक्रं हृदयचक्रम् । अष्टदलमधोमुखम् । तन्मध्ये ज्योतिर्मयलिङ्गाकारं
    ध्यायेत् । सैव हंसकला सर्वप्रिया सर्वलोकवश्यकरी भवति । कण्ठचक्रं चतुरङ्गुलम् । तत्र वामे इडा चन्द्रनाडी
    दक्षिणे पिङ्गला सूर्यनाडी तन्मध्ये सुषुम्नां श्वेतवर्णां ध्यायेत् । य एवं वेदानाहता सिद्धिदा भवति
    । तालुचक्रम् । तत्रामृतधाराप्रवाहः । घण्टिकालिङ्गमूलचक्ररन्ध्रे राजदन्तावलम्बिनीविवरं दशद्वादशारम्
    । तत्र शून्यं ध्यायेत् । चित्तलयो भवति । सप्तमं भ्रूचक्रमङ्गुष्ठमात्रम् । तत्र ज्ञाननेत्रं दीपशिखाकारं
    ध्यायेत् । तदेव कपालकन्दवाक्सिद्धिदं भवति । आज्ञाचक्रमष्टमम् । ब्रह्मरन्ध्रं निर्वाणचक्रम् । तत्र
    सूचिकागृहेतरं धूम्रशिखाकारं ध्यायेत् । तत्र जालन्धरपीठं मोक्षप्रदं भवतीति परब्रह्मचक्रम् । नवममाकाशचक्रम्
    । तत्र षोडशदलपद्ममूर्ध्वमुखं तन्मध्यकर्णिकात्रिकूटाकारम् । तन्मध्ये ऊर्ध्वशक्तिः । तां पश्यन्ध्यायेत्
    । तत्रैव पूर्णगिरिपीठं सर्वेच्छासिद्धिसाधनं भवति । सौभाग्यलक्ष्म्युपनिषदं नित्यमधीते योऽग्निपूतो भवति
    । स वायुपूतो भवति । स सकलधनधान्यसत्पुत्रकलत्रहयभूगजपशुमहिषीदासीदास
