id: narayaniyam-dashaka-42
category: stotram
name:
  english: Narayaniyam Dashaka 42
content:
  english: kadapi janmarkshadine tava prabho nimantritajnativadhumahisura | mahanasastvam savidhe nidhaya
    sa mahanasadau vavrite vrajeshvari || || tato bhavattrananiyuktabalakaprabhitisankrandanasankularavaih
    | vimishramashravi bhavatsamipatah parisphutaddarucataccataravah || || tatastadakarnanasambhramashramaprakampivakshojabhara
    vrajanganah | bhavantamantardadrishussamantato vinishpataddarunadarumadhyagam || || shishoraho kim
    kimabhuditi drutam pradhavya nandah pashupashca bhusurah | bhavantamalokya yashodaya dhritam samashvasannashrujalardralocanah
    || || kasko nu kautaskuta esha vismayo vishankatam yacchakatam vipatitam | na karanam kincidiheti
    te sthitah svanasikadattakarastvadikshakah || || kumarakasyasya payodhararthinah prarodane lolapadambujahatam
    | maya maya drishtamano viparyagaditisha te palakabalaka jaguh || || bhiya tada kincidajanatamidam
    kumarakanamatidurghatam vacah | bhavatprabhavavidurairitiritam managivashankyata drishtaputanaih ||
    || pravalatamram kimidam padam kshatam sarojaramyau nu karau virojitau| iti prasarpatkarunatarangitastvadangamapasprishuranganajanah
    || || aye sutam dehi jagatpateh kripatarangapatatparipatamadya me | iti sma sangrihya pita tvadangakam
    muhurmuhuh shlishyati jatakantakah || || anonilinah kila hantumagatah surarirevam bhavata vihimsitah
    | rajo'pi no drishtamamushya tatkatham sa shuddhasattve tvayi linavan dhruvam || || prapujitaistatra
    tato dvijatibhirvisheshato lambhitamangalashishah | vrajam nijairbalyarasairvimohayan marutpuradhisha
    rujam jahihi me ||
  devanagari: कदापि जन्मर्क्षदिने तव प्रभो निमन्त्रितज्ञातिवधूमहीसुरा । महानसस्त्वां सविधे निधाय सा महानसादौ
    ववृते व्रजेश्वरी ॥ ॥ ततो भवत्त्राणनियुक्तबालकप्रभीतिसङ्क्रन्दनसङ्कुलारवैः । विमिश्रमश्रावि भवत्समीपतः
    परिस्फुटद्दारुचटच्चटारवः ॥ ॥ ततस्तदाकर्णनसम्भ्रमश्रमप्रकम्पिवक्षोजभरा व्रजाङ्गनाः । भवन्तमन्तर्ददृशुस्समन्ततो
    विनिष्पतद्दारुणदारुमध्यगम् ॥ ॥ शिशोरहो किं किमभूदिति द्रुतं प्रधाव्य नन्दः पशुपाश्च भूसुराः । भवन्तमालोक्य
    यशोदया धृतं समाश्वसन्नश्रुजलार्द्रलोचनाः ॥ ॥ कस्को नु कौतस्कुत एष विस्मयो विशङ्कटं यच्छकटं विपाटितम्
    । न कारणं किञ्चिदिहेति ते स्थिताः स्वनासिकादत्तकरास्त्वदीक्षकाः ॥ ॥ कुमारकस्यास्य पयोधरार्थिनः प्ररोदने
    लोलपदाम्बुजाहतम् । मया मया दृष्टमनो विपर्यगादितीश ते पालकबालका जगुः ॥ ॥ भिया तदा किञ्चिदजानतामिदं
    कुमारकाणामतिदुर्घटं वचः । भवत्प्रभावाविदुरैरितीरितं मनागिवाशङ्क्यत दृष्टपूतनैः ॥ ॥ प्रवालताम्रं किमिदं
    पदं क्षतं सरोजरम्यौ नु करौ विरोजितौ। इति प्रसर्पत्करुणातरङ्गितास्त्वदङ्गमापस्पृशुरङ्गनाजनाः ॥ ॥ अये
    सुतं देहि जगत्पतेः कृपातरङ्गपातात्परिपातमद्य मे । इति स्म सङ्गृह्य पिता त्वदङ्गकं मुहुर्मुहुः श्लिष्यति
    जातकण्टकः ॥ ॥ अनोनिलीनः किल हन्तुमागतः सुरारिरेवं भवता विहिंसितः । रजोऽपि नो दृष्टममुष्य तत्कथं स
    शुद्धसत्त्वे त्वयि लीनवान् ध्रुवम् ॥ ॥ प्रपूजितैस्तत्र ततो द्विजातिभिर्विशेषतो लम्भितमङ्गलाशिषः ।
    व्रजं निजैर्बाल्यरसैर्विमोहयन् मरुत्पुराधीश रुजां जहीहि मे ॥
