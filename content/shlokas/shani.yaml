id: shani
category: stotram
name:
  english: shani
  devanagari: शनि
content:
  english: shanaishcarastotram shriganeshaya namah || asya shrishanaishcarastotrasya | dasharatha rishih
    | shanaishcaro devata | trishtup chandah || shanaishcaraprityartha jape viniyogah | dasharatha uvaca
    || kono'ntako raudrayamo'tha babhruh krishnah shanih pimgalamandasaurih | nityam smrito yo harate
    ca pidam tasmai namah shriravinandanaya || 1|| surasurah kimpurushoragendra gandharvavidyadharapannagashca
    | pidyanti sarve vishamasthitena tasmai namah shriravinandanaya || 2|| nara narendrah pashavo mrigendra
    vanyashca ye kitapatamgabhringah | pidyanti sarve vishamasthitena tasmai namah shriravinandanaya ||
    3|| deshashca durgani vanani yatra senaniveshah purapattanani | pidyanti sarve vishamasthitena tasmai
    namah shriravinandanaya || 4|| tilairyavairmashagudannadanairlohena nilambaradanato va | prinati mantrairnijavasare
    ca tasmai namah shriravinandanaya || 5|| prayagakule yamunatate ca sarasvatipunyajale guhayam | yo
    yoginam dhyanagato'pi sukshmastasmai namah shriravinandanaya || 6|| anyapradeshatsvagriham pravishtastadiyavare
    sa narah sukhi syat | grihad gato yo na punah prayati tasmai namah shriravinandanaya || 7|| srashta
    svayambhurbhuvanatrayasya trata harisho harate pinaki | ekastridha rigyajuhsamamurtistasmai namah
    shriravinandanaya || 8|| shanyashtakam yah prayatah prabhate nityam suputraih pashubandhavaishca |
    pathettu saukhyam bhuvi bhogayuktah prapnoti nirvanapadam tadante || 9|| konasthah pingalo babhruh
    krishno raudro'ntako yamah | saurih shanaishcaro mandah pippaladena samstutah || 10|| etani dasha
    namani pratarutthaya yah pathet | shanaishcarakrita pida na kadacidbhavishyati || 11|| || iti shribrahmandapurane
    shrishanaishcarastotram sampurnam ||
  devanagari: शनैश्चरस्तोत्रम् श्रीगणेशाय नमः ॥ अस्य श्रीशनैश्चरस्तोत्रस्य । दशरथ ऋषिः । शनैश्चरो देवता
    । त्रिष्टुप् छन्दः ॥ शनैश्चरप्रीत्यर्थ जपे विनियोगः । दशरथ उवाच ॥ कोणोऽन्तको रौद्रयमोऽथ बभ्रुः कृष्णः
    शनिः पिंगलमन्दसौरिः । नित्यं स्मृतो यो हरते च पीडां तस्मै नमः श्रीरविनन्दनाय ॥ १॥ सुरासुराः किंपुरुषोरगेन्द्रा
    गन्धर्वविद्याधरपन्नगाश्च । पीड्यन्ति सर्वे विषमस्थितेन तस्मै नमः श्रीरविनन्दनाय ॥ २॥ नरा नरेन्द्राः
    पशवो मृगेन्द्रा वन्याश्च ये कीटपतंगभृङ्गाः । पीड्यन्ति सर्वे विषमस्थितेन तस्मै नमः श्रीरविनन्दनाय
    ॥ ३॥ देशाश्च दुर्गाणि वनानि यत्र सेनानिवेशाः पुरपत्तनानि । पीड्यन्ति सर्वे विषमस्थितेन तस्मै नमः श्रीरविनन्दनाय
    ॥ ४॥ तिलैर्यवैर्माषगुडान्नदानैर्लोहेन नीलाम्बरदानतो वा । प्रीणाति मन्त्रैर्निजवासरे च तस्मै नमः श्रीरविनन्दनाय
    ॥ ५॥ प्रयागकूले यमुनातटे च सरस्वतीपुण्यजले गुहायाम् । यो योगिनां ध्यानगतोऽपि सूक्ष्मस्तस्मै नमः श्रीरविनन्दनाय
    ॥ ६॥ अन्यप्रदेशात्स्वगृहं प्रविष्टस्तदीयवारे स नरः सुखी स्यात् । गृहाद् गतो यो न पुनः प्रयाति तस्मै
    नमः श्रीरविनन्दनाय ॥ ७॥ स्रष्टा स्वयंभूर्भुवनत्रयस्य त्राता हरीशो हरते पिनाकी । एकस्त्रिधा ऋग्यजुःसाममूर्तिस्तस्मै
    नमः श्रीरविनन्दनाय ॥ ८॥ शन्यष्टकं यः प्रयतः प्रभाते नित्यं सुपुत्रैः पशुबान्धवैश्च । पठेत्तु सौख्यं
    भुवि भोगयुक्तः प्राप्नोति निर्वाणपदं तदन्ते ॥ ९॥ कोणस्थः पिङ्गलो बभ्रुः कृष्णो रौद्रोऽन्तको यमः ।
    सौरिः शनैश्चरो मन्दः पिप्पलादेन संस्तुतः ॥ १०॥ एतानि दश नामानि प्रातरुत्थाय यः पठेत् । शनैश्चरकृता
    पीडा न कदाचिद्भविष्यति ॥ ११॥ ॥ इति श्रीब्रह्माण्डपुराणे श्रीशनैश्चरस्तोत्रं सम्पूर्णम् ॥
