id: ganesha-bhujanga-stotram
category: stotram
name:
  english: Ganesha Bhujanga Stotram
content:
  english: ranatkshudraghantaninadabhiramam calattandavoddandavatpadmatalam | lasattundilangoparivyalaharam
    ganadhishamishanasunum tamide || || dhvanidhvamsavinalayollasivaktram sphuracchundadandollasadbijapuram
    | galaddarpasaugandhyalolalimalam ganadhishamishanasunum tamide || || prakashajjaparaktaratnaprasuna
    pravalaprabhatarunajyotirekam | pralambodaram vakratundaikadantam ganadhishamishanasunum tamide ||
    || vicitrasphuradratnamalakiritam kiritollasaccandrarekhavibhusham | vibhushaikabhusham bhavadhvamsahetum
    ganadhishamishanasunum tamide || || udancadbhujavallaridrishyamulo ccaladbhrulatavibhramabhrajadaksham
    | marutsundaricamaraih sevyamanam ganadhishamishanasunum tamide || || sphurannishthuralolapingakshitaram
    kripakomalodaralilavataram | kalabindugam giyate yogivaryai rganadhishamishanasunum tamide || || yamekaksharam
    nirmalam nirvikalpam gunatitamanandamakarashunyam | param paramonkaramamnayagarbham vadanti pragalbham
    puranam tamide || || cidanandasandraya shantaya tubhyam namo vishvakartre ca hartre ca tubhyam | namo'nantalilaya
    kaivalyabhase namo vishvabija prasideshasuno || || imam sustavam pratarutthaya bhaktya pathedyastu
    martyo labhetsarvakaman | ganeshaprasadena siddhyanti vaco ganeshe vibhau durlabham kim prasanne ||
  devanagari: रणत्क्षुद्रघण्टानिनादाभिरामं चलत्ताण्डवोद्दण्डवत्पद्मतालम् । लसत्तुन्दिलाङ्गोपरिव्यालहारं
    गणाधीशमीशानसूनुं तमीडे ॥ ॥ ध्वनिध्वंसवीणालयोल्लासिवक्त्रं स्फुरच्छुण्डदण्डोल्लसद्बीजपूरम् । गलद्दर्पसौगन्ध्यलोलालिमालं
    गणाधीशमीशानसूनुं तमीडे ॥ ॥ प्रकाशज्जपारक्तरत्नप्रसून प्रवालप्रभातारुणज्योतिरेकम् । प्रलम्बोदरं वक्रतुण्डैकदन्तं
    गणाधीशमीशानसूनुं तमीडे ॥ ॥ विचित्रस्फुरद्रत्नमालाकिरीटं किरीटोल्लसच्चन्द्ररेखाविभूषम् । विभूषैकभूषं
    भवध्वंसहेतुं गणाधीशमीशानसूनुं तमीडे ॥ ॥ उदञ्चद्भुजावल्लरीदृश्यमूलो च्चलद्भ्रूलताविभ्रमभ्राजदक्षम्
    । मरुत्सुन्दरीचामरैः सेव्यमानं गणाधीशमीशानसूनुं तमीडे ॥ ॥ स्फुरन्निष्ठुरालोलपिङ्गाक्षितारं कृपाकोमलोदारलीलावतारम्
    । कलाबिन्दुगं गीयते योगिवर्यै र्गणाधीशमीशानसूनुं तमीडे ॥ ॥ यमेकाक्षरं निर्मलं निर्विकल्पं गुणातीतमानन्दमाकारशून्यम्
    । परं पारमोङ्कारमाम्नायगर्भं वदन्ति प्रगल्भं पुराणं तमीडे ॥ ॥ चिदानन्दसान्द्राय शान्ताय तुभ्यं नमो
    विश्वकर्त्रे च हर्त्रे च तुभ्यम् । नमोऽनन्तलीलाय कैवल्यभासे नमो विश्वबीज प्रसीदेशसूनो ॥ ॥ इमं सुस्तवं
    प्रातरुत्थाय भक्त्या पठेद्यस्तु मर्त्यो लभेत्सर्वकामान् । गणेशप्रसादेन सिद्ध्यन्ति वाचो गणेशे विभौ
    दुर्लभं किं प्रसन्ने ॥
