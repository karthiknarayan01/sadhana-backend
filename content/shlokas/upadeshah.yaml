id: upadeshah
category: ekashloki
name:
  english: upadeshah
  devanagari: उपदेशः
content:
  english: ahamiyacca vibhati parisphutam brihadidam ca vilokaya he priya | nijamahimni na sanga iti kvacit
    yadi tu vetsi tadaiva param padam || iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracitah
    upadeshah sampurnah | paushya
  devanagari: अहमियच्च विभाति परिस्फुटं बृहदिदं च विलोकय हे प्रिय । निजमहिम्नि न सङ्ग इति क्वचित् यदि
    तु वेत्सि तदैव परं पदम् ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितः
    उपदेशः सम्पूर्णः । पौष्य
meaning: {}
