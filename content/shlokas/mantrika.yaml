id: mantrika
category: mantra
name:
  english: mantrika
  devanagari: मन्त्रिक
content:
  english: yasminsarvamidam protam brahma sthavarajangamam | tasminneva layam yanti sravantyah sagare
    yatha || 17|| yasminbhavah praliyante linashcavyaktatam yayuh | pashyanti vyaktatam bhuyo jayante
    budbuda iva || 18|| kshetrajnadhishthitam caiva karanairvidyate punah | evam sa bhagavandevam pashyantyanye
    punah punah || 19|| brahma brahmetyathayanti ye vidurbrahmanastatha | atraiva te layam yanti linashcavyaktashalinah
    || linashcavyaktashalina ityupanishat || om purnamadah purnamidam purnatpurnamudacyate | purnasya
    purnamadaya purnamevavashishyate || om shantih shantih shantih || iti mantrikopanishatsamapta || culikopanishad
  devanagari: यस्मिन्सर्वमिदं प्रोतं ब्रह्म स्थावरजङ्गमम् । तस्मिन्नेव लयं यान्ति स्रवन्त्यः सागरे यथा
    ॥ १७॥ यस्मिन्भावाः प्रलीयन्ते लीनाश्चाव्यक्ततां ययुः । पश्यन्ति व्यक्ततां भूयो जायन्ते बुद्बुदा इव
    ॥ १८॥ क्षेत्रज्ञाधिष्ठितं चैव कारणैर्विद्यते पुनः । एवं स भगवान्देवं पश्यन्त्यन्ये पुनः पुनः ॥ १९॥
    ब्रह्म ब्रह्मेत्यथायान्ति ये विदुर्ब्राह्मणास्तथा । अत्रैव ते लयं यान्ति लीनाश्चाव्यक्तशालिनः ॥ लीनाश्चाव्यक्तशालिन
    इत्युपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥
    ॐ शान्तिः शान्तिः शान्तिः ॥ इति मन्त्रिकोपनिषत्समाप्ता ॥ चूलिकोपनिषद्
