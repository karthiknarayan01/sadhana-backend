id: ganeshastotramvishnuk-itambvp
category: stotram
name:
  english: ganeshastotramvishnukṟitamBVP
  devanagari: गणेशस्तोत्रम्विष्णुक्ऱितम्BVP
content:
  english: vayutulyati samsararnavapare ca mayapote sudurlabhe | karnadharasvarupam ca bhaktanugrahakarakam
    || 4|| varam varenyam varadam varadanamapishvaram | siddham siddhisvarupam ca siddhidam siddhisadhanam
    || 5|| dhyanatiriktam dhyeyam ca dhyanasadhyam ca dharmikam | dharmasvarupam dharmajnam dharmadharmaphalapradam
    || 6|| bijam samsaravrikshanamanakuram ca tadashrayam | stripumnapumsakanam ca rupametadatindriyam
    || 7|| sarvadyamagrapujyam ca sarvapujyam gunarnavam | svecchaya sagunam brahma nirgunam svecchaya
    punah || 8|| svayam prakritirupam ca prakritam prakriteh param | tvam stotumakshamo'nantah sahasravadanairapi
    || 9||
  devanagari: वायुतुल्याति संसारार्णवपारे च मायापोते सुदुर्लभे । कर्णधारस्वरूपं च भक्तानुग्रहकारकम् ॥
    ४॥ वरं वरेण्यं वरदं वरदानामपीश्वरम् । सिद्धं सिद्धिस्वरूपं च सिद्धिदं सिद्धिसाधनम् ॥ ५॥ ध्यानातिरिक्तं
    ध्येयं च ध्यानासाध्यं च धार्मिकम् । धर्मस्वरूपं धर्मज्ञं धर्माधर्मफलप्रदम् ॥ ६॥ बीजं संसारवृक्षाणामङकुरं
    च तदाश्रयम् । स्त्रीपुंनपुंसकानां च रूपमेतदतीन्द्रियम् ॥ ७॥ सर्वाद्यमग्रपूज्यं च सर्वपूज्यं गुणार्णवम्
    । स्वेच्छया सगुणं ब्रह्म निर्गुणं स्वेच्छया पुनः ॥ ८॥ स्वयं प्रकृतिरूपं च प्राकृतं प्रकृतेः परम् ।
    त्वां स्तोतुमक्षमोऽनन्तः सहस्रवदनैरपि ॥ ९॥
meaning: {}
