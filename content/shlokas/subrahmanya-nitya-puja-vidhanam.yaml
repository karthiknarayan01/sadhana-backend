id: subrahmanya-nitya-puja-vidhanam
category: stotram
name:
  english: Subrahmanya Nitya Puja Vidhanam
content:
  english: subrahmanya svami pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri
    gurubhyo namah | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham
    sa bahyabhyantarah shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam
    candrabalam tadeva | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma
    gururvishnuh gururdevo maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala
    mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam
    namah | umamaheshvarabhyam namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam
    namah | shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om
    keshavaya svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah
    | om madhusudanaya namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya
    namah | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah
    | om pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah |
    om narasimhaya namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah
    | om shrikrishnaya namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam
    dehi putramshca sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam
    karishyami tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu
    bhutapishacah ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta
    ye bhuta bhumisamsthitah | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah
    | ogm suvah | o ntapah | ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo
    jyoti raso mbrahma bhurbhuvassuvarom || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara
    prityartham asmakam sahakutumbasya kshema shrisubrahmanya svami pujam karishye || tadanga kalasharadhanam
    karishye || kalasharadhanam kalashe gandha pushpakshatairabhyarcya | kalashe udakam purayitva | kalashasyopari
    hastam nidhaya | kalashasya mukhe vishnuh kanthe rudrah samashritah | mule tvasya sthito brahma madhye
    matriganah smritah || kukshau tu sagarah sarve saptadvipa vasundhara | rigvedo'tha yajurvedo samavedo
    hyatharvanah || angaishca sahitah sarve kalashambu samashritah || gange ca yamune caiva godavari sarasvati
    | narmade sindhu kaveri jale'smin sannidhim kuru || kaveri tungabhadra ca krishnaveni ca gautami |
    bhagirathiti vikhyatah pancagangah prakirtitah || ayantu devapujartham mama duritakshayakarakah |
    kalashodakena puja dravyani samprokshya atmanam ca samprokshya || shankhapuja shankham candrarka daivatam
    madhye varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim || trailokye yani tirthani
    vasudevasya ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet || om shankhaya namah
    | om dhavalaya namah | om pancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe akshatan
    samarpayami || ghantanadah agamartham tu devanam gamanartham tu rakshasam | ghantaravam karomyadau
    devatahvana lanchanam || om ghantadevatabhyo namah | sakalopacara pujarthe akshatan samarpayami ||
    shri mahaganapati puja o ntva ganapatigm havamahe kavi nkavinam upamashravastavam | jyeshtharaja mbrahmanaspata
    a nah shrinvannutibhissida sadanam || sumukhashcaikadantashca kapilo gajakarnakah | lambodarashca
    vikato vighnarajo ganadhipah || dhumaketurganadhyakshah phalacandro gajananah | vakratundah shurpakarno
    herambah skandapurvajah || om shrimahaganapataye namah | dhyayami | avahayami | asanam samarpayami
    | padyam samarpayami | arghyam samarpayami | acamaniyam samarpayami | snanam samarpayami | vastram
    samarpayami | yajnopavitam samarpayami | gandham samarpayami | pushpani samarpayami | dhupamaghrapayami
    | dipam darshayami | naivedyam samarpayami | tambulam samarpayami | nirajanam samarpayami | mantrapushpam
    samarpayami | pradakshina namaskaran samarpayami || shodashopacara puja subrahmanya svami dhyanam
    shadvaktram shikhivahanam trinayanam citrambaralankritam vajram shaktimasim trishulamabhayam khetam
    dhanushcakrakam | pasham kukkutamankusham ca varadam dorbhirdadhanam sada dhyayamipsita siddhidam
    shivasutam shridvadashaksham guham || shadananam candanalepitangam mahorasam divyamayuravahanam |
    rudrasya sunum suralokanatham brahmanyadevam sharanam prapadye || om tatpurushaya vidmahe mahasenaya
    dhimahi | tannah shanmukhah pracodayat || om shrisubrahmanyaya namah | dhyayami | dhyanam samarpayami
    || avahanam subrahmanya mahabhaga krauncakhyagiribhedana | avahayami deva tvam bhaktabhishtaprado
    bhava || om shrisubrahmanyaya namah | avahayami | sthapayami | pujayami || asanam agniputra mahabhaga
    kartikeya surarcita | ratnasimhasanam deva grihana varadavyaya || om shrisubrahmanyaya namah | asanam
    samarpayami || padyam ganeshanuja devesha vallikamada vigraha | padyam grihana gangeya bhaktya dattam
    surarcita || om shrisubrahmanyaya namah | padayoh padyam samarpayami || arghyam brahmadi devabrindanam
    pranavarthopadeshaka | arghyam grihana devesha tarakantaka shanmukha || om shrisubrahmanyaya namah
    | hastayoh arghyam samarpayami || acamaniyam elakunkuma kasturi karpuradi suvasitaih | tirthairacamyatam
    deva gangadharasutavyaya || om shrisubrahmanyaya namah | mukhe acamaniyam samarpayami || snanam apo
    hishtha mayobhuvasta na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha
    nah | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah ||
    om shrisubrahmanyaya namah | shuddhodaka snanam samarpayami || snananantaram acamaniyam samarpayami
    || vastram dukula vastrayugalam muktajala samanvitam | pritya grihana gangeya bhaktapadbhanjanakshama
    || om shrisubrahmanyaya namah | vastram samarpayami || yajnopavitam rajatam brahmasutram ca kancanam
    cottariyakam | yajnopavitam devesha grihana suranayaka || om shrisubrahmanyaya namah | yajnopavitam
    samarpayami || gandham kasturikunkumadyaishca vasitam sahimodakam | gandham vilepanarthaya grihana
    krauncadarana || om shrisubrahmanyaya namah | gandham samarpayami || arcana akshatan dhavalan divyan
    pushpani ca sugandhini | bhaktya dattani grihyantam sarvadevah prasidata || anga puja om suravanditapadaya
    namah padau pujayami | om mukurakarajanave namah januni pujayami | om karirajakarorave namah uru pujayami
    | om ratnakinkinikayuktakataye namah katim pujayami | om guhaya namah guhyam pujayami | om herambasahodaraya
    namah udaram pujayami | om sunabhaye namah nabhim pujayami | om suhride namah hridayam pujayami |
    om vishalavakshase namah vakshahsthalam pujayami | om shaktidharaya namah bahu pujayami | om shanmukhaya
    namah mukham pujayami | om phalanetrasutaya namah netre pujayami | om shikhivahanaya namah shirah
    pujayami | om vallidevasenasametaya namah sarvanyangani pujayami || subrahmanya ashtottara shata namavali
    athava subrahmanya namavali pathanam || om shrisubrahmanyaya namah | ashtottara shata namavali pujam
    samarpayami | akshatan pushpani ca samarpayami || dhupam dashangam guggulupetam sugandham sumanoharam
    | kapilaghrita samyuktam dhupam grihnishva shanmukha || om shrisubrahmanyaya namah | dhupamaghrapayami
    || dipam sajyam trivarti samyuktam vahnina yojitam priyam | dipam grihana skandesha trailokya timirapaham
    || om shrisubrahmanyaya namah | dipam darshayami || naivedyam lehyam coshyam ca bhojyam ca paniyam
    shadrasanvitam | bhakshyashakadi samyuktam naivedyam skanda grihyatam || o mbhurbhuvassuvah | tatsaviturvare
    mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva ritena parishincami | amritamastu
    | amritopastaranamasi | om pranaya svaha | om apanaya svaha | om vyanaya svaha | om udanaya svaha
    | om samanaya svaha | madhye madhye paniyam samarpayami | amritapidhanamasi | uttaraposhanam samarpayami
    | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam samarpayami || om shrisubrahmanyaya
    namah | naivedyam samarpayami || tambulam pugiphalashca karpuraih nagavallidalairyutam | muktacurna
    samyuktam tambulam pratigrihyatam || om shrisubrahmanyaya namah | tambulam samarpayami || nirajanam
    nanadipasamayuktam nirajanam manoharam | ajnana timira dhvamsi grihyatam bhaktipurvakam || om shrisubrahmanyaya
    namah | nirajanam samarpayami || mantrapushpam yo nbhavati | candrama va apa ve~da || om shrisubrahmanyaya
    namah | mantrapushpam samarpayami || pradakshinam yani kani ca papani janmantara kritani ca | tani
    tani pranashyanti pradakshina pade pade || papo'ham papakarma'ham papatma papasambhava | trahi mam
    kripaya deva sharanagatavatsala || anyatha sharanam nasti tvameva sharanam mama | tasmatkarunya bhavena
    raksha raksha sureshvara || om shrisubrahmanyaya namah | pradakshina namaskaran samarpayami || namaskarah
    urasa shirasa drishtya manasa vacasa tatha | padbhyam karabhyam karnabhyam pranamo'shtanga ucyate
    || om shrisubrahmanyaya namah | namaskaran samarpayami || sarvopacarah om shrisubrahmanyaya namah
    | chatram samarpayami | camaram samarpayami | gitam shravayami | nrityam darshayami | samasta rajopacaran
    devopacaran samarpayami || stotra pathanam shri subrahmanya hridaya stotram subrahmanya pancaratna
    stotram kshamaprarthana mantrahinam kriyahinam bhaktihinam subrahmanya | yatpujitam maya deva paripurnam
    tadastu te || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam
    parasmai narayanayeti samarpayami || anaya dhyana shodashopacara pujaya shrisubrahmanya svami supritah
    suprasannah varado bhavatu || udvasanam om shrisubrahmanyaya namah | yathasthanam udvasayami | shobhanarthe
    kshemaya punaragamanaya ca || prasada grahanam akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram
    devata padodakam shubham || shrisubrahmanya svami prasadam shirasa grihnami || om shantih shantih
    shantih || om tatsat brahmarpanamastu ||
  devanagari: सुब्रह्मण्य स्वामि प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो
    नमः । हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम श्रीसुब्रह्मण्य स्वामि पूजां करिष्ये ॥
    तदङ्ग कलशाराधनं करिष्ये ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि
    हस्तं निधाय । कलशस्य मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः
    स्मृताः ॥ कुक्षौ तु सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च
    सहिताः सर्वे कलशाम्बु समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन्
    सन्निधिं कुरु ॥ कावेरी तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः
    ॥ आयान्तु देवपूजार्थं मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य
    ॥ शङ्खपूजा शङ्खं चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम्
    ॥ त्रैलोक्ये यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत्
    ॥ ॐ शङ्खाय नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि
    ॥ घण्टानादः आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ
    घण्टादेवताभ्यो नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं
    हवामहे क॒वि ङ्क॑वी॒नां उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒
    साद॑नम् ॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः
    फालचन्द्रो गजाननः । वक्रतुण्डः शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि ।
    आवाहयामि । आसनं समर्पयामि । पाद्यं समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि
    । वस्त्रं समर्पयामि । यज्ञोपवीतं समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि
    । दीपं दर्शयामि । नैवेद्यं समर्पयामि । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि
    । प्रदक्षिण नमस्कारान् समर्पयामि ॥ षोडशोपचार पूजा सुब्रह्मण्य स्वामि ध्यानम् षड्वक्त्रं शिखिवाहनं
    त्रिनयनं चित्राम्बरालङ्कृतं वज्रं शक्तिमसिं त्रिशूलमभयं खेटं धनुश्चक्रकम् । पाशं कुक्कुटमङ्कुशं च
    वरदं दोर्भिर्दधानं सदा ध्यायामीप्सित सिद्धिदं शिवसुतं श्रीद्वादशाक्षं गुहम् ॥ षडाननं चन्दनलेपिताङ्गं
    महोरसं दिव्यमयूरवाहनम् । रुद्रस्य सूनुं सुरलोकनाथं ब्रह्मण्यदेवं शरणं प्रपद्ये ॥ ॐ तत्पुरुषाय विद्महे
    महासेनाय धीमहि । तन्नः षण्मुखः प्रचोदयात् ॥ ॐ श्रीसुब्रह्मण्याय नमः । ध्यायामि । ध्यानं समर्पयामि
    ॥ आवाहनम् सुब्रह्मण्य महाभाग क्रौञ्चाख्यगिरिभेदन । आवाहयामि देव त्वं भक्ताभीष्टप्रदो भव ॥ ॐ श्रीसुब्रह्मण्याय
    नमः । आवाहयामि । स्थापयामि । पूजयामि ॥ आसनम् अग्निपुत्र महाभाग कार्तिकेय सुरार्चित । रत्नसिंहासनं
    देव गृहाण वरदाव्यय ॥ ॐ श्रीसुब्रह्मण्याय नमः । आसनं समर्पयामि ॥ पाद्यम् गणेशानुज देवेश वल्लीकामद विग्रह
    । पाद्यं गृहाण गाङ्गेय भक्त्या दत्तं सुरार्चित ॥ ॐ श्रीसुब्रह्मण्याय नमः । पादयोः पाद्यं समर्पयामि
    ॥ अर्घ्यम् ब्रह्मादि देवबृन्दानां प्रणवार्थोपदेशक । अर्घ्यं गृहाण देवेश तारकान्तक षण्मुख ॥ ॐ श्रीसुब्रह्मण्याय
    नमः । हस्तयोः अर्घ्यं समर्पयामि ॥ आचमनीयम् एलाकुङ्कुम कस्तूरी कर्पूरादि सुवासितैः । तीर्थैराचम्यतां
    देव गङ्गाधरसुताव्यय ॥ ॐ श्रीसुब्रह्मण्याय नमः । मुखे आचमनीयं समर्पयामि ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता
    न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥ यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः
    ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः ॥ ॐ श्रीसुब्रह्मण्याय नमः । शुद्धोदक
    स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं समर्पयामि ॥ वस्त्रम् दुकूल वस्त्रयुगलं मुक्ताजाल समन्वितम्
    । प्रीत्या गृहाण गाङ्गेय भक्तापद्भञ्जनक्षम ॥ ॐ श्रीसुब्रह्मण्याय नमः । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम्
    राजतं ब्रह्मसूत्रं च काञ्चनं चोत्तरीयकम् । यज्ञोपवीतं देवेश गृहाण सुरनायक ॥ ॐ श्रीसुब्रह्मण्याय नमः
    । यज्ञोपवीतं समर्पयामि ॥ गन्धम् कस्तूरीकुङ्कुमाद्यैश्च वासितं सहिमोदकम् । गन्धं विलेपनार्थाय गृहाण
    क्रौञ्चदारण ॥ ॐ श्रीसुब्रह्मण्याय नमः । गन्धं समर्पयामि ॥ अर्चन अक्षतान् धवलान् दिव्यान् पुष्पाणि
    च सुगन्धीनि । भक्त्या दत्तानि गृह्यन्तां सर्वदेवाः प्रसीदत ॥ अङ्ग पूजा ॐ सुरवन्दितपादाय नमः पादौ पूजयामि
    । ॐ मुकुराकारजानवे नमः जानुनी पूजयामि । ॐ करिराजकरोरवे नमः ऊरू पूजयामि । ॐ रत्नकिङ्किणिकायुक्तकटये
    नमः कटिं पूजयामि । ॐ गुहाय नमः गुह्यं पूजयामि । ॐ हेरम्बसहोदराय नमः उदरं पूजयामि । ॐ सुनाभये नमः नाभिं
    पूजयामि । ॐ सुहृदे नमः हृदयं पूजयामि । ॐ विशालवक्षसे नमः वक्षःस्थलं पूजयामि । ॐ शक्तिधराय नमः बाहू
    पूजयामि । ॐ षण्मुखाय नमः मुखं पूजयामि । ॐ फालनेत्रसुताय नमः नेत्रे पूजयामि । ॐ शिखिवाहनाय नमः शिरः
    पूजयामि । ॐ वल्लीदेवसेनासमेताय नमः सर्वाण्यङ्गानि पूजयामि ॥ सुब्रह्मण्य अष्टोत्तर शत नामावली अथवा
    सुब्रह्मण्य नामावली पठनम् ॥ ॐ श्रीसुब्रह्मण्याय नमः । अष्टोत्तर शत नामावली पूजां समर्पयामि । अक्षतान्
    पुष्पाणि च समर्पयामि ॥ धूपम् दशाङ्गं गुग्गुलूपेतं सुगन्धं सुमनोहरम् । कपिलाघृत संयुक्तं धूपं गृह्णीष्व
    षण्मुख ॥ ॐ श्रीसुब्रह्मण्याय नमः । धूपमाघ्रापयामि ॥ दीपम् साज्यं त्रिवर्ति संयुक्तं वह्निना योजितं
    प्रियम् । दीपं गृहाण स्कन्देश त्रैलोक्य तिमिरापहम् ॥ ॐ श्रीसुब्रह्मण्याय नमः । दीपं दर्शयामि ॥ नैवेद्यम्
    लेह्यं चोष्यं च भोज्यं च पानीयं षड्रसान्वितम् । भक्ष्यशाकादि संयुक्तं नैवेद्यं स्कन्द गृह्यताम् ॥
    ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो नः॑ प्रचो॒दया त् ॥ सत्यं
    त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि । ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्यानाय
    स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये मध्ये पानीयं समर्पयामि । अमृतापिधानमसि । उत्तरापोशनं
    समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि । शुद्धाचमनीयं समर्पयामि ॥ ॐ श्रीसुब्रह्मण्याय
    नमः । नैवेद्यं समर्पयामि ॥ ताम्बूलम् पूगीफलश्च कर्पूरैः नागवल्लीदलैर्युतम् । मुक्ताचूर्ण संयुक्तं
    ताम्बूलं प्रतिगृह्यताम् ॥ ॐ श्रीसुब्रह्मण्याय नमः । ताम्बूलं समर्पयामि ॥ नीराजनम् नानादीपसमायुक्तं
    नीराजनं मनोहरम् । अज्ञान तिमिर ध्वंसि गृह्यतां भक्तिपूर्वकम् ॥ ॐ श्रीसुब्रह्मण्याय नमः । नीराजनं समर्पयामि
    ॥ मन्त्रपुष्पम् यो॑ न्भ॑वति । च॒न्द्रमा॒ वा अ॒पा वेँद॑ ॥ ॐ श्रीसुब्रह्मण्याय नमः । मन्त्रपुष्पं समर्पयामि
    ॥ प्रदक्षिणम् यानि कानि च पापानि जन्मान्तर कृतानि च । तानि तानि प्रणश्यन्ति प्रदक्षिण पदे पदे ॥ पापोऽहं
    पापकर्माऽहं पापात्मा पापसम्भव । त्राहि मां कृपया देव शरणागतवत्सल ॥ अन्यथा शरणं नास्ति त्वमेव शरणं
    मम । तस्मात्कारुण्य भावेन रक्ष रक्ष सुरेश्वर ॥ ॐ श्रीसुब्रह्मण्याय नमः । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ नमस्कारः उरसा शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्यां कराभ्यां कर्णाभ्यां प्रणामोऽष्टाङ्ग उच्यते
    ॥ ॐ श्रीसुब्रह्मण्याय नमः । नमस्कारान् समर्पयामि ॥ सर्वोपचाराः ॐ श्रीसुब्रह्मण्याय नमः । छत्रं समर्पयामि
    । चामरं समर्पयामि । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त राजोपचारान् देवोपचारान् समर्पयामि ॥ स्तोत्र
    पठनम् श्री सुब्रह्मण्य हृदय स्तोत्रम् सुब्रह्मण्य पञ्चरत्न स्तोत्रम् क्षमाप्रार्थना मन्त्रहीनं क्रियाहीनं
    भक्तिहीनं सुब्रह्मण्य । यत्पूजितं मया देव परिपूर्णं तदस्तु ते ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना
    वा प्रकृतेः स्वभावात् । करोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ अनया ध्यान षोडशोपचार पूजया
    श्रीसुब्रह्मण्य स्वामी सुप्रीतः सुप्रसन्नः वरदो भवतु ॥ उद्वासनम् ॐ श्रीसुब्रह्मण्याय नमः । यथास्थानं
    उद्वासयामि । शोभनार्थे क्षेमाय पुनरागमनाय च ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं
    देवता पादोदकं शुभम् ॥ श्रीसुब्रह्मण्य स्वामि प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
    ॐ तत्सत् ब्रह्मार्पणमस्तु ॥
