id: venkateshastotramshridharasvami
category: stotram
name:
  english: venkateshastotramshridharasvami
  devanagari: वेन्कटेशस्तोत्रम्श्रीधरस्वामी
content:
  english: no shrutim no smritim ca | bhaktirjnanam napi yogastaposti dehi tvam me darshanam venkatesha
    || 1|| naham yace bhogasaukhyam dayalo duhkha sarvam janmana jayate yat | janeham tvam jnanadam mokshadam
    ca dehi tvam me darshanam venkatesha || 2|| dehoshudhdo mutravishthadirupah gramyam saukhyam kashmalam
    duhkharupam | na striputrakshetravittani yace dehi tvam me darshanam venkatesha || 3|| tvadrupesminnadvaye
    citsvarupe pumstri vishvam janmamrityurmano me | mayavidya napi tatkaryamishat dehi tvam me darshanam
    venkatesha || 4|| nayam deho nendriyam nantarangam nayam loko bhati saukhyaya medya | tvattonyo no
    tarako dinabandho dehi tvam me darshanam venkatesha || 5|| janeham tvam brahmarupam hyakayam mayavidyashunyamadvaitarupam
    | bhaktanam yatpalane rupadhriktvam dehi tvam me darshanam venkatesha || 6|| tvatsaukhyam bho nityashudhdabhayam
    yat mayavidyajanmakarmadirupam | praptum shakyam kim bhavetvam vinato dehi tvam me darshanam venkatesha
    || 7|| shrutya yuktya matsarupam tvameva jnatvapiyam badhate kapi shanka | mayauddhatyam varanayaihi
    shighram dehi tvam me darshanam venkatesha || 8|| dino'ham tvam prarthaye bhaktito'tra no'pekshasva
    svena rupena pahi | mayavidyavishvajiveshashantyai dehi tvam me darshanam venkatesha || 9||
  devanagari: नो श्रुतिं नो स्मृतिं च । भक्तिर्ज्ञानं नापि योगस्तपोस्ति देहि त्वं मे दर्शनं वेङ्कटेश ॥
    १॥ नाहं याचे भोगसौख्यं दयालो दुःख सर्वं जन्मना जायते यत् । जानेहं त्वां ज्ञानदं मोक्षदं च देहि त्वं
    मे दर्शनं वेङ्कटेश ॥ २॥ देहोशुध्दो मूत्रविष्ठादिरूपः ग्राम्यं सौख्यं कश्मलं दुःखरूपम् । न स्त्रीपुत्रक्षेत्रवित्तानि
    याचे देहि त्वं मे दर्शनं वेङ्कटेश ॥ ३॥ त्वद्रूपेस्मिन्नद्वये चित्स्वरूपे पुंस्त्री विश्वं जन्ममृत्युर्मनो
    मे । मायाविद्या नापि तत्कार्यमीषत् देहि त्वं मे दर्शनं वेङ्कटेश ॥ ४॥ नायं देहो नेन्द्रियं नान्तरङ्गं
    नायं लोको भाति सौख्याय मेद्य । त्वत्तोन्यो नो तारको दीनबन्धो देहि त्वं मे दर्शनं वेङ्कटेश ॥ ५॥ जानेहं
    त्वां ब्रह्मरूपं ह्यकायं मायाविद्याशून्यमद्वैतरूपम् । भक्तानां यत्पालने रूपधृक्त्वं देहि त्वं मे दर्शनं
    वेङ्कटेश ॥ ६॥ त्वत्सौख्यं भो नित्यशुध्दाभयं यत् मायाविद्याजन्मकर्मादिरूपम् । प्राप्तुं शक्यं किं भवेत्वां
    विनातो देहि त्वं मे दर्शनं वेङ्कटेश ॥ ७॥ श्रुत्या युक्त्या मत्सरूपं त्वमेव ज्ञात्वापीयं बाधते कापि
    शङ्का । मायौद्धत्यं वारणायैहि शीघ्रं देहि त्वं मे दर्शनं वेङ्कटेश ॥ ८॥ दीनोऽहं त्वां प्रार्थये भक्तितोऽत्र
    नोऽपेक्षस्व स्वेन रूपेण पाहि । मायाविद्याविश्वजीवेशशान्त्यै देहि त्वं मे दर्शनं वेङ्कटेश ॥ ९॥
