id: gajendramokshah
category: stotram
name:
  english: gajendramokshah
  devanagari: गजेन्द्रमोक्षः
content:
  english: shrimadbhagavate ashtamaskamdhe parikshita maharajanam shri shukamunih upadeshita gajemdramoksha
    stotramidam shri shuka uvaca evam vyavasito buddhya samadhaya mano hridi
  devanagari: श्रीमद्भागवते अष्टमस्कंधे परीक्षित महाराजानां श्री शुकमुनिः उपदेशित गजेंद्रमोक्ष स्तोत्रमिदं
    श्री शुक उवाच एवं व्यवसितो बुद्ध्या समाधाय मनो हृदि
meaning: {}
