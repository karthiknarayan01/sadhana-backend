id: annamayya-keerthanas-vedukondaamaa
category: stotram
name:
  english: Annamayya Keerthanas Vedukondaamaa
content:
  english: vedukòndama venkatagiri venkateshvaruni || amati mròkkula vadè adidevude vadu | tomani palyalavadè
    durita durude || vaddikasula vadè vanajanabhude puttu | gòddurandraku biddalicce govindude || èlimi
    gorina varalicce devude vadu | alamelmanga shrivenkatadri nathude ||
  devanagari: वेडुकॊन्दामा वेङ्कटगिरि वेङ्कटेश्वरुनि ॥ आमटि म्रॊक्कुल वाडॆ आदिदेवुडे वाडु । तोमनि पल्यालवाडॆ
    दुरित दूरुडे ॥ वड्डिकासुल वाडॆ वनजनाभुडे पुट्टु । गॊड्डुराण्ड्रकु बिड्डलिच्चे गोविन्दुडे ॥ ऎलिमि गोरिन
    वरालिच्चे देवुडे वाडु । अलमेल्मङ्गा श्रीवेङ्कटाद्रि नाथुडे ॥
meaning: {}
