id: narayanakritamvishnustotram
category: stotram
name:
  english: narayanakritamvishnustotram
  devanagari: नारायणकृतंविष्णुस्तोत्रम्
content:
  english: narayanakritam vishnustotram shrinarayana uvaca | namah parasmai devaya bhumne shaktitrayaya
    ca | sakshine dehinam madhye'nupalakshyatmavartmane || 1|| namo bhuyah satam goptre'satam nashaptabhutaye
    | namo nirastasamya'tishayaya dhamni ramsyate || 2|| kuyoginam viduraya sannikrishtaya te namah |
    narayanapara veda narayanapara makhah || 3|| narayanaparam jnanam srijirnarayanatmika | narayana idam
    sarvam narayanapara gatih || 4|| iti shrilakshminarayaniyasamhitayam prathame kritasantanakhande ashtamadhyayantargatam
    narayanakritam vishnustotram sampurnam | lakshminarayaniyasamhita | khanda 1| adhyaya 8
  devanagari: नारायणकृतं विष्णुस्तोत्रम् श्रीनारायण उवाच । नमः परस्मै देवाय भूम्ने शक्तित्रयाय च । साक्षिणे
    देहिनां मध्येऽनुपलक्ष्यात्मवर्त्मने ॥ १॥ नमो भूयः सतां गोप्त्रेऽसतां नाशाप्तभूतये । नमो निरस्तसाम्याऽतिशयाय
    धाम्नि रंस्यते ॥ २॥ कुयोगिनां विदूराय सन्निकृष्टाय ते नमः । नारायणपरा वेदा नारायणपरा मखाः ॥ ३॥ नारायणपरं
    ज्ञानं सृजिर्नारायणात्मिका । नारायण इदं सर्वं नारायणपरा गतिः ॥ ४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतसन्तानखण्डे अष्टमाध्यायान्तर्गतं नारायणकृतं विष्णुस्तोत्रं सम्पूर्णम् । लक्ष्मीनारायणीयसंहिता
    । खण्ड १। अध्याय ८
meaning: {}
