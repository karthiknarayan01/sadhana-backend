id: bhadrakalikavacam
category: kavacha
name:
  english: bhadrakalikavacam
  devanagari: भद्रकालीकवचम्
content:
  english: rinu vakshyami viprendra kavacam paramadbhutam | narayanena yaddattam kripaya shuline pura
    || 7|| tripurasya vadhe ghore shivasya vijayaya ca | tadeva shulina dattam pura durvasase mune ||
    8|| durvasasa ca yaddattam sucandraya mahatmane | atiguhyataram tattvam sarvamantraughavigraham ||
    9|| om hrim shrim klim kalikayai svaha me patu mastakam | klim kapalam sada patu hrim hrim hrimiti
    locane || 10|| om hrim trilocane svaha nasikam me sada'vatu | klim kalike raksha raksha svaha dantan
    sada'vatu || 11|| klim bhadrakalike svaha patu me'dharayugmakam | om hrim hrim klim kalikayai svaha
    kantham sada'vatu || 12|| om hrim kalikayai svaha karnayugmam sada'vatu | om krim krim klim kalyai
    svaha skandham patu sada mama || 13|| om krim bhadrakalyai svaha mama vakshah sada'vatu | om klim
    kalikayai svaha mama nabhim sada'vatu || 14|| om hrim kalikayai svaha mama prishtham sada'vatu | raktabijavinashinyai
    svaha hastau sada'vatu || 15|| om hrim klim mundamalinyai svaha padau sada'vatu | om hrim camundayai
    svaha sarvangam me sada'vatu || 16|| pracyam patu mahakali cagneyyam raktadantika | dakshine patu
    camunda nairrityam patu kalika || 17|| shyama ca varune patu vayavyam patu candika | uttare vikatasya
    capyaishanyam sattahasini || 18|| paturdhvam lolajihva sa mayadya patvadhah sada | jale sthale cantarikshe
    patu vishvaprasuh sada || 19|| iti te kathitam vatsa sarvamantraughavigraham | sarvesham kavacanam
    ca sarabhutam paratparam || 20|| saptadvipeshvaro raja sucandro'sya prasadatah | kavacasya prasadena
    mandhata prithivipatih || 21|| praceta lomashashcaiva yatah siddho babhuva ha | yato hi yoginam shreshthah
    saubharih pippalayanah || 22|| yadi syat siddhakavacah sarvasiddhishvaro bhavet | mahadanani sarvani
    tapamsyevam vratani ca | nishcitam kavacasyasya kalam narhanti shodashim || 23|| idam kavacamajnatva
    bhajetkalim jagatprasum | shatalaksham prajapto'pi na mantrah siddhidayakah || 24|| || iti shribrahmavaivartamahapurane
    ganapatikhande naradanarayanasamvade bhadrakalikavacanirupanam nama saptatrimsho'dhyayah || 37||
  devanagari: ृणु वक्ष्यामि विप्रेन्द्र कवचं परमाद्भुतम् । नारायणेन यद्दत्तं कृपया शूलिने पुरा ॥ ७॥ त्रिपुरस्य
    वधे घोरे शिवस्य विजयाय च । तदेव शूलिना दत्तं पुरा दुर्वाससे मुने ॥ ८॥ दुर्वाससा च यद्दत्तं सुचन्द्राय
    महात्मने । अतिगुह्यतरं तत्त्वं सर्वमन्त्रौघविग्रहम् ॥ ९॥ ॐ ह्रीं श्रीं क्लीं कालिकायै स्वाहा मे पातु
    मस्तकम् । क्लीं कपालं सदा पातु ह्रीं ह्रीं ह्रीमिति लोचने ॥ १०॥ ॐ ह्रीं त्रिलोचने स्वाहा नासिकां मे
    सदाऽवतु । क्लीं कालिके रक्ष रक्ष स्वाहा दन्तान् सदाऽवतु ॥ ११॥ क्लीं भद्रकालिके स्वाहा पातु मेऽधरयुग्मकम्
    । ॐ ह्रीं ह्रीं क्लीं कालिकायै स्वाहा कण्ठं सदाऽवतु ॥ १२॥ ॐ ह्रीं कालिकायै स्वाहा कर्णयुग्मं सदाऽवतु
    । ॐ क्रीं क्रीं क्लीं काल्यै स्वाहा स्कन्धं पातु सदा मम ॥ १३॥ ॐ क्रीं भद्रकाल्यै स्वाहा मम वक्षः सदाऽवतु
    । ॐ क्लीं कालिकायै स्वाहा मम नाभिं सदाऽवतु ॥ १४॥ ॐ ह्रीं कालिकायै स्वाहा मम पृष्ठं सदाऽवतु । रक्तबीजविनाशिन्यै
    स्वाहा हस्तौ सदाऽवतु ॥ १५॥ ॐ ह्रीं क्लीं मुण्डमालिन्यै स्वाहा पादौ सदाऽवतु । ॐ ह्रीं चामुण्डायै स्वाहा
    सर्वाङ्गं मे सदाऽवतु ॥ १६॥ प्राच्यां पातु महाकाली चाग्नेय्यां रक्तदन्तिका । दक्षिणे पातु चामुण्डा
    नैरृत्यां पातु कालिका ॥ १७॥ श्यामा च वारुणे पातु वायव्यां पातु चण्डिका । उत्तरे विकटास्या चाप्यैशान्यां
    साट्टहासिनी ॥ १८॥ पातूर्ध्वं लोलजिह्वा सा मायाद्या पात्वधः सदा । जले स्थले चान्तरिक्षे पातु विश्वप्रसूः
    सदा ॥ १९॥ इति ते कथितं वत्स सर्वमन्त्रौघविग्रहम् । सर्वेषां कवचानां च सारभूतं परात्परम् ॥ २०॥ सप्तद्वीपेश्वरो
    राजा सुचन्द्रोऽस्य प्रसादतः । कवचस्य प्रसादेन मान्धाता पृथिवीपतिः ॥ २१॥ प्रचेता लोमशश्चैव यतः सिद्धो
    बभूव ह । यतो हि योगिनां श्रेष्ठः सौभरिः पिप्पलायनः ॥ २२॥ यदि स्यात् सिद्धकवचः सर्वसिद्धीश्वरो भवेत्
    । महादानानि सर्वाणि तपांस्येवं व्रतानि च । निश्चितं कवचस्यास्य कलां नार्हन्ति षोडशीम् ॥ २३॥ इदं कवचमज्ञात्वा
    भजेत्कालीं जगत्प्रसूम् । शतलक्षं प्रजप्तोऽपि न मन्त्रः सिद्धिदायकः ॥ २४॥ ॥ इति श्रीब्रह्मवैवर्तमहापुराणे
    गणपतिखण्डे नारदनारायणसंवादे भद्रकालीकवचनिरूपणं नाम सप्तत्रिंशोऽध्यायः ॥ ३७॥
