id: sankatasahasranamastotram
category: sahasranama
name:
  english: sankatasahasranamastotram
  devanagari: सन्कटासहस्रनामस्तोत्रम्
content:
  english: shadvaktrarajini vira shatsurankanivasini | shadamnaya shadindrani shatpuri ca shadanana ||
    13|| soma pathendriya vagmi shadrupa ca shadindriya | shadadhara ca shadvarna shatpuravasini shada
    || 14|| shanda bhagirathi caiva shadshmashananivasini | shmashanasadhini mata shmashanarajini vara
    || 15|| shmashanaugini kauli shmashanamadhyamodini | shridevi shrikari shri ca shrividya parameshvari
    || 16|| shrim hrim krim shrimahakali shrimatih shribhageshvari | shrikrishna shrimati shriman shripura
    medyamedura || 17|| shrim klim kutadashakhya ca shraddhadevaprapujita | shriyogi shripriya shrishca
    shreya shripatisiddhida || 18|| shridurga shrigunamayi shrotrini shrotravasini | shrikali shrikamini
    ca shripatiparipalini || 19|| shvetakeshi shvetavarna shvetacihnavinashini | shvetacandanaliptangi
    shvetavasah pinakini || 20|| shvetangi shvetapadmakhya smrita madhurabhashini | shrimukhi shrisunirvani
    om hrim shrim sankate svaha || 21|| shvetamuktasuvarnabha shuddhakarma shubhankari | kshemankari shubha
    vaca shitala shitaleshvari || 22|| shrimangala mangalakrit shrimukhya sankateshvari | ham sam am hram
    stram shrim shrum shraim shrah sankate svaha || 23|| shuklavastra shukrapujya shukrashonitashoshini
    | shrimaya hrim mahadevi shubha'shubhaphalaprada || 24|| shankari shambhavi sauri svarnamala vishobhini
    | shavasini shaveshani shavapithanivasini || 25|| shabari shambari gauri suvaragravirajini | vasuki
    nagamala ca vankara shivakamini || 26|| vasudevi vamacari vameshvari maheshvari | lavali lalini lali
    lakshmirlakshanalakshita || 27|| lila laksham tu lokeshi lomaraji janeshvari | lomakupa bhanumati
    lolarkanayana para || 28|| lokeshi lokanari ca lokashokavimardini | lavali lalajihva ca lalita ca
    lalanana || 29|| lilavati lalita ca lohini lokapalini | lohitaksha lohakara lokashatruvinashini ||
    30|| lokasakshi lokadhari liladaityavinashini | lobhadatri lobhamatirlinga
  devanagari: षड्वक्त्रराजिनी वीरा षट्सुरङ्कनिवासिनी । षडाम्नाया षडिन्द्राणी षट्पुरी च षडानना ॥ १३॥ सोमा
    पाठेन्द्रिया वाग्मी षड्रूपा च षडिन्द्रिया । षडाधारा च षड्वर्णा षट्पुरवासिनी षडा ॥ १४॥ षण्डा भागीरथी
    चैव षड्श्मशाननिवासिनी । श्मशानसाधिनी माता श्मशानराजिनी वरा ॥ १५॥ श्मशानऊगिनी कौली श्मशानमध्यमोदिनी
    । श्रीदेवी श्रीकरी श्री च श्रीविद्या परमेश्वरी ॥ १६॥ श्रीं ह्रीं क्रीं श्रीमहाकाली श्रीमतिः श्रीभगेश्वरी
    । श्रीकृष्णा श्रीमती श्रीमान् श्रीपुरा मेद्यमेदुरा ॥ १७॥ श्रीं क्लीं कूटदशाख्या च श्राद्धदेवप्रपूजिता
    । श्रीयोगी श्रीप्रिया श्रीश्च श्रेया श्रीपतिसिद्धिदा ॥ १८॥ श्रीदुर्गा श्रीगुणमयी श्रोत्रिणी श्रोत्रवासिनी
    । श्रीकाली श्रीकामिनी च श्रीपतिपरिपालिनी ॥ १९॥ श्वेतकेशी श्वेतवर्णा श्वेतचिह्नविनाशिनी । श्वेतचन्दनलिप्ताङ्गी
    श्वेतवासाः पिनाकिनी ॥ २०॥ श्वेताङ्गी श्वेतपद्माख्या स्मृता मधुरभाषिणी । श्रीमुखी श्रीसुनिर्वाणी ॐ
    ह्रीं श्रीं सङ्कटे स्वाहा ॥ २१॥ श्वेतमुक्तसुवर्णाभा शुद्धकर्मा शुभङ्करी । क्षेमङ्करी शुभा वाचा शीतला
    शीतलेश्वरी ॥ २२॥ श्रीमङ्गला मङ्गलकृत् श्रीमुख्या सङ्कटेश्वरी । हं सं आं ह्रां स्त्रां ष्रीं ष्रूं
    ष्रैं ष्रः सङ्कटे स्वाहा ॥ २३॥ शुक्लवस्त्रा शुक्रपूज्या शुक्रशोणितशोषिणी । श्रीमाया ह्रीं महादेवी
    शुभाऽशुभफलप्रदा ॥ २४॥ शङ्करी शाम्भवी सौरी स्वर्णमाला विशोभिनी । शवासिनी शवेशानी शवपीठनिवासिनी ॥ २५॥
    शबरी शाम्बरी गौरी सुवराग्रविराजिनी । वासुकी नागमाला च वङ्कारा शिवकामिनी ॥ २६॥ वासुदेवी वामचारी वामेश्वरी
    महेश्वरी । लवली लालिनी लाली लक्ष्मीर्लक्षणलक्षिता ॥ २७॥ लीला लक्षं तु लोकेशी लोमराजी जनेश्वरी । लोमकूपा
    भानुमती लोलार्कनयना परा ॥ २८॥ लोकेशी लोकनारी च लोकशोकविमर्दिनी । लावली ललजिह्वा च ललिता च ललानना ॥
    २९॥ लीलावती लालिता च लोहिनी लोकपालिनी । लोहिताक्षा लोहकारा लोकशत्रुविनाशिनी ॥ ३०॥ लोकसाक्षी लोकधरी
    लीलादैत्यविनाशिनी । लोभदात्री लोभमतिर्लिङ्ग
