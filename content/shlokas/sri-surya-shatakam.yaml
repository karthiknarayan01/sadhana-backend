id: sri-surya-shatakam
category: stotram
name:
  english: Sri Surya Shatakam
content:
  english: '|| suryashatakam || mahakavishrimayurapranitam || shri ganeshaya namah || jambharatibhakumbhodbhavamiva
    dadhatah sandrasindurarenum raktah sikta ivaughairudayagiritatidhatudharadravasya | var saktaih ayantya
    tulyakalam kamalavanarucevaruna vo vibhutyai bhuyasurbhasayanto bhuvanamabhinava bhanavo bhanaviyah
    || || bhaktiprahvaya datum mukulaputakutikotarakrodalinam lakshmimakrashtukama iva kamalavanoddhatanam
    kurvate ye | kalakarandhakarananapatitajagatsadhvasadhvamsakalyah kalyanam vah kriyasuh kisalayarucayaste
    kara bhaskarasya || || garbheshvambhoruhanam shikharishu ca shitagreshu tulyam patantah prarambhe
    vasarasya vyuparatisamaye caikarupastathaiva | nishparyayam pravrittastribhuvanabhavanaprangane pantu
    yushma nushmanam santatadhvashramajamiva bhrisham bibhrato bradhnapadah || || prabhrashyatyuttariyatvishi
    tamasi samuddikshya vitavritinpra gjantumstantunyatha yanatanu vitanute tigmarocirmaricin | te sandribhuya
    sadyah kramavishadadashashadashalivishalam shashvatsampadayanto''mbaramamalamalam mangalam vo dishantu
    || || nyakkurvannoshadhishe mushitaruci shucevaushadhih proshitabha bhasvadgravodgatena prathamamiva
    kritabhyudgatih pavakena | pakshacchedavranasriksruta iva drishado darshayanprataradre ratamrastivrabhanoranabhimatanude
    stadgabhastyudgamo vah || || shirnaghrananghripaninvranibhirapaghanairghargharavyaktaghoshan dirghaghratanaghaughai
    punarapi ghatayatyeka ullaghayan yah | gharmamshostasya vo''ntardvigunaghanaghrinanighnanirvighnavritte
    rdattarghah siddhasanghairvidadhatu ghrinayah shighramamhovidhatam || || bibhrana vamanatvam prathamamatha
    tathaivamshavah pramshavo vah krantakashantaralastadanu dashadishah purayantastato''pi | dhvantadacchidya
    devadvisha iva balito vishvamashvashnuvanah var devadruha kricchranyucchrayahelopahasitaharayo haridashva
    harantu || || udgadhenarunimna vidadhati bahulam ye''runasyarunatvam murdhoddhutau khalinakshatarudhiraruco
    ye rathashvananeshu | shailanam shekharatvam shritashikharishikhastanvate ye dishantu var shikharashikhah
    prenkhantah khe kharamshoh khacitadinamukhaste mayukhah sukham vah || || dattanandah prajanam samucitasamayakrishtasrishtaih
    payobhih var aklishtasrishtaih purvahne viprakirna dishi dishi viramatyahni samharabhajah | diptamshordirghaduhkhaprabhavabhavabhayodanvaduttaranavo
    gavo vah pavananam paramaparimitam pritimutpadayantu || || bandhadhvamsaikahetum shirasi natirasabaddhasandhyanjalinam
    lokanam ye prabodham vidadhati vipulambhojakhandashayeva | yushmakam te svacittaprathitaprithutaraprarthanakalpavrikshah
    var prathima kalpantam nirvikalpam dinakarakiranah ketavah kalmashasya || || dhara rayo dhanayapadi
    sapadi karalambabhutah prapate tattvalokaikadipastridashapatipuraprasthitau vithya eva | nirvanodyogiyogipragamanijatanudvari
    vetrayamana strayantam tivrabhanordivasamukhasukha rashmayah kalmashadvah || || var tivrabhasah var
    kashmaladvah praci pragacarantyo''naticiramacale carucudamanitvam muncantyo rocanambhah pracuramiva
    dishamuccakaishcarcanaya | catutkaishcakranamnam caturamavicalairlocanairarcyamana var suciram shceshtantam
    cintitanamucitamacaramashcandarociruco vah || || ekam jyotirdrishau dve trijagati gaditanyabjajasyaishcaturbhi
    rbhutanam pancamam yanyalamritushu tatha shatsu nanavidhani | yushmakam tani saptatridashamuninutanyashtadigbhanji
    bhano ryanti prahne navatvam dasha dadhatu shivam didhitinam shatani || || var dadatu avrittibhrantavishvah
    shramamiva dadhatah shoshinah svoshmaneva grishme davagnitapta iva rasamasakridye dharitrya dhayanti
    | te pravrishyattapanatishayaruja ivodvantatoya himartau martandasyapracandashciramashubhabhide''bhishavo
    vo bhavantu || || tanvana digvadhunam samadhikamadhuralokaramyamavastha marudhapraudhileshotkalitakapilimalankritih
    kevalaiva | ujjrimbhambhojanetradyutini dinamukhe kincidudbhidyamana shmashrushreniva bhasam dishatu
    dashashati sharma gharmatvisho vah || || maulindormaisha moshiddyutimiti vrishabhankena yah shankineva
    pratyagrodghatitambhoruhakuharaguhasusthiteneva dhatra | krishnena dhvantakrishnasvatanuparibhavatrasnuneva
    stuto''lam tranaya stattaniyanapi timiraripoh sa tvishamudgamo vah || || vistirnam vyoma dirghah sapadi
    dasha disho vyastavelambhaso''bdhin kurvadbhirdrishyanananaganagaranagabhogaprithvim ca prithvim |
    padminyucchvasyate yairushasi jagadapi dhvamsayitva tamisra musra visramsayantu drutamanabhimatam
    te sahasratvisho vah || || var visravayantu astavyastatvashunyo nijaruciranishanashvarah kartumisho
    vishvam veshmeva dipah pratihatatimiram yah pradeshasthito''pi | dikkalapekshayasau tribhuvanamatatastigmabhanornavakhyam
    yatah shatakratavyam dishi dishatu shivam so''rcishamudgamo vah || || maganmlanim mrinali mriduriti
    dayayevapravishto''hilokam lokalokasya parshvam pratapati na param yastadakhyarthameva | urdhvam brahmandakhandasphutanabhayaparityaktadairghyo
    dyusimni svechavashyavakashavadhiravatu sa vastapano rociroghah || || ashyamah kala eko na bhavati
    bhuvananto''pi vite''ndhakare var vitandhakarah sadyah praleyapado na vilayamacalashcandrama apyupaiti
    | bandhah siddhanjalinam na hi kumudavanasyapi yatrojjihane tatpratah prekshaniyam dishatu dinapaterdhama
    kamadhikam vah || || yatkantim pankajanam na harati kurute pratyutadhikyaramyam var pratyutativa ramyam
    no dhatte tarakabham tirayati nitaramashu yannityameva | var nadhatte kartum nalam nimesham divasamapi
    param yattadekam trilokya shcakshuh samanyacakshurvisadrishamaghabhidbhasvatastanmaho vah || || kshmam
    kshepiyah kshapambhahshishiratarajalasparshatarshadriteva dragasha netumashadviradakarasarahpushkaraniva
    bodham | pratah prollanghya vishnoh padamapi ghrinayevativegaddaviya syuddama dyotamana dahatu dinapaterdurnimittam
    dyutirvah || || no kalpapayavayoradayarayadalatkshmadharasyapi gamya var shamya gadhodgirnojjvalashrirahani
    na rahita no tamahkajjalena | praptotpattih patanganna punarupagata moshamushnatvisho vo vartih saivanyarupa
    sukhayatu nikhiladvipadipasya diptih || || nihsheshashavapurapravanagurugunashlaghaniyasvarupa paryaptam
    nodayadau dinagamasamayopaplave''pyunnataiva | atyantam yanabhijna kshanamapi tamasa sakamekatra vastum
    bradhnasyeddha rucirvo ruciriva rucitasyaptaye vastunostu || rucirasya vibhranah shaktimashu prashamitabalavattarakaurjityagurvim
    kurvano lilayadhah shikhinamapi lasaccandrakantavabhasam | adadhyadandhakare ratimatishayinimavahanvikshananam
    var adeyadikshananam balo lakshmimaparamapara iva guho''harpateratapo vah || || jyotsnamshakarshapandudyuti
    timiramashisheshakalmashamisha jjrimbhodbhutena pingam sarasijarajasa sandhyaya shonashocih | pratahprarambhakale
    sakalamapi jagaccitramunmilayanti kantistikshnatvisho''kshnam mudamupanayatattulikevatulam vah ||
    || ayanti kim sumeroh saranirarunita padmaragaih paragai rahosvitsvasya maharajanaviracita vaijayanti
    rathasya | manjishthi prashthavahavalividhutashirashcamarali nu lokai var camaraliva rashankyalokitaivam
    savituraghanude statprabhataprabha vah || || dhvantadhvamsam vidhatte na tapati rucimannatirupam vyanakti
    nyaktvam nitvapi naktam na vitaratitaram tavadahnastvisham yah | var nyaktamahni sa pratarma viramsidasakalapatima
    purayanyushmadasha mashakashavakashavataranatarunaprakramo''rkaprakashah || || tivram nirvanaheturyadapi
    ca vipulam yatprakarshena canu pratyaksham yatparoksham yadiha yadaparam nashvaram shashvatam ca |
    yatsarvasya prasiddham jagati katipaye yogino yadvidanti jyotistaddviprakaram savituravatu vo bahyamabhyantaram
    ca || || ratnanam mandanaya prabhavati niyatoddeshalabdhavakasham vahnerdarvadi dagdhum nijajadimataya
    kartumanandamindoh | yacca trailokyabhushavidhiraghadahanam hladi vrishtyashu tadvo var yattu bahulyotpadyakaryadhikataramavatadekamevarkatejah
    || || milaccakshurvijihmashruti jadarasanam nighnitaghranavritti svavyaparakshamatvakparimushitamanah
    shvasamatravashesham | visrastangam patitva svapadapaharatadashriyam vo''rkajanma var apriyam kalavyalavalidham
    jagadagada ivotthapayanprakpratapah || || nihshesham naishamambhah prasabhamapanudannashruleshanukari
    stokastokapanitarunaruciraciradastadoshanushangah | data drishtim prasannam tribhuvananayanasyashu
    yushmadviruddham vadhyadbradhnasya siddhanjanavidhiraparah praktano''rcihpracarah || || bhutva jambhasya
    bhettuh kakubhi paribhavarambhabhuh shubhrabhano var sthitva rbibhrana babhrubhavam prasabhamabhinavambhojajrimbhapragalbha
    | bhusha bhuyishthashobha tribhuvanabhavanasyasya vaibhakari prag vibhranta bhrajamana vibhavatu vibhavodbhutaye
    sa vibha vah || vibhranti samsaktam siktamuladabhinavabhuvanodyanakautuhalinya yaminya kanyayevamritakarakalashavarjitenamritena
    | arkalokah kriyadvo mudamudayashirashcakravalalavala dudyanbalapravalapratimarucirahahpadapaprakprarohah
    || || bhinnam bhasarunasya kvacidabhinavaya vidrumanam tvisheva tvannnakshatraratnadyutinikarakaralantaralam
    kvacicca | nantarnihsheshakrishnashriyamudadhimiva dhvantarashim pibansta daurvah purvo''pyapurvo''gniriva
    bhavadaghaplushtaye''rkavabhasah || || gandharvairgadyapadyavyatikaritavacohridyamatodyavadyai radyairyo
    naradadyairmunibhirabhinuto vedavedyairvibhidya | var vitavedyairvividya vedavidbhirvibhidya asadyapadyate
    yam punarapi ca jagadyauvanam sadya udya nnuddyoto dyotitadyaurdyatu divasakrito''savavadyani vo''dya
    || || avanaishcandrakantaishcyutatimirataya tanavattarakana var avantaih menankalokalopadupahatamahasamoshadhinam
    layena | aradutprekshyamana kshanamudayatatantarhitasyahimamsho rabha prabhatiki vo''vatu na tu nitaram
    tavadavirbhavanti || || sanau sa naudaye narunitadalapunaryauvananam vanana var lasadyauvananam malimalidhapurva
    parihritakuharopantanimna tanimna | bha vo''bhavopashantim dishatu dinapaterbhasamana samana raji
    rajivarenoh samasamayamudetiva yasya vayasya || || ujjrimbhambhoruhanam prabhavati payasam ya shriye
    noshnatayai pushnatyalokamatram na tu dishati drisham drishyamana vidhatam | purvadrereva purvam divamanu
    ca punah pavani dinmukhana var tatah menamsyaini vibhasau nudatu nutipadaikaspadam praktani vah ||
    || vacam vacaspaterapyacalabhiducitacaryakanam prapancai rvairancanam tathoccaritacaturricam canananam
    caturnam | var rucira ucyetarcasu vacyacyutishucicaritam yasya noccairvivicya var arcasvavacya pracyam
    varcashcakasacciramupacinutattasya candarcisho vah || || var shriyam murdhnyadrerdhaturagastarushu
    kisalayo vidrumaughah samudre var kisalayadvidrumaughatsamudre dinmatangottamangeshvabhinavanihitah
    sandrasindurarenuh | var vihitah nihitatsandrasindurarenoh simni vyomnashca hemnah surashikharibhuvo
    jayate yah prakashah shonimnasau kharamshorushasi dishatu vah sharma shobhaikadeshah || || astadrishottamange
    shritashashini tamahkalakute nipite yati vyaktim purastadarunakisalaye pratyushahparijate | udyantyaraktapitambaravishadatarodvikshita
    tikshnabhano var ruciratarodvikshita var tivrabhasah rlakshmirlakshmirivastu sphutakamalaputapashraya
    shreyase vah || || var putopashraya nodanvanjanmabhumirna tadudarabhuvo bandhavah kaustubhadya yasyah
    padmam na panau na ca narakaripurahsthali vasaveshma | tejorupaparaiva trishu bhuvanataleshvadadhana
    vyavastham var tribhuvanabhavane sa shrih shreyamsi dishyadashishiramahaso mandalagrodgata vah ||
    || || iti dyutivarnanam || var tejovarnanam || atha ashvavarnanam || rakshantvakshunnahemopalapatalamalam
    laghavadutpatantah patangah pangvavajnajitapavanajava vajinaste jaganti | yesham vitanyacihnonnayamapi
    vahatam margamakhyati mera vudyannuddamadiptirdyumanimanishilavedikajatavedah || || plushtah prishthem''shupatairatinikatataya
    dattadahatirekai rekahakrantakritsnatridivapathaprithushvasashoshah shramena | tivrodanyastvarantamahitavihataye
    saptayah saptasapte rabhyashakashagangajalasaralagalavannatagranana vah || || var galavarjitagrananah
    matvanyanparshvato''shvan sphatikatatadrishaddrishtadeha dravanti vyaste''hanyastasandhyeyamiti mridupada
    padmaragopaleshu | sadrishyadrishyamurtirmarakatakatake klishtasuta sumero rmurdhanyavrittilabdhadhruvagatiravatu
    bradhnavahavalirvah || || var druta helalolam vahanti vishadharadamanasyagrajenavakrishta svarvahinyah
    suduram janitajavajaya syandanasya syadena | nirvyajam tayamane haritimani nije sphitaphenahitashri
    var sphitaphenasmitashrih rashreyamsyashvapanktih shamayatu yamunevapara tapani vah || || margopante
    sumerornuvati kritanatau nakadhamnam nikaye vikshya vridanatanam pratikuharamukham kinnarinam mukhani
    | sute''suyatyapishajjadagati vahatam kandharardhairvaladbhi var kandharagraih rvahanam vyasyatadvah
    samamasamaharerheshitam kalmashani || || dhunvanto niradalirnijaruciharitah parshvayoh pakshatulya
    staluttanaih khalinaih khacitamukharucashcyotata lohitena | uddiyeva vrajanto viyati gativashadarkavahah
    kriyasuh kshemam hemadrihridyadrumashikharashirahshrenishakhashuka vah || || || ityashvavarnanam ||
    || atha arunavarnanam || pratah shailagrarange rajanijavanikapayasamlakshyalakshmi rvikshiptapurvapushpanjalimudunikaram
    sutradharayamanah | yameshvankeshvivahnah kritarucishu caturshveva jatapratishtha var yatah pratishtham
    mavyatprastavayanvo jagadatanamahanatikam suryasutah || || akrantya vahyamanam pashumiva harina vahako''gryo
    harinam bhramyantam pakshapatajjagati samarucih sarvakarmaikasakshi | shatrum netrashrutinamavajayati
    vayojyeshthabhave same''pi sthamnam dhamnam nidhiryah sa bhavadaghanude nutanah stadanuruh || || dattarghairduranamrairviyati
    vinayato vikshitah siddhasarthaih var siddhasadhyaih sanathyam sarathirvah sa dashashataruceh satirekam
    karotu | apiya pratareva pratatahimapayahsyandinirindubhaso yah kashthadipano''gre jadita iva bhrisham
    sevate prishthato''rkam || || muncanrashmindinadau dinagamasamaye samharamshca svatantra stotraprakhyataviryo''virataharipadakrantibaddhabhiyogah
    | var vitata kalotkarshallaghutvam prasabhamadhipatau yojayanyo dvijanam sevapritena pushnatmasama
    iva kritastrayatam so''runo vah || || var svasama shatah shyamalatayah parashuriva tamo''ranyavahnerivarcih
    var dahe davabhah pracyevagre grahitum grahakumudavanam pragudasto''grahastah | var pracivagre grahakumudarucim
    aikyam bhindandyubhumyoravadhiriva vidhateva vishvaprabodhe vahanam vo vineta vyapanayatu vipannama
    dhamadhipasya || || paurastyastoyadartoh pavana iva patatpavakasyeva dhumo var patan vishvasyevadisargah
    pranava iva param pavano vedarasheh sandhyanrityotsavecchoriva madanaripornandinandininadah saurasyagre
    sukham vo vitaratu vinatanandanah syandanasya || || var syandano vah paryaptam taptacamikarakatakatate
    shlishtashitetaramsha vasidatsyandanashvanukritimarakate padmaragayamanah | var ashvanukritamarakate
    yah sotkarsham vibhusham kuruta iva kulakshmabhridishasya mero renamsyahnaya duram gamayatu sa guruh
    kadraveyadvisho vah || || nitvashvansapta kaksha iva niyamavasham vetrakalpapratoda var kakshya sturnam
    dhvantasya rashavitarajana ivotsarite durabhaji | purvam prashtho rathasya kshitibhridadhipatindarshayamstrayatam
    va strailokyasthanadanodyatadivasapateh prakpratiharapalah || || vajrinjatam vikasikshanakamalavanam
    bhasi nabhasi vahne var no bhasi tatam natvashvaparshvannaya yama mahisham rakshasa vikshitah stha
    | saptinsinca pracetah bhaja javam vittapaveditastvam vande sharveti jalpanpratidishamadhipanpatu
    pushno''granirvah || || pashanashantapaladaruna varunato ma grahih pragrahartham trishnam krishnasya
    cakre jahihi nahi ratho yati me naikacakrah | yoktum yugyam kimuccaihshravasamabhilashasyashtamam
    vritrashatro var tvashtrashatroh styaktanyapekshavishvopakritiriva ravih shasti yam so''vatadvah ||
    || no murcchacchinnavanchah shramavivashavapurnaiva napyasyashoshi panthah pathyetarani kshapayatu
    bhavatam bhasvato''gresarah sah | yah samshritya trilokimatati patutaraistapyamano mayukhai raradaramalekhamiva
    haritamanishyamalamashvapanktim || || var haritatrina sidanto''ntarnimajjajjadakhuramusalah saikate
    nakanadyah skandantah kandaralih kanakashikharino mekhalasu skhalantah | duram durvasthalotka marakatadrishadi
    sthasnavo yanna yatah pushno''shvah purayamstaistadavatu javanairhunkritenagrago vah || || var prerayan
    hunkritairagranih || ityarunavarnanam || var sutavarnanam || atha rathavarnanam || pinorahpreritabhraishcaramakhuraputagrasthitaih
    prataradra vadirghangairudasto haribhirapagatasanganihshabdacakrah | uttananurumurdhavanatihathabhavadvipratipapranamah
    prahne shreyo vidhattam savituravataranvyomavithim ratho vah || || var preyo dhvantaughadhvamsadikshavidhipatu
    vahata praksahasram karana var vidhiguru draksahasram maryamna yo garimnah padamatulamupaniyatadhyasanena
    | sa shrantanam nitantam bharamiva marutamakshamanam visodhum skandhatskandham vrajanvo vrijinavijitaye
    bhasvatah syandano''stu || || yoktribhutanyugasya grasitumiva puro dandashukandadhano dvedhavyastambuvahavalivihitabrihatpakshavikshepashobhah
    | savitrah syandano''sau niratishayarayaprinitanururenah kshepiyo vo garutmaniva haratu haricchavidheyapracarah
    || || ekahenaiva dirgham tribhuvanapadavim langhayan yo laghishthah var kristnam prishthe merorgariyan
    dalitamanidrishattvimshi pimshanshiramsi | sarvasyaivoparishtadatha ca punaradhastadivastadrimurndhi
    bradhnasyavyatsa evam duradhigamaparispandanah syandano vah || || dhurdhvastagryagrahani dhvajapatapavanandolitenduni
    duram var durat rahau grasabhilashadanusarati punardattacakravyathani | shrantashvashvasaheladhutavibudhadhuninirjharambhamsi
    bhadram deyasurvo daviyo divi divasapateh syandanaprasthitani || || akshe raksham nibadhya pratisaravalayairyojayantyo
    yugagram dhuhstambhe dagdhadhupah prahitasumanaso gocare kubarasya | carcashcakre carantyo malayajapayasa
    siddhavadhvastrisandhyam var carcam vandante yam dyumarge sa nudatu duritanyamshumatsyandano vah ||
    || utkirnasvarnarenudrutakhuradalita parshvayoh shashvadashvai var renurdruta rashrantabhrantacakrakramanikhilamilanneminimna
    bharena | merormurdhanyagham vo vighatayatu raverekavithi rathasya svoshmodaktamburiktaprakatitapulinoddhusara
    svardhuniva || || var svoshmodastambu nantum nakalayanamanishamanuyatam paddhatih panktireva var upayatam
    kshodo nakshatrarasheradayarayamilaccakrapishtasya dhulih | heshahlado harinam surashikharidarih purayanneminado
    var nado yasyavyattivrabhanoh sa divi bhuvi yatha vyaktacihno ratho vah || || nihspandanam vimanavalivitatadivam
    devavrindarakanam var valitadisha vrindairanandasandrodyamamapi vahatam vindatam vanditum no | mandakinyamamandah
    pulinabhriti mridurmandare mandirabhe var mandarabhe mandarairmanditaram dadhadari dinakritsyandanah
    stanmude vah || || cakri cakrarapanktim harirapi ca harin dhurjatirdhurdhvajanta naksham nakshatranatho''runamapi
    varunah kubaragram kuberah | ramhah sanghah suranam jagadupakritaye nityayuktasya yasya stauti pritiprasanno''nvahamahimaruceh
    so''vatatsyandano vah || || var ruca netrahinena mule vihitaparikarah siddhasadhyairmarudbhih padopante
    stuto''lam baliharirabhasakarshanabaddhavegah | bhramyanvyomamburashavashishirakiranasyandanah santatam
    vo dishyallakshmimaparamatulitamahimevaparo mandaradrih || || var atulyam || iti rathavarnanam ||
    || atha mandalavarnanam || yajjyayo bijamahnamapahatatimiram cakshushamanjanam ya var jyayo yadbijamahnamapahrita
    ddvaram yanmuktibhajam yadakhilabhuvanajyotishamekamokah | yadvrishtyambhonidhanam dharanirasasudhapanapatram
    mahadya ddishyadishasya bhasam tadadhikalamalam mangalam mandalam vah || || var devasya bhanoh tadadhikamamalam
    mandalam mangalam velavardhishnu sindhoh paya iva khamivardhodgatagyragrahodu stokodbhinnasvacihnaprasavamiva
    madhorasyamasyanmanamsi | var mahamsi pratah pushno''shubhani prashamayatu shirahshekharibhutamadreh
    paurastyasyodgabhastistimitatamatamahkhandanam mandalam vah || || pratyuptastaptahemojjvalaruciracalah
    padmaragena yena jyayah kinjalkapunjo yadalikulashiterambarendivarasya | kalavyalasya cihnam mahitatamamahomurndhi
    ratnam mahadya ddiptamshoh prataravyattadavikalajaganmandanam mandalam vah || || kastrata tarakanam
    patati tanuravashyayabinduryathendu rvidrana driksmararerurasi muraripoh kaustubho nodgabhastih |
    vahneh sapahnaveva dyutirudayagate yatra tanmandalam vo martandiyam punitaddivi bhuvi ca tamamsiva
    mrishnanmahamsi || || yatpracyam prakcakasti prabhavati ca yatah pracyasavujjihana diddham madhye
    yadahno bhavati tataruca yena cotpadyate''hah | yatparyayena lokanavati ca jagatam jivitam yacca tadvo
    vishvanugrahi vishvam srijadapi ca ravermandalam muktaye''stu || || shushyantyudhanukara makaravasatayo
    maravinam sthalinam yenottaptah sphutantastaditi tilatulam yantyagendra yugante | var catiti taccandamshorakandatribhuvanadahanashankaya
    dhama kricchat var kritsnam samhrityalokamatram pralaghu vidadhatah stanmude mandalam vah || || var
    ahrityalokamatram pratanu udyaddyudyanavapyam bahulatamatamahpankapuram vidarya var bahala prodbhinnam
    patraparshveshvaviralamarunacchayaya visphurantya | kalyanani kriyadvah kamalamiva mahanmandalam candabhano
    var candarashmeh ranvitam triptihetorasakridalikulakarina rahuna yat || || cakshurdakshadvisho yanna
    tu dahati purah purayatyeva kamam var na dahati nitaram punah nastam jushtam marudbhiryadiha niyaminam
    yanapatram bhavabdhau | yadvitashranti shashvadbhramadapi jagatam bhrantimabhranti hanti bradhnasyakhyadviruddhakriyamatha
    ca hitadhayi tanmandalam vah || || || iti mandalavarnanam || || atha suryavarnanam | siddhaih siddhantamishram
    shritavidhi vibudhaishcaranaishcatugarbham gitya gandharvamukhyairmuhurahipatibhiryatudhanairyatatma
    | sardham sadhyairmunindrairmuditamatamano mokshibhih pakshapata var mokshubhih tpratah prarabhyamanastutiravatu
    ravirvishvavandyodayo vah || || bhasamasannabhavadadhikatarapatoshcakravalasya tapa cchedadacchinnagacchatturagakhuraputanyasanihshankatankaih
    | var nyasta nihsangasyandanangabhramananikashanatpatu vastriprakaram var triprakaraih taptamshustatparikshapara
    iva paritah paryatanhatakadrim || || no shushkam nakanadya vikasitakanakambhojaya bhrajitam tu var
    kanakambhoruha plushta naivopabhogya bhavati bhrishataram nandanodyanalakshmih | no shringani drutani
    drutamamaragireh kaladhautani dhauta niddham dhama dyumarge mradayati dayaya yatra so''rko''vatadvah
    || || dhvantasyaivantaheturna bhavati malinaikatmanah papmano''pi prakpadopantabhajam janayati na
    param pankajanam prabodham | karta nihshreyasanamapi na tu khalu yah kevalam vasaranam so''vyadekodyamecchavihitabahubrihadvishvakaryo''ryama
    vah || || lota~lloshtaviceshtah shritashayanatalo nihsahibhutadehah sandehi pranitavye sapadi dasha
    dishah prekshamano''ndhakarah | nihshvasayasanishthah paramaparavasho jayate jivalokah var cirataravasho
    shokenevanyalokanudayakriti gate yatra so''rko''vatadvah || || var lokabhyudaya krama~llolo''pi loka~stadupakritikritavashritah
    sthairyakotim nrinam drishtim vijihmam vidadhadapi karotyantaratyantabhadram | yastapasyapi heturbhavati
    niyaminamekanirvanadayi bhuyatsa pragavasthadhikataraparinamodayo''rkah shriye vah || || vyapannarturna
    kalo vyabhicarati phalam naushadhirvrishtirishta naishtaistripyanti deva na hi vahati marunnirmalabhani
    bhani | ashah shanta na bhindantyavadhimudadhayo bibhrati kshmabhritah kshmam yasmimstrailokyamevam
    na calati tapati statsa suryah shriye vah || || kailase krittivasa viharati virahatrasadehodhakantah
    shrantah shete mahahavadhijaladhi vina chadmana padmanabhah | yogodyogaikatano gamayati sakalam vasaram
    svam svayambhu rbhuritrailokyacintabhriti bhuvanavibhau yatra bhasvansa vo''vyat || || etadyanmandalam
    khe tapati dinakritasta rico''rcimshi yani dyotante tani samanyayamapi purusho mandale''nuryajumshi
    | evam yam veda vedatritayamayamayam vedavedi samagro vargah svargapavargaprakritiravikritih so''stu
    suryah shriye vah || || nakaukahpratyanikakshatipatumahasam vasavagresaranam sarvesham sadhu patam
    jagadidamaditeratmajatve same''pi | yenadityabhidhanam niratishayagunairatmani nyastamastu var gunenatmani
    stutyastrailokyavandyaistridashamuniganaih som''shuman shreyase vah || || bhumim dhamno''bhivrishtya
    jagati jalamayim pavanim samsmritava var dhamno''tha pyagneyim dahashaktya muhurapi yajamanam yathaprarthitarthaih
    | var yajamanatmikam linamakasha evamritakaraghatitam dhvantapakshasya parva nvevam suryo''shtabhedam
    bhava iva bhavatah patu bibhratsvamurtim || || prakkalonnidrapadmakaraparimalanavirbhavatpadashobho
    bhaktya tyaktorukhedodgati divi vinatasununa niyamanah | saptashvaptaparantanyadhikamadharayanyo jaganti
    stuto''lam devairdevah sa payadapara iva muraratirahnam patirvah || || yah srashta''pam purastadacalavarasamabhyunnaterhetureko
    lokanam yastrayanam sthita upari param durvilanghyena dhamna | var ca trayanam sadyah siddhyai prasannadyutishubhacaturashamukhah
    stadvibhakto var shuci dvedha vedha ivavishkritakamalarucih so''rcishamakaro vah || || sadridyurvinadisha
    dishati dasha disho darshayanpragdrisho yah var drak drisho sadrishyam drishyate no sadashashatadrishi
    traidashe yasya deshe | diptamshurvah sa dishyadashivayugadashadarshitadvadashatma sham shastyashvamshca
    yasyashayavidatishayaddandashukashanadyah || || tirthani vyarthakani hridanadasarasinirjharambhojininam
    nodanvanto nudanti pratibhayamashubhashvabhrapatanubandhi | apo nakapagaya api kalushamusho majjatam
    naiva yatra var svargapagayah tratum yate''nyalokan sa dishatu divasasyaikaheturhitam vah || || var
    lokam etatpatalapankaplutamiva tamasaivaikamudgadhamasi daprajnatapratarkyam niravagati tathalakshanam
    suptamantah | yadriksrishteh purastannishi nishi sakalam jayate tadrigeva trailokyam yadviyogadavatu
    ravirasau sargatulyodayo vah || || dvipe yo''stacalo''sminbhavati khalu sa evaparatrodayadri rya yaminyujjvalendudyutiriha
    divaso''nyatra tivratapah sa | yadvashyau deshakalaviti niyamayato no tu yam deshakala var nu vavyatsa
    svaprabhutvahitabhuvanahito heturahnamino vah || || vyagrairagryagrahendugrasanaguru bharairno samagrairudagraih
    var gurutaraih pratyagrairishadugrairudayagirigato goganairgaurayan gam | udgadharcirvilinamaranagaranagagravagarbhamivahna
    magre shreyo vidhatte glapayatu gahanam sa grahagramanirvah || || yonih samnam vidhata madhuripurajito
    dhurjatih shankaro''sau mrityuh kalo''lakayah patirapi dhanadah pavako jatavedah | ittham sanjna davitthadivadamritabhujam
    ya yadricchapravritta stasameko''bhidheyastadanugunagunairyah sa suryo''vatadvah || || var ganaih
    devah kim bandhavah syatpriyasuhridathava''''carya ahosvidaryo var aryah raksha cakshurnu dipo gururuta
    janako jivitam bijamojah | evam nirniyate yah ka iva na jagatam sarvatha sarvada''sau var sarvadah
    sarvakaropakari dishatu dashashatabhishurabhyarthitam vah || || shloka lokasya bhutyai shatamiti racitah
    shrimayurena bhaktya yuktashcaitanpathedyah sakridapi purushah sarvapapairvimuktah | arogyam satkavitvam
    matimatulabalam kantimayuhprakarsham vidyamaishvaryamartham sutamapi labhate so''tra suryaprasadat
    || || iti shrimayurakavipranitam suryashatakam samaptam |'
  devanagari: ॥ सूर्यशतकम् ॥ महाकविश्रीमयूरप्रणीतम् ॥ श्री गणेशाय नमः ॥ जम्भारातीभकुम्भोद्भवमिव दधतः सान्द्रसिन्दूररेणुं
    रक्ताः सिक्ता इवौघैरुदयगिरितटीधातुधाराद्रवस्य । वर् सक्तैः आयान्त्या तुल्यकालं कमलवनरुचेवारुणा वो
    विभूत्यै भूयासुर्भासयन्तो भुवनमभिनवा भानवो भानवीयाः ॥ ॥ भक्तिप्रह्वाय दातुं मुकुलपुटकुटीकोटरक्रोडलीनां
    लक्ष्मीमाक्रष्टुकामा इव कमलवनोद्धाटनं कुर्वते ये । कालाकारान्धकाराननपतितजगत्साध्वसध्वंसकल्याः कल्याणं
    वः क्रियासुः किसलयरुचयस्ते करा भास्करस्य ॥ ॥ गर्भेष्वम्भोरुहाणां शिखरिषु च शिताग्रेषु तुल्यं पतन्तः
    प्रारम्भे वासरस्य व्युपरतिसमये चैकरूपास्तथैव । निष्पर्यायं प्रवृत्तास्त्रिभुवनभवनप्राङ्गणे पान्तु
    युष्मा नूष्माणं सन्तताध्वश्रमजमिव भृशं बिभ्रतो ब्रध्नपादाः ॥ ॥ प्रभ्रश्यत्युत्तरीयत्विषि तमसि समुद्दीक्ष्य
    वीतावृतीन्प्रा ग्जन्तूंस्तन्तून्यथा यानतनु वितनुते तिग्मरोचिर्मरीचीन् । ते सान्द्रीभूय सद्यः क्रमविशददशाशादशालीविशालं
    शश्वत्सम्पादयन्तोऽम्बरममलमलं मङ्गलं वो दिशन्तु ॥ ॥ न्यक्कुर्वन्नोषधीशे मुषितरुचि शुचेवौषधीः प्रोषिताभा
    भास्वद्ग्रावोद्गतेन प्रथममिव कृताभ्युद्गतिः पावकेन । पक्षच्छेदव्रणासृक्स्रुत इव दृषदो दर्शयन्प्रातरद्रे
    राताम्रस्तीव्रभानोरनभिमतनुदे स्ताद्गभस्त्युद्गमो वः ॥ ॥ शीर्णघ्राणाङ्घ्रिपाणीन्व्रणिभिरपघनैर्घर्घराव्यक्तघोषान्
    दीर्घाघ्रातानघौघै पुनरपि घटयत्येक उल्लाघयन् यः । घर्मांशोस्तस्य वोऽन्तर्द्विगुणघनघृणानिघ्ननिर्विघ्नवृत्ते
    र्दत्तार्घाः सिद्धसङ्घैर्विदधतु घृणयः शीघ्रमंहोविधातम् ॥ ॥ बिभ्राणा वामनत्वं प्रथममथ तथैवांशवः प्रांशवो
    वः क्रान्ताकाशान्तरालास्तदनु दशदिशः पूरयन्तस्ततोऽपि । ध्वान्तादाच्छिद्य देवद्विष इव बलितो विश्वमाश्वश्नुवानाः
    वर् देवद्रुह कृच्छ्राण्युच्छ्रायहेलोपहसितहरयो हारिदश्वा हरन्तु ॥ ॥ उद्गाढेनारुणिम्ना विदधति बहुलं
    येऽरुणस्यारुणत्वं मूर्धोद्धूतौ खलीनक्षतरुधिररुचो ये रथाश्वाननेषु । शैलानां शेखरत्वं श्रितशिखरिशिखास्तन्वते
    ये दिशन्तु वर् शिखरशिखाः प्रेङ्खन्तः खे खरांशोः खचितदिनमुखास्ते मयूखाः सुखं वः ॥ ॥ दत्तानन्दाः प्रजानां
    समुचितसमयाकृष्टसृष्टैः पयोभिः वर् अक्लिष्टसृष्टैः पूर्वाह्णे विप्रकीर्णा दिशि दिशि विरमत्यह्नि संहारभाजः
    । दीप्तांशोर्दीर्घदुःखप्रभवभवभयोदन्वदुत्तारनावो गावो वः पावनानां परमपरिमितां प्रीतिमुत्पादयन्तु ॥
    ॥ बन्धध्वंसैकहेतुं शिरसि नतिरसाबद्धसन्ध्याञ्जलीनां लोकानां ये प्रबोधं विदधति विपुलाम्भोजखण्डाशयेव
    । युष्माकं ते स्वचित्तप्रथितपृथुतरप्रार्थनाकल्पवृक्षाः वर् प्रथिम कल्पन्तां निर्विकल्पं दिनकरकिरणाः
    केतवः कल्मषस्य ॥ ॥ धारा रायो धनायापदि सपदि करालम्बभूताः प्रपाते तत्त्वालोकैकदीपास्त्रिदशपतिपुरप्रस्थितौ
    वीथ्य एव । निर्वाणोद्योगियोगिप्रगमनिजतनुद्वारि वेत्रायमाणा स्त्रायन्तां तीव्रभानोर्दिवसमुखसुखा रश्मयः
    कल्मषाद्वः ॥ ॥ वर् तीव्रभासः वर् कश्मलाद्वः प्राचि प्रागाचरन्त्योऽनतिचिरमचले चारुचूडामणित्वं मुञ्चन्त्यो
    रोचनाम्भः प्रचुरमिव दिशामुच्चकैश्चर्चनाय । चाटूत्कैश्चक्रनाम्नां चतुरमविचलैर्लोचनैरर्च्यमाना वर् सुचिरं
    श्चेष्टन्तां चिन्तितानामुचितमचरमाश्चण्डरोचीरुचो वः ॥ ॥ एकं ज्योतिर्दृशौ द्वे त्रिजगति गदितान्यब्जजास्यैश्चतुर्भि
    र्भूतानां पञ्चमं यान्यलमृतुषु तथा षट्सु नानाविधानि । युष्माकं तानि सप्तत्रिदशमुनिनुतान्यष्टदिग्भाञ्जि
    भानो र्यान्ति प्राह्णे नवत्वं दश दधतु शिवं दीधितीनां शतानि ॥ ॥ वर् ददतु आवृत्तिभ्रान्तविश्वाः श्रममिव
    दधतः शोषिणः स्वोष्मणेव ग्रीष्मे दावाग्नितप्ता इव रसमसकृद्ये धरित्र्या धयन्ति । ते प्रावृष्यात्तपानातिशयरुज
    इवोद्वान्ततोया हिमर्तौ मार्तण्डस्याप्रचण्डाश्चिरमशुभभिदेऽभीषवो वो भवन्तु ॥ ॥ तन्वाना दिग्वधूनां समधिकमधुरालोकरम्यामवस्था
    मारुढप्रौढिलेशोत्कलितकपिलिमालङ्कृतिः केवलैव । उज्जृम्भाम्भोजनेत्रद्युतिनि दिनमुखे किञ्चिदुद्भिद्यमाना
    श्मश्रुश्रेणीव भासां दिशतु दशशती शर्म घर्मत्विषो वः ॥ ॥ मौलीन्दोर्मैष मोषीद्द्युतिमिति वृषभाङ्केन
    यः शङ्किनेव प्रत्यग्रोद्घाटिताम्भोरुहकुहरगुहासुस्थितेनेव धात्रा । कृष्णेन ध्वान्तकृष्णस्वतनुपरिभवत्रस्नुनेव
    स्तुतोऽलं त्राणाय स्तात्तनीयानपि तिमिररिपोः स त्विषामुद्गमो वः ॥ ॥ विस्तीर्णं व्योम दीर्घाः सपदि दश
    दिशो व्यस्तवेलाम्भसोऽब्धीन् कुर्वद्भिर्दृश्यनानानगनगरनगाभोगपृथ्वीं च पृथ्वीम् । पद्मिन्युच्छ्वास्यते
    यैरुषसि जगदपि ध्वंसयित्वा तमिस्रा मुस्रा विस्रंसयन्तु द्रुतमनभिमतं ते सहस्रत्विषो वः ॥ ॥ वर् विस्रावयन्तु
    अस्तव्यस्तत्वशून्यो निजरुचिरनिशानश्वरः कर्तुमीशो विश्वं वेश्मेव दीपः प्रतिहततिमिरं यः प्रदेशस्थितोऽपि
    । दिक्कालापेक्षयासौ त्रिभुवनमटतस्तिग्मभानोर्नवाख्यां यातः शातक्रतव्यां दिशि दिशतु शिवं सोऽर्चिषामुद्गमो
    वः ॥ ॥ मागान्म्लानिं मृणाली मृदुरिति दययेवाप्रविष्टोऽहिलोकं लोकालोकस्य पार्श्वं प्रतपति न परं यस्तदाख्यार्थमेव
    । ऊर्ध्वं ब्रह्माण्डखण्डस्फुटनभयपरित्यक्तदैर्घ्यो द्युसीम्नि स्वेछावश्यावकाशावधिरवतु स वस्तापनो रोचिरोघः
    ॥ ॥ अश्यामः काल एको न भवति भुवनान्तोऽपि वीतेऽन्धकारे वर् वीतान्धकारः सद्यः प्रालेयपादो न विलयमचलश्चन्द्रमा
    अप्युपैति । बन्धः सिद्धाञ्जलीनां न हि कुमुदवनस्यापि यत्रोज्जिहाने तत्प्रातः प्रेक्षणीयं दिशतु दिनपतेर्धाम
    कामाधिकं वः ॥ ॥ यत्कान्तिं पङ्कजानां न हरति कुरुते प्रत्युताधिक्यरम्यां वर् प्रत्युतातीव रम्यां नो
    धत्ते तारकाभां तिरयति नितरामाशु यन्नित्यमेव । वर् नाधत्ते कर्तुं नालं निमेषं दिवसमपि परं यत्तदेकं
    त्रिलोक्या श्चक्षुः सामान्यचक्षुर्विसदृशमघभिद्भास्वतस्तान्महो वः ॥ ॥ क्ष्मां क्षेपीयः क्षपाम्भःशिशिरतरजलस्पर्शतर्षादृतेव
    द्रागाशा नेतुमाशाद्विरदकरसरःपुष्कराणीव बोधम् । प्रातः प्रोल्लङ्घ्य विष्णोः पदमपि घृणयेवातिवेगाद्दवीय
    स्युद्दाम द्योतमाना दहतु दिनपतेर्दुर्निमित्तं द्युतिर्वः ॥ ॥ नो कल्पापायवायोरदयरयदलत्क्ष्माधरस्यापि
    गम्या वर् शम्या गाढोद्गीर्णोज्ज्वलश्रीरहनि न रहिता नो तमःकज्जलेन । प्राप्तोत्पत्तिः पतङ्गान्न पुनरुपगता
    मोषमुष्णत्विषो वो वर्तिः सैवान्यरूपा सुखयतु निखिलद्वीपदीपस्य दीप्तिः ॥ ॥ निःशेषाशावपूरप्रवणगुरुगुणश्लाघनीयस्वरूपा
    पर्याप्तं नोदयादौ दिनगमसमयोपप्लवेऽप्युन्नतैव । अत्यन्तं यानभिज्ञा क्षणमपि तमसा साकमेकत्र वस्तुं ब्रध्नस्येद्धा
    रुचिर्वो रुचिरिव रुचितस्याप्तये वस्तुनोस्तु ॥ रुचिरस्य विभ्राणः शक्तिमाशु प्रशमितबलवत्तारकौर्जित्यगुर्वीं
    कुर्वाणो लीलयाधः शिखिनमपि लसच्चन्द्रकान्तावभासम् । आदध्यादन्धकारे रतिमतिशयिनीमावहन्वीक्षणानां वर्
    आदेयादीक्षणानां बालो लक्ष्मीमपारामपर इव गुहोऽहर्पतेरातपो वः ॥ ॥ ज्योत्स्नांशाकर्षपाण्डुद्युति तिमिरमषीशेषकल्माषमीष
    ज्जृम्भोद्भूतेन पिङ्गं सरसिजरजसा सन्ध्यया शोणशोचिः । प्रातःप्रारम्भकाले सकलमपि जगच्चित्रमुन्मीलयन्ती
    कान्तिस्तीक्ष्णत्विषोऽक्ष्णां मुदमुपनयतात्तूलिकेवातुलां वः ॥ ॥ आयान्ती किं सुमेरोः सरणिररुणिता पाद्मरागैः
    परागै राहोस्वित्स्वस्य माहारजनविरचिता वैजयन्ती रथस्य । माञ्जिष्ठी प्रष्ठवाहावलिविधुतशिरश्चामराली नु
    लोकै वर् चामरालीव राशङ्क्यालोकितैवं सवितुरघनुदे स्तात्प्रभातप्रभा वः ॥ ॥ ध्वान्तध्वंसं विधत्ते न तपति
    रुचिमन्नातिरूपं व्यनक्ति न्यक्त्वं नीत्वापि नक्तं न वितरतितरां तावदह्नस्त्विषं यः । वर् न्यक्तामह्नि
    स प्रातर्मा विरंसीदसकलपटिमा पूरयन्युष्मदाशा माशाकाशावकाशावतरणतरुणप्रक्रमोऽर्कप्रकाशः ॥ ॥ तीव्रं निर्वाणहेतुर्यदपि
    च विपुलं यत्प्रकर्षेण चाणु प्रत्यक्षं यत्परोक्षं यदिह यदपरं नश्वरं शाश्वतं च । यत्सर्वस्य प्रसिद्धं
    जगति कतिपये योगिनो यद्विदन्ति ज्योतिस्तद्द्विप्रकारं सवितुरवतु वो बाह्यमाभ्यन्तरं च ॥ ॥ रत्नानां मण्डनाय
    प्रभवति नियतोद्देशलब्धावकाशं वह्नेर्दार्वादि दग्धुं निजजडिमतया कर्तुमानन्दमिन्दोः । यच्च त्रैलोक्यभूषाविधिरघदहनं
    ह्लादि वृष्ट्याशु तद्वो वर् यत्तु बाहुल्योत्पाद्यकार्याधिकतरमवतादेकमेवार्कतेजः ॥ ॥ मीलच्चक्षुर्विजिह्मश्रुति
    जडरसनं निघ्नितघ्राणवृत्ति स्वव्यापाराक्षमत्वक्परिमुषितमनः श्वासमात्रावशेषम् । विस्रस्ताङ्गं पतित्वा
    स्वपदपहरतादश्रियं वोऽर्कजन्मा वर् अप्रियं कालव्यालावलीढं जगदगद इवोत्थापयन्प्राक्प्रतापः ॥ ॥ निःशेषं
    नैशमम्भः प्रसभमपनुदन्नश्रुलेशानुकारि स्तोकस्तोकापनीतारुणरुचिरचिरादस्तदोषानुषङ्गः । दाता दृष्टिं प्रसन्नां
    त्रिभुवननयनस्याशु युष्मद्विरुद्धं वध्याद्ब्रध्नस्य सिद्धाञ्जनविधिरपरः प्राक्तनोऽर्चिःप्रचारः ॥ ॥ भूत्वा
    जम्भस्य भेत्तुः ककुभि परिभवारम्भभूः शुभ्रभानो वर् स्थित्वा र्बिभ्राणा बभ्रुभावं प्रसभमभिनवाम्भोजजृम्भाप्रगल्भा
    । भूषा भूयिष्ठशोभा त्रिभुवनभवनस्यास्य वैभाकरी प्राग् विभ्रान्ता भ्राजमाना विभवतु विभवोद्भूतये सा विभा
    वः ॥ विभ्रान्ति संसक्तं सिक्तमूलादभिनवभुवनोद्यानकौतूहलिन्या यामिन्या कन्ययेवामृतकरकलशावर्जितेनामृतेन
    । अर्कालोकः क्रियाद्वो मुदमुदयशिरश्चक्रवालालवाला दुद्यन्बालप्रवालप्रतिमरुचिरहःपादपप्राक्प्ररोहः ॥
    ॥ भिन्नं भासारुणस्य क्वचिदभिनवया विद्रुमाणां त्विषेव त्वङ्न्नक्षत्ररत्नद्युतिनिकरकरालान्तरालं क्वचिच्च
    । नान्तर्निःशेषकृष्णश्रियमुदधिमिव ध्वान्तराशिं पिबन्स्ता दौर्वः पूर्वोऽप्यपूर्वोऽग्निरिव भवदघप्लुष्टयेऽर्कावभासः
    ॥ ॥ गन्धर्वैर्गद्यपद्यव्यतिकरितवचोहृद्यमातोद्यवाद्यै राद्यैर्यो नारदाद्यैर्मुनिभिरभिनुतो वेदवेद्यैर्विभिद्य
    । वर् वीतवेद्यैर्विविद्य वेदविद्भिर्विभिद्य आसाद्यापद्यते यं पुनरपि च जगद्यौवनं सद्य उद्य न्नुद्द्योतो
    द्योतितद्यौर्द्यतु दिवसकृतोऽसाववद्यानि वोऽद्य ॥ ॥ आवानैश्चन्द्रकान्तैश्च्युततिमिरतया तानवात्तारकाणा
    वर् आवान्तैः मेणाङ्कालोकलोपादुपहतमहसामोषधीनां लयेन । आरादुत्प्रेक्ष्यमाणा क्षणमुदयतटान्तर्हितस्याहिमांशो
    राभा प्राभातिकी वोऽवतु न तु नितरां तावदाविर्भवन्ती ॥ ॥ सानौ सा नौदये नारुणितदलपुनर्यौवनानां वनाना
    वर् लसद्यौवनानां मालीमालीढपूर्वा परिहृतकुहरोपान्तनिम्ना तनिम्ना । भा वोऽभावोपशान्तिं दिशतु दिनपतेर्भासमाना
    समाना राजी राजीवरेणोः समसमयमुदेतीव यस्या वयस्या ॥ ॥ उज्जृम्भाम्भोरुहाणां प्रभवति पयसां या श्रिये नोष्णतायै
    पुष्णात्यालोकमात्रं न तु दिशति दृशां दृश्यमाना विधातम् । पूर्वाद्रेरेव पूर्वं दिवमनु च पुनः पावनी
    दिङ्मुखाना वर् ततः मेनांस्यैनी विभासौ नुदतु नुतिपदैकास्पदं प्राक्तनी वः ॥ ॥ वाचां वाचस्पतेरप्यचलभिदुचिताचार्यकाणां
    प्रपञ्चै र्वैरञ्चानां तथोच्चारितचतुरृचां चाननानां चतुर्णाम् । वर् रुचिर उच्येतार्चासु वाच्यच्युतिशुचिचरितं
    यस्य नोच्चैर्विविच्य वर् अर्चास्ववाच्य प्राच्यं वर्चश्चकासच्चिरमुपचिनुतात्तस्य चण्डार्चिषो वः ॥ ॥
    वर् श्रियं मूर्ध्न्यद्रेर्धातुरागस्तरुषु किसलयो विद्रुमौघः समुद्रे वर् किसलयाद्विद्रुमौघात्समुद्रे
    दिङ्मातङ्गोत्तमाङ्गेष्वभिनवनिहितः सान्द्रसिन्दूररेणुः । वर् विहितः निहितात्सन्द्रसिन्दूररेणोः सीम्नि
    व्योम्नश्च हेम्नः सुरशिखरिभुवो जायते यः प्रकाशः शोणिम्नासौ खरांशोरुषसि दिशतु वः शर्म शोभैकदेशः ॥ ॥
    अस्ताद्रीशोत्तमाङ्गे श्रितशशिनि तमःकालकूटे निपीते याति व्यक्तिं पुरस्तादरुणकिसलये प्रत्युषःपारिजाते
    । उद्यन्त्यारक्तपीताम्बरविशदतरोद्वीक्षिता तीक्ष्णभानो वर् रुचिरतरोद्वीक्षिता वर् तीव्रभासः र्लक्ष्मीर्लक्ष्मीरिवास्तु
    स्फुटकमलपुटापाश्रया श्रेयसे वः ॥ ॥ वर् पुटोपाश्रय नोदन्वाञ्जन्मभूमिर्न तदुदरभुवो बान्धवाः कौस्तुभाद्या
    यस्याः पद्मं न पाणौ न च नरकरिपूरःस्थली वासवेश्म । तेजोरूपापरैव त्रिषु भुवनतलेष्वादधाना व्यवस्थां वर्
    त्रिभुवनभवने सा श्रीः श्रेयांसि दिश्यादशिशिरमहसो मण्डलाग्रोद्गता वः ॥ ॥ ॥ इति द्युतिवर्णनम् ॥ वर्
    तेजोवर्णनम् ॥ अथ अश्ववर्णनम् ॥ रक्षन्त्वक्षुण्णहेमोपलपटलमलं लाघवादुत्पतन्तः पातङ्गाः पङ्ग्ववज्ञाजितपवनजवा
    वाजिनस्ते जगन्ति । येषां वीतान्यचिह्नोन्नयमपि वहतां मार्गमाख्याति मेरा वुद्यन्नुद्दामदीप्तिर्द्युमणिमणिशिलावेदिकाजातवेदाः
    ॥ ॥ प्लुष्टाः पृष्ठेंऽशुपातैरतिनिकटतया दत्तदाहातिरेकै रेकाहाक्रान्तकृत्स्नत्रिदिवपथपृथुश्वासशोषाः
    श्रमेण । तीव्रोदन्यास्त्वरन्तामहितविहतये सप्तयः सप्तसप्ते रभ्याशाकाशगङ्गाजलसरलगलावाङ्नताग्रानना वः
    ॥ ॥ वर् गलवर्जिताग्राननाः मत्वान्यान्पार्श्वतोऽश्वान् स्फटिकतटदृषद्दृष्टदेहा द्रवन्ती व्यस्तेऽहन्यस्तसन्ध्येयमिति
    मृदुपदा पद्मरागोपलेषु । सादृश्यादृश्यमूर्तिर्मरकतकटके क्लिष्टसूता सुमेरो र्मूर्धन्यावृत्तिलब्धध्रुवगतिरवतु
    ब्रध्नवाहावलिर्वः ॥ ॥ वर् द्रुत हेलालोलं वहन्ती विषधरदमनस्याग्रजेनावकृष्टा स्वर्वाहिन्याः सुदूरं जनितजवजया
    स्यन्दनस्य स्यदेन । निर्व्याजं तायमाने हरितिमनि निजे स्फीतफेनाहितश्री वर् स्फीतफेनास्मितश्रीः रश्रेयांस्यश्वपङ्क्तिः
    शमयतु यमुनेवापरा तापनी वः ॥ ॥ मार्गोपान्ते सुमेरोर्नुवति कृतनतौ नाकधाम्नां निकाये वीक्ष्य व्रीडानतानां
    प्रतिकुहरमुखं किन्नरीणां मुखानि । सूतेऽसूयत्यपीषज्जडगति वहतां कन्धरार्धैर्वलद्भि वर् कन्धराग्रैः र्वाहानां
    व्यस्यताद्वः सममसमहरेर्हेषितं कल्मषाणि ॥ ॥ धुन्वन्तो नीरदालीर्निजरुचिहरिताः पार्श्वयोः पक्षतुल्या
    स्तालूत्तानैः खलीनैः खचितमुखरुचश्च्योतता लोहितेन । उड्डीयेव व्रजन्तो वियति गतिवशादर्कवाहाः क्रियासुः
    क्षेमं हेमाद्रिहृद्यद्रुमशिखरशिरःश्रेणिशाखाशुका वः ॥ ॥ ॥ इत्यश्ववर्णनम् ॥ ॥ अथ अरुणवर्णनम् ॥ प्रातः
    शैलाग्ररङ्गे रजनिजवनिकापायसंलक्ष्यलक्ष्मी र्विक्षिप्तापूर्वपुष्पाञ्जलिमुडुनिकरं सूत्रधारायमाणः । यामेष्वङ्केष्विवाह्नः
    कृतरुचिषु चतुर्ष्वेव जातप्रतिष्ठा वर् यातः प्रतिष्ठां मव्यात्प्रस्तावयन्वो जगदटनमहानाटिकां सूर्यसूतः
    ॥ ॥ आक्रान्त्या वाह्यमानं पशुमिव हरिणा वाहकोऽग्र्यो हरीणां भ्राम्यन्तं पक्षपाताज्जगति समरुचिः सर्वकर्मैकसाक्षी
    । शत्रुं नेत्रश्रुतीनामवजयति वयोज्येष्ठभावे समेऽपि स्थाम्नां धाम्नां निधिर्यः स भवदघनुदे नूतनः स्तादनूरुः
    ॥ ॥ दत्तार्घैर्दूरनम्रैर्वियति विनयतो वीक्षितः सिद्धसार्थैः वर् सिद्धसाध्यैः सानाथ्यं सारथिर्वः स
    दशशतरुचेः सातिरेकं करोतु । आपीय प्रातरेव प्रततहिमपयःस्यन्दिनीरिन्दुभासो यः काष्ठादीपनोऽग्रे जडित इव
    भृशं सेवते पृष्ठतोऽर्कम् ॥ ॥ मुञ्चन्रश्मीन्दिनादौ दिनगमसमये संहरंश्च स्वतन्त्र स्तोत्रप्रख्यातवीर्योऽविरतहरिपदाक्रान्तिबद्धाभियोगः
    । वर् वितत कालोत्कर्षाल्लघुत्वं प्रसभमधिपतौ योजयन्यो द्विजानां सेवाप्रीतेन पूष्णात्मसम इव कृतस्त्रायतां
    सोऽरुणो वः ॥ ॥ वर् स्वसम शातः श्यामालतायाः परशुरिव तमोऽरण्यवह्नेरिवार्चिः वर् दाहे दवाभः प्राच्येवाग्रे
    ग्रहीतुं ग्रहकुमुदवनं प्रागुदस्तोऽग्रहस्तः । वर् प्राचीवाग्रे ग्रहकुमुदरुचिं ऐक्यं भिन्दन्द्युभूम्योरवधिरिव
    विधातेव विश्वप्रबोधे वाहानां वो विनेता व्यपनयतु विपन्नाम धामाधिपस्य ॥ ॥ पौरस्त्यस्तोयदर्तोः पवन इव
    पतत्पावकस्येव धूमो वर् पतन् विश्वस्येवादिसर्गः प्रणव इव परं पावनो वेदराशेः सन्ध्यानृत्योत्सवेच्छोरिव
    मदनरिपोर्नन्दिनान्दीनिनादः सौरस्याग्रे सुखं वो वितरतु विनतानन्दनः स्यन्दनस्य ॥ ॥ वर् स्यन्दनो वः पर्याप्तं
    तप्तचामीकरकटकतटे श्लिष्टशीतेतरांशा वासीदत्स्यन्दनाश्वानुकृतिमरकते पद्मरागायमाणः । वर् अश्वानुकृतमरकते
    यः सोत्कर्षां विभूषां कुरुत इव कुलक्ष्माभृदीशस्य मेरो रेनांस्यह्नाय दूरं गमयतु स गुरुः काद्रवेयद्विषो
    वः ॥ ॥ नीत्वाश्वान्सप्त कक्षा इव नियमवशं वेत्रकल्पप्रतोद वर् कक्ष्या स्तूर्णं ध्वान्तस्य राशावितरजन
    इवोत्सारिते दूरभाजि । पूर्वं प्रष्ठो रथस्य क्षितिभृदधिपतीन्दर्शयंस्त्रायतां व स्त्रैलोक्यास्थानदानोद्यतदिवसपतेः
    प्राक्प्रतीहारपालः ॥ ॥ वज्रिञ्जातं विकासीक्षणकमलवनं भासि नाभासि वह्ने वर् नो भासि तातं नत्वाश्वपार्श्वान्नय
    यम महिषं राक्षसा वीक्षिताः स्थ । सप्तीन्सिञ्च प्रचेतः भज जवं वित्तपावेदितस्त्वं वन्दे शर्वेति जल्पन्प्रतिदिशमधिपान्पातु
    पूष्णोऽग्रणीर्वः ॥ ॥ पाशानाशान्तपालादरुण वरुणतो मा ग्रहीः प्रग्रहार्थं तृष्णां कृष्णस्य चक्रे जहिहि
    नहि रथो याति मे नैकचक्रः । योक्तुं युग्यं किमुच्चैःश्रवसमभिलषस्यष्टमं वृत्रशत्रो वर् त्वाष्ट्रशत्रोः
    स्त्यक्तान्यापेक्षविश्वोपकृतिरिव रविः शास्ति यं सोऽवताद्वः ॥ ॥ नो मूर्च्छाच्छिन्नवाञ्छः श्रमविवशवपुर्नैव
    नाप्यास्यशोषी पान्थः पथ्येतराणि क्षपयतु भवतां भास्वतोऽग्रेसरः सः । यः संश्रित्य त्रिलोकीमटति पटुतरैस्ताप्यमानो
    मयूखै रारादारामलेखामिव हरितमणिश्यामलामश्वपङ्क्तिम् ॥ ॥ वर् हरिततृण सीदन्तोऽन्तर्निमज्जज्जडखुरमुसलाः
    सैकते नाकनद्याः स्कन्दन्तः कन्दरालीः कनकशिखरिणो मेखलासु स्खलन्तः । दूरं दूर्वास्थलोत्का मरकतदृषदि
    स्थास्नवो यन्न याताः पूष्णोऽश्वाः पूरयंस्तैस्तदवतु जवनैर्हुङ्कृतेनाग्रगो वः ॥ ॥ वर् प्रेरयन् हुङ्कृतैरग्रणीः
    ॥ इत्यरुणवर्णनम् ॥ वर् सूतवर्णनम् ॥ अथ रथवर्णनम् ॥ पीनोरःप्रेरिताभ्रैश्चरमखुरपुटाग्रस्थितैः प्रातरद्रा
    वादीर्घाङ्गैरुदस्तो हरिभिरपगतासङ्गनिःशब्दचक्रः । उत्तानानूरुमूर्धावनतिहठभवद्विप्रतीपप्रणामः प्राह्णे
    श्रेयो विधत्तां सवितुरवतरन्व्योमवीथीं रथो वः ॥ ॥ वर् प्रेयो ध्वान्तौघध्वंसदीक्षाविधिपटु वहता प्राक्सहस्रं
    कराणा वर् विधिगुरु द्राक्सहस्रं मर्यम्णा यो गरिम्णः पदमतुलमुपानीयताध्यासनेन । स श्रान्तानां नितान्तं
    भरमिव मरुतामक्षमाणां विसोढुं स्कन्धात्स्कन्धं व्रजन्वो वृजिनविजितये भास्वतः स्यन्दनोऽस्तु ॥ ॥ योक्त्रीभूतान्युगस्य
    ग्रसितुमिव पुरो दन्दशूकान्दधानो द्वेधाव्यस्ताम्बुवाहावलिविहितबृहत्पक्षविक्षेपशोभः । सावित्रः स्यन्दनोऽसौ
    निरतिशयरयप्रीणितानूरुरेनः क्षेपीयो वो गरुत्मानिव हरतु हरीच्छाविधेयप्रचारः ॥ ॥ एकाहेनैव दीर्घां त्रिभुवनपदवीं
    लङ्घयन् यो लघिष्ठः वर् कृस्त्नां पृष्ठे मेरोर्गरीयान् दलितमणिदृषत्त्विंषि पिंषञ्शिरांसि । सर्वस्यैवोपरिष्टादथ
    च पुनरधस्तादिवास्ताद्रिमूर्न्धि ब्रध्नस्याव्यात्स एवं दुरधिगमपरिस्पन्दनः स्यन्दनो वः ॥ ॥ धूर्ध्वस्ताग्र्यग्रहाणि
    ध्वजपटपवनान्दोलितेन्दूनि दूरं वर् दूरात् राहौ ग्रासाभिलाषादनुसरति पुनर्दत्तचक्रव्यथानि । श्रान्ताश्वश्वासहेलाधुतविबुधधुनीनिर्झराम्भांसि
    भद्रं देयासुर्वो दवीयो दिवि दिवसपतेः स्यन्दनप्रस्थितानि ॥ ॥ अक्षे रक्षां निबध्य प्रतिसरवलयैर्योजयन्त्यो
    युगाग्रं धूःस्तम्भे दग्धधूपाः प्रहितसुमनसो गोचरे कूबरस्य । चर्चाश्चक्रे चरन्त्यो मलयजपयसा सिद्धवध्वस्त्रिसन्ध्यं
    वर् चर्चां वन्दन्ते यं द्युमार्गे स नुदतु दुरितान्यंशुमत्स्यन्दनो वः ॥ ॥ उत्कीर्णस्वर्णरेणुद्रुतखुरदलिता
    पार्श्वयोः शश्वदश्वै वर् रेणुर्द्रुत रश्रान्तभ्रान्तचक्रक्रमनिखिलमिलन्नेमिनिम्ना भरेण । मेरोर्मूर्धन्यघं
    वो विघटयतु रवेरेकवीथी रथस्य स्वोष्मोदक्ताम्बुरिक्तप्रकटितपुलिनोद्धूसरा स्वर्धुनीव ॥ ॥ वर् स्वोष्मोदस्ताम्बु
    नन्तुं नाकालयानामनिशमनुयतां पद्धतिः पङ्क्तिरेव वर् उपयतां क्षोदो नक्षत्रराशेरदयरयमिलच्चक्रपिष्टस्य
    धूलिः । हेषह्लादो हरीणां सुरशिखरिदरीः पूरयन्नेमिनादो वर् नादो यस्याव्यात्तीव्रभानोः स दिवि भुवि यथा
    व्यक्तचिह्नो रथो वः ॥ ॥ निःस्पन्दानां विमानावलिविततदिवां देववृन्दारकाणां वर् वलितदिशा वृन्दैरानन्दसान्द्रोद्यममपि
    वहतां विन्दतां वन्दितुं नो । मन्दाकिन्याममन्दः पुलिनभृति मृदुर्मन्दरे मन्दिराभे वर् मन्दराभे मन्दारैर्मण्डितारं
    दधदरि दिनकृत्स्यन्दनः स्तान्मुदे वः ॥ ॥ चक्री चक्रारपङ्क्तिं हरिरपि च हरीन् धूर्जटिर्धूर्ध्वजान्ता
    नक्षं नक्षत्रनाथोऽरुणमपि वरुणः कूबराग्रं कुबेरः । रंहः सङ्घः सुराणां जगदुपकृतये नित्ययुक्तस्य यस्य
    स्तौति प्रीतिप्रसन्नोऽन्वहमहिमरुचेः सोऽवतात्स्यन्दनो वः ॥ ॥ वर् रुच नेत्राहीनेन मूले विहितपरिकरः सिद्धसाध्यैर्मरुद्भिः
    पादोपान्ते स्तुतोऽलं बलिहरिरभसाकर्षणाबद्धवेगः । भ्राम्यन्व्योमाम्बुराशावशिशिरकिरणस्यन्दनः सन्ततं वो
    दिश्याल्लक्ष्मीमपारामतुलितमहिमेवापरो मन्दराद्रिः ॥ ॥ वर् अतुल्यां ॥ इति रथवर्णनम् ॥ ॥ अथ मण्डलवर्णनम्
    ॥ यज्ज्यायो बीजमह्नामपहततिमिरं चक्षुषामञ्जनं य वर् ज्यायो यद्बीजमह्नामपहृत द्द्वारं यन्मुक्तिभाजां
    यदखिलभुवनज्योतिषामेकमोकः । यद्वृष्ट्यम्भोनिधानं धरणिरससुधापानपात्रं महद्य द्दिश्यादीशस्य भासां तदधीकलमलं
    मङ्गलं मण्डलं वः ॥ ॥ वर् देवस्य भानोः तदधिकममलं मण्डलं मङ्गलं वेलावर्धिष्णु सिन्धोः पय इव खमिवार्धोद्गताग्य्रग्रहोडु
    स्तोकोद्भिन्नस्वचिह्नप्रसवमिव मधोरास्यमस्यन्मनांसि । वर् महांसि प्रातः पूष्णोऽशुभानि प्रशमयतु शिरःशेखरीभूतमद्रेः
    पौरस्त्यस्योद्गभस्तिस्तिमिततमतमःखण्डनं मण्डलं वः ॥ ॥ प्रत्युप्तस्तप्तहेमोज्ज्वलरुचिरचलः पद्मरागेण
    येन ज्यायः किञ्जल्कपुञ्जो यदलिकुलशितेरम्बरेन्दीवरस्य । कालव्यालस्य चिह्नं महिततममहोमूर्न्धि रत्नं
    महद्य द्दीप्तांशोः प्रातरव्यात्तदविकलजगन्मण्डनं मण्डलं वः ॥ ॥ कस्त्राता तारकाणां पतति तनुरवश्यायबिन्दुर्यथेन्दु
    र्विद्राणा दृक्स्मरारेरुरसि मुररिपोः कौस्तुभो नोद्गभस्तिः । वह्नेः सापह्नवेव द्युतिरुदयगते यत्र तन्मण्डलं
    वो मार्तण्डीयं पुनीताद्दिवि भुवि च तमांसीव मृष्णन्महांसि ॥ ॥ यत्प्राच्यां प्राक्चकास्ति प्रभवति च
    यतः प्राच्यसावुज्जिहाना दिद्धं मध्ये यदह्नो भवति ततरुचा येन चोत्पाद्यतेऽहः । यत्पर्यायेण लोकानवति
    च जगतां जीवितं यच्च तद्वो विश्वानुग्राहि विश्वं सृजदपि च रवेर्मण्डलं मुक्तयेऽस्तु ॥ ॥ शुष्यन्त्यूढानुकारा
    मकरवसतयो मारवीणां स्थलीनां येनोत्तप्ताः स्फुटन्तस्तडिति तिलतुलां यान्त्यगेन्द्रा युगान्ते । वर् चटिति
    तच्चण्डांशोरकाण्डत्रिभुवनदहनाशङ्कया धाम कृच्छात् वर् कृत्स्नं संहृत्यालोकमात्रं प्रलघु विदधतः स्तान्मुदे
    मण्डलं वः ॥ ॥ वर् आहृत्यालोकमात्रं प्रतनु उद्यद्द्यूद्यानवाप्यां बहुलतमतमःपङ्कपूरं विदार्य वर् बहल
    प्रोद्भिन्नं पत्रपार्श्वेष्वविरलमरुणच्छायया विस्फुरन्त्या । कल्याणानि क्रियाद्वः कमलमिव महन्मण्डलं
    चण्डभानो वर् चण्डरश्मेः रन्वीतं तृप्तिहेतोरसकृदलिकुलाकारिणा राहुणा यत् ॥ ॥ चक्षुर्दक्षद्विषो यन्न
    तु दहति पुरः पूरयत्येव कामं वर् न दहति नितरां पुनः नास्तं जुष्टं मरुद्भिर्यदिह नियमिनां यानपात्रं
    भवाब्धौ । यद्वीतश्रान्ति शश्वद्भ्रमदपि जगतां भ्रान्तिमभ्रान्ति हन्ति ब्रध्नस्याख्याद्विरुद्धक्रियमथ
    च हिताधायि तन्मण्डलं वः ॥ ॥ ॥ इति मण्डलवर्णनम् ॥ ॥ अथ सूर्यवर्णनम् । सिद्धैः सिद्धान्तमिश्रं श्रितविधि
    विबुधैश्चारणैश्चाटुगर्भं गीत्या गन्धर्वमुख्यैर्मुहुरहिपतिभिर्यातुधानैर्यतात्म । सार्धं साध्यैर्मुनीन्द्रैर्मुदितमतमनो
    मोक्षिभिः पक्षपाता वर् मोक्षुभिः त्प्रातः प्रारभ्यमाणस्तुतिरवतु रविर्विश्ववन्द्योदयो वः ॥ ॥ भासामासन्नभावादधिकतरपटोश्चक्रवालस्य
    तापा च्छेदादच्छिन्नगच्छत्तुरगखुरपुटन्यासनिःशङ्कटङ्कैः । वर् न्यस्त निःसङ्गस्यन्दनाङ्गभ्रमणनिकषणात्पातु
    वस्त्रिप्रकारं वर् त्रिप्रकारैः तप्तांशुस्तत्परीक्षापर इव परितः पर्यटन्हाटकाद्रिम् ॥ ॥ नो शुष्कं नाकनद्या
    विकसितकनकाम्भोजया भ्राजितं तु वर् कनकाम्भोरुहा प्लुष्टा नैवोपभोग्या भवति भृशतरं नन्दनोद्यानलक्ष्मीः
    । नो शृङ्गाणि द्रुतानि द्रुतममरगिरेः कालधौतानि धौता नीद्धं धाम द्युमार्गे म्रदयति दयया यत्र सोऽर्कोऽवताद्वः
    ॥ ॥ ध्वान्तस्यैवान्तहेतुर्न भवति मलिनैकात्मनः पाप्मनोऽपि प्राक्पादोपान्तभाजां जनयति न परं पङ्कजानां
    प्रबोधम् । कर्ता निःश्रेयसानामपि न तु खलु यः केवलं वासराणां सोऽव्यादेकोद्यमेच्छाविहितबहुबृहद्विश्वकार्योऽर्यमा
    वः ॥ ॥ लोटँल्लोष्टाविचेष्टः श्रितशयनतलो निःसहीभूतदेहः सन्देही प्राणितव्ये सपदि दश दिशः प्रेक्षमाणोऽन्धकाराः
    । निःश्वासायासनिष्ठः परमपरवशो जायते जीवलोकः वर् चिरतरवशो शोकेनेवान्यलोकानुदयकृति गते यत्र सोऽर्कोऽवताद्वः
    ॥ ॥ वर् लोकाभ्युदय क्रामँल्लोलोऽपि लोकाँस्तदुपकृतिकृतावाश्रितः स्थैर्यकोटिं नॄणां दृष्टिं विजिह्मां
    विदधदपि करोत्यन्तरत्यन्तभद्राम् । यस्तापस्यापि हेतुर्भवति नियमिनामेकनिर्वाणदायी भूयात्स प्रागवस्थाधिकतरपरिणामोदयोऽर्कः
    श्रिये वः ॥ ॥ व्यापन्नर्तुर्न कालो व्यभिचरति फलं नौषधीर्वृष्टिरिष्टा नैष्टैस्तृप्यन्ति देवा न हि वहति
    मरुन्निर्मलाभानि भानि । आशाः शान्ता न भिन्दन्त्यवधिमुदधयो बिभ्रति क्ष्माभृतः क्ष्मां यस्मिंस्त्रैलोक्यमेवं
    न चलति तपति स्तात्स सूर्यः श्रिये वः ॥ ॥ कैलासे कृत्तिवासा विहरति विरहत्रासदेहोढकान्तः श्रान्तः शेते
    महाहावधिजलधि विना छद्मना पद्मनाभः । योगोद्योगैकतानो गमयति सकलं वासरं स्वं स्वयम्भू र्भूरित्रैलोक्याचिन्ताभृति
    भुवनविभौ यत्र भास्वान्स वोऽव्यात् ॥ ॥ एतद्यन्मण्डलं खे तपति दिनकृतस्ता ऋचोऽर्चींषि यानि द्योतन्ते
    तानि सामान्ययमपि पुरुषो मण्डलेऽणुर्यजूंषि । एवं यं वेद वेदत्रितयमयमयं वेदवेदी समग्रो वर्गः स्वर्गापवर्गप्रकृतिरविकृतिः
    सोऽस्तु सूर्यः श्रिये वः ॥ ॥ नाकौकःप्रत्यनीकक्षतिपटुमहसां वासवाग्रेसराणां सर्वेषां साधु पातां जगदिदमदितेरात्मजत्वे
    समेऽपि । येनादित्याभिधानं निरतिशयगुणैरात्मनि न्यस्तमस्तु वर् गुणेनात्मनि स्तुत्यस्त्रैलोक्यवन्द्यैस्त्रिदशमुनिगणैः
    सोंऽशुमान् श्रेयसे वः ॥ ॥ भूमिं धाम्नोऽभिवृष्ट्या जगति जलमयीं पावनीं संस्मृताव वर् धाम्नोऽथ प्याग्नेयीं
    दाहशक्त्या मुहुरपि यजमानां यथाप्रार्थितार्थैः । वर् यजमानात्मिकां लीनामाकाश एवामृतकरघटितां ध्वान्तपक्षस्य
    पर्व ण्वेवं सूर्योऽष्टभेदां भव इव भवतः पातु बिभ्रत्स्वमूर्तिम् ॥ ॥ प्राक्कालोन्निद्रपद्माकरपरिमलनाविर्भवत्पादशोभो
    भक्त्या त्यक्तोरुखेदोद्गति दिवि विनतासूनुना नीयमानः । सप्ताश्वाप्तापरान्तान्यधिकमधरयन्यो जगन्ति स्तुतोऽलं
    देवैर्देवः स पायादपर इव मुरारातिरह्नां पतिर्वः ॥ ॥ यः स्रष्टाऽपां पुरस्तादचलवरसमभ्युन्नतेर्हेतुरेको
    लोकानां यस्त्रयाणां स्थित उपरि परं दुर्विलङ्घ्येन धाम्ना । वर् च त्रयाणां सद्यः सिद्ध्यै प्रसन्नद्युतिशुभचतुराशामुखः
    स्ताद्विभक्तो वर् शुचि द्वेधा वेधा इवाविष्कृतकमलरुचिः सोऽर्चिषामाकरो वः ॥ ॥ साद्रिद्यूर्वीनदीशा दिशति
    दश दिशो दर्शयन्प्राग्दृशो यः वर् द्राक् दृशो सादृश्यं दृश्यते नो सदशशतदृशि त्रैदशे यस्य देशे । दीप्तांशुर्वः
    स दिश्यादशिवयुगदशादर्शितद्वादशात्मा शं शास्त्यश्वांश्च यस्याशयविदतिशयाद्दन्दशूकाशनाद्यः ॥ ॥ तीर्थानि
    व्यर्थकानि हृदनदसरसीनिर्झराम्भोजिनीनां नोदन्वन्तो नुदन्ति प्रतिभयमशुभश्वभ्रपातानुबन्धि । आपो नाकापगाया
    अपि कलुषमुषो मज्जतां नैव यत्र वर् स्वर्गापगायाः त्रातुं यातेऽन्यलोकान् स दिशतु दिवसस्यैकहेतुर्हितं
    वः ॥ ॥ वर् लोकं एतत्पातालपङ्कप्लुतमिव तमसैवैकमुद्गाढमासी दप्रज्ञाताप्रतर्क्यं निरवगति तथालक्षणं सुप्तमन्तः
    । यादृक्सृष्टेः पुरस्तान्निशि निशि सकलं जायते तादृगेव त्रैलोक्यं यद्वियोगादवतु रविरसौ सर्गतुल्योदयो
    वः ॥ ॥ द्वीपे योऽस्ताचलोऽस्मिन्भवति खलु स एवापरत्रोदयाद्रि र्या यामिन्युज्ज्वलेन्दुद्युतिरिह दिवसोऽन्यत्र
    तीव्रातपः सा । यद्वश्यौ देशकालाविति नियमयतो नो तु यं देशकाला वर् नु वव्यात्स स्वप्रभुत्वाहितभुवनहितो
    हेतुरह्नामिनो वः ॥ ॥ व्यग्रैरग्र्यग्रहेन्दुग्रसनगुरु भरैर्नो समग्रैरुदग्रैः वर् गुरुतरैः प्रत्यग्रैरीषदुग्रैरुदयगिरिगतो
    गोगणैर्गौरयन् गाम् । उद्गाढार्चिर्विलीनामरनगरनगग्रावगर्भामिवाह्ना मग्रे श्रेयो विधत्ते ग्लपयतु गहनं
    स ग्रहग्रामणीर्वः ॥ ॥ योनिः साम्नां विधाता मधुरिपुरजितो धूर्जटिः शङ्करोऽसौ मृत्युः कालोऽलकायाः पतिरपि
    धनदः पावको जातवेदाः । इत्थं सञ्ज्ञा डवित्थादिवदमृतभुजां या यदृच्छाप्रवृत्ता स्तासामेकोऽभिधेयस्तदनुगुणगुणैर्यः
    स सूर्योऽवताद्वः ॥ ॥ वर् गणैः देवः किं बान्धवः स्यात्प्रियसुहृदथवाऽऽचार्य आहोस्विदर्यो वर् आर्यः रक्षा
    चक्षुर्नु दीपो गुरुरुत जनको जीवितं बीजमोजः । एवं निर्णीयते यः क इव न जगतां सर्वथा सर्वदाऽसौ वर् सर्वदाः
    सर्वाकारोपकारी दिशतु दशशताभीषुरभ्यर्थितं वः ॥ ॥ श्लोका लोकस्य भूत्यै शतमिति रचिताः श्रीमयूरेण भक्त्या
    युक्तश्चैतान्पठेद्यः सकृदपि पुरुषः सर्वपापैर्विमुक्तः । आरोग्यं सत्कवित्वं मतिमतुलबलं कान्तिमायुःप्रकर्षं
    विद्यामैश्वर्यमर्थं सुतमपि लभते सोऽत्र सूर्यप्रसादात् ॥ ॥ इति श्रीमयूरकविप्रणीतं सूर्यशतकं समाप्तम्
    ।
