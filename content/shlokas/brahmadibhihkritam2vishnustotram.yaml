id: brahmadibhihkritam2vishnustotram
category: stotram
name:
  english: brahmadibhihkritam2vishnustotram
  devanagari: ब्रह्मादिभिःकृतं२विष्णुस्तोत्रम्
content:
  english: brahmadibhih kritam 2 vishnustotram brahmadaya ucuh | jaya vishno kripasindho jaya tamarasekshana
    | jaya lokaikavarada jaya bhaktartibhanjana || 26|| anantamaksharam shantamavanmanasagocaram | ko
    va bhavantam janati cidanandamayatmakam || 27|| anoranutaram sthulatsthulam sarvantarasthitam | tvamamananti
    purusham prakriteh paramacyutam || 28|| vedantasararupam tvam sarvantarbahyavartinam | ko hi varnayitum
    shakto mayayatteshu dehishu || 29|| bhavadiyamidam rupam drishtvatibhayadayakam | bhayodvigna vayam
    sarve shantam rupam bhajasva ha || 1
  devanagari: ब्रह्मादिभिः कृतं २ विष्णुस्तोत्रम् ब्रह्मादय ऊचुः । जय विष्णो कृपासिन्धो जय तामरसेक्षण
    । जय लोकैकवरद जय भक्तार्तिभञ्जन ॥ २६॥ अनन्तमक्षरं शान्तमवाङ्मनसगोचरम् । को वा भवन्तं जानाति चिदानन्दमयात्मकम्
    ॥ २७॥ अणोरणुतरं स्थूलात्स्थूलं सर्वान्तरस्थितम् । त्वामामनन्ति पुरुषं प्रकृतेः परमाच्युतम् ॥ २८॥ वेदान्तसाररूपं
    त्वां सर्वान्तर्बाह्यवर्तिनम् । को हि वर्णयितुं शक्तो मायायत्तेषु देहिषु ॥ २९॥ भवदीयमिदं रूपं दृष्ट्वातिभयदायकम्
    । भयोद्विग्ना वयं सर्वे शान्तं रूपं भजस्व ह ॥ १
meaning: {}
