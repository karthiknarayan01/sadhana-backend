id: suryakritambhavanimanga-ashtakastotram
category: stotram
name:
  english: suryakritambhavanimangaḻashtakastotram
  devanagari: सूर्यकृतंभवानीमन्गळाष्टकस्तोत्रम्
content:
  english: suryakritam bhavanimangaḻashtakastotram raviruvaca | devi tvadiyacaranambujarenugaurim bhalasthalim
    vahati yah pranatipravinah | janmantare'pi rajanikaracarulekha tam gaurayatyatitaram kila tasya pumsah
    || 55|| shrimangale sakalamangalajanmabhume shrimangale sakalakalmashatulavahne | shrimangale sakaladanavadarpahantri
    shrimangale'khilamidam paripahi vishvam || 56|| vishveshvari tvamasi vishvajanasya kartri tvam palayitryasi
    tatha pralaye'pihantri | tvannamakirtanasamullasadacchapunya srotasvini harati patakakulavrikshan
    || 57|| matarbhavani bhavati bhavativraduhkha
  devanagari: सूर्यकृतं भवानीमङ्गळाष्टकस्तोत्रम् रविरुवाच । देवि त्वदीयचरणाम्बुजरेणुगौरीं भालस्थलीं वहति
    यः प्रणतिप्रवीणः । जन्मान्तरेऽपि रजनीकरचारुलेखा तां गौरयत्यतितरां किल तस्य पुंसः ॥ ५५॥ श्रीमङ्गले
    सकलमङ्गलजन्मभूमे श्रीमङ्गले सकलकल्मषतूलवह्ने । श्रीमङ्गले सकलदानवदर्पहन्त्रि श्रीमङ्गलेऽखिलमिदं परिपाहि
    विश्वम् ॥ ५६॥ विश्वेश्वरि त्वमसि विश्वजनस्य कर्त्री त्वं पालयित्र्यसि तथा प्रलयेऽपिहन्त्री । त्वन्नामकीर्तनसमुल्लसदच्छपुण्या
    स्रोतस्विनी हरति पातककूलवृक्षान् ॥ ५७॥ मातर्भवानि भवती भवतीव्रदुःख
meaning: {}
