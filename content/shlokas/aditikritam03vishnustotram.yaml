id: aditikritam03vishnustotram
category: stotram
name:
  english: aditikritam03vishnustotram
  devanagari: अदितिकृतं०३विष्णुस्तोत्रम्
content:
  english: aditikritam 3 vishnustotram aditiruvaca | namaste devadevesha sarvavyapinjanardana | sattvadigunabhedena
    lokavyaparakarana || 19|| namaste bahurupayarupaya mahatmane | sarvaikaruparupaya nirgunaya gunatmane
    || 20|| namaste lokanathaya paramajnanarupine | sadbhaktajanavatsalyashaline mangalatmane || 21||
    yasyavatararupani hyarcayanti munishvarah | tamadipurusham devam namami hyarthasiddhaye || 22|| shrutayo
    yam na jananti na jananti ca surayah | tam namami jagaddhetum samayam capyamayinam || 23|| yasyavalokanam
    citram mayopadravakaranam | jagadrupam jagaddhetum tam vande sarvavanditam || 24|| yatpadambujakinjalkasevarakshitamastakah
    | avapuh paramam siddhim tam vande kamaladhavam || 25|| yasya brahmadayo deva mahimanam na vai viduh
    | atyasannam ca bhaktanam tam vande bhaktasanginam || 26|| yo devastyaktasanganam shantanam karunarnavah
    | karoti hyatmanah sangam tam devam sangavarjitam || 27|| yajneshvaram yajnakarma yajnakarmasu nishthitam
    | namami yajnaphaladam yajnakarmaprabodhakam || 28|| ajamilo'pi papatma yannamoccaranadanu | praptavanparamam
    dhama tam vande lokasakshinam || 29|| harirupi mahadevah shivarupi janardanah | iti lokasya neta yastam
    namami jagadgurum || 30|| brahmadya api devesha yanmayapashayantritah | na jananti param bhavam tam
    vande sarvanayakam || 31|| hritpadmastho'pi yogyanam durastha iva bhasate | pramanatitasadbhavastam
    vande jnanasakshinam || 32|| yanmukhadbrahmano jato bahubhyam kshatriyo'jani | urvorvaishyah samutpannah
    padbhyam shudro'bhyajayata || 33|| manasashcandrama jato jatah suryashca cakshushah | mukhadagnistathendrashca
    pranadvayurajayata || 34|| rigyajuhsamarupaya satyasvaragatatmane | shadangarupine tubhyam bhuyo bhuyo
    namo namah || 35|| iti naradapurane purvabhage ekadashadhyayantargatam aditikritam vishnustotram samaptam
    | brihannaradiyapurana | purvabhaga | adhyaya 10|| 11
  devanagari: अदितिकृतं ३ विष्णुस्तोत्रम् अदितिरुवाच । नमस्ते देवदेवेश सर्वव्यापिञ्जनार्दन । सत्त्वादिगुणभेदेन
    लोकव्यापारकारण ॥ १९॥ नमस्ते बहुरूपायारूपाय महात्मने । सर्वैकरूपरूपाय निर्गुणाय गुणात्मने ॥ २०॥ नमस्ते
    लोकनाथाय परमज्ञानरूपिणे । सद्भक्तजनवात्सल्यशालिने मङ्गलात्मने ॥ २१॥ यस्यावताररूपाणि ह्यर्चयन्ति मुनीश्वराः
    । तमादिपुरुषं देवं नमामि ह्यर्थसिद्धये ॥ २२॥ श्रुतयो यं न जानन्ति न जानन्ति च सूरयः । तं नमामि जगद्धेतुं
    समायं चाप्यमायिनम् ॥ २३॥ यस्यावलोकनं चित्रं मायोपद्रवकारणम् । जगद्रूपं जगद्धेतुं तं वन्दे सर्ववन्दितम्
    ॥ २४॥ यत्पादाम्बुजकिञ्जल्कसेवारक्षितमस्तकाः । अवापुः परमां सिद्धिं तं वन्दे कमलाधवम् ॥ २५॥ यस्य ब्रह्मादयो
    देवा महिमानं न वै विदुः । अत्यासन्नं च भक्तानां तं वन्दे भक्तसङ्गिनम् ॥ २६॥ यो देवस्त्यक्तसङ्गानां
    शान्तानं करुणार्णवः । करोति ह्यात्मनः सङ्गं तं देवं सङ्गवर्जितम् ॥ २७॥ यज्ञेश्वरं यज्ञकर्म यज्ञकर्मसु
    निष्ठितम् । नमामि यज्ञफलदं यज्ञकर्मप्रबोधकम् ॥ २८॥ अजामिलोऽपि पापात्मा यन्नामोच्चारणादनु । प्राप्तवान्परमं
    धाम तं वन्दे लोकसाक्षिणम् ॥ २९॥ हरिरूपी महादेवः शिवरूपी जनार्दनः । इति लोकस्य नेता यस्तं नमामि जगद्गुरुम्
    ॥ ३०॥ ब्रह्माद्या अपि देवेशा यन्मायापाशयन्त्रिताः । न जानन्ति परं भावं तं वन्दे सर्वनायकम् ॥ ३१॥ हृत्पद्मस्थोऽपि
    योग्यानां दूरस्थ इव भासते । प्रमाणातीतसद्भावस्तं वन्दे ज्ञानसाक्षिणम् ॥ ३२॥ यन्मुखाद्ब्राह्मणो जातो
    बाहुभ्यां क्षत्रियोऽजनि । ऊर्वोर्वैश्यः समुत्पन्नः पद्भ्यां शूद्रोऽभ्यजायत ॥ ३३॥ मनसश्चन्द्रमा जातो
    जातः सूर्यश्च चक्षुषः । मुखादग्निस्तथेन्द्रश्च प्राणाद्वायुरजायत ॥ ३४॥ ऋग्यजुःसामरूपाय सत्यस्वरगतात्मने
    । षडङ्गरूपिणे तुभ्यं भूयो भूयो नमो नमः ॥ ३५॥ इति नारदपुराणे पूर्वभागे एकादशाध्यायान्तर्गतं अदितिकृतं
    विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय १०॥ ११
