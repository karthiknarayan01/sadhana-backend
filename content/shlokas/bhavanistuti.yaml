id: bhavanistuti
category: stotram
name:
  english: bhavanistuti
  devanagari: भवानीस्तुति
content:
  english: pralayakaranatam vrajanti | lavanyavarinidhivi cipariplutayai tasyai namo'stu satatam haravallabhayai
    || 2|| paulastyapinabhujasampadudasyamanakailasasambhramaviloladrishah priyayah | shreyamsivodishatunihanutakopacihnamalimganotpulakabhasitamindumauleh
    || 3|| dishyanmahasurashirah sarasipsitani premkhannakhavalimayukhamrinalanalam | candayashcalaccatulanupuracamcarikajhamkarahari
    caranamburuhadvayam vah || 4|| || iti bhavani stuti sampurna ||
  devanagari: प्रलयकारणतां व्रजन्ति । लावण्यवारिनिधिवी चिपरिप्लुतायै तस्यै नमोऽस्तु सततं हरवल्लभायै ॥
    २॥ पौलस्त्यपीनभुजसम्पदुदस्यमानकैलाससम्भ्रमविलोलदृशः प्रियायाः । श्रेयांसिवोदिशतुनिहनुतकोपचिह्नमालिंगनोत्पुलकभासितमिन्दुमौलेः
    ॥ ३॥ दिश्यान्महासुरशिरः सरसीप्सितानि प्रेंखन्नखावलिमयूखमृणालनालम् । चण्डयाश्चलच्चटुलनूपुरचंचरीकझांकारहारि
    चरणाम्बुरूहद्वयं वः ॥ ४॥ ॥ इति भवानी स्तुति सम्पूर्णा ॥
meaning: {}
