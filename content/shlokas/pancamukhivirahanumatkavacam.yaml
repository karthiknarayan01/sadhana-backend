id: pancamukhivirahanumatkavacam
category: kavacha
name:
  english: pancamukhivirahanumatkavacam
  devanagari: पन्चमुखिवीरहनूमत्कवचम्
content:
  english: rinu sarvangasundari | yatkritam devadeveshi dhyanam hanumatah param || 1|| pancavaktram mahabhimam
    tripancanayanairyutam | bahubhirdashabhiryuktam sarvakamarthasiddhidam || 2|| purvam tu vanaram vaktram
    kotisuryasamaprabham | damshtrakaralavadanam bhrukutikutilekshanam || 3|| anyattu dakshinam vaktram
    narasimham mahadbhutam | atyugratejojvalitam bhishanam bhayanashanam || 4|| pashcimam garudam vaktram
    vajrakundam mahabalam | sarvanagaprashamanam vishabhutadikrintanam || 5|| uttaram saukaram vaktram
    krishnam diptam mahojjvalam | patalasiddhivetalajvararogadikrintanam || 6|| urdhvam hayananam ghoram
    danavantakaram param | etatpancamukham tasya dhyayatamabhayankaram || khadgam trishulam khatvangam
    pashankushasuparvatam | mushtidrumagadabhindipalajnanena samyutam || 8|| etanyayudhajalani dharayantam
    yajamahe | pretasanopavishtam tu sarvabharanabhushitam || 9|| divyamalambaradharam divyagandhanulepanam
    | sarvashcaryamayam devamanantam vishvatomukham || 10|| pancasyamacyutamanekavicitraviryam shrishankhacakraramaniyabhujagradesham
    | pitambaram makutakundalanupurangam udyotitam kapivaram hridi bhavayami || 11|| markatesha mahotsaha
    sarvashokavinashaka | shatrun samhara mam raksha shriyam dapaya me prabho || 12|| harimarkatamarkatamantramimam
    parilikhyati likhyati bhumitale | yadi nashyati nashyati shatrukulam yadi muncati muncati vamakarah
    || 13|| iti dhyanam shripancamukhahanumatkavacastotramahamantrapathanam karishye om harimarkatamahamarkataya
    om vam vam vam vam vam vam phat phe phe svaha | om harimarkatamahamarkataya om gham gham gham gham
    gham gham phat phe phe svaha | om harimarkatamahamarkataya om khem khem khem khem khem khem phat phe
    phe maranaya svaha | om harimarkatamarkataya om tham tham tham tham tham tham phat phe phe stambhanaya
    svaha | om harimarkatamarkataya om om om om om om phat phe phe akarshanasatvakaya svaha | om harimarkatamarkatamantramidam
    parilikhyati likhyati bhumitale | yadi nashyati nashyati vamakare parimuncati muncati sha
  devanagari: ृणु सर्वाङ्गसुन्दरि । यत्कृतं देवदेवेशि ध्यानं हनुमतः परम् ॥ १॥ पञ्चवक्त्रं महाभीमं त्रिपञ्चनयनैर्युतम्
    । बाहुभिर्दशभिर्युक्तं सर्वकामार्थसिद्धिदम् ॥ २॥ पूर्वं तु वानरं वक्त्रं कोटिसूर्यसमप्रभम् । दंष्ट्राकरालवदनं
    भ्रुकुटीकुटिलेक्षणम् ॥ ३॥ अन्यत्तु दक्षिणं वक्त्रं नारसिंहं महाद्भुतम् । अत्युग्रतेजोज्वलितं भीषणं
    भयनाशनम् ॥ ४॥ पश्चिमं गारुडं वक्त्रं वज्रकुण्डं महाबलम् । सर्वनागप्रशमनं विषभूतादिकृन्तनम् ॥ ५॥ उत्तरं
    सौकरं वक्त्रं कृष्णं दीप्तं महोज्ज्वलम् । पातालसिद्धिवेतालज्वररोगादिकृन्तनम् ॥ ६॥ ऊर्ध्वं हयाननं घोरं
    दानवान्तकरं परम् । एतत्पञ्चमुखं तस्य ध्यायतामभयङ्करम् ॥ खड्गं त्रिशूलं खट्वाङ्गं पाशाङ्कुशसुपर्वतम्
    । मुष्टिद्रुमगदाभिन्दिपालज्ञानेन संयुतम् ॥ ८॥ एतान्यायुधजालानि धारयन्तं यजामहे । प्रेतासनोपविष्टं
    तु सर्वाभरणभूषितम् ॥ ९॥ दिव्यमालाम्बरधरं दिव्यगन्धानुलेपनम् । सर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम्
    ॥ १०॥ पञ्चास्यमच्युतमनेकविचित्रवीर्यं श्रीशङ्खचक्ररमणीयभुजाग्रदेशम् । पीताम्बरं मकुटकुण्डलनूपुराङ्गं
    उद्योतितं कपिवरं हृदि भावयामि ॥ ११॥ मर्कटेश महोत्साह सर्वशोकविनाशक । शत्रून् संहर मां रक्ष श्रियं
    दापय मे प्रभो ॥ १२॥ हरिमर्कटमर्कटमन्त्रमिमं परिलिख्यति लिख्यति भूमितले । यदि नश्यति नश्यति शत्रुकुलं
    यदि मुञ्चति मुञ्चति वामकरः ॥ १३॥ इति ध्यानम् श्रीपञ्चमुखहनुमत्कवचस्तोत्रमहामन्त्रपठनं करिष्ये ॐ हरिमर्कटमहामर्कटाय
    ॐ वं वं वं वं वं वं फट् फे फे स्वाहा । ॐ हरिमर्कटमहामर्कटाय ॐ घं घं घं घं घं घं फट् फे फे स्वाहा ।
    ॐ हरिमर्कटमहामर्कटाय ॐ खें खें खें खें खें खें फट् फे फे मारणाय स्वाहा । ॐ हरिमर्कटमर्कटाय ॐ ठं ठं
    ठं ठं ठं ठं फट् फे फे स्तम्भनाय स्वाहा । ॐ हरिमर्कटमर्कटाय ॐ ॐ ॐ ॐ ॐ ॐ फट् फे फे आकर्षणसत्वकाय स्वाहा
    । ॐ हरिमर्कटमर्कटमन्त्रमिदं परिलिख्यति लिख्यति भूमितले । यदि नश्यति नश्यति वामकरे परिमुञ्चति मुञ्चति
    श
