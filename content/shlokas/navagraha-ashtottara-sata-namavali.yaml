id: navagraha-ashtottara-sata-namavali
category: stotram
name:
  english: Navagraha Ashtottara Sata Namavali
  devanagari: नवग्रहाष्टोत्तरशतनामावलिः २ (भानवे हंसाय भास्कराय)
content:
  english: om bhanave namah | hamsaya | bhaskaraya | suryaya | suraya | tamoharaya | rathine | vishvadhrite
    | avyaptre | haraya | vedamayaya | vibhave | sudhamshave | shubhramshave | candraya | abjanetrasamudbhavaya
    | taradhipaya | rohinishaya | shambhumurtikritalayaya | aushadhidyaya namah || 20|| om aushadhipataye
    namah | ishvaradharaya | sudhanidhaye | sakalahladanakaraya | bhaumaya | bhumisutaya | bhutamanyaya
    | (bhutamanyasamubhavaya) | samud|hbhavaya | aryaya | agnikrite | rohitangakaya | raktavastradharaya
    | shucaye | mangalaya | angarakaya | raktamaline | mayavisharadaya | budhaya | tarasutaya | saumyaya
    namah || 40|| om rohinigarbhasambhutaya namah | candratmajaya | somavamshakaraya | shrutivisharadaya
    | satyasandhaya | satyasindhave | vidhusutaya | vibudhaya | vibhave | vakkrite | brahmanaya | (brahmanyaya)
    brahmane | dhishanaya | shubhaveshadharaya | gishpataye | gurave | indrapurohitaya | jivaya | nirjarapujitaya
    | pitambaralankritaya namah || 60|| om bhrigave namah | bhargavasambhutaya | nishacaragurave | kavaye
    | bhrityakhedaharaya | bhrigusutaya | varshakrite | dinarajyadaya | shukraya | shukrasvarupaya | rajyadaya
    | layakrite | konaya | shanaishcaraya | mandaya | chayahridayanandanaya | martandajaya | pangave |
    bhanutanudbhavaya | yamanujaya namah || 80|| om adipyakrite namah | nilaya | suryavamshajaya | nirmanadehaya
    | rahave | svarbhanave | adityacandradveshine | bhujangamaya | simhideshaya | gunavate | ratripatipiditaya
    | ahiraje | shirohinaya | vishadharaya | mahakayaya | mahabhutaya | brahmane | brahmasambhutaya |
    ravikrite | rahurupadhrite namah || 100|| om ketave namah | ketusvarupaya | khecaraya | kagrutalayaya
    | brahmavide | brahmaputraya | kumarakaya | brahmanapritaya namah || 108 iti navagrahashtottarashatanamavalih
    samapta |
  devanagari: ॐ भानवे नमः । हंसाय । भास्कराय । सूर्याय । सूराय । तमोहराय । रथिने । विश्वधृते । अव्याप्त्रे
    । हराय । वेदमयाय । विभवे । सुधांशवे । शुभ्रांशवे । चन्द्राय । अब्जनेत्रसमुद्भवाय । ताराधिपाय । रोहिणीशाय
    । शम्भुमूर्तिकृतालयाय । औषधीड्याय नमः ॥ २०॥ ॐ औषधीपतये नमः । ईश्वरधराय । सुधानिधये । सकलाह्लादनकराय
    । भौमाय । भूमिसुताय । भूतमान्याय । (भूतमान्यसमुभवाय) । समुद्।ह्भवाय । आर्याय । अग्निकृते । रोहिताङ्गकाय
    । रक्तवस्त्रधराय । शुचये । मङ्गलाय । अङ्गारकाय । रक्तमालिने । मायाविशारदाय । बुधाय । तारासुताय । सौम्याय
    नमः ॥ ४०॥ ॐ रोहिणीगर्भसम्भूताय नमः । चन्द्रात्मजाय । सोमवंशकराय । श्रुतिविशारदाय । सत्यसन्धाय । सत्यसिन्धवे
    । विधुसुताय । विबुधाय । विभवे । वाक्कृते । ब्राह्मणाय । (ब्रह्मण्याय) ब्रह्मणे । धिषणाय । शुभवेषधराय
    । गीष्पतये । गुरवे । इन्द्रपुरोहिताय । जीवाय । निर्जरपूजिताय । पीताम्बरालङ्कृताय नमः ॥ ६०॥ ॐ भृगवे
    नमः । भार्गवसम्भूताय । निशाचरगुरवे । कवये । भृत्यखेदहराय । भृगुसुताय । वर्षकृते । दीनराज्यदाय । शुक्राय
    । शुक्रस्वरूपाय । राज्यदाय । लयकृते । कोणाय । शनैश्चराय । मन्दाय । छायाहृदयनन्दनाय । मार्ताण्डजाय
    । पङ्गवे । भानुतनूद्भवाय । यमानुजाय नमः ॥ ८०॥ ॐ अदीप्यकृते नमः । नीलाय । सूर्यवंशजाय । निर्माणदेहाय
    । राहवे । स्वर्भानवे । आदित्यचन्द्रद्वेषिणे । भुजङ्गमाय । सिंहिदेशाय । गुणवते । रात्रिपतिपीडिताय ।
    अहिराजे । शिरोहीनाय । विषधराय । महाकायाय । महाभूताय । ब्रह्मणे । ब्रह्मसम्भूताय । रविकृते । राहुरूपधृते
    नमः ॥ १००॥ ॐ केतवे नमः । केतुस्वरूपाय । खेचराय । कग्रुतालयाय । ब्रह्मविदे । ब्रह्मपुत्राय । कुमारकाय
    । ब्राह्मणप्रीताय नमः ॥ १०८ इति नवग्रहाष्टोत्तरशतनामावलिः समाप्ता ।
