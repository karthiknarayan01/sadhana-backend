id: mahopanishat
category: upanishad
name:
  english: mahopanishat
  devanagari: महोपनिषत्
content:
  english: upanishad mahopanishat yanmahopanishadvedyam cidakashataya sthitam | paramadvaitasamrajyam
    tadramabrahma me gatih || om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca
    || sarvani sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranama stvanirakaranam
    mestu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu|| om shantih shantih shantih
    || athato mahopanishadam vyakhyasyamastadahureko ha vai narayana asinna brahma neshano napo nagnishomau
    neme dyavaprithivi na nakshatrani na suryo na candramah | sa ekaki na ramate | tasya dhyanantahsthasya
    yajnastomamucyate | tasminpurushashcaturdasha jayante | eka kanya | dashendriyani mana ekadasham tejah
    | dvadasho'hankarah | trayodashakah pranah | caturdasha atma | pancadashi buddhih | bhutani panca
    tanmatrani | panca mahabhutani | sa ekah pancavimshatih purushah | tatpurusham purusho niveshya nasya
    pradhanasamvatsara jayante | samvatsaradadhijayante | atha punareva narayanah so'nyatkamo manasadhyayata
    | tasya dhyanantahsthasya lalatattryakshah shulapanih purusho jayate | bibhracchriyam yashah satyam
    brahmacaryam tapo vairagyam mana aishvaryam sapranava vyahritaya rigyajuhsamatharvangirasah sarvani
    chandamsi tanyange samashritani | tasmadishano mahadevo mahadevah | atha punareva narayanah so'nyatkamo
    manasadhyayata | tasya dhyanantahsthasya lalatatsvedo'papat | ta imah pratata apah | tatastejo hiranmayamandalam
    | tatra brahma caturmukho'jayata | so'dhyayt | purvabhimukho bhutva bhuriti vyahritirgayatram chanda
    rigvedo'gnirdevata | pashcimabhimukho bhutva bhuvariti vyahritistraishtubham chando yajurvedo vayurdevata
    | uttarabhimukho bhutva svariti vyahritirjagratam chandah samavedah suryo devata | dakshinabhimukho
    bhutva maharitivyahritiranushtabha chando'tharvavedah somo devata | sahasrashirsham devam sahasraksham
    vishvasambhuvam | vishvatah paramam nityam vishvam narayanam harim | vishvamevedam purushastadvishvamupajivati
    | patim vishveshvaram devam samudre vishvarupinam | padmakoshapratikasham lambatyakoshasamnibham |
    hridayam capyadhomukham santatyai sitkarabhishca | tasya madhye mahanarcirvishvarcirvishvatomukham
    | tasya madhye vahnishikha aniyordhva vyavasthita | tasyah shikhaya madhye paramatma vyavasthita |
    sa brahma sa ishanah sendrah so'ksharah paramah svaraditi mahopanishat || iti prathamodhyayah || 1
  devanagari: उपनिषद् महोपनिषत् यन्महोपनिषद्वेद्यं चिदाकाशतया स्थितम् । परमाद्वैतसाम्राज्यं तद्रामब्रह्म
    मे गतिः ॥ ॐ आप्यायन्तु मामाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च ॥ सर्वाणि सर्वं ब्रह्मोपनिषदं
    माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिरकरणम स्त्वनिराकारणं मेस्तु तदात्मनि निरते य उपनिषत्सु
    धर्मास्ते मयि सन्तु ते मयि सन्तु॥ ॐ शान्तिः शान्तिः शान्तिः ॥ अथातो महोपनिषदं व्याख्यास्यमस्तदाहुरेको
    ह वै नारायण आसीन्न ब्रह्मा नेशानो नापो नाग्नीषोमौ नेमे द्यावापृथिवी न नक्षत्राणि न सूर्यो न चन्द्रमाः
    । स एकाकी न रमते । तस्य ध्यानान्तःस्थस्य यज्ञस्तोममुच्यते । तस्मिन्पुरुषाश्चतुर्दश जायन्ते । एका कन्या
    । दशेन्द्रियाणि मन एकादशं तेजः । द्वादशोऽहङ्कारः । त्रयोदशकः प्राणः । चतुर्दश आत्मा । पञ्चदशी बुद्धिः
    । भूतानि पञ्च तन्मात्राणि । पञ्च महाभूतानि । स एकः पञ्चविंशतिः पुरुषः । तत्पुरुषं पुरुषो निवेश्य नास्य
    प्रधानसंवत्सरा जायन्ते । संवत्सरादधिजायन्ते । अथ पुनरेव नारायणः सोऽन्यत्कामो मनसाध्यायत । तस्य ध्यानान्तःस्थस्य
    ललाटात्त्र्यक्षः शूलपाणिः पुरुषो जायते । बिभ्रच्च्ह्रियं यशः सत्यं ब्रह्मचर्यं तपो वैराग्यं मन ऐश्वर्यं
    सप्रणवा व्याहृतय ऋग्यजुःसामाथर्वाङ्गिरसः सर्वाणि च्हन्दांसि तान्यङ्गे समाश्रितानि । तस्मादीशानो महादेवो
    महादेवः । अथ पुनरेव नारायणः सोऽन्यत्कामो मनसाध्यायत । तस्य ध्यानान्तःस्थस्य ललाटात्स्वेदोऽपपत् । ता
    इमाः प्रतता आपः । ततस्तेजो हिरण्मयमन्डलम् । तत्र ब्रह्मा चतुर्मुखोऽजायत । सोऽध्याय्त् । पूर्वाभिमुखो
    भूत्वा भूरिति व्याहृतिर्गायत्रं च्हन्द ऋग्वेदोऽग्निर्देवता । पश्चिमाभिमुखो भूत्वा भुवरिति व्याहृतिस्त्रैष्टुभं
    च्हन्दो यजुर्वेदो वायुर्देवता । उत्तराभिमुखो भूत्वा स्वरिति व्याहृतिर्जाग्रतं च्हन्दः सामवेदः सूर्यो
    देवता । दक्षिणाभिमुखो भूत्वा महरितिव्याहृतिरानुष्टभ च्हन्दोऽथर्ववेदाः सोमो देवता । सहस्रशीर्षं देवं
    सहस्राक्षं विश्वसम्भुवम् । विश्वतः परमं नित्यं विश्वं नारायणं हरिम् । विश्वमेवेदं पुरुषस्तद्विश्वमुपजीवति
    । पतिं विश्वेश्वरं देवं समुद्रे विश्वरूपिणम् । पद्मकोशप्रतीकाशं लम्बत्याकोशसंनिभम् । हृदयं चाप्यधोमुखं
    सन्तत्यै सीत्कराभीश्च । तस्य मध्ये महानर्चिर्विश्वर्चिर्विश्वतोमुखम् । तस्य मध्ये वह्निशिखा अणीयोर्ध्वा
    व्यवस्थिता । तस्याः शिखाया मध्ये परमात्मा व्यवस्थिता । स ब्रह्मा स ईशानः सेन्द्रः सोऽक्षरः परमः स्वराडिति
    महोपनिषत् ॥ इति प्रथमोध्यायः ॥ १
