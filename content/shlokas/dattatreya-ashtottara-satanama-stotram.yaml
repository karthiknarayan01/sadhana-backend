id: dattatreya-ashtottara-satanama-stotram
category: stotram
name:
  english: Dattatreya Ashtottara Satanama Stotram
content:
  english: onkaratattvarupaya divyajnanatmane namah | nabhotitamahadhamna aindryridhya ojase namah ||
    || nashtamatsaragamyayagamyacaratmavartmane | mocitamedhyakritaye ṟhimbijashranitashriye || || mohadivibhramantaya
    bahukayadharaya ca | bhattadurvaibhavachetre klimbijavarajapine || tuvinashaya rajacchonadharaya ca
    | gatiprakampitandaya caruvyahatabahave || rvapriyayastu yamadiyatacetase | vashitajatavashyaya mundine
    anasuyave || visprishtavividhatmane | tapodhanaprasannaye || tejomanyantarangaya dmarasadmavihapane
    | antarasthanasamsthayayaishvaryashrautagitaye || hetave hetubetave | jagadatmatmabhutaya vidvishatshatkaghatine
    || rgoddhrite bhritya asuravasabhedine | netre ca nayanakshne ciccetanaya mahatmane || || devadhidevadevaya
    vasudhasurapaline | yajinamagraganyaya drambijajapatushtaye || || vasanavanadavaya dhuliyugdehamaline
    | yatisannyasigataye dattatreyeti samvide || || yajanasyabhujejaya tarakavasagamine | mahajavasprigrupaya
    ttakaraya virupine || || naraya dhipradipaya yashasviyashase namah | harine cojvalangayatrestanujaya
    sambhave || || mocitamarasanghaya dhimatam dhirakaya ca | balishthavipralabhyaya yagahomapriyaya ca
    || || bhajanmahimavikhayatre'mararimahimacchide | labhaya mundipujyaya yamine hemamaline || || gatopadhivyadhaye
    ca hiranyahitakantaye | yatindracaryam dadhate narabhavaushadhaya ca || || varishthayogipujyaya tantusantanvate
    namah | svatmagathasutirthaya mahshriye shatkaraya ca || || tejomayottamangaya nodananodyakarmane
    | hanyaptimritivijnatra onkaritasubhaktaye || || rukshunmanahkhedahrite darshanavishayatmane | rankavatatavastraya
    naratattvaprakashine || ttahsvajishnuhsvarashaye | rajantryasyaikarupaya mahsthayamasubamdhave ||
    pracaraprabhave namah | manaroshavihinaya shishyasamsiddhikarine || || gange padavihinaya codanacoditatmane
    | yaviyase'larkaduhkha varine'khanditatmane || || hrimbijayarjunajyeshthaya darshanadarshitatmane
    | natisantushtacittaya yatine brahmacarine || || ityesha satstavo vrittoyat kam deyatprajapine | maskarisho
    manusyutah parabrahmapadapradah || shrivasudevananda sarasvati viracitam mantragarbha shri dattatreyashtottarashatanama
    stotram sampurnam||
  devanagari: ओङ्कारतत्त्वरूपाय दिव्यज्ञानात्मने नमः । नभोतीतमहाधाम्न ऐन्द्र्यृध्या ओजसे नमः ॥ ॥ नष्टमत्सरगम्यायागम्याचारात्मवर्त्मने
    । मोचितामेध्यकृतये ऱ्हीम्बीजश्राणितश्रिये ॥ ॥ मोहादिविभ्रमान्ताय बहुकायधराय च । भत्तदुर्वैभवछेत्रे
    क्लीम्बीजवरजापिने ॥ तुविनाशाय राजच्छोणाधराय च । गतिप्रकम्पिताण्डाय चारुव्यहतबाहवे ॥ र्वप्रियायास्तु
    यमादियतचेतसे । वशिताजातवश्याय मुण्डिने अनसूयवे ॥ विस्पृष्टविविधात्मने । तपोधनप्रसन्नाये ॥ तेजोमण्यन्तरङ्गाया
    द्मरसद्मविहापने । आन्तरस्थानसंस्थायायैश्वर्यश्रौतगीतये ॥ हेतवे हेतुबेतवे । जगदात्मात्मभूताय विद्विषत्षट्कघातिने
    ॥ र्गोद्धृते भृत्या असुरावासभेदिने । नेत्रे च नयनाक्ष्णे चिच्चेतनाय महात्मने ॥ ॥ देवाधिदेवदेवाय वसुधासुरपालिने
    । याजिनामग्रगण्याय द्राम्बीजजपतुष्टये ॥ ॥ वासनावनदावाय धूलियुग्देहमालिने । यतिसन्न्यासिगतये दत्तात्रेयेति
    संविदे ॥ ॥ यजनास्यभुजेजाय तारकावासगामिने । महाजवास्पृग्रूपाया त्ताकाराय विरूपिणे ॥ ॥ नराय धीप्रदीपाय
    यशस्वियशसे नमः । हारिणे चोज्वलाङ्गायात्रेस्तनूजाय सम्भवे ॥ ॥ मोचितामरसङ्घाय धीमतां धीरकाय च । बलिष्ठविप्रलभ्याय
    यागहोमप्रियाय च ॥ ॥ भजन्महिमविख़यात्रेऽमरारिमहिमच्छिदे । लाभाय मुण्डिपूज्याय यमिने हेममालिने ॥ ॥ गतोपाधिव्याधये
    च हिरण्याहितकान्तये । यतीन्द्रचर्यां दधते नरभावौषधाय च ॥ ॥ वरिष्ठयोगिपूज्याय तन्तुसन्तन्वते नमः ।
    स्वात्मगाथासुतीर्थाय मःश्रिये षट्कराय च ॥ ॥ तेजोमयोत्तमाङ्गाय नोदनानोद्यकर्मणे । हान्याप्तिमृतिविज्ञात्र
    ओङ्कारितसुभक्तये ॥ ॥ रुक्षुङ्मनःखेदहृते दर्शनाविषयात्मने । राङ्कवाततवस्त्राय नरतत्त्वप्रकाशिने ॥ त्तःस्वजिष्णुःस्वराशये
    । राजन्त्र्यास्यैकरूपाय मःस्थायमसुबम्धवे ॥ प्रचारप्रभवे नमः । मानरोषविहीनाय शिष्यसंसिद्धिकारिणे ॥
    ॥ गङ्गे पादविहीनाय चोदनाचोदितात्मने । यवीयसेऽलर्कदुःख वारिणेऽखण्डितात्मने ॥ ॥ ह्रीम्बीजायार्जुनज्येष्ठाय
    दर्शनादर्शितात्मने । नतिसन्तुष्टचित्ताय यतिने ब्रह्मचारिणे ॥ ॥ इत्येष सत्स्तवो वृत्तोयात् कं देयात्प्रजापिने
    । मस्करीशो मनुस्यूतः परब्रह्मपदप्रदः ॥ श्रीवासुदेवानन्द सरस्वती विरचितं मन्त्रगर्भ श्री दत्तात्रेयाष्टोत्तरशतनाम
    स्तोत्रं सम्पूर्णम्॥
