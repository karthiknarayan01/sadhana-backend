id: janakiashtottarashatanamastotram
category: stotram
name:
  english: janakiashtottarashatanamastotram
  devanagari: जानकीअष्टोत्तरशतनामस्तोत्रम्
content:
  english: jinaka nitya prati shraddhapurvaka patha karanevalomke liye isa trilokamem koi bhi siddhi durlabha
    nahim hai || 19|| 20 || iti shrijanaki ashtottarashatanamastotram sampurnam | shrijanaki ashtottarashatanamastotram
    | ashtottarashatam namnamapidanim taducyatam | bhavadbhih sanukampam me sarvajnah shrutimangalam ||
    1|| sadhum prishtam tvaya rajan shravyamekagracetasa | ashtottarashatam vakshye namnam paramapavanam
    || 2|| siradhvajasuta sita svashritabhishtadayini | sahajanandini stavya sarvabhutashayasthita ||
    3|| hladini kshemada kshantih shadarddhakshahridisthita | shrinidhih shrisamaradhya shriyah shrih
    shrimadarcita || 4|| sharanya vedanihshvasa vaidehi vibudheshvari | lokottaramba lokadi raghunandanavallabha
    || 5|| ramyaramyanidhi rama yogeshvarapriyatmaja | yajnasvarupa yajneshi yoginam parama gatih || 6||
    mridusvabhava mridula maithili madhurakritih | manorupa mahejyejya mahasaubhagyadayini || 7|| bhumija
    budhamrigyanghrikamala bodhavaridhih | phalasvarupa tapasam phanindravarnyavaibhava || 8|| namasya
    priyadrishtishca dhararatnam dharasuta | divyatma diptamahima tattvatma janakatmaja || 9|| jagadishaparapreshtha
    jnaninam paramayanam | jaganmangalamangalya jaramrityubhayatiga || 10|| candrakalamukhasadya cidanandasvarupini
    | caturatma caturvyuha candrabimbopamanana || 11|| ghanashyamatmanilaya goptri gupta guheshaya | geyodarayashahpanktirgataishvaryakritasmaya
    || 12|| gamaniyapadasaktih khalabhavanivarini | kripapiyushajaladhih kritajna kritisadhanam || 13||
    kalyanaprakritih kamya kalyani kamavarshini | karunyardravishalakshi kambukanthi kalanidhih || 14||
    kelipriya kaladhara kalmashaughanivarini | om shabdavacya hyojo'bdhiruditashrirudaradhih || 15|| udarakirttirudita
    hyudaratulyadarshana | ishtapradebhagamana adija''hladini para || 16|| ashritavatsala''radhya hyanirdeshyasvarupini
    | advitiyasukhambhodhiravyajakarunapara || 17|| anavadya'pramattatma anantaishvaryamandita | amana'yonija'kopa
    avicintya'naghasmritih || 18|| aniha'niyama'nadimadhyantadbhutadarshana | ajeya'kalmasha'karavacyetyavanipottama
  devanagari: जिनका नित्य प्रति श्रद्धापूर्वक पाठ करनेवालोंके लिये इस त्रिलोकमें कोई भी सिद्धि दुर्लभ
    नहीं है ॥ १९॥ २० ॥ इति श्रीजानकी अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् । श्रीजानकी अष्टोत्तरशतनामस्तोत्रम्
    । अष्टोत्तरशतं नाम्नामपीदानीं तदुच्यताम् । भवद्भिः सानुकम्पं मे सर्वज्ञाः श्रुतिमङ्गलम् ॥ १॥ साधुं
    पृष्टं त्वया राजन् श्रव्यमेकाग्रचेतसा । अष्टोत्तरशतं वक्ष्ये नाम्नां परमपावनम् ॥ २॥ सीरध्वजसुता सीता
    स्वाश्रिताभीष्टदायिनी । सहजानन्दिनी स्तव्या सर्वभूताशयस्थिता ॥ ३॥ ह्लादिनी क्षेमदा क्षान्तिः षडर्द्धाक्षहृदिस्थिता
    । श्रीनिधिः श्रीसमाराध्या श्रियः श्रीः श्रीमदर्चिता ॥ ४॥ शरण्या वेदनिःश्वासा वैदेही विबुधेश्वरी ।
    लोकोत्तराम्बा लोकादी रघुनन्दनवल्लभा ॥ ५॥ रम्यरम्यनिधी रामा योगेश्वरप्रियात्मजा । यज्ञस्वरूपा यज्ञेशी
    योगिनां परमा गतिः ॥ ६॥ मृदुस्वभावा मृदुला मैथिली मधुराकृतिः । मनोरूपा महेज्येज्या महासौभाग्यदायिनी
    ॥ ७॥ भूमिजा बुधमृग्याङ्घ्रिकमला बोधवारिधिः । फलस्वरूपा तपसां फणीन्द्रवर्ण्यवैभवा ॥ ८॥ नमस्या प्रियदृष्टिश्च
    धरारत्नं धरासुता । दिव्यात्मा दीप्तमहिमा तत्त्वात्मा जनकात्मजा ॥ ९॥ जगदीशपरप्रेष्ठा ज्ञानिनां परमायनम्
    । जगन्मङ्गलमाङ्गल्या जरामृत्युभयातिगा ॥ १०॥ चन्द्रकलामुखासाद्या चिदानन्दस्वरूपिणी । चतुरात्मा चतुर्व्यूहा
    चन्द्रबिम्बोपमानना ॥ ११॥ घनश्यामात्मनिलया गोप्त्री गुप्ता गुहेशया । गेयोदारयशःपङ्क्तिर्गतैश्वर्यकृतस्मया
    ॥ १२॥ गमनीयपदासक्तिः खलभावनिवारिणी । कृपापीयूषजलधिः कृतज्ञा कृतिसाधनम् ॥ १३॥ कल्याणप्रकृतिः काम्या
    कल्याणी कामवर्षिणी । कारुण्यार्द्रविशालाक्षी कम्बुकण्ठी कलानिधिः ॥ १४॥ केलिप्रिया कलाधारा कल्मषौघनिवारिणी
    । ॐ शब्दवाच्या ह्योजोऽब्धिरुदितश्रीरुदारधीः ॥ १५॥ उदारकीर्त्तिरुदिता ह्युदारातुल्यदर्शना । इष्टप्रदेभगमना
    आदिजाऽऽह्लादिनी परा ॥ १६॥ आश्रितवत्सलाऽऽराध्या ह्यनिर्देश्यस्वरूपिणी । अद्वितीयसुखाम्भोधिरव्याजकरुणापरा
    ॥ १७॥ अनवद्याऽप्रमत्तात्मा अनन्तैश्वर्यमण्डिता । अमानाऽयोनिजाऽकोपा अविचिन्त्याऽनघस्मृतिः ॥ १८॥ अनीहाऽनियमाऽनादिमध्यान्ताद्भुतदर्शना
    । अजेयाऽकल्मषाऽकारवाच्येत्यवनिपोत्तम
