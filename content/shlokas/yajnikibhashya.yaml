id: yajnikibhashya
category: upanishad
name:
  english: yajnikibhashya
  devanagari: यज्निकिभाष्य
content:
  english: sarvatmakatvarupam ca prahopasyagunam raveh | upasyatvena yah proktah purvamarkah sa eva ca
    || 281|| tejadyadhipatyantasamastajagadatmakah | balaheturbhavedojo dehashaktirbalam smritam || 282||
    atma deho manishcattam manyuh krodhah samiritah | manuh svayambhuvadih syanmrityuryama udiritah ||
    283|| syurdevatavisheshasatu satyadyaste ca samsphutah | kah prajapatirityuktah kimshabdena taducyate
    || 284|| vaca visheshato vaktumayogyam vastu yadbhavet | kam sukham tatparoksham syatsatyam tvanritavarjatam
    || 285|| annam vrihyadirayustu shatamsavatsaradikam | amrito mritihinah syaccidatma jiva ucyate ||
    286|| sa ca dehavibhedena vishvo nanavidhah smritah | ativa sukharupo'yam katamah parikirtitah ||
    287|| anutpannah svayambhuh syacchandasam tu svayam tviti | prajapalakarajadih prajapatiritiritah
    || 288 | itih pradarshanarthah syadityadisakalasya ca | adityajatvadadityah samvatsara udiritah ||
    289|| ya esha purushah sarvah sa eva praninamapi | bhavatyadhipatih svamityevam mantrartha iritah
    || 290|| sarvah sarvatmaka ityarthah | uktvopasyagunanevam phalamatra pradarshyate | upaste yah pumaneva
    sa sayujyadyavapnuyat || 291|| hiranyagarbhopastishca tadanganamupasanam | ityupastirdvidhadye ca
    bhavanatishaye sati || 292|| hiranyagarbhasayujyam tadrupyam pratipadyate | bhavanamandatayam ca tatsalokyam
    samashnute || 293|| dvitiye bhavanadhikye devasayujyamashnute bhavanamadhyatayam ca samanaishcaryamashnute
    || 294|| tanmandye ca salokatvamindradinam prapadyate | evam rahasyavidyokta samaptimagamacchubha
    || 295|| iti caturdashomuvakah ghrinih surya adityomarcayanti tapah satyam madhu ksharanti tadbrahma
    tadapa apo jyoti raso'mritam brahma bhurbhuvah suvarom |
  devanagari: सर्वात्मकत्वरूपं च प्राहोपास्यगुणं रवेः । उपास्यत्वेन यः प्रोक्तः पूर्वमर्कः स एव च ॥ २८१॥
    तेजाद्यधिपत्यन्तसमस्तजगदात्मकः । बलहेतुर्भवेदोजो देहशक्तिर्बलं स्मृतम् ॥ २८२॥ आत्मा देहो मनिश्चत्तं
    मन्युः क्रोधः समीरितः । मनुः स्वायंभुवादिः स्यान्मृत्युर्यम उदीरितः ॥ २८३॥ स्युर्देवताविशेषासतु सत्याद्यास्ते
    च संस्फुटाः । कः प्रजापतिरित्युक्तः किंशब्देन तदुच्यते ॥ २८४॥ वाचा विशेषतो वक्तुमयोग्यं वस्तु यद्भवेत्
    । कं सुखं तत्परोक्षं स्यात्सत्यं त्वनॄतवर्जतम् ॥ २८५॥ अन्नं व्रीह्यादिरायुस्तु शतंसवत्सरादिकम् । अमृतो
    मृतिहीनः स्याच्चिदात्मा जीव उच्यते ॥ २८६॥ स च देहविभेदेन विश्वो नानाविधः स्मृतः । अतीव सुखरूपोऽयं
    कतमः परिकीर्तितः ॥ २८७॥ अनुत्पन्नः स्वयंभुः स्याच्छान्दसं तु स्वयं त्विति । प्रजापालकराजादिः प्रजापतिरितीरितः
    ॥ २८८ । इतिः प्रदर्शनार्थः स्यादित्यादिसकलस्य च । आदित्यजत्वादादित्यः संवत्सर उदीरितः ॥ २८९॥ य एष
    पुरुषः सर्वः स एव प्राणिनामपि । भवत्यधिपतिः स्वामीत्येवं मन्त्रार्थ ईरितः ॥ २९०॥ सर्वः सर्वात्मक इत्यर्थः
    । उक्त्वोपास्यगुणानेवं फलमत्र प्रदर्श्यते । उपास्ते यः पुमानेव स सायुज्याद्यवाप्नुयात् ॥ २९१॥ हिरण्यगर्भोपास्तिश्च
    तदङ्गानामुपसनम् । इत्युपास्तिर्द्विधाद्ये च भावनतिशये सति ॥ २९२॥ हिरण्यगर्भसायुज्यं ताद्रूप्यं प्रतिपद्यते
    । भावनामन्दतायां च तत्सालोक्यं समश्नुते ॥ २९३॥ द्वितीये भावनाधिक्ये देवसायुज्यमश्नुते भावनामध्यतायां
    च समानैश्चर्यमश्नुते ॥ २९४॥ तन्मान्द्ये च सलोकत्वमिन्द्रादीनां प्रपद्यते । एवं रहस्यविद्योक्ता समाप्तिमगमच्छुभा
    ॥ २९५॥ इति चतुर्दशोंउवाकः घृणिः सूर्य आदित्योमर्चयन्ति तपः सत्यं मधु क्षरन्ति तद्ब्रह्म तदाप आपो ज्योती
    रसोऽमृतं ब्रह्म भूर्भुवः सुवरोम् ।
