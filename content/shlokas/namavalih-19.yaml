    । १२० ॐ कृत्यासनाय नमः । कृतज्ञाय । कृत्याचेष्टकभञ्जनाय । कृपामहोदधये । कृष्णध्यानासक्ताय । कृशप्रियाय
    । कस्तूरीतिलकासक्ताय । कृत्तसंसारसाध्वसाय । खगेशवाहभक्ताय । खरपातकहारिणे । खदोषहर्त्रे । खपुरप्रियाय
