id: shrishivapancaksharastotram
category: stotram
name:
  english: shrishivapancaksharastotram
  devanagari: श्रीशिवपञ्चाक्षरस्तोत्रम्
content:
  english: shrishivapancaksharastotram shankaracarya shrishivapancaksharastotram shankaracarya shrishivapancaksharastotram
    om nagendraharaya trilocanaya bhasmanaragaya maheshvaraya | nityaya shuddhaya digambaraya tasmai na
    karaya namahshivaya || 1 || mandakinisalilacandanacarcitaya nandishvarapramathanathamaheshvaraya |
    mandarapushpbahupushpasupujitaya tasmai ma karaya namahshivaya || 2 || shivaya gaurivadanabjavrinda
    suryaya dakshadhvaranashakaya | shrinilakanthaya vrishadhvajaya tasmai shi karaya namahshivaya ||
    3 || vasishthakumbhodbhavagautamarya munindradevarcitashekharaya | candrarkavaishvanaralocanaya tasmai
    va karaya namahshivaya || 4 || yakshasvarupaya jatadharaya pinakahastaya sanatanaya | divyaya devaya
    digambaraya tasmai ya karaya namahshivaya || 5 || pancaksharamidam punyam yah pathet shivasannidhau
    | shivalokamavapnoti shivena saha modate || 6 || iti shrimad shankaracaryaviracitam shivapancaksharastotram
    sampurnam
  devanagari: श्रीशिवपञ्चाक्षरस्तोत्रम् शन्कराचार्य श्रीशिवपञ्चाक्षरस्तोत्रम् शन्कराचार्य श्रीशिवपञ्चाक्षरस्तोत्रम्
    ॐ नागेन्द्रहाराय त्रिलोचनाय भस्माङरागाय महेश्वराय । नित्याय शुद्धाय दिगम्बराय तस्मै न काराय नमःशिवाय
    ॥ १ ॥ मन्दाकिनीसलिलचन्दनचर्चिताय नन्दीश्वरप्रमथनाथमहेश्वराय । मन्दारपुष्प्बहुपुष्पसुपूजिताय तस्मै
    म काराय नमःशिवाय ॥ २ ॥ शिवाय गौरीवदनाब्जवृन्द सूर्याय दक्षाध्वरनाशकाय । श्रीनीलकण्ठाय वृषध्वजाय तस्मै
    शि काराय नमःशिवाय ॥ ३ ॥ वसिष्ठकुम्भोद्भवगौतमार्य मुनीन्द्रदेवार्चितशेखराय । चन्द्रार्कवैश्वानरलोचनाय
    तस्मै व काराय नमःशिवाय ॥ ४ ॥ यक्षस्वरुपाय जटाधराय पिनाकहस्ताय सनातनाय । दिव्याय देवाय दिगम्बराय तस्मै
    य काराय नमःशिवाय ॥ ५ ॥ पञ्चाक्षरमिदं पुण्यं यः पठेत् शिवसन्निधौ । शिवलोकमवाप्नोति शिवेन सह मोदते ॥
    ६ ॥ इति श्रीमद् शन्कराचार्यविरचितं शिवपञ्चाक्षरस्तोत्रं सम्पुर्णम्
meaning: {}
