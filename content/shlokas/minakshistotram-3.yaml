id: minakshistotram-3
category: stotram
name:
  english: minakshistotram 3
  devanagari: मीनाक्षीस्तोत्रम् ३
content:
  english: shriminakshistotram mandasmitodancitamanjulasyam kanannitalam varakunkumena | shrisundareshena
    samam nishithe prenkhadhirudham bhaja minanetram || 1|| davishthalokamshca dayormilena vilokanenaiva
    vishalanetra | matsya ivarbhanparipalayanti dolaviharam tanute jhashakshi || 2|| kritva tapo dushcaramambikayah
    mata bhavamiti manishaya ya | prapta pura kancanamalaya sa pandyadhirajni vitanotu bhavyam || 3||
    divyam rupam dadhana lalitatararavairvenuvinadijataih prapayyantarmukhatvam nikhilajanamanamsyatmarupam
    vivektum | vrittirmodadirupa api parigalitah kurvati brahmavidya minakshi jivanidam sukhamamritamaho
    bodhayanti vibhati || 4|| prenkhamaruhya patya saha suraramanigarvanirvapikabhih naribhirgiyamana
    navanavanatanaistoshyamana ca nityam | anandam devabhogyam dhigiti sumanasamadadhana viraktim sandranandam
    mahesham paramamritamaho bodhayatyambikeyam || 5|| ya devi dvadashante vasati vishadaya prajnayaivadhigamya
    yasyah praptyai vidhatte shrutirapi vividhan yajnadanadidharman | sakshacchriminanetra maghavadadhigata
    kumbhajadyarcitanghrih sa me somavatamsa shithilayatu tamo hardamashu pragadham || 6|| yasya geham
    vishalam puramiva sakalam vastujatam bibharti yaddrishtvaivashu modam vahati bhuvi jano nastiko'pi
    prakamam | stambhairhaimairvicitrairapi shikharavarairgopuraih shaukanidaih tirthairhemambujinyadibhirapi
    parito bhasamanam shriyai stat || 7|| sa hi shriramrita satamiti ricah samani yasmadyajum
  devanagari: श्रीमीनाक्षीस्तोत्रम् मन्दस्मितोदञ्चितमञ्जुलास्यां कनन्निटालां वरकुङ्कुमेन । श्रीसुन्दरेशेन
    समं निशीथे प्रेङ्खाधिरूढां भज मीननेत्राम् ॥ १॥ दविष्ठलोकांश्च दयोर्मिलेन विलोकनेनैव विशालनेत्रा ।
    मत्स्या इवार्भान्परिपालयन्ती डोलाविहारं तनुते झषाक्षी ॥ २॥ कृत्वा तपो दुश्चरमम्बिकायाः माता भवामीति
    मनीषया या । प्राप्ता पुरा काञ्चनमालया सा पाण्ड्याधिराज्ञी वितनोतु भव्यम् ॥ ३॥ दिव्यं रूपं दधाना ललिततररवैर्वेणुवीणादिजातैः
    प्रापय्यान्तर्मुखत्वं निखिलजनमनांस्यात्मरूपं विवेक्तुम् । वृत्तीर्मोदादिरूपा अपि परिगलिताः कुर्वती
    ब्रह्मविद्या मीनाक्षी जीवनीडं सुखममृतमहो बोधयन्ती विभाति ॥ ४॥ प्रेङ्खामारुह्य पत्या सह सुररमणीगर्वनिर्वापिकाभिः
    नारीभिर्गीयमाना नवनवनटनैस्तोष्यमाणा च नित्यम् । आनन्दं देवभोग्यं धिगिति सुमनसामादधाना विरक्तिं सान्द्रानन्दं
    महेशं परममृतमहो बोधयत्यम्बिकेयम् ॥ ५॥ या देवी द्वादशान्ते वसति विशदया प्रज्ञयैवाधिगम्या यस्याः प्राप्त्यै
    विधत्ते श्रुतिरपि विविधान् यज्ञदानादिधर्मान् । साक्षाच्छ्रीमीननेत्रा मघवदधिगता कुम्भजाद्यर्चिताङ्घ्रिः
    सा मे सोमावतंसा शिथिलयतु तमो हार्दमाशु प्रगाढम् ॥ ६॥ यस्या गेहं विशालं पुरमिव सकलं वस्तुजातं बिभर्ति
    यद्दृष्ट्वैवाशु मोदं वहति भुवि जनो नास्तिकोऽपि प्रकामम् । स्तम्भैर्हैमैर्विचित्रैरपि शिखरवरैर्गोपुरैः
    शौकनीडैः तीर्थैर्हेमाम्बुजिन्यादिभिरपि परितो भासमानं श्रियै स्तात् ॥ ७॥ सा हि श्रीरमृता सतामिति ऋचः
    सामानि यस्माद्यजूं
