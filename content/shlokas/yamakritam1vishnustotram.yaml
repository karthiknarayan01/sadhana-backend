id: yamakritam1vishnustotram
category: stotram
name:
  english: yamakritam1vishnustotram
  devanagari: यमकृतं१विष्णुस्तोत्रम्
content:
  english: nibandhabaddhashcakita vahanti || 13|| aham mahendro nirritih pracetah somo'gnirishah pavano'rko
    virincah | adityavishve vasavo'tha sadhya marudgana rudraganah sasiddhah || 14|| anye ca ye vishvasrijo'maresha
    bhrigvadayo'sprishtarajastamaskah | yasyehitam na viduh sprishtamayah sattvapradhana api kim tato'nye
    || 15|| yam vai na gobhirmanasasubhirva hrida gira vasubhrito vicakshate | atmanamantarhridi santamatmanam
    cakshuryathaivakritayastatah param || 16|| tasyatmatantrasya hareradhishituh parasya mayadhipatermahatmanah
    | prayena duta iha vai manohara
  devanagari: निबन्धबद्धाश्चकिता वहन्ति ॥ १३॥ अहं महेन्द्रो निरृतिः प्रचेताः सोमोऽग्निरीशः पवनोऽर्को विरिञ्चः
    । आदित्यविश्वे वसवोऽथ साध्या मरुद्गणा रुद्रगणाः ससिद्धाः ॥ १४॥ अन्ये च ये विश्वसृजोऽमरेशा भृग्वादयोऽस्पृष्टरजस्तमस्काः
    । यस्येहितं न विदुः स्पृष्टमायाः सत्त्वप्रधाना अपि किं ततोऽन्ये ॥ १५॥ यं वै न गोभिर्मनसासुभिर्वा हृदा
    गिरा वासुभृतो विचक्षते । आत्मानमन्तर्हृदि सन्तमात्मनां चक्षुर्यथैवाकृतयस्ततः परम् ॥ १६॥ तस्यात्मतन्त्रस्य
    हरेरधीशितुः परस्य मायाधिपतेर्महात्मनः । प्रायेण दूता इह वै मनोहरा
meaning: {}
