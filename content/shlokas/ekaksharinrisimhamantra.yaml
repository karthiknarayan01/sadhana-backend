id: ekaksharinrisimhamantra
category: mantra
name:
  english: ekaksharinrisimhamantra
  devanagari: एकाक्षरीनृसिंहमन्त्र
content:
  english: ekakshari nrisimhamantra shriganeshaya namah | om asya shrinrisimhaekaksharimantrasya atri
    rishih | gayatricchandah | shrinrikesari devata | shrilakshminrisimhakripaprasadasidhyarthe jape viniyogah
    | atha karanyasah | om kshram angushthabhyam namah | om kshrim tarjanibhyam namah | om kshrum madhyamabhyam
    namah | om kshraim anamikabhyam namah | om kshraum kanishthikabhyam namah | om kshrah karatalakaraprishthabhyam
    namah | atha hridayadinyasah | om kshram hridayaya namah | om kshrim shirase svaha | om kshrum shikhaya
    vashat | om kshraim kavacaya hum | om kshraum netratrayaya vaushat | om kshrah astraya phat | om bhurbhuvasvaromiti
    digbandhah | atha dhyanam | om tamasomahutashanalocanam | ghanasamanagalam shashisamaprabham | abhayacakrapinakavaran
    karaih | dadhatamindudharam nriharim bhaje || 1|| atha mantrah | om kshraum om | om ugram viram mahavishnum
    jvalantam sarvatomukham | nrisimham bhishanam bhadram mrityumrityum namamyaham || 2|| punardhyanam
    | hridayadinyasah || iti shri ekaksharimantram sampurnam |
  devanagari: एकाक्षरी नृसिंहमन्त्र श्रीगणेशाय नमः । ॐ अस्य श्रीनृसिंहएकाक्षरीमन्त्रस्य अत्रि ऋषिः । गायत्रीच्छन्दः
    । श्रीनृकेसरी देवता । श्रीलक्ष्मीनृसिंहकृपाप्रसादसिध्यर्थे जपे विनियोगः । अथ करन्यासः । ॐ क्ष्रां
    अङ्गुष्ठाभ्यां नमः । ॐ क्ष्रीं तर्जनीभ्यां नमः । ॐ क्ष्रूं मध्यमाभ्यां नमः । ॐ क्ष्रैं अनामिकाभ्यां
    नमः । ॐ क्ष्रौं कनिष्ठिकाभ्यां नमः । ॐ क्ष्रः करतलकरपृष्ठाभ्यां नमः । अथ हृदयादिन्यासः । ॐ क्ष्रां
    हृदयाय नमः । ॐ क्ष्रीं शिरसे स्वाहा । ॐ क्ष्रूं शिखाय वषट् । ॐ क्ष्रैं कवचाय हुम् । ॐ क्ष्रौं नेत्रत्रयाय
    वौषट् । ॐ क्ष्रः अस्त्राय फट् । ॐ भूर्भुवस्वरोमिति दिग्बन्धः । अथ ध्यानम् । ॐ तमसोमहुताशनलोचनम् ।
    घनसमानगलं शशिसमप्रभम् । अभयचक्रपिनाकवरान् करैः । दधतमिन्दुधरं नृहरिं भजे ॥ १॥ अथ मन्त्रः । ॐ क्ष्रौं
    ॐ । ॐ उग्रं वीरं महाविष्णुं ज्वलन्तं सर्वतोमुखम् । नृसिंहं भीषणं भद्रं मृत्युमृत्युं नमाम्यहम् ॥ २॥
    पुनर्ध्यानम् । हृदयादिन्यासः ॥ इति श्री एकाक्षरीमन्त्रं सम्पूर्णम् ।
