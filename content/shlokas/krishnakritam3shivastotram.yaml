id: krishnakritam3shivastotram
category: stotram
name:
  english: krishnakritam3shivastotram
  devanagari: कृष्णकृतं३शिवस्तोत्रम्
content:
  english: shrikrishnakritam 3 shivastotram shrikrishna uvaca | devadeva mahadeva sharanagatavatsala |
    namami tva'nantashaktim sarvatmanam pareshvaram || 43|| vishvotpattisthananashahetum sajjnapti matrakam
    | brahmalingam param shantam kevalam parameshvaram || 44|| kalo daivam karma jivassvabhavo dravyameva
    ca | kshetram ca prana atma ca vikarastatsamuhakah || 45|| bijarohapravahastu tvanmayaisha jagatprabho
    | tannibandham prapadyeha tvamaham parameshvaram || 46|| nana bhavairlilayaiva svikritairnirjaradikan
    | nunam bibharshi lokesho hamsyunmargansvabhavatah || 47|| tvam hi brahma param jyotirgudham brahmani
    vanmaye | yam pashyantyamalatmanamakashamiva kevalam || 48|| tvameva cadyah purusho'dvitiyasturya
    atmadrik | isho heturahetushca savikarah pratiyase || 49|| svamayaya sarvagunaprasiddhyai bhagavanprabho
    | sarvanvitah prabhinnashca sarvatastvam maheshvara || 5
  devanagari: श्रीकृष्णकृतं ३ शिवस्तोत्रम् श्रीकृष्ण उवाच । देवदेव महादेव शरणागतवत्सल । नमामि त्वाऽनन्तशक्तिं
    सर्वात्मानं परेश्वरम् ॥ ४३॥ विश्वोत्पत्तिस्थाननाशहेतुं सज्ज्ञप्ति मात्रकम् । ब्रह्मलिङ्गं परं शान्तं
    केवलं परमेश्वरम् ॥ ४४॥ कालो दैवं कर्म जीवस्स्वभावो द्रव्यमेव च । क्षेत्रं च प्राण आत्मा च विकारस्तत्समूहकः
    ॥ ४५॥ बीजरोहप्रवाहस्तु त्वन्मायैषा जगत्प्रभो । तन्निबन्धं प्रपद्येह त्वामहं परमेश्वरम् ॥ ४६॥ नाना
    भावैर्लीलयैव स्वीकृतैर्निर्जरादिकान् । नूनं बिभर्षि लोकेशो हंस्युन्मार्गान्स्वभावतः ॥ ४७॥ त्वं हि
    ब्रह्म परं ज्योतिर्गूढं ब्रह्मणि वाङ्मये । यं पश्यन्त्यमलात्मानमाकाशमिव केवलम् ॥ ४८॥ त्वमेव चाद्यः
    पुरुषोऽद्वितीयस्तुर्य आत्मदृक् । ईशो हेतुरहेतुश्च सविकारः प्रतीयसे ॥ ४९॥ स्वमायया सर्वगुणप्रसिद्ध्यै
    भगवन्प्रभो । सर्वान्वितः प्रभिन्नश्च सर्वतस्त्वं महेश्वर ॥ ५
