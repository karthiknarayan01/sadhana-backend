id: sri-vindhyeshwari-stotram
category: stotram
name:
  english: Sri Vindhyeshwari Stotram
content:
  english: khandinim | vane rane prakashinim bhajami vindhyavasinim || trishula dharavighataharinim |
    grihe grihe nivasinim bhajami vindhyavasinim || daridrtha sada vibhutikarinim | viyogashauka bhajami
    vindhyavasinim || lasatsulola jane sada varapradam | kapala shuladharinim bhajami vindhyavasinim ||
    kare muda gadadharam shivam shivapradayinim| vara bhajami vindhyavasinim || kapindra tridhasvarupadharinim
    | jale sthale nivasinim bhajami vindhyavasinim || vishishta vishalarupa dharinim | mahodare vilasinim
    bhajami vindhyavasinim || purandaradisevitam surarivamshakhanditam | vishuddha bhajami vindhyavasinim
    || iti shri vindhyeshvaristotram sampurnam |
  devanagari: खण्डिनीम् । वने रणे प्रकाशिनीं भजामि विन्ध्यवासिनीम् ॥ त्रिशूल धराविघातहारिणीम् । गृहे गृहे
    निवासिनीं भजामि विन्ध्यवासिनीम् ॥ दरिद्र्थ सदा विभूतिकारिणीम् । वियोगशौक भजामि विन्ध्यवासिनीम् ॥ लसत्सुलोल
    जने सदा वरप्रदाम् । कपाल शूलधारिणीं भजामि विन्ध्यवासिनीम् ॥ करे मुदा गदाधरां शिवां शिवप्रदायिनीम्।
    वरा भजामि विन्ध्यवासिनीम् ॥ कपीन्द्र त्रिधास्वरूपधारिणीम् । जले स्थले निवासिनीं भजामि विन्ध्यवासिनीम्
    ॥ विशिष्ट विशालरूप धारिणीम् । महोदरे विलासिनीं भजामि विन्ध्यवासिनीम् ॥ पुरन्दरादिसेवितां सुरारिवंशखण्डिताम्
    । विशुद्ध भजामि विन्ध्यवासिनीम् ॥ इति श्री विन्ध्येश्वरीस्तोत्रं सम्पूर्णम् ।
