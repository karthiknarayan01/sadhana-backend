id: jagannathasahasranamastotram
category: stotram
name:
  english: jagannathasahasranamastotram
  devanagari: जगन्नाथसहस्रनामस्तोत्रम्
content:
  english: anantah kalpavasi satyanathah satyacari satyavadi sadasthitah || 78|| caturmurtishcaturbahushcaturyugapatirbhavah
    | ramakrishno yugantashca balabhadro balo bali || 79|| lakshminarayano devah shalagramashilaprabhuh
    | prano'panah samanashcodanavyanau tathaiva ca || 80|| pancatma pancatattvam ca sharanagatapalakah
    | yatkincit drishyate loke tatsarvam jagadishvarah || 81|| jagadisho mahadbrahma jagannathaya te namah
    | jagadisho mahadbrahma jagannathaya te namah | jagadisho mahadbrahma jagannathaya te namah | || iti
    shrijagannathasahasranamastotram || atha shrijagannathasahasranama mahatmyam | evam namasahasrena
    stavo'yam pathyate yadi | patham pathayate yastu shrinuyadapi manavah || 1|| sahasranam shatenaiva
    yajnena paripujyate | yatpunyam sarvatirtheshu vedeshu ca visheshatah || 2|| tatpunyam kotigunitam
    acirallabhate narah | jagannathasya namani punyani saphalani ca || 3|| vidyarthi labhate vidyam yogarthi
    yogamapnuyat | kanyarthi labhate kanyam jayarthi labhate jayam || 4|| kamarthi labhate kamam putrarthi
    labhate sutam | kshatriyanam prayogena sangrame jayadah sada || 5|| vaishyanam sarvadharmah syacchudranam
    sukhamedhate | sadhunam pathato nityam jnanadah phaladastatha || 6|| na'pavadam na duhkham ca kada
    ca labhate narah | sarvasaukhyam phalam prapya ciranjivi bhavennarah || 7|| shrinu rajan mahabaho
    mahimanam jagatpateh | yasya smaranamatrena sarvapapaih pramucyate || 8|| jagannatham lokanatham pathate
    yah sada shucih | kalikalodbhavam papam tatkshanattasya nashyati || 9|| iti shribrahmapurane bhishma
  devanagari: अनन्तः कल्पवासी सत्यनाथः सत्यचारी सत्यवादी सदास्थितः ॥ ७८॥ चतुर्मूर्तिश्चतुर्बाहुश्चतुर्युगपतिर्भवः
    । रामकृष्णो युगान्तश्च बलभद्रो बलो बली ॥ ७९॥ लक्ष्मीनारायणो देवः शालग्रामशिलाप्रभुः । प्राणोऽपानः
    समानश्चोदानव्यानौ तथैव च ॥ ८०॥ पञ्चात्मा पञ्चतत्त्वं च शरणागतपालकः । यत्किञ्चित् दृश्यते लोके तत्सर्वं
    जगदीश्वरः ॥ ८१॥ जगदीशो महद्ब्रह्म जगन्नाथाय ते नमः । जगदीशो महद्ब्रह्म जगन्नाथाय ते नमः । जगदीशो महद्ब्रह्म
    जगन्नाथाय ते नमः । ॥ इति श्रीजगन्नाथसहस्रनामस्तोत्रम् ॥ अथ श्रीजगन्नाथसहस्रनाम माहात्म्यम् । एवं नामसहस्रेण
    स्तवोऽयं पठ्यते यदि । पाठं पाठयते यस्तु शृणुयादपि मानवः ॥ १॥ सहस्राणां शतेनैव यज्ञेन परिपूज्यते ।
    यत्पुण्यं सर्वतीर्थेषु वेदेषु च विशेषतः ॥ २॥ तत्पुण्यं कोटिगुणितं अचिराल्लभते नरः । जगन्नाथस्य नामानि
    पुण्यानि सफलानि च ॥ ३॥ विद्यार्थी लभते विद्यां योगार्थी योगमाप्नुयात् । कन्यार्थी लभते कन्यां जयार्थी
    लभते जयम् ॥ ४॥ कामार्थी लभते कामं पुत्रार्थी लभते सुतम् । क्षत्रियाणां प्रयोगेण सङ्ग्रामे जयदः सदा
    ॥ ५॥ वैश्यानां सर्वधर्मः स्याच्छूद्राणां सुखमेधते । साधूनां पठतो नित्यं ज्ञानदः फलदस्तथा ॥ ६॥ नाऽपवादं
    न दुःखं च कदा च लभते नरः । सर्वसौख्यं फलं प्राप्य चिरञ्जीवी भवेन्नरः ॥ ७॥ शृणु राजन् महाबाहो महिमानं
    जगत्पतेः । यस्य स्मरणमात्रेण सर्वपापैः प्रमुच्यते ॥ ८॥ जगन्नाथं लोकनाथं पठते यः सदा शुचिः । कलिकालोद्भवं
    पापं तत्क्षणात्तस्य नश्यति ॥ ९॥ इति श्रीब्रह्मपुराणे भीष्म
