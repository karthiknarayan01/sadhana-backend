id: namavalih-26
category: stotram
name:
  english: namavalih
  devanagari: नामावलिः
content:
  english: '| taravaktraya | guhagrajaya | brahmapaya | parshvaputraya | sindhoh shatrave | parashuprapanaye
    | shamishaya | pushpapriyaya | vighnaharine | durvabharairarcitaya | devadevaya | dhiyah pradatre
    | shamipriyaya | susiddhidatre | sushantidatre | ameyamayaya | amitavikramaya namah | 80 om dvidha
    caturthipriyaya namah | kashyapajjataya | dhanapradaya | jnanapradaya | prakashaya | cintamanaye |
    cittaviharakarine | yamasya shatrave | abhimanashatrave | vidherjahantre'
  devanagari: । तारवक्त्राय । गुहाग्रजाय । ब्रह्मपाय । पार्श्वपुत्राय । सिन्धोः शत्रवे । परशुप्रपाणये
    । शमीशाय । पुष्पप्रियाय । विघ्नहारिणे । दूर्वाभरैरर्चिताय । देवदेवाय । धियः प्रदात्रे । शमीप्रियाय
    । सुसिद्धिदात्रे । सुशान्तिदात्रे । अमेयमायाय । अमितविक्रमाय नमः । ८० ॐ द्विधा चतुर्थीप्रियाय नमः
    । कश्यपाज्जाताय । धनप्रदाय । ज्ञानप्रदाय । प्रकाशाय । चिन्तामणये । चित्तविहारकारिणे । यमस्य शत्रवे
    । अभिमानशत्रवे । विधेर्जहन्त्रे
meaning: {}
