id: prashnopanishad-question-4
category: stotram
name:
  english: Prashnopanishad - Question 4
content:
  english: caturthah prashnah atha hainam sauryayani gargyah papraccha| bhagavannetasmi npurushe kani
    svapanti kanyasminjagrati katara esha deva npashyati kasyaitatsukha mbhavati kasminnu sarve sampratishthita
    bhavantiti || || tasmai sa hovaca| yatha gargya maricayo ssarva etasmimstejomandala ekibhavanti| tah
    punah punarudayatah pracarantyevam ha vai ta mpare deve manasyekibhavati| tena tar hyesha purusho
    na shrinoti na pashyati na jighrati na rasayate na sprishate nabhivadate nadatte nanandayate na visrijate
    neyayate svapitityacakshate || || pranagnaya evaitasmi npure jagrati| gar 'nvaharyapacano yad gar
    tpraniyate pranayanadahavaniyah pranah || || yaducchvasanisshvasavetavahuti sama nnayatiti sa samanah|
    mano ha vava yajamanah ishtaphalamevodana ya~jamanamaharaharbrahma gamayati || ssvapne mahimanamanubhavati|
    yad drishta ndrishtamanupashyati shrutam shrutamevarthamanushrinoti deshadigantaraishca pratyanubhuta
    mpunah punah pratyanubhavati drishta mpashyati sarvah pashyati || || sa yada tejasabhibhuto bhavatyatraisha
    deva nna pashyatyatha yadaitasminsharire etatsukha || sa yatha somya vayamsi vasovriksham sampratishthante
    evam ha vai ta mpara atmani sampratishthate || || prithivi ca prithivimatra capashcapomatra ca tejashca
    tejomatra ca vayushca vayumatra cakashashcakashamatra ca cakshushca drashtavya ncopasthashcanandayitavya
    nca payushca visarjayitavya nca buddhishca boddhavya ncahankarashcahankartavya nca tejashca vidyotayitavya
    nca pranashca vidharayitavya || esha hi drashta sprashta shrota ghrata rasayita manta boddha karta
    vijnanatma purushah| sa pare 'kshara atmani sampratishthate || mpratipadyate sa yo ha vai tadacchayamashariramalohitam
    shubhramaksharam ve~dayate yastu somya sa sarvajna ssarvo bhavati tadesha shlokah || || vijnanatma
    saha devaishca sarvaih prana bhutani sampratishthanti yatra| tadaksharam ve~dayate yastu somya sa
    sarvajna ssarvamevavivesheti ||
  devanagari: चतुर्थः प्रश्नः अथ हैनं सौर्यायणी गार्ग्यः पप्रच्छ। भगवन्नेतस्मि न्पुरुषे कानि स्वपन्ति
    कान्यस्मिञ्जाग्रति कतर एष देव न्पश्यति कस्यैतत्सुख म्भवति कस्मिन्नु सर्वे सम्प्रतिष्ठिता भवन्तीति
    ॥ ॥ तस्मै स होवाच। यथा गार्ग्य मरीचयो स्सर्वा एतस्मिंस्तेजोमण्डल एकीभवन्ति। ताः पुनः पुनरुदयतः प्रचरन्त्येवं
    ह वै त म्परे देवे मनस्येकीभवति। तेन तर् ह्येष पुरुषो न शृणोति न पश्यति न जिघ्रति न रसयते न स्पृशते
    नाभिवदते नादत्ते नानन्दयते न विसृजते नेयायते स्वपितीत्याचक्षते ॥ ॥ प्राणाग्नय एवैतस्मि न्पुरे जाग्रति।
    गार् ऽन्वाहार्यपचनो यद् गार् त्प्रणीयते प्रणयनादाहवनीयः प्राणः ॥ ॥ यदुच्छ्वासनिस्श्वासावेतावाहुती
    सम न्नयतीति स समानः। मनो ह वाव यजमानः इष्टफलमेवोदान यँजमानमहरहर्ब्रह्म गमयति ॥ स्स्वप्ने महिमानमनुभवति।
    यद् दृष्ट न्दृष्टमनुपश्यति श्रुतं श्रुतमेवार्थमनुशृणोति देशदिगन्तरैश्च प्रत्यनुभूत म्पुनः पुनः प्रत्यनुभवति
    दृष्ट म्पश्यति सर्वः पश्यति ॥ ॥ स यदा तेजसाभिभूतो भवत्यत्रैष देव न्न पश्यत्यथ यदैतस्मिञ्शरीरे एतत्सुख
    ॥ स यथा सोम्य वयांसि वासोवृक्षं सम्प्रतिष्ठन्ते एवं ह वै त म्पर आत्मनि सम्प्रतिष्ठते ॥ ॥ पृथिवी च
    पृथिवीमात्रा चापश्चापोमात्रा च तेजश्च तेजोमात्रा च वायुश्च वायुमात्रा चाकाशश्चाकाशमात्रा च चक्षुश्च
    द्रष्टव्य ञ्चोपस्थश्चानन्दयितव्य ञ्च पायुश्च विसर्जयितव्य ञ्च बुद्धिश्च बोद्धव्य ञ्चाहङ्कारश्चाहङ्कर्तव्य
    ञ्च तेजश्च विद्योतयितव्य ञ्च प्राणश्च विधारयितव्य ॥ एष हि द्रष्टा स्प्रष्टा श्रोता घ्राता रसयिता मन्ता
    बोद्धा कर्ता विज्ञानात्मा पुरुषः। स परे ऽक्षर आत्मनि सम्प्रतिष्ठते ॥ म्प्रतिपद्यते स यो ह वै तदच्छायमशरीरमलोहितं
    शुभ्रमक्षरं वेँदयते यस्तु सोम्य स सर्वज्ञ स्सर्वो भवति तदेष श्लोकः ॥ ॥ विज्ञानात्मा सह देवैश्च सर्वैः
    प्राणा भूतानि सम्प्रतिष्ठन्ति यत्र। तदक्षरं वेँदयते यस्तु सोम्य स सर्वज्ञ स्सर्वमेवाविवेशेति ॥
