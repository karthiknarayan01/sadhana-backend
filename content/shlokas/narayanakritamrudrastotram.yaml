id: narayanakritamrudrastotram
category: stotram
name:
  english: narayanakritamrudrastotram
  devanagari: नारायणकृतंरुद्रस्तोत्रम्
content:
  english: narayanakritam rudrastotram tvatsambhuta bhutakrito varenya goptaro'dya bhuvanam purvadevah
    | avishyemam dharanim ye'bhyarakshanpura puranam tava deva srishtim || 66|| surasurannagarakshahpishacannaransuparnanatha
    gandharvayakshan | prithagvidhanbhutasanghamshca vishvamstvatsambhutanvidma sarvamstathaiva | aindram
    yamyam varunam vaittapalyam maitram tvashtram karma saumyam ca tubhyam || 67|| rupam jyotih shabda
    akashavayuh sparshah svadyam salilam gandha urvi | kamo brahma brahma ca brahmanashca tvatsambhutam
    sthasnu carishnu cedam || 68|| adbhyah stoka yanti yatha prithaktvam tabhishcaikyam sankshaye yanti
    bhuyah | evam vidvanprabhavam capyayam ca hitva bhutanam tatra sayujyameti || 69|| divyavritau manasau
    dvau suparnavavavashakhah pippalah sapta gopah | dashapyanye ye puram dharayanti tvaya srishtaste
    hi tebhyah parastvam || 70|| bhutam bhavyam bhavita capyadhrishyam tvatsambhuta bhuvananiha vishva
    | bhaktam ca mam bhajamanam bhajasva ma ririsho mamahitahitena | atmanam tvamatmano'nanyabhavo vidvanevam
    gacchati brahma shukram || 71|| astausham tvam tava sammanamicchanvicinvanvai savrisham devavarya
    | sudurlabhandehi varanmameshtanabhishtutah pratikarshishca ma mam || 72|| tasmai varanacintyatma
    nilakanthah pinakadhrik | arhate devamukhyaya prayacchadrishisamstutah || 73|| iti mahabharate dronaparvani
    172 adhyayantargatam narayanakritam rudrastotram sampurnam | mahabharata | dronaparva | adhyaya 172
  devanagari: नारायणकृतं रुद्रस्तोत्रम् त्वत्सम्भूता भूतकृतो वरेण्य गोप्तारोऽद्य भुवनं पूर्वदेवाः । आविश्येमां
    धरणीं येऽभ्यरक्षन्पुरा पुराणां तव देव सृष्टिम् ॥ ६६॥ सुरासुरान्नागरक्षःपिशाचान्नरान्सुपर्णानथ गन्धर्वयक्षान्
    । पृथग्विधान्भूतसङ्घांश्च विश्वांस्त्वत्सम्भूतान्विद्म सर्वांस्तथैव । ऐन्द्रं याम्यं वारुणं वैत्तपाल्यं
    मैत्रं त्वाष्ट्रं कर्म सौम्यं च तुभ्यम् ॥ ६७॥ रूपं ज्योतिः शब्द आकाशवायुः स्पर्शः स्वाद्यं सलिलं गन्ध
    उर्वी । कामो ब्रह्मा ब्रह्म च ब्राह्मणाश्च त्वत्सम्भूतं स्थास्नु चरिष्णु चेदम् ॥ ६८॥ अद्भ्यः स्तोका
    यान्ति यथा पृथक्त्वं ताभिश्चैक्यं सङ्क्षये यान्ति भूयः । एवं विद्वान्प्रभवं चाप्ययं च हित्वा भूतानां
    तत्र सायुज्यमेति ॥ ६९॥ दिव्यावृतौ मानसौ द्वौ सुपर्णाववावशाखः पिप्पलः सप्त गोपाः । दशाप्यन्ये ये पुरं
    धारयन्ति त्वया सृष्टास्ते हि तेभ्यः परस्त्वम् ॥ ७०॥ भूतं भव्यं भविता चाप्यधृष्यं त्वत्सम्भूता भुवनानीह
    विश्वा । भक्तं च मां भजमानं भजस्व मा रीरिषो मामहिताहितेन । आत्मानं त्वामात्मनोऽनन्यभावो विद्वानेवं
    गच्छति ब्रह्म शुक्रम् ॥ ७१॥ अस्तौषं त्वां तव सम्मानमिच्छन्विचिन्वन्वै सवृषं देववर्य । सुदुर्लभान्देहि
    वरान्ममेष्टानभिष्टुतः प्रतिकार्षीश्च मा माम् ॥ ७२॥ तस्मै वरानचिन्त्यात्मा नीलकण्ठः पिनाकधृक् । अर्हते
    देवमुख्याय प्रायच्छदृषिसंस्तुतः ॥ ७३॥ इति महाभारते द्रोणपर्वणि १७२ अध्यायान्तर्गतं नारायणकृतं रुद्रस्तोत्रं
    सम्पूर्णम् । महाभारत । द्रोणपर्व । अध्याय १७२
