id: rudramantravyakhyavarnanam
category: mantra
name:
  english: rudramantravyakhyavarnanam
  devanagari: रुद्रमन्त्रव्याख्यावर्णनम्
content:
  english: santi dharmah shrutiproktah puranoktashca kotishah | teshu dharmeshu sarveshu dharmah panca
    manoharah || 72|| vibhutidharanam dharmah tatha rudrakshadharanam | rudradhyayajapo linge bilvaih
    shankarapujanam || 73|| pancamam shivanaivedyabhojanam taih param narah | kritairmukto bhavatyeva
    mahapatakakotibhih || 74|| narinam ca naranam ca dharmo'yam tulya ityatah | avisheshena kartavyah
    sarveshamapi sarvatha || 75|| rudradhyayajape shaktih strinam yadi na sarvatha | tada pancaksharo
    japyah vedasarataya smritah || 76|| dadhimanthanasampraptanavanitanibham viduh | pancaksharamahamantram
    vedarashivinirgatam || 77|| ayam mantrah paro mantrah sarvamantrottamottamah | mantrarajadhirajo'yam
    mantraratnamiti smritah || 78|| vedaih paramayam mantro japtah pancaksharah parah | maheshvarena japto'yam
    japto'pyambikaya muda || 79|| kumarenapi japto'yam ganeshenapi sadaram | shrikalabhairavenapi japtah
    pancaksharah param || 80|| virabhadrena japto'yam nandikeshena sadaram | sabhringipramukhaih sarvaih
    ganairjaptah sa kinnaraih || 81|| gandharvaih parijapto'yam sakalatraishca pannagah | narayanena japto'yam
    japto'yam ramaya muda || 82|| brahmanapi sarasvatya japto'yam paramo manuh | indrena japtah shacya
    ca candrenapi prayatnatah || 83|| agninapi prajapto'yam svahayapi prayatnatah | vayunapi prajapto'yam
    bhumya japto visheshatah || 84|| yamenapi prajapto'yamanyaishcapi suraistatha | dadhicipramukhaih
    sarvaih japto'yam munibhih sada || 85|| ayameva paro mantrah sarvesham mokshadayakah | suryena vayuna
    japtashcandrenapi prayatnatah || 86|| pancaksharakarasudhasamudram kritva maharudramivaparam tam |
    ko va na tanmantrajapanuraktah tyaktva pashughnam kritapaparashim || 87|| ito'dhikah ko'pi na vedamadhye
    mantro'sti mantradhipa eva so'yam | ayam smritashcenmaranavasane muktih param kim na karaprapanna
    || 88|| mantreshvayam shambhavamantrarajarajadhirajah khalu shaivamantrah | atah sa evamitapunyahetuh
    sa eva mokshaya vinirmito'pi || 89|| || iti shivarahasyantargate satyavrataproktam rudramantravyakhyavarnanam
    sampurnam ||
  devanagari: सन्ति धर्माः श्रुतिप्रोक्ताः पुराणोक्ताश्च कोटिशः । तेषु धर्मेषु सर्वेषु धर्माः पञ्च मनोहराः
    ॥ ७२॥ विभूतिधारणं धर्मः तथा रुद्राक्षधारणम् । रुद्राध्यायजपो लिङ्गे बिल्वैः शाङ्करपूजनम् ॥ ७३॥ पञ्चमं
    शिवनैवेद्यभोजनं तैः परं नरः । कृतैर्मुक्तो भवत्येव महापातककोटिभिः ॥ ७४॥ नारीणां च नराणां च धर्मोऽयं
    तुल्य इत्यतः । अविशेषेण कर्तव्यः सर्वेषामपि सर्वथा ॥ ७५॥ रुद्राध्यायजपे शक्तिः स्त्रीणां यदि न सर्वथा
    । तदा पञ्चाक्षरो जप्यः वेदसारतया स्मृतः ॥ ७६॥ दधिमन्थनसम्प्राप्तनवनीतनिभं विदुः । पञ्चाक्षरमहामन्त्रं
    वेदराशिविनिर्गतम् ॥ ७७॥ अयं मन्त्रः परो मन्त्रः सर्वमन्त्रोत्तमोत्तमः । मन्त्रराजाधिराजोऽयं मन्त्ररत्नमिति
    स्मृतः ॥ ७८॥ वेदैः परमयं मन्त्रो जप्तः पञ्चाक्षरः परः । महेश्वरेण जप्तोऽयं जप्तोऽप्यम्बिकया मुदा ॥
    ७९॥ कुमारेणापि जप्तोऽयं गणेशेनापि सादरम् । श्रीकालभैरवेणापि जप्तः पञ्चाक्षरः परम् ॥ ८०॥ वीरभद्रेण
    जप्तोऽयं नन्दिकेशेन सादरम् । सभृङ्गिप्रमुखैः सर्वैः गणैर्जप्तः स किन्नरैः ॥ ८१॥ गन्धर्वैः परिजप्तोऽयं
    सकलत्रैश्च पन्नगः । नारायणेन जप्तोऽयं जप्तोऽयं रमया मुदा ॥ ८२॥ ब्रह्मणापि सरस्वत्या जप्तोऽयं परमो
    मनुः । इन्द्रेण जप्तः शच्या च चन्द्रेणापि प्रयत्नतः ॥ ८३॥ अग्निनापि प्रजप्तोऽयं स्वाहयापि प्रयत्नतः
    । वायुनापि प्रजप्तोऽयं भूम्या जप्तो विशेषतः ॥ ८४॥ यमेनापि प्रजप्तोऽयमन्यैश्चापि सुरैस्तथा । दधीचिप्रमुखैः
    सर्वैः जप्तोऽयं मुनिभिः सदा ॥ ८५॥ अयमेव परो मन्त्रः सर्वेषां मोक्षदायकः । सूर्येण वायुना जप्तश्चन्द्रेणापि
    प्रयत्नतः ॥ ८६॥ पञ्चाक्षरकारसुधासमुद्रं कृत्वा महारुद्रमिवापरं तम् । को वा न तन्मन्त्रजपानुरक्तः त्यक्त्वा
    पशुघ्नं कृतपापराशिम् ॥ ८७॥ इतोऽधिकः कोऽपि न वेदमध्ये मन्त्रोऽस्ति मन्त्राधिप एव सोऽयम् । अयं स्मृतश्चेन्मरणावसाने
    मुक्तिः परं किं न करप्रपन्ना ॥ ८८॥ मन्त्रेष्वयं शाम्भवमन्त्रराजराजाधिराजः खलु शैवमन्त्रः । अतः स एवामितपुण्यहेतुः
    स एव मोक्षाय विनिर्मितोऽपि ॥ ८९॥ ॥ इति शिवरहस्यान्तर्गते सत्यव्रतप्रोक्तं रुद्रमन्त्रव्याख्यावर्णनं
    सम्पूर्णम् ॥
