id: mundaka
category: upanishad
name:
  english: mundaka
  devanagari: मुन्दक
content:
  english: ttenaturah kshinalokashcyavante || 9|| ishtapurtam manyamana varishtham nanyacchreyo vedayante
    pramudhah | nakasya prishthe te sukrite'nubhutvemam lokam hinataram va vishanti || 10|| tapahshraddhe
    ye hyupavasantyaranye shanta vidvamso bhaikshyacaryam carantah | suryadvarena te virajah prayanti
    yatramritah sa purusho hyavyayatma || 11|| parikshya lokan karmacitan brahmano nirvedamayannastyakritah
    kritena | tadvijnanartham sa gurumevabhigacchet samitpanih shrotriyam brahmanishtham || 12|| tasmai
    sa vidvanupasannaya samyak prashantacittaya shamanvitaya | yenaksharam purusham veda satyam provaca
    tam tattvato brahmavidyam || 13|| || iti mundakopanishadi prathamamundake dvitiyah khandah || 2 ||
    dvitiya mundake prathamah khandah || tadetatsatyam yatha sudiptatpavakadvisphulingah sahasrashah prabhavante
    sarupah | tatha'ksharadvividhah somya bhavah prajayante tatra caivapiyanti || 1|| divyo hyamurtah
    purushah sabahyabhyantaro hyajah | aprano hyamanah shubhro hyaksharatparatah parah || 2|| etasmajjayate
    prano manah sarvendriyani ca | kham vayurjyotirapah prithivi vishvasya dharini || 3|| agnirmurdha
    cakshushi candrasuryau dishah shrotre vagvivritashca vedah | vayuh prano hridayam vishvamasya padbhyam
    prithivi hyesha sarvabhutantaratma || 4|| tasmadagnih samidho yasya suryah somatparjanya oshadhayah
    prithivyam | puman retah sincati yoshitayam bahvih prajah purushatsamprasutah || 5|| tasmadricah sama
    yaju
  devanagari: त्तेनातुराः क्षीणलोकाश्च्यवन्ते ॥ ९॥ इष्टापूर्तं मन्यमाना वरिष्ठं नान्यच्छ्रेयो वेदयन्ते
    प्रमूढाः । नाकस्य पृष्ठे ते सुकृतेऽनुभूत्वेमं लोकं हीनतरं वा विशन्ति ॥ १०॥ तपःश्रद्धे ये ह्युपवसन्त्यरण्ये
    शान्ता विद्वांसो भैक्ष्यचर्यां चरन्तः । सूर्यद्वारेण ते विरजाः प्रयान्ति यत्रामृतः स पुरुषो ह्यव्ययात्मा
    ॥ ११॥ परीक्ष्य लोकान् कर्मचितान् ब्राह्मणो निर्वेदमायान्नास्त्यकृतः कृतेन । तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत्
    समित्पाणिः श्रोत्रियं ब्रह्मनिष्ठम् ॥ १२॥ तस्मै स विद्वानुपसन्नाय सम्यक् प्रशान्तचित्ताय शमान्विताय
    । येनाक्षरं पुरुषं वेद सत्यं प्रोवाच तां तत्त्वतो ब्रह्मविद्याम् ॥ १३॥ ॥ इति मुण्डकोपनिषदि प्रथममुण्डके
    द्वितीयः खण्डः ॥ २ ॥ द्वितीय मुण्डके प्रथमः खण्डः ॥ तदेतत्सत्यं यथा सुदीप्तात्पावकाद्विस्फुलिङ्गाः
    सहस्रशः प्रभवन्ते सरूपाः । तथाऽक्षराद्विविधाः सोम्य भावाः प्रजायन्ते तत्र चैवापियन्ति ॥ १॥ दिव्यो
    ह्यमूर्तः पुरुषः सबाह्याभ्यन्तरो ह्यजः । अप्राणो ह्यमनाः शुभ्रो ह्यक्षरात्परतः परः ॥ २॥ एतस्माज्जायते
    प्राणो मनः सर्वेन्द्रियाणि च । खं वायुर्ज्योतिरापः पृथिवी विश्वस्य धारिणी ॥ ३॥ अग्निर्मूर्धा चक्षुषी
    चन्द्रसूर्यौ दिशः श्रोत्रे वाग्विवृताश्च वेदाः । वायुः प्राणो हृदयं विश्वमस्य पद्भ्यां पृथिवी ह्येष
    सर्वभूतान्तरात्मा ॥ ४॥ तस्मादग्निः समिधो यस्य सूर्यः सोमात्पर्जन्य ओषधयः पृथिव्याम् । पुमान् रेतः
    सिञ्चति योषितायां बह्वीः प्रजाः पुरुषात्संप्रसूताः ॥ ५॥ तस्मादृचः साम यजू
