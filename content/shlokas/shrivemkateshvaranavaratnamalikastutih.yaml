id: shrivemkateshvaranavaratnamalikastutih
category: stotram
name:
  english: shrivemkateshvaranavaratnamalikastutih
  devanagari: श्रीवेंकटेश्वरनवरत्नमालिकास्तुतिः
content:
  english: shrivenkateshvaranavaratnamalikastutih shrimanambhodhikanyaviharanabhavanibhutavakshahpradeshah
    bhasvadbhogindrabhumidharavarashikharaprantakelirasajnah | shashvadbrahmendravahnipramukhasuravararadhyamananghripadmah
    payanmam venkateshah pranatajanamanahkamanakalpashakhi || 1|| yasmin vishvam samastam caramacaramidam
    drishyate vriddhimeti bhrashyatyante ca tadrigvibhavavilasitasso'yamanandamurtih | padmavasamukhambhoruhamada
    dhu madhuvidvibhramonnidracetah shashvadbhuyadvinamrakhilamuninivaho bhuyase shreyase me || 2|| vande
    devam mahantam darahasitalasadvaktracandrabhiramam navyonnidravadatambujaruciravishalekshanadvandvaramyam
    | rajanmartandatejahprasitashubhamahakaustubhodbhasyuraskam shantam shrishankhacakradyamalakarayutam
    bhavyapitambaradhyam || 3|| payadvishvasya sakshi prabhurakhilajagatkaranam shashvato'yam padaprahvagharashiprashamananibhritambhodharaprabhavo
    mam | byaktavyaktasvarupo duradhigamapadah praktaninam ca vacam dhyeyo yogindracetassarasijaniyatanandadikshaviharah
    || 4|| adyam tejovisheshairupagatadashadinmandalabhyantaralam sukshmam sukshmatiriktam bhavabhayaharanam
    divyabhavyasvarupam | lakshmikantam khagendradhvajamaghashamanam kamitarthaikahetum vande govindamindivaranavajaladashyamalam
    caruhasam || 5|| rakacandropamasyam lalitakuvalayashyamamambhojanetram dhyayamyajanubahum halanalinagadasharngarekhancitanghrim
    | karunyancatkataksham kalashajaladhijapinavakshojakosha
  devanagari: श्रीवेङ्कटेश्वरनवरत्नमालिकास्तुतिः श्रीमानम्भोधिकन्याविहरणभवनीभूतवक्षःप्रदेशः भास्वद्भोगीन्द्रभूमीधरवरशिखरप्रान्तकेलीरसज्ञः
    । शश्वद्ब्रह्मेन्द्रवह्निप्रमुखसुरवराराध्यमानाङ्घ्रिपद्मः पायान्मां वेङ्कटेशः प्रणतजनमनःकामनाकल्पशाखी
    ॥ १॥ यस्मिन् विश्वं समस्तं चरमचरमिदं दृश्यते वृद्धिमेति भ्रश्यत्यन्ते च तादृग्विभवविलसितस्सोऽयमानन्दमूर्तिः
    । पद्मावासामुखाम्भोरुहमद धु मधुविद्विभ्रमोन्निद्रचेताः शश्वद्भूयाद्विनम्राखिलमुनिनिवहो भूयसे श्रेयसे
    मे ॥ २॥ वन्दे देवं महान्तं दरहसितलसद्वक्त्रचन्द्राभिरामं नव्योन्निद्रावदाताम्बुजरुचिरविशालेक्षणद्वन्द्वरम्यम्
    । राजन्मार्ताण्डतेजःप्रसितशुभमहाकौस्तुभोद्भास्युरस्कं शान्तं श्रीशङ्खचक्राद्यमलकरयुतं भव्यपीताम्बराढ्यम्
    ॥ ३॥ पायाद्विश्वस्य साक्षी प्रभुरखिलजगत्कारणं शाश्वतोऽयं पादप्रह्वाघराशिप्रशमननिभृताम्भोधरप्राभवो
    माम् । ब्यक्ताव्यक्तस्वरूपो दुरधिगमपदः प्राक्तनीनां च वाचां ध्येयो योगीन्द्रचेतस्सरसिजनियतानन्ददीक्षाविहारः
    ॥ ४॥ आद्यं तेजोविशेषैरुपगतदशदिङ्मण्डलाभ्यन्तरालं सूक्ष्मं सूक्ष्मातिरिक्तं भवभयहरणं दिव्यभव्यस्वरूपम्
    । लक्ष्मीकान्तं खगेन्द्रध्वजमघशमनं कामितार्थैकहेतुं वन्दे गोविन्दमिन्दीवरनवजलदश्यामलं चारुहासम् ॥
    ५॥ राकाचन्द्रोपमास्यं ललितकुवलयश्याममम्भोजनेत्रं ध्यायाम्याजानुबाहुं हलनलिनगदाशार्ङ्गरेखाञ्चिताङ्घ्रिम्
    । कारुण्याञ्चत्कटाक्षं कलशजलधिजापीनवक्षोजकोशा
