id: r-02
category: veda
name:
  english: r 02
  devanagari: र् ०२
content:
  english: 03 tava̱ tyannarya̭m nri̱to'pa̭ indra pratha̱mam pu̱rvyam di̱vi pra̱vacya̭m kri̱tam | yadde̱vasya̱
    shava̭sa̱ prari̭na̱ asṷm ri̱nanna̱pah | bhuva̱dvishva̭ma̱bhyadḙva̱moja̭sa vi̱dadurja̭m sha̱takra̭turvi̱dadisha̭m
    || 2
  devanagari: ०३ तव॒ त्यन्नर्यं॑ नृ॒तोऽप॑ इन्द्र प्रथ॒मं पू॒र्व्यं दि॒वि प्र॒वाच्यं॑ कृ॒तम् । यद्दे॒वस्य॒
    शव॑सा॒ प्रारि॑णा॒ असुं॑ रि॒णन्न॒पः । भुव॒द्विश्व॑म॒भ्यादे॑व॒मोज॑सा वि॒दादूर्जं॑ श॒तक्र॑तुर्वि॒दादिष॑म्
    ॥ २
