id: paninikritamrudrastotram
category: stotram
name:
  english: paninikritamrudrastotram
  devanagari: पाणिनिकृतंरुद्रस्तोत्रम्
content:
  english: paninikritam rudrastotram paniniruvaca | namo rudraya mahate sarveshaya hitaishine | nandisamsthaya
    devaya vidyabhayakaraya ca || 7|| papantakaya bhargaya namo'nantaya vedhase | namo mayahareshaya namaste
    lokashankara || 8|| yadi prasanno devesha vidyamulaprado bhava | param tirtham hi me dehi dvaimaturapitarnamah
    || 9|| iti bhavishyapurane pratisargaparvani dvitiyakhande ekatrimshadhyayantargatam paninikritam
    rudrastotram samaptam | bhavishyapurana | pratisargaparva | dvitiyakhanda | adhyaya 31
  devanagari: पाणिनिकृतं रुद्रस्तोत्रम् पाणिनिरुवाच । नमो रुद्राय महते सर्वेशाय हितैषिणे । नन्दीसंस्थाय
    देवाय विद्याभयकराय च ॥ ७॥ पापान्तकाय भर्गाय नमोऽनन्ताय वेधसे । नमो मायाहरेशाय नमस्ते लोकशङ्कर ॥ ८॥
    यदि प्रसन्नो देवेश विद्यामूलप्रदो भव । परं तीर्थं हि मे देहि द्वैमातुरपितर्नमः ॥ ९॥ इति भविष्यपुराणे
    प्रतिसर्गपर्वणि द्वितीयखण्डे एकत्रिंशाध्यायान्तर्गतं पाणिनिकृतं रुद्रस्तोत्रं समाप्तम् । भविष्यपुराण
    । प्रतिसर्गपर्व । द्वितीयखण्ड । अध्याय ३१
meaning: {}
