id: brahmakritam2shrikrishnastotram
category: stotram
name:
  english: brahmakritam2shrikrishnastotram
  devanagari: ब्रह्मकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: brahmakritam 2 shrikrishnastotram brahmovaca | jaya jaya jagadisha vanditacarana nirguna nirakara
    svecchamaya bhaktanugraha nityavigraha || 23|| gopavesha mayaya mayesha suvesha sushila shanta sarvakanta
    danta nitantajnanananda paratparatara prakriteh para sarvantaratmarupa nirlipta sakshisvarupa vyaktavyakta
    niranjana bharavatarana karunarnava shokasantapagrasana jaramrityubhayadiharana sharanapanjara bhaktanugrahakaraka
    bhaktavatsala bhaktasancitadhana om namo'stu te || 24|| sarpadhishthatridevayetyuktva vai prinanaya
    ca | punahpunaruvacedam murcchitashca babhuva ha || 25|| iti brahmakritam stotram yah sha
  devanagari: ब्रह्मकृतं २ श्रीकृष्णस्तोत्रम् ब्रह्मोवाच । जय जय जगदीश वन्दितचरण निर्गुण निराकार स्वेच्छामय
    भक्तानुग्रह नित्यविग्रह ॥ २३॥ गोपवेष मायया मायेश सुवेष सुशील शान्त सर्वकान्त दान्त नितान्तज्ञानानन्द
    परात्परतर प्रकृतेः पर सर्वान्तरात्मरूप निर्लिप्त साक्षिस्वरूप व्यक्ताव्यक्त निरञ्जन भारावतारण करुणार्णव
    शोकसन्तापग्रसन जरामृत्युभयादिहरण शरणपञ्जर भक्तानुग्रहकारक भक्तवत्सल भक्तसञ्चितधन ॐ नमोऽस्तु ते ॥ २४॥
    सर्पाधिष्ठातृदेवायेत्युक्त्वा वै प्रीणनाय च । पुनःपुनरुवाचेदं मूर्च्छितश्च बभूव ह ॥ २५॥ इति ब्रह्मकृतं
    स्तोत्रं यः श
meaning: {}
