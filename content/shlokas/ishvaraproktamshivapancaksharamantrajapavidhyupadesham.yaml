id: ishvaraproktamshivapancaksharamantrajapavidhyupadesham
category: mantra
name:
  english: ishvaraproktamshivapancaksharamantrajapavidhyupadesham
  devanagari: ईश्वरप्रोक्तंशिवपन्चाक्षरमन्त्रजपविध्युपदेशम्
content:
  english: pancaksharamrishishchando bijashakti ca daivatam | nyasam shadangadigbandham viniyogamasheshatah
    || 1|| proktavanahamaryanam jagatah srishtihetave | tatastanmantramahatmyadrishayastapasedhitah ||
    2|| srishtim vitanvate samyak sadevasuramanusham | asyah paramavidyaya svarupamadhunocyate || 3||
    adau namah prayoktavyam shivayeti tatah param | saisha pancakshari vidya sarvashrutishirogata || 4||
    shabdajatasya sarvasya bijabhuta samasatah | prathamam manmukhodgirna sa mamaivatmavacika || 5|| tada
    camikaraprakhya pinonnatapayodhara | caturbhuja trinayana balendukritashekhara || 6|| padmotpaladhara
    saumya varadabhayapanika | sarvalakshanasampanna sarvabharanabhushita || 7|| sitapadmasanasina nilakuncitamurdhaja
    | asyam pancavidhavarnah prasphuradrashmimandalah || 8|| pitah krishnastatha dhumrah shvetabho rakta
    eva ca | prithakprayojya evaite bindunadavibhushitah || 9|| ardhacandrakritirbindurnado diptashikhakritih
    | bijam dvitiyam bijeshu mantrasyasya varanane || 10|| gautamo'trirvararohe vishvamitrastathangirah
    | bharadvajashca varnanam kramashah rishayah smritah || 11|| gayatryanushtubh trishtubh chandamsi
    brihati virat | indro rudro harirbrahma skandastesham ca devatah || 12|| mama pancamukhanyahuh sthanam
    tesham varanane | purvadicordhvaparyantam nakaradi yathakramam || 13|| udattah prathamo varnah caturthashca
    dvitiyakah | pancamah svaritashcaiva madhyamo nihatahsmritah || 14|| mulavidya shivasyaiva sutram
    pancaksharam tatha | namanyasya vijaniyat saiva me hridayam matam || 15|| nakarah shira ucyeta makarastu
    shikhocyate | shikaram kavacam tadvat vakaro netramucyate || 16|| yakaro'stram namah svaha vashaddhum
    vaushadityapi | phadityapi ca varnanam matangatvam yatha tatha || 17|| tavapi mulamantro'yam kincidbhedasamanvayat
    | tatrasya pancamo varno dvadashasvarabhushitah || 18|| tasmadanena mantrena manovakkayabhedatah |
    avayorarcanam kuryajjapahomadikam tatha || 19|| yathaprajnam yathashraddham yathakalam yathasmriti
    | yathashakti yathasampat yathayogam yatharati || 20|| yada kadapi va bhaktya yatrakutrapi va krita
    | yena kenapi va devi puja muktim nayishyati || 21|| mayyasaktena manasa yatkritam mama sundari |
    tatpriyam ca shivam caiva kramenapyakramena va || 22|| tathapi mama bhakta ye na santi vivashah punah
    | teshamarthena shastreshu mayaiva niyamah kritah || 23|| pancaksharakshapitapapaganam ca kritsnam
    | rakshabhiliptashirasamabhirakshakeyam || 24|| rukshabhavantyakhilarakshasayakshasanghah sandhukshitah
    paribhavanti shivakshajalaih | pratah pradoshe nishi vasare va tryakshanuraktahridayo japati pramodat
    || 25|| || iti shivarahasyantargate ishvaraproktam shivapancaksharamantrajapaphalam sampurnam ||
  devanagari: पञ्चाक्षरमृषिश्छन्दो बीजशक्ती च दैवतम् । न्यासं षडङ्गदिग्बन्धं विनियोगमशेषतः ॥ १॥ प्रोक्तवानहमार्याणां
    जगतः सृष्टिहेतवे । ततस्तन्मन्त्रमाहात्म्यादृषयस्तपसेधिताः ॥ २॥ सृष्टिं वितन्वते सम्यक् सदेवासुरमानुषाम्
    । अस्याः परमविद्याया स्वरूपमधुनोच्यते ॥ ३॥ आदौ नमः प्रयोक्तव्यं शिवायेति ततः परम् । सैषा पञ्चाक्षरी
    विद्या सर्वश्रुतिशिरोगता ॥ ४॥ शब्दजातस्य सर्वस्य बीजभूता समासतः । प्रथमं मन्मुखोद्गीर्णा सा ममैवात्मवाचिका
    ॥ ५॥ तदा चामीकरप्रख्या पीनोन्नतपयोधरा । चतुर्भुजा त्रिणयना बालेन्दुकृतशेखरा ॥ ६॥ पद्मोत्पलधरा सौम्य
    वरदाभयपाणिका । सर्वलक्षणसम्पन्ना सर्वाभरणभूषिता ॥ ७॥ सितपद्मासनासीना नीलकुञ्चितमूर्धजा । अस्यां पञ्चविधावर्णाः
    प्रस्फुरद्रश्मिमण्डलाः ॥ ८॥ पीतः कृष्णस्तथा धूम्रः श्वेताभो रक्त एव च । पृथक्प्रयोज्या एवैते बिन्दुनादविभूषिताः
    ॥ ९॥ अर्धचन्द्राकृतिर्बिन्दुर्नादो दीप्तशिखाकृतिः । बीजं द्वितीयं बीजेषु मन्त्रस्यास्य वरानने ॥ १०॥
    गौतमोऽत्रिर्वरारोहे विश्वामित्रस्तथाङ्गिराः । भरद्वाजश्च वर्णानां क्रमशः ऋषयः स्मृताः ॥ ११॥ गायत्र्यनुष्टुभ्
    त्रिष्टुभ् छन्दांसि बृहती विराट् । इन्द्रो रुद्रो हरिर्ब्रह्मा स्कन्दस्तेषां च देवताः ॥ १२॥ मम पञ्चमुखान्याहुः
    स्थानं तेषां वरानने । पूर्वादिचोर्ध्वपर्यन्तं नकारादि यथाक्रमम् ॥ १३॥ उदात्तः प्रथमो वर्णः चतुर्थश्च
    द्वितीयकः । पञ्चमः स्वरितश्चैव मध्यमो निहतःस्मृतः ॥ १४॥ मूलविद्या शिवस्यैव सूत्रं पञ्चाक्षरं तथा ।
    नामान्यस्य विजानीयात् सैव मे हृदयं मतम् ॥ १५॥ नकारः शिर उच्येत मकारस्तु शिखोच्यते । शिकारं कवचं तद्वत्
    वाकारो नेत्रमुच्यते ॥ १६॥ यकारोऽस्त्रं नमः स्वाहा वषड्ढुं वौषडित्यपि । फडित्यपि च वर्णानां मतङ्गत्वं
    यथा तथा ॥ १७॥ तवापि मूलमन्त्रोऽयं किञ्चिद्भेदसमन्वयात् । तत्रास्य पञ्चमो वर्णो द्वादशस्वरभूषितः ॥
    १८॥ तस्मादनेन मन्त्रेण मनोवाक्कायभेदतः । आवयोरर्चनं कुर्याज्जपहोमादिकं तथा ॥ १९॥ यथाप्रज्ञं यथाश्रद्धं
    यथाकालं यथास्मृति । यथाशक्ति यथासम्पत् यथायोगं यथारति ॥ २०॥ यदा कदापि वा भक्त्या यत्रकुत्रापि वा कृता
    । येन केनापि वा देवि पूजा मुक्तिं नयिष्यति ॥ २१॥ मय्यासक्तेन मनसा यत्कृतं मम सुन्दरि । तत्प्रियं च
    शिवं चैव क्रमेणाप्यक्रमेण वा ॥ २२॥ तथापि मम भक्ता ये न सन्ति विवशाः पुनः । तेषामर्थेन शास्त्रेषु मयैव
    नियमः कृतः ॥ २३॥ पञ्चाक्षरक्षपितपापगणं च कृत्स्नम् । रक्षाभिलिप्तशिरसामभिरक्षकेयम् ॥ २४॥ रूक्षाभवन्त्यखिलराक्षसयक्षसङ्घाः
    सन्धुक्षिताः परिभवन्ति शिवाक्षजालैः । प्रातः प्रदोषे निशि वासरे वा त्र्यक्षानुरक्तहृदयो जपति प्रमोदात्
    ॥ २५॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं शिवपञ्चाक्षरमन्त्रजपफलं सम्पूर्णम् ॥
