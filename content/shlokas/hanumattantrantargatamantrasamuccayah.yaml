id: hanumattantrantargatamantrasamuccayah
category: mantra
name:
  english: hanumattantrantargatamantrasamuccayah
  devanagari: हनुमत्तन्त्रान्तर्गतमन्त्रसमुच्चयः
content:
  english: shrihanumattantrantargatamantrasamuccayah om ham hanumate namah || om namo bhagavate hanumate
    anjaneyaya mahabalaya svaha || om ham hanumate mukhyapranaya namah || om hum pavananandanaya hanumate
    svaha || om namo bhagavate hanumate sarvabhutatmane svaha || om namo harimarkatamarkatamahaviraya
    svaha || om bhubhurvahsuvah shrihanumate namah || om shrihanumaddevatayai namah || om shrihanumanmaharudraya
    namah || om hrim shrim haum hram phat svaha | om ham namo hanumate ramadutaya rudratmakaya svaha ||
    om anjanasutaya mahaviryapramathanaya mahabalaya janakishokanivaranaya shriramacandrakripapadukaya
    brahmandanathaya kamadaya pancamukhavirahanumate svaha || om namo bhagavate anjaneyaya atmatattvaprakashaya
    svaha || om aim hram hanumate ramadutaya kilikilibubukarena vibhishanaya namo hanumaddevaya || anjaneyaya
    vidmahe mahabalaya dhimahi | tanno hanuman pracodayat || om namo bhagavate virahanumate pitambaradharaya
    karnakundaladya
  devanagari: श्रीहनुमत्तन्त्रान्तर्गतमन्त्रसमुच्चयः ॐ हं हनुमते नमः ॥ ॐ नमो भगवते हनुमते आञ्जनेयाय महाबलाय
    स्वाहा ॥ ॐ हं हनुमते मुख्यप्राणाय नमः ॥ ॐ हूं पवननन्दनाय हनुमते स्वाहा ॥ ॐ नमो भगवते हनुमते सर्वभूतात्मने
    स्वाहा ॥ ॐ नमो हरिमर्कटमर्कटमहावीराय स्वाहा ॥ ॐ भूभुर्वःसुवः श्रीहनुमते नमः ॥ ॐ श्रीहनुमद्देवतायै
    नमः ॥ ॐ श्रीहनुमन्महारुद्राय नमः ॥ ॐ ह्रीं श्रीं हौं ह्रां फट् स्वाहा । ॐ हं नमो हनुमते रामदूताय रुद्रात्मकाय
    स्वाहा ॥ ॐ अञ्जनासुताय महावीर्यप्रमथनाय महाबलाय जानकीशोकनिवारणाय श्रीरामचन्द्रकृपापादुकाय ब्रह्माण्डनाथाय
    कामदाय पञ्चमुखवीरहनुमते स्वाहा ॥ ॐ नमो भगवते आञ्जनेयाय आत्मतत्त्वप्रकाशाय स्वाहा ॥ ॐ ऐं ह्रां हनुमते
    रामदूताय किलिकिलिबुबुकारेण विभीषणाय नमो हनुमद्देवाय ॥ आञ्जनेयाय विद्महे महाबलाय धीमहि । तन्नो हनूमान्
    प्रचोदयात् ॥ ॐ नमो भगवते वीरहनुमते पीताम्बरधराय कर्णकुण्डलाद्या
