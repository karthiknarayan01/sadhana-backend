    करि पूजा मारीच तब सादर पूछी बात। कवन हेतु मन ब्यग्र अति अकसर आयहु तात ॥ ॥ दसमुख सकल कथा तेहि आगें।
    कही सहित अभिमान अभागेम् ॥ होहु कपट मृग तुम्ह छलकारी। जेहि बिधि हरि आनौ नृपनारी ॥ तेहिं पुनि कहा सुनहु
