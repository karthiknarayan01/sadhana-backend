id: rama-raksha-stotram
category: stotram
name:
  english: Rama Raksha Stotram
content:
  english: om asya shri ramaraksha stotramantrasya budhakaushika rishih shri sitarama candrodevata anushtup
    chandah sita shaktih shrimad hanuman kilakam shriramacandra prityarthe ramaraksha stotrajape viniyogah
    || dhyanam dhyayedajanubahum dhritashara dhanusham baddha padmasanastham pitam vasovasanam navakamala
    dalaspardhi netram prasannam | vamankarudha sitamukha kamalamilallocanam niradabham nanalankara diptam
    dadhatamuru jatamandalam ramacandram || stotram caritam raghunathasya shatakoti pravistaram | ekaikamaksharam
    pumsam mahapataka nashanam || || dhyatva nilotpala shyamam ramam rajivalocanam | janaki lakshmanopetam
    jatamukuta manditam || || sasituna dhanurbana panim naktam carantakam | svalilaya jagattratu || ramaraksham
    pathetprajnah papaghnim sarvakamadam | shiro me raghavah patu phalam || kausalyeyo drishaupatu vishvamitrapriyah
    shruti | ghranam patu makhatrata mukham saumitrivatsalah || || jihvam vidyanidhih patu kantham bharatavanditah
    | skandhau divyayudhah patu bhujau bhagneshakarmukah || || karau sitapatih patu hridayam jamadagnyajit
    | madhyam patu kharadhvamsi nabhim jambavadashrayah || || sugriveshah katim patu sakthini hanumat
    prabhuh | uru raghuttamah patu rakshahkula vinashakrit || patu janghe dashamukhantakah | padau vibhishanashridah
    patu ramo'khilam vapuh || || etam ramabalopetam raksham yah sukriti pathet | sa cirayuh sukhi putri
    vijayi vinayi bhavet || carinah | na drashtumapi shaktaste rakshitam ramanamabhih || || rameti ramabhadreti
    ramacandreti va smaran | naro na lipyate papairbhuktim muktim ca vindati || || jagajjaitraika mantrena
    ramanam nabhirakshitam | yah kanthe dharayettasya karasthah sarvasiddhayah || || vajrapanjara namedam
    yo ramakavacam smaret | avyahatajnah sarvatra labhate jayamangalam || yatha svapne ramarakshamimam
    harah | tatha likhitavan pratah prabuddho budhakaushikah || || aramah kalpavrikshanam viramah sakalapadam
    | abhirama strilokanam ramah shriman sa nah prabhuh || || tarunau rupasampannau sukumarau mahabalau
    | pundarika vishalakshau cirakrishnajinambarau || || phalamulashinau dantau tapasau brahmacarinau
    | putrau dasharathasyaitau bhratarau ramalakshmanau || || sharanyau sarvasattvanam shreshthau sarvadhanushmatam
    | rakshahkula nihantarau trayetam no raghuttamau || vakshayashuga nishanga sanginau | rakshanaya mama
    ramalakshmanavagratah pathi sadaiva gacchatam || || sannaddhah kavaci khadgi capabanadharo yuva |
    gacchan manorathannashca ramah patu sa lakshmanah || || ramo dasharathi shshuro lakshmananucaro bali
    | kakutsthah purushah purnah kausalyeyo raghuttamah || || vedantavedyo yajneshah puranapurushottamah
    | janakivallabhah shrima || ityetani japennityam madbhaktah shraddhayanvitah | ashvamedhadhikam punyam
    samprapnoti na samshayah || || ramam durvadala shyamam padmaksham pitavasasam | stuvanti namabhi rdivyairna
    te samsarino narah || || ramam lakshmana purvajam raghuvaram sitapatim sundaram kakutstham karunarnavam
    gunanidhim viprapriyam dharmikam | rajendram satyasandham dasharathatanayam shyamalam shantamurtim
    vande lokabhiramam raghukula tilakam raghavam ravanarim || || ramaya ramabhadraya ramacandraya vedhase
    | raghunathaya nathaya sitayah pataye namah || || shrirama rama raghunandana rama rama shrirama rama
    bharatagraja rama rama | shrirama rama ranakarkasha rama rama shrirama rama sharanam bhava rama rama
    || || shrirama candra caranau manasa smarami shrirama candra caranau vacasa grihnami | shrirama candra
    caranau shirasa namami shrirama candra caranau sharanam prapadye || pita ramacandrah svami ramo mat
    sakha ramacandrah | sarvasvam me ramacandro dayaluh nanyam jane naiva jane na jane || || dakshine
    lakshmano yasya vame ca janakatmaja | purato marutiryasya tam vande raghunandanam || || lokabhiramam
    ranarangadhiram rajivanetram raghuvamshanatham | karunyarupam karunakaram tam shriramacandram sharanam
    prapadye || || manojavam maruta tulya vegam jitendriyam buddhimatam varishtham | vatatmajam vanarayutha
    mukhyam shriramadutam sharanam prapadye || || kujantam ramarameti madhuram madhuraksharam | aruhya
    kavitashakham vande valmiki kokilam || || apadamapahartaram dataram sarvasampadam | lokabhiramam shriramam
    bhuyobhuyo namamyaham || || bharjanam bhavabijanamarjanam sukhasampadam | tarjanam yamadutanam rama
    rameti garjanam || || ramo rajamanih sada vijayate ramam ramesham bhaje ramenabhihata nishacaracamu
    ramaya tasmai namah | ramannasti parayanam parataram ramasya daso'smyaham rame cittalayah sada bhavatu
    me bho rama mamuddhara || || shrirama rama rameti rame rame manorame | sahasranama tattulyam rama
    nama varanane || || iti shribudhakaushikamuni viracitam shrirama rakshastotram sampurnam | shrirama
    jayarama jayajayarama |
  devanagari: ॐ अस्य श्री रामरक्षा स्तोत्रमन्त्रस्य बुधकौशिक ऋषिः श्री सीताराम चन्द्रोदेवता अनुष्टुप्
    छन्दः सीता शक्तिः श्रीमद् हनुमान् कीलकम् श्रीरामचन्द्र प्रीत्यर्थे रामरक्षा स्तोत्रजपे विनियोगः ॥
    ध्यानम् ध्यायेदाजानुबाहुं धृतशर धनुषं बद्ध पद्मासनस्थं पीतं वासोवसानं नवकमल दलस्पर्धि नेत्रं प्रसन्नम्
    । वामाङ्कारूढ सीतामुख कमलमिलल्लोचनं नीरदाभं नानालङ्कार दीप्तं दधतमुरु जटामण्डलं रामचन्द्रम् ॥ स्तोत्रम्
    चरितं रघुनाथस्य शतकोटि प्रविस्तरम् । एकैकमक्षरं पुंसां महापातक नाशनम् ॥ ॥ ध्यात्वा नीलोत्पल श्यामं
    रामं राजीवलोचनम् । जानकी लक्ष्मणोपेतं जटामुकुट मण्डितम् ॥ ॥ सासितूण धनुर्बाण पाणिं नक्तं चरान्तकम्
    । स्वलीलया जगत्त्रातु ॥ रामरक्षां पठेत्प्राज्ञः पापघ्नीं सर्वकामदाम् । शिरो मे राघवः पातु फालं ॥ कौसल्येयो
    दृशौपातु विश्वामित्रप्रियः श्रुती । घ्राणं पातु मखत्राता मुखं सौमित्रिवत्सलः ॥ ॥ जिह्वां विद्यानिधिः
    पातु कण्ठं भरतवन्दितः । स्कन्धौ दिव्यायुधः पातु भुजौ भग्नेशकार्मुकः ॥ ॥ करौ सीतापतिः पातु हृदयं जामदग्न्यजित्
    । मध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः ॥ ॥ सुग्रीवेशः कटिं पातु सक्थिनी हनुमत् प्रभुः । ऊरू रघूत्तमः
    पातु रक्षःकुल विनाशकृत् ॥ पातु जङ्घे दशमुखान्तकः । पादौ विभीषणश्रीदः पातु रामोऽखिलं वपुः ॥ ॥ एतां
    रामबलोपेतां रक्षां यः सुकृती पठेत् । स चिरायुः सुखी पुत्री विजयी विनयी भवेत् ॥ चारिणः । न द्रष्टुमपि
    शक्तास्ते रक्षितं रामनामभिः ॥ ॥ रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् । नरो न लिप्यते पापैर्भुक्तिं
    मुक्तिं च विन्दति ॥ ॥ जगज्जैत्रैक मन्त्रेण रामनाम् नाभिरक्षितम् । यः कण्ठे धारयेत्तस्य करस्थाः सर्वसिद्धयः
    ॥ ॥ वज्रपञ्जर नामेदं यो रामकवचं स्मरेत् । अव्याहताज्ञः सर्वत्र लभते जयमङ्गलम् ॥ यथा स्वप्ने रामरक्षामिमां
    हरः । तथा लिखितवान् प्रातः प्रबुद्धो बुधकौशिकः ॥ ॥ आरामः कल्पवृक्षाणां विरामः सकलापदाम् । अभिराम स्त्रिलोकानां
    रामः श्रीमान् स नः प्रभुः ॥ ॥ तरुणौ रूपसम्पन्नौ सुकुमारौ महाबलौ । पुण्डरीक विशालाक्षौ चीरकृष्णाजिनाम्बरौ
    ॥ ॥ फलमूलाशिनौ दान्तौ तापसौ ब्रह्मचारिणौ । पुत्रौ दशरथस्यैतौ भ्रातरौ रामलक्ष्मणौ ॥ ॥ शरण्यौ सर्वसत्त्वानां
    श्रेष्ठौ सर्वधनुष्मताम् । रक्षःकुल निहन्तारौ त्रायेतां नो रघूत्तमौ ॥ वक्षयाशुग निषङ्ग सङ्गिनौ । रक्षणाय
    मम रामलक्ष्मणावग्रतः पथि सदैव गच्छताम् ॥ ॥ सन्नद्धः कवची खड्गी चापबाणधरो युवा । गच्छन् मनोरथान्नश्च
    रामः पातु स लक्ष्मणः ॥ ॥ रामो दाशरथि श्शूरो लक्ष्मणानुचरो बली । काकुत्स्थः पुरुषः पूर्णः कौसल्येयो
    रघूत्तमः ॥ ॥ वेदान्तवेद्यो यज्ञेशः पुराणपुरुषोत्तमः । जानकीवल्लभः श्रीमा ॥ इत्येतानि जपेन्नित्यं मद्भक्तः
    श्रद्धयान्वितः । अश्वमेधाधिकं पुण्यं सम्प्राप्नोति न संशयः ॥ ॥ रामं दूर्वादल श्यामं पद्माक्षं पीतवाससम्
    । स्तुवन्ति नामभि र्दिव्यैर्न ते संसारिणो नराः ॥ ॥ रामं लक्ष्मण पूर्वजं रघुवरं सीतापतिं सुन्दरम् काकुत्स्थं
    करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम् । राजेन्द्रं सत्यसन्धं दशरथतनयं श्यामलं शान्तमूर्तिम् वन्दे
    लोकाभिरामं रघुकुल तिलकं राघवं रावणारिम् ॥ ॥ रामाय रामभद्राय रामचन्द्राय वेधसे । रघुनाथाय नाथाय सीतायाः
    पतये नमः ॥ ॥ श्रीराम राम रघुनन्दन राम राम श्रीराम राम भरताग्रज राम राम । श्रीराम राम रणकर्कश राम राम
    श्रीराम राम शरणं भव राम राम ॥ ॥ श्रीराम चन्द्र चरणौ मनसा स्मरामि श्रीराम चन्द्र चरणौ वचसा गृह्णामि
    । श्रीराम चन्द्र चरणौ शिरसा नमामि श्रीराम चन्द्र चरणौ शरणं प्रपद्ये ॥ पिता रामचन्द्रः स्वामी रामो
    मत् सखा रामचन्द्रः । सर्वस्वं मे रामचन्द्रो दयालुः नान्यं जाने नैव जाने न जाने ॥ ॥ दक्षिणे लक्ष्मणो
    यस्य वामे च जनकात्मजा । पुरतो मारुतिर्यस्य तं वन्दे रघुनन्दनम् ॥ ॥ लोकाभिरामं रणरङ्गधीरं राजीवनेत्रं
    रघुवंशनाथम् । कारुण्यरूपं करुणाकरं तं श्रीरामचन्द्रं शरणं प्रपद्ये ॥ ॥ मनोजवं मारुत तुल्य वेगं जितेन्द्रियं
    बुद्धिमतां वरिष्ठम् । वातात्मजं वानरयूथ मुख्यं श्रीरामदूतं शरणं प्रपद्ये ॥ ॥ कूजन्तं रामरामेति मधुरं
    मधुराक्षरम् । आरुह्य कविताशाखां वन्दे वाल्मीकि कोकिलम् ॥ ॥ आपदामपहर्तारं दातारं सर्वसम्पदाम् । लोकाभिरामं
    श्रीरामं भूयोभूयो नमाम्यहम् ॥ ॥ भर्जनं भवबीजानामर्जनं सुखसम्पदाम् । तर्जनं यमदूतानां राम रामेति गर्जनम्
    ॥ ॥ रामो राजमणिः सदा विजयते रामं रमेशं भजे रामेणाभिहता निशाचरचमू रामाय तस्मै नमः । रामान्नास्ति परायणं
    परतरं रामस्य दासोऽस्म्यहं रामे चित्तलयः सदा भवतु मे भो राम मामुद्धर ॥ ॥ श्रीराम राम रामेति रमे रामे
    मनोरमे । सहस्रनाम तत्तुल्यं राम नाम वरानने ॥ ॥ इति श्रीबुधकौशिकमुनि विरचितं श्रीराम रक्षास्तोत्रं
    सम्पूर्णम् । श्रीराम जयराम जयजयराम ।
