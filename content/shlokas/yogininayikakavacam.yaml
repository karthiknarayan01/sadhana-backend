id: yogininayikakavacam
category: kavacha
name:
  english: yogininayikakavacam
  devanagari: योगिनीनायिकाकवचम्
content:
  english: damareshu prakashitam | pathanaddharananmartyo yakshini vashamanayet || 3|| kavacasya rishirgargo
    gayatricchanda iritam | devata yakshini devi sarvasiddhipradayini || 4|| sakshatsiddhisamriddhyarthe
    viniyogah prakirtitah | om shiro me yakshini patu lalatam yakshakanyaka || 5|| mukham shridhanada
    patu karnau me kulanayika | cakshushi varada patu nasika bhaktavatsala || 6|| keshagram pingala patu
    dhanada shrimaheshvari | skandhau kulalaya patu galam me kamalanana || 7|| kiratini sada patu bhujayugmam
    jateshvari | vikritasya sada patu mahavakrapriya mama || 8|| astram hasta patu nityam prishthamudaradeshakam
    | merunda makari devi hridayam devasammata || 9|| alankaranvita patu me nitambasthalam daya | dharmika
    guhyadesham me padayugmam surangana || 10|| shunyagare sada patu mantramatasvarupini | nishkalanka
    sada patu cambuvatyakhilam tanum || 11|| prantare dhanada patu nijabijaprakashini | lakshmibijatmika
    patu nijabijaprakashini || 12|| lakshmibijatmika patu khadgahasta shmashanake | shunyagare | naditire
    mahayaksheshakanyaka || 13|| patu mam varadakhya me sarvangam patu mohini | mahasankatamadhye tu sangrame
    ripusancaye || 14|| krodharupa sada patu mahadevanishevika | sarvatra sarvada patu bhavani kuladayika
    || 15|| om ityetakavacam devi mahamantraughavigraham | asyapi smaranadeva rajatvam labhate'cirat ||
    16|| pancavarshasahasrani sthiro bhavati bhutale | vedajnani sarvashastravetta bhavati nishcitam ||
    17|| aranye siddhimapnoti mahakavacapathatah | yakshini kulavidya ca samayati susiddhida || 18|| anima
    laghima praptih sukhasiddhiphalam labhet | pathitva dharayitva ca nirjane'ranyamastake | sthitva japellakshamantramishtasiddhim
    labhennishi || 19|| bharya bhavati sa devi mahakavacapathatah | yoginam durlabham devi kimanyat sadhanadikam
    | grahanadeva siddhih syannatra karya vicarana || 20|| iti brihadbhutasandhanadamare mahatantre yogininayikakavacam
    samaptam |
  devanagari: डामरेषु प्रकाशितम् । पठनाद्धारणान्मर्त्यो यक्षिणी वशमानयेत् ॥ ३॥ कवचस्य ऋषिर्गर्गो गायत्रीच्छन्द
    ईरितम् । देवता यक्षिणी देवी सर्वसिद्धिप्रदायिनी ॥ ४॥ साक्षात्सिद्धिसमृद्ध्यर्थे विनियोगः प्रकीर्तितः
    । ॐ शिरो मे यक्षिणी पातु ललाटं यक्षकन्यका ॥ ५॥ मुखं श्रीधनदा पातु कर्णौ मे कुलनायिका । चक्षुषी वरदा
    पातु नासिका भक्तवत्सला ॥ ६॥ केशाग्रं पिङ्गला पातु धनदा श्रीमहेश्वरी । स्कन्धौ कुलालया पातु गलं मे
    कमलानना ॥ ७॥ किरातिनी सदा पातु भुजयुग्मं जटेश्वरी । विकृतास्या सदा पातु महावक्रप्रिया मम ॥ ८॥ अस्त्रं
    हस्ता पातु नित्यं पृष्ठमुदरदेशकम् । मेरुण्डा माकरी देवी हृदयं देवसम्मता ॥ ९॥ अलङ्कारान्विता पातु मे
    नितम्बस्थलं दया । धार्मिका गुह्यदेशं मे पादयुग्मं सुराङ्गना ॥ १०॥ शून्यागारे सदा पातु मन्त्रमातास्वरूपिणी
    । निष्कलङ्का सदा पातु चाम्बुवत्यखिलां तनुम् ॥ ११॥ प्रान्तरे धनदा पातु निजबीजप्रकाशिनी । लक्ष्मीबीजात्मिका
    पातु निजबीजप्रकाशिनी ॥ १२॥ लक्ष्मीबीजात्मिका पातु खड्गहस्ता श्मशानके । शून्यागारे । नदीतीरे महायक्षेशकन्यका
    ॥ १३॥ पातु मां वरदाख्या मे सर्वाङ्गं पातु मोहिनी । महासङ्कटमध्ये तु सङ्ग्रामे रिपुसञ्चये ॥ १४॥ क्रोधरूपा
    सदा पातु महादेवनिषेविका । सर्वत्र सर्वदा पातु भवानी कुलदायिका ॥ १५॥ ॐ इत्येतकवचं देवि महामन्त्रौघविग्रहम्
    । अस्यापि स्मरणादेव राजत्वं लभतेऽचिरात् ॥ १६॥ पञ्चवर्षसहस्राणि स्थिरो भवति भूतले । वेदज्ञानी सर्वशास्त्रवेत्ता
    भवति निश्चितम् ॥ १७॥ अरण्ये सिद्धिमाप्नोति महाकवचपाठतः । यक्षिणी कुलविद्या च समायाति सुसिद्धिदा ॥
    १८॥ अणिमा लघिमा प्राप्तिः सुखसिद्धिफलं लभेत् । पठित्वा धारयित्वा च निर्जनेऽरण्यमस्तके । स्थित्वा जपेल्लक्षमन्त्रमिष्टसिद्धिं
    लभेन्निशि ॥ १९॥ भार्या भवति सा देवी महाकवचपाठतः । योगिनां दुर्लभं देवि किमन्यत् साधनादिकम् । ग्रहणादेव
    सिद्धिः स्यान्नात्र कार्या विचारणा ॥ २०॥ इति बृहद्भूतसन्धानडामरे महातन्त्रे योगिनीनायिकाकवचं समाप्तम्
    ।
