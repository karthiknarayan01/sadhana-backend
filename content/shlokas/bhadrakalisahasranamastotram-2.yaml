    अश्वसमद्युति ॥ १२१॥ ॐ ऐं सौः अश्वगा स्वाहा ॐ श्रीं क्लीं अश्वगायुधा । ॐ ऐं क्लीं कुलवागेशी ॐ श्रीं
    क्लीं कुलकौलिनी ॥ १२२॥ ॐ श्रीं ऐं सौः कुलोद्भासा ॐ क्रीं क्रीडाशया तथा । ॐ श्रीं क्लीं निरहङ्कारा
    ॐ सौः सिद्धा ह्सौः श्रुतिः ॥ १२३॥ ॐ श्रीं श्रुतिधरा ऐं क्लीं ज्येष्ठा ऐं सौः अजा तथा । ॐ श्रीं ज्योतिः
    क्ष्मीं क्षामा ॐ क्ष्मीं क्षोडा ह्सौः क्षुधा ॥ १२४॥ ॐ क्लीं सः क्रोडिनी स्वाहा ॐ क्रों कम्बलघातिनी
    । ॐ क्रीं कम्बलवस्त्रा च ॐ क्रीं कोटिन्दुसन्निभा ॥ १२५॥ ॐ श्रीं क्लीं ऐं च कल्याणी ॐ श्रीं क्लीं गोमुखी
    तथा । ॐ जुं सः स्कन्दजननी ॐ श्रीं भैं भैरवार्चिता ॥ १२६॥ ॐ श्रीं भूधरपुत्री च ॐ ऐं सः ब्रह्मचारिणी
    । ॐ क्लीं सः ब्रह्मविद्या च ॐ ऐं क्लीं ब्रह्मरूपिणी ॥ १२७॥ ऐं क्लीं सौः त्रिपुरा स्वाहा ॐ श्रीं त्रिपुरभैरवी
    । ॐ श्रीं त्र्यक्षी ह्सौः स्त्रीं स्त्रीं ॐ श्रीं त्रिभुवनार्चिता ॥ १२८॥ ॐ क्लीं त्रेता ह्सौः अम्बा
