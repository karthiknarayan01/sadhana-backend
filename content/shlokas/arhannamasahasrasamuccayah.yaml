    pavanam nrinam mahapatakanashanam | sarvesham praninamashu sarvabhishtaphalapradam || 121|| jagajjadyaprashamanam
    sarvavidyapravarttakam | rajyadam rajyabhrashtanam roginam sarvarogahrit || 122|| vandhyanam sutadam
    cashu kshinanam jivitapradam | bhuta
  devanagari: ृण्वन् वाचा समुच्चरन् । जीवः पीवरपुण्यश्रीर्लभते फलमुत्तमम् ॥ १॥ अतएव प्रतिप्रातः समुत्थाय
    मनीषिभिः । भक्त्याऽष्टाग्रसहस्रार्हन्नामोच्चारो विधीयते ॥ २॥ ॐ श्रीमानर्हन् जिनः स्वामी स्वयम्भूः
    शम्भुरात्मभूः । स्वयम्प्रभुः प्रभुर्भोक्ता विश्वभूरपुनर्भवः ॥ ३॥ विश्वात्मा विश्वलोकेशो विश्वतश्वक्षुरक्षरः
    । विश्वविद् विश्वविद्येशो विश्वयोनिरनीश्वरः ॥ ४॥ विश्वदृश्वा विभुर्धाता विश्वेशो विश्वलोचनः । विश्वव्यापी
    विधुर्वेधाः शाश्वतो विश्वतोमुखः ॥ ५॥ विश्वपो विश्वतः पादो विश्वशीर्षः शुचिश्रवाः । विश्वदृग् विश्वभूतेशो
    विश्वज्योतिरनश्वरः ॥ ६॥ विश्वसृट् विश्वसूर्विश्वेट् विश्वभुक् विश्वनायकः । विश्वाशी विश्वभूतात्मा
    विश्वजिद् विश्वपालकः ॥ ७॥ विश्वकर्मा जगद्विश्वों विश्वमूर्त्तिर्जिनेश्वरः । भूतभाविभवद्भर्त्ता विश्ववैद्यो
    यतीश्वरः ॥ ८॥ सर्वादिः सर्वदृक् सार्वः सर्वज्ञः सर्वदर्शनः । सर्वात्मा सर्वलोकेशः सर्ववित् सर्वलोकजित्
    ॥ ९॥ सर्वगः सुश्रुतः सुश्रूः सुवाक् सूरिबहुश्रुतः । सहस्रशीर्षः क्षेत्रज्ञः सहस्राक्षः सहस्रपात् ॥
    १०॥ युगादिपुरुषो ब्रह्मा पञ्चब्रह्ममयः शिवः । ब्रह्मविद् ब्रह्मतत्त्वज्ञो ब्रह्मयोनिरयोनिजः ॥ ११॥
    ब्रह्मनिष्ठः परब्रह्म ब्रह्मात्मा ब्रह्मसम्भवः । ब्रह्म ब्रह्मपतिर्ब्रह्मचारी ब्रह्मपदेश्वरः ॥ १२॥
    विष्णुर्जिष्णुर्जयी जेता जिनेन्द्रो जिनपुङ्गवः । परः परतरः सूक्ष्मः परमेष्ठी सनातनः ॥ १३॥ ॥ १००॥ जिननाथो
    जगन्नाथो जगत्स्वामी जगत्प्रभुः । जगत्पूज्यो जगद्वन्द्यो जगदीशो जगत्पतिः ॥ १४॥ जगन्नेता जगज्जेता जगन्मान्यो
    जगद्विभुः । जगज्ज्येष्ठो जगच्छ्रेष्ठो जगद्ध्येयो जगद्धितः ॥ १५॥ जगदर्च्यो जगद्बन्धुर्जगच्छास्ता जगत्पिता
    । जगन्नेत्रो जगन्मैत्रो जगडीपो जगद्गुरुः ॥ १६॥ स्वयञ्ज्योतिरजोऽजन्मा परन्तेजः परम्महः । परमात्मा शमी
    शान्तः परञ्ज्योतिस्तमोऽपहः ॥ १७॥ प्रशान्तारिरनन्तात्मा योगी योगीश्वरो गुरुः । अनन्तजिदनन्तात्मा भव्यबन्धुरबन्धनः
    ॥ १८॥ शुद्धबुद्धिः प्रबुद्धात्मा सिद्धार्थः सिद्धशासनः । सिद्धः सिद्धान्तविद् ध्येयः सिद्धः साध्यः
    सुधीः सुगीः ॥ १९॥ सहिष्णुरच्युतोऽनन्तः प्रभविष्णुर्भवोद्भवः । स्वयम्भूष्णुरसम्भूष्णुः प्रभूष्णुरभयोऽव्ययः
    ॥ २०॥ दिव्यभाषापतिर्दिव्यः पूतवाक् पूतशासनः । पूतात्मा परमज्योतिर्धर्माध्यक्ष्यो दमीश्वरः ॥ २१॥ निर्मोहो
    निर्मदो निःस्वो निर्दम्भो निरुपद्रवः । निराधारो निराहारो निर्लोभो निश्चलोऽचलः ॥ २२॥ निष्कामी निर्ममो
    निष्वक् निष्कलङ्को निरञ्जनः । निर्गुणो नीरसो निर्भीर्निर्व्यापारो निरामयः ॥ २३॥ निर्निमेषो निराबाधो
    निर्द्वन्द्वो निष्क्रियोऽनघः । निःशङ्कश्च निरातङ्को निष्कलो निर्मलोऽमलः ॥ २४॥ ॥ २००॥ तीर्थकृत् तीर्थसृट्
    तीर्थङ्करस्तीर्थङ्करः सुदृक् । तोर्थकर्त्ता तीर्थभर्त्ता तीर्थेशस्तीर्थनायकः ॥ २५॥ सुतीर्थोऽधिपतितीर्थसेव्यस्तीर्थिकनायकः
    । धर्मतीर्थकरस्तीर्थप्रणेता तीर्थकारकः ॥ २६॥ तीर्थाधीशो महातोर्थस्तीर्थस्तीर्थविधायकः । सत्यतीर्थङ्करस्तीर्थसेव्यस्तीर्थिकतायकः
    ॥ २७॥ तीर्थनाथस्तीर्थराजस्तीर्थेट् तीर्थप्रकाशकः । तीर्थवन्द्यस्तीर्थमुख्यस्तीर्थाराध्यः सुतीर्थिकः
    ॥ २८॥ स्थविष्ठः स्थविरो ज्येष्ठः प्रेष्ठः प्रष्ठो वरिष्ठधीः । स्थेष्ठो गरिष्ठो वंहिष्ठो श्रेष्ठोऽणिष्ठो
    गरिष्ठधीः ॥ २९॥ विभवो विभयो वीरो विशोको विरजो जरन् । विरागो विमदोऽव्यक्तो विविक्तो वीतमत्सरः ॥ ३०॥
    वीतरागो गतद्वषो वीतमोहो विमन्मथः । वियोगो योगविद् विद्वान् विधाता विनयी नयी ॥ ३१॥ क्षान्तिमान् पृथिवीमूर्त्तिः
    शान्तिभाक् सलिलात्मकः । वायुमूर्त्तिरसङ्गात्मा वह्निमूर्तिरधर्मधक् ॥ ३२॥ सुयज्वा यजमानात्मा सुत्रामस्तोमपूजितः
    । ऋत्विग् यज्ञपतिर्याज्यो यज्ञाङ्गमस्तं हविः ॥ ३३॥ सोममूर्त्तिः सौम्यात्मा सूर्यमूर्तिर्महाप्रभः ।
    व्योममूर्त्तिरमूर्त्तात्मा नीरजा वीरजाः शुचिः ॥ ३४॥ मन्त्रविन्मन्त्रकृन्मन्त्री मन्त्रमूर्त्तिरनन्तरः
    । स्वतन्त्रः सूत्रकृत् स्वत्रः कृतान्तश्च कृतान्तकृत् ॥ ३५॥ ॥ ३००॥ कृती कृतार्थः संस्कृत्यः कृतकृत्यः
    कृतकृतुः । नित्यो मृत्युञ्जयोऽमृत्युरमृतात्माऽमृतोद्भवः ॥ ३६॥ हिरण्यगर्भः श्रीगर्भः प्रभूतविभवोऽभवः
    । स्वयम्प्रभः प्रभूतात्मा भवो भावो भवान्तकः ॥ ३७॥ महाशोकध्वजोऽशोकः कः स्रष्टा पद्मविष्टरः । पद्मेशः
    पद्मसम्भूतिः पद्मनाभिरनुत्तरः ॥ ३८॥ पद्मयोनिर्जगद्योनिरित्यः स्तुत्यः स्तुतीश्वरः । स्तवनार्हो हृषीकेशोऽजितो
    जेयः कृतक्रियः ॥ ३९॥ विशालो विपुक्षोद्योतिरतुलोऽचिन्त्यवैभवः । सुसंवृत्तः सुगुप्तात्मा शुभंयुः शुभकर्मकृत्
    ॥ ४०॥ एकविद्यो महावैद्यो मुनिः परिवृढो दृढः । पतिर्विद्यानिधिः साक्षी विनेता वितान्तकः ॥ ४१॥ पिता
    पितामहः पाता पवित्रः पावनो गतिः । त्राता भिषग्वरो वर्यो वरदः पारदः पुमान् ॥ ४२॥ कविः पुराणपुरुषो वर्षीयान्
    ऋषभः पुरः । प्रतिष्ठाप्रसवो हेतुर्भुवनैकपितामहः ॥ ४३॥ श्रीवत्सलक्षणेश्लक्षणो लक्षण्यः शुभलक्षणः ।
    निरक्षः पुण्डरीकाक्षः पुष्कलः पुष्कलेक्षणः ॥ ४४॥ सिद्धिदः सिद्धसङ्कल्पः सिद्धात्मा सिद्धशासनः । बुद्धबोध्यो
    महाबुद्धिर्वर्धमानो महर्द्धिकः ॥ ४५॥ वेदाङ्गो वेदविद् वेद्यो जातरूपो विदांवरः । वेदवेद्यः स्वसंवेद्यो
    विवेदो वदतांवरः ॥ ४६॥ ॥ ४००॥ सुधर्मा धर्मधीर्धर्मो धर्मात्मा धर्मदेशकः । धर्मचक्री दयाधर्मः शुद्धधर्मो
    वृषध्वजः ॥ ४७॥ वृषकेतुर्वृषाधीशो वृषाङ्कश्च वृषोद्भवः । हिरण्यनाभिर्भूतात्मा भूतभृद् भूतभावनः ॥ ४८॥
    प्रभवो विभवो भास्वान् मुक्तः शक्तोऽक्षयोऽक्षतः । कूटस्थः स्थाणुरक्षोभ्यः शास्ता नेताऽचल स्थितिः ॥
    ४९॥ अग्रणीर्ग्रामणीर्ग्रण्यो गण्यगण्यो गणाग्रणीः । गणाधिपो गणाधीशो गणज्येष्ठो गणार्चितः ॥ ५०॥ गुणाकरो
    गुणाम्भोधिर्गुणज्ञो गुणवान् गुणी । गुणादरो गुणोच्छेदी सुगुणोऽगुणवर्जितः ॥ ५१॥ शरण्यः पुण्यवाक् पूतो
    वरेण्यः पुण्यगोर्गुणः । अगण्यपुण्यधोः पुण्यः पुण्यकृत् पुण्यशासनः ॥ ५२॥ अतीन्द्रोऽतीन्द्रियोऽधीन्द्रो
    महेन्द्रोऽतीन्द्रियार्थदृक् । अतीन्द्रियो महेन्द्रार्च्यो महेन्द्रमहितो महान् ॥ ५३॥ उद्भवः कारणं कर्त्ता
    पारगो भवतारकः । अग्राह्यो गहनं गुह्यः परद्धिः परमेश्वरः ॥ ५४॥ अनन्तर्द्धिरमेयर्द्धिरचिन्त्यर्द्धिः
    समग्रधीः । प्राग्र्यः प्राम्यहरोऽत्यग्रः प्रत्यग्रोऽग्रोऽग्रिमोऽग्रजः ॥ ५५॥ प्राणकः प्रणवः प्राणः
    प्राणदः प्राणितेश्वरः । प्रधानमात्मा प्रकृतिः परमः परमोदयः ॥ ५६॥ ॥ ५००॥ महाजिनो महाबुद्धो महाब्रह्मा
    महाशिवः । महाविष्णुर्महाजिदणुर्महानाथो महेश्वरः ॥ ५७॥ महादेवो महास्वामी महाराजो महाप्रभुः । महाचन्द्रो
    महादित्यो महाशूरो महागुरुः ॥ ५८॥ महातपा महातेजा महोदर्को महामयः । महायशो महाधामा महासत्त्वो महाबलः
    ॥ ५९॥ महाधैर्यो महावीर्यो महाकान्तिर्महाद्युतिः । महाशक्तिर्महाज्योतिर्महाभूतिर्महाधृतिः ॥ ६०॥ महामतिर्महानीतिर्महाक्षान्तिर्महाकृतिः
    । महाकीत्तिर्महास्फूर्तिर्महाप्रज्ञो महोदयः ॥ ६७॥ महाभागो महाभोगो महारूपो महावपुः । महादानो महाज्ञानो
    महाशास्ता महामहः ॥ ६८॥ महामुनिर्महामौनी महाध्यानो महादमः । महाक्षमो महाशीलो महायोगो महालयः ॥ ६९॥ महाव्रतो
    महायज्ञो महाश्रेष्ठो महाकविः । महामन्त्रो महातन्त्रो महोपायो महानयः ॥ ७०॥ महाकारुणिको मन्ता महानादो
    महायतिः । महामोदो महाघोषो महेज्यो महसाम्पतिः ॥ ७१॥ महावीरो महाधीरो महाधुर्यो महेष्ठवाक् । महात्मा
    महसां धाम महर्षिर्महितोदयः ॥ ७२॥ महामुक्तिर्महागुप्तिर्महासत्यो महार्जवः । महाबुद्धिर्महासिद्धिर्महाशौचो
    महावशी ॥ ७३॥ महाधर्मा महाशर्मा महात्मज्ञो महाशयः । महामोक्षो महासौख्यो महानन्दो महोदयः ॥ ७४॥ ॥ ६००॥
    महाभवाब्धिसन्तारी महामोहारिसूदनः । महायोगीश्वराराध्यो महामुक्तिपदेश्वरः ॥ ७५॥ आनन्दो नन्दनो नन्दो
    वन्द्यो नन्द्योऽभिनन्दनः । कामहा कामदः काम्यः कामधेनुररिञ्जयः ॥ ७६॥ मनःक्लेशापहः साधुरुत्तमोऽघहरो
    हरः । असङ्ख्येयः प्रमेयात्मा शमात्मा प्रशमाकरः ॥ ७७॥ सर्वयोगीश्वरश्चिन्त्यः श्रुतात्मा विष्टरश्रवाः
    । दान्तात्मा दमतीर्थेशो योगात्मा योगसाधकः ॥ ७८॥ प्रमाणपरिधिर्दक्षो दक्षिणोऽध्वर्युरध्वरः । प्रक्षीणबन्धः
    कर्मारिः क्षेमकृत्क्षेमशासनः ॥ ७९॥ क्षेमी क्षेमङ्करोऽक्षय्यः क्षेमधर्मा क्षमापतिः । अग्राह्यो ज्ञानिविज्ञेयो
    ज्ञानिगम्यो जिनोत्तमः ॥ ८०॥ जिनेन्दुर्जनितानन्दो मुनीन्दुर्दुन्दुभिस्वनः । मुनीन्द्रवन्द्यो योगीन्द्रो
    यतीन्द्रो यतिनायकः ॥ ८१॥ असंस्कृतः सुसंस्कारः प्राकृतो वैकृतान्तवित् । अन्तकृत् कान्तगुः कान्तश्चिन्तामणिरभीष्टदः
    ॥ ८२॥ अजितो जितकामारिरमितोऽमितशासनः । जितक्रोधो जितामित्रो जितक्लेशो जितान्तकः ॥ ८३॥ सत्यात्मा सत्यविज्ञानः
    सत्यवाक् सत्यशासनः । सत्याशीः सत्यसन्धानः सत्यः सत्यपरायणः ॥ ८४॥ सदायोगः सदाभोगः सदातृप्तः सदाशिवः
    । सदागतिः सदासौख्यः सदाविद्यः सदोदयः ॥ ८५॥ सुघोषः सुमुखः सौम्यः सुखदः सुहितः सुहृत् । सुगुप्तो गुप्तिभृद्
    गोप्ता गुप्ताक्षो गुप्तमानसः ॥ ८६॥ ॥ ७००॥ बृहद् बृहस्पतिर्वाग्मी वाचस्पतिरुदारधीः । मनीषी धिषणो धीमान्
    शेमुषीशो गिराम्पतिः ॥ ८७॥ नैकरूपो नयोत्तुङ्गो नैकात्मा नैकधर्मकृत् । अविज्ऽमेयोऽप्रतर्क्यात्मा कृतज्ञः
    कृतलक्षणः ॥ ८८॥ ज्ञानगर्भो दयागर्भो रत्नगर्भः प्रभास्वरः । पद्मगर्भो जगद्गर्भो हेमगर्भः सुदर्शनः ॥
    ८९॥ लक्ष्मीशः सदयोऽध्यक्षो दृढयोनिर्नगीशिता । मनोहरो मनोज्ञोऽर्हो धीरो गम्भीरशासनः ॥ ९०॥ धर्मयूपो
    दयायागो धर्मनेमिर्मुनीश्वरः । धर्मचक्रायुधी देवः कर्महा धर्मघोषणः ॥ ९१॥ स्थेयान् स्थवीयान् नेदीयान्
    दवीयान् दूरदर्शनः । सुस्थितः स्वास्थ्यभाक् सुस्थो नीरजस्को गतस्पृहः ॥ ९२॥ वश्येन्द्रियो विमुक्तात्मा
    निःसपत्नो जितेन्द्रियः । श्रीनिवासश्चतुर्वक्त्रश्चतुरास्यश्चतुर्मुखः ॥ ९३॥ अध्यात्मगम्योऽगम्यात्मा
    योगात्मा योगिवन्दितः । सर्वत्रगः सदाभावी त्रिकालविषयार्थदृक् ॥ ९४॥ शङ्करः सुखदो दान्तो दमी क्षान्तिपरायणः
    । स्वानन्दः परमानन्दः सूक्ष्मवर्चाः परापरः ॥ ९५॥ अमोघोऽमोघवाक् स्वाज्ञो दिव्यदृष्टिगोचरः । सुरूपः
    सुभगस्त्यागी मूर्तोऽमूर्तः समाहितः ॥ ९६॥ ॥ ८००॥ एकोऽनेको निरालम्बोऽनीदृग् नाथो निरन्तरः । प्रार्थ्योऽभ्यर्थ्यः
    समभ्यर्च्यस्त्रिजगन्मङ्गलोदयः ॥ ९७॥ ईशोऽधीशोऽधिपोऽधीन्द्रो ध्येयोऽमेयो दयामयः । शिवः शूरः शुभः सारः
    शिष्टः स्पष्टः स्फुटोऽस्फुटः ॥ ९८॥ इष्टः पुष्टः क्षमोऽक्षामोऽकायोऽमायोऽस्मयोऽमयः । दृश्वोऽदृश्योऽणुरस्थूलो
    जीर्णो नव्यो गुरुर्लघुः ॥ ९९॥ स्वभूः स्वात्मा स्वयम्बुद्धः स्वेशः स्वैरीश्वरः स्वरः । आद्योऽलचयोऽपरोऽरूपोऽस्पर्शोऽशाष्टोऽरिहाऽरुहः
    ॥ १००॥ दीप्तोऽलेश्योऽरसोऽगन्धोऽच्छेद्योऽभेद्योऽजरोऽमरः । प्राज्ञो धन्यो यतिः पूज्यो मह्योऽर्च्यः प्रशमी
    यमी ॥ १०१॥ श्रीशः श्रीन्द्रः शुभः सुश्रीरुत्तमश्रीः श्रियः पतिः । श्रीपतिः श्रीपरः श्रीपः सच्छ्रीः
    श्रीयुक् श्रियाश्रितः ॥ १०२॥ ज्ञानी तपस्वी तेजस्वी यशस्वी बलवान् बली । दानी ध्यानी मुनिमौन्नी लयी
    लक्ष्यः क्षयी क्षमी ॥ १०३॥ लक्ष्मीवान् भगवान् श्रेयान् सुगतः सुतनुर्बुधः । बुद्धो वृद्धः स्वयंसिद्धः
    प्रोच्चः प्रांशुः प्रभामयः ॥ १०४॥ ॥ ९००॥ आदिदेवो देवदेवः पुरुदेवोऽधिदेवता । युगादीशो युगाधीशो युगमुख्यो
    युगोत्तमः ॥ १०५॥ दीप्तः प्रदीप्तः सूर्याभोऽरिघ्नोऽविघ्नोऽघनो घनः । शत्रुघ्नः प्रतिघस्तुङ्गोऽसङ्गः
    स्वङ्गोऽग्रगः सुगः ॥ १०६॥ स्याद्वादी दिव्यगीर्दिव्यध्वनिरुद्दामगीः प्रगीः । पुण्यवागर्त्र्यवागर्धमागधीयोक्तिरिद्धगीः
    ॥ १०७॥ पुराणपुरुषोऽपूर्वोऽपूर्वश्रीः पूर्वदेशकः । जिनदेवो जिनाधीशो जिननाथो जिनाग्रणीः ॥ १०८॥ शान्तिनिष्ठो
    मुनिज्येष्ठः शिवतातिः शिवप्रदः । शान्तिकृत् शान्तिदः शान्तिः कान्तिमान् कामितप्रदः ॥ १०९॥ श्रियान्निधिरधिष्ठानमप्रतिष्ठः
    प्रतिष्टितः । सुस्थितः स्थावरः स्थाणुः पृथीयान् प्रथितः पृथुः ॥ ११०॥ पुण्यराशिः श्रियोराशिस्ते जोराशिरसंशयी
    । ज्ञानोदधिरनन्तौजा ज्योतिमूर्त्तिरनन्तधीः ॥ १११॥ विज्ञानोऽप्रतिमो भिक्षुर्मुक्षुर्मुनिपुङ्गवः । अनिद्रालुरतन्द्रालुर्जागरूकः
    प्रमामयः ॥ ११२॥ कर्मण्यः कर्मठोऽकुण्ठो रुद्रो भद्रोऽभयङ्करः । लोकोत्तरो लोकपतिर्लोकेशो लोकवत्सलः ॥
    ११३॥ त्रिलोकीशस्त्रिकालज्ञस्त्रिनेत्रस्त्रिपुरान्तकः । त्र्यम्बकः केवलालोकः केवली केवलेक्षणः ॥ ११४॥
    समन्तभद्रः शान्तादिर्धर्माचार्यो दयानिधिः । सूक्ष्मदर्शी सुमार्गज्ञः कृपालुर्मार्गर्शकः ॥ ११५॥ ॥ १००८॥
    प्रातिहार्योज्ज्वलस्फीतातिशयो विमलाशयः । सिद्वानन्तचतुष्कश्रीर्जीयाच्छ्रीजिनपुङ्गवः ॥ ११६॥ एतदष्टोत्तरं
    नामसहस्रं श्रीमदर्हतः । भव्याः पठन्तु सानन्दं महानन्दैककारणम् ॥ ११७॥ इत्येतज्जिनदेवस्य जिननामसहस्रकम्
    । सर्वापराधशमनं परं भक्तिविवर्धनम् ॥ ११८॥ अक्षयं त्रिषु लोकेषु सर्वस्वर्गैकसाधनम् । स्वर्गलोकैकसोपानं
    सर्वदुःखैकनाशनम् ॥ ११९॥ समस्तदुःखहं सद्यः परं निर्वाणदायकम् । कामक्रोधादिनिःशेषमनोमलविशोधनम् ॥ १२०॥
    शान्तिदं पावनं नृणां महापातकनाशनम् । सर्वेषां प्राणिनामाशु सर्वाभीष्टफलप्रदम् ॥ १२१॥ जगज्जाड्यप्रशमनं
    सर्वविद्याप्रवर्त्तकम् । राज्यदं राज्यभ्रष्टानां रोगिणां सर्वरोगहृत् ॥ १२२॥ वन्ध्यानां सुतदं चाशु
    क्षीणानां जीवितप्रदम् । भूत
