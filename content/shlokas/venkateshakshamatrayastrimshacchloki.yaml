id: venkateshakshamatrayastrimshacchloki
category: stotram
name:
  english: venkateshakshamatrayastrimshacchloki
  devanagari: वेन्कटेशक्षमात्रयस्त्रिंशच्छ्लोकी
content:
  english: rajasvatho shudrajatishvatho sankareshu | nikrishtah kva drishtah kva va te kshamayah prakasho
    ramesha dhruvam syatprahinah || 6|| rama sa kva yata kshamodvodhini te mamatulyamata tavorasthalastha
    | mamabhagyajatattavabhogyabhuta ramapi prabho kim pramodavaha te || 7|| kshama yatu gupta ramaya
    vidheyam kva vatsalyabhuma yato doshivrindam | mahanandameti hyaho matpravarje pravrittih kimasya
    prabho venkatesha || 8|| daya sa kva yata yaya duhkhibandho paresham vishado vrishadrisha nashyah
    | mamamandaduhkhapranashe prakasham na sa yatumarha kimasyavratam kim || 9|| parityajya bhogam paravyomanisvam
    mahanandadhamanyapihahi shaile | yadarthe samayastadarthe vicintya prabho venkatesha drutam mam suraksha
    || 10|| pura kasya cidro mahapapadahat abhutte bhida shrigire venkateti | mama tulyapapa pradahattavadya
    abhidha syannavina rameshakhiledya || 11|| mamamanda papapravritternivrittim yadiksheta bho bho bhavan
    rakshitum mam | tadamandakallolajalakulebdhau bhavan snatumicchedviramam nirikshya || 12|| kva tancakramaste
    nikrittaricakram bhavadbhaktacakre shubham yena cakre | hare cakrametattavaitajjanasya prabhumtaghacakram
    na kim chettumishte || 13|| niyujya svacakram mamaghaughacakram na cecchetsyasi tvam nada kasya hanih
    tavaiveti satyam yadetajjagatya vasham ko'pi yayadiniksha kriteyam || 14|| nikrishtottamam ma vikrudvam
    vivayanu kampam vidadhya yadi tvam ramesha | tadaitatsamikshyeha vashya bhaveyu stavanekaloka nikrishtashca
    shishta || 15|| mamottungacetasturamgodhiroho citastedhirudho manojadhiraja | nirasyashu tam bhoh
    sabharoha tam kim vrithopekshase tvam tvam tvadiyam turangam || 16|| madiye tvadiyalayenadisiddhe
    hvadisha tvadanye parivarayuktah | kadacitsamagatya tishthanti tanno nirasyeryadi syattadiyam griham
    tat || 17|| mahadushtakama prabhrityantyavarno shitesvantasadmanyashuddhe madiye | nirasyashu tam
    te padambhojayugma praveshe na shuddham griham tadvidhehi || 18|| bhavaddivyadeha prabhadipajala prabhabhirvidhunvan
    prakrishtam tamisram | tvadiyaih saha tvam kutumbai ramesha vasasmin grihe me sukhi svantanamni ||
    19|| avidyarkavriksham hridavalarudha mamanadimulam vibhindan vimulam | samavapya bijam tvadiyamghribhakti
    prakrishtamrabijam ramesheha raksha || 20|| tvadajnavashenadadhano'pi kincit svatantro'hamevam karomi
    tyahamyuh | sudha bhavamenam vritha bhavaya tvam tvadadhinyabhavam sada bhavayesha || 21|| bahirbhavayami
    svavacakhilani tvadiyanyamuniti bho venkatesha | hridi tvadhyavasye mamaivopabhogya anyamuniti nityam
    jahidam ramesha || 22|| parasvaspriha me sada vobhaviti prathiyasyamushyashubhenaimi modam | parasyasu
    nashe tadiyam madiyam bhavedivyahome durasham jahisha || 23|| paralabhalabdhapranashavavekshya prapadye
    mahalabhayugmapramodam | dhanaptau parasya svikiyasya nasham bhajamityasuyam jahi shrinivasa || 24||
    parasvapahare mama svapaharah paranarthadrishtau mamanarthalabhah | paranandalabhe mamanandalabho
    mahanityamum me manisham vidhatsva || 25|| mahakantakarim mahasankatam bhostvamghripraphullaravindarpanena
    | imam deshamadha mudam samdadhanam bhavadbhaktasamgham mahantam ramesha || 26|| akalyanametam sakalyanamadhah
    kimatradimulam na jane ramesha | athavaimi hetum tavadhyajabhuyah kripaparisindho prarirahameva ||
    27|| sakrite padabjapracarena nalam viva yanyadeshe nivase nikamam | ihaivasa tvam mamatvam vaha tvam
    kimarthe tavarthe tvadanyah prapashye || 28|| athaiko'pi ko va tvadarthe tvadanyah samalakshitum va
    samarakshitum va | samartho'sti lakshmipate venkatadreh pate tatra kim vadhikam neha kim va || 29||
    yadrapyasti tatra tvadavasabhumna tadatrapi ca syattvadiyagamashcet | mamamanda papapravrittim nirikshya
    agamashcenna te syadatta kasya hanih || 30|| athalpasya hetorvihatum bahu syat tavedam na yuktam prabho
    venkatesha | athanalpa papapravrittirmadiya nivartya na kim te'khilaghaughanashin || 31|| mrigapatipadam
    shvarudhashvennibaddhasatajatima
  devanagari: राजस्वथो शूद्रजातिष्वथो सङ्करेषु । निकृष्टः क्व दृष्टः क्व वा ते क्षमायाः प्रकाशो रमेष ध्रुवं
    स्यात्प्रहीणः ॥ ६॥ रमा सा क्व याता क्षमोद्वोधिनी ते ममातुल्यमाता तवोरस्थलस्था । ममाभाग्यजातात्तवाभोग्यभूता
    रमापि प्रभो किं प्रमोदावहा ते ॥ ७॥ क्षमा यातु गुप्ता रमाया विधेयं क्व वात्सल्यभूमा यतो दोषिवृन्दम्
    । महानन्दमेति ह्यहो मत्प्रवर्जे प्रवृत्तिः किमस्य प्रभो वेङ्कटेश ॥ ८॥ दया सा क्व याता यया दुःखिबन्धो
    परेषां विषादो वृषाद्रीश नाश्यः । ममामन्ददुःखप्रणाशे प्रकाशं न सा यातुमर्हा किमस्याव्रतं किम् ॥ ९॥
    परित्यज्य भोगं परव्योमनिस्वं महानन्दधामन्यपीहाहि शैले । यदर्थे समायास्तदर्थे विचिन्त्य प्रभो वेङ्कटेश
    द्रुतं मां सुरक्ष ॥ १०॥ पुरा कस्य चिद्रो महापापदाहात् अभूत्ते भिदा श्रीगिरे वेङ्कटेति । ममा तुल्यपाप
    प्रदाहात्तवाद्य अभिधा स्यान्नवीना रमेशाखिलेड्या ॥ ११॥ ममामन्द पापप्रवृत्तेर्निवृत्तिं यदीक्षेत भो
    भो भवान् रक्षितुं माम् । तदामन्दकल्लोलजालाकुलेब्धौ भवान् स्नातुमिच्छेद्विरामं निरीक्ष्य ॥ १२॥ क्व
    तञ्चक्रमास्ते निकृत्तारिचक्रं भवद्भक्तचक्रे शुभं येन चक्रे । हरे चक्रमेतत्तवैतज्जनस्य प्रभूंताघचक्रं
    न किम् छेत्तुमीष्टे ॥ १३॥ नियुज्य स्वचक्रं ममाघौघचक्रं न चेच्छेत्स्यसि त्वं नदा कस्य हानिः तवैवेति
    सत्यं यदेतज्जगत्या वशं कोऽपि यायादिनीक्षा कृतेयम् ॥ १४॥ निकृष्टोत्तमं मा विक्रुद्वं विवायानु कम्पां
    विदध्या यदि त्वं रमेश । तदैतत्समीक्ष्येह वश्या भवेयु स्तवानेकलोका निकृष्टाश्च शिष्टा ॥ १५॥ ममोत्तुङ्गचेतस्तुरंगोधिरोहो
    चितस्तेधिरूढो मनोजाधिराजा । निरस्याशु तं भोः सभारोह तं किं वृथोपेक्षसे त्वं त्वं त्वदीयं तुरङ्गम्
    ॥ १६॥ मदीये त्वदीयालयेनादिसिद्धे ह्वदीश त्वदन्ये परीवारयुक्ताः । कदाचित्समागत्य तिष्ठन्ति तान्नो निरस्येर्यदि
    स्यात्तदीयं गृहं तत् ॥ १७॥ महादुष्टकाम प्रभृत्यन्त्यवर्णो षितेस्वान्तसद्मन्यशुद्धे मदीये । निरस्याशु
    तं ते पदाम्भोजयुग्म प्रवेशे न शुद्धं गृहं तद्विधेहि ॥ १८॥ भवद्दिव्यदेह प्रभादीपजाल प्रभाभिर्विधुन्वन्
    प्रकृष्टं तमिस्रम् । त्वदीयैः सह त्वं कुटुम्बै रमेश वसास्मिन् गृहे मे सुखी स्वान्तनाम्नि ॥ १९॥ अविद्यार्कवृक्षं
    हृदावालरूढ ममानादिमूलं विभिन्दन् विमूलम् । समावाप्य बीजं त्वदीयांघ्रिभक्ति प्रकृष्टाम्रबीजम् रमेशेह
    रक्ष ॥ २०॥ त्वदाज्ञावशेनादधानोऽपि किञ्चित् स्वतन्त्रोऽहमेवं करोमी त्यहंयुः । सुधा भावमेनं वृथा भावय
    त्वं त्वदाधीन्यभावं सदा भावयेश ॥ २१॥ बहिर्भावयामि स्ववाचाखिलानि त्वदीयान्यमूनीति भो वेङ्कटेश । हृदि
    त्वध्यवस्ये ममैवोपभोग्य अन्यमूनीति नित्यं जहीदं रमेश ॥ २२॥ परस्वस्पृहा मे सदा वोभवीति प्रथीयस्यमुष्याशुभेनैमि
    मोदम् । परस्यासु नाशे तदीयं मदीयं भवेदिव्यहोमे दुराशां जहीश ॥ २३॥ परालाभलब्धप्रणाशाववेक्ष्य प्रपद्ये
    महालाभयुग्मप्रमोदम् । धनाप्तौ परस्य स्वीकीयस्य नाशं भजामीत्यसूयां जहि श्रीनिवास ॥ २४॥ परस्वापहारे
    मम स्वापहारः परानर्थदृष्टौ ममानर्थलाभः । परानन्दलाभे ममानन्दलाभो महानित्यमूं मे मनीषां विधत्स्व ॥
    २५॥ महाकण्टकारिं महासङ्कटं भोस्त्वंघ्रिप्रफुल्लारविन्दार्पणेन । इमं देशमाधा मुदं संदधानं भवद्भक्तसंघं
    महान्तं रमेश ॥ २६॥ अकल्याणमेतं सकल्याणमाधाः किमत्रादिमूलं न जाने रमेश । अथावैमि हेतुं तवाध्याजभूयः
    कृपापारिसिन्धो प्ररीराहमेव ॥ २७॥ सकृते पदाब्जप्रचारेण नालं विवा यान्यदेशे निवासे निकामम् । इहैवास
    त्वं ममत्वं वह त्वं किमर्थे तवार्थे त्वदन्यः प्रपश्ये ॥ २८॥ अथैकोऽपि को वा त्वदर्थे त्वदन्यः समालक्षितुं
    वा समारक्षितुं वा । समर्थोऽस्ति लक्ष्मीपते वेङ्कटाद्रेः पते तत्र किम् वाधिकं नेह किं वा ॥ २९॥ यद्रप्यस्ति
    तत्र त्वदावासभूम्ना तदत्रापि च स्यत्त्वदीयागमश्चेत् । ममामन्द पापप्रवृत्तिं निरीक्ष्य अगमश्चेन्न ते
    स्यादत्ता कस्य हानिः ॥ ३०॥ अथाल्पस्य हेतोर्विहातुं बहु स्यात् तवेदं न युक्तं प्रभो वेङ्कटेश । अथानल्प
    पापप्रवृत्तिर्मदीया निवर्त्या न किं तेऽखिलाघौघनाशिन् ॥ ३१॥ मृगपतिपदं श्वारूढश्वेन्निबद्धसटाजटीम
