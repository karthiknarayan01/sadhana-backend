id: ajapajapastotram
category: stotram
name:
  english: ajapajapastotram
  devanagari: अजपाजपस्तोत्रम्
content:
  english: ajapajapastotram om tatsat || om brahmane namah || muladhare varijapatre catarasre vam sham
    sham sam varnavishalam suvishalam | raktam varne shrigananatham bhagavantam dattatreyam shrigurumurtim
    pranato'smi || 1|| svadhishthane shatdala padme tanulingam balam tam tadvarnamayabham suvishalam |
    pitam varnam vakpatirupam druhinam tam dattatreyam shrigurumurtim pranato'smi || 2|| nabhaupadmam
    patradashadhyam da pha varnam lakshmikantam garudarudham naraviram | nilam varnam nirgunarupam nigamantam
    dattatreyam shrigurumurtim pranato'smi || 3|| hritpadmante dvadashapatre ka tha varne shaivam sambam
    paramahamsyam ramayantam | sargatranadyanta karamtam shivarupam dattatreyam shrigurumurtim pranato'smi
    || 4|| kanthasthane cakravishuddhe kamalante candrakare shodashapatre svarayukte | mayadhisham jivavishesham
    sthitimantam dattatreyam shrigurumurtim pranato'smi || 5|| ajnacakre bhruyugamadhye dvidalante ham
    ksham bijam jnanasamudram paramantam | vidyudvarnamsyatmasvarupam nigamagrim dattatreyam shrigurumurtim
    pranato'smi || 6|| murdhnisthane patrasahasrairyuta padme piyushabdherantarangam tamamritaucam | hamsakhyam
    tam rupamatitam ca turiyam dattatreyam shrigurumurtim pranato'smi || 7|| brahmanandam brahmamukundadi
    surupam brahmajnanam jnanamayam tam tamarupam | brahmajnanam jnani munindrai rucitamngam dattatreyam
    shrigurumurtim pranato'smi || 8|| shantakaram sheshashayanam suravandyam lakshmikantam komalagatram
    kamalaksham | cintaratnam cidghanapurnam dvijarajam dattatreyam shrigurumurtim pranato'smi || 9||
    citonkaraih sanganinadaih ativedyaih kadikshantairhyaksharavarnaih paripurnam | vedantavedyaistacca
    jnanairanuvedyam dattatreyam shrigurumurtim pranato'smi || 10|| adhare linga nabhau hridaya sarasije
    | talumule lalate dvepatre shodashare | dvidasha
  devanagari: अजपाजपस्तोत्रम् ॐ तत्सत् ॥ ॐ ब्रह्मणे नमः ॥ मूलाधारे वारिजपत्रे चतरस्रे वं शं षं सं वर्णविशालं
    सुविशालम् । रक्तं वर्णे श्रीगणनाथं भगवन्तं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ १॥ स्वाधिष्ठाने
    षट्दल पद्मे तनुलिङ्गं बालां तं तद्वर्णमयाभं सुविशालम् । पीतं वर्णं वाक्पतिरूपं द्रुहिणं तं दत्तात्रेयं
    श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ २॥ नाभौपद्मं पत्रदशाढ्यं ड फ वर्णं लक्ष्मीकान्तं गरुडारूढं नरवीरम् ।
    नीलं वर्णं निर्गुणरूपं निगमान्तं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ ३॥ हृत्पद्मान्ते द्वादशपत्रे
    क ठ वर्णे शैवं साम्बं पारमहंस्यं रमयन्तम् । सर्गत्राणाद्यन्त करंतं शिवरूपं दत्तात्रेयं श्रीगुरुमूर्तिं
    प्रणतोऽस्मि ॥ ४॥ कण्ठस्थाने चक्रविशुद्धे कमलान्ते चन्द्राकारे षोडशपत्रे स्वरयुक्ते । मायाधीशं जीवविशेषं
    स्थितिमन्तं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ ५॥ आज्ञाचक्रे भ्रूयुगमध्ये द्विदलान्ते हं क्षं
    बीजं ज्ञानसमुद्रं परमन्तम् । विद्युद्वर्णंस्यात्मस्वरूपं निगमाग्रिं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि
    ॥ ६॥ मूर्ध्निस्थाने पत्रसहस्रैर्युत पद्मे पीयूषाब्धेरन्तरङ्गं तममृतौचम् । हंसाख्यं तं रूपमतीतं च तुरीयं
    दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ ७॥ ब्रह्मानन्दं ब्रह्ममुकुन्दादि सुरूपं ब्रह्मज्ञानं ज्ञानमयं
    तं तमरूपम् । ब्रह्मज्ञानं ज्ञानि मुनीन्द्रै रुचितांङ्गं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥
    ८॥ शान्ताकारं शेषशयानं सुरवन्द्यं लक्ष्मीकान्तं कोमलगात्रं कमलाक्षम् । चिन्तारत्नं चिद्घनपूर्णं द्विजराजं
    दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ ९॥ चितोङ्कारैः सङ्गनिनादैः अतिवेद्यैः कादिक्षान्तैर्ह्यक्षरवर्णैः
    परिपूर्णम् । वेदान्तावेद्यैस्तच्च ज्ञानैरनुवेद्यं दत्तात्रेयं श्रीगुरुमूर्तिं प्रणतोऽस्मि ॥ १०॥ आधारे
    लिङ्ग नाभौ हृदय सरसिजे । तालुमूले ललाटे द्वेपत्रे षोडशारे । द्विदश
