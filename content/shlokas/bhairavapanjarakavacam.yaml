id: bhairavapanjarakavacam
category: kavacha
name:
  english: bhairavapanjarakavacam
  devanagari: भैरवपन्जरकवचम्
content:
  english: purvam bhasmasuratrasad bhaya vihvalatam svayam | pathanadeva me prana rakshitah parameshvari
    || 2|| sarvadushtavinashaya sarvaroganivaranam | duhkhashantikaram devi hyalpamrityubhayapaham ||
    3|| rajnam vashyakaram caiva trailokya vijayapradam | sarvalokeshu pujyashca lakshmistasya grihe sthira
    || 4|| anushthanam kritam devi pujanam ca dine dine | vina panjarapathena tatsarvam nishphalam bhavet
    || 6|| asya shribatukabhairavapanjarakavacamantrasya kalagnirudrah rishih | anushtupchandah | om batukabhairavo
    devata | hram bijam om bhairavi vallabha shaktih | om dandapanaye namah kilakam | mama sakalakamanasiddhyardhe
    jape viniyogah || om hram pracyam damaruhasto raktavarno mahabalah | pratyakshamahamishana batukaya
    namo namah || om hrim dandadhari dakshine ca pashcime khadgadharine | om hrum ghatavadi mutiruttarasyam
    dishistatha | om hraim agnirupo hyagneyyam nairrityam ca digambarah | om hraum sarvabhutastho vayavye
    bhutanam hitakarakah || om hrashcavashtasiddhishca ishane sarvasiddhikarah parah | pratyakshamahamishana
    batukaya namo namah || om hram hrim hrum hraim hraum hrah svaha urdhvam khecarinam nyaset | rudrarupastu
    patale batukaya namo namah || om hrim batukaya murdhni lalate bhimarupinam | apaduddharanam netre
    mukhe ca batukam nyaset || 1|| kuru kuru sarvasiddhirdehe gehe vyavasthitah | batukaya hrim sarvadehe
    vishvasya sarvato dishi || 2|| apaduddharakah patu hyapadatalamastakam | hasakshamalavarayum patu
    purve dandahastastu dakshine || 3|| hasakshamalavarayum nairritye hasakshamalavarayum pashcime'vatu
    | sarvabhutastho vayavye hasakshamalavarayum ghatavadina uttare || 4|| hamsah so'ham tu ishane cashtasiddhikarah
    parah | shamkshetrapala urdhve tu patale shiva sannibhah || 5|| evam dashadisho rakshedbatukaya namo
    namah | iti te kathitam hrim shrim klim aim sada'vatu || 6|| om phrem hum phat ca sarvatra trailokye
    vijayi bhavet | lakshmim aim shrim lam prithivyam ca akaro ham mamavatu || 7|| sraum praum jraum u~
    yam vayavyam ram ram ram tejorupinam | om kam kham gam gham nam batukam cam cham jam jham nam kapalinam
    || 8|| tam tham dam dham nam kshetresham tam tham dam dham nam umapriyam | pam pham bam bham mam mamaraksha
    yam ram lam bhairavottamam || 9|| vam sham sham sam adinatham lam ksham vai kshetrapalakam |
  devanagari: पूर्वम् भस्मासुरत्रासाद् भय विह्वलतां स्वयम् । पठनादेव मे प्राणा रक्षितः परमेश्वरि ॥ २॥
    सर्वदुष्टविनाशाय सर्वरोगनिवारणम् । दुःखशान्तिकरं देवि ह्यल्पमृत्युभयापहम् ॥ ३॥ राज्ञां वश्यकरं चैव
    त्रैलोक्य विजयप्रदम् । सर्वलोकेषु पूज्यश्च लक्ष्मीस्तस्य गृहे स्थिरा ॥ ४॥ अनुष्ठानं कृतं देवि पूजनं
    च दिने दिने । विना पञ्जरपाठेन तत्सर्वं निष्फलं भवेत् ॥ ६॥ अस्य श्रीबटुकभैरवपञ्जरकवचमन्त्रस्य कालाग्निरुद्रः
    ऋषिः । अनुष्टुप्छन्दः । ॐ बटुकभैरवो देवता । ह्रां बीजं ॐ भैरवी वल्लभा शक्तिः । ॐ दण्डपाणये नमः कीलकम्
    । मम सकलकामनासिद्ध्यर्धे जपे विनियोगः ॥ ॐ ह्रां प्राच्यां डमरुहस्तो रक्तवर्णो महाबलः । प्रत्यक्षमहमीशान
    बटुकाय नमो नमः ॥ ॐ ह्रीं दण्डधारी दक्षिणे च पश्चिमे खड्गधारिणे । ॐ ह्रूं घटावादी मूतिरुत्तरस्यां दिशिस्तथा
    । ॐ ह्रैं अग्निरूपो ह्याग्नेय्यां नैरृत्यां च दिगम्बरः । ॐ ह्रौं सर्वभूतस्थो वायव्ये भूतानां हितकारकः
    ॥ ॐ ह्रश्चवाष्टसिद्धिश्च ईशाने सर्वसिद्धिकरः परः । प्रत्यक्षमहमीशान बटुकाय नमो नमः ॥ ॐ ह्रां ह्रीं
    ह्रूं ह्रैं ह्रौं ह्रः स्वाहा ऊर्ध्वं खेचरिणं न्यसेत् । रुद्ररूपस्तु पाताले बटुकाय नमो नमः ॥ ॐ ह्रीं
    बटुकाय मूर्ध्नि ललाटे भीमरूपिणम् । आपदुद्धरणं नेत्रे मुखे च बटुकं न्यसेत् ॥ १॥ कुरु कुरु सर्वसिद्धिर्देहे
    गेहे व्यवस्थितः । बटुकाय ह्रीं सर्वदेहे विश्वस्य सर्वतो दिशि ॥ २॥ आपदुद्धारकः पातु ह्यापादतलमस्तकम्
    । हसक्षमलवरयुं पातु पूर्वे दण्डहस्तस्तु दक्षिणे ॥ ३॥ हसक्षमलवरयुं नैरृत्ये हसक्षमलवरयुं पश्चिमेऽवतु
    । सर्वभूतस्थो वायव्ये हसक्षमलवरयुं घटावादिन उत्तरे ॥ ४॥ हंसः सोऽहं तु ईशाने चाष्टसिद्धिकरः परः । शंक्षेत्रपाल
    ऊर्ध्वे तु पाताले शिव सन्निभः ॥ ५॥ एवं दशदिशो रक्षेद्बटुकाय नमो नमः । इति ते कथितं ह्रीं श्रीं क्लीं
    ऐं सदाऽवतु ॥ ६॥ ॐ फ्रें हुं फट् च सर्वत्र त्रैलोक्ये विजयी भवेत् । लक्ष्मीं ऐं श्रीं लं पृथिव्यां
    च आकारो हं ममावतु ॥ ७॥ स्रौं प्रौं ज्रौं ऊँ यं वायव्यां रं रं रं तेजोरूपिणम् । ॐ कं खं गं घं ङं बटुकं
    चं छं जं झं ञं कपालिनम् ॥ ८॥ टं ठं डं ढं णं क्षेत्रेशं तं थं दं धं नं उमाप्रियम् । पं फं बं भं मं
    ममरक्ष यं रं लं भैरवोत्तमम् ॥ ९॥ वं शं षं सं आदिनाथं लं क्षं वै क्षेत्रपालकम् ।
