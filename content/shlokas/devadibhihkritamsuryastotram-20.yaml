id: devadibhihkritamsuryastotram-20
category: stotram
name:
  english: devadibhihkritamsuryastotram 20
  devanagari: देवादिभिःकृतंसूर्यस्तोत्रम् २०
content:
  english: adidevo'si devanam jnatametatsvarupatah | svargasthityantakaleshu tridha bhedena tishthasi
    || 48|| svasti te'stu jagannatha dharmavarshahimakara | jushasva shantim lokanam devadeva divakara
    || 49|| indrashcagatya tam devam likhyamanam yatha'stuvat | jaya deva jagadvyapinjayasheshajagatpate
    || 50|| rishayashca tatah sapta vasishthatripurogamah | tushtuvurvividhaih stotraih svasti svastiti
    vadinah || 51|| vedoktabhirathagryabhirvalakhilyashca tushtuvuh | bhasvantamrigbhiradyabhirlikhyamanam
    mudayutah || 52|| tvam natha mokshinam moksho dhyeyastvam dhyaninam parah | tvam gatih sarvabhutanam
    karmakande'pi vartatam || 53|| sham prajabhyo'stu devesha shanno'stu jagatampate | shanno'stu dvipade
    nityam shannashcastu catushpade || 54|| tato vidyadharagana yaksharakshasapannagah | kritanjaliputah
    sarve shirobhih pranata ravim || 55|| ucurevamvidha vaco manah shrotrasukhavahah | sahyam bhavatu
    te tejo bhutanam bhutabhavana || 56|| iti markandeyapurane tryadhikashatatamadhyayantargatam devadibhih
    kritam suryastotram samaptam | markandeyapurana | adhyaya 103
  devanagari: आदिदेवोऽसि देवानां ज्ञातमेतत्स्वरूपतः । स्वर्गस्थित्यन्तकालेषु त्रिधा भेदेन तिष्ठसि ॥ ४८॥
    स्वस्ति तेऽस्तु जगन्नाथ धर्मवर्षाहिमाकर । जुषस्व शान्तिं लोकानां देवदेव दिवाकर ॥ ४९॥ इन्द्रश्चागत्य
    तं देवं लिख्यमानं यथाऽस्तुवत् । जय देव जगद्व्यापिञ्जयाशेषजगत्पते ॥ ५०॥ ऋषयश्च ततः सप्त वसिष्ठात्रिपुरोगमाः
    । तुष्टुवुर्विविधैः स्तोत्रैः स्वस्ति स्वस्तीति वादिनः ॥ ५१॥ वेदोक्ताभिरथाग्र्याभिर्वालखिल्याश्च तुष्टुवुः
    । भास्वन्तमृग्भिराद्याभिर्लिख्यमानं मुदायुताः ॥ ५२॥ त्वं नाथ मोक्षिणां मोक्षो ध्येयस्त्वं ध्यानिनां
    परः । त्वं गतिः सर्वभूतानां कर्मकाण्डेऽपि वर्तताम् ॥ ५३॥ शं प्रजाभ्योऽस्तु देवेश शन्नोऽस्तु जगताम्पते
    । शन्नोऽस्तु द्विपदे नित्यं शन्नश्चास्तु चतुष्पदे ॥ ५४॥ ततो विद्याधरगणा यक्षराक्षसपन्नगाः । कृताञ्जलिपुटाः
    सर्वे शिरोभिः प्रणता रविम् ॥ ५५॥ ऊचुरेवंविधा वाचो मनः श्रोत्रसुखावहः । सह्यं भवतु ते तेजो भूतानां
    भूतभावन ॥ ५६॥ इति मार्कण्डेयपुराणे त्र्यधिकशततमाध्यायान्तर्गतं देवादिभिः कृतं सूर्यस्तोत्रं समाप्तम्
    । मार्कण्डेयपुराण । अध्याय १०३
