id: shastagayatrinyasah
category: stotram
name:
  english: shastagayatrinyasah
  devanagari: शास्तागायत्रीन्यासह्
content:
  english: shirasi bhutanathaya namah | lalate vidmahe namah | mukhe bhavaputraya namah | kanthe dhimahi
    namah | nabhau tanno namah | urvoh shasta namah | padayoh pracodayat namah | sarvangeshu bhutadibhaya
    vi̱dmahḙ mahade̱vaya dhimahi | tanna̭h shasta praco̱dayaṱ
  devanagari: शिरसि भूतनाथाय नमः । ललाटे विद्महे नमः । मुखे भवपुत्राय नमः । कण्ठे धीमहि नमः । नाभौ तन्नो
    नमः । ऊर्वोः शास्त नमः । पादयोः प्रचोदयात् नमः । सर्वाङ्गेषु भूतादिभाय वि॒द्महे॑ महादे॒वाय धीमहि ।
    तन्नः॑ शास्ता प्रचो॒दयात्॑
meaning: {}
