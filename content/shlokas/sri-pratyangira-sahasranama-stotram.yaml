id: sri-pratyangira-sahasranama-stotram
category: stotram
name:
  english: Sri Pratyangira Sahasranama Stotram
content:
  english: ishvara uvaca shrinu devi pravakshyami sampratam tatpuratanam | sahasranama paramam pratyangirartha
    siddhaye || || sahasranamapathena sarvatra vijayi bhavet | parabhavo na casyasti sabhayam va vane
    rane || || tatha tushta bhaveddevi pratyangira'sya pathatah | yatha bhavati deveshi sadhakah shiva
    eva hi || || ashvamedhasahasrani vajapeyasya kotayah | sakritpathena jayante prasanna pratyangira
    bhavet || || bhairavo'sya rishishchando'nushtup devi samirita | pratyangira viniyogah sarvasampatti
    hetave || || sarvakaryeshu samsiddhih sarvasampattida bhavet | evam dhyatva pathedetadyadicchedatmano
    hitam || || asya shripratyangira sahasranamamahamantrasya bhairava rishih anushtup chandah shrimahapratyangira
    devata hrim bijam shrim shaktih svaha kilakam parakrityavinasharthe jape pathe viniyogah || karanyasah
    om hram angushthabhyam namah | om hrim tarjanibhyam namah | om hrum madhyamabhyam namah | om hraim
    anamikabhyam namah | om hraum kanishthikabhyam namah | om hrah karatala karaprishthabhyam namah |
    hridayadi nyasah om hram hridayaya namah | om hrim shirase svaha | om hrum shikhayai vashat | om hraim
    kavacaya hum | om hraum netratrayaya vaushat | om hrah astraya phat | dhyanam ashambara muktakaca
    ghanacchavi rdhyeya sacarmasikara hi bhushana | damshtrogravaktra grasita hita tvaya pratyangira shankaratejaserita
    || stotram devi pratyangira divya sarasa shashishekhara | sumana samidheti ca samastasurashemushi
    || || sarvasampattijanani sarvada sindhusevini | shambhusimantini sima suraradhya sudharasa || ||
    rasa rasavati vela vanya ca vanamalini | vanajakshi vanacari vani vanavinodini || || vegini vegada
    vegabalasya ca baladhika | kala kalapriya koli komala kalakamini || || kamala kamalasya ca kamalastha
    kalavati | kulina kutila kanta kokila kalabhashini || || kirakili kala kali kapalinyapi kalika | keshini
    ca kushavarta kaushambi keshavapriya || || kashi kala mahakashi sankasha keshadayini | kundali kundalasya
    ca kundalangadamandita || || kunapali kumudini kumuda pritivardhini | kundapriya kundarucih kurangamadanodini
    || || kuranganayana kunda kuruvrinda'bhinandini | kusumbhakusuma kanci kvanatkinkinika kata || ||
    kathora karuna kashtha kaumudi kambukanthini | kapardini kapatini kanthini kalakanthika || || kirahasta
    kumari ca kuruda kusumapriya | kunjarastha kunjarata kumbhi kumbhastanadvaya || || kumbhiga karibhoga
    ca kadali dalashalini | kupita kotarastha ca kankali kandarodara || || ekantavasini kanci kampamanashiroruha
    | kadambari kadambastha kunkumapremadharini || || kutumbinipriya''kuti kratuh kratukari priya | katyayani
    krittika ca kartikeyapravartini || || kamapatni kamadatri kameshi kamavandita | kamarupa kramavarti
    kamakshi kamamohita || || khadgini khecari khadga khanjaritekshana khala | kharaga kharanatha ca kharasya
    khelanapriya || || kharamshuh khetini khatva khaga khatvangadharini | kharakhandini khyata khandita
    khandanisthita || || khandapriya khandakhadya sendukhanda ca khandini | ganga godavari gauri gomatyapi
    ca gautami || || gaya geya gaganaga garudi garudadhvaja | gita gitapriya gopa gandaprita guni gira
    || || gum gauri mandamadana gokula gopratarini | goda govindini gudha nirgudha gudhavigraha || ||
    gunjini gajaga gopi gotrakshayakari gada | giribhupaladuhita goga gocchalavardhini || || ghanastani
    ghanarucirghaneha ghananihsvana | ghutkarini ghughakari ghughukaparivarita || || ghantanadapriya ghanta
    ghanaghotakavahini | ghorarupa ca ghora ca ghuti pratighana ghani || || ghritaci ghanapushtishca ghata
    ghanaghata'mrita | ghatasya ghatana ghoghaghatapatanivarini || || cancarika cakori ca camunda ciradharini
    | caturi capala cakracala cela cala'cala || || catushcirantana caka cikya camikaracchavih | capini
    capala campu cinta cintamanishcita || || caturvarnyamayi cancaccauracarya camatkritih | cakravartivadhushcakra
    cakranga cakramodini || || cetashcari cittavrittiraceta cetanaprada | campeyi campakapritishcandi
    candalavasini || || ciranjivitata cinca tarumulanivasini | churika chatramadhyastha chidra chedakari
    chida || || chuchundaripalapriti chuchundarinibhasvana | chalini chalada chatra chitika chekakrittatha
    || || chagini chandasi chaya chayakricchadirityapi | jaya ca jayada jati jayastha jayavardhini ||
    || japapushpapriya japya jrimbhini yamala yuta | jambupriya jayastha ca jangama jangamapriya || ||
    janturjantupradhana ca jaratkarna jaradbhava | jatipriya jivanastha jimutasadrishacchavih || || janya
    janahita jaya jambhabhijjambhamalini | javada javavadvaha javani jvaraha jvara || || jhanjhanilamayi
    jhanjha jhanatkarakara tatha | jhintisha jhampakrit jhampa jhampatrasanivarini || || takarastha tankadhara
    tankara karashatini | thakkura thitkriti thinthi thinthiravasamavrita || || thanthanilamayi thantha
    thanatkarakara thasa | dakini damari caiva dindimadhvaninandini || || dhakkasvanapriya dhakka tapini
    tapini tatha | taruni tundila tunda tamasi ca tapahpriya || || tamra tamrambara tali talidalavibhushana
    | turanga tvarita treta totula todini tula || || tapatrayahara tapta talakeshi tamalini | tamaladalavacchama
    talamlanavati tami || || tamasi ca tamisra ca tivra tivraparakrama | tatastha tilatailakta tarani
    tapanadyutih || || tilottama tilakakrittarakadhishashekhara | tilapushpapriya tara tarakeshi kutumbini
    || || sthanupatni sthitikari sthalastha sthalavardhini | sthitih sthairya sthavishtha ca sthapatih
    sthalavigraha || || dantini dandini dina daridra dinavatsala | devi devavadhurdaityadamani dantabhushana
    || || dayavati damavati damada dadimastani | dandashukanibha daityadarini devatanana || || dolakrida
    dalayushca dampati devatamayi | dasha dipasthita dosha doshaha doshakarini || || durga durgartishamani
    durgama durgavasini | durgandhanashini duhstha duhsvapnashamakarini || || durvara dundubhi bhranta
    durastha duravasini | daraha darada datri dayada duhita daya || || dhurandhara dhurina ca dhauri dhi
    dhanadayini | dhira'dhira dharitri ca dharmada dhiramanasa || || dhanurdhara ca damani dhurta dhurtaparigraha
    | dhumavarna dhumapana dhumala dhumamohini || || nalini nandini nanda nadini nandabalika | navina
    narmada narminemirniyamanishcaya || || nirmala nigamacara nimnaga nagnakamini | nitirnirantara nagni
    nirlepa nirguna natih || || nilagriva niriha ca niranjanajani navi | navanitapriya nari narakarnavatarini
    || || narayani nirakara nipuna nipunapriya | nisha nidra narendrastha namita'namitapi ca || || nirgundika
    ca nirgunda nirmamsa'namika nibha | patakini pataka ca palapritiryashasvini || || pina pinastana patni
    pavanashanashayini | para'para kalapa''ppa pakakrityarati priya || || pavanastha supavana tapasipritivardhini
    | pashuvriddhikari pushtih poshani pushpavardhini || || pushpini pustakakara punnagatalavasini | purandarapriya
    pritih puramarganivasini || || pashi pashakara pasha bandhuha pamsula pashuh | patuh patasa parashudharini
    pashini tatha || || papaghni patipatni ca patita'patitapi ca | pishaci ca pishacaghni pishitashanatoshita
    || || panada panapatra ca panadanakarodyata | peya prasiddha piyusha purna purnamanoratha || || patadgarbha
    patadgatra patapunyapriya puri | pankila pankamagna ca paniya panjarasthita || || pancami pancayajna
    ca pancata pancamapriya | pancamudra pundarika piki pingalalocana || || priyangumanjari pindi pindita
    panduraprabha | pretasana priyalustha pandughni pitasapaha || || phalini phaladhatri ca phalashrih
    phanibhushana | phutkarakarini sphara phulla phullambujasana || || phirangaha sphitamatih sphitih
    sphitakari tatha | balamaya balaratirbalini balavardhini || || venuvadya vanacari viravajanayitri
    ca | vidya vidyaprada vidyabodhini bodhadayini || || buddhamata ca buddha ca vanamalavati vara | varada
    varuni vina vinavadanatatpara || || vinodini vinodastha vaishnavi vishnuvallabha | vaidya vaidyacikitsa
    ca vivasha vishvavishruta || || vidvatkavikala vetta vitandra vigatajvara | virava vividharava bimboshthi
    bimbavatsala || || vindhyastha viravandya ca variyasaparadhavit | vedantavedya vedya ca vaidya ca
    vijayaprada || || virodhavardhini vandhya vandhyabandhanivarini | bhagini bhagamala ca bhavani bhavabhavini
    || || bhima bhimanana bhaimi bhangura bhimadarshana | bhilli bhalladhara bhirurbherunda caibhabhayapaha
    || || bhagasarpinyapi bhaga bhagarupa bhagalaya | bhagasana bhagamoda bheri bhankararanjini || ||
    bhishana'bhishana sarva bhagavatyapi bhushana | bharadvaji bhogadatri bhavaghni bhutibhushana || ||
    bhutida bhumidatri ca bhupatitvapradayini | bhramari bhramari nila bhupalamukutasthita || || matta
    manohara mana manini mohani maha | mahalakshmirmadakshiba madira madiralaya || || madoddhata matangastha
    madhavi madhumanthini | medha medhakari medhya madhya madhyavayasthita || || madyapa mamsala matsya
    modini maithunoddhata | mudra mudravati mata maya mahimamandira || || mahamaya mahavidya mahamari
    maheshvari | mahadevavadhurmanya mathura merumandala || || medasvani medasushrirmahishasuramardini
    | mandapastha mathastha'ma mala malavilasini || || mokshada mundamala ca mandiragarbhagarbhita | matangini
    ca matangi matangatanaya madhuh || || madhusrava madhurasa madhukakusumapriya | yamini yamininathabhusha
    yavakaranjita || || yavankurapriya yama yavani yavanadhipa | yamaghni yamavani ca yajamanasvarupini
    || || yajna yajya yajuryajva yashonikarakarini | yajnasutraprada jyeshtha yajnakarmakari yasha ||
    || yashasvini yajnasamstha yupastambhanivasini | ranjita rajapatni ca rama rekha ravi rani || || rajovati
    rajashcitra rajani rajanipatih | ragini rajini rajya rajyada rajyavardhini || || rajanvati rajanitisturya
    rajanivasini | ramani ramaniya ca rama ramavati ratih || || retovati ratotsaha rogaha rogakarini |
    ranga rangavati raga ragajna ragini rana || || ranjika ranjaki ranja ranjini raktalocana | raktacarmadhara
    rantri raktastha raktavahini || || rambha rambhaphalapriti rambhoru raghavapriya | rangabhridrangamadhura
    rodasi rodasigriha || || rogakartri rogahartri ca rogabhridrogashayini | vandi vandistuta bandhurbandhukakusumadhara
    || || vandita vandimata bandhura baindavi vibha | vinki vinkapala vinka vinkastha vinkavatsala ||
    || vedairvilagna vigna ca vidhirvidhikari vidha | shankhini shankhanilaya shankhamalavati shami ||
    || shankhapatrashini shankha'shankha shankhagala shashi | shimbi sharavati shyama shyamangi shyamalocana
    || || shmashanastha shmashana ca shmashanasthalabhushana | sharmada shamahartri ca shakini shankushekhara
    || || shantih shantiprada shesha sheshastha sheshashayini | shemushi shoshini shauri sharih shaurya
    shara shari || || shapada shapahari shrih shampa shapathacapini | shringini shringipalabhuk shankari
    shankari tatha || || shanka shankapaha shamstha shashvati shitala shiva | shavastha shavabhuk shaivi
    shavavarna shavodari || || shayini shavashayana shimshipa shimshipayata | shavakundalini shaiva shankara
    shishira shira || || shavakanci shavashrika shavamala shavakritih | shampini shankushaktih sham shantanuh
    shiladayini || || sindhuh sarasvati sindhusundari sundaranana | sadhusiddhih siddhidatri siddha siddhasarasvati
    || || santatih sampada sampatsamvitsampattidayini | sapatni sarasa sara sarasvatikari sudha || ||
    sarah sama samana ca samaradhya samastada | samiddha samada samma sammoha samadarshana || || samitih
    samidha sima savitri samvida sati | savana savanadhara savana samara sami || || samira sumana sadhvi
    sadhricinyasahayini | hamsi hamsagatirhamsa hamsojjvalanicolayuk || || halini halada hala harashrirharavallabha
    | hela helavati hresha hreshastha hreshavardhini || || hanta hanirhayahva hriddhantaha hantaharini
    | hunkari hantakriddhanka hiha haha hatahita || || hema prabha haravati harita harisammata | hori
    hotri holika ca homya homa havirharih || || harini harininetra himacalanivasini | lambodari lambakarna
    lambika lambavigraha || || lila lilavati lola lalana lalitalata | lalamalocana locya lolakshi lakshana
    lata || || lampati lumpati lampa lopamudra lalanti ca | latika langhika langha laghima laghumadhyama
    || || laghviyasi laghudarka luta lutanivarini | lomabhrillomalomni ca luluti lululumpini || || lulayastha
    ca lahari lankapurapurandari | lakshmirlakshmiprada lakshya lakshyabalagatiprada || || kshanakshapa
    kshanakshina kshama kshantih kshamavati | kshama kshamodari kshoni kshonibhrit kshatriyangana || ||
    kshapa kshapakari kshira kshirada kshirasagara | kshinankari kshayakari kshayabhrit kshayada kshatih
    | ksharanti kshudrika kshudra kshutkshama ksharapataka || matuh sahasranamedam pratyangirasiddhidayakam
    || || yah pathetprayato nityam daridro dhanado bhavet | anacantah pathennityam sa capi syanmaheshvarah
    | mukah syadvakpatirdevi rogi nirogatam bhavet || || aputrah putramapnoti trishulokeshu vishrutam
    | vandhyapi sute tanayan gavashca bahudugdhadah || || rajanah padanamrah syustasya dasa iva sphutah
    | arayah sankshayam yanti manasa samsmrita api || || darshanadeva jayante nara naryo'pi tadvashah
    | karta harta svayamviro jayate natrasamshayah || || yam yam kamayate kamam tam tam prapnoti nishcitam
    | duritam na ca tasyasti nasti shokah kadacana || || catushpathe'rdharatre ca yah pathetsadhakottamah
    | ekaki nirbhayo dhiro dashavartam narottamah || || manasa cintitam karyam tasya siddhirna samshayam
    | vina sahasranamnam yo japenmantram kadacana || || na siddho jayate tasya mantrah kalpashatairapi
    | kujavare shmashane ca madhyahne yo japettatha || || shatavartya sa jayeta karta harta nrinamiha
    | rogarto yo nishithante pathedambhasi samsthitah || || sadyo nirogatameti yadi syannirbhayastada
    | ardharatre shmashane va shanivare japenmanum || || ashtottarasahasram tu dashavaram japettatah |
    sahasranamamettaddhi tada yati svayam shiva || || mahapavanarupena ghoragomayunadini | tada yadi na
    bhitih syattato dehiti vagbhavet || || tada pashubalim dadyat svayam grihnati candika | yatheshtam
    ca varam dattva yati pratyangira shiva || || rocanagurukasturi karpuramadacandanaih | kunkumaprathamabhyam
    tu likhitam bhurjapatrake || || shubhanakshatrayoge tu samabhyarcya ghatantare | kritasampatanatsiddham
    dharyantaddakshinekare || || sahasranamasvarnastham kanthe vapi jitendriyah | tadayam pranamenmantri
    kruddhah samriyate narah || || yasmai dadati ca svasti sa bhaveddhanadopamah | dushtashvapadajantunam
    na bhih kutrapi jayate || || balakanamiyam raksha garbhininamapi dhruvam | mohana stambhanakarshamaranoccatanani
    ca || || yantradharanato nunam sidhyante sadhakasya ca | nilavastre vilikhitam dhvajayam yadi tishthati
    || || tada nashta bhavatyeva pracanda paravahini | etajjaptam mahabhasma lalate yadi dharayet || ||
    taddarshanata eva syuh praninastasya kinkarah | rajapatnyo'pi vashyah syuh kimanyah parayoshitah ||
    || etajjapannishitoye masaikena mahakavih | panditashca mahavadi jayate natrasamshayah || || shaktim
    sampujya deveshi pathet stotram varam shubham | ihaloke sukham bhuktva paratra tridivam vrajet ||
    || iti namasahasram tu pratyangira manoharam | gopyam guhyatamam loke gopaniyam svayonivat || || iti
    shrirudrayamale tantre dashavidyarahasye shri pratyangira sahasranama stotram |
  devanagari: ईश्वर उवाच शृणु देवि प्रवक्ष्यामि साम्प्रतं तत्पुरातनम् । सहस्रनाम परमं प्रत्यङ्गिरार्थ
    सिद्धये ॥ ॥ सहस्रनामपाठेन सर्वत्र विजयी भवेत् । पराभवो न चास्यास्ति सभायां वा वने रणे ॥ ॥ तथा तुष्टा
    भवेद्देवी प्रत्यङ्गिराऽस्य पाठतः । यथा भवति देवेशि साधकः शिव एव हि ॥ ॥ अश्वमेधसहस्राणि वाजपेयस्य कोटयः
    । सकृत्पाठेन जायन्ते प्रसन्ना प्रत्यङ्गिरा भवेत् ॥ ॥ भैरवोऽस्य ऋषिश्छन्दोऽनुष्टुप् देवी समीरिता ।
    प्रत्यङ्गिरा विनियोगः सर्वसम्पत्ति हेतवे ॥ ॥ सर्वकार्येषु संसिद्धिः सर्वसम्पत्तिदा भवेत् । एवं ध्यात्वा
    पठेदेतद्यदीच्छेदात्मनो हितम् ॥ ॥ अस्य श्रीप्रत्यङ्गिरा सहस्रनाममहामन्त्रस्य भैरव ऋषिः अनुष्टुप् छन्दः
    श्रीमहाप्रत्यङ्गिरा देवता ह्रीं बीजं श्रीं शक्तिः स्वाहा कीलकं परकृत्याविनाशार्थे जपे पाठे विनियोगः
    ॥ करन्यासः ॐ ह्रां अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां नमः । ॐ ह्रूं मध्यमाभ्यां नमः । ॐ ह्रैं
    अनामिकाभ्यां नमः । ॐ ह्रौं कनिष्ठिकाभ्यां नमः । ॐ ह्रः करतल करपृष्ठाभ्यां नमः । हृदयादि न्यासः ॐ ह्रां
    हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ ह्रूं शिखायै वषट् । ॐ ह्रैं कवचाय हुम् । ॐ ह्रौं नेत्रत्रयाय
    वौषट् । ॐ ह्रः अस्त्राय फट् । ध्यानम् आशाम्बरा मुक्तकचा घनच्छवि र्ध्येया सचर्मासिकरा हि भूषणा । दंष्ट्रोग्रवक्त्रा
    ग्रसिता हिता त्वया प्रत्यङ्गिरा शङ्करतेजसेरिता ॥ स्तोत्रम् देवी प्रत्यङ्गिरा दिव्या सरसा शशिशेखरा
    । सुमना सामिधेती च समस्तसुरशेमुषी ॥ ॥ सर्वसम्पत्तिजननी सर्वदा सिन्धुसेविनी । शम्भुसीमन्तिनी सीमा सुराराध्या
    सुधारसा ॥ ॥ रसा रसवती वेला वन्या च वनमालिनी । वनजाक्षी वनचरी वनी वनविनोदिनी ॥ ॥ वेगिनी वेगदा वेगबलास्या
    च बलाधिका । कला कलप्रिया कोली कोमला कालकामिनी ॥ ॥ कमला कमलास्या च कमलस्था कलावती । कुलीना कुटिला कान्ता
    कोकिला कलभाषिणी ॥ ॥ कीरकीली कला काली कपालिन्यपि कालिका । केशिनी च कुशावर्ता कौशाम्बी केशवप्रिया ॥
    ॥ काशी कला महाकाशी सङ्काशा केशदायिनी । कुण्डली कुण्डलास्या च कुण्डलाङ्गदमण्डिता ॥ ॥ कुणपाली कुमुदिनी
    कुमुदा प्रीतिवर्धिनी । कुन्दप्रिया कुन्दरुचिः कुरङ्गमदनोदिनी ॥ ॥ कुरङ्गनयना कुन्दा कुरुवृन्दाऽभिनन्दिनी
    । कुसुम्भकुसुमा काञ्ची क्वणत्किङ्किणिका कटा ॥ ॥ कठोरा करुणा काष्ठा कौमुदी कम्बुकण्ठिनी । कपर्दिनी
    कपटिनी कण्ठिनी कालकण्ठिका ॥ ॥ कीरहस्ता कुमारी च कुरुदा कुसुमप्रिया । कुञ्जरस्था कुञ्जरता कुम्भि कुम्भस्तनद्वया
    ॥ ॥ कुम्भिगा करिभोगा च कदली दलशालिनी । कुपिता कोटरस्था च कङ्काली कन्दरोदरा ॥ ॥ एकान्तवासिनी काञ्ची
    कम्पमानशिरोरुहा । कादम्बरी कदम्बस्था कुङ्कुमप्रेमधारिणी ॥ ॥ कुटुम्बिनीप्रियाऽऽकूती क्रतुः क्रतुकरी
    प्रिया । कात्यायनी कृत्तिका च कार्तिकेयप्रवर्तिनी ॥ ॥ कामपत्नी कामदात्री कामेशी कामवन्दिता । कामरूपा
    क्रमावर्ती कामाक्षी काममोहिता ॥ ॥ खड्गिनी खेचरी खड्गा खञ्जरीटेक्षणा खला । खरगा खरनाथा च खरास्या खेलनप्रिया
    ॥ ॥ खरांशुः खेटिनी खट्वा खगा खट्वाङ्गधारिणी । खरखण्डिनी ख्याता खण्डिता खण्डनीस्थिता ॥ ॥ खण्डप्रिया
    खण्डखाद्या सेन्दुखण्डा च खण्डिनी । गङ्गा गोदावरी गौरी गोमत्यपि च गौतमी ॥ ॥ गया गेया गगनगा गारुडी गरुडध्वजा
    । गीता गीतप्रिया गोपा गण्डप्रीता गुणी गिरा ॥ ॥ गुं गौरी मन्दमदना गोकुला गोप्रतारिणी । गोदा गोविन्दिनी
    गूढा निर्गूढा गूढविग्रहा ॥ ॥ गुञ्जिनी गजगा गोपी गोत्रक्षयकरी गदा । गिरिभूपालदुहिता गोगा गोच्छलवर्धिनी
    ॥ ॥ घनस्तनी घनरुचिर्घनेहा घननिःस्वना । घूत्कारिणी घूघकरी घुघूकपरिवारिता ॥ ॥ घण्टानादप्रिया घण्टा घनाघोटकवाहिनी
    । घोररूपा च घोरा च घूती प्रतिघना घनी ॥ ॥ घृताची घनपुष्टिश्च घटा घनघटाऽमृता । घटस्या घटना घोघघातपातनिवारिणी
    ॥ ॥ चञ्चरीका चकोरी च चामुण्डा चीरधारिणी । चातुरी चपला चक्रचला चेला चलाऽचला ॥ ॥ चतुश्चिरन्तना चाका
    चिक्या चामीकरच्छविः । चापिनी चपला चम्पू चिन्ता चिन्तामणिश्चिता ॥ ॥ चातुर्वर्ण्यमयी चञ्चच्चौराचार्या
    चमत्कृतिः । चक्रवर्तिवधूश्चक्रा चक्राङ्गा चक्रमोदिनी ॥ ॥ चेतश्चरी चित्तवृत्तिरचेता चेतनप्रदा । चाम्पेयी
    चम्पकप्रीतिश्चण्डी चण्डालवासिनी ॥ ॥ चिरञ्जीवितटा चिञ्चा तरुमूलनिवासिनी । छुरिका छत्रमध्यस्था छिद्रा
    छेदकरी छिदा ॥ ॥ छुछुन्दरीपलप्रीती छुछुन्दरीनिभस्वना । छलिनी छलदा छत्रा छिटिका छेककृत्तथा ॥ ॥ छगिनी
    छान्दसी छाया छायाकृच्छादिरित्यपि । जया च जयदा जाती जयस्था जयवर्धिनी ॥ ॥ जपापुष्पप्रिया जप्या जृम्भिणी
    यामला युता । जम्बूप्रिया जयस्था च जङ्गमा जङ्गमप्रिया ॥ ॥ जन्तुर्जन्तुप्रधाना च जरत्कर्णा जरद्भवा ।
    जातिप्रिया जीवनस्था जीमूतसदृशच्छविः ॥ ॥ जन्या जनहिता जाया जम्भभिज्जम्भमालिनी । जवदा जववद्वाहा जवानी
    ज्वरहा ज्वरा ॥ ॥ झञ्झानिलमयी झञ्झा झणत्कारकरा तथा । झिण्टीशा झम्पकृत् झम्पा झम्पत्रासनिवारिणी ॥ ॥
    टकारस्था टङ्कधरा टङ्कारा करशाटिनी । ठक्कुरा ठीत्कृती ठिण्ठी ठिण्ठीरवसमावृता ॥ ॥ ठण्ठानिलमयी ठण्ठा
    ठणत्कारकरा ठसा । डाकिनी डामरी चैव डिण्डिमध्वनिनन्दिनी ॥ ॥ ढक्कास्वनप्रिया ढक्का तपिनी तापिनी तथा ।
    तरुणी तुन्दिला तुन्दा तामसी च तपःप्रिया ॥ ॥ ताम्रा ताम्राम्बरा ताली तालीदलविभूषणा । तुरङ्गा त्वरिता
    त्रेता तोतुला तोदिनी तुला ॥ ॥ तापत्रयहरा तप्ता तालकेशी तमालिनी । तमालदलवच्छामा तालम्लानवती तमी ॥ ॥
    तामसी च तमिस्रा च तीव्रा तीव्रपराक्रमा । तटस्था तिलतैलाक्ता तरणी तपनद्युतिः ॥ ॥ तिलोत्तमा तिलककृत्तारकाधीशशेखरा
    । तिलपुष्पप्रिया तारा तारकेशी कुटुम्बिनी ॥ ॥ स्थाणुपत्नी स्थितिकरी स्थलस्था स्थलवर्धिनी । स्थितिः
    स्थैर्या स्थविष्ठा च स्थापतिः स्थलविग्रहा ॥ ॥ दन्तिनी दण्डिनी दीना दरिद्रा दीनवत्सला । देवी देववधूर्दैत्यदमनी
    दन्तभूषणा ॥ ॥ दयावती दमवती दमदा दाडिमस्तनी । दन्दशूकनिभा दैत्यदारिणी देवतानना ॥ ॥ दोलाक्रीडा दलायुश्च
    दम्पती देवतामयी । दशा दीपस्थिता दोषा दोषहा दोषकारिणी ॥ ॥ दुर्गा दुर्गार्तिशमनी दुर्गमा दुर्गवासिनी
    । दुर्गन्धनाशिनी दुःस्था दुःस्वप्नशमकारिणी ॥ ॥ दुर्वारा दुन्दुभी भ्रान्ता दूरस्था दूरवासिनी । दरहा
    दरदा दात्री दायादा दुहिता दया ॥ ॥ धुरन्धरा धुरीणा च धौरी धी धनदायिनी । धीराऽधीरा धरित्री च धर्मदा
    धीरमानसा ॥ ॥ धनुर्धरा च दमनी धूर्ता धूर्तपरिग्रहा । धूमवर्णा धूमपाना धूमला धूममोहिनी ॥ ॥ नलिनी नन्दिनी
    नन्दा नादिनी नन्दबालिका । नवीना नर्मदा नर्मिनेमिर्नियमनिश्चया ॥ ॥ निर्मला निगमाचारा निम्नगा नग्नकामिनी
    । नीतिर्निरन्तरा नग्नी निर्लेपा निर्गुणा नतिः ॥ ॥ नीलग्रीवा निरीहा च निरञ्जनजनी नवी । नवनीतप्रिया
    नारी नरकार्णवतारिणी ॥ ॥ नारायणी निराकारा निपुणा निपुणप्रिया । निशा निद्रा नरेन्द्रस्था नमिताऽनमितापि
    च ॥ ॥ निर्गुण्डिका च निर्गुण्डा निर्मांसाऽनामिका निभा । पताकिनी पताका च पलप्रीतिर्यशस्विनी ॥ ॥ पीना
    पीनस्तना पत्नी पवनाशनशायिनी । पराऽपरा कलापाऽऽप्पा पाककृत्यरति प्रिया ॥ ॥ पवनस्था सुपवना तापसीप्रीतिवर्धिनी
    । पशुवृद्धिकरी पुष्टिः पोषणी पुष्पवर्धिनी ॥ ॥ पुष्पिणी पुस्तककरा पुन्नागतलवासिनी । पुरन्दरप्रिया प्रीतिः
    पुरमार्गनिवासिनी ॥ ॥ पाशी पाशकरा पाशा बन्धुहा पांसुला पशुः । पटुः पटासा परशुधारिणी पाशिनी तथा ॥ ॥
    पापघ्नी पतिपत्नी च पतिताऽपतितापि च । पिशाची च पिशाचघ्नी पिशिताशनतोषिता ॥ ॥ पानदा पानपात्रा च पानदानकरोद्यता
    । पेया प्रसिद्धा पीयूषा पूर्णा पूर्णमनोरथा ॥ ॥ पतद्गर्भा पतद्गात्रा पातपुण्यप्रिया पुरी । पङ्किला
    पङ्कमग्ना च पानीया पञ्जरस्थिता ॥ ॥ पञ्चमी पञ्चयज्ञा च पञ्चता पञ्चमप्रिया । पञ्चमुद्रा पुण्डरीका पिकी
    पिङ्गललोचना ॥ ॥ प्रियङ्गुमञ्जरी पिण्डी पिण्डिता पाण्डुरप्रभा । प्रेतासना प्रियालुस्था पाण्डुघ्नी पीतसापहा
    ॥ ॥ फलिनी फलधात्री च फलश्रीः फणिभूषणा । फूत्कारकारिणी स्फारा फुल्ला फुल्लाम्बुजासना ॥ ॥ फिरङ्गहा स्फीतमतिः
    स्फीतिः स्फीतकरी तथा । बलमाया बलारातिर्बलिनी बलवर्धिनी ॥ ॥ वेणुवाद्या वनचरी विरावजनयित्री च । विद्या
    विद्याप्रदा विद्याबोधिनी बोधदायिनी ॥ ॥ बुद्धमाता च बुद्धा च वनमालावती वरा । वरदा वारुणी वीणा वीणावादनतत्परा
    ॥ ॥ विनोदिनी विनोदस्था वैष्णवी विष्णुवल्लभा । वैद्या वैद्यचिकित्सा च विवशा विश्वविश्रुता ॥ ॥ विद्वत्कविकला
    वेत्ता वितन्द्रा विगतज्वरा । विरावा विविधारावा बिम्बोष्ठी बिम्बवत्सला ॥ ॥ विन्ध्यस्था वीरवन्द्या च
    वरीयसापराधवित् । वेदान्तवेद्या वेद्या च वैद्या च विजयप्रदा ॥ ॥ विरोधवर्धिनी वन्ध्या वन्ध्याबन्धनिवारिणी
    । भगिनी भगमाला च भवानी भवभाविनी ॥ ॥ भीमा भीमानना भैमी भङ्गुरा भीमदर्शना । भिल्ली भल्लधरा भीरुर्भेरुण्डा
    चैभभयापहा ॥ ॥ भगसर्पिण्यपि भगा भगरूपा भगालया । भगासना भगामोदा भेरी भाङ्काररञ्जिनी ॥ ॥ भीषणाऽभीषणा
    सर्वा भगवत्यपि भूषणा । भारद्वाजी भोगदात्री भवघ्नी भूतिभूषणा ॥ ॥ भूतिदा भूमिदात्री च भूपतित्वप्रदायिनी
    । भ्रमरी भ्रामरी नीला भूपालमुकुटस्थिता ॥ ॥ मत्ता मनोहरा मना मानिनी मोहनी महा । महालक्ष्मीर्मदाक्षीबा
    मदिरा मदिरालया ॥ ॥ मदोद्धता मतङ्गस्था माधवी मधुमन्थिनी । मेधा मेधाकरी मेध्या मध्या मध्यवयस्थिता ॥
    ॥ मद्यपा मांसला मत्स्या मोदिनी मैथुनोद्धता । मुद्रा मुद्रावती माता माया महिममन्दिरा ॥ ॥ महामाया महाविद्या
    महामारी महेश्वरी । महादेववधूर्मान्या मथुरा मेरुमण्डला ॥ ॥ मेदस्वनी मेदसुश्रीर्महिषासुरमर्दिनी । मण्डपस्था
    मठस्थाऽमा माला मालाविलासिनी ॥ ॥ मोक्षदा मुण्डमाला च मन्दिरागर्भगर्भिता । मातङ्गिनी च मातङ्गी मतङ्गतनया
    मधुः ॥ ॥ मधुस्रवा मधुरसा मधूककुसुमप्रिया । यामिनी यामिनीनाथभूषा यावकरञ्जिता ॥ ॥ यवाङ्कुरप्रिया यामा
    यवनी यवनाधिपा । यमघ्नी यमवाणी च यजमानस्वरूपिणी ॥ ॥ यज्ञा यज्या यजुर्यज्वा यशोनिकरकारिणी । यज्ञसूत्रप्रदा
    ज्येष्ठा यज्ञकर्मकरी यशा ॥ ॥ यशस्विनी यज्ञसंस्था यूपस्तम्भनिवासिनी । रञ्जिता राजपत्नी च रमा रेखा रवी
    रणी ॥ ॥ रजोवती रजश्चित्रा रजनी रजनीपतिः । रागिणी राजिनी राज्या राज्यदा राज्यवर्धिनी ॥ ॥ राजन्वती राजनीतिस्तुर्या
    राजनिवासिनी । रमणी रमणीया च रामा रामवती रतिः ॥ ॥ रेतोवती रतोत्साहा रोगहा रोगकारिणी । रङ्गा रङ्गवती
    रागा रागज्ञा रागिनी रणा ॥ ॥ रञ्जिका रञ्जकी रञ्जा रञ्जिनी रक्तलोचना । रक्तचर्मधरा रन्त्री रक्तस्था
    रक्तवाहिनी ॥ ॥ रम्भा रम्भाफलप्रीती रम्भोरू राघवप्रिया । रङ्गभृद्रङ्गमधुरा रोदसी रोदसीगृहा ॥ ॥ रोगकर्त्री
    रोगहर्त्री च रोगभृद्रोगशायिनी । वन्दी वन्दिस्तुता बन्धुर्बन्धूककुसुमाधरा ॥ ॥ वन्दिता वन्दिमाता बन्धुरा
    बैन्दवी विभा । विङ्की विङ्कपला विङ्का विङ्कस्था विङ्कवत्सला ॥ ॥ वेदैर्विलग्ना विग्ना च विधिर्विधिकरी
    विधा । शङ्खिनी शङ्खनिलया शङ्खमालावती शमी ॥ ॥ शङ्खपात्राशिनी शङ्खाऽशङ्खा शङ्खगला शशी । शिम्बी शरावती
    श्यामा श्यामाङ्गी श्यामलोचना ॥ ॥ श्मशानस्था श्मशाना च श्मशानस्थलभूषणा । शर्मदा शमहर्त्री च शाकिनी
    शङ्कुशेखरा ॥ ॥ शान्तिः शान्तिप्रदा शेषा शेषस्था शेषशायिनी । शेमुषी शोषिणी शौरी शारिः शौर्या शरा शरी
    ॥ ॥ शापदा शापहारी श्रीः शम्पा शपथचापिनी । शृङ्गिणी शृङ्गिपलभुक् शङ्करी शाङ्करी तथा ॥ ॥ शङ्का शङ्कापहा
    शंस्था शाश्वती शीतला शिवा । शवस्था शवभुक् शैवी शाववर्णा शवोदरी ॥ ॥ शायिनी शावशयना शिंशिपा शिंशिपायता
    । शवाकुण्डलिनी शैवा शङ्करा शिशिरा शिरा ॥ ॥ शवकाञ्ची शवश्रीका शवमाला शवाकृतिः । शम्पिनी शङ्कुशक्तिः
    शं शन्तनुः शीलदायिनी ॥ ॥ सिन्धुः सरस्वती सिन्धुसुन्दरी सुन्दरानना । साधुसिद्धिः सिद्धिदात्री सिद्धा
    सिद्धसरस्वती ॥ ॥ सन्ततिः सम्पदा सम्पत्संवित्सम्पत्तिदायिनी । सपत्नी सरसा सारा सरस्वतिकरी सुधा ॥ ॥
    सरः समा समाना च समाराध्या समस्तदा । समिद्धा समदा सम्मा सम्मोहा समदर्शना ॥ ॥ समितिः समिधा सीमा सावित्री
    संविदा सती । सवना सवनाधारा सावना समरा समी ॥ ॥ समीरा सुमना साध्वी सध्रीचीन्यसहायिनी । हंसी हंसगतिर्हंसा
    हंसोज्ज्वलनिचोलयुक् ॥ ॥ हलिनी हलदा हाला हरश्रीर्हरवल्लभा । हेला हेलावती ह्रेषा ह्रेषस्था ह्रेषवर्धिनी
    ॥ ॥ हन्ता हानिर्हयाह्वा हृद्धन्तहा हन्तहारिणी । हुङ्कारी हन्तकृद्धङ्का हीहा हाहा हताहिता ॥ ॥ हेमा
    प्रभा हरवती हारीता हरिसम्मता । होरी होत्री होलिका च होम्या होमा हविर्हरिः ॥ ॥ हारिणी हरिणीनेत्रा हिमाचलनिवासिनी
    । लम्बोदरी लम्बकर्णा लम्बिका लम्बविग्रहा ॥ ॥ लीला लीलावती लोला ललना लालितालता । ललामलोचना लोच्या लोलाक्षी
    लक्षणा लटा ॥ ॥ लम्पती लुम्पती लम्पा लोपामुद्रा ललन्ति च । लतिका लङ्घिका लङ्घा लघिमा लघुमध्यमा ॥ ॥
    लघ्वीयसी लघूदर्का लूता लूतनिवारिणी । लोमभृल्लोमलोम्नी च लुलुती लुलुलुम्पिनी ॥ ॥ लुलायस्था च लहरी लङ्कापुरपुरन्दरी
    । लक्ष्मीर्लक्ष्मीप्रदा लक्ष्या लक्ष्यबलगतिप्रदा ॥ ॥ क्षणक्षपा क्षणक्षीणा क्षमा क्षान्तिः क्षमावती
    । क्षामा क्षामोदरी क्षोणी क्षोणिभृत् क्षत्रियाङ्गना ॥ ॥ क्षपा क्षपाकरी क्षीरा क्षीरदा क्षीरसागरा ।
    क्षीणङ्करी क्षयकरी क्षयभृत् क्षयदा क्षतिः । क्षरन्ती क्षुद्रिका क्षुद्रा क्षुत्क्षामा क्षरपातका ॥
    मातुः सहस्रनामेदं प्रत्यङ्गिरासिद्धिदायकम् ॥ ॥ यः पठेत्प्रयतो नित्यं दरिद्रो धनदो भवेत् । अनाचान्तः
    पठेन्नित्यं स चापि स्यान्महेश्वरः । मूकः स्याद्वाक्पतिर्देवी रोगी नीरोगतां भवेत् ॥ ॥ अपुत्रः पुत्रमाप्नोति
    त्रिषुलोकेषु विश्रुतम् । वन्ध्यापि सूते तनयान् गावश्च बहुदुग्धदाः ॥ ॥ राजानः पादनम्राः स्युस्तस्य
    दासा इव स्फुटाः । अरयः सङ्क्षयं यान्ति मनसा संस्मृता अपि ॥ ॥ दर्शनादेव जायन्ते नरा नार्योऽपि तद्वशाः
    । कर्ता हर्ता स्वयंवीरो जायते नात्रसंशयः ॥ ॥ यं यं कामयते कामं तं तं प्राप्नोति निश्चितम् । दुरितं
    न च तस्यास्ति नास्ति शोकः कदाचन ॥ ॥ चतुष्पथेऽर्धरात्रे च यः पठेत्साधकोत्तमः । एकाकी निर्भयो धीरो दशावर्तं
    नरोत्तमः ॥ ॥ मनसा चिन्तितं कार्यं तस्य सिद्धिर्न संशयम् । विना सहस्रनाम्नां यो जपेन्मन्त्रं कदाचन
    ॥ ॥ न सिद्धो जायते तस्य मन्त्रः कल्पशतैरपि । कुजवारे श्मशाने च मध्याह्ने यो जपेत्तथा ॥ ॥ शतावर्त्या
    स जयेत कर्ता हर्ता नृणामिह । रोगार्तो यो निशीथान्ते पठेदम्भसि संस्थितः ॥ ॥ सद्यो नीरोगतामेति यदि स्यान्निर्भयस्तदा
    । अर्धरात्रे श्मशाने वा शनिवारे जपेन्मनुम् ॥ ॥ अष्टोत्तरसहस्रं तु दशवारं जपेत्ततः । सहस्रनाममेत्तद्धि
    तदा याति स्वयं शिवा ॥ ॥ महापवनरूपेण घोरगोमायुनादिनी । तदा यदि न भीतिः स्यात्ततो देहीति वाग्भवेत् ॥
    ॥ तदा पशुबलिं दद्यात् स्वयं गृह्णाति चण्डिका । यथेष्टं च वरं दत्त्वा याति प्रत्यङ्गिरा शिवा ॥ ॥ रोचनागुरुकस्तूरी
    कर्पूरमदचन्दनैः । कुङ्कुमप्रथमाभ्यां तु लिखितं भूर्जपत्रके ॥ ॥ शुभनक्षत्रयोगे तु समभ्यर्च्य घटान्तरे
    । कृतसम्पातनात्सिद्धं धार्यन्तद्दक्षिणेकरे ॥ ॥ सहस्रनामस्वर्णस्थं कण्ठे वापि जितेन्द्रियः । तदायं
    प्रणमेन्मन्त्री क्रुद्धः सम्रियते नरः ॥ ॥ यस्मै ददाति च स्वस्ति स भवेद्धनदोपमः । दुष्टश्वापदजन्तूनां
    न भीः कुत्रापि जायते ॥ ॥ बालकानामियं रक्षा गर्भिणीनामपि ध्रुवम् । मोहन स्तम्भनाकर्षमारणोच्चाटनानि
    च ॥ ॥ यन्त्रधारणतो नूनं सिध्यन्ते साधकस्य च । नीलवस्त्रे विलिखितं ध्वजायां यदि तिष्ठति ॥ ॥ तदा नष्टा
    भवत्येव प्रचण्डा परवाहिनी । एतज्जप्तं महाभस्म ललाटे यदि धारयेत् ॥ ॥ तद्दर्शनत एव स्युः प्राणिनस्तस्य
    किङ्कराः । राजपत्न्योऽपि वश्याः स्युः किमन्याः परयोषितः ॥ ॥ एतज्जपन्निशितोये मासैकेन महाकविः । पण्डितश्च
    महावादी जायते नात्रसंशयः ॥ ॥ शक्तिं सम्पूज्य देवेशि पठेत् स्तोत्रं वरं शुभम् । इहलोके सुखं भुक्त्वा
    परत्र त्रिदिवं व्रजेत् ॥ ॥ इति नामसहस्रं तु प्रत्यङ्गिर मनोहरम् । गोप्यं गुह्यतमं लोके गोपनीयं स्वयोनिवत्
    ॥ ॥ इति श्रीरुद्रयामले तन्त्रे दशविद्यारहस्ये श्री प्रत्यङ्गिरा सहस्रनाम स्तोत्रम् ।
