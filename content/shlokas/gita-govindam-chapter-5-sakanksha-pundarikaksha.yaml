id: gita-govindam-chapter-5-sakanksha-pundarikaksha
category: stotram
name:
  english: Gita Govindam Chapter 5 - Sakanksha Pundarikaksha
content:
  english: '|| pancamah sargah || || sakankshapundarikakshah || ahamiha nivasami yahi radham anunaya madvacanena
    canayethah | iti madhuripuna sakhi niyukta svayamidametya punarjagada radham || || vahati malayasamire
    madanamupanidhaya | sphutati kusumanikare virahihridayadalanaya || tava virahe vanamali sakhi sidati
    || || dahati shishiramayukhe maranamanukaroti | patati madanavishikhe vilapati vikalataro''ti || ||
    dhvanati madhupasamuhe shravanamapidadhati | manasi calitavirahe nishi nishi rujamupayati || || vasati
    vipinavitane tyajati lalitadhama | luthati dharanishayane bahu vilapati tava nama || || ranati pikasamavaye
    pratidishamanuyati | hasati manujanicaye virahamapalapati neti || || sphurati kalaravarave smarati
    manitameva| tavaratisukhavibhave ganayati sugunamativa || || tvadabhidhashubhadamasam vadati nari
    shrinoti | tamapi japati sarasam yuvatishu na ratimupaiti || || bhanati kavijayadeve virahavilasitena
    | manasi rabhasavibhave harirudayatu sukritena || || purvam yatra samam tvaya ratipaterasaditah siddhaya
    stasminneva nikunjamanmathamahatirthe punarmadhavah | dhyayamstvamanisham japannapi tavaivalapamantravalim
    bhuyastvatkucakumbhanirbharaparirambhamritam vanchati || || ratisukhasare gatamabhisare madanamanoharavesham
    | na kuru nitambini gamanavilambanamanusara tam hridayesham || dhirasamire yamunatire vasati vane
    vanamali || || nama sametam kritasanketam vadayate mriduvenum | bahu manute nanu te tanusangatapavanacalitamapi
    renum || || patati patatre vicalati patre shankitabhavadupayanam | racayati shayanam sacakitanayanam
    pashyati tava panthanam || || mukharamadhiram tyaja manjiram ripumiva kelishulolam | cala sakhi kunjam
    satimirapunjam shilaya nilanicolam || || urasi murarerupahitahare ghana iva taralabalake | tatidiva
    pite rativiparite rajasi sukritavipake || || vigalitavasanam parihritarasanam ghataya jaghanamapidhanam
    | kisalayashayane pankajanayane nidhimiva harshanidanam || || harirabhimani rajaniridanimiyamapi yati
    viramam | kuru mama vacanam satvararacanam puraya madhuripukamam || || shrijayadeve kritahariseve
    bhanati paramaramaniyam | pramuditahridayam harimatisadayam namata sukritakamaniyam || || vikirati
    muhuh shvasandishah puro muhurikshate pravishati muhuh kunjam gunjanmuhurbahu tamyati | racayati muhuh
    shayyam paryakulam muhurikshate madanakadanaklantah kante priyastava vartate || || tvadvamyena samam
    samagramadhuna tigmamshurastam gato govindasya manorathena ca samam praptam tamah sandratam | kokanam
    karunasvanena sadrishi dirgha madabhyarthana tanmugdhe viphalam vilambanamasau ramyo''bhisarakshanah
    || || ashleshadanu cumbanadanu nakhollekhadanu svantaja prodbodhadanu sambhramadanu ratarambhadanu
    pritayoh | anyartham gatayorbhramanmilitayoh sambhashanairjanato rdampatyoriha ko na ko na tamasi
    vridavimishro rasah || || sabhayacakitam vinyasyantim drishau timire pathi pratitaru muhuh sthitva
    mandam padani vitanvatim | kathamapi rahah praptamangairanangatarangibhih sumukhi subhagah pashyansa
    tvamupaitu kritarthatam || || radhamugdhamukharavindamadhupastrailokyamaulisthali nepathyocitanilaratnamavanibharavatarantakah|
    svacchandam vrajasubdarijanamanastoshapradoshodayah kamsadhvamsanadhumaketuravatu tvam devakinandanah||
    || || iti shrigitagovinde''bhisarikavarnane sakankshapundarikaksho nama pancamah sargah ||'
  devanagari: ॥ पञ्चमः सर्गः ॥ ॥ साकाङ्क्षपुण्डरीकाक्षः ॥ अहमिह निवसामि याहि राधां अनुनय मद्वचनेन चानयेथाः
    । इति मधुरिपुणा सखी नियुक्ता स्वयमिदमेत्य पुनर्जगाद राधाम् ॥ ॥ वहति मलयसमीरे मदनमुपनिधाय । स्फुटति
    कुसुमनिकरे विरहिहृदयदलनाय ॥ तव विरहे वनमाली सखि सीदति ॥ ॥ दहति शिशिरमयूखे मरणमनुकरोति । पतति मदनविशिखे
    विलपति विकलतरोऽति ॥ ॥ ध्वनति मधुपसमूहे श्रवणमपिदधाति । मनसि चलितविरहे निशि निशि रुजमुपयाति ॥ ॥ वसति
    विपिनविताने त्यजति ललितधाम । लुठति धरणिशयने बहु विलपति तव नाम ॥ ॥ रणति पिकसमवाये प्रतिदिशमनुयाति ।
    हसति मनुजनिचये विरहमपलपति नेति ॥ ॥ स्फुरति कलरवरावे स्मरति मणितमेव। तवरतिसुखविभवे गणयति सुगुणमतीव
    ॥ ॥ त्वदभिधशुभदमासं वदति नरि शृणोति । तमपि जपति सरसं युवतिषु न रतिमुपैति ॥ ॥ भणति कविजयदेवे विरहविलसितेन
    । मनसि रभसविभवे हरिरुदयतु सुकृतेन ॥ ॥ पूर्वं यत्र समं त्वया रतिपतेरासादितः सिद्धय स्तस्मिन्नेव निकुञ्जमन्मथमहातीर्थे
    पुनर्माधवः । ध्यायंस्त्वामनिशं जपन्नपि तवैवालापमन्त्रावलीं भूयस्त्वत्कुचकुम्भनिर्भरपरीरम्भामृतं वाञ्छति
    ॥ ॥ रतिसुखसारे गतमभिसारे मदनमनोहरवेशम् । न कुरु नितम्बिनि गमनविलम्बनमनुसर तं हृदयेशम् ॥ धीरसमीरे यमुनातीरे
    वसति वने वनमाली ॥ ॥ नाम समेतं कृतसङ्केतं वादयते मृदुवेणुम् । बहु मनुते ननु ते तनुसङ्गतपवनचलितमपि रेणुम्
    ॥ ॥ पतति पतत्रे विचलति पत्रे शङ्कितभवदुपयानम् । रचयति शयनं सचकितनयनं पश्यति तव पन्थानम् ॥ ॥ मुखरमधीरं
    त्यज मञ्जीरं रिपुमिव केलिषुलोलम् । चल सखि कुञ्जं सतिमिरपुञ्जं शीलय नीलनिचोलम् ॥ ॥ उरसि मुरारेरुपहितहारे
    घन इव तरलबलाके । तटिदिव पीते रतिविपरीते राजसि सुकृतविपाके ॥ ॥ विगलितवसनं परिहृतरसनं घटय जघनमपिधानम्
    । किसलयशयने पङ्कजनयने निधिमिव हर्षनिदानम् ॥ ॥ हरिरभिमानी रजनिरिदानीमियमपि याति विरामम् । कुरु मम वचनं
    सत्वररचनं पूरय मधुरिपुकामम् ॥ ॥ श्रीजयदेवे कृतहरिसेवे भणति परमरमणीयम् । प्रमुदितहृदयं हरिमतिसदयं नमत
    सुकृतकमनीयम् ॥ ॥ विकिरति मुहुः श्वासान्दिशः पुरो मुहुरीक्षते प्रविशति मुहुः कुञ्जं गुञ्जन्मुहुर्बहु
    ताम्यति । रचयति मुहुः शय्यां पर्याकुलं मुहुरीक्षते मदनकदनक्लान्तः कान्ते प्रियस्तव वर्तते ॥ ॥ त्वद्वाम्येन
    समं समग्रमधुना तिग्मांशुरस्तं गतो गोविन्दस्य मनोरथेन च समं प्राप्तं तमः सान्द्रताम् । कोकानां करुणस्वनेन
    सदृशी दीर्घा मदभ्यर्थना तन्मुग्धे विफलं विलम्बनमसौ रम्योऽभिसारक्षणः ॥ ॥ आश्लेषादनु चुम्बनादनु नखोल्लेखादनु
    स्वान्तज प्रोद्बोधादनु सम्भ्रमादनु रतारम्भादनु प्रीतयोः । अन्यार्थं गतयोर्भ्रमान्मिलितयोः सम्भाषणैर्जानतो
    र्दम्पत्योरिह को न को न तमसि व्रीडाविमिश्रो रसः ॥ ॥ सभयचकितं विन्यस्यन्तीं दृशौ तिमिरे पथि प्रतितरु
    मुहुः स्थित्वा मन्दं पदानि वितन्वतीम् । कथमपि रहः प्राप्तामङ्गैरनङ्गतरङ्गिभिः सुमुखि सुभगः पश्यन्स
    त्वामुपैतु कृतार्थताम् ॥ ॥ राधामुग्धमुखारविन्दमधुपस्त्रैलोक्यमौलिस्थली नेपथ्योचितनीलरत्नमवनीभारावतारान्तकः।
    स्वच्छन्दं व्रजसुब्दरीजनमनस्तोषप्रदोषोदयः कंसध्वंसनधूमकेतुरवतु त्वां देवकीनन्दनः॥ ॥ ॥ इति श्रीगीतगोविन्देऽभिसारिकवर्णने
    साकाङ्क्षपुण्डरीकाक्षो नाम पञ्चमः सर्गः ॥
