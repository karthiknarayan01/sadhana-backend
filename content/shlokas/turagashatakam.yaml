id: turagashatakam
category: shataka
name:
  english: turagashatakam
  devanagari: तुरगशतकम्
content:
  english: prenkhattigmakhuragravishtadharanipamsucchatabandhure | drishyante gaganangane'dya parito nakshatrataragrahah
    pratyagrapravikirnataddhanayashobijapraroha iva || 28|| haranagarucileshasteyamadhaya so'yam bhuvanamakhilamuccairbhasayan
    bhramyativa | turagakhurajadhulipalirabhyujjihite grasitumiva sarosham mandalam candamanoh || 29||
    alokyate turagarenukadambalakshya trailokyamapyabhivigahya vijrimbhamana | padatrayimitajagattrayamatmanatham
    prayo'nukartumabhilashavativa prithvi || 30|| sandrishyate turagavahanasadarasya rangeshitusturagajrimbhitadhulipalih
    | sevajusham bhagavato dayayadhirodhum sopanapaddhatiriva tridivasya baddha || 31|| dhatishu rangadhipaterdharitri
    rajasvalabhunmalinambara ca | manye tatah pamsukadambadambhanmandakinim snatumabhiprayati || 32||
    turagakhuravidhutadhulipali nibidatara divi ranganayakasya | ravikirananivaranaya prithvya vidhritamivopari
    vikshyate vitanam || 33|| nirmaturjagatam caracaragurordevasya sargakrame padbhyam bhumirabhuditi
    shrutiriyam yuktarthamaha dhruvam | rangeshasya turangadhulimishatah samvyaptalokatrayi shaktim kamapi
    yena karanagunadhinam vyanakti kshitih || 34|| lokasecanakakriterbhagavato vithishu vithishu ca kridatpraudhaturangacankramakalacaturyamalokitum
    | ayate dyusadam gane dhutarajovyuhau vidhindrau param hamsairavanapakshakarnapavanaih kricchrad gatau
    sannidhim || 35|| kailasacalatungasha
  devanagari: प्रेङ्खत्तिग्मखुराग्रविष्टधरणीपांसुच्छटाबन्धुरे । दृश्यन्ते गगनाङ्गणेऽद्य परितो नक्षत्रताराग्रहाः
    प्रत्यग्रप्रविकीर्णतद्धनयशोबीजप्ररोहा इव ॥ २८॥ हरनगरुचिलेशस्तेयमाधाय सोऽयं भुवनमखिलमुच्चैर्भासयन्
    भ्राम्यतीव । तुरगखुरजधूलीपालिरभ्युज्जिहीते ग्रसितुमिव सरोषं मण्डलं चण्डमानोः ॥ २९॥ आलोक्यते तुरगरेणुकदम्बलक्ष्या
    त्रैलोक्यमप्यभिविगाह्य विजृम्भमाणा । पादत्रयीमितजगत्त्रयमात्मनाथं प्रायोऽनुकर्तुमभिलाषवतीव पृथ्वी
    ॥ ३०॥ सन्दृश्यते तुरगवाहनसादरस्य रङ्गेशितुस्तुरगजृम्भितधूलिपालिः । सेवाजुषां भगवतो दययाधिरोढुं सोपानपद्धतिरिव
    त्रिदिवस्य बद्धा ॥ ३१॥ धाटीषु रङ्गाधिपतेर्धरित्री रजस्वलाभून्मलिनाम्बरा च । मन्ये ततः पांसुकदम्बदम्भान्मन्दाकिनीं
    स्नातुमभिप्रयाति ॥ ३२॥ तुरगखुरविधूतधूलिपाली निबिडतरा दिवि रङ्गनायकस्य । रविकिरणनिवारणाय पृथ्व्या विधृतमिवोपरि
    वीक्ष्यते वितानम् ॥ ३३॥ निर्मातुर्जगतां चराचरगुरोर्देवस्य सर्गक्रमे पद्भ्यां भूमिरभूदिति श्रुतिरियं
    युक्तार्थमाह ध्रुवम् । रङ्गेशस्य तुरङ्गधूलिमिषतः संव्याप्तलोकत्रयी शक्तिं कामपि येन कारणगुणाधीनां
    व्यनक्ति क्षितिः ॥ ३४॥ लोकासेचनकाकृतेर्भगवतो वीथीषु वीथीषु च क्रीडत्प्रौढतुरङ्गचङ्क्रमकलाचातुर्यमालोकितुम्
    । आयाते द्युसदां गणे धुतरजोव्यूहौ विधीन्द्रौ परं हंसैरावणपक्षकर्णपवनैः कृच्छ्राद् गतौ सन्निधिम् ॥
    ३५॥ कैलासाचलतुङ्गश
