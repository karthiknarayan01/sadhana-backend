id: chanakya-neethi-chapter-3
category: stotram
name:
  english: Chanakya Neethi - Chapter 3
content:
  english: kasya doshah kule nasti vyadhina ko na piditah | vyasanam kena na praptam kasya saukhyam nirantaram
    || || acarah kulamakhyati deshamakhyati bhashanam | sambhramah snehamakhyati vapurakhyati bhojanam
    || || sukule yojayetkanyam putram vidyasu yojayet | vyasane yojayecchatrum mitram dharmena yojayet
    || || durjanasya ca sarpasya varam sarpo na durjanah | sarpo damshati kale tu durjanastu pade pade
    || || etadarthe kulinanam nripah kurvanti sangraham | adimadhyavasaneshu na te gacchanti vikriyam
    || || pralaye bhinnamaryada bhavanti kila sagarah | sagara bhedamicchanti pralaye'pi na sadhavah ||
    || murkhastu prahartavyah pratyaksho dvipadah pashuh | bhidyate vakya shalyena adrisham kantakam yatha
    || || rupayauvanasampanna vishalakulasambhavah | vidyahina na shobhante nirgandhah kimshuka yatha
    || || kokilanam svaro rupam strinam rupam pativratam | vidya rupam kurupanam kshama rupam tapasvinam
    || || tyajedekam kulasyarthe gramasyarthe kulam tyajet | gramam janapadasyarthe atmarthe prithivim
    tyajet || || udyoge nasti daridryam japato nasti patakam | maunena kalaho nasti nasti jagarite bhayam
    || || atirupena va sita atigarvena ravanah | atidanadbalirbaddho hyatisarvatra varjayet || || ko hi
    bharah samarthanam kim duram vyavasayinam | ko videshah suvidyanam kah parah priyavadinam || || ekenapi
    suvrikshena pushpitena sugandhina | vasitam tadvanam sarvam suputrena kulam yatha || || ekena shushkavrikshena
    dahyamanena vahnina | dahyate tadvanam sarvam kuputrena kulam yatha || || ekenapi suputrena vidyayuktena
    sadhuna | ahladitam kulam sarvam yatha candrena sharvari || || kim jatairbahubhih putraih shokasantapakarakaih
    | varamekah kulalambi yatra vishramyate kulam || || lalayetpancavarshani dashavarshani tadayet | prapte
    tu shodashe varshe putre mitravadacaret || || upasarge'nyacakre ca durbhikshe ca bhayavahe | asadhujanasamparke
    yah palayetsa jivati || || dharmarthakamamokshanam yasyaiko'pi na vidyate | ajagalastanasyeva tasya
    janma nirarthakam || || murkha yatra na pujyante dhanyam yatra susancitam | dampatye kalaho nasti
    tatra shrih svayamagata ||
  devanagari: कस्य दोषः कुले नास्ति व्याधिना को न पीडितः । व्यसनं केन न प्राप्तं कस्य सौख्यं निरन्तरम्
    ॥ ॥ आचारः कुलमाख्याति देशमाख्याति भाषणम् । सम्भ्रमः स्नेहमाख्याति वपुराख्याति भोजनम् ॥ ॥ सुकुले योजयेत्कन्यां
    पुत्रं विद्यासु योजयेत् । व्यसने योजयेच्छत्रुं मित्रं धर्मेण योजयेत् ॥ ॥ दुर्जनस्य च सर्पस्य वरं सर्पो
    न दुर्जनः । सर्पो दंशति काले तु दुर्जनस्तु पदे पदे ॥ ॥ एतदर्थे कुलीनानां नृपाः कुर्वन्ति सङ्ग्रहम्
    । आदिमध्यावसानेषु न ते गच्छन्ति विक्रियाम् ॥ ॥ प्रलये भिन्नमर्यादा भवन्ति किल सागराः । सागरा भेदमिच्छन्ति
    प्रलयेऽपि न साधवः ॥ ॥ मूर्खस्तु प्रहर्तव्यः प्रत्यक्षो द्विपदः पशुः । भिद्यते वाक्य शल्येन अदृशं कण्टकं
    यथा ॥ ॥ रूपयौवनसम्पन्ना विशालकुलसम्भवाः । विद्याहीना न शोभन्ते निर्गन्धाः किंशुका यथा ॥ ॥ कोकिलानां
    स्वरो रूपं स्त्रीणां रूपं पतिव्रतम् । विद्या रूपं कुरूपाणां क्षमा रूपं तपस्विनाम् ॥ ॥ त्यजेदेकं कुलस्यार्थे
    ग्रामस्यार्थे कुलं त्यजेत् । ग्रामं जनपदस्यार्थे आत्मार्थे पृथिवीं त्यजेत् ॥ ॥ उद्योगे नास्ति दारिद्र्यं
    जपतो नास्ति पातकम् । मौनेन कलहो नास्ति नास्ति जागरिते भयम् ॥ ॥ अतिरूपेण वा सीता अतिगर्वेण रावणः ।
    अतिदानाद्बलिर्बद्धो ह्यतिसर्वत्र वर्जयेत् ॥ ॥ को हि भारः समर्थानां किं दूरं व्यवसायिनाम् । को विदेशः
    सुविद्यानां कः परः प्रियवादिनाम् ॥ ॥ एकेनापि सुवृक्षेण पुष्पितेन सुगन्धिना । वासितं तद्वनं सर्वं सुपुत्रेण
    कुलं यथा ॥ ॥ एकेन शुष्कवृक्षेण दह्यमानेन वह्निना । दह्यते तद्वनं सर्वं कुपुत्रेण कुलं यथा ॥ ॥ एकेनापि
    सुपुत्रेण विद्यायुक्तेन साधुना । आह्लादितं कुलं सर्वं यथा चन्द्रेण शर्वरी ॥ ॥ किं जातैर्बहुभिः पुत्रैः
    शोकसन्तापकारकैः । वरमेकः कुलालम्बी यत्र विश्राम्यते कुलम् ॥ ॥ लालयेत्पञ्चवर्षाणि दशवर्षाणि ताडयेत्
    । प्राप्ते तु षोडशे वर्षे पुत्रे मित्रवदाचरेत् ॥ ॥ उपसर्गेऽन्यचक्रे च दुर्भिक्षे च भयावहे । असाधुजनसम्पर्के
    यः पलायेत्स जीवति ॥ ॥ धर्मार्थकाममोक्षाणां यस्यैकोऽपि न विद्यते । अजागलस्तनस्येव तस्य जन्म निरर्थकम्
    ॥ ॥ मूर्खा यत्र न पूज्यन्ते धान्यं यत्र सुसञ्चितम् । दाम्पत्ये कलहो नास्ति तत्र श्रीः स्वयमागता ॥
