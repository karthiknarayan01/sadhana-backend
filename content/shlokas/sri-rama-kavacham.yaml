id: sri-rama-kavacham
category: stotram
name:
  english: Sri Rama Kavacham
content:
  english: agastiruvaca ajanubahumaravindadalayataksha majanmashuddharasahasamukhaprasadam | shyamam grihita
    sharacapamudararupam ramam saramamabhiramamanusmarami || || asya shriramakavacasya agastya rishih
    anushtup chandah sitalakshmanopetah shriramacandro devata shriramacandraprasadasiddhyarthe jape viniyogah
    | atha dhyanam nilajimutasankasham vidyudvarnambaravritam | komalangam vishalaksham yuvanamatisundaram
    || || sitasaumitrisahitam jatamukutadharinam | sasitunadhanurbanapanim danavamardanam || || yada corabhaye
    rajabhaye shatrubhaye tatha | dhyatva raghupatim kruddham kalanalasamaprabham || || cirakrishnajinadharam
    bhasmoddhulitavigraham | akarnakrishtavishikhakodandabhujamanditam || || rane ripun ravanadimstikshnamarganavrishtibhih
    | samharantam mahaviramugramaindrarathasthitam || || lakshmanadyairmahavirairvritam hanumadadibhih
    | sugrivadyairmahaviraih shailavrikshakarodyataih || || vegatkaralahunkarairbhubhukkaramaharavaih
    | nadadbhih parivadadbhih samare ravanam prati || || shrirama shatrusanghanme hana mardaya khadaya
    | bhutapretapishacadin shriramashu vinashaya || || evam dhyatva japedramakavacam siddhidayakam | sutikshna
    vajrakavacam shrinu vakshyamyanuttamam || || atha kavacam shriramah patu me murdhni purve ca raghuvamshajah
    | dakshine me raghuvarah pashcime patu pavanah || || uttare me raghupatirbhalam dasharathatmajah |
    bhruvordurvadalashyamastayormadhye janardanah || || shrotram me patu rajendro drishau rajivalocanah
    | ghranam me patu rajarshirgandau me janakipatih || || karnamule kharadhvamsi bhalam me raghuvallabhah
    | jihvam me vakpatih patu dantapankti raghuttamah || || oshthau shriramacandro me mukham patu paratparah
    | kantham patu jagadvandyah skandhau me ravanantakah || || dhanurbanadharah patu bhujau me valimardanah
    | sarvanyanguliparvani hastau me rakshasantakah || || vaksho me patu kakutsthah patu me hridayam harih
    | stanau sitapatih patu parshvam me jagadishvarah || || madhyam me patu lakshmisho nabhim me raghunayakah
    | kausalyeyah kati patu prishtham durgatinashanah || || guhyam patu hrishikeshah sakthini satyavikramah
    | uru sharngadharah patu januni hanumatpriyah || || janghe patu jagadvyapi padau me tatakantakah |
    sarvangam patu me vishnuh sarvasandhinanamayah || || jnanendriyani pranadin patu me madhusudanah |
    patu shriramabhadro me shabdadinvishayanapi || || dvipadadini bhutani matsambandhini yani ca | jamadagnyamahadarpadalanah
    patu tani me || || saumitripurvajah patu vagadinindriyani ca | romankuranyasheshani patu sugrivarajyadah
    || || vanmanobuddhyahankarairjnanajnanakritani ca | janmantarakritaniha papani vividhani ca || ||
    tani sarvani dagdhvashu harakodandakhandanah | patu mam sarvato ramah sharngabanadharah sada || ||
    iti shriramacandrasya kavacam vajrasammitam | guhyadguhyatamam divyam sutikshna munisattama || ||
    yah pathecchrinuyadvapi shravayedva samahitah | sa yati paramam sthanam ramacandraprasadatah || ||
    mahapatakayukto va goghno va bhrunaha tatha | shriramacandrakavacapathanacchuddhimapnuyat || || brahmahatyadibhih
    papairmucyate natra samshayah | bho sutikshna yatha prishtam tvaya mama purah shubham | tatha shriramakavacam
    maya te viniveditam || || iti shrimadanandaramayane manoharakande sutikshnagastyasamvade shriramakavacam
    ||
  devanagari: अगस्तिरुवाच आजानुबाहुमरविन्ददलायताक्ष माजन्मशुद्धरसहासमुखप्रसादम् । श्यामं गृहीत शरचापमुदाररूपं
    रामं सराममभिराममनुस्मरामि ॥ ॥ अस्य श्रीरामकवचस्य अगस्त्य ऋषिः अनुष्टुप् छन्दः सीतालक्ष्मणोपेतः श्रीरामचन्द्रो
    देवता श्रीरामचन्द्रप्रसादसिद्ध्यर्थे जपे विनियोगः । अथ ध्यानं नीलजीमूतसङ्काशं विद्युद्वर्णाम्बरावृतम्
    । कोमलाङ्गं विशालाक्षं युवानमतिसुन्दरम् ॥ ॥ सीतासौमित्रिसहितं जटामुकुटधारिणम् । सासितूणधनुर्बाणपाणिं
    दानवमर्दनम् ॥ ॥ यदा चोरभये राजभये शत्रुभये तथा । ध्यात्वा रघुपतिं क्रुद्धं कालानलसमप्रभम् ॥ ॥ चीरकृष्णाजिनधरं
    भस्मोद्धूलितविग्रहम् । आकर्णाकृष्टविशिखकोदण्डभुजमण्डितम् ॥ ॥ रणे रिपून् रावणादींस्तीक्ष्णमार्गणवृष्टिभिः
    । संहरन्तं महावीरमुग्रमैन्द्ररथस्थितम् ॥ ॥ लक्ष्मणाद्यैर्महावीरैर्वृतं हनुमदादिभिः । सुग्रीवाद्यैर्माहावीरैः
    शैलवृक्षकरोद्यतैः ॥ ॥ वेगात्करालहुङ्कारैर्भुभुक्कारमहारवैः । नदद्भिः परिवादद्भिः समरे रावणं प्रति
    ॥ ॥ श्रीराम शत्रुसङ्घान्मे हन मर्दय खादय । भूतप्रेतपिशाचादीन् श्रीरामाशु विनाशय ॥ ॥ एवं ध्यात्वा जपेद्रामकवचं
    सिद्धिदायकम् । सुतीक्ष्ण वज्रकवचं शृणु वक्ष्याम्यनुत्तमम् ॥ ॥ अथ कवचम् श्रीरामः पातु मे मूर्ध्नि पूर्वे
    च रघुवंशजः । दक्षिणे मे रघुवरः पश्चिमे पातु पावनः ॥ ॥ उत्तरे मे रघुपतिर्भालं दशरथात्मजः । भ्रुवोर्दूर्वादलश्यामस्तयोर्मध्ये
    जनार्दनः ॥ ॥ श्रोत्रं मे पातु राजेन्द्रो दृशौ राजीवलोचनः । घ्राणं मे पातु राजर्षिर्गण्डौ मे जानकीपतिः
    ॥ ॥ कर्णमूले खरध्वंसी भालं मे रघुवल्लभः । जिह्वां मे वाक्पतिः पातु दन्तपङ्क्ती रघूत्तमः ॥ ॥ ओष्ठौ
    श्रीरामचन्द्रो मे मुखं पातु परात्परः । कण्ठं पातु जगद्वन्द्यः स्कन्धौ मे रावणान्तकः ॥ ॥ धनुर्बाणधरः
    पातु भुजौ मे वालिमर्दनः । सर्वाण्यङ्गुलिपर्वाणि हस्तौ मे राक्षसान्तकः ॥ ॥ वक्षो मे पातु काकुत्स्थः
    पातु मे हृदयं हरिः । स्तनौ सीतापतिः पातु पार्श्वं मे जगदीश्वरः ॥ ॥ मध्यं मे पातु लक्ष्मीशो नाभिं मे
    रघुनायकः । कौसल्येयः कटी पातु पृष्ठं दुर्गतिनाशनः ॥ ॥ गुह्यं पातु हृषीकेशः सक्थिनी सत्यविक्रमः । ऊरू
    शार्ङ्गधरः पातु जानुनी हनुमत्प्रियः ॥ ॥ जङ्घे पातु जगद्व्यापी पादौ मे ताटकान्तकः । सर्वाङ्गं पातु
    मे विष्णुः सर्वसन्धीननामयः ॥ ॥ ज्ञानेन्द्रियाणि प्राणादीन् पातु मे मधुसूदनः । पातु श्रीरामभद्रो मे
    शब्दादीन्विषयानपि ॥ ॥ द्विपदादीनि भूतानि मत्सम्बन्धीनि यानि च । जामदग्न्यमहादर्पदलनः पातु तानि मे
    ॥ ॥ सौमित्रिपूर्वजः पातु वागादीनीन्द्रियाणि च । रोमाङ्कुराण्यशेषाणि पातु सुग्रीवराज्यदः ॥ ॥ वाङ्मनोबुद्ध्यहङ्कारैर्ज्ञानाज्ञानकृतानि
    च । जन्मान्तरकृतानीह पापानि विविधानि च ॥ ॥ तानि सर्वाणि दग्ध्वाशु हरकोदण्डखण्डनः । पातु मां सर्वतो
    रामः शार्ङ्गबाणधरः सदा ॥ ॥ इति श्रीरामचन्द्रस्य कवचं वज्रसम्मितम् । गुह्याद्गुह्यतमं दिव्यं सुतीक्ष्ण
    मुनिसत्तम ॥ ॥ यः पठेच्छृणुयाद्वापि श्रावयेद्वा समाहितः । स याति परमं स्थानं रामचन्द्रप्रसादतः ॥ ॥
    महापातकयुक्तो वा गोघ्नो वा भ्रूणहा तथा । श्रीरामचन्द्रकवचपठनाच्छुद्धिमाप्नुयात् ॥ ॥ ब्रह्महत्यादिभिः
    पापैर्मुच्यते नात्र संशयः । भो सुतीक्ष्ण यथा पृष्टं त्वया मम पुराः शुभम् । तथा श्रीरामकवचं मया ते
    विनिवेदितम् ॥ ॥ इति श्रीमदानन्दरामायणे मनोहरकाण्डे सुतीक्ष्णागस्त्यसंवादे श्रीरामकवचम् ॥
