id: annamayya-keerthanas-srimannaaraayana
category: stotram
name:
  english: Annamayya Keerthanas Srimannaaraayana
content:
  english: adi pallavi shrimannarayana shrimannarayana | shrimannarayana ni shripadame sharanu || caranam
    kamalasati mukhakamala kamalahita | kamalapriya kamalekshana | kamalasanahita garudagamana shri |
    kamalanabha nipadakamalame sharanu || shrimannarayana shrimannarayana paramayogijana bhagadheya shri
    | paramapurusha paratpara paramatma paramanurupa shri | tiruvenkatagiri deva sharanu || shrimannarayana
    shrimannarayana | shrimannarayana ni shripadame sharanu ||
  devanagari: आदि पल्लवि श्रीमन्नारायण श्रीमन्नारायण । श्रीमन्नारायण नी श्रीपादमे शरणु ॥ चरणं कमलासती
    मुखकमल कमलहित । कमलप्रिय कमलेक्षण । कमलासनहित गरुडगमन श्री । कमलनाभ नीपदकमलमे शरणु ॥ श्रीमन्नारायण
    श्रीमन्नारायण परमयोगिजन भागधेय श्री । परमपूरुष परात्पर परमात्म परमाणुरूप श्री । तिरुवेङ्कटगिरि देव
    शरणु ॥ श्रीमन्नारायण श्रीमन्नारायण । श्रीमन्नारायण नी श्रीपादमे शरणु ॥
