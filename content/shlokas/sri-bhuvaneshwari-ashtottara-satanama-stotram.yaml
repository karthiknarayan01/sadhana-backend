id: sri-bhuvaneshwari-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Bhuvaneshwari Ashtottara Satanama Stotram
content:
  english: kailasashikhare ramye nanaratnopashobhite | naranarihitarthaya shivam papraccha parvati ||
    || devyuvaca bhuvaneshi mahavidya namnamashtottaram shatam | kathayasva mahadeva yadyaham tava vallabha
    || || ishvara uvaca shrinu devi mahabhage stavarajamidam shubham | sahasranamnamadhikam siddhidam
    mokshahetukam || || shucibhih pratarutthaya pathitavyah samahitaih | trikalam shraddhaya yuktaih sarvakamaphalapradah
    || || asya shribhuvaneshvaryashtottarashatanama stotramantrasya shaktirrishih gayatri chandah shribhuvaneshvari
    devata caturvidhaphala purushartha siddhyarthe jape viniyogah || atha stotram om mahamaya mahavidya
    mahayoga mahotkata | maheshvari kumari ca brahmani brahmarupini || || vagishvari yogarupa yoginikotisevita
    | jaya ca vijaya caiva kaumari sarvamangala || || hingula ca vilasi ca jvalini jvalarupini | ishvari
    krurasamhari kulamargapradayini || || vaishnavi subhagakara sukulya kulapujita | vamanga vamacara
    ca vamadevapriya tatha || || dakini yoginirupa bhuteshi bhutanayika | padmavati padmanetra prabuddha
    ca sarasvati || || bhucari khecari maya matangi bhuvaneshvari | kanta pativrata sakshi sucakshuh kundavasini
    || || uma kumari lokeshi sukeshi padmaragini | indrani brahmacandali candika vayuvallabha || || sarvadhatumayimurtirjalarupa
    jalodari | akashi ranaga caiva nrikapalavibhushana || || narmada mokshada caiva dharmakamarthadayini
    | gayatri ca'tha savitri trisandhya tirthagamini || || ashtami navami caiva dashamyaikadashi tatha
    | paurnamasi kuhurupa tithimurtisvarupini || || surarinashakari ca ugrarupa ca vatsala | anala ardhamatra
    ca aruna pitalocana || || lajja sarasvati vidya bhavani papanashini | nagapashadhara murtiragadha
    dhritakundala || || kshatrarupa kshayakari tejasvini shucismita | avyaktavyaktaloka ca shambhurupa
    manasvini || || matangi mattamatangi mahadevapriya sada | daityaghni caiva varahi sarvashastramayi
    shubha || || ya idam pathate bhaktya shrinuyadva samahitah | aputro labhate putram nirdhano dhanavan
    bhavet || || murkho'pi labhate shastram coro'pi labhate gatim | vedanam pathako viprah kshatriyo vijayi
    bhavet || || vaishyastu dhanavan bhuyacchudrastu sukhamedhate | ashtamyam ca caturdashyam navamyam
    caikacetasah || || ye pathanti sada bhaktya na te vai duhkhabhaginah | ekakalam dvikalam va trikalam
    va caturthakam || || ye pathanti sada bhaktya svargaloke ca pujitah | rudram drishtva yatha devah
    pannaga garudam yatha | shatravah prapalayante tasya vaktravilokanat || || iti shrirudrayamale devishvarasamvade
    shri bhuvaneshvaryashtottarashatanama stotram |
  devanagari: कैलासशिखरे रम्ये नानारत्नोपशोभिते । नरनारीहितार्थाय शिवं पप्रच्छ पार्वती ॥ ॥ देव्युवाच भुवनेशी
    महाविद्या नाम्नामष्टोत्तरं शतम् । कथयस्व महादेव यद्यहं तव वल्लभा ॥ ॥ ईश्वर उवाच शृणु देवि महाभागे
    स्तवराजमिदं शुभम् । सहस्रनाम्नामधिकं सिद्धिदं मोक्षहेतुकम् ॥ ॥ शुचिभिः प्रातरुत्थाय पठितव्यः समाहितैः
    । त्रिकालं श्रद्धया युक्तैः सर्वकामफलप्रदः ॥ ॥ अस्य श्रीभुवनेश्वर्यष्टोत्तरशतनाम स्तोत्रमन्त्रस्य
    शक्तिरृषिः गायत्री छन्दः श्रीभुवनेश्वरी देवता चतुर्विधफल पुरुषार्थ सिद्ध्यर्थे जपे विनियोगः ॥ अथ स्तोत्रम्
    ॐ महामाया महाविद्या महायोगा महोत्कटा । माहेश्वरी कुमारी च ब्रह्माणी ब्रह्मरूपिणी ॥ ॥ वागीश्वरी योगरूपा
    योगिनीकोटिसेविता । जया च विजया चैव कौमारी सर्वमङ्गला ॥ ॥ हिङ्गुला च विलासी च ज्वालिनी ज्वालरूपिणी
    । ईश्वरी क्रूरसंहारी कुलमार्गप्रदायिनी ॥ ॥ वैष्णवी सुभगाकारा सुकुल्या कुलपूजिता । वामाङ्गा वामचारा
    च वामदेवप्रिया तथा ॥ ॥ डाकिनी योगिनीरूपा भूतेशी भूतनायिका । पद्मावती पद्मनेत्रा प्रबुद्धा च सरस्वती
    ॥ ॥ भूचरी खेचरी माया मातङ्गी भुवनेश्वरी । कान्ता पतिव्रता साक्षी सुचक्षुः कुण्डवासिनी ॥ ॥ उमा कुमारी
    लोकेशी सुकेशी पद्मरागिणी । इन्द्राणी ब्रह्मचण्डाली चण्डिका वायुवल्लभा ॥ ॥ सर्वधातुमयीमूर्तिर्जलरूपा
    जलोदरी । आकाशी रणगा चैव नृकपालविभूषणा ॥ ॥ नर्मदा मोक्षदा चैव धर्मकामार्थदायिनी । गायत्री चाऽथ सावित्री
    त्रिसन्ध्या तीर्थगामिनी ॥ ॥ अष्टमी नवमी चैव दशम्यैकादशी तथा । पौर्णमासी कुहूरूपा तिथिमूर्तिस्वरूपिणी
    ॥ ॥ सुरारिनाशकारी च उग्ररूपा च वत्सला । अनला अर्धमात्रा च अरुणा पीतलोचना ॥ ॥ लज्जा सरस्वती विद्या
    भवानी पापनाशिनी । नागपाशधरा मूर्तिरगाधा धृतकुण्डला ॥ ॥ क्षत्ररूपा क्षयकरी तेजस्विनी शुचिस्मिता । अव्यक्ताव्यक्तलोका
    च शम्भुरूपा मनस्विनी ॥ ॥ मातङ्गी मत्तमातङ्गी महादेवप्रिया सदा । दैत्यघ्नी चैव वाराही सर्वशास्त्रमयी
    शुभा ॥ ॥ य इदं पठते भक्त्या शृणुयाद्वा समाहितः । अपुत्रो लभते पुत्रं निर्धनो धनवान् भवेत् ॥ ॥ मूर्खोऽपि
    लभते शास्त्रं चोरोऽपि लभते गतिम् । वेदानां पाठको विप्रः क्षत्रियो विजयी भवेत् ॥ ॥ वैश्यस्तु धनवान्
    भूयाच्छूद्रस्तु सुखमेधते । अष्टम्यां च चतुर्दश्यां नवम्यां चैकचेतसः ॥ ॥ ये पठन्ति सदा भक्त्या न ते
    वै दुःखभागिनः । एककालं द्विकालं वा त्रिकालं वा चतुर्थकम् ॥ ॥ ये पठन्ति सदा भक्त्या स्वर्गलोके च पूजिताः
    । रुद्रं दृष्ट्वा यथा देवाः पन्नगा गरुडं यथा । शत्रवः प्रपलायन्ते तस्य वक्त्रविलोकनात् ॥ ॥ इति श्रीरुद्रयामले
    देवीश्वरसंवादे श्री भुवनेश्वर्यष्टोत्तरशतनाम स्तोत्रम् ।
