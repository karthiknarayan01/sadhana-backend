id: markandeyakritamnaranarayanastotram
category: stotram
name:
  english: markandeyakritamnaranarayanastotram
  devanagari: मार्कण्डेयकृतंनरनारायणस्तोत्रम्
content:
  english: markandeyakritam naranarayanastotram markandeya uvaca | kim varnaye tava vibho yadudirito'suh
    samspandate tamanu vanmana indriyani | spandanti vai tanubhritamajasharvayoshca svasyapyathapi bhajatamasi
    bhavabandhuh || 40|| murti ime bhagavato bhagavamstrilokyah kshemaya tapaviramaya ca mrityujityai
    | nanabibharshyavitumanyatanuryathedam srishtva punargrasasi sarvamivornanabhih || 41|| tasyavituh
    sthiracareshituranghrimulam yatstham na karmagunakalarajah sprishanti | yadvai stuvanti ninamanti
    yajantyabhikshnam dhyayanti vedahridaya munayastadaptyai || 42|| nanyam tavanghryupanayadapavargamurteh
    kshemam janasya parito bhiya isha vidmah | brahma bibhetyalamato dviparardhadhishnyah kalasya te kimuta
    tatkritabhautikanam || 43|| tadvai bhajamyritadhiyastava padamulam hitvedamatmacchadi catmaguroh parasya
    | dehadyaparthamasadantyamabhijnamatram vindeta te tarhi sarvamanishitartham || 44|| sattvam rajastama
    itisha tavatmabandho mayamayah sthitilayodayahetavo'sya | liladhrita yadapi sattvamayi prashantyai
    nanye nrinam vyasanamohabhiyashca yabhyam || 45|| tasmattaveha bhagavannatha tavakanam shuklam tanum
    svadayitam kushala bhajanti | yatsatvatah purusharupamushanti sattvam loko yatobhayamutatmasukham
    na canyat || 46|| tasmai namo bhagavate purushaya bhumne vishvaya vishvagurave paradaivatayai | narayanaya
    rishaye ca narottamaya hamsaya samyatagire nigameshvaraya || 47|| yam vai na veda vitathakshapathairbhramaddhih
    santam svakeshvasushu hridyapi drikpatheshu | tanmayaya''vritamatih sa u eva saksha
  devanagari: मार्कण्डेयकृतं नरनारायणस्तोत्रम् मार्कण्डेय उवाच । किं वर्णये तव विभो यदुदीरितोऽसुः संस्पन्दते
    तमनु वाङ्मन इन्द्रियाणि । स्पन्दन्ति वै तनुभृतामजशर्वयोश्च स्वस्याप्यथापि भजतामसि भावबन्धुः ॥ ४०॥
    मूर्ती इमे भगवतो भगवंस्त्रिलोक्याः क्षेमाय तापविरमाय च मृत्युजित्यै । नानाबिभर्ष्यवितुमन्यतनूर्यथेदं
    सृष्ट्वा पुनर्ग्रससि सर्वमिवोर्णनाभिः ॥ ४१॥ तस्यावितुः स्थिरचरेशितुरङ्घ्रिमूलं यत्स्थं न कर्मगुणकालरजः
    स्पृशन्ति । यद्वै स्तुवन्ति निनमन्ति यजन्त्यभीक्ष्णं ध्यायन्ति वेदहृदया मुनयस्तदाप्त्यै ॥ ४२॥ नान्यं
    तवाङ्घ्र्युपनयादपवर्गमूर्तेः क्षेमं जनस्य परितो भिय ईश विद्मः । ब्रह्मा बिभेत्यलमतो द्विपरार्धधिष्ण्यः
    कालस्य ते किमुत तत्कृतभौतिकानाम् ॥ ४३॥ तद्वै भजाम्यृतधियस्तव पादमूलं हित्वेदमात्मच्छदि चात्मगुरोः
    परस्य । देहाद्यपार्थमसदन्त्यमभिज्ञमात्रं विन्देत ते तर्हि सर्वमनीषितार्थम् ॥ ४४॥ सत्त्वं रजस्तम इतीश
    तवात्मबन्धो मायामयाः स्थितिलयोदयहेतवोऽस्य । लीलाधृता यदपि सत्त्वमयी प्रशान्त्यै नान्ये नृणां व्यसनमोहभियश्च
    याभ्याम् ॥ ४५॥ तस्मात्तवेह भगवन्नथ तावकानां शुक्लां तनुं स्वदयितां कुशला भजन्ति । यत्सात्वताः पुरुषरूपमुशन्ति
    सत्त्वं लोको यतोभयमुतात्मसुखं न चान्यत् ॥ ४६॥ तस्मै नमो भगवते पुरुषाय भूम्ने विश्वाय विश्वगुरवे परदैवतायै
    । नारायणाय ऋषये च नरोत्तमाय हंसाय संयतगिरे निगमेश्वराय ॥ ४७॥ यं वै न वेद वितथाक्षपथैर्भ्रमद्धीः सन्तं
    स्वकेष्वसुषु हृद्यपि दृक्पथेषु । तन्माययाऽऽवृतमतिः स उ एव साक्षा
