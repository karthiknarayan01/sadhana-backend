id: narasimha
category: stotram
name:
  english: narasimha
  devanagari: नरसिम्ह
content:
  english: narasimhastotra athava narasimhastutih udayaravi sahasradyotitam rukshaviksham praḻaya jaladhinadam
    kalpakridvahni vaktram | surapatiripu vakshashcheda raktokshitangam pranatabhayaharam tam narasimham
    namami || praḻayaravi karaḻakara rukcakravalam viraḻaya dururoci rocitashantarala | pratibhayatama
    kopattyutkatoccattahasin daha daha narasimhasahyaviryahitamme || 1|| sarasa rabhasapada patabharabhirava
    pracakitacala saptadvandva lokastutasttvam | ripurudhira nishekenaiva shonanghrishalin daha daha narasimhasahyaviryahitamme
    || 2|| tava ghanaghanaghosho ghoramaghraya jangha parigha malaghu muru vyajatejo girinca | ghanavighatatamagaddaitya
    janghalasangho daha daha narasimhasahyaviryahitamme || 3|| kataki katakarajaddhatta kagryasthalabha
    prakata pata tatitte satkatisthatipatvi | katuka katuka dushtatopa drishtipramushtau daha daha narasimhasahyaviryahitamme
    || 4|| prakhara nakhara vajrotkhata roksharivakshah shikhari shikhara raktyaraktasamdoha deha | suvalibha
    shubha kukshe bhadra gambhiranabhe daha daha narasimhasahyaviryahitamme || 5|| sphurayati tava sakshatsaiva
    nakshatramala kshapita ditija vaksho vyaptanakshatramargam | aridaradhara janvasakta hastadvayaho
    daha daha narasimhasahyaviryahitamme || 6|| katuvikata sataughodghattanadbhrashtabhuyo ghanapatala
    vishalakasha labdhavakasham | karaparigha vimarda prodyamam dhyayataste daha daha narasimhasahyaviryahitamme
    || 7|| hathalutha dala ghishtotkanthadashtoshtha vidyut satashatha kathinorah pithabhitsushthunishtham
    | pathatinutava kanthadhishtha ghorantramala daha daha narasimhasahyaviryahitamme || 8|| hrita bahumihi
    rabhasahyasamhararamho hutavaha bahuheti hrepikananta heti | ahita vihita moham samvahan saimhamasyam
    daha daha narasimhasahyaviryahitamme || 9|| gurugurugirirajatkandarantargateva dinamani manisha
  devanagari: नरसिंहस्तोत्र अथवा नरसिंहस्तुतिः उदयरवि सहस्रद्योतितं रूक्षवीक्षं प्रळय जलधिनादं कल्पकृद्वह्नि
    वक्त्रम् । सुरपतिरिपु वक्षश्छेद रक्तोक्षिताङ्गं प्रणतभयहरं तं नारसिंहं नमामि ॥ प्रळयरवि कराळाकार रुक्चक्रवालं
    विरळय दुरुरोची रोचिताशान्तराल । प्रतिभयतम कोपात्त्युत्कटोच्चाट्टहासिन् दह दह नरसिंहासह्यवीर्याहितंमे
    ॥ १॥ सरस रभसपादा पातभाराभिराव प्रचकितचल सप्तद्वन्द्व लोकस्तुतस्त्त्वम् । रिपुरुधिर निषेकेणैव शोणाङ्घ्रिशालिन्
    दह दह नरसिंहासह्यवीर्याहितंमे ॥ २॥ तव घनघनघोषो घोरमाघ्राय जङ्घा परिघ मलघु मूरु व्याजतेजो गिरिञ्च ।
    घनविघटतमागाद्दैत्य जङ्घालसङ्घो दह दह नरसिंहासह्यवीर्याहितंमे ॥ ३॥ कटकि कटकराजद्धाट्ट काग्र्यस्थलाभा
    प्रकट पट तटित्ते सत्कटिस्थातिपट्वी । कटुक कटुक दुष्टाटोप दृष्टिप्रमुष्टौ दह दह नरसिंहासह्यवीर्याहितंमे
    ॥ ४॥ प्रखर नखर वज्रोत्खात रोक्षारिवक्षः शिखरि शिखर रक्त्यराक्तसंदोह देह । सुवलिभ शुभ कुक्षे भद्र गम्भीरनाभे
    दह दह नरसिंहासह्यवीर्याहितंमे ॥ ५॥ स्फुरयति तव साक्षात्सैव नक्षत्रमाला क्षपित दितिज वक्षो व्याप्तनक्षत्रमार्गम्
    । अरिदरधर जान्वासक्त हस्तद्वयाहो दह दह नरसिंहासह्यवीर्याहितंमे ॥ ६॥ कटुविकट सटौघोद्घट्टनाद्भ्रष्टभूयो
    घनपटल विशालाकाश लब्धावकाशम् । करपरिघ विमर्द प्रोद्यमं ध्यायतस्ते दह दह नरसिंहासह्यवीर्याहितंमे ॥ ७॥
    हठलुठ दल घिष्टोत्कण्ठदष्टोष्ठ विद्युत् सटशठ कठिनोरः पीठभित्सुष्ठुनिष्ठाम् । पठतिनुतव कण्ठाधिष्ठ घोरान्त्रमाला
    दह दह नरसिंहासह्यवीर्याहितंमे ॥ ८॥ हृत बहुमिहि राभासह्यसंहाररंहो हुतवह बहुहेति ह्रेपिकानन्त हेति ।
    अहित विहित मोहं संवहन् सैंहमास्यं दह दह नरसिंहासह्यवीर्याहितंमे ॥ ९॥ गुरुगुरुगिरिराजत्कन्दरान्तर्गतेव
    दिनमणि मणिश
