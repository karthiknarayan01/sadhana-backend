id: maniratnamala
category: stotram
name:
  english: maniratnamala
  devanagari: मनिरत्नमल
content:
  english: strishnakshayah svargapadam kimasti || 2|| samsarahritkastu nijatmabodhah ko mokshahetuh prathitah
    sa eva | dvaram kimekam narakasya nari ka svargada pranabhritamahimsa || 3|| shete sukham kastu samadhinishtho
    jagarti ko va sadasadviveki | ke shatravah santi nijendriyani tanyeva mitrani jitani kani || 4|| ko
    va daridro hi vishalatrishnah shrimamshca ko yasya samastatoshah | jivanmrito kastu nirudyamo yah
    kova'mritah syatsukhada nirasha || 5|| pasho hi ko yo mamatabhidhanah sammohayatyeva sureva ka stri
    | ko va mahandho madanaturo yo mrityushca ko vapayashah svakiyam || 6|| ko va gururyo hi hitopadeshta
    shishyastu ko yo guru bhakta eva | ko dirgha rogo bhava eva sadho kimaushadhim tasya vicara eva ||
    7|| kim bhushanadbhushanamasti shilam tirtham param kim svamano vishuddham | kimatra heyam kanakam
    ca kanta shravyam sada kim guruvedavakyam || 8|| ke hetavo brahmagatestu santi satsangatirdanavicaratoshah
    |
  devanagari: स्तृष्णाक्षयः स्वर्गपदं किमस्ति ॥ २॥ संसारहृत्कस्तु निजात्मबोधः को मोक्षहेतुः प्रथितः स
    एव । द्वारं किमेकं नरकस्य नारी का स्वर्गदा प्राणभृतामहिंसा ॥ ३॥ शेते सुखं कस्तु समाधिनिष्ठो जागर्ति
    को वा सदसद्विवेकी । के शत्रवः सन्ति निजेन्द्रियाणि तान्येव मित्राणि जितानि कानि ॥ ४॥ को वा दरिद्रो
    हि विशालतृष्णः श्रीमांश्च को यस्य समस्ततोषः । जीवन्मृतो कस्तु निरुद्यमो यः कोवाऽमृतः स्यात्सुखदा निराशा
    ॥ ५॥ पाशो हि को यो ममताभिधानः संमोहयत्येव सुरेव का स्त्री । को वा महान्धो मदनातुरो यो मृत्युश्च को
    वापयशः स्वकीयम् ॥ ६॥ को वा गुरुर्यो हि हितोपदेष्टा शिष्यस्तु को यो गुरु भक्त एव । को दीर्घ रोगो भव
    एव साधो किमौषधिं तस्य विचार एव ॥ ७॥ किं भूषणाद्भूषणमस्ति शीलं तीर्थं परं किं स्वमनो विशुद्धम् । किमत्र
    हेयं कनकं च कान्ता श्राव्यं सदा किं गुरुवेदवाक्यम् ॥ ८॥ के हेतवो ब्रह्मगतेस्तु सन्ति सत्सङ्गतिर्दानविचारतोषाः
    ।
