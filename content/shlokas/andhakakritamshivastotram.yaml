id: andhakakritamshivastotram
category: stotram
name:
  english: andhakakritamshivastotram
  devanagari: अन्धककृतंशिवस्तोत्रम्
content:
  english: andhakakritam shivastotram andhaka uvaca | namami murdhna bhagavantamekam samahita yam vidurishatattvam
    | puratanam punyamanantarupam kalam kavim yogaviyogahetum || 1|| damshtrakaralam divi nrityamanam
    hutashavaktram jvalanarkarupam | sahasrapadakshishirobhiyuktam bhavantamekam pranamami rudram || 2||
    jayadidevamarapujitanghre vibhagahinamalatattvarupa | tvamagnireko bahudha'bhipujyo bahyadibhedairakhilatmarupah
    || 3|| tvamekamahuh purusham puranamadityavarnam tamasah parastat | tvam pashyasidam paripasyajasram
    tvamantako yogiganabhijushtah || 4|| eko'ntaratma bahudha nivishto deheshu dehadivisheshahinah | tvamatmatattvam
    paramatmashabdam bhavantamahuh shivameva kecit || 5|| tvamaksharam brahma param pavitramanandarupam
    pranavabhidhanam | tvamishvaro vedapadeshvasiddhah svayam prabho'sheshavisheshahinah || 6|| tvamindrarupo
    varunagnirupo hamsah prano mrityuranto'si yajnah | prajapatirbhagavanekarudro nilagrivah stuyase vedavidbhih
    || 7|| narayanastvam jagatamathadih pitamahastvam prapitamahashca | vedantaguhyopanishatsu gitah sadashivastvam
    parameshvaro'si || 8|| namah parasmai tamasah parastatparatmane pancapadantaraya | trishaktyatitaya
    niranjanaya sahasrashaktyasanasamsthitaya || 9|| trimurttaye'nantapadatmamurtte jagannivasaya jaganmayaya
    | namo lalatarpitalocanaya namo jananam hridi samsthitaya || 10|| munindrasiddharcitapadapadma aishvaryadharmasanasamsthitaya
    | namah parantaya bhavodbhavaya sahasracandrarkavilodanaya || 11|| namo'stu te soma sumadhyamaya namo'stu
    te deva hiranyabaho | namo'gnicandrarkavilocanaya namo'mbikayah pataye mridaya || 12|| namo'stu guhyaya
    guhantaraya vedantavijnanasunishcitaya | trikalahinamaladhamadhamne namo maheshaya namah shivaya ||
    13|| iti kurmapurane shodashadhyayantargatam andhakakritam shivastotram samaptam | kurmapurane purvabhage
    16
  devanagari: अन्धककृतं शिवस्तोत्रम् अन्धक उवाच । नमामि मूर्ध्ना भगवन्तमेकं समाहिता यं विदुरीशतत्त्वम्
    । पुरातनं पुण्यमनन्तरूपं कालं कविं योगवियोगहेतुम् ॥ १॥ दंष्ट्राकरालं दिवि नृत्यमानं हुताशवक्त्रं ज्वलनार्करूपम्
    । सहस्रपादाक्षिशिरोभियुक्तं भवन्तमेकं प्रणमामि रुद्रम् ॥ २॥ जयादिदेवामरपूजिताङ्घ्रे विभागहीनामलतत्त्वरूप
    । त्वमग्निरेको बहुधाऽभिपूज्यो बाह्यादिभेदैरखिलात्मरूपः ॥ ३॥ त्वामेकमाहुः पुरुषं पुराणमादित्यवर्णं
    तमसः परस्तात् । त्वं पश्यसीदं परिपास्यजस्रं त्वमन्तको योगिगणाभिजुष्टः ॥ ४॥ एकोऽन्तरात्मा बहुधा निविष्टो
    देहेषु देहादिविशेषहीनः । त्वमात्मतत्त्वं परमात्मशब्दं भवन्तमाहुः शिवमेव केचित् ॥ ५॥ त्वमक्षरं ब्रह्म
    परं पवित्रमानन्दरूपं प्रणवाभिधानम् । त्वमीश्वरो वेदपदेष्वसिद्धः स्वयं प्रभोऽशेषविशेषहीनः ॥ ६॥ त्वमिन्द्ररूपो
    वरुणाग्निरूपो हंसः प्राणो मृत्युरन्तोऽसि यज्ञः । प्रजापतिर्भगवानेकरुद्रो नीलग्रीवः स्तूयसे वेदविद्भिः
    ॥ ७॥ नारायणस्त्वं जगतामथादिः पितामहस्त्वं प्रपितामहश्च । वेदान्तगुह्योपनिषत्सु गीतः सदाशिवस्त्वं परमेश्वरोऽसि
    ॥ ८॥ नमः परस्मै तमसः परस्तात्परात्मने पञ्चपदान्तराय । त्रिशक्त्यतीताय निरञ्जनाय सहस्रशक्त्यासनसंस्थिताय
    ॥ ९॥ त्रिमूर्त्तयेऽनन्तपदात्ममूर्त्ते जगन्निवासाय जगन्मयाय । नमो ललाटार्पितलोचनाय नमो जनानां हृदि
    संस्थिताय ॥ १०॥ मुनीन्द्रसिद्धार्चितपादपद्म ऐश्वर्यधर्मासनसंस्थिताय । नमः परान्ताय भवोद्भवाय सहस्रचन्द्रार्कविलोडनाय
    ॥ ११॥ नमोऽस्तु ते सोम सुमध्यमाय नमोऽस्तु ते देव हिरण्यबाहो । नमोऽग्निचन्द्रार्कविलोचनाय नमोऽम्बिकायाः
    पतये मृडाय ॥ १२॥ नमोऽस्तु गुह्याय गुहान्तराय वेदान्तविज्ञानसुनिश्चिताय । त्रिकालहीनामलधामधाम्ने नमो
    महेशाय नमः शिवाय ॥ १३॥ इति कूर्मपुराणे षोडशाध्यायान्तर्गतं अन्धककृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे
    पूर्वभागे १६
