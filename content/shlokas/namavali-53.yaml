    ॐ प्रसन्नाय नमः । ॐ सर्वरूपाय नमः । १०८ ॥ ॥ इति शिवरहस्यव्युत्पन्नं ज्येष्ठमासकृते शिवशताष्टनामावलिः
    सम्पूर्णा ॥
