id: sri-hanuman-mangalashtakam
category: stotram
name:
  english: Sri Hanuman Mangalashtakam
content:
  english: vaishakhe masi krishnayam dashamyam mandavasare | purvabhadra prabhutaya mangalam shrihanumate
    || || karunarasapurnaya phalapupapriyaya ca | manikyaharakanthaya mangalam shrihanumate || || suvarcalakalatraya
    caturbhujadharaya ca | ushtrarudhaya viraya mangalam shrihanumate || || divyamangaladehaya pitambaradharaya
    ca | taptakancanavarnaya mangalam shrihanumate || || bhaktarakshanashilaya janakishokaharine | srishtikaranabhutaya
    mangalam shrihanumate || || rambhavanaviharaya gandhamadanavasine | sarvalokaikanathaya mangalam shrihanumate
    || || pancananaya bhimaya kalanemiharaya ca | kaundinyagotrajataya mangalam shrihanumate || || kesariputra
    divyaya sitanveshaparaya ca | vanaranam varishthaya mangalam shrihanumate || || iti shri hanuman mangalashtakam
    |
  devanagari: वैशाखे मासि कृष्णायां दशम्यां मन्दवासरे । पूर्वाभाद्रा प्रभूताय मङ्गलं श्रीहनूमते ॥ ॥ करुणारसपूर्णाय
    फलापूपप्रियाय च । माणिक्यहारकण्ठाय मङ्गलं श्रीहनूमते ॥ ॥ सुवर्चलाकलत्राय चतुर्भुजधराय च । उष्ट्रारूढाय
    वीराय मङ्गलं श्रीहनूमते ॥ ॥ दिव्यमङ्गलदेहाय पीताम्बरधराय च । तप्तकाञ्चनवर्णाय मङ्गलं श्रीहनूमते ॥
    ॥ भक्तरक्षणशीलाय जानकीशोकहारिणे । सृष्टिकारणभूताय मङ्गलं श्रीहनूमते ॥ ॥ रम्भावनविहाराय गन्धमादनवासिने
    । सर्वलोकैकनाथाय मङ्गलं श्रीहनूमते ॥ ॥ पञ्चाननाय भीमाय कालनेमिहराय च । कौण्डिन्यगोत्रजाताय मङ्गलं
    श्रीहनूमते ॥ ॥ केसरीपुत्र दिव्याय सीतान्वेषपराय च । वानराणां वरिष्ठाय मङ्गलं श्रीहनूमते ॥ ॥ इति श्री
    हनुमान् मङ्गलाष्टकम् ।
