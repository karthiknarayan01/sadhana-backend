    yanta ''si yamana urje tva vrishtyai tva prajanam tvadhipatyaya || || ayuryajnena kalpata mprano yajnena
    kalpatam cakshuryajnena kalpatagmshrotram yajnena kalpatam vagyajnena kalpatam mano yajnena kalpatamatma
