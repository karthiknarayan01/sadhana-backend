id: sri-lalitha-trishati-stotram
category: stotram
name:
  english: Sri Lalitha Trishati Stotram
content:
  english: asya shrilalita trishatistotra mahamantrasya shrilalitamahatripurasundari devata mama caturvidhapurusharthaphalasiddhyarthe
    jape viniyogah | aimityadibhiranganyasakaranyasah karyah | dhyanam | atimadhuracapahasta maparimitamodabanasaubhagyam
    | arunamatishayakaruna mabhinavakulasundarim vande | shri hayagriva uvaca | kakararupa kalyani kalyanagunashalini
    | kalyanashailanilaya kamaniya kalavati || || kamalakshi kalmashaghni karunamritasagara | kadambakananavasa
    kadambakusumapriya || || kandarpavidya kandarpajanakapangavikshana | karpuravitisaurabhyakallolitakakuptata
    || || kalidoshahara kanjalocana kamravigraha | karmadisakshini karayitri karmaphalaprada || || ekararupa
    caikaksharyekanekaksharakritih | etattadityanirdeshya caikanandacidakritih || || evamityagamabodhya
    caikabhaktimadarcita | ekagracittanirdhyata caishanarahitadrita || || elasugandhicikura cainahkutavinashini
    | ekabhoga caikarasa caikaishvaryapradayini || || ekatapatrasamrajyaprada caikantapujita | edhamanaprabha
    caijadanekajagadishvari || || ekaviradisamsevya caikaprabhavashalini | ikararupa ceshitri cepsitarthapradayini
    || || idrigityavinirdeshya ceshvaratvavidhayini | ishanadibrahmamayi ceshitvadyashtasiddhida || ||
    ikshitrikshanasrishtandakotirishvaravallabha | idita ceshvarardhangasharireshadhidevata || || ishvarapreranakari
    ceshatandavasakshini | ishvarotsanganilaya cetibadhavinashini || || ihavirahita ceshashaktirishatsmitanana
    | lakararupa lalita lakshmivaninishevita || || lakini lalanarupa lasaddadimapatala | lalantikalasatphala
    lalatanayanarcita || || lakshanojjvaladivyangi lakshakotyandanayika | lakshyartha lakshanagamya labdhakama
    latatanuh || || lalamarajadalika lambimuktalatancita | lambodaraprasurlabhya lajjadhya layavarjita
    || karacintya hrim hrim || hakararupa haladhrikpujita harinekshana | harapriya hararadhya haribrahmendravandita
    || || hayarudhasevitanghrirhayamedhasamarcita | haryakshavahana hamsavahana hatadanava || || hatyadipapashamani
    haridashvadisevita | hastikumbhottungakuca hastikrittipriyangana || || haridrakunkumadigdha haryashvadyamararcita
    | harikeshasakhi hadividya halamadalasa || || sakararupa sarvajna sarveshi sarvamangala | sarvakartri
    sarvabhartri sarvahantri sanatana || || sarvanavadya sarvangasundari sarvasakshini | sarvatmika sarvasaukhyadatri
    sarvavimohini || || sarvadhara sarvagata sarvavagunavarjita | sarvaruna sarvamata sarvabhushanabhushita
    || || kakarartha kalahantri kameshi kamitarthada | kamasanjivani kalya kathinastanamandala || || karabhoruh
    kalanathamukhi kacajitambuda | katakshasyandikaruna kapaliprananayika || || karunyavigraha kanta kantidhutajapavalih
    | kalalapa kambukanthi karanirjitapallava || || kalpavallisamabhuja kasturitilakancita | hakarartha
    hamsagatirhatakabharanojjvala || || haraharikucabhoga hakini halyavarjita | haritpatisamaradhya hathatkarahatasura
    || || harshaprada havirbhoktri hardasantamasapaha | hallisalasyasantushta hamsamantrartharupini ||
    || hanopadananirmukta harshini harisodari | hahahuhumukhastutya hanivriddhivivarjita || || hayyangavinahridaya
    harigoparunamshuka | lakarakhya latapujya layasthityudbhaveshvari || || lasyadarshanasantushta labhalabhavivarjita
    | langhyetarajna lavanyashalini laghusiddhida || || laksharasasavarnabha lakshmanagrajapujita | labhyetara
    labdhabhaktisulabha langalayudha || || lagnacamarahastashrisharadaparivijita | lajjapadasamaradhya
    lampata lakuleshvari || || labdhamana labdharasa labdhasampatsamunnatih | hrim karakundagnishikha
    hrim karashashicandrika | hrim karabhaskararucirhrim karakandankurika hrim karadirghikahamsi hrim
    karavalavallari | hrim karakandarasimhi hrim karambhojabhringika | hrim karasumanomadhvi hrim || sakarakhya
    samarasa sakalagamasamstuta | sarvavedantatatparyabhumih sadasadashraya || || sakala saccidananda
    sadhya sadgatidayini | sanakadimunidhyeya sadashivakutumbini || || sakaladhishthanarupa satyarupa
    samakritih | sarvaprapancanirmatri samanadhikavarjita || || sarvottunga sangahina saguna sakaleshtada
    | kakarini kavyalola kameshvaramanohara || || kameshvaraprananadi kameshotsangavasini | kameshvaralingitangi
    kameshvarasukhaprada || || kameshvarapranayini kameshvaravilasini | kameshvaratapahsiddhih kameshvaramanahpriya
    || || kameshvaraprananatha kameshvaravimohini | kameshvarabrahmavidya kameshvaragriheshvari || ||
    kameshvarahladakari kameshvaramaheshvari | kameshvari kamakotinilaya kankshitarthada || || lakarini
    labdharupa labdhadhirlabdhavanchita | labdhapapamanodura labdhahankaradurgama || || labdhashaktirlabdhadeha
    labdhaishvaryasamunnatih | labdhavriddhirlabdhalila labdhayauvanashalini || || labdhatishayasarvangasaundarya
    labdhavibhrama | labdharaga labdhapatirlabdhananagamasthitih || || labdhabhoga labdhasukha labdhaharshabhipurita
    | hrim karasaudhashringakapotika || karadugdhabdhisudha hrim karakamalendira | hrim karamanidiparcirhrim
    karadarshabimbita | hrim karashuktikamuktamanirhrim karamayasauvarnastambhavidrumaputrika || karadhvaradakshina
    | hrim karanandanaramanavakalpakavallari || karahimavadganga hrim kararnavakaustubha | hrim karamantrasarvasva
    hrim hayagriva uvaca | ityevam te mayakhyatam devya namashatatrayam | rahasyatirahasyatvadgopaniyam
    tvaya mune || || shivavarnani namani shridevya kathitani hi | shaktyaksharani namani kameshakathitani
    ca || || ubhayaksharanamani hyubhabhyam kathitani vai | tadanyairgrathitam stotrametasya sadrisham
    kimu || || nanena sadrisham stotram shridevipritidayakam | lokatraye'pi kalyanam sambhavennatra samshayah
    || || suta uvaca | iti hayamukhagitam stotrarajam nishamya pragalitakalusho'bhuccittaparyaptimetya
    | nijagurumatha natva kumbhajanma taduktam punaradhikarahasyam jnatumevam jagada || || agastya uvaca
    | ashvanana mahabhaga rahasyamapi me vada | shivavarnani kanyatra shaktivarnani kani hi || || ubhayorapi
    varnani kani va vada deshika | iti prishtah kumbhajena hayagrivo'vadatpunah || || hayagriva uvaca
    | tava gopyam kimastiha sakshadambanushasanat | idam tvatirahasyam te vakshyami shrinu kumbhaja ||
    || etadvijnanamatrena shrividya siddhida bhavet | katrayam hadvayam caiva shaivo bhagah prakirtitah
    || || shaktyaksharani sheshani hrinkara ubhayatmakah | evam vibhagamajnatva ye vidyajapashalinah ||
    || na tesham siddhida vidya kalpakotishatairapi | caturbhih shivacakraishca shakticakraishca pancabhih
    || || navacakraishca samsiddham shricakram shivayorvapuh | trikonamashtakonam ca dashakonadvayam tatha
    || || caturdasharam caitani shakticakrani panca ca | bindushcashtadalam padmam padmam shodashapatrakam
    || || caturashram ca catvari shivacakranyanukramat | trikone baindavam shlishtam ashtare'shtadalambujam
    || || dasharayoh shodasharam bhugriham bhuvanashrake | shaivanamapi shaktanam cakranam ca parasparam
    || || avinabhavasambandham yo janati sa cakravit | trikonarupini shaktirbindurupaparah shivah || ||
    avinabhavasambandham tasmadbindutrikonayoh | evam vibhagamajnatva shricakram yah samarcayet || ||
    na tatphalamavapnoti lalitamba na tushyati | ye ca jananti loke'smin shrividyacakravedinah || || samanyavedinah
    sarve visheshajno'tidurlabhah | svayamvidyavisheshajno visheshajnam samarcayet || || tasmai deyam
    tato grahyamashaktastasya dapayet | andham tamah pravishanti ye'vidyam samupasate || || iti shrutirapahaitanavidyopasakanpunah
    | vidyanyopasakaneva nindatyaruniki shrutih || || ashruta sashrutasashca yajvano ye'pyayajvanah |
    svaryanto napekshante indramagnim ca ye viduh || || sikata iva samyanti rashmibhih samudiritah | asmallokadamushmaccetyaha
    caranyakashrutih || || yasya no pashcimam janma yadi va shankarah svayam | tenaiva labhyate vidya
    shrimatpancadashakshari || || iti mantreshu bahudha vidyaya mahimocyate | mokshaikahetuvidya tu shrividya
    natra samshayah || || na shilpadijnanayukte vidvacchabdhah prayujyate | mokshaikahetuvidya sa shrividyaiva
    na samshayah || || tasmadvidyavidevatra vidvanvidvanitiryate | svayam vidyavide dadyatkhyapayettadgunansudhih
    || || svayamvidyarahasyajno vidyamahatmyavedyapi | vidyavidam narcayeccetko va tam pujayejjanah ||
    || prasangadidamuktam te prakritam shrinu kumbhaja | yah kirtayetsakridbhaktya divyanamashatatrayam
    || || tasya punyamaham vakshye shrinu tvam kumbhasambhava | rahasyanamasahasrapathe yatphalamiritam
    || || tatphalam kotigunitamekanamajapadbhavet | kameshvarikameshabhyam kritam namashatatrayam || ||
    nanyena tulayedetat stotrenanyakritena ca | shriyah parampara yasya bhavi va cottarottaram || || tenaiva
    labhyate caitatpashcacchreyah parikshayet | asya namnam trishatyastu mahima kena varnyate || || ya
    svayam shivayorvaktrapadmabhyam parinihsrita | nityam shodashasankhyakanvipranadau tu bhojayet ||
    || abhyaktamstilatailena snatanushnena varina | abhyarcya gandhapushpadyaih kameshvaryadinamabhih
    || || supapupaih sharkaradyaih payasaih phalasamyutaih | vidyavido visheshena bhojayetshodasha dvijan
    || || evam nityarcanam kuryadadau brahmanabhojanam | trishatinamabhih pashcadbrahmanankramasho'rcayet
    || || tailabhyangadikam datva vibhave sati bhaktitah | shuklapratipadarabhya paurnamasyavadhi kramat
    || || divase divase vipra bhojya vimshatisankhyaya | dashabhih pancabhirvapi tribhirekena va dinaih
    || || trimshatshashtih shatam viprah sambhojyastrishatam kramat | evam yah kurute bhaktya janmamadhye
    sakrinnarah || || tasyaiva saphalam janma muktistasya kare sthira | rahasyanamasahasrabhojane'pyevameva
    hi || || adau nityabalim kuryatpashcadbrahmanabhojanam | rahasyanamasahasramahima yo mayoditah ||
    || sa shikaranuratnaikanamno mahimavaridheh | vagdeviracite namasahasre yadyadiritam || || tatphalam
    kotigunitam namno'pyekasya kirtanat | etadanyairjapaih stotrairarcanairyatphalam bhavet || || tatphalam
    kotigunitam bhavennamashatatrayat | vagdeviracite stotre tadrisho mahima yadi || || sakshatkameshakameshikrite'smingrihyatamiti
    | sakritsankirtanadeva namnamasmin shatatraye || || bhaveccittasya paryaptirnyunamanyanapekshini |
    na jnatavyamito'pyanyatra japtavyam ca kumbhaja || || yadyatsadhyatamam karyam tattadarthamidam japet
    | tattatphalamavapnoti pashcatkaryam parikshayet || || ye ye prayogastantreshu taistairyatsadhyate
    phalam | tatsarvam sidhyati kshipram namatrishatakirtanat || || ayushkaram pushtikaram putradam vashyakarakam
    | vidyapradam kirtikaram sukavitvapradayakam || || sarvasampatpradam sarvabhogadam sarvasaukhyadam
    | sarvabhishtapradam caiva devya namashatatrayam || || etajjapaparo bhuyannanyadicchetkadacana | etatkirtanasantushta
    shridevi lalitambika || || bhaktasya yadyadishtam syattattatpurayate dhruvam | tasmatkumbhodbhava
    mune kirtaya tvamidam sada || || naparam kincidapi te boddhavyamavashishyate | iti te kathitam stotram
    lalitapritidayakam || || navidyavedine bruyannabhaktaya kadacana | na shathaya na dushtaya navishvasaya
    karhicit || || yo bruyattrishatim namnam tasyanartho mahanbhavet | ityajna shankari prokta tasmadgopyamidam
    tvaya || || lalitapreritenaiva mayoktam stotramuttamam | rahasyanamasahasradapi gopyamidam mune ||
    || suta uvaca | evamuktva hayagrivah kumbhajam tapasottamam | stotrenanena lalitam stutva tripurasundarim
    | anandalaharimagnamanasah samavartata || || iti brahmandapurane uttarakhande hayagrivagastyasamvade
    lalitopakhyane stotrakhande shrilalitatrishatistotraratnam |
  devanagari: अस्य श्रीललिता त्रिशतीस्तोत्र महामन्त्रस्य श्रीललितामहात्रिपुरसुन्दरी देवता मम चतुर्विधपुरुषार्थफलसिद्ध्यर्थे
    जपे विनियोगः । ऐमित्यादिभिरङ्गन्यासकरन्यासाः कार्याः । ध्यानम् । अतिमधुरचापहस्ता मपरिमितामोदबाणसौभाग्याम्
    । अरुणामतिशयकरुणा मभिनवकुलसुन्दरीं वन्दे । श्री हयग्रीव उवाच । ककाररूपा कल्याणी कल्याणगुणशालिनी ।
    कल्याणशैलनिलया कमनीया कलावती ॥ ॥ कमलाक्षी कल्मषघ्नी करुणामृतसागरा । कदम्बकाननावासा कदम्बकुसुमप्रिया
    ॥ ॥ कन्दर्पविद्या कन्दर्पजनकापाङ्गवीक्षणा । कर्पूरवीटिसौरभ्यकल्लोलितककुप्तटा ॥ ॥ कलिदोषहरा कञ्जलोचना
    कम्रविग्रहा । कर्मादिसाक्षिणी कारयित्री कर्मफलप्रदा ॥ ॥ एकाररूपा चैकाक्षर्येकानेकाक्षराकृतिः । एतत्तदित्यनिर्देश्या
    चैकानन्दचिदाकृतिः ॥ ॥ एवमित्यागमाबोध्या चैकभक्तिमदर्चिता । एकाग्रचित्तनिर्ध्याता चैषणारहितादृता ॥
    ॥ एलासुगन्धिचिकुरा चैनःकूटविनाशिनी । एकभोगा चैकरसा चैकैश्वर्यप्रदायिनी ॥ ॥ एकातपत्रसाम्राज्यप्रदा
    चैकान्तपूजिता । एधमानप्रभा चैजदनेकजगदीश्वरी ॥ ॥ एकवीरादिसंसेव्या चैकप्राभवशालिनी । ईकाररूपा चेशित्री
    चेप्सितार्थप्रदायिनी ॥ ॥ ईदृगित्यविनिर्देश्या चेश्वरत्वविधायिनी । ईशानादिब्रह्ममयी चेशित्वाद्यष्टसिद्धिदा
    ॥ ॥ ईक्षित्रीक्षणसृष्टाण्डकोटिरीश्वरवल्लभा । ईडिता चेश्वरार्धाङ्गशरीरेशाधिदेवता ॥ ॥ ईश्वरप्रेरणकरी
    चेशताण्डवसाक्षिणी । ईश्वरोत्सङ्गनिलया चेतिबाधाविनाशिनी ॥ ॥ ईहाविरहिता चेशशक्तिरीषत्स्मितानना । लकाररूपा
    ललिता लक्ष्मीवाणीनिषेविता ॥ ॥ लाकिनी ललनारूपा लसद्दाडिमपाटला । ललन्तिकालसत्फाला ललाटनयनार्चिता ॥ ॥
    लक्षणोज्ज्वलदिव्याङ्गी लक्षकोट्यण्डनायिका । लक्ष्यार्था लक्षणागम्या लब्धकामा लतातनुः ॥ ॥ ललामराजदलिका
    लम्बिमुक्तालताञ्चिता । लम्बोदरप्रसूर्लभ्या लज्जाढ्या लयवर्जिता ॥ कारचिन्त्या ह्रीं ह्रीं ॥ हकाररूपा
    हलधृक्पूजिता हरिणेक्षणा । हरप्रिया हराराध्या हरिब्रह्मेन्द्रवन्दिता ॥ ॥ हयारूढासेविताङ्घ्रिर्हयमेधसमर्चिता
    । हर्यक्षवाहना हंसवाहना हतदानवा ॥ ॥ हत्यादिपापशमनी हरिदश्वादिसेविता । हस्तिकुम्भोत्तुङ्गकुचा हस्तिकृत्तिप्रियाङ्गना
    ॥ ॥ हरिद्राकुङ्कुमादिग्धा हर्यश्वाद्यमरार्चिता । हरिकेशसखी हादिविद्या हालामदालसा ॥ ॥ सकाररूपा सर्वज्ञा
    सर्वेशी सर्वमङ्गला । सर्वकर्त्री सर्वभर्त्री सर्वहन्त्री सनातना ॥ ॥ सर्वानवद्या सर्वाङ्गसुन्दरी सर्वसाक्षिणी
    । सर्वात्मिका सर्वसौख्यदात्री सर्वविमोहिनी ॥ ॥ सर्वाधारा सर्वगता सर्वावगुणवर्जिता । सर्वारुणा सर्वमाता
    सर्वभूषणभूषिता ॥ ॥ ककारार्था कालहन्त्री कामेशी कामितार्थदा । कामसञ्जीवनी कल्या कठिनस्तनमण्डला ॥ ॥
    करभोरूः कलानाथमुखी कचजिताम्बुदा । कटाक्षस्यन्दिकरुणा कपालिप्राणनायिका ॥ ॥ कारुण्यविग्रहा कान्ता कान्तिधूतजपावलिः
    । कलालापा कम्बुकण्ठी करनिर्जितपल्लवा ॥ ॥ कल्पवल्लीसमभुजा कस्तूरीतिलकाञ्चिता । हकारार्था हंसगतिर्हाटकाभरणोज्ज्वला
    ॥ ॥ हारहारिकुचाभोगा हाकिनी हल्यवर्जिता । हरित्पतिसमाराध्या हठात्कारहतासुरा ॥ ॥ हर्षप्रदा हविर्भोक्त्री
    हार्दसन्तमसापहा । हल्लीसलास्यसन्तुष्टा हंसमन्त्रार्थरूपिणी ॥ ॥ हानोपादाननिर्मुक्ता हर्षिणी हरिसोदरी
    । हाहाहूहूमुखस्तुत्या हानिवृद्धिविवर्जिता ॥ ॥ हय्यङ्गवीनहृदया हरिगोपारुणांशुका । लकाराख्या लतापूज्या
    लयस्थित्युद्भवेश्वरी ॥ ॥ लास्यदर्शनसन्तुष्टा लाभालाभविवर्जिता । लङ्घ्येतराज्ञा लावण्यशालिनी लघुसिद्धिदा
    ॥ ॥ लाक्षारससवर्णाभा लक्ष्मणाग्रजपूजिता । लभ्येतरा लब्धभक्तिसुलभा लाङ्गलायुधा ॥ ॥ लग्नचामरहस्तश्रीशारदापरिवीजिता
    । लज्जापदसमाराध्या लम्पटा लकुलेश्वरी ॥ ॥ लब्धमाना लब्धरसा लब्धसम्पत्समुन्नतिः । ह्रीं कारकुण्डाग्निशिखा
    ह्रीं कारशशिचन्द्रिका । ह्रीं कारभास्कररुचिर्ह्रीं कारकन्दाङ्कुरिका ह्रीं कारदीर्घिकाहंसी ह्रीं कारावालवल्लरी
    । ह्रीं कारकन्दरासिंही ह्रीं काराम्भोजभृङ्गिका । ह्रीं कारसुमनोमाध्वी ह्रीं ॥ सकाराख्या समरसा सकलागमसंस्तुता
    । सर्ववेदान्ततात्पर्यभूमिः सदसदाश्रया ॥ ॥ सकला सच्चिदानन्दा साध्या सद्गतिदायिनी । सनकादिमुनिध्येया
    सदाशिवकुटुम्बिनी ॥ ॥ सकालाधिष्ठानरूपा सत्यरूपा समाकृतिः । सर्वप्रपञ्चनिर्मात्री समनाधिकवर्जिता ॥ ॥
    सर्वोत्तुङ्गा सङ्गहीना सगुणा सकलेष्टदा । ककारिणी काव्यलोला कामेश्वरमनोहरा ॥ ॥ कामेश्वरप्राणनाडी कामेशोत्सङ्गवासिनी
    । कामेश्वरालिङ्गिताङ्गी कामेश्वरसुखप्रदा ॥ ॥ कामेश्वरप्रणयिनी कामेश्वरविलासिनी । कामेश्वरतपःसिद्धिः
    कामेश्वरमनःप्रिया ॥ ॥ कामेश्वरप्राणनाथा कामेश्वरविमोहिनी । कामेश्वरब्रह्मविद्या कामेश्वरगृहेश्वरी
    ॥ ॥ कामेश्वराह्लादकरी कामेश्वरमहेश्वरी । कामेश्वरी कामकोटिनिलया काङ्क्षितार्थदा ॥ ॥ लकारिणी लब्धरूपा
    लब्धधीर्लब्धवाञ्छिता । लब्धपापमनोदूरा लब्धाहङ्कारदुर्गमा ॥ ॥ लब्धशक्तिर्लब्धदेहा लब्धैश्वर्यसमुन्नतिः
    । लब्धवृद्धिर्लब्धलीला लब्धयौवनशालिनी ॥ ॥ लब्धातिशयसर्वाङ्गसौन्दर्या लब्धविभ्रमा । लब्धरागा लब्धपतिर्लब्धनानागमस्थितिः
    ॥ ॥ लब्धभोगा लब्धसुखा लब्धहर्षाभिपूरिता । ह्रीं कारसौधशृङ्गकपोतिका ॥ कारदुग्धाब्धिसुधा ह्रीं कारकमलेन्दिरा
    । ह्रीं कारमणिदीपार्चिर्ह्रीं कारादर्शबिम्बिता । ह्रीं कारशुक्तिकामुक्तामणिर्ह्रीं कारमयसौवर्णस्तम्भविद्रुमपुत्रिका
    ॥ काराध्वरदक्षिणा । ह्रीं कारनन्दनारामनवकल्पकवल्लरी ॥ कारहिमवद्गङ्गा ह्रीं कारार्णवकौस्तुभा । ह्रीं
    कारमन्त्रसर्वस्वा ह्रीं हयग्रीव उवाच । इत्येवं ते मयाख्यातं देव्या नामशतत्रयम् । रहस्यातिरहस्यत्वाद्गोपनीयं
    त्वया मुने ॥ ॥ शिववर्णानि नामानि श्रीदेव्या कथितानि हि । शक्त्यक्षराणि नामानि कामेशकथितानि च ॥ ॥ उभयाक्षरनामानि
    ह्युभाभ्यां कथितानि वै । तदन्यैर्ग्रथितं स्तोत्रमेतस्य सदृशं किमु ॥ ॥ नानेन सदृशं स्तोत्रं श्रीदेवीप्रीतिदायकम्
    । लोकत्रयेऽपि कल्याणं सम्भवेन्नात्र संशयः ॥ ॥ सूत उवाच । इति हयमुखगीतं स्तोत्रराजं निशम्य प्रगलितकलुषोऽभूच्चित्तपर्याप्तिमेत्य
    । निजगुरुमथ नत्वा कुम्भजन्मा तदुक्तं पुनरधिकरहस्यं ज्ञातुमेवं जगाद ॥ ॥ अगस्त्य उवाच । अश्वानन महाभाग
    रहस्यमपि मे वद । शिववर्णानि कान्यत्र शक्तिवर्णानि कानि हि ॥ ॥ उभयोरपि वर्णानि कानि वा वद देशिक । इति
    पृष्टः कुम्भजेन हयग्रीवोऽवदत्पुनः ॥ ॥ हयग्रीव उवाच । तव गोप्यं किमस्तीह साक्षादम्बानुशासनात् । इदं
    त्वतिरहस्यं ते वक्ष्यामि शृणु कुम्भज ॥ ॥ एतद्विज्ञानमात्रेण श्रीविद्या सिद्धिदा भवेत् । कत्रयं हद्वयं
    चैव शैवो भागः प्रकीर्तितः ॥ ॥ शक्त्यक्षराणि शेषाणि ह्रीङ्कार उभयात्मकः । एवं विभागमज्ञात्वा ये विद्याजपशालिनः
    ॥ ॥ न तेषां सिद्धिदा विद्या कल्पकोटिशतैरपि । चतुर्भिः शिवचक्रैश्च शक्तिचक्रैश्च पञ्चभिः ॥ ॥ नवचक्रैश्च
    संसिद्धं श्रीचक्रं शिवयोर्वपुः । त्रिकोणमष्टकोणं च दशकोणद्वयं तथा ॥ ॥ चतुर्दशारं चैतानि शक्तिचक्राणि
    पञ्च च । बिन्दुश्चाष्टदलं पद्मं पद्मं षोडशपत्रकम् ॥ ॥ चतुरश्रं च चत्वारि शिवचक्राण्यनुक्रमात् । त्रिकोणे
    बैन्दवं श्लिष्टं अष्टारेऽष्टदलाम्बुजम् ॥ ॥ दशारयोः षोडशारं भूगृहं भुवनाश्रके । शैवानामपि शाक्तानां
    चक्राणां च परस्परम् ॥ ॥ अविनाभावसम्बन्धं यो जानाति स चक्रवित् । त्रिकोणरूपिणी शक्तिर्बिन्दुरूपपरः
    शिवः ॥ ॥ अविनाभावसम्बन्धं तस्माद्बिन्दुत्रिकोणयोः । एवं विभागमज्ञात्वा श्रीचक्रं यः समर्चयेत् ॥ ॥
    न तत्फलमवाप्नोति ललिताम्बा न तुष्यति । ये च जानन्ति लोकेऽस्मिन् श्रीविद्याचक्रवेदिनः ॥ ॥ सामन्यवेदिनः
    सर्वे विशेषज्ञोऽतिदुर्लभः । स्वयंविद्याविशेषज्ञो विशेषज्ञं समर्चयेत् ॥ ॥ तस्मै देयं ततो ग्राह्यमशक्तस्तस्य
    दापयेत् । अन्धं तमः प्रविशन्ति येऽविद्यां समुपासते ॥ ॥ इति श्रुतिरपाहैतानविद्योपासकान्पुनः । विद्यान्योपासकानेव
    निन्दत्यारुणिकी श्रुतिः ॥ ॥ अश्रुता सश्रुतासश्च यज्वानो येऽप्ययज्वनः । स्वर्यन्तो नापेक्षन्ते इन्द्रमग्निं
    च ये विदुः ॥ ॥ सिकता इव संयन्ति रश्मिभिः समुदीरिताः । अस्माल्लोकादमुष्माच्चेत्याह चारण्यकश्रुतिः ॥
    ॥ यस्य नो पश्चिमं जन्म यदि वा शङ्करः स्वयम् । तेनैव लभ्यते विद्या श्रीमत्पञ्चदशाक्षरी ॥ ॥ इति मन्त्रेषु
    बहुधा विद्याया महिमोच्यते । मोक्षैकहेतुविद्या तु श्रीविद्या नात्र संशयः ॥ ॥ न शिल्पादिज्ञानयुक्ते
    विद्वच्छब्धः प्रयुज्यते । मोक्षैकहेतुविद्या सा श्रीविद्यैव न संशयः ॥ ॥ तस्माद्विद्याविदेवात्र विद्वान्विद्वानितीर्यते
    । स्वयं विद्याविदे दद्यात्ख्यापयेत्तद्गुणान्सुधीः ॥ ॥ स्वयंविद्यारहस्यज्ञो विद्यामाहात्म्यवेद्यपि
    । विद्याविदं नार्चयेच्चेत्को वा तं पूजयेज्जनः ॥ ॥ प्रसङ्गादिदमुक्तं ते प्रकृतं शृणु कुम्भज । यः कीर्तयेत्सकृद्भक्त्या
    दिव्यनामशतत्रयम् ॥ ॥ तस्य पुण्यमहं वक्ष्ये शृणु त्वं कुम्भसम्भव । रहस्यनामसाहस्रपाठे यत्फलमीरितम्
    ॥ ॥ तत्फलं कोटिगुणितमेकनामजपाद्भवेत् । कामेश्वरीकामेशाभ्यां कृतं नामशतत्रयम् ॥ ॥ नान्येन तुलयेदेतत्
    स्तोत्रेणान्यकृतेन च । श्रियः परम्परा यस्य भावि वा चोत्तरोत्तरम् ॥ ॥ तेनैव लभ्यते चैतत्पश्चाच्छ्रेयः
    परीक्षयेत् । अस्या नाम्नां त्रिशत्यास्तु महिमा केन वर्ण्यते ॥ ॥ या स्वयं शिवयोर्वक्त्रपद्माभ्यां परिनिःसृता
    । नित्यं षोडशसङ्ख्याकान्विप्रानादौ तु भोजयेत् ॥ ॥ अभ्यक्तांस्तिलतैलेन स्नातानुष्णेन वारिणा । अभ्यर्च्य
    गन्धपुष्पाद्यैः कामेश्वर्यादिनामभिः ॥ ॥ सूपापूपैः शर्कराद्यैः पायसैः फलसंयुतैः । विद्याविदो विशेषेण
    भोजयेत्षोडश द्विजान् ॥ ॥ एवं नित्यार्चनं कुर्यादादौ ब्राह्मणभोजनम् । त्रिशतीनामभिः पश्चाद्ब्राह्मणान्क्रमशोऽर्चयेत्
    ॥ ॥ तैलाभ्यङ्गादिकं दत्वा विभवे सति भक्तितः । शुक्लप्रतिपदारभ्य पौर्णमास्यवधि क्रमात् ॥ ॥ दिवसे दिवसे
    विप्रा भोज्या विंशतिसङ्ख्यया । दशभिः पञ्चभिर्वापि त्रिभिरेकेन वा दिनैः ॥ ॥ त्रिंशत्षष्टिः शतं विप्राः
    सम्भोज्यास्त्रिशतं क्रमात् । एवं यः कुरुते भक्त्या जन्ममध्ये सकृन्नरः ॥ ॥ तस्यैव सफलं जन्म मुक्तिस्तस्य
    करे स्थिरा । रहस्यनामसाहस्रभोजनेऽप्येवमेव हि ॥ ॥ आदौ नित्यबलिं कुर्यात्पश्चाद्ब्राह्मणभोजनम् । रहस्यनामसाहस्रमहिमा
    यो मयोदितः ॥ ॥ स शीकराणुरत्नैकनाम्नो महिमवारिधेः । वाग्देवीरचिते नामसाहस्रे यद्यदीरितम् ॥ ॥ तत्फलं
    कोटिगुणितं नाम्नोऽप्येकस्य कीर्तनात् । एतदन्यैर्जपैः स्तोत्रैरर्चनैर्यत्फलं भवेत् ॥ ॥ तत्फलं कोटिगुणितं
    भवेन्नामशतत्रयात् । वाग्देवीरचिते स्तोत्रे तादृशो महिमा यदि ॥ ॥ साक्षात्कामेशकामेशीकृतेऽस्मिन्गृह्यतामिति
    । सकृत्सङ्कीर्तनादेव नाम्नामस्मिन् शतत्रये ॥ ॥ भवेच्चित्तस्य पर्याप्तिर्न्यूनमन्यानपेक्षिणी । न ज्ञातव्यमितोऽप्यन्यत्र
    जप्तव्यं च कुम्भज ॥ ॥ यद्यत्साध्यतमं कार्यं तत्तदर्थमिदं जपेत् । तत्तत्फलमवाप्नोति पश्चात्कार्यं परीक्षयेत्
    ॥ ॥ ये ये प्रयोगास्तन्त्रेषु तैस्तैर्यत्साध्यते फलम् । तत्सर्वं सिध्यति क्षिप्रं नामत्रिशतकीर्तनात्
    ॥ ॥ आयुष्करं पुष्टिकरं पुत्रदं वश्यकारकम् । विद्याप्रदं कीर्तिकरं सुकवित्वप्रदायकम् ॥ ॥ सर्वसम्पत्प्रदं
    सर्वभोगदं सर्वसौख्यदम् । सर्वाभीष्टप्रदं चैव देव्या नामशतत्रयम् ॥ ॥ एतज्जपपरो भूयान्नान्यदिच्छेत्कदाचन
    । एतत्कीर्तनसन्तुष्टा श्रीदेवी ललिताम्बिका ॥ ॥ भक्तस्य यद्यदिष्टं स्यात्तत्तत्पूरयते ध्रुवम् । तस्मात्कुम्भोद्भव
    मुने कीर्तय त्वमिदं सदा ॥ ॥ नापरं किञ्चिदपि ते बोद्धव्यमवशिष्यते । इति ते कथितं स्तोत्रं ललिताप्रीतिदायकम्
    ॥ ॥ नाविद्यावेदिने ब्रूयान्नाभक्ताय कदाचन । न शठाय न दुष्टाय नाविश्वासाय कर्हिचित् ॥ ॥ यो ब्रूयात्त्रिशतीं
    नाम्नां तस्यानर्थो महान्भवेत् । इत्याज्ञा शाङ्करी प्रोक्ता तस्माद्गोप्यमिदं त्वया ॥ ॥ ललिताप्रेरितेनैव
    मयोक्तं स्तोत्रमुत्तमम् । रहस्यनामसाहस्रादपि गोप्यमिदं मुने ॥ ॥ सूत उवाच । एवमुक्त्वा हयग्रीवः कुम्भजं
    तापसोत्तमम् । स्तोत्रेणानेन ललितां स्तुत्वा त्रिपुरसुन्दरीम् । आनन्दलहरीमग्नमानसः समवर्तत ॥ ॥ इति
    ब्रह्माण्डपुराणे उत्तरखण्डे हयग्रीवागस्त्यसंवादे ललितोपाख्याने स्तोत्रखण्डे श्रीललितात्रिशतीस्तोत्ररत्नम्
    ।
