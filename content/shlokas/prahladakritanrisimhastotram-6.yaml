id: prahladakritanrisimhastotram-6
category: stotram
name:
  english: prahladakritanrisimhastotram 6
  devanagari: प्रह्लादकृतनृसिंहस्तोत्रम् ६
content:
  english: jayadeva jagannatha sarvajivanasevadhe | sudhalokalavamoda jivitakhilavrittida || 1|| jaya
    mayamahorminamakaranandasagara | brahmandabuddhadonnaddha vilasakularodhasa || 2|| jayananta mahabhaga
    mokshalakshmim mahim kuru | brahmabhavaphalodyanacidekamarapadapa || 3|| jayakamamahavalli sangharopitasatphalaih
    | vistritavanisaurajya sadekananda gavhara || 4|| jaya jivamahamohabandhadhvamsanapandita | jayadeva
    vareshana varadadhisha satpate || 5|| jayasvarlokakartavya lakshamya sambhritasadvara | jayashritamahalabha
    mahodaya jagatpate || 6|| jayamohatimayesha kalakala nrisimha bho | jayagrastamahamrityo prasida karunanidhe
    || 7|| tvameva stutirishana stotastutyastvamishvara | na jane tvatparam deva bhumnah sadasadatmakam
    || 8|| iti prahladakritanrisimhastutih sampurna |
  devanagari: जयदेव जगन्नाथ सर्वजीवनसेवधे । सुधालोकलवामोद जीविताखिलवृत्तिद ॥ १॥ जय मायामहोर्मीणामाकरानन्दसागर
    । ब्रह्माण्डबुद्धदोन्नद्ध विलासाकुलरोधस ॥ २॥ जयानन्त महाभाग मोक्षलक्ष्मीं महीं कुरु । ब्रह्मभावफलोद्यानचिदेकामरपादप
    ॥ ३॥ जयकाममहावल्ली सङ्घरोपितसत्फलैः । विस्तृतावनिसौराज्य सदेकानन्द गव्हर ॥ ४॥ जय जीवमहामोहबन्धध्वंसनपण्डित
    । जयदेव वरेशान वरदाधीश सत्पते ॥ ५॥ जयस्वर्लोककर्तव्य लक्षम्या सम्भृतसद्वर । जयाश्रितमहालाभ महोदय जगत्पते
    ॥ ६॥ जयमोहातिमायेश कालकाल नृसिंह भो । जयग्रस्तमहामृत्यो प्रसीद करुणानिधे ॥ ७॥ त्वमेव स्तुतिरीशान स्तोतास्तुत्यस्त्वमीश्वर
    । न जाने त्वत्परं देव भूम्नः सदसदात्मकम् ॥ ८॥ इति प्रह्लादकृतनृसिंहस्तुतिः सम्पूर्णा ।
