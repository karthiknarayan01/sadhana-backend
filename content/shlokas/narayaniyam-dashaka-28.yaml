id: narayaniyam-dashaka-28
category: stotram
name:
  english: Narayaniyam Dashaka 28
content:
  english: garalam taralanalam purasta jjaladherudvijagala kalakutam | amarastutivadamodanighno girishastannipapau
    bhavatpriyartham || || vimathatsu surasureshu jata surabhistamrishishu nyadhastridhaman | hayaratnamabhudathebharatnam
    dyutarushcapsarasah sureshu tani || || jagadisha bhavatpara tadanim kamaniya kamala babhuva devi |
    amalamavalokya yam vilolah sakalo'pi sprihayambabhuva lokah || || tvayi dattahride tadaiva devyai
    tridashendro manipithikam vyatarit | sakalopahritabhishecaniyaih rishayastam shrutigirbhirabhyashincan
    || || abhishekajalanupatimugdha tvadapangairavabhushitangavallim | manikundalapitacelahara pramukhaistamamaradayo'nvabhushan
    || || varanasrajamattabhringanadam dadhati sa kucakumbhamandayana | padashinjitamanjunupura tvam kalitavrilavilasamasasada
    || || girishadruhinadisarvadevan gunabhajo'pyavimuktadoshaleshan | avamrishya sadaiva sarvaramye nihita
    tvayyanaya'pi divyamala || || urasa tarasa mamanithainam bhuvananam jananimananyabhavam | tvadurovilasattadikshanashri
    parivrishtya paripushtamasa vishvam || || atimohanavibhrama tadanim madayanti khalu varuni niragat
    | tamasah padavimadastvamena matisammananaya mahasurebhyah || || tarunambudasundarastada tvam nanu
    dhanvantarirutthito'mburasheh | amritam kalashe vahan karabhya makhilartim hara marutalayesha ||
  devanagari: गरलं तरलानलं पुरस्ता ज्जलधेरुद्विजगाल कालकूटम् । अमरस्तुतिवादमोदनिघ्नो गिरिशस्तन्निपपौ भवत्प्रियार्थम्
    ॥ ॥ विमथत्सु सुरासुरेषु जाता सुरभिस्तामृषिषु न्यधास्त्रिधामन् । हयरत्नमभूदथेभरत्नं द्युतरुश्चाप्सरसः
    सुरेषु तानि ॥ ॥ जगदीश भवत्परा तदानीं कमनीया कमला बभूव देवी । अमलामवलोक्य यां विलोलः सकलोऽपि स्पृहयाम्बभूव
    लोकः ॥ ॥ त्वयि दत्तहृदे तदैव देव्यै त्रिदशेन्द्रो मणिपीठिकां व्यतारीत् । सकलोपहृताभिषेचनीयैः ऋषयस्तां
    श्रुतिगीर्भिरभ्यषिञ्चन् ॥ ॥ अभिषेकजलानुपातिमुग्ध त्वदपाङ्गैरवभूषिताङ्गवल्लीम् । मणिकुण्डलपीतचेलहार
    प्रमुखैस्ताममरादयोऽन्वभूषन् ॥ ॥ वरणस्रजमात्तभृङ्गनादां दधती सा कुचकुम्भमन्दयाना । पदशिञ्जितमञ्जुनूपुरा
    त्वां कलितव्रीलविलासमाससाद ॥ ॥ गिरिशद्रुहिणादिसर्वदेवान् गुणभाजोऽप्यविमुक्तदोषलेशान् । अवमृश्य सदैव
    सर्वरम्ये निहिता त्वय्यनयाऽपि दिव्यमाला ॥ ॥ उरसा तरसा ममानिथैनां भुवनानां जननीमनन्यभावाम् । त्वदुरोविलसत्तदीक्षणश्री
    परिवृष्ट्या परिपुष्टमास विश्वम् ॥ ॥ अतिमोहनविभ्रमा तदानीं मदयन्ती खलु वारुणी निरागात् । तमसः पदवीमदास्त्वमेना
    मतिसम्माननया महासुरेभ्यः ॥ ॥ तरुणाम्बुदसुन्दरस्तदा त्वं ननु धन्वन्तरिरुत्थितोऽम्बुराशेः । अमृतं कलशे
    वहन् कराभ्या मखिलार्तिं हर मारुतालयेश ॥
