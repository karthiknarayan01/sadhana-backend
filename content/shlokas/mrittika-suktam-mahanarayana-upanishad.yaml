id: mrittika-suktam-mahanarayana-upanishad
category: stotram
name:
  english: Mrittika Suktam (Mahanarayana Upanishad)
content:
  english: rdharani lokadharini | udhrita 'si varahena krishnena shata bahuna | mrittike hana me papam
    'si kashyapenabhimantrita | mrittike dehi me pushti ntanme nirnuda mrittike | taya hatena papena gacchami
    parama
  devanagari: र्धरणी लो॑कधा॒रिणी । उ॒धृता॑ ऽसि व॑राहे॒ण॒ कृ॒ष्णे॒न श॑त बा॒हुना । मृ॒त्तिके॑ हन॑ मे पा॒पं॒
    ऽसि॒ का॒श्यपे॑नाभि॒मन्त्रि॑ता । मृ॒त्तिके॑ देहि॑ मे पु॒ष्टि॒ न्त॒न्मे नि॑र्णुद॒ मृत्ति॑के । तया॑ ह॒तेन॑
    पापे॒न॒ ग॒च्छा॒मि प॑रमा॒
meaning: {}
