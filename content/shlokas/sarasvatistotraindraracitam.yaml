id: sarasvatistotraindraracitam
category: stotram
name:
  english: sarasvatistotraindraracitam
  devanagari: सरस्वतीस्तोत्रईन्द्ररचितम्
content:
  english: shrisarasvati me prasidatu || 10|| indrenaivam kritam stotram ye pathantyanisham tu te | sarasvatiprasadena
    prapadyante'shtasiddhikah || || iti shrisarasvatistotram || om atha shrisarasvatistotram | bhringanilanilanjanalaka
  devanagari: श्रीसरस्वती मे प्रसीदतु ॥ १०॥ इन्द्रेणैवं कृतं स्तोत्रं ये पठन्त्यनिशं तु ते । सरस्वतीप्रसादेन
    प्रपद्यन्तेऽष्टसिद्धिकाः ॥ ॥ इति श्रीसरस्वतीस्तोत्रम् ॥ ॐ अथ श्रीसरस्वतीस्तोत्रम् । भृङ्गनीलनीलाञ्जनालका
meaning: {}
