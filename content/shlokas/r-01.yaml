id: r-01
category: veda
name:
  english: r 01
  devanagari: र् ०१
content:
  english: 03 a̱smaka̭m va̱ indra̭mushmasi̱shtaye̱ sakha̭yam vi̱shvayṷm pra̱saha̱m yuja̱m vajḙshu pra̱saha̱m
    yuja̭m | a̱smaka̱m brahmo̱taye'va̭ pri̱tsushu̱ kasṷ cit | na̱hi tva̱ shatru̱h stara̭te stri̱noshi̱
    yam vishva̱m shatrṷm stri̱noshi̱ yam || 1
  devanagari: ०३ अ॒स्माकं॑ व॒ इन्द्र॑मुश्मसी॒ष्टये॒ सखा॑यं वि॒श्वायुं॑ प्रा॒सहं॒ युजं॒ वाजे॑षु प्रा॒सहं॒
    युज॑म् । अ॒स्माकं॒ ब्रह्मो॒तयेऽवा॑ पृ॒त्सुषु॒ कासु॑ चित् । न॒हि त्वा॒ शत्रुः॒ स्तर॑ते स्तृ॒णोषि॒ यं
    विश्वं॒ शत्रुं॑ स्तृ॒णोषि॒ यम् ॥ १
meaning: {}
