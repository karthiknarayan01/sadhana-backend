id: bilva-108
category: stotram
name:
  english: bilva 108
  devanagari: बिल्व १०८
content:
  english: '|| bilvashtottarashatanamastotram || atha bilvashtottarashatanamastotram || tridalam trigunakaram
    trinetram ca triyayudham | trijanma papasamharam ekabilvam shivarpanam || 1|| trishakhaih bilvapatraishca
    acchidraih komalaih shubhaih | tava pujam karishyami ekabilvam shivarpanam || 2|| sarvatrailokyakartaram
    sarvatrailokyapalanam | sarvatrailokyahartaram ekabilvam shivarpanam || 3|| nagadhirajavalayam nagaharena
    bhushitam | nagakundalasamyuktam ekabilvam shivarpanam || 4|| akshamaladharam rudram parvatipriyavallabham
    | candrashekharamishanam ekabilvam shivarpanam || 5|| trilocanam dashabhujam durgadehardhadharinam
    | vibhutyabhyarcitam devam ekabilvam shivarpanam || 6|| trishuladharinam devam nagabharanasundaram
    | candrashekharamishanam ekabilvam shivarpanam || 7|| gangadharambikanatham phanikundalamanditam |
    kalakalam girisham ca ekabilvam shivarpanam || 8|| shuddhasphatika sankasham shitikantham kripanidhim
    | sarveshvaram sadashantam ekabilvam shivarpanam || 9|| saccidanandarupam ca paranandamayam shivam
    | vagishvaram cidakasham ekabilvam shivarpanam || 10|| shipivishtam sahasraksham kailasacalavasinam
    | hiranyabahum senanyam ekabilvam shivarpanam || 11|| arunam vamanam taram vastavyam caiva vastavam
    | jyeshtam kanishtham gaurisham ekabilvam shivarpanam || 12|| harikesham sanandisham uccairghosham
    sanatanam | aghorarupakam kumbham ekabilvam shivarpanam || 13|| purvajavarajam yamyam sukshmam taskaranayakam
    | nilakantham jaghanyam ca ekabilvam shivarpanam || 14|| surashrayam vishaharam varminam ca varudhinam
    mahasenam mahaviram ekabilvam shivarpanam || 15|| kumaram kushalam kupyam vadanyanca maharatham |
    tauryatauryam ca devyam ca ekabilvam shivarpanam || 16|| dashakarnam lalataksham pancavaktram sadashivam
    | asheshapapasamharam ekabilvam shivarpanam || 17|| nilakantham jagadvandyam dinanatham maheshvaram
    | mahapapasamharam ekabilvam shivarpanam || 18|| cudamanikritavibhum valayikritavasukim | kailasavasinam
    bhimam ekabilvam shivarpanam || 19|| karpurakundadhavalam narakarnavatarakam | karunamritasindhum
    ca ekabilvam shivarpanam || 20|| mahadevam mahatmanam bhujangadhipakankanam | mahapapaharam devam
    ekabilvam shivarpanam || 21|| bhutesham khandaparashum vamadevam pinakinam | vame shaktidharam shreshtham
    ekabilvam shivarpanam || 22|| phalekshanam virupaksham shrikantham bhaktavatsalam | nilalohitakhatvangam
    ekabilvam shivarpanam || 23|| kailasavasinam bhimam kathoram tripurantakam | vrishankam vrishabharudham
    ekabilvam shivarpanam || 24|| samapriyam sarvamayam bhasmoddhulitavigraham | mrityunjayam lokanatham
    ekabilvam shivarpanam || 25|| daridryaduhkhaharanam ravicandranalekshanam | mrigapanim candramauḻim
    ekabilvam shivarpanam || 26|| sarvalokabhayakaram sarvalokaikasakshinam | nirmalam nirgunakaram ekabilvam
    shivarpanam || 27|| sarvatattvatmakam sambam sarvatattvavidurakam | sarvatattvasvarupam ca ekabilvam
    shivarpanam || 28|| sarvalokagurum sthanum sarvalokavarapradam | sarvalokaikanetram ca ekabilvam shivarpanam
    || 29|| manmathoddharanam shaivam bhavabhargam paratmakam | kamalapriyapujyam ca ekabilvam shivarpanam
    || 30|| tejomayam mahabhimam umesham bhasmalepanam | bhavarogavinasham ca ekabilvam shivarpanam ||
    31|| svargapavargaphaladam raghunathavarapradam | nagarajasutakantam ekabilvam shivarpanam || 32||
    manjirapadayugalam shubhalakshanalakshitam | phanirajavirajam ca ekabilvam shivarpanam || 33|| niramayam
    niradharam nissangam nishprapancakam | tejorupam maharaudram ekabilvam shivarpanam || 34|| sarvalokaikapitaram
    sarvalokaikamataram | sarvalokaikanatham ca ekabilvam shivarpanam || 35|| citrambaram nirabhasam vrishabheshvaravahanam
    | nilagrivam caturvaktram ekabilvam shivarpanam || 36|| ratnakancukaratnesham ratnakundalamanditam
    | navaratnakiritam ca ekabilvam shivarpanam || 37|| divyaratnangulisvarnam kanthabharanabhushitam
    | nanaratnamanimayam ekabilvam shivarpanam || 38|| ratnanguliyavilasatkarashakhanakhaprabham | bhaktamanasageham
    ca ekabilvam shivarpanam || 39|| vamangabhagavilasadambikavikshanapriyam | pundarikanibhaksham ca
    ekabilvam shivarpanam || 40|| sampurnakamadam saukhyam bhakteshtaphalakaranam | saubhagyadam hitakaram
    ekabilvam shivarpanam || 41|| nanashastragunopetam sphuranmangala vigraham | vidyavibhedarahitam ekabilvam
    shivarpanam || 42|| aprameyagunadharam vedakridrupavigraham | dharmadharmapravrittam ca ekabilvam
    shivarpanam || 43|| gaurivilasasadanam jivajivapitamaham | kalpantabhairavam shubhram ekabilvam shivarpanam
    || 44|| sukhadam sukhanasham ca duhkhadam duhkhanashanam | duhkhavataram bhadram ca ekabilvam shivarpanam
    || 45|| sukharupam rupanasham sarvadharmaphalapradam | atindriyam mahamayam ekabilvam shivarpanam
    || 46|| sarvapakshimrigakaram sarvapakshimrigadhipam | sarvapakshimrigadharam ekabilvam shivarpanam
    || 47|| jivadhyaksham jivavandyam jivajivanarakshakam | jivakrijjivaharanam ekabilvam shivarpanam
    || 48|| vishvatmanam vishvavandyam vajratmavajrahastakam | vajresham vajrabhusham ca ekabilvam shivarpanam
    || 49|| ganadhipam ganadhyaksham pralayanalanashakam | jitendriyam virabhadram ekabilvam shivarpanam
    || 50|| tryambakam mridam shuram arishadvarganashanam | digambaram kshobhanasham ekabilvam shivarpanam
    || 51|| kundendushankhadhavalam bhaganetrabhidujjvalam | kalagnirudram sarvajnam ekabilvam shivarpanam
    || 52|| kambugrivam kambukantham dhairyadam dhairyavardhakam | shardulacarmavasanam ekabilvam shivarpanam
    || 53|| jagadutpattihetum ca jagatpralayakaranam | purnanandasvarupam ca ekabilvam shivarpanam ||
    54|| sargakesham mahattejam punyashravanakirtanam | brahmandanayakam taram ekabilvam shivarpanam ||
    55|| mandaramulanilayam mandarakusumapriyam | vrindarakapriyataram ekabilvam shivarpanam || 56|| mahendriyam
    mahabahum vishvasaparipurakam | sulabhasulabham labhyam ekabilvam shivarpanam || 57|| bijadharam bijarupam
    nirbijam bijavriddhidam | paresham bijanasham ca ekabilvam shivarpanam || 58|| yugakaram yugadhisham
    yugakridyuganashanam | paresham bijanasham ca ekabilvam shivarpanam || 59|| dhurjatim pingalajatam
    jatamandalamanditam | karpuragauram gaurisham ekabilvam shivarpanam || 60|| suravasam janavasam yogisham
    yogipungavam | yogadam yoginam simham ekabilvam shivarpanam || 61|| uttamanuttamam tattvam andhakasurasudanam
    | bhaktakalpadrumastomam ekabilvam shivarpanam || 62|| vicitramalyavasanam divyacandanacarcitam |
    vishnubrahmadi vandyam ca ekabilvam shivarpanam || 63|| kumaram pitaram devam shritacandrakalanidhim
    | brahmashatrum jaganmitram ekabilvam shivarpanam || 64|| lavanyamadhurakaram karunarasavaradhim |
    bhruvormadhye sahasrarcim ekabilvam shivarpanam || 65|| jatadharam pavakaksham vrikshesham bhuminayakam
    | kamadam sarvadagamyam ekabilvam shivarpanam || 66|| shivam shantam umanatham mahadhyanaparayanam
    | jnanapradam krittivasam ekabilvam shivarpanam || 67|| vasukyuragaharam ca lokanugrahakaranam | jnanapradam
    krittivasam ekabilvam shivarpanam || 68|| shashankadharinam bhargam sarvalokaikashankaram | shuddham
    ca shashvatam nityam ekabilvam shivarpanam || 69|| sharanagatadinartaparitranaparayanam | gambhiram
    ca vashatkaram ekabilvam shivarpanam ||70|| bhoktaram bhojanam bhojyam jetaram jitamanasam | karanam
    karanam jishnum ekabilvam shivarpanam || 71|| kshetrajnam kshetrapalanca parardhaikaprayojanam | vyomakesham
    bhimavesham ekabilvam shivarpanam || 72|| bhavajnam tarunopetam corishtam yamanashanam | hiranyagarbham
    hemangam ekabilvam shivarpanam || 73|| daksham camundajanakam mokshadam mokshanayakam | hiranyadam
    hemarupam ekabilvam shivarpanam || 74|| mahashmashananilayam pracchannasphatikaprabham | vedasyam
    vedarupam ca ekabilvam shivarpanam || 75|| sthiram dharmam umanatham brahmanyam cashrayam vibhum |
    jagannivasam prathamamekabilvam shivarpanam || 76|| rudrakshamalabharanam rudrakshapriyavatsalam |
    rudrakshabhaktasamstomamekabilvam shivarpanam || 77|| phanindravilasatkantham bhujangabharanapriyam
    | dakshadhvaravinasham ca ekabilvam shivarpanam || 78|| nagendravilasatkarnam mahindravalayavritam
    | munivandyam munishreshthamekabilvam shivarpanam || 79|| mrigendracarmavasanam muninamekajivanam
    | sarvadevadipujyam ca ekabilvam shivarpanam || 80|| nidhanesham dhanadhisham apamrityuvinashanam
    | lingamurtimalingatmam ekabilvam shivarpanam || 81|| bhaktakalyanadam vyastam vedavedantasamstutam
    | kalpakritkalpanasham ca ekabilvam shivarpanam || 82|| ghorapatakadavagnim janmakarmavivarjitam |
    kapalamalabharanam ekabilvam shivarpanam || 83|| matangacarmavasanam viradrupavidarakam | vishnukrantamanantam
    ca ekabilvam shivarpanam || 84|| yajnakarmaphaladhyaksham yajnavighnavinashakam | yajnesham yajnabhoktaram
    ekabilvam shivarpanam || 85|| kaladhisham trikalajnam dushtanigrahakarakam | yogimanasapujyam ca ekabilvam
    shivarpanam || 86|| mahonnatamahakayam mahodaramahabhujam | mahavaktram mahavriddham ekabilvam shivarpanam
    || 87|| sunetram sulalatam ca sarvabhimaparakramam | maheshvaram shivataram ekabilvam shivarpanam
    || 88|| samastajagadadharam samastagunasagaram | satyam satyagunopetam ekabilvam shivarpanam || 89||
    maghakrishnacaturdashyam pujartham ca jagadguroh | durlabham sarvadevanam ekabilvam shivarpanam ||
    90|| tatrapi durlabham manyet nabhomasenduvasare | pradoshakale pujayam ekabilvam shivarpanam || 91||
    tatakam dhananikshepam brahmasthapyam shivalayam kotikanyamahadanam ekabilvam shivarpanam || 92||
    darshanam bilvavrikshasya sparshanam papanashanam | aghorapapasamharam ekabilvam shivarpanam || 93||
    tulasibilvanirgundi jambiramalakam tatha | pancabilvamiti khyatam ekabilvam shivarpanam || 94|| akhandabilvapatraishca
    pujayennandikeshvaram | mucyate sarvapapebhyah ekabilvam shivarpanam || 95|| salankrita shatavritta
    kanyakotisahasrakam | samrajyaprithvidanam ca ekabilvam shivarpanam || 96|| dantyashvakotidanani ashvamedhasahasrakam
    | savatsadhenudanani ekabilvam shivarpanam || 97|| caturvedasahasrani bharatadipuranakam | samrajyaprithvidanam
    ca ekabilvam shivarpanam || 98|| sarvaratnamayam merum kancanam divyavastrakam | tulabhagam shatavartam
    ekabilvam shivarpanam || 99|| ashtottarashshatam bilvam yo''rcayellingamastake | adharvoktam adhebhyastu
    ekabilvam shivarpanam || 100|| kashikshetranivasam ca kalabhairavadarshanam | aghorapapasamharam ekabilvam
    shivarpanam || 101|| ashtottarashatashlokaih stotradyaih pujayedyatha | trisandhyam mokshamapnoti
    ekabilvam shivarpanam || 102|| dantikotisahasranam bhuh hiranyasahasrakam | sarvakratumayam punyam
    ekabilvam shivarpanam || 103|| putrapautradikam bhogam bhuktva catra yathepsitam | ante ca shivasayujyam
    ekabilvam shivarpanam || 104|| viprakotisahasranam vittadanacca yatphalam | tatphalam prapnuyatsatyam
    ekabilvam shivarpanam || 105|| tvannamakirtanam tattvam tavapadambu yah pibet | jivanmuktobhavennityam
    ekabilvam shivarpanam || 106|| anekadanaphaladam anantasukritadikam | tirthayatrakhilam punyam ekabilvam
    shivarpanam || 107|| tvam mam palaya sarvatra padadhyanakritam tava | bhavanam shankaram nityam ekabilvam
    shivarpanam || 108|| umayasahitam devam savahanaganam shivam | bhasmanuliptasarvangam ekabilvam shivarpanam
    || 109|| salagramasahasrani vipranam shatakotikam | yajnakotisahasrani ekabilvam shivarpanam || 110||
    ajnanena kritam papam jnanenabhikritam ca yat | tatsarvam nashamayatu ekabilvam shivarpanam || 111||
    amritodbhavavrikshasya mahadevapriyasya ca | mucyante kantakaghatat kantakebhyo hi manavah || 112||
    ekaikabilvapatrena kotiyajnaphalam bhavet | mahadevasya pujartham ekabilvam shivarpanam || 113|| ekakale
    pathennityam sarvashatrunivaranam | dvikale ca pathennityam manorathaphalapradam | trikale ca pathennityam
    ayurvardhyo dhanapradam | aciratkaryasiddhim ca labhate natra samshayah || 114|| ekakalam dvikalam
    va trikalam yah pathennarah | lakshmipraptishshivavasah shivena saha modate || 115|| kotijanmakritam
    papam arcanena vinashyati | saptajanmakritam papam shravanena vinashyati | janmantarakritam papam
    pathanena vinashyati | divaratrakritam papam darshanena vinashyati | kshanekshanekritam papam smaranena
    vinashyati | pustakam dharayeddehi arogyam bhayanashanam || 116|| iti bilvashtottarashatanamastotram
    sampurnam ||'
  devanagari: ॥ बिल्वाष्टोत्तरशतनामस्तोत्रम् ॥ अथ बिल्वाष्टोत्तरशतनामस्तोत्रम् ॥ त्रिदलं त्रिगुणाकारं
    त्रिनेत्रं च त्रियायुधम् । त्रिजन्म पापसंहारं एकबिल्वं शिवार्पणम् ॥ १॥ त्रिशाखैः बिल्वपत्रैश्च अच्छिद्रैः
    कोमलैः शुभैः । तव पूजां करिष्यामि एकबिल्वं शिवार्पणम् ॥ २॥ सर्वत्रैलोक्यकर्तारं सर्वत्रैलोक्यपालनम्
    । सर्वत्रैलोक्यहर्तारं एकबिल्वं शिवार्पणम् ॥ ३॥ नागाधिराजवलयं नागहारेण भूषितम् । नागकुण्डलसंयुक्तं
    एकबिल्वं शिवार्पणम् ॥ ४॥ अक्षमालाधरं रुद्रं पार्वतीप्रियवल्लभम् । चन्द्रशेखरमीशानं एकबिल्वं शिवार्पणम्
    ॥ ५॥ त्रिलोचनं दशभुजं दुर्गादेहार्धधारिणम् । विभूत्यभ्यर्चितं देवं एकबिल्वं शिवार्पणम् ॥ ६॥ त्रिशूलधारिणं
    देवं नागाभरणसुन्दरम् । चन्द्रशेखरमीशानं एकबिल्वं शिवार्पणम् ॥ ७॥ गङ्गाधराम्बिकानाथं फणिकुण्डलमण्डितम्
    । कालकालं गिरीशं च एकबिल्वं शिवार्पणम् ॥ ८॥ शुद्धस्फटिक सङ्काशं शितिकण्ठं कृपानिधिम् । सर्वेश्वरं
    सदाशान्तं एकबिल्वं शिवार्पणम् ॥ ९॥ सच्चिदानन्दरूपं च परानन्दमयं शिवम् । वागीश्वरं चिदाकाशं एकबिल्वं
    शिवार्पणम् ॥ १०॥ शिपिविष्टं सहस्राक्षं कैलासाचलवासिनम् । हिरण्यबाहुं सेनान्यं एकबिल्वं शिवार्पणम्
    ॥ ११॥ अरुणं वामनं तारं वास्तव्यं चैव वास्तवम् । ज्येष्टं कनिष्ठं गौरीशं एकबिल्वं शिवार्पणम् ॥ १२॥
    हरिकेशं सनन्दीशं उच्चैर्घोषं सनातनम् । अघोररूपकं कुम्भं एकबिल्वं शिवार्पणम् ॥ १३॥ पूर्वजावरजं याम्यं
    सूक्ष्मं तस्करनायकम् । नीलकण्ठं जघन्यं च एकबिल्वं शिवार्पणम् ॥ १४॥ सुराश्रयं विषहरं वर्मिणं च वरूधिनम्
    महासेनं महावीरं एकबिल्वं शिवार्पणम् ॥ १५॥ कुमारं कुशलं कूप्यं वदान्यञ्च महारथम् । तौर्यातौर्यं च देव्यं
    च एकबिल्वं शिवार्पणम् ॥ १६॥ दशकर्णं ललाटाक्षं पञ्चवक्त्रं सदाशिवम् । अशेषपापसंहारं एकबिल्वं शिवार्पणम्
    ॥ १७॥ नीलकण्ठं जगद्वन्द्यं दीननाथं महेश्वरम् । महापापसंहारं एकबिल्वं शिवार्पणम् ॥ १८॥ चूडामणीकृतविभुं
    वलयीकृतवासुकिम् । कैलासवासिनं भीमं एकबिल्वं शिवार्पणम् ॥ १९॥ कर्पूरकुन्दधवलं नरकार्णवतारकम् । करुणामृतसिन्धुं
    च एकबिल्वं शिवार्पणम् ॥ २०॥ महादेवं महात्मानं भुजङ्गाधिपकङ्कणम् । महापापहरं देवं एकबिल्वं शिवार्पणम्
    ॥ २१॥ भूतेशं खण्डपरशुं वामदेवं पिनाकिनम् । वामे शक्तिधरं श्रेष्ठं एकबिल्वं शिवार्पणम् ॥ २२॥ फालेक्षणं
    विरूपाक्षं श्रीकण्ठं भक्तवत्सलम् । नीललोहितखट्वाङ्गं एकबिल्वं शिवार्पणम् ॥ २३॥ कैलासवासिनं भीमं कठोरं
    त्रिपुरान्तकम् । वृषाङ्कं वृषभारूढं एकबिल्वं शिवार्पणम् ॥ २४॥ सामप्रियं सर्वमयं भस्मोद्धूलितविग्रहम्
    । मृत्युञ्जयं लोकनाथं एकबिल्वं शिवार्पणम् ॥ २५॥ दारिद्र्यदुःखहरणं रविचन्द्रानलेक्षणम् । मृगपाणिं चन्द्रमौळिं
    एकबिल्वं शिवार्पणम् ॥ २६॥ सर्वलोकभयाकारं सर्वलोकैकसाक्षिणम् । निर्मलं निर्गुणाकारं एकबिल्वं शिवार्पणम्
    ॥ २७॥ सर्वतत्त्वात्मकं साम्बं सर्वतत्त्वविदूरकम् । सर्वतत्त्वस्वरूपं च एकबिल्वं शिवार्पणम् ॥ २८॥ सर्वलोकगुरुं
    स्थाणुं सर्वलोकवरप्रदम् । सर्वलोकैकनेत्रं च एकबिल्वं शिवार्पणम् ॥ २९॥ मन्मथोद्धरणं शैवं भवभर्गं परात्मकम्
    । कमलाप्रियपूज्यं च एकबिल्वं शिवार्पणम् ॥ ३०॥ तेजोमयं महाभीमं उमेशं भस्मलेपनम् । भवरोगविनाशं च एकबिल्वं
    शिवार्पणम् ॥ ३१॥ स्वर्गापवर्गफलदं रघुनाथवरप्रदम् । नगराजसुताकान्तं एकबिल्वं शिवार्पणम् ॥ ३२॥ मञ्जीरपादयुगलं
    शुभलक्षणलक्षितम् । फणिराजविराजं च एकबिल्वं शिवार्पणम् ॥ ३३॥ निरामयं निराधारं निस्सङ्गं निष्प्रपञ्चकम्
    । तेजोरूपं महारौद्रं एकबिल्वं शिवार्पणम् ॥ ३४॥ सर्वलोकैकपितरं सर्वलोकैकमातरम् । सर्वलोकैकनाथं च एकबिल्वं
    शिवार्पणम् ॥ ३५॥ चित्राम्बरं निराभासं वृषभेश्वरवाहनम् । नीलग्रीवं चतुर्वक्त्रं एकबिल्वं शिवार्पणम्
    ॥ ३६॥ रत्नकञ्चुकरत्नेशं रत्नकुण्डलमण्डितम् । नवरत्नकिरीटं च एकबिल्वं शिवार्पणम् ॥ ३७॥ दिव्यरत्नाङ्गुलीस्वर्णं
    कण्ठाभरणभूषितम् । नानारत्नमणिमयं एकबिल्वं शिवार्पणम् ॥ ३८॥ रत्नाङ्गुलीयविलसत्करशाखानखप्रभम् । भक्तमानसगेहं
    च एकबिल्वं शिवार्पणम् ॥ ३९॥ वामाङ्गभागविलसदम्बिकावीक्षणप्रियम् । पुण्डरीकनिभाक्षं च एकबिल्वं शिवार्पणम्
    ॥ ४०॥ सम्पूर्णकामदं सौख्यं भक्तेष्टफलकारणम् । सौभाग्यदं हितकरं एकबिल्वं शिवार्पणम् ॥ ४१॥ नानाशास्त्रगुणोपेतं
    स्फुरन्मङ्गल विग्रहम् । विद्याविभेदरहितं एकबिल्वं शिवार्पणम् ॥ ४२॥ अप्रमेयगुणाधारं वेदकृद्रूपविग्रहम्
    । धर्माधर्मप्रवृत्तं च एकबिल्वं शिवार्पणम् ॥ ४३॥ गौरीविलाससदनं जीवजीवपितामहम् । कल्पान्तभैरवं शुभ्रं
    एकबिल्वं शिवार्पणम् ॥ ४४॥ सुखदं सुखनाशं च दुःखदं दुःखनाशनम् । दुःखावतारं भद्रं च एकबिल्वं शिवार्पणम्
    ॥ ४५॥ सुखरूपं रूपनाशं सर्वधर्मफलप्रदम् । अतीन्द्रियं महामायं एकबिल्वं शिवार्पणम् ॥ ४६॥ सर्वपक्षिमृगाकारं
    सर्वपक्षिमृगाधिपम् । सर्वपक्षिमृगाधारं एकबिल्वं शिवार्पणम् ॥ ४७॥ जीवाध्यक्षं जीववन्द्यं जीवजीवनरक्षकम्
    । जीवकृज्जीवहरणं एकबिल्वं शिवार्पणम् ॥ ४८॥ विश्वात्मानं विश्ववन्द्यं वज्रात्मावज्रहस्तकम् । वज्रेशं
    वज्रभूषं च एकबिल्वं शिवार्पणम् ॥ ४९॥ गणाधिपं गणाध्यक्षं प्रलयानलनाशकम् । जितेन्द्रियं वीरभद्रं एकबिल्वं
    शिवार्पणम् ॥ ५०॥ त्र्यम्बकं मृडं शूरं अरिषड्वर्गनाशनम् । दिगम्बरं क्षोभनाशं एकबिल्वं शिवार्पणम् ॥
    ५१॥ कुन्देन्दुशङ्खधवलं भगनेत्रभिदुज्ज्वलम् । कालाग्निरुद्रं सर्वज्ञं एकबिल्वं शिवार्पणम् ॥ ५२॥ कम्बुग्रीवं
    कम्बुकण्ठं धैर्यदं धैर्यवर्धकम् । शार्दूलचर्मवसनं एकबिल्वं शिवार्पणम् ॥ ५३॥ जगदुत्पत्तिहेतुं च जगत्प्रलयकारणम्
    । पूर्णानन्दस्वरूपं च एकबिल्वं शिवार्पणम् ॥ ५४॥ सर्गकेशं महत्तेजं पुण्यश्रवणकीर्तनम् । ब्रह्माण्डनायकं
    तारं एकबिल्वं शिवार्पणम् ॥ ५५॥ मन्दारमूलनिलयं मन्दारकुसुमप्रियम् । वृन्दारकप्रियतरं एकबिल्वं शिवार्पणम्
    ॥ ५६॥ महेन्द्रियं महाबाहुं विश्वासपरिपूरकम् । सुलभासुलभं लभ्यं एकबिल्वं शिवार्पणम् ॥ ५७॥ बीजाधारं
    बीजरूपं निर्बीजं बीजवृद्धिदम् । परेशं बीजनाशं च एकबिल्वं शिवार्पणम् ॥ ५८॥ युगाकारं युगाधीशं युगकृद्युगनाशनम्
    । परेशं बीजनाशं च एकबिल्वं शिवार्पणम् ॥ ५९॥ धूर्जटिं पिङ्गलजटं जटामण्डलमण्डितम् । कर्पूरगौरं गौरीशं
    एकबिल्वं शिवार्पणम् ॥ ६०॥ सुरावासं जनावासं योगीशं योगिपुङ्गवम् । योगदं योगिनां सिंहं एकबिल्वं शिवार्पणम्
    ॥ ६१॥ उत्तमानुत्तमं तत्त्वं अन्धकासुरसूदनम् । भक्तकल्पद्रुमस्तोमं एकबिल्वं शिवार्पणम् ॥ ६२॥ विचित्रमाल्यवसनं
    दिव्यचन्दनचर्चितम् । विष्णुब्रह्मादि वन्द्यं च एकबिल्वं शिवार्पणम् ॥ ६३॥ कुमारं पितरं देवं श्रितचन्द्रकलानिधिम्
    । ब्रह्मशत्रुं जगन्मित्रं एकबिल्वं शिवार्पणम् ॥ ६४॥ लावण्यमधुराकारं करुणारसवारधिम् । भ्रुवोर्मध्ये
    सहस्रार्चिं एकबिल्वं शिवार्पणम् ॥ ६५॥ जटाधरं पावकाक्षं वृक्षेशं भूमिनायकम् । कामदं सर्वदागम्यं एकबिल्वं
    शिवार्पणम् ॥ ६६॥ शिवं शान्तं उमानाथं महाध्यानपरायणम् । ज्ञानप्रदं कृत्तिवासं एकबिल्वं शिवार्पणम् ॥
    ६७॥ वासुक्युरगहारं च लोकानुग्रहकारणम् । ज्ञानप्रदं कृत्तिवासं एकबिल्वं शिवार्पणम् ॥ ६८॥ शशाङ्कधारिणं
    भर्गं सर्वलोकैकशङ्करम् । शुद्धं च शाश्वतं नित्यं एकबिल्वं शिवार्पणम् ॥ ६९॥ शरणागतदीनार्तपरित्राणपरायणम्
    । गम्भीरं च वषट्कारं एकबिल्वं शिवार्पणम् ॥७०॥ भोक्तारं भोजनं भोज्यं जेतारं जितमानसम् । करणं कारणं
    जिष्णुं एकबिल्वं शिवार्पणम् ॥ ७१॥ क्षेत्रज्ञं क्षेत्रपालञ्च परार्धैकप्रयोजनम् । व्योमकेशं भीमवेषं
    एकबिल्वं शिवार्पणम् ॥ ७२॥ भवज्ञं तरुणोपेतं चोरिष्टं यमनाशनम् । हिरण्यगर्भं हेमाङ्गं एकबिल्वं शिवार्पणम्
    ॥ ७३॥ दक्षं चामुण्डजनकं मोक्षदं मोक्षनायकम् । हिरण्यदं हेमरूपं एकबिल्वं शिवार्पणम् ॥ ७४॥ महाश्मशाननिलयं
    प्रच्छन्नस्फटिकप्रभम् । वेदास्यं वेदरूपं च एकबिल्वं शिवार्पणम् ॥ ७५॥ स्थिरं धर्मं उमानाथं ब्रह्मण्यं
    चाश्रयं विभुम् । जगन्निवासं प्रथममेकबिल्वं शिवार्पणम् ॥ ७६॥ रुद्राक्षमालाभरणं रुद्राक्षप्रियवत्सलम्
    । रुद्राक्षभक्तसंस्तोममेकबिल्वं शिवार्पणम् ॥ ७७॥ फणीन्द्रविलसत्कण्ठं भुजङ्गाभरणप्रियम् । दक्षाध्वरविनाशं
    च एकबिल्वं शिवार्पणम् ॥ ७८॥ नागेन्द्रविलसत्कर्णं महीन्द्रवलयावृतम् । मुनिवन्द्यं मुनिश्रेष्ठमेकबिल्वं
    शिवार्पणम् ॥ ७९॥ मृगेन्द्रचर्मवसनं मुनीनामेकजीवनम् । सर्वदेवादिपूज्यं च एकबिल्वं शिवार्पणम् ॥ ८०॥
    निधनेशं धनाधीशं अपमृत्युविनाशनम् । लिङ्गमूर्तिमलिङ्गात्मं एकबिल्वं शिवार्पणम् ॥ ८१॥ भक्तकल्याणदं व्यस्तं
    वेदवेदान्तसंस्तुतम् । कल्पकृत्कल्पनाशं च एकबिल्वं शिवार्पणम् ॥ ८२॥ घोरपातकदावाग्निं जन्मकर्मविवर्जितम्
    । कपालमालाभरणं एकबिल्वं शिवार्पणम् ॥ ८३॥ मातङ्गचर्मवसनं विराड्रूपविदारकम् । विष्णुक्रान्तमनन्तं च
    एकबिल्वं शिवार्पणम् ॥ ८४॥ यज्ञकर्मफलाध्यक्षं यज्ञविघ्नविनाशकम् । यज्ञेशं यज्ञभोक्तारं एकबिल्वं शिवार्पणम्
    ॥ ८५॥ कालाधीशं त्रिकालज्ञं दुष्टनिग्रहकारकम् । योगिमानसपूज्यं च एकबिल्वं शिवार्पणम् ॥ ८६॥ महोन्नतमहाकायं
    महोदरमहाभुजम् । महावक्त्रं महावृद्धं एकबिल्वं शिवार्पणम् ॥ ८७॥ सुनेत्रं सुललाटं च सर्वभीमपराक्रमम्
    । महेश्वरं शिवतरं एकबिल्वं शिवार्पणम् ॥ ८८॥ समस्तजगदाधारं समस्तगुणसागरम् । सत्यं सत्यगुणोपेतं एकबिल्वं
    शिवार्पणम् ॥ ८९॥ माघकृष्णचतुर्दश्यां पूजार्थं च जगद्गुरोः । दुर्लभं सर्वदेवानां एकबिल्वं शिवार्पणम्
    ॥ ९०॥ तत्रापि दुर्लभं मन्येत् नभोमासेन्दुवासरे । प्रदोषकाले पूजायां एकबिल्वं शिवार्पणम् ॥ ९१॥ तटाकं
    धननिक्षेपं ब्रह्मस्थाप्यं शिवालयम् कोटिकन्यामहादानं एकबिल्वं शिवार्पणम् ॥ ९२॥ दर्शनं बिल्ववृक्षस्य
    स्पर्शनं पापनाशनम् । अघोरपापसंहारं एकबिल्वं शिवार्पणम् ॥ ९३॥ तुलसीबिल्वनिर्गुण्डी जम्बीरामलकं तथा
    । पञ्चबिल्वमिति ख्यातं एकबिल्वं शिवार्पणम् ॥ ९४॥ अखण्डबिल्वपत्रैश्च पूजयेन्नन्दिकेश्वरम् । मुच्यते
    सर्वपापेभ्यः एकबिल्वं शिवार्पणम् ॥ ९५॥ सालङ्कृता शतावृत्ता कन्याकोटिसहस्रकम् । साम्राज्यपृथ्वीदानं
    च एकबिल्वं शिवार्पणम् ॥ ९६॥ दन्त्यश्वकोटिदानानि अश्वमेधसहस्रकम् । सवत्सधेनुदानानि एकबिल्वं शिवार्पणम्
    ॥ ९७॥ चतुर्वेदसहस्राणि भारतादिपुराणकम् । साम्राज्यपृथ्वीदानं च एकबिल्वं शिवार्पणम् ॥ ९८॥ सर्वरत्नमयं
    मेरुं काञ्चनं दिव्यवस्त्रकम् । तुलाभागं शतावर्तं एकबिल्वं शिवार्पणम् ॥ ९९॥ अष्टोत्तरश्शतं बिल्वं योऽर्चयेल्लिङ्गमस्तके
    । अधर्वोक्तं अधेभ्यस्तु एकबिल्वं शिवार्पणम् ॥ १००॥ काशीक्षेत्रनिवासं च कालभैरवदर्शनम् । अघोरपापसंहारं
    एकबिल्वं शिवार्पणम् ॥ १०१॥ अष्टोत्तरशतश्लोकैः स्तोत्राद्यैः पूजयेद्यथा । त्रिसन्ध्यं मोक्षमाप्नोति
    एकबिल्वं शिवार्पणम् ॥ १०२॥ दन्तिकोटिसहस्राणां भूः हिरण्यसहस्रकम् । सर्वक्रतुमयं पुण्यं एकबिल्वं शिवार्पणम्
    ॥ १०३॥ पुत्रपौत्रादिकं भोगं भुक्त्वा चात्र यथेप्सितम् । अन्ते च शिवसायुज्यं एकबिल्वं शिवार्पणम् ॥
    १०४॥ विप्रकोटिसहस्राणां वित्तदानाच्च यत्फलम् । तत्फलं प्राप्नुयात्सत्यं एकबिल्वं शिवार्पणम् ॥ १०५॥
    त्वन्नामकीर्तनं तत्त्वं तवपादाम्बु यः पिबेत् । जीवन्मुक्तोभवेन्नित्यं एकबिल्वं शिवार्पणम् ॥ १०६॥ अनेकदानफलदं
    अनन्तसुकृतादिकम् । तीर्थयात्राखिलं पुण्यं एकबिल्वं शिवार्पणम् ॥ १०७॥ त्वं मां पालय सर्वत्र पदध्यानकृतं
    तव । भवनं शाङ्करं नित्यं एकबिल्वं शिवार्पणम् ॥ १०८॥ उमयासहितं देवं सवाहनगणं शिवम् । भस्मानुलिप्तसर्वाङ्गं
    एकबिल्वं शिवार्पणम् ॥ १०९॥ सालग्रामसहस्राणि विप्राणां शतकोटिकम् । यज्ञकोटिसहस्राणि एकबिल्वं शिवार्पणम्
    ॥ ११०॥ अज्ञानेन कृतं पापं ज्ञानेनाभिकृतं च यत् । तत्सर्वं नाशमायातु एकबिल्वं शिवार्पणम् ॥ १११॥ अमृतोद्भववृक्षस्य
    महादेवप्रियस्य च । मुच्यन्ते कण्टकाघातात् कण्टकेभ्यो हि मानवाः ॥ ११२॥ एकैकबिल्वपत्रेण कोटियज्ञफलं
    भवेत् । महादेवस्य पूजार्थं एकबिल्वं शिवार्पणम् ॥ ११३॥ एककाले पठेन्नित्यं सर्वशत्रुनिवारणम् । द्विकाले
    च पठेन्नित्यं मनोरथफलप्रदम् । त्रिकाले च पठेन्नित्यं आयुर्वर्ध्यो धनप्रदम् । अचिरात्कार्यसिद्धिं च
    लभते नात्र संशयः ॥ ११४॥ एककालं द्विकालं वा त्रिकालं यः पठेन्नरः । लक्ष्मीप्राप्तिश्शिवावासः शिवेन
    सह मोदते ॥ ११५॥ कोटिजन्मकृतं पापं अर्चनेन विनश्यति । सप्तजन्मकृतं पापं श्रवणेन विनश्यति । जन्मान्तरकृतं
    पापं पठनेन विनश्यति । दिवारात्रकृतं पापं दर्शनेन विनश्यति । क्षणेक्षणेकृतं पापं स्मरणेन विनश्यति ।
    पुस्तकं धारयेद्देही आरोग्यं भयनाशनम् ॥ ११६॥ इति बिल्वाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
