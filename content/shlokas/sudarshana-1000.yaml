id: sudarshana-1000
category: stotram
name:
  english: sudarshana 1000
  devanagari: सुदर्शन १०००
content:
  english: shankham cakram ca capam parashumasimishum shula pashankushabjam bibhranam vajrakhetau hala
    musala gada kundamatyugra damshtram | jvala kesham trinetram jvala dalananibham hara keyura bhusham
    dhyayet shatkona samstham sakala ripujana prana samhari cakram || || harih om || shricakrah shrikarah
    shrishah shrivishnuh shrivibhavanah | shrimadantya harah shriman shrivatsakrita lakshanah || 1|| shrinidhih
    shrivarah sragvi shrilakshmi karapujitah | shriratah shrivibhuh sindhukanyapatih adhokshajah || 2||
    acyutashcambujagrivah sahasrarah sanatanah | samarcito vedamurtih samatita suragrajah || 3|| shatkona
    madhyago virah sarvago'shtabhujah prabhuh | candavego bhimaravah shipivishtarcito harih || 4|| shashvatah
    sakalah shyamah shyamalah shakatarthanah | daityarih sharadaskandhah sakatakshah shirishagah || 5||
    sharaparirbhaktavashyah shashanko vamanovyayah | varuthivarijah kanjalocano vasudhadipah || 6|| varenyo
    vahano'nantah cakrapanirgadagrajah | gabhiro golakadhisho gadapanissulocanah || 7|| sahasrakshah caturbahuh
    shankhacakra gadadharah | bhishano bhitido bhadro bhimabhishta phalapradah || 8|| bhimarcito bhimaseno
    bhanuvamsha prakashakah | prahladavaradah balalocano lokapujitah || 9|| uttaramanado mani manavabhishta
    siddhidah | bhaktapalah papahari balado dahanadhvajah || 10|| karishah kanako data kamapala puratanah
    | akrurah krurajanakah kruradamshtrah kuladipah || 11|| krurakarma krurarupi krurahari kusheshayah
    | mandaro maninikanto madhuha madhavapriyah || 12|| supratapta svarnarupi banasura bhujantakrit |
    dharadharo danavarirdanujendrari pujitah || 13|| bhagyaprado mahasattvo vishvatma vigatajvarah | suracaryarcito
    vashyo vasudevo vasupradah || 14|| pranatartiharah shreshtah sharanyah papanashanah | pavako varanadrisho
    vaikuntho vigatakalmashah || 15|| vajradamshtro vajranakho vayurupi nirashrayah | niriho nispriho
    nityo nitijno nitipavanah || 16|| nirupo naradanuto nakulacala vasakrit | nityanando brihadbhanuh
    brihadishah puratanah || 17|| nidhinamadhipo'nando narakarnava tarakah | agadho'viralo martyo jvalakeshah
    kakarccitah || 18|| tarunastanukrit bhaktah paramah cittasambhavah | cintyassatvanidhih sagrascidanandah
    shivapriyah || 19|| shinshumarashshatamakhah shatakumbha nibhaprabhah | bhoktarunesho balavan balagraha
    nivarakah || 20|| sarvarishta prashamano mahabhaya nivarakah | bandhuh subandhuh supritassantushtassurasannutah
    || 21|| bijakeshyo bako bhanuh amitarcirpampatih | suyajno jyotishashshanto virupakshah sureshvarah
    || 22|| vahniprakara samvito raktagarbhah prabhakarah | sushilah subhagah svakshah sumukhah sukhadah
    sukhi || 23|| mahasurah shiraccheta pakashasana vanditah | shatamurti sahasraro hiranya jyotiravyayah
    || 24|| mandali mandalakarah candrasuryagni locanah | prabhanjanah tikshnadharah prashantah sharadapriyah
    || 25|| bhaktapriyo baliharo lavanyolakshanapriyah | vimalo durlabhassomyassulabho bhimavikramah ||
    26|| jitamanyuh jitaratih mahaksho bhrigupujitah | tattvarupah tattvavedih sarvatatva pratishthitah
    ||27|| bhavajno bandhujanako dinabandhuh puranavit | shastresho nirmato neta naro nanasurapriyah ||
    28|| nabhicakro natamitro nadhisha karapujitah | damanah kalikah karmi kantah kalarthanah kavih ||
    29|| vasundharo vayuvego varaho varunalayah | kamaniyakritih kalah kamalasana sevitah | kripaluh kapilah
    kami kamitartha pradayakah || 30|| dharmaseturdharmapalo dharmi dharmamayah parah | jvalajimhah shikhamauḻih
    surakarya pravartakah || 31|| kaladharah surarighnah kopaha kalarupadrik | data''nandamayo divyo brahmarupi
    prakashakrit || 32 | sarvayajnamayo yajno yajnabhuk yajnabhavanah | vahnidhvajo vahnisakho vanjuḻadruma
    mulakah || 33|| dakshaha danakari ca naro narayanapriyah | daityadandadharo dantah shubhrangah shubhadayakah
    || 34|| lohitaksho maharaudrau mayarupadharah khagah | unnato bhanujah sango mahacakrah parakrami
    || 35|| agnisho'gnimayah dvagnilocanogni samaprabhah | agnimanagnirasano yuddhasevi ravipriyah ||
    36|| ashrita ghaugha vidhvamsi nityananda pradayakah | asuraghno mahabahurbhimakarma shubhapradah
    || 37|| shashanka pranavadharah samasthashi vishapahah | tarko vitarko vimalo bilako badarayanah ||
    38|| badiragnascakravaḻah shatkonantargatasshikhih | dritadhanva shodashaksho dirghabahurdarimukhah
    || 39|| prasanno vamajanako nimno nitikarah shucih | narabhedi simharupi puradhishah purandarah ||
    40|| ravistuto yutapalo yutaparissatangatih | hrishikesho dvitramurtih dvirashtayudabhrit varah ||
    41|| divakaro nishanatho diliparcita vigrahah | dhanvantarisshyamaḻarirbhaktashoka vinashakah || 42||
    ripuprana haro jeta shurascaturya vigrahah | vidhata saccidanandassarvadushta nivarakah || 43|| ulko
    maholko raktolkassahasrolkasshatarcishah | buddho bauddhaharo bauddha janamoho budhashrayah || 44
    || purnabodhah purnarupah purnakamo mahadyutih | purnamantrah purnagatrah purnashadgunya vigrahah
    || 45|| purnanemih purnanabhih purnashi purnamanasah | purnasarah purnashaktih rangasevi ranapriyah
    || 46|| puritasho'rishtadati purnarthah purnabhushanah | padmagarbhah parijatah paramitrassharakritih
    || 47|| bhubritvapuh punyamurti bhubhritam patirashukah | bhagyodayo bhaktavashyo girijavallabhapriyah
    || 48|| gavishto gajamanisho gamanagamana priyah | brahmacari bandhumani supratikassuvikramah || 49||
    shankarabhishtado bhavyah sacivyassavyalakshanah | mahahamsassukhakaro nabhaga tanayarcitah || 50||
    kotisuryaprabho dipto vidyutkoti samaprabhah | vajrakalpo vajrasakho vajranirghata nisvanah || 51||
    girisho manado manyo narayana karalayah | aniruddhah paramarshi upendrah purnavigrahah || 52|| ayudheshasshatarighnah
    shamanah shatasainikah | sarvasura vadhodyuktah surya durmana bhedakah || 53|| rahuviploshakari ca
    kashinagara dahakah | piyushamshu paranjyotih sampurna kratubhuk prabhuh || 54|| mandhatri varadasshuddho
    harasevyasshacishtadah | sahishnurbalabhuk viro lokabhrillokanayakah ||55|| durvasomuni darpaghno
    jayato vijayapriyah | puradhisho'suraratih govinda karabhushanah || 56|| ratharupi rathadhishah kalacakra
    kripanidhih | cakrarupadharo vishnuh sthulasukshmashshikhiprabhah || 57|| sharanagata santrata vetaḻarirmahabalah
    | jnanado vakpatirmani mahavego mahamanih || 58|| vidyut kesho vihareshah padmayonih caturbhujah |
    kamatma kamadah kami kalanemi shiroharah || 59|| shubhrasshucisshunasirah shukramitrah shubhananah
    | vrishakayo vrisharatih vrishabhendra supujitah || 60|| vishvambharo vitihotro viryo vishvajanapriyah
    | vishvakrit vishvabho vishvaharta sahasakarmakrit || 61|| banabahuharo jyotih paratma shokanashanah
    | vimaladipatih punyo jnata jneyah prakashakah || 62|| mleccha prahari dushtaghnah suryamandalamadhyagah
    | digambaro vrishadrisho vividhayudha rupakah || 63|| satvavan satyavagishah satyadharma parayanah
    | rudrapritikaro rudra varado rugvibhedakah || 64|| narayano nakrabhedi gajendra parimokshakah | dharmapriyah
    shadadharo vedatma gunasagarah || 65|| gadamitrah prithubhujo rasatala vibhedakah | tamovairi mahatejah
    maharajo mahatapah || 66|| samastariharah shanta kruro yogeshvareshvarah | sthavirassvarna varnangah
    shatrusainya vinashakrit || 67|| prajno vishvatanutrata sha
  devanagari: शङ्खं चक्रं च चापं परशुमसिमिशुं शूल पाशाङ्कुशाब्जम् बिभ्राणं वज्रखेटौ हल मुसल गदा कुन्दमत्युग्र
    दंष्ट्रम् । ज्वाला केशं त्रिनेत्रं ज्वल दलननिभं हार केयूर भूषम् ध्यायेत् षट्कोण संस्थं सकल रिपुजन
    प्राण संहारि चक्रम् ॥ ॥ हरिः ॐ ॥ श्रीचक्रः श्रीकरः श्रीशः श्रीविष्णुः श्रीविभावनः । श्रीमदान्त्य हरः
    श्रीमान् श्रीवत्सकृत लक्षणः ॥ १॥ श्रीनिधिः श्रीवरः स्रग्वी श्रीलक्ष्मी करपूजितः । श्रीरतः श्रीविभुः
    सिन्धुकन्यापतिः अधोक्षजः ॥ २॥ अच्युतश्चाम्बुजग्रीवः सहस्रारः सनातनः । समर्चितो वेदमूर्तिः समतीत सुराग्रजः
    ॥ ३॥ षट्कोण मध्यगो वीरः सर्वगोऽष्टभुजः प्रभुः । चण्डवेगो भीमरवः शिपिविष्टार्चितो हरिः ॥ ४॥ शाश्वतः
    सकलः श्यामः श्यामलः शकटार्थनः । दैत्यारिः शारदस्कन्धः सकटाक्षः शिरीषगः ॥ ५॥ शरपारिर्भक्तवश्यः शशाङ्को
    वामनोव्ययः । वरूथीवारिजः कञ्जलोचनो वसुधादिपः ॥ ६॥ वरेण्यो वाहनोऽनन्तः चक्रपाणिर्गदाग्रजः । गभीरो गोलकाधीशो
    गदापणिस्सुलोचनः ॥ ७॥ सहस्राक्षः चतुर्बाहुः शङ्खचक्र गदाधरः । भीषणो भीतिदो भद्रो भीमाभीष्ट फलप्रदः
    ॥ ८॥ भीमार्चितो भीमसेनो भानुवंश प्रकाशकः । प्रह्लादवरदः बाललोचनो लोकपूजितः ॥ ९॥ उत्तरामानदो मानी मानवाभीष्ट
    सिद्धिदः । भक्तपालः पापहारी बलदो दहनध्वजः ॥ १०॥ करीशः कनको दाता कामपाल पुरातनः । अक्रूरः क्रूरजनकः
    क्रूरदंष्ट्रः कुलादिपः ॥ ११॥ क्रूरकर्मा क्रूररूपि क्रूरहारी कुशेशयः । मन्दरो मानिनीकान्तो मधुहा माधवप्रियः
    ॥ १२॥ सुप्रतप्त स्वर्णरूपी बाणासुर भुजान्तकृत् । धराधरो दानवारिर्दनुजेन्द्रारि पूजितः ॥ १३॥ भाग्यप्रदो
    महासत्त्वो विश्वात्मा विगतज्वरः । सुराचार्यार्चितो वश्यो वासुदेवो वसुप्रदः ॥ १४॥ प्रणतार्तिहरः श्रेष्टः
    शरण्यः पापनाशनः । पावको वारणाद्रीशो वैकुण्ठो विगतकल्मषः ॥ १५॥ वज्रदंष्ट्रो वज्रनखो वायुरूपी निराश्रयः
    । निरीहो निस्पृहो नित्यो नीतिज्ञो नीतिपावनः ॥ १६॥ नीरूपो नारदनुतो नकुलाचल वासकृत् । नित्यानन्दो बृहद्भानुः
    बृहदीशः पुरातनः ॥ १७॥ निधिनामधिपोऽनन्दो नरकार्णव तारकः । अगाधोऽविरलो मर्त्यो ज्वालाकेशः ककार्च्चितः
    ॥ १८॥ तरुणस्तनुकृत् भक्तः परमः चित्तसम्भवः । चिन्त्यस्सत्वनिधिः साग्रस्चिदानन्दः शिवप्रियः ॥ १९॥ शिन्शुमारश्शतमखः
    शातकुम्भ निभप्रभः । भोक्तारुणेशो बलवान् बालग्रह निवारकः ॥ २०॥ सर्वारिष्ट प्रशमनो महाभय निवारकः । बन्धुः
    सुबन्धुः सुप्रीतस्सन्तुष्टस्सुरसन्नुतः ॥ २१॥ बीजकेश्यो बको भानुः अमितार्चिर्पाम्पतिः । सुयज्ञो ज्योतिषश्शान्तो
    विरूपाक्षः सुरेश्वरः ॥ २२॥ वह्निप्राकार संवीतो रक्तगर्भः प्रभाकरः । सुशीलः सुभगः स्वक्षः सुमुखः सुखदः
    सुखी ॥ २३॥ महासुरः शिरच्छेता पाकशासन वन्दितः । शतमूर्ति सहस्रारो हिरण्य ज्योतिरव्ययः ॥ २४॥ मण्डली
    मण्डलाकारः चन्द्रसूर्याग्नि लोचनः । प्रभञ्जनः तीक्ष्णधारः प्रशान्तः शारदप्रियः ॥ २५॥ भक्तप्रियो बलिहरो
    लावण्योलक्षणप्रियः । विमलो दुर्लभस्सोम्यस्सुलभो भीमविक्रमः ॥ २६॥ जितमन्युः जितारातिः महाक्षो भृगुपूजितः
    । तत्त्वरूपः तत्त्ववेदिः सर्वतत्व प्रतिष्ठितः ॥२७॥ भावज्ञो बन्धुजनको दीनबन्धुः पुराणवित् । शस्त्रेशो
    निर्मतो नेता नरो नानासुरप्रियः ॥ २८॥ नाभिचक्रो नतामित्रो नधीश करपूजितः । दमनः कालिकः कर्मी कान्तः
    कालार्थनः कविः ॥ २९॥ वसुन्धरो वायुवेगो वराहो वरुणालयः । कमनीयकृतिः कालः कमलासन सेवितः । कृपालुः कपिलः
    कामी कामितार्थ प्रदायकः ॥ ३०॥ धर्मसेतुर्धर्मपालो धर्मी धर्ममयः परः । ज्वालाजिम्हः शिखामौळीः सुरकार्य
    प्रवर्तकः ॥ ३१॥ कलाधरः सुरारिघ्नः कोपहा कालरूपदृक् । दाताऽऽनन्दमयो दिव्यो ब्रह्मरूपी प्रकाशकृत् ॥
    ३२ । सर्वयज्ञमयो यज्ञो यज्ञभुक् यज्ञभावनः । वह्निध्वजो वह्निसखो वञ्जुळद्रुम मूलकः ॥ ३३॥ दक्षहा दानकारी
    च नरो नारायणप्रियः । दैत्यदण्डधरो दान्तः शुभ्राङ्गः शुभदायकः ॥ ३४॥ लोहिताक्षो महारौद्रौ मायारूपधरः
    खगः । उन्नतो भानुजः साङ्गो महाचक्रः पराक्रमी ॥ ३५॥ अग्नीशोऽग्निमयः द्वग्निलोचनोग्नि समप्रभः । अग्निमानग्निरसनो
    युद्धसेवी रविप्रियः ॥ ३६॥ आश्रित घौघ विध्वंसी नित्यानन्द प्रदायकः । असुरघ्नो महाबाहूर्भीमकर्मा शुभप्रदः
    ॥ ३७॥ शशाङ्क प्रणवाधारः समस्थाशी विषापहः । तर्को वितर्को विमलो बिलको बादरायणः ॥ ३८॥ बदिरग्नस्चक्रवाळः
    षट्कोणान्तर्गतस्शिखीः । दृतधन्वा शोडषाक्षो दीर्घबाहूर्दरीमुखः ॥ ३९॥ प्रसन्नो वामजनको निम्नो नीतिकरः
    शुचिः । नरभेदि सिंहरूपी पुराधीशः पुरन्दरः ॥ ४०॥ रविस्तुतो यूतपालो युतपारिस्सताङ्गतिः । हृषिकेशो द्वित्रमूर्तिः
    द्विरष्टायुदभृत् वरः ॥ ४१॥ दिवाकरो निशानाथो दिलीपार्चित विग्रहः । धन्वन्तरिस्श्यामळारिर्भक्तशोक विनाशकः
    ॥ ४२॥ रिपुप्राण हरो जेता शूरस्चातुर्य विग्रहः । विधाता सच्चिदानन्दस्सर्वदुष्ट निवारकः ॥ ४३॥ उल्को
    महोल्को रक्तोल्कस्सहस्रोल्कस्शतार्चिषः । बुद्धो बौद्धहरो बौद्ध जनमोहो बुधाश्रयः ॥ ४४ ॥ पूर्णबोधः पूर्णरूपः
    पूर्णकामो महाद्युतिः । पूर्णमन्त्रः पूर्णगात्रः पूर्णषाड्गुण्य विग्रहः ॥ ४५॥ पूर्णनेमिः पूर्ननाभिः
    पूर्णाशी पूर्णमानसः । पूर्णसारः पूर्णशक्तिः रङ्गसेवि रणप्रियः ॥ ४६॥ पूरिताशोऽरिष्टदाति पूर्णार्थः
    पूर्णभूषणः । पद्मगर्भः पारिजातः परमित्रस्शराकृतिः ॥ ४७॥ भूबृत्वपुः पुण्यमूर्ति भूभृतां पतिराशुकः ।
    भाग्योदयो भक्तवश्यो गिरिजावल्लभप्रियः ॥ ४८॥ गविष्टो गजमानीशो गमनागमन प्रियः । ब्रह्मचारि बन्धुमानी
    सुप्रतीकस्सुविक्रमः ॥ ४९॥ शङ्कराभीष्टदो भव्यः साचिव्यस्सव्यलक्षणः । महाहंसस्सुखकरो नाभाग तनयार्चितः
    ॥ ५०॥ कोटिसूर्यप्रभो दीप्तो विद्युत्कोटि समप्रभः । वज्रकल्पो वज्रसखो वज्रनिर्घात निस्वनः ॥ ५१॥ गिरीशो
    मानदो मान्यो नारायण करालयः । अनिरुद्धः परामर्षी उपेन्द्रः पूर्णविग्रहः ॥ ५२॥ आयुधेशस्शतारिघ्नः शमनः
    शतसैनिकः । सर्वासुर वधोद्युक्तः सूर्य दुर्मान भेदकः ॥ ५३॥ राहुविप्लोषकारी च काशीनगर दाहकः । पीयुषांशु
    परञ्ज्योतिः सम्पूर्ण क्रतुभुक् प्रभुः ॥ ५४॥ मान्धातृ वरदस्शुद्धो हरसेव्यस्शचीष्टदः । सहिष्णुर्बलभुक्
    वीरो लोकभृल्लोकनायकः ॥५५॥ दुर्वासोमुनि दर्पघ्नो जयतो विजयप्रियः । पुराधीशोऽसुरारातिः गोविन्द करभूषणः
    ॥ ५६॥ रथरूपी रथाधीशः कालचक्र कृपानिधिः । चक्ररूपधरो विष्णुः स्थूलसूक्ष्मश्शिखिप्रभः ॥ ५७॥ शरणागत सन्त्राता
    वेताळारिर्महाबलः । ज्ञानदो वाक्पतिर्मानी महावेगो महामणिः ॥ ५८॥ विद्युत् केशो विहारेशः पद्मयोनिः चतुर्भुजः
    । कामात्मा कामदः कामी कालनेमि शिरोहरः ॥ ५९॥ शुभ्रस्शुचीस्शुनासीरः शुक्रमित्रः शुभाननः । वृषकायो वृषारातिः
    वृषभेन्द्र सुपूजितः ॥ ६०॥ विश्वम्भरो वीतिहोत्रो वीर्यो विश्वजनप्रियः । विश्वकृत् विश्वभो विश्वहर्ता
    साहसकर्मकृत् ॥ ६१॥ बाणबाहूहरो ज्योतिः परात्मा शोकनाशनः । विमलादिपतिः पुण्यो ज्ञाता ज्ञेयः प्रकाशकः
    ॥ ६२॥ म्लेच्छ प्रहारी दुष्टघ्नः सूर्यमण्डलमध्यगः । दिगम्बरो वृशाद्रीशो विविधायुध रूपकः ॥ ६३॥ सत्ववान्
    सत्यवागीशः सत्यधर्म परायणः । रुद्रप्रीतिकरो रुद्र वरदो रुग्विभेदकः ॥ ६४॥ नारायणो नक्रभेदी गजेन्द्र
    परिमोक्षकः । धर्मप्रियः षडाधारो वेदात्मा गुणसागरः ॥ ६५॥ गदामित्रः पृथुभुजो रसातल विभेदकः । तमोवैरी
    महातेजाः महाराजो महातपाः ॥ ६६॥ समस्तारिहरः शान्त क्रूरो योगेश्वरेश्वरः । स्थविरस्स्वर्ण वर्णाङ्गः
    शत्रुसैन्य विनाशकृत् ॥ ६७॥ प्राज्ञो विश्वतनुत्राता श
