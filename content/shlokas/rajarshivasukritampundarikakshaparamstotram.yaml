id: rajarshivasukritampundarikakshaparamstotram
category: stotram
name:
  english: rajarshivasukritampundarikakshaparamstotram
  devanagari: राजर्षिवसुकृतंपुण्डरीकाक्षपारंस्तोत्रम्
content:
  english: rajarshivasukritam pundarikakshaparam stotram rajarshirvasuruvaca | namaste pundarikaksha namaste
    madhusudana | namaste sarvalokesha namaste tigmacakrine || 10|| vishvamurtim mahabahum varadam sarvatejasam
    | namami pundarikaksham vidya'vidyatmakam vibhum || 11|| adidevam mahadevam vedavedangaparagam | gambhiram
    sarvadevanam namami madhusudanam || 12|| vishvamurtim mahamurtim vidyamurtim trimurtikam | kavacam
    sarvadevanam namasye varijekshanam || 13|| sahasrashirshinam devam sahasraksham mahabhujam | jagatsamvyapya
    tishthantam namasye parameshvaram || 14|| sharanyam sharanam devam vishnum jishnum sanatanam | nilameghapratikasham
    namasye cakrapaninam || 15|| shuddham sarvagatam nityam vyomarupam sanatanam | bhavabhavavinirmuktam
    namasye sarvagam harim || 16|| nanyatkincit prapashyami vyatiriktam tvaya'cyuta | tvanmayam ca prapashyami
    sarvametaccaracaram || 17|| iti varahapurane shashthadhyayantargatam rajarshivasukritam pundarikakshaparam
    stotram samaptam | varahapurana | adhyaya 6
  devanagari: राजर्षिवसुकृतं पुण्डरीकाक्षपारं स्तोत्रम् राजर्षिर्वसुरुवाच । नमस्ते पुण्डरीकाक्ष नमस्ते
    मधुसूदन । नमस्ते सर्वलोकेश नमस्ते तिग्मचक्रिणे ॥ १०॥ विश्वमूर्तिं महाबाहुं वरदं सर्वतेजसम् । नमामि
    पुण्डरीकाक्षं विद्याऽविद्यात्मकं विभुम् ॥ ११॥ आदिदेवं महादेवं वेदवेदाङ्गपारगम् । गम्भीरं सर्वदेवानां
    नमामि मधुसूदनम् ॥ १२॥ विश्वमूर्तिं महामूर्तिं विद्यामूर्तिं त्रिमूर्तिकम् । कवचं सर्वदेवानां नमस्ये
    वारिजेक्षणम् ॥ १३॥ सहस्रशीर्षिणं देवं सहस्राक्षं महाभुजम् । जगत्संव्याप्य तिष्ठन्तं नमस्ये परमेश्वरम्
    ॥ १४॥ शरण्यं शरणं देवं विष्णुं जिष्णुं सनातनम् । नीलमेघप्रतीकाशं नमस्ये चक्रपाणिनम् ॥ १५॥ शुद्धं सर्वगतं
    नित्यं व्योमरूपं सनातनम् । भावाभावविनिर्मुक्तं नमस्ये सर्वगं हरिम् ॥ १६॥ नान्यत्किञ्चित् प्रपश्यामि
    व्यतिरिक्तं त्वयाऽच्युत । त्वन्मयं च प्रपश्यामि सर्वमेतच्चराचरम् ॥ १७॥ इति वराहपुराणे षष्ठाध्यायान्तर्गतं
    राजर्षिवसुकृतं पुण्डरीकाक्षपारं स्तोत्रं समाप्तम् । वराहपुराण । अध्याय ६
