id: ashvashirastotram-vyasaproktam-mahabharatantargatam
category: stotram
name:
  english: ashvashirastotram (vyasaproktam mahabharatantargatam)
  devanagari: अश्वशिरास्तोत्रम् (व्यासप्रोक्तं महाभारतान्तर्गतम्)
content:
  english: vyasaproktam ashvashirastotram etaddhayashiro rajannakhyanam tava kirtitam | puranam vedasamitam
    yanmam tvam paripricchasi || 72|| yam yamicchettanum devah kartum karyavidhau kvacit | tam tam kuryadvikurvanah
    svayamatmanamatmana || 73|| esha vedanidhih shrimanesha vai tapaso nidhih | esha yogashca sankhyam
    ca brahma cagryam harirvibhuh || 74|| narayanapara veda yajna narayanatmakah | tapo narayanaparam
    narayanapara gatih || 75|| narayanaparam satyamritam narayanatmakam | narayanaparo dharmah punaravrittidurlabhah
    || 76|| pravrittilakshanashcaiva dharmo narayanatmakah | narayanatmako gandho bhumau shreshthatamah
    smritah || 77|| apam caiva guno rajan raso narayanatmakah | jyotisham ca guno rupam smritam narayanatmakam
    || 78|| narayanatmakashcapi sparsho vayugunah smritah | narayanatmakashcapi shabda akashasambhavah
    || 79|| manashcapi tato bhutamavyaktagunalakshanam | narayanaparah kalo jyotishamayanam ca yat ||
    80|| narayanapara kirtih shrishca lakshmishca devatah | narayanaparam sankhyam yogo narayanatmakah
    || 81|| karanam purusho yesham pradhanam capi karanam | svabhavashcaiva karmani daivam yesham ca karanam
    || 82|| pancakaranasankhyato nishtha sarvatra vai harih | tattvam jijnasamananam hetubhih sarvatomukhaih
    || 83|| tattvameko mahayogi harirnarayanah prabhuh | sabrahmakanam lokanamrishinam ca mahatmanam ||
    84|| sankhyanam yoginam capi yatinamatmavedinam | manishitam vijanati keshavo na tu tasya te || 85||
    ye kecitsarvalokeshu daivam pitryam ca kurvate | danani ca prayacchanti tapyanti ca tapo mahat ||
    86|| sarveshamashrayo vishnuraishvaram vidhimasthitah | sarvabhutakritavaso vasudeveti cocyate ||
    87|| ayam hi nityah paramo maharshirmahavibhutirgunavannirgunakhyah | gunaishca samyogamupaiti shighram
    kalo yathartavritusamprayuktah || 88|| naivasya vindanti gatim mahatmano na cagatim kashcidihanupashyati
    | jnanatmakah samyamino maharshayah pashyanti nityam purusham gunadhikam || 89|| iti mahabharate shantaraparvani
    335 adhyayantargatam vyasaproktam ashvashirastotram sampurnam | mahabharata | shantiparva | adhyaya
    335
  devanagari: व्यासप्रोक्तं अश्वशिरास्तोत्रम् एतद्धयशिरो राजन्नाख्यानं तव कीर्तितम् । पुराणं वेदसमितं
    यन्मां त्वं परिपृच्छसि ॥ ७२॥ यां यामिच्छेत्तनुं देवः कर्तुं कार्यविधौ क्वचित् । तां तां कुर्याद्विकुर्वाणः
    स्वयमात्मानमात्मना ॥ ७३॥ एष वेदनिधिः श्रीमानेष वै तपसो निधिः । एष योगश्च साङ्ख्यं च ब्रह्म चाग्र्यं
    हरिर्विभुः ॥ ७४॥ नारायणपरा वेदा यज्ञा नारायणात्मकाः । तपो नारायणपरं नारायणपरा गतिः ॥ ७५॥ नारायणपरं
    सत्यमृतं नारायणात्मकम् । नारायणपरो धर्मः पुनरावृत्तिदुर्लभः ॥ ७६॥ प्रवृत्तिलक्षणश्चैव धर्मो नारायणात्मकः
    । नारायणात्मको गन्धो भूमौ श्रेष्ठतमः स्मृतः ॥ ७७॥ अपां चैव गुणो राजन् रसो नारायणात्मकः । ज्योतिषां
    च गुणो रूपं स्मृतं नारायणात्मकम् ॥ ७८॥ नारायणात्मकश्चापि स्पर्शो वायुगुणः स्मृतः । नारायणात्मकश्चापि
    शब्द आकाशसम्भवः ॥ ७९॥ मनश्चापि ततो भूतमव्यक्तगुणलक्षणम् । नारायणपरः कालो ज्योतिषामयनं च यत् ॥ ८०॥
    नारायणपरा कीर्तिः श्रीश्च लक्ष्मीश्च देवताः । नारायणपरं साङ्ख्यं योगो नारायणात्मकः ॥ ८१॥ कारणं पुरुषो
    येषां प्रधानं चापि कारणम् । स्वभावश्चैव कर्माणि दैवं येषां च कारणम् ॥ ८२॥ पञ्चकारणसङ्ख्यातो निष्ठा
    सर्वत्र वै हरिः । तत्त्वं जिज्ञासमानानां हेतुभिः सर्वतोमुखैः ॥ ८३॥ तत्त्वमेको महायोगी हरिर्नारायणः
    प्रभुः । सब्रह्मकानां लोकानामृषीणां च महात्मनाम् ॥ ८४॥ साङ्ख्यानां योगिनां चापि यतीनामात्मवेदिनाम्
    । मनीषितं विजानाति केशवो न तु तस्य ते ॥ ८५॥ ये केचित्सर्वलोकेषु दैवं पित्र्यं च कुर्वते । दानानि च
    प्रयच्छन्ति तप्यन्ति च तपो महत् ॥ ८६॥ सर्वेषामाश्रयो विष्णुरैश्वरं विधिमास्थितः । सर्वभूतकृतावासो
    वासुदेवेति चोच्यते ॥ ८७॥ अयं हि नित्यः परमो महर्षिर्महाविभूतिर्गुणवान्निर्गुणाख्यः । गुणैश्च संयोगमुपैति
    शीघ्रं कालो यथर्तावृतुसम्प्रयुक्तः ॥ ८८॥ नैवास्य विन्दन्ति गतिं महात्मनो न चागतिं कश्चिदिहानुपश्यति
    । ज्ञानात्मकाः संयमिनो महर्षयः पश्यन्ति नित्यं पुरुषं गुणाधिकम् ॥ ८९॥ इति महाभारते शान्तरपर्वणि ३३५
    अध्यायान्तर्गतं व्यासप्रोक्तं अश्वशिरास्तोत्रं सम्पूर्णम् । महाभारत । शान्तिपर्व । अध्याय ३३५
