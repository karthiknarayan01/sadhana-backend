id: rudrasahasranamastotrabhringiriti
category: sahasranama
name:
  english: rudrasahasranamastotrabhringiriti
  devanagari: रुद्रसहस्रनामस्तोत्रभ्रिन्गिरिटि
content:
  english: ringagranilayo rajataprabhah | ratapriyo rahahpujyo ramaniyagunakarah || 119|| rathakaro rathapatih
    ratho ratnakarapriyah | rathotsavapriyo rasyo rajogunavinashakrit || 120|| ratnadolotsavaprito ranatkimkinimekhalah
    | ratnado rajako ragi rangavidyavisharadah || 121|| ratnapujanasantushto ratnasanusharasanah | ratnamandapamadhyastho
    ratnagraiveyakundalah || 122|| ratnakarastuto ratnapithastho ranapanditah | ratnabhishekasantushto
    ratnakancanabhushanah || 123|| ratnanguliyavalayo rajatkarasaroruhah | ramapatistuto ramyo rajamandalamadhyagah
    || 124|| ramavanisamaradhyo rajyado ratnabhushanah | rambhadisundarisevyo rakshoha rakinipriyah ||
    125|| ravicandragninayano ratnamalyambarapriyah | ravimandalamadhyastho ravikotisamaprabhah || 126||
    rakenduvadano ratrincarapranapaharakah | rajarajapriyo raudro ruruhasto rurupriyah || 127|| rajarajeshvaro
    rajapujito rajyavardhanah | ramarcitapadadvandvo ravanarcitavigrahah || 128|| rajavashyakaro raja
    rashikritajagattrayah | rajivacarano rajashekharo ravilocanah || 129|| rajivapushpasamkasho rajivaksho
    ranotsukah | ratrincarajanadhyaksho ratrincaranishevitah || 130|| radhamadhavasamsevyo radhamadhavavallabhah
    | rukmangadastuto rudro rajassatvatamomayah || 131|| rudramantrajapaprito rudramandalasevitah | rudrakshajapasupito
    rudralokapradayakah || 132|| rudrakshamalabharano rudraniprananayakah | rudranipujanaprito rudrakshamakutojvalah
    || 133|| rurucarmaparidhano rukmangadaparishkritah | rephasvarupo rudratma rudradhyayajapapriyah ||
    134|| renukavarado ramo rupahino ravistutah | revanaditiravasi rohinipativallabhah || 135|| rogesho
    rogashamano raido raktabalipriyah | rambijajapasantushto rajivakusumapriyah || 136|| rambhaphalapriyo
    raudradrik rakshakara rupavan | dakararupo devesho darasmeramukhambujah || 137|| darandolitadirghaksho
    dronapushparcanapriyah | daksharadhyo dakshakanyapatirdakshavarapradah || 138|| dakshinadakshinaradhyo
    dakshinamurtirupabhrit | dadimibijaradano dadimikusumapriyah || 139 danto dakshamakhadhvamsi dando
    damayita damah | daridryadhvamsako data dayalurdanavantakah || 140 darukaranyanilayo dashadikpalapujitah
    | dakshayanisamaradhyo danujarirdayanidhih || 141 divyayudhadharo divyamalyambaravibhushanah | digambaro
    danarupo durvasamunipujitah || 142|| divyantarikshagamano duradharsho dayatmakah | dugdhabhishecanaprito
    duhkhadoshavivarjitah || 143|| duracaraprashamano dugdhannapritamanasah | durlabho durgamo durgo duhkhahanta
    durartiha || 144|| durvasa dushtabhayado durjayo duratiktamah | dushtahanta devasainyapatirdambhavivarjitah
    || 145|| duhsvapnanashano dushtaduro durvaravittamah | durvayugmasamaradhyo dutturakusumapriyah ||
    146|| devagangajatajuto devatapranavallabhah | devatartiprashamano dinadainyavimocanah || 147|| devadevo
    daityaguruh dandanathaprapujitah | devabhogyo devayogyo diptamurtirdivaspatih || 148|| devarshivaryo
    devarshivandito devabhogadah | devadidevo devejyo daityadarpanishudanah || 149|| devasuraganadhyaksho
    devasuraganagranih | devasura tapastushto devasuravarapradah || 150|| devasureshvararadhyo devantakavarapradah
    | devasureshvaro devo devasuramaheshvarah || 151|| devendrarakshako dirgho devavrindanishevitah |
    deshakalaparijnata deshopadravanashakah || 152|| doshakarakalamaulirdurvarabhujavikramah | dandakaranyanilayo
    dandi dandaprasadakah || 153|| dandanitirduravaso dyoto durmatinashanah | dvandvatito dirghadarshi
    danadhyaksho dayaparah || 154|| yakararupo yantratma yantraradhanatatparah | yajamanadyashtamurtiryaminicaradarpaha
    || 155|| yajurvedapriyo yuddhamarmajno yuddhakaushalah | yatnasadhyo yashtidharo yajamanapriyo yajuh
    || 156|| yathartharupo yugakridyugarupo yugantakrit | yathoktaphalado yoshapujanapritamanasah || 157||
    yadricchalabhasantushto yacakartinishudanah | yantrasano yantramayo yantramantrasvarupakah || 158||
    yamarupo yamarupo yamabadhanivartakah | yamadiyoganirato yogamargapradarshakah || 159|| yavakshatarcanarato
    yavacihnitapadukah | yaksharajasakho yajno yakshesho yakshapujitah || 160|| yaksharakshasasamsevyo
    yatudhanavarapradah | yajnaguhyo yajnakarta yajamanasvarupakah || 161|| yajnantakridyajnapujyo yajnabhugyajnavahanah
    | yagapriyo yanasevyo yuva yauvanagarvitah || 162|| yatayatadirahito yatidharmaparayanah | yatrapriyo
    yamiyamyadandapashanikrintanah || 163|| yatraphalaprado yukto yashasvi yamunapriyah | yadahpatiryajnapatiryatiryajnaparayanah
    || 164|| yadavanam priyo yoddha yodharandhana tatparah | yamapujanasantushto yoshitsangavivarjitah
    || 165|| yaminipatisamsevyo yoginiganasevitah | yayajuko yugavarto yacnarupo yatheshtadah || 166||
    yavaudanapritacitto yonishtho yaminipriyah | yajnavalkyapriyo yajva yajnesho yajnasadhanah || 167||
    yogamayamayo yogamayasamvritavigrahah | yogasiddho yogisevyo yoganandasvarupakah || 168|| yogakshemakaro
    yogakshemadata yashaskarah | yogi yogasanaradhyo yogango yogasangrahah || 169|| yogishvareshvaro yogyo
    yogadata yugandharah | yoshitpriyo yadupatiryoshardhikritavigrahah || 170|| yambijajapasantushto yantresho
    yantrasadhanah | yantramadhyasthito yantri yogishvarasamashritah || 171|| || uttarapithika || etatte
    kathitam vishno rudranamasahasrakam | shravanatpathanaccaiva mananacca phalapradam || 1|| dharmarthikamamokshakhya
    caturvargaphalapradam | vidyakami suvidyam ca labhate natra samshayah || 2|| putrarthi labhate putram
    kanyarthi phalamashnute | vijayarthi vijayam caika griharthi grihamapnuyat || 3|| pushtim balam yasho
    varco dirghamayushca vindate | sarvajvaravinashaya etannamasahasrakam || 4|| pathitva pathayitva va
    mucyate jvarapidanat | paramantrakritaddoshat rakshatidam na samshayah || 5|| sarvagranthivinashaya
    pathennamasahasrakam | sarvagrahavinashartham japedetatsahasrakam || 6|| apamrityubhayam nasti anekavishanashanam
    | nahi corabhayam tasya namasahasrapathinah || 7|| sarvapushpaissamabhyarcya sarvasiddhimavapnuyat
    | tridalaih bilvapatraishca acchidraih komalaih navaih || 8|| rudrarpanam yah karoti sarvadoshatpramucyate
    | ashtamyam purnimayam ca amayam ca visheshatah || 9|| ardrayam ca pradoshe ca somavare gurordine
    | yah pathitva carcanam ca kurute sa ca manavah || 10|| sa sarvakamanlabhate vagyato niyami shucih
    | sarvasaubhagyamapnoti kshemarogyam sukham param || 11|| caitre damanakaih puja vaishakhe gandhavaribhih
    | jyeshthe tu triphalaih pakvaih ashadhe kshiramujanam || 12|| shravanyam sharkarabhih syat gudapupaishca
    bhadrade | annairashvayuje masi kartikyam dipamalaya || 13|| margashirshe ghritaih puja paushe cekshurasairapi
    | ajyardrakambalairmaghe phalgune dadhibhirbhavet || 14|| ittham dvadashamaseshu purnimayam visheshatah
    | maheshvarasya pujam yah kurute bhaktisasamyutah || 15|| sarvankamanavapnoti shivasayujyamapnuyat
    | mangalanam mangalam ca etannamasahasrakam || 16|| surupam gunasampannam kanya ca labhate patim |
    dirghasaumangalyamapnoti mangalanam paramparam || 17|| || iti shribhringiritisamhitayam shivavishnusamvade
    shivotkarshaprakarane shrirudrasahasranamastotram sampurnam ||
  devanagari: ृङ्गाग्रनिलयो रजतप्रभः । रतप्रियो रहःपूज्यो रमणीयगुणाकरः ॥ ११९॥ रथकारो रथपतिः रथो रत्नाकरप्रियः
    । रथोत्सवप्रियो रस्यो रजोगुणविनाशकृत् ॥ १२०॥ रत्नडोलोत्सवप्रीतो रणत्किंकिणिमेखलः । रत्नदो राजको रागी
    रङ्गविद्याविशारदः ॥ १२१॥ रत्नपूजनसन्तुष्टो रत्नसानुशरासनः । रत्नमण्डपमध्यस्थो रत्नग्रैवेयकुण्डलः ॥
    १२२॥ रत्नाकरस्तुतो रत्नपीठस्थो रणपण्डितः । रत्नाभिषेकसन्तुष्टो रत्नकाञ्चनभूषणः ॥ १२३॥ रत्नाङ्गुलीयवलयो
    राजत्करसरोरुहः । रमापतिस्तुतो रम्यो राजमण्डलमध्यगः ॥ १२४॥ रमावाणीसमाराध्यो राज्यदो रत्नभूषणः । रम्भादिसुन्दरीसेव्यो
    रक्षोहा राकिणीप्रियः ॥ १२५॥ रविचन्द्राग्निनयनो रत्नमाल्याम्बरप्रियः । रविमण्डलमध्यस्थो रविकोटिसमप्रभः
    ॥ १२६॥ राकेन्दुवदनो रात्रिञ्चरप्राणापहारकः । राजराजप्रियो रौद्रो रुरुहस्तो रुरुप्रियः ॥ १२७॥ राजराजेश्वरो
    राजपूजितो राज्यवर्धनः । रामार्चितपदद्वन्द्वो रावणार्चितविग्रहः ॥ १२८॥ राजवश्यकरो राजा राशीकृतजगत्त्रयः
    । राजीवचरणो राजशेखरो रविलोचनः ॥ १२९॥ राजीवपुष्पसंकाशो राजीवाक्षो रणोत्सुकः । रात्रिञ्चरजनाध्यक्षो
    रात्रिञ्चरनिषेवितः ॥ १३०॥ राधामाधवसंसेव्यो राधामाधववल्लभः । रुक्माङ्गदस्तुतो रुद्रो रजस्सत्वतमोमयः
    ॥ १३१॥ रुद्रमन्त्रजपप्रीतो रुद्रमण्डलसेवितः । रुद्राक्षजपसुपीतो रुद्रलोकप्रदायकः ॥ १३२॥ रुद्राक्षमालाभरणो
    रुद्राणीप्राणनायकः । रुद्राणीपूजनप्रीतो रुद्राक्षमकुटोज्वलः ॥ १३३॥ रुरुचर्मपरीधानो रुक्माङ्गदपरिष्कृतः
    । रेफस्वरूपो रुद्रात्मा रुद्राध्यायजपप्रियः ॥ १३४॥ रेणुकावरदो रामो रूपहीनो रविस्तुतः । रेवानदीतीरवासी
    रोहिणीपतिवल्लभः ॥ १३५॥ रोगेशो रोगशमनो रैदो रक्तबलिप्रियः । रंबीजजपसन्तुष्टो राजीवकुसुमप्रियः ॥ १३६॥
    रम्भाफलप्रियो रौद्रदृक् रक्षाकर रूपवान् । दकाररूपो देवेशो दरस्मेरमुखाम्बुजः ॥ १३७॥ दरान्दोलितदीर्घाक्षो
    द्रोणपुष्पार्चनप्रियः । दक्षाराध्यो दक्षकन्यापतिर्दक्षवरप्रदः ॥ १३८॥ दक्षिणादक्षिणाराध्यो दक्षिणामूर्तिरूपभृत्
    । दाडिमीबीजरदनो दाडिमीकुसुमप्रियः ॥ १३९ दान्तो दक्षमखध्वंसी दण्डो दमयिता दमः । दारिद्र्यध्वंसको दाता
    दयालुर्दानवान्तकः ॥ १४० दारुकारण्यनिलयो दशदिक्पालपूजितः । दाक्षायणीसमाराध्यो दनुजारिर्दयानिधिः ॥ १४१
    दिव्यायुधधरो दिव्यमाल्याम्बरविभूषणः । दिगम्बरो दानरूपो दुर्वासमुनिपूजितः ॥ १४२॥ दिव्यान्तरिक्षगमनो
    दुराधर्षो दयात्मकः । दुग्धाभिषेचनप्रीतो दुःखदोषविवर्जितः ॥ १४३॥ दुराचारप्रशमनो दुग्धान्नप्रीतमानसः
    । दुर्लभो दुर्गमो दुर्गो दुःखहन्ता दुरार्तिहा ॥ १४४॥ दुर्वासा दुष्टभयदो दुर्जयो दुरतिक्तमः । दुष्टहन्ता
    देवसैन्यपतिर्दम्भविवर्जितः ॥ १४५॥ दुःस्वप्ननाशनो दुष्टदुरो दुर्वारवित्तमः । दूर्वायुग्मसमाराध्यो दुत्तूरकुसुमप्रियः
    ॥ १४६॥ देवगङ्गाजटाजूटो देवताप्राणवल्लभः । देवतार्तिप्रशमनो दीनदैन्यविमोचनः ॥ १४७॥ देवदेवो दैत्यगुरुः
    दण्डनाथप्रपूजितः । देवभोग्यो देवयोग्यो दीप्तमूर्तिर्दिवस्पतिः ॥ १४८॥ देवर्षिवर्यो देवर्षिवन्दितो देवभोगदः
    । देवादिदेवो देवेज्यो दैत्यदर्पनिषूदनः ॥ १४९॥ देवासुरगणाध्यक्षो देवासुरगणाग्रणीः । देवासुर तपस्तुष्टो
    देवासुरवरप्रदः ॥ १५०॥ देवासुरेश्वराराध्यो देवान्तकवरप्रदः । देवासुरेश्वरो देवो देवासुरमहेश्वरः ॥ १५१॥
    देवेन्द्ररक्षको दीर्घो देववृन्दनिषेवितः । देशकालपरिज्ञाता देशोपद्रवनाशकः ॥ १५२॥ दोषाकरकलामौलिर्दुर्वारभुजविक्रमः
    । दण्डकारण्यनिलयो दण्डी दण्डप्रसादकः ॥ १५३॥ दण्डनीतिर्दुरावासो द्योतो दुर्मतिनाशनः । द्वन्द्वातीतो
    दीर्घदर्शी दानाध्यक्षो दयापरः ॥ १५४॥ यकाररूपो यन्त्रात्मा यन्त्राराधनतत्परः । यजमानाद्यष्टमूर्तिर्यामिनीचरदर्पहा
    ॥ १५५॥ यजुर्वेदप्रियो युद्धमर्मज्ञो युद्धकौशलः । यत्नसाध्यो यष्टिधरो यजमानप्रियो यजुः ॥ १५६॥ यथार्थरूपो
    युगकृद्युगरूपो युगान्तकृत् । यथोक्तफलदो योषापूजनप्रीतमानसः ॥ १५७॥ यदृच्छालाभसन्तुष्टो याचकार्तिनिषूदनः
    । यन्त्रासनो यन्त्रमयो यन्त्रमन्त्रस्वरूपकः ॥ १५८॥ यमरूपो यामरूपो यमबाधानिवर्तकः । यमादियोगनिरतो योगमार्गप्रदर्शकः
    ॥ १५९॥ यवाक्षतार्चनरतो यावचिह्नितपादुकः । यक्षराजसखो यज्ञो यक्षेशो यक्षपूजितः ॥ १६०॥ यक्षराक्षससंसेव्यो
    यातुधानवरप्रदः । यज्ञगुह्यो यज्ञकर्ता यजमानस्वरूपकः ॥ १६१॥ यज्ञान्तकृद्यज्ञपूज्यो यज्ञभुग्यज्ञवाहनः
    । यागप्रियो यानसेव्यो युवा यौवनगर्वितः ॥ १६२॥ यातायातादिरहितो यतिधर्मपरायणः । यात्राप्रियो यमीयाम्यदण्डपाशनिकृन्तनः
    ॥ १६३॥ यात्राफलप्रदो युक्तो यशस्वी यमुनाप्रियः । यादःपतिर्यज्ञपतिर्यतिर्यज्ञपरायणः ॥ १६४॥ यादवानां
    प्रियो योद्धा योधारान्धन तत्परः । यामपूजनसन्तुष्टो योषित्सङ्गविवर्जितः ॥ १६५॥ यामिनीपतिसंसेव्यो योगिनीगणसेवितः
    । यायजूको युगावर्तो याच्ञारूपो यथेष्टदः ॥ १६६॥ यावौदनप्रीतचित्तो योनिष्ठो यामिनीप्रियः । याज्ञवल्क्यप्रियो
    यज्वा यज्ञेशो यज्ञसाधनः ॥ १६७॥ योगमायामयो योगमायासंवृतविग्रहः । योगसिद्धो योगिसेव्यो योगानन्दस्वरूपकः
    ॥ १६८॥ योगक्षेमकरो योगक्षेमदाता यशस्करः । योगी योगासनाराध्यो योगाङ्गो योगसङ्ग्रहः ॥ १६९॥ योगीश्वरेश्वरो
    योग्यो योगदाता युगन्धरः । योषित्प्रियो यदुपतिर्योषार्धीकृतविग्रहः ॥ १७०॥ यंबीजजपसन्तुष्टो यन्त्रेशो
    यन्त्रसाधनः । यन्त्रमध्यस्थितो यन्त्री योगीश्वरसमाश्रितः ॥ १७१॥ ॥ उत्तरपीठिका ॥ एतत्ते कथितं विष्णो
    रुद्रनामसहस्रकम् । श्रवणात्पठनाच्चैव मननाच्च फलप्रदम् ॥ १॥ धर्मार्थिकाममोक्षाख्य चतुर्वर्गफलप्रदम्
    । विद्याकामी सुविद्यां च लभते नात्र संशयः ॥ २॥ पुत्रार्थी लभते पुत्रं कन्यार्थी फलमश्नुते । विजयार्थी
    विजयं चैक गृहार्थी गृहमाप्नुयात् ॥ ३॥ पुष्टिं बलं यशो वर्चो दीर्घमायुश्च विन्दते । सर्वज्वरविनाशाय
    एतन्नामसहस्रकम् ॥ ४॥ पठित्वा पाठयित्वा वा मुच्यते ज्वरपीडनात् । परमन्त्रकृताद्दोषात् रक्षतीदं न संशयः
    ॥ ५॥ सर्वग्रन्थिविनाशाय पठेन्नामसहस्रकम् । सर्वग्रहविनाशार्थं जपेदेतत्सहस्रकम् ॥ ६॥ अपमृत्युभयं नास्ति
    अनेकविषनाशनम् । नहि चोरभयं तस्य नामसाहस्रपाठिनः ॥ ७॥ सर्वपुष्पैस्समभ्यर्च्य सर्वसिद्धिमवाप्नुयात्
    । त्रिदलैः बिल्वपत्रैश्च अच्छिद्रैः कोमलैः नवैः ॥ ८॥ रुद्रार्पणं यः करोति सर्वदोषात्प्रमुच्यते । अष्टम्यां
    पूर्णिमायां च अमायां च विशेषतः ॥ ९॥ आर्द्रायां च प्रदोषे च सोमवारे गुरोर्दिने । यः पठित्वा चार्चनां
    च कुरुते स च मानवः ॥ १०॥ स सर्वकामान्लभते वाग्यतो नियमी शुचिः । सर्वसौभाग्यमाप्नोति क्षेमारोग्यं सुखं
    परम् ॥ ११॥ चैत्रे दमनकैः पूजा वैशाखे गन्धवारिभिः । ज्येष्ठे तु त्रिफलैः पक्वैः आषाढे क्षीरमूजनम् ॥
    १२॥ श्रावण्यां शर्कराभिः स्यात् गुडापूपैश्च भद्रदे । अन्नैराश्वयुजे मासि कार्तिक्यां दीपमालया ॥ १३॥
    मार्गशीर्षे घृतैः पूजा पौषे चेक्षुरसैरपि । आज्यर्द्रकम्बलैर्माघे फाल्गुने दधिभिर्भवेत् ॥ १४॥ इत्थं
    द्वादशमसेषु पूर्णिमायां विशेषतः । महेश्वरस्य पूजां यः कुरुते भक्तिससंयुतः ॥ १५॥ सर्वान्कामानवाप्नोति
    शिवसायुज्यमाप्नुयात् । मङ्गलानां मङ्गलं च एतन्नामसहस्रकम् ॥ १६॥ सुरूपं गुणसम्पन्नं कन्या च लभते पतिम्
    । दीर्घसौमङ्गल्यमाप्नोति मङ्गलानां परम्पराम् ॥ १७॥ ॥ इति श्रीभृङ्गिरिटिसंहितायां शिवविष्णुसंवादे शिवोत्कर्षप्रकरणे
    श्रीरुद्रसहस्रनामस्तोत्रं सम्पूर्णम् ॥
