id: tattvasamasasutravrittih
category: sutra
name:
  english: tattvasamasasutravrittih
  devanagari: तत्त्वसमाससूत्रवृत्तिः
content:
  english: dharmakhyam sauhityam yamaniyamanishevanam prakhyanam | jnanaishvaryaviragah prakashanamiti
    sattviki vrittih || ragah krodho lobhah paraparivado'tiraudrata'tushtih | vikritakritiparushyam prakhyataisha
    tu rajasi vrittih || pramadamadavishada nastikyam striprasangita nidra | alasyam nairghrinyamashaucamiti
    tamasi vrittih || etadvrittitrayam drishtva loke gunanam kartritvam siddhamiti cakartta purushah siddho
    bhavati || pravarttamanan prakriteriman gunan rajastamobhyam viparitadarshanat | aham karomityabudho'bhimanyate
    trinasya kubjikarane'pyanishvarah || sarvamidam maya kritam mamedamiti vadannabhimanadabudha unmattah
    kartrivadbhavati atraha | prakriteh kriyamanani gunaih karmani sarvashah | ahankaravimudhatma kartahamiti
    manyate || anaditvannirgunatvat paramatma'yamavyayah | sharirastho'pi kauntaya na karoti na lipyate
    || evam | prakrityaiva ca karmani kriyamanani sarvashah | yah pashyati tathatmanamakartaram sa pashyati
    || tatraha kimayamekah purusho bahavo vetyucyate | sukhaduhkhamohasankaravishuddhakaranapatavajanmamaranakarananam
    nanatvat purushabahutvam siddham lokashramavarnabhedacca | yadyekah purushah syadekasmin sukhini sarva
    eva sukhinah syuh | ekasmin duhkhini sarva eva duhkhinah syuh | ekasmin karanapatave sarveshameva
    karanapatavam syat | ekasminjate sarva eva jayeran | ekasmin mrite sarva eva mriyeranniti | na caivam
    itashca bahavah purushah siddhah | akritigarbhashayabhavasangatishariravibhage lingabahutvat | evam
    tavat samkhyacaryah kapilasuripancashikhapatanjaliprabhritayo bahun purushan varnayanti | vedantavadina
    acarya hariharahiranyagarbhavyasadaya ekamevatmanam varnayanti | kasmadevam tadaha | purusha evedam
    sarvam bhutam yacca bhavyam | utamritatvasyeshano yadanyenatirohati || tadevagnistadadityastadvayustaddhi
    candramah | tadeva shukram tadbrahma tadapah sah prajapatih || tadeva satyamamritam sa mokshah sa
    para gatih || tadaksharam tat saviturvarenyam yasmatparam naparamasti kincit || yasmannaniyo na jyayo'sti
    kashcid vriksha iva stabdho divi tishthatyekastenedam purnam purushena sarvam | sarvatah panipadantam
    sarvatokshishiromukham | sarvatah shrutimalloke sarvamavrittya tishthati || sarvendriyagunabhasam
    sarvendriyavivarjitam | sarvesham prabhumishanam sarvasya sharanam mahat || sarvatah sarvatattvani
    sarvatma sarvasambhavah | sarvam viliyate yasmin tadbrahma munayo viduh || eka eva hi bhutatma dehe
    dehe vyavasthitah | ekadha bahudha caiva drishyate jalacandravat || sa hi sarveshu bhuteshu sthavareshu
    careshu ca | vasatyeko mahanatma yena sarvamidam tatam || ekoyamatma jagatamekena bahudha kritah |
    prithag vadanti catmanam jnanadikapravartane || brahmane krimikiteshu shvapake shuni hastini | pashugodamshamashake
    samam pashyanti panditah || eka eva yatha sutram suvarne vartate punah | muktamanipravaleshu mrinmaye
    rajate tatha || tadvad goshu manushyeshu tadvaddhastimrigadishu | ekoyamatma vijneyah sarvatraiva
    vyavasthitah || atraha kim traigunyam namocyate | sattvarajastamamsiti triguna eva traigunyam | sattvam
    nama prasadalaghavaprasannatabhishangaprititushtititikshasantoshadilakshanamanantabhedam samasatah
    sukhatmakam | rajo nama shokatapasvedastambhodvegaroshamanadilakshanamanantabhedam samasato duhkhatmakam
    | tamo nama''cchadanavaranabibhatsadainyagauravalasyanidrapramadadilakshanamanantabhedam samasato
    mohatmakam | etat traigunyam vyakhyatam | sattvam prakashakam vidyadrajo vidyat pravartakam | tamo'prakashakam
    vidyattraigunyannama samjnitam || atraha kah sancarah pratisancarashca | atrocyate | utpattih sancarah
    pralayah pratisancarah | tatrotpattirnamavyaktat pragupadishtat sarvatah purushena parenadhishthita
    buddhirutpadyate | ashtaguna buddhih | buddhitattvadahankara utpadyate | sa cahamkarastrividho vaikarikastaijaso
    bhutadiriti | tatra vaikarikadahamkaradeva indriyani cotpadyante | bhutadestanmatrani | taijasadubhayam
    | tanmatrebhyo bhutaniti sancarah | pratisancaro nama bhutani tanmatreshu liyante | tanmatranindriyani
    cahamkare | ahamkaro buddhau | buddhiravyakte | tadavyaktam kvacinna liyate | kasmadanutpadyamanatvat
    prakritim purushancaiva viddhyanadi ityevam pratisancaro vyakhyatah | tatraha kim tadadhyatmamadhibhutamadhidaivatam
    ceti | tatrocyate | buddhiradhyatmam boddhavyamadhibhutam brahma tatradhidaivatam | ahamkaro'dhyatmam
    mantavyamadhibhutam rudrastatradhidaivatam | mano'dhyatmam samkalpitavyamadhibhutam candrastatradhidaivatam
    | shrotramadhyatmam shrotavyamadhibhutamakashastatradhidaivatam | tvagadhyatmam sparshayitavyamadhibhutam
    vayustatradhidaivatam | cakshuradhyatmam drashtavyamadhibhutamadityastatradhidaivatam | jihvadhyatmam
    rasayitavyamadhibhutam varunastatradhidaivatam | ghranamadhyatmam ghratavyamadhibhutam prithvi tatradhidaivatam
    | vagadhyatmam vaktavyamadhibhutam agnistatradhidaivatam | pani adhyatmam grahitavyamadhibhutamindrastatradhidaivatam
    | padavadhyatmam gantavyamadhibhutam vishnustatradhidaivatam | payuradhyatmamutsrashtavyamadhibhutam
    mitrastatradhidaivatam | upasthamadhyatmamanandayitavyamadhibhutam prajapatistatradhidaivatam | evametat
    trayodashavidhasya karanasyadhyatmamadhibhutamadhidaivatam vyakhyatam | tattvani yo vedayate yathavad
    gunasvarupanyadhidaivatam ca | vimuktapapma gatadoshasangho gunamstu bhunkte na gunaih sa bhajyate
    || atha kastah pancabhibuddhaya ucyate | vyavasayo'bhimaneccha kartavyata kriyeti | abhimukhi buddhiridam
    karaniyam mayeti vyavasayo buddhikriya | atmaparatmasvarupapratyayabhimukho'bhimano'hamkaro buddheh
    kriya | iccha vancha sankalpo manaso buddhikriya | shabdadivishayalocanashravanadilakshanakartavyata
    buddhindriyanam buddhikriya | vacanadilakshanabuddhikriya karmendriyanam sa kriyeti | evametah pancabhibuddhayo
    vyakhyatah | atha kastah pancakarmayonaya ucyante | dhritih shraddha sukha'vividisha vividisha ca
    pancakarmayonayah | bahyakarmani samkalpya pratitam yo'bhirakshati | tannishthastatpratishthashca
    dhriteretaddhi lakshanam || svadhyayo brahmacaryam ca yajanam yajanam tapah | danam pratigraho homah
    shraddhaya lakshanam smritam || sukhartham yastu seveta brahmakarmatapamsi ca | prayashcittaparo nityam
    sukheyam parikirtita || vishayamadhumishritantahkaranatvamavividisha | vividisha ca dhyaninam prajnanayonih
    | ekatvam ca prithaktvam ca nityam caivamacetanam | sukshmam satkaryamakshobhyam jneya vividisha ca
    sa || karyakaranakshayakari vividisha prakritiki vrittih | dhritih shraddha sukha'vividisha catasro
    bandhaya vidishaika mokshaya | evameta panca karmayonayo vyakhyatah | atraha ke pancavayava ucyante
    | pranopanah samanashca udano vyana eva ca | ityete vayavah panca sharireshu sharirinam | tatra prano
    nama vayurmukhanasikadhishthata pranayanatprakramanacca prana ityabhidhiyate | apano nama vayurnabhyadhishthitapanayanadadhogamanaccapana
    ityabhidhiyate | samano nama vayurhridadhishthata samanayanat sangamanacca samana ityabhidhiyate |
    udano nama vayuh kanthadhishthata urdhvagamanadutkramanaccodana ityabhidhiyate | vyano nama vayuh
    sandhyadhishthata vikshepanadvijrimbhanacca vyana ityabhidhiyate | iti pancavayavo vyakhyatah | atraha
    ke te pancakarmatmana ityucyate | vaikarikastaijaso bhutadih sanumano niranumanashca | tatra vaikarikah
    shubhakarmakarta | taijaso'shubhakarmakarta | bhutadirmudhakarmakarta | sanumanah shubhamudhakarmakarta
    | niranumano'shubhamudhakarmakarta caivam pancakarmatmano vyakhyatah | atraha ka sa pancaparva'vidyetyucyate
    | tamo moho mahamohastamishro'ndhatamisrashceti | tatra tamomohavubhavashtatmakau | mahamoho dashatmakah
    | tamisrondhatamisrashcashtadashatmakau | tamo namashtasu prakritishvavyaktabuddhyahamkarapancatanmatrasamjnitasvanatmasvatmabhimanastama
    ityabhidhiyate | moho namanimadyashtaishvaryapraptaye yo'bhimana utpadyate sa moha ityabhidhiyate
    | mahamoho nama drishtanushravikeshu shabdadivishayeshu dashasu vrittishu muktohamiti manyate sa mahamoha
    ityabhidhiyate | tamisro namashtagunaishvarye'nimadye dashavidhe ca vishaye yo dvesho'pratihatastatra
    yad duhkhamutpadyate'sau tamisra ityabhidhiyate | andhatamisro namashtagunaishvarye'nimadye dashavidhe
    ca vishaye siddhe maranakale yo vishada utpadyate so'ndhatamisra ityabhidhiyate | evamesha pancaparva'vidya
    dvishashtibheda vyakhyatah | atraha ka sa'shtavimshatidha'shaktiratrocyate | ekadashendriyavadhah
    saptadasha tushtisiddhi
  devanagari: धर्माख्यं सौहित्यं यमनियमनिषेवणं प्रख्यानम् । ज्ञानैश्वर्यविरागाः प्रकाशनमिति सात्त्विकी
    वृत्तिः ॥ रागः क्रोधो लोभः परपरिवादोऽतिरौद्रताऽतुष्टिः । विकृताकृतिपारुष्यं प्रख्यातैषा तु राजसी वृत्तिः
    ॥ प्रमादमदविषादा नास्तिक्यं स्त्रीप्रसङ्गिता निद्रा । आलस्यं नैर्घृण्यमशौचमिति तामसी वृत्तिः ॥ एतद्वृत्तित्रयं
    दृष्ट्वा लोके गुणानां कर्तृत्वं सिद्धमिति चाकर्त्ता पुरुषः सिद्धो भवति ॥ प्रवर्त्तमानान् प्रकृतेरिमान्
    गुणान् रजस्तमोभ्यां विपरीतदर्शनात् । अहं करोमीत्यबुधोऽभिमन्यते तृणस्य कुब्जीकरणेऽप्यनीश्वरः ॥ सर्वमिदं
    मया कृतं ममेदमिति वदन्नभिमानादबुध उन्मत्तः कर्तृवद्भवति अत्राह । प्रकृतेः क्रियमाणानि गुणैः कर्माणि
    सर्वशः । अहङ्कारविमूढात्मा कर्ताहमिति मन्यते ॥ अनादित्वान्निर्गुणत्वात् परमात्माऽयमव्ययः । शरीरस्थोऽपि
    कौन्तय न करोति न लिप्यते ॥ एवम् । प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः । यः पश्यति तथात्मानमकर्तारं
    स पश्यति ॥ तत्राह किमयमेकः पुरुषो बहवो वेत्युच्यते । सुखदुःखमोहसङ्करविशुद्धकरणपाटवजन्ममरणकरणानां नानात्वात्
    पुरुषबहुत्वं सिद्धं लोकाश्रमवर्णभेदाच्च । यद्येकः पुरुषः स्यादेकस्मिन् सुखिनि सर्व एव सुखिनः स्युः
    । एकस्मिन् दुःखिनि सर्व एव दुःखिनः स्युः । एकस्मिन् करणपाटवे सर्वेषामेव करणपाटवं स्यात् । एकस्मिञ्जाते
    सर्व एव जायेरन् । एकस्मिन् मृते सर्व एव म्रियेरन्निति । न चैवम् इतश्च बहवः पुरुषाः सिद्धाः । आकृतिगर्भाशयभावसङ्गतिशरीरविभागे
    लिङ्गबहुत्वात् । एवं तावत् सांख्याचार्याः कपिलासुरिपञ्चशिखपतञ्जलिप्रभृतयो बहून् पुरुषान् वर्णयन्ति
    । वेदान्तवादिन आचार्या हरिहरहिरण्यगर्भव्यासादय एकमेवात्मानं वर्णयन्ति । कस्मादेवं तदाह । पुरुष एवेदं
    सर्वं भूतं यच्च भाव्यम् । उतामृतत्वस्येशानो यदन्येनातिरोहति ॥ तदेवाग्निस्तदादित्यस्तद्वायुस्तद्धि
    चन्द्रमाः । तदेव शुक्रं तद्ब्रह्म तदापः सः प्रजापतिः ॥ तदेव सत्यममृतं स मोक्षः सा परा गतिः ॥ तदक्षरं
    तत् सवितुर्वरेण्यं यस्मात्परं नापरमस्ति किञ्चित् ॥ यस्मान्नाणीयो न ज्यायोऽस्ति कश्चिद् वृक्ष इव स्तब्धो
    दिवि तिष्ठत्येकस्तेनेदं पूर्णं पुरुषेण सर्वम् । सर्वतः पाणिपादान्तं सर्वतोक्षिशिरोमुखम् । सर्वतः श्रुतिमल्लोके
    सर्वमावृत्त्य तिष्ठति ॥ सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम् । सर्वेषां प्रभुमीशानं सर्वस्य
    शरणं महत् ॥ सर्वतः सर्वतत्त्वानि सर्वात्मा सर्वसम्भवः । सर्वं विलीयते यस्मिन् तद्ब्रह्म मुनयो विदुः
    ॥ एक एव हि भूतात्मा देहे देहे व्यवस्थितः । एकधा बहुधा चैव दृश्यते जलचन्द्रवत् ॥ स हि सर्वेषु भूतेषु
    स्थावरेषु चरेषु च । वसत्येको महानात्मा येन सर्वमिदं ततम् ॥ एकोयमात्मा जगतामेकेन बहुधा कृतः । पृथग्
    वदन्ति चात्मानं ज्ञानादिकप्रवर्तने ॥ ब्राह्मणे कृमिकीटेषु श्वपाके शुनि हस्तिनि । पशुगोदंशमशके समं
    पश्यन्ति पण्डिताः ॥ एक एव यथा सूत्रं सुवर्णे वर्तते पुनः । मुक्तामणिप्रवालेषु मृण्मये रजते तथा ॥ तद्वद्
    गोषु मनुष्येषु तद्वद्धस्तिमृगादिषु । एकोयमात्मा विज्ञेयः सर्वत्रैव व्यवस्थितः ॥ अत्राह किं त्रैगुण्यं
    नामोच्यते । सत्त्वरजस्तमांसीति त्रिगुणा एव त्रैगुण्यम् । सत्त्वं नाम प्रसादलाघवप्रसन्नताभिषङ्गप्रीतितुष्टितितिक्षासन्तोषादिलक्षणमनन्तभेदं
    समासतः सुखात्मकम् । रजो नाम शोकतापस्वेदस्तम्भोद्वेगरोषमानादिलक्षणमनन्तभेदं समासतो दुःखात्मकम् । तमो
    नामाऽऽच्छादनावरणबीभत्सदैन्यगौरवालस्यनिद्राप्रमादादिलक्षणमनन्तभेदं समासतो मोहात्मकम् । एतत् त्रैगुण्यं
    व्याख्यातम् । सत्त्वं प्रकाशकं विद्याद्रजो विद्यात् प्रवर्तकम् । तमोऽप्रकाशकं विद्यात्त्रैगुण्यन्नाम
    संज्ञितम् ॥ अत्राह कः सञ्चरः प्रतिसञ्चरश्च । अत्रोच्यते । उत्पत्तिः सञ्चरः प्रलयः प्रतिसञ्चरः । तत्रोत्पत्तिर्नामाव्यक्तात्
    प्रागुपदिष्टात् सर्वतः पुरुषेण परेणाधिष्ठिता बुद्धिरुत्पद्यते । अष्टगुणा बुद्धिः । बुद्धितत्त्वादहङ्कार
    उत्पद्यते । स चाहंकारस्त्रिविधो वैकारिकस्तैजसो भूतादिरिति । तत्र वैकारिकादहंकारादेव इन्द्रियाणि चोत्पद्यन्ते
    । भूतादेस्तन्मात्राणि । तैजसादुभयम् । तन्मात्रेभ्यो भूतानीति सञ्चरः । प्रतिसञ्चरो नाम भूतानि तन्मात्रेषु
    लीयन्ते । तन्मात्राणीन्द्रियाणि चाहंकारे । अहंकारो बुद्धौ । बुद्धिरव्यक्ते । तदव्यक्तं क्वचिन्न लीयते
    । कस्मादनुत्पद्यमानत्वात् प्रकृतिं पुरुषञ्चैव विद्ध्यनादि इत्येवं प्रतिसञ्चरो व्याख्यातः । तत्राह
    किं तदध्यात्ममधिभूतमधिदैवतं चेति । तत्रोच्यते । बुद्धिरध्यात्मम् बोद्धव्यमधिभूतं ब्रह्मा तत्राधिदैवतम्
    । अहंकारोऽध्यात्मं मन्तव्यमधिभूतं रुद्रस्तत्राधिदैवतम् । मनोऽध्यात्मं संकल्पितव्यमधिभूतं चन्द्रस्तत्राधिदैवतम्
    । श्रोत्रमध्यात्मं श्रोतव्यमधिभूतमाकाशस्तत्राधिदैवतम् । त्वगध्यात्मं स्पर्शयितव्यमधिभूतं वायुस्तत्राधिदैवतम्
    । चक्षुरध्यात्मं द्रष्टव्यमधिभूतमादित्यस्तत्राधिदैवतम् । जिह्वाध्यात्मं रसयितव्यमधिभूतं वरुणस्तत्राधिदैवतम्
    । घ्राणमध्यात्मं घ्रातव्यमधिभूतं पृथ्वी तत्राधिदैवतम् । वागध्यात्मं वक्तव्यमधिभूतं अग्निस्तत्राधिदैवतम्
    । पाणी अध्यात्मं ग्रहीतव्यमधिभूतमिन्द्रस्तत्राधिदैवतम् । पादावाध्यात्मं गन्तव्यमधिभूतं विष्णुस्तत्राधिदैवतम्
    । पायुरध्यात्ममुत्स्रष्टव्यमधिभूतं मित्रस्तत्राधिदैवतम् । उपस्थमध्यात्ममानन्दयितव्यमधिभूतं प्रजापतिस्तत्राधिदैवतम्
    । एवमेतत् त्रयोदशविधस्य करणस्याध्यात्ममधिभूतमधिदैवतं व्याख्यातम् । तत्त्वानि यो वेदयते यथावद् गुणस्वरूपाण्यधिदैवतं
    च । विमुक्तपाप्मा गतदोषसङ्घो गुणांस्तु भुङ्क्ते न गुणैः स भज्यते ॥ अथ कास्ताः पञ्चाभिबुद्धय उच्यते
    । व्यवसायोऽभिमानेच्छा कर्तव्यता क्रियेति । अभिमुखी बुद्धिरिदं करणीयं मयेति व्यवसायो बुद्धिक्रिया ।
    आत्मपरात्मस्वरूपप्रत्ययाभिमुखोऽभिमानोऽहंकारो बुद्धेः क्रिया । इच्छा वाञ्छा सङ्कल्पो मनसो बुद्धिक्रिया
    । शब्दादिविषयालोचनश्रवणादिलक्षणकर्तव्यता बुद्धीन्द्रियाणां बुद्धिक्रिया । वचनादिलक्षणबुद्धिक्रिया
    कर्मेन्द्रियाणां सा क्रियेति । एवमेताः पञ्चाभिबुद्धयो व्याख्याताः । अथ कास्ताः पञ्चकर्मयोनय उच्यन्ते
    । धृतिः श्रद्धा सुखाऽविविदिषा विविदिषा च पञ्चकर्मयोनयः । बाह्यकर्माणि संकल्प्य प्रतीतं योऽभिरक्षति
    । तन्निष्ठस्तत्प्रतिष्ठश्च धृतेरेतद्धि लक्षणम् ॥ स्वाध्यायो ब्रह्मचर्यं च यजनं याजनं तपः । दानं प्रतिग्रहो
    होमः श्रद्धाया लक्षणं स्मृतम् ॥ सुखार्थं यस्तु सेवेत ब्रह्मकर्मतपांसि च । प्रायश्चित्तपरो नित्यं सुखेयं
    परिकीर्तिता ॥ विषयमधुमिश्रितान्तःकारणत्वमविविदिषा । विविदिषा च ध्यानिनां प्रज्ञानयोनिः । एकत्वं च
    पृथक्त्वं च नित्यं चैवमचेतनम् । सूक्ष्मं सत्कार्यमक्षोभ्यं ज्ञेया विविदिषा च सा ॥ कार्यकारणक्षयकरी
    विविदिषा प्राकृतिकी वृत्तिः । धृतिः श्रद्धा सुखाऽविविदिषा चतस्रो बन्धाय विदिषैका मोक्षाय । एवमेता
    पञ्च कर्मयोनयो व्याख्याताः । अत्राह के पञ्चवायव उच्यन्ते । प्राणोपानः समानश्च उदानो व्यान एव च । इत्येते
    वायवः पञ्च शरीरेषु शरीरिणाम् । तत्र प्राणो नाम वायुर्मुखनासिकाधिष्ठाता प्रणयनात्प्रक्रमणाच्च प्राण
    इत्यभिधीयते । अपानो नाम वायुर्नाभ्यधिष्ठितापनयनादधोगमनाच्चापान इत्यभिधीयते । समानो नाम वायुर्हृदधिष्ठाता
    समनयनात् सङ्गमनाच्च समान इत्यभिधीयते । उदानो नाम वायुः कण्ठाधिष्ठाता ऊर्ध्वगमनादुत्क्रमणाच्चोदान इत्यभिधीयते
    । व्यानो नाम वायुः सन्ध्यधिष्ठाता विक्षेपणाद्विजृम्भणाच्च व्यान इत्यभिधीयते । इति पञ्चवायवो व्याख्याताः
    । अत्राह के ते पञ्चकर्मात्मान इत्युच्यते । वैकारिकस्तैजसो भूतादिः सानुमानो निरनुमानश्च । तत्र वैकारिकः
    शुभकर्मकर्ता । तैजसोऽशुभकर्मकर्ता । भूतादिर्मूढकर्मकर्ता । सानुमानः शुभमूढकर्मकर्ता । निरनुमानोऽशुभमूढकर्मकर्ता
    चैवं पञ्चकर्मात्मानो व्याख्याताः । अत्राह का सा पञ्चपर्वाऽविद्येत्युच्यते । तमो मोहो महामोहस्तामिश्रोऽन्धतमिस्रश्चेति
    । तत्र तमोमोहावुभावष्टात्मकौ । महामोहो दशात्मकः । तामिस्रोन्धतामिस्रश्चाष्टादशात्मकौ । तमो नामाष्टसु
    प्रकृतिष्वव्यक्तबुद्ध्यहंकारपञ्चतन्मात्रसंज्ञितास्वनात्मस्वात्माभिमानस्तम इत्यभिधीयते । मोहो नामाणिमाद्यष्टैश्वर्यप्राप्तये
    योऽभिमान उत्पद्यते स मोह इत्यभिधीयते । महामोहो नाम दृष्टानुश्रविकेषु शब्दादिविषयेषु दशसु वृत्तिषु
    मुक्तोहमिति मन्यते स महामोह इत्यभिधीयते । तामिस्रो नामाष्टगुणैश्वर्येऽणिमाद्ये दशविधे च विषये यो द्वेषोऽप्रतिहतस्तत्र
    यद् दुःखमुत्पद्यतेऽसौ तामिस्र इत्यभिधीयते । अन्धतामिस्रो नामाष्टगुणैश्वर्येऽणिमाद्ये दशविधे च विषये
    सिद्धे मरणकाले यो विषाद उत्पद्यते सोऽन्धतामिस्र इत्यभिधीयते । एवमेषा पञ्चपर्वाऽविद्या द्विषष्टिभेदा
    व्याख्याताः । अत्राह का साऽष्टाविंशतिधाऽशक्तिरत्रोच्यते । एकादशेन्द्रियवधाः सप्तदश तुष्टिसिद्धि
