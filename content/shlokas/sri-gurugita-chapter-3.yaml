id: sri-gurugita-chapter-3
category: stotram
name:
  english: Sri Gurugita Chapter 3
content:
  english: atha tritiyo'dhyayah || atha kamyajapasthanam kathayami varanane | sagarante sarittire tirthe
    hariharalaye || || shaktidevalaye goshthe sarvadevalaye shubhe | vatasya dhatrya mule va mathe brindavane
    tatha || || pavitre nirmale deshe nityanushthanato'pi va | nirvedanena maunena japametat samarabhet
    || || japyena jayamapnoti japasiddhim phalam tatha | hinam karma tyajetsarvam garhitasthanameva ca
    || || shmashane bilvamule va vatamulantike tatha | siddhyanti kanake mule cutavrikshasya sannidhau
    || || pitasanam mohane tu hyasitam cabhicarike | jneyam shuklam ca shantyartham vashye raktam prakirtitam
    || || japam hinasanam kurvan hinakarmaphalapradam | gurugitam prayane va sangrame ripusankate || ||
    japan jayamavapnoti marane muktidayika | sarvakarmani siddhyanti guruputre na samshayah || || gurumantro
    mukhe yasya tasya siddhyanti na'nyatha | dikshaya sarvakarmani siddhyanti guruputrake || || bhavamulavinashaya
    cashtapashanivrittaye | gurugitambhasi snanam tattvajnah kurute sada || || sa evam sadguruh sakshat
    sadasadbrahmavittamah | tasya sthanani sarvani pavitrani na samshayah || || sarvashuddhah pavitro'sau
    svabhavadyatra tishthati | tatra devaganah sarve kshetrapithe caranti ca || || asanasthah shayana
    va gacchantastishthato'pi va | ashvarudha gajarudhah sushupta jagrato'pi va || || shucirbhuta jnanavanto
    gurugitam japanti ye | tesham darshanasamsparshat divyajnanam prajayate || || samudre vai yatha toyam
    kshire kshiram jale jalam | bhinne kumbhe yatha''kasham tatha''tma paramatmani || || tathaiva jnanavan
    jivah paramatmani sarvada | aikyena ramate jnani yatra kutra divanisham || || evamvidho mahayuktah
    sarvatra vartate sada | tasmatsarvaprakarena gurubhaktim samacaret || || gurusantoshanadeva mukto
    bhavati parvati | animadishu bhoktritvam kripaya devi jayate || || samyena ramate jnani diva va yadi
    va nishi | evamvidho mahamauni trailokyasamatam vrajet || || atha samsarinah sarve gurugita japena
    tu | sarvan kamamstu bhunjanti trisatyam mama bhashitam || || satyam satyam punah satyam dharmasaram
    mayoditam | gurugitasamam stotram nasti tattvam guroh param || || gururdevo gururdharmo gurau nishtha
    param tapah | guroh parataram nasti trivaram kathayami te || || dhanya mata pita dhanyo gotram dhanyam
    kulodbhavah | dhanya ca vasudha devi yatra syadgurubhaktata || || akalpajanma kotinam yajnavratatapah
    kriyah | tah sarvah saphala devi gurusantoshamatratah || || shariramindriyam pranamartham svajanabandhuta
    | matrikulam pitrikulam gurureva na samshayah || || mandabhagya hyashaktashca ye jana nanumanvate
    | gurusevasu vimukhah pacyante narake'shucau || || vidya dhanam balam caiva tesham bhagyam nirarthakam
    | yesham gurukripa nasti adho gacchanti parvati || || brahma vishnushca rudrashca devashca pitrikinnarah
    | siddhacaranayakshashca anye ca munayo janah || || gurubhavah param tirthamanyatirtham nirarthakam
    | sarvatirthamayam devi shriguroshcaranambujam || || kanyabhogarata mandah svakantayah paranmukhah
    | atah param maya devi kathitam na mama priye || || idam rahasyamaspashtam vaktavyam ca varanane |
    sugopyam ca tavagre tu mamatmapritaye sati || || svamimukhyaganeshadyan vaishnavadimshca parvati |
    na vaktavyam mahamaye padasparsham kurushva me || || abhakte vancake dhurte pashande nastikadishu
    | manasa'pi na vaktavya gurugita kadacana || || guravo bahavah santi shishyavittapaharakah | tamekam
    durlabham manye shishyahrittapaharakam || || caturyavan viveki ca adhyatmajnanavan shucih | manasam
    nirmalam yasya gurutvam tasya shobhate || || guravo nirmalah shantah sadhavo mitabhashinah | kamakrodhavinirmuktah
    sadacarah jitendriyah || || sucakadiprabhedena guravo bahudha smritah | svayam samyak parikshyatha
    tattvanishtham bhajetsudhih || || varnajalamidam tadvadbahyashastram tu laukikam | yasmin devi samabhyastam
    sa guruh sucakah smritah || || varnashramocitam vidyam dharmadharmavidhayinim | pravaktaram gurum
    viddhi vacakam tviti parvati || || pancaksharyadimantranamupadeshta tu parvati | sa gururbodhako bhuyadubhayorayamuttamah
    || || mohamaranavashyaditucchamantropadeshinam | nishiddhagururityahuh panditastattvadarshinah ||
    || anityamiti nirdishya samsaram sankatalayam | vairagyapathadarshi yah sa gururvihitah priye || ||
    tattvamasyadivakyanamupadeshta tu parvati | karanakhyo guruh prokto bhavaroganivarakah || || sarvasandehasandohanirmulanavicakshanah
    | janmamrityubhayaghno yah sa guruh paramo matah || || bahujanmakritat punyallabhyate'sau mahaguruh
    | labdhva'mum na punaryati shishyah samsarabandhanam || || evam bahuvidha loke guravah santi parvati
    | teshu sarvaprayatnena sevyo hi paramo guruh || || nishiddhagurushishyastu dushtasankalpadushitah
    | brahmapralayaparyantam na punaryati martyatam || || evam shrutva mahadevi mahadevavacastatha | atyantavihvalamanah
    shankaram paripricchati || || parvatyuvaca | namaste devadevatra shrotavyam kincidasti me | shrutva
    tvadvakyamadhuna bhrisham syadvihvalam manah || || svayam mudha mrityubhitah sukritadviratim gatah
    | daivannishiddhaguruga yadi tesham tu ka gatih || || shri mahadeva uvaca | shrinu tattvamidam devi
    yada syadvirato narah | tada'savadhikariti procyate shrutimastakaih || || akhandaikarasam brahma nityamuktam
    niramayam | svasmin sandarshitam yena sa bhavedasyam deshikah || || jalanam sagaro raja yatha bhavati
    parvati | gurunam tatra sarvesham raja'yam paramo guruh || || mohadirahitah shanto nityatripto nirashrayah
    | trinikritabrahmavishnuvaibhavah paramo guruh || || sarvakalavidesheshu svatantro nishcalassukhi
    | akhandaikarasasvadatripto hi paramo guruh || || dvaitadvaitavinirmuktah svanubhutiprakashavan |
    ajnanandhatamashchetta sarvajnah paramo guruh || || yasya darshanamatrena manasah syat prasannata
    | svayam bhuyat dhritishshantih sa bhavet paramo guruh || || siddhijalam samalokya yoginam mantravadinam
    | tucchakaramanovrittih yasyasau paramo guruh || || svashariram shavam pashyan tatha svatmanamadvayam
    | yah strikanakamohaghnah sa bhavet paramo guruh || || mauni vagmiti tattvajno dvidha'bhucchrinu parvati
    | na kashcinmauninam lobho loke'sminbhavati priye || || vagmi tutkatasamsarasagarottaranakshamah |
    yato'sau samshayacchetta shastrayuktyanubhutibhih || || gurunamajapaddevi bahujanmarjitanyapi | papani
    vilayam yanti nasti sandehamanvapi || || shrigurossadrisham daivam shrigurosadrishah pita | gurudhyanasamam
    karma nasti nasti mahitale || || kulam dhanam balam shastram bandhavassodara ime | marane nopayujyante
    gurureko hi tarakah || || kulameva pavitram syat satyam svagurusevaya | triptah syussakala deva brahmadya
    gurutarpanat || || gurureko hi janati svarupam devamavyayam | tad jnanam yatprasadena nanyatha shastrakotibhih
    || || svarupajnanashunyena kritamapyakritam bhavet | tapojapadikam devi sakalam balajalpavat || ||
    shivam keciddharim kecidvidhim kecittu kecana | shaktim daivamiti jnatva vivadanti vritha narah ||
    || na jananti param tattvam gurudikshaparanmukhah | bhrantah pashusama hyete svaparijnanavarjitah
    || || tasmatkaivalyasiddhyartham gurumeva bhajetpriye | gurum vina na jananti mudhastatparamam padam
    || || bhidyate hridayagranthishchidyante sarvasamshayah | kshiyante sarvakarmani guroh karunaya shive
    || || kritaya gurubhaktestu vedashastranusaratah | mucyate patakadghorat gurubhakto visheshatah ||
    || dussangam ca parityajya papakarma parityajet | cittacihnamidam yasya tasya diksha vidhiyate ||
    || cittatyaganiyuktashca krodhagarvavivarjitah | dvaitabhavaparityagi tasya diksha vidhiyate || ||
    etallakshanayuktatvam sarvabhutahite ratam | nirmalam jivitam yasya tasya diksha vidhiyate || || kriyaya
    canvitam purvam dikshajalam nirupitam | mantradikshabhidham sangopangam sarvam shivoditam || || kriyaya
    syadvirahitam gurusayujyadayinim | gurudiksham vina ko va gurutvacarapalakah || || shakto na capi
    shakto va daishikanghri samashrayet | tasya janmasti saphalam bhogamokshaphalapradam || || atyantacittapakvasya
    shraddhabhaktiyutasya ca | pravaktavyamidam devi mamatmapritaye sada || || rahasyam sarvashastreshu
    gitashastramidam shive | samyakparikshya vaktavyam sadhakasya mahatmanah || || satkarmaparipakacca
    cittashuddhishca dhimatah | sadhakasyaiva vaktavya gurugita prayatnatah || || nastikaya kritaghnaya
    dambhikaya shathaya ca | abhaktaya vibhaktaya na vacyeyam kadacana || || strilolupaya murkhaya kamopahatacetase
    | nindakaya na vaktavya gurugita svabhavatah || || sarvapapaprashamanam sarvopadravavarakam | janmamrityuharam
    devi gitashastramidam shive || || shrutisaramidam devi sarvamuktam samasatah | nanyatha sadgatih pumsam
    vina gurupadam shive || || bahujanmakritatpapadayamartho na rocate | janmabandhanivrittyartham gurumeva
    bhajetsada || || ahameva jagatsarvamahameva param padam | etad jnanam yato bhuyattam gurum pranamamyaham
    || || alam vikalpairahameva kevalam mayi sthitam vishvamidam caracaram | idam rahasyam mama yena darshitam
    sa vandaniyo gurureva kevalam || || yasyantam nadimadhyam na hi karacaranam namagotram na sutram |
    no jatirnaiva varno na bhavati purusho no napumso na ca stri || || nakaram no vikaram na hi janimaranam
    nasti punyam na papam | no'tattvam tattvamekam sahajasamarasam sadgurum tam namami || || nityaya satyaya
    cidatmakaya navyaya bhavyaya paratparaya | shuddhaya buddhaya niranjanaya namo'stu nityam gurushekharaya
    || || saccidanandarupaya vyapine paramatmane | namah shrigurunathaya prakashanandamurtaye || || satyanandasvarupaya
    bodhaikasukhakarine | namo vedantavedyaya gurave buddhisakshine || || namaste natha bhagavan shivaya
    gururupine | vidyavatarasamsiddhyai svikritanekavigraha || || navaya navarupaya paramarthaikarupine
    | sarvajnanatamobhedabhanave cidghanaya te || || svatantraya dayakluptavigrahaya shivatmane | paratantraya
    bhaktanam bhavyanam bhavyarupine || || vivekinam vivekaya vimarshaya vimarshinam | prakashinam prakashaya
    jnaninam jnanarupine || || purastatparshvayoh prishthe namaskuryaduparyadhah | sada maccittarupena
    vidhehi bhavadasanam || || shrigurum paramanandam vande hyanandavigraham | yasya sannidhimatrena cidanandaya
    te manah || || namo'stu gurave tubhyam sahajanandarupine | yasya vagamritam hanti visham samsarasanjnakam
    || || nanayuktopadeshena tarita shishyasantatih | tatkripasaravedena gurucitpadamacyutam || acyutaya
    namastubhyam gurave paramatmane | svaramoktapadecchunam dattam yenacyutam padam || acyutaya namastubhyam
    gurave paramatmane | sarvatantrasvatantraya cidghananandamurtaye || || namo'cyutaya gurave'jnanadhvantaikabhanave
    | shishyasanmargapatave kripapiyushasindhave || || omacyutaya gurave shishyasamsarasetave | bhaktakaryaikasimhaya
    namaste citsukhatmane || || gurunamasamam daivam na pita na ca bandhavah | gurunamasamah svami nedrisham
    paramam padam || || ekaksharapradataram yo gurum naiva manyate | shvanayonishatam gatva candaleshvapi
    jayate || || gurutyagadbhavenmrityuh mantratyagaddaridrata | gurumantraparityagi rauravam narakam
    vrajet || || shivakrodhadgurustrata gurukrodhacchivo na hi | tasmatsarvaprayatnena gurorajnam na langhayet
    || || samsarasagarasamuddharanaikamantram brahmadidevamunipujitasiddhamantram | daridryaduhkhabhavarogavinashamantram
    vande mahabhayaharam gururajamantram || || saptakotimahamantrashcittavibhramakarakah | eka eva mahamantro
    gururityaksharadvayam || || evamuktva mahadevah parvatim punarabravit | idameva param tattvam shrinu
    devi sukhavaham || || gurutattvamidam devi sarvamuktam samasatah | rahasyamidamavyaktam na vadedyasya
    kasyacit || || na mrisha syadiyam devi maduktih satyarupini | gurugitasamam stotram nasti nasti mahitale
    || || gurugitamimam devi bhavaduhkhavinashinim | gurudikshavihinasya purato na pathet kvacit || ||
    rahasyamatyantarahasyametanna papina labhyamidam maheshvari | anekajanmarjitapunyapakadgurostu tattvam
    labhate manushyah || || yasya prasadadahameva sarvam mayyeva sarvam parikalpitam ca | ittham vijanami
    sadatmarupam tasyanghripadmam pranato'smi nityam || || ajnanatimirandhasya vishayakrantacetasah |
    jnanaprabhapradanena prasadam kuru me prabho || || iti shriskandapurane uttarakhande umamaheshvara
    samvade shri gurugita samapta || mangalam mangalam gurudevaya mahaniyagunatmane | sarvalokasharanyaya
    sadhurupaya mangalam ||
  devanagari: अथ तृतीयोऽध्यायः ॥ अथ काम्यजपस्थानं कथयामि वरानने । सागरान्ते सरित्तीरे तीर्थे हरिहरालये
    ॥ ॥ शक्तिदेवालये गोष्ठे सर्वदेवालये शुभे । वटस्य धात्र्या मूले वा मठे बृन्दावने तथा ॥ ॥ पवित्रे निर्मले
    देशे नित्यानुष्ठानतोऽपि वा । निर्वेदनेन मौनेन जपमेतत् समारभेत् ॥ ॥ जाप्येन जयमाप्नोति जपसिद्धिं फलं
    तथा । हीनं कर्म त्यजेत्सर्वं गर्हितस्थानमेव च ॥ ॥ श्मशाने बिल्वमूले वा वटमूलान्तिके तथा । सिद्ध्यन्ति
    कानके मूले चूतवृक्षस्य सन्निधौ ॥ ॥ पीतासनं मोहने तु ह्यसितं चाभिचारिके । ज्ञेयं शुक्लं च शान्त्यर्थं
    वश्ये रक्तं प्रकीर्तितम् ॥ ॥ जपं हीनासनं कुर्वन् हीनकर्मफलप्रदम् । गुरुगीतां प्रयाणे वा सङ्ग्रामे
    रिपुसङ्कटे ॥ ॥ जपन् जयमवाप्नोति मरणे मुक्तिदायिका । सर्वकर्माणि सिद्ध्यन्ति गुरुपुत्रे न संशयः ॥ ॥
    गुरुमन्त्रो मुखे यस्य तस्य सिद्ध्यन्ति नाऽन्यथा । दीक्षया सर्वकर्माणि सिद्ध्यन्ति गुरुपुत्रके ॥ ॥
    भवमूलविनाशाय चाष्टपाशनिवृत्तये । गुरुगीताम्भसि स्नानं तत्त्वज्ञः कुरुते सदा ॥ ॥ स एवं सद्गुरुः साक्षात्
    सदसद्ब्रह्मवित्तमः । तस्य स्थानानि सर्वाणि पवित्राणि न संशयः ॥ ॥ सर्वशुद्धः पवित्रोऽसौ स्वभावाद्यत्र
    तिष्ठति । तत्र देवगणाः सर्वे क्षेत्रपीठे चरन्ति च ॥ ॥ आसनस्थाः शयाना वा गच्छन्तस्तिष्ठतोऽपि वा । अश्वारूढा
    गजारूढाः सुषुप्ता जाग्रतोऽपि वा ॥ ॥ शुचिर्भूता ज्ञानवन्तो गुरुगीतां जपन्ति ये । तेषां दर्शनसंस्पर्शात्
    दिव्यज्ञानं प्रजायते ॥ ॥ समुद्रे वै यथा तोयं क्षीरे क्षीरं जले जलम् । भिन्ने कुम्भे यथाऽऽकाशं तथाऽऽत्मा
    परमात्मनि ॥ ॥ तथैव ज्ञानवान् जीवः परमात्मनि सर्वदा । ऐक्येन रमते ज्ञानी यत्र कुत्र दिवानिशम् ॥ ॥ एवंविधो
    महायुक्तः सर्वत्र वर्तते सदा । तस्मात्सर्वप्रकारेण गुरुभक्तिं समाचरेत् ॥ ॥ गुरुसन्तोषणादेव मुक्तो
    भवति पार्वति । अणिमादिषु भोक्तृत्वं कृपया देवि जायते ॥ ॥ साम्येन रमते ज्ञानी दिवा वा यदि वा निशि ।
    एवंविधो महामौनी त्रैलोक्यसमतां व्रजेत् ॥ ॥ अथ संसारिणः सर्वे गुरुगीता जपेन तु । सर्वान् कामांस्तु
    भुञ्जन्ति त्रिसत्यं मम भाषितम् ॥ ॥ सत्यं सत्यं पुनः सत्यं धर्मसारं मयोदितम् । गुरुगीतासमं स्तोत्रं
    नास्ति तत्त्वं गुरोः परम् ॥ ॥ गुरुर्देवो गुरुर्धर्मो गुरौ निष्ठा परं तपः । गुरोः परतरं नास्ति त्रिवारं
    कथयामि ते ॥ ॥ धन्या माता पिता धन्यो गोत्रं धन्यं कुलोद्भवः । धन्या च वसुधा देवि यत्र स्याद्गुरुभक्तता
    ॥ ॥ आकल्पजन्म कोटीनां यज्ञव्रततपः क्रियाः । ताः सर्वाः सफला देवि गुरूसन्तोषमात्रतः ॥ ॥ शरीरमिन्द्रियं
    प्राणमर्थं स्वजनबन्धुता । मातृकुलं पितृकुलं गुरुरेव न संशयः ॥ ॥ मन्दभाग्या ह्यशक्ताश्च ये जना नानुमन्वते
    । गुरुसेवासु विमुखाः पच्यन्ते नरकेऽशुचौ ॥ ॥ विद्या धनं बलं चैव तेषां भाग्यं निरर्थकम् । येषां गुरूकृपा
    नास्ति अधो गच्छन्ति पार्वति ॥ ॥ ब्रह्मा विष्णुश्च रुद्रश्च देवाश्च पितृकिन्नराः । सिद्धचारणयक्षाश्च
    अन्ये च मुनयो जनाः ॥ ॥ गुरुभावः परं तीर्थमन्यतीर्थं निरर्थकम् । सर्वतीर्थमयं देवि श्रीगुरोश्चरणाम्बुजम्
    ॥ ॥ कन्याभोगरता मन्दाः स्वकान्तायाः पराङ्मुखाः । अतः परं मया देवि कथितं न मम प्रिये ॥ ॥ इदं रहस्यमस्पष्टं
    वक्तव्यं च वरानने । सुगोप्यं च तवाग्रे तु ममात्मप्रीतये सति ॥ ॥ स्वामिमुख्यगणेशाद्यान् वैष्णवादींश्च
    पार्वति । न वक्तव्यं महामाये पादस्पर्शं कुरुष्व मे ॥ ॥ अभक्ते वञ्चके धूर्ते पाषण्डे नास्तिकादिषु ।
    मनसाऽपि न वक्तव्या गुरुगीता कदाचन ॥ ॥ गुरवो बहवः सन्ति शिष्यवित्तापहारकाः । तमेकं दुर्लभं मन्ये शिष्यहृत्तापहारकम्
    ॥ ॥ चातुर्यवान् विवेकी च अध्यात्मज्ञानवान् शुचिः । मानसं निर्मलं यस्य गुरुत्वं तस्य शोभते ॥ ॥ गुरवो
    निर्मलाः शान्ताः साधवो मितभाषिणः । कामक्रोधविनिर्मुक्ताः सदाचाराः जितेन्द्रियाः ॥ ॥ सूचकादिप्रभेदेन
    गुरवो बहुधा स्मृताः । स्वयं सम्यक् परीक्ष्याथ तत्त्वनिष्ठं भजेत्सुधीः ॥ ॥ वर्णजालमिदं तद्वद्बाह्यशास्त्रं
    तु लौकिकम् । यस्मिन् देवि समभ्यस्तं स गुरुः सुचकः स्मृतः ॥ ॥ वर्णाश्रमोचितां विद्यां धर्माधर्मविधायिनीम्
    । प्रवक्तारं गुरुं विद्धि वाचकं त्विति पार्वति ॥ ॥ पञ्चाक्षर्यादिमन्त्राणामुपदेष्टा तु पार्वति । स
    गुरुर्बोधको भूयादुभयोरयमुत्तमः ॥ ॥ मोहमारणवश्यादितुच्छमन्त्रोपदेशिनम् । निषिद्धगुरुरित्याहुः पण्डितास्तत्त्वदर्शिनः
    ॥ ॥ अनित्यमिति निर्दिश्य संसारं सङ्कटालयम् । वैराग्यपथदर्शी यः स गुरुर्विहितः प्रिये ॥ ॥ तत्त्वमस्यादिवाक्यानामुपदेष्टा
    तु पार्वति । कारणाख्यो गुरुः प्रोक्तो भवरोगनिवारकः ॥ ॥ सर्वसन्देहसन्दोहनिर्मूलनविचक्षणः । जन्ममृत्युभयघ्नो
    यः स गुरुः परमो मतः ॥ ॥ बहुजन्मकृतात् पुण्याल्लभ्यतेऽसौ महागुरुः । लब्ध्वाऽमुं न पुनर्याति शिष्यः
    संसारबन्धनम् ॥ ॥ एवं बहुविधा लोके गुरवः सन्ति पार्वति । तेषु सर्वप्रयत्नेन सेव्यो हि परमो गुरुः ॥
    ॥ निषिद्धगुरुशिष्यस्तु दुष्टसङ्कल्पदूषितः । ब्रह्मप्रलयपर्यन्तं न पुनर्याति मर्त्यताम् ॥ ॥ एवं श्रुत्वा
    महादेवी महादेववचस्तथा । अत्यन्तविह्वलमनाः शङ्करं परिपृच्छति ॥ ॥ पार्वत्युवाच । नमस्ते देवदेवात्र श्रोतव्यं
    किञ्चिदस्ति मे । श्रुत्वा त्वद्वाक्यमधुना भृशं स्याद्विह्वलं मनः ॥ ॥ स्वयं मूढा मृत्युभीताः सुकृताद्विरतिं
    गताः । दैवान्निषिद्धगुरुगा यदि तेषां तु का गतिः ॥ ॥ श्री महादेव उवाच । शृणु तत्त्वमिदं देवि यदा स्याद्विरतो
    नरः । तदाऽसावधिकारीति प्रोच्यते श्रुतिमस्तकैः ॥ ॥ अखण्डैकरसं ब्रह्म नित्यमुक्तं निरामयम् । स्वस्मिन्
    सन्दर्शितं येन स भवेदस्यं देशिकः ॥ ॥ जलानां सागरो राजा यथा भवति पार्वति । गुरूणां तत्र सर्वेषां राजाऽयं
    परमो गुरुः ॥ ॥ मोहादिरहितः शान्तो नित्यतृप्तो निराश्रयः । तृणीकृतब्रह्मविष्णुवैभवः परमो गुरुः ॥ ॥
    सर्वकालविदेशेषु स्वतन्त्रो निश्चलस्सुखी । अखण्डैकरसास्वादतृप्तो हि परमो गुरुः ॥ ॥ द्वैताद्वैतविनिर्मुक्तः
    स्वानुभूतिप्रकाशवान् । अज्ञानान्धतमश्छेत्ता सर्वज्ञः परमो गुरुः ॥ ॥ यस्य दर्शनमात्रेण मनसः स्यात्
    प्रसन्नता । स्वयं भूयात् धृतिश्शान्तिः स भवेत् परमो गुरुः ॥ ॥ सिद्धिजालं समालोक्य योगिनां मन्त्रवादिनाम्
    । तुच्छाकारमनोवृत्तिः यस्यासौ परमो गुरुः ॥ ॥ स्वशरीरं शवं पश्यन् तथा स्वात्मानमद्वयम् । यः स्त्रीकनकमोहघ्नः
    स भवेत् परमो गुरुः ॥ ॥ मौनी वाग्मीति तत्त्वज्ञो द्विधाऽभूच्छृणु पार्वति । न कश्चिन्मौनिनां लोभो लोकेऽस्मिन्भवति
    प्रिये ॥ ॥ वाग्मी तूत्कटसंसारसागरोत्तारणक्षमः । यतोऽसौ संशयच्छेत्ता शास्त्रयुक्त्यनुभूतिभिः ॥ ॥ गुरुनामजपाद्देवि
    बहुजन्मार्जितान्यपि । पापानि विलयं यान्ति नास्ति सन्देहमण्वपि ॥ ॥ श्रीगुरोस्सदृशं दैवं श्रीगुरोसदृशः
    पिता । गुरुध्यानसमं कर्म नास्ति नास्ति महीतले ॥ ॥ कुलं धनं बलं शास्त्रं बान्धवास्सोदरा इमे । मरणे
    नोपयुज्यन्ते गुरुरेको हि तारकः ॥ ॥ कुलमेव पवित्रं स्यात् सत्यं स्वगुरुसेवया । तृप्ताः स्युस्सकला देवा
    ब्रह्माद्या गुरुतर्पणात् ॥ ॥ गुरुरेको हि जानाति स्वरूपं देवमव्ययम् । तद् ज्ञानं यत्प्रसादेन नान्यथा
    शास्त्रकोटिभिः ॥ ॥ स्वरूपज्ञानशून्येन कृतमप्यकृतं भवेत् । तपोजपादिकं देवि सकलं बालजल्पवत् ॥ ॥ शिवं
    केचिद्धरिं केचिद्विधिं केचित्तु केचन । शक्तिं दैवमिति ज्ञात्वा विवदन्ति वृथा नराः ॥ ॥ न जानन्ति परं
    तत्त्वं गुरुदीक्षापराङ्मुखाः । भ्रान्ताः पशुसमा ह्येते स्वपरिज्ञानवर्जिताः ॥ ॥ तस्मात्कैवल्यसिद्ध्यर्थं
    गुरुमेव भजेत्प्रिये । गुरुं विना न जानन्ति मूढास्तत्परमं पदम् ॥ ॥ भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः
    । क्षीयन्ते सर्वकर्माणि गुरोः करुणया शिवे ॥ ॥ कृताया गुरुभक्तेस्तु वेदशास्त्रानुसारतः । मुच्यते पातकाद्घोरात्
    गुरुभक्तो विशेषतः ॥ ॥ दुस्सङ्गं च परित्यज्य पापकर्म परित्यजेत् । चित्तचिह्नमिदं यस्य तस्य दीक्षा विधीयते
    ॥ ॥ चित्तत्यागनियुक्तश्च क्रोधगर्वविवर्जितः । द्वैतभावपरित्यागी तस्य दीक्षा विधीयते ॥ ॥ एतल्लक्षणयुक्तत्वं
    सर्वभूतहिते रतम् । निर्मलं जीवितं यस्य तस्य दीक्षा विधीयते ॥ ॥ क्रियया चान्वितं पूर्वं दीक्षाजालं
    निरूपितम् । मन्त्रदीक्षाभिधं साङ्गोपाङ्गं सर्वं शिवोदितम् ॥ ॥ क्रियया स्याद्विरहितां गुरुसायुज्यदायिनीम्
    । गुरुदीक्षां विना को वा गुरुत्वाचारपालकः ॥ ॥ शक्तो न चापि शक्तो वा दैशिकाङ्घ्रि समाश्रयेत् । तस्य
    जन्मास्ति सफलं भोगमोक्षफलप्रदम् ॥ ॥ अत्यन्तचित्तपक्वस्य श्रद्धाभक्तियुतस्य च । प्रवक्तव्यमिदं देवि
    ममात्मप्रीतये सदा ॥ ॥ रहस्यं सर्वशास्त्रेषु गीताशास्त्रमिदं शिवे । सम्यक्परीक्ष्य वक्तव्यं साधकस्य
    महात्मनः ॥ ॥ सत्कर्मपरिपाकाच्च चित्तशुद्धिश्च धीमतः । साधकस्यैव वक्तव्या गुरुगीता प्रयत्नतः ॥ ॥ नास्तिकाय
    कृतघ्नाय दाम्भिकाय शठाय च । अभक्ताय विभक्ताय न वाच्येयं कदाचन ॥ ॥ स्त्रीलोलुपाय मूर्खाय कामोपहतचेतसे
    । निन्दकाय न वक्तव्या गुरुगीता स्वभावतः ॥ ॥ सर्वपापप्रशमनं सर्वोपद्रववारकम् । जन्ममृत्युहरं देवि गीताशास्त्रमिदं
    शिवे ॥ ॥ श्रुतिसारमिदं देवि सर्वमुक्तं समासतः । नान्यथा सद्गतिः पुंसां विना गुरुपदं शिवे ॥ ॥ बहुजन्मकृतात्पापादयमर्थो
    न रोचते । जन्मबन्धनिवृत्त्यर्थं गुरुमेव भजेत्सदा ॥ ॥ अहमेव जगत्सर्वमहमेव परं पदम् । एतद् ज्ञानं यतो
    भूयात्तं गुरुं प्रणमाम्यहम् ॥ ॥ अलं विकल्पैरहमेव केवलं मयि स्थितं विश्वमिदं चराचरम् । इदं रहस्यं मम
    येन दर्शितं स वन्दनीयो गुरुरेव केवलम् ॥ ॥ यस्यान्तं नादिमध्यं न हि करचरणं नामगोत्रं न सूत्रम् । नो
    जातिर्नैव वर्णो न भवति पुरुषो नो नपुंसो न च स्त्री ॥ ॥ नाकारं नो विकारं न हि जनिमरणं नास्ति पुण्यं
    न पापम् । नोऽतत्त्वं तत्त्वमेकं सहजसमरसं सद्गुरुं तं नमामि ॥ ॥ नित्याय सत्याय चिदात्मकाय नव्याय भव्याय
    परात्पराय । शुद्धाय बुद्धाय निरञ्जनाय नमोऽस्तु नित्यं गुरुशेखराय ॥ ॥ सच्चिदानन्दरूपाय व्यापिने परमात्मने
    । नमः श्रीगुरुनाथाय प्रकाशानन्दमूर्तये ॥ ॥ सत्यानन्दस्वरूपाय बोधैकसुखकारिणे । नमो वेदान्तवेद्याय गुरवे
    बुद्धिसाक्षिणे ॥ ॥ नमस्ते नाथ भगवन् शिवाय गुरुरूपिणे । विद्यावतारसंसिद्ध्यै स्वीकृतानेकविग्रह ॥ ॥
    नवाय नवरूपाय परमार्थैकरूपिणे । सर्वाज्ञानतमोभेदभानवे चिद्घनाय ते ॥ ॥ स्वतन्त्राय दयाक्लुप्तविग्रहाय
    शिवात्मने । परतन्त्राय भक्तानां भव्यानां भव्यरूपिणे ॥ ॥ विवेकिनां विवेकाय विमर्शाय विमर्शिनाम् । प्रकाशिनां
    प्रकाशाय ज्ञानिनां ज्ञानरूपिणे ॥ ॥ पुरस्तात्पार्श्वयोः पृष्ठे नमस्कुर्यादुपर्यधः । सदा मच्चित्तरूपेण
    विधेहि भवदासनम् ॥ ॥ श्रीगुरुं परमानन्दं वन्दे ह्यानन्दविग्रहम् । यस्य सन्निधिमात्रेण चिदानन्दाय ते
    मनः ॥ ॥ नमोऽस्तु गुरवे तुभ्यं सहजानन्दरूपिणे । यस्य वागमृतं हन्ति विषं संसारसञ्ज्ञकम् ॥ ॥ नानायुक्तोपदेशेन
    तारिता शिष्यसन्ततिः । तत्कृपासारवेदेन गुरुचित्पदमच्युतम् ॥ अच्युताय नमस्तुभ्यं गुरवे परमात्मने । स्वारामोक्तपदेच्छूनां
    दत्तं येनाच्युतं पदम् ॥ अच्युताय नमस्तुभ्यं गुरवे परमात्मने । सर्वतन्त्रस्वतन्त्राय चिद्घनानन्दमूर्तये
    ॥ ॥ नमोऽच्युताय गुरवेऽज्ञानध्वान्तैकभानवे । शिष्यसन्मार्गपटवे कृपापीयूषसिन्धवे ॥ ॥ ओमच्युताय गुरवे
    शिष्यसंसारसेतवे । भक्तकार्यैकसिंहाय नमस्ते चित्सुखात्मने ॥ ॥ गुरुनामसमं दैवं न पिता न च बान्धवाः ।
    गुरुनामसमः स्वामी नेदृशं परमं पदम् ॥ ॥ एकाक्षरप्रदातारं यो गुरुं नैव मन्यते । श्वानयोनिशतं गत्वा चाण्डालेष्वपि
    जायते ॥ ॥ गुरुत्यागाद्भवेन्मृत्युः मन्त्रत्यागाद्दरिद्रता । गुरुमन्त्रपरित्यागी रौरवं नरकं व्रजेत्
    ॥ ॥ शिवक्रोधाद्गुरुस्त्राता गुरुक्रोधाच्छिवो न हि । तस्मात्सर्वप्रयत्नेन गुरोराज्ञां न लङ्घयेत् ॥
    ॥ संसारसागरसमुद्धरणैकमन्त्रं ब्रह्मादिदेवमुनिपूजितसिद्धमन्त्रम् । दारिद्र्यदुःखभवरोगविनाशमन्त्रं वन्दे
    महाभयहरं गुरुराजमन्त्रम् ॥ ॥ सप्तकोटिमहामन्त्राश्चित्तविभ्रमकारकाः । एक एव महामन्त्रो गुरुरित्यक्षरद्वयम्
    ॥ ॥ एवमुक्त्वा महादेवः पार्वतीं पुनरब्रवीत् । इदमेव परं तत्त्वं शृणु देवि सुखावहम् ॥ ॥ गुरुतत्त्वमिदं
    देवि सर्वमुक्तं समासतः । रहस्यमिदमव्यक्तं न वदेद्यस्य कस्यचित् ॥ ॥ न मृषा स्यादियं देवि मदुक्तिः सत्यरूपिणी
    । गुरुगीतासमं स्तोत्रं नास्ति नास्ति महीतले ॥ ॥ गुरुगीतामिमां देवि भवदुःखविनाशिनीम् । गुरुदीक्षाविहीनस्य
    पुरतो न पठेत् क्वचित् ॥ ॥ रहस्यमत्यन्तरहस्यमेतन्न पापिना लभ्यमिदं महेश्वरि । अनेकजन्मार्जितपुण्यपाकाद्गुरोस्तु
    तत्त्वं लभते मनुष्यः ॥ ॥ यस्य प्रसादादहमेव सर्वं मय्येव सर्वं परिकल्पितं च । इत्थं विजानामि सदात्मरूपं
    तस्याङ्घ्रिपद्मं प्रणतोऽस्मि नित्यम् ॥ ॥ अज्ञानतिमिरान्धस्य विषयाक्रान्तचेतसः । ज्ञानप्रभाप्रदानेन
    प्रसादं कुरु मे प्रभो ॥ ॥ इति श्रीस्कन्दपुराणे उत्तरखण्डे उमामहेश्वर संवादे श्री गुरुगीता समाप्त ॥
    मङ्गलं मङ्गलं गुरुदेवाय महनीयगुणात्मने । सर्वलोकशरण्याय साधुरूपाय मङ्गलम् ॥
