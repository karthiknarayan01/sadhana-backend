id: indrakshi-stotram
category: stotram
name:
  english: Indrakshi Stotram
content:
  english: narada uvaca | indrakshistotramakhyahi narayana gunarnava | parvatyai shivasamproktam param
    kautuhalam hi me || narayana uvaca | indrakshi stotra mantrasya mahatmyam kena vocyate | indrenadau
    kritam stotram sarvapadvinivaranam || tadevaham bravimyadya pricchatastava narada | asya shri indrakshistotramahamantrasya
    indrakshi durga devata mama indrakshi prasada siddhyarthe jape viniyogah | karanyasah indrakshyai
    angushthabhyam namah | mahalakshmyai tarjanibhyam namah | maheshvaryai madhyamabhyam namah | ambujakshyai
    anamikabhyam namah | katyayanyai kanishthikabhyam namah | kaumaryai karatalakaraprishthabhyam namah
    | anganyasah indrakshyai hridayaya namah | mahalakshmyai shirase svaha | maheshvaryai shikhayai vashat
    | ambujakshyai kavacaya hum | katyayanyai netratrayaya vaushat | kaumaryai astraya phat | bhurbhuvassuvaromiti
    digbandhah || dhyanam netranam dashabhishshataih parivritamatyugracarmambaram | hemabham mahatim vilambitashikhamamuktakeshanvitam
    || ghantamanditapadapadmayugalam nagendrakumbhastanim | indrakshim paricintayami manasa kalpoktasiddhipradam
    || || indrakshim dvibhujam devim pitavastradvayanvitam | vamahaste vajradharam dakshinena varapradam
    || indrakshim sahayuvatim nanalankarabhushitam | prasannavadanambhojamapsaroganasevitam || || dvibhujam
    saumyavadanam pashankushadharam param | trailokyamohinim devim indrakshi nama kirtitam || || pitambaram
    vajradharaikahastam nanavidhalankaranam prasannam | tvamapsarassevitapadapadmam indrakshim vande shivadharmapatnim
    || || pancapuja lam prithivyatmikayai gandham samarpayami | ham akashatmikayai pushpaih pujayami |
    yam vayvatmikayai dhupamaghrapayami | ram agnyatmikayai dipam darshayami | vam amritatmikayai amritam
    mahanaivedyam nivedayami | sam sarvatmikayai sarvopacarapujam samarpayami || digdevata raksha indra
    uvaca | indrakshi purvatah patu patvagneyyam tatheshvari | kaumari dakshine patu nairrityam patu parvati
    || || varahi pashcime patu vayavye narasimhyapi | udicyam kalaratri mam aishanyam sarvashaktayah ||
    || bhairavyordhvam sada patu patvadho vaishnavi tatha | evam dashadisho rakshetsarvada bhuvaneshvari
    || || om hrim shrim indrakshyai namah | stotram indrakshi nama sa devi devataissamudahrita | gauri
    shakambhari devi durganamniti vishruta || || nityanandi nirahari nishkalayai namo'stu te | katyayani
    mahadevi candraghanta mahatapah || || savitri sa ca gayatri brahmani brahmavadini | narayani bhadrakali
    rudrani krishnapingala || || agnijvala raudramukhi kalaratri tapasvini | meghasvana sahasrakshi vikatangi
    || mahodari muktakeshi ghorarupa mahabala | ajita bhadrada'nanta rogahantri shivapriya || || shivaduti
    karali ca pratyakshaparameshvari | indrani indrarupa ca indrashaktihparayani || || sada sammohini
    devi sundari bhuvaneshvari | ekakshari para brahmi sthulasukshmapravardhani || || rakshakari raktadanta
    raktamalyambara para | mahishasurasamhartri camunda saptamatrika || || varahi narasimhi ca bhima bhairavavadini
    | shrutissmritirdhritirmedha vidyalakshmissarasvati || || ananta vijaya'parna manasoktaparajita |
    bhavani parvati durga haimavatyambika shiva || || shiva bhavani rudrani shankarardhasharirini | airavatagajarudha
    vajrahasta varaprada || || dhurjati vikati ghori hyashtangi narabhojini | bhramari kanci kamakshi
    kvananmanikyanupura || || hrinkari raudrabhetali hrunkaryamritapanini | tripadbhasmapraharana trishira
    raktalocana || || nitya sakalakalyani sarvaishvaryapradayini | dakshayani padmahasta bharati sarvamangala
    || || kalyani janani durga sarvaduhkhavinashini | indrakshi sarvabhuteshi sarvarupa manonmani || ||
    mahishamastakanrityavinodana sphutarananmaninupurapaduka | jananarakshanamokshavidhayini jayatu shumbhanishumbhanishudini
    || || shiva ca shivarupa ca shivashaktiparayani | mrityunjayi mahamayi sarvaroganivarini || || aindridevi
    sadakalam shantimashukarotu me | ishvarardhanganilaya indubimbanibhanana || || sarvorogaprashamani
    sarvamrityunivarini | apavargaprada ramya ayurarogyadayini || || indradidevasamstutya ihamutraphalaprada
    | icchashaktisvarupa ca ibhavaktradvijanmabhuh || || bhasmayudhaya vidmahe raktanetraya dhimahi tanno
    jvaraharah pracodayat || || mantrah om aim hrim shrim klim klum indrakshyai namah || || om namo bhagavati
    indrakshi sarvajanasammohini kalaratri narasimhi sarvashatrusamharini anale abhaye ajite aparajite
    mahasimhavahini mahishasuramardini hana hana mardaya mardaya maraya maraya shoshaya shoshaya dahaya
    dahaya mahagrahan samhara samhara yakshagraha rakshasagraha skandagraha vinayakagraha balagraha kumaragraha
    coragraha bhutagraha pretagraha pishacagraha kushmandagrahadin mardaya mardaya nigraha nigraha dhumabhutansantravaya
    santravaya bhutajvara pretajvara pishacajvara ushnajvara pittajvara vatajvara shleshmajvara kaphajvara
    alapajvara sannipatajvara mahendrajvara kritrimajvara krityadijvara ekahikajvara dvayahikajvara trayahikajvara
    caturthikajvara pancahikajvara pakshajvara masajvara shanmasajvara samvatsarajvara jvaralapajvara
    sarvajvara sarvangajvaran nashaya nashaya hara hara hana hana daha daha paca paca tadaya tadaya akarshaya
    akarshaya vidveshaya vidveshaya stambhaya stambhaya mohaya mohaya uccataya uccataya hum phat svaha
    || || om hrim om namo bhagavati trailokyalakshmi sarvajanavashankari sarvadushtagrahastambhini kankali
    kamarupini kalarupini ghorarupini paramantraparayantra prabhedini pratibhatavidhvamsini parabalaturagavimardini
    shatrukaracchedini shatrumamsabhakshini sakaladushtajvaranivarini bhuta preta pishaca brahmarakshasa
    yaksha yamaduta shakini dakini kamini stambhini mohini vashankari kukshiroga shiroroga netraroga kshayapasmara
    kushthadi maharoganivarini mama sarvarogam nashaya nashaya hram hrim hrum hraim hraum hrah hum phat
    svaha || || om namo bhagavati maheshvari mahacintamani durge sakalasiddheshvari sakalajanamanoharini
    kalakalaratri mahaghorarupe pratihatavishvarupini madhusudani mahavishnusvarupini shirashshula katishula
    angashula parshvashula netrashula karnashula pakshashula panduroga kamaradin samhara samhara nashaya
    nashaya vaishnavi brahmastrena vishnucakrena rudrashulena yamadandena varunapashena vasavavajrena
    sarvanarim bhanjaya bhanjaya rajayakshma kshayaroga tapajvaranivarini mama sarvajvaram nashaya nashaya
    ya ra la va sha sha sa ha sarvagrahan tapaya tapaya samhara samhara chedaya chedaya uccataya uccataya
    hram hrim hrum phat svaha || || uttaranyasah karanyasah indrakshyai angushthabhyam namah | mahalakshmyai
    tarjanibhyam namah | maheshvaryai madhyamabhyam namah | ambujakshyai anamikabhyam namah | katyayanyai
    kanishthikabhyam namah | kaumaryai karatalakaraprishthabhyam namah | anganyasah indrakshyai hridayaya
    namah | mahalakshmyai shirase svaha | maheshvaryai shikhayai vashat | ambujakshyai kavacaya hum |
    katyayanyai netratrayaya vaushat | kaumaryai astraya phat | bhurbhuvassuvaromiti digvimokah || samarpanam
    guhyadi guhya goptri tvam grihanasmatkritam japam | siddhirbhavatu me devi tvatprasadanmayi sthiran
    || phalashrutih narayana uvaca | etairnamashatairdivyaih stuta shakrena dhimata | ayurarogyamaishvaryam
    apamrityubhayapaham || || kshayapasmarakushthadi tapajvaranivaranam | coravyaghrabhayam tatra shitajvaranivaranam
    || || maheshvaramahamari sarvajvaranivaranam | shitapaittakavatadi sarvaroganivaranam || || sannijvaranivaranam
    sarvajvaranivaranam | sarvaroganivaranam sarvamangalavardhanam || || shatamavartayedyastu mucyate
    vyadhibandhanat | avartayansahasrattu labhate vanchitam phalam || || etat stotram mahapunyam japedayushyavardhanam
    | vinashaya ca roganamapamrityuharaya ca || || dvijairnityamidam japyam bhagyarogyabhipsubhih | nabhimatrajalesthitva
    sahasraparisankhyaya || || japetstotramimam mantram vacam siddhirbhavettatah | anenavidhina bhaktya
    mantrasiddhishca jayate || || santushta ca bhaveddevi pratyaksha samprajayate | sayam shatam pathennityam
    shanmasatsiddhirucyate || || coravyadhibhayasthane manasahyanucintayan | samvatsaramupashritya sarvakamarthasiddhaye
    || || rajanam vashyamapnoti shanmasannatra samshayah | ashtadorbhissamayukte nanayuddhavisharade ||
    || bhutapretapishacebhyo rogaratimukhairapi | nagebhyah vishayantrebhyah abhicarairmaheshvari || ||
    raksha mam raksha mam nityam pratyaham pujita maya | sarvamangalamangalye shive sarvarthasadhike |
    sharanye tryambake devi narayani namo'stu te || || varam pradadmahendraya devarajyam ca shashvatam
    | indrastotramidam punyam mahadaishvaryakaranam || || iti indrakshi stotram |
  devanagari: नारद उवाच । इन्द्राक्षीस्तोत्रमाख्याहि नारायण गुणार्णव । पार्वत्यै शिवसम्प्रोक्तं परं कौतूहलं
    हि मे ॥ नारायण उवाच । इन्द्राक्षी स्तोत्र मन्त्रस्य माहात्म्यं केन वोच्यते । इन्द्रेणादौ कृतं स्तोत्रं
    सर्वापद्विनिवारणम् ॥ तदेवाहं ब्रवीम्यद्य पृच्छतस्तव नारद । अस्य श्री इन्द्राक्षीस्तोत्रमहामन्त्रस्य
    इन्द्राक्षी दुर्गा देवता मम इन्द्राक्षी प्रसाद सिद्ध्यर्थे जपे विनियोगः । करन्यासः इन्द्राक्ष्यै अङ्गुष्ठाभ्यां
    नमः । महालक्ष्म्यै तर्जनीभ्यां नमः । महेश्वर्यै मध्यमाभ्यां नमः । अम्बुजाक्ष्यै अनामिकाभ्यां नमः ।
    कात्यायन्यै कनिष्ठिकाभ्यां नमः । कौमार्यै करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः इन्द्राक्ष्यै हृदयाय
    नमः । महालक्ष्म्यै शिरसे स्वाहा । महेश्वर्यै शिखायै वषट् । अम्बुजाक्ष्यै कवचाय हुम् । कात्यायन्यै
    नेत्रत्रयाय वौषट् । कौमार्यै अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानम् नेत्राणां दशभिश्शतैः
    परिवृतामत्युग्रचर्माम्बराम् । हेमाभां महतीं विलम्बितशिखामामुक्तकेशान्विताम् ॥ घण्टामण्डितपादपद्मयुगलां
    नागेन्द्रकुम्भस्तनीम् । इन्द्राक्षीं परिचिन्तयामि मनसा कल्पोक्तसिद्धिप्रदाम् ॥ ॥ इन्द्राक्षीं द्विभुजां
    देवीं पीतवस्त्रद्वयान्विताम् । वामहस्ते वज्रधरां दक्षिणेन वरप्रदाम् ॥ इन्द्राक्षीं सहयुवतीं नानालङ्कारभूषिताम्
    । प्रसन्नवदनाम्भोजामप्सरोगणसेविताम् ॥ ॥ द्विभुजां सौम्यवदानां पाशाङ्कुशधरां पराम् । त्रैलोक्यमोहिनीं
    देवीं इन्द्राक्षी नाम कीर्तिताम् ॥ ॥ पीताम्बरां वज्रधरैकहस्तां नानाविधालङ्करणां प्रसन्नाम् । त्वामप्सरस्सेवितपादपद्मां
    इन्द्राक्षीं वन्दे शिवधर्मपत्नीम् ॥ ॥ पञ्चपूजा लं पृथिव्यात्मिकायै गन्धं समर्पयामि । हं आकाशात्मिकायै
    पुष्पैः पूजयामि । यं वाय्वात्मिकायै धूपमाघ्रापयामि । रं अग्न्यात्मिकायै दीपं दर्शयामि । वं अमृतात्मिकायै
    अमृतं महानैवेद्यं निवेदयामि । सं सर्वात्मिकायै सर्वोपचारपूजां समर्पयामि ॥ दिग्देवता रक्ष इन्द्र उवाच
    । इन्द्राक्षी पूर्वतः पातु पात्वाग्नेय्यां तथेश्वरी । कौमारी दक्षिणे पातु नैरृत्यां पातु पार्वती ॥
    ॥ वाराही पश्चिमे पातु वायव्ये नारसिंह्यपि । उदीच्यां कालरात्री मां ऐशान्यां सर्वशक्तयः ॥ ॥ भैरव्योर्ध्वं
    सदा पातु पात्वधो वैष्णवी तथा । एवं दशदिशो रक्षेत्सर्वदा भुवनेश्वरी ॥ ॥ ॐ ह्रीं श्रीं इन्द्राक्ष्यै
    नमः । स्तोत्रं इन्द्राक्षी नाम सा देवी देवतैस्समुदाहृता । गौरी शाकम्भरी देवी दुर्गानाम्नीति विश्रुता
    ॥ ॥ नित्यानन्दी निराहारी निष्कलायै नमोऽस्तु ते । कात्यायनी महादेवी चन्द्रघण्टा महातपाः ॥ ॥ सावित्री
    सा च गायत्री ब्रह्माणी ब्रह्मवादिनी । नारायणी भद्रकाली रुद्राणी कृष्णपिङ्गला ॥ ॥ अग्निज्वाला रौद्रमुखी
    कालरात्री तपस्विनी । मेघस्वना सहस्राक्षी विकटाङ्गी ॥ महोदरी मुक्तकेशी घोररूपा महाबला । अजिता भद्रदाऽनन्ता
    रोगहन्त्री शिवप्रिया ॥ ॥ शिवदूती कराली च प्रत्यक्षपरमेश्वरी । इन्द्राणी इन्द्ररूपा च इन्द्रशक्तिःपरायणी
    ॥ ॥ सदा सम्मोहिनी देवी सुन्दरी भुवनेश्वरी । एकाक्षरी परा ब्राह्मी स्थूलसूक्ष्मप्रवर्धनी ॥ ॥ रक्षाकरी
    रक्तदन्ता रक्तमाल्याम्बरा परा । महिषासुरसंहर्त्री चामुण्डा सप्तमातृका ॥ ॥ वाराही नारसिंही च भीमा भैरववादिनी
    । श्रुतिस्स्मृतिर्धृतिर्मेधा विद्यालक्ष्मीस्सरस्वती ॥ ॥ अनन्ता विजयाऽपर्णा मानसोक्तापराजिता । भवानी
    पार्वती दुर्गा हैमवत्यम्बिका शिवा ॥ ॥ शिवा भवानी रुद्राणी शङ्करार्धशरीरिणी । ऐरावतगजारूढा वज्रहस्ता
    वरप्रदा ॥ ॥ धूर्जटी विकटी घोरी ह्यष्टाङ्गी नरभोजिनी । भ्रामरी काञ्चि कामाक्षी क्वणन्माणिक्यनूपुरा
    ॥ ॥ ह्रीङ्कारी रौद्रभेताली ह्रुङ्कार्यमृतपाणिनी । त्रिपाद्भस्मप्रहरणा त्रिशिरा रक्तलोचना ॥ ॥ नित्या
    सकलकल्याणी सर्वैश्वर्यप्रदायिनी । दाक्षायणी पद्महस्ता भारती सर्वमङ्गला ॥ ॥ कल्याणी जननी दुर्गा सर्वदुःखविनाशिनी
    । इन्द्राक्षी सर्वभूतेशी सर्वरूपा मनोन्मनी ॥ ॥ महिषमस्तकनृत्यविनोदन स्फुटरणन्मणिनूपुरपादुका । जननरक्षणमोक्षविधायिनी
    जयतु शुम्भनिशुम्भनिषूदिनी ॥ ॥ शिवा च शिवरूपा च शिवशक्तिपरायणी । मृत्युञ्जयी महामायी सर्वरोगनिवारिणी
    ॥ ॥ ऐन्द्रीदेवी सदाकालं शान्तिमाशुकरोतु मे । ईश्वरार्धाङ्गनिलया इन्दुबिम्बनिभानना ॥ ॥ सर्वोरोगप्रशमनी
    सर्वमृत्युनिवारिणी । अपवर्गप्रदा रम्या आयुरारोग्यदायिनी ॥ ॥ इन्द्रादिदेवसंस्तुत्या इहामुत्रफलप्रदा
    । इच्छाशक्तिस्वरूपा च इभवक्त्राद्विजन्मभूः ॥ ॥ भस्मायुधाय विद्महे रक्तनेत्राय धीमहि तन्नो ज्वरहरः
    प्रचोदयात् ॥ ॥ मन्त्रः ॐ ऐं ह्रीं श्रीं क्लीं क्लूं इन्द्राक्ष्यै नमः ॥ ॥ ॐ नमो भगवती इन्द्राक्षी
    सर्वजनसम्मोहिनी कालरात्री नारसिंही सर्वशत्रुसंहारिणी अनले अभये अजिते अपराजिते महासिंहवाहिनी महिषासुरमर्दिनी
    हन हन मर्दय मर्दय मारय मारय शोषय शोषय दाहय दाहय महाग्रहान् संहर संहर यक्षग्रह राक्षसग्रह स्कन्दग्रह
    विनायकग्रह बालग्रह कुमारग्रह चोरग्रह भूतग्रह प्रेतग्रह पिशाचग्रह कूष्माण्डग्रहादीन् मर्दय मर्दय निग्रह
    निग्रह धूमभूतान्सन्त्रावय सन्त्रावय भूतज्वर प्रेतज्वर पिशाचज्वर उष्णज्वर पित्तज्वर वातज्वर श्लेष्मज्वर
    कफज्वर आलापज्वर सन्निपातज्वर माहेन्द्रज्वर कृत्रिमज्वर कृत्यादिज्वर एकाहिकज्वर द्वयाहिकज्वर त्रयाहिकज्वर
    चातुर्थिकज्वर पञ्चाहिकज्वर पक्षज्वर मासज्वर षण्मासज्वर संवत्सरज्वर ज्वरालापज्वर सर्वज्वर सर्वाङ्गज्वरान्
    नाशय नाशय हर हर हन हन दह दह पच पच ताडय ताडय आकर्षय आकर्षय विद्वेषय विद्वेषय स्तम्भय स्तम्भय मोहय मोहय
    उच्चाटय उच्चाटय हुं फट् स्वाहा ॥ ॥ ॐ ह्रीं ॐ नमो भगवती त्रैलोक्यलक्ष्मी सर्वजनवशङ्करी सर्वदुष्टग्रहस्तम्भिनी
    कङ्काली कामरूपिणी कालरूपिणी घोररूपिणी परमन्त्रपरयन्त्र प्रभेदिनी प्रतिभटविध्वंसिनी परबलतुरगविमर्दिनी
    शत्रुकरच्छेदिनी शत्रुमांसभक्षिणी सकलदुष्टज्वरनिवारिणी भूत प्रेत पिशाच ब्रह्मराक्षस यक्ष यमदूत शाकिनी
    डाकिनी कामिनी स्तम्भिनी मोहिनी वशङ्करी कुक्षिरोग शिरोरोग नेत्ररोग क्षयापस्मार कुष्ठादि महारोगनिवारिणी
    मम सर्वरोगं नाशय नाशय ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः हुं फट् स्वाहा ॥ ॥ ॐ नमो भगवती माहेश्वरी
    महाचिन्तामणी दुर्गे सकलसिद्धेश्वरी सकलजनमनोहारिणी कालकालरात्री महाघोररूपे प्रतिहतविश्वरूपिणी मधुसूदनी
    महाविष्णुस्वरूपिणी शिरश्शूल कटिशूल अङ्गशूल पार्श्वशूल नेत्रशूल कर्णशूल पक्षशूल पाण्डुरोग कामारादीन्
    संहर संहर नाशय नाशय वैष्णवी ब्रह्मास्त्रेण विष्णुचक्रेण रुद्रशूलेन यमदण्डेन वरुणपाशेन वासववज्रेण सर्वानरीं
    भञ्जय भञ्जय राजयक्ष्म क्षयरोग तापज्वरनिवारिणी मम सर्वज्वरं नाशय नाशय य र ल व श ष स ह सर्वग्रहान् तापय
    तापय संहर संहर छेदय छेदय उच्चाटय उच्चाटय ह्रां ह्रीं ह्रूं फट् स्वाहा ॥ ॥ उत्तरन्यासः करन्यासः इन्द्राक्ष्यै
    अङ्गुष्ठाभ्यां नमः । महालक्ष्म्यै तर्जनीभ्यां नमः । महेश्वर्यै मध्यमाभ्यां नमः । अम्बुजाक्ष्यै अनामिकाभ्यां
    नमः । कात्यायन्यै कनिष्ठिकाभ्यां नमः । कौमार्यै करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः इन्द्राक्ष्यै हृदयाय
    नमः । महालक्ष्म्यै शिरसे स्वाहा । महेश्वर्यै शिखायै वषट् । अम्बुजाक्ष्यै कवचाय हुम् । कात्यायन्यै
    नेत्रत्रयाय वौषट् । कौमार्यै अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्विमोकः ॥ समर्पणं गुह्यादि गुह्य
    गोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवी त्वत्प्रसादान्मयि स्थिरान् ॥ फलश्रुतिः नारायण
    उवाच । एतैर्नामशतैर्दिव्यैः स्तुता शक्रेण धीमता । आयुरारोग्यमैश्वर्यं अपमृत्युभयापहम् ॥ ॥ क्षयापस्मारकुष्ठादि
    तापज्वरनिवारणम् । चोरव्याघ्रभयं तत्र शीतज्वरनिवारणम् ॥ ॥ माहेश्वरमहामारी सर्वज्वरनिवारणम् । शीतपैत्तकवातादि
    सर्वरोगनिवारणम् ॥ ॥ सन्निज्वरनिवारणं सर्वज्वरनिवारणम् । सर्वरोगनिवारणं सर्वमङ्गलवर्धनम् ॥ ॥ शतमावर्तयेद्यस्तु
    मुच्यते व्याधिबन्धनात् । आवर्तयन्सहस्रात्तु लभते वाञ्छितं फलम् ॥ ॥ एतत् स्तोत्रं महापुण्यं जपेदायुष्यवर्धनम्
    । विनाशाय च रोगाणामपमृत्युहराय च ॥ ॥ द्विजैर्नित्यमिदं जप्यं भाग्यारोग्याभीप्सुभिः । नाभिमात्रजलेस्थित्वा
    सहस्रपरिसङ्ख्यया ॥ ॥ जपेत्स्तोत्रमिमं मन्त्रं वाचां सिद्धिर्भवेत्ततः । अनेनविधिना भक्त्या मन्त्रसिद्धिश्च
    जायते ॥ ॥ सन्तुष्टा च भवेद्देवी प्रत्यक्षा सम्प्रजायते । सायं शतं पठेन्नित्यं षण्मासात्सिद्धिरुच्यते
    ॥ ॥ चोरव्याधिभयस्थाने मनसाह्यनुचिन्तयन् । संवत्सरमुपाश्रित्य सर्वकामार्थसिद्धये ॥ ॥ राजानं वश्यमाप्नोति
    षण्मासान्नात्र संशयः । अष्टदोर्भिस्समायुक्ते नानायुद्धविशारदे ॥ ॥ भूतप्रेतपिशाचेभ्यो रोगारातिमुखैरपि
    । नागेभ्यः विषयन्त्रेभ्यः आभिचारैर्महेश्वरी ॥ ॥ रक्ष मां रक्ष मां नित्यं प्रत्यहं पूजिता मया । सर्वमङ्गलमाङ्गल्ये
    शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके देवी नारायणी नमोऽस्तु ते ॥ ॥ वरं प्रदाद्महेन्द्राय देवराज्यं
    च शाश्वतम् । इन्द्रस्तोत्रमिदं पुण्यं महदैश्वर्यकारणम् ॥ ॥ इति इन्द्राक्षी स्तोत्रम् ।
