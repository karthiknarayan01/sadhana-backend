id: brahmaproktamyogamayastotram
category: stotram
name:
  english: brahmaproktamyogamayastotram
  devanagari: ब्रह्मप्रोक्तंयोगमायास्तोत्रम्
content:
  english: 10|| ya shrih sada keshavamurtimala vishvambhara ya sakalam bibharti | ya tvam pura srishtikari
    maheshi hartri trilokasya para gunebhyah || 11|| ya yoginam vai mahita manojna sa tvam na te paramanusare
    | yamadipute hridi yoginam ya ya yoginam dhyanapathe pratita || 12|| prakashashuddhyadiyuta viraga
    sa tvam hi vidya vividhavalamba | kutasthamavyaktamanantarupam tvam bibhrati kalamayi jaganti || 13||
    vikarabijam prakaroshi nityam gunanvita sarvajaneshu nunam | tvam vai gunanam ca shive trayanam nidanabhuta
    ca tatah parasi || 14|| sattvam rajastamasa ityamisham vikarahina samuvastitirya | sa tvam gunanam
    jagadekahetum brahmantara rambhasi catsi pasi || 15|| asheshajagatam bije jneyajnanasvarupini | jagaddhitaya
    satatam shivapatni namo'stu te || 16|| iti shivapurane rudrasamhitayam satikhande ekadashadhyayantargatam
    brahmaproktam yogamayastotram samaptam | shivapurana | rudrasamhita | satikhanda | adhyaya 11
  devanagari: १०॥ या श्रीः सदा केशवमूर्तिमाला विश्वम्भरा या सकलं बिभर्ति । या त्वं पुरा सृष्टिकरी महेशी
    हर्त्री त्रिलोकस्य परा गुणेभ्यः ॥ ११॥ या योगिनां वै महिता मनोज्ञा सा त्वं न ते परमाणुसारे । यमादिपूते
    हृदि योगिनां या या योगिनां ध्यानपथे प्रतीता ॥ १२॥ प्रकाशशुद्ध्यादियुता विरागा सा त्वं हि विद्या विविधावलम्बा
    । कूटस्थमव्यक्तमनन्तरूपं त्वं बिभ्रती कालमयी जगन्ति ॥ १३॥ विकारबीजं प्रकरोषि नित्यं गुणान्विता सर्वजनेषु
    नूनम् । त्वं वै गुणानां च शिवे त्रयाणां निदानभूता च ततः परासि ॥ १४॥ सत्त्वं रजस्तामस इत्यमीषां विकारहीना
    समुवस्तितीर्या । सा त्वं गुणानां जगदेकहेतुं ब्रह्मान्तरा रम्भसि चात्सि पासि ॥ १५॥ अशेषजगतां बीजे ज्ञेयज्ञानस्वरूपिणि
    । जगद्धिताय सततं शिवपत्नि नमोऽस्तु ते ॥ १६॥ इति शिवपुराणे रुद्रसंहितायां सतीखण्डे एकादशाध्यायान्तर्गतं
    ब्रह्मप्रोक्तं योगमायास्तोत्रं समाप्तम् । शिवपुराण । रुद्रसंहिता । सतीखण्ड । अध्याय ११
meaning: {}
