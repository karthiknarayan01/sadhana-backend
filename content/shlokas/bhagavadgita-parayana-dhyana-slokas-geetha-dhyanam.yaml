id: bhagavadgita-parayana-dhyana-slokas-geetha-dhyanam
category: stotram
name:
  english: Bhagavadgita Parayana - Dhyana Slokas (Geetha Dhyanam)
content:
  english: om shri paramatmane namah atha gita dhyana shlokah om parthaya pratibodhitam bhagavata narayanena
    svayam vyasena grathitam puranamunina madhye mahabharatam | advaitamritavarshinim bhagavatim ashtadashadhyayinim
    amba tvam anusandadhami bhagavadgite bhavadveshinim || namo'stute vyasa vishalabuddhe phullaravindayatapatranetra
    | yena tvaya bharata tailapurnah prajvalito jnanamayah pradipah|| prapannaparijataya totravetraikapanaye
    | jnanamudraya krishnaya gitamritaduhe namah || vasudevasutam devam kamsacanuramardanam | devakiparamanandam
    krishnam vande jagadgurum || bhishmadronatata jayadrathajala gandharanilotpala shalyagrahavati kripena
    vahani karnena velakula | ashvatthamavikarnaghoramakara duryodhanavartini sottirna khalu pandavai
    rananadi kaivartakah keshavah || parasharyavacah sarojamamalam gitarthagandhotkatam nanakhyanakakesaram
    harikatha sambodhanabodhitam | loke sajjanashatpadairaharahah pepiyamanam muda bhuyadbharatapankajam
    kalimalam pradhvamsinah shreyase || mukam karoti vacalam pangum langhayate girim | yatkripa tamaham
    vande paramanandamadhavam || shantakaram bhujagashayanam padmanabham suresham vishvadharam gaganasadrisham
    meghavarnam shubhangam | lakshmikantam kamalanayanam yogihriddhyanagamyam vande vishnum bhavabhayaharam
    sarva lokaikanatham || yam brahmavarunendrarudramarutah stunvanti divyaih stavaih vedaih sangapadakramopanishadaih
    gayanti yam samagah | dhyanavasthita tadgatena manasa pashyanti yam yoginah yasyantam na vidussurasuraganah
    devaya tasmai namah || narayanam namaskritya narancaiva narottamam | devim sarasvatim vyasam tato
    jayamudirayet || saccidanandarupaya krishnayaklishtakarine | namo vedantavedyaya gurave buddhisakshine||
    sarvopanishado gavah dogdha gopalanandanah | partho vatsah sudhirbhokta dugdham gitamritam mahat ||
    gitashastramidam punyam yah pathet prayatah puman | vishnoh padamavapnoti bhayashokadi varjitah ||
    ekam shastram devakiputragitam eko devo devakiputra eva | eko mantrastasya namani yani karmapyekam
    tasya devasya seva || || om shri krishnaya paramatmane namah ||
  devanagari: ॐ श्री परमात्मने नमः अथ गीता ध्यान श्लोकाः ॐ पार्थाय प्रतिबोधितां भगवता नारायणेन स्वयं व्यासेन
    ग्रथितां पुराणमुनिना मध्ये महाभारतम् । अद्वैतामृतवर्षिणीं भगवतीं अष्टादशाध्यायिनीं अम्ब त्वां अनुसन्दधामि
    भगवद्गीते भवद्वेषिणीम् ॥ नमोऽस्तुते व्यास विशालबुद्धे फुल्लारविन्दायतपत्रनेत्र । येन त्वया भारत तैलपूर्णः
    प्रज्वालितो ज्ञानमयः प्रदीपः॥ प्रपन्नपारिजाताय तोत्रवेत्रैकपाणये । ज्ञानमुद्राय कृष्णाय गीतामृतदुहे
    नमः ॥ वसुदेवसुतं देवं कंसचाणूरमर्दनम् । देवकीपरमानन्दं कृष्णं वन्दे जगद्गुरुम् ॥ भीष्मद्रोणतटा जयद्रथजला
    गान्धारनीलोत्पला शल्यग्राहवती कृपेण वहनी कर्णेन वेलाकुला । अश्वत्थामविकर्णघोरमकरा दुर्योधनावर्तिनी
    सोत्तीर्णा खलु पाण्डवै रणनदी कैवर्तकः केशवः ॥ पाराशर्यवचः सरोजममलं गीतार्थगन्धोत्कटं नानाख्यानककेसरं
    हरिकथा सम्बोधनाबोधितम् । लोके सज्जनषट्पदैरहरहः पेपीयमानं मुदा भूयाद्भारतपङ्कजं कलिमलं प्रध्वंसिनः
    श्रेयसे ॥ मूकं करोति वाचालं पङ्गुं लङ्घयते गिरिम् । यत्कृपा तमहं वन्दे परमानन्दमाधवम् ॥ शान्ताकारं
    भुजगशयनं पद्मनाभं सुरेशं विश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिहृद्ध्यानगम्यं
    वन्दे विष्णुं भवभयहरं सर्व लोकैकनाथम् ॥ यं ब्रह्मावरुणेन्द्ररुद्रमरुतः स्तुन्वन्ति दिव्यैः स्तवैः
    वेदैः साङ्गपदक्रमोपनिषदैः गायन्ति यं सामगाः । ध्यानावस्थित तद्गतेन मनसा पश्यन्ति यं योगिनः यस्यान्तं
    न विदुस्सुरासुरगणाः देवाय तस्मै नमः ॥ नारायणं नमस्कृत्य नरञ्चैव नरोत्तमम् । देवीं सरस्वतीं व्यासं
    ततो जयमुदीरयेत् ॥ सच्चिदानन्दरूपाय कृष्णायाक्लिष्टकारिणे । नमो वेदान्तवेद्याय गुरवे बुद्धिसाक्षिणे॥
    सर्वोपनिषदो गावः दोग्धा गोपालनन्दनः । पार्थो वत्सः सुधीर्भोक्ता दुग्धं गीतामृतं महत् ॥ गीताशास्त्रमिदं
    पुण्यं यः पठेत् प्रयतः पुमान् । विष्णोः पदमवाप्नोति भयशोकादि वर्जितः ॥ एकं शास्त्रं देवकीपुत्रगीतं
    एको देवो देवकीपुत्र एव । एको मन्त्रस्तस्य नामानि यानि कर्माप्येकं तस्य देवस्य सेवा ॥ ॥ ॐ श्री कृष्णाय
    परमात्मने नमः ॥
