id: balakavacam-1
category: kavacha
name:
  english: balakavacam 1
  devanagari: बालाकवचम् १
content:
  english: shribalakavacam 1 vagbhavah patu shirasi kamarajah sada hridi | shaktibijam sada patu nabhau
    guhye ca padayoh || 1|| aim klim sauh vadane patu bala sarvarthasiddhaye | jihvam patu mahahamsi skandhadeshe
    tu bhairavi || 2|| sundari nabhidesham tu shirasi kamala sada | bhruvau nasadvayam patu mahatripurasundari
    || 3|| lalate subhaga patu kanthadeshe tu malini | vagbhavam patu hridaye udare bhagasarpini || 4||
    bhagamalini nabhideshe linge patu manobhava | guhye patu mahadevi rajarajeshvari shiva || 5|| caitanyarupini
    patu padayorjagadambika | narayani sarvagatre sarvakale shivankari || 6|| brahmani patu mam purve
    dakshine patu vaishnavi | pashcime patu varahi uttare tu maheshvari || 7|| agneyyam patu kaumari mahalakshmistu
    nairrite | vayavyam patu camunda indrani patu ishake || 8|| akashe ca mahamaya prithivyam sarvamangala
    | atmanam patu varada sarvange bhuvaneshvari || 9|| iti siddhayamalantargatam shribalakavacam sampurnam
    |
  devanagari: श्रीबालाकवचम् १ वाग्भवः पातु शिरसि कामराजः सदा हृदि । शक्तिबीजं सदा पातु नाभौ गुह्ये च पादयोः
    ॥ १॥ ऐं क्लीं सौः वदने पातु बाला सर्वार्थसिद्धये । जिह्वां पातु महाहंसी स्कन्धदेशे तु भैरवी ॥ २॥ सुन्दरी
    नाभिदेशं तु शिरसि कमला सदा । भ्रुवौ नासाद्वयं पातु महात्रिपुरसुन्दरी ॥ ३॥ ललाटे सुभगा पातु कण्ठदेशे
    तु मालिनी । वाग्भवं पातु हृदये उदरे भगसर्पिणी ॥ ४॥ भगमालिनी नाभिदेशे लिङ्गे पातु मनोभवा । गुह्ये पातु
    महादेवी राजराजेश्वरी शिवा ॥ ५॥ चैतन्यरूपिणी पातु पादयोर्जगदम्बिका । नारायणी सर्वगात्रे सर्वकाले शिवङ्करी
    ॥ ६॥ ब्रह्माणी पातु मां पूर्वे दक्षिणे पातु वैष्णवी । पश्चिमे पातु वाराही उत्तरे तु महेश्वरी ॥ ७॥
    आग्नेय्यां पातु कौमारी महालक्ष्मीस्तु नैरृते । वायव्यां पातु चामुण्डा इन्द्राणी पातु ईशके ॥ ८॥ आकाशे
    च महामाया पृथिव्यां सर्वमङ्गला । आत्मानं पातु वरदा सर्वाङ्गे भुवनेश्वरी ॥ ९॥ इति सिद्धयामलान्तर्गतं
    श्रीबालाकवचं सम्पूर्णम् ।
