id: anjaneya-dvadasha-nama-stotram
category: stotram
name:
  english: Anjaneya Dvadasha Nama Stotram
  devanagari: आञ्जनेयद्वादशनामस्तोत्रम्
content:
  english: hanumanamjanasunuh vayuputro mahabalah | rameshtah phalgunasakhah pingaksho'mitavikramah ||
    1|| udadhikramanashcaiva sitashokavinashakah | lakshmanapranadata ca dashagrivasya darpaha || 2||
    dvadashaitani namani kapindrasya mahatmanah | svapakale pathennityam yatrakale visheshatah | tasya
    mrityubhayam nasti sarvatra vijayi bhavet || iti shrianjaneyadvadashanamastotram sampurnam |
  devanagari: हनुमानंजनासूनुः वायुपुत्रो महाबलः । रामेष्टः फल्गुनसखः पिङ्गाक्षोऽमितविक्रमः ॥ १॥ उदधिक्रमणश्चैव
    सीताशोकविनाशकः । लक्ष्मणप्राणदाता च दशग्रीवस्य दर्पहा ॥ २॥ द्वादशैतानि नामानि कपीन्द्रस्य महात्मनः
    । स्वापकाले पठेन्नित्यं यात्राकाले विशेषतः । तस्य मृत्युभयं नास्ति सर्वत्र विजयी भवेत् ॥ इति श्रीआञ्जनेयद्वादशनामस्तोत्रं
    सम्पूर्णम् ।
meaning: {}
