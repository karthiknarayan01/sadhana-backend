id: gorakshasahasranamahavanashabaramantrah-3
category: sahasranama
name:
  english: gorakshasahasranamahavanashabaramantrah
  devanagari: गोरक्षसहस्रनामहवनशाबरमन्त्राः
content:
  english: premi namo svaha | om akarshana karane ayogya namo svaha | om saralayogi namo svaha | om kshama
