id: suryaryastotram
category: stotram
name:
  english: suryaryastotram
  devanagari: सूर्यार्यास्तोत्रम्
content:
  english: savitushcandaruceh pundarikavanabandhoh | mandalamuditam vande kundalamakhandalashayah || 1||
    yasyodayastasamaye suramukutanighrishtacaranakamalo'pi | kurutenjalim trinetrah sa jayati dhamnam
    nidhih suryah || 2|| udayacalatilakaya pranato'smi vivasvate graheshaya | ambaracudamanaye digvanitakarnapuraya
    || 3|| jayati jananandakarah karanikaranirastatimirasanghatah | lokalokalokah kamalarunamandalah suryah
    || 4|| pratibodhitakamalavanah kritaghatanashcakravakamithunanam | darshitasamastabhuvanah parahitanirato
    ravih sada jayati || 5|| apanayatu sakalakalikritamalapatalam saprataptakanakabhah | aravindavrindavighatanapatutarakiranotkarah
    savita || 6|| udayadricarucamara haritahayakhuraparihitarenuraga | haritahaya haritaparikara gagananganadipaka
    namaste'stu || 7|| uditavati tvayi vikasati mukuliyati samastamastamitabimbe | na hyanyasmindinakara
    sakalam kamalayate bhuvanam || 8|| jayati ravirudayasamaye balatapah kanakasannibho yasya | kusumanjaliriva
    jaladhau taranti rathasaptayah sapta || 9|| aryah sambapure sapta akashatpatita bhuvi | yasya kanthe
    grihe vapi na sa lakshmya viyujyate || 10|| aryah sapta sada yastu saptamyam saptadha japet | tasya
    geham ca dipam ca padma satyam na muncati || 11|| nidhiresha daridranam roginam paramaushadham | siddhih
    sakalakaryanam gatheyam samsrita raveh || 12|| iti shriyajnavalkyaviracitam suryaryastotram sampurnam
    |
  devanagari: सवितुश्चण्डरुचेः पुण्डरीकवनबन्धोः । मण्डलमुदितं वन्दे कुण्डलमाखण्डलाशायाः ॥ १॥ यस्योदयास्तसमये
    सुरमुकुटनिघृष्टचरणकमलोऽपि । कुरुतेञ्जलिं त्रिनेत्रः स जयति धाम्नां निधिः सूर्यः ॥ २॥ उदयाचलतिलकाय
    प्रणतोऽस्मि विवस्वते ग्रहेशाय । अम्बरचूडामणये दिग्वनिताकर्णपूराय ॥ ३॥ जयति जनानन्दकरः करनिकरनिरस्ततिमिरसङ्घातः
    । लोकालोकालोकः कमलारुणमण्डलः सूर्यः ॥ ४॥ प्रतिबोधितकमलवनः कृतघटनश्चक्रवाकमिथुनानाम् । दर्शितसमस्तभुवनः
    परहितनिरतो रविः सदा जयति ॥ ५॥ अपनयतु सकलकलिकृतमलपटलं सप्रतप्तकनकाभः । अरविन्दवृन्दविघटनपटुतरकिरणोत्करः
    सविता ॥ ६॥ उदयाद्रिचारुचामर हरितहयखुरपरिहितरेणुराग । हरितहय हरितपरिकर गगनाङ्गनदीपक नमस्तेऽस्तु ॥ ७॥
    उदितवति त्वयि विकसति मुकुलीयति समस्तमस्तमितबिम्बे । न ह्यन्यस्मिन्दिनकर सकलं कमलायते भुवनम् ॥ ८॥ जयति
    रविरुदयसमये बालातपः कनकसन्निभो यस्य । कुसुमाञ्जलिरिव जलधौ तरन्ति रथसप्तयः सप्त ॥ ९॥ आर्याः साम्बपुरे
    सप्त आकाशात्पतिता भुवि । यस्य कण्ठे गृहे वापि न स लक्ष्म्या वियुज्यते ॥ १०॥ आर्याः सप्त सदा यस्तु
    सप्तम्यां सप्तधा जपेत् । तस्य गेहं च दीपं च पद्मा सत्यं न मुञ्चति ॥ ११॥ निधिरेश दरिद्राणां रोगिणां
    परमौषधम् । सिद्धिः सकलकार्याणां गाथेयं संसृता रवेः ॥ १२॥ इति श्रीयाज्ञवल्क्यविरचितं सूर्यार्यास्तोत्रं
    सम्पूर्णम् ।
