id: bhadramatikritamvishnustotram
category: stotram
name:
  english: bhadramatikritamvishnustotram
  devanagari: भद्रमतिकृतंविष्णुस्तोत्रम्
content:
  english: bhadramatikritam vishnustotram namo namaste'khilakaranaya namo namaste'khilapalakaya | namo
    namaste'maranayakaya namo namo daityavimardanaya || 75|| namo namo bhaktajanapriyaya namo namah papavidaranaya
    | namo namo durjananashakaya namo'stu tasmai jagadishvaraya || 76|| namo namah karanavamanaya narayanayamitavikramaya
    | shrisharngacakrasigadadharaya namo'stu tasmai purushottamaya || 77|| namah payorashinivasakaya namo'stu
    lakshmipataye'vyayaya | namo'stu suryadyamitaprabhaya namo namah punyagatagataya || 78|| namo namo'rkenduvilocanaya
    namo'stu te yajnaphalapradaya | namo'stu yajnangavirajitaya namo'stu te sajjanavallabhaya || 79||
    namo namah karanakaranaya namo'stu shabdadivivarjitaya | namo'stu te'bhishtasukhapradaya namo namo
    bhaktamanoramaya || 1
  devanagari: भद्रमतिकृतं विष्णुस्तोत्रम् नमो नमस्तेऽखिलकारणाय नमो नमस्तेऽखिलपालकाय । नमो नमस्तेऽमरनायकाय
    नमो नमो दैत्यविमर्दनाय ॥ ७५॥ नमो नमो भक्तजनप्रियाय नमो नमः पापविदारणाय । नमो नमो दुर्जननाशकाय नमोऽस्तु
    तस्मै जगदीश्वराय ॥ ७६॥ नमो नमः कारणवामनाय नारायणायामितविक्रमाय । श्रीशार्ङ्गचक्रासिगदाधराय नमोऽस्तु
    तस्मै पुरुषोत्तमाय ॥ ७७॥ नमः पयोराशिनिवासकाय नमोऽस्तु लक्ष्मीपतयेऽव्ययाय । नमोऽस्तु सूर्याद्यमितप्रभाय
    नमो नमः पुण्यगतागताय ॥ ७८॥ नमो नमोऽर्केन्दुविलोचनाय नमोऽस्तु ते यज्ञफलप्रदाय । नमोऽस्तु यज्ञाङ्गविराजिताय
    नमोऽस्तु ते सज्जनवल्लभाय ॥ ७९॥ नमो नमः कारणकारणाय नमोऽस्तु शब्दादिविवर्जिताय । नमोऽस्तु तेऽभीष्टसुखप्रदाय
    नमो नमो भक्तमनोरमाय ॥ १
meaning: {}
