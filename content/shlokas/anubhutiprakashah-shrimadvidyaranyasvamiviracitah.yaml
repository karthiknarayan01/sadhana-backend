id: anubhutiprakashah-shrimadvidyaranyasvamiviracitah
category: upanishad
name:
  english: anubhutiprakashah (shrimadvidyaranyasvamiviracitah)
  devanagari: अनुभूतिप्रकाशः (श्रीमद्विद्यारण्यस्वामिविरचितः)
content:
  english: brihadaranyopanishadi maitreyividyaprakasho nama pancadasho'dhyayah | maitreyyai yajnavalkyo
    yam caturthabrahmane'bravit | sasadhanam brahmavidyam vispashtam vyakaroti tam || 15
  devanagari: बृहदारण्योपनिषदि मैत्रेयीविद्याप्रकाशो नाम पञ्चदशोऽध्यायः । मैत्रेय्यै याज्ञवल्क्यो यां
    चतुर्थब्राह्मणेऽब्रवीत् । ससाधनां ब्रह्मविद्यां विस्पष्टं व्याकरोति ताम् ॥ १५
meaning: {}
