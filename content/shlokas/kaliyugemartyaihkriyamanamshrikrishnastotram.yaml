id: kaliyugemartyaihkriyamanamshrikrishnastotram
category: stotram
name:
  english: kaliyugemartyaihkriyamanamshrikrishnastotram
  devanagari: कलियुगेमर्त्यैःक्रियमाणंश्रीकृष्णस्तोत्रम्
content:
  english: kaliyuge martyaih kriyamanam shrikrishnastotram krishnavarnam tvishakrishnam sangopangastraparshadam
    | yajnaih sankirtanaprayairyajanti hi sumedhasah || 32|| dhyeyam sada paribhavaghnamabhishtadoham
    tirthaspadam shivavirincinutam sharanyam | bhrityartiham pranatapala bhavabdhipotam vande mahapurusha
    te caranaravindam || 33|| tyaktva sudustyajasurepsitarajyalakshmim dharmishtha aryavacasa yadagadaranyam
    | mayamrigam dayitayepsitamanvadhava
  devanagari: कलियुगे मर्त्यैः क्रियमाणं श्रीकृष्णस्तोत्रम् कृष्णवर्णं त्विषाकृष्णं साङ्गोपाङ्गास्त्रपार्षदम्
    । यज्ञैः सङ्कीर्तनप्रायैर्यजन्ति हि सुमेधसः ॥ ३२॥ ध्येयं सदा परिभवघ्नमभीष्टदोहं तीर्थास्पदं शिवविरिञ्चिनुतं
    शरण्यम् । भृत्यार्तिहं प्रणतपाल भवाब्धिपोतं वन्दे महापुरुष ते चरणारविन्दम् ॥ ३३॥ त्यक्त्वा सुदुस्त्यजसुरेप्सितराज्यलक्ष्मीं
    धर्मिष्ठ आर्यवचसा यदगादरण्यम् । मायामृगं दयितयेप्सितमन्वधाव
meaning: {}
