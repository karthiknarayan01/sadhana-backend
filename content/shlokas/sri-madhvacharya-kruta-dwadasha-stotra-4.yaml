id: sri-madhvacharya-kruta-dwadasha-stotra-4
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 4
content:
  english: atha caturthastotram nijapurnasukhamitabodhatanuh parashaktiranantagunah paramah | ajaramaranah
    sakalartiharah kamalapatiridyatamo'vatu nah || || yadasuptigato'pi harih sukhavan sukharupinamahurato
    nigamah | svamatiprabhavam jagadasya yatah parabodhatanum ca tatah khapatim || bahucitrajagat bahudhakaranatparashaktiranantagunah
    paramah | sukharupamamushyapadam paramam smaratastu bhavishyati tatsatatam || || smarane hi pareshiturasya
    vibhormalinani manamsi kutah karanam | vimalam hi padam paramam svaratam tarunarkasavarnamajasya hareh
    || || vimalaih shrutishananishatatamaih sumano'sibhirashu nihatya dridham | balinam nijavairinamatmatamobhidamishamanantamupasva
    harim || || na hi vishvasrijo vibhushambhupurandara suryamukhanaparanaparan | srijatidyatamo'vati
    hanti nijam padamapayati pranatam svadhiya || || paramo'pi rameshiturasya samo na hi kashcidabhunna
    bhavishyati ca | kvacidadyatano'pi na purnasadaganitedyagunanubhavaikatanoh || || iti devavarasya
    hareh stavanam kritavan muniruttamamadaratah | sukhatirthapadabhihitah pathatastadidam bhavati dhruvamuccasukham
    || || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu caturthastotram sampurnam
  devanagari: अथ चतुर्थस्तोत्रम् निजपूर्णसुखामितबोधतनुः परशक्तिरनन्तगुणः परमः । अजरामरणः सकलार्तिहरः कमलापतिरीड्यतमोऽवतु
    नः ॥ ॥ यदसुप्तिगतोऽपि हरिः सुखवान् सुखरूपिणमाहुरतो निगमाः । स्वमतिप्रभवं जगदस्य यतः परबोधतनुं च ततः
    खपतिम् ॥ बहुचित्रजगत् बहुधाकरणात्परशक्तिरनन्तगुणः परमः । सुखरूपममुष्यपदं परमं स्मरतस्तु भविष्यति तत्सततम्
    ॥ ॥ स्मरणे हि परेशितुरस्य विभोर्मलिनानि मनांसि कुतः करणम् । विमलं हि पदं परमं स्वरतं तरुणार्कसवर्णमजस्य
    हरेः ॥ ॥ विमलैः श्रुतिशाणनिशाततमैः सुमनोऽसिभिराशु निहत्य दृढम् । बलिनं निजवैरिणमात्मतमोभिदमीशमनन्तमुपास्व
    हरिम् ॥ ॥ न हि विश्वसृजो विभुशम्भुपुरन्दर सूर्यमुखानपरानपरान् । सृजतीड्यतमोऽवति हन्ति निजं पदमापयति
    प्रणतां स्वधिया ॥ ॥ परमोऽपि रमेशितुरस्य समो न हि कश्चिदभून्न भविष्यति च । क्वचिदद्यतनोऽपि न पूर्णसदागणितेड्यगुणानुभवैकतनोः
    ॥ ॥ इति देववरस्य हरेः स्तवनं कृतवान् मुनिरुत्तममादरतः । सुखतीर्थपदाभिहितः पठतस्तदिदं भवति ध्रुवमुच्चसुखम्
    ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु चतुर्थस्तोत्रं सम्पूर्णम्
