id: gangashtakam-kalidasakritam
category: stotram
name:
  english: gangashtakam (kalidasakritam)
  devanagari: गङ्गाष्टकम् (कालिदासकृतम्)
content:
  english: matarjahnunarendranandini tava svalpodabindum vina || 7|| shleshamashleshanayanale'mritabile
    shakakule vyakule kanthe ghargharaghoshanadamaline kaye ca sammilati | yam dhyayannpi bharabhangurataram
    prapnoti muktim narah snatushvetasi jahnvi nivasatam samsarasantapahrit || 8|| iti shrimatkalidasaviracitam
    gangashtakastotram sampurnam || namaste'stu gange tvadangaprasangadbhujam gasturangah kurangah plavangah
    | anangarirangah sasangah shivanga bhujangadhipangikritanga bhavanti || 1|| namo jahnukanye na manye
    tvadanyairnisargenducihnadibhirlokabhartuh | ato'ham nato'ham sato gauratoye vasishthadibhirgiyamanabhidheye
    || 2|| tvadamajjanatsajjano durjano va vimanaih samanah samanairhi manaih | samayati tasminpuraratiloke
    puradvarasamruddhadikpalaloke || 3|| svaravasadambholidambhopi rambhaparirambhasambhavanadhiracetah
    | samakankshate tvattate vrikshavatikutire vasannetumayurdinani || 4|| trilokasya bharturjatajutabandhatsvasimantabhage
    manakpraskhalantah | bhavanya rusha prodhasapantabhavatkarenahatastavattaranga jayanti || 5|| jalonmajjadairavatoddanakumbhasphuratpraskhalatsandrasindurarage
    | kkacitpadminirenubhange prasange manah khelatam jahnukanyatarange || 6|| bhavattiravaniravatotthadhulilavasparshatastatkshanam
    kshinapapah | jano'yam jagatpavane tvatprasadatpade pauruhute'pi dhatte'vahelam || 7|| trisandhyanamallekhakotirananavidhanekaratnamshubimbaprabhabhih
    | sphuratpadapithe hathenashtamurterjataajutavase natah smah padam te || 8|| idam yah pathedashtakam
    jahnuputryasrikalam kritam kalidasena ramyam | samayasyatindradibhirgiyamanam padam kaishavam shaishavam
    no labhetsah || 9|| iti shrikalidasakritam gangashtakastotram sampurnam ||
  devanagari: मातर्जह्नुनरेन्द्रनन्दिनि तव स्वल्पोदबिन्दुं विना ॥ ७॥ श्लेषमश्लेषणयानलेऽमृतबिले शाकाकुले
    व्याकुले कण्ठे घर्घरघोषनादमलिने काये च सम्मीलति । यां ध्यायन्न्पि भारभङ्गुरतरां प्राप्नोति मुक्तिं
    नरः स्नातुश्वेतसि जाह्न्वी निवसतां संसारसन्तापहृत् ॥ ८॥ इति श्रीमत्कालिदासविरचितं गङ्गाष्टकस्तोत्रं
    सम्पूर्णम् ॥ नमस्तेऽस्तु गङ्गे त्वदङ्गप्रसङ्गाद्भुजं गास्तुरङ्गाः कुरङ्गाः प्लवङ्गाः । अनङ्गारिरङ्गाः
    ससङ्गाः शिवाङ्गा भुजङ्गाधिपाङ्गीकृताङ्गा भवन्ति ॥ १॥ नमो जह्नुकन्ये न मन्ये त्वदन्यैर्निसर्गेन्दुचिह्नादिभिर्लोकभर्तुः
    । अतोऽहं नतोऽहं सतो गौरतोये वसिष्ठादिभिर्गीयमानाभिधेये ॥ २॥ त्वदामज्जनात्सज्जनो दुर्जनो वा विमानैः
    समानः समानैर्हि मानैः । समायाति तस्मिन्पुरारातिलोके पुरद्वारसंरुद्धदिक्पाललोके ॥ ३॥ स्वरावासदम्भोलिदम्भोपि
    रम्भापरीरम्भसम्भावनाधीरचेताः । समाकाङ्क्षते त्वत्तटे वृक्षवाटीकुटीरे वसन्नेतुमायुर्दिनानि ॥ ४॥ त्रिलोकस्य
    भर्तुर्जटाजूटबन्धात्स्वसीमान्तभागे मनाक्प्रस्खलन्तः । भवान्या रुषा प्रोढसापन्तभावात्करेणाहतास्तवत्तरङ्गा
    जयन्ति ॥ ५॥ जलोन्मज्जदैरावतोद्दानकुम्भस्फुरत्प्रस्खलत्सान्द्रसिन्दूररागे । क्कचित्पद्मिनीरेणुभङ्गे
    प्रसङ्गे मनः खेलतां जह्नुकन्यातरङ्गे ॥ ६॥ भवत्तीरवानीरवातोत्थधूलीलवस्पर्शतस्तत्क्षणं क्षीणपापः । जनोऽयं
    जगत्पावने त्वत्प्रसादात्पदे पौरुहूतेऽपि धत्तेऽवहेलाम् ॥ ७॥ त्रिसन्ध्यानमल्लेखकोटीरनानाविधानेकरत्नांशुबिम्बप्रभाभिः
    । स्फुरत्पादपीठे हठेनाष्टमूर्तेर्जटाअजूटवासे नताः स्मः पदं ते ॥ ८॥ इदं यः पठेदष्टकं जह्नुपुत्र्यास्रिकालं
    कृतं कालिदासेन रम्यम् । समायास्यतीन्द्रादिभिर्गीयमानं पदं कैशवं शैशवं नो लभेत्सः ॥ ९॥ इति श्रीकालिदासकृतं
    गङ्गाष्टकस्तोत्रं सम्पूर्णम् ॥
