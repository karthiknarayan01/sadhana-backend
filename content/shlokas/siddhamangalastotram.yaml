name:
  english: siddhamangalastotram
  devanagari: सिद्धमङ्गलस्तोत्रम्
content:
  english: shrimadananta shrivibhushita appala lakshmi narasimharaja jaya vijayibhava digvijayibhava shrimadakhanda
    shrivijayibhava
  devanagari: श्रीमदनन्त श्रीविभूषित अप्पल लक्ष्मी नरसिम्हराजा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव
meaning: {}
