id: aditya-hrudayam
category: stotram
name:
  english: Aditya Hrudayam
content:
  english: dhyanam namassavitre jagadeka cakshuse jagatprasuti sthiti nashahetave trayimayaya trigunatma
    dharine virinci narayana shankaratmane tato yuddha parishrantam samare cintayasthitam | ravanam cagrato
    drishtva yuddhaya samupasthitam || || daivataishca samagamya drashtumabhyagato ranam | upagamyabravidramam
    agastyo bhagavan rishih || || rama rama mahabaho shrinu guhyam sanatanam | yena sarvanarin vatsa samare
    vijayishyasi || || adityahridayam punyam sarvashatru vinashanam | jayavaham japennityam akshayyam
    paramam shivam || pranashanam | cintashoka prashamanam ayurvardhanamuttamam || || rashmimantam samudyantam
    devasura namaskritam | pujayasva vivasvantam bhaskaram bhuvaneshvaram || || sarvadevatmako hyesha
    tejasvi rashmibhavanah | esha devasura ganan lokan pati gabhastibhih || || esha brahma ca vishnushca
    shivah skandah prajapatih | mahendro dhanadah kalo yamah somo hyapam patih || || pitaro vasavah sadhya
    hyashvinau maruto manuh | vayurvahnih prajapranah ritukarta prabhakarah || || adityah savita suryah
    khagah pusha gabhastiman | suvarnasadrisho bhanuh hiranyareta divakarah || haridashvah sahasrarcih
    saptasapti rmariciman | timironmathanah shambhuh tvashta martandakom'shuman || || hiranyagarbhah shishirah
    tapano bhaskaro ravih | agnigarbho'diteh putrah shankhah shishiranashanah || stamobhedi rigyajuhsama
    paragah | ghanavrishtirapam mitrah vindhyavithi plavangamah || || atapi mandali mrityuh pingalah sarvatapanah
    | kavirvishvo mahateja raktah sarvabhavodbhavah || || nakshatra graha taranam adhipo vishvabhavanah
    | tejasamapi tejasvi dvadashatma || namah purvaya giraye pashcimayadraye namah | jyotirgananam pataye
    dinadhipataye namah || || jayaya jayabhadraya haryashvaya namo namah | namo namah sahasramsho adityaya
    namo namah || || nama ugraya viraya sarangaya namo namah | namah padmaprabodhaya martandaya namo namah
    || || brahmeshanacyuteshaya suryayaditya varcase | bhasvate sarvabhakshaya raudraya vapushe namah
    || || tamoghnaya himaghnaya shatrughna yamitatmane | kritaghnaghnaya devaya jyotisham pataye namah
    || || tapta camikarabhaya vahnaye vishvakarmane | nama stamo'bhinighnaya ravaye lokasakshine || ||
    nashayatyesha vai bhutam tadeva srijati prabhuh | payatyesha tapatyesha varshatyesha gabhastibhih
    || || esha supteshu jagarti bhuteshu parinishthitah | esha evagnihotram ca phalam caivagnihotrinam
    || || vedashca kratavashcaiva kratunam phalameva ca | yani krityani lokeshu sarva esha ravih prabhuh
    || mapatsu kricchreshu kantareshu bhayeshu ca | kirtayan purushah kashcinnavashidati raghava || mekagrah
    devadevam jagatpatim | etat trigunitam japtva yuddheshu vijayishyasi || || asmin kshane mahabaho ravanam
    tvam vadhishyasi | evamuktva tadagastyo jagama ca yathagatam || || etacchrutva mahatejah nashtashoko'bhavattada
    | dharayamasa supritah raghavah prayatatmavan || || adityam prekshya japtva tu param harshamavaptavan
    | triracamya shucirbhutva dhanuradaya viryavan || || ravanam prekshya hrishtatma yuddhaya samupagamat
    | sarvayatnena mahata vadhe tasya dhrito'bhavat || || atha raviravadannirikshya ramam muditamanah
    paramam prahrishyamanah | nishicarapati sankshayam viditva suragana madhyagato vacastvareti || ||
    ityarshe shrimadramayane valmikiye adikavye yuddhakande pancadhika shatatamah sargah ||
  devanagari: ध्यानम् नमस्सवित्रे जगदेक चक्षुसे जगत्प्रसूति स्थिति नाशहेतवे त्रयीमयाय त्रिगुणात्म धारिणे
    विरिञ्चि नारायण शङ्करात्मने ततो युद्ध परिश्रान्तं समरे चिन्तयास्थितम् । रावणं चाग्रतो दृष्ट्वा युद्धाय
    समुपस्थितम् ॥ ॥ दैवतैश्च समागम्य द्रष्टुमभ्यागतो रणम् । उपागम्याब्रवीद्रामं अगस्त्यो भगवान् ऋषिः ॥
    ॥ राम राम महाबाहो शृणु गुह्यं सनातनम् । येन सर्वानरीन् वत्स समरे विजयिष्यसि ॥ ॥ आदित्यहृदयं पुण्यं
    सर्वशत्रु विनाशनम् । जयावहं जपेन्नित्यं अक्षय्यं परमं शिवम् ॥ प्रणाशनम् । चिन्ताशोक प्रशमनं आयुर्वर्धनमुत्तमम्
    ॥ ॥ रश्मिमन्तं समुद्यन्तं देवासुर नमस्कृतम् । पूजयस्व विवस्वन्तं भास्करं भुवनेश्वरम् ॥ ॥ सर्वदेवात्मको
    ह्येष तेजस्वी रश्मिभावनः । एष देवासुर गणान् लोकान् पाति गभस्तिभिः ॥ ॥ एष ब्रह्मा च विष्णुश्च शिवः
    स्कन्दः प्रजापतिः । महेन्द्रो धनदः कालो यमः सोमो ह्यपां पतिः ॥ ॥ पितरो वसवः साध्या ह्यश्विनौ मरुतो
    मनुः । वायुर्वह्निः प्रजाप्राणः ऋतुकर्ता प्रभाकरः ॥ ॥ आदित्यः सविता सूर्यः खगः पूषा गभस्तिमान् । सुवर्णसदृशो
    भानुः हिरण्यरेता दिवाकरः ॥ हरिदश्वः सहस्रार्चिः सप्तसप्ति र्मरीचिमान् । तिमिरोन्मथनः शम्भुः त्वष्टा
    मार्ताण्डकोंऽशुमान् ॥ ॥ हिरण्यगर्भः शिशिरः तपनो भास्करो रविः । अग्निगर्भोऽदितेः पुत्रः शङ्खः शिशिरनाशनः
    ॥ स्तमोभेदी ऋग्यजुःसाम पारगः । घनावृष्टिरपां मित्रः विन्ध्यवीथी प्लवङ्गमः ॥ ॥ आतपी मण्डली मृत्युः
    पिङ्गलः सर्वतापनः । कविर्विश्वो महातेजा रक्तः सर्वभवोद्भवः ॥ ॥ नक्षत्र ग्रह ताराणां अधिपो विश्वभावनः
    । तेजसामपि तेजस्वी द्वादशात्म ॥ नमः पूर्वाय गिरये पश्चिमायाद्रये नमः । ज्योतिर्गणानां पतये दिनाधिपतये
    नमः ॥ ॥ जयाय जयभद्राय हर्यश्वाय नमो नमः । नमो नमः सहस्रांशो आदित्याय नमो नमः ॥ ॥ नम उग्राय वीराय सारङ्गाय
    नमो नमः । नमः पद्मप्रबोधाय मार्ताण्डाय नमो नमः ॥ ॥ ब्रह्मेशानाच्युतेशाय सूर्यायादित्य वर्चसे । भास्वते
    सर्वभक्षाय रौद्राय वपुषे नमः ॥ ॥ तमोघ्नाय हिमघ्नाय शत्रुघ्ना यामितात्मने । कृतघ्नघ्नाय देवाय ज्योतिषां
    पतये नमः ॥ ॥ तप्त चामीकराभाय वह्नये विश्वकर्मणे । नम स्तमोऽभिनिघ्नाय रवये लोकसाक्षिणे ॥ ॥ नाशयत्येष
    वै भूतं तदेव सृजति प्रभुः । पायत्येष तपत्येष वर्षत्येष गभस्तिभिः ॥ ॥ एष सुप्तेषु जागर्ति भूतेषु परिनिष्ठितः
    । एष एवाग्निहोत्रं च फलं चैवाग्निहोत्रिणाम् ॥ ॥ वेदाश्च क्रतवश्चैव क्रतूनां फलमेव च । यानि कृत्यानि
    लोकेषु सर्व एष रविः प्रभुः ॥ मापत्सु कृच्छ्रेषु कान्तारेषु भयेषु च । कीर्तयन् पुरुषः कश्चिन्नावशीदति
    राघव ॥ मेकाग्रः देवदेवं जगत्पतिम् । एतत् त्रिगुणितं जप्त्वा युद्धेषु विजयिष्यसि ॥ ॥ अस्मिन् क्षणे
    महाबाहो रावणं त्वं वधिष्यसि । एवमुक्त्वा तदागस्त्यो जगाम च यथागतम् ॥ ॥ एतच्छ्रुत्वा महातेजाः नष्टशोकोऽभवत्तदा
    । धारयामास सुप्रीतः राघवः प्रयतात्मवान् ॥ ॥ आदित्यं प्रेक्ष्य जप्त्वा तु परं हर्षमवाप्तवान् । त्रिराचम्य
    शुचिर्भूत्वा धनुरादाय वीर्यवान् ॥ ॥ रावणं प्रेक्ष्य हृष्टात्मा युद्धाय समुपागमत् । सर्वयत्नेन महता
    वधे तस्य धृतोऽभवत् ॥ ॥ अथ रविरवदन्निरीक्ष्य रामं मुदितमनाः परमं प्रहृष्यमाणः । निशिचरपति सङ्क्षयं
    विदित्वा सुरगण मध्यगतो वचस्त्वरेति ॥ ॥ इत्यार्षे श्रीमद्रामायणे वाल्मिकीये आदिकाव्ये युद्धकाण्डे पञ्चाधिक
    शततमः सर्गः ॥
