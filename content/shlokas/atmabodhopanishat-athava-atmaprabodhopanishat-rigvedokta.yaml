id: atmabodhopanishat-athava-atmaprabodhopanishat-rigvedokta
category: upanishad
name:
  english: atmabodhopanishat athava atmaprabodhopanishat (rigvedokta)
  devanagari: आत्मबोधोपनिषत् अथवा आत्मप्रबोधोपनिषत् (ऋग्वेदोक्त)
content:
  english: shrimannarayanakaramashtaksharamahashayam | svamatranubhavatsiddhamatmabodham harim bhaje ||
    om vanme manasiti shantih || om pratyaganandam brahmapurusham pranavasvarupam akara ukara makara iti
    tryaksharam pranavam tadetadomiti | yamuktva mucyate yogi janmasamsarabandhanat | om namo narayanaya
    shankhacakragadadharaya tasmat om namo narayanayeti mantropasako vaikunthabhavanam gamishyati | atha
    yadidam brahmapuram pundarikam tasmattaditabhamatram dipavatprakasham || brahmanyo devakiputro brahmanyo
    madhusudanah | brahmanyah pundarikaksho brahmanyo vishnuracyutah || sarvabhutasthamekam narayanam
    karanapurushamakaranam param brahmom | shokamohavinirmukto vishnum dhyayanna sidati | dvaitadvaitamabhayam
    bhavati | mrityoh sa mrityumapnoti ya iha naneva pashyati | hritpadmamadhye sarvam yattatprajnane
    pratishthitam | prajnanetro lokah prajna pratishtha prajnanam brahma | sa etena prajnenatmanasmallokadutkramyamushminsvarge
    loke sarvankamanaptva'mritah samabhavadamritah samabhavat | yatra jyotirajasram yasmimlloke'bhyarhitam
    | tasminmam dehi svamanamrite loke akshate acyute loke akshate amritatvam ca gacchatyom namah || 1||
    pragalitanijamayo'ham nistuladrishirupavastumatro'ham | astamitahanto'ham pragalitajagadishajivabhedo'ham
    || 1|| pratyagabhinnaparo'ham vidhvastasheshavidhinishedho'ham | samudastashramito'ham pravitatasukhapurnasamvidevaham
    || 2|| sakshyahamanapeksho'ham nijamahimni samsthito'hamacalo'ham | ajaro'hamavyayo'ham pakshavipakshadibhedavidhuro'ham
    || 3|| avabodhaikaraso'ham mokshanandaikasindhurevaham | sukshmo'hamaksharo'ham vigalitagunajalakevalatma'ham
    || 4|| nistraigunyapado'ham kukshisthanekalokakalano'ham | kutasthacetano'ham nishkriyadhamahamapratarkyo'ham
    || 5|| eko'hamavikalo'ham nirmalanirvanamurtirevaham | niravayo'hamajo'ham kevalasanmatrasarabhuto'ham
    || 6|| niravadhinijabodho'ham shubhatarabhavo'hamaprabhedyo'ham | vibhurahamanavadyo'ham niravadhinihsimatattvamatro'ham
    || 7|| vedyo'hamagamastairaradhyo'ham sakalabhuvanahridyo'ham | paramanandaghano'ham paramanandaikabhumarupo'ham
    || 8|| shuddho'hamadvayo'ham santatabhavo'hamadishunyo'ham | shamitantatritayo'ham baddho mukto'hamadbhutatmaham
    || 9|| shuddho'hamantaro'ham shashvatavijnanasamarasatmaham | shodhitaparatattvo'ham bodhanandaikamurtirevaham
    || 10|| vivekayuktibuddhyaham janamyatmanamadvayam | tathapi bandhamokshadivyavaharah pratiyate ||
    11|| nivritto'pi prapanco me satyavadbhati sarvada | sarpadau rajjusatteva brahmasattaiva kevalam
    | prapancadhararupena vartate'to jaganna hi || 12|| yathekshurasasamvyapta sharkara vartate tatha
    | advayabrahmarupena vyapto'ham vai jagattrayam || 13|| brahmadikitaparyantah pranino mayi kalpitah
    | budbudadivikarantastarangah sagare yatha || 14|| tarangastham dravam sindhurna vanchati yatha tatha
    | vishayanandavancha me ma bhudanandarupatah || 15|| daridryasha yatha nasti sampannasya tatha mama
    | brahmanande nimagnasya vishayasha na tadbhavet || 16|| visham drishtva'mritam drishtva visham tyajati
    buddhiman | atmanamapi drishtvahamanatmanam tyajamyaham || 17|| ghatavabhasako bhanurghatanashe na
    nashyati | dehavabhasakah sakshi dehanashe na nashyati || 18|| na me bandho na me muktirna me shastram
    na me guruh | mayamatravikasatvanmayatito'hamadvayah || 19|| pranashcalantu taddharmaih kamairva hanyatam
    manah | anandabuddhipurnasya mama duhkham katham bhavet || 20|| atmanamanjasa vedmi kvapyajnanam palayitam
    | kartritvamadya me nashtam kartavyam vapi na kvacit || 21|| brahmanyam kulagotre ca namasaundaryajatayah
    | sthuladehagata ete sthuladbhinnasya me nahi || 22|| kshutpipasandhyabadhiryakamakrodhadayo'khilah
    | lingadehagata ete hyalingasya na santi hi || 23|| jadatvapriyamodatvadharmah karanadehagah | na
    santi mama nityasya nirvikarasvarupinah || 24|| ulukasya yatha bhanurandhakarah pratiyate | svaprakashe
    paranande tamo mudhasya jayate || 25|| cakshurdrishtinirodhe'bhraih suryo nastiti manyate | tatha'jnanavrito
    dehi brahma nastiti manyate || 26|| yathamritam vishadbhinnam vishadoshairna lipyate | na sprishami
    jadadbhinno jadadoshanprakashatah || 27|| svalpapi dipakanika bahulam nashayettamah | svalpo'pi bodho
    nibide bahulam nashayettamah || 28|| kalatraye yatha sarpo rajjau nasti tatha mayi | ahankaradidehantam
    jagannastyahamadvayah || 29|| cidrupatvanna me jadyam satyatvannanritam mama | anandatvanna me duhkhamajnanadbhati
    satyavat || 30|| atmaprabodhopanishadam muhurtamupasitva na sa punaravartate na sa punaravartata ityupanishat
    || om vanme manasiti shantih || iti atmabodhopanishatsamapta ||
  devanagari: श्रीमन्नारायणाकारमष्टाक्षरमहाशयम् । स्वमात्रानुभवात्सिद्धमात्मबोधं हरिं भजे ॥ ॐ वाङ्मे मनसीति
    शान्तिः ॥ ॐ प्रत्यगानन्दं ब्रह्मपुरुषं प्रणवस्वरूपं अकार उकार मकार इति त्र्यक्षरं प्रणवं तदेतदोमिति
    । यमुक्त्वा मुच्यते योगी जन्मसंसारबन्धनात् । ॐ नमो नारायणाय शङ्खचक्रगदाधराय तस्मात् ॐ नमो नारायणायेति
    मन्त्रोपासको वैकुण्ठभवनं गमिष्यति । अथ यदिदं ब्रह्मपुरं पुण्डरीकं तस्मात्तडिताभमात्रं दीपवत्प्रकाशम्
    ॥ ब्रह्मण्यो देवकीपुत्रो ब्रह्मण्यो मधुसूदनः । ब्रह्मण्यः पुण्डरीकाक्षो ब्रह्मण्यो विष्णुरच्युतः ॥
    सर्वभूतस्थमेकं नारायणं कारणपुरुषमकारणं परं ब्रह्मोम् । शोकमोहविनिर्मुक्तो विष्णुं ध्यायन्न सीदति ।
    द्वैताद्वैतमभयं भवति । मृत्योः स मृत्युमाप्नोति य इह नानेव पश्यति । हृत्पद्ममध्ये सर्वं यत्तत्प्रज्ञाने
    प्रतिष्ठितम् । प्रज्ञानेत्रो लोकः प्रज्ञा प्रतिष्ठा प्रज्ञानं ब्रह्म । स एतेन प्रज्ञेनात्मनास्माल्लोकादुत्क्रम्यामुष्मिन्स्वर्गे
    लोके सर्वान्कामानाप्त्वाऽमृतः समभवदमृतः समभवत् । यत्र ज्योतिरजस्रं यस्मिंल्लोकेऽभ्यर्हितम् । तस्मिन्मां
    देहि स्वमानमृते लोके अक्षते अच्युते लोके अक्षते अमृतत्वं च गच्छत्यों नमः ॥ १॥ प्रगलितनिजमायोऽहं निस्तुलदृशिरूपवस्तुमात्रोऽहम्
    । अस्तमिताहन्तोऽहं प्रगलितजगदीशजीवभेदोऽहम् ॥ १॥ प्रत्यगभिन्नपरोऽहं विध्वस्ताशेषविधिनिषेधोऽहम् । समुदस्ताश्रमितोऽहं
    प्रविततसुखपूर्णसंविदेवाहम् ॥ २॥ साक्ष्यहमनपेक्षोऽहं निजमहिम्नि संस्थितोऽहमचलोऽहम् । अजरोऽहमव्ययोऽहं
    पक्षविपक्षादिभेदविधुरोऽहम् ॥ ३॥ अवबोधैकरसोऽहं मोक्षानन्दैकसिन्धुरेवाहम् । सूक्ष्मोऽहमक्षरोऽहं विगलितगुणजालकेवलात्माऽहम्
    ॥ ४॥ निस्त्रैगुण्यपदोऽहं कुक्षिस्थानेकलोककलनोऽहम् । कूटस्थचेतनोऽहं निष्क्रियधामाहमप्रतर्क्योऽहम् ॥
    ५॥ एकोऽहमविकलोऽहं निर्मलनिर्वाणमूर्तिरेवाहम् । निरवयोऽहमजोऽहं केवलसन्मात्रसारभूतोऽहम् ॥ ६॥ निरवधिनिजबोधोऽहं
    शुभतरभावोऽहमप्रभेद्योऽहम् । विभुरहमनवद्योऽहं निरवधिनिःसीमतत्त्वमात्रोऽहम् ॥ ७॥ वेद्योऽहमगमास्तैराराध्योऽहं
    सकलभुवनहृद्योऽहम् । परमानन्दघनोऽहम् परमानन्दैकभूमरूपोऽहम् ॥ ८॥ शुद्धोऽहमद्वयोऽहं सन्ततभावोऽहमादिशून्योऽहम्
    । शमितान्तत्रितयोऽहं बद्धो मुक्तोऽहमद्भुतात्माहम् ॥ ९॥ शुद्धोऽहमान्तरोऽहं शाश्वतविज्ञानसमरसात्माहम्
    । शोधितपरतत्त्वोऽहं बोधानन्दैकमूर्तिरेवाहम् ॥ १०॥ विवेकयुक्तिबुद्ध्याहं जानाम्यात्मानमद्वयम् । तथापि
    बन्धमोक्षादिव्यवहारः प्रतीयते ॥ ११॥ निवृत्तोऽपि प्रपञ्चो मे सत्यवद्भाति सर्वदा । सर्पादौ रज्जुसत्तेव
    ब्रह्मसत्तैव केवलम् । प्रपञ्चाधाररूपेण वर्ततेऽतो जगन्न हि ॥ १२॥ यथेक्षुरससंव्याप्ता शर्करा वर्तते
    तथा । अद्वयब्रह्मरूपेण व्याप्तोऽहं वै जगत्त्रयम् ॥ १३॥ ब्रह्मादिकीटपर्यन्ताः प्राणिनो मयि कल्पिताः
    । बुद्बुदादिविकारान्तस्तरङ्गः सागरे यथा ॥ १४॥ तरङ्गस्थं द्रवं सिन्धुर्न वाञ्छति यथा तथा । विषयानन्दवाञ्छा
    मे मा भूदानन्दरूपतः ॥ १५॥ दारिद्र्याशा यथा नास्ति सम्पन्नस्य तथा मम । ब्रह्मानन्दे निमग्नस्य विषयाशा
    न तद्भवेत् ॥ १६॥ विषं दृष्ट्वाऽमृतं दृष्ट्वा विषं त्यजति बुद्धिमान् । आत्मानमपि दृष्ट्वाहमनात्मानं
    त्यजाम्यहम् ॥ १७॥ घटावभासको भानुर्घटनाशे न नश्यति । देहावभासकः साक्षी देहनाशे न नश्यति ॥ १८॥ न मे
    बन्धो न मे मुक्तिर्न मे शास्त्रं न मे गुरुः । मायामात्रविकासत्वान्मायातीतोऽहमद्वयः ॥ १९॥ प्राणाश्चलन्तु
    तद्धर्मैः कामैर्वा हन्यतां मनः । आनन्दबुद्धिपूर्णस्य मम दुःखं कथं भवेत् ॥ २०॥ आत्मानमञ्जसा वेद्मि
    क्वाप्यज्ञानं पलायितम् । कर्तृत्वमद्य मे नष्टं कर्तव्यं वापि न क्वचित् ॥ २१॥ ब्राह्मण्यं कुलगोत्रे
    च नामसौन्दर्यजातयः । स्थूलदेहगता एते स्थूलाद्भिन्नस्य मे नहि ॥ २२॥ क्षुत्पिपासान्ध्यबाधिर्यकामक्रोधादयोऽखिलाः
    । लिङ्गदेहगता एते ह्यलिङ्गस्य न सन्ति हि ॥ २३॥ जडत्वप्रियमोदत्वधर्माः कारणदेहगाः । न सन्ति मम नित्यस्य
    निर्विकारस्वरूपिणः ॥ २४॥ उलूकस्य यथा भानुरन्धकारः प्रतीयते । स्वप्रकाशे परानन्दे तमो मूढस्य जायते
    ॥ २५॥ चक्षुर्दृष्टिनिरोधेऽभ्रैः सूर्यो नास्तीति मन्यते । तथाऽज्ञानावृतो देही ब्रह्म नास्तीति मन्यते
    ॥ २६॥ यथामृतं विषाद्भिन्नं विषदोषैर्न लिप्यते । न स्पृशामि जडाद्भिन्नो जडदोषान्प्रकाशतः ॥ २७॥ स्वल्पापि
    दीपकणिका बहुलं नाशयेत्तमः । स्वल्पोऽपि बोधो निबिडे बहुलं नाशयेत्तमः ॥ २८॥ कालत्रये यथा सर्पो रज्जौ
    नास्ति तथा मयि । अहङ्कारादिदेहान्तं जगन्नास्त्यहमद्वयः ॥ २९॥ चिद्रूपत्वान्न मे जाड्यं सत्यत्वान्नानृतं
    मम । आनन्दत्वान्न मे दुःखमज्ञानाद्भाति सत्यवत् ॥ ३०॥ आत्मप्रबोधोपनिषदं मुहूर्तमुपासित्वा न स पुनरावर्तते
    न स पुनरावर्तत इत्युपनिषत् ॥ ॐ वाङ्मे मनसीति शान्तिः ॥ इति आत्मबोधोपनिषत्समाप्ता ॥
