id: subrahmanyapujakalpa
category: stotram
name:
  english: subrahmanyapujakalpa
  devanagari: सुब्रह्मन्यपूजाकल्प
content:
  english: suta | dadami devasenesha dayakara grihaname || vallidevasenasameta shri subrahmanya svamine
    namah ratnasimhasanam samarpayami || || padyam || padyam grihana vallisha parvati priyanandana | papam
    paraya me sarvam putrapautran pravarddhaya || vallidevasenasameta shri subrahmanya svamine namah padyam
    samarpayami || || arghyam || arghyam grihana gamgeya devarajasamarcita | saphalan kuru kaman me shanmatura
    namo namah || vallidevasena sameta shri subrahmanya svamine namah arghyam samarpayami || || acamaniyam
    || grihanacamanam deva gunasvamin gunalaya | guroravi guro deva gurume kushalam vibho || vallidevasena
    sameta shri subrahmanya svamine namah acamaniyam samarpayami || || madhuparkam || madhuparkam grihanemam
    madhusudana vandita | mahadevasutananta mahapataka nashanam || vallidevasena sameta shri subrahmanya
    svamine namah madhuparkam samarpayami || || pancamrita snana || pancamritena parama pancapataka nashana
    | snanam kuru sadaraddhya surasenapatevyaya || vallidevasena sameta shri subrahmanya svamine namah
    pancamrita snanam samarpayami || || snanam || devasindhu samudbhuta gangadhara tanubhava | snanam
    svikuru sarvesha gangadi salilaih shivaih || vallidevasena sameta shri subrahmanya svamine namah snanam
    samarpayami || snananantaram acamaniyam ca samarpayami || || vastram || vastrayugmam ca vallisha varitakhila
    pataka | suvarnatantubhih syutam grihyatam guha shanmukha || vallidevasena sameta shri subrahmanya
    svamine namah vastram samarpayami || || upavitam || rajatam brahmasutram ca kancanamcottariyakam |
    dadami devasenesha grihana gunasagara || vallidevasena sameta shri subrahmanya svamine namah upavitam
    samarpayami || || vibhuti || agnihotrasamutbhutam virajanalasambhavam | grihana bhasitam deva bhutabadha
    vinashana || vallidevasena sameta shri subrahmanya svamine namah vibhutim samarpayami || || gandham
    || kasturi kunkumopetam ghanasara samanvitam | grihana ruciram gandha mandhakaritanubhava || vallidevasena
    sameta shri subrahmanya svamine namah gandham dharayami || || akshata || akshatan dhavalan ramyan
    haridracurnamishritan | kumara karunasindho grihana gunabhushana || vallidevasena sameta shri subrahmanya
    svamine namah akshatan samarpayami || || nanavidha pushpani || parijataninipanca parijatani malatim
    | punnagam bilvapatrashca grihana krauncadarana || vallidevasena sameta shri subrahmanya svamine namah
    nanavidha parimaḻa pushpani samarpayami || atha angapuja || parvati nandanaya namah padau pujayami
    | guhaya namah gulphau pujayami | jagannathaya namah januni pujayami | urubalaya namah uru pujayami
    | krittikasutaya namah katim pujayami | guhaya namah guhyam pujayami | kumaraya namah kukshim pujayami
    | narayanisutaya namah nabhim pujayami | vishakhaya namah vakshah pujayami | krittikasunadhayaya namah
    stanau pujayami | bahulasutaya namah bahun pujayami | harasunave namah hastan pujayami | kartikeyaya
    namah kantham pujayami | shanmukhaya namah mukhani pujayami | sunasaya namah nasikah pujayami | devanetre
    namah netrani pujayami | hiranyakundalaya namah karnan pujayami | sarvaphalapradaya namah phalam pujayami
    | karunakaraya namah kapolau pujayami | sharavanabhavaya namah shiramsi pujayami | kukkutadhvajaya
    namah kacan pujayami | sarvamangalapradaya namah sarvanyangani pujayami || atha ashtottarashatanamavalya
    va sahasranamavalya va pushpakshatarcanam kritva || || dhupah || dashangam guggulupetam sugandhamca
    manoharam | dhupam grihana devesha dhutapapa namo'stute || vallidevasena sameta shri subrahmanya svamine
    namah dhupamaghrapayami || || dipah || sajyavarti trayopetam dipam pashya dayanidhe | devasenapate
    skanda vallinatha varaprada || vallidevasena sameta shri subrahmanya svamine namah dipam darshayami
    | dhupadipanantaram acamaniyam samarpayami || || naivedyam || om bhurbhuvahsuvah
  devanagari: सुत । ददामि देवसेनेश दयाकर गृहाणमे ॥ वल्लीदेवसेनासमेत श्री सुब्रह्मण्य स्वामिने नमः रत्नसिंहासनं
    समर्पयामि ॥ ॥ पाद्यम् ॥ पाद्यं गृहाण वल्लीश पार्वती प्रियनन्दन । पापं पारय मे सर्वं पुत्रपौत्रान्
    प्रवर्द्धय ॥ वल्लीदेवसेनासमेत श्री सुब्रह्मण्य स्वामिने नमः पाद्यं समर्पयामि ॥ ॥ अर्घ्यम् ॥ अर्घ्यं
    गृहाण गांगेय देवराजसमर्चित । सफलान् कुरु कामान् मे षाण्मातुर नमो नमः ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य
    स्वामिने नमः अर्घ्यं समर्पयामि ॥ ॥ आचमनीयम् ॥ गृहाणाचमनं देव गुणास्वामिन् गुणालय । गुरोरवि गुरो देव
    गुरुमे कुशलं विभो ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः आचमनीयं समर्पयामि ॥ ॥ मधुपर्कम्
    ॥ मधुपर्कं गृहाणेमां मधुसूदन वन्दित । महादेवसुतानन्त महापातक नाशनम् ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य
    स्वामिने नमः मधुपर्कं समर्पयामि ॥ ॥ पञ्चामृत स्नान ॥ पञ्चामृतेन परम पञ्चपातक नाशन । स्नानं कुरु सदाराद्ध्य
    सुरसेनापतेव्यय ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः पञ्चामृत स्नानं समर्पयामि ॥ ॥ स्नानम्
    ॥ देवसिन्धु समुद्भूत गङ्गाधर तनुभव । स्नानं स्वीकुरु सर्वेश गङ्गादि सलिलैः शिवैः ॥ वल्लीदेवसेना समेत
    श्री सुब्रह्मण्य स्वामिने नमः स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं च समर्पयामि ॥ ॥ वस्त्रम् ॥ वस्त्रयुग्मं
    च वल्लीश वारिताखिल पातक । सुवर्णतन्तुभिः स्यूतं गृह्यतां गुह षण्मुख ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य
    स्वामिने नमः वस्त्रं समर्पयामि ॥ ॥ उपवीतम् ॥ रजतं ब्रह्मसूत्रं च काञ्चनंचोत्तरीयकम् । ददामि देवसेनेश
    गृहाण गुणसागर ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः उपवीतं समर्पयामि ॥ ॥ विभूति ॥ अग्निहोत्रसमुत्भूतं
    विरजानलसंभवम् । गृहाण भसितं देव भूतबाध विनाशन ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः विभूतिं
    समर्पयामि ॥ ॥ गन्धम् ॥ कस्तूरी कुङ्कुमोपेतं घनसार समन्वितम् । गृहाण रुचिरं गन्ध मन्धकारितनूभव ॥ वल्लीदेवसेना
    समेत श्री सुब्रह्मण्य स्वामिने नमः गन्धम् धारयामि ॥ ॥ अक्षता ॥ अक्षतान् धवलान् रम्यान् हरिद्राचूर्णमिश्रितान्
    । कुमार करुणासिन्धो गृहाण गुणभूषण ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः अक्षतान् समर्पयामि
    ॥ ॥ नानाविध पुष्पाणि ॥ पारिजातानिनीपञ्च पारिजातानि मालतीम् । पुन्नागं बिल्वपत्रश्च गृहान क्रौञ्चदारण
    ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः नानाविध परिमळ पुष्पाणि समर्पयामि ॥ अथ अङ्गपूजा ॥
    पार्वती नन्दनाय नमः पादौ पूजयामि । गुहाय नमः गुल्फौ पूजयामि । जगन्नाथाय नमः जानुनी पूजयामि । उरुबलाय
    नमः ऊरु पूजयामि । कृत्तिकासुताय नमः कटिं पूजयामि । गुहाय नमः गुह्यं पूजयामि । कुमाराय नमः कुक्षिं
    पूजयामि । नारायणीसुताय नमः नाभिं पूजयामि । विशाखाय नमः वक्षः पूजयामि । कृत्तिकासूनधायाय नमः स्तनौ
    पूजयामि । बहुलासुताय नमः बाहून् पूजयामि । हरसूनवे नमः हस्तान् पूजयामि । कार्तिकेयाय नमः कण्ठं पूजयामि
    । षण्मुखाय नमः मुखानि पूजयामि । सुनासाय नमः नासिकाः पूजयामि । देवनेत्रे नमः नेत्राणि पूजयामि । हिरण्यकुण्डलाय
    नमः कर्णान् पूजयामि । सर्वफलप्रदाय नमः फालं पूजयामि । करुणाकराय नमः कपोलौ पूजयामि । शरवणभवाय नमः शिरांसि
    पूजयामि । कुक्कुटध्वजाय नमः कचान् पूजयामि । सर्वमङ्गलप्रदाय नमः सर्वाण्यङ्गानि पूजयामि ॥ अथ अष्टोत्तरशतनामवल्या
    वा सहस्रनामावल्या वा पुष्पाक्षतार्चनं कृत्वा ॥ ॥ धूपः ॥ दशाङ्गं गुग्गुलूपेतं सुगन्धंच मनोहरम् । धूपं
    गृहाण देवेश धूतपाप नमोऽस्तुते ॥ वल्लीदेवसेना समेत श्री सुब्रह्मण्य स्वामिने नमः धूपमाघ्रापयामि ॥ ॥
    दीपः ॥ साज्यवर्ति त्रयोपेतं दीपं पश्य दयानिधे । देवसेनापते स्कन्द वल्लीनाथ वरप्रद ॥ वल्लीदेवसेना समेत
    श्री सुब्रह्मण्य स्वामिने नमः दीपं दर्शयामि । धूपदीपानन्तरं आचमनीयं समर्पयामि ॥ ॥ नैवेद्यम् ॥ ॐ भूर्भुवःसुवः
