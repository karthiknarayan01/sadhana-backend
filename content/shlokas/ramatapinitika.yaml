id: ramatapinitika
category: upanishad
name:
  english: ramatapinitika
  devanagari: रामतापिनीटीका
content:
  english: yah param brahma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yashca'khandaikarasatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yashca brahmanandamritam bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yastarakam brahma bhurbhuvasvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan yashca
    brahma vishnurishvaro yah sarvadevatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan ye sarve vedah sangah sashakhah sapurana bhurbhuvahsvastasmai vai namo namah | om yo vai
    shriramacandrah sa bhagavan yo jivatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan yashca sarvabhutantaratma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan ye devasuramanushyadibhava bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan ye matsyakurmadyavatarah bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan yashca prano bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yo'ntahkaranacatushtayatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yashca yamo bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan yashcantako
    bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan yashca mrityurbhurbhuvahsvastasmai
    vai namo namah | om yo vai shriramacandrah sa bhagavan yashcamritam bhurbhuvahsvastasmai vai namo
    namah | om yo vai shriramacandrah sa bhagavan yani panca mahabhutani bhurbhuvah svastasmai vai namo
    namah | om yo vai shriramacandrah sa bhagavan yah sthavarajangamatma bhurbhuvahsvastasmai vai namo
    namah | om yo vai shriramacandrah sa bhagavan ye pancagnayo bhurbhuvahsvastasmai vai namo namah |
    om yo vai shriramacandrah sa bhagavan yah saptavyahritayo bhurbhuvahsvastasmai vai namo namah | om
    yo vai shriramacandrah sa bhavagan ya vidya bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan ya sarasvati bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    ya lakshmirbhurbhuvah svastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan ya gauri bhurbhuvahsvastasmai
    vai namo namah | om yo vai shriramacandrah sa bhagavan ya janaki bhurbhuvahstastasmai vai namo namah
    | om yo vai shriramacandrah sa bhagavan yacca trailokyam bhurbhuvahsvastasmai vai namo namah | om
    yo vai shriramacandrah sa bhagavan yashca suryo bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan yashca somo bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yani nakshatrani bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan ye ca
    navagraha bharbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan ye cashtau vasavo
    bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan ye cashtau lokapala bhurbhuvahsvastasmai
    vai namo namah | om yo vai shriramacandrah sa bhagavan ye caikadasha rudra bhurbhuvahsvastasmai vai
    namo namah | om yo vai shriramacandrah sa bhagavan ye dvadashaditya bhurbhuvahsvastasmai vai namo
    namah | om yo vai shriramacandrah sa bhagavan yashca bhutam bhavyam bhavishyat bhurbhuvahsvastasmai
    vai namo namah | om yo vai shriramacandrah sa bhagavan yo brahmandasya'ntarbahirvyapnoti virat bhurbhuvahsvastasmai
    vai namo namah | om yo vai shriramacandrah sa bhagavan yo hiranyagarbho bhurbhuvahsvastasmai vai namo
    namah | om yo vai shriramacandrah sa bhagavan ya prakritibhurbhuvahsvastasmai vai namo namah | om
    yo vai shriramacandrah sa bhagavan yashvonkaro bhurbhuvahsvastasmai vai namo namah | om yo shriramacandrah
    sa bhagavan yashcatasro'rdhamatra bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan yashca paramapurusho bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa
    bhagavan yashca maheshvaro bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yashca mahadevo bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan ya om
    namobhagavate vasudevaya mahavishnurbhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah
    sa bhagavan yah paramatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan
    yo jnanatma bhurbhuvahsvastasmai vai namo namah | om yo vai shriramacandrah sa bhagavan yah saccidanandadvaitaikarasatma
    bhurbhuvahsvastasmai vai namo namah || ityetairbahma saptacatvarimshanmantrairnityam devam stauti
    tatra tasya devah prito bhavati
  devanagari: यः परं ब्रह्म भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्चाऽखण्डैकरसात्मा
    भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च ब्रह्मानन्दामृतं भूर्भुवःस्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यस्तारकं ब्रह्म भूर्भुवस्वस्तस्मै वै नमो नमः । ॐ यो वै
    श्रीरामचन्द्रः स भगवान् यश्च ब्रह्मा विष्णुरीश्वरो यः सर्वदेवात्मा भूर्भुवःस्वस्तस्मै वै नमो नमः ।
    ॐ यो वै श्रीरामचन्द्रः स भगवान् ये सर्वे वेदाः साङ्गाः सशाखाः सपुराणा भूर्भुवःस्वस्तस्मै वै नमो नमः
    । ॐ यो वै श्रीरामचन्द्रः स भगवान् यो जीवात्मा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः
    स भगवान् यश्च सर्वभूतान्तरात्मा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये
    देवासुरमनुष्यादिभावा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये मत्स्यकूर्माद्यवताराः
    भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च प्राणो भूर्भुवःस्वस्तस्मै वै
    नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् योऽन्तःकरणचतुष्टयात्मा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ
    यो वै श्रीरामचन्द्रः स भगवान् यश्च यमो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान्
    यश्चान्तको भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च मृत्युर्भूर्भुवःस्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्चामृतं भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः
    स भगवान् यानि पञ्च महाभूतानि भूर्भुवः स्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यः स्थावरजङ्गमात्मा
    भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये पञ्चाग्नयो भूर्भुवःस्वस्तस्मै वै
    नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यः सप्तव्याहृतयो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै
    श्रीरामचन्द्रः स भवगान् या विद्या भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान्
    या सरस्वती भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् या लक्ष्मीर्भूर्भुवः स्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् या गौरी भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः
    स भगवान् या जानकी भूर्भुवःस्तस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यच्च त्रैलोक्यं
    भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च सूर्यो भूर्भुवःस्वस्तस्मै वै
    नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च सोमो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः
    स भगवान् यानि नक्षत्राणि भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये च नवग्रहा
    भर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये चाष्टौ वसवो भूर्भुवःस्वस्तस्मै वै
    नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् ये चाष्टौ लोकपाला भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै
    श्रीरामचन्द्रः स भगवान् ये चैकादश रुद्रा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स
    भगवान् ये द्वादशादित्या भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च भूतं
    भव्यं भविष्यत् भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यो ब्रह्माण्डस्याऽन्तर्बहिर्व्याप्नोति
    विराट् भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यो हिरण्यगर्भो भूर्भुवःस्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् या प्रकृतिभूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः
    स भगवान् यश्वोङ्कारो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो श्रीरामचन्द्रः स भगवान् याश्चतस्रोऽर्धमात्रा
    भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च परमपुरुषो भूर्भुवःस्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यश्च महेश्वरो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै
    श्रीरामचन्द्रः स भगवान् यश्च महादेवो भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान्
    य ॐ नमोभगवते वासुदेवाय महाविष्णुर्भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान्
    यः परमात्मा भूर्भुवःस्वस्तस्मै वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यो ज्ञानात्मा भूर्भुवःस्वस्तस्मै
    वै नमो नमः । ॐ यो वै श्रीरामचन्द्रः स भगवान् यः सच्चिदानन्दाद्वैतैकरसात्मा भूर्भुवःस्वस्तस्मै वै नमो
    नमः ॥ इत्येतैर्बह्मा सप्तचत्वारिंशन्मन्त्रैर्नित्यं देवं स्तौति तत्र तस्य देवः प्रीतो भवति
