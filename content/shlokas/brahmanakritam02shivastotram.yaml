id: brahmanakritam02shivastotram
category: stotram
name:
  english: brahmanakritam02shivastotram
  devanagari: ब्रह्मणाकृतं०२शिवस्तोत्रम्
content:
  english: sarvapapavimocano'si trivikramo'si om namaste pulastya uvaca | ittham stutah padmabhavena vishnustapasvibhishcadbhutakarmakari
    | provaca devam prapitamaham tu varam vrinishvamalasattvavritte || 12|| iti vamanapurane trinavatitamadhyayantargatam
    brahmana kritam vishnustotram samaptam | vamanapurana | adhyaya 93
  devanagari: सर्वपापविमोचनोऽसि त्रिविक्रमोऽसि ॐ नमस्ते पुलस्त्य उवाच । इत्थं स्तुतः पद्मभवेन विष्णुस्तपस्विभिश्चाद्भुतकार्मकारी
    । प्रोवाच देवं प्रपितामहं तु वरं वृणीष्वामलसत्त्ववृत्ते ॥ १२॥ इति वामनपुराणे त्रिनवतितमाध्यायान्तर्गतं
    ब्रह्मणा कृतं विष्णुस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ९३
meaning: {}
