id: padmavatinavaratnamalikastuti
category: stotram
name:
  english: padmavatinavaratnamalikastuti
  devanagari: पद्मावतीनवरत्नमालिकास्तुती
content:
  english: vridasampadivaktram tilasumavijayodyoganirnidranasam | tadatvotphullanilambujahasanacanatmiyacakshuh
    prakasham balashrilapravalapriyasakhacaranadvandvaramyam bhaje'ham || 7|| yam devim maunivaryah shrayadamaravadhumaulimalyarcintanghrim
    samsarasaravaramnidhitarataranetaranatarim sarvada bhavayante | shrikarottungaratnapracuritakanakasnigdhashuddhantalilam
    tam shashvatpadapadmashrayadakhilahridahladinim hladaye'ham || 8|| akashadhishaputrim shritajananivahadhinacetahpravrittim
    vande shrivenkateshaprabhuvaramahishim dinacittapratosham | pushyatpadaravindaprasrimarasumahashshamitasvashrintanta
  devanagari: व्रीडासम्पादिवक्त्रां तिलसुमविजयोद्योगनिर्निद्रनासाम् । तादात्वोत्फुल्लनीलाम्बुजहसनचणात्मीयचक्षुः
    प्रकाशां बालश्रीलप्रवालप्रियसखचरणद्वन्द्वरम्यां भजेऽहम् ॥ ७॥ यां देवीं मौनिवर्याः श्रयदमरवधूमौलिमाल्यार्चिन्ताङ्घ्रिं
    संसारासारवारांनिधितरतरणेतरणतरिं सर्वदा भावयन्ते । श्रीकारोत्तुङ्गरत्नप्रचुरितकनकस्निग्धशुद्धान्तलीलां
    तां शश्वत्पादपद्मश्रयदखिलहृदाह्लादिनीं ह्लादयेऽहम् ॥ ८॥ आकाशाधीशपुत्रीं श्रितजननिवहाधीनचेतःप्रवृत्तिं
    वन्दे श्रीवेङ्कटेशप्रभुवरमहिषीं दीनचित्तप्रतोषाम् । पुष्यत्पादारविन्दप्रसृमरसुमहश्शामितस्वाश्रिन्तान्त
meaning: {}
