id: lakshminrisimhamalamantrah-2
category: mantra
name:
  english: lakshminrisimhamalamantrah 2
  devanagari: लक्ष्मीनृसिंहमालामन्त्रः २
content:
  english: lakshminrisimhamalamantrah shriganeshaya namah | om asya shrilakshminrisimhamalamantrasya prahladarishih
    gayatri chandah shrilakshminrisimho devata stambhodbhavamiti bijam hiranyakashipusamharanarthamitikilakam
    srishtirakshanarthamiti shaktih | shrilakshminrisimhaprasadasiddhyarthe shrinrisimhamalamantrajape
    viniyogah || om namo bhagavate raudrarupaya pingalalocanaya vajranakhaya vajradamshtrakaralavadanaya
    garhyasahavaniya dakshinagnyantakakaralavaktraya brahmarakshasasamharanaya prahladarakshakastambhodbhavaya
    om hram hrim hrum hraim hraum hrah hana hana daha daha ghem ghem ghem vajranrisimhaya atmarakshakaya
    atmamantra atmayantra atmatantra rakshanaya om hram itishat | lam lam lam shrivirapralayakalanrisimhaya
    rajabhayorabhayam dushtabhayam sakalabhayam uccatanaya uccatanaya om klam klim klum klaim klaum klah
    vajradamshtraya sarvashatrun brahmagrahan pishacagrahan shakinigrahan dakinigrahan maraya maraya kilaya
    chedaya chedaya yadmalam curaya lapamalam curaya shavamalam curaya sarvamalam curaya havamalam curaya
    | om klam klim klum klaim klaum klah lam lam lam shriviranrisimhaya indradisham bandha bandha vajranakhaya
    agnidisham bandha bandha jvalavaktraya yamadisham bandha bandha karaladamshtraya nairritodisham bandha
    bandha pingalakshaya varunadisham bandha bandha urdhvanakhaya vayavyadisham bandha bandha nilakanthaya
    kuberadisham bandha bandha jvalatkeshaya ishanim disham bandha bandha | urdhvabahave urdhvadisham
    bandha bandha adhararupaya pataladisham bandha bandha | kanakashyapa samharanaya akashadisham bandha
    bandha ugradehaya antarikshadisham bandha bandha | bhaktajanapalakaya stambhodbhavaya sarvadishah
    bandha bandha | gham
  devanagari: लक्ष्मीनृसिंहमालामन्त्रः श्रीगणेशाय नमः । ॐ अस्य श्रीलक्ष्मीनृसिंहमालामन्त्रस्य प्रह्लादऋषिः
    गायत्री छन्दः श्रीलक्ष्मीनृसिंहो देवता स्तम्भोद्भवमिति बीजं हिरण्यकशिपुसंहरणार्थमितिकीलकं सृष्टिरक्षणार्थमिति
    शक्तिः । श्रीलक्ष्मीनृसिंहप्रसादसिद्ध्यर्थे श्रीनृसिंहमालामन्त्रजपे विनियोगः ॥ ॐ नमो भगवते रौद्ररूपाय
    पिङ्गललोचनाय वज्रनखाय वज्रदंष्ट्रकरालवदनाय गार्ह्यसाहवनीय दक्षिणाग्न्यन्तककरालवक्त्राय ब्रह्मराक्षससंहरणाय
    प्रह्लादरक्षकस्तम्भोद्भवाय ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः हन हन दह दह घें घें घें वज्रनृसिंहाय
    आत्मरक्षकाय आत्ममन्त्र आत्मयन्त्र आत्मतन्त्र रक्षणाय ॐ ह्रां इतिषट् । लं लं लं श्रीवीरप्रलयकालनृसिंहाय
    राजभयोरभयं दुष्टभयं सकलभयं उच्चाटनाय उच्चाटनाय ॐ क्लां क्लीं क्लूं क्लैं क्लौं क्लः वज्रदंष्ट्राय
    सर्वशत्रून् ब्रह्मग्रहान् पिशाचग्रहान् शाकिनीग्रहान् डाकिनीग्रहान् मारय मारय कीलय छेदय छेदय यद्मलं
    चूरय लपमलं चूरय शवमलं चूरय सर्वमलं चूरय हवमलं चूरय । ॐ क्लां क्लीं क्लूं क्लैं क्लौं क्लः लं लं लं
    श्रीवीरनृसिंहाय इन्द्रादिशं बन्ध बन्ध वज्रनखाय अग्निदिशं बन्ध बन्ध ज्वालावक्त्राय यमदिशं बन्ध बन्ध
    करालदंष्ट्राय नैरृतोदिशं बन्ध बन्ध पिङ्गलाक्षाय वरुणदिशं बन्ध बन्ध ऊर्ध्वनखाय वायव्यदिशं बन्ध बन्ध
    नीलकण्ठाय कुबेरदिशं बन्ध बन्ध ज्वलत्केशाय ईशानीं दिशं बन्ध बन्ध । ऊर्ध्वबाहवे ऊर्ध्वदिशं बन्ध बन्ध
    आधाररूपाय पातालदिशं बन्ध बन्ध । कनकश्यप संहारणाय आकाशदिशं बन्ध बन्ध उग्रदेहाय अन्तरिक्षदिशं बन्ध बन्ध
    । भक्तजनपालकाय स्तम्भोद्भवाय सर्वदिशः बन्ध बन्ध । घां
