id: gurushivanandastotram
category: stotram
name:
  english: gurushivanandastotram
  devanagari: गुरुशिवानन्दस्तोत्रम्
content:
  english: shivanandam dayasindhum sundaranandavigraham | bhavabdhitarakam vande jnanavijnanadam shubham
    || 1|| saccitsukhaghanakaram jagatah sthitikaranam | atmarupam param shantam shivanandagurum bhaje
    || 2|| ahamsphurtitarangastham cidanandabdhirupakam | mumukshunalinicandram shivanandagurum stuve
    || 3|| ajnanarajanisuryam taptacittasudhaghanam | bhavarogabhishagratnam shivanandam gurum shraye
    || 4|| kundale katakam yadvat mrigambhasi ca atapah | tadvajjagati yatsatyam tasmin shivapade rame
    || 5|| iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracitam shrigurushivanandastotram
    sampurnam | kilakasamvatsara
  devanagari: शिवानन्दं दयासिन्धुं सुन्दरानन्दविग्रहम् । भवाब्धितारकं वन्दे ज्ञानविज्ञानदं शुभम् ॥ १॥
    सच्चित्सुखघनाकारं जगतः स्थितिकारणम् । आत्मरूपं परं शान्तं शिवानन्दगुरुं भजे ॥ २॥ अहंस्फूर्तितरङ्गस्थं
    चिदानन्दाब्धिरूपकम् । मुमुक्षुनलिनीचन्द्रं शिवानन्दगुरुं स्तुवे ॥ ३॥ अज्ञानरजनीसूर्यं तप्तचित्तसुधाघनम्
    । भवरोगभिषग्रत्नं शिवानन्दं गुरुं श्रये ॥ ४॥ कुण्डले कटकं यद्वत् मृगाम्भसि च आतपः । तद्वज्जगति यत्सत्यं
    तस्मिन् शिवपदे रमे ॥ ५॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं
    श्रीगुरुशिवानन्दस्तोत्रं सम्पूर्णम् । कीलकसंवत्सर
meaning: {}
