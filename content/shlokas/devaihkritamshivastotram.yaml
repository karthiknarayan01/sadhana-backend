id: devaihkritamshivastotram
category: stotram
name:
  english: devaihkritamshivastotram
  devanagari: देवैःकृतंशिवस्तोत्रम्
content:
  english: devaih kritam shivastotram deva ucuh | namah kapaline nityam mahakalaya shankhine || 71|| aishvaryajnanayuktaya
    sarvabhogapradayine | namo darpavinashaya sarvadevamayaya ca || 72|| kalasamharakarta tvam mahakalastato
    hyasi | bhaktanam duhkhashamano duhkhantastena rocase || 73|| shankaro'pyashu bhaktanam tena tvam
    shankarah smritah | chittva brahmashiro yasmatkapalam ca bibharshi ca || 74|| tena deva kapali tvam
    stuto hyasi prasida nah || iti shriskandapurane avantyakhande avantikshetramahatmye dvitiyadhyayantargatam
    devaih kritam shivastotram samaptam | skandapurana | avantyakhanda | avantyakhanda | adhyaya 2
  devanagari: देवैः कृतं शिवस्तोत्रम् देवा ऊचुः । नमः कपालिने नित्यं महाकालाय शङ्खिने ॥ ७१॥ ऐश्वर्यज्ञानयुक्ताय
    सर्वभोगप्रदायिने । नमो दर्पविनाशाय सर्वदेवमयाय च ॥ ७२॥ कालसंहारकर्ता त्वं महाकालस्ततो ह्यसि । भक्तानां
    दुःखशमनो दुःखान्तस्तेन रोचसे ॥ ७३॥ शङ्करोऽप्याशु भक्तानां तेन त्वं शङ्करः स्मृतः । छित्त्वा ब्रह्मशिरो
    यस्मात्कपालं च बिभर्षि च ॥ ७४॥ तेन देव कपाली त्वं स्तुतो ह्यसि प्रसीद नः ॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे
    अवन्तीक्षेत्रमाहात्म्ये द्वितीयाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड
    । आवन्त्यखण्ड । अध्याय २
meaning: {}
