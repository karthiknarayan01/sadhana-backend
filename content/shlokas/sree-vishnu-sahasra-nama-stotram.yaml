id: sree-vishnu-sahasra-nama-stotram
category: stotram
name:
  english: Sree Vishnu Sahasra Nama Stotram
content:
  english: om shuklambaradharam vishnum shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye
    || || yasyadviradavaktradyah parishadyah parah shatam | vighnam nighnanti satatam vishvaksenam tamashraye
    || || purva pithika vyasam vasishtha naptaram shakteh pautramakalmasham | parasharatmajam vande shukatatam
    taponidhim || || vyasaya vishnu rupaya vyasarupaya vishnave | namo vai brahmanidhaye vasishthaya namo
    namah || || avikaraya shuddhaya nityaya paramatmane | sadaika rupa rupaya vishnave sarvajishnave ||
    || yasya smaranamatrena janmasamsarabandhanat | vimucyate namastasmai vishnave prabhavishnave || ||
    om namo vishnave prabhavishnave | shri vaishampayana uvaca shrutva dharma nasheshena pavanani ca sarvashah
    | yudhishthirah shantanavam punarevabhya bhashata || || yudhishthira uvaca kimekam daivatam loke kim
    va'pyekam parayanam stuvantah kam kamarcantah prapnuyurmanavah shubham || || ko dharmah sarvadharmanam
    bhavatah paramo matah | kim japanmucyate janturjanmasamsara bandhanat || || shri bhishma uvaca jagatprabhum
    devadeva manantam purushottamam | stuvannama sahasrena purushah satatotthitah || || tameva carcayannityam
    bhaktya purushamavyayam | dhyayan stuvannamasyamshca yajamanastameva ca || || anadi nidhanam vishnum
    sarvaloka maheshvaram | lokadhyaksham stuvannityam sarva duhkhatigo bhavet || || brahmanyam sarva
    dharmajnam lokanam kirti vardhanam | lokanatham mahadbhutam sarvabhuta bhavodbhavam|| || esha me sarva
    dharmanam dharmo'dhika tamomatah | yadbhaktya pundarikaksham stavairarcennarah sada || || paramam
    yo mahattejah paramam yo mahattapah | paramam yo mahadbrahma paramam yah parayanam || || pavitranam
    pavitram yo mangalanam ca mangalam | daivatam devatanam ca bhutanam yo'vyayah pita || || yatah sarvani
    bhutani bhavantyadi yugagame | yasmimshca pralayam yanti punareva yugakshaye || || tasya loka pradhanasya
    jagannathasya bhupate | vishnornama sahasram me shrinu papa bhayapaham || || yani namani gaunani vikhyatani
    mahatmanah | rishibhih parigitani tani vakshyami bhutaye || || rishirnamnam sahasrasya vedavyaso mahamunih
    || chando'nushtup tatha devo bhagavan devakisutah || || amritamshudbhavo bijam shaktirdevakinandanah
    | trisama hridayam tasya shantyarthe viniyujyate || || vishnum jishnum mahavishnum prabhavishnum maheshvaram
    || anekarupa daityantam namami purushottamam || || purvanyasah asya shri vishnordivya sahasranama
    stotra mahamantrasya || shri vedavyaso bhagavan rishih | anushtup chandah | shrimahavishnuh paramatma
    shrimannarayano devata | amritamshudbhavo bhanuriti bijam | devakinandanah srashteti shaktih | udbhavah
    kshobhano deva iti paramomantrah | shankhabhrinnandaki cakriti kilakam | shar ngadhanva gadadhara
    ityastram | rathangapani rakshobhya iti netram | trisamasamagah sameti kavacam | anandam parabrahmeti
    yonih | ritussudarshanah kala iti digbandhah || shrivishvarupa iti dhyanam | shri mahavishnu prityarthe
    sahasranama jape parayane viniyogah | karanyasah vishvam vishnurvashatkara ityangushthabhyam namah
    amritamshudbhavo bhanuriti tarjanibhyam namah brahmanyo brahmakrit brahmeti madhyamabhyam namah suvarnabindu
    rakshobhya iti anamikabhyam namah nimisho'nimishah sragviti kanishthikabhyam namah rathangapani rakshobhya
    iti karatala karaprishthabhyam namah anganyasah suvratah sumukhah sukshma iti jnanaya hridayaya namah
    sahasramurtih vishvatma iti aishvaryaya shirase svaha sahasrarcih saptajihva iti shaktyai shikhayai
    vashat trisama samagassameti balaya kavacaya hum rathangapani rakshobhya iti netrabhyam vaushat shar
    ngadhanva gadadhara iti viryaya astrayaphat rituh sudarshanah kala iti digbhandhah dhyanam kshirodhanvatpradeshe
    shucimani rmanditangah | shubhrai rmukta piyusha varshaih anandi nah puniya || bhuh padau yasya nabhirviya
    dasura nilashcandra suryau ca netre karnavashah shirodyaurmukhamapi dahano yasya vasteyamabdhih |
    antahstham yasya vishvam sura narakhagagobhogi gandharvadaityaih citram ram ramyate tam tribhuvana
    vapusham vishnumisham namami || || om namo bhagavate vasudevaya shantakaram bhujagashayanam padmanabham
    suresham vishvadharam gaganasadrisham meghavarnam shubhangam | lakshmikantam kamalanayanam yogihriddhyanagamyam
    vande vishnum bhavabhayaharam sarvalokaikanatham || || meghashyamam pitakausheyavasam shrivatsankam
    kaustubhodbhasitangam | punyopetam pundarikayataksham vishnum vande sarvalokaikanatham || || namah
    samasta bhutanam adi bhutaya bhubhrite | anekarupa rupaya vishnave prabhavishnave || || sashankhacakram
    sakiritakundalam sapitavastram sarasiruhekshanam | sahara vakshahsthala shobhi kaustubham namami vishnum
    shirasa caturbhujam | || chayayam parijatasya hemasimhasanopari asinamambudashyamamayatakshamalankritam
    || || candrananam caturbahum shrivatsankita vakshasam rukmini satyabhamabhyam sahitam krishnamashraye
    || prithivyatmane gandham samarpayami ham akashatmane pushpaih pujayami yam vayvatmane dhupamaghrapayami
    ram agnyatmane dipam darshayami vam amritatmane naivedyam nivedayami sam sarvatmane sarvopacara puja
    namaskaran samarpayami stotram harih om vishvam vishnurvashatkaro bhutabhavyabhavatprabhuh | bhutakridbhutabhridbhavo
    bhutatma bhutabhavanah || || putatma paramatma ca muktanam paramagatih | avyayah purushah sakshi kshetrajno'kshara
    eva ca || || yogo yogavidam neta pradhana purusheshvarah | narasimhavapuh shriman keshavah purushottamah
    || || sarvah sharvah shivah sthanurbhutadirnidhiravyayah | sambhavo bhavano bharta prabhavah prabhurishvarah
    || || svayambhuh shambhuradityah pushkaraksho mahasvanah | anadinidhano dhata vidhata dhaturuttamah
    || || aprameyo hrishikeshah padmanabho'maraprabhuh | vishvakarma manustvashta sthavishthah sthaviro
    dhruvah || || agrahyah shashvato krishno lohitakshah pratardanah | prabhutastrikakubdhama pavitram
    mangalam param || || ishanah pranadah prano jyeshthah shreshthah prajapatih | hiranyagarbho bhugarbho
    madhavo madhusudanah || || ishvaro vikramidhanvi medhavi vikramah kramah | anuttamo duradharshah kritajnah
    kritiratmavan|| || sureshah sharanam sharma vishvaretah prajabhavah | ahassamvatsaro vyalah pratyayah
    sarvadarshanah || || ajassarveshvarah siddhah siddhih sarvadiracyutah | vrishakapirameyatma sarvayogavinissritah
    || || vasurvasumanah satyah samatma sammitassamah | amoghah pundarikaksho vrishakarma vrishakritih
    || || rudro bahushira babhrurvishvayonih shucishravah | amritah shashvatasthanurvararoho mahatapah
    || || sarvagah sarva vidbhanurvishvakseno janardanah | vedo vedavidavyango vedango vedavitkavih ||
    || lokadhyakshah suradhyaksho dharmadhyakshah kritakritah | caturatma caturvyuhashcaturdamshtrashcaturbhujah
    || || bhrajishnurbhojanam bhokta sahishnurjagadadijah | anagho vijayo jeta vishvayonih punarvasuh
    || || upendro vamanah pramshuramoghah shucirurjitah | atindrah sangrahah sargo dhritatma niyamo yamah
    || || vedyo vaidyah sadayogi viraha madhavo madhuh | atindriyo mahamayo mahotsaho mahabalah || ||
    mahabuddhirmahaviryo mahashaktirmahadyutih | anirdeshyavapuh shrimanameyatma mahadridhrik || || maheshvaso
    mahibharta shrinivasah satangatih | aniruddhah suranando govindo govidam patih || || maricirdamano
    hamsah suparno bhujagottamah | hiranyanabhah sutapah padmanabhah prajapatih || || amrityuh sarvadrik
    simhah sandhata sandhiman sthirah | ajo durmarshanah shasta vishrutatma surariha || || gururgurutamo
    dhama satyah satyaparakramah | nimisho'nimishah sragvi vacaspatirudaradhih || || agranigramanih shriman
    nyayo neta samiranah sahasramurdha vishvatma sahasrakshah sahasrapat || || avartano nivrittatma samvritah
    sampramardanah | ahah samvartako vahniranilo dharanidharah || || suprasadah prasannatma vishvadhrigvishvabhugvibhuh
    | satkarta satkritah sadhurjahnurnarayano narah || || asankhyeyo'prameyatma vishishtah shishtakricchucih
    | siddharthah siddhasankalpah siddhidah siddhi sadhanah || || vrishahi vrishabho vishnurvrishaparva
    vrishodarah | vardhano vardhamanashca viviktah shrutisagarah || || subhujo durdharo vagmi mahendro
    vasudo vasuh | naikarupo brihadrupah shipivishtah prakashanah || || ojastejodyutidharah prakashatma
    pratapanah | riddhah spashtaksharo mantrashcandramshurbhaskaradyutih || || amritamshudbhavo bhanuh
    shashabinduh sureshvarah | aushadham jagatah setuh satyadharmaparakramah || || bhutabhavyabhavannathah
    pavanah pavano'nalah | kamaha kamakritkantah kamah kamapradah prabhuh || || yugadi kridyugavarto naikamayo
    mahashanah | adrishyo vyaktarupashca sahasrajidanantajit || || ishto'vishishtah shishteshtah shikhandi
    nahusho vrishah | krodhaha krodhakritkarta vishvabahurmahidharah || || acyutah prathitah pranah pranado
    vasavanujah | apannidhiradhishthanamapramattah pratishthitah || || skandah skandadharo dhuryo varado
    vayuvahanah | vasudevo brihadbhanuradidevah purandharah || || ashokastaranastarah shurah shaurirjaneshvarah
    | anukulah shatavartah padmi padmanibhekshanah || || padmanabho'ravindakshah padmagarbhah sharirabhrit
    | mahardhirriddho vriddhatma mahaksho garudadhvajah || || atulah sharabho bhimah samayajno havirharih
    | sarvalakshanalakshanyo lakshmivan samitinjayah || || viksharo rohito margo heturdamodarah sahah
    | mahidharo mahabhago vegavanamitashanah || kshobhano devah shrigarbhah parameshvarah | karanam karanam
    karta vikarta gahano guhah || || vyavasayo vyavasthanah samsthanah sthanado dhruvah | parardhih paramaspashtah
    tushtah pushtah shubhekshanah || || ramo viramo virajo margoneyo nayo'nayah | virah shaktimatam shreshtho
    dharmodharma viduttamah || || vaikunthah purushah pranah pranadah pranavah prithuh | hiranyagarbhah
    shatrughno vyapto vayuradhokshajah || || rituh sudarshanah kalah parameshthi parigrahah | ugrah samvatsaro
    daksho vishramo vishvadakshinah || || vistarah sthavara sthanuh pramanam bijamavyayam | artho'nartho
    mahakosho mahabhogo mahadhanah || || anirvinnah sthavishtho bhurdharmayupo mahamakhah | nakshatranemirnakshatri
    kshamah || yajna ijyo mahejyashca kratuh satram satangatih | sarvadarshi vimuktatma sarvajno jnanamuttamam
    || || suvratah sumukhah sukshmah sughoshah sukhadah suhrit | manoharo jitakrodho vira bahurvidaranah
    || || svapanah svavasho vyapi naikatma naikakarmakrit| | vatsaro vatsalo vatsi ratnagarbho dhaneshvarah
    || || dharmagubdharmakriddharmi sadasatksharamaksharam|| avijnata sahasramshurvidhata kritalakshanah
    || || gabhastinemih sattvasthah simho bhuta maheshvarah | adidevo mahadevo devesho devabhridguruh
    || || uttaro gopatirgopta jnanagamyah puratanah | sharira bhutabhrid bhokta kapindro bhuridakshinah
    || || somapo'mritapah somah purujit purusattamah | vinayo jayah satyasandho dasharhah satvatam patih
    || || jivo vinayita sakshi mukundo'mita vikramah | ambhonidhiranantatma mahodadhi shayontakah || ||
    ajo maharhah svabhavyo jitamitrah pramodanah | anando'nandanonandah satyadharma trivikramah || ||
    maharshih kapilacaryah kritajno medinipatih | tripadastridashadhyaksho mahashringah kritantakrit ||
    || mahavaraho govindah sushenah kanakangadi | guhyo gabhiro gahano guptashcakra gadadharah || || vedhah
    svango'jitah krishno dridhah sankarshano'cyutah | varuno varuno vrikshah pushkaraksho mahamanah ||
    || bhagavan bhagaha''nandi vanamali halayudhah | adityo jyotiradityah sahishnurgatisattamah || ||
    sudhanva khandaparashurdaruno dravinapradah | divahsprik sarvadrigvyaso vacaspatirayonijah || || trisama
    samagah sama nirvanam bheshajam bhishak | sannyasakricchamah shanto nishtha shantih parayanam| ||
    shubhangah shantidah srashta kumudah kuvaleshayah | gohito gopatirgopta vrishabhaksho vrishapriyah
    || || anivarti nivrittatma sankshepta kshemakricchivah | shrivatsavakshah shrivasah shripatih shrimatamvarah
    || || shridah shrishah shrinivasah shrinidhih shrivibhavanah | shridharah shrikarah shreyah shrima~llokatrayashrayah
    || || svakshah svangah shatanando nandirjyotirganeshvarah | vijitatma'vidheyatma satkirtishcinnasamshayah
    || || udirnah sarvatashcakshuranishah shashvatasthirah | bhushayo bhushano bhutirvishokah shokanashanah
    || || arcishmanarcitah kumbho vishuddhatma vishodhanah | aniruddho'pratirathah pradyumno'mitavikramah
    || || kalaneminiha virah shaurih shurajaneshvarah | trilokatma trilokeshah keshavah keshiha harih
    || || kamadevah kamapalah kami kantah kritagamah | anirdeshyavapurvishnurviro'nanto dhananjayah ||
    || brahmanyo brahmakrid brahma brahma brahmavivardhanah | brahmavid brahmano brahmi brahmajno brahmanapriyah
    || || mahakramo mahakarma mahateja mahoragah | mahakraturmahayajva mahayajno mahahavih || || stavyah
    stavapriyah stotram stutih stota ranapriyah | purnah purayita punyah punyakirtiranamayah || || manojavastirthakaro
    vasureta vasupradah | vasuprado vasudevo vasurvasumana havih || || sadgatih satkritih satta sadbhutih
    satparayanah | shuraseno yadushreshthah sannivasah suyamunah || || bhutavaso vasudevah sarvasunilayo'nalah
    | darpaha darpado dripto durdharo'thaparajitah || || vishvamurtirmahamurtirdiptamurtiramurtiman |
    anekamurtiravyaktah shatamurtih shatananah || || eko naikah savah kah kim yattat padamanuttamam |
    lokabandhurlokanatho madhavo bhaktavatsalah || || suvarnavarno hemango varangashcandanangadi | viraha
    vishamah shunyo ghritashiracalashcalah || || amani manado manyo lokasvami trilokadhrit | sumedha medhajo
    dhanyah satyamedha dharadharah || || tejo'vrisho dyutidharah sarvashastrabhritamvarah | pragraho nigraho
    vyagro naikashringo gadagrajah || || caturmurti shcaturbahu shcaturvyuha shcaturgatih | caturatma
    caturbhavashcaturvedavidekapat || || samavarto'nivrittatma durjayo duratikramah | durlabho durgamo
    durgo duravaso durariha || || shubhango lokasarangah sutantustantuvardhanah | indrakarma mahakarma
    kritakarma kritagamah || || udbhavah sundarah sundo ratnanabhah sulocanah | arko vajasanah shringi
    jayantah sarvavijjayi || rakshobhyah sarvavagishvareshvarah | mahahrado mahagarto mahabhuto mahanidhih
    || || kumudah kundarah kundah parjanyah pavano'nilah | amritasho'mritavapuh sarvajnah sarvatomukhah
    || || sulabhah suvratah siddhah shatrujicchatrutapanah | nyagrodho'dumbaro'shvatthashcanurandhra nishudanah
    || || sahasrarcih saptajihvah saptaidhah saptavahanah | amurtiranagho'cintyo bhayakridbhayanashanah
    || || anurbrihatkrishah sthulo gunabhrinnirguno mahan | adhritah svadhritah svasyah pragvamsho vamshavardhanah
    || || bharabhrit kathito yogi yogishah sarvakamadah | ashramah shramanah kshamah suparno vayuvahanah
    || || dhanurdharo dhanurvedo dando damayita damah | aparajitah sarvasaho niyanta'niyamo'yamah || ||
    sattvavan sattvikah satyah satyadharmaparayanah | abhiprayah priyarho'rhah priyakrit pritivardhanah
    || || vihayasagatirjyotih surucirhutabhugvibhuh | ravirvirocanah suryah savita ravilocanah || || ananto
    hutabhugbhokta sukhado naikajo'grajah | anirvinnah sadamarshi lokadhishthanamadbhutah || || sanatsanatanatamah
    kapilah kapiravyayah | svastidah svastikritsvastih svastibhuk svastidakshinah || || araudrah kundali
    cakri vikramyurjitashasanah | shabdatigah shabdasahah shishirah sharvarikarah || || akrurah peshalo
    daksho dakshinah kshaminamvarah | vidvattamo vitabhayah punyashravanakirtanah || || uttarano dushkritiha
    punyo duhsvapnanashanah | viraha rakshanah santo jivanah paryavasthitah || || anantarupo'nanta shrirjitamanyurbhayapahah
    | caturashro gabhiratma vidisho vyadisho dishah || || anadirbhurbhuvo lakshmih suviro rucirangadah
    | janano janajanmadirbhimo bhimaparakramah || || adharanilayo'dhata pushpahasah prajagarah | urdhvagah
    satpathacarah pranadah pranavah panah || || pramanam prananilayah pranabhrit pranajivanah | tattvam
    tattvavidekatma janmamrityujaratigah || || bhurbhuvah svastarustarah savita prapitamahah | yajno yajnapatiryajva
    yajnango yajnavahanah || || yajnabhrid yajnakrid yajni yajnabhuk yajnasadhanah | yajnantakrid yajnaguhyamannamannada
    eva ca || || atmayonih svayanjato vaikhanah samagayanah | devakinandanah srashta kshitishah papanashanah
    || || shankhabhrinnandaki cakri shar ngadhanva gadadharah | rathangapani rakshobhyah sarvapraharanayudhah
    || || shri sarvapraharanayudha om nama iti | vanamali gadi shar ngi shankhi cakri ca nandaki | shrimannarayano
    vishnurvasudevo'bhirakshatu || || shri vasudevo'bhirakshatu om nama iti | uttara pithika phalashrutih
    itidam kirtaniyasya keshavasya mahatmanah | namnam sahasram divyanamasheshena prakirtitam| || || ya
    idam shrinuyannityam yashcapi parikirtayet|| nashubham prapnuyat kincitso'mutreha ca manavah || ||
    vedantago brahmanah syat kshatriyo vijayi bhavet | vaishyo dhanasamriddhah syat shudrah sukhamavapnuyat
    || || dharmarthi prapnuyaddharmamartharthi carthamapnuyat | kamanavapnuyat kami prajarthi capnuyatprajam
    || bhaktiman yah sadotthaya shucistadgatamanasah | sahasram vasudevasya namnametat prakirtayet ||
    || yashah prapnoti vipulam yatipradhanyameva ca | acalam shriyamapnoti shreyah prapnotyanuttamam|
    || || na bhayam kvacidapnoti viryam tejashca vindati | bhavatyarogo dyutiman balarupa gunanvitah ||
    || rogarto mucyate rogadbaddho mucyeta bandhanat | bhayanmucyeta bhitastu mucyetapanna apadah || ||
    durganyatitaratyashu purushah purushottamam | stuvannamasahasrena nityam bhaktisamanvitah || || vasudevashrayo
    martyo vasudevaparayanah | sarvapapavishuddhatma yati brahma sanatanam| || || na vasudeva bhaktanamashubham
    vidyate kvacit | janmamrityujaravyadhibhayam naivopajayate || || imam stavamadhiyanah shraddhabhaktisamanvitah
    | yujyetatma sukhakshanti shridhriti smriti kirtibhih || || na krodho na ca matsaryam na lobho nashubhamatih
    | bhavanti kritapunyanam bhaktanam purushottame || candrarka nakshatra kham disho bhurmahodadhih |
    vasudevasya viryena vidhritani mahatmanah || || sasurasuragandharvam sayakshoragarakshasam | jagadvashe
    vartatedam krishnasya sa caracaram| || || indriyani manobuddhih sattvam tejo balam dhritih | vasudevatmakanyahuh
    kshetram kshetrajna eva ca || || sarvagamanamacarah prathamam parikalpate | acaraprabhavo dharmo dharmasya
    prabhuracyutah || || rishayah pitaro deva mahabhutani dhatavah | jangamajangamam cedam jagannarayanodbhavam
    || || yogojnanam tatha sankhyam vidyah shilpadikarma ca | vedah shastrani vijnanametatsarvam janardanat
    || || eko vishnurmahadbhutam prithagbhutanyanekashah | trimlokanvyapya bhutatma bhunkte vishvabhugavyayah
    || || imam stavam bhagavato vishnorvyasena kirtitam | pathedya iccetpurushah shreyah praptum sukhani
    ca || || vishveshvaramajam devam jagatah prabhumavyayam| bhajanti ye pushkaraksham na te yanti parabhavam
    || || na te yanti parabhavam om nama iti | arjuna uvaca padmapatra vishalaksha padmanabha surottama
    | bhaktana manuraktanam trata bhava janardana || || shribhagavanuvaca yo mam namasahasrena stotumicchati
    pandava | so'hamekena shlokena stuta eva na samshayah || || stuta eva na samshaya om nama iti | vyasa
    uvaca vasanadvasudevasya vasitam bhuvanatrayam | sarvabhutanivaso'si vasudeva namo'stu te || || shrivasudeva
    namo'stu te om nama iti | parvatyuvaca kenopayena laghuna vishnornamasahasrakam | pathyate panditairnityam
    shrotumicchamyaham prabho || || ishvara uvaca shrirama rama rameti rame rame manorame | sahasranama
    tattulyam ramanama varanane || || shrirama nama varanana om nama iti | brahmovaca namo'stvanantaya
    sahasramurtaye sahasrapadakshishirorubahave | sahasranamne purushaya shashvate sahasrakoti yugadharine
    namah || || shri sahasrakoti yugadharine nama om nama iti | sanjaya uvaca yatra yogeshvarah krishno
    yatra partho dhanurdharah | tatra shrirvijayo bhutirdhruva nitirmatirmama || || shri bhagavan uvaca
    ananyashcintayanto mam ye janah paryupasate | tesham nityabhiyuktanam yogakshemam vahamyaham| || ||
    paritranaya sadhunam vinashaya ca dushkritam| | dharmasamsthapanarthaya sambhavami yuge yuge || ||
    artah vishannah shithilashca bhitah ghoreshu ca vyadhishu vartamanah | sankirtya narayanashabdamatram
    vimuktaduhkhah sukhino bhavanti || || kayena vaca manasendriyairva buddhyatmana va prakriteh svabhavat
    | karomi yadyatsakalam parasmai narayanayeti samarpayami || || yadakshara padabhrashtam matrahinam
    tu yadbhavet tatsarvam kshamyatam deva narayana namo'stu te | visarga bindu matrani padapadaksharani
    ca nyunani catiriktani kshamasva purushottama || iti shri mahabharate shatasahasrikayam samhitayam
    vaiyasikyamanushasana parvantargata anushasanika parvani mokshadharme bhishma yudhishthira samvade
    shri vishnordivya sahasranama stotram namaikona panca shatadhika shatatamodhyayah || shri vishnu sahasranama
    stotram samaptam || om tatsat sarvam shri krishnarpanamastu ||
  devanagari: ॐ शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥
    ॥ यस्यद्विरदवक्त्राद्याः पारिषद्याः परः शतम् । विघ्नं निघ्नन्ति सततं विष्वक्सेनं तमाश्रये ॥ ॥ पूर्व
    पीठिका व्यासं वसिष्ठ नप्तारं शक्तेः पौत्रमकल्मषम् । पराशरात्मजं वन्दे शुकतातं तपोनिधिम् ॥ ॥ व्यासाय
    विष्णु रूपाय व्यासरूपाय विष्णवे । नमो वै ब्रह्मनिधये वासिष्ठाय नमो नमः ॥ ॥ अविकाराय शुद्धाय नित्याय
    परमात्मने । सदैक रूप रूपाय विष्णवे सर्वजिष्णवे ॥ ॥ यस्य स्मरणमात्रेण जन्मसंसारबन्धनात् । विमुच्यते
    नमस्तस्मै विष्णवे प्रभविष्णवे ॥ ॥ ॐ नमो विष्णवे प्रभविष्णवे । श्री वैशम्पायन उवाच श्रुत्वा धर्मा नशेषेण
    पावनानि च सर्वशः । युधिष्ठिरः शान्तनवं पुनरेवाभ्य भाषत ॥ ॥ युधिष्ठिर उवाच किमेकं दैवतं लोके किं वाऽप्येकं
    परायणं स्तुवन्तः कं कमर्चन्तः प्राप्नुयुर्मानवाः शुभम् ॥ ॥ को धर्मः सर्वधर्माणां भवतः परमो मतः । किं
    जपन्मुच्यते जन्तुर्जन्मसंसार बन्धनात् ॥ ॥ श्री भीष्म उवाच जगत्प्रभुं देवदेव मनन्तं पुरुषोत्तमम् ।
    स्तुवन्नाम सहस्रेण पुरुषः सततोत्थितः ॥ ॥ तमेव चार्चयन्नित्यं भक्त्या पुरुषमव्ययम् । ध्यायन् स्तुवन्नमस्यंश्च
    यजमानस्तमेव च ॥ ॥ अनादि निधनं विष्णुं सर्वलोक महेश्वरम् । लोकाध्यक्षं स्तुवन्नित्यं सर्व दुःखातिगो
    भवेत् ॥ ॥ ब्रह्मण्यं सर्व धर्मज्ञं लोकानां कीर्ति वर्धनम् । लोकनाथं महद्भूतं सर्वभूत भवोद्भवम्॥ ॥
    एष मे सर्व धर्माणां धर्मोऽधिक तमोमतः । यद्भक्त्या पुण्डरीकाक्षं स्तवैरर्चेन्नरः सदा ॥ ॥ परमं यो महत्तेजः
    परमं यो महत्तपः । परमं यो महद्ब्रह्म परमं यः परायणम् ॥ ॥ पवित्राणां पवित्रं यो मङ्गलानां च मङ्गलम्
    । दैवतं देवतानां च भूतानां योऽव्ययः पिता ॥ ॥ यतः सर्वाणि भूतानि भवन्त्यादि युगागमे । यस्मिंश्च प्रलयं
    यान्ति पुनरेव युगक्षये ॥ ॥ तस्य लोक प्रधानस्य जगन्नाथस्य भूपते । विष्णोर्नाम सहस्रं मे शृणु पाप भयापहम्
    ॥ ॥ यानि नामानि गौणानि विख्यातानि महात्मनः । ऋषिभिः परिगीतानि तानि वक्ष्यामि भूतये ॥ ॥ ऋषिर्नाम्नां
    सहस्रस्य वेदव्यासो महामुनिः ॥ छन्दोऽनुष्टुप् तथा देवो भगवान् देवकीसुतः ॥ ॥ अमृतांशूद्भवो बीजं शक्तिर्देवकिनन्दनः
    । त्रिसामा हृदयं तस्य शान्त्यर्थे विनियुज्यते ॥ ॥ विष्णुं जिष्णुं महाविष्णुं प्रभविष्णुं महेश्वरम्
    ॥ अनेकरूप दैत्यान्तं नमामि पुरुषोत्तमम् ॥ ॥ पूर्वन्यासः अस्य श्री विष्णोर्दिव्य सहस्रनाम स्तोत्र महामन्त्रस्य
    ॥ श्री वेदव्यासो भगवान् ऋषिः । अनुष्टुप् छन्दः । श्रीमहाविष्णुः परमात्मा श्रीमन्नारायणो देवता । अमृतांशूद्भवो
    भानुरिति बीजम् । देवकीनन्दनः स्रष्टेति शक्तिः । उद्भवः क्षोभणो देव इति परमोमन्त्रः । शङ्खभृन्नन्दकी
    चक्रीति कीलकम् । शार् ङ्गधन्वा गदाधर इत्यस्त्रम् । रथाङ्गपाणि रक्षोभ्य इति नेत्रम् । त्रिसामासामगः
    सामेति कवचम् । आनन्दं परब्रह्मेति योनिः । ऋतुस्सुदर्शनः काल इति दिग्बन्धः ॥ श्रीविश्वरूप इति ध्यानम्
    । श्री महाविष्णु प्रीत्यर्थे सहस्रनाम जपे पारायणे विनियोगः । करन्यासः विश्वं विष्णुर्वषट्कार इत्यङ्गुष्ठाभ्यां
    नमः अमृतांशूद्भवो भानुरिति तर्जनीभ्यां नमः ब्रह्मण्यो ब्रह्मकृत् ब्रह्मेति मध्यमाभ्यां नमः सुवर्णबिन्दु
    रक्षोभ्य इति अनामिकाभ्यां नमः निमिषोऽनिमिषः स्रग्वीति कनिष्ठिकाभ्यां नमः रथाङ्गपाणि रक्षोभ्य इति करतल
    करपृष्ठाभ्यां नमः अङ्गन्यासः सुव्रतः सुमुखः सूक्ष्म इति ज्ञानाय हृदयाय नमः सहस्रमूर्तिः विश्वात्मा
    इति ऐश्वर्याय शिरसे स्वाहा सहस्रार्चिः सप्तजिह्व इति शक्त्यै शिखायै वषट् त्रिसामा सामगस्सामेति बलाय
    कवचाय हुं रथाङ्गपाणि रक्षोभ्य इति नेत्राभ्यां वौषट् शार् ङ्गधन्वा गदाधर इति वीर्याय अस्त्रायफट् ऋतुः
    सुदर्शनः काल इति दिग्भन्धः ध्यानम् क्षीरोधन्वत्प्रदेशे शुचिमणि र्मण्डिताङ्गः । शुभ्रै र्मुक्त पीयूष
    वर्षैः आनन्दी नः पुनीया ॥ भूः पादौ यस्य नाभिर्विय दसुर निलश्चन्द्र सूर्यौ च नेत्रे कर्णावाशाः शिरोद्यौर्मुखमपि
    दहनो यस्य वास्तेयमब्धिः । अन्तःस्थं यस्य विश्वं सुर नरखगगोभोगि गन्धर्वदैत्यैः चित्रं रं रम्यते तं
    त्रिभुवन वपुशं विष्णुमीशं नमामि ॥ ॥ ॐ नमो भगवते वासुदेवाय शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं विश्वाधारं
    गगनसदृशं मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिहृद्ध्यानगम्यम् वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्
    ॥ ॥ मेघश्यामं पीतकौशेयवासं श्रीवत्साङ्कं कौस्तुभोद्भासिताङ्गम् । पुण्योपेतं पुण्डरीकायताक्षं विष्णुं
    वन्दे सर्वलोकैकनाथम् ॥ ॥ नमः समस्त भूतानां आदि भूताय भूभृते । अनेकरूप रूपाय विष्णवे प्रभविष्णवे ॥
    ॥ सशङ्खचक्रं सकिरीटकुण्डलं सपीतवस्त्रं सरसीरुहेक्षणम् । सहार वक्षःस्थल शोभि कौस्तुभं नमामि विष्णुं
    शिरसा चतुर्भुजम् । ॥ छायायां पारिजातस्य हेमसिंहासनोपरि आसीनमम्बुदश्याममायताक्षमलङ्कृतम् ॥ ॥ चन्द्राननं
    चतुर्बाहुं श्रीवत्साङ्कित वक्षसम् रुक्मिणी सत्यभामाभ्यां सहितं कृष्णमाश्रये ॥ पृथिव्यात्मने गन्धं
    समर्पयामि हं आकाशात्मने पुष्पैः पूजयामि यं वाय्वात्मने धूपमाघ्रापयामि रं अग्न्यात्मने दीपं दर्शयामि
    वं अमृतात्मने नैवेद्यं निवेदयामि सं सर्वात्मने सर्वोपचार पूजा नमस्कारान् समर्पयामि स्तोत्रम् हरिः
    ओम् विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः । भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥ ॥ पूतात्मा
    परमात्मा च मुक्तानां परमागतिः । अव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥ ॥ योगो योगविदां नेता
    प्रधान पुरुषेश्वरः । नारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥ ॥ सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः
    । सम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥ ॥ स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः । अनादिनिधनो
    धाता विधाता धातुरुत्तमः ॥ ॥ अप्रमेयो हृषीकेशः पद्मनाभोऽमरप्रभुः । विश्वकर्मा मनुस्त्वष्टा स्थविष्ठः
    स्थविरो ध्रुवः ॥ ॥ अग्राह्यः शाश्वतो कृष्णो लोहिताक्षः प्रतर्दनः । प्रभूतस्त्रिककुब्धाम पवित्रं मङ्गलं
    परम् ॥ ॥ ईशानः प्राणदः प्राणो ज्येष्ठः श्रेष्ठः प्रजापतिः । हिरण्यगर्भो भूगर्भो माधवो मधुसूदनः ॥ ॥
    ईश्वरो विक्रमीधन्वी मेधावी विक्रमः क्रमः । अनुत्तमो दुराधर्षः कृतज्ञः कृतिरात्मवान्॥ ॥ सुरेशः शरणं
    शर्म विश्वरेताः प्रजाभवः । अहस्संवत्सरो व्यालः प्रत्ययः सर्वदर्शनः ॥ ॥ अजस्सर्वेश्वरः सिद्धः सिद्धिः
    सर्वादिरच्युतः । वृषाकपिरमेयात्मा सर्वयोगविनिस्सृतः ॥ ॥ वसुर्वसुमनाः सत्यः समात्मा सम्मितस्समः । अमोघः
    पुण्डरीकाक्षो वृषकर्मा वृषाकृतिः ॥ ॥ रुद्रो बहुशिरा बभ्रुर्विश्वयोनिः शुचिश्रवाः । अमृतः शाश्वतस्थाणुर्वरारोहो
    महातपाः ॥ ॥ सर्वगः सर्व विद्भानुर्विष्वक्सेनो जनार्दनः । वेदो वेदविदव्यङ्गो वेदाङ्गो वेदवित्कविः ॥
    ॥ लोकाध्यक्षः सुराध्यक्षो धर्माध्यक्षः कृताकृतः । चतुरात्मा चतुर्व्यूहश्चतुर्दंष्ट्रश्चतुर्भुजः ॥
    ॥ भ्राजिष्णुर्भोजनं भोक्ता सहिष्णुर्जगदादिजः । अनघो विजयो जेता विश्वयोनिः पुनर्वसुः ॥ ॥ उपेन्द्रो
    वामनः प्रांशुरमोघः शुचिरूर्जितः । अतीन्द्रः सङ्ग्रहः सर्गो धृतात्मा नियमो यमः ॥ ॥ वेद्यो वैद्यः सदायोगी
    वीरहा माधवो मधुः । अतीन्द्रियो महामायो महोत्साहो महाबलः ॥ ॥ महाबुद्धिर्महावीर्यो महाशक्तिर्महाद्युतिः
    । अनिर्देश्यवपुः श्रीमानमेयात्मा महाद्रिधृक् ॥ ॥ महेश्वासो महीभर्ता श्रीनिवासः सताङ्गतिः । अनिरुद्धः
    सुरानन्दो गोविन्दो गोविदां पतिः ॥ ॥ मरीचिर्दमनो हंसः सुपर्णो भुजगोत्तमः । हिरण्यनाभः सुतपाः पद्मनाभः
    प्रजापतिः ॥ ॥ अमृत्युः सर्वदृक् सिंहः सन्धाता सन्धिमान् स्थिरः । अजो दुर्मर्षणः शास्ता विश्रुतात्मा
    सुरारिहा ॥ ॥ गुरुर्गुरुतमो धाम सत्यः सत्यपराक्रमः । निमिषोऽनिमिषः स्रग्वी वाचस्पतिरुदारधीः ॥ ॥ अग्रणीग्रामणीः
    श्रीमान् न्यायो नेता समीरणः सहस्रमूर्धा विश्वात्मा सहस्राक्षः सहस्रपात् ॥ ॥ आवर्तनो निवृत्तात्मा संवृतः
    सम्प्रमर्दनः । अहः संवर्तको वह्निरनिलो धरणीधरः ॥ ॥ सुप्रसादः प्रसन्नात्मा विश्वधृग्विश्वभुग्विभुः
    । सत्कर्ता सत्कृतः साधुर्जह्नुर्नारायणो नरः ॥ ॥ असङ्ख्येयोऽप्रमेयात्मा विशिष्टः शिष्टकृच्छुचिः । सिद्धार्थः
    सिद्धसङ्कल्पः सिद्धिदः सिद्धि साधनः ॥ ॥ वृषाही वृषभो विष्णुर्वृषपर्वा वृषोदरः । वर्धनो वर्धमानश्च
    विविक्तः श्रुतिसागरः ॥ ॥ सुभुजो दुर्धरो वाग्मी महेन्द्रो वसुदो वसुः । नैकरूपो बृहद्रूपः शिपिविष्टः
    प्रकाशनः ॥ ॥ ओजस्तेजोद्युतिधरः प्रकाशात्मा प्रतापनः । ऋद्धः स्पष्टाक्षरो मन्त्रश्चन्द्रांशुर्भास्करद्युतिः
    ॥ ॥ अमृतांशूद्भवो भानुः शशबिन्दुः सुरेश्वरः । औषधं जगतः सेतुः सत्यधर्मपराक्रमः ॥ ॥ भूतभव्यभवन्नाथः
    पवनः पावनोऽनलः । कामहा कामकृत्कान्तः कामः कामप्रदः प्रभुः ॥ ॥ युगादि कृद्युगावर्तो नैकमायो महाशनः
    । अदृश्यो व्यक्तरूपश्च सहस्रजिदनन्तजित् ॥ ॥ इष्टोऽविशिष्टः शिष्टेष्टः शिखण्डी नहुषो वृषः । क्रोधहा
    क्रोधकृत्कर्ता विश्वबाहुर्महीधरः ॥ ॥ अच्युतः प्रथितः प्राणः प्राणदो वासवानुजः । अपान्निधिरधिष्ठानमप्रमत्तः
    प्रतिष्ठितः ॥ ॥ स्कन्दः स्कन्दधरो धुर्यो वरदो वायुवाहनः । वासुदेवो बृहद्भानुरादिदेवः पुरन्धरः ॥ ॥
    अशोकस्तारणस्तारः शूरः शौरिर्जनेश्वरः । अनुकूलः शतावर्तः पद्मी पद्मनिभेक्षणः ॥ ॥ पद्मनाभोऽरविन्दाक्षः
    पद्मगर्भः शरीरभृत् । महर्धिरृद्धो वृद्धात्मा महाक्षो गरुडध्वजः ॥ ॥ अतुलः शरभो भीमः समयज्ञो हविर्हरिः
    । सर्वलक्षणलक्षण्यो लक्ष्मीवान् समितिञ्जयः ॥ ॥ विक्षरो रोहितो मार्गो हेतुर्दामोदरः सहः । महीधरो महाभागो
    वेगवानमिताशनः ॥ क्षोभणो देवः श्रीगर्भः परमेश्वरः । करणं कारणं कर्ता विकर्ता गहनो गुहः ॥ ॥ व्यवसायो
    व्यवस्थानः संस्थानः स्थानदो ध्रुवः । परर्धिः परमस्पष्टः तुष्टः पुष्टः शुभेक्षणः ॥ ॥ रामो विरामो विरजो
    मार्गोनेयो नयोऽनयः । वीरः शक्तिमतां श्रेष्ठो धर्मोधर्म विदुत्तमः ॥ ॥ वैकुण्ठः पुरुषः प्राणः प्राणदः
    प्रणवः पृथुः । हिरण्यगर्भः शत्रुघ्नो व्याप्तो वायुरधोक्षजः ॥ ॥ ऋतुः सुदर्शनः कालः परमेष्ठी परिग्रहः
    । उग्रः संवत्सरो दक्षो विश्रामो विश्वदक्षिणः ॥ ॥ विस्तारः स्थावर स्थाणुः प्रमाणं बीजमव्ययम् । अर्थोऽनर्थो
    महाकोशो महाभोगो महाधनः ॥ ॥ अनिर्विण्णः स्थविष्ठो भूर्धर्मयूपो महामखः । नक्षत्रनेमिर्नक्षत्री क्षमः
    ॥ यज्ञ इज्यो महेज्यश्च क्रतुः सत्रं सताङ्गतिः । सर्वदर्शी विमुक्तात्मा सर्वज्ञो ज्ञानमुत्तमम् ॥ ॥
    सुव्रतः सुमुखः सूक्ष्मः सुघोषः सुखदः सुहृत् । मनोहरो जितक्रोधो वीर बाहुर्विदारणः ॥ ॥ स्वापनः स्ववशो
    व्यापी नैकात्मा नैककर्मकृत्। । वत्सरो वत्सलो वत्सी रत्नगर्भो धनेश्वरः ॥ ॥ धर्मगुब्धर्मकृद्धर्मी सदसत्क्षरमक्षरम्॥
    अविज्ञाता सहस्रांशुर्विधाता कृतलक्षणः ॥ ॥ गभस्तिनेमिः सत्त्वस्थः सिंहो भूत महेश्वरः । आदिदेवो महादेवो
    देवेशो देवभृद्गुरुः ॥ ॥ उत्तरो गोपतिर्गोप्ता ज्ञानगम्यः पुरातनः । शरीर भूतभृद् भोक्ता कपीन्द्रो भूरिदक्षिणः
    ॥ ॥ सोमपोऽमृतपः सोमः पुरुजित् पुरुसत्तमः । विनयो जयः सत्यसन्धो दाशार्हः सात्वतां पतिः ॥ ॥ जीवो विनयिता
    साक्षी मुकुन्दोऽमित विक्रमः । अम्भोनिधिरनन्तात्मा महोदधि शयोन्तकः ॥ ॥ अजो महार्हः स्वाभाव्यो जितामित्रः
    प्रमोदनः । आनन्दोऽनन्दनोनन्दः सत्यधर्मा त्रिविक्रमः ॥ ॥ महर्षिः कपिलाचार्यः कृतज्ञो मेदिनीपतिः । त्रिपदस्त्रिदशाध्यक्षो
    महाशृङ्गः कृतान्तकृत् ॥ ॥ महावराहो गोविन्दः सुषेणः कनकाङ्गदी । गुह्यो गभीरो गहनो गुप्तश्चक्र गदाधरः
    ॥ ॥ वेधाः स्वाङ्गोऽजितः कृष्णो दृढः सङ्कर्षणोऽच्युतः । वरुणो वारुणो वृक्षः पुष्कराक्षो महामनाः ॥ ॥
    भगवान् भगहाऽऽनन्दी वनमाली हलायुधः । आदित्यो ज्योतिरादित्यः सहिष्णुर्गतिसत्तमः ॥ ॥ सुधन्वा खण्डपरशुर्दारुणो
    द्रविणप्रदः । दिवःस्पृक् सर्वदृग्व्यासो वाचस्पतिरयोनिजः ॥ ॥ त्रिसामा सामगः साम निर्वाणं भेषजं भिषक्
    । सन्न्यासकृच्छमः शान्तो निष्ठा शान्तिः परायणम्। ॥ शुभाङ्गः शान्तिदः स्रष्टा कुमुदः कुवलेशयः । गोहितो
    गोपतिर्गोप्ता वृषभाक्षो वृषप्रियः ॥ ॥ अनिवर्ती निवृत्तात्मा सङ्क्षेप्ता क्षेमकृच्छिवः । श्रीवत्सवक्षाः
    श्रीवासः श्रीपतिः श्रीमतांवरः ॥ ॥ श्रीदः श्रीशः श्रीनिवासः श्रीनिधिः श्रीविभावनः । श्रीधरः श्रीकरः
    श्रेयः श्रीमाँल्लोकत्रयाश्रयः ॥ ॥ स्वक्षः स्वङ्गः शतानन्दो नन्दिर्ज्योतिर्गणेश्वरः । विजितात्माऽविधेयात्मा
    सत्कीर्तिश्चिन्नसंशयः ॥ ॥ उदीर्णः सर्वतश्चक्षुरनीशः शाश्वतस्थिरः । भूशयो भूषणो भूतिर्विशोकः शोकनाशनः
    ॥ ॥ अर्चिष्मानर्चितः कुम्भो विशुद्धात्मा विशोधनः । अनिरुद्धोऽप्रतिरथः प्रद्युम्नोऽमितविक्रमः ॥ ॥ कालनेमिनिहा
    वीरः शौरिः शूरजनेश्वरः । त्रिलोकात्मा त्रिलोकेशः केशवः केशिहा हरिः ॥ ॥ कामदेवः कामपालः कामी कान्तः
    कृतागमः । अनिर्देश्यवपुर्विष्णुर्वीरोऽनन्तो धनञ्जयः ॥ ॥ ब्रह्मण्यो ब्रह्मकृद् ब्रह्मा ब्रह्म ब्रह्मविवर्धनः
    । ब्रह्मविद् ब्राह्मणो ब्रह्मी ब्रह्मज्ञो ब्राह्मणप्रियः ॥ ॥ महाक्रमो महाकर्मा महातेजा महोरगः । महाक्रतुर्महायज्वा
    महायज्ञो महाहविः ॥ ॥ स्तव्यः स्तवप्रियः स्तोत्रं स्तुतिः स्तोता रणप्रियः । पूर्णः पूरयिता पुण्यः पुण्यकीर्तिरनामयः
    ॥ ॥ मनोजवस्तीर्थकरो वसुरेता वसुप्रदः । वसुप्रदो वासुदेवो वसुर्वसुमना हविः ॥ ॥ सद्गतिः सत्कृतिः सत्ता
    सद्भूतिः सत्परायणः । शूरसेनो यदुश्रेष्ठः सन्निवासः सुयामुनः ॥ ॥ भूतावासो वासुदेवः सर्वासुनिलयोऽनलः
    । दर्पहा दर्पदो दृप्तो दुर्धरोऽथापराजितः ॥ ॥ विश्वमूर्तिर्महामूर्तिर्दीप्तमूर्तिरमूर्तिमान् । अनेकमूर्तिरव्यक्तः
    शतमूर्तिः शताननः ॥ ॥ एको नैकः सवः कः किं यत्तत् पदमनुत्तमम् । लोकबन्धुर्लोकनाथो माधवो भक्तवत्सलः ॥
    ॥ सुवर्णवर्णो हेमाङ्गो वराङ्गश्चन्दनाङ्गदी । वीरहा विषमः शून्यो घृताशीरचलश्चलः ॥ ॥ अमानी मानदो मान्यो
    लोकस्वामी त्रिलोकधृत् । सुमेधा मेधजो धन्यः सत्यमेधा धराधरः ॥ ॥ तेजोऽवृषो द्युतिधरः सर्वशस्त्रभृतांवरः
    । प्रग्रहो निग्रहो व्यग्रो नैकशृङ्गो गदाग्रजः ॥ ॥ चतुर्मूर्ति श्चतुर्बाहु श्चतुर्व्यूह श्चतुर्गतिः
    । चतुरात्मा चतुर्भावश्चतुर्वेदविदेकपात् ॥ ॥ समावर्तोऽनिवृत्तात्मा दुर्जयो दुरतिक्रमः । दुर्लभो दुर्गमो
    दुर्गो दुरावासो दुरारिहा ॥ ॥ शुभाङ्गो लोकसारङ्गः सुतन्तुस्तन्तुवर्धनः । इन्द्रकर्मा महाकर्मा कृतकर्मा
    कृतागमः ॥ ॥ उद्भवः सुन्दरः सुन्दो रत्ननाभः सुलोचनः । अर्को वाजसनः शृङ्गी जयन्तः सर्वविज्जयी ॥ रक्षोभ्यः
    सर्ववागीश्वरेश्वरः । महाह्रदो महागर्तो महाभूतो महानिधिः ॥ ॥ कुमुदः कुन्दरः कुन्दः पर्जन्यः पावनोऽनिलः
    । अमृताशोऽमृतवपुः सर्वज्ञः सर्वतोमुखः ॥ ॥ सुलभः सुव्रतः सिद्धः शत्रुजिच्छत्रुतापनः । न्यग्रोधोऽदुम्बरोऽश्वत्थश्चाणूरान्ध्र
    निषूदनः ॥ ॥ सहस्रार्चिः सप्तजिह्वः सप्तैधाः सप्तवाहनः । अमूर्तिरनघोऽचिन्त्यो भयकृद्भयनाशनः ॥ ॥ अणुर्बृहत्कृशः
    स्थूलो गुणभृन्निर्गुणो महान् । अधृतः स्वधृतः स्वास्यः प्राग्वंशो वंशवर्धनः ॥ ॥ भारभृत् कथितो योगी
    योगीशः सर्वकामदः । आश्रमः श्रमणः क्षामः सुपर्णो वायुवाहनः ॥ ॥ धनुर्धरो धनुर्वेदो दण्डो दमयिता दमः
    । अपराजितः सर्वसहो नियन्ताऽनियमोऽयमः ॥ ॥ सत्त्ववान् सात्त्विकः सत्यः सत्यधर्मपरायणः । अभिप्रायः प्रियार्होऽर्हः
    प्रियकृत् प्रीतिवर्धनः ॥ ॥ विहायसगतिर्ज्योतिः सुरुचिर्हुतभुग्विभुः । रविर्विरोचनः सूर्यः सविता रविलोचनः
    ॥ ॥ अनन्तो हुतभुग्भोक्ता सुखदो नैकजोऽग्रजः । अनिर्विण्णः सदामर्षी लोकधिष्ठानमद्भुतः ॥ ॥ सनात्सनातनतमः
    कपिलः कपिरव्ययः । स्वस्तिदः स्वस्तिकृत्स्वस्तिः स्वस्तिभुक् स्वस्तिदक्षिणः ॥ ॥ अरौद्रः कुण्डली चक्री
    विक्रम्यूर्जितशासनः । शब्दातिगः शब्दसहः शिशिरः शर्वरीकरः ॥ ॥ अक्रूरः पेशलो दक्षो दक्षिणः क्षमिणांवरः
    । विद्वत्तमो वीतभयः पुण्यश्रवणकीर्तनः ॥ ॥ उत्तारणो दुष्कृतिहा पुण्यो दुःस्वप्ननाशनः । वीरहा रक्षणः
    सन्तो जीवनः पर्यवस्थितः ॥ ॥ अनन्तरूपोऽनन्त श्रीर्जितमन्युर्भयापहः । चतुरश्रो गभीरात्मा विदिशो व्यादिशो
    दिशः ॥ ॥ अनादिर्भूर्भुवो लक्ष्मीः सुवीरो रुचिराङ्गदः । जननो जनजन्मादिर्भीमो भीमपराक्रमः ॥ ॥ आधारनिलयोऽधाता
    पुष्पहासः प्रजागरः । ऊर्ध्वगः सत्पथाचारः प्राणदः प्रणवः पणः ॥ ॥ प्रमाणं प्राणनिलयः प्राणभृत् प्राणजीवनः
    । तत्त्वं तत्त्वविदेकात्मा जन्ममृत्युजरातिगः ॥ ॥ भूर्भुवः स्वस्तरुस्तारः सविता प्रपितामहः । यज्ञो
    यज्ञपतिर्यज्वा यज्ञाङ्गो यज्ञवाहनः ॥ ॥ यज्ञभृद् यज्ञकृद् यज्ञी यज्ञभुक् यज्ञसाधनः । यज्ञान्तकृद् यज्ञगुह्यमन्नमन्नाद
    एव च ॥ ॥ आत्मयोनिः स्वयञ्जातो वैखानः सामगायनः । देवकीनन्दनः स्रष्टा क्षितीशः पापनाशनः ॥ ॥ शङ्खभृन्नन्दकी
    चक्री शार् ङ्गधन्वा गदाधरः । रथाङ्गपाणि रक्षोभ्यः सर्वप्रहरणायुधः ॥ ॥ श्री सर्वप्रहरणायुध ॐ नम इति
    । वनमाली गदी शार् ङ्गी शङ्खी चक्री च नन्दकी । श्रीमान्नारायणो विष्णुर्वासुदेवोऽभिरक्षतु ॥ ॥ श्री वासुदेवोऽभिरक्षतु
    ॐ नम इति । उत्तर पीठिका फलश्रुतिः इतीदं कीर्तनीयस्य केशवस्य महात्मनः । नाम्नां सहस्रं दिव्यानामशेषेण
    प्रकीर्तितम्। ॥ ॥ य इदं शृणुयान्नित्यं यश्चापि परिकीर्तयेत्॥ नाशुभं प्राप्नुयात् किञ्चित्सोऽमुत्रेह
    च मानवः ॥ ॥ वेदान्तगो ब्राह्मणः स्यात् क्षत्रियो विजयी भवेत् । वैश्यो धनसमृद्धः स्यात् शूद्रः सुखमवाप्नुयात्
    ॥ ॥ धर्मार्थी प्राप्नुयाद्धर्ममर्थार्थी चार्थमाप्नुयात् । कामानवाप्नुयात् कामी प्रजार्थी चाप्नुयात्प्रजाम्
    ॥ भक्तिमान् यः सदोत्थाय शुचिस्तद्गतमानसः । सहस्रं वासुदेवस्य नाम्नामेतत् प्रकीर्तयेत् ॥ ॥ यशः प्राप्नोति
    विपुलं यातिप्राधान्यमेव च । अचलां श्रियमाप्नोति श्रेयः प्राप्नोत्यनुत्तमम्। ॥ ॥ न भयं क्वचिदाप्नोति
    वीर्यं तेजश्च विन्दति । भवत्यरोगो द्युतिमान् बलरूप गुणान्वितः ॥ ॥ रोगार्तो मुच्यते रोगाद्बद्धो मुच्येत
    बन्धनात् । भयान्मुच्येत भीतस्तु मुच्येतापन्न आपदः ॥ ॥ दुर्गाण्यतितरत्याशु पुरुषः पुरुषोत्तमम् । स्तुवन्नामसहस्रेण
    नित्यं भक्तिसमन्वितः ॥ ॥ वासुदेवाश्रयो मर्त्यो वासुदेवपरायणः । सर्वपापविशुद्धात्मा याति ब्रह्म सनातनम्।
    ॥ ॥ न वासुदेव भक्तानामशुभं विद्यते क्वचित् । जन्ममृत्युजराव्याधिभयं नैवोपजायते ॥ ॥ इमं स्तवमधीयानः
    श्रद्धाभक्तिसमन्वितः । युज्येतात्म सुखक्षान्ति श्रीधृति स्मृति कीर्तिभिः ॥ ॥ न क्रोधो न च मात्सर्यं
    न लोभो नाशुभामतिः । भवन्ति कृतपुण्यानां भक्तानां पुरुषोत्तमे ॥ चन्द्रार्क नक्षत्रा खं दिशो भूर्महोदधिः
    । वासुदेवस्य वीर्येण विधृतानि महात्मनः ॥ ॥ ससुरासुरगन्धर्वं सयक्षोरगराक्षसम् । जगद्वशे वर्ततेदं कृष्णस्य
    स चराचरम्। ॥ ॥ इन्द्रियाणि मनोबुद्धिः सत्त्वं तेजो बलं धृतिः । वासुदेवात्मकान्याहुः क्षेत्रं क्षेत्रज्ञ
    एव च ॥ ॥ सर्वागमानामाचारः प्रथमं परिकल्पते । आचारप्रभवो धर्मो धर्मस्य प्रभुरच्युतः ॥ ॥ ऋषयः पितरो
    देवा महाभूतानि धातवः । जङ्गमाजङ्गमं चेदं जगन्नारायणोद्भवम् ॥ ॥ योगोज्ञानं तथा साङ्ख्यं विद्याः शिल्पादिकर्म
    च । वेदाः शास्त्राणि विज्ञानमेतत्सर्वं जनार्दनात् ॥ ॥ एको विष्णुर्महद्भूतं पृथग्भूतान्यनेकशः । त्रींलोकान्व्याप्य
    भूतात्मा भुङ्क्ते विश्वभुगव्ययः ॥ ॥ इमं स्तवं भगवतो विष्णोर्व्यासेन कीर्तितम् । पठेद्य इच्चेत्पुरुषः
    श्रेयः प्राप्तुं सुखानि च ॥ ॥ विश्वेश्वरमजं देवं जगतः प्रभुमव्ययम्। भजन्ति ये पुष्कराक्षं न ते यान्ति
    पराभवम् ॥ ॥ न ते यान्ति पराभवं ॐ नम इति । अर्जुन उवाच पद्मपत्र विशालाक्ष पद्मनाभ सुरोत्तम । भक्ताना
    मनुरक्तानां त्राता भव जनार्दन ॥ ॥ श्रीभगवानुवाच यो मां नामसहस्रेण स्तोतुमिच्छति पाण्डव । सोऽहमेकेन
    श्लोकेन स्तुत एव न संशयः ॥ ॥ स्तुत एव न संशय ॐ नम इति । व्यास उवाच वासनाद्वासुदेवस्य वासितं भुवनत्रयम्
    । सर्वभूतनिवासोऽसि वासुदेव नमोऽस्तु ते ॥ ॥ श्रीवासुदेव नमोऽस्तु ते ॐ नम इति । पार्वत्युवाच केनोपायेन
    लघुना विष्णोर्नामसहस्रकम् । पठ्यते पण्डितैर्नित्यं श्रोतुमिच्छाम्यहं प्रभो ॥ ॥ ईश्वर उवाच श्रीराम
    राम रामेति रमे रामे मनोरमे । सहस्रनाम तत्तुल्यं रामनाम वरानने ॥ ॥ श्रीराम नाम वरानन ॐ नम इति । ब्रह्मोवाच
    नमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे । सहस्रनाम्ने पुरुषाय शाश्वते सहस्रकोटी युगधारिणे
    नमः ॥ ॥ श्री सहस्रकोटी युगधारिणे नम ॐ नम इति । सञ्जय उवाच यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः
    । तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम ॥ ॥ श्री भगवान् उवाच अनन्याश्चिन्तयन्तो मां ये जनाः
    पर्युपासते । तेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्। ॥ ॥ परित्राणाय साधूनां विनाशाय च दुष्कृताम्।
    । धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥ ॥ आर्ताः विषण्णाः शिथिलाश्च भीताः घोरेषु च व्याधिषु वर्तमानाः
    । सङ्कीर्त्य नारायणशब्दमात्रं विमुक्तदुःखाः सुखिनो भवन्ति ॥ ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना
    वा प्रकृतेः स्वभावात् । करोमि यद्यत्सकलं परस्मै नारायणायेति समर्पयामि ॥ ॥ यदक्षर पदभ्रष्टं मात्राहीनं
    तु यद्भवेत् तत्सर्वं क्षम्यतां देव नारायण नमोऽस्तु ते । विसर्ग बिन्दु मात्राणि पदपादाक्षराणि च न्यूनानि
    चातिरिक्तानि क्षमस्व पुरुषोत्तम ॥ इति श्री महाभारते शतसाहस्रिकायां संहितायां वैयासिक्यामनुशासन पर्वान्तर्गत
    आनुशासनिक पर्वणि मोक्षधर्मे भीष्म युधिष्ठिर संवादे श्री विष्णोर्दिव्य सहस्रनाम स्तोत्रं नामैकोन पञ्च
    शताधिक शततमोध्यायः ॥ श्री विष्णु सहस्रनाम स्तोत्रं समाप्तम् ॥ ॐ तत्सत् सर्वं श्री कृष्णार्पणमस्तु
    ॥
