id: pandurangashtakam
category: stotram
name:
  english: pandurangashtakam
  devanagari: पाण्डुरङ्गाष्टकम्
content:
  english: mahayogapithe tate bhimarathya varam pundarikaya datum munindraih | samagatya nishthantamanamdakamdam
    parabrahmalingam bhaje pandurangam || 1 || tatidvasasam nilameghavabhasam ramamamdiram sumdaram citprakasham
    | varam tvishtakayam samanyastapadam parabrahmalingam bhaje pandurangam || 2 || pramanam bhavabdheridam
    mamakanam nitambah karabhyam dhrito yena tasmat | vidhaturvasatyai dhrito nabhikoshah parabrahmalingam
    bhaje pandurangam || 3 || sphuratkaustubhalankritam kanthadeshe shriya jushtakeyurakam shrinivasam
    | shivam shamtamidyam varam lokapalam parabrahmalingam bhaje pandurangam || 4 || sharaccamdrabimbananam
    caruhasam lasatkundalakramtagandasthalamtam | japaragabimbadharam ka
  devanagari: महायोगपीठे तटे भीमरथ्या वरं पुण्डरीकाय दातुं मुनीन्द्रैः । समागत्य निष्ठन्तमानंदकंदं परब्रह्मलिङ्गं
    भजे पाण्डुरङ्गम् ॥ १ ॥ तटिद्वाससं नीलमेघावभासं रमामंदिरं सुंदरं चित्प्रकाशम् । वरं त्विष्टकायां समन्यस्तपादं
    परब्रह्मलिङ्गं भजे पाण्डुरङ्गम् ॥ २ ॥ प्रमाणं भवाब्धेरिदं मामकानां नितम्बः कराभ्यां धृतो येन तस्मात्
    । विधातुर्वसत्यै धृतो नाभिकोशः परब्रह्मलिङ्गं भजे पाण्डुरङ्गम् ॥ ३ ॥ स्फुरत्कौस्तुभालङ्कृतं कण्ठदेशे
    श्रिया जुष्टकेयूरकं श्रीनिवासम् । शिवं शांतमीड्यं वरं लोकपालं परब्रह्मलिङ्गं भजे पाण्डुरङ्गम् ॥ ४
    ॥ शरच्चंद्रबिंबाननं चारुहासं लसत्कुण्डलाक्रांतगण्डस्थलांतम् । जपारागबिंबाधरं क
