    सम नाना। खेलहहिं भालु कीस चौगाना ॥ जबहिं समर कोपहि रघुनायक। छुटिहहिं अति कराल बहु सायक ॥ तब कि चलिहि
    अस गाल तुम्हारा। अस बिचारि भजु राम उदारा ॥ सुनत बचन रावन परजरा। जरत महानल जनु घृत परा ॥ दो कुम्भकरन
    अस बन्धु मम सुत प्रसिद्ध सक्रारि। मोर पराक्रम नहिं सुनेहि जितेउँ चराचर झारि ॥ ॥ सठ साखामृग जोरि सहाई।
    बाँधा सिन्धु इहि प्रभुताई ॥ नाघहिं खग अनेक बारीसा। सूर न होहिं ते सुनु सब कीसा ॥ मम भुज सागर बल जल
    पूरा। जहँ बूड़ए बहु सुर नर सूरा ॥ बीस पयोधि अगाध अपारा। को अस बीर जो पाइहि पारा ॥ दिगपालन्ह मैं नीर
    भरावा। भूप सुजस खल मोहि सुनावा ॥ जौं पै समर सुभट तव नाथा। पुनि पुनि कहसि जासु गुन गाथा ॥ तौ बसीठ पठवत
    केहि काजा। रिपु सन प्रीति करत नहिं लाजा ॥ हरगिरि मथन निरखु मम बाहू। पुनि सठ कपि निज प्रभुहि सराहू
    ॥ दो सूर कवन रावन सरिस स्वकर काटि जेहिं सीस। हुने अनल अति हरष बहु बार साखि गौरीस ॥ ॥ जरत बिलोकेउँ
    जबहिं कपाला। बिधि के लिखे अङ्क निज भाला ॥ नर कें कर आपन बध बाँची। हसेउँ जानि बिधि गिरा असाँची ॥ सौ
    मन समुझि त्रास नहिं मोरें। लिखा बिरञ्चि जरठ मति भोरेम् ॥ आन बीर बल सठ मम आगें। पुनि पुनि कहसि लाज
    पति त्यागे ॥ कह अङ्गद सलज्ज जग माहीं। रावन तोहि समान कौ नाहीम् ॥ लाजवन्त तव सहज सुभ् । निज मुख निज
    गुन कहसि न क् ॥ सिर अरु सैल कथा चित रही। ताते बार बीस तैं कही ॥ सो भुजबल राखेउ उर घाली। जीतेहु सहसबाहु
    बलि बाली ॥ सुनु मतिमन्द देहि अब पूरा। काटें सीस कि होइअ सूरा ॥ इन्द्रजालि कहु कहिअ न बीरा। काटि निज
    कर सकल सरीरा ॥ दो जरहिं पतङ्ग मोह बस भार बहहिं खर बृन्द। ते नहिं सूर कहावहिं समुझि देखु मतिमन्द ॥
    ॥ अब जनि बतबढ़आव खल करही। सुनु मम बचन मान परिहरही ॥ दसमुख मैं न बसीठीं आयुँ। अस बिचारि रघुबीष पठायुँ
    ॥ बार बार अस कहि कृपाला। नहिं गजारि जसु बधें सृकाला ॥ मन महुँ समुझि बचन प्रभु केरे। सहेउँ कठोर बचन
    सठ तेरे ॥ नाहिं त करि मुख भञ्जन तोरा। लै जातेउँ सीतहि बरजोरा ॥ जानेउँ तव बल अधम सुरारी। सूनें हरि
    आनिहि परनारी ॥ तैं निसिचर पति गर्ब बहूता। मैं रघुपति सेवक कर दूता ॥ जौं न राम अपमानहि डरुँ। तोहि देखत
    अस कौतुक करूँ ॥ दो तोहि पटकि महि सेन हति चौपट करि तव गाउँ। तव जुबतिन्ह समेत सठ जनकसुतहि लै जाउँ ॥
    ॥ जौ अस करौं तदपि न बड़आई। मुएहि बधें नहिं कछु मनुसाई ॥ कौल कामबस कृपिन बिमूढ़आ। अति दरिद्र अजसी अति
    बूढ़आ ॥ सदा रोगबस सन्तत क्रोधी। बिष्नु बिमूख श्रुति सन्त बिरोधी ॥ तनु पोषक निन्दक अघ खानी। जीवन सव
    सम चौदह प्रानी ॥ अस बिचारि खल बधुँ न तोही। अब जनि रिस उपजावसि मोही ॥ सुनि सकोप कह निसिचर नाथा। अधर
    दसन दसि मीजत हाथा ॥ रे कपि अधम मरन अब चहसी। छोटे बदन बात बड़इ कहसी ॥ कटु जल्पसि जड़ कपि बल जाकें।
    बल प्रताप बुधि तेज न ताकेम् ॥ दो अगुन अमान जानि तेहि दीन्ह पिता बनबास। सो दुख अरु जुबती बिरह पुनि
    निसि दिन मम त्रास ॥ ॥ जिन्ह के बल कर गर्ब तोहि ऐसे मनुज अनेक। खाहीं निसाचर दिवस निसि मूढ़ समुझु तजि
    टेक ॥ ॥ जब तेहिं कीन्ह राम कै निन्दा। क्रोधवन्त अति भयु कपिन्दा ॥ हरि हर निन्दा सुनि जो काना। होइ
    पाप गोघात समाना ॥ कटकटान कपिकुञ्जर भारी। दुहु भुजदण्ड तमकि महि मारी ॥ डोलत धरनि सभासद खसे। चले भाजि
    भय मारुत ग्रसे ॥ गिरत सँभारि उठा दसकन्धर। भूतल परे मुकुट अति सुन्दर ॥ कछु तेहिं लै निज सिरन्हि सँवारे।
    कछु अङ्गद प्रभु पास पबारे ॥ आवत मुकुट देखि कपि भागे। दिनहीं लूक परन बिधि लागे ॥ की रावन करि कोप चलाए।
    कुलिस चारि आवत अति धाए ॥ कह प्रभु हँसि जनि हृदयँ डेराहू। लूक न असनि केतु नहिं राहू ॥ ए किरीट दसकन्धर
    केरे। आवत बालितनय के प्रेरे ॥ दो तरकि पवनसुत कर गहे आनि धरे प्रभु पास। कौतुक देखहिं भालु कपि दिनकर
    सरिस प्रकास ॥ ॥ उहाँ सकोऽपि दसानन सब सन कहत रिसाइ। धरहु कपिहि धरि मारहु सुनि अङ्गद मुसुकाइ ॥ ॥ एहि
    बिधि बेगि सूभट सब धावहु। खाहु भालु कपि जहँ जहँ पावहु ॥ मर्कटहीन करहु महि जाई। जिअत धरहु तापस द्वौ
    भाई ॥ पुनि सकोप बोलेउ जुबराजा। गाल बजावत तोहि न लाजा ॥ मरु गर काटि निलज कुलघाती। बल बिलोकि बिहरति
    नहिं छाती ॥ रे त्रिय चोर कुमारग गामी। खल मल रासि मन्दमति कामी ॥ सन्यपात जल्पसि दुर्बादा। भेसि कालबस
    खल मनुजादा ॥ याको फलु पावहिगो आगें। बानर भालु चपेटन्हि लागेम् ॥ रामु मनुज बोलत असि बानी। गिरहिं न
    तव रसना अभिमानी ॥ गिरिहहिं रसना संसय नाहीं। सिरन्हि समेत समर महि माहीम् ॥ सो सो नर क्यों दसकन्ध बालि
    बध्यो जेहिं एक सर। बीसहुँ लोचन अन्ध धिग तव जन्म कुजाति जड़ ॥ ॥ तब सोनित की प्यास तृषित राम सायक निकर।
    तजुँ तोहि तेहि त्रास कटु जल्पक निसिचर अधम ॥ ॥ मै तव दसन तोरिबे लायक। आयसु मोहि न दीन्ह रघुनायक ॥ असि
    रिस होति दसु मुख तोरौं। लङ्का गहि समुद्र महँ बोरौम् ॥ गूलरि फल समान तव लङ्का। बसहु मध्य तुम्ह जन्तु
    असङ्का ॥ मैं बानर फल खात न बारा। आयसु दीन्ह न राम उदारा ॥ जुगति सुनत रावन मुसुकाई। मूढ़ सिखिहि कहँ
    बहुत झुठाई ॥ बालि न कबहुँ गाल अस मारा। मिलि तपसिन्ह तैं भेसि लबारा ॥ साँचेहुँ मैं लबार भुज बीहा। जौं
    न उपारिउँ तव दस जीहा ॥ समुझि राम प्रताप कपि कोपा। सभा माझ पन करि पद रोपा ॥ जौं मम चरन सकसि सठ टारी।
    फिरहिं रामु सीता मैं हारी ॥ सुनहु सुभट सब कह दससीसा। पद गहि धरनि पछारहु कीसा ॥ इन्द्रजीत आदिक बलवाना।
    हरषि उठे जहँ तहँ भट नाना ॥ झपटहिं करि बल बिपुल उपाई। पद न टरि बैठहिं सिरु नाई ॥ पुनि उठि झपटहीं सुर
    आराती। टरि न कीस चरन एहि भाँती ॥ पुरुष कुजोगी जिमि उरगारी। मोह बिटप नहिं सकहिं उपारी ॥ दो कोटिन्ह
    मेघनाद सम सुभट उठे हरषाइ। झपटहिं टरै न कपि चरन पुनि बैठहिं सिर नाइ ॥ ॥ भूमि न छाँडत कपि चरन देखत रिपु
    मद भाग ॥ कोटि बिघ्न ते सन्त कर मन जिमि नीति न त्याग ॥ ॥ कपि बल देखि सकल हियँ हारे। उठा आपु कपि कें
    परचारे ॥ गहत चरन कह बालिकुमारा। मम पद गहें न तोर उबारा ॥ गहसि न राम चरन सठ जाई। सुनत फिरा मन अति सकुचाई
    ॥ भयु तेजहत श्री सब गी। मध्य दिवस जिमि ससि सोही ॥ सिङ्घासन बैठेउ सिर नाई। मानहुँ सम्पति सकल गँवाई
    ॥ जगदातमा प्रानपति रामा। तासु बिमुख किमि लह बिश्रामा ॥ उमा राम की भृकुटि बिलासा। होइ बिस्व पुनि पावि
    नासा ॥ तृन ते कुलिस कुलिस तृन करी। तासु दूत पन कहु किमि टरी ॥ पुनि कपि कही नीति बिधि नाना। मान न ताहि
    कालु निअराना ॥ रिपु मद मथि प्रभु सुजसु सुनायो। यह कहि चल्यो बालि नृप जायो ॥ हतौं न खेत खेलाइ खेलाई।
    तोहि अबहिं का करौं बड़आई ॥ प्रथमहिं तासु तनय कपि मारा। सो सुनि रावन भयु दुखारा ॥ जातुधान अङ्गद पन
    देखी। भय ब्याकुल सब भे बिसेषी ॥ दो रिपु बल धरषि हरषि कपि बालितनय बल पुञ्ज। पुलक सरीर नयन जल गहे राम
    पद कञ्ज ॥ ॥ साँझ जानि दसकन्धर भवन गयु बिलखाइ। मन्दोदरी रावनहि बहुरि कहा समुझाइ ॥ ॥ कन्त समुझि मन तजहु
    कुमतिही। सोह न समर तुम्हहि रघुपतिही ॥ रामानुज लघु रेख खचाई। सौ नहिं नाघेहु असि मनुसाई ॥ पिय तुम्ह
    ताहि जितब सङ्ग्रामा। जाके दूत केर यह कामा ॥ कौतुक सिन्धु नाघी तव लङ्का। आयु कपि केहरी असङ्का ॥ रखवारे
    हति बिपिन उजारा। देखत तोहि अच्छ तेहिं मारा ॥ जारि सकल पुर कीन्हेसि छारा। कहाँ रहा बल गर्ब तुम्हारा
    ॥ अब पति मृषा गाल जनि मारहु। मोर कहा कछु हृदयँ बिचारहु ॥ पति रघुपतिहि नृपति जनि मानहु। अग जग नाथ अतुल
    बल जानहु ॥ बान प्रताप जान मारीचा। तासु कहा नहिं मानेहि नीचा ॥ जनक सभाँ अगनित भूपाला। रहे तुम्हु बल
    अतुल बिसाला ॥ भञ्जि धनुष जानकी बिआही। तब सङ्ग्राम जितेहु किन ताही ॥ सुरपति सुत जानि बल थोरा। राखा
    जिअत आँखि गहि फोरा ॥ सूपनखा कै गति तुम्ह देखी। तदपि हृदयँ नहिं लाज बिषेषी ॥ दो बधि बिराध खर दूषनहि
    लीँलाँ हत्यो कबन्ध। बालि एक सर मारयो तेहि जानहु दसकन्ध ॥ ॥ जेहिं जलनाथ बँधायु हेला। उतरे प्रभु दल
    सहित सुबेला ॥ कारुनीक दिनकर कुल केतू। दूत पठायु तव हित हेतू ॥ सभा माझ जेहिं तव बल मथा। करि बरूथ महुँ
    मृगपति जथा ॥ अङ्गद हनुमत अनुचर जाके। रन बाँकुरे बीर अति बाँके ॥ तेहि कहँ पिय पुनि पुनि नर कहहू। मुधा
    मान ममता मद बहहू ॥ अहह कन्त कृत राम बिरोधा। काल बिबस मन उपज न बोधा ॥ काल दण्ड गहि काहु न मारा। हरि
    धर्म बल बुद्धि बिचारा ॥ निकट काल जेहि आवत साईं। तेहि भ्रम होइ तुम्हारिहि नाईम् ॥ दो दुइ सुत मरे दहेउ
    पुर अजहुँ पूर पिय देहु। कृपासिन्धु रघुनाथ भजि नाथ बिमल जसु लेहु ॥ ॥ नारि बचन सुनि बिसिख समाना। सभाँ
    गयु उठि होत बिहाना ॥ बैठ जाइ सिङ्घासन फूली। अति अभिमान त्रास सब भूली ॥ इहाँ राम अङ्गदहि बोलावा। आइ
    चरन पङ्कज सिरु नावा ॥ अति आदर सपीप बैठारी। बोले बिहँसि कृपाल खरारी ॥ बालितनय कौतुक अति मोही। तात सत्य
    कहु पूछुँ तोही ॥ । रावनु जातुधान कुल टीका। भुज बल अतुल जासु जग लीका ॥ तासु मुकुट तुम्ह चारि चलाए।
    कहहु तात कवनी बिधि पाए ॥ सुनु सर्बग्य प्रनत सुखकारी। मुकुट न होहिं भूप गुन चारी ॥ साम दान अरु दण्ड
    बिभेदा। नृप उर बसहिं नाथ कह बेदा ॥ नीति धर्म के चरन सुहाए। अस जियँ जानि नाथ पहिं आए ॥ दो धर्महीन प्रभु
    पद बिमुख काल बिबस दससीस। तेहि परिहरि गुन आए सुनहु कोसलाधीस ॥ ॥ परम चतुरता श्रवन सुनि बिहँसे रामु उदार।
    समाचार पुनि सब कहे गढ़ के बालिकुमार ॥ ॥ रिपु के समाचार जब पाए। राम सचिव सब निकट बोलाए ॥ लङ्का बाँके
    चारि दुआरा। केहि बिधि लागिअ करहु बिचारा ॥ तब कपीस रिच्छेस बिभीषन। सुमिरि हृदयँ दिनकर कुल भूषन ॥ करि
    बिचार तिन्ह मन्त्र दृढ़आवा। चारि अनी कपि कटकु बनावा ॥ जथाजोग सेनापति कीन्हे। जूथप सकल बोलि तब लीन्हे
    ॥ प्रभु प्रताप कहि सब समुझाए। सुनि कपि सिङ्घनाद करि धाए ॥ हरषित राम चरन सिर नावहिं। गहि गिरि सिखर
    बीर सब धावहिम् ॥ गर्जहिं तर्जहिं भालु कपीसा। जय रघुबीर कोसलाधीसा ॥ जानत परम दुर्ग अति लङ्का। प्रभु
    प्रताप कपि चले असङ्का ॥ घटाटोप करि चहुँ दिसि घेरी। मुखहिं निसान बजावहीं भेरी ॥ दो जयति राम जय लछिमन
    जय कपीस सुग्रीव। गर्जहिं सिङ्घनाद कपि भालु महा बल सींव ॥ ॥ लङ्काँ भयु कोलाहल भारी। सुना दसानन अति
    अहँकारी ॥ देखहु बनरन्ह केरि ढिठाई। बिहँसि निसाचर सेन बोलाई ॥ आए कीस काल के प्रेरे। छुधावन्त सब निसिचर
    मेरे ॥ अस कहि अट्टहास सठ कीन्हा। गृह बैठे अहार बिधि दीन्हा ॥ सुभट सकल चारिहुँ दिसि जाहू। धरि धरि भालु
    कीस सब खाहू ॥ उमा रावनहि अस अभिमाना। जिमि टिट्टिभ खग सूत उताना ॥ चले निसाचर आयसु मागी। गहि कर भिण्डिपाल
    बर साँगी ॥ तोमर मुग्दर परसु प्रचण्डा। सुल कृपान परिघ गिरिखण्डा ॥ जिमि अरुनोपल निकर निहारी। धावहिं
    सठ खग मांस अहारी ॥ चोञ्च भङ्ग दुख तिन्हहि न सूझा। तिमि धाए मनुजाद अबूझा ॥ दो नानायुध सर चाप धर जातुधान
    बल बीर। कोट कँगूरन्हि चढ़इ गे कोटि कोटि रनधीर ॥ ॥ कोट कँगूरन्हि सोहहिं कैसे। मेरु के सृङ्गनि जनु घन
    बैसे ॥ बाजहिं ढोल निसान जुझ् । सुनि धुनि होइ भटन्हि मन च् ॥ बाजहिं भेरि नफीरि अपारा। सुनि कादर उर
    जाहिं दरारा ॥ देखिन्ह जाइ कपिन्ह के ठट्टा। अति बिसाल तनु भालु सुभट्टा ॥ धावहिं गनहिं न अवघट घाटा।
    पर्बत फोरि करहिं गहि बाटा ॥ कटकटाहिं कोटिन्ह भट गर्जहिं। दसन ओठ काटहिं अति तर्जहिम् ॥ उत रावन इत राम
    दोहाई। जयति जयति जय परी लराई ॥ निसिचर सिखर समूह ढहावहिं। कूदि धरहिं कपि फेरि चलावहिम् ॥ दो धरि कुधर
    खण्ड प्रचण्ड कर्कट भालु गढ़ पर डारहीं। झपटहिं चरन गहि पटकि महि भजि चलत बहुरि पचारहीम् ॥ अति तरल तरुन
    प्रताप तरपहिं तमकि गढ़ चढ़इ चढ़इ गे। कपि भालु चढ़इ मन्दिरन्ह जहँ तहँ राम जसु गावत भे ॥ दो एकु एकु
    निसिचर गहि पुनि कपि चले पराइ। ऊपर आपु हेठ भट गिरहिं धरनि पर आइ ॥ ॥ राम प्रताप प्रबल कपिजूथा। मर्दहिं
    निसिचर सुभट बरूथा ॥ चढ़ए दुर्ग पुनि जहँ तहँ बानर। जय रघुबीर प्रताप दिवाकर ॥ चले निसाचर निकर पराई।
    प्रबल पवन जिमि घन समुदाई ॥ हाहाकार भयु पुर भारी। रोवहिं बालक आतुर नारी ॥ सब मिलि देहिं रावनहि गारी।
    राज करत एहिं मृत्यु हँकारी ॥ निज दल बिचल सुनी तेहिं काना। फेरि सुभट लङ्केस रिसाना ॥ जो रन बिमुख सुना
    मैं काना। सो मैं हतब कराल कृपाना ॥ सर्बसु खाइ भोग करि नाना। समर भूमि भे बल्लभ प्राना ॥ उग्र बचन सुनि
    सकल डेराने। चले क्रोध करि सुभट लजाने ॥ सन्मुख मरन बीर कै सोभा। तब तिन्ह तजा प्रान कर लोभा ॥ दो बहु
    आयुध धर सुभट सब भिरहिं पचारि पचारि। ब्याकुल किए भालु कपि परिघ त्रिसूलन्हि मारी ॥ ॥ भय आतुर कपि भागन
    लागे। जद्यपि उमा जीतिहहिं आगे ॥ कौ कह कहँ अङ्गद हनुमन्ता। कहँ नल नील दुबिद बलवन्ता ॥ निज दल बिकल सुना
    हनुमाना। पच्छिम द्वार रहा बलवाना ॥ मेघनाद तहँ करि लराई। टूट न द्वार परम कठिनाई ॥ पवनतनय मन भा अति
    क्रोधा। गर्जेउ प्रबल काल सम जोधा ॥ कूदि लङ्क गढ़ ऊपर आवा। गहि गिरि मेघनाद कहुँ धावा ॥ भञ्जेउ रथ सारथी
    निपाता। ताहि हृदय महुँ मारेसि लाता ॥ दुसरें सूत बिकल तेहि जाना। स्यन्दन घालि तुरत गृह आना ॥ दो अङ्गद
    सुना पवनसुत गढ़ पर गयु अकेल। रन बाँकुरा बालिसुत तरकि चढ़एउ कपि खेल ॥ ॥ जुद्ध बिरुद्ध क्रुद्ध द्वौ
    बन्दर। राम प्रताप सुमिरि उर अन्तर ॥ रावन भवन चढ़ए द्वौ धाई। करहि कोसलाधीस दोहाई ॥ कलस सहित गहि भवनु
    ढहावा। देखि निसाचरपति भय पावा ॥ नारि बृन्द कर पीटहिं छाती। अब दुइ कपि आए उतपाती ॥ कपिलीला करि तिन्हहि
    डेरावहिं। रामचन्द्र कर सुजसु सुनावहिम् ॥ पुनि कर गहि कञ्चन के खम्भा। कहेन्हि करिअ उतपात अरम्भा ॥ गर्जि
    परे रिपु कटक मझारी। लागे मर्दै भुज बल भारी ॥ काहुहि लात चपेटन्हि केहू। भजहु न रामहि सो फल लेहू ॥ दो
    एक एक सों मर्दहिं तोरि चलावहिं मुण्ड। रावन आगें परहिं ते जनु फूटहिं दधि कुण्ड ॥ ॥ महा महा मुखिआ जे
    पावहिं। ते पद गहि प्रभु पास चलावहिम् ॥ कहि बिभीषनु तिन्ह के नामा। देहिं राम तिन्हहू निज धामा ॥ खल
    मनुजाद द्विजामिष भोगी। पावहिं गति जो जाचत जोगी ॥ उमा राम मृदुचित करुनाकर। बयर भाव सुमिरत मोहि निसिचर
    ॥ देहिं परम गति सो जियँ जानी। अस कृपाल को कहहु भवानी ॥ अस प्रभु सुनि न भजहिं भ्रम त्यागी। नर मतिमन्द
    ते परम अभागी ॥ अङ्गद अरु हनुमन्त प्रबेसा। कीन्ह दुर्ग अस कह अवधेसा ॥ लङ्काँ द्वौ कपि सोहहिं कैसें।
    मथहि सिन्धु दुइ मन्दर जैसेम् ॥ दो भुज बल रिपु दल दलमलि देखि दिवस कर अन्त। कूदे जुगल बिगत श्रम आए जहँ
    भगवन्त ॥ ॥ प्रभु पद कमल सीस तिन्ह नाए। देखि सुभट रघुपति मन भाए ॥ राम कृपा करि जुगल निहारे। भे बिगतश्रम
    परम सुखारे ॥ गे जानि अङ्गद हनुमाना। फिरे भालु मर्कट भट नाना ॥ जातुधान प्रदोष बल पाई। धाए करि दससीस
    दोहाई ॥ निसिचर अनी देखि कपि फिरे। जहँ तहँ कटकटाइ भट भिरे ॥ द्वौ दल प्रबल पचारि पचारी। लरत सुभट नहिं
    मानहिं हारी ॥ महाबीर निसिचर सब कारे। नाना बरन बलीमुख भारे ॥ सबल जुगल दल समबल जोधा। कौतुक करत लरत करि
    क्रोधा ॥ प्राबिट सरद पयोद घनेरे। लरत मनहुँ मारुत के प्रेरे ॥ अनिप अकम्पन अरु अतिकाया। बिचलत सेन कीन्हि
    इन्ह माया ॥ भयु निमिष महँ अति अँधियारा। बृष्टि होइ रुधिरोपल छारा ॥ दो देखि निबिड़ तम दसहुँ दिसि कपिदल
    भयु खभार। एकहि एक न देखी जहँ तहँ करहिं पुकार ॥ ॥ सकल मरमु रघुनायक जाना। लिए बोलि अङ्गद हनुमाना ॥ समाचार
    सब कहि समुझाए। सुनत कोऽपि कपिकुञ्जर धाए ॥ पुनि कृपाल हँसि चाप चढ़आवा। पावक सायक सपदि चलावा ॥ भयु प्रकास
    कतहुँ तम नाहीं। ग्यान उदयँ जिमि संसय जाहीम् ॥ भालु बलीमुख पाइ प्रकासा। धाए हरष बिगत श्रम त्रासा ॥
    हनूमान अङ्गद रन गाजे। हाँक सुनत रजनीचर भाजे ॥ भागत पट पटकहिं धरि धरनी। करहिं भालु कपि अद्भुत करनी
    ॥ गहि पद डारहिं सागर माहीं। मकर उरग झष धरि धरि खाहीम् ॥ दो कछु मारे कछु घायल कछु गढ़ चढ़ए पराइ। गर्जहिं
    भालु बलीमुख रिपु दल बल बिचलाइ ॥ ॥ निसा जानि कपि चारिउ अनी। आए जहाँ कोसला धनी ॥ राम कृपा करि चितवा
    सबही। भे बिगतश्रम बानर तबही ॥ उहाँ दसानन सचिव हँकारे। सब सन कहेसि सुभट जे मारे ॥ आधा कटकु कपिन्ह सङ्घारा।
    कहहु बेगि का करिअ बिचारा ॥ माल्यवन्त अति जरठ निसाचर। रावन मातु पिता मन्त्री बर ॥ बोला बचन नीति अति
    पावन। सुनहु तात कछु मोर सिखावन ॥ जब ते तुम्ह सीता हरि आनी। असगुन होहिं न जाहिं बखानी ॥ बेद पुरान जासु
    जसु गायो। राम बिमुख काहुँ न सुख पायो ॥ दो हिरन्याच्छ भ्राता सहित मधु कैटभ बलवान। जेहि मारे सोइ अवतरेउ
    कृपासिन्धु भगवान ॥ पचीसवाँ विश्राम कालरूप खल बन दहन गुनागार घनबोध। सिव बिरञ्चि जेहि सेवहिं तासों कवन
    बिरोध ॥ ॥ परिहरि बयरु देहु बैदेही। भजहु कृपानिधि परम सनेही ॥ ताके बचन बान सम लागे। करिआ मुह करि जाहि
    अभागे ॥ बूढ़ भेसि न त मरतेउँ तोही। अब जनि नयन देखावसि मोही ॥ तेहि अपने मन अस अनुमाना। बध्यो चहत एहि
    कृपानिधाना ॥ सो उठि गयु कहत दुर्बादा। तब सकोप बोलेउ घननादा ॥ कौतुक प्रात देखिअहु मोरा। करिहुँ बहुत
    कहौं का थोरा ॥ सुनि सुत बचन भरोसा आवा। प्रीति समेत अङ्क बैठावा ॥ करत बिचार भयु भिनुसारा। लागे कपि
    पुनि चहूँ दुआरा ॥ कोऽपि कपिन्ह दुर्घट गढ़उ घेरा। नगर कोलाहलु भयु घनेरा ॥ बिबिधायुध धर निसिचर धाए।
    गढ़ ते पर्बत सिखर ढहाए ॥ छं ढाहे महीधर सिखर कोटिन्ह बिबिध बिधि गोला चले। घहरात जिमि पबिपात गर्जत जनु
    प्रलय के बादले ॥ मर्कट बिकट भट जुटत कटत न लटत तन जर्जर भे। गहि सैल तेहि गढ़ पर चलावहिं जहँ सो तहँ
    निसिचर हे ॥ दो मेघनाद सुनि श्रवन अस गढ़उ पुनि छेङ्का आइ। उतर्यो बीर दुर्ग तें सन्मुख चल्यो बजाइ ॥
    ॥ कहँ कोसलाधीस द्वौ भ्राता। धन्वी सकल लोक बिख्याता ॥ कहँ नल नील दुबिद सुग्रीवा। अङ्गद हनूमन्त बल सींवा
    ॥ कहाँ बिभीषनु भ्राताद्रोही। आजु सबहि हठि मारुँ ओही ॥ अस कहि कठिन बान सन्धाने। अतिसय क्रोध श्रवन लगि
    ताने ॥ सर समुह सो छाड़ऐ लागा। जनु सपच्छ धावहिं बहु नागा ॥ जहँ तहँ परत देखिअहिं बानर। सन्मुख होइ न
    सके तेहि अवसर ॥ जहँ तहँ भागि चले कपि रीछा। बिसरी सबहि जुद्ध कै ईछा ॥ सो कपि भालु न रन महँ देखा। कीन्हेसि
    जेहि न प्रान अवसेषा ॥ दो दस दस सर सब मारेसि परे भूमि कपि बीर। सिंहनाद करि गर्जा मेघनाद बल धीर ॥ ॥
    देखि पवनसुत कटक बिहाला। क्रोधवन्त जनु धायु काला ॥ महासैल एक तुरत उपारा। अति रिस मेघनाद पर डारा ॥ आवत
    देखि गयु नभ सोई। रथ सारथी तुरग सब खोई ॥ बार बार पचार हनुमाना। निकट न आव मरमु सो जाना ॥ रघुपति निकट
    गयु घननादा। नाना भाँति करेसि दुर्बादा ॥ अस्त्र सस्त्र आयुध सब डारे। कौतुकहीं प्रभु काटि निवारे ॥ देखि
    प्रताप मूढ़ खिसिआना। करै लाग माया बिधि नाना ॥ जिमि कौ करै गरुड़ सैं खेला। डरपावै गहि स्वल्प सपेला
    ॥ दो जासु प्रबल माया बल सिव बिरञ्चि बड़ छोट। ताहि दिखावि निसिचर निज माया मति खोट ॥ ॥ नभ चढ़इ बरष बिपुल
    अङ्गारा। महि ते प्रगट होहिं जलधारा ॥ नाना भाँति पिसाच पिसाची। मारु काटु धुनि बोलहिं नाची ॥ बिष्टा
    पूय रुधिर कच हाड़आ। बरषि कबहुँ उपल बहु छाड़आ ॥ बरषि धूरि कीन्हेसि अँधिआरा। सूझ न आपन हाथ पसारा ॥ कपि
    अकुलाने माया देखें। सब कर मरन बना एहि लेखेम् ॥ कौतुक देखि राम मुसुकाने। भे सभीत सकल कपि जाने ॥ एक
    बान काटी सब माया। जिमि दिनकर हर तिमिर निकाया ॥ कृपादृष्टि कपि भालु बिलोके। भे प्रबल रन रहहिं न रोके
    ॥ दो आयसु मागि राम पहिं अङ्गदादि कपि साथ। लछिमन चले क्रुद्ध होइ बान सरासन हाथ ॥ ॥ छतज नयन उर बाहु
    बिसाला। हिमगिरि निभ तनु कछु एक लाला ॥ इहाँ दसानन सुभट पठाए। नाना अस्त्र सस्त्र गहि धाए ॥ भूधर नख बिटपायुध
    धारी। धाए कपि जय राम पुकारी ॥ भिरे सकल जोरिहि सन जोरी। इत उत जय इच्छा नहिं थोरी ॥ मुठिकन्ह लातन्ह
    दातन्ह काटहिं। कपि जयसील मारि पुनि डाटहिम् ॥ मारु मारु धरु धरु धरु मारू। सीस तोरि गहि भुजा उपारू ॥
    असि रव पूरि रही नव खण्डा। धावहिं जहँ तहँ रुण्ड प्रचण्डा ॥ देखहिं कौतुक नभ सुर बृन्दा। कबहुँक बिसमय
    कबहुँ अनन्दा ॥ दो रुधिर गाड़ भरि भरि जम्यो ऊपर धूरि उड़आइ। जनु अँगार रासिन्ह पर मृतक धूम रह्यो छाइ
    ॥ ॥ घायल बीर बिराजहिं कैसे। कुसुमित किंसुक के तरु जैसे ॥ लछिमन मेघनाद द्वौ जोधा। भिरहिं परसपर करि
    अति क्रोधा ॥ एकहि एक सकि नहिं जीती। निसिचर छल बल करि अनीती ॥ क्रोधवन्त तब भयु अनन्ता। भञ्जेउ रथ सारथी
    तुरन्ता ॥ नाना बिधि प्रहार कर सेषा। राच्छस भयु प्रान अवसेषा ॥ रावन सुत निज मन अनुमाना। सङ्कठ भयु हरिहि
    मम प्राना ॥ बीरघातिनी छाड़इसि साँगी। तेज पुञ्ज लछिमन उर लागी ॥ मुरुछा भी सक्ति के लागें। तब चलि गयु
    निकट भय त्यागेम् ॥ दो मेघनाद सम कोटि सत जोधा रहे उठाइ। जगदाधार सेष किमि उठै चले खिसिआइ ॥ ॥ सुनु गिरिजा
    क्रोधानल जासू। जारि भुवन चारिदस आसू ॥ सक सङ्ग्राम जीति को ताही। सेवहिं सुर नर अग जग जाही ॥ यह कौतूहल
    जानि सोई। जा पर कृपा राम कै होई ॥ सन्ध्या भि फिरि द्वौ बाहनी। लगे सँभारन निज निज अनी ॥ ब्यापक ब्रह्म
    अजित भुवनेस्वर। लछिमन कहाँ बूझ करुनाकर ॥ तब लगि लै आयु हनुमाना। अनुज देखि प्रभु अति दुख माना ॥ जामवन्त
    कह बैद सुषेना। लङ्काँ रहि को पठी लेना ॥ धरि लघु रूप गयु हनुमन्ता। आनेउ भवन समेत तुरन्ता ॥ दो राम पदारबिन्द
    सिर नायु आइ सुषेन। कहा नाम गिरि औषधी जाहु पवनसुत लेन ॥ ॥ राम चरन सरसिज उर राखी। चला प्रभञ्जन सुत बल
    भाषी ॥ उहाँ दूत एक मरमु जनावा। रावन कालनेमि गृह आवा ॥ दसमुख कहा मरमु तेहिं सुना। पुनि पुनि कालनेमि
    सिरु धुना ॥ देखत तुम्हहि नगरु जेहिं जारा। तासु पन्थ को रोकन पारा ॥ भजि रघुपति करु हित आपना। छाँड़हु
    नाथ मृषा जल्पना ॥ नील कञ्ज तनु सुन्दर स्यामा। हृदयँ राखु लोचनाभिरामा ॥ मैं तैं मोर मूढ़ता त्यागू।
    महा मोह निसि सूतत जागू ॥ काल ब्याल कर भच्छक जोई। सपनेहुँ समर कि जीतिअ सोई ॥ दो सुनि दसकण्ठ रिसान अति
    तेहिं मन कीन्ह बिचार। राम दूत कर मरौं बरु यह खल रत मल भार ॥ ॥ अस कहि चला रचिसि मग माया। सर मन्दिर
    बर बाग बनाया ॥ मारुतसुत देखा सुभ आश्रम। मुनिहि बूझि जल पियौं जाइ श्रम ॥ राच्छस कपट बेष तहँ सोहा। मायापति
    दूतहि चह मोहा ॥ जाइ पवनसुत नायु माथा। लाग सो कहै राम गुन गाथा ॥ होत महा रन रावन रामहिं। जितहहिं राम
    न संसय या महिम् ॥ इहाँ भेँ मैं देखेउँ भाई। ग्यान दृष्टि बल मोहि अधिकाई ॥ मागा जल तेहिं दीन्ह कमण्डल।
    कह कपि नहिं अघाउँ थोरें जल ॥ सर मज्जन करि आतुर आवहु। दिच्छा देउँ ग्यान जेहिं पावहु ॥ दो सर पैठत कपि
    पद गहा मकरीं तब अकुलान। मारी सो धरि दिव्य तनु चली गगन चढ़इ जान ॥ ॥ कपि तव दरस भिउँ निष्पापा। मिटा
    तात मुनिबर कर सापा ॥ मुनि न होइ यह निसिचर घोरा। मानहु सत्य बचन कपि मोरा ॥ अस कहि गी अपछरा जबहीं। निसिचर
    निकट गयु कपि तबहीम् ॥ कह कपि मुनि गुरदछिना लेहू। पाछें हमहि मन्त्र तुम्ह देहू ॥ सिर लङ्गूर लपेटि पछारा।
    निज तनु प्रगटेसि मरती बारा ॥ राम राम कहि छाड़एसि प्राना। सुनि मन हरषि चलेउ हनुमाना ॥ देखा सैल न औषध
    चीन्हा। सहसा कपि उपारि गिरि लीन्हा ॥ गहि गिरि निसि नभ धावत भयू। अवधपुरी उपर कपि गयू ॥ दो देखा भरत
    बिसाल अति निसिचर मन अनुमानि। बिनु फर सायक मारेउ चाप श्रवन लगि तानि ॥ ॥ परेउ मुरुछि महि लागत सायक।
    सुमिरत राम राम रघुनायक ॥ सुनि प्रिय बचन भरत तब धाए। कपि समीप अति आतुर आए ॥ बिकल बिलोकि कीस उर लावा।
    जागत नहिं बहु भाँति जगावा ॥ मुख मलीन मन भे दुखारी। कहत बचन भरि लोचन बारी ॥ जेहिं बिधि राम बिमुख मोहि
    कीन्हा। तेहिं पुनि यह दारुन दुख दीन्हा ॥ जौं मोरें मन बच अरु काया। प्रीति राम पद कमल अमाया ॥ तौ कपि
    हौ बिगत श्रम सूला। जौं मो पर रघुपति अनुकूला ॥ सुनत बचन उठि बैठ कपीसा। कहि जय जयति कोसलाधीसा ॥ सो लीन्ह
    कपिहि उर लाइ पुलकित तनु लोचन सजल। प्रीति न हृदयँ समाइ सुमिरि राम रघुकुल तिलक ॥ ॥ तात कुसल कहु सुखनिधान
    की। सहित अनुज अरु मातु जानकी ॥ कपि सब चरित समास बखाने। भे दुखी मन महुँ पछिताने ॥ अहह दैव मैं कत जग
    जायुँ। प्रभु के एकहु काज न आयुँ ॥ जानि कुअवसरु मन धरि धीरा। पुनि कपि सन बोले बलबीरा ॥ तात गहरु होइहि
    तोहि जाता। काजु नसाइहि होत प्रभाता ॥ चढ़उ मम सायक सैल समेता। पठवौं तोहि जहँ कृपानिकेता ॥ सुनि कपि
    मन उपजा अभिमाना। मोरें भार चलिहि किमि बाना ॥ राम प्रभाव बिचारि बहोरी। बन्दि चरन कह कपि कर जोरी ॥ दो
    तव प्रताप उर राखि प्रभु जेहुँ नाथ तुरन्त। अस कहि आयसु पाइ पद बन्दि चलेउ हनुमन्त ॥ ॥ भरत बाहु बल सील
    गुन प्रभु पद प्रीति अपार। मन महुँ जात सराहत पुनि पुनि पवनकुमार ॥ ॥ उहाँ राम लछिमनहिं निहारी। बोले
    बचन मनुज अनुसारी ॥ अर्ध राति गि कपि नहिं आयु। राम उठाइ अनुज उर लायु ॥ सकहु न दुखित देखि मोहि क् ।
    बन्धु सदा तव मृदुल सुभ् ॥ मम हित लागि तजेहु पितु माता। सहेहु बिपिन हिम आतप बाता ॥ सो अनुराग कहाँ अब
    भाई। उठहु न सुनि मम बच बिकलाई ॥ जौं जनतेउँ बन बन्धु बिछोहू। पिता बचन मनतेउँ नहिं ओहू ॥ सुत बित नारि
    भवन परिवारा। होहिं जाहिं जग बारहिं बारा ॥ अस बिचारि जियँ जागहु ताता। मिलि न जगत सहोदर भ्राता ॥ जथा
    पङ्ख बिनु खग अति दीना। मनि बिनु फनि करिबर कर हीना ॥ अस मम जिवन बन्धु बिनु तोही। जौं जड़ दैव जिआवै
    मोही ॥ जैहुँ अवध कवन मुहु लाई। नारि हेतु प्रिय भाइ गँवाई ॥ बरु अपजस सहतेउँ जग माहीं। नारि हानि बिसेष
    छति नाहीम् ॥ अब अपलोकु सोकु सुत तोरा। सहिहि निठुर कठोर उर मोरा ॥ निज जननी के एक कुमारा। तात तासु तुम्ह
    प्रान अधारा ॥ सौम्पेसि मोहि तुम्हहि गहि पानी। सब बिधि सुखद परम हित जानी ॥ उतरु काह दैहुँ तेहि जाई।
    उठि किन मोहि सिखावहु भाई ॥ बहु बिधि सिचत सोच बिमोचन। स्त्रवत सलिल राजिव दल लोचन ॥ उमा एक अखण्ड रघुराई।
    नर गति भगत कृपाल देखाई ॥ सो प्रभु प्रलाप सुनि कान बिकल भे बानर निकर। आइ गयु हनुमान जिमि करुना महँ
    बीर रस ॥ ॥ हरषि राम भेण्टेउ हनुमाना। अति कृतग्य प्रभु परम सुजाना ॥ तुरत बैद तब कीन्ह उपाई। उठि बैठे
    लछिमन हरषाई ॥ हृदयँ लाइ प्रभु भेण्टेउ भ्राता। हरषे सकल भालु कपि ब्राता ॥ कपि पुनि बैद तहाँ पहुँचावा।
    जेहि बिधि तबहिं ताहि लि आवा ॥ यह बृत्तान्त दसानन सुनेऊ। अति बिषाद पुनि पुनि सिर धुनेऊ ॥ ब्याकुल कुम्भकरन
    पहिं आवा। बिबिध जतन करि ताहि जगावा ॥ जागा निसिचर देखिअ कैसा। मानहुँ कालु देह धरि बैसा ॥ कुम्भकरन बूझा
    कहु भाई। काहे तव मुख रहे सुखाई ॥ कथा कही सब तेहिं अभिमानी। जेहि प्रकार सीता हरि आनी ॥ तात कपिन्ह सब
    निसिचर मारे। महामहा जोधा सङ्घारे ॥ दुर्मुख सुररिपु मनुज अहारी। भट अतिकाय अकम्पन भारी ॥ अपर महोदर आदिक
    बीरा। परे समर महि सब रनधीरा ॥ दो सुनि दसकन्धर बचन तब कुम्भकरन बिलखान। जगदम्बा हरि आनि अब सठ चाहत कल्यान
    ॥ ॥ भल न कीन्ह तैं निसिचर नाहा। अब मोहि आइ जगाएहि काहा ॥ अजहूँ तात त्यागि अभिमाना। भजहु राम होइहि
    कल्याना ॥ हैं दससीस मनुज रघुनायक। जाके हनूमान से पायक ॥ अहह बन्धु तैं कीन्हि खोटाई। प्रथमहिं मोहि
    न सुनाएहि आई ॥ कीन्हेहु प्रभू बिरोध तेहि देवक। सिव बिरञ्चि सुर जाके सेवक ॥ नारद मुनि मोहि ग्यान जो
    कहा। कहतेउँ तोहि समय निरबहा ॥ अब भरि अङ्क भेण्टु मोहि भाई। लोचन सूफल करौ मैं जाई ॥ स्याम गात सरसीरुह
    लोचन। देखौं जाइ ताप त्रय मोचन ॥ दो राम रूप गुन सुमिरत मगन भयु छन एक। रावन मागेउ कोटि घट मद अरु महिष
    अनेक ॥ ॥ महिष खाइ करि मदिरा पाना। गर्जा बज्राघात समाना ॥ कुम्भकरन दुर्मद रन रङ्गा। चला दुर्ग तजि सेन
    न सङ्गा ॥ देखि बिभीषनु आगें आयु। परेउ चरन निज नाम सुनायु ॥ अनुज उठाइ हृदयँ तेहि लायो। रघुपति भक्त
    जानि मन भायो ॥ तात लात रावन मोहि मारा। कहत परम हित मन्त्र बिचारा ॥ तेहिं गलानि रघुपति पहिं आयुँ। देखि
    दीन प्रभु के मन भायुँ ॥ सुनु सुत भयु कालबस रावन। सो कि मान अब परम सिखावन ॥ धन्य धन्य तैं धन्य बिभीषन।
    भयहु तात निसिचर कुल भूषन ॥ बन्धु बंस तैं कीन्ह उजागर। भजेहु राम सोभा सुख सागर ॥ दो बचन कर्म मन कपट
    तजि भजेहु राम रनधीर। जाहु न निज पर सूझ मोहि भयुँ कालबस बीर। ॥ बन्धु बचन सुनि चला बिभीषन। आयु जहँ त्रैलोक
    बिभूषन ॥ नाथ भूधराकार सरीरा। कुम्भकरन आवत रनधीरा ॥ एतना कपिन्ह सुना जब काना। किलकिलाइ धाए बलवाना ॥
    लिए उठाइ बिटप अरु भूधर। कटकटाइ डारहिं ता ऊपर ॥ कोटि कोटि गिरि सिखर प्रहारा। करहिं भालु कपि एक एक बारा
    ॥ मुर् यो न मन तनु टर् यो न टार् यो। जिमि गज अर्क फलनि को मार्यो ॥ तब मारुतसुत मुठिका हन्यो। पर् यो
    धरनि ब्याकुल सिर धुन्यो ॥ पुनि उठि तेहिं मारेउ हनुमन्ता। घुर्मित भूतल परेउ तुरन्ता ॥ पुनि नल नीलहि
    अवनि पछारेसि। जहँ तहँ पटकि पटकि भट डारेसि ॥ चली बलीमुख सेन पराई। अति भय त्रसित न कौ समुहाई ॥ दो अङ्गदादि
    कपि मुरुछित करि समेत सुग्रीव। काँख दाबि कपिराज कहुँ चला अमित बल सींव ॥ ॥ उमा करत रघुपति नरलीला। खेलत
    गरुड़ जिमि अहिगन मीला ॥ भृकुटि भङ्ग जो कालहि खाई। ताहि कि सोहि ऐसि लराई ॥ जग पावनि कीरति बिस्तरिहहिं।
    गाइ गाइ भवनिधि नर तरिहहिम् ॥ मुरुछा गि मारुतसुत जागा। सुग्रीवहि तब खोजन लागा ॥ सुग्रीवहु कै मुरुछा
    बीती। निबुक गयु तेहि मृतक प्रतीती ॥ काटेसि दसन नासिका काना। गरजि अकास चलु तेहिं जाना ॥ गहेउ चरन गहि
    भूमि पछारा। अति लाघवँ उठि पुनि तेहि मारा ॥ पुनि आयसु प्रभु पहिं बलवाना। जयति जयति जय कृपानिधाना ॥
    नाक कान काटे जियँ जानी। फिरा क्रोध करि भि मन ग्लानी ॥ सहज भीम पुनि बिनु श्रुति नासा। देखत कपि दल उपजी
    त्रासा ॥ दो जय जय जय रघुबंस मनि धाए कपि दै हूह। एकहि बार तासु पर छाड़एन्हि गिरि तरु जूह ॥ ॥ कुम्भकरन
    रन रङ्ग बिरुद्धा। सन्मुख चला काल जनु क्रुद्धा ॥ कोटि कोटि कपि धरि धरि खाई। जनु टीड़ई गिरि गुहाँ समाई
    ॥ कोटिन्ह गहि सरीर सन मर्दा। कोटिन्ह मीजि मिलव महि गर्दा ॥ मुख नासा श्रवनन्हि कीं बाटा। निसरि पराहिं
    भालु कपि ठाटा ॥ रन मद मत्त निसाचर दर्पा। बिस्व ग्रसिहि जनु एहि बिधि अर्पा ॥ मुरे सुभट सब फिरहिं न
    फेरे। सूझ न नयन सुनहिं नहिं टेरे ॥ कुम्भकरन कपि फौज बिडारी। सुनि धाई रजनीचर धारी ॥ देखि राम बिकल कटकाई।
    रिपु अनीक नाना बिधि आई ॥ दो सुनु सुग्रीव बिभीषन अनुज सँभारेहु सैन। मैं देखुँ खल बल दलहि बोले राजिवनैन
