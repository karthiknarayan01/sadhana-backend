id: shloka-3
category: shloka
name:
  english: shloka 3
  devanagari: श्लोक ३
content:
  english: daurmantryannripatih vinashyati yatih samgatsutah lalanat vipro'nadhyayanatkulam kutanayacchilam
    khalopasanat | hrih madyadanavekshanadapi krishih snehah pravasa ashrayat maitri capranayatsamriddhiranayattyagatpramadaddhanam
    ||
  devanagari: दौर्मन्त्र्यान्नृपतिः विनश्यति यतिः संगात्सुतः लालनात् विप्रोऽनध्ययनात्कुलं कुतनयाच्छीलं
    खलोपासनात् । ह्रीः मद्यादनवेक्षणादपि कृषिः स्नेहः प्रवास आश्रयात् मैत्री चाप्रणयात्समृद्धिरनयात्त्यागात्प्रमादाद्धनम्
    ॥
meaning: {}
