id: shrinivasarcadashakam
category: stotram
name:
  english: shrinivasarcadashakam
  devanagari: श्रीनिवासार्चादशकम्
content:
  english: shrinivasarcadashakam shrivasadevakarunashishiralokamritavasekena | upacitabahuvidhapunyam
    dhanyam shrivenkatacalam vande || 1|| bahulashilatalatarutatitrinaganavirujjharimayashshikhari | yo
    giyate parivrito yogindraishshrinivasa eveti || 2|| pashupakshimrigavanaspatitrinagulmalatashilasu
    catmajanim | yatrarthayanti munayashcitrakareshu nirjjhareshvapi ca || 3|| paravasudeva eva sthiravasam
    prapya yatra saha ramaya | ciramanandamupaiti hi paramanandam vihaya vaikuntham || 4|| malasankule
    kalavapi phalajalanyaihikanyapiha janah | svabhishtani labhante yatra shrivasadevakarunatah || 5||
    narayanacale'sminnaracchrisvamipushkarinyashca | tiralaye vibhantam narayanamashraye ramakantam ||
    6|| anjanagirishikharalayamanjanarocirniranjanam dhama | kanjavilocanamide pinjaravakshashshriyastvisha
    kimapi || 7|| narayanadrivasam shrishrivasam ramakshamavasam | harimanigirisamabhasam surucirahasam
    namamyavitadasam || 8|| ashritaphanindrashailam harimaninilam suvarnasamacelam |
  devanagari: श्रीनिवासार्चादशकम् श्रीवासदेवकरुणाशिशिरालोकामृतावसेकेन । उपचितबहुविधपुण्यं धन्यं श्रीवेङ्कटाचलं
    वन्दे ॥ १॥ बहुलशिलातलतरुततितृणगणवीरुज्झरीमयश्शिखरी । यो गीयते परिवृतो योगीन्द्रैश्श्रीनिवास एवेति
    ॥ २॥ पशुपक्षिमृगवनस्पतितृणगुल्मलताशिलासु चात्मजनिम् । यत्रार्थयन्ति मुनयश्चित्राकारेषु निर्ज्झरेष्वपि
    च ॥ ३॥ परवासुदेव एव स्थिरवासं प्राप्य यत्र सह रमया । चिरमानन्दमुपैति हि परमानन्दं विहाय वैकुण्ठम्
    ॥ ४॥ मलसङ्कुले कलावपि फलजालान्यैहिकान्यपीह जनाः । स्वाभीष्टानि लभन्ते यत्र श्रीवासदेवकरुणातः ॥ ५॥
    नारायणाचलेऽस्मिन्नाराच्छ्रीस्वामिपुष्करिण्याश्च । तीरालये विभान्तं नारायणमाश्रये रमाकान्तम् ॥ ६॥ अञ्जनगिरिशिखरालयमञ्जनरोचिर्निरञ्जनं
    धाम । कञ्जविलोचनमीडे पिञ्जरवक्षश्श्रियस्त्विषा किमपि ॥ ७॥ नारायणाद्रिवासं श्रीश्रीवासं रमाक्षमावासम्
    । हरिमणिगिरिसमभासं सुरुचिरहासं नमाम्यवितदासम् ॥ ८॥ आश्रितफणीन्द्रशैलं हरिमणिनीलं सुवर्णसमचेलम् ।
