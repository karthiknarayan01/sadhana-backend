id: dharmarajakritamvishnustotram
category: stotram
name:
  english: dharmarajakritamvishnustotram
  devanagari: धर्मरजकृतंविष्णुस्तोत्रम्
content:
  english: 80|| stutva nanavidhaih stotraih pranamamakarottada | iti naradapurane uttarabhage dvipancashattamadhyayantargatam
    dharmarajakritam vishnustotram samaptam | brihannaradiyapurana | uttarabhaga | adhyaya 52
  devanagari: ८०॥ स्तुत्वा नानाविधैः स्तोत्रैः प्रणाममकरोत्तदा । इति नारदपुराणे उत्तरभागे द्विपञ्चाशत्तमाध्यायान्तर्गतं
    धर्मराजकृतं विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । उत्तरभाग । अध्याय ५२
meaning: {}
