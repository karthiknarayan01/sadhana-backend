id: bhavanisahasra-2
category: sahasranama
name:
  english: bhavanisahasra
  devanagari: भवानीसहस्र
content:
  english: rinkhala kalaha baddha dridhabandhavimokshini || 49|| ambikambalika camba svaccha sadhujarnacita
    | kauliki kulavidya ca sukula kulapujita || 50|| kalacakrabhrama bhranta vibhramabhramanashini | vatyali
    meghamala ca suvrishtih sasyarvadhini || 51|| akara ca ikara ca ukaraukararupini | hrinkara bijarupa
    ca klinkarambaravasini || 52|| sarvaksharamayishaktirakshara varnamalini | sindurarunavarna ca sinduratilakapriya
    || 53|| vashya ca vashyabija ca lokavashyavibhavini | nripavashya nripaih sevya nripavashyakarapriya
    || 54|| mahisha nripamanya ca nripanya nripanandini | nripadharmamayi dhanya dhanadhanyavivardhini
    || 55|| caturvarnamayimurtishcaturvanaimshca pujita | sarvadharmamayisiddhi shcaturashramavasini ||
    56|| brahmani kshatriya vaishya shudra cavaravarnaja | vedamargarata yajna vedirvishvavibhavini ||
    57|| anushastramayi vidya varashastrastradharini | sumedha satyamedha ca bhadrakalyaparajita || 58||
    gayatri satkritih sandhya savitri tripadashraya | trisandhya tripadi dhatri suparva samagayini ||
    59|| pancali balika bala balakrida sanatani | garbhadharadharashunya garbhashayanivasini || 60|| surarighatini
    kritya putana ca tilottama | lajja rasavati nanda bhavani papanashini || 61|| pattambaradhara gitih
    sugitirjnanagocara | saptasvaramayi tantri shadjamadhyamadhaivata || 62|| murchana gramasamsthana
    murcha susthanavasini | attattahasini preta pretasananivasini || 63|| gitanrityapriya kama tushtida
    pushtida kshama | nishtha satyapriya prajna lolakshi ca surottama || 64|| savisha jvalini jvala vishvamohartinashini
    | shatamari mahadevi vaishnavi shatapatrika || 65|| visharirnagadamani kurukullya'mritodbhava | bhutabhitihararaksha
    bhutaveshavinashini || 66|| rakshoghni rakshasi ratrirdirghanidra nivarini | candrika candrakantishca
    suryakantirnishacari || 67|| dakini shakini shishya hakini cakravakini | shita shitapriya svanga sakala
    vanadevata || 68|| gururupadhara gurvi mrityurmari visharada | mahamari vinidra ca tandra mrityuvinashini
    || 69|| candramandalasankasha candramandalavasini | animadigunopeta suspriha kamarupini || 70|| ashtasiddhiprada
    praudha dushtadanavaghatini | anadinidhana pushtishcaturbahushcaturmukhi || 71|| catussamudrashayana
    caturvargaphalaprada | kashapushpapratikasha sharatkumudalocana || 72|| somasuryagninayana brahmavishnushirvarcita
    | kalyanikamala kanya shubha mangalacandika || 73|| bhuta bhavya bhavishya ca shailaja shailavasini
    | vamamargarata vama shivavamangavasini || 74|| vamacarapriya tushtirlompamudra prabodhini | bhutatma
    paramatma bhutabhavavibhavini || 75|| mangala ca sushila ca paramarthaprabodhini | dakshiina dakshinamurtih
    sudiksha ca hariprasuh || 76|| yogini yogayukta ca yoganga dhyanashalini | yogapattadhara mukta muktanam
    parama gatih || 77|| narasmihi sujanma ca trivargaphaladayini | dharmada dhanada caiva kamada mokshadadyutih
    || 78|| sakshini kshanada kamksha dakshaja kutarupini | rituh katyayani svaccha succhanda kavipriya
    || 79|| satyagama bahihstha ca kavyashaktih kavitvada | minaputri sati sadhvi mainakabhagini tadit
    || 80|| saudamini sudama ca sudhama dhamashalini | saubhagyadayini dyaushca subhaga dyutivardhini
    || 81|| shrikrittivasana caiva kankali kalinashini | raktabijavadhodyukta sutanturbijasantatih ||
    82|| jagajjiva jagadbija jagatrayahitaishini | camikararucishcandri sakshadya shodashi kala || 83||
    yattatpadanubandha ca yakshini dhanadarcita | citrini citramaya ca vicitra bhuvaneshvari || 84|| camunda
    mundahasta ca candamundavadhodyata | ashtamyekadashi purna navami ca caturdashi || 85|| uma kalashahasta
    ca purnakumbhapayodhara | abhirurbhairavi bhiru bhima tripurabhairavi || 86|| mahacandi ca raudri
    ca mahabhairavapujita | nirmunda hastinicanda karaladashananana || 87|| karala vikarala ca ghora ghurghuranadini
    | raktadantordhvakeshi ca bandhukakusumaruna || 88|| kadambini vipasha ca kashmiri kunkumapriya |
    kshantirbahusuvarna ca ratirbahusuvarnada || 89|| matangini vararoha mattamatangagamini | hamsa hamsagatirhamsi
    hamsojvalashiroruha || 90|| purnacandramukhi shyama smitasya ca sukundala | mahishi ca lekhani lekha
    sulekha lekhakapriya || 91|| shankhini shankhahasta ca jalastha jaladevata | kurukshetra'vanih kashi
    mathura kancyavantika || 92|| ayodhya dvarika maya tirtha tirthakarapriya | tripushkara'prameya ca
    koshastha koshavasini || 93|| kaushiki ca kushavarta kaushambi koshavardhini | koshada padmakoshakshi
    kausumbhakusumapriya || 94|| totala ca tulakotih kutastha kotarashraya | svayambhushca surupa ca svarupa
    punyavardhini || 95|| tejasvini subhiksha ca balada baladayini | mahakoshi mahavarta buddhih sadasadatmika
    || 96|| mahagrahahara saumya vishoka shokanashini | satviki satvasamstha ca rajasi ca rajovrita ||
    97|| tamasi ca tamoyukta gunatrayavibhavini | avyakta vyaktarupa ca vedavidya ca shambhavi || 98||
    shankara kalpini kalpa manassankalpasantatih | sarvalokamayi shaktih sarvashravanagocara || 99|| sarvajnanavati
    vancha sarvatattvavabodhika | jagratishca sushuptishca svapnavastha turiyaka || 100|| satvara mandara
    gatirmanda mandira modadayini | manabhumih panapatra panadanakarodyata || 101|| adhurnarunanetra ca
    kincidavyaktabhashini | ashapura ca diksha ca daksha dikshitapujita || 102|| nagavalli nagakanya bhogini
    bhogavallabha | sarvashastramayi vidya susmritirdharmavadini || 103|| shrutismritidhara jyeshtha shreshtha
    patalavasini | mimamsa tarkavidya ca subhaktirbhaktavatsala || 104|| sunabhiryatanajatirgambhira bhavavarjita
    | nagapashadharamurtiragadha nagakundala || 105|| sucakra cakramadhyastha cakrakonanivasini | sarvamantramayi
    vidya sarvamantraksharavalih || 106|| madhustravastravanti ca bhramari bhramaralika | matrimandalamadhyastha
    matrimandalavasini || 107|| kumara janani krura sumukhi jvaranashini | nidhana pancabhutanam bhavasagaratarini
    || 108|| akrura ca grahavati vigraha grahavarjita | rohini bhumigarma ca kalabhuh kalavartini || 109||
    kalankarahita nari catuhshashthyabhidhavati | atita vidyamana ca bhavini pritimanjari || 110|| sarvasaukhyavatiyuktiraharaparinamini
    | jirna ca jirnavasra ca nutana navavallabha || 111|| ajara ca rajahprita ratiragavivardhini | pancavatagatirbhinna
    pancashleshmashayadhara || 112|| pancapittavatishaktih pancasthanavibhavini | udakya ca vrishasyanti
    bahih prasravini tryaha || 113|| rajahshukradhara shaktirjarayurgarbhadharini | trikalajna trilinga
    ca trimurtistripuravasini || 114|| araga shivatattva ca kamatatvanuragini | pracyavaci pratici ca
    digudici ca digvidigdisha || 115|| ahankritirahankara bala maya balipriya | shukrashrava samidheni
    sushraddha shraddhadevata || 116|| mata matamahi triptih pitumata pitamahi | snusha dauhitrini putri
    pautri naptri shishupriya || 117|| stanada stanadhara ca vishvayonih stanandhayi | shishutsangadhara
    dola lola kridabhinandini || 118|| urvashi kadali keka vishikha shikhivartini | khatvangadharini khatva
    banapunkhanuvartini || 119|| lakshyapraptikara lakshyaladhya ca shubhalakshana | vartini supathacara
    parikha ca khanirvutih || 120|| prakaravalaya vela maryada ca mahodadhih | poshini shoshini shaktirdirghakeshi
    sulomasha || 121|| lalita mamsala tanvi vedavedangadharini | narasrikpanamatta ca naramundasthibhushana
    || 122|| akshakridaratih shari sharikashukabhashini | shambhari garudividya varuni varunarcita ||
    123|| varahi tundahasta ca damshtroddhritavasundhara | minamurtirdharamurtih vadanya'pratimashraya
    || 124|| amurta nidhirupa ca shaligramashilashucih | smritisamskararupa ca susamskara ca samskritih
    || 125|| prakrita deshabhasha ca gatha gitih prahelika | ida ca pingala pinga sushumna suryavahini
    || 126|| shashisrava ca talustha kakinyamritajivini | anurupa brihadrupa laghurupa gurusthita || 127||
    sthavara jangamacaiva kritakarmaphalaprada | vishayakrantadeha ca nirvishesha jitendriya || 128||
    citsvarupa cidananda parabrahmaprabodhini | nirvikara ca nirvaira viratih satyavarddhini || 129||
    purushajna ca bhinna ca kshantih kaivalyadayini | viviktasevini prajna janayitri ca bahushrutih ||
    130|| niriha ca samastaika sarvalokaikasevita | shiva shivapriya sevya sevaphalavivarddhini || 131||
    kalau kalkipriya kali dushtamlecchavinashini | pratyanca ca dhunaryashtih khadgadhara duranatih ||
    132|| ashvaplutishca valga ca srinih syanmrityuvarini | virabhurviramata ca virasurviranandini ||
    133|| jayashrirjayadiksha ca jayada jayavarddhini | saubhagyasubhagakara sarvasaubhagyavarddhini ||
    134|| kshemankari kshemarupa sartkittih pathidevata | sarvatirthamayimurtih sarvadevamayiprabha ||
    135|| sarvasiddhiprada shaktih sarvamangalamangala | punyam sahasranamedam shivayah shivabhashitam
    || 136|| yah pathetpratarutthaya shucirbhutva samahitah | yashcapisha
  devanagari: ृङ्खला कलहा बद्धा दृढबन्धविमोक्षिणी ॥ ४९॥ अम्बिकाम्बालिका चाम्बा स्वच्छा साधुजर्नाचिता ।
    कौलिकी कुलविद्या च सुकुला कुलपूजिता ॥ ५०॥ कालचक्रभ्रमा भ्रान्ता विभ्रमाभ्रमनाशिनी । वात्याली मेघमाला
    च सुवृष्टिः सस्यर्वधिनी ॥ ५१॥ अकारा च इकारा च उकारौकाररूपिणी । ह्रीङ्कार बीजरूपा च क्लीङ्काराम्बरवासिनी
    ॥ ५२॥ सर्वाक्षरमयीशक्तिरक्षरा वर्णमालिनी । सिन्दूरारुणवर्णा च सिन्दूरतिलकप्रिया ॥ ५३॥ वश्या च वश्यबीजा
    च लोकवश्यविभाविनी । नृपवश्या नृपैः सेव्या नृपवश्यकरप्रिया ॥ ५४॥ महिषा नृपमान्या च नृपान्या नृपनन्दिनी
    । नृपधर्ममयी धन्या धनधान्यविवर्धिनी ॥ ५५॥ चतुर्वर्णमयीमूर्तिश्चतुर्वणैंश्च पूजिता । सर्वधर्ममयीसिद्धि
    श्चतुराश्रमवासिनी ॥ ५६॥ ब्राह्मणी क्षत्रिया वैश्या शूद्रा चावरवर्णजा । वेदमार्गरता यज्ञा वेदिर्विश्वविभाविनी
    ॥ ५७॥ अनुशस्त्रमयी विद्या वरशस्त्रास्त्रधारिणी । सुमेधा सत्यमेधा च भद्रकाल्यपराजिता ॥ ५८॥ गायत्री
    सत्कृतिः सन्ध्या सावित्री त्रिपदाश्रया । त्रिसन्ध्या त्रिपदी धात्री सुपर्वा सामगायिनी ॥ ५९॥ पाञ्चाली
    बालिका बाला बालक्रीडा सनातनी । गर्भाधारधराशून्या गर्भाशयनिवासिनी ॥ ६०॥ सुरारिघातिनी कृत्या पूतना च
    तिलोत्तमा । लज्जा रसवती नन्दा भवानी पापनाशिनी ॥ ६१॥ पट्टाम्बरधरा गीतिः सुगीतिर्ज्ञानगोचरा । सप्तस्वरमयी
    तन्त्री षड्जमध्यमधैवता ॥ ६२॥ मूर्छना ग्रामसंस्थाना मूर्छा सुस्थानवासिनी । अट्टाट्टहासिनी प्रेता प्रेतासननिवासिनी
    ॥ ६३॥ गीतनृत्यप्रिया कामा तुष्टिदा पुष्टिदा क्षमा । निष्ठा सत्यप्रिया प्राज्ञा लोलाक्षी च सुरोत्तमा
    ॥ ६४॥ सविषा ज्वालिनी ज्वाला विश्वमोहार्तिनाशिनी । शतमारी महादेवी वैष्णवी शतपत्रिका ॥ ६५॥ विषारिर्नागदमनी
    कुरुकुल्ल्याऽमृतोद्भवा । भूतभीतिहरारक्षा भूतावेशविनाशिनी ॥ ६६॥ रक्षोघ्नी राक्षसी रात्रिर्दीर्घनिद्रा
    निवारिणी । चन्द्रिका चन्द्रकान्तिश्च सूर्यकान्तिर्निशाचरी ॥ ६७॥ डाकिनी शाकिनी शिष्या हाकिनी चक्रवाकिनी
    । शीता शीतप्रिया स्वङ्गा सकला वनदेवता ॥ ६८॥ गुरुरूपधरा गुर्वी मृत्युर्मारी विशारदा । महामारी विनिद्रा
    च तन्द्रा मृत्युविनाशिनी ॥ ६९॥ चन्द्रमण्डलसङ्काशा चन्द्रमण्डलवासिनी । अणिमादिगुणोपेता सुस्पृहा कामरूपिणी
    ॥ ७०॥ अष्टसिद्धिप्रदा प्रौढा दुष्टदानवघातिनी । अनादिनिधना पुष्टिश्चतुर्बाहुश्चतुर्मुखी ॥ ७१॥ चतुस्समुद्रशयना
    चतुर्वर्गफलप्रदा । काशपुष्पप्रतीकाशा शरत्कुमुदलोचना ॥ ७२॥ सोमसूर्याग्निनयना ब्रह्मविष्णुशिर्वार्चिता
    । कल्याणीकमला कन्या शुभा मङ्गलचण्डिका ॥ ७३॥ भूता भव्या भविष्या च शैलजा शैलवासिनी । वाममार्गरता वामा
    शिववामाङ्गवासिनी ॥ ७४॥ वामाचारप्रिया तुष्टिर्लोंपामुद्रा प्रबोधिनी । भूतात्मा परमात्मा भूतभावविभाविनी
    ॥ ७५॥ मङ्गला च सुशीला च परमार्थप्रबोधिनी । दक्षिईणा दक्षिणामूर्तिः सुदीक्षा च हरिप्रसूः ॥ ७६॥ योगिनी
    योगयुक्ता च योगाङ्ग ध्यानशालिनी । योगपट्टधरा मुक्ता मुक्तानां परमा गतिः ॥ ७७॥ नारस्ंइही सुजन्मा च
    त्रिवर्गफलदायिनी । धर्मदा धनदा चैव कामदा मोक्षदाद्युतिः ॥ ७८॥ साक्षिणी क्षणदा कांक्षा दक्षजा कूटरूपिणी
    । ऋतुः कात्यायनी स्वच्छा सुच्छन्दा कविप्रिया ॥ ७९॥ सत्यागमा बहिःस्था च काव्यशक्तिः कवित्वदा । मीनपुत्री
    सती साध्वी मैनाकभगिनी तडित् ॥ ८०॥ सौदामिनी सुदामा च सुधामा धामशालिनी । सौभाग्यदायिनी द्यौश्च सुभगा
    द्युतिवर्धिनी ॥ ८१॥ श्रीकृत्तिवसना चैव कङ्काली कलिनाशिनी । रक्तबीजवधोद्युक्ता सुतन्तुर्बीजसन्ततिः
    ॥ ८२॥ जगज्जीवा जगद्बीजा जगत्रयहितैषिणी । चामीकररुचिश्चन्द्री साक्षाद्या षोडशी कला ॥ ८३॥ यत्तत्पदानुबन्धा
    च यक्षिणी धनदार्चिता । चित्रिणी चित्रमाया च विचित्रा भुवनेश्वरी ॥ ८४॥ चामुण्डा मुण्डहस्ता च चण्डमुण्डवधोद्यता
    । अष्टम्येकादशी पूर्णा नवमी च चतुर्दशी ॥ ८५॥ उमा कलशहस्ता च पूर्णकुम्भपयोधरा । अभीरूर्भैरवी भीरू भीमा
    त्रिपुरभैरवी ॥ ८६॥ महाचण्डी च रौद्री च महाभैरवपूजिता । निर्मुण्डा हस्तिनीचण्डा करालदशनानना ॥ ८७॥ कराला
    विकराला च घोरा घुर्घुरनादिनी । रक्तदन्तोर्ध्वकेशी च बन्धूककुसुमारुणा ॥ ८८॥ कादम्बिनी विपाशा च काश्मीरी
    कुङ्कुमप्रिया । क्षान्तिर्बहुसुवर्णा च रतिर्बहुसुवर्णदा ॥ ८९॥ मातङ्गिनी वरारोहा मत्तमातङ्गगामिनी ।
    हंसा हंसगतिर्हंसी हंसोज्वलशिरोरुहा ॥ ९०॥ पूर्णचन्द्रमुखी श्यामा स्मितास्या च सुकुण्डला । महिषी च लेखनी
    लेखा सुलेखा लेखकप्रिया ॥ ९१॥ शङ्खिनी शङ्खहस्ता च जलस्था जलदेवता । कुरुक्षेत्राऽवनिः काशी मथुरा काञ्च्यवन्तिका
    ॥ ९२॥ अयोध्या द्वारिका माया तीर्था तीर्थकरप्रिया । त्रिपुष्कराऽप्रमेया च कोशस्था कोशवासिनी ॥ ९३॥ कौशिकी
    च कुशावर्ता कौशाम्बी कोशवर्धिनी । कोशदा पद्मकोशाक्षी कौसुम्भकुसुमप्रिया ॥ ९४॥ तोतला च तुलाकोटिः कूटस्था
    कोटराश्रया । स्वयम्भूश्च सुरूपा च स्वरूपा पुण्यवर्धिनी ॥ ९५॥ तेजस्विनी सुभिक्षा च बलदा बलदायिनी ।
    महाकोशी महावार्ता बुद्धिः सदसदात्मिका ॥ ९६॥ महाग्रहहरा सौम्या विशोका शोकनाशिनी । सात्विकी सत्वसंस्था
    च राजसी च रजोवृता ॥ ९७॥ तामसी च तमोयुक्ता गुणत्रयविभाविनी । अव्यक्ता व्यक्तरूपा च वेदविद्या च शाम्भवी
    ॥ ९८॥ शङ्करा कल्पिनी कल्पा मनस्सङ्कल्पसन्ततिः । सर्वलोकमयी शक्तिः सर्वश्रवणगोचरा ॥ ९९॥ सर्वज्ञानवती
    वाञ्छा सर्वतत्त्वावबोधिका । जाग्रतिश्च सुषुप्तिश्च स्वप्नावस्था तुरीयका ॥ १००॥ सत्वरा मन्दरा गतिर्मन्दा
    मन्दिरा मोददायिनी । मानभूमिः पानपात्रा पानदानकरोद्यता ॥ १०१॥ आधूर्णारूणनेत्रा च किञ्चिदव्यक्तभाषिणी
    । आशापुरा च दीक्षा च दक्षा दीक्षितपूजिता ॥ १०२॥ नागवल्ली नागकन्या भोगिनी भोगवल्लभा । सर्वशास्त्रमयी
    विद्या सुस्मृतिर्धर्मवादिनी ॥ १०३॥ श्रुतिस्मृतिधरा ज्येष्ठा श्रेष्ठा पातालवासिनी । मीमांसा तर्कविद्या
    च सुभक्तिर्भक्तवत्सला ॥ १०४॥ सुनाभिर्यातनाजातिर्गम्भीरा भाववर्जिता । नागपाशधरामूर्तिरगाधा नागकुण्डला
    ॥ १०५॥ सुचक्रा चक्रमध्यस्था चक्रकोणनिवासिनी । सर्वमन्त्रमयी विद्या सर्वमन्त्राक्षरावलिः ॥ १०६॥ मधुस्त्रवास्त्रवन्ती
    च भ्रामरी भ्रमरालिका । मातृमण्डलमध्यस्था मातृमण्डलवासिनी ॥ १०७॥ कुमार जननी क्रूरा सुमुखी ज्वरनाशिनी
    । निधाना पञ्चभूतानां भवसागरतारिणी ॥ १०८॥ अक्रूरा च ग्रहावती विग्रहा ग्रहवर्जिता । रोहिणी भूमिगर्मा
    च कालभूः कालवर्तिनी ॥ १०९॥ कलङ्करहिता नारी चतुःषष्ठ्यभिधावती । अतीता विद्यमाना च भाविनी प्रीतिमञ्जरी
    ॥ ११०॥ सर्वसौख्यवतीयुक्तिराहारपरिणामिनी । जीर्णा च जीर्णवस्रा च नूतना नववल्लभा ॥ १११॥ अजरा च रजःप्रीता
    रतिरागविवर्धिनी । पञ्चवातगतिर्भिन्ना पञ्चश्लेष्माशयाधरा ॥ ११२॥ पञ्चपित्तवतीशक्तिः पञ्चस्थानविभाविनी
    । उदक्या च वृषस्यन्ती बहिः प्रस्रविणी त्र्यहा ॥ ११३॥ रजःशुक्रधरा शक्तिर्जरायुर्गर्भधारिणी । त्रिकालज्ञा
    त्रिलिङ्गा च त्रिमूर्तिस्त्रिपुरवासिनी ॥ ११४॥ अरागा शिवतत्त्वा च कामतत्वानुरागिणी । प्राच्यवाची प्रतीची
    च दिगुदीची च दिग्विदिग्दिशा ॥ ११५॥ अहङ्कृतिरहङ्कारा बाला माया बलिप्रिया । शुक्रश्रवा सामिधेनी सुश्रद्धा
    श्राद्धदेवता ॥ ११६॥ माता मातामही तृप्तिः पितुमाता पितामही । स्नुषा दौहित्रिणी पुत्री पौत्री नप्त्री
    शिशुप्रिया ॥ ११७॥ स्तनदा स्तनधारा च विश्वयोनिः स्तनन्धयी । शिशूत्सङ्गधरा दोला लोला क्रीडाभिनन्दिनी
    ॥ ११८॥ उर्वशी कदली केका विशिखा शिखिवर्तिनी । खट्वाङ्गधारिणी खट्व बाणपुङ्खानुवर्तिनी ॥ ११९॥ लक्ष्यप्राप्तिकरा
    लक्ष्यालध्या च शुभलक्षणा । वर्तिनी सुपथाचारा परिखा च खनिर्वुतिः ॥ १२०॥ प्राकारवलया वेला मर्यादा च
    महोदधिः । पोषिणी शोषिणी शक्तिर्दीर्घकेशी सुलोमशा ॥ १२१॥ ललिता मांसला तन्वी वेदवेदाङ्गधारिणी । नरासृक्पानमत्ता
    च नरमुण्डास्थिभूषणा ॥ १२२॥ अक्षक्रीडारतिः शारि शारिकाशुकभाषिणी । शाम्भरी गारुडीविद्या वारुणी वरुणार्चिता
    ॥ १२३॥ वाराही तुण्डहस्ता च दंष्ट्रोद्धृतवसुन्धरा । मीनमूर्तिर्धरामूर्तिः वदान्याऽप्रतिमाश्रया ॥ १२४॥
    अमूर्ता निधिरूपा च शालिग्रामशिलाशुचिः । स्मृतिसंस्काररूपा च सुसंस्कारा च संस्कृतिः ॥ १२५॥ प्राकृता
    देशभाषा च गाथा गीतिः प्रहेलिका । इडा च पिङ्गला पिङ्गा सुषुम्ना सूर्यवाहिनी ॥ १२६॥ शशिस्रवा च तालुस्था
    काकिन्यमृतजीविनी । अणुरूपा बृहद्रूपा लघुरूपा गुरुस्थिता ॥ १२७॥ स्थावरा जङ्गमाचैव कृतकर्मफलप्रदा ।
    विषयाक्रान्तदेहा च निर्विशेषा जितेन्द्रिया ॥ १२८॥ चित्स्वरूपा चिदानन्दा परब्रह्मप्रबोधिनी । निर्विकारा
    च निर्वैरा विरतिः सत्यवर्द्धिनी ॥ १२९॥ पुरुषाज्ञा चा भिन्ना च क्षान्तिः कैवल्यदायिनी । विविक्तसेविनी
    प्रज्ञा जनयित्री च बहुश्रुतिः ॥ १३०॥ निरीहा च समस्तैका सर्वलोकैकसेविता । शिवा शिवप्रिया सेव्या सेवाफलविवर्द्धिनी
    ॥ १३१॥ कलौ कल्किप्रिया काली दुष्टम्लेच्छविनाशिनी । प्रत्यञ्चा च धुनर्यष्टिः खड्गधारा दुरानतिः ॥ १३२॥
    अश्वप्लुतिश्च वल्गा च सृणिः स्यन्मृत्युवारिणी । वीरभूर्वीरमाता च वीरसूर्वीरनन्दिनी ॥ १३३॥ जयश्रीर्जयदीक्षा
    च जयदा जयवर्द्धिनी । सौभाग्यसुभगाकारा सर्वसौभाग्यवर्द्धिनी ॥ १३४॥ क्षेमङ्करी क्षेमरूपा सर्त्कीत्तिः
    पथिदेवता । सर्वतीर्थमयीमूर्तिः सर्वदेवमयीप्रभा ॥ १३५॥ सर्वसिद्धिप्रदा शक्तिः सर्वमङ्गलमङ्गला । पुण्यं
    सहस्रनामेदं शिवायाः शिवभाषितम् ॥ १३६॥ यः पठेत्प्रातरुत्थाय शुचिर्भूत्वा समाहितः । यश्चापिश
