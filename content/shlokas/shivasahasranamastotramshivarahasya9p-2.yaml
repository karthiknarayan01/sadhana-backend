id: shivasahasranamastotramshivarahasya9p-2
category: stotram
name:
  english: shivasahasranamastotramshivarahasya9p 2
  devanagari: शिवसहस्रनामस्तोत्रम्शिवरहस्य९प् २
content:
  english: go'jinangah karmandijanavatsalah || 36|| caturhotro virahota shatarudriyamadhyagah | bhimo
    rudra udavarto vishamaksho'runeshvarah || 37|| yaksharajanuto natho nitishastrapravartakah | kapalapanirbhagavanvaiyaghratvagalankritah
    || 38|| mokshasaro'dhvaradhyaksha dhvajajivo marutsakhah | aruneyastvagadhyaksho kamanarahitastaruh
    || 39|| bilvapujyo bilvanisho haridashvo'parajitah | brihadrathantarastutyo vamadevyastavapriyah ||
    40|| aghoratara rocishnurgambhiro manyurishvarah | kalipravartako yogi sankhyamayavisharadah || 41||
    vidharako dhairyadhuryah somadhamantarasthitah | shipivishto gahvareshto jyeshtho devah kanishthakah
    || 42|| pinakahasto'varajo varshaharishvarah | kavaci ca nishangi ca rathaghosho'mitaprabhah || 43||
    kalanjaro dandashuko vidarbhesho ganatigah | gabhastisho munishreshtho maharshih samshitavratah ||
    44|| karnikaravanavasi karavirasumapriyah | nilotpalamahasragvi karahatapureshvarah || 45|| shatarcanah
    paranando brahmanarcyopavitavan | bali balapriyo dharmo hiranyapatirappatih || 46|| yamapramathanoshnishi
    cakrahastah purantakah | vasusheno'nganadehah kaulacarapravartakah || 47|| tantradhyaksho mantramayo
    gayatrimadhyagah shucih | vedatma yajnasamprito garishthah paradah kali || 48|| rigyajuhsamarupatma
    sarvatma kraturishvarah | hiranyagarbhajanako hiranyakshavarapradah || 49|| damitasheshapashando dandahasto
    durasadah | durvarcanapriyakaro rantidevo'mareshvarah || 50|| amritatma mahadevo harah samharakarakah
    | triguno vikhana vagmi tvanmamsarudhiramshakah || 51|| vatsapriyo'tha sanustho vishnu raktapriyo
    guruh | kirataveshah shonatma ratnagarbho'runekshanah || 52|| surasavabalipritastatpursho'gandhadehavan
    | vyomakeshah koshahinah kalpanarahito'kshami || 53|| sahamanashca vivyadhi sphatikopalanirmalah |
    mrityunjayo duradhyaksho bhaktiprito bhayapahah || 54|| gandharvaganasuprito vishnugarbho'mitadyutih
    | brahmastutah suryanetro vitihotro'rjunantakah || 55|| garvapaharako vagmi kumbhasambhavapujitah
    | malayo vindhyanilayo mahendro merunayakah || 56|| parvatinayako'jayyo jangamajangamashrayah | kuruvindo'runo
    dhanvi asthibhusho nishakarah || 57||
  devanagari: गोऽजिनाङ्गः कर्मन्दिजनवत्सलः ॥ ३६॥ चातुर्होत्रो वीरहोता शतरुद्रीयमध्यगः । भीमो रुद्र उदावर्तो
    विषमाक्षोऽरुणेश्वरः ॥ ३७॥ यक्षराजनुतो नाथो नीतिशास्त्रप्रवर्तकः । कपालपाणिर्भगवान्वैयाघ्रत्वगलङ्कृतः
    ॥ ३८॥ मोक्षसारोऽध्वराध्यक्ष ध्वजजीवो मरुत्सखः । आरुणेयस्त्वगध्यक्षो कामनारहितस्तरुः ॥ ३९॥ बिल्वपूज्यो
    बिल्वनीशो हरिदश्वोऽपराजितः । बृहद्रथन्तरस्तुत्यो वामदेव्यस्तवप्रियः ॥ ४०॥ अघोरतर रोचिष्णुर्गम्भीरो
    मन्युरीश्वरः । कलिप्रवर्तको योगी साङ्ख्यमायाविशारदः ॥ ४१॥ विधारको धैर्यधुर्यः सोमधामान्तरस्थितः ।
    शिपिविष्टो गह्वरेष्टो ज्येष्ठो देवः कनिष्ठकः ॥ ४२॥ पिनाकहस्तोऽवरजो वर्षहरीश्वरः । कवची च निषङ्गी च
    रथघोषोऽमितप्रभः ॥ ४३॥ कालञ्जरो दन्दशूको विदर्भेशो गणातिगः । गभस्तीशो मुनिश्रेष्ठो महर्षिः संशितव्रतः
    ॥ ४४॥ कर्णिकारवनावासी करवीरसुमप्रियः । नीलोत्पलमहास्रग्वी करहाटपुरेश्वरः ॥ ४५॥ शतर्चनः परानन्दो ब्राह्मणार्च्योपवीतवान्
    । बली बालप्रियो धर्मो हिरण्यपतिरप्पतिः ॥ ४६॥ यमप्रमथनोष्णीषी चक्रहस्तः पुरान्तकः । वसुषेणोऽङ्गनादेहः
    कौलाचारप्रवर्तकः ॥ ४७॥ तन्त्राध्यक्षो मन्त्रमयो गायत्रीमध्यगः शुचिः । वेदात्मा यज्ञसम्प्रीतो गरिष्ठः
    पारदः कली ॥ ४८॥ ऋग्यजुःसामरूपात्मा सर्वात्मा क्रतुरीश्वरः । हिरण्यगर्भजनको हिरण्याक्षवरप्रदः ॥ ४९॥
    दमिताशेषपाषण्डो दण्डहस्तो दुरासदः । दूर्वार्चनप्रियकरो रन्तिदेवोऽमरेश्वरः ॥ ५०॥ अमृतात्मा महादेवो
    हरः संहारकारकः । त्रिगुणो विखना वाग्मी त्वङ्मांसरुधिरांशकः ॥ ५१॥ वत्सप्रियोऽथ सानुस्थो विष्णू रक्तप्रियो
    गुरुः । किरातवेषः शोणात्मा रत्नगर्भोऽरुणेक्षणः ॥ ५२॥ सुरासवबलिप्रीतस्तत्पूर्षोऽगन्धदेहवान् । व्योमकेशः
    कोशहीनः कल्पनारहितोऽक्षमी ॥ ५३॥ सहमानश्च विव्याधी स्फटिकोपलनिर्मलः । मृत्युञ्जयो दुराध्यक्षो भक्तिप्रीतो
    भयापहः ॥ ५४॥ गन्धर्वगानसुप्रीतो विष्णुगर्भोऽमितद्युतिः । ब्रह्मस्तुतः सूर्यनेत्रो वीतिहोत्रोऽर्जुनान्तकः
    ॥ ५५॥ गर्वापहारको वाग्मी कुम्भसम्भवपूजितः । मलयो विन्ध्यनिलयो महेन्द्रो मेरुनायकः ॥ ५६॥ पार्वतीनायकोऽजय्यो
    जङ्गमाजङ्गमाश्रयः । कुरुविन्दोऽरुणो धन्वी अस्थिभूषो निशाकरः ॥ ५७॥
