id: harinajanalokanivasibhyahdattammantram
category: mantra
name:
  english: harinajanalokanivasibhyahdattammantram
  devanagari: हरिणाजनलोकनिवासिभ्यःदत्तंमन्त्रम्
content:
  english: timantram jagada tan | krishnanarayana krishnanarayana narayana || 51|| anadishrikrishnanarayanasvamin
    ramayana | iti dhunyam dadau tebhyah pavayitva tato harih || 52|| iti shrilakshminarayaniyasamhitayah
    tishyasantanatmakasya caturthakhande 94
  devanagari: तिमन्त्रं जगाद तान् । कृष्णनारायण कृष्णनारायण नरायण ॥ ५१॥ अनादिश्रीकृष्णनारायणस्वामिन् रमायण
    । इति धुन्यं ददौ तेभ्यः पावयित्वा ततो हरिः ॥ ५२॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    चतुर्थखण्डे ९४
meaning: {}
