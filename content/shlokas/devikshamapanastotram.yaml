id: devikshamapanastotram
category: stotram
name:
  english: devikshamapanastotram
  devanagari: देवीक्षमापनस्तोत्रम्
content:
  english: devikshamapanastotram shriganeshaya namah | aparadhasahasrani kriyante'harnisham maya | daso'yamiti
    mam mattva kshamasva parameshvari || 1|| avahanam na janami na janami visarjanam | pujam caiva na
    janami kshamyatam parameshvari || 2|| mantrahinam kriyahinam bhaktihinam sureshvari | yatpujitam maya
    devi paripurnam tadastu me || 3|| aparadhashatam kritva jagadambeti coccaret | yam gatim samavapnoti
    na tam brahmadayah surah || 4|| saparadho'smi sharanam praptastvam jagadambike | idanimanukampyo'ham
    yathecchasi tatha kuru || 5|| ajnanadvismriterbhrantya yannyunamadhikam kritam | tatsarvam kshamyatam
    devi prasida parameshvari || 6|| kameshvari jaganmatah saccidanandavigrahe | grihanarcamimam pritya
    prasida parameshvari || 7|| guhyatiguhyagoptri tvam grihanasmatkritam japam | siddhirbhavatu me devi
    tvaprasadatsureshvari || 8|| || iti devikshamapanastotram sampurnam ||
  devanagari: देवीक्षमापणस्तोत्रम् श्रीगणेशाय नमः । अपराधसहस्राणि क्रियन्तेऽहर्निशं मया । दासोऽयमिति मां
    मत्त्वा क्षमस्व परमेश्वरि ॥ १॥ आवाहनं न जानामि न जानामि विसर्जनम् । पूजां चैव न जानामि क्षम्यतां परमेश्वरि
    ॥ २॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वरि । यत्पूजितं मया देवि परिपूर्णं तदस्तु मे ॥ ३॥ अपराधशतं
    कृत्वा जगदम्बेति चोच्चरेत् । यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ॥ ४॥ सापराधोऽस्मि शरणं प्राप्तस्त्वां
    जगदम्बिके । इदानीमनुकम्प्योऽहं यथेच्छसि तथा कुरु ॥ ५॥ अज्ञानाद्विस्मृतेर्भ्रान्त्या यन्न्यूनमधिकं
    कृतम् । तत्सर्वं क्षम्यतां देवि प्रसीद परमेश्वरि ॥ ६॥ कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे । गृहाणार्चामिमां
    प्रीत्या प्रसीद परमेश्वरि ॥ ७॥ गुह्यातिगुह्यगोप्त्री त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि
    त्वप्रसादात्सुरेश्वरि ॥ ८॥ ॥ इति देवीक्षमापणस्तोत्रं सम्पूर्णम् ॥
