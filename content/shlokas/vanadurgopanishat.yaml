    ब्लूङ्कारमूरुद्वये । सः पादेऽपि च पञ्चबाणसदने बन्धूकपुष्पद्युतिं ध्यायेन्नग्ननिवर्तितेन पुलको गङ्गाप्रवाहो
    द्रवः ॥ ॐ नमो भगवते कामदेवाय द्रां द्रां द्रावणबाणाय द्रीं द्रीं सन्दीपनबाणाय क्लीं क्लीं सम्मोहनबाणाय
    ब्लूं ब्लूं सन्तापनबाणाय सः सः वशीकरणबाणाय ह्रीं ह्रीं मदनावेशबाणाय सकलजनचिन्तितं द्रावय द्रावय ।
