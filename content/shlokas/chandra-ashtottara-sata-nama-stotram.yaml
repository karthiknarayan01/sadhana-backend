id: chandra-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Chandra Ashtottara Sata Nama Stotram
content:
  english: shriman shashadharashcandro taradhisho nishakarah | sudhanidhih sadaradhyah satpatih sadhupujitah
    || || jitendriyo jagadyonih jyotishcakrapravartakah | vikartananujo viro vishvesho vidusham patih
    || || doshakaro dushtadurah pushtiman shishtapalakah | ashtamurtipriyo'nantakashtadarukutharakah ||
    || svaprakashah prakashatma dyucaro devabhojanah | kaladharah kalahetuh kamakritkamadayakah || ||
    mrityusamharako'martyo nityanushthanadayakah | kshapakarah kshinapapah kshayavriddhisamanvitah ||
    || jaivatrikah shuci shubhro jayi jayaphalapradah | sudhamayah surasvami bhaktanamishtadayakah ||
    || bhuktido muktido bhadro bhaktadaridryabhanjakah | samaganapriyah sarvarakshakah sagarodbhavah ||
    || bhayantakridbhaktigamyo bhavabandhavimocakah | jagatprakashakirano jagadanandakaranah || || nissapatno
    niraharo nirvikaro niramayah | bhucchaya''cchadito bhavyo bhuvanapratipalakah || || sakalartiharah
    saumyajanakah sadhuvanditah | sarvagamajnah sarvajno sanakadimunistutah || || sitacchatradhvajopetah
    sitango sitabhushanah | shvetamalyambaradharah shvetagandhanulepanah || || dashashvarathasamrudho
    dandapanih dhanurdharah | kundapushpojjvalakaro nayanabjasamudbhavah || || atreyagotrajo'tyantavinayah
    priyadayakah | karunarasasampurnah karkataprabhuravyayah || || caturashrasanarudhashcaturo divyavahanah
    | vivasvanmandalagneyavaso vasusamriddhidah || || maheshvarapriyo dantah merugotrapradakshinah | grahamandalamadhyastho
    grasitarko grahadhipah || || dvijarajo dyutilako dvibhujo dvijapujitah | audumbaranagavasa udaro rohinipatih
    || || nityodayo munistutyo nityanandaphalapradah | sakalahladanakarah palashasamidhapriyah || || evam
    nakshatranathasya namnamashtottaram shatam || iti shri candra ashtottarashatanama stotram |
  devanagari: श्रीमान् शशधरश्चन्द्रो ताराधीशो निशाकरः । सुधानिधिः सदाराध्यः सत्पतिः साधुपूजितः ॥ ॥ जितेन्द्रियो
    जगद्योनिः ज्योतिश्चक्रप्रवर्तकः । विकर्तनानुजो वीरो विश्वेशो विदुषां पतिः ॥ ॥ दोषाकरो दुष्टदूरः पुष्टिमान्
    शिष्टपालकः । अष्टमूर्तिप्रियोऽनन्तकष्टदारुकुठारकः ॥ ॥ स्वप्रकाशः प्रकाशात्मा द्युचरो देवभोजनः । कलाधरः
    कालहेतुः कामकृत्कामदायकः ॥ ॥ मृत्युसंहारकोऽमर्त्यो नित्यानुष्ठानदायकः । क्षपाकरः क्षीणपापः क्षयवृद्धिसमन्वितः
    ॥ ॥ जैवातृकः शुची शुभ्रो जयी जयफलप्रदः । सुधामयः सुरस्वामी भक्तनामिष्टदायकः ॥ ॥ भुक्तिदो मुक्तिदो
    भद्रो भक्तदारिद्र्यभञ्जकः । सामगानप्रियः सर्वरक्षकः सागरोद्भवः ॥ ॥ भयान्तकृद्भक्तिगम्यो भवबन्धविमोचकः
    । जगत्प्रकाशकिरणो जगदानन्दकारणः ॥ ॥ निस्सपत्नो निराहारो निर्विकारो निरामयः । भूच्छायाऽऽच्छादितो भव्यो
    भुवनप्रतिपालकः ॥ ॥ सकलार्तिहरः सौम्यजनकः साधुवन्दितः । सर्वागमज्ञः सर्वज्ञो सनकादिमुनिस्तुतः ॥ ॥ सितच्छत्रध्वजोपेतः
    सिताङ्गो सितभूषणः । श्वेतमाल्याम्बरधरः श्वेतगन्धानुलेपनः ॥ ॥ दशाश्वरथसंरूढो दण्डपाणिः धनुर्धरः । कुन्दपुष्पोज्ज्वलाकारो
    नयनाब्जसमुद्भवः ॥ ॥ आत्रेयगोत्रजोऽत्यन्तविनयः प्रियदायकः । करुणारससम्पूर्णः कर्कटप्रभुरव्ययः ॥ ॥ चतुरश्रासनारूढश्चतुरो
    दिव्यवाहनः । विवस्वन्मण्डलाग्नेयवासो वसुसमृद्धिदः ॥ ॥ महेश्वरप्रियो दान्तः मेरुगोत्रप्रदक्षिणः । ग्रहमण्डलमध्यस्थो
    ग्रसितार्को ग्रहाधिपः ॥ ॥ द्विजराजो द्युतिलको द्विभुजो द्विजपूजितः । औदुम्बरनगावास उदारो रोहिणीपतिः
    ॥ ॥ नित्योदयो मुनिस्तुत्यो नित्यानन्दफलप्रदः । सकलाह्लादनकरः पलाशसमिधप्रियः ॥ ॥ एवं नक्षत्रनाथस्य
    नाम्नामष्टोत्तरं शतम् ॥ इति श्री चन्द्र अष्टोत्तरशतनाम स्तोत्रम् ।
