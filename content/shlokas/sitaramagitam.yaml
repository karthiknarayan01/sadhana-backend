id: sitaramagitam
category: stotram
name:
  english: sitaramagitam
  devanagari: सितरमगीतम्
content:
  english: shrisitarama gitam kamala locanau rama kamcanambarau kavacabhushanau rama karmukanvitau | kalushasamharau
    rama kamitapradau rahasi naumi tau sitaramalakshmanau || 1 || makarakundalau rama maulisevitau manikiritinau
    rama manjubhashinau | manukulodbhavau rama manushottamau rahasi naumi tau sitaramalakshmanau || 2
    || satyasampannau rama samarabhikarau sarvarakshanau rama sarvabhushanau | satyamanasau rama sarvaposhitau
    rahasi naumi tau sitaramalakshmanau || 3 || dhritashikhandinau rama dinarakshakau dhritahimacalau
    rama divyavigrahau | vividhapujitau rama dirghadoryugau rahasi naumi tau sitaramalakshmanau || 4 ||
    bhuvanajanukau rama padacarinau prithushilimukau rama papananghrikau | paramasatvikau rama bhaktavatsalau
    rahasi naumi tau sitaramalakshmanau || 5 || vanaviharinau rama valkalambarau vanaphalashinau rama
    vasavarcitau | varagunakarau rama valimardanau rahasi naumi tau sitaramalakshmanau || 6 || dasharathatmajau
    rama pashupatipriyau shashinivasinau rama vishadamanasau | dashamukhantakau rama nishitasayakau rahasi
    naumi tau sitaramalakshmanau || 7 || kamala locanau rama samarapanditau bhimavigrahau rama kamasundarau
    | damabhushanau rama hemanupurau rahasi naumi tau sitaramalakshmanau || 8 || bharatasevitau rama duritamocakau
    karadhritashugau rama sukarastutau | sharadhi dharanau rama dhirakavacinau rahasi naumi tau sitaramalakshmanau
    || 9 || dharmacarinau rama karmasakshinau dharmakarmukhau rama sharmadayakau | dharmashobhitau rama
    karmamodinau rahasi naumi tau sitaramalakshmanau || 10 || niladehinau rama lolakundalau kalabhikarau
    rama valimardanau | kalushaharinau rama lalitabhushanau rahasi naumi tau sitaramalakshmanau || 11
    || matrinandanau rama bhadrabalakau bhratri sammatau rama shatrusudakau | bhratrishekharau rama setunayakau
    rahasi naumi tau sitaramalakshmanau || 12 || sharadhibandhanau rama dalitadanavau kulavivardhanau
    rama balavirajitau | solajajitau rama balavirajitau rahasi naumi tau sitaramalakshmanau || 13 || rajalakshanau
    rama vijaya kankshinau gajavararuhau rama pujitamarau | vijitamatsarau rama bhajitavaranau rahasi
    naumi tau sitaramalakshmanau || 14 || sarvamanitau rama sarvakarinau garvabhanjanau rama nirvikaranau
    | durvibhasitau rama sarvabhasakau rahasi naumi tau sitaramalakshmanau || 15 || ravikulodbhavau rama
    bhavavinashakau kanakashritau rama padakoshakau | ravisutapriyau rama kavibhiriditau rahasi naumi
    tau sitaramalakshmanau || 16 || rama raghava sita rama raghava rama raghava sita rama raghava | krishnakeshava
    radha krishnakeshava krishnakeshava radha krishnakeshava || 17 || sitarama sitarama sitarama sitarama
    sitarama sitarama sitarama sitarama | sitarama sitarama sitarama sitarama sitarama sitarama sitarama
    sitarama || 18 ||
  devanagari: श्रीसीताराम गीतम् कमल लोचनौ राम कांचनाम्बरौ कवचभूषणौ राम कार्मुकान्वितौ । कलुषसंहारौ राम
    कामितप्रदौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ १ ॥ मकरकुण्डलौ राम मौलिसेवितौ मणिकिरीटिनौ राम मञ्जुभाषिणौ
    । मनुकुलोद्भवौ राम मानुषोत्तमौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ २ ॥ सत्यसम्पन्नौ राम समरभीकरौ सर्वरक्षणौ
    राम सर्वभूषणौ । सत्यमानसौ राम सर्वपोषितौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ३ ॥ धृतशिखण्डिनौ राम दीनरक्षकौ
    धृतहिमाचलौ राम दिव्यविग्रहौ । विविधपूजितौ राम दीर्घदोर्युगौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ४ ॥ भुवनजानुकौ
    राम पादचारिणौ पृथुशिलीमुकौ राम पापनाङ्घ्रिकौ । परमसात्विकौ राम भक्तवत्सलौ रहसि नौमि तौ सीतारामलक्ष्मणौ
    ॥ ५ ॥ वनविहारिणौ राम वल्कलांबरौ वनफलाशिनौ राम वासवार्चितौ । वरगुणाकरौ राम वालिमर्दनौ रहसि नौमि तौ
    सीतारामलक्ष्मणौ ॥ ६ ॥ दशरथात्मजौ राम पशुपतिप्रियौ शशिनिवासिनौ राम विशदमानसौ । दशमुखान्तकौ राम निशितसायकौ
    रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ७ ॥ कमल लोचनौ राम समरपण्डितौ भीमविग्रहौ राम कामसुन्दरौ । दामभूषणौ राम
    हेमनूपुरौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ८ ॥ भरतसेवितौ राम दुरितमोचकौ करधृताशुगौ राम सूकरस्तुतौ ।
    शरधि धारणौ राम धीरकवचिनौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ९ ॥ धर्मचारिणौ राम कर्मसाक्षिणौ धर्मकार्मुखौ
    राम शर्मदायकौ । धर्मशोभितौ राम कर्ममोदिनौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ १० ॥ नीलदेहिनौ राम लोलकुन्दलौ
    कालभीकरौ राम वालिमर्दनौ । कलुषहारिणौ राम ललितभूषणौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ ११ ॥ मातृनन्दनौ
    राम भाद्रबालकौ भ्रातॄ सम्मतौ राम शत्रुसूदकौ । भ्रातृशेखरौ राम सेतुनायकौ रहसि नौमि तौ सीतारामलक्ष्मणौ
    ॥ १२ ॥ शरधिबन्धनौ राम दलितदानवौ कुलविवर्धनौ राम बलविराजितौ । सोलजाजितौ राम बलविराजितौ रहसि नौमि तौ
    सीतारामलक्ष्मणौ ॥ १३ ॥ राजलक्षणौ राम विजय काङ्क्षिणौ गजवरारुहौ राम पूजितामरौ । विजितमत्सरौ राम भजितवारणौ
    रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ १४ ॥ सर्वमानितौ राम सर्वकारिणौ गर्वभञ्जनौ राम निर्विकारणौ । दुर्विभासितौ
    राम सर्वभासकौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ १५ ॥ रविकुलोद्भवौ राम भवविनाशकौ कानकाश्रितौ राम पादकोशकौ
    । रविसुतप्रियौ राम कविभिरीडितौ रहसि नौमि तौ सीतारामलक्ष्मणौ ॥ १६ ॥ राम राघव सीता राम राघव राम राघव
    सीता राम राघव । कृष्णकेशव राधा कृष्णकेशव कृष्णकेशव राधा कृष्णकेशव ॥ १७ ॥ सीताराम सीताराम सीताराम सीताराम
    सीताराम सीताराम सीताराम सीताराम । सीताराम सीताराम सीताराम सीताराम सीताराम सीताराम सीताराम सीताराम
    ॥ १८ ॥
