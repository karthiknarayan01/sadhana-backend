id: janakisharanagatipancakam-athava-janakicaramasharanagatamantrah
category: mantra
name:
  english: janakisharanagatipancakam athava janakicaramasharanagatamantrah
  devanagari: जानकीशरणागतिपञ्चकम् अथवा जानकीचरमशरणागतमन्त्रः
content:
  english: papanam va shubhanam va vadharharnam plavangama | karyam karunyamaryena na kashcinnaparadhyati
    || atha sharanagati pancakam | om sarvajiva sharanye shrisite vatsalya sagare | matrimaithili saulabhye
    raksha mam sharanagatam || 1|| koti kandarpa lavanyam saundaryyaika svarupatam | sarvamangala mangalyam
    bhumijam sharanam vraje || 2|| om sharanagatadinarta paritranaparayanam | sarvasyarti harenaika dhritavratam
    sharanam vraje || 3|| om sitam videhatanayam ramasya dayitam shubham | hanumata samashvastam bhumijam
    sharanam vraje || 4|| om asmin kalimala kirne kaleghorabhavarnave | prapannanam gatirnasti shrimadramapriyam
    vina || 5|| || iti janakicaramasharanagatamantrah ||
  devanagari: पापानां वा शुभानां वा वधार्हार्णां प्लवङ्गम । कार्यं कारुण्यमार्येण न कश्चिन्नापराध्यति
    ॥ अथ शरणागति पञ्चकम् । ॐ सर्वजीव शरण्ये श्रीसीते वात्सल्य सागरे । मातृमैथिलि सौलभ्ये रक्ष मां शरणागतम्
    ॥ १॥ कोटि कन्दर्प लावण्यां सौन्दर्य्यैक स्वरूपताम् । सर्वमङ्गल माङ्गल्यां भूमिजां शरणं व्रजे ॥ २॥
    ॐ शरणागतदीनार्त परित्राणपरायणम् । सर्वस्यार्ति हरेणैक धृतव्रतां शरणं व्रजे ॥ ३॥ ॐ सीतां विदेहतनयां
    रामस्य दयितां शुभाम् । हनुमता समाश्वस्तां भूमिजां शरणं व्रजे ॥ ४॥ ॐ अस्मिन् कलिमला कीर्णे कालेघोरभवार्णवे
    । प्रपन्नानां गतिर्नास्ति श्रीमद्रामप्रियां विना ॥ ५॥ ॥ इति जानकीचरमशरणागतमन्त्रः ॥
