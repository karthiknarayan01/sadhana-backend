id: sharikakavacam
category: kavacha
name:
  english: sharikakavacam
  devanagari: शारिकाकवचम्
content:
  english: rinu deveshi sharikakavacam param | trailokyamohanam nama mulamantramayam param || 1|| asya
    shravanamatrena sarvayajnaphalam labhet | sarvapattaranam divyam sarvasiddhipradam kalau || 2|| sarvasvam
    me rahasyam me paramam paramadbhutam | dharanadasya deveshi vishnuna sa jalodbhavah || 3|| danavendro
    hatah shighramandhakaro yathenduna | mayapi tripuradhyaksho danavo jishnuna balah || 4|| jambho vritrasuro
    devi prabhavadasya varmanah | kavacasyasya deveshi rishirbhairava iritah || 5|| trishtupchando devata
    ca trailokyamohinishvari | sharika sharma bijam ca mashaktih kilakam gajah || 6|| trailokyamohavidyarthe
    viniyogah prakirtitah | om me durga shirah payadekaksharavibhushana || 7|| om hrim candi lalatam me
    jagadullasarupini | om hrim shrim tryakshara patu bhruvau me bhagamalini || 8|| om hrim shrim hum
    ca netre'vyatsarvamangalamangala | om hrim shrim hum phrama'vyanme shruti shankaravallabha || 9||
    om hrim shrim hum phram am patu nasam narayaneshvari | om hrim shrim hum phram am sham me patu vaktram
    sarasvati || 10|| am am im im radanpatu matrika shekhareshvari | um um rim rim lim lim em aim payadoshthau
    bhavapriya || 11|| om aum am ah galam patu nilakanthasaneshvari | kam kham gam gham nam me patu skandhau
    skandasamarcita || 12|| cam cham jam jham nam me payadvaksho vamapriyambika | tam tham dam dham nam
    me payatparshvau parvatanandini || 13|| tam tham dam dham nam me patu kukshim kulakuleshvari | pam
    pham bam bham mam me patu nabhim naradasevita || 14|| yam ram lam vam gudam patu guhyakeshvarapujita
    | sham sham sam ham katim patu devi katyayani tatha || 15|| ḻam kshah uru sada patu sarvasarasvataprada
    | om sham janu shiva patu om am janghe'vataduma || 16|| om phram padau sada patu rajamatangini mama
    | om hum padadimurdhantam vapurme patu kubjika || 17|| om shrim murdhadipadantam vapurme
  devanagari: ृणु देवेशि शारिकाकवचं परम् । त्रैलोक्यमोहनं नाम मूलमन्त्रमयं परम् ॥ १॥ अस्य श्रवणमात्रेण
    सर्वयज्ञफलं लभेत् । सर्वापत्तारणं दिव्यं सर्वसिद्धिप्रदं कलौ ॥ २॥ सर्वस्वं मे रहस्यं मे परमं परमाद्भुतम्
    । धारणादस्य देवेशि विष्णुना स जलोद्भवः ॥ ३॥ दानवेन्द्रो हतः शीघ्रमन्धकारो यथेन्दुना । मयापि त्रिपुराध्यक्षो
    दानवो जिष्णुना बलः ॥ ४॥ जम्भो वृत्रासुरो देवि प्रभावादस्य वर्मणः । कवचस्यास्य देवेशि ऋषिर्भैरव ईरितः
    ॥ ५॥ त्रिष्टुप्छन्दो देवता च त्रैलोक्यमोहिनीश्वरी । शारिका शर्म बीजं च माशक्तिः कीलकं गजः ॥ ६॥ त्रैलोक्यमोहविद्यार्थे
    विनियोगः प्रकीर्तितः । ॐ मे दुर्गा शिरः पायादेकाक्षरविभूषणा ॥ ७॥ ॐ ह्रीं चण्डी ललाटं मे जगदुल्लासरूपिणी
    । ॐ ह्रीं श्रीं त्र्यक्षरा पातु भ्रुवौ मे भगमालिनी ॥ ८॥ ॐ ह्रीं श्रीं हूं च नेत्रेऽव्यात्सर्वमङ्गलमङ्गला
    । ॐ ह्रीं श्रीं हूं फ्रामऽव्यान्मे श्रुती शङ्करवल्लभा ॥ ९॥ ॐ ह्रीं श्रीं हूं फ्रां आं पातु नासां नारायणेश्वरी
    । ॐ ह्रीं श्रीं हूं फ्रां आं शां मे पातु वक्त्रं सरस्वती ॥ १०॥ अं आं इं ईं रदान्पातु मातृका शेखरेश्वरी
    । उं ऊं ऋं ॠं ऌं ॡं एं ऐं पायादोष्ठौ भवप्रिया ॥ ११॥ ॐ औं अं अः गलं पातु नीलकण्ठासनेश्वरी । कं खं गं
    घं ङं मे पातु स्कन्धौ स्कन्दसमर्चिता ॥ १२॥ चं छं जं झं ञं मे पायाद्वक्षो वामप्रियाम्बिका । टं ठं डं
    ढं णं मे पायात्पार्श्वौ पर्वतनन्दिनी ॥ १३॥ तं थं दं धं नं मे पातु कुक्षिं कुलाकुलेश्वरी । पं फं बं
    भं मं मे पातु नाभिं नारदसेविता ॥ १४॥ यं रं लं वं गुदं पातु गुह्यकेश्वरपूजिता । शं षं सं हं कटिं पातु
    देवी कात्यायनी तथा ॥ १५॥ ळं क्षः ऊरू सदा पातु सर्वसारस्वतप्रदा । ॐ शां जानू शिवा पातु ॐ आं जङ्घेऽवतादुमा
    ॥ १६॥ ॐ फ्रां पादौ सदा पातु राजमातङ्गिनी मम । ॐ हूं पादादिमूर्धान्तं वपुर्मे पातु कुब्जिका ॥ १७॥ ॐ
    श्रीं मूर्धादिपादान्तं वपुर्मे
