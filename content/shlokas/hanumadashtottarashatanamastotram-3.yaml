id: hanumadashtottarashatanamastotram-3
category: stotram
name:
  english: hanumadashtottarashatanamastotram 3
  devanagari: हनुमदष्टोत्तरशतनामस्तोत्रम् ३
content:
  english: atipatalavaktrabjam dhritahemadrivigraham | anjaneyam shankhacakrapanim cetasi dhimahi || 1||
    om parijatapriyo yogi hanuman nriharipriyah | plavagendrah pingalakshah shighragami dridhavratah ||
    2|| shankhacakravarabhitipaniranandadayakah | sthayi vikramasampanno ramaduto mahayashah || 3|| saumitrijivanakaro
    lankavikshobhakarakah | udadhikramanah sitashokahetuharo harih || 4|| bali rakshasasamharta dashakanthamadapahah
    | buddhiman nairritavadhukanthasutravidarakah || sugrivasacivo bhimo bhimasenasahodarah | savitravidyasamsevi
    caritartho mahodayah || 6|| vasavabhishtado bhavyo hemashailanivasavan | kimshukabho'grayatanu rijuroma
    mahamatih || 7|| mahakramo vanacarah sthirabuddhirabhishuman | simhikagarbhanirbhetta bhetta lankanivasinam
    || 8|| akshashatruvinighnashca raksho'matyabhayavahah | viraha mriduhastashca padmapanirjatadharah
    || 9|| sarvapriyah sarvakamapradah pramshumukhashshucih | vishuddhatma vijvarashca satavan pataladharah
    || 10|| bharatapremajanakashciravasa mahokshadhrik | mahastrabandhanasaho brahmacari yatishvarah ||
    11|| mahaushadhopaharta ca vrishaparva vrishodarah | suryopalalitah svami parijatavatamsakah || 12||
    sarvapranadharo'nantah sarvabhutadigo manuh | raudrakritirbhimakarma bhimaksho bhimadarshanah || 13||
    sudarshanakaro'vyakto vyaktasyo dundubhisvanah | suvelacari mainakaharshado harshanapriyah || 14||
    sulabhah suvrato yogi yogisevyo bhayapahah | valagnimathitanekalankavasigrihoccayah || 15|| vardhano
    vardhamanashca rocishnu romasho mahan | mahadamshtro mahashurah sadgatih satparayanah || saumyadarshi
    saumyavesho hemayajnopavitiman | maunjikrishnajinadharo mantrajno mantrasarathih | jitaratih shadurmishca
    sarvapriyahite ratah || 17|| etairnamapadairdivyairyah stauti tava sannidhau | hanumamstasya kim nama
    no bhavedbhaktishalinah || 18|| pranavam ca puraskritya caturthyantairnamo'ntakaih | etairnamabhiravyagrairucyate
    hanuman bhavan || 19|| rinarogadidaridryapapakshudapamrityavah | vinashyanti hanumamste namasankirtanakshane
    || 20|| bhagavan hanuman nityam rajavashyam tathaiva ca | lakshmivashyam ca shrivashyamarogyam dirghamayusham
    || 21|| pradhanyam sakalanam ca jnatipradhanyameva ca | viryam tejashca bhaktanam prayacchasi mahamate
    || 22||
  devanagari: अतिपाटलवक्त्राब्जं धृतहेमाद्रिविग्रहम् । आञ्जनेयं शङ्खचक्रपाणिं चेतसि धीमहि ॥ १॥ ॐ पारिजातप्रियो
    योगी हनूमान् नृहरिप्रियः । प्लवगेन्द्रः पिङ्गलाक्षः शीघ्रगामी दृढव्रतः ॥ २॥ शङ्खचक्रवराभीतिपाणिरानन्ददायकः
    । स्थायी विक्रमसम्पन्नो रामदूतो महायशाः ॥ ३॥ सौमित्रिजीवनकरो लङ्काविक्षोभकारकः । उदधिक्रमणः सीताशोकहेतुहरो
    हरिः ॥ ४॥ बली राक्षससंहर्ता दशकण्ठमदापहः । बुद्धिमान् नैरृतवधूकण्ठसूत्रविदारकः ॥ सुग्रीवसचिवो भीमो
    भीमसेनसहोदरः । सावित्रविद्यासंसेवी चरितार्थो महोदयः ॥ ६॥ वासवाभीष्टदो भव्यो हेमशैलनिवासवान् । किंशुकाभोऽग्रयतनू
    ऋजुरोमा महामतिः ॥ ७॥ महाक्रमो वनचरः स्थिरबुद्धिरभीशुमान् । सिंहिकागर्भनिर्भेत्ता भेत्ता लङ्कानिवासिनाम्
    ॥ ८॥ अक्षशत्रुविनिघ्नश्च रक्षोऽमात्यभयावहः । वीरहा मृदुहस्तश्च पद्मपाणिर्जटाधरः ॥ ९॥ सर्वप्रियः सर्वकामप्रदः
    प्रांशुमुखश्शुचिः । विशुद्धात्मा विज्वरश्च सटावान् पाटलाधरः ॥ १०॥ भरतप्रेमजनकश्चीरवासा महोक्षधृक्
    । महास्त्रबन्धनसहो ब्रह्मचारी यतीश्वरः ॥ ११॥ महौषधोपहर्ता च वृषपर्वा वृषोदरः । सूर्योपलालितः स्वामी
    पारिजातावतंसकः ॥ १२॥ सर्वप्राणधरोऽनन्तः सर्वभूतादिगो मनुः । रौद्राकृतिर्भीमकर्मा भीमाक्षो भीमदर्शनः
    ॥ १३॥ सुदर्शनकरोऽव्यक्तो व्यक्तास्यो दुन्दुभिस्वनः । सुवेलचारी मैनाकहर्षदो हर्षणप्रियः ॥ १४॥ सुलभः
    सुव्रतो योगी योगिसेव्यो भयापहः । वालाग्निमथितानेकलङ्कावासिगृहोच्चयः ॥ १५॥ वर्धनो वर्धमानश्च रोचिष्णू
    रोमशो महान् । महादंष्ट्रो महाशूरः सद्गतिः सत्परायणः ॥ सौम्यदर्शी सौम्यवेषो हेमयज्ञोपवीतिमान् । मौञ्जीकृष्णाजिनधरो
    मन्त्रज्ञो मन्त्रसारथिः । जितारातिः षडूर्मिश्च सर्वप्रियहिते रतः ॥ १७॥ एतैर्नामपदैर्दिव्यैर्यः स्तौति
    तव सन्निधौ । हनुमंस्तस्य किं नाम नो भवेद्भक्तिशालिनः ॥ १८॥ प्रणवं च पुरस्कृत्य चतुर्थ्यन्तैर्नमोऽन्तकैः
    । एतैर्नामभिरव्यग्रैरुच्यते हनुमान् भवान् ॥ १९॥ ऋणरोगादिदारिद्र्यपापक्षुदपमृत्यवः । विनश्यन्ति हनुमंस्ते
    नामसङ्कीर्तनक्षणे ॥ २०॥ भगवन् हनुमन् नित्यं राजवश्यं तथैव च । लक्ष्मीवश्यं च श्रीवश्यमारोग्यं दीर्घमायुषम्
    ॥ २१॥ प्राधान्यं सकलानां च ज्ञातिप्राधान्यमेव च । वीर्यं तेजश्च भक्तानां प्रयच्छसि महामते ॥ २२॥
