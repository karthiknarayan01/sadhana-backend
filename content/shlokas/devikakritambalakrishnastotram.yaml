id: devikakritambalakrishnastotram
category: stotram
name:
  english: devikakritambalakrishnastotram
  devanagari: देविकाकृतंबालकृष्णस्तोत्रम्
content:
  english: '| kshamadhvam caparadhanme doshan kshamadhvamishvarah || 42|| sadhavo rishayah sarve raja
    rajni ca vaishnavah | sakhijanah sakhayashca kshamadhvam me''paradhakan || 43|| aham nanakininamni
    khavasini pura''bhavam | bhanavanisakhi rajnya dineshvaryashca kinkari || 44|| svarthapara stainyapara
    dharmadhana''vacorika | sa''ham mrita yamyadutairnita yamyapuram tatah || 45|| bhuktva papaphalam
    tasmajjanmartham tviha ca''''gata | grihagodha karmavashajjata''vasheshabhogini || 46|| pujavarisprishtadeha
    mrita''tra kripaya muneh | prasadashanato nashta vasana mama sarvatha || 47|| bahupunya''smi sanjata
    kathayah shravanadiha | divya devyasmi sanjata kripaya lomashasya ca || 48|| mokshamicchami gantum
    vai necchami svargamityapi | mahyam mantram hareshcapi namadhunyam prapattidam || 49|| lomasho''yam
    dadatvatra yena yami para''ksharam | namami padayorvashca kinkari devika''smi ca || 50|| iti shrilakshminarayaniyasamhitayah
    tishyasantanatmakasya caturthakhande 70'
  devanagari: । क्षमध्वं चापराधान्मे दोषान् क्षमध्वमीश्वराः ॥ ४२॥ साधवो ऋषयः सर्वे राजा राज्ञी च वैष्णवाः
    । सखीजनाः सखायश्च क्षमध्वं मेऽपराधकान् ॥ ४३॥ अहं नाणकिनीनाम्नी खवासिनी पुराऽभवम् । भाणवाणीसखी राज्ञ्या
    दिनेश्वर्याश्च किङ्करी ॥ ४४॥ स्वार्थपरा स्तैन्यपरा धर्मधनाऽवचोरिका । साऽहं मृता याम्यदूतैर्नीता याम्यपुरं
    ततः ॥ ४५॥ भुक्त्वा पापफलं तस्माज्जन्मार्थं त्विह चाऽऽगता । गृहगोधा कर्मवशाज्जाताऽवशेषभोगिनी ॥ ४६॥
    पूजावारिस्पृष्टदेहा मृताऽत्र कृपया मुनेः । प्रसादाशनतो नष्टा वासना मम सर्वथा ॥ ४७॥ बहुपुण्याऽस्मि
    सञ्जाता कथायाः श्रवणादिह । दिव्या देव्यस्मि सञ्जाता कृपया लोमशस्य च ॥ ४८॥ मोक्षमिच्छामि गन्तुं वै
    नेच्छामि स्वर्गमित्यपि । मह्यं मन्त्रं हरेश्चापि नामधुन्यं प्रपत्तिदम् ॥ ४९॥ लोमशोऽयं ददात्वत्र येन
    यामि पराऽक्षरम् । नमामि पादयोर्वश्च किङ्करी देविकाऽस्मि च ॥ ५०॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    चतुर्थखण्डे ७०
meaning: {}
