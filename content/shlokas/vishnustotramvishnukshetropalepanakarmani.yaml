id: vishnustotramvishnukshetropalepanakarmani
category: stotram
name:
  english: vishnustotramvishnukshetropalepanakarmani
  devanagari: विष्णुस्तोत्रंविष्णुक्षेत्रोपलेपनकर्मणि
content:
  english: riktayastu tithermadhye kuryatsankalpamatmanah | upalepanakridvipro vishnorayatane bhuvi ||
    22|| dvitiye'hni tato devam pranamya yatamanasah | dharanipitaram vishnumidam vakyamudirayet || 23||
    tvam sarvabhutaprabhavo jagatpate tvayyetadishesha jagatpratishthitam | tvameva bhutani yatastato'ham
    tvam pujayamyadya mahisvarupam || 24|| tvam mahi jagatam natha sarvanatha namo'stu te | shushrushitah
    prasidesha bhuvo lepanakarmana || 25|| iti vishnudharmeshu ekatrimsho'dhyayantargatam vishnustotram
    sampurnam |
  devanagari: रिक्तायास्तु तिथेर्मध्ये कुर्यात्सङ्कल्पमात्मनः । उपलेपनकृद्विप्रो विष्णोरायतने भुवि ॥ २२॥
    द्वितीयेऽह्नि ततो देवं प्रणम्य यतमानसः । धरणीपितरं विष्णुमिदं वाक्यमुदीरयेत् ॥ २३॥ त्वं सर्वभूतप्रभवो
    जगत्पते त्वय्येतदीशेश जगत्प्रतिष्ठितम् । त्वमेव भूतानि यतस्ततोऽहं त्वां पूजयाम्यद्य महीस्वरूपम् ॥
    २४॥ त्वं मही जगतां नाथ सर्वनाथ नमोऽस्तु ते । शुश्रूषितः प्रसीदेश भुवो लेपनकर्मणा ॥ २५॥ इति विष्णुधर्मेषु
    एकत्रिंशोऽध्यायान्तर्गतं विष्णुस्तोत्रं सम्पूर्णम् ।
meaning: {}
