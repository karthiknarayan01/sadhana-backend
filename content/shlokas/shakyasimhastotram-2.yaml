id: shakyasimhastotram-2
category: stotram
name:
  english: shakyasimhastotram 2
  devanagari: शाक्यसिंहस्तोत्रम् २
content:
  english: shakyasimhastotram 2 namami tam bhikshuganairupetam tathagatairvrikshatale nishannam | anantarodiritalakshmabhajau
    padau yadiyavupajatayastah || 1|| shakyendravamshalalitavatamsamamshadhikabham kanakadhikabham | namami
    buddham hyupajatisiddham sarvarthasiddhakhyakumaravaryam || 2|| namami nityam niravadyavrittam niranjanam
    nirmaladeharupam | nihsheshasattvoddharanaikacittam candrananam shubhrapadaravindam || 3|| shauddhodanim
    gautamipalaniyam mayasutam marajitam mahantam | maheshvaradyairmahaniyamurtimameyamahatmyamameyadharmam
    || 4|| bhavodadhestirnamanantapunyam bhavadidevairabhivandyapadam | anantabhavyakritibhavaniyam tam
    naumi bhavyojjvalabhushitangam || 5|| babhana vamshasthaviro nripadhipo janan pratityahvayatatmajam
    mama | kritaribhangam jinarajamishvaram gatam shadabdam ca viyogabhavayoh || 6|| bhajasva vamshasthaviram
    munishvaram mahavane vrikshatale shucisthale | jagaddhitam yajjanana jarantakam jagajjananya varadakshaparshvajam
    || 7|| shakyendravamshodadhicandramudgatam shrishakyasimham caturananaih stuvan | prashishta brahma
    caturananam svakam caturgunam punyamavaptamityaho || 8|| daityendravamshagnirasau janardano dvabhyam
    vidhayanjalimambujasanam | doshnamamamsaccaturashcaturbhujad dvaigunyamaptam sukritam mayeti || 9||
    iti chando'mritoddhritam shrishakyasimhastotram sampurnam ||
  devanagari: शाक्यसिंहस्तोत्रम् २ नमामि तं भिक्षुगणैरूपेतं तथागतैर्वृक्षतले निषण्णम् । अनन्तरोदीरितलक्ष्मभाजौ
    पादौ यदीयावुपजातयस्ताः ॥ १॥ शाक्येन्द्रवंशाललितावतंसमंशाधिकाभं कनकाधिकाभम् । नमामि बुद्धं ह्युपजातिसिद्धं
    सर्वार्थसिद्धाख्यकुमारवर्यम् ॥ २॥ नमामि नित्यं निरवद्यवृत्तं निरञ्जनं निर्मलदेहरूपम् । निःशेषसत्त्वोद्धरणैकचित्तं
    चन्द्राननं शुभ्रपदारविन्दम् ॥ ३॥ शौद्धोदनिं गौतमिपालनीयं मायासुतं मारजितं महान्तम् । महेश्वराद्यैर्महनीयमूर्तिममेयमाहात्म्यममेयधर्मम्
    ॥ ४॥ भवोदधेस्तीर्णमनन्तपुण्यं भवादिदेवैरभिवन्द्यपादम् । अनन्तभव्याकृतिभावनीयं तं नौमि भव्योज्ज्वलभूषिताङ्गम्
    ॥ ५॥ बभाण वंशस्थविरो नृपाधिपो जनान् प्रतीत्याह्वयतात्मजं मम । कृतारिभङ्गं जिनराजमीश्वरं गतं षडब्दं
    च वियोगभावयोः ॥ ६॥ भजस्व वंशस्थविरं मुनीश्वरं महावने वृक्षतले शुचिस्थले । जगद्धितं यज्जनन जरान्तकं
    जगज्जनन्या वरदक्षपार्श्वजम् ॥ ७॥ शाक्येन्द्रवंशोदधिचन्द्रमुद्गतं श्रीशाक्यसिंहं चतुराननैः स्तुवन्
    । प्राशिष्ट ब्रह्मा चतुराननं स्वकं चतुर्गुणं पुण्यमवाप्तमित्यहो ॥ ८॥ दैत्येन्द्रवंशाग्निरसौ जनार्दनो
    द्वाभ्यां विधायाञ्जलिमम्बुजासनम् । दोष्णाममंसच्चतुरश्चतुर्भुजाद् द्वैगुण्यमाप्तं सुकृतं मयेति ॥ ९॥
    इति छन्दोऽमृतोद्धृतं श्रीशाक्यसिंहस्तोत्रं सम्पूर्णम् ॥
