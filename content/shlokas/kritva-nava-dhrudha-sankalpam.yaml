id: kritva-nava-dhrudha-sankalpam
category: stotram
name:
  english: Kritva Nava Dhrudha Sankalpam
content:
  english: kritva navadridhasankalpam vitaranto navasandesham ghatayamo nava sanghatanam racayamo navamitihasam
    || navamanvantara shilpinah rashtrasamunnati kankshinah tyagadhanah karyekaratah kritinipunah vayamavishannah
    || kritva || bhedabhavanam nirasayantah dinadaridran samuddharantah duhkhavitaptan samashvasantah
    kritasankalpan sada smarantah || kritva || pragatipathannahi vicalema paramparam samrakshema samotsahino
    nirudvegino nitya nirantara gatishilah || kritva || racana
  devanagari: कृत्वा नवदृढसङ्कल्पम् वितरन्तो नवसन्देशम् घटयामो नव सङ्घटनम् रचयामो नवमितिहासम् ॥ नवमन्वन्तर
    शिल्पीनः राष्ट्रसमुन्नति काङ्क्षिणः त्यागधनाः कार्येकरताः कृतिनिपुणाः वयमविषण्णाः ॥ कृत्वा ॥ भेदभावनां
    निरासयन्तः दिनदरिद्रान् समुद्धरन्तः दुःखवितप्तान् समाश्वसन्तः कृतसङ्कल्पान् सदा स्मरन्तः ॥ कृत्वा
    ॥ प्रगतिपथान्नहि विचलेम परम्परां संरक्षेम समोत्साहिनो निरुद्वेगीनो नित्य निरन्तर गतिशीलाः ॥ कृत्वा
    ॥ रचन
