    | tirodhanashakti | anugrahashakti | hrillekhe | mahalekhe | vagishi | varneshi | matrike | svare
    | vyanjane | bije | nade | bindau | kalayai | kalatitayai | vimarshini | samvidrupini | mahacidakasharupini
    | aksharabrahmasvarupini | sarvajnanapradacakrasvamini | animasiddhe | mahimasiddhe | garimasiddhe
    | laghimasiddhe | praptisiddhe | prakamyasiddhe | ishitvasiddhe | vashitvasiddhe | kamavasayitasiddhe
    | duradarshanasiddhe | durashravanasiddhe | manojavasiddhe | parakayapraveshasiddhe | trikalajnanasiddhe
    | vaksiddhe | lekhanasiddhe | granthasiddhe | kavyasiddhe | mantrasiddhe | tantrasiddhe | yantrasiddhe
    | yogasiddhe | samadhisiddhe | nirvikalpasiddhe | brahmasakshatkarasiddhe | sarvasiddhiprade | sarvasiddhipradacakrasvamini
