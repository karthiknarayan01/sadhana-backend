id: annamayya-keerthanas-alara-chanchalamaina
category: stotram
name:
  english: Annamayya Keerthanas Alara Chanchalamaina
content:
  english: khanda capu pallavi alara cancalamaina atmalandunda ni yalavatu cesè ni vuyyala | palumaru
    nucchvasa pavanamandunda ni bhavambu dèlipè ni vuyyala || udayasta shailambu lònara kambhamulaina
    vudumandalamu mocè nuyyala | adana akashapadamu addaudulambaina akhilambu nindè ni vuyyala || padilamuga
    vedamulu bangaru cerulai patti vèrapai tocè vuyyala | vadalakitu dharmadevata pithamai migula varnimpa
    narudayè vuyyala || melu katlayi miku meghamandalamèlla mèrugunaku mèrugayè vuyyala | nila shailamuvanti
    ni menikantiki nijamaina tòdavayè vuyyala || alara cancalamaina atmalandunda ni yalavatu cesè ni vuyyala
    | palumaru nucchvasa pavanamandunda ni bhavambu dèlipè ni vuyyala || palindlu kadalaga payyadalu rapada
    bhaminulu vadinucu vuyyala | voli brahmandamulu vòraguvo yani bhiti nòyya nòyyanairi vuciruyyala ||
    caranam kamalakunu bhupatiki kadalu kadalaku mimmu kaugalimpagajesè nuyyala | amaranganalaku ni hasa
    bhava vilasa mandanda cupè ni vuyyala || caranam kamalasanadulaku kannula pandugai ganutimpa narudayè
    vuyyala | kamaniya murti venkatashailapati niku kaduvedukai vundè vuyyala ||
  devanagari: खण्ड चापु पल्लवि अलर चञ्चलमैन आत्मलन्दुण्ड नी यलवाटु चेसॆ नी वुय्याल । पलुमारु नुच्छ्वास
    पवनमन्दुण्ड नी भावम्बु दॆलिपॆ नी वुय्याल ॥ उदायास्त शैलम्बु लॊनर कम्भमुलैन वुडुमण्डलमु मोचॆ नुय्याल
    । अदन आकाशपदमु अड्डौदूलम्बैन अखिलम्बु निण्डॆ नी वुय्याल ॥ पदिलमुग वेदमुलु बङ्गारु चेरुलै पट्टि वॆरपै
    तोचॆ वुय्याल । वदलकिटु धर्मदेवत पीठमै मिगुल वर्णिम्प नरुदायॆ वुय्याल ॥ मेलु कट्लयि मीकु मेघमण्डलमॆल्ल
    मॆरुगुनकु मॆरुगायॆ वुय्याल । नील शैलमुवण्टि नी मेनिकान्तिकि निजमैन तॊडवायॆ वुय्याल ॥ अलर चञ्चलमैन
    आत्मलन्दुण्ड नी यलवाटु चेसॆ नी वुय्याल । पलुमारु नुच्छ्वास पवनमन्दुण्ड नी भावम्बु दॆलिपॆ नी वुय्याल
    ॥ पालिण्ड्लु कदलगा पय्यदलु रापाड भामिनुलु वडिनूचु वुय्याल । वोलि ब्रह्माण्डमुलु वॊरगुवो यनि भीति नॊय्य
    नॊय्यनैरि वूचिरुय्याल ॥ चरणं कमलकुनु भूपतिकि कदलु कदलकु मिम्मु कौगलिम्पगजेसॆ नुय्याल । अमराङ्गनलकु
    नी हास भाव विलास मन्दन्द चूपॆ नी वुय्याल ॥ चरणं कमलासनादुलकु कन्नुल पण्डुगै गणुतिम्प नरुदायॆ वुय्याल
    । कमनीय मूर्ति वेङ्कटशैलपति नीकु कडुवेडुकै वुण्डॆ वुय्याल ॥
