id: shrishivashatakam
category: stotram
name:
  english: shrishivashatakam
  devanagari: श्रीशिवशतकम्
content:
  english: shivam shankaram shambhumishanamide || 8 || svayam yah prabhate narashshula pane pathet stotraratnam
    tvihaprapyaratnam | suputram sudhanyam sumitram kalatram vicitraissamaradhya moksham prayati || 9||
  devanagari: शिवं शङ्करं शम्भुमीशानमीडे ॥ ८ ॥ स्वयं यः प्रभाते नरश्शूल पाने पठेत् स्तोत्ररत्नं त्विहप्राप्यरत्नम्
    । सुपुत्रं सुधान्यं सुमित्रं कलत्रं विचित्रैस्समाराध्य मोक्षं प्रयाति ॥ ९॥
meaning: {}
