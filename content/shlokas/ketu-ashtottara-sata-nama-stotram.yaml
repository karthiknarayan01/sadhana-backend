id: ketu-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Ketu Ashtottara Sata Nama Stotram
content:
  english: shrinu namani japyani keto ratha mahamate | ketuh sthulashirashcaiva shiromatro dhvajakritih
    || || navagrahayutah simhikasurigarbhasambhavah | mahabhitikarashcitravarno vai pingalakshakah ||
    || sa phalodhumrasankashah tikshnadamshtro mahoragah | raktanetrashcitrakari tivrakopo mahasurah ||
    || krurakanthah krodhanidhishchayagrahavisheshakah | antyagraho mahashirsho suryarih pushpavadgrahi
    || || varahasto gadapanishcitravastradharastatha | citradhvajapatakashca ghorashcitrarathah shikhi
    || || kulutthabhakshakashcaiva vaiduryabharanastatha | utpatajanakah shukramitram mandasakhastatha
    || || gadadharah nakapatih antarvedishvarastatha | jaiminigotrajashcitraguptatma dakshinamukhah ||
    || mukundavarapatram ca mahasurakulodbhavah | ghanavarno lambadeho mrityuputrastathaiva ca || || utpatarupadhari
    ca'drishyah kalagnisannibhah | nripido grahakari ca sarvopadravakarakah || || citraprasuto hyanalah
    sarvavyadhivinashakah | apasavyapracari ca navame papadayakah || || pancame shokadashcoparagakhecara
    eva ca | atipurushakarma ca turiye || tritiye vairadah papagrahashca sphotakarakah | prananathah pancame
    tu shramakaraka eva ca || || dvitiye'sphutavagdata vishakulitavaktrakah | kamarupi simhadantah satyepyanritavanapi
    || || caturthe matrinashashca navame pitrinashakah | antye vairapradashcaiva sutanandanabandhakah
    || || sarpakshijato'nangashca karmarashyudbhavastatha | upante kirtidashcaiva saptame kalahapradah
    || || ashtame vyadhikarta ca dhane bahusukhapradah | janane rogadashcordhvamurdhajo grahanayakah ||
    || papadrishtih khecarashca shambhavo'sheshapujitah | shashvatashca natashcaiva shubha'shubhaphalapradah
    || || dhumrashcaiva sudhapayi hyajito bhaktavatsalah | simhasanah ketumurti ravindudyutinashakah ||
    || amarah pidako'martyo vishnudrishto'sureshvarah | bhaktaraksho'tha vaicitryakapatasyandanastatha
    || || vicitraphaladayi ca bhaktabhishtaphalapradah | etatketugrahasyoktam namnamashtottaram shatam
    || || yo bhaktyedam japetketurnamnamashtottaram shatam | sa tu ketoh prasadena sarvabhishtam samapnuyat
    || || iti shri ketu ashtottarashatanama stotram |
  devanagari: शृणु नामानि जप्यानि केतो रथ महामते । केतुः स्थूलशिराश्चैव शिरोमात्रो ध्वजाकृतिः ॥ ॥ नवग्रहयुतः
    सिंहिकासुरीगर्भसम्भवः । महाभीतिकरश्चित्रवर्णो वै पिङ्गलाक्षकः ॥ ॥ स फलोधूम्रसङ्काशः तीक्ष्णदंष्ट्रो
    महोरगः । रक्तनेत्रश्चित्रकारी तीव्रकोपो महासुरः ॥ ॥ क्रूरकण्ठः क्रोधनिधिश्छायाग्रहविशेषकः । अन्त्यग्रहो
    महाशीर्षो सूर्यारिः पुष्पवद्ग्रही ॥ ॥ वरहस्तो गदापाणिश्चित्रवस्त्रधरस्तथा । चित्रध्वजपताकश्च घोरश्चित्ररथः
    शिखी ॥ ॥ कुलुत्थभक्षकश्चैव वैडूर्याभरणस्तथा । उत्पातजनकः शुक्रमित्रं मन्दसखस्तथा ॥ ॥ गदाधरः नाकपतिः
    अन्तर्वेदीश्वरस्तथा । जैमिनीगोत्रजश्चित्रगुप्तात्मा दक्षिणामुखः ॥ ॥ मुकुन्दवरपात्रं च महासुरकुलोद्भवः
    । घनवर्णो लम्बदेहो मृत्युपुत्रस्तथैव च ॥ ॥ उत्पातरूपधारी चाऽदृश्यः कालाग्निसन्निभः । नृपीडो ग्रहकारी
    च सर्वोपद्रवकारकः ॥ ॥ चित्रप्रसूतो ह्यनलः सर्वव्याधिविनाशकः । अपसव्यप्रचारी च नवमे पापदायकः ॥ ॥ पञ्चमे
    शोकदश्चोपरागखेचर एव च । अतिपुरुषकर्मा च तुरीये ॥ तृतीये वैरदः पापग्रहश्च स्फोटकारकः । प्राणनाथः पञ्चमे
    तु श्रमकारक एव च ॥ ॥ द्वितीयेऽस्फुटवाग्दाता विषाकुलितवक्त्रकः । कामरूपी सिंहदन्तः सत्येप्यनृतवानपि
    ॥ ॥ चतुर्थे मातृनाशश्च नवमे पितृनाशकः । अन्त्ये वैरप्रदश्चैव सुतानन्दनबन्धकः ॥ ॥ सर्पाक्षिजातोऽनङ्गश्च
    कर्मराश्युद्भवस्तथा । उपान्ते कीर्तिदश्चैव सप्तमे कलहप्रदः ॥ ॥ अष्टमे व्याधिकर्ता च धने बहुसुखप्रदः
    । जनने रोगदश्चोर्ध्वमूर्धजो ग्रहनायकः ॥ ॥ पापदृष्टिः खेचरश्च शाम्भवोऽशेषपूजितः । शाश्वतश्च नटश्चैव
    शुभाऽशुभफलप्रदः ॥ ॥ धूम्रश्चैव सुधापायी ह्यजितो भक्तवत्सलः । सिंहासनः केतुमूर्ती रवीन्दुद्युतिनाशकः
    ॥ ॥ अमरः पीडकोऽमर्त्यो विष्णुदृष्टोऽसुरेश्वरः । भक्तरक्षोऽथ वैचित्र्यकपटस्यन्दनस्तथा ॥ ॥ विचित्रफलदायी
    च भक्ताभीष्टफलप्रदः । एतत्केतुग्रहस्योक्तं नाम्नामष्टोत्तरं शतम् ॥ ॥ यो भक्त्येदं जपेत्केतुर्नाम्नामष्टोत्तरं
    शतम् । स तु केतोः प्रसादेन सर्वाभीष्टं समाप्नुयात् ॥ ॥ इति श्री केतु अष्टोत्तरशतनाम स्तोत्रम् ।
