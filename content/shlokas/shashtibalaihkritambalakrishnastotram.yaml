id: shashtibalaihkritambalakrishnastotram
category: stotram
name:
  english: shashtibalaihkritambalakrishnastotram
  devanagari: षष्टिबालैःकृतंबालकृष्णस्तोत्रम्
content:
  english: shashtibalaih kritam balakrishnastotram tapasah siddhimantashca yatha vai brahmacarinah | natva
    divyam vimanam te tasthuh kshanam vishashramuh || 48|| atha shashtirdivyarupa militva te narah striyah
    | vrikayanam tatha catvalarshin sarvan pranamya ca || 49|| stutim cakrurvimanabhimukham vilokya bhavatah
    | ekasvarena mudita netre pramilya vai tada || 50|| vyapako yah parabrahma'nadishripurushottamah |
    muktamuktanikasevyastasmai krishnaya te namah || 51|| aksharam brahma yatraste dhama divyam paratparam
    | sevate yam sada tatra tasmai krishnaya te namah || 52|| yanmurtestu samutpanna radha shaktih surupini
    | radhartham krishnarupo'bhut tasmai krishnaya te namah || 53|| yam krishnam nityagoloke gavo gopyashca
    gopakah | sevante sukhadam rase tasmai krishnaya te namah || 54|| yanmurtestu samutpanna lakshmirmurtih
    surupini | narayano'bhullakshmyartham tasmai krishnaya te namah || 55|| yam vaikunthe parshadah parshadanyashca
    bhagani ca | prasevante sakhikotyastasmai krishnaya te namah || 56|| yo natho'nadisrishteshca pravahartham
    catushtayam | vasudevadikam vyuham dhatte krishnaya te namah || 57|| yo devo vai mahabhuma vairajashca
    pura'bhavat | tridevatam samapannastasmai krishnaya te namah || 58|| yah svamurtau manikim ca ramam
    padmavatim satim | lakshmim narayanim dhatte tasmai krishnaya te namah || 59|| yo hamsam sugunam manjulikam
    dhatte svavigrahe | dayam jayam ca lalitam tasmai krishnaya te namah || 60|| yo radham yamunam gangam
    virajam ca sarasvatim | sharadam kamalam dhatte tasmai krishnaya te namah || 61|| yah svamurtervivareshu
    dhatte brahmandakotikah | brahmandeshvanvitashcaste tasmai krishnaya te namah || 62|| avyakrite'mrite
    dhamni shvetadvipe narayanah | yastvaste shriramasevyastasmai krishnaya te namah || 63|| adityamandale
    hiranmayo yashca virajate | agnau yajnasvarupashca tasmai krishnaya te namah || 64|| brahmande vishnurupo
    yah svarge vamanarupadhrik | badaryam ca harishcaste tasmai krishnaya te namah || 65|| sheshe narayanarupashcatmasvantarniyamakah
    | sakshi yah sarvabhutanam tasmai krishnaya te namah || 66|| yashcaste balakrishno'yam shrimadgopalanandanah
    | kunkumavapikakshetre tasmai krishnaya te namah || 67|| yena ganga krita divya'smanmata shashtibalaka
    | padangushthena satye vai tasmai krishnaya te namah || 68|| murtirupo vimane'tra yashcaste bhagavan
    harih | ganga'patyakripavarshi tasmai krishnaya te namah || 69|| karmakandaya yogaya jnanaya ca viviktaye
    | nitaye ca vicaraya tasmai krishnaya te namah || 70|| jivaya jivakayapi pranaya koshine ca te | khaya
    kaya ca satyaya tasmai krishnatmane namah || 71|| tirthaya sadhurupaya sarvajnaya viharine | muktaye
    muktidatre ca tasmai krishnatmane namah || 72|| cidacitsarvarupaya vimanasthaya murtaye | balaya balakrishnaya
    kantakrishnaya te namah || 73|| brahmapriyadhipataye kotishaktishvaraya ca | shatacatvarimshadurdhvakanyakantaya
    te namah || 74|| mayakalapurushanam pataye dhamadhaminam | ishajivadhipataye tasmai krishnaya te namah
    || 75|| gocaraya'gocaraya shashtivandyaya murtaye | sharanam smah samapannah sharanyaya ca te namah
    || 76|| evam stutva radhike
  devanagari: षष्टिबालैः कृतं बालकृष्णस्तोत्रम् तापसाः सिद्धिमन्तश्च यथा वै ब्रह्मचारिणः । नत्वा दिव्यं
    विमानं ते तस्थुः क्षणं विशश्रमुः ॥ ४८॥ अथ षष्टिर्दिव्यरूपा मिलित्वा ते नराः स्त्रियः । वृकायनं तथा
    चाट्वालर्षीन् सर्वान् प्रणम्य च ॥ ४९॥ स्तुतिं चक्रुर्विमानाभिमुखं विलोक्य भावतः । एकस्वरेण मुदिता
    नेत्रे प्रमील्य वै तदा ॥ ५०॥ व्यापको यः परब्रह्माऽनादिश्रीपुरुषोत्तमः । मुक्तमुक्तानिकासेव्यस्तस्मै
    कृष्णाय ते नमः ॥ ५१॥ अक्षरं ब्रह्म यत्रास्ते धाम दिव्यं परात्परम् । सेवते यं सदा तत्र तस्मै कृष्णाय
    ते नमः ॥ ५२॥ यन्मूर्तेस्तु समुत्पन्ना राधा शक्तिः सुरूपिणी । राधार्थं कृष्णरूपोऽभूत् तस्मै कृष्णाय
    ते नमः ॥ ५३॥ यं कृष्णं नित्यगोलोके गावो गोप्यश्च गोपकाः । सेवन्ते सुखदं रासे तस्मै कृष्णाय ते नमः
    ॥ ५४॥ यन्मूर्तेस्तु समुत्पन्ना लक्ष्मीर्मूर्तिः सुरूपिणी । नारायणोऽभूल्लक्ष्म्यर्थं तस्मै कृष्णाय
    ते नमः ॥ ५५॥ यं वैकुण्ठे पार्षदाः पार्षदान्यश्च भगानि च । प्रसेवन्ते सखीकोट्यस्तस्मै कृष्णाय ते नमः
    ॥ ५६॥ यो नाथोऽनादिसृष्टेश्च प्रवाहार्थं चतुष्टयम् । वासुदेवादिकं व्यूहं धत्ते कृष्णाय ते नमः ॥ ५७॥
    यो देवो वै महाभूमा वैराजश्च पुराऽभवत् । त्रिदेवतां समापन्नस्तस्मै कृष्णाय ते नमः ॥ ५८॥ यः स्वमूर्तौ
    माणिकीं च रमां पद्मावतीं सतीम् । लक्ष्मीं नारायणीं धत्ते तस्मै कृष्णाय ते नमः ॥ ५९॥ यो हंसां सुगुणां
    मञ्जुलिकां धत्ते स्वविग्रहे । दयां जयां च ललितां तस्मै कृष्णाय ते नमः ॥ ६०॥ यो राधां यमुनां गङ्गां
    विरजां च सरस्वतीम् । शारदां कमलां धत्ते तस्मै कृष्णाय ते नमः ॥ ६१॥ यः स्वमूर्तेर्विवरेषु धत्ते ब्रह्माण्डकोटिकाः
    । ब्रह्माण्डेष्वन्वितश्चास्ते तस्मै कृष्णाय ते नमः ॥ ६२॥ अव्याकृतेऽमृते धाम्नि श्वेतद्वीपे नरायणः
    । यस्त्वास्ते श्रीरमासेव्यस्तस्मै कृष्णाय ते नमः ॥ ६३॥ आदित्यमण्डले हिरण्मयो यश्च विराजते । अग्नौ
    यज्ञस्वरूपश्च तस्मै कृष्णाय ते नमः ॥ ६४॥ ब्रह्माण्डे विष्णुरूपो यः स्वर्गे वामनरूपधृक् । बदर्यां च
    हरिश्चास्ते तस्मै कृष्णाय ते नमः ॥ ६५॥ शेषे नारायणरूपश्चात्मस्वन्तर्नियामकः । साक्षी यः सर्वभूतानां
    तस्मै कृष्णाय ते नमः ॥ ६६॥ यश्चास्ते बालकृष्णोऽयं श्रीमद्गोपालनन्दनः । कुङ्कुमवापिकाक्षेत्रे तस्मै
    कृष्णाय ते नमः ॥ ६७॥ येन गङ्गा कृता दिव्याऽस्मन्माता षष्टिबालका । पादाङ्गुष्ठेन सत्ये वै तस्मै कृष्णाय
    ते नमः ॥ ६८॥ मूर्तिरूपो विमानेऽत्र यश्चास्ते भगवान् हरिः । गङ्गाऽपत्यकृपावर्षी तस्मै कृष्णाय ते नमः
    ॥ ६९॥ कर्मकाण्डाय योगाय ज्ञानाय च विविक्तये । नीतये च विचाराय तस्मै कृष्णाय ते नमः ॥ ७०॥ जीवाय जीवकायापि
    प्राणाय कोशिने च ते । खाय काय च सत्याय तस्मै कृष्णात्मने नमः ॥ ७१॥ तीर्थाय साधुरूपाय सर्वज्ञाय विहारिणे
    । मुक्तये मुक्तिदात्रे च तस्मै कृष्णात्मने नमः ॥ ७२॥ चिदचित्सर्वरूपाय विमानस्थाय मूर्तये । बालाय बालकृष्णाय
    कान्तकृष्णाय ते नमः ॥ ७३॥ ब्रह्मप्रियाधिपतये कोटिशक्तीश्वराय च । शतचत्वारिंशदूर्ध्वकन्याकान्ताय ते
    नमः ॥ ७४॥ मायाकालपुरुषाणां पतये धामधामिनाम् । ईशजीवाधिपतये तस्मै कृष्णाय ते नमः ॥ ७५॥ गोचरायाऽगोचराय
    षष्टिवन्द्याय मूर्तये । शरणं स्मः समापन्नाः शरण्याय च ते नमः ॥ ७६॥ एवं स्तुत्वा राधिके
