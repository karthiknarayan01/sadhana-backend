id: bagalashtottarashatanamastotram-1
category: stotram
name:
  english: bagalashtottarashatanamastotram 1
  devanagari: बगलाष्टोत्तरशतनामस्तोत्रम् १
content:
  english: shribagalashtottarashatanamastotram om brahmastrarupini devi mata shribagalamukhi | cicchiktirjnanarupa
    ca brahmanandapradayini || 1|| mahavidya mahalakshmi shrimattripurasundari | bhuvaneshi jaganmata
    parvati sarvamangala || 2|| lalita bhairavi shanta annapurna kuleshvari | varahi chinnamasta ca tara
    kali sarasvati || 3|| jagatpujya mahamaya kameshi bhagamalini | dakshaputri shivankastha shivarupa
    shivapriya || 4|| sarvasampatkari devi sarvaloka vashankari | vedavidya mahapujya bhaktadveshi bhayankari
    || 5|| stambharupa stambhini ca dushtastambhanakarini | bhaktapriya mahabhoga shrividya lalitambika
    || 6|| mainaputri shivananda matangi bhuvaneshvari | narasimhi narendra ca nriparadhya narottama ||
    7|| nagini nagaputri ca nagarajasuta uma | pitamba pitapushpa ca pitavastrapriya shubha || 8|| pitagandhapriya
    rama pitaratnarcita shiva | arddhacandradhari devi gadamudgaradharini || 9|| savitri tripada shuddha
    sadyoraga vivardhini | vishnurupa jaganmoha brahmarupa haripriya || 10|| rudrarupa rudrashaktishcinmayi
    bhaktavatsala | lokamata shiva sandhya shivapujanatatpara || 11|| dhanadhyaksha dhaneshi ca narmada
    dhanada dhana | candadarpahari devi shumbhasuranibarhini || 12|| rajarajeshvari devi mahishasuramardini
    | madhukaitabhahantri devi raktabijavinashini || 13|| dhumrakshadaityahantri ca bhandasura vinashini
    | renuputri mahamaya bhramari bhramarambika || 14|| jvalamukhi bhadrakali bagala shatrunashini | indrani
    indrapujya ca guhamata guneshvari || 15|| vajrapashadhara devi jhvamudgaradharini | bhaktanandakari
    devi bagala parameshvari || 16|| ashtottarashatam namnam bagalayastu yah pathet | ripubadhavinirmuktah
    lakshmisthairyamavapnuyat || 17|| bhutapretapishacashca grahapidanivaranam | rajano vashamayanti sarvaishvaryam
    ca vindati || 18|| nanavidyam ca labhate rajyam prapnoti nishcitam | bhuktimuktimavapnoti sakshat
    shivasamo bhavet || 19|| || shri rudrayamale sarvasiddhiprada
  devanagari: श्रीबगलाष्टोत्तरशतनामस्तोत्रम् ॐ ब्रह्मास्त्ररूपिणी देवी माता श्रीबगलामुखी । चिच्छिक्तिर्ज्ञानरूपा
    च ब्रह्मानन्दप्रदायिनी ॥ १॥ महाविद्या महालक्ष्मी श्रीमत्त्रिपुरसुन्दरी । भुवनेशी जगन्माता पार्वती
    सर्वमङ्गला ॥ २॥ ललिता भैरवी शान्ता अन्नपूर्णा कुलेश्वरी । वाराही छीन्नमस्ता च तारा काली सरस्वती ॥
    ३॥ जगत्पूज्या महामाया कामेशी भगमालिनी । दक्षपुत्री शिवाङ्कस्था शिवरूपा शिवप्रिया ॥ ४॥ सर्वसम्पत्करी
    देवी सर्वलोक वशङ्करी । वेदविद्या महापूज्या भक्ताद्वेषी भयङ्करी ॥ ५॥ स्तम्भरूपा स्तम्भिनी च दुष्टस्तम्भनकारिणी
    । भक्तप्रिया महाभोगा श्रीविद्या ललिताम्बिका ॥ ६॥ मैनापुत्री शिवानन्दा मातङ्गी भुवनेश्वरी । नारसिंही
    नरेन्द्रा च नृपाराध्या नरोत्तमा ॥ ७॥ नागिनी नागपुत्री च नगराजसुता उमा । पीताम्बा पीतपुष्पा च पीतवस्त्रप्रिया
    शुभा ॥ ८॥ पीतगन्धप्रिया रामा पीतरत्नार्चिता शिवा । अर्द्धचन्द्रधरी देवी गदामुद्गरधारिणी ॥ ९॥ सावित्री
    त्रिपदा शुद्धा सद्योराग विवर्धिनी । विष्णुरूपा जगन्मोहा ब्रह्मरूपा हरिप्रिया ॥ १०॥ रुद्ररूपा रुद्रशक्तिश्चिन्मयी
    भक्तवत्सला । लोकमाता शिवा सन्ध्या शिवपूजनतत्परा ॥ ११॥ धनाध्यक्षा धनेशी च नर्मदा धनदा धना । चण्डदर्पहरी
    देवी शुम्भासुरनिबर्हिणी ॥ १२॥ राजराजेश्वरी देवी महिषासुरमर्दिनी । मधूकैटभहन्त्री देवी रक्तबीजविनाशिनी
    ॥ १३॥ धूम्राक्षदैत्यहन्त्री च भण्डासुर विनाशिनी । रेणुपुत्री महामाया भ्रामरी भ्रमराम्बिका ॥ १४॥ ज्वालामुखी
    भद्रकाली बगला शत्रुनाशिनी । इन्द्राणी इन्द्रपूज्या च गुहमाता गुणेश्वरी ॥ १५॥ वज्रपाशधरा देवी झ्वामुद्गरधारिणी
    । भक्तानन्दकरी देवी बगला परमेश्वरी ॥ १६॥ अष्टोत्तरशतं नाम्नां बगलायास्तु यः पठेत् । रिपुबाधाविनिर्मुक्तः
    लक्ष्मीस्थैर्यमवाप्नुयात् ॥ १७॥ भूतप्रेतपिशाचाश्च ग्रहपीडानिवारणम् । राजानो वशमायान्ति सर्वैश्वर्यं
    च विन्दति ॥ १८॥ नानाविद्यां च लभते राज्यं प्राप्नोति निश्चितम् । भुक्तिमुक्तिमवाप्नोति साक्षात् शिवसमो
    भवेत् ॥ १९॥ ॥ श्री रुद्रयामले सर्वसिद्धिप्रद
