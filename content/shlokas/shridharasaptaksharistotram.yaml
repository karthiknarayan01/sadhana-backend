id: shridharasaptaksharistotram
category: stotram
name:
  english: shridharasaptaksharistotram
  devanagari: श्रीधरसप्ताक्षरीस्तोत्रम्
content:
  english: shrishridharasaptaksharistotram om shridharaya namah | onkarasvarupamatulam shankajnanatamoravim
    | onkaroccaranapatum shrigharam tam namamyaham || 1|| shrikaram shankaram shantam saccidanandarupinam
    | shriteshtaphaladaneshtam shridharam tam namamyaham || 2|| dharmoddharakriyasakta dharmasthapanamavyayam
    | dharmikasevitapadam shridharam tam namamyaham || 3|| ragadveshadirahitam rakacandranibhananam |
    rogadi sankataharam shridharam tam namamyaham || 4|| yatpadapankajaratassantatanandabhaginah | yatprasadadbhavantyatra
    shridharam tam namamyaham || 5|| namitam sajjainernityamamitanandadayakam | namitakhilasadbhaktam
    shridharam tam namamyaham || 6|| mastake sarvada yasya lokanugrahabhavana | vartate lokavikhyatam
    shridharam tam namamyaham || 7|| om shridharaya namah | iti shrishridharaguruvaracaranadasena vidvajjanavidheyana
    vidusha parameshvarasharmana viracitam shri shridharasaptakshari stotram sampurnam |
  devanagari: श्रीश्रीधरसप्ताक्षरीस्तोत्रम् ॐ श्रीधराय नमः । ओङ्कारस्वरूपमतुलं शङ्काज्ञानतमोरविम् । ओङ्कारोच्चारणपटुं
    श्रीघरं तं नमाम्यहम् ॥ १॥ श्रीकरं शङ्करं शान्तं सच्चिदानन्दरूपिणम् । श्रीतेष्टफलदानेष्टं श्रीधरं तं
    नमाम्यहम् ॥ २॥ धर्मोद्धारक्रियासक्त धर्मस्थापनमव्ययम् । धार्मिकासेवितपदं श्रीधरं तं नमाम्यहम् ॥ ३॥
    रागद्वेषादिरहितं राकाचन्द्रनिभाननम् । रोगादि सङ्कटहरं श्रीधरं तं नमाम्यहम् ॥ ४॥ यत्पादपङ्कजरतास्सन्ततानन्दभागिनः
    । यत्प्रसादाद्भवन्त्यत्र श्रीधरं तं नमाम्यहम् ॥ ५॥ नमितं सज्जैनेर्नित्यममितानन्ददायकम् । नमिताखिलसद्भक्तं
    श्रीधरं तं नमाम्यहम् ॥ ६॥ मस्तके सर्वदा यस्य लोकानुग्रहभावना । वर्तते लोकविख्यातं श्रीधरं तं नमाम्यहम्
    ॥ ७॥ ॐ श्रीधराय नमः । इति श्रीश्रीधरगुरुवरचरणदासेन विद्वज्जनविधेयन विदुषा परमेश्वरशर्मणा विरचितं श्री
    श्रीधरसप्ताक्षरी स्तोत्रं सम्पूर्णम् ।
