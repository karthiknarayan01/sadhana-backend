id: dhanadakavac
category: kavacha
name:
  english: dhanadakavac
  devanagari: धनदाकवच्
content:
  english: rinu devi pravakshyami kavacam mamtravagraham | saratsarataram devi kavacam manmukhoditam ||
    dhanada kavacasyasya kubera rishiriritah | pamktishchando devata ca dhanada siddhida sada || dharmarthakamamoksheshu
    viniyogah prakirtitah | dham bijam me shirah patu hrim bijam me lalatakam || shri bijam me mukha patu
    rakaram hridi me'vatu | tikaram patu jatharam prikaram prishthato'vatu | yekaram jamghayoryugme svakaram
    padayoryuge | shirshadipadaparyantam hakaram sarvato'vatu || ityetatkathitam kante kavacam sarvasiddhidam
    | gurumabhyarcya vidhivat kavacam prapathedyadi || shatavarsham sahasranam sahasranam pujayah phalamapnuyat
    | gurupujam vina devi nahi siddhih prajayate || gurupujatparo bhutva kavacam prapathettatah | sarvasiddhiyuto
    bhutva vicared bhairavo yatha || pratahkale pathedyastu mamtrajapapurah saram | so'bhishtaphalamapnoti
    satyam satyam na samshayah || pujakale pathedyastu devim dhyatva hridambuje | shanmasabhyantare siddhirnatra
    karya vicarana | sayamkale pathedyastu sa shivo natra samshayah | bhurje vilikhta gutikam svarnastham
    dharayedyadi || purusho dakshine bahau yoshidvamabhuje tatha | dakshine bahau yoshidvamabhuje tatha
    | sarvasiddhiyuti bhutva dhanavan putravan bhavet || idam kavacamajnatva yo japeddhanadam shubhe |
    shastraghatamavapnoti so'ciranmrityumapnuyat || kavacenavrito nityam hi yatraiva gacchati | tatraiva
    sa mahadevi sampujyo natra samshayah || || iti dhanada kavacam sampurnam ||
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं मंत्रवग्रहम् । सारात्सारतरं देवि कवचं मन्मुखोदितम् ॥ धनदा कवचस्यास्य
    कुबेर ऋषिरीरितः । पंक्तिश्छन्दो देवता च धनदा सिद्धिदा सदा ॥ धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः
    । धं बीजं मे शिरः पातु ह्रीं बीजं मे ललाटकम् ॥ श्री बीजं मे मुख पातु रकारं हृदि मेऽवतु । तिकारं पातु
    जठरं प्रिकारं पृष्ठतोऽवतु । येकारं जंघयोर्युग्मे स्वाकारं पादयोर्युगे । शीर्षादिपादपर्यन्तं हाकारं
    सर्वतोऽवतु ॥ इत्येतत्कथितं कान्ते कवचं सर्वसिद्धिदम् । गुरुमभ्यर्च्य विधिवत् कवचं प्रपठेद्यदि ॥ शतवर्षं
    सहस्राणां सहस्राणां पूजायाः फलमाप्नुयात् । गुरुपूजां विना देवि नहि सिद्धिः प्रजायते ॥ गुरुपूजात्परो
    भूत्वा कवचं प्रपठेत्ततः । सर्वसिद्धियुतो भूत्वा विचरेद् भैरवो यथा ॥ प्रातःकाले पठेद्यस्तु मंत्रजापपुरः
    सरम् । सोऽभीष्टफलमाप्नोति सत्यं सत्यं न संशयः ॥ पूजाकाले पठेद्यस्तु देवीं ध्यात्वा हृदम्बुजे । षण्मासाभ्यन्तरे
    सिद्धिर्नात्र कार्या विचारणा । सायंकाले पठेद्यस्तु स शिवो नात्र संशयः । भूर्जे विलिख्त गुटिकां स्वर्णस्थां
    धारयेद्यदि ॥ पुरुषो दक्षिणे बाहौ योषिद्वामभुजे तथा । दक्षिणे बाहौ योषिद्वामभुजे तथा । सर्वसिद्धियुती
    भूत्वा धनवान् पुत्रवान् भवेत् ॥ इदं कवचमज्ञात्वा यो जपेद्धनदां शुभे । शस्त्रघातमवाप्नोति सोऽचिरान्मृत्युमाप्नुयात्
    ॥ कवचेनावृतो नित्यं हि यत्रैव गच्छति । तत्रैव स महादेवि सम्पूज्यो नात्र संशयः ॥ ॥ इति धनदा कवचं सम्पूर्णम्
    ॥
