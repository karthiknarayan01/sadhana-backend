id: gokula-ashtakam
category: stotram
name:
  english: Gokula Ashtakam
content:
  english: shrimadgokulasarvasvam shrimadgokulamandanam | shrimadgokuladriktara shrimadgokulajivanam ||
    || shrimadgokulamatreshah shrimadgokulapalakah | shrimadgokulalilabdhih shrimadgokulasamshrayah ||
    || shrimadgokulajivatma shrimadgokulamanasah | shrimadgokuladuhkhaghnah shrimadgokulavikshitah ||
    || shrimadgokulasaundaryam shrimadgokulasatphalam | shrimadgokulagopranah shrimadgokulakamadah ||
    || shrimadgokularakeshah shrimadgokulatarakah | shrimadgokulapadmalih shrimadgokulasamstutah || ||
    shrimadgokulasangitah shrimadgokulalasyakrit | shrimadgokulabhavatma shrimadgokulaposhakah || || shrimadgokulahritsthanah
    shrimadgokulasamvritah | shrimadgokuladrikpushpah shrimadgokulamoditah || || shrimadgokulagopishah
    shrimadgokulalalitah | shrimadgokulabhogyashrih shrimadgokulasarvakrit || || imani shrigokuleshanamani
    vadane mama | vasantu santatam caiva lila ca hridaye sada || || iti shriviththaleshvara viracitam
    shri gokulashtakam |
  devanagari: श्रीमद्गोकुलसर्वस्वं श्रीमद्गोकुलमण्डनम् । श्रीमद्गोकुलदृक्तारा श्रीमद्गोकुलजीवनम् ॥ ॥ श्रीमद्गोकुलमात्रेशः
    श्रीमद्गोकुलपालकः । श्रीमद्गोकुललीलाब्धिः श्रीमद्गोकुलसंश्रयः ॥ ॥ श्रीमद्गोकुलजीवात्मा श्रीमद्गोकुलमानसः
    । श्रीमद्गोकुलदुःखघ्नः श्रीमद्गोकुलवीक्षितः ॥ ॥ श्रीमद्गोकुलसौन्दर्यं श्रीमद्गोकुलसत्फलम् । श्रीमद्गोकुलगोप्राणः
    श्रीमद्गोकुलकामदः ॥ ॥ श्रीमद्गोकुलराकेशः श्रीमद्गोकुलतारकः । श्रीमद्गोकुलपद्मालिः श्रीमद्गोकुलसंस्तुतः
    ॥ ॥ श्रीमद्गोकुलसङ्गीतः श्रीमद्गोकुललास्यकृत् । श्रीमद्गोकुलभावात्मा श्रीमद्गोकुलपोषकः ॥ ॥ श्रीमद्गोकुलहृत्स्थानः
    श्रीमद्गोकुलसंवृतः । श्रीमद्गोकुलदृक्पुष्पः श्रीमद्गोकुलमोदितः ॥ ॥ श्रीमद्गोकुलगोपीशः श्रीमद्गोकुललालितः
    । श्रीमद्गोकुलभोग्यश्रीः श्रीमद्गोकुलसर्वकृत् ॥ ॥ इमानि श्रीगोकुलेशनामानि वदने मम । वसन्तु सन्ततं
    चैव लीला च हृदये सदा ॥ ॥ इति श्रीविठ्ठलेश्वर विरचितं श्री गोकुलाष्टकम् ।
