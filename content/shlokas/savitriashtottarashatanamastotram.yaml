id: savitriashtottarashatanamastotram
category: stotram
name:
  english: savitriashtottarashatanamastotram
  devanagari: सावित्रीअष्टोत्तरशतनामस्तोत्रम्
content:
  english: 168|| iti naradapurane purvabhage tryashititamadhyayantargatam naradaya sanatkumaraproktam
    savitryashtottarashatanamastotram samaptam | brihannaradiyapurana | purvabhaga | adhyaya 83
  devanagari: १६८॥ इति नारदपुराणे पूर्वभागे त्र्यशीतितमाध्यायान्तर्गतं नारदाय सनत्कुमारप्रोक्तं सावित्र्यष्टोत्तरशतनामस्तोत्रं
    समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ८३
meaning: {}
