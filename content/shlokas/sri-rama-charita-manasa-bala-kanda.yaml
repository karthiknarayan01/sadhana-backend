    राम तेम् ॥ ब्यापकु एकु ब्रह्म अबिनासी। सत चेतन धन आनँद रासी ॥ अस प्रभु हृदयँ अछत अबिकारी। सकल जीव
    जग दीन दुखारी ॥ नाम निरूपन नाम जतन तें। सौ प्रगटत जिमि मोल रतन तेम् ॥ दो निरगुन तें एहि भाँति बड़
    नाम प्रभाउ अपार। कहुँ नामु बड़ राम तें निज बिचार अनुसार ॥ ॥ राम भगत हित नर तनु धारी। सहि सङ्कट किए
    साधु सुखारी ॥ नामु सप्रेम जपत अनयासा। भगत होहिं मुद मङ्गल बासा ॥ राम एक तापस तिय तारी। नाम कोटि खल
    कुमति सुधारी ॥ रिषि हित राम सुकेतुसुता की। सहित सेन सुत कीन्ह बिबाकी ॥ सहित दोष दुख दास दुरासा। दलि
    नामु जिमि रबि निसि नासा ॥ भञ्जेउ राम आपु भव चापू। भव भय भञ्जन नाम प्रतापू ॥ दण्डक बनु प्रभु कीन्ह
    सुहावन। जन मन अमित नाम किए पावन ॥ । निसिचर निकर दले रघुनन्दन। नामु सकल कलि कलुष निकन्दन ॥ दो सबरी
    गीध सुसेवकनि सुगति दीन्हि रघुनाथ। नाम उधारे अमित खल बेद बिदित गुन गाथ ॥ ॥ राम सुकण्ठ बिभीषन दोऊ। राखे
    सरन जान सबु कोऊ ॥ नाम गरीब अनेक नेवाजे। लोक बेद बर बिरिद बिराजे ॥ राम भालु कपि कटकु बटोरा। सेतु हेतु
    श्रमु कीन्ह न थोरा ॥ नामु लेत भवसिन्धु सुखाहीं। करहु बिचारु सुजन मन माहीम् ॥ राम सकुल रन रावनु मारा।
    सीय सहित निज पुर पगु धारा ॥ राजा रामु अवध रजधानी। गावत गुन सुर मुनि बर बानी ॥ सेवक सुमिरत नामु सप्रीती।
    बिनु श्रम प्रबल मोह दलु जीती ॥ फिरत सनेहँ मगन सुख अपनें। नाम प्रसाद सोच नहिं सपनेम् ॥ दो ब्रह्म राम
