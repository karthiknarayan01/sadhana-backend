id: shastadashakam-2
category: stotram
name:
  english: shastadashakam 2
  devanagari: शास्तादशकम् २
content:
  english: shambhoh priyam sutam | kshipraprasadaniratam shastaram pranamamyaham || 2|| mattamatangagamanam
    karunyamritapuritam | sarvavighnaharam devam shastaram pranamamyaham || 3|| asmatkuleshvaram devamasmacachatruvinashanam
    | asmadishtapradataram shastaram pranamamyaham || 4|| pandyeshavamshatilakam keraḻe kelivigraham |
    artatranaparam devam shastaram pranamamyaham || 5|| tryambakapuradhisham ganadhipasamanvitam | gajarudhamaham
    vande shastaram pranamamyaham || 6|| shivaviryasamudbhutam shrinivasatanudbhavam | shikhivahanujam
    vande shastaram pranamamyaham || 7|| yasya dhanvantarirmata pita devo maheshvarah | tam shastaramaham
    vande maharoganivaranam || 8|| bhutanathadayananda sarvabhutadayapara | raksha raksha mahabaho shastre
    tubhyam namo namah || 9|| ashyama komalavishalatanum vicitram vaso vasanamarunotpaladamahastam | uttungaratnamakutam
    kutilagrakesham shastaramishtavaradam sharanam prapadye || 10|| iti shastadashakam sampurnam |
  devanagari: शम्भोः प्रियं सुतम् । क्षिप्रप्रसादनिरतं शास्तारं प्रणमाम्यहम् ॥ २॥ मत्तमातङ्गगमनं कारुण्यामृतपूरितम्
    । सर्वविघ्नहरं देवं शास्तारं प्रणमाम्यहम् ॥ ३॥ अस्मत्कुलेश्वरं देवमस्मचछत्रुविनाशनम् । अस्मदिष्टप्रदातारं
    शास्तारं प्रणमाम्यहम् ॥ ४॥ पाण्ड्येशवंशतिलकं केरळे केलिविग्रहम् । आर्तत्राणपरं देवं शास्तारं प्रणमाम्यहम्
    ॥ ५॥ त्र्यम्बकपुराधीशं गणाधिपसमन्वितम् । गजारूढमहं वन्दे शास्तारं प्रणमाम्यहम् ॥ ६॥ शिववीर्यसमुद्भूतं
    श्रीनिवासतनूद्भवम् । शिखिवाहानुजं वन्दे शास्तारं प्रणमाम्यहम् ॥ ७॥ यस्य धन्वन्तरिर्माता पिता देवो
    महेश्वरः । तं शास्तारमहं वन्दे महारोगनिवारणम् ॥ ८॥ भूतनाथदयानन्द सर्वभूतदयापर । रक्ष रक्ष महाबाहो
    शास्त्रे तुभ्यं नमो नमः ॥ ९॥ आश्याम कोमलविशालतनुं विचित्रं वासो वसानमरुणोत्पलदामहस्तम् । उत्तुङ्गरत्नमकुटं
    कुटिलाग्रकेशं शास्तारमिष्टवरदं शरणं प्रपद्ये ॥ १०॥ इति शास्तादशकं सम्पूर्णम् ।
