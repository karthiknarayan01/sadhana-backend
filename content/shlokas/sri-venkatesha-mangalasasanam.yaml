id: sri-venkatesha-mangalasasanam
category: stotram
name:
  english: Sri Venkatesha Mangalasasanam
content:
  english: shriyah kantaya kalyananidhaye nidhaye'rthinam | shrivenkata nivasaya shrinivasaya mangalam
    || || lakshmi savibhramaloka subhru vibhrama cakshushe | cakshushe sarvalokanam venkateshaya mangalam
    || || shrivenkatadri shringagra mangalabharananghraye | mangalanam nivasaya shrinivasaya mangalam
    || || sarvavayava saundarya sampada sarvacetasam | sada sammohanayastu venkateshaya mangalam || ||
    nityaya niravadyaya satyananda cidatmane | sarvantaratmane shrimad venkateshaya mangalam || || svata
    ssarvavide sarva shaktaye sarvasheshine | sulabhaya sushilaya venkateshaya mangalam || || parasmai
    brahmane purnakamaya paramatmane | prayunje paratattvaya venkateshaya mangalam || || akalatattva mashranta
    matmana manupashyatam | atriptyamrita rupaya venkateshaya mangalam || || prayah svacaranau pumsam
    sharanyatvena panina | kripaya''dishate shrimad venkateshaya mangalam || || daya'mrita taranginya
    starangairiva shitalaih | apangai ssincate vishvam venkateshaya mangalam || bhushambara hetinam sushama''vahamurtaye
    | sarvarti shamanayastu venkateshaya mangalam || || shrivaikuntha viraktaya svami pushkarinitate |
    ramaya ramamanaya venkateshaya mangalam || sundaraja matrimuni manasavasine | sarvaloka nivasaya shrinivasaya
    mangalam || madacarya purogamaih | sarvaishca purvairacaryaih satkritayastu mangalam || || shri padmavati
    sameta shri shrinivasa parabrahmane namah
  devanagari: श्रियः कान्ताय कल्याणनिधये निधयेऽर्थिनाम् । श्रीवेङ्कट निवासाय श्रीनिवासाय मङ्गलम् ॥ ॥ लक्ष्मी
    सविभ्रमालोक सुभ्रू विभ्रम चक्षुषे । चक्षुषे सर्वलोकानां वेङ्कटेशाय मङ्गलम् ॥ ॥ श्रीवेङ्कटाद्रि शृङ्गाग्र
    मङ्गलाभरणाङ्घ्रये । मङ्गलानां निवासाय श्रीनिवासाय मङ्गलम् ॥ ॥ सर्वावयव सौन्दर्य सम्पदा सर्वचेतसाम्
    । सदा सम्मोहनायास्तु वेङ्कटेशाय मङ्गलम् ॥ ॥ नित्याय निरवद्याय सत्यानन्द चिदात्मने । सर्वान्तरात्मने
    श्रीमद् वेङ्कटेशाय मङ्गलम् ॥ ॥ स्वत स्सर्वविदे सर्व शक्तये सर्वशेषिणे । सुलभाय सुशीलाय वेङ्कटेशाय
    मङ्गलम् ॥ ॥ परस्मै ब्रह्मणे पूर्णकामाय परमात्मने । प्रयुञ्जे परतत्त्वाय वेङ्कटेशाय मङ्गलम् ॥ ॥ आकालतत्त्व
    मश्रान्त मात्मना मनुपश्यताम् । अतृप्त्यमृत रूपाय वेङ्कटेशाय मङ्गलम् ॥ ॥ प्रायः स्वचरणौ पुंसां शरण्यत्वेन
    पाणिना । कृपयाऽऽदिशते श्रीमद् वेङ्कटेशाय मङ्गलम् ॥ ॥ दयाऽमृत तरङ्गिण्या स्तरङ्गैरिव शीतलैः । अपाङ्गै
    स्सिञ्चते विश्वं वेङ्कटेशाय मङ्गलम् ॥ भूषाम्बर हेतीनां सुषमाऽऽवहमूर्तये । सर्वार्ति शमनायास्तु वेङ्कटेशाय
    मङ्गलम् ॥ ॥ श्रीवैकुण्ठ विरक्ताय स्वामि पुष्करिणीतटे । रमया रममाणाय वेङ्कटेशाय मङ्गलम् ॥ सुन्दरजा
    मातृमुनि मानसवासिने । सर्वलोक निवासाय श्रीनिवासाय मङ्गलम् ॥ मदाचार्य पुरोगमैः । सर्वैश्च पूर्वैराचार्यैः
    सत्कृतायास्तु मङ्गलम् ॥ ॥ श्री पद्मावती समेत श्री श्रीनिवास परब्रह्मणे नमः
