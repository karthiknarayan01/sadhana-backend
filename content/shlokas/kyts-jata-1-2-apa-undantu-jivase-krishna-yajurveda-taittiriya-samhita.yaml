id: kyts-jata-1-2-apa-undantu-jivase-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.2 Apa Undantu Jivase - Krishna Yajurveda Taittiriya Samhita
content:
  english: apa undantundantvapa apa undantu | undantu jivase jivasa undantu ndantu jivase jivase dirghayutvaya
    dirghayutvaya jivase jivase dirghayutvaya | dirghayutvaya varcase varcase dirghayutvaya dirghayutvaya
    varcase | dirghayutvayeti dirghayu varcasa oshadha oshadhe varcase varcasa oshadhe | oshadhe trayasva
    trayasvaushadha oshadhe trayasva | ntrayasva trayasvainam | svadhite svadhita ena mena svadhite ma
    ma svadhite svadhite ma | devashru retanyetani devashru rdevashru retani | etani pra praitanyetani
    pra | pra vape vape pra pra vape | vape svasti svasti vape vape svasti | sva styuttara nyuttarani
    svasti sva styuttarani | uttara nyashiyashi yottara nyuttara nyashiya | ashiyapa apo 'shiyashiyapah
    | apo asma nasma napa apo asman | nmataro mataro 'sma nasma matarah shundhantu shundhantu mataro matarah
    shundhantu | shundhantu ghritena ghritena shundhantu shundhantu ghritena | ghritena no no ghritena
    ghritena nah | no ghritapuvo ghritapuvo no no ghritapuvah | ghritapuvah punantu punantu ghritapuvo
    ghritapuvah punantu | mpunantu punantu vishva pra vahantu vahantu pra pra vahantu | vahantu ripragm
    ripram va~hantu vahantu ripram | dripragm ripra mut | a putah puta a putah | myemi putah puta emi
    | emi somasya somasyaimyemi somasya | ssomasya somasya tanuh | tanu rasyasi tanu stanu rasi | ntanuva
    masyasi tanuva me pahi pahi me me pahi | mpahi pahi mahinam | 'syasi payah payo 'si | asi varcodha
    varcodha asyasi varcodhah | varcodha asyasi varcodha varcodha asi | varcodha iti varcah varco mayi
    mayi varco varco mayi | || mayi dhehi dhehi mayi mayi dhehi | dhehi vritrasya vritrasya dhehi dhehi
    vritrasya | vritrasya kaninika kaninika vritrasya vritrasya kaninika | kaninika 'syasi kaninika kaninika
    'si | asi cakshushpa shcakshushpa asyasi cakshushpah | cakshushpa asyasi cakshushpa shcakshushpa asi
    | cakshushpa iti cakshuh asi cakshu shcakshu rasyasi cakshuh | rme me cakshu shcakshu me pahi pahi
    me me pahi | pahi citpati shcitpatih pahi pahi citpatih | citpati stva tva citpati shcitpati stva
    | tva punatu punatu tva tva punatu | rvakpatih punatu punatu vakpatih | vakpati stva tva vakpati rvakpati
    stva | tva punatu punatu tva tva punatu | punatu devo devah punatu punatu devah | tva devo deva stva
    tva savita savita tva savita punatu punatu savita savita punatu | puna tvacchidre nacchidrena punatu
    puna tvacchidrena | acchidrena pavitrena pavitre nacchidre nacchidrena pavitrena | pavitrena pavitrena
    vasoh ssuryasya suryasya vaso suryasya rashmibhi rashmibhi ssuryasya suryasya rashmibhih | rashmibhistasya
    tasya rashmibhi rashmibhistasya | rashmibhiriti rashmi tasya te te tasya tasya te | te pavitrapate
    pavitrapate te te pavitrapate | pavitrapate pavitrena pavitrena pavitrapate pavitrapate pavitrena
    | pavitrapata iti pavitra pavitrena yasmai yasmai pavitrena pavitrena yasmai ya~smai yasmai kam |
    shakeya ma shakeyagm shakeya ma | vo devaso devasovo vo devasah | devasa imaha imahe devaso devasa
    imahe | imahe satyadharmana ssatyadharmana imaha imahe satyadharmanah | satyadharmano addhvare addhvare
    satyadharmana ssatyadharmano addhvare | satyadharmana iti satya dyadaddhvare addhvare yat | vo devaso
    devaso vo vo devasah | devasa agura agure devaso devasa agure | agure yajniyaso yajniyasa agura agure
    yajniyasah | yajniyaso havamahe havamahe yajniyaso yajniyaso havamahe | gni havamahe havamaha indra
    gni dyavaprithivi dyavaprithivi indra gni dyavaprithivi | dyavaprithivi apa apo dyavaprithivi dyavaprithivi
    apah | dyavaprithivi iti dyava apa oshadhi roshadhi rapa apa oshadhih | ntva moshadhi roshadhi stvam
    | dikshana madhipatiradhipati ndikshana madhipatih | adhipati rasya syadhipati radhipati rasi | asihe
    hasyasiha | prayuje 'gnaye 'gnaye agnaye svaha svaha 'gnaye 'gnaye svaha svaha medhayai medhayai svaha
    svaha medhayai medhayai manase manase medhayai medhayai manase | manase 'gnaye 'gnaye manase manase
    'gnaye agnaye svaha svaha 'gnaye 'gnaye svaha svaha dikshayai dikshayai svaha svaha dikshayai dikshayai
    tapase tapase dikshayai dikshayai tapase | tapase 'gnaye 'gnaye tapase tapase 'gnaye agnaye svaha
    svaha 'gnaye 'gnaye svaha svaha sarasvatyai sarasvatyai svaha svaha sarasvatyai | sarasvatyai pushne
    pushne sarasvatyai sarasvatyai pushne | 'gnaye 'gnaye pushne pushne agnaye svaha svaha 'gnaye 'gnaye
    svaha ssvaha svaha ''pah | rdevirapa apo devih | rvishvashambhuvo vishvashambhuvo brihati rvishvashambhuvah
    | vishvashambhuvo dyavaprithivi dyavaprithivi vishvashambhuvo vishvashambhuvo dyavaprithivi | vishvashambhuva
    iti vishva dyavaprithivi ururu dyavaprithivi dyavaprithivi uru | dyavaprithivi iti dyava urvantariksha
    mantariksha muru rbrihaspatirantariksha mantariksha no havisha havisha no no havisha havisha vridhatu
    vridhatu havisha havisha vridhatu | vridhatu svaha svaha vridhatu vridhatu svaha svaha vishve vishve
    svaha svaha vishve vishve devasya devasya vishve vishve devasya | rdevasya devasya netuh | rmarto
    marto netu marto vrinita vrinita marto marto vrinita | vrinita sakhyagm sakhyam vri~nita vrinita sakhyam
    | vi~shve vishve sakhyagm sakhyam vishve rayo rayo vishve vishve rayah | raya ishuddhya sishuddhyasi
    rayo raya ishuddhyasi | ishuddhyasi dyumna ndyumna mishuddhya sishuddhyasi dyumnam | vri~nita vrinita
    dyumna vrinita pushyase pushyase vrinita vrinita pushyase pushyase svaha svaha pushyase pushyase svaha
    ssvaha svaharkhsamayoh shshilpe shilpe rikhsamayor rikhsamayorityrik stha ste te sthah stha ste |
    rabhe te te rabhe rabhe te | mma ma patam | || asya yajnasya yajnasya syasya yajnasya | yajnasyodrica
    udrico yajnasya yajnasyodricah | udrica ima mima mudrica udrica imam | shikshamanasya shikshamanasya
    dhiya shikshamanasya deva deva shikshamanasya shikshamanasya deva | sagm shishadhi shishadhi sagm
    sagm shishadhi | shishadhi yaya yaya shishadhi shishadhi yaya yaya 'tyati yaya yaya 'ti | ati vishva
    vishva 'tyati vishva vishva durita durita vishva vishva durita | durita tarema tarema durita durita
    tarema | tarema sutarmanagm sutarmana ntarema tarema sutarmanam | sutarmana madhyadhi sutarmanagm
    sutarmana madhi | adhi navannava madhyadhi nava ruhemorgurg ruhema ruhemork | ngi rasyasya syangi
    rasi | angi rasyurnamrada urnamrada angi rasya ngi rasyurnamradah | urnamrada urja murja murnamrada
    urnamrada urja urnamrada ityurna mme ma urja murja me yaccha yaccha me me yaccha | yaccha pahi pahi
    yaccha yaccha pahi | pahi ma ma pahi pahi ma ma ma ma ma ma ma | shsharma sharma vishno syasi sharma
    sharmasi | sharma yajamanasya yajamanasya sharma sharma yajamanasya | yajamanasya sharma sharma yajamanasya
    yajamanasya sharma | sharma me me sharma sharma me | me yaccha yaccha me me yaccha | ya~ccha yaccha
    nakshatranam | mma ma nakshatrana ma 'tikasha datikasha nma ma 'tikashat | tpahi pahyatikasha datikasha
    pahindrasye ndrasya pahi pahindrasya | ryoni rindrasye ndrasya yonih | asi ma ma 'syasi ma | || sih
    krishyai krishyai hi tva krishyai krishyai tva tva susasyayai susasyayai tva tva susasyayai susasyayai
    supippalabhyah supippalabhyah susasyayai susasyayai supippalabhyah | susasyaya iti su supippalabhya
    stva tva supippalabhyah supippalabhya stva | supippalabhya iti su tvaushadhibhya oshadhibhya stva
    tvaushadhibhyah | ssupastha oshadhibhya oshadhibhya supastha devo deva rdevo devo vanaspatih | vanaspati
    rurdhva urdhvo vanaspati rvanaspati rurdhvah | urdhvo ma mordhva urdhvo ma ma pahi pahi ma ma pahi
    | pahya pahi pahya | odrica udrica odricah | ssvaha svahodrica udrica svaha svaha yajnam | mmanasa
    manasa yajnam manasa svaha svaha manasa manasa svaha svaha dyavaprithivibhya ndyavaprithivibhya svaha
    svaha dyavaprithivibhya svaha svaha dyavaprithivibhya ndyavaprithivibhya dyavaprithivibhyamiti dyava
    ssvaha svahoroh | uro rantariksha dantariksha duro ruro rantarikshat | thsvaha svaha 'ntariksha dantariksha
    svaha svaha yajnam | mmanamahe manamahe dhiya manamahe sumridikagm sumridika mmanamahe manamahe sumridikam
    | sumridika mabhishtaye 'bhishtaye sumridikagm sumridika mabhishtaye | abhishtaye varcodham va~rcodha
    mabhishtaye 'bhishtaye varcodham | varcodhamiti varcah yajnavahasagm supara supara yajnavahasam ya~jnavahasagm
    supara | yajnavahasamiti yajna ssupara supara nah | ye deva deva ye ye devah | deva manojata manojata
    deva deva manojatah | manojata manoyujo manoyujo manojata manojata manoyujah | ssudaksha manoyujo
    manoyujah sudakshah sudaksha dakshapitaro dakshapitara ssudaksha dakshapitarah | dakshapitara ste
    te dakshapitaro dakshapitara ste | dakshapitara iti daksha te no na ste te nah | nah pantu pantu no
    nah pantu | te no na ste te nah | no 'va ntvavantu no no 'vantu | avantu tebhya stebhyo 'va ntvavantu
    tebhyah | tebhyo namo nama stebhya stebhyo namah | nama stebhya stebhyo namo nama stebhyah | ssvaha
    svaha tebhya stebhya svaha 'gne agne svaha svaha 'gne ntva magne 'gne tvam | su jagrihi jagrihi su
    su jagrihi | njagrihi jagrihi vayam | su mandishimahi mandishimahi su su mandishimahi | mandishimahi
    gopaya gopaya mandishimahi mandishimahi gopaya | gopaya no no gopaya gopaya nah | prabudhe no nah
    prabudhe rdado dadah punah puna tva magne agne tva agne vratapa vratapa agne agne vratapah | vratapa
    asyasi vratapa vratapa asi | deva a devo deva a | a martyeshu martyeshva martyeshu | martyeshva martyeshu
    martyeshva | ya~jneshu yajneshu tva yajne shvidya idyo yajneshu yajne shvidyah | vishve deva deva
    vishve vishve devah | deva abhyabhi deva deva abhi | mma mabhyabhi mam | npusha pusha 'vavritra pusha
    sanya sanya pusha pusha sanya | ssomah sanya sanya somah | somo radhasa radhasa soma radhasa devo
    devo radhasa radhasa devah | ssavita savita devo deva ssavita savita vasoh rvasudava vasudava vaso
    vasudava rasva rasva vasudava vasudava rasva | drasva rasve yat | a bhuyo bhuya a bhuyah | bhuyo bhara
    bhara bhuyo bhuyo bhara | bhara ma ma bhara bhara ma | npurtya purtya prina purtya vi vi purtya purtya
    vi | vi radhi radhi vi vi radhi | radhi ma ma radhi radhi ma | aha mayusha ''yusha 'ha maha mayusha
    | ncandra mayusha ''yusha candram | candra masyasi candra mama bhogaya bhogaya mama mama bhogaya |
    bhogaya bhava bhava bhogaya bhogaya bhava | vastra masyasi vastram mama bhogaya bhogaya mama mama
    bhogaya | bhogaya bhava bhava bhogaya bhogaya bhava | bhavo srosra bhava bhavosra | usra 'sya syusrosra
    'si | mama bhogaya bhogaya mama mama bhogaya | bhogaya bhava bhava bhogaya bhogaya bhava | bhava hayo
    hayo bhava bhava hayah | 'syasi hayo hayo 'si | mama bhogaya bhogaya mama mama bhogaya | bhogaya bhava
    bhava bhogaya bhogaya bhava | bhava chaga shchago bhava bhava chagah | || 'syasi chaga shchago 'si
    | mama bhogaya bhogaya mama mama bhogaya | bhogaya bhava bhava bhogaya bhogaya bhava | bhava mesho
    mesho bhava bhava meshah | 'syasi mesho mesho 'si | mama bhogaya bhogaya mama mama bhogaya | bhogaya
    bhava bhava bhogaya bhogaya bhava | bhava vayave vayave bhava bhava vayave tva tva vayave vayave tva
    varunaya varunaya tva tva varunaya | varunaya tva tva varunaya varunaya tva | rityai tva tva nir rityai
    tva tva nir tva rudraya rudraya tva tva rudraya | rudraya tva tva rudraya rudraya tva | devi rapa
    apo devi apo apa mapa mapa apo apam | havishyo havishya urmi rurmir havishya indriyava nindriyavan
    havishyo havishya indriyavan | nmadintamo madintama indriyava nindriyava mmadintamo madintama stam
    | vo ma ma vo vo ma | ma 'vava ma ma 'va | nkramisha mavava kramisham | kramisha macchinna macchinna
    nkramisha macchinnam | ntantu macchinna macchinna mprithivyah prithivya stantu prithivya anvanu prithivyah
    prithivya anu | ngesha manvanu gesham | bhadra dabhyabhi bhadra shshreyo 'bhyabhi shreyah | shreyah
    pra pra shreya pre hihi pra pre hi | rbrihaspati rihihi brihaspatih | brihaspatih puraeta puraeta
    brihaspati rbrihaspatih puraeta | puraeta te te puraeta puraeta te te astvastu te te astu | ava sya
    syavava sya | a prithivyah prithivya a prithivyah | prithivya ara are prithivyah prithivya are | nchatru
    nara are shatrun | n krinuhi krinuhi shatru ssarvavirah krinuhi krinuhi sarvavirah | sarvavira a sarvavira
    sarvavira iti sarva ida maganmaganme da mida maganma | ndevayajana maganmaganma devayajanam | mprithivyah
    prithivya devayajana prithivya vishve vishve prithivyah prithivya vishve vishve deva deva vishve vishve
    devah | yadajusha ntajushanta ya ajushanta purve purve 'jusha ntajushanta purve purva rikhsamabhya
    mrikhsamabhya mpurve purva rikhsamabhya ya~jusha yajusharkhsamabhya mrikhsamabhyam rikhsamabhyamityrikhsama
    ssantaranto yajusha yajusha santarantah | santaranto rayo raya ssantaranto rayah | raya sposhena poshena
    rayo raya sposhena | mposhena poshena sam | sa mishesha sagm sa misha | isha madema mademe shesha
    madema | te shukra shukra te te shukra | shshukra shukra tanuh | ntanu stanu ridam | va~rco varca
    ida midam varca staya taya varco varca staya asi dhrita dhrita 'syasi dhrita | dhrita manasa manasa
    dhrita dhrita manasa | manasa jushta jushta manasa manasa jushta jushta vishnave vishnave jushta jushta
    vishnave | vishnave tasya stasya vishnave vishnave tasyah ste te tasya stasya ssatyasavasa ste te
    satyasavasah | satyasavasah prasave prasave satyasavasa ssatyasavasah prasave | satyasavasa iti satya
    prasave vaco vacah prasave prasave vacah | va~co vaco yantram | yantra mashiyashiya yantram ashiya
    svaha svaha 'shiyashiya svaha svaha shukragm shukragg svaha svaha shukram | shukra masyasi shukragm
    shukra masi | asyamrita mamrita masya syamrita amrita masya syamrita mamrita masi | shvadeva masyasi
    vaishvadevam | vaishvadevagm havir vaishvadevamiti vaishva ssuryasya suryasya havir suryasya cakshu
    shcakshu ssuryasya suryasya cakshuh | cakshura cakshu shcakshura | a 'ruha maruha ma 'ruham | aruha
    magne ragne raruha maruha magneh | 'gne ragne rakshnah | nkaninika makshno 'kshnah kaninikam | yadetashebhi
    retashebhi etashebhi riyasa iyasa etashebhi retashebhi riyase | iyase bhrajamano bhrajamana iyasa
    iyase bhrajamanah | bhrajamano vipashcita vipashcita bhrajamano bhrajamano vipashcita vipashcita cic
    ci dvipashcita vipashcita cit | cida syasi cic cidasi | asi mana mana 'syasi mana | mana 'syasi mana
    mana 'si | asi dakshina dakshina 'syasi dakshina | dakshina 'syasi dakshina dakshina 'si | || asi
    yajniya yajniya 'syasi yajniya yajniya 'si | asya diti raditi rasyasya ditih | aditi rasyasya diti
    raditi rasi | shn yubhayatashshir shnya sya syubhayatashshir shni sa sobhayatashshir shn yubhayatashshir
    ssupraci supraci no na supraci supratici supratici supraci supraci supratici | supratici sagm sagm
    supratici supratici sam | bhava mitro mitro bhava bhava mitrah | tva mitro mitra stva tva padi padi
    tva padi baddhnatu baddhnatu padi padi baddhnatu | baddhnatu pusha pusha baddhnatu baddhnatu pusha
    | pusha 'ddhvano 'ddhvanah pusha pusha 'ddhvanah | addhvanah patu patvaddhvano 'ddhvanah patu | patvindraye
    ndraya patu patvindraya | indra yaddhyaksha yaddhyakshaye ndraye ndra yaddhyakshaya | addhyakshaya
    nvanvaddhyaksha yaddhyakshaya nu | addhyakshayetyadhi anu tva tva 'nvanu tva | tva mata mata tva mmata
    mata manyatam | manyata manvanu manyata anu pita pita 'nvanu pita | pita 'nvanu pita pita 'nu | anu
    bhrata bhrata 'nvanu bhrata ssagarbhyo bhrata bhrata sagarbhyah | sagarbhyo 'nvanu sagarbhya anu sakha
    sakha 'nvanu sakha sa devi devi sa sa devi | ndevi devi devam | acche hihya cchacche hi | ihi ndraye
    ndraye hihi ndraya | soma mindraye ndraya soma tva rudro rudra stva a vartayatu vartayatva vartayatu
    | vartayatu mitrasya mitrasya vartayatu vartayatu mitrasya | mitrasya patha patha mitrasya mitrasya
    patha | patha svasti svasti patha patha svasti | svasti somasakha somasakha svasti svasti somasakha
    | ssomasakha somasakha punah | puna ra punah puna ra | ihi saha sahe hihi saha | saha rayya rayya
    saha saha rayya | rayyeti rayya | || vasvyasyasi vasvi vasvyasi | asi rudra rudra 'syasi rudra | rudra
    'syasi rudra rudra 'si | asya diti raditi rasya syaditih | aditi rasyasya diti raditi rasi | asyaditya
    ''ditya 'syasyaditya | aditya 'syasyaditya ''ditya 'si | asi shukra shukra 'syasi shukra | shukra
    'syasi shukra shukra 'si | asi candra candra 'syasi candra | candra 'syasi candra candra 'si | rbrihaspati
    rasyasi brihaspatih | brihaspati stva tva brihaspati rbrihaspati stva | tva sumne sumne tva sumne
    ranvatu ranvatu sumne sumne ranvatu | ranvatu rudro rudro ranvatu ranvatu rudrah | rvasubhi rudro
    rudro vasubhih | a ciketu ciketva ciketu | ciketu prithivyah prithivya shciketu ciketu prithivyah
    | tva prithivyah prithivya stva a jigharmi jigharmya jigharmi | jigharmi devayajane devayajane jigharmi
    jigharmi devayajane | devayajana idaya idaya devayajane devayajana idayah | idayah pade pada idaya
    idayah pade | pade ghritavati ghritavati pade pade ghritavati | ghritavati svaha svaha ghritavati
    ghritavati svaha svaha svaha parilikhitam | raksho rakshah parilikhita parilikhitamiti pari rakshah
    parilikhitah parilikhita raksho rakshah parilikhitah | parilikhita aratayo 'ratayah parilikhitah parilikhita
    aratayah | parilikhita iti pari arataya ida mida maratayo 'rataya idam | ida maha maha mida mida maham
    | ahagm rakshaso rakshaso 'ha mahagm rakshasah | rakshaso griva griva rakshaso rakshaso grivah | griva
    apyapi griva griva api | api krintami krintamyapyapi krintami | krintami yo yah krintami krintami
    yah | ndveshti dveshtyasma nasma ndveshti dveshti yam | ndvishmo dvishmo vayam ndvishmo dvishma idam
    | ida masyasye da mida masya | asya griva griva asyasya grivah | griva apyapi griva griva api | ||
    api krintami krinta myapyapi krintami | krinta myasme asme krintami krinta myasme | asme rayo rayo
    'sme asme rayah | raya stve tve rayo raya stve | tve rayo raya stve tve rayah | rayastote tote rayo
    rayastote tote rayo rayastote tote rayah | ssagm sagm rayo raya ndevi devi sagm sa devi devya devya
    devi devi devya | devyorvashyorvashya devya devyorvashya urvashya pashyasva pashyasvorvashyorvashya
    pashyasva | pashyasva tvashtimati tvashtimati pashyasva pashyasva tvashtimati | tvashtimati te te
    tvashtimati tvashtimati te | te sapeya sapeya te te sapeya | ssapeya sapeya suretah sureta reto retah
    sureta reto dadhana dadhana reto reto dadhana | ndadhana dadhana viram | videya tava tava videya videya
    tava | tava sandrishi sandrishi tava tava sandrishi | sandrishi ma ma sandrishi sandrishi ma | ahagm
    rayo rayo 'ha mahagm rayah | raya sposhena poshena rayo raya sposhena | poshena vi vi poshena poshena
    vi | yoshamiti yosham | || mparusha parusha pricyata parusha paruh paruh parusha parusha paruh | rgandho
    gandhah paruh paru gandha ste te gandho gandha ste avatu madaya mada yavatvavatu madaya | madaya raso
    raso madaya madaya rasah | raso acyuto acyuto raso raso acyutah | acyuto 'matyo 'matyo acyuto acyuto
    'matyah | 'syasyamatyo 'matyo 'si | shukra ste te shukra te graho grahaste te grahah | graho 'bhyabhi
