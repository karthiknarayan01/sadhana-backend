id: trailokyamangalakavacam
category: kavacha
name:
  english: trailokyamangalakavacam
  devanagari: त्रैलोक्यमन्गलकवचम्
content:
  english: shaya ashtadasharnah kamanto vayavye mam sada'vatu || 25|| shrim mayakamakrishnaya govindaya
    dvitho manuh | dvadasharnatmako vishnuruttare mam sada'vatu || 26|| vagbhayam kamakrishnaya hrim govindaya
    tatparam | shri gopijanavallabhantaya svaha hastau tatah || 27|| dvavimshatyaksharo mantro mamaishanye
    sada'vatu | kaliyasya phanamadhye divyam nrityam karoti tam || 28|| namami devakiputram nrityarajanamacyutam
    | dvatrimshadaksharo mantro'pyadho mam sarvada'vatu || 29|| kamadevaya vidmahe pushpabanaya dhimahi
    | tanno'nangah pracodayadesha mam patucordhvatah || 30|| iti te kathitam vipra brahmamantraughavigraham
    | trailokyamangalam nama kavacam brahmarupakam || 31|| brahmana kathitam purvam narayanamukhacchrutam
    | tava snehanmayakhyatam pravaktavyam na kasyacit || 32|| gurum pranamya vidhivatkavacam prapathettatah
    | sakriddvistriryathajnanam sa hi sarvatapomayah || 33|| mantreshu sakaleshveva deshiko natra samshayah
    | shatamashtottaram casya purashcarya vidhih smritah || 34|| havanadindashamshena kritva tatsadhayeddhruvam
    | yadi syatsiddhakavaco vishnureva bhavetsvayam || 35|| mantrasiddhirbhavettasya purashcaryavidhanatah
    | spardhamuddhuya satatam lakshmirvani vasettatah || 36|| pushpanjalyashtakam datva mulenaiva pathetsakrit
    | dashavarshasahasrani pujayah phalamapnuyat || 37|| bhurje vilikhyangulikam svarnastham dharayedyadi
    | kanthe va dakshine bahau so'pi vishnurna samshayah || 38|| ashvamedhasahasrani vajapeyashatani ca
    | mahadanani yanyeva pradakshinyam bhuvastatha || 39|| kalam narhanti tanyeva sakriduccaranattatah
    | kavacasya prasadena jivanmukto bhavennarah || 40|| trailokyam kshobhayatyeva trailokyavijayi bhavet
    | idam kavacamajnatva yajedyah purushottamam | shatalaksham prajapto'pi na mantrastasya siddhyati
    || 41|| iti shri naradapancaratre jnanamritasare trailokyamangalam nama vishnukavacam sampurnam ||
  devanagari: शाय अष्टादषार्णः कामान्तो वायव्ये मां सदाऽवतु ॥ २५॥ श्रीं मायाकामकृष्णाय गोविन्दाय द्विठो
    मनुः । द्वादशार्णात्मको विष्णुरुत्तरे मां सदाऽवतु ॥ २६॥ वाग्भयं कामकृष्णाय ह्रीं गोविन्दाय तत्परम्
    । श्री गोपीजनवल्लभान्ताय स्वाहा हस्तौ ततः ॥ २७॥ द्वाविंशत्यक्षरो मन्त्रो मामैशान्ये सदाऽवतु । कालियस्य
    फणामध्ये दिव्यं नृत्यं करोति तम् ॥ २८॥ नमामि देवकीपुत्रं नृत्यराजानमच्युतम् । द्वात्रिंशदक्षरो मन्त्रोऽप्यधो
    मां सर्वदाऽवतु ॥ २९॥ कामदेवाय विद्महे पुष्पबाणाय धीमहि । तन्नोऽनङ्गः प्रचोदयादेषा मां पातुचोर्ध्वतः
    ॥ ३०॥ इति ते कथितं विप्र ब्रह्ममन्त्रौघविग्रहम् । त्रैलोक्यमङ्गलं नाम कवचं ब्रह्मरूपकम् ॥ ३१॥ ब्रह्मणा
    कथितं पूर्वं नारायणमुखाच्छ्रुतम् । तव स्नेहान्मयाख्यातं प्रवक्तव्यं न कस्यचित् ॥ ३२॥ गुरुं प्रणम्य
    विधिवत्कवचं प्रपठेत्ततः । सकृद्द्विस्त्रिर्यथाज्ञानं स हि सर्वतपोमयः ॥ ३३॥ मन्त्रेषु सकलेष्वेव देशिको
    नात्र संशयः । शतमष्टोत्तरं चास्य पुरश्चर्या विधिः स्मृतः ॥ ३४॥ हवनादीन्दशांशेन कृत्वा तत्साधयेद्ध्रुवम्
    । यदि स्यात्सिद्धकवचो विष्णुरेव भवेत्स्वयम् ॥ ३५॥ मन्त्रसिद्धिर्भवेत्तस्य पुरश्चर्याविधानतः । स्पर्धामुद्धूय
    सततं लक्ष्मीर्वाणी वसेत्ततः ॥ ३६॥ पुष्पाञ्जल्यष्टकं दत्वा मूलेनैव पठेत्सकृत् । दशवर्षसहस्राणि पूजायाः
    फलमाप्नुयात् ॥ ३७॥ भूर्जे विलिख्याङ्गुलिकां स्वर्णस्थां धारयेद्यदि । कण्ठे वा दक्षिणे बाहौ सोऽपि विष्णुर्न
    संशयः ॥ ३८॥ अश्वमेधसहस्राणि वाजपेयशतानि च । महादानानि यान्येव प्रादक्षिण्यं भुवस्तथा ॥ ३९॥ कलां नार्हन्ति
    तान्येव सकृदुच्चारणात्ततः । कवचस्य प्रसादेन जीवन्मुक्तो भवेन्नरः ॥ ४०॥ त्रैलोक्यं क्षोभयत्येव त्रैलोक्यविजयी
    भवेत् । इदं कवचमज्ञात्वा यजेद्यः पुरुषोत्तमम् । शतलक्षं प्रजप्तोऽपि न मन्त्रस्तस्य सिद्ध्यति ॥ ४१॥
    इति श्री नारदपञ्चरात्रे ज्ञानामृतसारे त्रैलोक्यमङ्गलं नाम विष्णुकवचं सम्पूर्णम् ॥
