id: brahmavidyopanishat
category: upanishad
name:
  english: brahmavidyopanishat
  devanagari: ब्रह्मविद्योपनिषत्
content:
  english: atmanamatmana sakshadbrahma buddhva sunishcalam | dehajatyadisambandhanvarnashramasamanvitan
    || 29 || vedashastrani canyani padapamsumiva tyajet | gurubhaktim sada kuryacchreyase bhuyase narah
    || 30 || gurureva harih sakshannanya ityabravicchritih || 31 || shrutya yaduktam paramarthameva tatsamshayo
    natra tatah samastam | shrutya virodhe na bhavetpramanam bhavedanarthaya vina pramanam || 32 || dehasthah
    sakalo jneyo nishkalo dehavarjitah | aptopadeshagamyo'sau sarvatah samavasthitah || 33 || hamsahamseti
    yo bruyaddhamso brahma harih shivah | guruvaktrattu labhyeta pratyaksham sarvatomukham || 34 || tileshu
    ca yatha tailam pushpe gandha ivashritah | purushasya sharire'sminsa bahyabhyantare tatha || 35 ||
    ulkahasto yathaloke dravyamalokya tam tyajet | jnanena jneyamalokya pashcajjnanam parityajet || 36
    || pushpavatsakalam vidyadgandhastasya tu nishkalah | vrikshastu sakalam vidyacchaya tasya tu nishkala
    || 37 || nishkalah sakalo bhavah sarvatraiva vyavasthitah | upayah sakalastadvadupeyashcaiva nishkalah
    || 38 || sakale sakalo bhavo nishkale nishkalastatha | ekamatro dvimatrashca trimatrashcaiva bhedatah
    || 39 || ardhamatra para jneya tata urdhvam paratparam | pancadha pancadaivatyam sakalam paripathyate
    || 40 || brahmano hridayasthanam kanthe vishnuh samashritah | talumadhye sthito rudro lalatastho maheshvarah
    || 41 || nasagre acyutam vidyattasyante tu param padam | paratvattu param nastityevam shastrasya nirnayah
    || 42 || dehatitam tu tam vidyannasagre dvadashangulam | tadantam tam vijaniyattatrastho vyapayetprabhuh
    || 43 || mano'pyanyatra nikshiptam cakshuranyatra patitam | tathapi yoginam yogo hyavicchinnah pravartate
    || 44 || etattu paramam guhyametattu paramam shubham | natah parataram kincinnatah parataram shubham
    || 45 || shuddhajnanamritam prapya paramaksharanirnayam | guhyadguhyatamam gopyam grahaniyam prayatnatah
    || 46 || naputraya pradatavyam nashishyaya kadacana | gurudevaya bhaktaya nityam bhaktiparaya ca ||
    47 || pradatavyamidam shastram netarebhyah pradapayet | datasya narakam yati siddhyate na kadacana
    || 48 || grihastho brahmacari ca vanaprasthashca bhikshukah | yatra tatra sthito jnani paramaksharavitsada
    || 49 || vishayi vishayasakto yati dehantare shubham | jnanadevasya shastrasya sarvavastho'pi manavah
    || 50 || brahmahatyashvamedhadyaih punyapapairna lipyate | codako bodhakashcaiva mokshadashca parah
    smritah || 51 || ityesham trividho jneya acaryastu mahitale | codako darshayenmargam bodhakah sthanamacaret
    || 52 || mokshadastu param tattvam yajjnatva paramashnute | pratyakshayajanam dehe samkshepacchrinu
    gautama || 53 || teneshtva sa naro yati shashvatam padamavyayam | svayameva tu sampashyeddehe bindum
    ca nishkalam || 54 || ayane dve ca vishuve sada pashyati margavit | kritvayamam pura vatsa recapurakakumbhakan
    || 55 || purvam cobhayamuccarya arcayettu yathakramam | namaskarena yogena mudrayarabhya carcayet
    || 56 || suryasya grahanam vatsa pratyakshayajanam smritam | jnanatsayujyamevoktam toye toyam yatha
    tatha || 57 || ete gunah pravartante yogabhyasakritashramaih | tasmadyogam samadaya sarvaduhkhabahishkritah
    || 58 || yogadhyanam sada kritva jnanam tanmayatam vrajet | jnanatsvarupam paramam hamsamantram samuccaret
    || 59 || praninam dehamadhye tu sthito hamsah sadacyutah | hamsa eva param satyam hamsa eva tu shaktikam
    || 60 || hamsa eva param vakyam hamsa eva tu vadikam | hamsa eva paro rudro hamsa eva paratparam ||
    61 || sarvadevasya madhyastho hamsa eva maheshvarah | prithivyadishivantam tu akaradyashca varnakah
    || 62 || kutanta hamsa eva syanmatriketi vyavasthitah | matrikarahitam mantramadishante na kutracit
    || 63 || hamsajyotiranupamyam madhye devam vyavasthitam | dakshinamukhamashritya jnanamudram prakalpayet
    || 64 || sada samadhim kurvita hamsamantramanusmaran | nirmalasphatikakaram divyarupamanuttamam ||
    65 || madhyadeshe param hamsam jnanamudratmarupakam | prano'panah samanashcodanavyanau ca vayavah
    || 66 || pancakarmendriyairuktah kriyashaktibalodyatah | nagah kurmashca krikaro devadatto dhananjayah
    || 67 || pancajnanendriyairyukta jnanashaktibalodyatah | pavakah shaktimadhye tu nabhicakre ravih
    sthitah || 68 || bandhamudra krita yena nasagre tu svalocane | akarevahnirityahurukare hridi samsthitah
    || 69 || makare ca bhruvormadhye pranashaktya prabodhayet | brahmagranthirakare ca vishnugranthirhridi
    sthitah || 70 || rudragranthirbhruvormadhye bhidyate'ksharavayuna | akare samsthito brahma ukare vishnurasthitah
    || 71 || makare samsthito rudrastato'syantah paratparah | kantham sankucya nadyadau stambhite yena
    shaktitah || 72 || rasana pidyamaneyam shodashi vordhvagamini | trikutam trividha caiva golakham nikharam
    tatha || 73 || trishankhavajramonkaramurdhvanalam bhruvormukham | kundalim calayanprananbhedayanshashimandalam
    || 74 || sadhayanvajrakumbhani navadvarani bandhayet | sumanahpavanarudhah sarago nirgunastatha ||
    75 || brahmasthane tu nadah syacchakinyamritavarshini | shatcakramandaloddharam jnanadipam prakashayet
    || 76 || sarvabhutasthitam devam sarvesham nityamarcayet | atmarupam tamalokya jnanarupam niramayam
    || 77 || drishyantam divyarupena sarvavyapi niranjanah | hamsa hamsa vadedvakyam praninam dehamashritah
  devanagari: आत्मानमात्मना साक्षाद्ब्रह्म बुद्ध्वा सुनिश्चलम् । देहजात्यादिसम्बन्धान्वर्णाश्रमसमन्वितान्
    ॥ २९ ॥ वेदशास्त्राणि चान्यानि पदपांसुमिव त्यजेत् । गुरुभक्तिं सदा कुर्याच्छ्रेयसे भूयसे नरः ॥ ३० ॥
    गुरुरेव हरिः साक्षान्नान्य इत्यब्रवीच्छृतिः ॥ ३१ ॥ श्रुत्या यदुक्तं परमार्थमेव तत्संशयो नात्र ततः
    समस्तम् । श्रुत्या विरोधे न भवेत्प्रमाणं भवेदनर्थाय विना प्रमाणम् ॥ ३२ ॥ देहस्थः सकलो ज्ञेयो निष्कलो
    देहवर्जितः । आप्तोपदेशगम्योऽसौ सर्वतः समवस्थितः ॥ ३३ ॥ हंसहंसेति यो ब्रूयाद्धंसो ब्रह्मा हरिः शिवः
    । गुरुवक्त्रात्तु लभ्येत प्रत्यक्षं सर्वतोमुखम् ॥ ३४ ॥ तिलेषु च यथा तैलं पुष्पे गन्ध इवाश्रितः । पुरुषस्य
    शरीरेऽस्मिन्स बाह्याभ्यन्तरे तथा ॥ ३५ ॥ उल्काहस्तो यथालोके द्रव्यमालोक्य तां त्यजेत् । ज्ञानेन ज्ञेयमालोक्य
    पश्चाज्ज्ञानं परित्यजेत् ॥ ३६ ॥ पुष्पवत्सकलं विद्याद्गन्धस्तस्य तु निष्कलः । वृक्षस्तु सकलं विद्याच्छाया
    तस्य तु निष्कला ॥ ३७ ॥ निष्कलः सकलो भावः सर्वत्रैव व्यवस्थितः । उपायः सकलस्तद्वदुपेयश्चैव निष्कलः
    ॥ ३८ ॥ सकले सकलो भावो निष्कले निष्कलस्तथा । एकमात्रो द्विमात्रश्च त्रिमात्रश्चैव भेदतः ॥ ३९ ॥ अर्धमात्र
    परा ज्ञेया तत ऊर्ध्वं परात्परम् । पञ्चधा पञ्चदैवत्यं सकलं परिपठ्यते ॥ ४० ॥ ब्रह्मणो हृदयस्थानं कण्ठे
    विष्णुः समाश्रितः । तालुमध्ये स्थितो रुद्रो ललाटस्थो महेश्वरः ॥ ४१ ॥ नासाग्रे अच्युतं विद्यात्तस्यान्ते
    तु परं पदम् । परत्वात्तु परं नास्तीत्येवं शास्त्रस्य निर्णयः ॥ ४२ ॥ देहातीतं तु तं विद्यान्नासाग्रे
    द्वादशाङ्गुलम् । तदन्तं तं विजानीयात्तत्रस्थो व्यापयेत्प्रभुः ॥ ४३ ॥ मनोऽप्यन्यत्र निक्षिप्तं चक्षुरन्यत्र
    पातितम् । तथापि योगिनां योगो ह्यविच्छिन्नः प्रवर्तते ॥ ४४ ॥ एतत्तु परमं गुह्यमेतत्तु परमं शुभम् ।
    नातः परतरं किञ्चिन्नातः परतरं शुभम् ॥ ४५ ॥ शुद्धज्ञानामृतं प्राप्य परमाक्षरनिर्णयम् । गुह्याद्गुह्यतमं
    गोप्यं ग्रहणीयं प्रयत्नतः ॥ ४६ ॥ नापुत्राय प्रदातव्यं नाशिष्याय कदाचन । गुरुदेवाय भक्ताय नित्यं भक्तिपराय
    च ॥ ४७ ॥ प्रदातव्यमिदं शास्त्रं नेतरेभ्यः प्रदापयेत् । दातास्य नरकं याति सिद्ध्यते न कदाचन ॥ ४८ ॥
    गृहस्थो ब्रह्मचारी च वानप्रस्थश्च भिक्षुकः । यत्र तत्र स्थितो ज्ञानी परमाक्षरवित्सदा ॥ ४९ ॥ विषयी
    विषयासक्तो याति देहान्तरे शुभम् । ज्ञानादेवास्य शास्त्रस्य सर्वावस्थोऽपि मानवः ॥ ५० ॥ ब्रह्महत्याश्वमेधाद्यैः
    पुण्यपापैर्न लिप्यते । चोदको बोधकश्चैव मोक्षदश्च परः स्मृतः ॥ ५१ ॥ इत्येषं त्रिविधो ज्ञेय आचार्यस्तु
    महीतले । चोदको दर्शयेन्मार्गं बोधकः स्थानमाचरेत् ॥ ५२ ॥ मोक्षदस्तु परं तत्त्वं यज्ज्ञात्वा परमश्नुते
    । प्रत्यक्षयजनं देहे संक्षेपाच्छृणु गौतम ॥ ५३ ॥ तेनेष्ट्वा स नरो याति शाश्वतं पदमव्ययम् । स्वयमेव
    तु संपश्येद्देहे बिन्दुं च निष्कलम् ॥ ५४ ॥ अयने द्वे च विषुवे सदा पश्यति मार्गवित् । कृत्वायामं पुरा
    वत्स रेचपूरककुम्भकान् ॥ ५५ ॥ पूर्वं चोभयमुच्चार्य अर्चयेत्तु यथाक्रमम् । नमस्कारेण योगेन मुद्रयारभ्य
    चार्चयेत् ॥ ५६ ॥ सूर्यस्य ग्रहणं वत्स प्रत्यक्षयजनं स्मृतम् । ज्ञानात्सायुज्यमेवोक्तं तोये तोयं यथा
    तथा ॥ ५७ ॥ एते गुणाः प्रवर्तन्ते योगाभ्यासकृतश्रमैः । तस्माद्योगं समादाय सर्वदुःखबहिष्कृतः ॥ ५८ ॥
    योगध्यानं सदा कृत्वा ज्ञानं तन्मयतां व्रजेत् । ज्ञानात्स्वरूपं परमं हंसमन्त्रं समुच्चरेत् ॥ ५९ ॥ प्राणिनां
    देहमध्ये तु स्थितो हंसः सदाच्युतः । हंस एव परं सत्यं हंस एव तु शक्तिकम् ॥ ६० ॥ हंस एव परं वाक्यं हंस
    एव तु वादिकम् । हंस एव परो रुद्रो हंस एव परात्परम् ॥ ६१ ॥ सर्वदेवस्य मध्यस्थो हंस एव महेश्वरः । पृथिव्यादिशिवान्तं
    तु अकाराद्याश्च वर्णकाः ॥ ६२ ॥ कूटान्ता हंस एव स्यान्मातृकेति व्यवस्थिताः । मातृकारहितं मन्त्रमादिशन्ते
    न कुत्रचित् ॥ ६३ ॥ हंसज्योतिरनूपम्यं मध्ये देवं व्यवस्थितम् । दक्षिणामुखमाश्रित्य ज्ञानमुद्रां प्रकल्पयेत्
    ॥ ६४ ॥ सदा समाधिं कुर्वीत हंसमन्त्रमनुस्मरन् । निर्मलस्फटिकाकारं दिव्यरूपमनुत्तमम् ॥ ६५ ॥ मध्यदेशे
    परं हंसं ज्ञानमुद्रात्मरूपकम् । प्राणोऽपानः समानश्चोदानव्यानौ च वायवः ॥ ६६ ॥ पञ्चकर्मेन्द्रियैरुक्ताः
    क्रियाशक्तिबलोद्यताः । नागः कूर्मश्च कृकरो देवदत्तो धनञ्जयः ॥ ६७ ॥ पञ्चज्ञानेन्द्रियैर्युक्ता ज्ञानशक्तिबलोद्यताः
    । पावकः शक्तिमध्ये तु नाभिचक्रे रविः स्थितः ॥ ६८ ॥ बन्धमुद्रा कृता येन नासाग्रे तु स्वलोचने । अकारेवह्निरित्याहुरुकारे
    हृदि संस्थितः ॥ ६९ ॥ मकारे च भ्रुवोर्मध्ये प्राणशक्त्या प्रबोधयेत् । ब्रह्मग्रन्थिरकारे च विष्णुग्रन्थिर्हृदि
    स्थितः ॥ ७० ॥ रुद्रग्रन्थिर्भ्रुवोर्मध्ये भिद्यतेऽक्षरवायुना । अकारे संस्थितो ब्रह्मा उकारे विष्णुरास्थितः
    ॥ ७१ ॥ मकारे संस्थितो रुद्रस्ततोऽस्यान्तः परात्परः । कण्ठं सङ्कुच्य नाड्यादौ स्तम्भिते येन शक्तितः
    ॥ ७२ ॥ रसना पीड्यमानेयं षोडशी वोर्ध्वगामिनि । त्रिकूटं त्रिविधा चैव गोलाखं निखरं तथा ॥ ७३ ॥ त्रिशङ्खवज्रमोङ्कारमूर्ध्वनालं
    भ्रुवोर्मुखम् । कुण्डलीं चालयन्प्राणान्भेदयन्शशिमण्डलम् ॥ ७४ ॥ साधयन्वज्रकुम्भानि नवद्वाराणि बन्धयेत्
    । सुमनःपवनारूढः सरागो निर्गुणस्तथा ॥ ७५ ॥ ब्रह्मस्थाने तु नादः स्याच्छाकिन्यामृतवर्षिणी । षट्चक्रमण्डलोद्धारं
    ज्ञानदीपं प्रकाशयेत् ॥ ७६ ॥ सर्वभूतस्थितं देवं सर्वेशं नित्यमर्चयेत् । आत्मरूपं तमालोक्य ज्ञानरूपं
    निरामयम् ॥ ७७ ॥ दृश्यन्तं दिव्यरूपेण सर्वव्यापी निरञ्जनः । हंस हंस वदेद्वाक्यं प्राणिनां देहमाश्रितः
