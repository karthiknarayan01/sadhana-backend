id: narayaniyam-dashaka-45
category: stotram
name:
  english: Narayaniyam Dashaka 45
content:
  english: ayi sabala murare panijanupracaraih kimapi bhavanabhagan bhushayantau bhavantau | calitacaranakanjau
    manjumanjirashinja shravanakutukabhajau ceratushcaruvegat || || mridu mridu vihasantavunmishaddantavantau
    vadanapatitakeshau drishyapadabjadeshau | bhujagalitakarantavyalagatkankanankau matimaharatamuccaih
    pashyatam vishvanrinam || || anusarati janaughe kautukavyakulakshe kimapi kritaninadam vyahasantau
    dravantau | valitavadanapadmam prishthato dattadrishti kimiva na vidadhathe kautukam vasudeva || ||
    drutagatishu patantavutthitau liptapankau divi munibhirapankaih sasmitam vandyamanau | drutamatha
    jananibhyam sanukampam grihitau muhurapi parirabdhau dragyuvam cumbitau ca || || snutakucabharamanke
    dharayanti bhavantam taralamati yashoda stanyada dhanyadhanya | kapatapashupa madhye mugdhahasankuram
    te dashanamukulahridyam vikshya vaktram jaharsha || || tadanucaranacari darakaissakamara nnilayatatishu
    khelan balacapalyashali | bhavanashukavidalan vatsakamshcanudhavan kathamapi kritahasairgopakairvarito'bhuh
    || || haladharasahitastvam yatra yatropayato vivashapatitanetrastatra tatraiva gopyah | vigalitagrihakritya
    vismritapatyabhritya murahara muhuratyantakula nityamasan || || pratinavanavanitam gopikadattamicchan
    kalapadamupagayan komalam kvapi nrityan | sadayayuvatilokairarpitam sarpirashnan kvacana navavipakvam
    dugdhamapyapibastvam || || mama khalu baligehe yacanam jatamasta miha punarabalanamagrato naiva kurve
    | iti vihitamatih kim deva santyajya yacnam dadhighritamaharastvam caruna coranena || || tava dadhighritamoshe
    ghoshayoshajanana mabhajata hridi rosho navakasham na shokah | hridayamapi mushitva harshasindhau
    nyadhastvam sa mama shamaya rogan vatagehadhinatha || || shakhagre vidhum vilokya phalamitymbam ca
    tatam muhuh samprarthyatha tada tadiyavacasa protkshiptabahau tvayi| citram deva shashi sa te karmagat
    kim brumahe sampatah jyotirmandalapuritakhilavapuh praga viradrupatam || || kim kim batedamiti sambhrama
    bhajamenam brahmarnave kshanamamum parimajjya tatam | mayam punastanaya mohamayim vitanvan anandacinmaya
    jaganmaya pahi rogat ||
  devanagari: अयि सबल मुरारे पाणिजानुप्रचारैः किमपि भवनभागान् भूषयन्तौ भवन्तौ । चलितचरणकञ्जौ मञ्जुमञ्जीरशिञ्जा
    श्रवणकुतुकभाजौ चेरतुश्चारुवेगात् ॥ ॥ मृदु मृदु विहसन्तावुन्मिषद्दन्तवन्तौ वदनपतितकेशौ दृश्यपादाब्जदेशौ
    । भुजगलितकरान्तव्यालगत्कङ्कणाङ्कौ मतिमहरतमुच्चैः पश्यतां विश्वनृणाम् ॥ ॥ अनुसरति जनौघे कौतुकव्याकुलाक्षे
    किमपि कृतनिनादं व्याहसन्तौ द्रवन्तौ । वलितवदनपद्मं पृष्ठतो दत्तदृष्टी किमिव न विदधाथे कौतुकं वासुदेव
    ॥ ॥ द्रुतगतिषु पतन्तावुत्थितौ लिप्तपङ्कौ दिवि मुनिभिरपङ्कैः सस्मितं वन्द्यमानौ । द्रुतमथ जननीभ्यां
    सानुकम्पं गृहीतौ मुहुरपि परिरब्धौ द्राग्युवां चुम्बितौ च ॥ ॥ स्नुतकुचभरमङ्के धारयन्ती भवन्तं तरलमति
    यशोदा स्तन्यदा धन्यधन्या । कपटपशुप मध्ये मुग्धहासाङ्कुरं ते दशनमुकुलहृद्यं वीक्ष्य वक्त्रं जहर्ष ॥
    ॥ तदनुचरणचारी दारकैस्साकमारा न्निलयततिषु खेलन् बालचापल्यशाली । भवनशुकविडालान् वत्सकांश्चानुधावन् कथमपि
    कृतहासैर्गोपकैर्वारितोऽभूः ॥ ॥ हलधरसहितस्त्वं यत्र यत्रोपयातो विवशपतितनेत्रास्तत्र तत्रैव गोप्यः ।
    विगलितगृहकृत्या विस्मृतापत्यभृत्या मुरहर मुहुरत्यन्ताकुला नित्यमासन् ॥ ॥ प्रतिनवनवनीतं गोपिकादत्तमिच्छन्
    कलपदमुपगायन् कोमलं क्वापि नृत्यन् । सदययुवतिलोकैरर्पितं सर्पिरश्नन् क्वचन नवविपक्वं दुग्धमप्यापिबस्त्वम्
    ॥ ॥ मम खलु बलिगेहे याचनं जातमास्ता मिह पुनरबलानामग्रतो नैव कुर्वे । इति विहितमतिः किं देव सन्त्यज्य
    याच्ञां दधिघृतमहरस्त्वं चारुणा चोरणेन ॥ ॥ तव दधिघृतमोषे घोषयोषाजनाना मभजत हृदि रोषो नावकाशं न शोकः
    । हृदयमपि मुषित्वा हर्षसिन्धौ न्यधास्त्वं स मम शमय रोगान् वातगेहाधिनाथ ॥ ॥ शाखाग्रे विधुं विलोक्य
    फलमित्य्म्बां च तातं मुहुः सम्प्रार्थ्याथ तदा तदीयवचसा प्रोत्क्षिप्तबाहौ त्वयि। चित्रं देव शशी स ते
    कर्मगात् किं ब्रूमहे सम्पतः ज्योतिर्मण्डलपूरिताखिलवपुः प्रागा विराड्रूपताम् ॥ ॥ किं किं बतेदमिति सम्भ्रम
    भाजमेनं ब्रह्मार्णवे क्षणममुं परिमज्ज्य तातम् । मायां पुनस्तनय मोहमयीं वितन्वन् आनन्दचिन्मय जगन्मय
    पाहि रोगात् ॥
