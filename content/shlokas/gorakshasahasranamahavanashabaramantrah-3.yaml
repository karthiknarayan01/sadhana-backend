    svaha | om sarvamaya namo svaha | om indriya shamaniyanamo svaha | om shuddha jyotisvarupa namo svaha
    | om svatabha namo svaha | om avirodhi namo svaha | om sada jagrata namo svaha | om siddho se sevita
    namo svaha | om dharmasvarupa namo svaha | om dharma shastra karta namo svaha | om sarva dharma shasya
