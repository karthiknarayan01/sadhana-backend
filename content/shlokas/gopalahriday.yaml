id: gopalahriday
category: hridaya
name:
  english: gopalahriday
  devanagari: गोपालह्रिदय्
content:
  english: gopalahridayastotram vishnuhridayastotram shri ganeshaya namah | om asya shrigopalahridayastotramantrasya
    | shribhagavan sankarshana rishih | gayatri chandah | om bijam | lakshmih shaktih | gopalah paramatma
    devata | pradyumnah kilakam | manovakkayarjitasarvapapakshayarthe shrigopalaprityarthe gopalahridayastotrajape
    viniyogah | shrisankarshana uvaca | om mamagratah sada vishnuh prishthatashcapi keshavah | govindo
    dakshine parshve vame ca madhusudanah || 1|| uparishtattu vaikuntho varahah prithivitale | avantaradishah
    patu tasu sarvasu madhavah || 2|| gacchatastishthato vapi jagratah svapato'pi va | narasimhakritadguptirvasudevamayo
    hyayam || 3|| avyaktam caivasya yonim vadanti vyaktam deham dirghamayurgatishca | vahnirvaktram candrasuryau
    ca netre dishah shrote ghranamayushca vayum || 4|| vacam veda hridayam vai nabhashca prithvi padau
    taraka romakupah | anganyupanganyadhidevata ca vidyadupastham hi tatha samudram || 5|| tam devadevam
    sharanam prajanam yajnatmakam sarvalokapratishtham | ajam varenyam varadam varishtham brahmanamisham
    purusham namaste || 6|| adyam purushamishanam puruhutam puraskritam | ritamekaksharam brahma vyaktasaktam
    sanatanam || 7|| mahabharatamakhyanam kurukshetram sarasvatim | keshavam gam ca gangam ca kirtayenmam
    prasidati || 8|| om bhuh purushaya purusharupaya vasudevaya namo namah | om bhuvah purushaya purusharupaya
    vasudevaya namo namah | om svah purushaya purusharupaya vasudevaya namo namah | om mahah purushaya
    purusharupaya vasudevaya namo namah | om janah purushaya purusharupaya vasudevaya namo namah | om
    tapah purushaya purusharupaya vasudevaya namo namah | om satyam purushaya purusharupaya vasudevaya
    namo namah | om bhurbhuvah svah purushaya purusharupaya vasudevaya namo namah | om vasudevaya purushaya
    purusharupaya vasudevaya namo namah | om sankarshanaya purushaya purusharupaya vasudevaya namo namah
    | om pradyumnaya purushaya purusharupaya vasudevaya namo namah | om aniruddhaya purushaya purusharupaya
    vasudevaya namo namah | om hayagrivaya purushaya purusharupaya vasudevaya namo namah | om bhavadbhavaya
    purushaya purusharupaya vasudevaya namo namah | om keshavaya purushaya purusharupaya vasudevaya namo
    namah | om narayanaya purushaya purusharupaya vasudevaya namo namah | om madhavaya purushaya purusharupaya
    vasudevaya namo namah | om govindaya purushaya purusharupaya vasudevaya namo namah | om vishnave purushaya
    purusharupaya vasudevaya namo namah | om madhusudanaya purushaya purusharupaya vasudevaya namo namah
    | om vaikunthaya purushaya purusharupaya vasudevaya namo namah | om acyutaya purushaya purusharupaya
    vasudevaya namo namah | om trivikramaya purushaya purusharupaya vasudevaya namo namah | om vamanaya
    purushaya purusharupaya vasudevaya namo namah | om shridharaya purushaya purusharupaya vasudevaya
    namo namah | om hrishikeshaya purushaya purusharupaya vasudevaya namo namah | om padmanabhaya purushaya
    purusharupaya vasudevaya namo namah | om mukundaya purushaya purusharupaya vasudevaya namo namah |
    om damodaraya purushaya purusharupaya vasudevaya namo namah | om satyaya purushaya purusharupaya vasudevaya
    namo namah | om ishanaya purushaya purusharupaya vasudevaya namo namah | om tatpurushaya purushaya
    purusharupaya vasudevaya namo namah | om purushottamaya purushaya purusharupaya vasudevaya namo namah
    | om shri ramacandraya purushaya purusharupaya vasudevaya namo namah | om shri nrisimhaya purushaya
    purusharupaya vasudevaya namo namah | om anantaya purushaya purusharupaya vasudevaya namo namah |
    om vishvarupaya purushaya purusharupaya vasudevaya namo namah | om pranavenduvahniravisahasranetraya
    purushaya purusharupaya vasudevaya namo namah | ya idam gopalahridayamadhite sa brahmahatyayah puto
    bhavati | surapanat svarnasteyat vrishaligamanat pati sambhashanat asatyadagamyagamanat apeyapanadabhakshyabhakshanacca
    puto bhavati | abrahmacari brahmacari bhavati | bhagavanmahavishnurityaha | || iti gopalahridayastotram
    sampurnam ||
  devanagari: गोपालहृदयस्तोत्रम् विष्णुहृदयस्तोत्रम् श्री गणेशाय नमः । ॐ अस्य श्रीगोपालहृदयस्तोत्रमन्त्रस्य
    । श्रीभगवान् सङ्कर्षण ऋषिः । गायत्री छन्दः । ॐ बीजम् । लक्ष्मीः शक्तिः । गोपालः परमात्मा देवता । प्रद्युम्नः
    कीलकम् । मनोवाक्कायार्जितसर्वपापक्षयार्थे श्रीगोपालप्रीत्यर्थे गोपालहृदयस्तोत्रजपे विनियोगः । श्रीसङ्कर्षण
    उवाच । ॐ ममाग्रतः सदा विष्णुः पृष्ठतश्चापि केशवः । गोविन्दो दक्षिणे पार्श्वे वामे च मधुसूदनः ॥ १॥
    उपरिष्टात्तु वैकुण्ठो वाराहः पृथिवीतले । अवान्तरदिशः पातु तासु सर्वासु माधवः ॥ २॥ गच्छतस्तिष्ठतो वापि
    जाग्रतः स्वपतोऽपि वा । नरसिंहकृताद्गुप्तिर्वासुदेवमयो ह्ययम् ॥ ३॥ अव्यक्तं चैवास्य योनिं वदन्ति व्यक्तं
    देहं दीर्घमायुर्गतिश्च । वह्निर्वक्त्रं चन्द्रसूर्यौ च नेत्रे दिशः श्रोते घ्राणमायुश्च वायुम् ॥ ४॥
    वाचं वेदा हृदयं वै नभश्च पृथ्वी पादौ तारका रोमकूपाः । अङ्गान्युपाङ्गान्यधिदेवता च विद्यादुपस्थं हि
    तथा समुद्रम् ॥ ५॥ तं देवदेवं शरणं प्रजानां यज्ञात्मकं सर्वलोकप्रतिष्ठम् । अजं वरेण्यं वरदं वरिष्ठं
    ब्रह्माणमीशं पुरुषं नमस्ते ॥ ६॥ आद्यं पुरुषमीशानं पुरुहूतं पुरस्कृतम् । ऋतमेकाक्षरं ब्रह्म व्यक्तासक्तं
    सनातनम् ॥ ७॥ महाभारतमाख्यानं कुरुक्षेत्रं सरस्वतीम् । केशवं गां च गङ्गां च कीर्तयेन्मां प्रसीदति ॥
    ८॥ ॐ भूः पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ भुवः पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ स्वः
    पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ महः पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ जनः पुरुषाय
    पुरुषरूपाय वासुदेवाय नमो नमः । ॐ तपः पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ सत्यं पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ भूर्भुवः स्वः पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ वासुदेवाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ सङ्कर्षणाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ प्रद्युम्नाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ अनिरुद्धाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ हयग्रीवाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ भवाद्भवाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ केशवाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ नारायणाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ माधवाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ गोविन्दाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ विष्णवे पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ मधुसूदनाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ वैकुण्ठाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ अच्युताय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ त्रिविक्रमाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ वामनाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ श्रीधराय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ हृषीकेशाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ पद्मनाभाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ मुकुन्दाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ दामोदराय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ सत्याय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ ईशानाय पुरुषाय पुरुषरूपाय वासुदेवाय
    नमो नमः । ॐ तत्पुरुषाय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ पुरुषोत्तमाय पुरुषाय पुरुषरूपाय वासुदेवाय
    नमो नमः । ॐ श्री रामचन्द्राय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ श्री नृसिंहाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ अनन्ताय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । ॐ विश्वरूपाय पुरुषाय पुरुषरूपाय
    वासुदेवाय नमो नमः । ॐ प्रणवेन्दुवह्निरविसहस्रनेत्राय पुरुषाय पुरुषरूपाय वासुदेवाय नमो नमः । य इदं
    गोपालहृदयमधीते स ब्रह्महत्यायाः पूतो भवति । सुरापानात् स्वर्णस्तेयात् वृषलीगमनात् पति सम्भाषणात् असत्यादगम्यागमनात्
    अपेयपानादभक्ष्यभक्षणाच्च पूतो भवति । अब्रह्मचारी ब्रह्मचारी भवति । भगवान्महाविष्णुरित्याह । ॥ इति
    गोपालहृदयस्तोत्रं सम्पूर्णम् ॥
