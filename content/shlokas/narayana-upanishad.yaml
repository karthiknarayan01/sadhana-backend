id: narayana-upanishad
category: stotram
name:
  english: Narayana Upanishad
content:
  english: om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai
    shshantih || om atha purusho ha vai narayano ssrijeyeti | narayanatprano jayate | mana ssarvendriyani
    ca | kham va~yurjyotirapah prithivi vishvasya dharini | narayanadbrahma jayate | narayanadrudro jayate
    | narayanadindro jayate | narayanatprajapatayah prajayante | narayanaddvadashaditya rudra vasavassarvani
    ca chandagmsi | narayanadeva samutpadyante | narayane pravartante | narayane praliyante || om | atha
    nityo narayanah | brahma narayanah | shivashca narayanah | shakrashca narayanah | dyavaprithivyau
    ca narayanah | kalashca narayanah | dishashca narayanah | urdhvashca narayanah | adhashca narayanah
    | antarbahishca narayanah | narayana evedagm sarvam | yadbhutam | nishkalo niranjano nirvikalpo nirakhyata
    shshuddho deva eko narayanah | na dvitiyo sti kashcit | ya evam ve~da | sa vishnureva bhavati sa vishnureva
    bhavati || omityagre vyaharet | nama iti pashcat | narayanayetyuparishtat | omityekaksharam | nama
    iti dve akshare | narayanayeti panca ksharani | etadvai narayanasyashtakshara mpadam | yo ha vai narayanasyashtakshara
    mpadamadhyeti | anapabruvassarvamayureti | vindate prajapatyagm rayasposha 'mritatvamashnuta iti |
    ya evam ve~da || pratyagananda mpranavasvarupam | akara ukara makara iti | tanekadha samabharattadetadomiti
    | yamuktva mucyate yogi janmasamsarabandhanat | o nnamo narayanayeti mantropasakah | vaikunthabhuvanaloka
    vi~jnanaghanam | tasmattadidavanmatram | brahmanyo devakiputro brahmanyo madhusudanom | sarvabhutasthameka
    nnarayanam | karanarupamakara parabrahmom | etadatharva shiroyo 'dhite prataradhiyano ratrikrita nnashayati
    | sayamadhiyano divasakrita nnashayati | madhyandinamadityabhimukho 'dhiyanah pancapatakopapataka
    tpramucyate | sarva veda parayana punyam la~bhate | narayanasayujyamavapnoti narayana sayujyamavapnoti
    | ya evam ve~da | ityupanishat || om saha navavatu | saha nau bhunaktu | saha virya nkaravavahai |
    tejasvinavadhitamastu ma vidvishavahai
  devanagari: ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    श्शान्तिः॑ ॥ ॐ अथ पुरुषो ह वै नारायणो स्सृ॑जेये॒ति । ना॒रा॒य॒णात्प्रा॑णो जा॒यते । मन स्सर्वेन्द्रि॑याणि॒
    च । खं वाँयुर्ज्योतिरापः पृथिवी विश्व॑स्य धा॒रिणी । ना॒रा॒य॒णाद्ब्र॑ह्मा जा॒यते । ना॒रा॒य॒णाद्रु॑द्रो
    जा॒यते । ना॒रा॒य॒णादि॑न्द्रो जा॒यते । ना॒रा॒य॒णात्प्रजापतयः प्र॑जाय॒न्ते । ना॒रा॒य॒णाद्द्वादशादित्या
    रुद्रा वसवस्सर्वाणि च छ॑न्दाग्ं॒सि । ना॒रा॒य॒णादेव समु॑त्पद्य॒न्ते । ना॒रा॒य॒णे प्र॑वर्त॒न्ते । ना॒रा॒य॒णे
    प्र॑लीय॒न्ते ॥ ओम् । अथ नित्यो ना॑राय॒णः । ब्र॒ह्मा ना॑राय॒णः । शि॒वश्च॑ नाराय॒णः । श॒क्रश्च॑ नाराय॒णः
    । द्या॒वा॒पृ॒थि॒व्यौ च॑ नाराय॒णः । का॒लश्च॑ नाराय॒णः । दि॒शश्च॑ नाराय॒णः । ऊ॒र्ध्वश्च॑ नाराय॒णः ।
    अ॒धश्च॑ नाराय॒णः । अ॒न्त॒र्ब॒हिश्च॑ नाराय॒णः । नारायण एवे॑दग्ं स॒र्वम् । यद्भू॒तं । निष्कलो निरञ्जनो
    निर्विकल्पो निराख्यात श्शुद्धो देव एको॑ नाराय॒णः । न द्वि॒तीयो स्ति॒ कश्चि॑त् । य ए॑वं वेँ॒द । स विष्णुरेव
    भवति स विष्णुरे॑व भ॒वति ॥ ओमित्य॑ग्रे व्या॒हरेत् । नम इ॑ति प॒श्चात् । ना॒रा॒य॒णायेत्यु॑परि॒ष्टात्
    । ओमि॑त्येका॒क्षरम् । नम इति॑ द्वे अ॒क्षरे । ना॒रा॒य॒णायेति पञ्चा क्षरा॒णि । एतद्वै नारायणस्याष्टाक्ष॑र
    म्प॒दम् । यो ह वै नारायणस्याष्टाक्षर म्पद॑मध्ये॒ति । अनपब्रुवस्सर्वमा॑युरे॒ति । विन्दते प्रा॑जाप॒त्यग्ं
    रायस्पोष॑ ऽमृतत्वमश्नु॑त इ॒ति । य ए॑वं वेँ॒द ॥ प्रत्यगानन्द म्प्रणव॑स्वरू॒पम् । अकार उकार मका॑र इ॒ति
    । तानेकधा समभरत्तदेत॑दोमि॒ति । यमुक्त्वा॑ मुच्य॑ते यो॒गी॒ ज॒न्म॒संसा॑रब॒न्धनात् । ओ न्नमो नारायणायेति
    म॑न्त्रोपा॒सकः । वैकुण्ठभुवनलोक॑ विँ॑ज्ञान॒घनम् । तस्मात्तदिदा॑वन्मा॒त्रम् । ब्रह्मण्यो देव॑कीपु॒त्रो॒
    ब्रह्मण्यो म॑धुसू॒दनोम् । सर्वभूतस्थमेक॑ न्नारा॒यणम् । कारणरूपमकार प॑रब्र॒ह्मोम् । एतदथर्व शिरो॑यो
    ऽधी॒ते प्रा॒तर॑धीया॒नो॒ रात्रिकृत न्नाश॒यति । सा॒यम॑धीया॒नो॒ दिवसकृत न्नाश॒यति । माध्यन्दिनमादित्याभिमुखो॑
    ऽधीया॒नः॒ पञ्चपातकोपपातका त्प्रमु॒च्यते । सर्व वेद पारायण पु॑ण्यं लँ॒भते । नारायणसायुज्यम॑वाप्नो॒ति॒
    नारायण सायुज्यम॑वाप्नो॒ति । य ए॑वं वेँ॒द । इत्यु॑प॒निष॑त् ॥ ॐ स॒ह ना॑ववतु । स॒ह नौ॑ भुनक्तु । स॒ह
    वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
