id: sri-venkateswara-mangalashtakam
category: stotram
name:
  english: Sri Venkateswara Mangalashtakam
content:
  english: shrikshonyau ramaniyugam suramaniputro'pi vanipatih pautrashcandrashiromanih phanipatih shayya
    surah sevakah | tarkshyo yasya ratho mahashca bhavanam brahmandamadyah puman shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || yattejo ravikotikotikiranan dhikkritya jejiyate yasya shrivadanambujasya
    sushama rakendukotirapi | saundaryam ca manobhavanapi bahun kantishca kadambinim shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || nanaratna kiritakundalamukhairbhushaganairbhushitah shrimatkaustubharatna
    bhavyahridayah shrivatsasallanchanah | vidyudvarnasuvarnavastraruciro yah shankhacakradibhih shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || yatphale mriganabhicarutilako netre'bjapatrayate kasturighanasarakesaramilacchrigandhasaro
    dravaih | gandhairliptatanuh sugandhasumanomaladharo yah prabhuh shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || etaddivyapadam mamasti bhuvi tatsampashyatetyadara dbhaktebhyah svakarena
    darshayati yaddrishtya'tisaukhyam gatah | etadbhaktimato mahanapi bhavambhodhirnaditi sprishan shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || yah svami sarasastate viharato shrisvaminamnah sada sauvarnalayamandiro
    vidhimukhairbarhirmukhaih sevitah | yah shatrun hanayan nijanavati ca shribhuvarahatmakah shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || yo brahmadisuran munimshca manujan brahmotsavayagatan drishtva hrishtamana
    babhuva bahushastairarcitah samstutah | tebhyo yah pradadadvaran bahuvidhan lakshminivaso vibhuh shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || yo devo bhuvi vartate kaliyuge vaikunthalokasthito bhaktanam paripalanaya
    satatam karunyavaram nidhih | shrisheshakhyamahindhramastakamanirbhaktaikacintamanih shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || sheshadriprabhumangalashtakamidam tushtena yasyeshituh prityartham racitam
    rameshacaranadvandvaikanishthavata | vaivahyadishubhakriyasu pathitam yaih sadhu teshamapi shrimadvenkatabhudharendraramanah
    kuryaddharirmangalam || || iti shri venkatesha mangalashtakam |
  devanagari: श्रीक्षोण्यौ रमणीयुगं सुरमणीपुत्रोऽपि वाणीपतिः पौत्रश्चन्द्रशिरोमणिः फणिपतिः शय्या सुराः
    सेवकाः । तार्क्ष्यो यस्य रथो महश्च भवनं ब्रह्माण्डमाद्यः पुमान् श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम्
    ॥ ॥ यत्तेजो रविकोटिकोटिकिरणान् धिक्कृत्य जेजीयते यस्य श्रीवदनाम्बुजस्य सुषमा राकेन्दुकोटीरपि । सौन्दर्यं
    च मनोभवानपि बहून् कान्तिश्च कादम्बिनीं श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम् ॥ ॥ नानारत्न
    किरीटकुण्डलमुखैर्भूषागणैर्भूषितः श्रीमत्कौस्तुभरत्न भव्यहृदयः श्रीवत्ससल्लाञ्छनः । विद्युद्वर्णसुवर्णवस्त्ररुचिरो
    यः शङ्खचक्रादिभिः श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम् ॥ ॥ यत्फाले मृगनाभिचारुतिलको नेत्रेऽब्जपत्रायते
    कस्तूरीघनसारकेसरमिलच्छ्रीगन्धसारो द्रवैः । गन्धैर्लिप्ततनुः सुगन्धसुमनोमालाधरो यः प्रभुः श्रीमद्वेङ्कटभूधरेन्द्ररमणः
    कुर्याद्धरिर्मङ्गलम् ॥ ॥ एतद्दिव्यपदं ममास्ति भुवि तत्सम्पश्यतेत्यादरा द्भक्तेभ्यः स्वकरेण दर्शयति
    यद्दृष्ट्याऽतिसौख्यं गतः । एतद्भक्तिमतो महानपि भवाम्भोधिर्नदीति स्पृशन् श्रीमद्वेङ्कटभूधरेन्द्ररमणः
    कुर्याद्धरिर्मङ्गलम् ॥ ॥ यः स्वामी सरसस्तटे विहरतो श्रीस्वामिनाम्नः सदा सौवर्णालयमन्दिरो विधिमुखैर्बर्हिर्मुखैः
    सेवितः । यः शत्रून् हनयन् निजानवति च श्रीभूवराहात्मकः श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम्
    ॥ ॥ यो ब्रह्मादिसुरान् मुनींश्च मनुजान् ब्रह्मोत्सवायागतान् दृष्ट्वा हृष्टमना बभूव बहुशस्तैरर्चितः
    संस्तुतः । तेभ्यो यः प्रददाद्वरान् बहुविधान् लक्ष्मीनिवासो विभुः श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम्
    ॥ ॥ यो देवो भुवि वर्तते कलियुगे वैकुण्ठलोकस्थितो भक्तानां परिपालनाय सततं कारुण्यवारां निधिः । श्रीशेषाख्यमहीन्ध्रमस्तकमणिर्भक्तैकचिन्तामणिः
    श्रीमद्वेङ्कटभूधरेन्द्ररमणः कुर्याद्धरिर्मङ्गलम् ॥ ॥ शेषाद्रिप्रभुमङ्गलाष्टकमिदं तुष्टेन यस्येशितुः
    प्रीत्यर्थं रचितं रमेशचरणद्वन्द्वैकनिष्ठावता । वैवाह्यादिशुभक्रियासु पठितं यैः साधु तेषामपि श्रीमद्वेङ्कटभूधरेन्द्ररमणः
    कुर्याद्धरिर्मङ्गलम् ॥ ॥ इति श्री वेङ्कटेश मङ्गलाष्टकम् ।
