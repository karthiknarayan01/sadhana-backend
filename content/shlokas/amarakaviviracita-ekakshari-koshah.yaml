id: amarakaviviracita-ekakshari-koshah
category: stotram
name:
  english: amarakaviviracita ekakshari-koshah
  devanagari: अमरकविविरचित एकाक्षरी-कोशः
content:
  english: sa lakshmyam ho nipate ca huste daruni shulini | sham kshetrarakshasityukta mala praksurisammata
    || iti ekaksharinamamala samapta
  devanagari: सा लक्ष्म्यां हो निपाते च हुस्ते दारुणि शूलिनि । शं क्षेत्ररक्षसीत्युक्ता माला प्राक्सूरिसम्मता
    ॥ इति एकाक्षरीनाममाला समाप्ता
meaning: {}
source_attribution:
