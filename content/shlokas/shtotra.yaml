id: shtotra
category: stotram
name:
  english: shtotra
  devanagari: ष्तोत्र
content:
  english: rinu | divyasamrajyamedhakhyam nama sahasrakasya ca || 33|| akshobhyastu rishih prokto brihati
    chanda iritam | ugratara devatasya kurcabijam prakirtitam || 34|| kalitara mahabijam tatha chinnamayam
    shive | tara bijam tatha kalya shakti chinnamanurbhavet || 35|| ata eva bhavetkurcam candaghantamayam
    shive | astra shaktishca bhuvana kilakam nacanguyak || 36|| pratyaksha darshanadyarthe viniyoga prakirtitah
    | dhyanam mantravadasadya namasahasrakam pathet || 37|| om asya shrimahogratara divya samrajya medha
    nama sahasrakasya akshobhyarishih brihati chandah | ugrataraditrishakti devata ham bijam phat shaktih
    ham kilakam shrimahogratara pratyaksha darshanadyarthe viniyogah || 38|| atha stotram | om kram tara
    strihridayamahatara kramugratara tarini tarih | mahogratara stritara trikataikajatadhara || 39|| tatathaiyya
    bhinapaga talatandvarupini | tandavahlada nirata tahani tahanakritih || 40|| tantri vadyarata tantra
    tantrashastra parayana | tarunyatakallola tarunyamritakanyaka || 41|| tarunyamrita candri ca tattvadarshanatatpara
    | tirthasevaparatushta tram trim trum traim svarupini || 42|| tronkaratrah svarupa ca trasa trastagatistaha
    | tanimralalavrikshastha talipana parayana || 43|| tarunikundanirata tarunikundarupini | tarunikusumahlada
    tarunibijarupini || 44|| tarunigarbhasambhuta tarunidhyanatatpara | tarunipujanirata tarunibhaktatatpara
    || 45|| tarunilocananandalahari tarkshyavahana | tararupa tamraparni tamrapatrasamasthita || 46||
    tarunikusumamoha tarunipushparupini | tarunitadikannatha tarunimukhagocara || 47|| tarunikeshasamstha
    ca tarunimukhamadhyaga | tarunivakyamadhya ca tarunitandavarnava || 48|| taruniganasantushta tarunibhaktatatpara
    | tarunimuktimala ca tarunibhaktarupini || 49|| tarunigamanapritya ca tarunihasyatatpara | taruninamikananta
    taruniratnarupini || 50|| tarunigamanapritya taruniyogarupini | tarunicumbanarata tarunilingarupini
    || 51|| tula ca tulatalpa tulajapuravasini | tanananasvarupa ca tathairupapradharini || 52|| totala
    tailasamprita tripyatimargaparayana | trisida trinarupa ca tartiyagunabhushita || 53|| tartiyabijarupa
    ca tartiyakshararupini | tattvajnana tattvabuddhi tattvanatha tathamati || 54|| tauliti ca tvavapi
    ca tarastharupini | tamataramadhyasvarupa ca taradannara tamati || 55|| tarumulasthita tadra tushtistraikalyarupini
    | trikalyada ca trairpakshataranapakabhushana || 56|| tvarita tvaritaprita tattvadarshi tamasvini
    | tarakshaharini tirna tarunyakundabhogini || 57|| thakaravarnanilaya thakarakshararupini | thaithairupa
    tharigrupa thaungadadikarupini || 58|| sthulavudhni sthulatanu sthatadhyanaparayana | thethakutaksharaupyam
    thinthunkaraksharamalini || 59|| thararupadakshana ca danasanmanadayini | dakshaputri dakshayajnanashini
    danavi daya || 60|| dayaihridayadanta daityanashanakarini | dayalu daityashamani dravyahadravyavatsali
    || 61|| dravyagita dravyamata danta daridrya nashini | dayarta dipini disha dipamargaparayana || 62||
    dinaprita dirghajivha daridryanashiniditti | duhkhasamharini dushtadaityavidhvamsanakshama || 63||
    dadimipushparupa ca dadimipushpapujita | dadimivajadatta ca dadirupa darasthita || 64|| dirghakshi
    dirghanasa ca dikshita dikshiteshvari | durga durgavihamtri ca duhkhapranashini dari || 65|| daurgasuravihamtri
    ca durgadaranatatpara | danadaksha danapuja danatushta dayatati || 66|| dasi dasikundarati dasipushpaparayana
    | dasibijarata dana dinaradayini druti || 67|| drutasiddhakari dirgha dirghaka dikshitapriya | dasicumbanasantushta
    dasimathanatatpara || 68|| dasikundapritaprana dandindundaim svarupini | dum bijajapasantushta dumvusvaha
    svarupini || 69|| dhanada dhananatha ca dhanadhanyavivardhini | dhum bijanilaya dhumra dhudhundhumavati
    dhriti || 70|| dhairyada dharini dhairya dharitri ca dharadhara | dharmishtha dharmanirata dharmamargaparayana
    || 71|| dharmaprana dharmagati dharasampatarupini | dhimitharihavarupa ca dharmatara dhanarcita ||
    72|| dhi dhishana dhiragati dhiradhirasvarupini | dhatriprasunasantushta dhatriphalakucadvaya || 73||
    dhatridhyanarata dhyana dhyanatatvaparayana | dhyanadatri dhyanagatra dhyanastha dhyanarupini || 74||
    dhyeyarupa dhyeyagamya dhyeyacakrasamasthita | dhyanaparayanaprita dhyanadhyeyasvarupini || 75|| dhyanagamya
    dhyanatushtah dhyanaganaparayana | dhikatandhisvarupa ca dhaidhaishabdaparayana || 76|| dharmini dharmapakshanga
    dharmakarmaparayana | dharmagramaratanghrim ca dhrindhrindhundhaum svarupini || 77|| nararupa naraprita
    naranatha naratmika | narasimhi natirnari narapushpasvarupini || 78|| narapushpapriyaprana narapushpapratarpita
    | narapushparcanapushpa narapushpakriyamati || 79|| narapushparcanananda narapushpambara nadi | narayajna
    narananda narayajnaparayana || 80|| naranapuratanana natananasvarupini | nanamana nanananasvarupa
    naprarvita || 81|| naprita naprashala natikanandatoshita | nanabhashaprarudha ca nanavarnashcarupini
    || 82|| nagini nagabhusha ca nagarharnagarupini | nagajvanagasambhuta nagavamsha pratoshita || 83||
    nadarupa nadagatirnadabrahma parayana | naradapriyasantushta naradapriyamanasa || 84|| narada naradeshi
    ca nadinimnasvarupini | nimnanabhi nishcayoni nimnanetra narottama || 85|| naravahanasantushta naravahanatatpara
    | nanninnunnainnaum svarupa ca namorupa namonamah || 86|| namaskarapriya nitya nityanandasvarupini
    | nityapujarcanaprita nityapujaparayana || 87|| nityotsavaparananda nirarupa nirakriti | narmada narmarupa
    ca narmakundavikani || 88|| narmakundalelihana narmanatapriya | naimittikarcanaprita naimittikaparayana
    || 89|| narmada narmadatri ca narmakarmaparayana | nivimocanasantushta nivimocanatatpara || 90|| naripushpapriyaprana
    naripushpaparayana | naripushpamatiprita naripushpasvarupini || 91|| nairyapika navavina ca nadinadaparayana
    | nadinadaparananda nadinadaparagati || 92|| nadinadatmika nauka naukakridaparayana | padmapujanasantushta
    padmahomaparayana || 93|| paramanandasandoha paramakasharupini | paratita paragamya paramatma paragati
    || 94|| pampatiranivasa ca pradyumnapritirupini | pranava pranavejya ca paratatva parayana || 95||
    padmapatra padmatushta tushtipavanarupini | papasamharini tushta punyadatri paratari || 96|| puri
    purari grihini puranagamarupini | puranagamya panatya panatoshanatatpara || 97|| panananda pitatanustha
    taivapi rasasvani | pinayoni pitajangha pitambaradharavati || 98|| pitambara pitagarbha pitapushparcanapriya
    | pitapushpanjalirata pitadradanivasini || 99|| pithastha pitharupa ca pithavasaparayana | paradarapriya
    patradharadhara praharshini || 100|| paradarapraharasi paradaravirodhini | paradarapriyapatra patratoshanatatpara
    || 101|| patrarupa patratushti patradanaparayana | patrapushpapriya patrakundanandapareshvari || 102||
    patraradhanasantushta patraprasadarupini | pavitra punyacaritra pavitraropanatmika || 103|| pavitraropanarata
    patraganaparayana | patragita patranapa patrasamyogarupini || 104|| patrakundavikasata patrakundavilohini
    | patrakundadhvanirata patrakundadhvanipriya || 105|| paranidravinirmukta paradravyavimocani | parasvanashiniprita
    parvati parvatatmaja || 106|| parvatejya parvarata parvatapriyarupini | parayana paraci ca patidharmavidharini
    || 107|| patipriya pritirata patigamya pativrata | pativratadhara pinavakshojadvayadharini || 108||
    pishacapremasantushta pretakotisamakula | pretagarbha pretarupa pretabhushanabhushani || 109|| pretamalakanthabhusha
    pretalehanatatpara | pretashi pretarajni ca pretavrataparayana || 110|| pishacanandasantosha parthapritiparayana
    | parthiva parthavejya ca prithula prithurupini || 111|| prithvi ca prithivi pinga pinganetra ca pinkata
    | papan vinashini padya gadyapadyaparayana || 112|| padyatmika padyarata pampimpumpaum svarupini |
    pampinkararata prana pranadatri pratapini || 113|| prabhavati prabhaprema premayogaparayana | prajna
    prajnavatiprajna prajnanapratibhavati || 114|| pratibha pranatiprana prajnapatigrahasthita | prajapati
    priyapara purindradhvajashobhita || 115|| pramatipranadhartri ca pratijnaparagamini | phumphunkara
    ca phatkara phatkararupadharini || 116|| phrinkara phutkritih phrum ca sphankararupadharini | phronkarapheravi
    phramphrumphetkari phanadharini || 117|| pheniprita phanerata phanadarshanatoshini | phanibhushanasambhusha
    phaninathapriyarcita || 118|| phanibandhasamudbhuta phanivamshasushobhini | pashuhasta pashumati parashuramaprasadini
    || 119|| phetkarabhairavi phraunta phretkararavabhashini | phretkara phalgunananda phali phullapriya
    phula || 120|| phaladatri phalarata phalarupa phalatmika | phalahomapriyasphala phalanamaparayana
    || 121|| brihaspatimukhastha ca brihatichandarupini | brihatseva brihatbrahmi brahmibrahmaprapujita
    || 122|| brahmavrittadharavina bansandhanakarini | banasurarcita brum ca brambrimbraimbraum svarupini
    || 123|| barhipichumiya barha barhapachavibhushana | batuka batukejya ca batukapranamanasa || 124||
    batukabhairavarata batukarcanatoshini | batukarcanasantushta balidanapriyabali || 125|| balipujya
    balirata balidananivasini | balidvarasthita bala balam va balabhairavi || 126|| balakridamayaprana
    balakapriyakarini | balitushta balirata balitoshanakarini || 127|| balimata balimayi balitatvatmikabali
    | bala balarcanaprita baladharanatatpara || 128|| batukaradhanarata batukejya batupriya | batukaradhanaprita
    batukaryavatarini || 129|| batutara batuchinna batukali brihanmayi | brihatkukshi brihattara brihattantragameshvari
    || 130|| brihadruna brihadyantra brihattantra brihatkala | brihanmata brihajvala brihanmanamayibrihat
    || 131|| brihattandavarupa ca brihattarunyarupini | brihadaranyasamsevya balacandrakiritini || 132||
    balada bahubhusha ca bahumalavibhushana | bahula bahuleyesi bahuleyasvarupini || 133|| bahubhashamayi
    buddhya buddhida buddhidayini | buddhi buddhimata bauddha bauddhacaraparayana || 134|| bauddhamargapriyaprita
    bauddhamargapavartini | brihaspatisutaradhya buddhimata budheshvari || 135|| bauddhavarupini bharya
    bhanavi bhanurupini | bhanumatta bhanumayi bhanubharya bhaveshvari || 136|| bhavapatni bhayahara bhavadanavanashini
    | bhavamata bhavaratashravataranatarini || 137|| bhartapriya bhartarata bhartabhavaprakashini | bhartanitikari
    bharya bhartada bhimabhishani || 138|| bhikshupujya bhikshumata bhikshumanasatoshini | bhimasenapriya
    bhima bhimakshi bhimabhitida || 139|| bhrantahantri bhayahara bhavapashavimocini | bhavadavanalaghni
    ca bhaktapujya bhavartiha || 140|| bhaktatushta bhaumamata bhopa bhopapratashini | bhrigarupa bhrigopatni
    bhrigutandavakarini || 141|| bhrigutsevarata bhrantiharini bharatapriya | bharati bhanaveshya ca bhasha
    bhimamayi bhava || 142|| bhanamati bhuktimayi bhrum bijakshararupini | bhrambhrimbhrumbhraim svarupini
    bhramativavinashini || 143|| bhanga bhangapriya bhringi bhringadhvaniparayana | bhratrijaya bhagavati
    bhavani bhaktavatsala || 144|| bhavasiddha bhagejya ca bhagamala bhaveshvari | bhranta bhramarika
    bhiti bhrajishnu bhaktarupini || 145|| bhaktamanasantushta bhavati bhramarambika | bhramari bhrantamala
    ca bhavejya bhavasiddhida || 146|| bhagarupa bhagarata bhagagitimayi bhaga | bhankararupini bhrama
    bhagamalavibhushana || 147|| bhagalingasvarupa ca bhagalingaparayana | bhagalingamritandola bhagavilolupa
    || 148|| bhagarcanaratanandi bhagabhagyaparayana | bhagatatva bhagavha ca bhagalingadhvani bhaga ||
    149|| bhagani bhargavejya ca bhagamala bhagankura | bhagakundahladarata bhagakundavikasini || 150||
    bhavitri bhavita bhuta bhutamata ca bhupati | bhupejya bhupasantushta bhaikshyacarvanatatpara || 151||
    bhaganamasmritipara bhagajapaparayana | bhagatantra bhagamoha bhagagandhaparayana || 152|| bhagavapisnanarata
    bhagatirthanivasini | bhagadarshanasantushta bhagacumbanatoshini || 153|| bhagajihva bhagamukha bhagacakshu
    bhagambuja | bhuteshi bhutadurgastha bhupatitvapradayini || 154|| bhumbhunkarasvarupa ca bhadrashabdaparayana
    | bhahabhaharakamaha bhashyakarta bhayapaha || 155|| bharata bharateshi ca bharatapranadayini | bharatapremasantushta
    bharatadhararupini || 156|| bhubhara bhudharadhisha bhudhara bhudharapriya | mamipanandana maya madyapanaparayana
    || 157|| madhuprita madhurata madhura madhuramadhu | madira madironmatta mananiya madoddhata || 158||
    madhvipanarata mata mayabijavhayamati | nimata malini matra madanimritadarpika || 159|| manakshi matulani
    ca modini madanatura | mrammrimmrumraim svarupa ca mraummrah sarvasvarupini || 160|| mitakshara mitahara
    mitacara manomayi | malina malini maitra maitravarunataruni || 161|| mayavati manavati mahamadhumatimayi
    | mahidharasakta matra matrasvaravibhedini || 162|| minarupa minanatha malati madhulolupa | madhupanarata
    mari mahamari mahipati || 163|| mahakali mahatara mahachinna maheshvari | maheshi ca madastha ca madanasthanarupini
    || 164|| madanapriyakanta ca mahayogeshvari makhi | mahamadanasantushta mahamadanabhushita || 165||
    mahita mahila maya makarakshararupini | makararupini mudra mudramodaparayana || 166|| mehastha mehamata
    ca mehamitra mahatpriya | mahata mojasakara mahatanandadayini || 167|| madhumamsa mehatara mehaprastararupini
    | mehaputri ca minakshi mitabhasha mitarthavit || 168|| madanantakakanta ca madanantakarupini | mahoraga
    mahoshusha mahati mahishapaha || 169|| mahishasuranirnashi mundamalavibhushana | mundaprakarasamrupa
    mundasuravimardini || 170|| manasa manasesi ca mudrinyambasvarupini | mudrini mantrini mantra mahamantra
    maharnava || 171|| maharnavasthita moha mohininashini marut | manurmanumayi madri madrakunjaravasini
    || 172|| madrakumbhasthalarudha madmuktavibhushana | muktaharavibhushadhya muktakeshi mahurtada ||
    173|| mohakarti mohahina mahamohaparayana | mantrapranarpanaprita mantrapranarpanarcita || 174|| mahaughananda
    mandagandha madyapujanatatpara | makaravarnasarvangi mitabhoga mitanmita || 175|| mahadhumravati mukta
    mahamuktavibhushana | muktarajantanasa ca muktachatravibhushana || 176|| muktadanarata madhya madhyama
    madhyameshvari | mitirmitimati minaketu makararupini || 177|| makarastha mahadevi mahadeva manomayi
    | mahotsavadurga maya mahapujarametyada || 178|| mahagrahasvarupa ca maghanakshatrarupini | madyamamsavritarata
    maghasnanaparayana || 179|| margashirshapriyananda margadarshanatatpara | margamargamatraka ca matrikalipirupini
    || 180|| matrikanyasasantushta matrikanyasarupini | malininyasasantushta malinimokshadayini || 181||
    mokshadatri mokshagarti mokshamargaparayana | mukta muktipriyakari muktistha muktitandava || 182||
    mahananda mahakali mahabhuvanatarini | mahendrapujya maheshi matisagaradayini || 183|| yaksha yakshasvarupa
    ca yakshani yakshapujita | yadevi yadavaradhya yaduvamshasamudbhava || 184|| yamuna ca yajurveda yajurvedaparayana
    | yamini yamapujya ca yamamatapatipriya || 185|| yatra yatrayashoda ca yashovardhanatatpara | yashakarpuradhavala
    yogini ca yashasvini || 186|| yamyimyum yakinirupa yaimyaum yankararupini | yogamata yogagamya yogamargaparayana
    || 187|| yogisha yojana yama yojanayutavistara | yathoktacaranirata yathoktaphaladayini || 188|| yakshakardamasambhusha
    yavargarupinipati | ramani ramaniprita rama ratneshvari rati || 189|| ratipriya ratirata ratitoshanatatpara
    | ratnagarbha ratnabija rajivalocana rama || 190|| rambija rimsvarupa ca ramrimrumraim svarupini |
    raumrah varnasvarupa ca rajyadatri rasatula || 191|| rasatushta rasagati raghuvamshasamudbhava | ratirupa
    ratanta ca ratigarbhaparayana || 192|| rajivanetra rajni ca ramanasurakanyaka | rajarajeshvaridrashta
    raudri rudrapriya ca hat || 193|| hadrakanya hadrajaya hadramataratananda | hadrejya ca trirupa ca
    ratrincaravibhedini || 194|| rakshasaghni rakshana ca rakshovidravani rata | hacira hacirupa ca rocisha
    romarupini || 195|| romagarbha romadeha romabhushanatatpara | rasa rasavati rajyalakshmi ravananashini
    || 196|| ravanejya ravadata ravanapriyadayini | rajovati rajahprana rajogunamayi rava || 197|| ratipushpapriya
    rumrum rakini renuka raya | raim bijanilaya rainna renurupa ca hakini || 198|| hakvangadasyabhagini
    hakyarupa ca rupabhu | raupyapara raupyaraupya raupyagehavibhushana || 199|| raupyasimhasanarata raupyadanaparayana
    || 200|| iti shridivyasamrajyamedhanamasahasrakam | mahogranamasahasram taranya gaditam pura || 201||
    akshobhyasvavarodattaprasadena prakirtitam | idamevapuradevi kalenapi prakirtitam || 202|| ashtadhikasahasrantu
    namah svahasramevatu | tavarganturakarantam tenataramayam shive || 203|| sarvasiddhimayam sakshat
    sarvapattaranam param | pujakale visheshena sandhyayobhayayorapi || 204|| yah pathetprayatonityam
    tarapratyakshatamiyat | ekakalam dvikalam va trikalam yah pathennarah || 205|| ardharatre visheshena
    sarvasiddhipradam shive | kulaka smaranam tara dhyanam namaprakirtitam || 206|| bhaktasya krityametavadanyadabhyudayam
    viduh | sarva sankata vinirmukta sarva satva samanvitah || 207|| sarvasiddishvarobhuyannatra karya
    vicaranat | yah pathedvapathayedvapi sha
  devanagari: ृणु । दिव्यसाम्राज्यमेधाख्यं नाम साहस्रकस्य च ॥ ३३॥ अक्षोभ्यस्तु ऋषिः प्रोक्तो बृहति छन्द
    ईरितम् । ऊग्रतारा देवतास्या कूर्चबीजं प्रकीर्तितम् ॥ ३४॥ कालीतारा महाबीजं तथा छिन्नामयं शिवे । तारा
    बीजं तथा काल्या शक्ति छिन्नामनुर्भवेत् ॥ ३५॥ अत एव भवेत्कूर्चं चण्डघण्टामयं शिवे । अस्त्र शक्तिश्च
    भुवना कीलकं नचाङ्गुयक् ॥ ३६॥ प्रत्यक्ष दर्शनाद्यर्थे विनियोग प्रकीर्तितः । ध्यानं मन्त्रवदासाद्य नामसाहस्रकं
    पठेत् ॥ ३७॥ ॐ अस्य श्रीमहोग्रतारा दिव्य साम्राज्य मेधा नाम सहस्रकस्य अक्षोभ्यऋषिः बृहति छन्दः । उग्रतारादित्रिशक्ति
    देवता हं बीजं फट् शक्तिः हं कीलकं श्रीमहोग्रतारा प्रत्यक्ष दर्शनाद्यर्थे विनियोगः ॥ ३८॥ अथ स्तोत्रम्
    । ॐ क्रां तारा स्त्रीहृदयमहातारा क्रमुग्रतारा तारिणी तरिः । महोग्रतारा स्त्रीतारा त्रिकटैकजटाधरा ॥
    ३९॥ ततथैय्या भिनपगा तालताण्ड्वरूपिणी । ताण्डवाह्लाद निरत तहणी तहणाकृतिः ॥ ४०॥ तन्त्री वाद्यरता तन्त्रा
    तन्त्रशास्त्र परायणा । तारूण्यातकल्लोला तारूण्यामृतकन्यका ॥ ४१॥ तारूण्यामृत चान्द्री च तत्त्वदर्शनतत्परा
    । तीर्थसेवापरातुष्टा त्रां त्रीं त्रूं त्रैं स्वरूपिणी ॥ ४२॥ त्रोङ्कारात्रः स्वरूपा च त्रसा त्रस्तगतीस्तह
    । तनिम्रालालवृक्षस्था तालीपान परायणा ॥ ४३॥ तरुणीकुण्डनिरता तरुणीकुण्डरूपिणी । तरुणीकुसुमाह्लादा तरुणीबीजरूपिणी
    ॥ ४४॥ तरुणीगर्भसम्भूता तरुणीध्यानतत्परा । तरुणीपूजनिरता तरुणीभक्ततत्परा ॥ ४५॥ तरुणीलोचनानन्दलहरी तार्क्श्यवाहना
    । ताररूपा ताम्रपर्णी ताम्रपत्रसमस्थिता ॥ ४६॥ तरुणीकुसुमामोहा तरुणीपुष्परूपिणी । तरुणीताडिकान्नाथा
    तरुणीमुखगोचरा ॥ ४७॥ तरुणीकेशसंस्था च तरुणीमुखमध्यगा । तरुणीवाक्यमध्या च तरुणीताण्डवर्णवा ॥ ४८॥ तरुणीगानसन्तुष्टा
    तरुणीभक्ततत्परा । तरुणीमुक्तीमाला च तरुणीभक्तरूपिणी ॥ ४९॥ तरुणीगमनप्रीत्या च तरुणीहास्यतत्परा । तरुणीनामिकानन्ता
    तरुणीरत्नरूपिणी ॥ ५०॥ तरुणीगमनप्रीत्या तरुणीयोगरूपिणी । तरुणीचुम्बनरता तरुणीलिङ्गरूपिणी ॥ ५१॥ तुला
    च तुलातल्पा तुलजापुरवासिनी । तनाननास्वरूपा च तथैरूपप्रधारिणी ॥ ५२॥ तोतला तैलसंप्रीता तृप्यतिमार्गपरायणा
    । तृसिदा तृणरूपा च तार्तीयगुणभूषिता ॥ ५३॥ तार्तीयबीजरूपा च तार्तीयाक्षररूपिणी । तत्त्वज्ञाना तत्त्वबुद्धि
    तत्त्वनाथा तथामति ॥ ५४॥ तौलिती च त्ववापी च तरस्थारूपिणी । तमातरमध्यस्वरूपा च तरदन्नर तामति ॥ ५५॥ तरुमूलस्थिता
    तद्रा तुष्टिस्त्रैकाल्यरूपिणी । त्रिकाल्यदा च त्रैर्पक्षताराणापकभूषणा ॥ ५६॥ त्वरिता त्वरितप्रीता तत्त्वदर्शी
    तमस्विनी । ताराक्षहारिणी तीर्णा तारूण्यकुण्डभोगिनी ॥ ५७॥ थकारवर्णनिलया थकाराक्षररूपिणी । थैथैरूपा
    थरिग्रूपा थौङ्गदादिकरूपिणी ॥ ५८॥ स्थूलवुध्नी स्थूलतनु स्थातध्यानपरायणा । थेथकुटाक्शरौप्यां थीन्थूङ्काराक्षरमालिनि
    ॥ ५९॥ थररूपादक्षणा च दानसन्मानदायिनि । दक्षपुत्री दक्षयज्ञनाशिनी दानवी दया ॥ ६०॥ दयाईहृदयादान्ता दैत्यनाशनकारिणी
    । दयालु दैत्यशमनी द्रव्यहाद्रव्यवत्साली ॥ ६१॥ द्रव्यगीता द्रव्यमाता दान्ता दारिद्र्य नाशिनी । दयार्ता
    दीपिनी दिशा दीपमार्गपरायणा ॥ ६२॥ दीनप्रीता दीर्घजीव्हा दारिद्र्यनाशिनीदित्ति । दुःखसंहारिणी दुष्टदैत्यविध्वंसनक्षमा
    ॥ ६३॥ दाडीमिपुष्परूपा च दाडीमिपुष्पपूजिता । दाडीमिवाजदत्ता च दाडीरूपा दरस्थिता ॥ ६४॥ दीर्घाक्षी दीर्घनासा
    च दीक्षिता दीक्षितेश्वरी । दुर्गा दुर्गविहंत्रि च दुःखप्रणाशिनी दरी ॥ ६५॥ दौर्गासुरविहंत्रि च दुर्गदारणतत्परा
    । दानदक्षा दानपूजा दानतुष्टा दयातति ॥ ६६॥ दासी दासीकुण्डरति दासीपुष्पपरायणा । दासीबीजरता दाना दीनारदायिनी
    द्रुती ॥ ६७॥ द्रुतसिद्धकरी दीर्घा दीर्घाका दीक्षितप्रिया । दासीचुम्बनसन्तुष्टा दासीमथनतत्परा ॥ ६८॥
    दासीकुण्डप्रीतप्राणा दान्दीन्दून्दैं स्वरूपिणी । दूं बीजजपसन्तुष्टा दूंवुस्वाहा स्वरूपिणी ॥ ६९॥ धनदा
    धननाथा च धनधान्यविवर्धिनी । धूं बीजनिलया धूम्रा धूधून्धूमावति धृति ॥ ७०॥ धैर्यदा धारिणी धैर्या धरित्री
    च धराधरा । धर्मिष्ठा धर्मनिरता धर्ममार्गपरायणा ॥ ७१॥ धर्मप्राण धर्मगति धारासम्पातरूपिणी । धिमिथरिहवरूपा
    च धर्मतारा धनार्चिता ॥ ७२॥ धी धीषणा धीरगति धीराधीरस्वरूपिणी । धात्रीप्रसुनसन्तुष्टा धात्रीफलकुचद्वया
    ॥ ७३॥ धात्रीध्यानरता ध्याना ध्यानतत्वपरायणा । ध्यानदात्री ध्यानगात्रा ध्यानस्था ध्यानरूपिणी ॥ ७४॥
    ध्येयरूपा ध्येयगम्या ध्येयचक्रसमस्थिता । ध्यानपरायणप्रीता ध्यानध्येयस्वरूपिणी ॥ ७५॥ ध्यानगम्या ध्यानतुष्टाः
    ध्यानगानपरायणा । धिकतान्धिस्वरूपा च धैधैशब्दपरायणा ॥ ७६॥ धर्मिनी धर्मपक्षाङ्गा धर्मकर्मपरायणा । धर्मग्रामरताङ्घ्रिं
    च ध्रीन्ध्रीन्धून्धौं स्वरूपिणी ॥ ७७॥ नररूपा नरप्रीता नरनाथा नरात्मिका । नारसिंही नतिर्नारी नरपुष्पस्वरूपिणी
    ॥ ७८॥ नरपुष्पप्रियप्राणा नरपुष्पप्रतर्पिता । नरपुष्पार्चनपुष्पा नरपुष्पक्रियामति ॥ ७९॥ नरपुष्पार्चनानन्दा
    नरपुष्पाम्बरा नदि । नरयज्ञा नरानन्दा नरयज्ञपरायणा ॥ ८०॥ नरनापूरतानाना नतनानास्वरूपिणी । नानामाना ननननास्वरूपा
    नाप्रर्विता ॥ ८१॥ नाप्रीता नाप्रशाला नाटिकानन्दतोषिता । नानाभाषाप्ररूढा च नानावर्णश्चरूपिणी ॥ ८२॥
    नागिनी नागभूषा च नागार्हार्नागरूपिणी । नगज्वानगसम्भूता नगवंश प्रतोषिता ॥ ८३॥ नादरूपा नादगतिर्नादब्रह्म
    परायणा । नारदप्रियसन्तुष्टा नारदप्रियमानसा ॥ ८४॥ नारदा नारदेशी च नदीनिम्नस्वरूपिणी । निम्ननाभी निश्चयोनि
    निम्ननेत्रा नरोत्तमा ॥ ८५॥ नरवाहनसन्तुष्टा नरवाहनतत्परा । नान्नीन्नून्नैन्नौं स्वरूपा च नमोरूपा नमोनमः
    ॥ ८६॥ नमस्कारप्रिया नित्या नित्यानन्दस्वरूपिणी । नित्यपूजार्चनप्रीता नित्यपूजापरायणा ॥ ८७॥ नित्योत्सवपरानन्दा
    नीररूपा नीराकृती । नर्मदा नर्मरूपा च नर्मकुण्डवीकानी ॥ ८८॥ नर्मकुण्डलेलिहाना नर्मनटप्रिया । नैमित्तिकार्चनप्रीता
    नैमित्तिकपरायणा ॥ ८९॥ नर्मदा नर्मदात्री च नर्मकर्मपरायणा । नीवीमोचनसन्तुष्टा नीवीमोचनतत्परा ॥ ९०॥
    नारीपुष्पप्रियाप्राणा नारीपुष्पपरायणा । नारीपुष्पमतीप्रीता नारीपुष्पस्वरूपिणी ॥ ९१॥ नैर्यापिका नववीणा
    च नाडीनादपरायणा । नाडीनादपरानन्दा नाडीनादपरागती ॥ ९२॥ नाडीनादात्मिका नौका नौकाक्रीडापरायणा । पद्मपूजनसन्तुष्टा
    पद्महोमपरायणा ॥ ९३॥ परमानन्दसन्दोहा परमाकाशरूपिणी । परातीता परागम्या परमात्मा परागति ॥ ९४॥ पम्पातीरनिवासा
    च प्रद्युम्नाप्रीतिरूपिणी । प्राणवा प्राणवेज्या च परतत्वा परायणा ॥ ९५॥ पद्मपत्रा पद्मतुष्टा तुष्टीपावनरूपिणी
    । पापसंहारिणी तुष्टा पुण्यदात्री परातरी ॥ ९६॥ पुरी पुरारी गृहिणी पुराणागमरूपिणी । पुराणगम्या पानाट्या
    पानतोषणतत्परा ॥ ९७॥ पानानन्दा पीततनुस्था तैवपि रसस्वनी । पीनयोनी पीतजङ्घा पीताम्बरधरावति ॥ ९८॥ पीताम्बरा
    पीतगर्भा पीतपुष्पार्चनप्रिया । पीतपुष्पाञ्जलिरता पीतद्रदनिवासिनी ॥ ९९॥ पीठस्था पीठरूपा च पीठवासपरायणा
    । परदारप्रिया पत्राधरधार प्रहर्षिणी ॥ १००॥ परदारप्रहरसि परदारविरोधिनी । परदारप्रियापात्रा पात्रतोषणतत्परा
    ॥ १०१॥ पात्ररूपा पात्रतुष्टी पात्रदानपरायणा । पात्रपुष्पप्रिया पात्रकुण्डानन्दपरेश्वरी ॥ १०२॥ पात्राराधनसन्तुष्टा
    पात्रप्रासादरूपिणी । पवित्रा पुण्यचारित्रा पवित्रारोपणात्मिका ॥ १०३॥ पवित्ररोपणरता पात्रगानपरायणा
    । पात्रगीत पात्रनपा पात्रसंयोगरूपिणी ॥ १०४॥ पात्रकुण्डविकसता पात्रकुण्डविलोहिनी । पात्रकुण्डध्वनिरता
    पात्रकुण्डध्वनिप्रिया ॥ १०५॥ परनिद्राविनिर्मुक्ता परद्रव्यविमोचनी । परस्वनाशिनीप्रीता पार्वती पर्वतात्मजा
    ॥ १०६॥ पर्वतेज्या पर्वरता पर्वतप्रियरूपिणी । परायणा पारची च पतिधर्मविधारिणी ॥ १०७॥ पतिप्रिया प्रीतिरता
    पतिगम्या पतिव्रता । पतिव्रतधरा पीनवक्षोजद्वयधारिणी ॥ १०८॥ पिशाचप्रेमसन्तुष्टा प्रेतकोटिसमाकुला । प्रेतगर्भा
    प्रेतरूपा प्रेतभूषणभूषणी ॥ १०९॥ प्रेतमालाकण्ठभूषा प्रेतलेहनतत्परा । प्रेतशी प्रेतराज्ञी च प्रेतव्रतपरायणा
    ॥ ११०॥ पिशाचानन्दसन्तोषा पार्थप्रीतिपरायणा । पार्थिवा पार्थवेज्या च पृथुला पृथुरूपिणी ॥ १११॥ पृथ्वी
    च पृथिवी पिङ्गा पिङ्गनेत्रा च पिङ्कटा । पापान् विनाशिनी पद्या गद्यपद्यपरायणा ॥ ११२॥ पद्यात्मिका पद्यरता
    पाम्पीम्पूम्पौं स्वरूपिणी । पाम्पीङ्काररता प्राणा प्राणदात्री प्रतापिनी ॥ ११३॥ प्रभावती प्रभाप्रेमा
    प्रेमयोगपरायणा । प्रज्ञा प्रज्ञावतीप्रज्ञा प्रज्ञानप्रतिभावती ॥ ११४॥ प्रतिभा प्रणतीप्राणा प्रज्ञापतिग्रहस्थिता
    । प्रजापति प्रियापारा पुरीन्द्रध्वजशोभिता ॥ ११५॥ प्रमतीप्राणधर्तृ च प्रतिज्ञापारगामिनी । फुम्फुङ्कारा
    च फट्कारा फट्काररूपधारिणी ॥ ११६॥ फ्रीङ्कार फूत्कृतिः फ्रूं च स्फङ्कारारूपधारिणी । फ्रोङ्काराफेरवी
    फ्राम्फ्रूम्फेत्कारी फणधारिणी ॥ ११७॥ फेणिप्रीता फणेरता फणदर्शनतोषिणी । फणिभूषणसम्भूषा फणिनाथप्रियार्चिता
    ॥ ११८॥ फणिबन्धसमुद्भूता फणिवंशसुशोभिनी । पशुहस्ता पशुमति परशुरामप्रसादिनी ॥ ११९॥ फेत्कारभैरवी फ्रौण्टा
    फ्रेत्कारारवभाषिणी । फ्रेत्कारा फाल्गुनानन्दा फली फुल्लप्रिया फुला ॥ १२०॥ फलदात्री फलरता फलरूपा फलात्मिका
    । फलहोमप्रियस्फाला फलनामपरायणा ॥ १२१॥ बृहस्पतिमुखस्था च बृहतीछन्दरूपिणी । बृहत्सेवा बृहत्ब्रह्मी ब्रह्मीब्रह्मप्रपूजिता
    ॥ १२२॥ ब्रह्मवृत्तधरावीणा बाण्सन्धानकारिणी । बाणासुरार्चिता ब्रूं च ब्राम्ब्रीम्ब्रैम्ब्रौं स्वरूपिणी
    ॥ १२३॥ बर्हिपिछुमिया बर्हा बर्हपछविभूषणा । बटुका बटुकेज्या च बटुकप्राणमानसा ॥ १२४॥ बटूकाभैरवरता बटुकार्चनतोषिणी
    । बटुकार्चनसन्तुष्टा बलीदानप्रियाबली ॥ १२५॥ बलिपूज्या बलिरता बलिदाननिवासिनी । बलिद्वारस्थिता बाला
    बालां वा बालभैरवी ॥ १२६॥ बालक्रीडामयप्राणा बालकप्रियकारिणी । बलितुष्टा बलिरता बलितोषणकारिणी ॥ १२७॥
    बलिमाता बलिमयि बलितत्वात्मिकाबली । बला बलार्चनप्रीता बलधारणतत्परा ॥ १२८॥ बटुकाराधनरता बटुकेज्या बटुप्रिया
    । बटुकाराधनप्रीता बटुकार्यवतारिणी ॥ १२९॥ बटुतारा बटुछिन्ना बटुकाली बृहन्मयी । बृहत्कुक्षि बृहत्तारा
    बृहत्तन्त्रागमेश्वरी ॥ १३०॥ बृहद्रुणा बृहद्यन्त्रा बृहत्तन्त्रा बृहत्कला । बृहन्माता बृहज्वाला बृहन्मानमयीबृहत्
    ॥ १३१॥ बृहत्ताण्डवरूपा च बृहत्तारूण्यरूपिणी । बृहदारण्यसंसेव्या बालचन्द्रकिरीटिनी ॥ १३२॥ बलदा बाहुभूषा
    च बाहुमालाविभूषणा । बाहुला बाहुलेयेसी बाहुलेयस्वरूपिणी ॥ १३३॥ बहुभाषामयी बुद्ध्या बुद्धिदा बुद्धिदायिनी
    । बुद्धि बुद्धिमता बौद्धा बौद्धाचारपरायणा ॥ १३४॥ बौद्धमार्गप्रियाप्रीता बौद्धमार्गपवर्तिनी । बृहस्पतिसुताराध्या
    बुद्धिमाता बुधेश्वरी ॥ १३५॥ बौद्धावारूपिणी भार्या भानवी भानुरूपिणी । भानुमत्ता भानुमयी भानुभार्या
    भवेश्वरी ॥ १३६॥ भवपत्नी भयहरा भवदानवनाशिनी । भवमाता भवरताश्रवतारणतारिणी ॥ १३७॥ भर्तप्रिया भर्तरता
    भर्तभावप्रकाशिनी । भर्तनीतिकरी भार्या भर्तदा भीमभीषणी ॥ १३८॥ भीक्षूपूज्या भिक्षूमाता भिक्षूमानसतोषिणी
    । भीमसेनप्रिया भीमा भीमाक्षी भीमभीतिदा ॥ १३९॥ भ्रान्तहन्त्री भयहरा भवपाशविमोचिनी । भवदावानलघ्नी च
    भक्तपूज्या भवार्तिहा ॥ १४०॥ भक्ततुष्टा भौममाता भोपा भोपप्रताशिनी । भृगरूपा भृगोपत्नी भृगुताण्डवकारिणी
    ॥ १४१॥ भृगुत्सेवरता भ्रान्तीहारिणी भारतप्रिया । भारती भानवेश्या च भाषा भीमामयी भवा ॥ १४२॥ भानमती भुक्तिमयी
    भ्रूं बीजाक्षररूपिणी । भ्राम्भ्रीम्भ्रूम्भ्रैं स्वरूपिणी भ्रमतीवविनाशिनी ॥ १४३॥ भङ्गा भङ्गाप्रिया
    भृङ्गी भृङ्गध्वनिपरायणा । भ्रातृजाया भगवती भवानी भक्तवत्सला ॥ १४४॥ भवसिद्धा भगेज्या च भगमाला भवेश्वरी
    । भ्रान्ता भ्रमरिका भीति भ्राजिश्णु भक्तरूपिणी ॥ १४५॥ भक्तमानसन्तुष्टा भवती भ्रमराम्बिका । भ्रामरी
    भ्रान्तमाला च भवेज्या भवसिद्धिदा ॥ १४६॥ भगरूपा भगरता भगगीतीमयी भगा । भङ्काररूपिणी भ्रामा भगमालाविभूषणा
    ॥ १४७॥ भगलिङ्गस्वरूपा च भगलिङ्गपरायणा । भगलिङ्गामृतान्दोला भगाविलोलुपा ॥ १४८॥ भगार्चनरतानन्दी भगभाग्यपरायणा
    । भगतत्वा भगाव्हा च भगलिङ्गध्वनी भगा ॥ १४९॥ भगनी भार्गवेज्या च भगमाला भगाङ्कुरा । भगकुण्डाह्लादरता
    भगकुण्डविकासिनी ॥ १५०॥ भवित्री भविता भूता भूतमाता च भूपति । भूपेज्या भूपसन्तुष्टा भैक्ष्यचर्वणतत्परा
    ॥ १५१॥ भगनामस्मृतिपरा भगजापपरायणा । भगतन्त्रा भगामोहा भगगन्धपरायणा ॥ १५२॥ भगवापीस्नानरता भगतीर्थनिवासिनी
    । भगदर्शनसन्तुष्टा भगचुम्बनतोषिणी ॥ १५३॥ भगजिह्वा भगमुखा भगचक्षु भगाम्बुजा । भूतेशी भूतदुर्गस्था भूपतित्वप्रदायिनी
    ॥ १५४॥ भूम्भूङ्कारस्वरूपा च भद्रशब्दपरायणा । भहभहारकामहा भाष्यकर्ता भयापहा ॥ १५५॥ भरता भरतेशी च भरताप्राणदायिनी
    । भरताप्रेमसन्तुष्टा भरताधाररूपिणी ॥ १५६॥ भूभारा भूधराधीशा भूधरा भूधरप्रिया । मामीपानन्दना माया मद्यपानपरायणा
    ॥ १५७॥ मधुप्रीता मधुरता मधुरा मधुरामधु । मदिरा मदिरोन्मत्ता माननीया मदोद्धता ॥ १५८॥ माध्वीपानरता माता
    मायाबीजव्हयामती । निमाता मालिनी मात्रा मदनीमृतदर्पिका ॥ १५९॥ मानाक्षी मातुलानी च मोदिनी मदनातुरा ।
    म्राम्म्रीम्म्रूम्रैं स्वरूपा च म्रौम्म्रः सर्वस्वरूपिणी ॥ १६०॥ मिताक्षरा मिताहारा मिताचार मनोमयी
    । मलिना मलिनी मैत्रा मैत्रवारूणतारुणी ॥ १६१॥ मायावती मानवती महामधुमतिमयी । महीधरसक्ता मात्रा मात्रास्वरविभेदिनी
    ॥ १६२॥ मीनरूपा मीननाथा मालती मधुलोलुपा । मधुपानरता मारी महामारी महीपति ॥ १६३॥ महाकाली महातारा महाछिन्ना
    महेश्वरी । माहेशी च मदस्था च मदनस्थानरूपिणी ॥ १६४॥ मदनप्रियकान्ता च महायोगेश्वरी मखी । महामदनसन्तुष्टा
    महामदनभूषिता ॥ १६५॥ महिता महिला माया मकाराक्षररूपिणी । मकाररूपिणी मुद्रा मुद्रामोदपरायणा ॥ १६६॥ मेहस्था
    मेहमाता च मेहमित्रा महत्प्रिया । महता मोजसाकारा महतानन्ददायिनी ॥ १६७॥ मधुमांसा मेहतारा मेहप्रस्ताररूपिणी
    । मेहपुत्री च मीनाक्षी मितभाषा मितार्थवित् ॥ १६८॥ मदनान्तककान्ता च मदनान्तकरूपिणी । महोरगा महोशुषा
    महती महिषापहा ॥ १६९॥ महिषासुरनिर्नाशी मुण्डमालाविभूषणा । मुण्डप्राकारसंरूपा मुण्डासुरविमर्दिनी ॥ १७०॥
    मानसा मानसेसी च मुद्रिण्यम्बास्वरूपिणी । मुद्रिणी मन्त्रिणी मन्त्रा महामन्त्रा महार्णवा ॥ १७१॥ महार्णवस्थिता
    मोहा मोहिनीनाशिनी मरुत् । मनुर्मनुमयी माद्री मद्रकुञ्जरवासिनी ॥ १७२॥ मद्रकुम्भस्थलारूढा मद्मुक्ताविभूषणा
    । मुक्ताहारविभूषाढ्या मुक्तकेशी महूर्तदा ॥ १७३॥ मोहकर्ती मोहहीना महामोहपरायणा । मन्त्रप्राणार्पणप्रीता
    मन्त्रप्राणार्पणार्चिता ॥ १७४॥ महौघानन्दा मन्दगन्धा मद्यपूजनतत्परा । मकारवर्णसर्वाङ्गी मितभोगा मितान्मिता
    ॥ १७५॥ महाधूम्रावती मुक्ता महामुक्ताविभूषणा । मुक्तारजन्तनासा च मुक्ताछत्रविभूषणा ॥ १७६॥ मुक्तदानरता
    मध्या मध्यमा मध्यमेश्वरी । मितीर्मीतीमती मीनकेतु मकररूपिणी ॥ १७७॥ मकरस्था महादेवी महादेव मनोमयी ।
    महोत्सवादुर्गा माया महापूजारमेत्यदा ॥ १७८॥ महाग्रहस्वरूपा च मघानक्षत्ररूपिणी । मद्यमांसवृतरता माघस्नानपरायणा
    ॥ १७९॥ मार्गशीर्षप्रियानन्दा मार्गदर्शनतत्परा । मार्गमार्गामात्रका च मातृकालिपिरूपिणी ॥ १८०॥ मातृकान्याससन्तुष्टा
    मातृकान्यासरूपिणी । मालिनीन्याससन्तुष्टा मालिनीमोक्षदायिनी ॥ १८१॥ मोक्षदात्री मोक्षगर्ती मोक्षमार्गपरायणा
    । मुक्ता मुक्तिप्रियकरी मुक्तिस्था मुक्तिताण्डवा ॥ १८२॥ महानन्दा महाकाली महाभुवनतारिणी । महेन्द्रपूज्या
    माहेशी मतिसागरदायिनी ॥ १८३॥ यक्षा यक्षस्वरूपा च यक्षणी यक्षपूजिता । यादेवी यादवाराध्या यदुवंशसमुद्भवा
    ॥ १८४॥ यमुना च यजुर्वेदा यजुर्वेदपरायणा । यामिनी यमपूज्या च यममातापतिप्रिया ॥ १८५॥ यात्रा यात्रयशोदा
    च यशोवर्धनतत्परा । यशकर्पूरधवला योगिनी च यशस्विनी ॥ १८६॥ यांयींयूं याकिनीरूपा यैंयौं यङ्काररूपिणी
    । योगमाता योगगम्या योगमार्गपरायणा ॥ १८७॥ योगीशा योजना यामा योजनायुतविस्तरा । यथोक्ताचारनिरता यथोक्तफलदायिनी
    ॥ १८८॥ यक्षकर्दमसम्भूषा यवर्गरूपिणीपति । रमणी रमणीप्रीता रमा रत्नेश्वरी रती ॥ १८९॥ रतिप्रिया रतिरता
    रतितोषणतत्परा । रत्नगर्भा रत्नबीजा राजीवलोचना रमा ॥ १९०॥ राम्बीजा रींस्वरूपा च रांरींरूंरैं स्वरूपिणी
    । रौंरः वर्णस्वरूपा च राज्यदातृ रसातुला ॥ १९१॥ रसतुष्टा रसगति रघुवंशसमुद्भवा । रतिरूपा रतान्ता च रतिगर्भपरायणा
    ॥ १९२॥ राजीवनेत्रा राज्ञी च रमणासुरकन्यका । राजराजेश्वरीद्रष्टा रौद्री रूद्रप्रिया च हट् ॥ १९३॥ हद्रकन्या
    हद्रजाया हद्रमातारतानन्दा । हद्रेज्या च त्रिरूपा च रात्रिञ्चरविभेदिनी ॥ १९४॥ राक्षसघ्नी रक्षणा च रक्षोविद्रावणी
    रता । हचिरा हचिरूपा च रोचिषा रोमरूपिणी ॥ १९५॥ रोमगर्भा रोमदेहा रोमभूषणतत्परा । रसा रसवती राज्यलक्ष्मी
    रावणनाशिनी ॥ १९६॥ रावणेज्या रवदता रावणप्रियदायिनी । रजोवती रजःप्राणा रजोगुणमयी रवा ॥ १९७॥ रतिपुष्पप्रिया
    रूंरूं राकिणी रेणुका रया । रैं बीजनिलया रैण्णा रेणुरूपा च हाकिनी ॥ १९८॥ हक्वाङ्गदस्यभगिनी हक्यरूपा
    च रूपभू । रौप्यपरा रौप्यरौप्या रौप्यगेहविभूषणा ॥ १९९॥ रौप्यसिंहासनरता रौप्यदानपरायणा ॥ २००॥ इति श्रीदिव्यसाम्राज्यमेधानामसहस्रकम्
    । महोग्रानामसाहस्रं तारण्या गदितं पुरा ॥ २०१॥ अक्षोभ्यस्ववरोदत्तप्रसादेन प्रकीर्तितम् । इदमेवपुरादेवी
    कालेनापि प्रकीर्तितम् ॥ २०२॥ अष्टाधिकसहस्रन्तु नमः स्वाहास्रमेवतु । तवर्गान्तुरकारान्तं तेनतारामयं
    शिवे ॥ २०३॥ सर्वसिद्धिमयं साक्षात् सर्वापत्तारणं परम् । पूजाकाले विशेषेण सन्ध्यायोभययोरपि ॥ २०४॥ यः
    पठेत्प्रयतोनित्यं ताराप्रत्यक्षतामियात् । एककालं द्विकालं वा त्रिकालं यः पठेन्नरः ॥ २०५॥ अर्धरात्रे
    विशेषेण सर्वसिद्धिप्रदं शिवे । कुलका स्मरणं तारा ध्यानं नामप्रकीर्तितम् ॥ २०६॥ भक्तस्य कृत्यमेतावदन्यदभ्युदयं
    विदुः । सर्व सङ्कट विनिर्मुक्त सर्व सत्व समन्वितः ॥ २०७॥ सर्वसिद्दिश्वरोभूयान्नात्र कार्या विचारणात्
    । यः पठेद्वापाठयेद्वापि श
