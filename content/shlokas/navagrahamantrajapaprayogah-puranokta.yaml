id: navagrahamantrajapaprayogah-puranokta
category: mantra
name:
  english: navagrahamantrajapaprayogah (puranokta)
  devanagari: नवग्रहमन्त्रजपप्रयोगः (पुराणोक्त)
content:
  english: muntheshvarasya mantra eva munthaya mantrah || 10|| raveh saptasahasrani candrasyaikadashaiva
    tu | kuje dashasahasrani budhe catuhsahasrakam || ekonavimshatirjive shukre shodasha eva ca | trayovimshati
    mandasya rahurashtadasha smritah | ketoh saptasahasrani ityete japasankhyaya || iti puranoktanavagrahamantrajapaprayogah
    sampurnah |
  devanagari: मुन्थेश्वरस्य मन्त्र एव मुन्थाया मन्त्रः ॥ १०॥ रवेः सप्तसहस्राणि चन्द्रस्यैकादशैव तु । कुजे
    दशसहस्राणि बुधे चतुःसहस्रकम् ॥ एकोनविंशतिर्जीवे शुक्रे षोडश एव च । त्रयोविंशति मन्दस्य राहुरष्टादश
    स्मृतः । केतोः सप्तसहस्राणि इत्येते जपसङ्ख्यया ॥ इति पुराणोक्तनवग्रहमन्त्रजपप्रयोगः सम्पूर्णः ।
meaning: {}
