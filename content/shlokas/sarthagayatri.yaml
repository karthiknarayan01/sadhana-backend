id: sarthagayatri
category: stotram
name:
  english: sarthagayatri
  devanagari: सार्थगायत्री
content:
  english: apa ityapnotiti vyutpattya vyapitvamucyate jyotiriti prakasharupatvam | rasa iti sarvatishayatvam
    | amritamiti maranadi samsaranirmuktatvam | sarvavyapisarvaprakashakasarvotkrishtanityamuktamatmarupam
    saccidatmakam yadomkaravacgyam brahma tadahamasmi | iti gayatrimantrasyarthah | guhashayabrahmahutashano'ham
    kartredamamshakhya havirhutam sat| viliyate nedamaham bhavani
  devanagari: आप इत्याप्नोतीति व्युत्पत्त्या व्यापित्वमुच्यते ज्योतिरिति प्रकाशरूपत्वम् । रस इति सर्वातिशयत्वम्
    । अमृतमिति मरणादि संसारनिर्मुक्तत्वम् । सर्वव्यापिसर्वप्रकाशकसर्वोत्कृष्टनित्यमुक्तमात्मरूपं सच्चिदात्मकं
    यदोंकारवाच्ग्यं ब्रह्म तदहमस्मि । इति गायत्रीमन्त्रस्यार्थः । गुहाशयब्रह्महुताशनोऽहं कर्त्रेदमंशाख्य
    हविर्हुतं सत्। विलीयते नेदमहं भवानी
meaning: {}
