id: vishwakarma-suktam
category: stotram
name:
  english: Vishwakarma Suktam
content:
  english: ya ima vishva bhuvanani juhvadrishir hota nishasada pita nah | sa ashisha dravinamicchamanah
    paramacchado vara a vivesha || vishvakarma manasa yadvihaya dhata vidhata paramota sandrik | teshamishtani
    samisha madanti yatra saptar yo nah pita janita yo vidhata yo nah sato abhya sajjajana | yo devana
    nnamadha eka eva tagm samprashnambhuvana yantyanya || ta ayajanta dravinagm samasma rishayah purve
    jaritaro na bhuna | asurta surta rajaso vimane ye bhutani samakrinvannimani || njajananyadyushmakamantarambhavati
    | niharena pravrita jalpya casutripa ukthashasashcaranti || paro diva para ena prithivya paro devebhirasurairguha
    yat | kagm svidgarbha ndadhra apo yatra deva ssamagacchanta vishve || ndadhra apo yatra deva ssamagacchanta
    vishve | ajasya nabhavadhyekamarpitam vi~shvambhuvanamadhi shritam || vishvakarma hyajanishta deva
    adidgandharvo abhavaddvitiyah | tritiyah pita janitaushadhinamapa vya~dadhatpurutra || cakshushah
    pita manasa hi dhiro ghritamene ajanannannamane | yadedanta adadrigmhanta purva adiddyavaprithivi
    aprathetam || vishvatashcakshuruta vishvatomukho vishvatohasta uta vishvataspat | sambahubhya nnamati
    sampatatrairdyavaprithivi janayandeva ekah || kigm svidasidadhishthanamarambhana nkatamatsvitkimasit
    | yadi bhumi njanayanvishvakarma vi dyamaurnonmahina vishvacakshah || nka u sa vriksha asidyato dyavaprithivi
    nishtatakshuh | manishino manasa pricchatedu tadyadadhyatishthadbhuvanani dharayan || ya te dhamani
    paramani yavama ya madhyama vishvakarmannutema | shiksha sakhibhyo havishi svadhava vi~shvakarmanamutaye
    manoyujam va~je adya huvema | sa no nedishtha havanani joshate vishvashambhuravase sadhukarma || vishvakarmanhavisha
    vavridhana njushanah | muhyantvanye abhitah sapatna ihasmakammaghava surirastu || vishvakarmanhavisha
    vardhanena trataramindramakrinoravadhyam | tasmai visha ssamanamanta purvirayamugro vihavyo yathasat
    || samudraya vayunaya sindhunampataye namah | nadinagm sarvasampitre juhuta vishvakarmane vishvahamartyagm
    havih |
  devanagari: य इ॒मा विश्वा॒ भुव॑नानि॒ जुह्व॒दृषि॒र् होता॑ निष॒सादा॑ पि॒ता नः॑ । स आ॒शिषा॒ द्रवि॑णमि॒च्छमा॑नः
    परम॒च्छदो॒ वर॒ आ वि॑वेश ॥ वि॒श्वक॑र्मा॒ मन॑सा॒ यद्विहा॑या धा॒ता वि॑धा॒ता प॑र॒मोत स॒न्दृक् । तेषा॑मि॒ष्टानि॒
    समि॒षा म॑दन्ति॒ यत्र॑ सप्त॒र् यो नः॑ पि॒ता ज॑नि॒ता यो वि॑धा॒ता यो नः॑ स॒तो अ॒भ्या सज्ज॒जान॑ । यो दे॒वाना॑
    न्नाम॒धा एक॑ ए॒व तग्ं स॑म्प्र॒श्नम्भुव॑ना यन्त्य॒न्या ॥ त आय॑जन्त॒ द्रवि॑ण॒ग्ं सम॑स्मा॒ ऋष॑यः॒ पूर्वे॑
    जरि॒तारो॒ न भू॒ना । अ॒सूर्ता॒ सूर्ता॒ रज॑सो वि॒माने॒ ये भू॒तानि॑ स॒मकृ॑ण्वन्नि॒मानि॑ ॥ ञ्ज॒जाना॒न्यद्यु॒ष्माक॒मन्त॑रम्भवाति
    । नी॒हा॒रेण॒ प्रावृ॑ता जल्प्या॑ चासु॒तृप॑ उक्थ॒शास॑श्चरन्ति ॥ प॒रो दि॒वा प॒र ए॒ना पृ॑थि॒व्या प॒रो
    दे॒वेभि॒रसु॑रै॒र्गुहा॒ यत् । कग्ं स्वि॒द्गर्भ॑ न्द॑ध्र॒ आपो॒ यत्र॑ दे॒वा स्स॒मग॑च्छन्त॒ विश्वे ॥ न्द॑ध्र॒
    आपो॒ यत्र॑ दे॒वा स्स॒मग॑च्छन्त॒ विश्वे॑ । अ॒जस्य॒ नाभा॒वध्येक॒मर्पि॑तं॒ विँश्व॒म्भुवन॒मधि॑ श्रि॒तम्
    ॥ वि॒श्वक॑र्मा॒ ह्यज॑निष्ट दे॒व आदिद्ग॑न्ध॒र्वो अ॑भवद्द्वि॒तीयः॑ । तृ॒तीयः॑ पि॒ता ज॑नि॒तौष॑धीनाम॒पा
    व्यँ॑दधात्पुरु॒त्रा ॥ चक्षु॑षः पि॒ता मन॑सा॒ हि धीरो॑ घृ॒तमे॑ने अजन॒न्नन्न॑माने । य॒देदन्ता॒ अद॑दृग्ंहन्त॒
    पूर्व॒ आदिद्द्यावा॑पृथि॒वी अ॑प्रथेताम् ॥ वि॒श्वत॑श्चक्षुरु॒त वि॒श्वतो॑मुखो वि॒श्वतो॑हस्त उ॒त वि॒श्वत॑स्पात्
    । सम्बा॒हुभ्या॒ न्नम॑ति॒ सम्पत॑त्रै॒र्द्यावा॑पृथि॒वी ज॒नय॑न्दे॒व एकः॑ ॥ किग्ं स्वि॑दासीदधि॒ष्ठान॑मा॒रम्भ॑ण
    ङ्कत॒मत्स्वि॒त्किमा॑सीत् । यदी॒ भूमि॑ ञ्ज॒नय॑न्वि॒श्वक॑र्मा॒ वि द्यामौर्णो॑न्महि॒ना वि॒श्वच॑क्षाः
    ॥ ङ्क उ॒ स वृ॒क्ष आ॑सी॒द्यतो॒ द्यावा॑पृथि॒वी नि॑ष्टत॒क्षुः । मनी॑षिणो॒ मन॑सा पृ॒च्छतेदु॒ तद्यद॒ध्यति॑ष्ठ॒द्भुव॑नानि
    धा॒रयन्॑ ॥ या ते॒ धामा॑नि पर॒माणि॒ याव॒मा या म॑ध्य॒मा वि॑श्वकर्मन्नु॒तेमा । शिक्षा॒ सखि॑भ्यो ह॒विषि॑
    स्वधाव विँ॒श्वक॑र्माणमू॒तये॑ मनो॒युजं॒ वाँजे॑ अ॒द्या हु॑वेम । स नो॒ नेदि॑ष्ठा॒ हव॑नानि जोषते वि॒श्वश॑म्भू॒रव॑से
    सा॒धुक॑र्मा ॥ विश्व॑कर्मन्ह॒विषा॑ वावृधा॒न ञ्जुषा॒णः । मुह्य॑न्त्व॒न्ये अ॒भितः॑ स॒पत्ना॑ इ॒हास्माक॑म्म॒घवा॑
    सू॒रिर॑स्तु ॥ विश्व॑कर्मन्ह॒विषा वर्ध॑नेन त्रा॒तार॒मिन्द्र॑मकृणोरव॒ध्यम् । तस्मै॒ विश॒ स्सम॑नमन्त
    पू॒र्वीर॒यमु॒ग्रो वि॑ह॒व्यो॑ यथास॑त् ॥ स॒मु॒द्राय॑ व॒युना॑य॒ सिन्धू॑ना॒म्पत॑ये॒ नमः॑ । न॒दीना॒ग्ं
    सर्वा॑साम्पि॒त्रे जु॑हु॒ता वि॒श्वक॑र्मणे॒ विश्वाहाम॑र्त्यग्ं ह॒विः ।
