id: dharadharakritamshivastotram
category: stotram
name:
  english: dharadharakritamshivastotram
  devanagari: धराधरकृतंशिवस्तोत्रम्
content:
  english: dharadharakritam shivastotram astaushidagrato devam sambamabhyudayatmakam | namashshivaya devaya
    sarvatitaya vedhase || 68|| gunatvakritimanaya gunakaraya hetave | mantratantrasvarupaya pancatanmatrasakshine
    || 69|| apancikritabhutaya pancabhutatmane namah | tirthamurtya jagatsarvam papattrata''tmasevinam
    || 70|| yo'sau sidantamashucau mam palayatu bhutabhrit | gangadharah shashidharo bhavo bhimo bhavantakah
    || 71|| antakasyantakasso'yamavatadamhaso vibhuh | yamenamakritakaramekadvitribhedatah || 72|| ekameva
    param prahustasmai somaya te namah | sarveshameva jantunamantarjivakalatmakam || 73|| pravrittishcopalabdhishca
    kathitah tamupasmahe | nadabindukalabhedaih ksharaksharavikalpanaih || 74|| stuyate nigamairyo'sau
    sada bhavatu me gatih | yadekadeshadarkadyah dyotante hi nabhasthale || 75|| yadajnaya brahmamukhah
    tasmai brahmatmane namah | kecittaranti vai mrityum kecidamho duratyayam || 76|| kecittaranti daridryam
    namastasmai dayatmane | ashtamurtiranekatma nigamantah pradarshitah || 77|| sarvatma shankarah sakshi
    kshemaya purato'stu me | tvam devadevam purusham sadyojatamanamayam || 78|| kshemankaram vamadevamaghoram
    pranato'smyaham | ishanah shashvatah sakshi so'yam tatpurusho vibhuh || 79|| namo namashshashvatashantikarin
    shamamvatam bhurikarapriyakarah || 80|| sa nah samastabhyudayaikahetuko bhavedbhayanamupashantikridvibhuh
    | iti tamraparnimahatmye 52
  devanagari: धराधरकृतं शिवस्तोत्रम् अस्तौषीदग्रतो देवं साम्बमभ्युदयात्मकम् । नमश्शिवाय देवाय सर्वातीताय
    वेधसे ॥ ६८॥ गुणत्वाकृतिमानाय गुणाकाराय हेतवे । मन्त्रतन्त्रस्वरूपाय पञ्चतन्मात्रसाक्षिणे ॥ ६९॥ अपञ्चीकृतभूताय
    पञ्चभूतात्मने नमः । तीर्थमूर्त्या जगत्सर्वं पापात्त्राताऽऽत्मसेविनाम् ॥ ७०॥ योऽसौ सीदन्तमशुचौ मां
    पालयतु भूतभृत् । गङ्गाधरः शशिधरो भवो भीमो भवान्तकः ॥ ७१॥ अन्तकस्यान्तकस्सोऽयमवतादंहसो विभुः । यमेनमकृताकारमेकद्वित्रिभेदतः
    ॥ ७२॥ एकमेव परं प्राहुस्तस्मै सोमाय ते नमः । सर्वेषामेव जन्तूनामन्तर्जीवकलात्मकम् ॥ ७३॥ प्रवृत्तिश्चोपलब्धिश्च
    कथितः तमुपास्महे । नादबिन्दुकलाभेदैः क्षराक्षरविकल्पनैः ॥ ७४॥ स्तूयते निगमैर्योऽसौ सदा भवतु मे गतिः
    । यदेकदेशादर्काद्याः द्योतन्ते हि नभस्थले ॥ ७५॥ यदाज्ञया ब्रह्ममुखाः तस्मै ब्रह्मात्मने नमः । केचित्तरन्ति
    वै मृत्युं केचिदंहो दुरत्ययम् ॥ ७६॥ केचित्तरन्ति दारिद्र्यं नमस्तस्मै दयात्मने । अष्टमूर्तिरनेकात्मा
    निगमान्तः प्रदर्शितः ॥ ७७॥ सर्वात्मा शङ्करः साक्षी क्षेमाय पुरतोऽस्तु मे । त्वां देवदेवं पुरुषं सद्योजातमनामयम्
    ॥ ७८॥ क्षेमङ्करं वामदेवमघोरं प्रणतोऽस्म्यहम् । ईशानः शाश्वतः साक्षी सोऽयं तत्पुरुषो विभुः ॥ ७९॥ नमो
    नमश्शाश्वतशान्तिकरिन् शमांवतां भूरिकरप्रियाकरः ॥ ८०॥ स नः समस्ताभ्युदयैकहेतुको भवेद्भयानामुपशान्तिकृद्विभुः
    । इति ताम्रपर्णीमाहात्म्ये ५२
