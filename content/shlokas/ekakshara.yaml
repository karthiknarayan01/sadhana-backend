id: ekakshara
category: upanishad
name:
  english: ekakshara
  devanagari: एकक्शर
content:
  english: tsamani samradvasuvantariksham | tvam yajnaneta hutabhugvibhushca rudrastatha daityagana vasushca
    || 7|| sa esha devo'mbaragashca cakre anye'bhyadhishtheta tamo nirundhyah | hiranmayam yasya vibhati
    sarvam vyomantare rashmimivamshunabhih || 8|| sa sarvavetta bhuvanasya gopta tabhih prajanam nihita
    jananam | prota tvamota vicitih kramanam prajapatishchandamayo vigarbhah || 9|| samaishcidanto virajashca
    bahum hiranmayam vedavidam varishtham | yamadhvare brahmavidah stuvanti samairyajurbhih kratubhistvameva
    || 10|| tvam stri pumamstvam ca kumara eka
  devanagari: त्सामानि सम्राड्वसुवन्तरिक्षम् । त्वं यज्ञनेता हुतभुग्विभुश्च रुद्रास्तथ दैत्यगणा वसुश्च
    ॥ ७॥ स एष देवोऽम्बरगश्च चक्रे अन्येऽभ्यधिष्ठेत तमो निरुन्ध्यः । हिरण्मयं यस्य विभाति सर्वं व्योमान्तरे
    रश्मिमिवांशुनाभिः ॥ ८॥ स सर्ववेत्ता भुवनस्य गोप्ता ताभिः प्रजानां निहिता जनानाम् । प्रोता त्वमोता
    विचितिः क्रमाणां प्रजापतिश्छन्दमयो विगर्भः ॥ ९॥ सामैश्चिदन्तो विरजश्च बाहूं हिरण्मयं वेदविदां वरिष्ठम्
    । यमध्वरे ब्रह्मविदः स्तुवन्ति सामैर्यजुर्भिः क्रतुभिस्त्वमेव ॥ १०॥ त्वं स्त्री पुमांस्त्वं च कुमार
    एक
