id: bagalamukhikavacam-3
category: kavacha
name:
  english: bagalamukhikavacam 3
  devanagari: बगलामुखीकवचम् ३
content:
  english: rinu tvam bagalamukhyah kavacam sarvakamadam || 8|| yasya smaranamatrena bagalamukhi prasidati
    | sarvasiddhiprada pracyam patu mam bagalamukhi || 9|| pitambara tu cagneyyam yamyam mahishamardini
    | nairrityam candika patu bhaktanugrahakarini || 10|| patu nityam mahadevi praticyam shukaranana |
    vayavye patu mam kali kauveryam tripura'vatu || 11|| ishanyam bhairavi patu patu nityam surapriya
    | urdhvam vagishvari patu madhye mam lalita'vatu || 12|| adhastad api mam patu varahi cakradharini
    | mastakam patu me nityam shridevi bagalamukhi || 13|| bhalam pitambara patu netre tripurabhairavi
    | shravanau vijaya patu nasikayugalam jaya || 14|| sharada vacanam patu jihvam patu sureshvari | kantham
    rakshatu rudrani skandhau me vindhyavasini || 15|| sundari patu bahu me jaya patu karau sada | bhavani
    hridayam patu madhyam me bhuvaneshvari || 16|| nabhim patu mahamaya katim kamalalocana | uru me patu
    matangi januni caparajita || 17|| janghe kapalini patu caranau cancalekshana | sarvatah patu mam tara
    yogini patu cagratah || 18|| prishtham me patu kaumari dakshaparshve shiva'vatu | rudrani vamaparshve
    tu patu mam sarvadeshtada || 19|| stuta sarveshu deveshu raktabijavinashini | ityetat kavacam divyam
    dharmakamarthasadhanam || 20|| gopaniyam prayatnena kasyacinna prakashayet | yah sakricchrinuyad etat
    kavacam manmukhoditam || 21|| sa sarvan labhate kaman murkho vidyamavapnuyat | tasyashu shatravo yanti
    yamasya bhavate shive || 22|| iti shrirudrayamale mahatantre shrimahavidyapitambara bagalamukhikavacam
    samaptam |
  devanagari: ृणु त्वं बगलामुख्याः कवचं सर्वकामदम् ॥ ८॥ यस्य स्मरणमात्रेण बगलामुखी प्रसीदति । सर्वसिद्धिप्रदा
    प्राच्यां पातु मां बगलामुखी ॥ ९॥ पीताम्बरा तु चाग्नेय्यां याम्यां महिषमर्दिनी । नैरृत्यां चण्डिका
    पातु भक्तानुग्रहकारिणी ॥ १०॥ पातु नित्यं महादेवी प्रतीच्यां शूकरानना । वायव्ये पातु मां काली कौवेर्यां
    त्रिपुराऽवतु ॥ ११॥ ईशान्यां भैरवी पातु पातु नित्यं सुरप्रिया । ऊर्ध्वं वागीश्वरी पातु मध्ये मां ललिताऽवतु
    ॥ १२॥ अधस्ताद् अपि मां पातु वाराही चक्रधारिणि । मस्तकं पातु मे नित्यं श्रीदेवी बगलामुखी ॥ १३॥ भालं
    पीताम्बरा पातु नेत्रे त्रिपुरभैरवी । श्रवणौ विजया पातु नासिकायुगलं जया ॥ १४॥ शारदा वचनं पातु जिह्वां
    पातु सुरेश्वरी । कण्ठं रक्षतु रुद्राणी स्कन्धौ मे विन्ध्यवासिनी ॥ १५॥ सुन्दरी पातु बाहू मे जया पातु
    करौ सदा । भवानी हृदयं पातु मध्यं मे भुवनेश्वरी ॥ १६॥ नाभिं पातु महामाया कटिं कमललोचना । ऊरू मे पातु
    मातङ्गी जानुनी चापराजिता ॥ १७॥ जङ्घे कपालिनी पातु चरणौ चञ्चलेक्षणा । सर्वतः पातु मां तारा योगिनी पातु
    चाग्रतः ॥ १८॥ पृष्ठं मे पातु कौमारी दक्षपार्श्वे शिवाऽवतु । रुद्राणी वामपार्श्वे तु पातु मां सर्वदेष्टदा
    ॥ १९॥ स्तुता सर्वेषु देवेषु रक्तबीजविनाशिनी । इत्येतत् कवचं दिव्यं धर्मकामार्थसाधनम् ॥ २०॥ गोपनीयं
    प्रयत्नेन कस्यचिन्न प्रकाशयेत् । यः सकृच्छृणुयाद् एतत् कवचं मन्मुखोदितम् ॥ २१॥ स सर्वान् लभते कामान्
    मूर्खो विद्यामवाप्नुयात् । तस्याशु शत्रवो यान्ति यमस्य भवते शिवे ॥ २२॥ इति श्रीरुद्रयामले महातन्त्रे
    श्रीमहाविद्यापीताम्बरा बगलामुखीकवचं समाप्तम् ।
