id: sri-madhvacharya-kruta-dwadasha-stotra-7
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 7
content:
  english: atha saptamastotram vishvasthitipralayasargamahavibhuti vrittiprakashaniyamavriti bandhamokshah
    | yasya apangalavamatrata urjita sa shrih yatkatakshabalavatyajitam namami || || brahmeshashakraravidharmashashankapurva
    girvanasantatiriyam yadapangalesham | ashritya vishvavijayam visrijatyacintya shrih yatkatakshabalavatyajitam
    namami || || dharmarthakamasumatipracayadyasheshasanmangalam vidadhate yadapangalesham | ashritya
    tatpranatasatpranata apidya shrih yatkatakshabalavati ajitam namami || || shadvarganigrahanirastasamastadosha
    dhyayanti vishnumrishayo yadapangalesham | ashritya yanapi sametya na yati duhkham shrih yatkatakshabalavati
    ajitam namami || || sheshahivairishivashakramanupradhana citrorukarmaracanam yadapangalesham | ashritya
    vishvamakhilam vidadhati dhata shrih yatkatakshabalavati ajitam namami || || shakrogradidhitihimakarasuryasunu
    purvam nihatya nikhilam yadapangalesham | ashritya nrityati shivah prakatorushaktih shrih yatkataksha
    balavati ajitam namami || || tatpadapankajamahasanatamavapa sharvadivandyacarano yadapangalesham |
    ashritya nagapatih anyasurairdurapam shrih yatkatakshabalavati ajitam namami || || nagarirugrabalapaurusha
    apa vishnuvahatvamuttamajavo yadapangalesham | var vishnorvaha ashritya shakramukhadevaganaih acintyam
    shrih yatkataksha balavati ajitam namami || || anandatirthamunisanmukhapankajottham sakshadramaharimanah
    priyam uttamartham | bhaktya pathati ajitamatmani sannidhaya yah stotrametabhiyati tayorabhishtam
    || || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu saptamastotram sampurnam
  devanagari: अथ सप्तमस्तोत्रम् विश्वस्थितिप्रलयसर्गमहाविभूति वृत्तिप्रकाशनियमावृति बन्धमोक्षाः । यस्या
    अपाङ्गलवमात्रत ऊर्जिता सा श्रीः यत्कटाक्षबलवत्यजितं नमामि ॥ ॥ ब्रह्मेशशक्ररविधर्मशशाङ्कपूर्व गीर्वाणसन्ततिरियं
    यदपाङ्गलेशम् । आश्रित्य विश्वविजयं विसृजत्यचिन्त्या श्रीः यत्कटाक्षबलवत्यजितं नमामि ॥ ॥ धर्मार्थकामसुमतिप्रचयाद्यशेषसन्मङ्गलं
    विदधते यदपाङ्गलेशम् । आश्रित्य तत्प्रणतसत्प्रणता अपीड्या श्रीः यत्कटाक्षबलवति अजितं नमामि ॥ ॥ षड्वर्गनिग्रहनिरस्तसमस्तदोषा
    ध्यायन्ति विष्णुमृषयो यदपाङ्गलेशम् । आश्रित्य यानपि समेत्य न याति दुःखं श्रीः यत्कटाक्षबलवति अजितं
    नमामि ॥ ॥ शेषाहिवैरिशिवशक्रमनुप्रधान चित्रोरुकर्मरचनं यदपाङ्गलेशम् । आश्रित्य विश्वमखिलं विदधाति धाता
    श्रीः यत्कटाक्षबलवति अजितं नमामि ॥ ॥ शक्रोग्रदीधितिहिमाकरसूर्यसूनु पूर्वं निहत्य निखिलं यदपाङ्गलेशम्
    । आश्रित्य नृत्यति शिवः प्रकटोरुशक्तिः श्रीः यत्कटाक्ष बलवति अजितं नमामि ॥ ॥ तत्पादपङ्कजमहासनतामवाप
    शर्वादिवन्द्यचरणो यदपाङ्गलेशम् । आश्रित्य नागपतिः अन्यसुरैर्दुरापां श्रीः यत्कटाक्षबलवति अजितं नमामि
    ॥ ॥ नागारिरुग्रबलपौरुष आप विष्णुवाहत्वमुत्तमजवो यदपाङ्गलेशम् । वर् विष्णोर्वाह आश्रित्य शक्रमुखदेवगणैः
    अचिन्त्यं श्रीः यत्कटाक्ष बलवति अजितं नमामि ॥ ॥ आनन्दतीर्थमुनिसन्मुखपङ्कजोत्थं साक्षाद्रमाहरिमनः प्रियं
    उत्तमार्थम् । भक्त्या पठति अजितमात्मनि सन्निधाय यः स्तोत्रमेतभियाति तयोरभीष्टम् ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य
    विरचितं द्वादशस्तोत्रेषु सप्तमस्तोत्रं सम्पूर्णम्
