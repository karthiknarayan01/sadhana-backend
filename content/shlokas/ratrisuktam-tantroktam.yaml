id: ratrisuktam-tantroktam
category: sukta
name:
  english: ratrisuktam tantroktam
  devanagari: रात्रिसूक्तम् तन्त्रोक्तम्
content:
  english: tvam svaha tvam svadhatvam hi vashatkarah svaratmika | sudha tvamakshare nitye tridha matratmika
    sthita || 2|| ardhamatra sthita nitya yanuccarya visheshatah | tvameva sandhya savitri tvam devi janani
    para || 3|| tvayaitaddharyate vishvam tvayaitatsrijyate jagat | tvayaitatpalyate devi tvamatsyante
    ca sarvada || 4|| visrishtau srishtirupatvam sthitirupa ca palane | tatha samhritirupante jagato'sya
    jaganmaye || 5|| mahavidya mahamaya mahamedha mahasmritih | mahamoha ca bhavati mahadevi mahasuri
    || 6|| prakritistvam ca sarvasya gunatrayavibhavini | kalaratrirmaharatrirmoharatrishca daruna ||
    7|| tvam shristvamishvari tvam hristvam buddhirbodhalakshana | lajja pushtistatha tushtistvam shantih
    kshantireva ca || 8|| khadgini shulini ghora gadini cakrini tatha | shankhini capini banabhushundiparighayudha
    || 9|| saumya saumyatarasheshasaumyebhyastvatisundari | paraparanam parama tvameva parameshvari ||
    10|| yacca kincit kvacidvastu sadasadvakhilatmike | tasya sarvasya ya shaktih satvam kim stuyase tada
    || 11|| yaya tvaya jagatsrashta jagatpatyatti yo jagat | so'pi nidravasham nitah kastvam stotumiheshvarah
    || 12|| vishnuh shariragrahanamahamishana eva ca | karitaste yato'tastvam kah stotum shaktimanbhavet
    || 13|| sa tvamittham prabhavaih svairudarairdevi samstuta | mohayaitau duradharshavasurau madhukaitabhau
    || 14|| prabodham na jagatsvami niyatamacyuto laghu | bodhashca kriyatamasya hantumetau mahasurau
    || 15|| || iti tantroktam ratrisuktam || ya devi sarvabhuteshu nidrarupena samsthita | namastasyai
    namastasyai namastasyai namo namah || || iti|| tantroktam ratrisuktam hindi bhavartha jo isa vishva
    ki adhishvari
  devanagari: त्वं स्वाहा त्वं स्वधात्वं हि वषट्कारः स्वरात्मिका । सुधा त्वमक्षरे नित्ये त्रिधा मात्रात्मिका
    स्थिता ॥ २॥ अर्धमात्रा स्थिता नित्या यानुच्चार्या विशेषतः । त्वमेव सन्ध्या सावित्री त्वं देवी जननी
    परा ॥ ३॥ त्वयैतद्धार्यते विश्वं त्वयैतत्सृज्यते जगत् । त्वयैतत्पाल्यते देवि त्वमत्स्यन्ते च सर्वदा
    ॥ ४॥ विसृष्टौ सृष्टिरूपात्वम् स्थितिरूपा च पालने । तथा संहृतिरूपान्ते जगतोऽस्य जगन्मये ॥ ५॥ महाविद्या
    महामाया महामेधा महास्मृतिः । महामोहा च भवती महादेवी महासुरी ॥ ६॥ प्रकृतिस्त्वं च सर्वस्य गुणत्रयविभाविनी
    । कालरात्रिर्महारात्रिर्मोहरात्रिश्च दारुणा ॥ ७॥ त्वं श्रीस्त्वमीश्वरी त्वं ह्रीस्त्वं बुद्धिर्बोधलक्षणा
    । लज्जा पुष्टिस्तथा तुष्टिस्त्वं शान्तिः क्षान्तिरेव च ॥ ८॥ खड्गिनी शूलिनी घोरा गदिनी चक्रिणी तथा
    । शङ्खिनी चापिनी बाणभुशुण्डीपरिघायुधा ॥ ९॥ सौम्या सौम्यतराशेषसौम्येभ्यस्त्वतिसुन्दरी । परापराणां परमा
    त्वमेव परमेश्वरी ॥ १०॥ यच्च किञ्चित् क्वचिद्वस्तु सदसद्वाखिलात्मिके । तस्य सर्वस्य या शक्तिः सात्वं
    किं स्तूयसे तदा ॥ ११॥ यया त्वया जगत्स्रष्टा जगत्पात्यत्ति यो जगत् । सोऽपि निद्रावशं नीतः कस्त्वां
    स्तोतुमिहेश्वरः ॥ १२॥ विष्णुः शरीरग्रहणमहमीशान एव च । कारितास्ते यतोऽतस्त्वां कः स्तोतुं शक्तिमान्भवेत्
    ॥ १३॥ सा त्वमित्थं प्रभावैः स्वैरुदारैर्देवि संस्तुता । मोहयैतौ दुराधर्षावसुरौ मधुकैटभौ ॥ १४॥ प्रबोधं
    न जगत्स्वामी नीयतामच्युतो लघु । बोधश्च क्रियतामस्य हन्तुमेतौ महासुरौ ॥ १५॥ ॥ इति तन्त्रोक्तं रात्रिसूक्तम्
    ॥ या देवी सर्वभूतेषु निद्रारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ॥ इति॥ तन्त्रोक्तं
    रात्रिसूक्तं हिन्दी भावार्थ जो इस विश्व की अधीश्वरी
