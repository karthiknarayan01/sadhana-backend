id: narayaniyam-dashaka-10
category: stotram
name:
  english: Narayaniyam Dashaka 10
content:
  english: vaikuntha vardhitabalo'tha bhavatprasada dambhojayonirasrijat kila jivadehan | sthasnuni bhuruhamayani
    tatha tirashcam jatim manushyanivahanapi devabhedan || || mithyagrahasmimatiragavikopabhiti rajnanavrittimiti
    pancavidham sa srishtva | uddamatamasapadarthavidhanaduna stene tvadiyacaranasmaranam vishuddhyai
    || || tavat sasarja manasa sanakam sanandam bhuyah sanatanamunim ca sanatkumaram | te srishtikarmani
    tu tena niyujyamana stvatpadabhaktirasika jagrihurna vanim || || tavat prakopamuditam pratirundhato'sya
    bhrumadhyato'jani mrido bhavadekadeshah | namani me kuru padani ca ha virince tyadau ruroda kila tena
    sa rudranama || || ekadashahvayataya ca vibhinnarupam rudram vidhaya dayita vanitashca datva | tavantyadatta
    ca padani bhavatpranunnah praha prajaviracanaya ca sadaram tam || || rudrabhisrishtabhayadakritirudrasangha
    sampuryamanabhuvanatrayabhitacetah | ma ma prajah srija tapashcara mangalaye tyacashta tam kamalabhurbhavadiritatma
    || || tasyatha sargarasikasya mariciratri statranigarah kratumunih pulahah pulastyah | angadajayata
    bhrigushca vasishthadakshau shrinaradashca bhagavan bhavadanghridasah || || dharmadikanabhisrijannatha
    kardamam ca vanim vidhaya vidhirangajasankulo'bhut | tvadbodhitaissanakadakshamukhaistanujai rudbodhitashca
    virarama tamo vimuncan || || vedan purananivahanapi sarvavidyah kurvan nijananaganaccaturanano'sau
    | putreshu teshu vinidhaya sa sargavriddhi maprapnuvamstava padambujamashritobhut || || janannupayamatha
    dehamajo vibhajya sripumsabhavamabhajanmanutadvadhubhyam | tabhyam ca manushakulani vivardhayamstvam
    govinda marutapuresha nirundhi rogan ||
  devanagari: वैकुण्ठ वर्धितबलोऽथ भवत्प्रसादा दम्भोजयोनिरसृजत् किल जीवदेहान् । स्थास्नूनि भूरुहमयानि तथा
    तिरश्चां जातिं मनुष्यनिवहानपि देवभेदान् ॥ ॥ मिथ्याग्रहास्मिमतिरागविकोपभीति रज्ञानवृत्तिमिति पञ्चविधां
    स सृष्ट्वा । उद्दामतामसपदार्थविधानदून स्तेने त्वदीयचरणस्मरणं विशुद्ध्यै ॥ ॥ तावत् ससर्ज मनसा सनकं
    सनन्दं भूयः सनातनमुनिं च सनत्कुमारम् । ते सृष्टिकर्मणि तु तेन नियुज्यमाना स्त्वत्पादभक्तिरसिका जगृहुर्न
    वाणीम् ॥ ॥ तावत् प्रकोपमुदितं प्रतिरुन्धतोऽस्य भ्रूमध्यतोऽजनि मृडो भवदेकदेशः । नामानि मे कुरु पदानि
    च हा विरिञ्चे त्यादौ रुरोद किल तेन स रुद्रनामा ॥ ॥ एकादशाह्वयतया च विभिन्नरूपं रुद्रं विधाय दयिता
    वनिताश्च दत्वा । तावन्त्यदत्त च पदानि भवत्प्रणुन्नः प्राह प्रजाविरचनाय च सादरं तम् ॥ ॥ रुद्राभिसृष्टभयदाकृतिरुद्रसङ्घ
    सम्पूर्यमाणभुवनत्रयभीतचेताः । मा मा प्रजाः सृज तपश्चर मङ्गलाये त्याचष्ट तं कमलभूर्भवदीरितात्मा ॥ ॥
    तस्याथ सर्गरसिकस्य मरीचिरत्रि स्तत्राङिगराः क्रतुमुनिः पुलहः पुलस्त्यः । अङ्गादजायत भृगुश्च वसिष्ठदक्षौ
    श्रीनारदश्च भगवन् भवदङ्घ्रिदासः ॥ ॥ धर्मादिकानभिसृजन्नथ कर्दमं च वाणीं विधाय विधिरङ्गजसङ्कुलोऽभूत्
    । त्वद्बोधितैस्सनकदक्षमुखैस्तनूजै रुद्बोधितश्च विरराम तमो विमुञ्चन् ॥ ॥ वेदान् पुराणनिवहानपि सर्वविद्याः
    कुर्वन् निजाननगणाच्चतुराननोऽसौ । पुत्रेषु तेषु विनिधाय स सर्गवृद्धि मप्राप्नुवंस्तव पदाम्बुजमाश्रितोभूत्
    ॥ ॥ जानन्नुपायमथ देहमजो विभज्य स्रीपुंसभावमभजन्मनुतद्वधूभ्याम् । ताभ्यां च मानुषकुलानि विवर्धयंस्त्वं
    गोविन्द मारुतपुरेश निरुन्धि रोगान् ॥
