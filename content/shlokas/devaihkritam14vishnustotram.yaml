id: devaihkritam14vishnustotram
category: stotram
name:
  english: devaihkritam14vishnustotram
  devanagari: देवैःकृतं१४विष्णुस्तोत्रम्
content:
  english: devaih kritam 14 vishnustotram deva ucuh | namaste yajnaviryaya vayase uta te namah | namaste
    hyastacakraya namah supuruhutaye || 31|| yatte gatinam tisrinamishituh paramam padam | narvacino visargasya
    dhatarveditumarhati || 32|| om namaste'stu bhagavan narayana vasudeva''dipurusha mahapurusha mahanubhava
    paramamangala paramakalyana paramakarunika kevala jagadadhara lokaikanatha sarveshvara lakshminatha
    paramahamsaparivrajakaih paramenatmayogasamadhina paribhavita
  devanagari: देवैः कृतं १४ विष्णुस्तोत्रम् देवा ऊचुः । नमस्ते यज्ञवीर्याय वयसे उत ते नमः । नमस्ते ह्यस्तचक्राय
    नमः सुपुरुहूतये ॥ ३१॥ यत्ते गतीनां तिसृणामीशितुः परमं पदम् । नार्वाचीनो विसर्गस्य धातर्वेदितुमर्हति
    ॥ ३२॥ ॐ नमस्तेऽस्तु भगवन् नारायण वासुदेवाऽऽदिपुरुष महापुरुष महानुभाव परममङ्गल परमकल्याण परमकारुणिक
    केवल जगदाधार लोकैकनाथ सर्वेश्वर लक्ष्मीनाथ परमहंसपरिव्राजकैः परमेणात्मयोगसमाधिना परिभावित
meaning: {}
