id: kalikakavacam-2-mahanirvanatantrantargatam-hrimadya-me-shirah-patu
category: kavacha
name:
  english: kalikakavacam 2 (mahanirvanatantrantargatam hrimadya me shirah patu)
  devanagari: कालिकाकवचम् २ (महानिर्वाणतन्त्रान्तर्गतम् ह्रीमाद्या मे शिरः पातु)
content:
  english: rinu sampratam || 1|| trailokyavijayasyasya kavacasya rishih shivah | chando'nushtubdevata
    ca adya kali prakirtita || 2|| mayabijam bijamiti rama shakttirudahrita | krim kilakam kamyasiddhau
    viniyogah prakirtitah || 3|| hrimadya me shirah patu shrim kali vadanam mama | hridayam krim para
    shakttih payatkantham paratpara || 4|| netre patu jagaddhatri karnau rakshatu shankari | ghranam patu
    mahamaya rasanam sarvamangala || 5|| dantan rakshatu kaumari kapolau kamalalaya | oshthadharau kshama
    raksheccibukam caruhasini || 6|| grivam payatkuleshani kakutpatu kripamayi | dvau bahu bahuda rakshetkarau
    kaivalyadayini || 7|| skandhau kapardini patu prishtham trailokyatarini | parshve payadaparna me katim
    me kamathasana || 8|| nabhau patu vishalakshi prajasthanam prabhavati | uru rakshatu kalyani padau
    me patu parvati || 9|| jayadurgavatu pranansarvangam sarvasidhdida | rakshahinam tu yatsthanam varjitam
    kavacena ca || 10|| tatsarvam me sada rakshedadya kali sanatani | iti te kathitam divyam trailokyavijayabhidham
    || 11|| kavacam kalikadevya adyayah paramadbhutam | pujakale pathetyastu adyadhikritamanasah || 12||
    iti mahanirvanatantre saptama ullase 55
  devanagari: ृणु साम्प्रतम् ॥ १॥ त्रैलोक्यविजयस्यास्य कवचस्य ऋषिः शिवः । छन्दोऽनुष्टुब्देवता च आद्या
    काली प्रकीर्तिता ॥ २॥ मायाबीजं बीजमिति रमा शक्त्तिरुदाहृता । क्रीं कीलकं काम्यसिद्धौ विनियोगः प्रकीर्तितः
    ॥ ३॥ ह्रीमाद्या मे शिरः पातु श्रीं काली वदनं मम । हृदयं क्रीं परा शक्त्तिः पायात्कण्ठं परात्परा ॥
    ४॥ नेत्रे पातु जगद्धात्री कर्णौ रक्षतु शङ्करी । घ्राणं पातु महामाया रसनां सर्वमङ्गला ॥ ५॥ दन्तान्
    रक्षतु कौमारी कपोलौ कमलालया । ओष्ठाधरौ क्षमा रक्षेच्चिबुकं चारुहासिनी ॥ ६॥ ग्रीवां पायात्कुलेशानी
    ककुत्पातु कृपामयी । द्वौ बाहू बाहुदा रक्षेत्करौ कैवल्यदायिनी ॥ ७॥ स्कन्धौ कपर्दिनी पातु पृष्ठं त्रैलोक्यतारिणी
    । पार्श्वे पायादपर्णा मे कटिं मे कमठासना ॥ ८॥ नाभौ पातु विशालाक्षी प्रजस्थानं प्रभावती । ऊरू रक्षतु
    कल्याणी पादौ मे पातु पार्वती ॥ ९॥ जयदुर्गावतु प्राणान्सर्वाङ्गं सर्वसिध्दिदा । रक्षाहीनं तु यत्स्थानं
    वर्जितं कवचेन च ॥ १०॥ तत्सर्वं मे सदा रक्षेदाद्या काली सनातनी । इति ते कथितं दिव्यं त्रैलोक्यविजयाभिधम्
    ॥ ११॥ कवचं कालिकादेव्या आद्यायाः परमाद्भुतम् । पूजाकाले पठेत्यस्तु आद्याधिकृतमानसः ॥ १२॥ इति महानिर्वाणतन्त्रे
    सप्तम उल्लासे ५५
