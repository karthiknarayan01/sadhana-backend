id: nrisimhagayatrimantrahnyasasahitam
category: mantra
name:
  english: nrisimhagayatrimantrahnyasasahitam
  devanagari: नृसिंहगायत्रीमन्त्रःन्याससहितम्
content:
  english: om ugranrisimhaya hridayaya namah || 1|| vidmahe shirase svaha || 2|| vajranakhaya shiravayai
    vashat || 3|| dhimahi kavacaya hum || 4|| tannonrisimhah netrabhyam vaushat || 4|| pracodayat astraya
    phat || iti anganyasah || om nri~ nri~ nri~ nrisimhaya namah iti gayatri mantrah || iti shrinrisimha
    gayatri mantrah nyasasahitam sampurnam |
  devanagari: ॐ उग्रनृसिंहाय हृदयाय नमः ॥ १॥ विद्महे शिरसे स्वाहा ॥ २॥ वज्रनखाय शिरवायै वषट् ॥ ३॥ धीमहि
    कवचाय हुम् ॥ ४॥ तन्नोनृसिंहः नेत्राभ्यां वौषट् ॥ ४॥ प्रचोदयात् अस्त्राय फट् ॥ इति अङ्गन्यासः ॥ ॐ नृँ
    नृँ नृँ नृसिंहाय नमः इति गायत्री मन्त्रः ॥ इति श्रीनृसिंह गायत्री मन्त्रः न्याससहितं सम्पूर्णम् ।
meaning: {}
