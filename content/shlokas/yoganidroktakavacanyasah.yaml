id: yoganidroktakavacanyasah
category: kavacha
name:
  english: yoganidroktakavacanyasah
  devanagari: योगनिद्रोक्तकवचन्यासः
content:
  english: yoganidroktakavacanyasah yoganidrovaca | duribhutam kuru bhayam bhayam kim te harau sthite
    | sthitayam mayi ca brahmansukhi tishtha jagatpate || 17|| shriharih patu te vaktram mastakam madhusudanah
    | shrikrishnashcakshushi patu nasikam radhikapatih || 18|| karnayugmam ca kantham ca kapalam patu
    madhavah | kapolam patu govindah keshamshca keshavah svayam || 19|| adharoshtham hrishikesho dantapanktim
    gadagrajah | raseshvarashca rasanam talukam vamano vibhuh || 20|| vakshah patu mukundashca jatharam
    patu daityaha | janardanah patu nabhim patu vishnushca mehanam || 21|| nitambayugmam guhyam ca patu
    te purushottamah | januyugme janakishah patu te sarvada vibhuh || 22|| hastayugmam nrisimhashca patu
    sarvatra sankate | padayugmam varahashca patu te kamalodbhavah || 23|| urdhvam narayanah patu hyadhastatkamalapatih
    | purvasyam patu gopalah patu vahnau dashasyaha || 24|| vanamali patu yamyam vaikunthah patu nairritau
    | varunyam vasudevashca sato rakshakarah svayam || 25|| patu te santatamajo vayavyam vishtarashravah
    | uttare ca sada patu tejasa jalajasanah || 26|| aishanyamishvarah patu patu sarvatra shatrujit |
    jale sthale cantarikshe nidrayam patu raghavah || 27|| ityevam kathitam brahmankavacam paramadbhutam
    | krishnena kripaya dattam smritenaiva pura maya || 28|| shumbhena saha sangrame nirlakshye ghoradarune
    | gagane sthitaya sadyah praptimatrena so jitah || 29|| kavacasya prabhavena dharanyam patito mritah
    | purvam varshashatam khe ca kritva yuddham bhayavaham || 30|| mrite shumbhe ca govindah kripalurgaganasthitah
    | malam ca kavacam dattva golokam sa jagama ha || 31|| kalpantarasya vrittantam kripaya kathitam mune
    | abhyantarabhayam nasti kavacasya prabhavatah || 32|| kotishah kotisho nashta maya drishtashca vedhasah
    | aham ca harina sarddham kalpe kalpe sthira sada || 33|| ityuktva kavacam dattva sa'ntardhanam cakara
    ha | nihshanko nabhikamale tasthau sa kamalodbhavah || 34|| suvarnagutikayam ca kritvedam kavacam
    param | kanthe va dakshine bahau badhniyadyah sudhih sada || 35|| vishagnijalashatrubhyo bhayam tasya
    na jayate | jale sthale cantarikshe nidrayam rakshatishvarah || 36|| sangrame vajrapate ca vipattau
    pranasankate | kavacasmaranadeva sadyo nihshankatam vrajet || 37|| baddhvedam kavacam kanthe shankarastripuram
    pura | jaghana lilamatrena durantamasureshvaram || 38|| baddhvedam kavacam kali raktabijam cakhada
    sa | sahasrashirsha dhritvedam vishvam dhatte tilam yatha || 39|| avam sanatkumarashca dharmasakshi
    ca karmanam | kavacasya prabhavena sarvatra jayino vayam || 40|| tasya nandashishoh kanthe cakara
    kavacam dvijah | atmanah kavacam kanthe dadhara ca svayam harih || 41|| prabhavah kathitah sarvah
    kavacasya harestatha | anantasyacyutasyaiva prabhavamatulam mune || 42|| iti shribrahmavaivarte mahapurane
    shrikrishnajanmakhande narayananaradasamvade yoganidroktakavacanyaso nama dvadasho'dhyayah || 12||
    brahmavaivartapurana | shrikrishnajanma
  devanagari: योगनिद्रोक्तकवचन्यासः योगनिद्रोवाच । दूरीभूतं कुरु भयं भयं किं ते हरौ स्थिते । स्थितायां
    मयि च ब्रह्मन्सुखी तिष्ठ जगत्पते ॥ १७॥ श्रीहरिः पातु ते वक्त्रं मस्तकं मधुसूदनः । श्रीकृष्णश्चक्षुषी
    पातु नासिकां राधिकापतिः ॥ १८॥ कर्णयुग्मं च कण्ठं च कपालं पातु माधवः । कपोलं पातु गोविन्दः केशांश्च
    केशवः स्वयम् ॥ १९॥ अधरोष्ठं हृषीकेशो दन्तपङ्क्तिं गदाग्रजः । रासेश्वरश्च रसनां तालुकं वामनो विभुः
    ॥ २०॥ वक्षः पातु मुकुन्दश्च जठरं पातु दैत्यहा । जनार्दनः पातु नाभिं पातु विष्णुश्च मेहनम् ॥ २१॥ नितम्बयुग्मं
    गुह्यं च पातु ते पुरुषोत्तमः । जानुयुग्मे जानकीशः पातु ते सर्वदा विभुः ॥ २२॥ हस्तयुग्मं नृसिंहश्च
    पातु सर्वत्र सङ्कटे । पादयुग्मं वराहश्च पातु ते कमलोद्भवः ॥ २३॥ ऊर्ध्वं नारायणः पातु ह्यधस्तात्कमलापतिः
    । पूर्वस्यां पातु गोपालः पातु वह्नौ दशास्यहा ॥ २४॥ वनमाली पातु याम्यां वैकुण्ठः पातु नैरृतौ । वारुण्यां
    वासुदेवश्च सतो रक्षाकरः स्वयम् ॥ २५॥ पातु ते सन्ततमजो वायव्यां विष्टरश्रवाः । उत्तरे च सदा पातु तेजसा
    जलजासनः ॥ २६॥ ऐशान्यामीश्वरः पातु पातु सर्वत्र शत्रुजित् । जले स्थले चान्तरिक्षे निद्रायां पातु राघवः
    ॥ २७॥ इत्येवं कथितं ब्रह्मन्कवचं परमाद्भुतम् । कृष्णेन कृपया दत्तं स्मृतेनैव पुरा मया ॥ २८॥ शुम्भेन
    सह सङ्ग्रामे निर्लक्ष्ये घोरदारुणे । गगने स्थितया सद्यः प्राप्तिमात्रेण सो जितः ॥ २९॥ कवचस्य प्रभावेण
    धरण्यां पतितो मृतः । पूर्वं वर्षशतं खे च कृत्वा युद्धं भयावहम् ॥ ३०॥ मृते शुम्भे च गोविन्दः कृपालुर्गगनस्थितः
    । मालां च कवचं दत्त्वा गोलोकं स जगाम ह ॥ ३१॥ कल्पान्तरस्य वृत्तान्तं कृपया कथितं मुने । अभ्यन्तरभयं
    नास्ति कवचस्य प्रभावतः ॥ ३२॥ कोटिशः कोटिशो नष्टा मया दृष्टाश्च वेधसः । अहं च हरिणा सार्द्धं कल्पे
    कल्पे स्थिरा सदा ॥ ३३॥ इत्युक्त्वा कवचं दत्त्वा साऽन्तर्धानं चकार ह । निःशङ्को नाभिकमले तस्थौ स कमलोद्भवः
    ॥ ३४॥ सुवर्णगुटिकायां च कृत्वेदं कवचं परम् । कण्ठे वा दक्षिणे बाहौ बध्नीयाद्यः सुधीः सदा ॥ ३५॥ विषाग्निजलशत्रुभ्यो
    भयं तस्य न जायते । जले स्थले चान्तरिक्षे निद्रायां रक्षतीश्वरः ॥ ३६॥ सङ्ग्रामे वज्रपाते च विपत्तौ
    प्राणसङ्कटे । कवचस्मरणादेव सद्यो निःशङ्कतां व्रजेत् ॥ ३७॥ बद्ध्वेदं कवचं कण्ठे शङ्करस्त्रिपुरं पुरा
    । जघान लीलामात्रेण दुरन्तमसुरेश्वरम् ॥ ३८॥ बद्ध्वेदं कवचं काली रक्तबीजं चखाद सा । सहस्रशीर्षा धृत्वेदं
    विश्वं धत्ते तिलं यथा ॥ ३९॥ आवां सनत्कुमारश्च धर्मसाक्षी च कर्मणाम् । कवचस्य प्रभावेण सर्वत्र जयिनो
    वयम् ॥ ४०॥ तस्य नन्दशिशोः कण्ठे चकार कवचं द्विजः । आत्मनः कवचं कण्ठे दधार च स्वयं हरिः ॥ ४१॥ प्रभावः
    कथितः सर्वः कवचस्य हरेस्तथा । अनन्तस्याच्युतस्यैव प्रभावमतुलं मुने ॥ ४२॥ इति श्रीब्रह्मवैवर्ते महापुराणे
    श्रीकृष्णजन्मखण्डे नारायणनारदसंवादे योगनिद्रोक्तकवचन्यासो नाम द्वादशोऽध्यायः ॥ १२॥ ब्रह्मवैवर्तपुराण
    । श्रीकृष्णजन्म
