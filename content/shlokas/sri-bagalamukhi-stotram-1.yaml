id: sri-bagalamukhi-stotram-1
category: stotram
name:
  english: Sri Bagalamukhi Stotram - 1
content:
  english: om asya shribagalamukhistotrasya naradrishih shri bagalamukhi devata mama sannihitanam virodhinam
    vanmukha padabuddhinam stambhanarthe stotrapathe viniyogah madhyesudhabdhi manimantapa ratnavedi simhasanoparigatam
    paripitavarnam | pitambarabharana malyavibhushitangim devim bhajami dhritamudgaravairi jihvam || ||
    jihvagramadaya karena devim vamena shatrun paripidayantim | gadabhighatena ca dakshinena pitambaradhyam
    dvibhujam bhajami || || calatkanakakundalollasitacarugandasthalam lasatkanakacampaka dyutimadindubimbananam
    | gadahata vipakshakam kalitalolajihvancalam smarami bagalamukhim vimukhavanmanasstambhinim || ||
    piyusho dadhimadhyacaru vilasa draktotpale mantape satsimhasana maulipatitaripum pretasanadhyasinim
    | svarnabham karapiditarirasanam bhramyadgadam vibhramam ittham dhyayati yanti tasya vilayam sadyotha
    sarvapadah || || devittvaccaranambujarcanakrite yah pita pushpanjalin bhaktya vamakare nidhaya ca
    manum mantri manojnaksharam | pithadhyanaparo'tha kumbhakavashadbijam smaretparthiva stasyamitramukhasya
    vaci hridaye jadyam bhavettat || vadi mukati kankati kshitipatirvaishvanarashshititi krodhishamyati
    durjanassujanati kshipranugah khanjati | garvi kharvati sarvavicca jadati tvadyantrana yantritah shrinitye
    bagalamukhi pratidinam kalyani tubhyam namah || || mantrastavadayam vipakshadalane stotram pavitram
    ca te yantram vadiniyantranam trijagatam jaitram ca citram ca te | matah shribagaleti nama lalitam
    yasyasti jantormukhe tvannamagrahanena samsadi mukha stambho bhavedvadinam || || dushtastambhanamugravighnashamanam
    daridryavidravanam bhubhridbhishamanam calanmrigadrisham cetassamakarshanam | saubhagyaikaniketanam
    samadrishah karunyapurnamritam mrityormaranamavirastu purato matastvadiyam vapuh || || matarbhanjaya
    me vipakshavadanam jihvam ca sankilaya brahmim mudraya nashayashudhishanamugram gatim stambhaya |
    shatrumshcurnaya devi tikshnagadaya gaurangi pitambare vighnaugham bagale hara pranamatam karunyapurnekshane
    || || matarbhairavi bhadrakali vijaye varahi vishvashraye shrividye samaye maheshi bagale kameshi
    rame rame | matangi tripure paratparatare svargapavargaprade daso'ham sharanagatah karunaya vishveshvari
    trahimam || || samrambhe saurasanghe praharanasamaye bandhanevarimadhye vidyavadevivade pratikritinripatau
    divyakale nishayam | vashye va stambhane va ripuvadhasamaye nirjane va vane va gacchamstishthamstrikalam
    yadi pathati shivam prapnuyadashu dhirah || || tvam vidya parama trilokajanani vighnaughasanchedini
    yoshakarshanakarini trijagatamanandasamvardhini | dusphotoccatanakarini janamanassammohasandayini
    jihvakilanabhairavi vijayate brahmastramantro yatha || || vidyalakshmissarvasaubhagyamayuh putraih
    pautraih sarvasamrajyasiddhih | mano bhogo vashyamarogyasaukhyam praptam tattadbhutale'sminnarena
    || || yatkritam ca japam homam gaditam parameshvari | dushtanam nigraharthaya tadgrihana namo'stu
    te || || pitambaram tam dvibhujam trinetram gatragojjvalam | shilamudgarahastam ca smarettam bagalamukhim
    || || brahmastramiti vikhyatam trishu lokeshu vishrutam | gurubhaktaya datavyam nadeyam yasya kasyacit
    || || nityam stotramidam pavitramiha yo devyah pathatyadarat dhritvayantramidam tathaiva samare bahau
    kare va gale | rajano'pyarayo madandhakarinassarpa mrigendradikah te vai yanti vimohita ripugana lakshmih
    sthirassiddhayah || || iti shri rudrayamale tantre shri bagalamukhi stotram ||
  devanagari: ॐ अस्य श्रीबगलामुखीस्तोत्रस्य नारदृषिः श्री बगलामुखी देवता मम सन्निहितानां विरोधिनां वाङ्मुख
    पदबुद्धीनां स्तम्भनार्थे स्तोत्रपाठे विनियोगः मध्येसुधाब्धि मणिमण्टप रत्नवेदि सिंहासनोपरिगतां परिपीतवर्णाम्
    । पीताम्बराभरण माल्यविभूषिताङ्गीं देवीं भजामि धृतमुद्गरवैरि जिह्वाम् ॥ ॥ जिह्वाग्रमादाय करेण देवीं
    वामेन शत्रून् परिपीडयन्तीम् । गदाभिघातेन च दक्षिणेन पीताम्बराढ्यां द्विभुजां भजामि ॥ ॥ चलत्कनककुण्डलोल्लसितचारुगण्डस्थलां
    लसत्कनकचम्पक द्युतिमदिन्दुबिम्बाननाम् । गदाहत विपक्षकां कलितलोलजिह्वाञ्चलां स्मरामि बगलामुखीं विमुखवाङ्मनस्स्तम्भिनीम्
    ॥ ॥ पीयूषो दधिमध्यचारु विलस द्रक्तोत्पले मण्टपे सत्सिंहासन मौलिपातितरिपुं प्रेतासनाध्यासिनीम् । स्वर्णाभां
    करपीडितारिरसनां भ्राम्यद्गदां विभ्रमां इत्थं ध्यायति यान्ति तस्य विलयं सद्योथ सर्वापदः ॥ ॥ देवित्त्वच्चरणाम्बुजार्चनकृते
    यः पीत पुष्पाञ्जलीन् भक्त्या वामकरे निधाय च मनुं मन्त्री मनोज्ञाक्षरम् । पीठध्यानपरोऽथ कुम्भकवशाद्बीजं
    स्मरेत्पार्थिव स्तस्यामित्रमुखस्य वाचि हृदये जाड्यं भवेत्तत् ॥ वादी मूकति कङ्कति क्षितिपतिर्वैश्वानरश्शीतिति
    क्रोधीशाम्यति दुर्जनस्सुजनति क्षिप्रानुगः खञ्जति । गर्वी खर्वति सर्वविच्च जडति त्वद्यन्त्रणा यन्त्रितः
    श्रीनित्ये बगलामुखि प्रतिदिनं कल्याणि तुभ्यं नमः ॥ ॥ मन्त्रस्तावदयं विपक्षदलने स्तोत्रं पवित्रं च
    ते यन्त्रं वादिनियन्त्रणं त्रिजगतां जैत्रं च चित्रं च ते । मातः श्रीबगलेति नाम ललितं यस्यास्ति जन्तोर्मुखे
    त्वन्नामग्रहणेन संसदि मुख स्तम्भो भवेद्वादिनाम् ॥ ॥ दुष्टस्तम्भनमुग्रविघ्नशमनं दारिद्र्यविद्रावणं
    भूभृद्भीशमनं चलन्मृगदृशां चेतस्समाकर्षणम् । सौभाग्यैकनिकेतनं समदृशः कारुण्यपूर्णामृतं मृत्योर्मारणमाविरस्तु
    पुरतो मातस्त्वदीयं वपुः ॥ ॥ मातर्भञ्जय मे विपक्षवदनां जिह्वां च सङ्कीलय ब्राह्मीं मुद्रय नाशयाशुधिषणामुग्रां
    गतिं स्तम्भय । शत्रूंश्चूर्णय देवि तीक्ष्णगदया गौराङ्गि पीताम्बरे विघ्नौघं बगले हर प्रणमतां कारुण्यपूर्णेक्षणे
    ॥ ॥ मातर्भैरवि भद्रकालि विजये वाराहि विश्वाश्रये श्रीविद्ये समये महेशि बगले कामेशि रामे रमे । मातङ्गि
    त्रिपुरे परात्परतरे स्वर्गापवर्गप्रदे दासोऽहं शरणागतः करुणया विश्वेश्वरि त्राहिमाम् ॥ ॥ संरम्भे सौरसङ्घे
    प्रहरणसमये बन्धनेवारिमध्ये विद्यावादेविवादे प्रतिकृतिनृपतौ दिव्यकाले निशायाम् । वश्ये वा स्तम्भने
    वा रिपुवधसमये निर्जने वा वने वा गच्छंस्तिष्ठंस्त्रिकालं यदि पठति शिवं प्राप्नुयादाशु धीरः ॥ ॥ त्वं
    विद्या परमा त्रिलोकजननी विघ्नौघसञ्छेदिनी योषाकर्षणकारिणी त्रिजगतामानन्दसंवर्धिनी । दुस्फोटोच्चाटनकारिणी
    जनमनस्सम्मोहसन्दायिनी जिह्वाकीलनभैरवी विजयते ब्रह्मास्त्रमन्त्रो यथा ॥ ॥ विद्यालक्ष्मीस्सर्वसौभाग्यमायुः
    पुत्रैः पौत्रैः सर्वसाम्राज्यसिद्धिः । मानो भोगो वश्यमारोग्यसौख्यं प्राप्तं तत्तद्भूतलेऽस्मिन्नरेण
    ॥ ॥ यत्कृतं च जपं होमं गदितं परमेश्वरी । दुष्टानां निग्रहार्थाय तद्गृहाण नमोऽस्तु ते ॥ ॥ पीताम्बरां
    तां द्विभुजां त्रिनेत्रां गात्रगोज्ज्वलाम् । शिलामुद्गरहस्तां च स्मरेत्तां बगलामुखीम् ॥ ॥ ब्रह्मास्त्रमिति
    विख्यातं त्रिषु लोकेषु विश्रुतम् । गुरुभक्ताय दातव्यं नदेयं यस्य कस्यचित् ॥ ॥ नित्यं स्तोत्रमिदं पवित्रमिह
    यो देव्याः पठत्यादरात् धृत्वायन्त्रमिदं तथैव समरे बाहौ करे वा गले । राजानोऽप्यरयो मदान्धकरिणस्सर्पा
    मृगेन्द्रादिकाः ते वै यान्ति विमोहिता रिपुगणा लक्ष्मीः स्थिरास्सिद्धयः ॥ ॥ इति श्री रुद्रयामले तन्त्रे
    श्री बगलामुखी स्तोत्रम् ॥
