id: sri-shankaracharya-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Shankaracharya Ashtottara Sata Namavali
content:
  english: dhyanam | kailasacala madhyastham kamitabhishtadayakam | brahmadiprarthanapraptadivyamanushavigraham
    || bhaktanugrahanaikantashantasvantasamujjvalam | samyajnam samyamindranam sarvabhaumam jagadgurum
    || kinkaribhutabhaktainah pankajatavishoshanam | dhyayami shankaracaryam sarvalokaikashankaram ||
    om shrishankaracaryavaryaya namah | om brahmanandapradayakaya namah | om ajnanatimiradityaya namah
    | om sujnanambudhicandramase namah | om varnashramapratishthatre namah | om shrimate namah | om muktipradayakaya
    namah | om shishyopadeshanirataya namah | om bhaktabhishtapradayakaya namah | om sukshmatattvarahasyajnaya
    namah || || om karyakaryaprabodhakaya namah | om jnanamudrancitakaraya namah | om shishyahrittapaharakaya
    namah | om parivrajashramoddhartre namah | om sarvatantrasvatantradhiye namah | om advaitasthapanacaryaya
    namah | om sakshacchankararupadhrite namah | om shanmatasthapanacaryaya namah | om trayimargaprakashakaya
    namah | om vedavedantatattvajnaya namah || || om durvadimatakhandanaya namah | om vairagyanirataya
    namah | om shantaya namah | om samsararnavatarakaya namah | om prasannavadanambhojaya namah | om paramarthaprakashakaya
    namah | om puranasmritisarajnaya namah | om nityatriptaya namah | om mahate namah | om shucaye namah
    || || om nityanandaya namah | om niratankaya namah | om nissangaya namah | om nirmalatmakaya namah
    | om nirmamaya namah | om nirahankaraya namah | om vishvavandyapadambujaya namah | om sattvapradhanaya
    namah | om sadbhavaya namah | om sankhyatitagunojvalaya namah || || om anaghaya namah | om sarahridayaya
    namah | om sudhiye namah | om sarasvatapradaya namah | om satyatmane namah | om punyashilaya namah
    | om sankhyayogavicakshanaya namah | om taporashaye namah | om mahatejase namah | om gunatrayavibhagavide
    namah || || om kalighnaya namah | om kalakarmajnaya namah | om tamogunanivarakaya namah | om bhagavate
    namah | om bharatijetre namah | om sharadahvanapanditaya namah | om dharmadharmavibhagajnaya namah
    | om lakshyabhedapradarshakaya namah | om nadabindukalabhijnaya namah | om yogihritpadmabhaskaraya
    namah || || om atindriyajnananidhaye namah | om nityanityavivekavate namah | om cidanandaya namah
    | om cinmayatmane namah | om parakayapraveshakrite namah | om amanushacaritradhyaya namah | om kshemadayine
    namah | om kshamakaraya namah | om bhavyaya namah | om bhadrapradaya namah || || om bhurimahimne namah
    | om vishvaranjakaya namah | om svaprakashaya namah | om sadadharaya namah | om vishvabandhave namah
    | om shubhodayaya namah | om vishalakirtaye namah | om vagishaya namah | om sarvalokahitotsukaya namah
    | om kailasayatrasampraptacandramauliprapujakaya namah || || om kancyam shricakrarajakhyayantrasthapanadikshitaya
    namah | om shricakratmakatatankatoshitambamanorathaya namah | om shribrahmasutropanishadbhashyadigranthakalpakaya
    namah | om caturdikcaturamnaya pratishthatre namah | om mahamataye namah | om dvisaptatimatoccetre
    namah | om sarvadigvijayaprabhave namah | om kashayavasanopetaya namah | om bhasmoddhulitavigrahaya
    namah | om jnanatmakaikadandadhyaya namah || || om kamandalulasatkaraya namah | om gurubhumandalacaryaya
    namah | om bhagavatpadasanjnakaya namah | om vyasasandarshanapritaya namah | om rishyashringapureshvaraya
    namah | om saundaryalaharimukhyabahustotravidhayakaya namah | om catushshashtikalabhijnaya namah |
    om brahmarakshasamokshadaya namah | om shrimanmandanamishrakhyasvayambhujayasannutaya namah | om totakacaryasampujyaya
    namah || || om padmapadarcitanghrikaya namah | om hastamalakayogindra brahmajnanapradayakaya namah
    | om sureshvarakhyasaccishyasannyasashramadayakaya namah | om nrisimhabhaktaya namah | om sadratnagarbhaherambapujakaya
    namah | om vyakhyasimhasanadhishaya namah | om jagatpujyaya namah | om jagadgurave namah ||
  devanagari: ध्यानम् । कैलासाचल मध्यस्थं कामिताभीष्टदायकम् । ब्रह्मादिप्रार्थनाप्राप्तदिव्यमानुषविग्रहम्
    ॥ भक्तानुग्रहणैकान्तशान्तस्वान्तसमुज्ज्वलम् । संयज्ञं संयमीन्द्राणां सार्वभौमं जगद्गुरुम् ॥ किङ्करीभूतभक्तैनः
    पङ्कजातविशोषणम् । ध्यायामि शङ्कराचार्यं सर्वलोकैकशङ्करम् ॥ ॐ श्रीशङ्कराचार्यवर्याय नमः । ॐ ब्रह्मानन्दप्रदायकाय
    नमः । ॐ अज्ञानतिमिरादित्याय नमः । ॐ सुज्ञानाम्बुधिचन्द्रमसे नमः । ॐ वर्णाश्रमप्रतिष्ठात्रे नमः । ॐ
    श्रीमते नमः । ॐ मुक्तिप्रदायकाय नमः । ॐ शिष्योपदेशनिरताय नमः । ॐ भक्ताभीष्टप्रदायकाय नमः । ॐ सूक्ष्मतत्त्वरहस्यज्ञाय
    नमः ॥ ॥ ॐ कार्याकार्यप्रबोधकाय नमः । ॐ ज्ञानमुद्राञ्चितकराय नमः । ॐ शिष्यहृत्तापहारकाय नमः । ॐ परिव्राजाश्रमोद्धर्त्रे
    नमः । ॐ सर्वतन्त्रस्वतन्त्रधिये नमः । ॐ अद्वैतस्थापनाचार्याय नमः । ॐ साक्षाच्छङ्कररूपधृते नमः । ॐ
    षण्मतस्थापनाचार्याय नमः । ॐ त्रयीमार्गप्रकाशकाय नमः । ॐ वेदवेदान्ततत्त्वज्ञाय नमः ॥ ॥ ॐ दुर्वादिमतखण्डनाय
    नमः । ॐ वैराग्यनिरताय नमः । ॐ शान्ताय नमः । ॐ संसारार्णवतारकाय नमः । ॐ प्रसन्नवदनाम्भोजाय नमः । ॐ
    परमार्थप्रकाशकाय नमः । ॐ पुराणस्मृतिसारज्ञाय नमः । ॐ नित्यतृप्ताय नमः । ॐ महते नमः । ॐ शुचये नमः ॥
    ॥ ॐ नित्यानन्दाय नमः । ॐ निरातङ्काय नमः । ॐ निस्सङ्गाय नमः । ॐ निर्मलात्मकाय नमः । ॐ निर्ममाय नमः
    । ॐ निरहङ्काराय नमः । ॐ विश्ववन्द्यपदाम्बुजाय नमः । ॐ सत्त्वप्रधानाय नमः । ॐ सद्भावाय नमः । ॐ सङ्ख्यातीतगुणोज्वलाय
    नमः ॥ ॥ ॐ अनघाय नमः । ॐ सारहृदयाय नमः । ॐ सुधिये नमः । ॐ सारस्वतप्रदाय नमः । ॐ सत्यात्मने नमः । ॐ
    पुण्यशीलाय नमः । ॐ साङ्ख्ययोगविचक्षणाय नमः । ॐ तपोराशये नमः । ॐ महातेजसे नमः । ॐ गुणत्रयविभागविदे
    नमः ॥ ॥ ॐ कलिघ्नाय नमः । ॐ कालकर्मज्ञाय नमः । ॐ तमोगुणनिवारकाय नमः । ॐ भगवते नमः । ॐ भारतीजेत्रे नमः
    । ॐ शारदाह्वानपण्डिताय नमः । ॐ धर्माधर्मविभागज्ञाय नमः । ॐ लक्ष्यभेदप्रदर्शकाय नमः । ॐ नादबिन्दुकलाभिज्ञाय
    नमः । ॐ योगिहृत्पद्मभास्कराय नमः ॥ ॥ ॐ अतीन्द्रियज्ञाननिधये नमः । ॐ नित्यानित्यविवेकवते नमः । ॐ चिदानन्दाय
    नमः । ॐ चिन्मयात्मने नमः । ॐ परकायप्रवेशकृते नमः । ॐ अमानुषचरित्राढ्याय नमः । ॐ क्षेमदायिने नमः ।
    ॐ क्षमाकराय नमः । ॐ भव्याय नमः । ॐ भद्रप्रदाय नमः ॥ ॥ ॐ भूरिमहिम्ने नमः । ॐ विश्वरञ्जकाय नमः । ॐ स्वप्रकाशाय
    नमः । ॐ सदाधाराय नमः । ॐ विश्वबन्धवे नमः । ॐ शुभोदयाय नमः । ॐ विशालकीर्तये नमः । ॐ वागीशाय नमः । ॐ
    सर्वलोकहितोत्सुकाय नमः । ॐ कैलासयात्रासम्प्राप्तचन्द्रमौलिप्रपूजकाय नमः ॥ ॥ ॐ काञ्च्यां श्रीचक्रराजाख्ययन्त्रस्थापनदीक्षिताय
    नमः । ॐ श्रीचक्रात्मकताटङ्कतोषिताम्बामनोरथाय नमः । ॐ श्रीब्रह्मसूत्रोपनिषद्भाष्यादिग्रन्थकल्पकाय नमः
    । ॐ चतुर्दिक्चतुराम्नाय प्रतिष्ठात्रे नमः । ॐ महामतये नमः । ॐ द्विसप्ततिमतोच्चेत्रे नमः । ॐ सर्वदिग्विजयप्रभवे
    नमः । ॐ काषायवसनोपेताय नमः । ॐ भस्मोद्धूलितविग्रहाय नमः । ॐ ज्ञानात्मकैकदण्डाढ्याय नमः ॥ ॥ ॐ कमण्डलुलसत्कराय
    नमः । ॐ गुरुभूमण्डलाचार्याय नमः । ॐ भगवत्पादसञ्ज्ञकाय नमः । ॐ व्याससन्दर्शनप्रीताय नमः । ॐ ऋष्यशृङ्गपुरेश्वराय
    नमः । ॐ सौन्दर्यलहरीमुख्यबहुस्तोत्रविधायकाय नमः । ॐ चतुष्षष्टिकलाभिज्ञाय नमः । ॐ ब्रह्मराक्षसमोक्षदाय
    नमः । ॐ श्रीमन्मण्डनमिश्राख्यस्वयम्भूजयसन्नुताय नमः । ॐ तोटकाचार्यसम्पूज्याय नमः ॥ ॥ ॐ पद्मपादार्चिताङ्घ्रिकाय
    नमः । ॐ हस्तामलकयोगीन्द्र ब्रह्मज्ञानप्रदायकाय नमः । ॐ सुरेश्वराख्यसच्चिष्यसन्न्यासाश्रमदायकाय नमः
    । ॐ नृसिंहभक्ताय नमः । ॐ सद्रत्नगर्भहेरम्बपूजकाय नमः । ॐ व्याख्यासिंहासनाधीशाय नमः । ॐ जगत्पूज्याय
    नमः । ॐ जगद्गुरवे नमः ॥
