id: brahmadidevaihkritamramanathastotram
category: stotram
name:
  english: brahmadidevaihkritamramanathastotram
  devanagari: ब्रह्मादिदेवैःकृतंरामनाथस्तोत्रम्
content:
  english: 50|| yama uvaca | putrau ganeshvaraskandau vrisho yasya ca vahanam | tam vai rameshvaram seve
    sarvajnananivrittaye || 51|| varuna uvaca | yasya pujaprabhavena jitamrityurmrikandujah | mrityunjayamupase'ham
    ramanatham hrida tu tam || 52|| kubera uvaca | ishvaraya lasatkarnakundalabharanaya te | laksharunashariraya
    namo rameshvaraya vai || 53|| aditya uvaca | namaste'stu mahadeva ramanatha triyambaka | dakshadhvaravinashaya
    namaste pahi mam shiva || 54|| soma uvaca | namaste bhasmadigdhaya shuline sarpamaline | ramanatha
    dayambhodhe smashananilayaya te || 55|| agniruvaca | indradyakhiladikpalasamsevitapadambuja | ramanathaya
    shuddhaya namo digvasase sada || 56|| vayuruvaca | haraya harirupaya vyaghracarmambaraya ca | ramanatha
    namastubhyam mamabhishtaprado bhava || 57|| brihaspatiruvaca | ahantasakshine nityam pratyagadvayavastune
    | ramanatha mamajnanamashu nashaya te namah || 58|| shukra uvaca | vancakanamalabhyaya mahamantrartharupine
    | namo dvaitavihinaya ramanathaya shambhave || 59|| ashvinavucatuh | atmarupataya nityam yoginam bhasate
    hridi | ananyabhanavedyaya namaste raghaveshvara || 1
  devanagari: ५०॥ यम उवाच । पुत्रौ गणेश्वरस्कन्दौ वृषो यस्य च वाहनम् । तं वै रामेश्वरं सेवे सर्वाज्ञाननिवृत्तये
    ॥ ५१॥ वरुण उवाच । यस्य पूजाप्रभावेन जितमृत्युर्मृकण्डुजः । मृत्युञ्जयमुपासेऽहं रामनाथं हृदा तु तम्
    ॥ ५२॥ कुबेर उवाच । ईश्वराय लसत्कर्णकुण्डलाभरणाय ते । लाक्षारुणशरीराय नमो रामेश्वराय वै ॥ ५३॥ आदित्य
    उवाच । नमस्तेऽस्तु महादेव रामनाथ त्रियम्बक । दक्षाध्वरविनाशाय नमस्ते पाहि मां शिव ॥ ५४॥ सोम उवाच ।
    नमस्ते भस्मदिग्धाय शूलिने सर्पमालिने । रामनाथ दयाम्भोधे स्मशाननिलयाय ते ॥ ५५॥ अग्निरुवाच । इन्द्राद्यखिलदिक्पालसंसेवितपदाम्बुज
    । रामनाथाय शुद्धाय नमो दिग्वाससे सदा ॥ ५६॥ वायुरुवाच । हराय हरिरूपाय व्याघ्रचर्माम्बराय च । रामनाथ
    नमस्तुभ्यं ममाभीष्टप्रदो भव ॥ ५७॥ बृहस्पतिरुवाच । अहन्तासाक्षिणे नित्यं प्रत्यगद्वयवस्तुने । रामनाथ
    ममाज्ञानमाशु नाशय ते नमः ॥ ५८॥ शुक्र उवाच । वञ्चकानामलभ्याय महामन्त्रार्थरूपिणे । नमो द्वैतविहीनाय
    रामनाथाय शम्भवे ॥ ५९॥ अश्विनावूचतुः । आत्मरूपतया नित्यं योगिनां भासते हृदि । अनन्यभानवेद्याय नमस्ते
    राघवेश्वर ॥ १
