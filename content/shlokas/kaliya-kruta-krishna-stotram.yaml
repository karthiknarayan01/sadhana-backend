id: kaliya-kruta-krishna-stotram
category: stotram
name:
  english: Kaliya Kruta Krishna Stotram
content:
  english: vyasa uvaca | ityukte tabhirashvasya klantadeho'pi pannagah | prasida devadeveti praha vakyam
    shanaih shanaih || || kaliya uvaca | tavashtagunamaishvaryam natha svabhavikam param | nirastatishayam
    yasya tasya stoshyami kinvaham || || tvam parastvam parasya'dyah param tvam tatparatmakam | parasmatparamo
    yastvam tasya stoshyami kim nvaham || || yatha'ham bhavata srishto jatya rupena ceshvarah | svabhavena
    ca samyuktastathedam ceshtitam maya || || yadyanyatha pravarteya devadeva tato mayi | nyayyo dandanipataste
    tavaiva vacanam yatha || || tatha'pi yam jagatsvami dandam patitavanmayi | sa sodho'yam varo dandastvatto
    nanyo'stu me varah || || hataviryo hatavisho damito'ham tvaya'cyuta | jivitam diyatamekamajnapaya
    karomi kim || || iti brahmapurane pancashityadhikashatatamadhyayantargatam kaliyakritam shrikrishnastotram
    samaptam | brahmapurana
  devanagari: व्यास उवाच । इत्युक्ते ताभिराश्वास्य क्लान्तदेहोऽपि पन्नगः । प्रसीद देवदेवेति प्राह वाक्यं
    शनैः शनैः ॥ ॥ कालीय उवाच । तवाष्टगुणमैश्वर्यं नाथ स्वाभविकं परम् । निरस्तातिशयं यस्य तस्य स्तोष्यामि
    किन्वहम् ॥ ॥ त्वं परस्त्वं परस्याऽद्यः परं त्वं तत्परात्मकम् । परस्मात्परमो यस्त्वं तस्य स्तोष्यामि
    किं न्वहम् ॥ ॥ यथाऽहं भवता सृष्टो जात्या रूपेण चेश्वरः । स्वभावेन च संयुक्तस्तथेदं चेष्टितं मया ॥
    ॥ यद्यन्यथा प्रवर्तेय देवदेव ततो मयि । न्याय्यो दण्डनिपातस्ते तवैव वचनं यथा ॥ ॥ तथाऽपि यं जगत्स्वामी
    दण्डं पातितवान्मयि । स सोढोऽयं वरो दण्डस्त्वत्तो नान्योऽस्तु मे वरः ॥ ॥ हतवीर्यो हतविषो दमितोऽहं त्वयाऽच्युत
    । जीवितं दीयतामेकमाज्ञापय करोमि किम् ॥ ॥ इति ब्रह्मपुराणे पञ्चाशीत्यधिकशततमाध्यायान्तर्गतं कालियकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मपुराण
