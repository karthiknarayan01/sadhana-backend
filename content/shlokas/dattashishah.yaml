id: dattashishah
category: stotram
name:
  english: dattashishah
  devanagari: दत्ताशिषः
content:
  english: ramo lokabhiramo janakritajapato bhaktitah suprasannah bhutvedam vishvamevam hyavatu nishi
    diva poshayan vedadharmam | bhaktim bhuktim ca datva sukritimapi tatha sanmatim shantacetah atmajnanam
    svanishtham svaparahitabhritam jivanam muktimevam || 1|| brahmeshanadirupairjayatu bhavaharo janakiprananathah
    dhiro viro hanuman jayatu gururaho ramadaso yamindrah | vedo yo vishvaseturjayatu bhayaharo vishvamokshaikahetuh
    shanto dantashca tripto jayatu munigano jnanavijnanapurnah || 2|| rashtram ca yuyam sakalajagati bho
    brahmana brahmanishthah svadhyayasaktacitta viratimatiyuta bhaktinamra gunadhyah | gam devam vedamevam
    gurumapi ca tatha sarvada sevamanah shudhdah shreshthashca shantah shrutiyutakritibhih prinayantotra
    vishvam || 3|| bhuyaddharmapravrittam jagadidamanisham sarvada bhaktinamram nandetsarvatra sarvam
    viratimatiyutam karmabhih pavanaishca | bho bho viprashca yushmatsukritibharavashanmangalam sarvatah
    syat sarvesham jivanam tatkalimalarahitam svatmanishtham sudivyam || 4|| iti shrimat paramahamsaparivrajakacarya
    sadguru bhagavana shridharasvamimaharajaviracitah dattashishah sampurnah |
  devanagari: रामो लोकाभिरामो जनकृतजपतो भक्तितः सुप्रसन्नः भूत्वेदं विश्वमेवं ह्यवतु निशि दिवा पोषयन्
    वेदधर्मम् । भक्तिं भुक्तिं च दत्वा सुकृतिमपि तथा सन्मतिं शान्तचेताः आत्मज्ञानं स्वनिष्ठां स्वपरहितभृतं
    जीवनं मुक्तिमेवम् ॥ १॥ ब्रह्मेशानादिरूपैर्जयतु भवहरो जानकीप्राणनाथः धीरो वीरो हनुमान् जयतु गुरूरहो
    रामदासो यमिन्द्रः । वेदो यो विश्वसेतुर्जयतु भयहरो विश्वमोक्षैकहेतुः शान्तो दान्तश्च तृप्तो जयतु मुनिगणो
    ज्ञानविज्ञानपूर्णः ॥ २॥ राष्ट्रं च यूयं सकलजगति भो ब्राह्मणा ब्रह्मनिष्ठाः स्वाध्यायासक्तचित्ता विरतिमतियुता
    भक्तिनम्रा गुणाढ्याः । गां देवं वेदमेवं गुरूमपि च तथा सर्वदा सेवमानाः शुध्दाः श्रेष्ठाश्च शान्ताः
    श्रुतियुतकृतिभिः प्रीणयन्तोत्र विश्वम् ॥ ३॥ भूयाद्धर्मप्रवृत्तं जगदिदमनिशं सर्वदा भक्तिनम्रं नन्देत्सर्वत्र
    सर्वं विरतिमतियुतं कर्मभिः पावनैश्च । भो भो विप्राश्च युष्मत्सुकृतिभरवशान्मङ्गलं सर्वतः स्यात् सर्वेषां
    जीवनं तत्कलिमलरहितं स्वात्मनिष्ठं सुदिव्यम् ॥ ४॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितः
    दत्ताशिषः सम्पूर्णः ।
