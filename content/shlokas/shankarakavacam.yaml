id: shankarakavacam
category: kavacha
name:
  english: shankarakavacam
  devanagari: शन्करकवचम्
content:
  english: rinvatam sadyo muktih syadanapayini | brahmacari kritasnanah shuklavasa jitendriyah || 28||
    bhasmadhari munirmauni padmasanasamanvitah | dhyatva mam sakaladhisham nirakaram nirishvaram || 29||
    parvatisahitam shambhum jatamakutamanditam | vasanam carma vaiyaghram candrardhakritashekharam ||
    30|| tryambakam vrishabharudham krittivasasamujjvalam | surarcitapadadvandvam divyabhogam susundaram
    || 31|| bibhranam suprasannam ca kutharavaradabhayam | durantam kamalasinam nagayajnopavitinam ||
    32|| vishvakayam cidanandam shuddhamaksharamavyayam | sahasrashirasam shambhumanantakarasamyutam ||
    33|| sahasracaranam divyam somasuryagnilocanam | jagadyonimajam brahma shivamadyam sanatanam || 34||
    damshtrakaralam dushpreksham suryakotisamaprabham | nishakarakarakaram bheshajam bhavaroginam || 35||
    pinakinam vishalaksham pashunam patimishvaram | kalatmanam kalakalam devadevam maheshvaram || 36||
    jnanavairagyasampannam nityanandamayam param | shashvataishvaryasampurnam mahayogishvareshvaram ||
    37|| samastashaktisampannam punyakayam durasadam | tarakam brahma sampurnamaniyamsam mahattaram ||
    38|| yatinam paramam brahma yatinam tapasah phalam | samyamihritsamasinam tapasvijanasamvritam ||
    39|| vidhindravishnunamitam munisiddhanishevitam | mahadevam mahanandam devanamapi daivatam || 40||
    shantam pavitramonkaram jyotisham jyotiruttamam | shankaro me shirah patu lalatam bhalalocanah ||
    41|| vishvacakshurdrishau patu rudrah patu bhruvau mama | gandau patu maheshanah shruti rakshatu purvajah
    || 42|| kapolau me mahadevah patu nasam sadashivah | mukham patu havirbhokta oshthau patu maheshvarah
    || 43|| dantan rakshatu deveshastalu somakaladharah | rasanam paramanandah patu shankhau shivapriyah
    || 44|| cubukam patu me shambhuh shmashrum shatruvinashanah | kucam patu bhavah kantham nilakantho'vatu
    dhruvam || 45|| skandhau skandapatih patu bahu patu mahabhujah | upabahu mahaviryah karau vibudhasattamah
    || 46|| angulih patu pancasyah parvani ca sahasrapat | hridayam patu sarvatma stanau patu pitamahah
    || 45|| udaram hutabhuk patu madhyam me madhyameshvarah | kukshim patu bhavanishah prishtham patu
    kuleshvarah || 48|| pranan me pranadah patu nabhim bhimah katim vibhuh | sakthini patu me bhargo januni
    janatadhipah || 49|| janghe puraripuh patu caranau bhavanashanah | shariram patu me sharvo bahyamabhyantaram
    shivah || 50|| indriyani harah patu sarvatra jayavardhanah | purve dishi mridah patu dakshine yamasudanah
    || 51|| varunyam saliladhisha udicyam me mahidharah | aishanyam patu bhutesha agneyyam ravilocanah
    || 52|| nairrityam bhutabhrit patu vayavyam balavardhanah | urdhvam patu makhadveshi hyadhah samsaranashanah
    || 53|| sarvatah sukhadah patu buddhim patu sulocanah | evam nyasadikam kritva sakshacchambhumayo
    bhavet || 54|| namo hiranyabahvadi pathenmantram tu bhaktiman | sadyojatadibhirmantrairnamaskuryatsadashivam
    || 55|| || iti shrishankarakavacam sampurnam ||
  devanagari: ृण्वतां सद्यो मुक्तिः स्यादनपायिनी । ब्रह्मचारी कृतस्नानः शुक्लवासा जितेन्द्रियः ॥ २८॥ भस्मधारी
    मुनिर्मौनी पद्मासनसमन्वितः । ध्यात्वा मां सकलाधीशं निराकारं निरीश्वरम् ॥ २९॥ पार्वतीसहितं शम्भुं जटामकुटमण्डितम्
    । वसानं चर्म वैयाघ्रं चन्द्रार्धकृतशेखरम् ॥ ३०॥ त्र्यम्बकं वृषभारूढं कृत्तिवाससमुज्ज्वलम् । सुरार्चितपदद्वन्द्वं
    दिव्यभोगं सुसुन्दरम् ॥ ३१॥ बिभ्राणं सुप्रसन्नं च कुठारवरदाभयम् । दुरन्तं कमलासीनं नागयज्ञोपवीतिनम्
    ॥ ३२॥ विश्वकायं चिदानन्दं शुद्धमक्षरमव्ययम् । सहस्रशिरसं शम्भुमनन्तकरसंयुतम् ॥ ३३॥ सहस्रचरणं दिव्यं
    सोमसूर्याग्निलोचनम् । जगद्योनिमजं ब्रह्म शिवमाद्यं सनातनम् ॥ ३४॥ दंष्ट्राकरालं दुष्प्रेक्षं सूर्यकोटिसमप्रभम्
    । निशाकरकराकारं भेषजं भवरोगिणाम् ॥ ३५॥ पिनाकिनं विशालाक्षं पशूनां पतिमीश्वरम् । कालात्मानं कालकालं
    देवदेवं महेश्वरम् ॥ ३६॥ ज्ञानवैराग्यसम्पन्नं नित्यानन्दमयं परम् । शाश्वतैश्वर्यसम्पूर्णं महायोगीश्वरेश्वरम्
    ॥ ३७॥ समस्तशक्तिसम्पन्नं पुण्यकायं दुरासदम् । तारकं ब्रह्म सम्पूर्णमणीयांसं महत्तरम् ॥ ३८॥ यतीनां
    परमं ब्रह्म यतीनां तपसः फलम् । संयमीहृत्समासीनं तपस्विजनसंवृतम् ॥ ३९॥ विधीन्द्रविष्णुनमितं मुनिसिद्धनिषेवितम्
    । महादेवं महानन्दं देवानामपि दैवतम् ॥ ४०॥ शान्तं पवित्रमोङ्कारं ज्योतिषां ज्योतिरुत्तमम् । शङ्करो
    मे शिरः पातु ललाटं भाललोचनः ॥ ४१॥ विश्वचक्षुर्दृशौ पातु रुद्रः पातु भ्रुवौ मम । गण्डौ पातु महेशानः
    श्रुती रक्षतु पूर्वजः ॥ ४२॥ कपोलौ मे महादेवः पातु नासां सदाशिवः । मुखं पातु हविर्भोक्ता ओष्ठौ पातु
    महेश्वरः ॥ ४३॥ दन्तान् रक्षतु देवेशस्तालू सोमकलाधरः । रसनां परमानन्दः पातु शङ्खौ शिवाप्रियः ॥ ४४॥
    चुबुकं पातु मे शम्भुः श्मश्रुं शत्रुविनाशनः । कुचं पातु भवः कण्ठं नीलकण्ठोऽवतु ध्रुवम् ॥ ४५॥ स्कन्धौ
    स्कन्दपतिः पातु बाहू पातु महाभुजः । उपबाहू महावीर्यः करौ विबुधसत्तमः ॥ ४६॥ अङ्गुलीः पातु पञ्चास्यः
    पर्वाणि च सहस्रपात् । हृदयं पातु सर्वात्मा स्तनौ पातु पितामहः ॥ ४५॥ उदरं हुतभुक् पातु मध्यं मे मध्यमेश्वरः
    । कुक्षिं पातु भवानीशः पृष्ठं पातु कुलेश्वरः ॥ ४८॥ प्राणान् मे प्राणदः पातु नाभिं भीमः कटिं विभुः
    । सक्थिनी पातु मे भर्गो जानुनी जनताधिपः ॥ ४९॥ जङ्घे पुररिपुः पातु चरणौ भवनाशनः । शरीरं पातु मे शर्वो
    बाह्यमाभ्यन्तरं शिवः ॥ ५०॥ इन्द्रियाणि हरः पातु सर्वत्र जयवर्धनः । पूर्वे दिशि मृडः पातु दक्षिणे यमसूदनः
    ॥ ५१॥ वारुण्यां सलिलाधीश उदीच्यां मे महीधरः । ऐशान्यां पातु भूतेश आग्नेय्यां रविलोचनः ॥ ५२॥ नैरृत्यां
    भूतभृत् पातु वायव्यां बलवर्धनः । ऊर्ध्वं पातु मखद्वेषी ह्यधः संसारनाशनः ॥ ५३॥ सर्वतः सुखदः पातु बुद्धिं
    पातु सुलोचनः । एवं न्यासादिकं कृत्वा साक्षाच्छम्भुमयो भवेत् ॥ ५४॥ नमो हिरण्यबाह्वादि पठेन्मन्त्रं
    तु भक्तिमान् । सद्योजातादिभिर्मन्त्रैर्नमस्कुर्यात्सदाशिवम् ॥ ५५॥ ॥ इति श्रीशङ्करकवचं सम्पूर्णम् ॥
