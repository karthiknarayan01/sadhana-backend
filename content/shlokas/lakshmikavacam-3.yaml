id: lakshmikavacam-3
category: kavacha
name:
  english: lakshmikavacam 3
  devanagari: लक्ष्मीकवचम् ३
content:
  english: vaha nihsamdeha uttarottara unnati karata hai || 34|| || iti vishvasaratantroktam lakshmikavacam
    kanhaiyalala mishrakritabhashatikasahitam samaptam || shrilakshmikavacam atha shrilakshmikavacaprarambhah
    | ishvara uvaca | atha vakshye maheshani kavacam sarvakamadam | yasya vijnanamatrena bhavetsakshatsadashivah
    || 1|| narcanam tasya deveshi mantramatram japennarah | sa bhavetparvvatiputrah sarvashastreshu paragah
    || 2|| vidyarthina sada sevya visheshe vishnuvallabha || 3|| asyashcaturaksharivishnuvanitarupayah
    kavacasya shribhagavan shiva rishiranushtupcchando vagbhavi devata vagbhavam bijam lajjashakti rama
    kilakam kamabijatmakam kavacam mama supandityakavitvasarvasiddhisamriddhaye jape viniyogah || 4||
    ainkari mastake patu vagbhavi sarvasiddhida | hrim patu cakshushormmadhye cakshuryugme ca shankari
    || 5|| jihvayam mukhavritte ca karnayorgandayornasi | oshthadhare dantapanktau talumule hanau punah
    | patu mam vishnuvanita lakshmih shrivarnarupini || 6|| karnayugme bhujadvandve stanadvandve ca parvvati
    | hridaye manibandhe ca grivayam parshvayoh punah | sarvange patu kameshi mahadevi samunnatih || 7||
    vyushtih patu mahamaya utkrishtih sarvadavatu | sandhim patu sada devi sarvatra shambhuvallabha ||
    8|| vagbhavi sarvada patu patu mam harigehini | rama patu sada devi patu maya svarat svayam || 9||
    sarvange patu mam lakshmirvishnumaya sureshvari | vijaya patu bhavane jaya patu sada mama || 10||
    shivaduti sada patu sundari patu sarvada | bhairavi patu sarvatra bhairunda sarvada'vatu || 11|| tvarita
    patu mam nityamugratara sada'vatu | patu mam kalika nityam kalaratrih sada'vatu || 12|| navadurga
    sada patu kamakhya sarvadavatu | yoginyah sarvada patu mudrah patu sada mama || 13|| matarah patu
    devyashca cakrastha yoginiganah | sarvatra sarvakaryeshu sarvakarmmasu sarvada || patu mam devadevi
    ca lakshmih sarvasamriddhida || 14|| iti te kathitam divyam kavacam sarvasiddhaye | yatra tatra na
    vaktavyam yadicchedatmano hitam || 15|| shathaya bhaktihinaya nindakaya maheshvari | nyunange atiriktange
    darshayenna kadacana || 16|| na stavam darshayeddivyam sandarshya shivaha bhavet || 17|| kulinaya
    mahocchraya durgabhaktiparaya ca | vaishnavaya vishuddhaya dadyatkavacamuttamam || 18|| nijashishyaya
    shantaya dhanine jnanine tatha | dadyatkavacamityuktam sarvatantrasamanvitam || 19|| vilikhya kavacam
    divyam svayambhukusumaih shubhaih | svashukraih parashukraishca nanagandhasamanvitaih || 20|| gorocanakunkumena
    raktacandanakena va | sutithau shubhayoge va shravanayam raverdine || 21|| ashvinyamkrittikayamvaphalgunyamvamaghasu
    ca | purvvabhadrapadayoge svatyam mangalavasare || 22|| vilikhetprapathetstotram shubhayoge suralaye
    | ayushmatpritiyoge ca brahmayoge visheshatah || 23|| indrayoge shubhayoge shukrayoge tathaiva ca
    | kaulave balave caiva vanije caiva sattamah || 24|| shunyagare shmashane va vijane ca visheshatah
    | kumarim pujayitvadau yajeddevim sanatanim || 25|| matsyamamsaih shakasupah pujayetparadevatam |
    ghritadyaih sopakaranaih pupasupairvvisheshatah || 26|| brahmananbhojayitvadau prinayetparameshvarim
    || 27|| bahuna kimihoktena krite tvevam dinatrayam | tadadharenmaharaksham shankarenabhibhashitam
    || 28|| maranadveshanadini labhate natra samshayah | sa bhavetparvvatiputrah sarvashastravisharadah
    || 29|| gururdevo harah sakshatpatni tasya harapriya | abhedena bhajedyastu tasya siddhiraduratah
    || 30|| sarvadevamayim devim sarvamantramayim tatha | subhaktya pujayedyastu sa bhavetkamalapriyah
    || 31|| raktapushpaistatha gandhairvastralankaranaistatha | bhaktya yah pujayeddevim labhate paramam
    gatim || 32|| nari va purusho vapi yah pathetkavacam shubham | mantrasiddhih karyasiddhirlabhate natra
    samshayah || 33|| pathati ya iha martyo nityamardrantaratma | japaphalamanumeyam lapsyate yadvidheyam
    | sa bhavati padamuccaih sampadam padanamrah | kshitipamukutalakshmirlakshananam ciraya || 34|| ||
    iti vishvasaratantroktam lakshmikavacam kanhaiyalala mishrakritabhashatikasahitam samaptam ||
  devanagari: वह निःसंदेह उत्तरोत्तर उन्नति करता है ॥ ३४॥ ॥ इति विश्वसारतन्त्रोक्तं लक्ष्मीकवचं कन्हैयलाल
    मिश्रकृताभाषाटीकासहितं समाप्तम् ॥ श्रीलक्ष्मीकवचम् अथ श्रीलक्ष्मीकवचप्रारम्भः । ईश्वर उवाच । अथ वक्ष्ये
    महेशानि कवचं सर्वकामदम् । यस्य विज्ञानमात्रेण भवेत्साक्षात्सदाशिवः ॥ १॥ नार्चनं तस्य देवेशि मन्त्रमात्रं
    जपेन्नरः । स भवेत्पार्व्वतीपुत्रः सर्वशास्त्रेषु पारगः ॥ २॥ विद्यार्थिना सदा सेव्या विशेषे विष्णुवल्लभा
    ॥ ३॥ अस्याश्चतुरक्षरिविष्णुवनितारूपायाः कवचस्य श्रीभगवान् शिव ऋषिरनुष्टुप्च्छन्दो वाग्भवी देवता वाग्भवं
    बीजं लज्जाशक्ती रमा कीलकं कामबीजात्मकं कवचं मम सुपाण्डित्यकवित्वसर्वसिद्धिसमृद्धये जपे विनियोगः ॥
    ४॥ ऐङ्कारी मस्तके पातु वाग्भवी सर्वसिद्धिदा । ह्रीं पातु चक्षुषोर्म्मध्ये चक्षुर्युग्मे च शाङ्करी
    ॥ ५॥ जिह्वायां मुखवृत्ते च कर्णयोर्गण्डयोर्नसि । ओष्ठाधरे दन्तपङ्क्तौ तालुमूले हनौ पुनः । पातु मां
    विष्णुवनिता लक्ष्मीः श्रीवर्णरूपिणी ॥ ६॥ कर्णयुग्मे भुजद्वन्द्वे स्तनद्वन्द्वे च पार्व्वती । हृदये
    मणिबन्धे च ग्रीवायां पार्श्वयोः पुनः । सर्वाङ्गे पातु कामेशी महादेवी समुन्नतिः ॥ ७॥ व्युष्टिः पातु
    महामाया उत्कृष्टिः सर्वदावतु । सन्धिं पातु सदा देवी सर्वत्र शम्भुवल्लभा ॥ ८॥ वाग्भवी सर्वदा पातु पातु
    मां हरिगेहिनी । रमा पातु सदा देवी पातु माया स्वराट् स्वयम् ॥ ९॥ सर्वाङ्गे पातु मां लक्ष्मीर्विष्णुमाया
    सुरेश्वरी । विजया पातु भवने जया पातु सदा मम ॥ १०॥ शिवदूती सदा पातु सुन्दरी पातु सर्वदा । भैरवी पातु
    सर्वत्र भैरूण्डा सर्वदाऽवतु ॥ ११॥ त्वरिता पातु मां नित्यमुग्रतारा सदाऽवतु । पातु मां कालिका नित्यं
    कालरात्रिः सदाऽवतु ॥ १२॥ नवदुर्गा सदा पातु कामाख्या सर्वदावतु । योगिन्यः सर्वदा पातु मुद्राः पातु
    सदा मम ॥ १३॥ मातरः पातु देव्यश्च चक्रस्था योगिनीगणाः । सर्वत्र सर्वकार्येषु सर्वकर्म्मसु सर्वदा ॥
    पातु मां देवदेवी च लक्ष्मीः सर्वसमृद्धिदा ॥ १४॥ इति ते कथितं दिव्यं कवचं सर्वसिद्धये । यत्र तत्र न
    वक्तव्यं यदीच्छेदात्मनो हितम् ॥ १५॥ शठाय भक्तिहीनाय निन्दकाय महेश्वरि । न्यूनाङ्गे अतिरिक्ताङ्गे दर्शयेन्न
    कदाचन ॥ १६॥ न स्तवं दर्शयेद्दिव्यं सन्दर्श्य शिवहा भवेत् ॥ १७॥ कुलीनाय महोच्छ्राय दुर्गाभक्तिपराय
    च । वैष्णवाय विशुद्धाय दद्यात्कवचमुत्तमम् ॥ १८॥ निजशिष्याय शान्ताय धनिने ज्ञानिने तथा । दद्यात्कवचमित्युक्तं
    सर्वतन्त्रसमन्वितम् ॥ १९॥ विलिख्य कवचं दिव्यं स्वयम्भुकुसुमैः शुभैः । स्वशुक्रैः परशुक्रैश्च नानागन्धसमन्वितैः
    ॥ २०॥ गोरोचनाकुङ्कुमेन रक्तचन्दनकेन वा । सुतिथौ शुभयोगे वा श्रवणायां रवेर्दिने ॥ २१॥ अश्विन्यांकृत्तिकायांवाफल्गुन्यांवामघासु
    च । पूर्व्वभाद्रपदायोगे स्वात्यां मङ्गलवासरे ॥ २२॥ विलिखेत्प्रपठेत्स्तोत्रं शुभयोगे सुरालये । आयुष्मत्प्रीतियोगे
    च ब्रह्मयोगे विशेषतः ॥ २३॥ इन्द्रयोगे शुभयोगे शुक्रयोगे तथैव च । कौलवे बालवे चैव वणिजे चैव सत्तमः
    ॥ २४॥ शून्यागारे श्मशाने वा विजने च विशेषतः । कुमारीं पूजयित्वादौ यजेद्देवीं सनातनीम् ॥ २५॥ मत्स्यमांसैः
    शाकसूपः पूजयेत्परदेवताम् । घृताद्यैः सोपकरणैः पूपसूपैर्व्विशेषतः ॥ २६॥ ब्राह्मणान्भोजायित्वादौ प्रीणयेत्परमेश्वरीम्
    ॥ २७॥ बहुना किमिहोक्तेन कृते त्वेवं दिनत्रयम् । तदाधरेन्महारक्षां शङ्करेणाभिभाषितम् ॥ २८॥ मारणद्वेषणादीनि
    लभते नात्र संशयः । स भवेत्पार्व्वतीपुत्रः सर्वशास्त्रविशारदः ॥ २९॥ गुरूर्देवो हरः साक्षात्पत्नी तस्य
    हरप्रिया । अभेदेन भजेद्यस्तु तस्य सिद्धिरदूरतः ॥ ३०॥ सर्वदेवमयीं देवीं सर्वमन्त्रमयीं तथा । सुभक्त्या
    पूजयेद्यस्तु स भवेत्कमलाप्रियः ॥ ३१॥ रक्तपुष्पैस्तथा गन्धैर्वस्त्रालङ्करणैस्तथा । भक्त्या यः पूजयेद्देवीं
    लभते परमां गतिम् ॥ ३२॥ नारी वा पुरूषो वापि यः पठेत्कवचं शुभम् । मन्त्रसिद्धिः कार्यसिद्धिर्लभते नात्र
    संशयः ॥ ३३॥ पठति य इह मर्त्यो नित्यमार्द्रान्तरात्मा । जपफलमनुमेयं लप्स्यते यद्विधेयम् । स भवति पदमुच्चैः
    सम्पदां पादनम्रः । क्षितिपमुकुटलक्ष्मीर्लक्षणानां चिराय ॥ ३४॥ ॥ इति विश्वसारतन्त्रोक्तं लक्ष्मीकवचं
    कन्हैयलाल मिश्रकृताभाषाटीकासहितं समाप्तम् ॥
