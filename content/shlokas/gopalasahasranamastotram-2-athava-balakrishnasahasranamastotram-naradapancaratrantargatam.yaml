id: gopalasahasranamastotram-2-athava-balakrishnasahasranamastotram-naradapancaratrantargatam
category: sahasranama
name:
  english: gopalasahasranamastotram 2 athava balakrishnasahasranamastotram (naradapancaratrantargatam)
  devanagari: गोपालसहस्रनामस्तोत्रम् २ अथवा बालकृष्णसहस्रनामस्तोत्रम् (नारदपञ्चरात्रान्तर्गतम्)
content:
  english: asya shribalakrishnasya sahasranamastotrasya narada rishih shribalakrishno devata purusharthasiddhaye
    jape viniyogah | balakrishnah suradhisho bhutavaso vrajeshvarah | vrajendranandano nandi vrajanganaviharanah
    || 10|| gogopagopikanandakarako bhaktivardhanah | govatsapucchasankarshajatanandabharo'jayah || 11||
    ringamanagatih shrimanatibhaktiprakashanah | dhulidhusara sarvango ghatipitaparicchadah || 12|| puratabharanah
    shrisho gatirgatimatam sada | yogisho yogavandyashca yogadhisho yashahpradah || 13|| yashodanandanah
    krishno govatsaparicarakah | gavendrashca gavakshashca gavadhyaksho gavam gati || 14|| gaveshashca
    gavishashca gocaranaparayanah | godhulidhamapriyako godhulikritabhushanah || 15|| gorasyo gorasashogo
    gorasancitadhamakah | gorasasvadako vaidyo vedatito vasupradah || 16|| vipulamsho ripuharo viksharo
    jayado jayah | jagadvandyo jagannatho jagadaradhyapadakah || 17|| jagadisho jagatkarta jagatpujyo
    jayariha | jayatam jayashilashca jayatito jagadbalah || 18|| jagaddharta palayita pata dhata maheshvarah
    | radhikanandano radhaprananatho rasapradah || 19|| radhabhaktikarah shuddho radharadhyo ramapriyah
    | gokulanandadata ca gokulanandarupadhrik || 20|| gokuleshvarakalyano gokuleshvaranandanah | golokabhiritih
    sragvi golokeshvaranayakah || 21|| nityam golokavasatirnityam gogopanandanah | ganeshvaro ganadhyaksho
    gananam paripurakah || 22|| guna gunotkaro ganyo gunatitau gunakarah | gunapriyo gunadharo gunaradhyo
    ganagrani || 23|| gananayako vighnaharo herambah parvatisutah | parvatadhinivasi ca govardhanadharo
    guruh || 24|| govardhanapatih shanto govardhanaviharakah | govardhano gitagatirgavaksho govrikshekshanah
    || 25|| gabhastinemirgitatma gitagamyo gatipradah | gavamayo yajnanemiryajnango yajnarupadhrik ||
    26|| yajnapriyo yajnaharta yajnagamyo yajurgatih | yajnango yajnagamyashca yajnaprapyo vimatsarah
    || 27|| yajnantakrit yajnaguno yajnatito yajuhpriyah | manurmanvadirupi ca manvantaraviharakah ||
    28|| manupriyo manorvamshadhari madhavamapatih | mayapriyo mahamayo mayatito mayantakah || 29|| mayabhigami
    mayakhyo mahamayavarapradah | mahamayaprado mayanando mayeshvarah kavih || 30|| karanam karanam karta
    karyam karma kriya matih | karyatito gavam natho jagannatho gunakarah || 31|| vishvarupo virupakhyo
    vidyanando vasupradah | vasudevo vishishtesho vanisho vakyatirmahah || 32|| vasudevo vasushreshtho
    devakinandano'riha vasupata vasupatirvasudhaparipalakah || 33|| kamsarih kamsahanta ca kamsaradhyo
    gatirgavam | govindo gomatam palo gopanarijanadhipah || 34|| gopirato rurunakhadhari hari jagadguruh
    | janujanghantaralashca pitambaradharo harih || 35|| haiyangavinasambhokta payasasho gavam guruh |
    brahmanyo brahyana''radhyonityam goviprapalakah || 36|| bhaktapriyo bhaktalabhyo bhaktyatito bhuvam
    gatih | bhulokapata harta ca bhugolaparicintakah || 37|| nityam bhulokavasi ca janalokanivasakah |
    tapolokanivasi ca vaikuntho vishtasasravah || 38|| vikunthavasi vaikunthavasi hasi rasapradah | rasikagopikanandadayako
    balaghrigvapuh || 39|| yashasvi yamunatirapuline'tivamohanah | vastraharta gopikanam manohari varapradah
    || 40|| dadhibhaksho dayadharo data pata hritahritah | mandapo mandaladhisho rajarajeshvaro vibhuh
    || 41|| vishvadhrik vishvabhuk vishvapalako vishvamohanah | vidvatpriyo vitahavyo havyagavyakritashanah
    || 42|| kavyabhuk pitrivarti ca kavyatma kavyabhojanah | ramo viramo ratido ratibharta ratipriyah
    || 43|| pradyumno'kruradamyashca kruratma kuramardanah | kripalushca dayalushca shayaluh saritam patih
    || 44|| nadinadavidhata ca nadinadaviharakah | sindhuh sindhupriyodantah shantah kantah kalanidhih
    || 45|| samnyasakritsatam bharta sadhucchishtakritashanah | sadhupriyah sadhugamyo sadhvacaranishevakah
    || 46|| janmakarmaphalatyagi yogi bhogi mrigipatih | margatito yogamargo margamano mahoravih || 47||
    ravilocano raverangabhagi dvadasharupadhrik | gopalo balagopalobalakanandadayakah || 48|| balakanam
    patih shrisho viratih sarvapapinam | shrilah shriman shriyutashca shrinivasah shriyah patih || 49||
    shridah shrishah shriyahkanto ramakanto rameshvarah | shrikanto dharanikanta umakantapriyah prabhuh
    || 50|| ishta'bhilashi varado vedagamyo durashayah | duhkhaharta duhkhanasho bhavaduhkhanivarakah
    || 51|| yathecchacaranirato yathecchacarasurapriyah | yathecchalabhasantushto yathecchasya mano'ntarah
    || 52|| navinaniradabhaso nilanjanacayaprabhah | navadurdinameghabho navameghacchavih kvacit || 53||
    svarnavarno nyasadharo dvibhujo bahubahukah | kiritadhari mukuti murtipanjarasundarah || 54|| manorathapathatitakarako
    bhaktavatsalah | kanvannabhokta kapilo kapisho garudatmaka || 55|| suvarnavarno hemamah putanantaka
    ityapih | putanastanapata ca pranantakarano ripuh || 56|| vatsanasho vatsapalo vatseshvaravasuttamah
    | hemabho hemakanthashca shrivatsah shrimatam patih || 57|| sanandanapatharadhyo paturdhatumatam patih
    | sanatkumarayogatma sanekashvararupadhrik || 58|| sanatanapado data nityam caiva sanatanah | bhandiravanavasi
    ca shrivrindavananayakah || 59|| vrindavaneshvaripujyo vrindaranyaviharakah | yamunatiragodhenupalako
    meghamanmathah || 60|| kandarpadarpaharano manonayananandanah | balakelipriyah kanto balakridaparicchadah
    || 61|| balanam rakshako balah kridakautukakarakah | balyarupadharo dhanvi dhanushki shuladhrik vibhuh
    || 62|| amritamsho'mritavapuh piyushaparipalakah | piyushapayi pauravyanandano nandivardhanah || 63||
    shridamamshukapata ca shridamaparibhushanah | vrindaranyapriyah krishnah kishora kantarupadhrik ||
    64|| kamarajah kalatito yoginam paricintakah | vrisheshvarah kripapalo gayatrigativallabhah || 65||
    nirvanadayako mokshadayi vedavibhagakah | vedavyasapriyo vaidyo vaidyanandapriyah shubhah || 66||
    shukadevo gayanatho gayasuragatipradah | vishnurjishnurgarishthashca sthavishtashca sthaviyasam ||
    67|| varishthashca yavishthashca bhuyishthashca bhuvah patih | durgaternashako durgapalako dushtanashakah
    || 68|| kaliyasarpadamano yamunanirmalodakah | yamunapuline ramye nirmale pavanodake || 69|| vasantubalagopalarupadhari
    giram patih | vagdata vakprado vaninatho brahmanarakshakah || 70|| brahmanye brahmakridbrahma brahmakarmapradayakah
    | vrahmanyadevo brahmanyadayako brahmanapriyah || 71|| svastipriyo'svasthadharo'svasthanasho dhiyam
    patih | kvanannupuradhrigvishvarupi vishveshvarah shivah || 72|| shivatmako balyavapuh shivatma shivarupadhrik
    | sadashivapriyo devah shivavandyo jagatshivah || 73|| gomadhyavasi govasi gopagopimano'ntarah | dharmo
    dharmadhurinashca dharmarupo dharadharah || 74|| svoparjitayashah kirtivardhano nandirupakah | devahutijnanadata
    yogasankhyanivartakah || 75|| trinavartapranahari shakatasurabhanjanah | pralambahari ripuha tatha
    dhenukamardanah || 76|| arishtanashano'cintyah keshiha keshinashanah | kankaha kamsaha kamsanashano
    ripunashanah || 77|| yamunajalakalloladarshi harshi priyamvadah | svacchandahari yamunajalahari surapriyah
    || 78|| liladhritavapuh kelikarako dharanidharah | gopta garishtho gadido gatikari gayeshvarah ||
    79|| shobhapriyah shubhakaro vipulashripratapanah | keshidaityaharo datri data dharmarthasadhana ||
    80|| trisama trikkritsamah sarvatma sarvadipanah | sarvajnah sugato buddho bauddharupi janardanah
    || 81|| daityarih pundarikakshah padmanabho'cyuto'sitah | padmakshah padmajakanto garudasanavigrahah
    || 82|| garutmatadharo dhenupalakah suptavigrahah | artiha papahaneha bhutiha bhutivardhanah || 83||
    vanchakalpadrumah sakshanmedhavi garudadhvajah | nilashvetah sitah krishno gaurah pitambaracchadah
    || 84|| bhaktartinashano girnah shirno jirnatanucchadah | balipriyo baliharo balibandhanatatparah
    || 85|| vamano vamadevashca daityarih kanjalocanah | udirnah sarvato gopta yogagamyah puratanah ||
    86 || narayano naravapuh krishnarjunavapurdharah | trinabhistrivritam sevyo yugatito yugatmakah ||
    87|| hamso hamsi hamsavapurhamsarupi kripamayah | haratmako haravapurharabhavanatatparah || 88|| dharmarago
    yamavapustripurantakavigrahah | yudhishthirapriyo rajyadata rajendravigrahah || 89|| indrayajnaharo
    govardhanadhari giram patih | yajnabhugyajnakari ca hitakari hitantakah || 90|| akruravandyo vishvadhrugashvahari
    hayasyakah | hayagrivah smitamukho gopikanto'runadhvadhah || 91|| nirastasamyatishayah sarvatma sarvamandanah
    | gopipritikaro gopimanohari harirharih || 92|| lakshmano bharato ramah shatrughno nilarupakah | hanumajjnanadata
    ca janakivallabho girih || 93|| girirupo girimakho giriyajnapravarttakah || 94|| bhavabdhipotah shubhakricchrubhabhuk
    shubhavardhanah | vararohi harimukho mandukagatilalasah || 95|| netravaddhakriyo gopabalako balako
    gunah | gunarnavapriyo bhutanatho bhutatmakashca sah || 96|| indrajidbhayadata ca yajusham parirappatih
    | girvanavandyo girvanagatirishtogururgatih || 97|| caturmukhastutimukho brahmanaradasevitah | umakantadhiya''radhyo
    gananagunasimakah || 98|| simantamargo ganikaganamandalasevitah | gopidrikpadmamadhupo gopidrinmandaleshvarah
    || 99|| gopyalinganakridgopihridayanandakarakah | mayurapicchashikharah kankanankadabhushanah || 100||
    svarnacampakasandolah svarnanupurabhushanah | svarnatatankakarnashca svarnacampakabhushitah || 101||
    cudagrarpitaratnendrasarah svarnambaracchadah | ajanubahuh sumukho jagajjananatatparah || 102|| balakrida'ticapalo
    bhandiravananandanah | mahashalah shrutimukho gangacaranasevanah || 103|| gangambupadah karajakaratoyajaleshvarah
    | gandakitirasambhuto gandakijalamardanah || 104|| shalagramah shalarupi shashibhushanabhushanah |
    shashipadah shashinakho vararho yuvatipriyah || 105|| premapadah premalabhyo bhaktyatito bhavapradah
    | anantashayi shavakricchayano yoginishvarah || 106|| putanashakunipranaharako bhavapalakah | sarvalakshanalakshanyo
    lakshmiman lakshmanagrajah || 107|| sarvantakritsarvaguhya sarvatito''surantakah | pratarashanasampurno
    dharanirenugunthitah || 108|| ijyo mahejya sarvejya ijyarupijyabhojanah | brahmarpanaparo nityam brahmagnipritilalasah
    || 109|| madano madanaradhyo manomathanarupakah | nilancitakuncitako balavrindavibhushitah || 110||
    stokakridaparo nityam stokabhojanatatparah | lalitavishakhashyamalatavandipadakah || 111|| shrimatipriyakari
    ca shrimatya padapujitah | shrisamsevitapadabjo venuvadyavisharadah || 112|| sha
  devanagari: अस्य श्रीबालकृष्णस्य सहस्रनामस्तोत्रस्य नारद ऋषिः श्रीबालकृष्णो देवता पुरुषार्थसिद्धये जपे
    विनियोगः । बालकृष्णः सुराधीशो भूतावासो व्रजेश्वरः । व्रजेन्द्रनन्दनो नन्दी व्रजाङ्गनविहारणः ॥ १०॥
    गोगोपगोपिकानन्दकारको भक्तिवर्धनः । गोवत्सपुच्छसङ्कर्षजातानन्दभरोऽजयः ॥ ११॥ रिङ्गमाणगतिः श्रीमानतिभक्तिप्रकाशनः
    । धूलिधूसर सर्वाङ्गो घटीपीतपरिच्छदः ॥ १२॥ पुरटाभरणः श्रीशो गतिर्गतिमतां सदा । योगीशो योगवन्द्याश्च
    योगाधीशो यशःप्रदः ॥ १३॥ यशोदानन्दनः कृष्णो गोवत्सपरिचारकः । गवेन्द्रश्च गवाक्षश्च गवाध्यक्षो गवां
    गति ॥ १४॥ गवेशश्च गवीशश्च गोचारणपरायणः । गोधूलिधामप्रियको गोधूलिकृतभूषणः ॥ १५॥ गोरास्यो गोरसाशोगो
    गोरसाञ्चितधामकः । गोरसास्वादको वैद्यो वेदातीतो वसुप्रदः ॥ १६॥ विपुलांशो रिपुहरो विक्षरो जयदो जयः ।
    जगद्वन्द्यो जगन्नाथो जगदाराध्यपादकः ॥ १७॥ जगदीशो जगत्कर्ता जगत्पूज्यो जयारिहा । जयतां जयशीलश्च जयातीतो
    जगद्बलः ॥ १८॥ जगद्धर्ता पालयिता पाता धाता महेश्वरः । राधिकानन्दनो राधाप्राणनाथो रसप्रदः ॥ १९॥ राधाभक्तिकरः
    शुद्धो राधाराध्यो रमाप्रियः । गोकुलानन्ददाता च गोकुलानन्दरूपधृक् ॥ २०॥ गोकुलेश्वरकल्याणो गोकुलेश्वरनन्दनः
    । गोलोकाभिरितिः स्रग्वी गोलोकेश्वरनायकः ॥ २१॥ नित्यं गोलोकवसतिर्नित्यं गोगोपनन्दनः । गणेश्वरो गणाध्यक्षो
    गणानां परिपूरकः ॥ २२॥ गुणा गुणोत्करो गण्यो गुणातीतौ गुणाकरः । गुणप्रियो गुणाधारो गुणाराध्यो गणाग्रणी
    ॥ २३॥ गणनायको विघ्नहरो हेरम्बः पार्वतीसुतः । पर्वताधिनिवासी च गोवर्धनधरो गुरुः ॥ २४॥ गोवर्धनपतिः शान्तो
    गोवर्धनविहारकः । गोवर्धनो गीतगतिर्गवाक्षो गोवृक्षेक्षणः ॥ २५॥ गभस्तिनेमिर्गीतात्मा गीतगम्यो गतिप्रदः
    । गवामयो यज्ञनेमिर्यज्ञाङ्गो यज्ञरूपधृक् ॥ २६॥ यज्ञप्रियो यज्ञहर्ता यज्ञगम्यो यजुर्गतिः । यज्ञाङ्गो
    यज्ञगम्यश्च यज्ञप्राप्यो विमत्सरः ॥ २७॥ यज्ञान्तकृत् यज्ञगुणो यज्ञातीतो यजुःप्रियः । मनुर्मन्वादिरूपी
    च मन्वन्तरविहारकः ॥ २८॥ मनुप्रियो मनोर्वंशधारी माधवमापतिः । मायाप्रियो महामायो मायातीतो मयान्तकः ॥
    २९॥ मायाभिगामी मायाख्यो महामायावरप्रदः । महामायाप्रदो मायानन्दो मायेश्वरः कविः ॥ ३०॥ करणं कारणं कर्ता
    कार्यं कर्म क्रिया मतिः । कार्यातीतो गवां नाथो जगन्नाथो गुणाकरः ॥ ३१॥ विश्वरूपो विरूपाख्यो विद्यानन्दो
    वसुप्रदः । वासुदेवो विशिष्टेशो वाणीशो वाक्यतिर्महः ॥ ३२॥ वासुदेवो वसुश्रेष्ठो देवकीनन्दनोऽरिहा वसुपाता
    वसुपतिर्वसुधापरिपालकः ॥ ३३॥ कंसारिः कंसहन्ता च कंसाराध्यो गतिर्गवाम् । गोविन्दो गोमतां पालो गोपनारीजनाधिपः
    ॥ ३४॥ गोपीरतो रुरुनखधारी हारी जगद्गुरुः । जानुजङ्घान्तरालश्च पीताम्बरधरो हरिः ॥ ३५॥ हैयङ्गवीनसम्भोक्ता
    पायसाशो गवां गुरुः । ब्रह्मण्यो ब्रह्यणाऽऽराध्योनित्यं गोविप्रपालकः ॥ ३६॥ भक्तप्रियो भक्तलभ्यो भक्त्यातीतो
    भुवां गतिः । भूलोकपाता हर्ता च भूगोलपरिचिन्तकः ॥ ३७॥ नित्यं भूलोकवासी च जनलोकनिवासकः । तपोलोकनिवासी
    च वैकुण्ठो विष्टसस्रवाः ॥ ३८॥ विकुण्ठवासी वैकुण्ठवासी हासी रसप्रदः । रसिकागोपिकानन्ददायको बालघृग्वपुः
    ॥ ३९॥ यशस्वी यमुनातीरपुलिनेऽतीवमोहनः । वस्त्रहर्ता गोपिकानां मनोहारी वरप्रदः ॥ ४०॥ दधिभक्षो दयाधारो
    दाता पाता हृताहृतः । मण्डपो मण्डलाधीशो राजराजेश्वरो विभुः ॥ ४१॥ विश्वधृक् विश्वभुक् विश्वपालको विश्वमोहनः
    । विद्वत्प्रियो वीतहव्यो हव्यगव्यकृताशनः ॥ ४२॥ कव्यभुक् पितृवर्ती च काव्यात्मा कव्यभोजनः । रामो विरामो
    रतिदो रतिभर्ता रतिप्रियः ॥ ४३॥ प्रद्युम्नोऽक्रूरदम्यश्च क्रूरात्मा कूरमर्दनः । कृपालुश्च दयालुश्च
    शयालुः सरितां पतिः ॥ ४४॥ नदीनदविधाता च नदीनदाविहारकः । सिन्धुः सिन्धुप्रियोदान्तः शान्तः कान्तः कलानिधिः
    ॥ ४५॥ संन्यासकृत्सतां भर्ता साधूच्छिष्टकृताशनः । साधुप्रियः साधुगम्यो साध्वाचारनिषेवकः ॥ ४६॥ जन्मकर्मफलत्यागी
    योगी भोगी मृगीपतिः । मार्गातीतो योगमार्गो मार्गमाणो महोरविः ॥ ४७॥ रविलोचनो रवेरङ्गभागी द्वादशरूपधृक्
    । गोपालो बालगोपालोबालकानन्ददायकः ॥ ४८॥ बालकानां पतिः श्रीशो विरतिः सर्वपापिनाम् । श्रीलः श्रीमान्
    श्रीयुतश्च श्रीनिवासः श्रियः पतिः ॥ ४९॥ श्रीदः श्रीशः श्रियःकान्तो रमाकान्तो रमेश्वरः । श्रीकान्तो
    धरणीकान्त उमाकान्तप्रियः प्रभुः ॥ ५०॥ इष्टऽभिलाषी वरदो वेदगम्यो दुराशयः । दुःखहर्ता दुःखनाशो भवदुःखनिवारकः
    ॥ ५१॥ यथेच्छाचारनिरतो यथेच्छाचारसुरप्रियः । यथेच्छालाभसन्तुष्टो यथेच्छस्य मनोऽन्तरः ॥ ५२॥ नवीननीरदाभासो
    नीलाञ्जनचयप्रभः । नवदुर्दिनमेघाभो नवमेघच्छविः क्वचित् ॥ ५३॥ स्वर्णवर्णो न्यासधारो द्विभुजो बहुबाहुकः
    । किरीटधारी मुकुटी मूर्तिपञ्जरसुन्दरः ॥ ५४॥ मनोरथपथातीतकारको भक्तवत्सलः । कण्वान्नभोक्ता कपिलो कपिशो
    गरुडात्मक ॥ ५५॥ सुवर्णवर्णो हेमामः पूतनान्तक इत्यापिः । पूतनास्तनपाता च प्राणान्तकरणो रिपुः ॥ ५६॥
    वत्सनाशो वत्सपालो वत्सेश्वरवसूत्तमः । हेमाभो हेमकण्ठश्च श्रीवत्सः श्रीमतां पतिः ॥ ५७॥ सनन्दनपथाराध्यो
    पातुर्धातुमतां पतिः । सनत्कुमारयोगात्मा सनेकश्वररूपधृक् ॥ ५८॥ सनातनपदो दाता नित्यं चैव सनातनः । भाण्डीरवनवासी
    च श्रीवृन्दावननायकः ॥ ५९॥ वृन्दावनेश्वरीपूज्यो वृन्दारण्यविहारकः । यमुनातीरगोधेनुपालको मेघमन्मथः ॥
    ६०॥ कन्दर्पदर्पहरणो मनोनयननन्दनः । बालकेलिप्रियः कान्तो बालक्रीडापरिच्छदः ॥ ६१॥ बालानां रक्षको बालः
    क्रीडाकौतुककारकः । बाल्यरूपधरो धन्वी धानुष्की शूलधृक् विभुः ॥ ६२॥ अमृतांशोऽमृतवपुः पीयूषपरिपालकः ।
    पीयूषपायी पौरव्यानन्दनो नन्दिवर्धनः ॥ ६३॥ श्रीदामांशुकपाता च श्रीदामपरिभूषणः । वृन्दारण्यप्रियः कृष्णः
    किशोर कान्तरूपधृक् ॥ ६४॥ कामराजः कलातीतो योगिनां परिचिन्तकः । वृषेश्वरः कृपापालो गायत्रीगतिवल्लभः
    ॥ ६५॥ निर्वाणदायको मोक्षदायी वेदविभागकः । वेदव्यासप्रियो वैद्यो वैद्यानन्दप्रियः शुभः ॥ ६६॥ शुकदेवो
    गयानाथो गयासुरगतिप्रदः । विष्णुर्जिष्णुर्गरिष्ठश्च स्थविष्टाश्च स्थवीयसाम् ॥ ६७॥ वरिष्ठश्च यविष्ठश्च
    भूयिष्ठश्च भुवः पतिः । दुर्गतेर्नाशको दुर्गपालको दुष्टनाशकः ॥ ६८॥ कालीयसर्पदमनो यमुनानिर्मलोदकः ।
    यमुनापुलिने रम्ये निर्मले पावनोदके ॥ ६९॥ वसन्तुबालगोपालरूपधारी गिरां पतिः । वाग्दाता वाक्प्रदो वाणीनाथो
    ब्राह्मणरक्षकः ॥ ७०॥ ब्रह्मण्ये ब्रह्मकृद्ब्रह्म ब्रह्मकर्मप्रदायकः । व्रह्मण्यदेवो ब्रह्मण्यदायको
    ब्राह्मणप्रियः ॥ ७१॥ स्वस्तिप्रियोऽस्वस्थधरोऽस्वस्थनाशो धियां पतिः । क्वणन्नूपुरधृग्विश्वरूपी विश्वेश्वरः
    शिवः ॥ ७२॥ शिवात्मको बाल्यवपुः शिवात्मा शिवरूपधृक् । सदाशिवप्रियो देवः शिववन्द्यो जगत्शिवः ॥ ७३॥ गोमध्यवासी
    गोवासी गोपगोपीमनोऽन्तरः । धर्मो धर्मधुरीणश्च धर्मरूपो धराधरः ॥ ७४॥ स्वोपार्जितयशाः कीर्तिवर्धनो नन्दिरूपकः
    । देवहूतिज्ञानदाता योगसाङ्ख्यनिवर्तकः ॥ ७५॥ तृणावर्तप्राणहारी शकटासुरभञ्जनः । प्रलम्बहारी रिपुहा तथा
    धेनुकमर्दनः ॥ ७६॥ अरिष्टानाशनोऽचिन्त्यः केशिहा केशिनाशनः । कङ्कहा कंसहा कंसनाशनो रिपुनाशनः ॥ ७७॥ यमुनाजलकल्लोलदर्शी
    हर्षी प्रियंवदः । स्वच्छन्दहारी यमुनाजलहारी सुरप्रियः ॥ ७८॥ लीलाधृतवपुः केलिकारको धरणीधरः । गोप्ता
    गरिष्ठो गदिदो गतिकारी गयेश्वरः ॥ ७९॥ शोभाप्रियः शुभकरो विपुलश्रीप्रतापनः । केशिदैत्यहरो दात्री दाता
    धर्मार्थसाधन ॥ ८०॥ त्रिसामा त्रिक्कृत्सामः सर्वात्मा सर्वदीपनः । सर्वज्ञः सुगतो बुद्धो बौद्धरूपी जनार्दनः
    ॥ ८१॥ दैत्यारिः पुण्डरीकाक्षः पद्मनाभोऽच्युतोऽसितः । पद्माक्षः पद्मजाकान्तो गरुडासनविग्रहः ॥ ८२॥ गारुत्मतधरो
    धेनुपालकः सुप्तविग्रहः । आर्तिहा पापहानेहा भूतिहा भूतिवर्धनः ॥ ८३॥ वाञ्छाकल्पद्रुमः साक्षान्मेधावी
    गरुडध्वजः । नीलश्वेतः सितः कृष्णो गौरः पीताम्बरच्छदः ॥ ८४॥ भक्तार्तिनाशनो गीर्णः शीर्णो जीर्णतनुच्छदः
    । बलिप्रियो बलिहरो बलिबन्धनतत्परः ॥ ८५॥ वामनो वामदेवश्च दैत्यारिः कञ्जलोचनः । उदीर्णः सर्वतो गोप्ता
    योगगम्यः पुरातनः ॥ ८६ ॥ नारायणो नरवपुः कृष्णार्जुनवपुर्धरः । त्रिनाभिस्त्रिवृतां सेव्यो युगातीतो युगात्मकः
    ॥ ८७॥ हंसो हंसी हंसवपुर्हंसरूपी कृपामयः । हरात्मको हरवपुर्हरभावनतत्परः ॥ ८८॥ धर्मरागो यमवपुस्त्रिपुरान्तकविग्रहः
    । युधिष्ठिरप्रियो राज्यदाता राजेन्द्रविग्रहः ॥ ८९॥ इन्द्रयज्ञहरो गोवर्धनधारी गिरां पतिः । यज्ञभुग्यज्ञकारी
    च हितकारी हितान्तकः ॥ ९०॥ अक्रूरवन्द्यो विश्वध्रुगश्वहारी हयास्यकः । हयग्रीवः स्मितमुखो गोपीकान्तोऽरुणध्वधः
    ॥ ९१॥ निरस्तसाम्यातिशयः सर्वात्मा सर्वमण्डनः । गोपीप्रीतिकरो गोपीमनोहारी हरिर्हरिः ॥ ९२॥ लक्ष्मणो
    भरतो रामः शत्रुघ्नो नीलरूपकः । हनूमज्ज्ञानदाता च जानकीवल्लभो गिरिः ॥ ९३॥ गिरिरूपो गिरिमखो गिरियज्ञप्रवर्त्तकः
    ॥ ९४॥ भवाब्धिपोतः शुभकृच्छ्रुभभुक् शुभवर्धनः । वारारोही हरिमुखो मण्डूकगतिलालसः ॥ ९५॥ नेत्रवद्धक्रियो
    गोपबालको बालको गुणः । गुणार्णवप्रियो भूतनाथो भूतात्मकश्च सः ॥ ९६॥ इन्द्रजिद्भयदाता च यजुषां परिरप्पतिः
    । गीर्वाणवन्द्यो गीर्वाणगतिरिष्टोगुरुर्गतिः ॥ ९७॥ चतुर्मुखस्तुतिमुखो ब्रह्मनारदसेवितः । उमाकान्तधियाऽऽराध्यो
    गणनागुणसीमकः ॥ ९८॥ सीमान्तमार्गो गणिकागणमण्डलसेवितः । गोपीदृक्पद्ममधुपो गोपीदृङ्मण्डलेश्वरः ॥ ९९॥
    गोप्यालिङ्गनकृद्गोपीहृदयानन्दकारकः । मयूरपिच्छशिखरः कङ्कणाङ्कदभूषणः ॥ १००॥ स्वर्णचम्पकसन्दोलः स्वर्णनूपुरभूषणः
    । स्वर्णताटङ्ककर्णश्च स्वर्णचम्पकभूषितः ॥ १०१॥ चूडाग्रार्पितरत्नेन्द्रसारः स्वर्णाम्बरच्छदः । आजानुबाहुः
    सुमुखो जगज्जननतत्परः ॥ १०२॥ बालक्रीडाऽतिचपलो भाण्डीरवननन्दनः । महाशालः श्रुतिमुखो गङ्गाचरणसेवनः ॥
    १०३॥ गङ्गाम्बुपादः करजाकरतोयाजलेश्वरः । गण्डकीतीरसम्भूतो गण्डकीजलमर्दनः ॥ १०४॥ शालग्रामः शालरूपी शशिभूषणभूषणः
    । शशिपादः शशिनखो वरार्हो युवतीप्रियः ॥ १०५॥ प्रेमपदः प्रेमलभ्यो भक्त्यातीतो भवप्रदः । अनन्तशायी शवकृच्छयनो
    योगिनीश्वरः ॥ १०६॥ पूतनाशकुनिप्राणहारको भवपालकः । सर्वलक्षणलक्षण्यो लक्ष्मीमान् लक्ष्मणाग्रजः ॥ १०७॥
    सर्वान्तकृत्सर्वगुह्य सर्वातीतोऽऽसुरान्तकः । प्रातराशनसम्पूर्णो धरणीरेणुगुण्ठितः ॥ १०८॥ इज्यो महेज्य
    सर्वेज्य इज्यरूपीज्यभोजनः । ब्रह्मार्पणपरो नित्यं ब्रह्माग्निप्रीतिलालसः ॥ १०९॥ मदनो मदनाराध्यो मनोमथनरूपकः
    । नीलाञ्चिताकुञ्चितको बालवृन्दविभूषितः ॥ ११०॥ स्तोकक्रीडापरो नित्यं स्तोकभोजनतत्परः । ललिताविशखाश्यामलतावन्दिपादकः
    ॥ १११॥ श्रीमतीप्रियकारी च श्रीमत्या पादपूजितः । श्रीसंसेवितपादाब्जो वेणुवाद्यविशारदः ॥ ११२॥ श
