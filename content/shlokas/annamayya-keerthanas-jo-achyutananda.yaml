id: annamayya-keerthanas-jo-achyutananda
category: stotram
name:
  english: Annamayya Keerthanas Jo Achyutananda
content:
  english: jo acyutananda jojo mukunda ravè paramananda rama govinda || angajuni ganna ma yanna yitu rara
    bangaru ginnèlo palu posera | dònga nivani satulu gònkucunnara mungita nadara mohanakara || sa govardhanambèlla
    gòduguga patti kavarammuna nunna kamsupadagòtti | nivu madhurapuramu nelacepatti thivito nelina devakipatti
    || caranam nandu nintanu jeri nayamu miṟanga candravadanalu niku seva ceyanga | nandamuga varindla
    naducundanga mandalaku dònga ma mudduranga || caranam sa palavarashilo pavalincinavu baluga munula
    kabhayamiccinavu | meluga vasudevu kudayincinavu baludai yundi gopaludainavu || caranam sa attugattina
    miga dattè tinnade patti kodalu mutipai rasinade | attè tinènani yatta yadaga vinnade gattiga nidi
    dònga kòttumannade || caranam sa gòllavarindlaku gòbbunakuboyi kòllaluga travi kundalanu neyi | cèlluna
    maganandra jèligi yishayi cillatanamulu seya jèllunatavoyi || caranam sa repallè satulèlla gopambutonu
    gopamma mi kòduku ma yindla lonu | mapugane vacci ma manamulanu ni papade cèṟicè nemandumamma || caranam
    sa òkani yalinidècci nòkani kadabètti jagadamulu kalipinci satipatulabatti | pagalu nalujamulunu baludai
    natti maganandra cepatti madanudai natti || caranam aligi trinavartu navani gulcitivi balimimai butana
    batti pilcitivi | cèlagi shakatasuruni jeri dòlcitivi talaci maddulu rèndu dharani vralcitivi || caranam
    sa hanguga tallapakannayya cala shringara racanaga cèppè ni jola | sangatiga sakala sampadala nivela
    mangalamu tirupatla madanagopala || jo acyutananda jojo mukunda ravè paramananda rama govinda ||
  devanagari: जो अच्युतानन्द जोजो मुकुन्दा रावॆ परमानन्द राम गोविन्दा ॥ अङ्गजुनि गन्न मा यन्न यिटु रारा
    बङ्गारु गिन्नॆलो पालु पोसेरा । दॊङ्ग नीवनि सतुलु गॊङ्कुचुन्नारा मुङ्गिट नाडरा मोहनाकार ॥ स गोवर्धनम्बॆल्ल
    गॊडुगुगा पट्टि कावरम्मुन नुन्न कंसुपडगॊट्टि । नीवु मधुरापुरमु नेलचेपट्टि ठीवितो नेलिन देवकीपट्टि ॥
    चरणं नन्दु निण्टनु जेरि नयमु मीऱङ्ग चन्द्रवदनलु नीकु सेव चेयङ्ग । नन्दमुग वारिण्ड्ल नाडुचुण्डङ्ग मन्दलकु
    दॊङ्ग मा मुद्दुरङ्ग ॥ चरणं स पालवाराशिलो पवलिञ्चिनावु बालुगा मुनुल कभयमिच्चिनावु । मेलुगा वसुदेवु
    कुदयिञ्चिनावु बालुडै युण्डि गोपालुडैनावु ॥ चरणं स अट्टुगट्टिन मीग डट्टॆ तिन्नाडे पट्टि कोडलु मूतिपै
    रासिनाडे । अट्टॆ तिनॆननि यत्त यडग विन्नाडे गट्टिगा निदि दॊङ्ग कॊट्टुमन्नाडे ॥ चरणं स गॊल्लवारिण्ड्लकु
    गॊब्बुनकुबोयि कॊल्ललुगा त्रावि कुण्डलनु नेयि । चॆल्लुना मगनाण्ड्र जॆलिगि यीशायी चिल्लतनमुलु सेय जॆल्लुनटवोयि
    ॥ चरणं स रेपल्लॆ सतुलॆल्ल गोपम्बुतोनु गोपम्म मी कॊडुकु मा यिण्ड्ल लोनु । मापुगाने वच्चि मा मानमुलनु
    नी पापडे चॆऱिचॆ नेमन्दुमम्म ॥ चरणं स ऒकनि यालिनिदॆच्चि नॊकनि कडबॆट्टि जगडमुलु कलिपिञ्चि सतिपतुलबट्टि
    । पगलु नलुजामुलुनु बालुडै नट्टि मगनाण्ड्र चेपट्टि मदनुडै नट्टि ॥ चरणं अलिगि तृणावर्तु नवनि गूल्चितिवि
    बलिमिमै बूतन बट्टि पील्चितिवि । चॆलगि शकटासुरुनि जेरि डॊल्चितिवि तलचि मद्दुलु रॆण्डु धरणि व्राल्चितिवि
    ॥ चरणं स हङ्गुगा ताल्लपाकन्नय्य चाल शृङ्गार रचनगा चॆप्पॆ नी जोल । सङ्गतिग सकल सम्पदल नीवेल मङ्गलमु
    तिरुपट्ल मदनगोपाल ॥ जो अच्युतानन्द जोजो मुकुन्दा रावॆ परमानन्द राम गोविन्दा ॥
