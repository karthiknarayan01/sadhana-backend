id: tripurasundarimanasapujastotram
category: stotram
name:
  english: tripurasundarimanasapujastotram
  devanagari: त्रिपुरसुन्दरीमानसपूजास्तोत्रम्
content:
  english: iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau tripurasundarimanasapujastotram sampurnam
  devanagari: इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ
    त्रिपुरसुन्दरीमानसपूजास्तोत्रं संपूर्णम्
meaning: {}
