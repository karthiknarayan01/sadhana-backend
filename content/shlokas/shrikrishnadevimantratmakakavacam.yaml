id: shrikrishnadevimantratmakakavacam
category: mantra
name:
  english: shrikrishnadevimantratmakakavacam
  devanagari: श्रीकृष्णदेवीमन्त्रात्मककवचम्
content:
  english: shrikrishnadevimantratmakakavacam || viniyogah || asya shrikrishnadevimantratmakakavacamantrasya
    | shakti rishih | anushtupchandah | shrikrishnadevi tarini devata | kri~ bijam | kli~ shaktih | hri~
    kilakam | sarvabhishtasiddhyarthe pathe viniyogah || || dhyanam || krishnam raktambaradharam nagayajnopavitinim
    | trinetram varadam devim tarinim pranamamyaham || || kavacam || kri~ bijam me shirah patu kalirupa
    sanatani | kli~ bijam lalate patu kamakalpadrumaprabha || 1|| krishnadevi drishau patu trailokyajnanadayini
    | hri~kararupini devi karnayugmam sadavatu || 2|| kri~kari nasikam patu kli~kari vadanam mama | tarini
    jihvikam patu vagvaibhavapradayini || 3|| hri~karamayi me dantan raktavarna sadavatu | devi kantham
    sada patu mahamayavimohini || 4|| kri~ kli~ hri~ hridayam patu sarvatantraikagopitam | krishnadevi
    stanadvandvam parashaktih sadavatu || 5|| nabhim me tarini patu brahmandambhojamadhyaga | katim kalapriya
    patu yoginikotisevita || 6|| guhyam me guhyavidya ca patu nityam paratpara | uru me vijayapatu janghe
    patu jayaprada || 7|| januni me mahavidya gulphau siddhipradayini | padau me patu satatam krishnadevi
    maheshvari || 8|| raktambara purvato mam dakshine bhishananana | pashcime patu mam tara uttare jnanarupini
    || 9|| agneye kalika patu nairitye bhairavi mama | vayavye patu me durga aishanyam tarini svayam ||
    10|| urdhve brahmamayi patvadhastat bhuvaneshvari | antarbahishca mam patu krishnadevi nirantaram
    || 11|| kri~karah patu me pranan kli~karah patvapanakam | hri~kara udanarupashca samanam vyanameva
    ca || 12|| mano buddhim tatha cittamahankaram ca sarvada | krishnadevi sada patu mahaghorapi sundari
    || 13|| vidyayam patu mam nityam vade patu sarasvati | yuddhe patu mahakali sabhayam vijayaprada ||
    14|| rajadvare mahadevi sangrame shatrumardini | aranye nirjane ghore tarini mam sadavatu || 15||
    jale sthale ca gagane svapne jagarane tatha | kri~ kli~ hri~ trayam patu krishnadevyah param vapuh
    || 16|| idam mantratmakam divyam kavacam mantravigraham | kri~ kli~ krishnadevi hri~ kri~ ai~ iti
    svarupakam || 17|| || iti shrikrishnadevimantratmakakavacam sampurnam ||
  devanagari: श्रीकृष्णदेवीमन्त्रात्मककवचम् ॥ विनियोगः ॥ अस्य श्रीकृष्णदेवीमन्त्रात्मककवचमन्त्रस्य । शक्ति
    ऋषिः । अनुष्टुप्छन्दः । श्रीकृष्णदेवी तारिणी देवता । क्रीँ बीजम् । क्लीँ शक्तिः । ह्रीँ कीलकम् । सर्वाभीष्टसिद्ध्यर्थे
    पाठे विनियोगः ॥ ॥ ध्यानम् ॥ कृष्णां रक्ताम्बरधरां नागयज्ञोपवीतिनीम् । त्रिनेत्रां वरदां देवीं तारिणीं
    प्रणमाम्यहम् ॥ ॥ कवचम् ॥ क्रीँ बीजं मे शिरः पातु कालीरूपा सनातनी । क्लीँ बीजं ललाटे पातु कामकल्पद्रुमप्रभा
    ॥ १॥ कृष्णदेवी दृशौ पातु त्रैलोक्यज्ञानदायिनी । ह्रीँकाररूपिणी देवी कर्णयुग्मं सदावतु ॥ २॥ क्रीँकारी
    नासिकां पातु क्लीँकारी वदनं मम । तारिणी जिह्विकां पातु वाग्वैभवप्रदायिनी ॥ ३॥ ह्रीँकारमयी मे दन्तान्
    रक्तवर्णा सदावतु । देवी कण्ठं सदा पातु महामायाविमोहिनी ॥ ४॥ क्रीँ क्लीँ ह्रीँ हृदयं पातु सर्वतन्त्रैकगोपितम्
    । कृष्णदेवी स्तनद्वन्द्वं पराशक्तिः सदावतु ॥ ५॥ नाभिं मे तारिणी पातु ब्रह्माण्डाम्भोजमध्यगा । कटीं
    कालप्रिया पातु योगिनीकोटिसेविता ॥ ६॥ गुह्यं मे गुह्यविद्या च पातु नित्यं परात्परा । ऊरू मे विजयापातु
    जङ्घे पातु जयप्रदा ॥ ७॥ जानुनी मे महाविद्या गुल्फौ सिद्धिप्रदायिनी । पादौ मे पातु सततं कृष्णदेवी महेश्वरी
    ॥ ८॥ रक्ताम्बरा पूर्वतो मां दक्षिणे भीषणानना । पश्चिमे पातु मां तारा उत्तरे ज्ञानरूपिणी ॥ ९॥ आग्नेये
    कालिका पातु नैऋत्ये भैरवी मम । वायव्ये पातु मे दुर्गा ऐशान्यां तारिणी स्वयम् ॥ १०॥ ऊर्ध्वे ब्रह्ममयी
    पात्वधस्तात् भुवनेश्वरी । अन्तर्बहिश्च मां पातु कृष्णदेवी निरन्तरम् ॥ ११॥ क्रीँकारः पातु मे प्राणान्
    क्लीँकारः पात्वपानकम् । ह्रीँकार उदानरूपश्च समानं व्यानमेव च ॥ १२॥ मनो बुद्धिं तथा चित्तमहङ्कारं च
    सर्वदा । कृष्णदेवी सदा पातु महाघोरापि सुन्दरी ॥ १३॥ विद्यायां पातु मां नित्यं वादे पातु सरस्वती ।
    युद्धे पातु महाकाली सभायां विजयप्रदा ॥ १४॥ राजद्वारे महादेवी सङ्ग्रामे शत्रुमर्दिनी । अरण्ये निर्जने
    घोरे तारिणी मां सदावतु ॥ १५॥ जले स्थले च गगने स्वप्ने जागरणे तथा । क्रीँ क्लीँ ह्रीँ त्रयं पातु कृष्णदेव्याः
    परं वपुः ॥ १६॥ इदं मन्त्रात्मकं दिव्यं कवचं मन्त्रविग्रहम् । क्रीँ क्लीँ कृष्णदेवी ह्रीँ क्रीँ ऐँ
    इति स्वरूपकम् ॥ १७॥ ॥ इति श्रीकृष्णदेवीमन्त्रात्मककवचं सम्पूर्णम् ॥
