id: andhakakritam5shivastotram
category: stotram
name:
  english: andhakakritam5shivastotram
  devanagari: अन्धककृतं५शिवस्तोत्रम्
content:
  english: andhakakritam 5 shivastotram andhaka uvaca | kritsnasya yo'sya jagatah sacaracarasya karta
    kritasya ca tatha sukhaduhkhadata | samsaraheturapi yah punarantakale tam shankaram sharanadam sharanam
    vrajami || 11|| yam yogino vigatamohatamorajaska bhaktyaikatanamanaso vinivrittakamah | dhyayanti
    ye'khiladhiyo'mitadivyabhutim tam shankaram sharanadam sharanam vrajami || 12|| yashcandrakhandamamalam
    vilasanmayukham baddhva sada surasaricchirasa bibharti | yasyardhadehamabhajadgirirajaputri tam shankaram
    sharanadam sharanam vrajami || 13|| yah siddhacarananishevitapadapadmo gangam mahormivishamam gaganatpatantim
    | murdhna dadhe srajamiva trijagatpunantim tam shankaram sharanadam sharanam vrajami || 14|| kailasashailashikharam
    pravikampyamanam kailasasha
  devanagari: अन्धककृतं ५ शिवस्तोत्रम् अन्धक उवाच । कृत्स्नस्य योऽस्य जगतः सचराचरस्य कर्ता कृतस्य च तथा
    सुखदुःखदाता । संसारहेतुरपि यः पुनरन्तकाले तं शङ्करं शरणदं शरणं व्रजामि ॥ ११॥ यं योगिनो विगतमोहतमोरजस्का
    भक्त्यैकतानमनसो विनिवृत्तकामाः । ध्यायन्ति येऽखिलधियोऽमितदिव्यभूतिं तं शङ्करं शरणदं शरणं व्रजामि ॥
    १२॥ यश्चन्द्रखण्डममलं विलसन्मयूखं बद्ध्वा सदा सुरसरिच्छिरसा बिभर्ति । यस्यार्धदेहमभजद्गिरिराजपुत्री
    तं शङ्करं शरणदं शरणं व्रजामि ॥ १३॥ यः सिद्धचारणनिषेवितपादपद्मो गङ्गां महोर्मिविषमां गगनात्पतन्तीम्
    । मूर्ध्ना दधे स्रजमिव त्रिजगत्पुनन्तीं तं शङ्करं शरणदं शरणं व्रजामि ॥ १४॥ कैलासशैलशिखरं प्रविकम्प्यमानं
    कैलासश
