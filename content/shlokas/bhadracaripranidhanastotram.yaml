id: bhadracaripranidhanastotram
category: stotram
name:
  english: bhadracaripranidhanastotram
  devanagari: भद्रचरीप्रणिधानस्तोत्रम्
content:
  english: yavata keci dashaddishi loke sarvatriyadhvagata narasimhah | tanahu vandami sarvi asheshan
    kayatu vaca manena prasannah || 1|| kshetrarajopamakayapramanaih sarvajinana karomi pranamam | sarvajinabhimukhena
    manena bhadracaripranidhanabalena || 2|| ekarajagri rajopamabuddha buddhasutana nishannaku madhye
    | evamasheshata dharmatadhatum sarvadhimucyami purnajinebhi || 3|| teshu ca akshayavarnasamudran sarvasvarangasamudrarutebhih
    | sarvajinana gunan bhanamanastan sugatan stavami ahu sarvan || 4|| pushpavarebhi ca malyavarebhirvadyavilepanachatravarebhih
    | dipavarebhi ca dhupavarebhih pujana tesha jinana karomi || 5|| vastravarebhi ca gandhavarebhishcurnaputebhi
    ca merusamebhih | sarvavishishtaviyuhavarebhih pujana tesha jinana karomi || 6|| ya ca anuttarapuja
    udara tanadhimucyami sarvajinanam | bhadracari adhimuktibalena vandami pujayami jinasarvan || 7||
    yacca kritam mayi papu bhaveyya ragatu dveshatu mohavashena | kayatu vaca manena tathaiva tam pratideshayami
    ahu sarvam || 8|| yacca dashaddishi punya jagasya shaiksha ashaikshapratyekajinanam | buddhasutanatha
    sarvajinanam tamanumodayami ahu sarvam || 9|| ye ca dashaddishi lokapradipa bodhivibuddha asangatapraptah
    | tanahu sarvi adhyeshami nathan cakru anuttaru vartanatayai || 10|| ye'pi ca nirvriti darshitukamastanabhiyacami
    pranjalibhutah | kshetrarajopamakalpa nihantu sarvajagasya hitaya sukhaya || 11|| vandanapujanadeshanataya
    modanadhyeshanayacanataya | yacca shubham mayi sancitu kincidbodhayi namayami ahu sarvam || 12|| pujita
    bhontu atitaka buddha ye ca dhriyanti dashaddishi loke | ye ca anagata te laghu bhontu purnamanoratha
    bodhivibuddhah || 13|| yavata keci dashaddishi kshetraste parishuddha bhavantu udarah | bodhidrumendragatebhi
    jinebhirbuddhasutebhi ca bhontu prapurnah || 14|| yavata keci dashaddishi sattvaste sukhita sada bhontu
    arogah | sarvajagasya ca dharmiku artho bhontu pradakshinu ridhyatu ashah || 15|| bodhicarim ca aham
    caramano bhavi jatismaru sarvagatishu | sarvasu janmasu cyutyupapatti pravrajito ahu nityu bhaveyya
    || 16|| sarvajinanushikshayamano bhadracarim paripurayamanah | shilacarim vimalam parishuddham nityamakhandamachidra
    careyam || 17|| devarutebhi ca nagarutebhiryakshakumbhandamanushyarutebhih | yani ca sarvarutani jagasya
    sarvaruteshvahu deshayi dharmam || 18|| ye khalu paramitasvabhiyukto bodhiyi cittu na jatu vimuhyet
    | ye'pi ca papaka avaranayasteshu parikshayu bhotu ashesham || 19|| karmatu kleshatu marapathato lokagatishu
    vimuktu careyam | padma yatha salilena aliptah suryashashi gaganeva asaktah || 20|| sarvi apayadukham
    prashamanto sarvajagat sukhi sthapayamanah | sarvajagasya hitaya careyam yavata kshetrapatha dishatasu
    || 21|| sattvacarimanuvartayamanoi bodhicarim paripurayamanah | bhadracarim ca prabhavayamanah sarvi
    anagatakalpa careyam || 22|| ye ca sabhagata mama caryaye tebhi samagamu nityu bhaveyya | kayatu vacatu
    cetanato ca ekacari pranidhana careyam || 23|| ye'pi ca mitra mama hitakama bhadracariya nidarshayitarah
    | tebhi samagamu nityu bhaveyya tamshca aham na viragayi jatu || 24|| sammukha nityamaham jina pashye
    buddhasutebhi parivritu nathan | teshu ca puja kareyu udaram sarvi anagatakalpamakhinnah || 25|| dharayamanu
    jinana saddharmam bodhicarim paridipayamanah | bhadracarim ca vishodhayamanah sarvi anagatakalpa careyam
    || 26|| sarvabhaveshu ca sancaramanah punyatu jnanatu akshayapraptah | prajnaupayasamadhivimokshaih
    sarvagunairbhavi akshayakoshah || 27|| ekarajagri rajopamakshetra tatra ca kshetri acintiyabuddhan
    | buddhasutana nishannaku madhye pashyiya bodhicarim caramanah || 28|| evamasheshata sarvadishasu
    balapatheshu triyadhvapramanan | buddhasamudra tha kshetrasamudranotari carikakalpasamudran || 29||
    ekasvarangasamudrarutebhih sarvajinana svarangavishuddhim | sarvajinana yathashayaghoshan buddhasarasvatimotari
    nityam || 30|| teshu ca akshayaghosharuteshu sarvatriyadhvagatana jinanam | cakranayam parivartayamano
    buddhibalena aham pravisheyam || 31|| ekakshanena anagatasarvan kalpapravesha aham pravisheyam | ye'pi
    ca kalpa triyadhvapramanastan kshanakotipravishta careyam || 32|| ye ca triyadhvagata narasimhastanahu
    pashyiya ekakshanena | teshu ca gocarimotari nityam mayagatena vimokshabalena || 33|| ye ca triyadhvasukshetraviyuhastanabhinirhari
    ekarajagre | evamasheshata sarvadishasu otari kshetraviyuha jinanam || 34|| ye ca anagata lokapradipasteshu
    vibudhyana cakrapravrittim | nirvritidarshananishtha prashantim sarvi ahamupasankrami nathan || 35||
    riddhibalena samantajavena jnanabalena samantamukhena | caryabalena samantagunena maitrabalena samantagatena
    || 36|| punyabalena samantashubhena jnanabalena asangagatena | prajnaupayasamadhibalena bodhibalam
    samudanayamanah || 37|| karmabalam parishodhayamanah kleshabalam parimardayamanah | marabalamabalam
    karamanah purayi bhadracaribala sarvan || 38|| kshetrasamudra vishodhayamanah sattvasamudra vimocayamanah
    | dharmasamudra vipashyayamano jnanasamudra vigahayamanah || 39|| caryasamudra vishodhayamanah pranidhisamudra
    prapurayamanah | buddhasamudra prapujayamanah kalpasamudra careyamakhinnah || 40|| ye ca triyadhvagatana
    jinanam bodhicaripranidhanavisheshah | tanahu purayi sarvi asheshat bhadracariya bibudhyiya bodhim
    || 41|| jyeshthaku yah sutu sarvajinanam yasya ca nama samantatabhadrah | tasya vidusya sabhagacariye
    namayami kushalam imu sarvam || 42|| kayatu vaca manasya vishuddhishcaryavishuddhyatha kshetravishuddhih
    | yadrishanamana bhadravidusya tadrisha bhotu samam mama tena || 43|| bhadracariya samantashubhaye
    manjushiripranidhana careyam | sarvi anagata kalpamakhinnah purayi tam kriya sarvi ashesham || 44||
    no ca pramanu bhaveyya cariye no ca pramanu bhaveyya gunanam | apramanu cariyaya sthihitva janami
    sarvi vikurvitu tesham || 45|| yavata nishtha nabhasya bhaveyya sattva asheshata nishtha tathaiva
    | karmatu kleshatu yavata nishtha tavata nishtha mama pranidhanam || 46|| ye ca dashaddishi kshetra
    ananta ratnalankritu dadyu jinanam | divya ca manusha saukhyavishishtam kshetrarajopama kalpa dadeyam
    || 47|| yashca imam parinamanarajam shrutva sakrijjanayedadhimuktim | bodhivaramanuprarthayamano agru
    vishishta bhavedimu punyam || 48|| varjita tena bhavanti apaya varjita tena bhavanti kumitrah | kshipru
    sa pashyati tam amitabham yasyimu bhadracari pranidhanam || 49|| labha sulabdha sajivitu tesham svagata
    te imu manushajanma | yadrishu so hi samantatabhadraste'pi tatha nacirena bhavanti || 50|| papaka
    panca anantariyani yena ajnanavashena kritani | so imu bhadracarim bhanamanah kshipru parikshayu neti
    ashesham || 51|| jnanatu rupatu lakshanatashca varnatu gotratu bhotirupetah | tirthikamaraganebhiradhrishyah
    pujitu bhoti sa sarvatriloke || 52|| kshipru sa gacchati bodhidrumendram gatva nishidati sattvahitaya
    | buddhyati bodhi pravartayi cakram dharshati maru sasainyaku sarvam || 53|| yo imu bhadracaripranidhanam
    dharayi vacayi deshayito va | buddhavijanati yo'tra vipako bodhi vishishta ma kanksha janetha || 54||
    manjushiri yatha janati shurah so ca samantatabhadra tathaiva | teshu aham anushikshayamano namayami
    kushalam imu sarvam || 55|| sarvatriyadhvagatebhi jinebhirya parinamana varnita agra | taya aham kushalam
    imu sarvam namayami vara bhadracariye || 56|| kalakriyam ca aham karamano avaranan vinivartiya sarvan
    | sammukha pashyiya tam amitabham tam ca sukhavatikshetra vrajeyam || 57|| tatra gatasya imi pranidhana
    amukhi sarvi bhaveyyu samagra | tamshca aham paripurya asheshan sattvahitam kariyavata loke || 58||
    tahi jinamandali shobhaniramye padmavare rucire upapannah | vyakaranam ahu tatra labheyya sammukhato
    amitabhajinasya || 59|| vyakaranam pratilabhya ca tasmin nirmita kotishatebhiranekaih | sattvahitani
    bahunyahu kuryam dikshu dashasvapi buddhibalena || 60|| bhadracaripranidhana pathitva yatkushalam
    mayi sancitu kincit | ekakshanena samridhyatu sarvam tena jagasya shubham pranidhanam || 61|| bhadracarim
    parinamya yadaptam punyamanantamativa vishishtam | tena jagadvayasanaughanimagnam yatvamitabhapurim
    varameva || 62|| iti shri bhadracaripranidhanastotram sampurnam ||
  devanagari: यावत केचि दशद्दिशि लोके सर्वत्रियध्वगता नरसिंहाः । तानहु वन्दमि सर्वि अशेषान् कायतु वाच
    मनेन प्रसन्नः ॥ १॥ क्षेत्ररजोपमकायप्रमाणैः सर्वजिनान करोमि प्रणामम् । सर्वजिनाभिमुखेन मनेन भद्रचरीप्रणिधानबलेन
    ॥ २॥ एकरजाग्रि रजोपमबुद्धा बुद्धसुतान निषण्णकु मध्ये । एवमशेषत धर्मतधातुं सर्वधिमुच्यमि पूर्णजिनेभि
    ॥ ३॥ तेषु च अक्षयवर्णसमुद्रान् सर्वस्वराङ्गसमुद्ररुतेभिः । सर्वजिनान गुणान् भणमानस्तान् सुगतान् स्तवमी
    अहु सर्वान् ॥ ४॥ पुष्पवरेभि च माल्यवरेभिर्वाद्यविलेपनछत्रवरेभिः । दीपवरेभि च धूपवरेभिः पूजन तेष जिनान
    करोमि ॥ ५॥ वस्त्रवरेभि च गन्धवरेभिश्चूर्णपुटेभि च मेरुसमेभिः । सर्वविशिष्टवियूहवरेभिः पूजन तेष जिनान
    करोमि ॥ ६॥ या च अनुत्तरपूज उदारा तानधिमुच्यमि सर्वजिनानाम् । भद्रचरी अधिमुक्तिबलेन वन्दमि पूजयमी जिनसर्वान्
    ॥ ७॥ यच्च कृतं मयि पापु भवेय्या रागतु द्वेषतु मोहवशेन । कायतु वाच मनेन तथैव तं प्रतिदेशयमी अहु सर्वम्
    ॥ ८॥ यच्च दशद्दिशि पुण्य जगस्य शैक्ष अशैक्षप्रत्येकजिनानाम् । बुद्धसुतानथ सर्वजिनानां तमनुमोदयमी अहु
    सर्वम् ॥ ९॥ ये च दशद्दिशि लोकप्रदीपा बोधिविबुद्ध असङ्गतप्राप्ताः । तानहु सर्वि अध्येषमि नाथान् चक्रु
    अनुत्तरु वर्तनतायै ॥ १०॥ येऽपि च निर्वृति दर्शितुकामास्तानभियाचमि प्राञ्जलिभूतः । क्षेत्ररजोपमकल्प
    निहन्तु सर्वजगस्य हिताय सुखाय ॥ ११॥ वन्दनपूजनदेशनताय मोदनध्येषणयाचनताय । यच्च शुभं मयि सञ्चितु किञ्चिद्बोधयि
    नामयमी अहु सर्वम् ॥ १२॥ पूजित भोन्तु अतीतक बुद्धा ये च ध्रियन्ति दशद्दिशि लोके । ये च अनागत ते लघु
    भोन्तु पूर्णमनोरथ बोधिविबुद्धाः ॥ १३॥ यावत केचि दशद्दिशि क्षेत्रास्ते परिशुद्ध भवन्तु उदाराः । बोधिद्रुमेन्द्रगतेभि
    जिनेभिर्बुद्धसुतेभि च भोन्तु प्रपूर्णाः ॥ १४॥ यावत केचि दशद्दिशि सत्त्वास्ते सुखिता सद भोन्तु अरोगाः
    । सर्वजगस्य च धर्मिकु अर्थो भोन्तु प्रदक्षिणु ऋध्यतु आशाः ॥ १५॥ बोधिचरिं च अहं चरमाणो भवि जातिस्मरु
    सर्वगतीषु । सर्वसु जन्मसु च्युत्युपपत्ती प्रव्रजितो अहु नित्यु भवेय्या ॥ १६॥ सर्वजिनानुशिक्षयमाणो
    भद्रचरिं परिपूरयमाणः । शीलचरिं विमलां परिशुद्धां नित्यमखण्डमछिद्र चरेयम् ॥ १७॥ देवरुतेभि च नागरुतेभिर्यक्षकुम्भाण्डमनुष्यरुतेभिः
    । यानि च सर्वरुतानि जगस्य सर्वरुतेष्वहु देशयि धर्मम् ॥ १८॥ ये खलु पारमितास्वभियुक्तो बोधियि चित्तु
    न जातु विमुह्येत् । येऽपि च पापक आवरणायास्तेषु परिक्षयु भोतु अशेषम् ॥ १९॥ कर्मतु क्लेशतु मारपथातो
    लोकगतीषु विमुक्तु चरेयम् । पद्म यथा सलिलेन अलिप्तः सूर्यशशी गगनेव असक्तः ॥ २०॥ सर्वि अपायदुखां प्रशमन्तो
    सर्वजगत् सुखि स्थापयमानः । सर्वजगस्य हिताय चरेयं यावत क्षेत्रपथा दिशतासु ॥ २१॥ सत्त्वचरिमनुवर्तयमानोइ
    बोधिचरिं परिपूरयमाणः । भद्रचरिं च प्रभावयमानः सर्वि अनागतकल्प चरेयम् ॥ २२॥ ये च सभागत मम चर्याये तेभि
    समागमु नित्यु भवेय्या । कायतु वाचतु चेतनतो चा एकचरि प्रणिधान चरेयम् ॥ २३॥ येऽपि च मित्रा मम हितकामा
    भद्रचरीय निदर्शयितारः । तेभि समागमु नित्यु भवेय्या तांश्च अहं न विरागयि जातु ॥ २४॥ सम्मुख नित्यमहं
    जिन पश्ये बुद्धसुतेभि परीवृतु नाथान् । तेषु च पूज करेयु उदारां सर्वि अनागतकल्पमखिन्नः ॥ २५॥ धारयमाणु
    जिनान सद्धर्मं बोधिचरिं परिदीपयमानः । भद्रचरिं च विशोधयमानः सर्वि अनागतकल्प चरेयम् ॥ २६॥ सर्वभवेषु
    च सञ्चरमाणः पुण्यतु ज्ञानतु अक्षयप्राप्तः । प्रज्ञौपायसमाधिविमोक्षैः सर्वगुणैर्भवि अक्षयकोशः ॥ २७॥
    एकरजाग्रि रजोपमक्षेत्रा तत्र च क्षेत्रि अचिन्तियबुद्धान् । बुद्धसुतान निषण्णकु मध्ये पश्यिय बोधिचरिं
    चरमाणः ॥ २८॥ एवमशेषत सर्वदिशासु बालपथेषु त्रियध्वप्रमाणान् । बुद्धसमुद्र थ क्षेत्रसमुद्रानोतरि चारिककल्पसमुद्रान्
    ॥ २९॥ एकस्वराङ्गसमुद्ररुतेभिः सर्वजिनान स्वराङ्गविशुद्धिम् । सर्वजिनान यथाशयघोषान् बुद्धसरस्वतिमोतरि
    नित्यम् ॥ ३०॥ तेषु च अक्षयघोषरुतेषु सर्वत्रियध्वगतान जिनानाम् । चक्रनयं परिवर्तयमानो बुद्धिबलेन अहं
    प्रविशेयम् ॥ ३१॥ एकक्षणेन अनागतसर्वान् कल्पप्रवेश अहं प्रविशेयम् । येऽपि च कल्प त्रियध्वप्रमाणास्तान्
    क्षणकोटिप्रविष्ट चरेयम् ॥ ३२॥ ये च त्रियध्वगता नरसिंहास्तानहु पश्यिय एकक्षणेन । तेषु च गोचरिमोतरि
    नित्यं मायगतेन विमोक्षबलेन ॥ ३३॥ ये च त्रियध्वसुक्षेत्रवियूहास्तानभिनिर्हरि एकरजाग्रे । एवमशेषत सर्वदिशासु
    ओतरि क्षेत्रवियूह जिनानाम् ॥ ३४॥ ये च अनागत लोकप्रदीपास्तेषु विबुध्यन चक्रप्रवृत्तिम् । निर्वृतिदर्शननिष्ठ
    प्रशान्तिं सर्वि अहमुपसङ्क्रमि नाथान् ॥ ३५॥ ऋद्धिबलेन समन्तजवेन ज्ञानबलेन समन्तमुखेन । चर्यबलेन समन्तगुणेन
    मैत्रबलेन समन्तगतेन ॥ ३६॥ पुण्यबलेन समन्तशुभेन ज्ञानबलेन असङ्गगतेन । प्रज्ञौपायसमाधिबलेन बोधिबलं समुदानयमानः
    ॥ ३७॥ कर्मबलं परिशोधयमानः क्लेशबलं परिमर्दयमानः । मारबलमबलं करमाणः पूरयि भद्रचरीबल सर्वान् ॥ ३८॥ क्षेत्रसमुद्र
    विशोधयमानः सत्त्वसमुद्र विमोचयमानः । धर्मसमुद्र विपश्ययमानो ज्ञानसमुद्र विगाहयमानः ॥ ३९॥ चर्यसमुद्र
    विशोधयमानः प्रणिधिसमुद्र प्रपूरयमाणः । बुद्धसमुद्र प्रपूजयमानः कल्पसमुद्र चरेयमखिन्नः ॥ ४०॥ ये च त्रियध्वगतान
    जिनानां बोधिचरिप्रणिधानविशेषाः । तानहु पूरयि सर्वि अशेषात् भद्रचरीय बिबुध्यिय बोधिम् ॥ ४१॥ ज्येष्ठकु
    यः सुतु सर्वजिनानां यस्य च नाम समन्ततभद्रः । तस्य विदुस्य सभागचरीये नामयमी कुशलं इमु सर्वम् ॥ ४२॥
    कायतु वाच मनस्य विशुद्धिश्चर्यविशुद्ध्यथ क्षेत्रविशुद्धिः । यादृशनामन भद्रविदुस्य तादृश भोतु समं मम
    तेन ॥ ४३॥ भद्रचरीय समन्तशुभाये मञ्जुशिरिप्रणिधान चरेयम् । सर्वि अनागत कल्पमखिन्नः पूरयि तां क्रिय
    सर्वि अशेषाम् ॥ ४४॥ नो च प्रमाणु भवेय्य चरीये नो च प्रमाणु भवेय्य गुणानाम् । अप्रमाणु चरियाय स्थिहित्वा
    जानमि सर्वि विकुर्वितु तेषाम् ॥ ४५॥ यावत निष्ठ नभस्य भवेय्या सत्त्व अशेषत निष्ठ तथैव । कर्मतु क्लेशतु
    यावत निष्ठा तावत निष्ठ मम प्रणिधानम् ॥ ४६॥ ये च दशद्दिशि क्षेत्र अनन्ता रत्नालङ्कृतु दद्यु जिनानाम्
    । दिव्य च मानुष सौख्यविशिष्टां क्षेत्ररजोपम कल्प ददेयम् ॥ ४७॥ यश्च इमं परिणामनराजं श्रुत्व सकृज्जनयेदधिमुक्तिम्
    । बोधिवरामनुप्रार्थयमानो अग्रु विशिष्ट भवेदिमु पुण्यम् ॥ ४८॥ वर्जित तेन भवन्ति अपाया वर्जित तेन भवन्ति
    कुमित्राः । क्षिप्रु स पश्यति तं अमिताभं यस्यिमु भद्रचरि प्रणिधानम् ॥ ४९॥ लाभ सुलब्ध सजीवितु तेषां
    स्वागत ते इमु मानुषजन्म । यादृशु सो हि समन्ततभद्रस्तेऽपि तथा नचिरेण भवन्ति ॥ ५०॥ पापक पञ्च अनन्तरियाणि
    येन अज्ञानवशेन कृतानि । सो इमु भद्रचरिं भणमानः क्षिप्रु परिक्षयु नेति अशेषम् ॥ ५१॥ ज्ञानतु रूपतु लक्षणतश्च
    वर्णतु गोत्रतु भोतिरूपेतः । तीर्थिकमारगणेभिरधृष्यः पूजितु भोति स सर्वत्रिलोके ॥ ५२॥ क्षिप्रु स गच्छति
    बोधिद्रुमेन्द्रं गत्व निषीदति सत्त्वहिताय । बुद्ध्यति बोधि प्रवर्तयि चक्रं धर्षति मारु ससैन्यकु सर्वम्
    ॥ ५३॥ यो इमु भद्रचरिप्रणिधानं धारयि वाचयि देशयितो वा । बुद्धविजानति योऽत्र विपाको बोधि विशिष्ट म काङ्क्ष
    जनेथ ॥ ५४॥ मञ्जुशिरी यथ जानति शूरः सो च समन्ततभद्र तथैव । तेषु अहं अनुशिक्षयमाणो नामयमी कुशलं इमु
    सर्वम् ॥ ५५॥ सर्वत्रियध्वगतेभि जिनेभिर्या परिणामन वर्णित अग्रा । ताय अहं कुशलं इमु सर्वं नामयमी वर
    भद्रचरीये ॥ ५६॥ कालक्रियां च अहं करमाणो आवरणान् विनिवर्तिय सर्वान् । सम्मुख पश्यिय तं अमिताभं तं च
    सुखावतिक्षेत्र व्रजेयम् ॥ ५७॥ तत्र गतस्य इमि प्रणिधाना आमुखि सर्वि भवेय्यु समग्रा । तांश्च अहं परिपूर्य
    अशेषान् सत्त्वहितं करियावत लोके ॥ ५८॥ तहि जिनमण्डलि शोभनिरम्ये पद्मवरे रूचिरे उपपन्नः । व्याकरणं अहु
    तत्र लभेय्या सम्मुखतो अमिताभजिनस्य ॥ ५९॥ व्याकरणं प्रतिलभ्य च तस्मिन् निर्मित कोटिशतेभिरनेकैः । सत्त्वहितानि
    बहून्यहु कुर्यां दिक्षु दशस्वपि बुद्धिबलेन ॥ ६०॥ भद्रचरिप्रणिधान पठित्वा यत्कुशलं मयि सञ्चितु किञ्चित्
    । एकक्षणेन समृध्यतु सर्वं तेन जगस्य शुभं प्रणिधानम् ॥ ६१॥ भद्रचरिं परिणाम्य यदाप्तं पुण्यमनन्तमतीव
    विशिष्टम् । तेन जगद्वयसनौघनिमग्नं यात्वमिताभपुरिं वरमेव ॥ ६२॥ इति श्री भद्रचरीप्राणिधानस्तोत्रं सम्पूर्णम्
    ॥
