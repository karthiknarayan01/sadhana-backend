id: vedamantramanjari-2
category: mantra
name:
  english: vedamantramanjari 2
  devanagari: वेदमन्त्रमन्जरि २
content:
  english: 2 harih om || om shri gurubhyo namah harih om || || mangalacaranam || shuklambaradharam vishnum
    shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || 1|| agajanana padmarkam
    gajananamaharnisham | anekadam tam bhaktanam ekadantamupasmahe || 2|| vagarthaviva sampriktau vagarthapratipattaye
    | jagatah pitarau vande parvatiparameshvarau || 3|| gururbrahma gururvishnuh gururdevo maheshvarah
    | gurussakshat parabrahma tasmai shri gurave namah || 4|| angikam bhuvanam yasya vacikam sarvavanmayam
    | aharyam candra taradi tam numah satvikam shivam || 5|| sarvamangalamangalye shive sarvarthasadhike
    | sharanye tryambake gauri narayani namo'stute || 6|| sarasvati namastubhyam varade kamarupini | vidyarambham
    karishyami siddhirbhavatu me sada || 7|| tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva
    | tvameva vidya dravinam tvameva tvameva sarvam mama deva deva || 8|| kayena vaca manasendriyairva
    budhyatmana va prakriteh svabhavat | karomi yadyatsakalam parasmai narayanayeti samarpayami || 9||
    om asato ma sadgamaya | tamaso ma jyotirgamaya | mrityorma amritam gamaya || 10|| om bhuh om bhuvah
    om suvah om mahah om janah om tapah om satyam | om tatsa̭vi̱turvare
  devanagari: २ हरिः ॐ ॥ ॐ श्री गुरुभ्यो नमः हरिः ॐ ॥ ॥ मङ्गलाचरणम् ॥ शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ १॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां
    एकदन्तमुपास्महे ॥ २॥ वागर्थाविव सम्पृक्तौ वागर्थप्रतिपत्तये । जगतः पितरौ वन्दे पार्वतीपरमेश्वरौ ॥
    ३॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुस्साक्षात् परब्रह्म तस्मै श्री गुरवे नमः
    ॥ ४॥ आङ्गिकं भुवनं यस्य वाचिकं सर्ववाङ्मयम् । आहार्यं चन्द्र तारादि तं नुमः सात्विकं शिवम् ॥ ५॥ सर्वमङ्गलमाङ्गल्ये
    शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तुते ॥ ६॥ सरस्वति नमस्तुभ्यं वरदे कामरूपिणि
    । विद्यारम्भं करिष्यामि सिद्धिर्भवतु मे सदा ॥ ७॥ त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव
    । त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं मम देव देव ॥ ८॥ कायेन वाचा मनसेन्द्रियैर्वा बुध्यात्मना
    वा प्रकृतेः स्वभावात् । करोमि यद्यत्सकलं परस्मै नारायणायेति समर्पयामि ॥ ९॥ ॐ असतो मा सद्गमय । तमसो
    मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय ॥ १०॥ ॐ भूः ॐ भुवः ॐ सुवः ॐ महः ॐ जनः ॐ तपः ॐ सत्यम् । ॐ तत्स॑वि॒तुर्वरे
