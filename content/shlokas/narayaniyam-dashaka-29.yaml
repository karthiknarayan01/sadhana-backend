id: narayaniyam-dashaka-29
category: stotram
name:
  english: Narayaniyam Dashaka 29
content:
  english: udgacchatastava karadamritam haratsu daityeshu tanasharanananuniya devan | sadyastirodadhitha
    deva bhavatprabhava dudyatsvayuthyakalaha ditija babhuvuh || || shyamam ruca'pi vayasa'pi tanum tadanim
    prapto'si tungakucamandalabhanguram tvam | piyushakumbhakalaham parimucya sarve trishnakulah pratiyayustvadurojakumbhe
    || || ka tvam mrigakshi vibhajasva sudhamimami tyarudharagavivashanabhiyacato'mun | vishvasyate mayi
    katham kulata'smi daitya ityalapannapi suvishvasitanatanih || || modat sudhakalashameshu dadatsu sa
    tvam dushceshtitam mama sahadhvamiti bruvana | panktiprabhedaviniveshitadevadaitya lilavilasagatibhih
    samadah sudham tam || || asmasviyam pranayinityasureshu teshu josham sthiteshvatha samapya sudham
    sureshu | tvam bhaktalokavashago nijarupametya svarbhanumardhaparipitasudham vyalavih || || tvattah
    sudhaharanayogyaphalam pareshu datva gate tvayi suraih khalu te vyagrihnan | ghore'tha murchati rane
    balidaityamaya vyamohite suragane tvamihavirasih || || tvam kalanemimatha malimukhanjaghantha shakro
    jaghana balijambhavalan sapakan | shushkardradushkaravadhe namucau ca lune phenena naradagira nyaruno
    ranam tvam || || yoshavapurdanujamohanamahitam te shrutva vilokanakutuhalavan maheshah | bhutaissamam
    girijaya ca gatah padam te stutva'bravidabhimatam tvamatho tirodhah || || aramasimani ca kandukaghatalila
    lolayamananayanam kamanim manojnam | tvamesha vikshya vigaladvasanam manobhu vegadanangaripuranga
    samalilinga || || bhuyo'pi vidrutavatimupadhavya devo viryapramokshavikasatparamarthabodhah | tvanmanitastava
    mahattvamuvaca devyai tattadrishastvamava vataniketanatha ||
  devanagari: उद्गच्छतस्तव करादमृतं हरत्सु दैत्येषु तानशरणाननुनीय देवान् । सद्यस्तिरोदधिथ देव भवत्प्रभावा
    दुद्यत्स्वयूथ्यकलहा दितिजा बभूवुः ॥ ॥ श्यामां रुचाऽपि वयसाऽपि तनुं तदानीं प्राप्तोऽसि तुङ्गकुचमण्डलभङ्गुरां
    त्वम् । पीयूषकुम्भकलहं परिमुच्य सर्वे तृष्णाकुलाः प्रतिययुस्त्वदुरोजकुम्भे ॥ ॥ का त्वं मृगाक्षि विभजस्व
    सुधामिमामि त्यारूढरागविवशानभियाचतोऽमून् । विश्वस्यते मयि कथं कुलटाऽस्मि दैत्या इत्यालपन्नपि सुविश्वसितानतानीः
    ॥ ॥ मोदात् सुधाकलशमेषु ददत्सु सा त्वं दुश्चेष्टितं मम सहध्वमिति ब्रुवाणा । पङ्क्तिप्रभेदविनिवेशितदेवदैत्या
    लीलाविलासगतिभिः समदाः सुधां ताम् ॥ ॥ अस्मास्वियं प्रणयिणीत्यसुरेषु तेषु जोषं स्थितेष्वथ समाप्य सुधां
    सुरेषु । त्वं भक्तलोकवशगो निजरूपमेत्य स्वर्भानुमर्धपरिपीतसुधं व्यलावीः ॥ ॥ त्वत्तः सुधाहरणयोग्यफलं
    परेषु दत्वा गते त्वयि सुरैः खलु ते व्यगृह्णन् । घोरेऽथ मूर्छति रणे बलिदैत्यमाया व्यामोहिते सुरगणे
    त्वमिहाविरासीः ॥ ॥ त्वं कालनेमिमथ मालिमुखाञ्जघन्थ शक्रो जघान बलिजम्भवलान् सपाकान् । शुष्कार्द्रदुष्करवधे
    नमुचौ च लूने फेनेन नारदगिरा न्यरुणो रणं त्वम् ॥ ॥ योषावपुर्दनुजमोहनमाहितं ते श्रुत्वा विलोकनकुतूहलवान्
    महेशः । भूतैस्समं गिरिजया च गतः पदं ते स्तुत्वाऽब्रवीदभिमतं त्वमथो तिरोधाः ॥ ॥ आरामसीमनि च कन्दुकघातलीला
    लोलायमाननयनां कमनीं मनोज्ञाम् । त्वामेष वीक्ष्य विगलद्वसनां मनोभू वेगादनङ्गरिपुरङ्ग समालिलिङ्ग ॥ ॥
    भूयोऽपि विद्रुतवतीमुपधाव्य देवो वीर्यप्रमोक्षविकसत्परमार्थबोधः । त्वन्मानितस्तव महत्त्वमुवाच देव्यै
    तत्तादृशस्त्वमव वातनिकेतनाथ ॥
