id: agastyastotram-1
category: stotram
name:
  english: agastyastotram 1
  devanagari: अगस्त्यस्तोत्रम् १
content:
  english: kashapushpapratikasha vahnimarutasambhava | mitravarunayoh putra kumbhayone namo'stu te ||
    50|| vindhyavriddhikshayakara meghatoyavishapaha | ratnavallabha devesha lankavasinnamo'stu te ||
    51|| vatapi bhakshito yena samudrah shoshitah pura | lopamudra patih shrimanyo'sau tasmai namo namah
    || 52|| iti matsyapurane ekashashtitamadhyayantargatam agastyastotram samaptam | matsyapurana | purvabhaga
    | adhyaya 61
  devanagari: काशपुष्पप्रतीकाश वह्निमारुतसम्भव । मित्रावरुणयोः पुत्र कुम्भयोने नमोऽस्तु ते ॥ ५०॥ विन्ध्यवृद्धिक्षयकर
    मेघतोयविषापह । रत्नवल्लभ देवेश लङ्कावासिन्नमोऽस्तु ते ॥ ५१॥ वातापी भक्षितो येन समुद्रः शोषितः पुरा
    । लोपामुद्रा पतिः श्रीमान्योऽसौ तस्मै नमो नमः ॥ ५२॥ इति मत्स्यपुराणे एकषष्टितमाध्यायान्तर्गतं अगस्त्यस्तोत्रं
    समाप्तम् । मत्स्यपुराण । पूर्वभाग । अध्याय ६१
meaning: {}
