id: lalita-2
category: sahasranama
name:
  english: lalita
  devanagari: ललित
content:
  english: nibhanana | shatodari shantimati niradhara niranjana || 43|| nirlepa nirmala nitya nirakara
    nirakula | nirguna nishkala shanta nishkama nirupaplava || 44|| nityamukta nirvikara nishprapanca
    nirashraya | nityashuddha nityabuddha niravadya nirantara || 45|| nishkarana nishkalanka nirupadhirnirishvara
    | niraga ragamathani nirmada madanashini || 46|| nishcinta nirahamkara nirmoha mohanashini | nirmama
    mamatahantri nishpapa papanashini || 47|| nishkrodha krodhashamani nirlobha lobhanashini | nihsamshaya
    samshayaghni nirbhava bhavanashini || 48||
  devanagari: निभानना । शातोदरी शान्तिमती निराधारा निरञ्जना ॥ ४३॥ निर्लेपा निर्मला नित्या निराकारा निराकुला
    । निर्गुणा निष्कला शान्ता निष्कामा निरुपप्लवा ॥ ४४॥ नित्यमुक्ता निर्विकारा निष्प्रपञ्चा निराश्रया
    । नित्यशुद्धा नित्यबुद्धा निरवद्या निरन्तरा ॥ ४५॥ निष्कारणा निष्कलङ्का निरुपाधिर्निरीश्वरा । नीरागा
    रागमथनी निर्मदा मदनाशिनी ॥ ४६॥ निश्चिन्ता निरहंकारा निर्मोहा मोहनाशिनी । निर्ममा ममताहन्त्री निष्पापा
    पापनाशिनी ॥ ४७॥ निष्क्रोधा क्रोधशमनी निर्लोभा लोभनाशिनी । निःसंशया संशयघ्नी निर्भवा भवनाशिनी ॥ ४८॥
