id: kyts-jata-5-1-savitraani-juhoti-prasootyai-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.1 Savitraani Juhoti Prasootyai - Krishna Yajurveda Taittiriya Samhita
content:
  english: savitrani juhoti juhoti savitrani savitrani juhoti | tyai juhoti juhoti prasu tyai caturgrihitena
    caturgrihitena prasu tyai caturgrihitena | caturgrihitena juhoti juhoti caturgrihitena caturgrihitena
    juhoti | caturgrihiteneti catuh juhoti catushpada shcatushpado juhoti juhoti catushpadah | catushpadah
    pashavah pashava shcatushpada shcatushpadah pashavah | catushpada iti catuh npashavah pashavah pashun
    | ava rundhe rundhe 'vava rundhe | rundhe catasra shcatasro rundhe rundhe catasrah | catasro disho
    disha shcatasra shcatasro dishah | disho dikshu dikshu disho disho dikshu | dikshvevaiva dikshu dikshveva
    | eva prati pratyevaiva prati | prati tishthati tishthati prati prati tishthati | tishthati chandagmsi
    chandagmsi tishthati tishthati chandagmsi | chandagmsi devebhyo devebhya shchandagmsi chandagmsi devebhyah
    | devebhyo 'papa devebhyo devebhyo 'pa | vo 'bhaga nyabhagani vo vo 'bhagani | abhagani havyagm havya
    mabhaga nyabhagani havyam | va~kshyamo vakshyamo havyagm havyam vakshyama ititi vakshyamo vakshyama
    iti | iti tebhya stebhya ititi tebhyah | ttebhya stebhya etat | ncaturgrihita metadetac caturgrihitam
    | caturgrihita madharaya ncaturgrihita madharayann | caturgrihitamiti catuh npuronuvakyayai puronuvakyaya
    adharaya npuronuvakyayai | puronuvakyayai yajyayai yajyayai puronuvakyayai puronuvakyayai yajyayai
    | puronuvakyaya iti purah yajyayai devatayai devatayai yajyayai yajyayai devatayai | devatayai vashatkaraya
    vashatkaraya devatayai devatayai vashatkaraya | dvashatkaraya vashatkaraya yat | vashatkarayeti vashat
    dyac caturgrihitam | njuhoti juhoti caturgrihita caturgrihitamiti catuh juhoti chandagmsi chandagmsi
    juhoti juhoti chandagmsi | chandag syevaiva chandagmsi chandag syeva | tprinati prinati ta prinati
    tani tani prinati prinati tani | tanya syasya tani tanyasya | asya pritani prita nyasyasya pritani
    | pritani devebhyo devebhyah pritani pritani devebhyah | devebhyo havyagm havya ndevebhyo devebhyo
    havyam | va~hanti vahanti havyagm havyam yam~ vahanti vahanti yam | nkamayeta kamayeta yam npapiyan
    kamayeta kamayeta papiyan | || ityekaika mekaika miti tyekaikam | ntasya tasyaikaika mekaika tasya
    juhuyaj juhuya ttasya tasya juhuyat | juhuya dahutibhi rahutibhi rjuhuyaj juhuya dahutibhih | ahutibhi
    revaivahutibhi rahutibhi reva | ahutibhirityahuti ena mapapaina mena mapa | apa grihnati grihna tyapapa
    grihnati | grihnati papiya ngrihnati grihnati papiyan | nbhavati bhavati papiya nkamayeta kamayeta
    yam kamayeta vasiyan vasiyan kamayeta kamayeta vasiyan | iti sarvani sarvanititi sarvani | sarvani
    tasya tasya sarvani sarvani tasya | tasya nudru tyanudrutya tasya tasya nudrutya | anudrutya juhuyaj
    juhuya danudrutya nudrutya juhuyat | juhuya dahutya ''hutya juhuyaj juhuya dahutya | ahu tyaivaiva
    hutya ''hutyaiva | abhi kramayati kramaya tyabhyabhi kramayati | kramayati vasiyan vasiyan kramayati
    kramayati vasiyan | nbhavati bhavati vasiyan bhavatyatho atho bhavati bhavatyatho atho yajnasya yajnasyatho
    atho yajnasya | yajna syaivaiva yajnasya yajna syaiva | nti reshaisha 'bhikra nti retye tyabhikra
    eti vai va etyeti vai | va esha esha vai va eshah | dyajnamukhadesha esha yajnamukhat | yajnamukha
    driddhya riddhya yajnamukha dyajnamukha driddhyah yajnamukhaditi yajna riddhya yo ya riddhya riddhya
    yah | rdevataya devataya agne ragne devataya etyeti devataya devataya eti | etyashta vashta vetye
    tyashtau | ashta veta nyeta nyashta vashta vetani | etani savitrani savitranyeta nyetani savitrani
    | savitrani bhavanti bhavanti savitrani savitrani bhavanti | bhava ntyashtakshara 'shtakshara bhavanti
    bhava ntyashtakshara | ashtakshara gayatri gaya tryashtakshara 'shtakshara gayatri | ashtaksharetyashta
    gayatri gayatro gayatro gayatri gayatri gayatrah | rgayatro gayatro agni stena tenagni ragni stena
    | tenai vaiva tena tenaiva | dyajnamukha devaiva yajnamukhat | yajnamukha driddhya riddhya yajnamukha
    dyajnamukha driddhyah yajnamukhaditi yajna riddhya agne ragner riddhya riddhya agneh | rdevatayai
    devataya agne ragne devatayai na na devatayai devatayai na | naityeti na naiti | etyashta vashta ve
    ashtau savitrani savitra nyashta vashtau savitrani | savitrani bhavanti bhavanti savitrani savitrani
    bhavanti | bhava ntyahuti rahuti rbhavanti bhava ntyahutih | rnavami nava myahuti rahuti nnavami navami
    trivrita trivrita mevaiva trivrita eva yajnamukhe yajnamukha evaiva yajnamukhe | yajnamukhe vi vi
    yajnamukhe yajnamukhe vi | yajnamukha iti yajna vi yatayati yatayati vi vi yatayati | yatayati yadi
    yadi yatayati yatayati yadi | yadi kamayeta kamayeta yadi yadi kamayeta | kamayeta chandagmsi chandagmsi
    kamayeta kamayeta chandagmsi | chandagmsi yajnayashasena yajnayashasena chandagmsi chandagmsi yajnayashasena
    | ya~jnayashasena yajnayashasena yajnayashaseneti yajna arpayeya miti tyarpayeya marpayeya miti |
    ityrica mrica miti tyrica rica mantama mantama mrica mrica mantamam | tkuryadantama mantama kuryac
    chandagmsi chandagmsi kurya tkuryac chandagmsi | chandag syevaiva chandagmsi chandag syeva | eva yajnayashasena
    yajnayashase naivaiva yajnayashasena | rpaya tyarpayati yajnayashasena yajnayashasena yajnayashaseneti
    yajna arpayati yadi yadyarpaya tyarpayati yadi | yadi kamayeta kamayeta yadi yadi kamayeta | nkamayeta
    kamayeta yajamanam | ya~jnayashasena yajnayashasena yajamanam ya~jnayashasena yajnayashasena yajnayashaseneti
    yajna arpayeya miti tyarpayeya marpayeya miti | ryaju rititi yajuh | yaju rantama mantamam tkurya
    dantama mantama yajamana mevaiva yajamanam eva yajnayashasena yajnayashase naivaiva yajnayashasena
    | rpaya tyarpayati yajnayashasena yajnayashasena yajnayashaseneti yajna ca 'rpaya tyarpaya tyrica
    | rica stomagg stoma mrica r stomagm sagm sagg stomagg stomagm sam | sa mardhaya rdhaya sagm sa mardhaya
    | ardhaye tityardhaya rdhayeti | ityahahe tityaha | || aha samriddhyai samriddhya ahaha samriddhyai
    | samriddhyai caturbhi shcaturbhi ssamriddhyai samriddhyai caturbhih | caturbhi rabhri mabhri ncaturbhi
    shcaturbhi rabhri caturbhiriti catuh abhri ma 'bhri mabhri ma | a datte datta a datte | datte catvari
    catvari datte datte catvari | catvari chandagmsi chandagmsi catvari catvari chandagmsi | chandagmsi
    chandobhi shchandobhi shchandagmsi chandagmsi chandobhih | chandobhi revaiva chandobhi shchandobhi
    reva | chandobhiriti chandah eva devasya devasyai vaiva devasya | devasya tva tva devasya devasya
    tva | savituh prasave prasave savitu ssavituh prasave | prasava ititi prasave prasava iti | ityahahe
    tityaha | tya agni ragnih prasu rdevebhyo devebhyo 'gni ragni devebhyo nilayata nilayata devebhyo
    devebhyo nilayata | nilayata sa sa nilayata nilayata sah | sa eta metagm sa sa etam | eta muti muti
    meta meta mutim | uti manvanuti muti manu | anu sagm sa manvanu sam | ssushiragm sushiram sushiragm
    sushira sushira sushiragm sushiragm sushira | sushira 'bhri rabhrih sushira sushira 'bhrih | rbhavati
    bhava tyabhri rabhri bhavati sayonitvaya sayonitvaya bhavati bhavati sayonitvaya | sayonitvaya sa
    sa sayonitvaya sayonitvaya sah | sayonitvayeti sayoni sa yatrayatra yatrayatra sa sa yatrayatra |
    yatrayatra vasa davasa dyatrayatra yatrayatra vasat | yatrayatreti yatra tkalmashi kalma shyabhava
    dabhava kalmashi bhavati bhavati kalmashi kalmashi bhavati | bhavati rupasamriddhyai rupasamriddhyai
    bhavati bhavati rupasamriddhyai | rupasamriddhya ubhayatahkshnu rubhayatahkshnu rupasamriddhyai rupasamriddhya
    ubhayatahkshnuh | rupasamriddhya iti rupa rbhavati bhava tyubhayatahkshnu rubhayatahkshnu ubhayatahkshnurityubhayatah
    bhavatita ito bhavati bhavatitah | itashca ce ta itashca | camuto 'mutashca camutah | amutashca camuto
    'mutashca | carka syarkasya ca carkasya | arkasya varuddhya avaruddhya arka syarkasya varuddhyai |
    avaruddhyai vyamamatri vyamama tryavaruddhya avaruddhyai vyamamatri | vyamamatri bhavati bhavati vyamamatri
    vyamamatri bhavati | vyamamatriti vyama bhava tyetava detava dbhavati bhava tyetavat | dvai va etava
    detava vai purushe purushe vai vai purushe | mpurushe purushe virya vi~ryasammita viryasammita viryam
    viryasammita 'parimita 'parimita viryasammita viryasammita 'parimita | viryasammiteti virya aparimita
    bhavati bhava tyaparimita 'parimita bhavati | bhava tyaparimitasya parimitasya bhavati bhava tyaparimitasya
    | aparimitasya varuddhya avaruddhya aparimitasya parimitasya varuddhyai | aparimitasyetyapari avaruddhyai
    yo yo 'varuddhya avaruddhyai yah | yo~ yo vanaspatinam | mphalagrahih phalagrahi ssa sa phalagrahih
    phalagrahi sa esha meshagm sa sa esham | viryava nesha mesham nphalagrahih phalagrahi viryavaniti
    virya rvenuh phalagrahih phalagrahi rvainavi vainavi venu vainavi bhavati bhavati vainavi vainavi
    bhavati | bhavati viryasya viryasya bhavati bhavati viryasya | viryasya varuddhya avaruddhyai viryasya
    viryasya varuddhyai | dyajnasya yajna syaita deta dyajnasya yajnasya yat | yadayajushkena yajushkena
    ya ayajushkena kriyate kriyate 'yajushkena yajushkena kriyate ayajushkenetyayajuh nnima mima magribhnann
    | nrashanagm rashana magribhna tasya rashanagm rashana mritasya | ritasyeti tyritasya r ityashvabhidhani
    mashvabhidhani miti tyashvabhidhani ashvabhidhani ma 'shvabhidhani mashvabhidhani ma | ashvabhidhanimityashva
    a datte datta a datte | datte yajushkrityai yajushkrityai datte datte yajushkrityai | yajushkrityai
    yajnasya yajnasya yajushkrityai yajushkrityai yajnasya | yajushkritya iti yajuh yajnasya samriddhyai
    samriddhyai yajnasya yajnasya samriddhyai | rtagm samriddhyai samriddhyai pratu a drava drava drava
    | dravetiti drava draveti | ityashva mashva miti tyashva ashva mabhyabhyashva mashva mabhi | abhi
    dadhati dadha tyabhyabhi dadhati | dadhati rupagm rupa ndadhati dadhati rupam | rupa mevaiva rupagm
    rupa meva | asyaita deta dasya syaitat | mmahimana meta deta vya~cashte vyacashte mahimana vyacashte
    yunjatham vya~cashte vyacashte yunjatha yunjathagm rasabhagm rasabham yu~njathagm rasabham | yu~vagm
    rasabhagm rasabham ngardabha mititi gardabham | gardabha masa tyasati gardabha asa tyevaiva satya
    satyeva | ngardabha mevaiva gardabham | mprati prati gardabha prati shthapayati sthapayati prati prati
    shthapayati | thsthapayati sthapayati tasma tasma dashva dashva dgardabho gardabho 'shva dashva gardabho
    'sattaro 'sattaro gardabho gardabho 'sattarah | asattaro yogeyoge yogeyoge 'sattaro 'sattaro yogeyoge
    | yo~geyoge yogeyoge tavastaram | tavastara mititi tavastara ityahahe tityaha | aha yogeyoge yogeyoga
    ahaha yogeyoge | || yogeyoga evaiva yogeyoge yogeyoga eva | yu~nkte yunkta ena menam yunkte vajevaje
    vajevaje yunkte yunkte vajevaje | vajevaje havamahe havamahe vajevaje vajevaje havamahe | havamaha
    ititi havamahe havamaha iti | ityahahe tityaha | ahanna manna mahaha nna vai vajo vajo vai vai vajah
    | anna mevaivanna manna meva | ava rundhe rundhe 'vava rundhe | ssakhayo rundhe rundhe sakhayah |
    sakhaya indra mindragm sakhaya indra mutaya utaya indra mindra mutaye utaya itityutaya utaya iti |
    ityahahe tityaha | ahendriya mindriya maha hendriyam | indriya mevai vendriya mindriya meva | ava
    rundhe rundhe 'vava rundhe | rundhe 'gni ragni rundhe rundhe 'gnih | rdevebhyo devebhyo 'gni ragni
    devebhyo nilayata nilayata devebhyo devebhyo nilayata | nnilayata nilayata tam | mprajapatih prajapati
    sta prajapati ranvanu prajapatih prajapati ranu | prajapatiriti praja anvavinda davinda danvan vavindat
    | tprajapatyah prajapatyo 'vinda davinda prajapatyo 'shvo 'shvah prajapatyah prajapatyo 'shvah | prajapatya
    iti praja ashvo 'shvena shvena shvo 'shvo 'shvena | ashvena sagm sa mashvena shvena sam | mbharati
    bharati sagm sa bhara tyanuvittya anuvittyai bharati bhara tyanuvittyai | anuvittyai papavasyasa mpapavasyasa
    manuvittya anuvittyai papavasyasam | anuvittya ityanu papavasyasamiti papa tkriyate kriyata eta deta
    tkriyate kriyate yat | yacchreyasa shreyasa ya shreyasa ca ca shreyasa shreyasa ca | ca papiyasa papiyasa
    ca ca papiyasa | papiyasa ca ca papiyasa papiyasa ca | nkarma karma samanagm samana karma kurvanti
    kurvanti karma karma kurvanti | kurvanti papiya npapiyan kurvanti kurvanti papiyan | hyashva dashva
    ddhi hyashva dgardabho gardabho 'shva dashva gardabho 'shva mashva ngardabho gardabho 'shva mpurva
    mashva mashva nnayanti nayanti purva nayanti papavasyasasya papavasyasasya nayanti nayanti papavasyasasya
    | papavasyasasya vyavrittyai vyavrittyai papavasyasasya papavasyasasya vyavrittyai | papavasyasasyeti
    papa vyavrittyai tasma dvyavrittyai vyavrittyai tasma vyavrittya iti vi tasma cchreyagmsagg shreyagmsa
    ttasma cchreyagmsam | nchreyagmsagg shreyagmsa pashca danvanu pashca tye tyan van veti | vai bhavato
    bhavato vai vai bhavatah | bhavato bhratrivyo bhratrivyo bhavato bhavato bhratrivyah | bhratrivyo
    bhavati bhavati bhratrivyo bhratrivyo bhavati | bhavativeva bhavati bhavativa | iva khalu khalviveva
    khalu | khalu vai vai khalu khalu vai | va esha esha vai va eshah | esha yo ya esha esha yah | cinute
    vajri vajri cinute cinute vajri | vajryashvo 'shvo vajri vajryashvah | nnashvo 'shvah praturvann |
    praturvanniti pra nnihi hyavakramann | nnashasti rashasti ravakrama ashasti riti tyashasti rashasti
    riti | ityahahe tityaha | aha vajrena vajrena haha vajrena | vajre naivaiva vajrena vajrenaiva | mpapmana
    mevaiva papmana bhratrivya mavava bhratrivya ava kramati krama tyavava kramati | kramati rudrasya
    rudrasya kramati kramati rudrasya | rudrasya ganapatya drudrasya rudrasya ganapatyat | ganapatya dititi
    ganapatya dganapatya diti | ganapatyaditi gana ityahahe tityaha | aha raudra raudra ahaha raudrah
    | raudra vai vai raudra raudra vai | vai pashavah pashavo vai vai pashavah | tpashavah pashavo rudrat
    | rudra devaiva rudra npashu nevaiva pashun | || nniryacya niryacya pashu niryacyatmana atmane niryacya
    niryacyatmane atmane karma karmatmana atmane karma | karma kurute kurute karma karma kurute | kurute
    pushna pushna kurute kurute pushna | pushna sayuja sayuja pushna pushna sayuja sayuja saha saha sayuja
    sayuja saha | sahe titi saha saheti | ityahahe tityaha | aha pusha pusha ''haha pusha | pusha vai
    vai pusha pusha vai | va addhvana maddhvanam vai~ va addhvanam | addhvanagm sanneta sanneta 'ddhvana
    maddhvanagm sanneta | sanneta samashtyai samashtyai sanneta sanneta samashtyai | samashtyai purishayatanah
    purishayatana ssamashtyai samashtyai purishayatanah | purishayatano vai vai purishayatanah purishayatano
    vai | purishayatana iti purisha va esha esha vai va eshah | agni rangiraso 'ngiraso 'gni ragni rangirasah
    | angiraso vai va angiraso 'ngiraso vai | eta magre 'gra eta meta magre ndevatana magre 'gre devatanam
    | devatanagm sagm sa ndevatanagm sam | nthsagm sa mabharann | nprithivyah prithivya abhara tprithivyah
    prithivya sadhastha dagni magnigm sadhastha thsadhastha dagnim | mpurishya magni magni purishya mangirasva
    dangirasva mpurishya mangirasvat | angirasva dacchaccha ngirasva dangirasva daccha | acche hi hyaccha
    cchehi | ihititi hihiti | ityahahe tityaha | aha sayatanagm sayatana mahaha sayatanam | sayatana mevaiva
    sayatanagm sayatana meva | mbharati bharati sagm sa bhara tyagni magni mbharati bhara tyagnim | mpurishya
    magni magni purishya mangirasva dangirasva mpurishya mangirasvat | angirasva dacchaccha ngirasva dangirasva
    daccha | acchema imo acchacchemah | ima ititima ima iti | ityahahe tityaha | aha yena yenahaha yena
    | yena sangacchate sangacchate yena yena sangacchate | || va~jagm sangacchate sangacchate vaja asya
    vrinkte vrinkte 'syasya vrinkte | vrinkte prajapataye prajapataye vrinkte vrinkte prajapataye | prajapataye
    pratiprocya pratiprocya prajapataye prajapataye pratiprocya | prajapataya iti praja pratiprocyagni
    ragnih pratiprocya pratiprocyagnih | pratiprocyeti prati ssambhrityah sambhrityo 'gni ragni sambhritya
    ititi sambhrityah sambhritya iti | ityahu rahu riti tyahuh | ahu riya miya mahu rahu riyam | vai prajapatih
    prajapati rvai vai prajapatih | prajapati stasya stasyah prajapatih prajapati stasyah prajapatiriti
    praja ttasya stasya etat | eta cchrotragg shrotra meta deta cchrotra dyacchrotragg shrotram dvalmiko
    valmiko ya valmiko 'gni magnim va~lmiko valmiko 'gnim | mpurishya magni magni purishya mangirasva
    dangirasva mpurishya mangirasvat | dbharishyamo bharishyamo 'ngirasva dangirasva bharishyama ititi
    bharishyamo bharishyama iti | va~lmikavapa mititi valmikavapam | valmikavapa mupopa valmikavapam valmikavapamiti
    valmika upa tishthate tishthata upopa tishthate | ttishthate tishthate sakshat | saksha devaiva saksha
    eva prajapataye prajapataya evaiva prajapataye | prajapataye pratiprocya pratiprocya prajapataye prajapataye
    pratiprocya | prajapataya iti praja pratiprocyagni magni mpratiprocya pratiprocyagnim | pratiprocyeti
    prati agnigm sagm sa magni magnigm sam | mbharati bharati sagm sa bhara tyagni magni mbharati bhara
    tyagnim | mpurishya magni magni purishya mangirasva dangirasva mpurishya mangirasvat | dbharamo bharamo
    'ngirasva dangirasva bharama ititi bharamo bharama iti | ityahahe tityaha | aha yena yenahaha yena
    | yena sangacchate sangacchate yena yena sangacchate | va~jagm sangacchate sangacchate vaja asya vrinkte
    vrinkte 'syasya vrinkte | vrinkte 'nvanu vrinkte vrinkte 'nu | anvagni ragni ranvan vagnih | agni
    rushasa mushasa magni ragni rushasa ushasa magra magra mushasa mushasa magra agra makhya dakhya dagra
    magra makhyat | || akhya diti tyakhya dakhya diti | ityahahe tityaha | ahanukhyatya anukhyatya ahaha
    nukhyatyai | anukhyatya agatya gatya nukhyatya anukhyatya agatya | anukhyatya ityanu agatya vaji vajyagatya
    gatya vaji | vajyaddhvano addhvano vaji vajyaddhvanah | addhvana akramya kramya ddhvano 'ddhvana akramya
    | nnakramya kramya vajinn | prithivi mititi prithivi ityahahe tityaha | ahe cchati ccha tyahahe cchati
    | iccha tyevaive cchati cchatyeva | mpurvaya purvayaina mena purvaya vindati vindati purvaya purvaya
    vindati | vinda tyuttara yottaraya vindati vinda tyuttaraya | ndvabhya muttara yottaraya dvabhya dvabhya
    ma dvabhya a kramayati kramayatya kramayati | kramayati pratishthityai pratishthityai kramayati kramayati
    pratishthityai | pratishthitya anurupabhya manurupabhya mpratishthityai pratishthitya anurupabhyam
    | pratishthitya iti prati ttasma danurupabhya manurupabhya anurupabhyamityanu tasma danurupa anurupa
    stasma ttasma danurupah | anurupah pashavah pashavo 'nurupa anurupah pashavah | pashavah pra pra pashavah
    pashavah pra | pra jayante jayante pra pra jayante | rjayante jayante dyauh | mprithivi prithivi prishtha
    prithivi sadhasthagm sadhastha mprithivi prithivi sadhastha sadhastha mititi sadhasthagm sadhastha
    miti | ityahahe tityaha | ahaibhya ebhya aha haibhyah | ebhyo vai va ebhya ebhyo vai | etam ~lokebhyo
    lokebhya eta metam ~lokebhyah | lokebhyah prajapatih prajapati rlokebhyo lokebhyah prajapatih | mprajapatih
    prajapati prajapatiriti praja drupagm rupa mairaya dairaya rupa mevaiva rupagm rupa meva | asyaita
