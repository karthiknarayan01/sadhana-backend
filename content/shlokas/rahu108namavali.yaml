id: rahu108namavali
category: stotram
name:
  english: rahu108namavali
  devanagari: राहु१०८नामावली
content:
  english: om bhra~ bhrim bhraum sah rahave namah || om rahave namah | om saimhikeyaya namah | om vidhuntudaya
    namah | om surashatrave namah | om tamase namah | om phanine namah | om gargyayanaya namah | om surapine
    namah | om nilajimutasankashaya namah | om caturbhujaya namah | 10 om khadgakhetakadharine namah |
    om varadayakahastakaya namah | om shulayudhaya namah | om meghavarnaya namah | om krishnadhvajapatakavate
    namah | om dakshinashamukharataya namah | om tikshnadamshtrakaralakaya namah | om shurpakarasanasthaya
    namah | om gomedabharanapriyaya namah | om mashapriyaya namah | 20 om kashyaparshinandanaya namah
    | om bhujageshvaraya namah | om ulkapatayitre namah | ulkapatajanaye om shuline namah | om nidhipaya
    namah | om krishnasarparaje namah | om vishajvalavritasyaya ardhashariraya namah | om jadyasampradaya
    namah | shatravapradaya om ravindubhikaraya namah | om chayasvarupine namah | 30 om kathinangakaya
    namah | om dvishaccakracchedakaya namah | om karalasyaya namah | om bhayankaraya namah | om krurakarmane
    namah | om tamorupaya namah | om shyamatmane namah | om nilalohitaya namah | om kiritine namah | om
    nilavasanaya namah | 40 om shanisamantavartmagaya namah | om candalavarnaya namah | om ashvyarkshabhavaya
    namah | om meshabhavaya namah | om shanivatphaladaya namah | om shuraya namah | om apasavyagataye
    namah | om uparagakaraya namah | om suryahimamshucchaviharakaya namah | somasuryacchavivimardakaya
    om nilapushpaviharaya namah | 50 om grahashreshthaya namah | om ashtamagrahaya namah | om kabandhamatradehaya
    namah | om yatudhanakulodbhavaya namah | om govindavarapatraya namah | om devajatipravishtakaya namah
    | om kruraya namah | om ghoraya namah | om shanermitraya namah | om shukramitraya namah | 60 om agocaraya
    namah | om mane gangasnanadatre namah | om svagrihe prabaladhyakaya namah | prabaladhyadaya om sadgrihe'nyabaladhrite
    namah | om caturthe matrinashakaya namah | om candrayukte candalajanmasucakaya namah | om janmasimhe
    namah | simhajanmane om rajyadatre namah | om mahakayaya namah | om janmakartre namah | 70 om vidhuripave
    namah | om mattako jnanadaya namah | mattagajnanadayakaya om janmakanyarajyadatre namah | om janmahanidaya
    namah | om navame pitrihantre namah | om pancame shokadayakaya namah | om dyune kalatrahantre namah
    | om saptame kalahapradaya namah | om shashthe vittadatre namah | om caturthe vairadayakaya namah
    | 80 om navame papadatre namah | om dashame shokadayakaya namah | om adau yashah pradatre namah |
    om ante vairapradayakaya namah | om kalatmane namah | om gocaracaraya namah | om dhane kakutpradaya
    namah | om pancame dhishanasha
  devanagari: ॐ भ्राँ भ्रीं भ्रौं सः राहवे नमः ॥ ॐ राहवे नमः । ॐ सैंहिकेयाय नमः । ॐ विधुन्तुदाय नमः ।
    ॐ सुरशत्रवे नमः । ॐ तमसे नमः । ॐ फणिने नमः । ॐ गार्ग्यायनाय नमः । ॐ सुरापिने नमः । ॐ नीलजीमूतसङ्काशाय
    नमः । ॐ चतुर्भुजाय नमः । १० ॐ खड्गखेटकधारिणे नमः । ॐ वरदायकहस्तकाय नमः । ॐ शूलायुधाय नमः । ॐ मेघवर्णाय
    नमः । ॐ कृष्णध्वजपताकावते नमः । ॐ दक्षिणाशामुखरताय नमः । ॐ तीक्ष्णदंष्ट्रकरालकाय नमः । ॐ शूर्पाकारासनस्थाय
    नमः । ॐ गोमेदाभरणप्रियाय नमः । ॐ माषप्रियाय नमः । २० ॐ कश्यपर्षिनन्दनाय नमः । ॐ भुजगेश्वराय नमः ।
    ॐ उल्कापातयित्रे नमः । उल्कापातजनये ॐ शूलिने नमः । ॐ निधिपाय नमः । ॐ कृष्णसर्पराजे नमः । ॐ विषज्वालावृतास्याय
    अर्धशरीराय नमः । ॐ जाद्यसम्प्रदाय नमः । शात्रवप्रदाय ॐ रवीन्दुभीकराय नमः । ॐ छायास्वरूपिणे नमः । ३०
    ॐ कठिनाङ्गकाय नमः । ॐ द्विषच्चक्रच्छेदकाय नमः । ॐ करालास्याय नमः । ॐ भयङ्कराय नमः । ॐ क्रूरकर्मणे
    नमः । ॐ तमोरूपाय नमः । ॐ श्यामात्मने नमः । ॐ नीललोहिताय नमः । ॐ किरीटिणे नमः । ॐ नीलवसनाय नमः । ४०
    ॐ शनिसमान्तवर्त्मगाय नमः । ॐ चाण्डालवर्णाय नमः । ॐ अश्व्यर्क्षभवाय नमः । ॐ मेषभवाय नमः । ॐ शनिवत्फलदाय
    नमः । ॐ शूराय नमः । ॐ अपसव्यगतये नमः । ॐ उपरागकराय नमः । ॐ सूर्यहिमांशुच्छविहारकाय नमः । सोमसूर्यच्छविविमर्दकाय
    ॐ नीलपुष्पविहाराय नमः । ५० ॐ ग्रहश्रेष्ठाय नमः । ॐ अष्टमग्रहाय नमः । ॐ कबन्धमात्रदेहाय नमः । ॐ यातुधानकुलोद्भवाय
    नमः । ॐ गोविन्दवरपात्राय नमः । ॐ देवजातिप्रविष्टकाय नमः । ॐ क्रूराय नमः । ॐ घोराय नमः । ॐ शनेर्मित्राय
    नमः । ॐ शुक्रमित्राय नमः । ६० ॐ अगोचराय नमः । ॐ माने गङ्गास्नानदात्रे नमः । ॐ स्वगृहे प्रबलाढ्यकाय
    नमः । प्रबलाढ्यदाय ॐ सद्गृहेऽन्यबलधृते नमः । ॐ चतुर्थे मातृनाशकाय नमः । ॐ चन्द्रयुक्ते चण्डालजन्मसूचकाय
    नमः । ॐ जन्मसिंहे नमः । सिंहजन्मने ॐ राज्यदात्रे नमः । ॐ महाकायाय नमः । ॐ जन्मकर्त्रे नमः । ७० ॐ विधुरिपवे
    नमः । ॐ मत्तको ज्ञानदाय नमः । मत्तगाज्ञानदायकाय ॐ जन्मकन्याराज्यदात्रे नमः । ॐ जन्महानिदाय नमः । ॐ
    नवमे पितृहन्त्रे नमः । ॐ पञ्चमे शोकदायकाय नमः । ॐ द्यूने कलत्रहन्त्रे नमः । ॐ सप्तमे कलहप्रदाय नमः
    । ॐ षष्ठे वित्तदात्रे नमः । ॐ चतुर्थे वैरदायकाय नमः । ८० ॐ नवमे पापदात्रे नमः । ॐ दशमे शोकदायकाय नमः
    । ॐ आदौ यशः प्रदात्रे नमः । ॐ अन्ते वैरप्रदायकाय नमः । ॐ कालात्मने नमः । ॐ गोचराचाराय नमः । ॐ धने
    ककुत्प्रदाय नमः । ॐ पञ्चमे धिशणाश
