id: vishnu-nitya-puja-vidhanam
category: stotram
name:
  english: Vishnu Nitya Puja Vidhanam
content:
  english: vishnu pratima va citrapatah va purvanga puja shrimahaganadhipataye namah | shri gurubhyo namah
    | harih om | shucih apavitrah pavitro va sarvavastham gato'pi va | yah smaret pundarikaksham sa bahyabhyantarah
    shucih || pundarikaksha pundarikaksha pundarikakshaya namah || prarthana shuklambaradharam vishnum
    shashivarnam caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || agajanana padmarkam gajananamaharnisham
    | anekadam tam bhaktanam ekadantamupasmahe || tadeva lagnam sudinam tadeva tarabalam candrabalam tadeva
    | vidyabalam daivabalam tadeva lakshmipate te'nghriyugam smarami || gururbrahma gururvishnuh gururdevo
    maheshvarah | guruh sakshat parabrahma tasmai shrigurave namah || sarvamangala mangalye shive sarvarthasadhike
    | sharanye tryambake gauri narayani namo'stu te || shrilakshminarayanabhyam namah | umamaheshvarabhyam
    namah | vanihiranyagarbhabhyam namah | shacipurandarabhyam namah | arundhativasishthabhyam namah |
    shrisitaramabhyam namah | matapitribhyo namah | sarvebhyo mahajanebhyo namah | acamanam om keshavaya
    svaha | om narayanaya svaha | om madhavaya svaha | om govindaya namah | om vishnave namah | om madhusudanaya
    namah | om trivikramaya namah | om vamanaya namah | om shridharaya namah | om hrishikeshaya namah
    | om padmanabhaya namah | om damodaraya namah | om sankarshanaya namah | om vasudevaya namah | om
    pradyumnaya namah | om aniruddhaya namah | om purushottamaya namah | om adhokshajaya namah | om narasimhaya
    namah | om acyutaya namah | om janardanaya namah | om upendraya namah | om haraye namah | om shrikrishnaya
    namah | diparadhanam dipastvam brahmarupo'si jyotisham prabhuravyayah | saubhagyam dehi putramshca
    sarvankamamshca dehi me || bho dipa devi rupastvam karmasakshi hyavighnakrit | yavatpujam karishyami
    tavattvam susthiro bhava || diparadhana muhurtah sumuhurto'stu || bhutoccatanam uttishthantu bhutapishacah
    ya ete bhumibharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta ye bhuta bhumisamsthitah
    | ye bhuta vighnakartaraste gacchantu shiva'jnaya || pranayamah o mbhuvah | ogm suvah | o ntapah |
    ogm satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo jyoti raso mbrahma bhurbhuvassuvarom
    || sankalpah mama upatta samasta duritakshaya dvara shriparameshvara prityartham asmakam sahakutumbasya
    kshema pujam karishye || tadanga kalasharadhanam karishye || kalasharadhanam kalashe gandha pushpakshatairabhyarcya
    | kalashe udakam purayitva | kalashasyopari hastam nidhaya | kalashasya mukhe vishnuh kanthe rudrah
    samashritah | mule tvasya sthito brahma madhye matriganah smritah || kukshau tu sagarah sarve saptadvipa
    vasundhara | rigvedo'tha yajurvedo samavedo hyatharvanah || angaishca sahitah sarve kalashambu samashritah
    || gange ca yamune caiva godavari sarasvati | narmade sindhu kaveri jale'smin sannidhim kuru || kaveri
    tungabhadra ca krishnaveni ca gautami | bhagirathiti vikhyatah pancagangah prakirtitah || ayantu devapujartham
    mama duritakshayakarakah | kalashodakena puja dravyani samprokshya atmanam ca samprokshya || shankhapuja
    shankham candrarka daivatam madhye varuna devatam | prishthe prajapatim vindyadagre ganga sarasvatim
    || trailokye yani tirthani vasudevasya ajnaya | shankhe tishthantu viprendrah tasmat shankham prapujayet
    || om shankhaya namah | om dhavalaya namah | om pancajanyaya namah | om shankhadevatabhyo namah |
    sakalapujarthe akshatan samarpayami || ghantanadah agamartham tu devanam gamanartham tu rakshasam
    | ghantaravam karomyadau devatahvana lanchanam || om ghantadevatabhyo namah | sakalopacara pujarthe
    akshatan samarpayami || shri mahaganapati puja o ntva ganapatigm havamahe kavi nkavinam upamashravastavam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || sumukhashcaikadantashca kapilo
    gajakarnakah | lambodarashca vikato vighnarajo ganadhipah || dhumaketurganadhyakshah phalacandro gajananah
    | vakratundah shurpakarno herambah skandapurvajah || om shrimahaganapataye namah | dhyayami | avahayami
    | asanam samarpayami | padyam samarpayami | arghyam samarpayami | acamaniyam samarpayami | snanam
    samarpayami | vastram samarpayami | yajnopavitam samarpayami | gandham samarpayami | pushpani samarpayami
    | dhupamaghrapayami | dipam darshayami | naivedyam samarpayami | tambulam samarpayami | nirajanam
    samarpayami | mantrapushpam samarpayami | pradakshina namaskaran samarpayami || shodashopacara puja
    vishnu dhyanam shantakaram bhujagashayanam padmanabham suresham vishvakaram gaganasadrisham meghavarnam
    shubhangam | lakshmikantam kamalanayanam yogihriddhyanagamyam vande vishnum bhavabhayaharam sarvalokaikanatham
    || o nnarayanaya vidmahe vasudevaya dhimahi | tanno vishnuh pracodaya t || om namo narayanaya | dhyayami
    | dhyanam samarpayami || avahanam sahasrashir sha purushah | sahasraksha ssahasrapat | sa bhumim vi~shvato
    vritva | atyatishthaddashangulam || avahayami sarvesha shrinivasa ramapate | kripaya dehi sannidhyam
    sharanagatavatsala || om namo narayanaya | avahayami | sthapayami | pujayami || asanam devadeva jagannatha
    pranatakleshanashaka | ratnasimhasanam divyam grihana madhusudana || om namo narayanaya | asanam samarpayami
    || padyam vanchitam kuru me deva dushkritam ca vinashaya | padyam grihana bhagavan bhaktacittasthirasana
    || om namo narayanaya | padayoh padyam samarpayami || arghyam kurushva me dayam deva samsarartibhayapaha
    | kusumakshata samyuktam grihanarghyam namo'stu te || om namo narayanaya | hastayoh arghyam samarpayami
    || acamaniyam namah satyaya shuddhaya nityaya jnanarupine | grihanacamanam deva sarvalokaikanayaka
    || om namo narayanaya | mukhe acamaniyam samarpayami || snanam apo hishtha mayobhuvasta na urje dadhatana
    | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva matarah || tasma
    ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah || om namo narayanaya | shuddhodaka
    snanam samarpayami || snananantaram acamaniyam samarpayami || vastram vastrayugmam ca divyam ca shobhanam
    priti vardhanam | om namo narayanaya | vastram samarpayami || yajnopavitam yajnopavitam paramam pavitram
    prajapateryatsahajam purastat | ayushyamagryam pratimunca shubhram yajnopavitam balamastu tejah ||
    om namo narayanaya | yajnopavitam samarpayami || gandham shrikhandam candanam divyam gandhadhyam sumanoharam
    | vilepanam surashreshtha prityartham pratigrihyatam || om namo narayanaya | gandham samarpayami ||
    arcana akshatan dhavalan divyan pushpani ca sugandhini | bhaktya dattani grihyantam sarvadevah prasidata
    || anga puja om vishnave namah padau pujayami | om narayanaya namah gulphau pujayami | om madhavaya
    namah januni pujayami | om govindaya namah uru pujayami | om madhusudanaya namah katim pujayami |
    om trivikramaya namah udaram pujayami | om vamanaya namah hridayam pujayami | om shridharaya namah
    kantham pujayami | om hrishikeshaya namah skandhau pujayami | om padmanabhaya namah bahu pujayami
    | om damodaraya namah hastau pujayami | om purushottamaya namah mukham pujayami | om acyutaya namah
    netre pujayami | om janardanaya namah shirah pujayami | om shrikrishnaya namah sarvanyangani pujayami
    || shri vishnu ashtottara shata namavali athava vishnu namavali pathanam || om namo narayanaya | ashtottara
    shata namavali pujam samarpayami | akshatan pushpani ca samarpayami || dhupam vanaspatyudbhavairdivyaih
    nanagandhaih susamyutah | aghreyah sarvadevanam dhupo'yam pratigrihyatam || om namo narayanaya | dhupamaghrapayami
    || dipam sajyam trivarti samyuktam vahnina yojitam priyam | grihana mangalam dipam trailokya timirapaham
    || om namo narayanaya | dipam darshayami || naivedyam naivedyam grihyatam deva bhaktya sampaditam
    maya | idam phalam ca paniyam sarvopacara samyutam || o mbhurbhuvassuvah | tatsaviturvare mbhargo
    devasya dhimahi | dhiyo yo nah pracodaya t || satyam tva ritena parishincami | amritamastu | amritopastaranamasi
    | om pranaya svaha | om apanaya svaha | om vyanaya svaha | om udanaya svaha | om samanaya svaha |
    madhye madhye paniyam samarpayami | amritapidhanamasi | uttaraposhanam samarpayami | hastau prakshalayami
    | padau prakshalayami | shuddhacamaniyam samarpayami || om namo narayanaya | naivedyam samarpayami
    || tambulam pugiphalashca karpuraih nagavallidalairyutam | muktacurna samyuktam tambulam pratigrihyatam
    || om namo narayanaya | tambulam samarpayami || nirajanam vedahameta ntamasastu pare | sarvani rupani
    vicitya dhirah | namani kritva || shriyah kantaya kalyana nidhaye nidhayerthinam | shrinivasaya devaya
    nirajanam samarpaye || om namo narayanaya | nirajanam samarpayami || mantrapushpam tadvishnoh mpadagm
    sada pashyanti surayah | diviva cakshuratatam | tadvipraso vipanyavo jagrivagm sassamimdhate | vishnoryatparama
    mpadam || om namo narayanaya | mantrapushpam samarpayami || pradakshinam yani kani ca papani janmantara
    kritani ca | tani tani pranashyanti pradakshina pade pade || om namo narayanaya | pradakshina namaskaran
    samarpayami || namaskarah urasa shirasa drishtya manasa vacasa tatha | padbhyam karabhyam karnabhyam
    pranamo'shtanga ucyate || om namo narayanaya | namaskaran samarpayami || sarvopacarah om namo narayanaya
    | chatram samarpayami | camaram samarpayami | gitam shravayami | nrityam darshayami | samasta rajopacaran
    devopacaran samarpayami || stotra sukta pathanam purusha suktam shri vishnu sahasra nama stotram kshamaprarthana
    mantrahinam kriyahinam bhaktihinam janardana | yatpujitam maya deva paripurnam tadastu te || kayena
    vaca manasendriyairva buddhyatmana va prakriteh svabhavat | karomi yadyat sakalam parasmai narayanayeti
    samarpayami || anaya dhyana shodashopacara pujaya shrimannarayanah supritah suprasannah varado bhavatu
    || udvasanam om namo narayanaya | yathasthanam udvasayami | shobhanarthe kshemaya punaragamanaya ca
    || prasada grahanam akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram devata padodakam
    shubham || shrimannarayana prasadam shirasa grihnami || om shantih shantih shantih || om tatsat brahmarpanamastu
    ||
  devanagari: विष्णु प्रतिमा वा चित्रपटः वा पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो नमः ।
    हरिः ओम् । शुचिः अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा । यः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः
    शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम्
    । प्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्कं गजाननमहर्निशम् । अनेकदं तं भक्तानां एकदन्तमुपास्महे
    ॥ तदेव लग्नं सुदिनं तदेव ताराबलं चन्द्रबलं तदेव । विद्याबलं दैवबलं तदेव लक्ष्मीपते तेऽङ्घ्रियुगं स्मरामि
    ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥
    सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्यां
    नमः । उमामहेश्वराभ्यां नमः । वाणीहिरण्यगर्भाभ्यां नमः । शचीपुरन्दराभ्यां नमः । अरुन्धतीवसिष्ठाभ्यां
    नमः । श्रीसीतारामाभ्यां नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । आचमनं ॐ केशवाय स्वाहा
    । ॐ नारायणाय स्वाहा । ॐ माधवाय स्वाहा । ॐ गोविन्दाय नमः । ॐ विष्णवे नमः । ॐ मधुसूदनाय नमः । ॐ त्रिविक्रमाय
    नमः । ॐ वामनाय नमः । ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ॐ पद्मनाभाय नमः । ॐ दामोदराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ वासुदेवाय नमः । ॐ प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ॐ पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः
    । ॐ नारसिंहाय नमः । ॐ अच्युताय नमः । ॐ जनार्दनाय नमः । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय
    नमः । दीपाराधनम् दीपस्त्वं ब्रह्मरूपोऽसि ज्योतिषां प्रभुरव्ययः । सौभाग्यं देहि पुत्रांश्च सर्वान्कामांश्च
    देहि मे ॥ भो दीप देवि रूपस्त्वं कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजां करिष्यामि तावत्त्वं सुस्थिरो
    भव ॥ दीपाराधन मुहूर्तः सुमुहूर्तोऽस्तु ॥ भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमिभारकाः । एतेषामविरोधेन
    ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते गच्छन्तु शिवाऽज्ञया
    ॥ प्राणायामः ओ म्भुवः॑ । ओग्ं सुवः॑ । ओ न्तपः॑ । ओग्ं सत्यम् । ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो
    नः॑ प्रचो॒दया त् ॥ ओमापो॒ ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पः मम उपात्त समस्त दुरितक्षय
    द्वारा श्रीपरमेश्वर प्रीत्यर्थं अस्माकं सहकुटुम्बस्य क्षेम पूजां करिष्ये ॥ तदङ्ग कलशाराधनं करिष्ये
    ॥ कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य । कलशे उदकं पूरयित्वा । कलशस्योपरि हस्तं निधाय । कलशस्य
    मुखे विष्णुः कण्ठे रुद्रः समाश्रितः । मूले त्वस्य स्थितो ब्रह्मा मध्ये मातृगणाः स्मृताः ॥ कुक्षौ तु
    सागराः सर्वे सप्तद्वीपा वसुन्धरा । ऋग्वेदोऽथ यजुर्वेदो सामवेदो ह्यथर्वणः ॥ अङ्गैश्च सहिताः सर्वे कलशाम्बु
    समाश्रिताः ॥ गङ्गे च यमुने चैव गोदावरी सरस्वती । नर्मदे सिन्धु कावेरी जलेऽस्मिन् सन्निधिं कुरु ॥ कावेरी
    तुङ्गभद्रा च कृष्णवेणी च गौतमी । भागीरथीति विख्याताः पञ्चगङ्गाः प्रकीर्तिताः ॥ आयान्तु देवपूजार्थं
    मम दुरितक्षयकारकाः । कलशोदकेन पूजा द्रव्याणि सम्प्रोक्ष्य आत्मानं च सम्प्रोक्ष्य ॥ शङ्खपूजा शङ्खं
    चन्द्रार्क दैवतं मध्ये वरुण देवताम् । पृष्ठे प्रजापतिं विन्द्यादग्रे गङ्गा सरस्वतीम् ॥ त्रैलोक्ये
    यानि तीर्थानि वासुदेवस्य आज्ञया । शङ्खे तिष्ठन्तु विप्रेन्द्राः तस्मात् शङ्खं प्रपूजयेत् ॥ ॐ शङ्खाय
    नमः । ॐ धवलाय नमः । ॐ पाञ्चजन्याय नमः । ॐ शङ्खदेवताभ्यो नमः । सकलपूजार्थे अक्षतान् समर्पयामि ॥ घण्टानादः
    आगमार्थं तु देवानां गमनार्थं तु राक्षसाम् । घण्टारवं करोम्यादौ देवताह्वान लाञ्छनम् ॥ ॐ घण्टादेवताभ्यो
    नमः । सकलोपचार पूजार्थे अक्षतान् समर्पयामि ॥ श्री महागणपति पूजा ओ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि ङ्क॑वी॒नां
    उप॒मश्र॑वस्तवम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ सुमुखश्चैकदन्तश्च
    कपिलो गजकर्णकः । लम्बोदरश्च विकटो विघ्नराजो गणाधिपः ॥ धूमकेतुर्गणाध्यक्षः फालचन्द्रो गजाननः । वक्रतुण्डः
    शूर्पकर्णो हेरम्बः स्कन्दपूर्वजः ॥ ॐ श्रीमहागणपतये नमः । ध्यायामि । आवाहयामि । आसनं समर्पयामि । पाद्यं
    समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । स्नानं समर्पयामि । वस्त्रं समर्पयामि । यज्ञोपवीतं
    समर्पयामि । गन्धं समर्पयामि । पुष्पाणि समर्पयामि । धूपमाघ्रापयामि । दीपं दर्शयामि । नैवेद्यं समर्पयामि
    । ताम्बूलं समर्पयामि । नीराजनं समर्पयामि । मन्त्रपुष्पं समर्पयामि । प्रदक्षिण नमस्कारान् समर्पयामि
    ॥ षोडशोपचार पूजा विष्णु ध्यानम् शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं विश्वाकारं गगनसदृशं मेघवर्णं शुभाङ्गम्
    । लक्ष्मीकान्तं कमलनयनं योगिहृद्ध्यानगम्यं वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ॥ ओ न्ना॒रा॒य॒णाय॑
    वि॒द्महे॑ वासुदे॒वाय॑ धीमहि । तन्नो॑ विष्णुः प्रचो॒दया त् ॥ ॐ नमो नारायणाय । ध्यायामि । ध्यानं समर्पयामि
    ॥ आवाहनम् स॒हस्र॑शीर् षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम्
    ॥ आवाहयामि सर्वेश श्रीनिवास रमापते । कृपया देहि सान्निध्यं शरणागतवत्सल ॥ ॐ नमो नारायणाय । आवाहयामि
    । स्थापयामि । पूजयामि ॥ आसनम् देवदेव जगन्नाथ प्रणतक्लेशनाशक । रत्नसिंहासनं दिव्यं गृहाण मधुसूदन ॥
    ॐ नमो नारायणाय । आसनं समर्पयामि ॥ पाद्यम् वाञ्छितं कुरु मे देव दुष्कृतं च विनाशय । पाद्यं गृहाण भगवन्
    भक्तचित्तस्थिरासन ॥ ॐ नमो नारायणाय । पादयोः पाद्यं समर्पयामि ॥ अर्घ्यम् कुरुष्व मे दयां देव संसारार्तिभयापह
    । कुसुमाक्षत संयुक्तं गृहाणार्घ्यं नमोऽस्तु ते ॥ ॐ नमो नारायणाय । हस्तयोः अर्घ्यं समर्पयामि ॥ आचमनीयम्
    नमः सत्याय शुद्धाय नित्याय ज्ञानरूपिणे । गृहाणाचमनं देव सर्वलोकैकनायक ॥ ॐ नमो नारायणाय । मुखे आचमनीयं
    समर्पयामि ॥ स्नानम् आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥ यो वः॑ शि॒वत॑मो
    रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑
    ज॒नय॑था च नः ॥ ॐ नमो नारायणाय । शुद्धोदक स्नानं समर्पयामि ॥ स्नानानन्तरं आचमनीयं समर्पयामि ॥ वस्त्रम्
    वस्त्रयुग्मं च दिव्यं च शोभनं प्रीति वर्धनम् । ॐ नमो नारायणाय । वस्त्रं समर्पयामि ॥ यज्ञोपवीतम् यज्ञोपवीतं
    परमं पवित्रं प्रजापतेर्यत्सहजं पुरस्तात् । आयुष्यमग्र्यं प्रतिमुञ्च शुभ्रं यज्ञोपवीतं बलमस्तु तेजः
    ॥ ॐ नमो नारायणाय । यज्ञोपवीतं समर्पयामि ॥ गन्धम् श्रीखण्डं चन्दनं दिव्यं गन्धाढ्यं सुमनोहरम् । विलेपनं
    सुरश्रेष्ठ प्रीत्यर्थं प्रतिगृह्यताम् ॥ ॐ नमो नारायणाय । गन्धं समर्पयामि ॥ अर्चन अक्षतान् धवलान् दिव्यान्
    पुष्पाणि च सुगन्धीनि । भक्त्या दत्तानि गृह्यन्तां सर्वदेवाः प्रसीदत ॥ अङ्ग पूजा ॐ विष्णवे नमः पादौ
    पूजयामि । ॐ नारायणाय नमः गुल्फौ पूजयामि । ॐ माधवाय नमः जानुनी पूजयामि । ॐ गोविन्दाय नमः ऊरू पूजयामि
    । ॐ मधुसूदनाय नमः कटिं पूजयामि । ॐ त्रिविक्रमाय नमः उदरं पूजयामि । ॐ वामनाय नमः हृदयं पूजयामि । ॐ
    श्रीधराय नमः कण्ठं पूजयामि । ॐ हृषीकेशाय नमः स्कन्धौ पूजयामि । ॐ पद्मनाभाय नमः बाहू पूजयामि । ॐ दामोदराय
    नमः हस्तौ पूजयामि । ॐ पुरुषोत्तमाय नमः मुखं पूजयामि । ॐ अच्युताय नमः नेत्रे पूजयामि । ॐ जनार्दनाय
    नमः शिरः पूजयामि । ॐ श्रीकृष्णाय नमः सर्वाण्यङ्गानि पूजयामि ॥ श्री विष्णु अष्टोत्तर शत नामावली अथवा
    विष्णु नामावली पठनम् ॥ ॐ नमो नारायणाय । अष्टोत्तर शत नामावली पूजां समर्पयामि । अक्षतान् पुष्पाणि च
    समर्पयामि ॥ धूपम् वनस्पत्युद्भवैर्दिव्यैः नानागन्धैः सुसंयुतः । आघ्रेयः सर्वदेवानां धूपोऽयं प्रतिगृह्यताम्
    ॥ ॐ नमो नारायणाय । धूपमाघ्रापयामि ॥ दीपम् साज्यं त्रिवर्ति संयुक्तं वह्निना योजितं प्रियम् । गृहाण
    मङ्गलं दीपं त्रैलोक्य तिमिरापहम् ॥ ॐ नमो नारायणाय । दीपं दर्शयामि ॥ नैवेद्यम् नैवेद्यं गृह्यतां देव
    भक्त्या सम्पादितं मया । इदं फलं च पानीयं सर्वोपचार संयुतम् ॥ ओ म्भूर्भुव॒स्सुवः॒ । तत्स॑वि॒तुर्वरे
    म्भर्गो॑ दे॒वस्य॑ धीमहि । धि॒यो यो नः॑ प्रचो॒दया त् ॥ सत्यं त्वा ऋतेन परिषिञ्चामि । अमृतमस्तु । अमृतोपस्तरणमसि
    । ॐ प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्यानाय स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । मध्ये
    मध्ये पानीयं समर्पयामि । अमृतापिधानमसि । उत्तरापोशनं समर्पयामि । हस्तौ प्रक्षालयामि । पादौ प्रक्षालयामि
    । शुद्धाचमनीयं समर्पयामि ॥ ॐ नमो नारायणाय । नैवेद्यं समर्पयामि ॥ ताम्बूलम् पूगीफलश्च कर्पूरैः नागवल्लीदलैर्युतम्
    । मुक्ताचूर्ण संयुक्तं ताम्बूलं प्रतिगृह्यताम् ॥ ॐ नमो नारायणाय । ताम्बूलं समर्पयामि ॥ नीराजनम् वेदा॒हमे॒त
    न्तम॑स॒स्तु पा॒रे । सर्वा॑णि रू॒पाणि॑ वि॒चित्य॒ धीरः॑ । नामा॑नि कृ॒त्वा ॥ श्रियः कान्ताय कल्याण निधये
    निधयेर्थिनाम् । श्रीनिवासाय देवाय नीराजनं समर्पये ॥ ॐ नमो नारायणाय । नीराजनं समर्पयामि ॥ मन्त्रपुष्पम्
    तद्विष्णोः म्प॒दग्ं सदा॑ पश्यन्ति सू॒रयः॑ । दि॒वीव॒ चक्षु॒रात॑तम् । तद्विप्रा॑सो विप॒न्यवो॑ जागृ॒वाग्ं
    स॒स्समिं॑धते । विष्णो॒र्यत्प॑र॒म म्प॒दम् ॥ ॐ नमो नारायणाय । मन्त्रपुष्पं समर्पयामि ॥ प्रदक्षिणम् यानि
    कानि च पापानि जन्मान्तर कृतानि च । तानि तानि प्रणश्यन्ति प्रदक्षिण पदे पदे ॥ ॐ नमो नारायणाय । प्रदक्षिण
    नमस्कारान् समर्पयामि ॥ नमस्कारः उरसा शिरसा दृष्ट्या मनसा वचसा तथा । पद्भ्यां कराभ्यां कर्णाभ्यां प्रणामोऽष्टाङ्ग
    उच्यते ॥ ॐ नमो नारायणाय । नमस्कारान् समर्पयामि ॥ सर्वोपचाराः ॐ नमो नारायणाय । छत्रं समर्पयामि । चामरं
    समर्पयामि । गीतं श्रावयामि । नृत्यं दर्शयामि । समस्त राजोपचारान् देवोपचारान् समर्पयामि ॥ स्तोत्र सूक्त
    पठनम् पुरुष सूक्तम् श्री विष्णु सहस्र नाम स्तोत्रम् क्षमाप्रार्थना मन्त्रहीनं क्रियाहीनं भक्तिहीनं
    जनार्दन । यत्पूजितं मया देव परिपूर्णं तदस्तु ते ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना वा प्रकृतेः
    स्वभावात् । करोमि यद्यत् सकलं परस्मै नारायणायेति समर्पयामि ॥ अनया ध्यान षोडशोपचार पूजया श्रीमन्नारायणः
    सुप्रीतः सुप्रसन्नः वरदो भवतु ॥ उद्वासनम् ॐ नमो नारायणाय । यथास्थानं उद्वासयामि । शोभनार्थे क्षेमाय
    पुनरागमनाय च ॥ प्रसाद ग्रहणम् अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं देवता पादोदकं शुभम्
    ॥ श्रीमन्नारायण प्रसादं शिरसा गृह्णामि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ब्रह्मार्पणमस्तु ॥
