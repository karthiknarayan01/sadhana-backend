id: viththalakavacam
category: kavacha
name:
  english: viththalakavacam
  devanagari: विठ्ठलकवचम्
content:
  english: shriviththalakavacam suta uvaca | shiro me viththalah patu kapolam mudgarapriyah | netrayorvishnurupi
    ca vaikuntho ghranameva ca || 1|| munisevyo mukham patu dantapanktim sureshvarah | vidyadhishastu
    me jihvam kantham vishveshavanditah || 2|| vyapako hridayam patu skandhau patu sukhapradah | bhujau
    me nriharih patu karau ca suranayakah || 3|| madhyam patu suradhisho nabhim patu suralayah | suravandyah
    kati patu januni kamalasanah || 4|| janghe patu hrishikeshah padau patu trivikramah | nikhilam ca
    shariram me patam govindamadhavau || 5|| akaro vyapako vishnuraksharatmaka eva ca | pavakah sarvapapanamakaraya
    namo namah || 6|| tarakah sarvabhutanam dharmashastreshu giyate | punatu vishvabhuvanam tonkaraya
    namo namah || 7|| mulaprakritirupa ya mahamaya ca vaishnavi | tasya bijena samyuktayakarayanamo namah
    || 8|| vaikunthadhipatih sakshadvaikunthapadadayakah | vaijayantisamayukto vikaraya namo namah ||
    9|| snatah sarveshu tirtheshu puto yajnadikarmasu | pavano dvijapanktinam thakaraya namo namah ||
    10|| vahanam garudo yasya bhujangah shayanam tatha | vamabhage ca lakshmishca lakaraya namo namah
    || 11|| naradadisamayuktam vaishnavam paramam padam | labhate manavo nityam vaishnavam dharmamashritah
    || 12|| vyadhayo vilayam yanti purvakarmasamudbhavah | bhutani ca palayante mantropasakadarshanat
    || 13|| idam shadaksharastotram yo japecchraddhayanvitah | vishnossayujyamapnoti satyam satyam na
    samshayah || 14|| iti shripadmapurane viththalakavacam sampurnam |
  devanagari: श्रीविठ्ठलकवचम् सूत उवाच । शिरो मे विठ्ठलः पातु कपोलं मुद्गरप्रियः । नेत्रयोर्विष्णुरूपी
    च वैकुण्ठो घ्राणमेव च ॥ १॥ मुनिसेव्यो मुखं पातु दन्तपङ्क्तिं सुरेश्वरः । विद्याधीशस्तु मे जिह्वां
    कण्ठं विश्वेशवन्दितः ॥ २॥ व्यापको हृदयं पातु स्कन्धौ पातु सुखप्रदः । भुजौ मे नृहरिः पातु करौ च सुरनायकः
    ॥ ३॥ मध्यं पातु सुराधीशो नाभिं पातु सुरालयः । सुरवन्द्यः कटी पातु जानुनी कमलासनः ॥ ४॥ जङ्घे पातु हृषीकेशः
    पादौ पातु त्रिविक्रमः । निखिलं च शरीरं मे पातां गोविन्दमाधवौ ॥ ५॥ अकारो व्यापको विष्णुरक्षरात्मक एव
    च । पावकः सर्वपापानामकाराय नमो नमः ॥ ६॥ तारकः सर्वभूतानां धर्मशास्त्रेषु गीयते । पुनातु विश्वभुवनं
    तोङ्काराय नमो नमः ॥ ७॥ मूलप्रकृतिरूपा या महामाया च वैष्णवी । तस्या बीजेन संयुक्तयकारायनमो नमः ॥ ८॥
    वैकुण्ठाधिपतिः साक्षाद्वैकुण्ठपददायकः । वैजयन्तीसमायुक्तो विकाराय नमो नमः ॥ ९॥ स्नातः सर्वेषु तीर्थेषु
    पूतो यज्ञादिकर्मसु । पावनो द्विजपङ्क्तीनां ठकाराय नमो नमः ॥ १०॥ वाहनं गरुडो यस्य भुजङ्गः शयनं तथा
    । वामभागे च लक्ष्मीश्च लकाराय नमो नमः ॥ ११॥ नारदादिसमायुक्तं वैष्णवं परमं पदम् । लभते मानवो नित्यं
    वैष्णवं धर्ममाश्रितः ॥ १२॥ व्याधयो विलयं यान्ति पूर्वकर्मसमुद्भवाः । भूतानि च पलायन्ते मन्त्रोपासकदर्शनात्
    ॥ १३॥ इदं षडक्षरस्तोत्रं यो जपेच्छ्रद्धयान्वितः । विष्णोस्सायुज्यमाप्नोति सत्यं सत्यं न संशयः ॥ १४॥
    इति श्रीपद्मपुराणे विठ्ठलकवचं सम्पूर्णम् ।
