id: brahmanaihkritamsuryastotram-21
category: stotram
name:
  english: brahmanaihkritamsuryastotram 21
  devanagari: ब्राह्मणैःकृतंसूर्यस्तोत्रम् २१
content:
  english: brahmanaih kritam suryastotram 21 brahmana ucuh | devadanavayakshanam grahanam jyotishamapi
    | tejasabhyadhikam devam vrajama sharanam ravim || 62|| divi sthitam ca devesham dyotayantam samantatah
    | vasudhamantariksham ca vyapnuvantam maricibhih || 63|| adityam bhaskaram bhanum savitaram divakaram
    | pushanamaryamanam ca svarbhanum diptadidhitim || 64|| caturyugantakalagnidushprekshyam pralayantagam
    | yogishvaramanantam ca raktam pitam sitasitam || 65|| rishinamagnihotreshu yajnadeveshvavasthitam
    | vrajama sharanam devam tejorashim tamacyutam | aksharam paramam guhyam mokshadvaramanuttamam ||
    66|| chandobhirashvarupaishca sakridyuktairvihangamam | udayastamane yuktam sada meroh pradakshine
    || 67|| anritam ca ritam caiva punyatirtham prithagvidham | vishvasthiticintyam ca prapannah sma prabhakaram
    || 68|| yo brahma yo mahadevo yo vishnuryah prajapatih | vayurakashamapashca prithivigirisagarah ||
    69|| grahanakshatracandradya vanaspatyam drumaushadham | vyaktavyakteshu bhuteshu dharmadharmapravarttakah
    || 70|| brahmi maheshvari caiva vaishnavi caiva te tanuh | tridha yasya svarupam tu bhanorbhasvanprasidatu
    || 71|| yasya sarvamayasyedamangabhutam jagatprabhoh | sa nah prasidatam bhasvanjagatam yashca jivanam
    || 72|| yasyaikamaksharam rupam prabhamandaladurdrisham | dvitiyamaindavam saumyam sa no bhasvanprasidatu
    || 73|| tabhyam ca tasya rupabhyamidam vishvam vinirmitam | agnishomamayam bhasvansa no devah prasidatu
    || 74|| iti markandeyapurane shadadhikashatatamadhyayantargatam brahmanaih kritam suryastotram samaptam
    | markandeyapurana | adhyaya 106
  devanagari: ब्राह्मणैः कृतं सूर्यस्तोत्रम् २१ ब्राह्मणा ऊचुः । देवदानवयक्षाणां ग्रहाणां ज्योतिषामपि
    । तेजसाभ्यधिकं देवं व्रजाम शरणं रविम् ॥ ६२॥ दिवि स्थितं च देवेशं द्योतयन्तं समन्ततः । वसुधामन्तरिक्षं
    च व्याप्नुवन्तं मरीचिभिः ॥ ६३॥ आदित्यं भास्करं भानुं सवितारं दिवाकरम् । पूषाणमर्यमाणं च स्वर्भानुं
    दीप्तदीधितिम् ॥ ६४॥ चतुर्युगान्तकालाग्निदुष्प्रेक्ष्यं प्रलयान्तगम् । योगीश्वरमनन्तं च रक्तं पीतं
    सितासितम् ॥ ६५॥ ऋषीणामग्निहोत्रेषु यज्ञदेवेष्ववस्थितम् । व्रजाम शरणं देवं तेजोराशिं तमच्युतम् । अक्षरं
    परमं गुह्यं मोक्षद्वारमनुत्तमम् ॥ ६६॥ छन्दोभिरश्वरूपैश्च सकृद्युक्तैर्विहङ्गमम् । उदयास्तमने युक्तं
    सदा मेरोः प्रदक्षिणे ॥ ६७॥ अनृतं च ऋतं चैव पुण्यतीर्थं पृथग्विधम् । विश्वस्थितिचिन्त्यं च प्रपन्नाः
    स्म प्रभाकरम् ॥ ६८॥ यो ब्रह्मा यो महादेवो यो विष्णुर्यः प्रजापतिः । वायुराकाशमापश्च पृथिवीगिरिसागराः
    ॥ ६९॥ ग्रहनक्षत्रचन्द्राद्या वानस्पत्यं द्रुमौषधम् । व्यक्ताव्यक्तेषु भूतेषु धर्माधर्मप्रवर्त्तकः
    ॥ ७०॥ ब्राह्मी माहेश्वरी चैव वैष्णवी चैव ते तनुः । त्रिधा यस्य स्वरूपं तु भानोर्भास्वान्प्रसीदतु ॥
    ७१॥ यस्य सर्वमयस्येदमङ्गभूतं जगत्प्रभोः । स नः प्रसीदतां भास्वाञ्जगतां यश्च जीवनम् ॥ ७२॥ यस्यैकमक्षरं
    रूपं प्रभामण्डलदुर्दृशम् । द्वितीयमैन्दवं सौम्यं स नो भास्वान्प्रसीदतु ॥ ७३॥ ताभ्यां च तस्य रूपाभ्यामिदं
    विश्वं विनिर्मितम् । अग्नीषोममयं भास्वान्स नो देवः प्रसीदतु ॥ ७४॥ इति मार्कण्डेयपुराणे षडधिकशततमाध्यायान्तर्गतं
    ब्राह्मणैः कृतं सूर्यस्तोत्रं समाप्तम् । मार्कण्डेयपुराण । अध्याय १०६
