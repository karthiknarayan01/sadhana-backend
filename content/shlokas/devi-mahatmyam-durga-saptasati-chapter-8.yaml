id: devi-mahatmyam-durga-saptasati-chapter-8
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 8
content:
  english: raktabijavadho nama ashtamodhyaya || dhyanam arunam karuna tarangitakshim dhritapashankusha
    pushpabanacapam | animadhibhiravritam mayukhai rahamityeva vibhavaye bhavanim || rishiruvaca || ||
    cande ca nihate daitye munde ca vinipatite | bahuleshu ca sainyeshu kshayiteshvasureshvarah || ||
    tatah kopaparadhinacetah shumbhah pratapavan | udyogam sarva sainyanam daityanamadidesha ha || ||
    adya sarva balairdaityah shadashitirudayudhah | kambunam caturashitirniryantu svabalairvritah || ||
    kotiviryani pancashadasuranam kulani vai | shatam kulani dhaumranam nirgacchantu mamajnaya || || kalaka
    daurhrida maurvah kalikeyastathasurah | yuddhaya sajja niryantu ajnaya tvarita mama || || ityajnapyasurapatih
    shumbho bhairavashasanah | nirjagama mahasainyasahastrairbhahubhirvritah || || ayantam candika drishtva
    tatsainyamatibhishanam | jyasvanaih purayamasa dharanigaganantaram || || tatahsimhò mahanadamativa
    kritavannripa | ghantasvanena tannadanambika copabrimhayat || || dhanurjyasimhaghantanam nadapuritadinmukha
    | ninadairbhishanaih kali jigye vistaritanana || || tam ninadamupashrutya daitya sainyaishcaturdisham
    | devi simhastatha kali saroshaih parivaritah|| || etasminnantare bhupa vinashaya suradvisham | bhavayamarasimhanamativiryabalanvitah
    || || brahmeshaguhavishnunam tathendrasya ca shaktayah | sharirebhyovinishkramya tadrupaishcandikam
    yayuh || || yasya devasya yadrupam yatha bhushanavahanam | tadvadeva hi taccaktirasuranyoddhumayamau
    || || hamsayuktavimanagre sakshasutraka mandaluh | ayata brahmanah shaktibrahmani tyabhidhiyate ||
    || maheshvari vrisharudha trishulavaradharini | mahahivalaya praptacandrarekhavibhushana || || kaumari
    shaktihasta ca mayuravaravahana | yoddhumabhyayayau daityanambika guharupini || || tathaiva vaishnavi
    shaktirgarudopari samsthita | shankhacakragadhashankhar khadgahastabhyupayayau || || yajnavarahamatulam
    rupam ya bhibhrato hareh | shaktih sapyayayau tatra varahim bibhrati tanum || || narasimhi nrisimhasya
    bibhrati sadrisham vapuh | prapta tatra satakshepakshiptanakshatra samhatih || || vajra hasta tathaivaindri
    gajarajo paristhita | prapta sahasra nayana yatha shakrastathaiva sa || || tatah parivrittastabhirishano
    deva shaktibhih | hanyantamasurah shighram mama prityaha candikam || || tato devi sharirattu vinishkrantatibhishana
    | candika shaktiratyugra shivashataninadini || || sa caha dhumrajatilam ishanamaparajita | dutatvam
    gaccha bhagavan parshvam shumbhanishumbhayoh || || bruhi shumbham nishumbham ca danavavatigarvitau
    | ye canye danavastatra yuddhaya samupasthitah || || trailokyamindro labhatam devah santu havirbhujah
    | yuyam prayata patalam yadi jivitumicchatha || || balavalepadatha cedbhavanto yuddhakankshinah |
    tada gacchata tripyantu macchivah pishitena vah || || yato niyukto dautyena taya devya shivah svayam
    | shivadutiti loke'smimstatah sa khyati magata || || te'pi shrutva vaco devyah sharvakhyatam mahasurah
    | amarshapurita jagmuryatra katyayani sthita || || tatah prathamamevagre sharashaktyrishtivrishtibhih
    | vavarshuruddhatamarshah stam devimamararayah || || sa ca tan prahitan banan nchulashaktiparashvadhan
    | ciccheda lilayadhmatadhanurmuktairmaheshubhih || || tasyagratastatha kali shulapatavidaritan | khatvangapothitamshcarinkurvanti
    vyacarattada || || kamandalujalakshepahataviryan hataujasah | brahmani cakarocchatrunyena yena sma
    dhavati || || maheshvari trishulena tatha cakrena vaishnavi | daityanjaghana kaumari tatha shatyati
    kopana || || aindri kulishapatena shatasho daityadanavah | peturvidaritah prithvyam rudhiraughapravarshinah
    || || tundapraharavidhvasta damshtra grakshata vakshasah | varahamurtya nyapatamshcakrena ca vidaritah
    || || nakhairvidaritamshcanyan bhakshayanti mahasuran | narasimhi cacarajau nada purnadigambara ||
    || candattahasairasurah shivadutyabhidushitah | petuh prithivyam patitamstamshcakhadatha sa tada ||
    || iti matri ganam kruddham marda yantam mahasuran | drishtvabhyupayairvividhairneshurdevarisainikah
    || || palayanaparandrishtva daityanmatriganarditan | yoddhumabhyayayau kruddho raktabijo mahasurah
    || || raktabinduryada bhumau patatyasya shariratah | samutpatati medinyam tatpramano mahasurah ||
    || yuyudhe sa gadapanirindrashaktya mahasurah | tatashcaindri svavajrena raktabijamatadayat || ||
    kulishenahatasyashu bahu susrava shonitam | samuttasthustato yodhastadrapastatparakramah || || yavantah
    patitastasya shariradraktabindavah | tavantah purusha jatah stadviryabalavikramah || || te capi yuyudhustatra
    purusha rakta sambhavah | samam matribhiratyugrashastrapatatibhishanam || || punashca vajra patena
    kshata mashya shiro yada | vavaha raktam purushastato jatah sahasrashah || || vaishnavi samare cainam
    cakrenabhijaghana ha | gadaya tadayamasa aindri tamasureshvaram|| || vaishnavi cakrabhinnasya rudhirasrava
    sambhavaih | sahasrasho jagadvyaptam tatpramanairmahasuraih || || shaktya jaghana kaumari varahi ca
    tathasina | maheshvari trishulena raktabijam mahasuram || || sa capi gadaya daityah sarva evahanat
    prithak | matrih kopasamavishto raktabijo mahasurah || || tasyahatasya bahudha shaktishuladi bhirbhuvih
    | papata yo vai raktaughastenasancatasho'surah || || taishcasurasriksambhutairasuraih sakalam jagat
    | vyaptamasittato deva bhayamajagmuruttamam || || tan vishanna n suran drishtva candika prahasatvaram
    | uvaca kalim camunde vistirnam vadanam kuru || || macchastrapatasambhutan raktabindun mahasuran |
    raktabindoh praticcha tvam vaktrenanena vegina || || bhakshayanti cara rano tadutpannanmahasuran |
    evamesha kshayam daityah kshena rakto gamishyati || || bhakshya mana stvaya cogra na cotpatsyanti
    capare | ityuktva tam tato devi shulenabhijaghana tam || || mukhena kali jagrihe raktabijasya shonitam
    | tato'savajaghanatha gadaya tatra candikam || || na casya vedanam cakre gadapato'lpikamapi | tasyahatasya
    dehattu bahu susrava shonitam || || yatastatastadvaktrena camunda sampraticchati | mukhe samudgata
    ye'sya raktapatanmahasurah || || tamshcakhadatha camunda papau tasya ca shonitam || || devi shulena
    vajrena banairasibhir rishtibhih | jaghana raktabijam tam camunda pita shonitam || || sa papata mahiprishthe
    shastrasanghasamahatah | niraktashca mahipala raktabijo mahasurah || || tataste harsha matulam avapustridasha
    nripa | tesham matrigano jato nanartasrimngamadoddhatah || || || svasti shri markandeya purane savarnike
    manvantare devi mahatmye raktabijavadhonama ashtamodhyaya samaptam || ahuti om jayanti sangayai sashaktikayai
    saparivarayai savahanayai raktakshyai ashtamatri sahitayai mahahutim samarpayami namah svaha ||
  devanagari: रक्तबीजवधो नाम अष्टमोध्याय ॥ ध्यानं अरुणां करुणा तरङ्गिताक्षीं धृतपाशाङ्कुश पुष्पबाणचापाम्
    । अणिमाधिभिरावृतां मयूखै रहमित्येव विभावये भवानीम् ॥ ऋषिरुवाच ॥ ॥ चण्डे च निहते दैत्ये मुण्डे च विनिपातिते
    । बहुलेषु च सैन्येषु क्षयितेष्वसुरेश्वरः ॥ ॥ ततः कोपपराधीनचेताः शुम्भः प्रतापवान् । उद्योगं सर्व सैन्यानां
    दैत्यानामादिदेश ह ॥ ॥ अद्य सर्व बलैर्दैत्याः षडशीतिरुदायुधाः । कम्बूनां चतुरशीतिर्निर्यान्तु स्वबलैर्वृताः
    ॥ ॥ कोटिवीर्याणि पञ्चाशदसुराणां कुलानि वै । शतं कुलानि धौम्राणां निर्गच्छन्तु ममाज्ञया ॥ ॥ कालका दौर्हृदा
    मौर्वाः कालिकेयास्तथासुराः । युद्धाय सज्जा निर्यान्तु आज्ञया त्वरिता मम ॥ ॥ इत्याज्ञाप्यासुरापतिः
    शुम्भो भैरवशासनः । निर्जगाम महासैन्यसहस्त्रैर्भहुभिर्वृतः ॥ ॥ आयान्तं चण्डिका दृष्ट्वा तत्सैन्यमतिभीषणम्
    । ज्यास्वनैः पूरयामास धरणीगगनान्तरम् ॥ ॥ ततःसिंहॊ महानादमतीव कृतवान्नृप । घण्टास्वनेन तान्नादानम्बिका
    चोपबृंहयत् ॥ ॥ धनुर्ज्यासिंहघण्टानां नादापूरितदिङ्मुखा । निनादैर्भीषणैः काली जिग्ये विस्तारितानना
    ॥ ॥ तं निनादमुपश्रुत्य दैत्य सैन्यैश्चतुर्दिशम् । देवी सिंहस्तथा काली सरोषैः परिवारिताः॥ ॥ एतस्मिन्नन्तरे
    भूप विनाशाय सुरद्विषाम् । भवायामरसिंहनामतिवीर्यबलान्विताः ॥ ॥ ब्रह्मेशगुहविष्णूनां तथेन्द्रस्य च शक्तयः
    । शरीरेभ्योविनिष्क्रम्य तद्रूपैश्चण्डिकां ययुः ॥ ॥ यस्य देवस्य यद्रूपं यथा भूषणवाहनम् । तद्वदेव हि
    तच्चक्तिरसुरान्योद्धुमायमौ ॥ ॥ हंसयुक्तविमानाग्रे साक्षसूत्रक मण्डलुः । आयाता ब्रह्मणः शक्तिब्रह्माणी
    त्यभिधीयते ॥ ॥ महेश्वरी वृषारूढा त्रिशूलवरधारिणी । महाहिवलया प्राप्ताचन्द्ररेखाविभूषणा ॥ ॥ कौमारी
    शक्तिहस्ता च मयूरवरवाहना । योद्धुमभ्याययौ दैत्यानम्बिका गुहरूपिणी ॥ ॥ तथैव वैष्णवी शक्तिर्गरुडोपरि
    संस्थिता । शङ्खचक्रगधाशाङ्खर् खड्गहस्ताभ्युपाययौ ॥ ॥ यज्ञवाराहमतुलं रूपं या भिभ्रतो हरेः । शक्तिः
    साप्याययौ तत्र वाराहीं बिभ्रती तनुम् ॥ ॥ नारसिंही नृसिंहस्य बिभ्रती सदृशं वपुः । प्राप्ता तत्र सटाक्षेपक्षिप्तनक्षत्र
    संहतिः ॥ ॥ वज्र हस्ता तथैवैन्द्री गजराजो परिस्थिता । प्राप्ता सहस्र नयना यथा शक्रस्तथैव सा ॥ ॥ ततः
    परिवृत्तस्ताभिरीशानो देव शक्तिभिः । हन्यन्तामसुराः शीघ्रं मम प्रीत्याह चण्डिकां ॥ ॥ ततो देवी शरीरात्तु
    विनिष्क्रान्तातिभीषणा । चण्डिका शक्तिरत्युग्रा शिवाशतनिनादिनी ॥ ॥ सा चाह धूम्रजटिलं ईशानमपराजिता ।
    दूतत्वं गच्छ भगवन् पार्श्वं शुम्भनिशुम्भयोः ॥ ॥ ब्रूहि शुम्भं निशुम्भं च दानवावतिगर्वितौ । ये चान्ये
    दानवास्तत्र युद्धाय समुपस्थिताः ॥ ॥ त्रैलोक्यमिन्द्रो लभतां देवाः सन्तु हविर्भुजः । यूयं प्रयात पातालं
    यदि जीवितुमिच्छथ ॥ ॥ बलावलेपादथ चेद्भवन्तो युद्धकाङ्क्षिणः । तदा गच्छत तृप्यन्तु मच्छिवाः पिशितेन
    वः ॥ ॥ यतो नियुक्तो दौत्येन तया देव्या शिवः स्वयम् । शिवदूतीति लोकेऽस्मिंस्ततः सा ख्याति मागता ॥ ॥
    तेऽपि श्रुत्वा वचो देव्याः शर्वाख्यातं महासुराः । अमर्षापूरिता जग्मुर्यत्र कात्यायनी स्थिता ॥ ॥ ततः
    प्रथममेवाग्रे शरशक्त्यृष्टिवृष्टिभिः । ववर्षुरुद्धतामर्षाः स्तां देवीममरारयः ॥ ॥ सा च तान् प्रहितान्
    बाणान् ञ्छूलशक्तिपरश्वधान् । चिच्छेद लीलयाध्मातधनुर्मुक्तैर्महेषुभिः ॥ ॥ तस्याग्रतस्तथा काली शूलपातविदारितान्
    । खट्वाङ्गपोथितांश्चारीन्कुर्वन्ती व्यचरत्तदा ॥ ॥ कमण्डलुजलाक्षेपहतवीर्यान् हतौजसः । ब्रह्माणी चाकरोच्छत्रून्येन
    येन स्म धावति ॥ ॥ माहेश्वरी त्रिशूलेन तथा चक्रेण वैष्णवी । दैत्याङ्जघान कौमारी तथा शत्याति कोपना ॥
    ॥ ऐन्द्री कुलिशपातेन शतशो दैत्यदानवाः । पेतुर्विदारिताः पृथ्व्यां रुधिरौघप्रवर्षिणः ॥ ॥ तुण्डप्रहारविध्वस्ता
    दंष्ट्रा ग्रक्षत वक्षसः । वाराहमूर्त्या न्यपतंश्चक्रेण च विदारिताः ॥ ॥ नखैर्विदारितांश्चान्यान् भक्षयन्ती
    महासुरान् । नारसिंही चचाराजौ नादा पूर्णदिगम्बरा ॥ ॥ चण्डाट्टहासैरसुराः शिवदूत्यभिदूषिताः । पेतुः पृथिव्यां
    पतितांस्तांश्चखादाथ सा तदा ॥ ॥ इति मातृ गणं क्रुद्धं मर्द यन्तं महासुरान् । दृष्ट्वाभ्युपायैर्विविधैर्नेशुर्देवारिसैनिकाः
    ॥ ॥ पलायनपरान्दृष्ट्वा दैत्यान्मातृगणार्दितान् । योद्धुमभ्याययौ क्रुद्धो रक्तबीजो महासुरः ॥ ॥ रक्तबिन्दुर्यदा
    भूमौ पतत्यस्य शरीरतः । समुत्पतति मेदिन्यां तत्प्रमाणो महासुरः ॥ ॥ युयुधे स गदापाणिरिन्द्रशक्त्या महासुरः
    । ततश्चैन्द्री स्ववज्रेण रक्तबीजमताडयत् ॥ ॥ कुलिशेनाहतस्याशु बहु सुस्राव शोणितम् । समुत्तस्थुस्ततो
    योधास्तद्रपास्तत्पराक्रमाः ॥ ॥ यावन्तः पतितास्तस्य शरीराद्रक्तबिन्दवः । तावन्तः पुरुषा जाताः स्तद्वीर्यबलविक्रमाः
    ॥ ॥ ते चापि युयुधुस्तत्र पुरुषा रक्त सम्भवाः । समं मातृभिरत्युग्रशस्त्रपातातिभीषणं ॥ ॥ पुनश्च वज्र
    पातेन क्षत मश्य शिरो यदा । ववाह रक्तं पुरुषास्ततो जाताः सहस्रशः ॥ ॥ वैष्णवी समरे चैनं चक्रेणाभिजघान
    ह । गदया ताडयामास ऐन्द्री तमसुरेश्वरम्॥ ॥ वैष्णवी चक्रभिन्नस्य रुधिरस्राव सम्भवैः । सहस्रशो जगद्व्याप्तं
    तत्प्रमाणैर्महासुरैः ॥ ॥ शक्त्या जघान कौमारी वाराही च तथासिना । माहेश्वरी त्रिशूलेन रक्तबीजं महासुरम्
    ॥ ॥ स चापि गदया दैत्यः सर्वा एवाहनत् पृथक् । मातॄः कोपसमाविष्टो रक्तबीजो महासुरः ॥ ॥ तस्याहतस्य बहुधा
    शक्तिशूलादि भिर्भुविः । पपात यो वै रक्तौघस्तेनासञ्चतशोऽसुराः ॥ ॥ तैश्चासुरासृक्सम्भूतैरसुरैः सकलं
    जगत् । व्याप्तमासीत्ततो देवा भयमाजग्मुरुत्तमम् ॥ ॥ तान् विषण्णा न् सुरान् दृष्ट्वा चण्डिका प्राहसत्वरम्
    । उवाच कालीं चामुण्डे विस्तीर्णं वदनं कुरु ॥ ॥ मच्छस्त्रपातसम्भूतान् रक्तबिन्दून् महासुरान् । रक्तबिन्दोः
    प्रतीच्छ त्वं वक्त्रेणानेन वेगिना ॥ ॥ भक्षयन्ती चर रणो तदुत्पन्नान्महासुरान् । एवमेष क्षयं दैत्यः
    क्षेण रक्तो गमिष्यति ॥ ॥ भक्ष्य माणा स्त्वया चोग्रा न चोत्पत्स्यन्ति चापरे । इत्युक्त्वा तां ततो देवी
    शूलेनाभिजघान तम् ॥ ॥ मुखेन काली जगृहे रक्तबीजस्य शोणितम् । ततोऽसावाजघानाथ गदया तत्र चण्डिकां ॥ ॥ न
    चास्या वेदनां चक्रे गदापातोऽल्पिकामपि । तस्याहतस्य देहात्तु बहु सुस्राव शोणितम् ॥ ॥ यतस्ततस्तद्वक्त्रेण
    चामुण्डा सम्प्रतीच्छति । मुखे समुद्गता येऽस्या रक्तपातान्महासुराः ॥ ॥ तांश्चखादाथ चामुण्डा पपौ तस्य
    च शोणितम् ॥ ॥ देवी शूलेन वज्रेण बाणैरसिभिर् ऋष्टिभिः । जघान रक्तबीजं तं चामुण्डा पीत शोणितम् ॥ ॥ स
    पपात महीपृष्ठे शस्त्रसङ्घसमाहतः । नीरक्तश्च महीपाल रक्तबीजो महासुरः ॥ ॥ ततस्ते हर्ष मतुलं अवापुस्त्रिदशा
    नृप । तेषां मातृगणो जातो ननर्तासृंङ्गमदोद्धतः ॥ ॥ ॥ स्वस्ति श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे
    देवि महत्म्ये रक्तबीजवधोनाम अष्टमोध्याय समाप्तम् ॥ आहुति ॐ जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै
    रक्ताक्ष्यै अष्टमातृ सहितायै महाहुतिं समर्पयामि नमः स्वाहा ॥
