    वरदो भवन्तु ॥ उत्तरे शुभकर्मण्यविघ्नमस्तु इति भवन्तो ब्रुवन्तु । उत्तरे शुभकर्मणि अविघ्नमस्तु ॥ तीर्थं
    अकालमृत्युहरणं सर्वव्याधिनिवारणम् । समस्तपापक्षयकरं श्री महागणपति पादोदक म्पावनं शुभम् ॥ श्री महागणपति
    प्रसादं शिरसा गृह्णामि ॥ उद्वासनं ॐ यँ॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वाः । तानि॒ धर्मा॑णि प्रथ॒मान्या॑सन्न्
    । ते ह॒ नाक॑ म्महि॒मान॑स्सचन्ते । यत्र॒ पूर्वे॑ सा॒ध्यास्सन्ति॑ दे॒वाः ॥ ॐ श्री महागणपति नमः यथास्थानं
    उद्वासयामि ॥ शोभनार्थे क्षेमाय पुनरागमनाय च । ॐ शान्ति श्शान्तिः । श्री सत्यनारायणस्वामि परिवार पूजा
    पुन स्सङ्कल्पं पूर्वोक्त एव ङ्गुण विशेषण विशिष्टायां शुभ तिथौ मम इष्टकाम्यार्थ सिद्ध्यर्थ म्मम राजद्वारे
    राजमुखे सर्वदा दिग्विजय प्राप्त्यर्थ म्मम जन्मराशि वशात् नामराशि वशात् जन्मनक्षत्र वशात् नामनक्षत्र
    वशा थ्षड्बल वेद वशात् नित्य गोचार वेद वशात् मम ये ये ग्रहाः अरिष्ट स्थानेषु स्थिता स्स्तैः क्रियमान
    कर्ममान वर्तमान वर्तिष्यमान सूचित भावित आगामित दुष्टारिष्ट परिहार द्वारा आयुष्य अभिवृद्ध्यर्थ म्मम
    रमा परिवार समेत सत्यनारायण स्वामि अनुग्रह सिद्ध्यर्थं रमा परिवार समेत सत्यनारायण स्वामि प्रसादेन मम
    गृहे स्थिरलक्ष्मी प्राप्त्यर्थ म्मम रमापरिवार समेत श्री सत्यनारायण स्वामि व्रत पूजा ञ्च करिष्ये ।
    तदङ्ग गणपत्यादि पञ्चलोकपालकपूजाम् आदित्यादि नवग्रह पूजाम् इन्द्रादि अष्टदिक्पालकपूजा ञ्च करिष्ये ।
    आदौ व्रताङ्ग देवताराधन ङ्करिष्ये । वरुण पूज इ॒म म्मे॑ वरुण श्रुधी॒ हव॑ म॒द्या च॑ मृडय । त्वाम॑व॒स्यु
    राच॑के । ओ म्भूः वरुणमावाहयामि स्थापयामि पूजयामि । ब्रह्म॑ जज्ञा॒न स्सु॒रुचो॑ वे॒न आ॑वः । स बु॒ध्निया॑
    उप॒मा अ॑स्य वि॒ष्ठाः । स॒तश्च॒ योनि॒मस॑तश्च॒ विवः ॥ ओ म्ब्रह्ममावाहयामि स्थापयामि पूजयामि । पञ्चलोक
    पालक पूज न्त्वा ग॒णप॑तिं हवामहे क॒वि ङ्क॑वी॒नामु॑प॒मश्र॑वस्तमम् । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑
    शृ॒ण्वन्नू॒तिभि॑स्सीद॒ साद॑नम् ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवार समेतं गणपतिं लोँकपालकं
    आवाहयामि स्थापयामि पूजयामि । म्पद॒वीः क॑वी॒नामृषि॒र्विप्रा॑णा म् । श्ये॒नोगृध्रा॑णा॒ग्॒स्वधि॑ति॒र्वना॑ना॒ग्ं॒
    सोमः॑ प॒वित्र॒मत्ये॑ति॒ रेभन्॑ ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवार समेतं ब्रह्माणं लोँकपालकं
    आवाहयामि स्थापयामि पूजयामि । विँष्णु॒र्विच॑क्रमे त्रे॒धा निद॑धे प॒दम् । समू॑ढमस्यपाग्ं सु॒रे ॥ साङ्गं
    सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवार समेतं विष्णुं लोँकपालकं आवाहयामि स्थापयामि पूजयामि । ङ्कद्रु॒द्राय॒
    प्रचे॑तसे मी॒ढुष्ट॑माय॒ तव्य॑से। वो॒चेम॒ शन्त॑मं हृ॒दे ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवार
    समेतं रुद्रं लोँकपालकं आवाहयामि स्थापयामि पूजयामि । ङ्गौ॒रीर्मिमा॑य सलि॒लानि॒ तक्ष॒त्येक॑पदी द्वि॒पदी॒
    सा चतु॑ष्पदी । अ॒ष्टाप॑दी॒ नव॑पदी बभू॒वुषी॑ स॒हस्रा॑क्षरा पर॒मे व्यो॑मन्न् ॥ साङ्गं सायुधं सवाहनं
    सशक्ति म्पतिपुत्रपरिवार समेतं गौरीं लोँकपालकीं आवाहयामि स्थापयामि पूजयामि । गणेशादि पञ्चलोकपालक देवताभ्यो
    नमः । ध्यायामि शुद्धाचमनीयं समर्पयामि यज्ञोपवीतं समर्पयामि मन्त्रपुष्पं समर्पयामि । गणेशादि पञ्चलोकपालक
    देवता प्रसाद सिद्धिरस्तु ॥ नवग्रह पूज सूर्य ग्रहं ॐ आस॒त्येन॒ रज॑सा॒ वर्त॑मानो निवे॒शय॑न्न॒मृत॒ म्मर्त्य॑ञ्च
    । हि॒र॒ण्यये॑न सवि॒ता रथे॒ना ऽऽदे॒वो या॑ति॒भुव॑ना वि॒पश्यन्॑ ॥ ओ स्सूर्यग्रहे आगच्छ । सूर्यग्रहं रक्तवर्णं
    रक्तगन्धं रक्तपुष्पं रक्तमाल्याम्बरधरं रक्तच्छत्र ध्वजपताकादि शोभित म्प्रदक्षिणी कुर्वाण न्द्विभुजं
    सप्ताश्वं सप्तरज्जु वँत्सरे माघमासे शुक्लपक्षे सप्तम्या म्भानुवासरे अश्विनी नक्षत्रे जातं सिंहराश्यधिपति
    म्पत्नीपुत्रपरिवार समेत ङ्ग्रहमण्डले प्रविष्ठमस्मिन्नधिकरणे वर्तुलाकारमण्डले स्थापित स्वर्णप्रतिमारूपेण
    सूर्यग्रहमावाहयामि स्थापयामि पूजयामि । ॐ अ॒ग्नि विँ॒श्ववे॑दसम् । अ॒स्य य॒ज्ञस्य॑ सु॒क्रतु॑म् सूर्यग्रहस्य
    अधिदेवताः अग्निं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं सूर्यग्रहस्य दक्षिणतः अग्निमावाहयामि
    स्थापयामि पूजयामि । ओ ङ्कद्रु॒द्राय॒ प्रचे॑तसे मी॒ढुष्ट॑माय॒ तव्य॑से। वो॒चेम॒ शन्त॑मं हृ॒दे ॥ सूर्यग्रहस्य
    प्रत्यधिदेवताः रुद्रं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं सूर्यग्रहस्य उत्तरतः रुद्रमावाहयामि
    स्थापयामि पूजयामि । चन्द्र ग्रहं ॐ आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑स्सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य
    सङ्ग॒थे ॥ ओ श्चन्द्रग्रहे आगच्छ । चन्द्रग्रहं श्वेतवर्णं श्वेतगन्धं श्वेतपुष्पं श्वेतमाल्याम्बरधरं
    श्वेतच्छत्र ध्वजपताकादिशोभित म्प्रदक्षिणी कुर्वाण याँमुनदेशाधिपतिं आत्रेयसगोत्रं सौम्य सं वँत्सरे
    कार्तीकमासे शुक्लपक्षे पौर्णमास्यां इन्दुवासरे कृत्तिका नक्षत्रे जात म्पत्नीपुत्रपरि वारसमेत ङ्ग्रहमण्डले
    प्रविष्ठमस्मिन्नधि करणे सूर्यग्रहस्य आग्नेयदिग्भागे समचतुरश्रमण्डले स्थापित रजतप्रतिमा रूपेण चन्द्रग्रहमावाहयामि
    स्थापयामि पूजयामि । ॐ अ॒प्सुमे॒ सोमो॑ अब्रवीद॒न्तर्विश्वा॑नि भेष॒जा । अ॒ग्निञ्च॑ वि॒श्वश॑म्भुव॒माप॑श्च
    वि॒श्वभे॑षजीः ॥ चन्द्रग्रहस्य अधिदेवताः अपं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत ञ्चन्द्रग्रहस्य
    दक्षिणतः आपः आवाहयामि स्थापयामि पूजयामि । ओ ङ्गौ॒री मि॑माय सलि॒लानि॒ तक्ष॒त्येक॑पदी द्वि॒पदी॒ सा चतु॑ष्पदी
    । अ॒ष्टाप॑दी॒ नव॑पदी बभू॒वुषी॑ स॒हस्रा क्षरा पर॒मे व्यो॑मन्न् ॥ चन्द्रग्रहस्य प्रत्यधिदेवताः गौरीं
    साङ्गं सायुधं सवाहनं सशक्ति म्पतिपुत्रपरिवारसमेत ञ्चन्द्रग्रहस्य उत्तरतः गौरीं आवाहयामि स्थापयामि
    पूजयामि ॥ अङ्गारक ग्रहं ॐ अ॒ग्निर्मू॒र्धा दि॒वः क॒कुत्पतिः॑ पृथि॒व्या अ॒यम् । अ॒पाग्ंरेताग्ं॑सि जिन्वति
    ॥ ओ म्भूर्भुवस्सुवः अङ्गारकग्रहे आगच्छ । अङ्गारक ग्रहं रक्तवर्णं रक्तगन्धं रक्तपुष्पं रक्तमाल्याम्बरधरं
    रक्तच्छत्रध्वजपताकादिशोभित म्प्रदक्षिणी कुर्वाण ङ्गदाशूलशक्तिधरं अवन्ती देशाधिपति म्भारद्वाजसगोत्रं
    राक्षसनाम सं वँत्सरे आषाढमासे शुक्लपक्षे दशम्या म्भौमवासरे अनूराधा नक्षत्रे जात म्मेष वृश्चिक राश्याधिपति
    म्पत्नीपुत्रपरिवारसमेत ङ्ग्रहमण्डले प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य दक्षिणदिग्भागे त्रिकोणाकारमण्डले
    स्थापित ताम्रप्रतिमारूपेण अङ्गारकग्रहं आवाहयामि स्थापयामि पूजयामि ॥ ॐ स्यो॒ना पृ॑थिवि॒ भवा॑ ऽनृक्ष॒रा
    नि॒वेश॑नी । यच्छा॑न॒श्शर्म॑ स॒प्रथाः ॥ अङ्गारकग्रहस्य अधिदेवताः पृथिवीं साङ्गं सायुधं सवाहनं सशक्ति
    म्पुत्रपरिवारसमेतं अङ्गारकग्रहस्य दक्षिणतः पृथिवीं आवाहयामि स्थापयामि पूजयामि । ओ ङ्क्षेत्र॑स्य॒ पति॑ना
    व॒यग्ंहि॒ते ने॑व जयामसि । गामश्व॑ म्पोष् अयि॒त्न्वा स नो॑ मृडाती॒दृशे ॥ अङ्गारकग्रहस्य प्रत्यधिदेवताः
    क्षेत्रपालकं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं अङ्गारकग्रहस्य उत्तरतः क्षेत्रपालकमावाहयामि
    स्थापयामि पूजयामि ॥ बुध ग्रहं ॐ उद्बु॑ध्यस्वाग्ने॒ प्रति॑जागृह्येनमिष्टापू॒र्ते सग्ंसृ॑जेथाम॒यञ्च॑
    । पुनः॑ कृ॒ण्वग्ग् युँवा॑नम॒न्वाताग्ं॑सी॒त्त्वयि॒ तन्तु॑मे॒तम् ॥ ओ म्भूर्भुवस्सुवः बुधग्रहे आगच्छ
    । बुधग्रह म्पीतच्छत्र ध्वजपताकादि शोभित म्प्रदक्षिणी कुर्वाणं सिंहवाहनं उदङ्मुख ङ्खड्गचर्माम्बरधरं
    आत्रेयसगोत्रं अङ्गीरसनामसं षमासे शुक्लपक्षे सप्तम्यां सौम्यवासरे पूर्वाभाद्रा नक्षत्रे जात म्मिथुन
    कन्या राश्यधिपति म्पत्नीपुत्र परिवारसमेत ङ्ग्रहमण्डले प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य ईशान्यदिग्भागे
    बाणाकारमण्डले स्थापित कांस्यप्रतिमारूपेण बुधग्रहं आवाहयामि स्थापयामि पूजयामि । ॐ इ॒दं विँष्णु॒र्विच॑क्रमे
    त्रे॒धा निद॑धे प॒दम् । समू॑ढमस्यपाग्ं सु॒रे ॥ विष्णो॑ र॒राट॑मसि॒ विष्णोः पृ॒ष्ठम॑सि॒ विष्णो॒श्श्नप्त्रे
    स्थो॒ विष्णो॒स्स्यूर॑सि॒ विष्णो र्ध्रु॒वम॑सि वैष्ण॒वम॑सि॒ विष्ण॑वे त्वा ॥ बुधग्रहस्य अधिदेवताः विष्णुं
    साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत म्बुधग्रहस्य दक्षिणतः विष्णुमावाहयामि स्थापयामि
    पूजयामि । ॐ स॒हस्र॑शीर् षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम्
    । बुधग्रहस्य प्रत्यधिदेवताः नारायणं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत म्बुधग्रहस्य
    उत्तरतः नारायणमावाहयामि स्थापयामि पूजयामि । म्बृह॑स्पते॒ अति॒यद॒र्यो अर् द्द्यु॒मद्वि॒भाति॒ क्रतु॑म॒ज्जने॑षु
    । यद्दी॒दय॒च्चव॑सर्तप्रजात॒ तद॒स्मासु॒ द्रवि॑णन्धेहि चि॒त्रम् ॥ ओ म्भूर्भुवस्सुवः बृहस्पतिग्रहे आगच्छ
    । बृहस्पतिग्रह ङ्कनकच्छत्र ध्वजपताकादिशोभित म्प्रदक्षिणीकुर्वाणा न्दण्डाक्षमालाधारिणं सिन्धु द्वीपदेशाधिपतिं
    आङ्गीरसगोत्रं आङ्गीरससं वँत्सरे वैशाखेमासे शुक्लपक्षे एकादश्या ङ्गुरुवासरे उत्तरा नक्षत्रे जात न्धनुर्मीनराश्यधिपति
    म्पत्नीपुत्रपरिवारसमेतं ग्रहमण्डले प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य उत्तरदिग्भागे दीर्घचतुरस्राकारमण्डले
    स्थापित त्रपुप्रतिमारूपेण बृहस्पतिग्रहं आवाहयामि स्थापयामि पूजयामि । ओ म्पु॒रस्ता॒द्विसी॑म॒तस्सु॒रुचो॑
    वे॒न आ॑वः । सबु॒ध्निया॑ उप॒मा अ॑स्य वि॒ष्ठास्स॒तश्च॒ योनि॒मस॑तश्च॒ विवः॑ ॥ बृहस्पतिग्रहस्य अधिदेवता
    म्ब्रह्माणं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत म्बृहस्पतिग्रहस्य दक्षिणतः ब्रह्माणमावाहयामि
    स्थापयामि पूजयामि । ॐ इन्द्र॑मरुत्व इ॒ह पा॑हि॒ सोमं॒ यँथा॑ शार्या॒ते अपि॑बस्सु॒तस्य॑ । तव॒ प्रणी॑ती॒
    तव॑ शूर॒शर्म॒न्नावि॑वासन्ति क॒वय॑स्सुय॒ज्ञाः ॥ बृहस्पतिग्रहस्य प्रत्यधिदेवताः इन्द्रं साङ्गं सायुधं
    सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत म्बृहस्पतिग्रहस्य उत्तरतः इन्द्रमावाहयामि स्थापयामि पूजयामि ।
    शुक्र ग्रहं ॐ शु॒क्र न्ते॑ अ॒न्यत् । विषु॑रूपे॒ अह॑नी॒ द्यौरि॑वासि । विश्वा॒ हि मा॒या अव॑सि स्वधावः
    । भ॒द्रा ते॑ पूषन्नि॒ह रा॒तिर॒स्त्विति॑ । श्शुक्रग्रहे आगच्छ । शुक्रग्रहं श्वेतवर्णं श्वेतगन्धं श्वेतपुष्पं
    श्वेतमाल्याम्बरधरं श्वेतच्छत्र ध्वजपताकादिशोभित म्प्रदक्षिणी कुर्वाण न्दण्डाक्षमाला जटावल्कल धारिणि
    वँत्सरे श्रावणमासे शुक्लपक्षे अष्टम्या म्भृगुवासरे स्वाती नक्षत्रे जात न्तुला वृषभराश्यधिपति म्पत्नीपुत्रपरिवार
    समेत ङ्ग्रहमण्डले प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य प्राग्भागे पञ्चकोणाकार मण्डले स्थापित सीस प्रतिमारूपेण
    शूक्रग्रहं आवाहयामि स्थापयामि पूजयामि । ॐ इ॒न्द्रा॒णीमा॒सु नारि॑षु सु॒पत् ंई॑म॒हम॑श्रवम् । न ह्य॑स्या
    अप॒रञ्च॒न ज॒रसा॒ मर॑ते॒ पतिः॑ ॥ शुक्रग्रहस्य अधिदेवतां इन्द्राणीं साङ्गां सायुधां सवाहनं सशक्ति म्पतिपुत्रपरिवारसमेतां
    शुक्रग्रहस्य दक्षिणतः इन्द्राणीं आवाहयामि स्थापयामि पूजयामि । ॐ इन्द्र॑ मरुत्व इ॒ह पा॑हि॒ सोमं॒ यँथा॑
    शार्या॒ते अपि॑ब स्सु॒तस्य॑ । तव॒ प्रणी॑ती॒ तव॑ शूर॒ शर्म॒न्ना वि॑वासन्ति क॒वयः॑ सुय॒ज्ञाः ॥ शुक्रग्रहस्य
    प्रत्यधिदेवतां इन्द्रमरुत्वन्तं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं शुक्रग्रहस्य उत्तरतः
    इन्द्रमरुत्वन्तमावाहयामि स्थापयामि पूजयामि । शनि ग्रहं ॐ शम॒ग्निर॒ग्निभिः॑ कर॒च्छ न्न॑स्तपतु॒ सूर्यः॑
    । शं वाँतो॑ वात्वर॒पा अप॒ स्त्रिधः॑ ॥ श्शनैश्चरग्रहे आगच्छ । शनैश्चरग्रह न्नीलच्छत्र ध्वजपताकादिशोभित
    म्प्रदक्षिणी कुर्वाण ञ्चतुर्भुजं शूलायुधधरं सौराष्ट्रदेशाधिपति वँत्सरे पौष्यमासे शुक्लपक्षे नवम्यां
    स्थिरवासरे भरणी नक्षत्रे जात म्मकुर कुम्भ राश्यधिपति म्पत्नीपुत्रपरिवारसमेत ङ्ग्रहमण्डले प्रविष्टमस्मिन्नधिकरणे
    सूर्यग्रहस्य पश्चिमदिग्भागे धनुराकारमण्डले स्थापित अयः प्रतिमारूपेण शनैश्चरग्रहमावाहयामि स्थापयामि
    पूजयामि । ॐ यँ॒माय॒ सोमं॑ सुनुत य॒माय॑ जुहुता ह॒विः । य॒मं ह॑ य॒ज्ञो ग॑च्छत्य॒ग्निदू॑तो॒ अर॑ङ्कृतः
    ॥ शनैश्चरग्रहस्य अधिदेवतां यँमं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं शनैश्चरग्रहस्य
    दक्षिणतः यमं आवाहयामि स्थापयामि पूजयामि । ओ म्प्रजा॑पते॒ न त्वदे॒तान्य॒न्यो विश्वा॑ जा॒तानि॒ परि॒
    ता ब॑भूव । यत्का॑मास्ते जुहु॒मस्तन्नो॑ अस्तु व॒यं स्या॑म॒ पत॑यो रयी॒णाम् ॥ शनैश्चरग्रहस्य प्रत्यधिदेवता
    म्प्रजापतिं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं शनैश्चरग्रहस्य उत्तरतः प्रजापतिमावाहयामि
    स्थापयामि पूजयामि । ङ्कया॑ नश्चि॒त्र आभु॑वदू॒ती स॒दावृ॑ध॒स्सखा । कया॒ शचि॑ष्ठया वृ॒ता ॥ ओ म्भूर्भुवस्सुवः
    राहुग्रहे आगच्छ । राहुग्रह न्धूम्रच्छत्र ध्वजपताकादिशोभित म्मेरुं अप्रदक्षिणी कुर्वाणं सिंहासन न्नैऋति
    मुखं शूर्पासनस्थ म्बर्बरदेशाधिपतिं राक्षसनामसं वँत्सरे भाद्रपदमासे कृष्ण पक्षे चतुर्दश्या म्भानुवासरे
    विशाखा नक्षत्रे जातं सिंहराशि प्रयुक्त ङ्किरीटिनं सुखासीनं सशक्ति म्पत्नीपुत्रपरिवारसमेत ङ्ग्रहमण्डले
    प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य नैऋतिदिग्भागे शूर्पाकार मण्डले स्थापित लोहप्रतिमा रूपेण राहुग्रहमावाहयामि
    स्थापयामि पूजयामि । ॐ आ ऽयङ्गौः पृश्नि॑रक्रमी॒दस॑नन्मा॒तर॒ म्पुनः॑ । पि॒तर॑ञ्च प्र॒यन्त्सुवः॑ ॥ राहुग्रहस्य
    अधिदेवता ङ्गां साङ्गं सायुधं सवाहनां सशक्ति म्पतिपुत्रपरिवारसमेतं राहुग्रहस्य दक्षिणतः गां आवाहयामि
    स्थापयामि पूजयामि । ओ न्नमो॑ अस्तु स॒र्पेभ्यो॒ ये के च॑ पृथि॒वीं अनु॑ । ये अ॒न्तरि॑क्षे॒ ये दिवि॒
    तेभ्य॑स्स॒र्पेभ्यो॒ नमः॑ ॥ राहुग्रहस्य प्रत्यधिदेवतां सर्पं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं
    राहुग्रहस्य उत्तरत स्सर्पमावाहयामि स्थापयामि पूजयामि । ङ्के॒तुङ्कृ॒ण्वन्न॑के॒तवे॒ पेशो॑ मर्या अपे॒शसे
    । समु॒षद्भि॑रजायथाः ॥ ओ म्भूर्भुवस्सुवः केतुगणैः आगच्छ । केतुगण ञ्चित्रच्छत्र ध्वजपताकादिशोभित म्मेरुं
    अप्रदक्षिणी कुर्वाण न्दक्षिणाभिमुखं अन्तर्वेदि देशाधिपति ञ्जैमिनि गोत्रं राक्षसनाम सं वँत्सरे चैत्रमासे
    कृष्णपक्षे चतुर्दश्यां इन्दुवासरे रेवती नक्षत्रेजात ङ्कर्कटकराशि प्रयुक्तं सिंहासनासीन ङ्ग्रहमण्डले
    प्रविष्टमस्मिन्नधिकरणे सूर्यग्रहस्य वायव्य दिग्भागे ध्वजाकार मण्डले स्थापित पञ्चलोह प्रतिमारूपेण केतुगणमावाहयामि
    स्थापयामि पूजयामि । ॐ सचि॑त्र चि॒त्र तम॒स्मे चित्र॑क्षत्र चि॒त्रत॑मं वँयो॒धाम् । च॒न्द्रं र॒यि ञ्चन्द्र॑च॒न्द्राभि॑र्गृण॒ते
    यु॑वस्व ॥ केतुगणस्य अधिदेवता ञ्चित्रगुप्तं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत श्चित्रगुप्तमावाहयामि
    स्थापयामि पूजयामि । ओ म्पद॒वीः क॑वी॒नामृषि॒र्विप्रा॑णा म् । श्ये॒नोगृध्रा॑णा॒ग्॒स्वधि॑ति॒र्वना॑ना॒ग्ं॒
    सोमः॑ प॒वित्र॒मत्ये॑ति॒ रेभन्॑ ॥ केतुगणस्य प्रत्यधिदेवता म्ब्रह्माणं साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत
    ङ्केतुग्रहस्य उत्तरतः ब्रह्माणमावाहयामि स्थापयामि पूजयामि । अधिदेवता प्रत्यधिदेवता सहितादित्यादि नवग्रह
    देवताभ्यो नमः ध्यायामि रत्नसिंहासनं समर्पयामि शुद्धाचमनीयं समर्पयामि यज्ञोपवीतं समर्पयामि मन्त्रपुष्पं
    समर्पयामि । अधिदेवता प्रत्यधिदेवतासहितादित्यादि नवग्रह देवता प्रसादसिद्धिरस्तु । इन्द्रादि अष्टदिक्पालक
    पूज इन्द्रुडु ॐ इन्द्रं॑ वोँ वि॒श्वत॒स्परि॒ हवा॑महे॒ जने॑भ्यः । अ॒स्माक॑मस्तु॒ केव॑लः ॥ साङ्गं सायुधं
    सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत म्प्राग्दिग्भागे इन्द्र न्दिक्पालकमावाहयामि स्थापयामि पूजयामि
    ॥ विँ॒श्ववे॑दसम् । अ॒स्य य॒ज्ञस्य॑ सु॒क्रतु॑म् ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं
    आग्नेयदिग्भागे अग्नि न्दिक्पालकमावाहयामि स्थापयामि पूजयामि ॥ यँ॒माय॒ सोमं॑ सुनुत य॒माय॑ जुहुता ह॒विः
    । य॒मं ह॑ य॒ज्ञो ग॑च्छत्य॒ग्निदू॑तो॒ अर॑ङ्कृतः ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत
    न्दिक्पालकमावाहयामि स्थापयामि पूजयामि ॥ म्मॊ षु णः॒ परा॑परा॒ निर् हणा॑ वधीत् । प॒दी॒ष्ट तृष्ण॑या स॒ह
    ॥ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेत न्नैऋतिदिग्भागे निर् न्दिक्पालकमावाहयामि स्थापयामि
    पूजयामि ॥ म्मे॑ वरुण श्रुधी॒ हव॑ म॒द्या च॑ मृडय । त्वाम॑व॒स्यु राच॑के । साङ्गं सायुधं सवाहनं सशक्ति
    म्पत्नीपुत्रपरिवारसमेत म्पश्चिमदिग्भागे वरुण न्दिक्पालकमावाहयामि स्थापयामि पूजयामि ॥ न्तव॑ वायवृतस्पते॒
    त्वष्टु॑र्जामातरद्भुत । अवां॒स्या वृ॑णीमहे । साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं वाँयुव्यदिग्भागे
    वायु न्दिक्पालकमावाहयामि स्थापयामि पूजयामि ॥ कुबेरुडु ॐ सोमो॑ धे॒नुं सोमो॒ अर्व॑न्तमा॒शुं सोमो॑ वी॒र
    न्ददाति । सा॒द॒न्यं॑ साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं उत्तरदिग्भागे कुबेर न्दिक्पालकमावाहयामि
    स्थापयामि पूजयामि ॥ ञ्जग॑तस्त॒स्थुष॒स्पति॑ न्धियञ्जि॒न्वमव॑से हूमहे व॒यम् । पू॒षा नो॒ यथा॒ वेद॑सा॒मस॑द्वृ॒धे
    र॑क्षि॒ता पा॒युरद॑ब्ध साङ्गं सायुधं सवाहनं सशक्ति म्पत्नीपुत्रपरिवारसमेतं ईशानदिग्भागे ईशान न्दिक्पालकमावाहयामि
    स्थापयामि पूजयामि ॥ इन्द्रादि अष्टदिक्पालकदेवताभ्यो नमः ध्यायामि रत्नसिंहासनं समर्पयामि शुद्धाचमनीयं
    समर्पयामि यज्ञोपवीतं समर्पयामि मन्त्रपुष्पं समर्पयामि । इन्द्रादि अष्टदिक्पालक देवता प्रसादसिद्धिरस्तु
    । षोडशोपचार पूज पञ्चामृत स्नानं ॐ आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑स्सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे
    ॥ क्षीरेण स्नपयामि ॥ न्द॒धि॒क्राव्णो॑ अकारिष ञ्जि॒ष्णोरश्व॑स्य वा॒जिनः॑ । सु॒रभि नो॒ मुखा॑ कर॒त्प्रण॒
    आयूग्ं॑षि तारिषत् ॥ दध्ना स्नपयामि ॥ ॐ शु॒क्रम॑सि॒ ज्योति॑रसि॒ तेजो॑सि दे॒वोव॑स्सवि॒तोत्पु॑ना॒तु अच्छि॑द्रेण
    प॒वित्रे॑ण॒ वसो॒स्सूर्य॑स्य र॒श्मिभिः॑ । आज्येन स्नपयामि ॥ मधुवाता ऋतायते इति मधु म्मधु॒वाता॑ ऋताय॒ते
    मधु॑क्षरन्ति॒ सिन्ध॑वः । माध्वी स्स॒न्त्वौष॑धीः । मधु॒नक्त॑मु॒तोष॑सि॒ मधु॑म॒त्पार्थि॑व॒ग्ं॒ रजः॑ ।
    मधु॒द्यौर॑स्तु नः पि॒ता । मधु॑मान्नो॒ वन॒स्पति॒र्मधु॑माग् ं अस्तु॒ सूर्यः॑ । माध्वी॒र्गावो॑ भवन्तु
    नः । मधुना स्नपयामि ॥ स्वादुः पवस्येति शर्करा ॐ स्वा॒दुः प॑वस्व दि॒व्याय॒ जन्म॑ने । स्वा॒दुरिन्द्रा
    तु नाम्ने । स्वा॒दुर्मि॒त्राय॒ वरु॑णाय वा॒यवे॒ । बृह॒स्पत॑ये॒ मधु॑मां॒ अदा भ्यः । शर्करेण स्नपयामि
    ॥ फलोदकं याः फ॒लिनी॒र्या अ॑फ॒ला अ॑पु॒ष्पायाश्च॑ पु॒ष्पिणीः॑ । बृह॒स्पति॑ प्रसूता॒स्तानो॑ मुन्च॒न्त्वग्
    ं ह॑सः ॥ फलोदकेन स्नपयामि ॥ शुद्धोदकं ॐ आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से
    । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒
    जिन्व॑थ । आपो॑ ज॒नय॑था च नः । शुद्धोदकेन स्नपयामि । न्ना॒रा॒य॒णाय॑ वि॒द्महे॑ वासुदे॒वाय॑ धीमहि । तन्नो॑
    विष्णुः प्रचो॒दया म्म॒हा॒दे॒व्यै च॑ वि॒द्महे॑ विष्णुप॒त्नी च॑ धीमहि । तन्नो॑ लक्ष्मीः प्रचो॒दया त्
    ॥ अस्मिन्कलशे अस्या म्प्रतिमायां श्रीरमासहित सत्यनारायण स्वामिन् आवाहयामि स्थापयामि पूजयामि ॥ प्राणप्रतिष्ठापनं
    ॐ अस्य श्री प्राणप्रतिष्ठापन महामन्त्रस्य ब्रह्मविष्णुमहेश्वरा ऋषयः ऋग्यजुस्सामाथर्वाणि छन्दांसि श्रीरमासहित
    सत्यनारायण स्वामि देवता प्राणप्रतिष्ठार्थे विनियोगः । करन्यासं ॐ आं अङ्गुष्ठाभ्या न्नमः । ॐ आं अनामिकाभ्या
    न्नमः । अङ्गन्यासं ॐ आं हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ओ ङ्क्रों शिखयै वषट् । ॐ आ ङ्कवचाय हुम्
    । ॐ ह्री न्नेत्रत्रयाय वौषट् । ओ ङ्क्रों अस्त्राय फट् । ओ म्भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानं
    रक्ताम्भोधिस्थपोतोल्लसदरुणसरोजाधिरूढा कराब्जैः । पाश ङ्कोदण्डमिक्षूद्भवमलिगुणमप्यङ्कुश ञ्चापबाणाम्
    । बिभ्राणा सृक्कपाल न्त्रिणयनलसिता पीनवक्षोरुहाढ्या । देवी बालार्कवर्णा भवतु सुखकरी प्राणशक्तिः परा
    नः । ॐ शान्ताकार म्पद्मनाभं सुरेशं विश्वाकार म्मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्त योँगिहृद्ध्यानगम्यं
    वन्दे विष्णु म्भवभयहरं सर्वलोकैकनाथम् ॥ ॐ आं ह्री म्मूर्तौ श्री रमासहित सत्यनारायण स्वामि देवता प्राणः
    इह प्राणः । श्री रमासहित सत्यनारायण स्वामि देवता जीवः इह म्मूर्तौ श्री रमासहित सत्यनारायणस्य सर्वेन्द्रियाणि
    वाङ्मनः त्वक्चक्षु श्श्रोत्र जिह्वा घ्राण वाक्पाणिपाद पायूपस्थानि इहैवागत्य सुख न्तिष्टन्तु स्वाहा
    । ॐ असु॑नीते॒ पुन॑र॒स्मासु॒ चक्षुः॒ पुनः॑ प्रा॒णमि॒ह नो म् । ज्योक्प॑श्येम॒ सूर्य॑मु॒च्चर स्स्व॒स्ति
    ॥ अ॒मृतं॒ वैँ प्रा॒णा अ॒मृत॒मापः॑ प्रा॒णाने॒व य॑थास्था॒नमुप॑ह्वयते ॥ आवाहितो भव स्थापितो भव । सुप्रसन्नो
    भव वरदो भव । स्वामिन् सर्वजगन्नाथ यावत्पूजावसानकम् । तावत्त्व ङ्कुरु ॥ साङ्गं सायुधं सवाहनं सशक्ति
    म्पत्नीपुत्रपरिवारसमेतं श्री रमासहित सत्यनारायण स्वामिने नमः आवाहयामि स्थापयामि पूजयामि ॥ ध्यानं ध्यायेत्सत्य
    ङ्गुणत्रयसमन्वितम् । लोकनाथ ङ्कौस्तुभाभरणं हरिम् ॥ पीताम्बर न्नीलवर्णं श्रीवत्स पदभूषितम् । गोविन्द
    म्ब्रह्माद्यैरपि पूजितम् ॥ श्री रमासहित सत्यनारायण स्वामिने नमः ध्यानं समर्पयामि ॥ आवाहनं ॐ स॒हस्र॑शीर्
    षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम् ।
    ज्योतिश्शान्तं सर्वलोकान्तरस्थं ओङ्काराख्यं योँगिहृद्ध्यानगम्यम् । साङ्गं शक्तिं सायुध म्भक्तिसेव्यं
    सर्वाकारं विँष्णुमावाहयामि ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नमः आवाहनं समर्पयामि । आसनं पुरु॑ष
    ए॒वेदग्ं सर्वम् । उ॒तामृ॑त॒त्वस्येशा॑नः । य॒दन्ने॑नाति॒रोह॑ति । कल्पद्रुमूले मणिवेदिमध्ये सिंहासनं
    स्वर्णमयं विँचित्रम् । विचित्र वस्त्रावृतमच्युत प्रभो गृहाण लक्ष्मीधरणीसमेत ॥ ॐ श्री रमासहित सत्यनारायण
    स्वामिने नमः आसनं समर्पयामि । पाद्यं ए॒तावा॑नस्य महि॒मा । अतो॒ ज्यायाग्॑श्च॒ पूरु॑षः । पादो ऽस्य॒
    विश्वा॑ भू॒तानि॑ । त्रि॒पाद॑स्या॒मृत॑ न्दि॒वि । नारायण नमस्ते ऽस्तु नरकार्णवतारक । पाद्य ङ्गृहाण देवेश
    मम सौख्यं विँवर्थय ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नमः पादयोः पाद्यं समर्पयामि । अर्घ्यं त्रि॒पादू॒र्ध्व
    उदै॒त्पुरु॑षः । पादो ऽऽभ॑वा॒त्पुनः॑ । ततो॒ विष्व॒ङ्व्य॑क्रामत् । सा॒श॒ना॒न॒श॒ने अ॒भि । व्यक्ता ऽव्यक्त
    स्वरूपाय हृषीकपतये नमः । मया निवेदितो भक्त्याह्यर्घ्यो म्प्रतिगृह्यताम् ॥ ॐ श्री रमासहित सत्यनारायण
    स्वामिने नमः हस्तयोः अर्घ्यं समर्पयामि । आचमनीयं तस्मा द्वि॒राड॑जायत । वि॒राजो॒ अधि॒ पूरु॑षः । स जा॒तो
    अत्य॑रिच्यत । प॒श्चाद्भूमि॒मथो॑ पु॒रः । मन्दाकिन्यास्तु यद्वारि सर्वपापहरं शुभम् । तदिद विँभो ॥ ॐ
    श्री रमासहित सत्यनारायण स्वामिने नमः मुखे आचमनीयं समर्पयामि । स्नानं यत्पुरु॑षेण ह॒विषा । दे॒वा य॒ज्ञमत॑न्वत
    । व॒स॒न्तो अ॑स्यासी॒दाज्यम् । ग्री॒ष्म इ॒ध्मश्श॒रद्ध॒विः । पञ्चामृत स्नानं आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑स्सोम॒
    वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नमः क्षीरेण स्नपयामि । द॒धि॒क्राव्णो॑
    अकारिष ञ्जि॒ष्णोरश्व॑स्य वा॒जिनः॑ । सु॒र॒भि नो॒ मुखा॑ कर॒त्प्राण॒ आयूग्ं॑षि तारिषत् ॥ ॐ श्री रमासहित
    सत्यनारायण स्वामिने नमः दध्ना स्नपयामि । शु॒क्रम॑सि॒ ज्योति॑रसि॒ तेजो॑सि दे॒वोव॑स्सवि॒तोत्पु॑ना॒तु
    अच्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒स्सूर्य॑स्य र॒श्मिभिः॑ । ॐ श्री रमासहित सत्यनारायण स्वामिने नमः आज्येन
    स्नपयामि । मधु॒वाता॑ ऋताय॒ते मधु॑क्षरन्ति॒ सिन्ध॑वः । माध्वी स्स॒न्त्वौष॑धीः । मधु॒नक्त॑मु॒तोष॑सि॒
    मधु॑म॒ त्पार्थि॑व॒ग्ं॒रजः॑ । मधु॒द्यौर॑स्तु नः पि॒ता । मधु॑मान्नो॒ वन॒स्पति॒र्मधु॑माग् ं अस्तु॒ सूर्यः॑
    । माध्वी॒र्गावो॑ भवन्तु नः । ॐ श्री रमासहित सत्यनारायण स्वामिने नमः मधुना स्नपयामि । स्वा॒दुः प॑वस्व
    दि॒व्याय॒ जन्म॑ने । स्वा॒दुरिन्द्रा तु नाम्ने । स्वा॒दुर्मि॒त्राय॒ वरु॑णाय वा॒यवे॒ । बृह॒स्पत॑ये॒
    मधु॑मां॒ अदा भ्यः । ॐ श्री रमासहित सत्यनारायण स्वामिने नम श्शर्करेण स्नपयामि । याः फ॒लिनी॒र्या अ॑फ॒ला
    अ॑पु॒ष्पायाश्च॑ पु॒ष्पिणीः॑ । बृह॒स्पति॑ प्रसूता॒स्तानो॑ मुन्च॒न्त्वग् ं ह॑सः ॥ ॐ श्री रमासहित सत्यनारायण
    स्वामिने नमः फलोदकेन स्नपयामि । शुद्धोदक स्नानं आपो॒ हिष्ठा म॑यो॒भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒
    चक्ष॑से । यो वः॑ शि॒वत॑मो रस॒स्तस्य॑ भाजयते॒ ह नः॑ । उ॒श॒तीरि॑व मा॒त॑रः । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒
    क्षया॑य॒ जिन्व॑थ । आपो॑ ज॒नय॑था च नः । तीर्थोदकैः काञ्चनकुम्भ संस्थैः सुवासितैर्देव कृपारसार्द्रैः
    । मयार्पितं स्नानविधि ङ्गृहाण पादाब्जनिष्य्टूत नदीप्रवाहः । नदीना न्निर्मलोदकम् । स्नानं स्वीकुरु
    देवेश मया दत्तं सुरेश्वर ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नम श्शुद्धोदक स्नानं समर्पयामि । स्नानानन्तरं
    शुद्ध आचमनीयं समर्पयामि ॥ वस्त्रं स॒प्तास्या॑सन्परि॒धयः॑ । त्रि स्स॒प्त स॒मिधः॑ कृ॒ताः । दे॒वा यद्य॒ज्ञ
    न्त॑न्वा॒नाः । अब॑ध्न॒न्पुरु॑ष म्प॒शुम् । वेदसूक्तसमायुक्ते यज्ञसाम समन्विते । सर्ववर्णप्रदे देव वास
    शीते विनिर्मिते ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नमः वस्त्रयुग्मं समर्पयामि । यज्ञोपवीतं तं हिषि॒
    प्रौक्षन्॑ । पुरु॑ष ञ्जा॒तम॑ग्र॒तः । तेन॑ दे॒वा अय॑जन्त । सा॒ध्या ऋष॑यश्च॒ ये । ब्रह्म विष्णु महेशाना
    म्ब्रह्मसूत्रकम् । गृहाण भगवन्विष्णो सर्वेष्टफलदो भव ॥ ॐ श्री रमासहित सत्यनारायण स्वामिने नमः यज्ञोपवीतं
    समर्पयामि । गन्धं तस्मा द्य॒ज्ञात्स॑र्व॒हुतः॑ । सम्भृ॑त म्पृषदा॒ज्यम् । प॒शूग् श्च॑क्रे वाय॒व्यान्॑
    । आ॒र॒ण्यान्ग्रा॒म्याश्च॒ ये । श्रीखण्ड ङ्गन्धाढ्यं सुमनोहरम् । विलेपनं सुरश्रेष्ठ प्रीत्यर्थ म्प्रतिगृह्यताम्
