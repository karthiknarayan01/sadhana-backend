id: mundaka-upanishad-mundaka-3-section-1
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 3, Section 1
content:
  english: '|| tritiya mundake prathamah khandah || dva suparna sayuja sakhaya samanam mparishasvajate
    | tayoranyah pippalam svadvattyanashnannanyo abhicakashiti || || samane vrikshe purusho nimagno ''nishaya
    shocati muhyamanah | jushtam ya~da pashyatyanyamishamasya mahimanamiti vitashokah || || yada pashyah
    pashyate rukmavarnam kartaramisha mbrahmayonim | tada vidva npunyapape vidhuya niranjanah paramam
    samyamupaiti || ssarvabhutairvibhati vijanan vidva nbhavate nativadi | atmakrida atmaratih kriyava
    || satyena labhyastapasa hyesha atma samyagjnanena brahmacaryena nityam | antassharire jyotirmayo
    hi shubhro ya || satyameva jayate nanritam satyena pantha vitato devayanah | yenakramantyrishayo hyaptakama
    yatra ta || brihacca tad divyamacintyarupam sukshmacca ta thsudure tadihantike ca pashyatsvihaiva
    nihita || na cakshusha grihyate napi vaca nanyairdevaistapasa karmana va | jnanaprasadena vishuddhasattva
    mpashyate nishkalam dhyayamanah || ''nuratma cetasa veditavyo yasmi vi~vesha | pranaishcittam sarvamota
    mprajanam yasmin vishuddhe vibhavatyesha atma || vi~bhati vishuddhasattvah kamayate yamshca kaman
    | ta stasmadatmajnam hyarcayet bhutikamah || || || iti mundakopanishadi tritiyamundake prathamah khandah
    ||'
  devanagari: ॥ तृतीय मुण्डके प्रथमः खण्डः ॥ द्वा सुपर्णा सयुजा सखाया समानं म्परिषस्वजाते । तयोरन्यः पिप्पलं
    स्वाद्वत्त्यनश्नन्नन्यो अभिचाकशीति ॥ ॥ समाने वृक्षे पुरुषो निमग्नो ऽनीशया शोचति मुह्यमानः । जुष्टं
    यँदा पश्यत्यन्यमीशमस्य महिमानमिति वीतशोकः ॥ ॥ यदा पश्यः पश्यते रुक्मवर्णं कर्तारमीश म्ब्रह्मयोनिम्
    । तदा विद्वा न्पुण्यपापे विधूय निरञ्जनः परमं साम्यमुपैति ॥ स्सर्वभूतैर्विभाति विजानन् विद्वा न्भवते
    नातिवादी । आत्मक्रीड आत्मरतिः क्रियावा ॥ सत्येन लभ्यस्तपसा ह्येष आत्मा सम्यग्ज्ञानेन ब्रह्मचर्येण
    नित्यम् । अन्तस्शरीरे ज्योतिर्मयो हि शुभ्रो य ॥ सत्यमेव जयते नानृतं सत्येन पन्था विततो देवयानः । येनाक्रमन्त्यृषयो
    ह्याप्तकामा यत्र त ॥ बृहच्च तद् दिव्यमचिन्त्यरूपं सूक्ष्माच्च त थ्सुदूरे तदिहान्तिके च पश्यत्स्विहैव
    निहित ॥ न चक्षुषा गृह्यते नापि वाचा नान्यैर्देवैस्तपसा कर्मणा वा । ज्ञानप्रसादेन विशुद्धसत्त्व म्पश्यते
    निष्कलं ध्यायमानः ॥ ऽणुरात्मा चेतसा वेदितव्यो यस्मि विँवेश । प्राणैश्चित्तं सर्वमोत म्प्रजानां यस्मिन्
    विशुद्धे विभवत्येष आत्मा ॥ विँभाति विशुद्धसत्त्वः कामयते यांश्च कामान् । त स्तस्मादात्मज्ञं ह्यर्चयेत्
    भूतिकामः ॥ ॥ ॥ इति मुण्डकोपनिषदि तृतीयमुण्डके प्रथमः खण्डः ॥
