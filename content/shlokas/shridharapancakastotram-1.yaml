id: shridharapancakastotram-1
category: stotram
name:
  english: shridharapancakastotram 1
  devanagari: श्रीधरपन्चकस्तोत्रम् १
content:
  english: mahamsvarupena sada virajitam | pratyakparanandaghanaprakashakam shrishridharam svatmapadam
    bhaje shivam || 3|| bhavabhayaharamisham nityamokshasvarupam niratishayasushantam nirmalam nityatriptam
    | pragalitajagadishajnanajivatmabhavam nirupamasukhasindhum shridharam tam namami || 4|| karacaranavihinam
    kalpanatotamekam niravadhinijabodham shuddhacinmatrarupam | analataranicandaihsarvadanaiva bhantam
    nirupamasukhasindhum shridharam tam namami || 5|| ishvarapreritam stotram shubham shridharapancakam
    | ye pathanti muda bhaktya te prayanti param padam || iti bra
  devanagari: महंस्वरूपेण सदा विराजितम् । प्रत्यक्परानन्दघनप्रकाशकं श्रीश्रीधरं स्वात्मपदं भजे शिवम् ॥
    ३॥ भवभयहरमीशं नित्यमोक्षस्वरूपं निरतिशयसुशान्तं निर्मलं नित्यतृप्तम् । प्रगलितजगदिशाज्ञानजीवात्मभावं
    निरुपमसुखसिन्धुं श्रीधरं तं नमामि ॥ ४॥ करचरणविहीनं कल्पनातोतमेकं निरवधिनिजबोधं शुद्धचिन्मात्ररूपम्
    । अनलतरणिचन्दैःसर्वदानैव भान्तं निरुपमसुखसिन्धुं श्रीधरं तं नमामि ॥ ५॥ ईश्वरप्रेरितं स्तोत्रं शुभं
    श्रीधरपञ्चकम् । ये पठन्ति मुदा भक्त्या ते प्रयान्ति परं पदम् ॥ इति ब्र
meaning: {}
