id: ramahridayastotram
category: hridaya
name:
  english: ramahridayastotram
  devanagari: रमाहृदयस्तोत्रम्
content:
  english: pratah shuddhatarah pathantyabhimatan sarvan labhante shubhan || namavalih om shri shriyai
    namah | om shripadmayai namah | om shrikamalayai namah | om shrimukundamahishyai namah | om shrilakshmyai
    namah | om shritrilokeshvaryai namah | om shrimayai namah | om shrikshirabdhisutayai namah | om shrivirincijananyai
    namah | om shrividyayai namah | om shrisarojasanayai namah | om shrisarvabhishtaphalapradayai namah
    | iti ramahridaya stotram sampurnam |
  devanagari: प्रातः शुद्धतराः पठन्त्यभिमतान् सर्वान् लभन्ते शुभान् ॥ नामावलिः ॐ श्री श्रियै नमः । ॐ श्रीपद्मायै
    नमः । ॐ श्रीकमलायै नमः । ॐ श्रीमुकुन्दमहिष्यै नमः । ॐ श्रीलक्ष्म्यै नमः । ॐ श्रीत्रिलोकेश्वर्यै नमः
    । ॐ श्रीमायै नमः । ॐ श्रीक्षीराब्धिसुतायै नमः । ॐ श्रीविरिञ्चिजनन्यै नमः । ॐ श्रीविद्यायै नमः । ॐ
    श्रीसरोजासनायै नमः । ॐ श्रीसर्वाभीष्टफलप्रदायै नमः । इति रमाहृदय स्तोत्रं सम्पूर्णम् ।
meaning: {}
