    ॐ श्रीं ऐं सौः च सुमुखी ॐ ऐं सौः सत्यवारुणी ॥ ९६॥ ॐ श्रीं साडम्बरा स्वाहा ॐ श्रीं ऐं सौः सदागतिः ।
    ॐ श्रीं सीता हसौः सत्या ॐ ऐं सन्तानशायिनी ॥ ९७॥ ॐ ऐं सौः सर्वदृष्टिश्च ॐ क्रीं कल्पान्तकारिणी । ॐ
    श्रीं चन्द्रकल्लधरा ॐ ऐं श्रीं पशुपालिनी ॥ ९८॥ ॐ श्रींशिशुप्रिया ऐं सौः शिशूत्सङ्गनिवेशिता । ॐ ऐं
    सौः तारिणी स्वाहा ॐ ऐं क्लीं तामसी तथा॥ ९९॥ ॐ म्रीं मोहान्धकारघ्नी ॐ म्रीं मत्तमनास्तथा । ॐ म्रीं
    श्रीं माननीया च ॐ प्रीं पूजाफलदा ॥ १००॥ ॐ श्रीं श्रीं श्रीफला स्वाहा ॐ श्रीं क्लीं सत्यरूपिणी । ॐ
    श्रीं नारायणी स्वाहा ॐ श्रीं नूपुराकिला ॥ १०१॥ ॐ म्रीं श्रीं नारसिंही च ॐ म्रीं नारायाणप्रिया । ॐ
    म्रीं हंसगतिः स्वाहा ॐ श्रीं हंसौ हसौः पयः ।१०२॥ ॐ श्रीं क्रीं करवालेष्टा ॐ क्रीं कोटरवासिनी ॥ ॐ क्रीं
    काञ्चनभूषाढ्या ॐ क्रीं श्रीं कुरीपयः ॥ १०३॥ ॐ क्रीं शशिरूपा च श्रीं सः सूर्यरूपिणी । ॐ श्रीं वामप्रिया
    स्वाहा ॐ वीं वरुणपूजिता ॥ १०४॥ ॐ वीं वटेश्वरी स्वाहा ॐ वीं वामनरूपिणी । ॐ रं व्रीं श्रीं खेचरी स्वाहा
    ॐ रं व्रीं श्रीं साररूपिणी ॥ १०५॥ ॐ रं ब्रीं खड्गधारिणी स्वाहा ॐ रं ब्रीं खप्परधारिणी । ॐ रं ब्रीं
    खर्परयात्रा च ॐ प्रीं प्रेतालया तथा ॥ १०६॥ ॐ श्रीं क्लीं प्रीं च दूतात्मा ॐ प्रीं पुष्पवर्द्धिनी ।
    ॐ श्रीं श्रीं सान्तिदा स्वाहा ॐ प्रीं पातालचारिणी ॥ १०७॥ ॐ म्रीं मूकेश्वरी स्वाहा ॐ श्रीं श्रीं मन्त्रसागरा
    । ॐ श्रीं क्रीं क्रयदा स्वाहा ॐ क्रीं विक्रयकारिणी ॥ १०८॥ ॐ क्रीं क्रयात्मिका स्वाहा ॐ क्रीं श्रीं
    क्लीं कृपावती । ॐ क्रीं श्रीं ब्रां विचित्राङ्गी ॐ श्रींक्लीं वीं विभावरी ॥ १०९॥ ॐ वीं श्रीं विभावसुनेत्रा
    ॐ वीं श्रीं वामकेश्वरी । ॐ श्रीं वसुप्रदा स्वाहा ॐ श्रीं वैश्रवणार्चिता ॥ ११०॥ ॐ भैं श्रीं भाग्यदा
    स्वाहा ॐ भैं भैं भगमालिनी । ॐ भैं श्रीं भगोदरा स्वाहा ॐ भैं क्लीं वैन्दवेश्वरी ॥ १११॥ ॐ भैं श्रीं
    भवमध्यस्था ऐं क्लीं त्रिपुरसुन्दरी । ॐ श्रीं क्रीं भीतिहर्त्री च ॐ भैं भूतभयङ्करी ॥ ११२॥ ॐ भैं भयप्रदा
    भैं श्रीं भगिनी भैं भयापहा । ॐ ह्रीं श्रीं भोगदा स्वाहा श्रीं क्लीं ह्रीं भुवनेश्वरी ॥ ११३॥ इति श्रीदेवदेवेशि
