id: mahadevaramastotra
category: stotram
name:
  english: mahadevaramastotra
  devanagari: महादेवरामस्तोत्र
content:
  english: shriramastotram shrimahadevakritam shri ganeshaya namah | shrimahadeva uvacah | namo'stu ramaya
    sashaktikaya nilotpalashyamalakomalaya | kiritaharangadabhushanaya simhasanasthaya mahaprabhaya ||
    1|| tvamadimadhyantavihina ekah srijasyavasyatsi ca lokajatam | svamayaya tena na lipyase tvam yatsve
    mukhe'jasrarato'navadyah || 2|| lilam vidhatse gunasamvritastvam prapannabhaktanuvidhanahetoh | nanavataraih
    suramanushadyaih pratiyase jnanibhireva nityam || 3|| svamshena lokam sakalam vidhaya tam bibharshi
    ca tvam tadadhah phanishvarah | uparyadho bhanvanilodupaushadhipravarsharupo'vasi naikadha jagat ||
    4|| tvamiha dehabhritam shikhirupah pacasi bhaktamasheshamajasram | pavanamancakarupasahayo jagadakhandamanena
    bibharshi || 5|| candrasuryashikhimadhyagatam yatteja isha cidasheshatanunam | prabhavattanubhritamiha
    dhairyam shauryamatramakhilam tava sattvam || 6|| tvam virincishivavishnuvibhedat kalakarmashashisuryavibhagat
    | vadinam prithagivesha bibhasi brahma nishcitamananyadihaikam || 7|| matsyadirupena yatha tvamekah
    shruto puraneshu ca lokasiddhah | tathaiva sarvam sadayadvibhagastvameva nanyadbhavato vibhati ||
    8|| yadyatsamutpannamanantasrishtavutpatsyate yacca bhavacca yacca | na drishyate sthavarajangamadau
    tvaya vina'tah paratah parastvam || 9|| tattvam na jananti paratmanaste janah samastastava mayaya'tah
    | tvadbhaktasevamalamanasanam vibhati tattvam paramekamaisham || 10|| brahmadayaste na viduh svarupam
    cidatmatatvam bahirarthabhavah | tato budhastvamidameva rupam bhaktya bhajanmuktimupaityaduhkhah ||
    11|| aham bhavannamagunaih kritartho vasami kashyamanisham bhavanya | mumurshamanasya vimuktaye'ham
    dishami mantram tava ramanama || 12|| imam stavam nityamananyabhaktya sha
  devanagari: श्रीरामस्तोत्रं श्रीमहादेवकृतम् श्री गणेशाय नमः । श्रीमहादेव उवाचः । नमोऽस्तु रामाय सशक्तिकाय
    नीलोत्पलश्यामलकोमलाय । किरीटहाराङ्गदभूषणाय सिंहासनस्थाय महाप्रभाय ॥ १॥ त्वमादिमध्यान्तविहीन एकः सृजस्यवस्यत्सि
    च लोकजातम् । स्वमायया तेन न लिप्यसे त्वं यत्स्वे मुखेऽजस्ररतोऽनवद्यः ॥ २॥ लीलां विधत्से गुणसंवृतस्त्वं
    प्रपन्नभक्तानुविधानहेतोः । नानावतारैः सुरमानुषाद्यैः प्रतीयसे ज्ञानिभिरेव नित्यम् ॥ ३॥ स्वांशेन लोकं
    सकलं विधाय तं बिभर्षि च त्वं तदधः फणीश्वरः । उपर्यधो भान्वनिलोडुपौषधीप्रवर्षरूपोऽवसि नैकधा जगत् ॥
    ४॥ त्वमिह देहभृतां शिखिरूपः पचसि भक्तमशेषमजस्रम् । पवनमञ्चकरूपसहायो जगदखण्डमनेन बिभर्षि ॥ ५॥ चन्द्रसूर्यशिखिमध्यगतं
    यत्तेज ईश चिदशेषतनूनाम् । प्राभवत्तनुभृतामिह धैर्यं शौर्यमात्रमखिलं तव सत्त्वम् ॥ ६॥ त्वं विरिञ्चिशिवविष्णुविभेदात्
    कालकर्मशशिसूर्यविभागात् । वादिनां पृथगिवेश बिभासि ब्रह्म निश्चितमनन्यदिहैकम् ॥ ७॥ मत्स्यादिरूपेण यथा
    त्वमेकः श्रुतो पुराणेषु च लोकसिद्धः । तथैव सर्वं सदयद्विभागस्त्वमेव नान्यद्भवतो विभाति ॥ ८॥ यद्यत्समुत्पन्नमनन्तसृष्टावुत्पत्स्यते
    यच्च भवच्च यच्च । न दृश्यते स्थावरजङ्गमादौ त्वया विनाऽतः परतः परस्त्वम् ॥ ९॥ तत्त्वं न जानन्ति परात्मनस्ते
    जनः समस्तास्तव माययाऽतः । त्वद्भक्तसेवामलमानसानां विभाति तत्त्वं परमेकमैशम् ॥ १०॥ ब्रह्मादयस्ते न
    विदुः स्वरूपं चिदात्मतत्वं बहिरर्थभावाः । ततो बुधस्त्वामिदमेव रूपं भक्त्या भजन्मुक्तिमुपैत्यदुःखः
    ॥ ११॥ अहं भवन्नामगुणैः कृतार्थो वसामि काश्यामनिशं भवान्या । मुमूर्षमाणस्य विमुक्तयेऽहं दिशामि मन्त्रं
    तव रामनाम ॥ १२॥ इमं स्तवं नित्यमनन्यभक्त्या श
