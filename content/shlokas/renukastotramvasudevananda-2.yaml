id: renukastotramvasudevananda-2
category: stotram
name:
  english: renukastotramvasudevananda 2
  devanagari: रेणुकास्तोत्रम्वासुदेवानन्द २
content:
  english: renukastotram shrivasudevanandasarasvatikritam shriganeshaya namah | aindryadivanditapate varade'bhishtakamade
    | kamadevarcite'nante renuke'mba namo'stu te || ekavire nijadhare rucire sajjanadare | udare renusanjate
    renuke'mba namo'stu te || karunarasasampurne nayane susmitanane | shobhane pahi no bhite renuke'mba
    namo'stu te || viramatarmahadevi tvadanya ka para bhuvi | tarinidurgato'nante renuke'mba namo'stu
    te || ramamatarmahamaye jamadagnipriya'bhaye | vijaye vedavinute renuke'mba namo'stu te || yairarcite
    tava pade te dhanyah parame pade | nihitaste suranute renuke'mba namo'stu te || na tvadanyagatirdevi
    parama khalu shambhavi | bhuktimuktiprade shante renuke'mba namo'stu te || yah keshaveshvarashcapi
    srishti
  devanagari: रेणुकास्तोत्रं श्रीवासुदेवानन्दसरस्वतीकृतम् श्रीगणेशाय नमः । ऐन्द्र्यादिवन्दितपते वरदेऽभीष्टकामदे
    । कामदेवर्चितेऽनन्ते रेणुकेऽम्ब नमोऽस्तु ते ॥ एकवीरे निजाधारे रुचिरे सज्जनादरे । उदरे रेणुसञ्जाते
    रेणुकेऽम्ब नमोऽस्तु ते ॥ करुणारससम्पूर्णे नयने सुस्मितानने । शोभने पाहि नो भीते रेणुकेऽम्ब नमोऽस्तु
    ते ॥ वीरमातर्महादेवी त्वदन्या का परा भुवि । तारिणीदुर्गतोऽनन्ते रेणुकेऽम्ब नमोऽस्तु ते ॥ राममातर्महामाये
    जमदग्निप्रियाऽभये । विजये वेदविनुते रेणुकेऽम्ब नमोऽस्तु ते ॥ यैरर्चिते तव पदे ते धन्याः परमे पदे ।
    निहितास्ते सुरनुते रेणुकेऽम्ब नमोऽस्तु ते ॥ न त्वदन्यागतिर्देवि परमा खलु शाम्भवि । भुक्तिमुक्तिप्रदे
    शान्ते रेणुकेऽम्ब नमोऽस्तु ते ॥ यः केशवेश्वरश्चापि सृष्टि
