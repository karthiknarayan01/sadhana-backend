    । श्वे॒तायै॑ च कृ॒ष्णायै॑ च । ततो॒ वै ते अत्य॑होरा॒त्रे अ॑मुच्येते । नैने॑ अहोरा॒त्रे आ प्नुताम् ।
    अति॑ ह॒ वा अ॑होरा॒त्रे मु॑च्यते । नैन॑महोरा॒त्रे आ प्नुतः । य ए॒तेन॑ ह॒विषा॒ यज॑ते । य उ॑ चैनदे॒वं
    ऽत्र॑ जुहोति । अह्ने॒ स्वाहा॒ रात्रि॑यै॒ स्वाहा । अति॑मुक्त्यै॒ स्वाहेति॑ ॥ ॥ उ॒षा वा अ॑कामयत । प्रि॒या
    ऽऽदि॒त्यस्य॑ सु॒भगा स्या॒मिति॑ । सैतमु॒षसे॑ च॒रु न्निर॑वपत् । ततो॒ वै सा प्रि॒या ऽऽदि॒त्यस्य॑ सु॒भगा॑
    ऽभवत् । प्रि॒यो ह॒ वै स॑मा॒नानाग्ं॑ सु॒भगो॑ भवति । य ए॒तेन॑ ह॒विषा॒ यज॑ते । य उ॑ चैनदे॒वं ऽत्र॑ जुहोति
    । उ॒षसे॒ स्वाहा॒ व्यु॑ष्ट्यै॒ स्वाहा । व्यू॒षुष्यै॒ स्वाहा व्यु॒च्छन्त्यै॒ स्वाहा । व्यु॑ष्टायै॒ स्वाहेति॑
    ॥ ॥ अथै॒तस्मै॒ नक्ष॑त्राय च॒रु न्निर्व॑पति । यथा॒ त्व न्दे॒वाना॒मसि॑ । ए॒वम॒ह म्भूयास॒मिति॑ । यथा॑
    ह॒ वा ए॒त म् । ए॒वग्ं ह॒ वा ए॒ष म॑नु॒ष्या॑णा म्भवति । य ए॒तेन॑ ह॒विषा॒ यज॑ते । य उ॑ चैनदे॒वं ऽत्र॑
    जुहोति । नक्ष॑त्राय॒ स्वाहो॑देष्य॒ते स्वाहा । उ॒द्य॒ते स्वाहोदि॑ताय॒ स्वाहा । हर॑से॒ स्वाहा॒ भर॑से॒
