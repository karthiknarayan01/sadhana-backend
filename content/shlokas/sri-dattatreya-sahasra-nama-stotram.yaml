id: sri-dattatreya-sahasra-nama-stotram
category: stotram
name:
  english: Sri Dattatreya Sahasra Nama Stotram
content:
  english: munayah ucuh nikhilagamatattvajna brahmadhyanaparayana | vadasmakam muktyupayam suta sarvopakarakam
    || || sarvadeveshu ko devah sadyo mokshaprado bhavet | ko manurva bhavettasya sadyah pritikaro dhruvam
    || || suta uvaca | nigamagamatattvajno hyavadhutashcidambarah | bhaktavatsalyapravano datta eva hi
    kevalah || || sada prasannavadano bhaktacintaikatatparah | tasya namanyanantani vartante'thapyadah
    param || || dattasya namasahasram tasya pritivivardhanam | yastvidam pathate nityam dattatreyaikamanasah
    || || mucyate sarvapapebhyah sa sadyo natra samshayah | ante taddhama samyati punaravrittidurlabham
    || || asya shrimaddattatreyasahasranamastotramantrasya avadhuta rishih shridattatreyaprityarthe jape
    viniyogah | atha dhyanam digambaram bhasmavilepitangam bodhatmakam muktikaram prasannam | nirmanasam
    shyamatanum bhaje'ham dattatreyam brahmasamadhiyuktam || atha stotram dattatreyo mahayogi yogeshashcamaraprabhuh
    | munirdigambaro balo mayamukto madapahah || || avadhuto mahanathah shankaro'maravallabhah | mahadevashcadidevah
    puranaprabhurishvarah || || sattvakritsattvabhridbhavah sattvatma sattvasagarah | sattvavitsattvasakshi
    ca sattvasadhyo'maradhipah || || bhutakridbhutabhriccaiva bhutatma bhutasambhavah | bhutabhavo bhavo
    bhutavittatha bhutakaranah || || bhutasakshi prabhutishca bhutanam parama gatih | bhutasangavihinatma
    bhutatma bhutashankarah || || bhutanatho mahanatha adinatho maheshvarah | sarvabhutanivasatma bhutasantapanashanah
    || || sarvatma sarvabhritsarvah sarvajnah sarvanirnayah | sarvasakshi brihadbhanuh sarvavit sarvamangalah
    || || shantah satyah samah purno ekaki kamalapatih | ramo ramapriyashcaiva viramo ramakaranah || ||
    shuddhatma pavano'nantah pratitah paramarthabhrit | hamsasakshi vibhushcaiva prabhuh pralaya ityapi
    || || siddhatma paramatma ca siddhanam parama gatih | siddhisiddhastatha sadhyah sadhano hyuttamastatha
    || || sulakshanah sumedhavi vidyavanvigatantarah | vijvarashca mahabahurbahulanandavardhanah || ||
    avyaktapurushah prajnah parajnah paramarthadrik | paraparavinirmukto yuktastattvaprakashavan || ||
    dayavan bhagavan bhavi bhavatma bhavakaranah | bhavasantapanashashca pushpavan pandito budhah || ||
    pratyakshavasturvishvatma pratyagbrahma sanatanah | pramanavigatashcaiva pratyaharaniyojakah || ||
    pranavah pranavatitah pramukhah pralayatmakah | mrityunjayo viviktatma shankaratma paro vapuh || ||
    paramastanuvijneyah paramatmani samsthitah | prabodhakalanadharah prabhavapravarottamah || || cidambarashcidvilasashcidakashashciduttamah
    | cittacaitanyacittatma devanam parama gatih || || acetyashcetanadharashcetanacittavikramah | cittatma
    cetanarupo lasatpankajalocanah || || param brahma param jyotih param dhama parantapah | param sutram
    param tantram pavitrah paramohavan || || kshetrajnah kshetragah kshetrah kshetradharah puranjanah
    | kshetrashunyo lokasakshi kshetravan bahunayakah || || yogendro yogapujyashca yogya atmavidam shucih
    | yogamayadharah sthanuracalah kamalapatih || || yogesho yoganirmata yogajnanaprakashanah | yogapalo
    lokapalah samsaratamanashanah || || guhyo guhyatamo gupto mukto yuktah sanatanah | gahano gaganakaro
    gambhiro gananayakah || || govindo gopatirgopta gobhago bhavasamsthitah | gosakshi gotamarishca gandharo
    gaganakritih || || yogayukto bhogayuktah shankamuktasamadhiman | sahajah sakaleshanah kartaviryavarapradah
    || || sarajo virajo pumso pavanah papanashanah | paravaravinirmuktah param || nanajyotiranekatma svayam
    jyotih sadashivah | divyajyotirmayashcaiva satyavijnanabhaskarah || || nityashuddhah parah purnah
    prakashah prakatodbhavah | pramadavigatashcaiva pareshah paravikramah || || yogi yogo yogapashca yogabhyasaprakashanah
    | yokta mokta vidhata ca trata pata nirayudhah || || nityamukto nityayuktah satyah satyaparakramah
    | sattvashuddhikarah sattvastatha sattvabhritam gatih || || shridharah shrivapuh shriman shrinivaso'mararcitah
    | shrinidhih shripatih shreshthah shreyaskashcaramashrayah || || tyagi tyagarthasampannastyagatma
    tyagavigrahah | tyagalakshanasiddhatma tyagajnastyagakaranah || || bhogo bhokta tatha bhogyo bhogasadhanakaranah
    | bhogi bhogarthasampanno bhogajnanaprakashanah || || kevalah keshavah krishnah kamvasah kamalalayah
    | kamalasanapujyashca harirajnanakhandanah || || mahatma mahadadishca maheshottamavanditah | manobuddhivihinatma
    manatma manavadhipah || || bhuvanesho vibhutishca dhritirmedha smritirdaya | duhkhadavanalo buddhah
    prabuddhah parameshvarah || || kamaha krodhaha caiva dambhadarpamadapahah | ajnanatimirarishca bhavarirbhuvaneshvarah
    || || rupakridrupabhridrupi rupatma rupakaranah | rupajno rupasakshi ca namarupo gunantakah || ||
    aprameyah prameyashca pramanam pranavashrayah | pramanarahito'cintyashcetanavigato'jarah || || aksharo'ksharamuktashca
    vijvaro jvaranashanah | vishishto vittashastri ca drishto drishtantavarjitah || || gunesho gunakayashca
    gunatma gunabhavanah | anantagunasampanno gunagarbho gunadhipah || || ganesho gunanathashca gunatma
    ganabhavanah | ganabandhurvivekatma gunayuktah parakrami || || atarkyah kraturagnishca kritajnah saphalashrayah
    | yajnashca yajnaphalado yajna ijyo'marottamah || || hiranyagarbhah shrigarbhah khagarbhah kunapeshvarah
    | mayagarbho lokagarbhah svayambhurbhuvanantakah || || nishpapo nibido nandi bodhi bodhasamashrayah
    | bodhatma bodhanatma ca bhedavaitandakhandanah || || svabhavyo bhavanirmukto vyakto'vyaktasamashrayah
    | nityatripto nirabhaso nirvanah sharanah suhrit || || guhyesho gunagambhiro gunadoshanivaranah |
    gunasangavihinashca yogarerdarpanashanah || || anandah paramanandah svanandasukhavardhanah | satyanandashcidanandah
    sarvanandaparayanah || || sadrupah sahajah satyah svanandah sumanoharah | sarvah sarvantarashcaiva
    purvatpurvatarastatha || || khamayah khaparah khadih kham brahma khatanuh khagah | khavasah khavihinashca
    khanidhih khaparashrayah || || anantashcadirupashca suryamandalamadhyagah | amoghah paramamoghah parokshah
    paradah kavih || || vishvacakshurvishvasakshi vishvabahurdhaneshvarah | dhananjayo mahatejastejishthastaijasah
    sukhi || || jyotirjyotirmayo jeta jyotisham jyotiratmakah | jyotishamapi jyotishca janako janamohanah
    || || jitendriyo jitakrodho jitatma jitamanasah | jitasango jitaprano jitasamsaravasanah || || nirvasano
    niralambo niryogakshemavarjitah | niriho nirahankaro nirashirnirupadhikah || || nityabodho viviktatma
    vishuddhottamagauravah | vidyarthi paramarthi ca shraddharthi sadhanatmakah || || pratyahari nirahari
    sarvaharaparayanah | nityashuddho nirakankshi parayanaparayanah || || anoranutarah sukshmah sthulah
    sthulatarastatha | ekastatha'nekarupo vishvarupah sanatanah || || naikarupo virupatma naikabodhamayastatha
    | naikanamamayashcaiva naikavidyavivardhanah || || ekashcaikantikashcaiva nanabhavavivarjitah | ekaksharastatha
    bijah purnabimbah sanatanah || || mantraviryo mantrabijah shastraviryo jagatpatih | nanaviryadharashcaiva
    shakreshah prithivipatih || || praneshah pranadah pranah pranayamaparayanah | pranapancakanirmuktah
    koshapancakavarjitah || || nishcalo nishkalo'sango nishprapanco niramayah | niradharo nirakaro nirvikaro
    niranjanah || || nishpratito nirabhaso nirasakto nirakulah | nishthasarvagatashcaiva nirarambho nirashrayah
    || || nirantarah sarvagopta shanto danto mahamunih | nihshabdah sukritah svasthah satyavadi sureshvarah
    || || jnanado jnanavijnani jnanatma''nandapuritah | jnanayajnavidam daksho jnanagnirjvalano budhah
    || || dayavan bhavarogarishcikitsacaramagatih | candramandalamadhyasthashcandrakotisushitalah || ||
    yantrakritparamo yantri yantrarudhaparajitah | yantravidyantravasashca yantradharo dharadharah ||
    || tattvajnastattvabhutatma mahattattvaprakashanah | tattvasankhyanayogajnah sankhyashastrapravartakah
    || || anantavikramo devo madhavashca dhaneshvarah | sadhuh sadhuvarishthatma savadhano'marottamah
    || || nihsankalpo niradharo durdharo hyatmavitpatih | arogyasukhadashcaiva pravaro vasavastatha ||
    || pareshah paramodarah pratyakcaitanyadurgamah | duradharsho duravaso duratvaparinashanah || || vedavidvedakridvedo
    vedatma vimalashayah | viviktasevi ca samsarashramanashanastatha || || brahmayonirbrihadyonirvishvayonirvidehavan
    | vishalaksho vishvanatho hatakangadabhushanah || || abadhyo jagadaradhyo jagadarjavapalanah | janavan
    dhanavan dharmi dharmago dharmavardhanah || || amritah shashvatah sadhyah siddhidah sumanoharah |
    khalubrahmakhalusthano muninam parama gatih || || upadrashta tatha shreshthah shucibhuto hyanamayah
    | vedasiddhantavedyashca manasahladavardhanah || || dehadanyo gunadanyo lokadanyo vivekavit | dushtasvapnaharashcaiva
    gururguruvarottamah || || karmi karmavinirmuktah sannyasi sadhakeshvarah | sarvabhavavihinashca trishnasanganivarakah
    || || tyagi tyagavapustyagastyagadanavivarjitah | tyagakaranatyagatma sadguruh sukhadayakah || ||
    daksho dakshadivandyashca jnanavadapravartakah | shabdabrahmamayatma ca shabdabrahmaprakashavan ||
    || grasishnuh prabhavishnushca sahishnurvigatantarah | vidvattamo mahavandyo vishalottamavanmunih
    || || brahmavidbrahmabhavashca brahmarshirbrahmanapriyah | brahma brahmaprakashatma brahmavidyaprakashanah
    || || atrivamshaprabhutatma tapasottamavanditah | atmavasi vidheyatma hyatrivamshavivardhanah || ||
    pravartano nivrittatma pralayodakasannibhah | narayano mahagarbho bhargavapriyakrittamah || || sankalpaduhkhadalanah
    samsaratamanashanah | trivikramastridhakarastrimurtistrigunatmakah || || bhedatrayaharashcaiva tapatrayanivarakah
    | doshatrayavibhedi ca samshayarnavakhandanah || || asamshayastvasammudho hyavadi rajavanditah | rajayogi
    mahayogi svabhavagalitastatha || || punyashlokah pavitranghrirdhyanayogaparayanah | dhyanastho dhyanagamyashca
    vidheyatma puratanah || || avijneyo hyantaratma mukhyabimbasanatanah | jivasanjivano jivashcidvilasashcidashrayah
    || || mahendro'maramanyashca yogendro yogavittamah | yogadharmastatha yogastattvastattvavinishcayah
    || || naikabahuranantatma naikanamaparakramah | naikakshi naikapadashca nathanathottamottamah || ||
    sahasrashirsha purushah sahasrakshah sahasrapat | sahasrarupadrik caiva sahasraramayoddhavah || ||
    tripadapurushashcaiva tripadurdhvastathaiva ca | tryambakashca mahaviryo yogaviryavisharadah || ||
    vijayi vinayi jeta vitaragi virajitah | rudro raudro mahabhimah prajnamukhyah sadashucih || || antarjyotiranantatma
    pratyagatma nirantarah | arupashcatmarupashca sarvabhavavinirvritah || || antahshunyo bahihshunyah
    shunyatma shunyabhavanah | antahpurno bahihpurnah purnatma purnabhavanah || || antastyagi bahistyagi
    tyagatma sarvayogavan | antaryogi bahiryogi sarvayogaparayanah || || antarbhogi bahirbhogi sarvabhogaviduttamah
    | antarnishtho bahirnishthah sarvanishthamayastatha || || bahyantaravimuktashca bahyantaravivarjitah
    | shantah shuddho vishuddhashca nirvanah prakriteh parah || || akalah kalanemi ca kalakalo janeshvarah
    | kalatma kalakarta ca kalajnah kalanashanah || || kaivalyapadadata ca kaivalyasukhadayakah | kaivalyakalanadharo
    nirbharo harshavardhanah || || hridayastho hrishikesho govindo garbhavarjitah | sakalagamapujyashca
    nigamo nigamashrayah || || parashaktih parakirtih paravrittirnidhismritih | paravidya parakshantirvibhaktiryuktasadgatih
    || || svaprakashah prakashatma parasamvedanatmakah | svasevyah svavidam svatma svasamvedyo'naghah
    kshami || || svanusandhanashilatma svanusandhanagocarah | svanusandhanashunyatma svanusandhanakashrayah
    || || svabodhadarpano'bhangah kandarpakulanashanah | brahmacari brahmavetta brahmano brahmavittamah
    || || tattvabodhah sudhavarshah pavanah papapavakah | brahmasutravidheyatma brahmasutrarthanirnayah
    || || atyantiko mahakalpah sankalpavartanashanah | adhivyadhiharashcaiva samshayarnavashoshakah ||
    || tattvatmajnanasandesho mahanubhavabhavitah | atmanubhavasampannah svanubhavasukhashrayah || ||
    acintyashca brihadbhanuh pramadotkarshanashanah | aniketa prashantatma shunyavaso jagadvapuh || ||
    cidgatishcinmayashcakri mayacakrapravartakah | sarvavarnavidarambhi sarvarambhaparayanah || || puranah
    pravaro data sundarah kanakangadi | anasuyatmajo dattah sarvajnah sarvakamadah || || kamajit kamapalashca
    kami kamapradagamah | kamavan kamaposhashca sarvakamanivartakah || || sarvakarmaphalotpattih sarvakamaphalapradah
    | sarvakarmaphalaih pujyah sarvakarmaphalashrayah || || vishvakarma kritatma ca kritajnah sarvasakshikah
    | sarvarambhaparityagi jadonmattapishacavan || || bhikshurbhaikshakarashcaiva bhaikshahari nirashrami
    | akulashcanukulashca vikalo hyakalastatha || || jatilo vanacari ca dandi mundi ca gandavan | dehadharmavihinatma
    hyekaki sangavarjitah || || ashramyanashramarambho'nacari karmavarjitah | asandehi ca sandehi na kincinna
    ca kincanah || || nridehi dehashunyashca nabhavi bhavanirgatah | nabrahma ca parabrahma svayameva
    nirakulah || || anaghashcagurushcaiva nathanathottamo guruh | dvibhujah prakritashcaiva janakashca
    pitamahah || || anatma na ca nanatma nitirnitimatam varah | sahajah sadrishah siddhashcaikashcinmatra
    eva ca || || na kartapi ca karta ca bhokta bhogavivarjitah | turiyasturiyatitah svacchah sarvamayastatha
    || || sarvadhishthanarupashca sarvadhyeyavivarjitah | sarvalokanivasatma sakalottamavanditah || ||
    dehabhriddehakriccaiva dehatma dehabhavanah | dehi dehavibhaktashca dehabhavaprakashanah || || layastho
    layaviccaiva layabhavashca bodhavan | layatito layasyanto layabhavanivaranah || || vimukhah pramukhashcaiva
    pratyanmukhavadacari | vishvabhugvishvadhrigvishvo vishvakshemakarastatha || || avikshipto'pramadi
    ca parardhih paramarthadrik | svanubhavavihinashca svanubhavaprakashanah || || nirindriyashca nirbuddhirnirabhaso
    nirakritah | nirahankararupatma nirvapuh sakalashrayah || || shokaduhkhaharashcaiva bhogamokshaphalapradah
    | suprasannastatha sukshmah shabdabrahmarthasangrahah || || agamapayashunyashca sthanadashca satangatih
    | akritah sukritashcaiva kritakarma vinirvritah || || bhedatrayaharashcaiva dehatrayavinirgatah |
    sarvakamamayashcaiva sarvakamanivartakah || || siddheshvaro'jarah pancabanadarpahutashanah | caturaksharabijatma
    svabhushcitkirtibhushanah || || agadhabuddhirakshubdhashcandrasuryagnilocanah | yamadamshtro'tisamharta
    paramanandasagarah || || lilavishvambharo bhanurbhairavo bhimalocanah | brahmacarmambarah kalastvacalashcalanantakah
    || || adidevo jagadyonirvasavarivimardanah | vikarmakarmakarmajno ananyagamako'gamah || || abaddhakarmashunyashca
    kamaragakulakshayah | yogandhakaramathanah padmajanmadivanditah || || bhaktakamo'grajashcakri bhavanirbhavabhavakah
    | bhedantako mahanagryo niguho gocarantakah || || kalagnishamanah shankhacakrapadmagadadharah | dipto
    dinapatih shasta svacchando muktidayakah || || vyomadharmambaro bhetta bhasmadhari dharadharah | dharmagupto'nvayatma
    ca vyatirekarthanirnayah || || ekanekagunabhasabhasanirbhasavarjitah | bhavabhavasvabhavatma bhavabhavavibhavavit
    || || yogihridayavishramo'nantavidyavivardhanah | vighnantakastrikalajnastattvatma jnanasagarah ||
    || itidam dattasahasram sayam pratah pathettu yah | sa ihamutra labhate nirvanam paramam sukham ||
    || guruvare dattabhakto bhaktibhavasamanvitah | pathet sadaiva yo hyetat sa labheccintitam dhruvam
    || || iti shrimaddattatreyapurane shri dattatreya sahasranama stotram |
  devanagari: मुनयः ऊचुः निखिलागमतत्त्वज्ञ ब्रह्मध्यानपरायण । वदास्माकं मुक्त्युपायं सूत सर्वोपकारकम्
    ॥ ॥ सर्वदेवेषु को देवः सद्यो मोक्षप्रदो भवेत् । को मनुर्वा भवेत्तस्य सद्यः प्रीतिकरो ध्रुवम् ॥ ॥ सूत
    उवाच । निगमागमतत्त्वज्ञो ह्यवधूतश्चिदम्बरः । भक्तवात्सल्यप्रवणो दत्त एव हि केवलः ॥ ॥ सदा प्रसन्नवदनो
    भक्तचिन्तैकतत्परः । तस्य नामान्यनन्तानि वर्तन्तेऽथाप्यदः परम् ॥ ॥ दत्तस्य नामसाहस्रं तस्य प्रीतिविवर्धनम्
    । यस्त्विदं पठते नित्यं दत्तात्रेयैकमानसः ॥ ॥ मुच्यते सर्वपापेभ्यः स सद्यो नात्र संशयः । अन्ते तद्धाम
    संयाति पुनरावृत्तिदुर्लभम् ॥ ॥ अस्य श्रीमद्दत्तात्रेयसहस्रनामस्तोत्रमन्त्रस्य अवधूत ऋषिः श्रीदत्तात्रेयप्रीत्यर्थे
    जपे विनियोगः । अथ ध्यानम् दिगम्बरं भस्मविलेपिताङ्गं बोधात्मकं मुक्तिकरं प्रसन्नम् । निर्मानसं श्यामतनुं
    भजेऽहं दत्तात्रेयं ब्रह्मसमाधियुक्तम् ॥ अथ स्तोत्रम् दत्तात्रेयो महायोगी योगेशश्चामरप्रभुः । मुनिर्दिगम्बरो
    बालो मायामुक्तो मदापहः ॥ ॥ अवधूतो महानाथः शङ्करोऽमरवल्लभः । महादेवश्चादिदेवः पुराणप्रभुरीश्वरः ॥ ॥
    सत्त्वकृत्सत्त्वभृद्भावः सत्त्वात्मा सत्त्वसागरः । सत्त्ववित्सत्त्वसाक्षी च सत्त्वसाध्योऽमराधिपः ॥
    ॥ भूतकृद्भूतभृच्चैव भूतात्मा भूतसम्भवः । भूतभावो भवो भूतवित्तथा भूतकारणः ॥ ॥ भूतसाक्षी प्रभूतिश्च
    भूतानां परमा गतिः । भूतसङ्गविहीनात्मा भूतात्मा भूतशङ्करः ॥ ॥ भूतनाथो महानाथ आदिनाथो महेश्वरः । सर्वभूतनिवासात्मा
    भूतसन्तापनाशनः ॥ ॥ सर्वात्मा सर्वभृत्सर्वः सर्वज्ञः सर्वनिर्णयः । सर्वसाक्षी बृहद्भानुः सर्ववित् सर्वमङ्गलः
    ॥ ॥ शान्तः सत्यः समः पूर्णो एकाकी कमलापतिः । रामो रामप्रियश्चैव विरामो रामकारणः ॥ ॥ शुद्धात्मा पावनोऽनन्तः
    प्रतीतः परमार्थभृत् । हंससाक्षी विभुश्चैव प्रभुः प्रलय इत्यपि ॥ ॥ सिद्धात्मा परमात्मा च सिद्धानां
    परमा गतिः । सिद्धिसिद्धस्तथा साध्यः साधनो ह्युत्तमस्तथा ॥ ॥ सुलक्षणः सुमेधावी विद्यावान्विगतान्तरः
    । विज्वरश्च महाबाहुर्बहुलानन्दवर्धनः ॥ ॥ अव्यक्तपुरुषः प्राज्ञः परज्ञः परमार्थदृक् । परापरविनिर्मुक्तो
    युक्तस्तत्त्वप्रकाशवान् ॥ ॥ दयावान् भगवान् भावी भावात्मा भावकारणः । भवसन्तापनाशश्च पुष्पवान् पण्डितो
    बुधः ॥ ॥ प्रत्यक्षवस्तुर्विश्वात्मा प्रत्यग्ब्रह्म सनातनः । प्रमाणविगतश्चैव प्रत्याहारनियोजकः ॥ ॥
    प्रणवः प्रणवातीतः प्रमुखः प्रलयात्मकः । मृत्युञ्जयो विविक्तात्मा शङ्करात्मा परो वपुः ॥ ॥ परमस्तनुविज्ञेयः
    परमात्मनि संस्थितः । प्रबोधकलनाधारः प्रभावप्रवरोत्तमः ॥ ॥ चिदम्बरश्चिद्विलासश्चिदाकाशश्चिदुत्तमः ।
    चित्तचैतन्यचित्तात्मा देवानां परमा गतिः ॥ ॥ अचेत्यश्चेतनाधारश्चेतनाचित्तविक्रमः । चित्तात्मा चेतनारूपो
    लसत्पङ्कजलोचनः ॥ ॥ परं ब्रह्म परं ज्योतिः परं धाम परन्तपः । परं सूत्रं परं तन्त्रं पवित्रः परमोहवान्
    ॥ ॥ क्षेत्रज्ञः क्षेत्रगः क्षेत्रः क्षेत्राधारः पुरञ्जनः । क्षेत्रशून्यो लोकसाक्षी क्षेत्रवान् बहुनायकः
    ॥ ॥ योगेन्द्रो योगपूज्यश्च योग्य आत्मविदां शुचिः । योगमायाधरः स्थाणुरचलः कमलापतिः ॥ ॥ योगेशो योगनिर्माता
    योगज्ञानप्रकाशनः । योगपालो लोकपालः संसारतमनाशनः ॥ ॥ गुह्यो गुह्यतमो गुप्तो मुक्तो युक्तः सनातनः ।
    गहनो गगनाकारो गम्भीरो गणनायकः ॥ ॥ गोविन्दो गोपतिर्गोप्ता गोभागो भावसंस्थितः । गोसाक्षी गोतमारिश्च
    गान्धारो गगनाकृतिः ॥ ॥ योगयुक्तो भोगयुक्तः शङ्कामुक्तसमाधिमान् । सहजः सकलेशानः कार्तवीर्यवरप्रदः ॥
    ॥ सरजो विरजो पुंसो पावनः पापनाशनः । परावरविनिर्मुक्तः परं ॥ नानाज्योतिरनेकात्मा स्वयं ज्योतिः सदाशिवः
    । दिव्यज्योतिर्मयश्चैव सत्यविज्ञानभास्करः ॥ ॥ नित्यशुद्धः परः पूर्णः प्रकाशः प्रकटोद्भवः । प्रमादविगतश्चैव
    परेशः परविक्रमः ॥ ॥ योगी योगो योगपश्च योगाभ्यासप्रकाशनः । योक्ता मोक्ता विधाता च त्राता पाता निरायुधः
    ॥ ॥ नित्यमुक्तो नित्ययुक्तः सत्यः सत्यपराक्रमः । सत्त्वशुद्धिकरः सत्त्वस्तथा सत्त्वभृतां गतिः ॥ ॥
    श्रीधरः श्रीवपुः श्रीमान् श्रीनिवासोऽमरार्चितः । श्रीनिधिः श्रीपतिः श्रेष्ठः श्रेयस्कश्चरमाश्रयः ॥
    ॥ त्यागी त्यागार्थसम्पन्नस्त्यागात्मा त्यागविग्रहः । त्यागलक्षणसिद्धात्मा त्यागज्ञस्त्यागकारणः ॥ ॥
    भोगो भोक्ता तथा भोग्यो भोगसाधनकारणः । भोगी भोगार्थसम्पन्नो भोगज्ञानप्रकाशनः ॥ ॥ केवलः केशवः कृष्णः
    कंवासाः कमलालयः । कमलासनपूज्यश्च हरिरज्ञानखण्डनः ॥ ॥ महात्मा महदादिश्च महेशोत्तमवन्दितः । मनोबुद्धिविहीनात्मा
    मानात्मा मानवाधिपः ॥ ॥ भुवनेशो विभूतिश्च धृतिर्मेधा स्मृतिर्दया । दुःखदावानलो बुद्धः प्रबुद्धः परमेश्वरः
    ॥ ॥ कामहा क्रोधहा चैव दम्भदर्पमदापहः । अज्ञानतिमिरारिश्च भवारिर्भुवनेश्वरः ॥ ॥ रूपकृद्रूपभृद्रूपी
    रूपात्मा रूपकारणः । रूपज्ञो रूपसाक्षी च नामरूपो गुणान्तकः ॥ ॥ अप्रमेयः प्रमेयश्च प्रमाणं प्रणवाश्रयः
    । प्रमाणरहितोऽचिन्त्यश्चेतनाविगतोऽजरः ॥ ॥ अक्षरोऽक्षरमुक्तश्च विज्वरो ज्वरनाशनः । विशिष्टो वित्तशास्त्री
    च दृष्टो दृष्टान्तवर्जितः ॥ ॥ गुणेशो गुणकायश्च गुणात्मा गुणभावनः । अनन्तगुणसम्पन्नो गुणगर्भो गुणाधिपः
    ॥ ॥ गणेशो गुणनाथश्च गुणात्मा गणभावनः । गणबन्धुर्विवेकात्मा गुणयुक्तः पराक्रमी ॥ ॥ अतर्क्यः क्रतुरग्निश्च
    कृतज्ञः सफलाश्रयः । यज्ञश्च यज्ञफलदो यज्ञ इज्योऽमरोत्तमः ॥ ॥ हिरण्यगर्भः श्रीगर्भः खगर्भः कुणपेश्वरः
    । मायागर्भो लोकगर्भः स्वयम्भूर्भुवनान्तकः ॥ ॥ निष्पापो निबिडो नन्दी बोधी बोधसमाश्रयः । बोधात्मा बोधनात्मा
    च भेदवैतण्डखण्डनः ॥ ॥ स्वाभाव्यो भावनिर्मुक्तो व्यक्तोऽव्यक्तसमाश्रयः । नित्यतृप्तो निराभासो निर्वाणः
    शरणः सुहृत् ॥ ॥ गुह्येशो गुणगम्भीरो गुणदोषनिवारणः । गुणसङ्गविहीनश्च योगारेर्दर्पनाशनः ॥ ॥ आनन्दः परमानन्दः
    स्वानन्दसुखवर्धनः । सत्यानन्दश्चिदानन्दः सर्वानन्दपरायणः ॥ ॥ सद्रूपः सहजः सत्यः स्वानन्दः सुमनोहरः
    । सर्वः सर्वान्तरश्चैव पूर्वात्पूर्वतरस्तथा ॥ ॥ खमयः खपरः खादिः खं ब्रह्म खतनुः खगः । खवासाः खविहीनश्च
    खनिधिः खपराश्रयः ॥ ॥ अनन्तश्चादिरूपश्च सूर्यमण्डलमध्यगः । अमोघः परमामोघः परोक्षः परदः कविः ॥ ॥ विश्वचक्षुर्विश्वसाक्षी
    विश्वबाहुर्धनेश्वरः । धनञ्जयो महातेजास्तेजिष्ठस्तैजसः सुखी ॥ ॥ ज्योतिर्ज्योतिर्मयो जेता ज्योतिषां
    ज्योतिरात्मकः । ज्योतिषामपि ज्योतिश्च जनको जनमोहनः ॥ ॥ जितेन्द्रियो जितक्रोधो जितात्मा जितमानसः ।
    जितसङ्गो जितप्राणो जितसंसारवासनः ॥ ॥ निर्वासनो निरालम्बो निर्योगक्षेमवर्जितः । निरीहो निरहङ्कारो निराशीर्निरुपाधिकः
    ॥ ॥ नित्यबोधो विविक्तात्मा विशुद्धोत्तमगौरवः । विद्यार्थी परमार्थी च श्रद्धार्थी साधनात्मकः ॥ ॥ प्रत्याहारी
    निराहारी सर्वाहारपरायणः । नित्यशुद्धो निराकाङ्क्षी पारायणपरायणः ॥ ॥ अणोरणुतरः सूक्ष्मः स्थूलः स्थूलतरस्तथा
    । एकस्तथाऽनेकरूपो विश्वरूपः सनातनः ॥ ॥ नैकरूपो विरूपात्मा नैकबोधमयस्तथा । नैकनाममयश्चैव नैकविद्याविवर्धनः
    ॥ ॥ एकश्चैकान्तिकश्चैव नानाभावविवर्जितः । एकाक्षरस्तथा बीजः पूर्णबिम्बः सनातनः ॥ ॥ मन्त्रवीर्यो मन्त्रबीजः
    शास्त्रवीर्यो जगत्पतिः । नानावीर्यधरश्चैव शक्रेशः पृथिवीपतिः ॥ ॥ प्राणेशः प्राणदः प्राणः प्राणायामपरायणः
    । प्राणपञ्चकनिर्मुक्तः कोशपञ्चकवर्जितः ॥ ॥ निश्चलो निष्कलोऽसङ्गो निष्प्रपञ्चो निरामयः । निराधारो निराकारो
    निर्विकारो निरञ्जनः ॥ ॥ निष्प्रतीतो निराभासो निरासक्तो निराकुलः । निष्ठासर्वगतश्चैव निरारम्भो निराश्रयः
    ॥ ॥ निरन्तरः सर्वगोप्ता शान्तो दान्तो महामुनिः । निःशब्दः सुकृतः स्वस्थः सत्यवादी सुरेश्वरः ॥ ॥ ज्ञानदो
    ज्ञानविज्ञानी ज्ञानात्माऽऽनन्दपूरितः । ज्ञानयज्ञविदां दक्षो ज्ञानाग्निर्ज्वलनो बुधः ॥ ॥ दयावान् भवरोगारिश्चिकित्साचरमागतिः
    । चन्द्रमण्डलमध्यस्थश्चन्द्रकोटिसुशीतलः ॥ ॥ यन्त्रकृत्परमो यन्त्री यन्त्रारूढापराजितः । यन्त्रविद्यन्त्रवासश्च
    यन्त्राधारो धराधरः ॥ ॥ तत्त्वज्ञस्तत्त्वभूतात्मा महत्तत्त्वप्रकाशनः । तत्त्वसङ्ख्यानयोगज्ञः साङ्ख्यशास्त्रप्रवर्तकः
    ॥ ॥ अनन्तविक्रमो देवो माधवश्च धनेश्वरः । साधुः साधुवरिष्ठात्मा सावधानोऽमरोत्तमः ॥ ॥ निःसङ्कल्पो निराधारो
    दुर्धरो ह्यात्मवित्पतिः । आरोग्यसुखदश्चैव प्रवरो वासवस्तथा ॥ ॥ परेशः परमोदारः प्रत्यक्चैतन्यदुर्गमः
    । दुराधर्षो दुरावासो दूरत्वपरिनाशनः ॥ ॥ वेदविद्वेदकृद्वेदो वेदात्मा विमलाशयः । विविक्तसेवी च संसारश्रमनाशनस्तथा
    ॥ ॥ ब्रह्मयोनिर्बृहद्योनिर्विश्वयोनिर्विदेहवान् । विशालाक्षो विश्वनाथो हाटकाङ्गदभूषणः ॥ ॥ अबाध्यो
    जगदाराध्यो जगदार्जवपालनः । जनवान् धनवान् धर्मी धर्मगो धर्मवर्धनः ॥ ॥ अमृतः शाश्वतः साध्यः सिद्धिदः
    सुमनोहरः । खलुब्रह्मखलुस्थानो मुनीनां परमा गतिः ॥ ॥ उपद्रष्टा तथा श्रेष्ठः शुचिभूतो ह्यनामयः । वेदसिद्धान्तवेद्यश्च
    मानसाह्लादवर्धनः ॥ ॥ देहादन्यो गुणादन्यो लोकादन्यो विवेकवित् । दुष्टस्वप्नहरश्चैव गुरुर्गुरुवरोत्तमः
    ॥ ॥ कर्मी कर्मविनिर्मुक्तः सन्न्यासी साधकेश्वरः । सर्वभावविहीनश्च तृष्णासङ्गनिवारकः ॥ ॥ त्यागी त्यागवपुस्त्यागस्त्यागदानविवर्जितः
    । त्यागकारणत्यागात्मा सद्गुरुः सुखदायकः ॥ ॥ दक्षो दक्षादिवन्द्यश्च ज्ञानवादप्रवर्तकः । शब्दब्रह्ममयात्मा
    च शब्दब्रह्मप्रकाशवान् ॥ ॥ ग्रसिष्णुः प्रभविष्णुश्च सहिष्णुर्विगतान्तरः । विद्वत्तमो महावन्द्यो विशालोत्तमवाङ्मुनिः
    ॥ ॥ ब्रह्मविद्ब्रह्मभावश्च ब्रह्मर्षिर्ब्राह्मणप्रियः । ब्रह्म ब्रह्मप्रकाशात्मा ब्रह्मविद्याप्रकाशनः
    ॥ ॥ अत्रिवंशप्रभूतात्मा तापसोत्तमवन्दितः । आत्मवासी विधेयात्मा ह्यत्रिवंशविवर्धनः ॥ ॥ प्रवर्तनो निवृत्तात्मा
    प्रलयोदकसन्निभः । नारायणो महागर्भो भार्गवप्रियकृत्तमः ॥ ॥ सङ्कल्पदुःखदलनः संसारतमनाशनः । त्रिविक्रमस्त्रिधाकारस्त्रिमूर्तिस्त्रिगुणात्मकः
    ॥ ॥ भेदत्रयहरश्चैव तापत्रयनिवारकः । दोषत्रयविभेदी च संशयार्णवखण्डनः ॥ ॥ असंशयस्त्वसम्मूढो ह्यवादी
    राजवन्दितः । राजयोगी महायोगी स्वभावगलितस्तथा ॥ ॥ पुण्यश्लोकः पवित्राङ्घ्रिर्ध्यानयोगपरायणः । ध्यानस्थो
    ध्यानगम्यश्च विधेयात्मा पुरातनः ॥ ॥ अविज्ञेयो ह्यन्तरात्मा मुख्यबिम्बसनातनः । जीवसञ्जीवनो जीवश्चिद्विलासश्चिदाश्रयः
    ॥ ॥ महेन्द्रोऽमरमान्यश्च योगेन्द्रो योगवित्तमः । योगधर्मस्तथा योगस्तत्त्वस्तत्त्वविनिश्चयः ॥ ॥ नैकबाहुरनन्तात्मा
    नैकनामपराक्रमः । नैकाक्षी नैकपादश्च नाथनाथोत्तमोत्तमः ॥ ॥ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात्
    । सहस्ररूपदृक् चैव सहस्रारमयोद्धवः ॥ ॥ त्रिपादपुरुषश्चैव त्रिपादूर्ध्वस्तथैव च । त्र्यम्बकश्च महावीर्यो
    योगवीर्यविशारदः ॥ ॥ विजयी विनयी जेता वीतरागी विराजितः । रुद्रो रौद्रो महाभीमः प्राज्ञमुख्यः सदाशुचिः
    ॥ ॥ अन्तर्ज्योतिरनन्तात्मा प्रत्यगात्मा निरन्तरः । अरूपश्चात्मरूपश्च सर्वभावविनिर्वृतः ॥ ॥ अन्तःशून्यो
    बहिःशून्यः शून्यात्मा शून्यभावनः । अन्तःपूर्णो बहिःपूर्णः पूर्णात्मा पूर्णभावनः ॥ ॥ अन्तस्त्यागी बहिस्त्यागी
    त्यागात्मा सर्वयोगवान् । अन्तर्योगी बहिर्योगी सर्वयोगपरायणः ॥ ॥ अन्तर्भोगी बहिर्भोगी सर्वभोगविदुत्तमः
    । अन्तर्निष्ठो बहिर्निष्ठः सर्वनिष्ठामयस्तथा ॥ ॥ बाह्यान्तरविमुक्तश्च बाह्यान्तरविवर्जितः । शान्तः
    शुद्धो विशुद्धश्च निर्वाणः प्रकृतेः परः ॥ ॥ अकालः कालनेमी च कालकालो जनेश्वरः । कालात्मा कालकर्ता च
    कालज्ञः कालनाशनः ॥ ॥ कैवल्यपददाता च कैवल्यसुखदायकः । कैवल्यकलनाधारो निर्भरो हर्षवर्धनः ॥ ॥ हृदयस्थो
    हृषीकेशो गोविन्दो गर्भवर्जितः । सकलागमपूज्यश्च निगमो निगमाश्रयः ॥ ॥ पराशक्तिः पराकीर्तिः परावृत्तिर्निधिस्मृतिः
    । परविद्या पराक्षान्तिर्विभक्तिर्युक्तसद्गतिः ॥ ॥ स्वप्रकाशः प्रकाशात्मा परसंवेदनात्मकः । स्वसेव्यः
    स्वविदां स्वात्मा स्वसंवेद्योऽनघः क्षमी ॥ ॥ स्वानुसन्धानशीलात्मा स्वानुसन्धानगोचरः । स्वानुसन्धानशून्यात्मा
    स्वानुसन्धानकाश्रयः ॥ ॥ स्वबोधदर्पणोऽभङ्गः कन्दर्पकुलनाशनः । ब्रह्मचारी ब्रह्मवेत्ता ब्राह्मणो ब्रह्मवित्तमः
    ॥ ॥ तत्त्वबोधः सुधावर्षः पावनः पापपावकः । ब्रह्मसूत्रविधेयात्मा ब्रह्मसूत्रार्थनिर्णयः ॥ ॥ आत्यन्तिको
    महाकल्पः सङ्कल्पावर्तनाशनः । आधिव्याधिहरश्चैव संशयार्णवशोषकः ॥ ॥ तत्त्वात्मज्ञानसन्देशो महानुभवभावितः
    । आत्मानुभवसम्पन्नः स्वानुभावसुखाश्रयः ॥ ॥ अचिन्त्यश्च बृहद्भानुः प्रमदोत्कर्षनाशनः । अनिकेत प्रशान्तात्मा
    शून्यावासो जगद्वपुः ॥ ॥ चिद्गतिश्चिन्मयश्चक्री मायाचक्रप्रवर्तकः । सर्ववर्णविदारम्भी सर्वारम्भपरायणः
    ॥ ॥ पुराणः प्रवरो दाता सुन्दरः कनकाङ्गदी । अनसूयात्मजो दत्तः सर्वज्ञः सर्वकामदः ॥ ॥ कामजित् कामपालश्च
    कामी कामप्रदागमः । कामवान् कामपोषश्च सर्वकामनिवर्तकः ॥ ॥ सर्वकर्मफलोत्पत्तिः सर्वकामफलप्रदः । सर्वकर्मफलैः
    पूज्यः सर्वकर्मफलाश्रयः ॥ ॥ विश्वकर्मा कृतात्मा च कृतज्ञः सर्वसाक्षिकः । सर्वारम्भपरित्यागी जडोन्मत्तपिशाचवान्
    ॥ ॥ भिक्षुर्भैक्षाकरश्चैव भैक्षाहारी निराश्रमी । अकूलश्चानुकूलश्च विकलो ह्यकलस्तथा ॥ ॥ जटिलो वनचारी
    च दण्डी मुण्डी च गण्डवान् । देहधर्मविहीनात्मा ह्येकाकी सङ्गवर्जितः ॥ ॥ आश्रम्यनाश्रमारम्भोऽनाचारी
    कर्मवर्जितः । असन्देही च सन्देही न किञ्चिन्न च किञ्चनः ॥ ॥ नृदेही देहशून्यश्च नाभावी भावनिर्गतः ।
    नाब्रह्मा च परब्रह्म स्वयमेव निराकुलः ॥ ॥ अनघश्चागुरुश्चैव नाथनाथोत्तमो गुरुः । द्विभुजः प्राकृतश्चैव
    जनकश्च पितामहः ॥ ॥ अनात्मा न च नानात्मा नीतिर्नीतिमतां वरः । सहजः सदृशः सिद्धश्चैकश्चिन्मात्र एव च
    ॥ ॥ न कर्तापि च कर्ता च भोक्ता भोगविवर्जितः । तुरीयस्तुरीयातीतः स्वच्छः सर्वमयस्तथा ॥ ॥ सर्वाधिष्ठानरूपश्च
    सर्वध्येयविवर्जितः । सर्वलोकनिवासात्मा सकलोत्तमवन्दितः ॥ ॥ देहभृद्देहकृच्चैव देहात्मा देहभावनः । देही
    देहविभक्तश्च देहभावप्रकाशनः ॥ ॥ लयस्थो लयविच्चैव लयाभावश्च बोधवान् । लयातीतो लयस्यान्तो लयभावनिवारणः
    ॥ ॥ विमुखः प्रमुखश्चैव प्रत्यङ्मुखवदाचरी । विश्वभुग्विश्वधृग्विश्वो विश्वक्षेमकरस्तथा ॥ ॥ अविक्षिप्तोऽप्रमादी
    च परर्धिः परमार्थदृक् । स्वानुभावविहीनश्च स्वानुभावप्रकाशनः ॥ ॥ निरिन्द्रियश्च निर्बुद्धिर्निराभासो
    निराकृतः । निरहङ्काररूपात्मा निर्वपुः सकलाश्रयः ॥ ॥ शोकदुःखहरश्चैव भोगमोक्षफलप्रदः । सुप्रसन्नस्तथा
    सूक्ष्मः शब्दब्रह्मार्थसङ्ग्रहः ॥ ॥ आगमापायशून्यश्च स्थानदश्च सताङ्गतिः । अकृतः सुकृतश्चैव कृतकर्मा
    विनिर्वृतः ॥ ॥ भेदत्रयहरश्चैव देहत्रयविनिर्गतः । सर्वकाममयश्चैव सर्वकामनिवर्तकः ॥ ॥ सिद्धेश्वरोऽजरः
    पञ्चबाणदर्पहुताशनः । चतुरक्षरबीजात्मा स्वभूश्चित्कीर्तिभूषणः ॥ ॥ अगाधबुद्धिरक्षुब्धश्चन्द्रसूर्याग्निलोचनः
    । यमदंष्ट्रोऽतिसंहर्ता परमानन्दसागरः ॥ ॥ लीलाविश्वम्भरो भानुर्भैरवो भीमलोचनः । ब्रह्मचर्माम्बरः कालस्त्वचलश्चलनान्तकः
    ॥ ॥ आदिदेवो जगद्योनिर्वासवारिविमर्दनः । विकर्मकर्मकर्मज्ञो अनन्यगमकोऽगमः ॥ ॥ अबद्धकर्मशून्यश्च कामरागकुलक्षयः
    । योगान्धकारमथनः पद्मजन्मादिवन्दितः ॥ ॥ भक्तकामोऽग्रजश्चक्री भावनिर्भावभावकः । भेदान्तको महानग्र्यो
    निगूहो गोचरान्तकः ॥ ॥ कालाग्निशमनः शङ्खचक्रपद्मगदाधरः । दीप्तो दीनपतिः शास्ता स्वच्छन्दो मुक्तिदायकः
    ॥ ॥ व्योमधर्माम्बरो भेत्ता भस्मधारी धराधरः । धर्मगुप्तोऽन्वयात्मा च व्यतिरेकार्थनिर्णयः ॥ ॥ एकानेकगुणाभासाभासनिर्भासवर्जितः
    । भावाभावस्वभावात्मा भावाभावविभाववित् ॥ ॥ योगिहृदयविश्रामोऽनन्तविद्याविवर्धनः । विघ्नान्तकस्त्रिकालज्ञस्तत्त्वात्मा
    ज्ञानसागरः ॥ ॥ इतीदं दत्तसाहस्रं सायं प्रातः पठेत्तु यः । स इहामुत्र लभते निर्वाणं परमं सुखम् ॥ ॥
    गुरुवारे दत्तभक्तो भक्तिभावसमन्वितः । पठेत् सदैव यो ह्येतत् स लभेच्चिन्तितं ध्रुवम् ॥ ॥ इति श्रीमद्दत्तात्रेयपुराणे
    श्री दत्तात्रेय सहस्रनाम स्तोत्रम् ।
