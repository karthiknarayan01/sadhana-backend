id: krishnasahasranamastotram-satvatatantram
category: stotram
name:
  english: krishnasahasranamastotram (satvatatantram)
  devanagari: कृष्णसहस्रनामस्तोत्रम् (सात्वततन्त्रम्)
content:
  english: rangashalagataparanaranarikritotsavah || 145|| kamsadhvamsakarah kamsasvasarupyagatipradah
    | kritograsenanripatih sarvayadavasaukhyakrit || 146|| tatamatrikritanando nandagopaprasadadah | shritasandipanigururvidyasagaraparagah
    || 147|| daityapancajanadhvamsi pancajanyadarapriyah | sandipanimritapatyadata kalayamarcitah || 148||
    sairandhrikamasantapashamano'krurapritidah | sharngacapadharo nanasharasandhanakovidah || 149|| abhedyadivyakavacah
    shrimaddarukasarathih | khagendracihnitadhvajashcakrapanirgadadharah || 150|| nandakiyadusenadhyo'kshayabananishangavan
    | surasurajeyaranyo jitamagadhayuthapah || 151|| magadhadhvajinidhvamsi mathurapurapalakah | dvarakapuranirmata
    lokasthitiniyamakah || 152|| sarvasampattijananah svajananandakarakah | kalpavrikshakshitamahih sudharmanitabhutalah
    || 153|| yavanasurasamharta mucukundeshtasadhakah | rukminidvijasammantrarathaikagatakundinah || 154||
    rukminiharako rukmimundamundanakarakah | rukminipriyakritsakshadrukminiramanipatih || 155|| rukminivadanambhojamadhupanamadhuvratah
    | syamantakanimittatmabhaktarkshadhipajitshucih || 156|| jambavarcitapadabjah sakshajjambavatipatih
    | satyabhamakaragrahi kalindisundaripriyah || 157|| sutikshnashringavrishabhasaptajidrajayuthabhid
    | nagnajittanayasatyanayikanayakottamah || 158|| bhadresho lakshmanakanto mitravindapriyeshvarah |
    murujitpithasenaninashano narakantakah || 159|| dhararcitapadambhojo bhagadattabhayapaha | narakahritadivyastriratnavahadinayakah
    || 160|| ashtottarashatadvyashtasahasrastrivilasavan | satyabhamabalavakyaparijatapaharakah || 161||
    devendrabalabhijjayajatananavilasavan | rukminimanadalanah strivilasavimohitah || 162|| kamatatah
    sambasuto'sankhyaputraprapautravan | ushayanitapautrarthabanabahusasrachit || 163|| nandyadipramathadhvamsi
    lilajitamaheshvarah | mahadevastutapado nrigaduhkhavimocakah || 164|| brahmasvapaharakleshakathasvajanapalakah
    | paundrakarih kashirajashiroharta sadajitah || 165|| sudakshinavrataradhyashivakrityanalantakah |
    varanasipradahano naradekshitavaibhavah || 166|| adbhutaishvaryamahima sarvadharmapravartakah | jarasandhanirodhartabhubhujeritasatkathah
    || 167|| naraderitasanmitrakaryagauravasadhakah | kalatraputrasanmitrasadvrittaptagrihanugah || 168||
    jarasandhavadhodyogakarta bhupatisharmakrit | sanmitrakrityacarito rajasuyapravartakah || 169|| sarvarshiganasamstutyashcaidyaprananikrintakah
    | indraprasthajanaih pujyo duryodhanavimohanah || 170|| maheshadattasaubhagyapurabhicchatrughatakah
    | dantavaktraripucchetta dantavaktragatipradah || 171|| vidurathapramathano bhuribharavatarakah |
    parthadutah parthahitah partharthah parthasarathih || 172|| parthamohasamucchedi gitashastrapradarshakah
    | parthabanagatapranavirakaivalyarupadah || 173|| duryodhanadidurvrittadahano bhishmamuktidah | parthashvamedhaharakah
    partharajyaprasadhakah || 174|| prithabhishtaprado bhimajayado vijayapradah | yudhishthireshtasandata
    draupadipritisadhakah || 175|| sahadeveritapado nakularcitavigrahah | brahmastradagdhagarbhasthapuruvamshaprasadhakah
    || 176|| pauravendrapurastribhyo dvarakagamanotsavah | anartadeshanivasatprajeritamahatkathah || 177||
    priyapritikaro mitravipradaridryabhanjanah | tirthapadeshasanmitrapriyakrinnandanandanah || 178||
    gopijanajnanadata tatakratukritotsavah | sadvrittavakta sadvrittakarta sadvrittapalakah || 179|| tatatmajnanasandata
    devakimritaputradah | shrutadevapriyakaro maithilanandavardhanah || 180|| parthadarpaprashamano mritaviprasutapradah
    | striratnavrindasantoshi janakelikalotsavah || 181|| candrakotijananandi bhanukotisamaprabhah | kritantakotidurlanghyah
    kamakotimanoharah || 182|| yaksharatkotidhanavanmarutkotisvaviryavan | samudrakotigambhiro himavatkotyakampanah
    || 183|| kotyashvamedhadhyaharah tirthakotyadhikahvayah | piyushakotimrityughnah kamadhukkotyabhishtadah
    || 184|| shakrakotivilasadhyah kotibrahmandanayakah | sarvamoghodyamo'nantakirtinihsimapaurushah ||
    185|| sarvabhishtapradayashah punyashravanakirtanah | brahmadisurasangitavitamanushaceshtitah || 186||
    anadimadhyanidhano vriddhikshayavivarjitah | svabhaktoddhavamukhyaikajnanado jnanavigrahah || 187||
    viprashapacchaladhvastayaduvamshogravikramah | sasharirajaravyadhasvargadah svargisamstutah || 188||
    mumukshumuktavishayijananandakaro yashah | kalikalamaladhvamsiyashah shravanamangalah || 189|| bhaktapriyo
    bhaktahito bhaktabhramarapankajah | smritamatrakhilatrata yantramantraprabhanjakah || 190|| sarvasampatsravinama
    tulasidamavallabhah | aprameyavapurbhasvadanarghyangavibhushanah || 191|| vishvaikasukhado vishvasajjananandapalakah
    | sarvadevashiroratnamadbhutanantabhogavan || 192|| adhokshajo janajivyah sarvasadhujanashrayah |
    samastabhayabhinnama smritamatrartinashakah || 193|| svayashahshravananandajanaragi gunarnavah | anirdeshyavapustaptasharano
    jivajivanah || 194|| paramarthah paramvedyah parajyotih paragatih | vedantavedyo bhagavananantasukhasagarah
    || 195|| jagadbandhadhvamsayasha jagajjivajanashrayah | vaikunthalokaikapatirvaikunthajanavallabhah
    || 196|| pradyumno rukminiputrah shambaraghno ratipriyah | pushpadhanva vishvajayi dyumatprananishudakah
    || 197|| aniruddhah kamasutah shabdayonirmahakramah | ushapatirvrishnipatirhrishikesho manahpatih
    || 198|| shrimadbhagavatacaryah sarvavedantasagarah | shukah sakaladharmajnah parikshinnripasatkritah
    || 199|| shribuddho dushtabuddhighno daityavedabahishkarah | pakhandamargapravado nirayudhajagajjayah
    || 200|| kalki kaliyugacchadi punah satyapravartakah | vipravishnuyasho'patyo nashtadharmapravartakah
    || 201|| sarasvatah sarvabhaumo balitrailokyasadhakah | ashtamyantarasaddharmavakta vairocanipriyah
    || 202|| apah karo ramanatho'mararikulakrintanah | surendrahitakriddhiraviramuktibalapradah || 203||
    vishvaksenah shambhusakho dashamantarapalakah | brahmasavarnivamshabdhihitakridvishvavardhanah ||
    204|| dharmaseturadharmaghno vaidyatantrapadapradah | asurantakaro devarthakasunuh subhashanah ||
    205|| svadhama sunritasunuh satyatejo dvijatmajah | dvishanmanuyugatrata patalapuradaranah || 206||
    daivahotrirvarhatoyo divaspatiratipriyah | trayodashantaratrata yogayogijaneshvarah || 207|| sattrayano
    brihadbahurvainateyo viduttamah | karmakandaikapravado vedatantrapravartakah || 208|| parameshthi
    surajyeshtho brahma vishvasrijampatih | abjayonirhamsavahah sarvalokapitamahah || 209|| vishnuh sarvajagatpata
    shantah shuddhah sanatanah | dvijapujyo dayasindhuh sharanyo bhaktavatsalah || 210|| rudro mridah
    shivah shasta shambhuh sarvaharo harah | kapardi shankarah shuli tryaksho'bhedyo maheshvarah || 211||
    sarvadhyakshah sarvashaktih sarvarthah sarvatomukhah | sarvavasah sarvarupah sarvakaranakaranam ||
    212|| ityetatkathitam vipra vishnornamasahasrakam | sarvapapaprashamanam sarvabhishtaphalapradam ||
    213|| manahshuddhikaram cashu bhagavadbhaktivardhanam | sarvavighnaharam sarvashcaryaishvaryapradayakam
    || 214|| sarvaduhkhaprashamanam caturvargyaphalapradam | shraddhaya paraya bhaktya shravanatpathanajjapat
    || 215|| pratyaham sarvavarnanam vishnupadashritatmanam | etatpathan dvijo vidyam kshatriyah prithivimimam
    || 216|| vaishyo mahanidhim shudro vanchitam siddhimapnuyat | dvatrimshadaparadhanyo jnanajnanaccareddhareh
    || 217|| namna dashaparadhamshca pramadadacaredyadi | samahitamana hyetatpathedva shravayejjapet ||
    218|| smaredva shrinuyadvapi tebhyah sadyah pramucyate | natah parataram punyam trishu lokeshu vidyate
    || 219|| yasyaikakirtanenapi bhavabandhadvimucyate | atastvam satatam bhaktya shraddhaya kirtanam
    kuru || 220|| vishnornamasahasram te bhagavatpritikaranam | shrinarada uvaca | dhanyo'smyanugrihito'smi
    tvayatikarunatmana | yatah krishnasya paramam sahasram namakirtitam || 221|| yadyalasyatpramadadva
    sarvam pathitumanvaham | na shaknomi tada deva kim karomi vada prabho || 222|| shrishiva uvaca | yadi
    sarvam na shaknoshi pratyaham pathitum dvija | tada krishneti krishneti krishneti pratyaham vada ||
    223|| etena tava viprarshe sarvam sampadyate sakrit | kim punarbhagavannamnam sahasrasya prakirtanat
    || 224|| yannamakirtanenaiva puman samsarasagaram | taratyaddha prapadye tam krishnam gopalarupinam
    || 225|| iti satvatatantre shrikrishnasahasranamashashthah patalah ||6||
  devanagari: रङ्गशालागतापारनरनारीकृतोत्सवः ॥ १४५॥ कंसध्वंसकरः कंसस्वसारूप्यगतिप्रदः । कृतोग्रसेननृपतिः
    सर्वयादवसौख्यकृत् ॥ १४६॥ तातमातृकृतानन्दो नन्दगोपप्रसाददः । श्रितसान्दीपनिगुरुर्विद्यासागरपारगः ॥
    १४७॥ दैत्यपञ्चजनध्वंसी पाञ्चजन्यदरप्रियः । सान्दीपनिमृतापत्यदाता कालयमार्चितः ॥ १४८॥ सैरन्ध्रीकामसन्तापशमनोऽक्रूरप्रीतिदः
    । शार्ङ्गचापधरो नानाशरसन्धानकोविदः ॥ १४९॥ अभेद्यदिव्यकवचः श्रीमद्दारुकसारथिः । खगेन्द्रचिह्नितध्वजश्चक्रपाणिर्गदाधरः
    ॥ १५०॥ नन्दकीयदुसेनाढ्योऽक्षयबाणनिषङ्गवान् । सुरासुराजेयरण्यो जितमागधयूथपः ॥ १५१॥ मागधध्वजिनीध्वंसी
    मथुरापुरपालकः । द्वारकापुरनिर्माता लोकस्थितिनियामकः ॥ १५२॥ सर्वसम्पत्तिजननः स्वजनानन्दकारकः । कल्पवृक्षाक्षितमहिः
    सुधर्मानीतभूतलः ॥ १५३॥ यवनासुरसंहर्ता मुचुकुन्देष्टसाधकः । रुक्मिणीद्विजसंमन्त्ररथैकगतकुण्डिनः ॥ १५४॥
    रुक्मिणीहारको रुक्मिमुण्डमुण्डनकारकः । रुक्मिणीप्रियकृत्साक्षाद्रुक्मिणीरमणीपतिः ॥ १५५॥ रुक्मिणीवदनाम्भोजमधुपानमधुव्रतः
    । स्यमन्तकनिमित्तात्मभक्तर्क्षाधिपजित्शुचिः ॥ १५६॥ जाम्बवार्चितपादाब्जः साक्षाज्जाम्बवतीपतिः । सत्यभामाकरग्राही
    कालिन्दीसुन्दरीप्रियः ॥ १५७॥ सुतीक्ष्णशृङ्गवृषभसप्तजिद्राजयूथभिद् । नग्नजित्तनयासत्यानायिकानायकोत्तमः
    ॥ १५८॥ भद्रेशो लक्ष्मणाकान्तो मित्रविन्दाप्रियेश्वरः । मुरुजित्पीठसेनानीनाशनो नरकान्तकः ॥ १५९॥ धरार्चितपदाम्भोजो
    भगदत्तभयापहा । नरकाहृतदिव्यस्त्रीरत्नवाहादिनायकः ॥ १६०॥ अष्टोत्तरशतद्व्यष्टसहस्रस्त्रीविलासवान् ।
    सत्यभामाबलावाक्यपारिजातापहारकः ॥ १६१॥ देवेन्द्रबलभिज्जायाजातनानाविलासवान् । रुक्मिणीमानदलनः स्त्रीविलासाविमोहितः
    ॥ १६२॥ कामतातः साम्बसुतोऽसङ्ख्यपुत्रप्रपौत्रवान् । उशायानितपौत्रार्थबाणबाहुसस्रछित् ॥ १६३॥ नन्द्यादिप्रमथध्वंसी
    लीलाजितमहेश्वरः । महादेवस्तुतपदो नृगदुःखविमोचकः ॥ १६४॥ ब्रह्मस्वापहरक्लेशकथास्वजनपालकः । पौण्ड्रकारिः
    काशिराजशिरोहर्ता सदाजितः ॥ १६५॥ सुदक्षिणव्रताराध्यशिवकृत्यानलान्तकः । वाराणसीप्रदहनो नारदेक्षितवैभवः
    ॥ १६६॥ अद्भुतैश्वर्यमहिमा सर्वधर्मप्रवर्तकः । जरासन्धनिरोधार्तभूभुजेरितसत्कथः ॥ १६७॥ नारदेरितसन्मित्रकार्यगौरवसाधकः
    । कलत्रपुत्रसन्मित्रसद्वृत्ताप्तगृहानुगः ॥ १६८॥ जरासन्धवधोद्योगकर्ता भूपतिशर्मकृत् । सन्मित्रकृत्याचरितो
    राजसूयप्रवर्तकः ॥ १६९॥ सर्वर्षिगणसंस्तुत्यश्चैद्यप्राणनिकृन्तकः । इन्द्रप्रस्थजनैः पूज्यो दुर्योधनविमोहनः
    ॥ १७०॥ महेशदत्तसौभाग्यपुरभिच्छत्रुघातकः । दन्तवक्त्ररिपुच्छेत्ता दन्तवक्त्रगतिप्रदः ॥ १७१॥ विदूरथप्रमथनो
    भूरिभारावतारकः । पार्थदूतः पार्थहितः पार्थार्थः पार्थसारथिः ॥ १७२॥ पार्थमोहसमुच्छेदी गीताशास्त्रप्रदर्शकः
    । पार्थबाणगतप्राणवीरकैवल्यरूपदः ॥ १७३॥ दुर्योधनादिदुर्वृत्तदहनो भीष्ममुक्तिदः । पार्थाश्वमेधाहरकः
    पार्थराज्यप्रसाधकः ॥ १७४॥ पृथाभीष्टप्रदो भीमजयदो विजयप्रदः । युधिष्ठिरेष्टसन्दाता द्रौपदीप्रीतिसाधकः
    ॥ १७५॥ सहदेवेरितपदो नकुलार्चितविग्रहः । ब्रह्मास्त्रदग्धगर्भस्थपूरुवंशप्रसाधकः ॥ १७६॥ पौरवेन्द्रपुरस्त्रीभ्यो
    द्वारकागमनोत्सवः । आनर्तदेशनिवसत्प्रजेरितमहत्कथः ॥ १७७॥ प्रियप्रीतिकरो मित्रविप्रदारिद्र्यभञ्जनः ।
    तीर्थापदेशसन्मित्रप्रियकृन्नन्दनन्दनः ॥ १७८॥ गोपीजनज्ञानदाता तातक्रतुकृतोत्सवः । सद्वृत्तवक्ता सद्वृत्तकर्ता
    सद्वृत्तपालकः ॥ १७९॥ तातात्मज्ञानसन्दाता देवकीमृतपुत्रदः । श्रुतदेवप्रियकरो मैथिलानन्दवर्धनः ॥ १८०॥
    पार्थदर्पप्रशमनो मृतविप्रसुतप्रदः । स्त्रीरत्नवृन्दसन्तोषी जनकेलिकलोत्सवः ॥ १८१॥ चन्द्रकोटिजनानन्दी
    भानुकोटिसमप्रभः । कृतान्तकोटिदुर्लङ्घ्यः कामकोटिमनोहरः ॥ १८२॥ यक्षराट्कोटिधनवान्मरुत्कोटिस्ववीर्यवान्
    । समुद्रकोटिगम्भीरो हिमवत्कोट्यकम्पनः ॥ १८३॥ कोट्यश्वमेधाढ्यहरः तीर्थकोट्यधिकाह्वयः । पीयूषकोटिमृत्युघ्नः
    कामधुक्कोट्यभीष्टदः ॥ १८४॥ शक्रकोटिविलासाढ्यः कोटिब्रह्माण्डनायकः । सर्वामोघोद्यमोऽनन्तकीर्तिनिःसीमपौरुषः
    ॥ १८५॥ सर्वाभीष्टप्रदयशाः पुण्यश्रवणकीर्तनः । ब्रह्मादिसुरसङ्गीतवीतमानुषचेष्टितः ॥ १८६॥ अनादिमध्यनिधनो
    वृद्धिक्षयविवर्जितः । स्वभक्तोद्धवमुख्यैकज्ञानदो ज्ञानविग्रहः ॥ १८७॥ विप्रशापच्छलध्वस्तयदुवंशोग्रविक्रमः
    । सशरीरजराव्याधस्वर्गदः स्वर्गिसंस्तुतः ॥ १८८॥ मुमुक्षुमुक्तविषयीजनानन्दकरो यशः । कलिकालमलध्वंसियशाः
    श्रवणमङ्गलः ॥ १८९॥ भक्तप्रियो भक्तहितो भक्तभ्रमरपङ्कजः । स्मृतमात्राखिलत्राता यन्त्रमन्त्रप्रभञ्जकः
    ॥ १९०॥ सर्वसम्पत्स्राविनामा तुलसीदामवल्लभः । अप्रमेयवपुर्भास्वदनर्घ्याङ्गविभूषणः ॥ १९१॥ विश्वैकसुखदो
    विश्वसज्जनानन्दपालकः । सर्वदेवशिरोरत्नमद्भुतानन्तभोगवान् ॥ १९२॥ अधोक्षजो जनाजीव्यः सर्वसाधुजनाश्रयः
    । समस्तभयभिन्नामा स्मृतमात्रार्तिनाशकः ॥ १९३॥ स्वयशःश्रवणानन्दजनरागी गुणार्णवः । अनिर्देश्यवपुस्तप्तशरणो
    जीवजीवनः ॥ १९४॥ परमार्थः परंवेद्यः परज्योतिः परागतिः । वेदान्तवेद्यो भगवाननन्तसुखसागरः ॥ १९५॥ जगद्बन्धध्वंसयशा
    जगज्जीवजनाश्रयः । वैकुण्ठलोकैकपतिर्वैकुण्ठजनवल्लभः ॥ १९६॥ प्रद्युम्नो रुक्मिणीपुत्रः शम्बरघ्नो रतिप्रियः
    । पुष्पधन्वा विश्वजयी द्युमत्प्राणनिषूदकः ॥ १९७॥ अनिरुद्धः कामसुतः शब्दयोनिर्महाक्रमः । उषापतिर्वृष्णिपतिर्हृषीकेशो
    मनःपतिः ॥ १९८॥ श्रीमद्भागवताचार्यः सर्ववेदान्तसागरः । शुकः सकलधर्मज्ञः परीक्षिन्नृपसत्कृतः ॥ १९९॥
    श्रीबुद्धो दुष्टबुद्धिघ्नो दैत्यवेदबहिष्करः । पाखण्डमार्गप्रवदो निरायुधजगज्जयः ॥ २००॥ कल्की कलियुगाच्छादी
    पुनः सत्यप्रवर्तकः । विप्रविष्णुयशोऽपत्यो नष्टधर्मप्रवर्तकः ॥ २०१॥ सारस्वतः सार्वभौमो बलित्रैलोक्यसाधकः
    । अष्टम्यन्तरसद्धर्मवक्ता वैरोचनिप्रियः ॥ २०२॥ आपः करो रमानाथोऽमरारिकुलकृन्तनः । सुरेन्द्रहितकृद्धीरवीरमुक्तिबलप्रदः
    ॥ २०३॥ विष्वक्सेनः शम्भुसखो दशमान्तरपालकः । ब्रह्मसावर्णिवंशाब्धिहितकृद्विश्ववर्धनः ॥ २०४॥ धर्मसेतुरधर्मघ्नो
    वैद्यतन्त्रपदप्रदः । असुरान्तकरो देवार्थकसूनुः सुभाषणः ॥ २०५॥ स्वधामा सूनृतासूनुः सत्यतेजो द्विजात्मजः
    । द्विषन्मनुयुगत्राता पातालपुरदारणः ॥ २०६॥ दैवहोत्रिर्वार्हतोयो दिवस्पतिरतिप्रियः । त्रयोदशान्तरत्राता
    योगयोगिजनेश्वरः ॥ २०७॥ सत्त्रायणो बृहद्बाहुर्वैनतेयो विदुत्तमः । कर्मकाण्डैकप्रवदो वेदतन्त्रप्रवर्तकः
    ॥ २०८॥ परमेष्ठी सुरज्येष्ठो ब्रह्मा विश्वसृजाम्पतिः । अब्जयोनिर्हंसवाहः सर्वलोकपितामहः ॥ २०९॥ विष्णुः
    सर्वजगत्पाता शान्तः शुद्धः सनातनः । द्विजपूज्यो दयासिन्धुः शरण्यो भक्तवत्सलः ॥ २१०॥ रुद्रो मृडः शिवः
    शास्ता शम्भुः सर्वहरो हरः । कपर्दी शङ्करः शूली त्र्यक्षोऽभेद्यो महेश्वरः ॥ २११॥ सर्वाध्यक्षः सर्वशक्तिः
    सर्वार्थः सर्वतोमुखः । सर्वावासः सर्वरूपः सर्वकारणकारणम् ॥ २१२॥ इत्येतत्कथितं विप्र विष्णोर्नामसहस्रकम्
    । सर्वपापप्रशमनं सर्वाभीष्टफलप्रदम् ॥ २१३॥ मनःशुद्धिकरं चाशु भगवद्भक्तिवर्धनम् । सर्वविघ्नहरं सर्वाश्चर्यैश्वर्यप्रदायकम्
    ॥ २१४॥ सर्वदुःखप्रशमनं चातुर्वर्ग्यफलप्रदम् । श्रद्धया परया भक्त्या श्रवणात्पठनाज्जपात् ॥ २१५॥ प्रत्यहं
    सर्ववर्णानां विष्णुपादाश्रितात्मनाम् । एतत्पठन् द्विजो विद्यां क्षत्रियः पृथिवीमिमाम् ॥ २१६॥ वैश्यो
    महानिधिं शूद्रो वाञ्छितां सिद्धिमाप्नुयात् । द्वात्रिंशदपराधान्यो ज्ञानाज्ञानाच्चरेद्धरेः ॥ २१७॥ नाम्ना
    दशापराधांश्च प्रमादादाचरेद्यदि । समाहितमना ह्येतत्पठेद्वा श्रावयेज्जपेत् ॥ २१८॥ स्मरेद्वा शृणुयाद्वापि
    तेभ्यः सद्यः प्रमुच्यते । नातः परतरं पुण्यं त्रिषु लोकेषु विद्यते ॥ २१९॥ यस्यैककीर्तनेनापि भवबन्धाद्विमुच्यते
    । अतस्त्वं सततं भक्त्या श्रद्धया कीर्तनं कुरु ॥ २२०॥ विष्णोर्नामसहस्रं ते भगवत्प्रीतिकारणम् । श्रीनारद
    उवाच । धन्योऽस्म्यनुगृहीतोऽस्मि त्वयातिकरुणात्मना । यतः कृष्णस्य परमं सहस्रं नामकीर्तितम् ॥ २२१॥ यद्यालस्यात्प्रमादाद्वा
    सर्वं पठितुमन्वहम् । न शक्नोमि तदा देव किं करोमि वद प्रभो ॥ २२२॥ श्रीशिव उवाच । यदि सर्वं न शक्नोषि
    प्रत्यहं पठितुं द्विज । तदा कृष्णेति कृष्णेति कृष्णेति प्रत्यहं वद ॥ २२३॥ एतेन तव विप्रर्षे सर्वं
    सम्पद्यते सकृत् । किं पुनर्भगवन्नाम्नां सहस्रस्य प्रकीर्तनात् ॥ २२४॥ यन्नामकीर्तनेनैव पुमान् संसारसागरम्
    । तरत्यद्धा प्रपद्ये तं कृष्णं गोपालरूपिणम् ॥ २२५॥ इति सात्वततन्त्रे श्रीकृष्णसहस्रनामषष्ठः पटलः ॥६॥
