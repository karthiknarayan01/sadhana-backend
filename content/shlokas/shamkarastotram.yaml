id: shamkarastotram
category: stotram
name:
  english: shamkarastotram
  devanagari: शंकरस्तोत्रम्
content:
  english: namastubhyam bhagavate shamkaraya mahatmane| jagadutpattivinashanam hetave mokshahetave||1||
    sarvadevadhidevaya parvatipataye namah| rishiyogimunindranam tvameva parama gatih||2|| brahmamdagolake
    deva dayalunam tvamagranih| ata evolbanam pitam tvaya halahalam visham||3|| gamgadhara mahadeva candralamkritamastaka|
    parameshvara mam pahi bhayam varaya varaya||4|| sarvapapam prashamaya sarvatapam nivaraya| duhkham
    hara harashesham mrityum vidravaya drutam||5|| stutim kartum na me shaktistava vaggatyagocara| dehi
    satsamgatim bhaktim nishcalam tvayi shamkara||6|| sarvarishtam parihara sarvashatrunvinashaya| daridryam
    hara sarvesha sarvankaman prapuraya||7|| mukhe nama drisho rupam hridaye tvatpadambujam| mamastu te
    namah samba prasanno bhava sarvada||8|| tvadarcanavidhim jane na bhaktistvayi me hridi| athapyanugrahanesha
    kevalam dayayoddhara||9|| iti shri pa
  devanagari: नमस्तुभ्यं भगवते शंकराय महात्मने। जगदुत्पत्तिविनाशानां हेतवे मोक्षहेतवे।।१।। सर्वदेवाधिदेवाय
    पार्वतीपतये नमः। ऋषियोगिमुनीन्द्राणां त्वमेव परमा गतिः।।२।। ब्रह्मांडगोलके देव दयालूनां त्वमग्रणीः।
    अत एवोल्बणं पीतं त्वया हालाहलं विषम्।।३।। गंगाधर महादेव चन्द्रालंकृतमस्तक। परमेश्वर मां पाहि भयं वारय
    वारय।।४।। सर्वपापं प्रशमय सर्वतापं निवारय। दुःखं हर हराशेषं मृत्युं विद्रावय द्रुतम्।।५।। स्तुतिं
    कर्तुं न मे शक्तिस्तव वाग्गत्यगोचर। देहि सत्संगतिं भक्तिं निश्चलां त्वयि शंकर।।६।। सर्वारिष्टं परिहर
    सर्वशत्रून्विनाशय। दारिद्र्यं हर सर्वेश सर्वान्कामान् प्रपूरय।।७।। मुखे नाम दृशो रूपं हृदये त्वत्पदाम्बुजम्।
    ममास्तु ते नमः सांब प्रसन्नो भव सर्वदा।।८।। त्वदर्चनविधिं जाने न भक्तिस्त्वयि मे हृदि। अथाप्यनुग्रहाणेश
    केवलं दययोद्धर।।९।। इति श्री प
