id: ulukikritamyamastotram
category: stotram
name:
  english: ulukikritamyamastotram
  devanagari: उलूकिकृतंयमस्तोत्रम्
content:
  english: ulukikritam yamastotram 5 ulukyuvaca | tvadbhita anudravante janastvadbhita brahmacaryam caranti
    | tvadbhitah sadhu caranti dhirastvadbhitah karmanishtha bhavanti || 23|| tvadbhita anashakamacaranti
    gramadaranyamabhi yaccaranti | tvadbhitah saumyatamashrayante tvadbhitah somapanam bhajante | tvadbhitashcannagodananishthastvadbhita
    brahmavadam vadanti || 24|| iti brahmapurane panacavimshadhikashatatamadhyayantargatam ulukikritam
    yamastatram samaptam | brahmapurana | adhyaya 125
  devanagari: उलूकिकृतं यमस्तोत्रम् ५ उलूक्युवाच । त्वद्भीता अनुद्रवन्ते जनास्त्वद्भीता ब्रह्मचर्यं चरन्ति
    । त्वद्भीताः साधु चरन्ति धीरास्त्वद्भीताः कर्मनिष्ठा भवन्ति ॥ २३॥ त्वद्भीता अनाशकमाचरन्ति ग्रामादरण्यमभि
    यच्चरन्ति । त्वद्भीताः सौम्यतामाश्रयन्ते त्वद्भीताः सोमपानं भजन्ते । त्वद्भीताश्चान्नगोदाननिष्ठास्त्वद्भीता
    ब्रह्मवादं वदन्ति ॥ २४॥ इति ब्रह्मपुराणे पञचविंशाधिकशततमाध्यायान्तर्गतं उलूकिकृतं यमस्तत्रं समाप्तम्
    । ब्रह्मपुराण । अध्याय १२५
meaning: {}
