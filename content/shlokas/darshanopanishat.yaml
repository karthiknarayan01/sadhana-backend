id: darshanopanishat
category: upanishad
name:
  english: darshanopanishat
  devanagari: दर्शनोपनिषत्
content:
  english: brahmarandhram gate vayau nadashcotpadyate'nagha | shankhadhvaninibhashcadau madhye meghadhvaniryatha
    || 36 || shiromadhyagate vayau giriprasravanam yatha | pashcat prito mahaprajna sakshadatmonmukho
    bhavet || 37 || punastajjnananishpattiryogat samsaranihnutih | dakshinottaragulphena sivinim pidayet
    sthiram || 38 || savyetarena gulphena pidayed bddhiman narah | janvoradhah sthitam samdhim smritva
    devam triyambakam || 39 || vinayakam ca samsmritya tatha vagishvarim punah | linganalat samakrishya
    vayumapyagrato mune || 40 || pranavena niyuktena binduyuktena buddhiman | muladharasya viprendra madhye
    tam tu nirodhayet || 41 || nirudhya vayuna dipto vahniruhati kundalim | punah sushumnaya vayurvahnina
    saha gacchati || 42 || evamabhyasatastasya jito vayurbhaved bhrisham | evam shanmukhimudrabhyasatah
    brahmarandhramiti || 36 || yatha tatha candramandalagiritah amritapravaho jayate | tena bhrumadhyasthajyotirlingamabhishicya
    tadamritasvadanato yogi vimrityuh bhavati | tatah pashcat || 37
  devanagari: ब्रह्मरन्ध्रं गते वायौ नादश्चोत्पद्यतेऽनघ । शङ्खध्वनिनिभश्चादौ मध्ये मेघध्वनिर्यथा ।। ३६
    ।। शिरोमध्यगते वायौ गिरिप्रस्रवणं यथा । पश्चात् प्रीतो महाप्राज्ञ साक्षादात्मोन्मुखो भवेत् ।। ३७ ।।
    पुनस्तज्ज्ञाननिष्पत्तिर्योगात् संसारनिह्नुतिः । दक्षिणोत्तरगुल्फेन सीविनीं पीडयेत् स्थिराम् ।। ३८
    ।। सव्येतरेण गुल्फेन पीडयेद् ब्द्धिमान् नरः । जान्वोरधः स्थितां संधिं स्मृत्वा देवं त्रियम्बकम् ।।
    ३९ ।। विनायकं च संस्मृत्य तथा वागीश्वरीं पुनः । लिङ्गनालात् समाकृष्य वायुमप्यग्रतो मुने ।। ४० ।। प्रणवेन
    नियुक्तेन बिन्दुयुक्तेन बुद्धिमान् । मूलाधारस्य विप्रेन्द्र मध्ये तं तु निरोधयेत् ।। ४१ ।। निरुध्य
    वायुना दीप्तो वह्निरूहति कुण्डलीम् । पुनः सुषुम्नया वायुर्वह्निना सह गच्छति ।। ४२ ।। एवमभ्यसतस्तस्य
    जितो वायुर्भवेद् भृशम् । एवं षण्मुखीमुद्राभ्यासतः ब्रह्मरन्ध्रमिति ।। ३६ ।। यथा तथा चन्द्रमण्डलगिरितः
    अमृतप्रवाहो जायते । तेन भ्रूमध्यस्थज्योतिर्लिङ्गमभिषिच्य तदमृतास्वादनतो योगी विमृत्युः भवति । ततः
    पश्चात् ।। ३७
