id: vyasakritamshivashtakastotram
category: stotram
name:
  english: vyasakritamshivashtakastotram
  devanagari: व्यासकृतंशिवाष्टकस्तोत्रम्
content:
  english: vyasakritam shivashtakastotram vyasa uvaca | eko rudro na dvitiyo yatastadbrahmaivaikam neha
    nanasti kincit | yadyapyanyah ko'pi va kutracidva vyacashtam tadyasya shaktirmadagre || 1|| yah kshirabdhermandaraghatajato
    jvalamali kalakuto'tibhimah | tam sodhum va ko paro'bhunmaheshadyatkilabhih krishnatamapa vishnuh
    || 2|| yadvano'bhucchripatiryasya yanta lokesho yatsyandanam bhuh samasta | vaha veda yasya yeneshupataddagdha
    gramastraipurastatsamah kah || 3|| yam kandarpo vikshamanah samanam devairanyairbhasmajatah svayam
    hi | paushpairbanaih sarvavishvaikajeta ko va stutyah kamajetustato'nyah || 4|| yam vai vedo veda
    no naiva vishnurno va vedha no mano naiva vani | tam devesham madrishah ko'lpamedha yathatmyadvai
    vettyaho vishvanatham || 5|| yasminsarvam yastu sarvatra sarvo yo vai karta yo'vita yo'paharta | no
    yasyadiryah samastadireko no yasyanto yo'ntakrittam nato'smi || 6|| yasyaikakhya vajimedhena tulya
    yasya natya caikayalpendralakshmih | yasya stutya labhyate satyaloko yasyarcato mokshalakshmiradura
    || 7| nanyam devam vedmyaham shrimaheshannanyam devam staumi shambhorrite'ham | nanyam devam va namami
    trinetratsatyam satyam satyametanmrisha na || 8|| ittham yavatstauti shambhum maharshistavannandi
    shambhavaddrikprasadat | taddoh stambham tyaktavamshcababhashe smayam smayam brahmanebhyo namo vah
    || 9|| nandikeshvara uvaca | idam stavam mahapunyam vyasa te parikirtitam | yah pathishyati medhavi
    tasya tushyati shankarah || 10|| vyasashtakamidam pratah pathitavyam prayatnatah | duhsvapnapapashamanam
    shivasannidhyakarakam || 11|| matriha pitriha vapi goghno balaghra eva va | surapi svarnahridvapi
    nishpapo syah stuterjapat || 12|| iti shriskadapurane kashikhande purvarddhe pancanavatitama
  devanagari: व्यासकृतं शिवाष्टकस्तोत्रम् व्यास उवाच । एको रुद्रो न द्वितीयो यतस्तद्ब्रह्मैवैकं नेह नानास्ति
    किञ्चित् । यद्यप्यन्यः कोऽपि वा कुत्रचिद्वा व्याचष्टां तद्यस्य शक्तिर्मदग्रे ॥ १॥ यः क्षीराब्धेर्मन्दराघातजातो
    ज्वालामाली कालकूटोऽतिभीमः । तं सोढुं वा को परोऽभून्महेशाद्यत्कीलाभिः कृष्णतामाप विष्णुः ॥ २॥ यद्वाणोऽभूच्छ्रीपतिर्यस्य
    यन्ता लोकेशो यत्स्यन्दनं भूः समस्ता । वाहा वेदा यस्य येनेषुपाताद्दग्धा ग्रामास्त्रैपुरास्तत्समः कः
    ॥ ३॥ यं कन्दर्पो वीक्षमाणः समानं देवैरन्यैर्भस्मजातः स्वयं हि । पौष्पैर्बाणैः सर्वविश्वैकजेता को वा
    स्तुत्यः कामजेतुस्ततोऽन्यः ॥ ४॥ यं वै वेदो वेद नो नैव विष्णुर्नो वा वेधा नो मनो नैव वाणी । तं देवेशं
    मादृशः कोऽल्पमेधा याथात्म्याद्वै वेत्त्यहो विश्वनाथम् ॥ ५॥ यस्मिन्सर्वं यस्तु सर्वत्र सर्वो यो वै
    कर्ता योऽविता योऽपहर्ता । नो यस्यादिर्यः समस्तादिरेको नो यस्यान्तो योऽन्तकृत्तं नतोऽस्मि ॥ ६॥ यस्यैकाख्या
    वाजिमेधेन तुल्या यस्य नत्या चैकयाल्पेन्द्रलक्ष्मीः । यस्य स्तुत्या लभ्यते सत्यलोको यस्यार्चातो मोक्षलक्ष्मीरदूरा
    ॥ ७। नान्यं देवं वेद्म्यहं श्रीमहेशान्नान्यं देवं स्तौमि शम्भोरृतेऽहम् । नान्यं देवं वा नमामि त्रिनेत्रात्सत्यं
    सत्यं सत्यमेतन्मृषा न ॥ ८॥ इत्थं यावत्स्तौति शम्भुं महर्षिस्तावन्नन्दी शाम्भवाद्दृक्प्रसादात् । तद्दोः
    स्तम्भं त्यक्तवांश्चाबभाषे स्मायं स्मायं ब्राह्मणेभ्यो नमो वः ॥ ९॥ नन्दिकेश्वर उवाच । इदं स्तवं महापुण्यं
    व्यास ते परिकीर्तितम् । यः पठिष्यति मेधावी तस्य तुष्यति शङ्करः ॥ १०॥ व्यासाष्टकमिदं प्रातः पठितव्यं
    प्रयत्नतः । दुःस्वप्नपापशमनं शिवसान्निध्यकारकम् ॥ ११॥ मातृहा पितृहा वापि गोघ्नो बालघ्र एव वा । सुरापी
    स्वर्णहृद्वापि निष्पापो स्याः स्तुतेर्जपात् ॥ १२॥ इति श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे पञ्चनवतितमा
