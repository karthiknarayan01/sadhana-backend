id: sartham-2
category: kavacha
name:
  english: sartham
  devanagari: सार्थम्
content:
  english: ramam lakshmanapurvajam raghuvaram sitapatim sundaram kakutstham karunarnavam gunanidhim viprapriyam
    dharmikam | rajendram satyasandham dasharathatanayam shyamalam shantamurtim vande lokabhiramam raghukulatilakam
    raghavam ravanarim || 26|| ramam
  devanagari: रामं लक्ष्मणपूर्वजं रघुवरं सीतापतिं सुन्दरं काकुत्स्थं करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम्
    । राजेन्द्रं सत्यसन्धं दशरथतनयं श्यामलं शान्तमूर्तिं वन्दे लोकाभिरामं रघुकुलतिलकं राघवं रावणारिम्
    ॥ २६॥ रामं
meaning: {}
