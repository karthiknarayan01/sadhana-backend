id: shanti-mantram-dasha-shanti-mantram
category: stotram
name:
  english: Shanti Mantram (Dasha Shanti Mantram)
content:
  english: apo hishtha mayobhuvah | ta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasastasya
    bhajayate ha nah | ushatiriva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha
    ca nah | prithivi shanta sagnina shanta same shanta shucagm shamayatu | antarikshagm shanta ntadvayuna
    shanta ntanme shantagm shucagm shamayatu | dyaushshanta sadityena shanta sa me shanta shucagm shamayatu
    | prithivi shantirantarikshagm shanti shshanti rapashshanti rme astu shantih | tayahagm shantya sarvashantya
    mahya ndvipade catushpade ca shanti nkaromi shantirme astu shantih || eha shrishca hrishca dhritishca
    tapo medha pratishtha shraddha satyam dharmashcaitani mottishthanta manuttishthantu ma mag shrishca
    hrishca dhritishca tapo medha pratishtha shraddha satyam dharmashcaitani ma ma hasishuh | udayusha
    svayushodoshadinagm rasenotparjanyasya shushmenodasthamamritagm anu | taccakshur ccukramuccarat |
    pashyema sharadashshata njivema sharadashshatam nandama sharadashshata mmodama sharadashshatam bhavama
    sharadashshatagm shrinavama sharadashshatam prabravama sharadashshatamajitasyama sharadashshatam jokca
    surya ndrishe | ya udaganmahato dvibhrajamanassarirasya madhyathsama vrishabho lohitakshasuryo vipashcinmanasa
    punatu || brahmanashcotanyasi brahmana anistho brahmana avapanamasi dhariteya mprithivi brahmana mahi
    dharitamenena mahadantariksha ndadhara prithivigm sadevam ndharayani mamadvedo 'thi visrasat | medhamanishe
    mavishatagm samici bhutasya bhavyasyavarudhyai sarvamayurayani sarvamayurayani | abhirgirbhi ryadatona
    unamapyayaya harivo vardhamanah | yada stotribhyo mahi gotra rujasi bhuyishthabhajo adha te syama
    | brahma pravadishma tanno ma hasit || om shanti ntva sincami yajusha prajamayurdhana nno bhavatvaryama
    | sha nna indro brihaspatih | sha nno vishnururukramah | namo brahmane | namaste vayo | tvameva pratyaksha
    mbrahmasi | tvameva pratyaksha mbrahma vadishyami | ritam va~dishyami | satyam va~dishyami | tanmamavatu
    | tadvaktaramavatu | avatu mam | avatu vaktaram yo~ravrinimahe | gatum svastirastu nah | svastir manushebhyah
    | urdhva njigatu bheshajam | sha nno astu dvipade ncatushpade | om shanti shshantih || om saha na
    vavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvinavadhitamastu ma vidvishavahai
  devanagari: आपो॒ हिष्ठा म॑यो॒भुवः॒ । ता न॑ ऊ॒र्जे द॑धातन । म॒हेरणा॑य॒ चक्ष॑से । यो वः॑ शि॒वत॑मो॒ रस॒स्तस्य॑
    भाजयते॒ ह नः॒ । उ॒ष॒तीरि॑व मा॒तरः॑ । तस्मा॒ अर॑ङ्गमामवो॒ यस्य॒ क्षया॑य॒ जि॑न्वथ । आपो॑ ज॒नय॑था च नः
    । पृ॒थि॒वी शा॒न्ता साग्निना॑ शा॒न्ता सामे॑ शा॒न्ता शुचग्ं॑ शमयतु । अ॒न्तरि॑क्षग्ं शा॒न्त न्तद्वा॒युना॑
    शा॒न्त न्तन्मे॑ शा॒न्तग्ं शुचग्ं॑ शमयतु । द्यौश्शा॒न्ता॒ सादि॒त्येन॑ शा॒न्ता सा मे॑ शा॒न्ता शुचग्ं॑
    शमयतु । पृ॒थि॒वी शान्ति॑र॒न्तरि॑क्ष॒ग्ं॒ शान्ति॒ श्शान्ति राप॒श्शान्ति॒ र्मे अस्तु॒ शान्तिः॑ । तया॒हग्ं
    शान्॒त्या॒ स॑र्वशा॒न्त्या॒ मह्य॑ न्द्वि॒पदे॒ चतु॑ष्पदे च॒ शान्ति॑ ङ्करोमि शान्ति॑र्मे अस्तु॒ शान्तिः॑
    ॥ एह॒ श्रीश्च॒ ह्रीश्च॒ धृति॑श्च॒ तपो॑ मे॒धा प्र॑ति॒ष्ठा श्र॒द्धा स॒त्यं धर्म॑श्चै॒तानि॒ मोत्ति॑ष्ठन्त॒
    मनूत्ति॑ष्ठन्तु॒ मा मा॒ग्॒ श्रीश्च॒ ह्रीश्च॒ धृति॑श्च॒ तपो॑ मे॒धा प्र॑ति॒ष्ठा श्र॒द्धा स॒त्यं धर्म॑श्चै॒तानि॑
    मा॒ मा हा॑सिषुः । उदायु॑षा स्वा॒युषोदो॑षदीना॒ग्ं॒ रसे॒नोत्प॒र्जन्य॑स्य॒ शुष्मे॒णोदस्थाम॒मृता॒ग्ं॒
    अनु॑ । तच्चक्षु॑र् च्चु॒क्रमु॒च्चर॑त् । पश्ये॑म श॒रद॑श्श॒त ञ्जीवे॑म श॒रद॑श्श॒तं नन्दा॑म श॒रद॑श्श॒त
    म्मोदा॑म श॒रद॑श्श॒तं भवा॑म श॒रद॑श्श॒तग्ं शृ॒णवा॑म श॒रद॑श्श॒तं प्रब्र॑वाम श॒रद॑श्श॒तमजी॑तास्याम श॒रद॑श्श॒तं
    जोक्च॒ सूर्य॑ न्दृ॒शे । य उद॑गान्मह॒तो द्वि॒भ्राज॑मानस्सरि॒रस्य॒ मध्या॒थ्समा॑ वृष॒भो लो॑हिता॒क्षसूर्यो॑
    विप॒श्चिन्मन॑सा पुनातु ॥ ब्रह्म॑ण॒श्चोत॒न्यसि॒ ब्रह्म॑ण आ॒णीस्थो॒ ब्रह्म॑ण आ॒वप॑नमसि धारि॒तेय म्पृ॑थि॒वी
    ब्रह्म॑णा म॒ही धा॑रि॒तमे॑नेन म॒हदन्॒तरि॑क्ष॒ न्दाधार पृथि॒वीग्ं सदेवां॒ न्धा॑रयाणि॒ मामद्वेदो ऽथि॒
    विस्र॑सत् । मे॒धा॒म॒नी॒षे मावि॒शताग्ं स॒मीची॑ भू॒तस्य॒ भव्य॒स्याव॑रुध्यै॒ सर्व॒मायु॑रयाणि॒ सर्व॒मायु॑रयाणि
    । आ॒भिर्गी॒र्भि र्यदतो॑न ऊ॒नमाप्या॑यय हरिवो॒ वर्ध॑मानः । य॒दा स्तो॒तृभ्यो॒ महि॑ गो॒त्रा रु॒जासि॑ भूयिष्ठ॒भाजो॒
    अध॑ ते स्याम । ब्रह्म॒ प्रावा॑दिष्म॒ तन्नो॒ मा हा॑सीत् ॥ ॐ शान्ति॒ न्त्वा॑ सिञ्चामि॒ यजु॑षा प्र॒जामायु॒र्धन॑
    न्नो॑ भवत्वर्य॒मा । श न्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । श न्नो॒ विष्णु॑रुरुक्र॒मः । नमो॒ ब्रह्म॑णे । नम॑स्ते
    वायो । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वामे॒व प्र॒त्यक्ष॒ म्ब्रह्म॑ वदिष्यामि । ऋ॒तं वँ॑दिष्यामि
    । स॒त्यं वँ॑दिष्यामि । तन्माम॑वतु । तद्व॒क्तार॑मवतु । अव॑तु॒ माम् । अव॑तु व॒क्तारम् योँरावृ॑णीमहे
    । गा॒तुं स्व॒स्तिर॑स्तु नः । स्व॒स्तिर् मानु॑षेभ्यः । ऊ॒र्ध्व ञ्जि॑गातु भेष॒जम् । श न्नो॑ अस्तु द्वि॒पदे
    ञ्चतु॒ष्पदे । ॐ शान्ति॒ श्शान्तिः॑ ॥ ॐ स॒ह ना॑ ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒वधी॑तमस्तु॒
    मा वि॑द्विषा॒वहै
