id: bhagya-suktam
category: stotram
name:
  english: Bhagya Suktam
content:
  english: mpratarindragm havamahe pratarmitra varuna pratarashvina ssomamuta rudragm huvema || mbhagamugragm
    huvema vaya mputramaditeryo vidharta | addhrashcidya mmanyamanasturashcidraja cidya || bhaga pranetarbhaga
    satyaradho bhagema ndhiyamudavadadannah | bhagaprano janaya gobhirashvairbhagapranribhirnrivantassyama
    || mbhagavantassyamota prapitva uta madhye ahna m | utodita maghavan ndevanagm sumatau syama || ||
    bhaga eva bhagavagm astu devastena vaya mbhagavantassyama | ta ntva bhaga sarva ijjohavimi sano bhaga
    pura eta bhaveha || 'namanta dadhikraveva shucaye padaya | arvacinam 'shvavajina avahantu || || ashvavatirgomatirna
    ushaso viravatissadamucchantu bhadrah | ghrita nduhana vishvatah prapina yuya mpata svastibhissada
    nah || 'gne bhaginagm santamathabhaga ncikirishati | abhagamagne ta nkuru mamagne bhagina
  devanagari: म्प्रा॒तरिन्द्रग्ं॑ हवामहे प्रा॒तर्मि॒त्रा वरु॑णा प्रा॒तर॒श्विना स्सोम॑मु॒त रु॒द्रग्ं हु॑वेम
    ॥ म्भ॑गमु॒ग्रग्ं हु॑वेम व॒य म्पु॒त्रमदि॑ते॒र्यो वि॑ध॒र्ता । आ॒द्ध्रश्चि॒द्य म्मन्य॑मानस्तु॒रश्चि॒द्राजा॑
    चि॒द्य ॥ भग॒ प्रणे॑त॒र्भग॒ सत्य॑राधो॒ भगे॒मा न्धिय॒मुद॑व॒दद॑न्नः । भग॒प्रणो॑ जनय॒ गोभि॒रश्वै॒र्भग॒प्रनृभि॑र्नृ॒वन्त॑स्स्याम
    ॥ म्भग॑वन्तस्स्यामो॒त प्रपि॒त्व उ॒त मध्ये॒ अह्ना म् । उ॒तोदि॑ता मघव॒न् न्दे॒वानाग्ं॑ सुम॒तौ स्या॑म
    ॥ ॥ भग॑ ए॒व भग॑वाग्ं अस्तु देवा॒स्तेन॑ व॒य म्भग॑वन्तस्स्याम । त न्त्वा॑ भग॒ सर्व॒ इज्जो॑हवीमि॒ सनो॑
    भग पुर ए॒ता भ॑वेह ॥ ऽनमन्त दधि॒क्रावे॑व॒ शुचये॑ प॒दाय॑ । अ॒र्वा॒ची॒नं ऽश्वा॑वा॒जिन॒ आव॑हन्तु ॥ ॥ अश्वा॑वती॒र्गोम॑तीर्न
    उ॒षासो॑ वी॒रव॑ती॒स्सद॑मुच्छन्तु भ॒द्राः । घृ॒त न्दुहा॑ना वि॒श्वतः॒ प्रपी॑ना यू॒य म्पा॑त स्व॒स्तिभि॒स्सदा॑
    नः ॥ ऽग्ने भा॒गिनग्ं॑ स॒न्तमथा॑भा॒ग॑ ञ्चिकी॑ऋषति । अभा॒गम॑ग्ने॒ त ङ्कु॑रु॒ माम॑ग्ने भा॒गिन॑
