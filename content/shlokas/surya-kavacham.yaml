id: surya-kavacham
category: stotram
name:
  english: Surya Kavacham
content:
  english: shribhairava uvaca yo devadevo bhagavan bhaskaro mahasam nidhih | gayatrinayako bhasvan saviteti
    pragiyate || || tasyaham kavacam divyam vajrapanjarakabhidham | sarvamantramayam guhyam mulavidyarahasyakam
    || || sarvapapapaham devi duhkhadaridryanashanam | mahakushthaharam punyam sarvaroganivarhanam ||
    || sarvashatrusamuhaghnam samgrame vijayapradam | sarvatejomayam sarvadevadanavapujitam || || rane
    rajabhaye ghore sarvopadravanashanam | matrikaveshtitam varma bhairavanananirgatam || || grahapidaharam
    devi sarvasankatanashanam | dharanadasya deveshi brahma lokapitamahah || || vishnurnarayano devi rane
    daityanjishyati | shankarah sarvalokesho vasavo'pi divaspatih || || oshadhishah shashi devi shivo'ham
    bhairaveshvarah | mantratmakam param varma savituh saramuttamam || || yo dharayed bhuje murdhni ravivare
    maheshvari | sa rajavallabho loke tejasvi vairimardanah || || bahunoktena kim devi kavacasyasya dharanat
    | iha lakshmidhanarogya vriddhirbhavati nanyatha || || paratra parama muktirdevanamapi durlabha |
    kavacasyasya deveshi mulavidyamayasya ca || || vajrapanjarakakhyasya munirbrahma samiritah | gayatryam
    chanda ityuktam devata savita smritah || || maya bijam sharat shaktirnamah kilakamishvari | sarvarthasadhane
    devi viniyogah prakirtitah || || atha surya kavacam om am am im im shirah patu om suryo mantravigrahah
    | um um rim rim lalatam me hram ravih patu cinmayah || lum em aim patu netre hrim mamarunasarathih
    | om aum am ah shruti patu sah sarvajagadishvarah || || kam kham gam gham patu gandau sum surah surapujitah
    | cam cham jam jham ca nasam me patu yaram aryama prabhuh || || tam tham dam dham mukham payad yam
    yogishvarapujitah | tam tham dam dham galam patu nam narayanavallabhah || || pam pham bam bham mama
    skandhau patu mam mahasam nidhih | yam ram lam vam bhujau patu mulam sakanayakah || || sham sham sam
    ham patu vaksho mulamantramayo dhruvah | lam kshah kukshsim sada patu grahatho dineshvarah || || nam
    nam nam nam mam me patu prishtham divasanayakah | am am im im um um rim rim nabhim patu tamopahah
    || lum em aim om aum am ah lingam me'vyad graheshvarah | kam kham gam gham cam cham jam jham katim
    bhanurmamavatu || || tam tham dam dham tam tham dam dham janu bhasvan mamavatu | pam pham bam bham
    yam ram lam vam janghe me'vyad vibhakarah || || sham sham sam ham lam kshah patu mulam padau trayitanuh
    | nam nam nam nam mam me patu savita sakalam vapuh || || somah purve ca mam patu bhaumo'gnau mam sadavatu
    | budho mam dakshine patu nairitya gurareva mam || || pashcime mam sitah patu vayavyam mam shanaishcarah
    | uttare mam tamah payadaishanyam mam shikhi tatha || || urdhvam mam patu mihiro mamadhastanjagatpatih
    | prabhate bhaskarah patu madhyahne mam dineshvarah || || sayam vedapriyah patu nishithe visphurapatih
    | sarvatra sarvada suryah patu mam cakranayakah || || rane rajakule dyute vidade shatrusankate | sangame
    ca jvare roge patu mam savita prabhuh || || om om om uta omuaum ha sa ma yah suro'vatanmam bhayad
    hram hrim hrum hahaha hasauh hasahasauh hamso'vatat sarvatah | sah sah sah sasasa nripadvanacaraccauradranat
    sankatat payanmam kulanayako'pi savita om hrim ha sauh sarvada || || dram drim drum dadhanam tatha
    ca taranirbhambhairbhayad bhaskaro ram rim rum rururum ravirjvarabhayat kushthacca shulamayat | am
    am am vivivim mahamayabhayam mam patu martandako mulavyaptatanuh sadavatu param hamsah sahasramshuman
    || || atha phalashritih iti shrikavacam divyam vajrapanjarakabhidham | sarvadevarahasyam ca matrikamantraveshtitam
    || || maharogabhayaghnam ca papaghnam manmukhoditam | guhyam yashaskaram punyam sarvashreyaskaram
    shive || || likhitva ravivare tu tishye va janmabhe priye | ashtagandhena divyena sudhakshirena parvati
    || || arkakshirena punyena bhurjatvaci maheshvari | kanakikashthalekhanya kavacam bhaskarodaye ||
    || shvetasutrena raktena shyamenaveshtayed gutim | sauvarnenatha samveshthya dharayenmurdhni va bhuje
    || || rane ripunjayed devi vade sadasi jeshyati | rajamanyo bhavennityam sarvatejomayo bhavet || ||
    kanthastha putrada devi kukshistha roganashini | shirahstha gutika divya rakalokavashankari || ||
    bhujastha dhanada nityam tejobuddhivivardhini | vandhya va kakavandhya va mritavatsa ca yangana ||
    || kanthe sa dharayennityam bahuputra prajayaye | yasya dehe bhavennityam gutikaisha maheshvari ||
    || mahastranindramuktani brahmastradini parvati | taddeham prapya vyarthani bhavishyanti na samshayah
    || || trikalam yah pathennityam kavacam vajrapanjaram | tasya sadyo mahadevi savita varado bhavet
    || || ajnatva kavacam devi pujayed yastrayitanum | tasya pujarjitam punyam janmakotishu nishphalam
    || || shatavartam pathedvarma saptamyam ravivasare | mahakushthardito devi mucyate natra samshayah
    || || nirogo yah pathedvarma daridro vajrapanjaram | lakshmivanjayate devi sadyah suryaprasadatah
    || || bhaktya yah prapathed devi kavacam pratyaham priye | iha loke shriyam bhuktva dehante muktimapnuyat
    || || iti shrirudrayamale tantre shridevirahasye vajrapanjarakhyasuryakavacanirupanam trayastrimshah
    patalah ||
  devanagari: श्रीभैरव उवाच यो देवदेवो भगवान् भास्करो महसां निधिः । गयत्रीनायको भास्वान् सवितेति प्रगीयते
    ॥ ॥ तस्याहं कवचं दिव्यं वज्रपञ्जरकाभिधम् । सर्वमन्त्रमयं गुह्यं मूलविद्यारहस्यकम् ॥ ॥ सर्वपापापहं
    देवि दुःखदारिद्र्यनाशनम् । महाकुष्ठहरं पुण्यं सर्वरोगनिवर्हणम् ॥ ॥ सर्वशत्रुसमूहघ्नं सम्ग्रामे विजयप्रदम्
    । सर्वतेजोमयं सर्वदेवदानवपूजितम् ॥ ॥ रणे राजभये घोरे सर्वोपद्रवनाशनम् । मातृकावेष्टितं वर्म भैरवानननिर्गतम्
    ॥ ॥ ग्रहपीडाहरं देवि सर्वसङ्कटनाशनम् । धारणादस्य देवेशि ब्रह्मा लोकपितामहः ॥ ॥ विष्णुर्नारायणो देवि
    रणे दैत्याञ्जिष्यति । शङ्करः सर्वलोकेशो वासवोऽपि दिवस्पतिः ॥ ॥ ओषधीशः शशी देवि शिवोऽहं भैरवेश्वरः
    । मन्त्रात्मकं परं वर्म सवितुः सारमुत्तमम् ॥ ॥ यो धारयेद् भुजे मूर्ध्नि रविवारे महेश्वरि । स राजवल्लभो
    लोके तेजस्वी वैरिमर्दनः ॥ ॥ बहुनोक्तेन किं देवि कवचस्यास्य धारणात् । इह लक्ष्मीधनारोग्य वृद्धिर्भवति
    नान्यथा ॥ ॥ परत्र परमा मुक्तिर्देवानामपि दुर्लभा । कवचस्यास्य देवेशि मूलविद्यामयस्य च ॥ ॥ वज्रपञ्जरकाख्यस्य
    मुनिर्ब्रह्मा समीरितः । गायत्र्यं छन्द इत्युक्तं देवता सविता स्मृतः ॥ ॥ माया बीजं शरत् शक्तिर्नमः
    कीलकमीश्वरि । सर्वार्थसाधने देवि विनियोगः प्रकीर्तितः ॥ ॥ अथ सूर्य कवचं ॐ अं आं इं ईं शिरः पातु ॐ
    सूर्यो मन्त्रविग्रहः । उं ऊं ऋं ॠं ललाटं मे ह्रां रविः पातु चिन्मयः ॥ लूं एं ऐं पातु नेत्रे ह्रीं
    ममारुणसारथिः । ॐ औं अं अः श्रुती पातु सः सर्वजगदीश्वरः ॥ ॥ कं खं गं घं पातु गण्डौ सूं सूरः सुरपूजितः
    । चं छं जं झं च नासां मे पातु यारं अर्यमा प्रभुः ॥ ॥ टं ठं डं ढं मुखं पायाद् यं योगीश्वरपूजितः । तं
    थं दं धं गलं पातु नं नारायणवल्लभः ॥ ॥ पं फं बं भं मम स्कन्धौ पातु मं महसां निधिः । यं रं लं वं भुजौ
    पातु मूलं सकनायकः ॥ ॥ शं षं सं हं पातु वक्षो मूलमन्त्रमयो ध्रुवः । लं क्षः कुक्ष्सिं सदा पातु ग्रहाथो
    दिनेश्वरः ॥ ॥ ङं ञं णं नं मं मे पातु पृष्ठं दिवसनायकः । अं आं इं ईं उं ऊं ऋं ॠं नाभिं पातु तमोपहः
    ॥ लूं एं ऐं ॐ औं अं अः लिङ्गं मेऽव्याद् ग्रहेश्वरः । कं खं गं घं चं छं जं झं कटिं भानुर्ममावतु ॥ ॥
    टं ठं डं ढं तं थं दं धं जानू भास्वान् ममावतु । पं फं बं भं यं रं लं वं जङ्घे मेऽव्याद् विभाकरः ॥ ॥
    शं षं सं हं लं क्षः पातु मूलं पादौ त्रयितनुः । ङं ञं णं नं मं मे पातु सविता सकलं वपुः ॥ ॥ सोमः पूर्वे
    च मां पातु भौमोऽग्नौ मां सदावतु । बुधो मां दक्षिणे पातु नैऋत्या गुररेव माम् ॥ ॥ पश्चिमे मां सितः पातु
    वायव्यां मां शनैश्चरः । उत्तरे मां तमः पायादैशान्यां मां शिखी तथा ॥ ॥ ऊर्ध्वं मां पातु मिहिरो मामधस्ताञ्जगत्पतिः
    । प्रभाते भास्करः पातु मध्याह्ने मां दिनेश्वरः ॥ ॥ सायं वेदप्रियः पातु निशीथे विस्फुरापतिः । सर्वत्र
    सर्वदा सूर्यः पातु मां चक्रनायकः ॥ ॥ रणे राजकुले द्यूते विदादे शत्रुसङ्कटे । सङ्गामे च ज्वरे रोगे
    पातु मां सविता प्रभुः ॥ ॥ ॐ ॐ ॐ उत ॐउऔं ह स म यः सूरोऽवतान्मां भयाद् ह्रां ह्रीं ह्रुं हहहा हसौः हसहसौः
    हंसोऽवतात् सर्वतः । सः सः सः सससा नृपाद्वनचराच्चौराद्रणात् सङ्कटात् पायान्मां कुलनायकोऽपि सविता ॐ
    ह्रीं ह सौः सर्वदा ॥ ॥ द्रां द्रीं द्रूं दधनं तथा च तरणिर्भाम्भैर्भयाद् भास्करो रां रीं रूं रुरुरूं
    रविर्ज्वरभयात् कुष्ठाच्च शूलामयात् । अं अं आं विविवीं महामयभयं मां पातु मार्तण्डको मूलव्याप्ततनुः
    सदावतु परं हंसः सहस्रांशुमान् ॥ ॥ अथ फलशृतिः इति श्रीकवचं दिव्यं वज्रपञ्जरकाभिधम् । सर्वदेवरहस्यं
    च मातृकामन्त्रवेष्टितम् ॥ ॥ महारोगभयघ्नं च पापघ्नं मन्मुखोदितम् । गुह्यं यशस्करं पुण्यं सर्वश्रेयस्करं
    शिवे ॥ ॥ लिखित्वा रविवारे तु तिष्ये वा जन्मभे प्रिये । अष्टगन्धेन दिव्येन सुधाक्षीरेण पार्वति ॥ ॥
    अर्कक्षीरेण पुण्येन भूर्जत्वचि महेश्वरि । कनकीकाष्ठलेखन्या कवचं भास्करोदये ॥ ॥ श्वेतसूत्रेण रक्तेन
    श्यामेनावेष्टयेद् गुटीम् । सौवर्णेनाथ संवेष्ठ्य धारयेन्मूर्ध्नि वा भुजे ॥ ॥ रणे रिपूञ्जयेद् देवि वादे
    सदसि जेष्यति । राजमान्यो भवेन्नित्यं सर्वतेजोमयो भवेत् ॥ ॥ कण्ठस्था पुत्रदा देवि कुक्षिस्था रोगनाशिनी
    । शिरःस्था गुटिका दिव्या राकलोकवशङ्करी ॥ ॥ भुजस्था धनदा नित्यं तेजोबुद्धिविवर्धिनी । वन्ध्या वा काकवन्ध्या
    वा मृतवत्सा च याङ्गना ॥ ॥ कण्ठे सा धारयेन्नित्यं बहुपुत्रा प्रजायये । यस्य देहे भवेन्नित्यं गुटिकैषा
    महेश्वरि ॥ ॥ महास्त्राणीन्द्रमुक्तानि ब्रह्मास्त्रादीनि पार्वति । तद्देहं प्राप्य व्यर्थानि भविष्यन्ति
    न संशयः ॥ ॥ त्रिकालं यः पठेन्नित्यं कवचं वज्रपञ्जरम् । तस्य सद्यो महादेवि सविता वरदो भवेत् ॥ ॥ अज्ञात्वा
    कवचं देवि पूजयेद् यस्त्रयीतनुम् । तस्य पूजार्जितं पुण्यं जन्मकोटिषु निष्फलम् ॥ ॥ शतावर्तं पठेद्वर्म
    सप्तम्यां रविवासरे । महाकुष्ठार्दितो देवि मुच्यते नात्र संशयः ॥ ॥ निरोगो यः पठेद्वर्म दरिद्रो वज्रपञ्जरम्
    । लक्ष्मीवाञ्जायते देवि सद्यः सूर्यप्रसादतः ॥ ॥ भक्त्या यः प्रपठेद् देवि कवचं प्रत्यहं प्रिये । इह
    लोके श्रियं भुक्त्वा देहान्ते मुक्तिमाप्नुयात् ॥ ॥ इति श्रीरुद्रयामले तन्त्रे श्रीदेविरहस्ये वज्रपञ्जराख्यसूर्यकवचनिरूपणं
    त्रयस्त्रिंशः पटलः ॥
