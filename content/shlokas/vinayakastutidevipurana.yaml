id: vinayakastutidevipurana
category: stotram
name:
  english: vinayakastutidevipurana
  devanagari: विनायकस्तुतिदेवीपुराण
content:
  english: vibhrantam vitatantam tasmai namami satatam jagato hitaya vighneshvaraya varadaya varapradaya
    || 8|| vamaikahastasatatam kritaladdukaya siddharthakam surabhigandhavilepanaya | brahmendracandravasushankarasamstutaya
    gangajalaugha iva danamahapradaya || 9|| iccharthamihitaphalapradaya shivaya sampujayasva mama devashubham
    shubhaya | vighnam vinashaya prabho surasiddhashatrum shakrasya vyadhitadivasya shubham prayaccha
    || 10|| stutva tu shaktitanayam prayatena vishno stushtah samihitavaram dadate ca tasya | vishnostavarthamidam
    shailavaram harena sampreshito ripuharaya purandarasya || 11|| mayocyatam vada bhavan kimaham karomi
    trailokyanirjitaripum tvamaham dadami | stutvaivam tada devam vishnuna prabhavishnuna tutushta varadibhuto
    vighnasya nidhanaya ca || 12|| iti shridevipurane vinayakastavo nama trayodashadhikashatatamo'dhyayah
    || 113||
  devanagari: विभ्रान्तं वितातन्तं तस्मै नमामि सततं जगतो हिताय विघ्नेश्वराय वरदाय वरप्रदाय ॥ ८॥ वामैकहस्तसततं
    कृतलड्डुकाय सिद्धार्थकं सुरभिगन्धविलेपनाय । ब्रह्मेन्द्रचन्द्रवसुशङ्करसंस्तुताय गङ्गाजलौघ इव दानमहाप्रदाय
    ॥ ९॥ इच्छार्थमीहितफलप्रदाय शिवाय सम्पूजयस्व मम देवशुभं शुभाय । विघ्नं विनाशाय प्रभो सुरसिद्धशत्रुं
    शक्रस्य व्याधितदिवस्य शुभं प्रयच्छ ॥ १०॥ स्तुत्वा तु शक्तितनयं प्रयतेन विष्णो स्तुष्टः समीहितवरं ददते
    च तस्य । विष्णोस्तवार्थमिदं शैलवरं हरेण सम्प्रेषितो रिपुहराय पुरन्दरस्य ॥ ११॥ मयोच्यतां वद भवान् किमहं
    करोमि त्रैलोक्यनिर्जितरिपुं त्वमहं ददामि । स्तुत्वैवं तदा देवं विष्णुना प्रभविष्णुना तुतुष्ट वरदीभूतो
    विघ्नस्य निधनाय च ॥ १२॥ इति श्रीदेवीपुराणे विनायकस्तवो नाम त्रयोदशाधिकशततमोऽध्यायः ॥ ११३॥
