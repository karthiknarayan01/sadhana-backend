id: brahmakritam10vishnustotram
category: stotram
name:
  english: brahmakritam10vishnustotram
  devanagari: ब्रह्मकृतं१०विष्णुस्तोत्रम्
content:
  english: brahmakritam 10 vishnustotram brahmovaca | ajatajanmasthitisamyamayagunayanirvanasukharnavaya
    | anoranimne'pariganyadhamne mahanubhavaya namo namaste || 8|| rupam tavaitatpurusharshabhejyam shreyo'rthibhirvaidikatantrikena
    | yogena dhatah saha nastrilokan pashyamyamushminnu ha vishvamurtau || 9|| tvayyagra asittvayi madhya
    asittvayyanta asididamatmatantre | tvamadiranto jagato'sya madhyam ghatasya mritsneva parah parasmat
    || 10|| tvam mayaya''tma''shrayaya svayedam nirmaya vishvam tadanupravishtah | pashyanti yukta manasa
    manishino gunavyavaye'pyagunam vipashcitah || 11|| yathagnimedhasyamritam ca goshu bhuvyannamambudyamane
    ca vrittim | yogairmanushya adhiyanti hi tvam guneshu buddhya kavayo vadanti || 12|| tam tvam vayam
    natha samujjihanam sarojanabhaticirepsitartham | drishtva gata nirvritamadya sarve gaja davarta iva
    gangamambhah || 13|| sa tvam vidhatsvakhilalokapala vayam yadarthastava padamulam | samagataste bahirantaratman
    kim vanyavijnapyamasheshasakshinah || 14|| aham giritrashca suradayo ye dakshadayo'gneriva ketavaste
    | kim va vidamesha prithagvibhata vidhatsva sham no dvijadevamantram || 15|| iti shrimadbhagavatamahapurane
    ashtamaskandhe shashthadhyayantargatam brahmakritam vishnustotram samaptam | bhagavatapurana | adhyaya
    8
  devanagari: ब्रह्मकृतं १० विष्णुस्तोत्रम् ब्रह्मोवाच । अजातजन्मस्थितिसंयमायागुणायनिर्वाणसुखार्णवाय ।
    अणोरणिम्नेऽपरिगण्यधाम्ने महानुभावाय नमो नमस्ते ॥ ८॥ रूपं तवैतत्पुरुषर्षभेज्यं श्रेयोऽर्थिभिर्वैदिकतान्त्रिकेण
    । योगेन धातः सह नस्त्रिलोकान् पश्याम्यमुष्मिन्नु ह विश्वमूर्तौ ॥ ९॥ त्वय्यग्र आसीत्त्वयि मध्य आसीत्त्वय्यन्त
    आसीदिदमात्मतन्त्रे । त्वमादिरन्तो जगतोऽस्य मध्यं घटस्य मृत्स्नेव परः परस्मात् ॥ १०॥ त्वं माययाऽऽत्माऽऽश्रयया
    स्वयेदं निर्माय विश्वं तदनुप्रविष्टः । पश्यन्ति युक्ता मनसा मनीषिणो गुणव्यवायेऽप्यगुणं विपश्चितः ॥
    ११॥ यथाग्निमेधस्यमृतं च गोषु भुव्यन्नमम्बूद्यमने च वृत्तिम् । योगैर्मनुष्या अधियन्ति हि त्वां गुणेषु
    बुद्ध्या कवयो वदन्ति ॥ १२॥ तं त्वां वयं नाथ समुज्जिहानं सरोजनाभातिचिरेप्सितार्थम् । दृष्ट्वा गता निर्वृतमद्य
    सर्वे गजा दवार्ता इव गाङ्गमम्भः ॥ १३॥ स त्वं विधत्स्वाखिललोकपाला वयं यदर्थास्तव पादमूलम् । समागतास्ते
    बहिरन्तरात्मन् किं वान्यविज्ञाप्यमशेषसाक्षिणः ॥ १४॥ अहं गिरित्रश्च सुरादयो ये दक्षादयोऽग्नेरिव केतवस्ते
    । किं वा विदामेश पृथग्विभाता विधत्स्व शं नो द्विजदेवमन्त्रम् ॥ १५॥ इति श्रीमद्भागवतमहापुराणे अष्टमस्कन्धे
    षष्ठाध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय ८
