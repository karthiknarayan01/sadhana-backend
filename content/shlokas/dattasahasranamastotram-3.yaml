id: dattasahasranamastotram-3
category: sahasranama
name:
  english: dattasahasranamastotram 3
  devanagari: दत्तसहस्रनामस्तोत्रम् ३
content:
  english: prajahitah sarvahita anindyo lokavanditah || 47|| akuncayogasambaddhamalamutrarasadikah | kanakibhutamalavan
    rajayogavicakshanah || 48|| shakatadivisheshajno lambikanititatparah | prapancarupi balavan ekakaupinavastrakah
    || 49|| digambarah sottariyah sajatah sakamandaluh | nirdandashcasidandashva striveshah purushakritih
    || 50|| tulasikashthamali ca raudrah sphatikamalikah | nirmalikah shuddhatarah sveccha amaravan parah
    || 51|| urdhvapundrastripundranko dvandvahinah sunirmalah | nirjatah sujato heyo bhasmashayi subhogavan
    || 52|| mutrasparsho malasparshojatihinah sujatikah | abhakshyabhaksho nirbhaksho jagadvanditadehavan
    || 53|| bhushano dushanasamah kalakalo dayanidhih | balapriyo balarucirbalavanatibalakah || 54|| balakrido
    balarato balasanghavrito bali | balalilavinodashca karnakarshanakarakah || 55|| krayanitavanikpanyo
    gudasupadibhakshakah | balavadgitahrishtashca mushtiyuddhakarashcalah || 56|| adrishyo drishyamanashca
    dvandvayuddhapravartakah | palayamano baladhyo balahasah susangatah || 57|| pratyagatah punargacchaccakravadgamanakulah
    | coravaddhritasarvasvo janata''rtikadehavan || 58|| prahasanpravadandatto divyamangalavigrahah |
    mayabalashca mayavi purnalilo munishvarah || 59|| mahuresho vishuddhatma yashasvi kirtiman yuva |
    savikalpah saccidabho gunavan saumyabhavanah || 60|| pinaki shashimauli ca vasudevo divaspatih | sushirah
    suryatejashca shrigambhiroshtha unnatih || 61|| dashapadma trishirshashca tribhirvyapto dvishuklavan
    | trisamashca tritatmashca trilokashca tryambakah || 62|| caturdvandvastriyavanastrikamo hamsavahanah
    | catushkalashcaturdamshtro gatih shambhuh priyananah || 63|| caturmatirmahadamshtro vedangi caturananah
    | pancashuddho mahayogi mahadvadashavanakah || 64|| caturmukho naratanurajeyashcashtavamshavan | caturdashasamadvandvo
    mukuranko dashamshavan || 65|| vrishanko vrishabharudhashcandratejah sudarshanah | samapriyo maheshanashcidakaroh
    narottamah || 66|| dayavan karunapurno mahendro mahureshvarah | virasanasamasino ramo ramaparayanah
    || 67|| indro vahniryamah kalo nirritirvaruno yamah | vayushca rudrashceshano lokapalo mahayashah
    || 68|| yakshagandharvanagashca kinnarah shuddharupakah | vidyadharashcahipatishcaranah pannageshvarah
    || 69|| candikeshah pracandashca ghantanadaratah priyah | vinadhvanirvainateyo naradastumbarurharah
    || 70|| vinapracandasaundaryo rajivakshashca manmathah | candro divakaro gopah kesari somasodarah
    || 71|| sanakah shukayogi ca nandi shanmukharagakah | ganesho vighnarajashca candrabho vijayo jayah
    || 72|| atitakalacakrashca tamasah kaladandavan | vishnucakrah trishulendro brahmadando viruddhakah
    || 73|| brahmastrarupah satyendrah kirtimangopatirbhavah | vasishtho vamadevashca jabali kanvarupakah
    || 74|| samvartarupo maudgalyo markandeyashca kashyapah | trijato gargyarupi ca vishanatho mahodayah
    || 75|| tvashta nishakarah karmakashyapashca trirupavan | jamadagnih sarvarupah sarvanado yatishvarah
    || 76|| ashvarupi vaidyapatirgarakantho'mbikarcitah | cintamanih kalpavriksho ratnadrirudadhipriyah
    || 77|| mahamandukarupi ca kalagnisamavigrahah | adharashaktirupi ca kurmah pancagnirupakah || 78||
    kshirarnavo maharupi varahashca dhritavanih | airavato janah padmo vamanah kumudatmavan || 79|| pundarikah
    pushpadanto meghacchanno'bhracarakah | sitotpalabho dyutiman dridhoraskah surarcitah || 80|| padmanabhah
    sunabhashca dashashirshah shatodarah | avanmukho pancavaktro rakshakhyatma dvirupakah || 81|| svarnamandalasancari
    vedisthah sarvapujitah | svaprasannah prasannatma svabhaktabhimukho mriduh || 82|| avahitah sannihito
    varado jnanivatsthitah | shaligramatmako dhyato ratnasimhasanasthitah || 83|| arghyapriyah padyatushtashcacamyarcitapadukah
    | pancamritah snanavidhih shuddhodakasusancitah || 84|| gandhakshatasusampritah pushpalankarabhushanah
    | angapujapriyah sarvo mahakirtirmahabhujah || 85|| namapujavisheshajnah sarvanamasvarupakah | dhupito
    divyadhupatma dipito bahudipavan || 86|| bahunaivedyasamhrishto nirajanavirajitah | sarvatiranjitanandah
    saukhyavan dhavalarjunah || 87|| virago nirviragashca yajnarcango vibhutikah | unmatto bhrantacittashca
    shubhacittah shubhahutih || 88|| surairishto laghishtashca bamhishtho bahudayakah | mahishthah sumahaujashca
    balishthah supratishthitah || 89|| kashigangambumajjashca kulashrimantrajapakah | cikuranvitabhalashca
    sarvangaliptabhutikah || 90|| anadinidhano jyotibhargavadyah sanatanah | tapatrayopashamano manavaso
    mahodayah || 91|| jyeshthah shreshtho maharaudrah kalamurtih sunishcayah | urdhvah samurdhvalingashca
    hiranyo hemalingavan || 92|| suvarnah svarnalingashca divyasutirdivaspatih | divyalingo bhavo bhavyah
    sarvalingastu sarvakah || 93|| shivalingah shivo mayo jvalastujjvalalingavan | atma caivatmalingashca
    paramo lingaparagah || 94|| somah suryah sarvalingah paniyantrapavitravan | sadyojato taporupo bhavodbhava
    anishvarah || 95|| tatsavidrupasavita varenyashca pracodayat | duradrishtirduragato durashravanatarpitah
    || 96|| yogapithasthito vidvan namaskaritarasabhah | namatkritashunashcapi vajrakashtyatibhishanah
    || 97|| jvalanmukhah prativina sakhadgo dravitaprajah | pashughnashca rasonmatto rasordhvamukharanjitah
    || 98|| rasapriyo rasatma ca rasarupi raseshvarah | rasadhidaivato bhaumo rasango rasabhavanah ||
    99|| rasonmayo rasakaro rasendro rasapujakah | rasasiddhah siddharaso rasadravyo rasonmukhah || 100||
    rasankito rasapurno rasado rasiko rasi | gandhakadastalakado gaurahsphatikasevanah || 101|| karyasiddhah
    karyarucirbahukaryo na karyavan | abhedi janakarta ca shankhacakragadadharah || 102|| krishnajinakiriti
    ca shrikrishnajinakancukah | mrigayayi mrigendrashca gajarupi gajeshvarah || 103|| dridhavratah satyavadi
    kritajno balavanbalah | gunavan karyavan dantah kritashobho durasadah || 104|| sukalo bhutanihitah
    samarthashcandanayakah | sampurnadrishtirakshubdho janaikapriyadarshanah || 105|| niyatatma padmadharo
    brahmavamshcanasuyakah | uncchavrittiranishashca rajabhogi sumalikah || 106|| sukumaro jarahine coraghno
    manjulakshanah | supadah svangulikashca sujanghah shubhajanukah || 107|| shubhoruh shubhalingashca
    sunabho jaghanottamah | suparshvah sustano nilah suvakshashca sujatrukah || 108|| nilagrivo mahaskandhah
    subhujo divyajanghakah | suhastarekho lakshmivan dirghaprishtho yatishcalah || 109|| bimboshthah shubhadantashca
    vidyujjihvah sutalukah | dirghanasah sutamrakshah sukapolah sukarnakah || 110|| nimilitonmilitashca
    vishalakshashca shubhrakah | shubhamadhyah subhalashca sushira nilaromakah || 111|| vishishtagramaniskandhah
    shikhivarno vibhavasuh | kailasesho vicitrajno vaikunthendro vicitravan || 112|| manasendrashcakravalo
    mahendro mandaradhipah | malayo vindhyarupashca himavan merurupakah || 113|| suvesho navyarupatma
    mainako gandhamadanah | simhalashcaiva vedadrih shrishailah krakacatmakah || 114|| nanacalashcitrakuto
    durvasah parvatatmajah | yamunakrishnavenisho bhadresho gautamipatih || 115|| godavarisho gangatma
    shonakah kaushikipatih | narmadeshastu kaveritamraparnishvaro jati || 116|| saridrupa nadatma ca samudrah
    saridishvarah | hradinishah pavanisho nalinishah sucakshuman || 117|| sitanadipatih sindhurevesho
    muralipatih | lavanekshuh kshiranidhih surabdhih sarpirambudhih || 118|| dayabdhishuddhajaladhistatvaropo
    dhanadhipah | bhupalamadhuragajno malatiragakovidah || 119|| paundrakriyajnah shrirago nanaragarnavantakah
    | vedadirupo hrirupo klamrupah klimvikarakah || 120|| vrummayah klimmayah prakhyo hummayah krommayo
    bhatah | dhrimayo lungmayo gango ghammayo khammayo khagah || 121|| khammayo jnammayashcango bijango
    bijajammayah | jhamnkarashtankarahshtango dankari thankaro'nukah || 122|| tankrarasthankarastungo
    drammudrarupakah sudah | daksho dandi danavaghno apratidvandvavamadah || 123|| dhamrupo namsvarupashca
    pankajakshashca phammayah | mahendro madhubhokta ca mandaretastu bhammayah || 124|| rammayo rinkaro
    rango lankarah vammayah sharah | ram
  devanagari: प्रजाहितः सर्वहित अनिन्द्यो लोकवन्दितः ॥ ४७॥ आकुञ्चयोगसम्बद्धमलमूत्ररसादिकः । कनकीभूतमलवान्
    राजयोगविचक्षणः ॥ ४८॥ शकटादिविशेषज्ञो लम्बिकानीतितत्परः । प्रपञ्चरूपी बलवान् एककौपीनवस्त्रकः ॥ ४९॥
    दिगम्बरः सोत्तरीयः सजटः सकमण्डलुः । निर्दण्डश्चासिदण्डश्व स्त्रीवेषः पुरुषाकृतिः ॥ ५०॥ तुलसीकाष्ठमाली
    च रौद्रः स्फटिकमालिकः । निर्मालिकः शुद्धतरः स्वेच्छा अमरवान् परः ॥ ५१॥ ऊर्ध्वपुण्ड्रस्त्रिपुण्ड्राङ्को
    द्वन्द्वहीनः सुनिर्मलः । निर्जटः सुजटो हेयो भस्मशायी सुभोगवान् ॥ ५२॥ मूत्रस्पर्शो मलस्पर्शोजातिहीनः
    सुजातिकः । अभक्ष्याभक्षो निर्भक्षो जगद्वन्दितदेहवान् ॥ ५३॥ भूषणो दूषणसमः कालाकालो दयानिधिः । बालप्रियो
    बालरुचिर्बालवानतिबालकः ॥ ५४॥ बालक्रीडो बालरतो बालसङ्घवृतो बली । बाललीलाविनोदश्च कर्णाकर्षणकारकः ॥
    ५५॥ क्रयानीतवणिक्पण्यो गुडसूपादिभक्षकः । बालवद्गीतहृष्टश्च मुष्टियुद्धकरश्चलः ॥ ५६॥ अदृश्यो दृश्यमानश्च
    द्वन्द्वयुद्धप्रवर्तकः । पलायमानो बालाढ्यो बालहासः सुसङ्गतः ॥ ५७॥ प्रत्यागतः पुनर्गच्छच्चक्रवद्गमनाकुलः
    । चोरवद्धृतसर्वस्वो जनताऽऽर्तिकदेहवान् ॥ ५८॥ प्रहसन्प्रवदन्दत्तो दिव्यमङ्गलविग्रहः । मायाबालश्च मायावी
    पूर्णलीलो मुनीश्वरः ॥ ५९॥ माहुरेशो विशुद्धात्मा यशस्वी कीर्तिमान् युवा । सविकल्पः सच्चिदाभो गुणवान्
    सौम्यभावनः ॥ ६०॥ पिनाकी शशिमौली च वासुदेवो दिवस्पतिः । सुशिराः सूर्यतेजश्च श्रीगम्भीरोष्ठ उन्नतिः
    ॥ ६१॥ दशपद्मा त्रिशीर्षश्च त्रिभिर्व्याप्तो द्विशुक्लवान् । त्रिसमश्च त्रितात्मश्च त्रिलोकश्च त्र्यम्बकः
    ॥ ६२॥ चतुर्द्वन्द्वस्त्रियवनस्त्रिकामो हंसवाहनः । चतुष्कलश्चतुर्दंष्ट्रो गतिः शम्भुः प्रियाननः ॥ ६३॥
    चतुर्मतिर्महादंष्ट्रो वेदाङ्गी चतुराननः । पञ्चशुद्धो महायोगी महाद्वादशवानकः ॥ ६४॥ चतुर्मुखो नरतनुरजेयश्चाष्टवंशवान्
    । चतुर्दशसमद्वन्द्वो मुकुराङ्को दशांशवान् ॥ ६५॥ वृषाङ्को वृषभारूढश्चन्द्रतेजाः सुदर्शनः । सामप्रियो
    महेशानश्चिदाकारोः नरोत्तमः ॥ ६६॥ दयावान् करुणापूर्णो महेन्द्रो माहुरेश्वरः । वीरासनसमासीनो रामो रामपरायणः
    ॥ ६७॥ इन्द्रो वह्निर्यमः कालो निरृतिर्वरुणो यमः । वायुश्च रुद्रश्चेशानो लोकपालो महायशाः ॥ ६८॥ यक्षगन्धर्वनागश्च
    किन्नरः शुद्धरूपकः । विद्याधरश्चाहिपतिश्चारणः पन्नगेश्वरः ॥ ६९॥ चण्डिकेशः प्रचण्डश्च घण्टानादरतः प्रियः
    । वीणाध्वनिर्वैनतेयो नारदस्तुम्बरुर्हरः ॥ ७०॥ वीणाप्रचण्डसौन्दर्यो राजीवाक्षश्च मन्मथः । चन्द्रो दिवाकरो
    गोपः केसरी सोमसोदरः ॥ ७१॥ सनकः शुकयोगी च नन्दी षण्मुखरागकः । गणेशो विघ्नराजश्च चन्द्राभो विजयो जयः
    ॥ ७२॥ अतीतकालचक्रश्च तामसः कालदण्डवान् । विष्णुचक्रः त्रिशूलेन्द्रो ब्रह्मदण्डो विरुद्धकः ॥ ७३॥ ब्रह्मास्त्ररूपः
    सत्येन्द्रः कीर्तिमान्गोपतिर्भवः । वसिष्ठो वामदेवश्च जाबाली कण्वरूपकः ॥ ७४॥ संवर्तरूपो मौद्गल्यो मार्कण्डेयश्च
    कश्यपः । त्रिजटो गार्ग्यरूपी च विषनाथो महोदयः ॥ ७५॥ त्वष्टा निशाकरः कर्मकाश्यपश्च त्रिरूपवान् । जमदग्निः
    सर्वरूपः सर्वनादो यतीश्वरः ॥ ७६॥ अश्वरूपी वैद्यपतिर्गरकण्ठोऽम्बिकार्चितः । चिन्तामणिः कल्पवृक्षो रत्नाद्रिरुदधिप्रियः
    ॥ ७७॥ महामण्डूकरूपी च कालाग्निसमविग्रहः । आधारशक्तिरूपी च कूर्मः पञ्चाग्निरूपकः ॥ ७८॥ क्षीरार्णवो
    महारूपी वराहश्च धृतावनिः । ऐरावतो जनः पद्मो वामनः कुमुदात्मवान् ॥ ७९॥ पुण्डरीकः पुष्पदन्तो मेघच्छन्नोऽभ्रचारकः
    । सितोत्पलाभो द्युतिमान् दृढोरस्कः सुरार्चितः ॥ ८०॥ पद्मनाभः सुनाभश्च दशशीर्षः शतोदरः । अवाङ्मुखो
    पञ्चवक्त्रो रक्षाख्यात्मा द्विरूपकः ॥ ८१॥ स्वर्णमण्डलसञ्चारी वेदिस्थः सर्वपूजितः । स्वप्रसन्नः प्रसन्नात्मा
    स्वभक्ताभिमुखो मृदुः ॥ ८२॥ आवाहितः सन्निहितो वरदो ज्ञानिवत्स्थितः । शालिग्रामात्मको ध्यातो रत्नसिंहासनस्थितः
    ॥ ८३॥ अर्घ्यप्रियः पाद्यतुष्टश्चाचम्यार्चितपादुकः । पञ्चामृतः स्नानविधिः शुद्धोदकसुसञ्चितः ॥ ८४॥ गन्धाक्षतसुसम्प्रीतः
    पुष्पालङ्कारभूषणः । अङ्गपूजाप्रियः सर्वो महाकीर्तिर्महाभुजः ॥ ८५॥ नामपूजाविशेषज्ञः सर्वनामस्वरूपकः
    । धूपितो दिव्यधूपात्मा दीपितो बहुदीपवान् ॥ ८६॥ बहुनैवेद्यसंहृष्टो निराजनविराजितः । सर्वातिरञ्जितानन्दः
    सौख्यवान् धवलार्जुनः ॥ ८७॥ विरागो निर्विरागश्च यज्ञार्चाङ्गो विभूतिकः । उन्मत्तो भ्रान्तचित्तश्च शुभचित्तः
    शुभाहुतिः ॥ ८८॥ सुरैरिष्टो लघिष्टश्च बंहिष्ठो बहुदायकः । महिष्ठः सुमहौजाश्च बलिष्ठः सुप्रतिष्ठितः
    ॥ ८९॥ काशीगङ्गाम्बुमज्जश्च कुलश्रीमन्त्रजापकः । चिकुरान्वितभालश्च सर्वाङ्गालिप्तभूतिकः ॥ ९०॥ अनादिनिधनो
    ज्योतिभार्गवाद्यः सनातनः । तापत्रयोपशमनो मानवासो महोदयः ॥ ९१॥ ज्येष्ठः श्रेष्ठो महारौद्रः कालमूर्तिः
    सुनिश्चयः । ऊर्ध्वः समूर्ध्वलिङ्गश्च हिरण्यो हेमलिङ्गवान् ॥ ९२॥ सुवर्णः स्वर्णलिङ्गश्च दिव्यसूतिर्दिवस्पतिः
    । दिव्यलिङ्गो भवो भव्यः सर्वलिङ्गस्तु सर्वकः ॥ ९३॥ शिवलिङ्गः शिवो मायो ज्वलस्तूज्ज्वललिङ्गवान् । आत्मा
    चैवात्मलिङ्गश्च परमो लिङ्गपारगः ॥ ९४॥ सोमः सूर्यः सर्वलिङ्गः पाणियन्त्रपवित्रवान् । सद्योजातो तपोरूपो
    भवोद्भव अनीश्वरः ॥ ९५॥ तत्सविद्रूपसविता वरेण्यश्च प्रचोदयात् । दूरदृष्टिर्दूरगतो दूरश्रवणतर्पितः ॥
    ९६॥ योगपीठस्थितो विद्वान् नमस्कारितरासभः । नमत्कृतशुनश्चापि वज्रकष्ट्यातिभीषणः ॥ ९७॥ ज्वलन्मुखः प्रतिवीणा
    सखड्गो द्रावितप्रजः । पशुघ्नश्च रसोन्मत्तो रसोर्ध्वमुखरञ्जितः ॥ ९८॥ रसप्रियो रसात्मा च रसरूपी रसेश्वरः
    । रसाधिदैवतो भौमो रसाङ्गो रसभावनः ॥ ९९॥ रसोन्मयो रसकरो रसेन्द्रो रसपूजकः । रससिद्धः सिद्धरसो रसद्रव्यो
    रसोन्मुखः ॥ १००॥ रसाङ्कितो रसापूर्णो रसदो रसिको रसी । गन्धकादस्तालकादो गौरःस्फटिकसेवनः ॥ १०१॥ कार्यसिद्धः
    कार्यरुचिर्बहुकार्यो न कार्यवान् । अभेदी जनकर्ता च शङ्खचक्रगदाधरः ॥ १०२॥ कृष्णाजिनकिरीटी च श्रीकृष्णाजिनकञ्चुकः
    । मृगयायी मृगेन्द्रश्च गजरूपी गजेश्वरः ॥ १०३॥ दृढव्रतः सत्यवादी कृतज्ञो बलवान्बलः । गुणवान् कार्यवान्
    दान्तः कृतशोभो दुरासदः ॥ १०४॥ सुकालो भूतनिहितः समर्थश्चाण्डनायकः । सम्पूर्णदृष्टिरक्षुब्धो जनैकप्रियदर्शनः
    ॥ १०५॥ नियतात्मा पद्मधरो ब्रह्मवांश्चानसूयकः । उञ्च्छवृत्तिरनीशश्च राजभोगी सुमालिकः ॥ १०६॥ सुकुमारो
    जराहीने चोरघ्नो मञ्जुलक्षणः । सुपदः स्वङ्गुलीकश्च सुजङ्घः शुभजानुकः ॥ १०७॥ शुभोरुः शुभलिङ्गश्च सुनाभो
    जघनोत्तमः । सुपार्श्वः सुस्तनो नीलः सुवक्षश्च सुजत्रुकः ॥ १०८॥ नीलग्रीवो महास्कन्धः सुभुजो दिव्यजङ्घकः
    । सुहस्तरेखो लक्ष्मीवान् दीर्घपृष्ठो यतिश्चलः ॥ १०९॥ बिम्बोष्ठः शुभदन्तश्च विद्युज्जिह्वः सुतालुकः
    । दीर्घनासः सुताम्राक्षः सुकपोलः सुकर्णकः ॥ ११०॥ निमीलितोन्मीलितश्च विशालाक्षश्च शुभ्रकः । शुभमध्यः
    सुभालश्च सुशिरा नीलरोमकः ॥ १११॥ विशिष्टग्रामणिस्कन्धः शिखिवर्णो विभावसुः । कैलासेशो विचित्रज्ञो वैकुण्ठेन्द्रो
    विचित्रवान् ॥ ११२॥ मनसेन्द्रश्चक्रवालो महेन्द्रो मन्दारधिपः । मलयो विन्ध्यरूपश्च हिमवान् मेरुरूपकः
    ॥ ११३॥ सुवेषो नव्यरूपात्मा मैनाको गन्धमादनः । सिंहलश्चैव वेदाद्रिः श्रीशैलः क्रकचात्मकः ॥ ११४॥ नानाचलश्चित्रकूटो
    दुर्वासाः पर्वतात्मजः । यमुनाकृष्णवेणीशो भद्रेशो गौतमीपतिः ॥ ११५॥ गोदावरीशो गङ्गात्मा शोणकः कौशिकीपतिः
    । नर्मदेशस्तु कावेरीताम्रपर्णीश्वरो जटी ॥ ११६॥ सरिद्रूपा नदात्मा च समुद्रः सरिदीश्वरः । ह्रादिनीशः
    पावनीशो नलिनीशः सुचक्षुमान् ॥ ११७॥ सीतानदीपतिः सिन्धूरेवेशो मुरलीपतिः । लवणेक्षुः क्षीरनिधिः सुराब्धिः
    सर्पिरम्बुधिः ॥ ११८॥ दयाब्धिशुद्धजलधिस्तत्वरोपो धनाधिपः । भूपालमधुरागज्ञो मालतीरागकोविदः ॥ ११९॥ पौण्ड्रक्रियाज्ञः
    श्रीरागो नानारागार्णवान्तकः । वेदादिरूपो ह्रीरूपो क्लंरूपः क्लींविकारकः ॥ १२०॥ व्रुम्मयः क्लीम्मयः
    प्रख्यो हुम्मयः क्रोम्मयो भटः । ध्रीमयो लुङ्ग्मयो गाङ्गो घम्मयो खम्मयो खगः ॥ १२१॥ खम्मयो ज्ञम्मयश्चाङ्गो
    बीजाङ्गो बीजजम्मयः । झंङ्करष्टङ्करःष्टङ्गो डङ्करी ठङ्करोऽणुकः ॥ १२२॥ तङ्क्ररस्थङ्करस्तुङ्गो द्राम्मुद्रारूपकः
    सुदः । दक्षो दण्डी दानवघ्नो अप्रतिद्वन्द्ववामदः ॥ १२३॥ धंरूपो नंस्वरूपश्च पङ्कजाक्षश्च फम्मयः । महेन्द्रो
    मधुभोक्ता च मन्दरेतास्तु भम्मयः ॥ १२४॥ रम्मयो रिङ्करो रङ्गो लङ्करः वम्मयः शरः । रं
