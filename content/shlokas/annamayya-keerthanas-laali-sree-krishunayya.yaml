id: annamayya-keerthanas-laali-sree-krishunayya
category: stotram
name:
  english: Annamayya Keerthanas Laali Sree Krishunayya
content:
  english: lali shri krishnayya nila meghavarna nava nila meghavarna balagopalapala pavvalimpara singarincina
    manci bangaru uyalalona mari bangaru uyalalona shankhu cakratharasvami nidurapora lalitangi rukmini
    lalanayè kavalèna niku lalanayè kavalèna paluku koyila satyabhamayè kavalèna andèlu muvvalu sandadiga
    mroyaganu ati sandadiga mroyaganu andamuganu nivu pavvalimpara pagadala patakalu kanthana dhariyinci
    ni kanthana dhariyinci vangevu tòngevu nidurapora alukalu ponèla alavelu mangato shri alavelu mangato
    kulukucu shayyanincu vènkateshvaruda
  devanagari: लालि श्री क्रिष्णय्य नील मेघवर्ण नव नील मेघवर्ण बालगोपालपाल पव्वलिम्परा सिङ्गारिञ्चिन मञ्चि
    बङ्गारु ऊयललोन मरि बङ्गारु ऊयललोन शङ्खु चक्रथरस्वामि निदुरपोरा ललिताङ्गि रुक्मिणी ललनायॆ कावलॆना नीकु
    ललनायॆ कावलॆना पलुकु कोयिल सत्यभामयॆ कावलॆना अन्दॆलू मुव्वलू सन्दडिग म्रोयगनु अति सन्दडिग म्रोयगनु
    अन्दमुगानु नीवु पव्वलिम्परा पगडाल पतकालु कण्ठना धरियिञ्चि नी कण्ठना धरियिञ्चि वङ्गेवु तॊङ्गेवु निदुरपोरा
    अलुकलु पोनॆल अलवेलु मङ्गतो श्री अलवेलु मङ्गतो कुलुकुचु शय्यनिञ्चु वॆङ्कटेश्वरुडा
