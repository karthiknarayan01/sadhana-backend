id: vasudevopanishat
category: upanishad
name:
  english: vasudevopanishat
  devanagari: वासुदेवोपनिषत्
content:
  english: namabhirva dharayet | brahmacari vanaprastho va lalatahridayakanthabahumuleshu vaishnavagayatrya
    krishnadinamabhirva dharayet | iti trivaramabhimantrya shankhacakragadapane dvarakanilayacyuta | govinda
    pundarikaksha raksha mam sharanagatam | iti dhyatva grihastho lalatadidvadashasthaleshvanamikangulya
    vaishnavagayatrya keshavadinamabhirva dharayet | brahmacari grihastho va lalatahridayakanthabahumuleshu
    vaishnavagayatrya krishnadinamabhirva dharayet | yatistarjanya shirolalatahridayeshu pranavenaiva
    dharayet | brahmadayastrayo murtayastisro vyahritayastrini chandamsi trayo'gnaya iti jyotishmantastrayah
    kalastisro'vasthastraya atmanah pundratraya urdhva akara ukaro makara ete pranavamayordhvapundrastadatma
    sadetadomiti | tanekadha samabhavat | urdhvamunnamayata ityonkaradhikari | tasmadurdhvapundram dharayet
    | paramahamso lalate pranavenaikamurdhvapundram va dharayet | tattvapradipaprakasham svatmanam pashyanyogi
    matsayujyamavapnoti | atha va nyastahridayapundramadhye va hridayakamalamadhye va | tasya madhye vahnishikha
    aniyordhva vyavasthita | nilatoyadamadhyasthadvidyullekheva bhasvara | nivarashukavattanvi paramatma
    vyavasthita iti | atah pundrastham hridayapundarikeshu tamabhyaset | kramadevam svatmanam bhavayenmam
    param harim | ekagramanasa yo mam dhyayate harimavyayam | hritpankaje ca svatmanam sa mukto natra
    samshayah | madrupamadvayam brahma adimadhyantavarjitam | svaprabham saccidanandam bhaktya janati
    cavyayam | eko vishnuranekeeshu jangamasthavareshu ca | anusyuto vasatyatma bhuteshvahamavasthitah
    | tailam tileshu kashtheshu vahnih kshire ghritam yatha | gandhah pushpeshu bhuteshu tathatmavasthito
    hyaham | brahmarandhre bhruvormadhye hridaye cidravim harim | gopicandanamalipya tatra dhyatvapnuyatparam
    | urdhvadandordhvaretashca urdhvapundrordhvayogavan | urdhvam padamavapnoti yatirurdhvacatushkavan
    | ityetannishcitam jnanam madbhaktya sidhyati svayam | nityamekagrabhaktih syadgopicandanadharanat
    | brahmananam tu sarvesham vaidikanamanuttamam | gopicandanavaribhyamurdhvapundram vidhiyate | yo
    gopicandanabhave tulasimulamrittikam | mumukshurdharayennityamaparokshatmasiddhaye | atiratragnihotrabhasmanagnerbhasitamidamvishnustrini
    padeti mantrairvaishnavagayatrya pranavenoddhulanam kuryat | evam vidhina gopicandanam ca dharayet
    | yastvadhite va sa sarvapatakebhyah puto bhavati | papabuddhistasya na jayate | sa sarveshu tirtheshu
    snato bhavati | sa sarvairyajnairyajito bhavati | sa sarvairdevaih pujyo bhavati | shrimannarayane
    mayyacancala bhaktishca bhavati | sa samyagjnanam ca labdhva vishnusayujyamavapnoti | na ca punaravartate
    na ca punaravartate ityaha bhagavanvasudevah | yastvetadvadhite so'pyevameva bhavatityom satyamityupanishat
    || om apyayantu mamangani vakpranashcakshuh shrotramatho balamidriyani ca || sarvani sarvam brahmopanishadam
    maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakanam mestu tadatmani nirate ya
    upanishatsu dharmaste mayi santu te mayi santu || om shantih shantih shantih || iti vasudevopanishatsamapta
    || adhikadhyayanaya
  devanagari: नामभिर्वा धारयेत् । ब्रह्मचारी वानप्रस्थो वा ललाटहृदयकण्ठबाहूमूलेषु वैष्णवगायत्र्या कृष्णादिनामभिर्वा
    धारयेत् । इति त्रिवारमभिमन्त्र्य शङ्खचक्रगदापाणे द्वारकानिलयाच्युत । गोविन्द पुण्डरीकाक्ष रक्ष मां
    शरणागतम् । इति ध्यात्वा गृहस्थो ललाटादिद्वादशस्थलेष्वनामिकाङ्गुल्या वैष्णवगायत्र्या केशवादिनामभिर्वा
    धारयेत् । ब्रह्मचारी गृहस्थो वा ललाटहृदयकण्ठबाहूमूलेषु वैष्णवगायत्र्या कृष्णादिनामभिर्वा धारयेत् ।
    यतिस्तर्जन्या शिरोललाटहृदयेषु प्रणवेनैव धारयेत् । ब्रह्मादयस्त्रयो मूर्तयस्तिस्रो व्याहृतयस्त्रीणि
    छन्दांसि त्रयोऽग्नय इति ज्योतिष्मन्तस्त्रयः कालास्तिस्रोऽवस्थास्त्रय आत्मानः पुण्ड्रात्रय ऊर्ध्वा
    अकार उकारो मकार एते प्रणवमयोर्ध्वपुण्ड्रास्तदात्मा सदेतदोमिति । तानेकधा समभवत् । ऊर्ध्वमुन्नमयत इत्योङ्काराधिकारी
    । तस्मादूर्ध्वपुण्ड्रं धारयेत् । परमहंसो ललाटे प्रणवेनैकमूर्ध्वपुण्ड्रं वा धारयेत् । तत्त्वप्रदीपप्रकाशं
    स्वात्मानं पश्यन्योगी मत्सायुज्यमवाप्नोति । अथ वा न्यस्तहृदयपुण्ड्रमध्ये वा हृदयकमलमध्ये वा । तस्य
    मध्ये वह्निशिखा अणीयोर्ध्वा व्यवस्थिता । नीलतोयदमध्यस्थाद्विद्युल्लेखेव भास्वरा । नीवारशूकवत्तन्वी
    परमात्मा व्यवस्थित इति । अतः पुण्ड्रस्थं हृदयपुण्डरीकेषु तमभ्यसेत् । क्रमादेवं स्वात्मानं भावयेन्मां
    परं हरिम् । एकाग्रमनसा यो मां ध्यायते हरिमव्ययम् । हृत्पङ्कजे च स्वात्मानं स मुक्तो नात्र संशयः ।
    मद्रूपमद्वयं ब्रह्म आदिमध्यान्तवर्जितम् । स्वप्रभं सच्चिदानन्दं भक्त्या जानाति चाव्ययम् । एको विष्णुरनेकेएषु
    जङ्गमस्थावरेषु च । अनुस्युतो वसत्यात्मा भूतेष्वहमवस्थितः । तैलं तिलेषु काष्ठेषु वह्निः क्षीरे घृतं
    यथा । गन्धः पुष्पेषु भूतेषु तथात्मावस्थितो ह्यहम् । ब्रह्मरन्ध्रे भ्रुवोर्मध्ये हृदये चिद्रविं हरिम्
    । गोपीचन्दनमालिप्य तत्र ध्यात्वाप्नुयात्परम् । ऊर्ध्वदण्डोर्ध्वरेताश्च ऊर्ध्वपुण्ड्रोर्ध्वयोगवान्
    । ऊर्ध्वं पदमवाप्नोति यतिरूर्ध्वचतुष्कवान् । इत्येतन्निश्चितं ज्ञानं मद्भक्त्या सिध्यति स्वयम् । नित्यमेकाग्रभक्तिः
    स्याद्गोपीचन्दनधारणात् । ब्राह्माणानां तु सर्वेषां वैदिकानामनुत्तमम् । गोपीचन्दनवारिभ्यामूर्ध्वपुण्ड्रं
    विधीयते । यो गोपीचन्दनाभावे तुलसीमूलमृत्तिकाम् । मुमुक्षुर्धारयेन्नित्यमपरोक्षात्मसिद्धये । अतिरात्राग्निहोत्रभस्मनाग्नेर्भसितमिदंविष्णुस्त्रीणि
    पदेति मन्त्रैर्वैष्णवगायत्र्या प्रणवेनोद्धूलनं कुर्यात् । एवं विधिना गोपीचन्दनं च धारयेत् । यस्त्वधीते
    वा स सर्वपातकेभ्यः पूतो भवति । पापबुद्धिस्तस्य न जायते । स सर्वेषु तीर्थेषु स्नातो भवति । स सर्वैर्यज्ञैर्याजितो
    भवति । स सर्वैर्देवैः पूज्यो भवति । श्रीमन्नारायणे मय्यचञ्चला भक्तिश्च भवति । स सम्यग्ज्ञानं च लब्ध्वा
    विष्णुसायुज्यमवाप्नोति । न च पुनरावर्तते न च पुनरावर्तते इत्याह भगवान्वासुदेवः । यस्त्वेतद्वाधीते
    सोऽप्येवमेव भवतीत्यों सत्यमित्युपनिषत् ।। ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिद्रियाणि
    च ।। सर्वाणि सर्वं ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकणं
    मेस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु ।। ॐ शान्तिः शान्तिः शान्तिः ।।
    इति वासुदेवोपनिषत्समाप्ता ।। अधिकाध्ययनाय
