id: sri-krishna-kavacham-trailokya-mangala-kavacham
category: stotram
name:
  english: Sri Krishna Kavacham (Trailokya Mangala Kavacham)
content:
  english: bhagavansarvadharmajna kavacam yatprakashitam | trailokyamangalam nama kripaya kathaya prabho
    || shrinu vakshyami viprendra kavacam paramadbhutam | narayanena kathitam kripaya brahmane pura ||
    || brahmana kathitam mahyam param snehadvadami te | ati guhyataram tattvam brahmamantraughavigraham
    || || yaddhritva pathanadbrahma srishtim vitanute dhruvam | yaddhritva pathanatpati mahalakshmirjagattrayam
    || || pathanaddharanacchambhuh samharta sarvamantravit | trailokyajanani durga mahishadimahasuran
    || || varatriptan jaghanaiva pathanaddharanadyatah | evamindradayah sarve sarvaishvaryamavapnuyuh
    || || idam kavacamatyantaguptam kutrapi no vadet | shishyaya bhaktiyuktaya sadhakaya prakashayet ||
    || shathaya parashishyaya datva mrityumavapnuyat | trailokyamangalasya'sya kavacasya prajapatih ||
    || rishishchandashca gayatri devo narayanassvayam | dharmarthakamamoksheshu viniyogah prakirtitah
    || || pranavo me shirah patu namo narayanaya ca | phalam me netrayugalamashtarno bhuktimuktidah ||
    || klim payacchrotrayugmam caikaksharah sarvamohanah | klim krishnaya sada ghranam govindayeti jihvikam
    || || gopijanapadavallabhaya svaha'nanam mama | ashtadashaksharo mantrah kantham patu dashaksharah
    || || gopijanapadavallabhaya svaha bhujadvayam | klim glaum klim shyamalangaya namah skandhau rakshaksharah
    || || klim krishnah klim karau payat klim krishnayam gato'vatu | hridayam bhuvaneshanah klim krishnah
    klim stanau mama || || gopalayagnijayatam kukshiyugmam sada'vatu | klim krishnaya sada patu parshvayugmamanuttamah
    || || krishna govindakau patu smaradyaujeyutau manuh | ashtaksharah patu nabhim krishneti dvyaksharo'vatu
    || || prishtham klim krishnakam galla klim krishnaya dvirantakah | sakthini satatam patu shrim hrim
    klim krishnathadvayam || || uru saptaksharam payat trayodashaksharo'vatu | shrim hrim klim padato
    gopijanavallabhapadam tatah || || shriya svaheti payu vai klim hrim shrim sadasharnakah | januni ca
    sada patu klim hrim shrim ca dashaksharah || || trayodashaksharah patu janghe cakradyudayudhah | ashtadashaksharo
    hrim shrim purvako vimshadarnakah || || sarvangam me sada patu dvarakanayako bali | namo bhagavate
    pashcadvasudevaya tatparam || || taradyo dvadasharno'yam pracyam mam sarvada'vatu | shrim hrim klim
    ca dasharnastu klim hrim shrim shodasharnakah || || gadadyudayudho vishnurmamagnerdishi rakshatu |
    hrim shrim dashaksharo mantro dakshine mam sada'vatu || || taro namo bhagavate rukminivallabhaya ca
    | svaheti shodasharno'yam nairrityam dishi rakshatu || || klim hrishikesha vamshaya namo mam varuno'vatu
    | ashtadasharnah kamanto vayavye mam sada'vatu || || shrim mayakamatrishnaya govindaya dviko manuh
    | dvadasharnatmako vishnuruttare mam sada'vatu || || vagbhavam kamakrishnaya hrim govindaya tatparam
    | shrim gopijanavallabhaya svaha hastau tatah param || || dvavimshatyaksharo mantro mamaishanye sada'vatu
    | kaliyasya phanamadhye divyam nrityam karoti tam || || namami devakiputram nrityarajanamacyutam |
    dvatrimshadaksharo mantro'pyadho mam sarvada'vatu || || kamadevaya vidmahe pushpabanaya dhimahi |
    tanno'nangah pracodayadesha mam patucordhvatah || || iti te kathitam vipra brahmamantraughavigraham
    | trailokyamangalam nama kavacam brahmarupakam || || brahmana kathitam purvam narayanamukhacchrutam
    | tava snehanmaya'khyatam pravaktavyam na kasyacit || || gurum pranamya vidhivatkavacam prapathettatah
    | sakriddvistriryathajnanam sa hi sarvatapomayah || || mantreshu sakaleshveva deshiko natra samshayah
    | shatamashtottaram casya purashcarya vidhissmritah || || havanadindashamshena kritva tatsadhayeddhruvam
    | yadi syatsiddhakavaco vishnureva bhavetsvayam || || mantrasiddhirbhavettasya purashcarya vidhanatah
    | spardhamuddhuya satatam lakshmirvani vasettatah || || pushpanjalyashtakam datva mulenaiva pathetsakrit
    | dashavarshasahasrani pujayah phalamapnuyat || || bhurje vilikhya gulikam svarnastham dharayedyadi
    | kanthe va dakshine bahau so'pi vishnurna samshayah || || ashvamedhasahasrani vajapeyashatani ca
    | mahadanani yanyeva pradakshinyam bhuvastatha || || kalam narhanti tanyeva sakriduccaranattatah |
    kavacasya prasadena jivanmukto bhavennarah || || trailokyam kshobhayatyeva trailokyavijayi sa hi |
    idam kavacamajnatva yajedyah purushottamam | shatalakshaprajapto'pi na mantrastasya siddhyati || ||
    iti shri naradapancaratre jnanamritasare trailokyamangalakavacam |
  devanagari: भगवन्सर्वधर्मज्ञ कवचं यत्प्रकाशितम् । त्रैलोक्यमङ्गलं नाम कृपया कथय प्रभो ॥ शृणु वक्ष्यामि
    विप्रेन्द्र कवचं परमाद्भुतम् । नारायणेन कथितं कृपया ब्रह्मणे पुरा ॥ ॥ ब्रह्मणा कथितं मह्यं परं स्नेहाद्वदामि
    ते । अति गुह्यतरं तत्त्वं ब्रह्ममन्त्रौघविग्रहम् ॥ ॥ यद्धृत्वा पठनाद्ब्रह्मा सृष्टिं वितनुते ध्रुवम्
    । यद्धृत्वा पठनात्पाति महालक्ष्मीर्जगत्त्रयम् ॥ ॥ पठनाद्धारणाच्छम्भुः संहर्ता सर्वमन्त्रवित् । त्रैलोक्यजननी
    दुर्गा महिषादिमहासुरान् ॥ ॥ वरतृप्तान् जघानैव पठनाद्धारणाद्यतः । एवमिन्द्रादयः सर्वे सर्वैश्वर्यमवाप्नुयुः
    ॥ ॥ इदं कवचमत्यन्तगुप्तं कुत्रापि नो वदेत् । शिष्याय भक्तियुक्ताय साधकाय प्रकाशयेत् ॥ ॥ शठाय परशिष्याय
    दत्वा मृत्युमवाप्नुयात् । त्रैलोक्यमङ्गलस्याऽस्य कवचस्य प्रजापतिः ॥ ॥ ऋषिश्छन्दश्च गायत्री देवो नारायणस्स्वयम्
    । धर्मार्थकाममोक्षेषु विनियोगः प्रकीर्तितः ॥ ॥ प्रणवो मे शिरः पातु नमो नारायणाय च । फालं मे नेत्रयुगलमष्टार्णो
    भुक्तिमुक्तिदः ॥ ॥ क्लीं पायाच्छ्रोत्रयुग्मं चैकाक्षरः सर्वमोहनः । क्लीं कृष्णाय सदा घ्राणं गोविन्दायेति
    जिह्विकाम् ॥ ॥ गोपीजनपदवल्लभाय स्वाहाऽननं मम । अष्टादशाक्षरो मन्त्रः कण्ठं पातु दशाक्षरः ॥ ॥ गोपीजनपदवल्लभाय
    स्वाहा भुजद्वयम् । क्लीं ग्लौं क्लीं श्यामलाङ्गाय नमः स्कन्धौ रक्षाक्षरः ॥ ॥ क्लीं कृष्णः क्लीं करौ
    पायात् क्लीं कृष्णायां गतोऽवतु । हृदयं भुवनेशानः क्लीं कृष्णः क्लीं स्तनौ मम ॥ ॥ गोपालायाग्निजायातं
    कुक्षियुग्मं सदाऽवतु । क्लीं कृष्णाय सदा पातु पार्श्वयुग्ममनुत्तमः ॥ ॥ कृष्ण गोविन्दकौ पातु स्मराद्यौजेयुतौ
    मनुः । अष्टाक्षरः पातु नाभिं कृष्णेति द्व्यक्षरोऽवतु ॥ ॥ पृष्ठं क्लीं कृष्णकं गल्ल क्लीं कृष्णाय द्विरान्तकः
    । सक्थिनी सततं पातु श्रीं ह्रीं क्लीं कृष्णठद्वयम् ॥ ॥ ऊरू सप्ताक्षरं पायात् त्रयोदशाक्षरोऽवतु । श्रीं
    ह्रीं क्लीं पदतो गोपीजनवल्लभपदं ततः ॥ ॥ श्रिया स्वाहेति पायू वै क्लीं ह्रीं श्रीं सदशार्णकः । जानुनी
    च सदा पातु क्लीं ह्रीं श्रीं च दशाक्षरः ॥ ॥ त्रयोदशाक्षरः पातु जङ्घे चक्राद्युदायुधः । अष्टादशाक्षरो
    ह्रीं श्रीं पूर्वको विंशदर्णकः ॥ ॥ सर्वाङ्गं मे सदा पातु द्वारकानायको बली । नमो भगवते पश्चाद्वासुदेवाय
    तत्परम् ॥ ॥ ताराद्यो द्वादशार्णोऽयं प्राच्यां मां सर्वदाऽवतु । श्रीं ह्रीं क्लीं च दशार्णस्तु क्लीं
    ह्रीं श्रीं षोडशार्णकः ॥ ॥ गदाद्युदायुधो विष्णुर्मामग्नेर्दिशि रक्षतु । ह्रीं श्रीं दशाक्षरो मन्त्रो
    दक्षिणे मां सदाऽवतु ॥ ॥ तारो नमो भगवते रुक्मिणीवल्लभाय च । स्वाहेति षोडशार्णोऽयं नैरृत्यां दिशि रक्षतु
    ॥ ॥ क्लीं हृषीकेश वंशाय नमो मां वारुणोऽवतु । अष्टादशार्णः कामान्तो वायव्ये मां सदाऽवतु ॥ ॥ श्रीं मायाकामतृष्णाय
    गोविन्दाय द्विको मनुः । द्वादशार्णात्मको विष्णुरुत्तरे मां सदाऽवतु ॥ ॥ वाग्भवं कामकृष्णाय ह्रीं गोविन्दाय
    तत्परम् । श्रीं गोपीजनवल्लभाय स्वाहा हस्तौ ततः परम् ॥ ॥ द्वाविंशत्यक्षरो मन्त्रो मामैशान्ये सदाऽवतु
    । कालीयस्य फणामध्ये दिव्यं नृत्यं करोति तम् ॥ ॥ नमामि देवकीपुत्रं नृत्यराजानमच्युतम् । द्वात्रिंशदक्षरो
    मन्त्रोऽप्यधो मां सर्वदाऽवतु ॥ ॥ कामदेवाय विद्महे पुष्पबाणाय धीमहि । तन्नोऽनङ्गः प्रचोदयादेषा मां
    पातुचोर्ध्वतः ॥ ॥ इति ते कथितं विप्र ब्रह्ममन्त्रौघविग्रहम् । त्रैलोक्यमङ्गलं नाम कवचं ब्रह्मरूपकम्
    ॥ ॥ ब्रह्मणा कथितं पूर्वं नारायणमुखाच्छ्रुतम् । तव स्नेहान्मयाऽख्यातं प्रवक्तव्यं न कस्यचित् ॥ ॥ गुरुं
    प्रणम्य विधिवत्कवचं प्रपठेत्ततः । सकृद्द्विस्त्रिर्यथाज्ञानं स हि सर्वतपोमयः ॥ ॥ मन्त्रेषु सकलेष्वेव
    देशिको नात्र संशयः । शतमष्टोत्तरं चास्य पुरश्चर्या विधिस्स्मृतः ॥ ॥ हवनादीन्दशांशेन कृत्वा तत्साधयेद्ध्रुवम्
    । यदि स्यात्सिद्धकवचो विष्णुरेव भवेत्स्वयम् ॥ ॥ मन्त्रसिद्धिर्भवेत्तस्य पुरश्चर्या विधानतः । स्पर्धामुद्धूय
    सततं लक्ष्मीर्वाणी वसेत्ततः ॥ ॥ पुष्पाञ्जल्यष्टकं दत्वा मूलेनैव पठेत्सकृत् । दशवर्षसहस्राणि पूजायाः
    फलमाप्नुयात् ॥ ॥ भूर्जे विलिख्य गुलिकां स्वर्णस्थां धारयेद्यदि । कण्ठे वा दक्षिणे बाहौ सोऽपि विष्णुर्न
    संशयः ॥ ॥ अश्वमेधसहस्राणि वाजपेयशतानि च । महादानानि यान्येव प्रादक्षिण्यं भुवस्तथा ॥ ॥ कलां नार्हन्ति
    तान्येव सकृदुच्चारणात्ततः । कवचस्य प्रसादेन जीवन्मुक्तो भवेन्नरः ॥ ॥ त्रैलोक्यं क्षोभयत्येव त्रैलोक्यविजयी
    स हि । इदं कवचमज्ञात्वा यजेद्यः पुरुषोत्तमम् । शतलक्षप्रजप्तोऽपि न मन्त्रस्तस्य सिद्ध्यति ॥ ॥ इति
    श्री नारदपाञ्चरात्रे ज्ञानामृतसारे त्रैलोक्यमङ्गलकवचम् ।
