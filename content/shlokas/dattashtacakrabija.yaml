id: dattashtacakrabija
category: stotram
name:
  english: dattashtacakrabija
  devanagari: दत्ताष्टचक्रबीज
content:
  english: shridattatreya ashtacakrabijastotram shridattashatcakrastotram ajapajapastotram ca | shriganeshaya
    namah | shri gurave namah | atha dhyanam | digambaram bhasmasugandhalepanam cakram trishulam damarum
    gadam ca | padmasanastham rishidevavanditam dattatreyadhyanamabhishtasiddhidam || om muladhare varijapatre
    caturasram
  devanagari: श्रीदत्तात्रेय अष्टचक्रबीजस्तोत्रम् श्रीदत्तषट्चक्रस्तोत्रम् अजपाजपस्तोत्रं च । श्रीगणेशाय
    नमः । श्री गुरवे नमः । अथ ध्यानम् । दिगम्बरं भस्मसुगन्धलेपनं चक्रं त्रिशूलं डमरुं गदां च । पद्मासनस्थं
    ऋषिदेववन्दितं दत्तात्रेयध्यानमभीष्टसिद्धिदम् ॥ ॐ मूलाधारे वारिजपत्रे चतुरस्रं
meaning: {}
