id: durgastotrambm
category: stotram
name:
  english: durgastotramBm
  devanagari: दुर्गास्तोत्रम्Bं
content:
  english: durgastotram durgasamtarinim durga tada sa sharanam gatah | mahendropendrabhaginim divyaistushtava
    namabhih || 1|| naumi kamsasuraishvaryatamahpatalacandrikam | purnacandrananam devim dushtasammohanakshamam
    || 2|| diptashulaprabhajalabhishanam lalitakritim | velladvisholbanavyalamiva candanavallarim || 3||
    mahishanyastacaranam shyamam haravibhushitam | sakaliyahridam phenahasini yamunamiva || 4|| panisamsaktabhujagabhoganilasivallarim
    | ekapadmodarodgacchadalimalamivajinim || 5|| mayurapakshabharanaih shabalairmecakaprabhaih| sevitam
    pravrishamiva sphuradindrayudhairghanaih || 6|| karalakeshavispharashuddhasamcaralalasam | himadrishikharodbhutam
    kalagurulatamiva || 7|| kavindramanasavasarajahamsim sarasvatim | vicitramadhurodarashabdam carupadakramam
    || 8|| samsaramarusamtapanirvapanasamudyatam | samvitsamarasanandasudhasyandataranginim || 9|| ranasamrambhasambharagambhirarambhavibhramam
    | nishumbhashumbhavashtambhabhitasambhavitamaram || 10|| samdhyamavandhyam vindhyadrivasinim vasavanujam
    | shashikhandashikhandankam mundamandalamanditam || 11|| phullotpalavanashyamam phullotpalavilocanam
    | gambhiranabhikuharamibhakumbhanibhastanim || 12|| dhanyam katyayani candam camundam khanditahitam
    | sharvani sharvarim sharva siddhagandharvasevitam || 13|| kalasamkarshinim ghoram trijagaramalalasam
    | kamalasanakankalamalakalitashekharam || 14|| shivam shivapradam shantam shivakantam shatananam |
    trinetram saumyavadanam madanarimadaprabham || 15|| sphitaphenasudhambhodhidukulam ratnamekhalam |
    karakalitahemadrimatulangamshupingalam || 16|| akshasutrikritavrittanakshatramanimalikam | panisaktasudhambhodhipurnabrahmandakaparam
    || 17|| samvitprakashavishadavyakoshakashadarpanam | sheshadikulabhogindraharakeyurakankanam || 18||
    tarakamauktikasmerashashimartandamandalam | trisha
  devanagari: दुर्गास्तोत्रम् दुर्गसंतारिणीं दुर्गा तदा स शरणं गतः । महेन्द्रोपेन्द्रभगिनीं दिव्यैस्तुष्टाव
    नामभिः ॥ १॥ नौमि कंसासुरैश्वर्यतमःपटलचन्द्रिकाम् । पूर्णचन्द्राननां देवीं दुष्टसंमोहनक्षमाम् ॥ २॥
    दीप्तशूलप्रभाजालभीषणां ललिताकृतिम् । वेल्लद्विषोल्बणव्यालामिव चन्दनवल्लरीम् ॥ ३॥ महिषन्यस्तचरणां श्यामां
    हारविभूषिताम् । सकालियहृदां फेनहासिनी यमुनामिव ॥ ४॥ पाणिसंसक्तभुजगाभोगनीलासिवल्लरीम् । एकपद्मोदरोद्गच्छदलिमालामिवाजिनीम्
    ॥ ५॥ मयूरपक्षाभरणैः शबलैर्मेचकप्रभैः। सेवितां प्रावृषमिव स्फुरदिन्द्रायुधैर्घनैः ॥ ६॥ करालकेशविस्फारशुद्धसंचारलालसाम्
    । हिमाद्रिशिखरोद्भूतां कालागुरुलतामिव ॥ ७॥ कवीन्द्रमानसावासराजहंसीं सरस्वतीम् । विचित्रमधुरोदारशब्दां
    चारुपदक्रमाम् ॥ ८॥ संसारमरुसंतापनिर्वापणसमुद्यताम् । संवित्समरसानन्दसुधास्यन्दतरङ्गिणीम् ॥ ९॥ रणसंरम्भसंभारगम्भीरारम्भविभ्रमाम्
    । निशुम्भशुम्भावष्टम्भभीतसंभावितामराम् ॥ १०॥ संध्यामवन्ध्यां विन्ध्याद्रिवासिनीं वासवानुजाम् । शशिखण्डशिखण्डाङ्कां
    मुण्डमण्डलमण्डिताम् ॥ ११॥ फुल्लोत्पलवनश्यामां फुल्लोत्पलविलोचनाम् । गम्भीरनाभिकुहरामिभकुम्भनिभस्तनीम्
    ॥ १२॥ धन्यां कात्यायनी चण्डां चामुण्डां खण्डिताहिताम् । शर्वाणी शर्वरीं शर्वा सिद्धगन्धर्वसेविताम्
    ॥ १३॥ कालसंकर्षिणीं घोरां त्रिजगरामलालसाम् । कमलासनकङ्कालमालाकलितशेखराम् ॥ १४॥ शिवां शिवप्रदां शान्तां
    शिवकान्तां शताननाम् । त्रिनेत्रां सौम्यवदनां मदनारिमदप्रभाम् ॥ १५॥ स्फीतफेनसुधाम्भोधिदुकूलां रत्नमेखलाम्
    । कराकलितहेमाद्रिमातुलङ्गांशुपिङ्गलाम् ॥ १६॥ अक्षसूत्रीकृतावृत्तनक्षत्रमणिमालिकाम् । पाणिसक्तसुधाम्भोधिपूर्णब्रह्माण्डकपराम्
    ॥ १७॥ संवित्प्रकाशविषदव्याकोशाकाशदर्पणाम् । शेषादिकुलभोगीन्द्रहारकेयूरकङ्कणाम् ॥ १८॥ तारकामौक्तिकस्मेरशशिमार्तण्डमण्डलाम्
    । त्रिश
