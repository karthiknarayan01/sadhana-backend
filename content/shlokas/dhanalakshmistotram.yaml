id: dhanalakshmistotram
category: stotram
name:
  english: dhanalakshmistotram
  devanagari: धनलक्ष्मीस्तोत्रम्
content:
  english: sarvarthadayike | divyambaradhare divye divyamalyanushobhite || samastagunasampanne sarvalakshanalakshite
    | sharaccandramukhe nile nila niraja locane || camcarika camu caru shrihara kutilalake | matte bhagavati
    matah kalakantharavamrite || hasa'valokanairdivyairbhaktacintapaharike | rupa lavanya tarunya karunya
    gunabhajane || kvanatkamkanamamjire lasallilakarambuje | rudraprakashite tattve dharmadhare dharalaye
    || prayaccha yajamanaya dhanam dharmekasadhanam | matastvam me'vilambena dishasva jagadambike || kripaya
    karuragare prarthitam kuru me shubhe | vasudhe vasudharupe vasu vasava vandite || dhanade yajamanaya
    varade varada bhava | brahmanyairbrahmanaih pujye parvatishivashamkare || stotram daridratavyadhishamanam
    sudhanapradam | shrikare shamkare shride prasida mayikimkare || parvatishaprasadena suresha kimkareritam
    | shraddhaya ye pathishyanti pathayishyanti bhaktitah || sahasramayutam laksham dhanalabho bhaved
    dhruvam | dhanadaya namastubhyam nidhipadmadhipaya ca | bhavantu tvatprasadanme dhana
  devanagari: सर्वार्थदायिके । दिव्याम्बरधरे दिव्ये दिव्यमाल्यानुशोभिते ॥ समस्तगुणसम्पन्ने सर्वलक्षणलक्षिते
    । शरच्चन्द्रमुखे नीले नील नीरज लोचने ॥ चंचरीक चमू चारु श्रीहार कुटिलालके । मत्ते भगवती मातः कलकण्ठरवामृते
    ॥ हासाऽवलोकनैर्दिव्यैर्भक्तचिन्तापहारिके । रूप लावण्य तारूण्य कारूण्य गुणभाजने ॥ क्वणत्कंकणमंजीरे
    लसल्लीलाकराम्बुजे । रुद्रप्रकाशिते तत्त्वे धर्माधरे धरालये ॥ प्रयच्छ यजमानाय धनं धर्मेकसाधनम् । मातस्त्वं
    मेऽविलम्बेन दिशस्व जगदम्बिके ॥ कृपया करुरागारे प्रार्थितं कुरु मे शुभे । वसुधे वसुधारूपे वसु वासव
    वन्दिते ॥ धनदे यजमानाय वरदे वरदा भव । ब्रह्मण्यैर्ब्राह्मणैः पूज्ये पार्वतीशिवशंकरे ॥ स्तोत्रं दरिद्रताव्याधिशमनं
    सुधनप्रदम् । श्रीकरे शंकरे श्रीदे प्रसीद मयिकिंकरे ॥ पार्वतीशप्रसादेन सुरेश किंकरेरितम् । श्रद्धया
    ये पठिष्यन्ति पाठयिष्यन्ति भक्तितः ॥ सहस्रमयुतं लक्षं धनलाभो भवेद् ध्रुवम् । धनदाय नमस्तुभ्यं निधिपद्माधिपाय
    च । भवन्तु त्वत्प्रसादान्मे धन
meaning: {}
