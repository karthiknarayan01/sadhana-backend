    म्प्रति॒ष्ठा स्या॒मिति॑ । स ए॒तग्ं सूर्या॑य॒ नक्ष॑त्रेभ्यश्च॒रु न्निर॑वपत् । ततो॒ वै स नक्ष॑त्राणा
    म्प्रति॒ष्ठा ऽभ॑वत् । प्र॒ति॒ष्ठा ह॒ वै स॑मा॒नाना म्भवति । य ए॒तेन॑ ह॒विषा॒ यज॑ते । य उ॑ चैनदे॒वं
