id: brahmanakritam5vishnustotram
category: stotram
name:
  english: brahmanakritam5vishnustotram
  devanagari: ब्रह्मणाकृतं५विष्णुस्तोत्रम्
content:
  english: brahmana kritam 5 vishnustotram brahmovaca | na hyadimadhyantamajasya yasya vidmo vayam sarvamayasya
    dhatuh | na ca svarupam na param svabhavam na caiva saram parameshvarasya || 83|| kalamuhurttadimayashca
    kalo na yadvibhuteh parinamahetuh | ajanmanashasya sadaikamurtteranamarupasya sanatanasya || 84||
    yasya prasadadahamacyutasya murttih prajasrishtikarantakari | krodhacca rudrah sthitihetubhuto yasmacca
    madhye purushah parasmat || 85|| tadrupamasthaya srijatyajo yah sthitau ca yo'sau purushasvarupi |
    rudrasvarupena ca yo'tti vishvam dhatte tathanantavapussamastam || 86|| pakaya yo'gnitvamupaiti lokanbibhartti
    prithvivapukhyayatma | shakradirupi paripati vishvamarkendurupashca tamo hinasti || 87|| karoti ceshtashshvasanasvarupi
    lokasya triptim ca jalannarupi | dadati vishvasthitisamsthitastu sarvavakasham ca nabhassvarupi ||
    88|| yassrijyate sargakridatmanaiva yah palyate palayita ca devah | vishvatmakassamhriyate'ntakari
    prithak trayasyasya ca yo'vyayatma || 89|| yasminjagadyo jagadetadadyo yam cashrito'sminjagati svayambhuh
    | sa sarvabhutaprabhavo dharitryam svamshena pushnurnripa te'vatirnah || 90|| kushasthali ya tava
    bhupa ramya puri purabhudamaravativa | sa dvaraka samprati tatra caste sa keshavamsho baladevanama
    || 91|| tasmai tvamenam tanayam narendra prayaccha mayamanujaya jayam | shlaghyo varo'sau tanaya taveyam
    striratnabhuta sadrisho hi yogah || 92|| iti vishnupurane caturthabhage prathamadhyayantargatam brahmana
    kritam vishnustotram samaptam | vishnupurana | adhyaya 4
  devanagari: ब्रह्मणा कृतं ५ विष्णुस्तोत्रम् ब्रह्मोवाच । न ह्यादिमध्यान्तमजस्य यस्य विद्मो वयं सर्वमयस्य
    धातुः । न च स्वरूपं न परं स्वभावं न चैव सारं परमेश्वरस्य ॥ ८३॥ कलामुहूर्त्तादिमयश्च कालो न यद्विभूतेः
    परिणामहेतुः । अजन्मनाशस्य सदैकमूर्त्तेरनामरूपस्य सनातनस्य ॥ ८४॥ यस्य प्रसादादहमच्युतस्य मूर्त्तिः
    प्रजासृष्टिकरान्तकारी । क्रोधाच्च रुद्रः स्थितिहेतुभूतो यस्माच्च मध्ये पुरुषः परस्मात् ॥ ८५॥ तद्रूपमास्थाय
    सृजत्यजो यः स्थितौ च योऽसौ पुरुषस्वरूपी । रुद्रस्वरूपेण च योऽत्ति विश्वं धत्ते तथानन्तवपुस्समस्तम्
    ॥ ८६॥ पाकाय योऽग्नित्वमुपैति लोकान्बिभर्त्ति पृथ्वीवपुख्ययात्मा । शक्रादिरूपी परिपाति विश्वमर्केन्दुरूपश्च
    तमो हिनस्ति ॥ ८७॥ करोति चेष्टाश्श्वसनस्वरूपी लोकस्य तृप्तिं च जलान्नरूपी । ददाति विश्वस्थितिसंस्थितस्तु
    सर्वावकाशं च नभस्स्वरूपी ॥ ८८॥ यस्सृज्यते सर्गकृदात्मनैव यः पाल्यते पालयिता च देवः । विश्वात्मकस्संहृयतेऽन्तकारी
    पृथक् त्रायस्यास्य च योऽव्ययात्मा ॥ ८९॥ यस्मिञ्जगद्यो जगदेतदाद्यो यं चाश्रितोऽस्मिञ्जगति स्वयम्भूः
    । स सर्वभूतप्रभवो धरित्र्यां स्वांशेन पुष्णुर्नृप तेऽवतीर्णः ॥ ९०॥ कुशस्थली या तव भूप रम्या पुरी पुराभूदमरावतीव
    । सा द्वारका सम्प्रति तत्र चास्ते स केशवांशो बलदेवनामा ॥ ९१॥ तस्मै त्वमेनां तनयां नरेन्द्र प्रयच्छ
    मायामनुजाय जायाम् । श्लाघ्यो वरोऽसौ तनया तवेयं स्त्रीरत्नभूता सदृशो हि योगः ॥ ९२॥ इति विष्णुपुराणे
    चतुर्थभागे प्रथमाध्यायान्तर्गतं ब्रह्मणा कृतं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय ४
