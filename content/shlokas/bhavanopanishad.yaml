id: bhavanopanishad
category: stotram
name:
  english: Bhavanopanishad
content:
  english: ssarvakaranabhuta shaktih || || kena navarandhrarupo dehah| navashaktirupam shricakrama| varahi
    pitrirupa| kurukulla balidevata mata| purushartha ssagarah| deho navaratnadvipah| adharanavakamudra
    shaktayah| tvagadisaptadhatubhira ssankalpah kalpataravah| teja kalpakodyanam|rasanaya bhavyamana
    madhuramlatikta shshadritavah | kriyashaktih pitham| kundalini jnanashaktirgriham| icchashaktirmahatripurasundari|
    jnata hota jnanamagnih jneyam havih| jnatrijnanajneyanamabhedabhavanam shricakrapujanam| niyatisahita
    ringaradayo nava rasa animadayah| kamakrodhalobhamohamada matsaryapunyapapamaya brahmayadyashtashaktayah
    | prithivyaptejovayvakashashrotratvakcakshurjihvaghranava kpanipadapayupasthamanovikara shshodasha
    shaktayah | vacanadanagamanavisarganandahanopekshabuddhayo 'shtau| alambusa kuhurvishvodari varuna
    hastijihva yashasvatyashvini gandhari pusha shankhini sarasvatida pingala sushumna ceti caturdasha
    nadyah| sarvasankshobhinyadicaturdasharaga devatah| pranapanavyanodanasamananagakurmakrikaradevadattadhananjaya
    iti dasha vayavah | sarvasiddhi prada devyo bahirdasharaga devatah| etadvayudashakasamsargopathibhedena
    recakapurakashoshakadahaka plavaka amritamiti pranamukhyatvena pancavidho 'sti | ksharako darakah
    kshobhako mohako jrimbhaka ityapalanamukhyatvena pancavidho 'sti | tena manushyana mmohako dahako
    bhakshyabhojyalehyacoshyapeya mpacayati| eta dasha vahnikala ssarvatvadyantardasharaga devatah| shitoshnasukhaduhkhecchasattvarajastamoguna
    vashinyadishaktayo sharuparasagandhah pancatanmatrah panca pushpabana mana ikshudhanuh| vashyo bano
    ragah pashah| dvesho 'nkushah| avyaktamahattattvamahadahankara iti kameshvarivajneshvaribhagamalinyo
    'ntastrikonagnaga devatah | pancadashatithirupena kalasya parinamavalokanasthitih pancadasha nitya
    shraddhanurupadhidevata| tayoh kameshvari sadanandaghana paripurnasvatmaikyarupa devata || || salilamiti
    sauhityakaranam sattvam | kartavyamakartavyamiti bhavanayukta upacarah| asti nastiti kartavyata upacarah|
    bahyabhyanta karananam rupagrahanayogyata 'stvityavahanam| tasya vahyabhyantahkarananamekarupavishayagrahanamasanam|
    raktashuklapadaikikarana mpadyam| ujjvalada modanandasanadanamarghyam| svaccham svata siddhamityacamaniyam|
    ciccandramayiti sarvangastravanam snanam| cidagnisvarupaparamanandashaktisphuranam va~stram| pratyekam
    saptavimshatidha bhinnatvenecchajnana kriyatmakabrahmagranthimadrasatantubrahmanadi brahmasutram|
    svavyatiriktavastusangarahitasmaranam vi~bhushanam| svacchasvaparipurnatasmarana ngandhah | samastavishayana
    ssthairyenanusandhana nkusumam | teshameva sarvada svikarana ndhupah | pavanavacchinnordhvagvalanasaccidulkakashadeho
    dipah | samastayataya nnaivedyam | avasthatrayanamekikarana ntambulam| muladharadabrahmarandhraparyanta
    ngatagatarupena pradakshinyam| turyavastha namaskarah | dehashunyapramatritanimajjana mbaliharanam|
    satyamasti kartavyamakartavyamaudasinyanityatmavilapanam homah| svaya mbhavanaparo jivanmukto bhavati|
    tasya devatatmaikyasiddhih| cintitakaryanya yatnena siddhayanti| sa eva shivayogiti kathyate ||
  devanagari: स्सर्वकारणभूता शक्तिः ॥ ॥ केन नवरन्ध्ररूपो देहः। नवशक्तिरूपं श्रीचक्रम। वाराही पितृरूपा।
    कुरुकुल्ला बलिदेवता माता। पुरुषार्था स्सागराः। देहो नवरत्नद्वीपः। आधारनवकमुद्रा शक्तयः। त्वगादिसप्तधातुभिर
    स्सङ्कल्पाः कल्पतरवः। तेज कल्पकोद्यानम्।रसनया भाव्यमाना मधुराम्लतिक्त ष्षडृतवः । क्रियाशक्तिः पीठम्।
    कुण्डलिनी ज्ञानशक्तिर्गृहम्। इच्छाशक्तिर्महात्रिपुरसुन्दरी। ज्ञाता होता ज्ञानमग्निः ज्ञेयं हविः। ज्ञातृज्ञानज्ञेयानामभेदभावनं
    श्रीचक्रपूजनम्। नियतिसहिता ऋङ्गारादयो नव रसा अणिमादयः। कामक्रोधलोभमोहमद मात्सर्यपुण्यपापमया ब्राह्मयाद्यष्टशक्तयः
    । पृथिव्यप्तेजोवाय्वाकाशश्रोत्रत्वक्चक्षुर्जिह्वाघ्राणवा क्पाणिपादपायूपस्थमनोविकारा ष्षोडश शक्तयः
    । वचनादानगमनविसर्गानन्दहानोपेक्षाबुद्धयो ऽष्टौ। अलम्बुसा कुहूर्विश्वोदरी वरुणा हस्तिजिह्वा यशस्वत्यश्विनी
    गान्धारी पूषा शङ्खिनी सरस्वतीडा पिङ्गला सुषुम्ना चेति चतुर्दश नाड्यः। सर्वसङ्क्षोभिण्यादिचतुर्दशारगा
    देवताः। प्राणापानव्यानोदानसमाननागकूर्मकृकरदेवदत्तधनञ्जया इति दश वायवः । सर्वसिद्धि प्रदा देव्यो बहिर्दशारगा
    देवताः। एतद्वायुदशकसंसर्गोपाथिभेदेन रेचकपूरकशोषकदाहक प्लावका अमृतमिति प्राणमुख्यत्वेन पञ्चविधो ऽस्ति
    । क्षारको दारकः क्षोभको मोहको जृम्भक इत्यपालनमुख्यत्वेन पञ्चविधो ऽस्ति । तेन मनुष्याणा म्मोहको दाहको
    भक्ष्यभोज्यलेह्यचोष्यपेया म्पाचयति। एता दश वह्निकला स्सर्वात्वाद्यन्तर्दशारगा देवताः। शीतोष्णसुखदुःखेच्छासत्त्वरजस्तमोगुणा
    वशिन्यादिशक्तयो शरूपरसगन्धाः पञ्चतन्मात्राः पञ्च पुष्पबाणा मन इक्षुधनुः। वश्यो बाणो रागः पाशः। द्वेषो
    ऽङ्कुशः। अव्यक्तमहत्तत्त्वमहदहङ्कार इति कामेश्वरीवज्नेश्वरीभगमालिन्यो ऽन्तस्त्रिकोणाग्नगा देवताः ।
    पञ्चदशतिथिरूपेण कालस्य परिणामावलोकनस्थितिः पञ्चदश नित्या श्रद्धानुरूपाधिदेवता। तयोः कामेश्वरी सदानन्दघना
    परिपूर्णस्वात्मैक्यरूपा देवता ॥ ॥ सलिलमिति सौहित्यकारणं सत्त्वम् । कर्तव्यमकर्तव्यमिति भावनायुक्त
    उपचारः। अस्ति नास्तीति कर्तव्यता उपचारः। बाह्याभ्यन्त करणानां रूपग्रहणयोग्यता ऽस्त्वित्यावाहनम्। तस्य
    वाह्याभ्यन्तःकरणानामेकरूपविषयग्रहणमासनम्। रक्तशुक्लपदैकीकरण म्पाद्यम्। उज्ज्वलदा मोदानन्दासनदानमर्घ्यम्।
    स्वच्छं स्वत सिद्धमित्याचमनीयम्। चिच्चन्द्रमयीति सर्वाङ्गस्त्रवणं स्नानम्। चिदग्निस्वरूपपरमानन्दशक्तिस्फुरणं
    वँस्त्रम्। प्रत्येकं सप्तविंशतिधा भिन्नत्वेनेच्छाज्ञान क्रियात्मकब्रह्मग्रन्थिमद्रसतन्तुब्रह्मनाडी
    ब्रह्मसूत्रम्। स्वव्यतिरिक्तवस्तुसङ्गरहितस्मरणं विँभूषणम्। स्वच्छस्वपरिपूर्णतास्मरण ङ्गन्धः । समस्तविषयाणा
    स्स्थैर्येणानुसन्धान ङ्कुसुमम् । तेषामेव सर्वदा स्वीकरण न्धूपः । पवनावच्छिन्नोर्ध्वग्वलनसच्चिदुल्काकाशदेहो
    दीपः । समस्तयाताया न्नैवेद्यम् । अवस्थात्रयाणामेकीकरण न्ताम्बूलम्। मूलाधारादाब्रह्मरन्ध्रपर्यन्त ङ्गतागतरूपेण
    प्रादक्षिण्यम्। तुर्यावस्था नमस्कारः । देहशून्यप्रमातृतानिमज्जन म्बलिहरणम्। सत्यमस्ति कर्तव्यमकर्तव्यमौदासीन्यनित्यात्मविलापनं
    होमः। स्वय म्भावनापरो जीवन्मुक्तो भवति। तस्य देवतात्मैक्यसिद्धिः। चिन्तितकार्याण्य यत्नेन सिद्धयन्ति।
    स एव शिवयोगीति कथ्यते ॥
