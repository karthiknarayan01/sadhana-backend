id: stutih
category: stotram
name:
  english: stutih
  devanagari: स्तुतिः
content:
  english: tryai namo namah || 622|| om namaste'nnapurnayai brahmadhatryai namo namah | om namaste'nnapurnayai
    devadhatryai namo namah || 623|| om namaste'nnapurnayai prithvidhatryai namo namah | om namaste'nnapurnayai
    shaivadhatryai namo namah || 624|| om namaste'nnapurnayai vanadhatryai namo namah | om namaste'nnapurnayai
    nadidhatryai namo namah || 625|| om namaste'nnapurnayai abdhidhatryai namo namah | om namaste'nnapurnayai
    dvipadhatryai namo namah || 626|| om namaste'nnapurnayai annadha
  devanagari: त्र्यै नमो नमः ॥ ६२२॥ ॐ नमस्तेऽन्नपूर्णायै ब्रह्मधात्र्यै नमो नमः । ॐ नमस्तेऽन्नपूर्णायै
    देवधात्र्यै नमो नमः ॥ ६२३॥ ॐ नमस्तेऽन्नपूर्णायै पृथ्वीधात्र्यै नमो नमः । ॐ नमस्तेऽन्नपूर्णायै शैवधात्र्यै
    नमो नमः ॥ ६२४॥ ॐ नमस्तेऽन्नपूर्णायै वनधात्र्यै नमो नमः । ॐ नमस्तेऽन्नपूर्णायै नदीधात्र्यै नमो नमः
    ॥ ६२५॥ ॐ नमस्तेऽन्नपूर्णायै अब्धिधात्र्यै नमो नमः । ॐ नमस्तेऽन्नपूर्णायै द्वीपधात्र्यै नमो नमः ॥ ६२६॥
    ॐ नमस्तेऽन्नपूर्णायै अन्नधा
