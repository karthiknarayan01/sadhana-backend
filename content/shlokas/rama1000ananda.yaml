id: rama1000ananda
category: sahasranama
name:
  english: rama1000ananda
  devanagari: रम१०००आनन्द
content:
  english: rinushvaikamanah stotram guhyadguhyataram mahat || 29|| rishirvinayakashcasya hyanushtup chanda
    ucyate | parabrahmatmako ramo devata shubhadarshane || 30|| om asya shriramasahasranamamalamantrasya
    vinayaka rishih | anushtup chandah | shriramo devata | mahavishnuriti bijam | gunabhrinnirguno mahaniti
    shaktih | saccidanandavigraha iti kilakam | shriramaprityarthe jape viniyogah || angulinyasah om shriramacandraya
    angushthabhyam namah | sitapataye tarjanibhyam namah | raghunathaya madhyamabhyam namah | bharatagrajaya
    anamikabhyam namah | dasharathatmajaya kanishthikabhyam namah | hanumatprabhave karatalakaraprishthabhyam
    namah || hridayadinyasah om shriramacandraya hridayaya namah | sitapataye shirase svaha | raghunathaya
    shikhayai vashat | bharatagrajaya kavacaya hum | dasharathatmajaya netratrayaya vaushat | hanumatprabhave
    astraya phat || atha dhyanam | dhyayedajanubahum dhritasharadhanusham baddhapadmasanastham pitam vaso
    vasanam navakamalaspardhi netram prasannam | vamankarudhasitamukhakamalamilallocanam niradabham nanalankaradiptam
    dadhatamurujatamandalam ramacandram || 31|| vaidehisahitam suradrumatale haime mahamandape madhye
    pushpakamasane manimaye virasane samsthitam | agre vacayati prabhanjanesute tattvam munibhyah param
    vyakhyantam bharatadibhih parivritam ramam bhaje shyamalam || 32|| sauvarnamandape divye pushpake
    suvirajite | mule kalpataroh svarnapithe simhashtasamyute || 33|| mridushlakshnatare tatra janakya
    saha samsthitam | ramam nilotpalashyamam dvibhujam pitavasasam || 34|| smitavaktram sukhasinam padmapatranibhekshanam
    | kiritaharakeyurakundalaih katakadibhih || 35|| bhrajamanam jnanamudradharam virasanasthitam | sprishantam
    stanayoragre janakyah savyapanina || 36|| vasishthavamadevadyaih sevitam lakshmanadibhih | ayodhyanagare
    ramye hyabhishiktam raghudvaham || 37|| evam dhyatva japennityam ramanamasahasrakam | hatyakotiyuto
    vapi mucyate natra samshayah || 38||
  devanagari: ृणुष्वैकमनाः स्तोत्रं गुह्याद्गुह्यतरं महत् ॥ २९॥ ऋषिर्विनायकश्चास्य ह्यनुष्टुप् छन्द उच्यते
    । परब्रह्मात्मको रामो देवता शुभदर्शने ॥ ३०॥ ॐ अस्य श्रीरामसहस्रनाममालामन्त्रस्य विनायक ऋषिः । अनुष्टुप्
    छन्दः । श्रीरामो देवता । महाविष्णुरिति बीजम् । गुणभृन्निर्गुणो महानिति शक्तिः । सच्चिदानन्दविग्रह
    इति कीलकम् । श्रीरामप्रीत्यर्थे जपे विनियोगः ॥ अङ्गुलिन्यासः ॐ श्रीरामचन्द्राय अङ्गुष्ठाभ्यां नमः
    । सीतापतये तर्जनीभ्यां नमः । रघुनाथाय मध्यमाभ्यां नमः । भरताग्रजाय अनामिकाभ्यां नमः । दशरथात्मजाय
    कनिष्ठिकाभ्यां नमः । हनुमत्प्रभवे करतलकरपृष्ठाभ्यां नमः ॥ हृदयादिन्यासः ॐ श्रीरामचन्द्राय हृदयाय नमः
    । सीतापतये शिरसे स्वाहा । रघुनाथाय शिखायै वषट् । भरताग्रजाय कवचाय हुम् । दशरथात्मजाय नेत्रत्रयाय वौषट्
    । हनुमत्प्रभवे अस्त्राय फट् ॥ अथ ध्यानम् । ध्यायेदाजानुबाहुं धृतशरधनुषं बद्धपद्मासनस्थं पीतं वासो
    वसानं नवकमलस्पर्धि नेत्रं प्रसन्नम् । वामाङ्कारूढसीतामुखकमलमिलल्लोचनं नीरदाभं नानालङ्कारदीप्तं दधतमुरुजटामण्डलं
    रामचन्द्रम् ॥ ३१॥ वैदेहीसहितं सुरद्रुमतले हैमे महामण्डपे मध्ये पुष्पकमासने मणिमये वीरासने संस्थितम्
    । अग्रे वाचयति प्रभञ्जनेसुते तत्त्वं मुनिभ्यः परं व्याख्यान्तं भरतादिभिः परिवृतं रामं भजे श्यामलम्
    ॥ ३२॥ सौवर्णमण्डपे दिव्ये पुष्पके सुविराजिते । मूले कल्पतरोः स्वर्णपीठे सिंहाष्टसंयुते ॥ ३३॥ मृदुश्लक्ष्णतरे
    तत्र जानक्या सह संस्थितम् । रामं नीलोत्पलश्यामं द्विभुजं पीतवाससम् ॥ ३४॥ स्मितवक्त्रं सुखासीनं पद्मपत्रनिभेक्षणम्
    । किरीटहारकेयूरकुण्डलैः कटकादिभिः ॥ ३५॥ भ्राजमानं ज्ञानमुद्राधरं वीरासनस्थितम् । स्पृशन्तं स्तनयोरग्रे
    जानक्याः सव्यपाणिना ॥ ३६॥ वसिष्ठवामदेवाद्यैः सेवितं लक्ष्मणादिभिः । अयोध्यानगरे रम्ये ह्यभिषिक्तं
    रघूद्वहम् ॥ ३७॥ एवं ध्यात्वा जपेन्नित्यं रामनामसहस्रकम् । हत्याकोटियुतो वापि मुच्यते नात्र संशयः ॥
    ३८॥
