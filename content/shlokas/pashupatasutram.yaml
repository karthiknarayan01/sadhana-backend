id: pashupatasutram
category: sutra
name:
  english: pashupatasutram
  devanagari: पाशुपतसूत्रम्
content:
  english: pashupatasutram || om shrisaccidanandaya namah || atha shrilakulishakritam pashupatasutram
    | prathamo'dhyayah | || padarthopanyasah || athatah pashupateh pashupatam yogavidhim vyakhyasyamah
    || 1
  devanagari: पाशुपतसूत्रम् ॥ ॐ श्रीसच्चिदानन्दाय नमः ॥ अथ श्रीलकुलीशकृतं पाशुपतसूत्रम् । प्रथमोऽध्यायः
    । ॥ पदार्थोपन्यासः ॥ अथातः पशुपतेः पाशुपतं योगविधिं व्याख्यास्यामः ॥ १
meaning: {}
