id: ramanapratassmaranastotram
category: stotram
name:
  english: ramanapratassmaranastotram
  devanagari: रमणप्रातस्स्मरणस्तोत्रम्
content:
  english: mahmonivaranacanam ramanam yatindram || 4|| pratarbruve ramanapavananamadheyam yadbhagadheyamakhilasya
    tanoti jantoh | amreditam harati yadvrijinam samastam yena kramadbhavatiso'hamiti prabodhah || 5||
    yah shlokapancakamidam pathati prabhate saubhagyadam bhagavato ramaneshvarasya | tasmai samastajanakarmaphalapradata
    shreyassa eva ramanassakalam dadati || 6|| iti shriramanapratassmaranastotram samaptam ||
  devanagari: मह्मोनिवारणचणं रमणं यतीन्द्रम् ॥ ४॥ प्रातर्ब्रुवे रमणपावननामधेयं यद्भागधेयमखिलस्य तनोति
    जन्तोः । आम्रेडितं हरति यद्वृजिनं समस्तं येन क्रमाद्भवतिसोऽहमिति प्रबोधः ॥ ५॥ यः श्लोकपञ्चकमिदं पठति
    प्रभाते सौभाग्यदं भगवतो रमणेश्वरस्य । तस्मै समस्तजनकर्मफलप्रदाता श्रेयस्स एव रमणस्सकलं ददाति ॥ ६॥
    इति श्रीरमणप्रातस्स्मरणस्तोत्रं समाप्तम् ॥
meaning: {}
