id: devaihkritam01vishnustotram
category: stotram
name:
  english: devaihkritam01vishnustotram
  devanagari: देवैःकृतं०१विष्णुस्तोत्रम्
content:
  english: devaih kritam 1 vishnustotram deva ucuh | tvam trata jagatam natha devanam kirtivardhana |
    sarveshvara jagadyone trayimurte namo'stu te || 7|| lokasrashta'suranhanta tvameva jagatam patih |
    sthityutpattivinashanam karanam tvam jaganmaya || 8|| trata na ko'pyasti jagattraye'pi sharirinam
    sarvavipadgatanam | tvaya vina varijapatranetra tapatrayanam sharanam na canyat || 9|| pita ca mata
    jagato'khilasya tvameva sevasulabho'si vishno | prasida pahisha mahabhayebhyo'smadartihanta vada kastvadanyah
    || 10|| adikarta varahastvam matsyah kurmastathaiva ca | ityadirupabhedairno rakshase bhaya agate
    || 11|| hritasvamyansuraganan hritadarangatapadah | kasmanna rakshase deva ananyasharanan hare ||
    12|| iti brahmapurane ekasaptatitamadhyayantargatam devaih kritam vishnustotram samaptam | brahmapurana
    | adhyaya 71
  devanagari: देवैः कृतं १ विष्णुस्तोत्रम् देवा ऊचुः । त्वं त्राता जगतां नाथ देवानां कीर्तिवर्धन । सर्वेश्वर
    जगद्योने त्रयीमूर्ते नमोऽस्तु ते ॥ ७॥ लोकस्रष्टाऽसुरान्हन्ता त्वमेव जगतां पतिः । स्थित्युत्पत्तिविनाशानां
    कारणं त्वं जगन्मय ॥ ८॥ त्राता न कोऽप्यस्ति जगत्त्रयेऽपि शरीरिणां सर्वविपद्गतानाम् । त्वया विना वारिजपत्रनेत्र
    तापत्रयाणां शरणं न चान्यत् ॥ ९॥ पिता च माता जगतोऽखिलस्य त्वमेव सेवासुलभोऽसि विष्णो । प्रसीद पाहीश
    महाभयेभ्योऽस्मदार्तिहन्ता वद कस्त्वदन्यः ॥ १०॥ आदिकर्ता वराहस्त्वं मत्स्यः कूर्मस्तथैव च । इत्यादिरूपभेदैर्नो
    रक्षसे भय आगते ॥ ११॥ हृतस्वाम्यान्सुरगणान् हृतदारान्गतापदः । कस्मान्न रक्षसे देव अनन्यशरणान् हरे ॥
    १२॥ इति ब्रह्मपुराणे एकसप्ततितमाध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण ।
    अध्याय ७१
