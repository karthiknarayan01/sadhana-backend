id: vishvakarmanakritamsuryastotram-23
category: stotram
name:
  english: vishvakarmanakritamsuryastotram 23
  devanagari: विश्वकर्मणाकृतंसूर्यस्तोत्रम् २३
content:
  english: 17|| vivasvate pranatajananukampine mahatmane samajavasaptasaptaye | satejase kamalakulalibandhave
    sada tamahpatalapatavapatine || 171|| pavanatishayasarvacakshushe naikakamavishayapradayine | bhasuramalamayukhamaline
    sarvabhutahitakarine namah || 172|| ajaya lokatrayabhavanaya bhutatmane gopataye vrishaya | namo mahakarunikottamaya
    suryaya vastuprabhavalayaya || 173|| vivasvate jnanabhrite'ntaratmane jagatpratishthaya jagaddhitaishine
    | svayambhuve nirmalalokacakshushe surottamayamitatejase namah || 174|| kshanamudayacalabhalitarccih
    suraganagitigarishthagitah | tvamuta mayukhasahasravajjagati vikasitapadmanabhah || 175|| tava timirasavapanamadadbhavati
    vilohitavigrahata | mihiravibhasataya sutaram tribhuvanabhavanamatraparah || 176|| rathamaruhya samavayavam
    ruciravikalitadivyahayam | satatamaribale bhagavamshcarasi jagaddhitabaddharasah || 177|| amritamayena
    rasena samam vibudhapitrinapi tarppayase | ariganasudana tena tava pranatimupetya likhami vapuh ||
    178|| shubhasamavarnamayam racitam tava padapamsupavitratamam | natajanavatsala mam pranatam tribhuvanapavana
    pahi rave || 179|| iti sakalajagatprasutibhutam tribhuvanabhavanadhamahetumekam | ravimakhilajagatpradipabhutam
    tridashavaram pranato'smi devadevam || 1
  devanagari: १७॥ विवस्वते प्रणतजनानुकम्पिने महात्मने समजवसप्तसप्तये । सतेजसे कमलकुलालिबन्धवे सदा तमःपटलपटावपाटिने
    ॥ १७१॥ पावनातिशयसर्वचक्षुषे नैककामविषयप्रदायिने । भासुरामलमयूखमालिने सर्वभूतहितकारिणे नमः ॥ १७२॥ अजाय
    लोकत्रयभावनाय भूतात्मने गोपतये वृषाय । नमो महाकारुणिकोत्तमाय सूर्याय वस्तुप्रभवालयाय ॥ १७३॥ विवस्वते
    ज्ञानभृतेऽन्तरात्मने जगत्प्रतिष्ठाय जगद्धितैषिणे । स्वयम्भुवे निर्मललोकचक्षुषे सुरोत्तमायामिततेजसे
    नमः ॥ १७४॥ क्षणमुदयाचलभालितार्च्चिः सुरगणगीतिगरिष्ठगीतः । त्वमुत मयूखसहस्रवज्जगति विकासितपद्मनाभः
    ॥ १७५॥ तव तिमिरासवपानमदाद्भवति विलोहितविग्रहता । मिहिरविभासतया सुतरां त्रिभुवनभावनमात्रपरः ॥ १७६॥
    रथमारुह्य समावयवं रुचिरविकलितदिव्यहयम् । सततमरिबले भगवंश्चरसि जगद्धितबद्धरसः ॥ १७७॥ अमृतमयेन रसेन
    समं विबुधपितॄनपि तर्प्पयसे । अरिगणसूदन तेन तव प्रणतिमुपेत्य लिखामि वपुः ॥ १७८॥ शुभसमवर्णमयं रचितं
    तव पदपांसुपवित्रतमम् । नतजनवत्सल मां प्रणतं त्रिभुवनपावन पाहि रवे ॥ १७९॥ इति सकलजगत्प्रसूतिभूतं त्रिभुवनभावनधामहेतुमेकम्
    । रविमखिलजगत्प्रदीपभूतं त्रिदशवरं प्रणतोऽस्मि देवदेवम् ॥ १
