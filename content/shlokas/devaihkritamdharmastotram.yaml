id: devaihkritamdharmastotram
category: stotram
name:
  english: devaihkritamdharmastotram
  devanagari: देवैःकृतंधर्मस्तोत्रम्
content:
  english: ringastrilocanah | saptahastastribandhashca vrisharupa namo'stu te || 24|| tvaya hina vayam
    deva sarva unmargavarttinah | tanmargam yaccha mudhanam tvam hi nah parama gatih || 25|| evam stutastada
    devairvrisharupi prajapatih | tushtah prasannamanasa shantacakshurapashyata || 26|| drishtamatrastu
    te devah svayam dharmena cakshusha | kshanena gatasammohah samyaksaddharmasamhitah || 27|| asura api
    tadvacca tato brahma uvaca tam | adyaprabhriti te dharma tithirastu trayodashi || 28|| yastamuposhya
    purusho bhavantam samuparjayet | kritva papasamaharam tasmanmuncati manavah || 29|| yaccaranyamidam
    dharmma tvaya vyaptam ciram prabho | tato namna bhavishye taddharmaranyamiti prabho || 30|| catustripad
    dvyekapacca prabho tvam kritadibhirllakshyase yena lokaih | tatha tatha karmabhumau nabhashca prayoyuktah
    svagriham pahi vishvam || 31|| ityuktamatrah prapitamaho'dhuna surasuranamatha pashyatam nripa | adrishyatamagamat
    svalayamshca jagmuh surah savrisha vitashokah || 32|| dharmotpattim ya imam shravayita tada shraddhe
    tarpayeta pitrimshca | trayodashyam payasena svashaktya sa svargagami tu suranupeyat || 33|| iti varahapurane
    dvatrimshadhyayantargatam devaih kritam dharmastotram samaptam | varahapurana | adhyaya 32
  devanagari: ृङ्गस्त्रिलोचनः । सप्तहस्तस्त्रिबन्धश्च वृषरूप नमोऽस्तु ते ॥ २४॥ त्वया हीना वयं देव सर्व
    उन्मार्गवर्त्तिनः । तन्मार्गं यच्छ मूढानां त्वं हि नः परमा गतिः ॥ २५॥ एवं स्तुतस्तदा देवैर्वृषरूपी
    प्रजापतिः । तुष्टः प्रसन्नमनसा शान्तचक्षुरपश्यत ॥ २६॥ दृष्टमात्रास्तु ते देवाः स्वयं धर्मेण चक्षुषा
    । क्षणेन गतसम्मोहाः सम्यक्सद्धर्मसंहिताः ॥ २७॥ असुरा अपि तद्वच्च ततो ब्रह्मा उवाच तम् । अद्यप्रभृति
    ते धर्म तिथिरस्तु त्रयोदशी ॥ २८॥ यस्तामुपोष्य पुरुषो भवन्तं समुपार्जयेत् । कृत्वा पापसमाहारं तस्मान्मुञ्चति
    मानवः ॥ २९॥ यच्चारण्यमिदं धर्म्म त्वया व्याप्तं चिरं प्रभो । ततो नाम्ना भविष्ये तद्धर्मारण्यमिति प्रभो
    ॥ ३०॥ चतुस्त्रिपाद् द्व्येकपाच्च प्रभो त्वं कृतादिभिर्ल्लक्ष्यसे येन लोकैः । तथा तथा कर्मभूमौ नभश्च
    प्रायोयुक्तः स्वगृहं पाहि विश्वम् ॥ ३१॥ इत्युक्तमात्रः प्रपितामहोऽधुना सुरासुराणामथ पश्यतां नृप ।
    अदृश्यतामगमत् स्वालयांश्च जग्मुः सुराः सवृषा वीतशोकाः ॥ ३२॥ धर्मोत्पत्तिं य इमां श्रावयीत तदा श्राद्धे
    तर्पयेत पितॄंश्च । त्रयोदश्यां पायसेन स्वशक्त्या स स्वर्गगामी तु सुरानुपेयात् ॥ ३३॥ इति वराहपुराणे
    द्वात्रिंशाध्यायान्तर्गतं देवैः कृतं धर्मस्तोत्रं समाप्तम् । वराहपुराण । अध्याय ३२
