id: maithilimahopanishat
category: upanishad
name:
  english: maithilimahopanishat
  devanagari: मैथिलीमहोपनिषत्
content:
  english: dhanakami dhana prapta karata hai | vidyarthi vidya prapta karata hai | jo jo cahata hai so
    saba samane upasthita dekhata hai | atah vahi ramashadakshara mantra raja saba mantrom mem shreshtha
    hai | vahi kalyanom karana hai | vahi japane ka yogya hai || 4|| imameva manum purvam saketapatirmamivocat
    | aham hanumate mama priyaya priyataraya | sarveda vedine brahmane | sa vasishthaya | sa parasharaya
    | sa vyasaya | sa shukaya | ityeshopanishat ityesha brahmavidya | yahi shadakshara ramamantra saketa
    ke svami sarveshvara shriramacandraji ne mujhe kaha | arthat savidhi upadesha diya | maimne mere priyatipriya
    sevaka shrihanumanaji ko kaha upadesha diya | shrihanumanaji ne veda ke jnata shribrahmaji ko kaha
    upadesha diya | brahmaji ne vasishthaji ko kaha upadesha diya | vasishthaji ne parashara ji ko upadesha
    diya | parashara ji ne vyasaji ko upadesha diya | vyasaji ne shukadevaji kaha upadesha diya | yahi
    upanishat hai
  devanagari: धनकामी धन प्राप्त करता है । विद्यार्थी विद्या प्राप्त करता है । जो जो चाहता है सो सब सामने
    उपस्थित देखता है । अतः वही रामषडक्षर मन्त्र राज सब मन्त्रों में श्रेष्ठ है । वही कल्याणों कारण है
    । वही जपने का योग्य है ॥ ४॥ इममेव मनुं पूर्वं साकेतपतिर्मामिवोचत् । अहं हनुमते मम प्रियाय प्रियतराय
    । सर्वेद वेदिने ब्रह्मणे । स वसिष्ठाय । स पराशराय । स व्यासाय । स शुकाय । इत्येषोपनिषत् इत्येषा ब्रह्मविद्या
    । यही षडक्षर राममन्त्र साकेत के स्वामी सर्वेश्वर श्रीरामचन्द्रजी ने मुझे कहा । अर्थात् सविधि उपदेश
    दिया । मैंने मेरे प्रियातिप्रिय सेवक श्रीहनुमानजी को कहा उपदेश दिया । श्रीहनुमानजी ने वेद के ज्ञाता
    श्रीब्रह्माजी को कहा उपदेश दिया । ब्रह्माजी ने वसिष्ठजी को कहा उपदेश दिया । वसिष्ठजी ने पराशर जी को
    उपदेश दिया । पराशर जी ने व्यासजी को उपदेश दिया । व्यासजी ने शुकदेवजी कहा उपदेश दिया । यही उपनिषत्
    है
