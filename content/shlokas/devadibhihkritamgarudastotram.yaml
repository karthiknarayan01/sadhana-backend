id: devadibhihkritamgarudastotram
category: stotram
name:
  english: devadibhihkritamgarudastotram
  devanagari: देवादिभिःकृतंगरुडस्तोत्रम्
content:
  english: devadibhih kritam garudastotram tvamrishistvam mahabhagastvam devah patageshvarah | tvam prabhustapanaprakhyastvam
    nastranamanuttamam || 10|| balormimansadhuradinasattvah samriddhimandushprasahastvameva | tapah shrutam
    sarvamahinakirte anagatam copagatam ca sarvam || 11|| tvamuttamah sarvamidam caracaram gabhastibhirbhanurivavabhasase
    | samakshipanbhanumatah prabham muhu stvamantakah sarvamidam dhruvadhruvam || 12|| divakarah parikupito
    yatha dahe tprajastatha dahasi hutashanaprabha | bhayankarah pralaya ivagnirutthito vinashayanyugaparivartanantakrit
    || 13|| khageshvaram sharanamupasthita vayam mahaujasam vitimiramabhragocaram | mahabalam garudamupetya
    khecaram paravaram varadamajayyavikramam || 14|| evam stutah suparnastu devaih sarshiganaistada |
    tejasah pratisamharamatmanah sa cakara ha || 15|| iti mahabharate adiparvani 20 adhyayantargatam devadibhih
    kritam garudastotram sampurnam | mahabharata | adiparva | adhyaya 20
  devanagari: देवादिभिः कृतं गरुडस्तोत्रम् त्वमृषिस्त्वं महाभागस्त्वं देवः पतगेश्वरः । त्वं प्रभुस्तपनप्रख्यस्त्वं
    नस्त्राणमनुत्तमम् ॥ १०॥ बलोर्मिमान्साधुरदीनसत्त्वः समृद्धिमान्दुष्प्रसहस्त्वमेव । तपः श्रुतं सर्वमहीनकीर्ते
    अनागतं चोपगतं च सर्वम् ॥ ११॥ त्वमुत्तमः सर्वमिदं चराचरं गभस्तिभिर्भानुरिवावभाससे । समाक्षिपन्भानुमतः
    प्रभां मुहु स्त्वमन्तकः सर्वमिदं ध्रुवाध्रुवम् ॥ १२॥ दिवाकरः परिकुपितो यथा दहे त्प्रजास्तथा दहसि हुताशनप्रभ
    । भयङ्करः प्रलय इवाग्निरुत्थितो विनाशयन्युगपरिवर्तनान्तकृत् ॥ १३॥ खगेश्वरं शरणमुपस्थिता वयं महौजसं
    वितिमिरमभ्रगोचरम् । महाबलं गरुडमुपेत्य खेचरं परावरं वरदमजय्यविक्रमम् ॥ १४॥ एवं स्तुतः सुपर्णस्तु देवैः
    सर्षिगणैस्तदा । तेजसः प्रतिसंहारमात्मनः स चकार ह ॥ १५॥ इति महाभारते आदिपर्वणि २० अध्यायान्तर्गतं देवादिभिः
    कृतं गरुडस्तोत्रं सम्पूर्णम् । महाभारत । आदिपर्व । अध्याय २०
meaning: {}
