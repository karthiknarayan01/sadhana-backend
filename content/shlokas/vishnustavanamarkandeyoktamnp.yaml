id: vishnustavanamarkandeyoktamnp
category: stotram
name:
  english: vishnustavanamarkandeyoktamnP
  devanagari: विष्णुस्तवनमार्कण्डेयोक्तम्ण्P
content:
  english: prasida bhagavan vishno prasida purushottama | prasida devadevesha prasida garudadhvaja ||
    2|| prasida vishno lakshmisha prasida dharanidhara | prasida lokanathadya prasida parameshvara ||
    3|| prasida sarvadevesha prasida kamalekshana | prasida mandaradhara prasida madhusudana || 4|| prasida
    subhagakanta prasida bhuvanadhipa | prasidadya mahadeva prasida mama keshava || 5|| jaya krishna jayacintya
    jaya vishno jayavyaya | jaya vishva jayavyakta jaya vishno namo'stu te || 6|| jaya deva jayajeya jaya
    satya jayakshara | jaya kala jayeshana jaya sarva namo'stu te || 7|| jaya yajnapate natha jaya vishvapate
    vibho | jaya bhutapate natha jaya sarvapate vibho || 8|| jaya vishvapate natha jaya daksha namo'stu
    te | jaya papaharananta jaya janmajarapaha || 9|| jaya bhadratibhadresha jaya bhadra namo'stu te |
    jaya kamada kakutstha jaya manada madhava || 10|| jaya shamkara devesha jaya shrisha namo'stu te |
    jaya kunkumaraktabha jaya pankajalocana || 11|| jaya candanaliptanga jaya rama namo'stu te | jaya
    deva jagannatha jaya devakinandana || 12|| jaya sarvaguro jneya jaya shambho namo'stu te | jaya sundara
    padmabha jaya sundarivallabha | jaya sundarasarvanga jaya vandya namo'stu te || 13|| jaya sarvada
    sarvesha jaya sharmada shashvata | jaya kamada bhaktanam prabhavishno namo'stu te || 14|| namah kamalanabhaya
    namah kamalamaline | lokanatha namaste'stu virabhadra namo'stu te || 15|| namastrailokyanathaya caturmurte
    jagatpate | namo devadhidevaya namo narayanaya te || 16|| namaste vasudevaya namaste pitavasase |
    namaste narasimhaya namaste sharngadharine || 17|| namah krishnaya ramaya namashcakrayudhaya ca |
    namah shivaya devaya namaste bhuvaneshvara || 18|| namo vedantavedyaya namo'nantaya vishnave | namaste
    sakaladhyaksha namaste shridharacyuta || 19|| lokadhyaksha jagatpujya paramatman namo'stu te | tvam
    mata sarvalokanam tvameva jagatah pita || 20|| tvamartanam suhrinmitram priyastvam prapitamahah |
    tvam gurustvam gatih sakshi tvam patistvam parayanah || 21|| tvam dhruvastvam vashatkarta tvam havistvam
    hutashanah | tvam shivastvam vasurdhata tvam brahma tvam sureshvarah || 22|| tvam yamastvam ravirvayustvam
    jalam tvam dhaneshvarah | tvam manustvamahoratram tvam nisha tvam nishakarah | tvam dhritistvam shriyah
    kantistvam kshama tvam dharadharah || 23|| tvam karta jagatamishastvam hanta madhusudana | tvameva
    gopta sarvasya jagatastvam caracara || 24|| karanam karanam karta tvameva parameshvarah | shankhacakragadapane
    bho samuddhara madhava || 25|| priya padmapalashaksha sheshaparyankashayinam | tvameva bhaktya satatam
    namami purushottamam || 26|| shrivatsankam jagadbijam shyamalam kamalekshanam | namami te vapurdeva
    kalikalmashanashanam || 27|| lakshmidharamudarangam divyamalavibhushitam | caruprishtham mahabahum
    carubhushanabhushitam || 28|| padmanabham vishalaksham padmapatranibhekshanam | dirghatungamahaghranam
    nilajimutasamnibham || 29|| dirghabahum suguptangam ratnaharojjvalorasam | subhrulalatamukutam snigdhadantam
    sulocanam || 30|| carubahum sutamroshtham ratnojjvalitakundalam | vrittakantham supinamsam sarasam
    shridharam harim || 31|| sukumaramajam nityam nilakuncitamurdhajam | unnatamsam mahoraskam karnantayatalocanam
    || 32|| hemaravindavadanamindirayanamishvaram | sarvalokavidhataram sarvapapaharam harim || 33|| sarvalakshanasampannam
    sarvasattvamanoramam | vishnumacyutamishanamanantam purushottamam || 34|| nato'smi manasa nityam narayanamanamayam
    | varadam kamadam kantamanantam sunritam shivam || 35|| namami shirasa vishno sada tvam bhaktavatsala
    | asminnekarnave ghore vayuskampitacancale || 36|| anantabhogashayane sahasraphanashobhite | vicitrashayane
    ramye sevite mandavayuna || 37|| bhujapanjarasamsaktakamalalayasevitam | iha tvam manasa sarvamidanim
    drishtavanaham || 38|| idanim tu suduhkhartho mayaya tava mohitah | ekodake niralambe nashtasthavarajangame
    || 39|| shunye tamasi dushpare duhkhapanke niramaye | shitatapajararogashokatrishnadibhih sada ||
    40|| pidito'smi bhrisham tata suciram kalamacyuta | shokamohagrahagrasto vicaran bhavasagare || 41||
    ihadya vidhina praptastava padabjasamnidhau | ekarnave mahaghore dustare duhkhapiditah || 42|| cirabhramaparishrantastvamadya
    sharanam gatah | prasida sumahamaya vishno rajivalocana || 43|| vishvayone vishalaksha vishvatman
    vishvasambhava | ananyasharanam praptamato'tra kulanandana || 44|| trahi mam kripaya krishna sharanagatamaturam
    | namaste pundarikaksha puranapurushottama || 45|| anjanabha hrishikesha mayamaya namo'stu te | mamuddhara
    mahabaho magne samsarasagare || 46|| gahvare dustare duhkhaklishte kleshamahagrahaih | anatham kripanam
    dinam patitam bhavasagare | mam samuddhara govinda varadesha namo'stu te || 47|| namastrailokyanathaya
    haraye bhudharaya ca | devadeva namaste'stu shrivallabha namo'stu te || 48|| krishna krishna kripalustvamagatinam
    gatirbhavan | samsararnavamagnanam prasida madhusudana || 49|| tvamekamadyam purusham puranam jagatpatim
    karanamacyutam prabhum | janardanam janmajarartinashanam sureshvaram sundaramindirapatim || 50|| brihadbhujam
    shyamalakomalam shubham varananam varijapatranetram | taramgabhangayatakuntalam harim sukantamisham
    pranato'smi shashvatam || 51|| sa jihva ya harim stauti taccittam yattvadarpitam | taveva kevalau
    shlaghyau yau tvatpujakarau karau || 52|| janmantarasahasreshu yanmaya patakam kritam | tanme hara
    tvam govinda vasudeveti kirtanat || 53|| vyasa uvaca
  devanagari: प्रसीद भगवन् विष्णो प्रसीद पुरुषोत्तम । प्रसीद देवदेवेश प्रसीद गरुडध्वज ॥ २॥ प्रसीद विष्णो
    लक्ष्मीश प्रसीद धरणीधर । प्रसीद लोकनाथाद्य प्रसीद परमेश्वर ॥ ३॥ प्रसीद सर्वदेवेश प्रसीद कमलेक्षण ।
    प्रसीद मन्दरधर प्रसीद मधुसूदन ॥ ४॥ प्रसीद सुभगाकान्त प्रसीद भुवनाधिप । प्रसीदाद्य महादेव प्रसीद मम
    केशव ॥ ५॥ जय कृष्ण जयाचिन्त्य जय विष्णो जयाव्यय । जय विश्व जयाव्यक्त जय विष्णो नमोऽस्तु ते ॥ ६॥ जय
    देव जयाजेय जय सत्य जयाक्षर । जय काल जयेशान जय सर्व नमोऽस्तु ते ॥ ७॥ जय यज्ञपते नाथ जय विश्वपते विभो
    । जय भूतपते नाथ जय सर्वपते विभो ॥ ८॥ जय विश्वपते नाथ जय दक्ष नमोऽस्तु ते । जय पापहरानन्त जय जन्मजरापह
    ॥ ९॥ जय भद्रातिभद्रेश जय भद्र नमोऽस्तु ते । जय कामद काकुत्स्थ जय मानद माधव ॥ १०॥ जय शंकर देवेश जय
    श्रीश नमोऽस्तु ते । जय कुङ्कुमरक्ताभ जय पङ्कजलोचन ॥ ११॥ जय चन्दनलिप्ताङ्ग जय राम नमोऽस्तु ते । जय
    देव जगन्नाथ जय देवकीनन्दन ॥ १२॥ जय सर्वगुरो ज्ञेय जय शम्भो नमोऽस्तु ते । जय सुन्दर पद्माभ जय सुन्दरिवल्लभ
    । जय सुन्दरसर्वाङ्ग जय वन्द्य नमोऽस्तु ते ॥ १३॥ जय सर्वद सर्वेश जय शर्मद शाश्वत । जय कामद भक्तानां
    प्रभविष्णो नमोऽस्तु ते ॥ १४॥ नमः कमलनाभाय नमः कमलमालिने । लोकनाथ नमस्तेऽस्तु वीरभद्र नमोऽस्तु ते ॥
    १५॥ नमस्त्रैलोक्यनाथाय चतुर्मूर्ते जगत्पते । नमो देवाधिदेवाय नमो नारायणाय ते ॥ १६॥ नमस्ते वासुदेवाय
    नमस्ते पीतवाससे । नमस्ते नरसिंहाय नमस्ते शार्ङ्गधारिणे ॥ १७॥ नमः कृष्णाय रामाय नमश्चक्रायुधाय च ।
    नमः शिवाय देवाय नमस्ते भुवनेश्वर ॥ १८॥ नमो वेदान्तवेद्याय नमोऽनन्ताय विष्णवे । नमस्ते सकलाध्यक्ष नमस्ते
    श्रीधराच्युत ॥ १९॥ लोकाध्यक्ष जगत्पूज्य परमात्मन् नमोऽस्तु ते । त्वं माता सर्वलोकानां त्वमेव जगतः
    पिता ॥ २०॥ त्वमार्तानां सुहृन्मित्रं प्रियस्त्वं प्रपितामहः । त्वं गुरुस्त्वं गतिः साक्षी त्वं पतिस्त्वं
    परायणः ॥ २१॥ त्वं ध्रुवस्त्वं वषट्कर्ता त्वं हविस्त्वं हुताशनः । त्वं शिवस्त्वं वसुर्धाता त्वं ब्रह्मा
    त्वं सुरेश्वरः ॥ २२॥ त्वं यमस्त्वं रविर्वायुस्त्वं जलं त्वं धनेश्वरः । त्वं मनुस्त्वमहोरात्रं त्वं
    निशा त्वं निशाकरः । त्वं धृतिस्त्वं श्रियः कान्तिस्त्वं क्षमा त्वं धराधरः ॥ २३॥ त्वं कर्ता जगतामीशस्त्वं
    हन्ता मधुसूदन । त्वमेव गोप्ता सर्वस्य जगतस्त्वं चराचर ॥ २४॥ करणं कारणं कर्ता त्वमेव परमेश्वरः । शङ्खचक्रगदापाणे
    भो समुद्धर माधव ॥ २५॥ प्रिय पद्मपलाशाक्ष शेषपर्यङ्कशायिनम् । त्वामेव भक्त्या सततं नमामि पुरुषोत्तमम्
    ॥ २६॥ श्रीवत्साङ्कं जगद्बीजं श्यामलं कमलेक्षणम् । नमामि ते वपुर्देव कलिकल्मषनाशनम् ॥ २७॥ लक्ष्मीधरमुदाराङ्गं
    दिव्यमालाविभूषितम् । चारूपृष्ठं महाबाहुं चारुभूषणभूषितम् ॥ २८॥ पद्मनाभं विशालाक्षं पद्मपत्रनिभेक्षणम्
    । दीर्घतुङ्गमहाघ्राणं नीलजीमूतसंनिभम् ॥ २९॥ दीर्घबाहुं सुगुप्ताङ्गं रत्नहारोज्ज्वलोरसम् । सुभ्रूललाटमुकुटं
    स्निग्धदन्तं सुलोचनम् ॥ ३०॥ चारुबाहुं सुताम्रोष्ठं रत्नोज्ज्वलितकुण्डलम् । वृत्तकण्ठं सुपीनांसं सरसं
    श्रीधरं हरिम् ॥ ३१॥ सुकुमारमजं नित्यं नीलकुञ्चितमूर्धजम् । उन्नतांसं महोरस्कं कर्णान्तायतलोचनम् ॥
    ३२॥ हेमारविन्दवदनमिन्दिरायनमीश्वरम् । सर्वलोकविधातारं सर्वपापहरं हरिम् ॥ ३३॥ सर्वलक्षणसम्पन्नं सर्वसत्त्वमनोरमम्
    । विष्णुमच्युतमीशानमनन्तं पुरुषोत्तमम् ॥ ३४॥ नतोऽस्मि मनसा नित्यं नारायणमनामयम् । वरदं कामदं कान्तमनन्तं
    सूनृतं शिवम् ॥ ३५॥ नमामि शिरसा विष्णो सदा त्वां भक्तवत्सल । अस्मिन्नेकार्णवे घोरे वायुस्कम्पितचञ्चले
    ॥ ३६॥ अनन्तभोगशयने सहस्रफणशोभिते । विचित्रशयने रम्ये सेविते मन्दवायुना ॥ ३७॥ भुजपञ्जरसंसक्तकमलालयसेवितम्
    । इह त्वां मनसा सर्वमिदानीं दृष्टवानहम् ॥ ३८॥ इदानीं तु सुदुःखार्थो मायया तव मोहितः । एकोदके निरालम्बे
    नष्टस्थावरजङ्गमे ॥ ३९॥ शून्ये तमसि दुष्पारे दुःखपङ्के निरामये । शीतातपजरारोगशोकतृष्णादिभिः सदा ॥ ४०॥
    पीडितोऽस्मि भृशं तात सुचिरं कालमच्युत । शोकमोहग्रहग्रस्तो विचरन् भवसागरे ॥ ४१॥ इहाद्य विधिना प्राप्तस्तव
    पादाब्जसंनिधौ । एकार्णवे महाघोरे दुस्तरे दुःखपीडितः ॥ ४२॥ चिरभ्रमपरिश्रान्तस्त्वामद्य शरणं गतः । प्रसीद
    सुमहामाय विष्णो राजीवलोचन ॥ ४३॥ विश्वयोने विशालाक्ष विश्वात्मन् विश्वसम्भव । अनन्यशरणं प्राप्तमतोऽत्र
    कुलनन्दन ॥ ४४॥ त्राहि मां कृपया कृष्ण शरणागतमातुरम् । नमस्ते पुण्डरीकाक्ष पुराणपुरुषोत्तम ॥ ४५॥ अञ्जनाभ
    हृषीकेश मायामय नमोऽस्तु ते । मामुद्धर महाबाहो मग्ने संसारसागरे ॥ ४६॥ गह्वरे दुस्तरे दुःखक्लिष्टे क्लेशमहाग्रहैः
    । अनाथं कृपणं दीनं पतितं भवसागरे । मां समुद्धर गोविन्द वरदेश नमोऽस्तु ते ॥ ४७॥ नमस्त्रैलोक्यनाथाय
    हरये भूधराय च । देवदेव नमस्तेऽस्तु श्रीवल्लभ नमोऽस्तु ते ॥ ४८॥ कृष्ण कृष्ण कृपालुस्त्वमगतीनां गतिर्भवान्
    । संसारार्णवमग्नानां प्रसीद मधुसूदन ॥ ४९॥ त्वामेकमाद्यं पुरुषं पुराणं जगत्पतिं कारणमच्युतं प्रभुम्
    । जनार्दनं जन्मजरार्तिनाशनं सुरेश्वरं सुन्दरमिन्दिरापतिम् ॥ ५०॥ बृहद्भुजं श्यामलकोमलं शुभं वराननं
    वारिजपत्रनेत्रम् । तरंगभङ्गायतकुन्तलं हरिं सुकान्तमीशं प्रणतोऽस्मि शाश्वतम् ॥ ५१॥ सा जिह्वा या हरिं
    स्तौति तच्चित्तं यत्त्वदर्पितम् । तावेव केवलौ श्लाघ्यौ यौ त्वत्पूजाकरौ करौ ॥ ५२॥ जन्मान्तरसहस्रेषु
    यन्मया पातकं कृतम् । तन्मे हर त्वं गोविन्द वासुदेवेति कीर्तनात् ॥ ५३॥ व्यास उवाच
