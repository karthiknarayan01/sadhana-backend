id: kashyapaditikritamvishnustotram
category: stotram
name:
  english: kashyapaditikritamvishnustotram
  devanagari: कश्यपादितिकृतंविष्णुस्तोत्रम्
content:
  english: rinkhalanvitam | pitambaram shrivatsankakaustubhaharavakshasam || 69|| lakshmiyuktam garudastham
    prasannam jagadishvaram | harshanirbharahridayastushtava kashyapo harim || 70|| namo namaste lakshmisha
    sarvesha bhuvaneshvara | svashritanam sukhadatre bhaktakaryakrite namah || 71|| adimadhyantarahitanityarupaya
    te namah | namah sarvatranakrite vedavedangacakshushe || 72|| sukshmaya sthularupaya narayanaya te
    namah | kalyanagunapurnaya paratmane ca te namah || 73|| namaste yogigamyaya bhaktecchapurakaya te
    | nityamuktaikabhogaya paradhameshvaraya ca || 74|| caturatmannamastubhyam vyuhatmane ca te namah
    | pancapancasvarupaya pancasamskarine namah || 75|| narayanaya krishnaya vasudevaya te namah | sharngine
    vishvarupaya dhatre tratre ca te namah || 769|| vishnave jishnave tubhyam shuddhasattvaya te namah
    | balerbalam mahajjatam tannishudaya madhava || 77|| devastada sukhinah syuriti cabhyarthana'sti me
    | yadyapi balirajo'sau bhakto'sti suramelanah || 78|| kintu suratikramanam mastu daityasya madhava
    | tasmattrilokagam rajyam tvindrasyaiva sada'stu vai || 79|| balestvasurarajyam ca pataladau yathastu
    ca | tatha'styabhyarthaniyam me yathecchasi tatha kuru || 80|| uktva tu kashyapastatra virarama hareh
    purah | aditih praha devesham natva stutva jagatprabhum || 81|| he natha yadi devanam shastritvam
    casure bhavet | tada'smatputrabahulye nasti kincitprayojanam || 82|| yadi sha
  devanagari: ृङ्खलान्वितम् । पीताम्बरं श्रीवत्साङ्ककौस्तुभहारवक्षसम् ॥ ६९॥ लक्ष्मीयुक्तं गरुडस्थं प्रसन्नं
    जगदीश्वरम् । हर्षनिर्भरहृदयस्तुष्टाव कश्यपो हरिम् ॥ ७०॥ नमो नमस्ते लक्ष्मीश सर्वेश भुवनेश्वर । स्वाश्रितानां
    सुखदात्रे भक्तकार्यकृते नमः ॥ ७१॥ आदिमध्यान्तरहितनित्यरूपाय ते नमः । नमः सर्वत्राणकृते वेदवेदाङ्गचक्षुषे
    ॥ ७२॥ सूक्ष्माय स्थूलरूपाय नारायणाय ते नमः । कल्याणगुणपूर्णाय परात्मने च ते नमः ॥ ७३॥ नमस्ते योगिगम्याय
    भक्तेच्छापूरकाय ते । नित्यमुक्तैकभोगाय परधामेश्वराय च ॥ ७४॥ चतुरात्मन्नमस्तुभ्यं व्यूहात्मने च ते
    नमः । पञ्चपञ्चस्वरूपाय पञ्चसंस्कारिणे नमः ॥ ७५॥ नारायणाय कृष्णाय वासुदेवाय ते नमः । शार्ङ्गिणे विश्वरूपाय
    धात्रे त्रात्रे च ते नमः ॥ ७६९॥ विष्णवे जिष्णवे तुभ्यं शुद्धसत्त्वाय ते नमः । बलेर्बलं महज्जातं तन्निषूदय
    माधव ॥ ७७॥ देवास्तदा सुखिनः स्युरिति चाभ्यर्थनाऽस्ति मे । यद्यपि बलिराजोऽसौ भक्तोऽस्ति सुरमेलनः ॥
    ७८॥ किन्तु सुरातिक्रमणं मास्तु दैत्यस्य माधव । तस्मात्त्रिलोकगं राज्यं त्विन्द्रस्यैव सदाऽस्तु वै
    ॥ ७९॥ बलेस्त्वासुरराज्यं च पातालादौ यथास्तु च । तथाऽस्त्यभ्यर्थनीयं मे यथेच्छसि तथा कुरु ॥ ८०॥ उक्त्वा
    तु कश्यपस्तत्र विरराम हरेः पुरः । अदितिः प्राह देवेशं नत्वा स्तुत्वा जगत्प्रभुम् ॥ ८१॥ हे नाथ यदि
    देवानां शास्तृत्वं चासुरे भवेत् । तदाऽस्मत्पुत्रबाहुल्ये नास्ति किञ्चित्प्रयोजनम् ॥ ८२॥ यदि श
