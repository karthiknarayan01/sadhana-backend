  devanagari: एकश्लोकिराम
content:
  english: purvam vaidehiharanam jatayumaranam sugrivasambhashanam | valinirdalanam samudrataranam lankapuridahanam
  devanagari: पूर्वं वैदेहीहरणं जटायुमरणं सुग्रीवसम्भाषणम् । वालीनिर्दलनं समुद्रतरणं लङ्कापुरीदाहनं
