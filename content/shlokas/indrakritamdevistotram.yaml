id: indrakritamdevistotram
category: stotram
name:
  english: indrakritamdevistotram
  devanagari: इन्द्रकृतंदेवीस्तोत्रम्
content:
  english: ringadhanurbanakhadgacarmavarabhayaih || 34|| shulaghantankushakashakapalakulishadibhih | asheshadevatamurtirasheshairdevatayudhaih
    || 35|| apurita tvamevamba sarvashatrunnihamsi nah | ayudhanam sahasrani tanmayaste vibhutayah ||
    36|| tvajjitaratayah sarve vividhayudhavahanah | rathanagahayairyuktah sasainya api bhubhritah ||
    37|| kshanena dagdhaviryah syustvatprasadavivarjitah | apado'pyalpaviryo'pi tvatpadambujasevakah ||
    38|| trilokanathatam praptah prathate kirtimanditah | tadrupamidamatyugram dhyayatamarcatam sada ||
    39|| na shatrubhyo bhayam kincidbhavedvijayashalinam | idrisham sarvalokeshu rupam te devavanditam
    || 3
  devanagari: ृङ्गधनुर्बाणखड्गचर्मवराभयैः ॥ ३४॥ शूलघण्टाङ्कुशकशाकपालकुलिशादिभिः । अशेषदेवतामूर्तिरशेषैर्देवतायुधैः
    ॥ ३५॥ आपूरिता त्वमेवाम्ब सर्वशत्रून्निहंसि नः । आयुधानां सहस्राणि तन्मयास्ते विभूतयः ॥ ३६॥ त्वज्जितारातयः
    सर्वे विविधायुधवाहनाः । रथनागहयैर्युक्ताः ससैन्या अपि भूभृतः ॥ ३७॥ क्षणेन दग्धवीर्याः स्युस्त्वत्प्रसादविवर्जिताः
    । अपदोऽप्यल्पवीर्योऽपि त्वत्पादाम्बुजसेवकः ॥ ३८॥ त्रिलोकनाथतां प्राप्तः प्रथते कीर्तिमण्डितः । तद्रूपमिदमत्युग्रं
    ध्यायतामर्चतां सदा ॥ ३९॥ न शत्रुभ्यो भयं किञ्चिद्भवेद्विजयशालिनाम् । ईदृशं सर्वलोकेषु रूपं ते देववन्दितम्
    ॥ ३
