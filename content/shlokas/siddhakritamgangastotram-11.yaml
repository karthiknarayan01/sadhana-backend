id: siddhakritamgangastotram-11
category: stotram
name:
  english: siddhakritamgangastotram 11
  devanagari: सिद्धकृतंगन्गास्तोत्रम् ११
content:
  english: siddhakritam gangastotram 11 siddha uvaca | te deshaste janapadaste''shramaste ca parvatah
    | yesham bhagirathi ganga madhyenaiti saridvara || 25|| tapasa brahmacaryena yajnaistyagena va punah
    | gatim tam na labhejjanturgangam samsevya yam labhet || 26|| sprishtani yesham gangeyaistoyairgatrani
    dehinam | nyastani na punastesham tyagah svargadvidhiyate || 27|| sarvani yesham gangeyaistoyaih krityani
    dehinam | gam tyaktva manava vipra divi tishthanti te'calah || 28|| purve vayasi karmani kritva papani
    ye narah | pashcadgangam nishevante te'pi yantyuttamam gatim || 29|| snatanam shucibhistoyairgangeyaih
    prayatatmanam | vyushtirbhavati ya pumsam na sa kratushatairapi || 30|| yavadasthi manushyasya gangatoyeshu
    tishthati | tavadvarshasahasrani svargam prapya mahiyate || 31|| apahatya tamastivram yatha bhatyudaye
    ravih | tathapahatya papmanam bhati gangajalokshitah || 32|| visoma iva sharvaryo vipushpastaravo
    yatha | tadvaddesha dishashcaiva hina gangajalaih shubhaih || 33|| varnashrama yatha sarve svadharmajnanavarjitah
    | kratavashca yathasomastatha gangam vina jagat || 34|| yatha hinam nabho'rkena bhuh shailaih kham
    ca vayuna | tatha desha dishashcaiva gangahina na samshayah || 35|| trishu lokeshu ye kecitpraninah
    sarva eva te | tarpyamanah param triptim yanti gangajalaih shubhaih || 36|| yastu suryena nishtaptam
    gangeyam pibate jalam | gavam nirharanirmuktadyavakattadvishishyate || 37|| induvratasahasram tu caredyah
    kayashodhanam | pibedyashcapi gangambhah samau syatam na va samau || 38|| tishthedyugasahasram tu
    padenaikena yah puman | masamekam tu gangayam samau syatam na va samau || 39|| lambetavakshira yastu
    yuganamayutam puman | tishthedyatheshtam yashcapi gangayam sa vishishyate || 40|| agnau praptam pradhuyeta
    yatha tulam dvijottama | tatha gangavagadhasya sarvam papam pradhuyate || 41|| bhutanamiha sarvesham
    duhkhopahatacetasam | gatimanveshamananam na gangasadrishi gatih || 42|| bhavanti nirvishah sarpa
    yatha tarkshyasya darshanat | gangaya darshanattadvatsarvapapaih pramucyate || 43|| apratishthashca
    ye kecidadharmasharanashca ye | tesham pratishtha gangeha sharanam sharma varma ca || 44|| prakrishtairashubhairgrastananekaih
    purushadhaman | patato narake ganga samshritanpretya tarayet || 45|| te samvibhakta munibhirnunam
    devaih savasavaih | ye'bhigacchanti satatam gangamabhigatam suraih || 46|| vinayacarahinashca ashivashca
    naradhamah | te bhavanti shiva vipra ye vai gangam samashritah || 47|| yatha suranamamritam pitrinam
    ca yatha svadha | sudha yatha ca naganam tatha gangajalam nrinam || 48|| upasate yatha bala mataram
    kshudhayarditah | shreyaskamastatha gangamupasantiha dehinah || 49|| svayambhuvam yatha sthanam sarvesham
    shreshthamucyate | snatanam saritam shreshtha ganga tadvadihocyate || 50|| yathopajivinam dhenurdevadinam
    dhara smrita | tathopajivinam ganga sarvapranabhritamiha || 51|| devah somarkasamsthani yatha satradibhirmakhaih
    | amritanyupajivanti tatha gangajalam narah || 52|| jahnavipulinotthabhih sikatabhih samukshitah |
    manyate purusho''tmanam divishthamiva shobhitam || 53|| jahnavitirasambhutam mridam murdhna bibharti
    yah | bibharti rupam so'rkasya tamonashatsunirmalam || 54|| gangormibhiratho digdhah purusham pavano
    yada | sprishate so'pi papmanam sadya evapamarjati || 55|| vyasanairabhitaptasya narasya vinashishyatah
    | gangadarshanaja pritirvyasananyapakarshati || 56|| hamsaravaih kokaravai ravairanyaishca pakshinam
    | paspardha ganga gandharvanpulinaishca shiloccayan || 57|| hamsadibhih subahubhirvividhaih pakshibhirvritam
    | gangam gokulasambadham drishtva svargo'pi vismritah || 58|| na sa pritirdivishthasya sarvakamanupashnatah
    | abhavadya para pritirgangayah puline nrinam || 59|| vanmanahkarmajairgrastah papairapi pumaniha
    | vikshya gangam bhavetputastatra me nasti samshayah || 60|| saptavaransapta paranpitrimstebhyashca
    ye pare | pumamstarayate gangam vikshya sprishtvavagahya ca || 61|| shrutabhilashita drishta sprishta
    pitavagahita | ganga tarayate nrinamubhau vamshau visheshatah || 62|| darshanatsparshanatpanattatha
    gangeti kirtanat | punatyapunyanpurushanshatasho'tha sahasrashah || 63|| ya icchetsaphalam janma jivitam
    shrutameva ca | sa pitrimstarpayedgangamabhigamya suramstatha || 64|| na sutairna ca vittena karmana
    na ca tatphalam | prapnuyatpurusho'tyantam gangam prapya yadapnuyat || 65|| jatyandhairiha tulyaste
    mritaih pangubhireva ca | samartha ye na pashyanti gangam punyajalam shivam || 66|| bhutabhavyabhavishyajnairmaharshibhirupasthitam
    | devaih sendraishca ko gangam nopaseveta manavah || 67|| vanaprasthairgrihasthaishca yatibhirbrahmacaribhih
    | vidyavadbhih shritam gangam pumanko nama nashrayet || 68|| utkramadbhishca yah pranaih prayatah
    shishtasammatah | cintayenmanasa gangam sa gatim paramam labhet || 69|| na bhayebhyo bhayam tasya
    na papebhyo na rajatah | a dehapatanadgangamupaste yah pumaniha || 70|| gaganadyam mahapunyam patantim
    vai maheshvarah | dadhara shirasa devim tameva divi sevate || 71|| alankritastrayo lokah pathibhirvimalaistribhih
    | yastu tasya jalam sevetkritakrityah pumanbhavet || 72|| divi jyotiryathadityah pitrinam caiva candramah
    | deveshashca yatha nrinam gangeha saritam tatha || 73|| matra pitra sutairdarairviyuktasya dhanena
    va | na bhaveddhi tatha duhkham yatha gangaviyogajam || 74|| naranyairneshtavishayairna sutairna dhanagamaih
    | tatha prasado bhavati gangam vikshya yatha nrinam || 75|| purnamindum yatha drishtva nrinam drishtih
    prasidati | gangam tripathagam drishtva tatha drishtih prasidati || 76|| tadbhavastadgatamanastannishthastatparayanah
    | gangam yo'nugato bhaktya sa tasyah priyatam vrajet || 77|| bhuhsthaih khasthairdivishthaishca bhutairuccavacairapi
    | ganga vigahya satatametatkaryatamam satam || 78|| trishu lokeshu punyatvadgangayah prathitam yashah
    | yatputransagarasyaisha bhasmakhyananayaddivam || 79|| vayviritabhih sumahasvanabhirdrutabhiratyarthasamucchritabhih
    | gangormibhirbhanumatibhiriddhah sahasrarashmipratimo vibhati || 80|| payasvinim ghritinimatyudaram
    samriddhinim veginim durvigahyam | gangam gatva yaih shariram visrishtam gata dhiraste vibudhaih samatvam
    || 81|| andhanjadandravyahinamshca ganga yashasvini brihati vishvarupa | devaih sendrairmunibhirmanavaishca
    nishevita sarvakamairyunakti || 82|| urjavatim madhumatim mahapunyam trivartmagam | trilokagoptrim
    ye gangam samshritaste divam gatah || 83|| yo vatsyati drakshyati vapi martya stasmai prayacchanti
    sukhani devah | tadbhavitah sparshane darshane ya stasmai deva gatimishtam dishanti || 84|| daksham
    prithvim brihatim viprakrishtam shivamritam surasam suprasannam | vibhavarim sarvabhutapratishtham
    gangam gata ye tridivam gataste || 85|| khyatiryasyah kham divam gam ca nityam pura disho vidishashcavatasthe
    | tasya jalam sevya saridvaraya martyah sarve kritakritya bhavanti || 86|| iyam gangeti niyatam pratishtha
    guhasya rukmasya ca garbhayosha | pratastrimarga ghritavaha vipapma gangavatirna viyato vishvatoya
    || 87|| sutavanidhrasya harasya bharya divo bhuvashcapi kakshyanurupa | bhavya prithivya bhavini bhati
    raja nganga lokanam punyada vai trayanam || 88|| madhupravaha ghritaragoddhritabhirmahormibhih shobhita
    brahmanaishca | divashcyuta shirasatta bhavena gangavanidhrastridivasya mala || 89|| yonirvarishtha
    viraja vitanvi shushma ira varivaha yashoda | vishvavati cakritirishtiriddha gangokshitanam bhuvanasya
    panthah || 90|| kshantya mahya gopane dharane ca diptya krishanostapanasya caiva | tulya ganga sammata
    brahmananam guhasya brahmanyataya ca nityam || 91|| rishishtutam vishnupadim puranim supunyatoyam
    manasapi loke | sarvatmana jahnavim ye prapanna ste brahmanah sadanam samprayatah || 92|| lokanimannayati
    ya jananiva putra nsarvatmana sarvagunopapanna | svasthanamishtamiha brahmamabhipsamanairganga sadaivatmavashairupasya
    || 93|| usram jushtam mishatim vishvatoya miram vajrim revatim bhudharanam | shishtashrayamamritam
    brahmakantam gangam shrayedatmavansiddhikamah || 94|| prasadya devansavibhunsamasta nbhagirathastapasogrena
    gangam | gamanayattamabhigamya shashva npumanbhayam neha namutra vidyat || 95|| udahritah sarvatha
    te gunanam mayaikadeshah prasamikshya buddhya | shaktirna me kacidihasti vaktum gunansarvanparimatum
    tathaiva || 96|| meroh samudrasya ca sarvaratnaih sankhyopalanamudakasya vapi | vaktum shakyam neha
    gangajalanam gunakhyanam parimatum tathaiva || 97|| tasmadimanparaya shraddhayokta ngunansarvanjahnavijamstathaiva
    | bhajedvaca manasa karmana ca bhaktya yuktah paraya shraddadhanah || 98|| lokanimamstrinyashasa vitatya
    siddhim prapya mahatim tam durapam | gangakritanacirenaiva loka nyatheshtamishtanvicarishyasi tvam
    || 99|| tava mama ca gunairmahanubhava jushatu matim satatam svadharmayuktaih | abhigatajanavatsala
    hi ganga bhajati yunakti sukhaishca bhaktimantam || 100|| iti mahabharate anushasanaparvani 27 adhyayantargatam
    siddhakritam gangastotram sampurnam | mahabharata | anushasanaparva | adhyaya 27
  devanagari: सिद्धकृतं गङ्गास्तोत्रम् ११ सिद्ध उवाच । ते देशास्ते जनपदास्तेऽऽश्रमास्ते च पर्वताः । येषां
    भागीरथी गङ्गा मध्येनैति सरिद्वरा ॥ २५॥ तपसा ब्रह्मचर्येण यज्ञैस्त्यागेन वा पुनः । गतिं तां न लभेज्जन्तुर्गङ्गां
    संसेव्य यां लभेत् ॥ २६॥ स्पृष्टानि येषां गाङ्गेयैस्तोयैर्गात्राणि देहिनाम् । न्यस्तानि न पुनस्तेषां
    त्यागः स्वर्गाद्विधीयते ॥ २७॥ सर्वाणि येषां गाङ्गेयैस्तोयैः कृत्यानि देहिनाम् । गां त्यक्त्वा मानवा
    विप्र दिवि तिष्ठन्ति तेऽचलाः ॥ २८॥ पूर्वे वयसि कर्माणि कृत्वा पापानि ये नराः । पश्चाद्गङ्गां निषेवन्ते
    तेऽपि यान्त्युत्तमां गतिम् ॥ २९॥ स्नातानां शुचिभिस्तोयैर्गाङ्गेयैः प्रयतात्मनाम् । व्युष्टिर्भवति
    या पुंसां न सा क्रतुशतैरपि ॥ ३०॥ यावदस्थि मनुष्यस्य गङ्गातोयेषु तिष्ठति । तावद्वर्षसहस्राणि स्वर्गं
    प्राप्य महीयते ॥ ३१॥ अपहत्य तमस्तीव्रं यथा भात्युदये रविः । तथापहत्य पाप्मानं भाति गङ्गाजलोक्षितः
    ॥ ३२॥ विसोमा इव शर्वर्यो विपुष्पास्तरवो यथा । तद्वद्देशा दिशश्चैव हीना गङ्गाजलैः शुभैः ॥ ३३॥ वर्णाश्रमा
    यथा सर्वे स्वधर्मज्ञानवर्जिताः । क्रतवश्च यथासोमास्तथा गङ्गां विना जगत् ॥ ३४॥ यथा हीनं नभोऽर्केण भूः
    शैलैः खं च वायुना । तथा देशा दिशश्चैव गङ्गाहीना न संशयः ॥ ३५॥ त्रिषु लोकेषु ये केचित्प्राणिनः सर्व
    एव ते । तर्प्यमाणाः परां तृप्तिं यान्ति गङ्गाजलैः शुभैः ॥ ३६॥ यस्तु सूर्येण निष्टप्तं गाङ्गेयं पिबते
    जलम् । गवां निर्हारनिर्मुक्ताद्यावकात्तद्विशिष्यते ॥ ३७॥ इन्दुव्रतसहस्रं तु चरेद्यः कायशोधनम् । पिबेद्यश्चापि
    गङ्गाम्भः समौ स्यातां न वा समौ ॥ ३८॥ तिष्ठेद्युगसहस्रं तु पादेनैकेन यः पुमान् । मासमेकं तु गङ्गायां
    समौ स्यातां न वा समौ ॥ ३९॥ लम्बेतावाक्षिरा यस्तु युगानामयुतं पुमान् । तिष्ठेद्यथेष्टं यश्चापि गङ्गायां
    स विशिष्यते ॥ ४०॥ अग्नौ प्राप्तं प्रधूयेत यथा तूलं द्विजोत्तम । तथा गङ्गावगाढस्य सर्वं पापं प्रधूयते
    ॥ ४१॥ भूतानामिह सर्वेषां दुःखोपहतचेतसाम् । गतिमन्वेषमाणानां न गङ्गासदृशी गतिः ॥ ४२॥ भवन्ति निर्विषाः
    सर्पा यथा तार्क्ष्यस्य दर्शनात् । गङ्गाया दर्शनात्तद्वत्सर्वपापैः प्रमुच्यते ॥ ४३॥ अप्रतिष्ठाश्च ये
    केचिदधर्मशरणाश्च ये । तेषां प्रतिष्ठा गङ्गेह शरणं शर्म वर्म च ॥ ४४॥ प्रकृष्टैरशुभैर्ग्रस्ताननेकैः
    पुरुषाधमान् । पततो नरके गङ्गा संश्रितान्प्रेत्य तारयेत् ॥ ४५॥ ते संविभक्ता मुनिभिर्नूनं देवैः सवासवैः
    । येऽभिगच्छन्ति सततं गङ्गामभिगतां सुरैः ॥ ४६॥ विनयाचारहीनाश्च अशिवाश्च नराधमाः । ते भवन्ति शिवा विप्र
    ये वै गङ्गां समाश्रिताः ॥ ४७॥ यथा सुराणाममृतं पितॄणां च यथा स्वधा । सुधा यथा च नागानां तथा गङ्गाजलं
    नृणाम् ॥ ४८॥ उपासते यथा बाला मातरं क्षुधयार्दिताः । श्रेयस्कामास्तथा गङ्गामुपासन्तीह देहिनः ॥ ४९॥
    स्वायम्भुवं यथा स्थानं सर्वेषां श्रेष्ठमुच्यते । स्नातानां सरितां श्रेष्ठा गङ्गा तद्वदिहोच्यते ॥ ५०॥
    यथोपजीविनां धेनुर्देवादीनां धरा स्मृता । तथोपजीविनां गङ्गा सर्वप्राणभृतामिह ॥ ५१॥ देवाः सोमार्कसंस्थानि
    यथा सत्रादिभिर्मखैः । अमृतान्युपजीवन्ति तथा गङ्गाजलं नराः ॥ ५२॥ जाह्नवीपुलिनोत्थाभिः सिकताभिः समुक्षितः
    । मन्यते पुरुषोऽऽत्मानं दिविष्ठमिव शोभितम् ॥ ५३॥ जाह्नवीतीरसम्भूतां मृदं मूर्ध्ना बिभर्ति यः । बिभर्ति
    रूपं सोऽर्कस्य तमोनाशात्सुनिर्मलम् ॥ ५४॥ गङ्गोर्मिभिरथो दिग्धः पुरुषं पवनो यदा । स्पृशते सोऽपि पाप्मानं
    सद्य एवापमार्जति ॥ ५५॥ व्यसनैरभितप्तस्य नरस्य विनशिष्यतः । गङ्गादर्शनजा प्रीतिर्व्यसनान्यपकर्षति ॥
    ५६॥ हंसारावैः कोकरवै रवैरन्यैश्च पक्षिणाम् । पस्पर्ध गङ्गा गन्धर्वान्पुलिनैश्च शिलोच्चयान् ॥ ५७॥ हंसादिभिः
    सुबहुभिर्विविधैः पक्षिभिर्वृताम् । गङ्गां गोकुलसम्बाधां दृष्ट्वा स्वर्गोऽपि विस्मृतः ॥ ५८॥ न सा प्रीतिर्दिविष्ठस्य
    सर्वकामानुपाश्नतः । अभवद्या परा प्रीतिर्गङ्गायाः पुलिने नृणाम् ॥ ५९॥ वाङ्मनःकर्मजैर्ग्रस्तः पापैरपि
    पुमानिह । वीक्ष्य गङ्गां भवेत्पूतस्तत्र मे नास्ति संशयः ॥ ६०॥ सप्तावरान्सप्त परान्पितॄंस्तेभ्यश्च
    ये परे । पुमांस्तारयते गङ्गां वीक्ष्य स्पृष्ट्वावगाह्य च ॥ ६१॥ श्रुताभिलषिता दृष्टा स्पृष्टा पीतावगाहिता
    । गङ्गा तारयते नॄणामुभौ वंशौ विशेषतः ॥ ६२॥ दर्शनात्स्पर्शनात्पानात्तथा गङ्गेति कीर्तनात् । पुनात्यपुण्यान्पुरुषाञ्शतशोऽथ
    सहस्रशः ॥ ६३॥ य इच्छेत्सफलं जन्म जीवितं श्रुतमेव च । स पितॄंस्तर्पयेद्गङ्गामभिगम्य सुरांस्तथा ॥ ६४॥
    न सुतैर्न च वित्तेन कर्मणा न च तत्फलम् । प्राप्नुयात्पुरुषोऽत्यन्तं गङ्गां प्राप्य यदाप्नुयात् ॥ ६५॥
    जात्यन्धैरिह तुल्यास्ते मृतैः पङ्गुभिरेव च । समर्था ये न पश्यन्ति गङ्गां पुण्यजलां शिवाम् ॥ ६६॥ भूतभव्यभविष्यज्ञैर्महर्षिभिरुपस्थिताम्
    । देवैः सेन्द्रैश्च को गङ्गां नोपसेवेत मानवः ॥ ६७॥ वानप्रस्थैर्गृहस्थैश्च यतिभिर्ब्रह्मचारिभिः । विद्यावद्भिः
    श्रितां गङ्गां पुमान्को नाम नाश्रयेत् ॥ ६८॥ उत्क्रामद्भिश्च यः प्राणैः प्रयतः शिष्टसम्मतः । चिन्तयेन्मनसा
    गङ्गां स गतिं परमां लभेत् ॥ ६९॥ न भयेभ्यो भयं तस्य न पापेभ्यो न राजतः । आ देहपतनाद्गङ्गामुपास्ते यः
    पुमानिह ॥ ७०॥ गगनाद्यां महापुण्यां पतन्तीं वै महेश्वरः । दधार शिरसा देवीं तामेव दिवि सेवते ॥ ७१॥ अलङ्कृतास्त्रयो
    लोकाः पथिभिर्विमलैस्त्रिभिः । यस्तु तस्या जलं सेवेत्कृतकृत्यः पुमान्भवेत् ॥ ७२॥ दिवि ज्योतिर्यथादित्यः
    पितॄणां चैव चन्द्रमाः । देवेशश्च यथा नॄणां गङ्गेह सरितां तथा ॥ ७३॥ मात्रा पित्रा सुतैर्दारैर्वियुक्तस्य
    धनेन वा । न भवेद्धि तथा दुःखं यथा गङ्गावियोगजम् ॥ ७४॥ नारण्यैर्नेष्टविषयैर्न सुतैर्न धनागमैः । तथा
    प्रसादो भवति गङ्गां वीक्ष्य यथा नृणाम् ॥ ७५॥ पूर्णमिन्दुं यथा दृष्ट्वा नृणां दृष्टिः प्रसीदति । गङ्गां
    त्रिपथगां दृष्ट्वा तथा दृष्टिः प्रसीदति ॥ ७६॥ तद्भावस्तद्गतमनास्तन्निष्ठस्तत्परायणः । गङ्गां योऽनुगतो
    भक्त्या स तस्याः प्रियतां व्रजेत् ॥ ७७॥ भूःस्थैः खस्थैर्दिविष्ठैश्च भूतैरुच्चावचैरपि । गङ्गा विगाह्या
    सततमेतत्कार्यतमं सताम् ॥ ७८॥ त्रिषु लोकेषु पुण्यत्वाद्गङ्गायाः प्रथितं यशः । यत्पुत्रान्सगरस्यैषा
    भस्माख्याननयद्दिवम् ॥ ७९॥ वाय्वीरिताभिः सुमहास्वनाभिर्द्रुताभिरत्यर्थसमुच्छ्रिताभिः । गङ्गोर्मिभिर्भानुमतीभिरिद्धः
    सहस्ररश्मिप्रतिमो विभाति ॥ ८०॥ पयस्विनीं घृतिनीमत्युदारां समृद्धिनीं वेगिनीं दुर्विगाह्याम् । गङ्गां
    गत्वा यैः शरीरं विसृष्टं गता धीरास्ते विबुधैः समत्वम् ॥ ८१॥ अन्धाञ्जडान्द्रव्यहीनांश्च गङ्गा यशस्विनी
    बृहती विश्वरूपा । देवैः सेन्द्रैर्मुनिभिर्मानवैश्च निषेविता सर्वकामैर्युनक्ति ॥ ८२॥ ऊर्जावतीं मधुमतीं
    महापुण्यां त्रिवर्त्मगाम् । त्रिलोकगोप्त्रीं ये गङ्गां संश्रितास्ते दिवं गताः ॥ ८३॥ यो वत्स्यति द्रक्ष्यति
    वापि मर्त्य स्तस्मै प्रयच्छन्ति सुखानि देवाः । तद्भाविताः स्पर्शने दर्शने य स्तस्मै देवा गतिमिष्टां
    दिशन्ति ॥ ८४॥ दक्षां पृथ्वीं बृहतीं विप्रकृष्टां शिवामृतां सुरसां सुप्रसन्नाम् । विभावरीं सर्वभूतप्रतिष्ठां
    गङ्गां गता ये त्रिदिवं गतास्ते ॥ ८५॥ ख्यातिर्यस्याः खं दिवं गां च नित्यं पुरा दिशो विदिशश्चावतस्थे
    । तस्या जलं सेव्य सरिद्वराया मर्त्याः सर्वे कृतकृत्या भवन्ति ॥ ८६॥ इयं गङ्गेति नियतं प्रतिष्ठा गुहस्य
    रुक्मस्य च गर्भयोषा । प्रातस्त्रिमार्गा घृतवहा विपाप्मा गङ्गावतीर्णा वियतो विश्वतोया ॥ ८७॥ सुतावनीध्रस्य
    हरस्य भार्या दिवो भुवश्चापि कक्ष्यानुरूपा । भव्या पृथिव्या भाविनी भाति राज न्गङ्गा लोकानां पुण्यदा
    वै त्रयाणाम् ॥ ८८॥ मधुप्रवाहा घृतरागोद्धृताभिर्महोर्मिभिः शोभिता ब्राह्मणैश्च । दिवश्च्युता शिरसात्ता
    भवेन गङ्गावनीध्रास्त्रिदिवस्य माला ॥ ८९॥ योनिर्वरिष्ठा विरजा वितन्वी शुष्मा इरा वारिवहा यशोदा । विश्वावती
    चाकृतिरिष्टिरिद्धा गङ्गोक्षितानां भुवनस्य पन्थाः ॥ ९०॥ क्षान्त्या मह्या गोपने धारणे च दीप्त्या कृशानोस्तपनस्य
    चैव । तुल्या गङ्गा सम्मता ब्राह्मणानां गुहस्य ब्रह्मण्यतया च नित्यम् ॥ ९१॥ ऋषिष्टुतां विष्णुपदीं पुराणीं
    सुपुण्यतोयां मनसापि लोके । सर्वात्मना जाह्नवीं ये प्रपन्ना स्ते ब्रह्मणः सदनं सम्प्रयाताः ॥ ९२॥ लोकानिमान्नयति
    या जननीव पुत्रा न्सर्वात्मना सर्वगुणोपपन्ना । स्वस्थानमिष्टमिह ब्राह्ममभीप्समानैर्गङ्गा सदैवात्मवशैरुपास्या
    ॥ ९३॥ उस्रां जुष्टां मिषतीं विश्वतोया मिरां वज्रीं रेवतीं भूधराणाम् । शिष्टाश्रयाममृतां ब्रह्मकान्तां
    गङ्गां श्रयेदात्मवान्सिद्धिकामः ॥ ९४॥ प्रसाद्य देवान्सविभून्समस्ता न्भगीरथस्तपसोग्रेण गङ्गाम् । गामानयत्तामभिगम्य
    शश्व न्पुमान्भयं नेह नामुत्र विद्यात् ॥ ९५॥ उदाहृतः सर्वथा ते गुणानां मयैकदेशः प्रसमीक्ष्य बुद्ध्या
    । शक्तिर्न मे काचिदिहास्ति वक्तुं गुणान्सर्वान्परिमातुं तथैव ॥ ९६॥ मेरोः समुद्रस्य च सर्वरत्नैः सङ्ख्योपलानामुदकस्य
    वापि । वक्तुं शक्यं नेह गङ्गाजलानां गुणाख्यानं परिमातुं तथैव ॥ ९७॥ तस्मादिमान्परया श्रद्धयोक्ता न्गुणान्सर्वाञ्जाह्नवीजांस्तथैव
    । भजेद्वाचा मनसा कर्मणा च भक्त्या युक्तः परया श्रद्दधानः ॥ ९८॥ लोकानिमांस्त्रीन्यशसा वितत्य सिद्धिं
    प्राप्य महतीं तां दुरापाम् । गङ्गाकृतानचिरेणैव लोका न्यथेष्टमिष्टान्विचरिष्यसि त्वम् ॥ ९९॥ तव मम च
    गुणैर्महानुभावा जुषतु मतिं सततं स्वधर्मयुक्तैः । अभिगतजनवत्सला हि गङ्गा भजति युनक्ति सुखैश्च भक्तिमन्तम्
    ॥ १००॥ इति महाभारते अनुशासनपर्वणि २७ अध्यायान्तर्गतं सिद्धकृतं गङ्गास्तोत्रं सम्पूर्णम् । महाभारत
    । अनुशासनपर्व । अध्याय २७
