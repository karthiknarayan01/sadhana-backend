id: saparyaparyayah
category: upanishad
name:
  english: saparyaparyayah
  devanagari: सपर्यापर्यायः
content:
  english: saparya paryayah shrishah shreyaskamibhirabhyarcanato'ntarnidhyanadyanirvriyatamatra jagatyam
    | sattamatranandacidatmanamanantam so'ham tam tvamarcayitum na prabhavami || 1|| sa dhyeyo yah samsritibhumirvyavadhanadadhyeyo
    nastvam tu na sakshada parokshat | dhyayaccanudhyayasi cetah svayamantastam dhyayami tvamiti vandhyatra
    manisha || 2|| sarvananyastvamabahyantarabhavo bahyancasyabhyantaramapyasya khilatma | nityapratyasannasatastasya
    tavatman naham jane kimvidhamavahanakarma || 3|| otam protam yatra samastam jagadetat sarvadhare tishthati
    sambadhavihinam | bhumamstasya sve mahimanyeva sataste ko namasavasanasankalpavidamba || 4|| anadibhyo
    yasya parasya pratipattya samsaradhvatrayyatipannassukhameti | atmamste tasyagatigatyadyatibhumermithya
    naham kena katham svagatikah syam || 5|| indradyah syuryasya parasyamaravarya vidyamatraleshavashenapi
    sadarghyah | tasyadyasyapanipadadeh kathamarghyam dadyamadyanardhavibhuterudavindum || 6|| vishvatmaiko
    yasya tu pado na vimeyah pada sh canye panditarupairapi mrigyah | tasyarupasyapada murdhadivibhakterapadyam
    kim kena katham va tava padyam || 7|| sandhya nadyo yasya ca vasteyamudanvan meghah keshah prakritavishvapaghanasya
    | tasyapetaprakritasambodhatanoste kalpyam manye nacamaniyam kamaniyam || 8|| adhyatmam yanmadhvadhidaivanca
    vibhaktam tatsampricyaikatmakamahopanishadyam | satvam sarvasvadyatamastanmadhuparkah sampriyethah
    kim madhuparkena katham va || 9|| yatraikastham sarvapavitrakhilatirtham nishnatah syuryatra vigacchadbhavapankah
    | yadvyomno'pi vyoma param jyotiraparam tantvamatman kena vishuddham snapa yami || 10|| lokalekhyam
    vo hitashuklasitarupaih syutam sukshmairambararupam gunabhedaih | samparyaptam pravaritum yanna vibhraman
    kim te tasya ambaramanyatkalayami || 11|| atraigunye yanna jagattvayyupavite sutre syutam bhutamato
    vishlathamaste | tasyasavyadakshinasampurnatanoste kalpyam sutram kim trigunam syadupavitam || 12||
    yasyaikamsha
  devanagari: सपर्या पर्यायः श्रीशः श्रेयस्कामिभिरभ्यर्चनतोऽन्तर्निध्यानाद्यानिर्व्रियतामत्र जगत्याम्
    । सत्तामात्रानन्दचिदात्मानमनन्तं सोऽहं तं त्वामर्चयितुं न प्रभवामि ॥ १॥ स ध्येयो यः संसृतिभूमिर्व्यवधानादध्येयो
    नस्त्वं तु न साक्षाद परोक्षात् । ध्यायच्चानुध्यायसि चेतः स्वयमन्तस्तं ध्यायामि त्वामिति वन्ध्यात्र
    मनीषा ॥ २॥ सर्वानन्यस्त्वमबाह्यान्तरभावो बाह्यञ्चास्याभ्यन्तरमप्यस्य खिलात्मा । नित्यप्रत्यासन्नसतस्तस्य
    तवात्मन् नाहं जाने किंविधमावाहनकर्म ॥ ३॥ ओतं प्रोतं यत्र समस्तं जगदेतत् सर्वाधारे तिष्ठति सम्बाधविहीनम्
    । भूमंस्तस्य स्वे महिमन्येव सतस्ते को नामासावासनसङ्कल्पविडम्बा ॥ ४॥ अनादिभ्यो यस्य परस्य प्रतिपत्त्या
    संसाराध्वत्रय्यतिपन्नस्सुखमेति । आत्मंस्ते तस्यागतिगत्याद्यतिभूमेर्मिथ्या नाहं केन कथं स्वागतिकः स्याम्
    ॥ ५॥ इन्द्राद्याः स्युर्यस्य परस्यामरवर्या विद्यामात्रालेशवशेनापि सदर्घ्याः । तस्याद्यस्यापाणिपदादेः
    कथमर्घ्यं दद्यामद्यानर्धविभूतेरुदविन्दुम् ॥ ६॥ विश्वात्मैको यस्य तु पादो न विमेयः पादा श् चान्ये पण्डितरूपैरपि
    मृग्याः । तस्यारूपस्यापद मूर्धादिविभक्तेरापाद्यं किं केन कथं वा तव पाद्यम् ॥ ७॥ सन्ध्या नद्यो यस्य
    च वास्तेयमुदन्वान् मेघाः केशाः प्राकृतविश्वापघनस्य । तस्यापेतप्राकृतसम्बोधतनोस्ते कल्प्यं मन्ये नाचमनीयं
    कमनीयम् ॥ ८॥ अध्यात्मं यन्मध्वधिदैवञ्च विभक्तं तत्सम्पृच्यैकात्मकमाहोपनिषद्यम् । सत्वं सर्वास्वाद्यतमस्तन्मधुपर्कः
    सम्प्रीयेथाः किं मधुपर्केण कथं वा ॥ ९॥ यत्रैकस्थं सर्वपवित्राखिलतीर्थं निष्णाताः स्युर्यत्र विगच्छद्भवपङ्काः
    । यद्व्योम्नोऽपि व्योम परं ज्योतिरपारं तन्त्वामात्मन् केन विशुद्धं स्नप यामि ॥ १०॥ लोकालेख्यं वो हितशुक्लासितरूपैः
    स्यूतं सूक्ष्मैरम्बररूपं गुणभेदैः । सम्पर्याप्तं प्रावरितुं यन्न विभ्रमन् किं ते तस्या अम्बरमन्यत्कलयामि
    ॥ ११॥ अत्रैगुण्ये यन्न जगत्त्वय्युपवीते सूत्रे स्यूतं भूतमतो विश्लथमास्ते । तस्यासव्यादक्षिणसम्पूर्णतनोस्ते
    कल्प्यं सूत्रं किं त्रिगुणं स्यादुपवीतम् ॥ १२॥ यस्यैकांश
