id: ramakrishnastotram-4
category: stotram
name:
  english: ramakrishnastotram 4
  devanagari: रामकृष्णस्तोत्रम् ४
content:
  english: shriramakrishnastotram lokan vilokya navabhautikabhogalagnan magnamshca nastikavicaraparamparasu
    | bhaktya vihinahridayamshca samuddhidhirshuh shriramakrishna bhagavan svayamavirasit || 1|| vairagyabodhabhajanatrayasangamena
    saccitsukharthamanapayamupayarupam | sandeshamaupanishadam vishadividhatum shriramakrishnabhagavan
    svayamavirasit || 2|| kantasu vishvajananimavalokayantam tulyashmakancanamatim sadasadvivekam | nityam
    karamalakasiddhasamadhiyogam shriramakrishnacaranau sharanam prapadye || 3|| vidyavilasavidusho'pi
    jagatyaneka
  devanagari: श्रीरामकृष्णस्तोत्रम् लोकान् विलोक्य नवभौतिकभोगलग्नान् मग्नांश्च नास्तिकविचारपरम्परासु ।
    भक्त्या विहीनहृदयांश्च समुद्धिधीर्षुः श्रीरामकृष्ण भगवान् स्वयमाविरासीत् ॥ १॥ वैराग्यबोधभजनत्रयसङ्गमेन
    सच्चित्सुखार्थमनपायमुपायरूपम् । सन्देशमौपनिषदं विशदीविधातुं श्रीरामकृष्णभगवान् स्वयमाविरासीत् ॥ २॥
    कान्तासु विश्वजननीमवलोकयन्तं तुल्याश्मकाञ्चनमतिं सदसद्विवेकम् । नित्यं करामलकसिद्धसमाधियोगं श्रीरामकृष्णचरणौ
    शरणं प्रपद्ये ॥ ३॥ विद्याविलासविदुषोऽपि जगत्यनेका
meaning: {}
