id: sani-ashtottara-sata-namavali
category: stotram
name:
  english: Sani Ashtottara Sata Namavali
  devanagari: शनि अष्टोत्तरशतनामावली
content:
  english: 'shani bija mantra - om pra~ prim praum sah shanaishcaraya namah | om shanaishcaraya namah
    | om shantaya namah | om sarvabhishtapradayine namah | om sharanyaya namah | om varenyaya namah |
    om sarveshaya namah | om saumyaya namah | om suravandyaya namah | om suralokaviharine namah | om sukhasanopavishtaya
    namah | 10 om sundaraya namah | om ghanaya namah | om ghanarupaya namah | om ghanabharanadharine namah
    | om ghanasaravilepaya namah | om khadyotaya namah | om mandaya namah | om mandaceshtaya namah | om
    mahaniyagunatmane namah | om martyapavanapadaya namah | 20 om maheshaya namah | om chayaputraya namah
    | om sharvaya namah | om shatatuniradharine namah | om carasthirasvabhavaya namah | om acancalaya
    namah | om nilavarnaya namah | om nityaya namah | om nilanjananibhaya namah | om nilambaravibhushanaya
    namah | 30 om nishcalaya namah | om vedyaya namah | om vidhirupaya namah | om virodhadharabhumaye
    namah | om bhedaspadasvabhavaya namah | om vajradehaya namah | om vairagyadaya namah | om viraya namah
    | om vitarogabhayaya namah | om vipatparampareshaya namah | 40 om vishvavandyaya namah | om gridhnavahaya
    namah | om gudhaya namah | om kurmangaya namah | om kurupine namah | om kutsitaya namah | om gunadhyaya
    namah | om gocaraya namah | om avidyamulanashaya namah | om vidyavidyasvarupine namah | 50 om ayushyakaranaya
    namah | om apaduddhartre namah | om vishnubhaktaya namah | om vashine namah | om vividhagamavedine
    namah | om vidhistutyaya namah | om vandyaya namah | om virupakshaya namah | om varishthaya namah
    | om garishthaya namah | 60 om vajrankushadharaya namah | om varadabhayahastaya namah | om vamanaya
    namah | om jyeshthapatnisametaya namah | om shreshthaya namah | om mitabhashine namah | om kashtaughanashakartre
    namah | om pushtidaya namah | om stutyaya namah | om stotragamyaya namah | 70 om bhaktivashyaya namah
    | om bhanave namah | om bhanuputraya namah | om bhavyaya namah | om pavanaya namah | om dhanurmandalasamsthaya
    namah | om dhanadaya namah | om dhanushmate namah | om tanuprakashadehaya namah | om tamasaya namah
    | 80 om asheshajanavandyaya namah | om visheshaphaladayine namah | om vashikritajaneshaya namah |
    om pashunam pataye namah | om khecaraya namah | om khageshaya namah | om ghananilambaraya namah |
    om kathinyamanasaya namah | om aryaganastutyaya namah | om nilacchatraya namah | 90 om nityaya namah
    | om nirgunaya namah | om gunatmane namah | om niramayaya namah | om nindyaya namah | om vandaniyaya
    namah | om dhiraya namah | om divyadehaya namah | om dinartiharanaya namah | om dainyanashakaraya
    namah | 100 om aryajanaganyaya namah | om kruraya namah | om kruraceshtaya namah | om kamakrodhakaraya
    namah | om kalatraputrashatrutvakaranaya namah | om pariposhitabhaktaya namah | om parabhitiharaya
    namah | om bhaktasamghamano''bhishtaphaladaya namah | || iti shani ashtottarashatanamavalih sampurnam
    || Propitiation of shaturn (shaturday) chhaṟitẏ: donate leather, farm land, a black cov, a cuking
    oven vith cuking utensils, a buffalo, black mustard or black sesamum sids, to a pur man on shaturday
    evening| Fashtinġ: On shaturday during shaturn transits, and especially major or minor shaturn periods|
    mantṟa: to be canted on shaturday, tvo hours and forty minutes before sunrise, especially during major
    or minor shaturn periods: ṟEshuḻt: the planetary diety shani is propitiated insuring victory in quarrels,
    over coming cronic pain, and bringing transliteration and information by dr| sh| khalyanaraman kalyan97@yahuॅom'
  devanagari: 'शनि बीज मन्त्र - ॐ प्राँ प्रीं प्रौं सः शनैश्चराय नमः । ॐ शनैश्चराय नमः । ॐ शान्ताय नमः
    । ॐ सर्वाभीष्टप्रदायिने नमः । ॐ शरण्याय नमः । ॐ वरेण्याय नमः । ॐ सर्वेशाय नमः । ॐ सौम्याय नमः । ॐ
    सुरवन्द्याय नमः । ॐ सुरलोकविहारिणे नमः । ॐ सुखासनोपविष्टाय नमः । १० ॐ सुन्दराय नमः । ॐ घनाय नमः ।
    ॐ घनरूपाय नमः । ॐ घनाभरणधारिणे नमः । ॐ घनसारविलेपाय नमः । ॐ खद्योताय नमः । ॐ मन्दाय नमः । ॐ मन्दचेष्टाय
    नमः । ॐ महनीयगुणात्मने नमः । ॐ मर्त्यपावनपदाय नमः । २० ॐ महेशाय नमः । ॐ छायापुत्राय नमः । ॐ शर्वाय
    नमः । ॐ शततूणीरधारिणे नमः । ॐ चरस्थिरस्वभावाय नमः । ॐ अचञ्चलाय नमः । ॐ नीलवर्णाय नमः । ॐ नित्याय नमः
    । ॐ नीलाञ्जननिभाय नमः । ॐ नीलाम्बरविभूशणाय नमः । ३० ॐ निश्चलाय नमः । ॐ वेद्याय नमः । ॐ विधिरूपाय नमः
    । ॐ विरोधाधारभूमये नमः । ॐ भेदास्पदस्वभावाय नमः । ॐ वज्रदेहाय नमः । ॐ वैराग्यदाय नमः । ॐ वीराय नमः
    । ॐ वीतरोगभयाय नमः । ॐ विपत्परम्परेशाय नमः । ४० ॐ विश्ववन्द्याय नमः । ॐ गृध्नवाहाय नमः । ॐ गूढाय नमः
    । ॐ कूर्माङ्गाय नमः । ॐ कुरूपिणे नमः । ॐ कुत्सिताय नमः । ॐ गुणाढ्याय नमः । ॐ गोचराय नमः । ॐ अविद्यामूलनाशाय
    नमः । ॐ विद्याविद्यास्वरूपिणे नमः । ५० ॐ आयुष्यकारणाय नमः । ॐ आपदुद्धर्त्रे नमः । ॐ विष्णुभक्ताय नमः
    । ॐ वशिने नमः । ॐ विविधागमवेदिने नमः । ॐ विधिस्तुत्याय नमः । ॐ वन्द्याय नमः । ॐ विरूपाक्षाय नमः ।
    ॐ वरिष्ठाय नमः । ॐ गरिष्ठाय नमः । ६० ॐ वज्राङ्कुशधराय नमः । ॐ वरदाभयहस्ताय नमः । ॐ वामनाय नमः । ॐ
    ज्येष्ठापत्नीसमेताय नमः । ॐ श्रेष्ठाय नमः । ॐ मितभाषिणे नमः । ॐ कष्टौघनाशकर्त्रे नमः । ॐ पुष्टिदाय
    नमः । ॐ स्तुत्याय नमः । ॐ स्तोत्रगम्याय नमः । ७० ॐ भक्तिवश्याय नमः । ॐ भानवे नमः । ॐ भानुपुत्राय नमः
    । ॐ भव्याय नमः । ॐ पावनाय नमः । ॐ धनुर्मण्डलसंस्थाय नमः । ॐ धनदाय नमः । ॐ धनुष्मते नमः । ॐ तनुप्रकाशदेहाय
    नमः । ॐ तामसाय नमः । ८० ॐ अशेषजनवन्द्याय नमः । ॐ विशेशफलदायिने नमः । ॐ वशीकृतजनेशाय नमः । ॐ पशूनां
    पतये नमः । ॐ खेचराय नमः । ॐ खगेशाय नमः । ॐ घननीलाम्बराय नमः । ॐ काठिन्यमानसाय नमः । ॐ आर्यगणस्तुत्याय
    नमः । ॐ नीलच्छत्राय नमः । ९० ॐ नित्याय नमः । ॐ निर्गुणाय नमः । ॐ गुणात्मने नमः । ॐ निरामयाय नमः ।
    ॐ निन्द्याय नमः । ॐ वन्दनीयाय नमः । ॐ धीराय नमः । ॐ दिव्यदेहाय नमः । ॐ दीनार्तिहरणाय नमः । ॐ दैन्यनाशकराय
    नमः । १०० ॐ आर्यजनगण्याय नमः । ॐ क्रूराय नमः । ॐ क्रूरचेष्टाय नमः । ॐ कामक्रोधकराय नमः । ॐ कलत्रपुत्रशत्रुत्वकारणाय
    नमः । ॐ परिपोषितभक्ताय नमः । ॐ परभीतिहराय नमः । ॐ भक्तसंघमनोऽभीष्टफलदाय नमः । ॥ इति शनि अष्टोत्तरशतनामावलिः
    सम्पूर्णम् ॥ Pरोपितिअतिओन् ओफ़् षतुर्न् (षतुर्दय्) छ्ःआऱीट्य़्: डोनते लेअथेर्, फ़र्म् लन्द्, अ ब्लच्क्
    चोव्, अ चूकिन्ग् ओवेन् विथ् चूकिन्ग् उतेन्सिल्स्, अ बुफ़्फ़लो, ब्लच्क् मुस्तर्द् ओर् ब्लच्क् सेसमुम्
    सीद्स्, तो अ पूर् मन् ओन् षतुर्दय् एवेनिन्ग्। Fआष्टीण्ग़्: Oन् षतुर्दय् दुरिन्ग् षतुर्न् त्रन्सित्स्,
    अन्द् एस्पेचिअल्ल्य् मजोर् ओर् मिनोर् षतुर्न् पेरिओद्स्। ंआण्ट्ऱा: टो बे चन्तेद् ओन् षतुर्दय्, त्वो
    होउर्स् अन्द् फ़ोर्त्य् मिनुतेस् बेफ़ोरे सुन्रिसे, एस्पेचिअल्ल्य् दुरिन्ग् मजोर् ओर् मिनोर् षतुर्न्
    पेरिओद्स्: ऱ्Eषूळ्ट्: ठे प्लनेतर्य् दिएत्य् षनि इस् प्रोपितिअतेद् इन्सुरिन्ग् विच्तोर्य् इन् क़ुअर्रेल्स्,
    ओवेर् चोमिन्ग् च्रोनिच् पैन्, अन्द् ब्रिन्गिन्ग् ट्रन्स्लितेरतिओन् अन्द् इन्फ़ोर्मतिओन् ब्य् ड्र्।
    ष्। ख़ल्यनरमन् कल्यन्९७@यहूॅओम्'
