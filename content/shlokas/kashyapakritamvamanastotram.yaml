id: kashyapakritamvamanastotram
category: stotram
name:
  english: kashyapakritamvamanastotram
  devanagari: कश्यपकृतंवामनस्तोत्रम्
content:
  english: kashyapakritam vamanastotram kashyapa uvaca | namo namaste'khilakaranaya namo namaste'khilapalakaya
    | namo namaste'maranayakaya namo namo daityavinashanaya || 11
  devanagari: कश्यपकृतं वामनस्तोत्रम् कश्यप उवाच । नमो नमस्तेऽखिलकारणाय नमो नमस्तेऽखिलपालकाय । नमो नमस्तेऽमरनायकाय
    नमो नमो दैत्यविनाशनाय ॥ ११
meaning: {}
