id: lakshminrisimhaekaksharimantrah
category: mantra
name:
  english: lakshminrisimhaekaksharimantrah
  devanagari: लक्ष्मीनृसिंहएकाक्षरीमन्त्रः
content:
  english: om aim hrim shrim tjnauh shrishambhu guruhamsoh svarupanirupamahetave shubhanandanathakalashakti
    svagurupadukam pujayami | om aim hrim shrim tjnauh shrishambhu guru raum | svacchaprakashavimarshahatave
    anandanandanatha bharundashaktiparamaguru shripadukam pujayami | om aim hrim shrim hamsauh shrishambhuguru
    hamsauh svatmaramapanjaravilinatejase | govindanandanatha cidambashaktiparameshtiguru shripadukam
    pujayami | om aim hrim shrim hamsauh shrishambhuguru hamsauh svarupanirupanahetave svacchaprakashavimrishyahetave
    | svatmaramapanjaravilinatejase lakshminivasanandanatha sundarambashakti paratparaguru shripadukam
    pujayami | angushthagre tu govindam tarjanyam tu mahidharam | madhyamayam hrishikesham anamikayam
    trivikramam || kanishthikayam nyasedvishnum karamadhye tu madhavam | evam ca karavinyasam sarvapapapranashanam
    | bhuh padabhyam namah | bhuvah janubhyam namah | svah katibhyam namah | mahah nabhyai namah | janah
    hridayaya namah | tapah kanthaya namah | satyam lalataya namah | parabrahma shirase svaha | urdhvakeshi
    virupaksha mamsashonitabhojane | tishtha devi shikhabandhe camunde aparajite || svashirasi gum gurubhyo
    namah | pam paramagurubhyo namah | pam parameshtigurubhyo namah | pam paratparagurubhyo namah | dakshinabahumule
    gananam tva iti | gam ganapataye | vamabahumule dum durgayai namah | dakshinapadamule ksham kshetrapalaya
    namah | am atmane namah | pam paramatmane namah | sam sattvatmane namah | ram rajatmane namah | tam
    tamatmane namah | hrim jnanatmane namah | mokshartham jape viniyogah | iti bhumishuddhih | gurupadukamantrajapah
    | ahoratribhyam nishvaso sva svarupena shatshatadhikamekavimshati | sahasram japanam vivedyayitva
    | ajapamantrah | om hrim hamsah so ham | ajapagayatri | hamsa hamsaya vidmahe so'hamsaya dhimahi tanno
    hamsah pracodayat | ato ekakshara ganapatimantrah | om shrim gam om | asya shrinrisimha ekakshari
    mantrasya atririshih gayatri chandah | shrinrisimho devata | kshraum bijam | hrim shaktih | phat kilakam
    | mama caturvidhapurusharthasiddhyartham jape viniyogah | atha nyasah | atririshaye namah shirasi
    | gayatri chandah mukhe | shrilakshminrisimhadevata hridaye | raum bijaya namah guhyayoh | kshraum
    shanyaya namah padayoh | ram kilakaya namah sarvange || atha karanyasah | kshram angushthabhyam namah
    | kshrim tarjanibhyam namah | kshrum madhyamabhyam namah | kshraim anamikabhyam namah | kshraum kanishthikabhyam
    namah | kshrah karatalakaraprishthabhyam namah || atha hridayadinyasah | kshram hridayaya namah |
    kshrim shirase svaha | kshrum shikhaya vashat | kshraim netratrayaya vaushat | kshraum kavacaya hum
    | kshrah astraya phat || om bhurbhuvasvaromiti digbandhah | atha dhyanam | satyajnana sukhasvarupamamalam
    kshirabdhimadhyasthalam | yogarudhamatiprasannavadanam bhusha sahasrojvalam || tryaksham cakrapinakasabhayavaram
    bibhranamarkacchavi | chatribhuta phanindramindudhavalam lakshminrisimha bhaje ||
  devanagari: ॐ ऐं ह्रीं श्रीं त्ज्ञौः श्रीशम्भू गुरुहंसोः स्वरूपनिरूपमहेतवे शुभानन्दनाथकलाशक्ति स्वगुरुपादुकां
    पूजयामि । ॐ ऐं ह्रीं श्रीं त्ज्ञौः श्रीशम्भू गुरु रौम् । स्वच्छप्रकाशविमर्शहतवे आनन्दानन्दनाथ भरूण्डाशक्तिपरमगुरु
    श्रीपादुकां पूजयामि । ॐ ऐं ह्रीं श्रीं हंसौः श्रीशम्भूगुरु हंसौः स्वात्मारामपञ्जरविलीनतेजसे । गोविन्दानन्दनाथ
    चिदम्बाशक्तिपरमेष्टिगुरु श्रीपादुकां पूजयामि । ॐ ऐं ह्रीं श्रीं हंसौः श्रीशम्भूगुरु हंसौः स्वरूपनिरूपणहेतवे
    स्वच्छप्रकाशविमृश्यहेतवे । स्वात्मारामपञ्जरविलीनतेजसे लक्ष्मीनिवासानन्दनाथ सुन्दराम्बाशक्ति परात्परगुरु
    श्रीपादुकां पूजयामि । अङ्गुष्ठाग्रे तु गोविन्दं तर्जन्यां तु महीधरम् । मध्यमायां हृषीकेशं अनामिकायां
    त्रिविक्रमम् ॥ कनिष्ठिकायां न्यसेद्विष्णुं करमध्ये तु माधवम् । एवं च करविन्यासं सर्वपापप्रणाशनम् ।
    भूः पादाभ्यां नमः । भुवः जानुभ्यां नमः । स्वः कटिभ्यां नमः । महः नाभ्यै नमः । जनः हृदयाय नमः । तपः
    कण्ठाय नमः । सत्यं ललाटाय नमः । परब्रह्म शिरसे स्वाहा । ऊर्ध्वकेशि विरूपाक्ष मांसशोणितभोजने । तिष्ठ
    देवि शिखाबन्धे चामुण्डे अपराजिते ॥ स्वशिरसि गुं गुरुभ्यो नमः । पं परमगुरुभ्यो नमः । पं परमेष्टिगुरुभ्यो
    नमः । पं परात्परगुरुभ्यो नमः । दक्षिणबाहुमूले गणानां त्वा इति । गं गणपतये । वामबाहुमूले दुं दुर्गायै
    नमः । दक्षिणपादमूले क्षं क्षेत्रपालाय नमः । अं आत्मने नमः । पं परमात्मने नमः । सं सत्त्वात्मने नमः
    । रं रजात्मने नमः । तं तमात्मने नमः । ह्रीं ज्ञानात्मने नमः । मोक्षार्थं जपे विनियोगः । इति भूमिशुद्धिः
    । गुरुपादुकामन्त्रजपः । अहोरात्रिभ्यां निश्वासो स्वा स्वरूपेण षट्शताधिकमेकविंशती । सहस्रं जपानां विवेद्ययित्वा
    । अजपामन्त्रः । ॐ ह्रीं हंसः सो हम् । अजपागायत्री । हंस हंसाय विद्महे सोऽहंसाय धीमहि तन्नो हंसः प्रचोदयात्
    । अतो एकाक्षर गणपतिमन्त्रः । ॐ श्रीं गं ॐ । अस्य श्रीनृसिंह एकाक्षरी मन्त्रस्य अत्रिऋषिः गायत्री छन्दः
    । श्रीनृसिंहो देवता । क्ष्रौं बीजम् । ह्रीं शक्तिः । फट् कीलकम् । मम चतुर्विधपुरुषार्थसिद्ध्यर्थं
    जपे विनियोगः । अथ न्यासः । अत्रिऋषये नमः शिरसि । गायत्री छन्दः मुखे । श्रीलक्ष्मीनृसिंहदेवता हृदये
    । रौं बीजाय नमः गुह्ययोः । क्ष्रौं शन्यय नमः पादयोः । रं कीलकाय नमः सर्वाङ्गे ॥ अथ करन्यासः । क्ष्रां
    अङ्गुष्ठाभ्यां नमः । क्ष्रीं तर्जनीभ्यां नमः । क्ष्रूं मध्यमाभ्यां नमः । क्ष्रैं अनामिकाभ्यां नमः
    । क्ष्रौं कनिष्ठिकाभ्यां नमः । क्ष्रः करतलकरपृष्ठाभ्यां नमः ॥ अथ हृदयादिन्यासः । क्ष्रां हृदयाय नमः
    । क्ष्रीं शिरसे स्वाहा । क्ष्रूं शिखाय वषट् । क्ष्रैं नेत्रत्रयाय वौषट् । क्ष्रौं कवचाय हुम् । क्ष्रः
    अस्त्राय फट् ॥ ॐ भूर्भुवस्वरोमिति दिग्बन्धः । अथ ध्यानम् । सत्यज्ञान सुखस्वरूपममलं क्षीराब्धिमध्यस्थलम्
    । योगारूढमतिप्रसन्नवदनं भूषा सहस्रोज्वलम् ॥ त्र्यक्षं चक्रपिनाकसाभयवरं बिभ्राणमर्कच्छवि । छत्रीभूत
    फणीन्द्रमिन्दुधवलं लक्ष्मीनृसिंह भजे ॥
