id: katha
category: upanishad
name:
  english: katha
  devanagari: कथ
content:
  english: ritam pibantau sukritasya loke guham pravishtau parame parardhe | chayatapau brahmavido vadanti
    pancagnayo ye ca trinaciketah || 1|| yah seturijananamaksharam brahma yat param | abhayam titirshatam
    param naciketa~ shakemahi || 2|| atmana~ rathinam viddhi sharira~ rathameva tu | buddhim tu sarathim
    viddhi manah pragrahameva ca || 3|| indriyani hayanahurvishaya~ steshu gocaran | atmendriyamanoyuktam
    bhoktetyahurmanishinah || 4|| yastvavijnanavanbhavatyayuktena manasa sada | tasyendriyanyavashyani
    dushtashva iva saratheh || 5|| yastu vijnanavanbhavati yuktena manasa sada | tasyendriyani vashyani
    sadashva iva saratheh || 6|| yastvavijnanavanbhavatyamanaskah sada'shucih | na sa tatpadamapnoti samsaram
    cadhigacchati || 7|| yastu vijnanavanbhavati samanaskah sada shucih | sa tu tatpadamapnoti yasmadbhuyo
    na jayate || 8|| vijnanasarathiryastu manah pragrahavannarah | so'dhvanah paramapnoti tadvishnoh paramam
    padam || 9|| indriyebhyah para hyartha arthebhyashca param manah | manasastu para buddhirbuddheratma
    mahanparah || 10|| mahatah paramavyaktamavyaktatpurushah parah | purushanna param kimcitsa kashtha
    sa para gatih || 11|| esha sarveshu bhuteshu gudho''tma na prakashate | drishyate tvagryaya buddhya
    sukshmaya sukshmadarshibhih || 12|| yacchedvanmanasi prajnastadyacchejjnana atmani | jnanamatmani
    mahati niyacchettadyacchecchanta atmani || 13|| uttishthata jagrata prapya varannibodhata | kshurasya
    dhara nishita duratyaya durgam pathastatkavayo vadanti || 14|| ashabdamasparshamarupamavyayam tatha'rasam
    nityamagandhavacca yat | anadyanantam mahatah param dhruvam nicayya tanmrityumukhat pramucyate ||
    15|| naciketamupakhyanam mrityuprokta~ sanatanam | uktva shrutva ca medhavi brahmaloke mahiyate ||
    16|| ya imam paramam guhyam shravayed brahmasamsadi | prayatah shraddhakale va tadanantyaya kalpate
    | tadanantyaya kalpata iti || 17|| iti kathakopanishadi prathamadhyaye tritiya valli ||
  devanagari: ऋतं पिबन्तौ सुकृतस्य लोके गुहां प्रविष्टौ परमे परार्धे । छायातपौ ब्रह्मविदो वदन्ति पञ्चाग्नयो
    ये च त्रिणाचिकेताः ॥ १॥ यः सेतुरीजानानामक्षरं ब्रह्म यत् परम् । अभयं तितीर्षतां पारं नाचिकेतँ शकेमहि
    ॥ २॥ आत्मानँ रथिनं विद्धि शरीरँ रथमेव तु । बुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च ॥ ३॥ इन्द्रियाणि
    हयानाहुर्विषयाँ स्तेषु गोचरान् । आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः ॥ ४॥ यस्त्वविज्ञानवान्भवत्ययुक्तेन
    मनसा सदा । तस्येन्द्रियाण्यवश्यानि दुष्टाश्वा इव सारथेः ॥ ५॥ यस्तु विज्ञानवान्भवति युक्तेन मनसा सदा
    । तस्येन्द्रियाणि वश्यानि सदश्वा इव सारथेः ॥ ६॥ यस्त्वविज्ञानवान्भवत्यमनस्कः सदाऽशुचिः । न स तत्पदमाप्नोति
    संसारं चाधिगच्छति ॥ ७॥ यस्तु विज्ञानवान्भवति समनस्कः सदा शुचिः । स तु तत्पदमाप्नोति यस्माद्भूयो न
    जायते ॥ ८॥ विज्ञानसारथिर्यस्तु मनः प्रग्रहवान्नरः । सोऽध्वनः पारमाप्नोति तद्विष्णोः परमं पदम् ॥ ९॥
    इन्द्रियेभ्यः परा ह्यर्था अर्थेभ्यश्च परं मनः । मनसस्तु परा बुद्धिर्बुद्धेरात्मा महान्परः ॥ १०॥ महतः
    परमव्यक्तमव्यक्तात्पुरुषः परः । पुरुषान्न परं किंचित्सा काष्ठा सा परा गतिः ॥ ११॥ एष सर्वेषु भूतेषु
    गूढोऽऽत्मा न प्रकाशते । दृश्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः ॥ १२॥ यच्छेद्वाङ्मनसी
    प्राज्ञस्तद्यच्छेज्ज्ञान आत्मनि । ज्ञानमात्मनि महति नियच्छेत्तद्यच्छेच्छान्त आत्मनि ॥ १३॥ उत्तिष्ठत
    जाग्रत प्राप्य वरान्निबोधत । क्षुरस्य धारा निशिता दुरत्यया दुर्गं पथस्तत्कवयो वदन्ति ॥ १४॥ अशब्दमस्पर्शमरूपमव्ययं
    तथाऽरसं नित्यमगन्धवच्च यत् । अनाद्यनन्तं महतः परं ध्रुवं निचाय्य तन्मृत्युमुखात् प्रमुच्यते ॥ १५॥
    नाचिकेतमुपाख्यानं मृत्युप्रोक्तँ सनातनम् । उक्त्वा श्रुत्वा च मेधावी ब्रह्मलोके महीयते ॥ १६॥ य इमं
    परमं गुह्यं श्रावयेद् ब्रह्मसंसदि । प्रयतः श्राद्धकाले वा तदानन्त्याय कल्पते । तदानन्त्याय कल्पत इति
    ॥ १७॥ इति काठकोपनिषदि प्रथमाध्याये तृतीया वल्ली ॥
