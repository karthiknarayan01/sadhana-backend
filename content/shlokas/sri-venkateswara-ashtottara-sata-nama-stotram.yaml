id: sri-venkateswara-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sri Venkateswara Ashtottara Sata Nama Stotram
content:
  english: om shrivenkateshah shrinivaso lakshmi patiranamayah | amritamsho jagadvandyo govinda shshashvatah
    prabhuh || || sheshadrinilayo devah keshavo madhusudanah amrito madhavah krishnah shriharir jnanapanjarah
    || || shrivatsavakshah sarvesho gopalah purushottamah | gopishvarah paranjyoti ryadavendro nityayauvanarupavan
    | caturvedatmako vishnu racyutah padminipriyah || rnirmalo deva pujitah | caturbhuja stridhama trigunashrayah
    || || nirvikalpo nishkalanko nirantako niranjanah | nirabhaso nityatripto nirguno nirupadravah ||
    rnandaki shankhadharakah | anekamurti ravyaktah katihasto varapradah || || anekatma dinabandhu rartalokabhayapradah
    | akasharajavarado yogihritpadmamandirah || || damodaro jagatpalah papaghno bhaktavatsalah | trivikrama
    shshimshumaro jatamakutashobhitah || || shankhamadhyollasanmanju kinkinadhyakarandhakah | nilameghashyamatanu
    rbilvapatrarcanapriyah || || jagadvyapi jagatkarta jagatsakshi jagatpatih | cintitarthaprado jishnu
    rdasharho dasharupavan rhayagrivo janardanah | kanyashravanatarejyah pitambaradharo'naghah || || vanamali
    padmanabho mrigayasakta manasah | ashvarudhah khadgadhari dhanarjana samutsukah || || ghanasaralasanmadhya
    kasturi tilakojjvalah | saccidanandarupashca jaganmangaladayakah || || yajnarupo yajnabhokta cinmayah
    parameshvarah | paramarthapradah shantah shriman || paratparah parambrahma shrivibhu rjagadishvarah
    | evam shrivenkateshasya namna mashtottaram shatam || pathatam shrinvatam bhaktya sarvabhishtapradam
    shubham | trisandhyam yah paghennishyam sarvan || || shri venkateshvararpanamastu ||
  devanagari: ॐ श्रीवेङ्कटेशः श्रीनिवासो लक्ष्मी पतिरनामयः । अमृतांशो जगद्वन्द्यो गोविन्द श्शाश्वतः प्रभुः
    ॥ ॥ शेषाद्रिनिलयो देवः केशवो मधुसूदनः अमृतो माधवः कृष्णः श्रीहरिर् ज्ञानपञ्जरः ॥ ॥ श्रीवत्सवक्षाः
    सर्वेशो गोपालः पुरुषोत्तमः । गोपीश्वरः परञ्ज्योति र्यादवेन्द्रो नित्ययौवनरूपवान् । चतुर्वेदात्मको
    विष्णु रच्युतः पद्मिनीप्रियः ॥ र्निर्मलो देव पूजितः । चतुर्भुज स्त्रिधामा त्रिगुणाश्रयः ॥ ॥ निर्विकल्पो
    निष्कलङ्को निरान्तको निरञ्जनः । निराभासो नित्यतृप्तो निर्गुणो निरुपद्रवः ॥ र्नन्दकी शङ्खधारकः । अनेकमूर्ति
    रव्यक्तः कटिहस्तो वरप्रदः ॥ ॥ अनेकात्मा दीनबन्धु रार्तलोकाभयप्रदः । आकाशराजवरदो योगिहृत्पद्ममन्दिरः
    ॥ ॥ दामोदरो जगत्पालः पापघ्नो भक्तवत्सलः । त्रिविक्रम श्शिंशुमारो जटामकुटशोभितः ॥ ॥ शङ्खमध्योल्लसन्मञ्जु
    किङ्किणाढ्यकरण्ढकः । नीलमेघश्यामतनु र्बिल्वपत्रार्चनप्रियः ॥ ॥ जगद्व्यापी जगत्कर्ता जगत्साक्षी जगत्पतिः
    । चिन्तितार्थप्रदो जिष्णु र्दाशार्हो दशरूपवान् र्हयग्रीवो जनार्दनः । कन्याश्रवणतारेज्यः पीताम्बरधरोऽनघः
    ॥ ॥ वनमाली पद्मनाभो मृगयासक्त मानसः । अश्वारूढः खड्गधारी धनार्जन समुत्सुकः ॥ ॥ घनसारलसन्मध्य कस्तूरी
    तिलकोज्ज्वलः । सच्चिदानन्दरूपश्च जगन्मङ्गलदायकः ॥ ॥ यज्ञरूपो यज्ञभोक्ता चिन्मयः परमेश्वरः । परमार्थप्रदः
    शान्तः श्रीमान् ॥ परात्परः परम्ब्रह्म श्रीविभु र्जगदीश्वरः । एवं श्रीवेङ्कटेशस्य नाम्ना मष्टोत्तरं
    शतम् ॥ पठतां शृण्वतां भक्त्या सर्वाभीष्टप्रदं शुभम् । त्रिसन्ध्यं यः पघेन्निष्यं सर्वान् ॥ ॥ श्री
    वेङ्कटेश्वरार्पणमस्तु ॥
