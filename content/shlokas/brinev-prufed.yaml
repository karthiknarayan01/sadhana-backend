id: brinev-prufed
category: upanishad
name:
  english: brinev-prufed
  devanagari: ब्रिनेव्-प्रूफ़ेद्
content:
  english: tas vai asya etas hitas nama nadyas yatha keshas sahasradha bhinnas tavata animna tishthanti
    shuklasya nilasya pingalasya haritasya lohitasya purnas atha yatrainam ghnantiva jinantiva hastiva
    vicchayayati gartamiva patati yadeva jagradbhayam pashyati tadatravidyaya manyate
  devanagari: तास् वै अस्य एतास् हितास् नाम नाड्यस् यथा केशस् सहस्रधा भिन्नस् तावता अणिम्ना तिष्ठन्ति
    शुक्लस्य नीलस्य पिङ्गलस्य हरितस्य लोहितस्य पूर्णास् अथ यत्रैनं घ्नन्तीव जिनन्तीव हस्तीव विच्छाययति
    गर्तमिव पतति यदेव जाग्रद्भयं पश्यति तदत्राविद्यया मन्यते
meaning: {}
