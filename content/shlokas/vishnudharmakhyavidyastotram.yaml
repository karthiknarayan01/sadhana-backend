id: vishnudharmakhyavidyastotram
category: stotram
name:
  english: vishnudharmakhyavidyastotram
  devanagari: विष्णुधर्माख्यविद्यास्तोत्रम्
content:
  english: vishnudharmakhyavidyastotram hariruvaca | avapa japtva cendratvam vishnudharmakhyavidyaya |
    sarvanchatrunvinirjitya tanca vakshye maheshvara || 1
  devanagari: विष्णुधर्माख्यविद्यास्तोत्रम् हरिरुवाच । अवाप जप्त्वा चेन्द्रत्वं विष्णुधर्माख्यविद्यया
    । सर्वाञ्छत्रून्विनिर्जित्य ताञ्च वक्ष्ये महेश्वर ॥ १
meaning: {}
