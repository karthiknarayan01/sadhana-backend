id: brahmanakritam05shivastotram
category: stotram
name:
  english: brahmanakritam05shivastotram
  devanagari: ब्रह्मणाकृतं०५शिवस्तोत्रम्
content:
  english: brahmana kritam 5 shivastotram brahmovaca | puranaih samasangitaih punyakhyairguhyanamabhih
    | ajastvamajaro devah srashta vibhuh paraparam || 39|| pradhanam purusho yastvam brahma dhyeyam tadaksharam
    | amritam paramatma ca ishvarah karanam mahat || 40|| brahmasrik prakriteh srashta sarvakritprakriteh
    parah | iyanca prakritirdevi sada te srishtikaranam || 41|| patnirupam samasthaya jagatkaranamagata
    | namastubhyam mahadeva devya vai sahitaya ca || 42|| prasadattava devesha niyogacca maya prajah |
    devadyastu imah srishta mudhastvadyogamayaya || 43|| kuru prasadametesham yathapurvam bhavantvime
    | tata evamaham vipra vijnapya parameshvaram || 44|| stambhitan sarvadevamstanidam caham tadoktavan
    | mudhashca devatah sarva nainam budhyata shankaram || 45|| gacchadhvam sharanam shighramenameva maheshvaram
    | sardham mayaiva devesham paramatmanamavyayam || 46|| tataste stambhitah sarve tathaiva tridivaukasah
    | pranemurmanasa sarvam bhavashuddhena cetasa || 47|| atha tesham prasanno'bhuddevadevo maheshvarah
    | yathapurvam cakara''shu devatanam tanustada || 48|| iti brahmapurane shattrimshadhyayantargatam
    brahmana kritam shivastotram samaptam | brahmapurana | adhyaya 36
  devanagari: ब्रह्मणा कृतं ५ शिवस्तोत्रम् ब्रह्मोवाच । पुराणैः सामसङ्गीतैः पुण्याख्यैर्गुह्यनामभिः ।
    अजस्त्वमजरो देवः स्रष्टा विभुः परापरम् ॥ ३९॥ प्रधानं पुरुषो यस्त्वं ब्रह्म ध्येयं तदक्षरम् । अमृतं
    परमात्मा च ईश्वरः कारणं महत् ॥ ४०॥ ब्रह्मसृक् प्रकृतेः स्रष्टा सर्वकृत्प्रकृतेः परः । इयञ्च प्रकृतिर्देवी
    सदा ते सृष्टिकारणम् ॥ ४१॥ पत्नीरूपं समास्थाय जगत्कारणमागता । नमस्तुभ्यं महादेव देव्या वै सहिताय च
    ॥ ४२॥ प्रसादात्तव देवेश नियोगाच्च मया प्रजाः । देवाद्यास्तु इमाः सृष्टा मूढास्त्वद्योगमायया ॥ ४३॥
    कुरु प्रसादमेतेषां यथापूर्वं भवन्त्विमे । तत एवमहं विप्रा विज्ञाप्य परमेश्वरम् ॥ ४४॥ स्तम्भितान् सर्वदेवांस्तानिदं
    चाहं तदोक्तवान् । मूढाश्च देवताः सर्वा नैनं बुध्यत शङ्करम् ॥ ४५॥ गच्छध्वं शरणं शीघ्रमेनमेव महेश्वरम्
    । सार्धं मयैव देवेशं परमात्मानमव्ययम् ॥ ४६॥ ततस्ते स्तम्भिताः सर्वे तथैव त्रिदिवौकसः । प्रणेमुर्मनसा
    सर्वं भावशुद्धेन चेतसा ॥ ४७॥ अथ तेषां प्रसन्नोऽभूद्देवदेवो महेश्वरः । यथापूर्वं चकाराऽऽशु देवतानां
    तनुस्तदा ॥ ४८॥ इति ब्रह्मपुराणे षट्त्रिंशाध्यायान्तर्गतं ब्रह्मणा कृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ३६
