id: dharmakritammahadevastotram
category: stotram
name:
  english: dharmakritammahadevastotram
  devanagari: धर्मकृतंमहादेवस्तोत्रम्
content:
  english: dharmakritam mahadevastotram dharma uvaca | pranamami jagannathamishanam pranavatmakam | samastadevatarupamadimadhyantavarjitam
    || 55|| urdhvaretam virupaksham vishvarupam namamyaham | samastajagadadharamanantamajamavyayam ||
    56|| yamamananti yogindrastam vande pushtivardhanam | namo lokadhinathaya vancate parivancate || 57||
    namo'stu nilakanthaya pashunam pataye namah | namah kalmashanashaya namo midhushtamaya ca || 58||
    namo rudraya devaya kadrudraya pracetase | namah pinakahastaya shulahastaya te namah || 59|| namashcaitanyarupaya
    pushtinam pataye namah | namah pancasyadevaya kshetranam pataye namah || 1
  devanagari: धर्मकृतं महादेवस्तोत्रम् धर्म उवाच । प्रणमामि जगन्नाथमीशानं प्रणवात्मकम् । समस्तदेवतारूपमादिमध्यान्तवर्जितम्
    ॥ ५५॥ ऊर्ध्वरेतं विरूपाक्षं विश्वरूपं नमाम्यहम् । समस्तजगदाधारमनन्तमजमव्ययम् ॥ ५६॥ यमामनन्ति योगीन्द्रास्तं
    वन्दे पुष्टिवर्धनम् । नमो लोकाधिनाथाय वञ्चते परिवञ्चते ॥ ५७॥ नमोऽस्तु नीलकण्ठाय पशूनां पतये नमः ।
    नमः कल्मषनाशाय नमो मीढुष्टमाय च ॥ ५८॥ नमो रुद्राय देवाय कद्रुद्राय प्रचेतसे । नमः पिनाकहस्ताय शूलहस्ताय
    ते नमः ॥ ५९॥ नमश्चैतन्यरूपाय पुष्टीनां पतये नमः । नमः पञ्चास्यदेवाय क्षेत्राणां पतये नमः ॥ १
meaning: {}
