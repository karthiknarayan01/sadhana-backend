id: tarakavac
category: kavacha
name:
  english: tarakavac
  devanagari: ताराकवच्
content:
  english: sarvamantrasiddhisamriddhaye jape viniyogah | pranavo me shirah patu brahmarupa maheshvari
    | lalate patu hrimkaro bijarupa maheshvari || 2|| strimkaro vadane nityam lajjarupa maheshvari | hu~karah
    patu hridaye bhavanirupashaktidhrik || 3|| phatkarah patu sarvange sarvasiddhiphalaprada | kharva
    mam patu deveshi gandayugme bhayapaha || 4|| nimnodari sada skandhayugme patu maheshvari | vyaghracarmavrita
    katyam patu devi shivapriya || 5|| pinonnatastani patu parshvayugme maheshvari | raktavartulanetra
    ca katideshe sada'vatu || 6|| lalajihva sada patu nabhau mam bhuvaneshvari | karalasya sada patu linge
    devi harapriya || 7|| pingograikajata patu janghayam vighnanashini | pretakharparabhriddevi janucakre
    maheshvari || 8|| nilavarna sada patu januni sarvada mama | nagakundaladhartri ca patu padayuge tatah
    || 9|| nagaharadhara devi sarvangam patu sarvada | nagakankadhara devi patu prantaradeshatah || 10||
    caturbhuja sada patu gamane shatrunashini | khadgahasta mahadevi shravane patu sarvada || 11|| nilambaradhara
    devi patu mam vighnanashini | kartrihasta sada patu vivade shatrumadhyatah || 12|| brahmarupadhara
    devi sangrame patu sarvada | nagakankanadhartri ca bhojane patu sarvada || 13|| shavakarna mahadevi
    shayane patu sarvada | virasanadhara devi nidrayam patu sarvada || 14|| dhanurbanadhara devi patu
    mam vighnasankule | nagancitakati patu devi mam sarvakarmasu || 15|| chinnamundadhara devi kanane
    patu sarvada | citamadhyasthita devi marane patu sarvada || 16|| dvipicarmadhara devi putradaradhanadishu
    | alankaranvita devi patu mam haravallabha || 17|| raksha raksha nadikunje hum hum phat susamanvite
    | bijarupa mahadevi parvate patu sarvada || 18|| manibhridvajrini devi mahapratisare tatha | raksha
    raksha sada hum hum om hrim svaha maheshvari || 19|| pushpaketurajarheti kanane patu sarvada | om
    hrim vajrapushpam hum phat prantare sarvakamada || 20|| om pushpe pushpe mahapushpe patu putranmaheshvari
    | hum svaha shaktisamyukta daran rakshatu sarvada || 21|| om am hum svaha maheshani patu dyute harapriya
    | om hrim sarvavighnotsarini devi vighnanmam sada'vatu || 22|| om pavitravajrabhume humphatsvaha samanvita
    | purika patu mam devi sarvavighnavinashini || 23|| om ah surekhe vajrarekhe humphatsvahasamanvita
    | patale patu sa devi lakini namasamjnika || 24|| hrimkari patu mam purve shaktirupa maheshvari |
    strimkari patu deveshi vadhurupa maheshvari || 25|| humsvarupa mahadevi patu mam krodharupini | phatsvarupa
    mahamaya uttare patu sarvada || 26|| pashcime patu mam devi phatsvarupa harapriya | madhye mam patu
    deveshi humsvarupa nagatmaja || 27|| nilavarna sada patu sarvato vagbhava sada | bhavani patu bhavane
    sarvaishvaryapradayini || 28|| vidyadanarata devi vaktre nilasarasvati | shastre vade ca sangrame
    jale ca vishame girau || 29|| bhimarupa sada patu shmashane bhayanashini | bhutapretalaye ghore durgama
    shrighana'vatu || 30|| patu nityam maheshani sarvatra shivadutika | kavacasya mahatmyam naham varshashatairapi
    || 31|| shaknomi gaditum devi bhavettasya phalam ca yat | putradareshu bandhunam sarvadeshe ca sarvada
    || 32|| na vidyate bhayam tasya nripapujyo bhavecca sah | shucirbhutva'shucirvapi kavacam sarvakamadam
    || 33|| prapathan va smaranmartyo duhkhashokavivarjitah | sarvashastre maheshani kavirad bhavati dhruvam
    || 34|| sarvavagishvaro martyo lokavashyo dhaneshvarah | rane dyute vivade ca jayastatra bhaved dhruvam
    || 35|| putrapautanvito martyo vilasi sarvayoshitam | shatravo dasatam yanti sarvesham vallabhah sada
    || 36|| garvi kharvi bhavatyeva vadi skhalati darshanat | mrityushca vashyatam yati dasastasyavanibhujah
    || 37|| prasangatkathitam sarvam kavacam sarvakamadam | prapathanva smaranmartyah shapanugrahane kshamah
    || 38|| anandavrindasindhunamadhipah kavirad bhavet | sarvavagishvaro martyo lokavashyah sada sukhi
    || 39|| guroh prasadamasadya vidyam prapya sugopitam | tatrapi kavacam devi durlabham bhuvanatraye
    || 40|| gururdevo harah sakshattatpatni tu harapriya | abhedena bhajedyastu tasya siddhiduratah ||
    41|| mantracara maheshani kathitah purvavatpriye | nabhau jyotistatha raktam hridayopari cintayet
    || 42|| aishvaryam sukavitvam ca mahavagishvaro nripah | nityam tasya maheshani mahilasangamam caret
    || 43|| pancacararato martyah siddho bhavati nanyatha | shaktiyukto bhavenmartyah siddho bhavati nanyatha
    || 44|| brahma vishnushca rudrashca ye devasuramanushah | tam drishtva sadhakam devi lajjayukta bhavanti
    te || 45|| svarge martye ca patale ye devah siddhidayakah | prashamsanti sada devi tam drishtva sadhakottamam
    || 46|| vighnatmakashca ye devah svarge martye rasatale | prashamsanti sada sarve tam drishtva sadhakottamam
    || 47|| iti te kathitam devi maya samyakprakirtitam | bhuktimuktikaram sakshatkalpavrikshasvarupakam
    || 48|| asadyadyagurum prasadya ya idam kalpadrumalambanam mohenapi madena capi rahito jadyena va
    yujyate | siddho'sau bhuvi sarvaduhkhavipadam param prayatyantake mitram tasya nripashca devi vipado
    nashyanti tasyashu ca || 49|| tadgatram prapya shastrani brahmastradini vai bhuvi | tasya gehe sthira
    lakshmirvani vaktre vased dhruvam || 50|| idam kavacamajnatva taram yo bhajate narah | alpayurnirddhano
    murkho bhavatyeva na samshayah || 51|| likhitva dharayedyastu kanthe va mastake bhuje | tasya sarvarthasiddhih
    syadyadyanmanasi vartate || 52|| gorocanakunkumena raktacandanakena va | yavakairva maheshani likhenmantram
    samahitah || 53|| ashtamyam mangaladine caturddashyamathapi va | sandhyayam devadeveshi likhedyantram
    samahitah || 54|| maghayam shravane vapi revatyam va visheshatah | simharashau gate candre karkatasthe
    divakare || 55|| minarashau gurau yate vrishcikasthe shanaishcare | likhitva dharayedyastu uttarabhimukho
    bhavet || 56|| shmashane prantare vapi shunyagare visheshatah | nishayam va likhenmantram tasya siddhiracancala
    || 57|| bhurjapatre likhenmantram guruna ca maheshvari | dhyanadharanayogena dharayedyastu bhaktitah
    || 58|| acirattasya siddhih syannatra karya vicarana || 59|| || iti shrirudrayamale tantre ugratarakavacam
    sampurnam ||
  devanagari: सर्वमन्त्रसिद्धिसमृद्धये जपे विनियोगः । प्रणवो मे शिरः पातु ब्रह्मरूपा महेश्वरी । ललाटे
    पातु ह्रींकारो बीजरूपा महेश्वरी ॥ २॥ स्त्रींकारो वदने नित्यं लज्जारूपा महेश्वरी । हूँकारः पातु हृदये
    भवानीरूपशक्तिधृक् ॥ ३॥ फट्कारः पातु सर्वाङ्गे सर्वसिद्धिफलप्रदा । खर्वा मां पातु देवेशी गण्डयुग्मे
    भयापहा ॥ ४॥ निम्नोदरी सदा स्कन्धयुग्मे पातु महेश्वरी । व्याघ्रचर्मावृता कट्यां पातु देवी शिवप्रिया
    ॥ ५॥ पीनोन्नतस्तनी पातु पार्श्वयुग्मे महेश्वरी । रक्तवर्तुलनेत्रा च कटिदेशे सदाऽवतु ॥ ६॥ ललजिह्वा
    सदा पातु नाभौ मां भुवनेश्वरी । करालास्या सदा पातु लिङ्गे देवी हरप्रिया ॥ ७॥ पिङ्गोग्रैकजटा पातु जङ्घायां
    विघ्ननाशिनी । प्रेतखर्परभृद्देवी जानुचक्रे महेश्वरी ॥ ८॥ नीलवर्णा सदा पातु जानुनी सर्वदा मम । नागकुण्डलधर्त्री
    च पातु पादयुगे ततः ॥ ९॥ नागहारधरा देवी सर्वाङ्गं पातु सर्वदा । नागकङ्कधरा देवी पातु प्रान्तरदेशतः
    ॥ १०॥ चतुर्भुजा सदा पातु गमने शत्रुनाशिनी । खड्गहस्ता महादेवी श्रवणे पातु सर्वदा ॥ ११॥ नीलाम्बरधरा
    देवी पातु मां विघ्ननाशिनी । कर्त्रिहस्ता सदा पातु विवादे शत्रुमध्यतः ॥ १२॥ ब्रह्मरूपधरा देवी सङ्ग्रामे
    पातु सर्वदा । नागकङ्कणधर्त्री च भोजने पातु सर्वदा ॥ १३॥ शवकर्णा महादेवी शयने पातु सर्वदा । वीरासनधरा
    देवी निद्रायां पातु सर्वदा ॥ १४॥ धनुर्बाणधरा देवी पातु मां विघ्नसङ्कुले । नागाञ्चितकटी पातु देवी मां
    सर्वकर्मसु ॥ १५॥ छिन्नमुण्डधरा देवी कानने पातु सर्वदा । चितामध्यस्थिता देवी मारणे पातु सर्वदा ॥ १६॥
    द्वीपिचर्मधरा देवी पुत्रदारधनादिषु । अलङ्कारान्विता देवी पातु मां हरवल्लभा ॥ १७॥ रक्ष रक्ष नदीकुञ्जे
    हूं हूं फट् सुसमन्विते । बीजरूपा महादेवी पर्वते पातु सर्वदा ॥ १८॥ मणिभृद्वज्रिणी देवी महाप्रतिसरे
    तथा । रक्ष रक्ष सदा हूं हूं ॐ ह्रीं स्वाहा महेश्वरी ॥ १९॥ पुष्पकेतुरजार्हेति कानने पातु सर्वदा । ॐ
    ह्रीं वज्रपुष्पं हुं फट् प्रान्तरे सर्वकामदा ॥ २०॥ ॐ पुष्पे पुष्पे महापुष्पे पातु पुत्रान्महेश्वरी
    । हूं स्वाहा शक्तिसंयुक्ता दारान् रक्षतु सर्वदा ॥ २१॥ ॐ आं हूं स्वाहा महेशानी पातु द्यूते हरप्रिया
    । ॐ ह्रीं सर्वविघ्नोत्सारिणी देवी विघ्नान्मां सदाऽवतु ॥ २२॥ ॐ पवित्रवज्रभूमे हुंफट्स्वाहा समन्विता
    । पूरिका पातु मां देवी सर्वविघ्नविनाशिनी ॥ २३॥ ॐ आः सुरेखे वज्ररेखे हुंफट्स्वाहासमन्विता । पाताले
    पातु सा देवी लाकिनी नामसंज्ञिका ॥ २४॥ ह्रींकारी पातु मां पूर्वे शक्तिरूपा महेश्वरी । स्त्रींकारी पातु
    देवेशी वधूरूपा महेश्वरी ॥ २५॥ हूंस्वरूपा महादेवी पातु मां क्रोधरूपिणी । फट्स्वरूपा महामाया उत्तरे
    पातु सर्वदा ॥ २६॥ पश्चिमे पातु मां देवी फट्स्वरूपा हरप्रिया । मध्ये मां पातु देवेशी हूंस्वरूपा नगात्मजा
    ॥ २७॥ नीलवर्णा सदा पातु सर्वतो वाग्भवा सदा । भवानी पातु भवने सर्वैश्वर्यप्रदायिनी ॥ २८॥ विद्यादानरता
    देवी वक्त्रे नीलसरस्वती । शास्त्रे वादे च सङ्ग्रामे जले च विषमे गिरौ ॥ २९॥ भीमरूपा सदा पातु श्मशाने
    भयनाशिनी । भूतप्रेतालये घोरे दुर्गमा श्रीघनाऽवतु ॥ ३०॥ पातु नित्यं महेशानी सर्वत्र शिवदूतिका । कवचस्य
    माहात्म्यं नाहं वर्षशतैरपि ॥ ३१॥ शक्नोमि गदितुं देवि भवेत्तस्य फलं च यत् । पुत्रदारेषु बन्धूनां सर्वदेशे
    च सर्वदा ॥ ३२॥ न विद्यते भयं तस्य नृपपूज्यो भवेच्च सः । शुचिर्भूत्वाऽशुचिर्वापि कवचं सर्वकामदम् ॥
    ३३॥ प्रपठन् वा स्मरन्मर्त्यो दुःखशोकविवर्जितः । सर्वशास्त्रे महेशानि कविराड् भवति ध्रुवम् ॥ ३४॥ सर्ववागीश्वरो
    मर्त्यो लोकवश्यो धनेश्वरः । रणे द्यूते विवादे च जयस्तत्र भवेद् ध्रुवम् ॥ ३५॥ पुत्रपौतान्वितो मर्त्यो
    विलासी सर्वयोषिताम् । शत्रवो दासतां यान्ति सर्वेषां वल्लभः सदा ॥ ३६॥ गर्वी खर्वी भवत्येव वादी स्खलति
    दर्शनात् । मृत्युश्च वश्यतां याति दासास्तस्यावनीभुजः ॥ ३७॥ प्रसङ्गात्कथितं सर्वं कवचं सर्वकामदम् ।
    प्रपठन्वा स्मरन्मर्त्यः शापानुग्रहणे क्षमः ॥ ३८॥ आनन्दवृन्दसिन्धूनामधिपः कविराड् भवेत् । सर्ववागिश्वरो
    मर्त्यो लोकवश्यः सदा सुखी ॥ ३९॥ गुरोः प्रसादमासाद्य विद्यां प्राप्य सुगोपिताम् । तत्रापि कवचं देवि
    दुर्लभं भुवनत्रये ॥ ४०॥ गुरुर्देवो हरः साक्षात्तत्पत्नी तु हरप्रिया । अभेदेन भजेद्यस्तु तस्य सिद्धिदूरतः
    ॥ ४१॥ मन्त्राचारा महेशानि कथिताः पूर्ववत्प्रिये । नाभौ ज्योतिस्तथा रक्तं हृदयोपरि चिन्तयेत् ॥ ४२॥
    ऐश्वर्यं सुकवित्वं च महावागिश्वरो नृपः । नित्यं तस्य महेशानि महिलासङ्गमं चरेत् ॥ ४३॥ पञ्चाचाररतो मर्त्यः
    सिद्धो भवति नान्यथा । शक्तियुक्तो भवेन्मर्त्यः सिद्धो भवति नान्यथा ॥ ४४॥ ब्रह्मा विष्णुश्च रुद्रश्च
    ये देवासुरमानुषाः । तं दृष्ट्वा साधकं देवि लज्जायुक्ता भवन्ति ते ॥ ४५॥ स्वर्गे मर्त्ये च पाताले ये
    देवाः सिद्धिदायकाः । प्रशंसन्ति सदा देवि तं दृष्ट्वा साधकोत्तमम् ॥ ४६॥ विघ्नात्मकाश्च ये देवाः स्वर्गे
    मर्त्ये रसातले । प्रशंसन्ति सदा सर्वे तं दृष्ट्वा साधकोत्तमम् ॥ ४७॥ इति ते कथितं देवि मया सम्यक्प्रकीर्तितम्
    । भुक्तिमुक्तिकरं साक्षात्कल्पवृक्षस्वरूपकम् ॥ ४८॥ आसाद्याद्यगुरुं प्रसाद्य य इदं कल्पद्रुमालम्बनं
    मोहेनापि मदेन चापि रहितो जाड्येन वा युज्यते । सिद्धोऽसौ भुवि सर्वदुःखविपदां पारं प्रयात्यन्तके मित्रं
    तस्य नृपाश्च देवि विपदो नश्यन्ति तस्याशु च ॥ ४९॥ तद्गात्रं प्राप्य शस्त्राणि ब्रह्मास्त्रादीनि वै
    भुवि । तस्य गेहे स्थिरा लक्ष्मीर्वाणी वक्त्रे वसेद् ध्रुवम् ॥ ५०॥ इदं कवचमज्ञात्वा तारां यो भजते नरः
    । अल्पायुर्निर्द्धनो मूर्खो भवत्येव न संशयः ॥ ५१॥ लिखित्वा धारयेद्यस्तु कण्ठे वा मस्तके भुजे । तस्य
    सर्वार्थसिद्धिः स्याद्यद्यन्मनसि वर्तते ॥ ५२॥ गोरोचनाकुङ्कुमेन रक्तचन्दनकेन वा । यावकैर्वा महेशानि
    लिखेन्मन्त्रं समाहितः ॥ ५३॥ अष्टम्यां मङ्गलदिने चतुर्द्दश्यामथापि वा । सन्ध्यायां देवदेवेशि लिखेद्यन्त्रं
    समाहितः ॥ ५४॥ मघायां श्रवणे वापि रेवत्यां वा विशेषतः । सिंहराशौ गते चन्द्रे कर्कटस्थे दिवाकरे ॥ ५५॥
    मीनराशौ गुरौ याते वृश्चिकस्थे शनैश्चरे । लिखित्वा धारयेद्यस्तु उत्तराभिमुखो भवेत् ॥ ५६॥ श्मशाने प्रान्तरे
    वापि शून्यागारे विशेषतः । निशायां वा लिखेन्मन्त्रं तस्य सिद्धिरचञ्चला ॥ ५७॥ भूर्जपत्रे लिखेन्मन्त्रं
    गुरुणा च महेश्वरि । ध्यानधारणयोगेन धारयेद्यस्तु भक्तितः ॥ ५८॥ अचिरात्तस्य सिद्धिः स्यान्नात्र कार्या
    विचारणा ॥ ५९॥ ॥ इति श्रीरुद्रयामले तन्त्रे उग्रताराकवचं सम्पूर्णम् ॥
