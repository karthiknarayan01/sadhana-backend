id: sri-venkateswara-sahasra-nama-stotram
category: stotram
name:
  english: Sri Venkateswara Sahasra Nama Stotram
content:
  english: shrivasishtha uvaca | bhagavan kena vidhina namabhirvenkateshvaram | pujayamasa tam devam brahma
    tu kamalaih shubhaih || || pricchami tani namani gunayogaparani kim | mukhyavrittini kim bruhi lakshakanyathava
    hareh || || narada uvaca | namanyanantani hareh gunayogani kani cit | mukhyavrittini canyani lakshakanyaparani
    ca || || paramarthaih sarvashabdaireko jneyah parah puman | adimadhyantarahitastvavyakto'nantarupabhrit
    || || candrarkavahnivayvadya graharkshani nabho dishah | anvayavyatirekabhyam santi no santi yanmateh
    || || tasya devasya namnam hi param gantum hi kah kshamah | tatha'pi cabhidhanani venkateshasya kanicit
    || || brahmagitani punyani tani vakshyami suvrata | yaduccaranamatrena vimuktaghah param vrajet ||
    || venkateshasya namnam hi sahasrasya rishirvidhih | chando'nushtuptatha devah shrivatsanko ramapatih
    || || bijabhutastathonkaro hrim klim shaktishca kilakam | om namo venkateshayetyadirmantro'tra kathyate
    || || brahmandagarbhah kavacamastram cakragadadharah | viniyogo'bhishtasiddhau hridayam samagayanah
    || || asya shri venkatesha sahasranama stotra mahamantrasya brahma rishih anushtup chandah shrivatsanko
    ramapatirdevata om bijam hrim shaktih klim kilakam brahmandagarbha iti kavacam cakragadadhara ityastram
    samaganamiti hridayam om namo venkateshayetyadirmantrah shri venkatesha prityarthe jape viniyogah
    || dhyanam bhasvaccandramasau yadiyanayane bharya yadiya rama yasmadvishvasridapyabhudyamikulam yaddhyanayuktam
    sada natho yo jagatam nagendraduhiturnatho'pi yadbhaktiman tato yo madanasya yo duritaha tam venkatesham
    bhaje || urdhvau hastau yadiyau suraripudalane bibhratau shankhacakre sevyavanghri svakiyavabhidadhadadharo
    dakshino yasya panih | tavanmatram bhavabdhim gamayati bhajatamurugo vamapanih shrivatsankashca lakshmiryadurasi
    lasatastam bhaje venkatesham || iti dhyayan venkatesham shrivatsankam ramapatim | venkatesho virupaksha
    ityarabhya japetkramat || stotram om venkatesho virupaksho vishvesho vishvabhavanah | vishvasridvishvasamharta
    vishvaprano viradvapuh || || sheshadrinilayo'sheshabhaktaduhkhapranashanah | sheshastutyah sheshashayi
    visheshajno vibhuh svabhuh || || vishnurjishnushca vardhishnurutsahishnuh sahishnukah | bhrajishnushca
    grasishnushca vartishnushca bharishnukah || || kalayanta kalagopta kalah kalantako'khilah | kalagamyah
    kalakanthavandyah kalakaleshvarah || || shambhuh svayambhurambhojanabhih stambhitavaridhih | ambhodhinandinijanih
    shonambhojapadaprabhah || || kambugrivah shambararirupah shambarajekshanah | bimbadharo bimbarupi
    pratibimbakriyatigah || || gunavan gunagamyashca gunatito gunapriyah | durgunadhvamsakritsarvasuguno
    gunabhasakah || || pareshah paramatma ca paranjyotih para gatih | param padam viyadvasah paramparyashubhapradah
    || || brahmandagarbho brahmanyo brahmasridbrahmabodhitah | brahmastutyo brahmavadi brahmacaryaparayanah
    || || satyavratarthasantushtah satyarupi jhashangavan | somakapranahari ca''nitamnayo'bdhisancarah
    || || devasuravarastutyah patanmandaradharakah | dhanvantarih kacchapangah payonidhivimanthakah ||
    || amaramritasandhata dhritasam mohinivapuh | haramohakamayavi rakshassandohabhanjanah || || hiranyakshavidari
    ca yajno yajnavibhavanah | yajniyorvisamuddharta lilakrodah pratapavan || || dandakasuravidhvamsi
    vakradamshtrah kshamadharah | gandharvashapaharanah punyagandho vicakshanah || || karalavaktrah somarkanetrah
    shadgunavaibhavah | shvetaghoni ghurnitabhrurghurghuradhvanivibhramah || || draghiyan nilakeshi ca
    jagradambujalocanah | ghrinavan ghrinisammoho mahakalagnididhitih || || jvalakaralavadano maholkakulavikshanah
    | satanirbhinnameghaugho damshtrarugvyaptadiktatah || || ucchvasakrishtabhutesho nishshvasatyaktavishvasrit
    | antarbhramajjagadgarbho'nanto brahmakapalahrit || || ugro viro mahavishnurjvalanah sarvatomukhah
    | nrisimho bhishano bhadro mrityumrityuh sanatanah || || sabhastambhodbhavo bhimah shiromali maheshvarah
    | dvadashadityacudalah kalpadhumasatacchavih || || hiranyakorahsthalabhinnakhah simhamukho'naghah
    | prahladavarado dhiman bhaktasanghapratishthitah || || brahmarudradisamsevyah siddhasadhyaprapujitah
    | lakshminrisimho devesho jvalajihvantramalikah || || khadgi kheti maheshvasi kapali musali hali |
    pashi shuli mahabahurjvaraghno rogalunthakah || || maunjiyuk chatrako dandi krishnajinadharo vatuh
    | adhitavedo vedantoddharako brahmanaishthikah || || ahinashayanapritah aditeyo'nagho harih | samvitpriyah
    samavedyo baliveshmapratishthitah || || balikshalitapadabjo vindhyavalivimanitah | tripadabhumisvikarta
    vishvarupapradarshakah || || dhritatrivikramah svanghrinakhabhinnandakharparah | pajjatavahinidharapavitritajagattrayah
    || || vidhisammanitah punyo daityayoddha jayorjitah | surarajyapradah shukramadahritsugatishvarah
    || || jamadagnyah kuthari ca kartaviryavidaranah | renukayah shirohari dushtakshatriyamardanah ||
    || varcasvi danashilashca dhanushman brahmavittamah | atyudagrah samagrashca nyagrodho dushtanigrahah
    || || ravivamshasamudbhuto raghavo bharatagrajah | kausalyatanayo ramo vishvamitrapriyankarah || ||
    tatakarih subahughno balatibalamantravan | ahalyashapavicchedi pravishtajanakalayah || || svayamvarasabhasamstha
    ishacapaprabhanjanah | janakiparineta ca janakadhishasamstutah || || jamadagnitanujatayoddha'yodhyadhipagranih
    | pitrivakyapratipalastyaktarajyah salakshmanah || || sasitashcitrakutastho bharatahitarajyakah |
    kakadarpapraharta ca dandakaranyavasakah || || pancavatyam vihari ca svadharmapariposhakah | viradhaha'gastyamukhyamunisammanitah
    puman || || indracapadharah khadgadharashcakshayasayakah | kharantako dushanaristrishiraskaripurvrishah
    || || tatah shurpanakhanasacchetta valkaladharakah | jatavan parnashalastho maricabalamardakah ||
    || pakshiratkritasamvado raviteja mahabalah | shabaryanitaphalabhuk hanumatparitoshitah || || sugriva'bhayado
    daityakayakshepanabhasurah | saptatalasamucchetta valihritkapisamvritah || || vayusunukritasevastyaktapampah
    kushasanah | udanvattiragah shuro vibhishanavarapradah || || setukriddaityaha praptalanko'lankaravan
    svayam | atikayashirashchetta kumbhakarnavibhedanah || || dashakanthashirodhvamsi jambavatpramukhavritah
    | janakishah suradhyakshah saketeshah puratanah || || punyashloko vedavedyah svamitirthanivasakah
    | lakshmisarahkelilolo lakshmisho lokarakshakah || || devakigarbhasambhuto yashodekshanalalitah |
    vasudevakritastotro nandagopamanoharah || || caturbhujah komalango gadavannilakuntalah | putanapranasamharta
    trinavartavinashanah || || gargaropitanamanko vasudevo hyadhokshajah | gopikastanyapayi ca balabhadranujo'cyutah
    || || vaiyaghranakhabhushashca vatsajidvatsavardhanah | kshirasarashanarato dadhibhandapramardanah
    || || navanitapaharta ca nilaniradabhasurah | abhiradrishtadaurjanyo nilapadmanibhananah || || matridarshitavishva''sya
    ulukhalanibandhanah | nalakubarashapanto godhulicchuritangakah || || gosangharakshakah shrisho brindaranyanivasakah
    | vatsantako bakadveshi daityambudamahanilah || || mahajagaracandagnih shakatapranakantakah | indrasevyah
    punyagatrah kharajiccandadidhitih || || talapakvaphalashi ca kaliyaphanidarpaha | nagapatnistutipritah
    pralambasurakhandanah || || davagnibalasamhari phalahari gadagrajah | gopanganacelacorah patholilavisharadah
    || || vamshaganapravinashca gopihastambujarcitah | munipatnyahritaharo munishreshtho munipriyah ||
    || govardhanadrisandharta sankrandanatamo'pahah | sadudyanavilasi ca rasakridaparayanah || || varunabhyarcito
    gopiprarthitah purushottamah | akrurastutisampritah kubjayauvanadayakah || || mushtikorahprahari ca
    canurodaradaranah | mallayuddhagraganyashca pitribandhanamocakah || || mattamatangapancasyah kamsagrivanikrintanah
    | ugrasenapratishthata ratnasimhasanasthitah || || kalanemikhaladveshi mucukundavarapradah | salvasevitadurdharsharajasmayanivaranah
    || || rukmigarvapahari ca rukmininayanotsavah | pradyumnajanakah kami pradyumno dvarakadhipah || ||
    manyaharta mahamayo jambavatkritasangarah | jambunadambaradharo gamyo jambavativibhuh || || kalindiprathitaramakelirgunjavatamsakah
    | mandarasumanobhasvan shacishabhishtadayakah || || satrajinmanasollasi satyajanih shubhavahah | shatadhanvaharah
    siddhah pandavapriyakotsavah || || bhadrapriyah subhadraya bhrata nagnajitivibhuh | kiritakundaladharah
    kalpapallavalalitah || || bhaishmipranayabhashavan mitravindadhipo'bhayah | svamurtikelisamprito lakshmanodaramanasah
    || || pragjyotishadhipadhvamsi tatsainyantakaro'mritah | bhumistuto bhuribhogo bhushanambarasamyutah
    || || bahuramakritahlado gandhamalyanulepanah | naradadrishtacarito devesho vishvaradguruh || || banabahuvidarashca
    tapajvaravinashakah | ushoddharshayita'vyaktah shivavaktushtamanasah || || maheshajvarasamstutyah
    shitajvarabhayantakah | nrigarajoddharakashca paundrakadivadhodyatah || || vividharicchalodvignabrahmaneshu
    dayaparah | jarasandhabaladveshi keshidaityabhayankarah || || cakri caidyantakah sabhyo rajabandhavimocakah
    | rajasuyahavirbhokta snigdhangah shubhalakshanah || || dhanabhakshanasampritah kucelabhishtadayakah
    | sattvadigunagambhiro draupadimanarakshakah || || bhishmadhyeyo bhaktavashyo bhimapujyo dayanidhih
    | dantavaktrashirashchetta krishnah krishnasakhah svarat || || vaijayantipramodi ca barhibarhavibhushanah
    | parthakauravasandhanakari dushshasanantakah || || buddho vishuddhah sarvajnah kratuhimsavinindakah
    | tripurastrimanabhangah sarvashastravisharadah || || nirvikaro nirmamashca nirabhaso niramayah |
    jaganmohakadharmi ca digvastro dikpatishvarah || || kalki mlecchapraharta ca dushtanigrahakarakah
    | dharmapratishtakari ca caturvarnyavibhagakrit || || yugantako yugakranto yugakridyugabhasakah |
    kamarih kamakari ca nishkamah kamitarthadah || || bhargo varenyah savituh sharngi vaikunthamandirah
    | hayagrivah kaitabharih grahaghno gajarakshakah || || sarvasamshayavicchetta sarvabhaktasamutsukah
    | kapardi kamahari ca kala kashtha smritirdhritih || || anadiraprameyaujah pradhanah sannirupakah
    | nirlepo nihspriho'sango nirbhayo nitiparagah || || nishpreshyo nishkriyah shanto nishprapanco nidhirnayah
    karmyakarmi vikarmi ca karmepsuh karmabhavanah || || karmangah karmavinyaso mahakarmi mahavrati |
    karmabhukkarmaphaladah karmeshah karmanigrahah || || naro narayano dantah kapilah kamadah shucih |
    tapta japta'kshamalavan ganta neta layo gatih || || shishto drashta ripudveshta roshta veshta mahanatah
    | roddha boddha mahayoddha shraddhavan satyadhih shubhah || || mantri mantro mantragamyo mantrakritparamantrahrit
    | mantrabhrinmantraphalado mantresho mantravigrahah || || mantrango mantravinyaso mahamantro mahakramah
    | sthiradhih sthiravijnanah sthiraprajnah sthirasanah || || sthirayogah sthiradharah sthiramargah
    sthiragamah | nishshreyaso niriho'gnirniravadyo niranjanah || || nirvairo nirahankaro nirdambho nirasuyakah
    | ananto'nantabahururanantanghriranantadrik || || anantavaktro'nantango'nantarupo hyanantakrit | urdhvareta
    urdhvalingo hyurdhvamurdhordhvashakhakah || || urdhva urdhvadhvarakshi ca hyurdhvajvalo nirakulah
    | bijam bijaprado nityo nidanam nishkritih kriti || || mahananiyan garima sushama citramalikah | nabhah
    sprinnabhaso jyotirnabhasvannirnabha nabhah || || abhurvibhuh prabhuh shambhurmahiyan bhurbhuvakritih
    | mahanando mahashuro mahorashirmahotsavah || || mahakrodho mahajvalo mahashanto mahagunah | satyavratah
    satyaparah satyasandhah satam gatih || || satyeshah satyasankalpah satyacaritralakshanah | antashcaro
    hyantaratma paramatma cidatmakah || || rocano rocamanashca sakshi shaurirjanardanah | mukundo nandanishpandah
    svarnabinduh purandarah || || arindamah sumandashca kundamandarahasavan | syandanarudhacandango hyanandi
    nandanandanah || || anasuyanandano'trinetranandah sunandavan | shankhavanpankajakarah kunkumanko jayankushah
    || || ambhojamakarandadhyo nishpanko'garupankilah | indrashcandrarathashcandro'ticandrashcandrabhasakah
    || || upendra indrarajashca vagindrashcandralocanah | pratyak parak parandhama paramarthah paratparah
    || || aparavak paragami paravarah paravarah | sahasvanarthadata ca sahanah sahasi jayi || || tejasvi
    vayuvishikhi tapasvi tapasottamah | aishvaryodbhutikridbhutiraishvaryangakalapavan || || ambhodhishayi
    bhagavan sarvajnah samaparagah | mahayogi mahadhiro mahabhogi mahaprabhuh || || mahaviro mahatushtirmahapushtirmahagunah
    | mahadevo mahabahurmahadharmo maheshvarah || || samipago duragami svargamarganirargalah | nago nagadharo
    nago nagesho nagapalakah || || hiranmayah svarnareta hiranyarcirhiranyadah | gunaganyah sharanyashca
    punyakirtih puranagah || || janyabhrijjanyasannaddho divyapancayudho vashi | daurjanyabhangah parjanyah
    saujanyanilayo'layah || || jalandharantako bhasmadaityanashi mahamanah | shreshthah shravishtho draghishtho
    garishtho garudadhvajah || || jyeshtho dradhishtho varshishtho draghiyan pranavah phani | sampradayakarah
    svami suresho madhavo madhuh || || nirnimesho vidhirvedha balavan jivanam bali | smarta shrota vikarta
    ca dhyata neta samo'samah || || hota pota mahavakta ranta manta khalantakah | data grahayita mata
    niyanta'nantavaibhavah || || gopta gopayita hanta dharmajagarita dhavah | karta kshetrakarah kshetrapradah
    kshetrajna atmavit || || kshetri kshetraharah kshetrapriyah kshemakaro marut | bhaktiprado muktidayi
    shaktido yuktidayakah || || shaktiyunmauktikasragvi suktiramnayasuktigah | dhananjayo dhanadhyaksho
    dhaniko dhanadadhipah || || mahadhano mahamani duryodhanavimanitah | ratnakaro ratnaroci ratnagarbhashrayah
    shucih || || ratnasanunidhirmauliratnabha ratnakankanah | antarlakshyo'ntarabhyasi cantardhyeyo jitasanah
    || || antarango dayavamshca hyantarmayo maharnavah | sarasah siddharasikah siddhih sadhyah sadagatih
    || || ayuhprado mahayushmanarcishmanoshadhipatih | ashtashrirashtabhago'shtakakubvyaptayasho vrati
    || || ashtapadah suvarnabho hyashtamurtistrimurtiman | asvapnah svapnagah svapnah susvapnaphaladayakah
    || || duhsvapnadhvamsako dhvastadurnimittah shivankarah | suvarnavarnah sambhavyo varnito varnasammukhah
    || || suvarnamukharitirashivadhyatapadambujah | dakshayanivacastushto durvasodrishtigocarah || ||
    ambarishavrataprito mahakrittivibhanjanah | mahabhicarakadhvamsi kalasarpabhayantakah || || sudarshanah
    kalameghashyamah shrimantrabhavitah | hemambujasarahsnayi shrimanobhavitakritih || || shripradattambujasragvi
    shrikelih shrinidhirbhavah | shriprado vamano lakshminayakashca caturbhujah || || santriptastarpitastirthasnatrisaukhyapradarshakah
    | agastyastutisamhrishto darshitavyaktabhavanah || || kapilarcih kapilavan susnataghavipatanah | vrishakapih
    kapisvamimano'ntahsthitavigrahah || || vahnipriyo'rthasambhavyo janalokavidhayakah | vahniprabho vahnitejah
    shubhabhishtaprado yami || || varunakshetranilayo varuno varanarcitah | vayusthanakritavaso vayugo
    vayusambhritah || || yamantako'bhijanano yamalokanivaranah | yaminamagraganyashca samyami yamabhavitah
    || || indrodyanasamipasthah indradrigvishayah prabhuh | yaksharat sarasivaso hyakshayyanidhikoshakrit
    || || svamitirthakritavasah svamidhyeyo hyadhokshajah | varahadyashtatirthabhisevitanghrisaroruhah
    || || pandutirthabhishiktango yudhishthiravarapradah | bhimantahkaranarudhah shvetavahanasakhyavan
    || || nakulabhayado madrisahadevabhivanditah | krishnashapathasandhata kuntistutirato dami || || naradadimunistutyo
    nityakarmaparayanah | darshitavyaktarupashca vinanadapramoditah || || shatkotitirthacaryavan devatirthakritashramah
    | bilvamalajalasnayi sarasvatyambusevitah || || tumburudakasamsparshajanacittatamo'pahah | matsyavamanakurmaditirtharajah
    puranabhrit || || cakradhyeyapadambhojah shankhapujitapadukah | ramatirthavihari ca balabhadrapratishthitah
    || || jamadagnyasarastirthajalasecanatarpitah | papapaharikilalasusnataghavinashanah || || nabhogangabhishiktashca
    nagatirthabhishekavan | kumaradharatirthastho vatuveshah sumekhalah || || vriddhasya sukumaratvapradah
    saundaryavan sukhi | priyamvado mahakukshirikshvakukulanandanah || || nilagokshiradharabhurvarahacalanayakah
    | bharadvajapratishthavan brihaspativibhavitah || || anjanakritapujavan anjaneyakararcitah | anjanadrinivasashca
    munjakeshah purandarah || || kinnaradvayasambandhibandhamokshapradayakah | vaikhanasamakharambho vrishajneyo
    vrishacalah || || vrishakayaprabhetta ca kridanacarasambhramah | sauvarcaleyavinyastarajyo narayanah
    priyah || || durmedhobhanjakah prajno brahmotsavamahotsukah | bhadrasurashirashchetta bhadrakshetri
    subhadravan || || mrigaya'kshinasannahah shankharajanyatushtidah | sthanustho vainateyangabhavito
    hyashariravan || || bhogindrabhogasamsthano brahmadiganasevitah | sahasrarkacchatabhasvadvimanantahsthito
    guni || || vishvaksenakritastotrah sanandanavarivritah | jahnavyadinadisevyah sureshadyabhivanditah
    || || surangananrityaparo gandharvodgayanapriyah | rakendusankashanakhah komalanghrisaroruhah || ||
    kacchapaprapadah kundagulphakah svacchakurparah | medurasvarnavastradhyakatideshasthamekhalah || ||
    prollasacchurikabhasvatkatideshah shubhankarah | anantapadmajasthananabhirmauktikamalikah || || mandaracampeyamali
    ratnabharanasambhritah | lambayajnopaviti ca candrashrikhandalepavan || || varado'bhayadashcakri shankhi
    kaustubhadiptiman | shrivatsankitavakshasko lakshmisamshritahrittatah || || nilotpalanibhakarah shonambhojasamananah
    | kotimanmathalavanyashcandrikasmitapuritah || || sudhasvacchordhvapundrashca kasturitilakancitah
    | pundarikekshanah svaccho maulishobhavirajitah || || padmasthah padmanabhashca somamandalago budhah
    | vahnimandalagah suryah suryamandalasamsthitah || || shripatirbhumijanishca vimaladyabhisamvritah
    | jagatkutumbajanita rakshakah kamitapradah || || avasthatrayayanta ca vishvatejassvarupavan | jnaptirjneyo
    jnanagamyo jnanatitah suratigah || || brahmandantarbahirvyapto venkatadrigadadharah | venkatadrigadadhara
    om namah iti || evam shrivenkateshasya kirtitam paramadbhutam || || namnam sahasram samshravyam pavitram
    punyavardhanam | shravanatsarvadoshaghnam rogaghnam mrityunashanam || || daridryabhedanam dharmyam
    sarvaishvaryaphalapradam | kalahivishavicchedi jvarapasmarabhanjanam || shatrukshayakaram rajagrahapidanivaranam
    | brahmarakshasakushmandabhetalabhayabhanjanam || vidyabhilashi vidyavan dhanarthi dhanavan bhavet
    | anantakalpajivi syadayushkamo mahayashah || || putrarthi sugunanputran labheta''yushmatastatah |
    sangrame shatruvijayi sabhayam prativadijit || || divyairnamabhirebhistu tulasipujanatsakrit | vaikunthavasi
    bhagavatsadrisho vishnusannidhau || || kalharapujananmasat dvitiya iva yaksharat | nilotpalarcanatsarvarajapujyah
    sada bhavet || || hritsamsthitairnamabhistu bhuyaddrigvishayo harih | vanchitartham tada datva vaikuntham
    ca prayacchati || || trisandhyam yo japennityam sampujya vidhina vibhum | trivaram pancavaram va pratyaham
    kramasho yami || || masadalakshminashah syat dvimasat syannarendrata | trimasanmahadaishvaryam tatah
    sambhashanam bhavet || || masam pathannyunakarmapurtim ca samavapnuyat | margabhrashtashca sanmargam
    gatasvah svam svakiyakam || || cancalyacitto'cancalyam manassvasthyam ca gacchati | ayurarogyamaishvaryam
    jnanam moksham ca vindati || || sarvankamanavapnoti shashvatam ca padam tatha | satyam satyam punassatyam
    satyam satyam na samshayah || || iti shri brahmandapurane vasishthanaradasamvade shrivenkatacalamahatmye
    shri venkatesha sahasranama stotram samaptam |
  devanagari: श्रीवसिष्ठ उवाच । भगवन् केन विधिना नामभिर्वेङ्कटेश्वरम् । पूजयामास तं देवं ब्रह्मा तु कमलैः
    शुभैः ॥ ॥ पृच्छामि तानि नामानि गुणयोगपराणि किम् । मुख्यवृत्तीनि किं ब्रूहि लक्षकाण्यथवा हरेः ॥ ॥ नारद
    उवाच । नामान्यनन्तानि हरेः गुणयोगानि कानि चित् । मुख्यवृत्तीनि चान्यानि लक्षकाण्यपराणि च ॥ ॥ परमार्थैः
    सर्वशब्दैरेको ज्ञेयः परः पुमान् । आदिमध्यान्तरहितस्त्वव्यक्तोऽनन्तरूपभृत् ॥ ॥ चन्द्रार्कवह्निवाय्वाद्या
    ग्रहर्क्षाणि नभो दिशः । अन्वयव्यतिरेकाभ्यां सन्ति नो सन्ति यन्मतेः ॥ ॥ तस्य देवस्य नाम्नां हि पारं
    गन्तुं हि कः क्षमः । तथाऽपि चाभिधानानि वेङ्कटेशस्य कानिचित् ॥ ॥ ब्रह्मगीतानि पुण्यानि तानि वक्ष्यामि
    सुव्रत । यदुच्चारणमात्रेण विमुक्ताघः परं व्रजेत् ॥ ॥ वेङ्कटेशस्य नाम्नां हि सहस्रस्य ऋषिर्विधिः ।
    छन्दोऽनुष्टुप्तथा देवः श्रीवत्साङ्को रमापतिः ॥ ॥ बीजभूतस्तथोङ्कारो ह्रीं क्लीं शक्तिश्च कीलकम् । ॐ
    नमो वेङ्कटेशायेत्यादिर्मन्त्रोऽत्र कथ्यते ॥ ॥ ब्रह्माण्डगर्भः कवचमस्त्रं चक्रगदाधरः । विनियोगोऽभीष्टसिद्धौ
    हृदयं सामगायनः ॥ ॥ अस्य श्री वेङ्कटेश सहस्रनाम स्तोत्र महामन्त्रस्य ब्रह्मा ऋषिः अनुष्टुप् छन्दः श्रीवत्साङ्को
    रमापतिर्देवता ॐ बीजं ह्रीं शक्तिः क्लीं कीलकं ब्रह्माण्डगर्भ इति कवचं चक्रगदाधर इत्यस्त्रं सामगानमिति
    हृदयं ॐ नमो वेङ्कटेशायेत्यादिर्मन्त्रः श्री वेङ्कटेश प्रीत्यर्थे जपे विनियोगः ॥ ध्यानम् भास्वच्चन्द्रमसौ
    यदीयनयने भार्या यदीया रमा यस्माद्विश्वसृडप्यभूद्यमिकुलं यद्ध्यानयुक्तं सदा नाथो यो जगतां नगेन्द्रदुहितुर्नाथोऽपि
    यद्भक्तिमान् तातो यो मदनस्य यो दुरितहा तं वेङ्कटेशं भजे ॥ ऊर्ध्वौ हस्तौ यदीयौ सुररिपुदलने बिभ्रतौ
    शङ्खचक्रे सेव्यावङ्घ्री स्वकीयावभिदधदधरो दक्षिणो यस्य पाणिः । तावन्मात्रं भवाब्धिं गमयति भजतामूरुगो
    वामपाणिः श्रीवत्साङ्कश्च लक्ष्मीर्यदुरसि लसतस्तं भजे वेङ्कटेशम् ॥ इति ध्यायन् वेङ्कटेशं श्रीवत्साङ्कं
    रमापतिम् । वेङ्कटेशो विरूपाक्ष इत्यारभ्य जपेत्क्रमात् ॥ स्तोत्रं ॐ वेङ्कटेशो विरूपाक्षो विश्वेशो विश्वभावनः
    । विश्वसृड्विश्वसंहर्ता विश्वप्राणो विराड्वपुः ॥ ॥ शेषाद्रिनिलयोऽशेषभक्तदुःखप्रणाशनः । शेषस्तुत्यः
    शेषशायी विशेषज्ञो विभुः स्वभूः ॥ ॥ विष्णुर्जिष्णुश्च वर्धिष्णुरुत्सहिष्णुः सहिष्णुकः । भ्राजिष्णुश्च
    ग्रसिष्णुश्च वर्तिष्णुश्च भरिष्णुकः ॥ ॥ कालयन्ता कालगोप्ता कालः कालान्तकोऽखिलः । कालगम्यः कालकण्ठवन्द्यः
    कालकलेश्वरः ॥ ॥ शम्भुः स्वयम्भूरम्भोजनाभिः स्तम्भितवारिधिः । अम्भोधिनन्दिनीजानिः शोणाम्भोजपदप्रभः
    ॥ ॥ कम्बुग्रीवः शम्बरारिरूपः शम्बरजेक्षणः । बिम्बाधरो बिम्बरूपी प्रतिबिम्बक्रियातिगः ॥ ॥ गुणवान् गुणगम्यश्च
    गुणातीतो गुणप्रियः । दुर्गुणध्वंसकृत्सर्वसुगुणो गुणभासकः ॥ ॥ परेशः परमात्मा च परञ्ज्योतिः परा गतिः
    । परं पदं वियद्वासाः पारम्पर्यशुभप्रदः ॥ ॥ ब्रह्माण्डगर्भो ब्रह्मण्यो ब्रह्मसृड्ब्रह्मबोधितः । ब्रह्मस्तुत्यो
    ब्रह्मवादी ब्रह्मचर्यपरायणः ॥ ॥ सत्यव्रतार्थसन्तुष्टः सत्यरूपी झषाङ्गवान् । सोमकप्राणहारी चाऽऽनीताम्नायोऽब्धिसञ्चरः
    ॥ ॥ देवासुरवरस्तुत्यः पतन्मन्दरधारकः । धन्वन्तरिः कच्छपाङ्गः पयोनिधिविमन्थकः ॥ ॥ अमरामृतसन्धाता धृतसं
    मोहिनीवपुः । हरमोहकमायावी रक्षस्सन्दोहभञ्जनः ॥ ॥ हिरण्याक्षविदारी च यज्ञो यज्ञविभावनः । यज्ञीयोर्वीसमुद्धर्ता
    लीलाक्रोडः प्रतापवान् ॥ ॥ दण्डकासुरविध्वंसी वक्रदंष्ट्रः क्षमाधरः । गन्धर्वशापहरणः पुण्यगन्धो विचक्षणः
    ॥ ॥ करालवक्त्रः सोमार्कनेत्रः षड्गुणवैभवः । श्वेतघोणी घूर्णितभ्रूर्घुर्घुरध्वनिविभ्रमः ॥ ॥ द्राघीयान्
    नीलकेशी च जाग्रदम्बुजलोचनः । घृणावान् घृणिसम्मोहो महाकालाग्निदीधितिः ॥ ॥ ज्वालाकरालवदनो महोल्काकुलवीक्षणः
    । सटानिर्भिन्नमेघौघो दंष्ट्रारुग्व्याप्तदिक्तटः ॥ ॥ उच्छ्वासाकृष्टभूतेशो निश्श्वासत्यक्तविश्वसृट्
    । अन्तर्भ्रमज्जगद्गर्भोऽनन्तो ब्रह्मकपालहृत् ॥ ॥ उग्रो वीरो महाविष्णुर्ज्वलनः सर्वतोमुखः । नृसिंहो
    भीषणो भद्रो मृत्युमृत्युः सनातनः ॥ ॥ सभास्तम्भोद्भवो भीमः शीरोमाली महेश्वरः । द्वादशादित्यचूडालः कल्पधूमसटाच्छविः
    ॥ ॥ हिरण्यकोरःस्थलभिन्नखः सिंहमुखोऽनघः । प्रह्लादवरदो धीमान् भक्तसङ्घप्रतिष्ठितः ॥ ॥ ब्रह्मरुद्रादिसंसेव्यः
    सिद्धसाध्यप्रपूजितः । लक्ष्मीनृसिंहो देवेशो ज्वालाजिह्वान्त्रमालिकः ॥ ॥ खड्गी खेटी महेष्वासी कपाली
    मुसली हली । पाशी शूली महाबाहुर्ज्वरघ्नो रोगलुण्ठकः ॥ ॥ मौञ्जीयुक् छात्रको दण्डी कृष्णाजिनधरो वटुः
    । अधीतवेदो वेदान्तोद्धारको ब्रह्मनैष्ठिकः ॥ ॥ अहीनशयनप्रीतः आदितेयोऽनघो हरिः । संवित्प्रियः सामवेद्यो
    बलिवेश्मप्रतिष्ठितः ॥ ॥ बलिक्षालितपादाब्जो विन्ध्यावलिविमानितः । त्रिपादभूमिस्वीकर्ता विश्वरूपप्रदर्शकः
    ॥ ॥ धृतत्रिविक्रमः स्वाङ्घ्रिनखभिन्नाण्डखर्परः । पज्जातवाहिनीधारापवित्रितजगत्त्रयः ॥ ॥ विधिसम्मानितः
    पुण्यो दैत्ययोद्धा जयोर्जितः । सुरराज्यप्रदः शुक्रमदहृत्सुगतीश्वरः ॥ ॥ जामदग्न्यः कुठारी च कार्तवीर्यविदारणः
    । रेणुकायाः शिरोहारी दुष्टक्षत्रियमर्दनः ॥ ॥ वर्चस्वी दानशीलश्च धनुष्मान् ब्रह्मवित्तमः । अत्युदग्रः
    समग्रश्च न्यग्रोधो दुष्टनिग्रहः ॥ ॥ रविवंशसमुद्भूतो राघवो भरताग्रजः । कौसल्यातनयो रामो विश्वामित्रप्रियङ्करः
    ॥ ॥ ताटकारिः सुबाहुघ्नो बलातिबलमन्त्रवान् । अहल्याशापविच्छेदी प्रविष्टजनकालयः ॥ ॥ स्वयंवरसभासंस्थ
    ईशचापप्रभञ्जनः । जानकीपरिणेता च जनकाधीशसंस्तुतः ॥ ॥ जमदग्नितनूजातयोद्धाऽयोध्याधिपाग्रणीः । पितृवाक्यप्रतीपालस्त्यक्तराज्यः
    सलक्ष्मणः ॥ ॥ ससीतश्चित्रकूटस्थो भरताहितराज्यकः । काकदर्पप्रहर्ता च दण्डकारण्यवासकः ॥ ॥ पञ्चवट्यां
    विहारी च स्वधर्मपरिपोषकः । विराधहाऽगस्त्यमुख्यमुनिसम्मानितः पुमान् ॥ ॥ इन्द्रचापधरः खड्गधरश्चाक्षयसायकः
    । खरान्तको दूषणारिस्त्रिशिरस्करिपुर्वृषः ॥ ॥ ततः शूर्पणखानासाच्छेत्ता वल्कलधारकः । जटावान् पर्णशालास्थो
    मारीचबलमर्दकः ॥ ॥ पक्षिराट्कृतसंवादो रवितेजा महाबलः । शबर्यानीतफलभुक् हनूमत्परितोषितः ॥ ॥ सुग्रीवाऽभयदो
    दैत्यकायक्षेपणभासुरः । सप्ततालसमुच्छेत्ता वालिहृत्कपिसंवृतः ॥ ॥ वायुसूनुकृतासेवस्त्यक्तपम्पः कुशासनः
    । उदन्वत्तीरगः शूरो विभीषणवरप्रदः ॥ ॥ सेतुकृद्दैत्यहा प्राप्तलङ्कोऽलङ्कारवान् स्वयम् । अतिकायशिरश्छेत्ता
    कुम्भकर्णविभेदनः ॥ ॥ दशकण्ठशिरोध्वंसी जाम्बवत्प्रमुखावृतः । जानकीशः सुराध्यक्षः साकेतेशः पुरातनः ॥
    ॥ पुण्यश्लोको वेदवेद्यः स्वामितीर्थनिवासकः । लक्ष्मीसरःकेलिलोलो लक्ष्मीशो लोकरक्षकः ॥ ॥ देवकीगर्भसम्भूतो
    यशोदेक्षणलालितः । वसुदेवकृतस्तोत्रो नन्दगोपमनोहरः ॥ ॥ चतुर्भुजः कोमलाङ्गो गदावान्नीलकुन्तलः । पूतनाप्राणसंहर्ता
    तृणावर्तविनाशनः ॥ ॥ गर्गारोपितनामाङ्को वासुदेवो ह्यधोक्षजः । गोपिकास्तन्यपायी च बलभद्रानुजोऽच्युतः
    ॥ ॥ वैयाघ्रनखभूषश्च वत्सजिद्वत्सवर्धनः । क्षीरसाराशनरतो दधिभाण्डप्रमर्दनः ॥ ॥ नवनीतापहर्ता च नीलनीरदभासुरः
    । आभीरदृष्टदौर्जन्यो नीलपद्मनिभाननः ॥ ॥ मातृदर्शितविश्वाऽऽस्य उलूखलनिबन्धनः । नलकूबरशापान्तो गोधूलिच्छुरिताङ्गकः
    ॥ ॥ गोसङ्घरक्षकः श्रीशो बृन्दारण्यनिवासकः । वत्सान्तको बकद्वेषी दैत्याम्बुदमहानिलः ॥ ॥ महाजगरचण्डाग्निः
    शकटप्राणकण्टकः । इन्द्रसेव्यः पुण्यगात्रः खरजिच्चण्डदीधितिः ॥ ॥ तालपक्वफलाशी च कालीयफणिदर्पहा । नागपत्नीस्तुतिप्रीतः
    प्रलम्बासुरखण्डनः ॥ ॥ दावाग्निबलसंहारी फलाहारी गदाग्रजः । गोपाङ्गनाचेलचोरः पाथोलीलाविशारदः ॥ ॥ वंशगानप्रवीणश्च
    गोपीहस्ताम्बुजार्चितः । मुनिपत्न्याहृताहारो मुनिश्रेष्ठो मुनिप्रियः ॥ ॥ गोवर्धनाद्रिसन्धर्ता सङ्क्रन्दनतमोऽपहः
    । सदुद्यानविलासी च रासक्रीडापरायणः ॥ ॥ वरुणाभ्यर्चितो गोपीप्रार्थितः पुरुषोत्तमः । अक्रूरस्तुतिसम्प्रीतः
    कुब्जायौवनदायकः ॥ ॥ मुष्टिकोरःप्रहारी च चाणूरोदरदारणः । मल्लयुद्धाग्रगण्यश्च पितृबन्धनमोचकः ॥ ॥ मत्तमातङ्गपञ्चास्यः
    कंसग्रीवानिकृन्तनः । उग्रसेनप्रतिष्ठाता रत्नसिंहासनस्थितः ॥ ॥ कालनेमिखलद्वेषी मुचुकुन्दवरप्रदः । साल्वसेवितदुर्धर्षराजस्मयनिवारणः
    ॥ ॥ रुक्मिगर्वापहारी च रुक्मिणीनयनोत्सवः । प्रद्युम्नजनकः कामी प्रद्युम्नो द्वारकाधिपः ॥ ॥ मण्याहर्ता
    महामायो जाम्बवत्कृतसङ्गरः । जाम्बूनदाम्बरधरो गम्यो जाम्बवतीविभुः ॥ ॥ कालिन्दीप्रथितारामकेलिर्गुञ्जावतंसकः
    । मन्दारसुमनोभास्वान् शचीशाभीष्टदायकः ॥ ॥ सत्राजिन्मानसोल्लासी सत्याजानिः शुभावहः । शतधन्वहरः सिद्धः
    पाण्डवप्रियकोत्सवः ॥ ॥ भद्रप्रियः सुभद्राया भ्राता नाग्नाजितीविभुः । किरीटकुण्डलधरः कल्पपल्लवलालितः
    ॥ ॥ भैष्मीप्रणयभाषावान् मित्रविन्दाधिपोऽभयः । स्वमूर्तिकेलिसम्प्रीतो लक्ष्मणोदारमानसः ॥ ॥ प्राग्ज्योतिषाधिपध्वंसी
    तत्सैन्यान्तकरोऽमृतः । भूमिस्तुतो भूरिभोगो भूषणाम्बरसंयुतः ॥ ॥ बहुरामाकृताह्लादो गन्धमाल्यानुलेपनः
    । नारदादृष्टचरितो देवेशो विश्वराड्गुरुः ॥ ॥ बाणबाहुविदारश्च तापज्वरविनाशकः । उषोद्धर्षयिताऽव्यक्तः
    शिववाक्तुष्टमानसः ॥ ॥ महेशज्वरसंस्तुत्यः शीतज्वरभयान्तकः । नृगराजोद्धारकश्च पौण्ड्रकादिवधोद्यतः ॥
    ॥ विविधारिच्छलोद्विग्नब्राह्मणेषु दयापरः । जरासन्धबलद्वेषी केशिदैत्यभयङ्करः ॥ ॥ चक्री चैद्यान्तकः
    सभ्यो राजबन्धविमोचकः । राजसूयहविर्भोक्ता स्निग्धाङ्गः शुभलक्षणः ॥ ॥ धानाभक्षणसम्प्रीतः कुचेलाभीष्टदायकः
    । सत्त्वादिगुणगम्भीरो द्रौपदीमानरक्षकः ॥ ॥ भीष्मध्येयो भक्तवश्यो भीमपूज्यो दयानिधिः । दन्तवक्त्रशिरश्छेत्ता
    कृष्णः कृष्णासखः स्वराट् ॥ ॥ वैजयन्तीप्रमोदी च बर्हिबर्हविभूषणः । पार्थकौरवसन्धानकारी दुश्शासनान्तकः
    ॥ ॥ बुद्धो विशुद्धः सर्वज्ञः क्रतुहिंसाविनिन्दकः । त्रिपुरस्त्रीमानभङ्गः सर्वशास्त्रविशारदः ॥ ॥ निर्विकारो
    निर्ममश्च निराभासो निरामयः । जगन्मोहकधर्मी च दिग्वस्त्रो दिक्पतीश्वरः ॥ ॥ कल्की म्लेच्छप्रहर्ता च
    दुष्टनिग्रहकारकः । धर्मप्रतिष्टाकारी च चातुर्वर्ण्यविभागकृत् ॥ ॥ युगान्तको युगाक्रान्तो युगकृद्युगभासकः
    । कामारिः कामकारी च निष्कामः कामितार्थदः ॥ ॥ भर्गो वरेण्यः सवितुः शार्ङ्गी वैकुण्ठमन्दिरः । हयग्रीवः
    कैटभारिः ग्राहघ्नो गजरक्षकः ॥ ॥ सर्वसंशयविच्छेत्ता सर्वभक्तसमुत्सुकः । कपर्दी कामहारी च कला काष्ठा
    स्मृतिर्धृतिः ॥ ॥ अनादिरप्रमेयौजाः प्रधानः सन्निरूपकः । निर्लेपो निःस्पृहोऽसङ्गो निर्भयो नीतिपारगः
    ॥ ॥ निष्प्रेष्यो निष्क्रियः शान्तो निष्प्रपञ्चो निधिर्नयः कर्म्यकर्मी विकर्मी च कर्मेप्सुः कर्मभावनः
    ॥ ॥ कर्माङ्गः कर्मविन्यासो महाकर्मी महाव्रती । कर्मभुक्कर्मफलदः कर्मेशः कर्मनिग्रहः ॥ ॥ नरो नारायणो
    दान्तः कपिलः कामदः शुचिः । तप्ता जप्ताऽक्षमालावान् गन्ता नेता लयो गतिः ॥ ॥ शिष्टो द्रष्टा रिपुद्वेष्टा
    रोष्टा वेष्टा महानटः । रोद्धा बोद्धा महायोद्धा श्रद्धावान् सत्यधीः शुभः ॥ ॥ मन्त्री मन्त्रो मन्त्रगम्यो
    मन्त्रकृत्परमन्त्रहृत् । मन्त्रभृन्मन्त्रफलदो मन्त्रेशो मन्त्रविग्रहः ॥ ॥ मन्त्राङ्गो मन्त्रविन्यासो
    महामन्त्रो महाक्रमः । स्थिरधीः स्थिरविज्ञानः स्थिरप्रज्ञः स्थिरासनः ॥ ॥ स्थिरयोगः स्थिराधारः स्थिरमार्गः
    स्थिरागमः । निश्श्रेयसो निरीहोऽग्निर्निरवद्यो निरञ्जनः ॥ ॥ निर्वैरो निरहङ्कारो निर्दम्भो निरसूयकः
    । अनन्तोऽनन्तबाहूरुरनन्ताङ्घ्रिरनन्तदृक् ॥ ॥ अनन्तवक्त्रोऽनन्ताङ्गोऽनन्तरूपो ह्यनन्तकृत् । ऊर्ध्वरेता
    ऊर्ध्वलिङ्गो ह्यूर्ध्वमूर्धोर्ध्वशाखकः ॥ ॥ ऊर्ध्व ऊर्ध्वाध्वरक्षी च ह्यूर्ध्वज्वालो निराकुलः । बीजं
    बीजप्रदो नित्यो निदानं निष्कृतिः कृती ॥ ॥ महानणीयन् गरिमा सुषमा चित्रमालिकः । नभः स्पृङ्नभसो ज्योतिर्नभस्वान्निर्नभा
    नभः ॥ ॥ अभुर्विभुः प्रभुः शम्भुर्महीयान् भूर्भुवाकृतिः । महानन्दो महाशूरो महोराशिर्महोत्सवः ॥ ॥ महाक्रोधो
    महाज्वालो महाशान्तो महागुणः । सत्यव्रतः सत्यपरः सत्यसन्धः सतां गतिः ॥ ॥ सत्येशः सत्यसङ्कल्पः सत्यचारित्रलक्षणः
    । अन्तश्चरो ह्यन्तरात्मा परमात्मा चिदात्मकः ॥ ॥ रोचनो रोचमानश्च साक्षी शौरिर्जनार्दनः । मुकुन्दो नन्दनिष्पन्दः
    स्वर्णबिन्दुः पुरन्दरः ॥ ॥ अरिन्दमः सुमन्दश्च कुन्दमन्दारहासवान् । स्यन्दनारूढचण्डाङ्गो ह्यानन्दी
    नन्दनन्दनः ॥ ॥ अनसूयानन्दनोऽत्रिनेत्रानन्दः सुनन्दवान् । शङ्खवान्पङ्कजकरः कुङ्कुमाङ्को जयाङ्कुशः ॥
    ॥ अम्भोजमकरन्दाढ्यो निष्पङ्कोऽगरुपङ्किलः । इन्द्रश्चन्द्ररथश्चन्द्रोऽतिचन्द्रश्चन्द्रभासकः ॥ ॥ उपेन्द्र
    इन्द्रराजश्च वागिन्द्रश्चन्द्रलोचनः । प्रत्यक् पराक् परन्धाम परमार्थः परात्परः ॥ ॥ अपारवाक् पारगामी
    पारावारः परावरः । सहस्वानर्थदाता च सहनः साहसी जयी ॥ ॥ तेजस्वी वायुविशिखी तपस्वी तापसोत्तमः । ऐश्वर्योद्भूतिकृद्भूतिरैश्वर्याङ्गकलापवान्
    ॥ ॥ अम्भोधिशायी भगवान् सर्वज्ञः सामपारगः । महायोगी महाधीरो महाभोगी महाप्रभुः ॥ ॥ महावीरो महातुष्टिर्महापुष्टिर्महागुणः
    । महादेवो महाबाहुर्महाधर्मो महेश्वरः ॥ ॥ समीपगो दूरगामी स्वर्गमार्गनिरर्गलः । नगो नगधरो नागो नागेशो
    नागपालकः ॥ ॥ हिरण्मयः स्वर्णरेता हिरण्यार्चिर्हिरण्यदः । गुणगण्यः शरण्यश्च पुण्यकीर्तिः पुराणगः ॥
    ॥ जन्यभृज्जन्यसन्नद्धो दिव्यपञ्चायुधो वशी । दौर्जन्यभङ्गः पर्जन्यः सौजन्यनिलयोऽलयः ॥ ॥ जलन्धरान्तको
    भस्मदैत्यनाशी महामनाः । श्रेष्ठः श्रविष्ठो द्राघिष्ठो गरिष्ठो गरुडध्वजः ॥ ॥ ज्येष्ठो द्रढिष्ठो वर्षिष्ठो
    द्राघीयान् प्रणवः फणी । सम्प्रदायकरः स्वामी सुरेशो माधवो मधुः ॥ ॥ निर्निमेषो विधिर्वेधा बलवान् जीवनं
    बली । स्मर्ता श्रोता विकर्ता च ध्याता नेता समोऽसमः ॥ ॥ होता पोता महावक्ता रन्ता मन्ता खलान्तकः । दाता
    ग्राहयिता माता नियन्ताऽनन्तवैभवः ॥ ॥ गोप्ता गोपयिता हन्ता धर्मजागरिता धवः । कर्ता क्षेत्रकरः क्षेत्रप्रदः
    क्षेत्रज्ञ आत्मवित् ॥ ॥ क्षेत्री क्षेत्रहरः क्षेत्रप्रियः क्षेमकरो मरुत् । भक्तिप्रदो मुक्तिदायी शक्तिदो
    युक्तिदायकः ॥ ॥ शक्तियुङ्मौक्तिकस्रग्वी सूक्तिराम्नायसूक्तिगः । धनञ्जयो धनाध्यक्षो धनिको धनदाधिपः
    ॥ ॥ महाधनो महामानी दुर्योधनविमानितः । रत्नाकरो रत्नरोची रत्नगर्भाश्रयः शुचिः ॥ ॥ रत्नसानुनिधिर्मौलिरत्नभा
    रत्नकङ्कणः । अन्तर्लक्ष्योऽन्तरभ्यासी चान्तर्ध्येयो जितासनः ॥ ॥ अन्तरङ्गो दयावांश्च ह्यन्तर्मायो महार्णवः
    । सरसः सिद्धरसिकः सिद्धिः साध्यः सदागतिः ॥ ॥ आयुःप्रदो महायुष्मानर्चिष्मानोषधीपतिः । अष्टश्रीरष्टभागोऽष्टककुब्व्याप्तयशो
    व्रती ॥ ॥ अष्टापदः सुवर्णाभो ह्यष्टमूर्तिस्त्रिमूर्तिमान् । अस्वप्नः स्वप्नगः स्वप्नः सुस्वप्नफलदायकः
    ॥ ॥ दुःस्वप्नध्वंसको ध्वस्तदुर्निमित्तः शिवङ्करः । सुवर्णवर्णः सम्भाव्यो वर्णितो वर्णसम्मुखः ॥ ॥ सुवर्णमुखरीतीरशिवध्यातपदाम्बुजः
    । दाक्षायणीवचस्तुष्टो दूर्वासोदृष्टिगोचरः ॥ ॥ अम्बरीषव्रतप्रीतो महाकृत्तिविभञ्जनः । महाभिचारकध्वंसी
    कालसर्पभयान्तकः ॥ ॥ सुदर्शनः कालमेघश्यामः श्रीमन्त्रभावितः । हेमाम्बुजसरःस्नायी श्रीमनोभाविताकृतिः
    ॥ ॥ श्रीप्रदत्ताम्बुजस्रग्वी श्रीकेलिः श्रीनिधिर्भवः । श्रीप्रदो वामनो लक्ष्मीनायकश्च चतुर्भुजः ॥
    ॥ सन्तृप्तस्तर्पितस्तीर्थस्नातृसौख्यप्रदर्शकः । अगस्त्यस्तुतिसंहृष्टो दर्शिताव्यक्तभावनः ॥ ॥ कपिलार्चिः
    कपिलवान् सुस्नाताघविपाटनः । वृषाकपिः कपिस्वामिमनोऽन्तःस्थितविग्रहः ॥ ॥ वह्निप्रियोऽर्थसम्भाव्यो जनलोकविधायकः
    । वह्निप्रभो वह्नितेजाः शुभाभीष्टप्रदो यमी ॥ ॥ वारुणक्षेत्रनिलयो वरुणो वारणार्चितः । वायुस्थानकृतावासो
    वायुगो वायुसम्भृतः ॥ ॥ यमान्तकोऽभिजननो यमलोकनिवारणः । यमिनामग्रगण्यश्च संयमी यमभावितः ॥ ॥ इन्द्रोद्यानसमीपस्थः
    इन्द्रदृग्विषयः प्रभुः । यक्षराट् सरसीवासो ह्यक्षय्यनिधिकोशकृत् ॥ ॥ स्वामितीर्थकृतावासः स्वामिध्येयो
    ह्यधोक्षजः । वराहाद्यष्टतीर्थाभिसेविताङ्घ्रिसरोरुहः ॥ ॥ पाण्डुतीर्थाभिषिक्ताङ्गो युधिष्ठिरवरप्रदः
    । भीमान्तःकरणारूढः श्वेतवाहनसख्यवान् ॥ ॥ नकुलाभयदो माद्रीसहदेवाभिवन्दितः । कृष्णाशपथसन्धाता कुन्तीस्तुतिरतो
    दमी ॥ ॥ नारदादिमुनिस्तुत्यो नित्यकर्मपरायणः । दर्शिताव्यक्तरूपश्च वीणानादप्रमोदितः ॥ ॥ षट्कोटितीर्थचर्यावान्
    देवतीर्थकृताश्रमः । बिल्वामलजलस्नायी सरस्वत्यम्बुसेवितः ॥ ॥ तुम्बुरूदकसंस्पर्शजनचित्ततमोऽपहः । मत्स्यवामनकूर्मादितीर्थराजः
    पुराणभृत् ॥ ॥ चक्रध्येयपदाम्भोजः शङ्खपूजितपादुकः । रामतीर्थविहारी च बलभद्रप्रतिष्ठितः ॥ ॥ जामदग्न्यसरस्तीर्थजलसेचनतर्पितः
    । पापापहारिकीलालसुस्नाताघविनाशनः ॥ ॥ नभोगङ्गाभिषिक्तश्च नागतीर्थाभिषेकवान् । कुमारधारातीर्थस्थो वटुवेषः
    सुमेखलः ॥ ॥ वृद्धस्य सुकुमारत्वप्रदः सौन्दर्यवान् सुखी । प्रियंवदो महाकुक्षिरिक्ष्वाकुकुलनन्दनः ॥
    ॥ नीलगोक्षीरधाराभूर्वराहाचलनायकः । भरद्वाजप्रतिष्ठावान् बृहस्पतिविभावितः ॥ ॥ अञ्जनाकृतपूजावान् आञ्जनेयकरार्चितः
    । अञ्जनाद्रिनिवासश्च मुञ्जकेशः पुरन्दरः ॥ ॥ किन्नरद्वयसम्बन्धिबन्धमोक्षप्रदायकः । वैखानसमखारम्भो वृषज्ञेयो
    वृषाचलः ॥ ॥ वृषकायप्रभेत्ता च क्रीडनाचारसम्भ्रमः । सौवर्चलेयविन्यस्तराज्यो नारायणः प्रियः ॥ ॥ दुर्मेधोभञ्जकः
    प्राज्ञो ब्रह्मोत्सवमहोत्सुकः । भद्रासुरशिरश्छेत्ता भद्रक्षेत्री सुभद्रवान् ॥ ॥ मृगयाऽक्षीणसन्नाहः
    शङ्खराजन्यतुष्टिदः । स्थाणुस्थो वैनतेयाङ्गभावितो ह्यशरीरवान् ॥ ॥ भोगीन्द्रभोगसंस्थानो ब्रह्मादिगणसेवितः
    । सहस्रार्कच्छटाभास्वद्विमानान्तःस्थितो गुणी ॥ ॥ विष्वक्सेनकृतस्तोत्रः सनन्दनवरीवृतः । जाह्नव्यादिनदीसेव्यः
    सुरेशाद्यभिवन्दितः ॥ ॥ सुराङ्गनानृत्यपरो गन्धर्वोद्गायनप्रियः । राकेन्दुसङ्काशनखः कोमलाङ्घ्रिसरोरुहः
    ॥ ॥ कच्छपप्रपदः कुन्दगुल्फकः स्वच्छकूर्परः । मेदुरस्वर्णवस्त्राढ्यकटिदेशस्थमेखलः ॥ ॥ प्रोल्लसच्छुरिकाभास्वत्कटिदेशः
    शुभङ्करः । अनन्तपद्मजस्थाननाभिर्मौक्तिकमालिकः ॥ ॥ मन्दारचाम्पेयमाली रत्नाभरणसम्भृतः । लम्बयज्ञोपवीती
    च चन्द्रश्रीखण्डलेपवान् ॥ ॥ वरदोऽभयदश्चक्री शङ्खी कौस्तुभदीप्तिमान् । श्रीवत्साङ्कितवक्षस्को लक्ष्मीसंश्रितहृत्तटः
    ॥ ॥ नीलोत्पलनिभाकारः शोणाम्भोजसमाननः । कोटिमन्मथलावण्यश्चन्द्रिकास्मितपूरितः ॥ ॥ सुधास्वच्छोर्ध्वपुण्ड्रश्च
    कस्तूरीतिलकाञ्चितः । पुण्डरीकेक्षणः स्वच्छो मौलिशोभाविराजितः ॥ ॥ पद्मस्थः पद्मनाभश्च सोममण्डलगो बुधः
    । वह्निमण्डलगः सूर्यः सूर्यमण्डलसंस्थितः ॥ ॥ श्रीपतिर्भूमिजानिश्च विमलाद्यभिसंवृतः । जगत्कुटुम्बजनिता
    रक्षकः कामितप्रदः ॥ ॥ अवस्थात्रययन्ता च विश्वतेजस्स्वरूपवान् । ज्ञप्तिर्ज्ञेयो ज्ञानगम्यो ज्ञानातीतः
    सुरातिगः ॥ ॥ ब्रह्माण्डान्तर्बहिर्व्याप्तो वेङ्कटाद्रिगदाधरः । वेङ्कटाद्रिगदाधर ॐ नमः इति ॥ एवं श्रीवेङ्कटेशस्य
    कीर्तितं परमाद्भुतम् ॥ ॥ नाम्नां सहस्रं संश्राव्यं पवित्रं पुण्यवर्धनम् । श्रवणात्सर्वदोषघ्नं रोगघ्नं
    मृत्युनाशनम् ॥ ॥ दारिद्र्यभेदनं धर्म्यं सर्वैश्वर्यफलप्रदम् । कालाहिविषविच्छेदि ज्वरापस्मारभञ्जनम्
    ॥ शत्रुक्षयकरं राजग्रहपीडानिवारणम् । ब्रह्मराक्षसकूष्माण्डभेतालभयभञ्जनम् ॥ विद्याभिलाषी विद्यावान्
    धनार्थी धनवान् भवेत् । अनन्तकल्पजीवी स्यादायुष्कामो महायशाः ॥ ॥ पुत्रार्थी सुगुणान्पुत्रान् लभेताऽऽयुष्मतस्ततः
    । सङ्ग्रामे शत्रुविजयी सभायां प्रतिवादिजित् ॥ ॥ दिव्यैर्नामभिरेभिस्तु तुलसीपूजनात्सकृत् । वैकुण्ठवासी
    भगवत्सदृशो विष्णुसन्निधौ ॥ ॥ कल्हारपूजनान्मासात् द्वितीय इव यक्षराट् । नीलोत्पलार्चनात्सर्वराजपूज्यः
    सदा भवेत् ॥ ॥ हृत्संस्थितैर्नामभिस्तु भूयाद्दृग्विषयो हरिः । वाञ्छितार्थं तदा दत्वा वैकुण्ठं च प्रयच्छति
    ॥ ॥ त्रिसन्ध्यं यो जपेन्नित्यं सम्पूज्य विधिना विभुम् । त्रिवारं पञ्चवारं वा प्रत्यहं क्रमशो यमी ॥
    ॥ मासादलक्ष्मीनाशः स्यात् द्विमासात् स्यान्नरेन्द्रता । त्रिमासान्महदैश्वर्यं ततः सम्भाषणं भवेत् ॥
    ॥ मासं पठन्न्यूनकर्मपूर्तिं च समवाप्नुयात् । मार्गभ्रष्टश्च सन्मार्गं गतस्वः स्वं स्वकीयकम् ॥ ॥ चाञ्चल्यचित्तोऽचाञ्चल्यं
    मनस्स्वास्थ्यं च गच्छति । आयुरारोग्यमैश्वर्यं ज्ञानं मोक्षं च विन्दति ॥ ॥ सर्वान्कामानवाप्नोति शाश्वतं
    च पदं तथा । सत्यं सत्यं पुनस्सत्यं सत्यं सत्यं न संशयः ॥ ॥ इति श्री ब्रह्माण्डपुराणे वसिष्ठनारदसंवादे
    श्रीवेङ्कटाचलमाहात्म्ये श्री वेङ्कटेश सहस्रनाम स्तोत्रं समाप्तम् ।
