id: devi-mahatmyam-durga-saptasati-chapter-7
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 7
content:
  english: candamunda vadho nama saptamodhyayah || dhyanam dhyayem ratna pithe shukakala pathitam shrunvatim
    shyamalangim| nyastaikanghrim saroje shashi shakala dharam vallakim vada yantim kahalarabaddha malam
    niyamita vilasaccolikam rakta vastram| matangim shankha patram madhura madhumadam citrakodbhasi bhalam|
    rishiruvaca| ajnaptaste tatodaitya shcandamundapurogamah| caturangabalopeta yayurabhyudyatayudhah||
    || dadrishuste tato devi mishaddhasam vyavasthitam| simhasyopari shailendra || tedrishtvatamsamadatu
    mudyamamncakrurudyatah akrishtacapasidhara statha'nye tatsamipagah|| || tatah kopam cakaroccai rambika
    tanarinprati| kopena casya vadanam mashivarnamabhuttada|| || bhrukutikutilattasya lalataphalakaddrutam|
    kali karala vadana vinishkranta'sipashini || || vicitrakhatvangadhara naramalavibhushana| dvipicarmaparidhana
    shushkamamsa'tibhairava|| || ativistaravadana jihvalalanabhishana| nimagnaraktanayana nadapuritadinmukha
    || || sa vegena'bhipatita ghutayanti mahasuran| sainye tatra surarina || parshnigrahankushagrahi yodhaghantasamanvitan|
    samadayaikahastena mukhe cikshepa varanan || || tathaiva yodham turagai ratham sarathina saha| nikshipya
    vaktre dashanaishcarvayatyatibhairavam || || ekam jagraha kesheshu grivayamatha caparam| padenakramyacaivanyamurasanyamapothayat
    || || tairmuktanica shastrani mahastrani tathasuraih| mukhena jagraha rusha dashanairmathitanyapi
    || || balinam tadbalam sarvamasuranam duratmanam mamardabhakshayaccanyananyamshcatadayattatha || ||
    asina nihatah kecitkecitkhatvangataditah| jagmurvinashamasura dantagrabhihatastatha || || kshanena
    tadbhalam sarva masuranam nipatitam| drishtva cando'bhidudrava tam kalimatibhishanam || || sharavarshairmahabhimairbhimakshim
    tam mahasurah| chadayamasa cakraishca mundah kshiptaih sahasrashah || || tanicakranyanekani vishamanani
    tanmukham| babhuryatharkabimbani subahuni ghanodaram || || tato jahasatirusha bhimam bhairavanadini|
    kali karalavadana durdarshashanojjvala || || utthaya ca mahasimham devi candamadhavata| grihitva casya
    kesheshu shirastenasinacchinat || || atha mundo'bhyadhavattam drishtva candam nipatitam| tamapyapata
    yadbhamau sa khadgabhihatamrusha || || hatashesham tatah sainyam drishtva candam nipatitam| mundanca
    sumahaviryam disho bheje bhayaturam || || shirashcandasya kali ca grihitva munda meva ca| praha pracandattahasamishramabhyetya
    candikam || || maya tava tropahritau candamundau mahapashu| yuddhayajne svayam shumbham nishumbham
    cahanishyasi || || rishiruvaca|| tavanitau tato drishtva canda mundau mahasurau| uvaca kalim kalyani
    lalitam candika vacah || || yasmaccandam ca mundam ca grihitva tvamupagata| camundeti tato lòke khyata
    devi bhavishyasi || || || jaya jaya shri markandeya purane savarnike manvantare devi mahatmye candamunda
    vadho nama saptamodhyaya samaptam || ahuti om klim jayanti sangayai sashaktikayai saparivarayai savahanayai
    kali camunda devyai karpura bijadhishthayai mahahutim samarpayami namah svaha ||
  devanagari: चण्डमुण्ड वधो नाम सप्तमोध्यायः ॥ ध्यानं ध्यायें रत्न पीठे शुककल पठितं श्रुण्वतीं श्यामलाङ्गीं।
    न्यस्तैकाङ्घ्रिं सरोजे शशि शकल धरां वल्लकीं वाद यन्तीं कहलाराबद्ध मालां नियमित विलसच्चोलिकां रक्त
    वस्त्रां। मातङ्गीं शङ्ख पात्रां मधुर मधुमदां चित्रकोद्भासि भालां। ऋषिरुवाच। आज्ञप्तास्ते ततोदैत्या
    श्चण्डमुण्डपुरोगमाः। चतुरङ्गबलोपेता ययुरभ्युद्यतायुधाः॥ ॥ ददृशुस्ते ततो देवी मीषद्धासां व्यवस्थिताम्।
    सिंहस्योपरि शैलेन्द्र ॥ तेदृष्ट्वातांसमादातु मुद्यमंञ्चक्रुरुद्यताः आकृष्टचापासिधरा स्तथाऽन्ये तत्समीपगाः॥
    ॥ ततः कोपं चकारोच्चै रम्बिका तानरीन्प्रति। कोपेन चास्या वदनं मषीवर्णमभूत्तदा॥ ॥ भ्रुकुटीकुटिलात्तस्या
    ललाटफलकाद्द्रुतम्। काली कराल वदना विनिष्क्रान्ताऽसिपाशिनी ॥ ॥ विचित्रखट्वाङ्गधरा नरमालाविभूषणा। द्वीपिचर्मपरीधाना
    शुष्कमांसाऽतिभैरवा॥ ॥ अतिविस्तारवदना जिह्वाललनभीषणा। निमग्नारक्तनयना नादापूरितदिङ्मुखा ॥ ॥ सा वेगेनाऽभिपतिता
    घूतयन्ती महासुरान्। सैन्ये तत्र सुरारीणा ॥ पार्ष्णिग्राहाङ्कुशग्राहि योधघण्टासमन्वितान्। समादायैकहस्तेन
    मुखे चिक्षेप वारणान् ॥ ॥ तथैव योधं तुरगै रथं सारथिना सह। निक्षिप्य वक्त्रे दशनैश्चर्वयत्यतिभैरवं ॥
    ॥ एकं जग्राह केशेषु ग्रीवायामथ चापरं। पादेनाक्रम्यचैवान्यमुरसान्यमपोथयत् ॥ ॥ तैर्मुक्तानिच शस्त्राणि
    महास्त्राणि तथासुरैः। मुखेन जग्राह रुषा दशनैर्मथितान्यपि ॥ ॥ बलिनां तद्बलं सर्वमसुराणां दुरात्मनां
    ममर्दाभक्षयच्चान्यानन्यांश्चाताडयत्तथा ॥ ॥ असिना निहताः केचित्केचित्खट्वाङ्गताडिताः। जग्मुर्विनाशमसुरा
    दन्ताग्राभिहतास्तथा ॥ ॥ क्षणेन तद्भलं सर्व मसुराणां निपातितं। दृष्ट्वा चण्डोऽभिदुद्राव तां कालीमतिभीषणां
    ॥ ॥ शरवर्षैर्महाभीमैर्भीमाक्षीं तां महासुरः। छादयामास चक्रैश्च मुण्डः क्षिप्तैः सहस्रशः ॥ ॥ तानिचक्राण्यनेकानि
    विशमानानि तन्मुखम्। बभुर्यथार्कबिम्बानि सुबहूनि घनोदरं ॥ ॥ ततो जहासातिरुषा भीमं भैरवनादिनी। काली करालवदना
    दुर्दर्शशनोज्ज्वला ॥ ॥ उत्थाय च महासिंहं देवी चण्डमधावत। गृहीत्वा चास्य केशेषु शिरस्तेनासिनाच्छिनत्
    ॥ ॥ अथ मुण्डोऽभ्यधावत्तां दृष्ट्वा चण्डं निपातितम्। तमप्यपात यद्भमौ सा खड्गाभिहतंरुषा ॥ ॥ हतशेषं ततः
    सैन्यं दृष्ट्वा चण्डं निपातितम्। मुण्डञ्च सुमहावीर्यं दिशो भेजे भयातुरम् ॥ ॥ शिरश्चण्डस्य काली च गृहीत्वा
    मुण्ड मेव च। प्राह प्रचण्डाट्टहासमिश्रमभ्येत्य चण्डिकाम् ॥ ॥ मया तवा त्रोपहृतौ चण्डमुण्डौ महापशू।
    युद्धयज्ञे स्वयं शुम्भं निशुम्भं चहनिष्यसि ॥ ॥ ऋषिरुवाच॥ तावानीतौ ततो दृष्ट्वा चण्ड मुण्डौ महासुरौ।
    उवाच कालीं कल्याणी ललितं चण्डिका वचः ॥ ॥ यस्माच्चण्डं च मुण्डं च गृहीत्वा त्वमुपागता। चामुण्डेति ततो
    लॊके ख्याता देवी भविष्यसि ॥ ॥ ॥ जय जय श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये चण्डमुण्ड
    वधो नाम सप्तमोध्याय समाप्तम् ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै काली चामुण्डा
    देव्यै कर्पूर बीजाधिष्ठायै महाहुतिं समर्पयामि नमः स्वाहा ॥
