id: gayatryashtakam-gayatri-ashtakam
category: stotram
name:
  english: Gayatryashtakam (Gayatri Ashtakam)
content:
  english: vishvamitratapahphalam priyataram vipralisamsevitam nityanityavivekadam smitamukhim khandendubhushojjvalam
    | tambularunabhasamanavadanam martandamadhyasthitam gayatrim harivallabham trinayanam dhyayami pancananam
    || || jatipankajaketakikuvalayaih sampujitanghridvayam tattvarthatmikavarnapanktisahitam tattvarthabuddhipradam
    | pranayamaparayanairbudhajanaih samsevyamanam shivam gayatrim harivallabham trinayanam dhyayami pancananam
    || || manjiradhvanibhih samastajagatam manjutvasamvardhanim vipraprenkhitavarivaritamaharakshoganam
    mrinmayim | japtuh papaharam japasumanibham hamsena samshobhitam gayatrim harivallabham trinayanam
    dhyayami pancananam || || kancicelavibhushitam shivamayim malardhamaladika nbibhranam parameshvarim
    sharanadam mohandhabuddhicchidam | bhuraditripuram trilokajananimadhyatmashakhanutam gayatrim harivallabham
    trinayanam dhyayami pancananam || || dhyaturgarbhakrishanutapaharanam samatmikam samagam sayankalasusevitam
    svaramayim durvadalashyamalam | maturdasyavilocanaikamatimatkhetindrasamrajitam gayatrim harivallabham
    trinayanam dhyayami pancananam || || sandhyaragavicitravastravilasadviprottamaih sevitam taraharasumalikam
    suvilasadratnendukumbhantaram | rakacandramukhim ramapatinutam shankhadibhasvatkaram gayatrim harivallabham
    trinayanam dhyayami pancananam || || venibhushitamalakadhvanikarairbhringaih sada shobhitam tattvajnanarasayanajnarasanasaudhabhramadbhramarim
    | nasalankritamauktikendukiranaih sayantamashchedinim gayatrim harivallabham trinayanam dhyayami pancananam
    || || padabjantararenukunkumalasatphaladyuramavritam rambhanatyavilokanaikarasikam vedantabuddhipradam
    | vinavenumridangakahalaravan devaih kritanchrinvatim gayatrim harivallabham trinayanam dhyayami pancananam
    || || hatyapanasuvarnataskaramahagurvanganasangama ndoshanchailasaman purandarasamah sancchidya suryopamah
    | gayatrim shrutimaturekamanasa sandhyasu ye bhusura japtva yanti param gatim manumimam devyah param
    vaidikah || || iti shrimacchankaracarya viracitam shri gayatryashtakam |
  devanagari: विश्वामित्रतपःफलां प्रियतरां विप्रालिसंसेवितां नित्यानित्यविवेकदां स्मितमुखीं खण्डेन्दुभूषोज्ज्वलाम्
    । ताम्बूलारुणभासमानवदनां मार्ताण्डमध्यस्थितां गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥
    ॥ जातीपङ्कजकेतकीकुवलयैः सम्पूजिताङ्घ्रिद्वयां तत्त्वार्थात्मिकवर्णपङ्क्तिसहितां तत्त्वार्थबुद्धिप्रदाम्
    । प्राणायामपरायणैर्बुधजनैः संसेव्यमानां शिवां गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥
    ॥ मञ्जीरध्वनिभिः समस्तजगतां मञ्जुत्वसंवर्धनीं विप्रप्रेङ्खितवारिवारितमहारक्षोगणां मृण्मयीम् । जप्तुः
    पापहरां जपासुमनिभां हंसेन संशोभितां गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥ ॥ काञ्चीचेलविभूषितां
    शिवमयीं मालार्धमालादिका न्बिभ्राणां परमेश्वरीं शरणदां मोहान्धबुद्धिच्छिदाम् । भूरादित्रिपुरां त्रिलोकजननीमध्यात्मशाखानुतां
    गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥ ॥ ध्यातुर्गर्भकृशानुतापहरणां सामात्मिकां सामगां
    सायङ्कालसुसेवितां स्वरमयीं दूर्वादलश्यामलाम् । मातुर्दास्यविलोचनैकमतिमत्खेटीन्द्रसंराजितां गायत्रीं
    हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥ ॥ सन्ध्यारागविचित्रवस्त्रविलसद्विप्रोत्तमैः सेवितां ताराहारसुमालिकां
    सुविलसद्रत्नेन्दुकुम्भान्तराम् । राकाचन्द्रमुखीं रमापतिनुतां शङ्खादिभास्वत्करां गायत्रीं हरिवल्लभां
    त्रिणयनां ध्यायामि पञ्चाननाम् ॥ ॥ वेणीभूषितमालकध्वनिकरैर्भृङ्गैः सदा शोभितां तत्त्वज्ञानरसायनज्ञरसनासौधभ्रमद्भ्रामरीम्
    । नासालङ्कृतमौक्तिकेन्दुकिरणैः सायन्तमश्छेदिनीं गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम्
    ॥ ॥ पादाब्जान्तररेणुकुङ्कुमलसत्फालद्युरामावृतां रम्भानाट्यविलोकनैकरसिकां वेदान्तबुद्धिप्रदाम् । वीणावेणुमृदङ्गकाहलरवान्
    देवैः कृताञ्छृण्वतीं गायत्रीं हरिवल्लभां त्रिणयनां ध्यायामि पञ्चाननाम् ॥ ॥ हत्यापानसुवर्णतस्करमहागुर्वङ्गनासङ्गमा
    न्दोषाञ्छैलसमान् पुरन्दरसमाः सञ्च्छिद्य सूर्योपमाः । गायत्रीं श्रुतिमातुरेकमनसा सन्ध्यासु ये भूसुरा
    जप्त्वा यान्ति परां गतिं मनुमिमं देव्याः परं वैदिकाः ॥ ॥ इति श्रीमच्छङ्कराचार्य विरचितं श्री गायत्र्यष्टकम्
    ।
