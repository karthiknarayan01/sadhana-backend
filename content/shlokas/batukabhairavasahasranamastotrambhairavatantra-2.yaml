id: batukabhairavasahasranamastotrambhairavatantra-2
category: sahasranama
name:
  english: batukabhairavasahasranamastotrambhairavatantra
  devanagari: बटुकभैरवसहस्रनामस्तोत्रंभैरवतन्त्र
content:
  english: '|| 58|| satishah sarasinathah satirajah satishvarah | satipranah satinathah satisevyah satiratih
    || 59|| siddharajah satitushtah sacivah savyavahanah | satinayakasantushtah savyasaci sumantakah ||
    60|| saccittah sarvasantoshi sarvaradhana siddhidah | sarvaradhyah sacivakhyah sacipatisusevitah ||
    61|| sagarah sagarah sarthah samudrah samudrapriyah | samudratirasantushtah samudrapriyadarshanah
    || 62|| samudreshah saronathah sarasijavilocanah | sarasijaladakarah sarasijaladarcitah || 63|| samudrakah
    samudratmah sadhyamanah sureshvarah | surasevyah sureshanah suranathah surarcitah || 64|| suradhyakshah
    suraradhyah suravandyavisharadah | suramukhyah suraprayah surasindhunivasavan || 65|| sudhapriyah
    sudhadhishah sudharadhyah sudhapatih | sudhanathah sudhabhutah sudhasagarasevitah || 66|| hatako hirako
    hanta hirako ruciraprabhah | havyavaho haridrabho haridrarasadarshanah || 67|| hetirheturharitrata
    harinatho haripriyah | haripujyo hariprano harahrishto haridrakah || 68|| harisho hantriko hiro harinamaparayanah
    | harimugdho hariramyo haridaso harishvarah || 69|| haro harapatirharo harinicittaharakah | harahito
    haraprano harivahanashobhanah || 70|| haso hasapriyo huhurhutabhug hutavahanah | hutashano hali hakko
    halahalahalayudhah || 71|| halakaro halishano halipujyo halipriyah | haraputro harotsaho harasunurharatmajah
    || 72|| haravandyo haradhisho haratanko harakritih | haramanyo harankastho haravairivinashanah ||
    73|| harashatrurharamarsho''hankaro harinipriyah | hatakesho haheshano hatakapriyadarshanah || 74||
    hatako hatakaprano hatbhushanabhushitah | hetido hamsako hamso hamsagatirharahvayah || 75|| hamsipatirharonmatto
    hamsisho haravallabhah | harapushpaprabho hamsipriyo hamsavilasakah || 76|| harabijarato hari harito
    haritampatih | haritprabhurharitpalo haridantaranayakah || 77|| haridisho haritprano harapriyah priyo
    hitah | herambo hunkriti kruddho herambanandano hathi || 78|| herambapranasamharta herambahridayapriyah
    | kshamapatih kshanah kshantah kshuradharah kshitishvarah || 79|| kshitishah kshititah kshinah kshitipalah
    kshitiprabhuh | kshitishanah kshitipranah kshitinayakasatpriyah || 80|| kshitirajah kshanadadhishah
    kshanapatih kshaneshvarah | kshanapriyah kshamanathah kshanadanayakapriyah || 81|| kshanikah kshanadadhishah
    kshanadapranadah kshami | kshamah kshonipatih kshobhah kshobhakari'
  devanagari: ॥ ५८॥ सतीशः सरसीनाथः सतीराजः सतीश्वरः । सतीप्राणः सतीनाथः सतीसेव्यः सतीरतिः ॥ ५९॥ सिद्धराजः
    सतीतुष्टः सचिवः सव्यवाहनः । सतीनायकसन्तुष्टः सव्यसाची सुमन्तकः ॥ ६०॥ सच्चित्तः सर्वसन्तोषी सर्वाराधन
    सिद्धिदः । सर्वाराध्यः सचिवाख्यः सचीपतिसुसेवितः ॥ ६१॥ सगरः सागरः सार्थः समुद्रः समुद्रप्रियः । समुद्रतीरसन्तुष्टः
    समुद्रप्रियदर्शनः ॥ ६२॥ समुद्रेशः सरोनाथः सरसीजविलोचनः । सरसीजलदाकारः सरसीजलदार्चितः ॥ ६३॥ समुद्रकः
    समुद्रात्माः साध्यमानः सुरेश्वरः । सुरसेव्यः सुरेशानः सुरनाथः सुरार्चितः ॥ ६४॥ सुराध्यक्षः सुराराध्यः
    सुरवन्द्यविशारदः । सुरमुख्यः सुरप्रायः सुरसिन्धुनिवासवान् ॥ ६५॥ सुधाप्रियः सुधाधीशः सुधाराध्यः सुधापतिः
    । सुधानाथः सुधाभूतः सुधासागरसेवितः ॥ ६६॥ हाटको हीरको हन्ता हीरको रुचिरप्रभः । हव्यवाहो हरिद्राभो हरिद्रारसदर्शनः
    ॥ ६७॥ हेतिर्हेतुर्हरित्राता हरिनाथो हरिप्रियः । हरिपूज्यो हरिप्राणो हरहृष्टो हरिद्रकः ॥ ६८॥ हरीशो
    हन्तृको हीरो हरिनामपरायणः । हरिमुग्धो हरिरम्यो हरिदासो हरीश्वरः ॥ ६९॥ हरो हरपतिर्हारो हरिणीचित्तहारकः
    । हरहीतो हरप्राणो हरिवाहनशोभनः ॥ ७०॥ हासो हासप्रियो हूहूर्हुतभुग् हुतवाहनः । हुताशनो हली हक्को हलाहलहलायुधः
    ॥ ७१॥ हलाकारो हलीशानो हलिपूज्यो हलिप्रियः । हरपुत्रो हरोत्साहो हरसूनुर्हरात्मजः ॥ ७२॥ हरवन्द्यो हराधीशो
    हरातङ्को हराकृतिः । हरमान्यो हराङ्कस्थो हरवैरिविनाशनः ॥ ७३॥ हरशत्रुर्हरामर्षोऽहङ्कारो हरिणीप्रियः
    । हाटकेशो हहेशानो हाटकप्रियदर्शनः ॥ ७४॥ हाटको हाटकप्राणो हाट्भूषणभूषितः । हेतिदो हंसको हंसो हंसगतिर्हराह्वयः
    ॥ ७५॥ हंसीपतिर्हरोन्मत्तो हंसीशो हरवल्लभः । हरपुष्पप्रभो हंसीप्रियो हंसविलासकः ॥ ७६॥ हरबीजरतो हारी
    हरितो हरिताम्पतिः । हरित्प्रभुर्हरित्पालो हरिदन्तरनायकः ॥ ७७॥ हरिदीशो हरित्प्राणो हरप्रियः प्रियो
    हितः । हेरम्बो हुङ्कृति क्रुद्धो हेरम्बानन्दनो हठी ॥ ७८॥ हेरम्बप्राणसंहर्ता हेरम्बहृदयप्रियः । क्षमापतिः
    क्षणः क्षान्तः क्षुरधारः क्षितीश्वरः ॥ ७९॥ क्षितीशः क्षितितः क्षीणः क्षितिपालः क्षितिप्रभुः । क्षितीशानः
    क्षितिप्राणः क्षितिनायकसत्प्रियः ॥ ८०॥ क्षितिराजः क्षणादाधीशः क्षणपतिः क्षणेश्वरः । क्षणप्रियः क्षमानाथः
    क्षणदानायकप्रियः ॥ ८१॥ क्षणिकः क्षणदाधीशः क्षणदाप्राणदः क्षमी । क्षमः क्षोणिपतिः क्षोभः क्षोभकारी
