id: ush-itran-nev
category: sahasranama
name:
  english: ush itran nev
  devanagari: ऊष् इत्रन् नेव्
content:
  english: samhatatvat pararthyamanekatvam nashitatvam ca na kenacidupapattya varayitum shakyam | asvarthasya
    svatahsiddhyabhavadityavocama | caitanyasvarupasya tvatmanah svatahsiddheranyanapekshatvam na kenacid
    varayitum shakyamavyabhicarat || 91|| nanu vyabhicaro darshito maya sushupte na pashyamiti || 92||
    na | vyahatatvat | katham vyaghatah | pashyatastava na pashyamiti vyahatam vacanam | na hi kadacid
    bhagavan sushupte maya caitanyamanyad va kimcid drishtam | pashyamstarhi sushupte tvam | yasmad drishtameva
    pratishedhasi na drishtim | ya tava drishtistac caitanyamiti mayoktam | yaya tvam vidyamanaya na kimcid
    drishtamiti pratishedhasi sa drishtistac caitanyam | tarhi sarvatravyabhicarat kutasthanityatvam siddham
    svata eva na pramanapeksham | svatahsiddhasya hi pramaturanyasya prameyasya paricchittim prati pramanapeksha
    | ya tvanya nitya paricchedaya sa hi nityaiva kutastha svayamjyotihsvabhava | atmani pramanatve pramatritve
    va na tam prati pramanapeksha tatsvabhavatvat | yatha prakashanamushnatvam va lohodakadishu parato'pekshyate'gnyadityadibhyah
    atatsvabhavatvat nagnyadityadinam tadapeksha sarvada tatsvabhavatvat || 93|| anityatva eva prama syan
    na nityatva iti cet || 94|| na | avagaternityatvanityatvayorvisheshanupapatteh | na hyavagateh pramatve'nityavagatih
    prama na nityeti vishesho'vagamyate || 95|| niyayam pramaturapekshabhavah | anityayam tu yatnantaritatvadavagatirapekshyata
    iti visheshah syaditi cet || 96|| siddha tarhyatmanah pramatuh svatahsiddhih pramananirapekshatayaiveti
    || 97|| abhave'pyapekshabhavah nityatvaditi cet | na | avagaterevatmani evatmani sadbhavaditi parihritametat
    || 98|| pramatushcet pramanapekshasiddhih kasya pramitsa syat | yasya pramitsa sa eva pramatabhyupagamyate
    | tadiya ca pramitsa prameyavishayaiva na pramatrivishaya | pramatrivishayatve'navasthaprasangat pramatustadicchayashca
    tasyapyanyah pramata tasyapyanya iti | evamevecchayah pramatrivishayatve | pramaturatmano'vyavahitatvac
    ca prameyatvanupapattih | loke hi prameyam nama pramaturicchasmritiprayatnapramanajanmavyavahitam
    siddhyati nanyathavagatih prameyavishaya drishta | na ca pramatuh pramata svasya svayameva kenacid
    vyavahitah kalpayitum shakya icchadinamanyatamenapi | smritishca smartavyavishaya na smartrivishaya
    | tathecchaya ishtavishayatvameva necchavadvishayatvam | smartricchavadvishayatve'pi hyubhayoranavastha
    purvavadapriharya syat || 99|| nanu pramatrivishayavagatyanutpattavanavagata eva pramata syaditi cet
    || 100|| na avaganturavagateravagantavyavishayatvat | avagantrivishayatve canavastha purvavat syat
    | avagatishcatmani kutasthanityatmajyotiranyato'napekshaiva siddha agnyadityadyushnaprakashavaditi
    purvameva prasadhitam | avagateshcaitanyatmajyotishah svatmanyanityatva atmanah svarthatanupapattih
    karyakarana
  devanagari: संहतत्वात् पारार्थ्यमनेकत्वं नाशितत्वं च न केनचिदुपपत्त्या वारयितुं शक्यम् । अस्वार्थस्य
    स्वतःसिद्ध्यभावादित्यवोचाम । चैतन्यस्वरूपस्य त्वात्मनः स्वतःसिद्धेरन्यानपेक्षत्वं न केनचिद् वारयितुं
    शक्यमव्यभिचारात् ॥ ९१॥ ननु व्यभिचारो दर्शितो मया सुषुप्ते न पश्यामीति ॥ ९२॥ न । व्याहतत्वात् । कथं
    व्याघातः । पश्यतस्तव न पश्यामीति व्याहतं वचनम् । न हि कदाचिद् भगवन् सुषुप्ते मया चैतन्यमन्यद् वा किंचिद्
    दृष्टम् । पश्यंस्तर्हि सुषुप्ते त्वम् । यस्माद् दृष्टमेव प्रतिषेधसि न दृष्टिम् । या तव दृष्टिस्तच्
    चैतन्यमिति मयोक्तम् । यया त्वं विद्यमानया न किंचिद् दृष्टमिति प्रतिषेधसि सा दृष्टिस्तच् चैतन्यम् ।
    तर्हि सर्वत्राव्यभिचारात् कूटस्थनित्यत्वं सिद्धं स्वत एव न प्रमाणापेक्षम् । स्वतःसिद्धस्य हि प्रमातुरन्यस्य
    प्रमेयस्य परिच्छित्तिं प्रति प्रमाणापेक्षा । या त्वन्या नित्या परिच्छेदाय सा हि नित्यैव कूटस्था स्वयंज्योतिःस्वभावा
    । आत्मनि प्रमाणत्वे प्रमातृत्वे वा न तां प्रति प्रमाणापेक्षा तत्स्वभावत्वात् । यथा प्रकाशनमुष्णत्वं
    वा लोहोदकादिषु परतोऽपेक्ष्यतेऽग्न्यादित्यादिभ्यः अतत्स्वभावत्वात् नाग्न्यादित्यादीनां तदपेक्षा सर्वदा
    तत्स्वभावत्वात् ॥ ९३॥ अनित्यत्व एव प्रमा स्यान् न नित्यत्व इति चेत् ॥ ९४॥ न । अवगतेर्नित्यत्वानित्यत्वयोर्विशेषानुपपत्तेः
    । न ह्यवगतेः प्रमात्वेऽनित्यावगतिः प्रमा न नित्येति विशेषोऽवगम्यते ॥ ९५॥ नियायां प्रमातुरपेक्षाभावः
    । अनित्यायां तु यत्नान्तरितत्वादवगतिरपेक्ष्यत इति विशेषः स्यादिति चेत् ॥ ९६॥ सिद्धा तर्ह्यात्मनः प्रमातुः
    स्वतःसिद्धिः प्रमाणनिरपेक्षतयैवेति ॥ ९७॥ अभावेऽप्यपेक्षाभावः नित्यत्वादिति चेत् । न । अवगतेरेवात्मनि
    एवात्मनि सद्भावादिति परिहृतमेतत् ॥ ९८॥ प्रमातुश्चेत् प्रमाणापेक्षासिद्धिः कस्य प्रमित्सा स्यात् ।
    यस्य प्रमित्सा स एव प्रमाताभ्युपगम्यते । तदीया च प्रमित्सा प्रमेयविषयैव न प्रमातृविषया । प्रमातृविषयत्वेऽनवस्थाप्रसङ्गात्
    प्रमातुस्तदिच्छायाश्च तस्याप्यन्यः प्रमाता तस्याप्यन्य इति । एवमेवेच्छायाः प्रमातृविषयत्वे । प्रमातुरात्मनोऽव्यवहितत्वाच्
    च प्रमेयत्वानुपपत्तिः । लोके हि प्रमेयं नाम प्रमातुरिच्छास्मृतिप्रयत्नप्रमाणजन्मव्यवहितं सिद्ध्यति
    नान्यथावगतिः प्रमेयविषया दृष्टा । न च प्रमातुः प्रमाता स्वस्य स्वयमेव केनचिद् व्यवहितः कल्पयितुं शक्य
    इच्छादीनामन्यतमेनापि । स्मृतिश्च स्मर्तव्यविषया न स्मर्तृविषया । तथेच्छाया इष्टविषयत्वमेव नेच्छावद्विषयत्वम्
    । स्मर्त्रिच्छावद्विषयत्वेऽपि ह्युभयोरनवस्था पूर्ववदप्रिहार्या स्यात् ॥ ९९॥ ननु प्रमातृविषयावगत्यनुत्पत्तावनवगत
    एव प्रमाता स्यादिति चेत् ॥ १००॥ न अवगन्तुरवगतेरवगन्तव्यविषयत्वात् । अवगन्तृविषयत्वे चानवस्था पूर्ववत्
    स्यात् । अवगतिश्चात्मनि कूटस्थनित्यात्मज्योतिरन्यतोऽनपेक्षैव सिद्धा अग्न्यादित्याद्युष्णप्रकाशवदिति
    पूर्वमेव प्रसाधितम् । अवगतेश्चैतन्यात्मज्योतिषः स्वात्मन्यनित्यत्व आत्मनः स्वार्थतानुपपत्तिः कार्यकरण
