id: lakshmisukta
category: sukta
name:
  english: lakshmisukta
  devanagari: लक्ष्मीसूक्त
content:
  english: shrilakshmisukta shri ganeshaya namah | om padmanane padmini padmapatre padmapriye padmadalayatakshi
    | vishvapriye vishvamano'nukule tvatpadapadmam mayi sannidhatsva || padmanane padmauru padmashri padmasambhave
    | tanme bhajasim padmakshi yena saukhyam labhamyaham || ashvadayai godayai dhanadayai mahadhane |
    dhanam me jushatam devi sarvakamamshca dehi me || putrapautram dhanam dhanyam hastyashvadigaveratham
    | prajanam bhavasi mata ayushmantam karotu me || dhanamagnirdhanam vayurdhanam suryodhanam vasuh |
    dhanamindro brihaspatirvaruno dhanamastu me || vainateya somam piba somam pibatu vritraha | somam
    dhanasya somino mahyam dadatu sominah || na krodho na ca matsaryam na lobho nashubha matih | bhavanti
    kritapunyanam bhaktanam shrisuktam japinam || sarasijanilaye sarojahaste dhavalataramshuka gandhamalyashobhe
    | bhagavati harivallabhe manojne tribhuvanabhutikari prasida mahyam || shrirvarcasvamayushyamarogyamavidhacchobhamanam
    mahiyate | dhanya dhanam pashum bahuputralabham shatasamvatsaram dirghamayuh || om mahadevyai ca vidmahe
    vishnupatnyai ca dhimahi | tanno lakshmih pracodayat || om mahalakshmyai ca vidmahe mahashriyai ca
    dhimahi | tannah shrih pracodayat || vishnupatnim kshamam devim madhavim madhavapriyam | lakshmim
    priyasakhim devim namamyacyutavallabham || candraprabham lakshmimaishanim suryabhamlakshmimaishvarim
    | candra suryagnisankasham shriyam devimupasmahe || || iti shrilakshmi suktam sampurnam ||
  devanagari: श्रीलक्ष्मीसूक्त श्री गणेशाय नमः । ॐ पद्मानने पद्मिनि पद्मपत्रे पद्मप्रिये पद्मदलायताक्षि
    । विश्वप्रिये विश्वमनोऽनुकूले त्वत्पादपद्मं मयि सन्निधत्स्व ॥ पद्मानने पद्मऊरु पद्माश्री पद्मसम्भवे
    । तन्मे भजसिं पद्माक्षि येन सौख्यं लभाम्यहम् ॥ अश्वदायै गोदायै धनदायै महाधने । धनं मे जुषतां देवि
    सर्वकामांश्च देहि मे ॥ पुत्रपौत्रं धनं धान्यं हस्त्यश्वादिगवेरथम् । प्रजानां भवसि माता आयुष्मन्तं
    करोतु मे ॥ धनमग्निर्धनं वायुर्धनं सूर्योधनं वसुः । धनमिन्द्रो बृहस्पतिर्वरुणो धनमस्तु मे ॥ वैनतेय
    सोमं पिब सोमं पिबतु वृत्रहा । सोमं धनस्य सोमिनो मह्यं ददातु सोमिनः ॥ न क्रोधो न च मात्सर्यं न लोभो
    नाशुभा मतिः । भवन्ति कृतपुण्यानां भक्तानां श्रीसूक्तं जापिनाम् ॥ सरसिजनिलये सरोजहस्ते धवलतरांशुक गन्धमाल्यशोभे
    । भगवति हरिवल्लभे मनोज्ञे त्रिभुवनभूतिकरि प्रसीद मह्यम् ॥ श्रीर्वर्चस्वमायुष्यमारोग्यमाविधाच्छोभमानं
    महीयते । धान्य धनं पशुं बहुपुत्रलाभं शतसंवत्सरं दीर्घमायुः ॥ ॐ महादेव्यै च विद्महे विष्णुपत्न्यै च
    धीमहि । तन्नो लक्ष्मीः प्रचोदयात् ॥ ॐ महालक्ष्म्यै च विद्महे महश्रियै च धीमहि । तन्नः श्रीः प्रचोदयात्
    ॥ विष्णुपत्नीं क्षमां देवीं माधवीं माधवप्रियाम् । लक्ष्मीं प्रियसखीं देवीं नमाम्यच्युतवल्लभाम् ॥ चन्द्रप्रभां
    लक्ष्मीमैशानीं सूर्याभांलक्ष्मीमैश्वरीम् । चन्द्र सूर्याग्निसङ्काशां श्रियं देवीमुपास्महे ॥ ॥ इति
    श्रीलक्ष्मी सूक्तं सम्पूर्णम् ॥
