id: devadibhihkritamkrishnanarayanastotram
category: stotram
name:
  english: devadibhihkritamkrishnanarayanastotram
  devanagari: देवादिभिःकृतंकृष्णनारायणस्तोत्रम्
content:
  english: devadibhih kritam krishnanarayanastotram sarvananda muktayashca yasya'kshikonake sthitah |
    sarve devashca rishaya ishvara yanmanobhavah || 72|| tasmayanadishrikrishnanarayanaya vai namah |
    svamine balarupaya vallabhaya ca te namah || 73|| muktanam pataye dhamnam pataye te namo namah | avataravrindadhartre
    ishvareshaya te namah || 74|| radhalakshmisvamine te jayayah pataye namah | lalitamanikipadmaparvatishaya
    te namah || 75|| prabhavrindatulasishripadmavatisha te namah | manjulakanta hamsesha yogishesha ca
    te namah || 76|| kamalakanta siddhisha te pratyaksha namonamah | namo hridayavasatha sarvantaryamine
    namah || 77|| namah mayurapicchadhyamukutadharine namah | namah kaustubhasamshobhadvakshahsthalaya
    te namah || 78|| namah kundalakarnaya svarnaharaya te namah | sarvashaktisvarupaya kamakamaya te namah
    || 79|| naikasuravinashaya bhaktatranaya te namah | bhaktavancchitadatre te shrikrishnaya namo namah
    || 80|| dhanyeyam kunkumavapi dhanyo'yam lomasho munih | ashvapattasaro dhanyam dhanyam vyaghravanam
    shubham || 81|| dhanya ime ca rishayo dhanya drutrinabhuruhah | dhanyah pakshagama jiva dhanya bhuvasakarinah
    || 82|| dhanya narastatha naryo dhanyam caracaram tvidam | yatra vai balarupastvam vartase purushottamah
    || 83|| drishyase sarvavishayo gamyase jnanibhih khalu | adya nah saphalam janma punyam nah paravarjitam
    || 84|| srishtisancalakairyo na prapyate drishyase'tra nah | anekajanmashuddhanam darshanam te'tra
    yujyate || 85|| asmakam catra sanjatam purusharthacatushtayam | sharanyam yatpadam labdham pratyaksham
    sevanocitam || 86|| ityevam stavanam kritva balavesham pumuttamam | pupujuh paraya bhaktya sha
  devanagari: देवादिभिः कृतं कृष्णनारायणस्तोत्रम् सर्वानन्दा मुक्तयश्च यस्याऽक्षिकोणके स्थिताः । सर्वे
    देवाश्च ऋषय ईश्वरा यन्मनोभवाः ॥ ७२॥ तस्मायनादिश्रीकृष्णनारायणाय वै नमः । स्वामिने बालरूपाय वल्लभाय
    च ते नमः ॥ ७३॥ मुक्तानां पतये धाम्नां पतये ते नमो नमः । अवतारवृन्दधर्त्रे ईश्वरेशाय ते नमः ॥ ७४॥ राधालक्ष्मीस्वामिने
    ते जयायाः पतये नमः । ललितामाणिकीपद्मापार्वतीशाय ते नमः ॥ ७५॥ प्रभावृन्दातुलसीश्रीपद्मावतीश ते नमः
    । मञ्जुलाकान्त हंसेश योगीशेश च ते नमः ॥ ७६॥ कमलाकान्त सिद्धीश ते प्रत्यक्ष नमोनमः । नमो हृदयवासाथ
    सर्वान्तर्यामिणे नमः ॥ ७७॥ नमः मयूरपिच्छाढ्यमुकुटधारिणे नमः । नमः कौस्तुभसंशोभद्वक्षःस्थलाय ते नमः
    ॥ ७८॥ नमः कुण्डलकर्णाय स्वर्णहाराय ते नमः । सर्वशक्तिस्वरूपाय कामकामाय ते नमः ॥ ७९॥ नैकासुरविनाशाय
    भक्तत्राणाय ते नमः । भक्तवाञ्च्छितदात्रे ते श्रीकृष्णाय नमो नमः ॥ ८०॥ धन्येयं कुङ्कुमवापी धन्योऽयं
    लोमशो मुनिः । अश्वपट्टसरो धन्यं धन्यं व्याघ्रवनं शुभम् ॥ ८१॥ धन्या इमे च ऋषयो धन्या द्रुतृणभूरुहाः
    । धन्याः पक्षगमा जीवा धन्या भूवासकारिणः ॥ ८२॥ धन्या नरास्तथा नार्यो धन्यं चराचरं त्विदम् । यत्र वै
    बालरूपस्त्वं वर्तसे पुरुषोत्तमः ॥ ८३॥ दृश्यसे सर्वविषयो गम्यसे ज्ञानिभिः खलु । अद्य नः सफलं जन्म पुण्यं
    नः पारवर्जितम् ॥ ८४॥ सृष्टिसञ्चालकैर्यो न प्राप्यते दृश्यसेऽत्र नः । अनेकजन्मशुद्धानां दर्शनं तेऽत्र
    युज्यते ॥ ८५॥ अस्माकं चात्र सञ्जातं पुरुषार्थचतुष्टयम् । शरण्यं यत्पदं लब्धं प्रत्यक्षं सेवनोचितम्
    ॥ ८६॥ इत्येवं स्तवनं कृत्वा बालवेषं पुमुत्तमम् । पुपूजुः परया भक्त्या श
