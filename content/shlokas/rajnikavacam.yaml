id: rajnikavacam
category: kavacha
name:
  english: rajnikavacam
  devanagari: राज्नीकवचम्
content:
  english: om lakshmirme shirah patu hrim lalatam sarasvati | shrim bala patu me netre trya shram patu
    shruti mama || 1|| ram durga patu me nasam klim mukham patu sharika | sauh kantham vaikhari patu bham
    bhujau patu me shiva || 2|| gam hastau patu me kali vam vakshastripura'vatu | shadashram patu me madhyam
    vrittam parshvau mamavatu || 3|| tyai prishtham patu me brahmi ram nabhim patu vaishnavi | jnyai gudam
    patu rudrani hrim katim me parajita || 4|| svam kaumari patu janu ham janghe'vatu candika | svaha
    gulphau ca varahi om padau narasimhika || 5|| vismaritam ca yatsthanam yatsthanam namavarjitam | tatsarvam
    patu me rajni mulavidyamayi para || 6|| vasukih purvatah patu nilanago'nale'vatu | takshako dakshine
    patu nairrite padmanayakah || 7|| karkotakah pashcime'vyadvayavyam shankhapalakah | kulikashcottare
    patu shesha ishanamandale || 8|| brahmi brahme muhurte'vyaddinadau vaishnavi mama | rudrani patu madhyahne
    sayam patvaparajita || 9|| nishadau patu kaumari nishithe candikavatu | nishante patu varahi sarvada
    narasimhika || 10|| asitangah kshiteh patu payaso rurubhairavah | cando mam pavanatpatu krodheshah
    patu ma'nalat || 11|| unmattah somatah patu bhishanah suryato'vatu | yajakacca kapalesho vyomnah samharako'vatu
    || 12|| sada samantatah patu vapurvasudalam patu mama | guravah pantu sarvatra digishah patu sarvatah
    || 13|| vrittatrayam patu nityam dhara geham sada'vatu | shricakram patu bhitibhyo yoginyah pantu
    sarvada || 14|| urdhvam cadhah sada patu digbhyo rajnishvarah shivah | sarvatra sarvada sarvam vapurbhuteshvaro'vatat
    || 15|| padadimurdhaparyantam vapuh sarvatra me'vatu | shirasah padaparyantam rajni pancadashakshari
    || 16|| ityevam kavacam rajnya mantragarbham jayavaham | trailokyavijayam nama daridryabhayanashanam
    || 17|| sarvarogaharam sakshatsiddidam papanashanam | mahabhayaharam devi mulavidyamayam param ||
    18|| paramarthapradam nityam bhogamokshaikakaranam | yah pathetkavacam devi rane rajabhaye kshanat
    || 19|| sangrameshu ripunjitva vijayi grihameshyati | pathanatkavacasyasya rajakopah prashamyati ||
    20|| dyute dhanam labheddyuti shmashane siddhimapnuyat | trivaram yah pathedratrau retahsrave maheshvari
    || 21|| tasya rajni mahavidya svapne'bhishtaprada bhavet | svayambhukusumaih shuddhai retahstanyobhayankitaih
    || 22|| rasairbhurje likhedvarma ravau pratarmaheshvari | ciratantubhiravyaktam lakshaya veshtitam
    tatha || 23|| suvarnagutikantahstham pujayedyantrarajavat | gutikaisha mahavidya rajnimurtirivapara
    || 24|| mulavidyamayi devi kukshistha bhogadayini | prishthastha balada devi kukshistha roganashini
    || 25|| sarvarthasadhani loke yathabhishtaphalaprada | gutikeyam shubha rajnya na deya yasya kasyacit
    || 26|| idam kavacamishani mulavidyamayam param | sarasvatapradam lakshmiputrapautravivardhanam ||
    27|| ayushkaram pushtikaram shrikaram ca yashaskaram | catuhshashtyaditantranam saramadaya varnitam
    || 28|| shmashane yah pathetsayam mahacinakrameshvarah | sa sadhako mahadevi rajniputro bhavishyati
    || 29|| idam te mama sarvasvam trailokyavijayabhidham | kavacam mantragarbham ca gopaniyam svayonivat
    || 30|| iti shrirudrayamale tantre dashavidyarahasye shrirajnikavacam |
  devanagari: ॐ लक्ष्मीर्मे शिरः पातु ह्रीं ललाटं सरस्वती । श्रीं बाला पातु मे नेत्रे त्र्य श्रं पातु
    श्रुती मम ॥ १॥ रां दुर्गा पातु मे नासां क्लीं मुखं पातु शारिका । सौः कण्ठं वैखरी पातु भं भुजौ पातु
    मे शिवा ॥ २॥ गं हस्तौ पातु मे काली वं वक्षस्त्रिपुराऽवतु । षडश्रं पातु मे मध्यं वृत्तं पार्श्वौ ममावतु
    ॥ ३॥ त्यै पृष्ठं पातु मे ब्राह्मी रां नाभिं पातु वैष्णवी । ज्ञ्यै गुदं पातु रुद्राणी ह्रीं कटिं मे
    पराजिता ॥ ४॥ स्वां कौमारी पातु जानू हां जङ्घेऽवतु चण्डिका । स्वाहा गुल्फौ च वाराही ॐ पादौ नारसिंहिका
    ॥ ५॥ विस्मारितं च यत्स्थानं यत्स्थानं नामवर्जितम् । तत्सर्वं पातु मे राज्ञी मूलविद्यामयी परा ॥ ६॥
    वासुकिः पूर्वतः पातु नीलनागोऽनलेऽवतु । तक्षको दक्षिणे पातु नैरृते पद्मनायकः ॥ ७॥ कार्कोटकः पश्चिमेऽव्याद्वायव्यां
    शङ्खपालकः । कुलिकश्चोत्तरे पातु शेष ईशानमण्डले ॥ ८॥ ब्राह्मी ब्राह्मे मुहूर्तेऽव्याद्दिनादौ वैष्णवी
    मम । रुद्राणी पातु मध्याह्ने सायं पात्वपराजिता ॥ ९॥ निशादौ पातु कौमारी निशीथे चण्डिकावतु । निशान्ते
    पातु वाराही सर्वदा नारसिंहिका ॥ १०॥ असिताङ्गः क्षितेः पातु पयसो रुरुभैरवः । चण्डो मां पवनात्पातु क्रोधेशः
    पातु माऽनलात् ॥ ११॥ उन्मत्तः सोमतः पातु भीषणः सूर्यतोऽवतु । याजकाच्च कपालेशो व्योम्नः संहारकोऽवतु
    ॥ १२॥ सदा समन्ततः पातु वपुर्वसुदलं पातु मम । गुरवः पान्तु सर्वत्र दिगीशः पातु सर्वतः ॥ १३॥ वृत्तत्रयं
    पातु नित्यं धरा गेहं सदाऽवतु । श्रीचक्रं पातु भीतिभ्यो योगिन्यः पान्तु सर्वदा ॥ १४॥ ऊर्ध्वं चाधः सदा
    पातु दिग्भ्यो राज्ञीश्वरः शिवः । सर्वत्र सर्वदा सर्वं वपुर्भूतेश्वरोऽवतात् ॥ १५॥ पादादिमूर्धपर्यन्तं
    वपुः सर्वत्र मेऽवतु । शिरसः पादपर्यन्तं राज्ञी पञ्चदशाक्षरी ॥ १६॥ इत्येवं कवचं राज्ञ्या मन्त्रगर्भं
    जयावहम् । त्रैलोक्यविजयं नाम दारिद्र्यभयनाशनम् ॥ १७॥ सर्वरोगहरं साक्षात्सिद्दिदं पापनाशनम् । महाभयहरं
    देवि मूलविद्यामयं परम् ॥ १८॥ परमार्थप्रदं नित्यं भोगमोक्षैककारणम् । यः पठेत्कवचं देवि रणे राजभये क्षणात्
    ॥ १९॥ सङ्ग्रामेषु रिपुञ्जित्वा विजयी गृहमेष्यति । पठनात्कवचस्यास्य राजकोपः प्रशाम्यति ॥ २०॥ द्यूते
    धनं लभेद्द्युती श्मशाने सिद्धिमाप्नुयात् । त्रिवारं यः पठेद्रात्रौ रेतःस्रावे महेश्वरि ॥ २१॥ तस्य
    राज्ञी महाविद्या स्वप्नेऽभीष्टप्रदा भवेत् । स्वयम्भूकुसुमैः शुद्धै रेतःस्तन्योभयाङ्कितैः ॥ २२॥ रसैर्भूर्जे
    लिखेद्वर्म रवौ प्रातर्महेश्वरि । चीरतन्तुभिरव्यक्तं लाक्षया वेष्टितं तथा ॥ २३॥ सुवर्णगुटिकान्तःस्थं
    पूजयेद्यन्त्रराजवत् । गुटिकैषा महाविद्या राज्ञीमूर्तिरिवापरा ॥ २४॥ मूलविद्यामयी देवि कुक्षिस्था भोगदायिनी
    । पृष्ठस्था बलदा देवि कुक्षिस्था रोगनाशिनी ॥ २५॥ सर्वार्थसाधनी लोके यथाभीष्टफलप्रदा । गुटिकेयं शुभा
    राज्ञ्या न देया यस्य कस्यचित् ॥ २६॥ इदं कवचमीशानि मूलविद्यामयं परम् । सारस्वतप्रदं लक्ष्मीपुत्रपौत्रविवर्धनम्
    ॥ २७॥ आयुष्करं पुष्टिकरं श्रीकरं च यशस्करम् । चतुःषष्ट्यादितन्त्राणां सारमादाय वर्णितम् ॥ २८॥ श्मशाने
    यः पठेत्सायं महाचीनक्रमेश्वरः । स साधको महादेवि राज्ञीपुत्रो भविष्यति ॥ २९॥ इदं ते मम सर्वस्वं त्रैलोक्यविजयाभिधम्
    । कवचं मन्त्रगर्भं च गोपनीयं स्वयोनिवत् ॥ ३०॥ इति श्रीरुद्रयामले तन्त्रे दशविद्यारहस्ये श्रीराज्ञीकवचम्
    ।
