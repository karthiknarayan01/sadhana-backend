id: vishnvadikritamshivastotram
category: stotram
name:
  english: vishnvadikritamshivastotram
  devanagari: विष्ण्वादिकृतंशिवस्तोत्रम्
content:
  english: vishnvadikritam shivastotram vishnvadaya ucuh | devadeva mahadeva laukikacarakritprabho | brahma
    tvamishvaram shambhum janimah kripaya tava || 1|| kim mohayasi nastata mayaya paraya tava | durjneyaya
    sada pumsam mohinya parameshvara || 2|| prakritah purushasyapi jagato yonibijayoh | parabrahma parastvam
    ca manovacamagocarah || 3|| tvameva vishvam srijasi pasyatsi nijatantratah | svarupam shivashaktim
    hi kridannurnapato yatha || 4|| tvameva kratumishana sasarjitha dayaparah | dakshena sutrena vibho
    sada trayyabhipattaye || 5|| tvayaiva loke'vasitassetavo yan dhritavratah | shuddhan shraddadhate
    vipra vedamargavicakshanah || 6|| kartustvam mangalanam hi svaparam tu mukhe vibho | amangalanam ca
    hitam mishram vatha viparyayam || 7|| sarvakarmaphalanam hi sada data tvameva hi | sarve hi prokta
    hi yashastatpatistvam shrutishrutah || 8|| prithagdhiyah karmadrisho'runtudashca durashayah | vitudanti
    paranmudha duruktairmatsaranvitah || 9|| tesham daivavadhanam bho bhuyattvacca vadho vibho | bhagavanparameshana
    kripam kuru paraprabho || 2
  devanagari: विष्ण्वादिकृतं शिवस्तोत्रम् विष्ण्वादय ऊचुः । देवदेव महादेव लौकिकाचारकृत्प्रभो । ब्रह्म
    त्वामीश्वरं शम्भुं जानीमः कृपया तव ॥ १॥ किं मोहयसि नस्तात मायया परया तव । दुर्ज्ञेयया सदा पुंसां मोहिन्या
    परमेश्वर ॥ २॥ प्रकृतः पुरुषस्यापि जगतो योनिबीजयोः । परब्रह्म परस्त्वं च मनोवाचामगोचरः ॥ ३॥ त्वमेव
    विश्वं सृजसि पास्यत्सि निजतन्त्रतः । स्वरूपां शिवशक्तिं हि क्रीडन्नूर्णपटो यथा ॥ ४॥ त्वमेव क्रतुमीशान
    ससर्जिथ दयापरः । दक्षेण सूत्रेण विभो सदा त्रय्यभिपत्तये ॥ ५॥ त्वयैव लोकेऽवसितास्सेतवो यान् धृतव्रताः
    । शुद्धान् श्रद्दधते विप्रा वेदमार्गविचक्षणाः ॥ ६॥ कर्तुस्त्वं मङ्गलानां हि स्वपरं तु मुखे विभो ।
    अमङ्गलानां च हितं मिश्रं वाथ विपर्ययम् ॥ ७॥ सर्वकर्मफलानां हि सदा दाता त्वमेव हि । सर्वे हि प्रोक्ता
    हि यशस्तत्पतिस्त्वं श्रुतिश्रुतः ॥ ८॥ पृथग्धियः कर्मदृशोऽरुन्तुदाश्च दुराशयाः । वितुदन्ति परान्मूढा
    दुरुक्तैर्मत्सरान्विताः ॥ ९॥ तेषां दैववधानां भो भूयात्त्वच्च वधो विभो । भगवन्परमेशान कृपां कुरु परप्रभो
    ॥ २
