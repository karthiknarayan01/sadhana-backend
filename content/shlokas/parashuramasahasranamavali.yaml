  devanagari: श्रीपरशुरामसहस्रनामावलिः अथ विनियोगः । ॐ अस्य श्रीजामदग्न्यसहस्रनामावलिमहामन्त्रस्य श्रीराम
    ऋषिः । जामदग्न्यः परमात्मा देवता । अनुष्टुप् छन्दः । श्रीमदविनाशरामप्रीत्यर्थं चतुर्विधपुरुषार्थसिद्ध्यर्थं
    जपे विनियोगः ॥ अथ करन्यासः । ॐ ह्रां गोविन्दात्मने अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं महीधरात्मने तर्जनीभ्यां
    नमः । ॐ ह्रूं हृषीकेशात्मने मध्यमाभ्यां नमः । ॐ ह्रैं त्रिविक्रमात्मने अनामिकाभ्यां नमः । ॐ ह्रौं
    विष्ण्वात्मने कनिष्ठिकाभ्यां नमः । ॐ ह्रः माधवात्मने करतलकरपृष्ठाभ्यां नमः ॥ अथ हृदयन्यासः । ॐ ह्रां
    गोविन्दात्मने हृदयाय नमः । ॐ ह्रीं महीधरात्मने शिरसे स्वाहा । ॐ ह्रूं हृषीकेशात्मने शिखायै वषट् ।
    ॐ ह्रैं त्रिविक्रमात्मने कवचाय हुम् । ॐ ह्रौं विष्ण्वात्मने नेत्रत्रयाय वौषट् । ॐ ह्रः माधवात्मने
    अस्त्राय फट् । अथ ध्यानम् । शुद्धजाम्बूनदनिभं ब्रह्मविष्णुशिवात्मकम् । सर्वाभरणसंयुक्तं कृष्णाजिनधरं
    विभुम् ॥ १॥ बाणचापौ च परशुमभयं च चतुर्भुजैः । प्रकोष्ठशोभि रुद्राक्षैर्दधानं भृगुनन्दनम् ॥ २॥ हेमयज्ञोपवीतं
    च स्निग्धस्मितमुखाम्बुजम् । दर्भाञ्चितकरं देवं क्षत्रियक्षयदीक्षितम् ॥ ३॥ श्रीवत्सवक्षसं रामं ध्यायेद्वै
    ब्रह्मचारिणम् । हृत्पुण्डरीकमध्यस्थं सनकाद्यैरभिष्टुतम् ॥ ४॥ सहस्रमिव सूर्याणामेकीभूय पुरः स्थितम्
    । तपसामिव सन्मूर्तिं भृगुवंशतपस्विनम् ॥ ५॥ चूडाचुम्बितकङ्कपत्रमभितस्तूणीद्वयं पृष्ठतो भस्मस्निग्धपवित्रलाञ्छनवपुर्धत्ते
    त्वचं रौरवीम् । मौञ्ज्या मेखलया नियन्त्रितमधोवासश्च माञ्जिष्ठकम् पाणौ कार्मुकमक्षसूत्रवलयं दण्डं परं
    पैप्पलम् ॥ ६॥ रेणुकाहृदयानन्दं भृगुवंशतपस्विनम् । क्षत्रियाणामन्तकं पूर्णं जामदग्न्यं नमाम्यहम् ॥
