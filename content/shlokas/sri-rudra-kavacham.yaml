id: sri-rudra-kavacham
category: stotram
name:
  english: Sri Rudra Kavacham
content:
  english: om asya shri rudra kavacastotra mahamantrasya durvasrishih anushthup chandah tryambaka rudro
    devata hram bijam shrim shaktih hrim kilakam mama manaso'bhishtasiddhyarthe jape viniyogah | hramityadi
    shadbijaih shadanganyasah || dhyanam | shantam padmasanastham shashidharamakutam pancavaktram trinetram
    shulam vajram ca khadgam parashumabhayadam dakshabhage vahantam | nagam pasham ca ghantam pralaya
    hutavaham sankusham vamabhage nanalankarayuktam sphatikamaninibham parvatisham namami || durvasa uvaca
    | pranamya shirasa devam svayambhum parameshvaram | ekam sarvagatam devam sarvadevamayam vibhum ||
    || rudra varma pravakshyami anga pranasya rakshaye | ahoratramayam devam rakshartham nirmitam pura
    || || rudro me cagratah patu patu parshvau harastatha | shiro me ishvarah patu lalatam nilalohitah
    || || netrayostryambakah patu mukham patu maheshvarah | karnayoh patu me shambhuh nasikayam sadashivah
    || || vagishah patu me jihvam oshthau patvambikapatih | shrikanthah patu me grivam bahumshcaiva pinakadhrit
    || || hridayam me mahadevah ishvarovyat stanantaram | nabhim katim ca vakshashca patu sarvam umapatih
    || || bahumadhyantaram caiva sukshmarupah sadashivah | svaram rakshatu sarvesho gatrani ca yatha kramam
    || || vajrashaktidharam caiva pashankushadharam tatha | gandashuladharam nityam rakshatu tridasheshvarah
    || || prasthaneshu pade caiva vrikshamule naditate | sandhyayam rajabhavane virupakshastu patu mam
    || || shitoshnadatha kaleshu tuhi na drumakantake | nirmanushye'same marge trahi mam vrishabhadhvaja
    || || ityetadrudrakavacam pavitram papanashanam | mahadevaprasadena durvaso munikalpitam || || mamakhyatam
    samasena na bhayam vindati kvacit | prapnoti paramarogyam punyamayushyavardhanam || || vidyarthi labhate
    vidyam dhanarthi labhate dhanam | kanyarthi labhate kanyam na bhayam vindate kvacit || || aputro labhate
    putram moksharthi mokshamapnuyat | trahi trahi mahadeva trahi trahi trayimaya || || trahi mam parvatinatha
    trahi mam tripurantaka | pasham khatvanga divyastram trishulam rudrameva ca || || namaskaromi devesha
    trahi mam jagadishvara | shatrumadhye sabhamadhye gramamadhye grihantare || || gamanagamane caiva
    trahi mam bhaktavatsala | tvam cittam tvam manasam ca tvam buddhistvam parayanam || || karmana manasa
    caiva tvam buddhishca yatha sada | jvarabhayam chindi sarvajvarabhayam chindi grahabhayam chindi ||
    || sarvashatrunnivartyapi sarvavyadhinivaranam | rudralokam sa gacchati rudralokam sagacchatyonnama
    iti || || iti skandapurane durvasa proktam shri rudrakavacam ||
  devanagari: ॐ अस्य श्री रुद्र कवचस्तोत्र महामन्त्रस्य दूर्वासृषिः अनुष्ठुप् छन्दः त्र्यम्बक रुद्रो देवता
    ह्रां बीजं श्रीं शक्तिः ह्रीं कीलकं मम मनसोऽभीष्टसिद्ध्यर्थे जपे विनियोगः । ह्रामित्यादि षड्बीजैः
    षडङ्गन्यासः ॥ ध्यानम् । शान्तं पद्मासनस्थं शशिधरमकुटं पञ्चवक्त्रं त्रिनेत्रं शूलं वज्रं च खड्गं परशुमभयदं
    दक्षभागे वहन्तम् । नागं पाशं च घण्टां प्रलय हुतवहं साङ्कुशं वामभागे नानालङ्कारयुक्तं स्फटिकमणिनिभं
    पार्वतीशं नमामि ॥ दूर्वास उवाच । प्रणम्य शिरसा देवं स्वयम्भुं परमेश्वरम् । एकं सर्वगतं देवं सर्वदेवमयं
    विभुम् ॥ ॥ रुद्र वर्म प्रवक्ष्यामि अङ्ग प्राणस्य रक्षये । अहोरात्रमयं देवं रक्षार्थं निर्मितं पुरा
    ॥ ॥ रुद्रो मे चाग्रतः पातु पातु पार्श्वौ हरस्तथा । शिरो मे ईश्वरः पातु ललाटं नीललोहितः ॥ ॥ नेत्रयोस्त्र्यम्बकः
    पातु मुखं पातु महेश्वरः । कर्णयोः पातु मे शम्भुः नासिकायां सदाशिवः ॥ ॥ वागीशः पातु मे जिह्वां ओष्ठौ
    पात्वम्बिकापतिः । श्रीकण्ठः पातु मे ग्रीवां बाहूंश्चैव पिनाकधृत् ॥ ॥ हृदयं मे महादेवः ईश्वरोव्यात्
    स्तनान्तरम् । नाभिं कटिं च वक्षश्च पातु सर्वं उमापतिः ॥ ॥ बाहुमध्यान्तरं चैव सूक्ष्मरूपः सदाशिवः ।
    स्वरं रक्षतु सर्वेशो गात्राणि च यथा क्रमम् ॥ ॥ वज्रशक्तिधरं चैव पाशाङ्कुशधरं तथा । गण्डशूलधरं नित्यं
    रक्षतु त्रिदशेश्वरः ॥ ॥ प्रस्थानेषु पदे चैव वृक्षमूले नदीतटे । सन्ध्यायां राजभवने विरूपाक्षस्तु पातु
    माम् ॥ ॥ शीतोष्णादथ कालेषु तुहि न द्रुमकण्टके । निर्मनुष्येऽसमे मार्गे त्राहि मां वृषभध्वज ॥ ॥ इत्येतद्रुद्रकवचं
    पवित्रं पापनाशनम् । महादेवप्रसादेन दूर्वासो मुनिकल्पितम् ॥ ॥ ममाख्यातं समासेन न भयं विन्दति क्वचित्
    । प्राप्नोति परमारोग्यं पुण्यमायुष्यवर्धनम् ॥ ॥ विद्यार्थी लभते विद्यां धनार्थी लभते धनम् । कन्यार्थी
    लभते कन्यां न भयं विन्दते क्वचित् ॥ ॥ अपुत्रो लभते पुत्रं मोक्षार्थी मोक्षमाप्नुयात् । त्राहि त्राहि
    महादेव त्राहि त्राहि त्रयीमय ॥ ॥ त्राहि मां पार्वतीनाथ त्राहि मां त्रिपुरन्तक । पाशं खट्वाङ्ग दिव्यास्त्रं
    त्रिशूलं रुद्रमेव च ॥ ॥ नमस्करोमि देवेश त्राहि मां जगदीश्वर । शत्रुमध्ये सभामध्ये ग्राममध्ये गृहान्तरे
    ॥ ॥ गमनागमने चैव त्राहि मां भक्तवत्सल । त्वं चित्तं त्वं मानसं च त्वं बुद्धिस्त्वं परायणम् ॥ ॥ कर्मणा
    मनसा चैव त्वं बुद्धिश्च यथा सदा । ज्वरभयं छिन्दि सर्वज्वरभयं छिन्दि ग्रहभयं छिन्दि ॥ ॥ सर्वशत्रून्निवर्त्यापि
    सर्वव्याधिनिवारणम् । रुद्रलोकं स गच्छति रुद्रलोकं सगच्छत्योन्नम इति ॥ ॥ इति स्कन्दपुराणे दूर्वास प्रोक्तं
    श्री रुद्रकवचम् ॥
