id: brahmanakritamvishnustotram
category: stotram
name:
  english: brahmanakritamvishnustotram
  devanagari: ब्रह्मणाकृतंविष्णुस्तोत्रम्
content:
  english: brahmana kritam vishnustotram shirodasyottaram kulam yatraste haririshvarah | drishtva devam
    jagadyonim vishnum vishvagurum shivam || 1|| vavande caranau murdhna kritanjalirabhashata | brahmovaca
    | tvam gatih sarvabhutanamananto'syakhilatmakah || 2|| vyapi sarvamaravapurmahayogi sanatanah | tvamatma
    sarvabhutanam pradhanam prakritih para || 3|| vairagyaishvaryanirato vagatito niranjanah | tvam karta
    caiva bharta ca vihanta suravidvisham || 4|| tratumarhasyanantesha tratasi parameshvarah | ittham
    sa vishnurbhagavan brahmana samprabodhitah || 5|| iti kurmapurane purvabhage shodashadhyayantargatam
    brahmakritam vishnustotram samaptam | kurmapurane purvabhage 16
  devanagari: ब्रह्मणा कृतं विष्णुस्तोत्रम् षीरोदस्योत्तरं कूलं यत्रास्ते हरिरीश्वरः । दृष्ट्वा देवं जगद्योनिं
    विष्णुं विश्वगुरुं शिवम् ॥ १॥ ववन्दे चरणौ मूर्ध्ना कृताञ्जलिरभाषत । ब्रह्मोवाच । त्वं गतिः सर्वभूतानामनन्तोऽस्यखिलात्मकः
    ॥ २॥ व्यापी सर्वामरवपुर्महायोगी सनातनः । त्वमात्मा सर्वभूतानां प्रधानं प्रकृतिः परा ॥ ३॥ वैराग्यैश्वर्यनिरतो
    वागतीतो निरञ्जनः । त्वं कर्ता चैव भर्ता च विहन्ता सुरविद्विषाम् ॥ ४॥ त्रातुमर्हस्यनन्तेश त्रातासि
    परमेश्वरः । इत्थं स विष्णुर्भगवान् ब्रह्मणा सम्प्रबोधितः ॥ ५॥ इति कूर्मपुराणे पूर्वभागे षोडशाध्यायान्तर्गतं
    ब्रह्मकृतं विष्णुस्तोत्रं समाप्तम् । कूर्मपुराणे पूर्वभागे १६
