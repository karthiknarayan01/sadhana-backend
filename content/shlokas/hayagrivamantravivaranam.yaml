id: hayagrivamantravivaranam
category: mantra
name:
  english: hayagrivamantravivaranam
  devanagari: हयग्रीवमन्त्रविवरणम्
content:
  english: manurbhavet | hayagrivamanum shantam vidyaishvaryadidayakam | pranavena karanyasam shatsvaraistu
    shadangakam || pujahomadikam sarvamekakshara vadacaret | shankhacakragadapadmajnanapustaka dharinam
    | pashankushagni vajradikhetakuntadharam vibhum || shribhuniḻadhipam devam vanamalavirajitam | hayagrivam
    bhaje nityam sarvabharanabhushitam || shrihayagrivanushtup | vakshye canushtubham shantam hayagrivamanuttamam
    || bhuktimuktipradam samyak sarvavidyapradayakam || rigyajussamarupaya vedaharanakarmane | pranavodgithavapushe
    mahashvashirase namah || udgitha pranavodgitha sarvavagishvareshvara | sarvavedamayacintya sarvam
    bodhaya bodhaya || padai rarthaih karanyasam kuryaddeva shadakangakam | anushtubhadvayam caiva jnanadyaishca
    tatha bhavet || dhyanarcanadikam sarvamekaksharavadacaret || om hlaum hrim shrim
  devanagari: मनुर्भवेत् । हयग्रीवमनुं शान्तं विद्यैश्वर्यादिदायकम् । प्रणवेन करन्यासं षट्स्वरैस्तु षडङ्गकम्
    ॥ पूजाहोमादिकं सर्वमेकाक्षर वदाचरेत् । शङ्खचक्रगदापद्मज्ञानपुस्तक धारिणम् । पाशाङ्कुशाग्नि वज्रादिखेटकुन्तधरं
    विभुम् ॥ श्रीभूनीळाधिपं देवं वनमालाविराजितम् । हयग्रीवं भजे नित्यं सर्वाभरणभूषितम् ॥ श्रीहयग्रीवानुष्टुप्
    । वक्ष्ये चानुष्टुभं शान्तं हयग्रीवमनुत्तमम् ॥ भुक्तिमुक्तिप्रदं सम्यक् सर्वविद्याप्रदायकम् ॥ ऋग्यजुस्सामरूपाय
    वेदाहरणकर्मणे । प्रणवोद्गीथवपुषे महाश्वशिरसे नमः ॥ उद्गीथ प्रणवोद्गीथ सर्ववागीश्वरेश्वर । सर्ववेदमयाचिन्त्य
    सर्वं बोधय बोधय ॥ पदै रर्थैः करन्यासं कुर्याद्देव षडकङ्गकम् । आनुष्टुभद्वयं चैव ज्ञानाद्यैश्च तथा
    भवेत् ॥ ध्यानार्चनादिकं सर्वमेकाक्षरवदाचरेत् ॥ ॐ ह्लौं ह्रीं श्रीम्
