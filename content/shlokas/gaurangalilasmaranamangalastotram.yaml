id: gaurangalilasmaranamangalastotram
category: stotram
name:
  english: gaurangalilasmaranamangalastotram
  devanagari: गौरान्गलीलास्मरणमन्गलस्तोत्रम्
content:
  english: vilapito mukham sanghrishyasau rudhiram adhikam taddadhadaho | kva me kantah krishno vada vada
    vadeti pralapitah shacisunuh sakshat smarana
  devanagari: विलपितो मुखं सङ्घृष्यासौ रुधिरं अधिकं तद्दधदहो । क्व मे कान्तः कृष्णो वद वद वदेति प्रलपितः
    शचीसूनुः साक्षात् स्मरण
meaning: {}
source_attribution:
