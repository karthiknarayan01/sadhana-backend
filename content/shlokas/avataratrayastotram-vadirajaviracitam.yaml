id: avataratrayastotram-vadirajaviracitam
category: stotram
name:
  english: avataratrayastotram (vadirajaviracitam)
  devanagari: अवतारत्रयस्तोत्रम् (वादिराजविरचितम्)
content:
  english: avataratrayastotram madhvahritkamalasthitam varadayakam karunakaram lakshmanagrajamakshayam
    duritakshayam kamalekshanam | ravanantakamavyayam varajanakiramanam vibhum anjanasutapanikanjanishevitam
    pranamamyaham || 1|| palayasva nipalayasva nipalayasva ramapate | vadirajamunindravandita vajivaktra
    namo'stu te || devakitanayam nijarjunasarathim garudadhvajam putanashakatasuradikhalantakam purushottamam
    | dushtakamsanimardanam vararugminipatimacyutam bhimasenakarambujena susevitam pranamamyaham || 2||
    palayasva nipalayasva nipalayasva ramapate | vadirajamunindravandita vajivaktra namo'stu te || jnanamuktisubhaktidam
    varabadarayanamavyayam kotibhaskarabhasamanakiritakundalamanditam | vaksudarshanatah kaleh shiraghatakam
    ramaya yutam madhvasatkarakanjapujitamakshayam pranamamyaham || 3|| palayasva nipalayasva nipalayasva
    ramapate | vadirajamunindravandita vajivaktra namo'stu te || iti shrimadvadirajapujyacaranaviracitam
    avataratrayastotram sampurnam | bharatiramanamukhyapranantargata shrikrishnarpanamastu |
  devanagari: अवतारत्रयस्तोत्रम् मध्वहृत्कमलस्थितं वरदायकं करुणाकरं लक्ष्मणाग्रजमक्षयं दुरितक्षयं कमलेक्षणम्
    । रावणान्तकमव्ययं वरजानकीरमणं विभुं अञ्जनासुतपाणिकञ्जनिषेवितं प्रणमाम्यहम् ॥ १॥ पालयस्व निपालयस्व
    निपालयस्व रमापते । वादिराजमुनीन्द्रवन्दित वाजिवक्त्र नमोऽस्तु ते ॥ देवकीतनयं निजार्जुनसारथिं गरुडध्वजं
    पूतनाशकटासुरादिखलान्तकं पुरुषोत्तमम् । दुष्टकंसनिमर्दनं वररुग्मिणीपतिमच्युतं भीमसेनकराम्बुजेन सुसेवितं
    प्रणमाम्यहम् ॥ २॥ पालयस्व निपालयस्व निपालयस्व रमापते । वादिराजमुनीन्द्रवन्दित वाजिवक्त्र नमोऽस्तु
    ते ॥ ज्ञानमुक्तिसुभक्तिदं वरबादरायणमव्ययं कोटिभास्करभासमानकिरीटकुण्डलमण्डितम् । वाक्सुदर्शनतः कलेः
    शिरघातकं रमया युतं मध्वसत्करकञ्जपूजितमक्षयं प्रणमाम्यहम् ॥ ३॥ पालयस्व निपालयस्व निपालयस्व रमापते ।
    वादिराजमुनीन्द्रवन्दित वाजिवक्त्र नमोऽस्तु ते ॥ इति श्रीमद्वादिराजपूज्यचरणविरचितं अवतारत्रयस्तोत्रं
    सम्पूर्णम् । भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु ।
