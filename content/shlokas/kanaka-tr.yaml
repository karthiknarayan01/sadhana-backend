id: kanaka-tr
category: stotram
name:
  english: kanaka-tr
  devanagari: कनक-त्र्
content:
  english: shrikanakadharastotram vande vandarumandaramindiranandakandalam | amandanandasandohabandhuram
    sindhurananam || angam hareh pulakabhushanamashrayanti bhringanganeva mukulabharanam tamalam | angikritakhilavibhutirapangalila
    mangalyada'stu mama mangaladevatayah || 1||
  devanagari: श्रीकनकधारास्तोत्रम् वन्दे वन्दारुमन्दारमिन्दिरानन्दकन्दलम् । अमन्दानन्दसन्दोहबन्धुरं सिन्धुराननम्
    ॥ अङ्गं हरेः पुलकभूषणमाश्रयन्ती भृङ्गाङ्गनेव मुकुलाभरणं तमालम् । अङ्गीकृताखिलविभूतिरपाङ्गलीला माङ्गल्यदाऽस्तु
    मम मङ्गलदेवतायाः ॥ १॥
meaning: {}
