id: ramakrishnastotram-3
category: stotram
name:
  english: ramakrishnastotram 3
  devanagari: रामकृष्णस्तोत्रम् ३
content:
  english: vilasena yena sarvamidam tatam | lilarupam sadanandam ramakrishnam namamyaham || 9|| sarvadharmapranetaram
    dharmaglanivinashakam | sadhumitram shivam shantam ramakrishnam namamyaham || 10|| ajnanatimire yastu
    jnanalokapradipakah | vimalanandadanaya pradurasinmahitale | namo'stu ramakrishnaya tasmai shrigurave
    namah || 11|| samsararnavaghore yah karnadharasvarupakah | namo'stu ramakrishnaya tasmai shrigurave
    namah || 12|| tvam hi vishnurvirincistvam tvam ca devo maheshvarah tvam caiva shaktirupo'si nirgunastvam
    sanatanah | tvam stotum ko'tra shaktah syad bhavatitamanamayam bhagavan sarvabhutatman ramakrishna
    namo'stute || 13|| sarvaya sarvaparaya sarvabhavasvarupine | sarvabhavavihinaya ramakrishnaya te namah
    || 14|| mahamayasvarupaya mahamohavinashine | mayatitaya shantaya ramakrishnaya te namah || 15|| niranjanam
    nityamanantarupam bhaktanukampaddhritavigraham vai | ishavataram parameshamidyam tam ramakrishnam
    shirasa namamah || 16|| iti shriabhedanandasvamina viracitam jagadguru shriramakrishnastotramidam
    sampurnam |
  devanagari: विलासेन येन सर्वमिदं ततम् । लीलारूपं सदानन्दं रामकृष्णं नमाम्यहम् ॥ ९॥ सर्वधर्मप्रणेतारं
    धर्मग्लानिविनाशकम् । साधुमित्रं शिवं शान्तं रामकृष्णं नमाम्यहम् ॥ १०॥ अज्ञानतिमिरे यस्तु ज्ञानालोकप्रदीपकः
    । विमलानन्ददानाय प्रादुरासीन्महीतले । नमोऽस्तु रामकृष्णाय तस्मै श्रीगुरवे नमः ॥ ११॥ संसारार्णवघोरे
    यः कर्णधारस्वरूपकः । नमोऽस्तु रामकृष्णाय तस्मै श्रीगुरवे नमः ॥ १२॥ त्वं हि विष्णुर्विरिञ्चिस्त्वं
    त्वं च देवो महेश्वरः त्वं चैव शक्तिरूपोऽसि निर्गुणस्त्वं सनातनः । त्वां स्तोतुं कोऽत्र शक्तः स्याद्
    भावातीतमनामयम् भगवन् सर्वभूतात्मन् रामकृष्ण नमोऽस्तुते ॥ १३॥ सर्वाय सर्वपाराय सर्वभावस्वरूपिणे । सर्वभावविहीनाय
    रामकृष्णाय ते नमः ॥ १४॥ महामायास्वरूपाय महामोहविनाशिने । मायातीताय शान्ताय रामकृष्णाय ते नमः ॥ १५॥
    निरञ्जनं नित्यमनन्तरूपं भक्तानुकम्पाद्धृतविग्रहं वै । ईशावतारं परमेशमीड्यं तं रामकृष्णं शिरसा नमामः
    ॥ १६॥ इति श्रीअभेदानन्दस्वामिना विरचितं जगद्गुरु श्रीरामकृष्णस्तोत्रमिदं सम्पूर्णम् ।
