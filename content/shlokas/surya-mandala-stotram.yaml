id: surya-mandala-stotram
category: stotram
name:
  english: Surya Mandala Stotram
content:
  english: namo'stu suryaya sahasrarashmaye sahasrashakhanvita sambhavatmane | sahasrayogodbhava bhavabhagine
    sahasrasankhyayudhadharine namah || || yanmandalam diptikaram vishalam ratnaprabham tivramanadirupam
    | daridryaduhkhakshayakaranam ca punatu mam tatsaviturvarenyam || || yanmandalam devaganaih supujitam
    vipraih stutam bhavanamuktikovidam | tam devadevam pranamami suryam punatu mam tatsaviturvarenyam
    || || yanmandalam jnanaghanantvagamyam trailokyapujyam trigunatmarupam | samastatejomayadivyarupam
    punatu mam tatsaviturvarenyam || || yanmandalam gudhamatiprabodham dharmasya vriddhim kurute jananam
    | yatsarvapapakshayakaranam ca punatu mam tatsaviturvarenyam || || yanmandalam vyadhivinashadaksham
    yadrigyajuh samasu sampragitam | prakashitam yena ca bhurbhuvah svah punatu mam tatsaviturvarenyam
    || || yanmandalam vedavido vadanti gayanti yaccaranasiddhasanghah | yadyogino yogajusham ca sanghah
    punatu mam tatsaviturvarenyam || || yanmandalam sarvajanaishca pujitam jyotishca kuryadiha martyaloke
    | yatkalakaladyamanadirupam punatu mam tatsaviturvarenyam || || yanmandalam vishnucaturmukhakhyam
    yadaksharam papaharam jananam | yatkalakalpakshayakaranam ca punatu mam tatsaviturvarenyam || || yanmandalam
    vishvasrijam prasiddham utpattirakshapralaya pragalbham | yasmin jagatsamharate'khilam ca punatu mam
    tatsaviturvarenyam || || yanmandalam sarvagatasya vishnoh atma param dhama vishuddhatattvam | sukshmantarairyogapathanugamyam
    punatu mam tatsaviturvarenyam || || yanmandalam vedavidopagitam yadyoginam yoga pathanugamyam | tatsarva
    vedyam pranamami suryam punatu mam tatsaviturvarenyam || || suryamandalasu stotram yah pathetsatatam
    narah | sarvapapavishuddhatma suryaloke mahiyate || iti shri bhavishyottarapurane shri krishnarjuna
    samvade suryamandala stotram |
  devanagari: नमोऽस्तु सूर्याय सहस्ररश्मये सहस्रशाखान्वित सम्भवात्मने । सहस्रयोगोद्भव भावभागिने सहस्रसङ्ख्यायुधधारिणे
    नमः ॥ ॥ यन्मण्डलं दीप्तिकरं विशालं रत्नप्रभं तीव्रमनादिरूपम् । दारिद्र्यदुःखक्षयकारणं च पुनातु मां
    तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं देवगणैः सुपूजितं विप्रैः स्तुतं भावनमुक्तिकोविदम् । तं देवदेवं प्रणमामि
    सूर्यं पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं ज्ञानघनन्त्वगम्यं त्रैलोक्यपूज्यं त्रिगुणात्मरूपम्
    । समस्ततेजोमयदिव्यरूपं पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं गूढमतिप्रबोधं धर्मस्य वृद्धिं कुरुते
    जनानाम् । यत्सर्वपापक्षयकारणं च पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं व्याधिविनाशदक्षं यदृग्यजुः
    सामसु सम्प्रगीतम् । प्रकाशितं येन च भूर्भुवः स्वः पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं वेदविदो
    वदन्ति गायन्ति यच्चारणसिद्धसङ्घाः । यद्योगिनो योगजुषां च सङ्घाः पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥
    यन्मण्डलं सर्वजनैश्च पूजितं ज्योतिश्च कुर्यादिह मर्त्यलोके । यत्कालकालाद्यमनादिरूपं पुनातु मां तत्सवितुर्वरेण्यम्
    ॥ ॥ यन्मण्डलं विष्णुचतुर्मुखाख्यं यदक्षरं पापहरं जनानाम् । यत्कालकल्पक्षयकारणं च पुनातु मां तत्सवितुर्वरेण्यम्
    ॥ ॥ यन्मण्डलं विश्वसृजं प्रसिद्धं उत्पत्तिरक्षप्रलय प्रगल्भम् । यस्मिन् जगत्संहरतेऽखिलं च पुनातु मां
    तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं सर्वगतस्य विष्णोः आत्मा परं धाम विशुद्धतत्त्वम् । सूक्ष्मान्तरैर्योगपथानुगम्यं
    पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ यन्मण्डलं वेदविदोपगीतं यद्योगिनां योग पथानुगम्यम् । तत्सर्व वेद्यं
    प्रणमामि सूर्यं पुनातु मां तत्सवितुर्वरेण्यम् ॥ ॥ सूर्यमण्डलसु स्तोत्रं यः पठेत्सततं नरः । सर्वपापविशुद्धात्मा
    सूर्यलोके महीयते ॥ इति श्री भविष्योत्तरपुराणे श्री कृष्णार्जुन संवादे सूर्यमण्डल स्तोत्रम् ।
