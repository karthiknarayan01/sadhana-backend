id: vrindeshvarastotram
category: stotram
name:
  english: vrindeshvarastotram
  devanagari: वृन्देश्वरस्तोत्रम्
content:
  english: vishveshvaram sakalabhutapatim paresham devadhidevamamarastutapadapadmam | saccitsukham vigatamayamacintyarupam
    vrindeshvaram bhavabhayapanudam bhajamah || 1|| yo mangalam varamaho'khilamangalanam yasminna mrityujananavyavaharaduhkham
    | shantam vikararahitam paramacyutam tam vrindeshvaram bhavabhayapanudam bhajamah || 2|| yo nirgunah
    saguna ityapi bhaktahetoh dharmavanaya nijatattvavikasanaya | tam sadgurum sakalajivavishuddharupam
    vrindeshvaram bhavabhayapanudam bhajamah || 3|| sarvartinashakam stotram yah pathedbhaktitah puman
    na tasya duhkham kincitsyadrajate bhuvi pujitah || iti shrimat paramahamsaparivrajakacarya sadguru
    bhagavan shridharasvamimaharajaviracitam shrivrindeshvarastotram sampurnam | racanasthanam
  devanagari: विश्वेश्वरं सकलभूतपतिं परेशं देवाधिदेवममरस्तुतपादपद्मम् । सच्चित्सुखं विगतमायमचिन्त्यरूपं
    वृन्देश्वरं भवभयापनुदं भजामः ॥ १॥ यो मङ्गलं वरमहोऽखिलमङ्गलानां यस्मिन्न मृत्युजननव्यवहारदुःखम् । शान्तं
    विकाररहितं परमच्युतं तं वृन्देश्वरं भवभयापनुदं भजामः ॥ २॥ यो निर्गुणः सगुण इत्यपि भक्तहेतोः धर्मावनाय
    निजतत्त्वविकासनाय । तं सद्गुरुं सकलजीवविशुद्धरूपं वृन्देश्वरं भवभयापनुदं भजामः ॥ ३॥ सर्वार्तिनाशकं
    स्तोत्रं यः पठेद्भक्तितः पुमान् न तस्य दुःखं किञ्चित्स्याद्राजते भुवि पूजितः ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य
    सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीवृन्देश्वरस्तोत्रं सम्पूर्णम् । रचनास्थानं
