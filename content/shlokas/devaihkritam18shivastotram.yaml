id: devaihkritam18shivastotram
category: stotram
name:
  english: devaihkritam18shivastotram
  devanagari: देवैःकृतं१८शिवस्तोत्रम्
content:
  english: devaih kritam 18 shivastotram deva ucuh | namaste devadevesha maheshvara namo namah || 45||
    na vidmah paramam mudha mahimanam tavatulam | yadyogena param brahma bhutanam tvam sanatanah || 46||
    pratishtha sarvabhutanam hetuh sarvasya sarjane | bibharshi caiva netrasthansomasuryavibhavasun ||
    47|| namasankirtanadeva mucyante jantavo'shubhat | prithivyabagnicandrarkavyomavayupalakshanah ||
    48|| murtayaste mahadeva vyaptamabhirasheshatah | rajahsattvatamobhavairbhramyamanam tvaya jagat ||
    49|| navabudhyati sarvesha sarvamurtidharo yatah | brahmadinam sureshanam sammohanavimohanam | tvam
    karoshi yugavartakale kale ca duhsaham || 1
  devanagari: देवैः कृतं १८ शिवस्तोत्रम् देवा ऊचुः । नमस्ते देवदेवेश महेश्वर नमो नमः ॥ ४५॥ न विद्मः परमं
    मूढा महिमानं तवातुलम् । यद्योगेन परं ब्रह्म भूतानां त्वं सनातनः ॥ ४६॥ प्रतिष्ठा सर्वभूतानां हेतुः
    सर्वस्य सर्जने । बिभर्षि चैव नेत्रस्थान्सोमसूर्यविभावसून् ॥ ४७॥ नामसङ्कीर्तनादेव मुच्यन्ते जन्तवोऽशुभात्
    । पृथिव्यबग्निचन्द्रार्कव्योमवायूपलक्षणाः ॥ ४८॥ मूर्तयस्ते महादेव व्याप्तमाभिरशेषतः । रजःसत्त्वतमोभावैर्भ्राम्यमाणं
    त्वया जगत् ॥ ४९॥ नावबुध्यति सर्वेश सर्वमूर्तिधरो यतः । ब्रह्मादीनां सुरेशानां सम्मोहनविमोहनम् । त्वं
    करोषि युगावर्तकाले काले च दुःसहम् ॥ १
meaning: {}
