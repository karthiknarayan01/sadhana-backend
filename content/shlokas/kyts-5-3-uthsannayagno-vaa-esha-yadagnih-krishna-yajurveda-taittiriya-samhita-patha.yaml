id: kyts-5-3-uthsannayagno-vaa-esha-yadagnih-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.3 Uthsannayagno Vaa Esha Yadagnih - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande tritiyah prashnah shri gurubhyo namah
    | harih om || uthsanna yajno va esha yadagnih kim 'haitasya kriyate kim va~ na yadvai yajnasya kriyamanasya
    ntaryanti puyati va asya tada shvinirupa dadhatyashvinau vai devana mbhishajau tabhyamevasmai bheshaja
    nkaroti pancopa dadhati pankto yajno yavaneva yajnastasmai bheshaja nkarotyritavya upa dadhatyrituna
    pancopa dadhati panca va ritavo yavanta evartavastan kalpayati samanaprabhritayo bhavanti samanodarkastasma
    thsamana ritava ekena padena vyavartante tasmad ritavo vyavartante pranabhrita upa dadhatyritushveva
    prana ryantyatho prajanayatyevainanesha vai vayurya ritavya upadhaya pranabhrita thsarvanritunanu
    vayura varivarti vrishtisanirupa dadhati vrishtimevava rundhe yadekadhopadaddhya shedanupariharagm
    sadayati tasma tpranabhrita upadhaya vrishtisanirupadadhati tasma dvayupracyuta divo vrishtirirte
    pashavo vai vayasya nanamanasah khalu vai pashavo nana ssyaditi vayasya padhayapasya upa daddhya mevasmai
    pashubhih karotyapashureva bhavati ya stasyopadhaya vayasya upa daddhya jnanamevasmai pashubhih karoti
    pashumaneva bhavati catasrah purastadupa dadhati tasma ccatvari cakshusho rupani dve shukle dve krishne
    nmurdha panca dakshinayag shronyamupa dadhati pancottarasya tpravanah pashurbasto vaya iti dakshine
    'gmsa upa dadhati vrishnirvaya ityuttare 'gmsaveva prati dadhati vyaghro vaya iti dakshine paksha
    upa dadhati sigmho vaya ityuttare pakshayoreva virya ndadhati purusho vaya iti maddhye tasma tpurushah
    pashunamadhipatih || gni avyathamanamiti svayamatrinnamupa dadhatindragnibhyam va~ imau lokau vidhritavanayo
    rvidhritya adhriteva va esha yanmaddhyama citirantarikshamiva va eshendra gni ityahendragni vai devanamojo
    bhritavojasaivaina mantarikshe cinute dhrityai svayamatrinnamupa dadhatyantariksham vai~ svayamatrinna
    'ntarikshamevopa dhatte 'shvamupa ghrapayati pranameva ghrapayati pranameva prajapatyo va ashvah prajapatinaivagni
    ncinute svayamatrinna bhavati prananamuthsrishtya atho suvargasya lokasyanukhyatyai devanam ssamavliyanta
    ta eta dishya apashya nta upadadhata tabhirvai te disho 'drigmhan yaddishya upadadhati disham vi~dhrityai
    dasha pranabhritah purastadupa dadhati nava vai purushe dadhati nava vai purushe prana nabhirdashami
    prananeva purasta tprana jyotishmati muttamamupa dadhati tasma va~gjyotiruttama dashopa dadhati dasha
    njyotirjyotireva purasta tpurastajjyotirupa ''smahe chandagmsi pashushvajimayusta pashava ucyante
    ma chanda iti dakshinata upa dadhati tasma ddakshina vrito masah prithivi chanda iti pashca tpratishthitya
    agnirdevatetyuttarata ojo va agniroja evottarato dhatte tasmaduttarato 'bhiprayayi jayati shattrigmsha
    thsampadyante shattrigmshadakshara brihati bar hatah pashavo brihatyaivasmai pashunava rundhe brihati
    chandasag svara upadhiyante gacchati upadhiyante gacchati svara jyagm sapta valakhilyah purastadupa
    dadhati sapta pashca ncau prananagm saviryatvaya murdha 'si raditi purastadupa dadhati yantri raditi
    pashca tprananevasmai samico dadhati || dyajne 'kurvata tadasura akurvata te deva eta akshnayastomiya
    apashya nta anyatha 'nucya nyathopadadhata tadasura nanvavaya 'sura yadakshnayastomiya anyatha 'nucyanyathopa
    dadhati bhratrivyabhibhutyai bhavatyatmana para 'sya bhratrivyo bhavatya shustrivriditi purastadupa
    dadhati yajnamukham dyajnamukhameva purastadvi yatayati vyoma saptadasha iti dakshinato 'nnam 'nnameva
    dakshinato dhatte tasma ddakshinenannamadyate dharuna ekavigmsha iti pashca tpratishtha va ekavigmshah
    pratishthityai bhantah pancadasha ityuttarata ojo vai bhanta ojah pancadasha oja evottarato dhatte
    tasmaduttarato 'bhiprayayi jayati pratu rtirashtadasha iti purasta dupa dadhati dvau trivritavabhipurvam
    ya~jnamukhe vi yatayatyabhivarta ssavigmsha iti dakshinato 'nnameva dakshinato dhatte tasma ddakshinenannamadyate
    varco dvavigmsha iti pashca dvigmshatirdve tena virajau ya ddve pratishtha tena virajoreva bhipurvamannadye
    pratitishthati tapo navadasha ityuttarata stasma ityuttarata stasma stapasvitaro yonishcaturvigmsha
    iti purastadupa dadhati caturvigmshatyakshara gayatri gayatri yajnamukham ya~jnamukhameva purasta
    pancavigmsha iti dakshinato mpancavigmshonnameva dakshinato dhatte tasma ddakshinenannamadyata ojastrinava
    iti pashcadime vai lokastrinava eshveva lokeshu pratitishthati sabhamranastrayovigmsha i sabhamranastrayovigmsha
    iti ssambharyatarah kraturekatrigmsha iti purastadupa dadhati vagvai kraturyajnamukham va~gyajnamukhameva
    purastadvi yatayati braddhnasya vishtapa ncatustrigmsha iti dakshinato 'sau va adityo braddhnasya
    vishtapa mbrahmavarcasameva dakshinato dhatte tasma brahmavarcasitarah pratishtha trayastrigmsha iti
    pashca tpratishthityai nakah shattrigmsha ityuttarata ssuvargo vai loko nakah suvargasya lokasya samashtyai
    || strayovigmsha iti 'siti purastadupa dadhati yajnamukham va~ agniryajnamukha dyajnamukhameva purastadvi
    yatayati nricakshasa shshushruvagmso vai nricakshaso ndhata jatayaivasma annamapi dadhati tasma 'nnamatti
    janitragg spritagm saptadasha 'nnameva dakshinato dhatte tasma nnamadyate mitrasya bhago tprano vai
    mitro 'pano varunah pranapanavevasmi ndadhati divo vrishtirvata ssprita ekavigmsha sstoma ityaha pratishtha
    va ekavigmshah pratishthitya indrasya bhago 'sityuttarata ojo va indra ojo vishnurojah kshatramojah
    pancadasha oja evottarato dhatte oja evottarato dhatte tasmaduttarato 'bhiprayayi jayati vasuna 'siti
    purastadupa dadhati yajnamukham vai~ vasavo yajnamukhagm rudra yajnamukha ncaturvigmsho yajnamukhameva
    purastadvi yatayatyadityana 'nnameva dakshinato dhatte tasma 'nnamadyate 'dityai bhago tpratishtha
    va aditih pratishtha pusha pratishtha trinavah pratishthityai devasya saviturbhago ' sityuttarato
    brahma vai deva ssavita brahma brihaspatirbrahma catushtomo brahmavarcasamevottarato dhatte tasmaduttaro
    ssavitravati bhavati prasu dbrahmananamudici sanih prasuta dhartrashcatushtoma iti purastadupa dadhati
    yajnamukham ncatushtomo yajnamukhameva purastadvi yatayati yavana 'siti dakshinato masa vai yava ardhamasa
    ayava ddakshinavrito masa annam mpraja annameva dakshinato dhatte tasma tpratishthityai vivarto 'shtacatvarigmsha
    ityuttarato ssaviryatvaya tasmadimau lokau samava yasya mukhyavatih purastadupadhiyante mukhya eva
    bhavatya 'sya mukhyo jayate yasya nnado jayate yasya pratishthavatih pashca tpratyeva tishthati yasyaujasvatiruttarata
    ojasvyeva bhavatya 'syaujasvi jayate 'rko va esha yadagnistasyaitadeva stotrametacchastram 'rka eva
    tadarkyamanu vi dhiyate 'ttyannama nnado jayate yasyaisha vidha vidhiyate ya u cainamevam ve~da srishtirupa
    dadhati yathasrishtamevava rundhe na va ida ndiva na naktamasidavyavritta nte deva eta vyushtirapashya
    nta upadadhata tato va idam ~vyau dyasyaita upadhiyante vyevasma ucchatyatho tama evapahate || ssapatnaniti
    purastadupa dadhati jataneva bhratrivya npranudate sahasa jataniti pashcajjanishyamananeva prati nudate
    catushcatvarigmsha sstoma iti dakshinato brahmavarcasam vai~ catushcatvarigmsho brahmavarcasameva
    dakshinato dhatte tasma sstoma ityuttarata ojo vai shodasha oja evottarato dhatte tasma 'bhiprayayi
    jayati vajro vai catushcatvarigmsho vajrah shodasho yadete ishtake upadadhati jatag shcaiva janishyamanag
    npranudya vajramanu praharati strityai purishavati mmaddhya upadadhati purisham 'mushmin ~loke bhavati
    ya evam ve~daita va asapatna nameshtaka yasyaita upadhiyante 'sya sapatno bhavati pashurva esha yadagnirviraja
    uttamaya ncityamupa dadhati virajamevottama mpashushu dadhati tasma va~dati dashadashopa dadhati saviryatvaya
    'kshnayopa dadhati tasmadakshnaya pashavo 'ngani praharanti pratishthityai yani vai chandagmsi suvargya
    'tapyanta tani tapasa ntebhya eta ishtaka niramimatevashchando varivashchanda iti ta upadadhata tabhirvai
    te suvargam yadeta ishtaka upadadhati yanyeva chandagmsi suvargyani taireva yajamana lo~kameti yajnena
    vai prajapatih praja asrijata ta stoma bhaga upadadhati thstoma bhaga upadadhati praja eva ta ssrijate
    brihaspatirva eta thstomabhaga upadadhati satejasamevagni ncinute brihaspatirva etam ya~jnasya pratishthamapashyadya
    thstomabhaga upadadhati yajnasya pratishthityai saptasaptopa dadhati saviryatvaya tisro maddhye pratishthityai
    || uttarato dhatte tasma rashmirityeva ''dityamasrijata pretiriti dharmamanvitiriti divagm sadhimrityantariksha
    mpratidhiriti prithivim vi~shtambha iti vrishti mpravetyaharanuveti ratrimushigiti vasu npraketa iti
    rudran thsuditirityadityanoja iti pitrig stanturiti prajah pritanashaditi pashu shadhirabhijidasi
    yuktagrave indraya tvendra ndraya tvendra njinvetyeva dakshinato vajra mparyauhadabhijityai tah praja
    apaprana asrijata tasvadhipatirasityeva pranamadadha dyantetyapanagm sagmsarpa iti cakshurvayodha
    iti shrotra ntah prajah pranatirapanatih pashyanti shshrinvatirna mithuni abhava ntasu trivridasityeva
    mithunamadadha ttah praja mithuni bhavantirna prajayanta ta ttah prajah prajata na pratyatishtha 'si
    veshashrirasi vasyashtirasityevaishu lokeshu pratyasthapayadyadaha vasuko 'si veshashrirasi vasyashtirasiti
    praja eva prajata eshu lokeshu pratishthapayati satma 'ntarikshagm rohati saprano 'mushmin ~loke prati
    tishthatyavyardhukah pranapanabhya nakasadbhirvai deva ya~nnakasada upadadhati nakasadbhireva ta lo~kameti
    suvargo vai loko nako yasyaita upadhiyante nasma aka vai~ nakasado yannakasada upadadha dyajamanah
    kurute prishthanam ya~nnakasado yannakasada upadadhati prishthanameva upadadhati prishthanameva tejo
    'va rundhe pancacoda upa dadhatyaphsarasa evainameta bhuta amushmin ~loka upa shere 'tho tanupanirevaita
    yajamanasya ya ttamupadadhaddhyayedetabhya evaina bhya a vrishcati tajagartimarcchatyuttara nakasadbhya
    upadadhati yatha jayamaniya griheshu nishadayati tadrigeva ta muttamamupa dadhati tasma tpraci patnyanva
    ttame upa dadhati prano vai svayamatrinna ''yurvikarni prana ''yushca prananamuttamau dhatte tasma
    ''yushca prananamuttamau nanyamuttaramishtakamupa daddhya nca yajamanasya ca prana ''yushcapi daddhya
    nyottareshtakopadheya svayamatrinnamupa dadhatyasau vai svayamatrinna 'mumevopa dhatte 'shvamupa ghrapayati
    pranamevasya prajapatyo va ashvah prajapatinaivagni ncinute svayamatrinna bhavati prananamuthsrishtya
    atho suvargasya lokasya 'nukhyatya esha vai devanam dvikarnimupadadhati devanameva vikra ntimanu vikramata
    uttarata upadadhati tasmaduttarata upacaro 'gni rvayumati bhavati samiddhyai || ya~nnakasado yannakasada
    chandagsyupa dadhati pashavo vai chandagmsi pashunevava rundhe chandagmsi vai devanam mpashavo vamameva
    pashunava rundha etagm ha vai yajnasena ncakara taya vai sa pashunavarundha yadetamupadadhati pashunevava
    rundhe gayatrih purastadupa dadhati tejo vai gayatri teja eva mukhato dhatte murdhanvati rbhavanti
    murdhanamevainagm samanana nkaroti trishtubha upa dadhatindriyam vai~ trishtugindriyameva maddhyato
    dhatte jagatirupa dadhati jagata vai pashavah pashunevava rundhe 'nushtubha upa dadhati prana va anushtup
    prananamuthsrishtyai brihatirushnihah panktiraksharapanktiriti vishurupani chandagsyupa dadhati vishurupa
    vai pashavah pashava chandagmsi vishurupaneva shchandagmsi vishurupaneva pashunava rundhe vishurupamasya
    grihe drishyate yasyaita upadhiyante ya u caina evam 'ticchandasamupa dadhatyaticchanda vai sarvani
    chandagmsi sarvebhirevaina nchandobhishcinute var shma va esha chandasam ya~daticchanda yadaticchandasa
    shmaivainagm samanana nkaroti dvipada upa dadhati dvipa dyajamanah pratishthityai || thsayujo nopadaddhya
    ddevata asyagnim tyatmanaivainagm sayuja ncinute nagnina vyriddhyate ssantata evamevaitabhiragni ssantato
    'gnina vai deva nta amuh krittika abhavan yasyaita upa dhiyante suvargameva lokameti gacchati prakasha
    ncitrameva bhavati mandaleshtaka upa dadhatime vai loka mandaleshtaka ime khalu vai loka devapura
    devapura eva pravishati na ''rtimarcchatyagni ncikyano vishvajyotisha upa dadhatimanevaitabhi rlokan
    jyotishmatah kurute prananevaita yajamanasya daddhratyeta vai devata vrishtisanirupa dadhati vrishtimevava
    rundhe yadekadhopadaddhyadekamritum shedanupariharagm sadayati tasma rasityahaitadvai vrishtyai rupagm
    rupenaiva vrishtimava rundhe sam ya~nibhirvai deva iman ~lokan ya~nirupadadhati yatha mevaitabhi ryajamana
    iman ~lokan ya~ti plavo va esho ya~nirupadadhati plavamevaitamagnaya upadadhatyuta yasyaitasupahitasvapo
    'gnigm harantyahrita evasya gniradityeshtaka upa dadhatyaditya va eta mbhutyai pratinudante yo nna
    prapnotyaditya prapnotyadityah ngamayantyasau va etasya ''dityo rucama datte yo ncitva na rocate yadadityeshtaka
    upadadha vasminnadityo ruca 'sau devanagm rocata evamevaisha manushyanagm rocate ghriteshtaka upa
    dadhatyetadva agneh priya tyatho tejasa 'nupariharagm sadaya ntejo dadhati prajapatiragnimacinuta
    sa yashasa vya rdhyata sa eta yashoda apashya tta upadhatta tabhirvai sa yasha atmannadhatta yadyashoda
    upadadhati yasha eva tabhiryajamana atma ndhatte pancopa dadhati panktah purusho yavaneva purushastasmin
    yasho dadhati || praprotyaditya ya~tta asan kaniyagmso deva asa 'suraste deva eta ishtaka apashya
    nta upadadhata bhuyaskridasityeva bhuyagmso npracyasiti praci ndishamajayannurdhva 'sityamumajaya
    nnantarikshasadasyantarikshe sidetya 'sura yasyaita upadhiyante bhuyaneva bhavatyabhiman ~lokan jayati
    bhavatyatmana para 'sya bhratrivyo bhavatyaphsushadasi shyenasadasityahaitadva agne rupagm rupenaivagnimava
    rundhe prithivyastva dravine sadayami tyahemanevaitabhi ndravinavatah kuruta ayushya upa dadhatyayureva
    ndadhatyagne yatte paragm hrinnametyahaitadva agneh priya ndhama priyamevasya dhamopa ''pnoti tavehi
    sagm rabhavaha ityaha vyevainena pari dhatte pancajanyeshvapye ddhyagna ityahaisha va agnih pancajanyo
    yah pancacitika stasmadevamahartavya upa dadhatyetadva rituna ndhama yadritavya ritunameva priya ndhamava
    rundhe sumeka ityaha sam va~thsaro vai sumekah sam va~thsarasyaiva priya prajapaterakshyashvaya ntaddeva
    ashvamedhenaiva pratyadadhuresha vai prajapatigm sarva 'shvamedhena yajate sarva eva bhavati sarvasya
    va esha prayashcitti ssarvasya bheshajagm sarvam va~ etena papmana ndeva atarannapi va etena brahmahatya
    ntarati tarati brahmahatyam 'shvamedhena yajate ya u cainamevam tprajapaterakshyashvaya ttasmadashvasyottarato
    'va dyanti dakshinato vai~tasah kato bhavatyaphsuyonirva ashvo yo~nau pratishthapayati catushtoma
    sstomo bhavati saraddha va ashvasya sakthya ddevashcatushtomenaiva pratyadadhuryaccatushtoma sstomo
    bhavatyashvasya sarvatvaya || deva va akshnayastomiya rdevasurah kaniyagmsah || harih om || || krishna
    yajurvediya taittiriya samhitaya mpancamakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे तृतीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ उ॒थ्स॒न्न॒ य॒ज्ञो वा ए॒ष यद॒ग्निः किं ऽहै॒तस्य॑ क्रि॒यते॒ किं वाँ॒ न यद्वै य॒ज्ञस्य॑ क्रि॒यमा॑णस्या
    न्त॒र्यन्ति॒ पूय॑ति॒ वा अ॑स्य॒ तदा श्वि॒नीरुप॑ दधात्य॒श्विनौ॒ वै दे॒वाना म्भि॒षजौ॒ ताभ्या॑मे॒वास्मै॑
    भेष॒ज ङ्क॑रोति॒ पञ्चोप॑ दधाति॒ पाङ्क्तो॑ य॒ज्ञो यावा॑ने॒व य॒ज्ञस्तस्मै॑ भेष॒ज ङ्क॑रोत्यृत॒व्या॑ उप॑
    दधात्यृतू॒ना पञ्चोप॑ दधाति॒ पञ्च॒ वा ऋ॒तवो॒ याव॑न्त ए॒वर्तव॒स्तान् क॑ल्पयति समा॒नप्र॑भृतयो भवन्ति
    समा॒नोद॑र्का॒स्तस्मा थ्समा॒ना ऋ॒तव॒ एके॑न प॒देन॒ व्याव॑र्तन्ते॒ तस्मा॑द् ऋ॒तवो॒ व्याव॑र्तन्ते प्राण॒भृत॒
    उप॑ दधात्यृ॒तुष्वे॒व प्रा॒णा र्य॒न्त्यथो॒ प्रज॑नयत्ये॒वैना॑ने॒ष वै वा॒युर्य ऋ॑त॒व्या॑ उप॒धाय॑ प्राण॒भृत॑
    थ्सर्वा॑नृ॒तूननु॑ वा॒युरा व॑रीवर्ति वृष्टि॒सनी॒रुप॑ दधाति॒ वृष्टि॑मे॒वाव॑ रुन्धे॒ यदे॑क॒धोप॑द॒द्ध्या
    षेदनुपरि॒हारग्ं॑ सादयति॒ तस्मा॒ त्प्रा॑ण॒भृत॑ उप॒धाय॑ वृष्टि॒सनी॑रुप॒दधा॑ति॒ तस्मा द्वा॒युप्र॑च्युता
    दि॒वो वृष्टि॑रीर्ते प॒शवो॒ वै व॑य॒स्या॑ नाना॑मनसः॒ खलु॒ वै प॒शवो॒ नाना स्स्या॒दिति॑ वय॒स्या प॒धाया॑प॒स्या॑
    उप॑ दद्ध्या॒ मे॒वास्मै॑ प॒शुभिः॑ करोत्यप॒शुरे॒व भ॑वति॒ य स्तस्यो॑प॒धाय॑ वय॒स्या॑ उप॑ दद्ध्या ज्ञान॑मे॒वास्मै॑
    प॒शुभिः॑ करोति पशु॒माने॒व भ॑वति॒ चत॑स्रः पु॒रस्ता॒दुप॑ दधाति॒ तस्मा च्च॒त्वारि॒ चक्षु॑षो रू॒पाणि॒
    द्वे शु॒क्ले द्वे कृ॒ष्णे न्मू॒र्धा पञ्च॒ दक्षि॑णाया॒ग्॒ श्रोण्या॒मुप॑ दधाति॒ पञ्चोत्त॑रस्या॒ त्प्रवणः
    प॒शुर्ब॒स्तो वय॒ इति॒ दक्षि॒णे ऽग्ंस॒ उप॑ दधाति वृ॒ष्णिर्वय॒ इत्युत्त॒रे ऽग्ंसा॑वे॒व प्रति॑ दधाति
