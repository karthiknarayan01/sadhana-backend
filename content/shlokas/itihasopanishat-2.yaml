id: itihasopanishat-2
category: upanishad
name:
  english: itihasopanishat
  devanagari: इतिहासोपनिषत्
content:
  english: parayanan || satyam vadantyanritamudvahanti kshiram pibanti madhu te pibanti | somam pibantyamritena
    sardham mrityoh parastadamrita bhavanti || ye brahmana brahmacaryam carantyatho khalvahurvedasammito'yamitihasah
    || dharmam carati nadharmam satyam vadati nanritam | dirgham pashyati ma hrasvam param pashyati ma'param
    || rico ha yo veda sa veda devan yajumshi yo veda sa veda yajnam | samani yo veda sa veda sarvam yo
    manasam veda sa veda brahma || yah krauddhavyena kruddhastishthati so'tivacam ca dikshayati | yo'tivacam
    nayati sa vai sarvam dvijah khalu manasam vedeti nah shrutam || tapo'vadhih parama brahmanasya shraddha
    mata pitaram satyamahuh | yoga atma caranamasya bandhurdamah pratishtha vidusho na bhumim || duhkham
    janma jara duhkham duhkham mrityuh punah punah | samsaramandalam duhkham pacyante yatra jantavah ||
    yo brahmanah papakrit mantrakricca sa jivati | brahmanyo brahmakricchashvat brahmaloke mahiyate ||
    trinani hicchanti kushatvameva vriksha yupatvam pashavashca gotvam | sarvah praja brahmanatvam narendra
    na brahmanatvat paramasti kincit || shatahavashatasharah shatashakrarijishinam | shatam brahma tapasvinam
    kupo'ranyasya tishthati || ritenapihita guha shrutenapihita guha | smritenapihita guha shamenapihita
    guha || damenapihita guha satyenapihita guha | atmanapihita guha brahmanapihita guha || brahmannidhim
    manasa vedayantah pashyanto guhyamaparam param ca | anadhvaga adhvasu parayishnavah brahmanastu sadrishah
    suryena || yah cchraddhani kurute'samgatani na devayanena patha sa yati | parimuktam pippalam bandhanadiva
    svargallokaccyavate'shraddhamitrah || yo yajnasya prasadhanah tanturdeveshvahutah | tamahutamashimahi
    | navedavinmanutedam brihantam | sarvanubhumatmana~ samparaye | esha nityo mahima brahmanasya | na
    karmana vardhate no kaniyan | tasyaivatma padavittam viditva | na karmana lipyate papakena || agnihotram
    balivriddhah kale catithiragatah | balashca kulavriddhashca nirdahantyavamanitah || sambhojani nama
    pishacabhiksha naisha pitrin gacchati nota devan | ihaiva sa carati kshinapunya shalantare gauriva
    nashtavatsa || shudrayam srijate retah shraddham bhuktva'tha yo dvijah | sa shudrayonisanchinnam retasa
    sincate pitrin || yah kamamohitah shudryam putramutpadyate dvijah | yavadutpadyate bhumau tavattishthet
    sudarune || ashrotriyam brahmanam bhojayanasya shodasha shraddhani pitaro na bhunjate | tato nirashah
    pitaro bhavanti sendrah sma devah praharanti vajram || yavatah khalu pindan sa prashnanti havisho
    nricah | tavatah shulan grasati prapya vaivasvatam yamam | | chindanti datrihastam ca jihvagramitarasya
    ca | mantraputam tu yacchraddhamamantraya prayacchati | | niyuktastu yatih shraddham deve va mamsamutsrijet
    | yavanti pashuromani tavannarakamricchati | | yatherine bijamuptam narendra nasya vapta labhate bijabhagam
    | evam shraddhamapratishthitam vinashyati | | shraddham dattva ca bhuktva ca sangamam na samacaret
    | pitarastasya tanmasam bhavante retabhojanah | | shraddham dattva ca bhuktva ca sapanktih sahabhojanam
    | shanmasan pitaro'shnanti karturucchishtabhojanam | | shraddham bhuktva punah shraddham bhunjiyallobhamohitah
    | nashtam bhavati tacchraddham rauravam narakam vrajet | | shraddham dattva ca bhuktva ca bharamudvahate
    dvijah | pitarastasya tanmasam bhavante bharapiditah | | shraddham dattva ca bhuktva ca adhvanam yo'dhigacchati
    | pitarastasya tanmasam bhavante pamsubhojanah | | anagnikasya vedo'gnirvedahino'pyanagnikah | sagniko'pyanadhitah
    syat sa esho'nagnikah smritah || strishudrabalishadibhya ucchishtam na pradapayet | yadi dadyat pramadena
    na tadgacchati tan pitrin || ahitagnih sada patram sada patram tu vedavit | patranamuttamam patram
    shudrannam yasya nodare || punarbhojanamadhvanam bharadhyayanasangamam | danam pratigraham homam shraddhabhukcashta
    varjayet || dantadhavanatambulam nakhakeshanikrintanam | karta caiva tu purvedyurbhokta caiva pare'hani
    || dantadhavanatambulam kshaurabhyanganabhojanam | ratyaushadhaparannam ca shraddhakarta vivarjayet
    || shraddhakarta parashraddham yastu bhunjita lolupah | nashtam bhavati tacchraddham rauravam narakam
    vrajet || nimantrite'dhvanagate punarbhuktva tu vayasam | karoti karma yat gridhrah gramasukarasangamat
    || pratigraheshu daridryam danam nishphalameva ca | home tu kushtharogi syat svadhyayairmrityumapnuyat
    || yasyanricastu bhunkte tasya viddhi brahmaiva vittam purushasya kevalam | dharmah svadhayam carate
    dadati ca satyam rasah svadutamo rasanam | satyam shraishthyam vyahritinam tathaiva prajnanam saptamam
    jivananam || brahmanatikramo nasti murkho mantram vivarjayet | jvalantamagnimutsrijya na hi bhasmani
    huyate || yah shatam ca sahasranam sahasram shraddha acaret | ekasmanmantravit putah sarvamarhati
    brahmanah || brahmananam sahasreshu bhuktva tu nava sapta ca | bhavanti jnayike bhutva dhyayike ca
    na samshayet | | kukshau tishthati yasyannam vedabhyasena jiryate | kulam tarayate tesham dashapurvam
    dashaparam || brahmano dvipadam varah | catushpadam gauruttama | lohanam kancanam varam | tileshu
    tailam dadhiniva sarpih | dapassrotassaranyorivagnih | evamatmatmani jayate | | satyenainam manasa
    sadhu pashyati satyenainam manasa vacam nayati | | pranmukhashca sura havyam pitarashcapyudanmukhah
    | pratigrihnanti sambadhamagnina brahmanena ca || vedadhyayiti yo viprah satatam brahmanah sthitah
    | sacarah sagnihotri ca so'gnirvai kavyavahanah | | vikiram prakiram dadyadvikiram ha vai prakiram
    bhunjita | triptirupani darshayan | | parishrite tveva dadyaddhlika hi pitarah smritah | kravyadah
    pitarassarve tilajyotirghritapriyah || deshakalapatramantrashtashaucepsah krishnapakshakshayotsavah
    | | ucchishtam shivanirmalyam vamanam mritakarpatam | shraddhe sapta pavitrani dauhitrah kutapastilah
    | | trini shraddhe pavitrani dauhitrah kutapastilah | trini catra prashamsanti shaucamakrodhamatsarah
    | | divasasyashtame bhage yada mandayate ravih | sa kalah kutapo nama pitrinam dattamakshayam | |
    arabhya kutape shraddham kuryadarohanam budhah | vidhijna vidhimasthaya rauhinim naiva langhayet ||
    rauhinim langhayedyastu jnanadajnanato'pi va | asuram tadbhavecchraddham pitrinam nopatishthate ||
    yatudhanashca rakshamsi pishaca asurastatha | ete haranti vai shraddham daivam yatra nivartayet ||
    rakshasam bhavati shraddham daivam yatra nivartayet | tatra rakshamsi paishaca na ca vidveshti yo
    janah || puro devah prapadyante pashcaddevam visarjayet | pakshaistu kukkuto hanti nikarshena tu sukarah
    | agatam gataya shvanam cakshusha vrishalipatih || yasya desham na janati namagotre tripurusham |
    kanyadanam pitrishraddham namaskaram ca varjayet || yasya vedashca vedi ca vicchidyete tripurusham
    | sa vai durbrahmano nama sarvakarmabahishkritah || ashtavarsha bhavet kanya navavarsha tu rohini
    | dashavarsha bhavet gauri hyata urdhvam rajasvala || pitrigeheshu ya kanya rajah pashyatyasamskrita
    | sa kanya vrishali nama tatpatirvrishalipatih || vrishalipatibhuktani shraddhani ca havimshi ca |
    pitaro na pratigrihnanti data svargam na gacchati || mahishityucyate bharya bhagenoparjitam dhanam
    | taddravyamupajivan yah sa vai mahishikah smritah || samargham dhanamuddhritya mahargham yah prayacchati
    | sa vai vardhushiko nama brahmavadishu garhitah ||
  devanagari: परायणन् ।। सत्यं वदन्त्यनृतमुद्वहन्ति क्षीरं पिबन्ति मधु ते पिबन्ति । सोमं पिबन्त्यमृतेन
    सार्धं मृत्योः परस्तादमृता भवन्ति ।। ये ब्राह्मणा ब्रह्मचर्यं चरन्त्यथो खल्वाहुर्वेदसंमितोऽयमितिहासः
    ।। धर्मं चरति नाधर्मं सत्यं वदति नानृतम् । दीर्घं पश्यति मा ह्रस्वं परं पश्यति माऽपरम् ।। ऋचो ह यो
    वेद स वेद देवान् यजूंषि यो वेद स वेद यज्ञम् । सामानि यो वेद स वेद सर्वं यो मानसं वेद स वेद ब्रह्म
    ।। यः क्रौद्धव्येन क्रुद्धस्तिष्ठति सोऽतिवाचं च दीक्षयति । योऽतिवाचं नयति स वै सर्वं द्विजः खलु मानसं
    वेदेति नः श्रुतम् ।। तपोऽवधिः परमा ब्राह्मणस्य श्रद्धा माता पितरं सत्यमाहुः । योग आत्मा चरणमस्य बन्धुर्दमः
    प्रतिष्ठा विदुषो न भूमिम् ।। दुःखं जन्म जरा दुःखं दुःखं मृत्युः पुनः पुनः । संसारमण्डलं दुःखं पच्यन्ते
    यत्र जन्तवः ।। यो ब्राह्मणः पापकृत् मन्त्रकृच्च स जीवति । ब्रह्मण्यो ब्रह्मकृच्छश्वत् ब्रह्मलोके महीयते
    ।। तृणानि हीच्छन्ति कुशत्वमेव वृक्षा यूपत्वं पशवश्च गोत्वम् । सर्वाः प्रजा ब्राह्मणत्वं नरेन्द्र न
    ब्राह्मणत्वात् परमस्ति किञ्चित् ।। शताहावशतशरः शतशक्रऋजीषिणाम् । शतं ब्रह्म तपस्विनां कूपोऽरण्यस्य
    तिष्ठति ।। ऋतेनापिहिता गुहा श्रुतेनापिहिता गुहा । स्मृतेनापिहिता गुहा शमेनापिहिता गुहा ।। दमेनापिहिता
    गुहा सत्येनापिहिता गुहा । आत्मनापिहिता गुहा ब्रह्मणापिहिता गुहा ।। ब्रह्मन्निधिं मनसा वेदयन्तः पश्यन्तो
    गुह्यमपरं परं च । अनध्वगा अध्वसु पारयिष्णवः ब्राह्मणास्तु सदृशाः सूर्येण ।। यः च्छ्राद्धानि कुरुतेऽसंगतानि
    न देवयानेन पथा स याति । परिमुक्तं पिप्पलं बन्धनादिव स्वर्गाल्लोकाच्च्यवतेऽश्राद्धमित्रः ।। यो यज्ञस्य
    प्रसाधनः तन्तुर्देवेष्वाहुतः । तमाहुतमशीमहि । नावेदविन्मनुतेदं बृहन्तम् । सर्वानुभुमात्मानँ संपराये
    । एष नित्यो महिमा ब्राह्मणस्य । न कर्मणा वर्धते नो कनीयान् । तस्यैवात्मा पदवित्तं विदित्वा । न कर्मणा
    लिप्यते पापकेन ।। अग्निहोत्रं बलीवृद्धाः काले चातिथिरागतः । बालाश्च कुलवृद्धाश्च निर्दहन्त्यवमानिताः
    ।। संभोजनी नाम पिशाचभिक्षा नैषा पितॄन् गच्छति नोत देवान् । इहैव सा चरति क्षीणपुण्या शालान्तरे गौरिव
    नष्टवत्सा ।। शूद्रायां सृजते रेतः श्राद्धं भुक्त्वाऽथ यो द्विजः । स शूद्रयोनिसञ्छिन्नं रेतसा सिञ्चते
    पितॄन् ।। यः काममोहितः शूद्र्यां पुत्रमुत्पाद्यते द्विजः । यावदुत्पाद्यते भूमौ तावत्तिष्ठेत् सुदारुणे
    ।। अश्रोत्रियं ब्राह्मणं भोजयानस्य षोडश श्राद्धानि पितरो न भुञ्जते । ततो निराशाः पितरो भवन्ति सेन्द्राः
    स्म देवाः प्रहरन्ति वज्रम् ।। यावतः खलु पिण्डान् स प्राश्नन्ति हविषो नृचः । तावतः शूलान् ग्रसति प्राप्य
    वैवस्वतं यमम् । । छिन्दन्ति दातृहस्तं च जिह्वाग्रमितरस्य च । मन्त्रपूतं तु यच्छ्राद्धममन्त्राय प्रयच्छति
    । । नियुक्तस्तु यतिः श्राद्धं देवे वा मांसमुत्सृजेत् । यावन्ति पशुरोमाणि तावन्नरकमृच्छति । । यथेरिणे
    बीजमुप्तं नरेन्द्र नास्य वप्ता लभते बीजभागम् । एवं श्राद्धमप्रतिष्ठितं विनश्यति । । श्राद्धं दत्त्वा
    च भुक्त्वा च सङ्गमं न समाचरेत् । पितरस्तस्य तन्मासं भवन्ते रेतभोजनाः । । श्राद्धं दत्त्वा च भुक्त्वा
    च सपङ्क्तिः सहभोजनम् । षण्मासान् पितरोऽश्नन्ति कर्तुरुच्छिष्टभोजनम् । । श्राद्धं भुक्त्वा पुनः श्राद्धं
    भुञ्जीयाल्लोभमोहितः । नष्टं भवति तच्छ्राद्धं रौरवं नरकं व्रजेत् । । श्राद्धं दत्त्वा च भुक्त्वा च
    भारमुद्वहते द्विजः । पितरस्तस्य तन्मासं भवन्ते भारपीडिताः । । श्राद्धं दत्त्वा च भुक्त्वा च अध्वानं
    योऽधिगच्छति । पितरस्तस्य तन्मासं भवन्ते पांसुभोजनाः । । अनग्निकस्य वेदोऽग्निर्वेदहीनोऽप्यनग्निकः ।
    साग्निकोऽप्यनधीतः स्यात् स एषोऽनग्निकः स्मृतः ।। स्त्रीशूद्रबालिशादिभ्य उच्छिष्टं न प्रदापयेत् । यदि
    दद्यात् प्रमादेन न तद्गच्छति तान् पितॄन् ।। आहिताग्निः सदा पात्रं सदा पात्रं तु वेदवित् । पात्राणामुत्तमं
    पात्रं शूद्रान्नं यस्य नोदरे ।। पुनर्भोजनमध्वानं भाराध्ययनसङ्गमम् । दानं प्रतिग्रहं होमं श्राद्धभुक्चाष्ट
    वर्जयेत् ।। दन्तधावनताम्बूलं नखकेशनिकृन्तनम् । कर्ता चैव तु पूर्वेद्युर्भोक्ता चैव परेऽहनि ।। दन्तधावनताम्बूलं
    क्षौराभ्यङ्गनभोजनम् । रत्यौषधपरान्नं च श्राद्धकर्ता विवर्जयेत् ।। श्राद्धकर्ता परश्राद्धं यस्तु भुञ्जीत
    लोलुपः । नष्टं भवति तच्छ्राद्धं रौरवं नरकं व्रजेत् ।। निमन्त्रितेऽध्वानगते पुनर्भुक्त्वा तु वायसम्
    । करोति कर्म यत् गृध्रः ग्रामसूकरसङ्गमात् ।। प्रतिग्रहेषु दारिद्र्यं दानं निष्फलमेव च । होमे तु कुष्ठरोगी
    स्यात् स्वाध्यायैर्मृत्युमाप्नुयात् ।। यस्यानृचस्तु भुङ्क्ते तस्य विद्धि ब्रह्मैव वित्तं पुरुषस्य
    केवलम् । धर्मः स्वधायां चरते ददाति च सत्यं रसः स्वादुतमो रसानाम् । सत्यं श्रैष्ठ्यं व्याहृतीनां तथैव
    प्रज्ञानं सप्तमं जीवनानाम् ।। ब्राह्मणातिक्रमो नास्ति मूर्खो मन्त्रं विवर्जयेत् । ज्वलन्तमग्निमुत्सृज्य
    न हि भस्मनि हूयते ।। यः शतं च सहस्राणां सहस्रं श्राद्ध आचरेत् । एकस्मान्मन्त्रवित् पूतः सर्वमर्हति
    ब्राह्मणः ।। ब्राह्मणानां सहस्रेषु भुक्त्वा तु नव सप्त च । भवन्ति ज्ञायिके भूत्वा ध्यायिके च न संशयेत्
    । । कुक्षौ तिष्ठति यस्यान्नं वेदाभ्यासेन जीर्यते । कुलं तारयते तेषां दशपूर्वां दशापराम् ।। ब्राह्मणो
    द्विपदां वरः । चतुष्पदां गौरुत्तमा । लोहानां काञ्चनं वरम् । तिलेषु तैलं दधिनीव सर्पिः । दापस्स्रोतस्सरण्योरिवाग्निः
    । एवमात्मात्मनि जायते । । सत्येनैनं मनसा साधु पश्यति सत्येनैनं मनसा वाचं नयति । । प्राङ्मुखाश्च सुरा
    हव्यं पितरश्चाप्युदङ्मुखाः । प्रतिगृह्णन्ति संबाधमग्निना ब्राह्मणेन च ।। वेदाध्यायीति यो विप्रः सततं
    ब्राह्मणः स्थितः । साचारः साग्निहोत्री च सोऽग्निर्वै कव्यवाहनः । । विकिरं प्रकिरं दद्याद्विकिरं ह
    वै प्रकिरं भुञ्जीत । तृप्तिरूपाणि दर्शयन् । । परिश्रिते त्वेव दद्याद्ध्लीका हि पितरः स्मृताः । क्रव्यादाः
    पितरस्सर्वे तिलज्योतिर्घृतप्रियाः ।। देशकालपात्रमन्त्राष्टशौचेप्साः कृष्णपक्षक्षयोत्सवाः । । उच्छिष्टं
    शिवनिर्माल्यं वमनं मृतकर्पटम् । श्राद्धे सप्त पवित्राणि दौहित्रः कुतपस्तिलाः । । त्रीणि श्राद्धे पवित्राणि
    दौहित्रः कुतपस्तिलाः । त्रीणि चात्र प्रशंसन्ति शौचमक्रोधमत्सराः । । दिवसस्याष्टमे भागे यदा मन्दायते
    रविः । स कालः कुतपो नाम पितॄणां दत्तमक्षयम् । । आरभ्य कुतपे श्राद्धं कुर्यादारोहणं बुधः । विधिज्ञा
    विधिमास्थाय रौहिणीं नैव लङ्घयेत् ।। रौहिणीं लङ्घयेद्यस्तु ज्ञानादज्ञानतोऽपि वा । आसुरं तद्भवेच्छ्राद्धं
    पितॄणां नोपतिष्ठते ।। यातुधानाश्च रक्षांसि पिशाचा असुरास्तथा । एते हरन्ति वै श्राद्धं दैवं यत्र निवर्तयेत्
    ।। राक्षसं भवति श्राद्धं दैवं यत्र निवर्तयेत् । तत्र रक्षांसि पैशाचा न च विद्वेष्टि यो जनः ।। पुरो
    देवाः प्रपद्यन्ते पश्चाद्देवं विसर्जयेत् । पक्षैस्तु कुक्कुटो हन्ति निकर्षेण तु सूकरः । आगतं गतया
    श्वानं चक्षुषा वृषलीपतिः ।। यस्य देशं न जानाति नामगोत्रे त्रिपूरुषम् । कन्यादानं पितृश्राद्धं नमस्कारं
    च वर्जयेत् ।। यस्य वेदश्च वेदी च विच्छिद्येते त्रिपूरुषम् । स वै दुर्ब्राह्मणो नाम सर्वकर्मबहिष्कृतः
    ।। अष्टवर्षा भवेत् कन्या नववर्षा तु रोहिणी । दशवर्षा भवेत् गौरी ह्यत ऊर्ध्वं रजस्वला ।। पितृगेहेषु
    या कन्या रजः पश्यत्यसंस्कृता । सा कन्या वृषली नाम तत्पतिर्वृषलीपतिः ।। वृषलीपतिभुक्तानि श्राद्धानि
    च हवींषि च । पितरो न प्रतिगृह्णन्ति दाता स्वर्गं न गच्छति ।। महिषीत्युच्यते भार्या भगेनोपार्जितं धनम्
    । तद्द्रव्यमुपजीवन् यः स वै माहिषिकः स्मृतः ।। समर्घं धनमुद्धृत्य महार्घं यः प्रयच्छति । स वै वार्धुषिको
    नाम ब्रह्मवादिषु गर्हितः ।।
