id: jinadevadarshanastotram
category: stotram
name:
  english: jinadevadarshanastotram
  devanagari: जिनदेवदर्शनस्तोत्रम्
content:
  english: jinadevadarshanastotram darshanam devadevasya darshanam papanashanam | darshanam svargasopanam
    darshanam mokshasadhanam || 1|| darshanena jinendranam sadhunam vandanena ca | na ciram tishthate
    papam chidrahaste yathodakam || 2|| vitaragamukham drishtva padmaragasamaprabham | janmajanmakritam
    papam darshanena vinashyati || 3|| darshanam jinasuryasya samsara
  devanagari: जिनदेवदर्शनस्तोत्रम् दर्शनं देवदेवस्य दर्शनं पापनाशनम् । दर्शनं स्वर्गसोपानं दर्शनं मोक्षसाधनम्
    ॥ १॥ दर्शनेन जिनेन्द्राणां साधूनां वन्दनेन च । न चिरं तिष्ठते पापं छिद्रहस्ते यथोदकम् ॥ २॥ वीतरागमुखं
    दॄष्ट्वा पद्मरागसमप्रभम् । जन्मजन्मकृतं पापं दर्शनेन विनश्यति ॥ ३॥ दर्शनं जिनसूर्यस्य संसार
meaning: {}
