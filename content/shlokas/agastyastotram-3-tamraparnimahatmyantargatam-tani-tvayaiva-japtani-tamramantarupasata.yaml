id: agastyastotram-3-tamraparnimahatmyantargatam-tani-tvayaiva-japtani-tamramantarupasata
category: stotram
name:
  english: agastyastotram 3 (tamraparnimahatmyantargatam tani tvayaiva japtani tamramantarupasata)
  devanagari: अगस्त्यस्तोत्रम् ३ (ताम्रपर्णीमाहात्म्यान्तर्गतम् तानि त्वयैव जप्तानि ताम्रामन्तरुपासता)
content:
  english: agastyastotram 3 tani tvayaiva japtani tamramantarupasata | ityuktva harshasantushtah tushtava
    jagatiguruh || 59|| namah paramakalyananidhaye vitaragine | lopamudrasametaya kumbhodbhutaya yogine
    || 60|| punyayai punyabhutayai putryai malayabhubhritah | sarvatirthasvarupayai tamraparnyai namo
    namah || 61|| ya pancakrityanadeva kujjapancitadurdasha | tamadilakshmim kshemaya sakshanmokshapradam
    namah || 62|| ekatra shyamalakara ekatah candrapanduram | umaramapatim devam vande hariharakritim
    || 63|| tamram malayashailendramadilakshmim haripriyam | lopamudramagastyam ca nityamantahsmaramyaham
    || 64|| iti tamraparnimahatmye 62
  devanagari: अगस्त्यस्तोत्रम् ३ तानि त्वयैव जप्तानि ताम्रामन्तरुपासता । इत्युक्त्वा हर्षसन्तुष्टः तुष्टाव
    जगतीगुरुः ॥ ५९॥ नमः परमकल्याणनिधये वीतरागिणे । लोपामुद्रासमेताय कुम्भोद्भूताय योगिने ॥ ६०॥ पुण्यायै
    पुण्यभूतायै पुत्र्यै मलयभूभृतः । सर्वतीर्थस्वरूपायै ताम्रपर्ण्यै नमो नमः ॥ ६१॥ या पञ्चकृत्यनादेव कुज्जापाञ्चितदुर्दशा
    । तामादिलक्ष्मीं क्षेमाय साक्षान्मोक्षप्रदां नमः ॥ ६२॥ एकत्र श्यामलाकारा एकतः चन्द्रपण्डुरम् । उमारमापतिं
    देवं वन्दे हरिहराकृतिम् ॥ ६३॥ ताम्रां मलयशैलेन्द्रमादिलक्ष्मीं हरिप्रियाम् । लोपामुद्रामगस्त्यं च
    नित्यमन्तःस्मराम्यहम् ॥ ६४॥ इति ताम्रपर्णीमाहात्म्ये ६२
