id: saptamatrikritamdevistotram
category: stotram
name:
  english: saptamatrikritamdevistotram
  devanagari: सप्तमातृकृतंदेवीस्तोत्रम्
content:
  english: devim tam tushtuvurdurgamevam saptapi matarah || 52|| yoganidreti rupena vishnornayanapadmayoh
    | tvaya niliyate devi madhukaryeva lilaya || 53|| amumuhastam na tatha matashca madhukaitabhau | katham
    jaghana tau vishnustayorevabhyanujnaya || 54|| tvam kaushiki na cejjata mrityuh shumbhanishambhayoh
    | katham tu lokapalanamaishvaryam devi eshyati || 55|| vindhyavasini vindhyena kimavandhyam kritam
    tapah | yatra maitri kiratibhirapi labhya tvaya samam || 56|| kapishayanamapitam dhanadopayanikritam
    | tvayamba nitam daityanam rasairniyatamanavaih || 57|| brahmanah srishtishaktistvam sthitishaktirmadhudvishah
    | amba samharashaktishca rudrasyapi pragalbhase || 58|| yashodanandajata tvamekanamsheti namatah |
    kamsadyasurasamhare hareh sahyam karishyasi || 59|| tvam vidya tvam mahamaya tvam lakshmistvam sarasvati
    | tvam devi parvatishapi durge kim va na jayase || 3
  devanagari: देवीं तां तुष्टुवुर्दुर्गामेवं सप्तापि मातरः ॥ ५२॥ योगनिद्रेति रूपेण विष्णोर्नयनपद्मयोः
    । त्वया निलीयते देवि मधुकार्येव लीलया ॥ ५३॥ अमूमुहस्तं न तथा मातश्च मधुकैटभौ । कथं जघान तौ विष्णुस्तयोरेवाभ्यनुज्ञया
    ॥ ५४॥ त्वं कौशिकी न चेज्जाता मृत्युः शुम्भनिशम्भयोः । कथं तु लोकपालानामैश्वर्यं देवि एष्यति ॥ ५५॥
    विन्ध्यवासिनि विन्ध्येन किमवन्ध्यं कृतं तपः । यत्र मैत्री किरातीभिरपि लभ्या त्वया समम् ॥ ५६॥ कापिशायनमापीतं
    धनदोपायनीकृतम् । त्वयाम्ब नीतं दैत्यानां रसैर्नियतमानवैः ॥ ५७॥ ब्रह्मणः सृष्टिशक्तिस्त्वं स्थितिशक्तिर्मधुद्विषः
    । अम्ब संहारशक्तिश्च रुद्रस्यापि प्रगल्भसे ॥ ५८॥ यशोदानन्दजाता त्वमेकानंशेति नामतः । कंसाद्यसुरसंहारे
    हरेः साह्यं करिष्यसि ॥ ५९॥ त्वं विद्या त्वं महामाया त्वं लक्ष्मीस्त्वं सरस्वती । त्वं देवी पार्वतीशापि
    दुर्गे किं वा न जायसे ॥ ३
