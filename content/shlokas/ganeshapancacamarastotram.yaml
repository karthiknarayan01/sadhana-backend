id: ganeshapancacamarastotram
category: stotram
name:
  english: ganeshapancacamarastotram
  devanagari: गणेशपन्चचामरस्तोत्रम्
content:
  english: prasadabhak || 9|| chatratve vasata kashyam vihiteyam yatah stutih | tatashchatrairadhiteyam
    vaidushyam varddhayeddhiya || 10|| || iti shrikavipatyupanamaka
  devanagari: प्रसादभाक् ॥ ९॥ छात्रत्वे वसता काश्यां विहितेयं यतः स्तुतिः । ततश्छात्रैरधीतेयं वैदुष्यं
    वर्द्धयेद्धिया ॥ १०॥ ॥ इति श्रीकविपत्युपनामक
meaning: {}
