id: narayaniyam-dashaka-68
category: stotram
name:
  english: Narayaniyam Dashaka 68
content:
  english: tava vilokanadgopikajanah pramadasankulah pankajekshana | amritadharaya sampluta iva stimitatam
    dadhustvatpurogatah || || tadanu kacana tvatkarambujam sapadi grihnati nirvishankitam | ghanapayodhare
    sannidhaya sa pulakasamvrita tasthushi ciram || || tava vibho'para komalam bhujam nijagalantare paryaveshtayat
    | galasamudgatam pranamarutam pratinirundhativatiharshula || || apagatatrapa kapi kamini tava mukhambujat
    pugacarvitam | pratigrihayya tadvaktrapankaje nidadhati gata purnakamatam || || vikaruno vane samvihaya
    mamapagato'si ka tvamiha sprishet | iti saroshaya tavadekaya sajalalocanam vikshito bhavan || || iti
    muda''kulairvallavijanaih samamupagato yamune tate | mridukucambaraih kalpitasane ghusrinabhasure
    paryashobhathah || || katividha kripa ke'pi sarvato dhritadayodayah kecidashrite | katicididrisha
    madrisheshvapityabhihito bhavan vallavijanaih || || ayi kumarika naiva shankyatam kathinata mayi premakatare
    | mayi tu cetaso vo'nuvrittaye kritamidam mayetyucivan bhavan || || ayi nishamyatam jivavallabhah
    priyatamo jano nedrisho mama | tadiha ramyatam ramyayaminishvanuparodhamityalapo vibho || || iti giradhikam
    modamedurairvrajavadhujanaih sakamaraman | kalitakautuko rasakhelane gurupuripate pahi mam gadat ||
  devanagari: तव विलोकनाद्गोपिकाजनाः प्रमदसङ्कुलाः पङ्कजेक्षण । अमृतधारया सम्प्लुता इव स्तिमिततां दधुस्त्वत्पुरोगताः
    ॥ ॥ तदनु काचन त्वत्कराम्बुजं सपदि गृह्णती निर्विशङ्कितम् । घनपयोधरे सन्निधाय सा पुलकसंवृता तस्थुषी
    चिरम् ॥ ॥ तव विभोऽपरा कोमलं भुजं निजगलान्तरे पर्यवेष्टयत् । गलसमुद्गतं प्राणमारुतं प्रतिनिरुन्धतीवातिहर्षुला
    ॥ ॥ अपगतत्रपा कापि कामिनी तव मुखाम्बुजात् पूगचर्वितम् । प्रतिगृहय्य तद्वक्त्रपङ्कजे निदधती गता पूर्णकामताम्
    ॥ ॥ विकरुणो वने संविहाय मामपगतोऽसि का त्वामिह स्पृशेत् । इति सरोषया तावदेकया सजललोचनं वीक्षितो भवान्
    ॥ ॥ इति मुदाऽऽकुलैर्वल्लवीजनैः सममुपागतो यामुने तटे । मृदुकुचाम्बरैः कल्पितासने घुसृणभासुरे पर्यशोभथाः
    ॥ ॥ कतिविधा कृपा केऽपि सर्वतो धृतदयोदयाः केचिदाश्रिते । कतिचिदीदृशा मादृशेष्वपीत्यभिहितो भवान् वल्लवीजनैः
    ॥ ॥ अयि कुमारिका नैव शङ्क्यतां कठिनता मयि प्रेमकातरे । मयि तु चेतसो वोऽनुवृत्तये कृतमिदं मयेत्यूचिवान्
    भवान् ॥ ॥ अयि निशम्यतां जीववल्लभाः प्रियतमो जनो नेदृशो मम । तदिह रम्यतां रम्ययामिनीष्वनुपरोधमित्यालपो
    विभो ॥ ॥ इति गिराधिकं मोदमेदुरैर्व्रजवधूजनैः साकमारमन् । कलितकौतुको रासखेलने गुरुपुरीपते पाहि मां
    गदात् ॥
