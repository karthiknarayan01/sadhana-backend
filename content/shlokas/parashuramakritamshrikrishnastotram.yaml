id: parashuramakritamshrikrishnastotram
category: stotram
name:
  english: parashuramakritamshrikrishnastotram
  devanagari: परशुरामकृतंश्रीकृष्णस्तोत्रम्
content:
  english: parashuramakritam shrikrishnastotram parashuramuvaca | namo namah karanavigrahaya prapannapalaya
    surarttiharine | brahmeshavishnvindramukhastutaya nato'smi nityam parameshvaraya || 2
  devanagari: परशुरामकृतं श्रीकृष्णस्तोत्रम् परशुरामुवाच । नमो नमः कारणविग्रहाय प्रपन्नपालाय सुरार्त्तिहारिणे
    । ब्रह्मेशविष्ण्विन्द्रमुखस्तुताय नतोऽस्मि नित्यं परमेश्वराय ॥ २
meaning: {}
