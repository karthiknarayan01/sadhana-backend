id: someshvarapancakastotram
category: stotram
name:
  english: someshvarapancakastotram
  devanagari: सोमेश्वरपन्चकस्तोत्रम्
content:
  english: vishvam yatra bhavedvilinamakhilam tallingamasmin sada satyam jnanamanantamadvayamaho brahma
    sphutam drishyate | pancabrahmasulakshanani hi mukhairyah pancabhirdarshayan aste somapure sudharmavrishabharudhastamisham
    bhaje || 1|| nityam yatparipurnalakshanamidam hyagantukam na svakam matvaivam dvimukham na darshayati
    no manye sphutam shankaram | satyajnanasukham mukhatrayamidam bhakteshu sandarshayan aste somapure
    sudharmavrishabharudhastamisham bhaje || 2|| ashcaryam sumanoharam vilasitam linge sumurtistu ya keneyam
    ghatita narena na bhavedisho hi tatkaranam | linge'ham satatam vasami sakalanetaddhi sambodhayan aste
    somapure sudharmavrishabharudhastamisham bhaje || 3|| bhaktanugrahahetunaiva khalu yo'rupah sarupo'bhavat
    bhaktoddhara itiha yasya satatam jagarti kirtirbhuvi | bhaktipritimaninditam hridigatam spashtam prakurvamshca
    yah aste somapure sudharmavrishabharudhastamisham bhaje || 4|| pratyagrupataya cakasti satatam madrupametatparam
    matva pashcimadinmukho'tra hi shivo manye svayam kevalah | yogarudhavapuh svarupamamalam cinmudraya
    cadishan aste somapure sudharmavrishabharudhastamisham bhaje || 5|| iti shrimat paramahamsaparivrajakacarya
    sadguru bhagavan shridharasvamimaharajaviracitam shrisomeshvarastotram sampurnam | racanasthanam
  devanagari: विश्वं यत्र भवेद्विलीनमखिलं तल्लिङ्गमस्मिन् सदा सत्यं ज्ञानमनन्तमद्वयमहो ब्रह्म स्फुटं दृश्यते
    । पञ्चब्रह्मसुलक्षणानि हि मुखैर्यः पञ्चभिर्दर्शयन् आस्ते सोमपुरे सुधर्मवृषभारूढस्तमीशं भजे ॥ १॥ नित्यं
    यत्परिपूर्णलक्षणमिदं ह्यागन्तुकं न स्वकं मत्वैवं द्विमुखं न दर्शयति नो मन्ये स्फुटं शङ्करम् । सत्यज्ञानसुखं
    मुखत्रयमिदं भक्तेषु सन्दर्शयन् आस्ते सोमपुरे सुधर्मवृषभारूढस्तमीशं भजे ॥ २॥ आश्चर्यं सुमनोहरं विलसितं
    लिङ्गे सुमूर्तिस्तु या केनेयं घटिता नरेण न भवेदीशो हि तत्कारणम् । लिङ्गेऽहं सततं वसामि सकलानेतद्धि
    सम्बोधयन् आस्ते सोमपुरे सुधर्मवृषभारूढस्तमीशं भजे ॥ ३॥ भक्तानुग्रहहेतुनैव खलु योऽरूपः सरूपोऽभवत् भक्तोद्धार
    इतीह यस्य सततं जागर्ति कीर्तिर्भुवि । भक्तिप्रीतिमनिन्दितां हृदिगतां स्पष्टं प्रकुर्वंश्च यः आस्ते
    सोमपुरे सुधर्मवृषभारूढस्तमीशं भजे ॥ ४॥ प्रत्यग्रूपतया चकास्ति सततं मद्रूपमेतत्परं मत्वा पश्चिमदिङ्मुखोऽत्र
    हि शिवो मन्ये स्वयं केवलः । योगारूढवपुः स्वरूपममलं चिन्मुद्रया चादिशन् आस्ते सोमपुरे सुधर्मवृषभारूढस्तमीशं
    भजे ॥ ५॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीसोमेश्वरस्तोत्रं
    सम्पूर्णम् । रचनास्थानं
