id: subrahmanya-aparadha-kshamapana-stotram
category: stotram
name:
  english: Subrahmanya Aparadha Kshamapana Stotram
  devanagari: सुब्रह्मण्यापराधक्षमापणस्तोत्रम्
content:
  english: namaste namaste guha tarakare namaste namaste guha shaktipane | namaste namaste guha divyamurte
    kshamasva kshamasva samastaparadham || 1|| namaste namaste guha danavare namaste namaste guha carumurte
    | namaste namaste guha punyamurte kshamasva kshamasva samastaparadham || 2|| namaste namaste maheshatmaputra
    namaste namaste mayurasanastha | namaste namaste sarobhuta deva kshamasva kshamasva samastaparadham
    || 3|| namaste namaste svayam jyotirupa namaste namaste param jyotirupa | namaste namaste jagam jyotirupa
    kshamasva kshamasva samastaparadham || 4|| namaste namaste guha manjugatra namaste namaste guha saccaritra
    | namaste namaste guha bhaktamitra kshamasva kshamasva samastaparadham || 5|| namaste namaste guha
    lokapala namaste namaste guha dharmapala | namaste namaste guha satyapala kshamasva kshamasva samastaparadham
    || 6|| namaste namaste guha lokadipa namaste namaste guha bodharupa | namaste namaste guha ganalola
    kshamasva kshamasva samastaparadham || 7|| namaste namaste mahadevasuno namaste namaste mahamohaharin
    | namaste namaste maharogaharin kshamasva kshamasva samastaparadham || 8|| iti shrisubrahmanyaparadhakshamapanastotram
    ||
  devanagari: नमस्ते नमस्ते गुह तारकारे नमस्ते नमस्ते गुह शक्तिपाणे । नमस्ते नमस्ते गुह दिव्यमूर्ते क्षमस्व
    क्षमस्व समस्तापराधम् ॥ १॥ नमस्ते नमस्ते गुह दानवारे नमस्ते नमस्ते गुह चारुमूर्ते । नमस्ते नमस्ते गुह
    पुण्यमूर्ते क्षमस्व क्षमस्व समस्तापराधम् ॥ २॥ नमस्ते नमस्ते महेशात्मपुत्र नमस्ते नमस्ते मयूरासनस्थ
    । नमस्ते नमस्ते सरोभूत देव क्षमस्व क्षमस्व समस्तापराधम् ॥ ३॥ नमस्ते नमस्ते स्वयं ज्योतिरूप नमस्ते
    नमस्ते परं ज्योतिरूप । नमस्ते नमस्ते जगं ज्योतिरूप क्षमस्व क्षमस्व समस्तापराधम् ॥ ४॥ नमस्ते नमस्ते
    गुह मञ्जुगात्र नमस्ते नमस्ते गुह सच्चरित्र । नमस्ते नमस्ते गुह भक्तमित्र क्षमस्व क्षमस्व समस्तापराधम्
    ॥ ५॥ नमस्ते नमस्ते गुह लोकपाल नमस्ते नमस्ते गुह धर्मपाल । नमस्ते नमस्ते गुह सत्यपाल क्षमस्व क्षमस्व
    समस्तापराधम् ॥ ६॥ नमस्ते नमस्ते गुह लोकदीप नमस्ते नमस्ते गुह बोधरूप । नमस्ते नमस्ते गुह गानलोल क्षमस्व
    क्षमस्व समस्तापराधम् ॥ ७॥ नमस्ते नमस्ते महादेवसूनो नमस्ते नमस्ते महामोहहारिन् । नमस्ते नमस्ते महारोगहारिन्
    क्षमस्व क्षमस्व समस्तापराधम् ॥ ८॥ इति श्रीसुब्रह्मण्यापराधक्षमापणस्तोत्रम् ॥
