    नमः । ॐ ऐं ग्लौं घोषणायै नमः । ॐ ऐं ग्लौं घोरायै नमः । ॐ ऐं ग्लौं घोषिण्यै नमः । ॐ ऐं ग्लौं घोणसंयुक्तायै
    नमः । ८० ॐ ऐं ग्लौं घनायै नमः । ॐ ऐं ग्लौं अघ्नायै नमः । ॐ ऐं ग्लौं घर्घरायै नमः । ॐ ऐं ग्लौं घोणयुक्तायै
    नमः । ॐ ऐं ग्लौं अघनाशिन्यै नमः । ॐ ऐं ग्लौं पूर्वायै नमः । ॐ ऐं ग्लौं आग्नेय्यै नमः । ॐ ऐं ग्लौं
    याम्यायै नमः । ॐ ऐं ग्लौं नैरृत्यै नमः । ॐ ऐं ग्लौं वायव्यै नमः । ९० ॐ ऐं ग्लौं उत्तरायै नमः । ॐ ऐं
    ग्लौं वारुण्यै नमः । ॐ ऐं ग्लौं ऐशान्यै नमः । ॐ ऐं ग्लौं ऊर्ध्वायै नमः । ॐ ऐं ग्लौं अधःस्थितायै नमः
    । ॐ ऐं ग्लौं पृष्टायै नमः । ॐ ऐं ग्लौं दक्षायै नमः । ॐ ऐं ग्लौं अग्रगायै नमः । ॐ ऐं ग्लौं वामगायै
    नमः । ॐ ऐं ग्लौं हृङ्कायै नमः । १००
