id: rahu-25
category: stotram
name:
  english: rahu 25
  devanagari: राहु २५
content:
  english: rahupancavimshatinamastotram shri ganeshaya namah | rahurdanavamantri ca simhikacittavandanah
    | ardhakayah sadakrodhi candradityavimardanah || 1|| raudro rudrapriyo daityah svarbhanurbhanubhitidah
    | graharajah sudhapayi rakatithyabhilashukah || 2|| kaladrishtih kalarupah shrikanthahridayashrayah
    | vidhuntudah saimhikeyo ghorarupo mahabalah || 3|| grahapidakaro damshtri raktanetro mahodarah |
    pancavimshatinamani smritva rahum sada narah || 4|| yah pathenmahati pida tasya nashyati kevalam |
    arogyam putramatulam shriyam dhanyam pashumstatha || 5|| dadati rahustasmai yah pathate stotramuttamam
    | satatam pathate yastu jivedvarshashatam narah || 6|| || iti shriskandapurane rahupancavimshatinamastotram
    sampurnam ||
  devanagari: राहुपञ्चविंशतिनामस्तोत्रम् श्री गणेशाय नमः । राहुर्दानवमन्त्री च सिंहिकाचित्तवन्दनः । अर्धकायः
    सदाक्रोधी चन्द्रादित्यविमर्दनः ॥ १॥ रौद्रो रुद्रप्रियो दैत्यः स्वर्भानुर्भानुभीतिदः । ग्रहराजः सुधापायी
    राकातिथ्यभिलाषुकः ॥ २॥ कालदृष्टिः कालरूपः श्रीकण्ठहृदयाश्रयः । विधुन्तुदः सैंहिकेयो घोररूपो महाबलः
    ॥ ३॥ ग्रहपीडाकरो दंष्ट्री रक्तनेत्रो महोदरः । पञ्चविंशतिनामानि स्मृत्वा राहुं सदा नरः ॥ ४॥ यः पठेन्महती
    पीडा तस्य नश्यति केवलम् । आरोग्यं पुत्रमतुलां श्रियं धान्यं पशूंस्तथा ॥ ५॥ ददाति राहुस्तस्मै यः पठते
    स्तोत्रमुत्तमम् । सततं पठते यस्तु जीवेद्वर्षशतं नरः ॥ ६॥ ॥ इति श्रीस्कन्दपुराणे राहुपञ्चविंशतिनामस्तोत्रं
    सम्पूर्णम् ॥
