id: manidweepa-varnana-1-devi-bhagavatham
category: stotram
name:
  english: Manidweepa Varnana - 1 (Devi Bhagavatham)
content:
  english: brahmalokadurdhvabhage sarvaloko'sti yah shrutah | manidvipah sa evasti yatra devi virajate
    || || sarvasmadadhiko yasmatsarvalokastatah smritah | pura parambayaivayam kalpito manasecchaya ||
    || sarvadau nijavasartham prakritya mulabhutaya | kailasadadhiko loko vaikunthadapi cottamah || ||
    golokadapi sarvasmatsarvaloko'dhikah smritah | naitatsamam trilokyam tu sundaram vidyate kvacit ||
    || chatribhutam trijagato bhavasantapanashakam | chayabhutam tadevasti brahmandanam tu sattama ||
    || bahuyojanavistirno gambhirastavadeva hi | manidvipasya parito vartate tu sudhodadhih || || marutsanghattanotkirnataranga
    shatasankulah | ratnacchavalukayukto jhashashankhasamakulah || || vicisangharshasanjatalaharikanashitalah
    | nanadhvajasamayukta nanapotagatagataih || || virajamanah paritastiraratnadrumo mahan | taduttaramayodhatunirmito
    gagane tatah || || saptayojanavistirnah prakaro vartate mahan | nanashastrapraharana nanayuddhavisharadah
    || || rakshaka nivasantyatra modamanah samantatah | caturdvarasamayukto dvarapalashatanvitah || ||
    nanaganaih parivrito devibhaktiyutairnripa | darshanartham samayanti ye deva jagadishituh || || tesham
    gana vasantyatra vahanani ca tatra hi | vimanashatasangharshaghantasvanasamakulah || || hayaheshakhuraghatabadhirikritadimmukhah
    | ganaih kilakilaravairvetrahastaishca taditah || || sevaka devasanganam bhrajante tatra bhumipa |
    tasminkolahale rajannashabdah kenacitkvacit || || kasyacicchruyate'tyantam nanadhvanisamakule | pade
    pade mishtavariparipurnasaransi ca || || vatika vividha rajan ratnadrumavirajitah | taduttaram mahasaradhatunirmitamandalah
    || || salo'paro mahanasti gaganasparshi yacchirah | tejasa syacchatagunah purvasaladayam parah ||
    || gopuradvarasahito bahuvrikshasamanvitah | ya vrikshajatayah santi sarvastastatra santi ca || ||
    nirantaram pushpayutah sada phalasamanvitah | navapallavasamyuktah parasaurabhasankulah || || panasa
    bakula lodhrah karnikarashca shimshapah | devadarukancanara amrashcaiva sumeravah || || likuca hingulashcaila
    lavangah katphalastatha | patala mucukundashca phalinyo jaghanephalah || || talastamalah salashca
    kankola nagabhadrakah | punnagah pilavah salvaka vai karpurashakhinah || || ashvakarna hastikarnastalaparnashca
    dadimah | ganika bandhujivashca jambirashca kurandakah || || campeya bandhujivashca tatha vai kanakadrumah
    | kalagurudrumashcaiva tatha candanapadapah || || kharjura yuthikastalaparnyashcaiva tathekshavah
    | kshiravrikshashca khadirashcincabhallatakastatha || || rucakah kutaja vriksha bilvavrikshastathaiva
    ca | tulasinam vananyevam mallikanam tathaiva ca || || ityaditarujatinam vananyupavanani ca | nanavapishatairyuktanyevam
    santi dharadhipa || || kokilaravasamyukta gunjadbhramarabhushitah | niryasasravinah sarve snigdhacchayastaruttamah
    || || nanaritubhava vriksha nanapakshisamakulah | nanarasasravinibhirnadibhiratishobhitah || || paravatashukavratasarikapakshamarutaih
    | hamsapakshasamudbhuta vatavrataishcaladdrumam || || sugandhagrahipavanapuritam tadvanottamam | sahitam
    hariniyuthairdhavamanairitastatah || || nrityadbarhikadambasya kekaravaih sukhapradaih | naditam tadvanam
    divyam madhusravi samantatah || || kamsyasaladuttare tu tamrasalah prakirtitah | caturasrasamakara
    unnatya saptayojanah || || dvayostu salayormadhye samprokta kalpavatika | yesham tarunam pushpani
    kancanabhani bhumipa || || patrani kancanabhani ratnabijaphalani ca | dashayojanagandho hi prasarpati
    samantatah || || tadvanam rakshitam rajanvasantenartunanisham | pushpasimhasanasinah pushpacchatravirajitah
    || || pushpabhushabhushitashca pushpasavavighurnitah | madhushrirmadhavashrishca dve bharye tasya
    sammate || || kridatah smeravadane sumastabakakandukaih | ativa ramyam vipinam madhusravi samantatah
    || || dashayojanaparyantam kusumamodavayuna | puritam divyagandharvaih sanganairganalolupaih || ||
    shobhitam tadvanam divyam mattakokilanaditam | vasantalakshmisamyuktam kamikamapravardhanam || ||
    tamrasaladuttaratra sisasalah prakirtitah | samucchrayah smrito'pyasya saptayojanasankhyaya || ||
    santanavatikamadhye salayostu dvayornripa | dashayojanagandhastu prasunanam samantatah || || hiranyabhani
    kusumanyutphullani nirantaram | amritadravasamyuktaphalani madhurani ca || || grishmarturnayakastasya
    vatikaya nripottama | shukrashrishca shucishrishca dve bharye tasya sammate || || santapatrastalokastu
    vrikshamuleshu samsthitah | nanasiddhaih parivrito nanadevaih samanvitah || || vilasininam brindaistu
    candanadravapankilaih | pushpamalabhushitaistu talavrintakarambujaih || prakarah shobhito ejacchitalambunishevibhih
    | sisasaladuttaratrapyarakutamayah shubhah || || prakaro vartate rajanmuniyojanadairghyavan | haricandanavrikshanam
    vati madhye tayoh smrita || || salayoradhinathastu varsharturmeghavahanah | vidyutpingalanetrashca
    jimutakavacah smritah || || vajranirghoshamukharashcendradhanva samantatah | sahasrasho varidhara
    muncannaste ganavritah || || nabhah shrishca nabhasyashrih svarasya rasyamalini | amba dula niratnishcabhramanti
    meghayantika || || varshayanti cibunika varidhara ca sammatah | varshartordvadasha proktah shaktayo
    madavihvalah || || navapallavavrikshashca navinalatikanvitah | haritani trinanyeva veshtita yairdhara'khila
    || || nadinadapravahashca pravahanti ca vegatah | saramsi kalushambuni ragicittasamani ca || || vasanti
    devah siddhashca ye devikarmakarinah | vapikupatadagashca ye devyartham samarpitah || || te gana nivasantyatra
    savilasashca sanganah | arakutamayadagre saptayojanadairghyavan || || pancalohatmakah salo madhye
    mandaravatika | nanapushpalatakirna nanapallavashobhita || || adhishthata'tra samproktah sharadrituranamayah
    | ishalakshmirurjalakshmirdve bharye tasya sammate || || nanasiddha vasantyatra sanganah saparicchadah
    | pancalohamayadagre saptayojanadairghyavan || || dipyamano mahashringairvartate raupyasalakah | parijatatavimadhye
    prasunastabakanvita || || dashayojanagandhini kusumani samantatah | modayanti ganansarvanye devikarmakarinah
    || || tatradhinathah samprokto hemantarturmahojjvalah | saganah sayudhah sarvan ragino ranjayannapah
    || || sahashrishca sahasyashrirdve bharye tasya sammate | vasanti tatra siddhashca ye devivratakarinah
    || || raupyasalamayadagre saptayojanadairghyavan | sauvarnasalah samproktastaptahatakakalpitah ||
    || madhye kadambavati tu pushpapallavashobhita | kadambamadiradharah pravartante sahasrashah || ||
    yabhirnipitapitabhirnijanando'nubhuyate | tatradhinathah samproktah shaishirarturmahodayah || || tapahshrishca
    tapasyashrirdve bharye tasya sammate | modamanah sahaitabhyam vartate shishirakritih || || nanavilasasamyukto
    nanaganasamavritah | nivasanti mahasiddha ye devidanakarinah || || nanabhogasamutpannamahanandasamanvitah
    | sanganah parivaraistu sanghashah parivaritah || || svarnasalamayadagre muniyojanadairghyavan | pushparagamayah
    salah kunkumarunavigrahah || || pushparagamayi bhumirvananyupavanani ca | ratnavrikshalavalashca pushparagamayah
    smritah || || prakaro yasya ratnasya tadratnaracita drumah | vanabhuh pakshinashcaiva ratnavarnajalani
    ca || || mandapa mandapastambhah saransi kamalani ca | prakare tatra yadyatsyattatsarvam tatsamam
    bhavet || || paribhasheyamuddishta ratnasaladishu prabho | tejasa syallakshagunah purvasalatparo nripa
    || || dikpala nivasantyatra pratibrahmandavartinam | dikpalanam samashtyatmarupah sphurjadvarayudhah
    || || purvashayam samuttungashringa puramaravati | nanopavanasamyukta mahendrastatra rajate || ||
    svargashobha ca ya svarge yavati syattato'dhika | samashtishatanetrasya sahasragunatah smrita || ||
    airavatasamarudho vajrahastah pratapavan | devasenaparivrito rajate'tra shatakratuh || || devanganaganayuta
    shaci tatra virajate | vahnikone vahnipuri vahnipuh sadrishi nripa || || svahasvadhasamayukto vahnistatra
    virajate | nijavahanabhushadhyo nijadevaganairvritah || || yamyashayam yamapuri tatra dandadharo mahan
    | svabhatairveshtito rajan citraguptapurogamaih || || nijashaktiyuto bhasvattanayo'sti yamo mahan
    | nairrityam dishi rakshasyam rakshasaih parivaritah || || khadgadhari sphurannaste nirritirnijashaktiyuk
    | varunyam varuno raja pashadhari pratapavan || || mahajhashasamarudho varunimadhuvihvalah | nijashaktisamayukto
    nijayadogananvitah || || samaste varune loke varunaniratakulah | vayukone vayuloko vayustatradhitishthati
    || || vayusadhanasamsiddhayogibhih parivaritah | dhvajahasto vishalaksho mrigavahanasamsthitah ||
    || marudganaih parivrito nijashaktisamanvitah | uttarasyam dishi mahanyakshaloko'sti bhumipa || ||
    yakshadhirajastatra''ste vriddhiriddhyadishaktibhih | navabhirnidhibhiryuktastundilo dhananayakah
    || || manibhadrah purnabhadro manimanmanikandharah | manibhusho manisragvi manikarmukadharakah ||
    || ityadiyakshasenanisahito nijashaktiyuk | ishanakone samprokto rudraloko mahattarah || || anarghyaratnakhacito
    yatra rudro'dhidaivatam | manyumandiptanayano baddhaprishthamaheshudhih || || sphurjaddhanurvamahasto'dhijyadhanvabhiravritah
    | svasamanairasankhyatarudraih shulavarayudhaih || || vikritasyaih karalasyairvamadvahnibhirasyatah
    | dashahastaih shatakaraih sahasrabhujasamyutaih || || dashapadairdashagrivaistrinetrairugramurtibhih
    | antarikshacara ye ca ye ca bhumicarah smritah || || rudradhyaye smrita rudrastaih sarvaishca samavritah
    | rudranikotisahito bhadrakalyadimatribhih || || nanashaktisamavishtadamaryadiganavritah | virabhadradisahito
    rudro rajanvirajate || || mundamaladharo nagavalayo nagakandharah | vyaghracarmaparidhano gajacarmottariyakah
    || || citabhasmangaliptangah pramathadiganavritah | ninadaddamarudhvanairbadhirikritadimmukhah ||
    || attahasasphotashabdaih santrasitanabhastalah | bhutasanghasamavishto bhutavaso maheshvarah || ||
    ishanadikpatih so'yam namna ceshana eva ca || || iti shridevibhagavate mahapurane dvadashaskandhe
    manidvipavarnanam nama dashamo'dhyayah ||
  devanagari: ब्रह्मलोकादूर्ध्वभागे सर्वलोकोऽस्ति यः श्रुतः । मणिद्वीपः स एवास्ति यत्र देवी विराजते ॥
    ॥ सर्वस्मादधिको यस्मात्सर्वलोकस्ततः स्मृतः । पुरा पराम्बयैवायं कल्पितो मनसेच्छया ॥ ॥ सर्वादौ निजवासार्थं
    प्रकृत्या मूलभूतया । कैलासादधिको लोको वैकुण्ठादपि चोत्तमः ॥ ॥ गोलोकादपि सर्वस्मात्सर्वलोकोऽधिकः स्मृतः
    । नैतत्समं त्रिलोक्यां तु सुन्दरं विद्यते क्वचित् ॥ ॥ छत्रीभूतं त्रिजगतो भवसन्तापनाशकम् । छायाभूतं
    तदेवास्ति ब्रह्माण्डानां तु सत्तम ॥ ॥ बहुयोजनविस्तीर्णो गम्भीरस्तावदेव हि । मणिद्वीपस्य परितो वर्तते
    तु सुधोदधिः ॥ ॥ मरुत्सङ्घट्टनोत्कीर्णतरङ्ग शतसङ्कुलः । रत्नाच्छवालुकायुक्तो झषशङ्खसमाकुलः ॥ ॥ वीचिसङ्घर्षसञ्जातलहरीकणशीतलः
    । नानाध्वजसमायुक्ता नानापोतगतागतैः ॥ ॥ विराजमानः परितस्तीररत्नद्रुमो महान् । तदुत्तरमयोधातुनिर्मितो
    गगने ततः ॥ ॥ सप्तयोजनविस्तीर्णः प्राकारो वर्तते महान् । नानाशस्त्रप्रहरणा नानायुद्धविशारदाः ॥ ॥ रक्षका
    निवसन्त्यत्र मोदमानाः समन्ततः । चतुर्द्वारसमायुक्तो द्वारपालशतान्वितः ॥ ॥ नानागणैः परिवृतो देवीभक्तियुतैर्नृप
    । दर्शनार्थं समायान्ति ये देवा जगदीशितुः ॥ ॥ तेषां गणा वसन्त्यत्र वाहनानि च तत्र हि । विमानशतसङ्घर्षघण्टास्वनसमाकुलः
    ॥ ॥ हयहेषाखुराघातबधिरीकृतदिम्मुखः । गणैः किलकिलारावैर्वेत्रहस्तैश्च ताडिताः ॥ ॥ सेवका देवसङ्गानां
    भ्राजन्ते तत्र भूमिप । तस्मिङ्कोलाहले राजन्नशब्दः केनचित्क्वचित् ॥ ॥ कस्यचिच्छ्रूयतेऽत्यन्तं नानाध्वनिसमाकुले
    । पदे पदे मिष्टवारिपरिपूर्णसरान्सि च ॥ ॥ वाटिका विविधा राजन् रत्नद्रुमविराजिताः । तदुत्तरं महासारधातुनिर्मितमण्डलः
    ॥ ॥ सालोऽपरो महानस्ति गगनस्पर्शि यच्छिरः । तेजसा स्याच्छतगुणः पूर्वसालादयं परः ॥ ॥ गोपुरद्वारसहितो
    बहुवृक्षसमन्वितः । या वृक्षजातयः सन्ति सर्वास्तास्तत्र सन्ति च ॥ ॥ निरन्तरं पुष्पयुताः सदा फलसमन्विताः
    । नवपल्लवसंयुक्ताः परसौरभसङ्कुलाः ॥ ॥ पनसा बकुला लोध्राः कर्णिकाराश्च शिंशपाः । देवदारुकाञ्चनारा आम्राश्चैव
    सुमेरवः ॥ ॥ लिकुचा हिङ्गुलाश्चैला लवङ्गाः कट्फलास्तथा । पाटला मुचुकुन्दाश्च फलिन्यो जघनेफलाः ॥ ॥ तालास्तमालाः
    सालाश्च कङ्कोला नागभद्रकाः । पुन्नागाः पीलवः साल्वका वै कर्पूरशाखिनः ॥ ॥ अश्वकर्णा हस्तिकर्णास्तालपर्णाश्च
    दाडिमाः । गणिका बन्धुजीवाश्च जम्बीराश्च कुरण्डकाः ॥ ॥ चाम्पेया बन्धुजीवाश्च तथा वै कनकद्रुमाः । कालागुरुद्रुमाश्चैव
    तथा चन्दनपादपाः ॥ ॥ खर्जूरा यूथिकास्तालपर्ण्यश्चैव तथेक्षवः । क्षीरवृक्षाश्च खदिराश्चिञ्चाभल्लातकास्तथा
    ॥ ॥ रुचकाः कुटजा वृक्षा बिल्ववृक्षास्तथैव च । तुलसीनां वनान्येवं मल्लिकानां तथैव च ॥ ॥ इत्यादितरुजातीनां
    वनान्युपवनानि च । नानावापीशतैर्युक्तान्येवं सन्ति धराधिप ॥ ॥ कोकिलारावसंयुक्ता गुन्जद्भ्रमरभूषिताः
    । निर्यासस्राविणः सर्वे स्निग्धच्छायास्तरूत्तमाः ॥ ॥ नानाऋतुभवा वृक्षा नानापक्षिसमाकुलाः । नानारसस्राविणीभिर्नदीभिरतिशोभिताः
    ॥ ॥ पारावतशुकव्रातसारिकापक्षमारुतैः । हंसपक्षसमुद्भूत वातव्रातैश्चलद्द्रुमम् ॥ ॥ सुगन्धग्राहिपवनपूरितं
    तद्वनोत्तमम् । सहितं हरिणीयूथैर्धावमानैरितस्ततः ॥ ॥ नृत्यद्बर्हिकदम्बस्य केकारावैः सुखप्रदैः । नादितं
    तद्वनं दिव्यं मधुस्रावि समन्ततः ॥ ॥ कांस्यसालादुत्तरे तु ताम्रसालः प्रकीर्तितः । चतुरस्रसमाकार उन्नत्या
    सप्तयोजनः ॥ ॥ द्वयोस्तु सालयोर्मध्ये सम्प्रोक्ता कल्पवाटिका । येषां तरूणां पुष्पाणि काञ्चनाभानि भूमिप
    ॥ ॥ पत्राणि काञ्चनाभानि रत्नबीजफलानि च । दशयोजनगन्धो हि प्रसर्पति समन्ततः ॥ ॥ तद्वनं रक्षितं राजन्वसन्तेनर्तुनानिशम्
    । पुष्पसिंहासनासीनः पुष्पच्छत्रविराजितः ॥ ॥ पुष्पभूषाभूषितश्च पुष्पासवविघूर्णितः । मधुश्रीर्माधवश्रीश्च
    द्वे भार्ये तस्य सम्मते ॥ ॥ क्रीडतः स्मेरवदने सुमस्तबककन्दुकैः । अतीव रम्यं विपिनं मधुस्रावि समन्ततः
    ॥ ॥ दशयोजनपर्यन्तं कुसुमामोदवायुना । पूरितं दिव्यगन्धर्वैः साङ्गनैर्गानलोलुपैः ॥ ॥ शोभितं तद्वनं दिव्यं
    मत्तकोकिलनादितम् । वसन्तलक्ष्मीसंयुक्तं कामिकामप्रवर्धनम् ॥ ॥ ताम्रसालादुत्तरत्र सीससालः प्रकीर्तितः
    । समुच्छ्रायः स्मृतोऽप्यस्य सप्तयोजनसङ्ख्यया ॥ ॥ सन्तानवाटिकामध्ये सालयोस्तु द्वयोर्नृप । दशयोजनगन्धस्तु
    प्रसूनानां समन्ततः ॥ ॥ हिरण्याभानि कुसुमान्युत्फुल्लानि निरन्तरम् । अमृतद्रवसंयुक्तफलानि मधुराणि च
    ॥ ॥ ग्रीष्मर्तुर्नायकस्तस्या वाटिकाया नृपोत्तम । शुक्रश्रीश्च शुचिश्रीश्च द्वे भार्ये तस्य सम्मते
    ॥ ॥ सन्तापत्रस्तलोकास्तु वृक्षमूलेषु संस्थिताः । नानासिद्धैः परिवृतो नानादेवैः समन्वितः ॥ ॥ विलासिनीनां
    बृन्दैस्तु चन्दनद्रवपङ्किलैः । पुष्पमालाभूषितैस्तु तालवृन्तकराम्बुजैः ॥ प्रकारः शोभितो एजच्छीतलाम्बुनिषेविभिः
    । सीससालादुत्तरत्राप्यारकूटमयः शुभः ॥ ॥ प्राकारो वर्तते राजन्मुनियोजनदैर्घ्यवान् । हरिचन्दनवृक्षाणां
    वाटी मध्ये तयोः स्मृता ॥ ॥ सालयोरधिनाथस्तु वर्षर्तुर्मेघवाहनः । विद्युत्पिङ्गलनेत्रश्च जीमूतकवचः स्मृतः
    ॥ ॥ वज्रनिर्घोषमुखरश्चेन्द्रधन्वा समन्ततः । सहस्रशो वारिधारा मुञ्चन्नास्ते गणावृतः ॥ ॥ नभः श्रीश्च
    नभस्यश्रीः स्वरस्या रस्यमालिनी । अम्बा दुला निरत्निश्चाभ्रमन्ती मेघयन्तिका ॥ ॥ वर्षयन्ती चिबुणिका
    वारिधारा च सम्मताः । वर्षर्तोर्द्वादश प्रोक्ताः शक्तयो मदविह्वलाः ॥ ॥ नवपल्लववृक्षाश्च नवीनलतिकान्विताः
    । हरितानि तृणान्येव वेष्टिता यैर्धराऽखिला ॥ ॥ नदीनदप्रवाहाश्च प्रवहन्ति च वेगतः । सरांसि कलुषाम्बूनि
    रागिचित्तसमानि च ॥ ॥ वसन्ति देवाः सिद्धाश्च ये देवीकर्मकारिणः । वापीकूपतडागाश्च ये देव्यर्थं समर्पिताः
    ॥ ॥ ते गणा निवसन्त्यत्र सविलासाश्च साङ्गनाः । आरकूटमयादग्रे सप्तयोजनदैर्घ्यवान् ॥ ॥ पञ्चलोहात्मकः
    सालो मध्ये मन्दारवाटिका । नानापुष्पलताकीर्णा नानापल्लवशोभिता ॥ ॥ अधिष्ठाताऽत्र सम्प्रोक्तः शरदृतुरनामयः
    । इषलक्ष्मीरूर्जलक्ष्मीर्द्वे भार्ये तस्य सम्मते ॥ ॥ नानासिद्धा वसन्त्यत्र साङ्गनाः सपरिच्छदाः । पञ्चलोहमयादग्रे
    सप्तयोजनदैर्घ्यवान् ॥ ॥ दीप्यमानो महाशृङ्गैर्वर्तते रौप्यसालकः । पारिजाताटवीमध्ये प्रसूनस्तबकान्विता
    ॥ ॥ दशयोजनगन्धीनि कुसुमानि समन्ततः । मोदयन्ति गणान्सर्वान्ये देवीकर्मकारिणः ॥ ॥ तत्राधिनाथः सम्प्रोक्तो
    हेमन्तर्तुर्महोज्ज्वलः । सगणः सायुधः सर्वान् रागिणो रञ्जयन्नपः ॥ ॥ सहश्रीश्च सहस्यश्रीर्द्वे भार्ये
    तस्य सम्मते । वसन्ति तत्र सिद्धाश्च ये देवीव्रतकारिणः ॥ ॥ रौप्यसालमयादग्रे सप्तयोजनदैर्घ्यवान् । सौवर्णसालः
    सम्प्रोक्तस्तप्तहाटककल्पितः ॥ ॥ मध्ये कदम्बवाटी तु पुष्पपल्लवशोभिता । कदम्बमदिराधाराः प्रवर्तन्ते
    सहस्रशः ॥ ॥ याभिर्निपीतपीताभिर्निजानन्दोऽनुभूयते । तत्राधिनाथः सम्प्रोक्तः शैशिरर्तुर्महोदयः ॥ ॥ तपःश्रीश्च
    तपस्यश्रीर्द्वे भार्ये तस्य सम्मते । मोदमानः सहैताभ्यां वर्तते शिशिराकृतिः ॥ ॥ नानाविलाससंयुक्तो नानागणसमावृतः
    । निवसन्ति महासिद्धा ये देवीदानकारिणः ॥ ॥ नानाभोगसमुत्पन्नमहानन्दसमन्विताः । साङ्गनाः परिवारैस्तु
    सङ्घशः परिवारिताः ॥ ॥ स्वर्णसालमयादग्रे मुनियोजनदैर्घ्यवान् । पुष्परागमयः सालः कुङ्कुमारुणविग्रहः
    ॥ ॥ पुष्परागमयी भूमिर्वनान्युपवनानि च । रत्नवृक्षालवालाश्च पुष्परागमयाः स्मृताः ॥ ॥ प्राकारो यस्य
    रत्नस्य तद्रत्नरचिता द्रुमाः । वनभूः पक्षिनश्चैव रत्नवर्णजलानि च ॥ ॥ मण्डपा मण्डपस्तम्भाः सरान्सि
    कमलानि च । प्राकारे तत्र यद्यत्स्यात्तत्सर्वं तत्समं भवेत् ॥ ॥ परिभाषेयमुद्दिष्टा रत्नसालादिषु प्रभो
    । तेजसा स्याल्लक्षगुणः पूर्वसालात्परो नृप ॥ ॥ दिक्पाला निवसन्त्यत्र प्रतिब्रह्मान्डवर्तिनाम् । दिक्पालानां
    समष्ट्यात्मरूपाः स्फूर्जद्वरायुधाः ॥ ॥ पूर्वाशायां समुत्तुङ्गशृङ्गा पूरमरावती । नानोपवनसंयुक्ता महेन्द्रस्तत्र
    राजते ॥ ॥ स्वर्गशोभा च या स्वर्गे यावती स्यात्ततोऽधिका । समष्टिशतनेत्रस्य सहस्रगुणतः स्मृता ॥ ॥ ऐरावतसमारूढो
    वज्रहस्तः प्रतापवान् । देवसेनापरिवृतो राजतेऽत्र शतक्रतुः ॥ ॥ देवाङ्गनागणयुता शची तत्र विराजते । वह्निकोणे
    वह्निपुरी वह्निपूः सदृशी नृप ॥ ॥ स्वाहास्वधासमायुक्तो वह्निस्तत्र विराजते । निजवाहनभूषाढ्यो निजदेवगणैर्वृतः
    ॥ ॥ याम्याशायां यमपुरी तत्र दण्डधरो महान् । स्वभटैर्वेष्टितो राजन् चित्रगुप्तपुरोगमैः ॥ ॥ निजशक्तियुतो
    भास्वत्तनयोऽस्ति यमो महान् । नैरृत्यां दिशि राक्षस्यां राक्षसैः परिवारितः ॥ ॥ खड्गधारी स्फुरन्नास्ते
    निरृतिर्निजशक्तियुक् । वारुण्यां वरुणो राजा पाशधारी प्रतापवान् ॥ ॥ महाझशसमारूढो वारुणीमधुविह्वलः ।
    निजशक्तिसमायुक्तो निजयादोगणान्वितः ॥ ॥ समास्ते वारुणे लोके वरुणानीरताकुलः । वायुकोणे वायुलोको वायुस्तत्राधितिष्ठति
    ॥ ॥ वायुसाधनसंसिद्धयोगिभिः परिवारितः । ध्वजहस्तो विशालाक्षो मृगवाहनसंस्थितः ॥ ॥ मरुद्गणैः परिवृतो
    निजशक्तिसमन्वितः । उत्तरस्यां दिशि महान्यक्षलोकोऽस्ति भूमिप ॥ ॥ यक्षाधिराजस्तत्राऽऽस्ते वृद्धिऋद्ध्यादिशक्तिभिः
    । नवभिर्निधिभिर्युक्तस्तुन्दिलो धननायकः ॥ ॥ मणिभद्रः पूर्णभद्रो मणिमान्मणिकन्धरः । मणिभूषो मणिस्रग्वी
    मणिकार्मुकधारकः ॥ ॥ इत्यादियक्षसेनानीसहितो निजशक्तियुक् । ईशानकोणे सम्प्रोक्तो रुद्रलोको महत्तरः ॥
    ॥ अनर्घ्यरत्नखचितो यत्र रुद्रोऽधिदैवतम् । मन्युमान्दीप्तनयनो बद्धपृष्ठमहेषुधिः ॥ ॥ स्फूर्जद्धनुर्वामहस्तोऽधिज्यधन्वभिरावृतः
    । स्वसमानैरसङ्ख्यातरुद्रैः शूलवरायुधैः ॥ ॥ विकृतास्यैः करालास्यैर्वमद्वह्निभिरास्यतः । दशहस्तैः शतकरैः
    सहस्रभुजसंयुतैः ॥ ॥ दशपादैर्दशग्रीवैस्त्रिनेत्रैरुग्रमूर्तिभिः । अन्तरिक्षचरा ये च ये च भूमिचराः स्मृताः
    ॥ ॥ रुद्राध्याये स्मृता रुद्रास्तैः सर्वैश्च समावृतः । रुद्राणीकोटिसहितो भद्रकाल्यादिमातृभिः ॥ ॥ नानाशक्तिसमाविष्टडामर्यादिगणावृतः
    । वीरभद्रादिसहितो रुद्रो राजन्विराजते ॥ ॥ मुण्डमालाधरो नागवलयो नागकन्धरः । व्याघ्रचर्मपरीधानो गजचर्मोत्तरीयकः
    ॥ ॥ चिताभस्माङ्गलिप्ताङ्गः प्रमथादिगणावृतः । निनदड्डमरुध्वानैर्बधिरीकृतदिम्मुखः ॥ ॥ अट्टहासास्फोटशब्दैः
    सन्त्रासितनभस्तलः । भूतसङ्घसमाविष्टो भूतावासो महेश्वरः ॥ ॥ ईशानदिक्पतिः सोऽयं नाम्ना चेशान एव च ॥
    ॥ इति श्रीदेवीभागवते महापुराणे द्वादशस्कन्धे मणिद्वीपवर्णनं नाम दशमोऽध्यायः ॥
