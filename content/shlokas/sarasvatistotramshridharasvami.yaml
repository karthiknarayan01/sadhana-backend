id: sarasvatistotramshridharasvami
category: stotram
name:
  english: sarasvatistotramshridharasvami
  devanagari: सरस्वतिस्तोत्रम्श्रीधरस्वामि
content:
  english: jayatu jayatu nityam sharada vedamata jayatu jayatu devi jnanada mokshada ca | jayatu jayatu
    ya shrissarvadevairupasya jayatu jayatu nityam bharati citsvarupa || 16|| ya idam pathati stotram
    nityam bhaktyanupavanam | sarasvatiprasadena vidyavan sambhaveddhruvam || iti shrisamartharamadasanugrihitaramapadakanjabhringayamana
    shrimatparamahamsaparivrajakacarya sadguru bhagavan shridharasvamina viracitam shrisarasvatistotram
    sampurnam | sharada navaratri
  devanagari: जयतु जयतु नित्यं शारदा वेदमाता जयतु जयतु देवी ज्ञानदा मोक्षदा च । जयतु जयतु या श्रीस्सर्वदेवैरुपास्या
    जयतु जयतु नित्यं भारती चित्स्वरूपा ॥ १६॥ य इदं पठति स्तोत्रं नित्यं भक्त्यानुपावनम् । सरस्वतीप्रसादेन
    विद्यावान् सम्भवेद्ध्रुवम् ॥ इति श्रीसमर्थरामदासानुगृहितरामपदकञ्जभृङ्गायमान श्रीमत्परमहंसपरिव्राजकाचार्य
    सद्गुरु भगवान् श्रीधरस्वामिना विरचितं श्रीसरस्वतीस्तोत्रं सम्पूर्णम् । शारदा नवरात्री
meaning: {}
