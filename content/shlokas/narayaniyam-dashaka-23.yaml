id: narayaniyam-dashaka-23
category: stotram
name:
  english: Narayaniyam Dashaka 23
content:
  english: pracetasastu bhagavannaparo hi daksha stvatsevanam vyadhita sargavivriddhikamah | avirbabhuvitha
    tada lasadashtabahu stasmai varam daditha tam ca vadhumasiknim || || tasyatmajastvayutamisha punassahasram
    shrinaradasya vacasa tava margamapuh | naikatravasamrishaye sa mumoca shapam bhaktottamastvrishiranugrahameva
    mene || || shashtya tato duhitribhih srijatah kulaughan dauhitrasunuratha tasya sa vishvarupah | tvatstotravarmitamajapayadindramajau
    deva tvadiyamahima khalu sarvajaitrah || || prakshurasenavishaye kila citraketuh putragrahi nripatirangirasah
    prabhavat | labdhvaikaputramatha tatra hate sapatni sanghairamuhyadavashastava mayayasau || || tam
    naradastu samamangirasa dayaluh samprapya tavadupadarshya sutasya jivam | kasyasmi putra iti tasya
    gira vimoham tyaktva tvadarcanavidhau nripatim nyayunkta || || stotram ca mantramapi naradato'tha
    labdhva toshaya sheshavapusho nanu te tapasyan | vidyadharadhipatitam sa hi saptaratre labdhvapyakunthamatiranvabhajadbhavantam
    || || tasmai mrinaladhavalena sahasrashirshna rupena baddhanutisiddhaganavritena | pradurbhavannacirato
    nutibhih prasanno datva''tmatattvamanugrihya tirodadhatha || || tvadbhaktamauliratha so'pi ca lakshalaksham
    varshani harshulamana bhuvaneshu kamam | sangapayan gunaganam tava sundaribhih sangatirekarahito lalitam
    cacara || || atyantasangavilayaya bhavatpranunno nunam sa rupyagirimapya mahatsamaje | nishshankamankakritavallabhamangajarim
    tam shankaram parihasannumayabhishepe || || nissambhramastvayamayacitashapamoksho vritrasuratvamupagamya
    surendrayodhi | bhaktyatmatattvakathanaih samare vicitram shatrorapi bhramamapasya gatah padam te
    || || tvatsevanena ditirindravadhodyata'pi tanpratyutendrasuhrido maruto'bhilebhe | dushtashaye'pi
    shubhadaiva bhavannisheva tattadrishastvamava mam pavanalayesha ||
  devanagari: प्राचेतसस्तु भगवन्नपरो हि दक्ष स्त्वत्सेवनं व्यधित सर्गविवृद्धिकामः । आविर्बभूविथ तदा लसदष्टबाहु
    स्तस्मै वरं ददिथ तां च वधूमसिक्नीम् ॥ ॥ तस्यात्मजास्त्वयुतमीश पुनस्सहस्रं श्रीनारदस्य वचसा तव मार्गमापुः
    । नैकत्रवासमृषये स मुमोच शापं भक्तोत्तमस्त्वृषिरनुग्रहमेव मेने ॥ ॥ षष्ट्या ततो दुहितृभिः सृजतः कुलौघान्
    दौहित्रसूनुरथ तस्य स विश्वरूपः । त्वत्स्तोत्रवर्मितमजापयदिन्द्रमाजौ देव त्वदीयमहिमा खलु सर्वजैत्रः
    ॥ ॥ प्राक्शूरसेनविषये किल चित्रकेतुः पुत्राग्रही नृपतिरङ्गिरसः प्रभावात् । लब्ध्वैकपुत्रमथ तत्र हते
    सपत्नी सङ्घैरमुह्यदवशस्तव माययासौ ॥ ॥ तं नारदस्तु सममङ्गिरसा दयालुः सम्प्राप्य तावदुपदर्श्य सुतस्य
    जीवम् । कस्यास्मि पुत्र इति तस्य गिरा विमोहं त्यक्त्वा त्वदर्चनविधौ नृपतिं न्ययुङ्क्त ॥ ॥ स्तोत्रं
    च मन्त्रमपि नारदतोऽथ लब्ध्वा तोषाय शेषवपुषो ननु ते तपस्यन् । विद्याधराधिपतितां स हि सप्तरात्रे लब्ध्वाप्यकुण्ठमतिरन्वभजद्भवन्तम्
    ॥ ॥ तस्मै मृणालधवलेन सहस्रशीर्ष्णा रूपेण बद्धनुतिसिद्धगणावृतेन । प्रादुर्भवन्नचिरतो नुतिभिः प्रसन्नो
    दत्वाऽऽत्मतत्त्वमनुगृह्य तिरोदधाथ ॥ ॥ त्वद्भक्तमौलिरथ सोऽपि च लक्षलक्षं वर्षाणि हर्षुलमना भुवनेषु
    कामम् । सङ्गापयन् गुणगणं तव सुन्दरीभिः सङ्गातिरेकरहितो ललितं चचार ॥ ॥ अत्यन्तसङ्गविलयाय भवत्प्रणुन्नो
    नूनं स रूप्यगिरिमाप्य महत्समाजे । निश्शङ्कमङ्ककृतवल्लभमङ्गजारिं तं शङ्करं परिहसन्नुमयाभिशेपे ॥ ॥ निस्सम्भ्रमस्त्वयमयाचितशापमोक्षो
    वृत्रासुरत्वमुपगम्य सुरेन्द्रयोधी । भक्त्यात्मतत्त्वकथनैः समरे विचित्रं शत्रोरपि भ्रममपास्य गतः पदं
    ते ॥ ॥ त्वत्सेवनेन दितिरिन्द्रवधोद्यताऽपि तान्प्रत्युतेन्द्रसुहृदो मरुतोऽभिलेभे । दुष्टाशयेऽपि शुभदैव
    भवन्निषेवा तत्तादृशस्त्वमव मां पवनालयेश ॥
