id: gangakavacam-4-vishnuyamalantargatam-dravyarupa-mahabhaga
category: kavacha
name:
  english: gangakavacam 4 (vishnuyamalantargatam dravyarupa mahabhaga)
  devanagari: गङ्गाकवचम् ४ (विष्णुयामलान्तर्गतम् द्रव्यरूपा महाभागा)
content:
  english: gangakavacasya vishnurrishiviratchandah caturdasha purusha uddharana arthe pathe viniyogah
    | om dravyarupa mahabhaga snane ca tarpane'pi ca | abhisheke pujane ca patu mam shuklarupini || 1||
    vishnupadaprasutasi vaishnavi namadharini | pahi mam sarvato rakshedganga tripathagamini || 2|| mandakini
    sada patu dehante svargavallabha | alakananda ca vamabhage prithivyam ya tu tishthati || 3|| bhogavati
    ca patale svarge mandakini tatha | pancaksharamimam mantram yah pathecchrinuyadapi || 4|| rogi rogatpramucyetbaddho
    mucyeta bandhanat | gurvini janayet putram vandhya putravati bhavet || 5|| gangasmaranamatrena nishpapo
    jayate narah | yah pathedgrihamadhye tu gangasnanaphalam labhet || 6|| snanakale pathedyastu shatakotiphalam
    labhet | yah pathetprayato bhaktya muktah kotikulaih saha || 7|| || iti shrivishnuyamale shivaparvatisamvade
    gangakavacam sampurnam |
  devanagari: गङ्गाकवचस्य विष्णुरृषिविराट्छन्दः चतुर्दश पुरुष उद्धारण अर्थे पाठे विनियोगः । ॐ द्रव्यरूपा
    महाभागा स्नाने च तर्पणेऽपि च । अभिषेके पूजने च पातु मां शुक्लरुपिणी ॥ १॥ विष्णुपादप्रसूतासि वैष्णवी
    नामधारिणी । पाहि मां सर्वतो रक्षेद्गङ्गा त्रिपथगामिनी ॥ २॥ मन्दाकिनी सदा पातु देहान्ते स्वर्गवल्लभा
    । अलकनन्दा च वामभागे पृथिव्यां या तु तिष्ठति ॥ ३॥ भोगवती च पाताले स्वर्गे मन्दाकिनी तथा । पञ्चाक्षरमिमं
    मन्त्रं यः पठेच्छृणुयादपि ॥ ४॥ रोगी रोगात्प्रमुच्येत्बद्धो मुच्येत बन्धनात् । गुर्विणी जनयेत् पुत्रं
    वन्ध्या पुत्रवती भवेत् ॥ ५॥ गङ्गास्मरणमात्रेण निष्पापो जायते नरः । यः पठेद्गृहमध्ये तु गङ्गास्नानफलं
    लभेत् ॥ ६॥ स्नानकाले पठेद्यस्तु शतकोटिफलं लभेत् । यः पठेत्प्रयतो भक्त्या मुक्तः कोटिकुलैः सह ॥ ७॥
    ॥ इति श्रीविष्णुयामले शिवपार्वतीसंवादे गङ्गाकवचं सम्पूर्णम् ।
