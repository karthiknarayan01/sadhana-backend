    सुख परम अनूपा ॥ सुनि बचन सुजाना रोदन ठाना होइ बालक सुरभूपा। यह चरित जे गावहिं हरिपद पावहिं ते न परहिं
    भवकूपा ॥ दो बिप्र धेनु सुर सन्त हित लीन्ह मनुज अवतार। निज इच्छा निर्मित तनु माया गुन गो पार ॥ ॥ सुनि
    सिसु रुदन परम प्रिय बानी। सम्भ्रम चलि आई सब रानी ॥ हरषित जहँ तहँ धाईं दासी। आनँद मगन सकल पुरबासी ॥
    दसरथ पुत्रजन्म सुनि काना। मानहुँ ब्रह्मानन्द समाना ॥ परम प्रेम मन पुलक सरीरा। चाहत उठत करत मति धीरा
    ॥ जाकर नाम सुनत सुभ होई। मोरें गृह आवा प्रभु सोई ॥ परमानन्द पूरि मन राजा। कहा बोलाइ बजावहु बाजा ॥
    गुर बसिष्ठ कहँ गयु हँकारा। आए द्विजन सहित नृपद्वारा ॥ अनुपम बालक देखेन्हि जाई। रूप रासि गुन कहि न
    सिराई ॥ दो नन्दीमुख सराध करि जातकरम सब कीन्ह। हाटक धेनु बसन मनि नृप बिप्रन्ह कहँ दीन्ह ॥ ॥ ध्वज पताक
    तोरन पुर छावा। कहि न जाइ जेहि भाँति बनावा ॥ सुमनबृष्टि अकास तें होई। ब्रह्मानन्द मगन सब लोई ॥ बृन्द
    बृन्द मिलि चलीं लोगाई। सहज सङ्गार किएँ उठि धाई ॥ कनक कलस मङ्गल धरि थारा। गावत पैठहिं भूप दुआरा ॥ करि
    आरति नेवछावरि करहीं। बार बार सिसु चरनन्हि परहीम् ॥ मागध सूत बन्दिगन गायक। पावन गुन गावहिं रघुनायक
    ॥ सर्बस दान दीन्ह सब काहू। जेहिं पावा राखा नहिं ताहू ॥ मृगमद चन्दन कुङ्कुम कीचा। मची सकल बीथिन्ह बिच
    बीचा ॥ दो गृह गृह बाज बधाव सुभ प्रगटे सुषमा कन्द। हरषवन्त सब जहँ तहँ नगर नारि नर बृन्द ॥ ॥ कैकयसुता
    सुमित्रा दोऊ। सुन्दर सुत जनमत भैं ओऊ ॥ वह सुख सम्पति समय समाजा। कहि न सकि सारद अहिराजा ॥ अवधपुरी सोहि
    एहि भाँती। प्रभुहि मिलन आई जनु राती ॥ देखि भानू जनु मन सकुचानी। तदपि बनी सन्ध्या अनुमानी ॥ अगर धूप
    बहु जनु अँधिआरी। उड़इ अभीर मनहुँ अरुनारी ॥ मन्दिर मनि समूह जनु तारा। नृप गृह कलस सो इन्दु उदारा ॥
    भवन बेदधुनि अति मृदु बानी। जनु खग मूखर समयँ जनु सानी ॥ कौतुक देखि पतङ्ग भुलाना। एक मास तेइँ जात न
