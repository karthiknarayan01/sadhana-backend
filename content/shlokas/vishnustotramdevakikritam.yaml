id: vishnustotramdevakikritam
category: stotram
name:
  english: vishnustotramdevakikritam
  devanagari: विष्णुस्तोत्रंदेवकीकृतम्
content:
  english: devakikritam vishnustotram 1 jagatamishvareshesha jnanajneyabhavavyaya | samastadevatadeva
    vasudeva namo'stu te || 4|| pradhanapumsorajayoryah karanamakaranam | avisheshyamajam rupam tava tasmai
    namo'stu te || 5|| tvam pradhanam pumamshcaiva karanakaranatmakah | sadasaccakhilam deva kenoktena
    tava stavah || 6|| prasida deva devanamarishatana vamana | lobhabhibhuta yadaham varayami prayaccha
    tat || 7|| iti vishnudharmeshu navatitamo'dhyayantargatam devakikritam vishnustotram sampurnam |
  devanagari: देवकीकृतम् विष्णुस्तोत्रम् १ जगतामीश्वरेशेश ज्ञानज्ञेयभवाव्यय । समस्तदेवतादेव वासुदेव नमोऽस्तु
    ते ॥ ४॥ प्रधानपुंसोरजयोर्यः कारणमकारणम् । अविशेष्यमजं रूपं तव तस्मै नमोऽस्तु ते ॥ ५॥ त्वं प्रधानं
    पुमांश्चैव कारणाकारणात्मकः । सदसच्चाखिलं देव केनोक्तेन तव स्तवः ॥ ६॥ प्रसीद देव देवानामरिशातन वामन
    । लोभाभिभूता यदहं वरयामि प्रयच्छ तत् ॥ ७॥ इति विष्णुधर्मेषु नवतितमोऽध्यायान्तर्गतं देवकीकृतं विष्णुस्तोत्रं
    सम्पूर्णम् ।
meaning: {}
