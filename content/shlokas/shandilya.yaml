id: shandilya
category: upanishad
name:
  english: shandilya
  devanagari: शन्दिल्य
content:
  english: janurvontare samyakkritva padatale ubhe | rijukayah samasinah svastikam tatpracakshate || 1||
    savye dakshinagulpham tu prishthaparshve niyojayet | dakshine'pi tatha savyam gomukham gomukham yatha
    || 2|| angushthena nibadhniyaddhastabhyam vyutkramena ca | urvorupari shandilya kritva padatale ubhe
    | padmasanam bhavedetatsarveshamapi pujitam || 3|| ekam padamathaikasminvinyasyoruni samsthitah |
    itarasmimstatha corum virasanamudiritam || 4|| dakshinam savyagulphena dakshinena tathetaram | hastau
    ca janvoh samsthapya svangulishca prasarya ca || 5|| vyaktavaktro niriksheta nasagram susamahitah
    | simhasanam bhavedetatpujitam yogibhih sada || 6|| yonim vamena sampidya medhradrupari dakshinam
    | bhrumadhye ca manolakshyam siddhasanamidam bhavet || 7|| gulphau tu vrishanasyadhah sivanyah parshvayoh
    kshipet | padaparshve tu panibhyam dridham badhva sunishcalam | bhadrasanam bhavedetatsarvavyadhivishapaham
    || 8|| sampidya sivinim sukshmam gulphenaiva tu savyatah | savyam dakshinagulphena muktasanamudiritam
    || 9|| avashtabhya dharam samyaktalabhyam tu karadvayoh | hastayoh kurparau capi sthapayennabhiparshvayaoh
    || 10|| samunnatashirahpado dandavadvyomni samsthitah | mayurasanametattu sarvapapapranashanam ||
    11|| sharirantargatah sarve roga vinashyanti | vishani jiryante | yena kenasanena sukhadharanam bhavatyashaktastatsamacaret
    | yenasanam vijitam jagattrayam tena vijitam bhavati | yamaniyamabhyam samyuktah purushah pranayamam
    caret | tena nadyah shuddha bhavanti || 3|| atha hainamatharvanam shandilyah papraccha kenopayena
    nadyah shuddhah syuh | nadyah katisamkhyakah | tasamutpattih kidrishi | tasu kati vayavastishthanti
    | tesham kani sthanani | tatkarmani kani | dehe yani yani vijnatavyani tatsarvam me bruhiti | sa hovaca
    atharvana athedam shariram shannavatyangulatmakam bhavati | shariratprano dvadashanguladhiko bhavati
    | sharirastham pranamagnina saha yogabhyasena samam nyunam va yah karoti sa yogipungavo bhavati |
    dehamadhye shikhisthanam trikonam taptajambunadaprabham manushyanam | catushpadam caturasram | vihanganam
    vrittakaram | tanmadhye shubha tanvi pavaki shikha tishthati | gudadvyanguladurdhvam medhradvyanguladadho
    dehamadhyam manushyanam bhavati | catushpadam hrinmadhyam | vihanganam tungamadhyam | dehamadhyam
    navangulam caturangulamutsedhayatamandakriti | tanmadhye nabhih | tatra dvadasharayutam cakram | taccakramadhye
    punyapapapracodito jivo bhramati | tantupanjaramadhyasthalutika yatha bhramati tatha casau tatra pranashcarati
    | dehe'sminjivah pranarudho bhavet | nabhestiryagadhaurdhvam kundalinisthanam | ashtaprakritirupashtadha
    kundalikrita kundalini shaktirbhavati | yathavadvayusamcaram jalannadini paritah skandhah parshveshu
    nirudhyainam mukhenaiva samaveshtya brahmarandhram yogakale capanenagnina ca sphurati | hridayakashe
    mahojjvala jnanarupa bhavati | madhyasthakundalinimashritya mukhya nadyashcaturdasha bhavanti | ida
    pingala sushumna sarasvati varuni pusha hastijihva yashasvini vishvodari kuhuh shankhini payasvini
    alambusa gandhariti nadyacaturdasha bhavanti | tatra sushumna vishvadharini mokshamargeti cacakshate
    | gudasya prishthabhage vinadandashrita murdhaparyantam brahmarandhre vijneya vyakta sukshma vaishnavi
    bhavati | sushumnayah savyabhage ida tishthati | dakshinabhage pingala idayam candrashcarati | pingalayam
    ravih | tamorupashcandrah | rajorupo ravih | vishabhago ravih | amritabhagashcandramah | taveva sarvakalam
    dhatte | sushumna kalabhoktri bhavati | sushumna prishthaparshvayoh sarasvatikuhu bhavatah | yashasvinikuhumadhye
    varuni pratishthita bhavati | pushasarasvatimadhye payasvini bhavati | gandharisarasvatimadhye yashasvini
    bhavati | kandamaye'lambusa bhavati| sushumnapurvabhage medhrantam kuhurbhavati | kundalinya adhashcordhvam
    varuni sarvagamini bhavati | yashasvini saumya ca padangushthantamishyate | pingala cordhvaga yamyanasantam
    bhavati | pingalayah prishthato yamyanetranatam pusha bhavati | yamyakarnantam yashasvini bhavati
    | jihvaya urdhvanatam sarasvati bhavati | asavyakarnantamurdhvaga shankhini bhavati | idaprishthabhagatsavyanetrantaga
    gandhari bhavati | payumuladadhordhvagalambusa bhavati | etashca caturdashasu nadishvanya nadyah sambhavanti
    | tasvanyastasvanya bhavantiti vijneyah || yathashvatthadipatram shirabhirvyaptamevam shariram nadibhirvyaptam
    | pranapanasamanodanavyana nagakurmakrikaradevadattadhananjaya ete dasha vayavah sarvasu nadishu caranti
    | asyanasikakanthanabhipadangushthadvayakundalyadhashcordhvabhageshu pranah samcarati | shrotrakshikatigulphaghranagalasphigdesheshu
    vyanah samcarati | gudamedhrorujanudaravrishanakatijanghanabhigudagnyagareshvapanah samcarati | sarvasandhistha
    udanah | padahastayorapi sarvagatreshu sarvavyapi samanah | bhuktannarasadikam gatregnina saha vyapayandvisaptatisahasreshu
    nadimargeshu caransamanavayuragnina saha sangopangakalevaram vyapnoti | nagadivayavah pancatvagasthyadisambhavah
    | tundastham jalamannam ca rasadishu samiritam tundamadhyagatah pragastani prithakkuryat | agnerupari
    jalam sthapya jaloparyannadini samsthapya svayamapanam samprapya tenaiva saha marutah prayati dehamadhyagatam
    jvalanam | vayuna palito vahnirapanena shanairdehamadhye jvalati | jvalano jvalabhih pranena koshthamadhyagatam
    jalamatyushnamakarot | jalopari samarpitavyanjanasamyuktamannam vahnisamyuktavarina pakvamakarot |
    tena svedamutrajalaraktaviryaruparasapurishadikam pranah prithakkuryat | samanavayuna saha sarvasu
    nadishu rasam vyapayanchvasarupena dehe vayushcarati | navabhirvyomarandhraih sharirasya vayavah kurvanti
    vinmutradivisarjanam | nishvasocchvasakasashca pranakarmocyate | vinmutradivisarjanamapanavayukarma
    | hanopadanaceshtadi vyanakarma | dehasyonnayanadikamudanakarma | shariraposhanadikam samanakarma
    | udgaradi nagakarma | nimilanadi kurmakarma | kshutkaranam krikarakarma | tandra devadattakarma |
    shleshmadi dhananjayakarma | evam nadisthanam vayusthanam tatkarma ca samyagjnatva nadisamshodhanam
    kuryat || 4|| yamaniyamayutah purushah sarvasangavivarjitah kritavidyah satyadharmarato jitakrodho
    gurushushrushaniratah pitrimatrividheyah svashramoktasadacaravidvacchikshitah phalamulodakanvitam
    tapovanam prapya ramyadeshe brahmaghoshasamanvite svadharmaniratabrahmavitsamavrite phalamulapushpavaribhih
    susampurne devayatane naditire grame nagare vapi sushobhanamatham natyuccanicayatamalpadvaram gomayadiliptam
    sarvarakshasamanvitam kritva tatra vedantashravanam kurvanyogam samarabhet | adau vinayakam sampujya
    sveshtadevatam natva purvoktasane sthitva pranmukha udanmukho vapi mridvasaneshu jitasanagato vidvansamagrivashironasagradrigbhrumadhye
    shashabhridbimbam pashyannetrabhyamamritam pibet | dvadashamatraya idaya vayumapuryodare sthitam jvalavaliyutam
    rephabinduyuktamagnimandalayutam dhyayedrecayetpingalaya | punah pingalayapurya kumbhitva recayedidaya
    | tricatustricatuhsaptatricaturmasaparyantam trisandhishu tadantaraleshu ca shatkritva acarennadishuddhirbhavati
    | tatah sharire laghudiptivahnivriddhinadabhivyaktirbhavati || 5|| pranapanasamayogah pranayamo bhavati
    | recakapurakakumbhakabhedena sa trividhah | te varnatmakah | tasmatpranava eva pranayamah padmadyasanasthah
    pumannasagre shashabhridbimbajyotsnajalavitanitakaramurti raktangi hamsavahini dandahasta bala gayatri
    bhavati | ukaramurtih shvetangi tarkshyavahini yuvati cakrahasta savitri bhavati | makaramurtih krishnangi
    vrishabhavahini vriddha trishuladharini sarasvati bhavati | akaraditrayanam sarvakaranamekaksharam
    paramjyotih pranavam bhavatiti dhyayet | idaya bahyadvayumapurya shodashamatrabhirakaram cintayanpuritam
    vayum catuhshashtimatrabhih kumbhayitvokaram dhyayanpuritam pingalaya dvatrimshanmatraya makaramurtidhyanenaivam
    kramena punah punah kuryat || 6|| athasanadridho yogi vashi mitahitashanah sushumnanadisthamalashoshartham
    yogi baddhapadmasano vayum candrenapurya yathashakti kumbhayitva suryena recayitva punah suryenapurya
    kumbhayitva candrena virecya yaya tyajettaya sampurya dharayet | tadete shloka bhavanti | pranam pragidaya
    pibenniyamitam bhuyo'nyaya recayetpitva pingalaya samiranamatho baddhva tyajedvamaya | suryacandramasoranena
    vidhina'bhyasam sada tanvatam shuddha nadigana bhavanti yaminam masatrayadurdhvatah || 1|| pratarmadhyandine
    sayamardharatre tu kumbhakan | shanairashitiparyantam caturvaram samabhyaset || 2|| kaniyasi bhavetsvedah
    kampo bhavati madhyame | uttishthattyuttame pranarodhe padmasanam mahat || 3|| jalena shramajatena
    gatramardanamacaret | dridhata laghuta capi tasya gatrasya jayate || 4|| abhyasakale prathamam shastam
    kshirajyabhojanam | tato'bhyase sthiribhute na tavanniyamagrahah || 5|| yatha simho gajo vyaghro bhavedvashyah
    shanaih shanaih | tathaiva sevito vayuranyatha hanti sadhakam || 6|| yuktam yuktam tyajedvayum yuktam
    yuktam ca purayet | yuktam yuktam ca badhniyadevam siddhimavapnuyat || 7|| yatheshtadharanadvayoranalasya
    pradipanam | nadabhivyaktirarogyam jayate nadishodhanat || 8|| vidhivatpranasamyamairnadicakre vishodhite
    | sushumnavadanam bhittva sukhadvishati marutah || 9|| marute madhyasamcare manahsthairyam prajayate
    | yo manahsusthiro bhavah saivavastha manonmani || 10|| purakante tu kartavyo bandho jalandharabhidhah
    | kumbhakante recakadau kartavyastuddiyanakah || 11|| adhastatkuncanemashu kanthasankocane krite |
    madhye pashcimatanena syatprano brahmanadigah || 12|| apanamurdhvamutthapya pranam kanthadadho nayan
    | yogi jaravinirmuktah shodasho vayasa bhavet ||13|| sukhasanastho dakshanadya bahistham pavanam samakrishyakeshamanakhagram
    kumbhayitva savyanadya recayet | tena kapalashodhanam vatanadigatasarvarogasarvavinashanam bhavati
    | hridayadikanthaparyantam sasvanam nasabhyam shanaih pavanamakrishya yathashakti kumbhayitva idaya
    virecya gacchamstishthankuryat | tena shleshmaharam jatharagnivardhanam bhavati | vaktrena sitkarapurvakam
    vayum grihitva yathashakti kumbhayitva nasabhyam recayet | tena kshuttrishnalasyanidra na jayate |
    jihvaya vayum grihitva yathashakti kumbhayitva nasabhyam recayet | tena gulmaplihajvarapittakshudhadini
    nashyanti || atha kumbhakah | sa dvividhah sahitah kevalashceti | recakapurakayuktah sahitah tadvivarjitah
    kevalah | kevalasiddhiparyantam sahitamabhyaset | kevalakumbhake siddhe trishu lokeshu na tasya durlabham
    bhavati | kevalakumbhakatkundalinibodho jayate | tatah krishavapuh prasannavadano nirmalalocano'bhivyaktanado
    nirmuktarogajalo jitabinduh patvagnirbhavati | antarlakshyam bahirdrishtirnimeshonmeshavarjita | esha
    sa vaishnavi mudra sarvatantreshu gopita || 14|| antarlakshyavilinacittapavano yogi sada vartate drishtya
    nishcalataraya bahiradhah pashyannapashyannapi | mudreyam khalu khecari bhavati sa lakshyaikatana
    shiva shunyashunyavivarjitam sphurati sa tattvam padam vaishnavi || 15|| ardhonmilitalocanah sthiramana
    nasagradattekshanashcandrarkavapi linatamupanayannishpandabhavottaram | jyotirupamashishabahyarahitam
    dedipyamanam param tattvam tatparamasti vastuvishayam shandilya viddhiha tat || 16|| taram jyotishi
    samyojya kincidunnamayanbhruvau | purvabhyasasya margo'yamunmanikarakah kshanat || 17|| tasmatkhecarimudramabhyaset
    | tata unmani bhavati | tato yoganidra bhavati | labdhayoganidrasya yoginah kalo nasti | shaktimadhye
    manah kritva shaktim manasamadhyagam | manasa mana alokya shandilya tvam sukhi bhava || 18|| khamadhye
    kuru catmanamatmamadhye ca kham kuru | sarvam ca khamayam kritva na kincidapi cintaya || 19|| bahyacinta
    na kartavya tathaivantaracintika | sarvacintam parityajya cinmatraparamo bhava || 20|| karpuramanale
    yadvatsaindhavam salile yatha | tatha ca liyamanam ca manastattve viliyate || 21|| jneyam sarvapratitam
    ca tajjnanam mana ucyate | jnanam jneyam samam nashtam nanyah pantha dvitiyakah || 22|| jneyavastuparityagadvilayam
    yati manasam | manase vilayam yate kaivalyamavashishyate || 23|| dvau kramau cittanashasya yogo jnanam
    munishvara | yogastadvrittirodho hi jnanam samyagavekshanam || 24|| tasminnirodhite nunamupashantam
    mano bhavet | manahspandopashantayam samsarah praviliyate || 25|| suryalokaparispandashantau vyavahritiryatha
    | shastrasajjanasamparkavairagyabhyasayogatah || 26|| anasthayam kritasthayam purvam samsaravrittishu
    | yathabhivanchitadhyanacciramekatayohitat || 27|| ekatattvadridhabhyasatpranaspando nirudhyate |
    purakadyanilayamadridhabhyasadakhedajat || 28|| ekantadhyanayogacca manahspando nirudhyate | onkaroccaranaprantashabdatattvanubhavanat
    | sushupte samvida jnate pranaspando nirudhyate || 29|| talumulagatam yatnajjihvayakramya ghantikam
    | urdhvarandhram gate prane pranaspando nirudhyate || 30|| prane galitasamvittau talurdhvam dvadashantage
    | abhyasadurdhvarandhrena pranaspando nirudhyate || 31|| dvadashangulaparyante nasagre vimale'mbare
    | samviddrishi prashamyantyam pranaspando nirudhyate || 32|| bhrumadhye tarakalokashantavantamupagate
    | cetanaikatane baddhe pranaspando nirudhyate || 33|| omityeva yadudbhutam jnanam jneyatmakam shivam
    | asamsprishtavikalpamsham pranaspando nirudhyate || 34|| cirakalam hridekantavyomasamvedananmune
    | avasanamanodhyanatpranaspando nirudhyate || 35|| ebhih kramaistathanyaishca nanasamkalpakalpitaih
    | nanadeshikavaktrasthaih pranaspando nirudhyate || 36|| akuncanena kundalinyah kavatamudghatya mokshadvaram
    vibhedayet | yena margena gantavyam taddvaram mukhenacchadya prasupta kundalini kutilakara sarpavadveshtita
    bhavati | sa shaktiryena calita syatsa tu mukto bhavati | sa kundalini kanthordhvabhage supta cedyoginam
    muktaye bhavati | bandhanayadho mudhanam | idadimargadvayam vihaya sushumnamargenagacchettadvishnoh
    paramam padam | marudabhyasanam sarvam manoyuktam samabhyaset itaratra na kartavya manovrittirmanishina
    || 37|| diva na pujayedvishnum ratrau naiva prapujayet | satatam pujayedvishnum divaratram na pujayet
    || 38|| sushiro jnanajanakah pancasrotahsamanvitah | tishthate khecari mudra tasminsthane na samshayah
    || 39|| savyadakshinanadistho madhye carati marutah | tishthatah khecari mudra tasminsthane na samshayah
    || 40|| idapingalayormadhye shunyam caivanilam graset | tishthanti khecari mudra tatra satyam pratishthitam
    || 41|| somasuryadvayormadhye niralambatale punah | samsthita vyomacakre sa mudra namna ca khecari
    || 42|| chedanacalanadahaih phalam param jihvam kritva drishtim bhrumadhye sthapya kapalakuhare jihva
    viparitaga yada bhavati tada khecari mudra jayate | jihva cittam ca khe carati tenordhvajihvah pumanamrito
    bhavati | vamapadamulena yonim sampidya dakshinapadam prasarya tam karabhyam dhritva nasabhyam vayumapurya
    kanthabandham samaropyordhvato vayum dharayet | tena sarvakleshahanih | tatah piyushamiva visham jiryate
    | kshayagulmagudavartajirnatvagadidosha nashyanti | esha pranajayopayah sarvamrityupaghatakah | vamapadaparshnim
    yonisthane niyojya dakshinacaranam vamorupari samsthapya vayumapurya hridaye cubukam nidhaya yonimakuncya
    manomadhye yathashakti dharayitva svatmanam bhavayet | tenaparokshasiddhih | bahyatpranam samakrishya
    purayitvodare sthitam | nabhimadhye ca nasagre padangushthe ca yatnatah || 43|| dharayenmanasa pranam
    sandhyakaleshu va sada | sarvarogavinirmukto bhavedyogi gataklamah || 44|| nasagre vayuvijayam bhavati
    | nabhimadhye sarvarogavinashah | padangushthadaranacchariralaghuta bhavati | rasanadvayumakrishya
    yah pibetsatatatam narah | shramadahau tu na syatam nashyanti vyadhayastatha || 45|| sandhyayorbrahmanah
    kale vayumakrishya yah pibet | trimasattasya kalyani jayate vak sarasvati || 46|| evam shanmasabhyasatsarvaroganivrittih
    | jihvaya vayumaniya jihvamule nirodhayet | yah pibedamritam vidvansakalam bhadramashnute || 47||
    atmanyatmanamidaya dharayitva bhruvontare | vibhedya tridashaharam vyadhistho'pi vimucyate || 48||
    nadibhyam vayumaropya nabhau tundasya parshvayoh | ghatikaikam vahedyastu vyadhibhih sa vimucyate
    || 49|| masamekam trisandhyam tu jihvayaropya marutam | vibhedya tridashaharam dharayettundamadhyame
    || 50|| jvarah sarve'pi nashyanti vishani vividhani ca | muhurtamapi yo nityam nasagre manasa saha
    || 51|| sarvam tarati papmanam tasya janma shatarjitam | tarasamyamatsakalavishayajnanam bhavati |
    nasagre cittasamyamadindralokajnanam | tadadhashcittasamyamadagnilokajnanam | cakshushi cittasamyamatsarvalokajnanam
    | shrotre cittasya samyamadyamalokajnanam | tatparshve samyamannirritilokajnanam | prishthabhage samyamadvarunalokajnanam
    | vamakarne samyamadvayulokajnanam | kanthe samyamatsomalokajnanam | vamacakshushi samyamacchivalokajnanam
    | murdhni samyamadbrahmalokajnanam | padadobhage samyamadatalalokajnanam | pade samyamadvitalalokajnanam
    | padasandhau samyamannitalalokajnanam | janghe samyamatsutalalokajnanam | janau samyamanmahatalalokajnanam
    | urau cittasamyamadrasatalalokajnanam | katau cittasamyamattalatalalokajnanam | nabhau cittasamyamadbhulokajnanam
    | kukshau samyamadbhuvarlokajnanam | hridi cittasya samyamatsvarlokajnanam | hridayordhvabhage cittasamyamanmaharlokajnanam
    | kanthe cittasamyamajjanolokajnanam | bhrumadhye cittasamyamattapolokajnanam | murdhni cittasamyamatsatyalokajnanam
    | dharmadharmasamyamadatitanagatajnanam | tattajjantudhvanau cittasamyamatsarvajanturutajnanam | samcitakarmani
    cittasamyamatpurvajatijnanam | paracitte cittasamyamatparacittajnanam | kayarupe cittasamyamadanyadrishyarupam
    | bale cittasamyamaddhanumadadibalam | surye cittasamyamadbhuvanajnanam | candre cittasamyamattaravyuhajnanam
    | dhruve tadgatidarshanam | svarthasamyamatpurushajnanam | nabhicakre kayavyuhajnanam | kanthakupe
    kshutpipasa nivrittih | kurmanadyam sthairyam | tare siddhadarshanam | kayakashasamyamadakashagamanam
    | tattatsthane samyamattattatsiddhayo bhavanti || 7|| atha pratyaharah | sa pancavidhah vishayeshu
    vicaratamindriyanam baladaharanam pratyaharah | yadyatpashyati tatsarvamameti pratyaharah | nityavihitakarmaphalatyagah
    pratyaharah | sarvavishayaparanmukhatvam pratyaharah | ashtadashasu marmasthaneshu kramaddharanam
    pratyaharah | padangushthagulphajanghajanurupayumedhranabhihridayakanthakupatalunasakshibhrumadhyalalatamurdhni
    sthanani | teshu kramadarohavarohakramena pratyaharet || 8|| atha dharana | sa trividha | atmani manodharanam
    daharakashe bahyakashadharanam prithivyaptejovayvakasheshu pancamurtidharanam ceti || 9|| atha dhyanam
    | taddvividham sagunam nirgunam ceti | sagunam murtidhyanam | nirgunamatmayathatmyam || 10|| atha
    samadhih | jivatmaparamatmaikyavasthatriputirahita paramanandasvarupa shuddhacaitanyatmika bhavati
    || 11|| iti prathamo'dhyayah || 1|| 2 atha ha shandilyo ha vai brahmarishishcaturshu vedeshu brahmavidyamalabhamanah
    kim nametyatharvanam bhagavantamupasannah papracchadhihi bhagavan brahmavidyam yena shreyo'vapsyamiti
    | sa hovacatharva shandilya satyam vijnanamanantam brahma yasminnidamotam ca protam ca | yasminnidam
    sam ca vicaiti sarvam yasminvijnate sarvamidam vijnatam bhavati | tadapanipadamacakshuhshrotramajihvamashariramagrahyamanirdeshyam
    | yato vaco nivartante | aprapya manasa saha | yatkevalam jnanagamyam | prajna ca yasmatprasrita purani
    | yadekamadvitiyam | akashavatsarvagatam susukshmam niranjanam nishkriyam sanmatram cidanandaikarasam
    shivam prashantamamritam tatparam ca brahma | tattvamasi | tajjnanena hi vijanihi ya eko deva atmashaktipradhanah
    sarvajnah sarveshvarah sarvabhutantaratma sarvabhutadhivasah sarvabhutanigudho bhutayoniryogaikagamyah
    | yashca vishvam srijati vishvam bibharti vishvam bhunkte sa atma | atmani tam tam lokam vijanihi
    | ma shociratmavijnani shokasyantam gamishyati || iti dvitiyo'dhyayah || 2|| 3 athainam shandilyo'tharvanam
    papraccha yadekamaksharam nishkriyam shivam sanmatram parambrahma | tasmatkathamidam vishvam jayate
    katham sthiyate kathamasmimlliyate | tanme samshayam chettumarhasiti | sa hovacatharva satyam shandilya
    parambrahma nishkriyamaksharamiti | athapyasyarupasya brahmanastrini rupani bhavanti sakalam nishkalam
    sakalanishkalam ceti | yatsatyam vijnanamanandam nishkriyam niranjanam sarvagatam susukshmam sarvatomukhamanirdeshyamamritamasti
    tadidam nishkalam rupam | athasya ya sahajastyavidya mulaprakritirmaya lohitashuklakrishna | taya
    sahayavan devah krishnapingalo mameshvara ishte | tadidamasya sakalanishkalam rupam || athaisha jnanamayena
    tapasa ciyamano'kamayata bahu syam prajayeyeti | athaitasmattapyamanatsatyakamattrinyaksharanyajayanta
    | tisro vyahritayastripada gayatri trayo vedastrayo devastrayo varnastrayo'gnayashca jayante | yo'sau
    devo bhagavansarvaishvaryasampannah sarvavyapi sarvabhutanam hridaye samnivishto mayavi mayaya kridati
    sa brahma sa vishnuh sa rudrah sa indrah sa sarve devah sarvani bhutani sa eva purastatsa eva pashcatsa
    evottaratah sa eva dakshinatah sa evadhastatsa evoparishtatsa eva sarvam | athasya devasyatmashakteratmakridasya
    bhaktanukampino dattatreyarupa surupa tanuravasa indivaradalaprakhya caturbahuraghorapapakashini |
    tadidamasya sakalam rupam || 1|| atha hainamatharvanam shandilyah papraccha bhagavansanmatram cidanandaikarasam
    kasmaducyate param brahmeti | sa hovacatharva yasmacca brihati brimhayati ca sarvam tasmaducyate parambrahmeti
    | atha kasmaducyate atmeti | yasmatsarvamapnoti sarvamadatte sarvamatti ca tasmaducyate atmeti | atha
    kasmaducyate maheshvara iti | yasmanmahata ishah shabdadhvanya catmashaktya ca mahata ishate tasmaducyate
    maheshvara iti | atha kasmaducyate dattatreya iti | yasmatsudushcaram tapastapyamanayatraye putrakamayatitaram
    tushtena bhagavata jyotirmayenatmaiva datto yasmaccanasuyayamatrestanayo'bhavattasmaducyate dattatreya
    iti | atha yo'sya niruktani veda sa sarvam veda | atha yo ha vai vidyayainam paramupaste so'hamiti
    sa brahmavidbhavati || atraite shloka bhavanti || dattatreyam shivam shantamindranilanibham prabhum
    | atmamayaratam devamavadhutam digambaram || 1|| bhasmoddhulitasarvangam jatajutadharam vibhum | caturbahumudarangam
    prafullakamalekshanam ||2|| jnanayoganidhim vishvagurum yogijanapriyam | bhaktanukampinam sarvasakshinam
    siddhasevitam || 3|| evam yah satatam dhyayeddevadevam sanatanam | sa muktah sarvapapebhyo nihshreyasamavapnuyat
    || 4|| ityom satyamityupanishat || iti tritiyo'dhyayah || 3|| om bhadram karnebhih shrunuyama deva
    bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva
  devanagari: जानूर्वोन्तरे सम्यक्कृत्वा पादतले उभे । ऋजुकायः समासीनः स्वस्तिकं तत्प्रचक्षते ॥ १॥ सव्ये
    दक्षिणगुल्फं तु पृष्ठपार्श्वे नियोजयेत् । दक्षिणेऽपि तथा सव्यं गोमुखं गोमुखं यथा ॥ २॥ अङ्गुष्ठेन निबध्नीयाद्धस्ताभ्यां
    व्युत्क्रमेण च । ऊर्वोरुपरि शाण्डिल्य कृत्वा पादतले उभे । पद्मासनं भवेदेतत्सर्वेषामपि पूजितम् ॥ ३॥
    एकं पादमथैकस्मिन्विन्यस्योरुणि संस्थितः । इतरस्मिंस्तथा चोरूं वीरासनमुदीरितम् ॥ ४॥ दक्षिणं सव्यगुल्फेन
    दक्षिणेन तथेतरम् । हस्तौ च जान्वोः संस्थाप्य स्वाङ्गुलीश्च प्रसार्य च ॥ ५॥ व्यक्तवक्त्रो निरीक्षेत
    नासाग्रं सुसमाहितः । सिंहासनं भवेदेतत्पूजितं योगिभिः सदा ॥ ६॥ योनीं वामेन सम्पीड्य मेढ्राद्रुपरि दक्षिणम्
    । भ्रूमध्ये च मनोलक्ष्यं सिद्धासनमिदं भवेत् ॥ ७॥ गुल्फौ तु वृषणस्याधः सीवन्याः पार्श्वयोः क्षिपेत्
    । पादपार्श्वे तु पाणिभ्यां दृढं बध्वा सुनिश्चलम् । भद्रासनं भवेदेतत्सर्वव्याधिविषापहम् ॥ ८॥ सम्पीड्य
    सीविनीं सूक्ष्मां गुल्फेनैव तु सव्यतः । सव्यं दक्षिणगुल्फेन मुक्तासनमुदीरितम् ॥ ९॥ अवष्टभ्य धरां सम्यक्तलाभ्यां
    तु करद्वयोः । हस्तयोः कूर्परौ चापि स्थापयेन्नाभिपार्श्वयओः ॥ १०॥ समुन्नतशिरःपादो दण्डवद्व्योम्नि संस्थितः
    । मयूरासनमेतत्तु सर्वपापप्रणाशनम् ॥ ११॥ शरीरान्तर्गताः सर्वे रोगा विनश्यन्ति । विषाणि जीर्यन्ते ।
    येन केनासनेन सुखधारणं भवत्यशक्तस्तत्समाचरेत् । येनासनं विजितं जगत्त्रयं तेन विजितं भवति । यमनियमाभ्यां
    संयुक्तः पुरुषः प्राणायामं चरेत् । तेन नाड्यः शुद्धा भवन्ति ॥ ३॥ अथ हैनमथर्वाणं शाण्डिल्यः पप्रच्छ
    केनोपायेन नाड्यः शुद्धाः स्युः । नाड्यः कतिसंख्याकाः । तासामुत्पत्तिः कीदृशी । तासु कति वयवस्तिष्ठन्ति
    । तेषां कानि स्थानानि । तत्कर्माणि कानि । देहे यानि यानि विज्ञातव्यानि तत्सर्वं मे ब्रूहीति । स होवाच
    अथर्वाण अथेदं शरीरं षण्णवत्यङ्गुलात्मकं भवति । शरीरात्प्राणो द्वादशाङ्गुलाधिको भवति । शरीरस्थं प्राणमग्निना
    सह योगाभ्यासेन समं न्यूनं वा यः करोति स योगिपुङ्गवो भवति । देहमध्ये शिखिस्थानं त्रिकोणं तप्तजाम्बूनदप्रभं
    मनुष्याणाम् । चतुष्पदां चतुरस्रम् । विहङ्गानां वृत्ताकारम् । तन्मध्ये शुभा तन्वी पावकी शिखा तिष्ठति
    । गुदाद्व्यङ्गुलादूर्ध्वं मेढ्राद्व्यङ्गुलादधो देहमध्यं मनुष्याणां भवति । चतुष्पदां हृन्मध्यम् । विहङ्गानां
    तुङ्गमध्यम् । देहमध्यं नवाङ्गुलं चतुरङ्गुलमुत्सेधायतमण्डाकृति । तन्मध्ये नाभिः । तत्र द्वादशारयुतं
    चक्रम् । तच्चक्रमध्ये पुण्यपापप्रचोदितो जीवो भ्रमति । तन्तुपञ्जरमध्यस्थलूतिका यथा भ्रमति तथा चासौ
    तत्र प्राणश्चरति । देहेऽस्मिञ्जीवः प्राणारूढो भवेत् । नाभेस्तिर्यगधऊर्ध्वं कुण्डलिनीस्थानम् । अष्टप्रकृतिरूपाष्टधा
    कुण्डलीकृता कुण्डलिनी शक्तिर्भवति । यथावद्वायुसंचारं जलान्नादीनि परितः स्कन्धः पार्श्वेषु निरुध्यैनं
    मुखेनैव समावेष्ट्य ब्रह्मरन्ध्रं योगकाले चापानेनाग्निना च स्फुरति । हृदयाकाशे महोज्ज्वला ज्ञानरूपा
    भवति । मध्यस्थकुण्डलिनीमाश्रित्य मुख्या नाड्यश्चतुर्दश भवन्ति । इडा पिङ्गला सुषुम्ना सरस्वती वारुणी
    पूषा हस्तिजिह्वा यशस्विनी विश्वोदरी कुहूः शङ्खिनी पयस्विनी अलम्बुसा गान्धारीति नाड्यचतुर्दश भवन्ति
    । तत्र सुषुम्ना विश्वधारिणी मोक्षमार्गेति चाचक्षते । गुदस्य पृष्ठभागे वीणादण्डाश्रिता मूर्धपर्यन्तं
    ब्रह्मरन्ध्रे विज्ञेया व्यक्ता सूक्ष्मा वैष्णवी भवति । सुषुम्नायाः सव्यभागे इडा तिष्ठति । दक्षिणभागे
    पिङ्गला इडायां चन्द्रश्चरति । पिङ्गलायां रविः । तमोरूपश्चन्द्रः । रजोरूपो रविः । विषभागो रविः । अमृतभागश्चन्द्रमाः
    । तावेव सर्वकालं धत्ते । सुषुम्ना कालभोक्त्री भवति । सुषुम्ना पृष्ठपार्श्वयोः सरस्वतीकुहू भवतः । यशस्विनीकुहूमध्ये
    वारुणी प्रतिष्ठिता भवति । पूषासरस्वतीमध्ये पयस्विनी भवति । गान्धारीसरस्वतिमध्ये यशस्विनी भवति । कन्दमयेऽलम्बुसा
    भवति। सुषुम्नापूर्वभागे मेढ्रान्तं कुहूर्भवति । कुण्डलिन्या अधश्चोर्ध्वं वारुणी सर्वगामिनी भवति ।
    यशस्विनी सौम्या च पादाङ्गुष्ठान्तमिष्यते । पिङ्गला चोर्ध्वगा याम्यनासान्तं भवति । पिङ्गलायाः पृष्ठतो
    याम्यनेत्रानतं पूषा भवति । याम्यकर्णान्तं यशस्विनी भवति । जिह्वाया ऊर्ध्वानतं सरस्वती भवति । आसव्यकर्णान्तमूर्ध्वगा
    शङ्खिनी भवति । इडापृष्ठभागात्सव्यनेत्रान्तगा गान्धारी भवति । पायुमूलादधोर्ध्वगालम्बुसा भवति । एताश्च
    चतुर्दशसु नाडीष्वन्या नाड्यः संभवन्ति । तास्वन्यास्तास्वन्या भवन्तीति विज्ञेयाः ॥ यथाश्वत्थादिपत्रं
    शिराभिर्व्याप्तमेवं शरीरं नाडीभिर्व्याप्तम् । प्राणापानसमानोदानव्याना नागकूर्मकृकरदेवदत्तधनञ्जया एते
    दश वायवः सर्वासु नाडीषु चरन्ति । आस्यनासिकाकण्ठनाभिपादाङ्गुष्ठद्वयकुण्डल्यधश्चोर्ध्वभागेषु प्राणः
    संचरति । श्रोत्राक्षिकटिगुल्फघ्राणगलस्फिग्देशेषु व्यानः संचरति । गुदमेढ्रोरुजानूदरवृषणकटिजङ्घानाभिगुदाग्न्यगारेष्वपानः
    संचरति । सर्वसन्धिस्थ उदानः । पादहस्तयोरपि सर्वगात्रेषु सर्वव्यापी समानः । भुक्तान्नरसादिकं गात्रेग्निना
    सह व्यापयन्द्विसप्ततिसहस्रेषु नाडीमार्गेषु चरन्समानवायुरग्निना सह साङ्गोपाङ्गकलेवरं व्याप्नोति । नागादिवायवः
    पञ्चत्वगस्थ्यादिसंभवाः । तुन्दस्थं जलमन्नं च रसादिषु समीरितं तुन्दमध्यगतः प्रागस्तानि पृथक्कुर्यात्
    । अग्नेरुपरि जलं स्थाप्य जलोपर्यन्नादीनि संस्थाप्य स्वयमपानं सम्प्राप्य तेनैव सह मारुतः प्रयाति देहमध्यगतं
    ज्वलनम् । वायुना पालितो वह्निरपानेन शनैर्देहमध्ये ज्वलति । ज्वलनो ज्वालाभिः प्राणेन कोष्ठमध्यगतं जलमत्युष्णमकरोत्
    । जलोपरि समर्पितव्यञ्जनसंयुक्तमन्नं वह्निसंयुक्तवारिणा पक्वमकरोत् । तेन स्वेदमूत्रजलरक्तवीर्यरूपरसपुरीषादिकं
    प्राणः पृथक्कुर्यात् । समानवायुना सह सर्वासु नाडीषु रसं व्यापयञ्छ्वासरूपेण देहे वायुश्चरति । नवभिर्व्योमरन्ध्रैः
    शरीरस्य वायवः कुर्वन्ति विण्मूत्रादिविसर्जनम् । निश्वासोच्छ्वासकासश्च प्राणकर्मोच्यते । विण्मूत्रादिविसर्जनमपानवायुकर्म
    । हानोपादानचेष्टादि व्यानकर्म । देहस्योन्नयनादिकमुदानकर्म । शरीरपोषणादिकं समानकर्म । उद्गारादि नागकर्म
    । निमीलनादि कूर्मकर्म । क्षुत्करणं कृकरकर्म । तन्द्रा देवदत्तकर्म । श्लेष्मादि धनञ्जयकर्म । एवं नाडीस्थानं
    वायुस्थानं तत्कर्म च सम्यग्ज्ञात्वा नाडीसंशोधनं कुर्यात् ॥ ४॥ यमनियमयुतः पुरुषः सर्वसङ्गविवर्जितः
    कृतविद्यः सत्यधर्मरतो जितक्रोधो गुरुशुश्रूषानिरतः पितृमातृविधेयः स्वाश्रमोक्तसदाचारविद्वच्छिक्षितः
    फलमूलोदकान्वितं तपोवनं प्राप्य रम्यदेशे ब्रह्मघोषसमन्विते स्वधर्मनिरतब्रह्मवित्समावृते फलमूलपुष्पवारिभिः
    सुसम्पूर्णे देवायतने नदीतीरे ग्रामे नगरे वापि सुशोभनमठं नात्युच्चनीचायतमल्पद्वारं गोमयादिलिप्तं सर्वरक्षासमन्वितं
    कृत्वा तत्र वेदान्तश्रवणं कुर्वन्योगं समारभेत् । आदौ विनायकं सम्पूज्य स्वेष्टदेवतां नत्वा पूर्वोक्तासने
    स्थित्वा प्राङ्मुख उदङ्मुखो वापि मृद्वासनेषु जितासनगतो विद्वान्समग्रीवशिरोनासाग्रदृग्भ्रूमध्ये शशभृद्बिंबं
    पश्यन्नेत्राभ्याममृतं पिबेत् । द्वादशमात्रया इडया वायुमापूर्योदरे स्थितं ज्वालावलीयुतं रेफबिन्दुयुक्तमग्निमण्डलयुतं
    ध्यायेद्रेचयेत्पिङ्गलया । पुनः पिङ्गलयापूर्य कुम्भित्वा रेचयेदिडया । त्रिचतुस्त्रिचतुःसप्तत्रिचातुर्मासपर्यन्तं
    त्रिसन्धिषु तदन्तरालेषु च षट्कृत्व आचरेन्नाडीशुद्धिर्भवति । ततः शरीरे लघुदीप्तिवह्निवृद्धिनादाभिव्यक्तिर्भवति
    ॥ ५॥ प्राणापानसमायोगः प्राणायामो भवति । रेचकपूरककुम्भकभेदेन स त्रिविधः । ते वर्णात्मकाः । तस्मात्प्रणव
    एव प्राणायामः पद्माद्यासनस्थः पुमान्नासाग्रे शशभृद्बिम्बज्योत्स्नाजालवितानिताकारमूर्ती रक्ताङ्गी हंसवाहिनी
    दण्डहस्ता बाला गायत्री भवति । उकारमूर्तिः श्वेताङ्गी तार्क्ष्यवाहिनी युवती चक्रहस्ता सावित्री भवति
    । मकारमूर्तिः कृष्णाङ्गी वृषभवाहिनी वृद्धा त्रिशूलधारिणी सरस्वती भवति । अकारादित्रयाणां सर्वकारणमेकाक्षरं
    परंज्योतिः प्रणवं भवतीति ध्यायेत् । इडया बाह्याद्वायुमापूर्य षोडशमात्राभिरकारं चिन्तयन्पूरितं वायुं
    चतुःषष्टिमात्राभिः कुम्भयित्वोकारं ध्यायन्पूरितं पिङ्गलया द्वात्रिंशन्मात्रया मकारमूर्तिध्यानेनैवं
    क्रमेण पुनः पुनः कुर्यात् ॥ ६॥ अथासनदृढो योगी वशी मितहिताशनः सुषुम्नानाडीस्थमलशोषार्थं योगी बद्धपद्मासनो
    वायुं चन्द्रेणापूर्य यथाशक्ति कुम्भयित्वा सूर्येण रेचयित्वा पुनः सूर्येणापूर्य कुम्भयित्वा चन्द्रेण
    विरेच्य यया त्यजेत्तया सम्पूर्य धारयेत् । तदेते श्लोका भवन्ति । प्राणं प्रागिडया पिबेन्नियमितं भूयोऽन्यया
    रेचयेत्पीत्वा पिङ्गलया समीरणमथो बद्ध्वा त्यजेद्वामया । सूर्याचन्द्रमसोरनेन विधिनाऽभ्यासं सदा तन्वतां
    शुद्धा नाडिगणा भवन्ति यमिनां मासत्रयादूर्ध्वतः ॥ १॥ प्रातर्मध्यन्दिने सायमर्धरात्रे तु कुम्भकान् ।
    शनैरशीतिपर्यन्तं चतुर्वारं समभ्यसेत् ॥ २॥ कनीयसि भवेत्स्वेदः कंपो भवति मध्यमे । उत्तिष्ठत्त्युत्तमे
    प्राणरोधे पद्मासनं महत् ॥ ३॥ जलेन श्रमजातेन गात्रमर्दनमाचरेत् । दृढता लघुता चापि तस्य गात्रस्य जायते
    ॥ ४॥ अभ्यासकाले प्रथमं शस्तं क्षीराज्यभोजनम् । ततोऽभ्यासे स्थिरीभूते न तावन्नियमग्रहः ॥ ५॥ यथा सिंहो
    गजो व्याघ्रो भवेद्वश्यः शनैः शनैः । तथैव सेवितो वायुरन्यथा हन्ति साधकम् ॥ ६॥ युक्तं युक्तं त्यजेद्वायुं
    युक्तं युक्तं च पूरयेत् । युक्तं युक्तं च बध्नीयादेवं सिद्धिमवाप्नुयात् ॥ ७॥ यथेष्टधारणाद्वायोरनलस्य
    प्रदीपनम् । नादाभिव्यक्तिरारोग्यं जायते नाडिशोधनात् ॥ ८॥ विधिवत्प्राणसंयामैर्नाडीचक्रे विशोधिते ।
    सुषुम्नावदनं भित्त्वा सुखाद्विशति मारुतः ॥ ९॥ मारुते मध्यसंचारे मनःस्थैर्यं प्रजायते । यो मनःसुस्थिरो
    भावः सैवावस्था मनोन्मनी ॥ १०॥ पूरकान्ते तु कर्तव्यो बन्धो जालन्धराभिधः । कुम्भकान्ते रेचकादौ कर्तव्यस्तूड्डियाणकः
    ॥ ११॥ अधस्तात्कुञ्चनेमाशु कण्ठसङ्कोचने कृते । मध्ये पश्चिमतानेन स्यात्प्राणो ब्रह्मनाडिगः ॥ १२॥ अपानमूर्ध्वमुत्थाप्य
    प्राणं कण्ठादधो नयन् । योगी जराविनिर्मुक्तः षोडशो वयसा भवेत् ॥१३॥ सुखासनस्थो दक्षनाड्या बहिस्थं पवनं
    समाकृष्याकेशमानखाग्रं कुम्भयित्वा सव्यनाड्या रेचयेत् । तेन कपालशोधनं वातनाडीगतसर्वरोगसर्वविनाशनं भवति
    । हृदयादिकण्ठपर्यन्तं सस्वनं नासाभ्यां शनैः पवनमाकृष्य यथाशक्ति कुम्भयित्वा इडया विरेच्य गच्छंस्तिष्ठन्कुर्यात्
    । तेन श्लेष्महरं जठराग्निवर्धनं भवति । वक्त्रेण सीत्कारपूर्वकं वायुं गृहीत्वा यथाशक्ति कुम्भयित्वा
    नासाभ्यां रेचयेत् । तेन क्षुत्तृष्णालस्यनिद्रा न जायते । जिह्वया वायुं गृहीत्वा यथाशक्ति कुम्भयित्वा
    नासाभ्यां रेचयेत् । तेन गुल्मप्लीहज्वरपित्तक्षुधादीनि नश्यन्ति ॥ अथ कुम्भकः । स द्विविधः सहितः केवलश्चेति
    । रेचकपूरकयुक्तः सहितः तद्विवर्जितः केवलः । केवलसिद्धिपर्यन्तं सहितमभ्यसेत् । केवलकुम्भके सिद्धे त्रिषु
    लोकेषु न तस्य दुर्लभं भवति । केवलकुम्भकात्कुण्डलिनीबोधो जायते । ततः कृशवपुः प्रसन्नवदनो निर्मललोचनोऽभिव्यक्तनादो
    निर्मुक्तरोगजालो जितबिन्दुः पट्वग्निर्भवति । अन्तर्लक्ष्यं बहिर्दृष्टिर्निमेषोन्मेषवर्जिता । एषा सा
    वैष्णवी मुद्रा सर्वतन्त्रेषु गोपिता ॥ १४॥ अन्तर्लक्ष्यविलीनचित्तपवनो योगी सदा वर्तते दृष्ट्या निश्चलतारया
    बहिरधः पश्यन्नपश्यन्नपि । मुद्रेयं खलु खेचरी भवति सा लक्ष्यैकताना शिवा शून्याशून्यविवर्जितं स्फुरति
    सा तत्त्वं पदं वैष्णवी ॥ १५॥ अर्धोन्मीलितलोचनः स्थिरमना नासाग्रदत्तेक्षणश्चन्द्रार्कावपि लीनतामुपनयन्निष्पन्दभावोत्तरम्
    । ज्योतीरूपमशीषबाह्यरहितं देदीप्यमानं परं तत्त्वं तत्परमस्ति वस्तुविषयं शाण्डिल्य विद्धीह तत् ॥ १६॥
    तारं ज्योतिषि संयोज्य किञ्चिदुन्नमयन्भ्रुवौ । पूर्वाभ्यासस्य मार्गोऽयमुन्मनीकारकः क्षणात् ॥ १७॥ तस्मात्खेचरीमुद्रामभ्यसेत्
    । तत उन्मनी भवति । ततो योगनिद्रा भवति । लब्धयोगनिद्रस्य योगिनः कालो नास्ति । शक्तिमध्ये मनः कृत्वा
    शक्तिं मानसमध्यगाम् । मनसा मन आलोक्य शाण्डिल्य त्वं सुखी भव ॥ १८॥ खमध्ये कुरु चात्मानमात्ममध्ये च
    खं कुरु । सर्वं च खमयं कृत्वा न किञ्चिदपि चिन्तय ॥ १९॥ बाह्यचिन्ता न कर्तव्या तथैवान्तरचिन्तिका ।
    सर्वचिन्तां परित्यज्य चिन्मात्रपरमो भव ॥ २०॥ कर्पूरमनले यद्वत्सैन्धवं सलिले यथा । तथा च लीयमानं च
    मनस्तत्त्वे विलीयते ॥ २१॥ ज्ञेयं सर्वप्रतीतं च तज्ज्ञानं मन उच्यते । ज्ञानं ज्ञेयं समं नष्टं नान्यः
    पन्था द्वितीयकः ॥ २२॥ ज्ञेयवस्तुपरित्यागाद्विलयं याति मानसम् । मानसे विलयं याते कैवल्यमवशिष्यते ॥
    २३॥ द्वौ क्रमौ चित्तनाशस्य योगो ज्ञानं मुनीश्वर । योगस्तद्वृत्तिरोधो हि ज्ञानं सम्यगवेक्षणम् ॥ २४॥
    तस्मिन्निरोधिते नूनमुपशान्तं मनो भवेत् । मनःस्पन्दोपशान्तायं संसारः प्रविलीयते ॥ २५॥ सूर्यालोकपरिस्पन्दशान्तौ
    व्यवहृतिर्यथा । शास्त्रसज्जनसम्पर्कवैराग्याभ्यासयोगतः ॥ २६॥ अनास्थायां कृतास्थायां पूर्वं संसारवृत्तिषु
    । यथाभिवाञ्छितध्यानाच्चिरमेकतयोहितात् ॥ २७॥ एकतत्त्वदृढाभ्यासात्प्राणस्पन्दो निरुध्यते । पूरकाद्यनिलायामादृढाभ्यासदखेदजात्
    ॥ २८॥ एकान्तध्यानयोगाच्च मनःस्पन्दो निरुध्यते । ओङ्कारोच्चारणप्रान्तशब्दतत्त्वानुभावनात् । सुषुप्ते
    संविदा ज्ञाते प्राणस्पन्दो निरुध्यते ॥ २९॥ तालुमूलगतां यत्नाज्जिह्वयाक्रम्य घण्टिकाम् । ऊर्ध्वरन्ध्रं
    गते प्राणे प्राणस्पन्दो निरुध्यते ॥ ३०॥ प्राणे गलितसंवित्तौ तालूर्ध्वं द्वादशान्तगे । अभ्यासादूर्ध्वरन्ध्रेण
    प्राणस्पन्दो निरुध्यते ॥ ३१॥ द्वादशाङ्गुलपर्यन्ते नासाग्रे विमलेऽम्बरे । संविद्दृशि प्रशाम्यन्त्यां
    प्राणस्पन्दो निरुध्यते ॥ ३२॥ भ्रूमध्ये तारकालोकशान्तावन्तमुपागते । चेतनैकतने बद्धे प्राणस्पन्दो निरुध्यते
    ॥ ३३॥ ओमित्येव यदुद्भूतं ज्ञानं ज्ञेयात्मकं शिवम् । असंस्पृष्टविकल्पांशं प्राणस्पन्दो निरुध्यते ॥
    ३४॥ चिरकालं हृदेकान्तव्योमसंवेदनान्मुने । अवासनमनोध्यानात्प्राणस्पन्दो निरुध्यते ॥ ३५॥ एभिः क्रमैस्तथान्यैश्च
    नानासंकल्पकल्पितैः । नानादेशिकवक्त्रस्थैः प्राणस्पन्दो निरुध्यते ॥ ३६॥ आकुञ्चनेन कुण्डलिन्याः कवाटमुद्घाट्य
    मोक्षद्वारं विभेदयेत् । येन मार्गेण गन्तव्यं तद्द्वारं मुखेनाच्छाद्य प्रसुप्ता कुण्डलिनी कुटिलाकारा
    सर्पवद्वेष्टिता भवति । सा शक्तिर्येन चालिता स्यात्स तु मुक्तो भवति । सा कुण्डलिनी कण्ठोर्ध्वभागे सुप्ता
    चेद्योगिनां मुक्तये भवति । बन्धनायाधो मूढानाम् । इडादिमार्गद्वयं विहाय सुषुम्नामार्गेणागच्छेत्तद्विष्णोः
    परमं पदम् । मरुदभ्यसनं सर्वं मनोयुक्तं समभ्यसेत् इतरत्र न कर्तव्या मनोवृत्तिर्मनीषिणा ॥ ३७॥ दिवा न
    पूजयेद्विष्णुं रात्रौ नैव प्रपूजयेत् । सततं पूजयेद्विष्णुं दिवारात्रं न पूजयेत् ॥ ३८॥ सुषिरो ज्ञानजनकः
    पञ्चस्रोतःसमन्वितः । तिष्ठते खेचरी मुद्रा तस्मिन्स्थाने न संशयः ॥ ३९॥ सव्यदक्षिणनाडीस्थो मध्ये चरति
    मारुतः । तिष्ठतः खेचरी मुद्रा तस्मिन्स्थाने न संशयः ॥ ४०॥ इडापिङ्गलयोर्मध्ये शून्यं चैवानिलं ग्रसेत्
    । तिष्ठन्ती खेचरी मुद्रा तत्र सत्यं प्रतिष्ठितम् ॥ ४१॥ सोमसूर्यद्वयोर्मध्ये निरालम्बतले पुनः । संस्थिता
    व्योमचक्रे सा मुद्रा नाम्ना च खेचरी ॥ ४२॥ छेदनचालनदाहैः फलां परां जिह्वां कृत्वा दृष्टिं भ्रूमध्ये
    स्थाप्य कपालकुहरे जिह्वा विपरीतगा यदा भवति तदा खेचरी मुद्रा जायते । जिह्वा चित्तं च खे चरति तेनोर्ध्वजिह्वः
    पुमानमृतो भवति । वामपादमूलेन योनिं सम्पीड्य दक्षिणपादं प्रसार्य तं कराभ्यां धृत्वा नासाभ्यां वायुमापूर्य
    कण्ठबन्धं समारोप्योर्ध्वतो वायुं धारयेत् । तेन सर्वक्लेशहानिः । ततः पीयूषमिव विषं जीर्यते । क्षयगुल्मगुदावर्तजीर्णत्वगादिदोषा
    नश्यन्ति । एष प्राणजयोपायः सर्वमृत्यूपघातकः । वामपादपार्ष्णिं योनिस्थाने नियोज्य दक्षिणचरणं वामोरूपरि
    संस्थाप्य वायुमापूर्य हृदये चुबुकं निधाय योनिमाकुञ्च्य मनोमध्ये यथाशक्ति धारयित्वा स्वात्मानं भावयेत्
    । तेनापरोक्षसिद्धिः । बाह्यात्प्राणं समाकृष्य पूरयित्वोदरे स्थितम् । नाभिमध्ये च नासाग्रे पदाङ्गुष्ठे
    च यत्नतः ॥ ४३॥ धारयेन्मनसा प्राणं सन्ध्याकालेषु वा सदा । सर्वरोगविनिर्मुक्तो भवेद्योगी गतक्लमः ॥ ४४॥
    नासाग्रे वायुविजयं भवति । नाभिमध्ये सर्वरोगविनाशः । पादाङ्गुष्ठदारणाच्छरीरलघुता भवति । रसनाद्वायुमाकृष्य
    यः पिबेत्सतततं नरः । श्रमदाहौ तु न स्यातां नश्यन्ति व्याधयस्तथा ॥ ४५॥ सन्ध्ययोर्ब्राह्मणः काले वायुमाकृष्य
    यः पिबेत् । त्रिमासात्तस्य कल्याणी जायते वाक् सरस्वती ॥ ४६॥ एवं षण्मासाभ्यासात्सर्वरोगनिवृत्तिः ।
    जिह्वया वायुमानीय जिह्वामूले निरोधयेत् । यः पिबेदमृतं विद्वान्सकलं भद्रमश्नुते ॥ ४७॥ आत्मन्यात्मानमिडया
    धारयित्वा भ्रुवोन्तरे । विभेद्य त्रिदशाहारं व्याधिस्थोऽपि विमुच्यते ॥ ४८॥ नाडीभ्यां वायुमारोप्य नाभौ
    तुन्दस्य पार्श्वयोः । घटिकैकां वहेद्यस्तु व्याधिभिः स विमुच्यते ॥ ४९॥ मासमेकं त्रिसन्ध्यं तु जिह्वयारोप्य
    मारुतम् । विभेद्य त्रिदशाहारं धारयेत्तुन्दमध्यमे ॥ ५०॥ ज्वराः सर्वेऽपि नश्यन्ति विषाणि विविधानि च
    । मुहूर्तमपि यो नित्यं नासाग्रे मनसा सह ॥ ५१॥ सर्वं तरति पाप्मानं तस्य जन्म शतार्जितम् । तारसंयमात्सकलविषयज्ञानं
    भवति । नासाग्रे चित्तसंयमादिन्द्रलोकज्ञानम् । तदधश्चित्तसंयमादग्निलोकज्ञानम् । चक्षुषि चित्तसंयमात्सर्वलोकज्ञानम्
    । श्रोत्रे चित्तस्य संयमाद्यमलोकज्ञानम् । तत्पार्श्वे संयमान्निरृतिलोकज्ञानम् । पृष्ठभागे संयमाद्वरुणलोकज्ञानम्
    । वामकर्णे संयमाद्वायुलोकज्ञानम् । कण्ठे संयमात्सोमलोकज्ञानम् । वामचक्षुषि संयमाच्छिवलोकज्ञानम् ।
    मूर्ध्नि संयमाद्ब्रह्मलोकज्ञानम् । पादादोभागे संयमादतललोकज्ञानम् । पादे संयमाद्वितललोकज्ञानम् । पादसन्धौ
    संयमान्नितललोकज्ञानम् । जङ्घे संयमात्सुतललोकज्ञानम् । जानौ संयमान्महातललोकज्ञानम् । ऊरौ चित्तसंयमाद्रसातललोकज्ञानम्
    । कटौ चित्तसंयमात्तलातललोकज्ञानम् । नाभौ चित्तसंयमाद्भूलोकज्ञानम् । कुक्षौ संयमाद्भुवर्लोकज्ञानम्
    । हृदि चित्तस्य संयमात्स्वर्लोकज्ञानम् । हृदयोर्ध्वभागे चित्तसंयमान्महर्लोकज्ञानम् । कण्ठे चित्तसंयमाज्जनोलोकज्ञानम्
    । भ्रूमध्ये चित्तसंयमात्तपोलोकज्ञानम् । मूर्ध्नि चित्तसंयमात्सत्यलोकज्ञानम् । धर्माधर्मसंयमादतीतानागतज्ञानम्
    । तत्तज्जन्तुध्वनौ चित्तसंयमात्सर्वजन्तुरुतज्ञानम् । संचितकर्मणि चित्तसंयमात्पूर्वजातिज्ञानम् । परचित्ते
    चित्तसंयमात्परचित्तज्ञानम् । कायरूपे चित्तसंयमादन्यादृश्यरूपम् । बले चित्तसंयमाद्धनुमदादिबलम् । सूर्ये
    चित्तसंयमाद्भुवनज्ञानम् । चन्द्रे चित्तसंयमात्ताराव्यूहज्ञानम् । ध्रुवे तद्गतिदर्शनम् । स्वार्थसंयमात्पुरुषज्ञानम्
    । नाभिचक्रे कायव्यूहज्ञानम् । कण्ठकूपे क्षुत्पिपासा निवृत्तिः । कूर्मनाड्यां स्थैर्यम् । तारे सिद्धदर्शनम्
    । कायाकाशसंयमादाकाशगमनम् । तत्तत्स्थाने संयमात्तत्तत्सिद्धयो भवन्ति ॥ ७॥ अथ प्रत्याहारः । स पञ्चविधः
    विषयेषु विचरतामिन्द्रियाणां बलादाहरणं प्रत्याहरः । यद्यत्पश्यति तत्सर्वमामेति प्रत्याहारः । नित्यविहितकर्मफलत्यागः
    प्रत्याहारः । सर्वविषयपराङ्मुखत्वं प्रत्याहारः । अष्टादशसु मर्मस्थानेषु क्रमाद्धारणं प्रत्याहारः ।
    पादाङ्गुष्ठगुल्फजङ्घाजानूरुपायुमेढ्रनाभिहृदयकण्ठकूपतालुनासाक्षिभ्रूमध्यललाटमूर्ध्नि स्थानानि । तेषु
    क्रमादारोहावरोहक्रमेण प्रत्याहरेत् ॥ ८॥ अथ धारणा । सा त्रिविधा । आत्मनि मनोधारणं दहराकाशे बाह्याकाशधारणं
    पृथिव्यप्तेजोवाय्वाकाशेषु पञ्चमूर्तिधारणं चेति ॥ ९॥ अथ ध्यानम् । तद्द्विविधं सगुणं निर्गुणं चेति ।
    सगुणं मूर्तिध्यानम् । निर्गुणमात्मयाथात्म्यम् ॥ १०॥ अथ समाधिः । जीवात्मपरमात्मैक्यावस्थात्रिपुटीरहिता
    परमानन्दस्वरूपा शुद्धचैतन्यात्मिका भवति ॥ ११॥ इति प्रथमोऽध्यायः ॥ १॥ २ अथ ह शाण्डिल्यो ह वै ब्रह्मऋषिश्चतुर्षु
    वेदेषु ब्रह्मविद्यामलभमानः किं नामेत्यथर्वाणं भगवन्तमुपसन्नः पप्रच्छाधीहि भगवन् ब्रह्मविद्यां येन
    श्रेयोऽवाप्स्यामीति । स होवाचाथर्वा शाण्डिल्य सत्यं विज्ञानमनन्तं ब्रह्म यस्मिन्निदमोतं च प्रोतं च
    । यस्मिन्निदं सं च विचैति सर्वं यस्मिन्विज्ञाते सर्वमिदं विज्ञातं भवति । तदपाणिपादमचक्षुःश्रोत्रमजिह्वमशरीरमग्राह्यमनिर्देश्यम्
    । यतो वाचो निवर्तन्ते । अप्राप्य मनसा सह । यत्केवलं ज्ञानगम्यम् । प्रज्ञा च यस्मात्प्रसृता पुराणी
    । यदेकमद्वितीयम् । आकाशवत्सर्वगतं सुसूक्ष्मं निरञ्जनं निष्क्रियं सन्मात्रं चिदानन्दैकरसं शिवं प्रशान्तममृतं
    तत्परं च ब्रह्म । तत्त्वमसि । तज्ज्ञानेन हि विजानीहि य एको देव आत्मशक्तिप्रधानः सर्वज्ञः सर्वेश्वरः
    सर्वभूतान्तरात्मा सर्वभूताधिवासः सर्वभूतनिगूढो भूतयोनिर्योगैकगम्यः । यश्च विश्वं सृजति विश्वं बिभर्ति
    विश्वं भुङ्क्ते स आत्मा । आत्मनि तं तं लोकं विजानीहि । मा शोचीरात्मविज्ञानी शोकस्यान्तं गमिष्यति ॥
    इति द्वितीयोऽध्यायः ॥ २॥ ३ अथैनं शाण्डिल्योऽथर्वाणं पप्रच्छ यदेकमक्षरं निष्क्रियं शिवं सन्मात्रं परंब्रह्म
    । तस्मात्कथमिदं विश्वं जायते कथं स्थीयते कथमस्मिंल्लीयते । तन्मे संशयं छेत्तुमर्हसीति । स होवाचाथर्वा
    सत्यं शाण्डिल्य परंब्रह्म निष्क्रियमक्षरमिति । अथाप्यस्यारूपस्य ब्रह्मणस्त्रीणि रूपाणि भवन्ति सकलं
    निष्कलं सकलनिष्कलं चेति । यत्सत्यं विज्ञानमानन्दं निष्क्रियं निरञ्जनं सर्वगतं सुसूक्ष्मं सर्वतोमुखमनिर्देश्यममृतमस्ति
    तदिदं निष्कलं रूपम् । अथास्य या सहजास्त्यविद्या मूलप्रकृतिर्माया लोहितशुक्लकृष्णा । तया सहायवान् देवः
    कृष्णपिङ्गलो ममेश्वर ईष्टे । तदिदमस्य सकलनिष्कलं रूपम् ॥ अथैष ज्ञानमयेन तपसा चीयमानोऽकामयत बहु स्यां
    प्रजायेयेति । अथैतस्मात्तप्यमानात्सत्यकामात्त्रीण्यक्षराण्यजायन्त । तिस्रो व्याहृतयस्त्रिपदा गायत्री
    त्रयो वेदास्त्रयो देवास्त्रयो वर्णास्त्रयोऽग्नयश्च जायन्ते । योऽसौ देवो भगवान्सर्वैश्वर्यसम्पन्नः
    सर्वव्यापी सर्वभूतानां हृदये संनिविष्टो मायावी मायया क्रीडति स ब्रह्मा स विष्णुः स रुद्रः स इन्द्रः
    स सर्वे देवाः सर्वाणि भूतानि स एव पुरस्तात्स एव पश्चात्स एवोत्तरतः स एव दक्षिणतः स एवाधस्तात्स एवोपरिष्टात्स
    एव सर्वम् । अथास्य देवस्यात्मशक्तेरात्मक्रीडस्य भक्तानुकंपिनो दत्तात्रेयरूपा सुरूपा तनूरवासा इन्दीवरदलप्रख्या
    चतुर्बाहुरघोरापापकशिनी । तदिदमस्य सकलं रूपम् ॥ १॥ अथ हैनमथर्वाणं शाण्डिल्यः पप्रच्छ भगवन्सन्मात्रं
    चिदानन्दैकरसं कस्मादुच्यते परं ब्रह्मेति । स होवाचाथर्वा यस्माच्च बृहति बृंहयति च सर्वं तस्मादुच्यते
    परंब्रह्मेति । अथ कस्मादुच्यते आत्मेति । यस्मात्सर्वमाप्नोति सर्वमादत्ते सर्वमत्ति च तस्मादुच्यते
    आत्मेति । अथ कस्मादुच्यते महेश्वर इति । यस्मान्महत ईशः शब्दध्वन्या चात्मशक्त्या च महत ईशते तस्मादुच्यते
    महेश्वर इति । अथ कस्मादुच्यते दत्तात्रेय इति । यस्मात्सुदुश्चरं तपस्तप्यमानायात्रये पुत्रकामायातितरां
    तुष्टेन भगवता ज्योतिर्मयेनात्मैव दत्तो यस्माच्चानसूयायामत्रेस्तनयोऽभवत्तस्मादुच्यते दत्तात्रेय इति
    । अथ योऽस्य निरुक्तानि वेद स सर्वं वेद । अथ यो ह वै विद्ययैनं परमुपास्ते सोऽहमिति स ब्रह्मविद्भवति
    ॥ अत्रैते श्लोका भवन्ति ॥ दत्तात्रेयं शिवं शान्तमिन्द्रनीलनिभं प्रभुम् । आत्ममायारतं देवमवधूतं दिगम्बरम्
    ॥ १॥ भस्मोद्धूलितसर्वाङ्गं जटाजूटधरं विभुम् । चतुर्बाहुमुदाराङ्गं प्रफ़ुल्लकमलेक्षणम् ॥२॥ ज्ञानयोगनिधिं
    विश्वगुरुं योगिजनप्रियम् । भक्तानुकंपिनं सर्वसाक्षिणं सिद्धसेवितम् ॥ ३॥ एवं यः सततं ध्यायेद्देवदेवं
    सनातनम् । स मुक्तः सर्वपापेभ्यो निःश्रेयसमवाप्नुयात् ॥ ४॥ इत्यों सत्यमित्युपनिषत् ॥ इति तृतीयोऽध्यायः
    ॥ ३॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवा
