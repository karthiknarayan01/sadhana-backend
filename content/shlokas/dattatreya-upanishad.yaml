id: dattatreya-upanishad
category: upanishad
name:
  english: dattatreya upanishad
  devanagari: दत्तात्रेय उपनिषद्
content:
  english: upanishad || dattatreyopanishat || dattatreyibrahmavidyasamvedyanandavigraham | tripannarayanakaram
    dattatreyamupasmahe || om bhadram karnebhih shrunuyama deva bhadram pashyemakshabhiryajatrah || sthirairangaistushtuva~sastanubhirvyashema
    devahitam yadayuh || svasti na indro vriddhashravah svasti nah pusha vishvavedah || svasti nastarkshyo
    arishtanemih svasti no brihaspatirdadhatu || om shantih shantih shantih || harih om || satyakshetre
    brahma narayanam mahasamrajyam kim tarakam tanno bruhi bhagavannityuktah satyananda sattvikam mamakam
    dhamopasvetyaha | sada datto'hamasmiti pratyetatsamvadanti yena te samsarino bhavanti narayanenaivam
    vivakshito brahma vishvarupadharam vishnum narayanam dattatreayam dhyatva sadvadati | damiti hamsah
    | damiti dirgham tadbijam nama bijastham | damityekaksharam bhavati | tadetattarakam bhavati | tadevopasitavyam
    vijneyam garbhaditaranam | gayatri chandah | sadashiva rishih | dattatreyo devata | vatabijasthamiva
    dattabijastham sarvam jagat | etadaivaksharam vyakhyatam | vyakhyasye shadaksharam | omiti dvitiyam
    | hrimiti tritiyam | klimiti caturtham | glaumiti pancamam | dramiti shatkam | shadaksharo'yam bhavati
    | yoganubhavo bhavati | gayatri chandah | sadashiva rishih | dattatreyo devata | dramityuktva dramityuktva
    va dattatreyaya nama ityashtaksharah | dattatreyayeti satyanandacidatmakam | nama iti purnanandakavigraham
    | gayatri chandah | sadashiva rishih | dattatreyo devata | dattatreyayeti kilakam | tadeva bijam |
    namah shaktirbhavati | omiti prathamam | amiti dvitiyam | hrimiti tritiyam | kromiti caturtham | ehiti
    tadeva vadet | dattatreyeti svaheti mantrarajo'yam dvadashaksharah | jagati chandah | sadashiva rishih
    | dattatreyo devata | omiti bijam | svaheti shaktih | sambuddhiriti kilakam | dramiti hridaye | hrim
    klimiti shirshe | ehiti shikhayam | datteti kavace | atreyeti cakshushi | svahetyastre | tanmayo bhavati
    | ya evam veda | shodashaksharam vyakhyasye | pranam deyam | manam deyam | cakshurdeyam | shrotram
    deyam | shaddashashirashchinatti shodashaksharamantre na deyo bhavati | atisevaparabhaktagunavacchishyaya
    vadet | omiti prathamam bhavati | aimiti dvitiyam | kromiti tritiyam | klimiti caturtham | klumiti
    pancamam | hramiti shashtham | hrimiti saptamam | hrumityashtamam | sauriti navamam | dattatreyayeti
    caturdasham | svaheti shodasham | gayatri chandah | sadashiva rishih | dattatreyo devata | om bijam
    | svaha shaktih | caturthyantam kilakam | omiti hridaye | klam klim klumiti shikhayam | sauriti kavace
    | caturthyantam cakshushi | svahetyastre | yo nityamadhiyanah saccidananda sukhi mokshi bhavati |
    saurityante shrivaishnava ityucyate | tajjapi vishnurupi bhavati | anushtup chando vyakhyasye | sarvatra
    sambuddhirimanityucyante | dattatreya hare krishna unmattanandadayaka | digambara mune balapishaca
    jnanasagara || 1 || ityupanishat | anushtup chandah | sadashiva rishih | dattatreyo devata dattatreyeti
    hridaye | hare krishneti shirshe | unmattanandeti shikhayam | dayakamuna iti kavace | digambareti
    cakshushi | pishacajnanasagaretyastre | anushtubho'yam mayadhitah | abrahmajanmadoshashca pranashyanti
    | sarvopakari mokshi bhavati | ya evam vedetyupanishat || 1 || iti prathamah khandah || 1 || omiti
    vyaharet | om namo bhagavate dattatreyaya smaranamatrasantushtaya mahabhayanivaranaya mahajnanapradaya
    cidanandatmane balonmatta
  devanagari: उपनिषद् ॥ दत्तात्रेयोपनिषत् ॥ दत्तात्रेयीब्रह्मविद्यासंवेद्यानन्दविग्रहम् । त्रिपान्नारायणाकरं
    दत्तात्रेयमुपास्महे ॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः ॥ स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम
    देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः ॥ स्वस्ति नस्तार्क्ष्यो
    अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ ॥ सत्यक्षेत्रे ब्रह्मा
    नारायणं महासाम्राज्यं किं तारकं तन्नो ब्रूहि भगवन्नित्युक्तः सत्यानन्द सात्त्विकं मामकं धामोपास्वेत्याह
    । सदा दत्तोऽहमस्मीति प्रत्येतत्संवदन्ति येन ते संसारिणो भवन्ति नारायणेनैवं विवक्षितो ब्रह्मा विश्वरूपधरं
    विष्णुं नारायणं दत्तात्रेअयं ध्यात्वा सद्वदति । दमिति हंसः । दामिति दीर्घं तद्बीजं नाम बीजस्थम् ।
    दामित्येकाक्षरं भवति । तदेतत्तारकं भवति । तदेवोपासितव्यं विज्ञेयं गर्भादितारणम् । गायत्री छन्दः ।
    सदाशिव ऋषिः । दत्तात्रेयो देवता । वटबीजस्थमिव दत्तबीजस्थं सर्वं जगत् । एतदैवाक्षरं व्याख्यातम् । व्याख्यास्ये
    षडक्षरम् । ओमिति द्वितीयम् । ह्रीमिति तृतीयम् । क्लीमिति चतुर्थम् । ग्लौमिति पञ्चमम् । द्रामिति षट्कम्
    । षडक्षरोऽयं भवति । योगानुभवो भवति । गायत्री छन्दः । सदाशिव ऋषिः । दत्तात्रेयो देवता । द्रमित्युक्त्वा
    द्रामित्युक्त्वा वा दत्तात्रेयाय नम इत्यष्टाक्षरः । दत्तात्रेयायेति सत्यानन्दचिदात्मकम् । नम इति पूर्णानन्दकविग्रहम्
    । गायत्री छन्दः । सदाशिव ऋषिः । दत्तात्रेयो देवता । दत्तात्रेयायेति कीलकम् । तदेव बीजम् । नमः शक्तिर्भवति
    । ओमिति प्रथमम् । आमिति द्वितीयम् । ह्रीमिति तृतीयम् । क्रोमिति चतुर्थम् । एहीति तदेव वदेत् । दत्तात्रेयेति
    स्वाहेति मन्त्रराजोऽयं द्वादशाक्षरः । जगती छन्दः । सदाशिव ऋषिः । दत्तात्रेयो देवता । ओमिति बीजम् ।
    स्वाहेति शक्तिः । संबुद्धिरिति कीलकम् । द्रमिति हृदये । ह्रीं क्लीमिति शीर्षे । एहीति शिखायाम् । दत्तेति
    कवचे । आत्रेयेति चक्षुषि । स्वाहेत्यस्त्रे । तन्मयो भवति । य एवं वेद । षोडशाक्षरं व्याख्यास्ये । प्राणं
    देयम् । मानं देयम् । चक्षुर्देयम् । श्रोत्रं देयम् । षड्दशशिरश्छिनत्ति षोडशाक्षरमन्त्रे न देयो भवति
    । अतिसेवापरभक्तगुणवच्छिष्याय वदेत् । ओमिति प्रथमं भवति । ऐमिति द्वितीयम् । क्रोमिति तृतीयम् । क्लीमिति
    चतुर्थम् । क्लूमिति पञ्चमम् । ह्रामिति षष्ठम् । ह्रीमिति सप्तमम् । ह्रूमित्यष्टमम् । सौरिति नवमम्
    । दत्तात्रेयायेति चतुर्दशम् । स्वाहेति षोडशम् । गायत्री छन्दः । सदाशिव ऋषिः । दत्तात्रेयो देवता ।
    ॐ बीजम् । स्वाहा शक्तिः । चतुर्थ्यन्तं कीलकम् । ओमिति हृदये । क्लां क्लीं क्लूमिति शिखायाम् । सौरिति
    कवचे । चतुर्थ्यन्तं चक्षुषि । स्वाहेत्यस्त्रे । यो नित्यमधीयानः सच्चिदानन्द सुखी मोक्षी भवति । सौरित्यन्ते
    श्रीवैष्णव इत्युच्यते । तज्जापी विष्णुरूपी भवति । अनुष्टुप् छन्दो व्याख्यास्ये । सर्वत्र संबुद्धिरिमानीत्युच्यन्ते
    । दत्तात्रेय हरे कृष्ण उन्मत्तानन्ददायक । दिगंबर मुने बालपिशाच ज्ञानसागर ॥ १ ॥ इत्युपनिषत् । अनुष्टुप्
    छन्दः । सदाशिव ऋषिः । दत्तात्रेयो देवता दत्तात्रेयेति हृदये । हरे कृष्णेति शीर्षे । उन्मत्तानन्देति
    शिखायाम् । दायकमुन इति कवचे । दिगंबरेति चक्षुषि । पिशाचज्ञानसागरेत्यस्त्रे । आनुष्टुभोऽयं मयाधीतः
    । अब्रह्मजन्मदोषाश्च प्रणश्यन्ति । सर्वोपकारी मोक्षी भवति । य एवं वेदेत्युपनिषत् ॥ १ ॥ इति प्रथमः
    खण्डः ॥ १ ॥ ओमिति व्याहरेत् । ॐ नमो भगवते दत्तात्रेयाय स्मरणमात्रसन्तुष्टाय महाभयनिवारणाय महाज्ञानप्रदाय
    चिदानन्दात्मने बालोन्मत्त
