id: gurubhajanastotram-2
category: stotram
name:
  english: gurubhajanastotram 2
  devanagari: गुरुभजनस्तोत्रम् २
content:
  english: prakatasvasangamam | prakatikritavan kripavashah sahajanandagurum bhaje sada || 8|| bhagavan
    kripaya tvaya kritam janatayamupakaramidrasham | kshamate pratikartumatra kah kurute dina janastatom'jalim
    || 9|| iti shri dinanathabhattaviracitam shrigurubhajanastotram sampurnam |
  devanagari: प्रकटस्वसङ्गमम् । प्रकटीकृतवान् कृपावशः सहजानन्दगुरुं भजे सदा ॥ ८॥ भगवान् कृपया त्वया कृतं
    जनतायामुपकारमीद्रशम् । क्षमते प्रतिकर्तुमत्र कः कुरुते दीन जनस्ततोंऽजलिम् ॥ ९॥ इति श्री दीनानाथभट्टविरचितं
    श्रीगुरुभजनस्तोत्रं सम्पूर्णम् ।
meaning: {}
