id: parvatavardhinisahasranamastotram
category: sahasranama
name:
  english: parvatavardhinisahasranamastotram
  devanagari: पर्वतवर्धिनीसहस्रनामस्तोत्रम्
content:
  english: nashanam || 215|| dasha pratikrita rama setuyatra bhaved dridham | masamatram kramenaitat yah
    pathetsusamahitah || 216|| tasyaham sakalabhishtam dharmam kirtinca nirmalam | setuvasam sadakalam
    pradasye raghunandana || 217|| shanmasam pathatah shriman jayate manavo bhuvi | setavagatya ramesham
    manca samsevya bhaktitah || 218|| dhanushkotau narah snatva sannidhau mama yah pathet | varshamekam
    kramenaiva putravan bhavati dhruvam || 219|| rogebhyo mucyate sadyah kushthebhyo'pi vimucyate | rina
  devanagari: नाशनम् ॥ २१५॥ दश प्रतिकृता राम सेतुयात्रा भवेद् दृढम् । मासमात्रं क्रमेणैतत् यः पठेत्सुसमाहितः
    ॥ २१६॥ तस्याहं सकलाभीष्टं धर्मं कीर्तिञ्च निर्मलाम् । सेतुवासं सदाकालं प्रदास्ये रघुनन्दन ॥ २१७॥ षण्मासं
    पाठतः श्रीमान् जायते मानवो भुवि । सेतावागत्य रामेशं माञ्च संसेव्य भक्तितः ॥ २१८॥ धनुष्कोटौ नरः स्नात्वा
    सन्निधौ मम यः पठेत् । वर्षमेकं क्रमेणैव पुत्रवान् भवति ध्रुवम् ॥ २१९॥ रोगेभ्यो मुच्यते सद्यः कुष्ठेभ्योऽपि
    विमुच्यते । ऋण
