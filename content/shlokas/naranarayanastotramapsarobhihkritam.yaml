id: naranarayanastotramapsarobhihkritam
category: stotram
name:
  english: naranarayanastotramapsarobhihkritam
  devanagari: नरनारायणस्तोत्रंअप्सरोभिःकृतम्
content:
  english: pashyama nadim tava deva nantam na madhyamavyakritarupaparam | parayanam tva jagatamanantam
    natah sma narayanamatmabhutam || 16|| mahi divam vayujalagnayastvam shabdadirupashca paraparatman
    | tvatto bhavatyacyuta sarvametadabhedarupo'si vibho tvamebhih || 17|| drashtasi rupasya rasasya vetta
    shrota ca shabdasya hare tvamekah | sprashta bhavansprashavato'khilasya ghratasi gandhasya prithakshariri
    || 18|| sureshu sarveshu na so'sti kashcinmanushyaloke ca na so'sti kashcit | pashvadivarge ca na
    so'sti kashcidyo namshabhutastava devadeva || 19|| brahmadyupendrapramukhani saumyeshvindragnirupani
    ca viryavatsu | rudrantakadini ca raudravatsu rupeshu rupani tavottamani || 20|| samudrarupam tava
    dhairyavatsu tejasvirupeshu ravistathagnih | kshamadhaneshu kshitirupamagryam rupam tavagryam balavatsu
    vayuh || 21|| manushyarupam tava rajaseshu mudheshu sarveshvara padapo'si | darpanviteshvacyuta danavastvam
    sanatsujatashca vivekavatsu || 22|| rasasvarupena jale sthito'si gandhasvarupo bhavato dharitryam
    | drishyasvarupashca hutashane tvam sparshasvarupo bhagavansamire || 23|| shabdatmakam te nabhasi
    svarupam mantavyarupo manasi prabho tvam | bodhavyarupashca vibho tvamekah sarvatra sarveshvara sarvabhutah
    || 24|| pashyama te nabhisarojamadhye brahmanametam ca haram bhrukutyam | tatrashvinau karnagatau
    samastanavasthitanbahushu lokapalan || 25|| ghrane'nilam netragatau ravindu jihva ca te natha sarasvatiyam
    | padau dharitrim jatharam samastamllokanhrishikesha vilokayamah || 26|| janghe viyatpadakarangulishu
    pishacarakshoragasiddhasanghan | pumstve prajanam patiroshthayugme pratishthitaste kratavah samastah
    || 27|| sarveshtayaste dashaneshu deva damshtrasu vidya bhavatashcatasrah romasvasheshastava devasangha
    vidyadhara natha karanghrirekhah | sanghah samastastava deva vedah samasthita bahushu sandhibhutah
    || 28|| varaharupam dharanidhritaste nrisimharupam ca satakaralam | pashyama te vajishirastathoccaistrivikrame
    yashca tavaprameyah || 29|| ami samudrastava deva dehe mervadayah shailavarastavami | imashca gangapramukhah
    sravatyo dvipanyasheshani vanani caiva || 30|| stuvanti caite munayastavesha dehe sthitastvanmahimanamagryam
    | tvamishitaram jagatamanantam yajneshamarcanti ca yajvino'mi || 31|| tvatto na saumyam jagatiha kincittvatto
    na raudram ca samastamurte | tvatto na shitam na ca keshavoshnam sarvasvarupatishayi tvamekah || 32||
    prasida sarveshvara sarvabhuta sanatanatmanparameshvaresha | tvanmayaya mohitamanasabhiryatte'paraddham
    tadidam kshamasva || 33|| kim vaparaddham tava deva mudhairyanmayaya no hridayam tathapi | papavasham
    kim pranatartiharinmano hi no vinkalata
  devanagari: पश्याम नादिं तव देव नान्तं न मध्यमव्याकृतरूपपारम् । परायणं त्वा जगतामनन्तं नताः स्म नारायणमात्मभूतम्
    ॥ १६॥ मही दिवं वायुजलाग्नयस्त्वं शब्दादिरूपश्च परापरात्मन् । त्वत्तो भवत्यच्युत सर्वमेतदभेदरूपोऽसि
    विभो त्वमेभिः ॥ १७॥ द्रष्टासि रूपस्य रसस्य वेत्ता श्रोता च शब्दस्य हरे त्वमेकः । स्प्रष्टा भवान्स्प्रशवतोऽखिलस्य
    घ्रातासि गन्धस्य पृथक्शरीरी ॥ १८॥ सुरेषु सर्वेषु न सोऽस्ति कश्चिन्मनुष्यलोके च न सोऽस्ति कश्चित् ।
    पश्वादिवर्गे च न सोऽस्ति कश्चिद्यो नांशभूतस्तव देवदेव ॥ १९॥ ब्रह्माद्युपेन्द्रप्रमुखानि सौम्येष्विन्द्राग्निरूपाणि
    च वीर्यवत्सु । रुद्रान्तकादीनि च रौद्रवत्सु रूपेषु रूपाणि तवोत्तमानि ॥ २०॥ समुद्ररूपं तव धैर्यवत्सु
    तेजस्विरूपेषु रविस्तथाग्निः । क्षमाधनेषु क्षितिरूपमग्र्यं रूपं तवाग्र्यं बलवत्सु वायुः ॥ २१॥ मनुष्यरूपं
    तव राजसेषु मूढेषु सर्वेश्वर पादपोऽसि । दर्पान्वितेष्वच्युत दानवस्त्वं सनत्सुजातश्च विवेकवत्सु ॥ २२॥
    रसस्वरूपेण जले स्थितोऽसि गन्धस्वरूपो भवतो धरित्र्यम् । दृश्यस्वरूपश्च हुताशने त्वं स्पर्शस्वरूपो भगवान्समीरे
    ॥ २३॥ शब्दात्मकं ते नभसि स्वरूपं मन्तव्यरूपो मनसि प्रभो त्वम् । बोधव्यरूपश्च विभो त्वमेकः सर्वत्र
    सर्वेश्वर सर्वभूतः ॥ २४॥ पश्याम ते नाभिसरोजमध्ये ब्रह्माणमेतं च हरं भ्रुकूट्यम् । तत्राश्विनौ कर्णगतौ
    समस्ताणवस्थितान्बाहुषु लोकपालान् ॥ २५॥ घ्राणेऽनिलं नेत्रगतौ रवीन्दू जिह्वा च ते नाथ सरस्वतीयम् । पादौ
    धरित्रीं जठरं समस्तांल्लोकान्हृषीकेश विलोकयामः ॥ २६॥ जङ्घे वियत्पादकराङ्गुलीषु पिशाचरक्षोरगसिद्धसङ्घान्
    । पुंस्त्वे प्रजानां पतिरोष्ठयुग्मे प्रतिष्ठितास्ते क्रतवः समस्ताः ॥ २७॥ सर्वेष्टयस्ते दशनेषु देव
    दंष्ट्रासु विद्या भवतश्चतस्रः रोमस्वशेषास्तव देवसङ्घा विद्याधरा नाथ कराङ्घ्रिरेखाः । साङ्घाः समस्तास्तव
    देव वेदाः समास्थिता बहुषु सन्धिभूताः ॥ २८॥ वराहरूपं धरणीधृतस्ते नृसिंहरूपं च सटाकरालम् । पश्याम ते
    वाजिशिरस्तथोच्चैस्त्रिविक्रमे यश्च तवाप्रमेयः ॥ २९॥ अमी समुद्रास्तव देव देहे मेर्वादयः शैलवरास्तवामी
    । इमाश्च गङ्गाप्रमुखाः स्रवत्यो द्वीपान्यशेषाणि वनानि चैव ॥ ३०॥ स्तुवन्ति चैते मुनयस्तवेश देहे स्थितास्त्वन्महिमानमग्र्यम्
    । त्वामीशितारं जगतामनन्तं यज्ञेशमर्चन्ति च यज्विनोऽमी ॥ ३१॥ त्वत्तो न सौम्यं जगतीह किञ्चित्त्वत्तो
    न रौद्रं च समस्तमूर्ते । त्वत्तो न शीतं न च केशवोष्णं सर्वस्वरूपातिशयी त्वमेकः ॥ ३२॥ प्रसीद सर्वेश्वर
    सर्वभूत सनातनात्मन्परमेश्वरेश । त्वन्मायया मोहितमानसाभिर्यत्तेऽपराद्धं तदिदं क्षमस्व ॥ ३३॥ किं वापराद्धं
    तव देव मूढैर्यन्मायया नो हृदयं तथापि । पापावशं किं प्रणतार्तिहारिन्मनो हि नो विङ्कलता
