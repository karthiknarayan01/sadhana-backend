id: brihajjabala
category: upanishad
name:
  english: brihajjabala
  devanagari: ब्रिहज्जबल
content:
  english: ringa eva va | adadhita hi gomutram gandhadvareti gomayam || 7|| abhumipatam grihniyatpatre
    purvodite grihi | gomayam shodhayedvidvanshrirme bhajatumantratah || 8|| alakshmirma iti mantrena
    gomayam dhanyavarjitam | samtvasimcami mantrena gomaye kshipet || 9|| pancanam tviti mantrena pindanam
    ca caturdasha | kuryatsamshodhya kiranaih saurakairaharettatah || 10|| nidadhyadatha purvoktapatre
    gomayapindakan | svagrihyoktavidhanena pratishthapyagnimijayet || 11|| pindamshca nikshipettatra adyantam
    pranavena tu | shadaksharasya suktasya vyakritasya tathaksharaih || 12|| svahante juhuyattatra varnadevaya
    pindakan | agharavajyabhagau ca prakshipedvyahritih sudhih || 13|| tato nidhanapataye trayovimshajjuhoti
    ca | hotavyah panca brahmani namo hiranyabahave || 14|| iti sarvahutirhutva caturthyantaishca mantrakaih
    | ritamsatyam kadrudraya yasya vakankatiti ca || 15|| etaishca juhuyadvidvananajnatatrayam tatha |
    vyahritiratha hutva ca tatah svishtakritam hunet || 16|| homashesham tu nirvartya purnapatrodakam
    tatha | purnamasiti yajusha jalenanyena brimhayet || 17|| brahmaneshvamritamiti tajjalam shirasi kshipet
    | pracyamiti disham lingairdikshu toyam vinikshipet || 18|| brahmane dakshinam dattva shantyai pulakamaharet
    | aharishyami devanam sarvesham karmaguptaye || 19|| jatavedasamenam tvam pulakaishchadayamyaham |
    mantrenanena tam vahnim pulakaishchadayettatah || 20|| tridinam jvalanasthityai chadanam pulakaih
    smritam | brahmananbhojayedbhaktya svayam bhunjita vagyatah || 21|| bhasmadhikyamabhipsustu adhikam
    gomayam haret | dinatrayena yadi va ekasmindivase'thava || 22|| tritiye va caturthe va pratah snatva
    sitambarah | shuklayajnopaviti ca shuklamalyanulepanah || 23|| shukladanto bhasmadigdho mantrenanena
    mantravit | om tadbrahmeti coccarya paulakam bhasma samtyajet || 24|| tatra cavahanamukhanupacaramstu
    shodasha | kuryadvyahritibhistvevam tato'gnimupasamharet || 25|| agnirbhasmeti mantrena grihniyadbhasma
    cottaram | agnirityadimantrena pramrijya ca tatah param || 26|| samyojya gandhasalilaih kapilamutrakena
    va | candrakunkumakashmiramushiram candanam tatha || 27|| agarutritayam caiva curnayitva tu sukshmatah
    | kshipedbhasmani taccurnamomiti brahmamantratah || 28|| pranavenaharedvidvanbrihato vatakanatha |
    anoraniyaniti hi mantrena ca vicakshanah || 29|| ittham bhasma susampadya shushkamadaya mantravit
    | pranavena vimrijyatha saptapranavamantritam || 30|| ishaneti shirodeshe mukham tatpurushena tu |
    urudeshamaghorena guhyam vamena mantrayet || 31|| sadyojatena vai padansarvangam pranavena tu | tata
    uddhulya sarvangamapadatalamastakam || 32|| acamya vasanam dhautam tatashcaitatpradharayet | punaracamya
    karma svam kartumarhasi sattama || 33|| atha caturvidham bhasma kalpam | prathamamanukalpam | dvitiyamupakalpam
    | upopakalpam tritiyam | akalpam caturtham | agnihotram samudbhutam virajanalajamanukalpam | vane
    shushkam shakritsamgrihya kalpoktavidhina kalpitamupakalpam syat | aranye shushkagomayam curnikritya
    gomutraih pindikritya yathakalpam samskritamupopakalpam | shivalayasthamakalpam shatakalpam ca | ittham
    caturvidham bhasma papam nikrintayenmoksham dadatiti bhagavankalagnirudrah || 34|| iti tritiyam brahmanam
    || 3|| atha bhusundah kalagnirudram bhasmasnanavidhim bruhiti hovacatha pranavena vimrijyatha saptapranavenabhimantritamagamena
    tu tenaiva digbandhanam karayetpunarapi tenastramantrenangani murdhadinyuddhulayenmalasnanamidamishanadyaih
    pancabhirmantraistanum kramaddhulayet | ishaneti shirodesham mukham tatpurushena tu | urudeshamaghorena
    guhyakam vamadevatah | sadyojatena vai pado sarvangam pranavena tu | apadatalamastakam sarvangam tata
    uddhulacamya vasanam dhautam shvetam pradharayedvidhisnanamidam || tatra shloka bhavanti | bhasmamushtim
    samadaya samhitamantramantritam | mastakatpadaparyantam malasnanam puroditam || 1|| tanmantrenaiva
    kartavyam vidhisnanam samacaret | ishane pancadha bhasma vikirenmurdhni yatratah || 2|| mukhe caturthavaktrena
    aghorenashtadha hridi | vamena guhyadeshe tu tridashasthanabhedatah || 3|| ashtavantena sadhyena padavaddhulya
    yatratah | sarvangoddhulanam karyam rajanyasya yathavidhi || 4|| mukham vina ca tatsarvamuddhulya
    kramayogatah | sandhyadvaye nishithe ca tatha purvavasanayoh || 5|| suptva bhuktva payah pitva kritva
    cavashyakadikam | striyam napumsakam gridhram bidalam bakamushikam || 6|| sprishtva tathavidhananyanbhasmasnanam
    samacaret | devagniguruvriddhanam samipe'ntyajadarshane || 7|| ashuddhabhutale marge kuryanoddhulanam
    vrati | shankhatoyena mulena bhasmana mishranam bhavet || 8|| yojitam candanenaiva varina bhasmasamyutam
    | candanena samalimpejjnanadam curnameva tat || 9|| madhyahnatpragjalairyuktam toyam tadanuvarjayet
    || atha bhusundo bhagavantam kalagnirudram tripundravidhim papraccha || tatraite shloka bhavanti |
    tripundram karayetpashcadbrahmavishnushivatmakam | madhyangulibhiradaya tisribhirmulamantratah ||
    10|| anamamadhyamangushthairathava syattripundrakam | uddhulayenmukham viprah kshatriyastacchirodinam
    || 11|| dvatrimshasthanake cardham shodashasthanake'pi va | ashtasthane tatha caiva pancasthane'pi
    yojayet || 12|| uttamange lalate ca karnayornetrayostatha | nasavakre gale caivamamsadvayamatah param
    || 13|| kurpare manibandhe ca hridaye parshvayordvayoh | nabhau guhyadvaye caivamurvoh sphigbimbajanuni
    || 14|| janghadvaye ca padau ca dvatrimshatsthanamuttamam | ashtamurtyashtavidyeshandikpalanvasubhih
    saha || 15|| dharo dhruvashca somashca kripashcaivanilo'nalah | pratyupashca prabhasashca vasavo'shtavitiritah
    || 16|| etesham namamantrena tripundrandharayedbudhah | vidadhyatshodashasthane tripundram tu samahitah
    || 17|| shirshake ca lalate ca karne kanthem'sakadvaye | kurpare manibandhe ca hridaye nabhiparshvayoh
    || 18|| prishthe caikam pratisthanam japettatradhidevatah | shivam shaktim ca sadakhyamisham vidyakhyameva
    ca || 19|| vamadinavashaktishca etah shodasha devatah | nasatyo dasrakashcaiva ashvinau dvau samiritau
    || 20|| athava murdhnyalike ca karnayoh shvasane tatha | bahudvaye ca hridaye nabhyamurvoryuge tatha
    || 21|| janudvaye ca padayoh prishthabhage ca shodasha | shivashcendrashca rudrarkau vighnesho vishnureva
    ca || 22|| shrishcaiva hridayeshashca tatha nabhau prajapatih | nagashca nagakanyashca ubhe ca rishikanyake
    || 23|| padayoshca samudrashca tirthah prishthe'pi ca sthitah | evam va shodashasthanamashtasthanamthocyate
    || 24|| gurusthanam lalatam ca karnadvayamanantaram | asayugmam ca hridayam nabhirityashtamam bhavet
    || 25|| brahma ca rishayah sapta devatashca prakirtitah | athava mastakam bahu hridayam nabhireva
    ca || 26|| pancasthananyamunyahurbhasmatattvavido janah | yathasambhavatah kuryaddeshakaladyapekshaya
    || 27|| uddhulane'pyashaktashcettripundradini karayet | lalate hridaye nabhau gale ca manibandhayoh
    || 28|| bahumadhye bahumule prishthe caiva ca shirshake || lalate brahmane namah | hridaye havyavahanaya
    namah | nabhau skandaya namah | gale vishnave namah | madhye prabhanjanaya namah | manibandhe vasubhyo
    namah | prishthe haraye namah | kukudi shambhave namah | shirasi paramatmane namah | ityadisthaneshu
    tripundram dharayet || trinetram trigunadharam trayanam janakam prabhum | smarannamah shivayeti lalate
    tattripundrakam || 29|| kurparadhah pitribhyam tu ishanabhyam tathopari | ishabhyam nama ityuktva
    parshvayoshca tripundrakam || 30|| svacchabhyam nama ityuktva dharayettatprakoshthayoh | bhimayeti
    tatha prishthe shivayeti ca parshvayoh || 31|| nilakanthaya shirasi kshipetsarvatmane namah | papam
    nashayate kritsnamapi janmantararjitam || 32|| kanthopari kritam papam nashtam syattatra dharanat
    | karne tu dharanatkarnarogadikritapatakam || 33|| bahvobahukritam papam vakshahsu manasa kritam |
    nabhyam shishnakritam papam prishthe gudakritam tatha || 34|| parshvayordharanatpapam parastryalinganadikam
    | tadbhasmadharanam kuryatsarvatraiva tripundrakam || 35|| brahmavishnumaheshanam trayyagninam ca
    dharanam | gunalokatrayanam ca dharanam tena vai shrutam || 36|| iti caturtham brahmanam || 4|| manastokena
    mantrena mantritam bhasma dharayet | urdhvapundram bhavetsamam madhyapundram triyayusham || 1|| triyayushani
    kurute lalate ca bhujadvaye | nabhau shirasi hritparshve brahmanah kshatriyastatha || 2|| traivarnikanam
    sarveshamagnihotrasamudbhavam | idam mukhyam grihasthanam virajanalajam bhavet || 3|| virajanalajam
    caiva dharyam proktam maharshibhih | aupasanasamutpannam grihasthanam visheshatah || 4|| samidagnisamutpannam
    dharyam vai brahmacarina | shudranam shrotriyagarapacanagnisamudbhavam || 5|| anyeshamapi sarvesham
    dharyam caivanalodbhavam | yatinam jnanadam proktam vanasthanam viraktidam || 6|| ativarnashramanam
    tu shmashanagnisamudbhavam | sarvesham devalayastham bhasma shivagnijam shivayoginam | shivalayastham
    tallingaliptam va mantrasamskaradagdham va || tatraite shloka bhavanti | tenadhitam shrutam tena tena
    sarvamanushthitam | yena viprena shirasi tripundram bhasmana dhritam || 7|| tyaktavarnashramacaro
    luptasarvakriyo'pi yah | sakrittiryaktripundrankadharanatso'pi pujyate || 8|| ye bhasmadharanam tyaktva
    karma kurvanti manavah | tesham nasti vinirmokshah samsarajjanmakotibhih || 9|| mahapatakayuktanam
    purvajanmarjitagasam | tripundroddhulanadvesho jayate sudridham budhah || 10|| yesham kopo bhavedbrahmamॅllalate
    bhasmadarshanat | teshamutpattisankaryamanumeyam vipashcita || 11|| yesham nasti mune shraddha shraute
    bhasmani sarvada | garbhadhanadisamskarastesham nastiti nishcayah || 12|| ye bhasmadharinam drishtva
    narah kurvanti tadanam | tesham candalato janma brahmannuhyam vipashcita || 13|| yesham krodho bhavedbhasmadharane
    tatpramanake | te mahapatakairyukta iti shastrasya nishcayah || 14|| tripundṟakam ye vinindanti nindanti
    shivameva te | dharayanti ca ye bhaktya dharayanti shivam ca te || 15|| dhigbhasmarahitam bhalam dhiggramamashivalayam
    | dhiganisharcanam janma dhigvidyamashivashrayam || 16|| rudragneryatparam viryam tadbhasma parikirtitam
    | tasmatsarveshu kaleshu viryavanbhasmasamyutah || 17|| bhasmanishthasya dahyante dosha bhasmagnisangamat
    | bhasmasnanavishuddhatma bhasmanishtha iti smritah || 18|| bhasmasandigdhasarvango bhasmadiptatripundrakah
    | bhasmashayi ca purusho bhasmanishtha iti smritah || 19|| iti pancamam brahmanam || 5|| atha bhusundah
    kalagnirudram namapancakasya mahatmyam bruhiti hovaca | atha vasishthavamshajasya shatabharyasametasya
    dhananjayasya brahmanasya jyeshthabharyaputrah karuna iti nama tasya shucismita bharya | asau karuno
    bhratrivairamasahamano bhavanitatastham nrisimhamagamat | tatra devasamipe'nyenopayanartham samarpitam
    jambiraphalam grihitvajighrattada tatrastha ashapanpapa makshiko bhava varshanam shatamiti | so'pi
    shapamadaya makshikah sansvaceshtitam tasyai nivedya mam raksheti svabharyamavadattada makshiko'bhavattamevam
    jnatva jnatayastailamadhye hyamarayantsa mritam patimadayarundhatimagamadbho shucismite shokenalamarundhatyahamum
    jivayamyadya vibhutimadayeti eshagnihotrajam bhasma || mrityunjayena mantrena mritajantau tadakshipat
    | mandavayustada jajne vyajanena shucismite || 1|| udatishthattada janturbhasmano'sya prabhavatah
    | tato varshashate purne jnatireko hyamarayat || 2|| bhasmaiva jivayamasa kashyam panca tadabhavan
    | devanapi tathabhutanmamapyetadrisham pura || 3|| tasmattu bhasmanam jantum jivayami tadanaghe |
    ityevamuktva bhagavandadhicih samajayata || 4|| svarupam ca tato gatva svamashramapadam yayaviti ||
    idanimasya bhasmanah sarvaghabhakshanasamarthyam vidhatta ityaha | shrigautamavivahakale tamahalyam
    drishtva sarve devah kamatura abhavan tada nashtajnana durvasasam gatva papracchustaddosham shamayishyamityuvaca
    tatah shatarudrena mantrena mantritam bhasma vai pura mayapi dattam brahmahatyadi shantam | ityevamuktva
    durvasa dattavanbhasma cottamam | jata madvacanatsarve yuyam te'dhikatejasah || 5|| shatarudrena mantrena
    bhasmoddhulitavigrahah | nirdhutarajasah sarve tatkshanacca vayam mune || 6|| ashcaryametajjanimo
    bhasmasamarthyamidrisham | asya bhasmanah shaktimanyam sha
  devanagari: ृङ्ग एव वा । आदधीत हि गोमूत्रं गन्धद्वारेति गोमयम् ॥ ७॥ अभूमिपातं गृह्णीयात्पात्रे पूर्वोदिते
    गृही । गोमयं शोधयेद्विद्वान्श्रीर्मे भजतुमन्त्रतः ॥ ८॥ अलक्ष्मीर्म इति मन्त्रेण गोमयं धान्यवर्जितम्
    । संत्वासिंचामि मन्त्रेण गोमये क्षिपेत् ॥ ९॥ पञ्चानां त्विति मन्त्रेण पिण्डानां च चतुर्दश । कुर्यात्संशोध्य
    किरणैः सौरकैराहरेत्ततः ॥ १०॥ निदध्यादथ पूर्वोक्तपात्रे गोमयपिण्डकान् । स्वगृह्योक्तविधानेन प्रतिष्ठाप्याग्निमीजयेत्
    ॥ ११॥ पिण्डांश्च निक्षिपेत्तत्र आद्यन्तं प्रणवेन तु । षडक्षरस्य सूक्तस्य व्याकृतस्य तथाक्षरैः ॥ १२॥
    स्वाहान्ते जुहुयात्तत्र वर्णदेवाय पिण्डकान् । आघारावाज्यभागौ च प्रक्षिपेद्व्याहृतीः सुधीः ॥ १३॥ ततो
    निधनपतये त्रयोविंशज्जुहोति च । होतव्याः पञ्च ब्रह्माणि नमो हिरण्यबाहवे ॥ १४॥ इति सर्वाहुतिर्हुत्वा
    चतुर्थ्यन्तैश्च मन्त्रकैः । ऋतंसत्यं कद्रुद्राय यस्य वकङ्कतीति च ॥ १५॥ एतैश्च जुहुयाद्विद्वाननाज्ञातत्रयं
    तथा । व्याहृतीरथ हुत्वा च ततः स्विष्टकृतं हुनेत् ॥ १६॥ होमशेषं तु निर्वर्त्य पूर्णपात्रोदकं तथा ।
    पूर्णमसीति यजुषा जलेनान्येन बृंहयेत् ॥ १७॥ ब्राह्मणेष्वमृतमिति तज्जलं शिरसि क्षिपेत् । प्राच्यामिति
    दिशां लिङ्गैर्दिक्षु तोयं विनिक्षिपेत् ॥ १८॥ ब्रह्मणे दक्षिणां दत्त्वा शान्त्यै पुलकमाहरेत् । आहरिष्यामि
    देवानां सर्वेषां कर्मगुप्तये ॥ १९॥ जातवेदसमेनं त्वां पुलकैश्छादयाम्यहम् । मन्त्रेणानेन तं वह्निं पुलकैश्छादयेत्ततः
    ॥ २०॥ त्रिदिनं ज्वलनस्थित्यै छादनं पुलकैः स्मृतम् । ब्राह्मणान्भोजयेद्भक्त्या स्वयं भुञ्जीत वाग्यतः
    ॥ २१॥ भस्माधिक्यमभीप्सुस्तु अधिकं गोमयं हरेत् । दिनत्रयेण यदि वा एकस्मिन्दिवसेऽथवा ॥ २२॥ तृतीये वा
    चतुर्थे वा प्रातः स्नात्वा सिताम्बरः । शुक्लयज्ञोपवीती च शुक्लमाल्यानुलेपनः ॥ २३॥ शुक्लदन्तो भस्मदिग्धो
    मन्त्रेणानेन मन्त्रवित् । ॐ तद्ब्रह्मेति चोच्चार्य पौलकं भस्म संत्यजेत् ॥ २४॥ तत्र चावाहनमुखानुपचारांस्तु
    षोडश । कुर्याद्व्याहृतिभिस्त्वेवं ततोऽग्निमुपसंहरेत् ॥ २५॥ अग्निर्भस्मेति मन्त्रेण गृह्णीयाद्भस्म
    चोत्तरम् । अग्निरित्यादिमन्त्रेण प्रमृज्य च ततः परम् ॥ २६॥ संयोज्य गन्धसलिलैः कपिलामूत्रकेण वा । चन्द्रकुङ्कुमकाश्मीरमुशिरं
    चन्दनं तथा ॥ २७॥ अगरुत्रितयं चैव चूर्णयित्वा तु सूक्ष्मतः । क्षिपेद्भस्मनि तच्चूर्णमोमिति ब्रह्ममन्त्रतः
    ॥ २८॥ प्रणवेनाहरेद्विद्वान्बृहतो वटकानथ । अणोरणीयनिति हि मन्त्रेण च विचक्षणः ॥ २९॥ इत्थं भस्म सुसम्पाद्य
    शुष्कमादय मन्त्रवित् । प्रणवेन विमृज्याथ सप्तप्रणवमन्त्रितम् ॥ ३०॥ ईशानेति शिरोदेशे मुखं तत्पुरुषेण
    तु । उरुदेशमघोरेण गुह्यं वामेन मन्त्रयेत् ॥ ३१॥ सद्योजातेन वै पादान्सर्वाङ्गं प्रणवेन तु । तत उद्धूल्य
    सर्वाङ्गमापादतलमस्तकम् ॥ ३२॥ आचम्य वसनं धौतं ततश्चैतत्प्रधारयेत् । पुनराचम्य कर्म स्वं कर्तुमर्हसि
    सत्तम ॥ ३३॥ अथ चतुर्विधं भस्म कल्पम् । प्रथममनुकल्पम् । द्वितीयमुपकल्पम् । उपोपकल्पं तृतीयम् । अकल्पं
    चतुर्थम् । अग्निहोत्रं समुद्भूतं विरजानलजमनुकल्पम् । वने शुष्कं शकृत्संगृह्य कल्पोक्तविधिना कल्पितमुपकल्पं
    स्यात् । अरण्ये शुष्कगोमयं चूर्णीकृत्य गोमूत्रैः पिण्डीकृत्य यथाकल्पं संस्कृतमुपोपकल्पम् । शिवालयस्थमकल्पं
    शतकल्पं च । इत्थं चतुर्विधं भस्म पापं निकृन्तयेन्मोक्षं ददातीति भगवान्कालाग्निरुद्रः ॥ ३४॥ इति तृतीयं
    ब्राह्मणम् ॥ ३॥ अथ भुसुण्डः कालाग्निरुद्रं भस्मस्नानविधिं ब्रूहीति होवाचाथ प्रणवेन विमृज्याथ सप्तप्रणवेनाभिमन्त्रितमागमेन
    तु तेनैव दिग्बन्धनं कारयेत्पुनरपि तेनास्त्रमन्त्रेणाङ्गानि मूर्धादीन्युद्धूलयेन्मलस्नानमिदमीशानाद्यैः
    पञ्चभिर्मन्त्रैस्तनुं क्रमाद्धूलयेत् । ईशानेति शिरोदेशं मुखं तत्पुरुषेण तु । ऊरुदेशमघोरेण गुह्यकं
    वामदेवतः । सद्योजातेन वै पादो सर्वाङ्गं प्रणवेन तु । आपादतलमस्तकं सर्वाङ्गं तत उद्धूलाचम्य वसनं धौतं
    श्वेतं प्रधारयेद्विधिस्नानमिदम् ॥ तत्र श्लोका भवन्ति । भस्ममुष्टिं समादाय संहितामन्त्रमन्त्रिताम्
    । मस्तकात्पादपर्यन्तं मलस्नानं पुरोदितम् ॥ १॥ तन्मन्त्रेणैव कर्तव्यं विधिस्नानं समाचरेत् । ईशाने पञ्चधा
    भस्म विकिरेन्मूर्ध्नि यत्रतः ॥ २॥ मुखे चतुर्थवक्त्रेण अघोरेणाष्टधा हृदि । वामेन गुह्यदेशे तु त्रिदशस्थानभेदतः
    ॥ ३॥ अष्टावन्तेन साध्येन पादावद्धूल्य यत्रतः । सर्वाङ्गोद्धूलनं कार्यं राजन्यस्य यथाविधि ॥ ४॥ मुखं
    विना च तत्सर्वमुद्धूल्य क्रमयोगतः । सन्ध्याद्वये निशीथे च तथा पूर्वावसानयोः ॥ ५॥ सुप्त्वा भुक्त्वा
    पयः पीत्वा कृत्वा चावश्यकादिकम् । स्त्रियं नपुंसकं गृध्रं बिडालं बकमूषिकम् ॥ ६॥ स्पृष्ट्वा तथाविधानन्यान्भस्मस्नानं
    समाचरेत् । देवाग्निगुरुवृद्धानां समीपेऽन्त्यजदर्शने ॥ ७॥ अशुद्धभूतले मार्गे कुर्यानोद्धूलनं व्रती
    । शङ्खतोयेन मूलेन भस्मना मिश्रणं भवेत् ॥ ८॥ योजितं चन्दनेनैव वारिणा भस्मसंयुतम् । चन्दनेन समालिम्पेज्ज्ञानदं
    चूर्णमेव तत् ॥ ९॥ मध्याह्नात्प्राग्जलैर्युक्तं तोयं तदनुवर्जयेत् ॥ अथ भुसुण्डो भगवन्तं कालाग्निरुद्रं
    त्रिपुण्ड्रविधिं पप्रच्छ ॥ तत्रैते श्लोका भवन्ति । त्रिपुण्ड्रं कारयेत्पश्चाद्ब्रह्मविष्णुशिवात्मकम्
    । मध्याङ्गुलिभिरादाय तिसृभिर्मूलमन्त्रतः ॥ १०॥ अनामामध्यमाङ्गुष्ठैरथवा स्यात्त्रिपुण्ड्रकम् । उद्धूलयेन्मुखं
    विप्रः क्षत्रियस्तच्छिरोदिनम् ॥ ११॥ द्वात्रिंशस्थानके चार्धं षोडशस्थानकेऽपि वा । अष्टस्थाने तथा चैव
    पञ्चस्थानेऽपि योजयेत् ॥ १२॥ उत्तमाङ्गे ललाटे च कर्णयोर्नेत्रयोस्तथा । नासावक्रे गले चैवमंसद्वयमतः
    परम् ॥ १३॥ कूर्परे मणिबन्धे च हृदये पार्श्वयोर्द्वयोः । नाभौ गुह्यद्वये चैवमूर्वोः स्फिग्बिम्बजानुनी
    ॥ १४॥ जङ्घाद्वये च पादौ च द्वात्रिंशत्स्थानमुत्तमम् । अष्टमूर्त्यष्टविद्येशान्दिक्पालान्वसुभिः सह
    ॥ १५॥ धरो ध्रुवश्च सोमश्च कृपश्चैवानिलोऽनलः । प्रत्यूपश्च प्रभासश्च वसवोऽष्टावितीरिताः ॥ १६॥ एतेषां
    नाममन्त्रेण त्रिपुण्ड्रान्धारयेद्बुधः । विदध्यात्षोडशस्थाने त्रिपुण्ड्रं तु समाहितः ॥ १७॥ शीर्षके
    च ललाटे च कर्णे कण्ठेंऽसकद्वये । कूर्परे मणिबन्धे च हृदये नाभिपार्श्वयोः ॥ १८॥ पृष्ठे चैकं प्रतिस्थानं
    जपेत्तत्राधिदेवताः । शिवं शक्तिं च सादाख्यमीशं विद्याख्यमेव च ॥ १९॥ वामादिनवशक्तीश्च एताः षोडश देवताः
    । नासत्यो दस्रकश्चैव अश्विनौ द्वौ समीरितौ ॥ २०॥ अथवा मूर्ध्न्यलीके च कर्णयोः श्वसने तथा । बाहुद्वये
    च हृदये नाभ्यामूर्वोर्युगे तथा ॥ २१॥ जानुद्वये च पदयोः पृष्ठभागे च षोडश । शिवश्चेन्द्रश्च रुद्रार्कौ
    विघ्नेशो विष्णुरेव च ॥ २२॥ श्रीश्चैव हृदयेशश्च तथा नाभौ प्रजापतिः । नागश्च नागकन्याश्च उभे च ऋषिकन्यके
    ॥ २३॥ पादयोश्च समुद्राश्च तीर्थाः पृष्ठेऽपि च स्थिताः । एवं वा षोडशस्थानमष्टस्थानम्थोच्यते ॥ २४॥ गुरुस्थानं
    ललाटं च कर्णद्वयमनन्तरम् । असयुग्मं च हृदयं नाभिरित्यष्टमं भवेत् ॥ २५॥ ब्रह्मा च ऋषयः सप्त देवताश्च
    प्रकीर्तिताः । अथवा मस्तकं बाहू हृदयं नाभिरेव च ॥ २६॥ पञ्चस्थानान्यमून्याहुर्भस्मतत्त्वविदो जनाः ।
    यथासम्भवतः कुर्याद्देशकलाद्यपेक्षया ॥ २७॥ उद्धूलनेऽप्यशक्तश्चेत्त्रिपुण्ड्रादीनि कारयेत् । ललाटे हृदये
    नाभौ गले च मणिबन्धयोः ॥ २८॥ बाहुमध्ये बाहुमूले पृष्ठे चैव च शीर्षके ॥ ललाटे ब्रह्मणे नमः । हृदये हव्यवाहनाय
    नमः । नाभौ स्कन्दाय नमः । गले विष्णवे नमः । मध्ये प्रभञ्जनाय नमः । मणिबन्धे वसुभ्यो नमः । पृष्ठे हरये
    नमः । कुकुदि शम्भवे नमः । शिरसि परमात्मने नमः । इत्यादिस्थानेषु त्रिपुण्ड्रं धारयेत् ॥ त्रिनेत्रं
    त्रिगुणाधारं त्रयाणां जनकं प्रभुम् । स्मरन्नमः शिवायेति ललाटे तत्त्रिपुण्ड्रकम् ॥ २९॥ कूर्पराधः पितृभ्यां
    तु ईशानाभ्यां तथोपरि । ईशाभ्यां नम इत्युक्त्वा पार्श्वयोश्च त्रिपुण्ड्रकम् ॥ ३०॥ स्वच्छाभ्यां नम इत्युक्त्वा
    धारयेत्तत्प्रकोष्ठयोः । भीमायेति तथा पृष्ठे शिवायेति च पार्श्वयोः ॥ ३१॥ नीलकण्ठाय शिरसि क्षिपेत्सर्वात्मने
    नमः । पापं नाशयते कृत्स्नमपि जन्मान्तरार्जितम् ॥ ३२॥ कण्ठोपरि कृतं पापं नष्टं स्यात्तत्र धारणात् ।
    कर्णे तु धारणात्कर्णरोगादिकृतपातकम् ॥ ३३॥ बाह्वोबाहुकृतं पापं वक्षःसु मनसा कृतम् । नाभ्यां शिश्नकृतं
    पापं पृष्ठे गुदकृतं तथा ॥ ३४॥ पार्श्वयोर्धारणात्पापं परस्त्र्यालिङ्गनादिकम् । तद्भस्मधारणं कुर्यात्सर्वत्रैव
    त्रिपुण्ड्रकम् ॥ ३५॥ ब्रह्मविष्णुमहेशानां त्रय्यग्नीनां च धारणम् । गुणलोकत्रयाणां च धारणं तेन वै श्रुतम्
    ॥ ३६॥ इति चतुर्थं ब्राह्मणम् ॥ ४॥ मानस्तोकेन मन्त्रेण मन्त्रितं भस्म धारयेत् । ऊर्ध्वपुण्ड्रं भवेत्सामं
    मध्यपुण्ड्रं त्रियायुषम् ॥ १॥ त्रियायुषाणि कुरुते ललाटे च भुजद्वये । नाभौ शिरसि हृत्पार्श्वे ब्राह्मणाः
    क्षत्रियास्तथा ॥ २॥ त्रैवर्णिकानां सर्वेषामग्निहोत्रसमुद्भवम् । इदं मुख्यं गृहस्थानां विरजानलजं भवेत्
    ॥ ३॥ विरजानलजं चैव धार्यं प्रोक्तं महर्षिभिः । औपासनसमुत्पन्नं गृहस्थानां विशेषतः ॥ ४॥ समिदग्निसमुत्पन्नं
    धार्यं वै ब्रह्मचारिणा । शूद्राणां श्रोत्रियागारपचनाग्निसमुद्भवम् ॥ ५॥ अन्येषामपि सर्वेषां धार्यं
    चैवानलोद्भवम् । यतीनां ज्ञानदं प्रोक्तं वनस्थानां विरक्तिदम् ॥ ६॥ अतिवर्णाश्रमाणां तु श्मशानाग्निसमुद्भवम्
    । सर्वेषां देवालयस्थं भस्म शिवाग्निजं शिवयोगिनाम् । शिवालयस्थं तल्लिङ्गलिप्तं वा मन्त्रसंस्कारदग्धं
    वा ॥ तत्रैते श्लोका भवन्ति । तेनाधीतं श्रुतं तेन तेन सर्वमनुष्ठितम् । येन विप्रेण शिरसि त्रिपुण्ड्रं
    भस्मना धृतम् ॥ ७॥ त्यक्तवर्णाश्रमाचारो लुप्तसर्वक्रियोऽपि यः । सकृत्तिर्यक्त्रिपुण्ड्राङ्कधारणात्सोऽपि
    पूज्यते ॥ ८॥ ये भस्मधारणं त्यक्त्वा कर्म कुर्वन्ति मानवाः । तेषां नास्ति विनिर्मोक्षः संसाराज्जन्मकोटिभिः
    ॥ ९॥ महापातकयुक्तानां पूर्वजन्मार्जितागसाम् । त्रिपुण्ड्रोद्धूलनद्वेषो जायते सुदृढं बुधाः ॥ १०॥ येषां
    कोपो भवेद्ब्रह्मंॅल्ललाटे भस्मदर्शनात् । तेषामुत्पत्तिसाङ्कर्यमनुमेयं विपश्चिता ॥ ११॥ येषां नास्ति
    मुने श्रद्धा श्रौते भस्मनि सर्वदा । गर्भाधानादिसंस्कारस्तेषां नास्तीति निश्चयः ॥ १२॥ ये भस्मधारिणं
    दृष्ट्वा नराः कुर्वन्ति ताडनम् । तेषां चण्डालतो जन्म ब्रह्मन्नूह्यं विपश्चिता ॥ १३॥ येषां क्रोधो भवेद्भस्मधारणे
    तत्प्रमाणके । ते महापातकैर्युक्ता इति शास्त्रस्य निश्चयः ॥ १४॥ त्रिपुण्ड्ऱकं ये विनिन्दन्ति निन्दन्ति
    शिवमेव ते । धारयन्ति च ये भक्त्या धारयन्ति शिवं च ते ॥ १५॥ धिग्भस्मरहितं भालं धिग्ग्राममशिवालयम् ।
    धिगनीशार्चनं जन्म धिग्विद्यामशिवाश्रयाम् ॥ १६॥ रुद्राग्नेर्यत्परं वीर्यं तद्भस्म परिकीर्तितम् । तस्मात्सर्वेषु
    कालेषु वीर्यवान्भस्मसंयुतः ॥ १७॥ भस्मनिष्ठस्य दह्यन्ते दोषा भस्माग्निसङ्गमात् । भस्मस्नानविशुद्धात्मा
    भस्मनिष्ठ इति स्मृतः ॥ १८॥ भस्मसन्दिग्धसर्वाङ्गो भस्मदीप्तत्रिपुण्ड्रकः । भस्मशायी च पुरुषो भस्मनिष्ठ
    इति स्मृतः ॥ १९॥ इति पञ्चमं ब्राह्मणम् ॥ ५॥ अथ भुसुण्डः कालाग्निरुद्रं नामपञ्चकस्य माहात्म्यं ब्रूहीति
    होवाच । अथ वसिष्ठवंशजस्य शतभार्यासमेतस्य धनञ्जयस्य ब्राह्मणस्य ज्येष्ठभार्यापुत्रः करुण इति नाम तस्य
    शुचिस्मिता भार्या । असौ करुणो भ्रातृवैरमसहमानो भवानीतटस्थं नृसिंहमगमत् । तत्र देवसमीपेऽन्येनोपायनार्थं
    समर्पितं जम्बीरफलं गृहीत्वाजिघ्रत्तदा तत्रस्था अशपन्पाप मक्षिको भव वर्षाणां शतमिति । सोऽपि शापमादाय
    मक्षिकः सन्स्वचेष्टितं तस्यै निवेद्य मां रक्षेति स्वभार्यामवदत्तदा मक्षिकोऽभवत्तमेवं ज्ञात्वा ज्ञातयस्तैलमध्ये
    ह्यमारयन्त्सा मृतं पतिमादायारुन्धतीमगमद्भो शुचिस्मिते शोकेनालमरुन्धत्याहामुं जीवयाम्यद्य विभूतिमादायेति
    एषाग्निहोत्रजं भस्म ॥ मृत्युञ्जयेन मन्त्रेण मृतजन्तौ तदाक्षिपत् । मन्दवायुस्तदा जज्ञे व्यजनेन शुचिस्मिते
    ॥ १॥ उदतिष्ठत्तदा जन्तुर्भस्मनोऽस्य प्रभावतः । ततो वर्षशते पूर्णे ज्ञातिरेको ह्यमारयत् ॥ २॥ भस्मैव
    जीवयामास काश्यां पञ्च तदाभवन् । देवानपि तथाभूतान्मामप्येतादृशं पुरा ॥ ३॥ तस्मात्तु भस्मनां जन्तुं
    जीवयामि तदानघे । इत्येवमुक्त्वा भगवान्दधीचिः समजायत ॥ ४॥ स्वरूपं च ततो गत्वा स्वमाश्रमपदं ययाविति
    ॥ इदानीमस्य भस्मनः सर्वाघभक्षणसामर्थ्यं विधत्त इत्याह । श्रीगौतमविवाहकाले तामहल्यां दृष्ट्वा सर्वे
    देवाः कामातुरा अभवन् तदा नष्टज्ञाना दुर्वाससं गत्वा पप्रच्छुस्तद्दोषं शमयिष्यामीत्युवाच ततः शतरुद्रेण
    मन्त्रेण मन्त्रितं भस्म वै पुरा मयापि दत्तं ब्रह्महत्यादि शान्तम् । इत्येवमुक्त्वा दुर्वासा दत्तवान्भस्म
    चोत्तमम् । जाता मद्वचनात्सर्वे यूयं तेऽधिकतेजसः ॥ ५॥ शतरुद्रेण मन्त्रेण भस्मोद्धूलितविग्रहाः । निर्धूतरजसः
    सर्वे तत्क्षणाच्च वयं मुने ॥ ६॥ आश्चर्यमेतज्जानीमो भस्मसामर्थ्यमीदृशम् । अस्य भस्मनः शक्तिमन्यां श
