id: shankukarnakritamshivastotram
category: stotram
name:
  english: shankukarnakritamshivastotram
  devanagari: शन्कुकर्णकृतंशिवस्तोत्रम्
content:
  english: shankukarnakritam shivastotram shankukarna uvaca | kapardinam tvam paratah parastadgoptaramekam
    purusham puranam | vrajami yogeshvaramishitaramadityamagnim kapiladhirudham || 1|| tvam brahmaparam
    hridi sannivishtam hiranmayam yoginamadimantam | vrajami rudram sharanam divistham mahamunim brahmamayam
    pavitram || 2|| sahasrapadakshishiro'bhiyuktam sahasrabahum tamasah parastat | tvam brahmaparam pranamami
    shambhum hiranyagarbhadhipatim trinetram || 3|| yatah prasutirjagato vinasho yenavritam sarvamidam
    shivena | tam brahmaparam bhagavantamisham pranamya nityam sharanam prapadye || 4|| alingamalokavihinarupam
    svayamprabhum citpatimaikarudram | tam brahmaparam parameshvaram tvam namaskarishye na yato'nyadasti
    || 5|| yam yoginastyaktasabijayoga labdhva samadhim paramatmabhutah | pashyanti devam pranato'smi
    nityam tam brahmaparam bhavatah svarupam || 6|| na yatra namani visheshatriptirna sandrishe tishthati
    yatsvarupam | tam brahmaparam pranato'smi nityam svayambhuvam tvam sharanam prapadye || 7|| yadvedavedabhirata
    videham sabrahmavijnanamabhedamekam | pashyantyanekam bhavatah svarupam tadbrahmaparam pranato'smi
    nityam || 8|| yatah pradhanam purushah purano vivarttate yam pranamanti devah | namami tam jyotishi
    sannivishtam kalam brihantam bhavatah svarupam || 9|| vrajami nityam sharanam guhesham sthanum prapadye
    girisham puranam | shivam prapadye haramindumaulim pinakinam tvam sharanam vrajami || 10|| iti kurmapurane
    trayastrimshadhyayantargatam shankukarnakritam shivastotram samaptam | kurmapurane purvabhage 33
  devanagari: शङ्कुकर्णकृतं शिवस्तोत्रम् शङ्कुकर्ण उवाच । कपर्दिनं त्वां परतः परस्ताद्गोप्तारमेकं पुरुषं
    पुराणम् । व्रजामि योगेश्वरमीशितारमादित्यमग्निं कपिलाधिरूढम् ॥ १॥ त्वां ब्रह्मपारं हृदि सन्निविष्टं
    हिरण्मयं योगिनमादिमन्तम् । व्रजामि रुद्रं शरणं दिविस्थं महामुनिं ब्रह्ममयं पवित्रम् ॥ २॥ सहस्रपादाक्षिशिरोऽभियुक्तं
    सहस्रबाहुं तमसः परस्तात् । त्वां ब्रह्मपारं प्रणमामि शम्भुं हिरण्यगर्भाधिपतिं त्रिनेत्रम् ॥ ३॥ यतः
    प्रसूतिर्जगतो विनाशो येनावृतं सर्वमिदं शिवेन । तं ब्रह्मपारं भगवन्तमीशं प्रणम्य नित्यं शरणं प्रपद्ये
    ॥ ४॥ अलिङ्गमालोकविहीनरूपं स्वयम्प्रभुं चित्पतिमैकरुद्रम् । तं ब्रह्मपारं परमेश्वरं त्वां नमस्करिष्ये
    न यतोऽन्यदस्ति ॥ ५॥ यं योगिनस्त्यक्तसबीजयोगा लब्ध्वा समाधिं परमात्मभूताः । पश्यन्ति देवं प्रणतोऽस्मि
    नित्यं तं ब्रह्मपारं भवतः स्वरूपम् ॥ ६॥ न यत्र नामानि विशेषतृप्तिर्न सन्दृशे तिष्ठति यत्स्वरूपम् ।
    तं ब्रह्मपारं प्रणतोऽस्मि नित्यं स्वयम्भुवं त्वां शरणं प्रपद्ये ॥ ७॥ यद्वेदवेदाभिरता विदेहं सब्रह्मविज्ञानमभेदमेकम्
    । पश्यन्त्यनेकं भवतः स्वरूपं तद्ब्रह्मपारं प्रणतोऽस्मि नित्यम् ॥ ८॥ यतः प्रधानं पुरुषः पुराणो विवर्त्तते
    यं प्रणमन्ति देवाः । नमामि तं ज्योतिषि सन्निविष्टं कालं बृहन्तं भवतः स्वरूपम् ॥ ९॥ व्रजामि नित्यं
    शरणं गुहेशं स्थाणुं प्रपद्ये गिरिशं पुराणम् । शिवं प्रपद्ये हरमिन्दुमौलिं पिनाकिनं त्वां शरणं व्रजामि
    ॥ १०॥ इति कूर्मपुराणे त्रयस्त्रिंशाध्यायान्तर्गतं शङ्कुकर्णकृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे
    पूर्वभागे ३३
