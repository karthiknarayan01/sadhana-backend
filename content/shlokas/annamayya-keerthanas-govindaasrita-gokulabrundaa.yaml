id: annamayya-keerthanas-govindaasrita-gokulabrundaa
category: stotram
name:
  english: Annamayya Keerthanas Govindaasrita Gokulabrundaa
content:
  english: adi pallavi govindashrita gokulabrinda | pavana jayajaya paramananda || jagadabhirama sahasranama
    | sugunadhama samstutanama | gaganashyama ghanaripu bhima | aganita raghuvamshambudhi soma || govindashrita
    gokulabrinda | jananuta carana sharanyu sharana | danuja harana lalita svarana | anagha caranayata
    bhubharana | dinakara sannibha divyabharana || caranam garuda turanga karottunga | sharadhi bhanga
    phani shayananga | karunapanga kamala sanga | vara shri venkata giripati ranga || govindashrita gokulabrinda
    | pavana jayajaya paramananda ||
  devanagari: आदि पल्लवि गोविन्दाश्रित गोकुलबृन्दा । पावन जयजय परमानन्द ॥ जगदभिराम सहस्रनाम । सुगुणधाम
    संस्तुतनाम । गगनश्याम घनरिपु भीम । अगणित रघुवंशाम्बुधि सोम ॥ गोविन्दाश्रित गोकुलबृन्दा । जननुत चरणा
    शरण्यु शरणा । दनुज हरण ललित स्वरणा । अनघ चरणायत भूभरणा । दिनकर सन्निभ दिव्याभरणा ॥ चरणं गरुड तुरङ्गा
    कारोत्तुङ्गा । शरधि भङ्गा फणि शयनाङ्गा । करुणापाङ्गा कमल सङ्गा । वर श्री वेङ्कट गिरिपति रङ्गा ॥ गोविन्दाश्रित
    गोकुलबृन्दा । पावन जयजय परमानन्द ॥
