    lokebhya shshucamava yajate | iyatyagre juhoti | atheyatyatheyati | traya ime lokah | ebhya eva lokebhya
    shshucamava yajate | anu no 'dyanumatirityahanumatyai | divastva paraspaya ityaha | diva eveman ~loka
    ndadhara | brahmanastva paraspaya ityaha || || eshveva lokeshu praja dadhara | pranasya tva paraspaya
    ityaha | prajasveva prana ndadhara | shiro va eta tpravargyah | asau khalu va adityah pravargyah |
