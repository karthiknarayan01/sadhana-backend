id: budha-graha-pancharatna-stotram
category: stotram
name:
  english: Budha Graha Pancharatna Stotram
content:
  english: priyangu kalikashyamam rupena pratimam budham | saumyam saumyagunopetam tam budham pranamamyaham
    || atreya gotrajo atyanta vinayo vishvapavanah | campeya pushpa sankasha shcarana shcarubhushanah||
    satyavak satsasankalpa satyabandhu ssadadarah | sarvaroga prashamana ssarva mrityunivarakah || simharudham
    caturbhujam khadgam carma gadadharam | somaputram mahasaumyam dhyayet sarvartha siddhadam || budhobudharcita
    saumyasaumyah citta shshubhapradah | varadankita mudritam devam tam saumyam pranamamyaham ||
  devanagari: प्रियङ्गु कलिकाश्यामं रूपेणा प्रतिमं बुधम् । सौम्यं सौम्यगुणोपेतं तं बुधं प्रणमाम्यहम् ॥
    आत्रेय गोत्रजो अत्यन्त विनयो विश्वपावनः । चाम्पेय पुष्प सङ्काश श्चारण श्चारुभूषणः॥ सत्यवाक् सत्ससङ्कल्प
    सत्यबन्धु स्सदादरः । सर्वरोग प्रशमन स्सर्व मृत्युनिवारकः ॥ सिंहारूढं चतुर्भुजां खड्गं चर्म गदाधरम्
    । सोमपुत्रं महासौम्यं ध्यायेत् सर्वार्थ सिद्धदम् ॥ बुधोबुधार्चित सौम्यसौम्यः चित्त श्शुभप्रदः । वरदाङ्कित
    मुद्रितं देवं तं सौम्यं प्रणमाम्यहम् ॥
