id: naradastotram-2
category: stotram
name:
  english: naradastotram 2
  devanagari: नारदस्तोत्रम् २
content:
  english: shrinaradastotram yo vedagarbhasya ca garbhajato na garbhajatah khalu vedagarbhah | devarshivaryam
    haridasavaryamadeshikanam pravaram tamide || 1|| guroh purareshcaranabjasevaya avapa yo mantravaram
    murareh | krishnaya yo'nugrahato dadau tamadeshikanam pravaram tamide || 2|| naram tamo yo dyati narado'to
    devarshivaryo'bhimatah suranam | rajarshiviprarshimaharshivandyah adeshikanam pravaram tamide || 3||
    narayano yena prasadito'ddha parayanam kartumana jananam | jagau nijam naradapancaratramadeshikanam
    pravaram tamide || 4|| sheshadishesham harerbhaktikandam lebhe tamaradhyapadam prasadya | prakashayamasa
    hitaya loke adeshikanam pravaram tamide || 5|| harermanomurtirasau muninam manoniyantakhilamurtibhajam
    | maccetaso yo mudamatanoti adeshikanam pravaram tamide || 6|| sanatkumarairupashikshito yo yo'shikshayaddakshakumaramukhyan
    | samuddhrita daityapateh kumara adeshikanam pravaram tamide || 7|| samagatah pithavare niveshito
    vyasaya yo bhagavatagamam dadau | jahara yastatkhilatam manogatamadeshikanam pravaram tamide || 8||
    itidam brahmaratena surarsheh kirtitam stavam | adhiyano dharayanva nihshreyasamavapnuyat || 9||
  devanagari: श्रीनारदस्तोत्रम् यो वेदगर्भस्य च गर्भजातो न गर्भजातः खलु वेदगर्भः । देवर्षिवर्यं हरिदासवर्यमादेशिकानां
    प्रवरं तमीडे ॥ १॥ गुरोः पुरारेश्चरणाब्जसेवया अवाप यो मन्त्रवरं मुरारेः । कृष्णाय योऽनुग्रहतो ददौ तमादेशिकानां
    प्रवरं तमीडे ॥ २॥ नारं तमो यो द्यति नारदोऽतो देवर्षिवर्योऽभिमतः सुराणाम् । राजर्षिविप्रर्षिमहर्षिवन्द्यः
    आदेशिकनां प्रवरं तमीडे ॥ ३॥ नारायणो येन प्रसादितोऽद्धा पारायणं कर्तुमना जनानाम् । जगौ निजं नारदपञ्चरात्रमादेशिकानां
    प्रवरं तमीडे ॥ ४॥ शेषादिशेषं हरेर्भक्तिकाण्डं लेभे तमाराध्यपदं प्रसाद्य । प्रकाशयामास हिताय लोके आदेशिकानां
    प्रवरं तमीडे ॥ ५॥ हरेर्मनोमूर्तिरसौ मुनीनां मनोनियन्ताखिलमूर्तिभाजाम् । मच्चेतसो यो मुदमातनोति आदेशिकानां
    प्रवरं तमीडे ॥ ६॥ सनत्कुमारैरुपशिक्षितो यो योऽशिक्षयद्दक्षकुमारमुख्यान् । समुद्धृता दैत्यपतेः कुमारा
    आदेशिकानां प्रवरं तमीडे ॥ ७॥ समागतः पीठवरे निवेशितो व्यासाय यो भागवतागमं ददौ । जहार यस्तत्खिलतां मनोगतामादेशिकानां
    प्रवरं तमीडे ॥ ८॥ इतीदं ब्रह्मरातेन सुरर्षेः कीर्तितं स्तवम् । अधीयानो धारयन्वा निःश्रेयसमवाप्नुयात्
    ॥ ९॥
