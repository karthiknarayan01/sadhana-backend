id: devikritam2shivastotram
category: stotram
name:
  english: devikritam2shivastotram
  devanagari: देवीकृतं२शिवस्तोत्रम्
content:
  english: devikritam 2 shivastotram devyuvaca | devadeva jagannatha bhaktanugrahakaraka | samastajnanasampanna
    namaste'stu maheshvara || 2|| namo'stu vai tripuraprahartre mahatmane tarakamardanaya | namo'stu te
    kshirasamudradayine shishormunindrasya samahitasya || 3|| namo'stu te sarvajagadvidhatre sarvatra
    sarvatmaka sarvakartre | namo bhavayastu namo'bhavaya namo'stu te sarvagataya nityam || 4|| iti shriskandapurane
    prabhasakhande prabhasakshetramahatmye saptamadhyayantargatam devikritam shivastotram samaptam | skandapurana
    | prabhasakhanda | adhyaya 7
  devanagari: देवीकृतं २ शिवस्तोत्रम् देव्युवाच । देवदेव जगन्नाथ भक्तानुग्रहकारक । समस्तज्ञानसम्पन्न नमस्तेऽस्तु
    महेश्वर ॥ २॥ नमोऽस्तु वै त्रिपुरप्रहर्त्रे महात्मने तारकमर्दनाय । नमोऽस्तु ते क्षीरसमुद्रदायिने शिशोर्मुनीन्द्रस्य
    समाहितस्य ॥ ३॥ नमोऽस्तु ते सर्वजगद्विधात्रे सर्वत्र सर्वात्मक सर्वकर्त्रे । नमो भवायास्तु नमोऽभवाय
    नमोऽस्तु ते सर्वगताय नित्यम् ॥ ४॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये सप्तमाध्यायान्तर्गतं
    देवीकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय ७
meaning: {}
