id: ramastotram-14
category: stotram
name:
  english: ramastotram 14
  devanagari: रामस्तोत्रम् १४
content:
  english: shriramastotram 14 shriramah sharanam samastajagatam ramam vina ka gatih ramena pratihanyate
    kalimalam ramaya karyam namah | ramattrasyati kalabhimabhujago ramasya sarvam vashe rame bhaktirakhandita
    bhavatu me rama tvamevashrayah || 1|| citrakutalayam ramamindiranandamandiram | vande ca paramanandam
    bhaktanamabhayapradam || 2|| brahmavishnumaheshadya yasyamsha lokasadhakah | namami devam cidrupam
    vishuddham paramam bhaje || 3||
  devanagari: श्रीरामस्तोत्रम् १४ श्रीरामः शरणं समस्तजगतां रामं विना का गतिः रामेण प्रतिहन्यते कलिमलं
    रामाय कार्यं नमः । रामात्त्रस्यति कालभीमभुजगो रामस्य सर्वं वशे रामे भक्तिरखण्डिता भवतु मे राम त्वमेवाश्रयः
    ॥ १॥ चित्रकूटालयं राममिन्दिरानन्दमन्दिरम् । वन्दे च परमानन्दं भक्तानामभयप्रदम् ॥ २॥ ब्रह्मविष्णुमहेशाद्या
    यस्यांशा लोकसाधकाः । नमामि देवं चिद्रूपं विशुद्धं परमं भजे ॥ ३॥
meaning: {}
