id: narayanopanishad
category: upanishad
name:
  english: narayanopanishad
  devanagari: नारायणोपनिषद्
content:
  english: '||8|| tasyamadhye mahanagnirvishvarcirvishvatomukhah | so''grabhugvibhajantishthannaharamajarah
    kavih | tiryagurdhvamadhahshayi rashmayastasyasamtata ||9|| tya sushumnanaḻacya madhyabhagi aneka
    jvalamni yukta ani aneka mukhamni sampanna asalela mahana agni rahato'
  devanagari: ॥८॥ तस्यमध्ये महानग्निर्विश्वार्चिर्विश्वतोमुखः । सोऽग्रभुग्विभजन्तिष्ठन्नाहारमजरः कविः
    । तिर्यगूर्ध्वमधःशायी रश्मयस्तस्यसंतता ॥९॥ त्या सुषुम्नानाळाच्या मध्यभागी अनेक ज्वालांनी युक्त आणि
    अनेक मुखांनी संपन्न असलेला महान अग्नि राहतो
meaning: {}
