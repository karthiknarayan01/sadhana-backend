id: sahadevakritamagnistotram
category: stotram
name:
  english: sahadevakritamagnistotram
  devanagari: सहदेवकृतंअग्निस्तोत्रम्
content:
  english: sahadevakritam agnistotram sahadevastu dharmatma sainyam drishtva bhayarditam | paritamagnina
    rajannakampata yatha girih || 26|| upasprishya shucirbhutva so'bravitpavakam tatah | tvadartho'yam
    samarambhah krishnavartmannamo'stu te || 27|| mukham tvamasi devanam yajnastvamasi pavaka | pavanatpavakashcasi
    vahanaddhavyavahanah || 28|| vedastvadartham jatashca jatavedastato hyasi | yajnavighnamimam kartum
    narhastvam havyavahana || 29|| iti mahabharate sabhaparvani 28 adhyayantargatam mahabharata | sabhaparva
    | adhyaya 28
  devanagari: सहदेवकृतं अग्निस्तोत्रम् सहदेवस्तु धर्मात्मा सैन्यं दृष्ट्वा भयार्दितम् । परीतमग्निना राजन्नाकम्पत
    यथा गिरिः ॥ २६॥ उपस्पृश्य शुचिर्भूत्वा सोऽब्रवीत्पावकं ततः । त्वदर्थोऽयं समारम्भः कृष्णवर्त्मन्नमोऽस्तु
    ते ॥ २७॥ मुखं त्वमसि देवानां यज्ञस्त्वमसि पावक । पावनात्पावकश्चासि वहनाद्धव्यवाहनः ॥ २८॥ वेदास्त्वदर्थं
    जाताश्च जातवेदास्ततो ह्यसि । यज्ञविघ्नमिमं कर्तुं नार्हस्त्वं हव्यवाहन ॥ २९॥ इति महाभारते सभापर्वणि
    २८ अध्यायान्तर्गतं महाभारत । सभापर्व । अध्याय २८
meaning: {}
