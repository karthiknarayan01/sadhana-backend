id: kyts-1-1-ishe-tvorje-tva-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.1 Ishe Tvorje Tva - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande prathamah prashnah shri gurubhyo namah
    | harih om || ishe tvorje tva vayavah sthopayavah stha devo vah savita prarpayatu shreshthatamaya
    karmana a pyayaddhvamaghniya devabhaga murjasvatih payasvatih prajavati ranamiva ayakshma ma vah stena
    ishata ma 'ghashagmso rudrasya hetih pari vo vrinaktu dhruva asmi ngopatau syata bahvi yajnasya ghoshadasi
    pratyushtagm rakshah pratyushta aratayah preya magaddhishana barhiraccha manuna krita svadhaya vitashta
    ta a vahanti kavayah purasta ddevebhyo jushtamiha barhi mparishutamasi varshavriddhamasi devabar kparva
    te raddhyasamacchetta te ma risha vi vayagm ruhema prithivya ssampricah pahi susambhrita tva sambharamyadityai
    rasna 'sindranyai sannahana ngrathnatu sa te ma '' sthadindrasya tva bahubhyamudyacche brihaspate
    rmurdhna haramyurvantarikshamanvihi devangamamasi || ndaivyaya karmane devayajyayai matarishvano gharmo
    'si dyaurasi prithivyasi vishvadhaya asi paramena dhamna drigmhasva ma hva mpavitramasi shatadharam
    mpavitramasi sahasradharagm huta sstokohuto draphso 'gnaye brihate nakaya svaha dyavaprithivibhyagm
    sa vishvayu ssa vishvakarma sa rurminirmadhumattama mandra dhanasya sataye somena tva ''tanacmindraya
    dadhi vishno havyagm rakshasva || ve~shaya tva pratyushtagm rakshah pratyushta aratayo dhurasi dhurva
    dhurvanta ndevanamasi sasnitama mahrutamasi havirdhana ndrigmhasva ma hva rmitrasya tva cakshusha
    prekshe ma bherma sam higmsishamuru vataya devasya tva savituh prasave nnirvapamyagnishoma ssaha sphatyai
    tva nara tyai suvarabhi vi khyesham ndurya dyavaprithivyo rurvantariksha manvi hyaditya stvopasthe
    sadayamyagne havyagm rakshasva || tpunatvacchidrena pavitrena vaso ssuryasya rashmibhirapo deviragrepuvo
    agreguvo nnayatagre yajnapati ndhatta yushmanindro 'vrinita vritraturye yuyamindra vri~traturye prokshita
    ssthagnaye vo jushta bhyagm shundhaddhva ndaivyaya karmane devayajyaya avadhutagm raksho 'dityastvagasi
    prati tva ttvadhishavanamasi vanaspatya ttvagnestanurasi vaco visarjana ndevavitaye tva grihnamyadrirasi
    vanaspatya ndevebhyo havyagm sushami shamishveshama vadorjama vada dyumadvadata vayagm sanghata shma
    varshavriddhamasi prati tva varshavriddham ve~ttu paraputagm rakshah paraputa aratayo rakshasa mbhago
    'si vayurvo vi vinaktu devo vah savita hiranyapanih prati grihnatu || 'dityastvagasi prati tva prithivive
    sskambhanirasi prati tva 'si parvatya prati tva diva 'si parvateyi prati tva parvatirve ttu devasya
    tva savituh prasave bhyamadhi vapamidhanyamasi dhinuhi deva npranaya tva 'panaya tva vyanaya tva dirghamanu
    prasitimayushedha ndevo vah savita hiranyapanih prati grihnatu || dhrishtirasi brahma yacchapa njahi
    nishkravyadagm sedha va~ha nirdagdhagm raksho nirdagdha aratayo dhruvamasi prithivi ndrigmha sajatanasmai
    yajamanaya paryuha dhartramasyantariksha ndrigmha sajatanasmai yajamanaya paryuha dharunamasi diva
    ndrigmha sajatanasmai yajamanaya paryuha dharmasi disho drigmha yoni ndrigmha sajatanasmai yajamanaya
    paryuha citah stha prajamasmai rayimasmai sajatanasmai yajamanaya paryuha bhrigunamangirasa ya~ni
    gharme kapala nyupacinvanti vedhasah | pushnastanyapi vrata indravayu vi muncatam || rashtacatvarigmshacca
    va~pami samapo adbhiragmata samoshadhayo rasena sagm revati ssrijyaddhvamadbhyah pari prajata sstha
    samadbhih pricyaddhva 'si vishvayururu prathasvoru te yajnapatih prathata ngrihnishvantaritagm raksho
    'ntarita aratayodevastva savita shrapayatu var 'ti dhagagne havyagm rakshasva sa mbrahmana pricyasvaikataya
    svaha a dada indrasya bahurasi dakshina shshatateja vayurasi tigmatejah prithivi devayaja nyoshaddhyaste
    mula 'raruh prithivyai vraja shatu te dyaurbadhana deva savitah paramasya mparavati shatena pashairyo
    ndvishmastamato ma maugapahato 'raruh prithivyai devayajanyai vrajam shatu te dyaurbadhana deva savitah
    paramasya mparavati shatena pashairyo ndvishmastamato ma maugapahato 'raruh prithivya adevayajano
    vraja shatu te dyaurbadhana deva savitah paramasya mparavati shatena pashairyo ndvishmastamato ma
    vasavastva pari grihnantu gayatrena chandasarudrastva pari grihnantu traishtubhena chandasa ''dityastva
    pari grihnantu jagatena chandasa devasya savitu ssave karma krinvanti vedhasa ritamasyritasadana masyritashrirasi
    dha asi svadha asyurvi casi vasvi casi pura krurasya visripo viraphshi njiradanuryamairayan candramasi
    svadhabhista ndhiraso anudrishya yajante || pratyushtagm rakshah pratyushta aratayo 'gne stejishthena
    tejasa ni ntva sapatnasahagm sa ntva sapatnasahigm sa rjmyashasana saumanasa ntanum | agneranuvrata
    bhutva sa nnahye sukritaya kam || suprajasastva vayagm supatnirupa sedima | agne sapatnadambhana vi~shyami
    varunasya pasham ~ya mabaddhnita savita suketah | dhatu shca yonau sukritasya loke syona mme saha
    patya karomi || samayusha samprajaya samagne varcasa punah | sa ngacche samatma tanuva mama || mahina
    'syoshadhinagm rasastasya te 'syoshadhinagm raso 'dabdhena tva cakshusha kshe suprajastvaya tejo 'nu
    prehyagniste tejo ma vi naidagne 'si subhurdevana ndhamnedhamne devebhyo yajusheyajushe bhava shukramasi
    jyotirasi tejo 'si devo vah savito tpunatvacchidrena pavitrena vaso ssuryasya rashmibhih shukra ndhamnedhamne
    devebhyo yajusheyajushe grihnami jyotistva jyotishyarcistva 'rcishi dhamnedhamne devebhyo yajusheyajushe
    grihnami || rashmibhih shukragm tva svaha vedirasi barhishe tva svaha barhirasi srugbhyastva svaha
    dive tva 'ntarikshaya tva prithivyai tva svadha pitribhya urgbhava bar hishadbhya urja prithivi ntva
    strinami svasastha ndevebhyo gandharvo rvishvasmadishato yajamanasya paridhirida idita indrasya bahurasi
    dakshino yajamanasya paridhirida idito mitravarunau tvottaratah pari dhatta ndhruvena dharmana yajamanasya
    paridhirida idita ssuryastva purasta shcidabhishastya vitiho ntva kave dyumantagm samidhimahyagne
    brihantamaddhvare visho yantre stho vasunagm rudrana madityanagm sadasi sida juhurupabhri 'si ghritaci
    namna priye sadasi sidaita asadan thsukritasya loke ta vishno pahi pahi yajna bhuvanamasi vi prathasvagne
    yashtarida nnamah | juhvehyagnistva hvayati devayajyaya upabhridehi devastva savita hvayati devayajyaya
    agnavishnu ma vamava kramisham mme lokakritau krinutam ssthanamasita indro akrino dviryani samarabhyordhvo
    addhvaro divisprishamahruto yajno yajnapate thsvaha brihadbhah pahi ma 'gne dushcaritada ma sucarite
    bhaja makhasya shiro 'si sanjyotisha jyotiranktam || vajasya ma prasaveno dgrabhenodagrabhit | atha
    sapatnagm indro me nigrabhenadharagm akah || udgrabha nca brahma deva avivridhann | atha sapatnanindragni
    me vishucinan vyasyatam || vasubhyastva rudrebhyastva ''dityebhyastva 'ktagm rihana viyantu vayah
    || prajam mma nirmrikshama pyayantamapa oshadhayo maruta gaccha tato no vrishtimeraya | ayushpa agne
    'syayurme pahi cakshushpa agne 'si cakshurme pahi dhruva mparyadhattha agne deva panibhi mbharami
    nedesha tvadapacetayatai yajnasya patha upa samitagm sagg ssthesha brihantah prastareshtha bar va~camabhi
    vishve grinanta asadyasmi nbarhishi madayaddhvamagne rvamapannagrihasya sadasi sadayami sumnaya sumnini
    sumne ma dhatta ndhuri dharyau patamagne 'dabdhayo 'shitatano pahi ma 'dya divah pahi prasityai pahi
    durishtyai pahi duradmanyai pahi dushcaritadavisha nkrinu sushada yonigg svaha deva gatuvido gatum
    vi~ttva gatu mita manasaspata ima nno deva deveshu yajnagg svaha vaci svaha vate dhah || ubha vamindragni
    ahuvaddhya ubha radhasa | ubha dataravishagm rayinamubha vajasya sataye huve vam || ashravagm hi bhuridavattara
    vam vi~jamaturuta va gha syalat | atha somasya prayati yuvabhyamindra mpuro dasapatniradhunutam |
    sakamekena karmana || shuci gni vritrahana jushetha || ubha hi vagm suhava johavimi ta vajagm sadya
    ushate dheshtha || vayamu tva pathaspate ratha nna vajasataye | dhiye pushannayujmahi || pathaspathah
    paripatim va~casya kamena krito abhyanadarkam | sano rasacchurudhashcandragra dhiyandhiyagm sishadhati
    pra pusha || kshetrasya patina vayagm hiteneva jayamasi | gamashva mposhayitnva sa no || kshetrasya
    pate madhumanta ndhenuriva payo asmasu dhukshva | madhushcuta mritasya nah patayo mridayantu || agne
    naya supatha raye asman vishvani deva vayunani vidvan | yuyoddhyasma jjuhuranameno bhuyishtha vi~dhema
    || a devanamapi pantha maganma yacchaknavama tadanu pravodhum | agni thsedu hota so addhvaran thsa
    ritun kalpayati || yadvahishtha ntadagnaye brihadarca vibhavaso | mahishiva tvadrayistvadvaja udirate
    || agne tva mparaya navyo asman thsvastibhirati durgani vishva | pushca prithvi bahula na urvi bhava
    tokaya tanayaya sham yoh ~|| tvamagne vratapa asi deva a martyeshva | tvam ya~jneshvidyah || yadvo
    vaya mpraminama vratani vidusha ndeva avidushtarasah | agnishta dvishvama prinati vidvan rdevagm ritubhih
    kalpayati || || harih om || || krishna yajurvediya taittiriya samhitaya mprathamakande prathamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे प्रथमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ इ॒षे त्वो॒र्जे त्वा॑ वा॒यवः॑ स्थोपा॒यवः॑ स्थ दे॒वो वः॑ सवि॒ता प्रार्प॑यतु॒ श्रेष्ठ॑तमाय॒ कर्म॑ण॒
    आ प्या॑यद्ध्वमघ्निया देवभा॒ग मूर्ज॑स्वतीः॒ पय॑स्वतीः प्र॒जाव॑ती रनमी॒वा अ॑य॒क्ष्मा मा वः॑ स्ते॒न ई॑शत॒
    मा ऽघशग्ं॑सो रु॒द्रस्य॑ हे॒तिः परि॑ वो वृणक्तु ध्रु॒वा अ॒स्मि न्गोप॑तौ स्यात ब॒ह्वी य॒ज्ञस्य॑ घो॒षद॑सि॒
    प्रत्यु॑ष्ट॒ग्ं॒ रक्षः॒ प्रत्यु॑ष्टा॒ अरा॑तयः॒ प्रेय म॑गाद्धि॒षणा॑ ब॒र्॒हिरच्छ॒ मनु॑ना कृ॒ता स्व॒धया॒
    वित॑ष्टा॒ त आ व॑हन्ति क॒वयः॑ पु॒रस्ता द्दे॒वेभ्यो॒ जुष्ट॑मि॒ह ब॒र्॒हि म्परिषू॒तम॑सि व॒र्॒षवृ॑द्धमसि॒
    देव॑बर् क्पर्व॑ ते राद्ध्यासमाच्छे॒त्ता ते॒ मा रि॑ष॒ वि व॒यग्ं रु॑हेम पृथि॒व्या स्स॒म्पृचः॑ पाहि सुस॒म्भृता
    त्वा॒ सम्भ॑रा॒म्यदि॑त्यै॒ रास्ना॑ ऽसीन्द्रा॒ण्यै स॒न्नह॑न ङ्ग्र॑थ्नातु॒ स ते॒ मा ऽऽ स्था॒दिन्द्र॑स्य
    त्वा बा॒हुभ्या॒मुद्य॑च्छे॒ बृह॒स्पते र्मू॒र्ध्ना ह॑राम्यु॒र्व॑न्तरि॑क्ष॒मन्वि॑हि देवङ्ग॒मम॑सि ॥ न्दैव्या॑य॒
    कर्म॑णे देवय॒ज्यायै॑ मात॒रिश्व॑नो घ॒र्मो॑ ऽसि॒ द्यौर॑सि पृथि॒व्य॑सि वि॒श्वधा॑या असि पर॒मेण॒ धाम्ना॒
    दृग्ंह॑स्व॒ मा ह्वा॒ म्प॒वित्र॑मसि श॒तधा॑रं॒ म्प॒वित्र॑मसि स॒हस्र॑धारग्ं हु॒त स्स्तो॒कोहु॒तो द्र॒फ्सो
    ऽग्नये॑ बृह॒ते नाका॑य॒ स्वाहा॒ द्यावा॑पृथि॒वीभ्या॒ग्ं॒ सा वि॒श्वायु॒ स्सा वि॒श्वक॑र्मा॒ स रू॒र्मिणी॒र्मधु॑मत्तमा
    म॒न्द्रा धन॑स्य सा॒तये॒ सोमे॑न॒ त्वा ऽऽत॑न॒च्मीन्द्रा॑य॒ दधि॒ विष्णो॑ ह॒व्यग्ं र॑क्षस्व ॥ वेँषा॑य
    त्वा॒ प्रत्यु॑ष्ट॒ग्ं॒ रक्षः॒ प्रत्यु॑ष्टा॒ अरा॑तयो॒ धूर॑सि॒ धूर्व॒ धूर्व॑न्त॒ न्दे॒वाना॑मसि॒ सस्नि॑तम॒
    मह्रु॑तमसि हवि॒र्धान॒ न्दृग्ंह॑स्व॒ मा ह्वा र्मि॒त्रस्य॑ त्वा॒ चक्षु॑षा॒ प्रेक्षे॒ मा भेर्मा सं हिग्ंसिषमु॒रु
    वाता॑य दे॒वस्य॑ त्वा सवि॒तुः प्र॑स॒वे न्निर्व॑पाम्य॒ग्नीषोमा स्स॒ह स्फा॒त्यै त्वा॒ नारा त्यै॒ सुव॑र॒भि
    वि ख्ये॑षं न्दुर्या॒ द्यावा॑पृथि॒व्यो रु॒र्व॑न्तरि॑क्ष॒ मन्वि॒ ह्यदि॑त्या स्त्वो॒पस्थे॑ सादया॒म्यग्ने॑
    ह॒व्यग्ं र॑क्षस्व ॥ त्पु॑ना॒त्वच्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒ स्सूर्य॑स्य र॒श्मिभि॒रापो॑ देवीरग्रेपुवो
    अग्रेगु॒वो न्न॑य॒ताग्रे॑ य॒ज्ञप॑ति न्धत्त यु॒ष्मानिन्द्रो॑ ऽवृणीत वृत्र॒तूर्ये॑ यू॒यमिन्द्र॑ वृँत्र॒तूर्ये॒
    प्रोक्षि॑ता स्स्था॒ग्नये॑ वो॒ जुष्ट॒ भ्या॒ग्ं॒ शुन्ध॑द्ध्व॒ न्दैव्या॑य॒ कर्म॑णे देवय॒ज्याया॒ अव॑धूत॒ग्ं॒
    रक्षो ऽदि॑त्या॒स्त्वग॑सि॒ प्रति॑ त्वा त्त्वधि॒षव॑णमसि वानस्प॒त्य त्त्व॒ग्नेस्त॒नूर॑सि वा॒चो वि॒सर्ज॑न
    न्दे॒ववी॑तये त्वा गृह्णा॒म्यद्रि॑रसि वानस्प॒त्य न्दे॒वेभ्यो॑ ह॒व्यग्ं सु॒शमि॑ शमि॒ष्वेष॒मा व॒दोर्ज॒मा
    व॑द द्यु॒मद्व॑दत व॒यग्ं स॑ङ्घा॒त ष्म व॒र्॒षवृ॑द्धमसि॒ प्रति॑ त्वा व॒र्॒षवृ॑द्धं वेँत्तु॒ परा॑पूत॒ग्ं॒
    रक्षः॒ परा॑पूता॒ अरा॑तयो॒ रक्ष॑सा म्भा॒गो॑ ऽसि वा॒युर्वो॒ वि वि॑नक्तु दे॒वो वः॑ सवि॒ता हिर॑ण्यपाणिः॒
    प्रति॑ गृह्णातु ॥ ऽदि॑त्या॒स्त्वग॑सि॒ प्रति॑ त्वा पृथि॒वीवे स्स्क॑म्भ॒निर॑सि॒ प्रति॒ त्वा ऽसि पर्व॒त्या
    प्रति॑ त्वा दि॒व ऽसि पार्वते॒यी प्रति॑ त्वा पर्व॒तिर्वे त्तु दे॒वस्य॑ त्वा सवि॒तुः प्र॑स॒वे भ्या॒मधि॑
    वपामिधा॒न्य॑मसि धिनु॒हि दे॒वा न्प्रा॒णाय॑ त्वा ऽपा॒नाय॑ त्वा व्या॒नाय॑ त्वा दी॒र्घामनु॒ प्रसि॑ति॒मायु॑षेधा
    न्दे॒वो वः॑ सवि॒ता हिर॑ण्यपाणिः॒ प्रति॑ गृह्णातु ॥ धृष्टि॑रसि॒ ब्रह्म॑ य॒च्छापा ञ्जहि॒ निष्क्र॒व्यादग्ं॑
    से॒धा वँह॒ निर्द॑ग्ध॒ग्ं॒ रक्षो॒ निर्द॑ग्धा॒ अरा॑तयो ध्रु॒वम॑सि पृथि॒वी न्दृग्ं॑ह सजा॒तान॒स्मै यज॑मानाय॒
    पर्यू॑ह ध॒र्त्रम॑स्य॒न्तरि॑क्ष न्दृग्ं॑ह सजा॒तान॒स्मै यज॑मानाय॒ पर्यू॑ह ध॒रुण॑मसि॒ दिव॑ न्दृग्ंह सजा॒तान॒स्मै
    यज॑मानाय॒ पर्यू॑ह॒ धर्मा॑सि॒ दिशो॑ दृग्ंह॒ योनि॑ न्दृग्ं॑ह सजा॒तान॒स्मै यज॑मानाय॒ पर्यू॑ह॒ चितः॑ स्थ
    प्र॒जाम॒स्मै र॒यिम॒स्मै स॑जा॒तान॒स्मै यज॑मानाय॒ पर्यू॑ह॒ भृगू॑णा॒मङ्गि॑रसा॒ याँनि॑ घ॒र्मे क॒पाला न्युपचि॒न्वन्ति॑
    वे॒धसः॑ । पू॒ष्णस्तान्यपि॑ व्र॒त इ॑न्द्रवा॒यू वि मु॑ञ्चताम् ॥ र॒ष्टाच॑त्वारिग्ंशच्च वँ॑पामि॒ समापो॑
    अ॒द्भिर॑ग्मत॒ समोष॑धयो॒ रसे॑न॒ सग्ं रे॒वती॒ स्सृज्यद्ध्वम॒द्भ्यः परि॒ प्रजा॑ता स्स्थ॒ सम॒द्भिः पृ॑च्यद्ध्व॒
