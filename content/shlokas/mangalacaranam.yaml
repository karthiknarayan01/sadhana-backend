id: mangalacaranam
category: stotram
name:
  english: mangalacaranam
  devanagari: मन्गलाचरणम्
content:
  english: mangalacaranam shri ganeshaya namah || shrigurubhyo namah || sa jayati sindhuravadano devo
    yatpadapankajasmaranam | vasaramaniriva tamasam rashim nashayati vi'ghnanam || 1|| sumukhashcaikadantashca
    kapilo gajakarnakah | lambodarashca vikato vighnanasho ganadhipah || 2|| dhumraketurganadhyaksho bhalacandro
    gajananah | dvadashaitani namani yah pathecchrinuyadapi || 3|| vidyarambhe vivahe ca praveshe nirgame
    tatha | sangrame sankate caiva vighnastasya na jayate || 4|| shuklambaradharam devam shashivarnam
    caturbhujam | prasannavadanam dhyayet sarvavighnopashantaye || 5|| vyasam vasishthanaptaram shakteh
    pautramakalmasham | parasharatmajam vande shukatatam taponidhim || 6|| vyasaya vishnurupaya vyasarupaya
    vishnave | namo vai brahmanidhaye vasishthaya namo namah || 7|| acaturvadano brahma dvibahuraparo
    harih | abhalalocanah shambhurbhagavan badarayanah || 8|| iti mangalacaranam sampurnam ||
  devanagari: मङ्गलाचरणम् श्री गणेशाय नमः ॥ श्रीगुरुभ्यो नमः ॥ स जयति सिन्धुरवदनो देवो यत्पादपङ्कजस्मरणम्
    । वासरमणिरिव तमसां राशिं नाशयति विऽघ्नानाम् ॥ १॥ सुमुखश्चैकदन्तश्च कपिलो गजकर्णकः । लंबोदरश्च विकटो
    विघ्ननाशो गणाधिपः ॥ २॥ धूम्रकेतुर्गणाध्यक्षो भालचन्द्रो गजानानः । द्वादशैतानि नामानि यः पठेच्छृणुयादपि
    ॥ ३॥ विद्यारंभे विवाहे च प्रवेशे निर्गमे तथा । सङ्ग्रामे सङ्कटे चैव विघ्नस्तस्य न जायते ॥ ४॥ शुक्लांबरधरं
    देवं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत् सर्वाविघ्नोपशान्तये ॥ ५॥ व्यासं वसिष्ठनप्तारं शक्तेः
    पौत्रमकल्मषम् । पराशरात्मजं वन्दे शुकतातं तपोनिधिम् ॥ ६॥ व्यासाय विष्णुरूपाय व्यासरूपाय विष्णवे ।
    नमो वै ब्रह्मनिधये वासिष्ठाय नमो नमः ॥ ७॥ अचतुर्वदनो ब्रह्मा द्विबाहुरपरो हरिः । अभाललोचनः शंभुर्भगवान्
    बादरायणः ॥ ८॥ इति मङ्गलाचरणं सम्पूर्णम् ॥
