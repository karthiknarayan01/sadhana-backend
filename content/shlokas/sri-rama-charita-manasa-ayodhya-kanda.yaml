    pali parijana dukhu harahu || gura ke bacana saciva abhinandanu| sune bharata hiya hita janu candanu
    || suni bahori matu mridu bani| sila saneha sarala rasa sani || cham sani sarala rasa matu bani suni
    bharata byakula bhe| locana saroruha stravata sincata biraha ura ankura ne || so dasa dekhata samaya
    tehi bisari sabahi sudhi deha ki| tulasi sarahata sakala sadara siva~ sahaja saneha ki || so bharatu
    kamala kara jori dhira dhurandhara dhira dhari| bacana amia~ janu bori deta ucita uttara sabahi ||
    atharahava~ vishrama mohi upadesu dinha gura nika| praja saciva sammata sabahi ka || matu ucita dhari
    ayasu dinha| avasi sisa dhari cahu~ kinha || gura pitu matu svami hita bani| suni mana mudita karia
    bhali jani || ucita ki anucita kie~ bicaru| dharamu jai sira pataka bharu || tumha tau dehu sarala
    sikha soi| jo acarata mora bhala hoi || jadyapi yaha samujhata hu~ nikem| tadapi hota paritoshu na
    ji kem || aba tumha binaya mori suni lehu| mohi anuharata sikhavanu dehu || utaru deu~ chamaba aparadhu|
    dukhita dosha guna ganahim na sadhu || do pitu surapura siya ramu bana karana kahahu mohi raju| ehi
    tem janahu mora hita kai apana bara kaju || || hita hamara siyapati sevakai| so hari linha matu kutilai
    || maim anumani dikha mana mahim| ana upaya~ mora hita nahim || soka samaju raju kehi lekhem| lakhana
    rama siya binu pada dekhem || badi basana binu bhushana bharu| badi birati binu brahma bicaru || saruja
    sarira badi bahu bhoga| binu haribhagati jaya~ japa joga || jaya~ jiva binu deha suhai| badi mora
    sabu binu raghurai || jau~ rama pahim ayasu dehu| ekahim a~ka mora hita ehu || mohi nripa kari bhala
    apana cahahu| sau saneha jarata basa kahahu || do kaikei sua kutilamati rama bimukha gatalaja| tumha
    cahata sukhu mohabasa mohi se adhama kem raja || || kahu~ sa~cu saba suni patiahu| cahia dharamasila
    naranahu || mohi raju hathi deihahu jabahim| rasa rasatala jaihi tabahim || mohi samana ko papa nivasu|
    jehi lagi siya rama banabasu || raya~ rama kahu~ kananu dinha| bichurata gamanu amarapura kinha ||
    maim sathu saba anaratha kara hetu| baitha bata saba sunu~ sacetu || binu raghubira biloki abasu|
    rahe prana sahi jaga upahasu || rama punita bishaya rasa rukhe| lolupa bhumi bhoga ke bhukhe || kaha~
    lagi kahaum hridaya kathinai| nidari kulisu jehim lahi baraai || do karana tem karaju kathina hoi
    dosu nahi mora| kulisa asthi tem upala tem loha karala kathora || || kaikei bhava tanu anurage| pa~vara
    prana aghai abhage || jaum priya biraha~ prana priya lage| dekhaba sunaba bahuta aba age || lakhana
    rama siya kahu~ banu dinha| pathi amarapura pati hita kinha || linha bidhavapana apajasu apu| dinheu
    prajahi soku santapu || mohi dinha sukhu sujasu suraju| kinha kaikeim saba kara kaju || ehi tem mora
    kaha aba nika| tehi para dena kahahu tumha tika || kaiki jathara janami jaga mahim| yaha mohi kaha~
    kachu anucita nahim || mori bata saba bidhihim banai| praja pa~ca kata karahu sahai || do graha grahita
    puni bata basa tehi puni bichi mara| tehi piaia baruni kahahu kaha upacara || || kaiki suana jogu
    jaga joi| catura biranci dinha mohi soi || dasaratha tanaya rama laghu bhai| dinhi mohi bidhi badi
    baraai || tumha saba kahahu karhaavana tika| raya rajayasu saba kaha~ nika || utaru deu~ kehi bidhi
    kehi kehi| kahahu sukhena jatha ruci jehi || mohi kumatu sameta bihai| kahahu kahihi ke kinha bhalai
    || mo binu ko sacaracara mahim| jehi siya ramu pranapriya nahim || parama hani saba kaha~ bara lahu|
    adinu mora nahi dushana kahu || samsaya sila prema basa ahahu| sabui ucita saba jo kachu kahahu ||
    do rama matu suthi saralacita mo para premu biseshi| kahi subhaya saneha basa mori dinata dekhi ||
    | gura bibeka sagara jagu jana| jinhahi bisva kara badara samana || mo kaha~ tilaka saja saja sou|
    bhe~ bidhi bimukha bimukha sabu kou || parihari ramu siya jaga mahim| kau na kahihi mora mata nahim
    || so maim sunaba sahaba sukhu mani| antahu~ kica taha~ jaha~ pani || daru na mohi jaga kahihi ki
    pocu| paralokahu kara nahina socu || eki ura basa dusaha davari| mohi lagi bhe siya ramu dukhari ||
    jivana lahu lakhana bhala pava| sabu taji rama carana manu lava || mora janama raghubara bana lagi|
    jhutha kaha pachitau~ abhagi || do apani daruna dinata kahu~ sabahi siru nai| dekhem binu raghunatha
    pada jiya kai jarani na jai || || ana upau mohi nahi sujha| ko jiya kai raghubara binu bujha || ekahim
    a~ka ihi mana mahim| pratakala calihu~ prabhu pahim || jadyapi maim anabhala aparadhi| bhai mohi karana
    sakala upadhi || tadapi sarana sanamukha mohi dekhi| chami saba karihahim kripa biseshi || sila sakuca
    suthi sarala subh | kripa saneha sadana raghur || arihuka anabhala kinha na rama| maim sisu sevaka
    jadyapi bama || tumha pai pa~ca mora bhala mani| ayasu asisha dehu subani || jehim suni binaya mohi
    janu jani| avahim bahuri ramu rajadhani || do jadyapi janamu kumatu tem maim sathu sada sadosa| apana
    jani na tyagihahim mohi raghubira bharosa || || bharata bacana saba kaha~ priya lage| rama saneha
    sudha~ janu page || loga biyoga bishama bisha dage| mantra sabija sunata janu jage || matu saciva
    gura pura nara nari| sakala saneha~ bikala bhe bhari || bharatahi kahahi sarahi sarahi| rama prema
    murati tanu ahi || tata bharata asa kahe na kahahu| prana samana rama priya ahahu || jo pava~ru apani
    jaratai| tumhahi sugai matu kutilai || so sathu kotika purusha sameta| basihi kalapa sata naraka niketa
    || ahi agha avaguna nahi mani gahi| hari garala dukha darida dahi || do avasi calia bana ramu jaha~
    bharata mantru bhala kinha| soka sindhu burata sabahi tumha avalambanu dinha || || bha saba kem mana
    modu na thora| janu ghana dhuni suni cataka mora || calata prata lakhi niranu nike| bharatu pranapriya
    bhe sabahi ke || munihi bandi bharatahi siru nai| cale sakala ghara bida karai || dhanya bharata jivanu
    jaga mahim| silu sanehu sarahata jahim || kahahi parasapara bha bara kaju| sakala calai kara sajahim
    saju || jehi rakhahim rahu ghara rakhavari| so jani janu garadani mari || kau kaha rahana kahia nahim
    kahu| ko na cahi jaga jivana lahu || do jaru so sampati sadana sukhu suhada matu pitu bhai| sanamukha
    hota jo rama pada karai na sahasa sahai || || ghara ghara sajahim bahana nana| harashu hridaya~ parabhata
    payana || bharata jai ghara kinha bicaru| nagaru baji gaja bhavana bha~daru || sampati saba raghupati
    kai ahi| jau binu jatana calaum taji tahi || tau parinama na mori bhalai| papa siromani sai~ dohai
    || kari svami hita sevaku soi| dushana koti dei kina koi || asa bicari suci sevaka bole| je sapanehu~
    nija dharama na dole || kahi sabu maramu dharamu bhala bhasha| jo jehi layaka so tehim rakha || kari
    sabu jatanu rakhi rakhavare| rama matu pahim bharatu sidhare || do arata janani jani saba bharata
    saneha sujana| kaheu banavana palakim sajana sukhasana jana || || cakka cakki jimi pura nara nari|
    cahata prata ura arata bhari || jagata saba nisi bhayu bihana| bharata bolae saciva sujana || kaheu
    lehu sabu tilaka samaju| banahim deba muni ramahim raju || begi calahu suni saciva johare| turata
    turaga ratha naga sa~vare || arundhati aru agini sam | ratha carhai cale prathama munir || bipra brinda
    carhai bahana nana| cale sakala tapa teja nidhana || nagara loga saba saji saji jana| citrakuta kaha~
    kinha payana || sibika subhaga na jahim bakhani| carhai carhai calata bhi saba rani || do saumpi nagara
    suci sevakani sadara sakala calai| sumiri rama siya carana taba cale bharata dau bhai || || rama darasa
    basa saba nara nari| janu kari karini cale taki bari || bana siya ramu samujhi mana mahim| sanuja
    bharata payadehim jahim || dekhi sanehu loga anurage| utari cale haya gaya ratha tyage || jai samipa
    rakhi nija doli| rama matu mridu bani boli || tata carhahu ratha bali mahatari| hoihi priya parivaru
    dukhari || tumharem calata calihi sabu logu| sakala soka krisa nahim maga jogu || sira dhari bacana
    carana siru nai| ratha carhai calata bhe dau bhai || tamasa prathama divasa kari basu| dusara gomati
    tira nivasu || do paya ahara phala asana eka nisi bhojana eka loga| karata rama hita nema brata parihari
    bhushana bhoga || || si tira basi cale bihane| sringaberapura saba niarane || samacara saba sune nishada|
    hridaya~ bicara kari sabishada || karana kavana bharatu bana jahim| hai kachu kapata bhau mana mahim
    || jaum pai jiya~ na hoti kutilai| tau kata linha sanga katakai || janahim sanuja ramahi mari| karu~
    akantaka raju sukhari || bharata na rajaniti ura ani| taba kalanku aba jivana hani || sakala surasura
    jurahim jujhara| ramahi samara na jitanihara || ka acaraju bharatu asa karahim| nahim bisha beli amia
    phala pharahim || do asa bicari guha~ gyati sana kaheu sajaga saba hohu| hathava~sahu borahu tarani
    kijia ghatarohu || || hohu sa~joila rokahu ghata| thatahu sakala marai ke thata || sanamukha loha
    bharata sana leu~| jiata na surasari utarana deu~ || samara maranu puni surasari tira| rama kaju chanabhangu
    sarira || bharata bhai nripu mai jana nicu| baraem bhaga asi paia micu || svami kaja karihu~ rana
    rari| jasa dhavalihu~ bhuvana dasa cari || taju~ prana raghunatha nihorem| duhu~ hatha muda modaka
    morem || sadhu samaja na jakara lekha| rama bhagata mahu~ jasu na rekha || jaya~ jiata jaga so mahi
    bharu| janani jaubana bitapa kutharu || do bigata bishada nishadapati sabahi barhaai uchahu| sumiri
    rama mageu turata tarakasa dhanusha sanahu || || begahu bhaihu sajahu sa~jou| suni rajai kadarai na
    kou || bhalehim natha saba kahahim saharasha| ekahim eka barhaavi karasha || cale nishada johari johari|
    sura sakala rana ruci rari || sumiri rama pada pankaja panahim| bhathim ba~dhi carhaainhi dhanahim
    || a~gari pahiri ku~rai sira dharahim| pharasa ba~sa sela sama karahim || eka kusala ati orana kha~rae|
    kudahi gagana manahu~ chiti cha~rae || nija nija saju samaju banai| guha rautahi johare jai || dekhi
    subhata saba layaka jane| lai lai nama sakala sanamane || do bhaihu lavahu dhokha jani aju kaja bara
    mohi| suni sarosha bole subhata bira adhira na hohi || || rama pratapa natha bala tore| karahim kataku
    binu bhata binu ghore || jivata pau na pachem dharahim| runda mundamaya medini karahim || dikha nishadanatha
    bhala tolu| kaheu bajau jujh dholu || etana kahata chinka bhi ba~e| kaheu sagunianha kheta suhae ||
    burhau eku kaha saguna bicari| bharatahi milia na hoihi rari || ramahi bharatu manavana jahim| saguna
    kahi asa bigrahu nahim || suni guha kahi nika kaha burhaa| sahasa kari pachitahim bimurhaa || bharata
    subhau silu binu bujhem| barai hita hani jani binu jujhem || do gahahu ghata bhata samiti saba leu~
    marama mili jai| bujhi mitra ari madhya gati tasa taba karihu~ ai || || lakhana sanehu subhaya~ suhae~|
    bairu priti nahim duri~ durae~ || asa kahi bhenta sa~jovana lage| kanda mula phala khaga mriga mage
    || mina pina pathina purane| bhari bhari bhara kaharanha ane || milana saju saji milana sidhae| mangala
    mula saguna subha pae || dekhi duri tem kahi nija namu| kinha munisahi danda pranamu || jani ramapriya
    dinhi asisa| bharatahi kaheu bujhai munisa || rama sakha suni sandanu tyaga| cale utari umagata anuraga
    || gau~ jati guha~ nau~ sunai| kinha joharu matha mahi lai || do karata dandavata dekhi tehi bharata
    linha ura lai| manahu~ lakhana sana bhenta bhi prema na hridaya~ samai || || bhentata bharatu tahi
    ati priti| loga sihahim prema kai riti || dhanya dhanya dhuni mangala mula| sura sarahi tehi barisahim
    phula || loka beda saba bha~tihim nica| jasu cha~ha chui leia sinca || tehi bhari anka rama laghu
    bhrata| milata pulaka paripurita gata || rama rama kahi je jamuhahim| tinhahi na papa punja samuhahim
    || yaha tau rama lai ura linha| kula sameta jagu pavana kinha || karamanasa jalu surasari pari| tehi
    ko kahahu sisa nahim dhari || ulata namu japata jagu jana| balamiki bhe brahma samana || do svapaca
    sabara khasa jamana jara pava~ra kola kirata| ramu kahata pavana parama hota bhuvana bikhyata || ||
    nahim aciraju juga juga cali ai| kehi na dinhi raghubira baraai || rama nama mahima sura kahahim|
    suni suni avadhaloga sukhu lahahim || ramasakhahi mili bharata saprema| pu~chi kusala sumangala khema
    || dekhi bharata kara sila sanehu| bha nishada tehi samaya bidehu || sakuca sanehu modu mana barhaa|
    bharatahi citavata ekataka tharhaa || dhari dhiraju pada bandi bahori| binaya saprema karata kara
    jori || kusala mula pada pankaja pekhi| maim tihu~ kala kusala nija lekhi || aba prabhu parama anugraha
    torem| sahita koti kula mangala morem || do samujhi mori karatuti kulu prabhu mahima jiya~ joi| jo
    na bhaji raghubira pada jaga bidhi bancita soi || || kapati kayara kumati kujati| loka beda bahera
    saba bha~ti || rama kinha apana jabahi tem| bhayu~ bhuvana bhushana tabahi tem || dekhi priti suni
    binaya suhai| mileu bahori bharata laghu bhai || kahi nishada nija nama subanim| sadara sakala joharim
    ranim || jani lakhana sama dehim asisa| jiahu sukhi saya lakha barisa || nirakhi nishadu nagara nara
    nari| bhe sukhi janu lakhanu nihari || kahahim laheu ehim jivana lahu| bhenteu ramabhadra bhari bahu
    || suni nishadu nija bhaga baraai| pramudita mana li caleu levai || do sanakare sevaka sakala cale
    svami rukha pai| ghara taru tara sara baga bana basa banaenhi jai || || sringaberapura bharata dikha
    jaba| bhe saneha~ saba anga sithila taba || sohata die~ nishadahi lagu| janu tanu dharem binaya anuragu
    || ehi bidhi bharata senu sabu sanga| dikhi jai jaga pavani ganga || ramaghata kaha~ kinha pranamu|
    bha manu maganu mile janu ramu || karahim pranama nagara nara nari| mudita brahmamaya bari nihari
    || kari majjanu magahim kara jori| ramacandra pada priti na thori || bharata kaheu surasari tava renu|
    sakala sukhada sevaka suradhenu || jori pani bara magu~ ehu| siya rama pada sahaja sanehu || do ehi
    bidhi majjanu bharatu kari gura anusasana pai| matu nahanim jani saba dera cale lavai || || jaha~
    taha~ loganha dera kinha| bharata sodhu sabahi kara linha || sura seva kari ayasu pai| rama matu pahim
    ge dau bhai || carana ca~pi kahi kahi mridu bani| jananim sakala bharata sanamani || bhaihi saumpi
    matu sevakai| apu nishadahi linha bolai || cale sakha kara som kara jorem| sithila sarira saneha na
    thorem || pu~chata sakhahi so thau~ dekh | neku nayana mana jarani jura || jaha~ siya ramu lakhanu
    nisi soe| kahata bhare jala locana koe || bharata bacana suni bhayu bishadu| turata taha~ li gayu
    nishadu || do jaha~ simsupa punita tara raghubara kiya bishramu| ati saneha~ sadara bharata kinheu
    danda pranamu || nihari suhai| kinha pranamu pradacchina jai || carana rekha raja a~khinha lai| bani
    na kahata priti adhikai || kanaka bindu dui carika dekhe| rakhe sisa siya sama lekhe || sajala bilocana
    hridaya~ galani| kahata sakha sana bacana subani || shrihata siya biraha~ dutihina| jatha avadha nara
    nari bilina || pita janaka deu~ patatara kehi| karatala bhogu jogu jaga jehi || sasura bhanukula bhanu
    bhualu| jehi sihata amaravatipalu || prananathu raghunatha gosai| jo bara hota so rama baraai || do
    pati devata sutiya mani siya sa~thari dekhi| biharata hradu na hahari hara pabi tem kathina biseshi
    || || lalana jogu lakhana laghu lone| bhe na bhai asa ahahim na hone || purajana priya pitu matu dulare|
    siya raghubarahi pranapiare || mridu murati sukumara subh | tata bau tana laga na k || te bana sahahim
    bipati saba bha~ti| nidare koti kulisa ehim chati || rama janami jagu kinha ujagara| rupa sila sukha
    saba guna sagara || purajana parijana gura pitu mata| rama subhau sabahi sukhadata || bairiu rama
    baraai karahim| bolani milani binaya mana harahim || sarada koti koti sata sesha| kari na sakahim
    prabhu guna gana lekha || do sukhasvarupa raghubamsamani mangala moda nidhana| te sovata kusa dasi
    mahi bidhi gati ati balavana || || rama suna dukhu kana na k | jivanataru jimi jogavi r || palaka
    nayana phani mani jehi bha~ti| jogavahim janani sakala dina rati || te aba phirata bipina padacari|
    kanda mula phala phula ahari || dhiga kaikei amangala mula| bhisi prana priyatama pratikula || maim
    dhiga dhiga agha udadhi abhagi| sabu utapatu bhayu jehi lagi || kula kalanku kari srijeu bidhata~|
    sai~doha mohi kinha kumata~ || suni saprema samujhava nishadu| natha karia kata badi bishadu || rama
    tumhahi priya tumha priya ramahi| yaha nirajosu dosu bidhi bamahi || cham bidhi bama ki karani kathina
    jemhim matu kinhi bavari| tehi rati puni puni karahim prabhu sadara sarahana ravari || tulasi na tumha
    so rama pritamu kahatu haum sauhem kie~| parinama mangala jani apane anie dhiraju hie~ || so antarajami
    ramu sakuca saprema kripayatana| calia karia bishramu yaha bicari drirha ani mana || || sakha bacana
    suni ura dhari dhira| basa cale sumirata raghubira || yaha sudhi pai nagara nara nari| cale bilokana
    arata bhari || paradakhina kari karahim pranama| dehim kaikihi khori nikama || bhari bhari bari bilocana
    lemhim| bama bidhatahi dushana dehim || eka sarahahim bharata sanehu| kau kaha nripati nibaheu nehu
    || nindahim apu sarahi nishadahi| ko kahi saki bimoha bishadahi || ehi bidhi rati logu sabu jaga|
    bha bhinusara gudara laga || gurahi sunava~ carhaai suhaim| nim nava saba matu carhaaim || danda cari
    maha~ bha sabu para| utari bharata taba sabahi sa~bhara || do pratakriya kari matu pada bandi gurahi
    siru nai| agem kie nishada gana dinheu kataku calai || || kiyu nishadanathu aguaim| matu palakim sakala
    calaim || satha bolai bhai laghu dinha| bipranha sahita gavanu gura kinha || apu surasarihi kinha
    pranamu| sumire lakhana sahita siya ramu || gavane bharata payodehim pae| kotala sanga jahim doriae
    || kahahim susevaka barahim bara| hoia natha asva asavara || ramu payodehi paya~ sidhae| hama kaha~
    ratha gaja baji banae || sira bhara jau~ ucita asa mora| saba tem sevaka dharamu kathora || dekhi
    bharata gati suni mridu bani| saba sevaka gana garahim galani || do bharata tisare pahara kaha~ kinha
    prabesu prayaga| kahata rama siya rama siya umagi umagi anuraga || || jhalaka jhalakata payanha kaimsem|
    pankaja kosa osa kana jaisem || bharata payadehim ae aju| bhayu dukhita suni sakala samaju || khabari
    linha saba loga nahae| kinha pranamu tribenihim ae || sabidhi sitasita nira nahane| die dana mahisura
    sanamane || dekhata syamala dhavala halore| pulaki sarira bharata kara jore || sakala kama prada tirathar
    | beda bidita jaga pragata prabh || magu~ bhikha tyagi nija dharamu| arata kaha na kari kukaramu ||
    asa jiya~ jani sujana sudani| saphala karahim jaga jacaka bani || do aratha na dharama na kama ruci
    gati na cahu~ nirabana| janama janama rati rama pada yaha baradanu na ana || || janahu~ ramu kutila
    kari mohi| loga kahu gura sahiba drohi || sita rama carana rati morem| anudina barhau anugraha torem
    || jaladu janama bhari surati bisaru| jacata jalu pabi pahana daru || cataku ratani ghatem ghati jai|
    barhae premu saba bha~ti bhalai || kanakahim bana carhai jimi dahem| timi priyatama pada nema nibahem
    || bharata bacana suni majha tribeni| bhi mridu bani sumangala deni || tata bharata tumha saba bidhi
    sadhu| rama carana anuraga agadhu || bada galani karahu mana mahim| tumha sama ramahi kau priya nahim
    || do tanu pulakeu hiya~ harashu suni beni bacana anukula| bharata dhanya kahi dhanya sura harashita
    barashahim phula || || pramudita tiratharaja nivasi| baikhanasa batu grihi udasi || kahahim parasapara
    mili dasa pa~ca| bharata saneha silu suci sa~ca || sunata rama guna grama suhae| bharadvaja munibara
    pahim ae || danda pranamu karata muni dekhe| muratimanta bhagya nija lekhe || dhai uthai lai ura linhe|
    dinhi asisa kritaratha kinhe || asanu dinha nai siru baithe| cahata sakuca griha~ janu bhaji paithe
    || muni pu~chaba kachu yaha bara socu| bole rishi lakhi silu sa~kocu || sunahu bharata hama saba sudhi
    pai| bidhi karataba para kichu na basai || do tumha galani jiya~ jani karahu samujhi matu karatuti|
    tata kaikihi dosu nahim gi gira mati dhuti || || yahu kahata bhala kahihi na kou| loku beda budha
    sammata dou || tata tumhara bimala jasu gai| paihi loku bedu baraai || loka beda sammata sabu kahi|
    jehi pitu dei raju so lahi || rau satyabrata tumhahi bolai| deta raju sukhu dharamu baraai || rama
    gavanu bana anaratha mula| jo suni sakala bisva bhi sula || so bhavi basa rani ayani| kari kucali
    antahu~ pachitani || taha~u~ tumhara alapa aparadhu| kahai so adhama ayana asadhu || karatehu raju
    ta tumhahi na doshu| ramahi hota sunata santoshu || do aba ati kinhehu bharata bhala tumhahi ucita
    mata ehu| sakala sumangala mula jaga raghubara carana sanehu || || so tumhara dhanu jivanu prana|
    bhuribhaga ko tumhahi samana || yaha tamhara acaraju na tata| dasaratha suana rama priya bhrata ||
    sunahu bharata raghubara mana mahim| pema patru tumha sama kau nahim || lakhana rama sitahi ati priti|
    nisi saba tumhahi sarahata biti || jana maramu nahata prayaga| magana hohim tumharem anuraga || tumha
    para asa sanehu raghubara kem| sukha jivana jaga jasa jara nara kem || yaha na adhika raghubira baraai|
    pranata kutumba pala raghurai || tumha tau bharata mora mata ehu| dharem deha janu rama sanehu ||
    do tumha kaha~ bharata kalanka yaha hama saba kaha~ upadesu| rama bhagati rasa siddhi hita bha yaha
    samu ganesu || || nava bidhu bimala tata jasu tora| raghubara kinkara kumuda cakora || udita sada
    a~thihi kabahu~ na| ghatihi na jaga nabha dina dina duna || koka tiloka priti ati karihi| prabhu pratapa
    rabi chabihi na harihi || nisi dina sukhada sada saba kahu| grasihi na kaiki karatabu rahu || purana
    rama supema piyusha| gura avamana dosha nahim dusha || rama bhagata aba amia~ aghahu~| kinhehu sulabha
    sudha basudhahu~ || bhupa bhagiratha surasari ani| sumirata sakala summagala khani || dasaratha guna
    gana barani na jahim| adhiku kaha jehi sama jaga nahim || do jasu saneha sakoca basa rama pragata
    bhe ai || je hara hiya nayanani kabahu~ nirakhe nahim aghai || || kirati bidhu tumha kinha anupa|
    jaha~ basa rama pema mrigarupa || tata galani karahu jiya~ jae~| darahu daridrahi parasu pae~ || ||
    sunahu bharata hama jhutha na kahahim| udasina tapasa bana rahahim || saba sadhana kara suphala suhava|
    lakhana rama siya darasanu pava || tehi phala kara phalu darasa tumhara| sahita payaga subhaga hamara
    || bharata dhanya tumha jasu jagu jayu| kahi asa pema magana puni bhayu || suni muni bacana sabhasada
    harashe| sadhu sarahi sumana sura barashe || dhanya dhanya dhuni gagana payaga| suni suni bharatu
    magana anuraga || do pulaka gata hiya~ ramu siya sajala saroruha naina| kari pranamu muni mandalihi
    bole gadagada baina || || muni samaju aru tiratharaju| sa~cihu~ sapatha aghai akaju || ehim thala
    jaum kichu kahia banai| ehi sama adhika na agha adhamai || tumha sarbagya kahu~ satibh | ura antarajami
    raghur || mohi na matu karataba kara socu| nahim dukhu jiya~ jagu janihi pocu || nahina daru bigarihi
    paraloku| pitahu marana kara mohi na soku || sukrita sujasa bhari bhuana suhae| lachimana rama sarisa
    suta pae || rama biraha~ taji tanu chanabhangu| bhupa soca kara kavana prasangu || rama lakhana siya
    binu paga panahim| kari muni besha phirahim bana banahi || do ajina basana phala asana mahi sayana
    dasi kusa pata| basi taru tara nita sahata hima atapa barasha bata || || ehi dukha daha~ dahi dina
    chati| bhukha na basara nida na rati || ehi kuroga kara aushadhu nahim| sodheu~ sakala bisva mana
    mahim || matu kumata barhai agha mula| tehim hamara hita kinha ba~sula || kali kukatha kara kinha
    kujantru| garai avadhi parhai kathina kumantru || mohi lagi yahu kuthatu tehim thata| ghalesi saba
    jagu barahabata || miti kujogu rama phiri ae~| basi avadha nahim ana upae~ || bharata bacana suni
    muni sukhu pai| sabahim kinha bahu bha~ti baraai || tata karahu jani socu biseshi| saba dukhu mitahi
    rama paga dekhi || do kari prabodha munibara kaheu atithi pemapriya hohu| kanda mula phala phula hama
    dehim lehu kari chohu || || suni muni bacana bharata hi~ya socu| bhayu kuavasara kathina sa~kocu ||
    jani garui gura gira bahori| carana bandi bole kara jori || sira dhari ayasu karia tumhara| parama
    dharama yahu natha hamara || bharata bacana munibara mana bhae| suci sevaka sisha nikata bolae ||
    cahie kinha bharata pahunai| kanda mula phala anahu jai || bhalehim natha kahi tinha sira nae| pramudita
    nija nija kaja sidhae || munihi soca pahuna bara nevata| tasi puja cahia jasa devata || suni ridhi
    sidhi animadika ai| ayasu hoi so karahim gosai || do rama biraha byakula bharatu sanuja sahita samaja|
    pahunai kari harahu shrama kaha mudita muniraja || || ridhi sidhi sira dhari munibara bani| barabhagini
    apuhi anumani || kahahim parasapara sidhi samudai| atulita atithi rama laghu bhai || muni pada bandi
    karia soi aju| hoi sukhi saba raja samaju || asa kahi raceu rucira griha nana| jehi biloki bilakhahim
    bimana || bhoga bibhuti bhuri bhari rakhe| dekhata jinhahi amara abhilashe || dasim dasa saju saba
    linhem| jogavata rahahim manahi manu dinhem || saba samaju saji sidhi pala mahim| je sukha surapura
    sapanehu~ nahim || prathamahim basa die saba kehi| sundara sukhada jatha ruci jehi || do bahuri saparijana
    bharata kahu~ rishi asa ayasu dinha| bidhi bisamaya dayaku bibhava munibara tapabala kinha || || muni
    prabhau jaba bharata biloka| saba laghu lage lokapati loka || sukha samaju nahim jai bakhani| dekhata
    birati bisarahim gyani || asana sayana subasana bitana| bana batika bihaga mriga nana || surabhi phula
    phala amia samana| bimala jalasaya bibidha bidhana| asana pana suca amia ami se| dekhi loga sakucata
    jami se || sura surabhi surataru sabahi kem| lakhi abhilashu suresa saci kem || ritu basanta baha
    tribidha bayari| saba kaha~ sulabha padaratha cari || straka candana banitadika bhoga| dekhi harasha
    bisamaya basa loga || do sampata caki bharatu caka muni ayasa khelavara || tehi nisi ashrama pinjara~
    rakhe bha bhinusara || unnisava~ vishrama kinha nimajjanu tiratharaja| nai munihi siru sahita samaja
    || rishi ayasu asisa sira rakhi| kari dandavata binaya bahu bhashi || patha gati kusala satha saba
    linhe| cale citrakutahim citu dinhem || ramasakha kara dinhem lagu| calata deha dhari janu anuragu
    || nahim pada trana sisa nahim chaya| pemu nemu bratu dharamu amaya || lakhana rama siya pantha kahani|
    pu~chata sakhahi kahata mridu bani || rama basa thala bitapa bilokem| ura anuraga rahata nahim rokaim
    || daikhi dasa sura barisahim phula| bhi mridu mahi magu mangala mula || do kie~ jahim chaya jalada
    sukhada bahi bara bata| tasa magu bhayu na rama kaha~ jasa bha bharatahi jata || || jara cetana maga
    jiva ghanere| je cite prabhu jinha prabhu here || te saba bhe parama pada jogu| bharata darasa meta
    bhava rogu || yaha barai bata bharata ki nahim| sumirata jinahi ramu mana mahim || baraka rama kahata
    jaga jeu| hota tarana tarana nara teu || bharatu rama priya puni laghu bhrata| kasa na hoi magu mangaladata
    || siddha sadhu munibara asa kahahim| bharatahi nirakhi harashu hiya~ lahahim || dekhi prabhau suresahi
    socu| jagu bhala bhalehi poca kahu~ pocu || gura sana kaheu karia prabhu soi| ramahi bharatahi bhenta
    na hoi || do ramu sa~koci prema basa bharata sapema payodhi| bani bata begarana cahati karia jatanu
    chalu sodhi || || bacana sunata suraguru musakane| sahasranayana binu locana jane || mayapati sevaka
    sana maya| kari ta ulati pari suraraya || taba kichu kinha rama rukha jani| aba kucali kari hoihi
    hani || sunu suresa raghunatha subh | nija aparadha risahim na k || jo aparadhu bhagata kara kari|
    rama rosha pavaka so jari || lokahu~ beda bidita itihasa| yaha mahima janahim durabasa || bharata
    sarisa ko rama sanehi| jagu japa rama ramu japa jehi || do manahu~ na ania amarapati raghubara bhagata
    akaju| ajasu loka paraloka dukha dina dina soka samaju || || sunu suresa upadesu hamara| ramahi sevaku
    parama piara || manata sukhu sevaka sevakai| sevaka baira bairu adhikai || jadyapi sama nahim raga
    na roshu| gahahim na papa punu guna doshu || karama pradhana bisva kari rakha| jo jasa kari so tasa
    phalu cakha || tadapi karahim sama bishama bihara| bhagata abhagata hridaya anusara || aguna alepa
    amana ekarasa| ramu saguna bhe bhagata pema basa || rama sada sevaka ruci rakhi| beda purana sadhu
    sura sakhi || asa jiya~ jani tajahu kutilai| karahu bharata pada priti suhai || do rama bhagata parahita
    nirata para dukha dukhi dayala| bhagata siromani bharata tem jani darapahu surapala || || satyasandha
    prabhu sura hitakari| bharata rama ayasa anusari || svaratha bibasa bikala tumha hohu| bharata dosu
    nahim raura mohu || suni surabara suragura bara bani| bha pramodu mana miti galani || barashi prasuna
    harashi surar | lage sarahana bharata subh || ehi bidhi bharata cale maga jahim| dasa dekhi muni siddha
    sihahim || jabahim ramu kahi lehim usasa| umagata pemu manaha~ cahu pasa || dravahim bacana suni kulisa
    pashana| purajana pemu na jai bakhana || bica basa kari jamunahim ae| nirakhi niru locana jala chae
    || do raghubara barana biloki bara bari sameta samaja| hota magana baridhi biraha carhae bibeka jahaja
    || || jamuna tira tehi dina kari basu| bhayu samaya sama sabahi supasu || ratahim ghata ghata ki tarani|
    aim aganita jahim na barani || prata para bhe ekahi khemva~| toshe ramasakha ki seva~ || cale nahai
    nadihi sira nai| satha nishadanatha dau bhai || agem munibara bahana achem| rajasamaja jai sabu pachem
    || tehim pachem dau bandhu payadem| bhushana basana besha suthi sadem || sevaka suhrada sacivasuta
    satha| sumirata lakhanu siya raghunatha || jaha~ jaha~ rama basa bishrama| taha~ taha~ karahim saprema
    pranama || do magabasi nara nari suni dhama kama taji dhai| dekhi sarupa saneha saba mudita janama
    phalu pai || || kahahim sapema eka eka pahim| ramu lakhanu sakhi hohim ki nahim || baya bapu barana
    rupa soi ali| silu sanehu sarisa sama cali || beshu na so sakhi siya na sanga| agem ani cali caturanga
    || nahim prasanna mukha manasa kheda| sakhi sandehu hoi ehim bheda || tasu taraka tiyagana mana mani|
    kahahim sakala tehi sama na sayani || tehi sarahi bani phuri puji| boli madhura bacana tiya duji ||
    kahi sapema saba kathaprasangu| jehi bidhi rama raja rasa bhangu || bharatahi bahuri sarahana lagi|
    sila saneha subhaya subhagi || do calata payadem khata phala pita dinha taji raju| jata manavana raghubarahi
    bharata sarisa ko aju || || bhayapa bhagati bharata acaranu| kahata sunata dukha dushana haranu ||
    jo kachu kahaba thora sakhi soi| rama bandhu asa kahe na hoi || hama saba sanuja bharatahi dekhem|
    bhinha dhanya jubati jana lekhem || suni guna dekhi dasa pachitahim| kaiki janani jogu sutu nahim
    || kau kaha dushanu ranihi nahina| bidhi sabu kinha hamahi jo dahina || kaha~ hama loka beda bidhi
    hini| laghu tiya kula karatuti malini || basahim kudesa kuga~va kubama| kaha~ yaha darasu punya parinama
    || asa anandu aciriju prati grama| janu marubhumi kalapataru jama || do bharata darasu dekhata khuleu
    maga loganha kara bhagu| janu singhalabasinha bhayu bidhi basa sulabha prayagu || || nija guna sahita
    rama guna gatha| sunata jahim sumirata raghunatha || tiratha muni ashrama suradhama| nirakhi nimajjahim
    karahim pranama || manahim mana magahim baru ehu| siya rama pada paduma sanehu || milahim kirata kola
    banabasi| baikhanasa batu jati udasi || kari pranamu pu~chahim jehim tehi| kehi bana lakhanu ramu
    baidehi || te prabhu samacara saba kahahim| bharatahi dekhi janama phalu lahahim || je jana kahahim
    kusala hama dekhe| te priya rama lakhana sama lekhe || ehi bidhi bujhata sabahi subani| sunata rama
    banabasa kahani || do tehi basara basi pratahim cale sumiri raghunatha| rama darasa ki lalasa bharata
    sarisa saba satha || || mangala saguna hohim saba kahu| pharakahim sukhada bilocana bahu || bharatahi
    sahita samaja uchahu| milihahim ramu mitahi dukha dahu || karata manoratha jasa jiya~ jake| jahim
    saneha sura~ saba chake || sithila anga paga maga dagi dolahim| bihabala bacana pema basa bolahim
    || ramasakha~ tehi samaya dekhava| saila siromani sahaja suhava || jasu samipa sarita paya tira| siya
    sameta basahim dau bira || dekhi karahim saba danda pranama| kahi jaya janaki jivana rama || prema
    magana asa raja samaju| janu phiri avadha cale raghuraju || do bharata premu tehi samaya jasa tasa
    kahi saki na seshu| kabihim agama jimi brahmasukhu aha mama malina janeshu || | sakala saneha sithila
    raghubara kem| ge kosa dui dinakara dharakem || jalu thalu dekhi base nisi bitem| kinha gavana raghunatha
    piritem || uha~ ramu rajani avasesha| jage siya~ sapana asa dekha || sahita samaja bharata janu ae|
    natha biyoga tapa tana tae || sakala malina mana dina dukhari| dekhim sasu ana anuhari || suni siya
    sapana bhare jala locana| bhe socabasa soca bimocana || lakhana sapana yaha nika na hoi| kathina kucaha
    sunaihi koi || asa kahi bandhu sameta nahane| puji purari sadhu sanamane || cham sanamani sura muni
    bandi baithe uttara disi dekhata bhe| nabha dhuri khaga mriga bhuri bhage bikala prabhu ashrama ge
    || tulasi uthe avaloki karanu kaha cita sacakita rahe| saba samacara kirata kolanhi ai tehi avasara
    kahe || do sunata sumangala baina mana pramoda tana pulaka bhara| sarada saroruha naina tulasi bhare
    saneha jala || || bahuri socabasa bhe siyaravanu| karana kavana bharata agavanu || eka ai asa kaha
    bahori| sena sanga caturanga na thori || so suni ramahi bha ati socu| ita pitu baca ita bandhu sakocu
    || bharata subhau samujhi mana mahim| prabhu cita hita thiti pavata nahi || samadhana taba bha yaha
    jane| bharatu kahe mahu~ sadhu sayane || lakhana lakheu prabhu hridaya~ khabharu| kahata samaya sama
    niti bicaru || binu pu~cha kachu kahu~ gosaim| sevaku samaya~ na dhitha dhithai || tumha sarbagya
