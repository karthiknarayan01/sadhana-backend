id: dadhicikritamshivastotram
category: stotram
name:
  english: dadhicikritamshivastotram
  devanagari: दधीचिकृतंशिवस्तोत्रं
content:
  english: 51|| gangacandrakaladhara trijagatam kamannapurnardhadhrik turnam me hridi cintitam disha vibho
    pahisha mamarbhakam | urnacakranikashasamsritimahacakre'tha baddhangakam tvamevabhimukham prayami
    sharanam mamadya samba prabho || 23
  devanagari: ५१॥ गङ्गाचन्द्रकलाधर त्रिजगतां कामान्नपूर्णार्धधृक् तूर्णं मे हृदि चिन्तितं दिश विभो पाहीश
    मामर्भकम् । ऊर्णाचक्रनिकाशसंसृतिमहाचक्रेऽथ बद्धाङ्गकं त्वामेवाभिमुखं प्रयामि शरणं मामद्य साम्ब प्रभो
    ॥ २३
meaning: {}
