    sameta nahai nripa boli bipra gura gyati| bhojana kinha aneka bidhi ghari panca gi rati || || mangalagana
    karahim bara bhamini| bhai sukhamula manohara jamini || a~ci pana saba kahu~ pae| straga sugandha
    bhushita chabi chae || ramahi dekhi rajayasu pai| nija nija bhavana cale sira nai || prema pramoda
    binodu barhaai| samu samaju manoharatai || kahi na sakahi sata sarada sesu| beda biranci mahesa ganesu
    || so mai kahaum kavana bidhi barani| bhuminagu sira dhari ki dharani || nripa saba bha~ti sabahi
    sanamani| kahi mridu bacana bolai rani || badhu larikanim para ghara aim| rakhehu nayana palaka ki
    nai || do larika shramita unida basa sayana karavahu jai| asa kahi ge bishramagriha~ rama carana citu
    lai || || bhupa bacana suni sahaja suhae| jarita kanaka mani pala~ga dasae || subhaga surabhi paya
    phena samana| komala kalita supetim nana || upabarahana bara barani na jahim| straga sugandha manimandira
    mahim || ratanadipa suthi caru ca~dova| kahata na bani jana jehim jova || seja rucira raci ramu uthae|
    prema sameta pala~ga paurhaae || agya puni puni bhainha dinhi| nija nija seja sayana tinha kinhi ||
    dekhi syama mridu manjula gata| kahahim saprema bacana saba mata || maraga jata bhayavani bhari| kehi
    bidhi tata taraka mari || do ghora nisacara bikata bhata samara ganahim nahim kahu || mare sahita
    sahaya kimi khala marica subahu || || muni prasada bali tata tumhari| isa aneka karavarem tari ||
    makha rakhavari kari duhu~ bhai| guru prasada saba bidya pai || munitaya tari lagata paga dhuri| kirati
    rahi bhuvana bhari puri || kamatha pithi pabi kuta kathora| nripa samaja mahu~ siva dhanu tora ||
    bisva bijaya jasu janaki pai| ae bhavana byahi saba bhai || sakala amanusha karama tumhare| kevala
    kausika kripa~ sudhare || aju suphala jaga janamu hamara| dekhi tata bidhubadana tumhara || je dina
