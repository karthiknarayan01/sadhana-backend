id: indrastotram
category: stotram
name:
  english: indrastotram
  devanagari: इन्द्रस्तोत्रम्
content:
  english: indrastotram vajrasya bharta bhuvanasya gopta vritrasya hanta namucernihanta | krishne vasano
    vasane mahatma satyanrite yo vivinakti loke || 152|| yo vajinam garbhamapam puranam vaishvanaram vahanamabhyupetah
    | namah sadasmai jagadishvaraya lokatrayeshaya purandaraya || 153|| iti mahabharate adiparvani 3 adhyayantargatam
    indrastotram sampurnam | mahabharata | adiparva | adhyaya 3
  devanagari: इन्द्रस्तोत्रम् वज्रस्य भर्ता भुवनस्य गोप्ता वृत्रस्य हन्ता नमुचेर्निहन्ता । कृष्णे वसानो
    वसने महात्मा सत्यानृते यो विविनक्ति लोके ॥ १५२॥ यो वाजिनं गर्भमपां पुराणं वैश्वानरं वाहनमभ्युपेतः
    । नमः सदास्मै जगदीश्वराय लोकत्रयेशाय पुरन्दराय ॥ १५३॥ इति महाभारते आदिपर्वणि ३ अध्यायान्तर्गतं इन्द्रस्तोत्रं
    सम्पूर्णम् । महाभारत । आदिपर्व । अध्याय ३
meaning: {}
