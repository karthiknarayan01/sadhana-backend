id: dvadasha-aditya-dhyana-slokas
category: stotram
name:
  english: Dvadasha Aditya Dhyana Slokas
content:
  english: dhata dhata kritasthali hetirvasuki rathakrinmune | pulastyastumbururiti madhumasam nayantyami
    || dhata shubhasya me data bhuyo bhuyo'pi bhuyasah | rashmijalasamashlishtah tamastomavinashanah ||
    aryam aryama pulaho'thaujah praheti punjikasthali | naradah kacchanirashca nayantyete sma madhavam
    || merushringantaracarah kamalakarabandhavah | aryama tu sada bhutyai bhuyasyai pranatasya me || mitrah
    mitro'trih paurusheyo'tha takshako menaka hahah | rathasvana iti hyete shukramasam nayantyami || nishanivaranapatuh
    udayadrikritashrayah | mitro'stu mama modaya tamastomavinashanah || varunah vasishtho hyaruno rambha
    sahajanyastatha huhuh | shukrashcitrasvanashcaiva shucimasam nayantyami || suryasyandanamarudha arcirmali
    pratapavan | kalabhutah kamarupo hyarunah sevyate maya || indrah indro vishvavasuh shrota elapatrastatha'ngirah
    | pramloca rakshasovaryo nabhomasam nayantyami || sahasrarashmisamvitam indram varadamashraye | shirasa
    pranamamyadya shreyo vriddhipradayakam || vivasvan vivasvanugrasenashca vyaghra asarano bhriguh |
    anumlocah shankhapalo nabhasyakhyam nayantyami || jagannirmanakartaram sarvadigvyaptatejasam | nabhograhamahadipam
    vivasvantam namamyaham || tvashta tvashta ricikatanayah kambalakhyastilottama | brahmapeto'tha shatajit
    dhritarashtra ishambhara || tvashta shubhaya me bhuyat shishtavalinishevitah | nanashilpakaro nanadhaturupah
    prabhakarah | vishnuh vishnurashvataro rambha suryavarcashca satyajit | vishvamitro makhapeta urjamasam
    nayantyami || bhanumandalamadhyastham vedatrayanishevitam | gayatripratipadyam tam vishnum bhaktya
    namamyaham || amshuman athamshuh kashyapastarkshya ritasenastathorvashi | vidyucchatrurmahashankhah
    sahomasam nayantyami || sada vidravanarato jaganmangaladipakah | munindranivahastutyo bhutido'mshurbhavenmama
    || bhagah bhagah sphurjo'rishtanemih urna ayushca pancamah | karkotakah purvacittih paushamasam nayantyami
    || tithi masa ritunam ca vatsara'yanayorapi | ghatikanam ca yah karta bhago bhagyaprado'stu me ||
    pusha pusha dhananjayo vatah sushenah surucistatha | ghritaci gautamashceti tapomasam nayantyami |
    pusha toshaya me bhuyat sarvapapa'panodanat | sahasrakarasamvitah samastashantarantarah || parjanyah
    kraturvarca bharadvajah parjanyah senajit tatha | vishvashcairavatashcaiva tapasyakhyam nayantyami
    || prapancam pratapan bhuyo vrishtibhirmadayan punah | jagadanandajanakah parjanyah pujyate maya ||
    dhyayessada savitrimandalamadhyavarti narayanassarasijasana sannivishtah| keyuravan makarakundalavan
    kiriti hari hiranmayavapuh dhritashankhacakrah ||
  devanagari: धाता धाता कृतस्थली हेतिर्वासुकी रथकृन्मुने । पुलस्त्यस्तुम्बुरुरिति मधुमासं नयन्त्यमी ॥
    धाता शुभस्य मे दाता भूयो भूयोऽपि भूयसः । रश्मिजालसमाश्लिष्टः तमस्तोमविनाशनः ॥ अर्यम् अर्यमा पुलहोऽथौजाः
    प्रहेति पुञ्जिकस्थली । नारदः कच्छनीरश्च नयन्त्येते स्म माधवम् ॥ मेरुशृङ्गान्तरचरः कमलाकरबान्धवः ।
    अर्यमा तु सदा भूत्यै भूयस्यै प्रणतस्य मे ॥ मित्रः मित्रोऽत्रिः पौरुषेयोऽथ तक्षको मेनका हहः । रथस्वन
    इति ह्येते शुक्रमासं नयन्त्यमी ॥ निशानिवारणपटुः उदयाद्रिकृताश्रयः । मित्रोऽस्तु मम मोदाय तमस्तोमविनाशनः
    ॥ वरुणः वसिष्ठो ह्यरुणो रम्भा सहजन्यस्तथा हुहुः । शुक्रश्चित्रस्वनश्चैव शुचिमासं नयन्त्यमी ॥ सूर्यस्यन्दनमारूढ
    अर्चिर्माली प्रतापवान् । कालभूतः कामरूपो ह्यरुणः सेव्यते मया ॥ इन्द्रः इन्द्रो विश्वावसुः श्रोता एलापत्रस्तथाऽङ्गिराः
    । प्रम्लोचा राक्षसोवर्यो नभोमासं नयन्त्यमी ॥ सहस्ररश्मिसंवीतं इन्द्रं वरदमाश्रये । शिरसा प्रणमाम्यद्य
    श्रेयो वृद्धिप्रदायकम् ॥ विवस्वान् विवस्वानुग्रसेनश्च व्याघ्र आसारणो भृगुः । अनुम्लोचाः शङ्खपालो नभस्याख्यं
    नयन्त्यमी ॥ जगन्निर्माणकर्तारं सर्वदिग्व्याप्ततेजसम् । नभोग्रहमहादीपं विवस्वन्तं नमाम्यहम् ॥ त्वष्टा
    त्वष्टा ऋचीकतनयः कम्बलाख्यस्तिलोत्तमा । ब्रह्मापेतोऽथ शतजित् धृतराष्ट्र इषम्भरा ॥ त्वष्टा शुभाय मे
    भूयात् शिष्टावलिनिषेवितः । नानाशिल्पकरो नानाधातुरूपः प्रभाकरः । विष्णुः विष्णुरश्वतरो रम्भा सूर्यवर्चाश्च
    सत्यजित् । विश्वामित्रो मखापेत ऊर्जमासं नयन्त्यमी ॥ भानुमण्डलमध्यस्थं वेदत्रयनिषेवितम् । गायत्रीप्रतिपाद्यं
    तं विष्णुं भक्त्या नमाम्यहम् ॥ अंशुमान् अथांशुः कश्यपस्तार्क्ष्य ऋतसेनस्तथोर्वशी । विद्युच्छत्रुर्महाशङ्खः
    सहोमासं नयन्त्यमी ॥ सदा विद्रावणरतो जगन्मङ्गलदीपकः । मुनीन्द्रनिवहस्तुत्यो भूतिदोऽंशुर्भवेन्मम ॥ भगः
    भगः स्फूर्जोऽरिष्टनेमिः ऊर्ण आयुश्च पञ्चमः । कर्कोटकः पूर्वचित्तिः पौषमासं नयन्त्यमी ॥ तिथि मास ऋतूनां
    च वत्सराऽयनयोरपि । घटिकानां च यः कर्ता भगो भाग्यप्रदोऽस्तु मे ॥ पूष पूषा धनञ्जयो वातः सुषेणः सुरुचिस्तथा
    । घृताची गौतमश्चेति तपोमासं नयन्त्यमी । पूषा तोषाय मे भूयात् सर्वपापाऽपनोदनात् । सहस्रकरसंवीतः समस्ताशान्तरान्तरः
    ॥ पर्जन्यः क्रतुर्वार्चा भरद्वाजः पर्जन्यः सेनजित् तथा । विश्वश्चैरावतश्चैव तपस्याख्यं नयन्त्यमी ॥
    प्रपञ्चं प्रतपन् भूयो वृष्टिभिर्मादयन् पुनः । जगदानन्दजनकः पर्जन्यः पूज्यते मया ॥ ध्यायेस्सदा सवितृमण्डलमध्यवर्ती
    नारायणस्सरसिजासन सन्निविष्टः। केयूरवान् मकरकुण्डलवान् किरीटी हारी हिरण्मयवपुः धृतशङ्खचक्रः ॥
