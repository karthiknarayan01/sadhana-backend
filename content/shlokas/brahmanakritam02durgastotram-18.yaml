id: brahmanakritam02durgastotram-18
category: stotram
name:
  english: brahmanakritam02durgastotram 18
  devanagari: ब्रह्मणाकृतं०२दुर्गास्तोत्रम् १८
content:
  english: brahmana kritam 2 durgastotram 18 brahmovaca | raksha raksha mahamaye sharanagatavatsale |
    etabhyam ghorarupabhyam daityabhyam jagadambike || 57|| pranamami mahamayam yoganidramumam satim |
    kalaratrim maharatrim moharatrim paratparam 58|| tridevajananim nityam bhaktabhishtaphalapradam |
    palinim sarvadevanam karunavarunalayam || 59|| tvatprabhavadaham brahma madhavo girijapatih | srijatyavati
    samsaram kale samharatiti ca || 60|| tvam svaha tvam svadha tvam hristvam buddhirvimala mata | tushtih
    pushtistvamevamba shantih kshantih kshudha daya || 61|| vishnumaya tvamevamba tvameva cetana mata
    | tvam shaktih parama prokta lajja trishna tvameva ca || 62|| bhrantistvam smritirupa tvam matrirupena
    samsthita | tvam lakshmirbhavane pumsam punyaksharapravartinam || 63|| tvam jatistvam mata vrittirvyaptirupa
    tvameva hi | tvameva cittirupena vyapya kritsnam pratishthita || 64|| sa tvametau duradharshavasurau
    mohayambike | prabodhaya jagadyone narayanamajam vibhum || 65|| iti shivapurane umasamhitayam pancacatvarimshadhyayantargatam
    brahmana kritam durgastotram samaptam | shivapurana | umasamhita | adhyaya 45
  devanagari: ब्रह्मणा कृतं २ दुर्गास्तोत्रम् १८ ब्रह्मोवाच । रक्ष रक्ष महामाये शरणागतवत्सले । एताभ्यां
    घोररूपाभ्यां दैत्याभ्यां जगदम्बिके ॥ ५७॥ प्रणमामि महामायां योगनिद्रामुमां सतीम् । कालरात्रिं महारात्रिं
    मोहरात्रिं परात्परां ५८॥ त्रिदेवजननीं नित्यां भक्ताभीष्टफलप्रदाम् । पालिनीं सर्वदेवानां करुणावरुणालयाम्
    ॥ ५९॥ त्वत्प्रभावादहं ब्रह्मा माधवो गिरिजापतिः । सृजत्यवति संसारं काले संहरतीति च ॥ ६०॥ त्वं स्वाहा
    त्वं स्वधा त्वं ह्रीस्त्वं बुद्धिर्विमला मता । तुष्टिः पुष्टिस्त्वमेवाम्ब शान्तिः क्षान्तिः क्षुधा
    दया ॥ ६१॥ विष्णुमाया त्वमेवाम्ब त्वमेव चेतना मता । त्वं शक्तिः परमा प्रोक्ता लज्जा तृष्णा त्वमेव च
    ॥ ६२॥ भ्रान्तिस्त्वं स्मृतिरूपा त्वं मातृरूपेण संस्थिता । त्वं लक्ष्मीर्भवने पुंसां पुण्याक्षरप्रवर्तिनाम्
    ॥ ६३॥ त्वं जातिस्त्वं मता वृत्तिर्व्याप्तिरूपा त्वमेव हि । त्वमेव चित्तिरूपेण व्याप्य कृत्स्नं प्रतिष्ठिता
    ॥ ६४॥ सा त्वमेतौ दुराधर्षावसुरौ मोहयाम्बिके । प्रबोधय जगद्योने नारायणमजं विभुम् ॥ ६५॥ इति शिवपुराणे
    उमासंहितायां पञ्चचत्वारिंशाध्यायान्तर्गतं ब्रह्मणा कृतं दुर्गास्तोत्रं समाप्तम् । शिवपुराण । उमासंहिता
    । अध्याय ४५
