id: gayatrimantrah
category: mantra
name:
  english: gayatrimantrah
  devanagari: गायत्रीमन्त्राः
content:
  english: hah pracodayat || om nrisimhaya vidmahe vajranakhaya dhimahi tannah simhah pracodayat || parashurama
    om jamadagnyaya vidmahe mahaviraya dhimahi tannah parashuramah pracodayat || indra om sahasranetraya
    vidmahe vajrahastaya dhimahi tanna indrah pracodayat || hanumana om amjaneyaya vidmahe mahabalaya
    dhimahi tanno hanuman pracodayat ||| om amjaneyaya vidmahe vayuputraya dhimahi tanno hanuman pracodayat
    || maruti om marutputraya vidmahe amjaneyaya dhimahi tanno marutih pracodayat || durga om katyayanaya
    vidmahe kanyakumari ca dhimahi tanno durga pracodayat || om mahashulinyai vidmahe mahadurgayai dhimahi
    tanno bhagavati pracodayat || om girijayai ca vidmahe shivapriyayai ca dhimahi tanno durga pracodayat
    || shakti om sarvasammohinyai vidmahe vishvajananyai ca dhimahi tannah shaktih pracodayat || kali
    om kalikayai ca vidmahe shmashanavasinyai ca dhimahi tanna aghora pracodayat || om adyayai ca vidmahe
    parameshvaryai ca dhimahi tannah kalih pracodayat || devi om mahashulinyai ca vidmahe mahadurgayai
    dhimahi tanno bhagavati pracodayat || om vagdevyai ca vidmahe kamarajnai ca dhimahi tanno devi pracodayat
    || gauri om subhagayai ca vidmahe kamamalinyai ca dhimahi tanno gauri pracodayat || lakshmi om mahalakshmi
    ca vidmahe vishnupatnishca dhimahi tanno lakshmih pracodayat || om mahadevyai ca vidmahe vishnupatnyai
    ca dhimahi tanno lakshmih pracodayat || sarasvati om vagdevyai ca vidmahe virimcipatnyai ca dhimahi
    tanno vani pracodayat || sita om janakanandinyai vidmahe bhumijayai ca dhimahi tannah sita pracodayat
    || radha om vrishabhanujayai vidmahe krishnapriyayai dhimahi tanno radha pracodayat || annapurna om
    bhagavatyai ca vidmahe maheshvaryai ca dhimahi tanna annapurna pracodayat || tulasi om tulasidevyai
    ca vidmahe vishnupriyayai ca dhimahi tanno vrindah pracodayat || mahadeva om tatpurushaya vidmahe
    mahadevaya dhimahi tanno rudrah pracodayat || rudra om purushasya vidmahe sahasrakshasya dhimahi tanno
    rudrah pracodayat || om tatpurushaya vidmahe mahadevaya dhimahi tanno rudrah pracodayat || shamkara
    om sadashivaya vidmahe sahasrakshyaya dhimahi tannah sambah pracodayat || nandikeshvara om tatpurushaya
    vidmahe nandikeshvaraya dhimahi tanno vrishabhah pracodayat || ganesha om tatkarataya vidmahe hastimukhaya
    dhimahi tanno danti pracodayat || om tatpurushaya vidmahe vakratundaya dhimahi tanno dantih pracodayat
    || om tatpurushaya vidmahe hastimukhaya dhimahi tanno danti pracodayat || om ekadantaya vidmahe vakratundaya
    dhimahi tanno dantih pracodayat || om lambodaraya vidmahe mahodaraya dhimahi tanno dantih pracodayat
    || om mahotkataya vidmahe vakratundaya dhimahi | tanno dantih pracodayat || shanmukha om shanmukhaya
    vidmahe mahasenaya dhimahi tannah skandah pracodayat|| om shanmukhaya vidmahe mahasenaya dhimahi tannah
    shashthah pracodayat || subrahmanya om tatpurushaya vidmahe mahasenaya dhimahi tannah shanmukhah pracodayat
    || om om omkaraya vidmahe damarujatasya dhimahi tannah pranavah pracodayat || ajapa om hamsa hamsaya
    vidmahe so'ham hamsaya dhimahi tanno hamsah pracodayat || dakshinamurti om dakshinamurtaye vidmahe
    dhyanasthaya dhimahi tanno dhishah pracodayat || guru om gurudevaya vidmahe parabrahmane dhimahi tanno
    guruh pracodayat || hayagriva om vagishvaraya vidmahe hayagrivaya dhimahi tanno hamsah pracodayat
    || agni om saptajihvaya vidmahe agnidevaya dhimahi tanna agnih pracodayat || om vaishvanaraya vidmahe
    lalilaya dhimahi tanna agnih pracodayat || om mahajvalaya vidmahe agnidevaya dhimahi tanno agnih pracodayat
    || yama om suryaputraya vidmahe mahakalaya dhimahi tanno yamah pracodayat || varuna om jalabimbaya
    vidmahe nilapurushaya dhimahi tanno varunah pracodayat || vaishvanara om pavakaya vidmahe saptajihvaya
    dhimahi tanno vaishvanarah pracodayat || manmatha om kamadevaya vidmahe pushpavanaya dhimahi tannah
    kamah pracodayat || hamsa om hamsa hamsaya vidmahe paramahamsaya dhimahi tanno hamsah pracodayat ||
    om paramahamsaya vidmahe mahattattvaya dhimahi tanno hamsah pracodayat || nandi om tatpurushaya vidmahe
    cakratundaya dhimahi tanno nandih pracodayat || garuda om tatpurushaya vidmahe suvarnapakshaya dhimahi
    tanno garudah pracodayat || sarpa om navakulaya vidmahe vishadantaya dhimahi tannah sarpah pracodayat
    || pamcajanya om pamcajanyaya vidmahe pavamanaya dhimahi tannah shamkhah pracodayat || sudarshana
    om sudarshanaya vidmahe mahajvalaya dhimahi tannashcakrah pracodayat || agni om rudranetraya vidmahe
    shaktihastaya dhimahi tanno vahnih pracodayat || om vaishvanaraya vidmahe lalalilaya dhimahi tanno'gnih
    pracodayat || om mahajvalaya vidmahe agnimathanaya dhimahi tanno'gnih pracodayat || akasha om akashaya
    ca vidmahe nabhodevaya dhimahi tanno gaganam pracodayat || annapurna om bhagavatyai ca vidmahe maheshvaryai
    ca dhimahi tanno'nnapurna pracodayat || bagalamukhi om bagalamukhyai ca vidmahe stambhinyai ca dhimahi
    tanno devi pracodayat || om aim bagalamukhi vidmahe om klim kanteshvari dhimahi | om sauh tannah prahlim
    pracodayat || batukabhairava om tatpurushaya vidmahe apaduddharanaya dhimahi tanno batukah pracodayat
    || bhairavi om tripurayai ca vidmahe bhairavyai ca dhimahi tanno devi pracodayat || bhuvaneshvari
    om narayanyai ca vidmahe bhuvaneshvaryai dhimahi tanno devi pracodayat || brahma om padmodbhavaya
    vidmahe devavaktraya dhimahi tannah srashta pracodayat || om vedatmane ca vidmahe hiranyagarbhaya
    dhimahi tanno brahma pracodayat || om parameshvaraya vidmahe paratattvaya dhimahi tanno brahma pracodayat
    || candra om kshiraputraya vidmahe amritatattvaya dhimahi tannashcandrah pracodayat || chinnamasta
    om vairocanyai ca vidmahe chinnamastayai dhimahi tanno devi pracodayat || dakshinamurti om dakshinamurtaye
    vidmahe dhyanasthaya dhimahi tanno dhishah pracodayat || devi om devyaibrahmanyai vidmahe mahashaktyai
    ca dhimahi tanno devi pracodayat || dhumavati om dhumavatyai ca vidmahe samharinyai ca dhimahi tanno
    dhuma pracodayat || durga om katyayanyai vidmahe kanyakumaryai dhimahi tanno durga pracodayat || om
    mahadevyai ca vidmahe durgayai ca dhimahi tanno devi pracodayat || ganesha om tatpurushaya vidmahe
    vakratundaya dhimahi tanno danti pracodayat || om ekadantaya vidmahe vakratundaya dhimahi tanno danti
    pracodayat || garuda om vainateyaya vidmahe suvarnapakshaya dhimahi tanno garudah pracodayat || om
    tatpurushaya vidmahe suvarnaparnaya
  devanagari: हः प्रचोदयात् ॥ ॐ नृसिंहाय विद्महे वज्रनखाय धीमहि तन्नः सिंहः प्रचोदयात् ॥ परशुराम ॐ जामदग्न्याय
    विद्महे महावीराय धीमहि तन्नः परशुरामः प्रचोदयात् ॥ इन्द्र ॐ सहस्रनेत्राय विद्महे वज्रहस्ताय धीमहि
    तन्न इन्द्रः प्रचोदयात् ॥ हनुमान ॐ आंजनेयाय विद्महे महाबलाय धीमहि तन्नो हनूमान् प्रचोदयात् ॥। ॐ आंजनेयाय
    विद्महे वायुपुत्राय धीमहि तन्नो हनूमान् प्रचोदयात् ॥ मारुती ॐ मरुत्पुत्राय विद्महे आंजनेयाय धीमहि
    तन्नो मारुतिः प्रचोदयात् ॥ दुर्गा ॐ कात्यायनाय विद्महे कन्यकुमारी च धीमहि तन्नो दुर्गा प्रचोदयात्
    ॥ ॐ महाशूलिन्यै विद्महे महादुर्गायै धीमहि तन्नो भगवती प्रचोदयात् ॥ ॐ गिरिजायै च विद्महे शिवप्रियायै
    च धीमहि तन्नो दुर्गा प्रचोदयात् ॥ शक्ति ॐ सर्वसंमोहिन्यै विद्महे विश्वजनन्यै च धीमहि तन्नः शक्तिः
    प्रचोदयात् ॥ काली ॐ कालिकायै च विद्महे श्मशानवासिन्यै च धीमहि तन्न अघोरा प्रचोदयात् ॥ ॐ आद्यायै च
    विद्महे परमेश्वर्यै च धीमहि तन्नः कालीः प्रचोदयात् ॥ देवी ॐ महाशूलिन्यै च विद्महे महादुर्गायै धीमहि
    तन्नो भगवती प्रचोदयात् ॥ ॐ वाग्देव्यै च विद्महे कामराज्ञै च धीमहि तन्नो देवी प्रचोदयात् ॥ गौरी ॐ सुभगायै
    च विद्महे काममालिन्यै च धीमहि तन्नो गौरी प्रचोदयात् ॥ लक्ष्मी ॐ महालक्ष्मी च विद्महे विष्णुपत्नीश्च
    धीमहि तन्नो लक्ष्मीः प्रचोदयात् ॥ ॐ महादेव्यै च विद्महे विष्णुपत्न्यै च धीमहि तन्नो लक्ष्मीः प्रचोदयात्
    ॥ सरस्वती ॐ वाग्देव्यै च विद्महे विरिंचिपत्न्यै च धीमहि तन्नो वाणी प्रचोदयात् ॥ सीता ॐ जनकनन्दिन्यै
    विद्महे भूमिजायै च धीमहि तन्नः सीता प्रचोदयात् ॥ राधा ॐ वृषभानुजायै विद्महे कृष्णप्रियायै धीमहि तन्नो
    राधा प्रचोदयात् ॥ अन्नपूर्णा ॐ भगवत्यै च विद्महे माहेश्वर्यै च धीमहि तन्न अन्नपूर्णा प्रचोदयात् ॥
    तुलसी ॐ तुलसीदेव्यै च विद्महे विष्णुप्रियायै च धीमहि तन्नो वृन्दः प्रचोदयात् ॥ महादेव ॐ तत्पुरुषाय
    विद्महे महादेवाय धीमहि तन्नो रुद्रः प्रचोदयात् ॥ रुद्र ॐ पुरुषस्य विद्महे सहस्राक्षस्य धीमहि तन्नो
    रुद्रः प्रचोदयात् ॥ ॐ तत्पुरुषाय विद्महे महादेवाय धीमहि तन्नो रुद्रः प्रचोदयात् ॥ शंकर ॐ सदाशिवाय
    विद्महे सहस्राक्ष्याय धीमहि तन्नः साम्बः प्रचोदयात् ॥ नन्दिकेश्वर ॐ तत्पुरुषाय विद्महे नन्दिकेश्वराय
    धीमहि तन्नो वृषभः प्रचोदयात् ॥ गणेश ॐ तत्कराटाय विद्महे हस्तिमुखाय धीमहि तन्नो दन्ती प्रचोदयात् ॥
    ॐ तत्पुरुषाय विद्महे वक्रतुण्डाय धीमहि तन्नो दन्तिः प्रचोदयात् ॥ ॐ तत्पुरुषाय विद्महे हस्तिमुखाय धीमहि
    तन्नो दन्ती प्रचोदयात् ॥ ॐ एकदन्ताय विद्महे वक्रतुण्डाय धीमहि तन्नो दन्तिः प्रचोदयात् ॥ ॐ लम्बोदराय
    विद्महे महोदराय धीमहि तन्नो दन्तिः प्रचोदयात् ॥ ॐ महोत्कटाय विद्महे वक्रतुण्डाय धीमहि । तन्नो दन्तिः
    प्रचोदयात् ॥ षण्मुख ॐ षण्मुखाय विद्महे महासेनाय धीमहि तन्नः स्कन्दः प्रचोदयात्॥ ॐ षण्मुखाय विद्महे
    महासेनाय धीमहि तन्नः षष्ठः प्रचोदयात् ॥ सुब्रह्मण्य ॐ तत्पुरुषाय विद्महे महासेनाय धीमहि तन्नः षण्मुखः
    प्रचोदयात् ॥ ॐ ॐ ॐकाराय विद्महे डमरुजातस्य धीमहि तन्नः प्रणवः प्रचोदयात् ॥ अजपा ॐ हंस हंसाय विद्महे
    सोऽहं हंसाय धीमहि तन्नो हंसः प्रचोदयात् ॥ दक्षिणामूर्ति ॐ दक्षिणामूर्तये विद्महे ध्यानस्थाय धीमहि
    तन्नो धीशः प्रचोदयात् ॥ गुरु ॐ गुरुदेवाय विद्महे परब्रह्मणे धीमहि तन्नो गुरुः प्रचोदयात् ॥ हयग्रीव
    ॐ वागीश्वराय विद्महे हयग्रीवाय धीमहि तन्नो हंसः प्रचोदयात् ॥ अग्नि ॐ सप्तजिह्वाय विद्महे अग्निदेवाय
    धीमहि तन्न अग्निः प्रचोदयात् ॥ ॐ वैश्वानराय विद्महे लालीलाय धीमहि तन्न अग्निः प्रचोदयात् ॥ ॐ महाज्वालाय
    विद्महे अग्निदेवाय धीमहि तन्नो अग्निः प्रचोदयात् ॥ यम ॐ सूर्यपुत्राय विद्महे महाकालाय धीमहि तन्नो
    यमः प्रचोदयात् ॥ वरुण ॐ जलबिम्बाय विद्महे नीलपुरुषाय धीमहि तन्नो वरुणः प्रचोदयात् ॥ वैश्वानर ॐ पावकाय
    विद्महे सप्तजिह्वाय धीमहि तन्नो वैश्वानरः प्रचोदयात् ॥ मन्मथ ॐ कामदेवाय विद्महे पुष्पवनाय धीमहि तन्नः
    कामः प्रचोदयात् ॥ हंस ॐ हंस हंसाय विद्महे परमहंसाय धीमहि तन्नो हंसः प्रचोदयात् ॥ ॐ परमहंसाय विद्महे
    महत्तत्त्वाय धीमहि तन्नो हंसः प्रचोदयात् ॥ नन्दी ॐ तत्पुरुषाय विद्महे चक्रतुण्डाय धीमहि तन्नो नन्दिः
    प्रचोदयात् ॥ गरुड ॐ तत्पुरुषाय विद्महे सुवर्णपक्षाय धीमहि तन्नो गरुडः प्रचोदयात् ॥ सर्प ॐ नवकुलाय
    विद्महे विषदन्ताय धीमहि तन्नः सर्पः प्रचोदयात् ॥ पांचजन्य ॐ पांचजन्याय विद्महे पावमानाय धीमहि तन्नः
    शंखः प्रचोदयात् ॥ सुदर्शन ॐ सुदर्शनाय विद्महे महाज्वालाय धीमहि तन्नश्चक्रः प्रचोदयात् ॥ अग्नि ॐ रुद्रनेत्राय
    विद्महे शक्तिहस्ताय धीमहि तन्नो वह्निः प्रचोदयात् ॥ ॐ वैश्वानराय विद्महे लाललीलाय धीमहि तन्नोऽग्निः
    प्रचोदयात् ॥ ॐ महाज्वालाय विद्महे अग्निमथनाय धीमहि तन्नोऽग्निः प्रचोदयात् ॥ आकाश ॐ आकाशाय च विद्महे
    नभोदेवाय धीमहि तन्नो गगनं प्रचोदयात् ॥ अन्नपूर्णा ॐ भगवत्यै च विद्महे माहेश्वर्यै च धीमहि तन्नोऽन्नपूर्णा
    प्रचोदयात् ॥ बगलामुखी ॐ बगलामुख्यै च विद्महे स्तम्भिन्यै च धीमहि तन्नो देवी प्रचोदयात् ॥ ॐ ऐं बगलामुखि
    विद्महे ॐ क्लीं कान्तेश्वरि धीमहि । ॐ सौः तन्नः प्रह्लीं प्रचोदयात् ॥ बटुकभैरव ॐ तत्पुरुषाय विद्महे
    आपदुद्धारणाय धीमहि तन्नो बटुकः प्रचोदयात् ॥ भैरवी ॐ त्रिपुरायै च विद्महे भैरव्यै च धीमहि तन्नो देवी
    प्रचोदयात् ॥ भुवनेश्वरी ॐ नारायण्यै च विद्महे भुवनेश्वर्यै धीमहि तन्नो देवी प्रचोदयात् ॥ ब्रह्मा ॐ
    पद्मोद्भवाय विद्महे देववक्त्राय धीमहि तन्नः स्रष्टा प्रचोदयात् ॥ ॐ वेदात्मने च विद्महे हिरण्यगर्भाय
    धीमहि तन्नो ब्रह्मा प्रचोदयात् ॥ ॐ परमेश्वराय विद्महे परतत्त्वाय धीमहि तन्नो ब्रह्मा प्रचोदयात् ॥
    चन्द्र ॐ क्षीरपुत्राय विद्महे अमृततत्त्वाय धीमहि तन्नश्चन्द्रः प्रचोदयात् ॥ छिन्नमस्ता ॐ वैरोचन्यै
    च विद्महे छिन्नमस्तायै धीमहि तन्नो देवी प्रचोदयात् ॥ दक्षिणामूर्ति ॐ दक्षिणामूर्तये विद्महे ध्यानस्थाय
    धीमहि तन्नो धीशः प्रचोदयात् ॥ देवी ॐ देव्यैब्रह्माण्यै विद्महे महाशक्त्यै च धीमहि तन्नो देवी प्रचोदयात्
    ॥ धूमावती ॐ धूमावत्यै च विद्महे संहारिण्यै च धीमहि तन्नो धूमा प्रचोदयात् ॥ दुर्गा ॐ कात्यायन्यै विद्महे
    कन्याकुमार्यै धीमहि तन्नो दुर्गा प्रचोदयात् ॥ ॐ महादेव्यै च विद्महे दुर्गायै च धीमहि तन्नो देवी प्रचोदयात्
    ॥ गणेश ॐ तत्पुरुषाय विद्महे वक्रतुण्डाय धीमहि तन्नो दन्ती प्रचोदयात् ॥ ॐ एकदन्ताय विद्महे वक्रतुण्डाय
    धीमहि तन्नो दन्ती प्रचोदयात् ॥ गरुड ॐ वैनतेयाय विद्महे सुवर्णपक्षाय धीमहि तन्नो गरुडः प्रचोदयात् ॥
    ॐ तत्पुरुषाय विद्महे सुवर्णपर्णाय
