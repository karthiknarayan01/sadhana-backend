id: raghavendrashtottarashatanamastotram
category: stotram
name:
  english: raghavendrashtottarashatanamastotram
  devanagari: राघवेन्द्राष्टोत्तरशतनामस्तोत्रम्
content:
  english: jnanabhitijnanavan dakshahastiranta citte raghavendro mama syat || shriraghavendragurvantargata
    manunamaka bharatiramana mukhyapranantargata sitapati shriramacandrapreranaya shriramacandraprityartham
    gurumantrarajatmaka ashtottarashatanamastotraparayanam karishye | omityekaksharam brahma yadgranthe
    samprakashitam | tasmai shriraghavendrarya gurave'stu namo mama || 1|| namaste shriramacandranghripujasampadite
    shatam | ghanabhangaya vedarthaprakashodyogashaline || 2|| dragabhishtapradatre ca yativaryaya te
    namah | nana duhkhavinashaya namo manadhanapriya || 3|| shripradatre namastubhyam rajavaryadisevita
    | ghanasamsarasaukhyaya vepitaprativadine || 4|| drakshamadhurabhashaya namastubhyam yashahprada |
    namatam saukhyadatre ca manadaya namo namah || 5|| shripatipreshthabhaktaya namaste rajapujita | ghanarogavinashaya
    venkatesharcine namah || 6|| dravitanekabhutaya yashodatanayarcaka | nadarupaparabrahmopasine manine
    namah || 7|| shrinathacaranambhojabambharayitamanasa | rashtragatajanastoma samihitaphalaprada ||
    8|| ghanarogatrinadhvamsadavanalapadamrita | vedashastrasudhambhodhi manthanajnanamandara || 9|| draghimabhavitibhutabhaktaseveshtadayine
    | namaste yacakavratacatakamritatejase || 10|| naranarikadambogravipattivinivarine | mahadayarasasarasagaraya
    namo namah || 11|| shrimadbhih sevyamanaya rashtrakshemakaraya ca | ghanaghanangalolaya vedavyakhyavinedine
    || 12|| dravita'nekapapaya yanadyaishvaryashaline | nagarivahabhaktaya manadatre namo namah || 13||
    shriramarcyapujakaya ramanasaktacetase | ghanapatpariharaya vepitarataye namah || 14|| drakshamadhukatakshaya
    yadunathapadarcine | namajjanaghanashaya manyamanyaya te namah || 15|| shrivyasarajarupena krishnarcarcaka
    te namah | rashikrita'ghatulagninibhadarshana te namah || 16|| ghatukanam ghatukaya vedavidyavisharada
    | draghiyah karunapangairnamaste bhaktatoshine || 17|| yathashaktyappanaryoktastotrapathapramodine
    | naranarinripedyaya mahadaridryanashine || 18|| shrisudhindrakarambhojasanjatavarasunave | ravitanekadurvadidvipine
    ghanacetase || 19|| veshmatraya nivasaya drak prasannaya te namah | yamine narasimhanghrinirataya
    mamatajushe || 20 || shriprahladavataraya rajadvanivilasine | ghatanananurupasyapyarthasya ghatakaya
    te || 21|| vedavedangavittaya dravayanmayivadine | yanarohanasantaptamudrasthapanakarine || 22|| namo
    namyapadabjaya mayavimadaharine | shritungatiravasaya tubhyam rajanataya ca || 23|| ghanasararajoraktabhadrashrirasasevine
    | vetalabhayanashaya draganugrahakarine || 24|| yakshmakushthadiharanapadatirthaya te namah | namasankirtanadeva
    purahsannihitaya ca || 25|| mahajanashirahsthanasamalalitapaduka | shrisarvatantrasvatantryashaline
    rajalakshmane || 26|| ghanavighnavinashaya baddhakankana te namah | vegena bhaktakaryanam sadhakaya
    namo'stu te || 27|| dravayadvadijihvaya yashovyaptadishe namah | nanajatijanastomastuyamanapadambuja
    || 28|| namo mara mahavira marganamrigyacetase | shrimadhvashastrasattikavyakhyakaushalyashaline ||
    29|| rajacchrikaya dharmabhitaptatapapaharine | velam velamupagamya bhaktanam karyasadhaka || 30||
    drakshapakena sakalagranthavyakritikarine | yatheshtadhanadhanyadidatre nayavisharada || 31|| mantralayamahakshetravrindavananivasine
    | shrisatyasandharupena shrisitapratimarcaka || 32|| rajattungatatabhrajanmahishikshetravasine | dharmadyutinavajyotidyotitambaradharine
    || 33|| vetandamattamayindra mrigendradrapitapahan | yaksharakshobhayadhvamsin namo narayanapriya
    || 34|| mayamohitacittanam bhaktanam jnanadayine | namah shrihanumadbhima madhvatmakaharipriya ||
    35|| rajapujitapatirapadukaya ghanakrite | veshantikritasadbhaktasamsarambudhaye namah || 36|| dravitakhilabhaktaughananaduhkhaya
    te namah | yamadutabhayatratre nanabhayavinashine || 37|| matritah pitritopyuccaih bhaktakamadughe
    namah | iti shriraghavendraryagururajamahatmanah || 38|| namnamashatottarashatam sacatushtayamuttamam
    | ashtaksharamahamantravarnanukramavarnitam || 39|| gururajatmabhukrishnavadhuta kavinoditam | gururajena
    kripaya saprasadam puraskritam || 40 || pathatam japatam sarvakamadam gurvanugrahat | nashyanti jvaramohadyah
    caturdashadinavadhi || 41|| iti shrimatkrishnavadhutapanditakritau shriraghavendratantre saptamapatale
    ashtottarashatanamastotram sampurnam |
  devanagari: ज्ञानाभीतीज्ञानवान् दक्षहस्तीरन्ता चित्ते राघवेन्द्रो मम स्यात् ॥ श्रीराघवेन्द्रगुर्वन्तर्गत
    मनुनामक भारतीरमण मुख्यप्राणान्तर्गत सीतापति श्रीरामचन्द्रप्रेरणया श्रीरामचन्द्रप्रीत्यर्थं गुरुमन्त्रराजात्मक
    अष्टोत्तरशतनामस्तोत्रपारायणं करिष्ये । ओमित्येकाक्षरं ब्रह्म यद्ग्रन्थे सम्प्रकाशितम् । तस्मै श्रीराघवेन्द्रार्य
    गुरवेऽस्तु नमो मम ॥ १॥ नमस्ते श्रीरामचन्द्राङ्घ्रिपूजासम्पादिते शतम् । घनाभाङ्गाय वेदार्थप्रकाशोद्योगशालिने
    ॥ २॥ द्रागभीष्टप्रदात्रे च यतिवर्याय ते नमः । नाना दुःखविनाशाय नमो मानधनप्रिय ॥ ३॥ श्रीप्रदात्रे नमस्तुभ्यं
    राजवर्यादिसेवित । घनसंसारसौख्याय वेपितप्रतिवादिने ॥ ४॥ द्राक्षामधुरभाषाय नमस्तुभ्यं यशःप्रद । नमतां
    सौख्यदात्रे च मानदाय नमो नमः ॥ ५॥ श्रीपतिप्रेष्ठभक्ताय नमस्ते राजपूजित । घनरोगविनाशाय वेङ्कटेशार्चिने
    नमः ॥ ६॥ द्रावितानेकभूताय यशोदातनयार्चक । नादरूपपरब्रह्मोपासिने मानिने नमः ॥ ७॥ श्रीनाथचरणाम्भोजबम्भारायितमानस
    । राष्ट्रागतजनस्तोम समीहितफलप्रद ॥ ८॥ घनरोगतृणध्वंसदवानलपदामृत । वेदशास्त्रसुधाम्भोधि मन्थनज्ञानमन्दर
    ॥ ९॥ द्राघिमाभावितीभूतभक्तसेवेष्टदायिने । नमस्ते याचकव्रातचातकामृततेजसे ॥ १०॥ नरनारीकदम्बोग्रविपत्तिविनिवारिणे
    । महादयारसासारसागराय नमो नमः ॥ ११॥ श्रीमद्भिः सेव्यमानाय राष्ट्रक्षेमकराय च । घनाघनाङ्गलोलाय वेदव्याख्याविनेदिने
    ॥ १२॥ द्राविताऽनेकपापाय यानाद्यैश्वर्यशालिने । नागारिवाहभक्ताय मानदात्रे नमो नमः ॥ १३॥ श्रीरामार्च्यापूजकाय
    रामानासक्तचेतसे । घनापत्परिहाराय वेपितारातये नमः ॥ १४॥ द्राक्षामधुकटाक्षाय यदुनाथपदार्चिने । नमज्जनाघनाशाय
    मान्यमान्याय ते नमः ॥ १५॥ श्रीव्यासराजरूपेण कृष्णार्चार्चक ते नमः । राशीकृताऽघतूलाग्निनिभदर्शन ते
    नमः ॥ १६॥ घातुकानां घातुकाय वेदविद्याविशारद । द्राघीयः करुणापाङ्गैर्नमस्ते भक्ततोषिणे ॥ १७॥ यथाशक्त्यप्पणार्योक्तस्तोत्रपाठप्रमोदिने
    । नरनारीनृपेड्याय महादारिद्र्यनाशिने ॥ १८॥ श्रीसुधीन्द्रकरम्भोजसञ्जातवरसूनवे । रावितानेकदुर्वादिद्वीपिने
    घनचेतसे ॥ १९॥ वेश्मत्रय निवासाय द्राक् प्रसन्नाय ते नमः । यमिने नरसिंहाङ्घ्रिनिरताय ममताजुषे ॥ २०
    ॥ श्रीप्रह्लादावताराय राजद्वाणीविलासिने । घटनाननुरूपस्याप्यर्थस्य घटकाय ते ॥ २१॥ वेदवेदाङ्गवित्ताय
    द्रावयन्मायिवादिने । यानारोहणसन्तप्तमुद्रास्थापनकारिणे ॥ २२॥ नमो नम्यपदाब्जाय मायाविमदहारिणे । श्रीतुङ्गातीरवासाय
    तुभ्यं राजनताय च ॥ २३॥ घनसाररजोरक्तभद्रश्रीरससेविने । वेतालभयनाशाय द्रागनुग्रहकारिणे ॥ २४॥ यक्ष्मकुष्ठादिहरणपादतीर्थाय
    ते नमः । नामसङ्कीर्तनादेव पुरःसन्निहिताय च ॥ २५॥ महाजनशिरःस्थानसमालालितपादुक । श्रीसर्वतन्त्रस्वातन्त्र्यशालिने
    राजलक्ष्मणे ॥ २६॥ घनविघ्नविनाशाय बद्धकङ्कण ते नमः । वेगेन भक्तकार्याणां साधकाय नमोऽस्तु ते ॥ २७॥ द्रावयद्वादिजिह्वाय
    यशोव्याप्तदिशे नमः । नानाजातिजनस्तोमस्तूयमानपदाम्बुज ॥ २८॥ नमो मार महावीर मार्गणामृग्यचेतसे । श्रीमध्वशास्त्रसट्टीकाव्याख्याकौशल्यशालिने
    ॥ २९॥ राजच्छ्रीकाय धर्माभितप्ततापापहारिणे । वेलां वेलामुपागम्य भक्तानां कार्यसाधक ॥ ३०॥ द्राक्षापाकेन
    सकलग्रन्थव्याकृतिकारिणे । यथेष्टधनधान्यादिदात्रे नयविशारद ॥ ३१॥ मन्त्रालयमहाक्षेत्रवृन्दावननिवासिने
    । श्रीसत्यसन्धरूपेण श्रीसीताप्रतिमार्चक ॥ ३२॥ राजत्तुङ्गातटभ्राजन्महिषीक्षेत्रवासिने । धर्मद्युतिनवज्योतिद्योतिताम्बरधारिणे
    ॥ ३३॥ वेतण्डमत्तमायीन्द्र मृगेन्द्रद्रापितापहन् । यक्षरक्षोभयध्वंसिन् नमो नारायणप्रिय ॥ ३४॥ मायामोहितचित्तानां
    भक्तानां ज्ञानदायिने । नमः श्रीहनुमद्भीम मध्वात्मकहरिप्रिय ॥ ३५॥ राजपूजितपाटीरपादुकाय घनाकृते । वेशन्तीकृतसद्भक्तसंसाराम्बुधये
    नमः ॥ ३६॥ द्राविताखिलभक्तौघनानादुःखाय ते नमः । यमदूतभयत्रात्रे नानाभयविनाशिने ॥ ३७॥ मातृतः पितृतोप्युच्चैः
    भक्तकामदुघे नमः । इति श्रीराघवेन्द्रार्यगुरुराजमहात्मनः ॥ ३८॥ नाम्नामषाटोत्तरशतं सचतुष्टयमुत्तमम्
    । अष्टाक्षरमहामन्त्रवर्णानुक्रमवर्णितम् ॥ ३९॥ गुरुराजात्मभूकृष्णावधूत कविनोदितम् । गुरुराजेन कृपया
    सप्रसादं पुरस्कृतम् ॥ ४० ॥ पठतां जपतां सर्वकामदं गुर्वनुग्रहात् । नश्यन्ति ज्वरमोहाद्याः चतुर्दशदिनावधि
    ॥ ४१॥ इति श्रीमत्कृष्णावधूतपण्डितकृतौ श्रीराघवेन्द्रतन्त्रे सप्तमपटले अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ।
