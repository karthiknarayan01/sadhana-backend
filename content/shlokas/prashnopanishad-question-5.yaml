id: prashnopanishad-question-5
category: stotram
name:
  english: Prashnopanishad - Question 5
content:
  english: pancamah prashnah atha hainam shaibya ssatyakamah papraccha| sa yo ha vai ta nmanushyeshu prayanantamonkaramabhidhyayita
    katamam || tasmai sa hovaca etad vai satyakama para nca brahma yadonkarah| tasmad vidvanetenaivayatanenaikataramanveti
    || || sa yadyekamatramabhidhyayita sa tenaiva sam ve~ditasturnameva jagatyamabhisampadyate| tamrico
    manushyalokamupanayante sa tatra tapasa brahmacaryena shraddhaya sampanno mahimanamanubhavati || ||
    atha yadi dvimatrena manasi sampadyate so ya~jurbhirunniyate somalokam| sa somaloke vibhutimanubhuya
    punaravartate || ntrimatrenomityetenaivaksharena para mpurushamabhidhyayita sa tejasi surye sampannah|
    yatha padodarastvaca vinirmucyate evam ha vai sa papmana vinirmukta ssa samabhirunniyate brahmalokam
    sa etasmajjivaghanatparatpara mpurushamikshate tadetau shlokau bhavatah || || tisro matra mrityumatyah
    prayukta anyonyasaktah anaviprayuktah| kriyasu bahyabhyantaramadhyamasu samyakprayuktasu na kampate
    jnah || ya~jurbhirantariksham samabhiryattatkavayo vedayante| tamonkarenaivayatanenanveti vidvan yattacchantamajaramamritamabhaya
  devanagari: पञ्चमः प्रश्नः अथ हैनं शैब्य स्सत्यकामः पप्रच्छ। स यो ह वै त न्मनुष्येषु प्रायणान्तमोङ्कारमभिध्यायीत
    कतमं ॥ तस्मै स होवाच एतद् वै सत्यकाम पर ञ्च ब्रह्म यदोङ्कारः। तस्माद् विद्वानेतेनैवायतनेनैकतरमन्वेति
    ॥ ॥ स यद्येकमात्रमभिध्यायीत स तेनैव सं वेँदितस्तूर्णमेव जगत्यामभिसम्पद्यते। तमृचो मनुष्यलोकमुपनयन्ते
    स तत्र तपसा ब्रह्मचर्येण श्रद्धया सम्पन्नो महिमानमनुभवति ॥ ॥ अथ यदि द्विमात्रेण मनसि सम्पद्यते सो
    यँजुर्भिरुन्नीयते सोमलोकम्। स सोमलोके विभूतिमनुभूय पुनरावर्तते ॥ न्त्रिमात्रेणोमित्येतेनैवाक्षरेण
    पर म्पुरुषमभिध्यायीत स तेजसि सूर्ये सम्पन्नः। यथा पादोदरस्त्वचा विनिर्मुच्यते एवं ह वै स पाप्मना विनिर्मुक्त
    स्स सामभिरुन्नीयते ब्रह्मलोकं स एतस्माज्जीवघनात्परात्पर म्पुरुषमीक्षते तदेतौ श्लोकौ भवतः ॥ ॥ तिस्रो
    मात्रा मृत्युमत्यः प्रयुक्ता अन्योन्यसक्ताः अनविप्रयुक्ताः। क्रियासु बाह्याभ्यन्तरमध्यमासु सम्यक्प्रयुक्तासु
    न कम्पते ज्ञः ॥ यँजुर्भिरन्तरिक्षं सामभिर्यत्तत्कवयो वेदयन्ते। तमोङ्कारेणैवायतनेनान्वेति विद्वान्
    यत्तच्छान्तमजरममृतमभय
