    | smritilekhe | shraddhalekhe | buddhilekhe | vimarshalekhe | caitanyalekhe | mulalekhe | sutralekhe
    | aksharalekhe | varnalekhe | mantralekhe | tantralekhe | yantralekhe | shastralekhe | vedalekhe |
    agamalekhe | puranalekhe | nigamalekhe | rahasyalekhe | guhyalekhe | mahaguhyalekhe | sarvalekhasvarupini
    | divyaughagururupini | parashaktimayi | parameshvaramayi | shriparamakrishnamayi | mahaviratvishnumayi
    | hiranyagarbhamayi | dattatreyamayi | dakshinamurtimayi | sanakamayi | sanandanamayi | sanatanamayi
    | sanatkumaramayi | narayanamayi | ishvaramayi | anantamayi | svayambhumayi | divyagurumayi | siddhaughagururupini
    | vasishthamayi | kapilamayi | prahladamayi | dashananamayi | kuberamayi | manumayi | shrimahalakshmimayi
    | bhrigumayi | atrimayi | angirasamayi | yajnavalkyamayi | markandeyamayi | shukamayi | naradamayi
    | vishvamitramayi | siddhagurumayi | manavaughagururupini | shriagastyamayi | kriyagurumayi | anandanathamayi
    | matsyendranathamayi | gorakshanathamayi | navanathamayi | jalandharanathamayi | kaniphanathamayi
    | carpatanathamayi | gahininathamayi | nivrittinathamayi | jnaneshvaramayi | sopananathamayi | muktanathamayi
    | manavagurumayi | shrigururupini | paramagururupini | paraparagururupini | parameshthigururupini
