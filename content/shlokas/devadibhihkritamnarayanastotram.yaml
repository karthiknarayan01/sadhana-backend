id: devadibhihkritamnarayanastotram
category: stotram
name:
  english: devadibhihkritamnarayanastotram
  devanagari: देवादिभिःकृतंनारायणस्तोत्रम्
content:
  english: 10|| rishaya ucuh | bhaktya hinastvadvimukho vayunarthi shramyanbhuyopyasya na siddhim samupaiti
    | tarhyasaktah karmani kamye tu kuto'sau saukhyam yayadakshayamanandamahabdhe || 11|| bhaktya nityam
    tvamata eva vayam vai shraddhayukta dharmataponigamadyaih | mayatitam kalaniyantaramudaram dhyayamah
    shrikantaparatparamekam || 12|| indra uvaca | bhagavannuruduhkhita vayam nanu durvasasa eva helanat
    | na bhavantamrite'vitum hi no vidhirudrapramukha ime'shakan || 13|| vigatakhilasampado nirannah samabhavam
    bhuvi pamarairupetah | bhavataiva vayam hritapadah smah sapadi shriharaye namo'stu tubhyam || 14||
    agniruvaca | girvanadanavanaradyupajivanannam yannirmitam hi bhavataiva tato budhastu | yajneshu tena
    yajanam tava kurvate'tho tvaccheshamanyadivishadbhya upanayanti || 15|| kamyeshu karmasu rata api
    yajnikaste tatkarmabandhanata ashu vimucya yanti | brahmim gatim taditare tu bhavanti caurah shriyajnapurushamaham
    pranamami tam tvam || 16|| maruta ucuh | bhakta ekantikaste'ksharaparamapade sevaya te tu hinam vasaishvaryadi
    necchantyatishayitasukham napi kaivalyamoksham | tadyuktam tvatmano'pi shvapacakulajanurmanayantyuttamam
    vai tam tvamekantadharmashrayanamupagatah shrimahapurusham smah || 17|| siddha ucuh | naikabrahmandasargadikaranam
    tvamakaranam | tatstham tadvyatiriktam ca niyantaram namamahe || 18|| rudra ucuh | mayayah sarvamohinya
    mohanam mohavarjitam | mahakalasyapi kalam tvam namah purushottamam || 19|| aditya ucuh | prakashita
    yena vayam jaganti prakashayamo bhavata ramesha | svayamprakasham tamuruprakasham prakashamurttim
    pranata bhavantam || 9
  devanagari: १०॥ ऋषय ऊचुः । भक्त्या हीनस्त्वद्विमुखो वयुनार्थी श्राम्यन्भूयोप्यस्य न सिद्धिं समुपैति
    । तर्ह्यासक्तः कर्मणि काम्ये तु कुतोऽसौ सौख्यं यायादक्षयमानन्दमहाब्धे ॥ ११॥ भक्त्या नित्यं त्वामत
    एव वयं वै श्रद्धायुक्ता धर्मतपोनिगमाद्यैः । मायातीतं कालनियन्तारमुदारं ध्यायामः श्रीकान्तपरात्परमेकम्
    ॥ १२॥ इन्द्र उवाच । भगवन्नुरुदुःखिता वयं ननु दुर्वासस एव हेलनात् । न भवन्तमृतेऽवितुं हि नो विधिरुद्रप्रमुखा
    इमेऽशकन् ॥ १३॥ विगताखिलसम्पदो निरन्नाः समभावं भुवि पामरैरुपेताः । भवतैव वयं हृतापदः स्मः सपदि श्रीहरये
    नमोऽस्तु तुभ्यम् ॥ १४॥ अग्निरुवाच । गीर्वाणदानवनराद्युपजीवनान्नं यन्निर्मितं हि भवतैव ततो बुधास्तु
    । यज्ञेषु तेन यजनं तव कुर्वतेऽथो त्वच्छेषमन्यदिविषद्भ्य उपानयन्ति ॥ १५॥ काम्येषु कर्मसु रता अपि याज्ञिकास्ते
    तत्कर्मबन्धनत आशु विमुच्य यान्ति । ब्राह्मीं गतिं तदितरे तु भवन्ति चौराः श्रीयज्ञपूरुषमहं प्रणमामि
    तं त्वाम् ॥ १६॥ मरुत ऊचुः । भक्ता एकान्तिकास्तेऽक्षरपरमपदे सेवया ते तु हीनं वासैश्वर्यादि नेच्छन्त्यतिशयितसुखं
    नापि कैवल्यमोक्षम् । तद्युक्तं त्वात्मनोऽपि श्वपचकुलजनुर्मानयन्त्युत्तमं वै तं त्वामेकान्तधर्माश्रयणमुपगताः
    श्रीमहापूरुषं स्मः ॥ १७॥ सिद्धा ऊचुः । नैकब्रह्माण्डसर्गादिकारणं त्वामकारणम् । तत्स्थं तद्व्यतिरिक्तं
    च नियन्तारं नमामहे ॥ १८॥ रुद्रा ऊचुः । मायायाः सर्वमोहिन्या मोहनं मोहवर्जितम् । महाकालस्यापि कालं
    त्वां नमः पुरुषोत्तमम् ॥ १९॥ आदित्या ऊचुः । प्रकाशिता येन वयं जगन्ति प्रकाशयामो भवता रमेश । स्वयम्प्रकाशं
    तमुरुप्रकाशं प्रकाशमूर्त्तिं प्रणता भवन्तम् ॥ ९
