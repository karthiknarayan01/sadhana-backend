id: tarastotram
category: stotram
name:
  english: tarastotram
  devanagari: तारास्तोत्रम्
content:
  english: granthishreninrimundadamalalite bhime bhayam nashaya || 3|| mayanangavikararupalalanabindvarddhacandrambike
    humphatkaramayi tvameva sharanam mantratmike madrishah | murtiste janani tridhamaghatita sthulatisukshma
    para vedanam nahi gocara kathamapi prajnairnutamashraye || 4|| tvatpadambujasevaya sukritino gacchanti
    sayujyatam tasyah shriparameshvaratrinayanabrahmadisamyatmanah | samsarambudhimajjane patutanurdevendramukhyasuran
    mataste padasevane hi vimukhan kim mandadhih sevate || 5|| matastvatpadapankajadvayarajomudrankakotirinaste
    deva jayasangare vijayino nihshankamanke gatah | devo'ham bhuvane na me sama iti sparddham vahantah
    pare tattulyam niyatam yatha shashiravi nasham vrajanti svayam || 6|| tvannamasmaranatpalayanaparandrashtum
    ca shakta na te bhutapretapishacarakshasagana yakshashca nagadhipah | daitya danavapungavashca khacara
    vyaghradika jantavo dakinyah kupitantakashca manujan matah kshanam bhutale || 7|| lakshmih siddhiganashca
    padukamukhah siddhastatha vairinam stambhashcapi varangane gajaghatastambhastatha mohanam | matastvatpadasevaya
    khalu nrinam siddhyanti te te gunah klantah kantamanobhavo'tra bhavati kshudro'pi vacaspatih || 8||
  devanagari: ग्रन्थिश्रेणिनृमुण्डदामललिते भीमे भयं नाशय ॥ ३॥ मायानङ्गविकाररूपललनाबिन्द्वर्द्धचन्द्राम्बिके
    हुंफट्कारमयि त्वमेव शरणं मन्त्रात्मिके मादृशः । मूर्तिस्ते जननि त्रिधामघटिता स्थूलातिसूक्ष्मा परा
    वेदानां नहि गोचरा कथमपि प्राज्ञैर्नुतामाश्रये ॥ ४॥ त्वत्पादाम्बुजसेवया सुकृतिनो गच्छन्ति सायुज्यतां
    तस्याः श्रीपरमेश्वरत्रिनयनब्रह्मादिसाम्यात्मनः । संसाराम्बुधिमज्जने पटुतनुर्देवेन्द्रमुख्यासुरान्
    मातस्ते पदसेवने हि विमुखान् किं मन्दधीः सेवते ॥ ५॥ मातस्त्वत्पदपङ्कजद्वयरजोमुद्राङ्ककोटीरिणस्ते देवा
    जयसङ्गरे विजयिनो निःशङ्कमङ्के गताः । देवोऽहं भुवने न मे सम इति स्पर्द्धां वहन्तः परे तत्तुल्यां नियतं
    यथा शशिरवी नाशं व्रजन्ति स्वयम् ॥ ६॥ त्वन्नामस्मरणात्पलायनपरान्द्रष्टुं च शक्ता न ते भूतप्रेतपिशाचराक्षसगणा
    यक्षश्च नागाधिपाः । दैत्या दानवपुङ्गवाश्च खचरा व्याघ्रादिका जन्तवो डाकिन्यः कुपितान्तकश्च मनुजान्
    मातः क्षणं भूतले ॥ ७॥ लक्ष्मीः सिद्धिगणश्च पादुकमुखाः सिद्धास्तथा वैरिणां स्तम्भश्चापि वराङ्गने गजघटास्तम्भस्तथा
    मोहनम् । मातस्त्वत्पदसेवया खलु नृणां सिद्ध्यन्ति ते ते गुणाः क्लान्तः कान्तमनोभवोऽत्र भवति क्षुद्रोऽपि
    वाचस्पतिः ॥ ८॥
