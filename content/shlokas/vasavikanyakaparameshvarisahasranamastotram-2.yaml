id: vasavikanyakaparameshvarisahasranamastotram-2
category: sahasranama
name:
  english: vasavikanyakaparameshvarisahasranamastotram 2
  devanagari: वासवीकन्यकापरमेश्वरीसहस्रनामस्तोत्रम् २
content:
  english: onkarabijaksharim hrinkarim shrimadvasavi kanyakaparameshvarim ghanashailapuradhishvarim kusumambakusumashreshthipriyakumarim
    | virupakshadivyasodarim ahimsajyotirupinim kalikalushyaharinim satyajnananandasharirinim mokshapathadarshinim
    nadabindukalatitajagajjananim tyagashilavratam nityavaibhavopetam paradevatam tam namamyaham sarvada
    dhyayamyaham || atha shrivasavidevisahasranamastotram | om shrivasavi vishvajanani vishvalilavinodini
    | shrimata vishvambhari vaishyavamshoddharini || 1|| kusumadampatinandini kamitarthapradayini | kamarupa
    premadipa kamakrodhavinashini || 2|| penugondakshetranilaya parashakyavatarini | paravidya paranjyotih
    dehatrayanivasini || 3|| vaishakhashuddadashamibhriguvasarajanmadharini | virupakshapriyabhagini vishvarupapradarshini
    || 4|| punarvasutarayuktashubhalagnavatarini | pranavarupa pranavakara jivakotishubhakarini || 5||
    tyagasimhasanarudha tapatrayasudurini | tattvarthacintanashila tattvajnanaprabodhini || 6|| adhyatmajnanavijnananidhirmahatsadhanapriya
    | adhyatmajnanavidyarthiyogakshemavahanapriya || 7|| sadhakantahkaranamathani ragadveshavidurini |
    sarvasadhakasanjivini sarvada modakarini || 8|| svatantradharini ramya sarvakalasupujita | svasvarupanandamagna
    sadhujanasamupasita || 9|| vidyadata suvikhyata jnanijanaparishoshini | vairagyollasanaprita bhaktashodhanatoshini
    || 10|| sarvakaryasiddhidatri upasakasankarshini | sarvatmika sarvagata dharmamargapradarshini ||
    11|| gunatrayamayi devi suraradhyasurantaka | garvadura premadhara sarvamantratantratmika || 12||
    vijnanatantrasancalitayantrashaktivivardhini | vijnanapurnavedantasaramritabhivarshini || 13|| bhavapankanityamagnasadhakasukhakarini
    | bhadrakartaveshashamani tyagayatrarthipalini || 14|| budhavandya buddhirupa kanyakumari shrikari
    | bhaskaracaryaptashishya maunavratarakshakari || 15|| kavyanatyaganashilpacitranatanapramodini |
    kayakleshabhayalasyanirodhini pathadarshini || 16|| bhavapushparcanaprita surasuraparipalini | bahyantarashuddhinishthadehasvasthyasamrakshini
    || 17|| janmamrityujarajadyayatanapariharini | jivajivabhedabhavadurini sumamalini || 18|| caturdashabhuvanaikadhishvari
    rajeshvari | caracarajagannatakasutradharini kaladhari || 19|| jnananidhih jnanadayi paraparavidyakari
    | jnanavijnananubhutikarini nishthakari || 20|| caturvaidajnanajanani caturvidyavinodini | catushshashthikalapurna
    rasikasujanakarshini || 21|| bhumyakashavayuragnijaleshvari maheshvari | bhavyadevalayapratishthitacarumurtih
    abhayankari || 22|| bhutagramasrishtikartri shaktijnanapradayini | bhogaishvaryadahahantri nitimargapradarshini
    || 23|| divyagatri divyanetri divyacakshuda shobhana | divyamalyambaradhari divyagandhasulepana ||
    24|| suveshalankaraprita supriya prabhavati | sumatidata sumanatrata sarvada tejovati || 25|| cakshushajyotiprakasha
    ojasajyotiprakashini | bhasvarajyotiprajjvalini taijasajyotirupini || 26|| anupamanandashrukari atilokasaundaryavati
    | asimalavanyavati nissimamahimavati || 27|| tattvadhara tattvakara tattvamayi sadrupini | tattvasakta
    tattvavetta cidanandasvarupini || 28|| apatsamayasantrata atmasthairyapradayini | atmajnanasampradata
    atmabuddhipracodini || 29|| jananamaranacakranatha jivotkarshakarini | jagadrupa jagadraksha japatapadhyanatoshini
    || 30|| pancayajnarcita varada svarthavrikshakutharika | pancakoshantarniketana pancakleshagnishamaka
    || 31|| trisandhyarcitagayatri manini trimalanashini | trivasanarahita sumati tritanucetanakarini
    || 32|| mahavatsalyapushkarini shukapani subhashini | mahaprajnabudharakshini shukavani suhasini ||
    33|| dyuttarashatahomakundadivyayajnasupreraka | brahmakundadisukshetrapariveshtitapithika || 34||
    dyuttarashatalinganvitajyeshthashailapurishvari | dyuttarashatadampatijananusrita nirishvari || 35||
    tritapasantrastavani latangi tamadhvamsini | trijagadvandyajanani tridoshapaharini || 36|| shabdarthadhvanitoshini
    kavyakarmavinodini | shishtapriya dushtadamani kashtanashtavidurini || 37|| jagratsvapnasrishtililamagnacittajnanodaya
    | janmarogavaidyottama sarvamatakulavarnashraya || 38|| kamapiditavishnuvardhanamohakroshini viragini
    | kripavarshini viraja mohini balayogini || 39|| kavindravarnanavedya varnanatitarupini | kamaniya
    dayahridaya karmaphalapradayini || 40|| shokamohadhinasadhakavrindanityaparirakshini | shodashopacarapujya
    urdhvalokasancarini || 41|| bhitibhrantivinirmukta dhyanagamya lokottara | brahmavishnushivasvarupasadguruvacanatatpara
    || 42|| avasthatrayanijasakshini sadyomuktiprasadini | alaukikamadhuryayutasuktipiyushavarshini ||
    43|| dharmanishtha shilanishtha dharmacaranatatpara | divyasankalpaphaladatri dhairyasthairyaratnakara
    || 44|| putrakameshtiyaganugrahasatphalarupini | putramitrabandhumohadurini maitrimodini || 45|| carumanushavigraharupadharini
    suragini | cintamanigrihavasini cintajadyaprashamani || 46|| jivakotirakshanapara vidvajjyotiprakashini
    | jivabhavaharanacatura hamsini dharmavadini || 47|| bhakshyabhojyalehyacoshyanivedanasamharshini
    | bhedarahita modasahita bhavacakrapravartini || 48|| hridayaguhantaryamini sahridayasukhavardhini
    | hridayadaurbalyavinashini samacittaprasadini || 49|| dinashraya dinapujya dainyabhavavivarjita |
    divyasadhanasampraptadivyashaktisamanvita || 50|| chalashaktidayini vandya dhirasadhakoddharini |
    chaladveshavarjitatma yogimunisamrakshini || 51|| brahmacaryashramapara grihasthashramamodini | vanaprasthashramarakshini
    sannyasashramapavani || 52|| mahatapasvini shubhada mahaparivartanakara | mahatvakankshapradatri mahaprajnajitamara
    || 53|| yogagnishaktisambhuta shokashamakacandrika | yogamaya kanya vinuta jnananaukadhinayika ||
    54|| devarshirajarshisevya divijavrindasampujita | brahmarshimaharshiganagamya dhyanayogasamharshita
    || 55|| uragaharastutiprasanna uragashayanapriyabhagini | uragendravarnitamahima uragakarakundalini
    || 56|| paramparasampraptayogamargasancalini | paranadalola vimala paradharmabhayadurini || 57|| padmashayanacakravartisutarajarajendrashrita
    | pancabanaceshtadamani pancabanasatiprarthita || 58|| saumyarupa madhuravani maharajni niramayi |
    sujnanadiparadhita samadhidarshitacinmayi || 59|| sakalavidyaparangata adhyatmavidyakovida | sarvakaladhyeyanvita
    shrividyavisharada || 60|| jnanadarpanatmadrashta karmayogidravyarcita | yajnashishtashinapavani yajnatapo'navakunthita
    || 61|| srijanatmakashaktimula kavyavacanavinodini | racanatmakashaktidata bhavananiketanashobhini
    || 62|| mamatahankarapashavimocani dhritidayini | mahajanasamaveshtitakusumashreshthihitavadini ||
    63|| svajananumodasahitatyagakrantiyojanakari | svadharmanishthasidhyarthakritakarmashubhankari ||
    64|| kulabandhavajanaradhya parandhamanivasini | kulapavanakaratyagayogadarshini priyavadini || 65||
    dharmajijnasanumodinyatmadarshanabhagyodaya | dharmapriya jaya vijaya karmaniratajnanodaya || 66||
    nityanandasanasina shaktibhaktivaradayini | nigrahaparigrahashila atmanishthakarini || 67|| taratamyabhedarahita
    satyasandha nityavrata | trailokyakutumbamata samyagdarshanasamyuta || 68|| ahimsavratadikshayuta
    lokakantakadaityapaha | alpajnanapayaharini arthasancayalobhapaha || 69|| premaprita premasahita nishkamasevapriya
    | premasudhambudhilinabhaktacittanityalaya || 70|| moghashaduhkhadayi amoghajnanadayini | mahajanabuddibhedajanakabodhakramavarini
    || 71|| sattvikantahkaranavasa rajasahritkshobhini | tamasajanashikshaneshta gunatita gunashalini
    || 72|| gauravabalikavrindanayika shodashakalatmika | gurushushrushaparayananityadhyeya trigunatmika
    || 73|| jijnasatishayajnata ajnanatamonashini | vijnanashastratita jnatrijneyasvarupini || 74|| sarvadhidevatajanani
    naishkarmyasiddhikarini | sarvabhishtada sunayani naipunyavaradayini || 75|| gunakarmavibhaganusaravarnavidhayini
    | gurukarunyapraharshita nalinamukhi niranjani || 76|| jatimatadveshadura manujakulahitakamini | jyotirmayi
    jivadayi prajnajyotisvarupini || 77|| karmayogamarmavetta bhaktiyogasamupashrita | jnanayogapritacitta
    dhyanayogasudarshita || 78|| svatmarpanasantushta sharanabhringasusevita | svarnavarna sucaritartha
    karanasangatyagavrata || 79|| adyantarahitakara adhyayanalagnamanasa | asadrishamahimopeta abhayahasta
    mridumanasa || 80|| uttamottamagunahpurna utsavollasaranjani | udaratanuvicchinnaprasuptasamskaratarini
    || 81|| gunagrahanabhyasamula ekantacintanapriya | gahanabrahmatattvalola ekakini stotrapriya || 82||
    vasudhakutumbarakshini satyarupa mahamatih | varnashilpini nirbhava bhuvanamangalakritih || 83|| shuddhabuddisvayamvedya
    shuddhacittasugocara | shuddhakarmacarananishthasuprasanna bimbadhara || 84|| navagrahashaktida gudhatattvapratipadini
    | navanavanubhavodaya vishvajna sha
  devanagari: ओङ्कारबीजाक्षरीं ह्रीङ्कारीं श्रीमद्वासवी कन्यकापरमेश्वरीं घनशैलपुराधीश्वरीं कुसुमाम्बकुसुमश्रेष्ठिप्रियकुमारीम्
    । विरूपाक्षदिव्यसोदरीं अहिंसाज्योतिरूपिणीं कलिकालुष्यहारिणीं सत्यज्ञानानन्दशरीरिणीं मोक्षपथदर्शिनीं
    नादबिन्दुकलातीतजगज्जननीं त्यागशीलव्रतां नित्यवैभवोपेतां परदेवतां तां नमाम्यहम् सर्वदा ध्यायाम्यहम्
    ॥ अथ श्रीवासविदेवीसहस्रनामस्तोत्रम् । ॐ श्रीवासवी विश्वजननी विश्वलीलाविनोदिनी । श्रीमाता विश्वम्भरी
    वैश्यवंशोद्धारिणी ॥ १॥ कुसुमदम्पतिनन्दिनी कामितार्थप्रदायिनी । कामरूपा प्रेमदीपा कामक्रोधविनाशिनी
    ॥ २॥ पेनुगोण्डक्षेत्रनिलया पराशक्यवतारिणी । पराविद्या परञ्ज्योतिः देहत्रयनिवासिनी ॥ ३॥ वैशाखशुद्ददशमीभृगुवासरजन्मधारिणी
    । विरूपाक्षप्रियभगिनी विश्वरूपप्रदर्शिनी ॥ ४॥ पुनर्वसुतारायुक्तशुभलग्नावतारिणी । प्रणवरूपा प्रणवाकारा
    जीवकोटिशुभकारिणी ॥ ५॥ त्यागसिंहासनारूढा तापत्रयसुदूरिणी । तत्त्वार्थचिन्तनशीला तत्त्वज्ञानप्रबोधिनी
    ॥ ६॥ अध्यात्मज्ञानविज्ञाननिधिर्महत्साधनाप्रिया । अध्यात्मज्ञानविद्यार्थियोगक्षेमवहनप्रिया ॥ ७॥ साधकान्तःकरणमथनी
    रागद्वेषविदूरिणी । सर्वसाधकसञ्जीविनी सर्वदा मोदकारिणी ॥ ८॥ स्वतन्त्रधारिणी रम्या सर्वकालसुपूजिता ।
    स्वस्वरूपानन्दमग्ना साधुजनसमुपासिता ॥ ९॥ विद्यादाता सुविख्याता ज्ञानिजनपरिषोषिणी । वैराग्योल्लासनप्रीता
    भक्तशोधनतोषिणी ॥ १०॥ सर्वकार्यसिद्धिदात्री उपासकसङ्कर्षिणी । सर्वात्मिका सर्वगता धर्ममार्गप्रदर्शिनी
    ॥ ११॥ गुणत्रयमयी देवी सुराराध्यासुरान्तका । गर्वदूरा प्रेमाधारा सर्वमन्त्रतन्त्रात्मिका ॥ १२॥ विज्ञानतन्त्रसञ्चालितयन्त्रशक्तिविवर्धिनी
    । विज्ञानपूर्णवेदान्तसारामृताभिवर्षिणी ॥ १३॥ भवपङ्कनित्यमग्नसाधकसुखकारिणी । भद्रकर्तावेशशमनी त्यागयात्रार्थिपालिनी
    ॥ १४॥ बुधवन्द्या बुद्धिरूपा कन्याकुमारी श्रीकरी । भास्कराचार्याप्तशिष्या मौनव्रतरक्षाकरी ॥ १५॥ काव्यनाट्यगानशिल्पचित्रनटनप्रमोदिनी
    । कायक्लेशभयालस्यनिरोधिनी पथदर्शिनी ॥ १६॥ भावपुष्पार्चनप्रीता सुरासुरपरिपालिनी । बाह्यान्तरशुद्धिनिष्ठदेहस्वास्थ्यसंरक्षिणी
    ॥ १७॥ जन्ममृत्युजराजाड्यायातनापरिहारिणी । जीवजीवभेदभावदूरिणी सुममालिनी ॥ १८॥ चतुर्दशभुवनैकाधीश्वरी
    राजेश्वरी । चराचरजगन्नाटकसूत्रधारिणी कलाधरी ॥ १९॥ ज्ञाननिधिः ज्ञानदायी परापराविद्याकरी । ज्ञानविज्ञानानुभूतिकारिणी
    निष्ठाकरी ॥ २०॥ चतुर्वैदज्ञानजननी चतुर्विद्याविनोदिनी । चतुष्षष्ठिकलापूर्णा रसिकसुजनाकर्षिणी ॥ २१॥
    भूम्याकाशवायुरग्निजलेश्वरी माहेश्वरी । भव्यदेवालयप्रतिष्ठितचारुमूर्तिः अभयङ्करी ॥ २२॥ भूतग्रामसृष्टिकर्त्री
    शक्तिज्ञानप्रदायिनी । भोगैश्वर्यदाहहन्त्री नीतिमार्गप्रदर्शिनी ॥ २३॥ दिव्यगात्री दिव्यनेत्री दिव्यचक्षुदा
    शोभना । दिव्यमाल्याम्बरधरी दिव्यगन्धसुलेपना ॥ २४॥ सुवेषालङ्कारप्रीता सुप्रिया प्रभावती । सुमतिदाता
    सुमनत्राता सर्वदा तेजोवती ॥ २५॥ चाक्षुषज्योतिप्रकाशा ओजसज्योतिप्रकाशिनी । भास्वरज्योतिप्रज्ज्वलिनी
    तैजसज्योतिरूपिणी ॥ २६॥ अनुपमानन्दाश्रुकरी अतिलोकसौन्दर्यवती । असीमलावण्यवती निस्सीममहिमावती ॥ २७॥
    तत्त्वाधारा तत्त्वाकारा तत्त्वमयी सद्रूपिणी । तत्त्वासक्ता तत्त्ववेत्ता चिदानन्दस्वरूपिणी ॥ २८॥ आपत्समयसन्त्राता
    आत्मस्थैर्यप्रदायिनी । आत्मज्ञानसम्प्रदाता आत्मबुद्धिप्रचोदिनी ॥ २९॥ जननमरणचक्रनाथा जीवोत्कर्षकारिणी
    । जगद्रूपा जगद्रक्षा जपतपध्यानतोषिणी ॥ ३०॥ पञ्चयज्ञार्चिता वरदा स्वार्थवृक्षकुठारिका । पञ्चकोशान्तर्निकेतना
    पञ्चक्लेशाग्निशामका ॥ ३१॥ त्रिसन्ध्यार्चितगायत्री मानिनी त्रिमलनाशिनी । त्रिवासनारहिता सुमती त्रितनुचेतनकारिणी
    ॥ ३२॥ महावात्सल्यपुष्करिणी शुकपाणी सुभाषिणी । महाप्राज्ञबुधरक्षिणी शुकवाणी सुहासिनी ॥ ३३॥ द्युत्तरशतहोमकुण्डदिव्ययज्ञसुप्रेरका
    । ब्रह्मकुण्डादिसुक्षेत्रपरिवेष्टितपीठिका ॥ ३४॥ द्युत्तरशतलिङ्गान्वितज्येष्ठशैलपुरीश्वरी । द्युत्तरशतदम्पतीजनानुसृता
    निरीश्वरी ॥ ३५॥ त्रितापसन्त्रस्तावनी लताङ्गी तमध्वंसिनी । त्रिजगद्वन्द्यजननी त्रिदोषापहारिणी ॥ ३६॥
    शब्दार्थध्वनितोषिणी काव्यकर्मविनोदिनी । शिष्टप्रिया दुष्टदमनी कष्टनष्टविदूरिणी ॥ ३७॥ जाग्रत्स्वप्नसृष्टिलीलामग्नचित्तज्ञानोदया
    । जन्मरोगवैद्योत्तमा सर्वमतकुलवर्णाश्रया ॥ ३८॥ कामपीडितविष्णुवर्धनमोहाक्रोशिनी विरागिणी । कृपावर्षिणी
    विरजा मोहिनी बालयोगिनी ॥ ३९॥ कवीन्द्रवर्णनावेद्या वर्णनातीतरूपिणी । कमनीया दयाहृदया कर्मफलप्रदायिनी
    ॥ ४०॥ शोकमोहाधीनसाधकवृन्दनित्यपरिरक्षिणी । षोडशोपचारपूज्या ऊर्ध्वलोकसञ्चारिणी ॥ ४१॥ भीतिभ्रान्तिविनिर्मुक्ता
    ध्यानगम्या लोकोत्तरा । ब्रह्मविष्णुशिवस्वरूपसद्गुरुवचनतत्परा ॥ ४२॥ अवस्थात्रयनिजसाक्षिणी सद्योमुक्तिप्रसादिनी
    । अलौकिकमाधुर्ययुतसूक्तिपीयूषवर्षिणी ॥ ४३॥ धर्मनिष्ठा शीलनिष्ठा धर्माचरणतत्परा । दिव्यसङ्कल्पफलदात्री
    धैर्यस्थैर्यरत्नाकरा ॥ ४४॥ पुत्रकामेष्टियागानुग्रहसत्फलरूपिणी । पुत्रमित्रबन्धुमोहदूरिणी मैत्रिमोदिनी
    ॥ ४५॥ चारुमानुषविग्रहरूपधारिणी सुरागिणी । चिन्तामणिगृहवासिनी चिन्ताजाड्यप्रशमनी ॥ ४६॥ जीवकोटिरक्षणपरा
    विद्वज्ज्योतिप्रकाशिनी । जीवभावहरणचतुरा हंसिनी धर्मवादिनी ॥ ४७॥ भक्ष्यभोज्यलेह्यचोष्यनिवेदनसंहर्षिणी
    । भेदरहिता मोदसहिता भवचक्रप्रवर्तिनी ॥ ४८॥ हृदयगुहान्तर्यामिनी सहृदयसुखवर्धिनी । हृदयदौर्बल्यविनाशिनी
    समचित्तप्रसादिनी ॥ ४९॥ दीनाश्रया दीनपूज्या दैन्यभावविवर्जिता । दिव्यसाधनसम्प्राप्तदिव्यशक्तिसमन्विता
    ॥ ५०॥ छलशक्तिदायिनी वन्द्या धीरसाधकोद्धारिणी । छलद्वेषवर्जितात्मा योगिमुनिसंरक्षिणी ॥ ५१॥ ब्रह्मचर्याश्रमपरा
    गृहस्थाश्रममोदिनी । वानप्रस्थाश्रमरक्षिणी सन्न्यासाश्रमपावनी ॥ ५२॥ महातपस्विनी शुभदा महापरिवर्तनाकरा
    । महत्वाकाङ्क्षप्रदात्री महाप्राज्ञाजितामरा ॥ ५३॥ योगाग्निशक्तिसम्भूता शोकशामकचन्द्रिका । योगमाया
    कन्या विनुता ज्ञाननौकाधिनायिका ॥ ५४॥ देवर्षिराजर्षिसेव्या दिविजवृन्दसम्पूजिता । ब्रह्मर्षिमहर्षिगणगम्या
    ध्यानयोगसंहर्षिता ॥ ५५॥ उरगहारस्तुतिप्रसन्ना उरगशयनप्रियभगिनी । उरगेन्द्रवर्णितमहिमा उरगाकारकुण्डलिनी
    ॥ ५६॥ परम्परासम्प्राप्तयोगमार्गसञ्चालिनी । परानादलोला विमला परधर्मभयदूरिणी ॥ ५७॥ पद्मशयनचक्रवर्तिसुतराजराजेन्द्रश्रिता
    । पञ्चबाणचेष्टदमनी पञ्चबाणसतिप्रार्थिता ॥ ५८॥ सौम्यरूपा मधुरवाणी महाराज्ञी निरामयी । सुज्ञानदीपाराधिता
    समाधिदर्शितचिन्मयी ॥ ५९॥ सकलविद्यापारङ्गता अध्यात्मविद्याकोविदा । सर्वकलाध्येयान्विता श्रीविद्याविशारदा
    ॥ ६०॥ ज्ञानदर्पणात्मद्रष्टा कर्मयोगिद्रव्यार्चिता । यज्ञशिष्टाशिनपावनी यज्ञतपोऽनवकुण्ठिता ॥ ६१॥ सृजनात्मकशक्तिमूला
    काव्यवाचनविनोदिनी । रचनात्मकशक्तिदाता भवननिकेतनशोभिनी ॥ ६२॥ ममताहङ्कारपाशविमोचनी धृतिदायिनी । महाजनसमावेष्टितकुसुमश्रेष्ठिहितवादिनी
    ॥ ६३॥ स्वजनानुमोदसहितत्यागक्रान्तियोजनकरी । स्वधर्मनिष्ठासिध्यर्थकृतकर्मशुभङ्करी ॥ ६४॥ कुलबान्धवजनाराध्या
    परन्धामनिवासिनी । कुलपावनकरत्यागयोगदर्शिनी प्रियवादिनी ॥ ६५॥ धर्मजिज्ञासानुमोदिन्यात्मदर्शनभाग्योदया
    । धर्मप्रिया जया विजया कर्मनिरतज्ञानोदया ॥ ६६॥ नित्यानन्दासनासीना शक्तिभक्तिवरदायिनी । निग्रहापरिग्रहशीला
    आत्मनिष्ठाकारिणी ॥ ६७॥ तारतम्यभेदरहिता सत्यसन्धा नित्यव्रता । त्रैलोक्यकुटुम्बमाता सम्यग्दर्शनसंयुता
    ॥ ६८॥ अहिंसाव्रतदीक्षायुता लोककण्टकदैत्यापहा । अल्पज्ञानापायहारिणी अर्थसञ्चयलोभापहा ॥ ६९॥ प्रेमप्रीता
    प्रेमसहिता निष्कामसेवाप्रिया । प्रेमसुधाम्बुधिलीनभक्तचित्तनित्यालया ॥ ७०॥ मोघाशादुःखदायी अमोघज्ञानदायिनी
    । महाजनबुद्दिभेदजनकबोधक्रमवारिणी ॥ ७१॥ सात्त्विकान्तःकरणवासा राजसहृत्क्षोभिणी । तामसजनशिक्षणेष्टा
    गुणातीता गुणशालिनी ॥ ७२॥ गौरवबालिकावृन्दनायिका षोडशकलात्मिका । गुरुशुश्रूषापरायणनित्यध्येया त्रिगुणात्मिका
    ॥ ७३॥ जिज्ञासातिशयज्ञाता अज्ञानतमोनाशिनी । विज्ञानशास्त्रातीता ज्ञातृज्ञेयस्वरूपिणी ॥ ७४॥ सर्वाधिदेवताजननी
    नैष्कर्म्यसिद्धिकारिणी । सर्वाभीष्टदा सुनयनी नैपुण्यवरदायिनी ॥ ७५॥ गुणकर्मविभागानुसारवर्णविधायिनी
    । गुरुकारुण्यप्रहर्षिता नलिनमुखी निरञ्जनी ॥ ७६॥ जातिमतद्वेषदूरा मनुजकुलहितकामिनी । ज्योतिर्मयी जीवदायी
    प्रज्ञाज्योतिस्वरूपिणी ॥ ७७॥ कर्मयोगमर्मवेत्ता भक्तियोगसमुपाश्रिता । ज्ञानयोगप्रीतचित्ता ध्यानयोगसुदर्शिता
    ॥ ७८॥ स्वात्मार्पणसन्तुष्टा शरणभृङ्गसुसेविता । स्वर्णवर्णा सुचरितार्था करणसङ्गत्यागव्रता ॥ ७९॥ आद्यन्तरहिताकारा
    अध्ययनलग्नमानसा । असदृशमहिमोपेता अभयहस्ता मृदुमानसा ॥ ८०॥ उत्तमोत्तमगुणाःपूर्णा उत्सवोल्लासरञ्जनी
    । उदारतनुविच्छिन्नप्रसुप्तसंस्कारतारिणी ॥ ८१॥ गुणग्रहणाभ्यासमूला एकान्तचिन्तनप्रिया । गहनब्रह्मतत्त्वलोला
    एकाकिनी स्तोत्रप्रिया ॥ ८२॥ वसुधाकुटुम्बरक्षिणी सत्यरूपा महामतिः । वर्णशिल्पिनी निर्भवा भुवनमङ्गलाकृतिः
    ॥ ८३॥ शुद्धबुद्दिस्वयंवेद्या शुद्धचित्तसुगोचरा । शुद्धकर्माचरणनिष्ठसुप्रसन्ना बिम्बाधरा ॥ ८४॥ नवग्रहशक्तिदा
    गूढतत्त्वप्रतिपादिनी । नवनवानुभावोदया विश्वज्ञा श
