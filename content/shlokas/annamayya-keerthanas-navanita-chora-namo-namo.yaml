id: annamayya-keerthanas-navanita-chora-namo-namo
category: stotram
name:
  english: Annamayya Keerthanas Navanita Chora Namo Namo
content:
  english: navanitacora namo namo navamahimarnava namo namo || hari narayana keshavacyuta shrikrishna
    narasimha vamana namo namo | murahara padma nabha mukunda govinda naranarayanarupa namo namo || nigamagocara
    vishnu nirajaksha vasudeva nagadhara nandagopa namo namo | trigunatita deva trivikrama dvaraka nagaradhinayaka
    namo namo || vaikuntha rukminivallabha cakradhara nakeshavandita namo namo | shrikaragunanidhi shri
    venkateshvara nakajanananuta namo namo ||
  devanagari: नवनीतचोर नमो नमो नवमहिमार्णव नमो नमो ॥ हरि नारायण केशवाच्युत श्रीकृष्ण नरसिंह वामन नमो नमो
    । मुरहर पद्म नाभ मुकुन्द गोविन्द नरनारायणरूप नमो नमो ॥ निगमगोचर विष्णु नीरजाक्ष वासुदेव नगधर नन्दगोप
    नमो नमो । त्रिगुणातीत देव त्रिविक्रम द्वारक नगराधिनायक नमो नमो ॥ वैकुण्ठ रुक्मिणीवल्लभ चक्रधर नाकेशवन्दित
    नमो नमो । श्रीकरगुणनिधि श्री वेङ्कटेश्वर नाकजनननुत नमो नमो ॥
