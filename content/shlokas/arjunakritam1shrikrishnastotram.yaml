id: arjunakritam1shrikrishnastotram
category: stotram
name:
  english: arjunakritam1shrikrishnastotram
  devanagari: अर्जुनकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: arjunakritam 1 shrikrishnastotram arjuna uvaca | krishna krishna mahabhaga bhaktanamabhayankara
    | tvameko dahyamananamapavargo'si samsriteh || 22|| tvamadyah purushah sakshadishvarah prakriteh parah
    | mayam vyudasya cicchaktya kaivalye sthita atmani || 23|| sa eva jivalokasya mayamohitacetasah |
    vidhatse svena viryena shreyo dharmadilakshanam || 24|| tathayam cavataraste bhuvo bharajihirshaya
    | svanam cananyabhavanamanudhyanaya casakrit || 25|| iti shrimadbhagavatamahapurane prathamaskandhe
    saptamadhyayantargatam arjunakritam shrikrishnastotram samaptam | bhagavatapurana | adhyaya 1
  devanagari: अर्जुनकृतं १ श्रीकृष्णस्तोत्रम् अर्जुन उवाच । कृष्ण कृष्ण महाभाग भक्तानामभयङ्कर । त्वमेको
    दह्यमानानामपवर्गोऽसि संसृतेः ॥ २२॥ त्वमाद्यः पुरुषः साक्षादीश्वरः प्रकृतेः परः । मायां व्युदस्य चिच्छक्त्या
    कैवल्ये स्थित आत्मनि ॥ २३॥ स एव जीवलोकस्य मायामोहितचेतसः । विधत्से स्वेन वीर्येण श्रेयो धर्मादिलक्षणम्
    ॥ २४॥ तथायं चावतारस्ते भुवो भारजिहीर्षया । स्वानां चानन्यभावानामनुध्यानाय चासकृत् ॥ २५॥ इति श्रीमद्भागवतमहापुराणे
    प्रथमस्कन्धे सप्तमाध्यायान्तर्गतं अर्जुनकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १
meaning: {}
