id: brahmadibhihkritamharistotram
category: stotram
name:
  english: brahmadibhihkritamharistotram
  devanagari: ब्रह्मादिभिःकृतंहरिस्तोत्रम्
content:
  english: alam ca'lam hare shantim grihana parameshvara || 43|| asadhyam te na vai kincicchripateh paramatmanah
    | varuno dagdhatam yato jalam nashtam prajayate || 44|| jalahinam jagatsarvam nasham kshanatprayasyati
    | prasida tvam kripasindho nivaraya'stramulbanam || 45|| ujjivaya ca varunam jalahetum suram prabho
    | namaste rudrarupaya sankarshanaya te namah || 46|| mahakalasvarupaya mrityurupaya te namah | sarvasamharakritkrishna
    sadhurupaya te namah || 47|| kshatrantakaya devanam hitaya ca namo namah | satam hitaya ramaya shriharaye
    te namo namah
  devanagari: अलं चाऽलं हरे शान्तिं गृहाण परमेश्वर ॥ ४३॥ असाध्यं ते न वै किञ्चिच्छ्रीपतेः परमात्मनः ।
    वरुणो दग्धतां यातो जलं नष्टं प्रजायते ॥ ४४॥ जलहीनं जगत्सर्वं नाशं क्षणात्प्रयास्यति । प्रसीद त्वं
    कृपासिन्धो निवारयाऽस्त्रमुल्बणम् ॥ ४५॥ उज्जीवय च वरुणं जलहेतुं सुरं प्रभो । नमस्ते रुद्ररूपाय सङ्कर्षणाय
    ते नमः ॥ ४६॥ महाकालस्वरूपाय मृत्युरूपाय ते नमः । सर्वसंहारकृत्कृष्ण साधुरूपाय ते नमः ॥ ४७॥ क्षत्रान्तकाय
    देवानां हिताय च नमो नमः । सतां हिताय रामाय श्रीहरये ते नमो नमः
