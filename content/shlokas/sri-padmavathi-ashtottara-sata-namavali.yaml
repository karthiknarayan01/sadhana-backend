    नमः । ॐ आदिशङ्करपूजितायै नमः । ॐ प्रीतिदायिन्यै नमः । ॐ सौभाग्यप्रदायिन्यै नमः । ॐ महाकीर्तिप्रदायिन्यै
    नमः । । ॐ कृष्णातिप्रियायै नमः । ॐ गन्धर्वशापविमोचकायै नमः । ॐ कृष्णपत्न्यै नमः । ॐ त्रिलोकपूजितायै
    नमः । ॐ जगन्मोहिन्यै नमः । ॐ सुलभायै नमः । ॐ सुशीलायै नमः । ॐ अञ्जनासुतानुग्रहप्रदायिन्यै नमः । ॐ
    भक्त्यात्मनिवासिन्यै नमः । ॐ सन्ध्यावन्दिन्यै नमः । ॐ सर्वलोकमात्रे नमः । ॐ अभिमतदायिन्यै नमः । ॐ
    ललितावधूत्यै नमः । ॐ समस्तशास्त्रविशारदायै नमः । ॐ सुवर्णाभरणधारिण्यै नमः । ॐ इहपरलोकसुखप्रदायिन्यै
    नमः । ॐ करवीरनिवासिन्यै नमः । ॐ नागलोकमणिसहा आकाशसिन्धुकमलेश्वरपूरित रथगमनायै नमः । ॐ श्री श्रीनिवासप्रियायै
    नमः । ॐ चन्द्रमण्डलस्थितायै नमः । । ॐ अलिवेलुमङ्गायै नमः । ॐ दिव्यमङ्गलधारिण्यै नमः । ॐ सुकल्याणपीठस्थायै
    नमः । ॐ कामकवनपुष्पप्रियायै नमः । ॐ कोटिमन्मधरूपिण्यै नमः । ॐ भानुमण्डलरूपिण्यै नमः । ॐ पद्मपादायै
