id: namavali-40
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: mushikavahanashatanamavalih om mushikavahanaya namah | om modakahastaya namah | om camarakarnaya
    namah | om vilambitasutraya namah | om vamanarupaya namah | om maheshvaraputraya namah | om vighnaya
    namah | om vinayakapadaya namah | om devadevasutaya namah | om devaya namah |
  devanagari: मूषिकवाहनशतनामावलिः ॐ मूषिकवाहनाय नमः । ॐ मोदकहस्ताय नमः । ॐ चामरकर्णाय नमः । ॐ विलम्बितसूत्राय
    नमः । ॐ वामनरूपाय नमः । ॐ महेश्वरपुत्राय नमः । ॐ विघ्नाय नमः । ॐ विनायकपादाय नमः । ॐ देवदेवसुताय नमः
    । ॐ देवाय नमः ।
meaning: {}
