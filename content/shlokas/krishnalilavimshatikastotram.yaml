id: krishnalilavimshatikastotram
category: stotram
name:
  english: krishnalilavimshatikastotram
  devanagari: कृष्णलीलाविंशतिकास्तोत्रम्
content:
  english: rinusva durmateh puraiva jatah tava mrityu balakah || 11|| himsatyajamakuru papa dushtah sadivyadehashtabhujabhavani
    | gatasu vindhyacalavasini'bhut || 12|| shrikrishna janmotsavanandagokule babhuva sarvatra samasta
    mandale | tatraiva gopijanagopashankule harshatirekena sugama cakrire || 13|| shridevaki palita garbhamadhye
    yashodaya lalita valyekrode | shriradhika''lingita yauvane'pi gopangananam ramayancakara || 14|| shrikrishna
    candrena supalite vraje gavashca gopashca sada prasannah | sukham sada svanubhavam vikurvan krishnam
    sadavanchitadam prapannah || 15|| karagrihe janma vraje ca vasah gocaranam yati karoti rasah | kamsaya
    loke mahatah sutrasah tatha'pi krishnakurute suhasah || 16|| daityan sada hi prakaroti nashah bhaktaya
    sananda karoti vasah | kalam vinashaya pracanda hasah vanchami mandehi svabhaktidasyah || 17|| madhurya
    rashirasadah sada'si gopisha vishvesha vrajesha krishnah | japami nityam pranamami nityam mamuddhara''shu
    satatam namami || 18|| he krishna mamuddharadinabandho
  devanagari: ृणुस्व दुर्मतेः पुरैव जातः तव मृत्यु बालकः ॥ ११॥ हिंसात्यजमाकुरु पाप दुष्टः सादिव्यदेहाष्टभुजाभवानी
    । गतासु विन्ध्याचलवासिनीऽभूत् ॥ १२॥ श्रीकृष्ण जन्मोत्सवनन्दगोकुले बभूव सर्वत्र समस्त मण्डले । तत्रैव
    गोपीजनगोपशङ्कुले हर्षातिरेकेण सुगाम चक्रिरे ॥ १३॥ श्रीदेवकी पालित गर्भमध्ये यशोदया लालित वाल्येक्रोडे
    । श्रीराधिकाऽऽलिङ्गित यौवनेऽपि गोपाङ्गनानां रमयञ्चकार ॥ १४॥ श्रीकृष्ण चन्द्रेण सुपालिते व्रजे गावश्च
    गोपाश्च सदा प्रसन्नाः । सुखं सदा स्वानुभवं विकुर्वन् कृष्णं सदावाञ्छितदं प्रपन्नाः ॥ १५॥ कारागृहे
    जन्म व्रजे च वासः गोचारणं याति करोति रासः । कंसाय लोके महतः सुत्रासः तथाऽपि कृष्णकुरुते सुहासः ॥ १६॥
    दैत्यान् सदा हि प्रकरोति नाशः भक्ताय सानन्द करोति वासः । कालं विनाशाय प्रचण्ड हासः वाञ्छामि मान्देहि
    स्वभक्तिदास्यः ॥ १७॥ माधुर्य राशीरसदः सदाऽसि गोपीश विश्वेश व्रजेश कृष्णः । जपामि नित्यं प्रणमामि नित्यं
    मामुद्धराऽऽशु सततं नमामि ॥ १८॥ हे कृष्ण मामुद्धरदीनबन्धो
