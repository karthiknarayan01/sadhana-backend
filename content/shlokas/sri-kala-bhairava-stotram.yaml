id: sri-kala-bhairava-stotram
category: stotram
name:
  english: Sri Kala Bhairava Stotram
content:
  english: atha sankalpah om aim shiva shakti sayi siddhaguru shri ramanananda maharshi gurubhyo namah
    om shri dasha mahavidya devatabhyo namah om shri dasha bhairava devatabhyo namah atha caturveda jnana
    brahma siddhaguru shri ramanananda maharshi viracita caturvimshati shlokatmaka shri kala bhairava
    stotram shivaya paramatmane mahate papanashine | nilalohitadehaya bhairavaya namo namah || brahma
    shiro vikhandine brahma garva nipatine | kalakalaya rudraya namobhairava shuline || vishnu moha vinashine
    vishnu sevita shambhave | vishnu kirtita somaya kalabhairava te namah || sarvabhushita sarvesham caturbhujam
    sutejase | shiva tejodbhavam haram shri bhairavipatim bhaje || sadrupam sakaleshvaram cidrrupam cinmayeshvaram
    | tapovantam mahanandam mahabhairava te namah || nilaya nilakanthaya anantaya paratmane | bhimaya
    dushtamardine kalabhairava te namah || namaste sarvabijaya namaste sukhadayine | namaste duhkhanashine
    bhairavaya namo namah || sundaram karunanidhim pavanam karunamayam | aghoram karunasindhum shribhairavam
    namamyaham || jatadharam trilocanam jagat patim vrishadhvajam | jaganmurtim kapalinim shribhairavam
    nammamitam || asitangah kapalashca unmattah bhishano ruruh | krodhah samhara candashca ashtabhairava
    te namah || kaumari vaishnavi candi indrani brahmanisudha | ashtamatrika camunda shri varahi maheshvari
    || kashi kshetra sada sthitam kashi kshetra supalakam | kashi jana samaradhyam namami kalabhairavam
    || ashtabhairava srashtaram ashtamatri supujitam | sarva bhairava natham ca shri kala bhairavam bhaje
    || vishnu kirtita vedesham sarva rishi namaskritam | panca pataka nashakam shri kala bhairavam bhaje
    || sammohana maharupam ceturveda prakirtitam | virat purusha mahesham shri kala bhairavam bhaje ||
    asitangah caturbhujah brahmani matrikapatih | shvetavarno hamsarudhah prak disha rakshakah shivah
    || shrirurum vrishabharudham agneya dik supalakam | nilavarnam mahashuram maheshvaripatim bhaje ||
    mayura vahanah candah kaumari matrika priyah | raktavarno mahakalah dakshina dik surakshakah || garuda
    vahanah krodhah vaishnavi matrika prabhuh | ishano nilavarnashca niruti dik surakshakah || unmattah
    khadgadhari ca ashvarudho mahodarah | shri varahi manoharah pashcima dik surakshakah || kapalo hastivahanah
    indrani matrikapatih | svarna varno mahatejah vayavyadik surakshakah || bhishanah pretavahanah camunda
    matrika vibhuh | uttaradik supalakah raktavarno bhayankarah || samharah simhavahanah shri candi matrikapatih
    | ashabhujah prakrami ishanyadik supalakah || tantra yogishvareshvaram tantra vidya pradayakam | jnanadam
    siddhidam shivam mokshadam bhairavam bhaje || iti caturveda jnana brahma siddhaguru shri ramanananda
    maharshi viracita caturvimshati shlokatmaka shri kala bhairava stotram ||
  devanagari: अथ सङ्कल्पः ॐ ऐं शिव शक्ति सायि सिद्धगुरु श्री रमणानन्द महर्षि गुरुभ्यो नमः ॐ श्री दश महाविद्या
    देवताभ्यो नमः ॐ श्री दश भैरव देवताभ्यो नमः अथ चतुर्वेद ज्ञान ब्रह्म सिद्धगुरु श्री रमणानन्द महर्षि
    विरचित चतुर्विंशति श्लोकात्मक श्री काल भैरव स्तोत्रं शिवाय परमात्मने महाते पापनाशिने । नीललोहितदेहाय
    भैरवाय नमो नमः ॥ ब्रह्म शिरो विखण्डिने ब्रह्म गर्व निपातिने । कालकालाय रुद्राय नमोभैरव शूलिने ॥ विष्णु
    मोह विनाशिने विष्णु सेवित शम्भवे । विष्णु कीर्तित सोमाय कालभैरव ते नमः ॥ सर्वभूषित सर्वेशं चतुर्भुजं
    सुतेजसे । शिव तेजोद्भवं हरं श्री भैरवीपतिं भजे ॥ सद्रूपं सकलेश्वरं चिद्र्रूपं चिन्मयेश्वरम् । तपोवन्तं
    महानन्दं महाभैरव ते नमः ॥ नीलाय नीलकण्ठाय अनन्ताय परात्मने । भीमाय दुष्टमर्दिने कालभैरव ते नमः ॥ नमस्ते
    सर्वबीजाय नमस्ते सुखदायिने । नमस्ते दुःखनाशिने भैरवाय नमो नमः ॥ सुन्दरं करुणानिधिं पावनं करुणामयम्
    । अघोरं करुणासिन्धुं श्रिभैरवं नमाम्यहम् ॥ जटाधरं त्रिलोचनं जगत् पतिं वृषध्वजम् । जगन्मूर्तिं कपालिनिं
    श्रीभैरवं नम्मामितम् ॥ असिताङ्गः कपालश्च उन्मत्तः भीषणो रुरुः । क्रोधः संहार चण्डश्च अष्टभैरव ते नमः
    ॥ कौमारी वैश्णवी चण्डी इन्द्राणी ब्राह्मणीसुधा । अष्टमातृक चामुण्डा श्री वाराही महेश्वरी ॥ काशी क्षेत्र
    सदा स्थितं काशी क्षेत्र सुपालकम् । काशी जन समाराध्यं नमामि कालभैरवम् ॥ अष्टभैरव स्रष्टारं अष्टमातृ
    सुपूजितम् । सर्व भैरव नाथं च श्री काल भैरवं भजे ॥ विष्णु कीर्तित वेदेशं सर्व ऋषि नमस्कृतम् । पञ्च
    पातक नाशकं श्री काल भैरवं भजे ॥ सम्मोहन महारूपं चेतुर्वेद प्रकीर्तितम् । विराट् पुरुष महेशं श्री काल
    भैरवं भजे ॥ असिताङ्गः चतुर्भुजः ब्रह्मणी मतृकापतिः । श्वेतवर्णो हंसारूढः प्राक् दिशा रक्षकः शिवः ॥
    श्रीरुरुं वृषभारूढं आग्नेय दिक् सुपालकम् । नीलवर्णं महाशूरं महेश्वरीपतिं भजे ॥ मयूर वाहनः चण्डः कौमारी
    मातृका प्रियः । रक्तवर्णो महाकालः दक्षिणा दिक् सुरक्षकः ॥ गरुड वाहनः क्रोधः वैष्णवी मातृका प्रभुः
    । ईशानो नीलवर्णश्च निरुती दिक् सुरक्षकः ॥ उन्मत्तः खड्गधारी च अश्वारूढो महोदरः । श्री वाराही मनोहरः
    पश्चिम दिक् सुरक्षकः ॥ कपालो हस्तिवाहनः इन्द्राणी मातृकापतिः । स्वर्ण वर्णो महातेजाः वायव्यदिक् सुरक्षकः
    ॥ भीषणः प्रेतवाहनः चामुण्डा मातृका विभुः । उत्तरदिक् सुपालकः रक्तवर्णो भयङ्करः ॥ संहारः सिंहवाहनः
    श्री चण्डी मातृकापतिः । अशभुजः प्राक्रमी ईशान्यदिक् सुपालकः ॥ तन्त्र योगीश्वरेश्वरं तन्त्र विद्या
    प्रदायकम् । ज्ञानदं सिद्धिदं शिवं मोक्षदं भैरवं भजे ॥ इति चतुर्वेद ज्ञान ब्रह्म सिद्धगुरु श्री रमणानन्द
    महर्षि विरचित चतुर्विंशति श्लोकात्मक श्री काल भैरव स्तोत्रम् ॥
