id: dakaradi-durga-ashtottara-sata-namavali
category: stotram
name:
  english: Dakaradi Durga Ashtottara Sata Namavali
content:
  english: om durgayai namah om durgati harayai namah om durgacala nivasinyai namah om durgamarganu sancarayai
    namah om durgamarganivasinyai na namah om durgamargapravishtayai namah om durgamargapravesinyai namah
    om durgamargakritavasayai om durgamargajayapriyayai om durgamargagrihitarcayai || || om durgamargasthitatmikayai
    namah om durgamargastutiparayai om durgamargasmritiparayai om durgamargasadasthapyai om durgamargaratipriyayai
    om durgamargasthalasthanayai namah om durgamargavilasinyai om durgamardatyaktastrayai om durgamargapravartinyai
    namah om durgasuranihantryai namah || || om durgasuranishudinyai namah om durgasura harayai namah
    om dutyai namah om durgasuravadhonmattayai namah om durgasuravadhotsukayai namah om durgasuravadhotsahayai
    namah om durgasuravadhodyatayai namah om durgasuravadhapreshyase namah om durgasuramukhantakrite namah
    om durgasuradhvamsatoshayai || || om durgadanavadarinyai namah om durgavidravana kartyai namah om
    durgavidravinyai namah om durgavikshobhana kartyai namah om durgashirshanikruntinyai namah om durgavidhvamsana
    kartyai namah om durgadaityanikrintinyai namah om durgadaityapranaharayai namah om durgadhaityantakarinyai
    namah om durgadaityaharatratyai namah || || om durgadaityashrigunmadayai om durga daityashanakaryai
    namah om durga carmambaravritayai namah om durgayuddhavisharadayai namah om durgayuddotsavakartyai
    namah om durgayuddasavaratayai namah om durgayuddavimardinyai namah om durgayuddattahasinyai namah
    om durgayuddhahasyara tayai namah om durgayuddhamahamattaye namah || || om durgayuddotsavotsahayai
    namah om durgadeshanishenyai namah om durgadeshavasaratayai namah om durga deshavilasinyai namah om
    durgadesharcanaratayai namah om durgadeshajanapriyayai namah om durgamasthanasamsthanayai namah om
    durgamathyanusadhanayai namah om durgamayai namah om durgasadayai namah || || om duhkhahantryai namah
    om duhkhahinayai namah om dinabandhave namah om dinamatre namah om dinasevyayai namah om dinasiddhayai
    namah om dinasadhyayai namah om dinavatsalayai namah om devakanyayai namah om devamanyayai namah ||
    || om devasiddayai namah om devapujyayai namah om devavanditayai namah om devyai namah om devadhanyayai
    namah om devaramyayai namah om devakamayai namah om devadevapriyayai namah om devadanavavanditayai
    namah om devadevavilasinyai namah || || om devadevarcana priyayai namah om devadevasukhapradhayai
    namah om devadevagatatmi kayai namah om devatatanave namah om dayasindhave namah om dayambudhayai
    namah om dayasagarayai namah om dayayai namah om dayalave namah om dayashilayai namah || || om dayardhrahridayayai
    namah om devamatre namah om dhirghangayai namah om durgayai namah om darunayai namah om dirgacakshushè
    namah om dirgalocanayai namah om dirganetrayai namah om dirgabahave namah om dayasagaramadhyastayai
    namah || || om dayashrayayai namah om dayambhunighayai namah om dasharadhi priyayai namah om dashabhujayai
    namah om digambaravilasinyai namah om durgamayai namah om devasamayuktayai namah om duritapaharinyai
    namah || || iti shri dakaradi durga ashtottara shatanamavalih sampurnam
  devanagari: ॐ दुर्गायै नमः ॐ दुर्गति हरायै नमः ॐ दुर्गाचल निवासिन्यै नमः ॐ दुर्गामार्गानु सञ्चारायै
    नमः ॐ दुर्गामार्गानिवासिन्यै न नमः ॐ दुर्गमार्गप्रविष्टायै नमः ॐ दुर्गमार्गप्रवेसिन्यै नमः ॐ दुर्गमार्गकृतावासायै
    ॐ दुर्गमार्गजयप्रियायै ॐ दुर्गमार्गगृहीतार्चायै ॥ ॥ ॐ दुर्गमार्गस्थितात्मिकायै नमः ॐ दुर्गमार्गस्तुतिपरायै
    ॐ दुर्गमार्गस्मृतिपरायै ॐ दुर्गमार्गसदास्थाप्यै ॐ दुर्गमार्गरतिप्रियायै ॐ दुर्गमार्गस्थलस्थानायै नमः
    ॐ दुर्गमार्गविलासिन्यै ॐ दुर्गमार्दत्यक्तास्त्रायै ॐ दुर्गमार्गप्रवर्तिन्यै नमः ॐ दुर्गासुरनिहन्त्र्यै
    नमः ॥ ॥ ॐ दुर्गासुरनिषूदिन्यै नमः ॐ दुर्गासुर हरायै नमः ॐ दूत्यै नमः ॐ दुर्गासुरवधोन्मत्तायै नमः ॐ
    दुर्गासुरवधोत्सुकायै नमः ॐ दुर्गासुरवधोत्साहायै नमः ॐ दुर्गासुरवधोद्यतायै नमः ॐ दुर्गासुरवधप्रेष्यसे
    नमः ॐ दुर्गासुरमुखान्तकृते नमः ॐ दुर्गासुरध्वंसतोषायै ॥ ॥ ॐ दुर्गदानवदारिन्यै नमः ॐ दुर्गाविद्रावण
    कर्त्यै नमः ॐ दुर्गाविद्राविन्यै नमः ॐ दुर्गाविक्षोभन कर्त्यै नमः ॐ दुर्गशीर्षनिक्रुन्तिन्यै नमः ॐ
    दुर्गविध्वंसन कर्त्यै नमः ॐ दुर्गदैत्यनिकृन्तिन्यै नमः ॐ दुर्गदैत्यप्राणहरायै नमः ॐ दुर्गधैत्यान्तकारिन्यै
    नमः ॐ दुर्गदैत्यहरत्रात्यै नमः ॥ ॥ ॐ दुर्गदैत्याशृगुन्मदायै ॐ दुर्ग दैत्याशनकर्यै नमः ॐ दुर्ग चर्माम्बरावृतायै
    नमः ॐ दुर्गयुद्धविशारदायै नमः ॐ दुर्गयुद्दोत्सवकर्त्यै नमः ॐ दुर्गयुद्दासवरतायै नमः ॐ दुर्गयुद्दविमर्दिन्यै
    नमः ॐ दुर्गयुद्दाट्टहासिन्यै नमः ॐ दुर्गयुद्धहास्यार तायै नमः ॐ दुर्गयुद्धमहामात्ताये नमः ॥ ॥ ॐ दुर्गयुद्दोत्सवोत्सहायै
    नमः ॐ दुर्गदेशनिषेन्यै नमः ॐ दुर्गदेशवासरतायै नमः ॐ दुर्ग देशविलासिन्यै नमः ॐ दुर्गदेशार्चनरतायै नमः
    ॐ दुर्गदेशजनप्रियायै नमः ॐ दुर्गमस्थानसंस्थानायै नमः ॐ दुर्गमथ्यानुसाधनायै नमः ॐ दुर्गमायै नमः ॐ दुर्गासदायै
    नमः ॥ ॥ ॐ दुःखहन्त्र्यै नमः ॐ दुःखहीनायै नमः ॐ दीनबन्धवे नमः ॐ दीनमात्रे नमः ॐ दीनसेव्यायै नमः ॐ दीनसिद्धायै
    नमः ॐ दीनसाध्यायै नमः ॐ दीनवत्सलायै नमः ॐ देवकन्यायै नमः ॐ देवमान्यायै नमः ॥ ॥ ॐ देवसिद्दायै नमः ॐ
    देवपूज्यायै नमः ॐ देववन्दितायै नमः ॐ देव्यै नमः ॐ देवधन्यायै नमः ॐ देवरम्यायै नमः ॐ देवकामायै नमः
    ॐ देवदेवप्रियायै नमः ॐ देवदानववन्दितायै नमः ॐ देवदेवविलासिन्यै नमः ॥ ॥ ॐ देवादेवार्चन प्रियायै नमः
    ॐ देवदेवसुखप्रधायै नमः ॐ देवदेवगतात्मि कायै नमः ॐ देवतातनवे नमः ॐ दयासिन्धवे नमः ॐ दयाम्बुधायै नमः
    ॐ दयासागरायै नमः ॐ दयायै नमः ॐ दयालवे नमः ॐ दयाशीलायै नमः ॥ ॥ ॐ दयार्ध्रहृदयायै नमः ॐ देवमात्रे नमः
    ॐ धीर्घाङ्गायै नमः ॐ दुर्गायै नमः ॐ दारुणायै नमः ॐ दीर्गचक्षुषॆ नमः ॐ दीर्गलोचनायै नमः ॐ दीर्गनेत्रायै
    नमः ॐ दीर्गबाहवे नमः ॐ दयासागरमध्यस्तायै नमः ॥ ॥ ॐ दयाश्रयायै नमः ॐ दयाम्भुनिघायै नमः ॐ दाशरधी प्रियायै
    नमः ॐ दशभुजायै नमः ॐ दिगम्बरविलासिन्यै नमः ॐ दुर्गमायै नमः ॐ देवसमायुक्तायै नमः ॐ दुरितापहरिन्यै नमः
    ॥ ॥ इति श्री दकारदि दुर्गा अष्टोत्तर शतनामावलिः सम्पूर्णं
