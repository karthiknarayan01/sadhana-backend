id: dharmarajakritampurushottamastotram-02
category: stotram
name:
  english: dharmarajakritampurushottamastotram 02
  devanagari: धर्मराजकृतंपुरुषोत्तमस्तोत्रम् ०२
content:
  english: dharmarajakritam purushottamastotram 2 dharmaraja uvaca | namaste bhagavandeva lokanatha jagatpate
    | kshirodavasinam devam sheshabhoganushayinam || 60|| varam varenyam varadam kartaramakritam prabhum
    | vishveshvaramajam vishnum sarvajnamaparajitam || 61|| nilotpaladalashyamam pundarikanibhekshanam
    | sarvajnam nirgunam shantam jagaddhataramavyayam || 62|| sarvalokavidhataram sarvalokasukhavaham
    | puranam vurusham vedyam vyaktavyaktam sanatanam || 63|| paravaranam srashtaram lokanatham jagadgurum
    | shrivatsoraskasamyuktam vanamalavibhushitam || 64|| pitavastram caturbahum shankhacakragadadharam
    | harakeyurasamyuktam mukutangadadharinam || 65|| sarvalakshanasampurnam sarvendriyavivarjitam | kutastamacalam
    sukshmam jyotirupam sanatanam || 66|| bhavabhavavinirmuktam vyapinam prakriteh param | namasyami jagannathamishvaram
    sukhadam prabhum || 67|| iti brahmapurane pancashititamadhyayantargatam dharmarajakritam purushottamastotram
    samaptam | brahmapurana | adhyaya 45
  devanagari: धर्मराजकृतं पुरुषोत्तमस्तोत्रम् २ धर्मराज उवाच । नमस्ते भगवन्देव लोकनाथ जगत्पते । क्षीरोदवासिनं
    देवं शेषभोगानुशायिनम् ॥ ६०॥ वरं वरेण्यं वरदं कर्तारमकृतं प्रभुम् । विश्वेश्वरमजं विष्णुं सर्वज्ञमपराजितम्
    ॥ ६१॥ नीलोत्पलदलश्यामं पुण्डरीकनिभेक्षणम् । सर्वज्ञं निर्गुणं शान्तं जगद्धातारमव्ययम् ॥ ६२॥ सर्वलोकविधातारं
    सर्वलोकसुखावहम् । पुराणं वुरुषं वेद्यं व्यक्ताव्यक्तं सनातनम् ॥ ६३॥ परावराणां स्रष्टारं लोकनाथं जगद्गुरुम्
    । श्रीवत्सोरस्कसंयुक्तं वनमालाविभूषितम् ॥ ६४॥ पीतवस्त्रं चतुर्बाहुं शङ्खचक्रगदाधरम् । हारकेयूरसंयुक्तं
    मुकुटाङ्गदधारिणम् ॥ ६५॥ सर्वलक्षणसम्पूर्णं सर्वेन्द्रियविवर्जितम् । कूटस्तमचलं सूक्ष्मं ज्योतीरूपं
    सनातनम् ॥ ६६॥ भावाभावविनिर्मुक्तं व्यापिनं प्रकृतेः परम् । नमस्यामि जगन्नाथमीश्वरं सुखदं प्रभुम् ॥
    ६७॥ इति ब्रह्मपुराणे पञ्चाशीतितमाध्यायान्तर्गतं धर्मराजकृतं पुरुषोत्तमस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय ४५
meaning: {}
