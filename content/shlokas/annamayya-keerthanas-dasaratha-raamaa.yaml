id: annamayya-keerthanas-dasaratha-raamaa
category: stotram
name:
  english: Annamayya Keerthanas Dasaratha Raamaa
content:
  english: rama dasharatharama nija satya kama namo namo kakutthsarama || karunanidhi rama kausalyanandana
    rama parama purusha sitapatirama | sharadhi bandhana rama savana rakshaka rama gurutara ravivamsha
    kodanda rama || danujaharana rama dasharathasuta rama vinutamara stotra vijayarama | manujavatara
    rama mahaniya gunarama anilajapriya rama ayodhyarama || sulalitayasha rama sugriva varada rama kalusha
    ravana bhayankara rama | vilasita raghurama vedagocara rama kalita pratapa shrivenkatagiri rama ||
  devanagari: राम दशरथराम निज सत्य काम नमो नमो काकुत्थ्सराम ॥ करुणानिधि राम कौसल्यानन्दन राम परम पुरुष
    सीतापतिराम । शरधि बन्धन राम सवन रक्षक राम गुरुतर रविवंश कोदण्ड राम ॥ दनुजहरण राम दशरथसुत राम विनुतामर
    स्तोत्र विजयराम । मनुजावतारा राम महनीय गुणराम अनिलजप्रिय राम अयोध्यराम ॥ सुललितयश राम सुग्रीव वरद
    राम कलुष रावण भयङ्कर राम । विलसित रघुराम वेदगोचर राम कलित प्रताप श्रीवेङ्कटगिरि राम ॥
