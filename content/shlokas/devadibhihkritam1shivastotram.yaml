id: devadibhihkritam1shivastotram
category: stotram
name:
  english: devadibhihkritam1shivastotram
  devanagari: देवादिभिःकृतं१शिवस्तोत्रम्
content:
  english: namaste paramatman anantayone lokasakshin parameshthin bhagavan sarvajna kshetrajna paravarajna
    jnanajneya sarveshvara mahavirinca mahavibhute mahakshetrajna mahapurusha sarvabhutavasa manonivasa
    adideva mahadeva sadashiva ishana durvijneya duraradhya mahabhuteshvara parameshvara mahayogeshvara
    tryambaka mahayogin parabrahman paramajyotih brahmaviduttama onkara vashatkara svahakara svadhakara
    paramakarana sarvagata sarvadarshin sarvashakte sarvadeva aja sahasrarcih prisharcih sudhaman haradhama
    anantadhama samvarta sankarshana vadavanala agnishtomatmaka pavitra mahapavitra mahamegha mahamayadhara
    mahakama kamahan hamsa paramahamsa maharajika maheshvara mahakamuka mahahamsa bhavakshayakara surasiddharcita
    hiranyavaha hiranyaretah hiranyanabha hiranyagrakesha munjakeshin sarvalokavaraprada sarvanugrahakara
    kamaleshaya kusheshaya hridayeshaya jnanodadhe shambho vibho mahayajna mahayajnika sarvayajnamaya
    sarvayajnahridaya sarvayajnasamstuta nirashraya samudreshaya atrisambhava bhaktanukampin abhagnayoga
    yogadhara vasukimahamani vidyotitavigraha haritanayana trilocana jatadhara nilakantha candrardhadhara
    umasharirardhahara gajacarmadhara dustarasamsaramahasamharakara prasida bhaktajanavatsala evam stuto
    devaganaih subhaktya sabrahmamukhyaishca pitamahena | tyaktva tada hastirupam mahatma linge tada sannidhanam
    cakara || 36|| iti vamanapurane catushcatvarimshadhyayantargatam devadibhih kritam shivastotram samaptam
    | vamanapurana | adhyaya 44
  devanagari: नमस्ते परमात्मन् अनन्तयोने लोकसाक्षिन् परमेष्ठिन् भगवन् सर्वज्ञ क्षेत्रज्ञ परावरज्ञ ज्ञानज्ञेय
    सर्वेश्वर महाविरिञ्च महाविभूते महाक्षेत्रज्ञ महापुरुष सर्वभूतावास मनोनिवास आदिदेव महादेव सदाशिव ईशान
    दुर्विज्ञेय दुराराध्य महाभूतेश्वर परमेश्वर महायोगेश्वर त्र्यम्बक महायोगिन् परब्रह्मन् परमज्योतिः ब्रह्मविदुत्तम
    ओङ्कार वषट्कार स्वाहाकार स्वधाकार परमकारण सर्वगत सर्वदर्शिन् सर्वशक्ते सर्वदेव अज सहस्रार्चिः पृषार्चिः
    सुधामन् हरधाम अनन्तधाम संवर्त सङ्कर्षण वडवानल अग्नीष्टोमात्मक पवित्र महापवित्र महामेघ महामायाधर महाकाम
    कामहन् हंस परमहंस महाराजिक महेश्वर महाकामुक महाहंस भवक्षयकर सुरसिद्धार्चित हिरण्यवाह हिरण्यरेतः हिरण्यनाभ
    हिरण्याग्रकेश मुञ्जकेशिन् सर्वलोकवरप्रद सर्वानुग्रहकर कमलेशय कुशेशय हृदयेशय ज्ञानोदधे शम्भो विभो महायज्ञ
    महायाज्ञिक सर्वयज्ञमय सर्वयज्ञहृदय सर्वयज्ञसंस्तुत निराश्रय समुद्रेशय अत्रिसम्भव भक्तानुकम्पिन् अभग्नयोग
    योगधर वासुकिमहामणि विद्योतितविग्रह हरितनयन त्रिलोचन जटाधर नीलकण्ठ चन्द्रार्धधर उमाशरीरार्धहर गजचर्मधर
    दुस्तरसंसारमहासंहारकर प्रसीद भक्तजनवत्सल एवं स्तुतो देवगणैः सुभक्त्या सब्रह्ममुख्यैश्च पितामहेन ।
    त्यक्त्वा तदा हस्तिरूपं महात्मा लिङ्गे तदा सन्निधानं चकार ॥ ३६॥ इति वामनपुराणे चतुश्चत्वारिंशाध्यायान्तर्गतं
    देवादिभिः कृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ४४
