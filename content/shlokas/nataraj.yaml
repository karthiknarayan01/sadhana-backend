id: nataraj
category: stotram
name:
  english: nataraj
  devanagari: नतरज्
content:
  english: acintyamalivrinda ruci bandhuragalam kurita kunda nikuramba dhavalam mukunda sura vrinda bala
    hantri krita vandana lasantamahikundala dharam | akampamanukampita ratim sujana mangalanidhim gajaharam
    pashupatim dhananjaya nutam pranata ranjanaparam para cidambara natam hridi bhaja || 6||
  devanagari: अचिन्त्यमलिवृन्द रुचि बन्धुरगलं कुरित कुन्द निकुरम्ब धवलम् मुकुन्द सुर वृन्द बल हन्तृ कृत
    वन्दन लसन्तमहिकुण्डल धरम् । अकम्पमनुकम्पित रतिं सुजन मङ्गलनिधिं गजहरं पशुपतिम् धनञ्जय नुतं प्रणत रञ्जनपरं
    पर चिदम्बर नटं हृदि भज ॥ ६॥
meaning: {}
