id: r-09
category: sukta
name:
  english: r 09
  devanagari: र् ०९
content:
  english: 12 a̱ya ru̱ca hari̭nya puna̱no vishva̱ dvesha̭msi tarati sva̱yugva̭bhi̱h suro̱ na sva̱yugva̭bhih
    | dhara̭ su̱tasya̭ rocate puna̱no a̭ru̱sho hari̭h | vishva̱ yadru̱pa pa̭ri̱yatyrikva̭bhih sa̱ptasyḙbhi̱rrikva̭bhih
    || 9
  devanagari: १२ अ॒या रु॒चा हरि॑ण्या पुना॒नो विश्वा॒ द्वेषां॑सि तरति स्व॒युग्व॑भिः॒ सूरो॒ न स्व॒युग्व॑भिः
    । धारा॑ सु॒तस्य॑ रोचते पुना॒नो अ॑रु॒षो हरिः॑ । विश्वा॒ यद्रू॒पा प॑रि॒यात्यृक्व॑भिः स॒प्तास्ये॑भि॒रृक्व॑भिः
    ॥ ९
meaning: {}
