id: rukminisahasranamastotram-2
category: sahasranama
name:
  english: rukminisahasranamastotram
  devanagari: रुक्मिणीसहस्रनामस्तोत्रम्
content:
  english: kshi sahasravadana sudha || 64|| suvarnavarna hemadhya sahasrakatishobhita | sahasranasika
    padma padmalayavilasini || 65|| adityantargata jyotiratibuddhirjitendriya | aniyasi sthularupa sadasadgranthini
    patuh || 66|| dhanurdhara mahashaktih shreyasamapi shreyasi | gariyasi vakyabhangi samvidagnirananyabhak
    || 67|| purani nidhana vela'pratarkya tasthusham patih | prayata niyata shreya jnatrijeyasvarupini
    || 68|| bhairavi kalika shanta candrabhaga marudvati | tamravarni sudurmarshi brihati pushkaralaya
    || 69|| rigyajuhsamaga sama mrityusamsaranashini | vihangama kamagama yatayataparayana || 70|| chandogatra
    ca shakunih janabhushanabhushita | dharmarthakamatattvajna kshetrakshetranivasini || 71|| sankhyatmika'nantarupa
    mayavadanirashini | vibhava bhavahantri ca candika madhughatini || 72|| agnirupa vayurupa nakshatradhinivasini
    | ritumasakara kaukshih sarvadharmaparayana || 73|| rukmakeshi rukmabhushi vaidarbhi rukmayanuja |
    krishnasyagamanakankshi krishnacintanakarini || 74|| vishvadarshi parandhamni manujakritirakritih
    | shailaputri maharatrih shankhacudanishudana || 75|| candraghanta mahaghanta kushmanda pancamiti
    ca | katyayani skandamata mahagauriti siddhivid || 76|| kalaratrishca capala navadurga ca ranjini
    | ashubhaharana candi vishama durgama tatha || 77|| aindri gajasamarudha ishvari vrishavahana | brahmi
    hamsasamarudha sarvapattivinashini || 78|| shankhini cakrini ghora musalayudhadharini | gadini halini
    shaktih khetaki tomari tatha || 79|| pashahasta parashudhara trishulavaradharini | kuntayudha sharngadhara
    khadgacarmadhara vara || 80|| mudgaladharaka dhara banapattishadharaka | daityanashakara bhaktapalaka'bhayavahini
    || 81|| maharaudra mahotsaha mahaghoratama''krama | daruni hyagnidaivatya shatrunam bhayavardhini
    || 82|| mrigavahini tatha vahi brahmani raudrini tatha | camunda cogradashana shivavahini vahini ||
    83|| ajita vijaya citra maladhari shikhandini | payasvini trinetra ca bhrukutitatavasini || 84|| vyavasthita
    madhyaghanta yamaghanta tarasvini | sugandha kalika dvaravasini carcika kala || 85|| kalamrita mahaghanta
    kamakshi sarvamangala | nilagriva bhadrakali kapila kapilapriya || 86|| vajrini dandadhari ca medini
    kalini tatha | shuleshvari sulalita kamini kamanashini || 87|| mohini moharupa ca mohanasha ca kamaha
    | vindhyadrivasini vindhya meghavahini vahaka || 88|| padmavati padmakesha padmamudra padambuja |
    mahabala mahavirya patalatalavasini || 89|| keshini bhimadamshtra ca kauberi kurupalini | jvalamukhi
    jvalamala chatrini chatravahini || 90|| bhurlokanandadatri ca rigmurtih mantrayantrini | savarnatanaya
    dhara mahamari tapasvini || 91|| sa yoganidra vipula svanabhikamalodbhava | svaha svadha vashatkara
    hyardhamatratmika tatha || 92|| prakritistu gunadhara maharatrih sudaruna | shrihrisvarupa buddhishca
    bodhalakshanalakshita || 93|| parameshvari ca parama lokanidranukarini | tamasi tamasakara bodhini
    bodhika'mala || 94|| surasuranuta'shesha dharmanyayaparayana | vishnupadabjasambhuta sandhya savitrika
    sthitih || 95|| sadasamhritirupasya manurupa manobhava | bhavarogahara devi samutpatyartinashini ||
    96|| rogapaha''rogyarupa jagadrupa jagatpatih | jaganmaya jagaddhatri kalpanta'sheshabhagini || 97||
    sanmanita sattahasa cancala vasuda'cala | jayeti vijaya caiva sakala shabdika'mala || 98|| manohara
    haladhara dharanidharaputrika | satya'jita jitakrodha varanasi manobhava || 99|| madani manmathi mari
    manini madanantaki | shastrastravipula ghora vyaptalokatrayatmika || 100|| sannaddha'surasainyanta
    sadasadrupini tatha | vishalanetra bhrukutikutilananaranjita || 101|| mahishasurahantri ca cakshurupa
    mahodadhih | digambara dishamala mallamardanakarini || 102|| vishnumaya mahavidya mahalakshmirjaganmaya
    | shubha shanta siddhasiddha siddhida ca sarasvati || 103|| prabha jyotsna mahakantih kshama sharva
    ca mangala | hingula ca tatha padma danta lakshmirharipriya || 104|| sunanda nandini nanda tripurasuramardini
    | vedamata yajnavidya prasiddha ca sudha dhritih || 105|| siddhavidya ca prithivi mridani vindhyavasini
    | puruhutapriya kali padmi naradasevita || 106|| jvalamukhi jvalamala kumuda''nandavasini | prahladini
    mahadurga durga durgartinashini || 107|| durgama durlabha bharga svarga tripuravasini | shambhavi
    shantashanta ca madira mriduhasini || 108|| mahanidra yoganidra bhavani bhavaharini | kuleshvari mahamari
    prajna tara kaleshvari || 109|| onkara prithivikara cetana kopanakritih | kalavati kalakara bindumatra
    jayakritih || 110|| padmasana kundala ca buddhamata janeshvari | janamata sharada ca jitendra hamsavahini
    || 111|| sudhatmika rajavandya vibhutistarini shiva | sadgatih satpara bhuta sindhura'suramardini
    || 112|| mandakini vipasha ca sarayu sharahrittatha | kaushiki gandaki caiva satya sadhvi pativrata
    || 113|| sushroni rajanirupa bhaga ca bhagamalini | pataka ca pratapa ca senashrenih suyuddhada ||
    114|| suvyuha kankshini kanksha dayakara patakini | kala kanta para tara trishaktih shaktimalini ||
    115|| icchadhenuh kamadhenuh pavani pavanashani | mokshada mokshakama ca kripala candavikrama || 116||
    gauri gaura suvarna ca jagatsamharakarini | mahabhujaika'neka ca bhujagoragabhushana || 117|| cakrabhedi
    cakraghati bhedini shyamala tatha | susmita smitalakshya ca sumukhi sukhini tatha || 118|| krisha
    ca bahuvarna ca bahvi ca bahuhasini | raktambara raktamala nanapushpavirajita || 119|| tulasi tulasipatrapriya
    krishnativallabha | saptachandomayadevi bhimaki bhimakakritih || 120|| kalakashtha ca gayatri brihati
    panktireva ca | suvarnarashana kanta venibhushanabhushita || 121|| gandaki gandhavasa ca katibhushanabhushita
    | pitambaradhara gauri vikhyata ca payasvini || 122|| kunkumagarushobhadhya dvarakavasini tatha |
    padmayonirbahmayonih sugandha candanapriya || 123|| tripushkara'prameya ca kashika mathura tatha |
    avantika kushavarta nanatirthasvarupini || 124|| brahmandanayika'varna ratirmatangagamini | so'hamrupa
    hamsagatirjvalini jvaladayini || 125|| lekhya bhimarathi caiva candrabhaga ca mundaka | purna kumbhadhara
    bhima divya tripurabhairavi || 126|| karala vikarala ca ghora ghurghuranadini | urdhvakeshi raktadanta
    triveni venika tatha || 127|| karpuramodika''moda jayashrirjayamangala | jayada jayavishrama jayajaya
    sarvamangala || 128||
  devanagari: क्षी सहस्रवदना सुधा ॥ ६४॥ सुवर्णवर्णा हेमाढ्या सहस्रकटिशोभिता । सहस्रनासिका पद्मा पद्मालयविलासिनी
    ॥ ६५॥ आदित्यान्तर्गता ज्योतिरतिबुद्धिर्जितेन्द्रिया । अणीयसी स्थूलरूपा सदसद्ग्रन्थिनी पटुः ॥ ६६॥ धनुर्धरा
    महाशक्तिः श्रेयसामपि श्रेयसी । गरीयसी वाक्यभङ्गी संविदग्निरनन्यभाक् ॥ ६७॥ पुराणी निधना वेलाऽप्रतर्क्या
    तस्थुषां पतिः । प्रयता नियता श्रेया ज्ञातृजेयस्वरूपिणी ॥ ६८॥ भैरवी कालिका शान्ता चन्द्रभागा मरुद्वती
    । ताम्रवर्णी सुदुर्मर्षी बृहती पुष्करालया ॥ ६९॥ ऋग्यजुःसामगा सामा मृत्युसंसारनाशिनी । विहङ्गमा कामगमा
    यातायातपरायणा ॥ ७०॥ छन्दोगात्रा च शकुनिः जनभूषणभूषिता । धर्मार्थकामतत्त्वज्ञा क्षेत्रक्षेत्रनिवासिनी
    ॥ ७१॥ साङ्ख्यात्मिकाऽनन्तरूपा मायावादनिराशिनी । विभवा भवहन्त्री च चण्डिका मधुघातिनी ॥ ७२॥ अग्निरूपा
    वायुरूपा नक्षत्राधिनिवासिनी । ऋतुमासकरा कौक्षीः सर्वधर्मपरायणा ॥ ७३॥ रुक्मकेशी रुक्मभूषी वैदर्भी रुक्मयानुजा
    । कृष्णस्यागमनाकाङ्क्षी कृष्णचिन्तनकारिणी ॥ ७४॥ विश्वदर्शी परन्धाम्नी मनुजाकृतिराकृतिः । शैलपुत्री
    महारात्रिः शङ्खचूडनिषूदना ॥ ७५॥ चन्द्रघण्टा महाघण्टा कूष्माण्डा पञ्चमीति च । कात्यायनी स्कन्दमाता
    महागौरीति सिद्धिविद् ॥ ७६॥ कालरात्रिश्च चपला नवदुर्गा च रञ्जिनी । अशुभहरणा चण्डी विषमा दुर्गमा तथा
    ॥ ७७॥ ऐन्द्री गजसमारूढा ईश्वरी वृषवाहना । ब्राह्मी हंससमारूढा सर्वापत्तिविनाशिनी ॥ ७८॥ शङ्खिनी चक्रिणी
    घोरा मुसलायुधधारिणी । गदिनी हलिनी शक्तिः खेटकी तोमरी तथा ॥ ७९॥ पाशहस्ता परशुधरा त्रिशूलवरधारिणी ।
    कुन्तायुधा शार्ङ्गधरा खड्गचर्मधरा वरा ॥ ८०॥ मुद्गलाधारका धारा बाणपट्टिशधारका । दैत्यनाशकरा भक्तपालकाऽभयवाहिनी
    ॥ ८१॥ महारौद्रा महोत्साहा महाघोरतमाऽऽक्रमा । दारुणी ह्यग्निदैवत्या शत्रूणां भयवर्धिनी ॥ ८२॥ मृगवाहिनी
    तथा वाही ब्रह्माणी रौद्रिणी तथा । चामुण्डा चोग्रदशना शिववाहिनी वाहिनी ॥ ८३॥ अजिता विजया चित्रा मालाधारी
    शिखण्डिनी । पयस्विनी त्रिनेत्रा च भ्रुकुटीतटवासिनी ॥ ८४॥ व्यवस्थिता मध्यघण्टा यमघण्टा तरस्विनी । सुगन्धा
    कालिका द्वारावासिनी चर्चिका कला ॥ ८५॥ कलामृता महाघण्टा कामाक्षी सर्वमङ्गला । नीलग्रीवा भद्रकाली कपिला
    कपिलप्रिया ॥ ८६॥ वज्रिणी दण्डधारी च मेदिनी कलिनी तथा । शूलेश्वरी सुललिता कामिनी कामनाशिनी ॥ ८७॥ मोहिनी
    मोहरूपा च मोहनाशा च कामहा । विन्ध्याद्रिवासिनी विन्ध्या मेघवाहिनी वाहका ॥ ८८॥ पद्मावती पद्मकेशा पद्ममुद्रा
    पदाम्बुजा । महाबला महावीर्या पातालतलवासिनी ॥ ८९॥ केशिनी भीमदंष्ट्रा च कौबेरी कुरुपालिनी । ज्वालामुखी
    ज्वालमाला छत्रिणी छत्रवाहिनी ॥ ९०॥ भूर्लोकानन्ददात्री च ऋग्मूर्तिः मन्त्रयन्त्रिणी । सावर्णातनया धारा
    महामारी तपस्विनी ॥ ९१॥ सा योगनिद्रा विपुला स्वनाभिकमलोद्भवा । स्वाहा स्वधा वषट्कारा ह्यर्धमात्रात्मिका
    तथा ॥ ९२॥ प्रकृतिस्तु गुणाधारा महारात्रिः सुदारुणा । श्रीह्रीस्वरूपा बुद्धिश्च बोधलक्षणलक्षिता ॥ ९३॥
    परमेश्वरी च परमा लोकनिद्रानुकारिणी । तामसी तामसाकारा बोधिनी बोधिकाऽमला ॥ ९४॥ सुरासुरनुताऽशेषा धर्मन्यायपरायणा
    । विष्णुपादाब्जसम्भूता सन्ध्या सावित्रिका स्थितिः ॥ ९५॥ सदासंहृतिरूपास्या मनुरूपा मनोभवा । भवरोगहरा
    देवी समुत्पत्यार्तिनाशिनी ॥ ९६॥ रोगापहाऽऽरोग्यरूपा जगद्रूपा जगत्पतिः । जगन्माया जगद्धात्री कल्पान्ताऽशेषभागिनी
    ॥ ९७॥ सन्मानिता साट्टहासा चञ्चला वसुदाऽचला । जयेति विजया चैव सकला शाब्दिकाऽमला ॥ ९८॥ मनोहरा हलधरा
    धरणीधरपुत्रिका । सत्याऽजिता जितक्रोधा वाराणसी मनोभवा ॥ ९९॥ मदनी मन्मथी मारी मानिनी मदनान्तकी । शस्त्रास्त्रविपुला
    घोरा व्याप्तलोकत्रयात्मिका ॥ १००॥ सन्नद्धाऽसुरसैन्यान्ता सदसद्रूपिणी तथा । विशालनेत्रा भ्रुकुटिकुटिलाननरञ्जिता
    ॥ १०१॥ महिषासुरहन्त्री च चक्षुरूपा महोदधिः । दिगम्बरा दिशामाला मल्लमर्दनकारिणी ॥ १०२॥ विष्णुमाया महाविद्या
    महालक्ष्मीर्जगन्मया । शुभा शान्ता सिद्धसिद्धा सिद्धिदा च सरस्वती ॥ १०३॥ प्रभा ज्योत्स्ना महाकान्तिः
    क्षमा शर्वा च मङ्गला । हिङ्गुला च तथा पद्मा दान्ता लक्ष्मीर्हरिप्रिया ॥ १०४॥ सुनन्दा नन्दिनी नन्दा
    त्रिपुरासुरमर्दिनी । वेदमाता यज्ञविद्या प्रसिद्धा च सुधा धृतिः ॥ १०५॥ सिद्धविद्या च पृथिवी मृडानी
    विन्ध्यवासिनी । पुरुहूतप्रिया काली पद्मी नारदसेविता ॥ १०६॥ ज्वालामुखी ज्वालमाला कुमुदाऽऽनन्दवासिनी
    । प्रह्लादिनी महादुर्गा दुर्गा दुर्गार्तिनाशिनी ॥ १०७॥ दुर्गमा दुर्लभा भर्गा स्वर्गा त्रिपुरवासिनी
    । शाम्भवी शान्तशान्ता च मदिरा मृदुहासिनी ॥ १०८॥ महानिद्रा योगनिद्रा भवानी भवहारिणी । कुलेश्वरी महामारी
    प्रज्ञा तारा कलेश्वरी ॥ १०९॥ ओङ्कारा पृथिवीकारा चेतना कोपनाकृतिः । कलावती कलाकारा बिन्दुमात्रा जयाकृतिः
    ॥ ११०॥ पद्मासना कुण्डला च बुद्धमाता जनेश्वरी । जनमाता शारदा च जितेन्द्रा हंसवाहिनी ॥ १११॥ सुधात्मिका
    राजवन्द्या विभूतिस्तारिणी शिवा । सद्गतिः सत्परा भूता सिन्धुराऽसुरमर्दिनी ॥ ११२॥ मन्दाकिनी विपाशा च
    सरयू शरहृत्तथा । कौशिकी गण्डकी चैव सत्या साध्वी पतिव्रता ॥ ११३॥ सुश्रोणी रजनीरूपा भगा च भगमालिनी ।
    पताका च प्रतापा च सेनाश्रेणिः सुयुद्धदा ॥ ११४॥ सुव्यूहा काङ्क्षिणी काङ्क्षा दयाकारा पताकिनी । कला
    कान्ता परा तारा त्रिशक्तिः शक्तिमालिनी ॥ ११५॥ इच्छाधेनुः कामधेनुः पावनी पवनाशनी । मोक्षदा मोक्षकामा
    च कृपाला चण्डविक्रमा ॥ ११६॥ गौरी गौरा सुवर्णा च जगत्संहारकारिणी । महाभुजैकाऽनेका च भुजगोरगभूषणा ॥
    ११७॥ चक्रभेदी चक्रघाती भेदिनी श्यामला तथा । सुस्मिता स्मितलक्ष्या च सुमुखी सुखिनी तथा ॥ ११८॥ कृशा
    च बहुवर्णा च बह्वी च बहुहासिनी । रक्ताम्बरा रक्तमाला नानापुष्पविराजिता ॥ ११९॥ तुलसी तुलसीपत्रप्रिया
    कृष्णातिवल्लभा । सप्तछन्दोमयादेवी भीमकी भीमकाकृतिः ॥ १२०॥ कलाकाष्ठा च गायत्री बृहती पङ्क्तिरेव च ।
    सुवर्णरशना कान्ता वेणीभूषणभूषिता ॥ १२१॥ गण्डकी गन्धवासा च कटिभूषणभूषिता । पीताम्बरधरा गौरी विख्याता
    च पयस्विनी ॥ १२२॥ कुङ्कुमागरुशोभाढ्या द्वारकावासिनी तथा । पद्मयोनिर्बह्मयोनिः सुगन्धा चन्दनप्रिया
    ॥ १२३॥ त्रिपुष्कराऽप्रमेया च काशिका मथुरा तथा । अवन्तिका कुशावर्ता नानातीर्थस्वरूपिणी ॥ १२४॥ ब्रह्माण्डनायिकाऽवर्णा
    रतिर्मातङ्गगामिनी । सोऽहंरूपा हंसगतिर्ज्वालिनी ज्वलदायिनी ॥ १२५॥ लेख्या भीमरथी चैव चन्द्रभागा च मुण्डका
    । पूर्णा कुम्भधरा भीमा दिव्या त्रिपुरभैरवी ॥ १२६॥ कराला विकराला च घोरा घुर्घुरनादिनी । ऊर्ध्वकेशी
    रक्तदन्ता त्रिवेणी वेणिका तथा ॥ १२७॥ कर्पूरामोदिकाऽऽमोदा जयश्रीर्जयमङ्गला । जयदा जयविश्रामा जयजया
    सर्वमङ्गला ॥ १२८॥
