id: namavali-122
category: sahasranama
name:
  english: namavali
  devanagari: नामावली
content:
  english: om asya shrivishnordivyasahasranamastotramahamantrasya | shri vedavyaso bhagavan rishih | anushtup
    chandah | shrimahavishnuh paramatma shrimannarayano devata | amritamshudbhavo bhanuriti bijam | devakinandanah
    srashteti shaktih | udbhavah kshobhano deva iti paramo mantrah | shankhabhrinnandaki cakriti kilakam
    | sharngadhanva gadadhara ityastram | rathangapanirakshobhya iti netram | trisama samagah sameti kavacam
    | anandam parabrahmeti yonih | rituh sudarshanah kala iti digbandhah || shrivishvarupa iti dhyanam
    | shrimahavishnuprityarthe sahasranamastotrapathe viniyogah || atha nyasah | om shirasi vedavyasarishaye
    namah | mukhe anushtupchandase namah | hridi shrikrishnaparamatmadevatayai namah | guhye amritamshudbhavo
    bhanuriti bijaya namah | padayordevakinandanah srashteti shaktaye namah | sarvange shankhabhrinnandaki
    cakriti kilakaya namah | karasampute mama shrikrishnaprityarthe jape viniyogaya namah || iti rishayadinyasah
    || atha karanyasah | om vishvam vishnurvashatkara ityangushthabhyam namah | amritamshudbhavo bhanuriti
    tarjanibhyam namah | brahmanyo brahmakridbrahmeti madhyamabhyam namah | suvarnabindurakshobhya ityanamikabhyam
    namah | nimisho'nimishah sragviti kanishthikabhyam namah | rathangapanirakshobhya iti karatalakaraprishthabhyam
    namah | iti karanyasah | atha shadanganyasah | om vishvam vishnurvashatkara iti hridayaya namah |
    amritamshudbhavo bhanuriti shirase svaha | brahmanyo brahmakridbrahmeti shikhayai vashat | suvarnabindurakshobhya
    iti kavacaya hum | nimisho'nimishah sragviti netratrayaya vaushat | rathangapanirakshobhya ityastraya
    phat | iti shadanganyasah || shrikrishnaprityarthe vishnordivyasahasranamajapamaham karishye iti sankalpah
    | dhyanam | shantakaram bhujagashayanam padmanabham suresham vishvadharam gaganasadrisham meghavarnam
    shubhangam | lakshmikantam kamalanayanam yogibhirdhyanagamyam vande vishnum bhavabhayaharam sarvalokaikanatham
    || | atha shrivishnusahasranamavalih | 1 om vishvasmai namah | 2 om vishnave namah | 3 om vashatkaraya
    namah | 4 om bhutabhavyabhavatprabhave namah | 5 om bhutakrite namah | 6 om bhutabhrite namah | 7
    om bhavaya namah | 8 om bhutatmane namah | 9 om bhutabhavanaya namah | 10 om putatmane namah | 11
    om paramatmane namah | 12 om muktanam paramayai gataye namah | 13 om avyayaya namah | 14 om purushaya
    namah | 15 om sakshine namah | 16 om kshetrajnaya namah | 17 om aksharaya namah | 18 om yogaya namah
    | 19 om yogavidam netre namah | 20 om pradhanapurusheshvaraya namah | 21 om narasimhavapushe namah
    | 22 om shrimate namah | 23 om keshavaya namah | 24 om purushottamaya namah | 25 om sarvasmai namah
    | 26 om sharvaya namah | 27 om shivaya namah | 28 om sthanave namah | 29 om bhutadaye namah | 30 om
    nidhaye'vyayaya namah | 31 om sambhavaya namah | 32 om bhavanaya namah | 33 om bhartre namah | 34
    om prabhavaya namah | 35 om prabhave namah | 36 om ishvaraya namah | 37 om svayambhuve namah | 38
    om shambhave namah | 39 om adityaya namah | 40 om pushkarakshaya namah | 41 om mahasvanaya namah |
    42 om anadinidhanaya namah | 43 om dhatre namah | 44 om vidhatre namah | 45 om dhatave uttamaya namah
    | 46 om aprameyaya namah | 47 om hrishikeshaya namah | 48 om padmanabhaya namah | 49 om amaraprabhave
    namah | 50 om vishvakarmane namah | 51 om manave namah | 52 om tvashtre namah | 53 om sthavishthaya
    namah | 54 om sthaviraya dhruvaya namah | 55 om agrahyaya namah | 56 om shashvataya namah | 57 om
    krishnaya namah | 58 om lohitakshaya namah | 59 om pratardanaya namah | 60 om prabhutaya namah | 61
    om trikakubdhamne namah | 62 om pavitraya namah | 63 om mangala paraya namah |
  devanagari: ॐ अस्य श्रीविष्णोर्दिव्यसहस्रनामस्तोत्रमहामन्त्रस्य । श्री वेदव्यासो भगवान् ऋषिः । अनुष्टुप्
    छन्दः । श्रीमहाविष्णुः परमात्मा श्रीमन्नारायणो देवता । अमृतांशूद्भवो भानुरिति बीजम् । देवकीनन्दनः
    स्रष्टेति शक्तिः । उद्भवः क्षोभणो देव इति परमो मन्त्रः । शङ्खभृन्नन्दकी चक्रीति कीलकम् । शार्ङ्गधन्वा
    गदाधर इत्यस्त्रम् । रथाङ्गपाणिरक्षोभ्य इति नेत्रम् । त्रिसामा सामगः सामेति कवचम् । आनन्दं परब्रह्मेति
    योनिः । ऋतुः सुदर्शनः काल इति दिग्बन्धः ॥ श्रीविश्वरूप इति ध्यानम् । श्रीमहाविष्णुप्रीत्यर्थे सहस्रनामस्तोत्रपाठे
    विनियोगः ॥ अथ न्यासः । ॐ शिरसि वेदव्यासऋषये नमः । मुखे अनुष्टुप्छन्दसे नमः । हृदि श्रीकृष्णपरमात्मदेवतायै
    नमः । गुह्ये अमृतांशूद्भवो भानुरिति बीजाय नमः । पादयोर्देवकीनन्दनः स्रष्टेति शक्तये नमः । सर्वाङ्गे
    शङ्खभृन्नन्दकी चक्रीति कीलकाय नमः । करसम्पूटे मम श्रीकृष्णप्रीत्यर्थे जपे विनियोगाय नमः ॥ इति ऋषयादिन्यासः
    ॥ अथ करन्यासः । ॐ विश्वं विष्णुर्वषट्कार इत्यङ्गुष्ठाभ्यां नमः । अमृतांशूद्भवो भानुरिति तर्जनीभ्यां
    नमः । ब्रह्मण्यो ब्रह्मकृद्ब्रह्मेति मध्यमाभ्यां नमः । सुवर्णबिन्दुरक्षोभ्य इत्यनामिकाभ्यां नमः ।
    निमिषोऽनिमिषः स्रग्वीति कनिष्ठिकाभ्यां नमः । रथाङ्गपाणिरक्षोभ्य इति करतलकरपृष्ठाभ्यां नमः । इति करन्यासः
    । अथ षडङ्गन्यासः । ॐ विश्वं विष्णुर्वषट्कार इति हृदयाय नमः । अमृतांशूद्भवो भानुरिति शिरसे स्वाहा ।
    ब्रह्मण्यो ब्रह्मकृद्ब्रह्मेति शिखायै वषट् । सुवर्णबिन्दुरक्षोभ्य इति कवचाय हुम् । निमिषोऽनिमिषः स्रग्वीति
    नेत्रत्रयाय वौषट् । रथाङ्गपाणिरक्षोभ्य इत्यस्त्राय फट् । इति षडङ्गन्यासः ॥ श्रीकृष्णप्रीत्यर्थे विष्णोर्दिव्यसहस्रनामजपमहं
    करिष्ये इति सङ्कल्पः । ध्यानम् । शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं विश्वाधारं गगनसदृशं मेघवर्णं
    शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यं वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ॥ । अथ श्रीविष्णुसहस्रनामावलिः
    । १ ॐ विश्वस्मै नमः । २ ॐ विष्णवे नमः । ३ ॐ वषट्काराय नमः । ४ ॐ भूतभव्यभवत्प्रभवे नमः । ५ ॐ भूतकृते
    नमः । ६ ॐ भूतभृते नमः । ७ ॐ भावाय नमः । ८ ॐ भूतात्मने नमः । ९ ॐ भूतभावनाय नमः । १० ॐ पूतात्मने नमः
    । ११ ॐ परमात्मने नमः । १२ ॐ मुक्तानां परमायै गतये नमः । १३ ॐ अव्ययाय नमः । १४ ॐ पुरुषाय नमः । १५ ॐ
    साक्षिणे नमः । १६ ॐ क्षेत्रज्ञाय नमः । १७ ॐ अक्षराय नमः । १८ ॐ योगाय नमः । १९ ॐ योगविदां नेत्रे नमः
    । २० ॐ प्रधानपुरुषेश्वराय नमः । २१ ॐ नारसिंहवपुषे नमः । २२ ॐ श्रीमते नमः । २३ ॐ केशवाय नमः । २४ ॐ
    पुरुषोत्तमाय नमः । २५ ॐ सर्वस्मै नमः । २६ ॐ शर्वाय नमः । २७ ॐ शिवाय नमः । २८ ॐ स्थाणवे नमः । २९ ॐ
    भूतादये नमः । ३० ॐ निधयेऽव्ययाय नमः । ३१ ॐ सम्भवाय नमः । ३२ ॐ भावनाय नमः । ३३ ॐ भर्त्रे नमः । ३४ ॐ
    प्रभवाय नमः । ३५ ॐ प्रभवे नमः । ३६ ॐ ईश्वराय नमः । ३७ ॐ स्वयम्भुवे नमः । ३८ ॐ शम्भवे नमः । ३९ ॐ आदित्याय
    नमः । ४० ॐ पुष्कराक्षाय नमः । ४१ ॐ महास्वनाय नमः । ४२ ॐ अनादिनिधनाय नमः । ४३ ॐ धात्रे नमः । ४४ ॐ विधात्रे
    नमः । ४५ ॐ धातवे उत्तमाय नमः । ४६ ॐ अप्रमेयाय नमः । ४७ ॐ हृषीकेशाय नमः । ४८ ॐ पद्मनाभाय नमः । ४९ ॐ
    अमरप्रभवे नमः । ५० ॐ विश्वकर्मणे नमः । ५१ ॐ मनवे नमः । ५२ ॐ त्वष्ट्रे नमः । ५३ ॐ स्थविष्ठाय नमः ।
    ५४ ॐ स्थविराय ध्रुवाय नमः । ५५ ॐ अग्राह्याय नमः । ५६ ॐ शाश्वताय नमः । ५७ ॐ कृष्णाय नमः । ५८ ॐ लोहिताक्षाय
