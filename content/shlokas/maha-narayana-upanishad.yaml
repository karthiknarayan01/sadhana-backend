id: maha-narayana-upanishad
category: stotram
name:
  english: Maha Narayana Upanishad
content:
  english: caturthah prashnah om saha na vavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvina
    vadhitamastu ma vidvishavahai shshantih || ambhasyapare ambhasya pare bhuvanasya maddhye nakasya prishthe
    mahato mahiyan | shukrena jyotigmshi samanupravishtah prajapatishcarati garbhe antah | yasminnidagm
    sanca vicaiti sarvam ndeva adhi vishve nisheduh | tadeva bhuta ntadakshare parame vyomann | yena vrita
    mmahinca yenaditya stapati tejasa bhrajasa ca | yamanta ssamudre kavayo vayanti yadakshare parame
    prajah | yatah prasuta jagatah prasuti toyena jivan vyacasarja m | yadoshadhibhih purusha shca vivesha
    bhutani caracarani | atah para ntamasah parastat || stadeva brahma parama nkavinam | ishtapurta mbibharti
    bhuvanasya nabhih | tadevagni stathsuryastadu candramah | tadeva shukramamrita ssa prajapatih | sarve
    nimesha jajnire vidyutah purushadadhi | kala muhurtah kashtha ratrashca sarvashah | ardhamasa masa
    ritavah sam va~thsarashca kalpantam | sa apah pradughe ubhe ime antariksha nca na maddhye parijagrabhat
    | na tasyeshe kashcana tasya nama mahadyashah || na sadrimshe tishthati rupamasya na cakshusha pashyati
    kashcanaina m | hrida manisha manasa 'bhi klripto ya enam ramritaste bhavanti | adbhya ssambhuto hiranyagarbha
    ityashtau | esha hi devah pradisho 'nu sarvah purvo hi jata ssa u garbhe antah | sa vijayamana ssajanishyamanah
    pratyam stishthati vishvatomukhah | vishvatashca kshuruta vishvato mukho vishvato hasta uta vishvataspat
    | sa rdyava prithivi janaya ndeva ekah | venasta vishva bhuvanani vidvan nilam | yasminnidagm sanca
    vicaikagm sa otah protashca vibhuh prajasu | pratadvoce amritannu vidva ngandharvo nama nihita trini
    pada nihita guhasu yastadveda savituh pita 'sat | sa no bandhu rjanita sa vidhata dhamani veda bhuvanani
    vishva | yatra deva amritamana shanastritiye dhama bhyairayanta | pari dyavaprithivi yanti sadyah
    pari loka npari dishah pari suvah | ritasya tantum tprajasu | paritya loka nparitya bhutani paritya
    sarvah pradisho dishashca | prajapatih prathamaja ritasyatmana sambabhuva | sadasaspati mpriyamindrasya
    kamya mmedha mayasisham | uddi pyasva jatavedo 'paghnannir shca mahyamavaha jivananca disho disha
    | mano higmsi jjatavedo gamashva njagat | abibhradagna agahi shriya ma paripataya || purushasya vidma
    sahasrakshasya mahadevasya dhimahi | tanno rudrah pracodaya t || tatpurushaya vidmahe mahadevaya dhimahi
    | tanno rudrah pracodaya t || tatpurushaya vidmahe vakratundaya dhimahi | tanno dantih pracodaya t
    || tatpurushaya vidmahe cakratundaya dhimahi | tanno nandih pracodaya t || tatpurushaya vidmahe mahasenaya
    dhimahi | tannah shanmukhah pracodaya t || tatpurushaya vidmahe suvarnapakshaya dhimahi | tanno garudah
    pracodaya t || vedatmanaya vidmahe hiranyagarbhaya dhimahi | tanno t || narayanaya vidmahe vasudevaya
    dhimahi | tanno vishnuh pracodaya t || vajranakhaya vidmahe tikshna daggshtraya dhimahi | tanno narasigmhah
    pracodaya t || bhaskaraya vidmahe mahaddyutikaraya dhimahi | tanno adityah pracodaya t || vaishvanaraya
    vidmahe lalilaya dhimahi | tanno agnih pracodaya t || katyayanaya vidmahe kanyakumari dhimahi | tanno
    durgih pracodaya sahasraparama devi shatamula shatankura | sarvagm haratu me papa ndurva duhsvapna
    nashani | kanda tprarohanti parushah parushah pari | eva no durve pratanu sahasrena shatena ca | ya
    shatena pratanoshi sahasrena virohasi | tasya ste devishtake vidhema havisha vayam | ashvakrante rathakrante
    vishnukra nte vasundhara | shirasa dharayishyami rakshasva ma rdharani lokadharini | udhrita 'si varahena
    krishnena shata bahuna | mrittike hana me papam 'si kashyapenabhimantrita | mrittike dehi me pushti
    ntanme nirnuda mrittike | taya hatena papena gacchami parama yata indra bhayamahe tato no abhaya nkridhi
    | maghavan chagdhi tava tanna utaye vidvisho vimridho jahi | svastida vishaspati rvritraha vimridho
    vashi | vrishendrah pura etu na ssvastida abhayankarah | svasti na indro vriddhashrava ssvasti nah
    pusha vishvavedah | svasti nastarkshyo arishtanemi ssvasti no brihaspati manyustripalaprabharma dhuni
    charumagm rijishi | somo vishva nyatasa vanani narvagindra mpratimanani debhuh || ssuruco vena avah
    | sa budhniya upama asya vishtha masatashca vivah | syona prithivi bhava nrikshara niveshani | yaccha
    na m | ishvarigm sarvabhutana ntamihopahvaye shriyam | shri rme bhajatu | alakshmi rme nashyatu |
    vishnumukha vai deva mabhyajayann | mahagm indro vajrabahu shshodashi sharma yacchatu || svasti no
    maghava karotu hantu papmanam ndveshti | somanagg svarana nkrinuhi brahmanaspate | kakshivantam ya~
    aushijam | shariram starati dushkritani | tena pavitrena shuddhena puta ati papmana ntarema | sajosha
    indra sagano marudbhi mpiba vritrahanchura vidvan | jahi shatrugm rapa mridho nudasvathabhaya nkrinuhi
    vishvato nah | sumitra na apa oshadhaya ssantu durmitrastasmai bhuyasu ndveshti yanca vaya apo hishtha
    mayo bhuvasta na urje dadhatana | maheranaya cakshase | yo vah shivatamo rasa stasya bhajayate ha
    nah | ushati riva matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah || mme
    dehi yacitah | yanmaya bhukta mpapebhyashca pratigrahah | yanme manasa vaca karmana va dushkrita nkritam
    | tanna indro varuno brihaspatih savita ca punantu punah punah | namo 'phsumate nama indraya namo
    varunaya namo varunyai namo ntadapagacchatat | atyashana t | tanno varuno raja panina 'hamapapo virajo
    nirmukto muktakilbishah | nakasya prishthamaruhya gacche dbrahmasalokatam | yashcaphsu varuna mme
    gange yamune sarasvati shutudri stomagm sacata parushniya | asikniya marudvridhe vitastaya ''rjikiye
    shrinuhya sushomaya | ritanca satyanca 'ddhyajayata | tato ratri rajayata tatah samudro arnavah ||
    va~thsaro ajayata | ahoratrani vidadha vishvasya mishato vashi | uryacandramasau dhata yatha purva
    makalpayat | divanca prithivi ncantariksha matho suvah | ya tprithivyagm rajassva mantarikshe virodasi
    | imag stadapo varunah punatvaghamar shanah | punantu vasavah punatu varunah punatvaghamar shanah
    | esha bhutasya maddhye bhuvanasya gopta | esha punyakritam lo~kanesha mrityor m | dyavaprithivyor
    hiranmayagm sagg ssagm shishadhi | ardra rjvalati brahmahamasmi | yo 'hamasmi brahmahamasmi | ahamasmi
    brahmahamasmi | ahamevaha karyava kirni steno bhrunaha gurutalpagah | varuno tpramucyate | rajobhumistvamagm
    rodayasva pravadanti dhirah thsamudrah prathame vidharma npraja bhuvanasya raja | vrisha pavitre adhisano
    avye briha thsomo vavridhe suvana induh || tikshadaggshthraya dhimahi jatavedase sunavama soma maratiyato
    nidahati vedah | sa nah par shadati durgani vishva naveva sindhu 'tyagnih | tamagnivarna nkarmaphaleshu
    jushta mprapadye sutarasi tarase namah | agne tva mparaya navyo asman bhirati durgani vishva | pushca
    prithvi bahula na urvi bhava tokaya tanayaya sham yo~h | vishvani no durgaha jataveda mboddhyavita
    tanuna m | pritanajitagm sahamana mugramagnigm huvema parama shadati durgani vishva kshamaddevo ati
    durita 'tyagnih | pratnoshi kamidyo addhvareshu sanacca hota navyashca sathsi | svanca mpiprayasvasmabhyanca
    saubhagamayajasva | gobhi rjushtamayujo nishikta ranusancarema | nakasya prishthamabhi sam lo~ka iha
    madayantam || 'tyagnishcatvari ca nkatyayanaya vidmahe kanyakumari dhimahi | tanno durgih pracodaya
    vyahriti homa mantrah magnaye prithivyai svaha 'ntarikshaya svaha madityaya dive svaha ncandramase
    digbhya namo devebhyah svadha pitribhyo bhurbhuvassuva ragnaye prithivyai svaha 'ntarikshaya svaha
    suvaradityaya dive svaha shcandramase digbhya namo devebhyah svadha pitribhyo bhurbhuvassuva ragnaye
    ca prithivyai ca mahate ca svaha bhuvo vayave cantarikshaya ca mahate ca svaha suvaradityaya ca dive
    ca mahate ca svaha shcandramase ca nakshatrebhyashca digbhyashca mahate ca svaha namo devebhyah svadha
    pitribhyo bhurbhuvassuva jnanapraptyartha homamantrah pahi no agna enase svaha | pahi no vishvavedase
    svaha | yajna mpahi vibhavaso svaha | sarva mpahi shatakrato svaha || pahi no agna ekaya | pahyuta
    dvitiyaya | pahyurja ntritiyaya | pahi girbhi vedavismaranaya japamantrah shchandagsya vivesha | sacagm
    shikyah puro vacopanisha jyeshtha indriyaya rishibhyo namo devebhyah svadha pitribhyo bhurbhuvassuva
    namo brahmane dharana ntapo bhurbhuvassuva vihitacarana prashamsa nishiddhacarana ninda ca yatha vrikshasya
    sapumshpitasya dura mpunyasya karmano dura dgandho vati yatha mavakrame yadyuve yuve hava vihvayishyami
    karta 'sya jantoh | tamakratu mpashyati vitashoko dhatuh prasada nmahimanamisham | sapta pranah prabhavanti
    tasma thsaptarcishah samidhah sapta jihvah | sapta ime loka yeshu caranti prana guhashaya ssapta sapta
    | atah samudra girayashca sarve thsyandante sindhava ssarvarupah | atashca vishva oshadhayo rasa stishthatyantaratma
    | brahma devana m | shyeno gridhranag svadhiti rvananagm somah pavitra matyeti rebhann | aja mekam
    njanayantigm sarupam | ajo hyeko jushamano dabja goja ritaja adrija rita mmimikshire ghritamasya yoni
    rghrite shrito ghritamuvasya dhama | anushvadhamavaha madayasva svaha kritam vri~shabha vakshi havyam
    | samudra durmi dupagmshuna samamritatva manat | ghritasya nama guhyam ya~dasti jihva devana mamritasya
    nabhih | vaya nnama prabravama ghritenasmin yajne dharayama namobhih | upa brahma shrinavacchasyamana
    dgaura etat | catvari shringa trayo asya pada dve shira she sapta hastaso asya | tridha baddho vrishabho
    roraviti maho devo martyagm avivesha || devaso ghritamanvavindann | indra ekagm surya eka njajana
    vena dekagg svadhaya nishtatakshuh | yo devana dvishvadhiyo rudro mahar shih | hiranyagarbha mpashyata
    jayamanagm sano deva shshubhaya smritya sam yu~naktu | yasmatpara nnapara masti kincidyasma 'sti kashcit
    | vriksha iva stabdho divi tishtha na karmana na prajaya dhanena tyagenaike amritatva manashuh | parena
    naka dyatayo vishanti || vedanta vijnana ssanyasa yogadyataya | te brahmaloke tu para tparimucyanti
    sarve mpuramaddhya saggstham | tatrapi dahra dupasitavyam || yo vedadau svarah prokto vedante ca pratishthitah
    | tasya prakriti linasya yah parah sa maheshvarah || mpadam | vishvatah paramannityam nnarayanagm
    harim | vishvameveda dvishvamupajivati | patim vi~shvasyatmeshvaragm shashvatagm shivamacyutam | narayana
    mparayanam | narayana paro jyotiratma narayanah parah | narayana para nnarayanah parah | narayana
    paro dhyata dhyana nnarayanah parah | yacca kincij ssthitah | ananta mavyaya pratikashagm hridaya
    ncapyadhomukham | adho nishtya vitastyante nabhyamupari tishthati | jvalamala kula mbhati vishvasyayatana
    mmahat | santatagm shilabhistu lambatya koshasannibham | tasyante sushiragm sukshma mpratishthitam
    | tasya maddhye mahanagni rvishvato mukhah | so majarah kavih | tiryagurdhva madha shshayi rashmayastasya
    santata | santapayati sva ndehamapadatala mastakah | tasya maddhye vahnishikha aniyo rdhva vyavasthitah
    | nilato yada maddhyastha dvidyullekheva bhasvara | nivara shukavattanvi pita bha svatyanupama | tasya
    shshikhaya maddhye parama tma vyavasthitah | sa brahma sa shiva aditya mandale parabrahmopasanam adityo
    va esha eta ntapati tatra ta ricastadrica mandalagm sa ricam rdipyate tani samani sa samnam 'rcishi
    purushastani yajugmshi sa yajusha mandalagm sa yajusham ssaisha trayyeva vidya tapati ya esho raditye
    hiranmayah purushah || adityapurushasya sarvatmakatva pradar adityo vai teja ojo balam shshrotramatma
    mano manyu ssatyo mitro vayurakashah prano lokapalah kah ki mamrita jivo vishvah katama mbrahmai tadamrita
    esha purusha esha bhutana ssayujyagm salokata tyetasameva devatanagm sayujyagm sar shtitagm samana
    lokata nidhanapataye namah | nidhanapatantikaya namah | urdhvaya namah | urdhvalingaya namah | hiranyaya
    namah | hiranyalingaya namah | suvarnaya namah | suvarnalingaya namah | divyaya namah | divyalingaya
    namah | bhavaya namah | bhavalingaya namah | sharvaya namah | sharvalingaya namah | shivaya namah
    | shivalingaya namah | jvalaya namah | jvalalingaya namah | atmaya namah | atmalingaya namah | paramaya
    namah | paramalingaya namah | etathsomasya suryasya sarvalingagg sthapayati panimantra pashcimavaktra
    pratipadaka mantrah mprapadyami sadyojataya vai namo namah | bhave bhave natibhave bhavasva mam |
    bhavodbhavaya namah || uttara vaktra pratipadaka mantrah jyeshthaya namah shreshthaya namo rudraya
    namah kalaya namah kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya nama ssarvabhutadamanaya
    namo manonmanaya namah || dakshina vaktra pratipadaka mantrah bhyo ghoraghoratarebhyah | sarve bhyo
    namaste astu rudrarupebhyah || pragvaktra pratipadaka mantrah tatpurushaya vidmahe mahadevaya dhimahi
    | tanno rudrah pracodaya urdhva vaktra pratipadaka mantrah rbrahma shivo me astu sadashivom || namaskarartha
    mantrah namo hiranyabahave hiranyavarnaya hiranyarupaya hiranyapataye 'binkapataya umapataye pashupataye
    namo namah || nkrishnapingalam | urdhvaretam vi~shvarupaya vai namo namah || sarvo vai rudrastasmai
    rudraya namo astu | purusho vai rudra ssanmaho namo namah | vishva nca yat | sarvo hyesha rudrastasmai
    rudraya namo astu || kadrudraya pracetase midhushtamaya tavyase | vocema shantamagm hride || sarvohyesha
    rudrastasmai rudraya namo astu || agnihotra havanyah upayuktasya vriksha vishesha yasya vai kankatyagni
    hotrahavani bhavati pratyeva stishthantyatho pratishthityai || nushva paja iti panca | aditi rdeva
    gandharva manushyah steshagm sarva bhutana mmata medini mahata mahi savitri gayatri jagatyurvi prithvi
    bahula vishva bhuta katama kaya sa satye tyamriteti vasishthah || apo va idagm sarvam vi~shva bhutanyapah
    prana va apah pashava apo 'mritamapah samradapo viradapah svaradapah chandagsyapo jyotigshyapo yajugshyapah
    satyamapa ssarva devata apo bhurbhuvassuvarapa om || sandhyavandana mantrah apah punantu prithivi
    mprithivi puta punatu mam | punantu brahmanaspati rbrahma puta punatu mam | yaducchishta 'satanca
    pratigrahagg svaha agnishca ma manyushca manyupatayashca manyukritebhyah | papebhyo rakshantam | yadahna
    papamakarsham | manasa vaca hastabhyam | padbhya mudarena shishna | ahastadavalupantu | yatkinca durita
    mamamrita yonau | satye jyotishi juhomi svaha || suryashca ma manyushca manyupatayashca manyukritebhyah
    | papebhyo rakshantam | yadratriya papamakarsham | manasa vaca hastabhyam | padbhya mudarena shishna
    | ratri stadavalupantu | yatkinca durita mamamrita yonau | surye jyotishi juhomi svaha || pranavasya
    rishyadi vivaranam mbrahma | agnirdevata brahma ityar mparamatmam sarupam | sayujyam gayatryavahana
    mantrah ayatu varada devi akshara mbrahma sammitam | gayatri mbrahma jushasva me | yadahna tpratimucyate
    | ya tpratimucyate | sarva varne mahadevi sandhya vidye sarasvati || 'si balamasi bhrajo 'si vishvamasi
    vishvayu mavahayami savitri mavahayami sarasvati mavahayami gayatriya gayatri chando vishvamitra rishi
    mbrahma shiro vishnur shshikha prithiviyonih pranapana samana saprana shvetavarna sankhyayana sagotra
    gayatri caturvigmshatyakshara tripada shatkukshih panca shir mbhuvah | ogm suvah | o ntapah | ogm
    satyam | o mbhargo devasya dhimahi | dhiyo yo nah pracodaya t | omapo jyoti raso mbrahma bhurbhuvassuvarom
    || gayatri upasthana mantrah uttame shikhare jate bhumya mparvata murdhani | brahmane 'bhyanujnata
    gaccha devi yathasukham | stuto maya varada vedamata pracodayanti pavane dvijata | ayuh prithivyam
    ssurya adityo na prabha vatyaksharam | madhuksharanti ta mbrahma bhurbhuvassuvarom || brahma metu
    mam | madhu metu mam | brahma meva madhu metu mam | yaste soma prajavathso 'bhiso aham | dusshvapnaha
    ndurushvaha | yaste soma pranag njuhomi | trisuparna mayacita mbrahmanaya dadyat | brahmahatyam va~
    ete ghnanti | ye bra mprapnuvanti | asahasra | brahmameva madhu medhaya | adya no deva savitah prajavathsavi
    ssaubhagam | para dusshvapniyagm suva | vishvani deva savita rduritani parasuva | ya ntanma asuva
    | madhuvata ritayate madhuksharanti sindhavah | maddhvi ssantvoshadhih | madhunakta mutoshasi madhuma
    tparthivagm rajah | madhudyaurastu nah pita | madhumanno vanaspati rmadhumagm astu suryah | maddhvi
    rgavo bhavantu nah | ya ima mbrahmanaya dadyat | bhrunahatyam va~ ete ghnanti | ye bra mprapnuvanti
    | asahasra | brahmameva madhu medhava m | shyeno griddhranag svadhiti rvananagm somah pavitra matyeti
    rebhann | hagmsa dvasurantariksha saddhota rduronasat | nrishadvara goja ritaja adrija rita mbrihat
    | ricetva rucetva sami thsravanti sarito na dhenah hrida manasa puyamanah | ghritasya dhara abhicakashimi
    | hiranyayo vetaso maddhya asam | tasmi tkulayi bhajannaste madhu devata bhyah | tasya sate haraya
    nduhana amritasya dhara mbrahmanaya dadyat | virahatyam va~ ete ghnanti | ye bra mprapnuvanti | asahasra
    medhadevi jushamana na aga dvishvaci bhadra sumanasya mana | tvaya jushta nudamana durukta nbrihadvadema
    vidathe suvirah | tvaya jushta rishi rbhavati devi tvaya brahma ''gatashri ruta tvaya | tvaya jushtashcitram
    vi~ndate vasu sa no jushasva dravino namedhe || mma indro dadatu medha ndevi sarasvati | medha mpushkarasraja
    || aphsarasu ca ya medha gandharveshu ca yanmanah | daivi mmedha sarasvati sa ma rvishvarupa hiranyavarna
    jagati jagamya | urjasvati payasa pinvamana sa ma mmedha supratika jushantam || mmayyagnistejo dadhatu
    mayi medha mmayindra indriya ndadhatu mayi medha mmayi suryo bhrajo dadhatu || mrityunivarana mantrah
    vaivasvato no abhayankrinotu | parnam va~naspate rivabhinah shiyatagm rayi mmrityo anu parehi pantham
    ya~stesva itaro devayana t | cakshushmate shrinvate te bravimi manah prajagm ririsho mota viran ||
    mmanasa nvarabhamahe prajapatim yo~ bhuvanasya gopah | sano mrityo strayata mpatvagmhaso jyog jiva
    jaramashimahi || amutra bhuyadadha yadyamasya brihaspate abhishastera muncah | pratyauhata mashvina
    mrityu masma ddevanamagne bhishaja shacibhih || manuyanti deva vishvasyeshanam mmatinam | brahma sarupa
    mindhana ubhau lokau sanemaham | ubhayo ma chido mrityo ma vadhir vi~vriho ma pramoshih | praja mma
    me ririsha ayurugra nricakshasa ntva havisha vidhema || ma no mahantamuta ma no arbhaka mma na ukshantamuta
    ma na ukshitam | ma no vadhih pitara mpriya ma nastanuvo rudra ririshah || ma nastoke tanaye ma na
    ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamitovadhir havishmanto namasa vidhema
    te || prajapate na tvadeta nyanyo vishva jatani parita babhuva | ya tkamaste juhumastanno astu vayagg
    syama patayo rayinam || indraprarthana mantrah svastida vishaspati rvritraha vimridho vashi | vrishendrah
    pura etu nassvastida abhaya mpushtivardhanam | urvarukamiva bandhana ye te sahasramayuta mpasha mrityo
    martyaya hantave | tan yajnasya mayaya sarvanava yajamahe | mrityave svaha mrityave svaha | manushyakritasyainaso
    'vayajanamasi svaha | pitrikritasyainaso 'vayajanamasi svaha | atmakritasyainaso 'vayajanamasi svaha
    | anyakritasyainaso 'vayajanamasi svaha | asmatkritasyainaso 'vayajanamasi svaha ncainashcakrima tasya
    vayajanamasi svaha thsvapantashca jagrata krima tasya vayajanamasi svaha thsushuptashca jagrata krima
    tasya vayajanamasi svaha dvidvagmsashca vidvagmsashcainashca krima tasya vayajanamasi svaha | enasa
    enaso vayajanamasi svaha || yadvo devashcakrima jihvaya gurumanaso va prayuti deva hedanam | aravayo
    no abhiducchunayate tasmi ntadeno vasavo nidhetana svaha nkaromi kamah karta naha nkarta kamah karayita
    naha nkarayita esha te kama kamaya svaha || nnamo namah | manyurakar nkaromi manyuh karta naha nkarta
    manyuh karayita naha nkarayita esha te manyo manyave svaha || tilanjuhomi sarasagm sapishta ngandhara
