id: sundararajashtottarashatanamastotram
category: stotram
name:
  english: sundararajashtottarashatanamastotram
  devanagari: सुन्दरराजाष्टोत्तरशतनामस्तोत्रम्
content:
  english: sundararajashtottarashatanamastotram || shrirastu || || om shrisundararajaparabrahmane namah
    || || atha shrimatsundararajashtottarashatanamastotraprarambhah || shrimadvrishabhashailendranityavasakritadaram
    | shrinivasacyutanantagovindadyayutabhidham || 1|| divyaushadhivrita'ramavanacalaniketanam | paramyasamyaviramaparamasvamisamjnakam
    || 2|| sarvalokaikasaundaryabhavanikritavigraham | vaikartanatapoyogapremapunyaphalodayam || 3|| pradipapadapaprantasomacchandarathasthitam
    | suparnadvayasanjushtasuparnavijayadhvajam || 4|| svamanjiragalatpunyamanjiratatinisthitam | sahasradalapadmasthasahasradalapadyugam
    || 5|| rama vishvambharashlishtaparshvadvandvamanoharam | sutapanamaviprendracatakambudamandalam ||
    6|| durvasashshapanirmuktamandukamunipujitam | parvatadhvajapandyendrapararthapadapankajam || 7||
    vimanavamaparshvasthakshetrapalanishevitam | shrimatsundararajakhyayatharthyadyotita'kritim || 8||
    taptakancanasankashacarupitambaravritam | sajiva divyashastrastrasamarudhakatitatam || 9|| nilaniradamadhyasthatatidabhopavitinam
    | bhargavibhavanambhojabhavanikritavakshasam || 10|| bhramadbhamarasanghushtavanamalavibhushitam |
    shrikaustubhamaharatnaparishobhitakandharam || 11|| mandaravitapakarabahudandopashobhitam | shankhacakragadakhadgasharngacapavarayudham
    || 12|| udyogacakravilasadvametarakarambujam | ninadaddakshinavartadakshinetarapaninam || 13|| asheshalokavarada
    katinyastakaradvayam | dordandashandamadhyasthataraharalatanvitam || 14|| padmacandramritarasaprabuddhamukhamandalam
    | japakusumasankashavidramadharapallavam || 15|| nitantadirghalalitashapharadvandvalocanam | nayanambudhimadhyasthasetubhutasunasikam
    || 16|| manobhavamaheshvasanamitabhrayugojvalam | phullapankeruhasinamadhupayitapundrakam || 17||
    ardhendulalitodaraphalasthalamanoharam | araḻanilataraḻamanjuḻaḻakamanjuḻam || 18|| smitajyotsnaparibahamajjannilacaladyutim
    | balarkashatasahasrakiritamakutanvitam || 19|| dedipyamanakatakakundalangadabhasuram | nanamaniganajvalashavaḻikrita
    vigraham || 20|| shrimatkalyanasaundaryavallicittanuvartinam | vedavedangatatvajna vishuddhamatigocaram
    || 21|| sharanagatasantranakarunavarunalayam | durvarashritadaridryavileshayakhageshvaram || 22||
    padananajakshyadisarvavayavasundaram | svaradhanasaktacittabhaktasamrakshanotsukam || 23|| vikhanomunisiddhantasamarcaikapriyashayam
    | pranatartipranashaikadhurandharavanadrigam || 24|| dharadharavrita'ramadharadharadharadharam | akaradikshakarantamatrikatarakatmakam
    || 25|| dhruvacandradivanathamadhyamandalavartinam | naradavyasasanakashukadihridayeshayam || 26||
    devadanavagandharvasiddhasanghabhivanditam | anukshanasamarudhalakshmisamjnavirajitam || 27|| anekacarasancarabhuvanagarashilpinam
    | brahmarudrendrasanghushtamahavibhavavistaram || 28|| paravaraviharodyanmahamatsyavatarinam | madhukaitabhadavagniprashamapracarambudam
    || 29|| samvartasalila'vartasamuddhritasarasvatim | asheshabhuvana'dharadharanidharadharinam || 30||
    kshirabdhimanthanimanthamandara'dharakacchapam | sagarotpaditabja'digajaramamanidrumam || 31|| sudhahetukadaityaridaityograkalahaspadam
    | mohitasheshabhuvana mohinirupadharinam || 32|| dhutaskandhasatalagnanakshatragrahamandalam | hiranyakshaghanadhvantakavaḻikara
    bhaskaram || 33|| surasurasudhadanapriyavipriyakarinam | sukarakarahunkaranirakrita parakritim ||
    34|| svankasamsthapitanantanantatatvarthadarshinam | shrimadashtarnavilasatprahladahridayalayam ||
    35|| hiranyasadanadvaranirbhinnastambhasambhavam | kathoragarjanadhyana bhitabhitajagatrayam || 36||
    ghoravajranakhara vibhinnasharabhakritim | daityashri haranasaktakuhanabrahmacarinam || 37|| trivikramakrama'krantasamastabhuvanakramam
    | sarvagirvanasamantasarvabhaumasahodaram || 38|| bhargavarnavasambhutanishkaḻankanishakaram | svajolavadandagdhakartaviryamahavanam
    || 39|| kshatriyakshatajaktitikshnadharaparashvadham | sauravamshasamutpannaharinmanivarottamam ||
    40|| mahanatamaheshvasabhagnapraptajayashriyam | janakicaruvadanacakorasha shalancanam || 41|| nirjitanekasahasraminaketanasundaram
    | udyadutphullacandrabjasphurannilacalopamam || 42|| prapannapannasampannakaranaikaparayanam | sharashoshitasarvasvasamudrataranodyatam
    || 43|| dushteshta'sharakisheshanigrahanugrahapradam | bharatangadabhallukasauravayusuta'vritam ||
    44|| vasishthavamadevadibrahmarshiganamanitam | kshamavatsalyakarunyadyudaragunavaridhim || 45|| sharadindusudhashankhashuddha
    sphatikavigraham | kopa'topahala'krishtayamunahastinapuram || 46|| gandharakarnagangeyasuyodhanamukharcitam
    | yashoda devakinandavasudevayashodayam || 47|| gopigopalagobrindagovardhanadharoddharam || brindavanantaviharadgopinayana
    kinkaram || 48|| cintayantikuceladicintitarthabahupradam | trinikritashvavrishabhatrina'vartamadotkatam
    || 49|| kaḻiyakamsanarakabakavaneshabhanjanam | krandatpancalatanayaduhkhonmulanasambhramam || 50||
    uddhavakruravidurabhishmapandavasevitam | rukminisatyabhamadistrainadrishtimanoharam || 51|| mahabharatashardulavijayapriyasarathim
    | dhananjayadrigitarthasudhavarshimahaghanam || 52|| samasta vidyabhavanaturangamavarananam | heshatrayi
    mahaghoshacandramandalamanduram || 53|| nigama'gamashastradisarvavagishvareshvaram | svamshavatarabahuḻyasamrakshitajagattrayam
    || 54|| shrimada'ramajimutaprakhyatanagapungavam | animadyashtasamsiddhayamadyashtangasiddhidam ||
    55|| shrimadvashadrinilayam shrinivasabhidhanakam | naranarayana'khyata hamsahamsottameshvaram ||
    56|| shrimamadvrishadrinilayam shrimadvenkatanayakam | shrimatkunjararajendravaradam pranamamyaham
    || 57|| samastajagadadharam sarvamangaḻadayakam | sarvalokaikasharanam varadam pranamamyaham || 58||
    sarvarishtavinashartham sarva'padvinivrittaye | shrivishnubhaktilabhaya mayasantaranaya ca || 59||
    sarvasampatsamridhyarthamadhurarogyavriddhaye | satkaḻatragrihakshetra putramitradivriddhaye || 60||
    sundaram paramandevam devim kalyanasundarim | namami bhuyobhuyo'hambhuyobhuyo namamyaham || 61|| iti
    stutva dine ratrau sarvasiddhim labhennarah || 62|| iti shrimatsundararajashtottarashatanamastotram
    sampurnamitisham ||
  devanagari: सुन्दरराजाष्टोत्तरशतनामस्तोत्रम् ॥ श्रीरस्तु ॥ ॥ ॐ श्रीसुन्दरराजपरब्रह्मणे नमः ॥ ॥ अथ श्रीमत्सुन्दरराजाष्टोत्तरशतनामस्तोत्रप्रारम्भः
    ॥ श्रीमद्वृषभशैलेन्द्रनित्यवासकृतादरम् । श्रीनिवासाच्युतानन्तगोविन्दाद्ययुताभिधम् ॥ १॥ दिव्यौषधीवृताऽरामवनाचलनिकेतनम्
    । पारम्यसाम्यविरमपरमस्वामिसंज्ञकम् ॥ २॥ सर्वलोकैकसौन्दर्यभवनीकृतविग्रहम् । वैकर्तनतपोयोगप्रेमपुण्यफलोदयम्
    ॥ ३॥ प्रदीपपादपप्रान्तसोमच्छन्दरथस्थितम् । सुपर्णद्वयसञ्जुष्टसुपर्णविजयध्वजम् ॥ ४॥ स्वमञ्जीरगलत्पुण्यमञ्जीरतटिनीस्थितम्
    । सहस्रदलपद्मस्थसहस्रदलपद्युगम् ॥ ५॥ रमा विश्वम्भराश्लिष्टपार्श्वद्वन्द्वमनोहरम् । सुतपानामविप्रेन्द्रचातकाम्बुदमण्डलम्
    ॥ ६॥ दुर्वासश्शापनिर्मुक्तमण्डूकमुनिपूजितम् । पर्वतध्वजपाण्ड्येन्द्रपरार्थपदपङ्कजम् ॥ ७॥ विमानवामपार्श्वस्थक्षेत्रपालनिषेवितम्
    । श्रीमत्सुन्दरराजाख्ययाथार्थ्यद्योतिताऽकृतिम् ॥ ८॥ तप्तकाञ्चनसङ्काशचारुपीताम्बरावृतम् । सजीव दिव्यशस्त्रास्त्रसमारूढकटीतटम्
    ॥ ९॥ नीलनीरदमध्यस्थतटिदाभोपवीतिनम् । भार्गवीभवनाम्भोजभवनीकृतवक्षसम् ॥ १०॥ भ्रमद्भमरसङ्घुष्टवनमालाविभूषितम्
    । श्रीकौस्तुभमहारत्नपरिशोभितकन्धरम् ॥ ११॥ मन्दारविटपाकारबाहुदण्डोपशोभितम् । शङ्खचक्रगदाखड्गशार्ङ्गचापवरायुधम्
    ॥ १२॥ उद्योगचक्रविलसद्वामेतरकराम्बुजम् । निनदद्दक्षिणावर्तदक्षिणेतरपाणिनम् ॥ १३॥ अशेषलोकवरद कटिन्यस्तकरद्वयम्
    । दोर्दण्डषण्डमध्यस्थतारहारलतान्वितम् ॥ १४॥ पद्मचन्द्रामृतरसप्रबुद्धमुखमण्डलम् । जपाकुसुमसङ्काशविद्रमाधरपल्लवम्
    ॥ १५॥ नितान्तदीर्घललितशफरद्वन्द्वलोचनम् । नयनाम्बुधिमध्यस्थसेतुभूतसुनासिकम् ॥ १६॥ मनोभवमहेष्वासनमितभ्रयुगोज्वलम्
    । फुल्लपङ्केरुहासीनमधुपायितपुण्ड्रकम् ॥ १७॥ अर्धेन्दुललितोदारफालस्थलमनोहरम् । अराळनीलतरळमञ्जुळाळकमञ्जुळम्
    ॥ १८॥ स्मितज्योत्स्नापरीबाहमज्जन्नीलाचलद्युतिम् । बालार्कशतसाहस्रकिरीटमकुटान्वितम् ॥ १९॥ देदीप्यमानकटककुण्डलाङ्गदभासुरम्
    । नानामणिगणज्वालाशवळीकृत विग्रहम् ॥ २०॥ श्रीमत्कल्याणसौन्दर्यवल्लीचित्तानुवर्तिनम् । वेदवेदाङ्गतत्वज्ञ
    विशुद्धमतिगोचरम् ॥ २१॥ शरणागतसन्त्राणकरुणावरुणालयम् । दुर्वाराश्रितदारिद्र्यविलेशयखगेश्वरम् ॥ २२॥
    पादाननजाक्ष्यादिसर्वावयवसुन्दरम् । स्वाराधनासक्तचित्तभक्तसंरक्षणोत्सुकम् ॥ २३॥ विखनोमुनिसिद्धान्तसमर्चैकप्रियाशयम्
    । प्रणतार्तिप्रणाशैकधुरन्धरवनाद्रिगम् ॥ २४॥ धाराधरावृताऽरामधराधरधराधरम् । अकारादिक्षकारान्तमातृकातारकात्मकम्
    ॥ २५॥ ध्रुवचन्द्रदिवानाथमध्यमण्डलवर्तिनम् । नारदव्याससनकशुकादिहृदयेशयम् ॥ २६॥ देवदानवगन्धर्वसिद्धसङ्घाभिवन्दितम्
    । अनुक्षणसमारूढलक्ष्मीसंज्ञाविराजितम् ॥ २७॥ अनेकाचरसञ्चारभुवनागारशिल्पिनम् । ब्रह्मरुद्रेन्द्रसङ्घुष्टमहाविभवविस्तरम्
    ॥ २८॥ पारावारविहारोद्यन्महामत्स्यावतारिणम् । मधुकैटभदावाग्निप्रशमप्रचराम्बुदम् ॥ २९॥ संवर्तसलिलाऽवर्तसमुद्धृतसरस्वतिम्
    । अशेषभुवनाऽधारधरणीधरधारिणम् ॥ ३०॥ क्षीराब्धिमन्थनीमन्थमन्दराऽधारकच्छपम् । सागरोत्पादिताब्जाऽदिगजरामामणिद्रुमम्
    ॥ ३१॥ सुधाहेतुकदैत्यारिदैत्योग्रकलहास्पदम् । मोहिताशेषभुवन मोहिनीरूपधारिणम् ॥ ३२॥ धुतस्कन्धसटालग्ननक्षत्रग्रहमण्डलम्
    । हिरण्याक्षघनध्वान्तकवळीकर भास्करम् ॥ ३३॥ सुरासुरसुधादानप्रियविप्रियकारिणम् । सूकराकारहुङ्कारनिराकृत
    पराकृतिम् ॥ ३४॥ स्वाङ्कसंस्थापितानन्तानन्ततत्वार्थदर्शिनम् । श्रीमदष्टार्णविलसत्प्रह्लादहृदयालयम्
    ॥ ३५॥ हिरण्यसदनद्वारनिर्भिन्नस्तम्भसम्भवम् । कठोरगर्जनध्यान भीतभीतजगत्रयम् ॥ ३६॥ घोरवज्रनखर विभिन्नशरभाकृतिम्
    । दैत्यश्री हरणासक्तकुहनाब्रह्मचारिणम् ॥ ३७॥ त्रिविक्रमक्रमाऽक्रान्तसमस्तभुवनक्रमम् । सर्वगीर्वाणसामन्तसार्वभौमसहोदरम्
    ॥ ३८॥ भार्गवार्णवसम्भूतनिष्कळङ्कनिशाकरम् । स्वजोलवदन्दग्धकार्तवीर्यमहावनम् ॥ ३९॥ क्षत्रियक्षतजाक्तितीक्ष्णधारापरश्वधम्
    । सौरवंशसमुत्पन्नहरिन्मणिवरोत्तमम् ॥ ४०॥ महानटमहेष्वासभग्नप्राप्तजयश्रियम् । जानकीचारुवदनचकोरश शालाञ्चनम्
    ॥ ४१॥ निर्जितानेकसाहस्रमीनकेतनसुन्दरम् । उद्यदुत्फुल्लचन्द्राब्जस्फुरन्नीलाचलोपमम् ॥ ४२॥ प्रपन्नापन्नसम्पन्नकरणैकपरायणम्
    । शरशोषितसर्वस्वसमुद्रतरणोद्यतम् ॥ ४३॥ दुष्टेष्टाऽशरकीशेशनिग्रहानुग्रहप्रदम् । भरताङ्गदभल्लूकसौरवायुसुताऽवृतम्
    ॥ ४४॥ वसिष्ठवामदेवादिब्रह्मर्षिगणमानितम् । क्षमावात्सल्यकारुण्याद्युदारगुणवारिधिम् ॥ ४५॥ शरदिन्दुसुधाशङ्खशुद्ध
    स्फटिकविग्रहम् । कोपाऽटोपहलाऽकृष्टयमुनाहस्तिनापुरम् ॥ ४६॥ गान्धारकर्णगाङ्गेयसुयोधनमुखार्चितम् । यशोदा
    देवकीनन्दवसुदेवयशोदयम् ॥ ४७॥ गोपीगोपालगोबृन्दगोवर्धनधरोद्धरम् ॥ बृन्दावनान्तविहरद्गोपीनयन किङ्करम्
    ॥ ४८॥ चिन्तयन्तीकुचेलादिचिन्तितार्थबहुप्रदम् । तृणीकृताश्ववृषभतृणाऽवर्तमदोत्कटम् ॥ ४९॥ काळीयकंसनरकबकवाणेशभञ्जनम्
    । क्रन्दत्पाञ्चालतनयादुःखोन्मूलनसम्भ्रमम् ॥ ५०॥ उद्धवाक्रूरविदुरभीष्मपाण्डवसेवितम् । रुक्मिणीसत्यभामादिस्त्रैणदृष्टिमनोहरम्
    ॥ ५१॥ महाभारतशार्दूलविजयप्रियसारथिम् । धनञ्जयाद्रिगीतार्थसुधावर्षिमहाघनम् ॥ ५२॥ समस्त विद्याभवनतुरङ्गमवराननम्
    । हेषात्रयी महाघोषचन्द्रमण्डलमन्दुरम् ॥ ५३॥ निगमाऽगमशास्त्रादिसर्ववागीश्वरेश्वरम् । स्वांशावतारबाहुळ्यसंरक्षितजगत्त्रयम्
    ॥ ५४॥ श्रीमदाऽरामजीमूतप्रख्यातनगपुङ्गवम् । अणिमाद्यष्टसंसिद्धयमाद्यष्टाङ्गसिद्धिदम् ॥ ५५॥ श्रीमद्वषाद्रिनिलयं
    श्रीनिवासाभिधानकम् । नरनारायणाऽख्यात हंसहंसोत्तमेश्वरम् ॥ ५६॥ श्रीममद्वृषाद्रिनिलयं श्रीमद्वेङ्कटनायकम्
    । श्रीमत्कुञ्जरराजेन्द्रवरदं प्रणमाम्यहम् ॥ ५७॥ समस्तजगदाधारं सर्वमङ्गळदायकम् । सर्वलोकैकशरणं वरदं
    प्रणमाम्यहम् ॥ ५८॥ सर्वारिष्टविनाशार्थं सर्वऽपद्विनिवृत्तये । श्रीविष्णुभक्तिलाभाय मायासन्तारणाय च
    ॥ ५९॥ सर्वसम्पत्समृध्यर्थमाधुरारोग्यवृद्धये । सत्कळत्रगृहक्षेत्र पुत्रमित्रादिवृद्धये ॥ ६०॥ सुन्दरं
    परमन्देवं देवीं कल्याणसुन्दरीम् । नमामि भूयोभूयोऽहम्भूयोभूयो नमाम्यहम् ॥ ६१॥ इति स्तुत्वा दिने रात्रौ
    सर्वसिद्धिं लभेन्नरः ॥ ६२॥ इति श्रीमत्सुन्दरराजाष्टोत्तरशतनामस्तोत्रं सम्पूर्णमितिशम् ॥
