id: bagalapanjarastotram
category: kavacha
name:
  english: bagalapanjarastotram
  devanagari: बगलापन्जरस्तोत्रम्
content:
  english: balida om aim hlim shrim adharoshthau tatha dantan jihvam ca mukhagam mama | patu mam bagaladevi
    pitambarasudharini || 9|| om aim hlim shrim gale haste tatha bahvoh yugapadbuddhidasatam | patu mam
    bagaladevi divyasraganulepana || 10|| om aim hlim shrim hridaye ca stane nabhau karavapi krishodari
    | patu mam bagala nityam pitavastraghanavrita || 11|| janghayam ca tatha corvorgulphayoshcativegini
    | anuktamapi yatsthanam tvakkeshanakhalomakam || 12|| asrinmamsam tathasthini sandhayashcapi me para
    | tah sarva bagaladevi rakshenme ca manohara || 13|| phalashrutih | ityetadvaradam gopyam kalavapi
    visheshatah | panjaram bagaladevyah ghoradaridryanashanam | panjaram yah pathedbhaktya sa vighnairnabhibhutaye
    || 14|| avyahatagatishcasya brahmavishnvadisatpure | svarge martye ca patale narayastam kadacana ||
    15|| na badhante naravyaghram panjarastham kadacana | ato bhaktaih kaulikaishca svarakshartham sadaiva
    hi || 16|| pathaniyam prayatnena sarvanarthavinashanam | mahadaridryashamanam sarvamangalyavardhanam
    || 17|| vidyavinayasatsaukhyam mahasiddhikaram param | idam brahmastravidyayah panjaram sadhu gopitam
    || 18|| pathetsmareddhyanasamsthah sa jayenmaranam narah | yah panjaram pravishyaiva mantram japati
    vai bhuvi || 19|| kauliko'kauliko vapi vyasavadvicaredbhuvi | candrasuryasamo bhutva vasetkalpayutam
    divi || 20|| shrisuta uvaca iti kathitamashesham shreyasamadibijam | bhavashataduritaghnam dhvastamohandhakaram
    | smaranamatishayena praptirevatra martyah | yadi vishati sada vai panjaram panditah syat || 21||
    || iti paramarahasyatirahasye shripitambarapanjarastotram sampurnam || vajrapanjarakavacastotram
  devanagari: बलिदा ॐ ऐं ह्लीं श्रीं अधरोष्ठौ तथा दन्तान् जिह्वां च मुखगां मम । पातु मां बगलादेवी पीताम्बरसुधारिणी
    ॥ ९॥ ॐ ऐं ह्लीं श्रीं गले हस्ते तथा बाह्वोः युगपद्बुद्धिदासताम् । पातु मां बगलादेवी दिव्यस्रगनुलेपना
    ॥ १०॥ ॐ ऐं ह्लीं श्रीं हृदये च स्तने नाभौ करावपि कृशोदरी । पातु मां बगला नित्यं पीतवस्त्रघनावृता ॥
    ११॥ जङ्घायां च तथा चोर्वोर्गुल्फयोश्चातिवेगिनी । अनुक्तमपि यत्स्थानं त्वक्केशनखलोमकम् ॥ १२॥ असृङ्मांसं
    तथास्थीनी सन्धयश्चापि मे परा । ताः सर्वा बगलादेवी रक्षेन्मे च मनोहरा ॥ १३॥ फलश्रुतिः । इत्येतद्वरदं
    गोप्यं कलावपि विशेषतः । पञ्जरं बगलादेव्याः घोरदारिद्र्यनाशनम् । पञ्जरं यः पठेद्भक्त्या स विघ्नैर्नाभिभूतये
    ॥ १४॥ अव्याहतगतिश्चास्य ब्रह्मविष्ण्वादिसत्पुरे । स्वर्गे मर्त्ये च पाताले नारयस्तं कदाचन ॥ १५॥ न
    बाधन्ते नरव्याघ्रं पञ्जरस्थं कदाचन । अतो भक्तैः कौलिकैश्च स्वरक्षार्थं सदैव हि ॥ १६॥ पठनीयं प्रयत्नेन
    सर्वानर्थविनाशनम् । महादारिद्र्यशमनं सर्वमाङ्गल्यवर्धनम् ॥ १७॥ विद्याविनयसत्सौख्यं महासिद्धिकरं परम्
    । इदं ब्रह्मास्त्रविद्यायाः पञ्जरं साधु गोपितम् ॥ १८॥ पठेत्स्मरेद्ध्यानसंस्थः स जयेन्मरणं नरः । यः
    पञ्जरं प्रविश्यैव मन्त्रं जपति वै भुवि ॥ १९॥ कौलिकोऽकौलिको वापि व्यासवद्विचरेद्भुवि । चन्द्रसूर्यसमो
    भूत्वा वसेत्कल्पायुतं दिवि ॥ २०॥ श्रीसूत उवाच इति कथितमशेषं श्रेयसामादिबीजम् । भवशतदुरितघ्नं ध्वस्तमोहान्धकारम्
    । स्मरणमतिशयेन प्राप्तिरेवात्र मर्त्यः । यदि विशति सदा वै पञ्जरं पण्डितः स्यात् ॥ २१॥ ॥ इति परमरहस्यातिरहस्ये
    श्रीपीताम्बरापञ्जरस्तोत्रं सम्पूर्णम् ॥ वज्रपञ्जरकवचस्तोत्रम्
