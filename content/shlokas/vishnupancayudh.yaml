id: vishnupancayudh
category: stotram
name:
  english: vishnupancayudh
  devanagari: विश्नुपन्चायुध्
content:
  english: shrivishnu pancayudhastotram sphuratsahasrarashikhatitivram sudarshanam bhaskarakotitulyam
    | suradvisham pranavinashi vishnoshcakram sada'ham sharanam prapadye || 1|| vishnormukhotthanilapuritasya
    yasya dhvanirdanavadarpahanta | tam pancajanyam shashikotishubhram shankham sada'ham sharanam prapadye
    || 2|| hiranmayim merusamanasaram kaumodakim daityakulaikahantrim | vaikunthavamagrakarabhimrishtam
    gadam sada'ham sharanam prapadye || 3|| raksho'suranam kathinograkanthacchedaksharacchonitadigdhadharam
    | tam nandakam nama hareh pradiptam khadgam sada'ham sharanam prapadye || 4|| yajjyaninadashravanatsuranam
    cetamsi nirmuktabhayani sadyah | bhavanti daityashanibanavallih sharngam sada'ham sharanam prapadye
    || 5|| imam hareh pancamahayudhanam stavam pathedyo'nudinam prabhate |
  devanagari: श्रीविष्णु पञ्चायुधस्तोत्रम् स्फुरत्सहस्रारशिखातितीव्रं सुदर्शनं भास्करकोटितुल्यम् । सुरद्विषां
    प्राणविनाशि विष्णोश्चक्रं सदाऽहं शरणं प्रपद्ये ॥ १॥ विष्णोर्मुखोत्थानिलपूरितस्य यस्य ध्वनिर्दानवदर्पहन्ता
    । तं पाञ्चजन्यं शशिकोटिशुभ्रं शङ्खं सदाऽहं शरणं प्रपद्ये ॥ २॥ हिरण्मयीं मेरुसमानसारां कौमोदकीं दैत्यकुलैकहन्त्रीम्
    । वैकुण्ठवामाग्रकराभिमृष्टां गदां सदाऽहं शरणं प्रपद्ये ॥ ३॥ रक्षोऽसुराणां कठिनोग्रकण्ठच्छेदक्षरच्छोणितदिग्धधाराम्
    । तं नन्दकं नाम हरेः प्रदीप्तं खड्गं सदाऽहं शरणं प्रपद्ये ॥ ४॥ यज्ज्यानिनादश्रवणात्सुराणां चेतांसि
    निर्मुक्तभयानि सद्यः । भवन्ति दैत्याशनिबाणवल्लिः शार्ङ्गं सदाऽहं शरणं प्रपद्ये ॥ ५॥ इमं हरेः पञ्चमहायुधानां
    स्तवं पठेद्योऽनुदिनं प्रभाते ।
