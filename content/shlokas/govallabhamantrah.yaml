id: govallabhamantrah
category: mantra
name:
  english: govallabhamantrah
  devanagari: गोवल्लभमन्त्रः
content:
  english: shrigovallabhamantrah || viniyogah || asya shrigovallabhamantrasya brahma rishih | gayatri
    chandah | shrikrishno devata | sarvabhishtasiddhyarthe jape viniyogah || || rishyadinyasah || brahmane
    rishaye namah shirasi | gayatrichandase namah mukhe | shrikrishnadevatayai namah hridi | viniyogaya
    namah sarvange || || pancanganyasah || klim go hridayaya namah | valla shirase svaha | bhaya shikhayai
    vashat | svaha kavacaya hum | klim govallabhaya svaha astraya phat || || karanyasah || om klam angushthabhyam
    namah | om klim tarjanibhyam namah | om klum madhyamabhyam namah | om klaim anamikabhyam namah | om
    klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam namah || || shadanganyasah || om
    klam hridayaya namah | om klim shirase svaha | om klum shikhayai vashat | om klaim kavacaya hum |
    om klaum netratrayaya vaushat | om klah astraya phat || || dhyanam || harim pancavarsham vraje dhavamanam
    svasaundaryasammohitasvargayosham | yashodasutam strijanairdrishtalilam bhaje bhushitam nupuradyairvibhushaih
    || barhavatamsam navanilamegham vilolalakam caruhasaprakasham | muralininadapramodapradam tam bhaje
    nandasunum manojnasvarupam || gopanganabhih parito vilokyam kridaparam kunkumalepashobham | kaustubhadiptorasamishamadyam
    vande mukundam varadam dayalum || || mantrah || klim govallabhaya svaha || iti shrigovallabhamantrah
    sampurnah |
  devanagari: श्रीगोवल्लभमन्त्रः ॥ विनियोगः ॥ अस्य श्रीगोवल्लभमन्त्रस्य ब्रह्मा ऋषिः । गायत्री छन्दः ।
    श्रीकृष्णो देवता । सर्वाभीष्टसिद्ध्यर्थे जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ ब्रह्मणे ऋषये नमः शिरसि
    । गायत्रीछन्दसे नमः मुखे । श्रीकृष्णदेवतायै नमः हृदि । विनियोगाय नमः सर्वाङ्गे ॥ ॥ पञ्चाङ्गन्यासः
    ॥ क्लीं गो हृदयाय नमः । वल्ल शिरसे स्वाहा । भाय शिखायै वषट् । स्वाहा कवचाय हुं । क्लीं गोवल्लभाय स्वाहा
    अस्त्राय फट् ॥ ॥ करन्यासः ॥ ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ क्लूं मध्यमाभ्यां
    नमः । ॐ क्लैं अनामिकाभ्यां नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः
    ॥ ॐ क्लां हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय हुं । ॐ क्लौं नेत्रत्रयाय
    वौषट् । ॐ क्लः अस्त्राय फट् ॥ ॥ ध्यानम् ॥ हरिं पञ्चवर्षं व्रजे धावमानं स्वसौन्दर्यसम्मोहितस्वर्गयोषम्
    । यशोदासुतं स्त्रीजनैर्दृष्टलीलं भजे भूषितं नूपुराद्यैर्विभूषैः ॥ बर्हावतंसं नवनीलमेघं विलोलालकं चारुहासप्रकाशम्
    । मुरलीनिनादप्रमोदप्रदं तं भजे नन्दसूनुं मनोज्ञस्वरूपम् ॥ गोपाङ्गनाभिः परितो विलोक्यं क्रीडापरं कुङ्कुमलेपशोभम्
    । कौस्तुभदीप्तोरसमीशमाद्यं वन्दे मुकुन्दं वरदं दयालुम् ॥ ॥ मन्त्रः ॥ क्लीं गोवल्लभाय स्वाहा ॥ इति
    श्रीगोवल्लभमन्त्रः सम्पूर्णः ।
