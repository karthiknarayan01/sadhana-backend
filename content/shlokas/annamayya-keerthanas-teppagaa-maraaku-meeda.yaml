id: annamayya-keerthanas-teppagaa-maraaku-meeda
category: stotram
name:
  english: Annamayya Keerthanas Teppagaa Maraaku Meeda
content:
  english: adi pallavi tèppaga marraku mida teladuvadu | èppudu lokamulèlla neletivadu || caranam motaniti
    madugulo yitagaracinavadu | patagile nutikrinda bayanivadu | mutidosipatti manti mudda pèllagincuvadu
    | rotayaina pegula perulu galavadu || tèppaga marraku mida teladuvadu kodikuta norivani kurratammudainavadu
    | budida businavani buddhulavadu | madavannè ledivènta mayalabadinavadu | dudala navulagaci dòrayainavadu
    || tèppaga marraku mida teladuvadu akasanabare vuri ativala manamula | kakuseyuvadu turagamupaivadu
    | ekamai venkatagiri nindiraramani gudi | yekalamubayani yènalenivadu || tèppaga marraku mida teladuvadu
    | èppudu lokamulèlla neletivadu ||
  devanagari: आदि पल्लवि तॆप्पगा मर्राकु मीद तेलाडुवाडु । ऎप्पुडु लोकमुलॆल्ल नेलेटिवाडु ॥ चरणं मोतनीटि
    मडुगुलो यीतगरचिनवाडु । पातगिले नूतिक्रिन्द बायनिवाडु । मूतिदोसिपट्टि मण्टि मुद्द पॆल्लगिञ्चुवाडु ।
    रोतयैन पेगुल पेरुलु गलवाडु ॥ तॆप्पगा मर्राकु मीद तेलाडुवाडु कोडिकूत नोरिवानि कुर्रतम्मुडैनवाडु । बूडिद
    बूसिनवानि बुद्धुलवाडु । माडवन्नॆ लेडिवॆण्ट मायलबडिनवाडु । दूडल नावुलगाचि दॊरयैनवाडु ॥ तॆप्पगा मर्राकु
    मीद तेलाडुवाडु आकसानबारे वूरि अतिवल मानमुल । काकुसेयुवाडु तुरगमुपैवाडु । एकमै वेङ्कटगिरि निन्दिरारमणि
    गूडि । येकालमुबायनि यॆनलेनिवाडु ॥ तॆप्पगा मर्राकु मीद तेलाडुवाडु । ऎप्पुडु लोकमुलॆल्ल नेलेटिवाडु ॥
