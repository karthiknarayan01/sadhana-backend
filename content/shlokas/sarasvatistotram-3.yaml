id: sarasvatistotram-3
category: stotram
name:
  english: sarasvatistotram 3
  devanagari: सरस्वतीस्तोत्रम् ३
content:
  english: dvenika vidhisundari mama bhavedanandasandohini || 1|| yatpadambujasevayaiva sasuro lokah samartyasuro
    vagaunnatyamagahata shrutivacovithishu ya giyate | ya shvetambujamadhyavasarasika ya namrarakshamanih
    dhatuh kapi kutumbini vitaratat sa nirvritim no'tulam || 2|| kasturighanasaragandhalaharisamvasitorahsthala
    samvita sphutakashapushpasadrishakshaumamshukenanisham | pustam hastacatushtaye japavatim shastam
    shukim vallakim bibhrana grihini vidhaturavatannah sevaya toshita || 3|| shubhram dabhravalagnamabhratanu
    te'dabhrapramodapradam vibhrante bhramadandhaparaya satatam taistairnijairvibhramaih | shabdabrahmamaye
    jagatyanitarapekshadhikarakriyam kincitkuncitakeshamadya jayati srashturbhuvishtham mahah || 4|| iti
    shrisarasvatistotram sampurnam |
  devanagari: द्वेणीका विधिसुन्दरी मम भवेदानन्दसन्दोहिनी ॥ १॥ यत्पादाम्बुजसेवयैव ससुरो लोकः समर्त्यासुरो
    वागौन्नत्यमगाहत श्रुतिवचोवीथीषु या गीयते । या श्वेताम्बुजमध्यवासरसिका या नम्ररक्षामणिः धातुः कापि
    कुटुम्बिनी वितरतात् सा निर्वृतिं नोऽतुलाम् ॥ २॥ कस्तूरीघनसारगन्धलहरीसंवासितोरःस्थला संवीता स्फुटकाशपुष्पसदृशक्षौमांशुकेनानिशम्
    । पुस्तं हस्तचतुष्टये जपवटीं शस्तां शुकीं वल्लकीं बिभ्राणा गृहिणी विधातुरवतान्नः सेवया तोषिता ॥ ३॥
    शुभ्रं दभ्रवलग्नमभ्रतनु तेऽदभ्रप्रमोदप्रदं विभ्रान्ते भ्रमदन्धपरय सततं तैस्तैर्निजैर्विभ्रमैः । शब्दब्रह्ममये
    जगत्यनितरापेक्षाधिकारक्रियं किञ्चित्कुञ्चितकेशमद्य जयति स्रष्टुर्भुविष्ठं महः ॥ ४॥ इति श्रीसरस्वतीस्तोत्रं
    सम्पूर्णम् ।
