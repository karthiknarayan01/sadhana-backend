    महामारीविनाशनः । शिवः शिवतमो भेत्ता बलारातिप्रपूजकः ॥ ११॥ कुमारीवरदायी च वरेण्यो मीनकेतनः । नरो नारायणो
    धीरो राधापतिरुदारधीः ॥ १२॥ श्रीपतिः श्रीनिधिः श्रीमान् मापतिः प्रतिराजहा । वृन्दापतिः कुलग्रामी धामी
    ब्रह्म सनातनः ॥ १३॥ रेवतीरमणो रामः प्रियश्चञ्चललोचनः । रामायणशरीरोऽयं रामो रामः श्रियःपतिः ॥ १४॥ शर्वरः
    शर्वरी शर्वः सर्वत्र शुभदायकः । राधाराधयिताराधी राधाचित्तप्रमोदकः ॥ १५॥ राधारतिसुखोपेतः राधामोहनतत्परः
    । राधावशीकरो राधाहृदयाम्भोजषट्पदः ॥ १६॥ राधालिङ्गनसम्मोहः राधानर्तनकौतुकः । राधासञ्जातसम्प्रीतो राधाकाम्यफलप्रदः
