id: kyts-5-2-vishnumukhaa-vai-devaah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.2 Vishnumukhaa Vai Devaah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande dvitiyah prashnah cityupakramabhidhanam
    o shri gurubhyo namah | harih om || vishnumukha vai deva shchandobhiriman ~lokananapajayya mabhyajayan
    dvishnukraman kramate vishnureva bhutva yajamanashchandobhiriman ~lokananapajayyamabhi jayati vishnoh
    kramo bhimatihetyaha gayatri vai prithivi traishtubhamantariksha njagati dyauranushtubhirdisha shchandobhireveman
    ~lokan yatha purvamabhi jayati prajapatiragnimasrijata so metaya 'nvaidakrandaditi taya vai so 'varundha
    yadetamanvaha 'va rundha ishvaro va esha para mpradagho yo vishnukraman kramate catasribhira vartate
    catvari chandagmsi chandagmsi khalu va agneh priya tanuh priyamevasya tanuvamabhi paryavartate dakshina
    paryavartate svameva viryamanu paryavartate tasma 'rdha atmano viryavattaro ''vritamanu paryavartate
    shunashshepamajigartim ttaya vai sa atmanam mpratimuncata uduttamam shamityaha ''hyanagm harati dhruvastishtha
    'vicacalirityaha pratishthityai vishastva sarva vanchantvityaha vishaivainagm samardhayatyasmi nrashtramadhi
    shrayetyaha rashtramevasmi nkamayeta rashtragg tyagre brihannushasamurdhvo asthadityaha 'gramevainagm
    samanana nkaroti nirjagmiva ntamasa ityaha tama evasmadapa hanti jyotisha ''gadityaha jyotireva ndadhati
    catasribhih sadayati catvari chandagmsi chandobhireva ticchandasottamaya var shma va esha chandasam
    shmaivainagm samanana bhavati sattvamevaina ngamayati vathsaprenopa tishthata etena vai vathsaprirbhalandano
    'gnerevaitena priya mbhavatyekadhaiva yajamane virya ndadhati stomena vai deva asmin ~loka a rdhnuvan
    chandobhiramushmin thstomasyeva khalu va eta thsaprenopatishthata thsaprenopatishthate imameva tena
    lokamabhi jayati ya dvishnukraman kramate 'mumeva tairlokamabhi jayati purvedyuh prakramatyuttaredyu
    h rupa tishthate tasma kshemyasyeshe tasma kshemyamaddhyavasyati mushti karoti vacam ya~cchati yajnasya
    dhrityai 'nnasya no dehityaha mprayacchatyanamivasya shushmina ityaha yakshmasyeti vavaitadaha pra
    pradatara nno dhehi dvipade catushpada ityaha sta udu tva vishve deva ityaha prana vai vishve devah
    mudyacchate 'gne bharantu cittibhirityaha yasma evaina ncittayodyacchate tenaivainagm samardhayati
    catasribhira sadayati catvari chandagmsi chandobhireva ticchandasottamaya var shma va esha chandasam
    shmaivainagm samanana nkaroti sadvati bhavati sattvamevaina ngamayati predagne jyotishman yahityaha
    jyotirevasmi ndadhati tanuva va esha hinasti yagm hinasti ma higmsistanuva praja ityaha prajabhya
    evainagm shamayati rakshagmsi va eta dyajnagm sacante yadana uthsarja tyakrandadityanvaha rakshasamapahatya
    anasa vahan ndadhati tasmadanasvi ca rathi catithina nduvasyateti ghritanushiktamavasite samidhama
    dadhati yatha 'tithaya agataya sarpishvadatithya nkriyate tadrigeva ta hmanasya gayatro hi bra hmanastrishtubha
    rajanyasya traishtubho hi rajanyo 'phsu bhasma pra veshayatyaphsuyonirva agni ngamayati tisribhih
    praveshayati trivridva ngamayati para va esho 'phsu bhasma praveshayati jyotishmatibhya mava dadhati
    jyotireva mpratishthityai para va esha praja 'phsu bhasma praveshayati punarurja saha rayyeti punarudaiti
    prajameva pashunatma ndhatte punastva ndevata agre samai ndhata tabhirevainagm samindhe bodha sa bodhityupa
    tishthate bodhayatyevaina thsuptva prajah prabuddhyante yathasthanamupa tishthate tasma mpashavah
    punaretyopa tishthante || yavati vai prithivi tasyai yama adhipatya mpariyaya yo vai yama ndevayajanamasya
    aniryacya ncinute yamayainagm sa cinute tyaddhyavasayayati yamameva devayajanamasyai niryacya ncinuta
    ishvagrena va asya anamrita micchanto navinda dyajurapashyannapeteti yadetena ncinuta uddhanti yadevasya
    ameddhya kshati shantyai sikata ni vapatyetadva agnervai shvanarasya rupagm rupenaiva vai shvanaramava
    rundha usha nnivapati pushtirva esha prajananam ya~dushah pushtyameva prajanane jnannagg hyeta ya~dusha
    dyavaprithivi saha nte viyati abrutamastveva nau saha yajniyamiti yadamushya yajniyamasi tta usha
    abhavan yadasya yajniyamasi ttadadashcandramasi krishnamusha nnivapannado dhyaye ddyavaprithivyoreva
    yajniye ncinute 'yagm so agniriti vishvamitrasya mbhavatyetena vai vishvamitro ndhama 'varundhagnerevaitena
    priya ndhamava rundhe chandobhirvai deva lo~kamayan catasrah pracirupa dadhati catvari chandagmsi
    chandobhireva ta lo~kameti teshagm suvargam ssamavliyanta te dve purasta thsamici upadadhata dve thsamici
    tabhirvai tedisho 'drigmhan yaddve purasta thsamici upadadhati dve pashca vi~dhritya atho pashavo
    vai chandagmsi pashunevasmai samico dadhatyashtavupa dadhatyashtakshara gayatri gayatro 'shtavupa
    dadhatyashtakshara gayatri gayatri suvargam lo~kamanjasa veda suvargasya lokasya tyai trayodasha lokamprina
    upa dadhatyekavigmshati ssampadyante pratishtha va ekavigmshah pratishtha gar hapatya ekavigmshasyaiva
    pratishtha hapatyamanu prati tishthati pratyagni ncikyanastishthati ya evam ncinvanah pankto yajnah
    panktah pashavo yajnameva pashunava rundhe tricitika ncinvanastraya ime loka eshveva lokeshu ncinvana
    ekadha vai suvargo loka ekavritaiva suvargam lo~kameti purishenabhyuhati tasma nmagm senasthi channa
    nna dushcarma bhavati ya evam ve~da panca citayo bhavanti pancabhih purishairabhyuhati dasha sampadyante
    dasha 'nnadye pratitishthati || saptacatvarigmshacca vi va etau dvishate yashca pura 'gniryashcokhayagm
    samitamiti catasribhi nnivapati catvari chandagmsi chandagmsi khalu va agneh priya tanuh priyayaivainau
    tanuva sagm sha sti samitamityaha tasmadbrahmana kshatragm sameti yathsa nnyupya viharati tasma dbrahmana
    kshatram kshayanti sa ritubhireva vimucyo mateva putra mprithivi purishyamityaha ndikshayitvartubhirvi
    muncati vaishvanarya shikyama datte svadayatyevaina stushapakva bhavanti nir nkrishnagm rupenaiva
    nir rityai dik svayameva dishi nir nniravadayate svakrita irina upa dadhati pradare vaitadvai nir
    ritya ayatanagg sva eva nniravadayate shikyamabhyupa dadhati nair rito vai pashah sakshadevaina nmuncati
    tisra upa dadhati tredhavihito vai purusho yavaneva purushastasma ritimava yajate paracirupa mpranudate
    'pratikshama yanti nir hityai marjayitvopa tishthante meddhyatvaya gar hapatyamupa tishthante nir
    riti loka eva caritva puta devalokamupavartanta ekayopa tishthanta ekadhaiva yajamane virya ssangamano
    vasunamityaha praja vai pashavo vasu prajayaivaina purushamatrena vi mimite yajnena vai purusha ssammito
    yajnaparushaivainam npurusha urdhvabahustava nbhavatyetavadvai purushe viryam vi~ mimite pakshi bhavati
    na hyapakshah patitu hatyaratnina pakshau draghiyagmsau bhavatastasma tpakshapravayagmsi vayagmsi
    vyamamatrau pakshau ca puccha nca bhavatyetavadvai purushe viryam ~viryasammito venuna vi mimita agneyo
    vai venuh sayonitvaya yajusha yunakti yajusha krishati vyavrittyai shadgavena krishati sha dva ritava
    ritubhirevaina bhavatyasya anatidahaya bhavatyasya anatidahaya dviguna nca bhavatyagnerudyatya etavanto
    vai pashavo dvipadashca catushpadashca tan drudrayapi daddhya ddakshina pitribhyo nidhuvedya tpratico
    rakshagmsi hanyurudica uthsrijatyesha vai devamanushyanagm shanta di thsrijatyatho khalvima thsrijatyasau
    va adityah pranah pranamevaina nanuthsrijati dakshina paryavartante svameva viryamanu paryavartante
    tasma 'rdha atmano viryavattaro ''vritamanu paryavartante tasma ncah pashavo vi tishthante pratyanca
    a vartante tisrastisra krishati trivritameva krishati trivritameva yajnamukhe vi yatayatyoshadhirvapati
    brahmana 'nnamava rundhe 'rke 'rkashciyate caturdashabhirvapati sapta gramya oshadhaya ''ranya ubhayishamavaruddhya
    annasyannasya vapatyannasya nnasyavaruddhyai krishte vapati krishte hyoshadhayah pratitishthantyanusitam
    tyai dvadashasu sitasu vapati dvadasha masa va~thsarenaivasma anna ruddhena vyriddhyeta ye vanaspatina
    varuddhyai digbhyo loshtan thsamasyati dishameva viryamavaruddhya disham ttasyai disho loshtama haredisha
    murjamahamita a dada itishamevorja 'va rundhe kshodhuko bhavati yastasya ndishi bhavatyuttaravedimupa
    vapatyuttaravedyag hyagnishciyate 'tho pashavo va uttaravedih pashunevava rundhe ca bhavatyetavadvai
    purushe viryam agne tava shravo vaya iti sikata ni vapatyetadva agnervai shvanarasya suktagm suktenaiva
    vai shvanaramava rundhe shadbhirni vapati shadva ritavah sam shvanaramava rundhe samudram vai~ namaitacchandah
    samudramanu prajah prajayante yadetena sikata ni vapati prajanam thsphyastritiyagm rathastritiyam
    ntaccharkaranagm sharkaratvam va~jro vai sharkarah pashuragni ryaccharkarabhiragni mpariminoti vajrenaivasmai
    pashu npari grihnati tasma dvajrena pashavah parigrihitastasma thstheyanastheyaso nopa harate trisaptabhih
    pashukamasya pranah pranah pashavah pranairevasmai pashunava rundhe trinavabhi strivritameva vajragm
    sambhritya bhratrivyaya praharati stritya aparimitabhih pari minuya ssyadityaparimitya tasya sharkara
    ssikata vyuhedaparigrihita evasya vishucinagm retah para sincatyapashureva bhavati thsyaditi parimitya
    tasya sharkara tparigrihita evasmai samicinagm retah sincati pashumaneva bhavati saumya vyuhati somo
    vai retodha reta eva ta ddadhati gayatriya bra hmanasya gayatro hi bra strishtubha rajanyasya traishtubho
    hi rajanyah shamyu dyadashvamakramayati ya eva medho ttamevava rundhe prajapatina 'gnishcetavya ityahuh
    prajapatyo 'shvo yadashvamakramayati prajapatinaiva ncinute pushkaraparnamupa dadhati yonirva agneh
    pushkaraparnagm sayoni mprishthamasityupa dadhatyapam tpushkaraparnagm rupenaivainadupa dadhati ||
    brahma jajnanamiti rukmamupa dadhati brahmamukha vai prajapatih praja asrijata brahmamukha eva ta
    ssrijate brahma jajnanamityaha tasma dbrahmano mukhyo mukhyo bhavati ya evam ve~da brahmavadino vadanti
    na prithivya nnantarikshe na divyagnishcetavya iti ya ncinvita prithivigm shuca 'rpayennaushadhayo
    na vanaspatayah yadantarikshe cinvitantarikshagm shuca 'rpayenna vayagmsi pra jayeran ddivi cinvita
    divagm shuca 'rpayenna parjanyo var shedrukmamupa dadhatyamritam vai~ hiranyamamrita evagni mpurushamupa
    dadhati yajamanalokasya vidhrityai yadishtakaya atrinnamanupadaddhya nca yajamanasya ca pranamapi
    daddhya prancamupa dadhati dadhara yajamanaloka nca yajamanasya ca pranamapi dadhatyatho khalvishtakaya
    atrinnamanupa dadhati prananamuthsrishtyai draphsashcaskandetyabhi mrishati hotra mpratishthapayati
    srucavupa dadhatyajyasya purna dubamrime evopa dhatte tushnimupa dadhati na hime yajusha ntasmadasya
    asavuttara ''jyasya purna shmaryo vajrenaiva yajnasya dakshinato rakshagsyapa hanti daddhnah purnamaudumbari
    mpashavo vai daddhyurgudumbarah pashushvevorja ndadhati purne upa dadhati purne evaina mamushmin ~loka
    upatishthete virajyagnishcetavya ityahu thsrucavupadadhati virajyevagni ncinute yajnamukheyajnamukhe
    vai kriyamane yajnagm rakshagmsi jighagmsanti yajnamukhagm rukmo ya vya~gharayati yajnamukhadeva rakshagsyapa
    hanti pancabhi rvyagharayati pankto yajno yavaneva yajnastasma drakshagsyapa hantyakshnayavya gharayati
    tasmadakshnaya pashavo 'ngani pra haranti pratishthityai || svayamatrinnamupa dadhatiyam vai~ svayamatrinnemamevopa
    dhatte 'shvamupa ghrapayati pranamevasya prajapatyo va ashvah prajapatinaiva ncinute prathameshtakopadhiyamana
    pashuna nca yajamanasya ca pranamapi dadhati svayamatrinna bhavati prananamuthsrishtya atho suvargasya
    lokasyanukhyatya agnavagnishcetavya ityahuresha va hmanashcopa daddhyata ncinuta ishvaro va esha artimartoryo
    ttrayo vai pranah prananag sprityai dvaveva deyau dvau hi pranaveka eva deya eko hi pranah pashu rva
    esha yadagnirna khalu vai pashava ayavase ramante durveshtakamupa dadhati pashuna mpratishthityai
    kanda tprarohantityaha kandenakandena hyesha pratitishthatyeva no durve pratanu sahasrena shatena
    cetyaha sahasrah prajapatih prajapateraptyai devalakshmam vai~ tryalikhita tamuttaralakshmana nkamayeta
    vasiyan thsyadityuttaralakshmana dvasiyaneva bhavati ya nkamayeta papiyan thsyadityadharalakshmana
    ntasyopa daddhyadasurayoni mevainamanu para bhavayati papiya nbhavati tryalikhita bhavatime vai lokastryalikhitaibhya
    eva lokebhyo bhratrivyamantaretyangirasa ya~tah purodashah kurmo bhutva tkurmamupadadhati tkurmamupadadhati
    yatha kshetravidanjasa nayatyevamevaina lo~kamanjasa nayati medho va esha pashunam tkurmamupa dadhati
    svameva medha mpashyantah pashava upa tishthante shmashanam tkriyate yanmritana mpashunagm shirshanyupadhiyante
    yajjivanta nkurmamupa dadhati tenashmashanacidvastavyo va esha ya tkurmo madhu vata ritayata iti daddhna
    madhumishrenabhyanakti svadayatyevaina mmadhu yaddaddhna madhumishrena bhyanaktyubhayasya 'varuddhyai
    mahi dyauh prithivi ca na ityaha ''bhyamevainamubhayatah parigrihnati prancamupa dadhati suvargasya
    lokasya samashtyai purasta tpratyancamupa dadhati tasma tpratyancah pashavo medhamupa tishthante yo
    va apanabhimagni ncinute yajamanasya nabhimanu pravishati sa enamishvaro higmsitorulukhalamupa dadhatyesha
    va agnernabhi ncinute higmsaya audumbara mbhavatyurgva udumbara urjamevava rundhe maddhyata upa dadhati
    maddhyata evasma urja nmaddhyata urja bhunjata iya dbhavati prajapatina yajnamukhena sammitamava hantyannamevaka
    rvaishnavyarcopa dadhati vishnurvai yajno vai shnava vanaspatayo yajna eva yajna tyebhya eva lokebhyo
    jyotirava rundhe maddhyata upa dadhati maddhyata evasmai jyotirdadhati tasma nmaddhyato jyotirupa
    ''smahe sikatabhih purayatyetadva agnervai shvanarasya rupagm rupenaiva vai shvanaramava rundhe ya
    nkamayeta kshodhuka tkshodhuka eva bhavati ya dannamadyaditi purna ntasyopa daddhyadanupadasya devannamatti
    sahasram vai~ prati purushah pashunam ya~cchati sahasramanye pashavo maddhye purushashirshamupa dadhati
    saviryatvayo khayamapi dadhati pratishthamevaina tpranairameddhyam tpurushashirshamamrita mpraneshu
    hiranyashalka npratyasyati pratishthamevaina ssamardhayati daddhna madhumishrena purayati madhavyo
    'saniti shritatankyena meddhyatvaya gramyam mmadhu yaddaddhna madhumishrena purayatyubhayasya varuddhyai
    pashushirshanyupa dadhati pashavo vai pashushirshani pashunevava rundhe ya vishucinani tasyopa daddhya
    ndadhatyapashureva bhavati ya thsyaditi samicinani tasyopa daddhya thsamica evasmai pashu ndadhati
    pashumaneva bhavati purasta tpraticinamashvasyopa dadhati pashca tpracinamrishabhasya pashavo va anye
    go ashvebhyah pashavo go ashvanevasmai samico dadhatye dvipadashca catushpadashca tan va etadagnau
    pradadhati ya tpashushirshanyupa mumaranyamanu te dishamityaha gramyebhya eva pashubhya aranya npashunchucamanuthsrijati
    tasma maranyah pashavah kaniyagmsa ssarpashirshamupa dadhati yaiva sarpe tvishistameva mpashushirshairupa
    daddhya yajureva vadedava ta ntvishigm rundhe ya sarpe na gramya ''ranyanatho khalupadheyameva yadupadadhati
    tena ta ntvishimava rundhe ya sarpe ya dyajurvadati tena shantam || catushcatvarigmshacca pashurva
    esha yadagniryonih khalu va esha pashorvi kriyate ya dyajuh kriyate reto 'pasya apasya upa dadhati
    yonaveva reto dadhati pancopa dadhati panktah pashavah pashunevasmai prajanayati panca dakshinato
    vajro va apasya vajrenaiva yajnasya dakshinato rakshagsyapa hanti panca pashca tpracirupa dadhati
    pashcadvai pracinagm reto dhiyate pashcadevasmai pracinagm reto dadhati panca purasta tpraticirupa
    dadhati panca pashca tpracinagm reto dhiyate praticih praja jayante panco ttarata shchandasyah pashavo
    vai chandasyah pashuneva prajatan thsvamayatanamabhi paryuhata iyam tta upadhatta tato va ima tyasya
    anatidahayovaca heyamadadi ya~syaita upadhiyantai ya u caina evam ve~ daditi pranabhrita upa dadhati
    retasyeva prana bhuva iti purastadupa dadhati pranamevaitabhi ndakshina vishvakarmeti dakshinato mana
    evaitabhirdadharaya dvishvavyaca iti pashca shshrotramevaitabhi rdadhareyamupari matirityuparishta
    rdadhara dashadashopa dadhati saviryatvaya pa dadhati tasmadakshnaya pashavo 'ngani praharanti pratishthityai
    yah pracistabhi rvasishtha ardhnodya dakshina tabhirbharadvajo yah praticistabhi rvishvamitro ya udicistabhi
    rjamadagnirya urdhvastabhi rvishvakarma ya evametasamriddhim ve~dardhnotyeva ya asameva ve~da pratyeva
    tishthati pranabhrita upadhaya sam ya~ta upa dadhati prananeva 'smi ncarato vishucirupa dadhati tasma
    dvishvancau pranapanau yadva agnerasam ya~ta upa dadhati samevainam ya~cchati uvargyamevaka stryavirvayah
    kritamayanamityaha vayobhirevayanava rundhe 'yairvayagmsi sarvato vayumati rbhavanti tasmadayagm sarvatah
    pavate || kpanktya saha | brihatyushniha kaku thsucibhih shimyantu tva || dvipada ya catushpada tripada
    yaca shatpada | sachanda ya ca vicchanda ssucibhih shimyantu tva || mahana mni revatayo vishva ashah
    prasuvarih | meghya vidyuto vacah sucibhih shimyantu tva || rajata harini ssisa yujo yujyante karmabhih
    | ashvasya vajinastvaci sucibhih shimyantu tva || nari ste patnayo loma vicinvantu manishaya mpatnirdishah
    sucibhih shimyantu tva || kuvidanga yavamanto yava ncidyatha dantyanupurvam vi~yuya | ihehaisha nkrinuta
    bhojanani ye barhisho namovrikti cchyati kastva vi sha sti kaste gatrani shimyati | ka u te shamita
    kavih || ritavasta ritudha paruh shamitaro vishasatu | sam va~thsarasya dhayasa shimibhi shshimyantu
    tva || daivya addhvaryavastva cchyantu vi ca shasatu | gatrani parvashaste shimah krinvantu shimyantah
    || ardhamasah parugmshi te masa shchyantu shimyantah | ahoratrani maruto vilishtagm sudayantu te ||
    prithivi te 'ntarikshena vayushchidra mbhishajyatu | dyauste nakshatrai nkrinotu sadhuya || sha shshamastvavarebhyah
    | shamasthabhyo majjabhya shshamu te tanuve bhuvat || 'gne tava shravo vayo || harih om || || krishna
    yajurvediya taittiriya samhitaya mpancamakande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे द्वितीयः प्रश्नः चित्युपक्रमाभिधानं ओ
    श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ विष्णु॑मुखा॒ वै दे॒वा श्छन्दो॑भिरि॒मान् ँलो॒कान॑नपज॒य्य म॒भ्य॑जय॒न्॒
    द्वि॑ष्णुक्र॒मान् क्रम॑ते॒ विष्णु॑रे॒व भू॒त्वा यज॑मान॒श्छन्दो॑भिरि॒मान् ँलो॒कान॑नपज॒य्यम॒भि ज॑यति॒
    विष्णोः॒ क्रमो भिमाति॒हेत्या॑ह गाय॒त्री वै पृ॑थि॒वी त्रैष्टु॑भम॒न्तरि॑क्ष॒ ञ्जाग॑ती॒ द्यौरानु॑ष्टुभी॒र्दिश॒
    श्छन्दो॑भिरे॒वेमान् ँलो॒कान् य॑था पू॒र्वम॒भि ज॑यति प्र॒जाप॑तिर॒ग्निम॑सृजत॒ सो मे॒तया ऽन्वै॒दक्र॑न्द॒दिति॒
