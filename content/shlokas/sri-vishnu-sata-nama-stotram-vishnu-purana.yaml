id: sri-vishnu-sata-nama-stotram-vishnu-purana
category: stotram
name:
  english: Sri Vishnu Sata Nama Stotram (Vishnu Purana)
content:
  english: '|| shri vishnu ashtottara shatanamastotram || vasudevam hrishikesham vamanam jalashayinam
    | janardanam harim krishnam shrivaksham garudadhvajam || || varaham pundarikaksham nrisimham narakantakam
    | avyaktam shashvatam vishnumanantamajamavyayam || || narayanam gadadhyaksham govindam kirtibhajanam
    | govardhanoddharam devam bhudharam bhuvaneshvaram || || vettaram yajnapurusham yajnesham yajnavahanam
    | cakrapanim gadapanim shankhapanim narottamam || || vaikuntham dushtadamanam bhugarbham pitavasasam
    | trivikramam trikalajnam trimurtim nandakeshvaram || || ramam ramam hayagrivam bhimam ra''udram bhavodbhavam
    | shripatim shridharam shrisham mangalam mangalayudham || || damodaram damopetam keshavam keshisudanam
    | varenyam varadam vishnumanandam vasudevajam || || hiranyaretasam diptam puranam purushottamam |
    sakalam nishkalam shuddham nirgunam gunashashvatam || || hiranyatanusankasham suryayutasamaprabham
    | meghashyamam caturbahum kushalam kamalekshanam || || jyotirupamarupam ca svarupam rupasamsthitam
    | sarvajnam sarvarupastham sarvesham sarvatomukham || || jnanam kutasthamacalam jnhanadam paramam
    prabhum | yogisham yoganishnatam yogisamyogarupinam || || ishvaram sarvabhutanam vande bhutamayam
    prabhum | iti namashatam divyam vaishnavam khalu papaham || || vyasena kathitam purvam sarvapapapranashanam
    | yah pathet pratarutthaya sa bhaved vaishnavo narah || || sarvapapavishuddhatma vishnusayujyamapnuyat
    | candrayanasahasrani kanyadanashatani ca || || gavam lakshasahasrani muktibhagi bhavennarah | ashvamedhayutam
    punyam phalam prapnoti manavah || || || iti shrivishnupurane shri vishnu ashtottara shatanastotram
    ||'
  devanagari: ॥ श्री विष्णु अष्टोत्तर शतनामस्तोत्रम् ॥ वासुदेवं हृषीकेशं वामनं जलशायिनम् । जनार्दनं हरिं
    कृष्णं श्रीवक्षं गरुडध्वजम् ॥ ॥ वाराहं पुण्डरीकाक्षं नृसिंहं नरकान्तकम् । अव्यक्तं शाश्वतं विष्णुमनन्तमजमव्ययम्
    ॥ ॥ नारायणं गदाध्यक्षं गोविन्दं कीर्तिभाजनम् । गोवर्धनोद्धरं देवं भूधरं भुवनेश्वरम् ॥ ॥ वेत्तारं यज्ञपुरुषं
    यज्ञेशं यज्ञवाहनम् । चक्रपाणिं गदापाणिं शङ्खपाणिं नरोत्तमम् ॥ ॥ वैकुण्ठं दुष्टदमनं भूगर्भं पीतवाससम्
    । त्रिविक्रमं त्रिकालज्ञं त्रिमूर्तिं नन्दकेश्वरम् ॥ ॥ रामं रामं हयग्रीवं भीमं रऽउद्रं भवोद्भवम् ।
    श्रीपतिं श्रीधरं श्रीशं मङ्गलं मङ्गलायुधम् ॥ ॥ दामोदरं दमोपेतं केशवं केशिसूदनम् । वरेण्यं वरदं विष्णुमानन्दं
    वसुदेवजम् ॥ ॥ हिरण्यरेतसं दीप्तं पुराणं पुरुषोत्तमम् । सकलं निष्कलं शुद्धं निर्गुणं गुणशाश्वतम् ॥
    ॥ हिरण्यतनुसङ्काशं सूर्यायुतसमप्रभम् । मेघश्यामं चतुर्बाहुं कुशलं कमलेक्षणम् ॥ ॥ ज्योतीरूपमरूपं च
    स्वरूपं रूपसंस्थितम् । सर्वज्ञं सर्वरूपस्थं सर्वेशं सर्वतोमुखम् ॥ ॥ ज्ञानं कूटस्थमचलं ज्ञ्हानदं परमं
    प्रभुम् । योगीशं योगनिष्णातं योगिसंयोगरूपिणम् ॥ ॥ ईश्वरं सर्वभूतानां वन्दे भूतमयं प्रभुम् । इति नामशतं
    दिव्यं वैष्णवं खलु पापहम् ॥ ॥ व्यासेन कथितं पूर्वं सर्वपापप्रणाशनम् । यः पठेत् प्रातरुत्थाय स भवेद्
    वैष्णवो नरः ॥ ॥ सर्वपापविशुद्धात्मा विष्णुसायुज्यमाप्नुयात् । चान्द्रायणसहस्राणि कन्यादानशतानि च ॥
    ॥ गवां लक्षसहस्राणि मुक्तिभागी भवेन्नरः । अश्वमेधायुतं पुण्यं फलं प्राप्नोति मानवः ॥ ॥ ॥ इति श्रीविष्णुपुराणे
    श्री विष्णु अष्टोत्तर शतनास्तोत्रम् ॥
