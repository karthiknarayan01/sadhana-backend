id: lakshmi-narasimha-ashtottara-sata-namavali
category: stotram
name:
  english: Lakshmi Narasimha Ashtottara Sata Namavali
content:
  english: om narasimhaya namah om mahasimhaya namah om divya simhaya namah om mahabalaya namah om ugra
    simhaya namah om mahadevaya namah om stambhajaya namah om ugralocanaya namah om raudraya namah om
    sarvadbhutaya namah || || om shrimate namah om yoganandaya namah om trivikramaya namah om haraye namah
    om kolahalaya namah om cakrine namah om vijayaya namah om jayavarnanaya namah om pancananaya namah
    om parabrahmane namah || || om aghoraya namah om ghora vikramaya namah om jvalanmukhaya namah om maha
    jvalaya namah om jvalamaline namah om maha prabhave namah om nitalakshaya namah om sahasrakshaya namah
    om durnirikshaya namah om pratapanaya namah || || om mahadamshtrayudhaya namah om prajnaya namah om
    candakopine namah om sadashivaya namah om hiranyaka shipudhvamsine namah om daityadana vabhanjanaya
    namah om gunabhadraya namah om mahabhadraya namah om balabhadrakaya namah om subhadrakaya namah ||
    || om karalaya namah om vikaralaya namah om vikartre namah om sarvartrakaya namah om shimshumaraya
    namah om trilokatmane namah om ishaya namah om sarveshvaraya namah om vibhave namah om bhairavadambaraya
    namah || || om divyaya namah om acyutaya namah om kavaye namah om madhavaya namah om adhokshajaya
    namah om aksharaya namah om sharvaya namah om vanamaline namah om varapradaya namah om adhbhutaya
    namah om bhavyaya namah om shrivishnave namah om purushottamaya namah om anaghastraya namah om nakhastraya
    namah om surya jyotishe namah om sureshvaraya namah om sahasrabahave namah om sarvajnaya namah ||
    || om sarvasiddha pradayakaya namah om vajradamshtraya namah om vajranakhaya namah om mahanandaya
    namah om parantapaya namah om sarvamantraika rupaya namah om sarvatantratmakaya namah om avyaktaya
    namah om suvyaktaya namah || || om vaishakha shukla bhutotdhaya namah om sharanagata vatsalaya namah
    om udara kirtaye namah om punyatmane namah om danda vikramaya namah om vedatraya prapujyaya namah
    om bhagavate namah om parameshvaraya namah om shri vatsankaya namah || || om shrinivasaya namah om
    jagadvyapine namah om jaganmayaya namah om jagatbhalaya namah om jagannadhaya namah om mahakayaya
    namah om dvirupabhrate namah om paramatmane namah om parajyotishe namah om nirgunaya namah || || om
    nrike sarine namah om paratattvaya namah om parandhamne namah om saccidananda vigrahaya namah om lakshminrisimhaya
    namah om sarvatmane namah om dhiraya namah om prahlada palakaya namah om shri lakshmi narasimhaya
    namah ||
