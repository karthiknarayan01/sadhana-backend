id: ishvaraproktam
category: upanishad
name:
  english: ishvaraproktam
  devanagari: ईश्वरप्रोक्तम्
content:
  english: nityamavyabhicarena pujayadhvam tatah shivam | pujitah shrimahadevo moksham dasyatyasamshayam
    || 494|| shrirudraya nivedyannam bhoktavyam pratyaham dvijah | rudrabhishiktamevambhah pitavyam pratyaham
    dvijaih || 495|| shrirudraghratamaghreyam patrapushpadikam dvijaih | paridheyam navam vastram shrirudraya
    samarpitam || 496|| sarvada shivanamaiva japaniyam dvijairdvijah | sarvada shivapujaiva kartavya muktikankshibhih
    || 497|| shivapujaiva sarvesham muktida mangalavaha | shivarcanam vihayanyannasti mokshasya sadhanam
    || 498|| shivarcanavihinanamapi muktirbhavedyadi | tada vindhyo'pi jaladhim taredeva na samshayah
    || 499|| shivarcanam vina moksho na bhavishyati sarvatha | satyametatpunah satyamuddhritya bhujamucyate
    || 500|| shivasyaiva prasadena muktah purvam munishvarah | sa shivasya prasadattu na shivaradhanam
    vina || 501|| shivaradhanahinanam shivo naiva prasidati | shivaprasadavirahe moksho'pi na bhavishyati
    || 502|| yenaivavyabhicarena kritam shankarapujanam | tenaiva shankarah prapyah prasado muktidayakah
    || 503|| atyantadurlabha muktih sa tu shankarapujaya | atyantasulabha jata shankaraikaratatmanam ||
    504|| shankaraikarata dhanyah shankaraikarcanapriyah | atastaih prapyate moksho durlabho'pyatililaya
    || 505|| yatha grihapatih sviyam griham grihapatiryatha | shivaikasharano martyah shivam prapnoti
    lilaya || 506|| svadhinamannam kshudhito yatha bhunkte muda tatha | shivaikasharano martyah shivam
    prapnoti lilaya || 507|| yuva yatha svakam kantam prapnoti muditastatha | shivaikasharano martyah
    shivam prapnoti lilaya || 508|| muktidah shiva evatah sa shivah shaivavatsalah | shaivebhya eva santushto
    muktimishtam prayacchati || 521|| kalpante mucyate martyo brahmahapi munishvarah | ashaivastvashivacarah
    kalpante'pi na mucyate || 522|| ato yatnena satata yuyam muktyarthino dvijah | pujayadhvam mahadevam
    sarvadevashikhamanim || 523|| ato bhajadhvamanisham bhagavantamumapatim | yuyam vina vilambena pashupashavimocakam
    || 531|| bhagavan shrimaharudradaparo nasti sarvatha | satyametatpunah satyamuddhritya bhujamucyate
    || 532|| yo vai rudrah sa bhagavanityatharvashirah svayam | bhagavan rudra eveti vadatyeva muhurmuhuh
    || 533|| tasmatsa eva bhagavaniti
  devanagari: नित्यमव्यभिचारेण पूजयध्वं ततः शिवम् । पूजितः श्रीमहादेवो मोक्षं दास्यत्यसंशयम् ॥ ४९४॥ श्रीरुद्राय
    निवेद्यान्नं भोक्तव्यं प्रत्यहं द्विजाः । रुद्राभिषिक्तमेवाम्भः पीतव्यं प्रत्यहं द्विजैः ॥ ४९५॥ श्रीरुद्राघ्रातमाघ्रेयं
    पत्रपुष्पादिकं द्विजैः । परिधेयं नवं वस्त्रं श्रीरुद्राय समर्पितम् ॥ ४९६॥ सर्वदा शिवनामैव जपनीयं द्विजैर्द्विजाः
    । सर्वदा शिवपूजैव कर्तव्या मुक्तिकाङ्क्षिभिः ॥ ४९७॥ शिवपूजैव सर्वेषां मुक्तिदा मङ्गलावहा । शिवार्चनं
    विहायान्यन्नास्ति मोक्षस्य साधनम् ॥ ४९८॥ शिवार्चनविहीनानामपि मुक्तिर्भवेद्यदि । तदा विन्ध्योऽपि जलधिं
    तरेदेव न संशयः ॥ ४९९॥ शिवार्चनं विना मोक्षो न भविष्यति सर्वथा । सत्यमेतत्पुनः सत्यमुद्धृत्य भुजमुच्यते
    ॥ ५००॥ शिवस्यैव प्रसादेन मुक्ताः पूर्वं मुनीश्वराः । स शिवस्य प्रसादात्तु न शिवाराधनं विना ॥ ५०१॥
    शिवाराधनहीनानां शिवो नैव प्रसीदति । शिवप्रसादविरहे मोक्षोऽपि न भविष्यति ॥ ५०२॥ येनैवाव्यभिचारेण कृतं
    शङ्करपूजनम् । तेनैव शाङ्करः प्राप्यः प्रसादो मुक्तिदायकः ॥ ५०३॥ अत्यन्तदुर्लभा मुक्तिः सा तु शङ्करपूजया
    । अत्यन्तसुलभा जाता शङ्करैकरतात्मनाम् ॥ ५०४॥ शङ्करैकरता धन्याः शङ्करैकार्चनप्रियाः । अतस्तैः प्राप्यते
    मोक्षो दुर्लभोऽप्यतिलीलया ॥ ५०५॥ यथा गृहपतिः स्वीयं गृहं गृहपतिर्यथा । शिवैकशरणो मर्त्यः शिवं प्राप्नोति
    लीलया ॥ ५०६॥ स्वाधीनमन्नं क्षुधितो यथा भुङ्क्ते मुदा तथा । शिवैकशरणो मर्त्यः शिवं प्राप्नोति लीलया
    ॥ ५०७॥ युवा यथा स्वकां कान्तां प्राप्नोति मुदितस्तथा । शिवैकशरणो मर्त्यः शिवं प्राप्नोति लीलया ॥ ५०८॥
    मुक्तिदः शिव एवातः स शिवः शैववत्सलः । शैवेभ्य एव सन्तुष्टो मुक्तिमिष्टां प्रयच्छति ॥ ५२१॥ कल्पान्ते
    मुच्यते मर्त्यो ब्रह्महापि मुनीश्वराः । अशैवस्त्वशिवाचारः कल्पान्तेऽपि न मुच्यते ॥ ५२२॥ अतो यत्नेन
    सतत यूयं मुक्त्यर्थिनो द्विजाः । पूजयध्वं महादेवं सर्वदेवशिखामणिम् ॥ ५२३॥ अतो भजध्वमनिशं भगवन्तमुमापतिम्
    । यूयं विना विलम्बेन पशुपाशविमोचकम् ॥ ५३१॥ भगवान् श्रीमहारुद्रादपरो नास्ति सर्वथा । सत्यमेतत्पुनः
    सत्यमुद्धृत्य भुजमुच्यते ॥ ५३२॥ यो वै रुद्रः स भगवानित्यथर्वशिरः स्वयम् । भगवान् रुद्र एवेति वदत्येव
    मुहुर्मुहुः ॥ ५३३॥ तस्मात्स एव भगवानिति
