id: dhumravarnastotramshrishivakritam
category: stotram
name:
  english: dhumravarnastotramshrishivakritam
  devanagari: धूम्रवर्णस्तोत्रम्श्रीशिवकृतं
content:
  english: shrishivakritam dhumravarnastotram || shriganeshaya namah || namaste dhumravarnaya nanakhelakaraya
    ca | ameyashaktaye tubhyam mayine dharmarakshine || 5|| anathanam pranathaya nathanathaya te namah
    | sagunaya namastubhyam nirgunaya namo namah || 6|| sagunanirgunabhyam ca hinaya yogarupine | yogakarena
    sarvatra samsthitaya namo namah || 7|| narakunjararupaya dhumravarnadharaya ca | dvibhujayashvavahaya
    herambaya namo namah || 8|| khadgacarmadharayaiva nana candanacarcita | nana pushpadharayaiva sarvadhyakshaya
    te namah || 9|| purnaya purnarupaya ganeshaya paratmane | dharmaraksha mahabhaga gajanana namo'stu
    te || 10|| dharmanna amarah sarve sureshvara kritastvaya | nashte dharme'dhuna natha marishyamastvadagratah
    || 11|| buddhamayasahayena kalina nirjita vayam | vishnushambhumukha devastan palaya mahodara || 12||
    sardhena dvisahasrena prabho varshairvinirjitah | kshudradevah svagramasthah kalina papalushca te
    || 13|| tatah pancasahasrena varshaistastirthadevatah | tirthani kalina natha jitani papalustatha
    || 14|| tato dashasahasrena jita vishnushivadayah | kalina prithivim tyaktva papalurdevasattamah ||
    15|| karmakarmavikarmakhya shaktistatra sthita bhavet | vikarmagunasamyukta buddhamayatmika prabho
    || 16|| tvamapi tvadrisho bhutva phaladata sthitah svayam | devarupadharah svamin sada kalipravartakah
    || 17|| na te devasvarupam tu kalih krodhasamanvitah | chettum samudyatah kvapi tvam cintayati sarvada
    || 18|| tava cintanabhavena vayam sarve parajitah | kalina devadevesha uposhanayutah kritah || 19||
    adhuna leshamatrena dharmastishthati vighnapa | tam hanishyati vegena kalih paramadarunah || 20||
    nashte dharme ganadhisha adharmah kevalo mahan | bhavishyati punardharmam kim srakshyasi ca devapa
    || 21|| ato leshamayam dharmam rakshasva gananayaka | noceddharmasharirastu vayam nashta bhavamahe
    || 22|| raksha raksha dayasindho dhumravarna gajanana | mrityuprayananathamshca devan dharmaprarakshakan
    || 23|| evamuktva ganadhisham pranemuramarah punah | rurudurduhkhasamyuktamstan jagada gajananah ||
    24||
  devanagari: श्रीशिवकृतं धूम्रवर्णस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ नमस्ते धूम्रवर्णाय नानाखेलकराय च । अमेयशक्तये
    तुभ्यं मायिने धर्मरक्षिणे ॥ ५॥ अनाथानां प्रणाथाय नाथनाथाय ते नमः । सगुणाय नमस्तुभ्यं निर्गुणाय नमो
    नमः ॥ ६॥ सगुणनिर्गुणाभ्यां च हीनाय योगरूपिणे । योगाकारेण सर्वत्र संस्थिताय नमो नमः ॥ ७॥ नरकुञ्जररूपाय
    धूम्रवर्णधराय च । द्विभुजायाश्ववाहाय हेरम्बाय नमो नमः ॥ ८॥ खड्गचर्मधरायैव नाना चन्दनचर्चित । नाना
    पुष्पधरायैव सर्वाध्यक्षाय ते नमः ॥ ९॥ पूर्णाय पूर्णरूपाय गणेशाय परात्मने । धर्मरक्ष महाभाग गजानन नमोऽस्तु
    ते ॥ १०॥ धर्मान्ना अमराः सर्वे सुरेश्वर कृतास्त्वया । नष्टे धर्मेऽधुना नाथ मरिष्यामस्त्वदग्रतः ॥ ११॥
    बुद्धमायासहायेन कलिना निर्जिता वयम् । विष्णुशम्भुमुखा देवास्तान् पालय महोदर ॥ १२॥ सार्धेन द्विसहस्रेण
    प्रभो वर्षैर्विनिर्जिताः । क्षुद्रदेवाः स्वग्रामस्थाः कलिना पपलुश्च ते ॥ १३॥ ततः पञ्चसहस्रेण वर्षैस्तास्तीर्थदेवताः
    । तीर्थानि कलिना नाथ जितानि पपलुस्तथा ॥ १४॥ ततो दशसहस्रेण जिता विष्णुशिवादयः । कलिना पृथिवीं त्यक्त्वा
    पपलुर्देवसत्तमाः ॥ १५॥ कर्माकर्मविकर्माख्या शक्तिस्तत्र स्थिता भवेत् । विकर्मगुणसंयुक्ता बुद्धमायात्मिका
    प्रभो ॥ १६॥ त्वमपि त्वादृशो भूत्वा फलदाता स्थितः स्वयम् । देवरूपधरः स्वामिन् सदा कलिप्रवर्तकः ॥ १७॥
    न ते देवस्वरूपं तु कलिः क्रोधसमन्वितः । छेत्तुं समुद्यतः क्वापि त्वां चिन्तयति सर्वदा ॥ १८॥ तव चिन्तनभावेन
    वयं सर्वे पराजिताः । कलिना देवदेवेश उपोषणयुताः कृताः ॥ १९॥ अधुना लेशमात्रेण धर्मस्तिष्ठति विघ्नप ।
    तं हनिष्यति वेगेन कलिः परमदारुणः ॥ २०॥ नष्टे धर्मे गणाधीश अधर्मः केवलो महान् । भविष्यति पुनर्धर्मं
    किं स्रक्ष्यसि च देवप ॥ २१॥ अतो लेशमयं धर्मं रक्षस्व गणनायक । नोचेद्धर्मशरीरास्तु वयं नष्टा भवामहे
    ॥ २२॥ रक्ष रक्ष दयासिन्धो धूम्रवर्ण गजानन । मृत्युप्रायाननाथांश्च देवान् धर्मप्ररक्षकान् ॥ २३॥ एवमुक्त्वा
    गणाधीशं प्रणेमुरमराः पुनः । रुरुदुर्दुःखसंयुक्तांस्तान् जगाद गजाननः ॥ २४॥
