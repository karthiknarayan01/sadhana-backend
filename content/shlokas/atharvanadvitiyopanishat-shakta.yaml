id: atharvanadvitiyopanishat-shakta
category: upanishad
name:
  english: atharvanadvitiyopanishat (shakta)
  devanagari: आथर्वणद्वितीयोपनिषत् (शाक्त)
content:
  english: atharvanadvitiyopanishat hrim shrim ya vai shiva bhagavati animasiddhyadidashakam tasyai vai
    namo namah | hrim shrim ya vai shiva bhagavati animasiddhimtasyai vai namo namah | hrim shrim ya vai
    shiva bhagavati kaghimasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati mahimasiddhistasyai
    ve namo namah | hrim shrim ya vai shiva bhagavati ishitvasiddhistamyai vai namo namah | hrim shrim
    ya vai shiva bhagavati vashitvasiddhistasyai vai nama namah | hrim shrim ya vai shiva bhagavati prakamyasiddhistasyai
    ve namo namah | hrim shrim ya vai shiva bhagavati bhuktisiddhistasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati icchasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati praptisiddhistasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati prakamasiddhistasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati brahmyashtakam tasyai vai namo namah | hrim shrim ya vai shiva bhagavati am
    brahmishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati im maheshvarishaktistasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati um kaumarishaktistasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati rim vaishnavishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    lim varahishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati aim indranishaktistasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati aum camundashaktistasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati mahalakshmishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    mudradashakam tasyai vai namo namah | hrim shrim ya vai shiva bhagavati dram sarvasamkshobhinimudra
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati drim davinimudra tasyai vai namo namah |
    hrim shrim ya vai shiva bhagavati klim sarvakarshinimudra tasyai vai namo namah | hrim shrim ya vai
    shiva bhagavati klim sarvakarshinimudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    blim unmadinimudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati krom mahankushamudra
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati hskhphrem khecarimudra tasyai vai namo namah
    | hrim shrim ya vai shiva bhagavati hasaum bijamudra tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati aim sarvayonimudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati hsaum trikhandamudra
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati prathamacakreshvari tripura devi tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati animadisiddhistasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati sarvasamkshobhinimudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    kamakarshinyadishodashakam tasyai vai namo namah | hrim shrim ya vai shiva bhagavati kamakarshini
    tasmai vai namo namah | hrim shrim ya vai shiva bhagavati buddhyakarshini tasyai vai namo namah |
    hrim shrim ya vai shiva bhagavati ahankarakarshini tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati shabdakarshini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sparshakarshini
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati rupakarshini tasyai vai namo namah | hrim
    shrim ya shiva bhagavati rasakarshini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati gandhakarshini
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati cittakarshini tasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati dhairyakarshini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    smrityakarshini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati namakarshini tasyai vai
    namo namah | hrim shrim ya shiva bhagavati bijakarshini tasyai vai namo namah | hrim shrim ya vai
    shiva bhagavati atmakarshini tasmai vai namo namah | hrim shrim ya vai shiva bhagavati amritakarshini
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sharirakarshini tasyai vai namo namah |
    hrim shrim ya vai shiva bhagavati dvitiyacakreshvari tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati aim klim sauh tripureshvari tasyai vai namo namah | hrim shrim ya vai shiva bhagavati drim
    sarvavidravinimudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati anangakusumashtakam
    tasyai vai nabho namah | hrim shrim ya vai shiva bhagavati kam kham gam gham nam anangakusuma tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati cam cham jam jha nam anangamekhala tasyai vai namo
    namah | hrim shrim ya vai shiva bhagavati tam tham dam dham nam anangamadana tasyai vai namo namah
    | hrim shrim ya vai shiva bhagavati tam tham dam dham nam anangamadanatura tasyai namo namah | hrim
    shrim ya vai shiva bhagavati pam pham bam bham mam anangokha tasyai vai namo namah | hrim shrim ya
    vai shiva bhagavati yam ram lam vam anangavega tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    sham sham sam ham anangankusha tasyai vai namo namah | hrim shrim ya vai shiva bhagavati lam ksham
    anangamalini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati hrim klim sauh tritiyacakeshvari
    tripurasundari devi tasyai vai namo namah hrim shrim ya vai shiva bhagavati klim sarvakarshinimudra
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvasamkshobhinyadicaturdashakam tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvasamkshobhinishaktistasyai vai namo namah |
    hrim shrim ya vai shiva bhagavati sarvavidravinishaktistasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati sarvakarshinishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvahladinishaktistasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvasammohinishaktistasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati sarvantambhinishaktistasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati sarvajrimbhinishaktistasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvaranjani
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvavashankari tasmai vai namo namah |
    hrim shri ya vai shiva bhagavati sarvonmadini tasyai vai namo namah | hrim shrim ya ve shiva bhagavati
    sarvarthasadhaki tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvasampattipurani tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvamantramayi tasyai vai nabho namah | hrim shrim
    ya vai shiva bhagavati sarvadvandrakshayankari devi tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati aim klim sauh tripuravasini devi tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    ishitvasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati blum sarvavashankarimudra
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvasiddhipradadidashakam tasyai vai namo
    namah | hrim shrim ya vai shiva bhagavati sarvasiddhiprada tasyai vai namo namah | hrim shrim ya vai
    shiva bhagavati sarvasampatprada tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvapriyankari
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvamangalakarini tasyai vai namo namah
    | hrim shrim ya vai shiva bhagavati sarvakamaprada tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati sarvaduhkhavimocani tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvamrityuprashamani
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvavighnanivarani tasyai vai namo namah
    | hrim shrim ya vai shiva bhagavati sarvangasundari tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati sarvasaubhagyadayini tasyai vai namo namah | hrim shrim ya shiva bhagavati hsaim hslim hsauh
    pancamacakreshvari tripurashristasyai vai namo namah | hrim shrim ya vai shiva bhagavati vashitvasiddhintasyai
    vai namo namah | hrim shri ya shiva bhagavati unmadinimudra tasyai vai namo namah | hrim shrim ya
    vai shiva bhagavati sarvajnadidashakam tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvajnashaktistasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvashaktidevi tasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati sarvaishvaryapradayini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    sarvajnanamayi tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvavyadhivinashini tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvadharasvarupini tasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati sarvapapahara tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    sarvanandamayi tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sarvarakshasvarupini tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati sarvepsitaphalaprada tasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati hrim klim blem tripuramalini nitya tasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati prakamyasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati krom
    mahankushamudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati vashinyadyashtakam tasyai
    vai namo namah | hrim shrim ya vai shiva bhagavati am a im im um um rim rim lim lim em aim om aum
    am ah vashini vagvadini devata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati kam kham
    gam gham na kalahrim kameshvari vagdevata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    cam cham jam jha nam klim modini vagdevata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    tam tham dam dham nam hlum vimala vagdevata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    tam tha dam dham nam aruna vagdevata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati pam
    pham bam bham mam hasalavyum jayini vagdevata tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    yam ram lam vam hsmyom sarveshvari tasyai vai namo namah | hrim shrim ya vai shiva bhagavati sham
    sham sam ham kshvim kaulini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati hrim shrim sauh
    saptamacakreshvari tasyai vai namo namah | hrim shrim ya vai shiva bhagavati tripura siddha nitya
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati bhuktisiddhistasyai vai namo namah | hrim
    shrim ya vai shiva bhagavati hskhphrem khecari tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    yam ram lam vam sham dram drim klim blum sah banastasyai namo namah | hrim shrim ya vai shiva bhagavati
    dham tha sam mohanakodandarupini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati am hrim
    pasharupini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati krom ankusharupini tasyai vai
    namo namah | hrim shrim ya vai shiva bhagavati hsai hasalim hsauh tripurajanani tasyai vai namo namah
    | hrim shrim ya vai shiva bhagavati icchasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    hsaum bijamudra tasyai vai namo namah | hrim shrim ya vai shiva bhagavati kameshvaryadidevatatrayam
    tasyai vai namo namah | hrim shrim ya vai shiva bhagavati vagbhavakrite kameshvarim tasyai vai namo
    namah | hrim shrim ya vai shiva bhagavati kamarajakute vajreshvari tasyai vai namo namah | hrim shrim
    ya vai shiva bhagavati shaktikute bhagamalini tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    hasakalaradaim hasakalaradam hasakalaradaim tasyai vai namo namah | hrim shrim ya vai shiva bhagavati
    praptisiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati aim yonimudra tasyai vai namo
    namah | hrim shrim ya vai shiva bhagavati onkarapithadevata tasyai vai namo namah | hrim shrim ya
    vai shiva bhagavati sarvatmakena sarveshvari devi tasyai vai namo namah | hrim shrim ya vai shiva
    bhagavati sarvakamasiddhistasyai vai namo namah | hrim shrim ya vai shiva bhagavati triparasuntari
    tripuravasini tripurashristripuramalini tripusasiddhistripurajanani tripurabhairavi tabhyo vai namo
    namah | hrim shrim ya vai shiva bhagavati sarvakamasiddhistasyai vai namo namah | hrim shrim ya vai
    shiva bhagavati hsaum trikhandamudra tasyai vai namo namah || brahmabrahmavidityetairmantrairbhagavatim
    yajet | ityaha bhagavan | tato devi svatmanam darshayati | tasmadya etairmantrairyajati sa brahma
    pashyati | sa sarvam pashyati | so'mritatvam ca gacchati | ya evam veda | iti mahopanishat ||
  devanagari: आथर्वणद्वितीयोपनिषत् ह्रीं श्रीं या वै शिवा भगवती अणिमासिद्ध्यादिदशकं तस्यै वै नमो नमः ।
    ह्रीं श्रीं या वै शिवा भगवती अणिमासिद्धिम्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती कघिमासिद्धिस्तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती महिमासिद्धिस्तस्यै वे नमो नमः । ह्रीं श्रीं या वै शिवा भगवती
    ईशित्वसिद्धिस्तम्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती वशित्वसिद्धिस्तस्यै वै नमा नमः । ह्रीं
    श्रीं या वै शिवा भगवती प्राकाम्यसिद्धिस्तस्यै वे नमो नमः । ह्रीं श्रीं या वै शिवा भगवती भुक्तिसिद्धिस्तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती इच्छासिद्धिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती
    प्राप्तिसिद्धिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती प्रकामसिद्धिस्तस्यै वै नमो नमः । ह्रीं
    श्रीं या वै शिवा भगवती ब्राह्म्यष्टकं तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती आं ब्राह्मीशक्तिस्तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती ईं माहेश्वरीशक्तिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै
    शिवा भगवती ऊं कौमारीशक्तिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती ॠं वैष्णवीशक्तिस्तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती ॡं वाराहीशक्तिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा
    भगवती ऐं इन्द्राणीशक्तिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती औं चामुण्डाशक्तिस्तस्यै वै
    नमो नमः । ह्रीं श्रीं या वै शिवा भगवती महालक्ष्मीशक्तिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा
    भगवती मुद्रादशकं तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती द्रां सर्वसंक्षोभिणीमुद्रा तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती द्रीं दाविणीमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं या वै
    शिवा भगवती क्लीं सर्वाकर्षिणीमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती क्लीं सर्वाकर्षीणीमुद्रा
    तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती बॢं उन्मादिनीमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं
    या वै शिवा भगवती क्रों महाङ्कुशमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती ह्स्ख्फ्रें
    खेचरीमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती हसौं बीजमुद्रा तस्यै वै नमो नमः । ह्रीं
    श्रीं या वै शिवा भगवती ऐं सर्वयोनिमुद्रा तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती ह्सौं त्रिखण्डमुद्रा
    तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती प्रथमचक्रेश्वरी त्रिपुरा देवी तस्यै वै नमो नमः । ह्रीं
    श्रीं या वै शिवा भगवती अणिमादिसिद्धिस्तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती सर्वसंक्षोभिणीमुद्रा
    तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती कामाकर्षिण्यादिषोडशकं तस्यै वै नमो नमः । ह्रीं श्रीं
    या वै शिवा भगवती कामाकर्षिणी तस्मै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती बुद्ध्याकर्षिणी तस्यै
    वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती अहङ्काराकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा
    भगवती शब्दाकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती स्पर्शाकर्षिणी तस्यै वै नमो नमः
    । ह्रीं श्रीं या वै शिवा भगवती रूपाकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या शिवा भगवती रसाकर्षिणी
    तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती गन्धाकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या वै
    शिवा भगवती चित्ताकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती धैर्याकर्षिणी तस्यै वै नमो
    नमः । ह्रीं श्रीं या वै शिवा भगवती स्मृत्याकर्षिणी तस्यै वै नमो नमः । ह्रीं श्रीं या वै शिवा भगवती
