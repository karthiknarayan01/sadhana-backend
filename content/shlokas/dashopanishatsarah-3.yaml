id: dashopanishatsarah-3
category: upanishad
name:
  english: dashopanishatsarah 3
  devanagari: दशोपनिषत्सारः ३
content:
  english: rbalyam maunam ca kritva'ksharamajamamano brahma vedyam prayatnaih | nanabhanam vihaya pravacanamatisamlapanam
    shastravedan shanto dantastitikshuh paramasukhadhanam brahma bhuyatsvasamrat || 12|| vedantarthatisaropanishadamritatadbrahmapiyushapanam
    kritva'hankarashunyo mamatavarahitah saccidanandapurnah | acaryam shankaram sadgurumahamanamam nityakalyanamasam
    shantih shantih sushantirbhavabhayagalitam brahmasamrajyamaptam || 13|| etatsarasya pathatsatatasumananadhyasatah
    purnasaksha
  devanagari: र्बाल्यं मौनं च कृत्वाऽक्षरमजममनो ब्रह्म वेद्यं प्रयत्नैः । नानाभानं विहाय प्रवचनमतिसंलापनं
    शास्त्रवेदान् शान्तो दान्तस्तितिक्षुः परमसुखधनं ब्रह्म भूयात्स्वसंराट् ॥ १२॥ वेदान्तार्थातिसारोपनिषदमृततद्ब्रह्मपीयूषपानं
    कृत्वाऽहङ्कारशून्यो ममतवरहितः सच्चिदानन्दपूर्णः । आचार्यं शङ्करं सद्गुरुमहमनमं नित्यकल्याणमासं शान्तिः
    शान्तिः सुशान्तिर्भवभयगलितं ब्रह्मसाम्राज्यमाप्तम् ॥ १३॥ एतत्सारस्य पाठात्सततसुमननाध्यासतः पूर्णसाक्षा
meaning: {}
