id: vishvamitrakritamshivastotram
category: stotram
name:
  english: vishvamitrakritamshivastotram
  devanagari: विश्वामित्रकृतंशिवस्तोत्रम्
content:
  english: vishvamitrakritam shivastotram vishvamitra uvaca | jaya deva jayacintya jaya parvativallabha
    | jaya krishna jagannatha jaya krishna jagadguro || 1|| jayacintya jayameya jayananta jayacyuta |
    jayamara jayajeya jayavyaya sureshvara || 2|| jaya sarvaga sarvesha jaya sarvasurashraya | jaya sarvajanadhyeya
    jaya sarvaghanashana || 3|| tvam dhata ca vidhata ca tvam karta tvam ca rakshakah | caturvidhasya
    devesha bhutagramasya shankara || 4|| yatha tilasthitam tailam yatha dadhigatam ghritam | tathaivadhishthitam
    kritsnam tvaya guptena vai jagat || 5|| tvam brahma tvam hrishikeshastvam shakrastvam hutashanah |
    tvam yajnastvam vashatkarastvamindustvam divakarah || 6|| athava bahunoktena kim stavena tava prabho
    | samasadeva vakshyami vibhutim shrutinoditam || 7|| yatkincittrishu lokeshu sthavaram jangamam vibho
    | tatsarvam bhavata vyaptam kashtham havyabhuja yatha || 8|| iti shriskandapurane nagarakhande shashthadhyayantargatam
    vishvamitrakritam shivastotram samaptam | skandapurana | nagarakhanda | adhyaya 6
  devanagari: विश्वामित्रकृतं शिवस्तोत्रम् विश्वामित्र उवाच । जय देव जयाचिन्त्य जय पार्वतिवल्लभ । जय कृष्ण
    जगन्नाथ जय कृष्ण जगद्गुरो ॥ १॥ जयाचिन्त्य जयामेय जयानन्त जयाच्युत । जयामर जयाजेय जयाव्यय सुरेश्वर
    ॥ २॥ जय सर्वग सर्वेश जय सर्वसुराश्रय । जय सर्वजनध्येय जय सर्वाघनाशन ॥ ३॥ त्वं धाता च विधाता च त्वं
    कर्ता त्वं च रक्षकः । चतुर्विधस्य देवेश भूतग्रामस्य शङ्कर ॥ ४॥ यथा तिलस्थितं तैलं यथा दधिगतं घृतम्
    । तथैवाधिष्ठितं कृत्स्नं त्वया गुप्तेन वै जगत् ॥ ५॥ त्वं ब्रह्मा त्वं हृषीकेशस्त्वं शक्रस्त्वं हुताशनः
    । त्वं यज्ञस्त्वं वषट्कारस्त्वमिन्दुस्त्वं दिवाकरः ॥ ६॥ अथवा बहुनोक्तेन किं स्तवेन तव प्रभो । समासादेव
    वक्ष्यामि विभूतिं श्रुतिनोदिताम् ॥ ७॥ यत्किञ्चित्त्रिषु लोकेषु स्थावरं जङ्गमं विभो । तत्सर्वं भवता
    व्याप्तं काष्ठं हव्यभुजा यथा ॥ ८॥ इति श्रीस्कन्दपुराणे नागरखण्डे षष्ठाध्यायान्तर्गतं विश्वामित्रकृतं
    शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय ६
