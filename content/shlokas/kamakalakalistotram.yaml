id: kamakalakalistotram
category: stotram
name:
  english: kamakalakalistotram
  devanagari: कामकलाकालीस्तोत्रम्
content:
  english: vamshim tatha mudgaram vahnikundam || 13|| adho dammarum parigham bhindipalam tatha maushalam
    pattisham prashamevam | shataghnim shivapotakam catha dakshe maharatnamalam tatha karttukhadgau ||
    14|| calattarjjanimankusham dandamugram lasadratnakumbham trishulam tathaiva | sharan pashupatyamstatha
    panca kuntam punah parijatam churim tomaram ca || 15|| prasunasrajam dindimam gridhrarajam tatah korakam
    mamsakhandam shruvam ca | phalam bijapurahvayam caiva sucim tatha parshumevam gadam yashtimugram ||
    16|| tato vajramushtim kunappam sughoram tatha lalanam dharayantim bhujaistaih | javapushparocishphanindropaklripta
  devanagari: वंशीं तथा मुद्गरं वह्निकुण्डम् ॥ १३॥ अधो डम्मरुं पारिघं भिन्दिपालं तथा मौशलं पट्टिशं प्राशमेवम्
    । शतघ्नीं शिवापोतकं चाथ दक्षे महारत्नमालां तथा कर्त्तुखड्गौ ॥ १४॥ चलत्तर्ज्जनीमङ्कुशं दण्डमुग्रं लसद्रत्नकुम्भं
    त्रिशूलं तथैव । शरान् पाशुपत्यांस्तथा पञ्च कुन्तं पुनः पारिजातं छुरीं तोमरं च ॥ १५॥ प्रसूनस्रजं डिण्डिमं
    गृध्रराजं ततः कोरकं मांसखण्डं श्रुवं च । फलं बीजपूराह्वयं चैव सूचीं तथा पर्शुमेवं गदां यष्टिमुग्राम्
    ॥ १६॥ ततो वज्रमुष्टिं कुणप्पं सुघोरं तथा लालनं धारयन्तीं भुजैस्तैः । जवापुष्परोचिष्फणीन्द्रोपक्लृप्त
meaning: {}
