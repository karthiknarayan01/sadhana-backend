id: matangisahasranamastotra
category: stotram
name:
  english: matangisahasranamastotra
  devanagari: मातन्गीसहस्रनामस्तोत्र
content:
  english: rinu devi pravakshyami sampratantattvatah param | namnam sahasramparamam sumukhyah siddhaye
    hitam || sahasranamapathi yah sarvatra vijayi bhavet | parabhavo na tasyasti sabhayavva maharane ||
    yatha tushta bhaveddevi sumukhi casya pathatah | tatha bhavati deveshi sadhakah shiva eva sah || ashvamedhasahasrani
    vajapeyasya kotayah | sakritpathena jayante prasanna sumukhi bhavet || matango'sya rishishchando'nushtubdevi
    samirita | sumukhi viniyogah syatsarvasampattihetave || evandhyatva pathedetadyadicchetsiddhimatmanah
    | devim shodashavarshikim shavagatammadhvirasaghurnitam shyamangimarunambaramprithukucangunjavalishobhitam
    | hastabhyandadhatinkapalamamalantikshnantatha karttrikandhyayenmanasapankaje bhagavatimucchishtacandalinim
    || om sumukhi shemushisevya surasa shashishekhara | samanasya sadhani ca samastasurasanmukhi || sarvasampattijanani
    sammada sindhusevini | shambhusimantini saumya samaradhya sudharasa || saranga savali velalavanyavanamalini
    | vanajakshi vanacari vani vanavinodini || vegini vegada vega bagalastha baladhika | kali kalapriya
    keli kamala kalakamini || kamala kamalastha ca kamalasthakalavati | kulina kutila kanta kokila kalabhashini
    || kirakelikara kali kapalinyapi kalika | keshini ca kushavartta kaushambhi keshavapriya || kali kashi
    mahakalasankasha keshadayini | kundala ca kulastha ca kundalangadamandita || kundapadma kumudini kumudapritivarddhini
    | kundapriya kundarucih kuranganayana kula || kundabimbalinadani kusumbhakusumakara | kanci kanakashobhadhya
    kvanatkinkinikakatih || kathorakarana kashtha kaumudi kandavatyapi | kaparddini kapatini kathini kalakandini
    || kirahasta kumari ca kurudhakusumapriya | kunjarastha kujarata kumbhi kumbhastani kala || kumbhikanga
    karabhoruh kadali kushashayini | kupita kotarastha ca kankali kandalalaya || kapalavasini keshi kampamanashiroruha
    | kadambari kadambastha kunkumapremadharini || kutumbini kripayukta kratuh kratukarapriya | katyayani
    krittika ca karttiki kushavarttini || kamapatni kamadatri kameshi kamavandita | kamarupa kamaratih
    kamakhya jnanamohini || khadgini khecari khanja khanjaritekshana khaga | kharaga kharanada ca kharastha
    khelanapriya || kharamshuh khelani khatvakharakhatvangadharini| kharakhandinyapi khyatih khandita
    khandanapriya || khandapriya khandakhadya khandhasindhushca khandini | ganga godavari gauri gotamyapi
    ca gautami || ganga gaya gaganaga garudi garudadhvaja | gita gitapriya geya gunapritirggururgiri |
    gaurgauri gandasadana gokula gohpratarini | gopta govindini gudha gudhavigrastagunjini || gajaga gopini
    gopi gokshajayapriya gana | giribhupaladuhita goga gokulavasini || ghanastani ghanarucirgghanorugghananissvana
    | ghunkarini ghukshakari ghughukaparivarita || ghantanadapriya ghanta ghota ghotakavahini | ghorarupa
    ca ghora ca ghritapritirgghritanjani || ghritaci ghritavrishtishca ghanta ghataghatavrita | ghatastha
    ghatana ghatakari ghatanivarini || cancariki cakori ca ca camunda ciradharini | caturi capala cancushcita
    cintamanisthita || caturvarnyamayi cancushcoracarya camatkritih | cakravartivadhushcitra cakrangi
    cakramodini || cetashcari cittavrittishcetana cetanapriya | capini campakapritishcanda candalavasini
    || ciranjivini taccinta cincamulanivasini | churika chatramadhyastha chinda chindakari chida || chucchundari
    chalapritishchucchundaranibhasvana | chalini chatrada chinna chinticchedakari chata || chadmini chandasi
    chaya charu chandakarityapi | jayada jayada jati jayini jamala jatuh || jambupriya jivanastha jangama
    jangamapriya | javapushpapriya japya jagajjiva jagajjanih || jagajjantupradhana ca jagajjivaparajava
    | jatipriya jivanastha jimutasadrishirucih || janya janahita jaya janmabhurjjambhasi jabhuh | jayada
    jagadavasa jayini jvarakricchrajit || japa ca japati japya japaha jayini jana | jalandharamayijanurjjalauka
    japyabhushana || jagajjivamayijiva jaratkarurjjanapriya | jagati jananirata jagacchobhakari java ||
    jagatitranakrijjangha jatiphalavinodini | jatipushpapriya jvala jatiha jatirupini || jimutavahanarucirjjimuta
    jirnavastrakrit | jirnavastradhara jirna jvalati jalanashini || jagatkshobhakari jatirjjagatkshobhavinashini
    | janapavada jiva ca jananigrihavasini || jananuraga janustha jalavasa jalarttikrit | jalaja jalavela
    ca jalacakranivasini || jalamukta jalaroha jalaja jalajekshana | jalapriya jalauka ca jalamshobhavati
    tatha || jalavisphurjjitavapurjjvalatpavakashobhini | jhinjha jhillamayi jhinjhajhanatkarakari jaya
    || jhanjhi jhampakari jhampa jhampatrasanivarini | tankarastha tankakari tankarakaranamhasa || tankarottakritashthiva
    dindiravasanavrita | dakini damiri caiva dindimadhvaninadini || dakaranissvanarucistapini tapini tatha
    | taruni tundila tunda tamasi ca tamah priya || tamra tamravati tantustundila tulasambhava | tulakotisuvega
    ca tulyakama tulashraya || tudini tunini tumba tulyakala tulashraya | tumula tulaja tulya tuladanakari
    tatha || tulyavega tulyagatistulakotininadini | tamroshtha tamraparni ca tamahsankshobhakarini ||
    tvarita jvaraha tira tarakeshi tamalini | tamodanavati tamatalasthanavati tami | tamasi ca tamisra
    ca tivra tivraparakrama | tatastha tilatailakta taruni tapanadyutih || tilottama ca tilakrittarakadhishashekhara
    | tilapushpapriya tara tarakeshi kutumbini || sthanupatni sthirakari sthulasampadvivarddhini | sthitih
    sthairyasthavishtha ca sthapatih sthulavigraha || sthulasthalavati sthali sthalasangavivarddhini |
    dandini dantini dama daridra dinavatsala || deva devavadhurdditya damini devabhushana | daya damavati
    dinavatsala dadimastani || devamurttikara daityadarini devatanata | dolakrida dayalushca dampati devatamayi
    || dashadipasthita doshadoshaha doshakarini | durga durgartishamani durgamya durgavasini | durgandhanashini
    dusstha duhkhaprashamakarini | durggandha dundubhidhvanta durastha duravasini || daradamaradatri ca
    durvvyadhadayita dami | dhurandhara dhurina ca dhaureyi dhanadayini || dhirarava dharitri ca dharmada
    dhiramanasa | dhanurddhara ca dhamani dhamanidhurttavigraha || dhumravarna dhumrapana dhumala dhumamodini
    | nandini nandininanda nandiniinandabalika || navina narmada narmanemirnniyamanissvana | nirmala nigamadhara
    nimnaga nagnakamini || nila niratna nirvana nirllobha nirguna natih | nilagriva niriha ca niranjanajamanava
    || nirgundika ca nirgunda nirnnasa nasikabhidha | patakini pataka ca patrapritih payasvini || pina
    pinastani patni pavanashi nishamayi | paraparaparakali parakrityabhujapriya || pavanastha ca pavana
    pavanapritivarddhini | pashuvriddhikari pushpi poshaka pushtivarddhini || pushpini pustakakara purnimatalavasini
    | peshi pashakari pasha pamshuha pamshula pashuh || patuh parasha parashudharini pashini tatha | papaghni
    patipatni ca patita patitapati || pishaci ca pishacaghni pishitashanatoshini | panada panapatri ca
    panadanakarodyata || peyaprasiddha piyusha purna purnamanoratha | patangabha patanga ca paunahpunyapibapara
    || pankila pankamagna ca paniya panjarasthita | pancami pancayajna ca pancata pancamapriya || picumanda
    pundarika piki pingalalocana | priyangumanjari pindi pandita panduraprabha || pretasana priyalastha
    pandughni pinasapaha | phalini phaladatri ca phalashrih phalabhushana || phutkarakarini raphari phulla
    phullambujanana | sphulingaha sphitamatih sphitakirttikari tatha || balamaya balaratirbbalini balavarddhini
    | venuvadya vanacari virancijanayatyapi || vidyaprada mahavidya bodhini bodhadayini | buddhamata ca
    buddha ca vanamalavati vara || varada varuni vina vinavadanatatpara | vinodini vinodastha vaishnavi
    vishnuvallabha || vaidya vaidyacikitsa ca vivasha vishvavishruta | vidyaughavihvala vela vittada vigatajvara
    || virava vivarikara bimboshthi bimbavatsala | vindhyastha paravandya ca virasthanavara ca vit ||
    vedantavedya vijaya vijayavijayaprada | virogi vandini vandhya vandyabandhanivarini || bhagini bhagamala
    ca bhavani bhavanashini | bhima bhimanana bhimabhangura bhimadarshana || bhilli bhilladhara bhirurbbharundabhi
    bhayavaha | bhagasarpinyapi bhaga bhagarupa bhagalaya || bhagasana bhavabhoga bherijhankararanjita
    | bhishana bhishanarava vabhagatyahibhushana || bharadvaja bhogadatri bhutighni bhutibhushana | bhumidabhumidatri
    ca bhupatirbbharadayini || bhramari bhramari bhala bhupalakulasamsthita | mata manohara maya manini
    mohini mahi || mahalakshmirmadakshiba madira madiralaya | madoddhata matangastha madhavi madhumarddini
    || moda modakari medha medhyamadhyadhipasthita | madyapa mamsalobhastha modini maithunodyata || murddhavati
    mahamaya maya mahimamandira | mahamala mahavidya mahamari maheshvari || mahadevavadhumanya mathura
    merumandita | medasvini milindakshi mahishasuramarddini || mandalastha bhagastha ca madiraragagarvita
    | mokshada mundamala ca mala malavilasini || matangini ca matangi matangatanayapi ca | madhusrava
    madhurasa bandhukakusumapriya || yamini yamininathabhusha yavakaranjita | yavankurapriya yama yavani
    yavanardini || yamaghni yamakalpa ca yajamanasvarupini | yajna yajnayajuryakshi yashonih kampakakarini
    || yakshini yakshajanani yashodayasadharini | yashassutraprada yama yajnakarmakarityapi || yashasvini
    yakarastha bhuyastambhanivasini | ranjita rajapatni ca rama rekha ravi rana || rajovati rajashcitra
    ranjani rajanipatih | rogini rajani rajna rajyada rajyavarddhini || rajanvati rajanitistatha rajatavasini
    | ramaniramaniya ca rama ramavati ratih | reto rati ratotsaha rogaghni rogakarini | ranga rangavati
    raga raga ragajna ragakriddaya || ramika rajaki reva rajani rangalocana | raktacarmadhara rangi rangastha
    rangavahini || rama rambhaphalapriti rambhoru raghavapriya | ranga rangangamadhura rodasi ca maharava
    || rodhakridrogahantri ca rupabhridrogasravini | bandi vandistuta bandhurbandhukakusumadhara || vandita
    vandyamana ca vaidravi vedavidvidha | vikopa vikapala ca vinkastha vinkavatsala || vedairvilagnalagna
    ca vidhivinkakari vidha | shankhini shankhavalaya shankhamalavati shami || shankhapatra shini shankhasvanashankhagala
    shashi | shabari shambari shambhuh shambhukesha sharasini || shava shyenavati shyama shyamangi shyamalocana
    | shmashanastha shmashana ca shmashanasthanabhushana || shamada shamahantri ca shankhini shankharoshara
    | shantishshantiprada shesha sheshakhya sheshashayini || shemushi shoshini shesha shaurya shauryashara
    shari | shapada shapaha shapashapapantha sadashiva || sha
  devanagari: ृणु देवि प्रवक्ष्यामि साम्प्रतन्तत्त्वतः परम् । नाम्नां सहस्रम्परमं सुमुख्याः सिद्धये हितम्
    ॥ सहस्रनामपाठी यः सर्वत्र विजयी भवेत् । पराभवो न तस्यास्ति सभायाव्वा महारणे ॥ यथा तुष्टा भवेद्देवी
    सुमुखी चास्य पाठतः । तथा भवति देवेशि साधकः शिव एव सः ॥ अश्वमेधसहस्राणि वाजपेयस्य कोटयः । सकृत्पाठेन
    जायन्ते प्रसन्ना सुमुखी भवेत् ॥ मतङ्गोऽस्य ऋषिश्छन्दोऽनुष्टुब्देवी समीरिता । सुमुखी विनियोगः स्यात्सर्वसम्पत्तिहेतवे
    ॥ एवन्ध्यात्वा पठेदेतद्यदीच्छेत्सिद्धिमात्मनः । देवीं षोडशवार्षिकीं शवगताम्माध्वीरसाघूर्णितां श्यामाङ्गीमरुणाम्बराम्पृथुकुचाङ्गुञ्जावलीशोभिताम्
    । हस्ताभ्यान्दधतीङ्कपालममलन्तीक्ष्णान्तथा कर्त्त्रिकान्ध्यायेन्मानसपङ्कजे भगवतीमुच्छिष्टचाण्डालिनीम्
    ॥ ॐ सुमुखी शेमुषीसेव्या सुरसा शशिशेखरा । समानास्या साधनी च समस्तसुरसन्मुखी ॥ सर्वसम्पत्तिजननी सम्मदा
    सिन्धुसेविनी । शम्भुसीमन्तिनी सौम्या समाराध्या सुधारसा ॥ सारङ्गा सवली वेलालावण्यवनमालिनी । वनजाक्षी
    वनचरी वनी वनविनोदिनी ॥ वेगिनी वेगदा वेगा बगलस्था बलाधिका । काली कालप्रिया केली कमला कालकामिनी ॥ कमला
    कमलस्था च कमलस्थाकलावती । कुलीना कुटिला कान्ता कोकिला कलभाषिणी ॥ कीराकेलिकरा काली कपालिन्यपि कालिका
    । केशिनी च कुशावर्त्ता कौशाम्भी केशवप्रिया ॥ काली काशी महाकालसङ्काशा केशदायिनी । कुण्डला च कुलस्था
    च कुण्डलाङ्गदमण्डिता ॥ कुण्डपद्मा कुमुदिनी कुमुदप्रीतिवर्द्धिनी । कुण्डप्रिया कुण्डरुचिः कुरङ्गनयना
    कुला ॥ कुन्दबिम्बालिनदनी कुसुम्भकुसुमाकरा । काञ्ची कनकशोभाढ्या क्वणत्किङ्किणिकाकटिः ॥ कठोरकरणा काष्ठा
    कौमुदी कण्डवत्यपि । कपर्द्दिनी कपटिनी कठिनी कलकण्डिनी ॥ कीरहस्ता कुमारी च कुरूढकुसुमप्रिया । कुञ्जरस्था
    कुजरता कुम्भी कुम्भस्तनी कला ॥ कुम्भीकाङ्गा करभोरूः कदली कुशशायिनी । कुपिता कोटरस्था च कङ्काली कन्दलालया
    ॥ कपालवासिनी केशी कम्पमानशिरोरुहा । कदम्बरी कदम्बस्था कुङ्कुमप्रेमधारिणी ॥ कुटुम्बिनी कृपायुक्ता क्रतुः
    क्रतुकरप्रिया । कात्यायनी कृत्तिका च कार्त्तिकी कुशवर्त्तिनी ॥ कामपत्नी कामदात्री कामेशी कामवन्दिता
    । कामरूपा कामरतिः कामाख्या ज्ञानमोहिनी ॥ खड्गिनी खेचरी खञ्जा खञ्जरीटेक्षणा खगा । खरगा खरनादा च खरस्था
    खेलनप्रिया ॥ खरांशुः खेलनी खट्वाखराखट्वाङ्गधारिणी। खरखण्डिन्यपि ख्यातिः खण्डिता खण्डनप्रिया ॥ खण्डप्रिया
    खण्डखाद्या खण्ढसिन्धुश्च खण्डिनी । गङ्गा गोदावरी गौरी गोतम्यपि च गौतमी ॥ गङ्गा गया गगनगा गारुडी गरुडध्वजा
    । गीता गीतप्रिया गेया गुणप्रीतिर्ग्गुरुर्गिरी । गौर्गौरी गण्डसदना गोकुला गोःप्रतारिणी । गोप्ता गोविन्दिनी
    गूढा गूढविग्रस्तगुञ्जिनी ॥ गजगा गोपिनी गोपी गोक्षाजयप्रिया गणा । गिरिभूपालदुहिता गोगा गोकुलवासिनी
    ॥ घनस्तनी घनरुचिर्ग्घनोरुग्घननिस्स्वना । घुङ्कारिणी घुक्षकरी घूघूकपरिवारिता ॥ घण्टानादप्रिया घण्टा
    घोटा घोटकवाहिनी । घोररूपा च घोरा च घृतप्रीतिर्ग्घृताञ्जनी ॥ घृताची घृतवृष्टिश्च घण्टा घटघटावृता ।
    घटस्था घटना घातकरी घातनिवारिणी ॥ चञ्चरीकी चकोरी च च चामुण्डा चीरधारिणी । चातुरी चपला चञ्चुश्चिता चिन्तामणिस्थिता
    ॥ चातुर्वर्ण्यमयी चञ्चुश्चोराचार्या चमत्कृतिः । चक्रवर्तिवधूश्चित्रा चक्राङ्गी चक्रमोदिनी ॥ चेतश्चरी
    चित्तवृत्तिश्चेतना चेतनप्रिया । चापिनी चम्पकप्रीतिश्चण्डा चण्डालवासिनी ॥ चिरञ्जीविनी तच्चिन्ता चिञ्चामूलनिवासिनी
    । छूरिका छत्रमध्यस्था छिन्दा छिन्दकरी छिदा ॥ छुच्छुन्दरी छलप्रीतिश्छुच्छुन्दरनिभस्वना । छलिनी छत्रदा
    छिन्ना छिण्टिच्छेदकरी छटा ॥ छद्मिनी छान्दसी छाया छरू छन्दाकरीत्यपि । जयदा जयदा जाती जायिनी जामला जतुः
    ॥ जम्बूप्रिया जीवनस्था जङ्गमा जङ्गमप्रिया । जवापुष्पप्रिया जप्या जगज्जीवा जगज्जनिः ॥ जगज्जन्तुप्रधाना
    च जगज्जीवपराजवा । जातिप्रिया जीवनस्था जीमूतसदृशीरुचिः ॥ जन्या जनहिता जाया जन्मभूर्ज्जम्भसी जभूः ।
    जयदा जगदावासा जायिनी ज्वरकृच्छ्रजित् ॥ जपा च जपती जप्या जपाहा जायिनी जना । जालन्धरमयीजानुर्ज्जालौका
    जाप्यभूषणा ॥ जगज्जीवमयीजीवा जरत्कारुर्ज्जनप्रिया । जगती जननिरता जगच्छोभाकरी जवा ॥ जगतीत्राणकृज्जङ्घा
    जातीफलविनोदिनी । जातीपुष्पप्रिया ज्वाला जातिहा जातिरूपिणी ॥ जीमूतवाहनरुचिर्ज्जीमूता जीर्णवस्त्रकृत्
    । जीर्णवस्त्रधरा जीर्णा ज्वलती जालनाशिनी ॥ जगत्क्षोभकरी जातिर्ज्जगत्क्षोभविनाशिनी । जनापवादा जीवा
    च जननीगृहवासिनी ॥ जनानुरागा जानुस्था जलवासा जलार्त्तिकृत् । जलजा जलवेला च जलचक्रनिवासिनी ॥ जलमुक्ता
    जलारोहा जलजा जलजेक्षणा । जलप्रिया जलौका च जलांशोभवती तथा ॥ जलविस्फूर्ज्जितवपुर्ज्ज्वलत्पावकशोभिनी
    । झिञ्झा झिल्लमयी झिञ्झाझणत्कारकरी जया ॥ झञ्झी झम्पकरी झम्पा झम्पत्रासनिवारिणी । टङ्कारस्था टङ्ककरी
    टङ्कारकरणांहसा ॥ टङ्कारोट्टकृतष्ठीवा डिण्डीरवसनावृता । डाकिनी डामिरी चैव डिण्डिमध्वनिनादिनी ॥ डकारनिस्स्वनरुचिस्तपिनी
    तापिनी तथा । तरुणी तुन्दिला तुन्दा तामसी च तमः प्रिया ॥ ताम्रा ताम्रवती तन्तुस्तुन्दिला तुलसम्भवा
    । तुलाकोटिसुवेगा च तुल्यकामा तुलाश्रया ॥ तुदिनी तुनिनी तुम्बा तुल्यकाला तुलाश्रया । तुमुला तुलजा तुल्या
    तुलादानकरी तथा ॥ तुल्यवेगा तुल्यगतिस्तुलाकोटिनिनादिनी । ताम्रोष्ठा ताम्रपर्णी च तमःसङ्क्षोभकारिणी
    ॥ त्वरिता ज्वरहा तीरा तारकेशी तमालिनी । तमोदानवती तामतालस्थानवती तमी । तामसी च तमिस्रा च तीव्रा तीव्रपराक्रमा
    । तटस्था तिलतैलाक्ता तरुणी तपनद्युतिः ॥ तिलोत्तमा च तिलकृत्तारकाधीशशेखरा । तिलपुष्पप्रिया तारा तारकेशी
    कुटुम्बिनी ॥ स्थाणुपत्नी स्थिरकरी स्थूलसम्पद्विवर्द्धिनी । स्थितिः स्थैर्यस्थविष्ठा च स्थपतिः स्थूलविग्रहा
    ॥ स्थूलस्थलवती स्थाली स्थलसङ्गविवर्द्धिनी । दण्डिनी दन्तिनी दामा दरिद्रा दीनवत्सला ॥ देवा देववधूर्द्दित्या
    दामिनी देवभूषणा । दया दमवती दीनवत्सला दाडिमस्तनी ॥ देवमूर्त्तिकरा दैत्यादारिणी देवतानता । दोलाक्रीडा
    दयालुश्च दम्पती देवतामयी ॥ दशादीपस्थिता दोषादोषहा दोषकारिणी । दुर्गा दुर्गार्तिशमनी दुर्गम्या दुर्गवासिनी
    । दुर्गन्धनाशिनी दुस्स्था दुःखप्रशमकारिणी । दुर्ग्गन्धा दुन्दुभीध्वान्ता दूरस्था दूरवासिनी ॥ दरदामरदात्री
    च दुर्व्व्याधदयिता दमी । धुरन्धरा धुरीणा च धौरेयी धनदायिनी ॥ धीरारवा धरित्री च धर्मदा धीरमानसा । धनुर्द्धरा
    च धमनी धमनीधूर्त्तविग्रहा ॥ धूम्रवर्णा धूम्रपाना धूमला धूममोदिनी । नन्दिनी नन्दिनीनन्दा नन्दिनीइनन्दबालिका
    ॥ नवीना नर्मदा नर्मनेमिर्न्नियमनिस्स्वना । निर्मला निगमाधारा निम्नगा नग्नकामिनी ॥ नीला निरत्ना निर्वाणा
    निर्ल्लोभा निर्गुणा नतिः । नीलग्रीवा निरीहा च निरञ्जनजमानवा ॥ निर्गुण्डिका च निर्गुण्डा निर्न्नासा
    नासिकाभिधा । पताकिनी पताका च पत्रप्रीतिः पयस्विनी ॥ पीना पीनस्तनी पत्नी पवनाशी निशामयी । परापरपराकाली
    पारकृत्यभुजप्रिया ॥ पवनस्था च पवना पवनप्रीतिवर्द्धिनी । पशुवृद्धिकरी पुष्पी पोषका पुष्टिवर्द्धिनी
    ॥ पुष्पिणी पुस्तककरा पूर्णिमातलवासिनी । पेशी पाशकरी पाशा पांशुहा पांशुला पशुः ॥ पटुः पराशा परशुधारिणी
    पाशिनी तथा । पापघ्नी पतिपत्नी च पतिता पतितापती ॥ पिशाची च पिशाचघ्नी पिशिताशनतोषिणी । पानदा पानपात्री
    च पानदानकरोद्यता ॥ पेयाप्रसिद्धा पीयूषा पूर्णा पूर्णमनोरथा । पतङ्गाभा पतङ्गा च पौनःपुन्यपिबापरा ॥
    पङ्किला पङ्कमग्ना च पानीया पञ्जरस्थिता । पञ्चमी पञ्चयज्ञा च पञ्चता पञ्चमाप्रिया ॥ पिचुमन्दा पुण्डरीका
    पिकी पिङ्गललोचना । प्रियङ्गुमञ्जरी पिण्डी पण्डिता पाण्डुरप्रभा ॥ प्रेतासना प्रियालस्था पाण्डुघ्नी
    पीनसापहा । फलिनी फलदात्री च फलश्रीः फलभूषणा ॥ फूत्कारकारिणी रफारी फुल्ला फुल्लाम्बुजानना । स्फुलिङ्गहा
    स्फीतमतिः स्फीतकीर्त्तिकरी तथा ॥ बालमाया बलारातिर्ब्बलिनी बलवर्द्धिनी । वेणुवाद्या वनचरी विरञ्चिजनयत्यपि
    ॥ विद्याप्रदा महाविद्या बोधिनी बोधदायिनी । बुद्धमाता च बुद्धा च वनमालावती वरा ॥ वरदा वारुणी वीणा वीणावादनतत्परा
    । विनोदिनी विनोदस्था वैष्णवी विष्णुवल्लभा ॥ वैद्या वैद्यचिकित्सा च विवशा विश्वविश्रुता । विद्यौघविह्वला
    वेला वित्तदा विगतज्वरा ॥ विरावा विवरीकारा बिम्बोष्ठी बिम्बवत्सला । विन्ध्यस्था परवन्द्या च वीरस्थानवरा
    च वित् ॥ वेदान्तवेद्या विजया विजयाविजयप्रदा । विरोगी वन्दिनी वन्ध्या वन्द्यबन्धनिवारिणी ॥ भगिनी भगमाला
    च भवानी भवनाशिनी । भीमा भीमानना भीमाभङ्गुरा भीमदर्शना ॥ भिल्ली भिल्लधरा भीरुर्ब्भरुण्डाभी भयावहा ।
    भगसर्पिण्यपि भगा भगरूपा भगालया ॥ भगासना भवाभोगा भेरीझङ्काररञ्जिता । भीषणा भीषणारावा वभगत्यहिभूषणा
    ॥ भारद्वाजा भोगदात्री भूतिघ्नी भूतिभूषणा । भूमिदाभूमिदात्री च भूपतिर्ब्भरदायिनी ॥ भ्रमरी भ्रामरी भाला
    भूपालकुलसंस्थिता । माता मनोहरा माया मानिनी मोहिनी मही ॥ महालक्ष्मीर्मदक्षीबा मदिरा मदिरालया । मदोद्धता
    मतङ्गस्था माधवी मधुमर्द्दिनी ॥ मोदा मोदकरी मेधा मेध्यामध्याधिपस्थिता । मद्यपा मांसलोभस्था मोदिनी मैथुनोद्यता
    ॥ मूर्द्धावती महामाया माया महिममन्दिरा । महामाला महाविद्या महामारी महेश्वरी ॥ महादेववधूमान्या मथुरा
    मेरुमण्डिता । मेदस्विनी मिलिन्दाक्षी महिषासुरमर्द्दिनी ॥ मण्डलस्था भगस्था च मदिरारागगर्विता । मोक्षदा
    मुण्डमाला च माला मालाविलासिनी ॥ मातङ्गिनी च मातङ्गी मातङ्गतनयापि च । मधुस्रवा मधुरसा बन्धूककुसुमप्रिया
    ॥ यामिनी यामिनीनाथभूषा यावकरञ्जिता । यवाङ्कुरप्रिया यामा यवनी यवनार्दिनी ॥ यमघ्नी यमकल्पा च यजमानस्वरूपिणी
    । यज्ञा यज्ञयजुर्यक्षी यशोनिः कम्पकाकारिणी ॥ यक्षिणी यक्षजननी यशोदायासधारिणी । यशस्सूत्रप्रदा यामा
    यज्ञकर्मकरीत्यपि ॥ यशस्विनी यकारस्था भूयस्तम्भनिवासिनी । रञ्जिता राजपत्नी च रमा रेखा रवी रणा ॥ रजोवती
    रजश्चित्रा रञ्जनी रजनीपतिः । रोगिणी रजनी राज्ञा राज्यदा राज्यवर्द्धिनी ॥ राजन्वती राजनीतिस्तथा रजतवासिनी
    । रमणीरमणीया च रामा रामावती रतिः । रेतो रती रतोत्साहा रोगघ्नी रोगकारिणी । रङ्गा रङ्गवती रागा रागा
    रागज्ञा रागकृद्दया ॥ रामिका रजकी रेवा रजनी रङ्गलोचना । रक्तचर्मधरा रङ्गी रङ्गस्था रङ्गवाहिनी ॥ रमा
    रम्भाफलप्रीती रम्भोरू राघवप्रिया । रङ्गा रङ्गाङ्गमधुरा रोदसी च महारवा ॥ रोधकृद्रोगहन्त्री च रूपभृद्रोगस्राविणी
    । बन्दी वन्दिस्तुता बन्धुर्बन्धूककुसुमाधरा ॥ वन्दिता वन्द्यमाना च वैद्रावी वेदविद्विधा । विकोपा विकपाला
    च विङ्कस्था विङ्कवत्सला ॥ वेदैर्विलग्नलग्ना च विधिविङ्ककरी विधा । शङ्खिनी शङ्खवलया शङ्खमालावती शमी
    ॥ शङ्खपात्रा शिनी शङ्खस्वनशङ्खगला शशी । शबरी शम्बरी शम्भुः शम्भुकेशा शरासिनी ॥ शवा श्येनवती श्यामा
    श्यामाङ्गी श्यामलोचना । श्मशानस्था श्मशाना च श्मशानस्थानभूषणा ॥ शमदा शमहन्त्री च शङ्खिनी शङ्खरोषरा
    । शान्तिश्शान्तिप्रदा शेषा शेषाख्या शेषशायिनी ॥ शेमुषी शोषिणी शेषा शौर्या शौर्यशरा शरी । शापदा शापहा
    शापाशापपन्था सदाशिवा ॥ श
