id: gopalastutih
category: stotram
name:
  english: gopalastutih
  devanagari: गोपालस्तुतिः
content:
  english: shri ganeshaya namah | om namo vishvarupaya vishvasthityantahetave | vishveshvaraya vishvaya
    govindaya namo namah || 1|| namo vijnanarupaya paramanandarupine | krishnaya gopinathaya govindaya
    namo namah || 2|| namah kamalanetraya namah kamalamaline | namah kamalanabhaya kamalapataye namah
    || 3|| barhapidabhiramaya ramayakunthamedhase | ramamanasahamsaya govindaya namo namah || 4|| kamsavashavinashaya
    keshicanuraghatine | kalindikulalilaya lolakundaladharine || 5|| vrishabhadhvajavandyaya parthasarathaye
    namah | venuvadanashilaya gopalayahimardine || 6|| ballavivadanambhojamaline nrityashaline | namah
    pranatapalaya shrikrishnaya namo namah || 7|| namah papapranashaya govardhanadharaya ca | putanajivitantaya
    trinavartasuharine || 8|| nishkalaya vimohaya shuddhayashuddhavairine | advitiyaya mahate shrikrishnaya
    namo namah || 9|| prasida paramananda prasida parameshvara | adhivyadhibhujangena dashtam mamuddhara
    prabho || 10|| shrikrishna rukminikanta gopijanamanohara | samsarasagare magnam mamuddhara jagadguro
    || 11|| keshava kleshaharana narayana janardana | govinda paramananda mam samuddhara madhava || 12||
    || ityatharvane gopalatapinyupanishadantargata gopalastuti samapta ||
  devanagari: श्री गणेशाय नमः । ॐ नमो विश्वरूपाय विश्वस्थित्यन्तहेतवे । विश्वेश्वराय विश्वाय गोविन्दाय
    नमो नमः ॥ १॥ नमो विज्ञानरूपाय परमानन्दरूपिणे । कृष्णाय गोपीनाथाय गोविन्दाय नमो नमः ॥ २॥ नमः कमलनेत्राय
    नमः कमलमालिने । नमः कमलनाभाय कमलापतये नमः ॥ ३॥ बर्हापीडाभिरामाय रामायाकुण्ठमेधसे । रमामानसहंसाय गोविन्दाय
    नमो नमः ॥ ४॥ कंसवशविनाशाय केशिचाणूरघातिने । कालिन्दीकूललीलाय लोलकुण्डलधारिणे ॥ ५॥ वृषभध्वजवन्द्याय
    पार्थसारथये नमः । वेणुवादनशीलाय गोपालायाहिमर्दिने ॥ ६॥ बल्लवीवदनाम्भोजमालिने नृत्यशालिने । नमः प्रणतपालाय
    श्रीकृष्णाय नमो नमः ॥ ७॥ नमः पापप्रणाशाय गोवर्धनधराय च । पूतनाजीवितान्ताय तृणावर्तासुहारिणे ॥ ८॥ निष्कलाय
    विमोहाय शुद्धायाशुद्धवैरिणे । अद्वितीयाय महते श्रीकृष्णाय नमो नमः ॥ ९॥ प्रसीद परमानन्द प्रसीद परमेश्वर
    । आधिव्याधिभुजङ्गेन दष्टं मामुद्धर प्रभो ॥ १०॥ श्रीकृष्ण रुक्मिणीकान्त गोपीजनमनोहर । संसारसागरे मग्नं
    मामुद्धर जगद्गुरो ॥ ११॥ केशव क्लेशहरण नारायण जनार्दन । गोविन्द परमानन्द मां समुद्धर माधव ॥ १२॥ ॥ इत्याथर्वणे
    गोपालतापिन्युपनिषदन्तर्गता गोपालस्तुति समाप्ता ॥
