id: pancamukhihanumatkavacam-2
category: stotram
name:
  english: pancamukhihanumatkavacam
  devanagari: पञ्चमुखिहनुमत्कवचम्
content:
  english: pathenityam sarva sampatkaram shubham | caturvaram pathenityam sarva roga nivaranam | pamcavaram
    pathenityam putrapautrapravardhanam | shadvaram tu pathenityam sarva deva vashikaram | saptavaram
    pathenityam sarva saubhagyadayakam | ashtavaram pathenityam ishta kamartha siddhidam | navavaram saptakena
    sarva rajya vashikaram | dashavaram saptakayugam trikala jnanadarshanam | dashaika varam pathanat
    imam mamtram trisaptakam | svajanaistu samayukto trailokya vijayi bhavet | sarvarogan sarvabadhan
    | sarva bhuta pretapishaca brahmarakshasa vetala brahmahatyadi sambamdha sakalabadhan nivaraya nivaraya
    | humphat ghegheghe svaha | kavaca smaranadevam mahaphalamavapnuyat | pujakale pathedyastu sarva karyartha
    siddhidam | iti shrisudarshana samhitayam rudrayamale atharvana rahasyam shrisitarama manohara pamcamukhi
    shrivirahanumatkavacastrotramsampurnam || || shrikrishnarpanamastu ||
  devanagari: पठेनित्यं सर्व संपत्करं शुभं । चतुर्वारं पठेनित्यं सर्व रोग निवारणम् । पंचवारं पठेनित्यं
    पुत्रपौत्रप्रवर्धनं । षड्वारं तु पठेनित्यं सर्व देव वशीकरम् । सप्तवारं पठेनित्यं सर्व सौभाग्यदायकं
    । अष्टवारं पठेनित्यं इष्ट कामार्थ सिद्धिदं । नववारं सप्तकेन सर्व राज्य वशीकरम् । दशवारं सप्तकयुगं
    त्रिकाल ज्ञानदर्शनं । दशैक वारं पठणात् इमं मंत्रं त्रिसप्तकं । स्वजनैस्तु समायुक्तो त्रैलोक्य विजयी
    भवेत् । सर्वरोगान् सर्वबाधान् । सर्व भूत प्रेतपिशाच ब्रह्मराक्षस वेताल ब्रह्महत्यादि संबंध सकलबाधान्
    निवारय निवारय । हुंफट् घेघेघे स्वाहा । कवच स्मरणादेवं महाफलमवाप्नुयात् । पूजाकाले पठेद्यस्तु सर्व
    कार्यार्थ सिद्धिदं । इति श्रीसुदर्शन संहितायां रुद्रयामले अथर्वण रहस्यं श्रीसीताराम मनोहर पंचमुखी
    श्रीवीरहनुमत्कवचस्त्रोत्रंसंपूर्णम् ॥ ॥ श्रीकृष्णार्पणमस्तु ॥
