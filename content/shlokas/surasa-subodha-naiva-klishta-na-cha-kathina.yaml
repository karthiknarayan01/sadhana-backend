id: surasa-subodha-naiva-klishta-na-cha-kathina
category: stotram
name:
  english: Surasa Subodha (Naiva Klishta Na Cha Kathina)
content:
  english: surasa subodha vishvamanojna lalita hridya ramaniya | amritavani samskritabhasha naiva klishta
    na ca kathina || kavikulaguru valmiki viracita ramayana ramaniya katha | ativa sarala madhura manjula
    naiva klishta na ca kathina || vyasa viracita ganesha likhita mahabharate punya katha | kaurava pandava
    sangara mathita naiva klishta na ca kathina || kurukshetra samarangana gita vishvavandita bhagavadgita
    | ativa madhura karmadipika naiva klishta na ca kathina || kavi kulaguru nava rasonmeshaja ritu raghu
    kumara kavita | vikrama malavika naiva klishta na ca kathina || racana
  devanagari: सुरस सुबोधा विश्वमनोज्ञा ललिता हृद्या रमणीया । अमृतवाणी संस्कृतभाषा नैव क्लिष्टा न च कठिना
    ॥ कविकुलगुरु वाल्मीकि विरचिता रामायण रमणीय कथा । अतीव सरला मधुर मञ्जुला नैव क्लिष्टा न च कठिना ॥ व्यास
    विरचिता गणेश लिखिता महाभारते पुण्य कथा । कौरव पाण्डव सङ्गर मथिता नैव क्लिष्टा न च कठिना ॥ कुरुक्षेत्र
    समराङ्गण गीता विश्ववन्दिता भगवद्गीता । अतीव मधुरा कर्मदीपिका नैव क्लिष्टा न च कठिना ॥ कवि कुलगुरु
    नव रसोन्मेषजा ऋतु रघु कुमार कविता । विक्रम मालविका नैव क्लिष्टा न च कठिना ॥ रचन
