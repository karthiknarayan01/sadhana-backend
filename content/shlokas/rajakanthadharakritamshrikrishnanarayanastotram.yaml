id: rajakanthadharakritamshrikrishnanarayanastotram
category: stotram
name:
  english: rajakanthadharakritamshrikrishnanarayanastotram
  devanagari: राजाकन्थाधरकृतंश्रीकृष्णनारायणस्तोत्रम्
content:
  english: raja kanthadharakritam shrikrishnanarayanastotram mlecchata layamapanna divyaprabha pravardhita
    | kanthadharo vimanastho sastriko devata'bhavat || 88|| anadishrikrishnanarayanam shripurushottamam
    | tushtava paraya pritya vimanastho'tiharshitah || 89|| parabrahma paroddharakripanugrahavigraha |
    tava shishyena rishina taritau papinau prabho || 90|| putrena taritau capi tvaya'pi taritau hare |
    toyaishca taritau dushtau paropakritishalibhih || 91|| vipraishca taritau ghorattamaso'jnanavaibhavat
    | naraki taritau krishnanarayana tavashrayat || 92|| pareshvaraya hritsthaya viprasthaya ca te namah
    | svayamprakasharupaya tirthatmakaya te namah || 93|| namah sharanyadevaya papipranahitaya ca | shritamokshaya
    balaya balakrishnaya te namah || 94|| tvatpratapattarantyeva yaksharakshasapannagah | daityashca danava
    dushta asurastamasastatha || 95|| mayika vasanayukta garvishthashcabhimaninah | vyavayinah pishitadah
    stena asavapayinah || 96|| varnasankarakarashca gostrihatyakarastatha | tvatpratapattarantyeva kripanugrahashevadheh
    || 97|| avam ca taritau yamastava dhama'mritam prabho | ityuktva pranipatyaitau putra svasti tava'stu
    ca || 98|| datva''shisho yayatushca lomashasya''shramam prati |
  devanagari: राजा कन्थाधरकृतं श्रीकृष्णनारायणस्तोत्रम् म्लेच्छता लयमापन्ना दिव्यप्रभा प्रवर्धिता । कन्थाधरो
    विमानस्थो सस्त्रीको देवताऽभवत् ॥ ८८॥ अनादिश्रीकृष्णनारायणं श्रीपुरुषोत्तमम् । तुष्टाव परया प्रीत्या
    विमानस्थोऽतिहर्षितः ॥ ८९॥ परब्रह्म परोद्धारकृपानुग्रहविग्रह । तव शिष्येण ऋषिणा तारितौ पापिनौ प्रभो
    ॥ ९०॥ पुत्रेण तारितौ चापि त्वयाऽपि तारितौ हरे । तोयैश्च तारितौ दुष्टौ परोपकृतिशालिभिः ॥ ९१॥ विप्रैश्च
    तारितौ घोरात्तमसोऽज्ञानवैभवात् । नारकी तारितौ कृष्णनारायण तवाश्रयात् ॥ ९२॥ परेश्वराय हृत्स्थाय विप्रस्थाय
    च ते नमः । स्वयम्प्रकाशरूपाय तीर्थात्मकाय ते नमः ॥ ९३॥ नमः शरण्यदेवाय पापिप्राणहिताय च । श्रितमोक्षाय
    बालाय बालकृष्णाय ते नमः ॥ ९४॥ त्वत्प्रतापात्तरन्त्येव यक्षराक्षसपन्नगाः । दैत्याश्च दानवा दुष्टा आसुरास्तामसास्तथा
    ॥ ९५॥ मायिका वासनायुक्ता गर्विष्ठाश्चाभिमानिनः । व्यवायिनः पिशितादाः स्तेना आसवपायिनः ॥ ९६॥ वर्णसङ्करकाराश्च
    गोस्त्रीहत्याकरास्तथा । त्वत्प्रतापात्तरन्त्येव कृपानुग्रहशेवधेः ॥ ९७॥ आवां च तारितौ यामस्तव धामाऽमृतं
    प्रभो । इत्युक्त्वा प्रणिपत्यैतौ पुत्र स्वस्ति तवाऽस्तु च ॥ ९८॥ दत्वाऽऽशिषो ययतुश्च लोमशस्याऽऽश्रमं
    प्रति ।
