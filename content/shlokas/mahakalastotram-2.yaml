id: mahakalastotram-2
category: stotram
name:
  english: mahakalastotram 2
  devanagari: महाकालस्तोत्रम् २
content:
  english: mahakalastotram 2 namasyami mahakalam sarvasampattidayakam | kharvam lambodaram nilamashtanagavibhushitam
    || 1|| dvibhujaikamukham viram kapalakritashekharam | vyaghracarmakativeshtam shatardhamundamalinam
    || 2|| bhavabhavaparicchinnam jagatsambodhakarakam | sarvabhavatmakam natham jagannatha namo'stu te
    || 3|| krishnavarnam mahatejam siddhasadhakarakshakam | kartikapalinam natham mahakala namo'stu te
    || 4|| vyaghracarmambaradharam mahakrodhasvarupinam | dvadashadityasankasham mahakala namo'stu te
    || 5|| mahadamshtrakaralasyam lalajjihvam sabhairavam | maharaktabhanayanam mahakala namo'stu te ||
    6|| vibhrannarashiromalam nagarajavibhushitam | shmashrutundilakam vandyam mahakala namo'stu te ||
    7|| sabhrubhangam trinetram caivordhvapingordhvakesaram | yugantanalapunjabham mahakala namo'stu te
    || 8|| trasakam sarvadaityana
  devanagari: महाकालस्तोत्रम् २ नमस्यामि महाकालं सर्वसम्पत्तिदायकम् । खर्वं लम्बोदरं नीलमष्टनागविभूषितम्
    ॥ १॥ द्विभुजैकमुखं वीरं कपालकृतशेखरम् । व्याघ्रचर्मकटीवेष्टं शतार्धमुण्डमालिनम् ॥ २॥ भावाभावपरिच्छिन्नं
    जगत्सम्बोधकारकम् । सर्वभावात्मकं नाथं जगन्नाथ नमोऽस्तु ते ॥ ३॥ कृष्णवर्णं महातेजं सिद्धसाधकरक्षकम्
    । कर्तिकपालिनं नाथं महाकाल नमोऽस्तु ते ॥ ४॥ व्याघ्रचर्माम्बरधरं महाक्रोधस्वरूपिणम् । द्वादशादित्यसङ्काशं
    महाकाल नमोऽस्तु ते ॥ ५॥ महादंष्ट्राकरालास्यं ललज्जिह्वं सभैरवम् । महारक्ताभनयनं महाकाल नमोऽस्तु ते
    ॥ ६॥ विभ्रन्नरशिरोमालां नागराजविभूषितम् । श्मश्रुतुन्दिलकं वन्द्यं महाकाल नमोऽस्तु ते ॥ ७॥ सभ्रूभङ्गं
    त्रिनेत्रं चैवोर्ध्वपिङ्गोर्ध्वकेसरम् । युगान्तानलपुञ्जाभं महाकाल नमोऽस्तु ते ॥ ८॥ त्रासकं सर्वदैत्याना
