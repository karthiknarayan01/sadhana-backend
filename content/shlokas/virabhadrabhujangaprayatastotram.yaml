id: virabhadrabhujangaprayatastotram
category: stotram
name:
  english: virabhadrabhujangaprayatastotram
  devanagari: वीरभद्रभुजन्गप्रयातस्तोत्रम्
content:
  english: prakrishtaribadhamalam samharashu | prayatnena mam raksha raksheti yo vai vadettasya devam
    bhaje virabhadram || 10|| mahahetishailendradhikaste karasaktashulasibanasanani | sharaste yugantashaniprakhyashaurya
    bhavantityupasyam bhaje virabhadram || 11|| yada tvatkripapatrajantusvacitte mahadeva viresha mam
    raksha raksha | vipakshanamun bhaksha bhaksheti yo vai vadettasya mitram bhaje virabhadram || 12||
    anantashca shankhastatha kambalo'sau vamatkalakutashca karkotakahih | tatha takshakashcarisanghannihanya
  devanagari: प्रकृष्टारिबाधामलं संहराशु । प्रयत्नेन मां रक्ष रक्षेति यो वै वदेत्तस्य देवं भजे वीरभद्रम्
    ॥ १०॥ महाहेतिशैलेन्द्रधिकास्ते करासक्तशूलासिबाणासनानि । शरास्ते युगान्ताशनिप्रख्यशौर्या भवन्तीत्युपास्यं
    भजे वीरभद्रम् ॥ ११॥ यदा त्वत्कृपापात्रजन्तुस्वचित्ते महादेव वीरेश मां रक्ष रक्ष । विपक्षानमून् भक्ष
    भक्षेति यो वै वदेत्तस्य मित्रं भजे वीरभद्रम् ॥ १२॥ अनन्तश्च शङ्खस्तथा कम्बलोऽसौ वमत्कालकूटश्च कर्कोटकाहिः
    । तथा तक्षकश्चारिसङ्घान्निहन्या
meaning: {}
