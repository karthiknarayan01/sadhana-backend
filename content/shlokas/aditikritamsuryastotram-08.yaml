id: aditikritamsuryastotram-08
category: stotram
name:
  english: aditikritamsuryastotram 08
  devanagari: अदितिकृतंसूर्यस्तोत्रम् ०८
content:
  english: aditikritam suryastotram 8 aditiruvaca | namastubhyam param sukshmam supunyam bibhrate'tulam
    | dhama dhamavatamisham dhamadharam ca shashvatam || 12|| jagatamupakaraya tvamaham staumi gopate
    | adadanasya yadrupam tivram tasmai namamyaham || 13|| grahitumashtamasena kalenambumayam rasam |
    bibhratastava yadrupamatitivram natasmi tat || 14|| sametamagnisomabhyam namastasmai gunatmane | yadrupam
    rigyajuhsamnamaikyena tapate tava || 15|| vishvametattrayisamjnam namastasmai vibhavaso | yattu tasmatparam
    rupamomityuktvabhisamhitam || 16|| iti brahmapurane dvatrimshadhyayantargatam aditikritam suryastotram
    samapetam | brahmapurana | adhyaya 32
  devanagari: अदितिकृतं सूर्यस्तोत्रम् ८ अदितिरुवाच । नमस्तुभ्यं परं सूक्ष्मं सुपुण्यं बिभ्रतेऽतुलम् ।
    धाम धामवतामीशं धामाधारं च शाश्वतम् ॥ १२॥ जगतामुपकाराय त्वामहं स्तौमि गोपते । आददानस्य यद्रूपं तीव्रं
    तस्मै नमाम्यहम् ॥ १३॥ ग्रहीतुमष्टमासेन कालेनाम्बुमयं रसम् । बिभ्रतस्तव यद्रूपमतितीव्रं नतास्मि तत्
    ॥ १४॥ समेतमग्निसोमाभ्यां नमस्तस्मै गुणात्मने । यद्रुपं ऋग्यजुःसाम्नामैक्येन तपते तव ॥ १५॥ विश्वमेतत्त्रयीसंज्ञं
    नमस्तस्मै विभावसो । यत्तु तस्मात्परं रूपमोमित्युक्त्वाभिसंहितम् ॥ १६॥ इति ब्रह्मपुराणे द्वात्रिंशाध्यायान्तर्गतं
    अदितिकृतं सूर्यस्तोत्रं समापेतम् । ब्रह्मपुराण । अध्याय ३२
meaning: {}
