id: arjunakritamsuryastotram-22
category: stotram
name:
  english: arjunakritamsuryastotram 22
  devanagari: अर्जुनकृतंसूर्यस्तोत्रम् २२
content:
  english: 70|| udadhijalatarangakshobhalolakshiyugmaih saphanimanimayukhodbhasitairlelihadbhih | pranipatitashirobhirnagamukhyairajasram
    shrutibhiranupamabhih stuyase pushkalabhih || 71|| tava suravara gacchato'nusaranti tridashanadikamalodgatani
    vataih | kanakakamalarenupinjaritani bhramarakulani patanga camarani || 72|| tattvadhyanam jalanidhinivahe
    sthitva sthitva carananivahaih | ajivartham pratapasi bhagavankaste tulyastribhuvanasamaye || 73||
    udayadrinitambasamsthitasya hyudayeshvastamayeshu cavritasya | kiranastapaniyasaprabhaste vilasantastadito
    vidambayanti || 74|| yatha yatha vrajati rathastavambare vipatayanghanatimiraughasancayan | tatha
    tatha kshubhitamahanilasritam pratiyate muhuriva dundubhiryatha || 75|| carupadmavinimilitekshanam
    cakravakakalahamsamekhalam | kaminimiva ratishramalasam tam vibodhayasi padminim karaih || 76|| nilalolamatikantamutpalam
    bhringatungacaranakulikritam | tvatprabhabhiranuragaranjitam padmaragamiva shobhate bhrisham || 77||
    sphuracchashankaharanirmalam tvadamshapuritam | vibhatyativa kantamambaram brihacca patalam || 78||
    harisi tvameva tapamiha tavadudetya nrinam bhavati ca yavadeva kiranaistava purnamidam | rishibhirmunibhirudaradhibhih
    shashvatamargaparairvarada na shakyate tava gunastutirashrayitum || 79|| tvam vishnustvam shashankastvamasuramathanah
    shanmukhastvam dhanesha
  devanagari: ७०॥ उदधिजलतरङ्गक्षोभलोलाक्षियुग्मैः सफणिमणिमयूखोद्भासितैर्लेलिहद्भिः । प्रणिपतितशिरोभिर्नागमुख्यैरजस्रं
    श्रुतिभिरनुपमाभिः स्तूयसे पुष्कलाभिः ॥ ७१॥ तव सुरवर गच्छतोऽनुसरन्ति त्रिदशनदीकमलोद्गतानि वातैः । कनककमलरेणुपिञ्जरितानि
    भ्रमरकुलानि पतङ्ग चामराणि ॥ ७२॥ तत्त्वध्यानं जलनिधिनिवहे स्थित्वा स्थित्वा चरणनिवहैः । आजीवार्थं प्रतपसि
    भगवन्कस्ते तुल्यस्त्रिभुवनसमये ॥ ७३॥ उदयाद्रिनितम्बसंस्थितस्य ह्युदयेष्वस्तमयेषु चावृतस्य । किरणास्तपनीयसप्रभास्ते
    विलसन्तस्तडितो विडम्बयन्ति ॥ ७४॥ यथा यथा व्रजति रथस्तवाम्बरे विपाटयन्घनतिमिरौघसञ्चयान् । तथा तथा क्षुभितमहानिलासृतं
    प्रतीयते मुहुरिव दुन्दुभिर्यथा ॥ ७५॥ चारुपद्मविनिमीलितेक्षणां चक्रवाककलहंसमेखलाम् । कामिनीमिव रतिश्रमालसां
    तां विबोधयसि पद्मिनीं करैः ॥ ७६॥ नीललोलमतिकान्तमुत्पलं भृङ्गतुङ्गचरणाकुलीकृतम् । त्वत्प्रभाभिरनुरागरञ्जितं
    पद्मरागमिव शोभते भृशम् ॥ ७७॥ स्फुरच्छशाङ्कहारनिर्मलं त्वदंशपूरितम् । विभात्यतीव कान्तमम्बरं बृहच्च
    पाटलम् ॥ ७८॥ हरिसि त्वमेव तापमिह तावदुदेत्य नॄणां भवति च यावदेव किरणैस्तव पूर्णमिदम् । ऋषिभिर्मुनिभिरुदारधीभिः
    शाश्वतमार्गपरैर्वरद न शक्यते तव गुणस्तुतिराश्रयितुम् ॥ ७९॥ त्वं विष्णुस्त्वं शशाङ्कस्त्वमसुरमथनः शण्मुखस्त्वं
    धनेश
