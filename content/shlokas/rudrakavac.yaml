id: rudrakavac
category: kavacha
name:
  english: rudrakavac
  devanagari: रुद्रकवच्
content:
  english: rudravarmam pravakshyami angapranasya rakshaye | ahoratramayam devam rakshartham nirmitam pura
    || 2|| rudro me cagratah patu patu parshvau harastatha | shiro me ishvarah patu lalatam nilalohitah
    || 3|| netrayostryambakah patu mukham patu maheshvarah | karnayoh patu me shambhurnasikayam sadashivah
    || 4|| vagishah patu me jihvamoshthau patvambikapatih | shrikanthah patu me grivam bahucaiva pinakadhrit
    || 5|| hridayam me mahadeva ishvaro'vyatstanantaram | nabhim katim ca vakshashca patu sharva umapatih
    || 6|| bahumadhyantaram caiva sukshmarupassadashivah | sarvam rakshatu me sharvo gatrani ca yatha
    kramam || 7|| vajram ca shaktidam caiva pashankushadharam tatha | gandashuladharannityam rakshatu
    tridasheshvarah || 8|| prasthaneshu pade caiva vrikshamule naditate | sandhyayam rajabhavane virupakshastu
    patu mam || 9|| shitoshnadatha kaleshu tuhinadrumakantake | nirmanushye same marge pahi mam vrishabhadhvaja
    || 10|| ityetadrudrakavacam pavitram papanashanam | mahadevaprasadena durvasomunikalpitam || 11| mamakhyatam
    samasena na bhayam tena vidyate |
  devanagari: रुद्रवर्मं प्रवक्ष्यामि अङ्गप्राणस्य रक्षये । अहोरात्रमयं देवं रक्षार्थं निर्मितं पुरा ॥
    २॥ रुद्रो मे चाग्रतः पातु पातु पार्श्वौ हरस्तथा । शिरो मे ईश्वरः पातु ललाटं नीललोहितः ॥ ३॥ नेत्रयोस्त्र्यम्बकः
    पातु मुखं पातु महेश्वरः । कर्णयोः पातु मे शम्भुर्नासिकायां सदाशिवः ॥ ४॥ वागीशः पातु मे जिह्वामोष्ठौ
    पात्वम्बिकापतिः । श्रीकण्ठः पातु मे ग्रीवां बाहूचैव पिनाकधृत् ॥ ५॥ हृदयं मे महादेव ईश्वरोऽव्यात्स्तनान्तरम्
    । नाभिं कटिं च वक्षश्च पातु शर्व उमापतिः ॥ ६॥ बाहुमध्यान्तरं चैव सूक्ष्मरूपस्सदाशिवः । सर्वं रक्षतु
    मे शर्वो गात्राणि च यथा क्रमम् ॥ ७॥ वज्रं च शक्तिदं चैव पाशाङ्कुशधरं तथा । गण्डशूलधरान्नित्यं रक्षतु
    त्रिदशेश्वरः ॥ ८॥ प्रस्थानेषु पदे चैव वृक्षमूले नदीतटे । सन्ध्यायां राजभवने विरूपाक्षस्तु पातु माम्
    ॥ ९॥ शीतोष्णादथ कालेषु तुहिनद्रुमकण्टके । निर्मनुष्ये समे मार्गे पाहि मां वृषभध्वज ॥ १०॥ इत्येतद्रुद्रकवचं
    पवित्रं पापनाशनम् । महादेवप्रसादेन दुर्वासोमुनिकल्पितम् ॥ ११। ममाख्यातं समासेन न भयं तेन विद्यते ।
