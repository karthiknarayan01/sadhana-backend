id: vanadrinathadayitastotram
category: stotram
name:
  english: vanadrinathadayitastotram
  devanagari: वानाद्रिनाथदयितास्तोत्रम्
content:
  english: vakshoviharini manoharadivyavaktre | shribhushanairmanimayaih shubhadivyagatre tvatpadapankajayugam
    sharanam prapadye || 1|| shrimadvanadritatagasya susundarasya dordandashandasuviharini sindhukanye
    | tvadvikshanairvilasitaih stimitaih shubhaishca lakshmi tvameva paripalaya durbalam mam || 2|| dayanidhe
    komaladivyagatre shucismite nirmalacandravaktre | sarojakantayatalocane tvam mamabdhikanye sumukham
    pradehi || 3|| pita ca bhata ca gurushca bandhuh tvameva sarvam mama sindhukanye | padaravinde sharanam
    gatam mam tatastu te palaya lokamatah || 4|| manisanghabhushanaganairalankrite gananavihinasugunairvibhushite
    | api mam sudhabdhitanaye shucismite gunahinakam ca paripalayendire || 5|| vanashailanathadayite dayanidhe
    bhuvanadhipeshvari shucismitanane | nalinayatakshi namatam sukhaprade tava padapankajayugam bhaje
    sada || 6|| vrishacaleshasya susundarasya bhujantararamayathecchalile | gunena rupena vilasitaistvam
    rame sadanandayase mukundam || 7|| mukundavakshahsthaladivyalila
  devanagari: वक्षोविहारिणि मनोहरदिव्यवक्त्रे । श्रीभूषणैर्मणिमयैः शुभदिव्यगात्रे त्वत्पादपङ्कजयुगं शरणं
    प्रपद्ये ॥ १॥ श्रीमद्वनाद्रितटगस्य सुसुन्दरस्य दोर्दण्डषण्डसुविहारिणि सिन्धुकन्ये । त्वद्वीक्षणैर्विलसितैः
    स्तिमितैः शुभैश्च लक्ष्मि त्वमेव परिपालय दुर्बलं माम् ॥ २॥ दयानिधे कोमलदिव्यगात्रे शुचिस्मिते निर्मलचन्द्रवक्त्रे
    । सरोजकान्तायतलोचने त्वं ममाब्धिकन्ये सुमुखं प्रदेहि ॥ ३॥ पिता च भाता च गुरुश्च बन्धुः त्वमेव सर्वं
    मम सिन्धुकन्ये । पदारविन्दे शरणं गतं मां ततस्तु ते पालय लोकमातः ॥ ४॥ मणिसङ्घभूषणगणैरलङ्कृते गणनाविहीनसुगुणैर्विभूषिते
    । अपि मां सुधाब्धितनये शुचिस्मिते गुणहीनकं च परिपालयेन्दिरे ॥ ५॥ वनशैलनाथदयिते दयानिधे भुवनाधिपेश्वरि
    शुचिस्मितानने । नलिनायताक्षि नमतां सुखप्रदे तव पादपङ्कजयुगं भजे सदा ॥ ६॥ वृषाचलेशस्य सुसुन्दरस्य भुजान्तरारामयथेच्छलीले
    । गुणेन रूपेण विलासितैस्त्वं रमे सदानन्दयसे मुकुन्दम् ॥ ७॥ मुकुन्दवक्षःस्थलदिव्यलीला
