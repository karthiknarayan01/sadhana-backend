id: dakshinakalikakavacam-1
category: kavacha
name:
  english: dakshinakalikakavacam 1
  devanagari: दक्षिणकालिकाकवचम् १
content:
  english: bhairava uvaca | kalikakavacasya bhairava rishirushnikchandah advaitarupini shridakshinakalika
    devata hrim bijam hum shaktih krim kilakam sarvarthasadhanapurahsaramantrasiddhau viniyogah || sahasrare
    mahapadme karpuradhavalo guruh || 1|| vamorusthitatacchaktih sada sarvatra rakshatu | parameshah purah
    patu paraparagurustatha || 2|| parameshthi guruh patu divyasiddhishca manavah | mahadevi sada patu
    mahadevah sadavatu || 3|| tripuro bhairavah patu divyarupadharah sada | brahmanandah sada patu purnadevah
    sadavatu | calacittah sada patu celancalashca patu mam || 4|| kumarah krodhanashcaiva varadah smaradipanah
    | maya mayavati caiva siddhaughah pantu sarvada || 5|| vimalah kushalashcaiva bhimasenah sudhakarah
    | mino gorakshakashcaiva bhojadevah prajapatih || 6|| kuladevo rantidevo vighneshvarahutashanah |
    santoshah samayanandah patu mam manavasada || 7|| sarve'pyanandanathantah ambanta matarah kramat |
    gananathah sada patu bhairavah patu mam sada || 8|| vatuko nah sada patum durga mam parirakshatu |
    shirasah padaparyyantam patu mam ghoradakshina || 9|| tatha shirasi mam kali hridi mule ca rakshatu
    | sampurnavidyaya devi sada sarvatra rakshatu || 10|| krim krim krim vadane patu hridi hum hum sadavatu
    | hrim hrim patu sadadhare dakshine kalike hridi || 11|| krim krim krim patu me purve hum hum dakshe
    sadavatu | hrim hrim mam pashcime patu hum hum patu sadottare || 12|| prishthe patu sada svaha mula
    sarvatra rakshatu | shadange yuktau patu shadangeshu sadaiva mam || 13|| mantrarajah sada patu urdhvadho
    digvidiksthitah | cakraraje sthitashcapi devatah paripantu mam || 14|| ugra ugraprabha dipta patu
    purve trikonake | nila ghana balaka ca tathaparatrikonake || 15|| matra mudramita caiva tatha madhyatrikonake
    | kali kapalini kulla kurukulla virodhini || 16|| vahih shatkonake pantu vipracitta tatha priye |
    sarvah shyamah khadgadhara vamahastena tarjanah || 17|| brahmi purvadale patu narayanau tathagnike
    | maheshvari dakshadale camunda rakshase'vatu || 18|| kaumari pashcime patu vayavye caparajita | varahi
    cottare patu narasimhim shive'vatu || 19|| aim hrim asitangah purve bhairavah parirakshatu | aim hrim
    rurushcagnikone aim hrim candastu dakshine || 20|| aim hrim krodho nairrite'vyat aim hrim unmattakastatha
    | pashcime aim hrim mam kapali vayukonake || 21|| aim hrim bhishanakhyashca uttare'vatu bhairavah
    | aim hrim samhara aishanyam matrinamankagah shivah || 22|| aim hetuko vatukah purvadale patu sadaiva
    mam | aim tripurantako vatuka agneyyam sarvada'vatu || 23|| aim vahnivetalo vatuko dakshine mam sada'vatu
    | aim agnijihvavatuko'vyat nairrityam pashcime tatha || 24|| aim kalavatukah patu aim karalavatukastatha
    | vayavyam aim ekah patu uttare vatuko'vatu || 25|| aim bhaumavatukah patu aishanyam dishi mam sada
    | aim hrim hrim hum phat svahantashcatuhshashtimatarah || 26|| urddhavadho dashavamagre prishthadeshe
    tu patu mam | aim hum simhavyaghramukhi purve mam parirakshatu || 27|| aim kam kim sarpamukhi agnikone
    sada'vatu | aim mam mam mrigameshamukhi dakshine mam sada'vatu || 28|| aim caum caum gajarajamukhi
    nairrityam mam sada'vatu | aim mem mem vidalamukhi pashcime patu mam sada || 29|| aim khaum khaum
    kroshtumukhi vayukone sada'vatu | aim ham ham hrasvadirghamukhi lambodaramahodari || 30|| patu mamuttare
    kone aim hrim hrim shivakonake | hrasvajanghatalajanghapralambaushthi sada'vatu || 31|| etah shmashanavasinyo
    bhishana vikritananah | patu mam sarvada devyah sadhakabhishtapurikah || 32|| indro mam purvato rakshedagneyyamagnidevata
    | dakshe yamah sada patu nairrityam nairritishca mam || 33|| varuno'vatu mam pashcat vayurmam vayave'vatu
    | kuverashcottarepayat aishanyantu sadashivah || 34|| urdhvam brahma sada patu adhashmanantadevata
    | purvadidiksthitah pantu vajradyashcayudhashca mam || 35|| kalika'vatu shirasi hridaya kalika'vatu
    | adhare kalika patu padayoh kalika'vatu || 36|| dikshu mam kalika patu vidikshu kalika'vatu | urddhavam
    mem kalika patu adhashca kalika'vatu || 37|| carmasrinmamsamedo'sthimajjashukrani me'vatu | indriyani
    manashcaiva deham siddhinca me'vatu || 38|| akeshat padaparyantam kalika mem sada'vatu | viyati kalika
    patu pathi mam kalika'vatu || 39|| shayane kalika patu sarvakaryeshu kalika | putran me kalika patu
    dhanam me patu kalika || 40|| iti shyamarahasyavarnitam uttaratantre kalibhairavasamvade shrimaddakshinakalikakavacam
    sampurnam |
  devanagari: भैरव उवाच । कालिकाकवचस्य भैरव ऋषिरुष्णिक्छन्दः अद्वैतरूपिणी श्रीदक्षिणकालिका देवता ह्रीं
    बीजं हुं शक्तिः क्रीं कीलकं सर्वार्थसाधनपुरःसरमन्त्रसिद्धौ विनियोगः ॥ सहस्रारे महापद्मे कर्पूरधवलो
    गुरुः ॥ १॥ वामोरुस्थिततच्छक्तिः सदा सर्वत्र रक्षतु । परमेशः पुरः पातु परापरगुरुस्तथा ॥ २॥ परमेष्ठी
    गुरुः पातु दिव्यसिद्धिश्च मानवः । महादेवी सदा पातु महादेवः सदावतु ॥ ३॥ त्रिपुरो भैरवः पातु दिव्यरूपधरः
    सदा । ब्रह्मानन्दः सदा पातु पूर्णदेवः सदावतु । चलचित्तः सदा पातु चेलाञ्चलश्च पातु माम् ॥ ४॥ कुमारः
    क्रोधनश्चैव वरदः स्मरदीपनः । माया मायावती चैव सिद्धौघाः पान्तु सर्वदा ॥ ५॥ विमलः कुशलश्चैव भीमसेनः
    सुधाकरः । मीनो गोरक्षकश्चैव भोजदेवः प्रजापतिः ॥ ६॥ कुलदेवो रन्तिदेवो विघ्नेश्वरहुताशनः । सन्तोषः समयानन्दः
    पातु मां मानवासदा ॥ ७॥ सर्वेऽप्यानन्दनाथान्ताः अम्बान्ता मातरः क्रमात् । गणनाथः सदा पातु भैरवः पातु
    मां सदा ॥ ८॥ वटुको नः सदा पातुं दुर्गा मां परिरक्षतु । शिरसः पादपर्य्यन्तं पातु मां घोरदक्षिणा ॥ ९॥
    तथा शिरसि मां काली हृदि मूले च रक्षतु । सम्पूर्णविद्यया देवी सदा सर्वत्र रक्षतु ॥ १०॥ क्रीं क्रीं
    क्रीं वदने पातु हृदि हुं हुं सदावतु । ह्रीं ह्रीं पातु सदाधारे दक्षिणे कालिके हृदि ॥ ११॥ क्रीं क्रीं
    क्रीं पातु मे पूर्वे हुं हुं दक्षे सदावतु । ह्रीं ह्रीं मां पश्चिमे पातु हुं हुं पातु सदोत्तरे ॥ १२॥
    पृष्ठे पातु सदा स्वाहा मूला सर्वत्र रक्षतु । षडङ्गे युक्तौ पातु षडङ्गेषु सदैव माम् ॥ १३॥ मन्त्रराजः
    सदा पातु ऊर्ध्वाधो दिग्विदिक्स्थितः । चक्रराजे स्थिताश्चापि देवताः परिपान्तु माम् ॥ १४॥ उग्रा उग्रप्रभा
    दीप्ता पातु पूर्वे त्रिकोणके । नीला घना बलाका च तथापरत्रिकोणके ॥ १५॥ मात्रा मुद्रामिता चैव तथा मध्यत्रिकोणके
    । काली कपालिनी कुल्ला कुरुकुल्ला विरोधिनी ॥ १६॥ वहिः षट्कोणके पान्तु विप्रचित्ता तथा प्रिये । सर्वाः
    श्यामाः खड्गधरा वामहस्तेन तर्जनाः ॥ १७॥ ब्राह्मी पूर्वदले पातु नारायणौ तथाग्निके । माहेश्वरी दक्षदले
    चामुण्डा राक्षसेऽवतु ॥ १८॥ कौमारी पश्चिमे पातु वायव्ये चापराजिता । वाराही चोत्तरे पातु नारसिंहीं शिवेऽवतु
    ॥ १९॥ ऐं ह्रीं असिताङ्गः पूर्वे भैरवः परिरक्षतु । ऐं ह्रीं रुरुश्चाग्निकोणे ऐं ह्रीं चण्डस्तु दक्षिणे
    ॥ २०॥ ऐं ह्रीं क्रोधो नैरॄतेऽव्यात् ऐं ह्रीं उन्मत्तकस्तथा । पश्चिमे ऐं ह्रीं मां कपाली वायुकोणके
    ॥ २१॥ ऐं ह्रीं भीषणाख्यश्च उत्तरेऽवतु भैरवः । ऐं ह्रीं संहार ऐशान्यां मातॄणामङ्कगाः शिवाः ॥ २२॥ ऐं
    हेतुको वटुकः पूर्वदले पातु सदैव माम् । ऐं त्रिपुरान्तको वटुक आग्नेय्यां सर्वदाऽवतु ॥ २३॥ ऐं वह्निवेतालो
    वटुको दक्षिणे मां सदाऽवतु । ऐं अग्निजिह्ववटुकोऽव्यात् नैरॄत्यां पश्चिमे तथा ॥ २४॥ ऐं कालवटुकः पातु
    ऐं करालवटुकस्तथा । वायव्यां ऐं एकः पातु उत्तरे वटुकोऽवतु ॥ २५॥ ऐं भौमवटुकः पातु ऐशान्यां दिशि मां
    सदा । ऐं ह्रीं ह्रीं हुं फट् स्वाहान्ताश्चतुःषष्टिमातरः ॥ २६॥ ऊर्द्धवाधो दशवामाग्रे पृष्ठदेशे तु पातु
    माम् । ऐं हुं सिंहव्याघ्रमुखी पूर्वे मां परिरक्षतु ॥ २७॥ ऐं कां कीं सर्पमुखी अग्निकोणे सदाऽवतु । ऐं
    मां मां मृगमेषमुखी दक्षिणे मां सदाऽवतु ॥ २८॥ ऐं चौं चौं गजराजमुखी नैरॄत्यां मां सदाऽवतु । ऐं में में
    विडालमुखी पश्चिमे पातु मां सदा ॥ २९॥ ऐं खौं खौं क्रोष्टुमुखी वायुकोणे सदाऽवतु । ऐं हां हां ह्रस्वदीर्घमुखी
    लम्बोदरमहोदरी ॥ ३०॥ पातु मामुत्तरे कोणे ऐं ह्रीं ह्रीं शिवकोणके । ह्रस्वजङ्घतालजङ्घप्रलम्बौष्ठी सदाऽवतु
    ॥ ३१॥ एताः श्मशानवासिन्यो भीषणा विकृताननाः । पातु मां सर्वदा देव्यः साधकाभीष्टपूरिकाः ॥ ३२॥ इन्द्रो
    मां पूर्वतो रक्षेदाग्नेय्यामग्निदेवता । दक्षे यमः सदा पातु नैरॄत्यां नैरॄतिश्च माम् ॥ ३३॥ वरुणोऽवतु
    मां पश्चात् वायुर्मां वायवेऽवतु । कुवेरश्चोत्तरेपायात् ऐशान्यान्तु सदाशिवः ॥ ३४॥ ऊर्ध्वं ब्रह्मा सदा
    पातु अधश्मानन्तदेवता । पूर्वादिदिक्स्थिताः पान्तु वज्राद्याश्चायुधाश्च माम् ॥ ३५॥ कालिकाऽवतु शिरसि
    हृदय कालिकाऽवतु । आधारे कालिका पातु पादयोः कालिकाऽवतु ॥ ३६॥ दिक्षु मां कालिका पातु विदिक्षु कालिकाऽवतु
    । ऊर्द्धवं में कालिका पातु अधश्च कालिकाऽवतु ॥ ३७॥ चर्मासृङ्मांसमेदोऽस्थिमज्जाशूक्राणि मेऽवतु । इन्द्रियाणि
    मनश्चैव देहं सिद्धिञ्च मेऽवतु ॥ ३८॥ आकेशात् पादपर्यन्तं कालिका में सदाऽवतु । वियति कालिका पातु पथि
    मां कालिकाऽवतु ॥ ३९॥ शयने कालिका पातु सर्वकार्येषु कालिका । पुत्रान् मे कालिका पातु धनं मे पातु कालिका
    ॥ ४०॥ इति श्यामारहस्यवर्णितं उत्तरतन्त्रे कालीभैरवसंवादे श्रीमद्दक्षिणकालिकाकवचं सम्पूर्णम् ।
