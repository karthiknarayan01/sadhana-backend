id: candikahridayam
category: hridaya
name:
  english: candikahridayam
  devanagari: चन्दिकह्रिदयम्
content:
  english: asya shri candika prasada siddhyarthe jape viniyogah | hram ityadi shadamga nyasah | dhyanam
    | sarvamamgaḻa mamgalye shive sarvarttha sadhike | sharanye tryambake gauri narayani namo'stute ||
    brahmovaca | athatassam pravakshyami vistarena yathatatham | candika hridayam guhyam sha
  devanagari: अस्य श्री चण्डिका प्रसाद सिद्ध्यर्थे जपे विनियोगः । ह्रां इत्यादि षडंग न्यासः । ध्यानं ।
    सर्वमंगळ मांगल्ये शिवे सर्वार्त्थ साधिके । शरण्ये त्र्यम्बके गौरी नारायणी नमोऽस्तुते ॥ ब्रह्मोवाच
    । अथातस्सं प्रवक्ष्यामि विस्तरेण यथातथं । चण्डिका हृदयं गुह्यं श
meaning: {}
