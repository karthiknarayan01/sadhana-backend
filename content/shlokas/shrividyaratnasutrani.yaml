id: shrividyaratnasutrani
category: sutra
name:
  english: shrividyaratnasutrani
  devanagari: श्रीविद्यारत्नसूत्राणि
content:
  english: shrividyaratnasutrani shrividyaratnasutrani || shrigaudapadacaryakritam || atha shaktamantragamajijnasa
    || 1|| atmaiva'khandakarah || 2|| caitanyasvarupa cicchaktih || 3|| saiveyamanamakhya shrividya ||
    4|| tattvatrayena sa vividha || 5|| konapatrasamuccayam cakram || 6|| sa shambhavi vidya shyama tattvatrayakritistrividha
    jata || 7|| vidyayah purvottarabhyamanekavidya jatah || 8|| ta vidyah parivara iti || 9|| shyamayah
    purvasmin sthitah || 10|| yamyadishi sthitah saubhagyadayah svasya udbhavah || 11|| tatha'dhah sthitah
    pashcimadishi || 12|| shambhavyah parivara uttarasmin || 13|| svayamurdhva'karena || 14|| atha cintamanigrihasthita
    tripurasundari mahavidya'nuttara || 15|| bhandasurahananarthamekaiva'neka || 16|| taya mantra anekashca
    tatha yantratantrani || 17|| vividha bhaktirvividhopasanam || 18|| tasmat phalanyanekani || 19|| kagajadasharadvayamanva
    srashtadalasvarapatratrivrittabhubimbasanjnakathitam shrisadanam || 20|| manigananavavaranam tasya
    || 21|| svasya janita saubhagyayastandetatsadanam || 22|| svajatvadetatpashcimadeh || 23|| trayanam
    trayanamavarananyekam || 24|| atha thadatapatramanusvaradharani shuddhavidyasadanam || 25|| tadeva
    tatra vasudvayayuktamanusvaram kumarisadanam || 26|| etayoravaranantaksharagananam yalashahanadahapatradharani
    dvadasharddhasadanam || 27|| pabhamajakonasvarajapatraganana dharani shyamasadanam || 28|| pushpinyah
    parisarjanametat || 29|| shriiti pushpinyadivat || 30|| sharikashukayoh || 31|| etasamavaranam sagananam
    || 32|| jagadranjanyadisarvasamevam || 33|| kagatajakonahapatradharaninagah || 34|| tasyavaranam sagananam
    || 35|| samayavadyashvayah sadanam shuddhavidyavat || 36|| datatakonatha naganagadalasyaradharani
    saubhagyayah sannihitasadanam || 37|| atha tasyah pancavaranam || 38|| kahapatrahakonasvarapatra dharani
    vartalisadanam || 39|| kagajakonajapatrasvaradharani batukasya || 40|| evamatasvaradala dhahapatradharani
    tirodhanasya || 41|| tathaitatsamayayah || 42|| gaganaprabhashadvasukonapatrasya dharani bhuvaneshisadanam
    || 43|| yashahakona svaradalahapatra dharani sadanamannapurnayah || 43|| gaganaguna dharma bimbavishishtakala
    bhuvaneshi guhavat samayayah || 44|| gagana vasukonadvayapatrasvaradharani turyasadanam || 45|| khajakonadvayapatrasvaravasupatrayagadharani
    maharddhayah || 46|| dvadasharddhasadanavat svanayakyah || 47|| kalasadanavanmishravidyayah || 48||
    vagvadinyah kumarivat || 49|| gaganaprabha pancakona'tha vasukalapatrabhurekhah paragaram || 50||
    tathaiva prasadavishishtayorubhayoh || 51|| turyasadanavacchambhavyah || 51|| parasadanavat samayayah
    || 52|| vyomadahakarmamanupatra dahakona harimukhasadanam || 53|| vyomajalajapatratrivritta dharani
    shriguroh sadanam || 54|| akathaditrirekhashadvitatrikonameva va shriguroh sadanam || 55|| anuttaravidyanam
    sarvasa~ shuddhavidyavat || 56|| vartalyah pancavaranam || 57|| batukasya shat || 58|| tadvattitrodhanasya
    || 59|| bhuvaneshi sapta || 60|| shatsannihitayah || 61|| kameshyah kalayastrih || 62|| turiyayah
    panca || 63|| shanmaharddhayah || 64|| para prasadasya ca paravat || 65|| shambhavyah pa'ca || 66||
    mrigeshyasyasya shat || 67|| caturbhiravaranairvishishtam bodhakasya sadanam || 68|| atha vidya ekavimshadvarnavishishta
    || 69|| pancadashavarnavishishta saubhagya || 70|| tathaiva pashcima vidya || 71|| shatavarnayuta
    shyama || 72|| dvavimshadaksharavishishta pushpini || 73|| dvicatvarimshadvarna vishishta shukavidya
    || 74|| ashtavimshadaksharavishishta sharikavidya || 75|| pancatrimshadaksharavishishta hasanti devata
    || 76|| aksharatrayavishishta shuddhavidya || 77|| kumari varnatraya vishishta || 78|| dashavarnayuta
    dvadasharddha || 79|| shattrimshadvarnasamucita saubhagyasannihita || 80|| ashtavimshadvarnasamuccayo
    mahaherambasya manuh || 81|| caturvimshadvarnasamuccayo batukasya manuh || 82|| ashtashtottaranavatyaksharasamucita
    kolavadana || 83|| shatpancashadaksharairvishishta yavanika || 84|| ekavarnavishishta bhuvaneshi ||
    85|| athava saptavimshadvarnavishishta || 86|| kakaradipancadashaksharasamucita kadipancadashi ||
    87|| khandadvayayuta caturthasvaravishishta kamakala || 88|| ekaksharavishishta mukhya || 89|| trayodashavishishta
    turya || 90|| navashatavarnavishishta maharddha || 91|| dvadashaksharavishishta'shvarudha || 92||
    ekaksharavishishta mishravidya || 93|| trayodashavarnavishishta vagvadini || 94|| ekavarnavishishta
    para || 95|| paraprasadarupini varnadvayayuta || 96|| varnaikavishishta tathaiva prasadapara || 97||
    atha hrasvadirghashatkasamuccayadashaikavarnavishishtah parashambhuh || 98|| atha hrasvaksharadirghapancasamucita
    tathaiva sankhya para shambhavi || 99|| anuttarasanketapradhanavidya saptadashavarnavishishta || 100||
    athaitasam parivaranamanuparivara asamnkhyakah || 101|| etani sutranyasmabhirgaudapadairuktani ||
    || shrividyaratnasutrani ||
  devanagari: श्रीविद्यारत्नसूत्राणि श्रीविद्यारत्नसूत्राणि ॥ श्रीगौडपादाचार्यकृतम् ॥ अथ शाक्तमन्त्रागमाजिज्ञासा
    ॥ १॥ आत्मैवाऽखण्डाकारः ॥ २॥ चैतन्यस्वरूपा चिच्छक्तिः ॥ ३॥ सैवेयमनामाख्या श्रीविद्या ॥ ४॥ तत्त्वत्रयेण
    सा विविधा ॥ ५॥ कोणपत्रसमुच्चयं चक्रम् ॥ ६॥ सा शाम्भवी विद्या श्यामा तत्त्वत्रयाकृतिस्त्रिविधा जाता
    ॥ ७॥ विद्यायाः पूर्वोत्तराभ्यामनेकविद्या जाताः ॥ ८॥ ता विद्याः परिवारा इति ॥ ९॥ श्यामायाः पूर्वस्मिन्
    स्थिताः ॥ १०॥ याम्यदिशि स्थिताः सौभाग्यादयः स्वस्या उद्भवाः ॥ ११॥ तथाऽधः स्थिताः पश्चिमदिशि ॥ १२॥
    शम्भव्याः परिवारा उत्तरस्मिन् ॥ १३॥ स्वयमूर्ध्वाऽकारेण ॥ १४॥ अथ चिन्तामणिगृहस्थिता त्रिपुरसुन्दरी
    महाविद्याऽनुत्तरा ॥ १५॥ भण्डासुरहननार्थमेकैवाऽनेका ॥ १६॥ तया मन्त्रा अनेकाश्च तथा यन्त्रतन्त्राणि
    ॥ १७॥ विविध भक्तिर्विविधोपासनम् ॥ १८॥ तस्मात् फलान्यनेकानि ॥ १९॥ कगजदशारद्वयमन्व स्राष्टदलस्वरपत्रत्रिवृत्तभूबिम्बसञ्ज्ञाकथितं
    श्रीसदनम् ॥ २०॥ मणिगणनवावरणं तस्य ॥ २१॥ स्वस्या जनित सौभाग्यायास्तन्देतत्सदनम् ॥ २२॥ स्वजत्वादेतत्पश्चिमादेः
    ॥ २३॥ त्रयाणां त्रयाणामावरणान्येकम् ॥ २४॥ अथ ठडतपत्रमनुस्वारधरणि शुद्धाविद्यासदनम् ॥ २५॥ तदेव तत्र
    वसुद्वययुक्तमनुस्वरं कुमारीसदनम् ॥ २६॥ एतयोरावरणान्ताक्षरगणनं यलषहणदहपत्रधरणि द्वदशार्द्धासदनम् ॥
    २७॥ पभमजकोणस्वरजपत्रगणना धरणी श्यामासदनम् ॥ २८॥ पुष्पिण्याः परिसर्जनमेतत् ॥ २९॥ श्रीइति पुष्पिण्यादिवत्
    ॥ ३०॥ शारिकाशुकयोः ॥ ३१॥ एतासामावरणं सगणनम् ॥ ३२॥ जगद्रञ्जन्यादिसर्वासामेवम् ॥ ३३॥ कगतजकोणहपत्रधरणिनागाः
    ॥ ३४॥ तस्यावरणं सगणनम् ॥ ३५॥ समयावद्यश्वयाः सदनं शुद्धविद्यावत् ॥ ३६॥ डततकोणाथ नागनागदलस्यारधरणी सौभाग्यायाः
    सन्निहितासदनम् ॥ ३७॥ अथ तस्याः पञ्चावरणम् ॥ ३८॥ कहपत्रहकोणस्वरपत्रा धरणी वार्तालिसदनम् ॥ ३९॥ कगजकोणजपत्रस्वरधरणी
    बटुकस्य ॥ ४०॥ एवमतस्वरदला धहपत्रधरणी तिरोधानस्य ॥ ४१॥ तथैतत्समयायाः ॥ ४२॥ गगनप्रभाषड्वसुकोणपत्रस्य
    धरणी भुवनेशीसदनम् ॥ ४३॥ यषहकोण स्वरदलहपत्र धरणी सदनमन्नपूर्णायाः ॥ ४३॥ गगनगुणा धर्मा बिम्बविशिष्टकला
    भुवनेशी गुहवत् समयायाः ॥ ४४॥ गगन वसुकोणद्वयपत्रस्वरधरणी तुर्यासदनम् ॥ ४५॥ खजकोणद्वयपत्रस्वरवसुपत्रयगधरणी
    महार्द्धायाः ॥ ४६॥ द्वादशार्द्धासदनवत् स्वनायक्याः ॥ ४७॥ कलासदनवन्मिश्रविद्यायाः ॥ ४८॥ वाग्वादिन्याः
    कुमारिवत् ॥ ४९॥ गगनप्रभा पञ्चकोणाऽथ वसुकलापत्रभूरेखाः परागारम् ॥ ५०॥ तथैव प्रासादविशिष्टयोरुभयोः ॥
    ५१॥ तुर्यासदनवच्छाम्भव्याः ॥ ५१॥ परासदनवत् समयायाः ॥ ५२॥ व्योमदहकर्ममनुपत्रा दहकोणा हरिमुखसदनम् ॥
    ५३॥ व्योमजलजपत्रत्रिवृत्ता धरणी श्रीगुरोः सदनम् ॥ ५४॥ अकथादित्रिरेखशद्वितत्रिकोणमेव वा श्रीगुरोः सदनम्
    ॥ ५५॥ अनुत्तरविद्यानां सर्वासाँ शुद्धविद्यावत् ॥ ५६॥ वार्ताल्याः पञ्चावरणम् ॥ ५७॥ बटुकस्य षट् ॥ ५८॥
    तद्वात्तित्रोधानस्य ॥ ५९॥ भुवनेशी सप्त ॥ ६०॥ षट्सन्निहितायाः ॥ ६१॥ कामेश्याः कलायास्त्रिः ॥ ६२॥ तुरीयायाः
    पञ्च ॥ ६३॥ षण्महार्द्धायाः ॥ ६४॥ परा प्रासादस्य च परावत् ॥ ६५॥ शाम्भव्याः पऽच ॥ ६६॥ मृगेश्यास्यस्य
    षट् ॥ ६७॥ चतुर्भिरावरणैर्विशिष्टं बोधकस्य सदनम् ॥ ६८॥ अथ विद्या एकविंशद्वर्णविशिष्ता ॥ ६९॥ पञ्चदशवर्णाविशिष्टा
    सौभाग्या ॥ ७०॥ तथैव पश्चिमा विद्या ॥ ७१॥ शतवर्णयुता श्यामा ॥ ७२॥ द्वाविंशदक्षरविशिष्टा पुष्पिणी ॥
    ७३॥ द्विचत्वारिंशद्वर्णा विशिष्टा शुकविद्या ॥ ७४॥ अष्टाविंशदक्षरविशिष्टा शारिकाविद्या ॥ ७५॥ पञ्चत्रिंशदक्षरविशिष्टा
    हसन्ती देवता ॥ ७६॥ अक्षरत्रयविशिष्टा शुद्धविद्या ॥ ७७॥ कुमारी वर्णत्रय विशिष्टा ॥ ७८॥ दशवर्णयुता द्वादशार्द्धा
    ॥ ७९॥ षट्त्रिंशद्वर्णसमुचिता सौभाग्यसन्निहिता ॥ ८०॥ अष्टाविंशद्वर्णसमुच्चयो महाहेरम्बस्य मनुः ॥ ८१॥
    चतुर्विंशद्वर्णसमुच्चयो बटुकस्य मनुः ॥ ८२॥ अष्टाष्टोत्तरनवत्यक्षरसमुचिता कोलवदना ॥ ८३॥ षट्पञ्चाशदक्षरैर्विशिष्टा
    यवनिका ॥ ८४॥ एकवर्णविशिष्टा भुवनेशी ॥ ८५॥ अथवा सप्तविंशद्वर्णविशिष्टा ॥ ८६॥ ककारादिपञ्चदशाक्षरसमुचिता
    कादिपञ्चदशी ॥ ८७॥ खण्डद्वययुता चतुर्थस्वरविशिष्टा कामकला ॥ ८८॥ एकाक्षरविशिष्टा मुख्या ॥ ८९॥ त्रयोदशविशिष्टा
    तुर्या ॥ ९०॥ नवशतवर्णविशिष्टा महार्द्धा ॥ ९१॥ द्वादशाक्षरविशिष्टाऽश्वारूढा ॥ ९२॥ एकाक्षरविशिष्टा मिश्रविद्या
    ॥ ९३॥ त्रयोदशवर्नविशिष्टा वाग्वादिनी ॥ ९४॥ एकवर्णविशिष्टा परा ॥ ९५॥ पराप्रसादरूपिणी वर्णद्वययुता ॥
    ९६॥ वर्णैकविशिष्टा तथैव प्रासादपरा ॥ ९७॥ अथ ह्रस्वदीर्घषट्कसमुच्चयदशैकवर्णविशिष्टः पराशम्भुः ॥ ९८॥
    अथ ह्रस्वाक्षरदीर्घपञ्चसमुचिता तथैव सङ्ख्या परा शाम्भवी ॥ ९९॥ अनुत्तरसङ्केतप्रधानविद्या सप्तदशवर्णविशिष्टा
    ॥ १००॥ अथैतासां परिवाराणामनुपरिवारा असंङ्ख्याकाः ॥ १०१॥ एतानि सूत्राण्यस्माभिर्गौडपादैरुक्तानि ॥ ॥
    श्रीविद्यारत्नसूत्राणि ॥
