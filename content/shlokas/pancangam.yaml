id: pancangam
category: sahasranama
name:
  english: pancangam
  devanagari: पन्चान्गम्
content:
  english: evam dhyatva nyasam kuryyat || tatha ca tatra kramah || om a~ vighneshahribhyam namah lalate
    | 1| om a~ vighnarajashribhyam namah mukhavritte | 2| om i~ vinayakapushtibhyam namah dakshinanetre
    | 3| om i~ shivottamashantibhyam namah vamanetre | 4| om u~ vighnakritsvastibhyam namah dakshinakarne
    | 5| om u~ vighnahartrisarasvatibhyam namah vamakarne | 6| om ri~ ganasvahabhyam namah dakshinanasapute
    | 7| om ri~ ekadantasumedhabhyam namah vamanasapute | 8| om li~ dvidantakantibhyam namah dakshinagande
    | 9| om li~ gajavaktrakaminibhyam namah vamagande | 10| om e~ niranjanamohinibhyam namah urdhvoshthe
    | 11| om aim kapardinatibhyam namah adharoshthe | 12| om om dirghajihvaparvatibhyam namah urdhvadantapanktau
    | 13| om aum shankukarnajvalinibhyam namah adhodantapanktau | 14| om a~ vrishabhadhvajanandabhyam
    namah shirasi | 15| om ah ganeshasureshibhyam namah mukhe | 16| om ka~ gajendrakamarupinibhyam namah
    dakshinabahumule | 17| om kha~ shurpakarnomabhyam namah dakshinakurpare | 18| om ga~ trilocanatejovatibhyam
    namah dakshinamanibandhe | 19| om gha~ lambodarasatyabhyam namah dakshangulimule | 20| om na~ mahanandavighneshibhyam
    namah dakshangulyagre | 21| om ca~ caturmurtisvarupinibhyam namah vamabahumule | 22| om cha~ sadashivakamadabhyam
    namah vamakurpare | 23| om ja~ amodamadajihvabhyam namah vamamanibandhe | 24| om jha~ durmukhabhutibhyam
    namah vamangulimule | 25| om na~ sumukhabhautikabhya namah vamangulyagre | 26| om ta~ pramodasitabhyam
    namah dakshapadamule | 27| om tha~ ekapadaramabhyam namah dakshinajanuni | 28| om da~ dvijihvamahishibhyam
    namah dakshinagulphe | 29| om dha~ shurabhanjanibhyam namah dakshinapadangulimule | 30| om na~ viravikaranabhyam
    namah dakshinapadangulyagre | 31| om ta~ shanmukhabhrikutibhyam namah vamapadamule | 32| om tha~ varadalajjabhyam
    namah vamajanuni | 33| om da~ vamadevadirgha ghonabhyam namah vamagulphe | 34| om dha~ vakratundadhanurdharabhyam
    namah vamapadangulimule | 35| om na~ dviradayaminibhyam namah vamapadangulyagre | 36| om pa~ senaniratribhyam
    namah dakshinaparshve | 37| om pha~ kamandhagramanibhyam namah vamaparshve | 38| om ba~ mattashashiprabhabhyam
    namah prishthe | 39| om bha~ vimattalolalocanabhyam namah nabhau | 40| om ma~ mattavahanacancalabhyam
    namah jathare | 41| om ya~ tvagatmabhyam jatidiptibhyam hridi | 42| om ra~ asrigatmabhyam mundisubhagabhyam
    namah dakshamse | 43| om la~ mamsatmabhyam khadidurbhagabhyam namah kakudi | 44| om va~ medatmabhyam
    namah varenyashivabhyam namah vamase | 45| om sha~ asthyatmabhyam vrishaketanabhagabhyam namah hridayadidakshahastantam
    | 46| om sha~ majjatmabhyam bhaktipriyabhaginibhyam namah hridayadivamahastantam | 47| om sa~ shukratmabhyam
    ganeshabhoginibhyam namah hridayadidakshapadantam | 48| om ha~ pranatmabhyam meghanadasubhagabhyam
    namah hridayadivamapadantam | 49| om ḻa~ shaktyatmabhyam vyaptikalaratribhyam namah jathare | 50|
    om ksha~ paramatmabhyam ganeshvarakalikabhyam namah mukhe | 51|| iti sarvaganeshamantrangabhutavighneshadikalamatrikanyasah
    || evam kalanyasam kritva prayogoktanyasadikam kuryyat || tatah pithadau racite sarvatobhadramandale
    ganeshamandale va mandukadiparatattvantapithadevatah sthapayet || tatha ca || pushpakshatanadaya svavamabhage
    shrigurubhyo namah | 1| dakshine ganapataye namah | 2| madhye sveshtadevatayai namah | 3| iti natva
    pithamadhye om ma~ mandukaya namah | 4| om ka~ kalagnirudraya namah | 5| om a~ adharashaktaye namah
    | 6| om ku~ kurmaya namah | 7| om a~ anantaya namah | 8| om pri~ prithivyai namah | 9| om kshim kshirasagaraya
    namah | 10| om ra~ ratnadvipaya namah | 11| om ra~ ratnamandapaya namah | 12| om ka~ kalpavrikshayai
    namah | 13| om ra~ ratnavedikayai namah | 14| om ra~ ratnasimhasanaya namah | 15| ityuparyupari sampujya
    || agneyyam om dha~ dharmmaya namah | 16| nairrityam om jna~ jnanaya namah | 17| vayavye om vaim vairagyaya
    namah | 18| aishanye om aim aishvaryaya namah | 19| purve om a~ adharmaya namah | 20| dakshine om
    a~ ajnanaya namah | 21| pashcime om a~ avairagyaya namah | 22| uttare om a~ anaishvaryaya namah |
    23| iti pujayet || tatah punah pithamadhye || om a~ anandakandaya namah | 24| om sa~ samvinnalaya
    namah | 25| om sa~ sarvatattvakamalasanaya namah | 26| om pra~ prakritimayapatrebhyo namah | 27| om
    vim vikaramayakesarebhyo namah | 28| om pa~ pancashadvarnadhyakarnikabhyo namah | 29| om a~ arkamandalaya
    dvadashakalatmane namah | 30| om so~ somamandalaya shodashakalatmane namah | 31| om va~ vahnimandalaya
    dashakalatmane namah | 32| om sa~ sattvaya namah | 33| om ra~ rajase namah | 34| om ta~ tamase namah
    | 35| om a~ atmane namah | 36| om pa~ paramatmane namah | 37| om a~ antaratmane namah | 38| om hrim
    jnanatmane namah | 39| om ma~ mayatattvaya namah | 40| om ka~ kalatattvaya namah | 41| om vim vidyatattvaya
    namah | 42| om pa~ paratattvaya namah | 43| evam pithadevatah sampujya navapithashaktih pujayet ||
    tadyatha | purve om tivrayai namah | 1| agneyyam om calinyai namah | 2| dakshine om nandayai namah
    | 3| nairritye om bhogadayai namah | 4| pashcime om kamarupinyai namah | 5| vayavye om ugrayai namah
    | 6| uttare om tejovatyai namah | 7| aishanye om satyayai namah | 8| pithamadhye om vighnanashinyai
    namah | 9| iti pithashaktih sampujya patrasadanam kuryat || atha patrasadanaprayogah || tatra patrasadanam
    sarvadevopayogipaddhatimargena savistaram kritva ashaktashcetsadharanam kuryat || tatra kramah ||
    tatradau gandhakshatadipujopakarananisvadakshinaparshve samsthapya jalartham brihatpatram vyajanam
    chatradarshacamarani vamaparshve sthapayitva kalashasthapanam kuryat || atha kalashasthapanaprayogah
    || svavamabhage trikonamandalam kritva jalena prokshya trikonantarmayam vilikhya || om hrim adharashaktayai
    namah | iti sampujya tato mulena namah | iti tripadadharam prakshalya trikonamadhye samsthapya tatra
  devanagari: एवं ध्यात्वा न्यासं कुर्य्यात् ॥ तथा च तत्र क्रमः ॥ ॐ अँ विघ्नेशह्रीभ्यां नमः ललाटे । १।
    ॐ आँ विघ्नराजश्रीभ्यां नमः मुखवृत्ते । २। ॐ इँ विनायकपुष्टिभ्यां नमः दक्षिणनेत्रे । ३। ॐ ईँ शिवोत्तमशान्तिभ्यां
    नमः वामनेत्रे । ४। ॐ उँ विघ्नकृत्स्वस्तिभ्यां नमः दक्षिणकर्णे । ५। ॐ ऊँ विघ्नहर्तृसरस्वतीभ्यां नमः
    वामकर्णे । ६। ॐ ऋँ गणस्वाहाभ्यां नमः दक्षिणनासापुटे । ७। ॐ ॠँ एकदन्तसुमेधाभ्यां नमः वामनासापुटे ।
    ८। ॐ ऌँ द्विदन्तकान्तिभ्यां नमः दक्षिणगण्डे । ९। ॐ ॡँ गजवक्त्रकामिनीभ्यां नमः वामगण्डे । १०। ॐ एँ
    निरञ्जनमोहिनीभ्यां नमः ऊर्ध्वोष्ठे । ११। ॐ ऐं कपर्दिनटीभ्यां नमः अधरोष्ठे । १२। ॐ ओं दीर्घजिह्वपार्वतीभ्यां
    नमः ऊर्ध्वदन्तपङ्क्तौ । १३। ॐ औं शङ्कुकर्णज्वालिनीभ्यां नमः अधोदन्तपङ्क्तौ । १४। ॐ अँ वृषभध्वजनन्दाभ्यां
    नमः शिरसि । १५। ॐ अः गणेशसुरेशीभ्यां नमः मुखे । १६। ॐ कँ गजेन्द्रकामरूपिणीभ्यां नमः दक्षिणबाहुमूले
    । १७। ॐ खँ शूर्पकर्णोमाभ्यां नमः दक्षिणकूर्परे । १८। ॐ गँ त्रिलोचनतेजोवतीभ्यां नमः दक्षिणमणिबन्धे
    । १९। ॐ घँ लम्बोदरसत्याभ्यां नमः दक्षाङ्गुलिमूले । २०। ॐ ङँ महानन्दविघ्नेशीभ्यां नमः दक्षाङ्गुल्यग्रे
    । २१। ॐ चँ चतुर्मूर्तिस्वरूपिणीभ्यां नमः वामबाहुमूले । २२। ॐ छँ सदाशिवकामदाभ्यां नमः वामकूर्परे ।
    २३। ॐ जँ आमोदमदजिह्वाभ्यां नमः वाममणिबन्धे । २४। ॐ झँ दुर्मुखभूतिभ्यां नमः वामाङ्गुलिमूले । २५। ॐ
    ञँ सुमुखभौतिकाभ्या नमः वामाङ्गुल्यग्रे । २६। ॐ टँ प्रमोदसिताभ्यां नमः दक्षपादमूले । २७। ॐ ठँ एकपादरमाभ्यां
    नमः दक्षिणजानुनि । २८। ॐ डँ द्विजिह्वमहिषीभ्यां नमः दक्षिणगुल्फे । २९। ॐ ढँ शूरभञ्जनीभ्यां नमः दक्षिणपादाङ्गुलिमूले
    । ३०। ॐ णँ वीरविकरणाभ्यां नमः दक्षिणपादाङ्गुल्यग्रे । ३१। ॐ तँ षण्मुखभृकुटीभ्यां नमः वामपादमूले ।
    ३२। ॐ थँ वरदलज्जाभ्यां नमः वामजानुनि । ३३। ॐ दँ वामदेवदीर्घ घोणाभ्यां नमः वामगुल्फे । ३४। ॐ धँ वक्रतुण्डधनुर्धराभ्यां
    नमः वामपादाङ्गुलिमूले । ३५। ॐ नँ द्विरदयामिनीभ्यां नमः वामपादाङ्गुल्यग्रे । ३६। ॐ पँ सेनानीरात्रिभ्यां
    नमः दक्षिणपार्श्वे । ३७। ॐ फँ कामान्धग्रामणीभ्यां नमः वामपार्श्वे । ३८। ॐ बँ मत्तशशिप्रभाभ्यां नमः
    पृष्ठे । ३९। ॐ भँ विमत्तलोललोचनाभ्यां नमः नाभौ । ४०। ॐ मँ मत्तवाहनचञ्चलाभ्यां नमः जठरे । ४१। ॐ यँ
    त्वगात्मभ्यां जटिदीप्तिभ्यां हृदि । ४२। ॐ रँ असृगात्मभ्यां मुण्डिसुभगाभ्यां नमः दक्षांसे । ४३। ॐ लँ
    मांसात्मभ्यां खडिदुर्भगाभ्यां नमः ककुदि । ४४। ॐ वँ मेदात्मभ्यां नमः वरेण्यशिवाभ्यां नमः वामासे । ४५।
    ॐ शँ अस्थ्यात्मभ्यां वृषकेतनभगाभ्यां नमः हृदयादिदक्षहस्तान्तम् । ४६। ॐ षँ मज्जात्मभ्यां भक्तिप्रियभगिनीभ्यां
    नमः हृदयादिवामहस्तान्तम् । ४७। ॐ सँ शुक्रात्मभ्यां गणेशभोगिनीभ्यां नमः हृदयादिदक्षपादान्तम् । ४८।
    ॐ हँ प्राणात्मभ्यां मेघनादसुभगाभ्यां नमः हृदयादिवामपादान्तम् । ४९। ॐ ळँ शक्त्यात्मभ्यां व्याप्तिकालरात्रिभ्यां
    नमः जठरे । ५०। ॐ क्षँ परमात्मभ्यां गणेश्वरकालिकाभ्यां नमः मुखे । ५१॥ इति सर्वगणेशमन्त्राङ्गभूतविघ्नेशादिकलामातृकान्यासः
    ॥ एवं कलान्यासं कृत्वा प्रयोगोक्तन्यासादिकं कुर्य्यात् ॥ ततः पीठादौ रचिते सर्वतोभद्रमण्डले गणेशमण्डले
    वा मण्डूकादिपरतत्त्वान्तपीठदेवताः स्थापयेत् ॥ तथा च ॥ पुष्पाक्षतानादाय स्ववामभागे श्रीगुरुभ्यो नमः
    । १। दक्षिणे गणपतये नमः । २। मध्ये स्वेष्टदेवतायै नमः । ३। इति नत्वा पीठमध्ये ॐ मँ मण्डूकाय नमः ।
    ४। ॐ कँ कालाग्निरुद्राय नमः । ५। ॐ आँ आधारशक्तये नमः । ६। ॐ कूँ कूर्माय नमः । ७। ॐ अँ अनन्ताय नमः
    । ८। ॐ पृँ पृथिव्यै नमः । ९। ॐ क्षीं क्षीरसागराय नमः । १०। ॐ रँ रत्नद्वीपाय नमः । ११। ॐ रँ रत्नमण्डपाय
    नमः । १२। ॐ कँ कल्पवृक्षायै नमः । १३। ॐ रँ रत्नवेदिकायै नमः । १४। ॐ रँ रत्नसिंहासनाय नमः । १५। इत्युपर्युपरि
    सम्पूज्य ॥ आग्नेय्यां ॐ धँ धर्म्माय नमः । १६। नैरृत्यां ॐ ज्ञाँ ज्ञानाय नमः । १७। वायव्ये ॐ वैं वैराग्याय
    नमः । १८। ऐशान्ये ॐ ऐं ऐश्वर्याय नमः । १९। पूर्वे ॐ अँ अधर्माय नमः । २०। दक्षिणे ॐ अँ अज्ञानाय नमः
    । २१। पश्चिमे ॐ अँ अवैराग्याय नमः । २२। उत्तरे ॐ अँ अनैश्वर्याय नमः । २३। इति पूजयेत् ॥ ततः पुनः पीठमध्ये
    ॥ ॐ आँ आनन्दकन्दाय नमः । २४। ॐ सँ संविन्नालाय नमः । २५। ॐ सँ सर्वतत्त्वकमलासनाय नमः । २६। ॐ प्रँ प्रकृतिमयपत्रेभ्यो
    नमः । २७। ॐ विं विकारमयकेसरेभ्यो नमः । २८। ॐ पँ पञ्चाशद्वर्णाढ्यकर्णिकाभ्यो नमः । २९। ॐ अँ अर्कमण्डलाय
    द्वादशकलात्मने नमः । ३०। ॐ सोँ सोममण्डलाय षोडशकलात्मने नमः । ३१। ॐ वँ वह्निमण्डलाय दशकलात्मने नमः
    । ३२। ॐ सँ सत्त्वाय नमः । ३३। ॐ रँ रजसे नमः । ३४। ॐ तँ तमसे नमः । ३५। ॐ आँ आत्मने नमः । ३६। ॐ पँ परमात्मने
    नमः । ३७। ॐ अँ अन्तरात्मने नमः । ३८। ॐ ह्रीं ज्ञानात्मने नमः । ३९। ॐ मँ मायातत्त्वाय नमः । ४०। ॐ कँ
    कलातत्त्वाय नमः । ४१। ॐ विं विद्यातत्त्वाय नमः । ४२। ॐ पँ परतत्त्वाय नमः । ४३। एवं पीठदेवताः सम्पूज्य
    नवपीठशक्तीः पूजयेत् ॥ तद्यथा । पूर्वे ॐ तीव्रायै नमः । १। आग्नेय्यां ॐ चालिन्यै नमः । २। दक्षिणे ॐ
    नन्दायै नमः । ३। नैरृत्ये ॐ भोगदायै नमः । ४। पश्चिमे ॐ कामरूपिण्यै नमः । ५। वायव्ये ॐ उग्रायै नमः
    । ६। उत्तरे ॐ तेजोवत्यै नमः । ७। ऐशान्ये ॐ सत्यायै नमः । ८। पीठमध्ये ॐ विघ्ननाशिन्यै नमः । ९। इति
    पीठशक्तीः सम्पूज्य पात्रासादनं कुर्यात् ॥ अथ पात्रासादनप्रयोगः ॥ तत्र पात्रासादनं सर्वदेवोपयोगिपद्धतिमार्गेण
    सविस्तरं कृत्वा अशक्तश्चेत्साधारणं कुर्यात् ॥ तत्र क्रमः ॥ तत्रादौ गन्धाक्षतादिपूजोपकरणानिस्वदक्षिणपार्श्वे
    संस्थाप्य जलार्थं बृहत्पात्रं व्यजनं छत्रादर्शचामराणि वामपार्श्वे स्थापयित्वा कलशस्थापनं कुर्यात्
    ॥ अथ कलशस्थापनप्रयोगः ॥ स्ववामभागे त्रिकोणमण्डलं कृत्वा जलेन प्रोक्ष्य त्रिकोणान्तर्मायां विलिख्य
    ॥ ॐ ह्रीं आधारशक्तयै नमः । इति सम्पूज्य ततो मूलेन नमः । इति त्रिपदाधारं प्रक्षाल्य त्रिकोणमध्ये संस्थाप्य
    तत्र
