id: dashavataraharigatha
category: stotram
name:
  english: dashavataraharigatha
  devanagari: दशावतारहरिगाथा
content:
  english: vibhavabdhim harimide || 10|| akritemam vijayadhvajavaratirtho harigatham | ayate pritimalam
    sapadi yaya shriramanoyam || 11|| || iti shri vijayadhvajatirthakrita dashavataraharigatha samapta||
  devanagari: विभवाब्धिं हरिमीडे ॥ १०॥ अकृतेमां विजयध्वजवरतीर्थो हरिगाथाम् । अयते प्रीतिमलं सपदि यया श्रीरमणोयम्
    ॥ ११॥ ॥ इति श्री विजयध्वजतीर्थकृता दशावतारहरिगाथा समाप्ता॥
meaning: {}
