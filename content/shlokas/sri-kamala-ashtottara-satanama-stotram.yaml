id: sri-kamala-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Kamala Ashtottara Satanama Stotram
content:
  english: shri shiva uvaca shatamashtottaram namnam kamalaya varanane | pravakshyamyatiguhyam hi na kadapi
    prakashayet || || om mahamaya mahalakshmirmahavani maheshvari | mahadevi maharatrirmahishasuramardini
    || || kalaratrih kuhuh purnanandadya bhadrika nisha | jaya rikta mahashaktirdevamata krishodari ||
    || shacindrani shakranuta shankarapriyavallabha | mahavarahajanani madanonmathini mahi || || vaikunthanatharamani
    vishnuvakshahsthalasthita | vishveshvari vishvamata varada'bhayada shiva || || shulini cakrini ma
    ca pashini shankhadharini | gadini mundamala ca kamala karunalaya || || padmakshadharini hyamba mahavishnupriyankari
    | golokanatharamani golokeshvarapujita || || gaya ganga ca yamuna gomati garudasana | gandaki sarayustapi
    reva caiva payasvini || || narmada caiva kaveri kedarasthalavasini | kishori keshavanuta mahendraparivandita
    || || brahmadidevanirmanakarini vedapujita | kotibrahmandamadhyastha kotibrahmandakarini || || shrutirupa
    shrutikari shrutismritiparayana | indira sindhutanaya matangi lokamatrika || || trilokajanani tantra
    tantramantrasvarupini | taruni ca tamohantri mangala mangalayana || || madhukaitabhamathani shumbhasuravinashini
    | nishumbhadihara mata harishankarapujita || || sarvadevamayi sarva sharanagatapalini | sharanya shambhuvanita
    sindhutiranivasini || || gandharvaganarasika gita govindavallabha | trailokyapalini tattvarupa tarunyapurita
    || || candravali candramukhi candrika candrapujita | candra shashankabhagini gitavadyaparayana ||
    || srishtirupa srishtikari srishtisamharakarini | iti te kathitam devi ramanamashatashtakam || ||
    trisandhyam prayato bhutva pathedetatsamahitah | yam yam kamayate kamam tam tam prapnotyasamshayam
    || || imam stavam yah pathatiha martyo vaikunthapatnyah paramadarena | dhanadhipadyaih parivanditah
    syat prayasyati shripadamantakale || || iti shri kamalashtottarashatanamastotram |
  devanagari: श्री शिव उवाच शतमष्टोत्तरं नाम्नां कमलाया वरानने । प्रवक्ष्याम्यतिगुह्यं हि न कदापि प्रकाशयेत्
    ॥ ॥ ॐ महामाया महालक्ष्मीर्महावाणी महेश्वरी । महादेवी महारात्रिर्महिषासुरमर्दिनी ॥ ॥ कालरात्रिः कुहूः
    पूर्णानन्दाद्या भद्रिका निशा । जया रिक्ता महाशक्तिर्देवमाता कृशोदरी ॥ ॥ शचीन्द्राणी शक्रनुता शङ्करप्रियवल्लभा
    । महावराहजननी मदनोन्मथिनी मही ॥ ॥ वैकुण्ठनाथरमणी विष्णुवक्षःस्थलस्थिता । विश्वेश्वरी विश्वमाता वरदाऽभयदा
    शिवा ॥ ॥ शूलिनी चक्रिणी मा च पाशिनी शङ्खधारिणी । गदिनी मुण्डमाला च कमला करुणालया ॥ ॥ पद्माक्षधारिणी
    ह्यम्बा महाविष्णुप्रियङ्करी । गोलोकनाथरमणी गोलोकेश्वरपूजिता ॥ ॥ गया गङ्गा च यमुना गोमती गरुडासना ।
    गण्डकी सरयूस्तापी रेवा चैव पयस्विनी ॥ ॥ नर्मदा चैव कावेरी केदारस्थलवासिनी । किशोरी केशवनुता महेन्द्रपरिवन्दिता
    ॥ ॥ ब्रह्मादिदेवनिर्माणकारिणी वेदपूजिता । कोटिब्रह्माण्डमध्यस्था कोटिब्रह्माण्डकारिणी ॥ ॥ श्रुतिरूपा
    श्रुतिकरी श्रुतिस्मृतिपरायणा । इन्दिरा सिन्धुतनया मातङ्गी लोकमातृका ॥ ॥ त्रिलोकजननी तन्त्रा तन्त्रमन्त्रस्वरूपिणी
    । तरुणी च तमोहन्त्री मङ्गला मङ्गलायना ॥ ॥ मधुकैटभमथनी शुम्भासुरविनाशिनी । निशुम्भादिहरा माता हरिशङ्करपूजिता
    ॥ ॥ सर्वदेवमयी सर्वा शरणागतपालिनी । शरण्या शम्भुवनिता सिन्धुतीरनिवासिनी ॥ ॥ गन्धर्वगानरसिका गीता गोविन्दवल्लभा
    । त्रैलोक्यपालिनी तत्त्वरूपा तारुण्यपूरिता ॥ ॥ चन्द्रावली चन्द्रमुखी चन्द्रिका चन्द्रपूजिता । चन्द्रा
    शशाङ्कभगिनी गीतवाद्यपरायणा ॥ ॥ सृष्टिरूपा सृष्टिकरी सृष्टिसंहारकारिणी । इति ते कथितं देवि रमानामशताष्टकम्
    ॥ ॥ त्रिसन्ध्यं प्रयतो भूत्वा पठेदेतत्समाहितः । यं यं कामयते कामं तं तं प्राप्नोत्यसंशयम् ॥ ॥ इमं
    स्तवं यः पठतीह मर्त्यो वैकुण्ठपत्न्याः परमादरेण । धनाधिपाद्यैः परिवन्दितः स्यात् प्रयास्यति श्रीपदमन्तकाले
    ॥ ॥ इति श्री कमलाष्टोत्तरशतनामस्तोत्रम् ।
