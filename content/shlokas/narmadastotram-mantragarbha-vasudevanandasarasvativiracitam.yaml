id: narmadastotram-mantragarbha-vasudevanandasarasvativiracitam
category: mantra
name:
  english: narmadastotram mantragarbha (vasudevanandasarasvativiracitam)
  devanagari: नर्मदास्तोत्रं मन्त्रगर्भ (वासुदेवानन्दसरस्वतीविरचितम्)
content:
  english: narmadayai namah pratarnarmadayai namo nishi | namo'stu narmade tubhyam trahi mam vishasarpatah
    || va rita' na rthasangha ya a nanya na tamuktaye | su shtusha rma nidanayai na dyai pum mo hasamhrite
    || 1|| de varshi da navedyayai su kshmava stu drishe namah | va kyartha yai somaputryai ya tana' na
    lashantaye || 2|| nam dayai na rmadayai te tri dhaka rma vishuddhaye | da ya da mah sthairyakartryai
    sam siddhyai de vatatmane || 3|| sa tya sam pra ptikarinyai bhu tyai sam tu shtihetave || ra myayai
    ta ttvarupinyai ta pasvya bhyam taratmane || 4|| sva ccha svarna dyadhisvambu da mita tra sibhitaye
    | ti vrasha rma hrite pumhri tta paghnye hi takirtaye || 5|| kri tapa da vimokshayai tre dhadhar mam
    gamurtaye | ta poda yai tapahsiddhyai ya jnangyai vi shabhihrite || 6|| re vayai na ratapaghnyai di
    vyayai sha ddvishaddhrite | va sana mo kshadakshayai gam gayai sa tyakirtaye || 7|| stu tayai ni tyadiptayai
    ba lisa rpa daduddhrite | ti tikshu shi vasandhatryai ra tyai ce tah samadhaye || 8|| jaya jaya shivakanye
    narmade sharmade tvam jaya jaya janamanye dharmade'dharmade tvam | jaya jaya suvadanye dharmade karmade
    tvam jaya jaya bhuvi dhanye bharmade varmade tvam || 9|| iti shrivasudevanandasarasvativiracitam shrinarmadastotram
    sampurnam |
  devanagari: नर्मदायै नमः प्रातर्नर्मदायै नमो निशि । नमोऽस्तु नर्मदे तुभ्यं त्राहि मां विषसर्पतः ॥ वा
    रिताऽ न र्थसङ्घा या अ नन्य न तमुक्तये । सु ष्टुश र्म निदानायै न द्यै पुं मो हसंहृते ॥ १॥ दे वर्षि
    दा नवेड्यायै सू क्ष्मव स्तु दृशे नमः । वा क्यार्था यै सोमपुत्र्यै या तनाऽ न लशान्तये ॥ २॥ नं दायै
    न र्मदायै ते त्रि धाक र्म विशुद्धये । द या द मः स्थैर्यकर्त्र्यै सं सिद्ध्यै दे वतात्मने ॥ ३॥ स त्य
    सं प्रा प्तिकारिण्यै भू त्यै सं तु ष्टिहेतवे ॥ र म्यायै त त्त्वरूपिण्यै त पस्व्य भ्यं तरात्मने ॥ ४॥
    स्व च्छ स्वर्न द्यधिस्वाम्बु द मित त्रा सिभीतये । ती व्रश र्म हृते पुंहृ त्ता पघ्न्ये हि तकीर्तये
    ॥ ५॥ कृ ताप दा विमोक्षायै त्रे धाधर् मां गमूर्तये । त पोदा यै तपःसिद्ध्यै य ज्ञाङ्ग्यै वि षभीहृते
    ॥ ६॥ रे वायै न रतापघ्न्यै दि व्यायै ष ड्द्विषद्धृते । वा सना मो क्षदक्षायै गं गायै स त्यकीर्तये ॥
    ७॥ स्तु तायै नि त्यदीप्तायै ब लिस र्प ददुद्धृते । ति तिक्षु शि वसन्धात्र्यै र त्यै चे तः समाधये ॥
    ८॥ जय जय शिवकन्ये नर्मदे शर्मदे त्वं जय जय जनमान्ये धर्मदेऽधर्मदे त्वम् । जय जय सुवदान्ये धर्मदे कर्मदे
    त्वं जय जय भुवि धन्ये भर्मदे वर्मदे त्वम् ॥ ९॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं श्रीनर्मदास्तोत्रं
    सम्पूर्णम् ।
