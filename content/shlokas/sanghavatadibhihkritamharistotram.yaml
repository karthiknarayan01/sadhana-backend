id: sanghavatadibhihkritamharistotram
category: stotram
name:
  english: sanghavatadibhihkritamharistotram
  devanagari: सन्घवाटादिभिःकृतंहरिस्तोत्रम्
content:
  english: namo mokshapradanam tu satam lakshyaikabindave || 82|| muktanam dhyanalakshyaya sarvavatarine
    namah | namah krishnaya krishnadisvamine paramatmane || 83|| balakrishnaya kantaya sarvakantaya rakshine
    | shrishaya kamaleshaya radheshaya viharine || 84|| namo devadhivasaya sarvantaryamine namah | namo'nadinidhanaya
    mokshadatre kripalave || 841|| namah shrilomashaya'pi sadbhyashcapi namo namah | namo vyasaya divyaya
    svayamprakashine namah || 86|| namah padmavatilakshmiprajnabhupataye namah | namastasmai hridisthaya
    dhamasthaya ca te namah || 87|| prasadaya namashcapi mandapaya ca vai namah | namo mandapadevebhyo
    namah shravanibhyastatha || 88|| tarakebhyah pavakebhyah sadbhyah sada namo namah | sadhvibhyashca
    satibhyashca vaishnavebhyo namo namah
  devanagari: नमो मोक्षप्रदानां तु सतां लक्ष्यैकबिन्दवे ॥ ८२॥ मुक्तानां ध्यानलक्ष्याय सर्वावतारिणे नमः
    । नमः कृष्णाय कृष्णादिस्वामिने परमात्मने ॥ ८३॥ बालकृष्णाय कान्ताय सर्वकान्ताय रक्षिणे । श्रीशाय कमलेशाय
    राधेशाय विहारिणे ॥ ८४॥ नमो देवाधिवासाय सर्वान्तर्यामिणे नमः । नमोऽनादिनिधनाय मोक्षदात्रे कृपालवे ॥
    ८४१॥ नमः श्रीलोमशायाऽपि सद्भ्यश्चापि नमो नमः । नमो व्यासाय दिव्याय स्वयम्प्रकाशिने नमः ॥ ८६॥ नमः पद्मावतीलक्ष्मीप्रज्ञाभूपतये
    नमः । नमस्तस्मै हृदिस्थाय धामस्थाय च ते नमः ॥ ८७॥ प्रसादाय नमश्चापि मण्डपाय च वै नमः । नमो मण्डपदेवेभ्यो
    नमः श्रवणिभ्यस्तथा ॥ ८८॥ तारकेभ्यः पावकेभ्यः सद्भ्यः सदा नमो नमः । साध्वीभ्यश्च सतीभ्यश्च वैष्णवेभ्यो
    नमो नमः
