    sukhare || ge jani angada hanumana| phire bhalu markata bhata nana || jatudhana pradosha bala pai|
    dhae kari dasasisa dohai || nisicara ani dekhi kapi phire| jaha~ taha~ katakatai bhata bhire || dvau
