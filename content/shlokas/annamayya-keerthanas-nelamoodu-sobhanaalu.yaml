id: annamayya-keerthanas-nelamoodu-sobhanaalu
category: stotram
name:
  english: Annamayya Keerthanas Nelamoodu Sobhanaalu
content:
  english: adi pallavi nèlamudu shobhanalu niku natanikidagu | kalakalamunu niccakalyanamamma || caranam
    ramanamamatanidi ramavu nivaitenu | camana varnamatadu camavu nivu | vamanudanduratani vamanayanavu
    nivu | premapumi yiddariki perubalamòkate || nèlamudu shobhanalu niku natanikidagu hari perataniki
    harinekshanavu nivu | karigacèdanu nivu kariyanavu | sari jaladhishayi jaladhikanyavu nivu | bèrasi
    miyiddariki berubalamòkate || nèlamudu shobhanalu niku natanikidagu jalaja nabhudatadu jalajamukhivi
    nivu | alamelumangavu ninnèlamèdanu | ilalo shrivenkateshuditu ninnuranamocè | pilici perucèppèberubalamòkate
    || nèlamudu shobhanalu niku natanikidagu | kalakalamunu niccakalyanamamma ||
  devanagari: आदि पल्लवि नॆलमूडु शोभनालु नीकु नतनिकिदगु । कलकालमुनु निच्चकल्याणमम्मा ॥ चरणं रामनाममतनिदि
    रामवु नीवैतेनु । चामन वर्णमतडु चामवु नीवु । वामनुडन्दुरतनि वामनयनवु नीवु । प्रेमपुमी यिद्दरिकि पेरुबलमॊकटे
    ॥ नॆलमूडु शोभनालु नीकु नतनिकिदगु हरि पेरातनिकि हरिणेक्षणवु नीवु । करिगाचॆदानु नीवु करियानवु । सरि
    जलधिशायि जलधिकन्यवु नीवु । बॆरसि मीयिद्दरिकि बेरुबलमॊकटे ॥ नॆलमूडु शोभनालु नीकु नतनिकिदगु जलज नाभुडतडु
    जलजमुखिवि नीवु । अलमेलुमङ्गवु निन्नॆलमॆदानु । इललो श्रीवेङ्कटेशुडिटु निन्नुरानमोचॆ । पिलिचि पेरुचॆप्पॆबेरुबलमॊकटे
    ॥ नॆलमूडु शोभनालु नीकु नतनिकिदगु । कलकालमुनु निच्चकल्याणमम्मा ॥
