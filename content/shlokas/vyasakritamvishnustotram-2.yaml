id: vyasakritamvishnustotram-2
category: stotram
name:
  english: vyasakritamvishnustotram
  devanagari: व्यासकृतंविष्णुस्तोत्रम्
content:
  english: 30|| acyutananta vaikuntha madhavopendra keshava | trivikrama gadapane sharngapane janardana
    || 31|| shrivatsavakshah shrikanta pitambara murantaka | kaitabhare balidhvamsinkamsare keshisudana
    || 32|| narayanasuraripo krishna shaure caturbhuja | devakihridayananda yashodanandavardhana || 33||
    pundarikaksha daityare damodara balapriya | balaratistuta hare vasudeva vasuprada || 34|| vishvakcamustarkshyaratha
    vanamalinnarottama | adhokshaja kshamadhara padmanabha jaleshaya || 35|| nrisimha yajnavaraha gopagopalavallabha
    | gopipate gunatita garudadhvaja gotrabhrit || 36|| jaya canuramathana jaya trailokyarakshana | jayanadya
    jayananda jaya nilotpaladyute || 37|| kaustubhodbhushitoraska putanadhatushoshana | raksha raksha
    jagadrakshamane narakaharaka || 38|| sahasrashirshapurusha puruhuta sukhaprada | yadbhutam yacca bhavyam
    vai tatraikah purusho bhavan || 39|| iti shriskadapurane kashikhande purvarddhe pancanavatitama
  devanagari: ३०॥ अच्युतानन्त वैकुण्ठ माधवोपेन्द्र केशव । त्रिविक्रम गदापाणे शार्ङ्गपाणे जनार्दन ॥ ३१॥
    श्रीवत्सवक्षः श्रीकान्त पीताम्बर मुरान्तक । कैटभारे बलिध्वंसिन्कंसारे केशिसूदन ॥ ३२॥ नारायणासुररिपो
    कृष्ण शौरे चतुर्भुज । देवकीहृदयानन्द यशोदानन्दवर्धन ॥ ३३॥ पुण्डरीकाक्ष दैत्यारे दामोदर बलप्रिय । बलारातिस्तुत
    हरे वासुदेव वसुप्रद ॥ ३४॥ विष्वक्चमूस्तार्क्ष्यरथ वनमालिन्नरोत्तम । अधोक्षज क्षमाधार पद्मनाभ जलेशय
    ॥ ३५॥ नृसिंह यज्ञवाराह गोपगोपालवल्लभ । गोपीपते गुणातीत गरुडध्वज गोत्रभृत् ॥ ३६॥ जय चाणूरमथन जय त्रैलोक्यरक्षण
    । जयानाद्य जयानन्द जय नीलोत्पलद्युते ॥ ३७॥ कौस्तुभोद्भूषितोरस्क पूतनाधातुशोषण । रक्ष रक्ष जगद्रक्षामणे
    नरकहारक ॥ ३८॥ सहस्रशीर्षपुरुष पुरुहूत सुखप्रद । यद्भूतं यच्च भव्यं वै तत्रैकः पुरुषो भवान् ॥ ३९॥ इति
    श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे पञ्चनवतितमा
meaning: {}
