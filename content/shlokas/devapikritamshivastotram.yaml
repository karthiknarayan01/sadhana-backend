id: devapikritamshivastotram
category: stotram
name:
  english: devapikritamshivastotram
  devanagari: देवापिकृतंशिवस्तोत्रम्
content:
  english: devapikritam shivastotram devapiruvaca | balo'ham devadevesha gurunam tvam gururmama | na me
    shaktistvatstavane tubhyam shambho namo'stu te || 48|| na tvam jananti nigama na deva munayo na ca
    | na brahma napi vaikuntho yo'si so'si namo'stu te || 49|| ye'natha ye ca kripana ye daridrashca roginah
    | papatmano ye ca loke tamstvam pasi maheshvara || 50|| tapasa niyamairmantraih pujitastridivaukasah
    | tvaya dattam phalam tebhyo dasyanti jagatam pate || 51|| yacitarashca datarastebhyo yadyanmanishatim
    | bhavatiti na citram syattvam viparyayakarakah || 52|| ye'jnanino ye ca papa ye magna narakarnave
    | shiveti vacanannatha tanpasi tvam jagadguro || 53|| iti brahmapurane saptavimshadhikashatatamadhyayantargatam
    devapikritam shivastotram samaptam | brahmapurana | adhyaya 127
  devanagari: देवापिकृतं शिवस्तोत्रम् देवापिरुवाच । बालोऽहं देवदेवेश गुरूणां त्वं गुरुर्मम । न मे शक्तिस्त्वत्स्तवने
    तुभ्यं शम्भो नमोऽस्तु ते ॥ ४८॥ न त्वां जानन्ति निगमा न देवा मुनयो न च । न ब्रह्मा नापि वैकुण्ठो योऽसि
    सोऽसि नमोऽस्तु ते ॥ ४९॥ येऽनाथा ये च कृपणा ये दरिद्राश्च रोगिणः । पापात्मानो ये च लोके तांस्त्वं पासि
    महेश्वर ॥ ५०॥ तपसा नियमैर्मन्त्रैः पूजितास्त्रिदिवौकसः । त्वया दत्तं फलं तेभ्यो दास्यन्ति जगतां पते
    ॥ ५१॥ याचितारश्च दातारस्तेभ्यो यद्यन्मनीषतिम् । भवतीति न चित्रं स्यात्त्वं विपर्ययकारकः ॥ ५२॥ येऽज्ञानिनो
    ये च पापा ये मग्ना नरकार्णवे । शिवेति वचनान्नाथ तान्पासि त्वं जगद्गुरो ॥ ५३॥ इति ब्रह्मपुराणे सप्तविंशाधिकशततमाध्यायान्तर्गतं
    देवापिकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १२७
