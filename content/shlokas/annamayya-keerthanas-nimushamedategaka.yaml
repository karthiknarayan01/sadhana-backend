id: annamayya-keerthanas-nimushamedategaka
category: stotram
name:
  english: Annamayya Keerthanas Nimushamedategaka
content:
  english: adi pallavi nimushamèdatègaka hari ninnu talaci | mamata ni midane marapi bratukutagaka ||
    caranam nidurace kònnallu neramula kònnallu mimice kònnallu mosapoyi | kadisi korinanu gatakalambu
    vaccune madi madinè yundi emaraka batukuta gaka || nimushamèdatègaka hari ninnu talaci kadu tanayulaku
    kònta kantalaku nòka kònta vèdayasalaku kònta vèttisesi | adari kavalènanina andu sukhamunnada cèdaka
    ni sevale sesi batukutagaka || nimushamèdatègaka hari ninnu talaci dhanamu vènta tagili dhanyambunaku
    tagili tanavari tagili katarudainanu | kanu kaligi shri venkatanatha katuve kònasagi ninnune kòlici
    batukutagaka || nimushamèdatègaka hari ninnu talaci | mamata ni midane marapi bratukutagaka ||
  devanagari: आदि पल्लवि निमुषमॆडतॆगक हरि निन्नु तलचि । ममत नी मीदने मरपि ब्रतुकुटगाक ॥ चरणं निदुरचे कॊन्नाल्लु
    नेरमुल कॊन्नाल्लु मिमिचे कॊन्नाल्लु मोसपोयि । कदिसि कोरिननु गतकालम्बु वच्चुने मदि मदिनॆ युण्डि एमरक
    बतुकुट गाक ॥ निमुषमॆडतॆगक हरि निन्नु तलचि कडु तनयुलकु कॊन्त कान्तलकु नॊक कॊन्त वॆडयासलकु कॊन्त वॆट्टिसेसि
    । अडरि कावलॆननिन अन्दु सुखमुन्नदा चॆडक नी सेवले सेसि बतुकुटगाक ॥ निमुषमॆडतॆगक हरि निन्नु तलचि धनमु
    वॆण्ट तगिलि धान्यम्बुनकु तगिलि तनवारि तगिलि कातरुडैननु । कनु कलिगि श्री वेङ्कटनाथ कातुवे कॊनसागि निन्नुने
    कॊलिचि बतुकुटगाक ॥ निमुषमॆडतॆगक हरि निन्नु तलचि । ममत नी मीदने मरपि ब्रतुकुटगाक ॥
