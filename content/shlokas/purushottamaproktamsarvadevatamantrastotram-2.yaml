id: purushottamaproktamsarvadevatamantrastotram-2
category: mantra
name:
  english: purushottamaproktamsarvadevatamantrastotram
  devanagari: पुरुषोत्तमप्रोक्तंसर्वदेवतामन्त्रस्तोत्रम्
content:
  english: omanadiparabrahmeshvaryai shirasi me namah | omanadikrishnanarayanyai bhale ca me namah ||
    76|| omanadivasudevilakshmyai me netrayornamah | omanadibrahmalakshmyai mukhe me te namo namah ||
    77|| omanadikambharalakshmyai ca kanthe'stu me namah | omanadimahalakshmyai hridaye me ca te namah
    || 78|| omanadishrinarayanyai namaste mamodare | omanadivaishnavyai te nabhau mama namo namah || 79||
    omanadilalitayai jaghane te ca me namah | omanadishriyai ca'stu namah sakthnoshca me sada || 80||
    omanadikamalayai namo janvoshca me'stu te | omanadiramayai te namo'stu padayormama || 81|| omanadiharinyai
    te karayorme namo'stu te | omanadimahamatre sarvataste namo namah || 82|| omanadipadmayai dvihastatalayoste
    namah | omanadirakshitryai te prishthadeshe namo namah || 83|| omanadihiranyayai ramyangeshu ca te
    namah | omanadisuvarnayai bhagyarekhasu te namah || 84|| omanadikumaryai te shiladharme namo namah
    | omanadijananyai te sarvangeshu namo namah || 85|| evam nyasan vinirvartya dhyayasva shripuradhipam
    | dhyayasva shripuram capi shripureshishvaram ca mam || 86|| suvarnanirmitam murtimavahaya tatah param
    | asanam sampradehi tvam padyamarghyam tatah param || 87|| acamanam jalam pancamritasnanam prakaraya
    | sugandhitailasaradyaih pramardaya pareshvarim || 88|| abhishekam karayitva vastrabhusharpanam kuru
    | sarvam sha
  devanagari: ओमनादिपरब्रह्मेश्वर्यै शिरसि मे नमः । ओमनादिकृष्णनारायण्यै भाले च मे नमः ॥ ७६॥ ओमनादिवासुदेवीलक्ष्म्यै
    मे नेत्रयोर्नमः । ओमनादिब्रह्मलक्ष्म्यै मुखे मे ते नमो नमः ॥ ७७॥ ओमनादिकम्भरालक्ष्म्यै च कण्ठेऽस्तु
    मे नमः । ओमनादिमहालक्ष्म्यै हृदये मे च ते नमः ॥ ७८॥ ओमनादिश्रीनरायण्यै नमस्ते ममोदरे । ओमनादिवैष्णव्यै
    ते नाभौ मम नमो नमः ॥ ७९॥ ओमनादिललितायै जघने ते च मे नमः । ओमनादिश्रियै चाऽस्तु नमः सक्थ्नोश्च मे सदा
    ॥ ८०॥ ओमनादिकमलायै नमो जान्वोश्च मेऽस्तु ते । ओमनादिरमायै ते नमोऽस्तु पादयोर्मम ॥ ८१॥ ओमनादिहरिण्यै
    ते करयोर्मे नमोऽस्तु ते । ओमनादिमहामात्रे सर्वतस्ते नमो नमः ॥ ८२॥ ओमनादिपद्मायै द्विहस्ततलयोस्ते नमः
    । ओमनादिरक्षित्र्यै ते पृष्ठदेशे नमो नमः ॥ ८३॥ ओमनादिहिरण्यायै रम्याङ्गेषु च ते नमः । ओमनादिसुवर्णायै
    भाग्यरेखासु ते नमः ॥ ८४॥ ओमनादिकुमार्यै ते शीलधर्मे नमो नमः । ओमनादिजनन्यै ते सर्वाङ्गेषु नमो नमः
    ॥ ८५॥ एवं न्यासान् विनिर्वर्त्य ध्यायस्व श्रीपुराधिपाम् । ध्यायस्व श्रीपुरं चापि श्रीपुरेशीश्वरं च
    माम् ॥ ८६॥ सुवर्णनिर्मितां मूर्तिमावाहय ततः परम् । आसनं सम्प्रदेहि त्वं पाद्यमर्घ्यं ततः परम् ॥ ८७॥
    आचमनं जलं पञ्चामृतस्नानं प्रकारय । सुगन्धितैलसाराद्यैः प्रमर्दय परेश्वरीम् ॥ ८८॥ आभिषेकं कारयित्वा
    वस्त्रभूषार्पणं कुरु । सर्वं श
