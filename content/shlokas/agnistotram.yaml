id: agnistotram
category: stotram
name:
  english: agnistotram
  devanagari: अग्निस्तोत्रम्
content:
  english: agnistotram om namah sarvabhutanam sadhanaya mahatmane | ekadvipancadhishnyaya rajasuye shadatmane
    || 1|| namah samastadevanam vrittidaya suvarcase | shukrarupaya jagatamasheshanam sthitipradah ||
    2|| tvam mukham sarvadevanam tvayattam bhagavanhavih | prinayasyakhilandevamstvatpranah sarvadevatah
    || 3|| hutam havistvayyanala medhatvamupagacchati | tatashca jalarupena parinamamupaiti yat || 4||
    tenakhilaushadhijanma bhavatyanilasarathe | aushadhibhirasheshabhih sukham jivanti jantavah || 5||
    vitanvate nara yajnamstvatsrishtasvoshadhishu ca | yajnairdevastatha daityastadvadrakshamsi pavaka
    || 6|| apyayyante ca te yajnastvadadhara hutashana | atah sarvasya yonistvam vahne sarvamayastatha
    || 7|| devata danava yaksha daitya gandharvarakshasah | manushah pashavo vriksha mrigapakshisarisripah
    || 8|| apyayyante tvaya sarve samvardhyante ca pavaka | tvatta evodbhavam yanti tvayyante ca tatha
    layam || 9|| apah srijasi devatvam tvamatsi punareva tah | pacyamanastvaya tashca praninam pushtikaranam
    || 10|| deveshu tejorupena kantya siddheshvavasthitah | visharupena nageshu vayurupah patattrishu
    || 11|| manujeshu bhavankrodho mohah pakshimrigadishu | avashtambho'si tarushu kathinyam tvam mahim
    prati || 12|| jale dravastvam bhagavanjavarupi tatha'nile | vyapitvena tathaivagne nabhasi tvam vyavasthitah
    || 13|| tvamagne sarvabhutanamantashcarasi palayan | tvamekamahuh kavayastvamahustrividhah punah ||
    14|| tvamashtadha kalpayitva yajnavahamakalpayan | tvaya srishtamidam vishvam vadanti paramarshayah
    || 15||
  devanagari: अग्निस्तोत्रम् ॐ नमः सर्वभूतानां साधनाय महात्मने । एकद्विपञ्चधिष्ण्याय राजसूये षडात्मने
    ॥ १॥ नमः समस्तदेवानां वृत्तिदाय सुवर्चसे । शुक्ररूपाय जगतामशेषाणां स्थितिप्रदः ॥ २॥ त्वं मुखं सर्वदेवानां
    त्वयात्तं भगवन्हविः । प्रीणयस्यखिलान्देवांस्त्वत्प्राणाः सर्वदेवताः ॥ ३॥ हुतं हविस्त्वय्यनल मेधत्वमुपगच्छति
    । ततश्च जलरूपेण परिणाममुपैति यत् ॥ ४॥ तेनाखिलौषधीजन्म भवत्यनिलसारथे । औषधीभिरशेषाभिः सुखं जीवन्ति
    जन्तवः ॥ ५॥ वितन्वते नरा यज्ञांस्त्वत्सृष्टास्वोषधीषु च । यज्ञैर्देवास्तथा दैत्यास्तद्वद्रक्षांसि
    पावक ॥ ६॥ आप्याय्यन्ते च ते यज्ञास्त्वदाधारा हुताशन । अतः सर्वस्य योनिस्त्वं वह्ने सर्वमयस्तथा ॥ ७॥
    देवता दानवा यक्षा दैत्या गन्धर्वराक्षसाः । मानुषाः पशवो वृक्षा मृगपक्षिसरीसृपाः ॥ ८॥ आप्याय्यन्ते
    त्वया सर्वे संवर्ध्यन्ते च पावक । त्वत्त एवोद्भवं यान्ति त्वय्यन्ते च तथा लयम् ॥ ९॥ अपः सृजसि देवत्वं
    त्वमत्सि पुनरेव ताः । पच्यमानास्त्वया ताश्च प्राणिनां पुष्टिकारणम् ॥ १०॥ देवेषु तेजोरूपेण कान्त्या
    सिद्धेष्ववस्थितः । विषरूपेण नागेषु वायुरूपः पतत्त्रिषु ॥ ११॥ मनुजेषु भवान्क्रोधो मोहः पक्षिमृगादिषु
    । अवष्टम्भोऽसि तरुषु काठिन्यं त्वं महीं प्रति ॥ १२॥ जले द्रवस्त्वं भगवाञ्जवरूपी तथाऽनिले । व्यापित्वेन
    तथैवाग्ने नभसि त्वं व्यवस्थितः ॥ १३॥ त्वमग्ने सर्वभूतानामन्तश्चरसि पालयन् । त्वामेकमाहुः कवयस्त्वामाहुस्त्रिविधः
    पुनः ॥ १४॥ त्वामष्टधा कल्पयित्वा यज्ञवाहमकल्पयन् । त्वया सृष्टमिदं विश्वं वदन्ति परमर्षयः ॥ १५॥
