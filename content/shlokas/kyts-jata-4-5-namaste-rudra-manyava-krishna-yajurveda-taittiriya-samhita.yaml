id: kyts-jata-4-5-namaste-rudra-manyava-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.5 Namaste Rudra Manyava - Krishna Yajurveda Taittiriya Samhita
content:
  english: namaste te namo namaste | te rudra rudra te te rudra | rudra manyave manyave rudra rudra manyave
    manyava uto uto manyave manyava uto | uto te ta uto uto te ta ishava ishave te ta ishave | ishave
    namo nama ishava ishave namah | nama ste te namo nama ste | te astvastu te te astu | astu dhanvane
    dhanvane astvastu dhanvane | ndhanvane dhanvane bahubhya bahubhya mutota bahubhya bahubhyamiti bahu
    te namo nama ste te namah | ta ishu rishu ste ta ishuh | ishuh shivatama shivatameshu rishuh shivatama
    | shivatama shivagm shivagm shivatama shivatama shivam | mbabhuva babhuva shivagm shiva babhuva te
    te babhuva babhuva te | rdhanu ste te dhanuh | shiva sharavya sharavya shiva shiva sharavya sharavya
    ya ya sharavya sharavya ya | ya tava tava ya ya tava | tava taya taya tava tava taya taya no na staya
    taya nah | no rudra rudra no no rudra | rudra mridaya mridaya rudra rudra mridaya | te rudra rudra
    te te rudra | rudra shiva shiva rudra rudra shiva | shshiva shiva tanuh | tanu raghora 'ghora tanu
    stanu raghora | aghora 'papakashi nyapapakashi nyaghora 'ghora 'papakashini | taya no na staya taya
    nah | na stanuva tanuva no na stanuva tanuva shantamaya shantamaya tanuva tanuva shantamaya | shantamaya
    girishanta girishanta shantamaya shantamaya girishanta | girishanta bhyabhi girishanta girishantabhi
    | girishanteti giri abhi cakashihi cakashi hyabhyabhi cakashihi | cakashihiti cakashihi | ngirishanta
    girishanteshu mishu girishanta haste haste girishanta girishanta haste girishanteti giri shi haste
    haste bibhar shyastave astave bibhar astava ityastave | ngiritra giritra shivagm shiva ngiritra giritra
    tam | kuru ma ma kuru kuru ma | mpurushagm higmsir higmsih purusham | shivena vacasa vacasa shivena
    shivena vacasa | vacasa tva tva vacasa vacasa tva | tva girisha girisha tva tva girisha | girisha
    cchaccha girisha girishaccha | accha vadamasi vadama syacchaccha vadamasi | vadamasiti vadamasi |
    yatha no no yatha yatha nah | ij jagaj jaga didij jagat | jagadayakshma mayakshma njagaj jagadayakshmam
    | ssumana ayakshma mayakshmagm sumanah adhyavoca davoca dadhya dhyavocat | avoca dadhivakta 'dhivakta
    'voca davoca dadhivakta | adhivakta prathamah prathamo adhivakta 'dhivakta prathamah | prathamo daivyo
    daivyah prathamah prathamo daivyah | daivyo bhishag bhishag daivyo daivyo bhishak | n jambhayan jambhaya
    ssarva jambhayan jambhaya ca yatudhanyo yatudhanyashca ca yatudhanyah | yatudhanya iti yatu asau yo
    yo asa vasau yah | ya stamra stamro yo ya stamrah | tamro aruno aruna stamra stamro arunah | aruna
    utota runo aruna uta | rbabhru rutota babhruh | ssumangalah sumangalo babhru imagm rudra rudra ima
    mimagm rudrah | rudra abhito abhito rudra rudra abhitah | abhito dikshu dikshvabhito abhito dikshu
    | shshrita dikshu dikshu shritah | || sahasrasho 'vava sahasrasha sahasrasha iti sahasra avaisha mesha
    mava vaisham | hedo heda esha mesha heda imaha imahe hedo heda imahe | asau yo yo asa vasau yah |
    yo 'vasarpa tyavasarpati yo yo 'vasarpati | avasarpati nilagrivo nilagrivo 'vasarpa tyavasarpati nilagrivah
    | nilagrivo vilohito vilohito nilagrivo nilagrivo vilohitah | nilagriva iti nila utaina mena muto
    taina ngopa gopa ena mena ngopa gopa adrishann | nnudaharya udaharyo adrisha utaina mena muto taina
    vi~shva vishvaina menam vishva bhutani bhutani vishva vishva bhutani | bhutani sa sa bhutani bhutani
    sah | drishto mridayati mridayati drishto drishto mridayati | mridayati no no mridayati mridayati
    nah | namo astvastu namo namo astu | astu nilagrivaya nilagrivaya stvastu nilagrivaya | nilagrivaya
    sahasrakshaya sahasrakshaya nilagrivaya nilagrivaya sahasrakshaya | nilagrivayeti nila sahasrakshaya
    midhushe midhushe sahasrakshaya sahasrakshaya midhushe sahasrakshayeti sahasra midhusha iti midhushe
    atho ye ye 'tho atho ye | ye asyasya ye ye asya | ssatvano asyasya satvanah | satvano 'ha mahagm satvana
    ntebhya stebhyo 'ha maha ntebhya stebhyo 'karam | nnamo namo 'kara makara pra munca munca pra pra
    munca | munca dhanvano dhanvano munca munca dhanvanah | ndhanvano dhanvana stvam | tva mubhayo rubhayo
    stva ubhayo rartniyo rartniyo rubhayo rubhayo rartniyoh | njya martniyo rartniyo yashca ca ya yashca
    | ca te te ca ca te | te haste haste te te haste hasta ishava ishavo haste hasta ishavah | ishavah
    para pareshava ishavah para para ta stah para para tah | ta bhagavo bhagava sta sta bhagavah | bhagavo
    vapa vapa bhagavo bhagavo vapa | rdhanu ravatatya vatatya dhanuh | tvagm sahasraksha sahasraksha tva
    ntvagm sahasraksha | sahasraksha shateshudhe shateshudhe sahasraksha sahasraksha shateshudhe | sahasraksheti
    sahasra nnishirya nishirya shalyana mmukha mukha shalyana shshivo mukha mukha shivah | sumana bhava
    bhava sumana dhanuh kapardinah kapardino dhanu rdhanuh kapardinah | kapardino vishalyo vishalyah kapardinah
    kapardino vishalyah | vishalyo vishalyo banavan | banavagm utota banava asyeshava ishavo asya syeshavah
    | ishava abhu rabhu rishava ishava abhuh | abhu rasyasyabhu rabhu rasya | rnishangathi rasyasya nishangathih
    | nishangathiriti nishangathih | heti ste te hetih | rmidhushtama midhushtama hetir midhushtama haste
    haste midhushtama midhushtama haste midhushtameti midhuh haste babhuva babhuva haste haste babhuva
    | babhuva te te babhuva babhuva te | rdhanu ste te dhanuh | ntaya taya 'sman | vishvato vishvato asma
    nasman vi~shvato vishvata stvam | tva mayakshmaya 'yakshmaya tva ayakshmaya pari paryayakshmaya 'yakshmaya
    pari | paribbhuja bhuja pari paribbhuja | nama ste te namo nama ste | te astvastu te te astu | astva
    yudhaya yudhaya stva stvayudhaya | ayudhaya natataya natataya yudhaya yudhaya natataya | anatataya
    dhrishnave dhrishnave 'natataya natataya dhrishnave dhrishnava iti dhrishnave ubhabhya mutotobhabhya
    mubhabhya muta | te namo nama ste te namah | nnamo namo bahubhya bahubhyamiti bahu tava dhanvane dhanvane
    tava tava dhanvane | dhanvana iti dhanvane | pari te te pari pari te | te dhanvano dhanvana ste te
    dhanvanah | rdhanvano dhanvano hetih | heti rasma nasman asman vrinaktu vrinaktvasma nasman vrinaktu
    | vrinaktu vishvato vishvato vrinaktu vrinaktu vishvatah | vishvata iti vishvatah | atho yo yo 'tho
    atho yah | ishudhi stava taveshudhi rishudhi stava | tavara are tava tavare | are asma dasma dara
    are asmat | ni dhehi dhehi ni ni dhehi | namo hiranyabahave hiranyabahave namo namo hiranyabahave
    | hiranyabahave senanye senanye hiranyabahave hiranyabahave senanye hiranyabahava iti hiranya ndishagm
    senanye senanye disham | senanya iti sena ca pataye pataye ca ca pataye | pataye namo nama spataye
    pataye namah | namo vrikshebhyo vrikshebhyo namo namo vrikshebhyah | vrikshebhyo harikeshebhyo harikeshebhyo
    vrikshebhyo vrikshebhyo harikeshebhyah | mpashunagm harikeshebhyo harikeshebhyah pashunam | harikeshebhya
    iti hari mpataye pataye pashuna pataye namo nama spataye pataye namah | namah saspinjaraya saspinjaraya
    namo namah saspinjaraya | saspinjaraya tvishimate tvishimate saspinjaraya saspinjaraya tvishimate
    | ntvishimate tvishimate pathinam | tvishimata iti tvishi mpataye pataye pathina pataye namo nama
    spataye pataye namah | namo babhlushaya babhlushaya namo namo babhlushaya | babhlushaya vivyadhine
    vivyadhine babhlushaya babhlushaya vivyadhine vivyadhine 'nnana mannanam vi~vyadhine vivyadhine 'nnanam
    | vivyadhina iti vi mpataye pataye 'nnana mannana pataye namo nama spataye pataye namah | namo harikeshaya
    harikeshaya namo namo harikeshaya | harikesha yopavitina upavitine harikeshaya harikesha yopavitine
    upavitine pushtana mpushtana mupavitina upavitine pushtana mpataye pataye pushtana pataye namo nama
    spataye pataye namah | namo bhavasya bhavasya namo namo bhavasya | bhavasya hetyai hetyai bhavasya
    bhavasya hetyai | njagatagm hetyai hetyai jagatam | mpataye pataye jagata pataye namo nama spataye
    pataye namah | namo rudraya rudraya namo namo rudraya | rudrayata tavina atatavine rudraya rudraya
    tatavine atatavine kshetrana nkshetrana matatavina atatavine kshetranam | mpataye pataye kshetrana
    pataye namo nama spataye pataye namah | namah sutaya sutaya namo namah sutaya | sutaya hantyaya hantyaya
    sutaya sutaya hantyaya | ahantyaya vananam va~nana mahantyaya hantyaya vananam | mpataye pataye vananam
    pataye namo nama spataye pataye namah | namo rohitaya rohitaya namo namo rohitaya | || rohitaya sthapataye
    sthapataye rohitaya rohitaya sthapataye | sthapataye vrikshanam sthapataye sthapataye vrikshana mpataye
    pataye vrikshanam pataye namo nama spataye pataye namah | namo mantrine mantrine namo namo mantrine
    mantrine vanijaya vanijaya mantrine mantrine vanijaya | vanijaya kakshana va~nijaya vanijaya kakshanam
    | mpataye pataye kakshana pataye namo nama spataye pataye namah | namo bhuvantaye bhuvantaye namo
    namo bhuvantaye bhuvantaye varivaskritaya varivaskritaya bhuvantaye bhuvantaye varivaskritaya | varivaskrita
    yaushadhina moshadhinam va~rivaskritaya varivaskrita yaushadhinam | varivaskritayeti varivah mpataye
    pataya oshadhina moshadhina pataye namo nama spataye pataye namah | nama uccairghosha yoccairghoshaya
    namo nama uccairghoshaya | uccairghoshaya krandayata akrandayata uccairghosha yoccairghoshaya krandayate
    | uccairghoshayetyuccaih akrandayate pattina krandayata akrandayate pattinam | mpataye pataye pattina
    pataye namo nama spataye pataye namah | namah krithsnavitaya krithsnavitaya namo namah krithsnavitaya
    | krithsnavitaya dhavate dhavate krithsnavitaya krithsnavitaya dhavate | krithsnavitayeti krithsna
    ndhavate dhavate satvanam | mpataye pataye satvana pataye namo nama spataye pataye namah | ssahamanaya
    sahamanaya namo nama sahamanaya nivyadhine nivyadhine sahamanaya sahamanaya nivyadhine nivyadhina
    avyadhinina mavyadhinina nnivyadhine nivyadhina avyadhininam | nivyadhina iti ni mpataye pataya avyadhinina
    mavyadhinina avyadhininamitya pataye namo nama spataye pataye namah | namah kakubhaya kakubhaya namo
    namah kakubhaya | kakubhaya nishangine nishangine kakubhaya kakubhaya nishangine nnishangine nishangine
    mpataye pataye stenana pataye namo nama spataye pataye namah | namo nishangine nishangine namo namo
    nishangine nishangina ishudhimata ishudhimate nishangine nishangina ishudhimate ishudhimate taskarana
    ntaskarana mishudhimata ishudhimate taskaranam | ishudhimata itishudhi mpataye pataye taskarana pataye
    namo nama spataye pataye namah | namo vancate vancate namo namo vancate | vancate parivancate parivancate
    vancate vancate parivancate | parivancate stayunag mparivancate parivancate stayunam | parivancata
    iti pari mpataye pataye stayunag pataye namo nama spataye pataye namah | namo nicerave nicerave namo
    namo nicerave nicerave paricaraya paricaraya nicerave nicerave paricaraya | paricaraya ranyana maranyana
    mparicaraya paricaraya ranyanam | mpataye pataye 'ranyana maranyana pataye namo nama spataye pataye
    namah | namah srikavibhyah srikavibhyo namo namah srikavibhyah | ssrikavibhyah srikavibhyo jigha srikavibhya
    iti srikavi sadbhyo mushnatam | mpataye pataye mushnata pataye namo nama spataye pataye namah | namo
    'simadbhyo 'simadbhyo namo namo 'simadbhyah | nnakta masimadbhyo 'simadbhyo nakta asimadbhya ityasimat
    ncaradbhya shcaradbhyo nakta caradbhyah prakrintana ncaradbhya shcaradbhyah prakrintana caradbhya
    iti carat mpataye pataye prakrintana prakrintanamiti pra pataye namo nama spataye pataye namah | nama
    ushnishina ushnishine namo nama ushnishine ushnishine giricaraya giricara yo shnishina ushnishine
    giricaraya | giricaraya kuluncana ngiricaraya giricaraya kuluncana giricarayeti giri mpataye pataye
    kuluncana pataye namo nama spataye pataye namah | nama ishumadbhya ishumadbhyo namo nama ishumadbhyah
    | || ishumadbhyo dhanvavibhyo dhanvavibhya ishumadbhya ishumadbhyo dhanvavibhyah | ishumadbhya itishumat
    dhanvavibhyashca ca dhanvavibhyo dhanvavibhyashca | dhanvavibhya iti dhanvavi ca vo vashca ca vah
    | vo namo namo vo vo namah | nama atanvanebhya atanvanebhyo namo nama atanvanebhyah | atanvanebhyah
    pratidadhanebhyah pratidadhanebhya atanvanebhya atanvanebhyah pratidadhanebhyah | atanvanebhya itya
    pratidadhanebhyashca ca pratidadhanebhyah pratidadhanebhyashca | pratidadhanebhya iti prati ca vo
    vashca ca vah | vo namo namo vo vo namah | nama ayacchadbhya ayacchadbhyo namo nama ayacchadbhyah
    | ayacchadbhyo visrijadbhyo visrijadbhya ayacchadbhya ayacchadbhyo visrijadbhyah | ayacchadbhya ityayacchat
    visrijadbhyashca ca visrijadbhyo visrijadbhyashca | visrijadbhya iti visrijat ca vo vashca ca vah
    | vo namo namo vo vo namah | namo 'syadbhyo 'syadbhyo namo namo 'syadbhyah | asyadbhyo viddhyadbhyo
    viddhyadbhyo 'syadbhyo 'syadbhyo viddhyadbhyah | asyadbhya ityasyat viddhyadbhyashca ca viddhyadbhyo
    viddhyadbhyashca | vidhyadbhya iti vidhyat ca vo vashca ca vah | vo namo namo vo vo namah | nama asinebhya
    asinebhyo namo nama asinebhyah | shshayanebhya asinebhya asinebhya shayanebhyashca ca shayanebhya
    ca vo vashca ca vah | vo namo namo vo vo namah | namah svapadbhyah svapadbhyo namo namah svapadbhyah
    | svapadbhyo jagradbhyo jagradbhya ssvapadbhyah svapadbhyo jagradbhyah | svapadbhya iti svapat jagradbhyashca
    ca jagradbhyo jagradbhyashca | jagradbhya iti jagrat ca vo vashca ca vah | vo namo namo vo vo namah
    | nama stishthadbhya stishthadbhyo namo nama stishthadbhyah | tishthadbhyo dhavadbhyo dhavadbhya stishthadbhya
    stishthadbhyo dhavadbhyah | tishthadbhya iti tishthat dhavadbhyashca ca dhavadbhyo dhavadbhyashca
    | dhavadbhya iti dhavat ca vo vashca ca vah | vo namo namo vo vo namah | namah sabhabhyah sabhabhyo
    namo namah sabhabhyah | sabhabhyah sabhapatibhya ssabhabhyah sabhabhyah sabhapatibhyah | sabhapatibhyashca
    ca sabhapatibhya sabhapatibhya iti sabhapati ca vo vashca ca vah | vo namo namo vo vo namah | namo
    ashvebhyo 'shve bhyo namo namo ashve ashvebhyo 'shvapatibhyo 'shvapatibhyo 'shvebhyo 'shvebhyo 'shvapatibhyah
    | ashvapatibhyashca cashvapatibhyo 'shvapatibhyashca | ashvapatibhya ityashvapati ca vo vashca ca
    vah | vo namo namo vo vo namah | bhyo namo nama avyadhini bhyo vividdhyantibhyo vividdhyantibhya avyadhini
    bhyo vividdhyantibhyah | vividdhyantibhyashca ca vividdhyantibhyo vividdhyantibhyashca | vividhyantibhya
    iti vi ca vo vashca ca vah | vo namo namo vo vo namah | nama uganabhya uganabhyo namo nama uganabhyah
    | uganabhya strigmhatibhya strigmhatibhya uganabhya uganabhya strigmhatibhyah | hatibhyashca ca trigmhatibhya
    strigmhatibhyashca | ca vo vashca ca vah | vo namo namo vo vo namah | namo grithsebhyo grithsebhyo
    namo namo grithsebhyah | grithsebhyo grithsapatibhyo grithsapatibhyo grithsebhyo grithsebhyo grithsapatibhyah
    | grithsapatibhyashca ca grithsapatibhyo grithsapatibhyashca | grithsapatibhya iti grithsapati ca
    vo vashca ca vah | vo namo namo vo vo namah | bhyo namo namo vrate bhyo vratapatibhyo vratapatibhyo
    vrate bhyo vratapatibhyah | vratapatibhyashca ca vratapatibhyo vratapatibhyashca | vratapatibhya iti
    vratapati ca vo vashca ca vah | vo namo namo vo vo namah | namo ganebhyo ganebhyo namo namo ganebhyah
    | ganebhyo ganapatibhyo ganapatibhyo ganebhyo ganebhyo ganapatibhyah | ganapatibhyashca ca ganapatibhyo
    ganapatibhyashca | ganapatibhya iti ganapati ca vo vashca ca vah | vo namo namo vo vo namah | namo
    virupebhyo virupebhyo namo namo virupebhyah | virupebhyo vishvarupebhyo vishvarupebhyo virupebhyo
    virupebhyo vishvarupebhyah | vishvarupebhyashca ca vishvarupebhyo vishvarupebhyashca | vishvarupebhya
    iti vishva ca vo vashca ca vah | vo namo namo vo vo namah | namo mahadbhyo mahadbhyo namo namo mahadbhyah
    | mahadbhyah kshullakebhyah kshullakebhyo mahadbhyo mahadbhyah kshullakebhyah | mahadbhya iti mahat
    kshullakebhyashca ca kshullakebhyah kshullakebhyashca | ca vo vashca ca vah | vo namo namo vo vo namah
    | namo rathibhyo rathibhyo namo namo rathibhyah | rathibhyo 'rathebhyo 'rathebhyo rathibhyo rathibhyo
    'rathebhyah | arathebhyashca carathebhyo 'rathebhyashca | ca vo vashca ca vah | vo namo namo vo vo
    namah | bhyo rathapatibhyo rathapatibhyo rathe bhyo rathapatibhyah | || rathapatibhyashca ca rathapatibhyo
    rathapatibhyashca | rathapatibhya iti rathapati ca vo vashca ca vah | vo namo namo vo vo namah | ssenanibhyah
    senanibhya senanibhyashca ca senanibhyah senanibhyashca | senanibhya iti senani ca vo vashca ca vah
    | vo namo namo vo vo namah | namah kshattribhyah kshattribhyo namo namah kshattribhyah | kshattribhyah
    sangrahitribhyah sangrahitribhyah kshattribhyah kshattribhyah sangrahitribhyah | kshattribhya iti
    kshattri sangrahitribhyashca ca sangrahitribhyah sangrahitribhyashca | sangrahitribhya iti sangrahitri
    ca vo vashca ca vah | vo namo namo vo vo namah | nama stakshabhya stakshabhyo namo nama stakshabhyah
    | takshabhyo rathakarebhyo rathakarebhya stakshabhya stakshabhyo rathakarebhyah | takshabhya iti taksha
    rathakarebhyashca ca rathakarebhyo rathakarebhyashca | rathakarebhya iti ratha ca vo vashca ca vah
    | vo namo namo vo vo namah | namah kulalebhyah kulalebhyo namo namah kulalebhyah | kulalebhyah karmare
    bhyah kulalebhyah kulalebhyah karmare ca vo vashca ca vah | vo namo namo vo vo namah | bhyo namo namah
    punjishte bhyo nishadebhyo nishadebhyah punjishte nishadebhyashca ca nishadebhyo nishadebhyashca |
    ca vo vashca ca vah | vo namo namo vo vo namah | nama ishukridbhya ishukridbhyo namo nama ishukridbhyah
    | ishukridbhyo dhanvakridbhyo dhanvakridbhya ishukridbhya ishukridbhyo dhanvakridbhyah | ishukridbhya
    itishukrit dhanvakridbhyashca ca dhanvakridbhyo dhanvakridbhyashca | dhanvakridbhya iti dhanvakrit
    ca vo vashca ca vah | vo namo namo vo vo namah | namo mrigayubhyo mrigayubhyo namo namo mrigayubhyah
    | mrigayubhyah shvanibhyah shvanibhyo mrigayubhyo mrigayubhyah shvanibhyah | mrigayubhya iti mrigayu
    shvanibhyashca ca shvanibhyah shvanibhyashca | shvanibhya iti shvani ca vo vashca ca vah | vo namo
    namo vo vo namah | shvapatibhyashca ca shvapatibhya shvapatibhya iti shvapati ca vo vashca ca vah
    | vo namo namo vo vo namah | namo bhavaya bhavaya namo namo bhavaya | bhavaya ca ca bhavaya bhavaya
    ca | ca rudraya rudraya ca ca rudraya | rudraya ca ca rudraya rudraya ca | ca namo namashca ca namah
    | namah sharvaya sharvaya namo namah sharvaya | sharvaya ca ca sharvaya sharvaya ca | ca pashupataye
    pashupataye ca ca pashupataye | pashupataye ca ca pashupataye pashupataye ca | ca namo namashca ca
    namah | namo nilagrivaya nilagrivaya namo namo nilagrivaya | nilagrivaya ca ca nilagrivaya nilagrivaya
    ca | nilagrivayeti nila ca shitikanthaya shitikanthaya ca ca shitikanthaya | shitikanthaya ca ca shitikanthaya
    shitikanthaya ca | shitikanthayeti shiti ca namo namashca ca namah | namah kapardine kapardine namo
    namah kapardine kapardine ca ca kapardine kapardine ca | ca vyuptakeshaya vyuptakeshaya ca ca vyuptakeshaya
    | vyuptakeshaya ca ca vyuptakeshaya vyuptakeshaya ca | vyuptakeshayeti vyupta ca namo namashca ca
