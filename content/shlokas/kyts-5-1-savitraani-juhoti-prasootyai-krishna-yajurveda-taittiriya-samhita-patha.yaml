id: kyts-5-1-savitraani-juhoti-prasootyai-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.1 Savitraani Juhoti Prasootyai - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande prathamah prashnah shri gurubhyo namah
    | harih om || savitrani juhoti prasu tyai caturgrihitena juhoti catushpadah pashavah pashuneva 'va
    rundhe catasro disho dikshveva prati tishthati chandagmsi devebhyo 'pa nna vo bhagani havyam va~kshyama
    iti tebhya etaccatu 'nu vakyayai yajyayai devatayai vashatkaraya yaccaturgrihita njuhoti chandagsyeva
    ta tprinati tanyasya pritani devebhyo havyam dahutibhirevainamapa grihnati papiya nkamayeta vasiyan
    thsyaditi sarvani tasya 'nudrutya juhuyadahutyaivainamabhi kramayati vasiya nbhavatyatho yajnasyaivaisha
    ntireti va esha yajnamukha 'gnerdevataya etyashtavetani savitrani bhavantyashtakshara gayatri gayatro
    'gnistenaiva yajnamukhadriddhya agnerdevatayai naityashtau savitrani bhavantyahutirnavami trivritameva
    yajnamukhe viyatayati yadi kamayeta chandagmsi yajnayashasena 'rpayeyamityricamantama nkuryacchandagsyeva
    yajnayashasena 'rpayati yadi kamayeta yajamanam 'rpayeyamiti yajurantama dyajamanameva yajnayashasena
    'rpayatyrica stomagm samardhaye tyaha samriddhyai caturbhirabhrima datte catvari chandagmsi chandobhireva
    devasya tva savituh prasava ityaha prasu tya agnirdevebhyo nilayata sa venu thsa etamutimanu samacara
    ssushiragm sushira 'bhrirbhavati sayonitvaya sa yatrayatra tkalmashi bhavati rupasamriddhya ubhayatah
    kshnurbhavatitashca varuddhyai vyamamatri bhavatyetavadvai purushe viryam vi~ryasammita 'parimita
    bhavatya ' varuddhyai yo vanaspatina rvainavi bhavati viryasya varuddhyai || dyajnasya yadayajushkena
    kriyata imamagribhna mritasyetyashvabhidhanima datte yajushkrityai yajnasya samriddhyai pratu va~jinna
    dravetyashva mabhi dadhati rupameva vya~cashte yunjathagm rasabham mprati shthapayati tasmadashva
    'sattaro yogeyoge tavastaramityaha yu~nkte vajevaje havamaha ityahannam 'nnamevava rundhe sakhaya
    indramutaya ityahendriyamevava rundhe 'gnirdevebhyo nilayata ta mprajapatiranvavinda mbharatyanuvittyai
    papavasyasam tkriyate yacchreyasa ca papiyasa ca samana nkarma kurvanti papiyan sasya vyavrittyai
    tasmacchreyagmsa npashcadanveti bahurvai bhavato bhratrivyo bhavativa khalu va esha yo ncinute vajryashvah
    praturvannehyava shastirityaha vajrenaiva papmana mbhratrivyamava kramati rudrasya ganapatyadityaha
    raudra vai pashavo rudradeva ''tmane karma kurute pushna sayuja sahetyaha pusha va addhvanagm sanneta
    samashtyai purishayatano va esha yadagnirangiraso va etamagre devatanagm samabhara dacchehityaha sayatanamevaina
    dacchema ityaha yena sangacchate vajamevasya vrinkte prajapataye pratiprocyagni ssambhritya ityahuriyam
    vai~ prajapatistasya etacchrotram dbharishyama iti valmikavapamupa tishthate sakshadeva prajapataye
    pratiprocya dbharama ityaha yena sagancchate vajamevasya vrinkte 'nvagnirushasamagra 'nvagnirushasamagra
    nukhyatya agatya vajyaddhvana akramya vaji nprithivimityahecchatyevaina mpurvaya vindatyuttaraya dvabhyama
    kramayati pratishthitya anurupabhya ntasmadanurupah pashavah prajayante dyauste prishtha mprithivi
    sadhasthamityahaibhyo va etam lo~kebhyah prajapati vya~cashte vajri va esha yadashvo da dbhiranyatodadbhyo
    bhuyam lo~mabhirubhayadadbhyo ya dvajrenaivainagg strinute || dakramiditi dvabhyamutkramayati pratishthitya
    anurupabhya ntasmadanurupah pashavah prajayante 'pa upa srijati yatra va apa upa gacchanti tadoshadhayah
    prati tishthantyoshadhih pratitishthantih pashavo 'nu prati tishthanti pashun mprajastasmadapa upa
    srijati pratishthityai yadaddhvaryu drakshagmsi yajnagm hanyurhiranyamupasya juhotyagnivatyeva juhoti
    nandho 'ddhvaryurbhavati na yajnagm rakshagmsi ghnanti jigharmyagni mmanasa ghritenetyaha manasa hi
    purusho yajnamabhigacchati pratikshyanta mbhuvanani vishvetyaha sarvagg hyesha pratya ntirashca vayasa
    brihantamityaha 'lpo hyesha jato maha nbhavati vyacishthamannagm rabhasam vi~danamityaha 'nnameva
    svadayati sarvamasmai svadate ya evam ve~da ''tva jigharmi vacasa ghritenetyaha tasma dvaca vadatya
    rakshasetyaha rakshasamapahatyai maryashri dvarno agnirityaha ~veda manasa tvai tamaptumar hati yamaddhvaryura
    njuhoti manasvatibhya njuhotyahutyoraptyai dvabhya mpratishthityai yajnamukhe yajnamukhe vai kriyamane
    yajnagm rakshagmsi jighagm santyetar rashnute pari likhati rakshasamapahatyai tisribhih pari likhati
    trivridva agniryavaneva drakshagsyapa hanti gayatriya pari likhati tejo vai gayatri tejasaivaina mparigrihnati
    trishtubha pari likhatindriyam mpari grihnatyanushtubha pari likhatyanushtu phsarvani chandagmsi paribhuh
    parya 'nushtubha vagva anushtu nmaddhyato vaca vadamo gayatriya prathamaya pari likhatyatha 'tha trishtubha
    tejo vai gayatri yajno 'nushtugindriya ptejasa caivendriyena cobhayato yajna trishtubha tejo vai gayatri
    devasya tva savituh prasava iti khanati prasu mevaitena janayati jyotishmanta mityaha jyotirevaitena
    janayati so ndeva ardharcena 'higm santamityaha prajabhya evainagm shamayati dvabhya nkhanati pratishthitya
    apa mprishthamasiti pushkaraparnama tpushkaraparnagm rupenaivainada harati pushkaraparnena sa mbharati
    yonirva agneh pushkaraparnagm sayonimevagnigm sambharati krishnajinena sambharati yajno vai krishnajinam
    ya~jnenaiva yajnagm sambharati ya tkrishnajinena sambharatyaranyaneva pashu maranyah pashavah kaniyagmsa
    shshuca hyrita lomata ssambharatyato hyasya meddhya vai~ krishnajinamasau pushkaraparna mubhayatah
    parigrihnatya gnirdevebhyo nilayata tamatharva 'nvapashyadatharva tva prathamo niramanthadagna i ttenaivainagm
    sambharati tvamagne pushkaradadhityaha pushkaraparne hyenamupashrita ttamu tva daddhyannrishirityaha
    daddhyan va atharvana ndadhati tamu tva pathyo vrishetyaha purvamevodita muttarenabhi grinati ssambharati
    catvari chandagmsi chandobhireva gayatribhirbrahmanasya gayatro hi bra strishtugbhi rajanyasya traishtubho
    hi rajanyo ya nkamayeta vasiyan thsyadityubhayibhistasya sambhare nca samici dadhatyashtabhi ssambharatyashtakshara
    gayatri gayatro 'gnistagm sambharati sida hotaritya ha devata evasmai sagm sadayati ni hoteti manushya
    thsagm sidasveti vayagmsi janishva hi jenyo agre ahnamityaha deva manushyaneva kruramiva va asya eta
    tkhanatyapa upa srijatyapo vai shanta 'syai shucagm shamayati sa nte vayurmatarishva dadhatvityaha
    prano vai vayuh pranenaivasyai nte vayurityaha tasma dvayupracyuta divo vrishtirirte tasmai ca devi
    vashadastu tubhyamityaha shadva ritava ritushveva vrishti ssyadyanna vashatkurya drakshagmsi yajnagm
    hanyurvadityaha parokshameva vasha tkaroti nasya yatayama vashatkaro bhavati na yajnagm rakshagmsi
    ghnanti sujato jyotisha sahetyanushtubhopa nahyatyanushtu sarvani chandagmsi phsarvani chandagmsi
    chandagmsi khalu va agneh priya tanuh priyayaivaina ntanuva pari dadhati veduko vaso bhavatiya evam
    ve~da varuno va agnirupanaddha udu tishtha svaddhvarordhva u shuna utaya iti savitribhyamu ttishthati
    savitriprasuta evasyordhvam mpratishthityai sa jato garbho asi rodasyorityaheme rodasyorityaheme vai
    rodasi tayoresha garbho yadagni devamahagne carurvibhrita oshadhishvityaha yada hyetam vi~bharantyatha
    carutaro bhavati pra matribhyo adhi kanikrada dga ityahaushadhayo va asya matarastabhya evaina mpracyavayati
    sthiro bhava vidvanga iti gardabha a sadayati sthemne gardabhena sambharati tasma mbharabharitamo
    gardabhena sa dyatyannagg hyenena 'rkagm sambharanti gardabhena sambharati tasma dgardabho dvireta
    nnirdahati prajasu va esha etar shshuca pradahah shivo bhava prajabhya ityaha prajabhya evainagm shamayati
    manushibhyastvamangira ityaha manavyo hi praja ma dyavaprithivi abhi shushuco ma mma vanaspatinityahaibhya
    evainam lo~kebhyah shamayati praitu vaji kanikradadityaha vaji hyesha nanada tyaha rasabha iti hyetamrishayo
    mpurishyamityaha hyesha bharati ma padyayushah puretyaha ssarvamayureti tasma ''yushah pramite bibhyati
    vrisha mbharannityaha vrisha hyesha vrisha hyesha garbho yadagniragna a yahi vitaya iti va imau lokau
    vyaitamagna a yahi vitaya iti yadaha 'nayo rvityai pracyuto va esha ayatanadagatah pratishthagm sa
    etar nca ddhyayatyritagm satyamityaheyam mprati shthapayati na ''rtimarcchatyaddhvaryurna yajamano
    varuno va esha yajamanamabhyaiti yadagnirupanaddha oshadhayah prati grihnitagnimeta mityaha shantyai
    vyasyan vishva amatirarati rityaha rakshasamapahatyai nishida nno apa durmatigm hanadityaha pratishthitya
    oshadhayah pratimodaddhva menamityahaushadhayo va agnerbhagadheya ntabhirevainagm samardhayati pushpavati
    ssupippala ityaha tasmadoshadhayah phala vo~ garbha ritviyah pratnagm sadhasthama 'sadadityaha yabhya
    evaina mpracyavayati tasvevaina mpratishthapayati dvabhyamupavaharati pratishthityai || varuno va
    agnirupanaddho vi pajaseti visragmsayati savitriprasuta evasya vishucim vi~srijatyapa upa srijatyapo
    vai shanta shshantabhirevasya shucagm shamayati tisribhirupa srijati trivridva agniryavaneva gnistasya
    shucagm shamayati mitra ssagmsrijya prithivimityaha mitro vai shivo devana enagm sagm srijati nagm
    sagm srijati shantyai yadgramyana dgramyani patrani shuca ssagm srijatyetani va anupajivaniyani tanyeva
    shuca 'rpayati sharkarabhi ssagm srijati dhritya atho shantvaya jalomai ssagm srijatyesha va agneh
    priya tanuryadaja priyayaivaina ntanuva sagm srijatyatho tejasa krishnajinasya lomabhi srijati yajno
    vai krishnajinam ya~jnenaiva yajnagm sagm srijati rudra ssabhritya prithivimityahaita va eta ndevata
    agre samabhara ntabhirevainagm sambharati makhasya shiro 'sityaha yajno vai makhastasyaita cchiro
    yadukha tasmadevamaha yajnasya pade stha ityaha yajnasya hyete pade atho pratishthityai pra rmantrayate
    mithunatvaya tryuddhi nkaroti traya ime loka esham lo~kanamaptyai chandobhih karoti viryam vai~ chandagmsi
    viryenaivaina nkaroti yajusha bila nkaroti vyavrittya iyati nkaroti prajapatina yajnamukhena sammita
    nkaroti yavaprithivyordohaya catuhstana ndohayashtastana ttrivritameva vajragm sambhritya bhratrivyaya
    praharati strityai kritvaya sa mahimukhamiti ni dadhati devata saptabhirdhupayati sapta vai shir dyajnasya
    yadukha shirshanneva yajnasya prana nprana ashvashakena dhupayati prajapatyo va ashvah sayonitvaya
    ditistvetyaheyam va~ aditiradityaivaditya nkhanatyasya akrurankaraya na hi sva ssvagm hinasti devana
    ntva patnirityaha devanam ndadhati dhishanastvetyaha vidya vai dhishana vidyabhi mabhindhe gnastvetyaha
    chandagmsi vai gna shchandobhi revainag shrapayati varu trayastvetyaha hotra vai varu trayo hotrabhirevaina
    mpacati janayastvetyaha devanam mpacati shadbhih pacati shadva ritava ritubhirevaina mpacati dvih
    pacantvityaha tasma mpacyate varunyukha 'bhiddha maitriyopaiti shantyai devastva savito dvapatvityaha
    savitriprasuta evaina mbrahmana devatabhiru dvapatyapadyamana prithivyasha disha a prine tyaha tasmadagni
    'nu vibhatyuttishtha brihati bhavordhva tishtha dhruva tvamityaha pratishthitya asurya ''cchrinatti
    yajusha vyavrittyai chandobhira cchrinatti chandobhirva esha kriyate chandobhireva chandagsya cchrinatti
    || ekavigmshatya mashaih tyameddhya vai masha ameddhya nniravadaya meddhya nkritva ''haratyekavigmshati
    rbhavantyekavigmsho vai purushah purushasya ''ptyai vyriddham tpranairameddhyam tpurushashirshagm
    saptadha vitrinnam mprati ni dadhati sapta vai shir pranah pranairevaina thsamardhayati meddhyatvaya
    yavanto mpariyaya yamagathabhih parigayati yamadevaina dvrinkte tisribhih parigayati traya ime loka
    ebhya evainallokebhyo vrinkte tasma 'gnibhyah pashuna labhate kama va agnayah kamanevava rundhe ya
    dyatayamani shirshani syurya tpashunalabhate tenaiva pashunava rundhe ya mayatayamatvaya prajapatyena
    sagg sthapayati yajno vai prajapatiryajna eva yajna mpratishthapayati prajapatih praja asrijata sa
    riricano 'manyata sa eta aprirapashya ttabhirvai sa mukhata atmanama 'prinita atmanama 'prinita yadeta
    apriyo bhavanti yajno vai prajapati ryajnamevaitabhirmukhata a prinatya parimitachandaso bhavantyaparimitah
    prajapatih prajapateraptya unatirikta mithunah praja vai~ namaitacchandah prajapateh pashavo lomashah
    pashuneva 'va rundhe sarvani va eta rupani sarvani rupanyagnau citye kriyante tasmadeta agneshcityasya
    bhavantyekavigm shatigm bhavantyekavigm shatigm samidheniranvaha rugva ekavigmsho rucameva gacchatyatho
    pratishthameva pratishtha hyekavigmsha shcaturvigmshatimanvaha caturvigmshatirardhamasa shvanaramava
    rundhe paraciranvaha paraniva hi suvargo loka 'gna ritavo vardhayantvityaha samabhireva vi~shva a
    bhahi pradishah prithivya ityaha tasmadagni 'nu vibhati pratyauhatamashvina mrityumasmadityaha mrityumeva
    'smadapa nudatyudvaya ntamasasparityaha papma vai tamah papmanamevasmadapa hantyaganma jyotiruttama
    'sau va adityo jyotiruttama madityasyaiva sayujya va~thsarastishthati nasya shristishthati yasyaitah
    kriyante jyotishmati muttamamanvaha jyotirevasma uparishta ddadhati suvargasya lokasyanukhyatyai ||
    kshayati shadva ritava ritubhirevaina ndikshayati saptabhirdikshayati sapta chandagmsi chandobhirevaina
    ndikshayati vishve devasya neturitya ttamaya juhoti vagva anushtu ntanmanushya upa jivanti purnaya
    juhoti purna iva hi prajapatih prajapateraptyai nyunaya juhoti nyunaddhi prajapatih praja asrijata
    prajanagm srishtyai yadarcishi pravrinjya dbhutamava rundhita yadangareshu bhavishyadangareshu pravrinakti
    bhavishya devava rundhe bhavishyaddhi bhuyo bhuta mpravrinakti dvipa dyajamanah pratishthityai brahmana
    va esha yajusha sambhrita yadukha sa yadbhidyeta 'sya yajno mitraitamukha ntapetyaha brahma vai mitro
    brahmannevaina mpratishthapayati na ''rtimarcchati yajamano nasya yajno hanyate yadi bhidyeta taireva
    kapalai thsaiva tatah prayashcittiryo gatashri ssyanmathitva tasyava daddhya dbhuto va esha sa sva
    ndevatamupaiti yo bhutikama ssyadya ukhayai sambhave thsa eva tasya syadato hyesha sambhavatyesha
    vai svayambhurnama bhavatyeva ya nkamayeta bhratrivyamasmai janayeyamitya thsakshadevasmai bhratrivya
    njanayatyambarishadanna kamasyava daddhyadambarishe va anna mava rundhe munjanava dadhatyurgvai munja
    urjamevasma api dadhatyagnirdevebhyo nilayata sa krumuka tkrumukamava dadhati yadevasya tatra nyakta
    nta devava rundha ajyena sam tyetadva agneh priya ndhamna samardhayatyatho tejasa vai kakantima dadhati
    vai kankatima dadhati bha evava rundhe shamimayima dadhati shantyai sida tva mmaturasya upastha iti
    tisribhirjatamupa tishthate traya ime loka eshveva lokeshvavida ndahati tadasmai prayoga evar dyadagne
    yani kani ceti samidhama dadhatyaparashuvrikna svadayati sarvamasmai svadate ya evam ve~daudumbarima
    dadhatyurgva udumbara urjamevasma api dadhati prajapatiragni masrijata tagm srishtagm rakshag srishtagm
    rakshagmsi ttena vai sarakshagsyapa mbhavatyagnereva tena jata drakshagsyapa hantyashvatthima dadhatyashvattho
    vai vanaspatinagm sapatnasaho vijityai vaikankatima dadhati bha evava rundhe shamimayima dadhati shantyai
    sagmshita mbahu atiramityuttame audumbari vacayati brahmanaiva vacayati brahmanaiva kshatragm sagg
    shyati kshatrena brahma tasma dbrahmano rajanyavanatyanya brahmanavanatyanyagm rajanya mmrityurva
    esha yadagniramritagm hiranyagm rukmamantara mpratimuncate 'mritameva mrityorantardhatta ekavigmshatinirbadho
    bhavatyekavigmshatirvai devaloka dvadasha masah pancartavastraya ime loka asavaditya ekavigmsha etavanto
    vai ekavigmsha etavanto vai devalokastebhya eva bhratrivyamantareti nirbadhairvai deva asura 'kurvata
    tannirbadhana nnirbadhi bhavati bhratrivyaneva nirbadhe kurute savitriya pratimuncate prasu tyai naktoshasetyuttaraya
    'horatrabhyamevaina mudyacchate deva agni ndravinoda ityaha prana vai deva dravinoda ahoratrabhyamevainamudyatya
    pranairdadhara ''sinah pratimuncate tasmadasinah prajah prajayante krishnajinamuttara mbrahma krishnajina
    mbrahmana cobhayatah parigrihnati shadudyamagm shikya mbhavati shadva ritava ritubhirevaina ddvadashodyamagm
    sam mbhavatyurgvai munja urjaivainagm sa mardhayati suparno 'si garutmanityave kshate rupamevasyaitanmahimanam
    ngaccha suvah patetyaha suvargamevainam samiddho anjan kridara nghritamagne madhuma tpinvamanah |
    vaji vahan vajina va~kshi priyama sadhastha nprajanan vajyapyetu devan | anu tva sapte pradishah sacantag
    svadhamasmai yajamanaya dhehi || idyashcasi vandyashca vajinnashushcasi meddhyashca sapte | agnishtva
    va~hatu jatavedah || stirna ssushtarima jushanoru prithu prathamana mprithivyam | devebhiryuktamaditi
    nkrinvana suvite dadhatu || eta u va ssubhaga vishvarupa vipakshobhi shshumbhamana dvaro devi ssuprayana
    bhavantu || antara mitravaruna caranti mukham vi~dane | ushasa vagm suhiranye sushilpe suhiranye sushilpe
    ritasya yonaviha sadayami || prathama vagm sarathina suvarna devau pashyantau bhuvanani vishva mmimana
    hotara jyotih pradisha dishanta || adityairno bharati vashtu yajnagm sarasvati saha rudrairna avit
    | idopahuta vasubhi nno deviramriteshu dhatta || tvashta vira njajana tvashturarva jayata ashurashvah
    | njajana bahoh kartaramiha yakshi hotah || ashvo ghritena tmanya samakta upa devagm ritushah patha
    etu | vanaspati mprajanannagnina havya svaditani vakshat || prajapatestapasa vavridhana ssadyo jato
    dadhishe yajnamagne | svahakritena havisha puroga yahi saddhya haviradantu devah || || harih om ||
    || krishna yajurvediya taittiriya samhitaya mpancamakande prathamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे प्रथमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ सा॒वि॒त्राणि॑ जुहोति॒ प्रसू त्यै चतुर्गृही॒तेन॑ जुहोति॒ चतु॑ष्पादः प॒शवः॑ प॒शूने॒वा ऽव॑ रुन्धे॒
    चत॑स्रो॒ दिशो॑ दि॒क्ष्वे॑व प्रति॑ तिष्ठति॒ छन्दाग्ं॑सि दे॒वेभ्यो ऽपा न्न वो॑ भा॒गानि॑ ह॒व्यं वँ॑क्ष्याम॒
    इति॒ तेभ्य॑ ए॒तच्च॑तु ऽनु वा॒क्या॑यै या॒ज्या॑यै दे॒वता॑यै वषट्का॒राय॒ यच्च॑तुर्गृही॒त ञ्जु॒होति॒ छन्दाग्॑स्ये॒व
    त त्प्री॑णाति॒ तान्य॑स्य प्री॒तानि॑ दे॒वेभ्यो॑ ह॒व्यं दाहु॑तीभिरे॒वैन॒मप॑ गृह्णाति॒ पापी॑या ङ्का॒मये॑त॒
    वसी॑यान् थ्स्या॒दिति॒ सर्वा॑णि॒ तस्या॑ ऽनु॒द्रुत्य॑ जुहुया॒दाहु॑त्यै॒वैन॑म॒भि क्र॑मयति॒ वसी॑या न्भव॒त्यथो॑
