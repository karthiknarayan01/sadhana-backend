id: mangalacandikastotra
category: stotram
name:
  english: mangalacandikastotra
  devanagari: मन्गलचण्डिकास्तोत्र
content:
  english: shrimangalacandikastotram athava mangalagauristotram om hrim shrim klim sarvapujye devi mangalacandike
    | aim krum phat svahetyevam capyekavinshaksharo manuh || 1|| pujyah kalpatarushcaiva bhaktanam sarvakamadah
    | dashalakshajapenaiva mantrasiddhirbhavennrinam || 2|| mantrasiddhirbhaved yasya sa vishnuh sarvakamadah
    | dhyananca shruyatam brahman vedoktam sarva sammatam || 3|| devim shodashavarshiyam ramyam susthirayauvanam
    | sarvarupagunadhyanca komalangim manoharam || 4|| shvetacampakavarnabham candrakotisamaprabham |
    vahnishuddhamshukadhanam ratnabhushanabhushitam || 5|| bibhratim kabaribharam mallikamalyabhushitam
    | bimboshtim sudatim shuddham sharatpadmanibhananam || 6|| ishaddhasyaprasannasyam sunilolpalalocanam
    | jagaddhatrinca datrinca sarvebhyah sarvasampadam || 7|| samsarasagare ghore pitarupam varam bhaje
    || 8|| devyashca dhyanamityevam stavanam shruyatam mune | prayatah sankatagrasto yena tushtava shankarah
    || 9|| || shankara uvaca || raksha raksha jaganmatardevi mangalacandike | samhartri
  devanagari: श्रीमङ्गलचण्डिकास्तोत्रं अथवा मङ्गलागौरीस्तोत्रम् ॐ ह्रीं श्रीं क्लीं सर्वपूज्ये देवी मङ्गलचण्डिके
    । ऐं क्रूं फट् स्वाहेत्येवं चाप्येकविन्शाक्षरो मनुः ॥ १॥ पूज्यः कल्पतरुश्चैव भक्तानां सर्वकामदः ।
    दशलक्षजपेनैव मन्त्रसिद्धिर्भवेन्नृणाम् ॥ २॥ मन्त्रसिद्धिर्भवेद् यस्य स विष्णुः सर्वकामदः । ध्यानञ्च
    श्रूयतां ब्रह्मन् वेदोक्तं सर्व सम्मतम् ॥ ३॥ देवीं षोडशवर्षीयां रम्यां सुस्थिरयौवनाम् । सर्वरूपगुणाढ्याञ्च
    कोमलाङ्गीं मनोहराम् ॥ ४॥ श्वेतचम्पकवर्णाभां चन्द्रकोटिसमप्रभाम् । वह्निशुद्धांशुकाधानां रत्नभूषणभूषिताम्
    ॥ ५॥ बिभ्रतीं कबरीभारं मल्लिकामाल्यभूषितम् । बिम्बोष्टीं सुदतीं शुद्धां शरत्पद्मनिभाननाम् ॥ ६॥ ईषद्धास्यप्रसन्नास्यां
    सुनीलोल्पललोचनाम् । जगद्धात्रीञ्च दात्रीञ्च सर्वेभ्यः सर्वसम्पदाम् ॥ ७॥ संसारसागरे घोरे पीतरुपां वरां
    भजे ॥ ८॥ देव्याश्च ध्यानमित्येवं स्तवनं श्रूयतां मुने । प्रयतः सङ्कटग्रस्तो येन तुष्टाव शङ्करः ॥ ९॥
    ॥ शङ्कर उवाच ॥ रक्ष रक्ष जगन्मातर्देवि मङ्गलचण्डिके । संहर्त्री
