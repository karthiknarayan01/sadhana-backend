id: narayanaproktamdurgatinashinikavacam
category: kavacha
name:
  english: narayanaproktamdurgatinashinikavacam
  devanagari: नारायणप्रोक्तंदुर्गतिनाशिनीकवचम्
content:
  english: rinu narada vakshyami durgayah kavacam shubham | shrikrishnenaiva yaddattam goloke brahmane
    pura || 3|| brahma tripurasangrame shankaraya dadau pura | jaghana tripuram rudro yaddhritva bhaktipurvakam
    || 4|| haro dadau gautamaya padmakshaya ca gautamah | yato babhuva padmakshah saptadvipeshvaro jayi
    || 5|| yaddhritva pathanadbrahma jnanavanchaktimanbhuvi | shivo babhuva sarvajno yoginam ca gururyatah
    | shivatulyo gautamashca babhuva munisattamah || 6|| brahmandavijayasyasya kavacasya prajapatih |
    rishishchandashca gayatri devi durgatinashini || 7|| brahmandavijaye caiva viniyogah prakirttitah
    | punyatirtham ca mahatam kavacam paramadbhutam || 8|| om hrim durgatinashinyai svaha me patu mastakam
    | om hrim me patu kapalam capyom hrim shrim patu locane || 9|| patu me karnayugmam capyom durgayai
    namah sada | om hrim shrimiti nasam me sada patu ca sarvatah || 10|| hrim shrim krumiti dantamshca
    patu klimoshthayugmakam | klim klim klim patu kantham ca durge rakshatu gandake || 11|| skandham mahakali
    durge svaha patu nirantaram | vaksho vipadvinashinyai svaha me patu sarvatah || 12|| durge durge raksha
    parshvau svaha nabhim sada'vatu | durge durge dehi raksham prishtham me patu sarvatah || 13|| om hrim
    durgayai svaha ca hastau padau sada'vatu | om hrim durgayai svaha ca sarvangam me sada'vatu || 14||
    pracyam patu mahamaya cagneyyam patu kalika | dakshine dakshakanya ca nairrityam shivasundari || 15||
    pashcime parvati patu varahi varune sada | kuberamata kauberyyamaishanyamishvari sada || 16|| urdhvam
    narayani patu tvambika'dhah sada'vatu | jnanam jnanaprada patu svapne nidra sada'vatu || 17|| iti
    te kathitam vatsa sarvamantraughavigraham | brahmandavijayam nama kavacam paramadbhutam || 18|| susnatah
    sarvatirtheshu sarvayajneshu yatphalam | sarvavratopavase ca tatphalam labhate narah || 19|| gurumabhyarcya
    vidhivadvastralankaracandanaih | kanthe va dakshine bahau kavacam dharayettu yah || 20|| sa ca trailokyavijayi
    sarvashatrupramardakah | idam kavacamajnatva bhajeddurgatinashinim || 21|| shatalaksham prajapto'pi
    na mantrah siddhidayakah || 22|| kavacam kanvashakhoktamuktam narada siddhidam | yasmai kasmai na
    datavyam gopaniyam sudurlabham || 23|| iti shribrahmavaivartapurane ganapatikhande ekonacatvarimshadhyayantargatam
    durgatinashinikavacam samaptam | brahmavaivartapurana | ganapatikhanda | adhyaya 39
  devanagari: ृणु नारद वक्ष्यामि दुर्गायाः कवचं शुभम् । श्रीकृष्णेनैव यद्दत्तं गोलोके ब्रह्मणे पुरा ॥
    ३॥ ब्रह्मा त्रिपुरसङ्ग्रामे शङ्कराय ददौ पुरा । जघान त्रिपुरं रुद्रो यद्धृत्वा भक्तिपूर्वकम् ॥ ४॥ हरो
    ददौ गौतमाय पद्माक्षाय च गौतमः । यतो बभूव पद्माक्षः सप्तद्वीपेश्वरो जयी ॥ ५॥ यद्धृत्वा पठनाद्ब्रह्मा
    ज्ञानवाञ्छक्तिमान्भुवि । शिवो बभूव सर्वज्ञो योगिनां च गुरुर्यतः । शिवतुल्यो गौतमश्च बभूव मुनिसत्तमः
    ॥ ६॥ ब्रह्माण्डविजयस्यास्य कवचस्य प्रजापतिः । ऋषिश्छन्दश्च गायत्री देवी दुर्गतिनाशिनी ॥ ७॥ ब्रह्माण्डविजये
    चैव विनियोगः प्रकीर्त्तितः । पुण्यतीर्थं च महतां कवचं परमाद्भुतम् ॥ ८॥ ॐ ह्रीं दुर्गतिनाशिन्यै स्वाहा
    मे पातु मस्तकम् । ॐ ह्रीं मे पातु कपालं चाप्यों ह्रीं श्रीं पातु लोचने ॥ ९॥ पातु मे कर्णयुग्मं चाप्यों
    दुर्गायै नमः सदा । ॐ ह्रीं श्रीमिति नासां मे सदा पातु च सर्वतः ॥ १०॥ ह्रीं श्रीं क्रूमिति दन्तांश्च
    पातु क्लीमोष्ठयुग्मकम् । क्लीं क्लीं क्लीं पातु कण्ठं च दुर्गे रक्षतु गण्डके ॥ ११॥ स्कन्धं महाकालि
    दुर्गे स्वाहा पातु निरन्तरम् । वक्षो विपद्विनाशिन्यै स्वाहा मे पातु सर्वतः ॥ १२॥ दुर्गे दुर्गे रक्ष
    पार्श्वौ स्वाहा नाभिं सदाऽवतु । दुर्गे दुर्गे देहि रक्षां पृष्ठं मे पातु सर्वतः ॥ १३॥ ॐ ह्रीं दुर्गायै
    स्वाहा च हस्तौ पादौ सदाऽवतु । ॐ ह्रीं दुर्गायै स्वाहा च सर्वाङ्गं मे सदाऽवतु ॥ १४॥ प्राच्यां पातु
    महामाया चाग्नेय्यां पातु कालिका । दक्षिणे दक्षकन्या च नैरृत्यां शिवसुन्दरी ॥ १५॥ पश्चिमे पार्वती पातु
    वाराही वारुणे सदा । कुबेरमाता कौबेर्य्यामैशान्यामीश्वरी सदा ॥ १६॥ ऊर्ध्वं नारायणी पातु त्वम्बिकाऽधः
    सदाऽवतु । ज्ञानं ज्ञानप्रदा पातु स्वप्ने निद्रा सदाऽवतु ॥ १७॥ इति ते कथितं वत्स सर्वमन्त्रौघविग्रहम्
    । ब्रह्माण्डविजयं नाम कवचं परमाद्भुतम् ॥ १८॥ सुस्नातः सर्वतीर्थेषु सर्वयज्ञेषु यत्फलम् । सर्वव्रतोपवासे
    च तत्फलं लभते नरः ॥ १९॥ गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः । कण्ठे वा दक्षिणे बाहौ कवचं धारयेत्तु
    यः ॥ २०॥ स च त्रैलोक्यविजयी सर्वशत्रुप्रमर्दकः । इदं कवचमज्ञात्वा भजेद्दुर्गतिनाशिनीम् ॥ २१॥ शतलक्षं
    प्रजप्तोऽपि न मन्त्रः सिद्धिदायकः ॥ २२॥ कवचं काण्वशाखोक्तमुक्तं नारद सिद्धिदम् । यस्मै कस्मै न दातव्यं
    गोपनीयं सुदुर्लभम् ॥ २३॥ इति श्रीब्रह्मवैवर्तपुराणे गणपतिखण्डे एकोनचत्वारिंशाध्यायान्तर्गतं दुर्गतिनाशिनीकवचं
    समाप्तम् । ब्रह्मवैवर्तपुराण । गणपतिखण्ड । अध्याय ३९
