id: bhartruhari-sataka-trisati-srungaara-satakam
category: stotram
name:
  english: Bhartruhari Sataka Trisati - Srungaara Satakam
content:
  english: shambhusvayambhuharayo harinekshananam yenakriyanta satatam grihakumbhadasah | vacam agocaracaritravicitritaya
    tasmai namo bhagavate makaradhvajaya || || smitena bhavena ca lajjaya bhiya paranmukhairardhakatakshavikshanaih
    | vacobhirirshyakalahena lilaya samastabhavaih khalu bandhanam striyah || || bhrucaturyatkuncitakshah
    katakshah snigdha vaco lajjitantashca hasah | lilamandam prasthitam ca sthitam ca strinam etadbhushanam
    cayudham ca || || kvacitsabhrubhangaih kvacidapi ca lajjaparigataih kvacidbhuritrastaih kvacidapi
    ca lilavilalitaih | kumarinam etairmadanasubhagairnetravalitaih sphurannilabjanam prakaraparikirna
    iva dishah || || vaktram candravikasi pankajaparihasakshame locane varnah svarnam apakarishnuralinijishnuh
    kacanam cayah | vakshojavibhakumbhavibhramaharau gurvi nitambasthali vacam hari ca mardavam yuvatishu
    svabhavikam mandanam || || smitakincinmugdham saralataralo drishtivibhavah parispando vacam abhinavavilasoktisarasah
    | gatanam arambhah kisalayitalilaparikarah sprishantyastarunyam kim iva na hi ramyam mrigadrishah
    || || drashtavyeshu kim uttamam mrigadrishah premaprasannam mukham ghratavyeshvapi kim tad asyapavanah
    shravyeshu kim tadvacah | kim svadyeshu tad oshthapallavarasah sprishyeshu kim tadvapurdhyeyam kim
    navayauvane sahridayaih sarvatra tadvibhramah || || etashcaladvalayasamhatimekhalotthajhankara nupuraparajitarajahamsyah
    | kurvanti kasya na mano vivasham tarunyo vitrastamugdhaharinisadrishaih katakshaih || || kunkumapankakalankitadeha
    gaurapayodharakampitahara | nupurahamsaranatpadma kam na vashikurute bhuvi rama || || nunam hi te
    kavivara viparitavaco ye nityam ahurabala iti kaministah | yabhirvilolitaratarakadrishtipataih shakradayo'pi
    vijitastvabalah katham tah || || nunam ajnakarastasyah subhruvo makaradhvajah | yatastannetrasancarasuciteshu
    pravartate || || keshah samyaminah shruterapi param param gate locane antarvaktram api svabhavashucibhih
    kirnam dvijanam ganaih | muktanam satatadhivasarucirau vakshojakumbhavimavittham tanvi vapuh prashantam
    api teragam karotyeva nah || || mugdhe dhanushkata keyam apurva tvayi drishyate | yaya vidhyasi cetamsi
    gunaireva na sayakaih || || sati pradipe satyagnau satsu tararavindushu | vina me mrigashavakshya
    tamobhutam idam jagat || || udvrittah stanabhara esha tarale netre cale bhrulate ragadhishthitam oshthapallavam
    idam kurvantu nama vyatham | saubhagyaksharamalikeva likhita pushpayudhena svayam madhyasthapi karoti
    tapam adhikam romavalih kena sa || || mukhena candrakantena mahanilaih shiroruhaih | karabhyam padmaragabhyam
    reje ratnamayiva sa || || guruna stanabharena mukhacandrena bhasvata | shanaishcarabhyam padabhyam
    reje grahamayiva sa || || tasyah stanau yadi ghanau jaghanam ca hari vaktram ca caru tava citta kim
    akulatvam | punyam kurushva yadi teshu tavasti vancha punyairvina na hi bhavanti samihitarthah ||
    || ime tarunyashrinavaparimalah praudhasuratapratapa prarambhah smaravijayadanapratibhuvah | ciram
    cetashcora abhinavavikaraikaguravo vilasavyaparah kim api vijayante mrigadrisham || || pranayamadhurah
    premodgara rasashrayatam gatah phanitimadhura mugdhaprayah prakashitasammadah | prakritisubhaga visrambhardrah
    smarodayadayino rahasi kim api svairalapa haranti mrigidrisham || || vishramya vishramya vanadrumanam
    chayasu tanvi vicacara kacit | stanottariyena karoddhritena nivarayanti shashino mayukhan || || adarshane
    darshanamatrakama drishtva parishvangasukhaikalola | alingitayam punarayatakshyamashasmahe vigrahayorabhedam
    || || malati shirasi jrimbhanam mukhe candanam vapushi kunkumavilam | vakshasi priyatama madalasa
    svarga esha parishishta agamah || || pranmam eti managanagatarasam jatabhilasham tatah savridam tadanu
    shlathodyamam atha pradhvastadhairyam punah | premardram sprihaniyanirbhararahah kridapragalbham tato
    nihsangangavikarshanadhikasukharamyam kulastriratam || || urasi nipatitanam srastadhammillakanam mukulitanayananam
    kincid unmilitanam | upari suratakhedasvinnagandasthalanamadhara madhu vadhunam bhagyavantah pibanti
    || || amilitanayananam yah surataraso'nu samvidam bhati | mithurairmitho'vadharitamavitatham idam
    eva kamanirbarhanam || || idam anucitam akramashca pumsam yadiha jarasvapi manmatha vikarah | tadapi
    ca na kritam nitambininam stanapatanavadhi jivitam ratam va || || rajastrishnamburasherna hi jagati
    gatah kashcidevavasanam ko vartho'rthaih prabhutaih svavapushi galite yauvane sanurage | gacchamah
    sadma yavadvikasitanayanendivaralokininamakramyakramya rupam jhatiti na jaraya lupyate preyasinam
    || || ragasyagaram ekam narakashatamahaduhkhasampraptiheturmohasyotpatti bijam jaladharapatalam jnanataradhipasya
    | kandarpasyaikamitram prakatitavividhaspashtadoshaprabandham loke'sminna hyarthavrajakulabhavanayauvanadanyadasti
    || || shringaradrumanirade prasrimarakridarasasrotasi pradyumnapriyabandhave caturavanmuktaphalodanvati
    | tanvinetracakorapavanavidhau saubhagyalakshminidhau dhanyah ko'pi na vikriyam kalayati prapte nave
    yauvane || || samsare'sminnasare kunripatibhavanadvarasevakalankavyasanga vyastadhairyam katham amaladhiyo
    manasam samvidadhyuh | yadyetah prodyad indudyutinicayabhrito na syurambhojanetrah prenkhatkancikalapah
    stanabharavinamanmadhyabhajastarunyah || || siddhadhyasitakandare haravrishaskandhavarugnadrume gangadhautashilatale
    himavatah sthane sthite shreyasi | kah kurvita shirah pranamamalinam mlanam manasvi jano yadvitrastakurangashavanayana
    na syuh smarastram striyah || || samsara tava paryantapadavi na daviyasi | antara dustara na syuryadi
    te madirekshanam || || disha vanaharinibhyo vamshakandacchavinam kavalam upalakoticchinnamulam kushanam
    | shakayuvatikapolapandutambulavallidalam arunanakhagraih patitam va vadhubhyah || || asarah sarve
    te virativirasah papavishaya jugupsyantam yadva nanu sakaladoshaspadam iti | tathapyetadbhumau nahi
    parahitatpunyam adhikam na casminsamsare kuvalayadrisho ramyam aparam || || etatkamaphalo loke yaddvayorekacittata
    | anyacittakrite kame shavayoriva sangamah || || matsaryam utsarya vicarya karyamaryah samaryadam
    idam vadantu | sevya nitambah kim u bhudharanamuta smarasmeravilasininam || || samsare svapnasare
    parinatitarale dve gati panditanam tattvajnanamritambhahplavalalitadhiyam yatu kalah kathancit | no
    cenmugdhangananam stanajaghanaghanabhogasambhogininam sthulopasthasthalishu sthagitakaratalasparshalilodyamanam
    || || avasah kriyatam gange papaharini varini | stanadvaye tarunya va manoharini harini || || kim
    iha bahubhiruktairyuktishunyaih pralapairdvayam iha purushanam sarvada sevaniyam | abhinavamadalilalalasam
    sundarinam stanabharaparikhinnam yauvanam va vanam va || || satyam jana vacmi na pakshapatal lokeshu
    saptasvapi tathyam etat | nanyanmanohari nitambinibhyo duhkhaikaheturna ca kashcidanyah || || kantetyutpalalocaneti
    vipulashronibharetyunnamatpinottunga payodhareti sumukhambhojeti subhruriti | drishtva madyati modate'bhiramate
    prastauti vidvanapi pratyakshashucibhastrikam striyam aho mohasya dushceshtitam || || smrita bhavati
    tapaya drishta conmadakarini | sprishta bhavati mohaya sa nama dayita katham || || tavadevamritamayi
    yavallocanagocara | cakshushpathadatita tu vishadapyatiricyate || || namritam na visham kincidetam
    muktva nitambinim | saivamritalata rakta virakta vishavallari || || avartah samshayanam avinayabhuvanam
    pattanam sahasanam doshanam sannidhanam kapatashatamayam kshetram apratyayanam | svargadvarasya vighno
    narakapuramukham sarvamayakarandam striyantram kena srishtam visham amritamayam pranilokasya pashah
    || || no satyena mriganka esha vadanibhuto na cendivaradvandvam locanatam gata na kanakairapyangayashtih
    krita | kintvevam kavibhih prataritamanastattvam vijanannapi tvanmamsasthimayam vapurmrigadrisham
    mando janah sevate || || lilavatinam sahaja vilasasta eva mudhasya hridi sphuranti | rago nalinya
    hi nisargasiddhastatra bhramatyeva vritha shad || sammohayanti madayanti vidambayanti nirbhartsayanti
    ramayanti vishadayanti | etah pravishya sadayam hridayam naranam kim nama vamanayana na samacaranti
    || || yadetatpurnendudyutiharam udarakriti param mukhabjam tanvangyah kila vasati yatradharamadhu
    | idam tatkim pakadrumaphalam idanim atirasam vyatite'smin kale visham iva bhavishyatyasukhadam ||
    || unmilattrivalitaranganilaya prottungapinastanadvandvenodgata cakravakayugala vaktrambujodbhasini
    | kantakaradhara nadiyam abhitah kruratra napekshate samsararnavamajjanam yadi tada durena santyajyatam
    || || jalpanti sardham anyena pashyantyanyam savibhramah | hridgatam cintayantyanyam priyah ko nama
    yoshitam || || madhu tishthati vaci yoshitam hridi halahalam eva kevalam | ata eva nipiyate'dharo
    hridayam mushtibhireva tadyate || || apasara sakhe duradasmatkatakshavishanalat prakritivishamadyoshitsarpadvilasaphanabhritah
    | itaraphanina dashtah shakyashcikitsitum aushadhaishcatur vanitabhogigrastam hi mantrinah || || vistaritam
    makaraketanadhivarena strisanjnitam badisham atra bhavamburashau | yenacirattad adharamishalolamartya
    matsyanvikrishya vipacatyanuragavahnau || || kaminikayakantare kucaparvatadurgame | ma sancara manah
    pantha tatraste smarataskarah || || vyadirghena calena vakragatina tejasvina bhogina nilabjadyutina'hina
    varam aham dashto na taccakshusha | dashte santi cikitsaka dishi dishi prayena dhanarthino mugdhakshikshanavikshitasya
    na hi me vaidyo na capyaushadham || || iha hi madhuragitam nrityam etadraso'yam sphurati parimalo'sau
    sparsha esha stananam | iti hataparamarthairindriyairbhramyamanah svahitakaranadhurtaih pancabhirvancito'smi
    || || na gamyo mantranam na ca bhavati bhaishajyavishayo na capi pradhvamsam vrajati vividhaih shantikashataih
    | bhramaveshadange kam api vidadhadbhangam asakrit smarapasmaro'yam bhramayati drisham ghurnayati
    ca || andhaya ca durmukhaya ca jarajirnakhilangaya ca graminaya ca dushkulaya ca galatkushthabhibhutaya
    ca | yacchantishu manoharam nijavapulakshmilavashraddhaya panyastrishu vivekakalpalatikashastrishu
    rajyeta kah || || veshyasau madanajvala rupendhanavivardhita | kamibhiryatra huyante yauvanani dhanani
    ca || || kashcumbati kulapurusho veshyadharapallavam manojnam api | carabhatacoracetakanatavitanishthivanasharavam
    || || dhanyasta eva dhavalayatalocananam tarunyadarpaghanapinapayodharanam | kshamodaropari lasattrivalilatanam
    drishtvakritim vikritim eti mano na yesham || || bale lilamukulitam ami manthara drishtipatah kim
    kshipyante viramavirama vyartha esha shramaste | sampratyanye vayam uparatam balyam astha vanante
    kshino mohastrinam iva jagajjalam alokayamah || || iyam bala mam pratyanavaratam indivaradala prabhacoram
    cakshuh kshipati kim abhipretam anaya | gato moho'smakam smarashabarabanavyatikarajvara jvala shanta
    tadapi na varaki viramati || || kim kandarpa karam kadarthayasi re kodandatankaritam re re kokila
    komalam kalaravam kim va vritha jalpasi | mugdhe snigdhavidagdhacarumadhurairlolaih katakshairalam
    cetashcumbitacandracudacaranadhyanamritam vartate || || virahe'pi sangamah khalu parasparam sangatam
    mano yesham | hridayam api vighattitam cet sangi viraham visheshayati || || kim gatena yadi sa na
    jivati praniti priyatama tathapi kim | ityudikshya navameghamalikam na prayati pathikah svamandiram
    || || viramata budha yoshitsangatsukhatkshanabhangurat kuruta karunamaitriprajnavadhujanasangamam
    | na khalu narake harakrantam ghanastanamandalam sharanam athava shronibimbam rananmanimekhalam ||
    || yada yogabhyasavyasanakrishayoratmamanasoravicchinna maitri sphurati kritinastasya kim u taih |
    priyanam alapairadharamadhubhirvaktravidhubhih sanishvasamodaih sakucakalashashleshasurataih || ||
    yadasidajnanam smaratimirasancarajanitam tada drishtanarimayam idam ashesham jagaditi | idanim asmakam
    patutaravivekanjanajusham samibhuta drishtistribhuvanam api brahma manute || || tavadeva kritinam
    api sphuratyesha nirmalavivekadipakah | yavadeva na kurangacakshusham tadyate catulalocanancalaih
    || || vacasi bhavati sangatyagam uddishya varta shrutimukharamukhanam kevalam panditanam | jaghanam
    arunaratnagranthikancikalapam kuvalayanayananam ko vihatum samarthah || || svaparapratarako'sau nindati
    yo'likapandito yuvatih | yasmattapaso'pi phalam svargah svarge'pi capsarasah || || mattebhakumbhadalane
    bhuvi santi dhirah kecitpracandamrigarajavadhe'pi dakshah | kintu bravimi balinam puratah prasahya
    kandarpadarpadalane virala manushyah || || sanmarge tavadaste prabhavati ca narastavadevendriyanam
    lajjam tavadvidhatte vinayam api samalambate tavadeva | bhrucapakrishtamuktah shravanapathagata nilapakshmana
    ete yavallilavatinam hridi na dhritimusho drishtibanah patanti || || unmattapremasamrambhad arabhante
    yad anganah | tatra pratyuham adhatum brahmapi khalu katarah || || tavanmahattvam pandityam kulinatvam
    vivekita | yavajjvalati nangeshu hatah panceshupavakah || || shastrajno'pi prathitavinayo'pyatmabodho'pi
    badham samsare'sminbhavati viralo bhajanam sadgatinam | yenaitasminnirayanagaradvaram udghatayanti
    vamakshinam bhavati kutila bhrulata kuncikeva || || krishah kanah khanjah shravanarahitah pucchavikalo
    vrani puyaklinnah krimikulashatairavritatanuh | kshudha kshamo jirnah pitharakakapalarpitagalah shunim
    anveti shva hatam api ca hantyeva madanah || || strimudram kusumayudhasya jayinim sarvarthasampatkarim
    ye mudhah pravihaya yanti kudhiyo mithyaphalanveshinah | te tenaiva nihatya nirdayataram nagnikrita
    munditah kecitpancashikhikritashca jatilah kapalikashcapare || || vishvamitraparasharaprabhritayo
    vatambuparnashanaste'pi strimukhapankajam sulalitam drishtvaiva moham gatah | shalyannam saghritam
    payodadhiyutam ye bhunjate manavastesham indriyanigraho yadi bhavedvindhyah plavetsagare || || parimalabhrito
    vatah shakha navankurakotayo madhuravirutotkantha vacah priyah pikapakshinam | viralasuratasvedodgara
    vadhuvadanendavah prasarati madhau ratryam jato na kasya gunodayah || || madhurayam madhurairapi kokila
    kalaravairmalayasya ca vayubhih | virahinah prahinasti sharirino vipadi hanta sudhapi vishayate ||
    || avasah kilakincitasya dayitaparshve vilasalasah karne kokilakaminikalaravah smero latamandapah
    | goshthi satkavibhih samam katipayairmugdhah sudhamshoh karah keshancitsukhayanti catra hridayam
    caitre vicitrah kshapah || || pantha strivirahanalahutikalam atanvati manjarimakandeshu pikanganabhiradhuna
    sotkantham alokyate | apyete navapatalaparimalapragbharapataccara vantiklantivitanatanavakritah shrikhandashailanilah
    || || prathitah pranayavatinam tavatpadam atanotu hridi manah | bhavati na yavaccandanataru surabhirmalayapavamanah
    || || sahakarakusumakesaranikara bharamodamurcchitadig ante | madhuramadhuravidhuramadhupe madhau
    bhavetkasya notkantha || || acchacchacandanarasardratara mrigakshyo dharagrihani kusumani ca kaumudi
    ca | mando marutsumanasah shuci harmyaprishtham grishme madam ca madanam ca vivardhayanti || || srajo
    hridyamoda vyajanapavanashcandrakiranah paragah kasaro malayajarajah shidhu vishadam | shucih saudhotsangah
    pratanu vasanam pankajadrisho nidagharitavetadvilasati labhante sukritinah || || sudhashubhram dhama
    sphurad amalarashmih shashadharah priyavaktrambhojam malayajarajashcatisurabhih | srajo hridyamodastadidam
    akhilam ragini jane karotyantah kshobham na tu vishayasamsargavimukhe || || taruniveshoddipitakama
    vikasajjatipushpasugandhih | unnatapinapayodharabhara pravrittanute kasya na harsham || upacitamegham
    bhumayah kandalinyo navakutajakadambamodino gandhavahah | shikhikulakalakekaravaramya vanantah sukhinam
    asukhinam va sarvam utkanthayanti || || upari ghanam ghanapatalam tiryaggirayo'pi nartitamayurah |
    kshitirapi kandaladhavala drishtim pathikah kva patayati || || ito vidyudvallivilasitam itah ketakitaroh
    sphurangandhah prodyajjaladaninadasphurjitam itah | itah kekikridakalakalaravah pakshmaladrisham katham
    yasyantyete virahadivasah sambhritarasah || || asucisancare tamasi nabhasi praudhajaladadhvanipraye
    tasmin patati drishadam niranicaye | idam saudaminyah kanakakamaniyam vilasitam mudam ca glanim ca
    prathayati pathishveva sudrisham || || asarena na harmyatah priyatamairyatum bahih shakyate shitotkampanimittam
    ayatadrisha gadham samalingyate | jatah shikarashitalashca marutoratyantakhedacchido dhanyanam bata
    durdinam sudinatam yati priyasangame || || ardham suptva nishayah sarabhasasuratayasasannashlathangaprodbhutasahya
    trishno madhumadanirato harmyaprishthe vivikte | sambhogaklantakantashithilabhujalatavarjitam karkarito
    jyotsnabhinnacchadharam pibati na salilam sharadam mandapunyah || || hemante dadhidugdhasarpirashana
    manjishthavasobhritah kashmiradravasandradigdhavapushashchinna vicitrai rataih | vrittorustanakaminijanakritashlesha
    grihabhyantare tambulidalapugapuritamukha dhanyah sukham sherate || || prodyatpraudhapriyangudyutibhriti
    vikasatkundamadyaddvirephe kale praleyavatapracalavilasitodaramandaradhamni | yesham no kanthalagna
    kshanam api tuhinakshodadaksha mrigakshi tesham ayamayama yamasadanasama yamini yati yunam || || cumbanto
    gandabhittiralakavati mukhe sitkritanyadadhana vakshahsutkancukeshu stanabharapulakodbhedam apadayantah
    | urunakampayantah prithujaghanatatatsramsayanto'mshukani vyaktam kantajananam vitacaritabhritah shaishira
    vanti vatah || || keshanakulayandrisho mukulayanvaso baladakshipannatanvan pulakodgamam prakatayannavegakampam
    shanaih | varam varam udarasitkritakrito dantacchadanpidayan prayah shaishira esha samprati marutkantasu
    kantayate || || yadyasya nasti ruciram tasmimstasya spriha manojne'pi | ramaniye'pi sudhamshau na
    manahkamah sarojinyah || || vairagye sancaratyeko nitau bhramati caparah | shringare ramate kashcidbhuvi
    bhedah parasparam ||
  devanagari: शम्भुस्वयम्भुहरयो हरिणेक्षणानां येनाक्रियन्त सततं गृहकुम्भदासाः । वाचां अगोचरचरित्रविचित्रिताय
    तस्मै नमो भगवते मकरध्वजाय ॥ ॥ स्मितेन भावेन च लज्जया भिया पराण्मुखैरर्धकटाक्षवीक्षणैः । वचोभिरीर्ष्याकलहेन
    लीलया समस्तभावैः खलु बन्धनं स्त्रियः ॥ ॥ भ्रूचातुर्यात्कुञ्चिताक्षाः कटाक्षाः स्निग्धा वाचो लज्जितान्ताश्च
    हासाः । लीलामन्दं प्रस्थितं च स्थितं च स्त्रीणां एतद्भूषणं चायुधं च ॥ ॥ क्वचित्सभ्रूभङ्गैः क्वचिदपि
    च लज्जापरिगतैः क्वचिद्भूरित्रस्तैः क्वचिदपि च लीलाविललितैः । कुमारीणां एतैर्मदनसुभगैर्नेत्रवलितैः
    स्फुरन्नीलाब्जानां प्रकरपरिकीर्णा इव दिशः ॥ ॥ वक्त्रं चन्द्रविकासि पङ्कजपरीहासक्षमे लोचने वर्णः स्वर्णं
    अपाकरिष्णुरलिनीजिष्णुः कचानां चयः । वक्षोजाविभकुम्भविभ्रमहरौ गुर्वी नितम्बस्थली वाचां हारि च मार्दवं
    युवतीषु स्वाभाविकं मण्डनम् ॥ ॥ स्मितकिञ्चिन्मुग्धं सरलतरलो दृष्टिविभवः परिस्पन्दो वाचां अभिनवविलासोक्तिसरसः
    । गतानां आरम्भः किसलयितलीलापरिकरः स्पृशन्त्यास्तारुण्यं किं इव न हि रम्यं मृगदृशः ॥ ॥ द्रष्टव्येषु
    किं उत्तमं मृगदृशः प्रेमप्रसन्नं मुखं घ्रातव्येष्वपि किं तद् आस्यपवनः श्रव्येषु किं तद्वचः । किं स्वाद्येषु
    तद् ओष्ठपल्लवरसः स्पृश्येषु किं तद्वपुर्ध्येयं किं नवयौवने सहृदयैः सर्वत्र तद्विभ्रमाः ॥ ॥ एताश्चलद्वलयसंहतिमेखलोत्थझङ्कार
    नूपुरपराजितराजहंस्यः । कुर्वन्ति कस्य न मनो विवशं तरुण्यो वित्रस्तमुग्धहरिणीसदृशैः कटाक्षैः ॥ ॥ कुङ्कुमपङ्ककलङ्कितदेहा
    गौरपयोधरकम्पितहारा । नूपुरहंसरणत्पद्मा कं न वशीकुरुते भुवि रामा ॥ ॥ नूनं हि ते कविवरा विपरीतवाचो ये
    नित्यं आहुरबला इति कामिनीस्ताः । याभिर्विलोलितरतारकदृष्टिपातैः शक्रादयोऽपि विजितास्त्वबलाः कथं ताः
    ॥ ॥ नूनं आज्ञाकरस्तस्याः सुभ्रुवो मकरध्वजः । यतस्तन्नेत्रसञ्चारसूचितेषु प्रवर्तते ॥ ॥ केशाः संयमिनः
    श्रुतेरपि परं पारं गते लोचने अन्तर्वक्त्रं अपि स्वभावशुचिभीः कीर्णं द्विजानां गणैः । मुक्तानां सतताधिवासरुचिरौ
    वक्षोजकुम्भाविमावित्थं तन्वि वपुः प्रशान्तं अपि तेरागं करोत्येव नः ॥ ॥ मुग्धे धानुष्कता केयं अपूर्वा
    त्वयि दृश्यते । यया विध्यसि चेतांसि गुणैरेव न सायकैः ॥ ॥ सति प्रदीपे सत्यग्नौ सत्सु तारारवीन्दुषु
    । विना मे मृगशावाक्ष्या तमोभूतं इदं जगत् ॥ ॥ उद्वृत्तः स्तनभार एष तरले नेत्रे चले भ्रूलते रागाधिष्ठितं
    ओष्ठपल्लवं इदं कुर्वन्तु नाम व्यथाम् । सौभाग्याक्षरमालिकेव लिखिता पुष्पायुधेन स्वयं मध्यस्थापि करोति
    तापं अधिकं रोमावलिः केन सा ॥ ॥ मुखेन चन्द्रकान्तेन महानीलैः शिरोरुहैः । कराभ्यां पद्मरागाभ्यां रेजे
    रत्नमयीव सा ॥ ॥ गुरुणा स्तनभारेण मुखचन्द्रेण भास्वता । शनैश्चराभ्यां पादाभ्यां रेजे ग्रहमयीव सा ॥
    ॥ तस्याः स्तनौ यदि घनौ जघनं च हारि वक्त्रं च चारु तव चित्त किं आकुलत्वम् । पुण्यं कुरुष्व यदि तेषु
    तवास्ति वाञ्छा पुण्यैर्विना न हि भवन्ति समीहितार्थाः ॥ ॥ इमे तारुण्यश्रीनवपरिमलाः प्रौढसुरतप्रताप
    प्रारम्भाः स्मरविजयदानप्रतिभुवः । चिरं चेतश्चोरा अभिनवविकारैकगुरवो विलासव्यापाराः किं अपि विजयन्ते
    मृगदृशाम् ॥ ॥ प्रणयमधुराः प्रेमोद्गारा रसाश्रयतां गताः फणितिमधुरा मुग्धप्रायाः प्रकाशितसम्मदाः । प्रकृतिसुभगा
    विस्रम्भार्द्राः स्मरोदयदायिनो रहसि किं अपि स्वैरालापा हरन्ति मृगीदृशाम् ॥ ॥ विश्रम्य विश्रम्य वनद्रुमाणां
    छायासु तन्वी विचचार काचित् । स्तनोत्तरीयेण करोद्धृतेन निवारयन्ती शशिनो मयूखान् ॥ ॥ अदर्शने दर्शनमात्रकामा
    दृष्ट्वा परिष्वङ्गसुखैकलोला । आलिङ्गितायां पुनरायताक्ष्यामाशास्महे विग्रहयोरभेदम् ॥ ॥ मालती शिरसि
    जृम्भणं मुखे चन्दनं वपुषि कुङ्कुमाविलम् । वक्षसि प्रियतमा मदालसा स्वर्ग एष परिशिष्ट आगमः ॥ ॥ प्राङ्मां
    एति मनागनागतरसं जाताभिलाषं ततः सव्रीडं तदनु श्लथोद्यमं अथ प्रध्वस्तधैर्यं पुनः । प्रेमार्द्रं स्पृहणीयनिर्भररहः
    क्रीडाप्रगल्भं ततो निःसङ्गाङ्गविकर्षणाधिकसुखरम्यं कुलस्त्रीरतम् ॥ ॥ उरसि निपतितानां स्रस्तधम्मिल्लकानां
    मुकुलितनयनानां किञ्चिद् उन्मीलितानाम् । उपरि सुरतखेदस्विन्नगण्डस्थलानामधर मधु वधूनां भाग्यवन्तः पिबन्ति
    ॥ ॥ आमीलितनयनानां यः सुरतरसोऽनु संविदं भाति । मिथुरैर्मिथोऽवधारितमवितथम् इदं एव कामनिर्बर्हणम् ॥ ॥
    इदं अनुचितं अक्रमश्च पुंसां यदिह जरास्वपि मन्मथा विकाराः । तदपि च न कृतं नितम्बिनीनां स्तनपतनावधि
    जीवितं रतं वा ॥ ॥ राजस्तृष्णाम्बुराशेर्न हि जगति गतः कश्चिदेवावसानं को वार्थोऽर्थैः प्रभूतैः स्ववपुषि
    गलिते यौवने सानुरागे । गच्छामः सद्म यावद्विकसितनयनेन्दीवरालोकिनीनामाक्रम्याक्रम्य रूपं झटिति न जरया
    लुप्यते प्रेयसीनाम् ॥ ॥ रागस्यागारं एकं नरकशतमहादुःखसम्प्राप्तिहेतुर्मोहस्योत्पत्ति बीजं जलधरपटलं
    ज्ञानताराधिपस्य । कन्दर्पस्यैकमित्रं प्रकटितविविधस्पष्टदोषप्रबन्धं लोकेऽस्मिन्न ह्यर्थव्रजकुलभवनयौवनादन्यदस्ति
    ॥ ॥ शृङ्गारद्रुमनीरदे प्रसृमरक्रीडारसस्रोतसि प्रद्युम्नप्रियबान्धवे चतुरवाङ्मुक्ताफलोदन्वति । तन्वीनेत्रचकोरपावनविधौ
    सौभाग्यलक्ष्मीनिधौ धन्यः कोऽपि न विक्रियां कलयति प्राप्ते नवे यौवने ॥ ॥ संसारेऽस्मिन्नसारे कुनृपतिभवनद्वारसेवाकलङ्कव्यासङ्ग
    व्यस्तधैर्यं कथं अमलधियो मानसं संविदध्युः । यद्येताः प्रोद्यद् इन्दुद्युतिनिचयभृतो न स्युरम्भोजनेत्राः
    प्रेङ्खत्काञ्चीकलापाः स्तनभरविनमन्मध्यभाजस्तरुण्यः ॥ ॥ सिद्धाध्यासितकन्दरे हरवृषस्कन्धावरुग्णद्रुमे
    गङ्गाधौतशिलातले हिमवतः स्थाने स्थिते श्रेयसि । कः कुर्वीत शिरः प्रणाममलिनं म्लानं मनस्वी जनो यद्वित्रस्तकुरङ्गशावनयना
    न स्युः स्मरास्त्रं स्त्रियः ॥ ॥ संसार तव पर्यन्तपदवी न दवीयसी । अन्तरा दुस्तरा न स्युर्यदि ते मदिरेक्षणाम्
    ॥ ॥ दिश वनहरिणीभ्यो वंशकाण्डच्छवीनां कवलं उपलकोटिच्छिन्नमूलं कुशानाम् । शकयुवतिकपोलापाण्डुताम्बूलवल्लीदलम्
    अरुणनखाग्रैः पाटितं वा वधूभ्यः ॥ ॥ असाराः सर्वे ते विरतिविरसाः पापविषया जुगुप्स्यन्तां यद्वा ननु सकलदोषास्पदं
    इति । तथाप्येतद्भूमौ नहि परहितात्पुण्यं अधिकं न चास्मिन्संसारे कुवलयदृशो रम्यं अपरम् ॥ ॥ एतत्कामफलो
    लोके यद्द्वयोरेकचित्तता । अन्यचित्तकृते कामे शवयोरिव सङ्गमः ॥ ॥ मात्सर्यं उत्सार्य विचार्य कार्यमार्याः
    समर्यादं इदं वदन्तु । सेव्या नितम्बाः किं उ भूधराणामुत स्मरस्मेरविलासिनीनाम् ॥ ॥ संसारे स्वप्नसारे
    परिणतितरले द्वे गती पण्डितानां तत्त्वज्ञानामृताम्भःप्लवललितधियां यातु कालः कथञ्चित् । नो चेन्मुग्धाङ्गनानां
    स्तनजघनघनाभोगसम्भोगिनीनां स्थूलोपस्थस्थलीषु स्थगितकरतलस्पर्शलीलोद्यमानाम् ॥ ॥ आवासः क्रियतां गाङ्गे
    पापहारिणि वारिणि । स्तनद्वये तरुण्या वा मनोहारिणि हारिणि ॥ ॥ किं इह बहुभिरुक्तैर्युक्तिशून्यैः प्रलापैर्द्वयम्
    इह पुरुषाणां सर्वदा सेवनीयम् । अभिनवमदलीलालालसं सुन्दरीणां स्तनभरपरिखिन्नं यौवनं वा वनं वा ॥ ॥ सत्यं
    जना वच्मि न पक्षपाताल् लोकेषु सप्तस्वपि तथ्यं एतत् । नान्यन्मनोहारि नितम्बिनीभ्यो दुःखैकहेतुर्न च
    कश्चिदन्यः ॥ ॥ कान्तेत्युत्पललोचनेति विपुलश्रोणीभरेत्युन्नमत्पीनोत्तुङ्ग पयोधरेति सुमुखाम्भोजेति सुभ्रूरिति
    । दृष्ट्वा माद्यति मोदतेऽभिरमते प्रस्तौति विद्वानपि प्रत्यक्षाशुचिभस्त्रिकां स्त्रियं अहो मोहस्य दुश्चेष्टितम्
    ॥ ॥ स्मृता भवति तापाय दृष्टा चोन्मादकारिणी । स्पृष्टा भवति मोहाय सा नाम दयिता कथम् ॥ ॥ तावदेवामृतमयी
    यावल्लोचनगोचरा । चक्षुष्पथादतीता तु विषादप्यतिरिच्यते ॥ ॥ नामृतं न विषं किञ्चिदेतां मुक्त्वा नितम्बिनीम्
    । सैवामृतलता रक्ता विरक्ता विषवल्लरी ॥ ॥ आवर्तः संशयानां अविनयभुवनं पट्टणं साहसानां दोषाणां सन्निधानं
    कपटशतमयं क्षेत्रं अप्रत्ययानाम् । स्वर्गद्वारस्य विघ्नो नरकपुरमुखं सर्वमायाकरण्डं स्त्रीयन्त्रं केन
    सृष्टं विषं अमृतमयं प्राणिलोकस्य पाशः ॥ ॥ नो सत्येन मृगाङ्क एष वदनीभूतो न चेन्दीवरद्वन्द्वं लोचनतां
    गत न कनकैरप्यङ्गयष्टिः कृता । किन्त्वेवं कविभिः प्रतारितमनास्तत्त्वं विजानन्नपि त्वङ्मांसास्थिमयं
    वपुर्मृगदृशां मन्दो जनः सेवते ॥ ॥ लीलावतीनां सहजा विलासास्त एव मूढस्य हृदि स्फुरन्ति । रागो नलिन्या
    हि निसर्गसिद्धस्तत्र भ्रमत्येव वृथा षड् ॥ सम्मोहयन्ति मदयन्ति विडम्बयन्ति निर्भर्त्सयन्ति रमयन्ति
    विषादयन्ति । एताः प्रविश्य सदयं हृदयं नराणां किं नाम वामनयना न समाचरन्ति ॥ ॥ यदेतत्पूर्णेन्दुद्युतिहरं
    उदाराकृति परं मुखाब्जं तन्वङ्ग्याः किल वसति यत्राधरमधु । इदं तत्किं पाकद्रुमफलं इदानीं अतिरसं व्यतीतेऽस्मिन्
    काले विषं इव भविष्यत्यसुखदम् ॥ ॥ उन्मीलत्त्रिवलीतरङ्गनिलया प्रोत्तुङ्गपीनस्तनद्वन्द्वेनोद्गत चक्रवाकयुगला
    वक्त्राम्बुजोद्भासिनी । कान्ताकारधरा नदीयं अभितः क्रूरात्र नापेक्षते संसारार्णवमज्जनं यदि तदा दूरेण
    सन्त्यज्यताम् ॥ ॥ जल्पन्ति सार्धं अन्येन पश्यन्त्यन्यं सविभ्रमाः । हृद्गतं चिन्तयन्त्यन्यं प्रियः
    को नाम योषिताम् ॥ ॥ मधु तिष्ठति वाचि योषितां हृदि हालाहलं एव केवलम् । अत एव निपीयतेऽधरो हृदयं मुष्टिभिरेव
    ताड्यते ॥ ॥ अपसर सखे दूरादस्मात्कटाक्षविषानलात् प्रकृतिविषमाद्योषित्सर्पाद्विलासफणाभृतः । इतरफणिना
    दष्टः शक्यश्चिकित्सितुं औषधैश्चतुर् वनिताभोगिग्रस्तं हि मन्त्रिणः ॥ ॥ विस्तारितं मकरकेतनधीवरेण स्त्रीसञ्ज्ञितं
    बडिशं अत्र भवाम्बुराशौ । येनाचिरात्तद् अधरामिषलोलमर्त्य मत्स्यान्विकृष्य विपचत्यनुरागवह्नौ ॥ ॥ कामिनीकायकान्तारे
    कुचपर्वतदुर्गमे । मा सञ्चर मनः पान्थ तत्रास्ते स्मरतस्करः ॥ ॥ व्यादीर्घेण चलेन वक्रगतिना तेजस्विना
    भोगिना नीलाब्जद्युतिनाऽहिना वरं अहं दष्टो न तच्चक्षुषा । दष्टे सन्ति चिकित्सका दिशि दिशि प्रायेण धनार्थिनो
    मुग्धाक्षीक्षणवीक्षितस्य न हि मे वैद्यो न चाप्यौषधम् ॥ ॥ इह हि मधुरगीतं नृत्यं एतद्रसोऽयं स्फुरति
    परिमलोऽसौ स्पर्श एष स्तनानाम् । इति हतपरमार्थैरिन्द्रियैर्भ्राम्यमाणः स्वहितकरणधूर्तैः पञ्चभिर्वञ्चितोऽस्मि
    ॥ ॥ न गम्यो मन्त्राणां न च भवति भैषज्यविषयो न चापि प्रध्वंसं व्रजति विविधैः शान्तिकशतैः । भ्रमावेशादङ्गे
    कं अपि विदधद्भङ्गं असकृत् स्मरापस्मारोऽयं भ्रमयति दृशं घूर्णयति च ॥ अन्धाय च दुर्मुखाय च जराजीर्णाखिलाङ्गाय
    च ग्रामीणाय च दुष्कुलाय च गलत्कुष्ठाभिभूताय च । यच्छन्तीषु मनोहरं निजवपुलक्ष्मीलवश्रद्धया पण्यस्त्रीषु
    विवेककल्पलतिकाशस्त्रीषु रज्येत कः ॥ ॥ वेश्यासौ मदनज्वाला रूपेन्धनविवर्धिता । कामिभिर्यत्र हूयन्ते
    यौवनानि धनानि च ॥ ॥ कश्चुम्बति कुलपुरुषो वेश्याधरपल्लवं मनोज्ञं अपि । चारभटचोरचेटकनटविटनिष्ठीवनशरावम्
    ॥ ॥ धन्यास्त एव धवलायतलोचनानां तारुण्यदर्पघनपीनपयोधराणाम् । क्षामोदरोपरि लसत्त्रिवलीलतानां दृष्ट्वाकृतिं
    विकृतिं एति मनो न येषाम् ॥ ॥ बाले लीलामुकुलितं अमी मन्थरा दृष्टिपाताः किं क्षिप्यन्ते विरमविरम व्यर्थ
    एष श्रमस्ते । सम्प्रत्यन्ये वयं उपरतं बाल्यं आस्था वनान्ते क्षीणो मोहस्तृणं इव जगज्जालं आलोकयामः ॥
    ॥ इयं बाला मां प्रत्यनवरतं इन्दीवरदल प्रभाचोरं चक्षुः क्षिपति किं अभिप्रेतं अनया । गतो मोहोऽस्माकं
    स्मरशबरबाणव्यतिकरज्वर ज्वाला शान्ता तदपि न वराकी विरमति ॥ ॥ किं कन्दर्प करं कदर्थयसि रे कोदण्डटङ्कारितं
    रे रे कोकिल कोमलं कलरवं किं वा वृथा जल्पसि । मुग्धे स्निग्धविदग्धचारुमधुरैर्लोलैः कटाक्षैरलं चेतश्चुम्बितचन्द्रचूडचरणध्यानामृतं
    वर्तते ॥ ॥ विरहेऽपि सङ्गमः खलु परस्परं सङ्गतं मनो येषाम् । हृदयं अपि विघट्टितं चेत् सङ्गी विरहं विशेषयति
    ॥ ॥ किं गतेन यदि सा न जीवति प्राणिति प्रियतमा तथापि किम् । इत्युदीक्ष्य नवमेघमालिकां न प्रयाति पथिकः
    स्वमन्दिरम् ॥ ॥ विरमत बुधा योषित्सङ्गात्सुखात्क्षणभङ्गुरात् कुरुत करुणामैत्रीप्रज्ञावधूजनसङ्गमम् ।
    न खलु नरके हाराक्रान्तं घनस्तनमण्डलं शरणं अथवा श्रोणीबिम्बं रणन्मणिमेखलम् ॥ ॥ यदा योगाभ्यासव्यसनकृशयोरात्ममनसोरविच्छिन्ना
    मैत्री स्फुरति कृतिनस्तस्य किं उ तैः । प्रियाणां आलापैरधरमधुभिर्वक्त्रविधुभिः सनिश्वासामोदैः सकुचकलशाश्लेषसुरतैः
    ॥ ॥ यदासीदज्ञानं स्मरतिमिरसञ्चारजनितं तदा दृष्टनारीमयं इदं अशेषं जगदिति । इदानीं अस्माकं पटुतरविवेकाञ्जनजुषां
    समीभूता दृष्टिस्त्रिभुवनं अपि ब्रह्म मनुते ॥ ॥ तावदेव कृतिनां अपि स्फुरत्येष निर्मलविवेकदीपकः । यावदेव
    न कुरङ्गचक्षुषां ताड्यते चटुललोचनाञ्चलैः ॥ ॥ वचसि भवति सङ्गत्यागं उद्दिश्य वार्ता श्रुतिमुखरमुखानां
    केवलं पण्डितानाम् । जघनं अरुणरत्नग्रन्थिकाञ्चीकलापं कुवलयनयनानां को विहातुं समर्थः ॥ ॥ स्वपरप्रतारकोऽसौ
    निन्दति योऽलीकपण्डितो युवतीः । यस्मात्तपसोऽपि फलं स्वर्गः स्वर्गेऽपि चाप्सरसः ॥ ॥ मत्तेभकुम्भदलने
    भुवि सन्ति धीराः केचित्प्रचण्डमृगराजवधेऽपि दक्षाः । किन्तु ब्रवीमि बलिनां पुरतः प्रसह्य कन्दर्पदर्पदलने
    विरला मनुष्याः ॥ ॥ सन्मार्गे तावदास्ते प्रभवति च नरस्तावदेवेन्द्रियाणां लज्जां तावद्विधत्ते विनयं
    अपि समालम्बते तावदेव । भ्रूचापाकृष्टमुक्ताः श्रवणपथगता नीलपक्ष्माण एते यावल्लीलावतीनां हृदि न धृतिमुषो
    दृष्टिबाणाः पतन्ति ॥ ॥ उन्मत्तप्रेमसंरम्भाद् आरभन्ते यद् अङ्गनाः । तत्र प्रत्यूहं आधातुं ब्रह्मापि
    खलु कातरः ॥ ॥ तावन्महत्त्वं पाण्डित्यं कुलीनत्वं विवेकिता । यावज्ज्वलति नाङ्गेषु हतः पञ्चेषुपावकः
    ॥ ॥ शास्त्रज्ञोऽपि प्रथितविनयोऽप्यात्मबोधोऽपि बाढं संसारेऽस्मिन्भवति विरलो भाजनं सद्गतीनाम् । येनैतस्मिन्निरयनगरद्वारं
    उद्घाटयन्ती वामाक्षीणां भवति कुटिला भ्रूलता कुञ्चिकेव ॥ ॥ कृशः काणः खञ्जः श्रवणरहितः पुच्छविकलो व्रणी
    पूयक्लिन्नः कृमिकुलशतैरावृततनुः । क्षुधा क्षामो जीर्णः पिठरककपालार्पितगलः शुनीं अन्वेति श्वा हतं अपि
    च हन्त्येव मदनः ॥ ॥ स्त्रीमुद्रां कुसुमायुधस्य जयिनीं सर्वार्थसम्पत्करीं ये मूढाः प्रविहाय यान्ति
    कुधियो मिथ्याफलान्वेषिणः । ते तेनैव निहत्य निर्दयतरं नग्नीकृता मुण्डिताः केचित्पञ्चशिखीकृताश्च जटिलाः
    कापालिकाश्चापरे ॥ ॥ विश्वामित्रपराशरप्रभृतयो वाताम्बुपर्णाशनास्तेऽपि स्त्रीमुखपङ्कजं सुललितं दृष्ट्वैव
    मोहं गताः । शाल्यन्नं सघृतं पयोदधियुतं ये भुञ्जते मानवास्तेषाम् इन्द्रियनिग्रहो यदि भवेद्विन्ध्यः
    प्लवेत्सागरे ॥ ॥ परिमलभृतो वाताः शाखा नवाङ्कुरकोटयो मधुरविरुतोत्कण्ठा वाचः प्रियाः पिकपक्षिणाम् ।
    विरलसुरतस्वेदोद्गारा वधूवदनेन्दवः प्रसरति मधौ रात्र्यां जातो न कस्य गुणोदयः ॥ ॥ मधुरयं मधुरैरपि कोकिला
    कलरवैर्मलयस्य च वायुभिः । विरहिणः प्रहिणस्ति शरीरिणो विपदि हन्त सुधापि विषायते ॥ ॥ आवासः किलकिञ्चितस्य
    दयितापार्श्वे विलासालसाः कर्णे कोकिलकामिनीकलरवः स्मेरो लतामण्डपः । गोष्ठी सत्कविभिः समं कतिपयैर्मुग्धाः
    सुधांशोः कराः केषाञ्चित्सुखयन्ति चात्र हृदयं चैत्रे विचित्राः क्षपाः ॥ ॥ पान्थ स्त्रीविरहानलाहुतिकलां
    आतन्वती मञ्जरीमाकन्देषु पिकाङ्गनाभिरधुना सोत्कण्ठं आलोक्यते । अप्येते नवपाटलापरिमलप्राग्भारपाटच्चरा
    वान्तिक्लान्तिवितानतानवकृतः श्रीखण्डशैलानिलाः ॥ ॥ प्रथितः प्रणयवतीनां तावत्पदं आतनोतु हृदि मानः ।
    भवति न यावच्चन्दनतरु सुरभिर्मलयपवमानः ॥ ॥ सहकारकुसुमकेसरनिकर भरामोदमूर्च्छितदिग् अन्ते । मधुरमधुरविधुरमधुपे
    मधौ भवेत्कस्य नोत्कण्ठा ॥ ॥ अच्छाच्छचन्दनरसार्द्रतरा मृगाक्ष्यो धारागृहाणि कुसुमानि च कौमुदी च । मन्दो
    मरुत्सुमनसः शुचि हर्म्यपृष्ठं ग्रीष्मे मदं च मदनं च विवर्धयन्ति ॥ ॥ स्रजो हृद्यामोदा व्यजनपवनश्चन्द्रकिरणाः
    परागः कासारो मलयजरजः शीधु विशदम् । शुचिः सौधोत्सङ्गः प्रतनु वसनं पङ्कजदृशो निदाघऋतावेतद्विलसति लभन्ते
    सुकृतिनः ॥ ॥ सुधाशुभ्रं धाम स्फुरद् अमलरश्मिः शशधरः प्रियावक्त्राम्भोजं मलयजरजश्चातिसुरभिः । स्रजो
    हृद्यामोदास्तदिदं अखिलं रागिणि जने करोत्यन्तः क्षोभं न तु विषयसंसर्गविमुखे ॥ ॥ तरुणीवेषोद्दीपितकामा
    विकसज्जातीपुष्पसुगन्धिः । उन्नतपीनपयोधरभारा प्रावृट्तनुते कस्य न हर्षम् ॥ उपचितमेघं भूमयः कन्दलिन्यो
    नवकुटजकदम्बामोदिनो गन्धवाहाः । शिखिकुलकलकेकारावरम्या वनान्ताः सुखिनं असुखिनं वा सर्वं उत्कण्ठयन्ति
    ॥ ॥ उपरि घनं घनपटलं तिर्यग्गिरयोऽपि नर्तितमयूराः । क्षितिरपि कन्दलधवला दृष्टिं पथिकः क्व पातयति ॥
    ॥ इतो विद्युद्वल्लीविलसितं इतः केतकितरोः स्फुरन्गन्धः प्रोद्यज्जलदनिनदस्फूर्जितं इतः । इतः केकिक्रीडाकलकलरवः
    पक्ष्मलदृशां कथं यास्यन्त्येते विरहदिवसाः सम्भृतरसाः ॥ ॥ असूचीसञ्चारे तमसि नभसि प्रौढजलदध्वनिप्रये
    तस्मिन् पतति दृशदां नीरनिचये । इदं सौदामिन्याः कनककमनीयं विलसितं मुदं च ग्लानिं च प्रथयति पथिष्वेव
    सुदृशाम् ॥ ॥ आसारेण न हर्म्यतः प्रियतमैर्यातुं बहिः शक्यते शीतोत्कम्पनिमित्तं आयतदृशा गाढं समालिङ्ग्यते
    । जाताः शीकरशीतलाश्च मरुतोरत्यन्तखेदच्छिदो धन्यानां बत दुर्दिनं सुदिनतां याति प्रियासङ्गमे ॥ ॥ अर्धं
    सुप्त्वा निशायाः सरभससुरतायाससन्नश्लथाङ्गप्रोद्भूतासह्य तृष्णो मधुमदनिरतो हर्म्यपृष्ठे विविक्ते ।
    सम्भोगक्लान्तकान्ताशिथिलभुजलतावर्जितं कर्करीतो ज्योत्स्नाभिन्नाच्छधारं पिबति न सलिलं शारदं मन्दपुण्यः
    ॥ ॥ हेमन्ते दधिदुग्धसर्पिरशना माञ्जिष्ठवासोभृतः काश्मीरद्रवसान्द्रदिग्धवपुषश्छिन्ना विचित्रै रतैः
    । वृत्तोरुस्तनकामिनीजनकृताश्लेषा गृहाभ्यन्तरे ताम्बूलीदलपूगपूरितमुखा धन्याः सुखं शेरते ॥ ॥ प्रोद्यत्प्रौढप्रियङ्गुद्युतिभृति
    विकसत्कुन्दमाद्यद्द्विरेफे काले प्रालेयवातप्रचलविलसितोदारमन्दारधाम्नि । येषां नो कण्ठलग्ना क्षणं अपि
    तुहिनक्षोददक्षा मृगाक्षी तेषां आयामयामा यमसदनसमा यामिनी याति यूनाम् ॥ ॥ चुम्बन्तो गण्डभित्तीरलकवति
    मुखे सीत्कृतान्यादधाना वक्षःसूत्कञ्चुकेषु स्तनभरपुलकोद्भेदं आपादयन्तः । ऊरूनाकम्पयन्तः पृथुजघनतटात्स्रंसयन्तोऽंशुकानि
    व्यक्तं कान्ताजनानां विटचरितभृतः शैशिरा वान्ति वाताः ॥ ॥ केशानाकुलयन्दृशो मुकुलयन्वासो बलादाक्षिपन्नातन्वन्
    पुलकोद्गमं प्रकटयन्नावेगकम्पं शनैः । वारं वारं उदारसीत्कृतकृतो दन्तच्छदान्पीडयन् प्रायः शैशिर एष सम्प्रति
    मरुत्कान्तासु कान्तायते ॥ ॥ यद्यस्य नास्ति रुचिरं तस्मिंस्तस्य स्पृहा मनोज्ञेऽपि । रमणीयेऽपि सुधांशौ
    न मनःकामः सरोजिन्याः ॥ ॥ वैराग्ये सञ्चरत्येको नीतौ भ्रमति चापरः । शृङ्गारे रमते कश्चिद्भुवि भेदाः
    परस्परम् ॥
