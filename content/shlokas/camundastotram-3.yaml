id: camundastotram-3
category: stotram
name:
  english: camundastotram 3
  devanagari: चामुण्डास्तोत्रम् ३
content:
  english: camu ajnanakaryasenam viyadadisamuharupam dati dalayoraikyat | lati adatte svatmasakshatkarena
    nashayati iti camunda || arthat ajnana karmarupa tatha akashadi samuha rupa jo sena hai use apane
    atmasakshatkara ke dvara nashta karane vali |
  devanagari: चमू अज्ञानकार्यसेनां वियदादिसमूहरूपां डाति डलयोरैक्यात् । लाति आदत्ते स्वात्मसाक्षात्कारेण
    नाशयति इति चामुण्डा ॥ अर्थात् अज्ञान कर्मरूप तथा आकाशादि समूह रूप जो सेना है उसे अपने आत्मसाक्षात्कार
    के द्वारा नष्ट करने वाली ।
meaning: {}
