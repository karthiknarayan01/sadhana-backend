    ताम्रधरा ॐ स्त्रीं तरणिः ऐं रणाश्रिता । ॐ श्रीं तरणिदीप्ता च ऐं सौः नौः क्लीं च नाविका ॥ १३१॥ ॐ श्रीं
    नम्रा ह्सौः नीतिः ॐ क्लीं सौः नम्रकन्धरा । ॐ ऐं सौः नारसिंही च ॐ श्रीं नारायणी तथा ॥ १३२॥ ॐ क्लीं
    नन्दनकुञ्जस्था ॐ श्रीं बन्दिस्तुता तथा । ॐ आनन्दमयी क्लीं सौः ॐ श्रीं आत्मगति तथा ॥ १३३॥ ॐ क्लीं आर्ता
    ह्सौः आद्या ॐ श्रीं ईज्या क्ष्मीं स्त्रुतिः । ॐ श्रीं सामगता ऐं सौः साम्या क्लीं सामगायिनी ॥ १३४॥
    ॐ श्रीं सनकसेव्या च श्रीं ह्रीं श्रीं सभया तथा । ॐ ऐं सौः स्वगतिः स्वाहा ॐ श्रीं सागरसम्भवा ॥ १३५॥
    ॐ स्त्रीं श्रीं द्रुतगा स्वाहा ॐ वां वेदश्रुतिस्तथा । ॐ ऐं सौः वारुणी स्वाहा श्रीं ह्रीं श्रीं वरुणार्चिता
