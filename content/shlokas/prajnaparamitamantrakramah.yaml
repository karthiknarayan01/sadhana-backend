id: prajnaparamitamantrakramah
category: mantra
name:
  english: prajnaparamitamantrakramah
  devanagari: प्रज्नापारमितामन्त्रक्रमः
content:
  english: karanyasah | om gate angushthabhyam namah | om gate tarjanibhyam namah | om paragate madhyamabhyam
    namah | om parasangate anamikabhyam namah | om bodhi kanishthikabhyam namah | om svaha karatalakaraprishthabhyam
    namah || shadanganyasah | om gate hridayaya namah | om gate shirase svaha | om paragate shikhayai
    vashat | om parasangate kavacaya hum | om bodhi netratrayaya vaushat | om svaha astraya phat || matrikanyasah
    | am am im im um um rim rim lim lim em aim om aum am ah | kam kham gam gham nam | cam cham jam jham
    nam | tam tham dam dham nam | tam tham dam dham nam | pam pham bam bham mam | yam ram lam vam | sham
    sham sam ham ksham | sarvani bijani prajnaparamitayai samarpayami || cakranyasah | muladhare
  devanagari: करन्यासः । ॐ गते अङ्गुष्ठाभ्यां नमः । ॐ गते तर्जनीभ्यां नमः । ॐ पारगते मध्यमाभ्यां नमः ।
    ॐ पारसङ्गते अनामिकाभ्यां नमः । ॐ बोधि कनिष्ठिकाभ्यां नमः । ॐ स्वाहा करतलकरपृष्ठाभ्यां नमः ॥ षडङ्गन्यासः
    । ॐ गते हृदयाय नमः । ॐ गते शिरसे स्वाहा । ॐ पारगते शिखायै वषट् । ॐ पारसङ्गते कवचाय हुम् । ॐ बोधि नेत्रत्रयाय
    वौषट् । ॐ स्वाहा अस्त्राय फट् ॥ मातृकान्यासः । अं आं इं ईं उं ऊं ऋं ॠं ऌं ॡं एं ऐं ओं औं अं अः । कं
    खं गं घं ङम् । चं छं जं झं ञम् । टं ठं डं ढं णम् । तं थं दं धं नम् । पं फं बं भं मम् । यं रं लं वम्
    । शं षं सं हं क्षम् । सर्वाणि बीजानि प्रज्ञापारमितायै समर्पयामि ॥ चक्रन्यासः । मूलाधारे
