id: subrahmanyamulamantrastavah
category: mantra
name:
  english: subrahmanyamulamantrastavah
  devanagari: सुब्रह्मण्यमूलमन्त्रस्तवः
content:
  english: rinvatam nrinam bhaktimuktipradayakam || 1|| sarvashatrukshayakaram sarvaroganivaranam | ashtaishvaryapradam
    nityam sarvalokaikapavanam || 2|| shararanyodbhavam skandam sharanagatapalakam | sharanam tvam prapannasya
    dehi me vipulam shriyam || 3|| rajarajasakhodbhuta rajivayatalocana | ratishakotisaundarya dehi me
    vipulam shriyam || 4|| valaripramukhairvandya vallindranisutapate | varadashritalokanam dehi me vipulam
    shriyam || 5|| naradadimahayogisiddhagandharvasevita | navaviraih pujitanghre dehi me vipulam shriyam
    || 6|| bhagavan parvatisuno svaminbhaktartibhanjana | bhavatpadabjayorbhaktim dehi me vipulam shriyam
    || 7|| vasu dhanyam yashah kirtim avicchedam ca santateh | shatrunashanamadyashu dehi me vipulam shriyam
    || 8|| idam shadaksharam stotram subrahmanyasya santatam | yah pathettasya siddhyanti sampadashcintitadhikah
    || 9|| hridabje bhaktito nityam subrahmanyam smaranbudhah | yo japetpratarutthaya sarvankamanavapnuyat
    || 10|| iti kumaratantrargatam shrisubrahmanyamulamantrastavah sampurnah |
  devanagari: ृण्वतां नॄणां भक्तिमुक्तिप्रदायकम् ॥ १॥ सर्वशत्रुक्षयकरं सर्वरोगनिवारणम् । अष्टैश्वर्यप्रदं
    नित्यं सर्वलोकैकपावनम् ॥ २॥ शरारण्योद्भवं स्कन्दं शरणागतपालकम् । शरणं त्वां प्रपन्नस्य देहि मे विपुलां
    श्रियम् ॥ ३॥ राजराजसखोद्भूत राजीवायतलोचन । रतीशकोटिसौन्दर्य देहि मे विपुलां श्रियम् ॥ ४॥ वलारिप्रमुखैर्वन्द्य
    वल्लीन्द्राणीसुतापते । वरदाश्रितलोकानां देहि मे विपुलां श्रियम् ॥ ५॥ नारदादिमहायोगिसिद्धगन्धर्वसेवित
    । नववीरैः पूजिताङ्घ्रे देहि मे विपुलां श्रियम् ॥ ६॥ भगवन् पार्वतीसूनो स्वामिन्भक्तार्तिभञ्जन । भवत्पदाब्जयोर्भक्तिं
    देहि मे विपुलां श्रियम् ॥ ७॥ वसु धान्यं यशः कीर्तिं अविच्छेदं च सन्ततेः । शत्रुनाशनमद्याशु देहि मे
    विपुलां श्रियम् ॥ ८॥ इदं षडक्षरं स्तोत्रं सुब्रह्मण्यस्य सन्ततम् । यः पठेत्तस्य सिद्ध्यन्ति सम्पदश्चिन्तिताधिकाः
    ॥ ९॥ हृदब्जे भक्तितो नित्यं सुब्रह्मण्यं स्मरन्बुधः । यो जपेत्प्रातरुत्थाय सर्वान्कामानवाप्नुयात्
    ॥ १०॥ इति कुमारतन्त्रार्गतं श्रीसुब्रह्मण्यमूलमन्त्रस्तवः सम्पूर्णः ।
