id: rashtrasevikasamitiprarthana
category: stotram
name:
  english: rashtrasevikasamitiprarthana
  devanagari: राष्ट्रसेविकासमितिप्रार्थना
content:
  english: namamo vayam matribhuh punyabhustvam namamo vayam matribhuh punyabhustvam tvaya vardhitah samskritastvatsutah
    aye vatsale mangale hindubhume svayam jivitanyarpayamastvayi || 1|| namo vishvashaktyai namaste namaste
    tvaya nirmitam hindurashtram mahat prasadattavaivatra sajjah sametya samalambitum divyamargam vayam
    || 2|| samunnamitam yena rashtram na etat puro yasya namram samagram jagat tadadarshayuktam pavitram
    satitvam priyabhyah sutabhyah prayacchamba te || 3|| samutpadayasmasu shaktim sudivyam duracara
  devanagari: नमामो वयं मातृभूः पुण्यभूस्त्वाम् नमामो वयं मातृभूः पुण्यभूस्त्वां त्वया वर्धिताः संस्कृतास्त्वत्सुताः
    अये वत्सले मङ्गले हिन्दुभूमे स्वयं जीवितान्यर्पयामस्त्वयि ॥ १॥ नमो विश्वशक्त्यै नमस्ते नमस्ते त्वया
    निर्मितं हिन्दुराष्ट्रं महत् प्रसादात्तवैवात्र सज्जाः समेत्य समालम्बितुं दिव्यमार्गं वयम् ॥ २॥ समुन्नामितं
    येन राष्ट्रं न एतत् पुरो यस्य नम्रं समग्रं जगत् तदादर्शयुक्तं पवित्रं सतीत्वं प्रियाभ्यः सुताभ्यः
    प्रयच्छाम्ब ते ॥ ३॥ समुत्पादयास्मासु शक्तिं सुदिव्यां दुराचार
meaning: {}
