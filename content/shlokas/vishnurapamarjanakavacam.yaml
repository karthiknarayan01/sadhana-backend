id: vishnurapamarjanakavacam
category: kavacha
name:
  english: vishnurapamarjanakavacam
  devanagari: विष्णुरपामार्जनकवचम्
content:
  english: shrivishnurapamarjanakavacam purve narayanah patu varijakshastu dakshine | pradyumnah pashcime
    patu vasudevastathottare || 1|| aishanyam rakshatadvishnuragneyyam ca janardanah | nairrityam padmanabhastu
    vayavyam madhusudanah || 2|| urdhvam govardhanoddharta hyadharayam trivikramah | etabhyo dashadigbhyashca
    sarvatah patu keshavah || 3|| evam kritva tu digbangham vishnum sarvatra samsmaret | avyagracittah
    kurvita nyasakarmam yathavidhi || 4|| angushthagre tu govindam tarjanyam tu mahidharam | madhyamayam
    hrishikeshamanamikyam trivikramam || 5|| kanishthayam nyasedvishnum karaprishthe tu vamanam | evamevangulinyasah
    pashcadangeshu vinyaset || 6|| shikhayam keshavam nyasya murdhni narayanam nyaset | madhavam ca lalate
    tu govindam tu bhuvornyaset || 7|| cakshurmadhye nyasedvishnum karnayormadhusudanam | trivikramam
    kanthamule vamanam tu kapolayoh || 8|| nasarandhradvaye capi shridharam kalpayedbudhah | uttaroshthe
    hrishikesham padmanabham tatha'dhare || 9|| damodaram dantapanktau varaham cubuke tatha | jihvayam
    vasudevam ca talvoshcaiva gadadharam || 10|| vaikuntham karamadhye tu anantam nasikopari | dakshine
    tu bhuje vipro vinyasetpurushottamam || 11|| vame bhuje mahayogam raghavam hridi vinyaset | kukshau
    prithvidharam caiva parshvayoh keshavam nyaset || 12|| vakshahsthale madhavam ca kakshayoryogashayinam
    | pitambaram stanatate harim nabhyantu vinyaset || 13|| dakshine tu kare devam tatassankarshanam nyaset
    | vame ripuharam vidyatkatimadhye janardanam || 14|| prishthe kshitidharam vidyadacyutam skadhayorapi
    | vamakukshau varijaksham dakshine jalashayinam || 15|| svayambhuvam medhramadhye urvoshcaiva gadadharam
    | janumadhye cakradharam janghayoramritam nyaset || 16|| gulphayornarasimham ca padayoramitatvisham
    | angulishu shridhara ca padmaksham sarvasandhishu || 17|| nakheshu madhavam caiva nyasetpadatale'cyutam
    | romakupe gudakesham krishnam raktasthimajjasu || 18|| manobuddhyorahankare citte nyasya janardanam
    | acyutanantagovindanvatapittakapheshu ca || 19|| evam nyasavidhim kritva yatkaryam dvija tacchrinu
    | padamule tu devasya shankham caiva tu vinyaset || 20|| vanamalam hridi nyasya sarvadevabhipujitam
    || gadam vakshahsthale nyasya cakram caiva tu prishthatah || 21|| shrivatsamurasi nyasya pancangam
    kavacam nyaset | apadamastakam caiva vinyasetpurushottamam || 22|| evam nyasavidhim kritva sakshannarayano
    bhavet | tanurvishnumayi tasya yatkancinna sa bhasate || 23|| apamarjanako nyasassarvavyadhivinashanah
    | atmanashca parasyapi vidhiresha sanatanah || 24|| vaishnavena tu kartavyassarvasiddhipradayakah
    | vishnustadurdhvam rakshettu vaikuntho vidisho dishah || 25|| patu mam sarvato ramo dhandhi cakri
    ca keshavah | etatsamastam vinyasya pashcanyamantran prayojayet || 26|| atha mulamantrah
  devanagari: श्रीविष्णुरपामार्जनकवचम् पूर्वे नारायणः पातु वारिजाक्षस्तु दक्षिणे । प्रद्युम्नः पश्चिमे
    पातु वासुदेवस्तथोत्तरे ॥ १॥ ऐशान्यां रक्षताद्विष्णुराग्नेय्यां च जनार्दनः । नैरृत्यां पद्मनाभस्तु
    वायव्यां मधुसूदनः ॥ २॥ ऊर्ध्वं गोवर्धनोद्धर्ता ह्यधरायां त्रिविक्रमः । एताभ्यो दशदिग्भ्यश्च सर्वतः
    पातु केशवः ॥ ३॥ एवं कृत्वा तु दिग्बन्घं विष्णुं सर्वत्र संस्मरेत् । अव्यग्रचित्तः कुर्वीत न्यासकर्मं
    यथाविधि ॥ ४॥ अङ्गुष्ठाग्रे तु गोविन्दं तर्जन्यां तु महीधरम् । मध्यमायां हृषीकेशमनामिक्यां त्रिविक्रमम्
    ॥ ५॥ कनिष्ठायां न्यसेद्विष्णुं करपृष्ठे तु वामनम् । एवमेवाङ्गुलिन्यासः पश्चादङ्गेषु विन्यसेत् ॥ ६॥
    शिखायां केशवं न्यस्य मूर्ध्नि नारायणं न्यसेत् । माधवं च ललाटे तु गोविन्दं तु भुवोर्न्यसेत् ॥ ७॥ चक्षुर्मध्ये
    न्यसेद्विष्णुं कर्णयोर्मधुसूदनम् । त्रिविक्रमं कण्ठमूले वामनं तु कपोलयोः ॥ ८॥ नासारन्ध्रद्वये चापि
    श्रीधरं कल्पयेद्बुधः । उत्तरोष्ठे हृषीकेशं पद्मनाभं तथाऽधरे ॥ ९॥ दामोदरं दन्तपङ्क्तौ वाराहं चुबुके
    तथा । जिह्वायां वासुदेवं च ताल्वोश्चैव गदाधरम् ॥ १०॥ वैकुण्ठं करमध्ये तु अनन्तं नासिकोपरि । दक्षिणे
    तु भुजे विप्रो विन्यसेत्पुरुषोत्तमम् ॥ ११॥ वामे भुजे महायोगं राघवं हृदि विन्यसेत् । कुक्षौ पृथ्वीधरं
    चैव पार्श्वयोः केशवं न्यसेत् ॥ १२॥ वक्षःस्थले माधवं च कक्षयोर्योगशायिनम् । पीताम्बरं स्तनतटे हरिं
    नाभ्यान्तु विन्यसेत् ॥ १३॥ दाक्षिणे तु करे देवं ततस्सङ्कर्षणं न्यसेत् । वामे रिपुहरं विद्यात्कटिमध्ये
    जनार्दनम् ॥ १४॥ पृष्ठे क्षितिधरं विद्यादच्युतं स्कधयोरपि । वामकुक्षौ वारिजाक्षं दक्षिणे जलशायिनम्
    ॥ १५॥ स्वयम्भुवं मेढ्रमध्ये ऊर्वोश्चैव गदाधरम् । जानुमध्ये चक्रधरं जङ्घयोरमृतं न्यसेत् ॥ १६॥ गुल्फयोर्नारसिंहं
    च पादयोरमितत्विषम् । अङ्गुलीषु श्रीधर च पद्माक्षं सर्वसन्धिषु ॥ १७॥ नखेषु माधवं चैव न्यसेत्पादतलेऽच्युतम्
    । रोमकूपे गुडाकेशं कृष्णं रक्तास्थिमज्जसु ॥ १८॥ मनोबुद्ध्योरहङ्कारे चित्ते न्यस्य जनार्दनम् । अच्युतानन्तगोविन्दान्वातपित्तकफेषु
    च ॥ १९॥ एवं न्यासविधिं कृत्वा यत्कार्यं द्विज तच्छृणु । पादमुले तु देवस्य शङ्खं चैव तु विन्यसेत् ॥
    २०॥ वनमालां हृदि न्यस्य सर्वदेवाभिपूजिताम् ॥ गदां वक्षःस्थले न्यस्य चक्रं चैव तु पृष्ठतः ॥ २१॥ श्रीवत्समुरसि
    न्यस्य पञ्चाङ्गं कवचं न्यसेत् । आपादमस्तकं चैव विन्यसेत्पुरुषोत्तमम् ॥ २२॥ एवं न्यासविधिं कृत्वा साक्षान्नारायणो
    भवेत् । तनुर्विष्णुमयी तस्य यत्कञ्चिन्न स भासते ॥ २३॥ अपामार्जनको न्यासस्सर्वव्याधिविनाशनः । आत्मनश्च
    परस्यापि विधिरेष सनातनः ॥ २४॥ वैष्णवेन तु कर्तव्यस्सर्वसिद्धिप्रदायकः । विष्णुस्तदूर्ध्वं रक्षेत्तु
    वैकुण्ठो विदिशो दिशः ॥ २५॥ पातु मां सर्वतो रामो धन्धी चक्री च केशवः । एतत्समस्तं विन्यस्य पश्चान्यमन्त्रान्
    प्रयोजयेत् ॥ २६॥ अथ मूलमन्त्रः
