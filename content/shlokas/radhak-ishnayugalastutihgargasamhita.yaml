id: radhak-ishnayugalastutihgargasamhita
category: stotram
name:
  english: radhakṟishnayugalastutihgargasamhita
  devanagari: राधाक्ऱिष्णयुगलस्तुतिःगर्गसम्हिता
content:
  english: anadimadyam purushottamottamam shrikrishnacandram nijabhaktavatsalam | svayam tvasankhyandapatim
    paratparam radhapatim tvam sharanam vrajamyaham || 1|| golokanathastvamativa lilo lilavatiyam nijalokalila
    | vaikunthanatho'si yada tvameva lakshmistadeyam vrishabhanuja hi || 2|| tvam ramacandro janakatmajeyam
    bhumau haristvam kamalalayeyam | yajnavataro'si yada tadeyam shridakshina stri pratipatnimukhya ||
    3|| tvam narasimho'si rama tadeyam narayanastvam ca narena yuktah | tada tviyam shantirativa sakshacchayeva
    yata ca tavanurupa || 4|| tvam brahma ceyam prakritistatastha kalo yademam ca viduh pradhanam | mahanyada
    tvam jagadankuro'si radha tadeyam saguna ca maya || 5|| yadantaratma viditashcaturbhistada tviyam
    lakshanarupavrittih | yada viraddehadharastvameva tadakhilam va bhuvi dharaneyam || 6|| shyamam ca
    gauram viditam dvidha mahastavaiva sakshatpurushottamottama | golokadhamadhipatim paresham paratparam
    tvam sharanam vrajamyaham || 7|| sada pathedyo yugalastavam param golokadhamapravaram prayati sah
    | ihaiva saundaryasamriddhisiddhayo bhavanti tasyapi nisargatah punah || 8|| iti gargasamhitayam golokakhande
    shodashadhyayantargata brahmana krita radhakrishnayugalastutih samapta |
  devanagari: अनादिमाद्यं पुरुषोत्तमोत्तमं श्रीकृष्णचन्द्रं निजभक्तवत्सलम् । स्वयं त्वसङ्ख्याण्डपतिं परात्परं
    राधापतिं त्वां शरणं व्रजाम्यहम् ॥ १॥ गोलोकनाथस्त्वमतीव लीलो लीलावतीयं निजलोकलीला । वैकुण्ठनाथोऽसि
    यदा त्वमेव लक्ष्मीस्तदेयं वृषभानुजा हि ॥ २॥ त्वं रामचन्द्रो जनकात्मजेयं भूमौ हरिस्त्वं कमलालयेयम्
    । यज्ञावतारोऽसि यदा तदेयं श्रीदक्षिणा स्त्री प्रतिपत्निमुख्या ॥ ३॥ त्वं नारसिंहोऽसि रमा तदेयं नारायणस्त्वं
    च नरेण युक्तः । तदा त्वियं शान्तिरतीव साक्षाच्छायेव याता च तवानुरूपा ॥ ४॥ त्वं ब्रह्म चेयं प्रकृतिस्तटस्था
    कालो यदेमां च विदुः प्रधानाम् । महान्यदा त्वं जगदङ्कुरोऽसि राधा तदेयं सगुणा च माया ॥ ५॥ यदान्तरात्मा
    विदितश्चतुर्भिस्तदा त्वियं लक्षणरूपवृत्तिः । यदा विराड्देहधरस्त्वमेव तदाखिलं वा भुवि धारणेयम् ॥ ६॥
    श्यामं च गौरं विदितं द्विधा महस्तवैव साक्षात्पुरुषोत्तमोत्तम । गोलोकधामाधिपतिं परेशं परात्परं त्वां
    शरणं व्रजाम्यहम् ॥ ७॥ सदा पठेद्यो युगलस्तवं परं गोलोकधामप्रवरं प्रयाति सः । इहैव सौन्दर्यसमृद्धिसिद्धयो
    भवन्ति तस्यापि निसर्गतः पुनः ॥ ८॥ इति गर्गसंहितायां गोलोकखण्डे षोडशाध्यायान्तर्गता ब्रह्मणा कृता राधाकृष्णयुगलस्तुतिः
    समाप्ता ।
