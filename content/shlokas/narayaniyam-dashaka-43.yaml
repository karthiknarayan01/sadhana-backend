id: narayaniyam-dashaka-43
category: stotram
name:
  english: Narayaniyam Dashaka 43
content:
  english: tvamekada gurumarutpuranatha vodhum gadhadhirudhagarimanamaparayanti | mata nidhaya shayane
    kimidam bateti dhyayantyaceshtata griheshu nivishtashanka || || tavadviduramupakarnitaghoraghosha
    vyajrimbhipamsupataliparipuritashah | vatyavapussa kila daityavarastrinava rtakhyo jahara janamanasaharinam
    tvam || || uddamapamsutimirahatadrishtipate drashtum kimapyakushale pashupalaloke | ha balakasya kimiti
    tvadupantamapta mata bhavantamavilokya bhrisham ruroda || || tavat sa danavavaro'pi ca dinamurti rbhavatkabharaparidharanalunavegah
    | sankocamapa tadanu kshatapamsughoshe ghoshe vyatayata bhavajjananininadah || || rodopakarnanavashadupagamya
    geham krandatsu nandamukhagopakuleshu dinah | tvam danavastvakhilamuktikaram mumukshu stvayyapramuncati
    papata viyatpradeshat || || rodakulastadanu gopagana bahishtha pashanaprishthabhuvi dehamatisthavishtham
    | praikshanta hanta nipatantamamushya vaksha syakshinameva ca bhavantamalam hasantam || || gravaprapataparipishtagarishthadeha
    bhrashtasudushtadanujopari dhrishtahasam | aghnanamambujakarena bhavantametya gopa dadhurgirivaradiva
    nilaratnam || || ekaikamashu parigrihya nikamananda nnandadigopaparirabdhavicumbitangam | adatukamaparishankitagopanari
    hastambujaprapatitam pranumo bhavantam || || bhuyo'pi kinnu krinumah pranatartihari govinda eva paripalayatat
    sutam nah | ityadi matarapitripramukhaistadanim samprarthitastvadavanaya vibho tvameva || || vatatmakam
    danujamevamayi pradhunvan vatodbhavan mama gadan kimu no dhunoshi | kim va karomi punarapyanilalayesha
    nishshesharogashamanam muhurarthaye tvam ||
  devanagari: त्वामेकदा गुरुमरुत्पुरनाथ वोढुं गाढाधिरूढगरिमाणमपारयन्ती । माता निधाय शयने किमिदं बतेति
    ध्यायन्त्यचेष्टत गृहेषु निविष्टशङ्का ॥ ॥ तावद्विदूरमुपकर्णितघोरघोष व्याजृम्भिपांसुपटलीपरिपूरिताशः
    । वात्यावपुस्स किल दैत्यवरस्तृणाव र्ताख्यो जहार जनमानसहारिणं त्वाम् ॥ ॥ उद्दामपांसुतिमिराहतदृष्टिपाते
    द्रष्टुं किमप्यकुशले पशुपाललोके । हा बालकस्य किमिति त्वदुपान्तमाप्ता माता भवन्तमविलोक्य भृशं रुरोद
    ॥ ॥ तावत् स दानववरोऽपि च दीनमूर्ति र्भावत्कभारपरिधारणलूनवेगः । सङ्कोचमाप तदनु क्षतपांसुघोषे घोषे व्यतायत
    भवज्जननीनिनादः ॥ ॥ रोदोपकर्णनवशादुपगम्य गेहं क्रन्दत्सु नन्दमुखगोपकुलेषु दीनः । त्वां दानवस्त्वखिलमुक्तिकरं
    मुमुक्षु स्त्वय्यप्रमुञ्चति पपात वियत्प्रदेशात् ॥ ॥ रोदाकुलास्तदनु गोपगणा बहिष्ठ पाषाणपृष्ठभुवि देहमतिस्थविष्ठम्
    । प्रैक्षन्त हन्त निपतन्तममुष्य वक्ष स्यक्षीणमेव च भवन्तमलं हसन्तम् ॥ ॥ ग्रावप्रपातपरिपिष्टगरिष्ठदेह
    भ्रष्टासुदुष्टदनुजोपरि धृष्टहासम् । आघ्नानमम्बुजकरेण भवन्तमेत्य गोपा दधुर्गिरिवरादिव नीलरत्नम् ॥ ॥
    एकैकमाशु परिगृह्य निकामनन्द न्नन्दादिगोपपरिरब्धविचुम्बिताङ्गम् । आदातुकामपरिशङ्कितगोपनारी हस्ताम्बुजप्रपतितं
    प्रणुमो भवन्तम् ॥ ॥ भूयोऽपि किन्नु कृणुमः प्रणतार्तिहारी गोविन्द एव परिपालयतात् सुतं नः । इत्यादि
    मातरपितृप्रमुखैस्तदानीं सम्प्रार्थितस्त्वदवनाय विभो त्वमेव ॥ ॥ वातात्मकं दनुजमेवमयि प्रधून्वन् वातोद्भवान्
    मम गदान् किमु नो धुनोषि । किं वा करोमि पुनरप्यनिलालयेश निश्शेषरोगशमनं मुहुरर्थये त्वाम् ॥
