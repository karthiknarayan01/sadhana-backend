id: kyts-1-8-anumatyai-purodaasamashtakapalam-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.8 Anumatyai Purodaasamashtakapalam - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande ashamah prashnah shri gurubhyo namah
    | harih om || anumatyai purodasha rdakshina ye pratyanca shshamyaya avashiyante ta ndakshina vihi
    svaha njushana esha te nir rite bhago bhute havishmatyasi muncema ssvaha namo ya ida nnirvapati varo
    dakshina va~mano vahi dakshina 'gnishomiya dakshina 'gnishomiya ekadashakapalagm hiranyam mekadashakapalagm
    hiranya mrishabho vahi dakshina ndaddhyrishabho vahi dakshinaindragna mprathamajo vathso dakshina
    saumyagg va~so dakshina sarasvatyai carugm sarasvate caru mmithunau gavau dakshina || agneyamashtakapala
    ncarugm savitram dvadashakapalagm sarasvata mmarutagm saptakapalam havamahe maruto yajnavahasah karambhena
    sajoshasah || mo shu na indra prithsu devastu sma te shushminnavaya | mahi hyasya midhusho yavya |
    havishmato maruto vandate gih || ya dgrame yadaranye ya ya~dindriye | yacchudre yadarya enashcakrima
    vayam | yade kasyadhi dharmani tasyavayajanamasi svaha || akran karma karmakritah saha vaca mayobhuva
    | devebhyah karma kritva nnirvapati sakagm suryenodyata marudbhyah santapanebhyo maddhyandine caru
    mmarudbhyo grihamedhibhya mpurna darvi parapata supu rna punara pata | vasneva vi krinavaha ishamurjagm
    shatakrato || dehi me dadami te ni me dhehi ni te dadhe | niharaminni me hara ni hara nni harami te
    || marudbhyah kridibhyah purodashagm saptakapala nnirvapati sakagm suryenodyata ndvadashakapalagm
    sarasvata somaya pitrimate purodashagm shatkapala nnirvapati pitribhyo bar hishadbhyo dhanah pitribhyo
    'gnishvattebhyo 'bhivanyayai dugdhe manthameta tte tata ye ca tva tte pitamaha prapitamaha ye ca tvamanvatra
    pitaro yathabhaga mmandaddhvagm susandrisha nmandishimahi | pranuna sstuto yasi vashagm anu | yoja
    nvindra te hari || akshannamimadanta hyava priya adhushata | astoshata svabhanavo vipra navishthaya
    mati | yoja nvindra te hari 'mimrijanta pitarah || pareta pitara ssomya gambhiraih pathibhih purvyaih
    | atha pitrin thsuvidatragm apita yamena ye sadhamada mmadanti || mano nva huvamahe narashagmsena
    stomena pitrina na etu manah punah kratve na etu manah punah kratve dakshaya jivase ndrishe || punarnah
    pitaro mano dadatu daivyo janah | jivam vra~tagm sacemahi || yadantariksha va~ jihigmsima | agni rma
    tasmadenaso gar hapatyah pra muncatu durita yani cakrima karotu ma catushcatvarigmshacca pratipurushamekakapala
    ssmastebhyah kamakara mpashunagm sharmasi sharma yajamanasya sharma me yacchaika eva rudro na dvitiyaya
    tastha akhuste rudra pashusta njushasvaisha te rudra bhaga 'shvaya purushaya bheshajamatho asmabhya
    mbheshajagm subheshajam mmeshaya meshya ava ntyrambakam | yatha na dyatha no vasyasah kara dyatha
    nah pashumatah kara dyatha no vyavasayaya mpushtivardhanam | urvaruka t || esha te rudra bhagasta
    njushasva tenavasena paro mujavato 'tihya vatatadhanva pinakahastah krittivasah || ncarumindraya shunasiraya
    purodasha mpayah sauryamekakapala rdakshina ye devah purassado tra dakshinasado yamane trah pashcathsadah
    savitrine tra uttarasado varunanetra uparishado brihaspatinetra rakshohanaste nah pantu te no ssvaha
    samudhagm raksha ssandagdhagm raksha idamahagm raksho ndahamyagnaye rakshoghne svaha yamaya savitre
    varunaya brihaspataye duvasvate rakshoghne svaha prashtivahi ratho dakshina devasya tva savituh prasave
    bhyagm rakshaso vadha njuhomi hatagm raksho nnirvapatyanumatyai carugm rakayai carugm sinivalyai caru
    mmithunau gavau dakshina ''gnavaishnava nnirvapatyaindravaishnava va~mano vahi dakshina nnirvapatindrasomiya
    mekadashakapalagm saumya rdakshina somapaushna nnirvapatyaindra paushna shyamo dakshina vaishvanara
    nnirvapati hiranya ncarumashvo dakshina || nnirvapati brahmano grihe shitiprishtho dakshinaindra mekadashakapalagm
    rajanyasya griha rishabho dakshina mmahishyai grihe dhenu mparivriktyai grihe krishnanam nkrishna
    kuta dakshina ''gneyamashtakapalagm senanyo grihe hiranya ndashakapalagm sutasya grihe mahanirashto
    dakshina marutagm saptakapala ngramanyo grihe prishni rgriha upaddhvasto dakshina ndvikapalagm sangrahitu
    rgrihe savatyau dakshina paushna mbhagadughasya grihe shyamo dakshina raudra ncarumakshavapasya grihe
    shabala udvaro dakshinendraya sutramne purodashamekadashakapala mprati nirvapatindrayagmhomuce 'ya
    nno raja vritraha raja bhutva vritram shvetavathsayai dugdhe svayammurte svayammathita ajya ashvatthe
    patre catuhsraktau patre catuhsraktau svayamavapannayai shakhayai karnag shca tandulan vi cinuya ssvayankrita
    vedi ssvayankrita iddhma ssaiva shveta shvetavathsa dakshina || mashvatthe trayastrigmshacca agnaye
    grihapataye purodashamashtakapala nnirvapati krishnanam vri~hinagm somaya vanaspataye shyamaka ncarugm
    savitre satyaprasavaya purodasha vri~hinagm rudraya pashupataye gavidhuka mbrihaspataye vacaspataye
    naivara ncarumindraya jyeshthaya purodasha mmitraya satyaya va~runaya dharmapataye yavamaya ncarugm
    savita tva prasavanagm suvatamagni rgrihapatinagm somo vanaspatinagm rudrah pashunam va~runo dharmapatinam
    manamitraya suvaddhva mmahate kshatraya mahata adhipatyaya mahate janarajyayaisha vo bharata raja
    somo mbrahmananagm raja prati tyannama rajya va~runo ashishrecchuce rmitrasya vratya abhumamanmahi
    mahata ritasya nama sarve vrata varunasyabhuvan vi mitra evai mataridasushudanta yajniya ritena vyu
    trito jarimana krantamasi vishno 'si vrajakshitah stha marutamojah stha suryavarcasa sstha vishvabhritah
    stha janabhritah stha 'pamoshadhinagm rasah stha rmadhumatiragrihnannurjasvati rajasuyaya citanah
    || yabhi rindramanayannatya ratih || rashtrada ndatta svaha rashtrada sstha rashtramamushmai datta
    || mmahi varcah kshatriyaya vanvana anadhrishta ssidatorjasvatirmahi varcah kshatriyaya dadhatiranibhrishtamasi
    vaco bandhustapoja ssomasya datramasi shukra vah shukrenotpunami candrashcandrenamrita amritena svaha
    rajasuyaya citanah | sadhamado dyumninirurja eta anibhrishta apasyuvo vasanah || pastyasu cakre varuna
    ssadhasthamapagm shishu rmatritamasvantah || kshatrasyolbamasi kshatrasya yonirasyavinno agni rgrihapatiravinna
    indro vriddhashrava avinnah pusha vishvaveda avinnau mitravaruna vritavridhavavinne dyavaprithivi
    dhritavrate avinna devyaditi rvishvarupyavinno 'yamasavamushyayano nrashtre mahate kshatraya mahata
    adhipatyaya mahate janarajyayaisha vo bharata raja somo mbrahmananagm rajendrasya 'si vartraghnastvaya
    yam va~ddhyacchatrubadhana mpata ma tiryancamanvanca mma pata digbhyo ma pata vishva bhyo ma nashtrabhyah
    pata hiranyavarna ntatashcakshathamaditi samidhama tishtha gayatri tva chandasamavatu trivrithstomo
    rathantaragm samagni rdevata brahma dravinamugrama tishtha trishtu ptva chandasamavatu pancadasha
    thsamendro devata vi~rajama tishtha jagati tva chandasamavatu saptadasha sstomo vairupagm sama maruto
    devata vi sstomo vairajagm sama mitravarunau devata bala murdhvama tishtha panktistva chandasamavatu
    trinavatrayastrigmshau stomau shakvararaivate samani brihaspati rdevata varco dravina nca mitashca
    sammitashca sabharah | shukrajyotishca citrajyotishca satyajyotishca jyotishmag shca satyashcartapashca
    'tyagmhah | agnaye svaha somaya svaha savitre svaha sarasvatyai svaha pushne svaha brihaspataye svahendraya
    svaha ghoshaya svaha shlokaya svaha 'gmshaya svaha bhagaya svaha kshetrasya pataye svaha prithivyai
    svaha 'ntarikshaya svaha dive svaha suryaya svaha candramase svaha nakshatrebhya ssvaha vanaspatibhya
    ssvaha caracarebhya ssvaha pariplavebhya ssvaha sarisripebhya somasya tvishirasi taveva me tvishi
    rbhuyadamritamasi mrityo rma pahi didyonma pahyave shta dandashuka nirasta shshirah || somo raja varuno
    deva dharmasuvashca ye | te te vacagm suvanta nte te cakshuh suvanta nte te shrotragm suvantagm somasya
    tva dyumnenabhi shincamyagne stejasa suryasya varcasendrasyendriyena mitravarunayo rviryena marutamojasa
    kshatrana nkshatrapatirasyati divaspahi samavavritranna mbuddhniyamanu sancarantistah parvatasya vrishabhasya
    prishthe navashcaranti svasica iyanah || rudra yatte krayi para nnama tasmai hutamasi yameshtamasi
    | prajapate na tvadetanyanyo vishva jatani pari ta babhuva | yatkamaste juhumastanno astu vayagg syama
    patayo rayinam || 'si vartraghnastvaya nmitravarunayostva prashastroh prashisha yunajmi yajnasya yogena
    vishnoh kramo krantamasi vishno mprasave jeshamapta ssamahamindriyena viryena pashuna mmanyurasi taveva
    me manyu rbhuyannamo matre prithivyai ma mprithivigm higmsisha mmata prithivi higmsidiyadasyayu rme
    dhehyurgasyurja mme dhehi yunnasi varco 'si varco mayi dhehyagnaye grihapataye svaha somaya vanaspataye
    svahendrasya balaya svaha marutamojase svaha hagmsa saddhota vedishadatithi dvyomasadabja goja ritaja
    adrija rita kshatrasya nabhirasi kshatrasya yonirasi syonama sida sushadama sida ma tva higmsinma
    ma higmsinni shasada dhritavrato varunah pastya 'si satyasavo brahma 'si sushevo brahma 'si satyadharmendrasya
    vajro 'si vartraghnastena me raddhya disho nnaptre svahorjo naptre svaha 'gnaye grihapataye svaha
    agneyamashtakapala nnirvapati hiranya va~thsatari dakshina savitra mupaddhvasto dakshina paushna shyamo
    dakshina bar ncarugm shitiprishtho dakshinaindra mrishabho dakshina varuna mmahanirashto dakshina
    saumya rdakshina tvashtramashtakapalagm shuntho dakshina vaishnava agneyagm hiranyagm sarasvatam nkrinanti
    pundarisraja mpra yacchati dashabhi nkrinati dashapeyo bhavati shata hmanah pibanti saptadashagg mbhavati
    prakashavaddhvaryave dadati sraja mudgatre rukmagm hotre mprastotripratihartribhya hmanacchagmsine
    vasasi neshtapotribhyag sthuri yavacita magnidhe bhargavo hota bhavati shrayantiya mbhavati varavantiya
    magnishtomasamagm sarasvati nnirvapati hiranya mrishabho dakshina vaishvadeva mpishangi pashthauhi
    dakshina maitravaruni ncarugm shitiprishtho dakshina ngarbhinima labhate maruti mpushne purodasha
    nnirvapati sarasvate satyavace carugm savitre satyaprasavaya purodasha ntisridhanvagm shushkadriti
    agneyagm hiranyamaidramrishabho vai ntvashtramashtakapalam ndakshino rathavahanavaho dakshina sarasvata
    ncarumuttaro rathavahanavaho dakshina || mamritena srijami sagm somena somo mpacyasva sarasvatyai
    pacyasvendraya sutramne pacyasva punatu te parisrutagm somagm suryasya duhita | varena shashvata tana
    || vayuh putah pavitrena pratyam somo atidrutah | indrasya yujya dyatha dantyanupurvam vi~yuya | ihehaisha
    nkrinuta bhojanani ye barhisho namovrikti nna jagmuh || ashvina ndhumrama labhate sarasvata mmeshamaindramrishabha
    nnirvapati savitra ndashakapalagm somapratikah pitarastripnuta vadaba dakshina || agnavishnu mahi
    ta nghritasya guhyani nama | damedame sapta ratna dadhana prati va njihva ghritama caranyet || agnavishnu
    mahi dhama priyam vi~tho ghritasya guhya jushana | damedame sushtuti rvavridhana prati va njihva ghritamuccaranyet
    || pra no devi sarasvati vajebhi rvajinivati | dhina mavitryavatu | a no divo brihatah parvatada sarasvati
    yajata gantu yajnam | hava ndevi jujushana ghritaci shagma nno vacamushati shrinotu || brihaspate
    jushasva no havyani vishvadevya | rasva ratnani dashushe || eva pitre vishvadevaya vrishne yajnai
    rvidhema namasa havirbhih | brihaspate supraja viravanto vayagg syama patayo rayinam || brihaspate
    ati yadaryo ar dvibhati kratumajjaneshu | ya ritaprajata tadasmasu rtaprajata tadasmasu dravina ndhehi
    citram || a no mitravaruna ghritai rgavyutimukshatam | maddhva rajagmsi sukratu || pra bahava sisrita
    njivase na a no gavyuti nghritena | a no jane mme mitravaruna havema || agnim ngira devamide vasunam
    | saparyantah purupriya trasadhasam || makshu devavato ratha shshuro va prithsu kasu cit | devanam
    ya~ inmano yajamana iyakshatyabhidayajvano bhuvat || na yajamana rishyasi na sunvana na devayo ||
    asadatra suviryamuta tyadashvashviyam || nakishta nkarmana nashanna pra yoshanna yoshati || upa ksharanti
    sindhavo mayobhuva ijana nca dhenavah | prinanta shravasyavo ghritasya shravasyavo ghritasya dhara
    upa yanti vishvatah ||somarudra vi vrihatam vi~shucimamiva ya no gaya mavivesha | are badhetha ncidenah
    pra mumukta masmat || somarudra yuva metanyasme vishva tanushu bheshajani dhattam | ava syata ya~nno
    asti tanushu baddha nkritameno asmat || somapushana janana rayina njanana divo janana prithivyah |
    jatau vishvasya bhuvanasya gopau deva akrinvannamritasya nabhi m || imau devau jayamanau jushantemau
    tamagmsi guhata majushta | abhyamindrah pakvamamasvanta dvicatvarigmshat | || harih om || || krishna
    yajurvediya taittiriya samhitaya mprathamakande ashtamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे अषमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनु॑मत्यै पुरो॒डाश॑ र्दक्षि॑णा॒ ये प्र॒त्यञ्च॒ श्शम्या॑या अव॒शीय॑न्ते॒ त न्दक्षि॑णा॒ वीहि॒ स्वाहा
    ञ्जुषा॒ण ए॒ष ते॑ निर् ऋते भा॒गो भूते॑ ह॒विष्म॑त्यसि मु॒ञ्चेम स्स्वाहा॒ नमो॒ य इ॒द न्निर्व॑पति॒ वरो॒
    दक्षि॑णा वाँम॒नो व॒ही दक्षि॑णा ऽग्नीषो॒मीय॒ दक्षि॑णा ऽग्नीषो॒मीय एका॑दशकपाल॒ग्ं॒ हिर॑ण्यं॒ मेका॑दशकपाल॒ग्ं॒
    हिर॑ण्य॒ मृष॒भो व॒ही दक्षि॑णा न्दद्ध्यृ॑ष॒भो व॒ही दक्षि॑णैन्द्रा॒ग्न म्प्र॑थम॒जो व॒थ्सो दक्षि॑णा सौ॒म्यग्ग्
    वाँसो॒ दक्षि॑णा॒ सर॑स्वत्यै च॒रुग्ं सर॑स्वते च॒रु म्मि॑थु॒नौ गावौ॒ दक्षि॑णा ॥ आ॒ग्ने॒यम॒ष्टाक॑पाल॒
    ञ्च॒रुग्ं सा॑वि॒त्रं द्वाद॑शकपालग्ं सारस्व॒त म्मा॑रु॒तग्ं स॒प्तक॑पालं हवामहे म॒रुतो॑ य॒ज्ञवा॑हसः कर॒म्भेण॑
    स॒जोष॑सः ॥ मो षू ण॑ इन्द्र पृ॒थ्सु दे॒वास्तु॑ स्म ते शुष्मिन्नव॒या । म॒ही ह्य॑स्य मी॒ढुषो॑ य॒व्या
    । ह॒विष्म॑तो म॒रुतो॒ वन्द॑ते॒ गीः ॥ य द्ग्रामे॒ यदर॑ण्ये॒ य यँदि॑न्द्रि॒ये । यच्छू॒द्रे यद॒र्य॑ एन॑श्चकृ॒मा
    व॒यम् । यदे क॒स्याधि॒ धर्म॑णि॒ तस्या॑व॒यज॑नमसि॒ स्वाहा ॥ अक्र॒न् कर्म॑ कर्म॒कृतः॑ स॒ह वा॒चा म॑योभु॒वा
    । दे॒वेभ्यः॒ कर्म॑ कृ॒त्वा न्निर्व॑पति सा॒कग्ं सूर्ये॑णोद्य॒ता म॒रुद्भ्यः॑ सान्तप॒नेभ्यो॑ म॒द्ध्यन्दि॑ने
    च॒रु म्म॒रुद्भ्यो॑ गृहमे॒धिभ्य॒ म्पू॒र्णा द॑र्वि॒ परा॑पत॒ सुपू र्णा॒ पुन॒रा प॑त । व॒स्नेव॒ वि क्री॑णावहा॒
    इष॒मूर्जग्ं॑ शतक्रतो ॥ दे॒हि मे॒ ददा॑मि ते॒ नि मे॑ धेहि॒ नि ते॑ दधे । नि॒हार॒मिन्नि मे॑ हरा नि॒ हार॒
    न्नि ह॑रामि ते ॥ म॒रुद्भ्यः॑ क्री॒डिभ्यः॑ पुरो॒डाशग्ं॑ स॒प्तक॑पाल॒ न्निर्व॑पति सा॒कग्ं सूर्ये॑णोद्य॒ता
    न्द्वाद॑शकपालग्ं सारस्व॒त सोमा॑य पितृ॒मते॑ पुरो॒डाश॒ग्ं॒ षट्क॑पाल॒ न्निर्व॑पति पि॒तृभ्यो॑ बर् हि॒षद्भ्यो॑
    धा॒नाः पि॒तृभ्यो ऽग्निष्वा॒त्तेभ्यो॑ ऽभिवा॒न्या॑यै दु॒ग्धे म॒न्थमे॒त त्ते॑ तत॒ ये च॒ त्वा त्ते॑ पितामह
    प्रपितामह॒ ये च॒ त्वामन्वत्र॑ पितरो यथाभा॒ग म्म॑न्दद्ध्वग्ं सुस॒न्दृश॑ न्मन्दिषी॒महि॑ । प्रनू॒न स्स्तु॒तो
    या॑सि॒ वशा॒ग्ं॒ अनु॑ । योजा॒ न्वि॑न्द्र ते॒ हरी ॥ अक्ष॒न्नमी॑मदन्त॒ ह्यव॑ प्रि॒या अ॑धूषत । अस्तो॑षत॒
    स्वभा॑नवो॒ विप्रा॒ नवि॑ष्ठया म॒ती । योजा॒ न्वि॑न्द्र ते॒ हरी ऽमी॑मृजन्त पि॒तरः॑ ॥ परे॑त पितर स्सोम्या
    गम्भी॒रैः प॒थिभिः॑ पू॒र्व्यैः । अथा॑ पि॒तृन् थ्सु॑वि॒दत्रा॒ग्ं॒ अपी॑त य॒मेन॒ ये स॑ध॒माद॒ म्मद॑न्ति
    ॥ मनो॒ न्वा हु॑वामहे नाराश॒ग्ं॒सेन॒ स्तोमे॑न पितृ॒णा न॒ ए॒तु॒ मनः॒ पुनः॒ क्रत्वे॒ न॑ एतु॒ मनः॒ पुनः॒
    क्रत्वे॒ दक्षा॑य जी॒वसे न्दृ॒शे ॥ पुन॑र्नः पि॒तरो॒ मनो॒ ददा॑तु॒ दैव्यो॒ जनः॑ । जी॒वं व्राँतग्ं॑ सचेमहि
