id: sarasvati-sahasra-nama-stotram
category: stotram
name:
  english: Sarasvati Sahasra Nama Stotram
content:
  english: dhyanam | shrimaccandanacarcitojjvalavapuh shuklambara mallika malalalita kuntala pravilasanmuktavalishobhana
    | sarvajnananidhanapustakadhara rudrakshamalankita vagdevi vadanambuje vasatu me trailokyamata shubha
    || shri narada uvaca bhagavanparameshana sarvalokaikanayaka | katham sarasvati sakshatprasanna parameshthinah
    || || katham devya mahavanyassatatprapa sudurlabham | etanme vada tattvena mahayogishvara prabho ||
    || shri sanatkumara uvaca sadhu prishtam tvaya brahman guhyadguhyamanuttamam | mayanugopitam yatnadidanim
    satprakashyate || || pura pitamaham drishtva jagatsthavarajangamam | nirvikaram nirabhasam stambhibhutamacetasam
    || || srishtva trailokyamakhilam vagabhavattathavidham | adhikyabhavatah svasya parameshthi jagadguruh
    || || divyavarshayutam tena tapo dushkaramuttamam | tatah kadacitsanjata vani sarvarthashobhita ||
    || ahamasmi mahavidya sarvavacamadhishvari | mama namnam sahasram tu upadekshyamyanuttamam || || anena
    samstuta nityam patni tava bhavamyaham | tvaya srishtam jagatsarvam vaniyuktam bhavishyati || || idam
    rahasyam paramam mama namasahasrakam | sarvapapaughashamanam mahasarasvatapradam || || mahakavitvadam
    loke vagishatvapradayakam | tvam va parah pumanyastu stavena'nena toshayet || || tasyaham kinkari
    sakshadbhavishyami na samshayah | ityuktvantardadhe vani tadarabhya pitamahah || || stutva stotrena
    divyena tatpatitvamavaptavan | vaniyuktam jagatsarvam tadarabhya'bhavanmune || || tatteham sampravakshyami
    shrinu yatnena narada | savadhanamana bhutva kshanam shuddho munishvarah || aim vada vada vagvadini
    svaha vagvani varada vandya vararoha varaprada | vrittirvagishvari varta vara vagishavallabha || ||
    vishveshvari vishvavandya vishveshapriyakarini | vagvadini ca vagdevi vriddhida vriddhikarini || ||
    vriddhirvriddha vishaghni ca vrishtirvrishtipradayini | vishvaradhya vishvamata vishvadhatri vinayaka
    || || vishvashaktirvishvasara vishva vishvavibhavari | vedantavedini vedya vitta vedatrayatmika ||
    || vedajna vedajanani vishva vishvavibhavari | varenya vanmayi vriddha vishishtapriyakarini || ||
    vishvatovadana vyapta vyapini vyapakatmika | vyalaghni vyalabhushangi viraja vedanayika || || vedavedantasamvedya
    vedantajnanarupini | vibhavari ca vikranta vishvamitra vidhipriya || || varishtha viprakrishta ca
    vipravaryaprapujita | vedarupa vedamayi vedamurtishca vallabha || om hrim gururupe mam grihna grihna
    aim vada vada vagvadini svaha gauri gunavati gopya gandharvanagarapriya | gunamata gunantastha gururupa
    gurupriya || guruvidya ganatushta gayakapriyakarini | gayatri girisharadhya girgirishapriyankari ||
    || girijna jnanavidya ca girirupa girishvari | girmata ganasamstutya gananiyagunanvita || || gudharupa
    guha gopya gorupa gaurgunatmika | gurvi gurvambika guhya geyaja grihanashini || || grihini grihadoshaghni
    gavaghni guruvatsala | grihatmika griharadhya grihabadhavinashini || || ganga girisuta gamya gajayana
    guhastuta | garudasanasamsevya gomati gunashalini || om aim namah sharade shrim shuddhe namah sharade
    vam aim vada vada vagvadini svaha sharada shashvati shaivi shankari shankaratmika | shrishsharvani
    shataghni ca sharaccandranibhanana || || sharmishtha shamanaghni ca shatasahasrarupini | shiva shambhupriya
    shraddha shrutirupa shrutipriya || || shucishmati sharmakari shuddhida shuddhirupini | shiva shivankari
    shuddha shivaradhya shivatmika || || shrimati shrimayi shravya shrutih shravanagocara | shantishshantikari
    shanta shantacarapriyankari || || shilalabhya shilavati shrimata shubhakarini | shubhavani shuddhavidya
    shuddhacittaprapujita || || shrikari shrutapapaghni shubhakshi shucivallabha | shivetaraghni shabari
    shravaniyagunanvita || shari shirishapushpabha shamanishtha shamatmika | shamanvita shamaradhya shitikanthaprapujita
    || || shuddhih shuddhikari shreshtha shrutananta shubhavaha | sarasvati ca sarvajna sarvasiddhipradayini
    || om aim vada vada vagvadini svaha sarasvati ca savitri sandhya sarvepsitaprada | sarvartighni sarvamayi
    sarvavidyapradayini || || sarveshvari sarvapunya sargasthityantakarini | sarvaradhya sarvamata sarvadevanishevita
    || || sarvaishvaryaprada satya sati satvagunashraya | sarvakramapadakara sarvadoshanishudini || sahasrakshi
    sahasrasya sahasrapadasamyuta | sahasrahasta sahasragunalankritavigraha || || sahasrashirsha sadrupa
    svadha svaha sudhamayi | shadgranthibhedini sevya sarvalokaikapujita || || stutya stutimayi sadhya
    savitripriyakarini | samshayacchedini sankhyavedya sankhya sadishvari || || siddhida siddhasampujya
    sarvasiddhipradayini | sarvajna sarvashaktishca sarvasampatpradayini || || sarva'shubhaghni sukhada
    sukhasamvitsvarupini | sarvasambhashani sarvajagatsammohini tatha || sarvapriyankari sarvashubhada
    sarvamangala | sarvamantramayi sarvatirthapunyaphalaprada || || sarvapunyamayi sarvavyadhighni sarvakamada
    | sarvavighnahari sarvavandita sarvamangala || || sarvamantrakari sarvalakshmih sarvagunanvita | sarvanandamayi
    sarvajnanada satyanayika || || sarvajnanamayi sarvarajyada sarvamuktida | suprabha sarvada sarva sarvalokavashankari
    || || subhaga sundari siddha siddhamba siddhamatrika | siddhamata siddhavidya siddheshi siddharupini
    || || surupini sukhamayi sevakapriyakarini | svamini sarvada sevya sthulasukshmaparambika || || sararupa
    sarorupa satyabhuta samashraya | sita'sita sarojakshi sarojasanavallabha || || saroruhabha sarvangi
    surendradiprapujita | om hrim aim mahasarasvati sarasvataprade aim vada vada vagvadini svaha mahadevi
    maheshani mahasarasvataprada || || mahasarasvati mukta muktida mohanashini | maheshvari mahananda
    mahamantramayi mahi || || mahalakshmirmahavidya mata mandaravasini | mantragamya mantramata mahamantraphalaprada
    || || mahamuktirmahanitya mahasiddhipradayini | mahasiddha mahamata mahadakarasamyuta || || mahi maheshvari
    murtirmokshada manibhushana | menaka manini manya mrityughni merurupini || || madirakshi madavasa
    makharupa makheshvari | mahamoha mahamaya matrinam murdhnisamsthita || || mahapunya mudavasa mahasampatpradayini
    | manipuraikanilaya madhurupa madotkata || mahasukshma mahashanta mahashantipradayini | munistuta
    mohahantri madhavi madhavapriya || || ma mahadevasamstutya mahishiganapujita | mrishtannada ca mahendri
    mahendrapadadayini || || matirmatiprada medha martyalokanivasini | mukhya mahanivasa ca mahabhagyajanashrita
    || || mahila mahima mrityuhari medhapradayini | medhya mahavegavati mahamokshaphalaprada || || mahaprabhabha
    mahati mahadevapriyankari | mahaposha maharthishca muktaharavibhushana || manikyabhushana mantra mukhyacandrardhashekhara
    | manorupa manashshuddhih manashshuddhipradayini || || mahakarunyasampurna manonamanavandita | mahapatakajalaghni
    muktida muktabhushana || || manonmani mahasthula mahakratuphalaprada | mahapunyaphalaprapya mayatripuranashini
    || || mahanasa mahamedha mahamoda maheshvari | maladhari mahopaya mahatirthaphalaprada || || mahamangalasampurna
    mahadaridryanashini | mahamakha mahamegha mahakali mahapriya || || mahabhusha mahadeha maharajni mudalaya
    | om hrim aim namo bhagavati aim vada vada vagvadini svaha bhurida bhagyada bhogya bhogyada bhogadayini
    || || bhavani bhutida bhutih bhumirbhumisunayika | bhutadhatri bhayahari bhaktasarasvataprada || ||
    bhuktirbhuktiprada bhoktri bhaktirbhaktipradayini | bhaktasayujyada bhaktasvargada bhaktarajyada ||
    || bhagirathi bhavaradhya bhagyasajjanapujita | bhavastutya bhanumati bhavasagaratarini || || bhutirbhusha
    ca bhuteshi bhalalocanapujita | bhuta bhavya bhavishya ca bhavavidya bhavatmika || || badhapaharini
    bandhurupa bhuvanapujita | bhavaghni bhaktilabhya ca bhaktarakshanatatpara || || bhaktartishamani
    bhagya bhogadanakritodyama | bhujangabhushana bhima bhimakshi bhimarupini || || bhavini bhratrirupa
    ca bharati bhavanayika | bhasha bhashavati bhishma bhairavi bhairavapriya || || bhutirbhasitasarvangi
    bhutida bhutinayika | bhasvati bhagamala ca bhikshadanakritodyama || || bhikshurupa bhaktikari bhaktalakshmipradayini
    | bhrantighna bhrantirupa ca bhutida bhutikarini || || bhikshaniya bhikshumata bhagyavaddrishtigocara
    | bhogavati bhogarupa bhogamokshaphalaprada || || bhogashranta bhagyavati bhaktaghaughavinashini |
    om aim klim sauh bale brahmi brahmapatni aim vada vada vagvadini svaha brahmi brahmasvarupa ca brihati
    brahmavallabha || || brahmada brahmamata ca brahmani brahmadayini | brahmeshi brahmasamstutya brahmavedya
    budhapriya || || balendushekhara bala balipujakarapriya | balada bindurupa ca balasuryasamaprabha
    || || brahmarupa brahmamayi bradhnamandalamadhyaga | brahmani buddhida buddhirbuddhirupa budheshvari
    || || bandhakshayakari badhanashini bandhurupini | bindvalaya bindubhusha bindunadasamanvita || ||
    bijarupa bijamata brahmanya brahmakarini | bahurupa balavati brahmajna brahmacarini || brahmastutya
    brahmavidya brahmandadhipavallabha | brahmeshavishnurupa ca brahmavishnvishasamsthita || || buddhirupa
    budheshani bandhi bandhavimocani | om hrim aim am am im im um um rim rim lum em aim om aum kam kham
    gam gham nam cam cham jam jham nam tam tham dam dham nam tam tham dam dham nam pam pham bam bham mam
    yam ram lam vam sham sham sam ham lam ksham akshamale aksharamalika samalankrite vada vada vagvadini
    svaha akshamala'ksharakara'kshara'ksharaphalaprada || || ananta'nandasukhada'nantacandranibhanana
    | anantamahima'ghoranantagambhirasammita || || adrishta'drishtada'nantadrishtabhagyaphalaprada | arundhatyavyayinatha'nekasadgunasamyuta
    || || anekabhushana'drishya'nekalekhanishevita | ananta'nantasukhada'ghora'ghorasvarupini || || asheshadevatarupa'mritarupa'mriteshvari
    | anavadya'nekahasta'nekamanikyabhushana || || anekavighnasamhartri tvanekabharananvita | avidyajnanasamhartri
    hyavidyajalanashini || || abhirupanavadyangi hyapratarkyagatiprada | akalankarupini ca hyanugrahaparayana
    || || ambarastha'mbaramaya'mbaramala'mbujekshana | ambika'bjakara'bjastha'mshumatya'mshushatanvita
    || || ambuja'navara'khanda'mbujasanamahapriya | ajara'marasamsevya'jarasevitapadyuga || || atularthaprada'rthaikya'tyudaratvabhayanvita
    | anathavatsala'nantapriya'nantepsitaprada || || ambujakshyamburupa'mbujatodbhavamahapriya | akhanda
    tvamarastutya'maranayakapujita || || ajeya tvajasankasha'jnananashinyabhishtada | aktaghanena ca'streshi
    hyalakshminashini tatha || || anantasara'nantashriranantavidhipujita | abhishtamartyasampujya hyastodayavivarjita
    || || astikasvantanilaya'strarupa'stravati tatha | askhalatyaskhaladrupa'skhaladvidyapradayini ||
    || askhalatsiddhida''nanda'mbujata''maranayika | ameya'sheshapapaghnyakshayasarasvataprada || om jyam
    hrim jaya jaya jaganmatah aim vada vada vagvadini svaha jaya jayanti jayada janmakarmavivarjita |
    jagatpriya jaganmata jagadishvaravallabha || || jatirjaya jitamitra japya japanakarini | jivani jivanilaya
    jivakhya jivadharini || || jahnavi jya japavati jatirupa jayaprada | janardanapriyakari joshaniya
    jagatsthita || || jagajjyeshtha jaganmaya jivanatranakarini | jivatulatika jivajanmi janmanibarhani
    || || jadyavidhvamsanakari jagadyonirjayatmika | jagadanandajanani jambushca jalajekshana || || jayanti
    jangapugaghni janitajnanavigraha | jata jatavati japya japakartripriyankari || || japakritpapasamhartri
    japakritphaladayini | japapushpasamaprakhya japakusumadharini || || janani janmarahita jyotirvrityabhidayini
    | jatajutanacandrardha jagatsrishtikari tatha || || jagattranakari jadyadhvamsakartri jayeshvari |
    jagadbija jayavasa janmabhurjanmanashini || || janmantyarahita jaitri jagadyonirjapatmika | jayalakshanasampurna
    jayadanakritodyama || || jambharadyadisamstutya jambhariphaladayini | jagattrayahita jyeshtha jagattrayavashankari
    || || jagattrayamba jagati jvala jvalitalocana | jvalini jvalanabhasa jvalanti jvalanatmika || ||
    jitaratisurastutya jitakrodha jitendriya | jaramaranashunya ca janitri janmanashini || || jalajabha
    jalamayi jalajasanavallabha | jalajastha japaradhya janamangalakarini || aim klim sauh kalyani kamadharini
    vada vada vagvadini svaha kamini kamarupa ca kamya kamyapradayini | kamauli kamada kartri kratukarmaphalaprada
    || || kritaghnaghni kriyarupa karyakaranarupini | kanjakshi karunarupa kevalamarasevita || || kalyanakarini
    kanta kantida kantirupini | kamala kamalavasa kamalotpalamalini || || kumudvati ca kalyani kantih
    kameshavallabha | kameshvari kamalini kamada kamabandhini || || kamadhenuh kancanakshi kancanabha
    kalanidhih | kriya kirtikari kirtih kratushreshtha kriteshvari || || kratusarvakriyastutya kratukritpriyakarini
    | kleshanashakari kartri karmada karmabandhini || || karmabandhahari krishta klamaghni kanjalocana
    | kandarpajanani kanta karuna karunavati || || klinkarini kripakara kripasindhuh kripavati | karunardra
    kirtikari kalmashaghni kriyakari || || kriyashaktih kamarupa kamalotpalagandhini | kala kalavati kurmi
    kutastha kanjasamsthita || || kalika kalmashaghni ca kamaniyajatanvita | karapadma karabhishtaprada
    kratuphalaprada || || kaushiki koshada kavya kartri kosheshvari krisha | kurmayana kalpalata kalakutavinashini
    || || kalpodyanavati kalpavanastha kalpakarini | kadambakusumabhasa kadambakusumapriya || || kadambodyanamadhyastha
    kirtida kirtibhushana | kulamata kulavasa kulacarapriyankari || || kulanatha kamakala kalanatha kaleshvari
    | kundamandarapushpabha kapardasthitacandrika || || kavitvada kamyamata kavimata kalaprada | om sauh
    klim aim tato vada vada vagvadini svaha taruni tarunitata taradhipasamanana || || triptistriptiprada
    tarkya tapani tapini tatha | tarpani tirtharupa ca tripada tridasheshvari || tridiveshi trijanani
    trimata tryambakeshvari | tripura tripureshani tryambaka tripurambika || || tripurashristrayirupa
    trayivedya trayishvari | trayyantavedini tamra tapatritayaharini || || tamalasadrishi trata tarunadityasannibha
    | trailokyavyapini tripta triptikrittattvarupini || || turya trailokyasamstutya triguna triguneshvari
    | tripuraghni trimata ca tryambaka trigunanvita || || trishnacchedakari tripta tikshna tikshnasvarupini
    | tula tuladirahita tattadbrahmasvarupini || || tranakartri tripapaghni tridasha tridashanvita | tathya
    trishaktistripada turya trailokyasundari || || tejaskari trimurtyadya tejorupa tridhamata | tricakrakartri
    tribhaga turyatitaphalaprada || || tejasvini tapahari tapopaplavanashini | tejogarbha tapassara tripuraripriyankari
    || || tanvi tapasasantushta tapanangajabhitinut | trilocana trimarga ca tritiya tridashastuta || ||
    trisundari tripathaga turiyapadadayini | om hrim shrim klim aim namashshuddhaphalade aim vada vada
    vagvadini svaha shubha shubhavati shanta shantida shubhadayini || || shitala shulini shita shrimati
    ca shubhanvita | om aim yam yim yum yaim yaum yah aim vada vada vagvadini svaha yogasiddhiprada yogya
    yajnenaparipurita || || yajna yajnamayi yakshi yakshini yakshivallabha | yajnapriya yajnapujya yajnatushta
    yamastuta || || yaminiyaprabha yamya yajaniya yashaskari | yajnakartri yajnarupa yashoda yajnasamstuta
    || || yajneshi yajnaphalada yogayoniryajusstuta | yamisevya yamaradhya yamipujya yamishvari || ||
    yogini yogarupa ca yogakartripriyankari | yogayukta yogamayi yogayogishvarambika || || yogajnanamayi
    yoniryamadyashtangayogata | yantritaghaughasamhara yamalokanivarini || || yashtivyashtishasamstutya
    yamadyashtangayogayuk | yogishvari yogamata yogasiddha ca yogada || || yogarudha yogamayi yogarupa
    yaviyasi | yantrarupa ca yantrastha yantrapujya ca yantrika || yugakartri yugamayi yugadharmavivarjita
    | yamuna yamini yamya yamunajalamadhyaga || yatayataprashamani yatananannikrintani | yogavasa yogivandya
    yattacchabdasvarupini || || yogakshemamayi yantra yavadaksharamatrika | yavatpadamayi yavacchabdarupa
    yatheshvari || || yattadiya yakshavandya yadvidya yatisamstuta | yavadvidyamayi yavadvidyabrindasuvandita
    || || yogihritpadmanilaya yogivaryapriyankari | yogivandya yogimata yogishaphaladayini || || yakshavandya
    yakshapujya yaksharajasupujita | yajnarupa yajnatushta yayajukasvarupini || || yantraradhya yantramadhya
    yantrakartripriyankari | yantrarudha yantrapujya yogidhyanaparayana || || yajaniya yamastutya yogayukta
    yashaskari | yogabaddha yatistutya yogajna yoganayaki || || yogijnanaprada yakshi yamabadhavinashini
    | yogikamyapradatri ca yogimokshapradayini || || phalashrutih iti namnam sarasvatyah sahasram samudiritam
    | mantratmakam mahagopyam mahasarasvatapradam || || yah pathecchrinuyadbhaktyattrikalam sadhakah puman
    | sarvavidyanidhih sakshat sa eva bhavati dhruvam || || labhate sampadah sarvah putrapautradisamyutah
    | muko'pi sarvavidyasu caturmukha ivaparah || || bhutva prapnoti sannidhyam ante dhaturmunishvara
    | sarvamantramayam sarvavidyamanaphalapradam || || mahakavitvadam pumsam mahasiddhipradayakam | kasmai
    cinna pradatavyam pranaih kanthagatairapi || || maharahasyam satatam vaninamasahasrakam | susiddhamasmadadinam
    stotram te samudiritam || || iti shriskandapuranantargata shrisanatkumara samhitayam narada sanatkumara
    samvade shri sarasvati sahasranama stotram sampurnam ||
  devanagari: ध्यानम् । श्रीमच्चन्दनचर्चितोज्ज्वलवपुः शुक्लाम्बरा मल्लिका मालालालित कुन्तला प्रविलसन्मुक्तावलीशोभना
    । सर्वज्ञाननिधानपुस्तकधरा रुद्राक्षमालाङ्किता वाग्देवी वदनाम्बुजे वसतु मे त्रैलोक्यमाता शुभा ॥ श्री
    नारद उवाच भगवन्परमेशान सर्वलोकैकनायक । कथं सरस्वती साक्षात्प्रसन्ना परमेष्ठिनः ॥ ॥ कथं देव्या महावाण्यास्सतत्प्राप
    सुदुर्लभम् । एतन्मे वद तत्त्वेन महायोगीश्वर प्रभो ॥ ॥ श्री सनत्कुमार उवाच साधु पृष्टं त्वया ब्रह्मन्
    गुह्याद्गुह्यमनुत्तमम् । मयानुगोपितं यत्नादिदानीं सत्प्रकाश्यते ॥ ॥ पुरा पितामहं दृष्ट्वा जगत्स्थावरजङ्गमम्
    । निर्विकारं निराभासं स्तम्भीभूतमचेतसम् ॥ ॥ सृष्ट्वा त्रैलोक्यमखिलं वागभावात्तथाविधम् । आधिक्याभावतः
    स्वस्य परमेष्ठी जगद्गुरुः ॥ ॥ दिव्यवर्षायुतं तेन तपो दुष्करमुत्तमम् । ततः कदाचित्सञ्जाता वाणी सर्वार्थशोभिता
    ॥ ॥ अहमस्मि महाविद्या सर्ववाचामधीश्वरी । मम नाम्नां सहस्रं तु उपदेक्ष्याम्यनुत्तमम् ॥ ॥ अनेन संस्तुता
    नित्यं पत्नी तव भवाम्यहम् । त्वया सृष्टं जगत्सर्वं वाणीयुक्तं भविष्यति ॥ ॥ इदं रहस्यं परमं मम नामसहस्रकम्
    । सर्वपापौघशमनं महासारस्वतप्रदम् ॥ ॥ महाकवित्वदं लोके वागीशत्वप्रदायकम् । त्वं वा परः पुमान्यस्तु
    स्तवेनाऽनेन तोषयेत् ॥ ॥ तस्याहं किङ्करी साक्षाद्भविष्यामि न संशयः । इत्युक्त्वान्तर्दधे वाणी तदारभ्य
    पितामहः ॥ ॥ स्तुत्वा स्तोत्रेण दिव्येन तत्पतित्वमवाप्तवान् । वाणीयुक्तं जगत्सर्वं तदारभ्याऽभवन्मुने
    ॥ ॥ तत्तेहं सम्प्रवक्ष्यामि शृणु यत्नेन नारद । सावधानमना भूत्वा क्षणं शुद्धो मुनीश्वरः ॥ ऐं वद वद
    वाग्वादिनी स्वाहा वाग्वाणी वरदा वन्द्या वरारोहा वरप्रदा । वृत्तिर्वागीश्वरी वार्ता वरा वागीशवल्लभा
    ॥ ॥ विश्वेश्वरी विश्ववन्द्या विश्वेशप्रियकारिणी । वाग्वादिनी च वाग्देवी वृद्धिदा वृद्धिकारिणी ॥ ॥
    वृद्धिर्वृद्धा विषघ्नी च वृष्टिर्वृष्टिप्रदायिनी । विश्वाराध्या विश्वमाता विश्वधात्री विनायका ॥ ॥
    विश्वशक्तिर्विश्वसारा विश्वा विश्वविभावरी । वेदान्तवेदिनी वेद्या वित्ता वेदत्रयात्मिका ॥ ॥ वेदज्ञा
    वेदजननी विश्वा विश्वविभावरी । वरेण्या वाङ्मयी वृद्धा विशिष्टप्रियकारिणी ॥ ॥ विश्वतोवदना व्याप्ता व्यापिनी
    व्यापकात्मिका । व्यालघ्नी व्यालभूषाङ्गी विरजा वेदनायिका ॥ ॥ वेदवेदान्तसंवेद्या वेदान्तज्ञानरूपिणी
    । विभावरी च विक्रान्ता विश्वामित्रा विधिप्रिया ॥ ॥ वरिष्ठा विप्रकृष्टा च विप्रवर्यप्रपूजिता । वेदरूपा
    वेदमयी वेदमूर्तिश्च वल्लभा ॥ ॐ ह्रीं गुरुरूपे मां गृह्ण गृह्ण ऐं वद वद वाग्वादिनी स्वाहा गौरी गुणवती
    गोप्या गन्धर्वनगरप्रिया । गुणमाता गुणान्तस्था गुरुरूपा गुरुप्रिया ॥ गुरुविद्या गानतुष्टा गायकप्रियकारिणी
    । गायत्री गिरीशाराध्या गीर्गिरीशप्रियङ्करी ॥ ॥ गिरिज्ञा ज्ञानविद्या च गिरिरूपा गिरीश्वरी । गीर्माता
    गणसंस्तुत्या गणनीयगुणान्विता ॥ ॥ गूढरूपा गुहा गोप्या गोरूपा गौर्गुणात्मिका । गुर्वी गुर्वम्बिका गुह्या
    गेयजा गृहनाशिनी ॥ ॥ गृहिणी गृहदोषघ्नी गवघ्नी गुरुवत्सला । गृहात्मिका गृहाराध्या गृहबाधाविनाशिनी ॥
    ॥ गङ्गा गिरिसुता गम्या गजयाना गुहस्तुता । गरुडासनसंसेव्या गोमती गुणशालिनी ॥ ॐ ऐं नमः शारदे श्रीं शुद्धे
    नमः शारदे वं ऐं वद वद वाग्वादिनी स्वाहा शारदा शाश्वती शैवी शाङ्करी शङ्करात्मिका । श्रीश्शर्वाणी शतघ्नी
    च शरच्चन्द्रनिभानना ॥ ॥ शर्मिष्ठा शमनघ्नी च शतसाहस्ररूपिणी । शिवा शम्भुप्रिया श्रद्धा श्रुतिरूपा श्रुतिप्रिया
    ॥ ॥ शुचिष्मती शर्मकरी शुद्धिदा शुद्धिरूपिणी । शिवा शिवङ्करी शुद्धा शिवाराध्या शिवात्मिका ॥ ॥ श्रीमती
    श्रीमयी श्राव्या श्रुतिः श्रवणगोचरा । शान्तिश्शान्तिकरी शान्ता शान्ताचारप्रियङ्करी ॥ ॥ शीललभ्या शीलवती
    श्रीमाता शुभकारिणी । शुभवाणी शुद्धविद्या शुद्धचित्तप्रपूजिता ॥ ॥ श्रीकरी श्रुतपापघ्नी शुभाक्षी शुचिवल्लभा
    । शिवेतरघ्नी शबरी श्रवणीयगुणान्विता ॥ शारी शिरीषपुष्पाभा शमनिष्ठा शमात्मिका । शमान्विता शमाराध्या
    शितिकण्ठप्रपूजिता ॥ ॥ शुद्धिः शुद्धिकरी श्रेष्ठा श्रुतानन्ता शुभावहा । सरस्वती च सर्वज्ञा सर्वसिद्धिप्रदायिनी
    ॥ ॐ ऐं वद वद वाग्वादिनी स्वाहा सरस्वती च सावित्री सन्ध्या सर्वेप्सितप्रदा । सर्वार्तिघ्नी सर्वमयी
    सर्वविद्याप्रदायिनी ॥ ॥ सर्वेश्वरी सर्वपुण्या सर्गस्थित्यन्तकारिणी । सर्वाराध्या सर्वमाता सर्वदेवनिषेविता
    ॥ ॥ सर्वैश्वर्यप्रदा सत्या सती सत्वगुणाश्रया । सर्वक्रमपदाकारा सर्वदोषनिषूदिनी ॥ सहस्राक्षी सहस्रास्या
    सहस्रपदसंयुता । सहस्रहस्ता साहस्रगुणालङ्कृतविग्रहा ॥ ॥ सहस्रशीर्षा सद्रूपा स्वधा स्वाहा सुधामयी ।
    षड्ग्रन्थिभेदिनी सेव्या सर्वलोकैकपूजिता ॥ ॥ स्तुत्या स्तुतिमयी साध्या सवितृप्रियकारिणी । संशयच्छेदिनी
    साङ्ख्यवेद्या सङ्ख्या सदीश्वरी ॥ ॥ सिद्धिदा सिद्धसम्पूज्या सर्वसिद्धिप्रदायिनी । सर्वज्ञा सर्वशक्तिश्च
    सर्वसम्पत्प्रदायिनी ॥ ॥ सर्वाऽशुभघ्नी सुखदा सुखसंवित्स्वरूपिणी । सर्वसम्भाषणी सर्वजगत्सम्मोहिनी तथा
    ॥ सर्वप्रियङ्करी सर्वशुभदा सर्वमङ्गला । सर्वमन्त्रमयी सर्वतीर्थपुण्यफलप्रदा ॥ ॥ सर्वपुण्यमयी सर्वव्याधिघ्नी
    सर्वकामदा । सर्वविघ्नहरी सर्ववन्दिता सर्वमङ्गला ॥ ॥ सर्वमन्त्रकरी सर्वलक्ष्मीः सर्वगुणान्विता । सर्वानन्दमयी
    सर्वज्ञानदा सत्यनायिका ॥ ॥ सर्वज्ञानमयी सर्वराज्यदा सर्वमुक्तिदा । सुप्रभा सर्वदा सर्वा सर्वलोकवशङ्करी
    ॥ ॥ सुभगा सुन्दरी सिद्धा सिद्धाम्बा सिद्धमातृका । सिद्धमाता सिद्धविद्या सिद्धेशी सिद्धरूपिणी ॥ ॥ सुरूपिणी
    सुखमयी सेवकप्रियकारिणी । स्वामिनी सर्वदा सेव्या स्थूलसूक्ष्मापराम्बिका ॥ ॥ साररूपा सरोरूपा सत्यभूता
    समाश्रया । सिताऽसिता सरोजाक्षी सरोजासनवल्लभा ॥ ॥ सरोरुहाभा सर्वाङ्गी सुरेन्द्रादिप्रपूजिता । ॐ ह्रीं
    ऐं महासरस्वति सारस्वतप्रदे ऐं वद वद वाग्वादिनी स्वाहा महादेवी महेशानी महासारस्वतप्रदा ॥ ॥ महासरस्वती
    मुक्ता मुक्तिदा मोहनाशिनी । महेश्वरी महानन्दा महामन्त्रमयी मही ॥ ॥ महालक्ष्मीर्महाविद्या माता मन्दरवासिनी
    । मन्त्रगम्या मन्त्रमाता महामन्त्रफलप्रदा ॥ ॥ महामुक्तिर्महानित्या महासिद्धिप्रदायिनी । महासिद्धा
    महामाता महदाकारसंयुता ॥ ॥ मही महेश्वरी मूर्तिर्मोक्षदा मणिभूषणा । मेनका मानिनी मान्या मृत्युघ्नी मेरुरूपिणी
    ॥ ॥ मदिराक्षी मदावासा मखरूपा मखेश्वरी । महामोहा महामाया मातॄणां मूर्ध्निसंस्थिता ॥ ॥ महापुण्या मुदावासा
    महासम्पत्प्रदायिनी । मणिपूरैकनिलया मधुरूपा मदोत्कटा ॥ महासूक्ष्मा महाशान्ता महाशान्तिप्रदायिनी । मुनिस्तुता
    मोहहन्त्री माधवी माधवप्रिया ॥ ॥ मा महादेवसंस्तुत्या महिषीगणपूजिता । मृष्टान्नदा च माहेन्द्री महेन्द्रपददायिनी
    ॥ ॥ मतिर्मतिप्रदा मेधा मर्त्यलोकनिवासिनी । मुख्या महानिवासा च महाभाग्यजनाश्रिता ॥ ॥ महिला महिमा मृत्युहारी
    मेधाप्रदायिनी । मेध्या महावेगवती महामोक्षफलप्रदा ॥ ॥ महाप्रभाभा महती महादेवप्रियङ्करी । महापोषा महर्थिश्च
    मुक्ताहारविभूषणा ॥ माणिक्यभूषणा मन्त्रा मुख्यचन्द्रार्धशेखरा । मनोरूपा मनश्शुद्धिः मनश्शुद्धिप्रदायिनी
    ॥ ॥ महाकारुण्यसम्पूर्णा मनोनमनवन्दिता । महापातकजालघ्नी मुक्तिदा मुक्तभूषणा ॥ ॥ मनोन्मनी महास्थूला
    महाक्रतुफलप्रदा । महापुण्यफलप्राप्या मायात्रिपुरनाशिनी ॥ ॥ महानसा महामेधा महामोदा महेश्वरी । मालाधरी
    महोपाया महातीर्थफलप्रदा ॥ ॥ महामङ्गलसम्पूर्णा महादारिद्र्यनाशिनी । महामखा महामेघा महाकाली महाप्रिया
    ॥ ॥ महाभूषा महादेहा महाराज्ञी मुदालया । ॐ ह्रीं ऐं नमो भगवति ऐं वद वद वाग्वादिनी स्वाहा भूरिदा भाग्यदा
    भोग्या भोग्यदा भोगदायिनी ॥ ॥ भवानी भूतिदा भूतिः भूमिर्भूमिसुनायिका । भूतधात्री भयहरी भक्तसारस्वतप्रदा
    ॥ ॥ भुक्तिर्भुक्तिप्रदा भोक्त्री भक्तिर्भक्तिप्रदायिनी । भक्तसायुज्यदा भक्तस्वर्गदा भक्तराज्यदा ॥
    ॥ भागीरथी भवाराध्या भाग्यासज्जनपूजिता । भवस्तुत्या भानुमती भवसागरतारिणी ॥ ॥ भूतिर्भूषा च भूतेशी भाललोचनपूजिता
    । भूता भव्या भविष्या च भवविद्या भवात्मिका ॥ ॥ बाधापहारिणी बन्धुरूपा भुवनपूजिता । भवघ्नी भक्तिलभ्या
    च भक्तरक्षणतत्परा ॥ ॥ भक्तार्तिशमनी भाग्या भोगदानकृतोद्यमा । भुजङ्गभूषणा भीमा भीमाक्षी भीमरूपिणी ॥
    ॥ भाविनी भ्रातृरूपा च भारती भवनायिका । भाषा भाषावती भीष्मा भैरवी भैरवप्रिया ॥ ॥ भूतिर्भासितसर्वाङ्गी
    भूतिदा भूतिनायिका । भास्वती भगमाला च भिक्षादानकृतोद्यमा ॥ ॥ भिक्षुरूपा भक्तिकरी भक्तलक्ष्मीप्रदायिनी
    । भ्रान्तिघ्ना भ्रान्तिरूपा च भूतिदा भूतिकारिणी ॥ ॥ भिक्षणीया भिक्षुमाता भाग्यवद्दृष्टिगोचरा । भोगवती
    भोगरूपा भोगमोक्षफलप्रदा ॥ ॥ भोगश्रान्ता भाग्यवती भक्ताघौघविनाशिनी । ॐ ऐं क्लीं सौः बाले ब्राह्मी ब्रह्मपत्नी
    ऐं वद वद वाग्वादिनी स्वाहा ब्राह्मी ब्रह्मस्वरूपा च बृहती ब्रह्मवल्लभा ॥ ॥ ब्रह्मदा ब्रह्ममाता च ब्रह्माणी
    ब्रह्मदायिनी । ब्रह्मेशी ब्रह्मसंस्तुत्या ब्रह्मवेद्या बुधप्रिया ॥ ॥ बालेन्दुशेखरा बाला बलिपूजाकरप्रिया
    । बलदा बिन्दुरूपा च बालसूर्यसमप्रभा ॥ ॥ ब्रह्मरूपा ब्रह्ममयी ब्रध्नमण्डलमध्यगा । ब्रह्माणी बुद्धिदा
    बुद्धिर्बुद्धिरूपा बुधेश्वरी ॥ ॥ बन्धक्षयकरी बाधानाशिनी बन्धुरूपिणी । बिन्द्वालया बिन्दुभूषा बिन्दुनादसमन्विता
    ॥ ॥ बीजरूपा बीजमाता ब्रह्मण्या ब्रह्मकारिणी । बहुरूपा बलवती ब्रह्मज्ञा ब्रह्मचारिणी ॥ ब्रह्मस्तुत्या
    ब्रह्मविद्या ब्रह्माण्डाधिपवल्लभा । ब्रह्मेशविष्णुरूपा च ब्रह्मविष्ण्वीशसंस्थिता ॥ ॥ बुद्धिरूपा बुधेशानी
    बन्धी बन्धविमोचनी । ॐ ह्रीं ऐं अं आं इं ईं उं ऊं ऋं ॠं लूं एं ऐं ॐ औं कं खं गं घं ङं चं छं जं झं ञं
    टं ठं डं ढं णं तं थं दं धं नं पं फं बं भं मं यं रं लं वं शं षं सं हं लं क्षं अक्षमाले अक्षरमालिका
    समलङ्कृते वद वद वाग्वादिनी स्वाहा अक्षमालाऽक्षराकाराऽक्षराऽक्षरफलप्रदा ॥ ॥ अनन्ताऽनन्दसुखदाऽनन्तचन्द्रनिभानना
    । अनन्तमहिमाऽघोरानन्तगम्भीरसम्मिता ॥ ॥ अदृष्टाऽदृष्टदाऽनन्तादृष्टभाग्यफलप्रदा । अरुन्धत्यव्ययीनाथाऽनेकसद्गुणसंयुता
    ॥ ॥ अनेकभूषणाऽदृश्याऽनेकलेखनिषेविता । अनन्ताऽनन्तसुखदाऽघोराऽघोरस्वरूपिणी ॥ ॥ अशेषदेवतारूपाऽमृतरूपाऽमृतेश्वरी
    । अनवद्याऽनेकहस्ताऽनेकमाणिक्यभूषणा ॥ ॥ अनेकविघ्नसंहर्त्री त्वनेकाभरणान्विता । अविद्याज्ञानसंहर्त्री
    ह्यविद्याजालनाशिनी ॥ ॥ अभिरूपानवद्याङ्गी ह्यप्रतर्क्यगतिप्रदा । अकलङ्करूपिणी च ह्यनुग्रहपरायणा ॥ ॥
    अम्बरस्थाऽम्बरमयाऽम्बरमालाऽम्बुजेक्षणा । अम्बिकाऽब्जकराऽब्जस्थाऽंशुमत्यऽंशुशतान्विता ॥ ॥ अम्बुजाऽनवराऽखण्डाऽम्बुजासनमहाप्रिया
    । अजराऽमरसंसेव्याऽजरसेवितपद्युगा ॥ ॥ अतुलार्थप्रदाऽर्थैक्याऽत्युदारात्वभयान्विता । अनाथवत्सलाऽनन्तप्रियाऽनन्तेप्सितप्रदा
    ॥ ॥ अम्बुजाक्ष्यम्बुरूपाऽम्बुजातोद्भवमहाप्रिया । अखण्डा त्वमरस्तुत्याऽमरनायकपूजिता ॥ ॥ अजेया त्वजसङ्काशाऽज्ञाननाशिन्यभीष्टदा
    । अक्ताघनेन चाऽस्त्रेशी ह्यलक्ष्मीनाशिनी तथा ॥ ॥ अनन्तसाराऽनन्तश्रीरनन्तविधिपूजिता । अभीष्टामर्त्यसम्पूज्या
    ह्यस्तोदयविवर्जिता ॥ ॥ आस्तिकस्वान्तनिलयाऽस्त्ररूपाऽस्त्रवती तथा । अस्खलत्यस्खलद्रूपाऽस्खलद्विद्याप्रदायिनी
    ॥ ॥ अस्खलत्सिद्धिदाऽऽनन्दाऽम्बुजाताऽऽमरनायिका । अमेयाऽशेषपापघ्न्यक्षयसारस्वतप्रदा ॥ ॐ ज्यां ह्रीं
    जय जय जगन्मातः ऐं वद वद वाग्वादिनी स्वाहा जया जयन्ती जयदा जन्मकर्मविवर्जिता । जगत्प्रिया जगन्माता
    जगदीश्वरवल्लभा ॥ ॥ जातिर्जया जितामित्रा जप्या जपनकारिणी । जीवनी जीवनिलया जीवाख्या जीवधारिणी ॥ ॥ जाह्नवी
    ज्या जपवती जातिरूपा जयप्रदा । जनार्दनप्रियकरी जोषनीया जगत्स्थिता ॥ ॥ जगज्ज्येष्ठा जगन्माया जीवनत्राणकारिणी
    । जीवातुलतिका जीवजन्मी जन्मनिबर्हणी ॥ ॥ जाड्यविध्वंसनकरी जगद्योनिर्जयात्मिका । जगदानन्दजननी जम्बूश्च
    जलजेक्षणा ॥ ॥ जयन्ती जङ्गपूगघ्नी जनितज्ञानविग्रहा । जटा जटावती जप्या जपकर्तृप्रियङ्करी ॥ ॥ जपकृत्पापसंहर्त्री
    जपकृत्फलदायिनी । जपापुष्पसमप्रख्या जपाकुसुमधारिणी ॥ ॥ जननी जन्मरहिता ज्योतिर्वृत्यभिदायिनी । जटाजूटनचन्द्रार्धा
    जगत्सृष्टिकरी तथा ॥ ॥ जगत्त्राणकरी जाड्यध्वंसकर्त्री जयेश्वरी । जगद्बीजा जयावासा जन्मभूर्जन्मनाशिनी
    ॥ ॥ जन्मान्त्यरहिता जैत्री जगद्योनिर्जपात्मिका । जयलक्षणसम्पूर्णा जयदानकृतोद्यमा ॥ ॥ जम्भराद्यादिसंस्तुत्या
    जम्भारिफलदायिनी । जगत्त्रयहिता ज्येष्ठा जगत्त्रयवशङ्करी ॥ ॥ जगत्त्रयाम्बा जगती ज्वाला ज्वालितलोचना
    । ज्वालिनी ज्वलनाभासा ज्वलन्ती ज्वलनात्मिका ॥ ॥ जितारातिसुरस्तुत्या जितक्रोधा जितेन्द्रिया । जरामरणशून्या
    च जनित्री जन्मनाशिनी ॥ ॥ जलजाभा जलमयी जलजासनवल्लभा । जलजस्था जपाराध्या जनमङ्गलकारिणी ॥ ऐं क्लीं सौः
    कल्याणी कामधारिणी वद वद वाग्वादिनी स्वाहा कामिनी कामरूपा च काम्या काम्यप्रदायिनी । कमौली कामदा कर्त्री
    क्रतुकर्मफलप्रदा ॥ ॥ कृतघ्नघ्नी क्रियारूपा कार्यकारणरूपिणी । कञ्जाक्षी करुणारूपा केवलामरसेविता ॥ ॥
    कल्याणकारिणी कान्ता कान्तिदा कान्तिरूपिणी । कमला कमलावासा कमलोत्पलमालिनी ॥ ॥ कुमुद्वती च कल्याणी कान्तिः
    कामेशवल्लभा । कामेश्वरी कमलिनी कामदा कामबन्धिनी ॥ ॥ कामधेनुः काञ्चनाक्षी काञ्चनाभा कलानिधिः । क्रिया
    कीर्तिकरी कीर्तिः क्रतुश्रेष्ठा कृतेश्वरी ॥ ॥ क्रतुसर्वक्रियास्तुत्या क्रतुकृत्प्रियकारिणी । क्लेशनाशकरी
    कर्त्री कर्मदा कर्मबन्धिनी ॥ ॥ कर्मबन्धहरी कृष्टा क्लमघ्नी कञ्जलोचना । कन्दर्पजननी कान्ता करुणा करुणावती
    ॥ ॥ क्लीङ्कारिणी कृपाकारा कृपासिन्धुः कृपावती । करुणार्द्रा कीर्तिकरी कल्मषघ्नी क्रियाकरी ॥ ॥ क्रियाशक्तिः
    कामरूपा कमलोत्पलगन्धिनी । कला कलावती कूर्मी कूटस्था कञ्जसंस्थिता ॥ ॥ कालिका कल्मषघ्नी च कमनीयजटान्विता
    । करपद्मा कराभीष्टप्रदा क्रतुफलप्रदा ॥ ॥ कौशिकी कोशदा काव्या कर्त्री कोशेश्वरी कृशा । कूर्मयाना कल्पलता
    कालकूटविनाशिनी ॥ ॥ कल्पोद्यानवती कल्पवनस्था कल्पकारिणी । कदम्बकुसुमाभासा कदम्बकुसुमप्रिया ॥ ॥ कदम्बोद्यानमध्यस्था
    कीर्तिदा कीर्तिभूषणा । कुलमाता कुलावासा कुलाचारप्रियङ्करी ॥ ॥ कुलनाथा कामकला कलानाथा कलेश्वरी । कुन्दमन्दारपुष्पाभा
    कपर्दस्थितचन्द्रिका ॥ ॥ कवित्वदा काम्यमाता कविमाता कलाप्रदा । ॐ सौः क्लीं ऐं ततो वद वद वाग्वादिनी
    स्वाहा तरुणी तरुणीताता ताराधिपसमानना ॥ ॥ तृप्तिस्तृप्तिप्रदा तर्क्या तपनी तापिनी तथा । तर्पणी तीर्थरूपा
    च त्रिपदा त्रिदशेश्वरी ॥ त्रिदिवेशी त्रिजननी त्रिमाता त्र्यम्बकेश्वरी । त्रिपुरा त्रिपुरेशानी त्र्यम्बका
    त्रिपुराम्बिका ॥ ॥ त्रिपुरश्रीस्त्रयीरूपा त्रयीवेद्या त्रयीश्वरी । त्रय्यन्तवेदिनी ताम्रा तापत्रितयहारिणी
    ॥ ॥ तमालसदृशी त्राता तरुणादित्यसन्निभा । त्रैलोक्यव्यापिनी तृप्ता तृप्तिकृत्तत्त्वरूपिणी ॥ ॥ तुर्या
    त्रैलोक्यसंस्तुत्या त्रिगुणा त्रिगुणेश्वरी । त्रिपुरघ्नी त्रिमाता च त्र्यम्बका त्रिगुणान्विता ॥ ॥
    तृष्णाच्छेदकरी तृप्ता तीक्ष्णा तीक्ष्णस्वरूपिणी । तुला तुलादिरहिता तत्तद्ब्रह्मस्वरूपिणी ॥ ॥ त्राणकर्त्री
    त्रिपापघ्नी त्रिदशा त्रिदशान्विता । तथ्या त्रिशक्तिस्त्रिपदा तुर्या त्रैलोक्यसुन्दरी ॥ ॥ तेजस्करी
    त्रिमूर्त्याद्या तेजोरूपा त्रिधामता । त्रिचक्रकर्त्री त्रिभगा तुर्यातीतफलप्रदा ॥ ॥ तेजस्विनी तापहारी
    तापोपप्लवनाशिनी । तेजोगर्भा तपस्सारा त्रिपुरारिप्रियङ्करी ॥ ॥ तन्वी तापससन्तुष्टा तपनाङ्गजभीतिनुत्
    । त्रिलोचना त्रिमार्गा च तृतीया त्रिदशस्तुता ॥ ॥ त्रिसुन्दरी त्रिपथगा तुरीयपददायिनी । ॐ ह्रीं श्रीं
    क्लीं ऐं नमश्शुद्धफलदे ऐं वद वद वाग्वादिनी स्वाहा शुभा शुभावती शान्ता शान्तिदा शुभदायिनी ॥ ॥ शीतला
    शूलिनी शीता श्रीमती च शुभान्विता । ॐ ऐं यां यीं यूं यैं यौं यः ऐं वद वद वाग्वादिनी स्वाहा योगसिद्धिप्रदा
    योग्या यज्ञेनपरिपूरिता ॥ ॥ यज्ञा यज्ञमयी यक्षी यक्षिणी यक्षिवल्लभा । यज्ञप्रिया यज्ञपूज्या यज्ञतुष्टा
    यमस्तुता ॥ ॥ यामिनीयप्रभा याम्या यजनीया यशस्करी । यज्ञकर्त्री यज्ञरूपा यशोदा यज्ञसंस्तुता ॥ ॥ यज्ञेशी
    यज्ञफलदा योगयोनिर्यजुस्स्तुता । यमिसेव्या यमाराध्या यमिपूज्या यमीश्वरी ॥ ॥ योगिनी योगरूपा च योगकर्तृप्रियङ्करी
    । योगयुक्ता योगमयी योगयोगीश्वराम्बिका ॥ ॥ योगज्ञानमयी योनिर्यमाद्यष्टाङ्गयोगता । यन्त्रिताघौघसंहारा
    यमलोकनिवारिणी ॥ ॥ यष्टिव्यष्टीशसंस्तुत्या यमाद्यष्टाङ्गयोगयुक् । योगीश्वरी योगमाता योगसिद्धा च योगदा
    ॥ ॥ योगारूढा योगमयी योगरूपा यवीयसी । यन्त्ररूपा च यन्त्रस्था यन्त्रपूज्या च यन्त्रिका ॥ युगकर्त्री
    युगमयी युगधर्मविवर्जिता । यमुना यामिनी याम्या यमुनाजलमध्यगा ॥ यातायातप्रशमनी यातनानान्निकृन्तनी ।
    योगावासा योगिवन्द्या यत्तच्छब्दस्वरूपिणी ॥ ॥ योगक्षेममयी यन्त्रा यावदक्षरमातृका । यावत्पदमयी यावच्छब्दरूपा
    यथेश्वरी ॥ ॥ यत्तदीया यक्षवन्द्या यद्विद्या यतिसंस्तुता । यावद्विद्यामयी यावद्विद्याबृन्दसुवन्दिता
    ॥ ॥ योगिहृत्पद्मनिलया योगिवर्यप्रियङ्करी । योगिवन्द्या योगिमाता योगीशफलदायिनी ॥ ॥ यक्षवन्द्या यक्षपूज्या
    यक्षराजसुपूजिता । यज्ञरूपा यज्ञतुष्टा यायजूकस्वरूपिणी ॥ ॥ यन्त्राराध्या यन्त्रमध्या यन्त्रकर्तृप्रियङ्करी
    । यन्त्रारूढा यन्त्रपूज्या योगिध्यानपरायणा ॥ ॥ यजनीया यमस्तुत्या योगयुक्ता यशस्करी । योगबद्धा यतिस्तुत्या
    योगज्ञा योगनायकी ॥ ॥ योगिज्ञानप्रदा यक्षी यमबाधाविनाशिनी । योगिकाम्यप्रदात्री च योगिमोक्षप्रदायिनी
    ॥ ॥ फलश्रुतिः इति नाम्नां सरस्वत्याः सहस्रं समुदीरितम् । मन्त्रात्मकं महागोप्यं महासारस्वतप्रदम् ॥
    ॥ यः पठेच्छृणुयाद्भक्त्यात्त्रिकालं साधकः पुमान् । सर्वविद्यानिधिः साक्षात् स एव भवति ध्रुवम् ॥ ॥
    लभते सम्पदः सर्वाः पुत्रपौत्रादिसंयुताः । मूकोऽपि सर्वविद्यासु चतुर्मुख इवापरः ॥ ॥ भूत्वा प्राप्नोति
    सान्निध्यं अन्ते धातुर्मुनीश्वर । सर्वमन्त्रमयं सर्वविद्यामानफलप्रदम् ॥ ॥ महाकवित्वदं पुंसां महासिद्धिप्रदायकम्
    । कस्मै चिन्न प्रदातव्यं प्राणैः कण्ठगतैरपि ॥ ॥ महारहस्यं सततं वाणीनामसहस्रकम् । सुसिद्धमस्मदादीनां
    स्तोत्रं ते समुदीरितम् ॥ ॥ इति श्रीस्कान्दपुराणान्तर्गत श्रीसनत्कुमार संहितायां नारद सनत्कुमार संवादे
    श्री सरस्वती सहस्रनाम स्तोत्रं सम्पूर्णम् ॥
