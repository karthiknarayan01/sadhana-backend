id: narayana-ashtakshari-stuti
category: stotram
name:
  english: Narayana Ashtakshari Stuti
content:
  english: om namah pranavarthartha sthulasukshma ksharakshara vyaktavyakta kalatita onkaraya namo namah
    || || namo devadidevaya dehasancarahetave daityasanghavinashaya nakaraya namo namah || || mohanam
    vishvarupam ca shishtacarasuposhitam mohavidhvamsakam vande mokaraya namo namah || || narayanaya navyaya
    narasimhaya namine nadaya nadine tubhyam nakaraya namo namah || || ramacandram raghupatim pitrajnaparipalakam
    kausalyatanayam vande rakaraya namo namah || || yajnaya yajnagamyaya yajnarakshakaraya ca yajnangarupine
    tubhyam yakaraya namo namah || || nakaram lokavikhyatam nanajanmaphalapradam nanabhishtapradam vande
    nakaraya namo namah || || yajnakartre yajnabhartre yajnarupaya te namah sujnanagocaraya'stu yakaraya
    namo namah || || iti shri narayana ashtakshari stutih |
  devanagari: ॐ नमः प्रणवार्थार्थ स्थूलसूक्ष्म क्षराक्षर व्यक्ताव्यक्त कलातीत ओङ्काराय नमो नमः ॥ ॥ नमो
    देवादिदेवाय देहसञ्चारहेतवे दैत्यसङ्घविनाशाय नकाराय नमो नमः ॥ ॥ मोहनं विश्वरूपं च शिष्टाचारसुपोषितम्
    मोहविध्वंसकं वन्दे मोकाराय नमो नमः ॥ ॥ नारायणाय नव्याय नरसिंहाय नामिने नादाय नादिने तुभ्यं नाकाराय
    नमो नमः ॥ ॥ रामचन्द्रं रघुपतिं पित्राज्ञापरिपालकम् कौसल्यातनयं वन्दे राकाराय नमो नमः ॥ ॥ यज्ञाय यज्ञगम्याय
    यज्ञरक्षाकराय च यज्ञाङ्गरूपिणे तुभ्यं यकाराय नमो नमः ॥ ॥ णाकारं लोकविख्यातं नानाजन्मफलप्रदम् नानाभीष्टप्रदं
    वन्दे णाकाराय नमो नमः ॥ ॥ यज्ञकर्त्रे यज्ञभर्त्रे यज्ञरूपाय ते नमः सुज्ञानगोचरायाऽस्तु यकाराय नमो
    नमः ॥ ॥ इति श्री नारायण अष्टाक्षरी स्तुतिः ।
