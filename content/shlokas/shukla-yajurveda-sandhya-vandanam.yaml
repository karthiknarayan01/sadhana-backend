    शृणु॑याम श॒रद॑श्श॒तम् ॥ म्मे वरुण तत्वायामीत्यनयोश्शुनश्शेफ ऋषिः गायत्री त्रिष्टुभौ छन्दसि सूर्योपस्धाने
    विनियोगः ॥ ॐ इ॒म म्मे॑ वरुण श्रुधी॒हव॑म॒द्या च॑ मृलय । त्वाम॑व॒स्युराच॑के ॥ ओ न्तत्वा॑यामि॒ ब्रह्म॑णा॒
    वन्द॑मान॒स्तदाशा॑स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑लमानो वरुणे॒ हबो॒ध्युरु॑शग्ं स॒ मा न॒ आयुः॒ प्रमो॑षीः
    ॥ ॥ गायत्री ॥ आचम्य ॥ उग्रभूतपिशाचास्ते इत्येते भूमि भारकाः । भूतानामविरोधेन ब्रह्म कर्म समारभे ॥
    पूर्वोक्त एव ङ्गुण विशेषण विशिष्टायां शुभतिथौ यथा शक्ति प्रातः सायं सन्ध्याङ्ग गायत्री मन्त्र जप ङ्करिष्ये
    ॥ गायत्र्यावाहनम् । ॐ ओजो॑ ऽसि॒ बलम॑सि॒ भ्राजो॑ न्धाम॒नामा॑सि विश्व॑मसि वि॒श्वायु॒ स्सर्व॑मसि स॒र्वायुरभिभूरोम्
    । गायत्रीमावा॑हया॒मि॒ । सावित्रीमावा॑हया॒मि॒ । सरस्वतीमावा॑हया॒मि॒ । छन्दर् षीनावा॑हया॒मि॒ । श्रियमावा॑हया॒मि॒
    ॥ गा॒यत्र्या गायत्री छन्दो विश्वामित्र ऋषि स्सविता देवता अग्निर्मुख म्ब्रह्माशिरः विष्णुर् हृदयग्ं
    रुद्रश्शिखा पृथिवी योनिः प्राणापानव्यानोदान समानास्सप्राणा श्श्वेतवर्णा साङ्ख्यायन सगोत्रा गायत्री
    चतुर्विग् ंशत्यक्षरा त्रिपदा॑ षट्कु॒क्षिः॒ पञ्चशीर् षोपनयने वि॑नियो॒गः॒ ॥ आयात्वित्यनुवाकस्य गायत्र्यावाहने
    विनियोगः ॥ ॐ आया॑तु॒ वर॑दा दे॒वी॒ अ॒क्षर॑ म्ब्रह्म॒ सम्मि॑तम् । गा॒य॒त्री॑ म्ब्र॑ह्म जु॒षस्व॑ नः ।
    तेजो गायत्र्यावाहने विनियोगः ॥ ओ ऽसि शु॒क्रम॒मृत॑मायु॒ष्पा आयु॑र्मेपाहि । दे॒वस्य॑त्वा सवि॒तुः प्र॑स॒वे॒
    ऽश्विनो॑र्बा॒हुभ्या॑ म्पू॒ष्णो हस्ता॑भ्या॒माद॑धे ॥ प्रार्थन ॥ गायत्र्यस्येकपदी द्विपदी त्रिपदी चतुष्पद्य
    पदसि न हि पद्यसे । नमस्ते तुरीयाय दर् शताय पदाय परोरजसेसावदो मा प्रापत् । आवहनीयाग्निरूपस्थाना प्रातस्सवने
    ऋग्वेदे विनियोगः । माध्याह्निक सवने यजुर्वेदे विनियोगः । दक्षिणाग्निरूपस्थाना सायंसवने सामवेदे विनियोगः
    । आगच्छ वरदे देवि जपे मे सन्निधौ भव । गायन्त न्त्रायसे यस्माद्गायत्री त्वमुदाहृता ॥ न्यासम् ॥ ओ म्भुवरिति
    जङ्घयोः । ओग्ग् ं स्वरिति जान्वोः । ओ न्तप इति मुखे । ओग्ग् ं सत्यमिति शिरसि । ओ न्तत्सवितुर्वरेण्यं
    अनामिकाभ्या म्भर्गो देवस्य धीमहि कनिष्ठिकाभ्या न्धियो यो नः प्रचोदया म्भूः हृदयाय नमः । ओ श्शिरसे
    स्वाहा । ओग्ं स्व म्भर्गो देवस्य धीमहि नेत्रत्रयाय वौषट् । ओ न्धियो यो नः प्रचोदयात् अस्त्राय फट्
    । ओ म्भूर्भवस्स्वरोमिति दिग्बन्धः । गायत्री ध्यानम् ॥ मुक्ताविद्रुमहेमनीलधवल च्छायैर्मुखैस्त्रीक्षणैः
    । युक्तामिन्दुनिबद्धरत्नमकुटा न्तत्त्वार्थ वर्णात्मिकाम् ॥ गायत्रीं ऽरविन्दयुगलं हस्तैर्वहन्ती म्भजे
    ॥ लमित्यादि पञ्चपूजा ॥ ल म्पृथिवीतत्त्वात्मिकायै गायत्री देवतायै नमः । गन्ध म्परिकल्पयामि ॥ हं आकाशतत्त्वात्मिकायै
    गायत्री देवतायै नमः । पुष्प वाँयुतत्त्वात्मिकायै गायत्री देवतायै नमः । धूप वँह्नितत्त्वात्मिकायै गायत्री
    देवतायै नमः । दीप म्परिकल्पयामि ॥ वं अमृततत्त्वात्मिकायै गायत्री देवतायै नमः । नैवेद्य म्परिकल्पयामि
    ॥ सं सर्वतत्त्वात्मिकायै गायत्री देवतायैनमः । सर्वोपचारा न्परिकल्पयामि॥ प्रणवस्य परब्रह्म ऋषिः दैवी
    गायत्री छन्दः । भूर्भुवस्स्वरिति महाव्याहृतीना म्परमेष्ठी प्रजापति ऋषिः गायत्र्युष्णिगनुष्टु प्छन्दांसि
    । गायत्र्या विश्वामित्र ऋषिः गायत्री छन्दः । गायत्री मुद्रलु ॥ सुमुखं सम्पुट ञ्चैव व्यापिकाञ्जलिक
    ञ्च ग्रथितं सम्मुखोन्मुखम् ॥ प्रलम्ब ञ्चैव मत्स्यः कूर्मो वराहकम् । सिंहाक्रान्त न्तथा ॥ गायत्री मन्त्रम्
    ॥ ओ म्भूर्भुव॒स्स्वः॑ । तत्स॑वि॒तुर्वरे॑ण्य॒ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचो॒दया॑त् ॥
    ॥ मन्त्र जपावसानम् ॥ पूर्वोक्त एव ङ्गुण विशेषण विशिष्टायां शुभ तिथौ गायत्री जपोपसंहार ङ्करिष्ये ।
    अस्य श्री गायत्री महामन्त्रस्य मम जपोपसंहारे विनियोगः । ओ म्भुवरिति जङ्घयोः । ओग्ग् ं स्वरिति जान्वोः
    । ओ न्तप इति मुखे । ओग्ग् ं सत्यमिति शिरसि । ओ न्तत्सवितुर्वरेण्यं अनामिकाभ्या म्भर्गो देवस्य धीमहि
    कनिष्ठिकाभ्या न्धियो यो नः प्रचोदया म्भूः हृदयाय नमः । ओ श्शिरसे स्वाहा । ओग्ं स्व म्भर्गो देवस्य
    धीमहि नेत्रत्रयाय वौषट् । ओ न्धियो यो नः प्रचोदयात् अस्त्राय फट् । भूर्भुवस्स्वरोमिति दिग्विमोकः ।
    उत्तर मुद्रलु ॥ सुरभिः ज्ञान चक्रे च योनिः कूर्मो न्निर्याण मुद्रा चेत्यष्टमुद्राः प्रकीर्तिताः ।
    ॥ गायत्री तर्पणम् ॥ पूर्वोक्त एव ङ्गुण विशेषण विशिष्ठायां शुभ तिथौ सवितृप्रीति योगाय गायत्री तर्पणमह
    ङ्करिष्ये । ऋषिर्व्यास स्समुद्दिष्टो ब्रह्मादैव तमुच्यते । छन्दो गायत्रक ञ्चैव विनियोगस्तु तर्पणे
    ॥ ओ म्भूः पुरुष ऋग्वेदस्तृप्यताम् ओ म्भुवः पुरुष यजुर्वेदस्तृप्यताम् ओग्ग् ं स्वः पुरुष सामवेदस्तृप्यताम्
    ओ म्महः पुरुष अथर्वणवेदस्तृप्यताम् ओ ञ्जनः पुरुष इतिहासपुराणस्तृप्यताम् ओ न्तपः पुरुष सर्वागमस्तृप्यताम्
    ॐ सत्य म्पुरुष सत्यलोकस्तृप्यताम् ओ स्स्वः पुरुष मण्डलान्तर्गतस्तृप्यताम् ओ म्भूरेकपदा गायत्री तृप्यताम्
    ओ म्भुवः द्विपदा गायत्री तृप्यताम् ओग् ं स्वः त्रिपदा गायत्री तृप्यताम् ओ श्चतुष्पदा गायत्री तृप्यताम्
    ॐ उषस्तृप्यताम् ओ ङ्गायत्री तृप्यताम् ॐ सावित्री तृप्यताम् ॐ सरस्वती तृप्यताम् ॐ वेँदमाता तृप्यताम्
    ओ म्पृथिवी तृप्यताम् ओ ङ्कौशिकी तृप्यताम् ॐ साङ्कृति तृप्यताम् ॐ सर्वापराजिता तृप्यताम् ॐ सहस्रमूर्तिस्तृप्यताम्
    ॐ आनन्दमूर्तिस्तृप्यताम् । ॥ दिङ्नमस्कारः ॥ ओ म्प्राच्यै दिशे नमः । इन्द्राय नमः । ॐ आग्नेयै दिशे
    नमः । अग्नये नमः । ओ न्दक्षिणायै दिशे नमः । यमाय नमः । ओ ऋत्यै दिशे नमः । निर् म्प्रतीच्यै दिशे नमः
    । वरुणाय नमः । ॐ वाँयुव्यै दिशे नमः । वायवे नमः । ॐ उदीच्यै दिशे नमः । कुबेराय नमः । ॐ ईशान्यै दिशे
    नमः । ईश्वराय नमः । ॐ ऊर्ध्वायै दिशे नमः । ब्रह्मणे नमः । ॐ अधरायै दिशे नमः । अनन्ताय नमः । ॐ सन्ध्यायै
    नमः ओ ङ्गायत्र्यै नमः ॐ सावित्र्यै नमः ॐ सरस्वत्यै नमः ॐ सर्वेभ्यो देवताभ्यो नमः ओ न्देवेभ्यो नमः
    । ॐ ऋषिभ्यो नमः ओ न्नमो नमः इति । ॥ उद्वासनम् ॥ उत्तमेत्यनुवाकस्य उद्वासने विनियोगः ॥ ॐ उ॒त्तमे॑ शिख॑रे
    देवी भू॒म्या म्प॑र्वत॒मूर्ध॑नि । ब्राह्मणे॑भ्यो ऽभ्य॑नुज्ञा॒ता॒ ग॒च्छ दे॑वि य॒था सु॑खम् ॥ ॥जप निवेदनम्
    ॥ देवा गातु विद इत्यस्य मन्त्रस्य जपनिवेदने विनियोगः॥ ओ न्देवा॑गातु विदोगा॒तु मि॒त्वागा॒तु मि॑त ।
    मन॑सस्पत इ॒म न्दे॑व य॒ज्ञग्ग् स्वाहा॒ वाते॑थाः ॥ प्रातस्सन्ध्याङ्ग भूतेन गायत्र्यास्तु जपेन च । सा
    ऽष्टेन शत सङ्ख्येन ब्रह्म मे प्रियतां रविः ॥ मध्याह्न सन्ध्याङ्गत्वेन गायत्र्या जपितेन च । यथा सङ्ख्येन
    जपेन रुद्रो मे प्रियतां रविः ॥ सायं सन्ध्याङ्ग भूतेन गायत्र्यास्तु जपेन च । सा ऽष्टेन शत सङ्ख्येन
    ब्रह्म मे प्रियतां रविः ॥ ॥ प्रवर ॥ प्रवरलु चू श्शुक्ल यजुर्वेदान्तर्गत काण्व शाखाध्यायी कात्यायन
    सूत्रः म्भो अभिवादये ॥ समर्पणम् । आसत्यलोकात्पाताला दालोकालोकपर्वतात् । ये सन्ति ब्राह्मणादेवास्तेभ्यो
    नित्य न्नमो नमः ॥ विष्णुपत्नीसमुद्भूते शङ्खवर्णे महीतले । अनेकरत्नसम्पन्ने भूमिदेवि नमो ऽस्तु ते ॥
    समुद्रवसने देवि पर्वतस्तनमण्डले । विष्णुपत्नी नमस्तुभ्य
