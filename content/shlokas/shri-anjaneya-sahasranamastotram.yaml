id: shri-anjaneya-sahasranamastotram
category: stotram
name:
  english: shri anjaneya sahasranamastotram
  devanagari: श्री आञ्जनेय सहस्रनामस्तोत्रम्
content:
  english: gamyashca vaikuntha bhajana priyah | girisho girija kanto durvasah kaviramgirah ||62|| bhrigurvasishtashca
    yavanastumbururnarado amalah | vishva kshetram vishva bijam vishva netrashca vishvagah ||63|| yajako
    yajamanashca pavakah pitarastatha | shraddha buddhih kshama tandra mantro mantrayutah svarah ||64||
    rajendro bhupati runda mali samsara sarathih | nityah sampurna kamashca bhakta kamadhuguttamah ||65||
    ganapah kishapo bhrata pita mata ca marutih | sahasra shirsha purushah sahasrakshah sahasrapat ||66||
    kamajit kama dahanah kamah kamya phala pradah | mudrahari rakshasaghnah kshiti bhara haro balah ||67||
    nakha damshtra yudho vishnu bhakto abhaya vara pradah | darpaha darpado driptah shata murtiramurtiman
    ||68|| maha nidhirmaha bhogo maha bhago maharthadah | mahakaro maha yogi maha teja maha dyutih ||69||
    maha karma maha nado maha mantro maha matih | mahashayo mahodaro mahadevatmako vibhuh ||70|| rudra
    karma krita karma ratna nabhah kritagamah | ambhodhi lamghanah simho nityo dharmah pramodanah ||71||
    jitamitro jayah sama vijayo vayu vahanah | jiva data sahasramshurmukundo bhuri dakshinah ||72|| siddharthah
    siddhidah siddha samkalpah siddhi hetukah | sapta patalacaranah saptarshi gana vanditah ||73|| saptabdhi
    lamghano virah sapta dviporumandalah | saptamga rajya sukhadah sapta matri nishevitah ||74|| sapta
    lokaika mukutah sapta hota svarashrayah | saptacchando nidhih saptacchandah sapta janashrayah ||75||
    sapta samopagitashca sapta patala samshrayah | medhavi kirtidah shoka hari daurbhagya nashanah ||76||
    sarva vashyakaro garbha doshaghnah putrapautradah | prativadi mukhastambhi tushtacittah prasadanah
    ||77|| parabhicarashamano duhkhaghno bamdha mokshadah | nava dvara puradharo nava dvara niketanah
    ||78|| nara narayana stutyo naranatho maheshvarah | mekhali kavaci khadgi bhrajishnurjishnusarathih
    ||79|| bahu yojana vistirna pucchah puccha hatasurah | dushtagraha nihamta ca pishaca graha ghatakah
    ||80|| bala graha vinashi ca dharmo neta kripakarah | ugrakrityashcogravega ugra netrah shata kratuh
    ||81|| shata manyustutah stutyah stutih stota maha balah | samagra gunashali ca vyagro raksho vinashakah
    ||82|| rakshoghna hasto brahmeshah shridharo bhakta vatsalah | megha nado megha rupo megha vrishti
    nivarakah ||83|| megha jivana hetushca megha shyamah paratmakah | samira tanayo bodhha tattva vidya
    visharadah ||84|| amogho amoghahrishtishca ishtado anishta nashanah | artho anarthapahari ca samartho
    rama sevakah ||85|| arthi dhanyo asuraratih pundarikaksha atmabhuh | samkarshano vishuddhatma vidya
    rashih sureshvarah ||86|| acaloddharako nityah setukrid rama sarathih | anandah paramanando matsyah
    kurmo nidhihshamah ||87|| varaho narasimhashca vamano jamadagnijah | ramah krishnah shivo buddhah
    kalki ramashrayo harah ||88|| nandi bhringi ca candi ca ganesho gana sevitah | karmadhyakshyah suradhyaksho
    vishramo jagatampatih ||89|| jagannathah kapi shreshtah sarvavasah sadashrayah | sugrivadistutah shantah
    sarva karma plavamgamah ||90|| nakhadaritarakshashca nakha yuddha visharadah | kushalah sughanah shesho
    vasukistakshakah svarah ||91|| svarna varno baladhyashca rama pujyo aghanashanah | kaivalya dipah
    kaivalyam garudah pannago guruh ||92|| kilyaravahataratigarvah parvata bhedanah | vajramgo vajra vegashca
    bhakto vajra nivarakah ||93|| nakhayudho manigrivo jvalamali ca bhaskarah | praudha pratapastapano
    bhakta tapa nivarakah ||94|| sharanam jivanam bhokta nanaceshtohyacamcalah | susvastho asvasthyaha
    duhkhashamanah pavanatmajah ||95|| pavanah pavanah kanto bhaktagassahano balah | megha nadaripurmeghanada
    samhritarakshasah ||96|| ksharo aksharo vinitatma vanareshah satamgatih | shri kantah shiti kantashca
    sahayah sahanayakah ||97|| astulastvananurbhargo devah samsritinashanah | adhyatma vidyasarashca adhyatmakushalah
    sudhih ||98|| akalmashah satya hetuh satyagah satya gocarah | satya garbhah satya rupah satyam satya
    parakramah ||99|| anjana pranalimgaca vayu vamshodbhavah shubhah | bhadra rupo rudra rupah surupascitra
    rupadhrit ||100|| mainaka vamditah sukshma darshano vijayo jayah | kranta digmandalo rudrah prakatikrita
    vikramah ||101|| kambu kantah prasannatma hrasva naso vrikodarah | lamboshtah kundali citramali yogavidam
    varah ||102|| vipashcit kavirananda vigraho ananya shasanah | phalgunisunuravyagro yogatma yogatatparah
    ||103|| yoga vedyo yoga karta yoga yonirdigambarah | akaradi kshakaranta varna nirmita vigrahah ||104||
    ulukhala mukhah simhah samstutah parameshvarah | shlishta jamghah shlishta januh shlishta panih shikha
    dharah ||105|| susharma amita sharma ca narayana parayanah | jishnurbhavishnu rocishnurgrasishnuh
    sthanureva ca ||106|| hari rudranukrid vriksha kampano bhumi kampanah | guna pravahah sutratma vita
    ragah stuti priyah ||107|| naga kanya bhaya dhvamsi rukma varnah kapala bhrit | anakulo bhavopayo
    anapayo veda paragah ||108|| aksharah purusho loka natho raksha prabhu dridah | ashtamga yoga phalabhuk
    satya samdhah purushtutah ||109|| smashana sthana nilayah preta vidravana kshamah | pamcakshara parah
    pamca matriko ramjanadhvajah ||110|| yogini vrinda vamdyashca shatrughno ananta vikramah | brahmacari
    indriya ripuh dhritadando dashatmakah ||111|| aprapamcah sadacarah shura sena vidarakah | vriddhah
    pramoda anamdah sapta jihva patirdharah ||112|| nava dvara puradharah pratyagrah samagayakah | shatcakradhama
    svarloko bhayahyanmanado amadah ||113|| sarva vashyakarah shaktirananto ananta mamgalah | ashta murtirdharo
    neta virupah svara sundarah ||114|| dhuma keturmaha ketuh satya keturmaharathah | nandi priyah svatantrashca
    mekhali samara priyah ||115|| lohamgah sarvavid dhanvi shatkalah sharva ishvarah | phala bhuk phala
    hastashca sarva karma phalapradah ||116|| dharmadhyaksho dharmaphalo dharmo dharmaprado arthadah |
    pamca vimshati tattvajnah taraka brahma tatparah ||117|| tri margavasatirbhumih sarva duhkha nibarhanah
    | urjasvan nishkalah shuli mali garjannishacarah ||118|| raktambara dharo rakto rakta mala vibhushanah
    | vana mali shubhamgashca shvetah svetambaro yuva ||119|| jayo jaya parivarah sahasra vadanah kavih
    | shakini dakini yaksha raksho bhutaugha bhamjanah ||120|| sadhyojatah kamagatir jnana murtih yashaskarah
    | shambhu tejah sarvabhaumo vishnu bhaktah plavamgamah ||121|| caturnavati mantrajnah paulastya bala
    darpaha | sarva lakshmi pradah shriman angadapriya iditah ||122|| smritirbijam sureshanah samsara
    bhaya nashanah | uttamah shriparivarah shri bhu durga ca kamakhyaka ||123|| sadagatirmatarishca rama
    padabja shatpadah | nila priyo nila varno nila varna priyah suhrit ||124|| rama duto loka bandhuh
    antaratma manoramah | shri rama dhyanakrid virah sada kimpurushasstutah ||125|| rama karyamtaramgashca
    shuddhirgatiranamayah | punya shlokah paranandah pareshah priya sarathih ||126|| loka svami mukti
    data sarva karana karanah | maha balo maha virah paravaragatirguruh ||127|| samasta loka sakshi ca
    samasta sura vamditah | sita sameta shri rama pada seva duramdharah ||128|| iti shri sita sameta shri
    rama pada seva duramdhara shri hanumat sahasra nama stotram sampurnam ||
  devanagari: गम्यश्च वैकुण्ठ भजन प्रियः । गिरीशो गिरिजा कान्तो दूर्वासाः कविरंगिराः ॥६२॥ भृगुर्वसिष्टश्च
    यवनस्तुम्बुरुर्नारदो अमलः । विश्व क्षेत्रं विश्व बीजं विश्व नेत्रश्च विश्वगः ॥६३॥ याजको यजमानश्च पावकः
    पितरस्तथा । श्रद्ध बुद्धिः क्षमा तन्द्रा मन्त्रो मन्त्रयुतः स्वरः ॥६४॥ राजेन्द्रो भूपती रुण्ड माली
    संसार सारथिः । नित्यः संपूर्ण कामश्च भक्त कामधुगुत्तमः ॥६५॥ गणपः कीशपो भ्राता पिता माता च मारुतिः
    । सहस्र शीर्षा पुरुषः सहस्राक्षः सहस्रपात् ॥६६॥ कामजित् काम दहनः कामः काम्य फल प्रदः । मुद्राहारी
    राक्षसघ्नः क्षिति भार हरो बलः ॥६७॥ नख दंष्ट्र युधो विष्णु भक्तो अभय वर प्रदः । दर्पहा दर्पदो दृप्तः
    शत मूर्तिरमूर्तिमान् ॥६८॥ महा निधिर्महा भोगो महा भागो महार्थदः । महाकारो महा योगी महा तेजा महा द्युतिः
    ॥६९॥ महा कर्मा महा नादो महा मन्त्रो महा मतिः । महाशयो महोदारो महादेवात्मको विभुः ॥७०॥ रुद्र कर्मा
    कृत कर्मा रत्न नाभः कृतागमः । अम्भोधि लंघनः सिंहो नित्यो धर्मः प्रमोदनः ॥७१॥ जितामित्रो जयः सम विजयो
    वायु वाहनः । जीव दात सहस्रांशुर्मुकुन्दो भूरि दक्षिणः ॥७२॥ सिद्धर्थः सिद्धिदः सिद्ध संकल्पः सिद्धि
    हेतुकः । सप्त पातालचरणः सप्तर्षि गण वन्दितः ॥७३॥ सप्ताब्धि लंघनो वीरः सप्त द्वीपोरुमण्डलः । सप्तांग
    राज्य सुखदः सप्त मातृ निशेवितः ॥७४॥ सप्त लोकैक मुकुटः सप्त होता स्वराश्रयः । सप्तच्छन्दो निधिः सप्तच्छन्दः
    सप्त जनाश्रयः ॥७५॥ सप्त सामोपगीतश्च सप्त पातल संश्रयः । मेधावी कीर्तिदः शोक हारी दौर्भग्य नाशनः ॥७६॥
    सर्व वश्यकरो गर्भ दोषघ्नः पुत्रपौत्रदः । प्रतिवादि मुखस्तंभी तुष्टचित्तः प्रसादनः ॥७७॥ पराभिचारशमनो
    दुःखघ्नो बंध मोक्षदः । नव द्वार पुराधारो नव द्वार निकेतनः ॥७८॥ नर नारायण स्तुत्यो नरनाथो महेश्वरः
    । मेखली कवची खद्गी भ्राजिष्णुर्जिष्णुसारथिः ॥७९॥ बहु योजन विस्तीर्ण पुच्छः पुच्छ हतासुरः । दुष्टग्रह
    निहंता च पिशाच ग्रह घातकः ॥८०॥ बाल ग्रह विनाशी च धर्मो नेता कृपकरः । उग्रकृत्यश्चोग्रवेग उग्र नेत्रः
    शत क्रतुः ॥८१॥ शत मन्युस्तुतः स्तुत्यः स्तुतिः स्तोता महा बलः । समग्र गुणशाली च व्यग्रो रक्षो विनाशकः
    ॥८२॥ रक्षोघ्न हस्तो ब्रह्मेशः श्रीधरो भक्त वत्सलः । मेघ नादो मेघ रूपो मेघ वृष्टि निवारकः ॥८३॥ मेघ
    जीवन हेतुश्च मेघ श्यामः परात्मकः । समीर तनयो बोध्ह तत्त्व विद्या विशारदः ॥८४॥ अमोघो अमोघहृष्टिश्च
    इष्टदो अनिष्ट नाशनः । अर्थो अनर्थापहारी च समर्थो राम सेवकः ॥८५॥ अर्थी धन्यो असुरारातिः पुण्डरीकाक्ष
    आत्मभूः । संकर्षणो विशुद्धात्मा विद्या राशिः सुरेश्वरः ॥८६॥ अचलोद्धरको नित्यः सेतुकृद् राम सारथिः
    । आनन्दः परमानन्दो मत्स्यः कूर्मो निधिःशमः ॥८७॥ वाराहो नारसिंहश्च वामनो जमदग्निजः । रामः कृष्णः शिवो
    बुद्धः कल्की रामाश्रयो हरः ॥८८॥ नन्दी भृन्गी च चण्डी च गणेशो गण सेवितः । कर्माध्यक्ष्यः सुराध्यक्षो
    विश्रामो जगतांपतिः ॥८९॥ जगन्नथः कपि श्रेष्टः सर्वावसः सदाश्रयः । सुग्रीवादिस्तुतः शान्तः सर्व कर्मा
    प्लवंगमः ॥९०॥ नखदारितरक्षाश्च नख युद्ध विशारदः । कुशलः सुघनः शेषो वासुकिस्तक्षकः स्वरः ॥९१॥ स्वर्ण
    वर्णो बलाढ्यश्च राम पूज्यो अघनाशनः । कैवल्य दीपः कैवल्यं गरुडः पन्नगो गुरुः ॥९२॥ किल्यारावहतारातिगर्वः
    पर्वत भेदनः । वज्रांगो वज्र वेगश्च भक्तो वज्र निवारकः ॥९३॥ नखायुधो मणिग्रीवो ज्वालामाली च भास्करः
    । प्रौढ प्रतापस्तपनो भक्त ताप निवारकः ॥९४॥ शरणं जीवनं भोक्ता नानाचेष्टोह्यचंचलः । सुस्वस्थो अस्वास्थ्यहा
    दुःखशमनः पवनात्मजः ॥९५॥ पावनः पवनः कान्तो भक्तागस्सहनो बलः । मेघ नादरिपुर्मेघनाद संहृतराक्षसः ॥९६॥
    क्षरो अक्षरो विनीतात्मा वानरेशः सतांगतिः । श्री कण्टः शिति कण्टश्च सहायः सहनायकः ॥९७॥ अस्तूलस्त्वनणुर्भर्गो
    देवः संसृतिनाशनः । अध्यात्म विद्यासारश्च अध्यात्मकुशलः सुधीः ॥९८॥ अकल्मषः सत्य हेतुः सत्यगः सत्य गोचरः
    । सत्य गर्भः सत्य रूपः सत्यं सत्य पराक्रमः ॥९९॥ अन्जना प्राणलिंगच वायु वंशोद्भवः शुभः । भद्र रूपो
    रुद्र रूपः सुरूपस्चित्र रूपधृत् ॥१००॥ मैनाक वंदितः सूक्ष्म दर्शनो विजयो जयः । क्रान्त दिग्मण्डलो रुद्रः
    प्रकटीकृत विक्रमः ॥१०१॥ कम्बु कण्टः प्रसन्नात्मा ह्रस्व नासो वृकोदरः । लंबोष्टः कुण्डली चित्रमाली
    योगविदां वरः ॥१०२॥ विपश्चित् कविरानन्द विग्रहो अनन्य शासनः । फल्गुणीसूनुरव्यग्रो योगात्मा योगतत्परः
    ॥१०३॥ योग वेद्यो योग कर्ता योग योनिर्दिगंबरः । अकारादि क्षकारान्त वर्ण निर्मित विग्रहः ॥१०४॥ उलूखल
    मुखः सिंहः संस्तुतः परमेश्वरः । श्लिष्ट जंघः श्लिष्ट जानुः श्लिष्ट पाणिः शिखा धरः ॥१०५॥ सुशर्मा अमित
    शर्मा च नारयण परायणः । जिष्णुर्भविष्णू रोचिष्णुर्ग्रसिष्णुः स्थाणुरेव च ॥१०६॥ हरी रुद्रानुकृद् वृक्ष
    कंपनो भूमि कंपनः । गुण प्रवाहः सूत्रात्मा वीत रागः स्तुति प्रियः ॥१०७॥ नाग कन्या भय ध्वंसी रुक्म वर्णः
    कपाल भृत् । अनाकुलो भवोपायो अनपायो वेद पारगः ॥१०८॥ अक्षरः पुरुषो लोक नाथो रक्ष प्रभु दृडः । अष्टांग
    योग फलभुक् सत्य संधः पुरुष्टुतः ॥१०९॥ स्मशान स्थन निलयः प्रेत विद्रावण क्षमः । पंचाक्षर परः पंच मातृको
    रंजनध्वजः ॥११०॥ योगिनी वृन्द वंद्यश्च शत्रुघ्नो अनन्त विक्रमः । ब्रह्मचारी इन्द्रिय रिपुः धृतदण्डो
    दशात्मकः ॥१११॥ अप्रपंचः सदाचारः शूर सेना विदारकः । वृद्धः प्रमोद आनंदः सप्त जिह्व पतिर्धरः ॥११२॥ नव
    द्वार पुराधारः प्रत्यग्रः सामगायकः । षट्चक्रधामा स्वर्लोको भयह्यन्मानदो अमदः ॥११३॥ सर्व वश्यकरः शक्तिरनन्तो
    अनन्त मंगलः । अष्ट मूर्तिर्धरो नेता विरूपः स्वर सुन्दरः ॥११४॥ धूम केतुर्महा केतुः सत्य केतुर्महारथः
    । नन्दि प्रियः स्वतन्त्रश्च मेखली समर प्रियः ॥११५॥ लोहांगः सर्वविद् धन्वी षट्कलः शर्व ईश्वरः । फल
    भुक् फल हस्तश्च सर्व कर्म फलप्रदः ॥११६॥ धर्माध्यक्षो धर्मफलो धर्मो धर्मप्रदो अर्थदः । पंच विंशति तत्त्वज्ञः
    तारक ब्रह्म तत्परः ॥११७॥ त्रि मार्गवसतिर्भूमिः सर्व दुःख निबर्हणः । ऊर्जस्वान् निष्कलः शूली माली गर्जन्निशाचरः
    ॥११८॥ रक्तांबर धरो रक्तो रक्त माला विभूषणः । वन माली शुभांगश्च श्वेतः स्वेतांबरो युवा ॥११९॥ जयो जय
    परीवारः सहस्र वदनः कविः । शाकिनी डाकिनी यक्ष रक्षो भूतौघ भंजनः ॥१२०॥ सध्योजातः कामगतिर् ज्ञान मूर्तिः
    यशस्करः । शंभु तेजाः सार्वभौमो विष्णु भक्तः प्लवंगमः ॥१२१॥ चतुर्नवति मन्त्रज्ञः पौलस्त्य बल दर्पहा
    । सर्व लक्ष्मी प्रदः श्रीमान् अन्गदप्रिय ईडितः ॥१२२॥ स्मृतिर्बीजं सुरेशानः संसार भय नाशनः । उत्तमः
    श्रीपरीवारः श्री भू दुर्गा च कामाख्यक ॥१२३॥ सदागतिर्मातरिश्च राम पादाब्ज षट्पदः । नील प्रियो नील वर्णो
    नील वर्ण प्रियः सुहृत् ॥१२४॥ राम दूतो लोक बन्धुः अन्तरात्मा मनोरमः । श्री राम ध्यानकृद् वीरः सदा किंपुरुषस्स्तुतः
    ॥१२५॥ राम कार्यांतरंगश्च शुद्धिर्गतिरानमयः । पुण्य श्लोकः परानन्दः परेशः प्रिय सारथिः ॥१२६॥ लोक स्वामि
    मुक्ति दाता सर्व कारण कारणः । महा बलो महा वीरः पारावारगतिर्गुरुः ॥१२७॥ समस्त लोक साक्षी च समस्त सुर
    वंदितः । सीता समेत श्री राम पाद सेवा दुरंधरः ॥१२८॥ इति श्री सीता समेत श्री राम पाद सेवा दुरंधर श्री
    हनुमत् सहस्र नाम स्तोत्रं संपूर्णं ॥
