id: shiladakritamnandikeshvarotpattistotram
category: stotram
name:
  english: shiladakritamnandikeshvarotpattistotram
  devanagari: शिलादकृतंनन्दिकेश्वरोत्पत्तिस्तोत्रम्
content:
  english: shiladakritam nandikeshvarotpattistotram shilada uvaca | bhagavandevadevesha triyambaka mamavyaya
    || 26|| putro'si jagatam yasmattrata duhkhaddhi kim punah | rakshako jagatam yasmatpita me putra sarvaga
    || 27|| ayonija namastubhyam jagadyone pitamaha | pitah putra maheshana jagatam ca jagadguro || 28||
    vatsavatsa mahabhaga pahi mam parameshvara | tvaya'ham nandito yasmannandi namna sureshvara || 29||
    tasmannandaya mam nandinnamami jagadishvaram | prasida pitarau me'dya rudralokam gatau vibho || 30||
    pitamahashca bho nandinnavatirne maheshvare | mamaiva saphalam loke janma vai jagatam prabho || 31||
    avatirne sute nandin rakshartham mahyamishvara | tubhyam namah sureshana nandishvara namo'stu te ||
    32|| putra pahi mahabaho devadeva jagadguro | putratvameva nandisha matva yatkirtitam maya || 33||
    tvaya tatkshamyatam vatsa stavastavya surasuraih | yah pathecchrinuyadvapi mama putra prabhashitam
    || 34|| shravayedva dvijan bhaktya maya sardham sa modate | evam stutva sutam balam pranamya bahumanatah
    || 35|| munishvaramshca samprekshya shiladovaca suvratah | pashyadhvam munayah sarve mahabhagyam mamavyayah
    || 36|| nandi yajnangane devashcavatirno yatah prabhuh | matsamah kah puma~lloke devo va danavo'pi
    va || 37|| esha nandi yato jato yajnabhumau hitaya me || 38|| iti shrilingamahapurane purvabhage nandikeshvarotpattirnama
    dvicatvarimsho'dhyayah || 42|| lingapurana | purvabhaga | adhyaya 42
  devanagari: शिलादकृतं नन्दिकेश्वरोत्पत्तिस्तोत्रम् शिलाद उवाच । भगवन्देवदेवेश त्रियम्बक ममाव्यय ॥ २६॥
    पुत्रोऽसि जगतां यस्मात्त्राता दुःखाद्धि किं पुनः । रक्षको जगतां यस्मात्पिता मे पुत्र सर्वग ॥ २७॥ अयोनिज
    नमस्तुभ्यं जगद्योने पितामह । पितः पुत्र महेशान जगतां च जगद्गुरो ॥ २८॥ वत्सवत्स महाभाग पाहि मां परमेश्वर
    । त्वयाऽहं नन्दितो यस्मान्नन्दी नाम्ना सुरेश्वर ॥ २९॥ तस्मान्नन्दय मां नन्दिन्नमामि जगदीश्वरम् । प्रसीद
    पितरौ मेऽद्य रुद्रलोकं गतौ विभो ॥ ३०॥ पितामहाश्च भो नन्दिन्नवतीर्णे महेश्वरे । ममैव सफलं लोके जन्म
    वै जगतां प्रभो ॥ ३१॥ अवतीर्णे सुते नन्दीन् रक्षार्थं मह्यमीश्वर । तुभ्यं नमः सुरेशान नन्दीश्वर नमोऽस्तु
    ते ॥ ३२॥ पुत्र पाहि महाबाहो देवदेव जगद्गुरो । पुत्रत्वमेव नन्दीश मत्वा यत्कीर्तितं मया ॥ ३३॥ त्वया
    तत्क्षम्यतां वत्स स्तवस्तव्य सुरासुरैः । यः पठेच्छृणुयाद्वापि मम पुत्र प्रभाषितम् ॥ ३४॥ श्रावयेद्वा
    द्विजान् भक्त्या मया सार्धं स मोदते । एवं स्तुत्वा सुतं बालं प्रणम्य बहुमानतः ॥ ३५॥ मुनीश्वरांश्च
    सम्प्रेक्ष्य शिलादोवाच सुव्रतः । पश्यध्वं मुनयः सर्वे महाभाग्यं ममाव्ययः ॥ ३६॥ नन्दी यज्ञाङ्गणे देवश्चावतीर्णो
    यतः प्रभुः । मत्समः कः पुमाँल्लोके देवो वा दानवोऽपि वा ॥ ३७॥ एष नन्दी यतो जातो यज्ञभूमौ हिताय मे ॥
    ३८॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे नन्दिकेश्वरोत्पत्तिर्नाम द्विचत्वारिंशोऽध्यायः ॥ ४२॥ लिङ्गपुराण
    । पूर्वभाग । अध्याय ४२
