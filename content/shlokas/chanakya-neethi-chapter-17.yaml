id: chanakya-neethi-chapter-17
category: stotram
name:
  english: Chanakya Neethi - Chapter 17
content:
  english: pustakapratyayadhitam nadhitam gurusannidhau | sabhamadhye na shobhante jaragarbha iva striyah
    || || krite pratikritim kuryaddhimsane pratihimsanam | tatra dosho na patati dushte dushtam samacaret
    || || yadduram yadduraradhyam yacca dure vyavasthitam | tatsarvam tapasa sadhyam tapo hi duratikramam
    || || lobhashcedagunena kim pishunata yadyasti kim patakaih satyam cettapasa ca kim shuci mano yadyasti
    tirthena kim | saujanyam yadi kim gunaih sumahima yadyasti kim mandanaih sadvidya yadi kim dhanairapayasho
    yadyasti kim mrityuna || || pita ratnakaro yasya lakshmiryasya sahodara | shankho bhikshatanam kuryanna
    dattamupatishthate || || ashaktastu bhavetsadhu rbrahmacari va nirdhanah | vyadhito devabhaktashca
    vriddha nari pativrata || || na'nnodakasamam danam na tithirdvadashi sama | na gayatryah paro mantro
    na maturdaivatam param || || takshakasya visham dante makshikayastu mastake | vrishcikasya visham
    pucche sarvange durjane visham || || patyurajnam vina nari hyuposhya vratacarini | ayushyam harate
    bhartuh sa nari narakam vrajet || || na danaih shudhyate nari nopavasashatairapi | na tirthasevaya
    tadvadbhartuh padodakairyatha || || padashesham pitashesham sandhyashesham tathaiva ca | shvanamutrasamam
    toyam pitva candrayanam caret || || danena panirna tu kankanena snanena shuddhirna tu candanena |
    manena triptirna tu bhojanena jnanena muktirna tu mundanena || || napitasya grihe kshauram pashane
    gandhalepanam | atmarupam jale pashyan shakrasyapi shriyam haret || || sadyah prajnahara tundi sadyah
    prajnakari vaca | sadyah shaktihara nari sadyah shaktikaram payah || || paropakaranam yesham jagarti
    hridaye satam | nashyanti vipadastesham sampadah syuh pade pade || || yadi rama yadi ca rama yadi
    tanayo vinayagunopetah | tanaye tanayotpattih suravaranagare kimadhikyam || || aharanidrabhayamaithunani
    samani caitani nrinam pashunam | jnanam naranamadhiko vishesho jnanena hinah pashubhih samanah ||
    || danarthino madhukara yadi karnatalairdurikritah durikritah karivarena madandhabuddhya | tasyaiva
    gandayugmamandanahaniresha bhringah punarvikacapadmavane vasanti || || raja veshya yamashcagnistaskaro
    balayacakau | paraduhkham na jananti ashtamo gramakantakah || || adhah pashyasi kim bale patitam tava
    kim bhuvi | re re murkha na janasi gatam tarunyamauktikam || || vyalashrayapi vikalapi sakantakapi
    vakrapi pankilabhavapi durasadapi | gandhena bandhurasi ketaki sarvajanta reko gunah khalu nihanti
    samastadoshan ||
  devanagari: पुस्तकप्रत्ययाधीतं नाधीतं गुरुसन्निधौ । सभामध्ये न शोभन्ते जारगर्भा इव स्त्रियः ॥ ॥ कृते
    प्रतिकृतिं कुर्याद्धिंसने प्रतिहिंसनम् । तत्र दोषो न पतति दुष्टे दुष्टं समाचरेत् ॥ ॥ यद्दूरं यद्दुराराध्यं
    यच्च दूरे व्यवस्थितम् । तत्सर्वं तपसा साध्यं तपो हि दुरतिक्रमम् ॥ ॥ लोभश्चेदगुणेन किं पिशुनता यद्यस्ति
    किं पातकैः सत्यं चेत्तपसा च किं शुचि मनो यद्यस्ति तीर्थेन किम् । सौजन्यं यदि किं गुणैः सुमहिमा यद्यस्ति
    किं मण्डनैः सद्विद्या यदि किं धनैरपयशो यद्यस्ति किं मृत्युना ॥ ॥ पिता रत्नाकरो यस्य लक्ष्मीर्यस्य
    सहोदरा । शङ्खो भिक्षाटनं कुर्यान्न दत्तमुपतिष्ठते ॥ ॥ अशक्तस्तु भवेत्साधु र्ब्रह्मचारी वा निर्धनः
    । व्याधितो देवभक्तश्च वृद्धा नारी पतिव्रता ॥ ॥ नाऽन्नोदकसमं दानं न तिथिर्द्वादशी समा । न गायत्र्याः
    परो मन्त्रो न मातुर्दैवतं परम् ॥ ॥ तक्षकस्य विषं दन्ते मक्षिकायास्तु मस्तके । वृश्चिकस्य विषं पुच्छे
    सर्वाङ्गे दुर्जने विषम् ॥ ॥ पत्युराज्ञां विना नारी ह्युपोष्य व्रतचारिणी । आयुष्यं हरते भर्तुः सा नारी
    नरकं व्रजेत् ॥ ॥ न दानैः शुध्यते नारी नोपवासशतैरपि । न तीर्थसेवया तद्वद्भर्तुः पदोदकैर्यथा ॥ ॥ पादशेषं
    पीतशेषं सन्ध्याशेषं तथैव च । श्वानमूत्रसमं तोयं पीत्वा चान्द्रायणं चरेत् ॥ ॥ दानेन पाणिर्न तु कङ्कणेन
    स्नानेन शुद्धिर्न तु चन्दनेन । मानेन तृप्तिर्न तु भोजनेन ज्ञानेन मुक्तिर्न तु मुण्डनेन ॥ ॥ नापितस्य
    गृहे क्षौरं पाषाणे गन्धलेपनम् । आत्मरूपं जले पश्यन् शक्रस्यापि श्रियं हरेत् ॥ ॥ सद्यः प्रज्ञाहरा तुण्डी
    सद्यः प्रज्ञाकरी वचा । सद्यः शक्तिहरा नारी सद्यः शक्तिकरं पयः ॥ ॥ परोपकरणं येषां जागर्ति हृदये सताम्
    । नश्यन्ति विपदस्तेषां सम्पदः स्युः पदे पदे ॥ ॥ यदि रामा यदि च रमा यदि तनयो विनयगुणोपेतः । तनये तनयोत्पत्तिः
    सुरवरनगरे किमाधिक्यम् ॥ ॥ आहारनिद्राभयमैथुनानि समानि चैतानि नृणां पशूनाम् । ज्ञानं नराणामधिको विशेषो
    ज्ञानेन हीनाः पशुभिः समानाः ॥ ॥ दानार्थिनो मधुकरा यदि कर्णतालैर्दूरीकृताः दूरीकृताः करिवरेण मदान्धबुद्ध्या
    । तस्यैव गण्डयुग्ममण्डनहानिरेषा भृङ्गाः पुनर्विकचपद्मवने वसन्ति ॥ ॥ राजा वेश्या यमश्चाग्निस्तस्करो
    बालयाचकौ । परदुःखं न जानन्ति अष्टमो ग्रामकण्टकः ॥ ॥ अधः पश्यसि किं बाले पतितं तव किं भुवि । रे रे
    मूर्ख न जानासि गतं तारुण्यमौक्तिकम् ॥ ॥ व्यालाश्रयापि विकलापि सकण्टकापि वक्रापि पङ्किलभवापि दुरासदापि
    । गन्धेन बन्धुरसि केतकि सर्वजन्ता रेको गुणः खलु निहन्ति समस्तदोषान् ॥
