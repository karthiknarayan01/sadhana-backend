id: ashugarudakavacam
category: stotram
name:
  english: ashugarudakavacam
  devanagari: आशुगरुडकवचम्
content:
  english: mokshaprada uttama siddhipradayaka aura sabhi siddhiyom ko dene vala hai | rishi nyasa prabhava
    mantravidajanakara ekagra mana se uttamottama mantra ka japa kare | atha kavacam | tarkshyo me puratah
    patu garudah patu prishthatah | somah patu ca me vamam vainateyastu dakshinam || 6|| shikhayam garudah
    patu nitilam tvahisandharah | nasikagram vibhuh patu nayane vinatasutah || 7|| tejishthah shrotrayoh
    patu mukham santapamocanah || oshthayoh patu nagarih patu talu prajakarah || 8|| jihvam khageshvarah
    patu dantanpatvarunanujah | sirukashcibukam patu patu cograh kapolayoh || 9|| mahariha galam patu
    camsayoh kritavikramah | karau patu ca raktakshah karagre tu mahabalah || 10|| angushthau ca harih
    patu tarjanyau harivahanah | madhyame sumukhah patu canamike trilocanah || 11|| kanishthike mahotsahah
    svatmangah patu doh stanam | karaprishtham kalatito nakhanyamrita
  devanagari: मोक्षप्रद उत्तम सिद्धिप्रदायक और सभी सिद्धियों को देने वाला है । ऋषि न्यास प्रभाव मन्त्रविदजानकर
    एकाग्र मन से उत्तमोत्तम मन्त्र का जप करे । अथ कवचम् । तार्क्ष्यो मे पुरतः पातु गरुडः पातु पृष्ठतः
    । सोमः पातु च मे वामं वैनतेयस्तु दक्षिणम् ॥ ६॥ शिखायां गरुडः पातु निटिलं त्वहिसन्धरः । नासिकाग्रं
    विभुः पातु नयने विनतासुतः ॥ ७॥ तेजिष्ठः श्रोत्रयोः पातु मुखं सन्तापमोचनः ॥ ओष्ठयोः पातु नागारिः पातु
    तालू प्रजाकरः ॥ ८॥ जिह्वां खगेश्वरः पातु दन्तान्पात्वरुणानुजः । सीरुकश्चिबुकं पातु पातु चोग्रः कपोलयोः
    ॥ ९॥ महारिहा गलं पातु चांसयोः कृतविक्रमः । करौ पातु च रक्ताक्षः कराग्रे तु महाबलः ॥ १०॥ अङ्गुष्ठौ
    च हरिः पातु तर्जन्यौ हरिवाहनः । मध्यमे सुमुखः पातु चानामिके त्रिलोचनः ॥ ११॥ कनिष्ठिके महोत्साहः स्वात्माङ्गः
    पातु दोः स्तनम् । करपृष्ठं कलातीतो नखान्यमृत
