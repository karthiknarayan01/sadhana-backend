id: yatindrashtakam
category: stotram
name:
  english: yatindrashtakam
  devanagari: यतीन्द्राष्टकम्
content:
  english: shrianantanandacaryakritam yatindrashtakam namo bhagavate shrimatsushilanandadayine | raghavanandashishyaya
    yatindraya namo namah || 1|| namo bhagavate shrimatsunave punyasadmanah | acaryasarvabhaumaya yatindraya
    namo namah || 2|| namo bhagavate shrimadramanandaya dhimate | anandabhashyakaraya yatindraya namo
    namah || 3|| namo bhagavate shrimadvaishnavadharmarakshine | vijetre'nantasiddhanam yatindraya namo
    namah || 4|| namo bhagavate shrimadramabhaktipracarine | sampradayabdhicandraya yatindraya namo namah
    || 5|| namo bhagavate shrimadvishishtadvaitavadine | vadivaranasimhaya yatindraya namo namah || 6||
    namo bhagavate shrimadramaya gunasindhave | tirtharaje'vatirnaya yatindraya namo namah || 7|| namo
    bhagavate shrimadvedatattvarthabhashine | nigamagamarakshitre yatindraya namo namah || 8|| iti shrisvami
    anantanandacaryakritam yatindrashtakam sampurnam |
  devanagari: श्रीअनन्तानन्दाचार्यकृतं यतीन्द्राष्टकम् नमो भगवते श्रीमत्सुशीलानन्ददायिने । राघवानन्दशिष्याय
    यतीन्द्राय नमो नमः ॥ १॥ नमो भगवते श्रीमत्सूनवे पुण्यसद्मनः । आचार्यसार्वभौमाय यतीन्द्राय नमो नमः ॥
    २॥ नमो भगवते श्रीमद्रामानन्दाय धीमते । आनन्दभाष्यकाराय यतीन्द्राय नमो नमः ॥ ३॥ नमो भगवते श्रीमद्वैष्णवधर्मरक्षिणे
    । विजेत्रेऽनन्तसिद्धानां यतीन्द्राय नमो नमः ॥ ४॥ नमो भगवते श्रीमद्रामभक्तिप्रचारिणे । सम्प्रदायाब्धिचन्द्राय
    यतीन्द्राय नमो नमः ॥ ५॥ नमो भगवते श्रीमद्विशिष्टाद्वैतवादिने । वादिवारणसिंहाय यतीन्द्राय नमो नमः ॥
    ६॥ नमो भगवते श्रीमद्रामाय गुणसिन्धवे । तीर्थराजेऽवतीर्णाय यतीन्द्राय नमो नमः ॥ ७॥ नमो भगवते श्रीमद्वेदतत्त्वार्थभाषिणे
    । निगमागमरक्षित्रे यतीन्द्राय नमो नमः ॥ ८॥ इति श्रीस्वामी अनन्तानन्दाचार्यकृतं यतीन्द्राष्टकं सम्पूर्णम्
    ।
