id: mantra-pushpam
category: stotram
name:
  english: Mantra Pushpam
  devanagari: मन्त्रपुष्पम् (तैत्तिरीयारण्यके प्रथमप्रपाठकः द्वाविंशोऽनुवाकः)
content:
  english: sasvarah om om bhadram karnebhih shrinuyama devah | bhadram pashyemakshabhiryajatrah | sthirairangaistushtuvasastanubhih
    | vyashema devahitam yadayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti
    nastarkshyo arishtanemih | svasti no brihaspatirdadhatu|| om shantih shantih shantih || yo'pam pushpam
    veda| pushpavan prajavan pashuman bhavati | candrama va apam pushpam| pushpavan prajavan pashuman
    bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 1|| agnirva apamayatanam| ayatanavan
    bhavati | yo'gnerayatanam veda | ayatanavan bhavati | apo va agnerayatanam | ayatanavan bhavati |
    ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 2|| vayurva apamayatanam| ayatanavan bhavati
    | yo vayorayatanam veda | ayatanavan bhavati | apo vai vayorayatanam| ayatanavan bhavati | ya evam
    veda | yo'pamayatanam veda | ayatanavan bhavati || 3|| asau vai tapannapamayatanam| ayatanavan bhavati
    | yo'mushya tapata ayatanam veda | ayatanavan bhavati | apo va amushya tapata ayatanam| ayatanavan
    bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 4|| candrama va apamayatanam
    | ayatanavan bhavati | yashcandramasa ayatanam veda | ayatanavan bhavati | apo vai candramasa ayatanam|
    ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 5|| nakshatrani va
    apamayatanam| ayatanavan bhavati | yo nakshatranamayatanam veda| ayatanavan bhavati | apo vai nakshatranamayatanam|
    ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 6|| parjanyo va apamayatanam|
    ayatanavan bhavati | yah parjanyasya''yatanam veda | ayatanavan bhavati | apo vai parjanyasya''yatanam|
    ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati || 7|| samvatsaro va
    apamayatanam| ayatanavan bhavati | yassamvatsarasya''yatanam veda | ayatanavan bhavati | apo vai samvatsarasya''yatanam
    | ayatanavan bhavati | ya evam veda| yo'psu navam pratishthitam veda | pratyeva tishthati || 8|| rajadhirajaya
    prasahyasahine | namo vayam vaishravanaya kurmahe | sa me kamankamakamaya mahyam | kameshvaro vaishravano
    dadatu | kuberaya vaishravanaya | maharajaya namah | om shantih shantih shantih || taittiriyaranyakam
    arunaprashnah 77-84 nihsvarah om om bhadram karnebhih shrinuyama devah | bhadram pashyemakshabhiryajatrah
    | sthirairangaistushtuvasastanubhih | vyashema devahitam yadayuh | svasti na indro vriddhashravah
    | svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu||
    om shantih shantih shantih || yo'pam pushpam veda| pushpavan prajavan pashuman bhavati | candrama
    va apam pushpam| pushpavan prajavan pashuman bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan
    bhavati || 1|| agnirva apamayatanam| ayatanavan bhavati | yo'gnerayatanam veda | ayatanavan bhavati
    | apo va agnerayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati
    || 2|| vayurva apamayatanam| ayatanavan bhavati | yo vayorayatanam veda | ayatanavan bhavati | apo
    vai vayorayatanam| ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati ||
    3|| asau vai tapannapamayatanam| ayatanavan bhavati | yo'mushya tapata ayatanam veda | ayatanavan
    bhavati | apo va amushya tapata ayatanam| ayatanavan bhavati | ya evam veda | yo'pamayatanam veda
    | ayatanavan bhavati || 4|| candrama va apamayatanam | ayatanavan bhavati | yashcandramasa ayatanam
    veda | ayatanavan bhavati | apo vai candramasa ayatanam| ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 5|| nakshatrani va apamayatanam| ayatanavan bhavati | yo nakshatranamayatanam
    veda| ayatanavan bhavati | apo vai nakshatranamayatanam| ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 6|| parjanyo va apamayatanam| ayatanavan bhavati | yah parjanyasya''yatanam
    veda | ayatanavan bhavati | apo vai parjanyasya''yatanam| ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 7|| samvatsaro va apamayatanam| ayatanavan bhavati | yassamvatsarasya''yatanam
    veda | ayatanavan bhavati | apo vai samvatsarasya''yatanam | ayatanavan bhavati | ya evam veda| yo'psu
    navam pratishthitam veda | pratyeva tishthati || 8|| rajadhirajaya prasahyasahine | namo vayam vaishravanaya
    kurmahe | sa me kamankamakamaya mahyam | kameshvaro vaishravano dadatu | kuberaya vaishravanaya |
    maharajaya namah | om shantih shantih shantih || taittiriyaranyakam arunaprashnah 77-84 taittiriyaranyake
    prathamaprapathakah dvavimsho'nuvakah Encoded vith accents by ṟajagopal iyer
  devanagari: सस्वरः ॐ ॐ भद्रं कर्णेभिः शृणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवासस्तनूभिः
    । व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो
    अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु॥ ॐ शान्तिः शान्तिः शान्तिः ॥ योऽपां पुष्पं वेद। पुष्पवान्
    प्रजावान् पशुमान् भवति । चन्द्रमा वा अपां पुष्पम्। पुष्पवान् प्रजावान् पशुमान् भवति । य एवं वेद ।
    योऽपामायतनं वेद । आयतनवान् भवति ॥ १॥ अग्निर्वा अपामायतनम्। आयतनवान् भवति । योऽग्नेरायतनं वेद । आयतनवान्
    भवति । आपो वा अग्नेरायतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ २॥ वायुर्वा
    अपामायतनम्। आयतनवान् भवति । यो वायोरायतनं वेद । आयतनवान् भवति । आपो वै वायोरायतनम्। आयतनवान् भवति
    । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ३॥ असौ वै तपन्नपामायतनम्। आयतनवान् भवति । योऽमुष्य
    तपत आयतनं वेद । आयतनवान् भवति । आपो वा अमुष्य तपत आयतनम्। आयतनवान् भवति । य एवं वेद । योऽपामायतनं
    वेद । आयतनवान् भवति ॥ ४॥ चन्द्रमा वा अपामायतनम् । आयतनवान् भवति । यश्चन्द्रमस आयतनं वेद । आयतनवान्
    भवति । आपो वै चन्द्रमस आयतनम्। आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ५॥ नक्षत्राणि
    वा अपामायतनम्। आयतनवान् भवति । यो नक्षत्राणामायतनं वेद। आयतनवान् भवति । आपो वै नक्षत्राणामायतनम्।
    आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ६॥ पर्जन्यो वा अपामायतनम्। आयतनवान्
    भवति । यः पर्जन्यस्याऽऽयतनं वेद । आयतनवान् भवति । आपो वै पर्जन्यस्याऽऽयतनम्। आयतनवान् भवति । य एवं
    वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ७॥ संवत्सरो वा अपामायतनम्। आयतनवान् भवति । यस्संवत्सरस्याऽऽयतनं
    वेद । आयतनवान् भवति । आपो वै संवत्सरस्याऽऽयतनम् । आयतनवान् भवति । य एवं वेद। योऽप्सु नावं प्रतिष्ठितां
    वेद । प्रत्येव तिष्ठति ॥ ८॥ राजाधिराजाय प्रसह्यसाहिने । नमो वयं वैश्रवणाय कुर्महे । स मे कामान्कामकामाय
    मह्यम् । कामेश्वरो वैश्रवणो ददातु । कुबेराय वैश्रवणाय । महाराजाय नमः । ॐ शान्तिः शान्तिः शान्तिः ॥
    तैत्तिरीयारण्यकम् अरुणप्रश्नः ७७-८४ निःस्वरः ॐ ॐ भद्रं कर्णेभिः शृणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः
    । स्थिरैरङ्गैस्तुष्टुवासस्तनूभिः । व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति
    नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ योऽपां पुष्पं वेद। पुष्पवान् प्रजावान् पशुमान् भवति । चन्द्रमा वा अपां पुष्पम्। पुष्पवान्
    प्रजावान् पशुमान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ १॥ अग्निर्वा अपामायतनम्। आयतनवान्
    भवति । योऽग्नेरायतनं वेद । आयतनवान् भवति । आपो वा अग्नेरायतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं
    वेद । आयतनवान् भवति ॥ २॥ वायुर्वा अपामायतनम्। आयतनवान् भवति । यो वायोरायतनं वेद । आयतनवान् भवति ।
    आपो वै वायोरायतनम्। आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ३॥ असौ वै तपन्नपामायतनम्।
    आयतनवान् भवति । योऽमुष्य तपत आयतनं वेद । आयतनवान् भवति । आपो वा अमुष्य तपत आयतनम्। आयतनवान् भवति ।
    य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ४॥ चन्द्रमा वा अपामायतनम् । आयतनवान् भवति । यश्चन्द्रमस
    आयतनं वेद । आयतनवान् भवति । आपो वै चन्द्रमस आयतनम्। आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद ।
    आयतनवान् भवति ॥ ५॥ नक्षत्राणि वा अपामायतनम्। आयतनवान् भवति । यो नक्षत्राणामायतनं वेद। आयतनवान् भवति
    । आपो वै नक्षत्राणामायतनम्। आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ६॥ पर्जन्यो
    वा अपामायतनम्। आयतनवान् भवति । यः पर्जन्यस्याऽऽयतनं वेद । आयतनवान् भवति । आपो वै पर्जन्यस्याऽऽयतनम्।
    आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ७॥ संवत्सरो वा अपामायतनम्। आयतनवान्
    भवति । यस्संवत्सरस्याऽऽयतनं वेद । आयतनवान् भवति । आपो वै संवत्सरस्याऽऽयतनम् । आयतनवान् भवति । य एवं
    वेद। योऽप्सु नावं प्रतिष्ठितां वेद । प्रत्येव तिष्ठति ॥ ८॥ राजाधिराजाय प्रसह्यसाहिने । नमो वयं वैश्रवणाय
    कुर्महे । स मे कामान्कामकामाय मह्यम् । कामेश्वरो वैश्रवणो ददातु । कुबेराय वैश्रवणाय । महाराजाय नमः
    । ॐ शान्तिः शान्तिः शान्तिः ॥ तैत्तिरीयारण्यकम् अरुणप्रश्नः ७७-८४ तैत्तिरीयारण्यके प्रथमप्रपाठकः द्वाविंशोऽनुवाकः
    Eन्चोदेद् विथ् आच्चेन्त्स् ब्य् ऱजगोपल् ईयेर्
