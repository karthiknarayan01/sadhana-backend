    अदि॑तिः । अ॒स्यामे॒व प्रति॑ तिष्ठति । सो ऽत्र॑ जुहोति । अदि॑त्यै॒ स्वाहा प्रति॒ष्ठायै॒ स्वाहेति॑ ॥
    न्निर्व॑पति । य॒ज्ञो वै विष्णुः॑ । य॒ज्ञ ए॒वान्त॒तः प्रति॑ तिष्ठति । सो ऽत्र॑ जुहोति । विष्ण॑वे॒ स्वाहा॑
