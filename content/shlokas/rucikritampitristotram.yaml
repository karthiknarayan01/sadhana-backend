id: rucikritampitristotram
category: stotram
name:
  english: rucikritampitristotram
  devanagari: रुचिकृतंपितृस्तोत्रम्
content:
  english: rucikritam pitristotram brahma tiro'bhavattatra naditire rucistatah | pitrin santarpya tushtava
    pranato bhaktigauravah || 44|| namasye shriharikrishnam shashvatam vai pitamaham | anadishrikrishnanarayanam
    shripurushottamam || 45|| namasye shribrahmadhama'ksharam muktan maheshvaran | namasye sarvashaktyaishvaryani
    gunan pitamahan || 46|| hetin samastabhutishca vibhutirishvarimstatha | muktanika avataran matri~shca
    shriramadikah || 47|| namasye vyuhasamjna~shca namasye ca virajakan | namasye satyalokasthan sadhun
    brahmavidah satah || 48|| namasye tan shraddhapitrin shraddhe ye cadhidevatah | devairapi ca tarpyante
    ye shraddhe tannamamyaham || 49|| namasye'ham ca tan svarge tarpyante ye maharshibhih | tatha siddhajanaishcapi
    tarpyante tannamamyaham || 50|| guhyakairapi ye''rcyante riddhyartham tannamamyaham | namasye'ham
    ca tan pitrin ye'rcyante manavairbhuvi || 51|| namasye'ham ca tan pitrin sveshtalokapradayinah | ye'rcyante
    shraddhaya vipraih shraddhakarmasu tarpitah || 52|| prajapatyapadadatrin namasye vanitarpitah | tannamasye
    naishthikanam phaladatrin prapujitan || 53|| rajanyatarpitan pitrinnamasye makhapujitan | vaishyaprapujitan
    pitrin namasye kavyabhojanan || 54|| shudra'rcitannamasye tan sukalino'nnapujitan | asura'rcitapitri~shca
    svadhaharannamami ca || 55|| patalavasino yan ye tarpyante shraddhakarmasu | svadhaharan namasye'ham
    rasatalaih prapujitan || 56|| bhogairasheshairnagadyaih sarvaishcapi prapujitan | pitrinnamasye dyustha~shca'ntarikshasthan
    mahisthitan || 57|| vimanasthan murtarupan pitrinnamami sarvada | yogijanaih pujita~stan kleshamuktipradan
    shubhan || 58|| pitri~sta~shca namasye'ham murtan svadhabhujah sada | kamyaphalapradan sarvan svargasthan
    mokshadanapi || 59|| tripyantvicchavatam kamapradah suratvaputradah | aindrasaurapadadashca pashusvagrihashaktidah
    || 60|| candre surye rashmivasa vimanastha jalannakaih | gandharasadibhih sarve tripyantam camritapradah
    || 61|| agnau hutannabhoktaro havirbhujo'pi ye'pare | vipradehanivasashca sadhudehanivasinah || 62||
    pindadastriptimayantu maya'rpita'pkaladibhih | krishnatilaih shakapatraih prinita yantu te mudam ||
    63|| kravyadashcamarapujyah pushpagandhannabhojanaih | triptimayantu te sarve pitarah svargadayinah
    || 64|| pratyaham pujita masapujita ye'shtakasu ca | samante'bhyudaye pujyastripyantu pitaro'pi me
    || 65|| shveta viprarcitasvarkavarnah kshatriyapujitah | svarnavarna vaishyapujya nilah shudraprapujitah
    || 66|| pushpagandharasairdhupaistoyannaphalapatrakaih | agnihutena cajyena triptim yantu nato'smi
    tan || 67|| devapurvah kavyabhujo bhutisrajo bhavanti ye | bhutapreta'surarakshaugrapitrin namamyapi
    || 68|| agnishvatta barhishada ajyapah somapastatha | te'pi triptim prapadyantam tarpitah shraddhaya
    maya || 69|| pracim rakshantvagnishvatta yamyam barhishadastatha | praticimajyapa rakshantvudicim
    somapa mama || 70|| rakshobhutapishacebhyo dushtabhicaramantratah | asurapretadehibhyo yamo rakshatu
    mam sada || 71|| ekatrimshatpitriganastushta yacchantu me hitam | vishva vishvabhujo dharma dhanyah
    shubhananastatha || 72|| aradhya bhutida bhutikritashca bhutayo nava | kalyanah kalyatah kartarashca
    kalpatvahetavah || 73|| kalyatarashrayashceti shattepitriganastatha | vara varenya varadah pushtidastushtidastatha
    || 74|| dhataro vishvapatarah sapta pitriganashca te | mahantashca mahatmano mahitashca mahabalah
    || 75|| mahimavanta ityete panca pitriganastatha | sukhada dhanadashcapi dharmada bhutidastatha ||
    76|| ganashcatvara evapi sarve tushyantu me'rcitah
  devanagari: रुचिकृतं पितृस्तोत्रम् ब्रह्मा तिरोऽभवत्तत्र नदीतीरे रुचिस्ततः । पितॄन् सन्तर्प्य तुष्टाव
    प्रणतो भक्तिगौरवः ॥ ४४॥ नमस्ये श्रीहरिकृष्णं शाश्वतं वै पितामहम् । अनादिश्रीकृष्णनारायणं श्रीपुरुषोत्तमम्
    ॥ ४५॥ नमस्ये श्रीब्रह्मधामाऽक्षरं मुक्तान् महेश्वरान् । नमस्ये सर्वशक्त्यैश्वर्याणि गुणान् पितामहान्
    ॥ ४६॥ हेतीन् समस्तभूतीश्च विभूतीरीश्वरींस्तथा । मुक्तानिका अवतारान् मातॄँश्च श्रीरमादिकाः ॥ ४७॥ नमस्ये
    व्यूहसंज्ञाँश्च नमस्ये च विराजकान् । नमस्ये सत्यलोकस्थान् साधून् ब्रह्मविदः सतः ॥ ४८॥ नमस्ये तान्
    श्राद्धपितॄन् श्राद्धे ये चाधिदेवताः । देवैरपि च तर्प्यन्ते ये श्राद्धे तान्नमाम्यहम् ॥ ४९॥ नमस्येऽहं
    च तान् स्वर्गे तर्प्यन्ते ये महर्षिभिः । तथा सिद्धजनैश्चापि तर्प्यन्ते तान्नमाम्यहम् ॥ ५०॥ गुह्यकैरपि
    येऽऽर्च्यन्ते ऋद्ध्यर्थं तान्नमाम्यहम् । नमस्येऽहं च तान् पितॄन् येऽर्च्यन्ते मानवैर्भुवि ॥ ५१॥ नमस्येऽहं
    च तान् पितॄन् स्वेष्टलोकप्रदायिनः । येऽर्च्यन्ते श्रद्धया विप्रैः श्राद्धकर्मसु तर्पिताः ॥ ५२॥ प्राजापत्यपददातॄन्
    नमस्ये वनितर्पिताः । तान्नमस्ये नैष्ठिकानां फलदातॄन् प्रपूजितान् ॥ ५३॥ राजन्यतर्पितान् पितॄन्नमस्ये
    मखपूजितान् । वैश्यप्रपूजितान् पितॄन् नमस्ये कव्यभोजनान् ॥ ५४॥ शूद्राऽर्चितान्नमस्ये तान् सुकालिनोऽन्नपूजितान्
    । आसुराऽर्चितपितॄँश्च स्वधाहारान्नमामि च ॥ ५५॥ पातालवासिनो यान् ये तर्प्यन्ते श्राद्धकर्मसु । स्वधाहारान्
    नमस्येऽहं रसातलैः प्रपूजितान् ॥ ५६॥ भोगैरशेषैर्नागाद्यैः सर्वैश्चापि प्रपूजितान् । पितॄन्नमस्ये द्युस्थाँश्चाऽन्तरिक्षास्थान्
    महीस्थितान् ॥ ५७॥ विमानस्थान् मूर्तरूपान् पितॄन्नमामि सर्वदा । योगिजनैः पूजिताँस्तान् क्लेशमुक्तिप्रदान्
    शुभान् ॥ ५८॥ पितॄँस्ताँश्च नमस्येऽहं मूर्तान् स्वधाभुजः सदा । काम्यफलप्रदान् सर्वान् स्वर्गस्थान्
    मोक्षदानपि ॥ ५९॥ तृप्यन्त्विच्छावतां कामप्रदाः सुरत्वपुत्रदाः । ऐन्द्रसौरपददाश्च पशुस्वगृहशक्तिदाः
    ॥ ६०॥ चन्द्रे सूर्ये रश्मिवासा विमानस्था जलान्नकैः । गन्धरसादिभिः सर्वे तृप्यन्तां चामृतप्रदाः ॥ ६१॥
    अग्नौ हुतान्नभोक्तारो हविर्भुजोऽपि येऽपरे । विप्रदेहनिवासाश्च साधुदेहनिवासिनः ॥ ६२॥ पिण्डादास्तृप्तिमायान्तु
    मयाऽर्पिताऽप्कलादिभिः । कृष्णतिलैः शाकपत्रैः प्रीणिता यन्तु ते मुदम् ॥ ६३॥ क्रव्यादाश्चामरपूज्याः
    पुष्पगन्धान्नभोजनैः । तृप्तिमायान्तु ते सर्वे पितरः स्वर्गदायिनः ॥ ६४॥ प्रत्यहं पूजिता मासपूजिता येऽष्टकासु
    च । समान्तेऽभ्युदये पूज्यास्तृप्यन्तु पितरोऽपि मे ॥ ६५॥ श्वेता विप्रार्चितास्वार्कवर्णाः क्षत्रियपूजिताः
    । स्वर्णवर्णा वैश्यपूज्या नीलाः शूद्रप्रपूजिताः ॥ ६६॥ पुष्पगन्धरसैर्धूपैस्तोयान्नफलपत्रकैः । अग्निहुतेन
    चाज्येन तृप्तिं यान्तु नतोऽस्मि तान् ॥ ६७॥ देवपूर्वाः कव्यभुजो भूतिस्रजो भवन्ति ये । भूतप्रेताऽसुररक्षउग्रपितॄन्
    नमाम्यपि ॥ ६८॥ अग्निष्वात्ता बर्हिषद आज्यपाः सोमपास्तथा । तेऽपि तृप्तिं प्रपद्यन्तां तर्पिताः श्रद्धया
    मया ॥ ६९॥ प्राचीं रक्षन्त्वग्निष्वात्ता याम्यां बर्हिषदस्तथा । प्रतीचीमाज्यपा रक्षन्त्वुदीचीं सोमपा
    मम ॥ ७०॥ रक्षोभूतपिशाचेभ्यो दुष्टाभिचारमन्त्रतः । आसुरप्रेतदेहिभ्यो यमो रक्षतु मां सदा ॥ ७१॥ एकत्रिंशत्पितृगणास्तुष्टा
    यच्छन्तु मे हितम् । विश्वा विश्वभुजो धर्मा धन्याः शुभाननास्तथा ॥ ७२॥ आराध्या भूतिदा भूतिकृतश्च भूतयो
    नव । कल्याणाः कल्यताः कर्तारश्च कल्पत्वहेतवः ॥ ७३॥ कल्यतराश्रयाश्चेति षट्टेपितृगणास्तथा । वरा वरेण्या
    वरदाः पुष्टिदास्तुष्टिदास्तथा ॥ ७४॥ धातारो विश्वपातारः सप्त पितृगणाश्च ते । महान्तश्च महात्मानो महिताश्च
    महाबलाः ॥ ७५॥ महिमावन्त इत्येते पञ्च पितृगणास्तथा । सुखदा धनदाश्चापि धर्मदा भूतिदास्तथा ॥ ७६॥ गणाश्चत्वार
    एवापि सर्वे तुष्यन्तु मेऽर्चिताः
