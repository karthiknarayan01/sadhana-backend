id: jaiminiproktamjagannathastotram
category: stotram
name:
  english: jaiminiproktamjagannathastotram
  devanagari: जैमिनिप्रोक्तंजगन्नाथस्तोत्रम्
content:
  english: 40|| samsarasindhusalile mohavartte sudustare | shadurmikuladushpare kukarmagrahadarune ||
    41|| nirashraye niralambe nihsare duhkhaphenile | tava mayagunairbaddhamavasham patitam tatah || 42||
    mam samuddhara devesha kripapangavilokanaih | tatra magnam surashreshtha suprasadaprakashaka || 43||
    eka eva jagannatha bandhustvam bhavabhirunam | bubhuksha ca pipasa ca pranasya manasah smritau ||
    44|| shokamohau sharirasya jara mrityurvapurbhavah | tvatsrishtau tadrisho nasti yo dinaparipalakah
    || 45|| avatirno'si lokanamanugrahadhiya vibho | purnakamasya te natha kimanyatkaranam kshitau ||
    46|| tvatpadapadmamasadya na cintasti jagatpate | yataste caranambhojam caturvargaikasadhanam || 47||
    darshanatsarvalokanam sarvavanchaphalapradam | tatah siradhvajam sheshamantrena paripujayet || 48||
    iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye trimshadhyayantargatam jaiminiproktam
    jagannathastotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda | adhyaya 30
  devanagari: ४०॥ संसारसिन्धुसलिले मोहावर्त्ते सुदुस्तरे । षडूर्मिकुलदुष्पारे कुकर्मग्राहदारुणे ॥ ४१॥
    निराश्रये निरालम्बे निःसारे दुःखफेनिले । तव मायागुणैर्बद्धमवशं पतितं ततः ॥ ४२॥ मां समुद्धर देवेश कृपापाङ्गविलोकनैः
    । तत्र मग्नं सुरश्रेष्ठ सुप्रसादप्रकाशक ॥ ४३॥ एक एव जगन्नाथ बन्धुस्त्वं भवभीरुणाम् । बुभुक्षा च पिपासा
    च प्राणस्य मनसः स्मृतौ ॥ ४४॥ शोकमोहौ शरीरस्य जरा मृत्युर्वपुर्भवः । त्वत्सृष्टौ तादृशो नास्ति यो दीनपरिपालकः
    ॥ ४५॥ अवतीर्णोऽसि लोकानामनुग्रहधिया विभो । पूर्णकामस्य ते नाथ किमन्यत्कारणं क्षितौ ॥ ४६॥ त्वत्पादपद्ममासाद्य
    न चिन्तास्ति जगत्पते । यतस्ते चरणाम्भोजं चतुर्वर्गैकसाधनम् ॥ ४७॥ दर्शनात्सर्वलोकानां सर्ववाञ्छाफलप्रदम्
    । ततः सीरध्वजं शेषमन्त्रेण परिपूजयेत् ॥ ४८॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये
    त्रिंशाध्यायान्तर्गतं जैमिनिप्रोक्तं जगन्नाथस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड
    । अध्याय ३०
