id: sri-venkateswara-prapatti
category: stotram
name:
  english: Sri Venkateswara Prapatti
content:
  english: ishanam jagato'sya venkatapate rvishnoh param preyasim tadvakshahsthala nityavasarasikam tat
    kshanti samvardhinim | padmalankrita panipallavayugam padmasanastham shriyam vatsalyadi gunojjvalam
    bhagavatim vande jaganmataram || shriman kripajalanidhe kritasarvaloka sarvajna shakta natavatsala
    sarvasheshin | svamin sushila sula bhashrita parijata shrivenkateshacaranau sharanam prapadye || ||
    anupurarcita sujata sugandhi pushpa saurabhya saurabhakarau samasanniveshau | saumyau sadanubhane'pi
    navanubhavyau shrivenkatesha caranau sharanam prapadye || || sadyovikasi samudittvara sandraraga saurabhyanirbhara
    saroruha samyavartam | samyakshu sahasapadeshu vilekhayantau shrivenkatesha caranau sharanam prapadye
    || || rekhamaya dhvaja sudhakalashatapatra vajrankushamburuha kalpaka shankhacakraih | bhavyairalankritatalau
    paratattva cihnaih shrivenkatesha caranau sharanam prapadye || || tamrodaradyuti parajita padmaragau
    bahyair mahobhi rabhibhuta mahendranilau | udya nnakhamshubhi rudasta shashanka bhasau shrivenkatesha
    caranau sharanam prapadye || || sa premabhiti kamalakara pallavabhyam samvahane'pi sapadi klama madhadhanau
    | kanta navanmanasa gocara saukumaryau shrivenkatesha caranau sharanam prapadye || || lakshmi mahi
    tadanurupa nijanubhava niladi divya mahishi karapallavanam | arunya sankramanatah kila sandraragau
    shrivenkatesha caranau sharanam prapadye || || nityanamadvidhi shivadi kiritakoti pratyupta dipta
    navaratnamahah prarohaih | nirajanavidhi mudara mupadadhanau shrivenkatesha caranau sharanam prapadye
    || iti bhogya taya'pyupattau | bhuyastatheti tava panitala pradishtau shrivenkatesha caranau sharanam
    prapadye || sadrisha saradhina tvayaiva yau darshitau svacaranau sharanam vrajeti | bhuyo'pi mahya
    miha tau karadarshitau te shrivenkatesha caranau sharanam prapadye || || manmurthni kaliyaphane vikatatavishu
    shrivenkatadri shikhare shirasi shrutinam | citte'pyananya manasam samamahitau te shrivenkatesha caranau
    sharanam prapadye || || amlana hrishya davanitala kirnapushpau shrivenkatadri shikharabharanaya manau
    | ananditakhila mano nayanau tavai tau shrivenkatesha caranau sharanam prapadye || || prayah prapanna
    janata prathamavagahyau matuh stanaviva shisho ramritayamanau | praptau paraspara tula matulantarau
    te shrivenkatesha caranau sharanam prapadye || || sattvottaraih satata sevyapadambujena samsara taraka
    dayardra drigancalena | saumyopayantri munina mama darshitau te shrivenkatesha caranau sharanam prapadye
    || || shrisha shriya ghatikaya tvadupaya bhave prapyetvayi svayamupeya taya sphurantya | nityashritaya
    niravadya gunaya tubhyam syam kinkaro vrishagirisha na jatu mahyam || || iti shrivenkatesha prapattih
  devanagari: ईशानां जगतोऽस्य वेङ्कटपते र्विष्णोः परां प्रेयसीं तद्वक्षःस्थल नित्यवासरसिकां तत् क्षान्ति
    संवर्धिनीम् । पद्मालङ्कृत पाणिपल्लवयुगां पद्मासनस्थां श्रियं वात्सल्यादि गुणोज्ज्वलां भगवतीं वन्दे
    जगन्मातरम् ॥ श्रीमन् कृपाजलनिधे कृतसर्वलोक सर्वज्ञ शक्त नतवत्सल सर्वशेषिन् । स्वामिन् सुशील सुल भाश्रित
    पारिजात श्रीवेङ्कटेशचरणौ शरणं प्रपद्ये ॥ ॥ आनूपुरार्चित सुजात सुगन्धि पुष्प सौरभ्य सौरभकरौ समसन्निवेशौ
    । सौम्यौ सदानुभनेऽपि नवानुभाव्यौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ सद्योविकासि समुदित्त्वर सान्द्रराग
    सौरभ्यनिर्भर सरोरुह साम्यवार्ताम् । सम्यक्षु साहसपदेषु विलेखयन्तौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये
    ॥ ॥ रेखामय ध्वज सुधाकलशातपत्र वज्राङ्कुशाम्बुरुह कल्पक शङ्खचक्रैः । भव्यैरलङ्कृततलौ परतत्त्व चिह्नैः
    श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ ताम्रोदरद्युति पराजित पद्मरागौ बाह्यैर् महोभि रभिभूत महेन्द्रनीलौ
    । उद्य न्नखांशुभि रुदस्त शशाङ्क भासौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ स प्रेमभीति कमलाकर पल्लवाभ्यां
    संवाहनेऽपि सपदि क्लम माधधानौ । कान्ता नवाङ्मानस गोचर सौकुमार्यौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥
    ॥ लक्ष्मी मही तदनुरूप निजानुभाव नीलादि दिव्य महिषी करपल्लवानाम् । आरुण्य सङ्क्रमणतः किल सान्द्ररागौ
    श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ नित्यानमद्विधि शिवादि किरीटकोटि प्रत्युप्त दीप्त नवरत्नमहः प्ररोहैः
    । नीराजनाविधि मुदार मुपादधानौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ इति भोग्य तयाऽप्युपात्तौ । भूयस्तथेति
    तव पाणितल प्रदिष्टौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ सदृश सारधिना त्वयैव यौ दर्शितौ स्वचरणौ शरणं
    व्रजेति । भूयोऽपि मह्य मिह तौ करदर्शितौ ते श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ मन्मूर्थ्नि कालियफने
    विकटाटवीषु श्रीवेङ्कटाद्रि शिखरे शिरसि श्रुतीनाम् । चित्तेऽप्यनन्य मनसां सममाहितौ ते श्रीवेङ्कटेश
    चरणौ शरणं प्रपद्ये ॥ ॥ अम्लान हृष्य दवनीतल कीर्णपुष्पौ श्रीवेङ्कटाद्रि शिखराभरणाय मानौ । आनन्दिताखिल
    मनो नयनौ तवै तौ श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ प्रायः प्रपन्न जनता प्रथमावगाह्यौ मातुः स्तनाविव
    शिशो रमृतायमाणौ । प्राप्तौ परस्पर तुला मतुलान्तरौ ते श्रीवेङ्कटेश चरणौ शरणं प्रपद्ये ॥ ॥ सत्त्वोत्तरैः
    सतत सेव्यपदाम्बुजेन संसार तारक दयार्द्र दृगञ्चलेन । सौम्योपयन्तृ मुनिना मम दर्शितौ ते श्रीवेङ्कटेश
    चरणौ शरणं प्रपद्ये ॥ ॥ श्रीश श्रिया घटिकया त्वदुपाय भावे प्राप्येत्वयि स्वयमुपेय तया स्फुरन्त्या ।
    नित्याश्रिताय निरवद्य गुणाय तुभ्यं स्यां किङ्करो वृषगिरीश न जातु मह्यम् ॥ ॥ इति श्रीवेङ्कटेश प्रपत्तिः
