id: suryashataka-2
category: shataka
name:
  english: suryashataka
  devanagari: सूर्यशतक
content:
  english: lokabhyudaya krama~llolo'pi loka~stadupakritikritavashritah sthairyakotim nrinam drishtim vijihmam
    vidadhadapi karotyantaratyantabhadram | yastapasyapi heturbhavati niyaminamekanirvanadayi bhuyatsa
    pragavasthadhikataraparinamodayo'rkah shriye vah || 86|| vyapannarturna kalo vyabhicarati phalam naushadhirvrishtirishta
    naishtaistripyanti deva na hi vahati marunnirmalabhani bhani | ashah shanta na bhindantyavadhimudadhayo
    bibhrati kshmabhritah kshmam yasmimstrailokyamevam na calati tapati statsa suryah shriye vah || 87||
    kailase krittivasa viharati virahatrasadehodhakantah shrantah shete mahahavadhijaladhi vina chadmana
    padmanabhah | yogodyogaikatano gamayati sakalam vasaram svam svayambhu
  devanagari: लोकाभ्युदय क्रामँल्लोलोऽपि लोकाँस्तदुपकृतिकृतावाश्रितः स्थैर्यकोटिं नॄणां दृष्टिं विजिह्मां
    विदधदपि करोत्यन्तरत्यन्तभद्राम् । यस्तापस्यापि हेतुर्भवति नियमिनामेकनिर्वाणदायी भूयात्स प्रागवस्थाधिकतरपरिणामोदयोऽर्कः
    श्रिये वः ॥ ८६॥ व्यापन्नर्तुर्न कालो व्यभिचरति फलं नौषधीर्वृष्टिरिष्टा नैष्टैस्तृप्यन्ति देवा न हि
    वहति मरुन्निर्मलाभानि भानि । आशाः शान्ता न भिन्दन्त्यवधिमुदधयो बिभ्रति क्ष्माभृतः क्ष्मां यस्मिंस्त्रैलोक्यमेवं
    न चलति तपति स्तात्स सूर्यः श्रिये वः ॥ ८७॥ कैलासे कृत्तिवासा विहरति विरहत्रासदेहोढकान्तः श्रान्तः
    शेते महाहावधिजलधि विना छद्मना पद्मनाभः । योगोद्योगैकतानो गमयति सकलं वासरं स्वं स्वयम्भू
