id: parvatistotram
category: stotram
name:
  english: parvatistotram
  devanagari: पार्वतीस्तोत्रम्
content:
  english: shriparvatistotram balarkayutasatprabham karatale lolambamalakulam mala sandadhatim manoharatanum
    mandasmitodyanmukhim | mandam mandamupeyushim varayitum shambhum jaganmohinim vande devamunindravanditapadamishtarthadam
    parvatim || 1|| hemabham mativagatitagunashilanalpashilpakritim premarohamanoharam karalasatkalyanadamancitam
    | shyamamishvaramudyatam varayitum trailokyasammohinim kamapadanakalpavallimanisham vande param devatam
    || 2|| karadhritavaramalya sarvaraktangabhusha nikhilanayanacetoharirupagryavesha vesha | bhavatu
    bhavadabhishtapraptaye shailakanya purushayuvativashyakrishtinityapragalbha || 3|| hemadrau hemapithe
    natanikhilasurairidyamanam viraja
  devanagari: श्रीपार्वतीस्तोत्रम् बालार्कायुतसत्प्रभां करतले लोलम्बमालाकुलां माला सन्दधतीं मनोहरतनुं
    मन्दस्मितोद्यन्मुखीम् । मन्दं मन्दमुपेयुषीं वरयितुं शम्भुं जगन्मोहिनीं वन्दे देवमुनीन्द्रवन्दितपदामिष्टार्थदां
    पार्वतीम् ॥ १॥ हेमाभां मतिवागतीतगुणशीलानल्पशिल्पाकृतिं प्रेमारोहमनोहरां करलसत्कल्याणदामाञ्चिताम् ।
    श्यामामीश्वरमुद्यतां वरयितुं त्रैलोक्यसम्मोहिनीं कामापादनकल्पवल्लिमनिशं वन्दे परां देवताम् ॥ २॥ करधृतवरमाल्या
    सर्वरक्ताङ्गभूषा निखिलनयनचेतोहारिरूपाग्र्यवेषा वेषा । भवतु भवदभीष्टप्राप्तये शैलकन्या पुरुषयुवतिवश्याकृष्टिनित्यप्रगल्भा
    ॥ ३॥ हेमाद्रौ हेमपीठे नतनिखिलसुरैरीड्यमानां विराज
meaning: {}
