id: vajrasattvastotram
category: stotram
name:
  english: vajrasattvastotram
  devanagari: वज्रसत्त्वस्तोत्रम्
content:
  english: vajrasattvastotram vande shri | vajrasattvam bhuvanavaragurum sarvabuddham bhavantam nanarupam
    jinendram timirabhayaharam nirmitam merushantam | dharmadharam muninam jinagunashubhadam mandalam
    vajradhatum sarvanandaikarupam paramasukhamayam dehinam mokshahetum || 1|| ajnanagadhatimirarnavamagnasattvamohandhakaratamavaranacandrarashmih
    | jnanam prakashya paripuritaviryadhyanam shrivajrasattvamasamam shirasa namami || 2|| yasmin surasurasurendranarendravrindastvatpadapadmapatita
    bhramarah shirobhih | tatsiddhisadhanapayodhimahanidhanam shrilokanathacaranam sharanam prayami ||
    3|| buddham trailokyanatham suravaranamitam parasamsaratirnam dhiram gambhiryavantam sakalagunanidhim
    dharmarajabhishiktam | trishnamohandhakaram kalikalushaharam kamalobhadavantam tam vande shakyasimham
    pranamitashirasa sarvakalam namami || 4|| hrinkarasambhavam natham karunasnigdhamanasam | amoghapashanamanam
    lokanatham namamyaham || 5|| mamaki locana tara padmini jinadhatave | sarvabuddhalayam caityam dharmadhatum
    namami tam || 6|| namastare ture vire tuttare bhayanashini | ture sarvature kale svahakaram namamyaham
    || 7|| saddharmapundarikaksham sarvajnagunasagaram | samantabhadrashastaram shakyasimham namamyaham
    || 8|| iti shrivajrasattvastotram sampurnam ||
  devanagari: वज्रसत्त्वस्तोत्रम् वन्दे श्री । वज्रसत्त्वं भुवनवरगुरुं सर्वबुद्धं भवन्तं नानारूपं जिनेन्द्रं
    तिमिरभयहरं निर्मितं मेरुशान्तम् । धर्माधारं मुनीनां जिनगुणशुभदं मण्डलं वज्रधातुं सर्वानन्दैकरूपं परमसुखमयं
    देहिनां मोक्षहेतुम् ॥ १॥ अज्ञानगाढतिमिरार्णवमग्नसत्त्वमोहान्धकारतमवारणचन्द्ररश्मिः । ज्ञानं प्रकाश्य
    परिपूरितवीर्यध्यानं श्रीवज्रसत्त्वमसमं शिरसा नमामि ॥ २॥ यस्मिन् सुरासुरसुरेन्द्रनरेन्द्रवृन्दास्त्वत्पादपद्मपतिता
    भ्रमराः शिरोभिः । तत्सिद्धिसाधनपयोधिमहानिधानं श्रीलोकनाथचरणं शरणं प्रयामि ॥ ३॥ बुद्धं त्रैलोक्यनाथं
    सुरवरनमितं पारसंसारतीर्णं धीरं गाम्भीर्यवन्तं सकलगुणनिधिं धर्मराजाभिषिक्तम् । तृष्णामोहान्धकारं कलिकलुषहरं
    कामलोभादवन्तं तं वन्दे शाक्यसिंहं प्रणमितशिरसा सर्वकालं नमामि ॥ ४॥ ह्रीङ्कारसम्भवं नाथं करुणास्निग्धमानसम्
    । अमोघपाशनामानं लोकनाथं नमाम्यहम् ॥ ५॥ मामकी लोचना तारा पद्मिनी जिनधातवे । सर्वबुद्धालयं चैत्यं धर्मधातुं
    नमामि तम् ॥ ६॥ नमस्तारे तुरे वीरे तुत्तारे भयनाशिनि । तुरे सर्वातुरे काले स्वाहाकारं नमाम्यहम् ॥ ७॥
    सद्धर्मपुण्डरीकाक्षं सर्वज्ञगुणसागरम् । समन्तभद्रशास्तारं शाक्यसिंहं नमाम्यहम् ॥ ८॥ इति श्रीवज्रसत्त्वस्तोत्रं
    सम्पूर्णम् ॥
