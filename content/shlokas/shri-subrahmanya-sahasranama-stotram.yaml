id: shri-subrahmanya-sahasranama-stotram
category: stotram
name:
  english: shri subrahmanya sahasranama stotram
  devanagari: श्री सुब्रह्मण्य सहस्रनाम स्तोत्रम्
content:
  english: dhyayetshanmukhamindukotisadrisham ratnaprabhashobhitam | balarkadyutishatkiritavilasatkeyuraharanvitam
    ||1|| karnalambitakundalapravilasadgandasthalashobhitam | kancikankanakimkiniravayutam shringarasarodayam
    ||2|| dhyayedipsitasiddhidam shivasutam shridvadashaksham guham | khetam kukkutamamkusham ca varadam
    pasham dhanushcakrakam ||3|| vajram shaktimasim ca shulamabhayam dorbhirdhritam shanmukham | devam
    citramayuravahanagatam citrambaralamkritam ||4|| subrahmanya sahasranama stotram || acintyashaktiranaghastvakshobhyastvaparajitah
    | anathavatsalo'moghastvashoko'pyajaro'bhayah ||1|| atyudaro hyaghaharastvagraganyo'drijasutah | anantamahima'paro'nantasaukhyaprado'vyayah
    ||2|| anantamokshado'nadiraprameyo'ksharo'cyutah | akalmasho'bhiramo'gradhuryashcamitavikramah ||3||
    anathanatho hyamalo hyapramatto'maraprabhuh | arindamo'khiladharastvanimadiguno'granih ||4|| acancalo'marastutyo
    hyakalanko'mitashanah | agnibhuranavadyango hyadbhuto'bhishtadayakah ||5|| atindriyo'prameyatma hyadrishyo'vyaktalakshanah
    | apadvinashakastvarya adhya agamasamstutah ||6|| artasamrakshanastvadya anandastvaryasevitah | ashriteshtarthavarada
    anandyartaphalapradah ||7|| ashcaryarupa ananda apannartivinashanah | ibhavaktranujastvishta ibhasuraharatmajah
    ||8|| itihasashrutistutya indrabhogaphalapradah | ishtapurtaphalapraptirishteshtavaradayakah ||9||
    ihamutreshtaphalada ishtadastvindravanditah | idaniyastvishaputra ipsitarthapradayakah ||10|| itibhitiharashcedya
    ishanatrayavarjitah | udarakirtirudyogi cotkrishtoruparakramah ||11|| utkrishtashaktirutsaha udarashcotsavapriyah
    | ujjrimbha udbhavashcogra udagrashcogralocanah ||12|| unmatta ugrashamana udvegaghnorageshvarah |
    uruprabhavashcodirna umaputra udaradhih ||13|| urdhvaretahsutasturdhvagatidasturjapalakah | urjitasturdhvagasturdhva
    urdhvalokaikanayakah ||14|| urjivanurjitodara urjitorjitashasanah | rishidevaganastutya rinatrayavimocanah
    ||15|| rijurupo hyrijukara rijumargapradarshanah | ritambharo hyrijuprita rishabhastvriddhidastvritah
    ||16|| lulitoddharako lutabhavapashaprabhanjanah | enankadharasatputra eka enovinashanah ||17|| aishvaryadashcaindrabhogi
    caitihyashcaindravanditah | ojasvi caushadhisthanamojodashcaudanapradah ||18|| audaryashila aumeya
    augra aunnatyadayakah | audarya aushadhakara aushadham caushadhakarah ||19|| amshumalyamshumalidya
    ambikatanayo'nnadah | andhakarisuto'ndhatvahari cambujalocanah ||20|| astamayo'maradhisho hyaspashto'stokapunyadah
    | astamitro'starupashcaskhalatsugatidayakah ||21|| kartikeyah kamarupah kumarah krauncadaranah | kamadah
    karanam kamyah kamaniyah kripakarah ||22|| kancanabhah kantiyuktah kami kamapradah kavih | kirtikritkukkutadharah
    kutasthah kuvalekshanah ||23|| kunkumangah klamaharah kushalah kukkutadhvajah | kushanusambhavah krurah
    kruraghnah kalitapahrit ||24|| kamarupah kalpataruh kantah kamitadayakah | kalyanakritkleshanashah
    kripaluh karunakarah ||25|| kalushaghnah kriyashaktih kathorah kavaci kriti | komalangah kushapritah
    kutsitaghnah kaladharah ||26|| khyatah khetadharah khadgi khatvangi khalanigrahah | khyatipradah khecareshah
    khyatehah khecarastutah ||27|| kharatapaharah svasthah khecarah khecarashrayah | khandendumaulitanayah
    khelah khecarapalakah ||28|| khasthalah khanditarkashca khecarijanapujitah | gangeyo girijaputro gananathanujo
    guhah ||29|| gopta girvanasamsevyo gunatito guhashrayah | gatiprado gunanidhih gambhiro girijatmajah
    ||30|| gudharupo gadaharo gunadhisho gunagranih | godharo gahano gupto garvaghno gunavardhanah ||31||
    guhyo gunajno gitijno gatatanko gunashrayah | gadyapadyapriyo gunyo gostuto gaganecarah ||32|| gananiyacaritrashca
    gataklesho gunarnavah | ghurnitaksho ghrininidhih ghanagambhiraghoshanah ||33|| ghantanadapriyo ghosho
    ghoraghaughavinashanah | ghananando gharmahanta ghrinavan ghrishtipatakah ||34|| ghrini ghrinakaro
    ghoro ghoradaityapraharakah | ghatitaishvaryasamdoho ghanartho ghanasamkramah ||35|| citrakriccitravarnashca
    cancalashcapaladyutih | cinmayashcitsvarupashca ciranandashciramtanah ||36|| citrakelishcitratarashcintaniyashcamatkritih
    | coraghnashcaturashcarushcamikaravibhushanah ||37|| candrarkakotisadrishashcandramaulitanubhavah
    | chaditangashchadmahanta cheditakhilapatakah ||38|| chedikritatamahkleshashchatrikritamahayashah
    | chaditasheshasamtapashcharitamritasagarah ||39|| channatraigunyarupashca chatehashchinnasamshayah
    | chandomayashchandagami chinnapashashchavishchadah ||40|| jagaddhito jagatpujyo jagajjyeshtho jaganmayah
    | janako jahnavisunurjitamitro jagadguruh ||41|| jayi jitendriyo jaitro jaramaranavarjitah | jyotirmayo
    jagannatho jagajjivo janashrayah ||42|| jagatsevyo jagatkarta jagatsakshi jagatpriyah | jambharivandyo
    jayado jaganjanamanoharah ||43|| jagadanandajanako janajadyapaharakah | japakusumasamkasho janalocanashobhanah
    ||44|| janeshvaro jitakrodho janajanmanibarhanah | jayado jantutapaghno jitadaityamahavrajah ||45||
    jitamayo jitakrodho jitasango janapriyah | jhamjhanilamahavego jharitasheshapatakah ||46|| jharjharikritadaityaugho
    jhallarivadyasampriyah | jnanamurtirjnanagamyo jnani jnanamahanidhih ||47|| tamkaranrittavibhavah
    tamkavajradhvajankitah | tamkitakhilalokashca tamkitainastamoravih ||48|| dambaraprabhavo dambho dambo
    damarukapriyah | damarotkatasannado dimbharupasvarupakah ||49|| dhakkanadapritikaro dhalitasurasamkulah
    | dhaukitamarasamdoho dhundivighneshvaranujah ||50|| tattvajnastatvagastivrastaporupastapomayah |
    trayimayastrikalajnastrimurtistrigunatmakah ||51|| tridasheshastarakaristapaghnastapasapriyah | tushtidastushtikrittikshnastaporupastrikalavit
    ||52|| stota stavyah stavapritah stutih stotram stutipriyah | sthitah sthayi sthapakashca sthulasukshmapradarshakah
    ||53|| sthavishthah sthavirah sthulah sthanadah sthairyadah sthirah | danto dayaparo data duritaghno
    durasadah ||54|| darshaniyo dayasaro devadevo dayanidhih | duradharsho durvigahyo daksho darpanashobhitah
    ||55|| durdharo danashilashca dvadashaksho dvishadbhujah | dvishatkarno dvishadbahurdinasamtapanashanah
    ||56|| dandashukeshvaro devo divyo divyakritirdamah | dirghavritto dirghabahurdirghadrishtirdivaspatih
    ||57|| dando damayita darpo devasimho dridhavratah | durlabho durgamo dipto dushprekshyo divyamandanah
    ||58|| durodaraghno duhkhaghno durarighno dishampatih | durjayo devasenesho durjneyo duratikramah
    ||59|| dambho driptashca devarshirdaivajno daivacintakah | dhuramdharo dharmaparo dhanado dhritivardhanah
    ||60|| dharmesho dharmashastrajno dhanvi dharmaparayanah | dhanadhyaksho dhanapatirdhritimandhutakilbishah
    ||61|| dharmaheturdharmashuro dharmakriddharmavid dhruvah | dhata dhimandharmacari dhanyo dhuryo dhritavratah
    ||62|| nityotsavo nityatripto nirlepo nishcalatmakah | niravadyo niradharo nishkalanko niranjanah
    ||63|| nirmamo nirahamkaro nirmoho nirupadravah | nityanando niratanko nishprapanco niramayah ||64||
    niravadyo nirihashca nirdarsho nirmalatmakah | nityanando nirjaresho nihsango nigamastutah ||65||
    nishkantako niralambo nishpratyuho nirudbhavah | nityo niyatakalyano nirvikalpo nirashrayah ||66||
    neta nidhirnaikarupo nirakaro nadisutah | pulindakanyaramanah purujitparamapriyah ||67|| pratyakshamurtih
    pratyakshah pareshah purnapunyadah | punyakarah punyarupah punyah punyaparayanah ||68|| punyodayah
    param jyotih punyakritpunyavardhanah | paranandah paratarah punyakirtih puratanah ||69|| prasannarupah
    praneshah pannagah papanashanah | pranatartiharah purnah parvatinandanah prabhuh ||70|| putatma purushah
    pranah prabhavah purushottamah | prasannah paramaspashtah parah parivridhah parah ||71|| paramatma
    parabrahma pararthah priyadarshanah | pavitrah pushtidah purtih pingalah pushtivardhanah ||72|| papahari
    pashadharah pramattasurashikshakah | pavanah pavakah pujyah purnanandah paratparah ||73|| pushkalah
    pravarah purvah pitribhaktah purogamah | pranadah pranijanakah pradishtah pavakodbhavah ||74|| parabrahmasvarupashca
    paramaishvaryakaranam | pararddhidah pushtikarah prakashatma pratapavan ||75|| prajnaparah prakrishtarthah
    prithuh prithuparakramah | phanishvarah phanivarah phanamanivibhushanah ||76|| phaladah phalahastashca
    phullambujavilocanah | phaduccatitapapaughah phanilokavibhushanah ||77|| bahuleyo brihadrupo balishtho
    balavan bali | brahmeshavishnurupashca buddho buddhimatam varah ||78|| balarupo brahmagarbho brahmacari
    budhapriyah | bahushruto bahumato brahmanyo brahmanapriyah ||79|| balapramathano brahma bahurupo bahupradah
    | brihadbhanutanudbhuto brihatseno bileshayah ||80|| bahubahurbalashriman bahudaityavinashakah | biladvarantaralastho
    brihacchaktidhanurdharah ||81|| balarkadyutiman balo brihadvaksha brihaddhanuh | bhavyo bhogishvaro
    bhavyo bhavanasho bhavapriyah ||82|| bhaktigamyo bhayaharo bhavajno bhaktasupriyah | bhuktimuktiprado
    bhogi bhagavan bhagyavardhanah ||83|| bhrajishnurbhavano bharta bhimo bhimaparakramah | bhutido bhutikridbhokta
    bhutatma bhuvaneshvarah ||84|| bhavako bhikaro bhishmo bhavakeshto bhavodbhavah | bhavatapaprashamano
    bhogavan bhutabhavanah ||85|| bhojyaprado bhrantinasho bhanuman bhuvanashrayah | bhuribhoogaprado
    bhadro bhajaniyo bhishagvarah ||86|| mahaseno mahodaro mahashaktirmahadyutih | mahabuddhirmahaviryo
    mahotsaho mahabalah ||87|| mahabhogi mahamayi medhavi mekhali mahan | munistuto mahamanyo mahanando
    mahayashah ||88|| mahorjito mananidhirmanorathaphalapradah | mahodayo mahapunyo mahabalaparakramah
    ||89|| manado matido mali muktamalavibhushanah | manoharo mahamukhyo maharddhirmurtimanmunih ||90||
    mahottamo mahopayo mokshado mangalapradah | mudakaro muktidata mahabhogo mahoragah ||91|| yashaskaro
    yogayoniryogishtho yaminam varah | yashasvi yogapurusho yogyo yoganidhiryami ||92|| yatisevyo yogayukto
    yogavidyogasiddhidah | yantro yantri ca yantrajno yantravanyantravahakah || 93|| yatanarahito yogi
    yogisho yoginam varah | ramaniyo ramyarupo rasajno rasabhavanah ||94|| ranjano ranjito ragi ruciro
    rudrasambhavah | ranapriyo ranodaro ragadveshavinashanah ||95|| ratnarci ruciro ramyo rupalavanyavigrahah
    | ratnangadadharo ratnabhushano ramaniyakah ||96|| rucikridrocamanashca ranjito roganashanah | rajivaksho
    rajarajo raktamalyanulepanah ||97|| rajadvedagamastutyo rajahsattvagunanvitah | rajanishakalaramyo
    ratnakundalamanditah ||98|| ratnasanmaulishobhadhyo rananmanjirabhushanah | lokaikanatho lokesho lalito
    lokanayakah ||99|| lokaraksho lokashiksho lokalocanaranjitah | lokabandhurlokadhata lokatrayamahahitah
    ||100|| lokacudamanirlokavandyo lavanyavigrahah | lokadhyakshastu lilavanlokottaragunanvitah ||101||
    varishtho varado vaidyo vishishto vikramo vibhuh | vibudhagracaro vashyo vikalpaparivarjitah ||102||
    vipasho vigatatanko vicitrango virocanah | vidyadharo vishuddhatma vedango vibudhapriyah ||103|| vacaskaro
    vyapakashca vijnani vinayanvitah | vidvattamo virodhighno viro vigataragavan ||104|| vitabhavo vinitatma
    vedagarbho vasupradah | vishvadiptirvishalaksho vijitatma vibhavanah ||105|| vedavedyo vidheyatma
    vitadoshashca vedavit | vishvakarma vitabhayo vagisho vasavarcitah ||106|| viradhvamso vishvamurtirvishvarupo
    varasanah | vishakho vimalo vagmi vidvanvedadharo vatuh ||107|| viracudamanirviro vidyesho vibudhashrayah
    | vijayi vinayi vetta variyanviraja vasuh ||108|| viraghno vijvaro vedyo vegavanviryavanvashi | varashilo
    varaguno vishoko vajradharakah ||109|| sharajanma shaktidharah shatrughnah shikhivahanah | shrimanshishtah
    shucih shuddhah shashvato shrutisagarah ||110|| sharanyah shubhadah sharma shishteshtah shubhalakshanah
    | shantah shuladharah shreshthah shuddhatma shankarah shivah ||111|| shitikanthatmajah shurah shantidah
    shokanashanah | shanmaturah shanmukhashca shadgunaishvaryasamyutah ||112|| shatcakrasthah shadurmighnah
    shadangashrutiparagah | shadbhavarahitah shatkah shatshastrasmritiparagah ||113|| shadvargadata shadgrivah
    shadarighnah shadashrayah | shatkiritadharah shriman shadadharashca shatkramah ||114|| shatkonamadhyanilayah
    shandatvapariharakah | senanih subhagah skandah suranandah satam gatih ||115|| subrahmanyah suradhyakshah
    sarvajnah sarvadah sukhi | sulabhah siddhidah saumyah siddheshah siddhisadhanah ||116|| siddharthah
    siddhasamkalpah siddhasadhuh sureshvarah | subhujah sarvadriksakshi suprasadah sanatanah ||117|| sudhapatih
    svayamjyotih svayambhuh sarvatomukhah | samarthah satkritih sukshmah sughoshah sukhadah suhrit ||118||
    suprasannah surashreshthah sushilah satyasadhakah | sambhavyah sumanah sevyah sakalagamaparagah ||119||
    suvyaktah saccidanandah suvirah sujanashrayah | sarvalakshanasampannah satyadharmaparayanah ||120||
    sarvadevamayah satyah sada mrishtannadayakah | sudhapi sumatih satyah sarvavighnavinashanah ||121||
    sarvaduhkhaprashamanah sukumarah sulocanah | sugrivah sudhritih sarah suraradhyah suvikramah ||122||
    surarighnah svarnavarnah sarparajah sada shucih | saptarcirbhuh suravarah sarvayudhavisharadah ||123||
    hasticarmambarasuto hastivahanasevitah | hastacitrayudhadharo hritagho hasitananah ||124|| hemabhusho
    haridvarno hrishtido hrishtivardhanah | hemadribhiddhamsarupo humkarahatakilbishah ||125|| himadrijatatanujo
    harikesho hiranmayah | hridyo hrishto harisakho hamso hamsagatirhavih ||126|| hiranyavarno hitakriddharshado
    hemabhushanah | harapriyo hitakaro hatapapo harodbhavah ||127|| kshemadah kshemakritkshemyah kshetrajnah
    kshamavarjitah | kshetrapalah kshamadharah kshemakshetrah kshamakarah ||128|| kshudraghnah kshantidah
    kshemah kshitibhushah kshamashrayah | kshalitaghah kshitidharah kshinasamrakshanakshamah ||129|| kshanabhangurasannaddhaghanashobhikapardakah
    | kshitibhrinnathatanayamukhapankajabhaskarah ||130|| kshatahitah ksharah kshanta kshatadoshah kshamanidhih
    | kshapitakhilasamtapah kshapanathasamananah ||131|| iti namnam sahasrani shanmukhasya ca narada |
    yah pathecchrinuyadvapi bhaktiyuktena cetasa ||1|| sa sadyo mucyate papairmanovakkayasambhavaih |
    ayurvriddhikaram pumsam sthairyaviryavivardhanam ||2|| vakyenaikena vakshyami vanchitartha prayacchati
    | tasmatsarvatmana brahmanniyamena japetsudhih ||3|| || iti shriskande mahapurane ishvaraprokte brahmanaradasamvade
    shanmukhasahasranamastotram sampurnam ||
  devanagari: ध्यायेत्षण्मुखमिन्दुकोटिसदृशं रत्नप्रभाशोभितम् । बालार्कद्युतिषट्किरीटविलसत्केयूरहारान्वितम्
    ॥१॥ कर्णालम्बितकुण्डलप्रविलसद्गण्डस्थलाशोभितम् । काञ्चीकङ्कणकिंकिणीरवयुतं शृङ्गारसारोदयम् ॥२॥ ध्यायेदीप्सितसिद्धिदं
    शिवसुतं श्रीद्वादशाक्षं गुहम् । खेटं कुक्कुटमंकुशं च वरदं पाशं धनुश्चक्रकम् ॥३॥ वज्रं शक्तिमसिं च
    शूलमभयं दोर्भिर्धृतं षण्मुखम् । देवं चित्रमयूरवाहनगतं चित्राम्बरालंकृतम् ॥४॥ सुब्रह्मण्य सहस्रनाम
    स्तोत्रम् ॥ अचिन्त्यशक्तिरनघस्त्वक्षोभ्यस्त्वपराजितः । अनाथवत्सलोऽमोघस्त्वशोकोऽप्यजरोऽभयः ॥१॥ अत्युदारो
    ह्यघहरस्त्वग्रगण्योऽद्रिजासुतः । अनन्तमहिमाऽपारोऽनन्तसौख्यप्रदोऽव्ययः ॥२॥ अनन्तमोक्षदोऽनादिरप्रमेयोऽक्षरोऽच्युतः
    । अकल्मषोऽभिरामोऽग्रधुर्यश्चामितविक्रमः ॥३॥ अनाथनाथो ह्यमलो ह्यप्रमत्तोऽमरप्रभुः । अरिन्दमोऽखिलाधारस्त्वणिमादिगुणोऽग्रणीः
    ॥४॥ अचञ्चलोऽमरस्तुत्यो ह्यकलङ्कोऽमिताशनः । अग्निभूरनवद्याङ्गो ह्यद्भुतोऽभीष्टदायकः ॥५॥ अतीन्द्रियोऽप्रमेयात्मा
    ह्यदृश्योऽव्यक्तलक्षणः । आपद्विनाशकस्त्वार्य आढ्य आगमसंस्तुतः ॥६॥ आर्तसंरक्षणस्त्वाद्य आनन्दस्त्वार्यसेवितः
    । आश्रितेष्टार्थवरद आनन्द्यार्तफलप्रदः ॥७॥ आश्चर्यरूप आनन्द आपन्नार्तिविनाशनः । इभवक्त्रानुजस्त्विष्ट
    इभासुरहरात्मजः ॥८॥ इतिहासश्रुतिस्तुत्य इन्द्रभोगफलप्रदः । इष्टापूर्तफलप्राप्तिरिष्टेष्टवरदायकः ॥९॥
    इहामुत्रेष्टफलद इष्टदस्त्विन्द्रवन्दितः । ईडनीयस्त्वीशपुत्र ईप्सितार्थप्रदायकः ॥१०॥ ईतिभीतिहरश्चेड्य
    ईषणात्रयवर्जितः । उदारकीर्तिरुद्योगी चोत्कृष्टोरुपराक्रमः ॥११॥ उत्कृष्टशक्तिरुत्साह उदारश्चोत्सवप्रियः
    । उज्जृम्भ उद्भवश्चोग्र उदग्रश्चोग्रलोचनः ॥१२॥ उन्मत्त उग्रशमन उद्वेगघ्नोरगेश्वरः । उरुप्रभावश्चोदीर्ण
    उमापुत्र उदारधीः ॥१३॥ ऊर्ध्वरेतःसुतस्तूर्ध्वगतिदस्तूर्जपालकः । ऊर्जितस्तूर्ध्वगस्तूर्ध्व ऊर्ध्वलोकैकनायकः
    ॥१४॥ ऊर्जिवानूर्जितोदार ऊर्जितोर्जितशासनः । ऋषिदेवगणस्तुत्य ऋणत्रयविमोचनः ॥१५॥ ऋजुरूपो ह्यृजुकर ऋजुमार्गप्रदर्शनः
    । ऋतंभरो ह्यृजुप्रीत ऋषभस्त्वृद्धिदस्त्वृतः ॥१६॥ लुलितोद्धारको लूतभवपाशप्रभञ्जनः । एणाङ्कधरसत्पुत्र
    एक एनोविनाशनः ॥१७॥ ऐश्वर्यदश्चैन्द्रभोगी चैतिह्यश्चैन्द्रवन्दितः । ओजस्वी चौषधिस्थानमोजोदश्चौदनप्रदः
    ॥१८॥ औदार्यशील औमेय औग्र औन्नत्यदायकः । औदार्य औषधकर औषधं चौषधाकरः ॥१९॥ अंशुमाल्यंशुमालीड्य अम्बिकातनयोऽन्नदः
    । अन्धकारिसुतोऽन्धत्वहारी चाम्बुजलोचनः ॥२०॥ अस्तमायोऽमराधीशो ह्यस्पष्टोऽस्तोकपुण्यदः । अस्तामित्रोऽस्तरूपश्चास्खलत्सुगतिदायकः
    ॥२१॥ कार्तिकेयः कामरूपः कुमारः क्रौञ्चदारणः । कामदः कारणं काम्यः कमनीयः कृपाकरः ॥२२॥ काञ्चनाभः कान्तियुक्तः
    कामी कामप्रदः कविः । कीर्तिकृत्कुक्कुटधरः कूटस्थः कुवलेक्षणः ॥२३॥ कुङ्कुमाङ्गः क्लमहरः कुशलः कुक्कुटध्वजः
    । कुशानुसंभवः क्रूरः क्रूरघ्नः कलितापहृत् ॥२४॥ कामरूपः कल्पतरुः कान्तः कामितदायकः । कल्याणकृत्क्लेशनाशः
    कृपालुः करुणाकरः ॥२५॥ कलुषघ्नः क्रियाशक्तिः कठोरः कवची कृती । कोमलाङ्गः कुशप्रीतः कुत्सितघ्नः कलाधरः
    ॥२६॥ ख्यातः खेटधरः खड्गी खट्वाङ्गी खलनिग्रहः । ख्यातिप्रदः खेचरेशः ख्यातेहः खेचरस्तुतः ॥२७॥ खरतापहरः
    स्वस्थः खेचरः खेचराश्रयः । खण्डेन्दुमौलितनयः खेलः खेचरपालकः ॥२८॥ खस्थलः खण्डितार्कश्च खेचरीजनपूजितः
    । गाङ्गेयो गिरिजापुत्रो गणनाथानुजो गुहः ॥२९॥ गोप्ता गीर्वाणसंसेव्यो गुणातीतो गुहाश्रयः । गतिप्रदो
    गुणनिधिः गम्भीरो गिरिजात्मजः ॥३०॥ गूढरूपो गदहरो गुणाधीशो गुणाग्रणीः । गोधरो गहनो गुप्तो गर्वघ्नो गुणवर्धनः
    ॥३१॥ गुह्यो गुणज्ञो गीतिज्ञो गतातङ्को गुणाश्रयः । गद्यपद्यप्रियो गुण्यो गोस्तुतो गगनेचरः ॥३२॥ गणनीयचरित्रश्च
    गतक्लेशो गुणार्णवः । घूर्णिताक्षो घृणिनिधिः घनगम्भीरघोषणः ॥३३॥ घण्टानादप्रियो घोषो घोराघौघविनाशनः
    । घनानन्दो घर्महन्ता घृणावान् घृष्टिपातकः ॥३४॥ घृणी घृणाकरो घोरो घोरदैत्यप्रहारकः । घटितैश्वर्यसंदोहो
    घनार्थो घनसंक्रमः ॥३५॥ चित्रकृच्चित्रवर्णश्च चञ्चलश्चपलद्युतिः । चिन्मयश्चित्स्वरूपश्च चिरानन्दश्चिरंतनः
    ॥३६॥ चित्रकेलिश्चित्रतरश्चिन्तनीयश्चमत्कृतिः । चोरघ्नश्चतुरश्चारुश्चामीकरविभूषणः ॥३७॥ चन्द्रार्ककोटिसदृशश्चन्द्रमौलितनूभवः
    । छादिताङ्गश्छद्महन्ता छेदिताखिलपातकः ॥३८॥ छेदीकृततमःक्लेशश्छत्रीकृतमहायशाः । छादिताशेषसंतापश्छरितामृतसागरः
    ॥३९॥ छन्नत्रैगुण्यरूपश्च छातेहश्छिन्नसंशयः । छन्दोमयश्छन्दगामी छिन्नपाशश्छविश्छदः ॥४०॥ जगद्धितो जगत्पूज्यो
    जगज्ज्येष्ठो जगन्मयः । जनको जाह्नवीसूनुर्जितामित्रो जगद्गुरुः ॥४१॥ जयी जितेन्द्रियो जैत्रो जरामरणवर्जितः
    । ज्योतिर्मयो जगन्नाथो जगज्जीवो जनाश्रयः ॥४२॥ जगत्सेव्यो जगत्कर्ता जगत्साक्षी जगत्प्रियः । जम्भारिवन्द्यो
    जयदो जगञ्जनमनोहरः ॥४३॥ जगदानन्दजनको जनजाड्यापहारकः । जपाकुसुमसंकाशो जनलोचनशोभनः ॥४४॥ जनेश्वरो जितक्रोधो
    जनजन्मनिबर्हणः । जयदो जन्तुतापघ्नो जितदैत्यमहाव्रजः ॥४५॥ जितमायो जितक्रोधो जितसङ्गो जनप्रियः । झंझानिलमहावेगो
    झरिताशेषपातकः ॥४६॥ झर्झरीकृतदैत्यौघो झल्लरीवाद्यसंप्रियः । ज्ञानमूर्तिर्ज्ञानगम्यो ज्ञानी ज्ञानमहानिधिः
    ॥४७॥ टंकारनृत्तविभवः टंकवज्रध्वजाङ्कितः । टंकिताखिललोकश्च टंकितैनस्तमोरविः ॥४८॥ डम्बरप्रभवो डम्भो
    डम्बो डमरुकप्रियः । डमरोत्कटसन्नादो डिंभरूपस्वरूपकः ॥४९॥ ढक्कानादप्रीतिकरो ढालितासुरसंकुलः । ढौकितामरसंदोहो
    ढुण्डिविघ्नेश्वरानुजः ॥५०॥ तत्त्वज्ञस्तत्वगस्तीव्रस्तपोरूपस्तपोमयः । त्रयीमयस्त्रिकालज्ञस्त्रिमूर्तिस्त्रिगुणात्मकः
    ॥५१॥ त्रिदशेशस्तारकारिस्तापघ्नस्तापसप्रियः । तुष्टिदस्तुष्टिकृत्तीक्ष्णस्तपोरूपस्त्रिकालवित् ॥५२॥
    स्तोता स्तव्यः स्तवप्रीतः स्तुतिः स्तोत्रं स्तुतिप्रियः । स्थितः स्थायी स्थापकश्च स्थूलसूक्ष्मप्रदर्शकः
    ॥५३॥ स्थविष्ठः स्थविरः स्थूलः स्थानदः स्थैर्यदः स्थिरः । दान्तो दयापरो दाता दुरितघ्नो दुरासदः ॥५४॥
    दर्शनीयो दयासारो देवदेवो दयानिधिः । दुराधर्षो दुर्विगाह्यो दक्षो दर्पणशोभितः ॥५५॥ दुर्धरो दानशीलश्च
    द्वादशाक्षो द्विषड्भुजः । द्विषट्कर्णो द्विषड्बाहुर्दीनसंतापनाशनः ॥५६॥ दन्दशूकेश्वरो देवो दिव्यो दिव्याकृतिर्दमः
    । दीर्घवृत्तो दीर्घबाहुर्दीर्घदृष्टिर्दिवस्पतिः ॥५७॥ दण्डो दमयिता दर्पो देवसिंहो दृढव्रतः । दुर्लभो
    दुर्गमो दीप्तो दुष्प्रेक्ष्यो दिव्यमण्डनः ॥५८॥ दुरोदरघ्नो दुःखघ्नो दुरारिघ्नो दिशांपतिः । दुर्जयो
    देवसेनेशो दुर्ज्ञेयो दुरतिक्रमः ॥५९॥ दम्भो दृप्तश्च देवर्षिर्दैवज्ञो दैवचिन्तकः । धुरंधरो धर्मपरो
    धनदो धृतिवर्धनः ॥६०॥ धर्मेशो धर्मशास्त्रज्ञो धन्वी धर्मपरायणः । धनाध्यक्षो धनपतिर्धृतिमान्धूतकिल्बिषः
    ॥६१॥ धर्महेतुर्धर्मशूरो धर्मकृद्धर्मविद् ध्रुवः । धाता धीमान्धर्मचारी धन्यो धुर्यो धृतव्रतः ॥६२॥ नित्योत्सवो
    नित्यतृप्तो निर्लेपो निश्चलात्मकः । निरवद्यो निराधारो निष्कलङ्को निरञ्जनः ॥६३॥ निर्ममो निरहंकारो निर्मोहो
    निरुपद्रवः । नित्यानन्दो निरातङ्को निष्प्रपञ्चो निरामयः ॥६४॥ निरवद्यो निरीहश्च निर्दर्शो निर्मलात्मकः
    । नित्यानन्दो निर्जरेशो निःसङ्गो निगमस्तुतः ॥६५॥ निष्कण्टको निरालम्बो निष्प्रत्यूहो निरुद्भवः । नित्यो
    नियतकल्याणो निर्विकल्पो निराश्रयः ॥६६॥ नेता निधिर्नैकरूपो निराकारो नदीसुतः । पुलिन्दकन्यारमणः पुरुजित्परमप्रियः
    ॥६७॥ प्रत्यक्षमूर्तिः प्रत्यक्षः परेशः पूर्णपुण्यदः । पुण्याकरः पुण्यरूपः पुण्यः पुण्यपरायणः ॥६८॥
    पुण्योदयः परं ज्योतिः पुण्यकृत्पुण्यवर्धनः । परानन्दः परतरः पुण्यकीर्तिः पुरातनः ॥६९॥ प्रसन्नरूपः
    प्राणेशः पन्नगः पापनाशनः । प्रणतार्तिहरः पूर्णः पार्वतीनन्दनः प्रभुः ॥७०॥ पूतात्मा पुरुषः प्राणः प्रभवः
    पुरुषोत्तमः । प्रसन्नः परमस्पष्टः परः परिवृढः परः ॥७१॥ परमात्मा परब्रह्म परार्थः प्रियदर्शनः । पवित्रः
    पुष्टिदः पूर्तिः पिङ्गलः पुष्टिवर्धनः ॥७२॥ पापहारी पाशधरः प्रमत्तासुरशिक्षकः । पावनः पावकः पूज्यः
    पूर्णानन्दः परात्परः ॥७३॥ पुष्कलः प्रवरः पूर्वः पितृभक्तः पुरोगमः । प्राणदः प्राणिजनकः प्रदिष्टः पावकोद्भवः
    ॥७४॥ परब्रह्मस्वरूपश्च परमैश्वर्यकारणम् । परर्द्धिदः पुष्टिकरः प्रकाशात्मा प्रतापवान् ॥७५॥ प्रज्ञापरः
    प्रकृष्टार्थः पृथुः पृथुपराक्रमः । फणीश्वरः फणिवरः फणामणिविभूषणः ॥७६॥ फलदः फलहस्तश्च फुल्लाम्बुजविलोचनः
    । फडुच्चाटितपापौघः फणिलोकविभूषणः ॥७७॥ बाहुलेयो बृहद्रूपो बलिष्ठो बलवान् बली । ब्रह्मेशविष्णुरूपश्च
    बुद्धो बुद्धिमतां वरः ॥७८॥ बालरूपो ब्रह्मगर्भो ब्रह्मचारी बुधप्रियः । बहुश्रुतो बहुमतो ब्रह्मण्यो
    ब्राह्मणप्रियः ॥७९॥ बलप्रमथनो ब्रह्मा बहुरूपो बहुप्रदः । बृहद्भानुतनूद्भूतो बृहत्सेनो बिलेशयः ॥८०॥
    बहुबाहुर्बलश्रीमान् बहुदैत्यविनाशकः । बिलद्वारान्तरालस्थो बृहच्छक्तिधनुर्धरः ॥८१॥ बालार्कद्युतिमान्
    बालो बृहद्वक्षा बृहद्धनुः । भव्यो भोगीश्वरो भाव्यो भवनाशो भवप्रियः ॥८२॥ भक्तिगम्यो भयहरो भावज्ञो भक्तसुप्रियः
    । भुक्तिमुक्तिप्रदो भोगी भगवान् भाग्यवर्धनः ॥८३॥ भ्राजिष्णुर्भावनो भर्ता भीमो भीमपराक्रमः । भूतिदो
    भूतिकृद्भोक्ता भूतात्मा भुवनेश्वरः ॥८४॥ भावको भीकरो भीष्मो भावकेष्टो भवोद्भवः । भवतापप्रशमनो भोगवान्
    भूतभावनः ॥८५॥ भोज्यप्रदो भ्रान्तिनाशो भानुमान् भुवनाश्रयः । भूरिभोओगप्रदो भद्रो भजनीयो भिषग्वरः ॥८६॥
    महासेनो महोदारो महाशक्तिर्महाद्युतिः । महाबुद्धिर्महावीर्यो महोत्साहो महाबलः ॥८७॥ महाभोगी महामायी
    मेधावी मेखली महान् । मुनिस्तुतो महामान्यो महानन्दो महायशाः ॥८८॥ महोर्जितो माननिधिर्मनोरथफलप्रदः ।
    महोदयो महापुण्यो महाबलपराक्रमः ॥८९॥ मानदो मतिदो माली मुक्तामालाविभूषणः । मनोहरो महामुख्यो महर्द्धिर्मूर्तिमान्मुनिः
    ॥९०॥ महोत्तमो महोपायो मोक्षदो मङ्गलप्रदः । मुदाकरो मुक्तिदाता महाभोगो महोरगः ॥९१॥ यशस्करो योगयोनिर्योगिष्ठो
    यमिनां वरः । यशस्वी योगपुरुषो योग्यो योगनिधिर्यमी ॥९२॥ यतिसेव्यो योगयुक्तो योगविद्योगसिद्धिदः । यन्त्रो
    यन्त्री च यन्त्रज्ञो यन्त्रवान्यन्त्रवाहकः ॥ ९३॥ यातनारहितो योगी योगीशो योगिनां वरः । रमणीयो रम्यरूपो
    रसज्ञो रसभावनः ॥९४॥ रञ्जनो रञ्जितो रागी रुचिरो रुद्रसंभवः । रणप्रियो रणोदारो रागद्वेषविनाशनः ॥९५॥
    रत्नार्ची रुचिरो रम्यो रूपलावण्यविग्रहः । रत्नाङ्गदधरो रत्नभूषणो रमणीयकः ॥९६॥ रुचिकृद्रोचमानश्च रञ्जितो
    रोगनाशनः । राजीवाक्षो राजराजो रक्तमाल्यानुलेपनः ॥९७॥ राजद्वेदागमस्तुत्यो रजःसत्त्वगुणान्वितः । रजनीशकलारम्यो
    रत्नकुण्डलमण्डितः ॥९८॥ रत्नसन्मौलिशोभाढ्यो रणन्मञ्जीरभूषणः । लोकैकनाथो लोकेशो ललितो लोकनायकः ॥९९॥
    लोकरक्षो लोकशिक्षो लोकलोचनरञ्जितः । लोकबन्धुर्लोकधाता लोकत्रयमहाहितः ॥१००॥ लोकचूडामणिर्लोकवन्द्यो
    लावण्यविग्रहः । लोकाध्यक्षस्तु लीलावान्लोकोत्तरगुणान्वितः ॥१०१॥ वरिष्ठो वरदो वैद्यो विशिष्टो विक्रमो
    विभुः । विबुधाग्रचरो वश्यो विकल्पपरिवर्जितः ॥१०२॥ विपाशो विगतातङ्को विचित्राङ्गो विरोचनः । विद्याधरो
    विशुद्धात्मा वेदाङ्गो विबुधप्रियः ॥१०३॥ वचस्करो व्यापकश्च विज्ञानी विनयान्वितः । विद्वत्तमो विरोधिघ्नो
    वीरो विगतरागवान् ॥१०४॥ वीतभावो विनीतात्मा वेदगर्भो वसुप्रदः । विश्वदीप्तिर्विशालाक्षो विजितात्मा विभावनः
    ॥१०५॥ वेदवेद्यो विधेयात्मा वीतदोषश्च वेदवित् । विश्वकर्मा वीतभयो वागीशो वासवार्चितः ॥१०६॥ वीरध्वंसो
    विश्वमूर्तिर्विश्वरूपो वरासनः । विशाखो विमलो वाग्मी विद्वान्वेदधरो वटुः ॥१०७॥ वीरचूडामणिर्वीरो विद्येशो
    विबुधाश्रयः । विजयी विनयी वेत्ता वरीयान्विरजा वसुः ॥१०८॥ वीरघ्नो विज्वरो वेद्यो वेगवान्वीर्यवान्वशी
    । वरशीलो वरगुणो विशोको वज्रधारकः ॥१०९॥ शरजन्मा शक्तिधरः शत्रुघ्नः शिखिवाहनः । श्रीमान्शिष्टः शुचिः
    शुद्धः शाश्वतो श्रुतिसागरः ॥११०॥ शरण्यः शुभदः शर्म शिष्टेष्टः शुभलक्षणः । शान्तः शूलधरः श्रेष्ठः शुद्धात्मा
    शङ्करः शिवः ॥१११॥ शितिकण्ठात्मजः शूरः शान्तिदः शोकनाशनः । षाण्मातुरः षण्मुखश्च षड्गुणैश्वर्यसंयुतः
    ॥११२॥ षट्चक्रस्थः षडूर्मिघ्नः षडङ्गश्रुतिपारगः । षड्भावरहितः षट्कः षट्शास्त्रस्मृतिपारगः ॥११३॥ षड्वर्गदाता
    षड्ग्रीवः षडरिघ्नः षडाश्रयः । षट्किरीटधरः श्रीमान् षडाधारश्च षट्क्रमः ॥११४॥ षट्कोणमध्यनिलयः षण्डत्वपरिहारकः
    । सेनानीः सुभगः स्कन्दः सुरानन्दः सतां गतिः ॥११५॥ सुब्रह्मण्यः सुराध्यक्षः सर्वज्ञः सर्वदः सुखी ।
    सुलभः सिद्धिदः सौम्यः सिद्धेशः सिद्धिसाधनः ॥११६॥ सिद्धार्थः सिद्धसंकल्पः सिद्धसाधुः सुरेश्वरः । सुभुजः
    सर्वदृक्साक्षी सुप्रसादः सनातनः ॥११७॥ सुधापतिः स्वयंज्योतिः स्वयंभूः सर्वतोमुखः । समर्थः सत्कृतिः
    सूक्ष्मः सुघोषः सुखदः सुहृत् ॥११८॥ सुप्रसन्नः सुरश्रेष्ठः सुशीलः सत्यसाधकः । संभाव्यः सुमनाः सेव्यः
    सकलागमपारगः ॥११९॥ सुव्यक्तः सच्चिदानन्दः सुवीरः सुजनाश्रयः । सर्वलक्षणसंपन्नः सत्यधर्मपरायणः ॥१२०॥
    सर्वदेवमयः सत्यः सदा मृष्टान्नदायकः । सुधापी सुमतिः सत्यः सर्वविघ्नविनाशनः ॥१२१॥ सर्वदुःखप्रशमनः सुकुमारः
    सुलोचनः । सुग्रीवः सुधृतिः सारः सुराराध्यः सुविक्रमः ॥१२२॥ सुरारिघ्नः स्वर्णवर्णः सर्पराजः सदा शुचिः
    । सप्तार्चिर्भूः सुरवरः सर्वायुधविशारदः ॥१२३॥ हस्तिचर्माम्बरसुतो हस्तिवाहनसेवितः । हस्तचित्रायुधधरो
    हृताघो हसिताननः ॥१२४॥ हेमभूषो हरिद्वर्णो हृष्टिदो हृष्टिवर्धनः । हेमाद्रिभिद्धंसरूपो हुंकारहतकिल्बिषः
    ॥१२५॥ हिमाद्रिजातातनुजो हरिकेशो हिरण्मयः । हृद्यो हृष्टो हरिसखो हंसो हंसगतिर्हविः ॥१२६॥ हिरण्यवर्णो
    हितकृद्धर्षदो हेमभूषणः । हरप्रियो हितकरो हतपापो हरोद्भवः ॥१२७॥ क्षेमदः क्षेमकृत्क्षेम्यः क्षेत्रज्ञः
    क्षामवर्जितः । क्षेत्रपालः क्षमाधारः क्षेमक्षेत्रः क्षमाकरः ॥१२८॥ क्षुद्रघ्नः क्षान्तिदः क्षेमः क्षितिभूषः
    क्षमाश्रयः । क्षालिताघः क्षितिधरः क्षीणसंरक्षणक्षमः ॥१२९॥ क्षणभङ्गुरसन्नद्धघनशोभिकपर्दकः । क्षितिभृन्नाथतनयामुखपङ्कजभास्करः
    ॥१३०॥ क्षताहितः क्षरः क्षन्ता क्षतदोषः क्षमानिधिः । क्षपिताखिलसंतापः क्षपानाथसमाननः ॥१३१॥ इति नाम्नां
    सहस्राणि षण्मुखस्य च नारद । यः पठेच्छृणुयाद्वापि भक्तियुक्तेन चेतसा ॥१॥ स सद्यो मुच्यते पापैर्मनोवाक्कायसंभवैः
    । आयुर्वृद्धिकरं पुंसां स्थैर्यवीर्यविवर्धनम् ॥२॥ वाक्येनैकेन वक्ष्यामि वाञ्छितार्थ प्रयच्छति । तस्मात्सर्वात्मना
    ब्रह्मन्नियमेन जपेत्सुधीः ॥३॥ ॥ इति श्रीस्कन्दे महापुराणे ईश्वरप्रोक्ते ब्रह्मनारदसंवादे षण्मुखसहस्रनामस्तोत्रं
    संपूर्णम् ॥
