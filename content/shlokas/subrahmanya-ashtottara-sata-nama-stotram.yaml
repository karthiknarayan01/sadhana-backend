id: subrahmanya-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Subrahmanya Ashtottara Sata Nama Stotram
content:
  english: shaktihastam virupaksham shikhivaham shadananam | darunam ripurogaghnam bhavaye kukkutadhvajam
    || iti dhyanam skando guhah shanmukhashca phalanetrasutah prabhuh | pingalah krittikasunuh shikhivaho
    dvishadbhujah || shshaktidharah pishitasha prabhanjanah | tarakasurasamhari rakshobalavimardanah ||
    || mattah pramatta unmattah surasainyasurakshakah | devasenapatih prajnah kripalu rbhaktavatsalah
    || shshaktidharah kumarah krauncadharanah | senani ragnijanma ca vishakhah shankaratmajah || || shivasvami
    ganasvami sarvasvami sanatanah | anantamurti rakshobhyah parvatipriyanandanah || shsharodbhuta ahutah
    pavakatmajah | jrimbhah prajrimbha ujjrimbhah kamalasanasamstutah || || ekavarno dvivarnashca trivarnah
    sumanoharah | caturvarnah pancavarnah prajapati shshamigarbho vishvareta ssurariha | haridvarna shshubhakaro
    patushca vatuveshabhrit || rgahana shcandravarnah kaladharah | mayadharo mahamayi kaivalya ranamayah
    | parameshthi parambrahma vedagarbho viratsutah || || pulindakanyabharta ca mahasarasvatavritah |
    ashritokhiladata ca coraghno roganashanah || shshikhandikritaketanah | dambhah paramadambhashca mahadambho
    vrishakapih || || karanopattadehashca karanatitavigrahah | anishvaro'mritah pranah pranayamaparayanah
    || || viruddhahanta viraghno raktashyamagalo'pi ca | subrahmanyo guhah prito brahmanyo brahmanapriyah
    || || vamshavriddhikaro vedo vedyo'kshayaphalapradah || || iti shri subrahmanyashtottara shatanamastotram
    sampurnam |
  devanagari: शक्तिहस्तं विरूपाक्षं शिखिवाहं षडाननम् । दारुणं रिपुरोगघ्नं भावये कुक्कुटध्वजम् ॥ इति ध्यानम्
    स्कन्दो गुहः षण्मुखश्च फालनेत्रसुतः प्रभुः । पिङ्गलः कृत्तिकासूनुः शिखिवाहो द्विषड्भुजः ॥ श्शक्तिधरः
    पिशिताश प्रभञ्जनः । तारकासुरसंहारी रक्षोबलविमर्दनः ॥ ॥ मत्तः प्रमत्त उन्मत्तः सुरसैन्यसुरक्षकः । देवसेनापतिः
    प्राज्ञः कृपालु र्भक्तवत्सलः ॥ श्शक्तिधरः कुमारः क्रौञ्चधारणः । सेनानी रग्निजन्मा च विशाखः शङ्करात्मजः
    ॥ ॥ शिवस्वामी गणस्वामी सर्वस्वामी सनातनः । अनन्तमूर्ति रक्षोभ्यः पार्वतीप्रियनन्दनः ॥ श्शरोद्भूत आहूतः
    पावकात्मजः । जृम्भः प्रजृम्भ उज्जृम्भः कमलासनसंस्तुतः ॥ ॥ एकवर्णो द्विवर्णश्च त्रिवर्णः सुमनोहरः ।
    चतुर्वर्णः पञ्चवर्णः प्रजापति श्शमीगर्भो विश्वरेता स्सुरारिहा । हरिद्वर्ण श्शुभकरो पटुश्च वटुवेषभृत्
    ॥ र्गहन श्चन्द्रवर्णः कलाधरः । मायाधरो महामायी कैवल्य रनामयः । परमेष्ठी परम्ब्रह्म वेदगर्भो विराट्सुतः
    ॥ ॥ पुलिन्दकन्याभर्ता च महासारस्वतावृतः । अश्रितोखिलदाता च चोरघ्नो रोगनाशनः ॥ श्शिखण्डीकृतकेतनः ।
    डम्भः परमडम्भश्च महाडम्भो वृषाकपिः ॥ ॥ कारणोपात्तदेहश्च कारणातीतविग्रहः । अनीश्वरोऽमृतः प्राणः प्राणायामपरायणः
    ॥ ॥ विरुद्धहन्ता वीरघ्नो रक्तश्यामगलोऽपि च । सुब्रह्मण्यो गुहः प्रीतो ब्रह्मण्यो ब्राह्मणप्रियः ॥
    ॥ वंशवृद्धिकरो वेदो वेद्योऽक्षयफलप्रदः ॥ ॥ इति श्री सुब्रह्मण्याष्टोत्तर शतनामस्तोत्रं सम्पूर्णम्
    ।
