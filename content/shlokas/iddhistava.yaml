id: iddhistava
category: stotram
name:
  english: ṟiddhistava
  devanagari: ऱिद्धिस्तव
content:
  english: riddhistavah shrimanvrishabhashailesha vardhatam vijayi bhavan | divyam tvadiyamaishvaryam
    nirmaryadam vijrimbhatam || 1|| devibhushayudhairnityairmuktairmokshaikalakshanaih | sattvottaraistvadiyaishca
    sangah statsarasastava || 2|| prakaragopuravaraprasadamanimantapah | shalimudgatiladinam shalashshailakulojjvalah
    || 3|| ratnakancanakausheyakshaumakramukashalikah | shayyagrihani paryankavaryah sthulasanani ca ||
    4|| kanatkanakabhringarapatadgrahakalacikah | chatracamaramukhyashca santu nityah paricchadah || 5||
    astu nistulamavyagram nityamabhyarcanam tava | pakshepakshe vivardhantam masimasi mahotsavah || 6||
    manikancanacitrani bhushananyambarani ca | kashmirasarakasturikarpuradyanulepanam || 7|| komalani
    ca damani kusumaissaurabhotkaraih | dhupah karpuradipashca santu santatameva te || 8|| nrittagitayutam
    vadyam nityamatra vivardhatam | shrotreshu
  devanagari: ऋद्धिस्तवः श्रीमन्वृषभशैलेश वर्धतां विजयी भवान् । दिव्यं त्वदीयमैश्वर्यं निर्मर्यादं विजृम्भताम्
    ॥ १॥ देवीभूषायुधैर्नित्यैर्मुक्तैर्मोक्षैकलक्षणैः । सत्त्वोत्तरैस्त्वदीयैश्च सङ्गः स्तात्सरसस्तव ॥
    २॥ प्राकारगोपुरवरप्रासादमणिमण्टपाः । शालिमुद्गतिलादीनां शालाश्शैलकुलोज्ज्वलाः ॥ ३॥ रत्नकाञ्चनकौशेयक्षौमक्रमुकशालिकाः
    । शय्यागृहाणि पर्यङ्कवर्याः स्थूलासनानि च ॥ ४॥ कनत्कनकभृङ्गारपतद्ग्रहकलाचिकाः । छत्रचामरमुख्याश्च
    सन्तु नित्याः परिच्छदाः ॥ ५॥ अस्तु निस्तुलमव्यग्रं नित्यमभ्यर्चनं तव । पक्षेपक्षे विवर्धन्तां मासिमासि
    महोत्सवाः ॥ ६॥ मणिकाञ्चनचित्राणि भूषणान्यम्बराणि च । काश्मीरसारकस्तूरीकर्पूराद्यनुलेपनम् ॥ ७॥ कोमलानि
    च दामानि कुसुमैस्सौरभोत्करैः । धूपाः कर्पूरदीपाश्च सन्तु सन्ततमेव ते ॥ ८॥ नृत्तगीतयुतं वाद्यं नित्यमत्र
    विवर्धताम् । श्रोत्रेषु
