id: kytb-3-10-savitrachayanam-krishna-yajurveda-taittiriya-brahmana-katha-prashna-patha-samjnanam-vijnanam
category: stotram
name:
  english: KYTB 3.10 Savitrachayanam - Krishna Yajurveda Taittiriya Brahmana Katha Prashna Patha - Samjnanam
    Vijnanam
content:
  english: krishna yajurvediya taittiriya brahmane kathake prathamah prashnah shri gurubhyo namah | harih
    om || anuvakam anuvakeshu navasu lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana ncocyate sanjnanam
    njanadabhijanat | sakam nklriptam | shreyo vasiya ayathsambhuta mbhutam || citrah ketuh prabhanabhan
    thsabhann | jyotishmag stejasvanatapagg stapannabhitapann | rocano rocamanah shobhamanah kalyanah
    || dar shata vishvarupa sudar shana | apyayamana pyayamana | apuryamana puryamana purayanti purna
    pau rnamasi || data pradata ''nando modah pramodah || thsambhuto bhutah || prastutam vi~shtutagm sagg
    vi~shvarupam | shukramamrita ssamiddham | aruna ttapasvat || savita prasavita dipto dipaya ndipyamanah
    | jvala njvalita tapan vitapan thsantapann | rocano rocamana shshumbhamano vamah || suta sunvati prasuta
    suyamana 'bhishuyamana | piti || kanta kamya kamajata ''yushmati kamadugha || abhishasta 'numanta
    ''nando modah pramodah | asadaya ssannah | abhu rvibhuh prabhu shshabhum rbhuvah || pavitra nputo
    meddhyah | yasho yashasva nayuramritah | jivo jivishya nthsvargo lokah || sahasva nthsahamanah | jayanna
    thsudravino dravinodah | ardrapavitro harikesho modah pramodah || || aruno 'runarajah pundariko vishvajida
    bhijit | ardrah pinvamano 'nnavan niravan | sarvaushadha ssabhamro mahasvan || ejatka jovatkah | kshullaka
    shshipivishtakah | saristrara ssusheravah | ajiraso gamishnavah || idani hi kshipramajiram | ashu
    rnimeshah phano dravannati dravann | tvaragg stvaramana ashurashiyanjavah || agnishtoma ukthyo 'tiratro
    dviratra shcaturatrah | agnir ssurya ritushcandrama rituh || prajapati anuvakeshu navasu lekhasu nabhya
    nceshtakopadhanam svayamatrinnopadhana nca | prajapatistva sadayatu | taya devataya 'ngirasva ddhruva
    sida || bhuvo vayu nca | prajapatistva sadayatu | taya devataya ddhruva sida | svaraditya nca | prajapatistva
    sadayatu | taya devataya 'ngimrasva ddhruva sida | bhurbhuva nca | prajapatistva sadayatu | taya devataya
    'ngirasva anuvakeshu navasu lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana ncocyate tvameva
    tvam 'si | tvameva tvamacaishih | citashcasi sancita shcasyagne | etavagshcasi bhuyagshcasyagne |
    yatte agne nyunam 'tiriktam | aditya shcinvantu | vishve te devashciti mapurayantu | citashcasi sancita
    shcasyagne | etavagshcasi bhuyagshcasyagne | ma te agne 'cayena ma 'ti ca yenayuravrikshi | savar
    njyoti ryadadavudeti | tapaso jatamani bhrishtamojah | tatte jyotirishtake | tena me tapa | tena me
    jvala | tena me didihi | yavaddevah | yavadasati suryah | yavadutapi brahma || anuvakeshu navasu lekhasu
    nabhya nceshtakopadhanam svayamatrinnopadhana 'si | idavathsaro 'si | tasya te vasanta shshirah |
    grishmo dakshinah pakshah | vara m | sharaduttarah pakshah | hemanto maddhya m | purvapakshashcitayah
    | aparapakshah purisham || 'si svargo lokah | yasya ndishi mahiyase | tato no maha avaha | vayu rbhutva
    sarva disha avahi | sarva disho 'nu vivahi | sarva disho va~hi | cittya citi maprina | acittya citi
    maprina | cidasi samudrayonih || || indu rdakshah shyena ritava shshakuno bhuranyuh | maha dhruva
    anishattah | namaste astu ma ma higmsih | eti preti viti samityuditi | diva mme yaccha | antariksha
    mme yaccha | prithivi mme yaccha | prithivi mme yaccha | antariksha mme yaccha | ahna prasaraya |
    ratrya samaca | ratrya prasaraya | ahna samaca | kama mprasaraya | kamagm samaca || mme yacchantariksha
    anuvakeshu navasu lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana m | brahma kshatram | yasho
    mahat | satya m | mana ayuh | vishvam ntapo haro bhah | jataveda yadi va pavako 'si | vaishvanaro
    yadi va vaidyuto mprajabhyo yajamanaya lokam | urja anuvakeshu navasu lekhasu nabhya nceshtakopadhanam
    svayamatrinnopadhana ncocyate rajni virajni shshocih | tapo haro bhah | agni rindro brihaspatih |
    vishve deva bhuvanasya gopah | te ma sarve yashasa sagmsrijantu || rajnindro ma sapta anuvakeshu navasu
    lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana ncocyate asave svaha vasave svaha | vibhuve
    svaha vivasvate svaha | divampataye svaha 'gmhaspatyaya svaha | cakshushmatyaya svaha jyotishmatyaya
    svaha | rajne svaha virajne svaha | samrajne svaha | shushaya svaha suryaya svaha | candramase svaha
    jyotishe svaha | sagmsarpaya svaha kalyanaya svaha kalyanaya svahaika anuvakeshu navasu lekhasu nabhya
    nceshtakopadhanam svayamatrinnopadhana ncocyate vipashcite pavamanaya gayata | mahi na dhara 'tyandho
    ar ha jirnamatisarpati tvaca m | atyo na kridanna saradvrisha harih | upayamagrihito ngrihnami | esha
    te yonirmrityave njahi | adha no agna avaha | rayasposhagm sahasrina || ye te sahasramayuta | mrityo
    martyaya hantave | tan | sarvanava yajamahe || bhaksho 'syamrita bhakshah | tasya te mrityu kritasya
    madhumatah | upahutasyo pahuto bhakshayami || mandra 'bhibhutih ketu ryajnanam || andho jagrivih prana
    | asavehi | badhira a rapana | asavehi | ahastostva cakshuh | asavehi | apadasho manah | asavehi |
    kave vipracitte shrotra | asavehi || ssuvasah | shusho nama mrito martyeshu | tantva ntatha veda |
    asavehi | agnirme vaci shritah | vaghridaye | hridaya mbrahmani | vayurme || prano hridaye | hridaya
    mbrahmani | suryo me cakshushi shritah | cakshur hridaye | hridaya mbrahmani | candrama me manasi
    shritah || || mano hridaye | hridaya mbrahmani | disho me shrotre shritah | shrotragm hridaye | hridaya
    mbrahmani | apo me retasi shritah || || reto hridaye | hridaya mbrahmani | prithivi me sharire shrita
    | shariragm hridaye | hridaya mbrahmani | oshadhivanaspatayo me lomasu shritah || || lomani hridaye
    | hridaya mbrahmani | indro me bale shritah | balagm hridaye | hridaya mbrahmani | parjanyo me murdhni
    shritah || || mudrdha hridaye | hridaya mbrahmani | ishano me manyau shritah | manyur mbrahmani |
    atma ma atmani shritah || atma hridaye | hridaya mbrahmani | punarma atma punarayuraga t | punah pranah
    punarakuta t | vaishvanaro rashmibhi rvavridhanah | antastishthatvamritasya gopah || ssurya shcandrama
    disha apah prithi vyoshadhivanaspataya indrah parjanya ishana atma punarme trayodasha anuvakeshu navasu
    lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana ncocyate prajapati rdevanasrijata | te papmana
    sandita ajayanta | tan vyadyat | ya dvidyut | tamavrishcat | yadavrishcat | tasma dyatraite devate
    abhiprapnutah | vica haivasya tatra papmanandyatah || || vrishcatashca || saisha mimagmsa 'gnihotra
    eva sapannna | atho ahuh | sarveshu yajnakratushviti || hoshyannapa upasprishet | vidyudasi vidyame
    papmanamiti | atha hutvopasprishet | vrishtirasi vrishca me papmanamiti | yakshyamano veshtva va |
    vi ca haivasyaite devate papmana || vrishcatashca || atyagmho harunih | brahmacarine nprocya prajighaya
    | parehi | plaksha mpriccha | vettha savitram iti | tamagatya papraccha | acaryo ma prahaishit | vettha
    savitram iti | sahovaca vedeti || npratishthita iti | parorajasiti | kastadya tparoraja iti | esha
    vava sa paroraja iti hovaca | ya esha tapati | esho 'rvagraja iti | sa kasmi ntvesha iti | satya iti
    | ki ntathsatyamiti | tapa iti || || kasminnu tapa iti | bala iti | ki dbalamiti | prana iti | masma
    pranamati priccha iti ma 'braviditi hovaca brahmacari || sahovaca plaksho daiyam patih | yadvai brahmacari
    npranamatyaprakshyah | mudrdha te vyapatishyat | ahamuta acarya nbhavishyami | yo ma savitre samavadishteti
    || va~deta || sa yo havai savitram vi~dusha savitre sam ndadhati | anu hava asma asau tapanchriya
    mmanyate | anvasmai shristapo manyate | anvasmai tapo bala mmanyate | anvasmai bala mmanyate || sa
    yadaha | sajnannam sha drishteti | esha eva tat || || atha yadaha | prastutam vi~shtutagm suta sunvatiti
    | esha eva tat || esha hyeva tanyahani | esha ratrayah || atha yadaha | citrah ketu rdata pradata
    savita prasavita 'bhishasta 'numanteti | esha eva tat | esha hyeva te 'hno muhurtah | esha ratreh
    || atha yadaha | pavitra 'runaraja iti | esha eva tat | esha hyeva te 'drdhamasah | esha masah ||
    atha yadaha | agnishtoma ukthyo va~thsara iti | esha eva tat | esha hyeva te yajnakratavah | esha
    ritavah || va~thsarah || atha yadaha | idani ntadanimiti | esha eva tat | esha hyeva te muhurtana
    mmuhurtah || janako ha vai dehah | ahoratrai ssamajagama | tagm hocuh | yo va asman mayureti | abhi
    svargam nkshiyata iti || vijahaddha vai papmanameti | sarvamayureti | abhi svargam mushmin ~loke 'nna
    ve~da || ahina hashvatthyah | savitram || sa ha hagmso hiranmayo bhutva | svargam lo~kamiyaya | adityasya
    sayujyam || hagmso havai hiranmayo bhutva | svargam lo~kameti | adityasya sayujyam | ya evam ve~da
    || devabhago ha shrautarshah | savitram ncakara | tagm ha vagadrishyamana 'bhyuvaca || || sarvambata
    gautamo veda | ya ve~deti | sa hovaca | kaisha vagasiti | ayamahagm savitrah | devana muttamo lokah
    | guhya mmaho bibhraditi | etavati ha gautamah | yajnopavita 'dho nipapata | namo nama iti || || sa
    hovaca | ma bhaishi rgautama | jito vai te loka iti || tasmadye ke ca savitram vi~duh | sarve te jitalokah
    || sa yo havai savitra ve~da | shriya haivabhishicyate | ghriniriti dve akshare | surya iti trini
    | aditya iti trini || shriyabhishiktam | ya evam ve~da | shriya haivabhishicyate || tade 'bhyuktam
    | rico akshare parame vyomann | yasmi ndeva adhi vishve nisheduh | yastanna veda kimrica karishyati
    | ya i ttadvidusta ime samasata iti || na hava etasyarca na yajusha na samna tpari yaddevacakram |
    ardra svarge loka eti | vijaha dvishva bhutani sapamshyat || ardro ha vai pinvamana ssvarge loka eti
    | vijahan vishva bhutani sapamshyann | ya evam ve~da || shusho havai va shneyah | adityena samajagama
    | tagm hovaca | ehi savitram thsambhuta iti | esha vava sa savitrah | ya esha tapati | ehi mam vi~ddhi
    | iti haivaina prajapatirdevan sajnanna nyesha ratrayascitra ketuste 'hno muhurto ratreh 'rdha masa
    agnishtomo yajnakratava idani 'hina devabhagah kaisha vamma shusho ha vai shodasha anuvakeshu navasu
    lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana | tasya agnireva saragha mmadhu | ya etah pu
    parapakshayo ratrayah | ta madhukritah | yanyahani | te madhuvrishah | sa yo ha va eta madhukritashca
    madhuvrishag shca veda | kurvanti hasyaita agnau madhu | nasye ndhayanti || atha yo na veda || syaita
    agnau madhu kurvanti | dhayantyasyeshtapurtam || yo ha va ahoratrana nnamadheyani veda | nahoratreshva
    rtimarcchati | sajnannam sha drishteti | eta nnamadheyani | prastutam vi~shtutagm suta sunvatiti |
    etavanu nnamadheyani | nahoratreshva rtimarcchati | ya evam || yo ha vai muhurtana nnamadheyani veda
    | na muhurteshva rtimarcchati | citrah ketu rdata pradata savita prasavita 'bhishasta 'numanteti |
    ete 'nuvaka muhurtana nnamadheyani | na muhurteshva rtimarcchati | ya evam ve~da || yo ha va adrdhamasa
    nca masananca namadheyani veda | nadrdhamaseshu na maseshva rtimarcchati | pavitra thsahiyanaruno
    'runaraja iti | ete 'nuvaka adrdhamasana nca masananca namadheyani || || nadrdhamaseshu na maseshva
    rtimarcchati | ya evam ve~da || yo ha vai yajnakratuna va~thsarasya ca namadheyani veda | na yajnakratushu
    nartushu na sam va~thsara artimarcchati | agnishtoma ukthyo va~thsara iti | ete 'nuvaka yajnakratuna
    va~thsarasya ca namadheyani | na yajnakratushu nartushu na sam va~thsara artimarcchati | ya evam ve~da
    || yo ha vai muhurtana veda | na muhurtana mmuhurteshvarti marcchati || ntadanimiti | ete vai muhurtana
    mmuhurtah | na muhurtana mmuhurteshvarti kshetrajno bhutva 'nu pravishyanna matti | evamevaitan kshe
    trajno bhutva 'nu pravishya nnamatti | sa eteshameva salokatagm sayujya mashnute | apa punarmrityu
    nuvaka adrdhamasana muhurteshvartimarcchati iyamahoratranagm sajnanna mpurvapakshasya prastutamaparapakshasya
    muhurtana ncitrah keturadrdhamasana ya~jnakratunamagnishtomo yajnakratunamidani vededanimatho dvadasha
    anuvakeshu navasu lekhasu nabhya nceshtakopadhanam svayamatrinnopadhana ncocyate kashciddhava asma
    tpretya | atmanam masmiti | kashcithsvam nna prati prajanati || agnimugdho haiva dhumata nna prati
    prajanati | atha yo haivaita magnigm savitram ve~da | sa evasma lloka tpretya | atmanam mprati prajanati
    || esha u vevaina ntathsavitrah | svargam mabhivahati || ahoratrai rva idagm sayugbhih kriyate | iti
    ratraya dikshishata | iti ratraya vrata mupaguriti | tani hanevam vi~dushah | amushmin ~loke shevadhi
    ndhayanti | dhitagm haiva sa shevadhi manuparaiti || atha yo haivaitamagnigm savitram horatrani |
    amushmin ~loke shevadhi nna dhayanti | adhitagm haiva sa shevadhi manuparaiti || bharadvajo ha tribhirayurbhi
    rbrahmacaryamuvasa | tagm ha jirnigg sthaviragm shayanam | indra upavrajyo vaca | bharadvaja | yatte
    caturthamayurdadyam | kimenena kurya iti | brahmacaryamevainena careyamiti hovaca || rupana vijnataniva
    dar ncakara | teshagm haikaikasma ''dade | sa hovaca | bharadvajetyamantrya | veda va ete | ananta
    vai vedah | etadva etai stribhi ranvavocathah | atha ta itara dananuktameva | ehimam vai~ sarva vidyeti
    || || tasmai haitamagnigm savitramuvaca | tagm sa viditva | amrito bhutva | svargam lo~kamiyaya |
    adityasya sayujyam || amrito haiva bhutva | svargam lo~kameti | adityasya sayujyam | ya evam ve~da
    || esho eva trayi vidya || || yavantagm ha vai trayya vidyaya loka ve~da || agne rva etani namadheyani
    | agnereva sayujyagm salokata ve~da | vayo rva etani namadheyani | vayoreva sayujyagm salokata ve~da
    | indrasya va etani namadheyani || || indrasyaiva sayujyagm salokata ve~da | brihaspate rva etani
    namadheyani | brihaspatereva sayujyagm salokata ve~da | prajapate rva etani namadheyani | prajapatereva
    sayujyagm salokata ve~da | brahmano va etani namadheyani | brahmana eva sayujyagm salokata rapakshapuccho
    vayureva | tasyagni rmukha shshirah | sa yadete devate antarena | tathsarvagm sivyati | tasma ndrasya
    va etani namadheyani brahmana eva sayujyagm salokatamapnoti sapta ca agnervayorindrasya brihaspateh
    nadrdhamaseshu navacatvarigmshat || harih om || || iti taittariya yajubrahmane kathake prathamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे काठके प्रथमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम्
    ॥ अनुवाकं अनुवाकेषु नवसु लेखासु नाभ्या ञ्चेष्टकोपधानं स्वयमातृण्णोपधान ञ्चोच्यते स॒ञ्ज्ञानं॑ ञ्जा॒नद॑भिजा॒नत्
    । स॒कं ङ्क्लृ॒प्तम् । श्रेयो॒ वसी॑य आ॒यथ्सम्भू॑त म्भू॒तम् ॥ चि॒त्रः के॒तुः प्र॒भाना॒भान् थ्स॒भान्न्
    । ज्योति॑ष्मा॒ग्॒ स्तेज॑स्वाना॒तप॒ग्ग्॒ स्तप॑न्नभि॒तपन्न्॑ । रो॒च॒नो रोच॑मानः शोभ॑मानः क॒ल्याणः॑ ॥
    दर् श॒ता वि॒श्वरू॑पा सुदर् श॒ना । आ॒प्याय॑माना॒ प्याय॑माना॒ । आ॒पूर्य॑माणा॒ पूर्य॑माणा पू॒रय॑न्ती
    पू॒र्णा पौ र्णमा॒सी ॥ दा॒ता प्र॑दा॒ता ऽऽन॒न्दो मोदः॑ प्रमो॒दः ॥ थ्सम्भू॑तो भू॒तः ॥ प्रस्तु॑तं॒ विँष्टु॑त॒ग्ं॒
    सग्ग् विँ॒श्वरू॑पम् । शु॒क्रम॒मृत॑ स्समि॑द्धम् । अ॒रु॒ण त्तप॑स्वत् ॥ स॒वि॒ता प्र॑सवि॒ता दी॒प्तो दी॒पय॒
    न्दीप्य॑मानः । ज्वल॑ ञ्ज्वलि॒ता तप॑न् वि॒तपन् थ्स॒न्तपन्न्॑ । रो॒च॒नो रोच॑मान श्शुम्भ॑मानो वा॒मः ॥
    सु॒ता सु॑न्व॒ती प्रसु॑ता सू॒यमा॑ना ऽभिषू॒यमा॑णा । पीती ॥ का॒न्ता का॒म्या का॒मजा॒ता ऽऽयु॑ष्मती काम॒दुघा
    ॥ अ॒भि॒शा॒स्ता ऽनु॑म॒न्ता ऽऽन॒न्दो मोदः॑ प्रमो॒दः । आ॒सा॒दय॑ स्स॒न्नः । आ॒भू र्वि॒भूः प्र॒भू श्श॒भूं
    र्भुवः॑ ॥ प॒वित्र॑ न्पू॒तो मेद्ध्यः॑ । यशो॒ यश॑स्वा ना॒युर॒मृतः॑ । जी॒वो जी॑वि॒ष्य न्थ्स्व॒र्गो लो॒कः
    ॥ सह॑स्वा॒ न्थ्सह॑मानः । जय॑न्न थ्सु॒द्रवि॑णो द्रविणो॒दाः । आ॒र्द्रप॑वित्रो॒ हरि॑केशो॒ मोदः॑ प्रमो॒दः
    ॥ ॥ अ॒रु॒णो॑ ऽरु॒णर॑जाः पु॒ण्डरी॑को विश्व॒जिद॑ भि॒जित् । आ॒र्द्रः पिन्व॑मा॒नो ऽन्न॑वा॒न् निरा॑वान्
    । स॒र्वौ॒ष॒ध स्स॑भं॒रो मह॑स्वान् ॥ ए॒ज॒त्का जो॑व॒त्काः । क्षु॒ल्ल॒का श्शि॑पिविष्ट॒काः । स॒रि॒स्त्र॒रा
    स्सु॒शेर॑वः । अ॒जि॒रासो॑ गमि॒ष्णवः॑ ॥ इ॒दानी हि॑ क्षि॒प्रम॑जि॒रम् । आ॒शु र्नि॑मे॒षः फ॒णो द्रव॑न्नति॒
