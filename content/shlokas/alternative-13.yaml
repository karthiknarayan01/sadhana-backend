id: alternative-13
category: stotram
name:
  english: alternative
  devanagari: आल्तेर्नतिवे
content:
  english: shriannapurnashtottarashatanamastotram || shriganeshaya namah || || shriannapurnavishvanathabhyam
    namah || asya shriannapurnashtottarashatanamastotramantrasya bhagavan shribrahma rishih | anushtupchandah
    | shriannapurneshvari devata | svadha bijam | svaha shaktih | om kilakam | mama sarvabhishtaprasadasiddhayarthe
    pathe viniyogah | om annapurna shiva devi bhima pushtissarasvati | sarvajna parvati durga sharvani
    shivavallabha || 1|| vedavedya mahavidya vidyadatri visharada | kumari tripura bala lakshmishshrirbhayaharini
    || 2|| bhavani vishnujanani brahmadijanani tatha | ganeshajanani shaktih kumarajanani shubha || 3||
    bhogaprada bhagavati bhattabhishtapradayini | bhavarogahara bhavya shubhra paramamangala || 4|| bhavanni
    cancala gauri carucandrakaladhara | vishalakshi vishvamata vishvavandya vilasini || 5|| arya kalyananilaya
    rudrani kamalasana | shubhaprada shubhavarta vrittapinapayodhara || 6|| amba samharamathani mridani
    sarvamangala | vishnusamsevita siddha brahmani surasevita || 7|| paramanandada shantih paramanandarupini
    | paramanandajanani paranandapradayini || 8|| paropakaranirata parama bhaktavatsala | purnacandrabhavadana
    purnacandranibhamshuka || 9|| shubhalakshanasampanna shubhanandagunarnava | shubhasaubhagyanilaya
    shubhada ca ratipriya || 10|| candika candamathani candadarpanivarini | martandanayana sadhvi candragninayana
    sati || 11|| pundarikahara purna punyada punyarupini | mayatita shreshthamaya shreshthadharmatmavandita
    || 12|| asrishtissangarahita srishtihetuh kapardini | vrisharudha shulahasta sthitisamharakarini ||
    13|| mandasmita skandamata shuddhacitta munistuta | mahabhagavati daksha dakshadhvaravinashini ||
    14|| sarvarthadatri savitri sadashivakutumbini | nityasundarasarvangi sancidanandalakshana || 15||
    namnamashtottarashatambayah punyakaranam | sarvasaubhagyasiddhyartham japaniyam prayatnatah || 16||
    etani divyanamani shrutva dhyatva nirantaram | stutva devinca satatam sarvankamanavapnuyat || 17||
    || iti shribrahmottarakhande agamaprakhyatishivarahasye shriannapurnashtottarashatanamastotram sampurnam
    ||
  devanagari: श्रीअन्नपूर्णाष्टोत्तरशतनामस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ ॥ श्रीअन्नपूर्णाविश्वनाथाभ्यां नमः
    ॥ अस्य श्रीअन्नपूर्णाष्टोत्तरशतनामस्तोत्रमन्त्रस्य भगवान् श्रीब्रह्मा ऋषिः । अनुष्टुप्छन्दः । श्रीअन्नपूर्णेश्वरी
    देवता । स्वधा बीजम् । स्वाहा शक्तिः । ॐ कीलकम् । मम सर्वाभीष्टप्रसादसिद्धयर्थे पाठे विनियोगः । ॐ अन्नपूर्णा
    शिवा देवी भीमा पुष्टिस्सरस्वती । सर्वज्ञा पार्वती दुर्गा शर्वाणी शिववल्लभा ॥ १॥ वेदवेद्या महाविद्या
    विद्यादात्री विशारदा । कुमारी त्रिपुरा बाला लक्ष्मीश्श्रीर्भयहारिणी ॥ २॥ भवानी विष्णुजननी ब्रह्मादिजननी
    तथा । गणेशजननी शक्तिः कुमारजननी शुभा ॥ ३॥ भोगप्रदा भगवती भत्ताभीष्टप्रदायिनी । भवरोगहरा भव्या शुभ्रा
    परममङ्गला ॥ ४॥ भवान्नी चञ्चला गौरी चारुचन्द्रकलाधरा । विशालाक्षी विश्वमाता विश्ववन्द्या विलासिनी ॥
    ५॥ आर्या कल्याणनिलया रुद्राणी कमलासना । शुभप्रदा शुभावर्ता वृत्तपीनपयोधरा ॥ ६॥ अम्बा संहारमथनी मृडानी
    सर्वमङ्गला । विष्णुसंसेविता सिद्धा ब्रह्माणी सुरसेविता ॥ ७॥ परमानन्ददा शान्तिः परमानन्दरूपिणी । परमानन्दजननी
    परानन्दप्रदायिनी ॥ ८॥ परोपकारनिरता परमा भक्तवत्सला । पूर्णचन्द्राभवदना पूर्णचन्द्रनिभांशुका ॥ ९॥ शुभलक्षणसम्पन्ना
    शुभानन्दगुणार्णवा । शुभसौभाग्यनिलया शुभदा च रतिप्रिया ॥ १०॥ चण्डिका चण्डमथनी चण्डदर्पनिवारिणी । मार्ताण्डनयना
    साध्वी चन्द्राग्निनयना सती ॥ ११॥ पुण्डरीकहरा पूर्णा पुण्यदा पुण्यरूपिणी । मायातीता श्रेष्ठमाया श्रेष्ठधर्मात्मवन्दिता
    ॥ १२॥ असृष्टिस्सङ्गरहिता सृष्टिहेतुः कपर्दिनी । वृषारूढा शूलहस्ता स्थितिसंहारकारिणी ॥ १३॥ मन्दस्मिता
    स्कन्दमाता शुद्धचित्ता मुनिस्तुता । महाभगवती दक्षा दक्षाध्वरविनाशिनी ॥ १४॥ सर्वार्थदात्री सावित्री
    सदाशिवकुटुम्बिनी । नित्यसुन्दरसर्वाङ्गी सञ्चिदानन्दलक्षणा ॥ १५॥ नाम्नामष्टोत्तरशतम्बायाः पुण्यकारणम्
    । सर्वसौभाग्यसिद्ध्यर्थं जपनीयं प्रयत्नतः ॥ १६॥ एतानि दिव्यनामानि श्रुत्वा ध्यात्वा निरन्तरम् । स्तुत्वा
    देवीञ्च सततं सर्वान्कामानवाप्नुयात् ॥ १७॥ ॥ इति श्रीब्रह्मोत्तरखण्डे आगमप्रख्यातिशिवरहस्ये श्रीअन्नपूर्णाष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥
