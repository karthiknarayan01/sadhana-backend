id: devadibhihkritamvarahastotram-07
category: stotram
name:
  english: devadibhihkritamvarahastotram 07
  devanagari: देवादिभिःकृतंवराहस्तोत्रम् ०७
content:
  english: devadibhih kritam varahastotram 7 tatra kshiranidhestire krodarupam mahaharim || 37|| drishtva
    vai devata bhaktinamrastushtuvuradarat | namo mahavarahaya suyajnamurtaye namah || 38|| namo merusvarupaya
    daityaghnaya namo namah | namo mahasudamshtraya dharanidharine namah || 39|| samagravedavedangamurtaye
    te namo namah | namah sahasrahastaya namo vishvasvarupine || 40|| sargasthitisvarupaya namah kalasvarupine
    | nutnarupadhrite te ca sarvatra'tre namo namah || 41|| shribhulilaramalakshmikambharapataye namah
    | namah shantasvarupaya sarvantaryamine namah || 42|| iti stutva taya devairmunibhih rishibhirbhuva
    | varahasya hareh puja kritasrakcandanadibhih || 43|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 134
  devanagari: देवादिभिः कृतं वराहस्तोत्रम् ७ तत्र क्षीरनिधेस्तीरे क्रोडरूपं महाहरिम् ॥ ३७॥ दृष्ट्वा वै
    देवता भक्तिनम्रास्तुष्टुवुरादरात् । नमो महावराहाय सुयज्ञमूर्तये नमः ॥ ३८॥ नमो मेरुस्वरूपाय दैत्यघ्नाय
    नमो नमः । नमो महासुदंष्ट्राय धरणीधारिणे नमः ॥ ३९॥ समग्रवेदवेदाङ्गमूर्तये ते नमो नमः । नमः सहस्रहस्ताय
    नमो विश्वस्वरूपिणे ॥ ४०॥ सर्गस्थितिस्वरूपाय नमः कालस्वरूपिणे । नूत्नरूपधृते ते च सर्वत्राऽत्रे नमो
    नमः ॥ ४१॥ श्रीभूलीलारमालक्ष्मीकम्भरापतये नमः । नमः शान्तस्वरूपाय सर्वान्तर्यामिणे नमः ॥ ४२॥ इति स्तुत्वा
    तया देवैर्मुनिभिः ऋषिभिर्भुवा । वाराहस्य हरेः पूजा कृतास्रक्चन्दनादिभिः ॥ ४३॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने १३४
