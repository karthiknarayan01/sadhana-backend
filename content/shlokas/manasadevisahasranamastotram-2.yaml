id: manasadevisahasranamastotram-2
category: sahasranama
name:
  english: manasadevisahasranamastotram
  devanagari: मनसादेवीसहस्रनामस्तोत्रम्
content:
  english: rinu devi pravakshyami rahasyam paramadbhutam | manosadhanasarvajnam manasanamasahasram ||
    4|| naitatprakashaniyam hi nabhaktaya kadacana | gurubhaktiparasyaiva deyam shraddhasamanvite || 5||
    kashyapa rishirakhyato devata siddhayogini | anushtupchandasakhyatam namnam sahasramuttamam || 6||
    asya smaranamatrena prasanna manasayika | bhaktacitte vasennityam nagavidyaprakashini || 7|| atha
    sahasranamastotram | om manasa manasavidya manana mahati maha | mahavidya mahasiddhih kashyapamanasakanyaka
    || 8|| padmavati padmanetra padmahasta padmabhushana | padmamala padmagarbha padmini padmashobhana
    || 9|| vaishnavi vishahantri ca vishvagauri varaprada | varada vararupa ca vararha varavallabha ||
    10|| nageshi nagamata ca nagabhusha nageshvari | nagamala nagagamya nagavalli nagapriya || 11|| astikajanani
    dhanya dharmendragrihini shubha | jagatkarupriya sadhvi tapasvini tapomayi || 12|| siddhayogi siddhamata
    siddhavidya siddhida | siddhisevya'siddhigamya siddhistha siddhivallabha || 13|| raktaprabha raktavasa
    raktagandha ratipriya | ramya ramanya ramaniya ranjani rasabhavini || 14|| trinetra trigunatita trikalajna
    trilocana | trishaktih tripatha trata trailokyahitakarini || 15|| karuna kamala kanta kamada kamacarini
    | kalyani kalika kavya kaumudi kamalekshana || 16|| yogamaya yogagamya yogini yogavallabha | yogastha
    yogada yogya yogasiddhipradayini || 17|| mangala mangalakara mangalarthapradayini | mangaleshi mahabhadra
    mahashanta manasvini || 18|| shubhra shobha shubhakari shuddha shuddhipradayini | shashvati shantida
    shanta shiva shivapara shubha || 19|| bhadra bhadraprada bhaktya bhaktaraksha bhayapaha | bhavini
    bhavada bhavyabhavita bhavarakshini || 20|| jnanada jnanagamya ca jnanamurtirjaganmayi | jnanashaktirjnanarupa
    jnanagarbha jagadguruh || 21|| vidya vidyeshvari vandya vimala vishvabhavini | vishvambhara vishvamata
    vishvapujya visharada || 22|| caitanya cinmayi citta cintya cintavinashini | cintapurna cidakara cidanandasvarupini
    || 23|| saumya saubhagyajanani saukhyada somashekhara | suramya subhaga sukshma sulabha sumanapriya
    || 24|| prajna prajnaprada purna punya punyaphalaprada | pavani paramapara parananda parayana || 25||
    parama parameshani paratpara parayani | pareshi paramavidya parabrahmasvarupini || 26|| nitya'nanta
    niralamba nirvikara niranjana | nirmala nirguna nitya nihsima nityamangala || 27|| ambika ambudashyama
    aruna arunekshana | acintya atisukshma ca anadya amritaprada || 28|| ishani ishvararadhya ikshana
    ihitaprada | idya ipsitadatri ca ishvari ishavallabha || 29|| uma ugraprashamani unnata urugamini
    | upendrapujita udra udita utkalapriya || 30|| riddhida rijurupa ca ritajna ritapalini | ritambara
    ritaprajna rijushila ritapriya || 31|| eka ekantanilaya ekabhavaprakashini | ekagra ekavidya ca ekarupa
    ekadayini || 32|| aishvarya aishvaryajanani aindri aindraprapujita | aikyada aishvaryagamya aishvaryaphaladayini
    || 33|| ojasvini ojada caiva onkararthasvarupini | odana ojasam mata oghanashinyanuttama || 34|| audarya
    aushadhishani aunnatyaphaladayini | audumbari aupamya ca audaryagunashalini || 35|| amshumala amshudatri
    amshuka amshubhushana | arcita arcanaprita arcishmatyarcisham nidhih || 36|| indira induvadana inducuda
    ibhapriya | ishtada ishtasiddhishca ishtadevi ihaprada || 37|| kaushiki kaulini kantirkalpada kalpavallabha
    | kalpalata kalparupa kalpavrikshanivasini || 38|| khyatih khageshapujya ca khaladarpavinashini |
    khagagama khaniprajna khadgadharinyanuttama || 39|| ganga gauryah priya gamya gunada gunashalini |
    guhya guhyatara gopya gurubhaktiparayana || 40|| ghanaprabha ghanashyama ghoraduhkhavinashini | ghritaci
    ghanagambhira ghoshini ghoshavallabha || 41|| candrika candravadana cidrupa caruhasini | carvi carugatishcaiva
    cakrini cakrarakshini || 42|| chayada chatrarupa ca chandogamya chaleshvari | chinnamoha chinnapasha
    chidradoshavinashini || 43|| jagaddhatri jaganmata jayada jayashalini | jayanti jivanaprajna jivaneshi
    jitendriya || 44|| jhankarini jhashagamya jharini jhatitiprada | jhillinadapriya jhashta jhankritih
    jhatitiprabha || 45|| jnana jneyasvarupa ca jnaptida jnanashalini | jnatrirupa jnananishtha jneyatita
    jaganmayi || 46|| tankini tankadharini tankarasvarashobhita | tikarupa tankavandya tankavidyaprakashini
    || 47|| thakara thamini theya thakararthaprabodhini | thakkarabhayasamhantri thamastha thauradayini
    || 48|| damari dindimarava damarupritamanasa | dakini damarajneya dindimadhvanitoshini || 49|| dhundhiraksha
    dhakkini ca dhalini dhalarakshini | dhundhivandya dhakarastha dhaukitasheshavighnaha || 50|| nakarastha
    nakarupa nakararthaprakashini | natvavidya nadipujya nitya nadaprabodhini || 51|| tattvarupa tapomurtistaruni
    tarini tama | taraka tapahantri ca tattvajna tattvadayini || 52|| thakarastha thira theyathulasukshmasvarupini
    | thakaranilaya thamya thairyada thapanashini || 53|| daya dakshayani diksha diptirdipaprakashini
    | devamata digambara divya dainyavinashini || 54|| dharmajna dharmanirata dharmada dharmapalini |
    dharmendravallabha dhanya dhairyada dhritivardhini || 55|| nanda nandaprada nitya nagini nagavallabha
    | navya nadamayi namra nagalokanivasini || 56|| padmakshi pavani purna pingala parameshvari | pritida
    pranada prajna pashamocanakarini || 57|| phalada phanirajastha phullapadmanibhanana | phanimala phaniprita
    phutkarabhayaharini || 58|| bala bodhaprada buddhirbrahmavidya balaprada | brahmani brahmarupa ca
    brahmanandaprakashini || 59|| bhavani bhaktida bhadra bhasvati bhuvaneshvari | bhogada bhavini bhavyabhishtada
    bhayanashini || 60|| mangala manada medha mokshada mohaharini | mahalakshmirmahamaya maheshi madhurasvara
    || 61|| yashoda yashasi yogya yajnaraksha yatishvari | yamabhitiharayukta yuktida yugadharini || 62||
    rama ramya rasayukta ratnagarbha ratipriya | ranjini rakshini radhya rajarajeshvari rama || 63|| lalita
    lalanaradhya lokamata layaprada | lakshmirlakshanasampanna lavanyamritavarshini || 64|| varada vagmini
    vandya vidyadhisha varanana | vishvesha vishvajanani vishvamangalakarini || 65|| sharada shantida
    shuddha shubhada shivavallabha | shrimati shriprada shreya shrutirupa shriyahpriya || 66|| shadadhara
    shadananda shadguna shadvibhavini | shatcakranilaya shadbhih siddhayogaih supujita || 67|| satyarupa
    sadananda sarvajna sarvamangala | sarvasiddhiprada saumya sarvarakshakari shiva || 68|| hamsaga hamsarupa
    ca hamsavidya haripriya | hridistha hemavarna ca harshada havyavahana || 69|| kshama kshemakari kshipra
    kshirabdhitanaya kshitih | kshemada kshudradoshaghni kshemamargapradarshini || 70 akshara akshayaprajna
    akshayashripradayini | akhanda akhiladhara agamya agameshvari || 71|| aghahantri aghadveshi acala
    acalapriya | atula atigambhira atisukshma atipriya || 72|| ananta anagha anya anadinidhaneshvari |
    anukampa anirvacya anupama anuttama || 73|| abhishtada abhaya amba amrita amriteshvari | amogha amala
    advaita abhinna abhayankari || 74|| aradhya artihantri ca arya arogyadayini | ananda anandamayi ashrita
    ashishaprada || 75|| indulekha indukala ishtada indirapriya | ihalokeshvari idya ishvararcitapaduka
    || 76|| ujjvala uttama urvi unmesha unnataprabha | udara upakarajna upasyopanishatpriya || 77|| ritumati
    riddhidatri rishisevya ritaprabha | rinamocani rijuprita rishivandya ritatmika || 78|| ekavira ekanishtha
    ekabhakta ekadarshini | ekantavasini eka ekamantraprapujita || 79|| aishvaryada aikyamayi aindri aishvaryavardhini
    | aihikamushmikaphalada aishvaryanilaya shubha || 80|| onkaramadhyanilaya ojorashiprakashini | otaprota
    ojasvini onkararthasvarupini || 81|| audaryanilaya aushadheshi aunnatyapradayini | autsukyaharini
    aujjvalya audaryagunabhushana || 82|| kameshi kamarupa ca kamada kamasundari | karunya karanatita
    kalajna kalanashini || 83|| kiranabha kirtidatri kirtya kirtivivardhini | kuleshi kulasamraksha kulavidya
    kulapriya || 84|| khadgini khalahantri ca khyatida khagagamini | khageshavandita kharva khaladarpavinashini
    || 85|| gaurangi gambhira gauri gunanidhirgunaprada | guhyamba guhyavidya ca gurumargaprakashini ||
    86|| ghoshavatya ghritaprita ghanateja ghanaprabha | ghorabhitiharaghora ghantanadapraharshini ||
    87|| carunetra caruhasa carucandranibhanana | cidrupa cetanadhara cakramadhyanivasini || 88|| chinnatrishna
    chinnamoha chinnapasha chidatmakam | chayarupa chandamata chandovidyaprakashini || 89|| jayada jivanadhara
    jagaddhatri jagatpriya | jitakrodha jitamaya jitendriyavaraprada || 90|| jharini jhankritispanda jhilliravapraharshini
    | jhashaketupriya jhatya jhankarasvarashobhita || 91|| jnaptirupa jnanagamya jnanadipa jnanada | jneyatita
    jnatrimata jnananandaprakashini || 92|| tankarini tankavidya tankadharinyanuttama | tikita tankamadhyastha
    tankarasvararanjini || 93|| thakarastha thakaradhya thamini thairyadayini | thakkarabhayasamhantri
    thauraraksha thakarini || 94|| damarupriyanirghosha dakini dindimadhvanih | damari dolaliladhya damarunadatoshita
    || 95|| dhalini dhakkini dhira dhundhivighnavinashini | dhundhirupa dhakarastha dhakkanadapramodini
    || 96|| nadarupa nakarastha nityapujya namodaya | nadabindusamayukta nirvikalpaprakashini || 97||
    tarini tattvanilaya taporashistapomayi | tarala taruni tushta turiya tattvarupini || 98|| thira thairyaprada
    thamya thakararthaprakashini | thulasukshmasvarupa ca thapanashavidhayini || 99|| dayamayi danashila
    diksha diptirdivaukasam | devapujya digishani durgatidhvamsakarini || 100|| dharmada dharmanirata
    dharmajna dharmapalini | dharmendrapriyabhavastha dhritida dhairyavardhini || 101|| nagamata nagapujya
    nagamalavibhushana | nageshi nagavidya ca nagalokanivasini || 102|| nitya nirmalacitta ca nirbhaya
    nirvikarini | nirmoha nirupadrava nihshanka nityamangala || 103|| padmini padmagarbha ca padmanetra
    padmabhushana | padmahasta padmavasi padmaprita padaprada || 104|| phalada phanibhushadhya phanirajaprapujita
    | phutkarabhitisamhantri phullambhojavilocana || 105|| brahmavidya brahmarupa brahmashaktirbalaprada
    | buddhida bodhini bodhya brahmanandaprakashini || 106|| bhadra bhaktiprada bhavyabhayada bhavarakshini
    | bhavani bhasvati bhutih bhuvaneshi bhayapaha || 107|| mahamaya mahavidya mahasiddhipradayini | mahashaktirmahaprajna
    mahalakshmirmaheshvari || 108|| manomayi manojna ca manobijasvarupini | manahshuddhiprada manya manorathaphalaprada
    || 109|| mangala mangalaprita mangalarthapradayini | mangaleshi mahakantirmadhura madhurasvana ||
    110|| yajneshi yajnaphalada yajnaraksha yashasvini | yatindravandita yogya yugadharinyanuttama ||
    111|| ramya ratnaprada rakshi ranjani rasadayini | rajeshi rajarajya ca rakenduvadanojjvala || 112||
    lakshmirlavanyasampanna lokamata layaprada | lalita lalitakara lilamritaviharini || 113|| vandya vagishvari
    vani varada varavarnini | vijaya vimala vishva vishvamata visharada || 114|| shiva shanta shubha shuddha
    shrida shriparipalini | sharada shrutirupa ca shreyasi shriniketana || 115|| shadadhara shadananda
    shatcakranilayeshvari | shadguna shodashi shadbhih siddhayogairnishevita || 116|| satya sarvajnarupa
    ca sarvamangaladayini | sarvavidya sarvasiddhih sarvaraksha sanatani || 117|| hamsastha hridayavasa
    hariprita harapriya | harshada hemavarna ca hitada hridayeshvari || 118|| kshama kshemaprada kshipra
    kshirambhonidhisambhava | kshemankari kshitidhara kshayadoshavinashini || 119|| siddhayogishvararadhya
    siddhasanghanishevita | siddhistha siddhidatri ca siddhamargaprakashini || 120|| dhanada dharani dhira
    dhritimata dhaneshvari | nityapujya nararadhya narmada naganandini || 121|| pavani priyada purna bhaktamata
    phalaprada | brahmapujya bhavacchetri mahadevi manohara || 122|| yashasvini ratnagarbha lalana varadayini
    | shivapriya shadadhara sarasvatyai hridisthita || 123|| hemaprabha kshamamurti ambika ishapujita
    | unnata ritarupa ca ekavira ojasvini || 124|| audarya kamaniyangi khyatida gunaranjini | ghoraha
    candranilaya chinnashoka jagaddhiti || 125|| jhankararucira jneya tankahasta thakaraga | damarupritahridaya
    dhalaraksha nadatmika || 126|| tapomayi dharmanishtha nagarajni padashraya | phanimandalamadhyastha
    bodhida bhaktavatsala || 127|| mayatita yashorashirlokadhatri vagadhishvari | shubhavasa shadishani
    satyarupa haripriya || 128|| kshemada akhilananda anagha indushekhara | upakarapriya riddha aishvarya
    onkarashraya || 129|| aushadhisha kashyapi ca khalaghni gambhirabhashini | carukeshi jivanadri jnaptidatri
    tarini || 130|| thirabhava dayasindhurnirlepa padmamalini | phaniraksha brahmamata mahamangaladayini
    || 131|| yogini ranjani lakshmih vishvaraksha shriyahprada | sarvajna hridayavasa kshirapurnamritaprada
    || 132|| acala bhaktigamya ca cidrupa dharmarakshini | nagavalli padmahasta phanirajaprapujita ||
    133|| bhavamoca yashodatri ramya shuddha hridisthita | kshantida ishvaraprita lalita gunasagara ||
    134|| aunnatyada matrirupa siddhida kamalalaya | vagdevi tarini purna ratnadipa jaganmayi || 135||
    jnanagamya mangalastha nagakanya varaprada | shivaradhya hamsagamya lakshmih karunavigraha || 136||
    bhutidhatri yogamata candravaktra padashraya | dharmajna vishvavandya ca ramaniya kshitishvari ||
    137|| amritastha idyarupa unnidra ritapalini | ekacinta ojasam dhama audaryaparipurita || 138|| kalyani
    ghanagambhira chayamata jivanaprada | jhankaranilaya tanka damarunadaharshini || 139|| nadabindusamutpanna
    taporashirdayamayi | nirvikalpa padmanetra phalarupa bhavapaha || 140|| mahashanta yashahpurna rasayukta
    layatmika | vishvadhatri shankararcya sarvamangaladayini || 141|| hemamala kshemarupa akhileshi ibhapujita
    | upasya rishivandya ca aikyada onkaramadhyaga || 142|| aushadhijanani kirtirkhadgini gauravaprada
    | cintapurna jhillirava jneyamurtistapomayi || 143|| dhritimata nagabhusha padmini brahmacarini |
    madhura yogasiddhishca rakshini shriniketana || 144|| satyavidya harshadatri kshamashila ambikatmika
    | ishvari urvara riddhih ekananda aujasvini || 145|| kamarupa gunanidhirghoshini candrashekhara |
    jaganmata jnapanishtha dakshayanyanukampini || 146|| nityananda purnashaktih phanimala bhavapriya
    | manovidya yajnaraksha lokapujya shivatmika || 147|| shrutirupa shatcakrastha sarvavidya haripriya
    | kshirabdhikalpalatika akhandanandarupini || 148|| adyashaktirumaradhya ritubhartri kamalapriya |
    gangasevya jaganmata dakini padmalocana || 149|| dharmapatni naresharcya phalada bhaktavatsala | mahaprajna
    yamabhita ratnadiptih shivarcita || 150|| lakshmiramba varenya shadgunadhya sarvamohini | haripriya
    kshemadatri indubhasa tapasvini || 151|| audaryasindhuh khyatishca cidananda jnanarupini | jhankaramadhura
    tanka digishi nagabhushana || 152|| purnakantirbrahmavidya manovanchaphalaprada | rakshamurti satyanishtha
    hamsagamya yogavallabha || 153|| kshantirupa amritastha ishashaktirudaradhih | riddhisevyaikanilaya
    ojorashiranuttama || 154|| kulavidya ghanashyama candradiptirjayaprada | jneyamata tapahsiddhirdayarashirniramaya
    || 155|| padmagarbha phanishani bhavamoca mahamatih | yashasvini rasayukta liladhisha vishvaga ||
    156|| shrimati shodashi saumya hridayambhojavasini | kshirapurna akhiladhara ishtada upakarini ||
    157|| rishipujya aishvaryadatri onkarasvararupini | aushadhisha kalanatha gunapurna ghrinanidhih ||
    158|| caruhasa jhillirava tankarasvarashobhita | dhakkanadapriya nitya dharmasamrakshanotsuka || 159||
    nagarajni padmamala brahmapujya maheshvari | yogamaya ramadevi lakshitarthapradayini || 160|| anadiramrita
    idya unnata ritavandita | ekarupa audaryadhya kamala khalanashini || 161|| gunagamya ghanaprakhya
    carushila jagadguruh | jnatrirupa taponishtha dayasara nagavallabha || 162|| padmahasta phalaprajna
    brahmashaktirmanomayi | yashodatri ramaradhya lalita vishvapalini || 163|| shivarupa shadadhara satyamata
    haripriya | kshamamayi ambika ishi upasya'riddhidayini || 164|| aishvaryajanani ojasvi aushadhisha
    kritapriya | khagagamya gauradeha cidrupa jhankaramalini || 165|| tankini dhalahasta ca nadabindusvarupini
    | dharmajna nagapujya ca padmagarbha bhavapaha || 166|| mahavidya yashorashirlokamata shriyahprada
    | sarvasiddhiprada hamsi kshemada akhileshvari || 167|| indunetra upakara rishivandya ekabhavini |
    onkaranilaya kanta gunamata ghanaprabha || 168|| candravaktra jivaneshi jnanagamya tapasvini | dayamayi
    nityapujya purnashaktih phalaprada || 169|| brahmavidya mahalakshmi yogini rakshini shubha | vishveshi
    sharada satya harinakshi kshitishvari || 170|| amogha ihitaprajna urugamya ritatmika | aikyarupa aunnatyada
    kalyani gunashobhita || 171|| ghoshini carunetra jhillinadapramodini | jneyatita taporashirdhritida
    nagamalini || 172|| padmini phanirajastha bhavani mahimashraya | yajnapriya ramamata lilashaktih shivapriya
    || 173|| shatcakravasini sarva hridayastha kshamashraya | advaita indiraradhya upanishadguhashraya
    || 174|| ritupujya ekavira ojorashirmahojjvala | kamadhenuh gunanidhirghanagambhiranihsvana || 175||
    caitanya jagadananda jnanadipa tapahphalam | dayarupa nagamata padmalocana punyada || 176|| phalasiddhirbrahmamayi
    mahamaya yashasvini | rasatmika lokapujya vagdevi shriniketana || 177|| sarvajna hemavarna kshirapurnamritaprada
    | akhandanandarupa ca ishtasiddhipradayini || 178|| uttama riddhidatri ca aishvarya onkaratmika |
    audaryasagara kanta gaurangi candrashekhara || 179|| jagatpujya jnanamata dharmasamrakshanotsuka |
    nagarajni padmavasa brahmanandaprakashini || 180|| phalashrutih | idam namasahasram te kathitam paramadbhutam
    | guhyadguhyataram devi siddhayoginisevitam || 181|| yah pathetpratarutthaya shraddhabhaktisamanvitah
    | tasya tushyati sa devi manasa naganayika || 182|| ekavaram pathennityam papajalam pranashyati |
    dvivaram sarvasaubhagyam trivaram siddhimapnuyat || 183|| dashavaram pathenmantri vidyavan syanna
    samshayah | shatavaram japennityam mantrasiddhih prajayate || 184|| yatraitatpathyate nityam shucau
    deshe samahitaih | tatra tishthati sa devi nagasanghaih samanvita || 185|| grihe tasya sthira lakshmirvidya
    vani ca shashvati | arogyam vipulam saukhyam shantishca hridi jayate || 186|| nagadosho vishabhayam
    grahapida bhayankari | sahasranamapathena shanaireva pranashyati || 187|| duhsvapnadurgatikshobhadaridryabhayasancayah
    | devinamaprabhavena nashyanti dhruvameva hi || 188|| vidyarthi labhate vidyam dhanarthi labhate dhanam
    | yasho'rthi labhate kirtim bhakto bhaktim param labhet || 189|| rajadvare sabhamadhye vivade shatrusankate
    | jayameva labhennityam devinamaprabhavatah || 190|| vane jale girau durge marge corasamakule | smritamatrena
    namnam tu raksham kuryajjagadguruh || 191|| na datavyam duracaraya nastikaya kadacana | gurudvesharatayapi
    lobhinam naiva darshayet || 192|| shantaya gurubhaktaya satyashilaya dhimate | dayalave jitendriyaya
    pradeyam siddhikankshine || 193|| sahasranamasampurne priyate siddhayogini | bhaktavatsalabhavena
    karunamritavarshini || 194|| jaya manase devi jagadambike shive | jaya padmavati shrimannagarajni
    namostu te || 195|| jaya siddhayogini shubhe mangalacandike pare | jaya kashyapakanye tvam bhaktanugrahakarini
    || 196|| jaya jagatkarugehini dharmendradayite shubhe | jayastikajananyamba trahi mam sharanagatam
    || 197|| raktambare raktavarne raktapadmavilocane | nagamalavrite devi prasida parameshvari || 198||
    tvameva mata me nityam tvameva sharanam mama | tvameva hridaye devi tvameva paramagatih || 199|| manasa
    karmana vaca yadbhaktya samupasitam | tatsarvam saphalam devi tvatprasadanna samshayah || 200|| bhavabandhavinirmuktim
    shantim saukhyam shubham shriyam | vidyam dhairyam ca me devi prayaccha karunanidhe || 201|| namo
    namaste nageshi namo yogiprapujite | namo manasamataste namah siddhipradayini || 202|| ityuktva krodhabhairavah
    samalingya param shivam | rahasyam samyagakhyaya tushnim yogamupeyivan || 203|| bhairavyapi prasannatma
    pranamya bhairavam prabhum | dharayamasa tattantram hridayambhojamadhyaga || 204|| iti manasatantre
    pancamapatale shrimanasadevisahasranamastotram sampurnam || || om tatsat || || om ||
  devanagari: ृणु देवि प्रवक्ष्यामि रहस्यं परमाद्भुतम् । मनोसाधनसर्वज्ञं मानसानामसाहस्रम् ॥ ४॥ नैतत्प्रकाशनीयं
    हि नाभक्ताय कदाचन । गुरुभक्तिपरस्यैव देयं श्रद्धासमन्विते ॥ ५॥ कश्यप ऋषिराख्यातो देवता सिद्धयोगिनी
    । अनुष्टुप्छन्दसाख्यातं नाम्नां साहस्रमुत्तमम् ॥ ६॥ अस्य स्मरणमात्रेण प्रसन्ना मानसायिका । भक्तचित्ते
    वसेन्नित्यं नागविद्याप्रकाशिनी ॥ ७॥ अथ सहस्रनामस्तोत्रम् । ॐ मानसा मानसविद्या मनना महती महा । महाविद्या
    महासिद्धिः काश्यपमानसकन्यका ॥ ८॥ पद्मावती पद्मनेत्रा पद्महस्ता पद्मभूषणा । पद्ममाला पद्मगर्भा पद्मिनी
    पद्मशोभना ॥ ९॥ वैष्णवी विषहन्त्री च विश्वगौरी वरप्रदा । वरदा वररूपा च वरार्हा वरवल्लभा ॥ १०॥ नागेशी
    नागमाता च नागभूषा नगेश्वरी । नागमाला नागगम्या नागवल्ली नगप्रिया ॥ ११॥ आस्तीकजननी धन्या धर्मेन्द्रगृहिणी
    शुभा । जगत्कारुप्रिया साध्वी तपस्विनी तपोमयी ॥ १२॥ सिद्धयोगी सिद्धमाता सिद्धविद्या सिद्धिदा । सिद्धिसेव्याऽसिद्धिगम्या
    सिद्धिस्था सिद्धिवल्लभा ॥ १३॥ रक्तप्रभा रक्तवासा रक्तगन्धा रतिप्रिया । रम्या रमण्या रमणीया रञ्जनी
    रसभाविनी ॥ १४॥ त्रिनेत्रा त्रिगुणातीता त्रिकालज्ञा त्रिलोचना । त्रिशक्तिः त्रिपथा त्राता त्रैलोक्यहितकारिणी
    ॥ १५॥ करुणा कमला कान्ता कामदा कामचारिणी । कल्याणी कलिका काव्या कौमुदी कमलेक्षणा ॥ १६॥ योगमाया योगगम्या
    योगिनी योगवल्लभा । योगस्था योगदा योग्या योगसिद्धिप्रदायिनी ॥ १७॥ मङ्गला मङ्गलाकारा मङ्गलार्थप्रदायिनी
    । मङ्गलेशी महाभद्रा महाशान्ता मनस्विनी ॥ १८॥ शुभ्रा शोभा शुभकरी शुद्धा शुद्धिप्रदायिनी । शाश्वती शान्तिदा
    शान्ता शिवा शिवपरा शुभा ॥ १९॥ भद्रा भद्रप्रदा भक्त्या भक्तरक्षा भयापहा । भाविनी भावदा भव्याभाविता
    भवरक्षिणी ॥ २०॥ ज्ञानदा ज्ञानगम्या च ज्ञानमूर्तिर्जगन्मयी । ज्ञानशक्तिर्ज्ञानरूपा ज्ञानगर्भा जगद्गुरुः
    ॥ २१॥ विद्या विद्येश्वरी वन्द्या विमला विश्वभाविनी । विश्वम्भरा विश्वमाता विश्वपूज्या विशारदा ॥ २२॥
    चैतन्या चिन्मयी चित्ता चिन्त्या चिन्ताविनाशिनी । चिन्तापूर्णा चिदाकारा चिदानन्दस्वरूपिणी ॥ २३॥ सौम्या
    सौभाग्यजननी सौख्यदा सोमशेखरा । सुरम्या सुभगा सूक्ष्मा सुलभा सुमनप्रिया ॥ २४॥ प्रज्ञा प्रज्ञाप्रदा
    पूर्णा पुण्या पुण्यफलप्रदा । पावनी परमापारा परानन्दा परायणा ॥ २५॥ परमा परमेशानी परात्पारा परायणी ।
    परेशी परमाविद्या परब्रह्मस्वरूपिणी ॥ २६॥ नित्याऽनन्ता निरालम्बा निर्विकारा निरञ्जना । निर्मला निर्गुणा
    नित्या निःसीमा नित्यमङ्गला ॥ २७॥ अम्बिका अम्बुदश्यामा अरुणा अरुणेक्षणा । अचिन्त्या अतिसूक्ष्मा च अनाद्या
    अमृतप्रदा ॥ २८॥ ईशानी ईश्वराराध्या ईक्षणा ईहितप्रदा । ईड्या ईप्सितदात्री च ईश्वरी ईशवल्लभा ॥ २९॥ उमा
    उग्रप्रशमनी उन्नता उरुगामिनी । उपेन्द्रपूजिता उद्रा उदिता उत्कलप्रिया ॥ ३०॥ ऋद्धिदा ऋजुरूपा च ऋतज्ञा
    ऋतपालिनी । ऋताम्बरा ऋतप्रज्ञा ऋजुशीला ऋतप्रिया ॥ ३१॥ एका एकान्तनिलया एकभावप्रकाशिनी । एकाग्रा एकविद्या
    च एकरूपा एकदायिनी ॥ ३२॥ ऐश्वर्या ऐश्वर्यजननी ऐन्द्री ऐन्द्रप्रपूजिता । ऐक्यदा ऐश्वर्यगम्या ऐश्वर्यफलदायिनी
    ॥ ३३॥ ओजस्विनी ओजदा चैव ओङ्कारार्थस्वरूपिणी । ओदना ओजसां माता ओघनाशिन्यनुत्तमा ॥ ३४॥ औदार्या औषधीशानी
    औन्नत्यफलदायिनी । औदुम्बरी औपम्या च औदार्यगुणशालिनी ॥ ३५॥ अंशुमाला अंशुदात्री अंशुका अंशुभूषणा । अर्चिता
    अर्चनप्रीता अर्चिष्मत्यर्चिषां निधिः ॥ ३६॥ इन्दिरा इन्दुवदना इन्दुचूडा इभप्रिया । इष्टदा इष्टसिद्धिश्च
    इष्टदेवी इहप्रदा ॥ ३७॥ कौशिकी कौलिनी कान्तिर्कल्पदा कल्पवल्लभा । कल्पलता कल्परूपा कल्पवृक्षनिवासिनी
    ॥ ३८॥ ख्यातिः खगेशपूज्या च खलदर्पविनाशिनी । खगगामा खनिप्रज्ञा खड्गधारिण्यनुत्तमा ॥ ३९॥ गङ्गा गौर्याः
    प्रिया गम्या गुणदा गुणशालिनी । गुह्या गुह्यतरा गोप्या गुरुभक्तिपरायणा ॥ ४०॥ घनप्रभा घनश्यामा घोरदुःखविनाशिनी
    । घृताची घनगम्भीरा घोषिणी घोषवल्लभा ॥ ४१॥ चन्द्रिका चन्द्रवदना चिद्रूपा चारुहासिनी । चार्वी चारुगतिश्चैव
    चक्रिणी चक्ररक्षिणी ॥ ४२॥ छायादा छत्ररूपा च छन्दोगम्या छलेश्वरी । छिन्नमोहा छिन्नपाशा छिद्रदोषविनाशिनी
    ॥ ४३॥ जगद्धात्री जगन्माता जयदा जयशालिनी । जयन्ती जीवनप्रज्ञा जीवनेशी जितेन्द्रिया ॥ ४४॥ झङ्कारिणी
    झषगम्या झरिणी झटितिप्रदा । झिल्लीनादप्रिया झष्टा झङ्कृतिः झटितिप्रभा ॥ ४५॥ ज्ञाना ज्ञेयस्वरूपा च ज्ञप्तिदा
    ज्ञानशालिनी । ज्ञातृरूपा ज्ञाननिष्ठा ज्ञेयातीता जगन्मयी ॥ ४६॥ टङ्किनी टङ्कधारिणी टङ्कारस्वरशोभिता
    । टीकारूपा टङ्कवन्द्या टङ्कविद्याप्रकाशिनी ॥ ४७॥ ठकारा ठामिनी ठेया ठकारार्थप्रबोधिनी । ठक्कारभयसंहन्त्री
    ठामस्था ठौरदायिनी ॥ ४८॥ डामरी डिण्डिमारावा डमरुप्रीतमानसा । डाकिनी डामरज्ञेया डिण्डिमध्वनितोषिणी ॥
    ४९॥ ढुण्ढिरक्षा ढक्किनी च ढालिनी ढालरक्षिणी । ढुण्ढिवन्द्या ढकारस्था ढौकिताशेषविघ्नहा ॥ ५०॥ णकारस्था
    णकारूपा णकारार्थप्रकाशिनी । णत्वविद्या णदीपूज्या णित्या णादप्रबोधिनी ॥ ५१॥ तत्त्वरूपा तपोमूर्तिस्तरुणी
    तारिणी तमा । तारका तापहन्त्री च तत्त्वज्ञा तत्त्वदायिनी ॥ ५२॥ थकारस्था थिरा थेयाथूलसूक्ष्मस्वरूपिणी
    । थकारनिलया थम्या थैर्यदा थापनाशिनी ॥ ५३॥ दया दाक्षायणी दीक्षा दीप्तिर्दीपप्रकाशिनी । देवमाता दिगम्बारा
    दिव्या दैन्यविनाशिनी ॥ ५४॥ धर्मज्ञा धर्मनिरता धर्मदा धर्मपालिनी । धर्मेन्द्रवल्लभा धन्या धैर्यदा धृतिवर्धिनी
    ॥ ५५॥ नन्दा नन्दप्रदा नित्या नागिनी नागवल्लभा । नव्या नादमयी नम्रा नागलोकनिवासिनी ॥ ५६॥ पद्माक्षी
    पावनी पूर्णा पिङ्गला परमेश्वरी । प्रीतिदा प्राणदा प्रज्ञा पाशमोचनकारिणी ॥ ५७॥ फलदा फणिराजस्था फुल्लपद्मनिभानना
    । फणिमाला फणिप्रीता फूत्कारभयहारिणी ॥ ५८॥ बाला बोधप्रदा बुद्धिर्ब्रह्मविद्या बलप्रदा । ब्रह्माणी ब्रह्मरूपा
    च ब्रह्मानन्दप्रकाशिनी ॥ ५९॥ भवानी भक्तिदा भद्रा भास्वती भुवनेश्वरी । भोगदा भाविनी भव्याभीष्टदा भयनाशिनी
    ॥ ६०॥ मङ्गला मानदा मेधा मोक्षदा मोहहारिणी । महालक्ष्मीर्महामाया महेशी मधुरस्वरा ॥ ६१॥ यशोदा यशसी योग्या
    यज्ञरक्षा यतीश्वरी । यमभीतिहरायुक्ता युक्तिदा युगधारिणी ॥ ६२॥ रमा रम्या रसायुक्ता रत्नगर्भा रतिप्रिया
    । रञ्जिनी रक्षिणी राध्या राजराजेश्वरी रमा ॥ ६३॥ ललिता ललनाराध्या लोकमाता लयप्रदा । लक्ष्मीर्लक्षणसम्पन्ना
    लावण्यामृतवर्षिणी ॥ ६४॥ वरदा वाग्मिनी वन्द्या विद्याधीशा वरानना । विश्वेशा विश्वजननी विश्वमङ्गलकारिणी
    ॥ ६५॥ शारदा शान्तिदा शुद्धा शुभदा शिववल्लभा । श्रीमती श्रीप्रदा श्रेया श्रुतिरूपा श्रियःप्रिया ॥ ६६॥
    षडाधारा षडानन्दा षड्गुणा षड्विभाविनी । षट्चक्रनिलया षड्भिः सिद्धयोगैः सुपूजिता ॥ ६७॥ सत्यरूपा सदानन्दा
    सर्वज्ञा सर्वमङ्गला । सर्वसिद्धिप्रदा सौम्या सर्वरक्षाकरि शिवा ॥ ६८॥ हंसगा हंसरूपा च हंसविद्या हरिप्रिया
    । हृदिस्था हेमवर्णा च हर्षदा हव्यवाहना ॥ ६९॥ क्षमा क्षेमकरी क्षिप्रा क्षीराब्धितनया क्षितिः । क्षेमदा
    क्षुद्रदोषघ्नी क्षेममार्गप्रदर्शिनी ॥ ७० अक्षरा अक्षयप्रज्ञा अक्षयश्रीप्रदायिनी । अखण्डा अखिलाधारा
    अगम्या अगमेश्वरी ॥ ७१॥ अघहन्त्री अघद्वेषी अचला अचलप्रिया । अतुला अतिगम्भीरा अतिसूक्ष्मा अतिप्रिया
    ॥ ७२॥ अनन्ता अनघा अन्या अनादिनिधनेश्वरी । अनुकम्पा अनिर्वाच्या अनुपमा अनुत्तमा ॥ ७३॥ अभीष्टदा अभया
    अम्बा अमृता अमृतेश्वरी । अमोघा अमला अद्वैता अभिन्ना अभयङ्करी ॥ ७४॥ आराध्या आर्तिहन्त्री च आर्या आरोग्यदायिनी
    । आनन्दा आनन्दमयी आश्रिता आशिषप्रदा ॥ ७५॥ इन्दुलेखा इन्दुकला इष्टदा इन्दिराप्रिया । इहलोकेश्वरी ईड्या
    ईश्वरार्चितपादुका ॥ ७६॥ उज्ज्वला उत्तमा उर्वी उन्मेषा उन्नतप्रभा । उदारा उपकारज्ञा उपास्योपनिषत्प्रिया
    ॥ ७७॥ ऋतुमती ऋद्धिदात्री ऋषिसेव्या ऋतप्रभा । ऋणमोचनि ऋजुप्रीता ऋषिवन्द्या ऋतात्मिका ॥ ७८॥ एकवीरा एकनिष्ठा
    एकभक्ता एकदर्शिनी । एकान्तवासिनी एका एकमन्त्रप्रपूजिता ॥ ७९॥ ऐश्वर्यदा ऐक्यमयी ऐन्द्री ऐश्वर्यवर्धिनी
    । ऐहिकामुष्मिकफलदा ऐश्वर्यनिलया शुभा ॥ ८०॥ ओङ्कारमध्यनिलया ओजोराशिप्रकाशिनी । ओतप्रोता ओजस्विनी ओङ्कारार्थस्वरूपिणी
    ॥ ८१॥ औदार्यनिलया औषधेशी औन्नत्यप्रदायिनी । औत्सुक्यहरिणी औज्ज्वल्या औदार्यगुणभूषणा ॥ ८२॥ कामेशी कामरूपा
    च कामदा कामसुन्दरी । कारुण्या कारणातीता कालज्ञा कालनाशिनी ॥ ८३॥ किरणाभा कीर्तिदात्री कीर्त्या कीर्तिविवर्धिनी
    । कुलेशी कुलसंरक्षा कुलविद्या कुलप्रिया ॥ ८४॥ खड्गिनी खलहन्त्री च ख्यातिदा खगगामिनी । खगेशवन्दिता
    खर्वा खलदर्पविनाशिनी ॥ ८५॥ गौराङ्गी गम्भीरा गौरी गुणनिधिर्गुणप्रदा । गुह्याम्बा गुह्यविद्या च गुरुमार्गप्रकाशिनी
    ॥ ८६॥ घोषवत्या घृतप्रीता घनतेजा घनप्रभा । घोरभीतिहराघोरा घण्टानादप्रहर्षिणी ॥ ८७॥ चारुनेत्रा चारुहासा
    चारुचन्द्रनिभानना । चिद्रूपा चेतनाधारा चक्रमध्यनिवासिनी ॥ ८८॥ छिन्नतृष्णा छिन्नमोहा छिन्नपाशा छिदात्मकम्
    । छायारूपा छन्दमाता छन्दोविद्याप्रकाशिनी ॥ ८९॥ जयदा जीवनाधारा जगद्धात्री जगत्प्रिया । जितक्रोधा जितमाया
    जितेन्द्रियवरप्रदा ॥ ९०॥ झरिणी झङ्कृतिस्पन्दा झिल्लीरावप्रहर्षिणी । झषकेतुप्रिया झट्या झङ्कारस्वरशोभिता
    ॥ ९१॥ ज्ञप्तिरूपा ज्ञानगम्या ज्ञानदीपा ज्ञानदा । ज्ञेयातीता ज्ञातृमाता ज्ञानानन्दप्रकाशिनी ॥ ९२॥ टङ्कारिणी
    टङ्कविद्या टङ्कधारिण्यनुत्तमा । टीकिता टङ्कमध्यस्था टङ्कारस्वररञ्जिनी ॥ ९३॥ ठकारस्था ठकाराध्या ठामिनी
    ठैर्यदायिनी । ठक्कारभयसंहन्त्री ठौररक्षा ठकारिणी ॥ ९४॥ डमरुप्रियनिर्घोषा डाकिनी डिण्डिमध्वनिः । डामरी
    डोललीलाढ्या डमरूनादतोषिता ॥ ९५॥ ढालिनी ढक्किनी ढीरा ढुण्ढिविघ्नविनाशिनी । ढुण्ढिरूपा ढकारस्था ढक्कानादप्रमोदिनी
    ॥ ९६॥ णादरूपा णकारस्था णित्यपूज्या णमोदया । णादबिन्दुसमायुक्ता णिर्विकल्पप्रकाशिनी ॥ ९७॥ तारिणी तत्त्वनिलया
    तपोराशिस्तपोमयी । तरला तरुणी तुष्टा तुरीया तत्त्वरूपिणी ॥ ९८॥ थिरा थैर्यप्रदा थम्या थकारार्थप्रकाशिनी
    । थूलसूक्ष्मस्वरूपा च थापनाशविधायिनी ॥ ९९॥ दयामयी दानशीला दीक्षा दीप्तिर्दिवौकसाम् । देवपूज्या दिगीशानी
    दुर्गतिध्वंसकारिणी ॥ १००॥ धर्मदा धर्मनिरता धर्मज्ञा धर्मपालिनी । धर्मेन्द्रप्रियभावस्था धृतिदा धैर्यवर्धिनी
    ॥ १०१॥ नागमाता नागपूज्या नागमालाविभूषणा । नागेशी नागविद्या च नागलोकनिवासिनी ॥ १०२॥ नित्या निर्मलचित्ता
    च निर्भया निर्विकारिणी । निर्मोहा निरुपद्रावा निःशङ्का नित्यमङ्गला ॥ १०३॥ पद्मिनी पद्मगर्भा च पद्मनेत्रा
    पद्मभूषणा । पद्महस्ता पद्मवासी पद्मप्रीता पदप्रदा ॥ १०४॥ फलदा फणिभूषाढ्या फणिराजप्रपूजिता । फूत्कारभीतिसंहन्त्री
    फुल्लाम्भोजविलोचना ॥ १०५॥ ब्रह्मविद्या ब्रह्मरूपा ब्रह्मशक्तिर्बलप्रदा । बुद्धिदा बोधिनी बोध्या ब्रह्मानन्दप्रकाशिनी
    ॥ १०६॥ भद्रा भक्तिप्रदा भव्याभयदा भवरक्षिणी । भवानी भास्वती भूतिः भुवनेशी भयापहा ॥ १०७॥ महामाया महाविद्या
    महासिद्धिप्रदायिनी । महाशक्तिर्महाप्रज्ञा महालक्ष्मीर्महेश्वरी ॥ १०८॥ मनोमयी मनोज्ञा च मनोबीजस्वरूपिणी
    । मनःशुद्धिप्रदा मान्या मनोरथफलप्रदा ॥ १०९॥ मङ्गला मङ्गलप्रीता मङ्गलार्थप्रदायिनी । मङ्गलेशी महाकान्तिर्मधुरा
    मधुरस्वना ॥ ११०॥ यज्ञेशी यज्ञफलदा यज्ञरक्षा यशस्विनी । यतीन्द्रवन्दिता योग्या युगधारिण्यनुत्तमा ॥
    १११॥ रम्या रत्नप्रदा रक्षी रञ्जनी रसदायिनी । राजेशी राजराज्या च राकेन्दुवदनोज्ज्वला ॥ ११२॥ लक्ष्मीर्लावण्यसम्पन्ना
    लोकमाता लयप्रदा । ललिता ललिताकारा लीलामृतविहारिणी ॥ ११३॥ वन्द्या वागीश्वरी वाणी वरदा वरवर्णिनी । विजया
    विमला विश्वा विश्वमाता विशारदा ॥ ११४॥ शिवा शान्ता शुभा शुद्धा श्रीदा श्रीपरिपालिनी । शारदा श्रुतिरूपा
    च श्रेयसी श्रीनिकेतना ॥ ११५॥ षडाधारा षडानन्दा षट्चक्रनिलयेश्वरी । षड्गुणा षोडशी षड्भिः सिद्धयोगैर्निषेविता
    ॥ ११६॥ सत्या सर्वज्ञरूपा च सर्वमङ्गलदायिनी । सर्वविद्या सर्वसिद्धिः सर्वरक्षा सनातनी ॥ ११७॥ हंसस्था
    हृदयावासा हरिप्रीता हरप्रिया । हर्षदा हेमवर्णा च हितदा हृदयेश्वरी ॥ ११८॥ क्षमा क्षेमप्रदा क्षिप्रा
    क्षीराम्भोनिधिसम्भवा । क्षेमङ्करी क्षितिधरा क्षयदोषविनाशिनी ॥ ११९॥ सिद्धयोगीश्वराराध्या सिद्धसङ्घनिषेविता
    । सिद्धिस्था सिद्धिदात्री च सिद्धमार्गप्रकाशिनी ॥ १२०॥ धनदा धरणी धीरा धृतिमाता धनेश्वरी । नित्यपूज्या
    नराराध्या नर्मदा नागनन्दिनी ॥ १२१॥ पावनी प्रियदा पूर्णा भक्तमाता फलप्रदा । ब्रह्मपूज्या भवच्छेत्री
    महादेवी मनोहरा ॥ १२२॥ यशस्विनी रत्नगर्भा ललना वरदायिनी । शिवप्रिया षडाधारा सरस्वत्यै हृदिस्थिता ॥
    १२३॥ हेमप्रभा क्षमामूर्ति अम्बिका ईशपूजिता । उन्नता ऋतरूपा च एकवीरा ओजस्विनी ॥ १२४॥ औदार्या कमनीयाङ्गी
    ख्यातिदा गुणरञ्जिनी । घोरहा चन्द्रनिलया छिन्नशोका जगद्धिती ॥ १२५॥ झङ्काररुचिरा ज्ञेया टङ्कहस्ता ठकारगा
    । डमरुप्रीतहृदया ढालरक्षा णदात्मिका ॥ १२६॥ तपोमयी धर्मनिष्ठा नागराज्ञी पदाश्रया । फणिमण्डलमध्यस्था
    बोधिदा भक्तवत्सला ॥ १२७॥ मायातीता यशोराशिर्लोकधात्री वागधीश्वरी । शुभावासा षडीशानी सत्यरूपा हरिप्रिया
    ॥ १२८॥ क्षेमदा अखिलानन्दा अनघा इन्दुशेखरा । उपकारप्रिया ऋद्धा ऐश्वर्या ओङ्कराश्रया ॥ १२९॥ औषधीशा काश्यपी
    च खलघ्नी गम्भीरभाषिणी । चारुकेशी जीवनद्री ज्ञप्तिदात्री तारिणी ॥ १३०॥ थिरभावा दयासिन्धुर्निर्लेपा
    पद्ममालिनी । फणिरक्षा ब्रह्ममाता महामङ्गलदायिनी ॥ १३१॥ योगिनी रञ्जनी लक्ष्मीः विश्वरक्षा श्रियःप्रदा
    । सर्वज्ञा हृदयावासा क्षीरपूर्णामृतप्रदा ॥ १३२॥ अचला भक्तिगम्या च चिद्रूपा धर्मरक्षिणी । नागवल्ली
    पद्महस्ता फणिराजप्रपूजिता ॥ १३३॥ भवमोचा यशोदात्री रम्या शुद्धा हृदिस्थिता । क्षान्तिदा ईश्वरप्रीता
    ललिता गुणसागरा ॥ १३४॥ औन्नत्यदा मातृरूपा सिद्धिदा कमलालया । वाग्देवी तारिणी पूर्णा रत्नदीपा जगन्मयी
    ॥ १३५॥ ज्ञानगम्या मङ्गलस्था नागकन्या वरप्रदा । शिवाराध्या हंसगम्या लक्ष्मीः करुणविग्रहा ॥ १३६॥ भूतिधात्री
    योगमाता चन्द्रवक्त्रा पदाश्रया । धर्मज्ञा विश्ववन्द्या च रमणीया क्षितीश्वरी ॥ १३७॥ अमृतस्था ईड्यरूपा
    उन्निद्रा ऋतपालिनी । एकचिन्ता ओजसां धाम औदार्यपरिपूरिता ॥ १३८॥ कल्याणी घनगम्भीरा छायामाता जीवनप्रदा
    । झङ्कारनिलया टङ्का डमरूनादहर्षिणी ॥ १३९॥ णादबिन्दुसमुत्पन्ना तपोराशिर्दयामयी । निर्विकल्पा पद्मनेत्रा
    फलरूपा भवापहा ॥ १४०॥ महाशान्ता यशःपूर्णा रसायुक्ता लयात्मिका । विश्वधात्री शङ्करार्च्या सर्वमङ्गलदायिनी
    ॥ १४१॥ हेममाला क्षेमरूपा अखिलेशी इभपूजिता । उपास्या ऋषिवन्द्या च ऐक्यदा ओङ्कारमध्यगा ॥ १४२॥ औषधीजननी
    कीर्तिर्खड्गिनी गौरवप्रदा । चिन्तापूर्णा झिल्लीरावा ज्ञेयमूर्तिस्तपोमयी ॥ १४३॥ धृतिमाता नागभूषा पद्मिनी
    ब्रह्मचारिणी । मधुरा योगसिद्धिश्च रक्षिणी श्रीनिकेतना ॥ १४४॥ सत्यविद्या हर्षदात्री क्षमाशीला अम्बिकात्मिका
    । ईश्वरी उर्वरा ऋद्धिः एकानन्दा औजस्विनी ॥ १४५॥ कामरूपा गुणनिधिर्घोषिणी चन्द्रशेखरा । जगन्माता ज्ञापनिष्ठा
    दाक्षायण्यनुकम्पिनी ॥ १४६॥ नित्यानन्दा पूर्णशक्तिः फणिमाला भवप्रिया । मनोविद्या यज्ञरक्षा लोकपूज्या
    शिवात्मिका ॥ १४७॥ श्रुतिरूपा षट्चक्रस्था सर्वविद्या हरिप्रिया । क्षीराब्धिकल्पलतिका अखण्डानन्दरूपिणी
    ॥ १४८॥ आद्याशक्तिरुमाराध्या ऋतुभर्त्री कमलप्रिया । गङ्गासेव्या जगन्माता डाकिनी पद्मलोचना ॥ १४९॥ धर्मपत्नी
    नरेशार्च्या फलदा भक्तवत्सला । महाप्रज्ञा यमभीता रत्नदीप्तिः शिवार्चिता ॥ १५०॥ लक्ष्मीरम्बा वरेण्या
    षड्गुणाढ्या सर्वमोहिनी । हरिप्रिया क्षेमदात्री इन्दुभासा तपस्विनी ॥ १५१॥ औदार्यसिन्धुः ख्यातिश्च चिदानन्दा
    ज्ञानरूपिणी । झङ्कारमधुरा टङ्का दिगीशी नागभूषणा ॥ १५२॥ पूर्णकान्तिर्ब्रह्मविद्या मनोवाञ्छाफलप्रदा
    । रक्षामूर्ति सत्यनिष्ठा हंसगम्या योगवल्लभा ॥ १५३॥ क्षान्तिरूपा अमृतस्था ईशशक्तिरुदारधीः । ऋद्धिसेव्यैकनिलया
    ओजोराशिरनुत्तमा ॥ १५४॥ कुलविद्या घनश्यामा चन्द्रदीप्तिर्जयप्रदा । ज्ञेयमाता तपःसिद्धिर्दयाराशिर्निरामया
    ॥ १५५॥ पद्मगर्भा फणीशानी भवमोचा महामतिः । यशस्विनी रसायुक्ता लीलाधीशा विश्वगा ॥ १५६॥ श्रीमती षोडशी
    सौम्या हृदयाम्भोजवासिनी । क्षीरपूर्णा अखिलाधारा इष्टदा उपकारिणी ॥ १५७॥ ऋषिपूज्या ऐश्वर्यदात्री ओङ्कारस्वररूपिणी
    । औषधीशा कलानाथा गुणपूर्णा घृणानिधिः ॥ १५८॥ चारुहासा झिल्लीरावा टङ्कारस्वरशोभिता । ढक्कानादप्रिया
    नित्या धर्मसंरक्षणोत्सुका ॥ १५९॥ नागराज्ञी पद्ममाला ब्रह्मपूज्या महेश्वरी । योगमाया रमादेवी लक्षितार्थप्रदायिनी
    ॥ १६०॥ अनादिरमृता ईड्या उन्नता ऋतवन्दिता । एकरूपा औदार्याढ्या कमला खलनाशिनी ॥ १६१॥ गुणगम्या घनप्रख्या
    चारुशीला जगद्गुरुः । ज्ञातृरूपा तपोनिष्ठा दयासारा नागवल्लभा ॥ १६२॥ पद्महस्ता फलप्रज्ञा ब्रह्मशक्तिर्मनोमयी
    । यशोदात्री रमाराध्या ललिता विश्वपालिनी ॥ १६३॥ शिवरूपा षडाधारा सत्यमाता हरिप्रिया । क्षमामयी अम्बिका
    ईशी उपास्याऽऋद्धिदायिनी ॥ १६४॥ ऐश्वर्यजननी ओजस्वी औषधीशा कृतप्रिया । खगगम्या गौरदेहा चिद्रूपा झङ्कारमालिनी
    ॥ १६५॥ टङ्किनी ढालहस्ता च णादबिन्दुस्वरूपिणी । धर्मज्ञा नागपूज्या च पद्मगर्भा भवापहा ॥ १६६॥ महाविद्या
    यशोराशिर्लोकमाता श्रियःप्रदा । सर्वसिद्धिप्रदा हंसी क्षेमदा अखिलेश्वरी ॥ १६७॥ इन्दुनेत्रा उपकारा ऋषिवन्द्या
    एकभाविनी । ओङ्कारनिलया कान्ता गुणमाता घनप्रभा ॥ १६८॥ चन्द्रवक्त्रा जीवनेशी ज्ञानगम्या तपस्विनी । दयामयी
    नित्यपूज्या पूर्णशक्तिः फलप्रदा ॥ १६९॥ ब्रह्मविद्या महालक्ष्मी योगिनी रक्षिणी शुभा । विश्वेशी शारदा
    सत्या हरिणाक्षी क्षितीश्वरी ॥ १७०॥ अमोघा ईहितप्रज्ञा उरुगम्या ऋतात्मिका । ऐक्यरूपा औन्नत्यदा कल्याणी
    गुणशोभिता ॥ १७१॥ घोषिणी चारुनेत्रा झिल्लीनादप्रमोदिनी । ज्ञेयातीता तपोराशिर्धृतिदा नागमालिनी ॥ १७२॥
    पद्मिनी फणिराजस्था भवानी महिमाश्रया । यज्ञप्रिया रमामाता लीलाशक्तिः शिवप्रिया ॥ १७३॥ षट्चक्रवासिनी
    सर्वा हृदयस्था क्षमाश्रया । अद्वैता इन्दिराराध्या उपनिषद्गुहाश्रया ॥ १७४॥ ऋतुपूज्या एकवीरा ओजोराशिर्महोज्ज्वला
    । कामधेनुः गुणनिधिर्घनगम्भीरनिःस्वना ॥ १७५॥ चैतन्या जगदानन्दा ज्ञानदीपा तपःफलम् । दयारूपा नागमाता
    पद्मलोचना पुण्यदा ॥ १७६॥ फलसिद्धिर्ब्रह्ममयी महामाया यशस्विनी । रसात्मिका लोकपूज्या वाग्देवी श्रीनिकेतना
    ॥ १७७॥ सर्वज्ञा हेमवर्णा क्षीरपूर्णामृतप्रदा । अखण्डानन्दरूपा च इष्टसिद्धिप्रदायिनी ॥ १७८॥ उत्तमा
    ऋद्धिदात्री च ऐश्वर्या ओङ्करात्मिका । औदार्यसागरा कान्ता गौराङ्गी चन्द्रशेखरा ॥ १७९॥ जगत्पूज्या ज्ञानमाता
    धर्मसंरक्षणोत्सुका । नागराज्ञी पद्मवासा ब्रह्मानन्दप्रकाशिनी ॥ १८०॥ फलश्रुतिः । इदं नामसहस्रं ते कथितं
    परमाद्भुतम् । गुह्याद्गुह्यतरं देवि सिद्धयोगिनिसेवितम् ॥ १८१॥ यः पठेत्प्रातरुत्थाय श्रद्धाभक्तिसमन्वितः
    । तस्य तुष्यति सा देवी मानसा नागनायिका ॥ १८२॥ एकवारं पठेन्नित्यं पापजालं प्रणश्यति । द्विवारं सर्वसौभाग्यं
    त्रिवारं सिद्धिमाप्नुयात् ॥ १८३॥ दशवारं पठेन्मन्त्री विद्यावान् स्यान्न संशयः । शतवारं जपेन्नित्यं
    मन्त्रसिद्धिः प्रजायते ॥ १८४॥ यत्रैतत्पठ्यते नित्यं शुचौ देशे समाहितैः । तत्र तिष्ठति सा देवी नागसङ्घैः
    समन्विता ॥ १८५॥ गृहे तस्य स्थिरा लक्ष्मीर्विद्या वाणी च शाश्वती । आरोग्यं विपुलं सौख्यं शान्तिश्च
    हृदि जायते ॥ १८६॥ नागदोषो विषभयं ग्रहपीडा भयङ्करी । सहस्रनामपाठेन शनैरेव प्रणश्यति ॥ १८७॥ दुःस्वप्नदुर्गतिक्षोभदारिद्र्यभयसञ्चयाः
    । देवीनामप्रभावेण नश्यन्ति ध्रुवमेव हि ॥ १८८॥ विद्यार्थी लभते विद्यां धनार्थी लभते धनम् । यशोऽर्थी
    लभते कीर्तिं भक्तो भक्तिं परां लभेत् ॥ १८९॥ राजद्वारे सभामध्ये विवादे शत्रुसङ्कटे । जयमेव लभेन्नित्यं
    देवीनामप्रभावतः ॥ १९०॥ वने जले गिरौ दुर्गे मार्गे चोरसमाकुले । स्मृतमात्रेण नाम्नां तु रक्षां कुर्याज्जगद्गुरुः
    ॥ १९१॥ न दातव्यं दुराचाराय नास्तिकाय कदाचन । गुरुद्वेषरतायापि लोभिनां नैव दर्शयेत् ॥ १९२॥ शान्ताय
    गुरुभक्ताय सत्यशीलाय धीमते । दयालवे जितेन्द्रियाय प्रदेयं सिद्धिकाङ्क्षिणे ॥ १९३॥ सहस्रनामसम्पूर्णे
    प्रीयते सिद्धयोगिनी । भक्तवत्सलभावेन करुणामृतवर्षिणी ॥ १९४॥ जय मानसे देवि जगदम्बिके शिवे । जय पद्मावति
    श्रीमन्नागराज्ञि नमोस्तु ते ॥ १९५॥ जय सिद्धयोगिनि शुभे मङ्गलचण्डिके परे । जय कश्यपकन्ये त्वं भक्तानुग्रहकारिणि
    ॥ १९६॥ जय जगत्कारुगेहिनि धर्मेन्द्रदयिते शुभे । जयास्तीकजनन्यम्ब त्राहि मां शरणागतम् ॥ १९७॥ रक्ताम्बरे
    रक्तवर्णे रक्तपद्मविलोचने । नागमालावृते देवि प्रसीद परमेश्वरि ॥ १९८॥ त्वमेव माता मे नित्यं त्वमेव
    शरणं मम । त्वमेव हृदये देवि त्वमेव परमागतिः ॥ १९९॥ मनसा कर्मणा वाचा यद्भक्त्या समुपासितम् । तत्सर्वं
    सफलं देवि त्वत्प्रसादान्न संशयः ॥ २००॥ भवबन्धविनिर्मुक्तिं शान्तिं सौख्यं शुभां श्रियम् । विद्यां
    धैर्यं च मे देवि प्रयच्छ करुणानिधे ॥ २०१॥ नमो नमस्ते नागेशि नमो योगिप्रपूजिते । नमो मानसमातस्ते नमः
    सिद्धिप्रदायिनि ॥ २०२॥ इत्युक्त्वा क्रोधभैरवः समालिङ्ग्य परां शिवाम् । रहस्यं सम्यगाख्याय तूष्णीं
    योगमुपेयिवान् ॥ २०३॥ भैरव्यपि प्रसन्नात्मा प्रणम्य भैरवं प्रभुम् । धारयामास तत्तन्त्रं हृदयाम्भोजमध्यगा
    ॥ २०४॥ इति मनसातन्त्रे पञ्चमपटले श्रीमनसादेवीसहस्रनामस्तोत्रं सम्पूर्णम् ॥ ॥ ॐ तत्सत् ॥ ॥ ॐ ॥
