  devanagari: श्रीविद्युत्कलिताऽजवञ्जवमहा रावेगम्बुन मन्मनोब्जसमुदी सेवं दामरतम्परै मनियॆदन् ॥ वाणीवल्लभदुर्लभम्बगु
    भवद्द्वारम्बुन न्निल्चि नि र्वाणश्री जूचिन विचारद्रोहमो नित्य क ल्याणक्रीडल बासि दुर्दशलपा लै राजलोकाधम
    श्रेणीद्वारमु दूऱ जेसि तिपुडो श्री कालहस्तीश्वरा ॥ अन्ता मिध्य तलञ्चि चूचिन नरुं डट्लौ टॆऱिङ्गिन्
    सदा कान्त ल्पुत्रुलु नर्धमुन् तनुवु नि क्कम्बञ्चु मोहार्णव चिभ्रान्तिं जॆन्दि जरिञ्चु गानि परमार्धम्बैन
    नीयन्दु जिन्ताकन्तयु जिन्त निल्प डुगदा श्री कालहस्तीश्वरा बाटुमाट विनुमा नीचेत जीतम्बु ने गानिं बट्टक
    सन्ततम्बु मदि वेड्कं गॊल्तु नन्तस्सप त्नानीकम्बुन कॊप्पगिम्पकुमु नन्नापाटीये चालु दे जीनॊल्लं गरि
    नॊल्ल नॊल्ल सिरुलन् श्री कालहस्तीश्वरा ॥ भवकेलीमदिरामदम्बुन महा पापात्मु डै वीडु न न्नु विवेकिम्प
    डटञ्चु नेनु नरकार्णोराशिपालैन बालुण्डॊकचोट नाटतमितोड न्नूत दं ड्रि विचारिम्पक युण्डुना कटकटा श्री
    कालहस्तीश्वरा जेसि येनॊकनि गॊल्वम्बोतिनो काक ने नीमाट न्विननॊल्लकुण्डितिनॊ निन्ने दिक्कुगा जूडनो येमी
    इट्टिवृधापराधिनगु नन्नी दुःखवाराशिवी ची मध्यम्बुन मुञ्चि युम्पदगुना श्री कालहस्तीश्वरा ॥ दिविजक्ष्मा
    रुह धेनु रत्न घनभूति प्रस्फुरद्रत्नसा नुवु नी विल्लु निधीश्वरुण्डु सखु डर्णोराशिकन्याविभुं डुविशेषार्चकु
    डिङ्क नीकॆन घनुण्डुं गल्गुने नीवु चू चि विचारिम्पवु लेमि नॆव्व डुडुपुन् श्री कालहस्तीश्वरा ॥ नीतो
    युध्धमु चेय नो गविता निर्माणशक्ति न्निनुं ब्रीतुञ्जेयगलेनु नीकॊऱकु दण्ड्रिञ्जम्पगा जाल ना चेतन् रोकट
    निन्नुमॊत्तवॆऱतुञ्जीकाकु नाभक्ति ये रीतिन्नाकि क निन्नु जूडगलुगन् श्री कालहस्तीश्वरा ॥ आलुम्बिड्डलु
    दल्लिदण्ड्रुलु धनम्बञ्चु न्महाबन्धनं बेला नामॆड गट्टिनाडविक निन्नेवेल जिन्तिन्तु नि र्मूलम्बैन मनम्बुलो
    नॆगडु दुर्मोहाब्धिलो ग्रुङ्कि यी शीलामालपु जिन्त नॆट्लुडिपॆदो श्री कालहस्तीश्वरा ॥ निप्पै पातकतूलशैल
    मडचुन् नीनाममुन् मानवुल् तप्पन् दव्वुल विन्न नन्तक भुजादर्पोद्धतक्लेशमुल् तप्पुन्दारुनु मुक्तु लौदु
    रवि शास्त्रम्बुल्महापण्डितुल् चॆप्पङ्गा दमकिङ्क शङ्क वलॆना श्री कालहस्तीश्वरा ॥ वीडॆम्बब्बिन यप्पुडुं
    दम नुतुल् विन्नप्पुडुम्बॊट्टलो गूडुन्नप्पुडु श्रीविलासमुलु पैकॊन्नप्पुडुं गायकुल् पाडङ्ग विनुनप्पुडुन्
    जॆल गु दम्भप्रायविश्राणन क्रीडासक्तुल नेमि चॆप्पवलॆनो श्री कालहस्तीश्वरा ॥ निनु सेविम्पग नापदल् वॊडमनी
    नित्योत्सवं बब्बनी जनमात्रुण्डननी महात्मु डननी संसारमोहम्बु पै कॊननी ज्ञानमु गल्गनी ग्रहगनुल् गुन्दिम्पनी
    मेलुव च्चिन रानी यवि नाकु भूषणमुलो श्री कालहस्तीश्वरा ॥ ए वेदम्बु बठिञ्चॆ लूत भुजङ्गं बेशास्त्रमुल्सूचॆ
    दा ने विद्याभ्यसनम्बॊनर्चॆ गरि चॆञ्चेमन्त्र मूहिञ्चॆ बो धाविर्भावनिदानमुल् चदुवुलय्या मीपादसं सेवासक्तियॆ
    काक जन्तुततिकिन् श्री कालहस्तीश्वरा ॥ कायल् गाचॆ वधूनखाग्रमुलचे गायम्बु वक्षोजमुल् रायन् रापडॆ ऱॊम्मु
    मन्मध विहारक्लेशविभ्रान्तिचे ब्रायं बायॆनु बट्टगट्टॆ दलचॆप्पन् रोत संसारमे गदवे श्री कालहस्तीश्वरा
    ॥ निन्नेरूपमुगा भजिन्तु मदिलो नीरूपु मोकालॊ स्त्री चन्नो कुञ्चमु मेकपॆण्टिकयॊ यी सन्देहमुल्मान्पि
    ना कन्नार न्भवदीयमूर्ति सगुणा कारम्बुगा जूपवे चिन्नीरेजविहारमत्तमधुपा श्री कालहस्तीश्वरा किलि गावुमण्टिनॊ
    मरुन्नीलाकाभ्रान्ति गुं टॆन पॊम्मण्टिनॊ यॆङ्गिलिच्चि तिनु तिण्टे गानि कादण्टिनो निनु नॆम्मिन्दग विश्वसिञ्चुसुजनानीकम्बु
    रक्षिम्प जे सिन नाविन्नपमेल गैकॊनवया श्री कालहस्तीश्वरा जालन् जम्पङ्ग नेत्रमु न्दिवियङ्गाशक्तुण्डने
    गानु ना शीलं बेमनि चॆप्पनुन्नदि क नी चित्तम्बु ना भाग्यमो श्रीलक्ष्मीपतिसेविताङ्घ्रियुगला ॥ राजुल्
    मत्तुलु वारिसेव नरकप्रायम्बु वारिच्चुनं भोजाक्षीचतुरन्तयानतुरगी भूषादु लात्मव्यधा बीजम्बुल् तदपेक्ष
    चालु मरितृप्तिं बॊन्दितिन् ज्ञानल क्ष्मीजाग्रत्परिणाम मिम्मु दयतो श्री कालहस्तीश्वरा दुदमॊदल् नेगान
    नीवैनचो रारा रम्मनि यञ्चु जॆप्पवु पृधारम्भम्बु लिङ्केटिकिन् नीर न्मुम्पुमु पाल मुम्पु मि डं जुमी श्रीरामार्चित
    पादपद्मयुगला श्री कालहस्तीश्वरा ॥ नीकु न्मांसमु वाञ्छयेनि कऱवा नीचेत लेडुण्ड जोकैनट्टि कुठारमुण्ड
    ननल ज्योतुण्ड नीरुण्ड गा बाकं बॊप्प घटिञ्चि चेतिपुनुकन् भक्षिम्पकाबोयचे जेकॊं टॆङ्गिलिमांसमिट्लु दगुना
    श्री कालहस्तीश्वरा जन्दुरुण्डु राराजै कुबेरुण्डु दृ ग्राजीवम्बुन गाञ्चॆ दुःखमु कुरुक्ष्मापालु डामाटने
    याजिं गूलॆ समस्तबन्धुवुलतो ना राजशब्धम्बु ची छी जन्मान्तरमन्दु नॊल्लनुजुमी श्री कालहस्तीश्वरा डैनचो
    नॆचट धर्मम्बुण्डु नेरीति ना नाजातिक्रिय लेर्पडुन् सुखमु मान्यश्रेणि कॆट्लब्बु रू पाजीवालिकि नेदि दिक्कु
    धृतिनी भक्तुल् भवत्पादनी रेजम्बुल् भजियिन्तु रेतॆऱ गुनन् श्री कालहस्तीश्वरा गल् पिप्पलपत्रमुल् मॆऱ
    गु टद्दम्बुल् मरुद्दीपमुल् करिकर्णान्तमु लॆण्डमावुल ततुल् खद्योत्कीटप्रभल् सुरवीधीलिखिताक्षरम्बु लसुवुल्
    ज्योत्स्नापःपिण्डमुल् सिरुलन्देल मदान्धुलौदुरु जनुल् श्री कालहस्तीश्वरा ॥ निन्नुन्नम्मिन रीति नम्म
    नॊरुलन् नीकन्न नाकॆन्नले रन्नलम्मुलु तल्लिदण्ड्रुलु गुरुन्दापत्सहायुन्दु ना यन्ना यॆन्नडु नन्नु संस्कृतिविषादाम्भोधि
    दाटिञ्चि य छ्चिन्नानन्दसुखाब्धि देल्चॆदॊ कदे श्री कालहस्तीश्वरा ॥ नी पञ्चं बडियुण्डगा गलिगिनन् भिक्षान्नमे
    चालु न् क्षेपं बब्बिन राजकीटमुल नेसेविम्प् जुट्टि त्रिप्पकुमु संसारार्धमै बण्टुगा जेपट्टं दय गल्गेनेनि
    मदिलो श्री कालहस्तीश्वरा ॥ नी पेरुन् भवदङ्घ्रितीर्धमु भवन्निष्ठ्यूत ताम्बूलमुन् नी पल्लॆम्बु प्रसादमुं
    गॊनिकदा ने बिड्डनैना ड न न्नीपाटिं गरुणिम्पु मो क नीनॆव्वारिकिं बिड्डगा दगदो श्री कालहस्तीश्वरा ॥
    अम्मा यय्य यटञ्चु नॆव्वरिनि नेनन्नन्शिवा दल्लिदण्ड्रुलनटञ्चु न्जूड डु नीवे काक संसारपुं जिम्मञ्जीकण्टि
    गप्पिन न्गडवु नन् श्री कालहस्तीश्वरा ॥ कॊडुकुल् पुट्ट रटञ्चु नेड्तु रविवेकुल् जीवनभ्रान्तुलै कॊडुकुल्
    पुट्टरॆ कौरवेन्द्रुन कनेकुल् वारिचे नेगतुल् वडसॆं बुत्रुलु लेनि या शुकुनकुन् बाटिल्लॆने दुर्गतुल्
    चॆडुने मोक्षपदं मपुत्रकुनकुन् श्री कालहस्तीश्वरा ॥ ग्रहदोषम्बुलु दुर्निमित्तमुलु नीकल्याणनामम्बु प्र
    त्यहमुं बेर्कॊनुत्तमोत्तमुल बाधम्बॆट्टगानोपुने दहनुं गप्पङ्गञ्जालुने शलभसन्तानम्बु नी सेव जे सि हतक्लेसुलु
    गारुगाक मनुजुल् श्री कालहस्तीश्वरा ॥ अडुगम्मोनिक नन्यमार्गरतुलम्ब्राणावनोत्साहिनै यडुगम्बोयिन मोदु
    नीदु पदपद्माराधकश्रेणियु न्नॆडकु न्निन्नु भजिम्पङ्गा गनियु नाकेला परापेक्ष को रॆडि दिङ्केमि भवत्प्रसादमॆ
    तगुन् श्री कालहस्तीश्वरा ॥ मदमातङ्गमु लन्दलम्बुल हरुल् माणिक्यमु ल्पल्लकुल् मुदितल् चित्रदुकूलमु ल्परिमलम्बु
    ल्मोक्षमी मदिलो वीनि नपेक्षसेसि नृपधामद्वारदेशम्बु गा चि दिनम्बुल् वृधपुत्तुरज्ञुलकटा श्री कालहस्तीश्वरा
    ॥ रोसी रोयदु कामिनीजनुल तारुण्योरुसौख्यम्बुलन् पासी पायरु पुत्रमित्रजन सम्पद्भ्रान्ति वाञ्छालतल् कोसी
    कोयदु नामनं बकट नीकुं ब्रीतिगा सत् क्रियल् चेसी चेयदु दीनि त्रुल्लणपवे श्री कालहस्तीश्वरा ॥ ऎन्नेल्लुन्दु
    नेमि गन्दु नि कनेनॆव्वारि रक्षिञ्चॆदन् निन्ने निष्ठ भजिञ्चॆद न्निरुपमोन्निद्रप्रमोदम्बु ना कॆन्नण्डब्बॆडु
    न्न्तकालमि क नेनिट्लुन्न नेमय्यॆडिं जिन्नम्बुच्चक नन्नु नेलुकॊलवे श्री कालहस्तीश्वरा ॥ चावं गालमु
    चेरुवौ टॆऱि गा लेक न न्नॆवैद्युण्डु चिकित्स डो येमन्दु रक्षिञ्चुनो ए वेल्पुल् कृप जूतुरो यनुचु निन्निन्तैन
    जेसिकॊन्न यतियुन् श्री कालहस्तीश्वरा ॥ दिनमुं जित्तमुलो सुवर्णमुखरी तीरप्रदेशाम्रका ननमध्योपल वेदिकाग्रमुन
    नानन्दम्बुनं बङ्कजा नननिष्थ न्नुनु गन्ननदिवो सौख्यम्बु लक्ष्मीविला सिनिमायानटनल् सुखम्बु लगुने श्री
    कालहस्तीश्वरा गट्टि दानिकि नवत्यश्रेणि गल्पिञ्चि त द्भालव्रातमु निच्चिपुच्चुटनु सम्बन्धम्बु गाविञ्चि
    या मालर्मम्बुन बान्धवं बनॆडि प्रेमं गॊन्दऱं द्रिप्प सीलन्सील यमर्चिन ट्लॊस गितो श्री कालहस्तीश्वरा
    ॥ तनुवे नित्यमुगा नॊनर्चु मदिलेदा चच्चि जन्मिम्पकुं ड नुपायम्बु घटिम्पु मागतुल रॆण्ट न्नेर्पु लेकुन्न
    ले दनि नाकिप्पुड चॆप्पु चेय गल कार्यम्बुन्न संसेव गाक कालमुननो श्री कालहस्तीश्वरा ॥ पदुनाल्गेलॆ महायुगम्बु
    लॊक भूपालुण्डु चॆल्लिञ्चॆ न य्युदयास्ताचलसन्धि नाज्ञ नॊक डायुष्मन्तुण्डै वीरिय भ्युदयं बॆव्वरु चॆप्प
    गा विनरॊ यल्पुल्मत्तुलै येल च च्चॆदरो राजुल मञ्चु नक्कटकटा ॥ राजन्नन्तनॆ पोवुना कृपयु धर्मम्बाभिजात्यम्बु
    वि द्याजातक्षम सत्यभाषणमु विद्वन्मित्रसंरक्षयुन् सौगन्यम्बु कृतम्बॆऱुङ्गटयु विश्वासम्बु गाकुन्न दु
    र्बीजश्रेष्थुलु गा गतम्बु गलदे श्री कालहस्तीश्वरा ॥ मुनु नीचे नपवर्गराज्यपदवी मूर्धाभिषेकम्बु गां
    चिन पुण्यात्मुलु नेनु नॊक्कसरिवो चिन्तिञ्चि चूडङ्ग नॆ ट्लनिनं गीटफणीन्द्रपोतमदवे दण्डोग्रहिंसाविचा
    रिनि गाङ्गा गाक मदिलो श्री कालहस्तीश्वरा ॥ पवमानाशनभूषणप्रकरमुन् भद्रेभचर्मम्बु ना प्रियम्बुलै भुगहशुण्डालातवीचारुलन्
    भवदुःखम्बुल दिम्बाटिञ्चि कैवल्यमि च्चि विनोदिञ्चुट केमि कारणमया श्री कालहस्तीश्वरा ॥ अमरस्त्रील रमिञ्चिनं
