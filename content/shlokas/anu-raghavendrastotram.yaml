id: anu-raghavendrastotram
category: stotram
name:
  english: anu raghavendrastotram
  devanagari: अणु राघवेन्द्रस्तोत्रम्
content:
  english: shri anu raghavendrastotram pujyaya raghavendraya satyadharmarataya ca | bhajatam kalpavrikshaya
    namatam kamadhenave || 1|| durvadidhvantaravaye vaishnavendivarendave | shriraghavendragurave namo'tyantadayalave
    || 2|| shrisudhindrabdhisambhutan raghavendrakalanidhin | seve sajjnanasaukhyartham santapatrayashantaye
    || 3||
  devanagari: श्री अणु राघवेन्द्रस्तोत्रम् पूज्याय राघवेन्द्राय सत्यधर्मरताय च । भजतां कल्पवृक्षाय नमतां
    कामधेनवे ॥ १॥ दुर्वादिध्वान्तरवये वैष्णवेन्दीवरेन्दवे । श्रीराघवेन्द्रगुरवे नमोऽत्यन्तदयालवे ॥ २॥
    श्रीसुधीन्द्राब्धिसम्भूतान् राघवेन्द्रकलानिधीन् । सेवे सज्ज्ञानसौख्यार्थं सन्तापत्रयशान्तये ॥ ३॥
meaning: {}
