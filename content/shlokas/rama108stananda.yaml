id: rama108stananda
category: stotram
name:
  english: rama108stananda
  devanagari: राम१०८स्तानन्द
content:
  english: rinu shishya mahabuddhe samyak prishtam tvaya mama | ashtottarashatam namnam raghavasya vadamyaham
    || 3|| sarveshvarah sarvamayah sarvabhutopakarakah | sarveshamukarartham yah sakaro nirakritih ||
    4|| sa bhavatyeva loke'smin samsarabhayanashanah | yada yada hi lokanam bhayamutpadyate tada || 5||
    avatiryakarocchriman dushtadaityavimarddanam | matsyakurmavarahadirupena paramarthadrik || 6|| tatkaleshu
    ca sarveshu sarveshamupakarakrit | sadhunam samacittanam bhaktanam bhaktavatsalah || 7|| upakartum
    nirakarah sadakarena jayate | ajo'yam jayate'nanto vishruto bhutabhavanah || 8|| tada tada'vatarati
    bhaktanamanukampaya | kshirabdhau devadevesho lakshminarayano vibhuh || 9|| asheshaih shankhacakrabhyam
    devairbrahmadibhih saha | shesho'bhullakshmano lakshmirjanaki shankhacakrake || 10|| jatau bharatashatrughnau
    devah sarve'pi vanarah | asan puraiva sarve'pi devanam bhayashantaye || 11|| tatra narayano devah
    shrirama iti vishrutah | sarvalokopakaraya bhumau svayamavatarat || 12|| dhyanamatrena devesho mahapatakanashakrit
    | kirtanashravanabhyam ca hatyakotinivaranah || 13|| kalau sa kirtanenaiva sarvapapam vyapohati |
    ramarameti rameti ye vadantyatipapinah || 14|| papakotisahasrebhyastanuddharati nanyatha | ashtottarashatam
    namnam tasya stotram vadamyaham || 15|| om asya shriramacandranamashtottarashatamantrasya brahma rishih
    | anushtup chandah | janakivallabhah shriramacandro devata || om bijam | namah shaktih | shriramacandrah
    kilakam | shriramacandraprityarthe jape viniyogah || shadanganyasah | om namo bhagavate rajadhirajaya
    paramatmane hridayaya namah | om namo bhagavate vidyadhirajaya hayagrivaya shirase svaha | om namo
    bhagavate janakivallabhaya shikhayai vashat | om namo bhagavate raghunandanayamitatejase kavacaya
    hum | om namo bhagavate kshirabdhimadhyasthaya narayanaya netratrayaya vaushat | om namo bhagavate
    satprakashaya ramaya astraya phat | iti digbandhah || angulinyasah | om namo bhagavate rajadhirajaya
    paramatmane angushthabhyam namah | om namo bhagavate vidyadhirajaya hayagrivaya tarjanibhyam namah
    | om namo bhagavate janakivallabhaya madhyamabhyam namah | om namo bhagavate raghunandanayamitatejase
    anamikabhyam namah | om namo bhagavate kshirabdhimadhyasthaya narayanaya kanishthikabhyam namah |
    om namo bhagavate satprakashaya ramaya karatalakaraprishthabhyam namah | atha dhyanam | mandarakritipunyadhamavilasadvakshasthalam
    komalam shantam kantamahendranilarucirabhasam sahasrananam | vande'ham raghunandanam surapatim kodandadikshagurum
    ramam sarvajagatsusevitapadam sitamanovallabham || 16|| atha stotram | om sahasrashirshne vai tubhyam
    sahasrakshaya te namah | namah sahasrahastaya sahasracaranaya ca || 17|| namo jimutavarnaya namaste
    vishvatomukha | acyutaya namastubhyam namaste sheshashayine || 18|| namo hiranyagarbhaya pancabhutatmane
    namah | namo mulaprakritaye devanam hitakarine || 19|| namaste sarvalokesha sarvaduhkhanishudana |
    shankhacakragadapadmajatamukutadharine || 20|| namo garbhaya tattvaya jyotisham jyotishe namah | om
    namo vasudevaya namo dasharathatmaja || 21|| namo namaste rajendra sarvasampatpradaya ca | namah karunyarupaya
    kaikeyipriyakarine || 22|| namo dantaya shantaya vishvamitrapriyaya te | yajneshaya namastubhyam namaste
    kratupalaka || 23|| namo namah keshavaya namo nathaya sharngine | namaste ramacandraya namo narayanaya
    ca || 24|| namaste ramacandraya madhavaya namo namah | govindraya namastubhyam namaste paramatmane
    || 25|| namaste vishnurupaya raghunathaya te namah | namaste'nathanathaya namaste madhusudana || 26||
    trivikrama namaste'stu sitayah pataye namah | vamanaya namastubhyam namaste raghavaya ca || 27|| namo
    namah shridharaya janakivallabhaya ca | namaste'stu hrishikesha kandarpaya namo namah || 28|| namaste
    padmanabhaya kausalyaharshakarine | namo rajivanetraya namaste lakshmanagraja || 29|| namo namaste
    kakutstha namo damodaraya ca | vibhishanaparitratarnamah sankarshanaya ca || 30|| vasudeva namaste'stu
    namaste shankarapriya | pradyumnaya namastubhyamaniruddhaya te namah || 31|| sadasadbhaktirupaya namaste
    purushottama | adhokshaja namaste'stu saptatalaharaya ca || 32|| kharadushanasamhartre shrinrisimhaya
    te namah | acyutaya namastubhyam namaste setubandhaka || 33|| janardana namaste'stu namo hanumadashraya
    | upendracandravandyaya maricamathanaya ca || 34|| namo balipraharana namah sugrivarajyada | jamadagnyamahadarpaharaya
    haraye namah || 35|| namo namaste krishnaya namaste bharatagraja | namaste pitribhaktaya namah shatrughnapurvaja
    || 36|| ayodhyadhipate tubhyam namah shatrughnasevita | namo nityaya satyaya buddhyadijnanarupine
    || 37|| advaitabrahmarupaya jnanagamyaya te namah | namah purnaya ramyaya madhavaya cidatmane || 38||
    ayodhyeshaya shreshthaya cinmatraya paratmane | namo'halyoddharanaya namaste capabhanjine || 39||
    sitaramaya sevyaya stutyaya parameshthine | namaste banahastaya namah kodandadharine || 40|| namah
    kabandhahantre ca valihantre namo'stu te | namaste'stu dashagrivapranasamharakarine || 41|| 108 ashtottarashatam
    namnam ramacandrasya pavanam etatproktam maya shreshtha sarvapatakanashanam || 42|| pracarishyati
    talloke pranyadrishtavashaddvija | tasya kirtanamatrena jana yasyanti sadgatim || 43|| tavadvijrimbhate
    papam brahmahatyapurahsaram| yavannamashtakashatam purusho na hi kirtayet || 44|| tavatkalermahotsaho
    nihshankam sampravartate | yavacchriramacandrasya shatanamnam na kirtanam || 46|| tavatsvarupam ramasya
    durbodham praninam sphutam | yavanna nishthaya ramanamamahatmyamuttamam || 47|| kirtitam pathitam
    citte dhritam samsmaritam muda | anyatah sha
  devanagari: ृणु शिष्य महाबुद्धे सम्यक् पृष्टं त्वया मम । अष्टोत्तरशतं नाम्नां राघवस्य वदाम्यहम् ॥ ३॥
    सर्वेश्वरः सर्वमयः सर्वभूतोपकारकः । सर्वेषामुकारार्थं यः साकारो निराकृतिः ॥ ४॥ स भवत्येव लोकेऽस्मिन्
    संसारभयनाशनः । यदा यदा हि लोकानां भयमुत्पद्यते तदा ॥ ५॥ अवतीर्याकरोच्छ्रीमान् दुष्टदैत्यविमर्द्दनम्
    । मत्स्यकूर्मवराहादिरूपेण परमार्थदृक् ॥ ६॥ तत्कालेषु च सर्वेषु सर्वेषामुपकारकृत् । साधूनां समचित्तानां
    भक्तानां भक्तवत्सलः ॥ ७॥ उपकर्तुं निराकारः सदाकारेण जायते । अजोऽयं जायतेऽनन्तो विश्रुतो भूतभावनः ॥
    ८॥ तदा तदाऽवतरति भक्तानामनुकम्पया । क्षीराब्धौ देवदेवेशो लक्ष्मीनारायणो विभुः ॥ ९॥ आशेषैः शङ्खचक्राभ्यां
    देवैर्ब्रह्मादिभिः सह । शेषोऽभूल्लक्ष्मणो लक्ष्मीर्जानकी शङ्खचक्रके ॥ १०॥ जातौ भरतशत्रुघ्नौ देवाः
    सर्वेऽपि वानराः । आसन् पुरैव सर्वेऽपि देवानां भयशान्तये ॥ ११॥ तत्र नारायणो देवः श्रीराम इति विश्रुतः
    । सर्वलोकोपकाराय भूमौ स्वयमवातरत् ॥ १२॥ ध्यानमात्रेण देवेशो महापातकनाशकृत् । कीर्तनश्रवणाभ्यां च हत्याकोटिनिवारणः
    ॥ १३॥ कलौ स कीर्तनेनैव सर्वपापं व्यपोहति । रामरामेति रामेति ये वदन्त्यतिपापिनः ॥ १४॥ पापकोटिसहस्रेभ्यस्तानुद्धरति
    नान्यथा । अष्टोत्तरशतं नाम्नां तस्य स्तोत्रं वदाम्यहम् ॥ १५॥ ॐ अस्य श्रीरामचन्द्रनामाष्टोत्तरशतमन्त्रस्य
    ब्रह्मा ऋषिः । अनुष्टुप् छन्दः । जानकीवल्लभः श्रीरामचन्द्रो देवता ॥ ॐ बीजम् । नमः शक्तिः । श्रीरामचन्द्रः
    कीलकम् । श्रीरामचन्द्रप्रीत्यर्थे जपे विनियोगः ॥ षडङ्गन्यासः । ॐ नमो भगवते राजाधिराजाय परमात्मने हृदयाय
    नमः । ॐ नमो भगवते विद्याधिराजाय हयग्रीवाय शिरसे स्वाहा । ॐ नमो भगवते जानकीवल्लभाय शिखायै वषट् । ॐ
    नमो भगवते रघुनन्दनायामिततेजसे कवचाय हुम् । ॐ नमो भगवते क्षीराब्धिमध्यस्थाय नारायणाय नेत्रत्रयाय वौषट्
    । ॐ नमो भगवते सत्प्रकाशाय रामाय अस्त्राय फट् । इति दिग्बन्धः ॥ अङ्गुलीन्यासः । ॐ नमो भगवते राजाधिराजाय
    परमात्मने अङ्गुष्ठाभ्यां नमः । ॐ नमो भगवते विद्याधिराजाय हयग्रीवाय तर्जनीभ्यां नमः । ॐ नमो भगवते जानकीवल्लभाय
    मध्यमाभ्यां नमः । ॐ नमो भगवते रघुनन्दनायामिततेजसे अनामिकाभ्यां नमः । ॐ नमो भगवते क्षीराब्धिमध्यस्थाय
    नारायणाय कनिष्ठिकाभ्यां नमः । ॐ नमो भगवते सत्प्रकाशाय रामाय करतलकरपृष्ठाभ्यां नमः । अथ ध्यानम् । मन्दाराकृतिपुण्यधामविलसद्वक्षस्थलं
    कोमलं शान्तं कान्तमहेन्द्रनीलरुचिराभासं सहस्राननम् । वन्देऽहं रघुनन्दनं सुरपतिं कोदण्डदीक्षागुरुं
    रामं सर्वजगत्सुसेवितपदं सीतामनोवल्लभम् ॥ १६॥ अथ स्तोत्रम् । ॐ सहस्रशीर्ष्णे वै तुभ्यं सहस्राक्षाय
    ते नमः । नमः सहस्रहस्ताय सहस्रचरणाय च ॥ १७॥ नमो जीमूतवर्णाय नमस्ते विश्वतोमुख । अच्युताय नमस्तुभ्यं
    नमस्ते शेषशायिने ॥ १८॥ नमो हिरण्यगर्भाय पञ्चभूतात्मने नमः । नमो मूलप्रकृतये देवानां हितकारिणे ॥ १९॥
    नमस्ते सर्वलोकेश सर्वदुःखनिषूदन । शङ्खचक्रगदापद्मजटामुकुटधारिणे ॥ २०॥ नमो गर्भाय तत्त्वाय ज्योतिषां
    ज्योतिषे नमः । ॐ नमो वासुदेवाय नमो दशरथात्मज ॥ २१॥ नमो नमस्ते राजेन्द्र सर्वसम्पत्प्रदाय च । नमः कारुण्यरूपाय
    कैकेयीप्रियकारिणे ॥ २२॥ नमो दन्ताय शान्ताय विश्वामित्रप्रियाय ते । यज्ञेशाय नमस्तुभ्यं नमस्ते क्रतुपालक
    ॥ २३॥ नमो नमः केशवाय नमो नाथाय शर्ङ्गिणे । नमस्ते रामचन्द्राय नमो नारायणाय च ॥ २४॥ नमस्ते रामचन्द्राय
    माधवाय नमो नमः । गोविन्द्राय नमस्तुभ्यं नमस्ते परमात्मने ॥ २५॥ नमस्ते विष्णुरूपाय रघुनाथाय ते नमः
    । नमस्तेऽनाथनाथाय नमस्ते मधुसूदन ॥ २६॥ त्रिविक्रम नमस्तेऽस्तु सीतायाः पतये नमः । वामनाय नमस्तुभ्यं
    नमस्ते राघवाय च ॥ २७॥ नमो नमः श्रीधराय जानकीवल्लभाय च । नमस्तेऽस्तु हृषीकेश कन्दर्पाय नमो नमः ॥ २८॥
    नमस्ते पद्मनाभाय कौसल्याहर्षकारिणे । नमो राजीवनेत्राय नमस्ते लक्ष्मणाग्रज ॥ २९॥ नमो नमस्ते काकुत्स्थ
    नमो दामोदराय च । विभीषणपरित्रातर्नमः सङ्कर्षणाय च ॥ ३०॥ वासुदेव नमस्तेऽस्तु नमस्ते शङ्करप्रिय । प्रद्युम्नाय
    नमस्तुभ्यमनिरुद्धाय ते नमः ॥ ३१॥ सदसद्भक्तिरूपाय नमस्ते पुरुषोत्तम । अधोक्षज नमस्तेऽस्तु सप्ततालहराय
    च ॥ ३२॥ खरदूषणसंहर्त्रे श्रीनृसिम्हाय ते नमः । अच्युताय नमस्तुभ्यं नमस्ते सेतुबन्धक ॥ ३३॥ जनार्दन
    नमस्तेऽस्तु नमो हनुमदाश्रय । उपेन्द्रचन्द्रवन्द्याय मारीचमथनाय च ॥ ३४॥ नमो बालिप्रहरण नमः सुग्रीवराज्यद
    । जामदग्न्यमहादर्पहराय हरये नमः ॥ ३५॥ नमो नमस्ते कृष्णाय नमस्ते भरताग्रज । नमस्ते पितृभक्ताय नमः शत्रुघ्नपूर्वज
    ॥ ३६॥ अयोध्याधिपते तुभ्यं नमः शत्रुघ्नसेवित । नमो नित्याय सत्याय बुद्ध्यादिज्ञानरूपिणे ॥ ३७॥ अद्वैतब्रह्मरूपाय
    ज्ञानगम्याय ते नमः । नमः पूर्णाय रम्याय माधवाय चिदात्मने ॥ ३८॥ अयोध्येशाय श्रेष्ठाय चिन्मात्राय परात्मने
    । नमोऽहल्योद्धारणाय नमस्ते चापभञ्जिने ॥ ३९॥ सीतारामाय सेव्याय स्तुत्याय परमेष्ठिने । नमस्ते बाणहस्ताय
    नमः कोदण्डधारिणे ॥ ४०॥ नमः कबन्धहन्त्रे च वालिहन्त्रे नमोऽस्तु ते । नमस्तेऽस्तु दशग्रीवप्राणसंहारकारिणे
    ॥ ४१॥ १०८ अष्टोत्तरशतं नाम्नां रमचन्द्रस्य पावनम् एतत्प्रोक्तं मया श्रेष्ठ सर्वपातकनाशनम् ॥ ४२॥ प्रचरिष्यति
    तल्लोके प्राण्यदृष्टवशाद्द्विज । तस्य कीर्तनमात्रेण जना यास्यन्ति सद्गतिम् ॥ ४३॥ तावद्विजृम्भते पापं
    ब्रह्महत्यापुरःसरम्। यावन्नामाष्टकशतं पुरुषो न हि कीर्तयेत् ॥ ४४॥ तावत्कलेर्महोत्साहो निःशङ्कं सम्प्रवर्तते
    । यावच्छ्रीरामचन्द्रस्य शतनाम्नां न कीर्तनम् ॥ ४६॥ तावत्स्वरूपं रामस्य दुर्बोधं प्राणिनां स्फुटम्
    । यावन्न निष्ठया रामनाममाहात्म्यमुत्तमम् ॥ ४७॥ कीर्तितं पठितं चित्ते धृतं संस्मारितं मुदा । अन्यतः
    श
