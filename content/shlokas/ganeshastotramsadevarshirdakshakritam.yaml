id: ganeshastotramsadevarshirdakshakritam
category: stotram
name:
  english: ganeshastotramsadevarshirdakshakritam
  devanagari: गणेशस्तोत्रम्सदेवर्षिर्दक्षकृतं
content:
  english: sadevarshirdakshakritam shriganeshastotram || shriganeshaya namah || sadevarshirdaksha uvaca
    | namaste ganeshaya sarvatmane te sada bhaktimohena mohatmakaya | maheshadidevaih shukadyaih stutaya
    hyayogaya samyogadharinnamaste || 26|| gajananaya vai tubhyam namah parashupanaye | gadadharaya shankham
    vai dharine te namo namah || 27|| vighneshaya pareshaya mahavighnavidarine | anathaya sanathaya herambaya
    namo namah || 28|| namo namaste'stu mahodaraya svabhaktasamrakshanatatparaya | abhaktakaman vinihantrikaya
    sada sushantiprada te namo vai || 29|| brahmeshaya namastubhyam sada svanandavasine | siddhibuddhivarayaiva
    mushakadhvajine namah || 30|| daityamastakadharaya ditiputraya te namah | kanthadho devakayaya namo
    surasuraya te || 31|| yogaya sarvatmakasarvapujya mayavinam mohakaraya tubhyam | mayapracalaya susiddhidaya
    dharmasthapalaya tu shulapane || 32|| anantalilaya natha svayam khelasi mayaya | tatra kim varnayamyeva'to
    bravimi namo namah || 33|| sada yogasvarupaya bhaktibhavapradaya te | bhaktipriyaya purnaya bhaktavatsala
    te namah || 34|| prasida pahi vighnesha dasam te bhaktilalasam | mam mudgalasya shishyam vai bhaktarajasya
    manada || 35|| evamuktva ganeshanam prananama prajapatih | anu tam devavipradyah pranemustam paratparam
    || 36|| tamutthapya ganadhisho jagada vaca uttamam | daksham mudgalamalokya svabhaktam bhaktapalakah
    || 37||
  devanagari: सदेवर्षिर्दक्षकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ सदेवर्षिर्दक्ष उवाच । नमस्ते गणेशाय
    सर्वात्मने ते सदा भक्तिमोहेन मोहात्मकाय । महेशादिदेवैः शुकाद्यैः स्तुताय ह्ययोगाय संयोगधारिन्नमस्ते
    ॥ २६॥ गजाननाय वै तुभ्यं नमः परशुपाणये । गदाधराय शङ्खं वै धारिणे ते नमो नमः ॥ २७॥ विघ्नेशाय परेशाय
    महाविघ्नविदारिणे । अनाथाय सनाथाय हेरम्बाय नमो नमः ॥ २८॥ नमो नमस्तेऽस्तु महोदराय स्वभक्तसंरक्षणतत्पराय
    । अभक्तकामान् विनिहन्तृकाय सदा सुशान्तिप्रद ते नमो वै ॥ २९॥ ब्रह्मेशाय नमस्तुभ्यं सदा स्वानन्दवासिने
    । सिद्धिबुद्धिवरायैव मूषकध्वजिने नमः ॥ ३०॥ दैत्यमस्तकधाराय दितिपुत्राय ते नमः । कण्ठाधो देवकायाय नमो
    सुरसुराय ते ॥ ३१॥ योगाय सर्वात्मकसर्वपूज्य मायाविनां मोहकराय तुभ्यम् । मायाप्रचालाय सुसिद्धिदाय धर्मस्थपालाय
    तु शूलपाणे ॥ ३२॥ अनन्तलीलया नाथ स्वयं खेलसि मायया । तत्र किं वर्णयाम्येवाऽतो ब्रवीमि नमो नमः ॥ ३३॥
    सदा योगस्वरूपाय भक्तिभावप्रदाय ते । भक्तिप्रियाय पूर्णाय भक्तवत्सल ते नमः ॥ ३४॥ प्रसीद पाहि विघ्नेश
    दासं ते भक्तिलालसम् । मां मुद्गलस्य शिष्यं वै भक्तराजस्य मानद ॥ ३५॥ एवमुक्त्वा गणेशानं प्रणनाम प्रजापतिः
    । अनु तं देवविप्राद्याः प्रणेमुस्तं परात्परम् ॥ ३६॥ तमुत्थाप्य गणाधीशो जगाद वच उत्तमम् । दक्षं मुद्गलमालोक्य
    स्वभक्तं भक्तपालकः ॥ ३७॥
