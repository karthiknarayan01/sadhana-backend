id: dhati-panchakam
category: stotram
name:
  english: Dhati Panchakam
content:
  english: paduke yatirajasya kathayanti yadakhyaya | tasya dasharatheh padau shirasa dharayamyaham ||
    pashandadrumashandadavadahanashcarvakashailashanih bauddhadhvantanirasavasarapatirjainebhakanthiravah
    | mayavadi bhujangabhangagarudastraividya cudamanih shrirangeshajayadhvajo vijayate ramanujo'yam munih
    || || pashanda shandagirikhandanavajradandah pracchannabauddhamakaralayamanthadandah | vedantasarasukhadarshanadipadandah
    ramanujasya vilasantimunestridandah || || caritroddharadandam caturanayapathalankriyaketudandam sadvidyadipadandam
    sakalakalikathasamhriteh kaladandam | trayyantalambadandam tribhuvanavijayacchatrasauvarnadandam dhatteramanujaryah
    pratikathakashiro vajradandam tridandam || || trayya mangalyasutram trithayugapayuga rohanalambasutram
    sadvidyadipasutram sagunanayavidam sambadamharasutram | prajnasutram budhanam prashamadhanamanah padmininalasutram
    rakshasutram muninam jayati yatipatervakshasi brahmasutram || || pashandasagaramahabadabamukhagnih
    shrirangarajacaranambujamuladasah | shrivishnulokamani mandapamargadayi ramanujo vijayate yatirajarajah
    ||
  devanagari: पादुके यतिराजस्य कथयन्ति यदाख्यया । तस्य दाशरथेः पादौ शिरसा धारयाम्यहम् ॥ पाषण्डद्रुमषण्डदावदहनश्चार्वाकशैलाशनिः
    बौद्धध्वान्तनिरासवासरपतिर्जैनेभकण्ठीरवः । मायावादि भुजङ्गभङ्गगरुडस्त्रैविद्य चूडामणिः श्रीरङ्गेशजयध्वजो
    विजयते रामानुजोऽयं मुनिः ॥ ॥ पाषण्ड षण्डगिरिखण्डनवज्रदण्डाः प्रच्छन्नबौद्धमकरालयमन्थदण्डाः । वेदान्तसारसुखदर्शनदीपदण्डाः
    रामानुजस्य विलसन्तिमुनेस्त्रिदण्डाः ॥ ॥ चारित्रोद्धारदण्डं चतुरनयपथालङ्क्रियाकेतुदण्डं सद्विद्यादीपदण्डं
    सकलकलिकथासंहृतेः कालदण्डम् । त्रय्यन्तालम्बदण्डं त्रिभुवनविजयच्छत्रसौवर्णदण्डम् धत्तेरामानुजार्यः
    प्रतिकथकशिरो वज्रदण्डं त्रिदण्डम् ॥ ॥ त्रय्या माङ्गल्यसूत्रं त्रिथायुगपयुग रोहणालम्बसूत्रं सद्विद्यादीपसूत्रं
    सगुणनयविदां सम्बदांहारसूत्रम् । प्रज्ञासूत्रं बुधानां प्रशमधनमनः पद्मिनीनालसूत्रं रक्षासूत्रं मुनीनां
    जयति यतिपतेर्वक्षसि ब्रह्मसूत्रम् ॥ ॥ पाषण्डसागरमहाबडबामुखाग्निः श्रीरङ्गराजचरणाम्बुजमूलदासः । श्रीविष्णुलोकमणि
    मण्डपमार्गदायी रामानुजो विजयते यतिराजराजः ॥
