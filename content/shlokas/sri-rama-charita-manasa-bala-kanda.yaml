    jala chae || cale jaha~ dasarathu janavase| manahu~ sarobara takeu piase || do bhupa biloke jabahim
    muni avata sutanha sameta| uthe harashi sukhasindhu mahu~ cale thaha si leta || || munihi dandavata
    kinha mahisa| bara bara pada raja dhari sisa || kausika rau liye ura lai| kahi asisa puchi kusalai
    || puni dandavata karata dau bhai| dekhi nripati ura sukhu na samai || suta hiya~ lai dusaha dukha
    mete| mritaka sarira prana janu bhente || puni basishtha pada sira tinha nae| prema mudita munibara
    ura lae || bipra brinda bande duhu~ bhaim| mana bhavati asisem paim || bharata sahanuja kinha pranama|
    lie uthai lai ura rama || harashe lakhana dekhi dau bhrata| mile prema paripurita gata || do purajana
    parijana jatijana jacaka mantri mita| mile jathabidhi sabahi prabhu parama kripala binita || || ramahi
    dekhi barata juraani| priti ki riti na jati bakhani || nripa samipa sohahim suta cari| janu dhana
    dharamadika tanudhari || sutanha sameta dasarathahi dekhi| mudita nagara nara nari biseshi || sumana
    barisi sura hanahim nisana| nakanatim nacahim kari gana || satananda aru bipra saciva gana| magadha
    suta bidusha bandijana || sahita barata rau sanamana| ayasu magi phire agavana || prathama barata
    lagana tem ai| tatem pura pramodu adhikai || brahmanandu loga saba lahahim| barhahu~ divasa nisi bidhi
    sana kahahim || do ramu siya sobha avadhi sukrita avadhi dau raja| jaha~ jaha~ purajana kahahim asa
    mili nara nari samaja || | || janaka sukrita murati baidehi| dasaratha sukrita ramu dharem dehi ||
    inha sama ka~hu na siva avaradhe| kahi~ na inha samana phala ladhe || inha sama kau na bhayu jaga
    mahim| hai nahim katahu~ honeu nahim || hama saba sakala sukrita kai rasi| bhe jaga janami janakapura
    basi || jinha janaki rama chabi dekhi| ko sukriti hama sarisa biseshi || puni dekhaba raghubira biahu|
    leba bhali bidhi locana lahu || kahahim parasapara kokilabayanim| ehi biaha~ bara labhu sunayanim
    || baraem bhaga bidhi bata banai| nayana atithi hoihahim dau bhai || do barahim bara saneha basa janaka
    bolauba siya| lena aihahim bandhu dau koti kama kamaniya || || bibidha bha~ti hoihi pahunai| priya
    na kahi asa sasura mai || taba taba rama lakhanahi nihari| hoihahim saba pura loga sukhari || sakhi
    jasa rama lakhanakara jota| taisei bhupa sanga dui dhota || syama gaura saba anga suhae| te saba kahahim
    dekhi je ae || kaha eka maim aju nihare| janu biranci nija hatha sa~vare || bharatu ramahi ki anuhari|
    sahasa lakhi na sakahim nara nari || lakhanu satrusudanu ekarupa| nakha sikha te saba anga anupa ||
    mana bhavahim mukha barani na jahim| upama kahu~ tribhuvana kau nahim || cham upama na kau kaha dasa
    tulasi katahu~ kabi kobida kahaim| bala binaya bidya sila sobha sindhu inha se ei ahaim || pura nari
    sakala pasari ancala bidhihi bacana sunavahim || byahiahu~ cariu bhai ehim pura hama sumangala gavahim
    || so kahahim paraspara nari bari bilocana pulaka tana| sakhi sabu karaba purari punya payonidhi bhupa
    dau || || ehi bidhi sakala manoratha karahim| ana~da umagi umagi ura bharahim || je nripa siya svayambara
    ae| dekhi bandhu saba tinha sukha pae || kahata rama jasu bisada bisala| nija nija bhavana ge mahipala
    || ge biti kucha dina ehi bha~ti| pramudita purajana sakala barati || mangala mula lagana dinu ava|
    hima ritu agahanu masu suhava || graha tithi nakhatu jogu bara baru| lagana sodhi bidhi kinha bicaru
    || pathai dinhi narada sana soi| gani janaka ke ganakanha joi || suni sakala loganha yaha bata| kahahim
    jotishi ahim bidhata || do dhenudhuri bela bimala sakala sumangala mula| bipranha kaheu bideha sana
    jani saguna anukula || || uparohitahi kaheu naranaha| aba bilamba kara karanu kaha || satananda taba
    saciva bolae| mangala sakala saji saba lyae || sankha nisana panava bahu baje| mangala kalasa saguna
    subha saje || subhaga suasini gavahim gita| karahim beda dhuni bipra punita || lena cale sadara ehi
    bha~ti| ge jaha~ janavasa barati || kosalapati kara dekhi samaju| ati laghu laga tinhahi suraraju
    || bhayu samu aba dharia p | yaha suni para nisanahim gh || gurahi puchi kari kula bidhi raja| cale
    sanga muni sadhu samaja || do bhagya bibhava avadhesa kara dekhi deva brahmadi| lage sarahana sahasa
    mukha jani janama nija badi || || suranha sumangala avasaru jana| barashahim sumana bajai nisana ||
    siva brahmadika bibudha barutha| carhae bimananhi nana jutha || prema pulaka tana hridaya~ uchahu|
    cale bilokana rama biahu || dekhi janakapuru sura anurage| nija nija loka sabahim laghu lage || citavahim
