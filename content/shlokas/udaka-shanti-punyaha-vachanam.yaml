id: udaka-shanti-punyaha-vachanam
category: stotram
name:
  english: Udaka Shanti (Punyaha Vachanam)
  devanagari: उदकशान्ति-मन्त्राः
content:
  english: krinushva pajah prasitim na prithvim yahi rajevamava ibhena| trishvimanu prasitim drunano'stasi
    vidhya rakshasastapishthaih| tava bhramasa ashuya patantyanu sprisha dhrishata shoshucanah| tapu shyagne
    juhva patanganasandito vi srija vishvagulkah| prati spasho vi srija turnitamo bhava payurvisho asya
    adabdhah| yo no dure aghasha so yo antyagne makishte vyathira dadharshit||1|| udagne tishtha pratya''tanushva
    nyamitra oshatattigmahete| yo no arati samidhana cakre nica tam dhakshyatasam na shushkam | urdhvo
    bhava prati vidhyadhyasmadavishkrinushva daivya nyagne| ava sthira tanuhi yatujunam jamimajamim pra
    mrinihi shatrun| sa te janati sumatim yavishtha ya ivate brahmane gatumairat||2|| vishva nyasmai sudinani
    rayo dyumnanyaryo vi duro abhi dyau t| sedagne astu subhagah sudanuryastva nityena havisha ya ukthaih|
    piprishati sva ayushi durone vishvedasmai sudina sa'sadishtih| arcami te sumatim ghoshyarvakhsam te
    vavata jaratamiyangih||3|| svashva stva suratha marjayemasme kshatrani dharayeranu dyun| iha tva bhurya
    caredupa tmandosha samanu dyun| kridantastva sumanasah sapemabhi dyumna tasthiva so jananam| yastva
    svashvah suhiranyo agna upayati vasumata rathena| tasya trata bhavasi tasya sakha yasta atithyamanushagjujoshat|
    maho rujami bandhuta vacobhistanma piturgotamadanviyaya||4|| tvam no asya vacasashcikiddhi hotaryavishtha
    sukrato damunah| asvapnajastaranayah susheva atandraso'vrika ashramishthah| te payavah sadhriyanco
    nishadya'gne tava nah pantvamura| ye payavo mamateyam te agne pashyanto andham duritadarakshan| raraksha
    tanthsukrito vishvaveda diphsanta idripavo na ha debhuh||5|| tvaya vaya sadhanyastvotastava prani
    tyashyama vajan| ubha sha sa sudaya satyatate'nushthuya krinuhyahrayana| aya te agne samidha vidhema
    prati stoma shasyamanam gribhaya| daha'shaso rakshasah pahyasmandruho nido'mitramaho avadyat| rakshohanam
    vajinama''jigharmi mitram prathishthamupa yami sharma| shishano agnih kratubhih samiddhah sa no diva
    sa rishah patu naktam ||6|| vi jyotisha brihata bha tyagniravirvishvani krinute mahitva| pradevirmayah
    sahate durevah shishite shringe rakshase vinikshe | uta svanaso divishantvagnestigmayudha rakshase
    hantava u| made cidasya prarujanti bhama na varante paribadho adevih||7|| indram vo vishvataspari
    havamahe jane bhyah| asmakamastu kevalah| indram naro nemadhita havante yatparya yunajate dhiyastah|
    shuro nrishata shavasashcakana a gomati vraje bhaja tvam nah| indriyani shatakrato ya te janeshu pancasu|
    indra tani ta a vrine| anu te dayi maha indriyaya satra te vishvamanu vritrahatye | anu kshatramanu
    saho yajatrendra devebhiranu te nrishahye nthsapta vasavastishthanti svaruho yatha| rishir ha dirghashruttama
    indrasya gharmo atithih| amasu pakvamairaya a surya rohayo divi| gharmam na samantapata suvriktibhirjushtam
    girvanase girah| indramidgathino brihadindramarkebhirarkinah| indram vaniranushata| gayanti tva gayatrino'rcantyarkamarkinah||9||
    brahmanastva shatakratavudva homuce pra bharema manishamoshishthadavanne sumatim grinanah| idamindra
    prati havyam gribhaya satyah santu yajamanasya kamah | vivesha yanma dhishana jajana stavai pura paryadindramahnah|
    a haso yatra piparadyatha no naveva yantamubhaye havante| pra samrajam prathamamadhvaranama homucam
    vrishabham yajniyanam||10|| apam napatamashvina hayantamasminnara indriyam dhattamojah| vi na indra
    mridho jahi nica yaccha pritanyatah| adhaspadam tamim abhidasati| indra kshatramabhi vamamojo'jayatha
    vrishabha car shaninam| apa'nudo janamamitrayantamurum devebhyo akrinoru lokam| mrigo na bhimah kucaro
    girishthah paravata a jagama parasyah||11|| srika shaya pavimindra tigmam vi shatru n tadhi vi mridho
    nudasva| vi shatrun vi mridho nuda vi vritrasya hanu ruja| vi manyumindra bhamito'mitrasyabhidasatah|
    trataramindramavitaramindra | huve nu shakram puruhutamindra svasti no maghava dhatvindrah| ma te
    asya sahasavan parishtavadhaya bhuma harivah paradai||12|| trayasva no'vrikebhirvaruthaistava priyasah
    surishu syama| anavaste rathamashvaya takshan tvashta vajram puruhuta dyumantam | brahmana indram
    mahayanto arkairavardhayannahaye hantava u| vrishne yatte vrishano arkamarcanindra gravano aditih
    sajoshah | anashvaso ye pavayo'ratha indreshita abhyavartanta dasyun||17|| yata indra bhayamahe tato
    no abhayam kridhi| maghavanchagdhi tava tanna utaye vidvisho vimridho jahi| svastida vishaspatirvritraha
    vimridho vashi| vrishendrah pura etu nah svastida abhayankarah| maha indro vajrabahuh shodashi sharma
    yacchatu| svasti no maghava karotu hantu papmanam yo dveshti| sajosha indra sagano marudbhih somam
    piba vritrahanchura vidvan rapamridhonudasvathabhayam krinu hi vishvato nah||18|| ye devah purah sado'gni
    ne tra rakshohanaste nah pantu te no'vantu tebhyo namastebhyah svaha ye deva dakshinasado yamane tra
    rakshohanaste nah pantu te no'vantu tebhyo namastebhyah svaha ye devah pashcat sadah savitri ne tra
    rakshohanaste nah pantu te no'vantu tebhyo namastebhyah svaha ye deva uttarasado varunanetra rakshohanaste
    nah pantu te no'vantu tebhyo namastebhyah svaha ye deva uparishado brihaspatinetra rakshohanaste nah
    pantu te no'vantu tebhyo namastebhyah svaha'gnaye rakshoghne svaha yamaya rakshoghne svaha savitre
    rakshoghne svaha varunaya rakshoghne svaha brihaspataye duvaspate rakshoghne svaha ||19|| agnirayushmanthsa
    vanaspatibhirayushmantena tva''yusha ''yushmantam karomi soma ayushmanthsa oshadhibhirayushmantena
    tva''yusha ''yushmantam karomi yajna ayushmanthsa dakshinabhirayushmantena tva''yusha ''yushmantam
    karomi brahmayushmattad bra hmanairayushmattena tva''yusha ''yushmantam karomi deva ayushmantaste'mritenayushmantastena
    tva ''yusha''yushmantam karomi||20|| ya vamindra varuna yatavya tanustayemama ya vamindra varuna sahasya
    tanustayemama ya vamindra varuna rakshasya tanustayemama ya vamindra varuna tejasya tanustayemama
    haso muncatam||21|| yo vamindra varunavagnau sramastam vametenava yaje yo vamindra varuna dvipathsu
    pashushu sramastam vametenava yaje yo vamindra varuna catushpathsu sramastam vametenava yaje yo vamindra
    varuna goshthe sramastam vametenava yaje yo vamindra varuna griheshu sramastam vametenava yaje yo
    vamindra varunaphsu sramastam vametenava yaje yo vamindra varunaushadhishu sramastam vametenava yaje
    yo vamindra varuna vanaspatishu sramastam vametenava yaje||22|| agne yashasvin yashase mamarpayendravatimapacitimihavaha|
    ayam murdha parameshthi suvarcah samananamuttamashloko astu|| bhadram pashyanta upaseduragre tapo
    dikshamrishayah suvarvidah| tatah kshatram balamojashca jatam tadasmai deva abhi sannamantu|| dhata
    vidhata paramotasandhrik prajapatih parameshthi viraja si nividoma ahuretasmai rashtramabhisannamama||
    abhyavartadhvamupametasaka maya shasta'dhipatirvo astu| asya vijnanamanusa rabhadhvamimam pashcadanu
    jivatha sarve ritashadritadhamagnirgandharvastasyaushadhayo'phsarasa urjo nama sa idam brahmakshatram
    patu ta idam brahmakshatram pa ntu tasmai svaha tabhyah svaha hito vishvasama suryo gandharvastasya
    maricayo'phsarasa ayuvo nama sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha
    tabhyah svaha sushumnah suryarashmishcandrama gandharvastasya nakshatranya'phsaraso bekurayo nama
    sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha tabhyah svaha bhujyuh suuparno
    yajno gandharvastasya dakshina aphsarasastava nama sa idam brahmakshatram patu ta idam brahmakshatram
    pa ntu tasmai svaha tabhyah svaha prajapatirvishvakarma mano gandharvastasyarkhsamanyaphsaraso vahnayo
    nama sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha tabhyah svaheshiro vishvavyaca
    vato gandharvastasyapo 'phsaraso muda nama sa idam brahmakshatram patu ta idam brahmakshatram pa ntu
    tasmai svaha tabhyah svaha | bhuvanasya pate yasya ta upari griha iha ca| sa no rasvajyani | parameshthyadhipatirmrityurgandharvastasya
    vishvamaphsaraso bhuvo nama sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha
    tabhyah svaha sukshitih suubhutirbhadrakrithsuvarvanparjanyo gandharvastasya vidyuto 'phsaraso ruco
    nama sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha tabhyah svaha dure hetiramridayo
    mrityurgandharvastasya praja aphsaraso bhiruvo nama sa idam brahmakshatram patu ta idam brahmakshatram
    pa ntu tasmai svaha tabhyah svaha caruh kripanakashi kamo gandharvastasyadhayo 'phsarasah shocayantirnama
    sa idam brahmakshatram patu ta idam brahmakshatram pa ntu tasmai svaha tabhyah svaha sa no bhuvanasya
    pate yasya ta upari griha iha ca| uru brahmane'smai kshatraya mahi sharma yaccha namo astu sarpebhyo
    ye ke ca prithivimanu| ye antarikshe ye divi tebhyah sarpebhyo namah|| ye'do rocane divo ye va suryasya
    rashmishu| yeshamaphsu sadah kritam tebhyah sarpebhyo namah|| ya ishavo yatudhananam ye va vanaspati
    ranu| ye va'vateshu sherate tebhyah sarpebhyo namah|| ayam puro harikeshah suryarashmistasya rathagrithsashca
    rathaujashca senanigramanyau punjikasthala ca kritasthala ca phsarasau yatudhana heti raksha si prahetistebhyo
    namaste no mridayantu te yam dvishmo yashca no dveshti tam vo jambhe dadhami| ayam dakshina vishvakarma
    tasya rathasvanashca rathe citrashca senanigramanyau menaka ca sahajanya ca phsarasau dankshnavah
    pashavo hetih paurusheyovadhah prahetistebhyo namaste no mridayantu te yam dvishmo yashca no dveshti
    tam vo jambhe dadhami| ayam pashcadvishvavyacastasya rathaprotashcasamarathashca senanigramanyau pramlocanti
    canumlocanti caphsarasau sarpa hetirvyaghrah prahetistebhyo namaste no mridayantu te yam dvishmo yashca
    no dveshti tam vo jambhe dadhami| ayamuttarathsamyadvasustasya senajicca sushenashca senanigramanyau
    vishvaci ca ghritaci caphsarasavapo hetirvatah prahetistebhyo namaste no mridayantu te yam dvishmo
    yashca no dveshti tam vo jambhe dadhami| ayamuparyarvagvasustasya tarkshyashcarishtanemishca senani
    gramanyavurvashi ca purvacittishcaphsarasau vidyuddhetirava sphurjanprahetistebhyo namaste no mridayantu
    te yam dvishmo yashca no dveshti tam vo jambhe dadhami| taittiriyasamhitayam kandah ashuh shishano
    vrishabho na yudhmo ghanaghanah kshobhanashcar shaninam| sankrandano'nimisha ekavirah shata sena ajayat
    sakamindrah| sankrandanenanimishena jishnuna yutkarena dushcyavanena dhrishnuna | tadindrena jayata
    tathsahadhvam yudho nara ishuhastena vrishna | sa ishuhastaih sanishangibhirvashi sa srashta sa yudha
    indro ganena| sa srishtajithsomapa bahushadhyu rdhvadhanva pratihitabhirasta | brihaspate pari diya
    rathena rakshoha'mitra apabadhamanah| prabhanjanthsenah pramrino yudha jayannasmakamedhyavita rathanam|
    gotrabhidam govidam vajrabahum jayantamajma pramrinantamojasa| ima sajata anu virayadhvamindra rabhadhvam|
    balavijnayah sthavirah pravirah sahasvan vaji sahamana ugrah| abhiviro abhisattva sahoja jaitramindra
    rathama tishtha govit| abhi gotrani sahasa gahamano'dayo virah shatamanyurindrah| dushcyavana sena
    avatu pra yuthsu| indra asam neta brihaspatirdakshina yajnah pura etu somah| devasenanamabhibhanjatinam
    jayantinam maruto yantvagre | indrasya vrishno varunasya rajna adityanam shardha ugram| mahamanasam
    bhuvanacyavanam ghosho devanam jayatamudasthat| asmakamindrah samriteshu dhvajeshvasmakam ya ishavasta
    jayantu| asmakam vira uttare bhavantvasmanu deva avata haveshu| uddhar shaya maghavannayudhanyut sattvanam
    mamakanam maha si| udvritrahan vajinam vajinanyudrathanam jayatametu ghoshah| upa preta jayata narah
    sthira vah santu bahavah| indro vah sharma yacchattvanadhrishya yatha'satha| avasrishta para pata
    sharavye brahmasa shita| gacchamitran pravisha maisham kam canocchishah| marmani te varmabhishchadayami
    somastva raja'mritenabhivastam| urorvariyo varivaste astu jayantam tvamanu madantu devah| yatra banah
    sampatanti kumara vishikha iva| indro nastatra vritraha vishvaha sharma yacchatu|| sham ca me mayashca
    me priyam ca me'nukamashca me kamashca me saumanasashca me bhadram ca me shreyashca me vasyashca me
    yashashca me bhagashca me dravinam ca me yanta ca me dharta ca me kshemashca me dhritishca me vishvam
    ca me mahashca me samvicca me jnatram ca me sushca me prasushca me siram ca me layashca ma ritam ca
    me'mritam ca me'yakshmam ca me'namayacca me jivatushca me dirghayutvam ca me'namitram ca me'bhayam
    ca me sugam ca me shayanam ca me susha ca me sudinam ca me|| gne varco vihaveshvastu vayam tvendhanastanuvam
    pushema| mahyam namantam pradishashcatasrastvaya'dhyakshena pritana jayema| mama deva vihave santu
    sarva indravanto maruto vishnuragnih| mamantarikshamuru gopamastu mahyam vatah pavatam kame asmin|
    mayi deva dravinama yajantam mayyashirastu mayi devahutih| daivya hotara vanishanta purve'rishtah
    syama tanuva suvirah | mahyam yajantu mama yani havya''kutih satya manaso me astu| eno ma ni gam katamaccanaham
    vishve devaso adhi vocata me| devih shadurviruru nah krinota vishve devasa iha virayadhvam| ma ha
    smahi prajaya ma tanubhirma radhama dvishate soma rajan| agnirmanyum pratinudan purastadadabdho gopah
    pari pahi nastvam| pratyanco yantu nigutah punaste'maisham cittam prabudha vi neshat| dhata dhatrinam
    bhuvanasya yaspatirdeva savitaramabhimatisha'ham | imam yajnamashvinobha brihaspatirdevah pa ntu yajamanam
    nyarthat| uruvyaca no mahishah sharma ya sadasmin have puruhutah purukshu| sa nah prajayai haryashva
    mridayendra ma no ririsho ma para dah| ye nah sapatna apa te bhavantvindragnibhyamava badhamahe tan|
    vasavo rudra aditya uparisprisham mogram cettaramadhirajamakran| arvancamindramamuto havamahe yo gojiddhanajidashvajidyah|
    imam no yajnam vihave jushasvasya kurmo harivo medinam tva|| agnermanve prathamasya pracetaso yam
    pancajanyam bahavah samindhate | vishvasyam vishi pravivishiva samimahe sa no muncatva hasah| yasyedam
    pranam nimishadyadejati yasya jatam janamanam ca kevalam| staumyagnim nathito johavimi sa no muncatva
    indrasya manye prathamasya pracetaso vritraghnah stoma upa mamupaguh| yo dashushah sukrito havamupa
    ganta sa no muncatva hasah| yah sangramam nayati samvashi yudhe yah pushtani sa srijati trayani| staumindram
    nathito johavimi sa no muncatva mitravaruna tasya vitta saratham yatha ugra ta no muncatamagasah|
    yo va ratha rijurashmih satyadharma mithushcarantamupayati dushayan| staumi mitravaruna nathito johavimi
    tau no muncatamagasah| vayoh saviturvidathani manmahe yava tmanvadbibhrito yau ca rakshatah| yau vishvasya
    paribhu babhuvatustau no muncatamagasah| upa shreshtha na ashisho devayordharme asthiran| staumi vayu
    savitaram nathito johavimi tau no muncatamagasah| rathitamau rathinamahva utaye shubham gamishthau
    suyamebhirashvaih rvam devau deveshvanishitamojastau no muncatamagasah| yadayatam vahatu sadamicchamanau|
    staumi devavashvinau nathito johavimi tau no muncatamagasah| manve adhi no bruvantu premam vacam vishvamavantu
    vishve | ashun huve suyamanutaye te no muncantvenasah| tigmamayudham vidita shardhah pritanasu jishnu|
    staumi devanmaruto nathito johavimi te no muncantvenasah| manve adhi no bruvantu premam vacam vishvamavantu
    vishve | ashun huve suyamanutaye te no muncantvenasah| yadidam ma'bhishocati paurusheyena daivyena|
    staumi vishva ndevannathito johavimi te no muncantvenasah| anu no'dyanumatiryajnam deveshu manyatam|
    agnishca havyavahano bhavatam dashushe mayah| anvidanumate tvam manyasai sham ca nah kridhi| kratve
    dakshaya no hi nu prana ayu shi tarishah| vaishvanaro na utya pra yatu paravatah| agnirukthena vahasa||
    prishto divi prishto agnih prithivyam prishto vishva oshadhiravivesha| vaishvanarasahasa prishto agnih
    sa no diva sa rishah patu naktam | ye aprathetamamitebhirojobhirye pratishthe abhavatam vasunam| staumi
    dyavaprithivi nathito johavimi te no muncatama hasah| urvi rodasi varivah krinotam kshetrasya patni
    adhi no bruyatam| staumi dyavaprithivi nathito johavimi te no muncatama hasah| yatte vayam purushatra
    yavishtha'vidva sashcakrima kaccana''gah| kridhi svasma aditeranaga vyena si shishratho vishvagagne|
    yatha ha tadvasavo gauryam citpadi shitamamuncata yajatrah| eva tvamasmatpra munca vya ryagne prataram
    na ayuh|| samici namasi praci diktasya patirasito rakshita yashcadhipatiryashca gopta tabhyam namastau
    no mridayatam te yam dvishmo yashca no dveshti tam vam jambhe dadhamyojasvini namasi dakshina diktasya
    patih pridaku rakshita yashcadhipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca
    no dveshti tam vam jambhe dadhami praci namasi pratici diktasya patih svajo rakshita yashcadhipatiryashca
    gopta tabhyam namastau no mridayatam te yam dvishmo yashca no dveshti tam vam jambhe dadhamyavasthava
    namasyudici diktasya patistirashcaraji rakshita yashcadhipatiryashca gopta tabhyam namastau no mridayatam
    te yam dvishmo yashca no dveshti tam vam jambhe dadhamyadhipatni namasi brihati diktasya ste brihaspatiradhipatih
    shvitro rakshita yashcadhipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca no
    dveshti tam vam jambhe dadhami vashini namasiyam diktasya ste yamo'dhipatih kalmashagrivo rakshita
    yashcadhipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca no dveshti tam vam
    jambhe dadhami|| hetayo nama stha tesham vah puro griha agnirva ishavah salilo vatanamam tebhyo vo
    namaste no mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhami nilimpa nama stha tesham
    vo dakshina grihah pitaro va ishavah sagaro vatanamam tebhyo vo namaste no mridayata te yam dvishmo
    yashca no dveshti tam vo jambhe dadhami vajrino nama stha tesham vah pashcadgrihah svapno va ishavo
    gahvaro vatanamam tebhyo vo namaste no mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhamyavasthavano
    nama stha tesham va uttaradgriha apo va ishavah samudro vatanamam tebhyo vo namaste no mridayata te
    yam dvishmo yashca no dveshti tam vo jambhe dadhamyadhipatayo nama stha tesham sham va ishavo'vasvan
    vatanamam tebhyo vo namaste no mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhami kravya
    nama stha parthivastesham va iha griha annam va ishavo nimisho vatanamam tebhyo vo namaste no mridayata
    te yam dvishmo yashca no dveshti tam vo jambhe dadhami| ryaya shatotaye'bhimatishahe | shatam yo nah
    sharado ajitanindro neshadati duritani vishva || ye catvarah pathayo devayana antara dyavaprithivi
    viyanti| tesham yo ajyanimajitima vahattasmai no devah pari datteha sarve || grishmo hemanta uta no
    vasantah sharadvarshah suvitam no astu| teshamrituna shatasharadanam nivata eshamabhaye syama|| iduvathsaraya
    parivathsaraya samvathsaraya krinuta brihannamah| tesham sumatau yajniyanam jyogajita ahatah syama||
    bhadrannah shreyah samanaishta devastvaya'vasena samashimahi tva| sa no mayobhuh pito avishasva shantokaya
    tanuve syo nah|| bhutam bhavyam bhavishyadvashat svaha nama rikhsamayajurvashat svaha namo gayatritrishtubjagati
    vashat svaha namah prithivyantariksham dyaurvashat svaha namo'gnirvayuh suryo vashat svaha namah prano
    vyano'pano vashat svaha namo'nnam krishirvrishtirvashat svaha namah pita putrah pautro vashat svaha
    namo bhurbhuvah suvarvashat svaha namah| taittiriyabrahmane ashtakam indro dadhico asthabhih| vritranyapratishkutah|
    jaghana navatirnava| icchannashvasya yacchirah| parvateshvapashritam| tadvidaccharyanavati| atraha
    goramanvata| nama tvashturapicyam | ittha candramaso grihe| indramidgathino brihat|| indramarkebhirarkinah|
