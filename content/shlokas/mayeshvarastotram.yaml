id: mayeshvarastotram
category: stotram
name:
  english: mayeshvarastotram
  devanagari: मायेश्वरस्तोत्रम्
content:
  english: isha vasyamidam jagadbhagavata yeneti vakti shrutih sarvam drishyamidam ca tadvilasitam tasyamshamatre
    sthitam | shakyam svamshavibhavanam niravadhau drishyam tatha nirgune mayajalamidam ca tannirasane
    mayeshvarah prarthyate || 1|| nitye satyaghane samatraparame jayeta drishyam katham jnanenaiva vibhati
    satyamiti cetsajnanamatre katham | anande vitate katham jagadidam duhkhaspadam sambhavet mayaya ghatanam
    ca tannirasane mayeshvarah prarthyate || 2|| sarvapraniguhasvaham sphurati yamjnatva svamatram param
    tasmin sarvavibhasake'dvayashive bahulyamittham katham | kleshah panca ca bandhamoksha iti va tishthetkatham
    svaprabhe mayayashca vidambanam nirasane mayeshvarah prarthyate || 3|| drishta drishyamidam ca tatsphutamapi
    spardheta muhyetkatham drishyam drashtari naiva cetkathamidam tadbadhakam manyate | adyante vitate
    svamatraparame madhye svabhinnam katham mayayashca vimohanam nirasane mayeshvarah prarthyate || 4||
    no maya na ca mayikam yadi kuto jiveshavishvabhramo brahmaivasti sadaikameva na bhida brute shrutirnityashah
    | no bhavo'pyasatah sato'pi ca yada'bhavo na va vidyate mayayah kritakam ca tannirasane mayeshvarah
    prarthyate || 5|| aprano hyamanashca yastu manasah shrutya manah kathyate tatsrishtirmanasashca tannirasanadvishnoh
    padam manyate | bhumyasmin sakalam manah kritamaho jatam katham kutra va mayayah pravilobhanam nirasane
    mayeshvarah prarthyate || 6|| bhirno brahmani taddvitiyamiti va shrutya ca nirdishyate tasmin bhinnamaho
    bhayam kathamidam praptam sthitam va bhavet | ajnanam kathamadvaye sukhaghane jnanatmake sambhavet
    mayaya bhramanam ca tannirasane mayeshvarah prarthyate || 7|| shrutya yadgaditam ca neti khalu tallupyetkatham
    mayaya jatam yanna tatha vikara iti va yasminna kincit kvacit | tasminnadvayarupake kathamayam jivashca
    sangibhavet mayayah kapatam ca tannirasane mayeshvarah prarthyate || 8|| janansarvamidam balatkathamaham
    mugdhah samaveshtitah nityatmasthitimadvayamiha vidi syadvighnakritkim mayi | saccitsaukhyamidam svarupamamalam
    matvaiva ceddoshabhak mayauddhatyamaho'tra tannirasane mayeshvarah prarthyate || 9|| brahmaivahamidam
    ca sarvamapi yadbrahmaiva vakti shrutih na stri naiva pumanna tiryagathava devo na va danavah | nana
    neha tathapi yatkhalu vritha mithyendrajaladivat mayaya natanam ca tannirasane mayeshvarah prarthyate
    || 10|| yashcaikah shrutibhirmuhurmuhuraho samstuyamano mahan maya yasya duratyaya janamano vyamohakartri
    bhavet | mameveha yada prapanna iti cenmayam taredyo'vadat tam mayavinivartakam sukhaghanam natvatha
    samprarthaye || 11|| yashcatma gururishvarah sukhaghano vibhrajate'harnisham netum bhimabhavarnavannijapadam
    yo vai kripalurmahan | jivanam bhavanashanatparataram syatkarma no yasya va sarvajno'tra ca sarvashaktirapi
    yah sosmanbhavattarayet || 12|| iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracitam
    shrimayeshvarastotram sampurnam |
  devanagari: ईशा वास्यमिदं जगद्भगवता येनेति वक्ति श्रुतिः सर्वं दृश्यमिदं च तद्विलसितं तस्यांशमात्रे
    स्थितम् । शक्यं स्वांशविभावनं निरवधौ दृश्यं तथा निर्गुणे मायाजालमिदं च तन्निरसने मायेश्वरः प्रार्थ्यते
    ॥ १॥ नित्ये सत्यघने समात्रपरमे जायेत दृश्यं कथं ज्ञानेनैव विभाति सत्यमिति चेत्साज्ञानमात्रे कथम् ।
    आनन्दे वितते कथं जगदिदं दुःखास्पदं सम्भवेत् मायाया घटनं च तन्निरसने मायेश्वरः प्रार्थ्यते ॥ २॥ सर्वप्राणिगुहास्वहं
    स्फुरति यंज्ञात्वा स्वमात्रं परं तस्मिन् सर्वविभासकेऽद्वयशिवे बाहुल्यमित्थं कथम् । क्लेशाः पञ्च च
    बन्धमोक्ष इति वा तिष्ठेत्कथं स्वप्रभे मायायाश्च विडम्बनं निरसने मायेश्वरः प्रार्थ्यते ॥ ३॥ दृष्टा
    दृश्यमिदं च तत्स्फुटमपि स्पर्धेत मुह्येत्कथं दृश्यं द्रष्टरि नैव चेत्कथमिदं तद्बाधकं मन्यते । आद्यन्ते
    वितते स्वमात्रपरमे मध्ये स्वभिन्नं कथं मायायाश्च विमोहनं निरसने मायेश्वरः प्रार्थ्यते ॥ ४॥ नो माया
    न च मायिकं यदि कुतो जीवेशविश्वभ्रमो ब्रह्मैवास्ति सदैकमेव न भिदा ब्रूते श्रुतिर्नित्यशः । नो भावोऽप्यसतः
    सतोऽपि च यदाऽभावो न वा विद्यते मायायाः कृतकं च तन्निरसने मायेश्वरः प्रार्थ्यते ॥ ५॥ अप्राणो ह्यमनाश्च
    यस्तु मनसः श्रुत्या मनः कथ्यते तत्सृष्टिर्मनसश्च तन्निरसनाद्विष्णोः पदं मन्यते । भूम्यस्मिन् सकलं
    मनः कृतमहो जातं कथं कुत्र वा मायायाः प्रविलोभनं निरसने मायेश्वरः प्रार्थ्यते ॥ ६॥ भीर्नो ब्रह्मणि
    तद्द्वितीयमिति वा श्रुत्या च निर्दिश्यते तस्मिन् भिन्नमहो भयं कथमिदं प्राप्तं स्थितं वा भवेत् । अज्ञानं
    कथमद्वये सुखघने ज्ञानात्मके सम्भवेत् मायाया भ्रमणं च तन्निरसने मायेश्वरः प्रार्थ्यते ॥ ७॥ श्रुत्या
    यद्गदितं च नेति खलु तल्लुप्येत्कथं मायया जातं यन्न तथा विकार इति वा यस्मिन्न किञ्चित् क्वचित् । तस्मिन्नद्वयरूपके
    कथमयं जीवश्च सङ्गीभवेत् मायायाः कपटं च तन्निरसने मायेश्वरः प्रार्थ्यते ॥ ८॥ जानन्सर्वमिदं बलात्कथमहं
    मुग्धः समावेष्टितः नित्यात्मस्थितिमद्वयामिह विदि स्याद्विघ्नकृत्किं मयि । सच्चित्सौख्यमिदं स्वरूपममलं
    मत्वैव चेद्दोषभाक् मायौद्धत्यमहोऽत्र तन्निरसने मायेश्वरः प्रार्थ्यते ॥ ९॥ ब्रह्मैवाहमिदं च सर्वमपि
    यद्ब्रह्मैव वक्ति श्रुतिः न स्त्री नैव पुमान्न तिर्यगथवा देवो न वा दानवः । नाना नेह तथापि यत्खलु वृथा
    मिथ्येन्द्रजालादिवत् मायाया नटनं च तन्निरसने मायेश्वरः प्रार्थ्यते ॥ १०॥ यश्चैकः श्रुतिभिर्मुहुर्मुहुरहो
    संस्तूयमानो महान् माया यस्य दुरत्यया जनमनो व्यामोहकर्त्री भवेत् । मामेवेह यदा प्रपन्न इति चेन्मायां
    तरेद्योऽवदत् तं मायाविनिवर्तकं सुखघनं नत्वाथ सम्प्रार्थये ॥ ११॥ यश्चात्मा गुरुरीश्वरः सुखघनो विभ्राजतेऽहर्निशं
    नेतुं भीमभवार्णवान्निजपदं यो वै कृपालुर्महान् । जीवानां भवनाशनात्परतरं स्यात्कर्म नो यस्य वा सर्वज्ञोऽत्र
    च सर्वशक्तिरपि यः सोस्मान्भवात्तारयेत् ॥ १२॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं
    श्रीमायेश्वरस्तोत्रं सम्पूर्णम् ।
