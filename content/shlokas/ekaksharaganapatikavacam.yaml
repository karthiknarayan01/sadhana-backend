id: ekaksharaganapatikavacam
category: kavacha
name:
  english: ekaksharaganapatikavacam
  devanagari: एकाक्षरगणपतिकवचम्
content:
  english: trikalamekakalam va ye pathanti sada narah || 5|| tesham kvapi bhayam nasti sangrame sankate
    girau | bhutavetalarakshobhirgrahaishcapi na badhyate || 6|| idam kavacamajnatva yo japed gananayakam
    | na ca siddhimapnoti mudho varshashatairapi || 7|| aghoro me yatha mantro mantranamuttamottamah |
    tathedam kavacam devi durlabham bhuvi manavaih || 8|| gopaniyam prayatnena najyeyam yasya kasyacit
    | tava pritya maheshani kavacam kathyate'dbhutam || 9|| ekaksharasya mantrasya ganakashcarshiriritah
    | trishtupchandastu vighnesho devata parikirtita || 10|| ga~ bijam shaktironkarah sarvakamarthasiddhaye
    | sarvavighnavinashaya viniyogastu kirtitah || 11|| dhyanam | raktambhojasvarupam lasadarunasarojadhirudham
    trinetram pasham caivankusham va varadamabhayadam bahubhirdharayantam | shaktya yuktam gajasyam prithutarajatharam
    nagayajnopavitam devam candrardhacudam sakalabhayaharam vighnarajam namami || 12|| atha kavacam |
    ganesho me shirah patu bhalam patu gajananah | netre ganapatih patu gajakarnah shruti mama || 13||
    kapolau gananathastu ghranam gandharvapujitah | mukham me sumukhah patu cibukam girijasutah || 14||
    jihvam patu ganakrido dantan rakshatu durmukhah | vacam vinayakah patu kashtam patu mahotkatah ||
    15|| skandhau patu gajaskandho bahu me vighnanashanah | hastau rakshatu herambo vakshah patu mahabalah
    || 16|| hridayam me ganapatirudaram me mahodarah | nabhi gambhirahridayah prishtham patu surapriyah
    || 17|| katim me vikatah patu guhyam me guhapujitah | uru me patu kaumaram januni ca ganadhipah ||
    18|| janghe gajapradah patu gulphau me dhurjatipriyah | caranau durjayah patursangam gananayakah ||
    19|| amodo me'gratah patu pramodah patu prishthatah | dakshine patu siddhisho vame vighnadhararcitah
    || 20|| pracyam rakshatu mam nityam cintamanivinayakah | agneyam vakratundo me dakshinasyamumasutah
    || 21|| nairrityam sarvavighneshah patu nityam ganeshvarah | praticyam siddhidah patu vayavyam gajakarnakah
    || 22|| kauberyam sarvasiddhishah ishanyamishanandanah | urdhvam vinayakah patu adho mushakavahanah
    || 23|| diva gokshiradhavalah patu nityam gajananah | ratrau patu ganakridah sandhyoh suravanditah
    || 24|| pashankushabhayakarah sarvatah patu mam sada | grahabhutapishacebhyah patu nityam gajananah
    || 25|| satvam rajastamo vacam buddhim jnanam smritim dayam | dharmacaturvidham lakshmim lajjam kirtim
    kulam vapuh || 26|| dhanam dhanyam griham daran pautran sakhimstatha | ekadanto'vatu shriman sarvatah
    shankaratmajah || 27|| siddhidam kirtidam devi prapathenniyatah shucih | ekakalam dvikalam vapi bhaktiman
    || 28|| na tasya durlabham kincit trishu lokeshu vidyate | sarvapapavinirmukto jayate bhuvi manavah
    || 29|| yam yam kamayate nityam sudurlabhamanoratham | tam tam prapnoti sakalam shanmasannatra samshayah
    || 30|| mohanastambhanakarshamaranoccatanam vasham | smaranadeva jayante natra karya vicarana || 31||
    sarvavighnaharam devam grahapidanivaranam | sarvashatrukshayakaram sarvapattinivaranam || 32|| dhritvedam
    kavacam devi yo japenmantramuttamam | na vacyate sa vighnaughaih kadacidapi kutracit || 33|| bhurje
    likhitva vidhivaddharayedyo narah shucih | ekabaho shirah kanthe pujayitva ganadhipam || 34|| ekaksharasya
    mantrasya kavacam devi durlabham | yo dharayenmaheshani na vighnairabhibhuyate || 35|| ganeshahridayam
    nama kavacam sarvasiddhidam | pathedva pathayedvapi tasya siddhih kare sthita || 36|| na prakashyam
    maheshani kavacam yatra kutracit | datavyam bhaktiyuktaya gurudevaparaya ca || 37|| || iti shrirudrayamale
    ekaksharaganapatikavacam athava trailokyamohanakavacam sampurnam ||
  devanagari: त्रिकालमेककालं वा ये पठन्ति सदा नराः ॥ ५॥ तेषां क्वापि भयं नास्ति सङ्ग्रामे सङ्कटे गिरौ
    । भूतवेतालरक्षोभिर्ग्रहैश्चापि न बाध्यते ॥ ६॥ इदं कवचमज्ञात्वा यो जपेद् गणनायकम् । न च सिद्धिमाप्नोति
    मूढो वर्षशतैरपि ॥ ७॥ अघोरो मे यथा मन्त्रो मन्त्राणामुत्तमोत्तमः । तथेदं कवचं देवि दुर्लभं भुवि मानवैः
    ॥ ८॥ गोपनीयं प्रयत्नेन नाज्येयं यस्य कस्यचित् । तव प्रीत्या महेशानि कवचं कथ्यतेऽद्भुतम् ॥ ९॥ एकाक्षरस्य
    मन्त्रस्य गणकश्चर्षिरीरितः । त्रिष्टुप्छन्दस्तु विघ्नेशो देवता परिकीर्तिता ॥ १०॥ गँ बीजं शक्तिरोङ्कारः
    सर्वकामार्थसिद्धये । सर्वविघ्नविनाशाय विनियोगस्तु कीर्तितः ॥ ११॥ ध्यानम् । रक्ताम्भोजस्वरूपं लसदरुणसरोजाधिरूढं
    त्रिनेत्रं पाशं चैवाङ्कुशं वा वरदमभयदं बाहुभिर्धारयन्तम् । शक्त्या युक्तं गजास्यं पृथुतरजठरं नागयज्ञोपवीतं
    देवं चन्द्रार्धचूडं सकलभयहरं विघ्नराजं नमामि ॥ १२॥ अथ कवचम् । गणेशो मे शिरः पातु भालं पातु गजाननः
    । नेत्रे गणपतिः पातु गजकर्णः श्रुती मम ॥ १३॥ कपोलौ गणनाथस्तु घ्राणं गन्धर्वपूजितः । मुखं मे सुमुखः
    पातु चिबुकं गिरिजासुतः ॥ १४॥ जिह्वां पातु गणक्रीडो दन्तान् रक्षतु दुर्मुखः । वाचं विनायकः पातु कष्टं
    पातु महोत्कटः ॥ १५॥ स्कन्धौ पातु गजस्कन्धो बाहू मे विघ्ननाशनः । हस्तौ रक्षतु हेरम्बो वक्षः पातु महाबलः
    ॥ १६॥ हृदयं मे गणपतिरुदरं मे महोदरः । नाभि गम्भीरहृदयः पृष्ठं पातु सुरप्रियः ॥ १७॥ कटिं मे विकटः पातु
    गुह्यं मे गुहपूजितः । ऊरु मे पातु कौमारं जानुनी च गणाधिपः ॥ १८॥ जङ्घे गजप्रदः पातु गुल्फौ मे धूर्जटिप्रियः
    । चरणौ दुर्जयः पातुर्साङ्गं गणनायकः ॥ १९॥ आमोदो मेऽग्रतः पातु प्रमोदः पातु पृष्ठतः । दक्षिणे पातु
    सिद्धिशो वामे विघ्नधरार्चितः ॥ २०॥ प्राच्यां रक्षतु मां नित्यं चिन्तामणिविनायकः । आग्नेयां वक्रतुण्डो
    मे दक्षिणस्यामुमासुतः ॥ २१॥ नैरृत्यां सर्वविघ्नेशः पातु नित्यं गणेश्वरः । प्रतीच्यां सिद्धिदः पातु
    वायव्यां गजकर्णकः ॥ २२॥ कौबेर्यां सर्वसिद्धिशः ईशान्यामीशनन्दनः । ऊर्ध्वं विनायकः पातु अधो मूषकवाहनः
    ॥ २३॥ दिवा गोक्षीरधवलः पातु नित्यं गजाननः । रात्रौ पातु गणक्रीडः सन्ध्योः सुरवन्दितः ॥ २४॥ पाशाङ्कुशाभयकरः
    सर्वतः पातु मां सदा । ग्रहभूतपिशाचेभ्यः पातु नित्यं गजाननः ॥ २५॥ सत्वं रजस्तमो वाचं बुद्धिं ज्ञानं
    स्मृतिं दयाम् । धर्मचतुर्विधं लक्ष्मीं लज्जां कीर्तिं कुलं वपुः ॥ २६॥ धनं धान्यं गृहं दारान् पौत्रान्
    सखींस्तथा । एकदन्तोऽवतु श्रीमान् सर्वतः शङ्करात्मजः ॥ २७॥ सिद्धिदं कीर्तिदं देवि प्रपठेन्नियतः शुचिः
    । एककालं द्विकालं वापि भक्तिमान् ॥ २८॥ न तस्य दुर्लभं किञ्चित् त्रिषु लोकेषु विद्यते । सर्वपापविनिर्मुक्तो
    जायते भुवि मानवः ॥ २९॥ यं यं कामयते नित्यं सुदुर्लभमनोरथम् । तं तं प्राप्नोति सकलं षण्मासान्नात्र
    संशयः ॥ ३०॥ मोहनस्तम्भनाकर्षमारणोच्चाटनं वशम् । स्मरणादेव जायन्ते नात्र कार्या विचारणा ॥ ३१॥ सर्वविघ्नहरं
    देवं ग्रहपीडानिवारणम् । सर्वशत्रुक्षयकरं सर्वापत्तिनिवारणम् ॥ ३२॥ धृत्वेदं कवचं देवि यो जपेन्मन्त्रमुत्तमम्
    । न वाच्यते स विघ्नौघैः कदाचिदपि कुत्रचित् ॥ ३३॥ भूर्जे लिखित्वा विधिवद्धारयेद्यो नरः शुचिः । एकबाहो
    शिरः कण्ठे पूजयित्वा गणाधिपम् ॥ ३४॥ एकाक्षरस्य मन्त्रस्य कवचं देवि दुर्लभम् । यो धारयेन्महेशानि न
    विघ्नैरभिभूयते ॥ ३५॥ गणेशहृदयं नाम कवचं सर्वसिद्धिदम् । पठेद्वा पाठयेद्वापि तस्य सिद्धिः करे स्थिता
    ॥ ३६॥ न प्रकाश्यं महेशानि कवचं यत्र कुत्रचित् । दातव्यं भक्तियुक्ताय गुरुदेवपराय च ॥ ३७॥ ॥ इति श्रीरुद्रयामले
    एकाक्षरगणपतिकवचं अथवा त्रैलोक्यमोहनकवचं सम्पूर्णम् ॥
