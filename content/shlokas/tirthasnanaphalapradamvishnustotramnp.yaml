id: tirthasnanaphalapradamvishnustotramnp
category: stotram
name:
  english: tirthasnanaphalapradamvishnustotramnP
  devanagari: तीर्थस्नानफलप्रदम्विष्णुस्तोत्रम्ण्P
content:
  english: tirthasnanaphalapradam shrivishnustotram narasimhapurane vaguvaca stotrenanena viprendra stuhi
    narayanam prabhum | nanyatha sarvatirthanam phalam prapsyasi suvrata || 1|| markandeya uvaca tadevakhyahi
    bhagavan stotram tirthaphalapradam | yena japtena sakalam tirthasnanaphalam labhet || 2|| vaguvaca
    jaya jaya devadeva jaya madhava keshava | jaya padmapalashaksha jaya govinda gopate || 3|| jaya jaya
    padmanabha jaya vaikuntha vamana | jaya padma hrishikesha jaya damodaracyuta || 4|| jaya padmeshvarananta
    jaya lokaguro jaya | jaya shankhagadapane jaya bhudharasukara || 5|| jaya yajnesha varaha jaya bhudhara
    bhumipa | jaya yogesha yogajna jaya yogapravarttaka || 6|| jaya yogapravartaka jaya dharmapravarttaka
    | kritapriya jaya jaya yajnesha yajnanga jaya || 7|| jaya vanditasaddvija jaya naradasiddhida | jaya
    punyavatam geha jaya vaidikabhajana || 8|| jaya jaya caturbhuja shri jayadeva jaya daityabhayavaha
    | jaya sarvajna sarvatman jaya shamkara shashvata || 9|| jaya vishno mahadeva jaya nityamadhokshaja
    | prasadam kuru devesha darshayadya svakam tanum || 10| adhyaya 10 shloka 19
  devanagari: तीर्थस्नानफलप्रदम् श्रीविष्णुस्तोत्रं नरसिंहपुराणे वागुवाच स्तोत्रेणानेन विप्रेन्द्र स्तुहि
    नारायणं प्रभुम् । नान्यथा सर्वतीर्थानां फलं प्राप्स्यसि सुव्रत ॥ १॥ मार्कण्डेय उवाच तदेवाख्याहि भगवन्
    स्तोत्रं तीर्थफलप्रदम् । येन जप्तेन सकलं तीर्थस्नानफलं लभेत् ॥ २॥ वागुवाच जय जय देवदेव जय माधव केशव
    । जय पद्मपलाशाक्ष जय गोविन्द गोपते ॥ ३॥ जय जय पद्मनाभ जय वैकुण्ठ वामन । जय पद्म हृषीकेश जय दामोदराच्युत
    ॥ ४॥ जय पद्मेश्वरानन्त जय लोकगुरो जय । जय शङ्खगदापाणे जय भूधरसूकर ॥ ५॥ जय यज्ञेश वाराह जय भूधर भूमिप
    । जय योगेश योगज्ञ जय योगप्रवर्त्तक ॥ ६॥ जय योगप्रवर्तक जय धर्मप्रवर्त्तक । कृतप्रिय जय जय यज्ञेश यज्ञाङ्ग
    जय ॥ ७॥ जय वन्दितसद्द्विज जय नारदसिद्धिद । जय पुण्यवतां गेह जय वैदिकभाजन ॥ ८॥ जय जय चतुर्भुज श्री
    जयदेव जय दैत्यभयावह । जय सर्वज्ञ सर्वात्मन् जय शंकर शाश्वत ॥ ९॥ जय विष्णो महादेव जय नित्यमधोक्षज ।
    प्रसादं कुरु देवेश दर्शयाद्य स्वकां तनुम् ॥ १०। अध्याय १० श्लोक १९
