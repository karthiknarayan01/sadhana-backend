id: malapahastutih
category: stotram
name:
  english: malapahastutih
  devanagari: मलापहास्तुतिः
content:
  english: 79 malapaha mahasindhuh sarvajanmamalapaha | paratu trividham papam tapam ca trividham mama
    || 1|| iti shrivasudevanandasarasvativiracita malapahastutih samapta |
  devanagari: ७९ मलापहा महासिन्धुः सर्वजन्ममलापहा । परतु त्रिविधं पापं तापं च त्रिविधं मम ॥ १॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिता
    मलापहास्तुतिः समाप्ता ।
meaning: {}
