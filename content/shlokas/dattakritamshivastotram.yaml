id: dattakritamshivastotram
category: stotram
name:
  english: dattakritamshivastotram
  devanagari: दत्तकृतंशिवस्तोत्रम्
content:
  english: dattakritam shivastotram datta uvaca | samsarakupe patito'smi daivanmohena gupto bhavaduhkhapanke
    | ajnananamna tamasa''vrito'ham param na vindami suradhinatha || 7|| bhinnastrishulena baliyasa'ham
    papena cintakshurapatitashca | tapto'smi pancendriyativratapaih shranto'smi santaraya somanatha ||
    8|| baddho'smi daridryamayaishca bandhairhato'smi roganalativratapaih | kranto'smyaham mrityubhujangamena
    bhito bhrisham kim karavani shambho || 9|| bhavabhavabhyamatipidito'ham trishnakshudhabhyam ca rajastamobhyam
    | idrikshaya jaraya cabhibhutah pashyavastham kripaya me'dya natha || 10|| kamena kopena ca matsarena
    dambhena darpadibhirapyanekaih | ekaikashah kashtagato'smi viddhastvam nathavadvaraya natha shatrun
    || 11|| kasyapi kashcitpatitasya pumso duhkhapranodi bhavatiti satyam | vina bhavantam mama somanatha
    kutrapi karunyavaco'pi nasti || 12|| tavatsa kopo bhayamohaduhkhanyajnanadaridryarujastathaiva | kamadayo
    mrityurapiha yavannamah shivayeti na vacmi vakyam || 13|| na me'sti dharmo na ca me'sti bhaktirnaham
    viveki karuna kuto me | data'si tenashu sharanya citte nidhehi someti padam madiye || 14|| yace na
    caham surabhupatitvam hritpadmamadhye mama somanatha | shrisomapadambujasannidhanam yace vicaryaimva
    ca tatkurushva || 15|| yatha tavaham vidito'smi papastatha'pi vijnapanamasha
  devanagari: दत्तकृतं शिवस्तोत्रम् दत्त उवाच । संसारकूपे पतितोऽस्मि दैवान्मोहेन गुप्तो भवदुःखपङ्के ।
    अज्ञाननाम्ना तमसाऽऽवृतोऽहं परं न विन्दामि सुराधिनाथ ॥ ७॥ भिन्नस्त्रिशूलेन बलीयसाऽहं पापेन चिन्ताक्षुरपाटितश्च
    । तप्तोऽस्मि पञ्चेन्द्रियतीव्रतापैः श्रान्तोऽस्मि सन्तारय सोमनाथ ॥ ८॥ बद्धोऽस्मि दारिद्र्यमयैश्च बन्धैर्हतोऽस्मि
    रोगानलतीव्रतापैः । क्रान्तोऽस्म्यहं मृत्युभुजङ्गमेन भीतो भृशं किं करवाणि शम्भो ॥ ९॥ भवाभवाभ्यामतिपीडितोऽहं
    तृष्णाक्षुधाभ्यां च रजस्तमोभ्याम् । ईदृक्षया जरया चाभिभूतः पश्यावस्थां कृपया मेऽद्य नाथ ॥ १०॥ कामेन
    कोपेन च मत्सरेण दम्भेन दर्पादिभिरप्यनेकैः । एकैकशः कष्टगतोऽस्मि विद्धस्त्वं नाथवद्वारय नाथ शत्रून्
    ॥ ११॥ कस्यापि कश्चित्पतितस्य पुंसो दुःखप्रणोदी भवतीति सत्यम् । विना भवन्तं मम सोमनाथ कुत्रापि कारुण्यवचोऽपि
    नास्ति ॥ १२॥ तावत्स कोपो भयमोहदुःखान्यज्ञानदारिद्र्यरुजस्तथैव । कामादयो मृत्युरपीह यावन्नमः शिवायेति
    न वच्मि वाक्यम् ॥ १३॥ न मेऽस्ति धर्मो न च मेऽस्ति भक्तिर्नाहं विवेकी करुणा कुतो मे । दाताऽसि तेनाशु
    शरण्य चित्ते निधेहि सोमेति पदं मदीये ॥ १४॥ याचे न चाहं सुरभूपतित्वं हृत्पद्ममध्ये मम सोमनाथ । श्रीसोमपादाम्बुजसन्निधानं
    याचे विचार्यैंव च तत्कुरुष्व ॥ १५॥ यथा तवाहं विदितोऽस्मि पापस्तथाऽपि विज्ञापनमाश
