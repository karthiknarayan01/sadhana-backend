id: keshavadicaturvimshatinamastotram
category: stotram
name:
  english: keshavadicaturvimshatinamastotram
  devanagari: केशवादिचतुर्विंशतिनामस्तोत्रम्
content:
  english: shrikeshavadi caturvimshatinamastotram keshavastu suvarnabhah samyutashca shriya sada | shankhacakragadapadmadharo
    dhyeyo'khilairjanaih || 1|| narayanah shyamavarnah sada lakshmya yutah prabhuh | padmagadashankhacakradharo
    dhyeyo'khilairjanaih || 2|| madhavo hyutpalabhashca sada kamalaya yutah | shankhacakrapadmagadadharo
    dhyeyo'khilaih prabhuh || 3|| govindah shashivarnashca padmaya ca yutah prabhuh | gadapadmashankhacakradharo
    dhyeyo'khilairjanaih || 4|| sa vishnurgauravarnabho hyabdhikanya yutah prabhuh | padmashankhacakragadadharo
    dhyeyah sada vibhuh || 5|| madhusudanahshonavarnah priya tu kamalalaya | shankhapadmagadacakrayukto
    dhyeyo'khilairjanaih || 6|| trivikramo'nisankasho ramaya ca yutah sada | gadacakrashankhapadmadharo
    dhyeyo'khilairjanaih || 7|| vamanah sphatikabhashca vrishaya priyaya yutah | cakragadapadmashankhadharo
    dhyeyo'khilairjanah || 8|| shridharastu haridrabho dhanyakhyapriyaya yutah | cakragadashankhapadmadharo
    dhyeyo'khilairjanaih || 9|| hrishikeshah suryavarno buddhayakhyapriyaya yutah | cakrapadmashankhagadadharo
    dhyeyo'khilaih prabhuh || 10|| padmanabho ghanashyamah priyaya yajnaya yutah | padmacakragadashankhadharo
    dhyeyo'khilaih sada || 11|| damodaro hemavarna indirapriyaya yutah | shankhagadacakrapadmadharo dhyeyo'khilaih
    prabhuh || 12|| sankarshanah sumuktabho hiranyasahitah prabhuh | shankhapadmacakragadadharo dhyeyah
    sada janaih || 13|| vasudevo niradabho harinyakhyapriyayutah | shankhapadmacakragadadharo dhyeyo'khilaih
    prabhuh || 14|| pradyumno raktavarnashca satyaya samyutah prabhuh | shankhagadapadmacakradharo dhyeyo'khilaih
    prabhuh || 15|| aniruddho'gnivarnashca nilaya sahitah prabhuh | gadashankhapadmacakradharo dhyeyo'khilaih
    sada || 16|| purushottamastu raktabho nityayanandaya yutah | padmashankhagadacakradharo dhyeyo'khilaih
    prabhuh || 17|| adhokshajah shyamavarnastrayyakhyapriyaya yutah | gadashankhacakrapadmadharo dhyeyo'khilaih
    prabhuh || 18|| nrisimho manivarnabhah sukhaya sahitah prabhuh | gadapadmashankhacakradharo dhyeyo'khilairjanaih
    || 19|| acyutah suryavarnashca sugandhyakhyapriya yutah | padmacakrashankhagadadharo dhyeyo'khilaih
    prabhuh || 20|| janardanah kundavarnah sundarya sahitah prabhuh | cakrashankhagadapadmadharo dhyeyo'khilaih
    prabhuh sada || 21|| upendrah shashivarnashca vidyakhyapriyaya yutah | gadacakrapadmashankhadharo
    dhyeyo'khilaih prabhuh || 22|| harirvaidhuryasankashah sahitashca sushilaya | cakrapadmagadashankhadharo
    dhyeyo'khilaih sada || 23|| krishno bhinnanjanaprakhyo lakshanakhyapriyayutah | gadapadmacakrashankhadharo
    dhyeyo'khilairjanaih || 24|| iti shrikeshavadi caturvishatinamastotram sampurnam |
  devanagari: श्रीकेशवादि चतुर्विंशतिनामस्तोत्रम् केशवस्तु सुवर्णाभः संयुतश्च श्रिया सदा । शङ्खचक्रगदापद्मधरो
    ध्येयोऽखिलैर्जनैः ॥ १॥ नारायणः श्यामवर्णः सदा लक्ष्म्या युतः प्रभुः । पद्मगदाशङ्खचक्रधरो ध्येयोऽखिलैर्जनैः
    ॥ २॥ माधवो ह्युत्पलाभश्च सदा कमलया युतः । शङ्खचक्रपद्मगदाधरो ध्येयोऽखिलैः प्रभुः ॥ ३॥ गोविन्दः शशिवर्णश्च
    पद्मया च युतः प्रभुः । गदापद्मशङ्खचक्रधरो ध्येयोऽखिलैर्जनैः ॥ ४॥ स विष्णुर्गौरवर्णाभो ह्यब्धिकन्या
    युतः प्रभुः । पद्मशङ्खचक्रगदाधरो ध्येयः सदा विभुः ॥ ५॥ मधुसूदनःशोणवर्णः प्रिया तु कमलालया । शङ्खपद्मगदाचक्रयुक्तो
    ध्येयोऽखिलैर्जनैः ॥ ६॥ त्रिविक्रमोऽनिसङ्काशो रमया च युतः सदा । गदाचक्रशङ्खपद्मधरो ध्येयोऽखिलैर्जनैः
    ॥ ७॥ वामनः स्फटिकाभश्च वृषया प्रियया युतः । चक्रगदापद्मशङ्खधरो ध्येयोऽखिलैर्जनः ॥ ८॥ श्रीधरस्तु हरिद्राभो
    धन्याख्यप्रियया युतः । चक्रगदाशङ्खपद्मधरो ध्येयोऽखिलैर्जनैः ॥ ९॥ हृषीकेशः सूर्यवर्णो बुद्धयाख्यप्रियया
    युतः । चक्रपद्मशङ्खगदाधरो ध्येयोऽखिलैः प्रभुः ॥ १०॥ पद्मनाभो घनश्यामः प्रियया यज्ञया युतः । पद्मचक्रगदाशङ्खधरो
    ध्येयोऽखिलैः सदा ॥ ११॥ दामोदरो हेमवर्ण इन्दिराप्रियया युतः । शङ्खगदाचक्रपद्मधरो ध्येयोऽखिलैः प्रभुः
    ॥ १२॥ सङ्कर्षणः सुमुक्ताभो हिरण्यासहितः प्रभुः । शङ्खपद्मचक्रगदाधरो ध्येयः सदा जनैः ॥ १३॥ वासुदेवो
    नीरदाभो हरिण्याख्यप्रियायुतः । शङ्खपद्मचक्रगदाधरो ध्येयोऽखिलैः प्रभुः ॥ १४॥ प्रद्युम्नो रक्तवर्णश्च
    सत्यया संयुतः प्रभुः । शङ्खगदापद्मचक्रधरो ध्येयोऽखिलैः प्रभुः ॥ १५॥ अनिरुद्धोऽग्निवर्णश्च नीलया सहितः
    प्रभुः । गदाशङ्खपद्मचक्रधरो ध्येयोऽखिलैः सदा ॥ १६॥ पुरुषोत्तमस्तु रक्ताभो नित्ययानन्दया युतः । पद्मशङ्खगदाचक्रधरो
    ध्येयोऽखिलैः प्रभुः ॥ १७॥ अधोक्षजः श्यामवर्णस्त्रय्याख्यप्रियया युतः । गदाशङ्खचक्रपद्मधरो ध्येयोऽखिलैः
    प्रभुः ॥ १८॥ नृसिंहो मणिवर्णाभः सुखया सहितः प्रभुः । गदापद्मशङ्खचक्रधरो ध्येयोऽखिलैर्जनैः ॥ १९॥ अच्युतः
    सूर्यवर्णश्च सुगन्ध्याख्यप्रिया युतः । पद्मचक्रशङ्खगदाधरो ध्येयोऽखिलैः प्रभुः ॥ २०॥ जनार्दनः कुन्दवर्णः
    सुन्दर्या सहितः प्रभुः । चक्रशङ्खगदापद्मधरो ध्येयोऽखिलैः प्रभुः सदा ॥ २१॥ उपेन्द्रः शशिवर्णश्च विद्याख्यप्रियया
    युतः । गदाचक्रपद्मशङ्खधरो ध्येयोऽखिलैः प्रभुः ॥ २२॥ हरिर्वैढूर्यसङ्काशः सहितश्च सुशीलया । चक्रपद्मगदाशङ्खधरो
    ध्येयोऽखिलैः सदा ॥ २३॥ कृष्णो भिन्नाञ्जनप्रख्यो लक्षणाख्यप्रियायुतः । गदापद्मचक्रशङ्खधरो ध्येयोऽखिलैर्जनैः
    ॥ २४॥ इति श्रीकेशवादि चतुर्विशतिनामस्तोत्रं सम्पूर्णम् ।
