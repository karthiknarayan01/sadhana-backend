id: bhishmaproktam3shrikrishnastotram
category: stotram
name:
  english: bhishmaproktam3shrikrishnastotram
  devanagari: भीष्मप्रोक्तं३श्रीकृष्णस्तोत्रम्
content:
  english: ringavanmandaro nilo nishadho dardurastatha || 26|| citrakuto'njanabhashca parvato gandhamadanah
    | punyah somagirishcaiva tathaivanye mahidharah || 27|| dishashca vidishashcaiva kshitih sarve mahiruhah
    || 27|| vishvedeva nabhashcaiva nakshatrani grahastatha | pantu vah satatam devah kirtitakirtita maya
    || 28|| kirtayano naro hyetanmucyate sarvakilbishaih | stuvamshca pratinandamshca mucyate sarvato
    bhayat | sarvasankarapapebhyo devatastavanandakah || 29|| devatanantaram vipramstapahsiddhamstapodhikan
    | kirtitankirtayishyami sarvapapapramocanan || 30|| yavakrito'tha raibhyashca kakshivanaushijastatha
    | bhrigvangirastatha kanvo medhatithiratha prabhuh | barhi ca gunasampannah pracim dishamupashritah
    || 31|| bhadram disham mahabhaga ulmucuh pramucustatha | mumucushca mahabhagah svastyatreyashca viryavan
    || 32|| mitravarunayoh putrastathagastyah pratapavan | dridhayushcordhvabahushca vishrutavrishisattamau
    || 33|| pashcimam dishamashritya ya edhante nibodha tan | ushadguh saha sodaryaih parivyadhashca viryavan
    || 34|| rishirdirghatamashcaiva gautamah kashyapastatha | ekatashca dvitashcaiva tritashcaiva maharshayah
    | atreh putrashca dharmatma tatha sarasvatah prabhuh || 35|| uttaram dishamashritya ya edhante nibodha
    tan | atrirvasishthah shaktishca parasharyashca viryavan || 36|| vishvamitro bharadvajo jamadagnistathaiva
    ca | ricikapautro ramashca rishirauddalakistatha || 37|| shvetaketuh kohalashca vipulo devalastatha
    | devasharma ca dhaumyashca hastikashyapa eva ca || 38|| lomasho naciketashca lomaharshana eva ca
    | rishirugrashravashcaiva bhargavashcyavanastatha || 39|| esha vai samavayaste rishidevasamanvitah
    | adyah prakirtito rajansarvapapapramocanah || 40|| nrigo yayatirnahusho yaduh purushca viryavan |
    dhundhumaro dilipashca sagarashca pratapavan || 41|| krishashvo yauvanashvashca citrashvah satyavamstatha
    | duhshanto bharatashcaiva cakravarti mahayashah || 42|| yavano janakashcaiva tatha dridharatho nripah
    | raghurnaravarashcaiva tatha dasharatho nripah || 43|| ramo rakshasaha virah shashabindurbhagirathah
    | harishcandro maruttashca jahnurjahnavisevita || 44|| mahodayo hyalarkashca ailashcaiva naradhipah
    | karandhamo narashreshthah kadhmorashca naradhipah || 45|| daksho'mbarishah kukuro ravatashca mahayashah
    | mucukundashca rajarshirmitrabhanuh priyankarah || 46|| trasadasyustatha raja shveto rajarshisattamah
    | mahabhishashca vikhyato nimirajastathashtakah || 47|| ayuh kshupashca rajarshih kaksheyushca naradhipah
    | shibiraushinarashcaiva gayashcaiva naradhipah || 48|| pratardano divodasah saudasah kosaleshvarah
    | ailo nalashca rajarshirmanushcaiva prajapatih || 49|| havidhrashca prishadhrashca pratipah shantanustatha
    | kakshasenashca rajarshirye canye nanukirtitah || 50|| ma vighnam ma ca me papam ma ca me paripanthinah
    | dhruvo jayo me nityam syatparatra ca para gatih || 51|| iti mahabharate anushasanaparvani 151 adhyayantargatam
    bhishmaproktam shrikrishnastotram sampurnam | mahabharata | anuparva | adhyaya 151
  devanagari: ृङ्गवान्मन्दरो नीलो निषधो दर्दुरस्तथा ॥ २६॥ चित्रकूटोऽञ्जनाभश्च पर्वतो गन्धमादनः । पुण्यः
    सोमगिरिश्चैव तथैवान्ये महीधराः ॥ २७॥ दिशश्च विदिशश्चैव क्षितिः सर्वे महीरुहाः ॥ २७॥ विश्वेदेवा नभश्चैव
    नक्षत्राणि ग्रहास्तथा । पान्तु वः सततं देवाः कीर्तिताकीर्तिता मया ॥ २८॥ कीर्तयानो नरो ह्येतान्मुच्यते
    सर्वकिल्बिषैः । स्तुवंश्च प्रतिनन्दंश्च मुच्यते सर्वतो भयात् । सर्वसङ्करपापेभ्यो देवतास्तवनन्दकः ॥
    २९॥ देवतानन्तरं विप्रांस्तपःसिद्धांस्तपोधिकान् । कीर्तितान्कीर्तयिष्यामि सर्वपापप्रमोचनान् ॥ ३०॥ यवक्रीतोऽथ
    रैभ्यश्च कक्षीवानौशिजस्तथा । भृग्वङ्गिरास्तथा कण्वो मेधातिथिरथ प्रभुः । बर्ही च गुणसम्पन्नः प्राचीं
    दिशमुपाश्रिताः ॥ ३१॥ भद्रां दिशं महाभागा उल्मुचुः प्रमुचुस्तथा । मुमुचुश्च महाभागः स्वस्त्यात्रेयश्च
    वीर्यवान् ॥ ३२॥ मित्रावरुणयोः पुत्रस्तथागस्त्यः प्रतापवान् । दृढायुश्चोर्ध्वबाहुश्च विश्रुतावृषिसत्तमौ
    ॥ ३३॥ पश्चिमां दिशमाश्रित्य य एधन्ते निबोध तान् । उषद्गुः सह सोदर्यैः परिव्याधश्च वीर्यवान् ॥ ३४॥
    ऋषिर्दीर्घतमाश्चैव गौतमः कश्यपस्तथा । एकतश्च द्वितश्चैव त्रितश्चैव महर्षयः । अत्रेः पुत्रश्च धर्मात्मा
    तथा सारस्वतः प्रभुः ॥ ३५॥ उत्तरां दिशमाश्रित्य य एधन्ते निबोध तान् । अत्रिर्वसिष्ठः शक्तिश्च पाराशर्यश्च
    वीर्यवान् ॥ ३६॥ विश्वामित्रो भरद्वाजो जमदग्निस्तथैव च । ऋचीकपौत्रो रामश्च ऋषिरौद्दालकिस्तथा ॥ ३७॥
    श्वेतकेतुः कोहलश्च विपुलो देवलस्तथा । देवशर्मा च धौम्यश्च हस्तिकाश्यप एव च ॥ ३८॥ लोमशो नाचिकेतश्च
    लोमहर्षण एव च । ऋषिरुग्रश्रवाश्चैव भार्गवश्च्यवनस्तथा ॥ ३९॥ एष वै समवायस्ते ऋषिदेवसमन्वितः । आद्यः
    प्रकीर्तितो राजन्सर्वपापप्रमोचनः ॥ ४०॥ नृगो ययातिर्नहुषो यदुः पूरुश्च वीर्यवान् । धुन्धुमारो दिलीपश्च
    सगरश्च प्रतापवान् ॥ ४१॥ कृशाश्वो यौवनाश्वश्च चित्राश्वः सत्यवांस्तथा । दुःषन्तो भरतश्चैव चक्रवर्ती
    महायशाः ॥ ४२॥ यवनो जनकश्चैव तथा दृढरथो नृपः । रघुर्नरवरश्चैव तथा दशरथो नृपः ॥ ४३॥ रामो राक्षसहा वीरः
    शशबिन्दुर्भगीरथः । हरिश्चन्द्रो मरुत्तश्च जह्नुर्जाह्नविसेविता ॥ ४४॥ महोदयो ह्यलर्कश्च ऐलश्चैव नराधिपः
    । करन्धमो नरश्रेष्ठः कध्मोरश्च नराधिपः ॥ ४५॥ दक्षोऽम्बरीषः कुकुरो रवतश्च महायशाः । मुचुकुन्दश्च राजर्षिर्मित्रभानुः
    प्रियङ्करः ॥ ४६॥ त्रसदस्युस्तथा राजा श्वेतो राजर्षिसत्तमः । महाभिषश्च विख्यातो निमिराजस्तथाष्टकः ॥
    ४७॥ आयुः क्षुपश्च राजर्षिः कक्षेयुश्च नराधिपः । शिबिरौशीनरश्चैव गयश्चैव नराधिपः ॥ ४८॥ प्रतर्दनो दिवोदासः
    सौदासः कोसलेश्वरः । ऐलो नलश्च राजर्षिर्मनुश्चैव प्रजापतिः ॥ ४९॥ हविध्रश्च पृषध्रश्च प्रतीपः शन्तनुस्तथा
    । कक्षसेनश्च राजर्षिर्ये चान्ये नानुकीर्तिताः ॥ ५०॥ मा विघ्नं मा च मे पापं मा च मे परिपन्थिनः । ध्रुवो
    जयो मे नित्यं स्यात्परत्र च परा गतिः ॥ ५१॥ इति महाभारते अनुशासनपर्वणि १५१ अध्यायान्तर्गतं भीष्मप्रोक्तं
    श्रीकृष्णस्तोत्रं सम्पूर्णम् । महाभारत । अनुपर्व । अध्याय १५१
