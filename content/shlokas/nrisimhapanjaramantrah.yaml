id: nrisimhapanjaramantrah
category: mantra
name:
  english: nrisimhapanjaramantrah
  devanagari: नृसिंहपन्जरमन्त्रः
content:
  english: shakinidakiniyantramantraneka nivaranarthe vajrapanjararakshabandhane viniyogah || atha nyasah
    | om kshraum angushthabhyam namah | hridayaya namah | om praum tarjanibhyam namah | shirase svaha
    | om raum madhyamabhyam namah | shikhayai vashat | om vraum anamikabhyam namah | kavacaya hum | om
    jraum kanishthikabhyam namah | netratrayaya vaushat | om hraum karatalakaraprishthabhyam namah | astraya
    phat | om hrim sahasrara hum phat iti sudarshanena digbandhah | atha dhyanam | dhyayennrisimhamuruvrittaravitrinetram
    januprasaktakarayugmamathaparabhyam | cakram daram ca dadhatam priyayasametam tigmamshukotyadhikatejasamarthyashuktim
    || 1|| iti dhyatvapi devesham shucirbhutva samahitah | devagareca vrindayam panjaram prajapetsudhih
    || 2|| om ugram hum phat muladhare raksha raksha svaha | om viram hum phat guhyasthane raksha raksha
    svaha | om mahavishnum hum phat nabhyam raksha raksha svaha | om jvalantam hum phat hridaye raksha
    raksha svaha | om sarvatomukham hum phat kantham raksha raksha svaha | om nrisimham hum phat bhruvormadhye
    raksha raksha svaha | om bhishanam hum phat netrayoh raksha raksha svaha | om bhadram hum phat lalate
    raksha raksha svaha | om mrityum hum phat brahmarandhre raksha raksha svaha | om namami hum phat shirasi
    raksha raksha svaha | om aham hum phat shikhayam raksha raksha svaha | om kshraum ugram viram mahavishnum
    jvalantam sarvatomukham | nrisimham bhishanam bhadram mrityumrityum namamyaham | hum phat sarvange
    raksha raksha svaha | sarvavyapakatrayam kuryat | atha navanarasimhamantrena disharakshanamantrah
    | om kshraum praum raum vraum jraum hraum namah om lam hum phat purvadisham stambhanarasimhaya raksha
    raksha svaha || 1|| om namo narasimhaya sarvadushtavinashanaya sarvajanamohanaya sarvarajyavashyam
    kuru kuru hum phat agneyim disham divyanrisimhaya raksha raksha svaha || 2|| om namo simhaya simharajaya
    narakeshaya namah | om hum phat viranrisimhaya yamyam disham raksha raksha svaha || 3|| om kraum om
    om jvaladamshtraya karalavadanaya om ugraya ugraviryaya vikataya vajradehaya rudraya rudraghoraya
    bhadraya bhadrakarine namah hum phat kalanrisimhaya nairitim disham raksha raksha svaha || 4|| om
    jrim hrim namah svaha hum phat vikramanrisimhaya varunim disham raksha raksha svaha | om namo nrisimhaya
    kapilajataya amoghavacaya satyam satyam mahogracandarupaya hum phat pracandavayuveganrisimhaya vayavim
    disham raksha raksha svaha | om hrim hrim hrim om hrum hrum hrum kshraum kshrim kshrum kshraum kshraum
    kshrah kshrum kshrum hum phat kauberim disham mayanrisimhaya raksha raksha svaha | om om om hrim hrim
    hrim hrum hrum hrum chram chram chram chram chram hum phat virogranrisimhaya ishanim disham raksha
    raksha svaha | om rumkshum om rumkshum rumkshum rumkshum om rum rum hum phat kedarakashakaralanrisimhaya
    akashadisham raksha raksha svaha | om kshraum shrim hrim hum phat lakshminrisimhaya pataladisham raksha
    raksha svaha | om jram jram jram hram hram hram hum phat mahogranarasimhaya sarvadisham raksha raksha
    svaha | om hum plum phat sarvangam mama raksha raksha svaha | atha mantrah | om sarvaroganam bandha
    bandha sarvagrahanam bandha bandha sarvadoshanam bandha bandha sarvacoranam bandha bandha sarvapannaganam
    bandha bandha sarvavyaghranam bandha bandha sarva vrishcikanam bandha bandha sarvabhutapretapishacakanam
    bandha bandha shakini dakini yantra mantra bangha bandha kilaya kilaya mardaya mardaya curnaya curnaya
    jaya jaya mama virodhinah hana hana matha matha paca paca curnaya curnaya cakrena gadaya vajrena bhasmikuru
    bhasmikuru | om jrim jrim nrim nrim hrim hrim kshrim kshrim nrisimhaya namah | hum phat raksha raksha
    svaha | om mahogranarasimhaya sarvadisham raksha raksha svaha | om kshraum nrisimhaya vidmahe vajranakhaya
    dhimahi tannah simhah pracodayat | hridayarakshartham dvadashavaram japet || om hrim sahasrajvalavartasahasrara
    hum phat svaha svaha svaha | chotikatrayam | ya idam panjaram divyam sarvarakshakaram param | sarvarogaprashamanam
    sarvadaridryanashanam || 1|| lakshmi pushtikaram gehe panjaram vajrapanjaram | sarvashantikaram nrinam
    putrapautravivardhanam || 2|| ekadha pathanaddevi sarvapapakshayobhavet | dashadha pathananmantri
    rane yuddhajayibhavet || 3|| sahasram yah pathedyastu khecaro jayate narah | sahasradashakam yastu
    pathedvaibhaktimannarah || 4|| sa casya jagatam natho pratyaksho bhavati dhruvam | lakshapurnam yada
    devi panjaram prajapetsudhih || 5|| bhavapashavinirmukto devatulyo na samshayah | nrisimhamantrarakshanam
    sarvasiddhiphalapradam || 6|| bhurjapatre likhitva tu shirasa dharayetsudhih | shastraghatanna badhyante
    sangrame shatrusankate || 7|| idam tu panjaram divyam sarvamantramayam shubham | sarvarakshakaram
    nrinam devadevabhivanditam || 8|| mantravetta gurum gatva grihaniyaprayatnatah | anyatha grahane tasya
    mrityudvaram na samshayah || 9|| pathanena pishacatvam vina gurupadeshatah | tasmatprayatno'pi caturo
    gurum mantravidam varam | anugacchan grihitavyamidam panjaramashuvat || 10|| anujnam dehi | ityatharvanarahasye
    brahmasavitrisamvade shrinrisimhapanjarastotram sampurnam |
  devanagari: शाकिनीडाकिनीयन्त्रमन्त्रानेक निवारणार्थे वज्रपञ्जररक्षाबन्धने विनियोगः ॥ अथ न्यासः । ॐ क्ष्रौं
    अङ्गुष्ठाभ्यां नमः । हृदयाय नमः । ॐ प्रौं तर्जनीभ्यां नमः । शिरसे स्वाहा । ॐ रौं मध्यमाभ्यां नमः ।
    शिखायै वषट् । ॐ व्रौं अनामिकाभ्यां नमः । कवचाय हुम् । ॐ ज्रौं कनिष्ठिकाभ्यां नमः । नेत्रत्रयाय वौषट्
    । ॐ ह्रौं करतलकरपृष्ठाभ्यां नमः । अस्त्राय फट् । ॐ ह्रीं सहस्रार हुं फट् इति सुदर्शनेन दिग्बन्धः ।
    अथ ध्यानम् । ध्यायेन्नृसिंहमुरुवृत्तरवित्रिनेत्रं जानुप्रसक्तकरयुग्ममथापराभ्याम् । चक्रं दरं च दधतं
    प्रिययासमेतं तिग्मांशुकोट्यधिकतेजसमर्थ्यशुक्तिम् ॥ १॥ इति ध्यात्वापि देवेशं शुचिर्भूत्वा समाहितः ।
    देवागारेच वृन्दायां पञ्जरं प्रजपेत्सुधीः ॥ २॥ ॐ उग्रं हुं फट् मूलाधारे रक्ष रक्ष स्वाहा । ॐ वीरं हुं
    फट् गुह्यस्थाने रक्ष रक्ष स्वाहा । ॐ महाविष्णुं हुं फट् नाभ्यां रक्ष रक्ष स्वाहा । ॐ ज्वलन्तं हुं
    फट् हृदये रक्ष रक्ष स्वाहा । ॐ सर्वतोमुखं हुं फट् कण्ठं रक्ष रक्ष स्वाहा । ॐ नृसिंहं हुं फट् भ्रुवोर्मध्ये
    रक्ष रक्ष स्वाहा । ॐ भीषणं हुं फट् नेत्रयोः रक्ष रक्ष स्वाहा । ॐ भद्रं हुं फट् ललाटे रक्ष रक्ष स्वाहा
    । ॐ मृत्युं हुं फट् ब्रह्मरन्ध्रे रक्ष रक्ष स्वाहा । ॐ नमामि हुं फट् शिरसि रक्ष रक्ष स्वाहा । ॐ अहं
    हुं फट् शिखायां रक्ष रक्ष स्वाहा । ॐ क्ष्रौं उग्रं वीरं महाविष्णुं ज्वलन्तं सर्वतोमुखम् । नृसिंहं
    भीषणं भद्रं मृत्युमृत्युं नमाम्यहम् । हुं फट् सर्वाङ्गे रक्ष रक्ष स्वाहा । सर्वव्यापकत्रयं कुर्यात्
    । अथ नवनारसिंहमन्त्रेण दिशारक्षणमन्त्रः । ॐ क्ष्रौं प्रौं रौं व्रौं ज्रौं ह्रौं नमः ॐ लां हुं फट्
    पूर्वदिशं स्तम्भनारसिंहाय रक्ष रक्ष स्वाहा ॥ १॥ ॐ नमो नारसिंहाय सर्वदुष्टविनाशनाय सर्वजनमोहनाय सर्वराज्यवश्यं
    कुरु कुरु हुं फट् आग्नेयीं दिशं दिव्यनृसिंहाय रक्ष रक्ष स्वाहा ॥ २॥ ॐ नमो सिंहाय सिंहराजाय नरकेशाय
    नमः । ॐ हुं फट् वीरनृसिंहाय याम्यां दिशं रक्ष रक्ष स्वाहा ॥ ३॥ ॐ क्रौं ॐ ॐ ज्वालादंष्ट्राय करालवदनाय
    ॐ उग्राय उग्रवीर्याय विकटाय वज्रदेहाय रुद्राय रुद्रघोराय भद्राय भद्रकारिणे नमः हुं फट् कालनृसिंहाय
    नैऋतिं दिशं रक्ष रक्ष स्वाहा ॥ ४॥ ॐ ज्रीं ह्रीं नमः स्वाहा हुं फट् विक्रमनृसिंहाय वारूणीं दिशं रक्ष
    रक्ष स्वाहा । ॐ नमो नृसिंहाय कपिलजटाय अमोघवाचाय सत्यं सत्यं महोग्रचण्डरूपाय हुं फट् प्रचण्डवायुवेगनृसिंहाय
    वायवीं दिशं रक्ष रक्ष स्वाहा । ॐ ह्रीं ह्रीं ह्रीं ॐ ह्रूं ह्रूं ह्रूं क्ष्रौं क्ष्रीं क्ष्रूं क्ष्रौं
    क्ष्रौं क्ष्रः क्ष्रूं क्ष्रूं हुं फट् कौबेरीं दिशं मायानृसिंहाय रक्ष रक्ष स्वाहा । ॐ ॐ ॐ ह्रीं ह्रीं
    ह्रीं ह्रूं ह्रूं ह्रूं छ्रं छ्रं छ्रं छ्रं छ्रं हुं फट् वीरोग्रनृसिंहाय ईशानीं दिशं रक्ष रक्ष स्वाहा
    । ॐ रुंक्षुं ॐ रुंक्षुं रुंक्षुं रुंक्षुं ॐ रुं रुं हुं फट् केदाराकाशकरालनृसिंहाय आकाशदिशं रक्ष रक्ष
    स्वाहा । ॐ क्ष्रौं श्रीं ह्रीं हुं फट् लक्ष्मीनृसिंहाय पातालदिशं रक्ष रक्ष स्वाहा । ॐ ज्रां ज्रां
    ज्रां ह्रां ह्रां ह्रां हुं फट् महोग्रनारसिंहाय सर्वदिशं रक्ष रक्ष स्वाहा । ॐ हुं प्लुं फट् सर्वाङ्गं
    मम रक्ष रक्ष स्वाहा । अथ मन्त्रः । ॐ सर्वरोगाणां बन्ध बन्ध सर्वग्रहाणां बन्ध बन्ध सर्वदोषाणां बन्ध
    बन्ध सर्वचोराणां बन्ध बन्ध सर्वपन्नगानां बन्ध बन्ध सर्वव्याघ्राणां बन्ध बन्ध सर्व वृश्चिकानां बन्ध
    बन्ध सर्वभूतप्रेतपिशाचकानां बन्ध बन्ध शाकिनी डाकिनी यन्त्र मन्त्र बङ्घ बन्ध कीलय कीलय मर्दय मर्दय
    चूर्णय चूर्णय जय जय मम विरोधिनः हन हन मथ मथ पच पच चूर्णय चूर्णय चक्रेण गदया वज्रेण भस्मीकुरु भस्मीकुरु
    । ॐ ज्रीं ज्रीं न्रीं न्रीं ह्रीं ह्रीं क्ष्रीं क्ष्रीं नृसिंहाय नमः । हुं फट् रक्ष रक्ष स्वाहा ।
    ॐ महोग्रनारसिंहाय सर्वदिशं रक्ष रक्ष स्वाहा । ॐ क्ष्रौं नृसिंहाय विद्महे वज्रनखाय धीमही तन्नः सिंहः
    प्रचोदयात् । हृदयरक्षार्थं द्वादशवारं जपेत् ॥ ॐ ह्रीं सहस्रज्वालावर्तसहस्रार हुं फट् स्वाहा स्वाहा
    स्वाहा । छोटिकात्रयम् । य इदं पञ्जरं दिव्यं सर्वरक्षाकरं परम् । सर्वरोगप्रशमनं सर्वदारिद्र्यनाशनम्
    ॥ १॥ लक्ष्मी पुष्टिकरं गेहे पञ्जरं वज्रपञ्जरम् । सर्वशान्तिकरं नृणां पुत्रपौत्रविवर्धनम् ॥ २॥ एकधा
    पठणाद्देवि सर्वपापक्षयोभवेत् । दशधा पठणान्मन्त्री रणे युद्धजयीभवेत् ॥ ३॥ सहस्रं यः पठेद्यस्तु खेचरो
    जायते नरः । सहस्रदशकं यस्तु पठेद्वैभक्तिमान्नरः ॥ ४॥ स चास्य जगतां नाथो प्रत्यक्षो भवति ध्रुवम् ।
    लक्षपूर्णं यदा देवी पञ्जरं प्रजपेत्सुधीः ॥ ५॥ भवपाशविनिर्मुक्तो देवतुल्यो न संशयः । नृसिंहमन्त्ररक्षाणां
    सर्वसिद्धिफलप्रदम् ॥ ६॥ भूर्जपत्रे लिखित्वा तु शिरसा धारयेत्सुधीः । शस्त्रघातान्न बाध्यन्ते सङ्ग्रामे
    शत्रुसङ्कटे ॥ ७॥ इदं तु पञ्जरं दिव्यं सर्वमन्त्रमयं शुभम् । सर्वरक्षाकरं नृणां देवदेवाभिवन्दितम् ॥
    ८॥ मन्त्रवेत्ता गुरुं गत्वा गृहणीयप्रयत्नतः । अन्यथा ग्रहणे तस्य मृत्युद्वारं न संशयः ॥ ९॥ पठनेन पिशाचत्वं
    विना गुरूपदेशतः । तस्मात्प्रयत्नोऽपि चतुरो गुरुं मन्त्रविदां वरम् । अनुगच्छन् गृहीतव्यमिदं पञ्जरमाशुवत्
    ॥ १०॥ अनुज्ञां देहि । इत्यथर्वणरहस्ये ब्रह्मासावित्रीसंवादे श्रीनृसिंहपञ्जरस्तोत्रं सम्पूर्णम् ।
