id: ramakrishnastotram-9
category: stotram
name:
  english: ramakrishnastotram 9
  devanagari: रामकृष्णस्तोत्रम् ९
content:
  english: shriramakrishnastotram acandalapratihatarayo yasya premapravahah lokatito'pyahaha na jahau
    lokakalyanamargam | trailokye'pyapratimamahima janakipranabandho bhaktya jnanam vritavaravapuh sitaya
    yo hi ramah || stabdhikritya pralayakalitam vahavottham mahantam hitva ratrim prakritisahajamandhatamisramishram
    | gitam shantam madhuramapi yah simhanadam jagarja so'yam jatah prathitapurusho ramakrishnastvidanim
    || naradeva deva jaya jaya naradeva || shaktisamudrasamutthatarangam darshitapremavijrimbhitarangam
    | samshayarakshasanashamahastram yami gurum sharanam bhavavaidyam || 1|| naradeva deva jaya jaya naradeva
    || advayatattvasamahitacittam projjvalabhaktipatavritavrittam | karmakalevaramadbhutaceshtam yami
    gurum sharanam bhavavaidyam || 2|| naradeva deva jaya jaya naradeva || iti svamivivekanandaviracitam
    shriramakrishnastotram sampurnam |
  devanagari: श्रीरामकृष्णस्तोत्रम् आचण्डालाप्रतिहतरयो यस्य प्रेमप्रवाहः लोकातीतोऽप्यहह न जहौ लोककल्याणमार्गम्
    । त्रैलोक्येऽप्यप्रतिममहिमा जानकीप्राणबन्धो भक्त्या ज्ञानं वृतवरवपुः सीतया यो हि रामः ॥ स्तब्धीकृत्य
    प्रलयकलितं वाहवोत्थं महान्तं हित्वा रात्रिं प्रकृतिसहजामन्धतामिस्रमिश्राम् । गीतं शान्तं मधुरमपि यः
    सिंहनादं जगर्ज सोऽयं जातः प्रथितपुरुषो रामकृष्णस्त्विदानीम् ॥ नरदेव देव जय जय नरदेव ॥ शक्तिसमुद्रसमुत्थतरङ्गं
    दर्शितप्रेमविजृम्भितरङ्गम् । संशयराक्षसनाशमहास्त्रं यामि गुरुं शरणं भववैद्यम् ॥ १॥ नरदेव देव जय जय
    नरदेव ॥ अद्वयतत्त्वसमाहितचित्तं प्रोज्ज्वलभक्तिपटावृतवृत्तम् । कर्मकलेवरमद्भुतचेष्टं यामि गुरुं शरणं
    भववैद्यम् ॥ २॥ नरदेव देव जय जय नरदेव ॥ इति स्वामिविवेकनन्दविरचितं श्रीरामकृष्णस्तोत्रं सम्पूर्णम्
    ।
