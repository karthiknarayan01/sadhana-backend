id: banakritam2shivastotram
category: stotram
name:
  english: banakritam2shivastotram
  devanagari: बाणकृतं२शिवस्तोत्रम्
content:
  english: banakritam 2 shivastotram bana uvaca | shiva shankara sarvaharaya namo bhavabhitabhayartiharaya
    namah | kusumayudhadehavinashakara pramadapriyakamuka deva namah || 84|| jaya parvatisha paramarthasara
    jaya viracitabhimabhujangahara | jaya nirmalabhasmaviliptagatra jaya mantramula jagadekapatra || 85||
    jaya vishadhara kapilajatakalapa jaya bhairavavidhritapinakacapa | jaya vishamanayanaparimuktasanga
    jaya shankara dhritagangataranga || 86|| jaya bhimarupa khatvangahasta jaya shashishekhara jagatam
    prashasta | jaya suravaresha suralokasara jaya sarvasakalanirdagdhasara || 87|| jaya kirtaniya jagatam
    pavitra jaya vrishanka bahuvidhacaritra | jaya viracitanarakankalamala aghasuradehakankalakala ||
    88|| jaya nilakantha varavrishabhagamana jaya sakalalokaduritanushamana | jaya siddhasurasuravinatacarana
    jaya rudra raudrabhavajaladhitarana || 89|| jaya girisha sureshvaramananiya jaya sukshmarupa sancitaniya
    | jaya dagdhatripura vishvasattva jaya sakalashastraparamarthatattva || 90|| jaya duravabodha samsaratara
    kalikalushamaharnavaghoratara | jaya surasuradevaganesha namo hayavanarasimhagajendramukha || 91||
    atihrasvasthulasudirghatama upalabdhirna shakyate te hyamaraih | pranato'smi niranjana te caranau
    jaya samba sulocana kantihara || 92|| aprapya tvam kimatyantamucchrayi na vinashayet | atipramathi
    ca tada tapo mahatsudarunam || 93|| na putrabandhava dara na samastasuhrijjanah | sankate'bhyupagacchanti
    vrajantamekagaminam || 94|| yadeva karma kaivalyam kritam tena shubhashubham | tadeva sarthavattasya
    bhavatyagre tu gacchatah || 95|| nirdhanasyaiva carato na bhayam vidyate kvacit | dhani bhayairna
    mucyeta dhanam tasmattyajamyaham || 96|| lubdhah papani kurvanti shuddhamsha naiva manavah | shrutva
    dharmasya sarvasvam shrutva caivavadharya tat || 97|| tvam vishnustvam jagannatho brahmarupah sanatanah
    | indrastvam devadevesha suranatha namo'stu te || 98|| tvam kshitirvarunashcaiva pavanastvam hutashanah
    | tvam diksha yajamanashca akasham soma eva ca || 99|| tvam suryastvam tu vittesho yamastvam gurureva
    ca | tvaya vyaptam jagatsarvam trailokyam bhasvata yatha || 100|| iti shriskandapurane avantyakhande
    revakhande ashtavimsha
  devanagari: बाणकृतं २ शिवस्तोत्रम् बाण उवाच । शिव शङ्कर सर्वहराय नमो भवभीतभयार्तिहराय नमः । कुसुमायुधदेहविनाशकर
    प्रमदाप्रियकामुक देव नमः ॥ ८४॥ जय पार्वतीश परमार्थसार जय विरचितभीमभुजङ्गहार । जय निर्मलभस्मविलिप्तगात्र
    जय मन्त्रमूल जगदेकपात्र ॥ ८५॥ जय विषधर कपिलजटाकलाप जय भैरवविधृतपिनाकचाप । जय विषमनयनपरिमुक्तसङ्ग जय
    शङ्कर धृतगाङ्गतरङ्ग ॥ ८६॥ जय भीमरूप खट्वाङ्गहस्त जय शशिशेखर जगतां प्रशस्त । जय सुरवरेश सुरलोकसार जय
    सर्वसकलनिर्दग्धसार ॥ ८७॥ जय कीर्तनीय जगतां पवित्र जय वृषाङ्क बहुविधचरित्र । जय विरचितनरकङ्कालमाल अघासुरदेहकङ्कालकाल
    ॥ ८८॥ जय नीलकण्ठ वरवृषभगमन जय सकललोकदुरितानुशमन । जय सिद्धसुरासुरविनतचरण जय रुद्र रौद्रभवजलधितरण ॥
    ८९॥ जय गिरिश सुरेश्वरमाननीय जय सूक्ष्मरूप सञ्चितनीय । जय दग्धत्रिपुर विश्वसत्त्व जय सकलशास्त्रपरमार्थतत्त्व
    ॥ ९०॥ जय दुरवबोध संसारतार कलिकलुषमहार्णवघोरतार । जय सुरासुरदेवगणेश नमो हयवानरसिंहगजेन्द्रमुख ॥ ९१॥
    अतिह्रस्वस्थूलसुदीर्घतम उपलब्धिर्न शक्यते ते ह्यमरैः । प्रणतोऽस्मि निरञ्जन ते चरणौ जय साम्ब सुलोचन
    कान्तिहर ॥ ९२॥ अप्राप्य त्वां किमत्यन्तमुच्छ्रयी न विनाशयेत् । अतिप्रमाथि च तदा तपो महत्सुदारुणम्
    ॥ ९३॥ न पुत्रबान्धवा दारा न समस्तसुहृज्जनः । सङ्कटेऽभ्युपगच्छन्ति व्रजन्तमेकगामिनम् ॥ ९४॥ यदेव कर्म
    कैवल्यं कृतं तेन शुभाशुभम् । तदेव सार्थवत्तस्य भवत्यग्रे तु गच्छतः ॥ ९५॥ निर्धनस्यैव चरतो न भयं विद्यते
    क्वचित् । धनी भयैर्न मुच्येत धनं तस्मात्त्यजाम्यहम् ॥ ९६॥ लुब्धाः पापानि कुर्वन्ति शुद्धांशा नैव मानवाः
    । श्रुत्वा धर्मस्य सर्वस्वं श्रुत्वा चैवावधार्य तत् ॥ ९७॥ त्वं विष्णुस्त्वं जगन्नाथो ब्रह्मरूपः सनातनः
    । इन्द्रस्त्वं देवदेवेश सुरनाथ नमोऽस्तु ते ॥ ९८॥ त्वं क्षितिर्वरुणश्चैव पवनस्त्वं हुताशनः । त्वं दीक्षा
    यजमानश्च आकाशं सोम एव च ॥ ९९॥ त्वं सूर्यस्त्वं तु वित्तेशो यमस्त्वं गुरुरेव च । त्वया व्याप्तं जगत्सर्वं
    त्रैलोक्यं भास्वता यथा ॥ १००॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे अष्टाविंशा
