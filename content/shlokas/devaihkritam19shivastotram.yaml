id: devaihkritam19shivastotram
category: stotram
name:
  english: devaihkritam19shivastotram
  devanagari: देवैःकृतं१९शिवस्तोत्रम्
content:
  english: devaih kritam 19 shivastotram deva ucuh | jaya tvam devadevesha jayomardhashariradhrik | vrishasana
    mahabaho shashankakritabhushana || 17|| namah shulagrahastaya namah khatvangadharine | jaya bhutapate
    deva dakshayajnavinashana || 18|| pancakshara namo deva pancabhutatmavigraha | pancavaktramayeshana
    vedaistvam tu pragiyase || 19|| srishtipalanasamharamstvam sada kurushe namah | ashtamurte smarahara
    smara satyam yatha stutah || 20|| pancatmika tanurdeva brahmanaiste pragiyate | sadyo vame tathaghore
    isho tatpurushe tatha || 21|| hemajale suvistirne hamsavatkujase hara | iti shriskandapurane avantyakhande
    revakhande shadvimsha
  devanagari: देवैः कृतं १९ शिवस्तोत्रम् देवा ऊचुः । जय त्वं देवदेवेश जयोमार्धशरीरधृक् । वृषासन महाबाहो
    शशाङ्ककृतभूषण ॥ १७॥ नमः शूलाग्रहस्ताय नमः खट्वाङ्गधारिणे । जय भूतपते देव दक्षयज्ञविनाशन ॥ १८॥ पञ्चाक्षर
    नमो देव पञ्चभूतात्मविग्रह । पञ्चवक्त्रमयेशान वेदैस्त्वं तु प्रगीयसे ॥ १९॥ सृष्टिपालनसंहारांस्त्वं
    सदा कुरुषे नमः । अष्टमूर्ते स्मरहर स्मर सत्यं यथा स्तुतः ॥ २०॥ पञ्चात्मिका तनुर्देव ब्राह्मणैस्ते
    प्रगीयते । सद्यो वामे तथाघोरे ईशो तत्पुरुषे तथा ॥ २१॥ हेमजाले सुविस्तीर्णे हंसवत्कूजसे हर । इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे रेवाखण्डे षड्विंशा
meaning: {}
