name:
  english: brahmanaspatisuktam (rigvediya)
  devanagari: ब्रह्मणस्पतिसूक्तम् (ऋग्वेदीय)
content:
  english: 03|| 56 yo a̭smai ha̱vyairghri̱tava̭dbhi̱ravi̭dha̱tpra tam pra̱ca na̭yati̱ brahma̭na̱spati̭h
    | u̱ru̱shyati̱mamha̭so̱ raksha̭ti ri̱sho̱m3̱̭'hoshci̭dasma uru̱cakri̱radbhṷtah || 2
  devanagari: ०३॥ ५६ यो अ॑स्मै ह॒व्यैर्घृ॒तव॑द्भि॒रवि॑ध॒त्प्र तं प्रा॒चा न॑यति॒ ब्रह्म॑ण॒स्पतिः॑ । उ॒रु॒ष्यती॒मंह॑सो॒
    रक्ष॑ती रि॒षों॒३॒॑ऽहोश्चि॑दस्मा उरु॒चक्रि॒रद्भु॑तः ॥ २
