id: sarasvatastotramkaushikabrahmanenarakshasayaproktam
category: stotram
name:
  english: sarasvatastotramkaushikabrahmanenarakshasayaproktam
  devanagari: सारस्वतस्तोत्रंकौशिकब्राह्मणेनराक्षसायप्रोक्तम्
content:
  english: kaushikabrahmanena rakshasaya proktam sarasvatastotram shruyatam tava yacchreyastathanyesham
    ca papinam | samastapapashuddhyartham punyopacayadam ca yat || 41|| pratarutthaya satatam madhyahne'hnahkshaye'pi
    va | ayam shastah sada japah sarvapapopashantidah || 42|| harim krishnam hrishikesham vasudevam janardanam
    | pranato'smi jagannatham sa me papam vyapohatu || 43|| vishveshvaramajam vishnumaprameyaparakramam
    | pranato'smi prajapalam sa me papam vyapohatu || 44|| vishnumacyutamishanamanantamaparajitam | pranato'smi
    mahatmanam sa me papam vyapohatu || 45|| caracaragurum natham govindam sheshashayinam | pranato'smi
    param devam sa me papam vyapohatu || 46|| govardhanadharam dhiram gobrahmanahite sthitam | pranato'smi
    gadapanim sa me papam vyapohatu || 47|| shankhinam cakrinam shantam sharnginam sragdharam param |
    pranato'smi patim lakshmyah sa me papam vyapohatu || 48|| damodaramudaraksham pundarikakshamavyayam
    | pranato'smi stutam stutyaih sa me papam vyapohatu || 49|| narayanam naram shaurim madhavam madhusudanam
    | pranato'smi dharadharam sa me papam vyapohatu || 50|| keshavam keshihantaram kamsarishtanisudanam
    | pranato'smi caturbahum sa me papam vyapohatu || 51|| shrivatsavakshasam shrisham shridharam shriniketanam
    | pranato'smi shriyah kantam sa me papam vyapohatu || 52|| yamisham sarvabhutanam dhyayanti yatayo'ksharam
    | vasudevamanirdeshyam tamasmi sharanam gatah || 53|| samastalambanebhyo'yam samhritya manaso gatim
    | dhyayanti vasudevakhyam tamasmi sharanam gatah || 54|| sarvagam sarvabhutam ca sarvasyadharamishvaram
    | vasudevam param brahma tamasmi sharanam gatah || 55|| paramatmanamavyaktam yam prayanti sumedhasah
    | karmakshaye'kshayam devam tamasmi sharanam gatah || 56|| punyapapavinirmukta yam pravishya punarbhavam
    | na yoginah prapnuvanti tamasmi sharanam gatah || 57|| brahma bhutva jagatsarvam sadevasuramanusham
    | yah srijatyacyuto devastamasmi sharanam gatah || 58|| brahmatve yasya vaktrebhyashcaturvedamayam
    vapuh | sutam prabho pura jajne tamasmi sharanam gatah || 59|| brahmarupadharam devam jagadyonim janardanam
    | srashtritve samsthitam srishtau pranato'smi sanatanam || 60|| yah pati srishtam ca vibhuh sthitavasurasudanah
    | tamadipurusham vishnum pranato'smi sanatanam || 61|| dhrita mahi hata daityah paritratastathamarah
    | yena tam vishnumadyesham pranato'smi sanatanam || 62|| yajnairyajanti yam vipra yajnesham yajnabhavanam
    | tam yajnapurusham vishnum pranato'smi sanatanam || 63|| varnashramansthitavadyo yah sthapayati vartmani
    | tamadipurusham vishnum pranato'smi sanatanam || 64|| kalpante rudrarupo yah samharatyakhilam jagat
    | tamadipurusham vishnum pranato'smi janardanam || 65|| patalavithibhuradimstatha lokanbibharti yah
    | tamantapurusham vishnum pranato'smi janardanam || 66|| sambhakshayitva sakalam yatha srishtamidam
    jagat | yo nrityatyatiraudratma pranato'smi janardanam || 67|| surasurah pitrigana yakshagandharvarakshasah
    | yasyamshabhuta devasya sarvagam tam namamyaham || 68|| samastadevah sakala manushanam ca jatayah
    | yasyamshabhuta devasya sarvagam tam namamyaham || 69|| vrikshagulmadayo yasya tatha pashumrigadayah
    | ekamshabhuta devasya sarvagam tam namamyaham || 70|| yasmannanyatparam kincidyasminsarvam mahatmani
    | yah sarvamavyayo'nantah sarvagam tam namamyaham || 71|| yatha sarveshu bhuteshu sthavareshu careshu
    ca | vishnureva tatha papam mamashesham pranashyatu || 72|| yatha vishnumayam sarvam yatsarvendriyagocaram
    | yacca jnanaparicchedyam papam nashyatu me tatha || 73|| pravrittam ca nivrittam ca karma vishnumayam
    yatha | anekajanmakarmottham papam nashyatu me tatha || 74|| yannishayam tatha prataryacca madhyaparahnayoh
    | sandhyayoshca kritam papam karmana manasa gira || 75|| tishthata vrajata yacca shayyasanagatena
    ca | kritam yadashubham karma kayena manasa gira || 76|| ajnanato jnanato va vasudevasya kirtanat
    | tatsarvam vilayam yatu toyastham lavanam yatha || 77|| paradaraparadravyavanchadrohodbhavam ca yat
    | paripidodbhavam nindam kurvato yanmahatmanam || 78|| yacca bhojye tatha peye yacca kanduyanadishu
    | tadyatu vilayam toye yatha lavanabhajanam || 79|| yadbalye yacca kaumare yatpapam yauvane mama |
    vayahparinatau yacca yacca janmantareshu me || 80|| tannarayanagovindaharikrishneshakirtanat | prayatu
    vilayam toye yatha lavanabhajanam || 81|| vishnave vasudevaya haraye keshavaya ca | janardanaya krishnaya
    namo bhuyo namo namah || 82|| idam sarasvatam stotramasheshaghavinashanam | pathatam sha
  devanagari: कौशिकब्राह्मणेन राक्षसाय प्रोक्तं सारस्वतस्तोत्रम् श्रूयतां तव यच्छ्रेयस्तथान्येषां च पापिनाम्
    । समस्तपापशुद्ध्यर्थं पुण्योपचयदं च यत् ॥ ४१॥ प्रातरुत्थाय सततं मध्याह्नेऽह्नःक्षयेऽपि वा । अयं शस्तः
    सदा जापः सर्वपापोपशान्तिदः ॥ ४२॥ हरिं कृष्णं हृषीकेशं वासुदेवं जनार्दनम् । प्रणतोऽस्मि जगन्नाथं स
    मे पापं व्यपोहतु ॥ ४३॥ विश्वेश्वरमजं विष्णुमप्रमेयपराक्रमम् । प्रणतोऽस्मि प्रजापालं स मे पापं व्यपोहतु
    ॥ ४४॥ विष्णुमच्युतमीशानमनन्तमपराजितम् । प्रणतोऽस्मि महात्मानं स मे पापं व्यपोहतु ॥ ४५॥ चराचरगुरुं
    नाथं गोविन्दं शेषशायिनम् । प्रणतोऽस्मि परं देवं स मे पापं व्यपोहतु ॥ ४६॥ गोवर्धनधरं धीरं गोब्राह्मणहिते
    स्थितम् । प्रणतोऽस्मि गदापाणिं स मे पापं व्यपोहतु ॥ ४७॥ शङ्खिनं चक्रिणं शान्तं शार्ङ्गिणं स्रग्धरं
    परम् । प्रणतोऽस्मि पतिं लक्ष्म्याः स मे पापं व्यपोहतु ॥ ४८॥ दामोदरमुदाराक्षं पुण्डरीकाक्षमव्ययम् ।
    प्रणतोऽस्मि स्तुतं स्तुत्यैः स मे पापं व्यपोहतु ॥ ४९॥ नारायणं नरं शौरिं माधवं मधुसूदनम् । प्रणतोऽस्मि
    धराधारं स मे पापं व्यपोहतु ॥ ५०॥ केशवं केशिहन्तारं कंसारिष्टनिसूदनम् । प्रणतोऽस्मि चतुर्बाहुं स मे
    पापं व्यपोहतु ॥ ५१॥ श्रीवत्सवक्षसं श्रीशं श्रीधरं श्रीनिकेतनम् । प्रणतोऽस्मि श्रियः कान्तं स मे पापं
    व्यपोहतु ॥ ५२॥ यमीशं सर्वभूतानां ध्यायन्ति यतयोऽक्षरम् । वासुदेवमनिर्देश्यं तमस्मि शरणं गतः ॥ ५३॥
    समस्तालम्बनेभ्योऽयं संहृत्य मनसो गतिम् । ध्यायन्ति वासुदेवाख्यं तमस्मि शरणं गतः ॥ ५४॥ सर्वगं सर्वभूतं
    च सर्वस्याधारमीश्वरम् । वासुदेवं परं ब्रह्म तमस्मि शरणं गतः ॥ ५५॥ परमात्मानमव्यक्तं यं प्रयान्ति सुमेधसः
    । कर्मक्षयेऽक्षयं देवं तमस्मि शरणं गतः ॥ ५६॥ पुण्यपापविनिर्मुक्ता यं प्रविश्य पुनर्भवम् । न योगिनः
    प्राप्नुवन्ति तमस्मि शरणं गतः ॥ ५७॥ ब्रह्मा भूत्वा जगत्सर्वं सदेवासुरमानुषम् । यः सृजत्यच्युतो देवस्तमस्मि
    शरणं गतः ॥ ५८॥ ब्रह्मत्वे यस्य वक्त्रेभ्यश्चतुर्वेदमयं वपुः । सूतं प्रभो पुरा जज्ञे तमस्मि शरणं गतः
    ॥ ५९॥ ब्रह्मरूपधरं देवं जगद्योनिं जनार्दनम् । स्रष्टृत्वे संस्थितं सृष्टौ प्रणतोऽस्मि सनातनम् ॥ ६०॥
    यः पाति सृष्टं च विभुः स्थितावसुरसूदनः । तमादिपुरुषं विष्णुं प्रणतोऽस्मि सनातनम् ॥ ६१॥ धृता मही हता
    दैत्याः परित्रातास्तथामराः । येन तं विष्णुमाद्येशं प्रणतोऽस्मि सनातनम् ॥ ६२॥ यज्ञैर्यजन्ति यं विप्रा
    यज्ञेशं यज्ञभावनम् । तं यज्ञपुरुषं विष्णुं प्रणतोऽस्मि सनातनम् ॥ ६३॥ वर्णाश्रमान्स्थितावाद्यो यः स्थापयति
    वर्त्मनि । तमादिपुरुषं विष्णुं प्रणतोऽस्मि सनातनम् ॥ ६४॥ कल्पान्ते रुद्ररूपो यः संहरत्यखिलं जगत् ।
    तमादिपुरुषं विष्णुं प्रणतोऽस्मि जनार्दनम् ॥ ६५॥ पातालवीथीभूरादींस्तथा लोकान्बिभर्ति यः । तमन्तपुरुषं
    विष्णुं प्रणतोऽस्मि जनार्दनम् ॥ ६६॥ सम्भक्षयित्वा सकलं यथा सृष्टमिदं जगत् । यो नृत्यत्यतिरौद्रात्मा
    प्रणतोऽस्मि जनार्दनम् ॥ ६७॥ सुरासुराः पितृगणा यक्षगन्धर्वराक्षसाः । यस्यांशभूता देवस्य सर्वगं तं नमाम्यहम्
    ॥ ६८॥ समस्तदेवाः सकला मानुषाणां च जातयः । यस्यांशभूता देवस्य सर्वगं तं नमाम्यहम् ॥ ६९॥ वृक्षगुल्मादयो
    यस्य तथा पशुमृगादयः । एकांशभूता देवस्य सर्वगं तं नमाम्यहम् ॥ ७०॥ यस्मान्नान्यत्परं किञ्चिद्यस्मिन्सर्वं
    महात्मनि । यः सर्वमव्ययोऽनन्तः सर्वगं तं नमाम्यहम् ॥ ७१॥ यथा सर्वेषु भूतेषु स्थावरेषु चरेषु च । विष्णुरेव
    तथा पापं ममाशेषं प्रणश्यतु ॥ ७२॥ यथा विष्णुमयं सर्वं यत्सर्वेन्द्रियगोचरम् । यच्च ज्ञानपरिच्छेद्यं
    पापं नश्यतु मे तथा ॥ ७३॥ प्रवृत्तं च निवृत्तं च कर्म विष्णुमयं यथा । अनेकजन्मकर्मोत्थं पापं नश्यतु
    मे तथा ॥ ७४॥ यन्निशायां तथा प्रातर्यच्च मध्यापराह्णयोः । सन्ध्ययोश्च कृतं पापं कर्मणा मनसा गिरा ॥
    ७५॥ तिष्ठता व्रजता यच्च शय्यासनगतेन च । कृतं यदशुभं कर्म कायेन मनसा गिरा ॥ ७६॥ अज्ञानतो ज्ञानतो वा
    वासुदेवस्य कीर्तनात् । तत्सर्वं विलयं यातु तोयस्थं लवणं यथा ॥ ७७॥ परदारपरद्रव्यवाञ्छाद्रोहोद्भवं च
    यत् । परिपीडोद्भवं निन्दां कुर्वतो यन्महात्मनाम् ॥ ७८॥ यच्च भोज्ये तथा पेये यच्च कण्डूयनादिषु । तद्यातु
    विलयं तोये यथा लवणभाजनम् ॥ ७९॥ यद्बाल्ये यच्च कौमारे यत्पापं यौवने मम । वयःपरिणतौ यच्च यच्च जन्मान्तरेषु
    मे ॥ ८०॥ तन्नारायणगोविन्दहरिकृष्णेशकीर्तनात् । प्रयातु विलयं तोये यथा लवणभाजनम् ॥ ८१॥ विष्णवे वासुदेवाय
    हरये केशवाय च । जनार्दनाय कृष्णाय नमो भूयो नमो नमः ॥ ८२॥ इदं सारस्वतं स्तोत्रमशेषाघविनाशनम् । पठतां
    श
