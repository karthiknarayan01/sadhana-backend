id: sri-ramachandra-krupalu
category: stotram
name:
  english: Sri Ramachandra Krupalu
content:
  english: shri ramacandra kripalu bhaju mana harana bhava bhaya darunam | navakanja locana kanja mukha
    kara kanja pada kanjarunam || || kandarpa aganita amita chavi nava nila nirada sundaram | vatapita
    manahu tadita ruci shuci naumi janaka sutavaram || || bhaju dina bandhu dinesha danava daityavamshanikandanam
    | raghunanda anandakanda kaushala canda dasharatha nandanam || || shira mukuta kundala tilaka caru
    udara anga vibhushanam | ajanubhuja sharacapadhara sangrama jita kharadushanam || || iti vadati tulasidasa
    shankara shesha muni manaranjanam | mama hridayakanja nivasa kuru kamadikhaladalamanjanam || || chanda
    manu jahi raceyu milahi so varu sahaja sundara samvaro | karuna nidhana sujana shilu sneha janata
    ravaro || || ehi bhanti gauri asisa suna siya sahita hiya harashita ali | tulasi bhavanihi puji puni
    puni mudita mana mandira cali || || soratha jani gauri anukula siya hiya harashu na jai kahi | manjula
    mangala mula vama anga pharakana lage ||
  devanagari: श्री रामचन्द्र कृपालु भजु मन हरण भव भय दारुणम् । नवकञ्ज लोचन कञ्ज मुख कर कञ्ज पद कञ्जारुणम्
    ॥ ॥ कन्दर्प अगणित अमित छवि नव नील नीरद सुन्दरम् । वटपीत मानहु तडित रुचि शुचि नौमि जनक सुतावरम् ॥ ॥
    भजु दीन बन्धु दिनेश दानव दैत्यवंशनिकन्दनम् । रघुनन्द आनन्दकन्द कौशल चन्द दशरथ नन्दनम् ॥ ॥ शिर मुकुट
    कुण्डल तिलक चारु उदार अङ्ग विभूषणम् । आजानुभुज शरचापधर सङ्ग्राम जित खरदूषणम् ॥ ॥ इति वदति तुलसीदास
    शङ्कर शेष मुनि मनरञ्जनम् । मम हृदयकञ्ज निवास कुरु कामादिखलदलमञ्जनम् ॥ ॥ छन्द मनु जाहि राचेयु मिलहि
    सो वरु सहज सुन्दर सांवरो । करुणा निधान सुजान शीलु स्नेह जानत रावरो ॥ ॥ एहि भान्ति गौरी असीस सुन सिय
    सहित हिय हरषित अली । तुलसी भवानिहि पूजी पुनि पुनि मुदित मन मन्दिर चली ॥ ॥ सोरठा जानी गौरी अनुकूल सिय
    हिय हरषु न जाइ कहि । मञ्जुल मङ्गल मूल वाम अङ्ग फरकन लगे ॥
