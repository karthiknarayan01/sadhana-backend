id: acyutashtakam-shridharavenkateshakritam
category: stotram
name:
  english: acyutashtakam (shridharavenkateshakritam)
  devanagari: अच्युताष्टकम् (श्रीधरवेङ्कटेशकृतम्)
content:
  english: miyan govindakhye vada vasanarashistava kutah || 4|| adhirasanamayi tvamacyutakhye dadhanam
    vanajabhavamukhanam vandyamahurmahantah | satu vinamati matashcashvagoshvadanadin bhavati nanu vicitra
    paddhatistavakanam || 5|| janani murabhidakhye jahnavinimnagaika samajani padapadmaccakrinastvashritanam
    | parinamati samastah padavarghindureko jagati nanu tatinyo jahnavisahyajadyah || 6|| samavahitamapashyan
    sannidhau vainateyam prasabhavidhutapadmapanirisho'cyutakhye | samavitumupanitah sagajendram tvaya
    drak vada janani vina tvam kena va kim tadabhut || 7|| yadesha staumi tvam triyugacaranatrayini tato
    mahimnah ka hanistavatu mama sampanniravadhih | shuna lilakamam bhavati surasindhurbhagavati tadesha
    kimbhuta satu sapadi santapabharitah || 8|| iti shrishridharavenkatesharyakritau acyutashtakam sampurnam
    ||
  devanagari: मियान् गोविन्दाख्ये वद वसनराशिस्तव कुतः ॥ ४॥ अधिरसनमयि त्वामच्युताख्ये दधानं वनजभवमुखानां
    वन्द्यमाहुर्महान्तः । सतु विनमति मातश्चाश्वगोश्वादनादीन् भवति ननु विचित्रा पद्धतिस्तावकानाम् ॥ ५॥
    जननि मुरभिदाख्ये जाह्नवीनिम्नगैका समजनि पदपद्माच्चक्रिणस्त्वाश्रितानाम् । परिणमति समस्ताः पादवार्घिन्दुरेको
    जगति ननु तटिन्यो जाह्नवीसह्यजाद्याः ॥ ६॥ समवहितमपश्यन् सन्निधौ वैनतेयं प्रसभविधुतपद्मापाणिरीशोऽच्युताख्ये
    । समवितुमुपनीतः सागजेन्द्रं त्वया द्राक् वद जननि विना त्वां केन वा किं तदाभूत् ॥ ७॥ यदेष स्तौमि त्वां
    त्रियुगचरणत्रायिणि ततो महिम्नः का हानिस्तवतु मम सम्पन्निरवधिः । शुना लीलाकामं भवति सुरसिन्धुर्भगवती
    तदेषा किम्भूता सतु सपदि सन्तापभरितः ॥ ८॥ इति श्रीश्रीधरवेङ्कटेशार्यकृतौ अच्युताष्टकं सम्पूर्णम् ॥
meaning: {}
