id: namavali-73
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: lam prithivyatmane gandham kalpayami | ham akashatmane pushpani kalpayami | yam vayvatmane
    dhupam kalpayami | ram agnyatmane dipam kalpayami | vam amritatmane amritam mahanaivedyam kalpayami
    | sam sarvatmane tambuladi sarvopacarapujan kalpayami | om acintyashaktiranagho hyakshobhyah tvaparajitah
    | anathavatsalo'moghah tvashoko hyajaro'bhayah || 1|| atyudaro hyaghaharah tvagraganyo'drijasutah
    | anantamahima'paro'nantasaukhyo'nnado'vyayah || 2|| anuttamo'kshayo'nadiraprameyo'ksharo'cyutah |
    akalmasho'bhiramo'gradhuryah tvamitavikramah || 3|| atulashcamrito'ghoro hyananto'nantavikramah |
    anathanatho hyamalo hyapramatto'maraprabhuh || 4|| arindamo'khiladharo hyanimadigunagranih | acancalo'marastutyo'hyakalankah
    tvamitashanah || 5|| agnibhuranavadyango hyadbhuto'bhishtadayakah | atindriyo'prameyatma hyadrishyo'vyaktalakshanah
    || 6|| apadvinashanashcarya adhya agamasamstutah | artasamrakshanashcadya anandi aryasevitah || 7||
    ashriteshtarthavarada anandarthaphalapradah | ashcaryarupashcananda apannartivinashanah || 8|| aradhitapadadvandva
    agamarthavisharadah | anandasundarakara abrahmastambharupakah || 9|| adharashatkanilaya adimadhyantavarjitah
    | abrahmakitajanaka akhandalasudhadipah || 10|| ibhavaktranujo'pishta ibhasuraharatmajah | itihasasusamstutya
    indrabhogaphalapradah || 11|| ishtapurtaphalapraptirishteshtavaradayakah | ihamutreshtaphalada ishtadah
    tvindravanditah || 12|| idaniyah tvishaputra ipsitarthapradayakah | itibhitiharah tvidya ishanatrayavarjitah
    || 13|| ishvararpitavedartha ishvarapriyanandanah | ishvarankavihari ceshita ceshvararupaghrit ||
    14|| udarakirtirudyogi cotkrishtoruparakramah | utkrishtashaktirutsaha udarashcotsavapriyah || 15||
    ujjrimbha udbhavashcogra udagrashcogralocanah | unmatta ugrashamana udvegaghnorageshvarah || 16||
    uruprabhavashcodirna umasunurudaradhih | udagravaibhavodagrabuddhidograhetiman || 17|| urdhvaretassutashcordhvagatidashcormipalakah
    | urjitashcordhvagashcordhva urdhvalokaikanayakah || 18|| urjavanurjitodara urjitorjitashasanah |
    urikritadhanurbana urmishatkavinashanah || 19|| rishidevaganastutya rinatrayavimocanah | rijurupo
    hyrijukara rijumargapradarshakah || 20|| ritambhara rijuprita rishabho riddhishca rik | rigvedadisvarupashca
    riddhatma rishipujitah || 21|| rilekhavattrinadyantassushumnanadimadhyagah | rikritsvapnadyajagrantamadhyo
    hyritambharatmakah || 22|| lilitoddharako libdhajanaduro linamakah | liptacaramanoduro liptaduhkho
    liḻatprabhah || 23|| linamayasuro linasamsarakhyamahavanah | enankadharasatputra eka enaughanashanah
    || 24|| ekagradhyanashilashcapyokantadhyanapujitah | aishvaryadashcaindrabhogi caitihyashcaindravanditah
    || 25|| aishanapadasandayi caindradikpalajadhipah | ojasvi caushadhisthanamojodashcaudanapradah ||
    26|| onkararupicaunkara onkararthavisharadah | audaryashilashcaumeya augra aunnatyadayakah || 27||
    audaryah tvaushadhakara aushadhancaushadhakarah | amshumanamshumalidya ambikatanayo'nnadah || 28||
    andhakarisuto'ndhatvahari cambujalocanah | astamayah tvarpanararhah tvaspashto'stokapunyadah || 29||
    astamitro'starupashcapyaskhaladgatidayakah | kartikeyah kamarupah kumarah krauncadaranah || 30|| kamadah
    karanam kamyah kamaniyah kripakarah | kancanabhah kantiyuktah kamah kamapradah kavih || 31|| kirtikritkukkutadharah
    kutasthah kuvalekshanah | kunkumangah klamaharah kushalah kukkutadhvajah || 32|| krishanusambhavah
    krurah kruraghnah kalitapahrit | kamarupah kalpataruh kantah kamitadayakah || 33|| kalyanakritkleshanashah
    kripaḻuh karunakarah | kalushaghnah kriyashaktah kathorah kavaci kriti || 34|| komalangah kuhupritah
    kutsitaghnah kaladharah | khyatah khetadharah khadgi khatvangi khalanigrahah || 35|| khyatipradah
    khecareshah khyatainah khecarastutah | kharatapaharah khasthah khecarah khecarashrayah || 36|| khandendumaulitanayah
    khelakhecarapalakah | khasthapriyah khanditadyah khecarijanapujitah || 37|| khetadyayudhasampannah
    kharvetarapadapradah | gangeyo girijaputro gananathanujo guhah || 38|| gopta girvanasamsevyo gunatito
    guhashrayah | gatiprado gunanidhirgambhiro girijatmajah || 39|| gudharupo gadaharo grahadhisho ganagranih
    | godharo gahano gupto garvaghno gunavarddhanah || 40|| guhyo gunajno gitijno gatatanko gunottarah
    | gadyapadyapriyo ganyo gostuto gaganecarah || 41|| gananiyacaritrashca gataklesho guhashrayah | ghurnitaksho
    ghrininidhih ghanagambhiraghoshanah || 42|| ghantanadapriyo ghosho ghoraghaughavinashanah | ghanapriyo
    ghananando ghrinavan ghrishtipatakah || 43|| ghrinarghrinakaro ghoro ghoradaityapraharakah | ghatitaishvaryasandoho
    ghanarddhirghanavikramah || 44|| ghrinimandalarupashca ghanasampatprado ghanah | nakarasvaranassarvarandhrasthatriputiprabhah
    || 45|| nanadghantaravantastho nanaravatatipriyah | nakarakarakadvandvasarvasandhyaptacinmayah ||
    46|| citrakriccitravarnashca cancalashcapaladyutih | cinmayashcitsvarupashca cidanandah cirantanah
    || 47|| citrakelih citratarah cintaniyah camatkritih | coraghnah caturah caruh camikaravibhushanah
    || 48|| candrarkakotisadrishah candramaulitanudbhavah | cetibhutaprapancashca candashcandoruvikramah
    || 49|| chaditangashchadmahanta cheditakhilapatakah | chedikritamahakleshah chetrikritamahayashah
    || 50|| cheditasheshasantapah churitanikasagarah | cheditasheshadaityaughah chatainashchinnasamshayah
    || 51|| chandomayashchandagami chinnapashah chavicchadah | cheditasheshasamsarah chavyagninduvilocanah
    || 52|| jagaddhito jagatpujyo jagajjyeshtho jaganmayah | janako jahnavisunurjitamitro jagadguruh ||
    53|| jayi jitendriyo jeta jaramaranavarjitah | jyotirmayo jagannatho jagajjivo janashrayah || 54||
    jagatvandyo jagacchreshtho jitaklesho jagadvibhuh | jagatsevyo jagatkarta jagatsakshi jagatpriyah
    || 55|| jambharivandyo jayado jaganjanamanoharah | jagadanandajanako janajadyapaharakah || 56|| japakusumasankasho
    janalocanashobhanah | janeshvaro jagadbhavyo janajanmanibarhanah || 57|| jayado jantutapaghno jitadaityamahapathah
    | jitamayo jitakrodho jitasango janapriyah || 58|| jhanjhanilamahavego jhatitasheshapatakah | jharjharikritadaityaugho
    jhallarivadyasupriyah || 59|| jnanamurtirjnanagamyo jnani jnanamahanidhih | jnanopadeshakarta ca jnanado
    jnanadeshikah || 60|| tankaranrittavibhavashtankavajradhvajankitah | tankitakhilalokashca tankitainastamoravih
    || 61|| thakaramadhyanilayashthavarnakaramandalah | thapadantashshruyamananadarupashthakarakah ||
    62|| dambaraprabhavo dambho damaddamarukapriyah | damarotkatasannado dimbharupasvarupakah || 63||
    dhakkanadapritikaro dhalitasurasankulah | dhaukitamarasandoho dhundhivighneshvaranujah || 64|| nakarabindudvandvaikyajnanenashcaryakarakah
    | nabindutrayavanmadyabindvashlishtadvivallikah || 65|| tattvajnah tattvagah tivavrah taporupah tapomayah
    | trayimayah trikalajnah strimurtih trigunatmakah || 66|| tridasheshah tarakarih tapaghnah tapasapriyah
    | tushtidah tushtikrittikshnah taporupah trikalavit || 67|| stota stavyah stavapritah stutih stotram
    stavapriyah | tareshapujitah tathyah tumburunaradarcitah || 68|| sthirah sthayi sthapakashca sthulasukshmapradarshakah
    | sthavishthah sthavirah sthulah sthanadah sthairyadah sthirah || 69|| danto dayaparo data duritaghno
    durasadah | darshaniyo dayasaro devadevo dayanidhih || 70|| duradharsho durvigahyo daksho darpanashobhitah
    | durdharo danashurashca dvadashaksho dvishadbhujah || 71|| dvishatkarno dvishannetro dinasantapanashanah
    | dandashukeshvaro devo divyo divyakritirdamah || 72|| dirghaprishtho dirghabahurdirghadrishtirdivaspatih
    | dando damayita darpo devasimho dridhavratah || 73|| durlabho durgamo dipto dushprekshyo divyamangalah
    | durodaraghno duhkhaghno durarighno dishampatih || 74|| durjayo devasenesho durjneyo duratikramah
    | dambho driptashca devarshirdaivajno daivacintakah || 75|| dhurandharo dharmaparo dhanado dhritivardhanah
    | dharmesho dharmashastrajno dhanvi dharmaparayanah || 76|| dhanadhyaksho dhanapatirdhritimandhutakilbishah
    | dharmaheturdharmagururdharmakriddharmavid dhruvah || 77|| dhata dhimandharmacari dhanyo dhuryo dhritavratah
    | dharitrimandaladhyaksho dhanadhanyavivardhanah || 78|| nityotsavo nityatripto nirlepo nishcalatmakah
    | niravadyo niradharo nishkalanko niranjanah || 79|| nirmamo nirahankaro nirmoho nirupadravah | nityanando
    niratanko nishprapanco niramayah || 80|| niravadyo nirihashca nirdvandvo nirmalatmakah | nirajaksho
    nirjaresho nissango nigamastutah || 81|| nishkantako niralambo nishpratyuho nirudbhavah | nityo niyatakalyano
    nirvikalpo nirashrayah || 82|| neta nidhirnaikarupo nirakaro nadisutah | nanayudhadharo natho nanasamrajyadayakah
    || 83|| nagapashadharo nandi naradadisupujitah | natyotsuko nadisunurnagaripriyadayakah || 84|| nakshatrarupi
    nakshatram neta nityosuko natah | nirmalo nirahankaro nityabhishtaphalapradah || 85|| pulindakanyaramanah
    purujitparamapriyah | pratyakshamurtih pratyakshah pareshah purnapunyadah || 86|| punyakarah punyarupah
    punyah punyaparayanah | punyodayah paranjyotih punyakritpunyavardhanah || 87|| paranandah paratarah
    punyakirtih puratanah | prasannarupah praneshah pannagah papanashanah || 88|| pranatartiharah purnah
    parvatinandanah prabhuh | putatma purushah pranah prabhavah purushottamah || 89|| prasannah paramashreshthah
    patah parivridhah parah | paramatma parabrahma pararddhih priyadarshanah || 90|| pavitrah pushtidah
    purtih pingalah pushtivardhanah | papaghnah pashahastashca pramattasurashikshakah || 91|| pavanah
    pavakah pujyah purnanandah paratparah | pushkarah pravarah purvah pitribhaktapurogamah || 92|| pranadah
    pranijanakah pratishtha pavakodbhavah | parabrahmasvarupashca paramaishvaryakaranam || 93|| pararddhidah
    pushtikarah prakashatma pratapavan | prajnakarah prakrishtarthah prithuh prithuparakramah || 94||
    putanajivaharanajamata purnavigrahah | phanishvarah phanivarah phanamanivibhushitah || 95|| phaladah
    phalahastashca phullambujavilocanah | phaduccatitapapaughah phanilokavibhushanah || 96|| phanisanghadarapitanijavanirasamritah
    | bahuleyo brihadrupo balishtho balavan balah || 97|| brahmeshavishnurupashca buddhirbuddhimatam varah
    | balarupo brihadgarbho brahmacari budhapriyah || 98|| bahushruto bahumato brahmanyo brahmanapriyah
    | balapramathano brahma bahurupo bahupradah || 99|| brihadbhanutanudbhuto brihadbahurbileshayah |
    bahubahurbalashrimanbahudaityavinashakah || 100|| biladvarantaralastho brihacchaktidhanurdharah |
    balarkadyutiman balo brihadvaksha brihaddhanuh || 101|| baddhatuniramsadesho baddhapashavimocanah
    | bhavyo bhogishvaro bhavyo bhavanasho bhavapriyah || 102|| bhaktigamyo bhayaharo bhavajno bhajanapriyah
    | bhuktimuktiprado bhogi bhagavanbhagyavardhanah || 103|| bhrajishnurbhavano bharta bhimo bhimaparakramah
    | bhutido bhutikridbhokta bhutatma bhuvaneshvarah || 104|| bhavuko bhikaro bhishmo bhavukeshto bhavodbhavah
    | bhavatapaprashamano bhogavan bhutabhavanah || 105|| bhojyaprado bhrantinasho bhanuman bhuvanashrayah
    | bhuribhogaprado bhadro bhajaniyo bhishagvarah || 106|| bhakteshtadananirato bhargabadyabhivanditah
    | mahaseno mahodaro mahashaktirmahadyutih || 107|| mahabuddhirmahaviryo mahotsaho mahabalah | mahabhago
    mahamayi medhavi mekhali mahan || 108|| munistuto mahamanyo mahanando mahayashah | mahorjito mananidhirmanorathaphalapradah
    || 109|| mahodayo mahapunyo mahabalaparakramah | manado matido mani muktamalavibhushanah || 110||
    manoharo mahamukhyo maharddhirmurtimanmunih | mahottamo mahopayo mokshado mangalapradah || 111|| mudakaro
    muktidata mahabhogo mahoragah | yashaskaro yogayoniryogishtho yaminam varah || 112|| yashasvi yogapurusho
    yogyo yoganidhiryami | yamisevyo yogayukto yogavidyogasiddhidah || 113|| yanta yantri ca yantrajno
    yantravanyantranayakah | yatanarahito yogi yogisho yoginam varah || 114|| yogaradhyapadadvando yamadyashtangasadhakah
    | ramaniyo ramyarupo rasajno rasabhavukah || 115|| ranjano ranjito ragi rujari rudrasambhavah | ranapriyo
    ranodaro ragadveshavinashanah || 116|| ratnarci ruciro ramyo rupalavanyavigrahah | ratnangadadharo
    ratnabhushano ramaniyakah || 117|| rucikridrocamanashca ranjito roganashanah | rajivaksho rajarajo
    raktamalyanulepanah || 118|| rajadvedagamastutyo rajassattvagunanvitah | rajanishakalaramyo ratnakundalamanditah
    || 119|| ratnasanmaulishobhadhyo rananmanjirabhushanah | rasavaktradharo ragi ranjaniyapadambujah
    || 120|| lokaikanatho lokesha lalito lokanayakah | lokashiksho lokaraksho lokalocanaranjitah || 121||
    lokacudamanirlololavanyo layavarjitah | lokadhyaksho lokavandyo lokottaragunakarah || 122|| lokabandhurlokadata
    lokatrayamahahitah | lokatitagunopeto lokalokasvarupavan || 123|| lasyapriyo lasyadarshi latakusumapujitah
    | labdhamano labdharaso labdhaharsho lasatkarah || 124|| varishtho varado vandyo vishishto vikrami
    vibhuh | vibudhagracaro vishvam vikalpaparivarjitah || 125|| vipasho vigatatanko vicitrango virocanah
    | vidyadharo vishuddhatma vedango vibudhapriyah || 126|| varcaskaro vyapakashca vijnani vinayanvitah
    | vidvattamo virodhighno viro virasanovidhih || 127|| vitarago vinitatma vedagarbho viradvapuh | vishvadiptirvishalaksho
    vijitatma vibhavanah || 128|| vedavedyo vidheyatma vitadoshashca vasupradah | vishvakarma vitabhayo
    vagisho vasavarcitah || 129|| vedadvishvarupashca vishvamurtirarvarasanah | vagmi vedadharo vidvanvishakho
    vimalo vatuh || 130|| viracudamanirviravijayo vibudhashrayah | vijayi vinayi vetta variyanviraja vasuh
    || 131|| viraghno vijvaro vedyo vegavanviryavanvashi | varashilo varaguno vishoko vajradharakah ||
    132|| sharajanma shaktidharah shatrughnah shikhivahanah | shrimanshishtah shucih shuddhah shashvatah
    shrutisagarah || 133|| sharanyah shubhadah sharma shishteshtah shubhalakshanah | shantah shuladharah
    shreshthah shuddhatma shankarah shivah || 134|| shitikanthatmajah shurah shantidah shokanashanah |
    shurasamharadakshashca shishtacaraprapujitah || 135|| shanmaturah shanmukhashca shadgunaishvaryasamyutah
    | shatcakrasthah shadurmighnah shadangashrutiparagah || 136|| shadbhavarahitah shatkah shatshastrasmritiparagah
    | shadvargarupah shadgrivah shadarighnah shadashrayah || 137|| shatkiritadharah shriman shadadharashca
    shatkramah | shatkonamadhyanilayah shandatvapariharakah || 138|| senanih subhagah skandah suranandah
    satam gatih | subrahmanyah suradhyakshah sarvajnah sarvadah sukhi || 139|| sulabhah siddhidah saumyah
    siddheshah siddhisadhanah | siddharthah siddhasankalpah siddhasadhuh sureshvarah || 140|| subhujah
    sarvavitsakshi suprasadah sanatanah | sudhapatih svayanjyotih svayambhuh sarvatomukhah || 141|| samarthah
    satkritah sukshmah sumukhah sukhadah suhrit | suprasannah surashreshthah sushilah satyasadhakah ||
    142|| sambhavyah sumanassevyah sakalagamaparagah | suvyaktah saccidanandah suvirah sujanashrayah ||
    143|| sarvalakshanasampannah satyadharmaparayanah | sarvadevamayah satyah sadamrishtannadayakah ||
    144|| sudhanvah sumatih satyah sarvavighnavinashanah | sarvaduhkhaprashamanah sukumarah sulocanah
    || 145|| sugrivah sucirah sarah suradhyakshah surarihah | suvikramah sarvavarnah sarparajah sadashucih
    || 146|| saptarcirbhuh suravarah sarvayudhavisharadah | sarvalokaikanathashca sambaradhanatatparah
    || 147|| hasticarmambarasuto hastivahanasevitah | hastyashvavahano hasti harshadaityaharanujah ||
    148|| hakararupo hamsatma halabhrit haripujitah | havirharidravarnashca hritagho hasitananah || 149||
    hemabhusho haridvarno hrishtido hrishtivardhanah | heladrividhvamsakari hunkarahritakilbishah || 150||
    himadrijatanudbhuto harikesho hiranmayah | hridyo hrishto harisakho hamso hamsagatirhavih || 151||
    hiranyavarno hitakriddharshado hemabhushanah | harapriyo hitakaro hatapapo hradodbhavah || 152|| kshemadah
    kshemakritkshemyah kshetrajnah kshetravarjitah | kshetrapalah kshamadharah kshemyah kshetram kshamakarah
    || 153|| kshuttridghnah kshantidah kshemi kshitibhushah kshamashrayah | kshalitaghah kshitidharah
    kshinasamrakshanakshamah || 154|| anganyasah
  devanagari: लं पृथिव्यात्मने गन्धं कल्पयामि । हं आकाशात्मने पुष्पाणि कल्पयामि । यं वाय्वात्मने धूपं
    कल्पयामि । रं अग्न्यात्मने दीपं कल्पयामि । वं अमृतात्मने अमृतं महानैवेद्यं कल्पयामि । सं सर्वात्मने
    ताम्बूलादि सर्वोपचारपूजान् कल्पयामि । ॐ अचिन्त्यशक्तिरनघो ह्यक्षोभ्यः त्वपराजितः । अनाथवत्सलोऽमोघः
    त्वशोको ह्यजरोऽभयः ॥ १॥ अत्युदारो ह्यघहरः त्वग्रगण्योऽद्रिजासुतः । अनन्तमहिमाऽपारोऽनन्तसौख्योऽन्नदोऽव्ययः
    ॥ २॥ अनुत्तमोऽक्षयोऽनादिरप्रमेयोऽक्षरोऽच्युतः । अकल्मषोऽभिरामोऽग्रधुर्यः त्वमितविक्रमः ॥ ३॥ अतुलश्चामृतोऽघोरो
    ह्यनन्तोऽनन्तविक्रमः । अनाथनाथो ह्यमलो ह्यप्रमत्तोऽमरप्रभुः ॥ ४॥ अरिन्दमोऽखिलाधारो ह्यणिमादिगुणाग्रणीः
    । अचञ्चलोऽमरस्तुत्योऽह्यकलङ्कः त्वमिताशनः ॥ ५॥ अग्निभूरनवद्याङ्गो ह्यद्भुतोऽभीष्टदायकः । अतीन्द्रियोऽप्रमेयात्मा
    ह्यदृश्योऽव्यक्तलक्षणः ॥ ६॥ आपद्विनाशनश्चार्य आढ्य आगमसंस्तुतः । आर्तसंरक्षणश्चाद्य आनन्दी आर्यसेवितः
    ॥ ७॥ आश्रितेष्टार्थवरद आनन्दार्थफलप्रदः । आश्चर्यरूपश्चानन्द आपन्नार्तिविनाशनः ॥ ८॥ आराधितपदद्वन्द्व
    आगमार्थविशारदः । आनन्दसुन्दराकार आब्रह्मस्तम्भरूपकः ॥ ९॥ आधारषट्कनिलय आदिमध्यान्तवर्जितः । आब्रह्मकीटजनक
    आखण्डलसुधादिपः ॥ १०॥ इभवक्त्रानुजोऽपीष्ट इभासुरहरात्मजः । इतिहाससुसंस्तुत्य इन्द्रभोगफलप्रदः ॥ ११॥
    इष्टापूर्तफलप्राप्तिरिष्टेष्टवरदायकः । इहामुत्रेष्टफलद इष्टदः त्विन्द्रवन्दितः ॥ १२॥ ईडनीयः त्वीशपुत्र
    ईप्सितार्थप्रदायकः । ईतिभीतिहरः त्वीड्य ईषणात्रयवर्जितः ॥ १३॥ ईश्वरार्पितवेदार्थ ईश्वरप्रियनन्दनः
    । ईश्वराङ्कविहारी चेशिता चेश्वररूपघृत् ॥ १४॥ उदारकीर्तिरुद्योगी चोत्कृष्टोरुपराक्रमः । उत्कृष्टशक्तिरुत्साह
    उदारश्चोत्सवप्रियः ॥ १५॥ उज्जृम्भ उद्भवश्चोग्र उदग्रश्चोग्रलोचनः । उन्मत्त उग्रशमन उद्वेगघ्नोरगेश्वरः
    ॥ १६॥ उरुप्रभावश्चोदीर्ण उमासूनुरुदारधीः । उदग्रवैभवोदग्रबुद्धिदोग्रहेतिमान् ॥ १७॥ ऊर्ध्वरेतस्सुतश्चोर्ध्वगतिदश्चोर्मिपालकः
    । ऊर्जितश्चोर्ध्वगश्चोर्ध्व ऊर्ध्वलोकैकनायकः ॥ १८॥ ऊर्जावानूर्जितोदार ऊर्जितोर्जितशासनः । ऊरिकृतधनुर्बाण
    ऊर्मिषट्कविनाशनः ॥ १९॥ ऋषिदेवगणस्तुत्य ऋणत्रयविमोचनः । ऋजुरूपो ह्यृजुकर ऋजुमार्गप्रदर्शकः ॥ २०॥ ऋतम्भर
    ऋजुप्रीत ऋषभो ऋद्धिश्च ऋक् । ऋग्वेदादिस्वरूपश्च ऋद्धात्मा ऋषिपूजितः ॥ २१॥ ऋलेखवत्त्रिनाड्यन्तस्सुषुम्नानाडिमध्यगः
    । ऋकृत्स्वप्नाद्यजाग्रान्तमध्यो ह्यॄतम्भरात्मकः ॥ २२॥ ऌलितोद्धारको ऌब्धजनदूरो ऌनामकः । ऌप्ताचारमनोदूरो
    ऌप्तदुःखो ऌळत्प्रभः ॥ २३॥ ॡनमायासुरो ॡनसंसाराख्यमहावनः । एणाङ्कधरसत्पुत्र एक एनौघनाशनः ॥ २४॥ एकाग्रध्यानशीलश्चाप्योकान्तध्यानपूजितः
    । ऐश्वर्यदश्चैन्द्रभोगी चैतिह्यश्चैन्द्रवन्दितः ॥ २५॥ ऐशानपदसन्दायी चैन्द्रदिक्पालजाधिपः । ओजस्वी
    चौषधिस्थानमोजोदश्चौदनप्रदः ॥ २६॥ ओङ्काररूपीचौङ्कार ओङ्कारार्थविशारदः । औदार्यशीलश्चौमेय औग्र औन्नत्यदायकः
    ॥ २७॥ औदार्यः त्वौषधकर औषधञ्चौषधाकरः । अंशुमानंशुमालीड्य अम्बिकातनयोऽन्नदः ॥ २८॥ अन्धकारिसुतोऽन्धत्वहारी
    चाम्बुजलोचनः । अस्तमायः त्वर्पणारर्हः त्वस्पष्टोऽस्तोकपुण्यदः ॥ २९॥ अस्तामित्रोऽस्तरूपश्चाप्यस्खलद्गतिदायकः
    । कार्तिकेयः कामरूपः कुमारः क्रौञ्चदारणः ॥ ३०॥ कामदः कारणं काम्यः कमनीयः कृपाकरः । काञ्चनाभः कान्तियुक्तः
    कामः कामप्रदः कविः ॥ ३१॥ कीर्तिकृत्कुक्कुटधरः कूटस्थः कुवलेक्षणः । कुङ्कुमाङ्गः क्लमहरः कुशलः कुक्कुटध्वजः
    ॥ ३२॥ कृशानुसम्भवः क्रूरः क्रूरघ्नः कलितापहृत् । कामरूपः कल्पतरुः कान्तः कामितदायकः ॥ ३३॥ कल्याणकृत्क्लेशनाशः
    कृपाळूः करुणाकरः । कलूषघ्नः क्रियाशक्तः कठोरः कवची कृती ॥ ३४॥ कोमलाङ्गः कुहूप्रीतः कुत्सितघ्नः कलाधरः
    । ख्यातः खेटधरः खड्गी खट्वाङ्गी खलनिग्रहः ॥ ३५॥ ख्यातिप्रदः खेचरेशः ख्यातैनाः खेचरस्तुतः । खरतापहरः
    खस्थः खेचरः खेचराश्रयः ॥ ३६॥ खण्डेन्दुमौलितनयः खेलाखेचरपालकः । खस्थप्रियः खण्डिताद्यः खेचरीजनपूजितः
    ॥ ३७॥ खेटाद्यायुधसम्पन्नः खर्वेतरपदप्रदः । गाङ्गेयो गिरिजापुत्रो गणनाथानुजो गुहः ॥ ३८॥ गोप्ता गीर्वाणसंसेव्यो
    गुणातीतो गुहाश्रयः । गतिप्रदो गुणनिधिर्गम्भीरो गिरिजात्मजः ॥ ३९॥ गूढरूपो गदहरो ग्रहाधीशो गणाग्रणीः
    । गोधरो गहनो गुप्तो गर्वघ्नो गुणवर्द्धनः ॥ ४०॥ गुह्यो गुणज्ञो गीतिज्ञो गतातङ्को गुणोत्तरः । गद्यपद्यप्रियो
    गण्यो गोस्तुतो गगनेचरः ॥ ४१॥ गणनीयचरित्रश्च गतक्लेशो गुहाश्रयः । घूर्णिताक्षो घृणिनिधिः घनगम्भीरघोषणः
    ॥ ४२॥ घण्टानादप्रियो घोषो घोराघौघविनाशनः । घनप्रियो घनानन्दो घृणावान् घृष्टिपातकः ॥ ४३॥ घृणर्घृणाकरो
    घोरो घोरदैत्यप्रहारकः । घटितैश्वर्यसन्दोहो घनर्द्धिर्घनविक्रमः ॥ ४४॥ घृणिमण्डलरूपश्च घनसम्पत्प्रदो
    घनः । ङकारस्वरणस्सर्वरन्ध्रस्थत्रिपुटीप्रभः ॥ ४५॥ ङणद्घण्टारवान्तस्थो ङणारावततिप्रियः । ङकाराकारकद्वन्द्वसर्वसन्ध्याप्तचिन्मयः
    ॥ ४६॥ चित्रकृच्चित्रवर्णश्च चञ्चलश्चपलद्युतिः । चिन्मयश्चित्स्वरूपश्च चिदानन्दः चिरन्तनः ॥ ४७॥ चित्रकेलिः
    चित्रतरः चिन्तनीयः चमत्कृतिः । चोरघ्नः चतुरः चारुः चामीकरविभूषणः ॥ ४८॥ चन्द्रार्ककोटिसदृशः चन्द्रमौलितनूद्भवः
    । चेटीभूतप्रपञ्चश्च चण्डश्चण्डोरुविक्रमः ॥ ४९॥ छादिताङ्गश्छद्महन्ता छेदिताखिलपातकः । छेदीकृतमहाक्लेशः
    छेत्रीकृतमहायशाः ॥ ५०॥ छेदिताशेषसन्तापः छुरितानीकसागरः । छेदिताशेषदैत्यौघः छातैनाश्छिन्नसंशयः ॥ ५१॥
    छन्दोमयश्छन्दगामी छिन्नपाशः छविच्छदः । छेदिताशेषसंसारः छव्यग्नीन्दुविलोचनः ॥ ५२॥ जगद्धितो जगत्पूज्यो
    जगज्ज्येष्ठो जगन्मयः । जनको जाह्नवीसूनुर्जितामित्रो जगद्गुरुः ॥ ५३॥ जयी जितेन्द्रियो जेता जरामरणवर्जितः
    । ज्योतिर्मयो जगन्नाथो जगज्जीवो जनाश्रयः ॥ ५४॥ जगत्वन्द्यो जगच्छ्रेष्ठो जितक्लेशो जगद्विभुः । जगत्सेव्यो
    जगत्कर्ता जगत्साक्षी जगत्प्रियः ॥ ५५॥ जम्भारिवन्द्यो जयदो जगञ्जनमनोहरः । जगदानन्दजनको जनजाड्यापहारकः
    ॥ ५६॥ जपाकुसुमसङ्काशो जनलोचनशोभनः । जनेश्वरो जगद्भव्यो जनजन्मनिबर्हणः ॥ ५७॥ जयदो जन्तुतापघ्नो जितदैत्यमहापथः
    । जितमायो जितक्रोधो जितसङ्गो जनप्रियः ॥ ५८॥ झञ्झानिलमहावेगो झटिताशेषपातकः । झर्झरीकृतदैत्यौघो झल्लरीवाद्यसुप्रियः
    ॥ ५९॥ ज्ञानमूर्तिर्ज्ञानगम्यो ज्ञानी ज्ञानमहानिधिः । ज्ञानोपदेशकर्ता च ज्ञानदो ज्ञानदेशिकः ॥ ६०॥ टङ्कारनृत्तविभवष्टङ्कवज्रध्वजाङ्कितः
    । टङ्किताखिललोकश्च टङ्कितैनस्तमोरविः ॥ ६१॥ ठकारमध्यनिलयष्ठवर्णाकारमण्डलः । ठपदान्तश्श्रूयमाणानादरूपष्ठकारकः
    ॥ ६२॥ डम्बरप्रभवो डम्भो डमड्डमरुकप्रियः । डामरोत्कटसन्नादो डिम्भरूपस्वरूपकः ॥ ६३॥ ढक्कानादप्रीतिकरो
    ढालितासुरसङ्कुलः । ढौकितामरसन्दोहो ढुण्ढिविघ्नेश्वरानुजः ॥ ६४॥ णकारबिन्दुद्वन्द्वैक्यज्ञानेनाश्चर्यकारकः
    । णबिन्दुत्रयवन्मद्यबिन्द्वाश्लिष्टाद्विवल्लिकः ॥ ६५॥ तत्त्वज्ञः तत्त्वगः तीवव्रः तपोरूपः तपोमयः ।
    त्रयीमयः त्रिकालज्ञः स्त्रिमूर्तिः त्रिगुणात्मकः ॥ ६६॥ त्रिदशेशः तारकारिः तापघ्नः तापसप्रियः । तुष्टिदः
    तुष्टिकृत्तीक्ष्णः तपोरूपः त्रिकालवित् ॥ ६७॥ स्तोता स्तव्यः स्तवप्रीतः स्तुतिः स्तोत्रं स्तवप्रियः
    । तारेशपूजितः तथ्यः तुम्बुरूनारदार्चितः ॥ ६८॥ स्थिरः स्थायी स्थापकश्च स्थूलसूक्ष्मप्रदर्शकः । स्थविष्ठः
    स्थविरः स्थूलः स्थानदः स्थैर्यदः स्थिरः ॥ ६९॥ दान्तो दयापरो दाता दुरितघ्नो दुरासदः । दर्शनीयो दयासारो
    देवदेवो दयानिधिः ॥ ७०॥ दुराधर्षो दुर्विगाह्यो दक्षो दर्पणशोभितः । दुर्धरो दानशूरश्च द्वादशाक्षो द्विषड्भुजः
    ॥ ७१॥ द्विषट्कर्णो द्विषण्णेत्रो दीनसन्तापनाशनः । दन्दशूकेश्वरो देवो दिव्यो दिव्याकृतिर्दमः ॥ ७२॥
    दीर्घपृष्ठो दीर्घबाहुर्दीर्घदृष्टिर्दिवस्पतिः । दण्डो दमयिता दर्पो देवसिंहो दृढव्रतः ॥ ७३॥ दुर्लभो
    दुर्गमो दीप्तो दुष्प्रेक्ष्यो दिव्यमङ्गलः । दुरोदरघ्नो दुःखघ्नो दुरारिघ्नो दिशाम्पतिः ॥ ७४॥ दुर्जयो
    देवसेनेशो दुर्ज्ञेयो दुरतिक्रमः । दम्भो दृप्तश्च देवर्षिर्दैवज्ञो दैवचिन्तकः ॥ ७५॥ धुरन्धरो धर्मपरो
    धनदो धृतिवर्धनः । धर्मेशो धर्मशास्त्रज्ञो धन्वी धर्मपरायणः ॥ ७६॥ धनाध्यक्षो धनपतिर्धृतिमान्धूतकिल्बिषः
    । धर्महेतुर्धर्मगुरुर्धर्मकृद्धर्मविद् ध्रुवः ॥ ७७॥ धाता धीमान्धर्मचारी धन्यो धुर्यो धृतव्रतः । धरीत्रीमण्डालाध्यक्षो
    धनधान्यविवर्धनः ॥ ७८॥ नित्योत्सवो नित्यतृप्तो निर्लेपो निश्चलात्मकः । निरवद्यो निराधारो निष्कलङ्को
    निरञ्जनः ॥ ७९॥ निर्ममो निरहङ्कारो निर्मोहो निरुपद्रवः । नित्यानन्दो निरातङ्को निष्प्रपञ्चो निरामयः
    ॥ ८०॥ निरवद्यो निरीहश्च निर्द्वन्द्वो निर्मलात्मकः । नीरजाक्षो निर्जरेशो निस्सङ्गो निगमस्तुतः ॥ ८१॥
    निष्कण्टको निरालम्बो निष्प्रत्यूहो निरुद्भवः । नित्यो नियतकल्याणो निर्विकल्पो निराश्रयः ॥ ८२॥ नेता
    निधिर्नैकरूपो निराकारो नदीसुतः । नानायुधधरो नाथो नानासाम्राज्यदायकः ॥ ८३॥ नागपाशधरो नन्दी नारदादिसुपूजितः
    । नाट्योत्सुको नदीसूनुर्नगारिप्रियदायकः ॥ ८४॥ नक्षत्ररूपी नक्षत्रं नेता नित्योसुको नटः । निर्मलो निरहङ्कारो
    नित्याभीष्टफलप्रदः ॥ ८५॥ पुलिन्दकन्यारमणः पुरुजित्परमप्रियः । प्रत्यक्षमूर्तिः प्रत्यक्षः परेशः पूर्णपुण्यदः
    ॥ ८६॥ पुण्याकरः पुण्यरूपः पुण्यः पुण्यपरायणः । पुण्योदयः परञ्ज्योतिः पुण्यकृत्पुण्यवर्धनः ॥ ८७॥ परानन्दः
    परतरः पुण्यकीर्तिः पुरातनः । प्रसन्नरूपः प्राणेशः पन्नगः पापनाशनः ॥ ८८॥ प्रणतार्तिहरः पूर्णः पार्वतीनन्दनः
    प्रभुः । पूतात्मा पुरुषः प्राणः प्रभवः पुरुषोत्तमः ॥ ८९॥ प्रसन्नः परमश्रेष्ठः पटः परिवृढः परः । परमात्मा
    परब्रह्म परर्द्धिः प्रियदर्शनः ॥ ९०॥ पवित्रः पुष्टिदः पूर्तिः पिङ्गलः पुष्टिवर्धनः । पापघ्नः पाशहस्तश्च
    प्रमत्तासुरशिक्षकः ॥ ९१॥ पावनः पावकः पूज्यः पूर्णानन्दः परात्परः । पुष्करः प्रवरः पूर्वः पितृभक्तपुरोगमः
    ॥ ९२॥ प्राणदः प्राणिजनकः प्रतिष्ठा पावकोद्भवः । परब्रह्मस्वरूपश्च परमैश्वर्यकारणम् ॥ ९३॥ परर्द्धिदः
    पुष्टिकरः प्रकाशात्मा प्रतापवान् । प्रज्ञाकरः प्रकृष्टार्थः पृथुः पृथुपराक्रमः ॥ ९४॥ पूतनाजीवहरणजामाता
    पुर्णविग्रहः । फणीश्वरः फणिवरः फणामणिविभूषितः ॥ ९५॥ फलदः फलहस्तश्च फुल्लाम्बुजविलोचनः । फडुच्चाटितपापौघः
    फणिलोकविभूषणः ॥ ९६॥ फणिसङ्घादरापीतनिजवाणीरसामृतः । बाहुलेयो बृहद्रूपो बलिष्ठो बलवान् बलः ॥ ९७॥ ब्रह्मेशविष्णुरूपश्च
    बुद्धिर्बुद्धिमतां वरः । बालरूपो बृहद्गर्भो ब्रह्मचारी बुधप्रियः ॥ ९८॥ बहुश्रुतो बहुमतो ब्रह्मण्यो
    ब्राह्मणप्रियः । बलप्रमथनो ब्रह्मा बहुरूपो बहुप्रदः ॥ ९९॥ बृहद्भानुतनूद्भूतो बृहद्बाहुर्बिलेशयः ।
    बहुबाहुर्बलश्रीमान्बहुदैत्यविनाशकः ॥ १००॥ बिलद्वारान्तरालस्थो बृहच्छक्तिधनुर्धरः । बालार्कद्युतिमान्
    बालो बृहद्वक्षा बृहद्धनुः ॥ १०१॥ बद्धतूणीरांसदेशो बद्धपाशविमोचनः । भव्यो भोगीश्वरो भाव्यो भवनाशो भवप्रियः
    ॥ १०२॥ भक्तिगम्यो भयहरो भावज्ञो भजनप्रियः । भुक्तिमुक्तिप्रदो भोगी भगवान्भाग्यवर्धनः ॥ १०३॥ भ्राजिष्णुर्भावनो
    भर्ता भीमो भीमपराक्रमः । भूतिदो भूतिकृद्भोक्ता भूतात्मा भुवनेश्वरः ॥ १०४॥ भावुको भीकरो भीष्मो भावुकेष्टो
    भवोद्भवः । भवतापप्रशमनो भोगवान् भूतभावनः ॥ १०५॥ भोज्यप्रदो भ्रान्तिनाशो भानुमान् भुवनाश्रयः । भूरिभोगप्रदो
    भद्रो भजनीयो भिषग्वरः ॥ १०६॥ भक्तेष्टदाननिरतो भार्गबाद्यभिवन्दितः । महासेनो महोदारो महाशक्तिर्महाद्युतिः
    ॥ १०७॥ महाबुद्धिर्महावीर्यो महोत्साहो महाबलः । महाभागो महामायी मेधावी मेखली महान् ॥ १०८॥ मुनिस्तुतो
    महामान्यो महानन्दो महायशाः । महोर्जितो माननिधिर्मनोरथफलप्रदः ॥ १०९॥ महोदयो महापुण्यो महाबलपराक्रमः
    । मानदो मतिदो मानी मुक्तामालाविभूषणः ॥ ११०॥ मनोहरो महामुख्यो महर्द्धिर्मूर्तिमान्मुनिः । महोत्तमो
    महोपायो मोक्षदो मङ्गलप्रदः ॥ १११॥ मुदाकरो मुक्तिदाता महाभोगो महोरगः । यशस्करो योगयोनिर्योगिष्ठो यमिनां
    वरः ॥ ११२॥ यशस्वी योगपुरुषो योग्यो योगनिधिर्यमी । यमिसेव्यो योगयुक्तो योगविद्योगसिद्धिदः ॥ ११३॥ यन्ता
    यन्त्री च यन्त्रज्ञो यन्त्रवान्यन्त्रनायकः । यातनारहितो योगी योगीशो योगिनां वरः ॥ ११४॥ योगाराध्यपदद्वन्दो
    यमाद्यष्टाङ्गसाधकः । रमणीयो रम्यरूपो रसज्ञो रसभावुकः ॥ ११५॥ रञ्जनो रञ्जितो रागी रुजारी रुद्रसम्भवः
    । रणप्रियो रणोदारो रागद्वेषविनाशनः ॥ ११६॥ रत्नार्ची रुचिरो रम्यो रूपलावण्यविग्रहः । रत्नाङ्गदधरो रत्नभूषणो
    रमणीयकः ॥ ११७॥ रुचिकृद्रोचमानश्च रञ्जितो रोगनाशनः । राजीवाक्षो राजराजो रक्तमाल्यानुलेपनः ॥ ११८॥ राजद्वेदागमस्तुत्यो
    रजस्सत्त्वगुणान्वितः । रजनीशकलारम्यो रत्नकुण्डलमण्डितः ॥ ११९॥ रत्नसन्मौलिशोभाढ्यो रणन्मञ्जीरभूषणः
    । रसवक्त्रधरो रागी रञ्जनीयपदाम्बुजः ॥ १२०॥ लोकैकनाथो लोकेश लालितो लोकनायकः । लोकशिक्षो लोकरक्षो लोकलोचनरञ्जितः
    ॥ १२१॥ लोकचूडामणिर्लोलोलावण्यो लयवर्जितः । लोकाध्यक्षो लोकवन्द्यो लोकोत्तरगुणाकरः ॥ १२२॥ लोकबन्धुर्लोकदाता
    लोकत्रयमहाहितः । लोकातीतगुणोपेतो लोकालोकस्वरूपवान् ॥ १२३॥ लास्यप्रियो लास्यदर्शी लताकुसुमपूजितः ।
    लब्धमानो लब्धरसो लब्धहर्षो लसत्करः ॥ १२४॥ वरिष्ठो वरदो वन्द्यो विशिष्टो विक्रमी विभुः । विबुधाग्रचरो
    विश्वं विकल्पपरिवर्जितः ॥ १२५॥ विपाशो विगतातङ्को विचित्राङ्गो विरोचनः । विद्याधरो विशुद्धात्मा वेदाङ्गो
    विबुधप्रियः ॥ १२६॥ वर्चस्करो व्यापकश्च विज्ञानी विनयान्वितः । विद्वत्तमो विरोधिघ्नो वीरो वीरासनोविधिः
    ॥ १२७॥ वीतरागो विनीतात्मा वेदगर्भो विराड्वपुः । विश्वदीप्तिर्विशालाक्षो विजितात्मा विभावनः ॥ १२८॥
    वेदवेद्यो विधेयात्मा वीतदोषश्च वसुप्रदः । विश्वकर्मा वीतभयो वागीशो वासवार्चितः ॥ १२९॥ वेदद्विश्वरूपश्च
    विश्वमुर्तिरर्वरासनः । वाग्मी वेदधरो विद्वान्विशाखो विमलो वटुः ॥ १३०॥ वीरचूडामणिर्वीरविजयो विबुधाश्रयः
    । विजयी विनयी वेत्ता वरीयान्विरजा वसुः ॥ १३१॥ वीरघ्नो विज्वरो वेद्यो वेगवान्वीर्यवान्वशी । वरशीलो
    वरगुणो विशोको वज्रधारकः ॥ १३२॥ शरजन्मा शक्तिधरः शत्रुघ्नः शिखिवाहनः । श्रीमान्शिष्टः शुचिः शुद्धः
    शाश्वतः श्रुतिसागरः ॥ १३३॥ शरण्यः शुभदः शर्म शिष्टेष्टः शुभलक्षणः । शान्तः शूलधरः श्रेष्ठः शुद्धात्मा
    शङ्करः शिवः ॥ १३४॥ शितिकण्ठात्मजः शूरः शान्तिदः शोकनाशनः । शूरसंहारदक्षश्च शिष्टाचारप्रपूजितः ॥ १३५॥
    षाण्मातुरः षण्मुखश्च षड्गुणैश्वर्यसंयुतः । षट्चक्रस्थः षडूर्मिघ्नः षडङ्गश्रुतिपारगः ॥ १३६॥ षड्भावरहितः
    षट्कः षट्शास्त्रस्मृतिपारगः । षड्वर्गरूपः षड्ग्रीवः षडरिघ्नः षडाश्रयः ॥ १३७॥ षट्किरीटधरः श्रीमान्
    षडाधारश्च षट्क्रमः । षट्कोणमध्यनिलयः षण्डत्वपरिहारकः ॥ १३८॥ सेनानीः सुभगः स्कन्दः सुरानन्दः सतां गतिः
    । सुब्रह्मण्यः सुराध्यक्षः सर्वज्ञः सर्वदः सुखी ॥ १३९॥ सुलभः सिद्धिदः सौम्यः सिद्धेशः सिद्धिसाधनः
    । सिद्धार्थः सिद्धसङ्कल्पः सिद्धसाधुः सुरेश्वरः ॥ १४०॥ सुभुजः सर्ववित्साक्षी सुप्रसादः सनातनः । सुधापतिः
    स्वयञ्ज्योतिः स्वयम्भूः सर्वतोमुखः ॥ १४१॥ समर्थः सत्कृतः सूक्ष्मः सुमुखः सुखदः सुहृत् । सुप्रसन्नः
    सुरश्रेष्ठः सुशीलः सत्यसाधकः ॥ १४२॥ सम्भाव्यः सुमनस्सेव्यः सकलागमपारगः । सुव्यक्तः सच्चिदानन्दः सुवीरः
    सुजनाश्रयः ॥ १४३॥ सर्वलक्षणसम्पन्नः सत्यधर्मपरायणः । सर्वदेवमयः सत्यः सदामृष्टान्नदायकः ॥ १४४॥ सुधन्वाः
    सुमतिः सत्यः सर्वविघ्नविनाशनः । सर्वदुःखप्रशमनः सुकुमारः सुलोचनः ॥ १४५॥ सुग्रीवः सुचिराः सारः सुराध्यक्षः
    सुरारिहाः । सुविक्रमः सर्ववर्णः सर्पराजः सदाशुचिः ॥ १४६॥ सप्तार्चिर्भूः सुरवरः सर्वायुधविशारदः । सर्वलोकैकनाथश्च
    साम्बाराधनतत्परः ॥ १४७॥ हस्तिचर्माम्बरसुतो हस्तिवाहनसेवितः । हस्त्यश्ववाहनो हस्ती हर्षदैत्यहरानुजः
    ॥ १४८॥ हकाररूपो हंसात्मा हलभृत् हरिपूजितः । हविर्हरिद्रावर्णश्च हृताघो हसिताननः ॥ १४९॥ हेमभूषो हरिद्वर्णो
    हृष्टिदो हृष्टिवर्धनः । हेलाद्रिविध्वंसकारी हुङ्कारहृतकिल्बिषः ॥ १५०॥ हिमाद्रिजातनूद्भूतो हरिकेशो
    हिरण्मयः । हृद्यो हृष्टो हरिसखो हंसो हंसगतिर्हविः ॥ १५१॥ हिरण्यवर्णो हितकृद्धर्षदो हेमभूषणः । हरप्रियो
    हितकरो हतपापो ह्रदोद्भवः ॥ १५२॥ क्षेमदः क्षेमकृत्क्षेम्यः क्षेत्रज्ञः क्षेत्रवर्जितः । क्षेत्रपालः
    क्षमाधारः क्षेम्यः क्षेत्रं क्षमाकरः ॥ १५३॥ क्षुत्तृड्घ्नः क्षान्तिदः क्षेमी क्षितिभूषः क्षमाश्रयः
    । क्षालिताघः क्षितिधरः क्षीणसम्रक्षणक्षमः ॥ १५४॥ अङ्गन्यासः
