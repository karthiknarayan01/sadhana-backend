id: maharajnisahasranamastotra
category: stotram
name:
  english: maharajnisahasranamastotra
  devanagari: महाराज्नीसहस्रनामस्तोत्र
content:
  english: ashvamedhasahasrasya vajipeyasya kotayah | gangasnanasahasrasya candrayanayutasya ca || 155||
    taptakricchekalakshasya rajasuyasya kotayah | sahasranamapathasya kalam narhanti shodashim || 156||
    sarvasiddhishvaram sadhyam rajninamasahasrakam | mantragarbham pathedyastu rajyakamo maheshvari ||
    157|| varshamekam shatavartam mahacinakramakulah | shakripujaparo ratrau sa labhedrajyamishvari ||
    158|| putrakami pathetsayam citabhasmanulepanah | digambaro muktakeshah shatavartam maheshvari ||
    159|| shmashane tu labhetputram sakshadvaishravanopamam | paradararcanarato bhagabimbam smaran sudhih
    || 160|| pathennamasahasram tu vasukami labheddhanam | ravau varatrayam devi pathennamasahasrakam
    || 161|| mriduvishtaranirvishtah kshirapanaparayanah | svapne simhasanam rajnim varadam bhuvi pashyati
    || 162|| kshiracarvanasantripto virapanarasakulah | yah pathetparaya bhaktya rajninamasahasrakam ||
    163|| sa sadyo mucyate ghoranmahapatakajadbhayat | yah pathetsadhako bhaktya shaktivakshahkritasanah
    || 164|| shukrottaranakale tu tasya haste'shtasiddhayah | yah pathennishi cakragre parastridhyanatatparah
    || 165|| surasavarasanandi sa labhetsamyuge jayam | idam namasahasram tu sarvamantramayam shive ||
    166|| bhurjatvaci likhedratrau cakrarcanasamagame | ashtagandhena putena veshtayet svarnapatrake ||
    167|| dharayet kanthadeshe tu sarvasiddhih prajayate | yo dharayenmaharaksham sarvadevatidurlabham
    || 168|| rane rajakule dyute caurarogadyupadrave | sa prapnoti jayam sadyah sadhako viranayakah ||
    169|| shricakram pujayedyastu dharayedvarma mastake | pathennamasahasram tu stotram mantratmakam tatha
    || 170|| kim kim na labhate kamam devanamapi durlabham | surapanam tatah samviccarvanam minamamsakam
    || 171|| navakanyasamayogo mudra vinaravah priye | satsango gurusannidhyam rajnishricakramagratah
    || 172|| yasya devi sa eva syadyogi brahmavidishvarah | idam rahasyam paramam bhaktya tava mayoditam
    || 172|| aprakashyamadatavyam na deyam yasya kasyacit | anyashishyaya dushtaya durjanaya duratmane
    || 174|| gurubhaktivihinaya surastrinindakaya ca | nastikaya kushilaya na deyam tattvadarshibhih ||
    175||
  devanagari: अश्वमेधसहस्रस्य वाजिपेयस्य कोटयः । गङ्गास्नानसहस्रस्य चान्द्रायणायुतस्य च ॥ १५५॥ तप्तकृच्छेकलक्षस्य
    राजसूयस्य कोटयः । सहस्रनामपाठस्य कलां नार्हन्ति षोडशीम् ॥ १५६॥ सर्वसिद्धीश्वरं साध्यं राज्ञीनामसहस्रकम्
    । मन्त्रगर्भं पठेद्यस्तु राज्यकामो महेश्वरि ॥ १५७॥ वर्षमेकं शतावर्तं महाचीनक्रमाकुलः । शक्रिपूजापरो
    रात्रौ स लभेद्राज्यमीश्वरि ॥ १५८॥ पुत्रकामी पठेत्सायं चिताभस्मानुलेपनः । दिगम्बरो मुक्तकेशः शतावर्तं
    महेश्वरि ॥ १५९॥ श्मशाने तु लभेत्पुत्रं साक्षाद्वैश्रवणोपमम् । परदारार्चनरतो भगबिम्बं स्मरन् सुधीः
    ॥ १६०॥ पठेन्नामसहस्रं तु वसुकामी लभेद्धनम् । रवौ वारत्रयं देवि पठेन्नामसहस्रकम् ॥ १६१॥ मृदुविष्टरनिर्विष्टः
    क्षीरपानपरायणः । स्वप्ने सिंहासनां राज्ञीं वरदां भुवि पश्यति ॥ १६२॥ क्षीरचर्वणसन्तृप्तो वीरपानरसाकुलः
    । यः पठेत्परया भक्त्या राज्ञीनामसहस्रकम् ॥ १६३॥ स सद्यो मुच्यते घोरान्महापातकजाद्भयात् । यः पठेत्साधको
    भक्त्या शक्तिवक्षःकृतासनः ॥ १६४॥ शुक्रोत्तरणकाले तु तस्य हस्तेऽष्टसिद्धयः । यः पठेन्निशि चक्राग्रे
    परस्त्रीध्यानतत्परः ॥ १६५॥ सुरासवरसानन्दी स लभेत्संयुगे जयम् । इदं नामसहस्रं तु सर्वमन्त्रमयं शिवे
    ॥ १६६॥ भूर्जत्वचि लिखेद्रात्रौ चक्रार्चनसमागमे । अष्टगन्धेन पूतेन वेष्टयेत् स्वर्णपत्रके ॥ १६७॥ धारयेत्
    कण्ठदेशे तु सर्वसिद्धिः प्रजायते । यो धारयेन्महारक्षां सर्वदेवातिदुर्लभाम् ॥ १६८॥ रणे राजकुले द्यूते
    चौररोगाद्युपद्रवे । स प्राप्नोति जयं सद्यः साधको वीरनायकः ॥ १६९॥ श्रीचक्रं पूजयेद्यस्तु धारयेद्वर्म
    मस्तके । पठेन्नामसहस्रं तु स्तोत्रं मन्त्रात्मकं तथा ॥ १७०॥ किं किं न लभते कामं देवानामपि दुर्लभम्
    । सुरापानं ततः संविच्चर्वणं मीनमांसकम् ॥ १७१॥ नवकन्यासमायोगो मुद्रा वीणारवः प्रिये । सत्सङ्गो गुरुसान्निध्यं
    राज्ञीश्रीचक्रमग्रतः ॥ १७२॥ यस्य देवि स एव स्याद्योगी ब्रह्मविदीश्वरः । इदं रहस्यं परमं भक्त्या तव
    मयोदितम् ॥ १७२॥ अप्रकाश्यमदातव्यं न देयं यस्य कस्यचित् । अन्यशिष्याय दुष्टाय दुर्जनाय दुरात्मने ॥
    १७४॥ गुरुभक्तिविहीनाय सुरास्त्रीनिन्दकाय च । नास्तिकाय कुशीलाय न देयं तत्त्वदर्शिभिः ॥ १७५॥
