id: bruhaspati-ashtottara-sata-namavali
category: stotram
name:
  english: Bruhaspati Ashtottara Sata Namavali
content:
  english: om gurave namah | om gunavaraya namah | om goptre namah | om gocaraya namah | om gopatipriyaya
    namah | om gunine namah | om gunavatam shreshthaya namah | om gurunam gurave namah | om avyayaya namah
    | om jetre namah || || om jayantaya namah | om jayadaya namah | om jivaya namah | om anantaya namah
    | om jayavahaya namah | om angirasaya namah | om adhvarasaktaya namah | om viviktaya namah | om adhvarakritparaya
    namah | om vacaspataye namah || || om vashine namah | om vashyaya namah | om varishthaya namah | om
    vagvicakshanaya namah | om cittashuddhikaraya namah | om shrimate namah | om caitraya namah | om citrashikhandijaya
    namah | om brihadrathaya namah | om brihadbhanave namah || || om brihaspataye namah | om abhishtadaya
    namah | om suracaryaya namah | om suraradhyaya namah | om surakaryahitankaraya namah | om girvanaposhakaya
    namah | om dhanyaya namah | om gishpataye namah | om girishaya namah | om anaghaya namah || || om
    dhivaraya namah | om dhishanaya namah | om divyabhushanaya namah | om devapujitaya namah | om dhanurdharaya
    namah | om daityahantre namah | om dayasaraya namah | om dayakaraya namah | om daridryanashanaya namah
    | om dhanyaya namah || || om dakshinayanasambhavaya namah | om dhanurminadhipaya namah | om devaya
    namah | om dhanurbanadharaya namah | om haraye namah | om angirasabjasanjataya namah | om angirasakulodbhavaya
    namah | om sindhudeshadhipaya namah | om dhimate namah | om svarnavarnaya namah || || om caturbhujaya
    namah | om hemangadaya namah | om hemavapushe namah | om hemabhushanabhushitaya namah | om pushyanathaya
    namah | om pushyaragamanimandalamanditaya namah | om kashapushpasamanabhaya namah | om kalidoshanivarakaya
    namah | om indradidevodeveshaya namah | om devatabhishtadayakaya namah || || om asamanabalaya namah
    | om sattvagunasampadvibhasuraya namah | om bhusurabhishtadaya namah | om bhuriyashase namah | om
    punyavivardhanaya namah | om dharmarupaya namah | om dhanadhyakshaya namah | om dhanadaya namah |
    om dharmapalanaya namah | om sarvavedarthatattvajnaya namah || || om sarvapadvinivarakaya namah |
    om sarvapapaprashamanaya namah | om svamatanugatamaraya namah | om rigvedaparagaya namah | om riksharashimargapracaravate
    namah | om sadanandaya namah | om satyasandhaya namah | om satyasankalpamanasaya namah | om sarvagamajnaya
    namah | om sarvajnaya namah || || om sarvavedantavide namah | om varaya namah | om brahmaputraya namah
    | om brahmaneshaya namah | om brahmavidyavisharadaya namah | om samanadhikanirmuktaya namah | om sarvalokavashamvadaya
    namah | om sasurasuragandharvavanditaya namah | om satyabhashanaya namah | om brihaspataye namah ||
    || om suracaryaya namah | om dayavate namah | om shubhalakshanaya namah | om lokatrayagurave namah
    | om shrimate namah | om sarvagaya namah | om sarvato vibhave namah | om sarveshaya namah || || om
    sarvadatushtaya namah | om sarvadaya namah | om sarvapujitaya namah |
