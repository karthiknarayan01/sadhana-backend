id: annamayya-keerthanas-chaaladaa-hari-naama
category: stotram
name:
  english: Annamayya Keerthanas Chaaladaa Hari Naama
content:
  english: dhira shankarabharanam janya a kanda capu pallavi calada hari nama saukhyamritamu damaku |
    calada hitavaina cavulèllanu nòsaga || idi yòkati hari nama mintaina jalada cèdaraki janmamula cèralu
    vidipinca | madinòkatè harinama mantramadi calada | padivela naraka kupamula vèdalinca || calada hari
    nama saukhyamritamu damaku | calada hitavaina cavulèllanu nòsaga || caranam kaladòkati harinama kanakadri
    calada | tòlagumani daridryadoshambu cèruca | tèlivòkati harinamadipa madi calada | kalushampu kathina
    cikati paradrola || calada hari nama saukhyamritamu damaku | calada hitavaina cavulèllanu nòsaga ||
    caranam taguvenkateshu kirtanamòkati calada | jagamulo kalpabhujambu valè nunda | sògasi yivibhuni
    dasula karuna calada | nagavu jupulanu nunnatamèpudu jupa || calada hari nama saukhyamritamu damaku
    | calada hitavaina cavulèllanu nòsaga || govinda hari jaya gopala hari jaya
  devanagari: धीर शन्कराभरणं जन्य आ कण्ड चापु पल्लवि चालदा हरि नाम सौख्यामृतमु दमकु । चालदा हितवैन चवुलॆल्लनु
    नॊसग ॥ इदि यॊकटि हरि नाम मिन्तैन जालदा चॆदरकी जन्ममुल चॆरलु विडिपिञ्च । मदिनॊकटॆ हरिनाम मन्त्रमदि
    चालदा । पदिवेल नरक कूपमुल वॆडलिञ्च ॥ चालदा हरि नाम सौख्यामृतमु दमकु । चालदा हितवैन चवुलॆल्लनु नॊसग
    ॥ चरणं कलदॊकटि हरिनाम कनकाद्रि चालदा । तॊलगुमनि दारिद्र्यदोषम्बु चॆरुच । तॆलिवॊकटि हरिनामदीप मदि चालदा
    । कलुषम्पु कठिन चीकटि पारद्रोल ॥ चालदा हरि नाम सौख्यामृतमु दमकु । चालदा हितवैन चवुलॆल्लनु नॊसग ॥ चरणं
    तगुवेङ्कटेशु कीर्तनमॊकटि चालदा । जगमुलो कल्पभूजम्बु वलॆ नुण्ड । सॊगसि यीविभुनि दासुल करुण चालदा ।
    नगवु जूपुलनु नुन्नतमॆपुडु जूप ॥ चालदा हरि नाम सौख्यामृतमु दमकु । चालदा हितवैन चवुलॆल्लनु नॊसग ॥ गोविन्द
    हरि जय गोपाल हरि जय
