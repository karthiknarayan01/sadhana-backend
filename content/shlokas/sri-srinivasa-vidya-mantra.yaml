id: sri-srinivasa-vidya-mantra
category: stotram
name:
  english: Sri Srinivasa Vidya Mantra
content:
  english: shuklapakshe hiranyavarnam harinim suvarnarajatasrajam | candram hiranmayim njatavedo ma avaha
    || shri sha purushah | sahasraksha ssahasrapat | sa bhumim vi~shvato vritva | atyatishthaddashangulam
    || pu mma avaha jatavedo lakshmimanapagamini m | yasyam hiranyam mpurushanaham || shri || purusha
    evedagm sarvam | utamritatvasyeshanah | yadannenatirohati || pu || ashvapurvam rathamadhyam hastinadaprabodhinim
    | shriya ndevimupahvaye shrirmadevirjushatam || shri || etavanasya mahima | ato jyayagshca purushah
    | pado 'sya vishva bhutani | tripadasyamrita smitam hiranyaprakaramardra ntarpayantim | padme sthita
    ntamihopahvaye shriyam || shri || tripadurdhva udaitpurushah | pado ''bhavatpunah | tato vishvanvyakramat
    | sashananashane abhi || pu ya~shasa jvalantim shriyam lo~ke devajushtamudaram | ta mpadminimim sharanamaha
    'lakshmirme nashyata dviradajayata | virajo adhi purushah | sa jato atyaricyata | pashcadbhumimatho
    purah || pu || adityavarne tapaso 'dhijato vanaspatistava vriksho 'tha bilvah | tasya phalani tapasa
    nudantu mayantarayashca bahya alakshmih || shri || yatpurushena havisha | deva yajnamatanvata | vasanto
    asyasidajyam | grishma idhmashsharaddhavih || pu ndevasakhah kirtishca manina saha | pradurbhuto 'smin
    kirtimriddhi || saptasyasanparidhayah | tri ssapta samidhah kritah | deva yadyajna ntanvanah | abadhnanpurusha
    || kshutpipasamala njyeshthamalakshmi nnashayamyaham | abhutimasamriddhi nnirnuda me grihat || shri
    hishi praukshan | purusha njatamagratah | tena deva ayajanta | sadhya rishayashca ye || pu m | ishvarigm
    sarvabhutana ntamihopahvaye shriyam || shri dyajnatsarvahutah | sambhrita mprishadajyam | pashug shcakre
    vayavyan | aranyangramyashca ye || pu || manasah kamamakutim ssatyamashimahi | pashunam rupamannasya
    mayi shri dyajnatsarvahutah | rica ssamani jajnire | chandagmsi jajnire tasma t | yajustasmadajayata
    || pu || kardamena prajabhuta mayi sambhava kardama | shriyam va~saya me kule matara mpadmamalinim
    || shri || tasmadashva ajayanta | ye ke cobhayadatah | gavo ha jajnire tasma jjata ajavayah || pu
    || apah srijantu snigdhani ciklita vasa me grihe | ni ca devi va~saya me kule || shri vya~dadhuh |
    katidha vyakalpayann | mukha nkimasya kau bahu | kavuru padavucyete || pu mpadmamalinim| candram hiranmayim
    njatavedo ma avaha || shri 'sya mukhamasit | bahu rajanyah kritah | uru tadasya yadvaishyah | padbhyagm
    shudro ajayata || pu ya~shtim suvarnam hemamalinim | suryam hiranmayim njatavedo ma avaha || shri
    || candrama manaso jatah | caksho ssuryo ajayata | mukhadindrashcagnishca | pranadvayurajayata ||
    pu mma avaha jatavedo lakshmimanapagamini m | yasyam hiranya mpurushanaham || shri || nabhya asidantariksham
    | shir ssamavartata | padbhya t | tatha lokagm akalpayann || pu || krishnapakshe sahasrashir sha purushah
    | sahasraksha ssahasrapat | sa bhumim vi~shvato vritva | atyatishthaddashangulam || pu || hiranyavarnam
    harinim suvarnarajatasrajam | candram hiranmayim njatavedo ma avaha || shri || purusha evedagm sarvam
    | utamritatvasyeshanah | yadannenatirohati || pu mma avaha jatavedo lakshmimanapagamini m | yasyam
    hiranyam mpurushanaham || shri || etavanasya mahima | ato jyayagshca purushah | pado 'sya vishva bhutani
    | tripadasyamrita || ashvapurvam rathamadhyam hastinadaprabodhinim | shriya ndevimupahvaye shrirmadevirjushatam
    || shri || tripadurdhva udaitpurushah | pado ''bhavatpunah | tato vishvanvyakramat | sashananashane
    abhi || pu smitam hiranyaprakaramardra ntarpayantim | padme sthita ntamihopahvaye shriyam || shri
    dviradajayata | virajo adhi purushah | sa jato atyaricyata | pashcadbhumimatho purah || pu ya~shasa
    jvalantim shriyam lo~ke devajushtamudaram | ta mpadminimim sharanamaha 'lakshmirme nashyata || yatpurushena
    havisha | deva yajnamatanvata | vasanto asyasidajyam | grishma idhmashsharaddhavih || pu || adityavarne
    tapaso 'dhijato vanaspatistava vriksho 'tha bilvah | tasya phalani tapasa nudantu mayantarayashca
    bahya alakshmih || shri || saptasyasanparidhayah | tri ssapta samidhah kritah | deva yadyajna ntanvanah
    | abadhnanpurusha ndevasakhah kirtishca manina saha | pradurbhuto 'smin kirtimriddhi hishi praukshan
    | purusha njatamagratah | tena deva ayajanta | sadhya rishayashca ye || pu || kshutpipasamala njyeshthamalakshmi
    nnashayamyaham | abhutimasamriddhi nnirnuda me grihat || shri dyajnatsarvahutah | sambhrita mprishadajyam
    | pashug shcakre vayavyan | aranyangramyashca ye || pu m | ishvarigm sarvabhutana ntamihopahvaye shriyam
    || shri dyajnatsarvahutah | rica ssamani jajnire | chandagmsi jajnire tasma t | yajustasmadajayata
    || pu || manasah kamamakutim ssatyamashimahi | pashunam rupamannasya mayi shri || tasmadashva ajayanta
    | ye ke cobhayadatah | gavo ha jajnire tasma jjata ajavayah || pu || kardamena prajabhuta mayi sambhava
    kardama | shriyam va~saya me kule matara mpadmamalinim || shri vya~dadhuh | katidha vyakalpayann |
    mukha nkimasya kau bahu | kavuru padavucyete || pu || apah srijantu snigdhani ciklita vasa me grihe
    | ni ca devi va~saya me kule || shri 'sya mukhamasit | bahu rajanyah kritah | uru tadasya yadvaishyah
    | padbhyagm shudro ajayata || pu mpadmamalinim| candram hiranmayim njatavedo ma avaha || shri || candrama
    manaso jatah | caksho ssuryo ajayata | mukhadindrashcagnishca | pranadvayurajayata || pu ya~shtim
    suvarnam hemamalinim | suryam hiranmayim njatavedo ma avaha || shri || nabhya asidantariksham | shir
    ssamavartata | padbhya t | tatha lokagm akalpayann || pu mma avaha jatavedo lakshmimanapagamini m
    | yasyam hiranya mpurushanaham || shri
  devanagari: शुक्लपक्षे हिर॑ण्यवर्णां॒ हरि॑णीं सु॒वर्ण॑रज॒तस्र॑जाम् । च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो
    म॒ आव॑ह ॥ श्री षा॒ पुरु॑षः । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम्
    ॥ पु म्म॒ आव॑ह॒ जात॑वेदो ल॒क्ष्मीमन॑पगा॒मिनी म् । यस्यां॒ हिर॑ण्यं म्पुरु॑षान॒हम् ॥ श्री ॥ पुरु॑ष
    ए॒वेदग्ं सर्वम् । उ॒तामृ॑त॒त्वस्येशा॑नः । य॒दन्ने॑नाति॒रोह॑ति ॥ पु ॥ अ॒श्व॒पू॒र्वां र॑थम॒ध्यां ह॒स्तिना॑दप्र॒बोधि॑नीम्
    । श्रिय॑ न्दे॒वीमुप॑ह्वये॒ श्रीर्मा॑दे॒वीर्जु॑षताम् ॥ श्री ॥ ए॒तावा॑नस्य महि॒मा । अतो॒ ज्यायाग्॑श्च॒
    पूरु॑षः । पादो ऽस्य॒ विश्वा॑ भू॒तानि॑ । त्रि॒पाद॑स्या॒मृत॑ स्मि॒तां हिर॑ण्यप्रा॒कारा॑मा॒र्द्रा न्त॒र्पय॑न्तीम्
    । प॒द्मे॒ स्थि॒ता न्तामि॒होप॑ह्वये॒ श्रियम् ॥ श्री ॥ त्रि॒पादू॒र्ध्व उदै॒त्पुरु॑षः । पादो ऽऽभ॑वा॒त्पुनः॑
    । ततो॒ विष्व॒ङ्व्य॑क्रामत् । सा॒श॒ना॒न॒श॒ने अ॒भि ॥ पु यँ॒शसा॒ ज्वल॑न्तीं॒ श्रियं॑ लोँ॒के दे॒वजु॑ष्टामुदा॒राम्
    । ता म्प॒द्मिनी॑मीं॒ शर॑णम॒ह ऽल॒क्ष्मीर्मे॑ नश्यता॒ द्वि॒राड॑जायत । वि॒राजो॒ अधि॒ पूरु॑षः । स जा॒तो
    अत्य॑रिच्यत । प॒श्चाद्भूमि॒मथो॑ पु॒रः ॥ पु ॥ आ॒दि॒त्यव॑र्णे॒ तप॒सो ऽधि॑जा॒तो वन॒स्पति॒स्तव॑ वृ॒क्षो
    ऽथ बि॒ल्वः । तस्य॒ फला॑नि॒ तप॒सा नु॑दन्तु मा॒यान्त॑रा॒याश्च॑ बा॒ह्या अ॑ल॒क्ष्मीः ॥ श्री ॥ यत्पुरु॑षेण
    ह॒विषा । दे॒वा य॒ज्ञमत॑न्वत । व॒स॒न्तो अ॑स्यासी॒दाज्यम् । ग्री॒ष्म इ॒ध्मश्श॒रद्ध॒विः ॥ पु न्दे॑वस॒खः
    की॒र्तिश्च॒ मणि॑ना स॒ह । प्रा॒दु॒र्भू॒तो ऽस्मिन् की॒र्तिमृ॑द्धि ॥ स॒प्तास्या॑सन्परि॒धयः॑ । त्रि स्स॒प्त
    स॒मिधः॑ कृ॒ताः । दे॒वा यद्य॒ज्ञ न्त॑न्वा॒नाः । अब॑ध्न॒न्पुरु॑ष ॥ क्षुत्पि॑पा॒साम॑ला ञ्ज्ये॒ष्ठाम॑ल॒क्ष्मी
    न्ना॑शया॒म्यहम् । अभू॑ति॒मस॑मृद्धि॒ न्निर्णु॑द मे॒ गृहा॑त् ॥ श्री हिषि॒ प्रौक्षन्॑ । पुरु॑ष ञ्जा॒तम॑ग्र॒तः
    । तेन॑ दे॒वा अय॑जन्त । सा॒ध्या ऋष॑यश्च॒ ये ॥ पु म् । ई॒श्वरी॑ग्ं सर्व॑भूता॒ना॒ न्तामि॒होप॑ह्वये॒ श्रियम्
    ॥ श्री द्य॒ज्ञात्स॑र्व॒हुतः॑ । सम्भृ॑त म्पृषदा॒ज्यम् । प॒शूग् श्च॑क्रे वाय॒व्यान्॑ । आ॒र॒ण्यान्ग्रा॒म्याश्च॒
    ये ॥ पु ॥ मन॑सः॒ काम॒माकू॑तिं स्स॒त्यम॑शीमहि । प॒शू॒नां रू॒पमन्न॑स्य॒ मयि॒ श्री द्य॒ज्ञात्स॑र्व॒हुतः॑
    । ऋच॒ स्सामा॑नि जज्ञिरे । छन्दाग्ं॑सि जज्ञिरे॒ तस्मा त् । यजु॒स्तस्मा॑दजायत ॥ पु ॥ क॒र्दमे॑न प्र॑जाभू॒ता॒
    म॒यि॒ सम्भ॑व क॒र्दम । श्रियं॑ वाँ॒सय॑ मे कु॒ले मा॒तर॑ म्पद्म॒मालि॑नीम् ॥ श्री ॥ तस्मा॒दश्वा॑ अजायन्त
    । ये के चो॑भ॒याद॑तः । गावो॑ ह जज्ञिरे॒ तस्मा ज्जा॒ता अ॑जा॒वयः॑ ॥ पु ॥ आपः॑ सृ॒जन्तु॑ स्नि॒ग्धा॒नि॒
    चि॒क्ली॒त व॑स मे॒ गृहे । नि च॑ दे॒वी वाँ॒सय॑ मे कु॒ले ॥ श्री व्यँ॑दधुः । क॒ति॒धा व्य॑कल्पयन्न् । मुख॒
    ङ्किम॑स्य॒ कौ बा॒हू । कावू॒रू पादा॑वुच्येते ॥ पु म्प॑द्ममा॒लिनीम्। च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो
    म॒ आव॑ह ॥ श्री ऽस्य॒ मुख॑मासीत् । बा॒हू रा॑ज॒न्यः॑ कृ॒तः । ऊ॒रू तद॑स्य॒ यद्वैश्यः॑ । प॒द्भ्याग्ं शू॒द्रो
    अ॑जायत ॥ पु यँ॒ष्टिं॒ सु॒व॒र्णां हे॑ममा॒लिनीम् । सू॒र्यां हि॒रण्म॑यीं ञ्जात॑वेदो म॒ आवह ॥ श्री ॥ च॒न्द्रमा॒
    मन॑सो जा॒तः । चक्षो॒ स्सूर्यो॑ अजायत । मुखा॒दिन्द्र॑श्चा॒ग्निश्च॑ । प्रा॒णाद्वा॒युर॑जायत ॥ पु म्म॒
    आव॑ह॒ जात॑वेदो ल॒क्ष्मीमन॑पगा॒मिनी म् । यस्यां॒ हि॑रण्य॒ म्पुरु॑षान॒हम् ॥ श्री ॥ नाभ्या॑ आसीद॒न्तरि॑क्षम्
    । शी॒र् स्सम॑वर्तत । प॒द्भ्या त् । तथा॑ लो॒काग्ं अ॑कल्पयन्न् ॥ पु ॥ कृष्णपक्षे स॒हस्र॑शीर् षा॒ पुरु॑षः
    । स॒ह॒स्रा॒क्ष स्स॒हस्र॑पात् । स भूमिं॑ विँ॒श्वतो॑ वृ॒त्वा । अत्य॑तिष्ठद्दशाङ्गु॒लम् ॥ पु ॥ हिर॑ण्यवर्णां॒
    हरि॑णीं सु॒वर्ण॑रज॒तस्र॑जाम् । च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो म॒ आव॑ह ॥ श्री ॥ पुरु॑ष ए॒वेदग्ं सर्वम्
    । उ॒तामृ॑त॒त्वस्येशा॑नः । य॒दन्ने॑नाति॒रोह॑ति ॥ पु म्म॒ आव॑ह॒ जात॑वेदो ल॒क्ष्मीमन॑पगा॒मिनी म् । यस्यां॒
    हिर॑ण्यं म्पुरु॑षान॒हम् ॥ श्री ॥ ए॒तावा॑नस्य महि॒मा । अतो॒ ज्यायाग्॑श्च॒ पूरु॑षः । पादो ऽस्य॒ विश्वा॑
    भू॒तानि॑ । त्रि॒पाद॑स्या॒मृत॑ ॥ अ॒श्व॒पू॒र्वां र॑थम॒ध्यां ह॒स्तिना॑दप्र॒बोधि॑नीम् । श्रिय॑ न्दे॒वीमुप॑ह्वये॒
    श्रीर्मा॑दे॒वीर्जु॑षताम् ॥ श्री ॥ त्रि॒पादू॒र्ध्व उदै॒त्पुरु॑षः । पादो ऽऽभ॑वा॒त्पुनः॑ । ततो॒ विष्व॒ङ्व्य॑क्रामत्
    । सा॒श॒ना॒न॒श॒ने अ॒भि ॥ पु स्मि॒तां हिर॑ण्यप्रा॒कारा॑मा॒र्द्रा न्त॒र्पय॑न्तीम् । प॒द्मे॒ स्थि॒ता न्तामि॒होप॑ह्वये॒
    श्रियम् ॥ श्री द्वि॒राड॑जायत । वि॒राजो॒ अधि॒ पूरु॑षः । स जा॒तो अत्य॑रिच्यत । प॒श्चाद्भूमि॒मथो॑ पु॒रः
    ॥ पु यँ॒शसा॒ ज्वल॑न्तीं॒ श्रियं॑ लोँ॒के दे॒वजु॑ष्टामुदा॒राम् । ता म्प॒द्मिनी॑मीं॒ शर॑णम॒ह ऽल॒क्ष्मीर्मे॑
    नश्यता॒ ॥ यत्पुरु॑षेण ह॒विषा । दे॒वा य॒ज्ञमत॑न्वत । व॒स॒न्तो अ॑स्यासी॒दाज्यम् । ग्री॒ष्म इ॒ध्मश्श॒रद्ध॒विः
    ॥ पु ॥ आ॒दि॒त्यव॑र्णे॒ तप॒सो ऽधि॑जा॒तो वन॒स्पति॒स्तव॑ वृ॒क्षो ऽथ बि॒ल्वः । तस्य॒ फला॑नि॒ तप॒सा नु॑दन्तु
    मा॒यान्त॑रा॒याश्च॑ बा॒ह्या अ॑ल॒क्ष्मीः ॥ श्री ॥ स॒प्तास्या॑सन्परि॒धयः॑ । त्रि स्स॒प्त स॒मिधः॑ कृ॒ताः
    । दे॒वा यद्य॒ज्ञ न्त॑न्वा॒नाः । अब॑ध्न॒न्पुरु॑ष न्दे॑वस॒खः की॒र्तिश्च॒ मणि॑ना स॒ह । प्रा॒दु॒र्भू॒तो
    ऽस्मिन् की॒र्तिमृ॑द्धि हिषि॒ प्रौक्षन्॑ । पुरु॑ष ञ्जा॒तम॑ग्र॒तः । तेन॑ दे॒वा अय॑जन्त । सा॒ध्या ऋष॑यश्च॒
    ये ॥ पु ॥ क्षुत्पि॑पा॒साम॑ला ञ्ज्ये॒ष्ठाम॑ल॒क्ष्मी न्ना॑शया॒म्यहम् । अभू॑ति॒मस॑मृद्धि॒ न्निर्णु॑द
    मे॒ गृहा॑त् ॥ श्री द्य॒ज्ञात्स॑र्व॒हुतः॑ । सम्भृ॑त म्पृषदा॒ज्यम् । प॒शूग् श्च॑क्रे वाय॒व्यान्॑ । आ॒र॒ण्यान्ग्रा॒म्याश्च॒
    ये ॥ पु म् । ई॒श्वरी॑ग्ं सर्व॑भूता॒ना॒ न्तामि॒होप॑ह्वये॒ श्रियम् ॥ श्री द्य॒ज्ञात्स॑र्व॒हुतः॑ । ऋच॒
    स्सामा॑नि जज्ञिरे । छन्दाग्ं॑सि जज्ञिरे॒ तस्मा त् । यजु॒स्तस्मा॑दजायत ॥ पु ॥ मन॑सः॒ काम॒माकू॑तिं स्स॒त्यम॑शीमहि
    । प॒शू॒नां रू॒पमन्न॑स्य॒ मयि॒ श्री ॥ तस्मा॒दश्वा॑ अजायन्त । ये के चो॑भ॒याद॑तः । गावो॑ ह जज्ञिरे॒ तस्मा
    ज्जा॒ता अ॑जा॒वयः॑ ॥ पु ॥ क॒र्दमे॑न प्र॑जाभू॒ता॒ म॒यि॒ सम्भ॑व क॒र्दम । श्रियं॑ वाँ॒सय॑ मे कु॒ले मा॒तर॑
    म्पद्म॒मालि॑नीम् ॥ श्री व्यँ॑दधुः । क॒ति॒धा व्य॑कल्पयन्न् । मुख॒ ङ्किम॑स्य॒ कौ बा॒हू । कावू॒रू पादा॑वुच्येते
    ॥ पु ॥ आपः॑ सृ॒जन्तु॑ स्नि॒ग्धा॒नि॒ चि॒क्ली॒त व॑स मे॒ गृहे । नि च॑ दे॒वी वाँ॒सय॑ मे कु॒ले ॥ श्री ऽस्य॒
    मुख॑मासीत् । बा॒हू रा॑ज॒न्यः॑ कृ॒तः । ऊ॒रू तद॑स्य॒ यद्वैश्यः॑ । प॒द्भ्याग्ं शू॒द्रो अ॑जायत ॥ पु म्प॑द्ममा॒लिनीम्।
    च॒न्द्रां हि॒रण्म॑यीं ञ्जात॑वेदो म॒ आव॑ह ॥ श्री ॥ च॒न्द्रमा॒ मन॑सो जा॒तः । चक्षो॒ स्सूर्यो॑ अजायत
    । मुखा॒दिन्द्र॑श्चा॒ग्निश्च॑ । प्रा॒णाद्वा॒युर॑जायत ॥ पु यँ॒ष्टिं॒ सु॒व॒र्णां हे॑ममा॒लिनीम् । सू॒र्यां
    हि॒रण्म॑यीं ञ्जात॑वेदो म॒ आवह ॥ श्री ॥ नाभ्या॑ आसीद॒न्तरि॑क्षम् । शी॒र् स्सम॑वर्तत । प॒द्भ्या त् ।
    तथा॑ लो॒काग्ं अ॑कल्पयन्न् ॥ पु म्म॒ आव॑ह॒ जात॑वेदो ल॒क्ष्मीमन॑पगा॒मिनी म् । यस्यां॒ हि॑रण्य॒ म्पुरु॑षान॒हम्
