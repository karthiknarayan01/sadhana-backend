id: shivapancacamarastotram
category: stotram
name:
  english: shivapancacamarastotram
  devanagari: शिवपन्चचामरस्तोत्रम्
content:
  english: shrishivapancacamarastotram suvarnapadminitatantadivyaharmyavasine suparnavahanapriyaya suryakotitejase
    | aparnaya viharine phanadharendradharine sada namah shivaya te sadashivaya shambhave || 1|| sutungabhangajahnujasudhamshukhandamaulaye
    patangapankajasuhritkripitayonicakshushe | bhujangarajakundalaya punyakalibandhave sada namah shivaya
    te sadashivaya shambhave || 2|| caturmukhananaravindavedagitabhutaye caturbhujanujasharirashobhamanamurtaye
    | caturgunadvirashtakaprakaracitrakelaye sada namah shivaya te sadashivaya shambhave || 3|| sharannishakaraprakashamandahasamanjula
  devanagari: श्रीशिवपञ्चचामरस्तोत्रम् सुवर्णपद्मिनीतटान्तदिव्यहर्म्यवासिने सुपर्णवाहनप्रियाय सूर्यकोटितेजसे
    । अपर्णया विहारिणे फणाधरेन्द्रधारिणे सदा नमः शिवाय ते सदाशिवाय शम्भवे ॥ १॥ सुतुङ्गभङ्गजह्नुजासुधांशुखण्डमौलये
    पतङ्गपङ्कजासुहृत्कृपीटयोनिचक्षुषे । भुजङ्गराजकुण्डलाय पुण्यकालिबन्धवे सदा नमः शिवाय ते सदाशिवाय शम्भवे
    ॥ २॥ चतुर्मुखाननारविन्दवेदगीतभूतये चतुर्भुजानुजाशरीरशोभमानमूर्तये । चतुर्गुणद्विरष्टकप्रकारचित्रकेलये
    सदा नमः शिवाय ते सदाशिवाय शम्भवे ॥ ३॥ शरन्निशाकरप्रकाशमन्दहासमञ्जुला
meaning: {}
