id: kyts-jata-6-4-yagnena-vai-prajaapatih-prajaa-asrujata-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.4 Yagnena Vai Prajaapatih Prajaa Asrujata - Krishna Yajurveda Taittiriya Samhita
content:
  english: yajnena vai vai yajnena yajnena vai | vai prajapatih prajapati rvai vai prajapatih | prajapatih
    prajah prajah prajapatih prajapatih prajah | prajapatiriti praja praja asrijata srijata prajah praja
    asrijata | asrijata ta sta asrijata srijata tah | ta upayadbhi rupayadbhi sta sta upayadbhih | upayadbhi
    revai vopayadbhi rupayadbhi reva | upayadbhirityupayat eva srijata srija taivaiva srijata | dyadasrijata
    srijata yat | upayaja upayaja tyupayaja tyupayaja upayaja upayajati | upayajati prajah praja upayaja
    tyupayajati prajah | praja evaiva prajah praja eva | dyajamano yajamana sta ssrijate srijate yajamano
    yajamana srijate jaghanardhaj jaghanardha thsrijate srijate jaghanardhat | jaghanardha davava jaghanardhaj
    jaghanardha dava | jaghanardhaditi jaghana ava dyati dyatyavava dyati | dyati jaghanardhaj jaghanardha
    ddyati dyati jaghanardhat | jaghanardha ddhi hi jaghanardhaj jaghanardha ddhi | jaghanardhaditi jaghana
    hi prajah praja hi hi prajah | prajah prajayante prajayante prajah prajah prajayante | prajayante
    sthavimata ssthavimatah prajayante prajayante sthavimatah | prajayanta iti pra sthavimato 'vava sthavimata
    ava dyati dyatyavava dyati | ssthavimato dyati dyati sthavimatah | sthavimato hi hi sthavimata hi
    prajah praja hi hi prajah | prajah prajayante prajayante prajah prajah prajayante | prajayante 'sambhinda
    nprajayante prajayante 'sambhindann | prajayanta iti pra asambhindannityasam ava dyati dyatyavava
    dyati | ndyati dyati pranana pranana masambhedaya sambhedaya pranana mpranana masambhedaya | asambhedaya
    na nasambhedaya sambhedaya na | na paryavartayati paryavartayati na na paryavartayati | tparyavartayati
    paryavartayati yat | paryavartayatiti pari paryavartaye dudavarta udavartah paryavartaye tparyavartaye
    dudavartah | paryavartayediti pari udavartah prajah praja udavarta udavartah prajah | praja grahuko
    grahukah prajah praja grahukah | dgrahuko grahuka thsamudragm samudragg ngaccha gaccha samudragm samudra
    gaccha svaha svaha gaccha gaccha svaha svahe titi svaha svaheti | ityahahe tityaha | aha reto reta
    ahaha retah | reta evaiva reto reta eva | || dadha tyantariksha mantariksha ndadhati dadha tyantariksham
    | ngaccha gaccha ntariksha mantariksha gaccha svaha svaha gaccha gaccha svaha svahe titi svaha svaheti
    | ityahahe tityaha | aha ntarikshena ntarikshena haha ntarikshena | antarikshe naivaiva ntarikshena
    ntarikshenaiva | evasma asma evai vasmai asmai prajah praja asma asmai prajah | prajah pra pra prajah
    prajah pra | pra janayati janayati pra pra janayati | janaya tyantariksha mantariksha njanayati janaya
    tyantariksham | antarikshagm hi hyantariksha mantarikshagm hi | hyan vanu hi hyanu | anu prajah praja
    an vanu prajah | prajah prajayante prajayante prajah prajah prajayante | mprajayante prajayante devam
    | prajayanta iti pra devagm savitaragm savitara ngaccha gaccha savitaragm savitara gaccha svaha svaha
    gaccha gaccha svaha svahe titi svaha svaheti | ityahahe tityaha | ssavitriprasuta ahaha savitriprasutah
    | savitriprasuta evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri evasma asma
    evaivasmai asmai prajah praja asma asmai prajah | prajah pra pra prajah prajah pra | pra janayati
    janayati pra pra janayati | janaya tyahoratre ahoratre janayati janaya tyahoratre | ahoratre gaccha
    gaccha horatre ahoratre gaccha | ahoratre ityahah gaccha svaha svaha gaccha gaccha svaha svahetiti
    svaha svaheti | ityahahe tityaha | aha horatrabhya mahoratrabhya mahaha horatrabhya ahoratrabhya mevaiva
    horatrabhya mahoratrabhya meva | ahoratrabhyamityahah evasma asma evai vasmai asmai prajah praja asma
    asmai prajah | prajah pra pra prajah prajah pra | pra janayati janayati pra pra janayati | janaya
    tyahoratre ahoratre janayati janaya tyahoratre | ahoratre hi hyahoratre ahoratre hi | ahoratre ityahah
    hyan vanu hi hyanu | anu prajah praja an vanu prajah | prajah prajayante prajayante prajah prajah
    prajayante | prajayante mitravarunau mitravarunau prajayante prajayante mitravarunau | prajayanta
    iti pra mitravarunau gaccha gaccha mitravarunau mitravarunau gaccha | mitravarunaviti mitra gaccha
    svaha svaha gaccha gaccha svaha svahetiti svaha svaheti | || ityahahe tityaha | aha prajasu praja
    svahaha prajasu | praja svevaiva prajasu praja sveva | eva prajatasu prajata svevaiva prajatasu |
    prajatasu pranapanau pranapanau prajatasu prajatasu pranapanau | prajatasviti pra pranapanau dadhati
    dadhati pranapanau pranapanau dadhati | pranapanaviti prana dadhati somagm soma ngaccha gaccha somagm
    soma gaccha svaha svaha gaccha gaccha svaha svahetiti svaha svaheti | ityahahe tityaha | ssaumya ahaha
    saumyah | saumya hi hi saumya hi devataya devataya hi hi devataya | devataya prajah praja devataya
    devataya prajah | mprajah praja yajnam | gaccha svaha svaha gaccha gaccha svaha svahetiti svaha svaheti
    | ityahahe tityaha | aha prajah praja ahaha prajah | praja evaiva prajah praja eva | eva yajniya yajniya
    evaiva yajniyah karoti karoti yajniya yajniyah karoti chandagmsi chandagmsi karoti karoti chandagmsi
    | chandagmsi gaccha gaccha chandagmsi chandagmsi gaccha | gaccha svaha svaha gaccha gaccha svaha svahetiti
    svaha svaheti | ityahahe tityaha | aha pashavah pashava ahaha pashavah | pashavo vai vai pashavah
    pashavo vai | vai chandagmsi chandagmsi vai vai chandagmsi | npashun chandagmsi chandagmsi pashun
    | ava rundhe rundhe 'vava rundhe | rundhe dyavaprithivi dyavaprithivi rundhe rundhe dyavaprithivi
    | dyavaprithivi gaccha gaccha dyavaprithivi dyavaprithivi gaccha | dyavaprithivi iti dyava gaccha
    svaha svaha gaccha gaccha svaha svahetiti svaha svaheti | ityahahe tityaha | aha prajah praja ahaha
    prajah | praja evaiva prajah praja eva | eva prajatah prajata evaiva prajatah | prajata dyavaprithivibhya
    ndyavaprithivibhya mprajatah prajata dyavaprithivibhya dyavaprithivibhya mubhayata ubhayato dyavaprithivibhya
    ndyavaprithivibhya mubhayatah | dyavaprithivibhyamiti dyava ryubhayata ubhayatah pari | pari grihnati
    grihnati pari pari grihnati | grihnati nabho nabho grihnati grihnati nabhah | nnabho nabho divyam
    | || gaccha svaha svaha gaccha gaccha svaha svahetiti svaha svaheti | ityahahe tityaha | aha prajabhyah
    prajabhya ahaha prajabhyah | prajabhya evaiva prajabhyah prajabhya eva | eva prajatabhyah prajatabhya
    evaiva prajatabhyah | prajatabhyo vrishtim mprajatabhyah prajatabhyo vrishti prajatabhya iti pra ni
    yacchati yacchati ni ni yacchati | yaccha tyagni magnim ya~cchati yaccha tyagnim | shvanara magni
    magnim ngaccha gaccha vaishvanaram gaccha svaha svaha gaccha gaccha svaha svahetiti svaha svaheti
    | ityahahe tityaha | aha prajah praja ahaha prajah | praja evaiva prajah praja eva | eva prajatah
    prajata evaiva prajatah | prajata asya masya mprajatah prajata asyam | mprati pratyasya masya prati
    shthapayati sthapayati prati prati shthapayati | sthapayati pranana mprananag sthapayati sthapayati
    pranana va esha esha vai va eshah | esho 'va vaisha esho 'va | ava dyati dya tyavava dyati | dyati
    yo yo dyati dyati yah | yo 'vadya tyavadyati yo yo 'vadyati | avadyati gudasya gudasya vadya tyavadyati
    gudasya | gudasya mano mano gudasya gudasya manah | mano me me mano mano me | me hardi hardi me me
    hardi | hardi yaccha yaccha hardi hardi yaccha | yacchetiti yaccha yaccheti | ityahahe tityaha | nprana
    nahaha pranan | prana nevaiva prana ya~thasthana mevaiva yathasthanam | yathasthana mupopa yathasthanam
    yathasthanamiti yatha upa hvayate hvayata upopa hvayate | hvayate pashoh pashor hvayate hvayate pashoh
    | va alabdhasya labdhasya vai va alabdhasya | alabdhasya hridayagm hridaya malabdhasya labdhasya hridayam
    | hridayagm shuk chug ghridayagm hridayagm shuk | shugriccha tyricchati shuk chugricchati | ricchati
    sa sarccha tyricchati sa | sa hridayashulagm hridayashulagm sa sa hridayashulam | hridayashula mabhyabhi
    hridayashulagm hridayashula mabhi | hridayashulamiti hridaya abhi sagm sa mabhyabhi sam | tyeti sagm
    sa meti | prithivyagm hridayashulagm hridayashula mprithivyagm hridayashulam | hridayashula mudvasaye
    dudvasaye ddhridayashulagm hridayashula mudvasaye hridayashulamiti hridaya mprithivi mudvasaye dudvasaye
    udvasayedityut prithivigm shuca shuca prithivi mprithivigm shuca | shuca 'rpaye darpayec chuca shuca
    'rpayet | shshuca shuca 'po 'pa shuca 'rpaye darpayec chuca shuca 'rpayet | arpayec chushkasya shushka
    syarpaye darpayec chushkasya | shushkasya ca ca shushkasya shushkasya ca | cardra syardrasya ca cardrasya
    | ardrasya ca cardra syardrasya ca | ca sandhau sandhau ca ca sandhau | thsandhau sandha vut | dvasayati
    vasaya tyudu vasaya tyubhaya syobhayasya vasayati vasaya tyubhayasya | ubhayasya shantyai shantya
    ubhaya syobhayasya shantyai ya~gm shantyai shantyai yam | dhyayec chuca shuca dhyaye shucaivaiva shuca
    shucaiva | evaina mena mevai vaina ena marpaya tyarpaya tyena mena marpayati | arpayatityarpayati
    | || deva vai vai deva deva vai | vyabhajanta bhajanta vi vyabhajanta | abhajanta tata stato 'bhajanta
    bhajanta tatah | yadatyashishyata tyashishyata ya ttadatyashishyata tyashishyata tat | atyashishyatetyati
    vasatu nu nu vasatu vasatu nu | nu no no nu nu nah | ida miti tida mida miti | ntasmigg stasmin vasativaritvamiti
    vasativari npratah prata stasmigg stasmi rna na pratah prata nthsagm sa mashaknuvann | aphsu pra pra
    phsvaphsu pra | npra pra veshayann | rvasativari sta sta vasativarih rvasativari rabhavann | rgrihnati
    grihnati vasativari grihnati yajno yajno grihnati grihnati yajnah | yajno vai vai yajno yajno vai
    | eva rabhya rabhyai vaiva rabhya | arabhya grihitva grihitva ''rabhya rabhya grihitva | grihitvo
    popa grihitva grihi tvopa | upa vasati vasa tyupopa vasati | vasati yasya yasya vasati vasati yasya
    | yasya grihita agrihita yasya yasya grihitah | agrihita abhyabhya grihita agrihita abhi | nnimroce
    dabhyabhi nimroce nimroce danarabdho 'narabdho nimroce nnimroce danarabdhah | anarabdho 'syasya narabdho
    'narabdho 'sya | asya yajno yajno vi cchindyac chindya dvi vi cchindyat | chindyaj jyotishya jyotishya
    chindyac chindyaj jyotishya jyotishya va va jyotishya dva va grihniyat | grihniya ddhiranyagm hiranya
    dgrihniya ddhiranyam | va~ va hiranyagm hiranyam va 'vadhaya vadhaya va va 'vadhaya | avadhaya sashukranagm
    sashukrana mavadhaya vadhaya sashukranam | sashukrana mevaiva sashukranagm sashukrana meva | eva grihnati
    grihna tyevaiva grihnati | grihnati yo yo grihnati grihnati yah | va brahmano bra hmano va va brahmanah
    | brahmano bahuyaji bahuyaji bra bahuyaji tasya tasya bahuyaji bahuyaji tasya | ntasya tasya kumbhyanam
    | hi grihitavasativariko grihitavasativariko hi hi grihitavasativarikah | grihitavasativariko vasativari
    rgrihitavasativariko grihitavasativariko vasativarih grihitavasativarika iti grihita rgrihnati grihnati
    vasativari grihnati pashavah pashavo grihnati grihnati pashavah | pashavo vai vai pashavah pashavo
    vai | eva rabhya rabhyai vaiva rabhya | arabhya grihitva grihitva ''rabhya rabhya grihitva | grihi
    tvopopa grihitva grihi tvopa | upa vasati vasa tyupopa vasati | ntishthagg stishtha ttishthagg stishtha
    nnirmarguka nirmarguka grihniya nirmarguka asma dasma nnirmarguka nirmarguka asmat | nirmarguka iti
    nih ssyuh pashavah pashavah syuh | syuh syuh pratipam | ntishthagg stishtha ngrihnati grihnati tishthagg
    stishtha grihnati pratiruddhya pratiruddhya grihnati grihnati pratiruddhya | pratiruddhyaivaiva pratiruddhya
    pratiruddhyaiva | pratiruddhyeti prati evasma asma evai vasmai npashuna sma asmai pashun | ngrihnati
    grihnati pashu grihna tindra indro grihnati grihna tindrah | vri~tra mindra indro vritram | || abhya
    mriyata mriyata bhya ntasa mamriyata mriyata tasa yajniyagm sadevagm sadevam ya~jniyagm sadevam |
    thsadevagm sadeva masi atyamucyata mucyata tya tyamucyata | amucyata ta sta amucyata mucyata tah |
    rvahanti sta sta vahantih | ngrihnati grihnati vahantinam grihnati ya ya grihnati grihnati yah | ya
    evaiva ya ya eva | eva meddhya meddhya evaiva meddhyah meddhya yajniya yajniya meddhya meddhya yajniyah
    ssadeva yajniya yajniya ntasa mapa apa stasa eva grihnati grihna tyevaiva grihnati | grihnati na na
    grihnati grihnati na | nantama antama na nantamah | rvahanti rantama antama vahantih | vahanti ratyati
    vahanti atiya diya datya tiyat | yadantama antama ya rvahanti rantama antama vahantih | vahanti ratiya
    datiya rvahanti ratiyat | ya~jna matiya datiya yajna matyati yajnam ati manyeta manyeta tyati manyeta
    | manyeta na na manyeta manyeta na | na sthavaranag sthavarana thsthavaranag sthavarana dvarunagrihita
    varunagrihita grihniya varunagrihita vai vai varunagrihita varunagrihita vai | varunagrihita iti varuna
    ssthavara vai vai sthavarah | thsthavaranag sthavaranam thsthavaranag sthavarana dvarunena varunena
    grihniya varunena syasya varunena varunenasya | ya~jna masyasya yajnam | vai diva diva vai vai diva
    diva bhavati bhavati diva diva bhavati | bhava tyapo 'po bhavati bhava tyapah | apo ratri ratri rapo
    'po ratrih | ratrih pra pra ratri ratrih pra | pra vishati vishati pra pra vishati | dvishati vishati
    tasma ttamra stamra stasma tamra apa apa stamra stamra apah | apo diva diva ''pa apo diva diva dadrishre
    dadrishre diva diva dadrishre | ddadrishre dadrishre yat | mbhavati bhavati nakta bhava tyapo 'po
    bhavati bhava tyapah | apo 'ha raha rapo 'po 'hah | ahah pra praha rahah pra | pra vishati vishati
    pra pra vishati | dvishati vishati tasma c candra shcandra stasma candra apa apa shcandra shcandra
    apah | nnakta mapa apo nakta ndadrishre dadrishre nakta dadrishre chayayai chayayai dadrishre dadrishre
    chayayai chayayai ca ca chayayai chayayai ca | catapata atapata shca catapatah | atapata shca catapata
    atapata shca | ca sandhau sandhau ca ca sandhau | sandhau grihnati grihnati sandhau sandhau grihnati
    | grihna tyahoratrayo rahoratrayo rgrihnati grihna tyahoratrayoh ahoratrayo revaiva horatrayo rahoratrayo
    reva | ahoratrayorityahah evasma asma evai vasmai va~rna masma asmai varna ngrihnati grihnati varnam
    grihnati havishmatir rgrihnati grihnati havishmatih | havishmati rima ima havishmatir ima apa apa
    ima ima apah | apa iti tyapa apa iti | ityahahe tityaha | aha havishkritanagm havishkritana mahaha
    havishkritanam | havishkritana mevaiva havishkritanagm havishkritana meva | havishkritanamiti havih
    eva grihnati grihna tyevaiva grihnati | grihnati havishman ngrihnati grihnati havishman | havishmagm
    astvastu havishman havishmagm astu | ssuryo astvastu suryah | || surya ititi surya ityahahe tityaha
    | aha sashukranagm sashukrana mahaha sashukranam | sashukrana mevaiva sashukranagm sashukrana meva
    | eva grihnati grihna tyevaiva grihnati | grihna tyanushtubha 'nushtubha grihnati grihna tyanushtubha
    anushtubha grihnati grihna tyanushtubha 'nushtubha grihnati | grihnati vag vag grihnati grihnati vak
    | vag vai vai vag vag vai | va anushtu ganushtug vai va anushtuk | anushtug vaca vaca 'nushtu ganushtug
    vaca | vacaivaiva vaca vacaiva | evaina ena evai vainah ssarvaya sarvayaina ena sarvaya grihnati grihnati
    sarvaya sarvaya grihnati | grihnati catushpadaya catushpadaya grihnati grihnati catushpadaya | ca
    catushpadaya catushpadaya r catushpadayeti catuh rica grihnati grihna tyrica r grihnati tri stri rgrihnati
    grihnati trih | ssadayati sadayati tri stri sadayati sapta sapta sadayati sadayati sapta | sapta sagm
    sagm sapta sapta sam | mpadyante padyante sagm sa padyante saptapada saptapada padyante padyante saptapada
    | saptapada shakvari shakvari saptapada saptapada shakvari | shakvari pashavah pashava shshakvari
    shakvari pashavah | shshakvari shakvari pashavah pashava nchakvari shakvari pashun | ava rundhe rundhe
    'vava rundhe | rundhe 'sma asmai rundhe rundhe 'smai | asmai vai va asma asmai vai | vai lokaya lokaya
    vai vai lokaya | hapatyo lokaya lokaya gar a dhiyate dhiyata a dhiyate | dhiyate 'mushma amushmai
    dhiyate dhiyate 'mushmai amushma ahavaniya ahavaniyo 'mushma amushma ahavaniyah | dyadahavaniya ahavaniyo
    yat | hapatya upasadaye dupasadaye nnupasadaye dupasadaye dasminn | asmin ~loke loke npashuman ~loke
    loke pashuman | yadahavaniya ahavaniye ya ahavaniye 'mushmi nnahavaniya ahavaniye 'mushminn | amushmin
    ~loke loke 'mushmi nnamushmin ~loke | || npashuman ~loke loke pashuman | sya dubhayo rubhayo ubhayo
    rupo pobhayo rubhayo rupa | upa sadayati sadaya tyupopa sadayati | sadaya tyubhayo rubhayo ssadayati
    sadaya tyubhayoh ubhayo revai vobhayo rubhayo reva | evaina mena mevai vaina rlokayo rena menam ~lokayoh
    mpashumantam ~lokayo nkaroti karoti pashumanta karoti sarvatah sarvatah karoti karoti sarvatah | sarvatah
    pari pari sarvatah sarvatah pari | pari harati harati pari pari harati | harati rakshasagm rakshasagm
    harati harati rakshasam | rakshasa mapahatya apahatyai rakshasagm rakshasa mapahatyai | apahatya indragniyo
    rindragniyo rapahatya apahatya indragniyoh | rbhagadheyi rindragniyo rindragniyo indragniyoriti sthetiti
    stha stheti | ityahahe tityaha | ryathayaju rahaha yathayajuh | yathayaju revaiva yathayaju evaita
    deta devai vaitat | ddhra eta deta dagni upa vasayati vasaya tyupopa vasayati | dvasayati vasaya tyetat
    | vai yajnasya yajnasya vai vai yajnasya | yajnasya parajita maparajitam ya~jnasya yajnasya parajitam
    | dyadaparajita maparajitam eva yajnasya yajnasyaivaiva yajnasya | yajnasya parajita maparajitam ya~jnasya
    yajnasya parajitam | ttadaparajita maparajita evaina ena evai vainah ena upopaina ena upa | upa vasayati
    vasaya tyupopa vasayati | vasayati yato yato vasayati vasayati yatah | yatah khalu khalu yato yatah
    khalu | khalu vai vai khalu khalu vai | vai yajnasya yajnasya vai vai yajnasya | yajnasya vitatasya
    vitatasya yajnasya yajnasya vitatasya | vitatasya na na vitatasya vitatasya na | kriyate na na kriyate
    ya~jna man vanu yajnam | yajnagm rakshagmsi rakshagmsi yajnam ya~jnagm rakshagmsi | rakshag syavava
    rakshagmsi rakshag syava | dyac caranti caranti yat | ngrihnati grihnati vahantinam grihnati kriyamana
    ngrihnati grihnati kriyamanam | kriyamana mevaiva kriyamana dyajnasya yajnasya ta yajnasya shaye shaye
    yajnasya yajnasya shaye | shaye rakshasagm rakshasagm shaye shaye rakshasam | rakshasa mananvavacaraya
    nanvavacaraya rakshasagm rakshasa mananvavacaraya | ananvavacaraya na nananvavacaraya nanvavacaraya
    na | ananvavacarayetyananu hyeta eta hi hyetah | eta ilayanti laya ntyeta eta ilayanti | ilaya ntyelayanti
    layantya | ttritiyasavanada tritiyasavanat | tpari pari tritiyasavana tritiyasavanaditi tritiya pari
    shere shere pari pari shere | shere yajnasya yajnasya shere shere yajnasya | yajnasya santatyai santatyai
    yajnasya yajnasya santatyai | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina
    iti brahma vadanti sa sa vadanti vadanti sah | va addhvaryu raddhvaryu rvai va addhvaryuh | thsya
    daddhvaryu raddhvaryu nthsomagm soma mupavaharann | upavaharannityupa bhya upavahare dupavahare upavahare
    diti tyupavahare dupavahare diti | iti hride hrida ititi hride | tva hride hride tva tvetiti tva tveti
    | ityahahe tityaha | evaite naite naivai vaitena | etena karoti karo tyete naitena karoti | karoti
    manase manase karoti karoti manase | manase tva tva manase manase tva | tvetiti tva tveti | ityahahe
    tityaha | aha pitribhyah pitribhya ahaha pitribhyah | pitribhya evaiva pitribhyah pitribhya eva |
    pitribhya iti pitri evaite naite naivai vaitena | etena karoti karo tyetenai tena karoti | karoti
