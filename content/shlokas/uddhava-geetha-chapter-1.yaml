id: uddhava-geetha-chapter-1
category: stotram
name:
  english: Uddhava Geetha - Chapter 1
content:
  english: shriradhakrishnabhyam namah | shrimadbhagavatapuranam | ekadashah skandhah | uddhava gita |
    atha prathamo'dhyayah | shribadarayanih uvaca | kritva daityavadham krishnah saramah yadubhih vritah
    | bhuvah avataravat bharam javishthan janayan kalim || || ye kopitah subahu pandusutah sapatnaih durdyutahelanakacagrahana
    adibhih tan | kritva nimittam itara itaratah sametan hatva nripan niraharat kshitibharam ishah ||
    || bhubhararajapritana yadubhih nirasya guptaih svabahubhih acintayat aprameyah | manye avaneh nanu
    gatah api agatam hi bharam yat yadavam kulam aho hi avishahyam aste || || na eva anyatah paribhavah
    asya bhavet kathancit mat samshrayasya vibhava unnahan asya nityam | antahkalim yadukulasya vidhhaya
    venuh tambasya vahnim iva shantim upaimi dhama || || evam vyavasitah rajan satyasankalpah ishvarah
    | shapavyajena vipranam sanjahve svakulam vibhuh || || svamurtya lokalavanyanirmuktya locanam nrinam
    | girbhih tah smaratam cittam padaih tan ikshatam kriya || || acchidya kirtim sushlokam vitatya hi
    anjasa nu kau | tamah anaya tarishyanti iti agat svam padam ishvarah || || raja uvaca | brahmanyanam
    vadanyanam nityam vriddhaupasevinam | viprashapah katham abhut vrishninam krishnacetasam || || yat
    nimittah sah vai shapah yadrishah dvijasattama | katham ekatmanam bhedah etat sarvam vadasva me ||
    || shrishukah uvaca | bibhrat vapuh sakalasundarasannivesham karmacaran bhuvi sumangalam aptakamah
    | asthaya dhama ramamanah udarakirtih samhartum aicchata kulam sthitakrityasheshah || || karmani punyanivahani
    sumangalani gayat jagat kalimalapaharani kritva | kala atmana nivasata yadudevagehe pindarakam samagaman
    munayah nisrishtah || || vishvamitrah asitah kanvah durvasah bhriguh angirah | kashyapah vamadevah
    atrih vasishthah narada adayah || || kridantah tan upavrajya kumarah yadunandanah | upasangrihya papracchuh
    avinita vinitavat || || te veshayitva striveshaih sambam jambavatisutam | esha pricchati vah viprah
    antarvat nyasita ikshana || || prashtum vilajjati sakshat prabruta amoghadarshanah | prasoshyanti
    putrakama kimsvit sanjanayishyati || || evam pralabdhva munayah tan ucuh kupita nripa | janayishyati
    vah mandah musalam kulanashanam || ritva te atisantrastah vimucya sahasodaram | sambasya dadrishuh
    tasmin musalam khalu ayasmayam || || kim kritam mandabhagyaih kim vadishyanti nah janah | iti vihvalitah
    gehan adaya musalam yayuh || || tat ca upaniya sadasi parimlanamukhashriyah | rajnah avedayan cakruh
    sarvayadavasannidhau || || shrutva amogham viprashapam drishtva ca musalam nripa | vismitah bhayasantrastah
    babhuvuh dvarakaukasah || || tat curnayitva musalam yadurajah sah ahukah | samudrasalile prasyat loham
    ca asya avasheshitam || || kashcit matsyah agrasit loham curnani taralaih tatah | uhyamanani velayam
    lagnani asan kila airikah || || matsyah grihitah matsyaghnaih jalena anyaih saha arnave | tasya udaragatam
    loham sah shalye lubdhakah akarot || || bhagavan jnatasarvarthah ishvarah api tadanyatha | kartum
    na aicchat viprashapam kalarupi anvamodata || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    viprashapo nama prathamo'dhyayah ||
  devanagari: श्रीराधाकृष्णाभ्यां नमः । श्रीमद्भागवतपुराणम् । एकादशः स्कन्धः । उद्धव गीता । अथ प्रथमोऽध्यायः
    । श्रीबादरायणिः उवाच । कृत्वा दैत्यवधं कृष्णः सरमः यदुभिः वृतः । भुवः अवतारवत् भारं जविष्ठन् जनयन्
    कलिम् ॥ ॥ ये कोपिताः सुबहु पाण्डुसुताः सपत्नैः दुर्द्यूतहेलनकचग्रहण आदिभिः तान् । कृत्वा निमित्तं
    इतर इतरतः समेतान् हत्वा नृपान् निरहरत् क्षितिभारं ईशः ॥ ॥ भूभारराजपृतना यदुभिः निरस्य गुप्तैः स्वबाहुभिः
    अचिन्तयत् अप्रमेयः । मन्ये अवनेः ननु गतः अपि अगतं हि भारम् यत् यादवं कुलं अहो हि अविषह्यं आस्ते ॥
    ॥ न एव अन्यतः परिभवः अस्य भवेत् कथञ्चित् मत् संश्रयस्य विभव उन्नहन् अस्य नित्यम् । अन्तःकलिं यदुकुलस्य
    विध्हाय वेणुः तम्बस्य वह्निं इव शान्तिं उपैमि धाम ॥ ॥ एवं व्यवसितः राजन् सत्यसङ्कल्पः ईश्वरः । शापव्याजेन
    विप्राणां सञ्जह्वे स्वकुलं विभुः ॥ ॥ स्वमूर्त्या लोकलावण्यनिर्मुक्त्या लोचनं नृणाम् । गीर्भिः ताः
    स्मरतां चित्तं पदैः तान् ईक्षतां क्रिया ॥ ॥ आच्छिद्य कीर्तिं सुश्लोकां वितत्य हि अञ्जसा नु कौ । तमः
    अनया तरिष्यन्ति इति अगात् स्वं पदं ईश्वरः ॥ ॥ राजा उवाच । ब्रह्मण्यानां वदान्यानां नित्यं वृद्धौपसेविनाम्
    । विप्रशापः कथं अभूत् वृष्णीनां कृष्णचेतसाम् ॥ ॥ यत् निमित्तः सः वै शापः यादृशः द्विजसत्तम । कथं एकात्मनां
    भेदः एतत् सर्वं वदस्व मे ॥ ॥ श्रीशुकः उवाच । बिभ्रत् वपुः सकलसुन्दरसन्निवेशम् कर्माचरन् भुवि सुमङ्गलं
    आप्तकामः । आस्थाय धाम रममाणः उदारकीर्तिः संहर्तुं ऐच्छत कुलं स्थितकृत्यशेषः ॥ ॥ कर्माणि पुण्यनिवहानि
    सुमङ्गलानि गायत् जगत् कलिमलापहराणि कृत्वा । काल आत्मना निवसता यदुदेवगेहे पिण्डारकं समगमन् मुनयः निसृष्टाः
    ॥ ॥ विश्वामित्रः असितः कण्वः दुर्वासाः भृगुः अङ्गिराः । कश्यपः वामदेवः अत्रिः वसिष्ठः नारद आदयः ॥
    ॥ क्रीडन्तः तान् उपव्रज्य कुमाराः यदुनन्दनाः । उपसङ्गृह्य पप्रच्छुः अविनीता विनीतवत् ॥ ॥ ते वेषयित्वा
    स्त्रीवेषैः साम्बं जाम्बवतीसुतम् । एषा पृच्छति वः विप्राः अन्तर्वत् न्यसित ईक्षणा ॥ ॥ प्रष्टुं विलज्जति
    साक्षात् प्रब्रूत अमोघदर्शनाः । प्रसोष्यन्ति पुत्रकामा किंस्वित् सञ्जनयिष्यति ॥ ॥ एवं प्रलब्ध्वा मुनयः
    तान् ऊचुः कुपिता नृप । जनयिष्यति वः मन्दाः मुसलं कुलनाशनम् ॥ ऋत्वा ते अतिसन्त्रस्ताः विमुच्य सहसोदरम्
    । साम्बस्य ददृशुः तस्मिन् मुसलं खलु अयस्मयम् ॥ ॥ किं कृतं मन्दभाग्यैः किं वदिष्यन्ति नः जनाः । इति
    विह्वलिताः गेहान् आदाय मुसलं ययुः ॥ ॥ तत् च उपनीय सदसि परिम्लानमुखश्रियः । राज्ञः आवेदयान् चक्रुः
    सर्वयादवसन्निधौ ॥ ॥ श्रुत्वा अमोघं विप्रशापं दृष्ट्वा च मुसलं नृप । विस्मिताः भयसन्त्रस्ताः बभूवुः
    द्वारकौकसः ॥ ॥ तत् चूर्णयित्वा मुसलं यदुराजः सः आहुकः । समुद्रसलिले प्रास्यत् लोहं च अस्य अवशेषितम्
    ॥ ॥ कश्चित् मत्स्यः अग्रसीत् लोहं चूर्णानि तरलैः ततः । उह्यमानानि वेलायां लग्नानि आसन् किल ऐरिकाः
    ॥ ॥ मत्स्यः गृहीतः मत्स्यघ्नैः जालेन अन्यैः सह अर्णवे । तस्य उदरगतं लोहं सः शल्ये लुब्धकः अकरोत् ॥
    ॥ भगवान् ज्ञातसर्वार्थः ईश्वरः अपि तदन्यथा । कर्तुं न ऐच्छत् विप्रशापं कालरूपी अन्वमोदत ॥ ॥ इति श्रीमद्भागवते
    महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे विप्रशापो नाम प्रथमोऽध्यायः ॥
