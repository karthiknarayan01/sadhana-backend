id: dattastotramshridharasvami
category: stotram
name:
  english: dattastotramshridharasvami
  devanagari: दत्तस्तोत्रम्श्रीधरस्वामी
content:
  english: pahi hinosmyaham | aham yadi samuddhrito bhuvi na durghatam te bhavet susadhyamakhilam tatah
    kuru dayam ca mamuddhara || 28|| ativa vinatosmyaham vishayamohapasharditah kshanam yugasamam bhavedvirahato'tiduhkhi
    guro | jalabdahiraho yada bhavati kim sukhi matsyakah tathaiva bahiragatastava nijasthiterasmyaham
    || 29|| upadhita iti bruve nijamatho'malam vedmyaham tvayaiva nirupadhiko nanu guro na mam tvam jahi
    | asanga upavidya bhoh satatamatra mamuddhara yadi tvamahameva tatkimiti hatumarho bhaveh || 30||
    prabho tyajasi mam hi cettava na darshanam dasyasi na shakya iti bho guro khaluhasanti kirtirna te
    | madiyamapi jivanam bhavati garhitam he prabho jahi hi na guro kripam kuru ca darshanam dehi me ||
    31|| vadeyamiti kim guro sakalahridgatam vetsi bhoh stuve kimadhikam stute shrutiraho prabho tvam
    sada | anekasagunairvrita madadhikashca bhaktastava tvameva hi guro'dvayo mama tu ko'pi nanyo bhuvi
    || 32|| vicarya sakalam guro kuru tatha yatha tvanmatih balatkimiha shakyate savinayena bhoh prarthaye
    | anathamiti mam guro kuru sanathamasminjane hyativa dayayayuto jhatiti darshanam dehi me || 33||
    sanatana iti shruto bhavati vishvasetustu yo bhavatprabhavadharma evamiha dushtadaityairhritah | satitvamapi
    lanchitam kila vidambanam duhsaham prabho svajanarakshane kimiti shankase'dyapi hi || 34|| mumukshujanadurdasha
    kathamiyam ca sahya tava mumukshujanajivitam bahu vigarhitam laukikaih | hasanti paramarthinam khalu
    na vishvasantiha te sura api chalanti bho bahubalacca kamadikaih || 35|| kalau tu paramarthinam jagati
    jivanam kashtadam aham khalu na tatsahe tava tadarthamevashrayah | svarupapathagaminastvamiha me sahayo
    bhava guro'tidayayayutastava padambujam darshaya || 36|| ativa khalu durjaya santata kashmala dushcara
    sadaiva sukhamahita vishayavasana yojane | aho duritarupini kila bhavedavidya tu ya tavaiva kripaya
    vina na ca kadapi shamyedguro || 37|| svayam hi na sahayakridbhavasi sadhakanam yadi vritha kimiti
    rajase tvamiha dattanamna guro | turiyapadanandinah patitapavanasya prabho kimipsitasukham ca te jagati
    jivamokshadrite || 38|| kshamasva dayayayuto yadi bhaved duruktirmama kshamasva ca guro kuto'pi vinayasya
    bhango yadi | na heturiha me prabho bhavati tadrisho vetsi mam tvameva mama jivanam gatirapi svabhumnah
    sukham || 39|| dayabdhiramito'si bhoh sakalabhutavaso guruh svatantra sakalartha vitsunipuno jagatpavanah
    | tavatra jagatitale prakatanam ca yatsvecchaya svabhaktajanamuktaye dhruvamidam hi datta prabho ||
    40|| vilambaya jagadguro kshanamapiha ma dhavane tvadiya padadarshanajjagati mam sanatham kuru | apavrinu
    vimohanam sakalamayikam bandhanam tvadiya sakalatmake sthirapade ca mam sthapaya || 41|| tvadiya padadarshanatsakaladuhkha
    shantirnrinam tvadiya padapankajam dahati dushkritam papakam | katham vasati tattrinam dhagadhagavamane'nile
    katham sthirati tattamo gaganamadhyasuryatape || 42|| kimarthamiti shankase na ca kimarthamayasi bho
    bhavenna mama dushkritam kimapi cettavagre guro | kimasti khalu vighnakritpratividhatumatra prabho
    tvameva paramam brihattava samo na kova'dhikah || 43|| na devarajanicarau manujavanyavakshadikah kshamashca
    damane tada manasi cettavastiha bhoh | vidhirna ca kuyoga ityapi bhavenna copasanam kimasti khalu
    vighnakrittava na darshanam me guro || 44|| na karma sacivo'si bhoh phalitamikshase cedguro na yoga
    iti vakshi cetkathamidam tvaya bhavyate | svatantra nirupadhikah sakalamangalastvam yatah vilobhaya
    na mam guro jhatiti darshanam dehi me || 45|| kimarthamatinirghrino bhavasi bho dayasagarah dayabdhirapi
    nirghrino mama na vakvadettatvatah | kimarthamatidurlabham caranadarshanam te vada nirupayitumapyaho'tra
    tava hetumayahi bhoh || 46|| aho na khalu varito bhavati samshayo bho yada na so'hamiti vedayah pashusamah
    sa vedo'vadat | nijam hi kathayami te mama na vismritam tatkada hyaham tvamiti nishcayo mama na samshayo'sminkvacit
    || 47|| na mrityuvashago guro'hamiti bhedabhanena bho na bhirapi bhavetprabho bhavati sa dvitiyadyatah
    | aham tvamiti cetkatham cirayase guro mam vada kimarthamanusamshayo jahi hi te padam darshaya ||
    48|| aho jagadidam guro vividhanamarupatmakam tathapi nijamatrato'tra khalu vedmyaham tadyatha | tathaiva
    tavadarshane mama na bhinnabhavam kvacit tathapi jagatitale bhavati tena karyam brihat || 49|| adharmarucayo
    jana bata hitam na jananti yat anitivashavartinam hi bahumanvate laukikah | aho jagati durlabha bhavati
    tattvadrishtirguro dhruvam hi tava darshanam kila tavavataro bhuvi || 50|| guro ciraya ma prabho tvaraya
    harshanam dehi me bruve kimadhikam stuve ciramatho vibho'smatparam | atipranatavatsalo'si khalu vishvakalyanakrit
    manobhilashitam tavastu nijabhumni mam sthapaya || 54|| iti shrimatparamahamsaparivrajakacaryasadgurubhagavata
    shridharasvamina viracitam shridattastotram sampurnam ||
  devanagari: पाहि हीनोस्म्यहम् । अहं यदि समुद्धृतो भुवि न दुर्घटं ते भवेत् सुसाध्यमखिलं ततः कुरु दयां
    च मामुद्धर ॥ २८॥ अतीव विनतोस्म्यहं विषयमोहपाशार्दितः क्षणं युगसमं भवेद्विरहतोऽतिदुःखी गुरो । जलाब्दहिरहो
    यदा भवति किं सुखी मत्स्यकः तथैव बहिरागतस्तव निजस्थितेरस्म्यहम् ॥ २९॥ उपाधित इति ब्रुवे निजमथोऽमलं
    वेद्म्यहं त्वयैव निरुपाधिको ननु गुरो न मां त्वं जहि । असङ्ग उपविद्य भोः सततमात्र मामुद्धर यदि त्वमहमेव
    तत्किमिति हातुमर्हो भवेः ॥ ३०॥ प्रभो त्यजसि मां हि चेत्तव न दर्शनं दास्यसि न शक्य इति भो गुरो खलुहसन्ति
    कीर्तिर्न ते । मदीयमपि जीवनं भवति गर्हितं हे प्रभो जही हि न गुरो कृपां कुरु च दर्शनं देहि मे ॥ ३१॥
    वदेयमिति किं गुरो सकलहृद्गतं वेत्सि भोः स्तुवे किमधिकं स्तुते श्रुतिरहो प्रभो त्वां सदा । अनेकसगुणैर्वृता
    मदधिकाश्च भक्तास्तव त्वमेव हि गुरोऽद्वयो मम तु कोऽपि नान्यो भुवि ॥ ३२॥ विचार्य सकलं गुरो कुरु तथा
    यथा त्वन्मतिः बलात्किमिह शक्यते सविनयेन भोः प्रार्थये । अनाथमिति मां गुरो कुरु सनाथमस्मिञ्जने ह्यतीव
    दययायुतो झटिति दर्शनं देहि मे ॥ ३३॥ सनातन इति श्रुतो भवति विश्वसेतुस्तु यो भवत्प्रभवधर्म एवमिह दुष्टदैत्यैर्हृतः
    । सतीत्वमपि लाञ्छितं किल विडम्बनं दुःसहं प्रभो स्वजनरक्षणे किमिति शङ्कसेऽद्यापि हि ॥ ३४॥ मुमुक्षुजनदुर्दशा
    कथमियं च सह्या तव मुमुक्षुजनजीवितं बहु विगर्हितं लौकिकैः । हसन्ति परमार्थिनं खलु न विश्वसन्तीह ते
    सुरा अपि छलन्ति भो बहुबलाच्च कामादिकैः ॥ ३५॥ कलौ तु परमार्थिनां जगति जीवनं कष्टदं अहं खलु न तत्सहे
    तव तदर्थमेवाश्रयः । स्वरूपपथगामिनस्त्वमिह मे सहायो भव गुरोऽतिदययायुतस्तव पदाम्बुजं दर्शय ॥ ३६॥ अतीव
    खलु दुर्जया सन्तत कश्मला दुश्चरा सदैव सुखमाहिता विषयवासना योजने । अहो दुरितरूपिणी किल भवेदविद्या तु
    या तवैव कृपया विना न च कदापि शाम्येद्गुरो ॥ ३७॥ स्वयं हि न सहायकृद्भवसि साधकानां यदि वृथा किमिति राजसे
    त्वमिह दत्तनाम्ना गुरो । तुरीयपदनन्दिनः पतितपावनस्य प्रभो किमिप्सितसुखं च ते जगति जीवमोक्षादृते ॥
    ३८॥ क्षमस्व दययायुतो यदि भवेद् दुरुक्तिर्मम क्षमस्व च गुरो कुतोऽपि विनयस्य भङ्गो यदि । न हेतुरिह मे
    प्रभो भवति तादृशो वेत्सि मां त्वमेव मम जीवनं गतिरपि स्वभूम्नः सुखम् ॥ ३९॥ दयाब्धिरमितोऽसि भोः सकलभूतवासो
    गुरुः स्वतन्त्र सकलार्थ वित्सुनिपुणो जगत्पावनः । तवात्र जगतीतले प्रकटनं च यत्स्वेच्छया स्वभक्तजनमुक्तये
    ध्रुवमिदं हि दत्त प्रभो ॥ ४०॥ विलम्बय जगद्गुरो क्षणमपीह मा धावने त्वदीय पददर्शनाज्जगति मां सनाथं कुरु
    । अपावृणु विमोहनं सकलमायिकं बन्धनं त्वदीय सकलात्मके स्थिरपदे च मां स्थापय ॥ ४१॥ त्वदीय पददर्शनात्सकलदुःख
    शान्तिर्नृणां त्वदीय पदपङ्कजं दहति दुष्कृतं पापकम् । कथं वसति तत्तृणं धगधगावमानेऽनिले कथं स्थिरति
    तत्तमो गगनमध्यसूर्यातपे ॥ ४२॥ किमर्थमिति शङ्कसे न च किमर्थमायासि भो भवेन्न मम दुष्कृतं किमपि चेत्तवाग्रे
    गुरो । किमस्ति खलु विघ्नकृत्प्रतिविधातुमत्र प्रभो त्वमेव परमं बृहत्तव समो न कोवाऽधिकः ॥ ४३॥ न देवरजनीचरौ
    मनुजवन्यवक्षादिकाः क्षमाश्च दमने तदा मनसि चेत्तवास्तीह भोः । विधिर्न च कुयोग इत्यपि भवेन्न चोपासनं
    किमस्ती खलु विघ्नकृत्तव न दर्शनं मे गुरो ॥ ४४॥ न कर्म सचिवोऽसि भोः फलितमीक्षसे चेद्गुरो न योग इति
    वक्षि चेत्कथमिदं त्वया भाव्यते । स्वतन्त्र निरुपाधिकः सकलमङ्गलस्त्वं यतः विलोभय न मां गुरो झटिति दर्शनं
    देहि मे ॥ ४५॥ किमर्थमतिनिर्घृणो भवसि भो दयासागरः दयाब्धिरपि निर्घृणो मम न वाक्वदेत्तत्वतः । किमर्थमतिदुर्लभं
    चरणदर्शनं ते वद निरूपयितुमप्यहोऽत्र तव हेतुमायाहि भोः ॥ ४६॥ अहो न खलु वारितो भवति संशयो भो यदा न सोऽहमिति
    वेदयः पशुसमः स वेदोऽवदत् । निजं हि कथयामि ते मम न विस्मृतं तत्कदा ह्यहं त्वमिति निश्चयो मम न संशयोऽस्मिन्क्वचित्
    ॥ ४७॥ न मृत्युवशगो गुरोऽहमिति भेदभानेन भो न भीरपि भवेत्प्रभो भवति सा द्वितीयाद्यतः । अहं त्वमिति चेत्कथं
    चिरयसे गुरो मां वद किमर्थमणुसंशयो जहि हि ते पदं दर्शय ॥ ४८॥ अहो जगदिदं गुरो विविधनामरूपात्मकं तथापि
    निजमात्रतोऽत्र खलु वेद्म्यहं तद्यथा । तथैव तवदर्शने मम न भिन्नभावं क्वचित् तथापि जगतीतले भवति तेन
    कार्यं बृहत् ॥ ४९॥ अधर्मरुचयो जना बत हितं न जानन्ति यत् अनीतिवशवर्तिनं हि बहुमन्वते लौकिकाः । अहो
    जगति दुर्लभा भवति तत्त्वदृष्टिर्गुरो ध्रुवं हि तव दर्शनं किल तवावतारो भुवि ॥ ५०॥ गुरो चिरय मा प्रभो
    त्वरय हर्शनं देहि मे ब्रुवे किमधिकं स्तुवे चिरमथो विभोऽस्मात्परम् । अतिप्रणतवत्सलोऽसि खलु विश्वकल्याणकृत्
    मनोभिलषितं तवास्तु निजभूम्नि मां स्थापय ॥ ५४॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यसद्गुरुभगवता श्रीधरस्वामिना
    विरचितं श्रीदत्तस्तोत्रं सम्पूर्णम् ॥
