id: batukabhairavabrahmakavacarajah
category: kavacha
name:
  english: batukabhairavabrahmakavacarajah
  devanagari: बटुकभैरवब्रह्मकवचराजः
content:
  english: asya shribatukabhairavakavacarajasya bhairavarishiranushtupchandah shri batukabhairavo devata
    mama batukabhairavaprasada sidhyarthe jape viniyogah | om patu shirasi nityam patu hrim kanthadeshake
    | batukaya patu nabhau capaduddharanaya ca || 1|| kurudvayam lingamule tvadhare batukaya ca | sarvada
    patu hrim bijam bahvoryugalameva ca || 2|| shadangasahito devo nityam rakshatu bhairavah | om hrim
    batukaya satatam sarvanga mama sarvada || 3|| om hrim padau mahakalah patu virasanehridi | om hrim
    kalah shirah patu kanthadeshe tu bhairavah || 4|| ganarat patu jihvayamashtabhih shaktibhih saha |
    dandapanirguhyamule bhairavisahitastatha || 5|| vishvanathah sada patu sarvangam mama sarvada | annapurna
    sada patu camsau rakshatu candika || 6|| asitanga shirah patu lalatam rurubhairavah | candabhairavah
    patu vaktram kantham shrikrodhabhairavah || 7|| unmattabhairavah patu hridayam mama sarvada | nabhideshe
    kapali ca linge bhishanabhairavah || 8|| samharabhairavah patu muladharam ca sarvada | bahuyugmam
    sada patu bhairavo mama kevalam || 9|| hamsabijam patu hridi so'ham rakshatu padayoh | pranapanau
    samanam ca udanam vyanameva ca || 10|| rakshantu dvaramule tu dashadikshu samantatah | pranavah patu
    sarvangagam lajjabijam mahabhaye || 11|| || iti shribrahmakavacam bhairavasya prakirtitam ||
  devanagari: अस्य श्रीबटुकभैरवकवचराजस्य भैरवऋषिरनुष्टुप्छन्दः श्री बटुकभैरवो देवता मम बटुकभैरवप्रसाद
    सिध्यर्थे जपे विनियोगः । ॐ पातु शिरसि नित्यं पातु ह्रीं कण्ठदेशके । बटुकाय पातु नाभौ चापदुद्धारणाय
    च ॥ १॥ कुरुद्वयं लिङ्गमूले त्वाधारे बटुकाय च । सर्वदा पातु ह्रीं बीजं बाह्वोर्युगलमेव च ॥ २॥ षडङ्गसहितो
    देवो नित्यं रक्षतु भैरवः । ॐ ह्रीं बटुकाय सततं सर्वाङ्ग मम सर्वदा ॥ ३॥ ॐ ह्रीं पादौ महाकालः पातु वीरासनेहृदि
    । ॐ ह्रीं कालः शिरः पातु कण्ठदेशे तु भैरवः ॥ ४॥ गणराट् पातु जिह्वायामष्टभिः शक्तिभिः सह । दण्डपाणिर्गुह्यमूले
    भैरवीसहितस्तथा ॥ ५॥ विश्वनाथः सदा पातु सर्वाङ्गं मम सर्वदा । अन्नपूर्णा सदा पातु चांसौ रक्षतु चण्डिका
    ॥ ६॥ असिताङ्ग शिरः पातु ललाटं रुरुभैरवः । चण्डभैरवः पातु वक्त्रं कण्ठं श्रीक्रोधभैरवः ॥ ७॥ उन्मत्तभैरवः
    पातु हृदयं मम सर्वदा । नाभिदेशे कपाली च लिङ्गे भीषणभैरवः ॥ ८॥ संहारभैरवः पातु मूलाधारं च सर्वदा ।
    बाहुयुग्मं सदा पातु भैरवो मम केवलम् ॥ ९॥ हंसबीजं पातु हृदि सोऽहं रक्षतु पादयोः । प्राणापानौ समानं
    च उदानं व्यानमेव च ॥ १०॥ रक्षन्तु द्वारमूले तु दशदिक्षु समन्ततः । प्रणवः पातु सर्वाङ्गगं लज्जाबीजं
    महाभये ॥ ११॥ ॥ इति श्रीब्रह्मकवचं भैरवस्य प्रकीर्तितम् ॥
