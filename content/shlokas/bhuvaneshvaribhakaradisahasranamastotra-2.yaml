    bhupatacarasiddhida | bhupatacaradharmani bhupatacaradharini || 59|| bhupatanandalahari bhupateshvararupini
    | bhupaternnitinitistha bhupatisthanavasini || 60|| bhupatisthanagirvani bhupatervaradharini | bheshajanandalahari
    bheshajanandarupini || 61|| bheshajanandamahishi bheshajanandadharini | bheshajanandakarmeshi bheshajanandadayini
    || 62|| bhaishaji bhaishajakanda bheshajasthanavasini | bheshajeshvararupa ca bheshajeshvarasiddhida
