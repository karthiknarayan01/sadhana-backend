id: subrahmanya-ashtakam-karavalamba-stotram
category: stotram
name:
  english: Subrahmanya Ashtakam Karavalamba Stotram
content:
  english: he svaminatha karunakara dinabandho shriparvatishamukhapankaja padmabandho | shrishadidevaganapujitapadapadma
    vallisanatha mama dehi karavalambam || || devadidevanuta devaganadhinatha devendravandya mridupankajamanjupada
    | devarshinaradamunindrasugitakirte vallisanatha mama dehi karavalambam || || nityannadana niratakhila
    rogaharin tasmatpradana paripuritabhaktakama | shrityagamapranavavacyanijasvarupa vallisanatha mama
    dehi karavalambam || || krauncasurendra parikhandana shaktishula pashadishastraparimanditadivyapane
    | shrikundalisha dhritatunda shikhindravaha vallisanatha mama dehi karavalambam || || devadideva rathamandala
    madhya vedya devendra pithanagaram dridhacapahastam | shuram nihatya surakotibhiridyamana vallisanatha
    mama dehi karavalambam || || haradiratnamaniyuktakiritahara keyurakundalalasatkavacabhirama | he vira
    taraka jaya'marabrindavandya vallisanatha mama dehi karavalambam || || pancaksharadimanumantrita gangatoyaih
    pancamritaih pramuditendramukhairmunindraih | pattabhishikta hariyukta parasanatha vallisanatha mama
    dehi karavalambam || || shrikartikeya karunamritapurnadrishtya kamadirogakalushikritadushtacittam
    | bhaktva tu mamavakaladhara kantikantya vallisanatha mama dehi karavalambam || || subrahmanya karavalambam
    punyam ye pathanti dvijottamah | te sarve mukti mayanti subrahmanya prasadatah | subrahmanya karavalambamidam
    pratarutthaya yah pathet | kotijanmakritam papam tat
  devanagari: हे स्वामिनाथ करुणाकर दीनबन्धो श्रीपार्वतीशमुखपङ्कज पद्मबन्धो । श्रीशादिदेवगणपूजितपादपद्म
    वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ देवादिदेवनुत देवगणाधिनाथ देवेन्द्रवन्द्य मृदुपङ्कजमञ्जुपाद । देवर्षिनारदमुनीन्द्रसुगीतकीर्ते
    वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ नित्यान्नदान निरताखिल रोगहारिन् तस्मात्प्रदान परिपूरितभक्तकाम । शृत्यागमप्रणववाच्यनिजस्वरूप
    वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ क्रौञ्चासुरेन्द्र परिखण्डन शक्तिशूल पाशादिशस्त्रपरिमण्डितदिव्यपाणे
    । श्रीकुण्डलीश धृततुण्ड शिखीन्द्रवाह वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ देवादिदेव रथमण्डल मध्य वेद्य
    देवेन्द्र पीठनगरं दृढचापहस्तम् । शूरं निहत्य सुरकोटिभिरीड्यमान वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ हारादिरत्नमणियुक्तकिरीटहार
    केयूरकुण्डललसत्कवचाभिराम । हे वीर तारक जयाऽमरबृन्दवन्द्य वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ पञ्चाक्षरादिमनुमन्त्रित
    गाङ्गतोयैः पञ्चामृतैः प्रमुदितेन्द्रमुखैर्मुनीन्द्रैः । पट्टाभिषिक्त हरियुक्त परासनाथ वल्लीसनाथ मम
    देहि करावलम्बम् ॥ ॥ श्रीकार्तिकेय करुणामृतपूर्णदृष्ट्या कामादिरोगकलुषीकृतदुष्टचित्तम् । भक्त्वा तु
    मामवकलाधर कान्तिकान्त्या वल्लीसनाथ मम देहि करावलम्बम् ॥ ॥ सुब्रह्मण्य करावलम्बं पुण्यं ये पठन्ति द्विजोत्तमाः
    । ते सर्वे मुक्ति मायान्ति सुब्रह्मण्य प्रसादतः । सुब्रह्मण्य करावलम्बमिदं प्रातरुत्थाय यः पठेत् ।
    कोटिजन्मकृतं पापं तत्
