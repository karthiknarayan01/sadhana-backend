id: shrishivamahimastotram
category: stotram
name:
  english: shrishivamahimastotram
  devanagari: श्रीशिवमहिमास्तोत्रम्
content:
  english: paramavidusho yajnasadrishi stutirbrahmadina mapi tadavasannastvayi girah | athavacyah sarvah
    svamatiparinamadhi grinan mamapyeshah stotre hara nirapavadah parikarah ||1|| atitah pamthanam tava
    ca mahima vad manasayo ratadvyavrityayam cakitamabhidhatte shrutirapi | sa kasya stotavyah katividhagunah
    kasya vishayah pade tvarvacine patati na manah kasya na vacah ||2|| madhusphita vacah paramamamritam
    nirmitavata stava brahmankim va gapi suragurorvismayapadam | mama tvetam vanim gunakathanapunyena
    bhavatah punamityarthesmin puramathanabuddhirvyavasita ||3|| tavaishcaryem yattad jagadudayarakshapralayakrita
    trayi vastu vyastam tisrishu gunabhinnasu tanushu | abhavyanamasmin varada ramaniyamaramanim vihamtum
    vyokroshim vidadhata ihai ke jadadhiyah ||4|| kimihah kimkayah sa khalu kimupayastribhuvanam kimadharo
    dhata srijati kimupadana iti ca | atakaryaishvaryetvayyanavasaraduhstho hatadhiyah kutarkodayamkamshci
    nmukharayati mohaya jagatah ||5|| ajanmano lokah kimavayavamvatodapi jagata madhishthataram kim bhavavidhiranadatya
    bhavati | anisho va kuryada bhuvanajanane kah parikaro yato mamdastvam pratyamaravara samsherata ime
    ||6|| trayi samkhyam yogah pashupatimatam vaishnavamiti prabhinne prasthane paramidamadah pathyamiti
    ca | rucinam vaicitrya dajukutilananapathajusham nrinameko gamya stvamasi payamamarnava iva ||7||
    mahokshah khadvamgam parashurajinam bhasma phaninah kapalam cetiya ttava varada tamtropakaranam |
    surastam tamriddhim dadhati tu bhava dbhrupranihitam nahi svatmaramam vishayamrigatrishna bhramayati
    ||8|| dhruvam kashcitsarvam sakalamaparastvaddhruvamidam paro dhrovyadhrovye jagati gadati vyastavishaye
    | samastedapyetasmi npuramathana tairvismita iva stuvamjihremi tvam na khalu nanu dhrishta mukharata
    ||9|| tavaishvaryam yatna dyadupari virimcirhariradhah paricchetum yata vanalamanalaskamdhavapushah
    | tato bhaktishraddha bharagurugrinadbhyam girisha yat svayam tasthe tabhyam tava kimanuvrittine phalati
    ||10|| ayatnadapadya tribhuvanamavairavyatikaram dashasyo yadbahu nabhrina ranakamduparavashan | shirahpadmashreni
    racitacaranambhoruhabaleh sthirayastvadbhakte stripurahara visphurjitamidam ||11|| amushya tvatseva
    samadhigatasaram bhujavanam balatkailasedapi tvadadhivasatau vikramayatah | alabhyapatale dapyalasacalitamgushthashirasi
    pratishtha pratvayya siddhruvamupacito muhyati khalah ||12|| yadaddhim sutramno varada paramoccairapi
    sati madhashcakre banah parijanavidheyastribhuvanah | na taccitram tasmimnvarivasitari tvaccaranayo
    rna kasyapyunnatyai bhavati shirasastvayyavanatih ||13|| akandabrahmandakshayacakitadevasurakripa
    vidheyasyasidyastrinayavisham samhratavatah | sa kalmashah kanthe tava na kurute na shriyamaho vikarodapi
    shladhyo bhuvanabhayabhamgavyasaninah ||14|| asiddhartha naiva kavacidapi sadevasuranare nivartante
    nityam jagati jayino yasya vishikhah | sa pashyannisha tvamitarasarurasadharanamabhut smarah smartavyatma
    nahi vashishu pathyah paribhavah||15|| mahi padadhatad vrajati sahasa samshayapadam padam vishnorbhramyadbhujaparigharugnagrahaganam
    | muhudyaumrdosthyam yatyanibhritajatataditatata jagadrakshayai tvam natasi nanu vamaiva vibhuta ||16||
    viyadvyapi taraganagunitaphenodgamarucih pravaho varam yah prishatalaghudashtah shirasi te | jagad
    dvipakaram jaladhivalayam tena kritami tyanenaivonneyam dhritamahima divyam tava vapuh ||17|| rathah
    kshoni yanta shatadhritiragendro dhanuratho rathadage candrarkau rathacaranapanih shara iti | didhakshoste
    kodayam tripuratrinamadambaravidhir vidheyaih kridantyo na khalu paratantrah prabhudhiyah ||18|| hariste
    sahastram kamalabalimadhaya padayo yadikone tasmin nijamudaharannetrakamalam | gato bhakatyudrekah
    parinatimasau cakravapusha trayanam rakshayai tripurahara jagarti jagatam ||19|| kratau supte jagrattvamasi
    phalayoge kratumatam kva karma pradhvastam phalati purusharadhanamrite | atastvam samprekshya kratushu
    phaladanapratibhuvam shrutau shraddham baddhva dataparikarah karmasu janah ||20|| kriyadaksho dakshah
    kratupatiradhishastanubhrita mrishinamartvijyam sharanada sadasyah suraganah | kratubhramshastvattah
    kratuphalavidhanavyasanino dhruvam kartuh shraddhavidhuramabhicaraya hi makhah ||21|| prajanatham
    natha prasabhamabhikam svam duhitaram gatam rohidbhutam riramayishumrishyasya vapusha | dhanushpaneryatam
    divamapi sapatrakritammamum trasantam tedadyapi tyajati na mrigavyadharabhasah ||22|| svalavanyashamsadhritadhanushamahnaya
    trinavat purah plushtam dashtava puramathana pushpayudhamapi | yadi strainam devi yamanirata dehardhaghatana
    davaiti tvamaddha bata varada mugdha yuvatayah ||23|| smashaneshvakrida smahara pishacah sahacara
    shcitabhasmalepah stagapi nrikarotiparikarah | amamgalyam shilam tava bhavatu namaivamakhilam tathadapi
    smartrinam varada paramam mamgalamasi ||24|| manah pratyakcitte savidhamavadhayattamarutah prahrashyadromanah
    pramadasalilotsamgitadashah | yadalokyahladam hrada iva nimajjyamritamaye dadyatyamtastattvam krimapi
    yaminastatkila bhavan ||25|| tvamarkastvam somastvamasi pavanastvam hutavaha stvamapastvam vyoma tvamu
    dharaniratma tvamiti ca | paricchinnamevam tvayiparinata bibhratu giram na vidmastattatvam vayamiha
    tu yattvam na bhavasi ||26|| trayim tistro vrittistribhuvanamatho trinapi sura nakaradyairvarnai stribhirabhidadhattirna
    vikritih | turiyam te dhama dhvanibhiravarundhanamanubhih samastam vyastam tvam sharanada grinatyomiti
    padam ||27|| bhavah sharvo rudrah pashupatirathograh sahamaham statham bhimashanaviti yadabhidhanashtakamidam
    | amushminpratyekam pravitarati deva shrutirapi priyayasmai dhamne pranihitanamasyodasmi bhavate ||28||
    namo nedishthaya priyadavadavishthaya ca namo namah kshodishthaya smarahara mahishthaya ca namah |
    namovarshishthaya trinayana yavishtha ca namah namah sarvasmai te tadidamitisharvaya ca namah ||29||
    bahalarajase vishvotpattau bhavaya namo namah prabalatamase tatsamhare haraya namo namah | janasukhakrite
    sattvodriktau mridaya namo namah pramahasi pade nistraigunye shivaya namo namah ||30|| krishaparinati
    cetah kleshavashyam kva cedam kva ca tava gunasimollamdhini shashvadraddhih iti cakitamamandikritya
    mam bhaktiradhad varada caranayoste vakya
  devanagari: परमविदुषो यज्ञसदृशी स्तुतिर्ब्रह्मादीना मपि तदवसन्नास्त्वयि गिरः । अथावाच्यः सर्वः स्वमतिपरिणामधि
    गृणन् ममाप्येषः स्तोत्रे हर निरपवादः परिकरः ॥१॥ अतीतः पंथानं तव च महिमा वाड् मनसयो रतद्व्यावृत्यायं
    चकितमभिधत्ते श्रुतिरपि । स कस्य स्तोतव्यः कतिविधगुणः कस्य विषयः पदे त्वर्वाचीने पतति न मनः कस्य न
    वचः ॥२॥ मधुस्फीता वाचः परमममृतं निर्मितवत स्तव ब्रह्मन्किं वा गपि सुरगुरोर्विस्मयपदम् । मम त्वेतां
    वाणीं गुणकथनपुण्येन भवतः पुनामीत्यर्थेस्मिन् पुरमथनबुद्धिर्व्यवसिता ॥३॥ तवैश्चर्यें यत्तद् जगदुदयरक्षाप्रलयकृत
    त्रयी वस्तु व्यस्तं तिसृषु गुणभिन्नासु तनुषु । अभव्यानामस्मिन् वरद रमणीयामरमणीं विहंतुं व्योक्रोशीं
    विदधत इहै के जडधियः ॥४॥ किमिहः किंकायः स खलु किमुपायस्त्रिभुवनं किमाधारो धाता सृजति किमुपादान इति
    च । अतकर्यैश्वर्येत्वय्यनवसरदुःस्थो हतधियः कुतर्कोडयंकांश्चि न्मुखरयति मोहाय जगतः ॥५॥ अजन्मानो लोकाः
    किमवयवंवतोडपि जगता मधिष्ठातारं किं भवविधिरनादत्य भवति । अनीशो वा कुर्याद भुवनजनने कः परिकरो यतो मंदास्त्वां
    प्रत्यमरवर संशेरत इमे ॥६॥ त्रयी सांख्यं योगः पशुपतिमतं वैष्णवमिति प्रभिन्ने प्रस्थाने परमिदमदः पथ्यमिति
    च । रुचीनां वैचित्र्या दजुकुटिलनानापथजुषां नृणामेको गम्य स्त्वमसि पयमामर्णव इव ॥७॥ महोक्षः खड्वांगं
    परशुरजिनं भस्म फणिनः कपालं चेतीय त्तव वरद तंत्रोपकरणम् । सुरास्तां तामृद्धिं दधति तु भव द्भ्रूप्रणिहितां
    नहि स्वात्मारामं विषयमृगतृष्णा भ्रमयति ॥८॥ ध्रुवं कश्चित्सर्वं सकलमपरस्त्वद्ध्रुवमिदं परो ध्रोव्याध्रोव्ये
    जगति गदति व्यस्तविषये । समस्तेडप्येतस्मि न्पुरमथन तैर्विस्मित इव स्तुवंजिह्रेमि त्वां न खलु ननु धृष्टा
    मुखरता ॥९॥ तवैश्वर्यं यत्ना द्यदुपरि विरिंचिर्हरिरधः परिच्छेतुं याता वनलमनलस्कंधवपुषः । ततो भक्तिश्रद्धा
    भरगुरुगृणद्भ्यां गिरिश यत् स्वयं तस्थे ताभ्यां तव किमनुवृत्तिने फलति ॥१०॥ अयत्नादापाद्य त्रिभुवनमवैरव्यतिकरं
    दशास्यो यद्बाहू नभृन रणकंडुपरवशान् । शिरःपद्मश्रेणी रचितचरणांभोरुहबलेः स्थिरायास्त्वद्भक्ते स्त्रिपुरहर
    विस्फूर्जितमिदम् ॥११॥ अमुष्य त्वत्सेवा समधिगतसारं भुजवनं बलात्कैलासेडपि त्वदधिवसतौ विक्रमयतः । अलभ्यापाताले
    डप्यलसचलितांगुष्ठशिरसि प्रतिष्ठा प्रत्वय्या सीद्ध्रुवमुपचितो मुह्यति खलः ॥१२॥ यदद्धिं सुत्राम्णो वरद
    परमोच्चैरपि सती मधश्चक्रे बाणः परिजनविधेयस्त्रिभुवनः । न तच्चित्रं तस्मिंन्वरिवसितरि त्वच्चरणयो र्न
    कस्याप्युन्नत्यै भवति शिरसस्त्वय्यवनतिः ॥१३॥ अकाण्डब्रह्माण्डक्षयचकितदेवासुरकृपा विधेयस्यासीद्यस्त्रिनयविषं
    संह्रतवतः । स कल्माषः कण्ठे तव न कुरुते न श्रियमहो विकारोडपि श्लाध्यो भुवनभयभंगव्यसनिनः ॥१४॥ असिद्धार्था
    नैव कवचिदपि सदेवासुरनरे निवर्तन्ते नित्यं जगति जयिनो यस्य विशिखाः । स पश्यन्नीश त्वामितरसरुरसाधारणमभूत्
    स्मरः स्मर्तव्यात्मा नहि वशिषु पथ्यः परिभवः॥१५॥ मही पादाधाताद् व्रजति सहसा संशयपदं पदं विष्णोर्भ्राम्यद्भुजपरिघरुग्णग्रहगणम्
    । मुहुद्यौंर्दोस्थ्यं यात्यनिभृतजटाताडिततटा जगद्रक्षायै त्वं नटसि ननु वामैव विभुता ॥१६॥ वियद्व्यापी
    तारागणगुणितफेनोद्गमरुचिः प्रवाहो वारां यः पृषतलघुदष्टः शिरसि ते । जगद् द्वीपाकारं जलधिवलयं तेन कृतमि
    त्यनेनैवोन्नेयं धृतमहिम दिव्यं तव वपुः ॥१७॥ रथः क्षोणी यन्ता शतधृतिरगेन्द्रो धनुरथो रथाडगे चन्द्रार्कौ
    रथचरणपाणिः शर इति । दिधक्षोस्ते कोडयं त्रिपुरतृणमाडम्बरविधिर् विधेयैः क्रीडन्त्यो न खलु परतन्त्राः
    प्रभुधियः ॥१८॥ हरिस्ते साहस्त्रं कमलबलिमाधाय पदयो यदिकोने तस्मिन् निजमुदहरन्नेत्रकमलम् । गतो भकत्युद्रेकः
    परिणतिमसौ चक्रवपुषा त्रयाणां रक्षायै त्रिपुरहर जागर्ति जगताम् ॥१९॥ क्रतौ सुप्ते जाग्रत्त्वमसि फलयोगे
    क्रतुमतां क्व कर्म प्रध्वस्तं फलति पुरुषाराधनमृते । अतस्त्वां सम्प्रेक्ष्य क्रतुषु फलदानप्रतिभुवं
    श्रुतौ श्रद्धां बद्ध्वा दटपरिकरः कर्मसु जनः ॥२०॥ क्रियादक्षो दक्षः क्रतुपतिरधीशस्तनुभृता मृषीणामार्त्विज्यं
    शरणद सदस्याः सुरगणाः । क्रतुभ्रंषस्त्वत्तः क्रतुफलविधानव्यसनिनो ध्रुवं कर्तुः श्रद्धाविधुरमभिचाराय
    हि मखाः ॥२१॥ प्रजानाथं नाथ प्रसभमभिकं स्वां दुहितरं गतं रोहिद्भूतां रिरमयिषुमृष्यस्य वपुषा । धनुष्पाणेर्यातं
    दिवमपि सपत्राकृतंममुं त्रसन्तं तेडद्यापि त्यजति न मृगव्याधरभसः ॥२२॥ स्वलावण्याशंसाधृतधनुषमह्नाय तृणवत्
    पुरः प्लुष्टं दष्टवा पुरमथन पुष्पायुधमपि । यदि स्त्रैणं देवी यमनिरत देहार्धघटना दवैति त्वामद्धा बत
    वरद मुग्धा युवतयः ॥२३॥ स्मशानेष्वाक्रीडा स्महर पिशाचाः सहचरा श्चिताभस्मालेपः स्तगपि नृकरोटीपरिकरः
    । अमंगल्यं शीलं तव भवतु नामैवमखिलं तथाडपि स्मर्तृणां वरद परमं मंगलमसि ॥२४॥ मनः प्रत्यक्चित्ते सविधमवधायात्तमरुतः
    प्रह्रष्यद्रोमाणः प्रमदसलिलोत्संगितदशः । यदालोक्याह्लादं ह्रद इव निमज्ज्यामृतमये दद्यत्यंतस्तत्त्वं
    क्रिमपि यमिनस्तत्किल भवान् ॥२५॥ त्वमर्कस्त्वं सोमस्त्वमसि पवनस्त्वं हुतवह स्त्वमापस्त्वं व्योम त्वमु
    धरणिरात्मा त्वमिति च । परिच्छिन्नामेवं त्वयिपरिणता बिभ्रतु गिरं न विद्मस्तत्तत्वं वयमिह तु यत्त्वं
    न भवसि ॥२६॥ त्रयीं तिस्त्रो वृत्तीस्त्रिभुवनमथो त्रीनपि सुरा नकाराद्यैर्वर्णै स्त्रिभिरभिदधत्तीर्ण
    विकृतिः । तुरीयं ते धाम ध्वनिभिरवरुन्धानमणुभिः समस्तं व्यस्तं त्वां शरणद गृणात्योमिति पदम् ॥२७॥ भवः
    शर्वो रुद्रः पशुपतिरथोग्रः सहमहां स्तथां भीमशानाविति यदभिधानाष्टकमिदम् । अमुष्मिन्प्रत्येकं प्रवितरति
    देव श्रुतिरपि प्रियायास्मै धाम्ने प्रणिहितनमस्योडस्मि भवते ॥२८॥ नमो नेदिष्ठाय प्रियदवदविष्ठाय च नमो
    नमः क्षोदिष्ठाय स्मरहर महिष्ठाय च नमः । नमोवर्षिष्ठाय त्रिनयन यविष्ठा च नमः नमः सर्वस्मै ते तदिदमितिशर्वाय
    च नमः ॥२९॥ बहलरजसे विश्वोत्पत्तौ भवाय नमो नमः प्रबलतमसे तत्संहारे हराय नमो नमः । जनसुखकृते सत्त्वोद्रिक्तौ
    मृडाय नमो नमः प्रमहसि पदे निस्त्रैगुण्ये शिवाय नमो नमः ॥३०॥ कृशपरिणति चेतः क्लेशवश्यं क्व चेदं क्व
    च तव गुणसीमोल्लंधिनी शश्वद्रद्धिः इति चकितममन्दीकृत्य मां भक्तिराधाद् वरद चरणयोस्ते वाक्य
