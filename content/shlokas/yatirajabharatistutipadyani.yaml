id: yatirajabharatistutipadyani
category: stotram
name:
  english: yatirajabharatistutipadyani
  devanagari: यतिराजभारतीस्तुतिपद्यानि
content:
  english: yatirajabharatistutipadyani || shrih || || shrimate ramanujaya namah || shrimate vatsyavaradadeshikaya
    namah || shrivatsyavaradagurubhiranugrihitani || yatirajabharatistutipadyani || vande'ham varadaryam
    tam vatsabhijanabhushanam | bhashyamritapradanadyah sanjivayati mamapi || kva pathi vidushamesha praudhi
    shriyah prabhuna shape mashakashakanam manye madrikprabhavanidarshanam | yativaravacastejah pratyarthivarganirargala
    kshapananipunam nityam jagarti kirtikaram mayi || 1|| na khalu kavitamanah ka nah kshatih pathi gautame
    na ca paricayah kanade va kumariladarshane | api gurumate shastreshvanyeshvapiha tatha'pi nah phalati
    vijayam sarvatra shriyatishvaragishshramah || 2|| yashcakara yatirajabharati
  devanagari: यतिराजभारतीस्तुतिपद्यानि ॥ श्रीः ॥ ॥ श्रीमते रामानुजाय नमः ॥ श्रीमते वात्स्यवरददेशिकाय नमः
    ॥ श्रीवात्स्यवरदगुरुभिरनुगृहीतानि ॥ यतिराजभारतीस्तुतिपद्यानि ॥ वन्देऽहं वरदार्यं तं वत्साभिजनभूषणम्
    । भाष्यामृतप्रदानाद्यः सञ्जीवयति मामपि ॥ क्व पथि विदुषामेषा प्रौढी श्रियः प्रभुणा शपे मशकशकनं मन्ये
    मादृक्प्रभावनिदर्शनम् । यतिवरवचस्तेजः प्रत्यर्थिवर्गनिरर्गल क्षपणनिपुणं नित्यं जागर्ति कीर्तिकरं मयि
    ॥ १॥ न खलु कवितामानः का नः क्षतिः पथि गौतमे न च परिचयः काणादे वा कुमारिलदर्शने । अपि गुरुमते शास्त्रेष्वन्येष्वपीह
    तथाऽपि नः फलति विजयं सर्वत्र श्रीयतीश्वरगीश्श्रमः ॥ २॥ यश्चकार यतिराजभारती
