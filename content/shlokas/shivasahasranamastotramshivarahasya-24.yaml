id: shivasahasranamastotramshivarahasya-24
category: sahasranama
name:
  english: shivasahasranamastotramshivarahasya 24
  devanagari: शिवसहस्रनामस्तोत्रम्शिवरहस्य २४
content:
  english: '| gangadharo''mbikabharta dharta harta janeshvarah || 62|| meghavahah prasannatma kankalakavaro
    madhuh | vitihotro mahanetrah satrapatro digambarah || 63|| mahashmashananilaya ishano''tha garashanah
    | mahagraso mahabhimo vidyutyah shukla ishvarah || 64|| kandarpadarpaha kantah kapardi nilalohitah
    | pinakapanih kalatma gopatirvrishavahanah || 65|| suramandaramaladhyah kandharo''nantavikramah |
    kshayadviro maraharo harah shitamshushekharah || 66|| shatangavarado hota yajamano yashaskarah | mayaskarah
    shankarashca shipivishtah pratishthitah || 67|| prajapatih pashupatih yatinam patiragnibhuh | samaganapriyah
    shuddhah prashantatma sthirah prabhuh || 68|| vibhurvibhasako''nanto rudra ugro maheshvarah | jagartako
    jangalesho jangamajangamatmakah || 69|| jatukarnapriyo jyeshthah kanishthah shreshtha uttamah | pratishtha
    paramam dhama paramatma ritam mahat || 70|| yantratma mantrarupatma mantrarupah sadashivah | nigamagamasamsevyah
    suradyah prapitamahah || 71|| surasuraganadhyakshah tryaksho dakshamakhantakah | mahokshavaha ukshedya
    bhagakshiharano''kshatah || 72|| analpakalpah shilpadih sushilah kaulapujitah | stavyo navyo bhavyarupo
    havyakavyabhugavyayah || 73|| mahabalo mahotsaho mahadevo mahangadhrik | shatavartah shantamanah sahamanah
    stutipriyah || 74|| sanatano vamadevo manasvi manavarjitah | gatido natapo vagmi uccairghosho mahahanuh
    || 75|| tripundrabhalo bhasmangah pundarikatvagambarah | gayatrimadhyanilayo mitrarupo jagatprabhuh
    || 76|| prasenajitkakshavaso narasimhanipatanah | koladamshtradharo bhuto bhutanatho ratiplutah ||
    77|| kurmamreditapadabjashcandracudah sthiro mridah | gudhapadvaraharadhya adhyo maudhyavinashakah
    || 78|| dandi kundi tandupujyo mundi pashandavarjitah | alingo linganilayah sphulingasadrishekshanah
    || 79|| bilvapujyo bilminishca bileshayaphanadharah | banalingarcanaprito vadavanalasasambhavah ||
    80|| balaratibhujastambho bhupatirviprapujitah | andhakantakaro bhargo govrishanka umadhavah || 81||
    dhananjayakshah kancakshapujyapadambujadvayah | vitaragah sandrasukho vankashankusharo harah || 82||
    hayagrivarcito hetidharo bhikshatanapriyah | trimadhustrisuparnatma parnashayi maheshvarah || 83||
    anjanakshah khanjanatma ranjano ranganrityakrit | vayurayuhprado madhyo gahvareshto''ntakantakah ||
    84|| sharvah sarvagatah sthanuh sthavishthah suprasannavak | shabdah sparsho raso rupam gandhashcandro
    vibhavasuh || 85|| sarvendriyagunatitah sarvendriyavivarjitah | sarvesham prabhurishanah sarvesham
    sharanam suhrit || 86|| sima bhuma mahanatma pratishtha purushah parah | puccham brahma ritam satyam
    haro vaishnavapingalah || 87|| urdhvareta virupakshah kshitishah kshantivardhanah | savishesho nirvisheshah
    sheshahikatakojjvalah || 88|| rasa ananda ataryah shashpah phenyah sikatyakah | pravahyo gehyavahyashca
    prasadyah pramathadhipah || 89|| jnanado dhanado dhiro dundubhyo bhitinashakrit | mayaskaro maskari
    ca taskaro bhaskarekshanah || 90|| yashaskarah kuluncesho bhishajamadhipo yuva | varni vanyo grihasthashca
    sanyasi nyasamadhyagah || 91|| bhimah somah prashantatma dhama dhumasavarnabhrit | kamadah kamamathanah
    krathanah kanakambarah || 92|| samo nih simamahima vaneshah kshetranayakah | kailasashailanilayo vilayo
    layavarjitah || 93|| rakshakaro rakshasaghno lasyaprito ratipradah | pradoshatandavaparah sarvadoshaharo
    harih || 94|| akhandalamukhastutyo merukodandadhrigvarah | vedaghoshah patitashohyahijyo brahmasarathih
    || 95|| suryacandramahacakro haribano''mbaravritah | kshmarathastripuraratih kanvapujyo vicarakah
    || 96|| shuli hali langali ca musali kushali bali | gadi shankhi vashi cakri kavaci candhasam patih
    || 97|| nishangasagarah shambhuh shantah sangavivarjitah | dhirodatta udattashca svaritah pracayasvarah
    || 98|| pranavah pranadah shonah kanadah phanikankanah | mauni mani jitaratih riti dhatumayo mahan
    || 99|| anoraniyan subhago mahato''pi mahattarah | svarat samrat virad dhata vidhato sarvatomukhah
    || 100|| medhadhipo gadhipujyohyadhivyadhivinashanah | gadhadhipo vyadhinishah kaladhautaprabho''balah
    || 101|| vedagarbho nilakanthah kunthitaghah kripakarah | jagadambapatih sambastryambako ravibimbagah
    || 102|| sudhasagaramadhyastho manidvipaniketanah | kadambavanamadhyasthah nipavapiprapantarah ||
    103|| papatapaharo gopta shambararinishudanah | triyambako varanato jatajutavibhushitah || 104|| katyo
    nipyashca sudyashca sarasyo medhya vaidyutah | idhyra atapya atarya aladyashcandrashekharah || 105||
    reshmyo rasyashca vaishanto''nadyah kupyo vatyodbhavah | ahananyashca dundubhyah sikatyah phenyavanyakah
    || 106|| pravahyashca sikatyashca pravahyo gehya eva ca | hiranyatalpa atamro bhavo rudrah pitamahah
    || 107|| samsaravaidyo vishvatma gajashcakrapravartakah | meruh pita svishuh pata garishtho gahvarastaruh
    || 108|| hiranyabahurashasyah senanirgirisho mridah | sudhanva bilvapatrarcyo gonardo''tha vrishakapih
    || 109|| urugayah kalpavriksho jyotirhetirvibhavasuh | sutithih kaushiko dhurto dhutturakusumapriyah
    || 110|| umadhavo madhavarcyo bhasmarudrakshabhushitah | gangatungajatamaulirnarmadasharmadayakah
    || 111|| tamalamalasugalah karavalalasatkarah | attattahaso vikato damshtrakutilavaktrakah || 112||
    raktavrittekshanah subhruh shvabhro harta kavishvarah | phullanilotpalasragvi shamyakarcyo virodhaha
    || 113|| aryah suryaprabhah shasta suhasto bastacarmadhrik | kshetresho janmaha catma amoghashcadrijapatih
    || 114|| shanaciradharo''ghora barbaro bhairavah sakha | ushnishavasanacchanna upanatpatplavah shivah
    || 115|| vrikshapallavasanmaulih shunam patirapam patih | jaghanyo budhniyashchando''pyaruno bhaganendradhrik
    || 116|| kumarajanako vetta parivitopavitadhrik | babhruh suceta midhvamshca ashadho drapiruttamah
    || 117|| ekaksho''naikapat subhruh adhipo mitrapah shivah | kshetrapah svapatirdevo dhanapah shatrunashakrit
    || 118|| anneshushcaiva vateshustirtheshuprapatham patih | ayurdo dhanado dhiro rasah shivataro bhriguh
    || 119|| iti shrishivarahasye dvadashamshe skandakritam shivasahasranamastotram sampurnam ||'
  devanagari: । गङ्गाधरोऽम्बिकाभर्ता धर्ता हर्ता जनेश्वरः ॥ ६२॥ मेघवाहः प्रसन्नात्मा कङ्कालकवरो मधुः ।
    वीतिहोत्रो महानेत्रः सत्रपात्रो दिगम्बरः ॥ ६३॥ महाश्मशाननिलय ईशानोऽथ गराशनः । महाग्रासो महाभीमो विद्युत्यः
    शुक्ल ईश्वरः ॥ ६४॥ कन्दर्पदर्पहा कान्तः कपर्दी नीललोहितः । पिनाकपाणिः कालात्मा गोपतिर्वृषवाहनः ॥ ६५॥
    सुरमन्दारमालाढ्यः कन्धरोऽनन्तविक्रमः । क्षयद्वीरो मारहारो हरः शीतांशुशेखरः ॥ ६६॥ शताङ्गवरदो होता यजमानो
    यशस्करः । मयस्करः शङ्करश्च शिपिविष्टः प्रतिष्ठितः ॥ ६७॥ प्रजापतिः पशुपतिः यतीनां पतिरग्निभूः । सामगानप्रियः
    शुद्धः प्रशान्तात्मा स्थिरः प्रभुः ॥ ६८॥ विभुर्विभासकोऽनन्तो रुद्र उग्रो महेश्वरः । जागर्तको जाङ्गलेशो
    जङ्गमाजङ्गमात्मकः ॥ ६९॥ जातुकर्णप्रियो ज्येष्ठः कनिष्ठः श्रेष्ठ उत्तमः । प्रतिष्ठा परमं धाम परमात्मा
    ऋतं महत् ॥ ७०॥ यन्त्रात्मा मन्त्ररूपात्मा मन्त्ररूपः सदाशिवः । निगमागमसंसेव्यः सुराद्यः प्रपितामहः
    ॥ ७१॥ सुरासुरगणाध्यक्षः त्र्यक्षो दक्षमखान्तकः । महोक्षवाह उक्षेड्य भगाक्षिहरणोऽक्षतः ॥ ७२॥ अनल्पकल्पः
    शिल्पादिः सुशीलः कौलपूजितः । स्तव्यो नव्यो भव्यरूपो हव्यकव्यभुगव्ययः ॥ ७३॥ महाबलो महोत्साहो महादेवो
    महाङ्गधृक् । शतावर्तः शान्तमनाः सहमानः स्तुतिप्रियः ॥ ७४॥ सनातनो वामदेवो मनस्वी मानवर्जितः । गतिदो
    नतपो वाग्मी उच्चैर्घोषो महाहनुः ॥ ७५॥ त्रिपुण्ड्रभालो भस्माङ्गः पुण्डरीकत्वगम्बरः । गायत्रीमध्यनिलयो
    मित्ररूपो जगत्प्रभुः ॥ ७६॥ प्रसेनजित्कक्षवासो नरसिंहनिपातनः । कोलदंष्ट्राधरो भूतो भूतनाथो रतिप्लुतः
    ॥ ७७॥ कूर्माम्रेडितपादाब्जश्चन्द्रचूडः स्थिरो मृडः । गुढपाद्वरहाराढ्य आढ्यो मौढ्यविनाशकः ॥ ७८॥ दण्डी
    कुण्डी तण्डुपूज्यो मुण्डी पाषण्डवर्जितः । अलिङ्गो लिङ्गनिलयः स्फुलिङ्गसदृशेक्षणः ॥ ७९॥ बिल्वपूज्यो
    बिल्मिनिश्च बिलेशयफणाधरः । बाणालिङ्गार्चनप्रीतो वडवानलससम्भवः ॥ ८०॥ बलारातिभुजस्तम्भो भूपतिर्विप्रपूजितः
    । अन्धकान्तकरो भर्गो गोवृषाङ्क उमाधवः ॥ ८१॥ धनञ्जयाक्षः कञ्चाक्षपूज्यपादाम्बुजद्वयः । वीतरागः सान्द्रसुखो
    वङ्कशङ्कुशरो हरः ॥ ८२॥ हयग्रीवार्चितो हेतिधरो भिक्षाटनप्रियः । त्रिमधुस्त्रिसुपर्णात्मा पर्णशायी महेश्वरः
    ॥ ८३॥ अञ्जनाक्षः खञ्जनात्मा रञ्जनो रङ्गनृत्यकृत् । वायुरायुःप्रदो मध्यो गह्वरेष्टोऽन्तकान्तकः ॥ ८४॥
    शर्वः सर्वगतः स्थाणुः स्थविष्ठः सुप्रसन्नवाक् । शब्दः स्पर्शो रसो रूपं गन्धश्चन्द्रो विभावसुः ॥ ८५॥
    सर्वेन्द्रियगुणातीतः सर्वेन्द्रियविवर्जितः । सर्वेषां प्रभुरीशानः सर्वेषां शरणं सुहृत् ॥ ८६॥ सीमा
    भूमा महानात्मा प्रतिष्ठा पुरुषः परः । पुच्छं ब्रह्म ऋतं सत्यं हरो वैष्णवपिङ्गलः ॥ ८७॥ ऊर्ध्वरेता विरूपाक्षः
    क्षितीशः क्षान्तिवर्धनः । सविशेषो निर्विशेषः शेषाहिकटकोज्ज्वलः ॥ ८८॥ रस आनन्द आतार्यः शष्पः फेन्यः
    सिकत्यकः । प्रवाह्यो गेह्यवाह्यश्च प्रसाद्यः प्रमथाधिपः ॥ ८९॥ ज्ञानदो धनदो धीरो दुन्दुभ्यो भीतिनाशकृत्
    । मयस्करो मस्करी च तस्करो भास्करेक्षणः ॥ ९०॥ यशस्करः कुलुञ्चेशो भिषजामधिपो युवा । वर्णी वन्यो गृहस्थश्च
    सन्यासी न्यासमध्यगः ॥ ९१॥ भीमः सोमः प्रशान्तात्मा धाम धूमसवर्णभृत् । कामदः काममथनः क्रथनः कनकाम्बरः
    ॥ ९२॥ समो निः सीममहिमा वनेशः क्षेत्रनायकः । कैलासशैलनिलयो विलयो लयवर्जितः ॥ ९३॥ रक्षाकरो राक्षसघ्नो
    लास्यप्रीतो रतिप्रदः । प्रदोषताण्डवपरः सर्वदोषहरो हरिः ॥ ९४॥ आखण्डलमुखस्तुत्यो मेरुकोदण्डधृग्वरः ।
    वेदघोषः पाटिताशोह्यहिज्यो ब्रह्मसारथिः ॥ ९५॥ सूर्यचन्द्रमहाचक्रो हरिबाणोऽम्बरावृतः । क्ष्मारथस्त्रिपुरारातिः
    कण्वपूज्यो विचारकः ॥ ९६॥ शूली हली लाङ्गली च मुसली कुशली बली । गदी शङ्खी वशी चक्री कवची चान्धसां पतिः
    ॥ ९७॥ निषङ्गसागरः शम्भुः शान्तः सङ्गविवर्जितः । धीरोदात्त उदात्तश्च स्वरितः प्रचयस्वरः ॥ ९८॥ प्रणवः
    प्राणदः शोणः कणादः फणिकङ्कणः । मौनी मानी जितारातिः रीति धातुमयो महान् ॥ ९९॥ अणोरणीयान् सुभगो महतोऽपि
    महत्तरः । स्वराट् सम्राट् विराड् धाता विधातो सर्वतोमुखः ॥ १००॥ मेधाधिपो गाधिपूज्योह्याधिव्याधिविनाशनः
    । गाधाधिपो व्याधिनीशः कलधौतप्रभोऽबलः ॥ १०१॥ वेदगर्भो नीलकण्ठः कुण्ठिताघः कृपाकरः । जगदम्बापतिः साम्बस्त्र्यम्बको
    रविबिम्बगः ॥ १०२॥ सुधासागरमध्यस्थो मणिद्वीपनिकेतनः । कदम्बवनमध्यस्थः नीपवापीप्रपान्तरः ॥ १०३॥ पापतापहरो
    गोप्ता शम्बरारिनिषूदनः । त्रियम्बको वरनटो जटाजूटविभूषितः ॥ १०४॥ काट्यो नीप्यश्च सूद्यश्च सरस्यो मेध्य
    वैद्युतः । ईध्य्र आतप्य आतार्य आलाद्यश्चन्द्रशेखरः ॥ १०५॥ रेष्म्यो रस्यश्च वैशन्तोऽनाद्यः कूप्यो वट्योद्भवः
    । आहनन्यश्च दुन्दुभ्यः सिकत्यः फेन्यवन्यकः ॥ १०६॥ प्रवाह्यश्च सिकत्यश्च प्रवाह्यो गेह्य एव च । हिरण्यतल्प
    आताम्रो भवो रुद्रः पितामहः ॥ १०७॥ संसारवैद्यो विश्वात्मा गजश्चक्रप्रवर्तकः । मेरुः पिता स्विषुः पाता
    गरिष्ठो गह्वरस्तरुः ॥ १०८॥ हिरण्यबाहुराशास्यः सेनानीर्गिरिशो मृडः । सुधन्वा बिल्वपत्रार्च्यो गोनर्दोऽथ
    वृषाकपिः ॥ १०९॥ उरुगायः कल्पवृक्षो ज्योतिर्हेतिर्विभावसुः । सुतिथिः कौशिको धूर्तो धुत्तूरकुसुमप्रियः
    ॥ ११०॥ उमाधवो माधवार्च्यो भस्मरुद्राक्षभूषितः । गङ्गातुङ्गजटामौलिर्नर्मदाशर्मदायकः ॥ १११॥ तमालमालासुगलः
    करवाललसत्करः । अट्टाट्टहासो विकटो दंष्ट्राकुटिलवक्त्रकः ॥ ११२॥ रक्तवृत्तेक्षणः सुभ्रूः श्वभ्रो हर्ता
    कवीश्वरः । फुल्लनीलोत्पलस्रग्वी शम्याकार्च्यो विरोधहा ॥ ११३॥ आर्यः सूर्यप्रभः शास्ता सुहस्तो बस्तचर्मधृक्
    । क्षेत्रेशो जन्महा चात्मा अमोघश्चाद्रिजापतिः ॥ ११४॥ शाणचीरधरोऽघोर बर्बरो भैरवः सखा । उष्णीषवसनाच्छन्न
    उपानत्पात्प्लवः शिवः ॥ ११५॥ वृक्षपल्लवसन्मौलिः शुनां पतिरपां पतिः । जघन्यो बुध्नियश्छन्दोऽप्यरुणो
    भगणेन्द्रधृक् ॥ ११६॥ कुमारजनको वेत्ता परिवीतोपवीतधृक् । बभ्रुः सुचेता मीढ्वांश्च आषाढो द्रापिरुत्तमः
    ॥ ११७॥ एकाक्षोऽनैकपात् सुभ्रूः अधिपो मित्रपः शिवः । क्षेत्रपः स्वपतिर्देवो धनपः शत्रुनाशकृत् ॥ ११८॥
    अन्नेषुश्चैव वातेषुस्तीर्थेषुप्रपथां पतिः । आयुर्दो धनदो धीरो रसः शिवतरो भृगुः ॥ ११९॥ इति श्रीशिवरहस्ये
    द्वादशांशे स्कन्दकृतं शिवसहस्रनामस्तोत्रं सम्पूर्णम् ॥
