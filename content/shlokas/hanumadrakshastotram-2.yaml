id: hanumadrakshastotram-2
category: stotram
name:
  english: hanumadrakshastotram 2
  devanagari: हनुमद्रक्षास्तोत्रम् २
content:
  english: shrihanumadrakshastotram pranamya shriganesham ca shriramam marutim tatha | rakshamimam pathetprajnah
    shraddhabhakti samanvitah || 1|| shiro me hanuman patu bhalam pavananandanah | anjaneyo drishau patu
    ramacandrapriyashruti || 2|| ghranam patu mahaviro mukham lakshmanapranadah | jihvam manojavah patu
    kantham patu jitendriyah || 3|| skandhau mahabali patu bhujau sankatamocanah | karau vishvambharah
    patu hridayam sarvashaktiman || 4|| madhyam patu mahatejah nabhim sagaralanghanah | ramadutah kati
    patu sakthini rakshasendrajit || 5|| uru pucchabalah patu bhimagarvapaharakah | januni shripradah
    patu janghe lankapradahakah || 6|| padau shriramabhaktashca suryamandalabhakshakah | hanuman patu
    me kayam makaradhvaja janmadah || 7|| etam rudrabalopetam raksham yah sukriti pathet | sadirghayusukhi
    putri balavan buddhiman bhavet || 8|| iti shriramarakshastotramanushrutya shrisitaramasharmana viracitam
    shrimad hanumadrakshastotram sampurnam ||
  devanagari: श्रीहनुमद्रक्षास्तोत्रम् प्रणम्य श्रीगणेशं च श्रीरामं मारुतिं तथा । रक्षामिमां पठेत्प्राज्ञः
    श्रद्धाभक्ति समन्वितः ॥ १॥ शिरो मे हनुमान् पातु भालं पवननन्दनः । आञ्जनेयो दृशौ पातु रामचन्द्रप्रियश्रुती
    ॥ २॥ घ्राणं पातु महावीरो मुखं लक्ष्मणप्राणदः । जिह्वां मनोजवः पातु कण्ठं पातु जितेन्द्रियः ॥ ३॥ स्कन्धौ
    महाबली पातु भुजौ सङ्कटमोचनः । करौ विश्वम्भरः पातु हृदयं सर्वशक्तिमान् ॥ ४॥ मध्यं पातु महातेजाः नाभिं
    सागरलङ्घनः । रामदूतः कटी पातु सक्थिनी राक्षसेन्द्रजित् ॥ ५॥ ऊरू पुच्छबलः पातु भीमगर्वापहारकः । जानुनी
    श्रीप्रदः पातु जङ्घे लङ्काप्रदाहकः ॥ ६॥ पादौ श्रीरामभक्तश्च सूर्यमण्डलभक्षकः । हनुमान् पातु मे कायं
    मकरध्वज जन्मदः ॥ ७॥ एतां रुद्रबलोपेतां रक्षां यः सुकृती पठेत् । सदीर्घायुसुखी पुत्री बलवान् बुद्धिमान्
    भवेत् ॥ ८॥ इति श्रीरामरक्षास्तोत्रमनुश्रुत्य श्रीसीतारामशर्मणा विरचितं श्रीमद् हनुमद्रक्षास्तोत्रं
    सम्पूर्णम् ॥
