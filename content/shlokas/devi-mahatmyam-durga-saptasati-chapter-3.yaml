id: devi-mahatmyam-durga-saptasati-chapter-3
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 3
content:
  english: mahishasuravadho nama tritiyo'dhyayah || dhyanam om udyadbhanusahasrakantim arunakshaumam shiromalikam
    raktalipta payodharam japavatim vidyamabhitim varam | hastabjairdhadhatim trinetravaktraravindashriyam
    devim baddhahimamshuratnamakutam vande'ravindasthitam || rishiruvaca || || nihanyamanam tatsainyam
    avalokya mahasurah| senanishcikshurah kopad dhyayau yoddhumathambikam || || sa devim sharavarshena
    vavarsha samare'surah| yatha merugirehshringam toyavarshena toyadah || || tasya chitva tato devi lilayaiva
    sharotkaran| jaghana turaganbanairyantaram caiva vajinam || || ciccheda ca dhanuhsadhyo dhvajam catisamucchritam|
    vivyadha caiva gatreshu cinnadhanvanamashugaih || || sacchinnadhanva viratho hatashvo hatasarathih|
    abhyadhavata tam devim khadgacarmadharo'surah || || simhamahatya khadgena tikshnadharena murdhani|
    ajaghana bhuje savye devim avyativegavan || || tasyah khadgo bhujam prapya paphala nripanandana| tato
    jagraha shulam sa kopad arunalocanah || || cikshepa ca tatastattu bhadrakalyam mahasurah| jajvalyamanam
    tejobhi ravibimbamivambarat || || drishtva tadapatacchulam devi shulamamuncata| tacchulamshatadha
    tena nitam shulam sa ca mahasurah || || hate tasminmahavirye mahishasya camupatau| ajagama gajarudah
    shcamarastridashardanah || || so'pi shaktimmumocatha devyastam ambika drutam| hunkarabhihatam bhumau
    patayamasanishprabham || || bhagnam shaktim nipatitam drishtva krodhasamanvitah cikshepa camarah shulam
    banaistadapi sacchinat || || tatah simhahsamutpatya gajakuntare mbhantaresthitah| bahuyuddhena yuyudhe
    tenoccaistridasharina || || yudhyamana'u tatasta'u tu tasmannaganmahim gata'u yuyudhate'tisamrabdhau
    praharai atidarunaih || || tato vegat khamutpatya nipatya ca mrigarina| karapraharena shirashcamarasya
    prithak kritam || || udagrashca rane devya shilavrikshadibhirhatah| danta mushtitalaishcaiva karalashca
    nipatitah || || devi kriddha gadapataih shcurnayamasa coddhatam| bhashkalam bhindipalena banaistamram
    tathandhakam || || ugrasyamugraviryam ca tathaiva ca mahahanum trinetra ca trishulena jaghana parameshvari
    || || bidalasyasina kayat patayamasa vai shirah| durdharam durmukham cobhau sharairninye yamakshayam
    || || evam sankshiyamane tu svasainye mahishasurah| mahishena svarupena trasayamasatan ganan || ||
    kamshcittundapraharena khurakshepaistathaparan| langulataditamshcanyan shringabhyam ca vidarita ||
    || vegena kamshcidaparannadena bhramanena ca| nih shvasapavanenanyan patayamasa bhutale|| || nipatya
    pramathanikamabhyadhavata so'surah simham hantum mahadevyah kopam cakre tato'mbhika || || so'pi kopanmahaviryah
    khurakshunnamahitalah| shringabhyam parvatanuccamshcikshepa ca nanada ca || || vega bhramana vikshunna
    mahi tasya vyashiryata| langulenahatashcabdhih plavayamasa sarvatah || || dhutashringvibhinnashca
    khandam khandam yayurghanah| shvasanilastah shatasho nipeturnabhaso'calah || || itikrodhasamadhmatamapatantam
    mahasuram| drishtva sa candika kopam tadvadhaya tada'karot || || sa kshitpva tasya vaipasham tam babandha
    mahasuram| tatyajamahisham rupam so'pi baddho mahamridhe || || tatah simho'bhavatsadhyo yavattasyambika
    shirah| chinatti tavat purushah khadgapani radrishyata || || tata evashu purusham devi ciccheda sayakaih|
    tam khadgacarmana sardham tatah so' bhunmaha gajah || || karena ca mahasimham tam cakarsha jagarjaca
    | karshatastu karam devi khadgena nirakrintata || || tato mahasuro bhuyo mahisham vapurasthitah| tathaiva
    kshobhayamasa trailokyam sacaracaram || || tatah kruddha jaganmata candika pana muttamam| papau punah
    punashcaiva jahasarunalocana || || nanarda casurah so'pi balaviryamadoddhatah| vishanabhyam ca cikshepa
    candikam pratibhudharan|| || sa ca ta nprahitam stena curnayanti sharotkaraih| uvaca tam madoddhutamukharagakulaksharam
    || uvaca|| garja garja kshanam mudha madhu yavatpibamyaham| mayatvayi hate'traiva garjishyantyashu
    devatah || || rishiruvaca|| evamuktva samutpatya sarudha tam mahasuram| padena kramya kanthe ca shulenaina
    matadayat || || tatah so'pi padakrantastaya nijamukhattatah| ardha nishkranta evasiddevya viryena
    samvritah || || ardha nishkranta evasau yudhyamano mahasurah | taya mahasina devya shirashchittva
    nipatitah || || tato hahakritam sarvam daityasainyam nanasha tat| praharsham ca param jagmuh sakala
    devataganah || || tushtu vustam sura devim sahadivyairmaharshibhih| jagurgundharvapatayo nanritushcapsaroganah
    || || || iti shri markandeya purane savarnike manvantare devi mahatmye mahishasuravadho nama tritiyo'dhyayam
    samaptam || ahuti hrim jayanti sangayai sayudhayai sashaktikayai saparivarayai savahanayai shri mahalakshmyai
    lakshmi bijadishtayai mahahutim samarpayami namah svaha ||
  devanagari: महिषासुरवधो नाम तृतीयोऽध्यायः ॥ ध्यानं ॐ उद्यद्भानुसहस्रकान्तिं अरुणक्षौमां शिरोमालिकां
    रक्तालिप्त पयोधरां जपवटीं विद्यामभीतिं वरम् । हस्ताब्जैर्धधतीं त्रिनेत्रवक्त्रारविन्दश्रियं देवीं
    बद्धहिमांशुरत्नमकुटां वन्देऽरविन्दस्थिताम् ॥ ऋषिरुवाच ॥ ॥ निहन्यमानं तत्सैन्यं अवलोक्य महासुरः। सेनानीश्चिक्षुरः
    कोपाद् ध्ययौ योद्धुमथाम्बिकाम् ॥ ॥ स देवीं शरवर्षेण ववर्ष समरेऽसुरः। यथा मेरुगिरेःशृङ्गं तोयवर्षेण
    तोयदः ॥ ॥ तस्य छित्वा ततो देवी लीलयैव शरोत्करान्। जघान तुरगान्बाणैर्यन्तारं चैव वाजिनाम् ॥ ॥ चिच्छेद
    च धनुःसध्यो ध्वजं चातिसमुच्छृतम्। विव्याध चैव गात्रेषु चिन्नधन्वानमाशुगैः ॥ ॥ सच्छिन्नधन्वा विरथो
    हताश्वो हतसारथिः। अभ्यधावत तां देवीं खड्गचर्मधरोऽसुरः ॥ ॥ सिंहमाहत्य खड्गेन तीक्ष्णधारेण मूर्धनि।
    आजघान भुजे सव्ये देवीं अव्यतिवेगवान् ॥ ॥ तस्याः खड्गो भुजं प्राप्य पफाल नृपनन्दन। ततो जग्राह शूलं
    स कोपाद् अरुणलोचनः ॥ ॥ चिक्षेप च ततस्तत्तु भद्रकाल्यां महासुरः। जाज्वल्यमानं तेजोभी रविबिम्बमिवाम्बरात्
    ॥ ॥ दृष्ट्वा तदापतच्छूलं देवी शूलममुञ्चत। तच्छूलंशतधा तेन नीतं शूलं स च महासुरः ॥ ॥ हते तस्मिन्महावीर्ये
    महिषस्य चमूपतौ। आजगाम गजारूडः श्चामरस्त्रिदशार्दनः ॥ ॥ सोऽपि शक्तिम्मुमोचाथ देव्यास्तां अम्बिका द्रुतम्।
    हुङ्काराभिहतां भूमौ पातयामासनिष्प्रभाम् ॥ ॥ भग्नां शक्तिं निपतितां दृष्ट्वा क्रोधसमन्वितः चिक्षेप
    चामरः शूलं बाणैस्तदपि साच्छिनत् ॥ ॥ ततः सिंहःसमुत्पत्य गजकुन्तरे म्भान्तरेस्थितः। बाहुयुद्धेन युयुधे
    तेनोच्चैस्त्रिदशारिणा ॥ ॥ युध्यमानऽउ ततस्तऽउ तु तस्मान्नागान्महीं गतऽउ युयुधातेऽतिसंरब्धौ प्रहारै
    अतिदारुणैः ॥ ॥ ततो वेगात् खमुत्पत्य निपत्य च मृगारिणा। करप्रहारेण शिरश्चामरस्य पृथक् कृतम् ॥ ॥ उदग्रश्च
    रणे देव्या शिलावृक्षादिभिर्हतः। दन्त मुष्टितलैश्चैव करालश्च निपातितः ॥ ॥ देवी कृद्धा गदापातैः श्चूर्णयामास
    चोद्धतम्। भाष्कलं भिन्दिपालेन बाणैस्ताम्रं तथान्धकम् ॥ ॥ उग्रास्यमुग्रवीर्यं च तथैव च महाहनुम् त्रिनेत्रा
    च त्रिशूलेन जघान परमेश्वरी ॥ ॥ बिडालस्यासिना कायात् पातयामास वै शिरः। दुर्धरं दुर्मुखं चोभौ शरैर्निन्ये
    यमक्षयम् ॥ ॥ एवं सङ्क्षीयमाणे तु स्वसैन्ये महिषासुरः। माहिषेण स्वरूपेण त्रासयामासतान् गणान् ॥ ॥ कांश्चित्तुण्डप्रहारेण
    खुरक्षेपैस्तथापरान्। लाङ्गूलताडितांश्चान्यान् शृङ्गाभ्यां च विदारिता ॥ ॥ वेगेन कांश्चिदपरान्नादेन
    भ्रमणेन च। निः श्वासपवनेनान्यान् पातयामास भूतले॥ ॥ निपात्य प्रमथानीकमभ्यधावत सोऽसुरः सिंहं हन्तुं
    महादेव्याः कोपं चक्रे ततोऽम्भिका ॥ ॥ सोऽपि कोपान्महावीर्यः खुरक्षुण्णमहीतलः। शृङ्गाभ्यां पर्वतानुच्चांश्चिक्षेप
    च ननाद च ॥ ॥ वेग भ्रमण विक्षुण्णा मही तस्य व्यशीर्यत। लाङ्गूलेनाहतश्चाब्धिः प्लावयामास सर्वतः ॥ ॥
    धुतशृङ्ग्विभिन्नाश्च खण्डं खण्डं ययुर्घनाः। श्वासानिलास्ताः शतशो निपेतुर्नभसोऽचलाः ॥ ॥ इतिक्रोधसमाध्मातमापतन्तं
    महासुरम्। दृष्ट्वा सा चण्डिका कोपं तद्वधाय तदाऽकरोत् ॥ ॥ सा क्षित्प्वा तस्य वैपाशं तं बबन्ध महासुरम्।
    तत्याजमाहिषं रूपं सोऽपि बद्धो महामृधे ॥ ॥ ततः सिंहोऽभवत्सध्यो यावत्तस्याम्बिका शिरः। छिनत्ति तावत्
    पुरुषः खड्गपाणि रदृश्यत ॥ ॥ तत एवाशु पुरुषं देवी चिच्छेद सायकैः। तं खड्गचर्मणा सार्धं ततः सोऽ भून्महा
    गजः ॥ ॥ करेण च महासिंहं तं चकर्ष जगर्जच । कर्षतस्तु करं देवी खड्गेन निरकृन्तत ॥ ॥ ततो महासुरो भूयो
    माहिषं वपुरास्थितः। तथैव क्षोभयामास त्रैलोक्यं सचराचरम् ॥ ॥ ततः क्रुद्धा जगन्माता चण्डिका पान मुत्तमम्।
    पपौ पुनः पुनश्चैव जहासारुणलोचना ॥ ॥ ननर्द चासुरः सोऽपि बलवीर्यमदोद्धतः। विषाणाभ्यां च चिक्षेप चण्डिकां
    प्रतिभूधरान्॥ ॥ सा च ता न्प्रहितां स्तेन चूर्णयन्ती शरोत्करैः। उवाच तं मदोद्धूतमुखरागाकुलाक्षरम् ॥
    उवाच॥ गर्ज गर्ज क्षणं मूढ मधु यावत्पिबाम्यहम्। मयात्वयि हतेऽत्रैव गर्जिष्यन्त्याशु देवताः ॥ ॥ ऋषिरुवाच॥
    एवमुक्त्वा समुत्पत्य सारूढा तं महासुरम्। पादेना क्रम्य कण्ठे च शूलेनैन मताडयत् ॥ ॥ ततः सोऽपि पदाक्रान्तस्तया
    निजमुखात्ततः। अर्ध निष्क्रान्त एवासीद्देव्या वीर्येण संवृतः ॥ ॥ अर्ध निष्क्रान्त एवासौ युध्यमानो महासुरः
    । तया महासिना देव्या शिरश्छित्त्वा निपातितः ॥ ॥ ततो हाहाकृतं सर्वं दैत्यसैन्यं ननाश तत्। प्रहर्षं
    च परं जग्मुः सकला देवतागणाः ॥ ॥ तुष्टु वुस्तां सुरा देवीं सहदिव्यैर्महर्षिभिः। जगुर्गुन्धर्वपतयो ननृतुश्चाप्सरोगणाः
    ॥ ॥ ॥ इति श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये महिषासुरवधो नाम तृतीयोऽध्यायं समाप्तम्
    ॥ आहुति ह्रीं जयन्ती साङ्गायै सायुधायै सशक्तिकायै सपरिवारायै सवाहनायै श्री महालक्ष्म्यै लक्ष्मी बीजादिष्टायै
    महाहुतिं समर्पयामि नमः स्वाहा ॥
