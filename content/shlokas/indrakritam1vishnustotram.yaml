id: indrakritam1vishnustotram
category: stotram
name:
  english: indrakritam1vishnustotram
  devanagari: इन्द्रकृतं१विष्णुस्तोत्रम्
content:
  english: indrakritam 1 vishnustotram indra uvaca | namo matsyaya kurmaya varahaya namo namah | narasimhaya
    devaya vamanaya namo namah || 68|| namo'stu hayarupaya trivikrama namo'stu te | namo'stu buddharupaya
    ramarupaya kalkine || 69|| anantayacyutayesha jamadagnyaya te namah | varunendrasvarupaya yamarupaya
    te namah || 70|| parameshaya devaya namastrailokyarupine | bibhratsarasvatim vaktre sarvajno'si namo'stu
    te || 71|| lakshmivanasyato lakshmim bibhradvakshasi canagha | bahubahurupadastvam bahukarnakshishirshakah
    | tvameva sukhinam prapya bahavah sukhino'bhavan || 72|| tavannihshrikata pumsam malinyam dainyameva
    va | yavanna yanti sharanam hare tvam karunarnavam || 73|| iti brahmapurane dvavimshadhikashatatamadhyayantargatam
    indrakritam vishnustotram samaptam | brahmapurana | adhyaya 122
  devanagari: इन्द्रकृतं १ विष्णुस्तोत्रम् इन्द्र उवाच । नमो मत्स्याय कूर्माय वराहाय नमो नमः । नरसिंहाय
    देवाय वामनाय नमो नमः ॥ ६८॥ नमोऽस्तु हयरूपाय त्रिविक्रम नमोऽस्तु ते । नमोऽस्तु बुद्धरूपाय रामरूपाय
    कल्किने ॥ ६९॥ अनन्तायाच्युतायेश जामदग्न्याय ते नमः । वरुणेन्द्रस्वरूपाय यमरूपाय ते नमः ॥ ७०॥ परमेशाय
    देवाय नमस्त्रैलोक्यरूपिणे । बिभ्रत्सरस्वतीं वक्त्रे सर्वज्ञोऽसि नमोऽस्तु ते ॥ ७१॥ लक्ष्मीवानस्यतो
    लक्ष्मीं बिभ्रद्वक्षसि चानघ । बहुबाहूरुपादस्त्वं बहुकर्णाक्षिशीर्षकः । त्वामेव सुखिनं प्राप्य बहवः
    सुखिनोऽभवन् ॥ ७२॥ तावन्निःश्रीकता पुंसां मालिन्यं दैन्यमेव वा । यावन्न यान्ति शरणं हरे त्वां करुणार्णवम्
    ॥ ७३॥ इति ब्रह्मपुराणे द्वाविंशाधिकशततमाध्यायान्तर्गतं इन्द्रकृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय १२२
