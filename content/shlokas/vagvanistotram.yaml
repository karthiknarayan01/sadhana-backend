id: vagvanistotram
category: stotram
name:
  english: vagvanistotram
  devanagari: वाग्वाणीस्तोत्रम्
content:
  english: vagvanistotram sarasvatim namasyami cetanam hridi samsthitam | kanthastham padmayonim ca hrinkarasupriyam
    sada || 1|| matidam varadam caiva sarvakamapradayinim | keshavasya priyam devim vinahastam varapradam
    || 2|| aim hrim mantrapriyam caiva kumatidhvamsakarinim | svaprakasham niralambamajnanatimirapaham
    || 3|| mokshapradam sunityam suvaradam shodhanapriyam | adityamandale linam pranamami jinapriyam ||
    4|| jnanakaram jagaddipam bhaktapashavinashinim | iti samyak stuta devi vagishena mahatmana || 5||
    atmanam darshayamasa sharadindusamaprabha | sarasvatyuvaca varam vrinishva bhadanta yatte manasi vartate
    || 6|| brihaspatiruvaca prasanna yadi me devi divyam jnanam pradiyatam | sarasvatyuvaca stotrenanena
    ye bhaktya mam stuvanti sada narah || 7|| labhante paramam jnanam mama tulyaparakramam | kavitvam
    matprasadena tatha ca vipulam yashah || 8|| trisandhyam prayato bhutva yah stotram pathate narah |
    tasya kanthe sada vasam karishyami na samshayah || 9|| om aim vagvadini mama jihvayam om hrim mantrasarasvati
    svaha | iti brihaspatikritam shrivagvanistotram sampurnam ||
  devanagari: वाग्वाणीस्तोत्रम् सरस्वतीं नमस्यामि चेतनां हृदि संस्थिताम् । कण्ठस्थां पद्मयोनिं च ह्रीङ्कारसुप्रियां
    सदा ॥ १॥ मतिदां वरदां चैव सर्वकामप्रदायिनीम् । केशवस्य प्रियां देवीं वीणाहस्तां वरप्रदाम् ॥ २॥ ऐं
    ह्रीं मन्त्रप्रियां चैव कुमतिध्वंसकारिणीम् । स्वप्रकाशां निरालम्बामज्ञानतिमिरापहाम् ॥ ३॥ मोक्षप्रदां
    सुनित्यां सुवरदां शोधनप्रियाम् । आदित्यमण्डले लीनां प्रणमामि जिनप्रियाम् ॥ ४॥ ज्ञानाकारां जगद्दीपां
    भक्तपाशविनाशिनीम् । इति सम्यक् स्तुता देवी वागीशेन महात्मना ॥ ५॥ आत्मानं दर्शयामास शरदिन्दुसमप्रभा
    । सरस्वत्युवाच वरं वृणीष्व भदन्त यत्ते मनसि वर्तते ॥ ६॥ बृहस्पतिरुवाच प्रसन्ना यदि मे देवी दिव्यं
    ज्ञानं प्रदीयताम् । सरस्वत्युवाच स्तोत्रेणानेन ये भक्त्या मां स्तुवन्ति सदा नराः ॥ ७॥ लभन्ते परमं
    ज्ञानं मम तुल्यपराक्रमम् । कवित्वं मत्प्रसादेन तथा च विपुलं यशः ॥ ८॥ त्रिसन्ध्यं प्रयतो भूत्वा यः
    स्तोत्रं पठते नरः । तस्य कण्ठे सदा वासं करिष्यामि न संशयः ॥ ९॥ ॐ ऐं वाग्वादिनि मम जिह्वायां ॐ ह्रीं
    मन्त्रसरस्वति स्वाहा । इति बृहस्पतिकृतं श्रीवाग्वाणीस्तोत्रं सम्पूर्णम् ॥
