id: agnistotram-mandapalakritam-mahabharatantargatam
category: stotram
name:
  english: agnistotram (mandapalakritam mahabharatantargatam)
  devanagari: अग्निस्तोत्रम् (मन्दपालकृतं महाभारतान्तर्गतम्)
content:
  english: mandapalakritam agnistotram mandapala uvaca | tvamagne sarvadevanam mukham tvamasi havyavat
    | tvamantah sarvabhutanam gudhashcarasi pavaka || 22|| tvamekamahuh kavayastvamahustrividham punah
    | tvamashtadha kalpayitva yajnavahamakalpayan || 23|| tvaya srishtamidam vishvam vadanti paramarshayah
    | tvadrite hi jagatkritsnam sadyo na syaddhutashana || 24|| tubhyam kritva namo viprah svakarmavijitam
    gatim | gacchanti saha patnibhih sutairapi ca shashvatim || 25|| tvamagne jaladanahuh khe vishaktansavidyutah
    | dahanti sarvabhutani tvatto nishkramya hayanah || 26|| jatavedastavaiveyam vishvasrishtirmahadyute
    | tavaiva karma vihitam bhutam sarvam caracaram || 27|| tvaya''po vihitah purvam tvayi sarvamidam
    jagat | tvayi havyam ca kavyam ca yathavatsampratishthitam || 28|| agne tvameva jvalanastvam dhata
    tvam brihaspatih | tvamashvinau yamau mitrah somastvamasi canilah || 29|| iti mahabharate adiparvani
    220 adhyayantargatam mahabharata | adiparva | adhyaya 220
  devanagari: मन्दपालकृतं अग्निस्तोत्रम् मन्दपाल उवाच । त्वमग्ने सर्वदेवानां मुखं त्वमसि हव्यवाट् । त्वमन्तः
    सर्वभूतानां गूढश्चरसि पावक ॥ २२॥ त्वामेकमाहुः कवयस्त्वामाहुस्त्रिविधं पुनः । त्वामष्टधा कल्पयित्वा
    यज्ञवाहमकल्पयन् ॥ २३॥ त्वया सृष्टमिदं विश्वं वदन्ति परमर्षयः । त्वदृते हि जगत्कृत्स्नं सद्यो न स्याद्धुताशन
    ॥ २४॥ तुभ्यं कृत्वा नमो विप्राः स्वकर्मविजितां गतिम् । गच्छन्ति सह पत्नीभिः सुतैरपि च शाश्वतीम् ॥
    २५॥ त्वामग्ने जलदानाहुः खे विषक्तान्सविद्युतः । दहन्ति सर्वभूतानि त्वत्तो निष्क्रम्य हायनाः ॥ २६॥
    जातवेदस्तवैवेयं विश्वसृष्टिर्महाद्युते । तवैव कर्म विहितं भूतं सर्वं चराचरम् ॥ २७॥ त्वयाऽऽपो विहिताः
    पूर्वं त्वयि सर्वमिदं जगत् । त्वयि हव्यं च कव्यं च यथावत्सम्प्रतिष्ठितम् ॥ २८॥ अग्ने त्वमेव ज्वलनस्त्वं
    धाता त्वं बृहस्पतिः । त्वमश्विनौ यमौ मित्रः सोमस्त्वमसि चानिलः ॥ २९॥ इति महाभारते आदिपर्वणि २२० अध्यायान्तर्गतं
    महाभारत । आदिपर्व । अध्याय २२०
meaning: {}
