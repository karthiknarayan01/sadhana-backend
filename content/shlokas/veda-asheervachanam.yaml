id: veda-asheervachanam
category: stotram
name:
  english: Veda Asheervachanam
content:
  english: navonavo bhavati jayamano ndevebhyo vi dadhatyaya stirati dirghamayuh || shatamana mbhavati
    shatayuh purushashshatendriya ayushye tishthati || sumangaliriyam gyamasyai datva yathastam dhvassuputragm
    subhaga mputranadhehi pati nkridhi || kshatrasya raja varuno 'dhirajah | nakshatranagm shatabhishag
    vasishthah | tau devebhyah krinuto dirghamayuh || shataya svahetyaha | ayurvai sahasra m | ayurevavarundhe
    | sarvasmai svahetyaha | ramevavarundhe || shreyo mbhutam | citrah ketuh prabhanabhan thsabhan | jyotishmagasteja
    pannabhitapann || rocano rocamana shshobhamanah kalyanah || shri mbahuputralabham shatasam
  devanagari: नवो॑नवो॑ भवति॒ जाय॑मा॒णो न्दे॒वेभ्यो॒ वि द॑धात्या॒य स्तिरति दी॒र्घमायुः॑ ॥ श॒तमा॑न म्भवति
    श॒तायुः॒ पुरु॑षश्श॒तेन्द्रिय॒ आयु॑ष्ये॒ तिष्ठति ॥ सु॒म॒ङ्ग॒लीरि॒यं ग्यम॒स्यै द॒त्वा यथास्तं॒ ढ्वस्सुपु॒त्रग्ं
    सु॒भगा म्पु॒त्रानाधे॑हि॒ पति॑ ङ्कृ॑धि ॥ क्ष॒त्रस्य॒ राजा॒ वरु॑णो ऽधिरा॒जः । नक्ष॑त्राणाग्ं श॒तभि॑षग्
    वसि॑ष्ठः । तौ दे॒वेभ्यः॑ कृणुतो दी॒र्घमायुः॑ ॥ श॒ताय॒ स्वाहेत्या॑ह । आयु॒र्वै स॒हस्र म् । आयु॑रे॒वावरु॑न्धे
    । सर्व॒स्मै॒ स्वाहेत्याह । रमे॒वाव॑रुन्धे ॥ श्रेयो॒ म्भू॒तम् । चि॒त्रः के॒तुः प्र॒भाना॒भान् थ्स॒भान्
    । ज्योति॑श्मा॒ग॒स्तेज॑ प॑न्नभितपन्न् ॥ रो॒च॒नो रोच॑मान श्शोभ॒मानः कल्याणः॑ ॥ श्री॒ म्ब॒हुपुत्रला॒भं
    श॒तसं
