id: sri-durga-sapta-shloki
category: stotram
name:
  english: SrI Durga Sapta Shloki
content:
  english: shiva uvaca | devi tvam bhaktasulabhe sarvakaryavidhayini | kalau hi karyasiddhyarthamupayam
    bruhi yatnatah || devyuvaca | shrinu deva pravakshyami kalau sarveshtasadhanam | maya tavaiva snehenapyambastutih
    prakashyate || asya shri durga saptashloki stotramantrasya narayana rishih shri mahakali mahalakshmi
    mahasarasvatyo devatah shri durga prityartham saptashloki durgapathe viniyogah | jnaninamapi cetamsi
    devi bhagavati hi sa | baladakrishya mohaya mahamaya prayacchati || || durge smrita harasi bhitimasheshajantoh
    svasthaih smrita matimativa shubham dadasi | daridryaduhkha bhayaharini ka tvadanya sarvopakarakaranaya
    sadardra citta || || sarvamangalamangalye shive sarvarthasadhike | sharanye tryambake gauri narayani
    namo'stu te || || sharanagatadinartaparitranaparayane | sarvasyartihare devi narayani namo'stu te
    || || sarvasvarupe sarveshe sarvashaktisamanvite | bhayebhyastrahi no devi durge devi namo'stu te
    || || roganasheshanapahamsi tushta rushta tu kaman sakalanabhishtan | tvamashritanam na vipannaranam
    tvamashrita hyashrayatam prayanti || || sarvabadhaprashamanam trailokyasyakhileshvari | evameva tvaya
    karyamasmadvairi vinashanam || || iti shri durga saptashloki |
  devanagari: शिव उवाच । देवी त्वं भक्तसुलभे सर्वकार्यविधायिनि । कलौ हि कार्यसिद्ध्यर्थमुपायं ब्रूहि यत्नतः
    ॥ देव्युवाच । शृणु देव प्रवक्ष्यामि कलौ सर्वेष्टसाधनम् । मया तवैव स्नेहेनाप्यम्बास्तुतिः प्रकाश्यते
    ॥ अस्य श्री दुर्गा सप्तश्लोकी स्तोत्रमन्त्रस्य नारायण ऋषिः श्री महाकाली महालक्ष्मी महासरस्वत्यो देवताः
    श्री दुर्गा प्रीत्यर्थं सप्तश्लोकी दुर्गापाठे विनियोगः । ज्ञानिनामपि चेतांसि देवी भगवती हि सा । बलादाकृष्य
    मोहाय महामाया प्रयच्छति ॥ ॥ दुर्गे स्मृता हरसि भीतिमशेषजन्तोः स्वस्थैः स्मृता मतिमतीव शुभां ददासि
    । दारिद्र्यदुःख भयहारिणि का त्वदन्या सर्वोपकारकरणाय सदार्द्र चित्ता ॥ ॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके
    । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ ॥ शरणागतदीनार्तपरित्राणपरायणे । सर्वस्यार्तिहरे देवि
    नारायणि नमोऽस्तु ते ॥ ॥ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते । भयेभ्यस्त्राहि नो देवि दुर्गे देवि
    नमोऽस्तु ते ॥ ॥ रोगानशेषानपहंसि तुष्टा रुष्टा तु कामान् सकलानभीष्टान् । त्वामाश्रितानां न विपन्नराणां
    त्वामाश्रिता ह्याश्रयतां प्रयान्ति ॥ ॥ सर्वबाधाप्रशमनं त्रैलोक्यस्याखिलेश्वरि । एवमेव त्वया कार्यमस्मद्वैरि
    विनाशनम् ॥ ॥ इति श्री दुर्गा सप्तश्लोकी ।
