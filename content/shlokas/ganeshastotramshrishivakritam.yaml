id: ganeshastotramshrishivakritam
category: stotram
name:
  english: ganeshastotramshrishivakritam
  devanagari: गणेशस्तोत्रम्श्रीशिवकृतं
content:
  english: shrishivakritam shriganeshastotram || shriganeshaya namah || shrishiva uvaca | ganeshaya pareshaya
    dhumravarnaya dhundhaye | shivatmajaya sarvesham matre pitre namo namah || 22|| ganeshaya gunanam
    te srashtre patre mahatmane | samhartre devadevaya herambaya namo namah || 23|| anantavibhavayaivanantamayapracalaka
    | anantodaragayaiva vighneshaya namo namah || 24|| jyeshtharajaya jyeshthaya jyeshthanam jyeshtharupine
    | sarvapujyaya te sarvadipujyaya namo namah || 25|| svanandapataye tubhyam mushakadhvajadharine |
    siddhibuddhipate nathekshusagarapate namah || 26|| manovanivihinaya manovanimayaya te | yogeshaya
    mahavishnusutaya te namo namah || 27|| sheshaputraya trailokyakshetrasthaya namo namah | dandakaranyadevaya
    brahmeshaya namo namah || 28|| yatra vedadayo natha yoginah shantimayayuh | tam pashyami ganadhisham
    dhanyo'ham sarvabhavatah || 29|| netrani dhanyarupani prabho tvat darshanena me | mastakani namaskarat
    stavanan me mukhani te || 30|| hastah pujanataste me dhanyah sarvam madiyakam | dhanyam te padapadmasya
    darshanena gajanana || 31|| bhaktim dehi tvadiyam me taya'ham gananayaka | kritakrityo bhavishyami
    shantiyogaparayanah || 32|| tripurasya vadharthaya samarthyam dehi shashvatam | mahesha tvam ganadhisha
    sarthakam kuru nityada || 33|| iti shrishivakritam shriganeshastotram sampurnam ||
  devanagari: श्रीशिवकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ श्रीशिव उवाच । गणेशाय परेशाय धूम्रवर्णाय
    ढुण्ढये । शिवात्मजाय सर्वेषां मात्रे पित्रे नमो नमः ॥ २२॥ गणेशाय गुणानां ते स्रष्ट्रे पात्रे महात्मने
    । संहर्त्रे देवदेवाय हेरम्बाय नमो नमः ॥ २३॥ अनन्तविभवायैवानन्तमायाप्रचालक । अनन्तोदरगायैव विघ्नेशाय
    नमो नमः ॥ २४॥ ज्येष्ठराजाय ज्येष्ठाय ज्येष्ठानां ज्येष्ठरूपिणे । सर्वपूज्याय ते सर्वादिपूज्याय नमो
    नमः ॥ २५॥ स्वानन्दपतये तुभ्यं मूषकध्वजधारिणे । सिद्धिबुद्धिपते नाथेक्षुसागरपते नमः ॥ २६॥ मनोवाणीविहीनाय
    मनोवाणीमयाय ते । योगेशाय महाविष्णुसुताय ते नमो नमः ॥ २७॥ शेषपुत्राय त्रैलोक्यक्षेत्रस्थाय नमो नमः
    । दण्डकारण्यदेवाय ब्रह्मेशाय नमो नमः ॥ २८॥ यत्र वेदादयो नाथ योगिनः शान्तिमाययुः । तं पश्यामि गणाधीशं
    धन्योऽहं सर्वभावतः ॥ २९॥ नेत्राणि धन्यरूपाणि प्रभो त्वत् दर्शनेन मे । मस्तकानि नमस्कारात् स्तवनान्
    मे मुखानि ते ॥ ३०॥ हस्ताः पूजनतस्ते मे धन्याः सर्वं मदीयकम् । धन्यं ते पादपद्मस्य दर्शनेन गजानन ॥
    ३१॥ भक्तिं देहि त्वदीयां मे तयाऽहं गणनायक । कृतकृत्यो भविष्यामि शान्तियोगपरायणः ॥ ३२॥ त्रिपुरस्य वधार्थाय
    सामर्थ्यं देहि शाश्वतम् । महेश त्वं गणाधीश सार्थकं कुरु नित्यदा ॥ ३३॥ इति श्रीशिवकृतं श्रीगणेशस्तोत्रं
    सम्पूर्णम् ॥
