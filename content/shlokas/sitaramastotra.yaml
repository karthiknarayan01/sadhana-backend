id: sitaramastotra
category: stotram
name:
  english: sitaramastotra
  devanagari: सीतारामस्तोत्र
content:
  english: sadrishakarau trailokyagrihadampati| imau yuvam pranamyaham bhajamyadya kritarthatam || 9||
    anena stauti yah stutyam ramam sitam ca bhaktitah | tasya tau tanutam punyassampadah sakalarthadah
    || 10|| evam shriramacandrasya janakyashca visheshatah | kritam hanumata punyam stotram sadyo vimuktidam
    | yah pathetpratarutthaya sarvan kamanavapnuyat || 11||
  devanagari: सदृशाकारौ त्रैलोक्यगृहदम्पती। इमौ युवां प्रणम्याहं भजाम्यद्य कृतार्थताम् ॥ ९॥ अनेन स्तौति
    यः स्तुत्यं रामं सीतां च भक्तितः । तस्य तौ तनुतां पुण्यास्सम्पदः सकलार्थदाः ॥ १०॥ एवं श्रीरामचन्द्रस्य
    जानक्याश्च विशेषतः । कृतं हनूमता पुण्यं स्तोत्रं सद्यो विमुक्तिदम् । यः पठेत्प्रातरुत्थाय सर्वान्
    कामानवाप्नुयात् ॥ ११॥
meaning: {}
