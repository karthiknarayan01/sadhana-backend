id: sundarastava
category: stotram
name:
  english: sundarastava
  devanagari: सुन्दरस्तव
content:
  english: ringavrikshagraprakaradishvavasthitam | durgarakshekshanodvignacetasam naumi marutim || 3||
    lankaya'dhrishyavamamushtighatavaghurnaya | uktva''yatimanujnatam sotsaham naumi marutim || 4|| vividhairbhavanairdiptam
    purim rakshasasankulam | pashyantam rakshasendrantahpuragam naumi marutim || 5|| jyautsnyam nishyatiramyeshu
    harmyeshu janakatmajam | margamanamadrishtva tam vishannam naumi marutim || kumbhakarnadiraksho'gyraprasadavritamuttamam
    | suguptam ravanagriham vishantam naumi marutim || 7|| pushpakakhyam rajagriham bhusvargam vismayavaham
    | drishtvapyadrishtva vaidehim duhkhitam naumi marutim || 8|| ratnojjvalam vishvakarmanirmitam kamagam
    shubham | pashyantam pushpakam spharanayanam naumi marutim || 9|| sankulantahpuram suptananayauvatamacchalam
    | drishtvapyavikritam sitam didrikshum naumi marutim || 10|| pivanam ravanam suptam tatpatnim shayane'nyatah
    | drishtva siteti samhrishtam capalam naumi marutim || 11|| suptastridrishtinashtatmabrahmacaryavishankinam
    | apakramya''panabhumim gacchantam naumi marutim || 12|| kalatyayanripakrodhakaryasiddhivishankitam
    | nirvinnamapyanirvede drishtartham naumi marutim || 13|| punarnivrittau kapeyamanushapayashankinam
    | ramadin siddhaye natvottishthantam naumi marutim || 14|| sitamashokavanikanadyam snanarthameshyatim
    | drashtum pushpitavrikshagranilinam naumi marutim || 15|| sitam drishtva shimshapadhahsthitam caritramatrikam
    | manasa ramamasadya nivrittam naumi marutim || 16|| iha sita tato ramah idrishiyam sa tadrishah |
    anyonyamarhata iti stuvantam naumi marutim || 17|| rakshasiveshtiteheyam taddrashtaham nripatmajau
    | namami sukritam me'tityashvastam naumi marutim || 18|| suptotthitam drishtapurvam ravanam pramada''vritam
    | sitopacchandakam drishtvavaplutam naumi marutim || 19|| ravanagamanodvignam vishannam vikshya maithilim
    | sarvopamadravyaduram sidantam naumi marutim || 20|| santvenanupradanena shauryena janakatmajam |
    raksho'dhipe lobhayati vrikshastham naumi marutim || 21|| mam pradhrishya satim nashyeriti taddhitavadinim
    | karunam rupinim sitam pashyantam naumi marutim || 22|| masadvayavadhim kritva smarayitva''tmapaurusham
    | apayatam ravanam dhikvurvantam naumi marutim || 23|| kulam viryam prema gatyantarabhavam vivrinvatih
    | rakshasirdurmukhimukhyah jighatsum naumi marutim || 24|| kruddhabhirbhartsyamanam tamatmanamanushocatim
    | devim vilokya rudatim khidyantam naumi marutim || 25|| punarnirbhatsanaparasvasu venisprigangulim
    | manushyagarhinim devim pashyantam naumi marutim || 26|| vilapantim janasthanaharanadyanucintanaih
    | pranatyagaparam sitam drishtva''rtam naumi marutim || 27|| trijatasvapanasamhrishtam rakshahstribhyo'bhayapradam
    | asvasthahridayam devim pashyantam naumi marutim || 28|| aciradatmaniryatamadrishtvodbandhanodyatam
    | sitam drishtva shimshapadha udvignam naumi marutim || 29|| vamakshyurubhujaspandairnimittairmuditam
    shanaih | sitam shantajvaram drishtva prahrishtam naumi marutim || 30|| drishtatreyam katham santvyopeya''vedya
    na vedmyaham | iti ramakathakhyanapravrittam naumi marutim || 31|| supte rakshigane shrutva shubham
    ramakatham drumam | utpashyantim janakajam pashyantam naumi marutim || 32|| svapne kapirdurnimittam
  devanagari: ृङ्गवृक्षाग्रप्राकारादिष्ववस्थितम् । दुर्गरक्षेक्षणोद्विग्नचेतसं नौमि मारुतिम् ॥ ३॥ लङ्कयाऽधृष्यवाममुष्टिघातावघूर्णया
    । उक्त्वाऽऽयतिमनुज्ञातं सोत्साहं नौमि मारुतिम् ॥ ४॥ विविधैर्भवनैर्दीप्तां पुरीं राक्षससङ्कुलाम् ।
    पश्यन्तं राक्षसेन्द्रान्तःपुरगं नौमि मारुतिम् ॥ ५॥ ज्यौत्स्न्यां निश्यतिरम्येषु हर्म्येषु जनकात्मजाम्
    । मार्गमाणमदृष्ट्वा तां विषण्णं नौमि मारुतिम् ॥ कुम्भकर्णादिरक्षोऽग्य्रप्रासादावृतमुत्तमम् । सुगुप्तं
    रावणगृहं विशन्तं नौमि मारुतिम् ॥ ७॥ पुष्पकाख्यं राजगृहं भूस्वर्गं विस्मयावहम् । दृष्ट्वाप्यदृष्ट्वा
    वैदेहीं दुःखितं नौमि मारुतिम् ॥ ८॥ रत्नोज्ज्वलं विश्वकर्मनिर्मितं कामगं शुभम् । पश्यन्तं पुष्पकं स्फारनयनं
    नौमि मारुतिम् ॥ ९॥ सङ्कुलान्तःपुरं सुप्तनानायौवतमच्छलम् । दृष्ट्वाप्यविकृतं सीतां दिदृक्षुं नौमि मारुतिम्
    ॥ १०॥ पीवानं रावणं सुप्तं तत्पत्नीं शयनेऽन्यतः । दृष्ट्वा सीतेति संहृष्टं चपलं नौमि मारुतिम् ॥ ११॥
    सुप्तस्त्रीदृष्टिनष्टात्मब्रह्मचर्यविशङ्किनम् । अपक्रम्याऽऽपानभूमिं गच्छन्तं नौमि मारुतिम् ॥ १२॥ कालात्ययनृपक्रोधकार्यासिद्धिविशङ्कितम्
    । निर्विण्णमप्यनिर्वेदे दृष्टार्थं नौमि मारुतिम् ॥ १३॥ पुनर्निवृत्तौ कापेयमानुषापायशङ्किनम् । रामादीन्
    सिद्धये नत्वोत्तिष्ठन्तं नौमि मारुतिम् ॥ १४॥ सीतामशोकवनिकानद्यां स्नानार्थमेष्यतीम् । द्रष्टुं पुष्पितवृक्षाग्रनिलीनं
    नौमि मारुतिम् ॥ १५॥ सीतां दृष्ट्वा शिंशपाधःस्थितां चारित्रमातृकाम् । मनसा राममासाद्य निवृत्तं नौमि
    मारुतिम् ॥ १६॥ इह सीता ततो रामः ईदृशीयं स तादृशः । अन्योन्यमर्हत इति स्तुवन्तं नौमि मारुतिम् ॥ १७॥
    राक्षसीवेष्टितेहेयं तद्द्रष्टाहं नृपात्मजौ । नमामि सुकृतं मेऽतीत्याश्वस्तं नौमि मारुतिम् ॥ १८॥ सुप्तोत्थितं
    दृष्टपूर्वं रावणं प्रमदाऽऽवृतम् । सीतोपच्छन्दकं दृष्ट्वावप्लुतं नौमि मारुतिम् ॥ १९॥ रावणागमनोद्विग्नां
    विषण्णां वीक्ष्य मैथिलीम् । सर्वोपमाद्रव्यदूरां सीदन्तं नौमि मारुतिम् ॥ २०॥ सान्त्वेनानुप्रदानेन शौर्येण
    जनकात्मजाम् । रक्षोऽधिपे लोभयति वृक्षस्थं नौमि मारुतिम् ॥ २१॥ मां प्रधृष्य सतीं नश्येरिति तद्धितवादिनीम्
    । करुणां रूपिणीं सीतां पश्यन्तं नौमि मारुतिम् ॥ २२॥ मासद्वयावधिं कृत्वा स्मारयित्वाऽऽत्मपौरुषम् ।
    अपयातं रावणं धिक्वुर्वन्तं नौमि मारुतिम् ॥ २३॥ कुलं वीर्यं प्रेम गत्यन्तराभावं विवृण्वतीः । राक्षसीर्दुर्मुखीमुख्याः
    जिघत्सुं नौमि मारुतिम् ॥ २४॥ क्रुद्धाभिर्भर्त्स्यमानां तामात्मानमनुशोचतीम् । देवीं विलोक्य रुदतीं
    खिद्यन्तं नौमि मारुतिम् ॥ २५॥ पुनर्निर्भत्सनपरास्वासु वेणीस्पृगङ्गुलिम् । मानुष्यगर्हिणीं देवीं पश्यन्तं
    नौमि मारुतिम् ॥ २६॥ विलपन्तीं जनस्थानाहरणाद्यनुचिन्तनैः । प्राणत्यागपरां सीतां दृष्ट्वाऽऽर्तं नौमि
    मारुतिम् ॥ २७॥ त्रिजटास्वपनसंहृष्टां रक्षःस्त्रीभ्योऽभयप्रदाम् । अस्वस्थहृदयां देवीं पश्यन्तं नौमि
    मारुतिम् ॥ २८॥ अचिरादात्मनिर्यातमदृष्ट्वोद्बन्धनोद्यताम् । सीतां दृष्ट्वा शिंशपाध उद्विग्नं नौमि मारुतिम्
    ॥ २९॥ वामाक्ष्यूरुभुजस्पन्दैर्निमित्तैर्मुदितां शनैः । सीतां शान्तज्वरां दृष्ट्वा प्रहृष्टं नौमि मारुतिम्
    ॥ ३०॥ दृष्टात्रेयं कथं सान्त्व्योपेयाऽऽवेद्या न वेद्म्यहम् । इति रामकथाख्यानप्रवृत्तं नौमि मारुतिम्
    ॥ ३१॥ सुप्ते रक्षिगणे श्रुत्वा शुभां रामकथां द्रुमम् । उत्पश्यन्तीं जनकजां पश्यन्तं नौमि मारुतिम्
    ॥ ३२॥ स्वप्ने कपिर्दुर्निमित्तं
