id: sadashivakavacam
category: kavacha
name:
  english: sadashivakavacam
  devanagari: सदाशिवकवचम्
content:
  english: 111|| iti shrirudrayamale uttaratantre mahatantroddipane siddhamantraprakarane shatcakraprakashe
    bhairavibhairavasamvade sadashivakavacapatho nama catuhsaptatitamah patalah || 74||
  devanagari: १११॥ इति श्रीरुद्रयामले उत्तरतन्त्रे महातन्त्रोद्दीपने सिद्धमन्त्रप्रकरणे षट्चक्रप्रकाशे
    भैरवीभैरवसंवादे सदाशिवकवचपाठो नाम चतुःसप्ततितमः पटलः ॥ ७४॥
meaning: {}
