id: narayaniyam-dashaka-13
category: stotram
name:
  english: Narayaniyam Dashaka 13
content:
  english: hiranyaksham tavadvarada bhavadanveshanaparam carantam samvarte payasi nijajanghaparimite |
    bhavadbhakto gatva kapatapatudhirnaradamunih shanairuce nandan danujamapi nindamstava balam || ||
    sa mayavi vishnurharati bhavadiyam vasumatim prabho kashtam kashtam kimidamiti tenabhigaditah | nadan
    kvasau kvasaviti sa munina darshitapatho bhavantam samprapaddharanidharamudyantamudakat || || aho
    aranyo'yam mriga iti hasantam bahutarai rduruktairvidhyantam ditisutamavajnaya bhagavan | mahim drishtva
    damshtrashirasi cakitam svena mahasa payodhavadhaya prasabhamudayunktha mridhavidhau || || gadapanau
    daitye tvamapi hi grihitonnatagado niyuddhena kridan ghataghataravodghushtaviyata | ranalokautsukyanmilati
    surasanghe drutamamum nirundhyah sandhyatah prathamamiti dhatra jagadishe || || gadonmarde tasmimstava
    khalu gadayam ditibhuvo gadaghatadbhumau jhatiti patitayamahaha bhoh | mridusmerasyastvam danujakulanirmulanacanam
    mahacakram smritva karabhuvi dadhano rurucishe || || tatah shulam kalapratimarushi daitye visrijati
    tvayi chindatyenat karakalitacakrapraharanat | samarushto mushtya sa khalu vitudamstvam samatanot
    galanmaye mayastvayi kila jaganmohanakarih || || bhavaccakrajyotishkanalavanipatena vidhute tato mayacakre
    vitataghanaroshandhamanasam | garishthabhirmushtiprahritibhirabhighnantamasuram svapadangushthena
    shravanapadamule niravadhih || || mahakayah so'yam tava caranapatapramathito galadrakto vaktradapatadrishibhih
    shlaghitahatih | tada tvamuddamapramadabharavidyotihridaya munindrah sandrabhih stutibhiranuvannadhvaratanum
    || || tvaci chando romasvapi kushaganashcakshushi ghritam caturhotaro'nghrau srugapi vadane codara
    ida | graha jihvayam te parapurusha karne ca camasa vibho somo viryam varada galadeshe'pyupasadah
    || || munindrairityadistavanamukharairmoditamana mahiyasya murtya vimalatarakirtya ca vilasan | svadhishnyam
    sampraptah sukharasavihari madhuripo nirundhya rogam me sakalamapi vatalayapate ||
  devanagari: हिरण्याक्षं तावद्वरद भवदन्वेषणपरं चरन्तं सांवर्ते पयसि निजजङ्घापरिमिते । भवद्भक्तो गत्वा
    कपटपटुधीर्नारदमुनिः शनैरूचे नन्दन् दनुजमपि निन्दंस्तव बलम् ॥ ॥ स मायावी विष्णुर्हरति भवदीयां वसुमतीं
    प्रभो कष्टं कष्टं किमिदमिति तेनाभिगदितः । नदन् क्वासौ क्वासविति स मुनिना दर्शितपथो भवन्तं सम्प्रापद्धरणिधरमुद्यन्तमुदकात्
    ॥ ॥ अहो आरण्योऽयं मृग इति हसन्तं बहुतरै र्दुरुक्तैर्विध्यन्तं दितिसुतमवज्ञाय भगवन् । महीं दृष्ट्वा
    दंष्ट्राशिरसि चकितां स्वेन महसा पयोधावाधाय प्रसभमुदयुङ्क्था मृधविधौ ॥ ॥ गदापाणौ दैत्ये त्वमपि हि गृहीतोन्नतगदो
    नियुद्धेन क्रीडन् घटघटरवोद्घुष्टवियता । रणालोकौत्सुक्यान्मिलति सुरसङ्घे द्रुतममुं निरुन्ध्याः सन्ध्यातः
    प्रथममिति धात्रा जगदिषे ॥ ॥ गदोन्मर्दे तस्मिंस्तव खलु गदायां दितिभुवो गदाघाताद्भूमौ झटिति पतितायामहह
    भोः । मृदुस्मेरास्यस्त्वं दनुजकुलनिर्मूलनचणं महाचक्रं स्मृत्वा करभुवि दधानो रुरुचिषे ॥ ॥ ततः शूलं
    कालप्रतिमरुषि दैत्ये विसृजति त्वयि छिन्दत्येनत् करकलितचक्रप्रहरणात् । समारुष्टो मुष्ट्या स खलु वितुदंस्त्वां
    समतनोत् गलन्माये मायास्त्वयि किल जगन्मोहनकरीः ॥ ॥ भवच्चक्रज्योतिष्कणलवनिपातेन विधुते ततो मायाचक्रे
    विततघनरोषान्धमनसम् । गरिष्ठाभिर्मुष्टिप्रहृतिभिरभिघ्नन्तमसुरं स्वपादाङ्गुष्ठेन श्रवणपदमूले निरवधीः
    ॥ ॥ महाकायः सोऽयं तव चरणपातप्रमथितो गलद्रक्तो वक्त्रादपतदृषिभिः श्लाघितहतिः । तदा त्वामुद्दामप्रमदभरविद्योतिहृदया
    मुनीन्द्राः सान्द्राभिः स्तुतिभिरनुवन्नध्वरतनुम् ॥ ॥ त्वचि छन्दो रोमस्वपि कुशगणश्चक्षुषि घृतं चतुर्होतारोऽङ्घ्रौ
    स्रुगपि वदने चोदर इडा । ग्रहा जिह्वायां ते परपुरुष कर्णे च चमसा विभो सोमो वीर्यं वरद गलदेशेऽप्युपसदः
    ॥ ॥ मुनीन्द्रैरित्यादिस्तवनमुखरैर्मोदितमना महीयस्या मूर्त्या विमलतरकीर्त्या च विलसन् । स्वधिष्ण्यं
    सम्प्राप्तः सुखरसविहारी मधुरिपो निरुन्ध्या रोगं मे सकलमपि वातालयपते ॥
