id: navaratnaniekashloki
category: ekashloki
name:
  english: navaratnaniekashloki
  devanagari: नवरत्नानिएकश्लोकी
content:
  english: dhanvantari kshapanakamarasimha shanku vetalabhatta ghatakarpara kalidasah | khyato varahamihiro
    nripateh sabhayam ratnani vai vararucirnava vikramasya || iti navartnani ekashloki samapta ||
  devanagari: धन्वन्तरि क्षपणकामरसिंह शङ्कु वेतालभट्ट घटकर्पर कालिदासाः । ख्यातो वराहमिहिरो नृपतेः सभायां
    रत्नानि वै वररुचिर्नव विक्रमस्य ॥ इति नवर्त्नानि एकश्लोकी समाप्ता ॥
meaning: {}
