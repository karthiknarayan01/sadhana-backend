id: narayaniyam-dashaka-69
category: stotram
name:
  english: Narayaniyam Dashaka 69
content:
  english: keshapashadhritapinchikavitatisancalanmakarakundalam harajalavanamalikalalitamangaragaghanasaurabham
    | pitaceladhritakancikancitamudancadamshumaninupuram rasakeliparibhushitam tava hi rupamisha kalayamahe
    || || tavadeva kritamandane kalitakanculikakucamandale gandalolamanikundale yuvatimandale'tha parimandale
    | antara sakalasundariyugalamindiraramana sancaran manjulam tadanu rasakelimayi kanjanabha samupadadhah
    || || vasudeva tava bhasamanamiha rasakelirasasaurabham durato'pi khalu naradagaditamakalayya kutukakula
    | veshabhushanavilasapeshalavilasinishatasamavrita nakato yugapadagata viyati vegato'tha suramandali
    || || venunadakritatanadanakalaganaragagatiyojana lobhaniyamridupadapatakritatalamelanamanoharam |
    panisankvanitakankanam ca muhuramsalambitakarambujam shronibimbacaladambaram bhajata rasakelirasadambaram
    || || spardhaya viracitanuganakritatarataramadhurasvare nartane'tha lalitangaharalulitangaharamanibhushane
    | sammadena kritapushpavarshamalamunmishaddivishadam kulam cinmaye tvayi niliyamanamiva sammumoha
    savadhukulam || || svinnasannatanuvallari tadanu kapi nama pashupangana kantamamsamavalambate sma
    tava tantibharamukulekshana || kacidacalitakuntala navapatirasaraghanasaurabham vancanena tava sancucumba
    bhujamancitorupulakankura || || kapi gandabhuvi sannidhaya nijagandamakulitakundalam punyapuranidhiranvavapa
    tava pugacarvitarasamritam | indiravihritimandiram bhuvanasundaram hi natanantare tvamavapya dadhuranganah
    kimu na sammadonmadadashantaram || || ganamisha viratam kramena kila vadyamelanamuparatam brahmasammadarasakulah
    sadasi kevalam nanrituranganah | navidannapi ca nivikam kimapi kuntalimapi ca kanculim jyotishamapi
    kadambakam divi vilambitam kimaparam bruve || || modasimni bhuvanam vilapya vihritim samapya ca tato
    vibho kelisammriditanirmalanganavagharmaleshasubhagatmanam | manmathasahanacetasam pashupayoshitam
    sukritacodita stavadakalitamurtiradadhitha maraviraparamotsavan || || kelibhedaparilolitabhiratilalitabhirabalalibhih
    svairamisha nanu surajapayasi carunama vihritim vyadhah | kanane'pi ca visarishitalakishoramarutamanohare
    sunasaurabhamaye vilesitha vilasinishatavimohanam || || kaminiriti hi yaminishu khalu kamaniyakanidhe
    bhavan purnasammadarasarnavam kamapi yogigamyamanubhavayan | brahmashankaramukhanapiha pashupanganasu
    bahumanayan bhaktalokagamaniyarupa kamaniya krishna paripahi mam ||
  devanagari: केशपाशधृतपिञ्छिकाविततिसञ्चलन्मकरकुण्डलं हारजालवनमालिकाललितमङ्गरागघनसौरभम् । पीतचेलधृतकाञ्चिकाञ्चितमुदञ्चदंशुमणिनूपुरं
    रासकेलिपरिभूषितं तव हि रूपमीश कलयामहे ॥ ॥ तावदेव कृतमण्डने कलितकञ्चुलीककुचमण्डले गण्डलोलमणिकुण्डले
    युवतिमण्डलेऽथ परिमण्डले । अन्तरा सकलसुन्दरीयुगलमिन्दिरारमण सञ्चरन् मञ्जुलां तदनु रासकेलिमयि कञ्जनाभ
    समुपादधाः ॥ ॥ वासुदेव तव भासमानमिह रासकेलिरससौरभं दूरतोऽपि खलु नारदागदितमाकलय्य कुतुकाकुला । वेषभूषणविलासपेशलविलासिनीशतसमावृता
    नाकतो युगपदागता वियति वेगतोऽथ सुरमण्डली ॥ ॥ वेणुनादकृततानदानकलगानरागगतियोजना लोभनीयमृदुपादपातकृततालमेलनमनोहरम्
    । पाणिसङ्क्वणितकङ्कणं च मुहुरंसलम्बितकराम्बुजं श्रोणिबिम्बचलदम्बरं भजत रासकेलिरसडम्बरम् ॥ ॥ स्पर्धया
    विरचितानुगानकृततारतारमधुरस्वरे नर्तनेऽथ ललिताङ्गहारलुलिताङ्गहारमणिभूषणे । सम्मदेन कृतपुष्पवर्षमलमुन्मिषद्दिविषदां
    कुलं चिन्मये त्वयि निलीयमानमिव सम्मुमोह सवधूकुलम् ॥ ॥ स्विन्नसन्नतनुवल्लरी तदनु कापि नाम पशुपाङ्गना
    कान्तमंसमवलम्बते स्म तव तान्तिभारमुकुलेक्षणा ॥ काचिदाचलितकुन्तला नवपटीरसारघनसौरभं वञ्चनेन तव सञ्चुचुम्ब
    भुजमञ्चितोरुपुलकाङ्कुरा ॥ ॥ कापि गण्डभुवि सन्निधाय निजगण्डमाकुलितकुण्डलं पुण्यपूरनिधिरन्ववाप तव पूगचर्वितरसामृतम्
    । इन्दिराविहृतिमन्दिरं भुवनसुन्दरं हि नटनान्तरे त्वामवाप्य दधुरङ्गनाः किमु न सम्मदोन्मददशान्तरम् ॥
    ॥ गानमीश विरतं क्रमेण किल वाद्यमेलनमुपारतं ब्रह्मसम्मदरसाकुलाः सदसि केवलं ननृतुरङ्गनाः । नाविदन्नपि
    च नीविकां किमपि कुन्तलीमपि च कञ्चुलीं ज्योतिषामपि कदम्बकं दिवि विलम्बितं किमपरं ब्रुवे ॥ ॥ मोदसीम्नि
    भुवनं विलाप्य विहृतिं समाप्य च ततो विभो केलिसम्मृदितनिर्मलाङ्गनवघर्मलेशसुभगात्मनाम् । मन्मथासहनचेतसां
    पशुपयोषितां सुकृतचोदित स्तावदाकलितमूर्तिरादधिथ मारवीरपरमोत्सवान् ॥ ॥ केलिभेदपरिलोलिताभिरतिलालिताभिरबलालिभिः
    स्वैरमीश ननु सूरजापयसि चारुनाम विहृतिं व्यधाः । काननेऽपि च विसारिशीतलकिशोरमारुतमनोहरे सूनसौरभमये विलेसिथ
    विलासिनीशतविमोहनम् ॥ ॥ कामिनीरिति हि यामिनीषु खलु कामनीयकनिधे भवान् पूर्णसम्मदरसार्णवं कमपि योगिगम्यमनुभावयन्
    । ब्रह्मशङ्करमुखानपीह पशुपाङ्गनासु बहुमानयन् भक्तलोकगमनीयरूप कमनीय कृष्ण परिपाहि माम् ॥
