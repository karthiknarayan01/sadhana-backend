id: sri-venkateswara-vijayarya-sapta-vibhakti-stotram
category: stotram
name:
  english: Sri Venkateswara Vijayarya Sapta Vibhakti Stotram
content:
  english: shrivenkatadridhama bhuma bhumapriyah kripasima | niravadhikanityamahima bhavatu jayi pranatadarshitaprema
    || || jaya janata vimalikritisaphalikritasakalamangalakara | vijayi bhava vijayi bhava vijayi bhava
    venkatacaladhisha || || kamaniyamandahasitam kancana kandarpakotilavanyam | pashyeyamanjanadrau pumsam
    purvatanapunyaparipakam || || maratakamecakarucina madanajnagandhimadhyahridayena | vrishashailamaulisuhrida
    mahasa kenapi vasitam jneyam || || patyai namo vrishadreh karayugaparikarmashankhacakraya | itarakarakamalayugalidarshita
    || samrajyapishunamakutisughatalalatat sumangala pangat | smitaruciphullakapoladaparo na paro'sti
    venkatadrishat || || sarvabharanavibhushitadivyavayavasya venkatadripateh | pallavapushpavibhushitakalpataroshcapi
    ka bhida drishta || || lakshmilalitapadambujalaksharasaranjitayatoraske | shrivenkatadrinathe nathe
    mama nityamarpito bharah || || aryavrittasameta saptavibhaktirvrishadrinathasya | vadindrabhikridakhyairaryai
    racita jayatviyam satatam || || iti shrivenkateshavijayaryasaptavibhakti stotram sampurnam |
  devanagari: श्रीवेङ्कटाद्रिधामा भूमा भूमाप्रियः कृपासीमा । निरवधिकनित्यमहिमा भवतु जयी प्रणतदर्शितप्रेमा
    ॥ ॥ जय जनता विमलीकृतिसफलीकृतसकलमङ्गलाकार । विजयी भव विजयी भव विजयी भव वेङ्कटाचलाधीश ॥ ॥ कमनीयमन्दहसितं
    कञ्चन कन्दर्पकोटिलावण्यम् । पश्येयमञ्जनाद्रौ पुंसां पूर्वतनपुण्यपरिपाकम् ॥ ॥ मरतकमेचकरुचिना मदनाज्ञागन्धिमध्यहृदयेन
    । वृषशैलमौलिसुहृदा महसा केनापि वासितं ज्ञेयम् ॥ ॥ पत्यै नमो वृषाद्रेः करयुगपरिकर्मशङ्खचक्राय । इतरकरकमलयुगलीदर्शित
    ॥ साम्राज्यपिशुनमकुटीसुघटललाटात् सुमङ्गला पाङ्गात् । स्मितरुचिफुल्लकपोलादपरो न परोऽस्ति वेङ्कटाद्रीशात्
    ॥ ॥ सर्वाभरणविभूषितदिव्यावयवस्य वेङ्कटाद्रिपतेः । पल्लवपुष्पविभूषितकल्पतरोश्चापि का भिदा दृष्टा ॥
    ॥ लक्ष्मीललितपदाम्बुजलाक्षारसरञ्जितायतोरस्के । श्रीवेङ्कटाद्रिनाथे नाथे मम नित्यमर्पितो भारः ॥ ॥ आर्यावृत्तसमेता
    सप्तविभक्तिर्वृषाद्रिनाथस्य । वादीन्द्रभीकृदाख्यैरार्यै रचिता जयत्वियं सततम् ॥ ॥ इति श्रीवेङ्कटेशविजयार्यासप्तविभक्ति
    स्तोत्रं सम्पूर्णम् ।
