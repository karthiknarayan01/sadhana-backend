id: surya-kavacham
category: stotram
name:
  english: Surya Kavacham
  devanagari: सूर्यकवचम्
content:
  english: shrinushva munishardula suryasya kavacam shubham sharirarogyadam divyam sarvasaubhagyadayakam
    dedipyamanamukutam sphuranmakarakundalam dhyatva sahasrakiranam stotrametadudirayet shiro me bhaskarah
    patu lalatam me'mitadyutih netre dinamanih patu shravane vasareshvarah ghranam gharmaghrinih patu
    vadanam vedavahanah jihvam me manadah patu kantham me suravanditah skandhau prabhakarah patu vakshah
    patu janapriyah patu padau dvadashatma sarvangam sakaleshvarah suryarakshatmakam stotram likhitva
    bhurjapatrake dadhati yah kare tasya vashagah sarvasiddhayah susnato yo japet samyag yo'dhite svasthamanasah
    sa rogamukto dirghayuh sukham pushtim ca vindati yajnavalkyamuniviracitam shri suryakavacastotram
    sampurnam||
  devanagari: शृणुष्व मुनिशार्दूल सूर्यस्य कवचं शुभम् शरीरारोग्यदं दिव्यं सर्वसौभाग्यदायकम् देदीप्यमानमुकुटं
    स्फुरन्मकरकुण्डलम् ध्यात्वा सहस्रकिरणं स्तोत्रमेतदुदीरयेत् शिरो मे भास्करः पातु ललाटं मेऽमितद्युतिः
    नेत्रे दिनमणिः पातु श्रवणे वासरेश्वरः घ्राणं घर्मघृणिः पातु वदनं वेदवाहनः जिह्वां मे मानदः पातु कण्ठं
    मे सुरवन्दितः स्कन्धौ प्रभाकरः पातु वक्षः पातु जनप्रियः पातु पादौ द्वादशात्मा सर्वाङ्गं सकलेश्वरः
    सूर्यरक्षात्मकं स्तोत्रं लिखित्वा भूर्जपत्रके दधाति यः करे तस्य वशगाः सर्वसिद्धयः सुस्नातो यो जपेत्
    सम्यग् योऽधीते स्वस्थमानसः स रोगमुक्तो दीर्घायुः सुखं पुष्टिं च विन्दति याज्ञवल्क्यमुनिविरचितं श्री
    सूर्यकवचस्तोत्रं सम्पूर्णम्॥
