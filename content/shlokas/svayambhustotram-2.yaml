id: svayambhustotram-2
category: stotram
name:
  english: svayambhustotram 2
  devanagari: स्वयम्भूस्तोत्रम् २
content:
  english: svayambhustotram 2 jagatkrite svayambhuvamanadilinamavyayam | tanorvipajjaratmakritsvayambhuvam
    namamyaham || 1|| sahasrapatrapankajam lasatsukarnikodbhavam | samastakamanapradam svayambhuvam namamyaham
    || 2|| sahasrabhanuranjanam niyutacandranandanam | suradilokavandanam svayambhuvam namamyaham || 3||
    tvameva rajase gunairbhuvi sthito virajase | tridhatuka vibhavase svayambhuvam namamyaham || 4|| ayam
    ka ityayam hrida mimamsitum na shaktavan | praghasamatramikshitah svayambhuvam namamyaham || 5|| pathanti
    ye nara muda svayambhuvah stutim sada | trivargasiddhimapya te labhanti muktimeva tam || 6|| iti shribrihatsvayambhupuranoddhritam
    shikhinirmitam svayambhustotram sampurnam ||
  devanagari: स्वयम्भूस्तोत्रम् २ जगत्कृते स्वयम्भुवमनादिलीनमव्ययम् । तनोर्विपज्जरात्मकृत्स्वयम्भुवं नमाम्यहम्
    ॥ १॥ सहस्रपत्रपङ्कजं लसत्सुकर्णिकोद्भवम् । समस्तकामनाप्रदं स्वयम्भुवं नमाम्यहम् ॥ २॥ सहस्रभानुरञ्जनं
    नियुतचन्द्रनन्दनम् । सुरादिलोकवन्दनं स्वयम्भुवं नमाम्यहम् ॥ ३॥ त्वमेव राजसे गुणैर्भुवि स्थितो विराजसे
    । त्रिधातुक विभावसे स्वयम्भुवं नमाम्यहम् ॥ ४॥ अयं क इत्ययं हृदा मीमांसितुं न शक्तवान् । प्रघासमात्रमीक्षितः
    स्वयम्भुवं नमाम्यहम् ॥ ५॥ पठन्ति ये नरा मुदा स्वयम्भुवः स्तुतिं सदा । त्रिवर्गसिद्धिमाप्य ते लभन्ति
    मुक्तिमेव ताम् ॥ ६॥ इति श्रीबृहत्स्वयम्भूपुराणोद्धृतं शिखिनिर्मितं स्वयम्भूस्तोत्रं सम्पूर्णम् ॥
