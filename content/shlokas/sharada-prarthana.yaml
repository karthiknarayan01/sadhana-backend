id: sharada-prarthana
category: stotram
name:
  english: Sharada Prarthana
content:
  english: namaste sharade devi kashmirapuravasini tvamaham prarthaye nityam vidyadanam ca dehi me ||
    || ya shraddha dharana medha vagdevi vidhivallabha bhaktajihvagrasadana shamadigunadayini || || namami
    yaminim nathalekhalankritakuntalam bhavanim bhavasantapanirvapanasudhanadim || || bhadrakalyai namo
    nityam sarasvatyai namo namah vedavedangavedantavidyasthanebhya eva ca || || brahmasvarupa parama
    jyotirupa sanatani sarvavidyadhidevi ya tasyai vanyai namo namah || || yaya vina jagatsarvam shashvajjivanmritam
    bhavet jnanadhidevi ya tasyai sarasvatyai namo namah || || yaya vina jagatsarvam mukamunmattavatsada
    ya devi vagadhishthatri tasyai vanyai namo namah || || || iti shrimacchankaracaryaviracita sharada
    prarthana sampurnam ||
  devanagari: नमस्ते शारदे देवि काश्मीरपुरवासिनि त्वामहं प्रार्थये नित्यं विद्यादानं च देहि मे ॥ ॥ या
    श्रद्धा धारणा मेधा वाग्देवी विधिवल्लभा भक्तजिह्वाग्रसदना शमादिगुणदायिनी ॥ ॥ नमामि यामिनीं नाथलेखालङ्कृतकुन्तलाम्
    भवानीं भवसन्तापनिर्वापणसुधानदीम् ॥ ॥ भद्रकाल्यै नमो नित्यं सरस्वत्यै नमो नमः वेदवेदाङ्गवेदान्तविद्यास्थानेभ्य
    एव च ॥ ॥ ब्रह्मस्वरूपा परमा ज्योतिरूपा सनातनी सर्वविद्याधिदेवी या तस्यै वाण्यै नमो नमः ॥ ॥ यया विना
    जगत्सर्वं शश्वज्जीवन्मृतं भवेत् ज्ञानाधिदेवी या तस्यै सरस्वत्यै नमो नमः ॥ ॥ यया विना जगत्सर्वं मूकमुन्मत्तवत्सदा
    या देवी वागधिष्ठात्री तस्यै वाण्यै नमो नमः ॥ ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता शारदा प्रार्थन सम्पूर्णम्
    ॥
