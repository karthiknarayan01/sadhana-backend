id: sri-subrahmanya-mangalashtakam
category: stotram
name:
  english: Sri Subrahmanya Mangalashtakam
content:
  english: shivayostanujayastu shritamandarashakhine | shikhivaryaturangaya subrahmanyaya mangalam ||
    || bhaktabhishtapradayastu bhavarogavinashine | rajarajadivandyaya ranadhiraya mangalam || || shurapadmadidaiteyatamisrakulabhanave
    | tarakasurakalaya balakayastu mangalam || || vallivadanarajiva madhupaya mahatmane | ullasanmanikotirabhasurayastu
    mangalam || || kandarpakotilavanyanidhaye kamadayine | kulishayudhahastaya kumarayastu mangalam ||
    || muktaharalasatkantharajaye muktidayine | devasenasametaya daivatayastu mangalam || || kanakambarasamshobhikataye
    kaliharine | kamalapativandyaya kartikeyaya mangalam || || sharakananajataya shuraya shubhadayine
    | shitabhanusamasyaya sharanyayastu mangalam || || mangalashtakametadye mahasenasya manavah | pathanti
    pratyaham bhaktya prapnuyuste param shriyam || || iti shri subrahmanya mangalashtakam |
  devanagari: शिवयोस्तनुजायास्तु श्रितमन्दारशाखिने । शिखिवर्यतुरङ्गाय सुब्रह्मण्याय मङ्गलम् ॥ ॥ भक्ताभीष्टप्रदायास्तु
    भवरोगविनाशिने । राजराजादिवन्द्याय रणधीराय मङ्गलम् ॥ ॥ शूरपद्मादिदैतेयतमिस्रकुलभानवे । तारकासुरकालाय
    बालकायास्तु मङ्गलम् ॥ ॥ वल्लीवदनराजीव मधुपाय महात्मने । उल्लसन्मणिकोटीरभासुरायास्तु मङ्गलम् ॥ ॥ कन्दर्पकोटिलावण्यनिधये
    कामदायिने । कुलिशायुधहस्ताय कुमारायास्तु मङ्गलम् ॥ ॥ मुक्ताहारलसत्कण्ठराजये मुक्तिदायिने । देवसेनासमेताय
    दैवतायास्तु मङ्गलम् ॥ ॥ कनकाम्बरसंशोभिकटये कलिहारिणे । कमलापतिवन्द्याय कार्तिकेयाय मङ्गलम् ॥ ॥ शरकाननजाताय
    शूराय शुभदायिने । शीतभानुसमास्याय शरण्यायास्तु मङ्गलम् ॥ ॥ मङ्गलाष्टकमेतद्ये महासेनस्य मानवाः । पठन्ती
    प्रत्यहं भक्त्या प्राप्नुयुस्ते परां श्रियम् ॥ ॥ इति श्री सुब्रह्मण्य मङ्गलाष्टकम् ।
