id: namavalih-10
category: stotram
name:
  english: namavalih
  devanagari: नामावलिः
content:
  english: shadvaktram shikhivahanam trinayanam citrambaralankritam shaktim vajramasim trishulamabhayam
    khetam dhanushcakrakam | pasham kukkutamankusham ca varadam dorbhirdadhanam sada dhyayamipsitasiddhidam
    shivasutam skandam suraradhitam || subrahmanyam pranamyaham sarvajnam sarvagam sada | abhipsitartha
    siddhyartham pravakshyenamashodasham || om jnanashaktyatmane namah | skandaya | agnigarbhaya | bahuleyaya
    | gangeyaya | sharavanodbhavaya | kartikeyaya | kumaraya | shanmukhaya | tarakantakaya
  devanagari: षड्वक्त्रं शिखिवाहनं त्रिनयनं चित्राम्बरालङ्कृतं शक्तिं वज्रमसिं त्रिशूलमभयं खेटं धनुश्चक्रकम्
    । पाशं कुक्कुटमङ्कुशं च वरदं दोर्भिर्दधानं सदा ध्यायामीप्सितसिद्धिदं शिवसुतं स्कन्दं सुराराधितम् ॥
    सुब्रह्मण्यं प्रणाम्यहं सर्वज्ञं सर्वगं सदा । अभीप्सितार्थ सिद्ध्यर्थं प्रवक्ष्येनामषोडशम् ॥ ॐ ज्ञानशक्त्यात्मने
    नमः । स्कन्दाय । अग्निगर्भाय । बाहुलेयाय । गाङ्गेयाय । शरवणोद्भावाय । कार्तिकेयाय । कुमाराय । षण्मुखाय
    । तारकान्तकाय
meaning: {}
