id: annamayya-keerthanas-emani-pogadudume
category: stotram
name:
  english: Annamayya Keerthanas Emani Pogadudume
content:
  english: aditalam pallavi emani pògadudume yikaninu | amani sòbagula alamelmanga || caranam tèlikannula
    ni tetale kadave | vèlayaga vibhuniki vènnèlalu | pulakala mòlakala pòdulivi gadave | palumaru puvvula
    panupulu || emani pògadudume yikaninu | amani sòbagula alamelmanga || caranam tiyyapu nimovi tenèle
    kadave | viyyapu ramanuni vindulivi | muyyaka musina mòlaka navvu gadè | nèyyapu gappurapu nèri bagalu
    || emani pògadudume yikaninu | amani sòbagula alamelmanga || caranam kaivasamagu ni kaugile kadave
    | shri venkateshvaru siri nagaru | tavu kònna mi tamakamule kade | kavincina mi kalyanamulu || emani
    pògadudume yikaninu | amani sòbagula alamelmanga ||
  devanagari: आदितालं पल्लवि एमनि पॊगदुडुमे यिकनिनु । आमनि सॊबगुल अलमेल्मङ्ग ॥ चरणं तॆलिकन्नुल नी तेटले
    कदवे । वॆलयग विभुनिकि वॆन्नॆललु । पुलकल मॊलकल पॊदुलिवि गदवे । पलुमरु पुव्वुल पानुपुलु ॥ एमनि पॊगदुडुमे
    यिकनिनु । आमनि सॊबगुल अलमेल्मङ्ग ॥ चरणं तिय्यपु नीमोवि तेनॆले कदवे । विय्यपु रमणुनि विन्दुलिवि । मुय्यक
    मूसिन मॊलक नव्वु गदॆ । नॆय्यपु गप्पुरपु नॆरि बागालु ॥ एमनि पॊगदुडुमे यिकनिनु । आमनि सॊबगुल अलमेल्मङ्ग
    ॥ चरणं कैवसमगु नी कौगिले कदवे । श्री वेङ्कटेश्वरु सिरि नगरु । तावु कॊन्न मी तमकमुले कदे । काविञ्चिन
    मी कल्याणमुलु ॥ एमनि पॊगदुडुमे यिकनिनु । आमनि सॊबगुल अलमेल्मङ्ग ॥
