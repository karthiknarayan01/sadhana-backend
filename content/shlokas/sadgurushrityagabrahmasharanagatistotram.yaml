id: sadgurushrityagabrahmasharanagatistotram
category: stotram
name:
  english: sadgurushrityagabrahmasharanagatistotram
  devanagari: सद्गुरुश्रीत्यागब्रह्मशरणागतिस्तोत्रम्
content:
  english: sadgurushrityagabrahmasharanagatistotram om | shriramajayam | | om sadgurushrityagarajasvamine
    namo namah | atha sharanagatistotram | svararagasudharasapunyatano naratallajasatkritikaraguro | kavishaktisaraktisuyuktakrite
    gurudeva bhavaccaranam sharanam || 1|| svaradaivatanartanadivyadrisha sarigamapadhanijharasaraga |
    sakalarthasunamasukanjasara gurudeva bhavaccaranam sharanam || 2|| rishabhapriyamodananamanidhe rishipungava
    matpriyasattvaguro | ripusudanasudananadanidhe gurupungava saccaranam sharanam || 3|| gaganagamadeva
    suganapate gaganagamapunyasaritsukrite | girirajasutapravahanadaga gurudeva bhavaccaranam sharanam
    || 4|| mamakaranakaranakaraguro mama sushrutisadgatishikshaguro | mama doshanivaranarakshaguro mama
    deva bhavaccaranam sharanam || 5|| mama manasarajatapunyahima mama vakpravahanadagangasara | mama
    manasalinasunadaguro mama sarva bhavaccaranam sharanam || 6|| parapancanadodbhavanadanada pararamaparangavasangamaga
    | parasusvarapujitaramahare gurudeva bhavaccaranam sharanam || 7|| dhanadasharathinutiganasudhe dharanitanayapatiraganidhe
    | dharanitalasancaranadapate gurudeva bhavaccaranam sharanam || 8|| nishadapanayanadaragasare nirupayamadoddharanam
    tava kham | nigamagamashastrasukirtanadhe gurudeva bhavaccaranam sharanam || 9|| sagunarcitanirgunarupavida
    svarasagaraparaganadaruce | haribhaktiyutadbhutashaktidadha gurudeva bhavaccaranam sharanam || 10||
    haridasharathiratagasharadhe haridasasudasasubhavayuta | hariharanasattamakrityayuta gurudeva bhavaccaranam
    sharanam || 11|| hariramasuganasunadarasa harikrishnasunamasudhaplavana | harikeshavamadhavaganaghana
    gurudeva bhavaccaranam sharanam || 12|| suravandanasincanabhaktirasa suraramasunamasuganarasa | vararagalayajnasubhasharasa
    gurudeva bhavaccaranam sharanam || 13|| padashinjanajhankritinadayuta karatalalayalayalasyaguro |
    galalinasutumbaranadarata gurudeva bhavaccaranam sharanam || 14|| bhagavadgunaganasamadhilaya bhagadayakagayakabhaktinidhe
    | nidhitucchamatapriyaramanidhe gururaya bhavaccaranam sharanam || 15|| raghuramasaramaviramamate
    aviramaramaramaramamate | abhiramasunamasumantrajapa gurudeva bhavaccaranam sharanam || 16|| nararupasudarshitaramaghrine
    varaganasuvarshananadagire | paradarshanaharshayutaprabudha gurudeva bhavaccaranam sharanam || 17||
    bhavataranatarakamantraguro bhavabhavanabhavanagananidhe | bhavavaidyanivedyasudivyakrite gurudeva
    bhavaccaranam sharanam || 18|| svararagalayarcitamaramana vararagasudharasapanarata | pararamasunamasuganasukha
    gurudeva bhavaccaranam sharanam || 19|| raghupungavakirtanatungagire raghunathasunadasuvarganada |
    raghurajasukirtanarajavara gurudeva bhavaccaranam sharanam || 20|| mama jivanajivanajivanada varasatkritiviplavasantvaguro
    | vararagalayalayakirtanada gurudeva bhavaccaranam sharanam || 21|| varavagvacanarthasupushtinritisvarasaushtavabhaktiyutapravaha
    | raghunayakagayakadivyanada gurudeva bhavaccaranam sharanam || 22|| varavishnusupadavahanadavaksalasusvaranamasunandalaka
    | varavenibhagirathayatnaphalanadagangasugasara me sharanam || 23|| pariputasuvagabhishiktahare parimukasuvagabhishiktaguro
    | gurubhaktyupayuktyasahayanuta gurudeva bhavaccaranam sharanam || 24|| sharanagatananyagatipranaya
    svararagarahasyalayaharana | parimukasunadasuvagvarada gurudeva bhavaccaranam sharanam || 25|| hridayangamasatkrititattvasara
    hridayangamasattamasattvaguro | hridaye kamale nitaram bhavita gurudeva bhavaccaranam sharanam ||
    26|| hridayalayavigraharamanute hridayalayavigraharupanuta | hridayacalaghanshanagananada gurudeva
    bhavaccaranam sharanam || 27|| hridayalayavasasadanirata hridayalayavasanapushparasa | hridayalayasarcanapushpapada
    gurudeva bhavaccaranam sharanam || 28|| bhagabhavyasumangalanityavara bhavatarakanamasuganavara |
    cirajivaniramayadivyadrisha gurumangalasaccaranam sharanam || 29|| gurumangalasupradabhavyavara shubhamangalasatpradapujyapada
    | ciramangalakarakaganaguro tava mangalasaccaranam sharanam || 30|| om shubhamastu |
  devanagari: सद्गुरुश्रीत्यागब्रह्मशरणागतिस्तोत्रम् ॐ । श्रीरामजयम् । । ॐ सद्गुरुश्रीत्यागराजस्वामिने
    नमो नमः । अथ शरणागतिस्तोत्रम् । स्वररागसुधारसपुण्यतनो नरतल्लजसत्कृतिकारगुरो । कविशक्तिसरक्तिसुयुक्तकृते
    गुरुदेव भवच्चरणं शरणम् ॥ १॥ स्वरदैवतनर्तनदिव्यदृश सरिगामपधानिझरासरग । सकलार्थसुनामसुकञ्जसर गुरुदेव
    भवच्चरणं शरणम् ॥ २॥ ऋषभप्रियमोदननामनिधे ऋषिपुङ्गव मत्प्रियसत्त्वगुरो । रिपुसूदनसूदननादनिधे गुरुपुङ्गव
    सच्चरणं शरणम् ॥ ३॥ गगनागमदेव सुगानपते गगनागमपुण्यसरित्सुकृते । गिरिराजसुताप्रवहानदग गुरुदेव भवच्चरणं
    शरणम् ॥ ४॥ ममकारनकारनकारगुरो मम सुश्रुतिसद्गतिशिक्षगुरो । मम दोषनिवारणरक्षगुरो मम देव भवच्चरणं शरणम्
    ॥ ५॥ मम मानसराजतपुण्यहिम मम वाक्प्रवहानदगङ्गसर । मम मानसलीनसुनादगुरो मम सर्व भवच्चरणं शरणम् ॥ ६॥ परपञ्चनदोद्भवनादनद
    पररामपराङ्गवसङ्गमग । परसुस्वरपूजितरामहरे गुरुदेव भवच्चरणं शरणम् ॥ ७॥ धनदाशरथीनुतिगानसुधे धरणीतनयापतिरागनिधे
    । धरणीतलसञ्चरनादपते गुरुदेव भवच्चरणं शरणम् ॥ ८॥ निषदापनयानदरागसरे निरुपायमदोद्धरणं तव खम् । निगमागमशास्त्रसुकीर्तनधे
    गुरुदेव भवच्चरणं शरणम् ॥ ९॥ सगुणार्चितनिर्गुणरूपविद स्वरसागरपारगनादरुचे । हरिभक्तियुताद्भुतशक्तिदध
    गुरुदेव भवच्चरणं शरणम् ॥ १०॥ हरिदाशरथीरतगाशरधे हरिदाससुदाससुभावयुत । हरिहारणसत्तमकृत्ययुत गुरुदेव
    भवच्चरणं शरणम् ॥ ११॥ हरिरामसुगानसुनादरस हरिकृष्णसुनामसुधाप्लवन । हरिकेशवमाधवगानघन गुरुदेव भवच्चरणं
    शरणम् ॥ १२॥ सुरवन्दनसिञ्चनभक्तिरस सुररामसुनामसुगानरस । वररागलयज्ञसुभाषरस गुरुदेव भवच्चरणं शरणम् ॥
    १३॥ पदशिञ्जनझङ्कृतिनादयुत करताललयालयलास्यगुरो । गललीनसुतुम्बरनादरत गुरुदेव भवच्चरणं शरणम् ॥ १४॥ भगवद्गुणगानसमाधिलय
    भगदायकगायकभक्तिनिधे । निधितुच्छमतप्रियरामनिधे गुरुराय भवच्चरणं शरणम् ॥ १५॥ रघुरामसरामविराममते अविरामरमारमराममते
    । अभिरामसुनामसुमन्त्रजप गुरुदेव भवच्चरणं शरणम् ॥ १६॥ नररूपसुदर्शितरामघृणे वरगानसुवर्षणनादगिरे । परदर्शनहर्षयुतप्रबुध
    गुरुदेव भवच्चरणं शरणम् ॥ १७॥ भवतारणतारकमन्त्रगुरो भवभावनभावनगाननिधे । भववैद्यनिवेद्यसुदिव्यकृते गुरुदेव
    भवच्चरणं शरणम् ॥ १८॥ स्वररागलयार्चितमारमण वररागसुधारसपानरत । पररामसुनामसुगानसुख गुरुदेव भवच्चरणं शरणम्
    ॥ १९॥ रघुपुङ्गवकीर्तनतुङ्गगिरे रघुनाथसुनादसुवर्गनद । रघुराजसुकीर्तनराजवर गुरुदेव भवच्चरणं शरणम् ॥
    २०॥ मम जीवनजीवनजीवनद वरसत्कृतिविप्लवसान्त्वगुरो । वररागलयालयकीर्तनद गुरुदेव भवच्चरणं शरणम् ॥ २१॥ वरवाग्वचनार्थसुपुष्टिनृतिस्वरसौष्टवभक्तियुतप्रवह
    । रघुनायकगायकदिव्यनद गुरुदेव भवच्चरणं शरणम् ॥ २२॥ वरविष्णुसुपादवहानदवाक्सलसुस्वरनामसुनन्दलका । वरवेणिभगीरथयत्नफलानदगङ्गसुगासर
    मे शरणम् ॥ २३॥ परिपूतसुवागभिषिक्तहरे परिमूकसुवागभिषिक्तगुरो । गुरुभक्त्युपयुक्त्यसहायनुत गुरुदेव भवच्चरणं
    शरणम् ॥ २४॥ शरणागतनान्यगतिप्रणय स्वररागरहस्यलयाहरण । परिमूकसुनादसुवाग्वरद गुरुदेव भवच्चरणं शरणम् ॥
    २५॥ हृदयङ्गमसत्कृतितत्त्वसर हृदयङ्गमसत्तमसत्त्वगुरो । हृदये कमले नितरां भवित गुरुदेव भवच्चरणं शरणम्
    ॥ २६॥ हृदयालयविग्रहरामनुते हृदयालयविग्रहरूपनुत । हृदयाचलघाङ्षणगाननद गुरुदेव भवच्चरणं शरणम् ॥ २७॥ हृदयालयवाससदानिरत
    हृदयालयवासनपुष्परस । हृदयालयसार्चनपुष्पपद गुरुदेव भवच्चरणं शरणम् ॥ २८॥ भगभव्यसुमङ्गलनित्यवर भवतारकनामसुगानवर
    । चिरजीवनिरामयदिव्यदृश गुरुमङ्गलसच्चरणं शरणम् ॥ २९॥ गुरुमङ्गलसुप्रदभव्यवर शुभमङ्गलसत्प्रदपूज्यपद ।
    चिरमङ्गलकारकगानगुरो तव मङ्गलसच्चरणं शरणम् ॥ ३०॥ ॐ शुभमस्तु ।
