id: vallabheshahridayam
category: hridaya
name:
  english: vallabheshahridayam
  devanagari: वल्लभेशहृदयम्
content:
  english: rishyadikam mulamantravadeva parikirtitam || 1|| om vighneshah purvatah patu gananathastu dakshine
    | pashcime gajavaktrastu uttare vighnanashanah || 2|| agneyyam pitribhaktastu nairrityam skandapurvajah
    | vayavyamakhuvahastu ishanyam devapujitah || 3|| urdhvatah patu sumukho hyadharayam gajananah | evam
    dashadisho rakshet vikatah papanashanah || 4|| shikhayam kapilah patu murdhanyakasharupadhrik | kiritih
    patu nah phalam bhruvormadhye vinayakah || 5|| cakshushi me trinayanah shravanau gajakarnakah | kapolayormadanidhih
    karnamule madotkatah || 6|| sadanto dantamadhye'vyat vaktram patu haratmajah | cibuke nasike caiva
    patu mam pushkarekshanah || 7|| uttaroshthe jagadvyapi tvadharoshthe'mritapradah | jihvam vidyanidhih
    patu talunyapatsahayakah || 8|| kinnaraih pujitah kantham skandhau patu dishampatih | caturbhujo bhujau
    patu bahumule'marapriyah || 9|| amsayorambikasunurangulishca haripriyah | antram patu svatantro me
    manah prahladakarakah || 10|| prana'panau tatha vyanamudanam ca samanakam | yasho lakshmim ca kirtim
    ca patu nah kamalapatih || 11|| hridayam tu parambrahmasvarupo jagadipatih | stanau tu patu vishnurme
    stanamadhyam tu shankarah || 12|| udaram tundilah patu nabhim patu sunabhikah | katim patvamalo nityam
    patu madhyam tu pavanah || 13|| medhram patu mahayogi tatparshvam sarvarakshakah | guhyam guhagrajah
    patu anum patu jitendriyah || 14|| shuklam patu sushuklastu uru patu sukhapradah | janghadeshe hrasvajangho
    janumadhye jagadguruh || 15|| gulphau rakshakarah patu padau me nartanapriyah | sarvangam sarvasandhau
    ca patu devarimardanah || 16|| putramitrakalatradin patu pashankushadhipah | dhanadhanyapashumshcaiva
    griham kshetram nirantaram || 17|| patu vishvatmako devo varado bhaktavatsalah | rakshahinam tu yatsthanam
    kavacena vina kritam || 18|| tatsarvam rakshayeddevo margavasi jitendriyah | atavyam parvatagre va
    marge manavamanage || 19|| jalasthalagato va'pi patu mayapaharakah | sarvatra patu deveshah saptalokaikasankshitah
    || 20|| || phalashrutih || ya idam kavacam punyam pavitram papanashanam | pratahkale japenmartyah
    sada bhayavinashanam || 21|| kukshirogaprashamanam lutasphotanivaranam | mutrakricchraprashamanam
    bahumutranivaranam || 22|| balagrahadiroganannashanam sarvakamadam | yah patheddharayedva'pi karasthastasya
    siddhayah || 23|| yatra yatra gatashcashpi tatra tatra'rthasiddhidam || 24|| yashsha
  devanagari: ऋष्यादिकं मूलमन्त्रवदेव परिकीर्तितम् ॥ १॥ ॐ विघ्नेशः पूर्वतः पातु गणनाथस्तु दक्षिणे । पश्चिमे
    गजवक्त्रस्तु उत्तरे विघ्ननाशनः ॥ २॥ आग्नेय्यां पितृभक्तस्तु नैरृत्यां स्कन्दपूर्वजः । वायव्यामाखुवाहस्तु
    ईशान्यां देवपूजितः ॥ ३॥ ऊर्ध्वतः पातु सुमुखो ह्यधरायां गजाननः । एवं दशदिशो रक्षेत् विकटः पापनाशनः
    ॥ ४॥ शिखायां कपिलः पातु मूर्धन्याकाशरूपधृक् । किरीटिः पातु नः फालं भ्रुवोर्मध्ये विनायकः ॥ ५॥ चक्षुषी
    मे त्रिनयनः श्रवणौ गजकर्णकः । कपोलयोर्मदनिधिः कर्णमूले मदोत्कटः ॥ ६॥ सदन्तो दन्तमध्येऽव्यात् वक्त्रं
    पातु हरात्मजः । चिबुके नासिके चैव पातु मां पुष्करेक्षणः ॥ ७॥ उत्तरोष्ठे जगद्व्यापी त्वधरोष्ठेऽमृतप्रदः
    । जिह्वां विद्यानिधिः पातु तालुन्यापत्सहायकः ॥ ८॥ किन्नरैः पूजितः कण्ठं स्कन्धौ पातु दिशाम्पतिः ।
    चतुर्भुजो भुजौ पातु बाहुमूलेऽमरप्रियः ॥ ९॥ अंसयोरम्बिकासूनुरङ्गुलीश्च हरिप्रियः । आन्त्रं पातु स्वतन्त्रो
    मे मनः प्रह्लादकारकः ॥ १०॥ प्राणाऽपानौ तथा व्यानमुदानं च समानकम् । यशो लक्ष्मीं च कीर्तिं च पातु नः
    कमलापतिः ॥ ११॥ हृदयं तु परम्ब्रह्मस्वरूपो जगदिपतिः । स्तनौ तु पातु विष्णुर्मे स्तनमध्यं तु शाङ्करः
    ॥ १२॥ उदरं तुन्दिलः पातु नाभिं पातु सुनाभिकः । कटिं पात्वमलो नित्यं पातु मध्यं तु पावनः ॥ १३॥ मेढ्रं
    पातु महायोगी तत्पार्श्वं सर्वरक्षकः । गुह्यं गुहाग्रजः पातु अणुं पातु जितेन्द्रियः ॥ १४॥ शुक्लं पातु
    सुशुक्लस्तु ऊरू पातु सुखप्रदः । जङ्घदेशे ह्रस्वजङ्घो जानुमध्ये जगद्गुरुः ॥ १५॥ गुल्फौ रक्षाकरः पातु
    पादौ मे नर्तनप्रियः । सर्वाङ्गं सर्वसन्धौ च पातु देवारिमर्दनः ॥ १६॥ पुत्रमित्रकलत्रादीन् पातु पाशाङ्कुशाधिपः
    । धनधान्यपशूंश्चैव गृहं क्षेत्रं निरन्तरम् ॥ १७॥ पातु विश्वात्मको देवो वरदो भक्तवत्सलः । रक्षाहीनं
    तु यत्स्थानं कवचेन विना कृतम् ॥ १८॥ तत्सर्वं रक्षयेद्देवो मार्गवासी जितेन्द्रियः । अटव्यां पर्वताग्रे
    वा मार्गे मानावमानगे ॥ १९॥ जलस्थलगतो वाऽपि पातु मायापहारकः । सर्वत्र पातु देवेशः सप्तलोकैकसङ्क्षितः
    ॥ २०॥ ॥ फलश्रुतिः ॥ य इदं कवचं पुण्यं पवित्रं पापनाशनम् । प्रातःकाले जपेन्मर्त्यः सदा भयविनाशनम् ॥
    २१॥ कुक्षिरोगप्रशमनं लूतास्फोटनिवारणम् । मूत्रकृच्छ्रप्रशमनं बहुमूत्रनिवारणम् ॥ २२॥ बालग्रहादिरोगाणान्नाशनं
    सर्वकामदम् । यः पठेद्धारयेद्वाऽपि करस्थास्तस्य सिद्धयः ॥ २३॥ यत्र यत्र गतश्चाश्पी तत्र तत्राऽर्थसिद्धिदम्
    ॥ २४॥ यश्श
