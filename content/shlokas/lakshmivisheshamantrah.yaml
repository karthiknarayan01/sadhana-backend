id: lakshmivisheshamantrah
category: mantra
name:
  english: lakshmivisheshamantrah
  devanagari: लक्ष्मीविशेषमन्त्राः
content:
  english: viniyogaya namah sarvange karanyasah om shram angushthabhyam namah | om shrim tarjanibhyam
    namah | om shrum madhyamabhyam namah | om shraim anamikabhyam namah | om shraum kanishthikabhyam namah
    | om shrah karatalakaraprishthabhyamnamah | hridayadinyasah om shram jnanaya hridayaya namah | om
    shrim aishvaryaya shirase svaha | om shrum shaktyai shikhayai vashat | om shraim balaya kavacaya hum
    | om shraum tejase netrabhyam vaushat | om shrah viryaya astraya phat | om bhurbhuvassuvarom iti digbandhah
    || dhyanam vande padmakaram prasannavadanam saubhagyadam bhagyadam hastabhyamabhayapradam maniganairnanavidhairbhushitam
    | bhaktabhishtaphalapradam hariharabrahmadibhissevitam parshve pankajashankhapadmanidhibhiryuktam
    sada shaktibhih || mulamantrah
  devanagari: विनियोगाय नमः सर्वाङ्गे करन्यासः ॐ श्रां अङ्गुष्ठाभ्यां नमः । ॐ श्रीं तर्जनीभ्यां नमः ।
    ॐ श्रूं मध्यमाभ्यां नमः । ॐ श्रैं अनामिकाभ्यां नमः । ॐ श्रौं कनिष्ठिकाभ्यां नमः । ॐ श्रः करतलकरपृष्ठाभ्यांनमः
    । हृदयादिन्यासः ॐ श्रां ज्ञानाय हृदयाय नमः । ॐ श्रीं ऐश्वर्याय शिरसे स्वाहा । ॐ श्रूं शक्त्यै शिखायै
    वषट् । ॐ श्रैं बलाय कवचाय हुं । ॐ श्रौं तेजसे नेत्राभ्यां वौषट् । ॐ श्रः वीर्याय अस्त्राय फट् । ॐ
    भूर्भुवस्सुवरोम् इति दिग्बन्धः ॥ ध्यानम् वन्दे पद्मकरां प्रसन्नवदनां सौभाग्यदां भाग्यदां हस्ताभ्यामभयप्रदां
    मणिगणैर्नानाविधैर्भूषिताम् । भक्ताभीष्टफलप्रदां हरिहरब्रह्मादिभिस्सेवितां पार्श्वे पङ्कजशङ्खपद्मनिधिभिर्युक्तां
    सदा शक्तिभिः ॥ मूलमन्त्रः
