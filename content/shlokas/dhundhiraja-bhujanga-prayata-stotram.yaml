id: dhundhiraja-bhujanga-prayata-stotram
category: stotram
name:
  english: Dhundhiraja Bhujanga Prayata Stotram
content:
  english: umangodbhavam dantivaktram ganesham bhujakankanaih shobhinam dhumraketum | gale haramuktavalishobhitam
    tam namo jnanarupam ganesham namaste || || ganesham vadettam smaret sarvakarye smaran sanmukham jnanadam
    sarvasiddhim | manashcintitam karyameveshu siddhye nnamo buddhikantam ganesham namaste || || mahasundaram
    vaktracihnam viratam caturdhabhujam caikadantaikavarnam | idam devarupam ganam siddhinatham namo bhalacandram
    ganesham namaste || || sasindurasatkunkumaistulyavarnah stutairmodakaih priyate vighnarajah | mahasankatacchedakam
    dhumraketum namo gauriputram ganesham namaste || || yatha patakacchedakam vishnunama tatha dhyayatam
    shankaram papanashah | yatha pujite shanmukhe shokanasho namo vighnanasham ganesham namaste || ||
    sada sarvada dhyayatamekadantam susindurakam pujitam raktapushpaih | sada carcitam candanaih kunkumaktam
    namo jnanarupam ganesham namaste || || namo gaurikagarbhajapatya tubhyam namo jnanarupinnamah siddhikanta
    | namo dhyeyapujyaya he buddhinatha surastvam bhajante ganesham namaste || || bhujangaprayatam pathedyastu
    bhaktya prabhate japennityamekagracittah | kshayam yanti vighna dishah shobhayantam namo jnanarupam
    ganesham namaste || || iti shridhundhiraja bhujanga prayata stotram |
  devanagari: उमाङ्गोद्भवं दन्तिवक्त्रं गणेशं भुजाकङ्कणैः शोभिनं धूम्रकेतुम् । गले हारमुक्तावलीशोभितं
    तं नमो ज्ञानरूपं गणेशं नमस्ते ॥ ॥ गणेशं वदेत्तं स्मरेत् सर्वकार्ये स्मरन् सन्मुखं ज्ञानदं सर्वसिद्धिम्
    । मनश्चिन्तितं कार्यमेवेषु सिद्ध्ये न्नमो बुद्धिकान्तं गणेशं नमस्ते ॥ ॥ महासुन्दरं वक्त्रचिह्नं विराटं
    चतुर्धाभुजं चैकदन्तैकवर्णम् । इदं देवरूपं गणं सिद्धिनाथं नमो भालचन्द्रं गणेशं नमस्ते ॥ ॥ ससिन्दूरसत्कुङ्कुमैस्तुल्यवर्णः
    स्तुतैर्मोदकैः प्रीयते विघ्नराजः । महासङ्कटच्छेदकं धूम्रकेतुं नमो गौरिपुत्रं गणेशं नमस्ते ॥ ॥ यथा
    पातकच्छेदकं विष्णुनाम तथा ध्यायतां शङ्करं पापनाशः । यथा पूजिते षण्मुखे शोकनाशो नमो विघ्ननाशं गणेशं
    नमस्ते ॥ ॥ सदा सर्वदा ध्यायतामेकदन्तं सुसिन्दूरकं पूजितं रक्तपुष्पैः । सदा चर्चितं चन्दनैः कुङ्कुमाक्तं
    नमो ज्ञानरूपं गणेशं नमस्ते ॥ ॥ नमो गौरिकागर्भजापत्य तुभ्यं नमो ज्ञानरूपिन्नमः सिद्धिकान्त । नमो ध्येयपूज्याय
    हे बुद्धिनाथ सुरास्त्वां भजन्ते गणेशं नमस्ते ॥ ॥ भुजङ्गप्रयातं पठेद्यस्तु भक्त्या प्रभाते जपेन्नित्यमेकाग्रचित्तः
    । क्षयं यान्ति विघ्ना दिशः शोभयन्तं नमो ज्ञानरूपं गणेशं नमस्ते ॥ ॥ इति श्रीढुण्ढिराज भुजङ्ग प्रयात
    स्तोत्रम् ।
